  \n# 7.12 命令行参数与可变参数列表\n\n**概念**：当你从操作系统命令行调用 Java 程序时，可以指定传递给程序 `main` 方法的参数。此外，你还可以编写一个接受变数量参数的方法。当方法运行时，它可以确定传递给它的参数数量并据此采取行动。\n\
  \n# 命令行参数\n你在书中看到的每个程序以及你编写的每个程序都使用一个静态 `main` 方法，其头部如下：\n\n``` evenpublic static\
  \ void main(String[] args)\n```\n\n方法头部的括号内是名为 `args` 的参数的声明。该参数是一个数组名称。正如其声明所示，它用于引用\
  \ `String` 数组。传递到 `args` 参数的数组来自操作系统命令行。例如，查看代码列表 7-21。\n\n# 代码列表 7-21 `(CommandLine.java)`\n\
  ```\n 1  /**\n  2     此程序显示从操作系统命令行\n  3     传递给它的参数。\n  4  */\n  5 \n  6  public\
  \ class CommandLine\n  7  {\n  8     public static void main(String[] args)\n  9\
  \     {\n 10        for (int index = 0; index < args.length; index++)\n  11    \
  \       System.out.println(args[index]);\n  12     }\n  13  }\n```\n\n如果编译此程序并使用以下命令执行：\n\
  \n```\njava CommandLine How does this work?\n```\n\n它的输出将如下：\n\n```\nHow\ndoes\n\
  this\nwork?\n```\n\n在命令行上输入的、用空格分隔且在类名之后的任何项都被视为传递到 `main` 方法的一个或多个参数。在上一个例子中，有四个参数传递给\
  \ `args`。单词“How”传递给 `args[0]`，“does”传递给 `args[1]`，“this”传递给 `args[2]`，而“work?”传递给\
  \ `args[3]`。`main` 方法中的 `for` 循环简单地显示了每个参数。\n\n### 注意\n`main` 参数数组的名称不需要是 `args`。你可以将其命名为任何你喜欢的名称。然而，使用\
  \ `args` 是一个标准惯例。\n\n# 可变参数列表\nJava 提供了一种名为可变参数列表（variable-length argument lists）的机制，使得编写接受变数量参数的方法成为可能。换句话说，你可以编写一个在调用时接受任意数量参数的方法。当方法运行时，它可以确定传递给它的参数数量并据此采取行动。\n\
  \n例如，假设我们需要编写一个名为 `sum`，它可以接受任意数量的 `int` 值并返回这些值的和。我们可以如下调用该方法：\n\n```\nresult =\
  \ sum(10, 20);\n```\n\n在这里我们向方法传递了两个参数：10 和 20。在这段代码执行后，值 30 将存储在 `result` 变量中。但是，方法并不需要在每次调用时接受两个参数。我们可以使用不同数量的参数再次调用该方法，如下：\n\
  \n```\nint firstVal = 1, secondVal = 2, thirdVal = 3, fourthVal = 4;\n result =\
  \ sum(firstVal, secondVal, thirdVal, fourthVal);\n```\n\n在这里我们向方法传递了四个参数：`firstVal`（设置为\
  \ 1）、`secondVal`（设置为 2）、`thirdVal`（设置为 3）和 `fourthVal`（设置为 4）。在这段代码执行后，值 10 将存储在\
  \ `result` 变量中。以下是 `sum` 方法的代码：\n\n```\npublic static int sum(int... numbers)\n\
   {\n    int total = 0; // 累加器\n\n    // 相加 数组中所有的值。\n    for (int val : numbers)\n\
        total += val;\n\n    // 返回总和。\n    return total;\n }\n```\n\n注意方法头部 `numbers`\
  \ 参数的声明。数据类型后面的省略号（三个点）表示 `numbers` 是一种特殊的参数类型，被称为可变参数（vararg）。可变参数可以接受任意数量的参数。\n\
  \n事实上，可变参数实际上是数组。在 `sum` 方法中，`numbers` 参数是一个 `int` 数组。传递给 `sum` 方法的所有参数都存储在 `numbers`\
  \ 数组的元素中。从代码可以看出，方法使用增强型 `for` 循环遍历 `numbers` 数组的元素，累加存储在元素中的值。（本章源代码中的 *VarargsDemo1.java*\
  \ 程序演示了 `sum` 方法。）\n\n你还可以编写一个接受任意数量对象引用作为参数的方法。例如，代码列表 7-22 程序显示了一个接受变数量 `BankAccount`\
  \ 对象引用的方法。该方法返回对象 `balance` 字段的总和。在下面的动画中，按“上一个”或“下一个”按钮逐步执行代码并贯穿其解释。\n\n\n\n\n\n\
  # 代码列表 7-22 `(VarargsDemo2.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr7-22/22.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr7-22/22.html)\n\
  \n你可以编写一个方法来接受固定参数和变长参数列表的混合。例如，假设我们想编写一个名为 `courseAverage` 的方法，它接受一个 `String` 类型的课程名称，以及一个变长的\
  \ `double` 类型的测试成绩列表。我们可以如下所示编写方法头：\n\n```\npublic static void courseAverage(String\
  \ course, double... scores)\n```\n\n该方法有一个名为 `course` 的普通 `String` 参数，和一个名为 `scores`\
  \ 的变长参数（vararg）。当我们调用此方法时，我们总是传递一个 `String` 参数，然后是一个 `double` 值列表。（该方法在程序 `VarargsDemo3.java`\
  \ 中演示，该程序位于本章源代码文件夹中。）注意，当一个方法接受固定参数和变长参数列表混合时，变长参数必须是最后一个声明的。\n\n你也可以将数组传递给变长参数。这在程序\
