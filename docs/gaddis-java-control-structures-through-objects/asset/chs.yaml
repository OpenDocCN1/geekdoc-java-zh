  \n## 3.6 比较 String 对象\n\n概念：你不能使用关系运算符来比较 `String` 对象。相反，你必须使用 `String` 方法。\n\n\
  你在前面的节中已经看到了如何使用关系运算符来数值值。然而，你不应该使用关系运算符来比较 `String` 对象。记住，`String` 对象是由一个包含对象内存地址的变量引用的。当你对引用变量使用关系运算符时，运算符作用于变量所包含的内存地址，而不是\
  \ `String` 对象内部的内容。例如，假设程序有以下声明：\n\n```java\nString name1 = \"Mark\";\nString name2\
  \ = \"Mary\";\n```\n\n稍后，同一个程序有以下 `if` 语句：\n\n```java\nif (name1 == name2)\n```\n\
  \n表达式 `name1 == name2` 将为 `false`，但不是因为字符串“Mark”和“Mary”不同。该表达式为 `false` 是因为变量 `name1`\
  \ 和 `name2` 引用不同的对象。图 3-14 展示了变量是如何引用 `String` 对象的。\n\n# 图 3-14  `name1` 和 `name2`\
  \ 引用了不同的 `String` 对象\n\n![变量 name 1 和 name 2 引用不同的 String 对象。if 语句比较了这两个地址及其对象。](img/03fig14.png)图\
  \ 3-14 完整备用文本\n\n为了正确地比较两个 `String` 对象的内容，你应该使用 `String` 类的 `equals` 方法。该方法的通用形式如下：\n\
  \n```java\nStringReference1.equals(StringReference2)\n```\n\n`StringReference1`\
  \ 是引用 `String` 对象的变量，`StringReference2` 是另一个引用 `String` 对象的变量。如果两个字符串相等，该方法返回 `true`；如果不相等，则返回\
  \ `false`。这里是一个示例：\n\n```java\nif (name1.equals(name2))\n```\n\n假设 `name1` 和 `name2`\
  \ 引用 `String` 对象，那么 `if` 语句中的表达式在它们相同时返回 `true`，不相同时返回 `false`。程序代码列表 3-9 演示了这一点。\n\
  \n在下面的动画中，点击“上一个”或“下一个”按钮逐步查看代码并查看全程的解释。\n\n### 代码列表 3-9 `(StringCompare.java)`\n\
  \n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr3-9/9.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr3-9/9.html)\n\
  \n你也可以将 `String` 对象与字符串字面量进行比较。只需将字符串字面量作为参数传递给 `equals` 方法，如下：\n\n```java\nif (name1.equals(\"\
  Mark\"))\n```\n\n要判断两个字符串是否不等，只需对 `equals` 方法的结果应用 `!` 运算符。例如：\n\n```java\nif (!name1.equals(\"\
  Mark\"))\n```\n\n`boolean` 表达式执行的是不等操作。它判断 `name1` 引用的对象是否不等于“Mark”。\n\n`String`\
  \ 类还提供了 `compareTo` 方法，用于判断一个字符串是否大于、等于或小于另一个字符串。方法的通用形式如下：\n\n```java\nStringReference.compareTo(OtherString)\n\
  ```\n\n`StringReference` 是引用 `String` 对象的变量，`OtherString` 是另一个引用 `String` 对象的变量或字符串字面量。该方法返回一个整数，可以使用如下方式：\n\
  \n- 如果方法返回值为负，则 `StringReference`（调用的对象）小于 `OtherString` 参数。\n- 如果方法返回 0，则字符串相等。\n\
  - 如果方法返回值为正，则 `StringReference`（调用的对象）大于 `OtherString` 参数。\n\n让我们仔细观察这个程序。当你使用 `compareTo`\
  \ 方法比较两个字符串时，字符串是逐字符进行比较的。这通常被称为*字典序比较*。这在图 3-15 中所示。\n\n# 图 3-15 “Mary”和“Mark”的字符串比较\n\
  \n![对单词 Mary 和单词 Mark 进行字符串比较。](img/03fig15.png)\n\n比较过程如下：\n\n1. “Mary”中的“M”与“Mark”中的“M”比较。因为它们相同，所以比较下一个字符。\n\
  2. “Mary”中的“a”与“Mark”中的“a”比较。因为它们相同，所以比较下一个字符。\n3. “Mary”中的“r”与“Mark”中的“r”比较。因为它们相同，所以比较下一个字符。\n\
  4. “Mary”中的“y”与“Mark”中的“k”比较。因为它们不同，所以两个字符串不等。由于字符“y”大于“k”，因此判定“Mary”大于“Mark”。\n\
  \n\n\n\n\n`equals` 和 `compareTo` 方法执行的是区分大小写的比较，这意味着大写字母不被认为与其对应的小写字母相同。换句话说，“A”不等同于“a”。当你想要执行不区分大小写的比较时，这显然会引起问题。\n\
  \n`String` 类提供了 `equalsIgnoreCase` 和 `compareToIgnoreCase` 方法。这些方法的作用与 `equals`\
  \ 和 `compareTo` 方法类似，不同之处在于忽略了字符串中字符的大小写。例如，代码列表 3-11 中的程序要求用户输入秘密单词，这类似于密码。秘密单词是\
  \ `\"PROSPERO\"`，程序通过执行不区分大小写的字符串比较来判断用户是否输入了它。\n\n在下方的动画中，点击“上一个”或“下一个”按钮可以逐行通过代码并查看各处的解释。\n\
  \n### 代码列表 3-11 `(SecretWord.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr3-11/11.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr3-11/11.html)\n\
  \n`compareToIgnoreCase` 方法的工作原理与 `compareTo` 方法完全相同，区别在于忽略了所比较字符串中字符的大小写。\n\n# 检查点\
