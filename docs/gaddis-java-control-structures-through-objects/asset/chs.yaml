  \n# 复制数组\n\n由于数组是一个对象，因此数组与引用它的变量之间存在区别。数组和引用变量是两个独立的实体。当你想要将一个数组的内容复制到另一个数组时，记住这一点非常重要。你可能会忍不住写出类似下面的代码，认为你正在复制一个数组：\n\
  \n```java\nint[] array1 = { 2, 4, 6, 8, 10 };\nint[] array2 = array1;    // 这并没有复制\
  \ array1。\n```\n\n第一条语句创建了一个数组并将其地址赋值给 `array1` 变量。第二条语句将 `array1` 赋值给 `array2`。这并没有为\
  \ `array1` 引用的数组创建副本。相反，它复制了存储在 `array1` 中的地址，并将其存储在 `array2` 中。在该条语句执行后，`array1`\
  \ 和 `array2` 变量都将引用同一个数组。这种赋值操作被称为`引用复制`（reference copy）。被复制的只是数组对象的地址，而不是数组对象的内容。这在图\
  \ 7-9 中得到了说明。\n\n![array 1 和 array 2 都持有同一个 int 的地址，该地址引用同一个包含 5 个元素的 int 数组，每个数组分别包含\
  \ 2, 4, 6, 8 和 10。](img/07fig09.png)\n\n## 图 7-9 `array1` 和 `array2` 引用同一个数组\n\n\
