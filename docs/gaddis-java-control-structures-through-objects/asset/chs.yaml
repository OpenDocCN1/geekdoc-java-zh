  \n## 16.8 可滚动结果集\n\n概念：可滚动结果集允许游标进行随机移动。默认情况下，结果集不是可滚动的。\n\n\n\n\n\n默认情况下，`ResultSet`\
  \ 对象允许你仅向后移动游标。一旦游标过了某行，你就无法向后移动游标来再次读取该行。如果你需要在结果集中向后移动游标，可以创建一个*滚动结果集*（scrollable\
  \ result set）。你可以在使用 `Connection` 对象的重载版本 `createStatement` 方法创建 `Statement` 对象时执行此操作。该方法接受两个参数。第一个参数指定结果集的滚动类型。对于该参数可以使用以下常量中的任何一个：\n\
  \n```\nResultSet.TYPE_FORWARD_ONLY\n```\n\n这是默认的滚动类型。它指定结果集的游标只能向前移动。\n\n```\nResultSet.TYPE_SCROLL_INSENSITIVE\n\
  ```\n\n这指定结果集应该是可滚动的，允许游标在结果集中正向或向后移动。此外，此结果集对数据库所所的更改是不敏感的。这意味着如果另一个程序或进程对数据库进行了更改，这些更改将不会出现在此结果集中。\n\
  \n```\nResultSet.TYPE_SCROLL_SENSITIVE\n```\n\n这指定结果集应该是可滚动的，允许游标在结果集中正向或向后移动。此外，此结果集对数据库所做的更改是敏感的。这意味着如果另一个程序或进程对数据库进行了更改，这些更改一旦发生就会就会出现在此结果集中。\n\
  \n第二个参数指定结果集的并发级别。对于该参数可以使用以下常量中的任何一个：\n\n```\nResultSet.CONCUR_READ_ONLY\n```\n\
  \n这是默认的并发级别。它指定结果集包含来自数据库的只读版本数据。你不能通过修改结果集的内容来更改数据库的内容。\n\n```\nResultSet.CONCUR_UPDATEABLE\n\
  ```\n\n这指定结果集应该是可更新的。可以对结果集进行更改，然后将这些更改保存到数据库中。`ResultSet` 接口指定了几个可能用于更新结果集并将这些更新保存到数据库的方法。这些方法允许你在不颁发\
  \ SQL 语句的情况下更改数据库。有关这些这些方法的更多信息，请参阅 Java API 文档。\n\n假设 `conn` 引用一个 `Connection`\
  \ 对象，以下是方法调用示例：\n\n```\nStatement stmt =\n    conn.createStatement(ResultSet.TYPE_SCROLL_INSENSITIVE,\n\
  \                         ResultSet.CONCUR_READ_ONLY);\n```\n\n由此代码创建的 `Statement`\
  \ 对象将是可滚动的，对其他进程对数据库的更改不敏感，且不可更新的。\n\n# `ResultSet` 导航方法\n\n一旦你创建了可滚动结果集，就可以使用以下\
  \ `ResultSet` 方法来移动游标：\n\n| 方法 | 描述 |\n| --- | --- |\n| `first()` | 将游标移动到结果集的第一行。\
  \ |\n| `last()` | 将游标移动到结果集的最后一行。 |\n| `next()` | 将游标移动到结果集的下一行。 |\n| `previous()`\
  \ | 将游标移动到结果集的上一个行。 |\n| `relative(rows)` | 将游标相对于当前行向向前或向后移动参数 `rows` 指定的行数。例如，调用\
  \ `relative(2)` 将将游标从当前行向前移动 2 行，而 `relative(−1)` 将将游标从当前行向后移动 1 行。 |\n| `absolute(row)`\
  \ | 将游标移动到由整数 `row` 指定的行。记住，行号从 1 开始计数，因此调用 `absolute(1)` 将将游标移动到结果集的第一行。 |\n\n\
  ### 注意事项\n\n并不是所有的 JDBC 驱动都支持滚动结果集。如果你的驱动程序不支持滚动结果集，当你尝试使用不支持的导航方法时，它将抛出异常。\n\n\
  下面的代码显示了这些方法的一些简单而实用的用法：\n\n```\nresultSet.last();\t// 移动到最后一行\nint numRows = resultSet.getRow();\t\
  // 获取当前行号\nresultSet.first();\t// 移回第一行\n```\n\n这段代码在你需要在处理结果集中的任何数据之前确定结果集中的行数时非常有用。第一条语句将游标移动到最后一行。第二条语句调用\
  \ `ResultSet` 方法 `getRow`，它返回当前行的行号。第三条语句随后将游标移动到第一行以便后续处理。\n\n# 检查点 16.25\n\n../components/metrodigi/ch16-inline_self_quiz_v1.0.0-23/index.html\n\
