  \n# 12.4 显示图片\n\n概念：你同时使用 `Image` 和 `ImageView` 类来显示图片。\n\n\n\n\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/yNMrYa6KKI73I8E1Amp4U57CvAIzsyDe`](https://mediaplayer.pearsoncmg.com/assets/_video.true/yNMrYa6KKI73I8E1Amp4U57CvAIzsyDe)\n\
  \n在 JavaFX 中显示图像分两个步骤：首先，将图像加载到内存中；其次，显示图像。这需要 JavaFX 库中的两个类：`Image` 和 `ImageView`。这两个类都在\
  \ `javafx.scene.image` 包中\n\n`Image` 类可以从计算机的本地文件系统或 Internet 位置加载图像。该类支持 BMP、JPEG、GIF\
  \ 和 PNG 文件类型。要加载其中任何类型的图像，请创建 `Image`类的实例，并向构造函数传递指定文件名和位置的字符串参数。例如：\n\n```\nImage\
  \ image = new Image(\"file:HotAirBalloon.jpg\");\n```\n\n在这个示例中，传递给构造函数的字符串指定了一个名为\
  \ `HotAirBalloon.jpg` 的文件。字符串中读取为 `file:` 的部分是一个协议标识符，表示文件位于本地计算机上。由于没有给出路径，假设该文件与程序的可执行\
  \ `.class` 文件位于同一目录或或文件夹中。如果你想从不同的位置加载图像，可以指定路径。例如：\n\n```\nImage image = new Image(\"\
  file:C:\\\\Images\\\\HotAirBalloon.jpg\");\n```\n\n接下来，你创建一个 `ImageView` 类的实例，并将\
  \ `Image` 对象的引用作为参数传递给构造函数。例如：\n\n```\nImageView imageView = new ImageView(image);\n\
  ```\n\n一旦你创建了 `ImageView` 对象，就可以将其添加到布局容器中。代码列表 12-4 中的中的程序展示了一个示例。图 12-13 显示了程序的输出。\n\
  \n```\n 1  import javafx.application.Application;\n  2  import javafx.stage.Stage;\n\
    3  import javafx.scene.Scene;\n  4  import javafx.scene.layout.HBox;\n  5  import\
  \ javafx.scene.image.Image;\n  6  import javafx.scene.image.ImageView;\n  7\n  8\
  \  /**\n  9    An Image Demo\n  10  */\n  11\n  12  public class ImageDemo extends\
  \ Application\n  13  {\n  14     public static void main(String[] args)\n  15  \
  \   {\n  16        // Launch the application.\n  17        launch(args);\n  18 \
  \    }\n  19\n  20     @Override\n  21     public void start(Stage primaryStage)\n\
    22     {\n  23        // Create an Image object.\n  24        Image image = new\
  \ Image(\"file:HotAirBalloon.jpg\");\n  25\n  26        // Create an ImageView object.\n\
    27        ImageView imageView = new ImageView(image);\n  28\n  29        // Put\
  \ the ImageView in an HBox.\n  30        HBox hbox = new HBox(imageView);\n  31\n\
    32        // Create a Scene with the HBox as its root node.\n  33        Scene\
  \ scene = new Scene(hbox);\n  34\n  35        // Add the Scene to the Stage.\n \
  \ 36        primaryStage.setScene(scene);\n  37\n  38        // Set the stage title.\n\
    39        primaryStage.setTitle(\"Hot Air Balloon\");\n  40\n  41        // Show\
  \ the window.\n  42        primaryStage.show();\n  43     }\n  44  }\n```\n\n# 代码列表\
  \ 12-4 `(ImageDemo.java)`\n\n![Image Demo 程序的输出是一个标题为 Hot Air Balloon 的窗口中的热气球照片。](img/12fig13.png)\n\
  \n# 图 12-13 ImageDemo 程序\n\n让我们仔细查看一下代码：\n\n*   第 5 行和第 6 行从 `javafx.scene.image`\
  \ 包导入了 `Image` 类和 `ImageView` 类。\n*   第 24 行创建了一个 `Image` 对象，从本地文件系统加载 `HotAirBalloon.jpg`\
  \ 文件。\n*   第 27 行创建了一个 `ImageView` 对象，使用了第 24 行创建的 `Image` 对象。\n*   第 30 行创建了一个\
  \ `HBox`，并将 `ImageView` 对象添加到其中。\n*   第 33 行创建了一个以 `HBox` 为根节点的 `Scene` 对象。\n* \
  \  第 36 行将 `scene` 设置到 `stage`。\n*   第 39 行设置窗口标题栏中的文本。\n*   第 42 行显示窗口。\n\n图 12-14\
  \ 展示了代码列表 12-4 的场景图。\n\n![代码列表 12-4 中 Image Demo 程序的场景图由一个作为根节点的 box 通过一条线连接到位于右侧的\
  \ image view 叶子节点。](img/12fig14.png)\n\n# 从 Internet 位置加载图像\n\n`Image` 类可以从计算机的本地文件系统或\
  \ Internet 位置加载图像。该类支持 BMP、JPEG、GIF 和 PNG 文件类型。要加载其中任何类型的图像，请创建 `Image`类的实例，并向构造函数传递指定文件名和位置的字符串参数。例如：\n\
  \n```\nImage image = new Image(\"file:HotAirBalloon.jpg\");\n```\n\n在这个示例中，传递给构造函数的字符串指定了一个名为\
  \ `HotAirBalloon.jpg` 的文件。字符串中读取为 `file:` 的部分是一个协议标识符，表示文件位于本地计算机上。由于没有给出路径，假设该文件与程序的可执行\
  \ `.class` 文件位于同一目录或或文件夹中。如果你想从不同的位置加载图像，可以指定路径。例如：\n\n```\nImage image = new Image(\"\
  file:C:\\\\Images\\\\HotAirBalloon.jpg\");\n```\n\n接下来，你创建一个 `ImageView` 类的实例，并将\
  \ `Image` 对象的引用作为参数传递给构造函数。例如：\n\n```\nImageView imageView = new ImageView(image);\n\
  ```\n\n一旦你创建了 `ImageView` 对象，就可以将其添加到布局容器中。代码列表 12-4 中的程序展示了一个示例。图 12-13 显示了程序的输出。\n\
  \n# 设置 ImageView 的大小\n\n接下来，你创建一个 `ImageView` 类的实例，并将 `Image` 对象的引用作为参数传递给构造函数。例如：\n\
  \n```\nImageView imageView = new ImageView(image);\n```\n\n一旦你创建了 `ImageView` 对象，就可以将其添加到布局容器中。代码列表\
  \ 12-4 中的程序展示了一个示例。图 12-13 显示了程序的输出。\n\n```\n 1  import javafx.application.Application;\n\
    2  import javafx.stage.Stage;\n  3  import javafx.scene.Scene;\n  4  import javafx.scene.layout.HBox;\n\
    5  import javafx.scene.image.Image;\n  6  import javafx.scene.image.ImageView;\n\
    7\n  8  /**\n  9    An Image Demo\n  10  */\n  11\n  12  public class ImageDemo\
  \ extends Application\n  13  {\n  14     public static void main(String[] args)\n\
    15     {\n  16        // Launch the application.\n  17        launch(args);\n\
    18     }\n  19\n  20     @Override\n  21     public void start(Stage primaryStage)\n\
    22     {\n  23        // Create an Image object.\n  24        Image image = new\
  \ Image(\"file:HotAirBalloon.jpg\");\n  25\n  26        // Create an ImageView object.\n\
    27        ImageView imageView = new ImageView(image);\n  28\n  29        // Put\
  \ the ImageView in an HBox.\n  30        HBox hbox = new HBox(imageView);\n  31\n\
    32        // Create a Scene with the HBox as its root node.\n  33        Scene\
  \ scene = new Scene(hbox);\n  34\n  35        // Add the Scene to the Stage.\n \
  \ 36        primaryStage.setScene(scene);\n  37\n  38        // Set the stage title.\n\
    39        primaryStage.setTitle(\"Hot Air Balloon\");\n  40\n  41        // Show\
