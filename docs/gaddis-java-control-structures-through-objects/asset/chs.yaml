  \n## 3.9 switch 语句\n\n概念：switch 语句根据变量的值决定程序的跳转位置。\n\n`switch` 语句是一种多重选择结构。它允许你测试变量或表达式的值，并根据该值确定要执行哪个语句或语句组。图\
  \ 3-16 了多重选择结构在流程图中的示例。\n\n### 图 3-16 多重选择结构\n\n![以 Month 为变量的多重选择结构](img/03fig16.png)\n\
  \n在流程图中，菱形符号显示 `month`，这是一个变量名。如果 `month` 变量的值为 1，程序显示 *January*（一月）。如果 `month`\
  \ 变量的值为 2，程序显示 *February*（二月）。如果 `month` 变量的值为 3，程序显示 *March*（三月）。如果 `month` 变量不包含这些值，则执行标记为\
  \ `default` 的操作。在这种情况下，程序显示 *Error: Invalid month*（错误：无效月份）。\n\n以下是 `switch` 语句的通用格式：\n\
  \n```\nswitch (testExpression) {\n    case value1:\n        // 语句\n        break;\n\
  \    case value2:\n        // 语句\n        break;\n    default:\n        // 语句\n\
  }\n```\n\n语句的第一行以单词 `switch` 开头，后面跟着括号内的 `testExpression`。`testExpression` 是一个产生\
  \ `char`、`byte`、`short`、`int` 或 `string` 值的变量或表达式。\n\n\n\n\n从下一行开始是一个用大括号括起来的代码块。该代码块内部包含一个或多个\
  \ `case` 部分。每个 `case` 部分以单词 `case` 开头，后面紧跟一个值，然后是冒号。每个 `case` 部分包含一个或多个语句，最后紧跟一个\
  \ `break` 语句。在所有 `case` 部分之后，会出现一个可选的 `default` 部分。\n\n当 `switch` 语句执行时，它会将 `testExpression`\
  \ 的值与每个 `case` 语句后的值（从上到下）进行比较。当它找到与 `testExpression` 的值匹配的 `case` 值时，程序跳转到该 `case`\
  \ 语句。`case` 语句后的语句将一直执行，直到遇到 `break` 语句。此时，程序将跳出 `switch` 语句。如果 `testExpression`\
  \ 不匹配任何 `case` 值，程序将跳转到 `default` 语句并执行紧随其后的语句。\n\n### 注意\n\n每个 `case` 值必须是唯一的。\n\
  \n例如，以下代码执行的操作与 图 3-16 中的流程图相同。假设 `month` 是一个 `int` 变量。\n\n```java\nswitch (month)\n\
   {\n     case 1:\n        System.out.println(\"January\");\n        break;\n   \
  \  case 2:\n        System.out.println(\"February\");\n        break;\n     case\
  \ 3:\n        System.out.println(\"March\");\n        break;\n     default:\n  \
  \     System.out.println(\"Error: Invalid month\");\n       break;\n }\n```\n\n\
  在这个示例中，`testExpression` 是 `month` 变量。`month` 变量将被求值并发生以下操作之一：\n\n*   如果 `month`\
  \ 变量的值 1，程序将跳转到 `case 1:` 部分并执行紧随其后的 `System.out.println(\"January\")` 语句。随后 `break`\
  \ 语句会导致程序退出 `switch` 语句。\n*   如果 `month` 变量的值 2，程序将跳转到 `case 2:` 部分并执行紧随其后的 `System.out.println(\"\
  February\")` 语句。随后 `break` 语句会导致程序退出 `switch` 语句。\n*   如果 `month` 变量的值 3，程序将跳转到\
  \ `case 3:` 部分并执行紧随其后的 `System.out.println(\"March\")` 语句。随后 `break` 语句会导致程序退出 `switch`\
  \ 语句。\n*   如果 `month` 变量的值不是 1、2 或 3，程序将跳转到 `default:` 部分并执行紧随其后的 `System.out.println(\"\
  Error: Invalid month\")` 语句。\n\n`switch` 语句可以作为 `if`-`else`-`if` 语句，将同一个变量或表达式与多个不同的值进行比较。例如，之前显示的\
  \ `switch` 语句工作方式如下 `if`-`else`-`if` 语句：\n\n```java\nif (month == 1)\n {\n     System.out.println(\"\
  January\");\n }\n else if (month == 2)\n {\n     System.out.println(\"February\"\
  );\n }\n else if (month == 3)\n {\n     System.out.println(\"March\");\n }\n else\n\
   {\n     System.out.println(\"Error: Invalid month\");\n }\n```\n\n### 注意\n\n`default`\
  \ 部分是可选的。然而，如果你省略它，当 `testExpression` 不匹配任何 `case` 值时，程序将无处可跳。\n\n代码列表 3-13 中的程序展示了简单的\
  \ `switch` 语句是如何工作的。\n\n在下面的动画中，点击“上一个”或“下一个”按钮逐步执行代码并查看贯穿的解释。\n\n### 代码列表 3-13\
  \ `(SwitchDemo.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr3-13/13.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr3-13/13.html)\n\
  \n注意 `case 1`、`case 2` 和 `case 3` 部分中的 `break` 语句。\n\n```java\nswitch (number)\n\
   {\n    case 1:\n          System.out.println(\"You entered 1.\");\n           break;\n\
      case 2:\n          System.out.println(\"You entered 2.\");\n           break;\n\
      case 3:\n          System.out.println(\"You entered 3.\");\n          break;\n\
      default:\n          System.out.println(\"That's not 1, 2, or 3!\");\n }\n```\n\
  \n`case` 语句显示程序在块中何时开始执行，`break` 语句显示程序何时停止。如果没有 `break` 语句，程序将从匹配的 `case` 语句执行到块的结束。\n\
  \n### 注意\n\n`default` 部分（如果没有 `default` 则是最后一个 `case` 部分）不需要 `break` 语句。尽管如此，有些程序员习惯于在那里放置一个以保持一致性。\n\
  \n代码列表 3-14 中的程序是对 代码列表 3-13 的修改，没有 `break` 语句。\n\n在下面的动画中，点击“上一个”或“下一个”按钮逐步执行代码并查看贯穿的解释。\n\
  \n### 代码列表 3-14 `(Noaks.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr3-14/14.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr3-14/14.html)\n\
  \n没有 `break` 语句，程序会“穿透”到下一个 `case`。有时这正是你想要的。例如，当用户输入 ‘a’时，对应的 `case` 没有语句，因此程序穿透到与\
  \ ‘A’ 对应的 `case`。\n\n```java\nswitch (grade) {\ncase 'a':\ncase 'A':\n    System.out.println(\"\
  30 per lb.\");\ncase 'B':\n    System.out.println(\"20 per lb.\");\ncase 'C':\n\
  \    System.out.println(\"10 per lb.\");\n}\n```\n\n\n\n\n```\ndouble number = 10.0\
  \ / 6.0;\n System.out.println(number);\n```\n\n这段代码将显示：\n\n```\n1.666666666666667\n\
  ```\n\n通常，你希望对数字进行格式化，以便特定的方式显示。例如，你可能希望将浮点数舍入到特定的的小位数，或者插入逗号分隔符使数字更易读。幸运的是，Java\
  \ 提供了通过 `System.out.printf` 方法来实现这一点、甚至更多功能。该方法的通用格式如下：\n\n```\nSystem.out.printf(FormatString,\
  \ ArgumentList)\n```\n\n在通用格式中，`FormatString` 是一个包含文本、特殊格式说明符或两者兼有的字符串。`ArgumentList`\
  \ 是一个零或多个额外参数的列表，它们将根据格式字符串中列出的格式说明符进行格式化。\n\n使用 `System.out.printf` 方法最简单的方法是只使用格式字符串，而不使用额外的参数。这是一个示例：\n\
  \n```\nSystem.out.printf(\"I love Java programming.\\n\");\n```\n\n此示例中的格式字符串是 `\"\
  I love Java programming.\\n\"`。然而，此方法调用并没有执行任何特殊格式化。它只是打印字符串 `\"I love Java programming.\\\
  n\"`。这种方式使用该方法与使用 `System.out.print` 方法完全相同。\n\n在大多数情况下，你会以以下方式调用 `System.out.printf`\
  \ 方法：\n\n*   格式字符串将包含一个或多个格式说明符。`format specifier`（格式说明符）是值的占位符，该值将在显示时插入到字符串中。\n\
  *   在格式字符串之后将出现一个或多个额外参数。每个额外参数将与格式字符串内部出现的格式说明符对应。\n\n以下代码展示了一个示例：\n\n```\ndouble\
  \ sales = 12345.67;\nSystem.out.printf(\"Our sales are %f for the day.\\n\", sales);\n\
  ```\n\n注意 `System.out.printf` 方法调用的以下特征：\n\n*   在格式字符串内部，`%f` 是一个格式说明符。字母 `f` 表示在显示时将向字符串插入一个浮点值。\n\
  *   在格式字符串之后，变量 `sales` 作为参数传递。该参数对应于格式字符串内部出现的 `%f` 格式说明符。\n\n当 `System.out.printf`\
  \ 方法执行时，`%f` 不显示在屏幕上。取而代之的是将显示 `sales` 参数的值。以下是代码的输出：\n\n```\nOur sales are 12345.670000\
  \ for the day.\n```\n\n图 3-17 中的图显示了 `sales` 变量如何对应于 `%f` 格式说明符。\n\n![sales 变量的值显示在\
  \ %f 格式说明符的位置](img/03fig17.png)\n\n### 图 3-17 sales 变量的值显示在 `%f` 格式说明符的位置\n\n这是另一个示例：\n\
  \n```\ndouble temp1 = 72.5, temp2 = 83.7;\n System.out.printf(\"The temperatures\
  \ are %f and %f degrees.\\n\", temp1, temp2);\n```\n\n首先，注意这个示例在格式字符串使用了两个 `%f`\
  \ 格式说明符。同时注意到在格式字符串之后出现了两个额外参数。第一个参数 `temp1` 的值将打印在第一个 `%f` 的位置，第二个参数 `temp2` 的值将打印在第二个\
  \ `%f` 的位置。代码将产生以下输出：\n\n```\nThe temperatures are 72.500000 and 83.700000 degrees.\n\
  ```\n\n格式说明符与出现在格式字符串之后的参数之间存在一一对应的关系。图 3-18 中的图显示了第一个格式说明符如何对应于格式字符串之后的第一个参数（`temp1`\
  \ 变量），第二个格式说明符如何对应于格式字符串之后的第二个参数（`temp2` 变量）。\n\n# 图 3-18 格式说明符及其对应的参数\n\n![两个格式说明符有对应的参数](img/03fig18.png)图\
  \ 3-18 完整备用文本\n\n以下代码展示了另一个示例：\n\n```\ndouble value1 = 3.0;\n double value2 = 6.0;\n\
   double value3 = 9.0;\n System.out.printf(\"%f %f %f\\n\", value1, value2, value3);\n\
  ```\n\n在 `System.out.printf` 方法调用中，格式字符串之后有三个格式说明符和三个额外参数。这段代码将产生以下输出：\n\n```\n\
  3.000000 6.000000 9.000000\n```\n\n图 3-17 中的图显示了 `sales` 变量如何对应于 `%f` 格式说明符。\n\n\
  \n\n\n注意，此示例没有使用常规 `%f` 格式说明符，而是使用了 `%.2f`。出现在 `%` 和 `f` 之间的 `.2` 指定了显示值的*精度*。它将使\
  \ `temp` 变量的值四舍五入到小数点后两位。这段代码将产生以下输出：\n\n```\nThe temperature is 78.43 degrees.\n\
  ```\n\n接下来的示例显示相同的值，但四舍五入到一位小数：\n\n```\ndouble temp = 78.42819;\n System.out.printf(\"\
  The temperature is %.1f degrees.\\n\", temp);\n```\n\n这段代码将产生以下输出：\n\n```\nThe temperature\
  \ is 78.4 degrees.\n```\n\n接下来的代码显示另一个示例：\n\n```\ndouble value1 = 123.45678;\n double\
  \ value2 = 123.45678;\n double value3 = 123.45678;\n System.out.printf(\"%.1f %.2f\
  \ %.3f\\n\", value1, value2, value3);\n```\n\n在这个示例中，`value1` 被四舍五入到一位小数，`value2`\
  \ 被四舍五入到两位小数，而 `value3` 被四舍五入到三位小数。这段代码将产生以下输出：\n\n```\n123.5 123.46 123.457\n```\n\
  \n请记住，你只能对浮点数值指定精度。如果你在 `%d` 格式说明符中指定精度，将在运行时发生错误。\n\n### 指定最小字段宽度\n\n格式说明符还可以包含一个*最小字段宽度*，即显示该值时应使用的最小空格数。下面的示例在一个宽度为\
  \ 20 个空格的字段中打印一个浮点数：\n\n```\ndouble number = 12345.6789;\n System.out.printf(\"\
  The number is:%20f\\n\", number);\n```\n\n注意数字 20 出现在格式说明符中，位于 `%` 和 `f` 之间。这段代码将产生以下输出：\n\
  \n```\nThe number is:    12345.678900\n```\n\n在这个示例中，`%f` 格式说明符内部出现的 20 表示数字应该在一个最小宽度为\
  \ 20 个空格的字段中显示。这在图 3-20 中所示。\n\n![数字 12345.878900 显示在一个宽度为 20 个空格的字段中。](img/03fig20.png)\n\
  \n### 图 3-20：数字显示在一个宽度为 20 个空格的字段中\n\n在这种情况下，显示的数字比其所处的字段短。数字 `12345.678900` 在屏幕上仅占了\
  \ 12 个空格，但它显示在一个宽度为 20 个空格的字段中。出现这种情况时，数字将在字段中右对齐。如果值太大而无法放入指定的字段宽度中，字段将自动扩大以容纳它。下面的示例在一个宽度仅为一个空格的字段中打印一个浮点数：\n\
  \n```\ndouble number = 12345.6789;\n System.out.printf(\"The number is:%1f\\n\"\
  , number);\n```\n\n然而，`number` 变量的值需要的空格更多，因此字段宽度被扩大以容纳整个数字。这段代码将产生以下输出：\n\n```\n\
  The number is:12345.678900\n```\n\n你可以对整数指定最小字段宽度，也可以对浮点值指定。下面的示例显示了一个最小字段宽度为六个字符的整数：\n\
  \n```\nint number = 200;\n System.out.printf(\"The number is:%6d\", number);\n```\n\
  \n这段代码将显示：\n\n```\nThe number is:  200\n```\n\n### 在同一格式说明符中结合最小字段宽度和精度\n\n在同一个格式说明符中指定浮点数的最小字段宽度和精度时，记住字段宽度必须首先出现，然后是精度。例如，下面的代码在一个\
  \ 12 个空格宽的字段中显示一个数字，并四舍五入到两位小数：\n\n```\ndouble number = 12345.6789;\n System.out.printf(\"\
  The number is:%12.2f\\n\", number);\n```\n\n这段代码将产生以下输出：\n\n```\nThe number is:\
  \  12345.68\n```\n\n当你需要对齐列打印数字时，字段宽度可以很有帮助。例如，查看代码列表 3-17。每个变量都显示在一个宽度为 8 个空格的字段中，并四舍五入到两位小数。数字看起来是列对齐的。\n\
  \n```\n/**\n * program displays a variety of\n * floating-point numbers in a column\n\
  \ * with decimal points.\n */\npublic class Columns {\n    public static void main(String[]\
  \ args) {\n        // Declare a variety of\n        // variables with 8 spaces.\n\
  \        double num1 = 127.99;\n        double num2 = 346.51;\n        double num3\
  \ = 3.77;\n        double num4 = 264.82;\n        double num5 = 88.08;\n\n     \
  \   // Each of the variables is displayed\n        // in a field that is eight spaces\
  \ wide,\n        // and rounded to two decimal places.\n        System.out.printf(\"\
  The number is:%8.2f\\n\", num1);\n        System.out.printf(\"The number is:%8.2f\\\
  n\", num2);\n        System.out.printf(\"The number is:%8.2f\\n\", num3);\n    \
  \    System.out.printf(\"Sales for the month %.2f\\n\", num4);\n        System.out.printf(\"\
  Sales for the month %.2f\\n\", num5);\n    }\n}\n```\n\n输出\n```\n127.99\n346.51\n\
  3.77\n264.82\n88.08\n```\n### 代码列表 3-17：Columns.java\n\n### Flags\n\n有几种可选标志可以插入格式说明符中，以改变数字显示方式。\n\
  \n逗号分隔符\n\n如果数字带有逗号分隔符，将更容易阅读。你可以通过在格式说明符中插入逗号（`,`）来实现。例如：\n\n```\ndouble amount\
  \ = 1234567.89;\n System.out.printf(\"%,f\\n\", amount);\n```\n\n这段代码将产生以下输出：\n\n\
  ```\n1,234,567.890000\n```\n\n通常，你希望对数字使用逗号分隔符，并保留两位小数。你可以通过在格式说明符中插入逗号和精度来实现，如下例所示：\n\
  \n```\ndouble sales = 28756.89;\n System.out.printf(\"Sales for the month %.2f\\\
  n\", sales);\n```\n\n这段代码将产生以下输出：\n\n```\nSales for the month 28,756.89\n```\n\n\
  ### 填充前导零\n\n\n\n\n有时，当一个数字比它显示的字段更短时，你可能希望在数字前面填充导零。如果你在格式说明符中插入一个 `0` 标志，如果生成的数字短于字段宽度，则该数字将用导零填充。以下代码显示了一个示例：\n\
  \n```\ndouble number = 123.4;\nSystem.out.printf(\"The number is:%08.1f\\n\", number);\n\
  ```\n\n这段代码将产生以下输出：\n\n```\nThe number is:000123.4\n```\n\n图 3-21 中的图显示了上一个示例中格式说明符每个部分的作用。\n\
