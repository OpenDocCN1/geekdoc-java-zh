  \ 3-12 中的程序。`main` 方法声明了两个 `String` 引用变量：`firstName` 和 `lastName`。注意这些变量的声明出现在第一次使用它们附近。\n\
  \n在下方的动画中，点击“上一个”或“下一个”按钮可以逐行通过代码并查看各处的解释。\n\n### 代码列表 3-12 `(VariableScope.java)`\n\
  \n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr3-12/12.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr3-12/12.html)\n\
  \n虽然在方法开始处声明所有的局部变量是一种常见做法，但在稍晚的位置声明它们也是可能的。有时，程序员会在程序中使用某些变量的地方附近声明这些变量，以便使其目的更加明显。\n\
  \n回想第 2 章，变量的作用域是程序可以使用变量名称的部分。局部变量的作用域始终始于变量的声明，并结束于声明它的代码块的右括号。在代码列表 3-12 中，`firstName`\
  \ 仅对第 18 行到 26 行的代码可见。`lastName` 变量仅对第 23 行到 26 行的代码可见。\n\n### 注意\n\n当程序运行并进入构成变量作用域的代码段时，称该变量“进入作用域（comes\
  \ into scope）”。这仅意味着该变量现在是可见的，程序可以引用它。同样，当变量“离开作用域”时，它可能无法再被使用。\n\n# 检查点 3.60\n\n\
  ../components/metrodigi/ch03-inline_self_quiz_v1.0.0-34/index.html\n\n## 3.8 条件运算符（可选）\n\
  \n概念：你可以使用条件运算符来创建类似于 `if-else` 语句的短表达式。\n\n条件运算符强大且独特。因为它接受三个操作数，所以它被视为三元运算符。条件运算符提供了一种表达简单\
  \ `if-else` 语句的简写方法。该运算符由问号（`?`）和冒号（:`）组成。\n\n```\nBooleanExpression ? Value1 :\
  \ Value2\n```\n\n条件运算符的作用类似于 `if-else` 语句。如果 `BooleanExpression` 为真，结果为 `Value1`；否则，结果为\
  \ `Value2`。\n\n```\nif (BooleanExpression) {\n    y = Value1;\n} else {\n    y =\
  \ Value2;\n}\n```\n\n条件运算符允许将决策封装在一个行内。例如，考虑：\n\n```\nSystem.out.println(\"Your\
  \ grade is \" + (score < 60 ? \"Fail.\" : \"Pass.\"));\n```\n\n转换为 `if-else` 语句，它将是：\n\
  \n```\nif (score < 60) {\n    System.out.println(\"Your grade is Fail.\");\n} else\
  \ {\n    System.out.println(\"Your grade is Pass.\");\n}\n```\n\n### 注意\n\n表达式周围加上括号是因为\
  \ `+` 运算符的优先级高于 `?:` 运算符。关于使用条件运算符的完整示例，请参见[下载](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/downloads/Consultant.java)Consultant.java。\n\
