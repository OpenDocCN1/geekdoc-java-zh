  \ 6-26 完整替代文本\n\n## 方法重载使类变得更有用\n\n你可能在想，为什么 `BankAccount` 类中会出现这么多重载方法，尤其是其中许多方法在代码列表\
  \ 6-21 的演示程序中并没有被使用。毕竟，如果类只包含我们要用到的方法，难道不是更简单吗？\n\n对象的目的是提供某种特定的服务。`BankAccount`\
  \ 类提供的服务是模拟一个银行账户。任何需要模拟银行账户的程序都可以简单创建一个 `BankAccount` 对象，然后使用它的方法来使模拟运行起来。由于 `BankAccount`\
  \ 类拥有许多重载方法，它比只提供一种方式来执行每种操作要灵活得多。通过提供重载的构造函数、`deposit` 方法、`withdraw` 方法和 `setBalance`\
  \ 方法，我们让 `BankAccount` 类对我们的简单演示程序以外的其他程序也有用。在你设计自己的类时，这是一个需要考虑的重要因素。\n\n## 检查点\
