  ## 12.1 图形用户界面\n\n概念：图形用户界面允许用户通过窗口、图标、按钮等图形元素与程序进行交互。\n\n程序员通常使用 `user`（用户）一词来描述任何可能使用计算机及其程序的假设人物。计算机的\
  \ `user interface`（用户界面）是用户与计算机交互的部分。用户界面的一部分由硬件设备组成，例如键盘和视频显示器。另一部分则涉及计算机操作系统和应用程序接受用户命令的方式。多年来，用户与计算机交互的唯一方法是通过命令行界面。`command\
  \ line interface`（命令行界面），也称为 `console interface`（控制界面），要求用户输入命令。如果命令输入正确，它将执行并显示结果。如果命令输入错误，则会显示错误信息。图\
  \ 12-1 显示了 Windows 命令提示符，它是命令行界面的示例。\n\n![Windows 命令提示符窗口是命令行界面示例，也称为控制界面，要求用户输入命令。](img/12fig01.png)\n\
  \n# 图 12-1 命令行界面（微软公司）\n\n许多计算机用户，特别是初学者，发现命令行界面难以使用。这是因为有很多命令，并且每个命令都有自己的语法，就像编程语句一样。如果输入命令错误，它将无法工作。\n\
  \n在 20 世纪 80 年代，一种被称为图形用户界的新型界面进入商业操作系统。`graphical user interface`，或 `GUI`（读作“gooey”），允许用户通过图形元素与操作系统和应用程序进行交互。GUI\
  \ 还普及了鼠标作为输入设备的用法。GUI 不需要用户在键盘上输入命令，而是允许用户指向图形元素并点击鼠标来激活它们。与 GUI 的大部分交互都是通过显示信息并允许用户执行操作的窗口完成的。图\
  \ 12-2 显示允许用户更改系统设置的窗口示例。用户不再输入晦涩的命令，而是与图标、按钮和滑块进行交互。\n\n# 图 12-2 图形用户界面中的窗口（微软公司）\n\
  \n![图形用户界面中的窗口允许用户通过与图标、滑块和按钮交互来更改系统设置。(images/12fig02.png) 图 12-2 完整替代文本\n\n# 事件驱动型\
  \ GUI 程序\n\n在基于文本环境中（例如命令行界面），程序决定事情发生的顺序。例如，图 12-3 显示了在文本环境中与计算员工总薪的程序之间发生的交互。首先，程序提示用户输入工作小时数。图中，用户输入了\
  \ `40` 并按下了 `Enter` 键。接下来，程序提示用户输入其每小时薪资率。图中，用户输入了 `50.00` 并按下了 `Enter` 键。然后，程序显示了用户的总薪。在程序运行时，用户别选择按照要求的顺序输入数据。\n\
  \n![命令提示符窗口显示了文本环境中的交互，该程序通过要求用户回答关于工作小时和每小时薪资的两个提示来计算员工总薪。(images/12fig03.png)\n\
  \n# 图 12-3 文本环境中的程序交互（甲骨文公司法律顾问）\n\n然而，在 GUI 环境中，用户决定事情发生的顺序。例如，图 12-4 显示了一个计算员工总薪的\
  \ GUI 应用程序。注意有一个用户输入工作小时数和每小时薪资率的框。用户可以按照他们喜欢的任何顺序输入小时数和薪资率。如果用户出错，他们可以删除已输入的数据并重新输入。当用户准备好计算区域时，他们点击\
  \ `Calculate Gross Pay` 按钮，程序将执行计算。\n\n![图形用户界面或 GUI 应用程序名为 Wage Calculator，并提示用户输入工作小时数和每小时薪资率，然后点击按钮并计算总薪。(images/12fig04.png)\n\
  \n# 图 12-4 GUI 应用程序（甲骨文公司法律顾问）\n\n由于 GUI 程序必须响应用户的操作，因此它们被认为是 `event-driven`（事件驱动的）。用户引起事件（例如点击按钮），程序对这些事件做出响应。\n\
  \n本章专门关注使用 `JavaFX` 库开发 GUI 应用程序。在学习本章时，你将学习创建通过包含图形对象的窗口与用户交互的应用程序。你还将学习如何编写你的应用程序以响应用户与其交互时发生的事件。\n\
