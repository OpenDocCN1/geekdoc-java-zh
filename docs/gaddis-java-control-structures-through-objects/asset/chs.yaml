  \ `try` `void` `volatile` `while` | `const` `goto` `exports` `module` `opens` `provides`\
  \ `requires` `transitive` `uses` `with` |\n\n# 附录 D\n\n## 安装 JDK 和使用 JDK\n\n以下单词是在\
  \ Java 9 中引入的。为了方便从任何文件夹执行 JDK 工具，您应该将此路径添加到。将此路径添加到 `Path` 变量的方法取决于您所使用的 Windows\
  \ 版本。Windows 10、Windows 8 和 Windows 7 的步骤如下。\n\n### Windows 10\n\n在 Windows 搜索框中输入“环境变量”，然后从搜索结果中选择**编辑系统环境变量**。\n\
  \n这将显示*系统属性*窗口（顶部选了*高级* 选项卡）。点击“环境变量...”按钮。在**系统变量**下，找到 *Path*，点击它，然后点击“编辑”。在现有内容的末尾添加分号，然后添加\
  \ JDK 工具程序的路径。一直点击“确定”按钮直到所有对话框关闭并退出控制面板。\n\n### Windows 8\n\n\n\n\n\n在屏幕右下角，点击\
  \ `Search` 图标并输入 `Control Panel.`。点击 `Control Panel,`，然后点击 `System,`，接着点击 `Advanced\
  \ system settings.`。点击 `Advanced` 选项卡，然后点击 Environment Variables。在 System Variables,\
  \ 下，找到 `Path`，点击它，然后点击 `Edit` 按钮。在现有内容的末尾添加一个分号，然后添加 JDK 实用程序的路径。反复点击 OK 按钮直到所有对话框关闭并退出控制面板。\n\
  \n# Windows 7\n\n点击开始按钮，然后右键点击 `Computer`。在弹出的菜单中，选择 `Properties`。在随后出现的窗口中，点击 `Advanced\
  \ system settings`。这将显示系统属性窗口。点击 `Environment Variables` 按钮。在 System Variables 列表中滚动到\
  \ `Path` 变量。选择 `Path` 变量并点击 `Edit` 按钮。在现有内容的末尾添加一个分号，然后添加 JDK 实用程序的路径。反复点击 OK 按钮直到所有对话框关闭并退出控制面板。\n\
  \n# 使用 Java API 文档\n\n查看官方 Java API 文档，请访问以下网站：\n\n```\nhttp://docs.oracle.com/javase\
  \ \n```\n\n图 D-1 显示了编写本文时的页面外观。该页面提供了指向几个有用网站的链接，包括官方的 `API documentation`。作为一名学习\
  \ Java 的学生或专业 Java 程序员，你会发现自己会频繁查阅 API 文档。\n\n# 图 D-1 Java SE 文档站点 (Oracle Corporate\
  \ Counsel)\n\n![显示了 Java SE 文档首页，标题为 Oracle JDK 9 Documentation，在 Oracle Corporate\
  \ Counsel 中显示。](img/dfig01.png)图 D-1 完整替代文本\n\n当你点击 `API documentation` 链接，然后点击\
  \ `Frames` 链接时，你将看到一个与 图 D-2 所示类似的页面。在左侧窗格中，你将看到 Java API 中所有类和接口按字母顺序排列列表。要查看特定类的文档，只需在左窗格中滚动到该类的名称并点击它。\n\
  \n# 图 D-2 Java SE API 文档 (Oracle Corporate Counsel)\n\n![在 Oracle Corporate Counsel\
  \ 中显示了 Java SE space API 文档。](img/dfig02.png)图 D-2 完整替代文本\n\n# 附录 E\n\n使用 `javadoc`\
  \ 实用\n\nJava JDK 自带有一个名为 `javadoc` 的工具，你可以用它为你编写的类、接口和方法自动生成文档。`javadoc` 工具会生成与\
  \ Java API 文档结构相同的 HTML 文档。要生成此文档，通常需要两个通用的步骤：\n\n1. 在你想要文档化的 Java 源代码文件中编写文档注释。\n\
  2. 运行 `javadoc` 工具，并将 Java 源代码文件名作为命令行参数传递。。\n\n让我们仔细观察每一个步骤。\n\n# 编写文档注释\n\n在第一步中，你在\
  \ Java 源代码文件中写入特殊的注释，称为 `documentation comments`。你通常在编写 Java 代码时完成此操作。文档注释位于类头、接口头或方法头之前。每个注释都包含关于其之前所属的类、接口或方法的信息。\n\
  \n文档注释以 `/**` 开头，以 `*/` 结束。在这两个符号之间，你编写 `javadoc` 工具可用于生成文档的信息。这些信息可以包含普通文本描述，以及以\
  \ `@` 符号开头的特殊 `javadoc` 标签。当你运行 `javadoc` 工具时，它会搜索这些文档注释并处理它们。\n\n为了查看文档注释的示例，我们将查看在\
  \ 第 6 章 中首次介绍的 `BankAccount` 类。该类对类及其方法使用了简单的文档注释。首先，这里是类的文档，随后是类头：\n\n```\n/**\n\
     The BankAccount class simulates a bank account.\n */\n public class BankAccount\n\
  ```\n\n类文档注释中的文本应包含对类的简要描述。这是将用于描述类的文本。类文档注释中的文本应包含类的简要描述。注意在此类中，类文档注释中的文本空格 javjavjavjav，在现有内容的末尾添加分号。`javadoc`\
  \ 忽略行开头的空白字符。例如，以下文档注释将产生相同的结果：\n\n```\n/**\n  * The BankAccount class simulates\
  \ a bank account.\n */\n public class BankAccount\n```\n\n虽然星号会被 `javadoc` 忽略，但它们有助于阅读代码的人识别出注释。\n\
  \n方法的文档注释结构如下：\n\n*   在 `/**` 符号之后，是方法的简要描述。此文本将用于在 HTML 文件中描述该方法。此外，方法注释的第一句话将用作方法的摘要。\n\
  *   如果方法有参数，注释中将出现每个参数的文档。参数文档以 `@param` 标签开头，随后是参数名称，然后是参数描述。\n*   如果方法返回值，注释中将出现返回值的描述。该描述以\
  \ `@return` 标签开头，随后是返回值的描述。\n*   如果方法抛出异常，注释中将出现每个异常的文档。每个异常的文档以 `@exception` 标签开头，随后是异常名称，然后是导致异常的事件描述。\n\
  \n例如，这里是 `BankAccount` 的构造函数之一，其前面是文档注释：\n\n```\n/**\n  * The constructor initializes\
  \ the balance\n  and interestRate fields.\n  * @param startBalance The starting\
  \ balance\n  * @param intRate The interest rate\n  */\n public BankAccount(double\
  \ startBalance,\n                    double intRate)\n {\n    balance = startBalance;\n\
      interestRate = intRate;\n    interest = 0.0;\n }\n```\n\n该构造函数的文档注释相对简单，包含一个句子描述和两个\
  \ `@param` 标签。\n\n在 `javadoc` 生成的 HTML 文件中，每个方法有两个主要的文档部分：`summary section` 和 `detail\
  \ section`。方法文档注释中的第一句用作方法的摘要。注意 `javadoc` 将结束视为句号后跟空白字符。因此，当方法描述包含多个句子时，你应该始终让第一句以句号后跟空白字符结束。方法的详细部分将包含从注释开始到第一个标签的所有文本，或者如果没有包含标签，则到注释结束。\n\
  \n# @param 标签\n\n当 `javadoc` 工具在方法文档注释内部看到 `@param` 标签时，它知道参数变量的文档将紧随其后。每个参数应该有自己的\
  \ `@param` 标签，并遵循以下通用格式：\n\n```\n@param parameterName Description \n```\n\n\n\n\n\
  \n在通用格式中，`parameterName` 是参数名，`Description` 是该参数的简要描述。当方法的文档注释包含一个或多个 `@param` 标签时，`javadoc`\
  \ 工具将在方法的文档中创建一个 `Parameters`（参数）部分。这里就是列出方法参数描述的地方。请记住关于 `@param` 标签注释的几点：\n\n\
  *   方法文档注释中的所有 `@param` 标签必须出现在方法的通用描述之后。\n*   描述可以跨多行。它结束于文档注释的末尾（`*/` 符号）或另一个标签的开始处。\n\
  \n# `@return` 标签\n\n这里是 `BankAccount` 类的另一个方法，它有一个返回值：\n\n```java\n/**\n  * The\
  \ getBalance 方法返回余额。\n  * @return balance 字段中的值。\n  */\n public double getBalance()\n\
   {\n    return balance;\n }\n```\n\n由于此方法返回一个值，因此文档注释包含一个 `@return` 标签。返回值的文档遵循以下通用格式：\n\
  \n```\n@return Description \n```\n\n在通用格式中，`Description` 是返回值的简要描述。当方法的文档注释包含一个\
  \ `@return` 标签时，`javadoc` 工具将在方法的文档中创建一个 `Returns`（返回值）部分。这里就是列出方法返回值描述的地方。请记住关于\
  \ `@return` 标签注释的几点：\n\n*   方法文档注释中的 `@return` 标签必须出现在方法的通用描述之后。\n*   描述可以跨多行。它结束于文档注释的末尾（`*/`\
  \ 符号）或另一个标签的开始处。\n\n# `@exception` 和 `@throws` 标签\n\n`@exception` 和 `@throws` 标签的作用相同：指定由方法抛出的异常。以下是这两个标签的通用格式：\n\
  \n```\n@exception ExceptionName Description \n @throws ExceptionName Description\
  \ \n```\n\n`ExceptionName` 是异常名称，`Description` 是导致异常发生的情况的描述。当方法的文档注释包含 `@exception`\
  \ 标签或 `@throws` 标签时，`javadoc` 工具将在方法的文档中创建一个 `Throws`（抛出）部分。这里就是列出方法异常描述的地方（注：原文此处可能有误，应为异常描述）。请记住关于\
  \ `@exception` 和 `@throws` 标签注释的几点：\n\n*   方法文档注释中的 `@exception` 标签或 `@throws` 标签必须出现在方法的通用描述之后。\n\
  *   描述可以跨多行。它结束于文档注释的末尾（`*/` 符号）或另一个标签的开始处。\n\n例如，下面的代码显示了一个名为 `FileRead` 的方法，在读取文件失败时会抛出\
  \ `IOException`：\n\n```java\n/**\n  * 此方法打开文件并读取内容。\n  * @param FileName 指定要读取的文件。\n\
    * @exception IOException 读取文件失败。\n  */\n public void FileRead(String filename)\
  \ throws IOException\n {\n    // 方法体在此处...\n }\n```\n\n# 运行 `javadoc`\n\n在创建一个或多个包含文档注释的源文件后，下一步是运行\
  \ `javadoc` 工具。你在操作系统的命令行提示符中运行 `javadoc`。以下是 `javadoc` 命令的通用格式：\n\n```\njavadoc\
  \ SourceFileList \n```\n\n`SourceFileList` 是一个或多个源文件的名称。`javadoc` 将读取作为参数指定的文件，并为每个文件生成文档。例如，下面的命令将为\
  \ `BankAccount` 类生成文档：\n\n```\njavadoc BankAccount.java\n```\n\n此命令执行后，会在源文件所在的相同目录中创建几个\
  \ HTML 文件。其中一个文件的名称与类文件相同。在一种情况下，它将被命名为 `BankAccount.html`。这就是你在浏览器中打开以查看文档的文件。图\
  \ E-1 显示了 `BankAccount` 类的文档。\n\n# 图 E-1 `BankAccount` 类文档 (Oracle Corporate Counsel)\n\
  \n![Oracle Corporate Counsel 中显示了 Bank Account 类文档。在 Class Bank Account 页面标题下方，关于类的信息描述了它的功能。还可以查看的是构造方法摘要部分和方法摘要部分。](img/efig01.png)\n\
  \n如果你想为多个源文件生成文档，只需用空格分隔文件名即可。这是一个示例：\n\n```\njavadoc Student.java CompSciStudent.java\n\
  ```\n\n此命令执行后，生成的 HTML 文件将包含 `Student` 和 `CompSciStudent` 类的文档。其中一个 HTML 文件将命名为\
  \ `index.html`。你可以在浏览器中打开此文件来查看每个类的文档。图 E-2 显示了\n\n# 图 E-2 文档文件 (Oracle Corporate\
  \ Counsel)\n\n![Oracle Corporate Counsel 中显示了 Bank Account 类文档。在 Class Bank Account\
  \ 页面标题下方，关于类的信息描述了它的功能。还可以查看的是构造方法摘要部分和方法摘要部分。](img/efig01.png)\n\n\n\n\n```\njavadoc\
  \ -private Class1.java Class2.java Class3.java\n```\n\n此命令将为所有类及其成员生成文档，无论它们的访问修符如何。\n\
  \n`-protected` 选项会导致 `javadoc` 只为公共和保护的类、接口及成员生成文档。这与 `javadoc` 的默认行为相同。例如：\n\n\
  ```\njavadoc -protected Class1.java Class2.java Class3.java\n```\n\n# 附录 F\n\n##\
  \ 关于 Math 类\n\nJava 的 `Math` 类是用于执行特定数学操作的静态方法集合。该类位于 `java.lang` 包，因此使用它时不需要 `import`\
  \ 语句。\n\n在第 2 章中，你学习了 `Math.pow` 方法，它返回一个数字幂的值。表 F-1 描述了 `Math` 类的几个方法。\n\n# 表 F-1\
  \ 若干 Math 类方法\n\n| 方法 | 示例用法 | 说明 |\n\n| --- | --- | --- |\n| `abs` | `y = Math.abs(x);`\
  \ | 返回参数的绝对值。该方法可以接受并返回 `double`、`float`、`int` 和 `long` 数据类型的值。 |\n| `acos` | `y\
  \ = Math.acos(x);` | 返回参数的反余弦。参数应是一个角度的余弦。（参数值必须在 −1.0 到 1.0 之间）。返回类型和参数均为 `double`。\
  \ |\n| `asin` | `y = Math.asin(x);` | 返回参数的正弦。参数应是一个角度的正弦。（参数值必须在 −1.0 到 1.0 之间）。返回类型和参数均为\
  \ `double`。 |\n| `atan` | `y = Math.atan(x);` | 返回参数的反正切。参数应是一个角度的正切。返回类型和参数均为 `double`。\
  \ |\n| `cbrt` | `y = Math.cbrt(x);` | 返回参数的立方根。返回类型和参数均为 `double`。注意：此方法在 Java 5\
  \ 中引入。 |\n| `ceil` | `y = Math.ceil(x);` | 返回大于或等于参数的最小整数。返回类型和参数均为 `double`。 |\n\
  | `cos` | `y = Math.cos(x);` | 返回参数的余弦。参数应以弧度表示的角度。返回类型和参数均为 `double`。 |\n| `exp`\
  \ | `y = Math.exp(x);` | 计算参数的指数函数，即 *e*^(*x*)。返回类型和参数均为 `double`。 |\n| `floor`\
  \ | `y = Math.floor(x);` | 返回小于或等于参数的最大整数。返回类型和参数均为 `double`。 |\n| `hypot` | `c\
  \ = Math.hypot(a, b);` | 返回直角三角形的边边的长度。参数 `a` 和 `b` 是三角形另外两条边的长度。返回类型和参数均为 `double`。注意：此方法在\
  \ Java 5 中引入。 |\n| `log` | `y = Math.log(x);` | 返回参数的自然对数。返回类型和参数均为 `double`。 |\n\
  | `pow` | `y = Math.pow(x, z);` | 返回第一个参数的第二个参数幂的值。返回类型和参数均为 `double`。 |\n| `round`\
  \ | `y = Math.round(x);` | 返回参数的值，四舍五入到最近的整数。参数预期为 `double` 或 `float`。如果参数是 `double`，返回类型为\
  \ `long`；如果参数是 `float`，返回类型为 `int`。 |\n| `sin` | `y = Math.sin(x);` | 返回参数的正弦。参数应以弧度表示的角度。返回类型和参数均为\
  \ `double`。 |\n| `sqrt` | `y = Math.sqrt(x);` | 返回参数的平方根。返回类型和参数均为 `double`。 |\n\
  | `tan` | `y = Math.tan(x);` | 返回参数的正切。参数应以弧度表示的角度。返回类型和参数均为 `double`。 |\n| `toDegrees`\
  \ | `y = Math.toDegrees(x);` | 接受弧度角度作为参数。返回转换成角度的角度。参数和返回值均为 `double`。 |\n| `toRadians`\
  \ | `y = Math.toRadians(x);` | 接受角度角度作为参数。返回转换成弧度角度。参数和返回值均为 `double`。 |\n\n\n\n\
  ```java\npackage vehicles;\n\n/**\n * 此类位于 vehicles 包中。\n */\npublic class Car\n\
  {\n  private int passengers;   // 乘客\n  private double topSpeed;  // 最高速度（英里/小时）\n\
  \n  /**\n   * 构造函数\n   */\n  public Car(int passengers, int topSpeed)\n  {\n   \
  \ this.passengers = passengers;\n    this.topSpeed = topSpeed;\n  }\n\n  /**\n \
  \  * toString 方法\n   */\n  public String toString()\n  {\n    return \"Passengers:\
  \ \" + passengers\n        + \"\\nTop Speed: \" + topSpeed + \" miles per hour\"\
  ;\n  }\n}\n```\n\n# 代码列表 G-2 `Truck.java`\n\n```java\npackage vehicles;\n\n/**\n\
  \ * 此类位于 vehicles 包中。\n */\npublic class Truck\n{\n  private double mpg;  // 油油效率（每加仑英）\n\
  \  private double tons;  // 载重能力（吨）\n\n  /**\n   * 构造函数\n   */\n  public Truck(double\
  \ mpg, double tons)\n  {\n    this.mpg = mpg;\n    this.tons = tons;\n  }\n\n  /**\n\
  \   * toString 方法\n   */\n  public String toString()\n  {\n    return \"Fuel economy:\
  \ \" + mpg + \" miles per gallon\"\n        + \"\\nHauling capacity: \" + tons +\
  \ \" tons\";\n  }\n}\n```\n\n注意每个文件的第一行内容如下：\n\n```\npackage vehicles;\n```\n\n\
  `package` 单词是 Java 中的一个关键字，而 `vehicles` 是该类所属的包名。注意该语句以分号结束。此语句告诉编译器文件的内容属于 `vehicles`\
  \ 包。\n\n### 注意\n\n编译器期望包语句是文件中的第一条语句。在其之前允许放置注释和空行。\n\n当一个类是一个包的一部分时，编译器期望该类文件存储在与包名同名的目录中。例如，`Car`\
  \ 和 `Truck` 类是 `vehicles` 包的一部分，因此它们必须存储在名为 `vehicles` 的目录中。通常，`vehicles` 目录会存储在另一个作为包基目录的目录之下。图\
  \ G-1 展示了 Windows 系统上的示例目录结构。`mypackages` 目录是包的基目录。在 `mypackages` 下出现了 `vehicles`\
  \ 目录，它包含了 `Car.java` 和 `Truck.java` 文件。\n\n![在 Windows 上存储包的目录结构示例所示：在 C 冒号斜杠文件下方，mypackages\
  \ 文件夹包含一个 vehicles 文件夹，该文件夹包含 Car.java 和 Truck.java 文件。](img/gfig01.png)\n\n# 图\
  \ G-1 在 Windows 上存储包的目录结构示例\n\n一旦创建了包，就必须通知 Java 编译器其所在位置。你所使用的具体过程取决于你的 Java 编译器和操作系统。你应该咨询你的导师以获取精确细节，但我们将提供在\
  \ Windows、UNIX 或 Linux 环境下使用 Oracle JDK 时需要执行的操作的概概述。\n\nOracle JDK 使用名为 `CLASSPATH`\
  \ 的操作系统环境变量来确定你的包基目录的位置。`CLASSPATH` 环境变量包含一个由一个或多个由分隔符分隔的路径名组成的字符串。要通知编译器你的基目录位置，只需将其路径名添加到\
  \ `CLASSPATH` 环境变量的内容中。\n\n# 在 Windows 下设置 `CLASSPATH`\n\n以下是一个可以在 Windows 命令行用于设置\
  \ `CLASSPATH` 环境变量的示例命令：\n\n```\nset CLASSPATH=C:\\mypackages;\n```\n\n在 `=` 号前后没有空格。在\
  \ Windows 中，多个路径名以分号分隔。此命令将环境变量设置为：\n\n`C:\\mypackages`。\n\n# 在 UNIX 或 Linux 下设置\
  \ `CLASSPATH`\n\n### 注意\n\n在 UNIX 或 Linux 中，多个路径名以冒号分隔。此命令将环境变量设置为：\n\n```bash\n\
  export CLASSPATH=/home/user/project\n```\n\n# 使用 `import` 语句\n\n当包被创建后，必须通知 Java\
  \ 编译器其位置。你所使用的具体过程取决于你的 Java 编译器和你的操作系统。你应该咨询你的导师以获取精确细节，但我们将提供在 Windows、UNIX 或\
  \ Linux 环境下使用 Oracle JDK 时需要执行的操作的概概述。\n\nOracle JDK 使用名为 `CLASSPATH` 的操作系统环境变量来确定你的包基目录的位置。`CLASSPATH`\
  \ 环境变量包含一个由一个或多个由分隔符分隔的路径名组成的字符串。要通知编译器你的基目录位置，只需将其路径名添加到 `CLASSPATH` 环境变量的内容中。\n\
  \n当一个类是一个包的一部分时，编译器期望该类文件存储在与包名同名的目录中。例如，`Car` 和 `Truck` 类是 `vehicles` 包的一部分，因此它们必须存储在名为\
  \ `vehicles` 的目录中。通常，`vehicles` 目录会存储在另一个作为包基目录的目录之下。图 G-1 展示了 Windows 系统上的示例目录结构。`mypackages`\
  \ 目录是包的基目录。在 `mypackages` 下出现了 `vehicles` 目录，它包含了 `Car.java` 和 `Truck.java` 文件。\n\
  \n# 代码列表 G-3 `TruckDemo.java`\n\n```java\nimport vehicles.*;\n\n/**\n * 此程序演示了位于\
  \ vehicles 包中的\n * 类。\n */\npublic class TruckDemo\n{\n  public static void main(String[]\
  \ args)\n  {\n    Car roadster = new Car(2, 155);\n    Truck pickUp = new Truck(18,\
