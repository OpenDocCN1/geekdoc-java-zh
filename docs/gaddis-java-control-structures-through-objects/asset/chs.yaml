  \n## 图 5-12 执行第 36 行后，`name` 和 `str` 引用不同的对象\n\n在第 9 章中，我们将详细讨论 `String` 对象的不可变性。在此之前，只需记住这一点：`String`\
  \ 对象不能更改。每当你使用 `=` 运算符将字符串字面量赋值给 `String` 引用变量时，内存中都会创建一个新的 `String` 对象。\n\n# 在文档注释中使用\
  \ @param 标签\n\n在编写方法的文档注释时，你可以使用 `@param` 标签为每个参数提供描述。当 `javadoc` 工具在方法的文档注释中看到\
  \ `@param` 标签时，它知道接下来将出现参数变量的文档。本章[源代码](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/downloads/Source_Code.zip)中的\
  \ `TwoArgs2.java` 文件包含以下方法，它在文档注释使用了 `@param` 标签：\n\n```\n /**\n      The showSum\
  \ 方法显示两个数字之和。\n      @param num1 第一个数字。\n      @param num2 第二个数字。\n   */\n   public\
  \ static void showSum(double num1, double num2)\n   {\n     double sum;  // 用于存储和\n\
  \     sum = num1 + num2;\n     System.out.println(\"The sum is \" + sum);\n   }\n\
  ```\n\n`@param` 标签注释的通用格式如下：\n\n```\n@param  parameterName Description\n```\n\n\
  在通用格式中，`parameterName` 是参数名，`Description` 是参数的描述。记住关于 `@param` 标签注释的以下几点：\n\n* 方法文档注释中所有的\
  \ `@param` 标签必须出现在方法的总体描述之后。\n* 描述可以跨多行。它结束于文档注释的末尾（`*/`）或另一个标签的开始处。\n\n当方法的文档注释包含一个或多个\
  \ `@param` 标签时，`javadoc` 工具会在方法的文档中创建一个 `Parameters` 部分。这里将列出方法参数的描述。图 5-13 展示了\
