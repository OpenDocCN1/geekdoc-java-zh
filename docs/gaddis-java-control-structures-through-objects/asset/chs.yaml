  \n## 3.5 逻辑运算符\n\n**概念：** 逻辑运算符将两个或多个关系表达式连接为一个，或者反转表达式的逻辑。\n\nJava 提供了两个二元逻辑运算符\
  \ `&&` 和 `||`，用于将两个 `boolean` 表达式组合为一个表达式。它还提供了一个一元运算符 `!`，用于反转 `boolean` 表达式的真值。表\
  \ 3-4 描述了这些逻辑运算符。\n\n### 表 3-4 逻辑运算符\n\n| 运算符 | 含义 | 效果 |\n| --- | --- | --- |\n\
