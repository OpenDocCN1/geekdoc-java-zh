  \n`QuickSort` 算法是由 C. A. R. Hoare 于 1960 年开发的一种流行的通用排序程序。它通过将数组分为两个子列表来对其排序。子列表之间是一个选定的值，称为\
  \ `pivot`（基准）。这在图 J-1 中所示。\n\n![子列表和基准的图如下。一个矩形数组被分为两个子列表如下：子列表 1、子列表 2。均匀划分子列表的部分是标记为\
  \ Pivot 的选定值区域。](img/jfig01.png)\n\n# 图 J-1 子列表和基准\n\n注意图中，子列表 1 位于 `pivot` 的左侧（之前），而子列表\
  \ 2 位于 `pivot` 的右侧（之后）。一旦选定了 `pivot` 值，算法将重新排列数组，使得所有值小于 `pivot` 的元素位于其之前，所有值大于\
  \ `pivot` 的元素位于其之后。然后将此过程递归地应用于子列表上，直到整个数组完成排序。\n\n`quickSort` 方法实现如下：\n\n```java\n\
  public static void quickSort(int[] array, int start, int end) {\n    if (start <\
  \ end) {\n        int pivotIndex = partition(array, start, end);\n        quickSort(array,\
  \ start, pivotIndex - 1);\n        quickSort(array, pivotIndex + 1, end);\n    }\n\
  }\n```\n\n`partition` 方法选择一个 `pivot` 并重新排列数组：\n\n```java\nprivate static int partition(int[]\
  \ array, int start, int end) {\n    int mid = (start + end) / 2;\n    swap(array,\
  \ start, mid);\n    int pivotValue = array[start];\n    int pivotIndex = start;\n\
  \n    for (int scan = start + 1; scan <= end; scan++) {\n        if (array[scan]\
  \ < pivotValue) {\n            pivotIndex++;\n            swap(array, pivotIndex,\
  \ scan);\n        }\n    }\n    swap(array, start, pivotIndex);\n    return pivotIndex;\n\
  }\n```\n\n`swap` 方法交换数组中的两个元素：\n\n```java\nprivate static void swap(int[] array,\
  \ int a, int b) {\n    int temp = array[a];\n    array[a] = array[b];\n    array[b]\
  \ = temp;\n}\n```\n\n\n\n\n\n```java\n/**\n * 此程序演示了快速排序算法。\n */ \npublic class\
  \ QuickSortDemo\n{\n    /**\n     * main 方法\n     */\n    public static void main(String[]\
  \ args)\n    {\n       int[] array = { 7, 3, 9, 2, 0, 1, 8, 4, 6, 5 };\n\n     \
  \   // 显示当前的数组。\n        System.out.println(\"排序前:\");\n        for (int i = 0;\
  \ i < 10; i++)\n           System.out.print(array[i] + \" \");\n        System.out.println();\n\
  \n        // 对数组进行排序。\n        quickSort(array, 0, 9);\n\n        // 再次显示数组。\n \
  \       System.out.println(\"排序后:\");\n        for (int i = 0; i < 10; i++)\n  \
  \         System.out.print(array[i] + \" \");\n        System.out.println();\n \
  \   }\n\n    /**\n     *  quickSort 方法使用快速排序算法对\n     *  从 array[start] 到 array[end]\
  \ 的数组进行排序。\n     */\n    public static void quickSort(int array[], int start, int\
  \ end)\n    {\n        int pivotPoint;\n\n        if (start < end)\n        {\n\
  \           // 获取基准点。\n           pivotPoint = partition(array, start, end);\n\n\
  \           // 排序第一个子列表。\n           quickSort(array, start, pivotPoint - 1);\n\n\
  \           // 排序第二个子列表。\n           quickSort(array, pivotPoint + 1, end);\n  \
  \      }\n    }\n\n    /**\n     *  partition 方法选择数组中间的值作为\n     *  基准。重新排列列表，使得所有小于基准的值\n\
  \     *  都在其左侧，所有大于基准的值都在其右侧。\n     */\n    private static int partition(int array[],\
  \ int start, int end)\n    {\n        int pivotValue, pivotIndex, mid;\n       \
  \ mid = (start + end) / 2;\n        swap(array, start, mid);\n        pivotValue\
  \ = array[start];\n        for (int scan = start + 1; scan <= end; scan++)\n   \
  \     {\n           if (array[scan] < pivotValue)\n           {\n              pivotIndex++;\n\
  \              swap(array, pivotIndex, scan);\n           }\n        }\n       \
  \ swap(array, start, pivotIndex);\n        return pivotIndex;\n    }\n\n    /**\n\
  \     *  swap 方法交换 array[a] 处的元素与\n     *  array[b] 处的元素。\n     */\n    private\
  \ static void swap(int[] array, int a, int b)\n    {\n        int temp;\n      \
  \  temp = array[a];\n        array[a] = array[b];\n        array[b] = temp;\n  \
  \  }\n}\n```\n\n程序输出\n\n```\n排序前:\n7 3 9 2 0 1 8 4 6 5 \n排序后:\n0 1 2 3 4 5 6 7 8\
