  \n# 具有多个条件执行语句\n\n之前的 `if` 语句示例是条件执行单个语句。`if` 语句也可以条件执行执行一组语句，只要它们被包含在一组括号中。使用大括号包裹一组语句可以创建一个块。例如：\n\
  \n```\nif (sales > 50)\n{\n    bonus = true;\n    commissionRate = 0.1;\n}\n```\n\
  \n如果 `sales` 大于 50，此代码将执行括号内的所有语句。如果漏掉了大括号，`if` 语句只会执行其后的第一个语句。图 3-6 展示了这一点。\n\n\
  # 图 3-6 缺少大括号的 if 语句\n\n![为了确定 if 语句使用大括号。](img/03fig05.png)\n\n### 标志 (Flags)\n\
  \n标志是一个 `boolean` 变量，用于指示某些条件是否存在。当它被设置为 `false` 时，表示条件尚不存在。例如，假设一个之前的程序有一个名为 `highScore`\
  \ 的 `boolean` 变量。通过以下代码指示获得了高分：\n\n```java\nif (average > 95)\n   highScore = true;\n\
  ```\n\n稍后，程序可能会使用以下代码来测试是否获得了高分：\n\n```java\nif (highScore)\n   System.out.println(\"\
  That's a high score!\");\n```\n\n### 比较字符\n\n你可以使用关系运算符测试字符数据以及数字。例如，假设 `ch` 是一个\
  \ `char` 变量，以下代码使用 `==` 运算符将其与字符 ‘A’ 进行比较：\n\n```java\nif (ch == 'A')\n   System.out.println(\"\
  The letter is A.\");\n```\n\n`!=` 运算符也可以用于字符测试不等性。例如，以下语句判断 `char` 变量是否等于字母 ‘A’：\n\
  \n```java\nif (ch != 'A')\n   System.out.println(\"Not the letter A.\");\n```\n\n\
  \n\n\n在 Unicode 中，大写字母在小写字母之前，因此‘A’（65）的数值代码小于‘a’（97）的数值代码。此外，空格字符（代码 32）位于所有字母之前。\n\
