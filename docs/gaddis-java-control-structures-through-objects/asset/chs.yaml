  ../components/metrodigi/ch10-inline_self_quiz_v1.0.0-37/index.html\n\n# 10.11 函数式接口和\
  \ Lambda 表达式\n\n概念：函数式接口是一个只有一个抽象方法的接口。你可以使用一种特殊类型的表达式，即 Lambda 表达式（lambda expression），来创建一个实现函数式接口的对象。\n\
  \nJava 8 引入了两个新功能，它们共同工作以简化代码，特别是在你可能使用匿名内部类的情况下。这些新功能是函数式接口和 Lambda 表达式。*函数式接口*简单来说只有一个抽象方法的接口。例如，让我们再次看看之前在匿名内部类章节中讨论过的\
  \ `IntCalculator` 接口。因为它只有一个抽象方法，所以它被认为函数式接口。为了方便起见，代码列表 10-44 显示了该接口的代码。\n\n```\n\
  1  interface IntCalculator\n 2  {\n 3     int calculate(int number);\n 4  }\n```\n\
  \n### 代码列表 10-44 `(IntCalculator.java)`\n\n该接口的名称为 `IntCalculator`，它指定了一个名为 `calculate`\
  \ 的方法。`calculate` 方法接受一个 `int` 参数，并返回一个 `int` 值。\n\n由于 `IntCalculator` 是函数式接口，我们不需要费力定义一个实现接口的类。我们甚至不需要使用匿名内部类。相反，我们可以使用*Lambda\
  \ 表达式*（lambda expression）来创建一个实现接口的对象并重写它的抽象方法。\n\n你可以将 Lambda 表达式认为是一个匿名方法，或者没有名称的方法。和普通方法一样，Lambda\
  \ 表达式可以接受参数并返回值。这是一个接收一个参数并返回值的简单 Lambda 表达式的通用格式：\n\n```\nparameter -> expression\n\
  ```\n\n在这种通用格式中，Lambda 表达式以参数变量开始，后面跟着一个值的表达式。这是一个例子：\n\n```\nx -> x * x\n```\n\n\
  `->` 运算符左侧的 `x` 是参数变量的名字，`->` 运算符右侧的表达式 `x * x` 是返回的值。\n\n这个 Lambda 表达式就像一个具有参数变量\
  \ `x` 的方法并返回 `x * x`。\n\n我们可以使用这个 Lambda 表达式创建一个实现 `IntCalculator` 接口的对象。这是一个例子：\n\
  \n```\nIntCalculator square = x -> x * x;\n```\n\n在 = 符号的左侧，我们声明了一个名为 `square` 的\
  \ `IntCalculator` 引用变量。在 = 符号的右侧，我们有一个创建一个后续特征对象的 Lambda 表达式：\n- 因为我们将对象赋值给 `IntCalculator`\
  \ 引用变量，该对象自动实现了 `IntCalculator` 接口。\n- 因为 `IntCalculator` 接口只有一个抽象方法（名为 `calculate`），Lambda\
  \ 表达式将用于实现这唯一的方法。\n- Lambda 表达式中使用的参数 `x` 代表传递给 `calculate` 方法的参数。我们不需要指定 `x` 的数据类型，因为编译器会确定。因为\
  \ `calculate` 方法（在 `IntCalculator` 接口中）有一个 `int` 参数，Lambda 表达式中的参数 `x` 将自动变为 `int`。\n\
  - 表达式 `x * x` 是从 `calculate` 方法返回的值。\n\n代码列表 10-45 显示了一个完整程序，它使用之前所示的语句来创建对象。\n\n\
  \n\n\n\n```java\nimport java.util.Scanner;\n\n/**\n  This program demonstrates a\
  \ simple\n  lambda expression.\n */\n\npublic class LambdaDemo\n{\n    public static\
  \ void main(String[] args)\n    {\n       int num;\n\n       // Create a Scanner\
  \ object for keyboard input.\n       Scanner keyboard = new Scanner(System.in);\n\
  \n       // Create an object that implements IntCalculator.\n       IntCalculator\
  \ square = x -> x * x;\n\n       // Get a number from the user.\n       System.out.print(\"\
  Enter an integer number: \");\n       num = keyboard.nextInt();\n\n       // Display\
  \ the square of the number.\n       System.out.println(\"The square is \" + square.calculate(num));\n\
  \    }\n}\n```\n\n带有示例输入的程序输出（以加粗显示）\n\n```\nEnter an integer number: 5 [Enter]\n\
  The square is 25\n```\n\n# 代码列表 10-45 `(LambdaDemo.java)`\n\n让我们仔细观察这个程序：\n\n* \
  \  第 12 行声明了一个名为 `num` 的 `int` 变量，用于用于存储用户输入。\n*   第 15 行创建了一个用于键盘输入的 `Scanner`\
  \ 对象。\n*   第 18 行使用 lambda 表达式创建一个实现 `IntCalculator` 接口的对象。使用一个名为 `square` 的变量来引用该对象。该对象的\
  \ `calculate` 方法将返回方法参数的平方。\n*   第 21 行提示用户输入一个整数，第 22 行从键盘读取该数字。该数字被赋值给 `num` 变量。\n\
  *   第 25 行调用 `square` 对象的 `calculate` 方法，并在消息中显示返回值。\n\nLambda 表达式提供了一种轻松创建和实例化匿名内部类的方法。如果你将代码列表\
  \ 10-45 与代码列表 10-43 中所示的程序进行比较，你会发现 lambda 表达式比匿名内部类的声明要简洁得多。\n\n# 不返回值的 Lambda\
  \ 表达式\n\n如果函数接口的抽象方法是 `void`（不返回值），则你与该接口一起使用的任何 lambda 表达式也应该是 `void`。这里有一个示例：\n\
  \n```\nx -> System.out.println(x);\n```\n\n该 lambda 表达式有一个参数 `x`。当调用该表达式时，它会显示 `x`\
  \ 的值。\n\n# 多参数 Lambda 表达式\n\n如果函数接口的抽象方法有多个参数，你与该接口一起使用的任何 lambda 表达式也必须有多个参数。要在\
  \ lambda 表达式中使用多个参数，只需编写逗号分隔的列表并将列表括在括号内。这里有一个示例：\n\n```\n(a, b) -> a + b;\n```\n\
  \n该 lambda 表达式有两个参数 `a` 和 `b`。该表达式返回 `a + b` 的值。\n\n# 无参数 Lambda 表达式\n\n如果函数接口的抽象方法没有参数，你与该接口一起使用的任何\
  \ lambda 表达式也必须没有参数。只需编写一对空括号作为参数列表，如下所示：\n\n```\n() -> System.out.println();\n\
  ```\n\n当调用该 lambda 表达式时，它只是打印一个空行。\n\n# 显式声明参数的数据类型\n\n你不需要指定 lambda 表达式参数的数据类型，因为编译器会从接口的抽象方法头中确定它。但是，如果你愿意，也可以显式地声明参数的数据类型。这里有一个示例：\n\
  \n```\n(int x) -> x * x;\n```\n\n注意，参数声明（在 `->` 运算符的左侧）必须括在括号内。这里是另一个两个参数的示例：\n\n\
  ```\n(int a, int b) -> a + b;\n```\n\n# 在 Lambda 表达式体内多个语句\n\n你可以在 lambda 表达式体中编写多个语句，但如果你这样做，就必须将这些语句括在大括号中，并且如果表达式有返回值，你必须编写一个\
  \ `return` 语句。这里有一个示例：\n\n```java\n(int x) -> {\n    int a = x * 2;\n    return\
  \ a;\n};\n```\n\n# 在 Lambda 表达式访问变量\n\nLambda 表达式可以访问在封装作用域中声明的变量，只要这些变量是 `final`\
  \ 或有效最终（effectively final）的。*有效*最终的变量是指其值从未被改变过的变量。在代码列表 10-46 中，`main` 方法使用 lambda\
  \ 表达式访问了一个名为 `factor` 的 `final` 变量。\n\n```java\nimport java.util.Scanner;\n\n/**\n\
  \  This program demonstrates a simple\n  lambda expression.\n */\n\npublic class\
  \ LambdaDemo\n{\n    public static void main(String[] args)\n    {\n       final\
  \ int factor;\n       int num;\n\n       // Create a Scanner object for keyboard\
  \ input.\n       Scanner keyboard = new Scanner(System.in);\n\n       // Create\
  \ an object that implements IntCalculator.\n       IntCalculator square = x -> x\
  \ * x;\n\n       // Get a number from the user.\n       System.out.print(\"Enter\
  \ an integer number: \");\n       num = keyboard.nextInt();\n\n       // Display\
  \ the square of the number.\n       System.out.println(\"The square is \" + square.calculate(num));\n\
  \    }\n}\n```\n\n带有示例输入的程序输出（以加粗显示）\n\n```\nEnter an integer number: 5 [Enter]\n\
  The square is 25\n```\n\n# 代码列表 10-45 `(LambdaDemo.java)`\n\n如果我们从第 12 行的变量声明中删除\
  \ `final` 字，程序仍然可以编译并运行。这是因为 `factor` 变量从未被修改。\n\n# 检查点 10.49\n\ncomponents/metrodigi/ch10-inline_self_quiz_v1.0-38/index.html\n\
