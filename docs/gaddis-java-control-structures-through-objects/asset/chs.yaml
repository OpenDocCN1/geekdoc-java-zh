  \n# 12.5 关于 `HBox`、`VBox` 和 `GridPane` 布局容器更多\n\n概念：布局容器提供了用于微调控件排列方式的方法。\n\n我们简要介绍了\
  \ `HBox`、`VBox` 和 `GridPane` 布局容器。在本节中，我们将更仔细地观察这些布局容器，并讨论微调它们排列控件的方法。\n\n# `HBox`\
  \ 布局容器\n\n## WatchHBox 布局容器\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/70OWU_CQlzKGYpQC5WFMHfA7xxijfSsh`](https://mediaplayer.pearsoncmg.com/assets/_video.true/70OWU_CQlzKGYpQC5WFMHfA7xxijfSsh)\n\
  \n你已经见过使用 `HBox` 布局容器的程序，它将控件排列在单行水平上。你可以通过将这些控件的引用作为参数传递给 `HBox` 构造函数，向 `HBox`\
  \ 添加一个或多个控件。例如，代码列表 12-5 中的程序在 `HBox` 中显示了三张图像。程序的输出如图 12-15 所示。\n\n```\n 1  import\
  \ javafx.application.Application;\n  2  import javafx.stage.Stage;\n  3  import\
  \ javafx.scene.Scene;\n  4  import javafx.scene.layout.HBox;\n  5  import javafx.scene.image.Image;\n\
    6  import javafx.scene.image.ImageView;\n  7\n  8  /**\n  9    This program displays\
  \ images in an Hbox.\n 10  */\n 11\n  12  public class HBoxImages extends Application\n\
    13  {\n  14     public static void main(String[] args)\n  15     {\n  16     \
  \   // Launch the application.\n  17        launch(args);\n  18     }\n  19\n  20\
  \     @Override\n  21     public void start(Stage primaryStage)\n  22     {\n  23\
  \        // Create the Image objects.\n  24        Image moonImage = new Image(\"\
  file:Moon.jpg\");\n  25        Image shipImage = new Image(\"file:Ship.jpg\");\n\
    26        Image sunsetImage = new Image(\"file:Sunset.jpg\");\n  27\n  28    \
  \    // Create the ImageView objects.\n  29        ImageView moonIView = new ImageView(moonImage);\n\
    30        ImageView shipIView = new ImageView(shipImage);\n  31        ImageView\
  \ sunsetIView = new ImageView(sunsetImage);\n  32\n  33        // Resize the moon\
  \ image, preserving its ratio.\n  34        moonIView.setFitWidth(200);\n  35  \
  \      moonIView.setPreserveRatio(true);\n  36\n  37        // Resize the ship image,\
  \ preserving its ratio.\n  38        shipIView.setFitWidth(200);\n  39        shipIView.setPreserveRatio(true);\n\
    40\n  41        // Resize the sunset image, preserving its ratio.\n  42      \
  \  sunsetIView.setFitWidth(200);\n  43        sunsetIView.setPreserveRatio(true);\n\
    44\n  45        // Put the ImageViews in an HBox.\n  46        HBox hbox = new\
  \ HBox(moonIView, shipIView, sunsetIView);\n  47\n  48        // Create a Scene\
  \ with the HBox as its root.\n  49        Scene scene = new Scene(hbox);\n  50\n\
    51        // Add the Scene to the Stage.\n  52        primaryStage.setScene(scene);\n\
    53\n  54        // Set the stage title.\n  55        primaryStage.setTitle(\"\
  Images\");\n  56\n  57        // Show the window.\n  58        primaryStage.show();\n\
        }\n# 代码列表 12-5 (`HBoxImages.java`)\n\n# 图 12-15 HBox \n![代码列表 12-15 的输出在窗口中显示了三张图像](img/12fig15.png)图\
  \ 12-15 文字\n\n让我们仔细观察代码：\n* 第 24 到 26 行创建了三个 `Image` 对象，并加载了图像文件 `Moon.jpg`、`Ship.jpg`\
  \ 和 `Sunset.jpg`。\n* 第 29 到 31 行为加载的图像创建了三个 `ImageView` 对象。`ImageView` 对象的名为 `moonIView`、`shipIView`\
  \ 和 `sunsetIView`。\n* 第 34 行将 `moonIView` 对象的宽度设置为 200 像素。第 35 行使其保持纵比例。因此，图像的高度将自动缩放以确保不变形。\n\
  * 第 38 行将 `shipIView` 对象的宽度设置为 200 像素。第 39 行使其保持纵比例。因此，图像的高度将自动缩放以确保不变形。\n* 第 42\
  \ 行将 `sunsetIView` 对象的宽度设置为 200 像素。第 43 行使其保持纵比例。因此，图像的高度将自动缩放以确保不变形。\n* 第 46 行创建了一个\
  \ `HBox` 容器，并将其添加了 `moonIView`、`shipIView` 和 `sunsetIView` 对象。\n* 第 49 行创建了一个以 `HBox`\
  \ 为根节点的 `Scene` 对象。\n* 第 52 行将 `Scene` 设置到阶段（Stage）。\n* 第 55 行设置了将在窗口标题栏显示的文本。\n\
  * 第 58 行显示程序的窗口。\n\n图 12-16 描绘了代码列表 12-5 的场景图。\n\n![代码列表 12-5 H Box Images 程序的场景图。顶层是根节点，称为\
  \ h box，它连接到三个子叶节点，内容如下：moon I View、ship I View、sunset I View。](img/12fig16.png)\n\
  \n# 图 12-16 代码列表 12-5 `HBoxImages` 程序的场景图\n\n## 间距 (Spacing)\n\n注意在图 12-15 中，图像显示时之间没有间隙。如果我们希望在\
  \ `HBox` 的控件之间出现一些间隙，可以可选地将一个间距值作为第一个参数传递给 `HBox` 构造函数。以下我们可能如何编写代码列表 12-5 中第 46\
  \ 行语句的示例：\n\n```\nHBox hbox = new HBox(10, moonIView, shipIView, sunsetIView);\n\
  ```\n\n如果传递给 `HBox` 构造函数的第一个参数是一个数字，则该值被用作容器内水平控件之间的像素数。在这个示例中，图像将以具有 10 像素间隙的形式显示。这将导致程序的窗口如图\
