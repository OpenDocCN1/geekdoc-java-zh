   {\n    boolean status;\n\n    // Determine whether this object's symbol and\n \
  \   // sharePrice fields are equal to object2's\n   // symbol and sharePrice fields.\n\
     if (symbol.equals(object2.symbol) &&\n      sharePrice == object2.sharePrice)\n\
        status = true;   // Yes, the objects are equal.\n   else\n      status = false;\
  \  // No, the objects are not equal.\n\n   // Return the value in status.\n   return\
  \ status;\n }\n```\n\n`equals` 方法接受一个 `Stock` 对象作为参数。参数变量 `object2` 将引用作为传递的对象。`if`\
  \ 语句执行以下比较：如果调用对象的 `symbol` 字段等于 `object2` 的 `symbol` 字段，且调用对象的 `sharePrice` 字段等于\
  \ `object2` 的 `sharePrice` 字段，则这两个对象包含相同的值。在这种情况下，局部变量 `status`（一个 `boolean` 类型）被设置为\
  \ `true`。否则，`status` 被设置为 `false`。最后，方法返回 `status` 变量的值。\n\n注意，该方法可以直接访问 `object2`\
  \ 的 `symbol` 和 `sharePrice` 字段。由于 `object2` 引用一个 `Stock` 对象，且 `equals` 方法是 `Stock`\
  \ 类的成员，因此该方法允许访问 `object2` 的私有字段。\n\n代码列表 8-10 展示了 `equals` 方法。（此文件也存储在源代码文件夹 Chapter\
  \ 08\\Stock Class Phase 2 中。）\n\n\n\n```java\n 1  /**\n  2     This program uses\
  \ the Stock class's equals\n  3     method to compare two Stock objects.\n  4  */\n\
    5 \n  6  public class StockCompare\n  7  {\n  8     public static void main(String[]\
  \ args)\n  9     {\n  10        // Create two Stock objects with the same values.\n\
    11        Stock company1 = new Stock(\"XYZ\", 9.62);\n  12        Stock company2\
  \ = new Stock(\"XYZ\", 9.62);\n  13 \n  14        // Use the equals method to compare\
  \ the objects.\n  15        if (company1.equals(company2))\n  16           System.out.println(\"\
  Both objects are the same.\");\n  17        else\n  18           System.out.println(\"\
  The objects are different.\");\n  19     }\n  20  }\n```\n\n程序输出\n\n```\nBoth objects\
  \ are the same.\n```\n\n# 代码列表 8-10 `(StockCompare.java)`\n\n如果你希望能够比较给定类的对象，你应该始终为该类编写一个\
  \ `equals` 方法。\n\n### 注意\n\n每个类都自动拥有一个 `equals` 方法，其工作原理与 `==` 运算符相同。如果你没有提供自己的\
  \ `equals` 方法，该方法会在需要时被调用。你将在第 10 章 中学习到更多内容。\n\n# 8.6 复制对象的方法\n\n概念：通过为类配备一个返回对象副本的方法，可以简化复制对象的过程。\n\
  \n你不能通过简单的赋值语句来创建对象的副本，就像处理基本类型变量那样。例如，查看以下代码：\n\n```java\nStock company1 = new\
  \ Stock(\"XYZ\", 9.62);\n Stock company2 = company1;\n```\n\n第一条语句创建一个 `Stock` 对象并将其地址赋值给变量\
  \ `company1`。第二条语句将 `company1` 赋值给 `company2`。这并没有创建 `company1` 所引用对象的副本。相反，它复制了存储在\
  \ `company1` 中的地址，并将该地址存储在 `company2` 中。在该语句执行后，`company1` 和 `company2` 变量将引用同一个对象。这在图\
  \ 8-10 中均所示。\n\n![company 1 和 company 2 变量都持有同一个 Stock 对象的地址，该对象的符号为引号中的字母 X Y Z，股票价格为\
  \ 9.62。](img/08fig10.png)\n\n# 图 8-10 两个变量引用同一个对象\n\n这种类型的赋值操作被称为引用复制，因为只复制了对象的地址，而不是对象本身。要复制对象本身，你必须创建一个新对象，然后设置该对象的字段值。这个过程可以通过为类配备一个返回对象副本的方法来简化。\n\
  \n在源代码文件夹 08\\Stock Class Phase 2 中，你会找到 `Stock` 类的另一个版本。该版本的类有一个名为 `copy` 的方法，代码如下：\n\
  \n```java\npublic Stock copy()\n {\n    // 创建一个新对象\n    // 将新对象的字段\n    设置为与被复制对象相同的值。\n\
      Stock copyObject = new Stock();\n\n    // 返回对象的引用\n    return copyObject;\n\
   }\n```\n\n`copy` 方法创建一个新的 `Stock` 对象，并将调用对象的 `symbol` 和 `sharePrice` 字段传递给构造函数。程序代码列表\
  \ 8-11 展示了 `copy` 方法。\n\n```java\n 1  /**\n  2     This program uses the Stock class's\
  \ equals\n  3     method to compare two Stock objects.\n  4  */\n  5 \n  6  public\
  \ class ObjectCopy\n  7  {\n  8     public static void main(String[] args)\n  9\
  \     {\n  10        // Create a Stock object.\n  11        Stock company1 = new\
  \ Stock(\"XYZ\", 9.62);\n  12 \n  13        // Declare a Stock variable\n  14  \
  \      Stock company2;\n  15 \n  16        // Make company2 reference a copy of\
  \ the object\n  17        company2 = company1.copy();\n  18 \n  19        // Display\
  \ the contents of both objects.\n  20        System.out.println(\"Company 1:\\n\"\
  \ + company1);\n  21        System.out.println();\n  22        System.out.println(\"\
  Company 2:\\n\" + company2);\n  23 \n  24        // Confirm that we have two objects.\n\
    25        if (company1 == company2)\n  26        {\n  27           System.out.println(\"\
  The company1 and company2 \"\n  28                      variables reference the\
  \ same object.\");\n  29        }\n  30        else\n  31        {\n  32       \
  \    System.out.println(\"The company1 and company2 \"\n  33                   \
  \   variables reference different objects.\");\n  34        }\n  35     }\n  36\
  \  }\n```\n\n程序输出\n\n```\nCompany 1:\nTrading symbol: XYZ\nShare price: 9.62\n\n\
  Company 2:\nTrading symbol: XYZ\nShare price: 9.62\nThe company1 and company2 variables\
  \ reference different objects.\n```\n\n# 代码列表 8-11 `(ObjectCopy.java)`\n\n# 拷贝构造函数\n\
  \n创建对象副本的另一种方法是使用拷贝构造函数。拷贝构造函数简单接受同类对象作为参数的构造函数。它使被创建的对象成为所传递对象的副本。\n\n在源代码文件夹 08\\\
  Stock Class Phase 4 中，你会找到 `Stock` 类的另一个版本。该版本的类有一个拷贝构造函数。拷贝构造函数的代码如下（类的其他部分未更改，因此只显示了拷贝构造函数）：\n\
  \n```java\npublic Stock(Stock object2)\n {\n    symbol = object2.symbol;\n    sharePrice\
  \ = object2.sharePrice;\n }\n```\n\n注意，构造函数接受一个 `Stock` 对象作为参数。参数变量 `object2` 将引用作为传递的对象。构造函数将\
  \ `object2` 的 `symbol` 和 `sharePrice` 字段中的值复制到被创建对象的 `symbol` 和 `sharePrice` 字段中。\n\
  \n\n\n\n以下代码段演示了拷贝构造函数。它创建了一个由变量 `company1` 引用的 `Stock` 对象。然后，它创建了另一个由变量 `company2`\
  \ 引用的 `Stock` 对象。`company2` 引用的对象是 `company1` 引用对象的拷贝。\n\n```\n// Create a Stock\
  \ object.\nStock company1 = new Stock(\"XYZ\", 9.62);\n// Create another Stock object\
  \ that is a copy of the company1 object.\nStock company2 = new Stock(company1);\n\
  ```\n\n# 检查点 8.11\n\n跳转到../components/metrodigi/ch08-inline_self_quiz_v1.0.0-10/index.html\n\
  \n# 8.7 聚合 (Aggregation)\n\n概念：当一个类的实例是另一个类的字段时，就发生了聚合。\n\n在现实生活中，对象经常由其他对象组成。例如，一栋房子是由门对象、窗户对象、墙壁对象等组成的。正是所有这些对象的组合构成了一个房子对象。\n\
  \n# 聚合视频 (WatchAggregation)\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/secs_gaddis_6_vn_08_02_Aggregation`](https://mediaplayer.pearsoncmg.com/assets/_video.true/secs_gaddis_6_vn_08_02_Aggregation)\n\
  \n在设计软件时，从其他对象创建一个对象有时是有意义的。例如，假设你需要一个对象来代表你在大学修读的一门课程。你决定创建一个 `Course` 类，该类将包含以下信息：\n\
  \n* 课程名称\n* 讲师的姓、名和办公室号码\n* 教科的标题、作者和出版社\n\n除了课程名称外，该类还将持有与讲师和教材相关的条目。你可以在 `Course`\
  \ 类中为这些条目设置字段。然而，一个良好的设计原则是将相关的项目分离到它们各自的类中。在这个示例中，可以创建一个 `Instructor` 类来存储与讲师相关的数据，并创建一个\
  \ `TextBook` 类来存储与教材相关的数据。然后，这些类的实例可以作为 `Course` 类中的字段使用。\n\n让我们仔细查看这可能是如何实现的。图\
  \ 8-11 显示了 `Instructor` 类的 UML 图。为了保持简单，该类仅具有以下方法：\n\n* 一个构造函数，接受用于讲师的姓、名和办公室号码的参数\n\
  * 一个拷贝构造函数\n* 一个 `set` 方法，用于设置该类的所有字段\n* 一个 `toString` 方法\n\n# 图 8-11 `Instructor`\
  \ 类的 UML 图\n\n![Instructor 类的 UML 图被分为三个矩形区域。](img/08fig11.png)图 8-11 完整备用文本\n\n\
  `Instructor` 类的代码显示在代码列表 8-12 中。\n\n```java\n 1  /**\n 2     此类存储关于讲师的数据。\n 3  */\n\
  \ 4 \n 5  public class Instructor\n 6  {\n 7     private String lastName;      \
  \  // 姓\n 8     private String firstName;       // 名\n 9     private String officeNumber;\
  \    // 办公室号码\n10 \n 11     /**\n 12        此构造函数初始化姓、\n 13        名和办公室号码。\n 14\
  \        @param lname 讲师的姓。\n 15        @param fname 讲师的。\n 16        @param office\
  \ 办公室号码。\n 17     */\n 18 \n 19     public Instructor(String lname, String fname,\n\
  \ 20                       String office)\n 21     {\n 22        lastName = lname;\n\
  \ 23        firstName = fname;\n 24        officeNumber = office;\n 25     }\n 26\
  \ \n 27     /**\n 28        拷贝构造函数将对象初始化为\n 29        为另一个 Instructor 对象的拷贝。\n 30\
  \        @param object2 要拷贝的对象。\n 31     */\n 32 \n 33     public Instructor(Instructor\
  \ object2)\n 34     {\n 35        lastName = object2.lastName;\n 36        firstName\
  \ = object2.firstName;\n 37        officeNumber = object2.officeNumber;\n 38   \
  \  }\n 39 \n 40     /**\n 41        set 方法为每个字段设置一个值。\n 42        @param lname 讲师的姓。\n\
  \ 43        @param fname 讲师的名。\n 44        @param office 办公室号码。\n 45     */\n 46\
  \ \n 47     public void set(String lname, String fname,\n 48          String office)\n\
  \ 49     {\n 50        lastName = lname;\n 51        firstName = fname;\n 52   \
  \     officeNumber = office;\n 53     }\n 54 \n 55     /**\n 56        toString\
  \ 方法\n 57        @return 包含讲师\n 58        信息的字符串。\n 59     */\n 60 \n 61     public\
  \ String toString()\n 62     {\n 63        // 创建一个表示对象的字符串。\n 64        String str\
  \ = \"Last Name: \" + lastName +\n 65                    \"\\nFirst Name: \" + firstName\
  \ +\n 66                    \"\\nOffice Number: \" + officeNumber;\n 67 \n 68  \
  \      // 返回字符串。\n 69        return str;\n 70     }\n 71  }\n```\n\n# 代码列表 8-12\
  \ `Instructor.java`\n\n图 8-12 显示了 `TextBook` 类的 UML 图。与之前一样，我们保持该类简单。它拥有的方法是构造函数、拷贝构造函数、`set`\
  \ 方法和 `toString` 方法。`TextBook` 类的代码显示在代码列表 8-12 中。\n\n![Instructor 类的 UML 图被分为三个区域。](img/08fig11.png)图\
