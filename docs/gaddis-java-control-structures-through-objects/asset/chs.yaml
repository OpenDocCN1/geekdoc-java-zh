  \n在执行除法之前，会测试 `number2` 的值。如果用户输入 0，则执行由 `if` 子句控制的语句块，显示指示程序无法执行除以零的消息。否则，由 `else`\
  \ 子句接管，将 `number1` 除以 `number2` 并显示结果。图 3-7 显示了 `if`-`else` 语句的逻辑。\n\n### 图 3-7\
  \ `if-else` 语句的逻辑\n\n![if else 语句的逻辑取决于数字 2 的值是否为零。](img/03fig07.png)图 3-7 完整替代文本\n\
