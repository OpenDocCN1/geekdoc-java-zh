  \n## 3.3 嵌套 `if` 语句\n\n概念：为了测试多个条件，可以将一个 `if` 语句嵌套在另一个 `if` 语句内部。\n\n有时一个 `if` 语句必须嵌套在另一个\
  \ `if` 语句内部。例如，考虑一个银行程序，判断银行客户是否符合特殊低贷款贷款。要符合条件，必须满足两个条件：(1) 客户的薪水至少为 $50,000；(2)\
  \ 客户拥有当前工作至少两年。图 3-8 显示了此类程序可能使用的算法流程图。\n\n### 图 3-8 嵌套 `if` 语句的逻辑\n\n![嵌套在另一个 if\
  \ 语句中的 if 语句的算法说明了银行客户需要满足某些条件才能获得低贷款利率](img/03fig08.png)图 3-8 完整替代文本\n\n如果我们遵循流程图中的执行流，可以看到测试了表达式\
