  \n# 检查点 4.6\n\n# 7 常见错误\n\n以下列表列出了在学习本章时常见的错误：\n\n*   以错误的模式使用递增或递减运算符：当增或减运算符放在操作数前面（左侧）时，使用的是前置模式。当放在操作数后面（右侧）时，使用的是后置模式。\n\
  *   在 `while` 或 `for` 头部结束后放置分号：当你在 `while` 或 `for` 头部末尾写分号时，Java 认为循环体是空的。\n* \
  \  忘记在循环体中包含多个语句：通常循环只执行一个语句。为了执行多个语句，必须将语句放在大括号中。\n*   在 `for` 循环的初始化、测试和更新表达式中使用逗号代替分号。\n\
  *   忘记在 `while` 或 `do-while` 循环体内编写修改控制变量的代码：如果 `while` 或 `do-while` 循环的布尔表达式永远变为\
  \ `false`，循环将无限循环。你必须在循环体内编写修改控制变量的代码，以便表达式最终会变为 `false`。\n*   使用也可以作为有效数据的哨兵值：记住，哨兵是一个不会被误认为数据列表成员的特殊值。如果你选择可能出现在列表中的值作为哨兵，循环将在遇到该值时提前终止。\n\
  *   忘记将累加器初始化为零：为了让累加器保持正确的运行和，在添加任何值之前必须将其初始化为零。\n\n## 编程挑战\n\n# 1. 数字求和写一个程序，要求用户输入一个正非零整数值。程序应使用循环来获取从\
  \ 1 到该数字的所有整数之和。例如，如果用户输入 50，循环将计算 1, 2, 3, 4, . . 50 的和。\n\n# 2. 行程计算\n\n车辆行驶的距离可以如下公式计算：\n\
  \n`距离 = 速度 * 时间`\n\n例如，如果一列火车以每小时 40 英里的速度行驶 3 小时，行驶距离为 120 英里。写一个程序，询问车辆的速度（英里/小时）和它行驶的时间。程序应使用循环显示用户指定的时间段内车辆每小时行驶的距离。例如，如果一辆车辆以\
  \ 40 mph 的速度行驶 3 小时的时间段，它应该显示一份类似于所示的报告：\n\n\n\n\n\n![一个表格展示了公式距离 = 速度乘以时间，内容如下：第\
  \ 1 行 小时，1. 行驶距离，40。第 2 行 小时，2. 行驶距离，80。第 3 行 小时，3. 行驶距离，120。](img/p0193_01.png)\n\
  \n*输入验证：速度不接受负数，行驶时间不接受小于 1 的值。*\n\n# 3. 距离文件\n\n修改你为编程挑战 2（`Distance Traveled`）编写的程序，使其报告写入文件而不是屏幕。使用\
  \ `Notepad` 或其他文本编辑器打开文件以确认输出。\n\n# 4. 分币报酬\n\n## 观看“分币报酬”问题\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/secs_gaddis_6_vn_04_02_pennies_for_pay`](https://mediaplayer.pearsoncmg.com/assets/_video.true/secs_gaddis_6_vn_04_02_pennies_for_pay)\n\
  \n编写一个程序，计算某人在特定时期内的收入金额，假设他的工资第一天是一分币，第二天是两分币，此后每天翻倍。该程序应该显示一个包含每天工资的表格，然后在时期结束时显示总报酬。输出应以美元金额显示，而不是分币的数字。\n\
  \n*输入验证：工作天数不接受小于 1 的数字。*\n\n# 5. 字符计数器\n\n编写一个程序，要求用户输入一个字符串，然后要求用户输入一个字符。该程序应该计算并显示指定字符在字符串中出现的次数。\n\
  \n# 6. 文件字符计数器\n\n编写一个程序，要求用户输入文件名，然后要求用户输入一个字符。该程序应该计算并显示指定字符在文件中出现的次数。使用 `Notepad`\
  \ 或其他文本编辑器创建一个简单的文件，用于测试该程序。\n\n# 7. 酒店入住率\n\n一间酒店的入住率计算方法如下：\n\n`入住率 = 已占用房间数 ÷\
  \ 房间总数`\n\n编写一个程序计算酒店每层的入住率。程序应首先询问酒店的楼层数。然后使用循环为每层迭代一次。在每次迭代期间，循环应询问用户该楼层的房间数以及被占用的房间数。所有迭代完成后，程序应显示酒店的房间总数、空房数以及入住率。\n\
  \n*输入验证：房间数不接受小于 1 的值*\n\n# 8. 平均降水量\n\n编写一个使用嵌套循环来收集数据的程序。外层循环询问用户年数。内层循环迭代 12\
  \ 次，询问每个月的降雨量。循环完成后，程序应显示每年的平均降雨量。\n\n# 9. 人口\n\n编写一个程序，要求用户输入天数。然后使用循环提示用户输入每天的人口数，并保持运行总和。循环结束，程序应显示输入的最大和最小人口。\n\
  \n*输入验证：天数不接受小于 1 的值*\n\n# 10. 摄氏度转华氏度\n\n编写一个程序，要求用户输入一个摄氏度温度。摄氏度转换为华氏度的公式为：$F\
  \ = \\frac{9}{5}C + 32$\n\n该程序应显示华氏度温度，精确到小数点后一位。\n\n# 11. 柱状图\n\n编写一个程序，要求用户输入五家商店的销售额。通过显示星号创建一个柱状图。每个星号代表\
  \ $100。以下是程序的输出示例：\n\n```\nEnter sales for store 1: 1000\n**********\nEnter sales\
  \ for store 2: 1200\n************\nEnter sales for store 3: 1800\n******************\n\
  Enter sales for store 4: 800\n********\nEnter sales for store 5: 1900\n*******************\n\
  ```\n\n# 12. 销售柱状图\n\n编写一个程序，要求用户输入五家商店的销售额。该程序显示一个比较每家商店的柱状图。每个星号代表 $10。\n\n# 13.\
  \ 文件头显示\n\n编写一个程序，要求用户输入文件名。该程序仅显示文件的前五行。如果文件少于五行，则应显示全部内容。\n\n# 14. 行号\n\n编写一个程序，要求用户输入文件名。该程序显示文件内容，每行前都加一个冒号。行号应从\
  \ 1 开始。\n\n# 15. 大写文件转换器\n\n编写一个程序，要求用户输入两个文件的名称。第一个文件应以读取模式打开，第二个文件应以写入模式打开。程序读取第一个文件的内容，将所有字符转换为大写，并将结果存储在第二个文件中。第二个文件将第一个文件的副本，但所有字符都变为大写。\n\
  \n# 16. 预算分析\n\n编写一个程序，要求用户输入其为每月预算的金额。然后使用循环提示用户输入每月每项支出，并保持运行总和。循环完成后，程序应显示用户超出或低于预算的金额。\n\
  \n# 17. 随机数猜测游戏\n\n编写一个程序生成一个随机数并要求用户猜测该数字。如果用户的猜测大于随机数，程序应显示“太高，请重试”。如果用户的猜测小于随机数，程序应显示“太低，请重试”。该程序应使用循环重复直到用户正确猜中随机数。\n\
  \n# 18. 随机数猜测游戏增强\n\n增强你为编程挑战 17 编写的程序，使其记录用户的猜测次数。当用户正确猜中随机数时，程序应显示猜测次数。\n\n# 19.\
  \ ESP 游戏\n\n编写一个测试你的 ESP（超感应）的程序。程序应从以下颜色列表中随机选择一种颜色名称：\n\n*   *红色、绿色、蓝色、橙色、黄色*\n\
  \n\n\n\n为了选择一个单词，程序可以生成一个随机数。例如，如果数字是 0，选中的单词为 `Red`；如果数字是 1，选中的单词为 `Green`，以此此类推。\n\
  \n接下来，程序应该要求用户输入计算机选择的颜色。在用户输入猜测后，程序应该显示随机选择的颜色名称。程序应重复此操作 10 次，然后显示用户正确猜中选中颜色的次数。\n\
  \n# 20. 正方形显示\n\n编写一个程序，要求用户输入一个不大于 15 的正整数。程序应使用字符‘X’在屏幕上显示一个正方形。用户输入的数字将作为正方形每边的长度。例如，如果用户输入\
  \ 5，程序应显示如下内容：\n\n```\nXXXXX\n XXXXX\n XXXXX\n XXXXX\n XXXXX\n```\n\n如果用户输入 8，程序应显示如下内容：\n\
  \n```\nXXXXXXXX\n XXXXXXXX\n XXXXXXXX\n XXXXXXXX\n XXXXXXXX\n XXXXXXXX\n XXXXXXXX\n\
   XXXXXXXX\n XXXXXXXX\n```\n\n# 21. 骰子游戏\n\n编写一个让计算机和用户之间进行简单骰子游戏的程序。当程序运行时，循环应重复\
  \ 10 次。循环的每次迭代应执行以下操作：\n\n*   生成一个 1 到 6 之间的随机整数。这是计算机骰子的值。\n*   生成另一个 1 到 6 之间的随机整数。这是用户骰子的值。\n\
  *   点数最高的骰子获胜。（如果平局，则该轮骰子没有胜者。）\n\n随着循环迭代，程序应记录计算机胜的次数和用户胜的次数。在循环完成所有迭代后，程序应显示最终获胜者是计算机还是用户。\n\
  \n# 22. 老虎机模拟\n\n老虎机是一种赌博设备，用户向其投入钱然后拉动拉杆（或按下按钮）。老虎机随后会显示一组随机图像。如果两个或多个图像匹配，用户将赢得由老虎机返还给用户的金额。\n\
  \n创建一个模拟老虎机的程序。当程序运行时，它它应执行以下操作：\n\n*   要求用户输入他想要投入老虎机的金额。\n*   程序不显示图像，而是从以下列表中随机选择一个单词：\n\
  \    *Cherries, Oranges, Plums, Bells, Melons, Bars*\n    为了选择单词，程序可以生成一个 0 到 5\
  \ 之间的随机数。如果数字是 0，选中的单词为 `Cherries`；如果数字是 1，选中的单词为 `Oranges`；以此此类推。程序应从该列表中随机选择三次单词并显示所有三个单词。\n\
  *   如果所有随机选择的单词都不匹配，程序将通知用户他赢了 $0。如果两个单词匹配，程序将通知用户他赢了输入金额的两倍。如果三个单词匹配，程序将通知用户他赢了输入金额的三倍。\n\
  *   程序将询问用户是否想再次玩。如果是，则重复这些步骤。如果不是，程序将显示投入老虎机的总金额和赢得总金额。\n\n# 决策结构\n\n# 23. 个人网页生成器\n\
  \n编写一个程序，要求用户输入其姓名，然后要求用户输入一句描述其自己的话。以下是程序的界面示例：\n\n*   输入你的姓名：`Julie Taylor [Enter]`\n\
  *   描述你自己：`I am a computer science major, a member of the Jazz club, and I hope\
  \ to work as a mobile app developer after I graduate. [Enter]`\n\n一旦用户输入了请求的输入，程序应创建一个包含输入内容的\
  \ HTML 文件，用于简单的网页。以下是使用之前显示的示例输入的 HTML 内容示例：\n\n```html\n<html>\n  <head>\n  </head>\n\
  \  <body>\n     <center>\n      <h1>Julie Taylor</h1>\n   </center>\n   <hr />\n\
  \   I am a computer science major, a member of the Jazz club,\n   and I hope to\
  \ work as a mobile app developer after I graduate.\n   <hr />\n  </body>\n</</html>\n\
  ```\n\n# 第 5 章 方法\n\n# 题与\n\n1.  [5.1 方法简介]\n2.  [5.2 向方法传递参数]\n3.  [5.3 关于局部变量的更多信息]\n\
  4.  [5.4 从方法返回值]\n5.  [5.5 使用方法解决问题]\n6.  [5.6 需避免的常见错误]\n\n## 5.1 方法简介\n\n概念：方法可以用于将复杂的程序分解成较小的、易于管理的部分。空方法（void\
  \ method）只需执行一组语句然后终止。有返回值的方法会返回一个值。\n\n从一般意义上，方法是执行特定任务的语句集合。到目前，你通过两种方式体验了方法：(1)\
  \ 你在每个程序中创建了一个名为 `main` 的方法，(2) 你执行了 API 中的预定义方法，例如 `System.out.println`、`Integer.parseInt`\
  \ 和 `Math.pow`。在本章，你将学习如何创建除 `main` 之外的自定义方法。\n\n方法通常用于将问题分解为可行的部分。与其编写一个包含解决问题所需的所有语句的长方法，不如编写几个小方法，每个方法解决特定的部分。这种方法有时被称为*分治法*，因为它将一个大问题分解为容易解决的小问题。\n\
  \n\n\n\n\n有返回值的方法不仅执行一项任务，还会向调用它的代码返回一个值。`Random` 类的 `nextInt()` 方法就是有返回值方法的示例。例如，看下面的代码：\n\
  \n```\n1    int number;\n2    Random rand = new Random();\n3    number = rand.nextInt();\n\
  ```\n\n第 1 行的语句声明了 `number` 变量。第 2 行创建一个 `Random` 对象并将其地址赋值给名为 `rand` 的变量。第 3 行是一个赋值语句，为\
  \ `number` 变量分配一个值。注意在 `=` 运算符的右侧是对 `rand.nextInt()` 方法的调用。该方法执行，然后返回一个值。从方法返回的值被赋值给\
  \ `number` 。\n\n### 定义 `void` 方法\n\n要创建一个方法，你必须编写它的定义，该定义由两个通用部分组成：头部和方法体。你已经在第\
  \ 2 章中学习过这两者，但让我们简要回顾一下。方法头部出现在方法定义的开头，它列出了关于方法的若干个重要信息，包括方法的名称。方法体是在执行方法时执行的语句集合。这些语句被封装在一组括号内。图\
  \ 5-2 指出了 `main` 方法的头部和方法体。\n\n### 图 5-2 `main` 方法的头部和方法体\n\n![标识了 main 方法的头部和体。](img/05fig02.png)图\
  \ 5-2 完整替代文本\n\n如你所知，每个完整的 Java 程序都必须有一个 `main` 方法。Java 程序也可以有其他方法。这里是一个简单方法的示例，用于在屏幕上显示消息：\n\
  \n```\npublic static void displayMessage()\n{\n    System.out.println(\"Hello from\
  \ the displayMessage method.\");\n}\n```\n\n该方法有一个头部和一个方法体。图 5-3 显示了方法头部的不同部分。\n\
  \n### 图 5-3 方法头部的部分\n\n![绘制了方法头部的 4 个部分。](img/05fig03.png)图 5-3 完整替代文本\n\n让我们仔细观察图中标识的各个：\n\
  \n*   方法修饰符——关键字 `public` 和 `static` 是修饰符。你现在不需要过于担心这些修饰符，但如果你好奇心作祟，这里有一个简短的解释：`public`\
  \ 单词意味着该方法对类外部的代码可用。`static` 单词意味着该方法属于类，而不是特定的对象。你将在后面的章节中学习更多关于这些修饰符的知识。在本章中我们写的每个方法都将以\
  \ `public static` 开头。\n\n*   返回值类型——回顾我们之前对 `void` 和有返回值方法的讨论。当关键字 `void` 出现在这里时，意味着该方法是一个\
  \ `void` 方法，并且不返回值。正如你稍后看到的，有返回值的方法在此处会列出一个数据类型。\n\n*   方法名——你应该给每个方法起一个描述性的名称。通常情况下，适用于变量名的规则也适用于方法名。此方法命名为\
  \ `displayMessage`，所以我们可以很容易地猜出该方法的作用：它显示一条消息。\n\n*   括号——在头部中，方法名后面总是跟着一组括号。正如你在本章稍后部分将学到的，方法能够接收参数。在这种情况下，括号内部会出现一个或多个变量声明的列表。此示例中的方法不接收任何参数，因此括号是空的。\n\
  \n### 注意\n\n方法头部永远不会以分号结束。\n\n# 调用方法\n\n方法在被调用时执行执行。`main` 方法在程序启动时被自动调用，但其他方法通过方法调用语句来执行。当方法被调用时，JVM\
  \ 会跳转到该方法并执行其方法体中的语句。这里有一个方法调用语句的示例，调用了我们之前过的 `displayMessage` 方法：\n\n```\ndisplayMessage();\n\
  ```\n\n该语句仅仅是方法名后跟一组括号。因为它是一个完整的语句，所以以分号结束。\n\n### 提示\n\n注意，方法修饰符和 `void` 返回类型没有写在方法调用语句中。它们只写在方法头部。\n\
  \n代码列表 5-1 中展示了程序。\n\n\n\n\n方法也可以以分层的方式调用。换句话说，方法 `A` 可以调用方法 `B`，然后 `B` 又调用方法 `C`。当方法\
  \ `C` 完成时，JVM 返回到方法 `B`。当方法 `B` 完成时，JVM 返回到方法 `A`。代码列表 5-4 程序通过三个方法演示了这一点：`main`、`deep`\
  \ 和 `deeper`。`main` 方法调用 `deep` 方法，然后 `deep` 方法调用 `deeper` 方法。\n\n在下方的动画中，点击“上一个”或“下一个”按钮可以逐步执行代码并查看全程的解释。\n\
