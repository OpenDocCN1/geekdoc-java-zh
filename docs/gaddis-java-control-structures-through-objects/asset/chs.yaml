  \n\n\n\n概念：场景（Scene）是 JavaFX GUI 中控件和其他对象的集合。\n\n# 查看创建场景（Scene）\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/zmGtrT8g52djRhn1LlVvdCX4_p6TcTtB`](https://mediaplayer.pearsoncmg.com/assets/_video.true/zmGtrT8g52djRhn1LlVvdCX4_p6TcTtB)\n\
  \n回想一下我们在描述 JavaFX GUI 时使用了剧院的隐喻。在 JavaFX 术语中，窗口被称为 `stage`（舞台），而显示在该窗口中的 GUI 对象的集合被称为\
  \ `scene`（场景）。你在代码列表 12-1 中看到的程序创建了一个 `stage`，但它并没有创建一个 `scene`。结果是该程序显示了一个空窗口。现在，是时候学习如何创建一个包含\
  \ JavaFX 控件的 `scene` 了。\n\n通常情况下，创建 `scene` 时遵循的步骤如下：\n\n1. 创建将位于 `scene` 中的控件。\n\
  2. 创建某种类型的布局容器，并将控件添加到该布局容器中。\n3. 创建一个 `Scene` 对象，并将布局容器添加到 `Scene` 对象中。\n4. 将 `Scene`\
  \ 对象添加到 `stage` 中。\n\n让我们详细观察每一步。\n\n# 创建控件\n\nJavaFX 库为你所有可以添加到 GUI 中的对象都提供了相应的类。由于这些类位于\
  \ `javafx` 包的各个子包中，因此你必须为你想要使用的类编写一个 `import` 语句。例如，如果你想创建一个 `Label` 控件，你将导入 `Label`\
  \ 类，它位于 `javafx.scene.control` 包中。\n\n一旦你写了必要的 `import` 语句，你就会创建该类的实例。这通常在 `start`\
  \ 方法中完成。例如，以下语句创建了一个显示文本“Hello World”的 `Label` 控件：\n\n```\nLabel messageLabel =\
  \ new Label(\"Hello World\");\n```\n\n注意，我们将想要在 `Label` 中显示的字符串作为参数传递给 `Label` 类的构造函数。`Label`\
  \ 类有多个构造函数，但这是你最常用的一个。\n\n无论你创建的是什么类型的控件，过程通常都是相同的：你导入控件的类，然后在 `start` 方法中实例化该类并调用所需的构造函数。\n\
  \n# 创建布局容器\n\n布局容器是 JavaFX GUI 的重要部分。你使用布局容器来安排控件在屏幕上的位置。JavaFX 提供了多种布局容器供你选择，在本章后面的内容中，我们将查看其中许多一个。现在，我们只使用表\
  \ 12-1 列出的三个简单容器。\n\n# 表 12-1 三种最简单的布局容器\n\n| 布局容器 | 描述 |\n| --- | --- |\n| `HBox`\
  \ | 将控件排列在单水平行中。 |\n| `VBox` | 将控件排列在单垂直行中。 |\n| `GridPane` | 将控件排列在具有行和列的网格中。 |\n\
  \n图 12-8 展示了表 12-1 列出的三个布局容器如何影响控件排列的示例。最左侧的屏幕显示了一个在 `HBox` 中带有三个 `Button`控件的应用程序。中间的屏幕显示了一个在\
  \ `VBox` 中带有三个 `Button`控件的应用程序。最右侧的屏幕显示了一个在 `GridPane` 中带有六个按钮的应用程序。\n\n# 图 12-8\
  \ 布局容器示例（Oracle 公司法律顾问）\n\n![布局容器影响控件排列的三个示例。](img/12fig08.png)图 12-8 完整替代文本\n\n\
  你创建布局容器的方式与创建其他 GUI 对象相同。首先，从必要的包导入容器的类。然后，你创建容器类的实例并调用所需的构造函数。\n\n例如，如果你想创建一个 `HBox`，你会从\
  \ `javafx.scene.layout` 包导入 `HBox` 类。然后，你创建一个 `HBox` 类实例。以下代码片段显示了一个示例：\n\n```\n\
  // 创建一个 Label 控件。\nLabel messageLabel = new Label(\"Hello World\");\n\n// 创建 HBox\
  \ 容器并添加 Label。\nHBox hbox = new HBox(messageLabel);\n```\n\n首先，这段代码创建了一个 `Label`\
  \ 控件。然后，它创建了一个 `HBox` 布局容器，并将 `Label` 控件添加到 `HBox` 中。\n\n你可以通过向 `HBox` 构造函数传递多个参数向\
  \ `HBox` 添加多个控件。例如，以下代码片段创建了两个 `Label` 控件，并将它们都添加到 `HBox`：\n\n```\n// 创建两个 Label\
  \ 控件。\nLabel message1 = new Label(\"Hello\");\nLabel message2 = new Label(\"World\"\
  );\n\n// 创建 HBox 容器并添加它们。\nHBox hbox = new HBox(message1, message2);\n```\n\n这让你对如何使用\
  \ `HBox` 创建布局容器有一个大致的了解。我们将在后续详细介绍布局容器。\n\n# 创建 Scene 对象\n\n一旦你创建了场景中所需的控件并将它们添加到布局容器中，下一步是创建\
  \ `Scene` 类的实例（它位于 `javafx.scene` 包），并将布局容器添加到 `Scene` 对象。\n\n以下代码片段显示了一个示例。它创建了一个\
  \ `Label` 控件，将其添加到 `HBox` 容器，然后将 `HBox` 容器添加到 `Scene` 对象：\n\n```\n// 创建一个 Label\
  \ 控件。\nLabel messageLabel = new Label(\"Hello World\");\n\n// 创建 HBox 容器并添加 Label。\n\
  HBox hbox = new HBox(messageLabel);\n\n// 创建 Scene 并将 HBox 作为根节点。\nScene scene =\
  \ new Scene(hbox);\n```\n\n我们传递给 `Scene` 构造函数的参数是场景的*根节点*。在这个示例中，`HBox` 容器将成为场景图的根节点如图\
  \ 12-9 所示。\n\n![H 容器作为场景图的根节点，message Label 是子节点。](img/12fig09.png)\n\n# 图 12-9\
  \ 场景图中的节点\n\n# 将 Scene 对象添加到 Stage\n\n一旦创建了 `Scene` 对象，下一步是将 `Scene` 对象添加到阶段。回想\
  \ `start` 方法接收一个 `Stage` 对象作为参数。要将你的 `Scene` 对象添加到阶段，调用 `Stage` 对象的 `setScene` 方法，并将你的\
  \ `Scene` 对象作为参数传递。\n\n假设 `primaryStage` 引用 `Stage` 对象，`scene` 引用你的 `Scene` 对象。以下是调用\
  \ `setScene` 方法将场景添加到阶段的示例：\n\n```\nprimaryStage.setScene(scene);\n```\n\n现在我们涵盖了基础知识，可以查看创建一个简单场景的完整程序。查看代码列表\
  \ 12-2，这是一个简单的 Hello World 应用程序。该应用程序的场景包含一个 `HBox`，其中包含显示“Hello World”文本的 `Label`。当你编译并运行此程序时，将看到一个类似于图\
  \ 12-10 所示的窗口。\n\n\n\n\n\n```java\nimport javafx.application.Application;\nimport\
  \ javafx.stage.Stage;\nimport javafx.scene.Scene;\nimport javafx.scene.layout.HBox;\n\
  import javafx.scene.control.Label;\n\n/**\n    A JavaFX Hello World application\n\
  \ */\npublic class HelloWorld extends Application\n{\n    public static void main(String[]\
  \ args)\n    {\n        // Launch the application.\n        launch(args);\n    }\n\
  \n    @Override\n    public void start(Stage primaryStage)\n    {\n        // Create\
  \ a Label control.\n        Label messageLabel = new Label(\"Hello World\");\n\n\
  \        // Put the Label in an HBox.\n        HBox hbox = new HBox(messageLabel);\n\
  \n        // Create a Scene with the HBox as its root node.\n        Scene scene\
  \ = new Scene(hbox);\n\n        // Add the Scene to the Stage.\n        primaryStage.setScene(scene);\n\
  \n        // Set the stage title.\n        primaryStage.setTitle(\"My First Scene\"\
  );\n\n        // Show the window.\n        primaryStage.show();\n    }\n}\n```\n\
  \n# 代码列表 12-2 `(HelloWorld.java)`\n\n![Hello World 应用显示在一个窗口中，该窗口包含一个 H Box 和 Label，显示了文本\
