  \n## 8.10 垃圾回收\n\n概念：Java 虚拟机定期运行一种名为垃圾回收的程序，用于移除不再引用的对象。\n\n当一个对象不再需要时，应该将其销毁，以释放它使用的内存。幸运的是，你不需要在使用后手动销毁对象。Java\
  \ 虚拟机定期执行垃圾回收过程，自动移除不再引用的对象。例如，查看以下代码：\n\n```java\n// 声明两个 BankAccount 变量。\nBankAccount\
  \ account1, account2;\n\n// 创建对象并用 account1 引用它。\naccount1 = new BankAccount(500.0);\n\
  \n// 用 account2 引用同一个对象。\naccount2 = account1;\n\n// 在 account1 中存储 null，使其不再引用该对象。\n\
  account1 = null;\n\n// 但 account2 仍然引用它。\n// 在 account2 中存储 null，使其不再引用该对象。\naccount2\
  \ = null;\n\n// 现在对象不再被引用，因此\n// 可以被回收器移除。\n```\n\n此代码使用了两个引用变量 `account1` 和 `account2`。创建了一个\
  \ `BankAccount` 对象并由 `account1` 引用。然后，将 `account1` 赋值给 `account2`，导致 `account2`\
  \ 引用与 `account1` 相同的对象。这在图 8-17 中所示。\n\n![account 1 和 account 2 变量都持有余额为 500.0 的同一个\
  \ Bank Account 对象的地址。](img/08fig17.png)\n\n## 图 8-17 account1 和 account2 引用同一个对象\n\
  \n接下来，将 `null` 值赋值给 `account1`。这从 `account1` 变量中移除了该对象的地址，使其不再引用该对象。图 8-18 展示了这一点。\n\
  \n![account 1 变量不再引用任何对象。只有 account 2 变量持有一个余额为 500.0 的 Bank Account 对象的地址。可以通过\
