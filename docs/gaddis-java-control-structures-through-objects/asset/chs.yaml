  \  boolean lineRead; // 标记变量\n 39\n 40        // 判断是否有更多待读。\n 41        lineRead\
  \ = inputFile.hasNext();\n 42\n 43        // 如果是，读取下一行。\n 44        if (lineRead)\n\
  \ 45          line = inputFile.nextLine();\n 46\n 47        return lineRead;\n 48\
  \     }\n 49\n 50     /**\n 51        getAverage 方法计算从文件中读取的\n 52        最后一组测试成绩的平均值。\n\
  \ 53        @return 平均值。\n 54     */\n 55\n 56     public double getAverage()\n\
  \ 57     {\n 58        int total = 0;  // 累加器\n 59        double average; // 平均测试分数\n\
  \ 60\n 61        // 将文件中读取的最后一行分词。\n 62        String[] tokens = line.split(\",\"\
  );\n 63\n 64        // 计算测试成绩的总和。\n 65        for (String str : tokens)\n 66   \
  \     {\n 67           total += Integer.parseInt(str);\n 68        }\n 69\n 70 \
  \       // 计算分数的平均值。\n 71        // 使用强制转换以避免整数除法。\n 72        average = (double)\
  \ total / tokens.length;\n 73\n 74        // 返回平均值。\n 75        return average;\n\
  \ 76     }\n 77\n 78     /**\n 79        close 方法关闭文件。\n 80     */\n 81\n 82   \
  \  public void close() throws IOException\n 83     {\n 84        inputFile.close();\n\
  \ 85     }\n 86  \n```\n\n## 程序输出\n\n```\n学生 1 的平均分是 86.6\n学生 2 的平均分是 78.8\n学生 3\
  \ 的平均分是 90.4\n学生 4 的平均分是 72.0\n学生 5 的平均分是 83.4\n没有更多分数。\n```\n\n## 代码列表 9-10 `(TestAverages.java)`\n\
  \nHarrison 的类工作正常，她决定扩展它以执行更复杂的操作。\n\n## 9.8 常见错误\n\n以下列表描述了在学习本章主题时常见的错误：\n\n-\
  \   将静态类方法当作实例方法使用。许多包装类方法是静态的，你应该直接从类调用它们。\n\n-   尝试使用 `startsWith` 和 `endsWith`\
  \ 等 `String` 比较方法进行区分大小写的比较。大多数 `String` 比较方法都是区分大小写的。只有 `regionMatches` 方法执行区分大小写的比较。\n\
  \n-   将字符串的第一个位置视为 1。许多 `String` 和 `StringBuilder` 方法接受字符串内的字符位置作为参数。记住，位置数字从 0\
  \ 开始。如果你认为字符串的第一个位置是 1，会导致差一错误。\n\n-   忘记在分词之前对字符串进行修剪。在对字符串进行分词并使用空格以外的字符作为分隔符时，你可能希望在分词之前对其进行修剪。否则，如果字符串包含开头或结尾空白字符，它们将成为第一个和最后一个标记的一部分。\n\
  \n## 编程挑战\n\n# 1. 反转字符串\n\n\n\n\n编写一个方法，接收一个 String`对象作为参数并反向显示其内容。例如，如果字符串参数是“gravity”，该方法应该显示“ytivarg”。在一个程序中演示该方法，该程序要求用户输入一个字符串，然后将其传递给方法。\n\
  \n# 2. 单词计数器\n\n编写一个方法，接收一个 String`对象作为参数并返回其中包含的单词数。例如，如果参数是“Four score and seven\
  \ years ago”，该方法应该返回数字 6。在一个程序中演示该方法，该程序要求用户输入一个字符串，然后将其传递给方法。屏幕上应显示字符串中的单词数。\n\n\
  # 3. 句子首字母大写\n\n## 查看句子首字母大写问题\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/H1oVVzJOAXK6EeWMM5hU2e_rhkKFacPD`](https://mediaplayer.pearsoncmg.com/assets/_video.true/H1oVVzJOAXK6EeWMM5hU2e_rhkKFacPD)\n\
  \n编写一个方法，接收一个 String`对象作为参数并返回字符串的副本，其中每个句子的第一个字母大大写。例如，如果参数是“hello. my name is\
  \ Joe. what is your name?”，该方法应该返回字符串“Hello. My name is Joe. What is your name?”。在一个程序中演示该方法，该程序要求用户输入一个字符串，然后将其传递给方法。屏幕上应显示修改后的字符串。\n\
  \n# 4. 元音与辅音\n\n编写一个类，其构造函数接收一个 String`对象作为其参数。该类应该有一个方法返回字符串中元音的数量，以及另一个方法返回字符串中辅音的数量。在一个程序中演示该类，该程序执行以下步骤：\n\
  \n1. 要求用户输入一个字符串。\n2. 程序显示以下菜单：\n    1. 统计字符串中元音的数量\n    2. 统计字符串中辅音的数量\n    3.\
  \ 同时统计字符串中的元音和辅音\n    4. 输入另一个字符串\n    5. 退出程序\n3. 程序执行用户选择的操作并重复执行，直到用户选择 e 退出程序。\n\
  \n# 5. 密码验证器\n\n想象你正在为 Amazon.com 开发一个软件包，要求用户输入他们自己的密码。你的软件要求用户的密码符合以下标准：\n\n*\
  \ 密码长度至少为六个字符。\n* 密码应包含至少一个大写字母和一个小写字母。\n* 密码应包含至少一个数字。\n\n编写一个类来验证密码是否符合上述标准。在一个程序中演示该类，该程序允许用户输入密码，然后显示消息指示其是否有效。\n\
  \n# 6. 电话营销电话号码列表\n\n编写一个具有两个`String`对象并行数组的程序。其中一个数组存储人的姓名，另一个存储他们的电话号码。以下是两个数组的示例内容：\n\
  \n| name Array 示例内容 | phone Array 示例内容 |\n| --- | --- |\n| `\"Harrison, Rose\"`\
  \ | `\"555-2234\"` |\n| `\"James, Jean\"` | `\"555-9098\"` |\n| `\"Smith, William\"\
  ` | `\"555-1785\"` |\n| `\"Smith, Brad\"` | `\"555-9224\"` |\n\n程序应要求用户输入一个姓名或姓的前几个字符以在数组中搜索。程序应显示所有与用户输入匹配的姓名及其相应的电话号码。例如，如果用户输入“Smith”，程序应从列表中显示以下姓名和电话号码：\n\
  \n```\nSmith, William: 555-1785\nSmith, Brad: 555-9224\n```\n\n# 7. 支票打印\n\n编写一个显示模拟支票的程序。程序要求用户输入日期、收款人姓名和支票金额。然后它应该显示一张模拟支票，其中金额以英文形式写出，如下：\n\
  \n| | 日期: 11/24/2012 |\n| 付给：John Phillips | $1920.85 |\n| One thousand nine hundred\
  \ twenty and 85 cents | |\n\n# 8. 字符串中数字的和\n\n编写一个程序，要求用户输入一系列由逗号分隔的数字。以下是一个有效输入的示例：\n\
  \n```\n7,9,10,2,18,6\n```\n\n程序应计算并显示所有数字的和。\n\n# 9. 字符串中数位之和\n\n编写一个程序，要求用户输入一系列没有分隔符的单数字。程序应显示字符串中所有单数字之和。例如，如果用户输入\
  \ 2514，方法应返回 12，即 2, 5, 1 和 4 之和。程序还应显示字符串中最高和最低的数字。（提示：将字符串转换为数组。）\n\n# 10. 单词计数器\n\
  \n编写一个程序，要求用户提供文件名。程序应显示单词数。\n\n# 11. 销售分析\n\n本章中的 `SalesData.txt` 文件包含了零售店赚取的美元金额。数字用逗号分隔。以下行是一个示例：\n\
  \n```\n2541.36,2965.88,1965.32,7021.11\n```\n\n编写一个程序打开文件并处理其内容。程序应显示：\n\n* 每周的销售总额\n\
  * 平均销售额\n* 销售额最高的的周\n\n# 12. 杂项字符串操作\n\n编写一个带有以下静态方法的类：\n\n* `WordCount()` 该方法接收一个`String`对象作为参数并返回其中包含的单词数。\n\
  * `arrayToString()` 该方法接收一个 `char` 数组作为参数并将其转换为`String`对象。该方法应返回该`String`对象的引用。\n\
  * `mostFrequent()` 该方法接收一个`String`对象的引用作为参数并返回其中出现频率最高的字符。\n* `replaceSubstring()`\
  \ 该方法接收三个`String`对象的引用作为参数。我们称它们为 `string1`、`string2` 和 `string3`。它在 `string1` 中搜索\
  \ `string2` 的所有出现情况。当发现 `string2` 的出现时，将其替换为 `string3`。例如，假设三个参数具有以下值：\n\n| `string1`\
  \ | “the dog jumped over the fence” |\n| `string2` | “the” |\n| `string3` | “that”\
  \ |\n\n使用这三个参数，该方法将返回值为“that dog jumped over that fence”的 String 引用。\n\n在一个完整的程序中演示这些方法。\n\
  \n# 13. 字母电话号码\n\n许多公司使用像 555-GET-FOOD 这样的电话号码以便客户记忆。在标准电话上，字母映射如下：\n\n* A, B, 和\
  \ C = 2\n* D, E, 和 F = 3\n* G, H, 和 I = 4\n* J, K, 和 L = 5\n* M, N, 和 O = 6\n* P,\
  \ Q, R, 和 S = 7\n* T, U, 和 V = 8\n* W, X, Y, 和 Z = 9\n\n编写一个应用程序，要求用户输入格式为 `XXX-XXX-XXXX`\
  \ 的 10 位电话号码。应用程序应显示将原始号码中出现的字母字符转换为对应数字后的电话号码。例如，如果用户输入 555-GET-FOOD，应用程序应显示 555-438-3663。\n\
  \n# 14. 单词分隔符\n\n\n\n\n编写一个程序，接收一个句子作为输入，句子中的所有单词连在一起，但每个单词的首字母都是大写。将该句子转换为一个字符串，其中单词用空格隔开，且只有第一个单词的首字母大写。例如，字符串“StopAndSmellTheRoses.”将转换为“Stop\
  \ and smell the roses.”。\n\n# 15. 猪拉丁语 (Pig Latin)\n\n编写一个程序，读取一个句子作为输入，并将每个单词转换为“猪拉丁语”。在猪拉丁语的一种变版本中，你通过移除第一个字母，将该字母放在单词末尾，然后在单词后面添加“ay”来转换单词。这是一个示例：\n\
  \n| 英语: | I SLEPT MOST OF THE NIGHT |\n| 猪拉丁语: | IAY LEPTSAY OSTMAY FOAY HETAY IGHTNAY\
  \ |\n\n# 16. 摩斯密码转换器\n\n摩斯密码是一种代码，英语字母表中的每个字母、每个数字以及各种标点符号都由一系列点和破划线表示。表 9-12 显示了部分代码。编写一个程序，要求用户输入一个字符串，然后将字符串转换为摩斯密码。使用连字符表示破划线，使用点表示点。\n\
  \n# 表 9-12 摩斯密码\n\n| 字符 | 代码 | 字符 | 代码 | 字符 | 代码 | 字符 | 代码 |\n| --- | --- | ---\
