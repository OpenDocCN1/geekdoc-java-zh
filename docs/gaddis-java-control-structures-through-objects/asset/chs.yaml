  \n## 编程挑战\n\n## 1. 这栋老房子\n\n使用在本章中学习的基础形状来画一栋房子。确保至少包含两个窗户一扇门。你可以自由绘制其他物体，如天空、太阳甚至云朵。\n\
  \n## 2. 树的年龄\n\n数树的年轮是判断树年龄的好方法。每个年轮代表一年。使用 `Circle` 或 `Ellipse` 类绘制一棵 5 年老树的年轮可能的样子。然后，使用\
  \ `Text` 形状类从中心向外为每个年轮编号，并标上该年轮对应的年份。\n\n## 3. 好莱坞之星\n\n在好莱坞星光大道上制作属于你自己的星星。编写一个程序，显示一颗与图\
  \ 14-38 所示类似的星星，并在星星上显示你的名字。\n\n![一颗好莱坞星星在白色背景上用黑色字体显示着“在此处输入你的名字”。](img/14fig38.png)\n\
  \n# 图 14-38 好莱坞星星\n\n## 4. 车辆轮廓\n\n使用在本章中学习的形状，绘制你所选车辆的轮廓（汽车、卡车、飞机等）。\n\n## 5. 太阳系\n\
  \n使用 `Circle` 类绘制太阳系中的每个行星。先画太阳，然后根据距离太阳远近绘制每个行星。（水星、金星、地球、火星、木星、土星、天王星、海王星以及矮行星冥王星。）使用\
  \ `Text` 形状类标记每个行星。\n\n## 6. 透明度调节器\n\n创建一个应用程序，让用户通过 `FileChooser` 对话框选择图像文件。应用程序应显示图像并提供一个\
  \ `Slider` 控制。`Slider` 控制允许用户调整图像的透明度。\n\n## 7. 颜色调节器\n\n创建一个应用程序，让用户通过 `FileChooser`\
  \ 对话框选择图像文件。应用程序显示图像并提供四个 `Slider` 。`Slider` 控制允许用户调整图像的色调、饱和度、亮度和对比度。\n\n## 8.\
  \ 鼠标悬停\n\n创建一个显示图片的应用程序。当用户将鼠标指针移动到图像上时，它应该变为第二张图片。只要鼠标指针在上方，第二张图片就会保持显示。当用户将鼠标指针移开第二张图片时，它将变回第一张。\n\
  \n## 9. 抛硬币\n\n### 观看抛硬币\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/JJAh3Z9SR7lU4BUejk_JZFn_Q3KCZRvh`](https://mediaplayer.pearsoncmg.com/assets/_video.true/JJAh3Z9SR7lU4BUejk_JZFn_Q3KCZRvh)\n\
  \n编写一个模拟抛硬币的程序。程序等待用户按键，然后生成一个 0 到 1 之间的随机数。如果数字为 0，显示正面的图像。\n\n## 10. 月球着陆器\n\n\
  如果你有下载](https://media.pearsoncmg.com/ph/esm/0addis-java)的源码，它提供了一个飞天器和月球背景。编写一个程序，在月球上显示飞天器。当用户按下空格键时，飞天器起飞。\n\
  \n## 11. 凑成美元\n\n如果你有下载](https://media.pearsoncmg.com/ph/esm/0addis-java)的源码，它提供了分币、镍币、角币。创建一个游戏，显示这些硬币并带有“凑金额”文字。游戏让用户点击硬币，直到总和达到美元。当用户点击“凑金额”时，程序显示点击的金额。如果金额等于美元，程序提示胜利。\n\
  \n## 12. 石头剪刀游戏\n\n编写一个程序让用户与电脑玩石头剪刀游戏。程序运行如下：\n\n1. 程序开始时，生成一个 0 到 2 之间的随机数。如果数字为\
  \ 0，则是石头；如果是 1，则是纸；如果是 2，则是剪刀。（此时先不显示电脑的选择。）\n2. 为了做出选择，用户点击屏幕上的图像。（源码中包含了这些图像。）\n\
  3. 显示电脑的选择。\n4. 根据规则选择胜者：\n    * 如果一个玩家选石头，另一个玩家选剪刀，则石头胜。（石头压碎剪刀。）\n    * 如果一个玩家选剪刀，另一个玩家选纸，则剪刀胜。（剪刀剪断纸。）\n\
  \    * 如果一个玩家选纸，另一个玩家选石头，则纸胜。（纸包石头。）\n    * 如果两个玩家选择相同，则为平局。\n\n# 第 15 章 递归\n\n\
  ## 目录\n\n1. 15.1 递归简介\n2. 15.2 用递归解决问题\n3. 15.3 递归方法的示例\n4. 15.4 递归二分查找方法\n5. 15.5\
  \ 汉诺塔\n6. 15.6 需要避免的常见错误\n\n## 15.1 递归简介\n\n概念：递归方法是一种会调用自身的方法。\n\n\n\n\n你已经见过方法调用其他方法的实例。方法\
  \ `A` 可以调用方法 `B`，而方法 `B` 又可以调用方法 `C`。方法也可以调用自己。调用自己的方法被称为递归方法。请查看代码列表 15-1 中的 `message`\
  \ 方法。\n\n```\n 1  /**\n  2      This class has a recursive method.\n  3  */\n  4\n\
    5  public class EndlessRecursion\n  6  {\n  7     public static void message()\n\
    8     {\n  9        System.out.println(\"This is a recursive method.\");\n 10\
  \        message();\n  11     }\n  12  }\n```\n\n### 代码列表 15-1 `(EndlessRecursion.java)`\n\
  \n该方法显示字符串 `\"This is a recursive method.\"` 然后调用自己。每当它调用自己时，循环就会重复。你能看出这个方法存在的问题吗？没有办法可以停止递归调用。这个方法就像一个无限循环，因为没有代码可以阻止它的重复。\n\
  \n就像循环一样，递归方法必须有某种方式来控制重复的次数。代码列表 15-2 中的类包含 `message` 方法的修改版本。它传递了一个整数参数，该参数保存了方法调用自己的次数。\n\
  \n在下方的动画中，点击“上一个”或“下一个”按钮逐步执行代码并查看全程的解释。\n\n### 代码列表 15-2 `(Recursive.java)`\n\n\
  [`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr15-2/2.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr15-2/2.html)\n\
  \n该方法包含一个控制重复的 `if` 语句。只要参数 `n` 大于零，方法就会显示消息并再次调用自己。每当它调用自己时，它都会传递 `n − 1` 作为参数。例如，查看代码列表\
  \ 15-3 中的程序。\n\n在下方的动画中，点击“上一个”或“下一个”按钮逐步执行代码并查看全程的解释。\n\n### 代码列表 15-3 `(RecursionDemo.java)`\n\
  \n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr15-3/3.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr15-3/3.html)\n\
  \n该类中的 `main` 方法带有参数 5 调用 `Recursive.message` 方法，这导致方法调用自己五次。当方法第一次被调用时，`if` 语句显示消息，然后用\
  \ 4 作为参数调用自己。图 15-1 说明了这一点。\n\n### 图 15-1 方法的前两次调用\n\n![message 方法的前两次调用被描绘为两个矩形框，分别标记为“方法的第一次调用”和“方法的第二次调用”，值分别为\
  \ n: 5 和 n: 4。](img/15fig01.png)图 15-1 完整替代文本\n\n图 15-1 中的图表说明了 `message` 方法的两次独立调用。每当方法被调用时，内存中都会创建一个参数\
