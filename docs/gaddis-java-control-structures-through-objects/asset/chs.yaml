  \n## 2.12 编程风格\n\n概念：编程风格指的是程序员使用空格、缩进、空行和标点符号来在视觉上安排程序源代码的方式。\n\n在第 1 章中，你学习了语法规则规定了语言的使用方式。Java\
  \ 的语法规则规定了关键字、分号、逗号、大括号以及语言其他元素的放置方式和位置。编译器会检查检查语法错误，如果没有错误，则生成字节码。\n\n当编译器读取程序时，它将其视为一个很长的字符流。编译器并不关心每个语句是否在单独的一上，也不关心空格是否将运算符与操作数隔开。相反，人类很难阅读那些编写方式视觉不美观的程序。以代码列表\
  \ 2-27 为例。\n\n在下面的动画中，点击“上一个”（Previous）或“下一个”（Next）按钮逐步查看代码并查看全程的解释。\n\n### 代码列表\
  \ 2-27 `(Compact.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-27/27.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-27/27.html)\n\
  \n虽然程序在语法上是正确的（它没有违反 Java 的任何规则），但它非常难以阅读。同一个程序在代码列表 2-28 中以更易理解的风格编写出来。\n\n在下面的动画中，点击“上一个”（Previous）或“下一个”（Next）按钮逐步查看代码并查看全程的解释。\n\
  \n### 代码列表 2-28 `(Readable.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-28/28.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-28/28.html)\n\
  \n*编程风格*术语通常指的是源代码视觉安排的方式。它包括在程序中一致放置空格和缩进的技巧，从而创建视觉线索。这些线索可以快速告诉程序员关于程序的重要信息。\n\
  \n例如，注意在代码列表 2-28 中，类大括号内部的每行都缩进了，而在 `main` 方法大括号内部，每行再次缩进。在一组大括号内对所有行进行缩进是一种常见的编程风格，如图\
  \ 2-11 所示。\n\n# 图 2-11 缩进\n\n![编程风格中演示了缩进和额外空格的功能。](img/02fig11.png)图 2-11 完整替代文本\n\
  \n编程风格的另一个方面是如何处理过长到无法排在一行上的语句。注意 `println` 语句跨了三行。在语句的第二行和第三行的开头插入了额外的空格，这表明它们是语句的延续。\n\
  \n在声明相同类型的变量时，常见的做法是将每个变量写在单独的一行，并注释说明其用途。例如：\n\n```\nint fahrenheit,    // 华氏度\n\
  celsius,           // 摄氏度\nkelvin;            // 开尔文度\n```\n\n你可能注意到在语句之间插入了空行。为了将声明与执行语句隔离开。关于编程风格的许多其他问题，将在书中介绍。\n\
