  \ `double`，用于指定阴影在开始模糊之前扩散的距离。默认值为 0.0。 |\n| `setOffsetX(value)` | 参数是一个 `double`\
  \ 类型，用于指定阴影在 `X` 方向的偏移量。默认值为 0.0。 |\n| `setOffsetY(value)` | 参数是一个 `double` 类型，用于指定阴影在\
  \ `Y` 方向的偏移量。默认值为 0.0。 |\n| `setBlurType(blurType)` | 参数是一个 `BlurType` 常量（来自 `javafx.scene.effect`\
  \ 包），用于指定模糊阴影的算法。可能的值有 `BlurType.GASIAN`、`BlurType.ONE_PASS_BOX`、`BlurType.TWO_PASS_BOX`\
  \ 和 `BlurType.THREE_PASS_BOX`（默认值）。 |\n\n![Drop Shadow Demo java 的输出显示了一个带有投影的圆，投影位于圆的内部右侧，X\
  \ 和 Y 偏移量均为 10。阴影位于右侧 10 像素下方 10 像素。](img/14fig23.png)\n\n# 图 14-23 `X` 和 `Y` 偏移量为\
  \ 10 的投影投影（Oracle 法务顾问）\n\n### `InnerShadow` 类\n\n使用 `InnerShadow` 类在节点上创建内投影，这可以改变其的外观。以下代码段（节自\
  \ *DropShadowDemo.java*）展示了一个带有内投影的圆，其 `X` 和 `Y` 偏移量均为 10。代码的输出如图 14-22 所示。\n\n\
  ![Inner Shadow Demo 的输出显示了一个带有内投影的圆](img/ Create an InnerShadow\nInnerShadow innerShadow\
  \ = new InnerShadow();\ninnerShadow.setOffsetX(10);\ninnerShadow.setOffsetY(10);\n\
  \n// Create a Circle object.\nCircle myCircle = new Circle(X, Y, RADIUS, Color.RED);\n\
  myCircle.setEffect(innerShadow);\n```\n\n\n\n\n\n### `SepiaTone` 类\n\n你可以使用 `SepiaTone`\
  \ 类为图像添加复古的深褐色（sepia）调外观。以下代码段展示了如何将效果应用于图像：\n\n```\n// 创建一个 SepiaTone 效果。\n SepiaTone\
  \ sepia = new SepiaTone();\n\n // 将效果应用到图像。\n Image image = new Image(\"file:Ship.jpg\"\
  );\n ImageView imageView = new ImageView(image);\n imageView.setEffect(sepia);\n\
  ```\n\n你可以通过调用 `setLevel` 方法来改变 `SepiaTone` 类效果的强度，传递一个范围在 `0.0` 到 `1.0` 之间的 `double`\
  \ 值。数值越高，效果越强烈。默认情况下，级别为 `1.0`。以下是将级别设置为 `0.5` 的示例代码段：\n\n```\nSepiaTone sepia =\
  \ new SepiaTone();\n sepia.setLevel(0.5);\n```\n\n### `Glow` 类\n\n你可以使用 `Glow` 类来产生发光效果。以下代码段展示了如何将该效果应用于图像：\n\
  \n```\n// 创建一个 Glow 效果。\n Glow glow = new Glow();\n\n // 将效果应用到图像。\n Image image\
  \ = new Image(\"file:SanDiego.png\");\n ImageView imageView = new ImageView(image);\n\
   imageView.setEffect(glow);\n```\n\n\n\n\n\n你可以通过调用 `setLevel` 方法并传递一个 0.0 到 1.0\
  \ 范围内的 `double` 值来更改 `Glow` 类效果的强度。值越高，效果越剧烈。默认级别为 0.3。以下是一个将级别设置为 1.0 的示例代码段：\n\
  \n```\nGlow glow = new Glow();\n glow.setLevel(0.5);\n```\n\n图 14-30 显示了图像在应用和不应用\
  \ `Glow` 效果时的外观。左侧的图像是原始图像，未应用 `Glow` 效果；右侧的图像应用了 `Glow` 效果，且级别设置为 1.0。\n\n![显示了圣地亚哥市在应用和不应用\
  \ Glow 效果的图像。左侧的文本没有 Glow 效果。右侧的文本应用了 Glow 效果，在级别设置为 1.0 时看起来更亮。](img/14fig30.png)\n\
  \n## 图 14-30 未应用和带有 `Glow` 效果的图像\n\n## `Reflection` 类\n\n你可以使用 `Reflection` 类来创建节点的反射。反射会出现在节点下方。下面的代码段将该效果应用到\
  \ `Text` 对象。代码的输出如图 14-31 所示。\n\n![Reflection 效果应用到文本 Hello World，并在文本下方反射出该文本，字母像镜像图像一样反转并逐渐淡出。](img/14fig31.png)\n\
  \n## 图 14-31 应用于 `Text` 对象的 `Reflection` 效果\n\n```\n// 创建一个反射效果。\n Reflection reflect\
  \ = new Reflection();\n\n // 创建一个 Text 对象。\n Text text = new Text(\"Hello World\"\
  );\n text.setFont(new Font(\"SansSerif\", 36));\n text.setEffect(reflect);\n```\n\
  \n`Reflection` 类提供了几种方法，列在表 14-23 中，用于微调反射出现的方式。\n\n## 表 14-23 `Reflection` 类的一些方法\n\
  \n| 方法 | 描述 |\n| --- | --- |\n| `setTopOffset(value)` | `value` 参数是一个 `double` 类型。该方法将\
  \ `value` 设置为节点底部到反射顶部之间的距离。默认值为 0.0。 |\n| `setFraction(value)` | `value` 参数是 `double`\
  \ 类型。该方法将 `value` 设置为出现在反射中的节点比例。默认值为 0.75，这意味着节点底部的 75% 部分将出现在反射中。 |\n| `setTopOpacity(value)`\
  \ | `value` 参数是 0.0 到 1.0 范围内的 `double` 类型。该方法将 `value` 设置为反射顶部边缘的透明度，0.0 为完全透明，1.0\
  \ 为不透明。默认值为 0.5。 |\n| `setBottomOpacity(value)` | `value` 参数是 0.0 到 1.0 范围内的 `double`\
  \ 类型。该方法将 `value` 设置为反射底部边缘的透明度，0.0 为完全透明，1.0 为不透明。默认值为 0.0。 |\n\n## 组合效果\n\n`Node`\
  \ 类的 `setEffect` 方法接受接受一个对象对象参数。如果你对特定节点多次调用 `setEffect` 方法，最后传递作为参数的效果对象将替换之前为该节点传递的任何效果对象。但是，可以使用\
  \ `Effect` 类的 `setInput` 方法来组合效果。下面的代码段展示了将 `DropShadow` 与 `Reflection` 组合的示例，然后将它们都应用到\
  \ `Text` 对象上：\n\n```\n// 创建阴影效果\n DropShadow dropShadow = new DropShadow();\n\n\
   // 创建反射效果。\n Reflection reflect = new Reflection();\n\n 将反射与阴影组合。\n reflect.setInput(dropShadow);\n\
  \n // 创建 Text 对象。\n Text text = new Text(\"Hello World\");\n text.setFont(new Font(\"\
  SansSerif\", 36));\n text.setEffect(reflect);\n```\n\n`setInput` 方法将效果“链”在一起。当这段代码执行时，首先应用阴影效果，然后应用反射效果。结果如图\
  \ 14-32 所示。下面的代码段展示了将三个效果链在一起的示例：`DropShadow`、`SepiaTone` 和 `Reflection`。结果如图 14-33\
  \ 所示。（当图像以黑白打印时，褐褐色效果并不明显，但你可以亲自尝试这段代码以查看真实结果。）\n\n```\n// 创建一个阴影效果。\n DropShadow\
  \ dropShadow = new DropShadow();\n\n  创建一个褐褐色效果。\n SepiaTone sepia = new SepiaTone();\n\
  \n  创建一个反射效果。\n Reflection reflect = new Reflection();\n\n 将阴影与褐褐色组合。\n sepia.setInput(dropShadow);\n\
  \n reflect.setInput(sepia);\n\n  创建一个 Text 对象。\n Text text = new Text(\"Hello World\"\
  );\n text.setFont(new Font(\"SansSerif\", 36));\n text.setEffect(reflect);\n```\n\
  \n\n\n\n\n接下来，你创建一个 `MediaPlayer` 类的实例，并将 `Media` 对象的引用作为参数传递给构造函数。这是一个示例：\n\n```\n\
  MediaPlayer player = new MediaPlayer(media);\n```\n\n一旦你成功创建了 `MediaPlayer` 对象，就可以使用表\
  \ 14-24 列出的 `MediaPlayer` 方法来控制音频文件的播放方式。\n\n## 表 14-24 一些 `MediaPlayer` 方法\n\n\
  | 方法 | 说明 |\n| --- | --- |\n| `setAutoPlay(value)` | 参数是一个 `boolean` 值。如果你向该方法传递\
  \ `true`，则在 `MediaPlayer` 对象创建并准备就绪后将立即播放音频文件。 |\n| `play()` | 开始播放音频文件。通常，此方法从头开始播放音频文件，但如果音频当前处于暂停状态，`play`\
  \ 方法将从暂停的地方继续播放。 |\n| `pause()` | 暂停音频文件。随后调用 `play` 方法将导致音频文件从暂停的地方继续播放。 |\n| `stop()`\
  \ | 停止音频文件的播放。随后调用 `play` 方法将导致音频文件从头开始播放。 |\n| `setCycleCount(value)` | 参数是一个 `int`\
  \ 值，指定音频文件应该播放的次数。默认值为 1。如果你传递值 `MediaPlayer.INDEFINITE`，则音频文件将无限循环播放。 |\n\n例如，以下代码段加载了\
  \ `guitar.wav` 文件，并在文件加载且 `MediaPlayer` 准备就绪后立即播放它：\n\n```\nFile soundFile = new\
  \ File(\"guitar.wav\");\nMedia media = new Media(soundFile.toURI().toString());\n\
  MediaPlayer player = new MediaPlayer(media);\nplayer.setAutoPlay(true);\n```\n\n\
  ### 注意事项\n\n`Media` 类和 `MediaPlayer` 类都不具有任何视觉属性。这两个类都不是 `Node` 的子类，因此你不需要将 `Media`\
  \ 类或 `MediaPlayer` 类的对象添加到你的场景图（scene graph）中。\n\n## 注册 `EndOfMedia` 事件处理器\n\n`MediaPlayer`\
  \ 对象具有某些状态，用于指示 `MediaPlayer` 当前正在的操作。例如：\n\n* 当音频文件加载到内存中且 `MediaPlayer` 准备好播放它时，`MediaPlayer`\
  \ 处于 `READY` 状态。\n* 当音频文件正在播放时，`MediaPlayer` 处于 `PLAYING` 状态。\n* 当音频文件由于 `pause()`\
  \ 方法而暂停时，`MediaPlayer` 处于 `PAUSED` 状态。\n* 当音频文件由于 `stop()` 方法而停止时，`MediaPlayer`\
  \ 处于 `STOPPED` 状态。\n\n当 `MediaPlayer` 对象播放音频文件直到结束时，`MediaPlayer` 对象不会自动转换到 `STOPPED`\
  \ 状态。相反，它保持在 `PLAYING` 状态。这在某些应用程序中会导致问题，因为如果 `MediaPlayer` 对象已经处于 `PLAYING` 状态，`play()`\
  \ 方法将不会播放音频文件。\n\n例如，假设程序有一个 `play` 按钮，用户每次点击按钮时应该播放音频文件。按钮的事件处理器调用 `MediaPlayer`\
  \ 对象的 `play()` 方法。用户点击 `play` 按钮并听音频直到结束。如果用户再次点击 `play` 按钮重新播放音频文件，什么都不会发生，因为 `MediaPlayer`\
  \ 已经处于 `PLAYING` 状态。在类类应用程序中，你需要一种方法在音频文件结束时强制 `MediaPlayer` 对象进入 `STOPPED` 状态。\n\
  \n事实证明，当 `MediaPlayer` 到达音频文件末尾时会触发一个事件。该事件被称为 `EndOfMedia` 事件，你可以使用 `setOnEndOfMedia`\
  \ 方法注册一个事件处理器，该处理器会在事件触发的任何时候执行。在事件处理器中，你只需调用 `MediaPlayer` 的 `stop()` 方法即可强制让 `MediaPlayer`\
  \ 进入 `STOPPED` 状态。以下代码段使用匿名内部类创建了这样一个事件处理器：\n\n```\n// 加载音频文件。\nFile soundFile =\
  \ new File(\"guitar.wav\");\nMedia media = new Media(soundFile.toURI().toString());\n\
  MediaPlayer player = new MediaPlayer(media);\n\n// 注册一个 OnEndOfMedia 事件处理器。\nplayer.setOnEndOfMedia(new\
  \ Runnable()\n{\n   @Override\n   public void run()\n   {\n      player.stop();\n\
  \   }\n});\n```\n\n`EndOfMedia` 事件的事件处理器必须是一个实现了 `Runnable` 接口的类。（`Runnable` 接口位于\
  \ `java.lang` 包中，因此不需要 `import` 语句。） `Runnable` 接口是一个函数接口，指定了一个名为 `run()` 的方法。由于\
  \ `Runnable` 是一个函数接口，我们可以通过将其写为 Lambda 表达式来简化事件处理代码。这是一个示例：\n\n```\n// 加载音频文件。\n\
  File soundFile = new File(\"guitar.wav\");\nMedia media = new Media(soundFile.toURI().toString());\n\
  MediaPlayer player = new MediaPlayer(media);\n\n// 注册一个 OnEndOfMedia 事件处理器。\nplayer.setOnEndOfMedia(()\
  \ ->\n{\n   player.stop();\n});\n```\n\n代码列表 14-14 显示了一个完整的示例。它加载 `guitar.wav` 文件，并显示播放按钮、暂停按钮和停止按钮。这些按钮允许用户播放、暂停和停止音频文件。\n\
  \n```java\nimport javafx.application.Application;\nimport javafx.stage.Stage;\n\
  import javafx.scene.Scene;\nimport javafx.scene.layout.HBox;\nimport javafx.geometry.Pos;\n\
  import javafx.geometry.Insets;\nimport javafx.scene.media.Media;\nimport javafx.scene.media.MediaPlayer;\n\
  import javafx.scene.control.Button;\nimport java.io.File;\n\npublic class SoundPlayer\
  \ extends Application {\n    public static void main(String[] args) {\n        //\
  \ 启动应用程序。\n        launch(args);\n    }\n\n    @Override\n    public void start(Stage\
  \ primaryStage) {\n        // 加载音频文件并创建 MediaPlayer。\n        File soundFile = new\
  \ File(\"guitar.wav\");\n        Media media = new Media(soundFile.toURI().toString());\n\
  \        MediaPlayer player = new MediaPlayer(media);\n\n        // EndOfMedia 事件的处理器。\n\
  \        player.setOnEndOfMedia(() -> {\n            player.stop();\n        });\n\
  \n        // 创建按钮。\n        Button playButton = new Button(\"Play\");\n        Button\
  \ pauseButton = new Button(\"Pause\");\n        Button stopButton = new Button(\"\
  Stop\");\n\n        // 播放按钮的事件处理器。\n        playButton.setOnAction(() -> {\n   \
  \         player.play();\n        });\n\n        // 暂停按钮的事件处理器。\n        pauseButton.setOnAction(()\
  \ -> {\n            player.pause();\n        });\n\n        // 停止按钮的事件处理器。\n   \
  \     stopButton.setOnAction(() -> {\n            player.stop();\n        });\n\n\
  \        // 将按钮放入 HBox 中。\n        HBox hbox = new HBox(10, playButton, pauseButton,\
  \ stopButton);\n        hbox.setAlignment(Pos.CENTER);\n        hbox.setPadding(new\
  \ Insets(10));\n\n        // 以 HBox 为根节点创建场景。\n        Scene scene = new Scene(hbox);\n\
  \n        // 将场景添加到阶段并显示窗口。\n        primaryStage.setScene(scene);\n        primaryStage.show();\n\
  \    }\n}\n```\n\n## 代码列表 14-14 `SoundPlayer.java`\n\n\n\n\n\n### 概念\n\n在 JavaFX\
  \ 中，你使用 `Media`、`MediaPlayer` 和 `MediaView` 类来播放视频。`Media` 类将视频文件加载到内存中，而 `MediaPlayer`\
  \ 类提供了播放视频的方法。`MediaView` 类可以插入到场景图（scene graph）中，提供了一种在屏幕上查看视频的方法。\n\n# 观看播放视频\n\
  \n[`mediaplayer.pearsoncmg.com/assets/_video.true/8FtqjIOwbtDaabarekcKz4T5BE_oFbEe`](https://mediaplayer.pearsoncmg.com/assets/_video.true/8FtqjIOwbtDaabarekcKz4T5BE_oFbEe)\n\
  \n在 JavaFX 中播放视频与播放音频文件类似。首先，你使用 `Media` 类加载视频（JavaFX 支持 FLV 和 MP4 视频格式），然后使用 `MediaPlayer`\
  \ 类控制视频的播放。然而，由于视频必须在屏幕上查看，因此需要第三名为 `MediaView` 的类（`MediaView` 类位于 `javafx.scene.media`\
  \ 包中）。你只需要创建一个 `MediaView` 实例，并将 `MediaPlayer` 对象作为参数传递给构造函数即可。\n\n`MediaView` 类是\
  \ `Node` 的子类，你可以将其添加到场景图中。你通过 `setFitWidth` 和 `setFitHeight` 方法设置查看窗口的大小。视频将根据需要调整大小以适应查看窗口。代码列表\
  \ 14-15 中的程序展示了一个示例。当你运行此程序时，它会加载一个名为 `TakeOff.mp4` 的视频并自动播放。程序的输出示例在图 14-34 所示。\n\
