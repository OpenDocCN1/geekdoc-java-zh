  # 1.3 计算机系统：硬件与软件\n\n概念：所有的计算机系统都由类似的硬件设备和软件组件组成。\n\n## 硬件\n\n`Hardware`指的是组成计算机的物理组件。我们通常认为的计算机不是一个单一的设备，而是一个设备系统。就像交响乐团中的乐器一样，每个设备都扮演自己的角色。一个典型的计算机系统由以下主要组件组成：\n\
  \n* 中央处理器 (CPU)\n* 主内存\n* 次级存储设备\n* 输入设备\n* 输出设备\n\n计算机系统的结构如图图 1-1 所示。\n\n### 图\
  \ 1-1 计算机结构\n\n![扫描仪或键盘等输入设备连接到中央处理器，以及主内存或 RAM。这些设备连接到输出设备，如计算机显示器或打印机。CPU 和 RAM\
  \ 也连接到次级存储设备。](img/01fig01.png)\n\n1-1a (TL) iko/Shutterstock, 1-1b (TL) Nikita\
  \ Rogul/Shutterstock, 1-1c (TLC) Feng Yu/Shutterstock , 1-1d (TLC) Chiyacat/Shutterstock,\
  \ 1-1e Elkostas/Shutterstock, 1-1f (TLB) tkemot/Shutterstock, 1-1g (BC) Vitaly Korovin/Shutterstock,\
  \ 1-1h (TRB) Lusoimages/Shutterstock, 1-1i (TRC) jocic/Shutterstock, 1-1j (TR) Best\
  \ Pictures here/Shutterstock, 1-1k (MC) Peter Guess/Shutterstock, 1-1l (TC) Aquila/Shutterstock\n\
  \n让我们仔细观察这些每一个设备。\n\n### CPU\n\n计算机的核心是它的`central processing unit`（中央处理器），简称 `CPU`。CPU\
  \ 的工作是获取指令、执行指令并产生结果数据。中央处理器内部由两部分组成：`control unit`（控制单元）和算术逻辑单元 (`ALU`)。控制单元协调计算机的所有操作。它负责确定从哪里获取下一条指令，并用控制信号调节计算机的其他主要组件。算术逻辑单元正如其名，设计用于执行数学运算。CPU\
  \ 的结构如图图 1-2 所示。\n\n### 图 1-2 CPU 结构\n\n![指令或输入引导至算术逻辑单元和控制单元，以及结果。](img/01fig02.png)\n\
  \n程序是存储在计算机内存中的指令序列。当程序运行时，CPU 会参与一个被称为`fetch/execute cycle`（取指/执行周期）的过程。取指/执行周期的步骤如下：\n\
  \n| Fetch (取指) | CPU 控制单元从主内存获取下一条指令。 |\n| Decode (解码) | 指令以某种形式编码。控制单元对指令进行解码。\
  \ |\n| Execute (执行) | 将信号路由到相应的组件（如 ALU）。 |\n\n只要有指令需要执行，这些步骤就会重复。\n\n## Checkpoint\
  \ 1.4\n\n`../components/metrodigi/ch01-inline_self_quiz_v1.0.0-04/index.html`\n\n\
  ## Checkpoint 1.5\n\n`../components/metrodigi/ch01-inline_self_quiz_v1.0.0-01/index.html`\n\
  \n### 主内存\n\n通常被称为`random access memory`（随机存存储器）或 `RAM` 的计算机内存是一个存储信息的设备。具体来说，RAM\
  \ 存储运行中的程序指令以及这些程序正在使用的数据。\n\n内存分为若干区域，存储相等的数据。每个区域由八个“开关”组成，开启或关闭。开启状态通常表示数字 1，而关闭状态通常表示数字\
  \ 0。计算机通过将内存位置的开关设置为代表字符或数字的模式来存储数据。这些开关每一个被称为`bit`（位），全称为 `binary digit`。八个位组成的内存区域被称为`byte`（字节）。每个字节都被分配一个唯一的数字，即`address`（地址）。地址从低到高排序。通过地址识别字节就像通过地址识别邮邮箱一样。图\
  \ 1-3 显示了一系列带有地址的字节。在图中，内存中存储了示例数据。数字 149 存储在地址 16 的字节中，数字 72 存储在地址 23 的字节中。\n\n\
  ### 图 1-3 内存字节及其地址\n\n![一个 3 行 10 列的表格。每个单元格按顺序从 0 到 9、10 到 19 以及每行的 20 到 29 。单元格\
  \ 16 包含数据 148，单元格 23 包含 72。](img/01fig03.png)\n\nRAM 通常是易失性内存，仅用于临时存储。当计算机关闭时，RAM\
  \ 中的内容会被擦除。\n\n## Checkpoint 1.6\n\n`../components/metrodigi/ch01-inline_self_quiz_v1.0.0-05/index.html`\n\
