  \ 71  }\n```\n\n\n\n\n\n[图 8-13] 显示了 `Course` 类的 UML 图。注意，`Course` 类有一个 `Instructor`\
  \ 对象和一个 `TextBook` 对象作为字段。将一个类的实例作为另一个类的字段被称为“对象聚合”（`object aggregation`）。`aggregate`（聚合）一词的意思是“由组成部分构成的整体”。在这个例中，`Course`\
  \ 类是一个聚合类，因为它是由组成对象构成的。\n\n# 图 8-13 `Course` 类的 UML 图\n\n![Course 类的 UML 图被分为三个矩形区域。](img/08fig13.png)图\
  \ 8-13 完整替代文本\n\n当一个类的实例是另一个类的成员时，称类与类之间存在“有一个”（has a）关系。例如，`Course`、`Instructor`\
  \ 和 `TextBook` 类之间的关系可以描述如下：\n\n*   该课程“有一个”（has an）讲师（Instructor）。\n*   该课程“有一个”（has\
  \ a）教科书（TextBook）。\n\n“has a” 关系有时被称为“整体-部分关系”（`whole-part relationship`），因为一个对象是一个更大整体的一部分。`Course`\
  \ 类的代码如代码列表 8-14 所示。\n\n在下面的动画中，点击“上一步”或“下一步”按钮逐步查看代码并查看全程的解释。\n\n# 代码列表 8-14 `(Course.java)`\n\
  \n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr8-14/14.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr8-14/14.html)\n\
  \n代码列表 8-15 中的程序演示了 `Course` 类。\n\n```\n1  /**\n2     此程序演示了 Course 类。\n3  */\n\
  4  \n5  public class CourseDemo\n6  {\n7     public static void main(String[] args)\n\
  8     {\n9        // 创建一个 Instructor 对象。\n10        Instructor myInstructor =\n\
  11            new Instructor(\"Kramer\", \"Shawn\", \"RH3010\");\n12 \n13      \
  \  // 创建一个 TextBook 对象。\n14        TextBook myTextBook =\n15            new TextBook(\"\
  Starting Out with Java\",\n16                         \"Gaddis\", \"Pearson\");\n\
  17 \n18        // 创建一个 Course 对象。\n19        Course myCourse =\n20            new\
  \ Course(\"Intro to Java\", myInstructor,\n21                        myTextBook);\n\
  22 \n23        // 显示课程信息。\n24        System.out.println(myCourse);\n25     }\n26\
  \ }\n```\n\n程序输出\n```\nCourse name: Intro to Java\nInstructor Information:\nLast\
  \ Name: Kramer\nFirst Name: Shawn\nOffice Number: RH3010\nTextbook Information:\n\
  Title: Starting Out with Java\nAuthor: Gaddis\nPublisher: Pearson\n```\n\n# 代码列表\
  \ 8-15 `(CourseDemo.java)`\n\n# UML 图中的聚合\n\n在 UML 图中，你通过一条一端带有空心菱形的线连接两个类来显示聚合。菱形靠近作为聚合体的那个类。图\
  \ 8-14 是一个显示 `Course`、`Instructor` 和 `TextBook` 类之间关系的 UML 图。空心菱形靠近 `Course` 类，因为它是聚合体（整体）。\n\
  \n# 图 8-14 显示聚合的 UML 图\n\n![在空心菱形布局中，UML 图显示了 Course、Instructor 和 Text Book 三类之间的聚合。](img/08fig14.png)图\
  \ 8-14 完整替代文本\n\n# 聚合类的安全问题\n\n在编写聚合类时，你应该小心不要无意中创建“安全漏洞”，这些漏洞允许类外部的代码修改私有数据。我们将关注以下两个特定的实践，它们有助于防止你的类中出现安全漏洞：\n\
  \n*   **在创建字段对象时执行深拷贝（Deep Copies）**\n    聚合对象包含对其他对象的引用。当你复制聚合对象时，对它所引用的对象进行进行复制这被称为“深拷贝”（`deep\
  \ copy`）。如果你复制了聚合对象，但对它所引用的对象进行了引用复制，那么你执行的是“浅拷贝”（`shallow copy`）。\n*   **返回字段对象的副本而非原始对象**\n\
  \    当聚合类中的方法返回字段对象的引用时，请返回该字段对象副本的引用。\n\n让我们深入讨论一下这些实践。\n\n# 在创建字段对象时执行深拷贝\n\n\
  让我们仔细观察 `Course` 类。首先，注意第 19 行和第 20 行构造函数接受的参数：\n\n*   传入 `name` 参数的是一个 `String`\
  \ 引用。\n*   传入 `instr` 参数的是一个 `Instructor` 引用。\n*   传入 `text` 参数的是一个 `TextBook` 引用。\n\
  \n接下来，注意构造函数并没有仅仅将 `instr` 赋值给 `instructor` 字段。相反，在第 27 行它创建了一个新的 `Instructor` 对象并将\
  \ `instr` 传递给拷贝函数。这里是语句：\n\n```\ninstructor = new Instructor(instr);\n```\n\n该语句创建了\
  \ `instr` 所引用对象的副本。`instructor` 字段将引用该副本。\n\n当类有一个对象字段时，浅拷贝操作可能会创建安全漏洞。例如，假设 `Course`\
  \ 构造函数如下所示：\n\n```\n// 错误的构造函数！\npublic Course(String name, Instructor instr, TextBook\
  \ text)\n{\n\n   // 赋值 name\n   courseName = name;\n\n   // 赋值 instructor（浅拷贝）\n\
  \   instructor = instr; // 安全漏洞！\n\n   // 赋值 textBook（浅拷贝）\n   textBook = text;\
  \   // 安全漏洞！\n}\n```\n\n在这个例中，这些字段仅仅赋值了传入构造函数的对象的地址。这可能会导致问题，因为 `Course` 对象外部可能存在指向这些\
  \ `Instructor` 和 `TextBook` 对象的变量。\n\n此时，你可能在想为什么没有对 `courseName` 字段执行深拷贝。在第 23\
  \ 行，`Course` 构造函数执行了浅拷贝，仅将 `name` 引用的 `String` 对象地址赋值给 `courseName` 字段。这是允许的，因为\
  \ `String` 对象是不变的（immutable）。不可变对象不提供更改内容的方法。即使 `Course` 类外部的变量引用相同的 `courseName`\
  \ 对象，对象也无法更改。\n\n# 返回字段对象的副本而非原始对象\n\n当聚合类中的方法返回字段对象的引用时，它应该返回字段对象副本的引用，而不是字段对象本身。例如，查看\
  \ `Course` 类中的 `getInstructor` 方法。代码所示：\n\n```\npublic Instructor getInstructor()\n\
  {\n   // 返回 instructor 对象的副本。\n   return new Instructor(instructor);\n}\n```\n\n\
  注意 `return` 语句使用 `new` 关键字创建一个新的 `Instructor` 对象，并将 `instructor` 字段传递给拷贝函数。创建的对象是\
  \ `instructor` 所引用对象的副本。然后返回该副本的地址。这比直接返回字段对象本身要好。例如，假设该方法是这样写的：\n\n```java\n//\
  \ 错误的方法\npublic Instructor getInstructor()\n{\n   // 返回 instructor 对象的引用。\n   return\
  \ instructor;   // 错误！会导致安全漏洞。\n}\n```\n\n\n\n\n\n该方法返回存储在 `instructor` 字段中的值，它是\
  \ `Instructor` 对象的地址。任何接收该地址的变量都可以访问该 `Instructor` 对象。这意味着 `Course` 对象外部的代码可以更改\
  \ `Instructor` 对象所持有的值。这是一个安全漏洞，因为 `Instructor` 对象是一个私有字段！应该只允许 `Course` 类内部的代码访问它。\n\
  \n### 注意\n\n返回 `String` 对象的引用是允许的，即使该 `String` 对象是一个私有字段。这是因为 `String` 对象是不可变的。\n\
  \n# 避免使用 `null` 引用\n\n默认情况下，作为实例字段的引用变量被初始化为值 `null`。这表示该变量没有引用对象。由于 `null` 引用变量没有引用对象，你不能使用它来执行需要对象存在的操作。例如，不能使用\
  \ `null` 引用变量来调用方法。如果你尝试对 `null` 引用变量执行操作，程序将终止。例如，请看代码列表 8-16 所示的 `FullName` 类。\n\
  \n```java\n 1  /**\n  2     此类存储了一个人的姓、名和中间\n  3     名。该类是危险的，因为它没有\n  4     防止在空引用字段上上进行操作。\n\
    5  */\n  6 \n  7  public class FullName\n  8  {\n  9     private String lastName;\
  \        // 姓\n 10     private String firstName;       // 名\n  11     private String\
  \ middleName;      // 中间名\n  12 \n  13     /**\n  14        the setLastName 方法设置\
  \ lastName 字段。\n  15        @param str 要设置 lastName 的 String。\n  16     */\n  17\n\
    18     public void setLastName(String str)\n  19     {\n  20        lastName =\
  \ str;\n  21     }\n  22\n  23     /**\n  24        the setFirstName 方法设置 firstName\
  \ 字段。\n  25        @param str 要设置 firstName 的 String。\n  26     */\n  27 \n  28\
  \     public void setFirstName(String str)\n  29     {\n  30        firstName =\
  \ str;\n  31     }\n  32 \n  33     /**\n  34        the setMiddleName 方法设置 middleName\
  \ 字段。\n  35        @param str 要设置 middleName 的 String。\n  36     */\n  37 \n  38\
  \     public void setMiddleName(String str)\n  39     {\n  40        middleName\
  \ = str;\n  41     }\n  42 \n  43     /**\n  44        the getLength 方法返回全名\n  45\
  \        的的长度。\n  46        @return 长度。\n  47     */\n  48 \n  49     public int\
  \ getLength()\n  50     {\n  51        return lastName.length() + firstName.length()\n\
    52               + middleName.length();\n  53     }\n  54 \n  55     /**\n  56\
  \        the toString 方法返回全名。\n  57        @return 一个 String 的引用。\n  58     */\n\
    59 \n  60     public String toString()\n  61     {\n  62        return firstName\
  \ + \" \" + middleName + \" \"\n  63               + lastName;\n  64     }\n  65\
  \  }\n```\n\n# 代码列表 8-16 `(FullName.java)`\n\n首先，注意该类有三个 `String` 引用变量作为字段：`lastName`、`firstName`\
  \ 和 `middleName`。其次，注意该类没有程序员定义的构造函数。当创建该类的实例时，`lastName`、`firstName` 和 `middleName`\
  \ 字段将由默认构造函数初始化为 `null`。第三，注意 `getLength` 方法在第 51 行和第 52 行使用 `lastName`、`firstName`\
  \ 和 `middleName` 变量来调用 `String` 类的 `length` 方法。没有任何机制防止在这些引用变量中的一个或全部设置为 `null`\
  \ 时调用 `length` 方法。代码列表 8-17 演示了这一点。\n\n```java\n 1  /**\n  2     此程序创建了一个 FullName\
  \ 对象，然后\n  3     在为它的引用字段建立值之前\n  4     调用了对象的 getLength 方法。作为\n  5     结果，此程序将崩溃。\n\
    6  */\n  7 \n  8  public class NameTester\n  9  {\n 10     public static void\
  \ main(String[] args)\n  11     {\n  12        int len; // 用于存储长度\n  13 \n  14 \
  \       // 创建一个 FullName 对象。\n  15        FullName name = new FullName();\n  16\
  \ \n  17        // 获取全名的长度。\n  18        len = name.getLength();\n  19     }\n \
  \ 20  }\n```\n\n# 代码列表 8-17 `(NameTester.java)`\n\n\n\n\n\n该方法使用参数 `sym` 来接收一个赋值给\
  \ `symbol` 字段的参数，并使用参数 `price` 来接收一个赋值给 `sharePrice` 字段的参数。有时，想出一个与字段名不同的良好参数名是困难的（甚至是很耗时的）。为了避免这个问题，许多程序员会给参数与它们对应的字段赋予相同的名称，然后使用\
  \ `this` 关键字来引用字段名。例如，`Stock` 类的构造函数可以写如下：\n\n```\npublic Stock(String symbol, double\
  \ sharePrice)\n {\n    this.symbol = symbol;\n    this.sharePrice = sharePrice;\n\
   }\n```\n\n尽管参数名 `symbol` 和 `sharePrice` 遮蔽（shadow）了字段名 `symbol` 和 `sharePrice`，但\
  \ `this` 关键字克服了遮蔽。因为 `this` 是调用对象的引用，表达式 `this.symbol` 指向调用对象的 `symbol` 字段，而表达式\
  \ `this.sharePrice` 指向调用对象的 `sharePrice` 字段。\n\n# 使用 `this` 从另一个构造函数调用重载构造函数\n\n\
  你已经知道，在创建对象时会自动调用构造函数。你也知道不能像调用其他方法那样显式地调用构造函数。然而，这条规则有一个例外：你可以使用 `this` 关键字在同一个类中的一个构造函数中调用另一个构造函数。\n\
  \n为了说明这一点，回想本章之前介绍的 `Stock` 类。它有以下构造函数：\n\n```\npublic Stock(String sym, double\
  \ price)\n {\n    symbol = sym;\n    sharePrice = price;\n }\n```\n\n该构造函数接收并赋值给\
  \ `symbol` 和 `sharePrice` 字段的参数。假设我们还想要一个只接收 `symbol` 字段参数的构造函数，并为 `sharePrice`\
  \ 字段赋值 0.0。这是编写该构造函数的一种方法：\n\n```\npublic Stock(String sym)\n {\n    this(sym, 0.0);\n\
   }\n```\n\n这个构造函数简单地使用 `this` 变量调用第一个构造函数。它将 `sym` 中的值作为第一个参数传递，并将 0.0 作为第二个参数。结果是\
  \ `symbol` 字段被赋值为 `sym` 的值，而 `sharePrice` 字段被赋值为 0.0。\n\n记住以下关于使用 `this` 调用构造函数的规则：\n\
  \n* `this` 只能用于从同一个类中的一个构造函数调用另一个构造函数。\n* 它必须是正在调用的构造函数的第一条语句。如果不是第一条语句，会导致编译器错误。\n\
