  \ 方法。\n\n```\nfor (int i = 0; i < names.length; i++)\n    System.out.println(names[i].length());\n\
  ```\n\n由于数组的 `length` 成员是一个字段，因此不需要在它的名称后写括号。但在 `String` 类的 `length()` 方法名称后，你需要写括号。\n\
