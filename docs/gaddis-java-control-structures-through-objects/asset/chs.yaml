  \ 类\n\n概念：Java API 中有一个名为 `Object` 的类，所有其他类都直接或间接地 继承自它。\n\nJava 中的每个类（包括 API 中的类和你创建的类）都直接或间接地\
  \ 继承自名为 `Object` 的类，该类是 `java.lang` 包的一部分。实现机制如下：当一个类没有使用 `extends` 关键字来继承另一个类时，Java\
  \ 会自动让它从 `Object` 类进行扩展。例如，查看以下类：\n\n```java\npublic class MyClass\n{\n   (Member\
  \ Declarations .)\n}\n```\n\n该类没有显式扩展其他类，因此 Java 将其视为如下编写的代码：\n\n```java\npublic\
  \ class MyClass extends Object\n{\n   (Member Declarations .)\n}\n```\n\n最终，每个类都扩展了\
  \ `Object` 类。图 10-17 显示了 `PassFailExam` 类如何继承自 `Object`。\n\n# 图 10-17 从 `Object`\
  \ 到 `PassFailExam` 的继承线\n\n![继承线连接了从 Object 到 Pass Fail Exam 的 4 个类。](img/10fig17.png)图\
  \ 10-17 完整备用文本\n\n由于每个类直接或间接地扩展 `Object` 类，因此每个类都继承 `Object` 类的成员。最有用的两个是 `toString`\
  \ 和 `equals` 方法。在第 8 章中，你学习了每个类都有 `toString` 和 `equals` 方法，现在你知道为什么了！因为这些方法是继承自\
  \ `Object` 类。\n\n在 `Object` 类中，`toString` 方法返回一个 `String` 引用，该字符串包含对象的类名，后面跟着 `@`\
  \ 符号，然后是对象的哈希码（一个十六进制数字）。`equals` 方法接受一个对象引用作为参数。如果参数引用的是调用对象，则返回 `true`。这在代码列表\
