  \ 处理鼠标事件\nJavaFX 允许你创建响应鼠标的事件处理器。\n\n# 表 14-25 鼠标事件类型\n\n| 鼠标事件 |  |\n| --- | ---\
  \ |\n| `MOUSE_CLICKED` | 当用户按下并释放鼠标键时发生此事件。 |\n| `MOUSE_DRAGGED` | 当用户在按下鼠标键的同时移动鼠标时发生此事件。\
  \ |\n| `MOUSE_ENTERED` | 当鼠标进入节点占据的空间时发生此事件。 |\n| `MOUSE_EXITED` | 当鼠标光标离开节点占据的空间时发生此事件。\
  \ |\n| `MOUSE_MOVED` | 当在未按下按钮的情况下移动鼠标时发生此事件。 |\n| `MOUSE_PRESSED` | 当用户按下鼠标键时发生此事件。\
  \ |\n| `MOUSE_RELEASED` | 当用户释放鼠标键时发生此事件。 |\n\n每个节点都有责任处理（或忽略）传递给它的鼠标事件。例如，如果你的应用程序显示一个\
  \ `Rectangle`，并且你希望在用户点击 `Rectangle` 时执行操作，那么你必须编写一个响应 `MOUSE_CLICKED` 事件的事件处理器，并将其注册到\
  \ `Rectangle` 上。\n\n要注册鼠标事件处理器，你将在节点上调用以下方法之一：\n\n*   `setOnMouseClicked`。使用此方法为\
  \ `MOUSE_CLICKED` 事件注册事件处理器。\n*   `setOnMouseDragged`。使用此方法为 `MOUSE_DRAGGED` 事件注册事件处理器。\n\
  *   `setOnMouseEntered`。使用此方法为 `MOUSE_ENTERED` 事件注册事件处理器。\n*   `setOnMouseExited`。使用此方法为\
  \ `MOUSE_EXITED` 事件注册事件处理器。\n*   `setOnMouseMoved`。使用此方法为 `MOUSE_MOVED` 事件注册事件处理器。\n\
  *   `setOnMousePressed`。使用此方法为 `MOUSE_PRESSED` 事件注册事件处理器。\n*   `setOnMouseReleased`。使用此方法为\
  \ `MOUSE_RELEASED` 事件注册事件处理器。\n\n[代码列表 14-19] 显示了一个演示如何处理鼠标事件的完整程序。该程序在窗口中心绘制了一个默认黑色的圆形。然后，在第\
  \ 31 行到第 44 行，它为 `MOUSE_ENTERED`、`MOUSE_EXITED` 和 `MOUSE_PRESSED` 事件注册了事件处理器。当鼠标光标进入圆形时，圆形变为红色。当鼠标光标离开圆形时，圆形变回黑色。当用户点击圆形时，圆形变为绿色。\n\
  \n\n\n\n\n```java\nimport javafx.application.Application;\nimport javafx.stage.Stage;\n\
  import javafx.scene.Scene;\nimport javafx.scene.shape.Circle;\nimport javafx.scene.paint.Color;\n\
  import javafx.scene.layout.Pane;\n\npublic class MouseEventDemo extends Application\n\
  {\n    public static void main(String[] args)\n    {\n        // Launch the application.\n\
  \        launch(args);\n    }\n\n    @Override\n    public void start(Stage primaryStage)\n\
  \    {\n        // Constants for the scene size\n        final double SCENE_WIDTH\
  \ = 200.0;\n        final double SCENE_HEIGHT = 200.0;\n\n        // Constants for\
  \ the ball\n        final double CENTER_X = 100.0, CENTER_Y = 100.0;\n        final\
  \ double RADIUS = 40.0;\n\n        // Create the ball.\n        Circle ball = new\
  \ Circle(CENTER_X, CENTER_Y, RADIUS);\n\n        // Register mouse event handlers\
  \ with the ball.\n        ball.setOnMouseEntered(event ->\n        {\n         \
  \  ball.setFill(Color.RED);\n        });\n\n        ball.setOnMouseExited(event\
  \ ->\n        {\n           ball.setFill(Color.BLACK);\n        });\n\n        ball.setOnMousePressed(event\
  \ ->\n        {\n           ball.setFill(Color.GREEN);\n        });\n\n        //\
  \ Add the ball to a Pane.\n        Pane pane = new Pane(ball);\n\n        // Create\
  \ a Scene and display it.\n        Scene scene = new Scene(pane, SCENE_WIDTH, SCENE_HEIGHT);\n\
  \        primaryStage.setScene(scene);\n        primaryStage.show();\n    }\n}\n\
  ```\n\n# 代码列表 14-19 `(MouseEventDemo.java)`\n\n在你的鼠标事件处理程序中，如果你想获取鼠标光标的位置，可以调用 `MouseEvent`\
  \ 对象的 `getSceneX` 和 `getSceneY` 方法。这些方法分别返回鼠标光标的 `X` 和 `Y` 坐标。例如，请代码列表 14-20。程序显示了一个带有\
  \ `Label` 控件的窗口，该控件告诉用户“移动鼠标”。当用户在应用程序窗口内移动鼠标时，鼠标光标的 `(X, Y)` 坐标会持续显示在 `Label` 控件中。程序的输出如图\
  \ 14-37 所示。\n\n```java\nimport javafx.application.Application;\nimport javafx.stage.Stage;\n\
  import javafx.scene.Scene;\nimport javafx.scene.layout.HBox;\nimport javafx.scene.control.Label;\n\
  import javafx.geometry.Pos;\n\npublic class MouseMovedDemo extends Application\n\
  {\n    public static void main(String[] args)\n    {\n        // Launch the application.\n\
  \        launch(args);\n    }\n\n    @Override\n    public void start(Stage primaryStage)\n\
  \    {\n        // Constants for the scene size\n        final double SCENE_WIDTH\
  \ = 200.0;\n        final double SCENE_HEIGHT = 200.0;\n\n        // Create a Label.\n\
  \        Label label = new Label(\"Move the mouse.\");\n\n        // Add the Label\
  \ to a Pane.\n        HBox hbox = new HBox(label);\n        hbox.setAlignment(Pos.CENTER);\n\
  \n        // Create a Scene.\n        Scene scene = new Scene(hbox, SCENE_WIDTH,\
  \ SCENE_HEIGHT);\n\n        // Register an event handler to the scene for\n    \
  \    // the MOUSE_MOVED event.\n        scene.setOnMouseMoved(event ->\n       \
  \ {\n           // Get the mouse cursor’s coordinates.\n           double x = event.getSceneX();\n\
  \           double y = event.getSceneY();\n\n           // Display the mouse cursor’s\
  \ location.\n           label.setText(String.format(\"%.0f, %.0f\", x, y));\n  \
  \      });\n\n        // Set the scene to the stage and display it.\n        primaryStage.setScene(scene);\n\
  \        primaryStage.show();\n    }\n}\n```\n\n# 代码列表 14-20 `(MouseMovedDemo.java)`\n\
  \n# 图 14-37 `MouseMovedDemo.java`\n\n注意 `MouseMovedDemo.java` 应用程序是在窗口中显示的。事件处理程序（位于第\
  \ 35 到 43 行）注册在 `Scene` 上，而不是 `Label` 控件上。这是因为我们希望只要光标在应用程序窗口内就获取鼠标事件。如果我们将事件注册到\
  \ `Label` 控件，那么只有当光标悬在 `Label` 上时我们才会获取事件。`MOUSE_MOVED` 事件在用户移动鼠标时触发。这一点证明了这一点。程序画了一个圆，然后注册了一个事件处理程序允许用户拖动鼠标。\n\
  \n```java\nimport javafx.application.Application;\nimport javafx.stage.Stage;\n\
  import javafx.scene.Scene;\nimport javafx.scene.layout.Pane;\nimport javafx.scene.shape.Circle;\n\
  \npublic class MouseDraggedDemo extends Application\n{\n    public static void main(String[]\
  \ args)\n    {\n        // Launch the application.\n        launch(args);\n    }\n\
  \n    @Override\n    public void start(Stage primaryStage)\n    {\n        // Constants\
  \ for the scene size\n        final double SCENE_WIDTH = 200.0;\n        final double\
  \ SCENE_HEIGHT = 200.0;\n\n        // Constants for the ball\n        final double\
  \ CENTER_X = 100.0, CENTER_Y = 100.0;\n        final double RADIUS = 40.0;\n\n \
  \       // Create the ball.\n        Circle circle = new Circle(CENTER_X, CENTER_Y,\
  \ RADIUS);\n\n        // Register an event handler for\n        // the MOUSE_DRAGGED\
  \ event.\n        circle.setOnMouseDragged(event ->\n        {\n           // Get\
  \ the mouse cursor’s coordinates.\n           double x = event.getSceneX();\n  \
  \         double y = event.getSceneY();\n\n           // Move the circle.\n    \
  \       circle.setCenterX(x);\n           circle.setCenterY(y);\n        });\n\n\
  \        // Add the ball to a Pane.\n        Pane pane = new Pane(circle);\n\n \
  \       // Create a Scene and display it.\n        Scene scene = new Scene(pane,\
  \ SCENE_WIDTH, SCENE_HEIGHT);\n        primaryStage.setScene(scene);\n        primaryStage.show();\n\
  \    }\n}\n```\n\n# 代码列表 14-21 `(MouseDraggedDemo.java)`\n\n\n\n\n\n*   使用 `RotationTransition`\
  \ 以错误的方向旋转节点。如果你向 `setToAngle` 或 `setByAngle` 方法传递正角度，旋转将按顺时针方向。如果你向这些方法中的任一个传递负角度，旋转将按逆时针方向进行。\n\
  \n*   尝试使用 `Node` 类的 `setEffect` 方法来组合效果。`Node` 类的 `setEffect` 方法只接受一个效果对象作为参数。如果你对某个节点多次调用\
  \ `setEffect` 方法，你最后一次作为参数传递的效果对象将替换掉之前为该节点传递的任何效果对象。但是，可以使用 `Effect` 类的 `setInput`\
  \ 方法来组合效果。\n\n*   为错误的节点注册 `KeyEvent` 处理器。在大多数情况下，你可能希望在 `Scene` 对象上注册 `KeyEvent`\
  \ 处理器。这样，无论哪个节点拥有输入焦点，你的 `KeyEvent` 处理器都会响应按键事件。\n\n# 检查点 14.30\n\n../components/metrodigi/ch14-inline_self_quiz_v1.0.0-30/index.html\n\
