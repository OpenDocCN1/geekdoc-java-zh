  \n## 编程挑战\n\n## 客户插入器问题\n[`mediaplayer.pearsoncmg.com/assets/_video.true/SwzCyTAKw6tSvpx_XBOl9NkJXARII13k`](https://mediaplayer.pearsoncmg.com/assets/_video.true/SwzCyTAKw6tSvpx_XBOl9NkJXARII13k)\n\
  \n### 1. 客户插入器\n编写一个连接到 `CoffeeDB` 数据库的应用程序，允许用户向 `Customer` 表插入新行。\n\n### 2. 客户更新器\n\
  编写一个连接到 `CoffeeDB` 数据库的应用程序，允许用户选择客户，然后更改该客户的任何信息。（你不尝试更改客户编号，因为它被 `UnpaidOrder`\
  \ 表引用。）\n\n### 3. 未付订单总和\n编写一个连接到 `CoffeeDB` 数据库的应用程序，然后计算并显示未付订单的欠额。这将是每行 `Cost`\
  \ 列之和。\n\n### 4. 人口数据库\n确保你已经[下载](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/downloads/Source_Code.zip)了书的源代码。在本章源代码文件夹中，你会找到一个名为\
  \ `CreateCityDB.java` 的程序。编译并运行该程序。该程序将创建一个名为 `CityDB` 的 Java DB 或 Apache Derby\
  \ 数据库。`CityDB` 数据库将有一个名为 `City` 表，包含以下列：\n\n| 列名 | 数据类型 |\n| --- | --- |\n| `CityName`\
  \ | `CHAR (50)` |\n| 主键 | |\n| `Population` | `DOUBLE` |\n\n`CityName` 列存储城市名称`Population`\
  \ 列存储该城市的人口。运行 `CreateCityDB.java` 程序后，`City` 表将包含 20 行不同的城市及其人口。接下来，编写一个连接到 `CityDB`\
  \ 数据库的程序，允许用户选择以下：\n-   按人口升序排列城市列表\n-   按人口降序排列城市列表\n-   按名称排列城市列表\n-   获取所有城市的人口总数\n\
  -   获取所有城市的人口平均值\n-   获取所有城市的人口最高值\n\n### 5. 人员创建器\n创建一个名为 `Personnel` 的数据库。该数据库应有一个名为\
  \ `Employee` 的表，包含 `employee ID`、`name` 和 `hourly pay` 列。`employee ID` 应该是主键。在 `Employee`\
  \ 表中插入至少五行数据。\n\n### 6. 员工插入器\n编写一个 GUI 应用程序，允许用户向 `Personnel` 数据库添加新员工。\n\n###\
  \ 7. 员工更新器\n编写一个 GUI 应用程序，允许用户根据 `employee ID` 更改员工的任何信息。\n\n### 8. 电话簿数据库\n创建一个名为\
  \ `PhoneBook` 的数据库。接下来，编写一个程序，允许用户添加电话号码、更改电话号码并删除行。\n\n# 附录 A: ASCII/Unicode 字符\n\
