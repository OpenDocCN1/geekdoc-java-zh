  \ `Pane` 对象，因为它们是不执行布局操作的简单容器。`Pane` 类位于 `javafx.scene.layout` 包中。\n\n# `Line` 类\n\
  \n`Line` 类有两个构造函数，已在 表 14-2 中进行了总结。\n\n## 表 14-2 `Line` 类的构造函数\n\n| 构造函数 | 描述 |\n\
  | --- | --- |\n| `Line()` | 创建一条空线。调用 `Line` 类的 `setStartX` 和 `setStartY` 方法来建立线条的起点，并调用\
  \ `setEndX` 和 `setEndY` 方法来建立线条的终点 |\n| `Line(startX, startY, endX, endY)` | 所有参数均为\
  \ `doubles`。`startX` 和 `startY` 参数是线条起点的 `X` 和 `Y` 坐标。`endX` 和 `endY` 参数是线条终点的 `X`\
  \ 和 `Y` 坐标。 |\n\n第二个构造函数是你常用的。下面的语句显示了一个示例。它创建了一条起点在 (80, 120) 终点在 (400, 520) 的线：\n\
  \n```\nLine myLine = new Line(80, 120, 400, 520);\n```\n\n如果你使用无参构造函数，则必须使用类的 `setStartX`、`setStartY`、`setEndX`\
  \ 和 `setEndY` 方法来建立线条的起点和终点。这是一个创建一个起点为 (0, 0)、终点为 (200, 200) 的线的示例：\n\n```\nLine\
  \ myLine = new Line();\n myLine.setStartX(0);\n myLine.setStartY(0);\n myLine.setEndX(200);\n\
   myLine.setEndY(200);\n```\n\n代码列表 14-1 显示了一个使用 `Line` 类绘制三角形的程序。程序的输出如 图 14-2 所示。图\
