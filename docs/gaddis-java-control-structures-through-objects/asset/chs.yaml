  \n## 15.4 递归二分查找方法\n\n**概念**：递归二分查找算法比迭代版本更优雅且易于理解。\n\n在第 7 章中，你学习了二分查找算法并看到了用 Java\
  \ 编写的迭代示例。二分查找算法也可以递归实现。例如，该过程可以表示为：\n\n```\n如果 array[middle] 等于搜索值，则找到了该值。\n如果\
  \ array[middle] 小于搜索值，则对数组的上半部分执行二分查找。\n如果 array[middle] 大于搜索值，则对数组的下半部分执行二分查找。\n\
  ```\n\n将递归算法与其迭代版本进行比较，显然递归版本更优雅且易于理解。递归二分查找算法也是不断将问题分解直到解决的良好示例。以下是该方法的代码：\n\n\
  ```java\npublic static int binarySearch(int[] array, int first, int last, int value)\n\
  {\n   int middle; // 搜索中间\n   // 测试未找到值的情况。\n   if (first > last)\n      return\
  \ -1;\n   // 计算中间位置。\n   middle = (first + last) / 2;\n   // 搜索值。\n   if (array[middle]\
  \ == value)\n      return middle;\n   else if (array[middle] < value)\n      return\
  \ binarySearch(array, middle + 1, last);\n   else\n      return binarySearch(array,\
  \ first, middle - 1);\n}\n```\n\n第一个参数 `array` 是要搜索的数组。下一个参数 `first` 持有搜索范围内第一个元素的下标（数组的一部分）。下一个参数\
  \ `last` 持有搜索范围内最后一个元素的下标。最后一个参数 `value` 持有要搜索的值。与迭代版本一样，该方法在找到值时返回下标，未找到则返回 `-1`。代码列表\
  \ 15-9 展示了该方法。在下面的动画中，点击“上一个”或“下一个”按钮逐步执行代码。\n\n### 代码列表 15-9 `(RecursiveBinarySearch.java)`\n\
