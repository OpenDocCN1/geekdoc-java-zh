  \n### 变量赋值与初始化\n\n正如你已经在几个示例中看到的，一个值通过*赋值语句*被放入变量中。例如，以下语句将值 12 赋给变量 `unitsSold`：\n\
  \n```\nunitsSold = 12;\n```\n\n`=` 符号被称为赋值运算符。运算符对数据执行操作。运算符所处理的数据称为操作数。赋值运算符有两个操作数。在上面的语句中，操作数是\
  \ `unitsSold` 和 `12`。\n\n在赋值语句中，接收赋值的变量名必须出现在运算符的左侧，而被赋值的值必须出现在右侧。以下语句是错误的：\n\n\
  ```\n12 = unitsSold;      // 错误！\n```\n\n`=` 运算符左侧的操作数必须是一个变量名。`=` 符号右侧的操作数必须是一个具有值的表达式。赋值运算符获取右操作数的值并将其放入左操作数所标识的变量中。假设\
  \ `length` 和 `width` 都是 `int` 变量，以下代码说明赋值运算符的右操作数可以是字面量或变量：\n\n```\nlength = 20;\n\
  width = length;\n```\n\n注意的是，赋值运算符只改变其左侧操作数的内容。第二个语句将 `length` 变量的值赋给 `width` 变量。语句执行后，`length`\
  \ 保持原有的值。\n\n你也可以在声明时为变量赋值。这被称为*初始化*。代码列表 2-15 展示了如何这样做。\n\n### 代码列表 2-16 `(Letters2.java)`\n\
  \n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-15/15.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-15/15.html)\n\
  \n变量 `month` 初始化为 2，`days` 初始化为 28。这里是其他示例：\n\n```java\nint month = 2;\nint days\
  \ = 28;\ndouble payRate = 25.5;\nfloat interestRate = 12.9;\nchar stockCode = 'D';\n\
  int customerNum = 45;\n```\n\n在下面的动画中，点击“上一个”或“下一个”按钮可以逐步查看代码并查看贯穿其中的解释。\n\n# 变量只能存储一个\n\
  \n记住，变量只能存储一个值。当你为变量赋值新值时，新值会替换旧的内容。例如，看下面的代码：\n\n```java\nint x = 5;\nSystem.out.println(x);\n\
  x = 99;\nSystem.out.println(x);\n```\n\n在这段代码中，变量 `x` 初始化为 5 并输出了其内容。然后它被赋值为 99。这将产生输出：\n\
  \n```\n5\n99\n```\n\n# Checkpoint 2.27\n\n../components/metrodigi/ch02-inline_self_quiz_v1.0.0-14/index.html\n\
