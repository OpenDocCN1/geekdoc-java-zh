  \    ```\n    feet = meters * 3.281\n    ```\n*   编写一个名为 `menu` 的 `void` 方法来显示菜单。该方法不接受任何参数。程序将继续显示菜单，直到用户输入\
  \ 4 退出程序。\n*   程序不应接受以米为单位的负数。\n*   如果用户从菜单选择了无效选项，程序应显示错误消息。\n\n以下是程序的会话示例，使用控制台输入。用户的输入将以粗体显示。\n\
