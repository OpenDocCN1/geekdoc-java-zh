  \n# 13.10 使用控制台输出调试 GUI 应用程序\n\n概念：调试 GUI 应用程序时，你可以使用 `System.out.print`、`System.out.println`\
  \ 或 `System.out.printf` 向控制台发送诊断消息。\n\n当应用程序运行不正常时，程序员有时会编写语句，在应用程序中显示诊断消息。例如，如果应用程序对某个计算没有给出正确结果，可以在程序执行的各个点显示诊断消息，显示计算中使用的所有变量的值。如果问题是由未正确初始化的变量或未分配正确值的变量引起的，诊断消息将揭示这个问题。这有助于程序员在应用程序运行时看到“在内部”正在发生什么。\n\
  \n控制台输出方法 `System.out.print`、`System.out.println` 和 `System.out.printf` 是在 GUI 应用程序中显示诊断消息的宝用工具。因为这些方法将输出发送到控制台，因此可以在不干扰应用程序\
  \ GUI 窗口的情况下显示诊断消息。代码列表 13-28 显示了一个了一个示例。这是你在第 12 章中看到的 LambdaKiloConverter 程序的修改版本。在这个版本的程序中，我们在\
  \ `calcButton` 的事件处理器内部了写入控制台消息的语句。包含调用的行已**粗体**显示。这些调用显示了应用程序从文本框检索的值，以及其在计算中使用的值。\n\
