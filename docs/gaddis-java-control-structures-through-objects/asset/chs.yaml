  \n从 `ArrayList` 中删除项\n\n`ArrayList` 类有一个 `remove` 方法，可以删除指定索引处的项。你将索引作为参数传递给该方法。代码列表\
  \ 7-25 中的程序演示了这一操作。\n\n在下方的动画中，点击“上一个”或“下一个”按钮逐步执行代码并查看贯穿其中的解释。\n\n### 代码列表 7-25\
