  \n## 6.8 包与 `import` 语句\n\n**概念：API 中的类组织成包。`import` 语句告诉编译器类所在的包。**\n\n在第 2 章中，你接触了\
  \ Java API，它是一个预写的标准库。API 中的每个类都是为了特定的目的而设计的，你已经使用了一些 API 类，例如 `String` 类、`Scanner`\
  \ 类、`JOptionPane` 类和 `Random` 类。\n\nAPI 中的类都组织成包。包简单来说就是相关类的集合。许多 API 类对程序并不是自动可用的。通常，你需要导入一个\
  \ API 类才能使用它。你使用 `import` 关键字来导入类。例如，以下语句用于导入 `Scanner` 类：\n\n```java\nimport java.util.Scanner;\n\
  ```\n\n该语句告诉编译器 `Scanner` 类位于 `java.util` 包中。\n\n## 显式和通配 `import` 语句\n\n`import`\
  \ 语句有两种类型：显式和通配。*显式* `import` 语句识别单个类的包位置。例如，以下语句显式识别了 `Scanner` 类的位置：\n\n```java\n\
  import java.util.Scanner;\n```\n\n`java.util` 包还包含许多其他类，以及 `Scanner` 类。例如，`Random`\
  \ 类也是 `java.util` 包的一部分。如果一个程序需要使用 `Scanner` 类和 `Random` 类，它必须导入这两个类。实现此目的的方法是为每个类编写显式的\
  \ `import` 语句，如下：\n\n```java\nimport java.util.Scanner;\nimport java.util.Random;\n\
  ```\n\n另一种导入这两个类的方法是使用通配 `import` 语句。*通配导入*语句告诉编译器导入包中的所有类。这里有一个例子：\n\n```java\n\
  import java.util.*;\n```\n\n包名后的 `.*` 告诉编译器导入 `java.util` 包中的所有类。使用通配 `import` 语句不会影响程序的性能或大小。它只是告诉编译器你希望让特定包中的每个类对你的程序都可用。\n\
  \n\n\n\n\nJava API 确实包含一个包 `java.lang`，它会自动导入到每个 Java 程序中。该包包含了通用类，例如 `String` 和\
  \ `System`，这些类对于 Java 编程语言是基础性的。对于 `java.lang` 包中的任何类，你都不需要编写 `import` 语句。\n\n#\
  \ 其他 API 包\n\nJava API 中有许多包。表 6-2 列出了其中的其中几个。\n\n## 表 6-2 一些标准的 Java 包\n\n| 包 |\
  \ 描述 |\n| --- | --- |\n| `java.io` | 提供执行各种类型输入输出的类。 |\n| `java.lang` | 提供 Java\
  \ 语言的通用类。该包会被自动导入。 |\n| `java.net` | 提供用于网络通信的类。 |\n| `java.security` | 提供实现安全功能的类。\
  \ |\n| `java.sql` | 提供使用结构化查询语言访问数据库的类。 |\n| `java.text` | 提供用于格式化文本的各种类。 |\n| `java.util`\
  \ | 提供各种实用类。 |\n\n# 6.9 关注面向对象的设计：寻找类及其职责\n\n到目前为止，你已经学习了编写类、从类创建对象以及使用对象执行操作的基础知识。虽然这些知识对于创建面向对象的应用程序是必要的，但它们并不是第一步。第一步是分析你正试图解决的问题，并确定你需要的类。在本节中，我们将讨论一种寻找问题中的类并确定其职责的简单技术。\n\
  \n## 寻找类\n\n在开发面向对象的应用程序时，你的首要任务之一是识别你需要创建的类。通常，你的目标是识别问题中存在的不同类型的现实世界对象，然后在应用程序中为这些类型的对象创建类。\n\
  \n多年来，软件专业人员开发了许多在给定问题中寻找类技术。一种简单且流行的技术涉及以下步骤：\n\n1. 获取问题领域的书面描述。\n2. 识别描述中所有的名词（包括代词和名词短语）。其中的每一个都是一个潜在的类。\n\
  3. 精炼列表，只包含与问题相关的类。\n\n让我们仔细查看这些每一个步骤。\n\n## 编写问题描述\n\n问题领域是现实世界对象、实体和事件的集合。如果你充分理解了问题，就可以写一段描述。例如，假设我们有以下内容：\n\
  \n> Joe 的汽车店（Joe’s Automotive Shop）维修外国汽车，并专门从事奔驰、宝马汽车的服务。当客户把汽车带到店里时，经理获取姓名、地址和电话号码。然后，经理确定汽车的品牌、型号和年份。服务报价单显示了零件费、人工费、销售税和总费用。\n\
  \n在这个例子中，我们的应用程序需要关注以下内容：\n\n*   Joe’s Automotive Shop\n*   foreign cars\n*   cars\n\
  *   Mercedes\n*   BMW\n*   customer\n*   car\n*   shop\n*   manager\n*   name\n\
  *   address\n*   telephone number\n*   make\n*   model\n*   year\n*   service quote\n\
  *   parts charges\n*   labor charges\n*   sales tax\n*   total charges\n\n## 识别所有名词\n\
  \n下一步是识别描述中所有的名词（如果我们也将代词的话）。这里是对名词的再次查看：\n\n*   Joe’s Automotive Shop\n*   foreign\
  \ cars\n*   cars\n*   Mercedes\n*   BMW\n*   customer\n*   car\n*   shop\n*   manager\n\
  *   name\n*   address\n*   telephone number\n*   make\n*   model\n*   year\n*  \
  \ service quote\n*   parts charges\n*   labor charges\n*   sales tax\n*   total\
  \ charges\n\n注意有些名词是重复的：\n\n| address |\n| car |\n| customer |\n| labor charges\
  \ |\n| parts charges |\n| foreign cars |\n| manager |\n| make |\n| model |\n| name\
  \ |\n| problem |\n| shop |\n| service quote |\n| sales tax |\n| shop |\n| telephone\
  \ number |\n| total charges |\n| year |\n\n## 精炼名词列表\n\n下一步是精炼列表，只包含问题所必需类。某些名词的意思相同：\n\
  \n*   `car`、`cars` 和 `foreign cars`（都指代同一个概念）\n*   `Joe’s Automotive Shop` 和 `shop`（都指代公司）\n\
  \n我们可以为这些中的每一个确定一个单一类。在这个例子中，我们将从列表中删除 `cars` 和 `foreign cars`，并使用 `car`。同样，我们将从列表中删除\
  \ `Joe’s Automotive Shop` 并使用 `shop`。更新后的潜在类列表如下：\n\n| address |\n| car |\n| customer\
  \ |\n| labor charges |\n| parts charges |\n| manager |\n| make |\n| model |\n| name\
  \ |\n| service quote |\n| sales tax |\n| telephone number |\n| total charges |\n\
  | year |\n\n某些名词代表了我们为了解决问题而不需要关注的条目。对描述的快速回顾提醒了我们的应用程序应该做什么：打印服务报价单。在这个例子中，我们可以从列表中剔除两个不必要的类：\n\
  \n*   我们可以从列表中划掉 `shop`，因为我们的应用程序只需要关注单个服务报价单。它不需要处理或确定任何公司范围的信息。如果问题描述要求我们记录所有服务报价单的总和，那么为\
  \ `shop` 创建类就有意义了。\n*   我们不需要 `manager` 创建类，因为问题陈述并没有指示我们处理任何关于经理的信息。如果有多个店经理，且问题描述要求我们记录哪个经理生成了每份服务报价单，那么为\
  \ `manager` 创建类就有意义了。\n\n\n\n\n\n我们的问题描述并没有引导我们处理任何关于 `shop` 的信息，也没有任何关于 `manager`\
  \ 的信息，因此我们已经从列表中删除了这些内容。\n\n# 3. 某些名词可能代表对象，而不是类。\n\n我们可以排除 `Mercedes`、`Porsche`\
  \ 和 `BMW` 作为类，因为在这个示例中，它们都代表特定的汽车，可以被视为 `car` 类的实例。在描述中，它指的是客户带到商店的某辆特定的汽车。因此，它也代表\
  \ `cars` 的一个实例。此时，更新后的潜在类列表如下：\n\n| address ~~BMW~~ |\n| car |\n| ~~cars~~ |\n|\
  \ customer |\n| estimated labor charges |\n| estimated parts charges ~~foreign cars~~\
  \ ~~Joe’s Automotive Shop~~ |\n| make |\n| ~~manager~~ |\n| ~~Mercedes~~ |\n| model\
  \ |\n| name ~~Porsche~~ sales tax |\n| service quote |\n| ~~shop~~ |\n| telephone\
  \ number |\n| total estimated charges |\n| year |\n\n我们删除了 `Mercedes`、`Porsche`\
  \ 和 `BMW`，因为它们都是汽车类的实例。这意味着这些名词标识的是对象，而不是类。\n\n### 提示\n\n一些面向对象的设计师会注意名词是复数还是单数。有时，复数名词表示一个类，而单数名词表示一个对象。\n\
  \n# 4. 某些名词可能代表可以存储在原始变量中的简单值，不需要类。\n\n记住，类包含字段和方法。字段是存储在类对象中的相关项，并定义了对象的状态。方法是类对象可以执行的操作或行为。如果一个名词代表一种没有任何可识别字段或方法的类型，那么它可能可以从列表中删除。为了帮助判断一个名词是否代表具有字段和方法的项，可以就它提出以下问题：\n\
  \n* 你会使用一组相关值来表示该该项目的状态吗？\n* 该项目是否有任何明显可以执行的操作？\n\n如果这两个问题的答案都是“否”，那么该名词可能代表一个可以存储在原始变量中的值。如果我们把此测试应用于列表中剩余每个名词，可以得出以下内容可能不是类：`address`、`estimated\
  \ labor charges`、`estimated parts charges`、`make`、`model`、`name`、`sales tax`、`telephone\
  \ number`、`total estimated charges` 和 `year`。这些都是可以存储在原始变量中的简单字符串或数值。以下是更新后的潜在类列表：\n\
  \n| ~~address~~ ~~BMW~~ |\n| car |\n| ~~cars~~ |\n| customer |\n| ~~estimated labor\
  \ charges~~ |\n| ~~estimated parts charges~~ ~~foreign cars~~ ~~Joe’s Automotive\
  \ Shop~~ |\n| ~~make~~ |\n| ~~manager~~ |\n| ~~Mercedes~~ |\n| ~~model~~ |\n| ~~name~~\
  \ ~~Porsche~~ ~~sales tax~~ |\n| service quote |\n| ~~shop~~ |\n| ~~telephone number~~\
  \ |\n| ~~total estimated charges~~ |\n| ~~year~~ |\n\n我们删除了 `address`、`estimated\
  \ labor charges`、`estimated parts charges`、`make`、`model`、`name`、`sales tax`、`telephone\
  \ number`、`total estimated charges` 和 `year` 作为类，因为它们代表可以存储在原始变量中的简单值。\n\n从列表中可以看出，我们删除了\
  \ `cars`、`customer` 和 `service quote` 之外的所有内容。这意味着在我们的应用程序中，我们需要类来表示汽车、客户和服务报价。最终，我们将编写一个\
  \ `Car` 类、一个 `Customer` 类和一个 `ServiceQuote` 类。\n\n# 识别类的职责\n\n一旦确定了类，下一个任务就是识别每个类的职责。类的\
  \ `responsibilities`（职责）如下：\n\n* 类负责知道的事物\n* 类负责执行的操作\n\n当你确定了类负责知道的事物时，你就识别了类的属性。这些值将存储在字段中。同样，当你确定了类负责执行的操作时，你就识别了它的方法。\n\
  \n经常询问“在这个问题的背景下，类必须知道什么？类必须做什么？”这类问题通常很有帮助。寻找答案第一个地方是问题领域的描述。类必须知道和要执行的很多事情都会被提到。然而，某些类的职责可能没有直接在问题领域中提到，因此通常需要头脑风暴。让我们把这种方法应用到我们之前从问题领域识别出的类上。\n\
  \n# `Customer` 类\n\n在我们的问题领域背景下，`Customer` 类必须知道什么？描述直接提到了以下项目，它们都是客户的属性：\n\n* 客户的姓名\n\
  * 客户的地址\n* 客户的电话号码\n\n这些都是可以表示为字符串并存储在类字段中的值。`Customer` 类可能知道许多其他事情。在这一阶段可能犯的错误是识别了太多的对象负责知道的事物。在某些应用程序中，`Customer`\
  \ 类可能知道客户的电子邮件地址。这个特定的问题领域没有提到客户的电子邮件地址用于任何用途，因此我们不应该将其作为职责。\n\n现在让我们识别类方法。在我们的问题领域背景下，`Customer`\
  \ 类必须做什么？唯一明显的操作如下：\n\n* 创建 `Customer` 对象\n* 设置和获取姓名\n* 设置和获取地址\n* 设置和获取电话号码\n\n\
  从这个列表中可以看出，`Customer` 类将有一个构造函数，以及每个字段的访问器和修改器方法。\n\n\n\n\n经过仔细思考和一些头脑风暴，你会发现其中两个项目是计算结果：销售税和总预估费用。这些项目取决于估算的零件费用和人工费用字段的值。为了避免持有过时数据的风险，我们不会将这些值存储在字段中。相反，我们将提供计算这些值并返回它们的方法。该类需要的其他方法是构造函数，以及用于估算零件费用和估算人工费用字段的访问器（accessors）和修改器（mutators）。图\
  \ 6-29 显示了 `ServiceQuote` 类的 UML 图。\n\n## 图 6-29 ServiceQuote 类的 UML 图\n\n![Service\
  \ Quote 类的 UML 图分为三个矩形区域。](img/Fig06-31.png)图 6-29 完整替代文本\n\n## 这仅仅是开始\n\n你应该仅将我们在本节中讨论的过程视为一个起点。意识到设计面向对象的应用程序是一个迭代过程是非常关重要的。你可能需要尝试几次才能识别出所有需要的类，并确定它们的所有职责。随着设计过程的展开，你将对问题有更深入的理解，因此你会发现改进设计的方法。\n\
  \n## 检查点 6.37\n\n../components/metrodigi/ch06-inline_self_quiz_v1.0.0-31/index.html\n\
  \n## 检查点 6.38\n\n../components/metrodigi/ch06-inline_self_quiz_v1.0.0-32/index.html\n\
  \n## 6.10 需要避免的常见错误\n\n- `在方法头末尾加分号`。方法头末尾永远不会出现分号。\n- `声明变量来引用对象，但忘记使用 `new` 关键字来创建对象`。声明变量来引用对象不会创建对象。你必须使用\
  \ `new` 关键字来创建对象。\n- `忘记在位于 `new` 关键字之后的类名后必须出现括号`。类名出现在 `new` 关键字之后，在类名后面要紧跟一组括号。即使不向构造函数传递任何参数，你也必须写上括号。\n\
  - `当构造函数需要参数时忘记提供参数`。使用带有参数变量的构造函数时，你必须为它们提供参数。\n- `尝试通过赋予不同的返回类型来重载方法`。重载方法必须具有唯一的参数列表。\n\
  - `忘记为想要在不向构造函数传参数的情况下创建类编写无参构造函数`。如果你写了一个接受参数的构造函数，那么如果你想在不传递参数的情况下创建类的实例，则必须为同一个类编写一个无参构造函数。\n\
  - `在方法中无意地声明与同类字段同名的局部变量`。当方法的局部变量与同类的字段同名时，局部变量的名字会遮蔽（shadow）字段的名字。\n\n## 检查点 6.42\n\
  \n../components/metrodigi/ch06-inline_self_quiz_v1.0.0-33/index.html\n\n## 编程挑战\n\
  \n### 1. `Employee` 类\n\n编写一个名为 `Employee` 的类，具有以下字段：\n\n- `name`。`name` 字段引用一个\
  \ `String` 对象，存储员工的姓名。\n- `idNumber`。`idNumber` 是一个 `int` 变量，存储员工的 ID 号。\n- `department`。`department`\
  \ 字段引用一个 `String` 对象，存储员工工作部门名称。\n- `position`。`position` 字段引用一个 `String` 对象，存储员工的职位。\n\
  \n该类应具有以下构造函数：\n\n- 一个接受以下值作为参数并将其赋值给相应字段的构造函数：员工姓名、员工 ID 号、部门和职位。\n- 一个接受以下值作为参数并将其赋值给相应字段的构造函数：员工姓名和\
  \ ID 号。`department` 和 `position` 字段应赋值为空字符串（`\"\"`）。\n- 一个无参构造函数，将 `name`、`department`\
  \ 和 `position` 字段赋值为空字符串（`\"\"`），并将 `idNumber` 字段赋值为 0。\n\n编写相应的修改器方法在这些字段中存储值，以及返回这些字段值的访问器方法。写完该类后，编写一个单独程序创建三个\
  \ `Employee` 对象来存储以下数据：\n\n| 姓名 | ID 号 | 部门 | 职位 |\n| --- | --- | --- | --- |\n\
  | Susan Meyers | 47899 | Accounting | 副总裁 |\n| Mark Jones | 39119 | IT | 程序员 |\n\
  | Joy Rogers | 81774 | Manufacturing | 工程师 |\n\n程序应在屏幕上显示这三个对象的数据。\n\n### 2. `Car`\
  \ 类\n\n编写一个名为 `Car` 的类，具有以下字段：\n\n- `yearModel`。`yearModel` 是一个 `int`，存储汽车的型号。\n\
  - `make`。`make` 字段引用一个 `String` 对象，存储汽车的品牌。\n- `speed`。`speed` 字段是一个 `int`，存储汽车当前的速度。\n\
  \n此外，该类应具有以下构造函数和其他方法：\n\n- 构造函数。构造函数接受型号和品牌作为参数。这些值应赋值给对象的 `yearModel` 和 `make`\
  \ 字段。构造函数还将 `speed` 字段赋值为 0。\n- 访问器。相应的访问器方法获取存储在 `yearModel`、`make` 和 `speed` 字段中的值。\n\
  - `accelerate`。`accelerate` 方法每次调用时将 `speed` 字段加 5。\n- `brake`。`brake` 方法每次调用时将\
  \ `speed` 字段减 5。\n\n在一个程序中演示该类：创建一个 `Car` 对象，然后调用五次 `accelerate` 方法。每次调用 `accelerate`\
  \ 方法后，获取并显示当前速度。然后调用五次 `brake` 方法。每次调用 `brake` 方法后，获取并显示当前速度。\n\n### 3. `Personal\
  \ Information` 类\n\n#### ：个人类问题\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/Xh06dam9adCv15blntc2R2XylGi`](https://mediaplayer.pearsoncmg.com/assets/_video.true/Xh06dam9adCv15blntc2R2XylGi)\n\
  \n设计一个持有以下个人数据的类：姓名、地址、年龄和电话号码。编写相应的访问器和修改器。通过编写一个创建三个实例程序来演示该类。一个实例存储你的信息，另外两个存储你朋友或家庭成员的信息。\n\
  \n### 4. `RetailItem` 类\n\n编写一个名为 `RetailItem` 的类，存储零售商店商品的数据。该类应具有以下字段：\n\n- `description`。`description`\
  \ 字段引用一个 `String` 对象，存储商品的简要描述。\n- `unitsOnHand`。`unitsOnHand` 字段是一个 `int` 变量，存储库存中的数量。\n\
  - `price`。`price` 字段是一个 `double`，存储商品的零售价格。\n\n编写一个接受每个字段参数的构造函数、在这些字段中存储值的相应修改器方法，以及返回这些字段值的访问器方法。写完该类后，编写一个单独程序创建三个\
  \ `RetailItem` 对象并在其中存储以下数据：\n\n\n\n\n\n| 项目编号 | 说明 | 数量 | 价格 |\n| --- | --- | ---\
  \ | --- |\n| 项目 #1 | 外夹 | 12 | 59.95 |\n| 项目 #2 | 设计师牛仔裤 | 40 | 34.95 |\n| 项目 #3\
  \ | 衬衫 | 20 | 24.95 |\n\n# 5. `Payroll` 类\n\n设计一个 `Payroll` 类，包含员工姓名、ID 编号、时薪率和工作小时数的字段。编写相应的访问方法（accessor）和变器方法（mutator），以及一个接受员工姓名和\
  \ ID 编号作为参数的构造函数。该类还应该有一个方法返回员工的总工资（gross pay），总工资的计算方法为工作小时数乘以时薪率。编写一个程序来演示该类：创建一个\
  \ `Payroll` 对象，然后要求用户输入员工的数据。程序应显示获得的总工资金额。\n\n# 6. `TestScores` 类\n\n设计一个 `TestScores`\
  \ 类，包含用于存储三个测试分字段。该类应包含构造函数、针对测试分字段的访问方法和变器方法，以及一个返回测试分数平均值的方法。通过编写一个独立的程序创建该类的实例来演示该类。程序应要求用户输入三个测试分数，并将这些分数存储在\
  \ `TestScores` 对象中。然后程序应显示由 `TestScores` 对象报告的分数平均值。\n\n# 7. `Circle` 类\n\n编写一个包含以下字段的\
  \ `Circle` 类：\n\n*   `radius`:一个 `double`\n*   `PI`：一个 `final double`，初始化值为 3.14159\n\
  \n该类应包含以下方法：\n\n*   **构造函数**：接受圆的半径作为参数。\n*   **构造函数**：一个无参数构造函数，将 `radius` 字段设置为\
  \ 0.0。\n*   `setRadius`：`radius` 字段的变器方法。\n*   `getRadius`：`radius` 字段的访问方法。\n*\
  \   `area`：返回圆的面积，计算公式为：\n    ```\n    area = PI * radius * radius\n    ```\n* \
  \  `diameter`：返回圆的直径，计算公式为：\n    ```\n    diameter = radius * 2\n    ```\n*   `circumference`：返回圆的周长，计算公式为：\n\
  \    ```\n    circumference = 2 * PI * radius\n    ```\n\n编写一个程序来演示 `Circle` 类：要求用户输入圆的半径，创建一个\
  \ `Circle` 对象，然后报告圆的面积、直径和周长。\n\n# 8. `Temperature` 类\n\n编写一个 `Temperature` 类，用于存储华氏度温度，并提供获取华氏度、摄氏和开尔文温度的方法。该类应包含以下字段：\n\
  \n*   `fahrenheit`：一个存储华氏温度的 `double`。\n\n该类应包含以下方法：\n\n*   构造函数——构造函数接受一个华氏温度（作为\
  \ `double`）并将其存储在 `ftemp` 字段中。\n*   `setFahrenheit`：`setFahrenheit` 方法接受一个华氏温度（作为\
  \ `double`）并将其存储在 `ftemp` 字段中。\n*   `getFahrenheit`——返回 `ftemp` 字段的值，即华氏温度（无需转换）。\n\
  *   `celsius`——返回转换为摄氏的 `ftemp` 字段的值。\n*   `kelvin`——返回转换为开尔文的 `ftemp` 字段的值。\n\n\
  使用以下公式将华氏温度转换为摄氏度：\n`Celsius = (5/9) * (Fahrenheit - 32)`\n\n使用以下公式将华氏温度转换为开尔文度：\n\
  `Kelvin = ((5/9) * (Fahrenheit - 32) + 273)`\n\n通过编写一个独立的程序来演示 `Temperature` 类：要求用户输入一个华氏温度。程序创建一个\
  \ `Temperature` 类实例，并将用户输入的值传递给构造函数。然后程序调用对象的方法显示摄氏度和开尔文的温度。\n\n# 9. 月份天数\n\n编写一个名为\
  \ `MonthDays` 的类。该类的构造函数应接受两个参数：\n\n*   月份的整数（1 = 1 月，2 = 2 月，以此此类推）。\n*   年份的整数\n\
  \n该类应有一个名为 `numberOfDays` 的方法，返回指定月份的天数。该方法使用以下标准识别闰年：\n\n1.  确定年份是否能被 100 整除。如果是，则当且仅当它被\
  \ 400 整除时为闰年。例如，2000 年是闰年，但 2100 年不是。\n2.  如果年份不能被 100 整除，则当且仅当它被 4 整除时为闰年。例如，2008\
  \ 年是闰年，但 2009 年不是。\n\n在一个程序中演示该类：要求用户输入月份（1-12）和年份。程序应显示该月份的天数。这是一个示例运行：\n```\n\
  Enter month (1-12): 2\nEnter year: 2000\nNumber of days: 29\n```\n\n# 10. 二一点游戏\
  \ (TwentyOne)\n\n在本次作业中，你将编写一个程序，让用户与计算机玩流行的二十一点（Blackjack）。在这个变体中，使用六面骰代替扑牌。计算机初始总分为\
  \ 15。玩家掷两个骰子并将和加到自己的总分中。如果玩家总分超过 21，则玩家输。如果玩家总分为 21 或少，玩家可以选择再次掷骰或停止。\n\n如果玩家选择停止，计算机掷两个骰子，直到其总分达到\
  \ 17 或或超过 21。分数最高且不超过 21 的玩家获胜。\n\n以下是一些设计建议：\n\n*   创建一个 `Die` 类，包含一个 `roll()`\
  \ 方法，返回 1 到 6 之间的随机整数。\n*   创建一个 `TwentyOne` 类，包含玩家和计算机总分的字段。\n*   `TwentyOne` 类应包含一个构造函数，将计算机总分初始化为\
  \ 15。\n*   `TwentyOne` 类应有一个方法让玩家掷骰子并将和加到其总分中。\n*   `TwentyOne` 类应有一个方法让计算机掷骰子并将和加到其总分中。\n\
  *   `TwentyOne` 类应有一个方法判断玩家是否超过了 21。\n*   `TwentyOne` 类应有一个方法判断计算机是否超过了 21。\n* \
  \  `TwentyOne` 类应有一个方法来确定获胜者。\n*   创建一个主程序，使用 `Die` 和 `TwentyOne` 类来玩游戏。\n\n\n\n\
  \n\n*   `isWaterBoiling`。如果 `temperature` 字段中存储的温度达到或高于水的沸点，该方法应返回布尔值 `true`。否则，该方法应返回\
  \ `false`。\n\n编写一个演示该类的程序。该程序要求用户输入一个温度，然后显示在该温度下会结冰的物质以及在该温度下会沸的物质。例如，如果温度为 –20，该类应报告水在该温度下结冰，氧气在该温度下沸。\n\
  \n# 12. `SavingsAccount` 类\n\n设计一个 `SavingsAccount` 类，用于存储储蓄账户年利率和余额。类的构造函数应接受储蓄账户初始余额的金额。该类还应该具有方法，用于扣除取款金额、增加存款金额以及将月利息添加到余额中。月利率为年利率除以\
  \ 12。要将月利息添加到余额中，将月利率乘以余额，并将结果加到余额上。\n\n在一个程序中测试该类，该程序计算储蓄账户在一段时间结束时的余额。它应该要求用户输入年利率、初始余额以及账户建立以来经过的月数。循环应为每个月迭代一次，执行以下操作：\n\
  \n1.  要求用户输入该月存入账户的金额。使用类方法将此金额添加到账户余额中。\n2.  要求用户输入该月从账户取出的金额。使用类方法从账户余额中减去此金额。\n\
  3.  使用类方法计算月利息。\n\n在最后迭代之后，程序应显示最终余额、存款总额、取款总额以及获得的总利息。\n\n# 13. 存款与取款文件\n\n使用记事本或其他文本编辑器创建一个名为\
  \ `Deposits.txt` 的文本文件。该文件应包含以下数字，每行一个：\n\n```\n100.00\n124.00\n78.92\n37.55\n```\n\
  \n接下来，创建一个名为 `Withdrawals.txt` 的文本文件。该文件应包含以下数字，每行一个：\n\n```\n29.88\n110.00\n27.52\n\
  50.00\n12.90\n```\n\n`Deposits.txt` 文件中的数字是该月存入储蓄账户的存款金额，而 `Withdrawals.txt` 文件中的数字是该月从账户取出的金额。编写一个程序，创建一个你在编程挑战\
  \ 12 中编写的 `SavingsAccount` 类的实例。对象的初始余额为 500.00。程序应从 `Deposits.txt` 文件读取值，并使用对象的方法将它们添加到账户余额中。程序应从\
  \ `Withdrawals.txt` 文件读取值，并使用对象的方法将其从账户余额中减去。程序应调用类方法计算月利息，然后显示最终余额和获得的总利息。\n\n\
  # 14. 医疗费用\n\n编写一个名为 `Patient` 的类，具有存储以下数据的字段：\n\n*   名、中间名和姓\n*   地址、城市、州和邮政编码\n\
  *   电话号码\n*   紧急联系人的姓名和电话号码\n\n`Patient` 类应该具有一个构造函数、访问器（accessor）和变异器（mutator），它们都接受每个字段的参数。\n\
  \n接下来，编写一个名为 `Procedure` 的类，代表在患者身上执行的医疗程序。`Procedure` 类应该具有存储以下数据的字段：\n\n*   程序名称\n\
  *   程序日期\n*   执行程序的从业人员姓名\n*   程序的费用\n\n`Procedure` 类应该具有一个构造函数、访问器和变异器，它们都接受每个字段的参数。\n\
  \n接下来，编写一个程序创建一个 `Patient` 类的实例并用示例数据初始化。然后，创建三个 `Procedure` 类的实例，并用以下数据初始化：\n\n\
  | 程序 #1: | 程序 #2: | 程序 #3: |\n| --- | --- | --- |\n| 程序名称: 体检 日期: 今天的日期 从业人员: Irvine\
  \ 医生 费用: 250.00 | 程序名称: X 光检查 日期: 今天的日期 从业人员: Jamison 医生 费用: 500.00 | 程序名称: 血检 日期:\
  \ 今天的日期 从业人员: Smith 医生 费用: 200.00 |\n\n程序应显示患者的信息、关于所有三个程序的信息以及这三项，这三个程序的总费用。\n\n\
  # 15. 骰子游戏\n\n编写一个使用本章介绍的 `Die` 类程序，在计算机和用户之间玩一个简单的骰子游戏。程序应创建两个 `Die` 类实例（每个都是六面骰）。一个\
  \ `Die` 对象是计算机的骰子，另一个 `Die` 对象是用户的骰子。\n\n程序应该有一个迭代 10 次的循环。每次循环迭代时，都应该掷出两个骰子。点最高的骰子获胜。（如果出现平局，则该次掷骰没有获者。）\n\
  \n随着循环迭代，程序应记录计算机获胜的次数和用户获胜的次数。在循环完成所有迭代后，程序应显示谁是最终获胜者，计算机还是用户。\n\n# 16. 轮盘颜色\n\n\
  在轮盘上，口袋从 0 到 36 编号。口袋的颜色如下：\n\n*   0 号口袋为绿色。\n*   1 到 10 号口袋，奇数号为红色，偶数号为黑色。\n* \
  \  11 到 18 号口袋，奇数号为黑色，偶数号为红色。\n*   19 到 28 号口袋，奇数号为红色，偶数号为黑色。\n*   29 到 36 号口袋，奇数号为黑色，偶数号为红色。\n\
  \n编写一个名为 `RoulettePocket` 的类。该类的构造函数接受一个口袋号码。该类应该有一个方法 `getPocketColor`，返回口袋的颜色字符串。\n\
  \n在一个程序中演示该类，该程序要求用户输入一个口袋号码，并显示该口袋是绿色、红色还是黑色。如果用户输入的数字不在范围范围内，程序应显示错误信息。\n\n# 17.\
  \ 硬币掷模拟器\n\n编写一个名为 `Coin` 的类。`Coin` 类应该具有以下字段：\n\n*   名为 `sideUp` 的 `String`。`sideUp`\
  \ 字段将持有“heads”（正面）或“tails”（反面）。\n\n`Coin` 类应该具有以下方法：\n\n*   无参构造函数，随机确定硬币朝上的面（正面或反面），并相应地初始化\
  \ `sideUp` 字段。\n*   一个名为 `toss` 的 `void` 方法，用于模拟掷硬币。当 `toss` 方法被调用时，它随机确定硬币朝上的面（正面或反面），并相应地设置\
  \ `sideUp` 字段。\n*   一个名为 `getSideUp` 的方法，返回 `sideUp` 字段的值。\n\n编写一个程序演示 `Coin` 类。该程序应创建该类的实例并显示初始朝上的面。然后，使用循环掷硬币\
  \ 20 次。每次掷硬币时，都显示朝上的面。程序应记录正面朝上的次数和反面朝上的次数，并在循环结束后显示这些值。\n\n# 18. 掷硬币以换取美元\n\n在本次作业中，你将使用编程挑战\
  \ 16 中的 `Coin` 类创建一个游戏程序。该程序应该有三个 `Coin` 类的实例：一个代表四角，一个代表一角，一个代表镍。\n\n\n\n\n当游戏开始时，你的初始余额为\
  \ $0。在游戏的每一轮中，程序都会投掷模拟硬币。当硬币落地为正面朝时，硬币的数值会添加到你的余额中。例如，如果四分硬币正面朝，余额将增加 25 分。。如果硬币反面朝，余额不会增加。当你的余额达到美元或更多时，游戏结束。如果你的余额恰好为美元，你就赢了游戏。如果你的余额超过美元，你就输了。\n\
  \n# 19. 钓鱼游戏模拟\n\n在这个作业中，你将编写一个模拟钓鱼游戏的程序。在这个游戏中，通过掷一个六面骰子来决定用户钓到了什么。每个可能的物品都对应相应的钓鱼分数。分数在用户完成钓鱼之前将保持隐藏，然后将根据获得的钓鱼分数显示一条祝贺消息。\n\
  \n以下是关于游戏设计的一些建议：\n\n*   游戏的每一轮都是循环的迭代，只要玩家想要继续钓更多物品，循环就会持续。\n*   在每一轮的开始时，程序将询问用户是否想继续钓鱼。\n\
  *   程序模拟掷六面骰子的过程（使用在代码列表 6-14）中显示的 `Die` 类）。\n*   每个可以被钓到的物品都由骰子生成的数字表示；例如，1 代表“一条大鱼”，2\
  \ 代表“一只旧鞋”，3 代表“一条小鱼”，以此此类推。\n*   用户钓到的每个物品价值的分数不同。\n*   循环记录用户钓鱼分数的运行总和。\n*   循环结束后，将显示总钓鱼分数，以及一条根据获得分数而变化的消息。\n\
  \n# 第 7 章 数组与 `ArrayList` 类\n\n## 话题\n\n1. 7.1 数组简介\n2. 7.2 处理数组元素\n3. 7.3 将数组作为参数传递给方法\n\
  4. 7.4 一些实用的数组算法和操作\n5. 7.5 从方法返回数组\n6. 7.6 `String` 数组\n7. 7.7 对象数组\n8. 7.8 顺序查找算法\n\
  9. 7.9 二维数组\n10. 7.10 三维或更多维的数组\n11. 7.11 选择排序与二分查找算法\n12. 7.12 命令行参数与可变参数列表\n13.\
  \ 7.13 `ArrayList` 类\n14. 7.14 需要避免的常见错误\n\n## 7.1 数组简介\n\n**概念**：数组可以同时存储多个相同数据类型的值。\n\
  \n你为止所处理的原始类型变量设计为一次只存储一个值。图 7-1 中的每个变量声明仅预留了足够存储一个指定数据类型之值的内存。\n\n### 图 7-1 变量声明及其内存分配\n\
  \n![给出了三个变量声明的内存分配。](img/07fig01.png) 图 7-1 完整替代文本\n\n然而，数组是一个对象，可以存储一组相同类型的值。创建数组与创建任何其他对象相似。你声明一个引用变量并使用\
  \ `new` 关键字来创建一个实例。这里有一个例子：\n\n```java\nint[] numbers;\n```\n\n括号内的数字是*大小声明符*。下标编号始终从零开始。数组中最后一个元素的下标比数组中元素的总数少\
  \ 1。这意味着对于具有六个元素的 `numbers` 数组，5 是最后一个元素的下标。\n\n\n\n\n\n`numbers` 数组中的每个元素在通过下标访问时，都可以作为\
  \ `int` 变量使用。例如，看下面的代码。第一条语句将 20 存储在数组第一个元素（元素 0），第二条语句将 30 存储在第四个元素（元素 3）。\n\n\
  ```java\nnumbers[0] = 20;\nnumbers[3] = 30;\n```\n\n### 注意\n表达式 `numbers[0]` 读作“numbers\
  \ sub zero”。读取这些赋值语句的方式为“numbers sub zero is assigned twenty”和“numbers sub three\
  \ is assigned thirty”。\n\n图 7-4 展示了这些语句执行后数组的内容。\n\n### 图 7-4 在 20 赋值给 `numbers[0]`\
  \ 且 30 赋值给 `numbers[3]` 后数组的内容\n\n![在 20 赋值给 numbers（左括号、0、右括号）且 30 赋值给 numbers（左括号、3、右括号）后数组的内容](img/07fig04.png)图\
  \ 7-4 完整替代文本\n\n### 注意\n默认情况下，Java 将数组元素初始化为 0。在图 7-4 中，元素 1、2、4 和 5 中没有存储任何值，因此它们显示为\
  \ 0。\n\n到此为止，你应该理解数组大小声明符和下标之间的区别。当你使用 `new` 关键字创建一个数组对象时，括号内的数字是大小声明符。它表示数组中元素的数量。在赋值语句或任何处理数组内容的语句中，括号内的数字是下标。它被用于访问数组中的特定元素。\n\
  \n# 数组内容的输入与输出\n\n你可以像处理普通变量一样，从键盘读取值并将其存储在数组元素中。你同样�可以使用 `print` 和 `println` 输出数组元素的内容。代码列表\
  \ 7-1 显示了如何使用数组来存储和显示用户输入的值。图 7-5 显示了示例输出中用户输入后的 `hours` 数组的内容。\n\n```java\nimport\
  \ java.util.Scanner;\n\n/**\n    此程序演示了存储在数组\n    元素中并显示的值。\n */\npublic class ArrayDemo1\n\
  {\n    public static void main(String[] args)\n    {\n        final int EMPLOYEES\
  \ = 3;          // 员工人数\n        int[] hours = new int[EMPLOYEES]; // 小时数组\n\n \
  \       // 创建一个 Scanner 对象用于键盘输入。\n        Scanner keyboard = new Scanner(System.in);\n\
  \n        System.out.println(\"Enter the hours worked by \" +\n                \
  \            EMPLOYEES + \" employees.\");\n\n        // 获取员工 1 的工作小时。\n       \
  \ System.out.print(\"Employee 1: \");\n        hours[0] = keyboard.nextInt();\n\n\
  \        // 获取员工 2 的工作小时。\n        System.out.print(\"Employee 2: \");\n       \
  \ hours[1] = keyboard.nextInt();\n\n        // 获取员工 3 的工作小时。\n        System.out.print(\"\
  Employee 3: \");\n        hours[2] = keyboard.nextInt();\n\n        // 显示输入的值。\n\
  \        System.out.println(\"The hours you entered are:\");\n        System.out.println(hours[0]);\n\
  \        System.out.println(hours[1]);\n        System.out.println(hours[2]);\n\
  \    }\n}\n```\n\n带有加粗示例输入的的程序输出：\n\n```\nEnter the hours worked by 3 employees.\n\
  Employee 1: 40 [Enter]\nEmployee 2: 20 [Enter]\nEmployee 3: 15 [Enter]\nThe hours\
  \ you entered:\n40\n20\n15\n```\n\n### 代码列表 7-1 `ArrayDemo1.java`\n\n### 图 7-5 hours\
  \ 数组的内容\n![hours 数组的内容被描绘为三个均匀的框](img/07fig05.png)图 7-5 完整替代文本\n\n# 在循环中访问数组元素\n\
  \nhttps://media.pearsoncmg.com/assets/_video.true/89sNk2B43zu_zFh8PYggggXy7 下标可以存储在变量中。这使得使用循环来“遍历”整个数组并对每个元素执行相同的操作成为可能。例如，代码列表\
  \ 7-1](#ch07_pg0002.xhtml_P7001015878000000000000000002EF0)可以通过两个 `for` 循环来简化：一个用于向数组输入值，另一个用于显示数组内容。这在代码列表\
  \ 7-2 中显示。在下面的动画中，点击“上一个”或“下一个”按钮逐步执行代码并查看全程的解释。\n\n### 代码列表 7-2 `ArrayDemo2.java`\n\
  \nhttps://media.pearsoncmg.com/gadisjava/pr7-2 让我们仔细观察此程序中的第一个循环，它出现在第 21 到 25 行。注意循环的控制变量\
  \ `index` 在第 24 行被用作下标：\n\n```java\nhours[index] = keyboard.nextInt();\n```\n\n\
  变量 `index` 从 0 开始。在循环的第一次迭代中，用户的输入被存储在 `hours[0]`。随后 `index` 增加，值变为 1。在下次迭代中，用户的输入被存储在\
  \ `hours[1]`。这一直持续到数组的所有元素都存储了值。注意控制变量的开始和结束都是有效的下标（0 到 2），如图 7-6 所示。这确保了只使用有效的下标。\n\
  \n### 图 7-6 注释循环\n![循环标注了索引变量](img/07fig06.png)图 7-6 完整替代文本\n\n# Java 执行边界检查\n\n\
  Java 执行数组边界检查，这意味着不允许语句使用超出数组范围的下标。例如，以下语句创建了一个包含 10 个元素的数组。该数组的有效下标是 0 到 9。\n\n\
  ```java\nint[] values = new int[10];\n```\n\n对于此数组，Java 不允许使用小于 0 或大于 9 的下标。边界检查发生在运行时。Java\
  \ 编译器在处理使用无效下标的语句不会显示错误。相反，当语句执行时，程序会抛出异常并立即终止。例如，代码列表 7-3](#ch07_pg0002.xhtml_P700101587800000000000000002F21)\
  \ 中的程序声明了一个三元素数组，但尝试在数组中存储四个值。在第 17 行，当程序尝试向 `values[3]` 存储值时，它会停止并显示错误信息。\n\n在下面的动画中，点击“上一个”或“下一个”按钮逐步执行代码并查看全程的解释。\n\
  \n代码列表 7-3 `InvalidSubscript.java`\n\nhttps://media.pearsoncmg.com/ph/esm/0media_ecs/gadisjava/pr7-3/3.html\n\
  \n### 注意\n你看到的错误信息取决于系统。\n\n# 注意差错误\n\n由于数组下标从 0 开始而不是 1，你必须注意避免差错误。例如，看下面的代码：\n\
  \n```java\n// 这段代码有一个差一错误。\nfinal int SIZE = 100;\nint[] numbers = new int[SIZE];\n\
  for (int index = 1; index <= SIZE; index++)\n   numbers[index] = 0;\n```\n\n\n\n\
  这段代码的意图是创建一个包含 100 个元素的整数数组，并在每个元素中存储值 0。然而，这段代码存在一个差一错误（off-by-one error）。循环使用其控制变量\
  \ `index` 作为 `numbers` 数组的下标。在循环执行期间，变量 `index` 的取值是从 1 到 100，而它本应该取值是从 0 到 99。因此，下标为\
  \ 0 的第一个元素被跳过了。此外，循环在最后一次迭代中尝试使用 100 作为下标。由于 100 是一个无效的下标，程序将抛出异常并停止。\n\n# 数组初始化\n\
  \n与普通变量一样，Java 允许你在创建数组时初始化初始化数组的元素。以下是一个示例：\n\n```\nint[] days = {31, 28, 31, 30,\
  \ 31, 30, 31, 31, 30, 31, 30, 31};\n```\n\n该语句声明了引用变量 `days`，在内存中创建了一个数组，并在数组中存储了初始值。大括号内部用逗号分隔的一系列值被称为初始化列表。这些值按照它们在列表中出现的顺序存储在数组元素中。（第一个值\
  \ 31 存储在 `days[0]` 中，第二个值 28 存储在 `days[1]` 中，以此此类推。）注意，在使用初始化列表时不需要使用 `new` 关键字。Java\
  \ 会自动创建数组并将初始化列表中的值存储其中。\n\nJava 编译器通过初始化列表中的项目数量来确定数组的大小。由于示例语句的初始化列表中有 12 个项目，因此该数组将有\
  \ 12 个元素。代码列表 7-4 中的程序演示了数组的初始化。\n\n# 代码列表 7-4 `(ArrayInitialization.java)`\n\n\
  ```\n 1  /**\n 2     此程序演示了数组的初始化。\n 3  */\n 4 \n 5  public class ArrayInitialization\n\
  \ 6  {\n 7     public static void main(String[] args)\n 8  {\n 9        int[] days\
  \ = { 31, 28, 31, 30, 31, 30,\n10                       31, 31, 30, 31, 30, 31 };\n\
  11 \n12        for (int index = 0; index < 12; index++)\n13        {\n14       \
  \    System.out.println(\"Month \" + (index + 1) +\n15                         \
  \     \" has \" + days[index] +\n16                              \" days.\");\n\
  17        }\n18     }\n19  }\n```\n\n### 程序输出\n\n```\nMonth 1 has 31 days.\nMonth\
  \ 2 has 28 days.\nMonth 3 has 31 days.\nMonth 4 has 30 days.\nMonth 5 has 31 days.\n\
  Month 6 has 30 days.\nMonth 7 has 31 days.\nMonth 8 has 31 days.\nMonth 9 has 30\
  \ days.\nMonth 10 has 31 days.\nMonth 11 has 30 days.\nMonth 12 has 31 days.\n```\n\
  \nJava 允许你将初始化列表跨越多行。以下两种数组声明是等价的：\n\n```\ndouble[] coins = { 0.05, 0.1, 0.25 };\n\
  double[] coins = { 0.05,\n                   0.1,\n                   0.25 };\n\
  ```\n\n# 另一种数组声明符号\n\nJava 允许在声明数组引用变量时使用两种不同的样式。第一种样式是本书使用的样式，括号紧跟在数据类型之后，所示：\n\
  \n```\nint[] numbers;\n```\n\n在第二种样式中，括号放在变量名之后，所示：\n\n```\nint numbers[];\n```\n\
  \n这两个语句都实现了相同的功能：它们声明了 `numbers` 是一个 `int` 数组的引用。这两种样式之间的差异在同一条语句中声明多个变量时会被注意到。例如，看以下语句：\n\
  \n```\nint[] numbers, codes, scores;\n```\n\n该语句声明了三个变量：`numbers`、`codes` 和 `scores`。这三个都是\
  \ `int` 数组的引用。这完全合理，因为 `int[]` 是该语句中声明的所有变量的数据类型。现在看下面这个使用另一种符号的语句：\n\n```\nint\
  \ numbers[], codes, scores;\n```\n\n该语句声明了相同的三个变量，但只有 `numbers` 是 `int` 数组的引用。`codes`\
  \ 和 `scores` 变量是普通的 `int` 变量。这是因为 `int` 是该语句中声明的所有变量的数据类型，而只有 `numbers` 后面跟着括号。使用另一种符号将这三个变量都声明为\
  \ `int` 数组的引用，你需要在每个变量名后写一组括号。例如：\n\n```\nint numbers[], codes[], scores[];\n```\n\
  第一种样式是大多数 Java 程序员的标准符号，因此它是本书使用的样式。\n\n# 检查点\n\n- 检查点 7.1\n- 检查点 7.2\n- 检查点 7.3\n\
  - 检查点 7.4\n- 检查点 7.5\n- 检查点 7.6\n- 检查点 7.7\n- 检查点 7.8\n- 检查点 7.9\n- 检查点 7.10\n-\
  \ 检查点 7.11\n- 检查点 7.12\n- 检查点 7.13\n- 检查点 7.14\n\n## 7.2 处理数组元素\n\n**概念**：单个数组元素的处理与任何其他类型的变量相同。\n\
  \n处理数组元素与处理普通变量没有区别。例如，以下语句将 `hours[3]` 乘以 `payRate`：\n\n```\ngrossPay = hours[3]\
  \ * payRate;\n```\n\n以下是对数组元素进行预增和后增操作的示例：\n\n```\nint[] score = {7, 8, 9, 10, 11};\n\
  ++score[2];     // 预增操作\nscore[4]++;     // 后增操作\n```\n\n在使用增减运算符时，要小心不要运算符用在下标上，而你本打算用在数组元素上。例如，以下语句减少了变量\
  \ `count` 的值，但对数组元素 `amount[count]` 中的值没有做任何操作：\n\n```\namount[count--];\n```\n\n\
  [代码列表 7-5]演示了如何在简单的数学语句中使用数组元素。循环遍历数组的每个元素，利用这些元素计算五名员工的毛工资。\n\n在下面的动画中，按“上一个”或“下一步”按钮可以逐步执行代码，并在贯穿其中解释。\n\
  \n\n\n\n### 代码列表 7-5 `(PayArray.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr7-5/5.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr7-5/5.html)\n\
  \n在第 41 行，以下语句将 `hours[index]` 乘以 `payRate` 的值赋值给 `grossPay` 变量：\n\n```\ngrossPay\
  \ = hours[index] * payRate;\n```\n\n数组元素也可以用于关系表达式。例如，以下 `if` 语句判断 `cost[20]` 是否小于\
  \ `cost[0]`：\n\n```\nif (cost[20] < cost[0])\n```\n\n而下文所示的 `while` 循环只要 `value[count]`\
  \ 不等于 0 就会持续迭代：\n\n```\nwhile (value[count] != 0)\n {\n    语句 \n }\n```\n\n在本章的[源代码](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/downloads/Source_Code.zip)中，你会找到\
  \ `Overtime.java` 文件，它是代码列表 7-5 中 `PayArray.java` 程序的修改版本。`Overtime.java` 程序总工资中包含了加班工资。如果员工工作超过\
  \ 40 小时，则超出部分将使用普通工资率 1.5 倍的加班费。\n\n# 数组长度\n\nJava 中的每个数组都有一个名为 `length` 的公共字段。该字段包含数组中的元素个数。例如，考虑由以下语句创建的数组：\n\
  \n```\ndouble[] temperatures = new double[25];\n```\n\n由于 `temperatures` 数组有 25\
  \ 个元素，以下语句将 25 赋值给变量 `size`：\n\n```\nsize = temperatures.length;\n```\n\n在处理数组的所有内容时，`length`\
  \ 字段非常有用。例如，以下循环遍历数组并显示每个元素的内容。数组的 `length` 字段被用于测试表达式，用作循环控制变量的上限：\n\n```\nfor\
  \ (int i = 0; i < temperatures.length; i++)\n    System.out.println(temperatures[i]);\n\
  ```\n\n# 警告！\n\n在使用 `length` 字段作为下标的上限时，注意不要导致差一错误（off-by-one error）。`length` 字段包含数组中的元素个数。数组中最大的下标是\
  \ `length - 1`。\n\n### 注意\n\n你不能更改数组 `length` 字段的值。\n\n# 增强型 for 循环\n\nJava 提供了一种\
  \ `for` 循环的特殊版本，在许多情况下可以简化数组处理。它被称为“增强型 for 循环”（enhanced for loop）。以下是增强型 for 循环的通用格式：\n\
  \n```\nfor (dataType elementVariable : array)\n   语句;\n```\n\n增强型 for 循环的设计用于为数组中的每个元素迭代一次。循环每次迭代时，它会将一个数组元素复制到一个变量中。让我们更仔细地查看语法：\n\
  \n* `dataType elementVariable` 是一个变量声明。该变量在每次循环迭代期间将接收不同数组元素的值。在第一次循环迭代中，它接收第一个元素的值；在第二次迭代中，它接收第二个元素的值，以此此类推。该变量的数据类型必须与数组元素的类型相同，或者是元素可以自动转换成分的类型。\n\
  * `array` 是你希望循环在其上面操作的数组名称。循环将为数组中的每个元素迭代一次。\n* `statement` 是一个在循环迭代期间执行的语句。\n\n\
  例如，假设我们有如下的数组声明：\n\n```\nint[] numbers = { 3, 6, 9 };\n```\n\n我们可以使用以下增强型 for 循环来显示\
  \ `numbers` 数组的内容：\n\n```\nfor (int val : numbers)\n    System.out.println(val);\n\
  ```\n\n由于 `numbers` 数组有三个元素，此循环将迭代三次。第一次迭代时，`val` 变量将接收 `numbers[0]` 中的值。在第二次迭代中，`val`\
  \ 将接收 `numbers[1]` 中的值。在第三次迭代中，`val` 将接收 `numbers[2]` 中的值。代码的输出如下：\n\n```\n3\n 6\n\
   9\n```\n\n如果你需要在增强型 for 循环中执行多条语句，只需将语句块括在大括号中。这是一个示例：\n\n```\nint[] numbers =\
  \ { 3, 6, 9 };\n for (int val : numbers)\n {\n    System.out.print(\"The next value\
  \ is \");\n    System.out.println(val);\n }\n```\n\n此代码将产生如下输出：\n\n```\nThe next\
  \ value is 3\n The next value is 6\n The next value is 9\n```\n\n# 增强型 for 循环对比传统的\
  \ for 循环\n\n当你需要从第一个元素到最后一个元素访问数组中的值时，增强型 for 循环比 for 循环更容易使用。使用增强型 for 循环，你不需要担心数组的大小，也不需要创建一个存储下标的“索引”变量。然而在某些情况下，增强型\
  \ for 循环是不够的：\n\n* 如果你需要更改元素的内容\n* 如果你需要按反顺序处理数组\n* 如果你需要访问数组的一部分而非全部\n* 如果你需要同时处理两个或多个数组\n\
  \n在任何这些情况下，你都应该使用传统的 for 循环。\n\n# 让用户指定数组的大小\n\nJava 允许你使用整数变量来指定数组的大小。这使得允许用户确定测试次数成为可能。此程序将测试分数存储在数组中并显示。\n\
