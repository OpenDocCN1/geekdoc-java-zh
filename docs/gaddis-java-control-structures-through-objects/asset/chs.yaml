  \n与基本数据类型一样，初始化列表会自动在内存中创建一个 `String` 对象的数组。如果你不提供初始化列表，则必须使用 `new` 关键字来创建数组。这是一个示例：\n\
  \n```\nfinal int SIZE = 4;\nString[] names = new String[SIZE];\n```\n\n该语句创建了一个包含四个\
  \ `String` 对象引用的数组，如图 7-15 所示。注意，该数组是一个包含四个未初始化 `String` 引用的数组。由于它们没有引用任何对象，因此它们被设置为\
