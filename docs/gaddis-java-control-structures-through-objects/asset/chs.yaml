  \n## 14.2 动画\n\n### 概念\nJavaFX 提供了过渡类，通过使节点随时间从一个状态变为另一个状态来创建动画。\n\n### 动画\n[`mediaplayer.pearsoncmg.com/assets/_video.true/CdFURRZclec730EGuPbTep5YoF`](https://mediaplayer.pearsoncmg.com/assets/_video.true/CdFURRZclec730EGuPbTep5YoF)\n\
  \nJavaFX 提供了许多过渡类（transition classes），使得创建动画变得简单。过渡类位于 `javafx.animation` 包中，其中一些类列在表\
  \ 14-11 中。\n\n### 表 14-11 部分过渡类\n\n| 类 | 说明 |\n| --- | --- |\n| `TranslateTransition`\
  \ | 创建节点随时间从一个位置移动到另一个位置的动画。 |\n| `RotateTransition` | 创建一个节点随时间旋转的动画。 |\n| `ScaleTransition`\
  \ | 创建一个节点随时间变大或变小的动画。 |\n| `StrokeTransition` | 创建一个节点的描边颜色随时间变化的动画。 |\n| `FillTransition`\
  \ | 创建一个节点的填充颜色随时间变化的动画。 |\n| `FadeTransition` | 创建一个节点随时间淡入或淡出的动画。 |\n\n尽管每个过渡类创建的动画类型各不相同，但所有类的工作方式都是相似的。对于每个类，你都必须指定以下内容：\n\
  \n*   你想要动画化的节点\n*   动画持续的时间\n*   节点的起始状态（取决于动画类型）\n*   节点的结束状态（取决于动画类型）\n\n一旦设置好一切，就可以调用过渡类的\
  \ `play` 方法来播放动画。让我们看看这与表 14-10 中列出的每个过渡类的关系。\n\n### `TranslateTransition` 类\n\n\
  `TranslateTransition` 类使节点从屏幕上的一个位置移动到另一个位置。`TranslateTransition` 类有三个构造函数，总结在表\
  \ 14-12 中。\n\n# 表 14-12 `TranslateTransition` 类构造函数\n\n| 构造函数 | 说明 |\n| --- | ---\
  \ |\n| `TranslateTransition()` | 创建空的 `TranslateTransition` 对象。调用类的 `setDuration`\
  \ 方法建立时长，并调用 `setNode` 方法指定动画化的节点。 |\n| `TranslateTransition(``duration`)` | `duration`\
  \ 参数是 `Duration` 类型的对象，指定动画持续的时间。调用 `TranslateTransition` 类的 `setNode` 方法指定动画化的节点。\
  \ |\n| `TranslateTransition(``duration, node`)` | `duration` 参数是 `Duration` 类型的对象，指定动画持续的时间。`node`\
  \ 参数是 `Node` 类（或其子类）的对象，是要动画化的节点。 |\n\n\n\n\n你使用一个 `Duration` 对象来指定动画持续的时间长度。`Duration`\
  \ 类位于 `javafx.util` 包中，表示一段持续时间。当你实例化 `Duration` 类时，你将毫秒数作为参数传递给构造函数。1 毫秒是秒的 1/1000，因此向\
  \ `Duration` 类的构造函数传递值 `1000` 将创建一个表示 1 秒持续时间的对象。\n\n下面的代码段展示了创建一个 `Circle` 的示例，其中心点在\
  \ (0, 50)，半径为 30。然后，创建一个 `TranslateTransition` 对象来对其进行动画处理。动画的持续时间为 3 秒。\n\n```\n\
  Circle myCircle = new Circle(0, 50, 30);\nTranslateTransition ttrans =\n       \
  \  new TranslateTransition(new Duration(3000), myCircle);\n```\n\n下一步是指定起始位置。`TranslateTransition`\
  \ 类有两个名为 `setFromX` 和 `setFromY` 的方法用于此目的。你调用这些方法并分别传递起始位置的 `X` 和 `Y` 坐标。\n\n接下来，你通过调用\
  \ `TranslateTransition` 类的 `setToX` 和 `setToY` 方法来指定节点的结束位置。你分别向这些方法传递结束位置的 `X`\
  \ 和 `Y` 坐标。一旦设置就绪，你就调用过渡类的 `play` 方法来播放动画。下面的代码段展示了一个示例：\n\n```\nCircle myCircle\
  \ = new Circle(0, 50, 30);\nTranslateTransition ttrans =\n         new TranslateTransition(new\
  \ Duration(3000), myCircle);\nttrans.setFromX(0);\nttrans.setFromY(50);\nttrans.setToX(100);\n\
  ttrans.setToY(50);\nttrans.play();\n```\n\n这段代码创建了一个 `Circle`，然后创建一个 `TranslateTransition`\
  \ 对象对其进行动画处理。动画的持续时间为 3 秒。当动画播放时，`Circle` 对象将从 (0, 50) 开始，并移动到位置 (100, 50)。`Circle`\
  \ 对象需要 3 秒来完成移动。\n\n请记住，你传递给 `setToX` 和 `setToY` 方法的值是节点结束位置的坐标。在之前的代码段中，圆形的最终位置是\
  \ (100, 50)。如果你愿意，可以调用 `setByX` 和 `setByY` 方法来指定节点相对于起始位置应该移动的距离。下面的代码段展示了一个示例：\n\
  \n```\nCircle myCircle = new Circle(0, 50, 30);\nTranslateTransition ttrans =\n\
  \         new TranslateTransition(new Duration(3000), myCircle);\nttrans.setFromX(0);\n\
  ttrans.setFromY(50);\nttrans.setByX(75);\nttrans.setByY(50);\nttrans.play();\n```\n\
  \n在这个示例中，过渡对象最初将圆放置在 (0, 50)，然后在 `X` 方向上额外移动 75 像素，在 `Y` 方向上额外移动 50 像素。因此，圆的结束位置将是\
  \ (75, 100)。\n\n`Code Listing 14-10` 显示了一个完整的程序，它对圆进行动画处理将其将其从窗口顶部移动到底部。\n\n在下面的动画中，点击“上一个”或“下一个”按钮逐逐通过代码并查看各处的解释。\n\
  \n# Code Listing 14-10 `(BallDrop.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr14-10/10.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr14-10/10.html)\n\
  \n### `RotateTransition` 类\n\n`RotateTransition` 类创建一个使节点旋转的动画。`RotateTransition`\
