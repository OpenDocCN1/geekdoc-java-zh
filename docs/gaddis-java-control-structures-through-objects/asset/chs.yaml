  \n// 将 names[3] 中的第一个字符赋值给 letter。\nletter = names[3].charAt(0);\n```\n\n## Tip\n\
  \n数组有一个名为 `length` 的字段，而 `String` 对象有一个名为 `length` 的方法。在处理 `String` 数组时，不要混淆这两者。下面的循环显示\
