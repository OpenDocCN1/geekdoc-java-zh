  \n# 4.2 `while` 循环\n\n概念：循环是程序中重复执行的部分。\n\n在第 3 章中，你你已经学习了控制结构的概念，它们引导程序的执行流。`loop`\
  \ 是一种导致语句或一组语句重复执行的控制结构。Java 有三种循环控制结构：`while` 循环、`do-while` 循环和 `for` 循环。这三者之间的区别在于它们如何控制重复执行。在本节中，我们将重点关注\
  \ `while` 循环。\n\n# 观看 `while` 循环\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/WZCyuIQpl1CK1QIR6VSrUhbst9yF1jub`](https://mediaplayer.pearsoncmg.com/assets/_video.true/WZCyuIQpl1CK1QIR6VSrUhbst9yF1jub)\n\
  \n`while` 循环有两个重要部分：(1) 一个用于测试 `true` 或 `false` 值的 `boolean` 表达式，(2) 一个只要表达式为 `true`\
  \ 就会重复执行的语句或语句块。图 4-1 显示了 `while` 循环的逻辑。\n\n![while 循环的逻辑始于布尔表达式。当表达式被测试为真时，会执行一条语句，while\
  \ 循环再次开始并重复，直到表达式为假为止。](img/04fig01.png)\n\n# 图 4-1 `while` 循环的逻辑\n\n以下是 `while`\
  \ 循环的通用格式：\n\n```\nwhile (BooleanExpression)\n Statement;\n```\n\n在通用格式中，`BooleanExpression`\
  \ 是任何有效的 `boolean` 表达式，而 `Statement` 是任何有效的 Java 语句。格式中显示的第一行有时称为 `loop header`（循环头）。它由关键字\
  \ `while` 后面跟在括号内的 `BooleanExpression` 组成。\n\n循环的工作原理如下：测试 `BooleanExpression`，如果为\
  \ `true`，则执行 `Statement`。然后再次测试 `BooleanExpression`。如果为 `true`，则执行 `Statement`。此循环重复，直到\
  \ `BooleanExpression` 为 `false`。\n\n重复执行的语句被称为循环的 `body`（循环体）。它也被认为是一种条件执行的语句，因为它只有在\
  \ `BooleanExpression` 为 `true` 的条件下才会被执行。\n\n注意循环头的末尾没有分号。与 `if` 语句一样，`while` 循环如果没有后续的条件执行语句，它是不完整的。如果你希望\
  \ `while` 循环重复一个语句块，格式如下：\n\n```\nwhile (BooleanExpression)\n{\n   Statement;\n\
  }\n```\n\n`BooleanExpression` 经过测试，如果为 `true`，则执行 `Statement`。然后再次测试 `BooleanExpression`。如果为\
  \ `true`，则执行 `Statement`。此循环重复，直到 `BooleanExpression` 为 `false`。\n\n\n\n\n\n如果一个循环没有停止的方法，它被称为\
  \ `infinite loop`（无限循环），因为它会持续重复直到程序被中断为止。以下是一个无限循环的示例：\n\n```\nint number = 1;\n\
   while (number <= 5)\n {\n    System.out.println(\"Hello\");\n }\n```\n\n这是一个无限循环，因为它没有包含改变\
  \ `number` 变量值的语句。每当测试 `boolean` 表达式时，`number` 都将包含值 1。\n\n通过在 `while` 循环的第一行后不小心放置一个分号，也可以创建一个无限循环。以下是一个示例：\n\
  \n```\nint number = 1;\n while (number <= 5); // 这个分号是一个错误！\n {\n    System.out.println(\"\
  Hello\");\n    number++;\n }\n```\n\n第一行末尾的分号被认为是一个 `null` 语句，并将 `while` 语句与其之后的块隔离开。对于编译器来说，这个循环看起来如下：\n\
  \n```\nwhile (number <= 5);\n```\n\n这个 `while` 循环将永远执行该空语句，而它不执行任何操作。程序看起来似乎“进入了太空”，因为没有内容可以显示屏幕输出或显示活动。\n\
  \n# 不要忘记语句块的大括号\n\n如果你正在使用语句块，请不要忘记用一组大括号将所有语句括起来。如果不小心漏了大括号，`while` 语句将根据条件仅执行紧随其后的第一个语句。例如，查看以下代码：\n\
  \n```\nint number = 1;\n // 这个循环缺少大括号！\n while (number <= 5)\n    System.out.println(\"\
  Hello\");\n    number++;\n```\n\n在这段代码中，`number++` 语句不在循环体中。由于缺少大括号，`while` 语句只执行紧随其后的语句。这个循环将无限执行，因为循环体中没有改变\
  \ `number` 变量的代码。\n\n# 编程风格与 `while` 循环\n\n可以创建像下面这样的循环：\n\n```\nwhile (number <=\
  \ 5) { System.out.println(\"Hello\"); number++; }\n```\n\n避免这种编程风格。在使用 `while` 循环时，你应该使用的编程风格类似于\
  \ `if` 语句，如下：\n\n- 如果循环只重复一个语句，则它应该出现在 `while` 语句的下一行，并额外多缩进一层。该语句可以可选地出现在一组大括号内。\n\
  - 如果循环重复一个块，则大括号内的每一行都应该缩进。\n\n这种编程风格应该在视觉上将循环体与周围代码隔离开。通常情况下，你会发现在本章介绍的其他类型循环中也使用了类似的风格。\n\
  \n# 焦点：使用 `while` 循环设计程序\n\nChemical Labs, Inc. 目前正在进行的一个项目需要持续在容器中加热某种物质。技术人员必须每\
  \ 15 分钟检查一次物质的温度。如果物质的温度没有超过 102.5 摄氏度，则技术人员什么都不做。然而，如果温度大于 102.5 摄氏度，技术人员必须调低容器的恒温器，等待\
  \ 5 分钟，然后再次检查温度。技术人员重复这些步骤，直到温度不超过 102.5 摄氏度。工程总监要求你编写一个程序来指导技术人员完成这一过程。\n\n以下是算法：\n\
  \n1. 提示用户输入物质的温度。\n2. 只要温度大于 102.5 摄氏度，重复以下步骤：\n    1. 告诉技术人员调低恒温器，等待 5 分钟并再次检查温度。\n\
  \    2. 提示用户输入物质的温度。\n3. 循环结束后，告诉技术人员温度是可以接受的，并在 15 分钟后再次检查。\n\n在审查此算法后，你意识到如果测试条件（温度大于\
  \ 102.5）最初为 `false`，则不应执行步骤 2(a) 和 2(b)。`while` 循环在这种情况下工作得很好，因为如果其条件为 `false`，它一次也不会执行。代码列表\
  \ 4-4 显示了该程序。\n\n在下面的动画中，点击“上一个”或“下一个”按钮来逐步执行代码并查看各处的解释。\n\n# 代码列表 4-4 `(CheckTemperature.java)`\n\
