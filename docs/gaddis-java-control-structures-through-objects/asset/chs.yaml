  \ `yearsOnJob >= 2` 的嵌套结构完成的。如果此表达式为 `true`，则客户符合条件。\n\n\n\n你的教授要求你编写一个程序，允许学生输入测试分数，然后显示该分数对应的等级。以下是你将要使用的算法：\n\
