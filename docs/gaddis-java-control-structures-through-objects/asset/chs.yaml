  \n## 编程挑战\n\n### 1. 姓名、年龄与年收入\n\n编写一个程序，声明以下内容：\n\n*   一个名为 `name` 的 `String` 变量\n\
  *   一个名为 `age` 的 `int` 变量\n*   一个名为 `annualPay` 的 `double` 变量\n\n将你的年龄、姓名和期望的年收入作为字面量存储在变量中。程序应该以类似于下面的方式在屏幕上显示这些值：\n\
  \n```\nMy name is Joe Mahoney, my age is 26 and\n I hope to earn $100000.0 per year.\n\
  ```\n\n### 2. 姓名首字母\n\n编写一个拥有以下 `String` 变量的程序：`firstName`、`middleName` 和 `lastName`。用你的姓、中间名初始化它们。程序还应该拥有以下\
  \ `char` 变量：`firstInitial`、`middleInitial` 和 `lastInitial`。将你的姓、中间名首字母存储在这些变量中。程序应该在屏幕上显示这些变量的内容。\n\
  \n### 3. 个人信息\n\n编写一个程序显示以下信息，每项单独一行：\n\n*   你的姓名\n*   你的地址（包含城市、州和邮政编码）\n*   你的电话号码\n\
  *   你的大学专业\n\n尽管这些项目应该显示在不同的输出行上，但在程序中仅使用一个 `println` 语句。\n\n### 4. 星形图案\n\n编写一个程序显示以下图案：\n\
  \n```\n *\n   ***\n  *****\n *******\n  *****\n   ***\n    *\n```\n\n### 5. 销售预测\n\
  \n某公司东海岸销售部创造了总销售额的 62%。根据该比例，编写一个程序，预测如果公司今年销售额为 460 万美元，东海岸部将产生多少销售额。*提示：使用值 `0.62`\
  \ 来表示 62%。*\n\n### 6. 土地计算\n\n一英亩土地等于 43,560 平英尺。编写一个程序计算面积为 389,767 平英尺土地的英亩数。*提示：用土地面积除以一英亩的大小即可英亩数。*\n\
  \n### 7. 销售税\n\n编写一个程序，要求用户输入购买金额。程序应计算州销售税和县销售税。假设州销售税为 4%，县销售税为 2%。程序应显示购买金额、州销售税、县销售税、总销售税以及销售总额（即购买金额加上总销售税之和）。*提示：使用值\
  \ `0.02` 表示 2%，使用 `0.04` 表示 4%。*\n\n### 8. 饼干卡路里\n\n一袋饼干有 40 块饼干。袋上的卡路里信息声每袋有 10\
  \ 份，每份等于 300 卡路里。编写一个程序让用户输入他们实际吃过的饼干数量，然后报告消耗的总卡路里。\n\n### 9. 每加仑英里\n\n#### 查看每加仑英里问题\n\
  \n[`mediaplayer.pearsoncmg.com/assets/_video.true/secs_gaddis_6_vn_02_04_The_Miles-Per-Gallon_Problem`](https://mediaplayer.pearsoncmg.com/assets/_video.true/secs_gaddis_6_vn_02_04_The_Miles-Per-Gallon_Problem)\n\
  \n汽车的每加仑英里（MPG）可以使用以下公式计算：\n\n`MPG = Miles driven / Gallons of gas used`\n\n编写一个程序询问用户输入行驶的英里数和消耗的汽油量。它应该计算汽车的每加仑英里并将结果显示在屏幕上。\n\
  \n### 10. 测试平均分\n\n编写一个程序要求用户输入三个测试分数。程序应显示每个测试分数以及平均分。\n\n### 11. 电路板\n\n一家电子公司以\
  \ 40% 的折扣出售电路板。如果你知道零售价，可以使用以下公式计算其利润：\n\nProfit = Retail price × 0.4\n\n编写一个程序要求用户输入零售价，计算利润金额并显示结果。\n\
  \n### 12. 字符串处理\n\n编写一个程序，要求用户输入他们喜欢的城市名称。使用一个 `String` 变量存储该输入。程序应该显示：\n\n*   名称的字符数\n\
  *   大写字母名称\n*   小写字母名称\n*   名称的首字母\n\n### 13. 餐厅账单\n\n编写一个程序计算餐厅账单的税费和小费。程序应要求用户输入餐费。税费为餐费的\
  \ 6.75%。小费应为后总额的 20%。显示餐费、税费、小费和总额。\n\n### 14. 男女比例\n\n编写一个程序，要求用户输入班级中的男女人数。程序应显示男女的比例。\n\
  \n*提示：假设班上有 8 名男性和 12 名女性。共有 20 名学生。男性的比例可以为 `8 / 20 = 0.4`（或 40%）。女性的比例可以为 `12\
  \ / 20 = 0.6`（或 60%）。*\n\n### 15. 股票佣金\n\nKathryn 购买了 600 股股票，每股 $21.77。她必须向经纪支付\
  \ 2% 的佣金。编写一个程序计算并显示：\n\n*   股票金额\n*   佣金金额\n*   总支付金额（股票加佣金）\n\n### 16. 能量饮料\n\n\
  某软饮料公司最近调查了 12,467 名客户，发现大约 14% 的人每周购买一种或多种能量饮料。在这些购买能量饮料的客户中，约有 64% 喜欢柑橘味能量饮料。编写一个程序显示：\n\
  \n*   调查中每周购买一种或多种能量饮料的客户约人数\n*   调查中喜欢柑橘味能量饮料的客户约人数\n\n### 17. 配料调整\n\n一个饼干配方需要以下原料：\n\
  \n*   1.5 杯糖\n*   1 杯黄油\n*   2.75 杯面粉\n\n该配方可以制作 48 块饼干。编写一个程序询问用户想要制作多少块饼干，然后显示指定数量所需的每种原料杯数。\n\
  \n### 18. 单词游戏\n\n编写一个与用户玩单词游戏的程序。程序应要求用户输入以下内容：\n\n*   姓名\n*   年龄\n*   城市\n*  \
  \ 大学名称\n*   职业\n*   动物种类\n*   宠物名称\n\n\n\n\n\n在用户输入这些项目后，程序应该显示以下故事，并将用户的输入插入适当的位置：\n\
  \n```\nThere once was a person named NAME who lived in CITY. At the age of AGE,\
  \ NAME went to college at COLLEGE. NAME graduated and went to work as a PROFESSION.\
  \ Then, NAME adopted a(n) ANIMAL named PETNAME. They both lived happily ever after!\n\
  ```\n\n### 19. 股票交易程序\n\n上个月，Joe 在 Acme Software, Inc. 购买了一些股票。以下是购买详情：\n\n*   Joe\
  \ 购买的股票数量为 1,000 股。\n*   当 Joe 购买股票时，每股价格为 32.87 美元。\n*   Joe 向他的股票经纪支付了佣金，金额为其支付股票金额的\
  \ 2%。\n\n两周后，Joe 卖出了这些股票。以下是出售详情：\n\n*   Joe 卖出的股票数量为 1,000 股。\n*   他以每股 33.92 美元的价格卖出了股票。\n\
  *   他向他的股票经纪支付了另一笔佣金，金额为其卖出股票所得金额的 2%。\n\n编写一个程序显示以下信息：\n\n*   Joe 购买股票支付的金额。\n\
  *   Joe 在购买股票时支付给经纪人的佣金金额。\n*   Joe 卖出股票的金额。\n*   Joe 在卖出股票时支付给经纪人的佣金金额。\n*   显示\
  \ Joe 在卖出股票并向经纪支付两笔佣金后获得的利润。（如果你的程序显示的利润为负数，则说明 Joe 在该交易中亏损了。）\n\n### 20. 种植葡萄藤\n\
  \n一位葡萄园主正在种植几行新的葡萄藤，需要知道每行要种多少棵葡萄藤。她确定，在测量了未来某行的长度后，可以使用以下公式计算该行可以容纳的葡萄藤数量，以及每行末端需要建造的葡萄架端柱组件：\n\
  \n$$V = \\frac{R - 2E}{S}$$\n\n公式中的术含义为：\n\n*   `V` 是行内可以容纳的葡萄藤数量。\n*   `R` 是行的长度，单位为英尺。\n\
  *   `E` 是端柱组件占据的空间。\n*   `S` 是葡萄藤之间的距离，单位为英尺。\n\n编写一个程序为葡萄园主进行计算。该程序应要求用户输入以下：\n\
  \n*   行的长度（英尺）\n*   端柱组件占据的空间（英尺）\n*   葡萄藤之间的距离（英尺）\n\n一旦输入数据完成，程序应计算并显示行内可以容纳的葡萄藤数量。\n\
  \n### 21. 复利\n\n当银行账户支付复利时，它不仅对存入账户的本金支付利息，还对随时间积累的利息支付利息。假设你想向储蓄账户存款，让账户产生若干年的复利。计算指定年后账户余额的公式为：\n\
  \n$$A = P\\left( {1 + \\frac{r}{n}} \\right)^{nt}$$\n\n公式中的术含义为：\n\n*   `A` 是指定年后账户中的金额。\n\
  *   `P` 是最初存入账户的本金。\n*   `r` 是年利率。\n*   `n` 是每年计息的频率。\n*   `t` 是指定的年数。\n\n编写一个程序为你进行计算。该程序应要求用户输入以下内容：\n\
  \n*   最初存入账户的本金金额\n*   账户的年利率\n*   每年计息的次数（例如，如果每月计息一次，输入 12。如果按季度计息，输入 4。）\n* \
  \  账户产生收益的年数\n\n一旦输入数据完成，程序应计算并显示指定年后账户中的金额。\n\n### 注意\n\n用户应以百分比输入利率。例如，2% 应该输入\
  \ 2，而不是 .02。程序随后必须将输入除以 100，以便将小数点移动到正确的位置。\n\n# 第 3 章 决策结构\n\n## 话题\n\n1.  3.1\
  \ `if` 语句\n2.  3.2 `if-else` 语句\n3.  3.3 嵌套 `if` 语句\n4.  3.4 `if-else-if` 语句\n5.\
  \  3.5 逻辑运算符\n6.  3.6 比较 `String` 对象\n7.  3.7 关于变量声明和作用域的更多\n8.  3.8 条件（可选）\n9.\
  \  3.9 `switch` 语句\n10. 3.10 使用 `System.out.printf` 和 `String.format` 显示格式化输出\n\
  11. 3.11 需要避免的常见错误\n\n\n\n\n在流程图中，“穿外套”这一动作只在外面很冷时才会执行。如果外面不冷，则会跳过该动作。该动作是`有条件执行`的，因为它只在存在特定条件（外面很冷）时才执行。图\
  \ 3-3 显示了一个更详尽的流程图，其中三个动作只在外面很冷时被执行。\n\n# 图 3-3 三动作决策结构逻辑\n\n![一个三动作决策结构逻辑说明了穿外套的几个动作取决于外面是否寒冷的条件。](img/03fig03.png)图\
  \ 3-3 完整替代文本\n\n在 Java 中编写决策结构的一种方法是使用 `if` 语句。以下是 `if` 语句的一般格式：\n\n```\nif (BooleanExpression)\n\
  \    statement;\n```\n\n`if` 语句的工作原理非常简单：括号内部出现的 `BooleanExpression` 必须是一个 `boolean`\
  \ 表达式。一个 `boolean`表达式要么为 `true` 要么为 `false`。如果 `boolean` 表达式为 `true`，则执行紧随其后的 `statement`。否则，将跳过它。该\
  \ `statement` 是有条件执行的，因为它只在括号中的表达式为 `true` 的条件下才执行。\n\n# 检查点 3.1\n\n../components/metrodigi/ch03-inline_self_quiz_v1.0.0-01/index.html\n\
  \n# 检查点 3.2\n\n../components/metrodigi/ch03-inline_self_quiz_v1.0.0-02/index.html\n\
  \n# 检查点 3.3\n\n../components/metrodigi/ch03-inline_self_quiz_v1.0.0-03/index.html\n\
  \n## 使用关系运算符形成条件\n\n通常，由 `if` 语句测试的 `boolean` 表达式是由关系运算符组成的。`关系运算符` 确定两个值之间是否存在特定的关系。例如，大于运算符（`>`）确定一个值是否大于另一个值。等于运算符（`==`）确定两个值是否相等。表\
  \ 3-1 列出了所有的 Java 关系运算符。\n\n### 表 3-1 关系运算符\n\n| 关系运算符（按优先级顺序排序） | 含义 |\n| --- |\
  \ --- |\n| `>` | 大于 |\n| `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n| `==` |\
  \ 等于 |\n| `!=` | 不等于 |\n\n所有的关系运算符都是二元运算符，这意味着它们使用两个操作数。这里是一个使用大于运算符的表达式示例：\n\n\
  ```\nlength > width\n```\n\n该表达式确定 `length` 是否大于 `width`。如果 `length` 大于 `width`，则表达式的值为\
  \ `true`。否则，表达式的值为 `false`。因为该表达式只能为 `true` 或 `false`，所以它是一个 `boolean` 表达式。下面的表达式使用小于运算符来确定\
  \ `length` 是否小于 `width`：\n\n```\nlength < width\n```\n\n表 3-2 显示了比较变量 `x` 和 `y`\
  \ 的几个 `boolean` 表达式示例。\n\n### 表 3-2 使用关系运算符的 `boolean` 表达式\n\n| 表达式 | 含义 |\n| ---\
  \ | --- |\n| `x > y` | `x` 是否大于 `y`？ |\n| `x < y` | `x` 是否小于 `y`？ |\n| `x >= y`\
  \ | `x` 是否大于或等于 `y`？ |\n| `x <= y` | `x` 是否小于或等于 `y`？ |\n| `x == y` | `x` 是否等于 `y`？\
  \ |\n| `x != y` | `x` 是否不等于 `y`？ |\n\n两个运算符 `>=` 和 `<=` 测试的是多一种关系。`>=` 运算符确定其左侧的操作数是否大于或等于右侧的操作数。假设\
  \ `a` 是 4，`b` 是 6，`c` 是 4，那么表达式 `b >= a` 和 `a >= c` 都是 `true`，但 `a >= 5` 为 `false`。使用此运算符时，`>`\
  \ 符号必须在 `=` 符号之前，且两者之间没有空格。`<=` 运算符确定左侧的操作数是否小于或等于右侧的操作数。再次假设 `a` 是 4，`b` 是 6，`c`\
  \ 是 4，`a <= c` 和 `b <= 10` 都是 `true`，但 `b <= a` 为 `false`。使用此运算符时，`<` 符号必须在 `=`\
  \ 符号之前，且两者之间没有空格。`==` 运算符确定左侧的操作数是否等于右侧的操作数。如果两个操作数相同，则表达式为 `true`。假设 `a` 是 4，表达式\
  \ `a == 4` 为 `true`，而 `a == 2` 为 `false`。注意相等运算符是两个 `=` 符号。不要将其与赋值 `=` 符号赋值运算符混淆。`!=`\
  \ 运算符是不等于运算符。它确定左侧的操作数是否不等于右侧的，这与 `==` 运算符相反。如前假设 `a` 是 4，`b` 是 6，`c` 是 4，`b !=\
  \ a` 和 `a != c` 都是 `true`（等待，原文说 `b >= a` 和 `a >= c` 是 true，但上下文暗示是 `!=`。根据原文：`b\
  \ >= a` 和 `a >= c` 均为 `true`，但 `a >= 5` 为 `false`）。\n\n# 检查点 3.4\n../components/metrodigi/ch03-inline_self_quiz_v1.0.0-01/index.html\n\
