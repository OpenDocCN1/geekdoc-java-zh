  \n# 1.4 编程语言\n\n概念：程序是计算机遵循的一组指令。编程语言是用于编写程序的特殊语言。\n\n## 什么是程序？\n\n计算机被设计为遵循指令。计算机程序是能够解决问题或执行任务的指令集。例如，假设我们要计算机计算总工资。以下是计算机执行此任务的列表：\n\
  \n1. 在屏幕上显示：“你工作了多少小时？”\n2. 允许用户输入工作小时。\n3. 用户输入数字后存储在内存中。\n4. 在屏幕上显示：“时薪是多少？”\n\
  5. 允许用户输入时薪。\n6. 用户输入数字后存储在内存中。\n7. 当工作小时和时薪都输入后，将这两个数字相乘并将结果存储在内存中。\n8. 在屏幕上显示金额。该信息必须包含步骤\
  \ 7 计算的结果。\n\n这些指令统称为`算法`（algorithm）。算法是执行任务或解决问题的良定义步骤。注意这些步骤是有顺序的。步骤 1 应该在步骤 2\
  \ 之前执行，依此类推。按顺序执行这些指令非常重要。\n\n虽然你我可以很容易理解算法中的指令，但它还没有准备好在计算机上执行。计算机的`CPU`只能处理用`机器语言`编写的指令。如果你查看机器语言程序，你会看到二进制数字（仅由\
  \ 0 和 1 组成的数字）。这些数字形成了机器语言指令，`CPU`将其解释为命令。这是一个机器语言指令的示例：\n\n```\n1011010000000101\n\
  ```\n\n想象，将算法编码为机器语言的过程是非常枯燥困难的。此外，每种类型的 CPU 都有自己的机器语言。如果你为计算机 A 编写了机器语言程序，然后想在具有不同类型的计算机\
  \ B 上运行，你就必须用计算机 B 的机器语言重写程序。\n\n# 检查点 1.15\n\n../components/metrodigi/ch01-fill_in_the_blank-02/index.html\n\
