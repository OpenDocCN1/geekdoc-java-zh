  \n## 响应 `RadioButton` 点击\n\n有时，你只是想知道 `RadioButton` 是否被选中。在这种情况下，你调用 `RadioButton`\
  \ 控件的 `isSelected` 方法。然而，在其他时候，你希望在用户点击 `RadioButton` 时立即执行操作。就像 `Button` 控件一样，`RadioButton`\
  \ 控件在被点击时会生成一个 `ActionEvent`。如果你想响应 `RadioButton` 的动作事件，必须为该控件注册一个事件处理器。为 `RadioButton`\
  \ 创建并注册事件处理器的过程与创建和注册 `Button` 事件处理器的过程相同。\n\n代码列表 13-15 显示了一个示例。当程序运行时，它会显示如图 13-9\
  \ 所示的左侧窗口。初始显示一朵花的图像。当用户点击*Sunset* `RadioButton` 时，图像会立即如右侧窗口所示发生变化。用户可以点击 `RadioButton`\
  \ 控件来显示花朵或日落。\n\n## 图 13-9 RadioButtonEvent 应用程序\n\n![两个窗口描述了 Radio Button 事件应用程序。](img/13fig09.png)图\
