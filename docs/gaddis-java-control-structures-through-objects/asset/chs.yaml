  \n# 接口中的字段\n\n接口可以包含字段声明，但接口中的所有字段都被视为 `final` 和 `static`。由于它们自动变为 `final`，你必须提供一个初始化值。例如，查看以下接口定义：\n\
  \n```\npublic interface Doable\n {\n    int FIELD1 = 1;\n    int FIELD2 = 2;\n \
  \   (方法头部 . . .)\n }\n```\n\n\n\n\n\n在此接口中，`FIELD1` 和 `FIELD2` 是 `final` `static`\
  \ `int` 变量。任何实现此接口的类都可以访问这些变量。\n\n# 实现多个接口\n\n你可能在奇怪为什么我们既需要抽象类又需要接口，因为它们之间非常相似。原因是一个类只能继承一个超类，但\
  \ Java 允许一个类实现多个接口。当一个类实现多个接口时，它必须提供所有接口都指定的方法。\n\n在类定义中指定多个接口，只需在 `implements`\
  \ 关键字之后用逗号分隔列出接口名称即可。以下是一个实现多个接口的类示例的第一行代码：\n\n```\npublic class MyClass implements\
  \ Interface1,\n                                 Interface2,\n                  \
  \               Interface3\n```\n\n该类实现了三个接口：`Interface1`、`Interface2` 和 `Interface3`。\n\
  \n# UML 中的接口\n\n在 UML 图中，接口的绘制方式与类相似，不同之处在于接口名称和方法名使用了*斜体*，并且在接口名称上方显示了 `<<interface>>`\
  \ 标签。类与接口之间的关系被称为实现关系（realization relationship，即类实现了接口）。在 UML 图中，你通过一条一端带有空心箭头的虚线连接类和接口来表示实现关系。箭头指向接口。这描述了实现关系。图\
  \ 10-19 是一张显示 `GradedActivity` 类、`FinalExam3` 类和 `Relatable` 接口之间关系的 UML 图。\n\n\
