  \n../components/metrodigi/ch01-assessable_table_v1.0.1-04/index.html\n\n### 行与语句\n\
  \n通常，程序的内容按行和语句来考虑的。*行*（line）就是指其实义——即程序主体中显示的单行。代码列表 1-1 显示了其每一行的编号。大多数行都包含有意义的内容；然而，第\
  \ 7 行是空的。空行用于提高程序的可读性。\n\n语句（statement）是一个导致计算机执行某些操作的完整指令。以下是出现在代码列表 1-1 第 9 行的语句：\n\
  \n```\nSystem.out.println(\"Your gross pay is $\" + grossPay);\n```\n\n该语句导致计算机在屏幕上显示一条信息。语句可以是关键字、运算符和程序员定义名称的组合。语句通常占据一行，但有时会跨越多行。\n\
  \n# 检查点 1.24\n\n../components/metrodigi/ch01-assessable_table_v1.0.1-03/index.html\n\
  \n### 变量\n\nJava 程序在内存中存储数据的根本方式是使用变量。*变量*（variable）是内存中一个命名的存储位置。存储在变量中的数据在运行时可能会改变（因此被称为变量）。注意在代码列表\
  \ 1-1 程序员定义的名称 `hours`、`payRate` 和 `grossPay`。这三个都是变量。正如你在本章后面将学到的，变量是可能存储数据的内存位置名称。\n\
  \n### 图 1-4 变量名称代表一个位置\n\n![在 23 框处标记了 72](img/01fig04.png)\n\n在图 1-4 中，变量 `length`\
  \ 持有值 72。数字 72 实际上存储在 RAM 地址 23，但名称代表了该存储位置。如果有帮助的话，你可以将变量想象成一个盒子。盒子内一次只能存储一个项目。如果程序在盒子中存储另一个值，它将取代\
  \ 72。\n\n# 检查点 1.25\n\n../components/metrodigi/ch01-inline_self_quiz_v1.0.0-18/index.html\n\
  \n# 编译器与 虚拟机\n\n编写 Java 程序时，必须将其输入计算机并保存到文件中。使用*文本编辑器*（类似于文字处理软件）来进行此任务。程序员编写的 Java\
  \ 编程语句被称为*源代码*，保存这些语句的文件称为*源文件*。Java 源文件以 .java 结尾。\n\n程序员将源代码保存到文件后，会运行 Java 编译器。*编译器*（compiler）是将源代码翻译成可执行形式的程序。在翻译过程中，编译器会发现程序中可能存在的语法错误。*语法错误*（syntax\
  \ errors）是程序员违反编程语言规则的错误。在编译器翻译源代码之前，必须修正这些错误。一旦程序没有语法错误，编译器就会创建一个包含翻译后的指令的新文件。\n\
  \n\n\n\n\n大多数编程语言编译器将源代码直接翻译成包含机器语言指令的文件。这些文件被称为 `executable files`，因为它们可以直接由计算机的\
  \ CPU 执行。然而，Java 编译器将 Java 源文件翻译成一个包含字节码指令的文件。字节码指令不是机器语言，因此不能直接由 CPU 直接执行。相反，它们由`Java\
  \ Virtual Machine`（JVM）执行。JVM 是一个读取 Java 字节码指令并在读取时执行它们的程序。由于这个原因，JVM 通常被称为解释器，而\
  \ Java 通常被认为是一种解释型语言。图 1-5 展示了编写 Java 程序、将其编译为字节码并并运行该程序的过程。\n\n### 图 1-5 程序开发过程\n\
  \n![程序开发过程如下：文本编辑器、源文件、java 编译器、字节码文件和 java 虚拟机。](img/01fig05.png)图 1-5 完整备用文本\n\
  \n虽然 Java 字节码不是 CPU 的机器语言，但它可以被视为 JVM 的机器语言。你可以将 JVM 视为一个模拟计算机的程序，其机器语言是 Java 字节码。\n\
  \n### 可移植性\n\n`portable`可移植）一词意味着程序可以在一种类型的计算机上编写，然后在各种计算机上运行，几乎或不需要任何修改。由于 Java\
  \ 字节码在所有计算机上都是相同的，编译后的 Java 程序具有高度的可移植性。事实上，编译后的 Java 程序可以在任何带有 Java 虚拟机的计算机上运行。图\
  \ 1-6 展示了编译后的 Java 程序在 Windows、Linux、Mac 和 UNIX 计算机上运行的概念。\n\n### 图 1-6 Java 字节码可以在任何带有\
  \ Java 虚拟机的计算机上运行\n\n![源文件指向 java 编译器，java 指向字节码文件。字节码文件指向四个位置：用于 windows、linux、Max\
  \ 和 UNIX 的 java 虚拟机。](img/01fig06.png)\n\n对于大多数其他编程语言，可移植性是通过为该语言要运行的每种计算机创建一个编译器来实现的。例如，为了让\
  \ Windows、Linux 和 Mac 支持 C++ 语言，必须为这些环境中的每一个创建一个独立的 C++ 编译器。编译器是非常复杂的程序，开发起来比解释器更困难。出于这个原因，已经为许多类型的计算机开发了\
  \ JVM。\n\n### Java 软件版本\n\n你用于创建 Java 程序的软件被称为 `JDK`（Java 开发工具包）或 `SDK`（软件开发包）。Oracle\
  \ 提供了以下不同的 JDK 版本：\n\n* `Java SE`——Java 标准版（Standard Edition）提供了编写 Java 所需的所有基本软件工具。\n\
  * `Java EE`——Java 企业版（Enterprise Edition）为创建大型业务应用程序提供了工具，这些程序服务器并在 Web 上提供服务。\n\
  * `Java ME`——Java 微型版（Micro Edition）为手机、传真机和电器等消费产品提供了一个小型、高度优化的运行时环境。\n\n可以通过以下地址从\
