  \ 下载所有源代码。\n\n# 7.13 `ArrayList` 类\n\n概念：`ArrayList` 是 Java API 中的一个类，类似于数组，并允许你存储对象。与数组不同，`ArrayList`\
  \ 对象的大小会自动调整，以适应存储在其中的项目数量。\n\nJava API 提供了一个名为 `ArrayList` 的类，可用于存储和检索对象。一旦你创建了一个\
  \ `ArrayList` 对象，你就可以认为它是存放其他对象的容器。`ArrayList` 对象类似于对象数组，但比数组具有许多优势。以下是其中一些：\n\n\
  *   当向 `ArrayList` 中添加项时，`ArrayList` 对象会自动扩展。\n*   除了向 `ArrayList` 添加项外，你还可以从中删除项。\n\
  *   当从 `ArrayList` 中移除项时，`ArrayList` 对象会自动收缩。\n\n`ArrayList` 类位于 `java.util` 包中，因此需要以下\
  \ `import` 语句：\n\n```\nimport java.util.ArrayList;\n```\n\n# 创建和使用 `ArrayList` 对象\n\
  \n这里是如何创建 `ArrayList` 对象的示例：\n\n```\nArrayList<String> nameList = new ArrayList<String>();\n\
  ```\n\n该语句创建了一个新的 `ArrayList` 对象并将其地址存储在 `nameList` 变量中。注意，在这个示例中，`String` 一词写在\
  \ `ArrayList` 单词后面的尖括号 `<>` 内部。这指定了 `ArrayList` 可以持有 `String` 对象。如果我们尝试向此 `ArrayList`\
  \ 存储任何其他类型的对象，将会发生错误。（在本节稍后，你将看到一个用于存放其他类型对象的 `ArrayList` 示例。）\n\n要向 `ArrayList`\
  \ 对象添加项，你需使用 `add` 方法。例如，以下语句将一系列 `String` 对象添加到 `nameList` 中：\n\n```\nnameList.add(\"\
  James\");\nnameList.add(\"Catherine\");\nnameList.add(\"Bill\");\n```\n\n在执行这些语句后，`nameList`\
  \ 将持有三个对 `String` 对象的引用。第一个引用“James”，第二个引用“Catherine”，第三个引用“Bill”。\n\n存储在 `ArrayList`\
  \ 中的项有对应的索引（index）。索引指定项在 `ArrayList` 中的位置，因此它非常像数组下标。第一个添加到 `ArrayList` 的项存储在索引\
  \ 0 。下一个添加到 `ArrayList` 的项存储在索引 1，以此此类推。在执行之前所示语句后，“James”将存储在索引 0，“Catherine”将存储在索引\
  \ 1，“Bill”将存储在索引 2。\n\n`ArrayList` 类有一个 `size` 方法，用于报告存储在 `ArrayList` 中的的项目数量。它将项目数量作为一个\
  \ `int` 返回。例如，以下语句使用该方法显示 `nameList` 中存储的项目数量：\n\n```\nSystem.out.println(\"The\
  \ ArrayList has \" +\n                   nameList.size() +\n                   \"\
  \ objects stored in it.\");\n```\n\n假设 `nameList` 持有字符串 `String` “James”、“Catherine”和“Bill”，以下语句将显示：\n\
  \n```\nThe ArrayList has 3 objects stored in it.\n```\n\n`ArrayList` 类的 `get` 方法返回存储在特定索引处的项。你将索引作为参数传递给方法。例如，以下语句将显示\
  \ `nameList` 中索引 1 处的项：\n\n```\nSystem.out.println(nameList.get(1));\n```\n\n代码列表\
  \ 7-23 中的程序演示了目前讨论的话题。\n\n# 代码列表 7-23 `(ArrayListDemo1.java)`\n\n```\nimport java.util.ArrayList;\n\
  \n/**\n 此程序演示了 ArrayList。\n */\npublic class ArrayListDemo1\n{\n    public static\
  \ void main(String[] args)\n    {\n        // 创建一个 ArrayList 来存放一些名字。\n        ArrayList<String>\
  \ nameList = new ArrayList<String>();\n\n        // 向 ArrayList 添加一些名字。\n      \
  \  nameList.add(\"James\");\n        nameList.add(\"Catherine\");\n        nameList.add(\"\
  Bill\");\n\n        // 显示 ArrayList 的大小。\n        System.out.println(\"The ArrayList\
  \ has \" +\n                           nameList.size() +\n                     \
  \      \" objects stored in it.\");\n\n        // 现在显示 nameList 中的项。\n        for\
  \ (int index = 0; index < nameList.size(); index++)\n            System.out.println(nameList.get(index));\n\
  \    }\n}\n```\n\n程序输出\n\n```\nThe ArrayList has 3 objects stored in it.\nJames\n\
  Catherine\nBill\n```\n\n注意第 25 行，`for` 循环使用从 `nameList` 的 `size` 方法返回的值来控制循环次数。这是为了防止越界错误。`ArrayList`\
  \ 中的最后一个项的索引将比 `ArrayList` 的 `size` 小 1。如果你向 `get` 方法传递一个更大的值，将会发生错误。\n\n# 在 ArrayList\
  \ 中使用增强 `for` 循环\n\n在本章之前，你已经看到如何使用增强 `for` 循环遍历数组中的每个 `element`。你也可以使用增强 `for`\
  \ 循环来遍历 `ArrayList` 中的每个项。代码列表 7-24 演示了这一点。增强 `for` 循环用于第 26 行和第 27 行显示 `ArrayList`\
  \ 中的所有项。\n\n# 代码列表 7-24 `(ArrayListDemo2.java)`\n\n```\nimport java.util.ArrayList;\n\
  \n/**\n 此程序演示了如何与 ArrayList 一起使用增强循环。\n */\npublic class ArrayListDemo2\n{\n   \
