  \n# 10.2 调用父类构造函数\n\n概念：`super` 关键字指向对象的父类。你可以使用 `super` 关键字调用父类构造函数。\n\n在上一节中，你看到了父类的默认构造函数或无参构造函数是在子类构造函数之前自动调用的。但如果父类没有默认构造函数或无参构造函数呢？或者，如果父类有多个构造函数而你想调用特定的一个？在这两种情况下，都使用\
  \ `super` 关键字显式地调用父类构造函数。`super` 关键字指向对象的父类，并可访问父类的成员。代码列表 10-8 显示了一个类 `SuperClass2`，它有一个无参构造函数和一个接受\
  \ `int` 参数的构造函数。代码列表 10-9 显示了继承 `SuperClass2` 的 `SubClass2`。该类的构造函数使用 `super` 关键字调用父类的构造函数并传递一个参数。\n\
  \n```\n 1  public class SuperClass2\n  2  {\n  3     /**\n  4        Constructor\
  \ #1\n  5     */\n  6\n  7     public SuperClass2()\n  8     {\n  9        System.out.println(\"\
  This is the superclass \" +\n 10                  \"no-arg constructor.\");\n 11\
  \     }\n  12\n  13     /**\n  14        Constructor #2\n  15     */\n  16\n  17\
  \     public SuperClass2(int arg)\n  18     {\n  19        System.out.println(\"\
  The following argument \" +\n 20                           \"was passed to the superclass\
  \ \" +\n 21                           \"constructor: \" + arg);\n  22     }\n  23\
  \  }\n```\n\n# 代码列表 10-8 `(SuperClass2.java)`\n\n```\n 1  public class SubClass2\
  \ extends SuperClass2\n  2  {\n  3     /**\n  4         Constructor\n  5     */\n\
    6\n  7     public SubClass2()\n  8     {\n  9        super(10);\n 10        System.out.println(\"\
  This is the \" +\n 11                           \"subclass constructor.\");\n 12\
  \     }\n  13  }\n```\n\n# 代码列表 10-9 `(SubClass2.java)`\n\n`SubClass2` 构造函数第 9 行的语句调用了父类构造函数并将参数\
  \ 10 传递给它。关于调用父类构造函数，你需要记住三个准则：\n\n*   调用父类构造函数的 `super` 语句只能写在子类的构造函数中。你不能从任何其他方法调用父类构造函数。\n\
  *   调用父类构造函数的 `super` 语句必须是子类构造函数的第一条语句。这是因为父类构造函数必须在子类构造函数的代码之前执行。\n*   如果子类构造函数没有显式调用父类构造函数，Java\
  \ 将在子类构造函数代码执行之前自动调用父类的默认构造函数或无参构造函数。这等同于在子类构造函数的开头放置以下语句：\n\n```\nsuper();\n```\n\
  \n代码列表 10-10 中的程序演示了这些类。\n\n```\n 1  /**\n  2     This program demonstrates how\
  \ a superclass\n  3     constructor is called with the super key word.\n  4  */\n\
    5\n  6\n  7  public class ConstructorDemo2\n  8  {\n  9     public static void\
  \ main(String[] args)\n 10     {\n 11        SubClass2 obj = new SubClass2();\n\
   12     }\n  13  }\n```\n\n\n\n\n\n让我们来看一个更有意义的例子。回顾第 6 章中的` `Rectangle` 类。图 10-9\
  \ 展示了该类的 UML 图。\n\n# 图 10-9 `Rectangle` 类的 UML 图\n\n![定义了 Rectangle 类的 UML 图。](img/10fig09.png)图\
