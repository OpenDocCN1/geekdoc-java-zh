  \ 13-14 备用文本\n\n# 获取选中项目的索引\n在内部，`ListView` 控件中的每个项目都分配了一个标记该项目位置的索引。第一个项目（列表顶部的项目）的索引为\
  \ 0，第二个项目的索引为 1，依此类推。你可以使用 `ListView` 类的 `getSelectionModel().getSelectedIndex()`\
  \ 方法获取当前选中项目的索引。例如，假设有一个名为 `listView` 的 `ListView` 控件。以下代码获取控件中当前选中的项目的索引，并将其赋值给名为\
  \ `index` 的 `int` 变量：\n\n```\nint index = listView.getSelectionModel().getSelectedIndex();\n\
  ```\n\n如果 `ListView` 中没有选择任何项目，该方法将返回 `-1`。你可以用此来判断用户是否选择了某个项目。例如，代码列表 13-18 是对代码列表\
