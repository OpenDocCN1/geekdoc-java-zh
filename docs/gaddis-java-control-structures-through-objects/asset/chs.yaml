  \n让我们仔细查看 代码列表 12-2 中的程序程序：\n\n*   第 1 到 5 行导入了以下 JavaFX 类：`Application`、`Stage`、`Scene`、`HBox`\
  \ 和 `Label`。\n*   `HelloWorld` 类的声明从第 11 行开始。注意它扩展了 `Application` 类。\n*   `main`\
  \ 方法出现在第 13 到 17 行。`main` 方法只做了一件事：在第 16 行调用了 `launch` 方法。继承自 `Application` 类的 `launch`\
  \ 方法执行了许多设置操作，包括以下内容：\n    *   它创建了一个 `Stage` 对象，该对象将作为应用程序的窗口。\n    *   它调用了 `start`\
  \ 方法，并将 `Stage` 引用作为参数传递。\n*   `start` 方法出现在第 20 到 39 行。这是程序的入口点。`start` 方法是 `Application`\
