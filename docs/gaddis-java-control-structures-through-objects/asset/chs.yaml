  \n| --- | --- |\n\n| `RotateTransition()` | 创建一个空的 `RotateTransition` 对象。调用类的 `setDuration`\
  \ 方法建立动画持续时间，并调用 `setNode` 方法指定要动画的节点。 |\n| `RotateTransition(`duration`)` | 参数\
  \ `duration` 是 `Duration` 类的对象，指定动画应该持续的时间。 |\n| `RotateTransition(`duration`,`node`)`\
