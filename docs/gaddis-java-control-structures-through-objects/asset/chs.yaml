  \n\n\n\n`Padding`（内边距）出现在容器内边缘周围的空间。如果你想为 `HBox` 添加内边距，可以调用 `HBox` 对象的 `setPadding`\
  \ 方法。`setPadding` 方法接受一个 `Insets` 对象作为其参数。在构造 `Insets` 对象时，将一个像素值作为参数传递给构造函数。例如，以下语句为名为\
  \ `hbox` 的 `HBox` 容器添加了 10 像素的内边距：\n\n```\nhbox.setPadding(new Insets(10));\n```\n\
  \n`Insets` 类位于 `javafx.geometry` 包中，因此请务必在程序中包含必要的 `import` 语句。代码列表 12-6 展示了一个示例。程序的输出所示于图\
