  ## 练习题 49\n\n../components/metrodigi/ch04-inline-quiz_v1.0.0-41\n\n##8 break 和 continue\
  \ 语句（可选）\n\n概念：`break` 语句导致循环终止。`continue` 语句导致当前迭代结束。\n\n`break` 语句在第 3 章中也可以放在循环内部。当遇到它时，循环停止并跳转到循环后的语句。\n\
  \n`continue` 语句导致当前迭代结束。当遇到它时，循环中后续的语句将被忽略，并准备下一次迭代。在 `while` 循环中，这意味着程序跳转到循环顶部的布尔表达式。如果表达式仍为\
  \ `true`，则开始下一次迭代。在 `do-while` 循环中，程序跳转到循环底部的布尔表达式来决定下一次迭代。在 `for` 循环中，`continue`\
  \ 会执行更新表达式，然后评估测试表达式。\n\n`continue` 语句也应该被避免。和 `break` 语句一样，它会跳过循环逻辑并使代码难以理解和调试。\n\
  \n## 练习题 50\n\n../components/metrodigi/ch04-inline-quiz_v1.0.0-42\n\n## 练习题 51\n\
  \n../components/metrodigi/ch04-inline-quiz_v1.0.0-43\n\n## 4.9 决定使用哪种循环\n\n概念：虽然大多数重复算法可以使用任何类型的循环来编写，但每种循环在不同情况下效果最好。\n\
  \nJava 的三种循环在不同情况下都是理想选择。以下是何时使用每种循环的简短总结：\n\n*   **`while` 循环**。`while` 循环是预测试循环。对于在条件为\
  \ `false` 时不想迭代的情况，它是理想的。如果你想使用哨兵值终止循环，它也是理想的。\n*   **`do-while` 循环**。`do-while`\
  \ 循环是后测试循环。对于始终至少执行一次循环的情况，它是理想的。\n*   **`for` 循环**。`for` 循环是预测试循环，带有初始化、测试和更新表达式。这些表达式使得将循环控制变量作为计数器非常方便。对于已知精确迭代次数的情况，`for`\
  \ 循环是理想的。\n\n## 练习题 52\n\n../components/metrodigi/ch04-assessable_table_v1.0.1-02.html\n\
  \n\n\n\n\n# 4.10 文件输入与输出简介\n\n概念：Java API 提供了几个类，你可以使用它们来向文件写入数据和从文件中读取数据。要向文件写入数据，你可以使用\
  \ `PrintWriter` 类，以及可选地使用 `FileWriter` 类。要从文件中读取数据，你可以使用 `Scanner` 类和 `File` 类。\n\
  \n你到目前为止编写的程序在每次运行时都需要重新输入数据。这是因为存储在内存（RAM）变量和对象中的数据在程序停止运行后就会消失。为了在多次运行之间保留数据，程序必须拥有一种保存数据的方法。\n\
  \n数据可以保存在*文件*中，文件通常存储在计算机的磁盘上。一旦数据保存到文件中，在程序停止运行后它仍然留在那里。之后可以在其他时间检索并使用这些数据。通常，程序使用文件时会采取三个步骤：\n\
  \n1. 文件必须被*打开*。当打开文件时，文件和程序之间会建立连接。\n2. 然后将数据写入文件或从文件中读取。\n3. 当程序完成对文件的使用时，必须*关闭*文件。在本节中，我们将讨论如何编写\
  \ Java 程序向文件写入数据和从文件中读取数据。*输入文件*和*输出文件*这两个术语被常用。*输入文件*是程序从中读取数据的文件。它之所以被称为输入文件是因为存储在其中的数据作为程序的输入。*输出文件*是程序向其写入数据的文件。它之所以被称为输出文件是因为程序将输出内容存储在文件中。\n\
  \n通常，文件有两种类型：文本文件和二进制文件。*文本文件*包含使用 Unicode 等方案编码为文本的数据。即使文件中包含数字，这些数字也是以一系列字符的形式存储在文件中。因此，可以使用记事本（Notepad）等文本编辑器打开并查看文件。*二进制文件*包含未转换为文本的数据。因此，你无法用文本编辑器查看二进制文件的内容。在本章中，我们将讨论如何处理文本文件。二进制文件将在第\
  \ 11 章](#ch11_pg0001.xhtml_P7001015878000000000000000004B65)中讨论。\n\nJava API 提供了许多你将用于处理文件的类。要使用这些类，你需要在程序顶部放置以下\
  \ `import` 语句：\n\n```\nimport java.io.*;\n```\n\n# 使用 `PrintWriter` 类向文件写入数据\n\n\
  要向文件写入数据，你将创建一个 `PrintWriter` 类的实例。`PrintWriter` 类允许你打开一个文件进行写入。它还允许你使用之前在屏幕上显示数据时相同的\
  \ `print` 和 `println` 方法将数据写入文件。你将想要打开的文件名作为字符串传递给 `PrintWriter` 类的构造函数。例如，以下语句创建了一个\
  \ `PrintWriter` 对象并将文件名 `StudentData.txt` 传递给构造函数。\n\n```\nPrintWriter outputFile\
  \ = new PrintWriter(\"StudentData.txt\");\n```\n\n该语句将创建一个名为 `StudentData.txt` 的空文件，并在该文件与由\
  \ `outputFile` 引用的 `PrintWriter` 对象之间建立连接。该文件将在当前目录或文件夹中创建。\n\n你也可以将 `String` 对象的引用作为参数传递给\
  \ `PrintWriter` 构造函数。例如，在以下代码中，用户指定了文件名。\n\n```\nString filename;\n filename = JOptionPane.showInputDialog(\"\
  Enter the filename.\");\n PrintWriter outputFile = new PrintWriter(filename);\n\
  ```\n\n# 警告！\n\n如果你用 `PrintWriter` 对象打开的文件已经存在，它将被擦除，并创建一个同名的空文件。\n\n一旦你创建了 `PrintWriter`\
  \ 类的实例并打开了文件，就可以使用 `print` 和 `println` 方法向文件写入数据。你已经知道如何配合 `System.out` 使用 `print`\
  \ 和 `println` 来在屏幕上显示数据。它们在 `PrintWriter` 对象上的用法完全相同，用于将数据写入文件。例如，假设 `outputFile`\
  \ 引用一个 `PrintWriter` 对象，以下语句将字符串 `\"Jim\"` 写入文件：\n\n```\noutputFile.println(\"Jim\"\
  );\n```\n\n当程序完成向文件写入数据后，必须关闭文件。使用 `PrintWriter` 类的 `close` 方法来关闭文件。以下是该方法的使用示例：\n\
  \n```\noutputFile.close();\n```\n\n你的应用程序在完成文件操作后应始终关闭文件。这是因为系统在打开文件时会创建一个或多个缓冲区。*缓冲区*是内存中的一个较小的“暂存区域”。当程序向文件写入数据时，这些数据首先写入缓冲区。当缓冲区填满时，存储在那里的所有信息都会写入文件。这种技术提高了系统的性能，因为将数据写入内存的速度比写入磁盘要快。`close`\
  \ 方法会写入文件缓冲区中任何任何未保存的数据。\n\n一旦文件被关闭，它与 `PrintWriter` 对象之间的连接就会被移除。为了对文件进行后续操作，必须重新打开它。\n\
  \n#更多关于 `PrintWriter` 类的 `println` 方法的更多信息\n\n`PrintWriter` 类的 `println` 方法写入一行数据。例如，假设一个应用程序通过以下代码创建一个文件并在文件中写入三个学生的姓名和分数：\n\
  \n```\nPrintWriter outputFile = new PrintWriter(\"StudentData.txt\");\n outputFile.println(\"\
  Jim\");\n outputFile.println(95);\n outputFile.println(\"Karen\");\n outputFile.println(98);\n\
   outputFile.println(\"Bob\");\n outputFile.println(82);\n outputFile.close();\n\
  ```\n\n`println` 方法写入数据然后写入一个换行符。你可以通过以下方式可视化写入文件的数据：\n\n```\nJim<newline>95<newline>Karen<newline>98<newline>Bob<newline>82<newline>\n\
  ```\n\n换行符在这里被表示为 *<newline>*。你实际上看不到换行符，但当你用记事本等文本编辑器打开文件时，其内容将如图 4-13 所示。从图中可以看出，每个换行符都会导致随其后的数据显示在新的一行。\n\
  \n![记事本文件 StudentData txt 包含 6 行，内容如下。第一行。Jim。第二行。95。第三行。Karen。第四行。98。第五行。Bob。第六行。82。](img/04fig13.png)\n\
  \n# 图 4-13 在记事本中显示的内容（微软公司）\n\n除了将文件内容分行外，换行符还用作分隔符。*分隔符*是分隔其他项目的。当你使用 `println`\
  \ 方法向文件写入数据时，换行符将分隔单个数据项。以后你会发现文件中的单个数据项必须分隔才能从文件中读取。\n\n# `PrintWriter` 类的 `print`\
  \ 方法\n\n`print` 方法用于向文件写入一个数据项而不写入换行符。例如，查看以下代码：\n\n```\nString name = \"Jeffrey\
  \ Smith\";\n String phone = \"555-7864\";\n int idNumber = 47895;\n PrintWriter\
  \ outputFile = new PrintWriter(\"PersonalData.txt\");\n outputFile.print(name +\
  \ \" \");\n outputFile.print(phone + \" \");\n outputFile.println(idNumber);\n outputFile.close();\n\
  ```\n\n\n\n\n这段代码使用 `print` 方法将 `name` 对象的的内容写入文件，后面紧跟一个空格（`\" \"`）。然后，它使用 `print`\
  \ 方法将 `phone` 对象的的内容写入文件，后面也跟着一个空格。接着，它使用 `println` 方法将 `idNumber` 变量的内容写入文件，并紧跟一个换行符。图\
  \ 4-14 显示了在记事本中显示的文件内容。\n\n![记事本文件 Personal Data.txt 包含 1 行，内容如下：Jeffrey Smith 5\
  \ 5 5 dash 7 8 6 4 dash 4 7 8 9 5。](img/04fig14.png)\n\n# 图 4-14 记事本中显示的文件内容（微软公司）\n\
  \n# 在方法头中添加 `throws` 子句\n\n当 Java 程序发生意外事件时，我们说该程序抛出了异常。目前，你可以将 `exception` 视为一个信号，表示在处理该意外事件之前，程序无法继续运行。例如，假设你创建了一个\
  \ `PrintWriter` 对象并将一个文件名传递给它的构造函数。`PrintWriter` 对象尝试创建该文件，但出乎意的是，磁盘已满导致文件无法创建。显然，在处理此这种情况之前，程序无法继续执行，因此会抛出一个异常，这会导致程序暂停正常执行。\n\
  \n当抛出异常时，正在执行的方法必须要么处理该异常，要么将其再次抛出。如果 `main` 方法抛出异常，程序将停止并显示错误信息。由于 `PrintWriter`\
  \ 对象能够抛出异常，我们必须要么编写代码来处理可能出现的异常，要么允许我们的方法在异常发生时重新抛出这些异常。在第 11 章 throws IOException\n\
  ```\n\n此方法头表示 `main` 方法能够抛出 `IOException` 类型的异常。这是 `PrintWriter` 对象可能抛出的异常类型。因此，任何使用\
  \ `PrintWriter` 对象且不响应其异常的方法，都必须在方法头中列出此 `throws` 子句。\n\n此外，任何调用使用 `PrintWriter`\
  \ 对象的方法的方法都应该应该在其方法头中包含 `throws IOException` 子句。例如，假设 `main` 方法没有执行任何文件操作，但调用了一个名为\
  \ `buildFile` 的方法，该方法打开一个文件并向其中写入数据。`buildFile` 和 `main` 方法都应该在它们的方法头中包含 `throws\
  \ IOException` 子句。否则，将发生编译错误。\n\n### 示例程序\n\n让我们来看一个向文件写入数据的示例程序。代码列表 4-17 中的程序将你朋友的名字写入文件。\n\
  \n在下面的动画中，点击“上一个”或“下一个”按钮逐步查看代码并查看贯穿其中的解释。\n\n# 代码列表 4-17 `(FileWriteDemo.java)`\n\
  \n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr4-17/17.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr4-17/17.html)\n\
  \n第 2 行的 `import` 语句是必要的，因为此程序使用了 `PrintWriter` 类。此外，第 10 行的 `main` 方法头有一个 `throws\
  \ IOException` 子句，因为 `PrintWriter` 类的对象可能会抛出 `IOException`。\n\n该程序要求用户输入他们有多少朋友（第\
  \ 20 行和第 21 行），然后输入要创建的文件名（第 27 行和第 28 行）。`filename` 变量引用文件名，并在第 31 行的后续语句中使用：\n\
  \n```\nPrintWriter outputFile = new PrintWriter(filename);\n```\n\n该语句打开文件并创建一个\
  \ `PrintWriter` 对象，该对象可向文件写入数据。第 34 行到第 43 行的 `for` 循环为用户的每个朋友执行一次迭代，每次请求一个朋友的名字。用户的输入由\
  \ `friendName` 变量引用。一旦输入名称，就会通过出现在第 42 行的以下语句写入文件：\n\n```\noutputFile.println(friendName);\n\
  ```\n\n循环结束后，在第 46 行关闭文件。在输入所示输入执行程序后。\n\n# 图 4-14 记事本中显示的文件内容（微软公司）\n\n# 复习\n\n\
  在继续之前，让我们回顾一下写入文件时的基本步骤：\n\n1. 你在程序顶部需要 `import java.io.*;` 语句。\n2. 因为我们还没有学习如何处理异常，任何使用\
  \ `PrintWriter` 对象的方法都必须在方法头包含 `throws IOException`。\n3. 你创建一个 `PrintWriter` 对象并将文件名作为字符串传递给构造函数。\n\
  4. 你使用 `PrintWriter` 类的 `print` 和 `println` 方法向文件写入数据。\n5. 完成写入文件后，你使用 `PrintWriter`\
  \ 类的 `close` 方法关闭文件。\n\n# 向文件追加数据\n\n当你将文件名传递给 `PrintWriter` 构造函数时，如果文件已存在，它将被删除并创建一个空文件。然而，有时你想保留现有文件并追加数据。向文件追加数据意味着将新数据写入现有数据的末尾。\n\
  \n向现有文件追加数据，你首先创建一个 `FileWriter` 类的实例。向 `FileWriter` 构造函数传递两个参数：包含文件名的字符串和布尔值 `true`。这是一个示例：\n\
  \n```\nFileWriter fwriter = new FileWriter(\"MyFriends.txt\", true);\n```\n\n该语句创建一个\
  \ `FileWriter` 对象并打开 *MyFriends.txt* 用于写入。（如果文件不存在，它将被创建。）\n\n你仍然需要创建一个 `PrintWriter`\
  \ 对象，以便使用 `print` 和 `println` 方法向文件写入数据。当你创建 `PrintWriter` 对象时，将 `FileWriter` 对象的引用作为参数传递给\
  \ `PrintWriter` 构造函数。例如，看以下代码：\n\n```\nFileWriter fwriter = new FileWriter(\"MyFriends.txt\"\
  , true);\nPrintWriter outputFile = new PrintWriter(fwriter);\n```\n\n这创建了一个 `PrintWriter`\
  \ 对象，可用于向文件写入数据。写入文件的任何数据都将追加到文件的现有内容。例如，假设文件 *MyFriends.txt* 并包含以下数据：\n\n```\n\
  Joe\nRose\nGreg\nKirk\nRenee\n```\n\n以下代码打开文件并向现有内容追加数据：\n\n```\nFileWriter fwriter\
  \ = new FileWriter(\"MyFriends.txt\", true);\nPrintWriter outputFile = new PrintWriter(fwriter);\n\
  outputFile.println(\"Bill\");\noutputFile.println(\"Steven\");\noutputFile.println(\"\
  Sharon\");\noutputFile.close();\n```\n\n执行此代码后，*MyFriends.txt* 文件将包含以下数据：\n\n\n\n\
  \n\n```\nJoe\nRose\nGreg\nKirk\nRenee\nBill\nSteven\nSharon\n```\n\n# Note\n\n如果由于任何原因无法打开文件，`FileWriter`\
  \ 类也会抛出 `IOException`。\n\n# 指定文件位置\n\n当你打开一个文件时，可以同文件名一起指定其路径。在 Windows 计算机上，路径包含反斜杠字符。请记住，当字符串字面量中出现单个反斜杠字符时，它标记着转义序列的开始，例如\
  \ `\"\\nn\"`。字符串字面量中的两个反斜杠字符表示单个反斜杠。因此，当你在字符串字面量中提供路径且路径包含反斜杠字符时，你必须用两个反斜杠字符代替每个单个反斜杠字符。\n\
  \n例如，路径 `\"E:\\\\Names.txt\"` 指定 `Names.txt` 在 E 盘的根目录下，路径 `\"C:\\\\MyData\\\\Data.txt\"\
  ` 指定 `Data.txt` 在 C 盘的 `MyData` 文件夹中。在以下语句中，将在 H 盘的根目录下创建文件 `Pricelist.txt`：\n\n\
  ```java\nPrintWriter outputFile = new PrintWriter(\"H:\\\\PriceList.txt\");\n```\n\
  \n只有当文件的路径位于字符串字面量中，你才需要使用双反斜杠。如果你的程序要求用户将路径输入到 `String` 对象中，然后将其传递给 `PrintWriter`\
  \ 或 `FileWriter` 构造函数，用户不需要输入双反斜杠。\n\n# Tip\n\nJava 允许你在 Windows 路径中使用正斜杠代替反斜杠。例如，路径\
  \ `\"C:\\\\MyData\\\\Data.txt\"` 可以写成 `\"C:/MyData/Data.txt\"`。这消除了使用双反斜杠的需求。\n\n\
  在 UNIX 或 Linux 计算机上，你可以提供无需任何修改的路径。以下是一个示例：\n\n```java\nPrintWriter outputFile =\
  \ new PrintWriter(\"/home/rharrison/names.txt\");\n```\n\n# 从文件中读取数据\n\n在第 2 章中，你学习了如何使用\
  \ `Scanner` 类从键盘读取输入。要读取键盘输入，请回想我们创建一个 `Scanner` 对象，并将 `System.in` 传递给 `Scanner`\
  \ 类的构造函数。这是一个示例：\n\n```java\nScanner keyboard = new Scanner(System.in);\n```\n\n\
  记住 `System.in` 对象代表键盘。将 `System.in` 作为参数传递给 `Scanner` 构造函数，指定键盘是 `Scanner` 对象的输入源。\n\
  \n你也可以使用 `Scanner` 类从文件中读取输入。与其将 `System.in` 传递给 `Scanner` 类构造函数，不如传递一个 `File` 对象的引用。这是一个示例：\n\
  \n```java\nFile myFile = new File(\"Customers.txt\");\nScanner inputFile = new Scanner(myFile);\n\
  ```\n\n第一条语句创建了 `File` 类的一个实例。`File` 类位于 Java API 中，用于表示文件。注意我们将字符串 `\"Customers.txt\"\
  ` 传递给了构造函数。\n\n第二个语句将 `File` 对象的引用传递给 `Scanner` 构造函数。这指定了该文件是 `Scanner` 对象的输入源。当你完成读取后，使用\
  \ `close()` 方法关闭文件。\n\n# 使用 nextLine 方法从文件中读取行\n\n`Scanner` 类的 `nextLine()` 方法从文件中读取一行并将其作为\
  \ `String` 返回。例如，如果程序执行以下语句：\n\n```java\nString str = inputFile.nextLine();\n```\n\
  \n在该语句之后，变量 `str` 包含了从文件中读取的行内容。\n\n\n\n\n该语句将从文件中读取一行，从当前的读取位置开始。在语句执行后，由 `str`\
  \ 引用的对象将包含字符串“Imagination is more”。文件的读取位置将移动到下一行，如图 4-18 所示。\n\n![读取了三行文本如下：Imagination\
  \ is more.比知识更重要。爱因斯坦。在读取第一行后，读取位置移动到第二行的开头。](img/04fig18.png)\n\n## 图 4-18 读取第一行后的读取位置\n\
  \n如果再次调用 `nextLine()` 方法，将从文件中读取第二行，并且文件的读取位置将移动到第三行。在读取完所有行后，读取位置将位于文件的末尾。\n\n\
  ### 注意事项\n\n从 `nextLine()` 方法返回的字符串不包含换行符。\n\n## 在方法头中添加 `throws` 子句\n\n当你将一个 `File`\
  \ 对象引用传递给 `Scanner` 类的构造函数时，如果找不到指定的文件，构造函数将抛出一个 `IOException` 类型的异常。因此，在任何将 `File`\
  \ 对象引用传递给 `Scanner` 类构造函数的方法头中，你都需要写一个 `throws IOException` 子句。\n\n##检测文件结束\n\n\
  很多时候，程序必须在不知道文件中存储了多少项目的情况下读取文件内容。例如，程序在代码列表 4-17 中创建的 `MyFriends.txt` 文件可以存储任意数量的名字。这是因为程序会询问用户他或她有多少个朋友。如果用户输入的朋友数量为\
  \ 5，程序将创建一个包含五个名字的文件。如果用户输入 100，程序将创建一个包含 100 个名字的文件。\n\n`Scanner` 类有一个名为 `hasNext()`\
  \ 的方法，可以用于判断文件中是否有更多可以读取的数据。在调用任何其他读取文件的方法之前，你先调用 `hasNext()` 方法。如果文件中还有更多可以读取的数据，`hasNext()`\
  \ 方法返回 `true`。\n\n如果已到达文件末尾没有更多数据可读，`hasNext()` 方法返回 `false`。\n\n代码列表 4-19 显示了一个示例。该程序读取包含你朋友名字的文件，该文件是由程序在代码列表\
  \ 4-17 中创建的。\n\n在下面的动画中，点击“上一个”或“下一个”按钮逐步查看代码并查看各处的解释。\n\n## 代码列表 4-19 `(FileReadDemo.java)`\n\
