  md: 'TypeScripts system is extremely powerful in that you can do supremely powerful
    things in the language / slicing / dicing types in ways that are not possible
    in any single language out there.


    This is because TypeScript is designed to allow you to work seamlessly with a
    **highly dynamic** language like JavaScript. Here we cover a few tricks for moving
    types around in TypeScript.


    Key motivation for these : You change one thing and everything else just updates
    automatically you get nice errors if something is going to break, like a well
    designed constraint system.


    # Copying both the Type + Value


    If you want to move a class around you might be tempted to do the following:


    ```

    class Foo {

    var Bar = Foo;

    var bar: Bar; // ERROR: "cannot find name ''Bar''"

    ```


    This is an error because `var` only copied the `Foo` into the `variable` declaration
    space and you cannot use `Bar` as a type annotation. The proper way is to use
    the `import` keyword. Note that you can only use the `import` keyword in such
    a way if you are using `namespaces` or `modules` (or on these later):


    ```

    namespace importing {

    export class Foo {}

    }


    import Bar = importing.Foo;

    var bar: Bar; // Okay

    ```


    This `import` trick only works for things that are **both type and a variable**.


    # Capturing the type of a variable


    You can actually use a variable in a type annotation using the `typeof` operator.
    This allows you to tell the compiler that one variable is the same type as another.
    Here is an example to demonstrate this:'
