    console.log('foo bar'.endsWith('bas')); // true\n```\n\n# Using your own custom\
    \ lib.dts\n\nAs we mentioned earlier using the noLib boolean compiler flag causes\
    \ TypeScript to exclude the automatic inclusion of lib.dts . There are various\
