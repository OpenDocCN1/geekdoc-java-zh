    # Functions


    There are a few subtle things to consider when comparing two functions.


    # Return Type


    covariant : The return type must contain at least enough data.


    ```

    /** Type Heirachy */

    interface Point2D { x: number; y: number; }

    interface Point3D { x: number; y: number; z: number; }


    /** Two sample functions */

    let iMakePoint2D = (): Point2D => ({ x: 0, y: 0 });

    let iMakePoint3D = (): Point3D => ({ x: 0, y: 0, z: 0 });


    /** Assignment */

    imeakePoint2D = iMakePoint3D; // Okay

    imeakePoint3D = iMakePoint2D; // ERROR: Point2D is not assignable to Point3D

    ```


    # Number of arguments


    Less arguments are okay (i.e. functions can choose to ignore additional args).
    After all you are guaranteed to be called with at least enough arguments.'
