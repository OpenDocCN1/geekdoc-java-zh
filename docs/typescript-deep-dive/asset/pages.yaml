  md: "This fact can be demonstrated by the code below which raises an error as you\
    \ would hope:\n\n```\ntype Adder = (a: number, b: number) => number;\nlet foo:\
    \ Adder = (a, b) => {\n  a = \"hello\"; // Error: cannot assign `string` to a\
    \ `number`\n  return a + b;\n}\n```\n\nThis is an example of types flowing from\
    \ left to right.\n\nThe same assignment style type inference works if you create\
    \ a function for a callback argument. After all an argument -> parameter is just\
    \ another form of variable assignment.\n\n```\ntype Adder = (a: number, b: number)\
    \ => number;\nfunction iTakeAdder(adder: Adder) {\n  return adder(1, 2);\n}\n\
    itakeAdder((a, b) => {\n  // a = \"hello\"; // Would Error: cannot assign `string`\
    \ to a `number`\n  return a + b;\n})\n```\n\n# # Structuring\n\nThese simple rules\
    \ also work in the presence of structuring (object literal creation). For example\
    \ in the following case type of foo is inferred to be {a:number, b:number}\n\n\
    ```\nlet foo = {\n  a: 123,\n  b: 456\n};\n// foo.a = \"hello\"; // Would Error:\
    \ cannot assign `string` to a `number`\n```\n\nSimilarly for arrays:\n\n```\n\
    const bar = [1,2,3];\n// bar[0] = \"hello\"; // Would error: cannot assign `string`\
    \ to a `number`\n```\n\nAnd of course any nesting:"
