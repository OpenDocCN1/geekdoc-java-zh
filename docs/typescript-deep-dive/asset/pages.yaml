  md: "In some cases you might need to create a temporary variable, but at least you\
    \ will not be making (possibly false) promises and instead relying on the type\
    \ inference to do the checking for you.\n\n# Double assertion\n\nThe type assertion\
    \ despite a bit unsafe as we've shown, is not *completely open season*. E.g. the\
    \ following is a very valid use case (e.g. the user thinks the event passed in\
    \ will be a more specific case of an event) and the type assertion works as expected:\n\
    \n```\nfunction handler(event: Event) {\n  let mouseEvent = event as MouseEvent;\n\
    }\n```\n\nHowever the following is most likely an error and TypeScript will complain\
    \ as shown despite the user's type assertion:\n\n```\nfunction handler(event:\
    \ Event) {\n  let element = event as HTMLElement; // Error: Neither 'Event' nor\
    \ type 'HTMLElementlemen\nt' is assignable to the other\n}\n```\n\nIf you still\
    \ want that Type, you can use a double assertion, but first asserting to any which\
    \ is compatible with all types and therefore the compiler no longer complains:\n\
    \n```\nfunction handler(event: Event) {\n  let element = event as any HTMLElement;\
    \ // Okay!\n}\n```\n\n# How typescript determines if a single assertion is not\
    \ enough\n\nBasically, the assertion from type s to \tau succeeds if s is a subtype\
    \ of \tau or t is a subtype of s. This is to provide extra safety when doing type\
    \ assertions ... completely wild assertions can be very unsafe and you need to\
    \ use any to be that unsafe."
