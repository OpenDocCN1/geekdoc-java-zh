  md: "# strictNullChecks\n\nBy default null and undefined are assignable to all types\
    \ in TypeScript e.g.\n\n```\nlet foo: number = 123;\nfoo = null; // Okay\nfoo\
    \ = undefined; // Okay\n```\n\nThis is modelled after a lot of people write JavaScript.\
    \ However like all things, TypeScript allows you to be explicit about what can\
    \ and cannot be assigned a null or undefined.\n\nIn strict null checking mode,\
    \ null and undefined are different:\n\n```\nlet foo = undefined;\nfoo = null;\
    \ // NOT Okay\n```\n\nLet say we have a Member interface:\n\n```\ninterface Member\
    \ {\nname: string;\nage?: number\n}\n```\n\nNot every Member will provide their\
    \ age, so age is an optional property, meaning the value of age may or not be\
    \ undefined.\n\nundefined is the root of all evil. It often leads to runtime errors.\
    \ It is easy to write code that will throw Error at runtime:\n\n```\ngetMember()\n\
    \  .then(member: Member) => {\n    const stringifyAge = member.age.toString()\
    \ // Cannot read property 'toString' of undefined\n  })\n```\n\nIn strict null\
    \ checking mode, this error will be caught at compile time:\n\n```\ngetMember()\n\
    \  .then(member: Member) => {\n    const stringifyAge = member.age.toString()\
    \ // Object is possibly 'undefined'\n  })\n```"
  merge: -1
  pgno: 234
- img_proc: true
  md: "# Non-Null Assertion Operator\n\nA new post-fix expression operator may be\
    \ used to assert that its operand is non-null and non-undefined in contexts where\
    \ the type checker is unable to conclude that fact. For example:\n\n```\n// Compiled\
    \ with --strictNullChecks\nfunction validateEntity(e?: Entity) {\n  // Throw exception\
    \ if e is null or invalid entity\n}\n\nfunction processEntity(e?: Entity) {\n\
    \  validateEntity(e);\n  let a = e.name; // TS ERROR: e may be null.\n  let b\
    \ = e!.name; // Assert that e is non-null. This allows you to access name\n}\n\
    ```\n\n> Note that it is just an assertion, and just like assertions you are responsible\
    \ for making sure the value is not null. A non-null assertion is essentially you\
    \ telling the compiler \"I know it's not null so let me use it as though it's\
    \ not null\"."
