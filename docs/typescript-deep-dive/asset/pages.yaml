  md: "# readonly\n\nTypeScript's type system allows you to mark individual properties\
    \ on an interface readonly . This allows you to work in a functional way (unexpected\
    \ mutation is bad):\n\n```\nfunction foo(config: {\n  readonly bar: number,\n\
    \  readonly bas: number\n}) {\n  //..\n}\nlet config = { bar: 123, bas: 123 };\n\
    foo(config);\n// You can be sure that `config` isn't changed\n```\n\nOf course\
    \ you can use readonly in interface type definitions as well e.g.:\n\n```\ntype\
    \ Foo = {\n  readonly bar: number;\n  readonly bas: number;\n}\n// Initialization\
    \ is okay\nlet foo: Foo = { bar: 123, bas: 456 };\n```\n\n// Mutation is not\n\
    foo.bar = 456; // Error: Left-hand side of assignment expression cannot be a\n\
    or a read-only property\n\nYou can even declare a class property as readonly .\
    \ You can initialize them at the point of\ndeclaration or in the constructor as\
    \ shown below:\n\n```\nclass Foo {\n  readonly bar = 1; // OK\n  readonly bas:\
    \ string;\n  constructor() {\n    this.baz = \"hello\"; // OK\n  }\n}\n```\n\n\
    # Readonly"
