  md: "# Binder\n\nMost JavaScript transpilers out there are simpler than TypeScript\
    \ because they provide little in the way of code analysis. The typical JavaScript\
    \ transpilers only have the following flow:\n\n```\nSourceCode --Scanner--> Tokens\
    \ --Parser--> AST ----> JavaScript\n```\n\nWhile the above architecture is true\
    \ as a simplified understand of TypeScript js generation, a key feature of TypeScript\
    \ is its Semantic system. To assist type checking (performed by checker ), the\
    \ binder ( in binder.ts ) is used to connect the various parts of the source code\
    \ into a coherent type system that can then be used by the checker . The main\
    \ responsibility of the binder is to create the Symbols.\n\n# Symbol\n\nSymbols\
    \ connects declaration nodes in the AST to other declarations contributing to\
    \ the same entity. Symbols are the basic building block of the Semantic system.\
    \ The symbol constructor is defined in core.ts (and binder actually uses the allocator.getSymbolConstructor)\
    \ to get its hands on it. Here is the constructor:\n\n```\nfunction Symbol(flags:\
    \ SymbolFlags, name: string) {\n    this.flags = flags;\n    this.name = name;\n\
    \    this.declarations = undefined;\n}\n```\n\nSymbolFlags is a flag enum and\
    \ is really used to identify additional classifications of the symbol (e.g the\
    \ scope of a variable flags FunctionScopedVariable or BlockScopedVariable or others)\n\
    \n# Usage by Checker\n\nThe binder is actually used internally by the type checker\
    \ which in turn is used by the program . The simplified call stack looks like:"
