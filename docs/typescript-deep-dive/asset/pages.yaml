  md: "Note that array destructuring is effectively the compiler doing [], [1], ...\
    \ and so on for you. There is no guarantee that these values will exist.\n\n#\
    \ Array Destructuring with rest\n\nYou can pick up any number of elements from\
    \ the array and get an array of the remaining elements using array destructuring\
    \ with rest.\n\n```\nvar [x, y, ...remaining] = [1, 2, 3, 4];\nconsole.log(x,\
    \ y, remaining); // 1, 2, [3,4]\n```\n\n# Array Destructures with ignores\n\n\
    You can ignore any index by simply leaving it empty i.e. , , in the left hand\
    \ side of the assignment. For example: \n\n```\nvar [x, , ...remaining] = [1,\
    \ 2, 3, 4];\nconsole.log(x, remaining); // 1, [3,4]\n```\n\n# JS Generation\n\n\
    The JavaScript generation for non ES6 targets simply involves creating temporary\
    \ variables, like you would have to do yourself without native language support\
    \ for destructuring e.g.\n\n```\nvar x = 1, y = 2;\n[x, y] = [y, x];\nconsole.log(x,\
    \ y); // 2, 1\n\n// becomes /\nvar x = 1, y = 2;\n_a = [y,x], x = _a[0], y = _a[1];\n\
    console.log(x, y);\nvar _a;\n```\n\n# Summary\n\nDestructuring can make your code\
    \ more readable and maintainable by reducing the line count and making the intent\
    \ clear. Array destructuring can allow you to use arrays as though they were tuples."
