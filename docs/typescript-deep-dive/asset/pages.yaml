    \ Name;\nname = {\n  first: 'John',\n  second: 'Doe'\n};\n\nname = { // Error:\
    \ `second` is missing\n  first: 'John'\n}\nname = { // Error: `second` is the\
    \ wrong type\n  first: 'John',\n  second: 1337\n};\n```\n\nHere we've composed\
    \ the annotations first: string + second: string into a new annotation Name that\
    \ enforces the type checks on individual members. Interfaces have a lot of power\
    \ in TypeScript and we will dedicate an entire section to how you can use that\
    \ to your advantage.\n\n# Inline Type Annotation\n\nInstead of creating a new\
    \ interface you can annotate anything you want inline using: { /*Structure*/ }.\
