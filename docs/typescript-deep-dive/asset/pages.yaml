  md: '# JSX Support


    TypeScript supports JSX transpilation and code analysis. If you are unfamiliar
    with JSX here is an excerpt from the [official website](https://react.dev):


    > JSX is a XML-like syntax extension to ECMAScript without any defined semantics.
    It''s NOT intended to be implemented by engines or browsers. It''s NOT a proposal
    to incorporate JSX into the ECMAScript spec itself. It''s intended to be used
    by various preprocessors (transpilers) to transform these tokens into standard
    ECMAScript.


    The motivation behind JSX is to allow users to write HTML views like *JavaScript*
    so that you can:


    +   Have the view Type Checked by the same code that is going to check your JavaScript


    +   Have the view Checked by the same code that is going to operate under (i.e.
    strengthen the controller-view connection in traditional MVC).


    +   Reuse Javascript patterns for HTML mainintance e.g. `Array.prototype.map,
    ?, switch` etc instead of creating new (and poorly typed) alternatives.


    This decreases the chances of errors and increases the maintainability of your
    user interfaces. The main consumer of JSX at this point is [ReactJS from facebook](https://react.dev).
    This is the usage of JSX that we will discuss here.'
  merge: -1
