  md: "# Const Enums\n\nIf you have an enum definition like the following:\n\n```\n\
    enum Tristate {\n  False,\n  True,\n  Unknown\n}\n```\n\n```\nvar lie = Tristate.False;\n\
    ```\n\nThe line var lie = Tristate.False is then compiled to the JavaScript var\
    \ lie = Tristate.False (output, output is same as input). This means at execution\
    \ the runtime will need to lookup Tristate and then Tristate.False . To get a\
    \ performance boost here you can mark the enum as a const enum . This is demonstrated\
    \ below:\n\n```\nconst enum Tristate {\n  False,\n  True,\n  Unknown\n}\n```\n\
    \n```\nvar lie = Tristate.False;\n```\n\ngenerates the JavaScript:\n\n```\nvar\
    \ lie = 0;\n```\n\ni.e. the compiler:\n\n+   1. Inlines and any usages of the\
    \ enum ( 0 instead of Tristate.False ).\n2. Does not generate any JavaScript for\
    \ the enum definition (there is no Tristate variable at runtime) as its usages\
    \ are inlined.\n\n# Const enum preserveConstEnums\n\nInlining has obvious performance\
    \ benefits. The fact that there is no Tristate variable at runtime is simply the\
    \ compiler helping you out by not generating JavaScript that is not actually used\
    \ at runtime. However you might want the compiler to still generate the JavaScript\
    \ version of the enum definition for stuff like number to string or string to\
    \ number lookups as we saw. In this case you can use the compiler flag --preserveConstEnums\
    \ and it will generate the var Tristate definition so that you can use Tristate[\"\
    False\"] or Tristate[0] manually if you want. This does not impact inlining in\
    \ any way."
