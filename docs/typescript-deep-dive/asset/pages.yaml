  md: "# Exception Handling\n\nJavaScript has an Error class that you can use for\
    \ exceptions. You throw an error with the throw keyword. You can catch it with\
    \ a try / catch block pair e.g.\n\n```\ntry {\n  throw new Error('Something bad\
    \ happened');\n}\ncatch(e) {\n  console.log(e);\n}\n```\n\n# Error Sub Types\n\
    \nBeyond the built in Error class there are a few additional built-in error classes\
    \ that inherit from Error that the JavaScript runtime can throw:\n\n# RangeError\n\
    \nCreates an instance representing an error that occurs when a numeric variable\
    \ or parameter is outside of its valid range.\n\n```\n// Call console with too\
    \ many arguments\nconsole.log.apply(console, new Array(1000000000)); // RangeError:\
    \ Invalid array length\n```\n\n# ReferenceError\n\nCreates an instance representing\
    \ an error that occurs when de-referencing an invalid reference. e.g.\n\n```\n\
    'use strict';\nconsole.log(notValidVar); // ReferenceError: notValidVar is not\
    \ defined\n```\n\n# SyntaxError\n\nCreates an instance representing a syntax error\
    \ that occurs while parsing code that isn't valid JavaScript."
  merge: -1
  pgno: 215
- img_proc: true
  md: "```\n***3; // SyntaxError: Unexpected token *\n```\n\n# TypeError\n\nCreates\
    \ an instance representing an error that occurs when a variable or parameter is\
    \ not of a valid type.\n\n```\n('1.2').toPrecision(1); // TypeError: '1.2'.toPrecision\
    \ is not a function\n```\n\n# URIError\n\nCreates an instance representing an\
    \ error that occurs when encodeURI() or decodeURI() are passed invalid parameters.\n\
    \n```\ndecodeURI('%'); // URIError: URI malformed\n```\n\n# Always use Error\n\
    \nBeginner JavaScript developers sometimes just throw raw strings e.g.\n\n```\n\
    try {\n  throw 'Something bad happened';\n}\ncatch(e) {\n  console.log(e);\n}\n\
    ```\n\nDon't do that. The fundamental benefit of Error objects is that they automatically\
    \ keep track of where they were built and originated as the stack property.\n\n\
    Raw strings result in a very painful debugging experience and complicate error\
    \ analysis from logs.\n\n# You don't have to throw an error\n\nIt is okay to pass\
    \ an Error object around. This is conventional in Node.js callback style code\
