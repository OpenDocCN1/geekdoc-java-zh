  md: "Setting the compiler target to es6 causes the lib.ts to include additional\
    \ ambient declarations for more modern (es6) stuff like Promise . This magical\
    \ effect of the compiler changing the ambience of the code is desirable for some\
    \ people and for others's problematic as it conflates code generation with code\
    \ ambience.\n\nHowever if you want grained control of your environment you should\
    \ use the --lib option which we discuss next.\n\n# lib option\n\nSometimes (many\
    \ times) you want to decouple the relationship between the compile target (the\
    \ generated JavaScript version) and the ambient library support. A common example\
    \ is Promise , e.g. today (in June 2016) you most likely want to --target es5\
    \ but still use latest stuff like Promise . To support this you can take explicit\
    \ control of lib using the lib compiler optimizer.\n\n> Note: using --lib decouples\
    \ any lib magic from --target giving you better control.\n\nYou can provide this\
    \ option on the command line or in tsconfig.json (recommended):\n\n# Command line:\n\
    \n```\ntsc --target es5 --lib dom,es6\n```\n\n# tsconfig.json:\n\n```\n\"compilerOptions\"\
    : {\n  \"lib\": [\"dom\", \"es6\"]\n}\n```\n\nThe libs can be categorized into\
    \ categories:\n\n+   * JavaScript Bulk Feature:\n    * es5\n    * es6\n    * es2015\n\
    \    * es7\n    * es2016\n    * es2017\n    * esnext\n* Runtime Environment\n\
    \    * dom\n    * dom.iterable"
  merge: -1
