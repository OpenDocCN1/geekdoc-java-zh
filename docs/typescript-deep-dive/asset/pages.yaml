  md: "We have seen trivial doing a sequence of async tasks is with promises. It is\
    \ simply a matter of chaining calls.\n\nHowever you might potentially want to\
    \ run a series of async tasks and then do something with the results of all these\
    \ tasks. Promise provides a static Promise.all function that you can write for\
    \ n number of promises to complete. You provide it with an array of n promises\
    \ and it gives you an array of resolved values. Below we show Chaining as well\
    \ as Parallel:\n\n```\n// any async function to simulate loading an item from\
    \ some server\nfunction loadItem(id: number): Promise<void> {\n  return new Promise((resolve)\
    \ => {\n    console.log('loading item', id);\n    setTimeout(() => { // simulate\
    \ a server delay\n      resolve({ id: id });\n    }, 1000);\n  });\n}\n\n// Chaining\n\
    let item1, item2;\nloadItem(1)\n  .then((res) => {\n    item1 = res;\n    return\
    \ loadItem(2);\n  })\n  .then((res) => {\n    item2 = res;\n    console.log('done');\n\
    \  }); // overall time will be around 2s\n\n// Parallel\nPromise.all([loadItem(1),\
    \ loadItem(2)])\n  .then((res) => {\n    [item1, item2] = res;\n    console.log('done');\n\
    \  }); // overall time will be around 1s\n```\n\nSometimes, you want to run a\
    \ series of async tasks, but then you get all you need as long as any one of these\
    \ tasks is settled. Promise.race provides a function for this scenario:"
