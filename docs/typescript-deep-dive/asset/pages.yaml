  md: "# Convenience vs. Soundness\n\nThere are a few things TypeScript prevents you\
    \ from doing out of the box e.g using a variable that *isn't ever declared* (of\
    \ course you can use a *declaration file* for external systems).\n\nThat said,\
    \ traditionally programming languages have a hard boundary between what is and\
    \ not allowed by the type system. TypeScript is different in that it gives you\
    \ control on where you put the slider. This is really to allow you to use the\
    \ JavaScript you know and love with as much safety as **you** want. There are\
    \ lot of compiler options to control exactly this slider so there's a look.\n\n\
    # Boolean Options\n\n`compilerOptions` that are `boolean` can be specified as\
    \ `compilerOptions` in `tsconfig.json` :\n\n```\n{\n  \"compilerOptions\": {\n\
    \    \"someBooleanOption\": true\n  }\n}\n```\n\nor on the command line\n\n```\n\
    tsc --someBooleanOption\n```\n\n> > All of these are `false` by default.\n\nClick\
    \ [here] to see all compiler options."
  merge: -1
