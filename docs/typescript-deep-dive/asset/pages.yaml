  md: "# Type Instantiation for Generics\n\nSay you have something that has a generic\
    \ parameter e.g. a class Foo :\n\n```\nclass Foo<T>{\n  foo: T;\n}\n```\n\nYou\
    \ want to create a specialized version for it for a particular type. The pattern\
    \ is to copy the item into a new variable and give the type annotation with the\
    \ generics replaced with concrete types. E g if you want a class Foo<number> :\n\
    \n```\nclass Foo<T>{\n  foo: T;\n}\n FooNumber = Foo as { new ():Foo<number> };\
    \ // ref 1\n```\n\nIn ref 1 you are saying FooNumber is the same as Foo but just\
    \ treat it as something that when called with the new operator gives an instance\
    \ of Foo<Number>.\n\n# Inheritance\n\nThe Type assertion pattern is unsafe in\
    \ that it trusts you to do the right thing. A common pattern in other languages\
    \ for classes is to use inheritance :\n\n```\nclass FooNumber extends Foo<number>{}\n\
    ```\n\nOne word of caution here: if you use decorators on the base class then\
    \ the inherited class might not have the same behavior as the base class (it is\
    \ no longer wrapped by the decorator).\n\nOf course if you are not specializing\
    \ classes you still have to come up with a coercion / assertion pattern that which\
    \ hence we showed the general assertion first, e.g.:\n\n```\nfunction id<T>(x:\
    \ T) { return x; }\nconst idNum = id as {(x:number):number};\n```\n\n> Inspired\
    \ by this stackoverflow question"
