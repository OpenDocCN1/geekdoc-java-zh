  md: "```\nfunction logIfHasName(something: { name?: string }) {\n  if (something)\
    \ {\n    console.log(something);\n  }\n}\nvar person = { name: 'matt', job: 'being\
    \ awesome' };\nvar animal = { name: 'cow', diet: 'vegan', but has milk of own\
    \ species' };\n```\n\n```\nlogIfHasName(person); // okay\nlogIfHasName(animal);\
    \ // okay\nlogIfHasName({name: 'I just misspelled name to name'}); // Error: object\
    \ literals must\nonly specify known properties. nume is excessive here.\n```\n\
    \nThe reason why only object literals are checked this way is because in this\
    \ case additional properties that *aren't actually used* is almost always a typo\
    \ or a misunderstanding of the API.\n\n# Allowing extra properties\n\nA type can\
    \ include an index signature to explicitly indicate that excess properties are\
