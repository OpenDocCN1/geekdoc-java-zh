    \ {\n  first: string;\n  second: string;\n}\n\nname = {\n  first: 'John',\n  second:\
    \ 'Doe'\n}\n\nname = { // Error: `second` is missing\n  first: 'John'\n}\nname\
    \ = { // Error: `second` is the wrong type\n  first: 'John',\n  second: 1337\n\
    };\n```"
