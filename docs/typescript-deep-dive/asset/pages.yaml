  md: '# @types


    Definitely Typed is one of TypeScript greatest strengths. The community has effectively
    gone ahead and documented the nature of nearly 90% of the top JavaScript projects
    out there.


    This means that you can use these projects in a very interactive and exploratory
    manner, no need to have the docs open in a seperateate window and making sure
    you don''t make a typo.


    # Using @types


    Installation is fairly simple as it just works on top of npm . So as an example
    you can install type definitions for jquery simply as:


    ```

    npm install @types/jquery --save-dev

    ```


    @types supports both global and module type definitions.


    # Global @types


    By default any definitions that support global consumption are included automatically.
    E.g. for jquery you should be able to start using $ globally in your project.


    However for libraries (like jquery ) I generally recommend using modules:


    # Module @types


    After installation, no special configuration is required really. You just use
    it like a module e.g.:


    ```

    import * as s from "jquery";n// Use $ at will in this module :)

    ```


    # Controlling Globals


    As can be seen a definition that supports global leak in automatically can be
    a problem for some team so you chose to explicitly only bring in the types that
    make sense using the tsconfig.json compilerOptions.types e.g.:'
