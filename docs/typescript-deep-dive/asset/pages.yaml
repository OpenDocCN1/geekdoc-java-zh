    +   - Covariant (corporate) only in same direction

    - Contravariant (contra ak negative) only in opposite direction

    - Bivariant (bi aka both) co and contra.

    - Invariant: if the types aren''t exact then they are incompatible.


    > Note: For a completely subtle system type in the presence of mutable data JavaScript,
