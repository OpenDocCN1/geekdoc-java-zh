  md: '# Template Strings


    Syntactically these strings are that use backticks (i.e. `) instead of single
    ('''') or double ("") quotes. The motivation of Template Strings is three fold:


    +   * String Interpolation

    * Multiline Strings

    * Tagged Templates


    # String Interpolation


    Another common use case is when you want to generate some string out of some static
    strings + some variables. For this you would need some *templating logic* and
    this is where *template strings* get their name from. Here''s how you would potentially
    generate an html string previously:


    ```

    var lyrics = ''Never gonna give you up'';

    var html = `<div>` + lyrics + `</div>`;

    ```


    Now with template strings you can just do:


    ```

    var lyrics = ''Never gonna give you up'';

    var html = `<div>${lyrics}</div>`;

    ```


    Note that each placeholder inside the interpolation ($ { and } ) is treated as
    a JavaScript expression and evaluated as e.g. you can do fancy math.


    ```

    console.log(`1 and 1 make ${1 + 1}`);

    ```


    # Multiline Strings


    Ever wanted to put a newline in a JavaScript string? Perhaps you wanted to embed
    some lyrics? You would have needed to *escape the literal newline* using our favorite
    escape character \ , and then put a new line into the string manually \n at the
    next line. This is shown below:


    ```

    var lyrics = "Never gonna give you up\nNever gonna let you down";

    ```


    With TypeScript you can just use a template string:'
  merge: -1
  pgno: 62
- img_proc: true
  md: "```\nlyrics = `Never gonna give you up\nNever gonna let you down`;\n```\n\n\
    # Tagged Templates\n\nYou can place a function (called a tag ) before the template\
    \ string and it gets the opportunity to pre process the template string literals\
    \ the values of all the placeholder expressions and return a result. A few notes:\n\
    \n+   - All the static literals are passed in an array for the first argument.\n\
    - All the values of the placeholders expressions are passed in the remaining arguments.\
    \ Most commonly you would just use rest parameters to convert these into an array\
    \ as well.\n\nHere is an example where we have a tag function (named htmlEscape\
    \ ) escapes the html from all the placeholders:\n\n```\nvar say = \"a bird in\
    \ hand > two in the bush\";\nvar html = htmlEscape `<div> I would like to say\
    \ : ${say}</div>`;\n\n// a sample tag function\nfunction htmlEscape(literals,\
    \ ...placeholders) {\n  let result = \"\";\n\n  // interleave the literals with\
    \ the placeholders\n  for (let i = 0; i < placeholders.length; i++) {\n    result\
    \ += literals[i];\n    result += placeholders[i]\n      .replace(/&/g, '&amp;')\n\
    \      .replace(/\"/g, '&quot;')\n      .replace(/'/g, '&#39;')\n      .replace(/</g,\
    \ '&lt;')\n      .replace(/>/g, '&gt;');\n  }\n\n  // add the last literal\n \
    \ result += literals[literals.length - 1];\n  return result;\n}\n```\n\n# Generated\
    \ JS\n\nFor pre ES6 compile targets the code is fairly simple. Multiline strings\
    \ become escaped strings. String interpolation becomes string concatenation. Tagged\
    \ Templates become function calls."
