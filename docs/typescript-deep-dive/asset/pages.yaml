  md: 'Let''s look at creating a promise. It''s a simple matter of calling new on
    Promise (the promise constructor). The promise constructor is passed resolve and
    reject functions for settling the promise state:


    ```

    const promise = new Promise((resolve, reject)) => {

    // the resolve / reject functions control the fate of the promise

    };

    ```


    # Subscribing to the fate of the promise


    The promise fate can be subscribed to using .then (if resolved) or .catch (if
    rejected).


    ```

    const promise = new Promise((resolve, reject)) => {

    resolve(123);

    });nprom.then((res) => {

    console.log(''I get called:'', res === 123); // I get called: true

    });npromise.catch((err) => {

    // This is never called

    });

    ```


    ```

    const promise = new Promise((resolve, reject)) => {

    reject(new Error("Something awful happened"));

    };

    prom.then((res) => {

    // This is never called

    });n.catch((err) => {

    console.log(''I get called:'', err.message); // I get called: ''Something awful
    happe

    });

    ```


    TIP: Promise Shortcuts


    +   - Quickly creating an already resolved promise: Promise.resolve(result)

    - Quickly creating an already rejected promise: Promise.reject(error)


    # Chain-ability of Promises


    The chain-ability of promises is the heart of the benefit that promises provide.
    Once you have a promise, from that point on, you use the then function to create
    a chain of promises.


    +   - If you return a promise from any function in the chain, .then is only called
    once the'
