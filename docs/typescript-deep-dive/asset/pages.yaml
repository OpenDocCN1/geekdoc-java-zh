  md: "# TypeScript Type System\n\nWe covered the main features of the TypeScript\
    \ Type System back when we discussed Why TypeScript?. The following are a few\
    \ key takeaways from that discussion which don't need further explanation:\n\n\
    +   - The TypeScript type in system is designed to be *optional* so that your\
    \ javascript typescript.\n- TypeScript does not block *JavaScript* emit in the\
    \ presence of Type Errors, allowing you to *progressively update* your JS to TS.\n\
    \nNow let's start with the syntax of the TypeScript type system. This way you\
    \ can start using these annotations in your code immediately and see the benefit.\
    \ This will prepare you for a deeper dive later.\n\n# Basic Annotations\n\nAs\
    \ mentioned before Types are annotated using `:TypeAnnotation` syntax. Anything\
    \ that is available in the type declaration space can be used as a Type Annotation.\n\
    \nThe following example demonstrates type annotations can be used for variables,\
    \ function parameters and function return values:\n\n```\nvar num: number = 123;\n\
    function identity(num: number): number {\n  return num;\n}\n```\n\n# Primitive\
    \ Types\n\nThe JavaScript primitive types are well represented in the TypeScript\
    \ type system. This means `string`, `number`, `boolean` as demonstrated below:"
  merge: -1
