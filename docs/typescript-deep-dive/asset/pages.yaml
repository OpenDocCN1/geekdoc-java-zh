  md: "```\nOverloads\nfunction padding(all: number);\nfunction padding(topBottom:\
    \ number, leftRight: number);\nfunction padding(top: number, right: number, bottom:\
    \ number, left: number);\n// Actual implementation that is a true representation\
    \ of all the cases the function b\nneeds to handle\nfunction padding(a: number,\
    \ b?: number, c?: number, d?: number) {\n  if (b === undefined && c === undefined\
    \ && d === undefined) {\n    b = c = d = a;\n  } else if (c === undefined && d\
    \ === undefined) {\n    c = a;\n    d = b;\n  }\n  return {\n    top: a,\n   \
    \ right: b,\n    bottom: c,\n    left: d\n  };\n}\n```\n\nHere the first three\
    \ function signatures are what is available as valid calls to padding:\n\n```\n\
    padding(1); // Okay: all\npadding(1,1); // Okay: paddingTop, leftAndRight\npadding(1,1,1);\
