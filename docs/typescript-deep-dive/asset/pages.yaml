  md: 'Sometimes you might want to add an explicit annotation on something (e.g. jQuery
    ) and you need something in type declaration space. You can do that quite easily
    using the type keyword:


    ```

    declare type JQuery = any;

    declare var $: jQuery;

    ```


    This provides you an easier update path.


    Again, a high quality jquery.d.ts exists at DefinitelyTyped. But now you now know
    how to overcome any JavaScript -> TypeScript friction quickly when using third
    party JavaScript. We will look at ambient declarations in detail next.


    # Third Party NPM modules


    Similar to global variable declaration you can declare a global module quite easily.
    E.g. for jquery if you want to use it as a module (https://www.npmjs.com/package/jquery)
    you can write the following yourself:


    ```

    declare module "jquery";

    ```


    And then you can import it in your file as needed:


    ```

    import * as $ from "jquery";

    ```


    > Again, a high quality jquery.d.ts exists at DefinitelyTyped that provides a
    much higher quality jquery module declaration. But it might not exist for your
    library, so now you have a quick low friction way of continuing the migration


    # External non js resources


    You can even import of any file e.g. .css files (if you are using something webpack
    style loaders or css modules) with a simple style declaration (ideally in a globals.d.ts
    file):


    ```

    declare module "*.css";

    ```


    Now people can import * as foo from "./some/file.css";'
