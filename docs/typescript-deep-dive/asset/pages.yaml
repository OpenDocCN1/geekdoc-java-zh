  md: '```

    foo = 123;

    foo = ''456''; // Error: cannot assign `string` to `number`


    // Is foo a number or a string?

    ```


    This type inference is well motivated. If you do stuff like shown in this example,
    then, in the rest of your code, you cannot be certain that foo is a number or
    a string . Such issues turn up often in large multi-file code bases. We will deep
    dive into the type inference rules later.


    # Types can be Explicit


    As weve mentioned before, TypeScript will infer as much as it can safely, however
    you can use annotations to:


    +   1. Help along the compiler, and more importantly document stuff for the next
    developer who has read your code (that might be future you!).

    2. Enforce what that the compiler sees, is what you thought it should see. That
    is your understanding of the code matches an algorithmic analysis of the code
    (done by the compiler).


    TypeScript uses postfix type annotations popular in other optionally annotated
    languages (e.g. ActionScript and F#).


    ```

    var foo: number = 123;

    ```


    So if you do something wrong the compiler will error e.g.:


    ```

    var foo: number = ''123''; // Error: cannot assign `string` to a `number`

    ```


    We will discuss all the details of all the annotation syntax supported by TypeScript
    in a later chapter.


    # Types are structural


    In some languages (specifically nominally typed ones) static typing results in
    unnecessary ceremony because even though you know that the code will work fine
    the language semantics force you to copy stuff around. This is why like automapper
    for C# is vital for C#. In TypeScript because we really want it to be easy for
    JavaScript developers with a'
