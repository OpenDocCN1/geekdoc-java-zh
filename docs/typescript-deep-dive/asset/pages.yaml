  md: '# Object spread


    You can also spread an object into another. A common use case is to simply add
    a property to an object without mutating the original:


    ```

    const point2D = {x: 1, y: 2};

    /** Create a new object by using all the point2D props along with z */

    const point3D = {...point2D, z: 3};

    ```


    Another common case is a simple shallow extend:


    ```

    const foo = {a: 1, b: 2};

    const bar = {c: 1, d: 2};

    /** Merge foo and bar */

    const fooBar = {...foo, ...bar};

    ```


    # Summary


    apply is something that you would inevitably do in JavaScript, so it''s good to
    have a better syntax where you don''t have to that ugly null for the this argument.
    Also having a dedicated syntax for moving arrays out of (destructuring) or into
    (assignment) other arrays provides neat syntax for when you are array processing
    on partial arrays.'
