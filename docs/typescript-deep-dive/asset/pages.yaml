  md: "```\nnamespace Utility {\n  export function log(msg) {\n    console.log(msg);\n\
    \  }\n  export function error(msg) {\n    console.error(msg);\n  }\n}\n\n// usage\n\
    Utility.log('Call me');\nUtility.error('maybebe!');\n```\n\nThe `namespace` keyword\
    \ generates the same JavaScript that we saw earlier:\n\n```\n(function (Utility)\
    \ {\n  // Add stuff to Utility\n})(Utility || (Utility = {}));\n```\n\nOne thing\
    \ to note is that namespaces can be nested so you can do stuff like `Utility.Messaging`\
    \ to nest a `Messaging` namespace under `Utility`.\n\nFor most projects we recommend\
    \ using external modules and using `namespace` for quick demos and porting old\
    \ JavaScript code."
