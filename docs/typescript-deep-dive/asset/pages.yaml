  md: '# Migrating From JavaScript


    Assuming:


    +   - you know JavaScript.

    - you know patterns and build tools (e.g. webpack) used in the project.


    With that assumption out of the way, in the general process consists of the following
    steps:


    +   - Add a tsconfig.json.

    - Change your source code file extensions from .js to .ts. Start suppressing errors
    using any.

    - Write new code in TypeScript and make as little use of any as possible.

    - Go back to the old code and start adding type annotations and fix identified
    bugs.

    - Use ambient definitions for third party JavaScript code.


    Let us discuss a few of these points further.


    Note that all JavaScript is valid TypeScript. That is to say if you give the TypeScript
    compiler some JavaScript -> the JavaScript emitted by the TypeScript compiler
    will behave exactly as the original JavaScript. This means that changing the extension
    from .js to .ts will not adversely affect your codebase.


    # Suppressing Errors


    TypeScript will immediately start TypeChecking your code and your original JavaScript
    code might not be as neat as you thought it and hence you get diagnostic errors.
    Many of these errors you can suppress with any e.g.:


    ```

    var foo = 123;

    var bar = ''hey'';


    bar = foo; // ERROR: cannot assign a number to a string

    ```


    Even though the error is valid and in most cases the inferred information will
    be better than what the original authors of different portions of the code bases
    imagined), your focus will probably be writing new code in TypeScript while progressively
    updating the the old code base. Here you can suppress this error with a type assertion
    as shown below:'
  merge: -1
  pgno: 126
- img_proc: true
  md: "```\nvar foo = 123;\nvar bar = 'hey';\n\nbar = foo as any; // Okay!\n```\n\n\
    In other places you might want to annotate something as any e.g.:\n\n```\nfunction\
    \ foo() {\n  return 1;\n}\nvar bar = 'hey';\nbar = foo(); // ERROR: cannot assign\
    \ a number to a string\n```\n\nSuppressed:\n\n```\nfunction foo() { // Added `any`\n\
    \  return 1;\n}\nvar bar = 'hey';\nbar = foo(); // Okay!\n```\n\n> Note: Suppressing\
    \ errors is dangerous, but it allows you to take notice of errors in your new\
    \ TypeScript code. You might want to leave // TODO: comments as you go along.\n\
    \n# Third Party JavaScript\n\nYou can change your JavaScript to TypeScript, but\
    \ you can't change the whole world to use TypeScript. This is where TypeScript's\
    \ ambient definition support comes in. In the beginning we recommend you create\
    \ a vendor.d.ts (the .d.ts extension specifies the fact that this is a declaration\
    \ file) and start adding stuff to it. Alternatively create a specific file for\
    \ the library e.g. query.d.ts for jquery.\n\n> Note: Well maintained and strongly\
    \ typed definitions for nearly the top 90% JavaScript libraries out there exists\
    \ in an OSS Repository called DefinitelyTyped. We recommend looking there before\
    \ creating your own as we present here. Nevertheless this quick and dirty way\
    \ is vital knowledge to decrease your initial friction with TypeScript**.\n\n\
    Consider the case of jquery , you can create a trivial definition for it quite\
    \ easily:\n\n```\ndeclare var $: any;\n```"
