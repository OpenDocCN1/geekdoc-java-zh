  md: '# Number


    Whenever you are handling numbers in any programming language you need to be aware
    of the idiosyncrasies of how the language handles numbers. Here are few critical
    pieces of information about numbers in JavaScript that you should be aware of.


    # Core Type


    JavaScript has only one number type. It is a double-precision 64-bit Number .
    Below we discuss its limitations along with a recommended solution.


    # Decimal


    For those familiar with doubles / float in other languages, you would know that
    binary floating points do not map correctly to Decimal numbers. A trivial (and
    famous) example with JavaScript''s built in numbers is shown below:


    ```

    console.log(.1 + .2); // 0.30000000000000004

    ```


    > For true decimal math use big.js mentioned below.


    # Integer


    The integer limits represented by the built in number type are Number.MAX_SAFE_INTEGER
    and Number.MIN_SAFE_INTEGER .


    ```

    console.log({max: Number.MAX_SAFE_INTEGER, min: Number.MIN_SAFE_INTEGER}); //
    {max: 900719254740991, min: -900719254740991}

    ```


    Safe in this context refers to the fact that the value cannot be the result of
    a rounding error.


    The unsafe values are +1 / -1 away from these safe values and any amount of addition
    / subtraction will round the result.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '```

    console.log(Number.MAX_SAFE_INTEGER + 1 === Number.MAX_SAFE_INTEGER + 2); // true!

    console.log(Number.MIN_SAFE_INTEGER - 1 === Number.MIN_SAFE_INTEGER - 2); // true!

    ```


    ```

    console.log(Number.MAX_SAFE_INTEGER); // 000799254740991

    console.log(Number.MAX_SAFE_INTEGER + 1); // 000799254740992 - Correct

    console.log(Number.MAX_SAFE_INTEGER + 2); // 000799254740992 - Rounded!

    console.log(Number.MAX_SAFE_INTEGER + 3); // 000799254740994 - Rounded correct
    by luck

    console.log(Number.MAX_SAFE_INTEGER + 4); // 000799254740996 - Rounded!

    ```


    To check safety you can use ES6 Number.isSafeInteger :


    ```

    // Safe value

    console.log(Number.isSafeInteger(Number.MAX_SAFE_INTEGER)); // true


    // Unsafe value

    console.log(Number.isSafeInteger(Number.MAX_SAFE_INTEGER + 1)); // false


    // Because it might have been rounded out due to overflow

    console.log(Number.isSafeInteger(Number.MAX_SAFE_INTEGER + 10)); // false

    ```


    > For arbitrary precision integer math use big.js mentioned below.


    # big.js


    Whenever you use math for financial calculations (e.g. GST calculation, money
    with cents addition etc) use a library like big.js which is designed for


    +   - Perfect decimal math.

    - Safe out of bound integer values


    Installation is simple:


    ```

    npm install big.js @types/big.js

    ```


    Quick Usage example:


    ```

    import { Big } from ''big.js'';


    export const foo = new Big(''111.11111111111111111111'');

    export const bar = foo.plus(new Big(''0.000000000000000000001''));


    // To get a number:

    const x: number = Number(bar.toString()); // Looses the precision

    ```'
