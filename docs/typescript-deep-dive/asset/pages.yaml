  md: "+   * Arrow Functions\n\n+   * Arrow Function Need\n* Tip: Arrow Function Danger\n\
    * Tip: Libraries that use this\n* Tip: Arrow Function inheritance\n* Tip: Quick\
    \ object return\n\n# # Arrow Functions\n\nLovingly called the fat arrow (because\
