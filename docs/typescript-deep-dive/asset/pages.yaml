  md: "Do not use this library for math used for UI /performance intensive purposes\
    \ e.g charts, canvas drawing etc.\n\n# NaN\n\nWhen number calculation is not representable\
    \ by a valid number, JavaScript returns a special `NaN` value. A classic example\
    \ is imaginary numbers:\n\n```\nconsole.log(Math.sqrt(-1)); // NaN\n```\n\nNote:\
    \ Equality checks **don't** work on `NaN` values. Instead use `Number.isNaN` instead:\n\
    \n```\n// Don't do this\nconsole.log(NaN === NaN); // false!!\n\n Do this\nconsole.log(Number.isNaN(NaN));\
    \ // true\n```\n\n# Infinity\n\nThe outer bounds of representable in Number are\
    \ available as static `Number.MAX_VALUE` and `-Number.MAX_VALUE` values.\n\n```\n\
    console.log(Number.MAX_VALUE); // 1.797693134863157e+308\nconsole.log(-Number.MAX_VALUE);\
    \ // -1.797693134863157e+308\n```\n\nValues outside the range precision isn't\
    \ clamped to these limits e.g.\n\n```\nconsole.log(Number.MAX_VALUE + 1 == Number.MAX_VALUE);\
    \ // true!\nconsole.log(-Number.MAX_VALUE - 1 == -Number.MAX_VALUE); // true!\n\
    ```\n\nValues outside the range where precision is resolved to special values\
    \ `Infinity` / `-Infinity` e.g.\n\n```\nconsole.log(Number.MAX_VALUE + 10**1000);\
    \ // Infinity\nconsole.log(-Number.MAX_VALUE - 10**1000); // -Infinity\n```\n\n\
    Off-course, these infinity values also show up with arithmetic that requires it\
    \ e.g.\n\n```\nconsole.log(1 / 0); // Infinity\nconsole.log(-1 / 0); // -Infinity\n\
    ```"
