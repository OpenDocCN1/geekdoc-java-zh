  md: "# Revisiting our JSON example\n\nNow let us revisit our loadJSON example and\
    \ rewrite an async version that uses promises. All that we need to do is read\
    \ the file contents as a promise, then parse them as JSON and we are done. This\
    \ is illustrated in the below example:\n\n```\nfunction loadJSONAsync(filename:\
    \ string): Promise<any> {\n  return readFileSync(filename) // Use the function\
    \ we just wrote\n  .then(function (res) {\n    return JSON.parse(res);\n  });\n\
    }\n```\n\nUsage (notice how similar it is to the original sync version introduced\
    \ at the start of this section):\n\n```\n// good file\nloadJSONAsync('good.json')\n\
    \  .then(function (val) { console.log(val); })\n  .catch(function (err) {\n  \
    \  console.log('good.json error', err.message); // never called\n  })\n\n// non-existent\
    \ json file\n.then(function () {\n  return loadJSONAsync('absent.json');\n})\n\
    \  .then(function (val) { console.log(val); }) // never called\n  .catch(function\
    \ (err) {\n    console.log('absent.json error', err.message);\n  })\n\n// invalid\
    \ json file\n.then(function () {\n  return loadJSONAsync('invalid.json');\n})\n\
    \  .then(function (val) { console.log(val); }) // never called\n  .catch(function\
    \ (err) {\n    console.log('bad.json error', err.message);\n  });\n```\n\nThe\
    \ reason why this function was simpler is because the loadFile (async) + JSON.parse\
    \ (sync) = catch consolidation was done by the promise chain. Also the callback\
    \ was not called by us but by the promise chain so we didn't have the chance of\
    \ making the mistake of wrapping it in a try/catch.\n\n# Parallel control flow"
