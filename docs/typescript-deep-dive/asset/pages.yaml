  md: "Quite commonly you get an error Type string is not assignable to type \"foo\"\
    . The following example demonstrates this.\n\n```\nfunction iTakeFoo(foo: 'foo')\
    \ {\n  const test = {\n    someProp: 'foo'\n  };\n  iTakeFoo(test.someProp); //\
    \ Error: Argument of type string is not assignable to parame nter of type 'foo'\n\
    ```\n\nThis is because test is inferred to be of type {someProp: string}. The\
    \ fix here is use a simple type assertion to tell TypeScript the literal you want\
    \ it to infer as shown below:\n\n```\nfunction iTakeFoo(foo: 'foo') {\n  const\
    \ test = {\n    someProp: 'foo' as 'foo'\n  };\n  iTakeFoo(test.someProp); //\
    \ Okay!\n```\n\n# Use cases\n\nValid use cases for string literal types are:\n\
    \n# String based enums\n\nTypeScript enums are number based. You can use string\
    \ literals with union types to mock a string based enum as we did in the CardinalDirection\
    \ example above. You can even generate a Key:Value structure using the following\
    \ function:\n\n```\n/** Utility function to create a K:V from a list of strings\
    \ */\nfunction strEnum<T extends string>(o: Array<T>): {[K in T]: K} {\n  return\
    \ o.reduce((res, key) => {\n    res[key] = key;\n    return res;\n  }, Object.create(null));\n\
    }\n```\n\nAnd then generate the literal type union using keyof typeof . Here is\
    \ a complete example:"
