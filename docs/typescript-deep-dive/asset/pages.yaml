  md: "# Destructuring\n\nTypeScript supports the following forms of Destructuring\
    \ (literally named after de-structuring i.e. breaking up the structure):\n\n+\
    \   1. Object Destructuring\n2. Array Destructuring\n\nIt is easy to think of\
    \ destructuring as an inverse of structuring. The method of structuring in JavaScript\
    \ is the object literal:\n\n```\nvar foo = {\n  bar: {\n    bas: 123\n  }\n};\n\
    ```\n\nWithout the awesome structuring support built into JavaScript, creating\
    \ new objects on the fly would indeed be very cumbersome. Destructuring brings\
    \ the same level of convenience to getting data out of a structure.\n\n# Object\
    \ Destructuring\n\nDestructuring is useful because it allows you to do in a single\
    \ line, what would otherwise require multiple lines. Consider the following case:\n\
    \n```\nvar rect = { x: 10, y: 0, width: 15, height: 20 };\n\n// Destructuring\
    \ assignment\nvar {x, y, width, height} = rect;\nconsole.log(x, y, width, height);\
    \ // 0,10,15,20\n\nrect.x = 10;\n({x, y, width, height} = rect); // assign to\
    \ existing variables using outer parentheses\n\nconsole.log(x, y, width, height);\
    \ // 10,10,15,20\n```\n\nHere in the absence of destructuring you would have to\
    \ pick off x,y,width,height one by one from rect.\n\nTo assign an extracted variable\
    \ to a new variable name you can do to the following:"
  merge: -1
  pgno: 48
- img_proc: true
  md: '```

    const obj = {"some property": "some value"};

    ```


    ```

    // destructure

    const {"some property": someProperty} = obj;

    console.log(someProperty === "some value"); // true

    ```


    Additionally you can get deep data out of a structure using destructuring. This
    is shown in the following example:


    ```

    var foo = { bar: { bas: 123 } };

    var {bar: {bas}} = foo; // Effectively `var bar = foo.bar.bas;

    ```


    # Object Destructuring with rest


    You can pick up any number of elements from the object and get *an object* of
    the remaining elements using object destructuring with rest.


    ```

    var {w, ...remaining} = {w: 1, x: 2, y: 3, z: 4};

    console.log(w, remaining); // 1, 2, {y:3,z:4}

    ```


    A common case is also to ignore certain properties. For example:


    ```

    // Example function

    function goto(point2D: {x: number, y: number}) {

    // Imagine some code that might break

    // if you pass in an object

    // with more items desired

    }

    // Some point3D get from somewhere

    const point3D = {x: 1, y: 2, z: 3};

    /** A nifty use of rest to remove extra properties */

    const {z, ...point2D} = point3D;

    goto(point2D);

    ```


    # Array Destructuring


    A common programming question: "How to swap two variables without using a third
    one?" The TypeScript solution:


    ```

    var x = 1, y = 2;

    [x, y] = [y, x];

    console.log(x, y); // 2, 1

    ```'
