  md: "Type inference needs to be done upfront. This means that if you want to use\
    \ some type from a file you will have to do:\n\n```\nimport foo = require('foo');\n\
    var bar: foo.SomeType;\n```\n\nHowever you might want to only load the file foo\
    \ at runtime under certain conditions. For such cases you should use the import\
    \ ed only in type annotations and not as a variable. This removes any upfront\
    \ runtime dependency being injected by TypeScript. Then manually import the actual\
    \ module using code that is specific to your module loader.\n\nAs an example,\
    \ consider the following commons based code where we only load a module 'foo'\
    \ on a certain function call:\n\n```\nimport foo = require('foo');\n\nexport function\
    \ loadFoo() {\n  // This lazy loading `foo` and using the original module \"only\"\
    \ as a type annotation\n  var _foo: typeof foo = require('foo');\n  // Now use\
    \ `_foo` as a variable instead of `foo`.\n}\n```\n\nA similar sample in amd (using\
    \ requirejs) would be:\n\n```\nimport foo = require('foo');\n\nexport function\
    \ loadFoo() {\n  // This lazy loading `foo` and using the original module \"only\"\
    \ as a type annotation\n  require(['foo'], _foo: typeof foo) => {\n    // Now\
    \ use `_foo` as a variable instead of `foo`.\n  });\n}\n```\n\nThis pattern is\
    \ commonly used:\n\n+   - in web apps where you load certain JavaScript on particular\
    \ routes,\n- in node applications where you only load certain modules if needed\
    \ to speed up application bootup.\n\n# Use case: Breaking Circular dependencies"
  merge: -1
  pgno: 103
- img_proc: true
  md: "Similar to the lazy loading use case certain module loaders (commonjs/node\
    \ and amd/requires) don't work well with circular dependencies. In such cases\
    \ it is useful to have lazy loading in one direction and loading the modules upfront\
    \ in the other direction.\n\n# Use case: Ensure Import\n\nSometimes you want to\
    \ load a file just for the side effect (e.g. the module might register itself\
    \ with some library like CodeMirror addons etc.). However if you just do a import/require\
    \ the transpiled JavaScriptWill not contain a dependency on the module and your\
    \ module loader (e.g. webpack) might completely ignore the import. In such cases\
    \ you can use a ensureImport variable to ensure that the compiled JavaScript takes\
    \ a dependency on the module e.g.:\n\n```\nimport foo = require('./foo');\nimport\
    \ bar = require('./bar');\nimport bas = require('./bas');\nconst ensureImport:\
    \ any =\nfoo\n  || bar\n  || bas;\n```"
