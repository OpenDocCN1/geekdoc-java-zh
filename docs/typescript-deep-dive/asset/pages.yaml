  md: '# Why TypeScript


    There are two main goals of TypeScript:


    +   - Provide an optional type system for JavaScript.

    - Provide planned features from future JavaScript editions to current JavaScript
    engines


    The desire for these goals is motivated below.


    # The TypeScript type system


    You might be wondering **"Why add types to JavaScript?"


    Types have proven ability to enhance code quality and understandability. Large
    teams (Google, Microsoft, Facebook) have continuously arrived at this conclusion.
    Specifically:


    +   - Types increase your agility when doing refactoring. *It''s better for the
    compiler to catch errors than to have fail at runtime.*

    - Types are one of the best forms of documentation you can have. *The function
    signature is a theorem and the function body is the proof.*


    However types have a way of being unnecessarily ceremonious. TypeScript is very
    particular about keeping the barrier to entry as low as possible. Here''s how:


    # Your JavaScript is TypeScript


    TypeScript provides compile time safety for your JavaScript code. This is no surprise
    given its name. The great thing is that the types are completely optional. Your
    JavaScript code `.js` file can be renamed to a `.ts` file and TypeScript will
    still give you back valid `.js` equivalent to the original JavaScript file. TypeScript
    is *intentionally* and strictly a superset of JavaScript with optional Type checking.


    # Types can be Implicit


    TypeScript will try to infer as much of the type information as it can in order
    to give you safety with minimal cost of productivity during code development.
    For example, in the following example TypeScript will know that foo is of type
    `number` below and will give an error on the second line as shown:'
