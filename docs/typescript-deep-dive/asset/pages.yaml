  md: "# for...of\n\nA common error experienced by beginning JavaScript developers\
    \ is that for...in for an array does not iterate over the array items. Instead\
    \ it iterates over the keys of the object passed in. This is demonstrated in the\
    \ below example. Here you would expect 9,2,5 but you get the indexes 0,1,2:\n\n\
    ```\nvar someArray = [9, 2, 5];\nfor (var item in someArray) {\n  console.log(item);\
    \ // 0,1,2\n}\n```\n\nThis is one of the reasons why for...of exists in TypeScript\
    \ (ES6). The following iterates over the array correctly logging out the members\
    \ as expected:\n\n```\nvar someArray = [9, 2, 5];\nfor (var item of someArray)\
    \ {\n  console.log(item); // 9,2,5\n}\n```\n\nSimilarly TypeScript has no trouble\
    \ going through a string character by character using for...of:\n\n```\nvar hello\
    \ = \"is it me you're looking for?\";\nfor (var char of hello) {\n  console.log(char);\
    \ // is it me you're looking for?\n}\n```\n\n# JS Generation\n\nFor pre ES6 targets\
    \ TypeScript will generate the standard for (var i = 0; i < list.length; i++)\
    \ kind of loop. For example here's what gets generated for our previous example:"
