  md: "# Externally Controlled Execution\n\nThis is the part of generators that is\
    \ truly exciting. It essentially allows a function to pause its execution and\
    \ pass control (fate) of the remainder of the function execution to the caller.\n\
    \nA generator function does not execute when you call it. It just creates a generator\
    \ object. Consider the following example with a sample execution:\n\n```\nfunction*\
    \ generator() {\n  console.log('Execution started');\n  yield 0;\n  console.log('Execution\
    \ resumed');\n  yield 1;\n  console.log('Execution resumed');\n}\n\nvar iterator\
    \ = generator();\nconsole.log('Starting iteration'); // This will execute before\
    \ anything in the generator\nor function body executes\nconsole.log(iterator.next());\
    \ // { value: 0, done: false }\nconsole.log(iterator.next()); // { value: 1, done:\
    \ false }\nconsole.log(iterator.next()); // { value: undefined, done: true }\n\
    ```\n\nIf you run this you get the following output:\n\n```\n$ node outside.js\n\
    Starting iteration\nExecution started\n{ value: 0, done: false }\nExecution resumed\n\
    { value: 1, done: false }\nExecution resumed\n{ value: undefined, done: true }\n\
    ```\n\n+   * The function only starts execution once next is called on the generator\
    \ object.\n* The function pauses as soon as a yield statement is encountered.\n\
    * The function resumes when next is called.\n\n> So essentially the execution\
    \ of the generator function is controllable by the generator object.\n\nOur communication\
    \ using the generator has been mostly one way with the generator returning values\
    \ for the iterator. One extremely powerful feature of generators in JavaScript\
    \ is that they allow two way communications!\n\n+   * You can control the returning\
    \ value of the yield expression using `iterator.next(valueToInject)`"
  merge: -1
