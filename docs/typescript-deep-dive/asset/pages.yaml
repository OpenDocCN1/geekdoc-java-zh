  md: '# Parser


    The sourcecode for the TypeScript parser is located entirely in parser.ts . Scanner
    is controlled internally by the Parser to convert the source code to an AST. Here
    is a review of what the desired outcome is.


    ```

    SourceCode scanner --> Token Stream -- parser --> AST

    ```


    The parser is implemented as a singleton (similar reasons to scanner , don''t
    want to recreate it if we can reinit it). It is actually implemented as namespace
    Parser which contains state variables for the Parser as well as a singleton scanner
    . As mentioned before it contains a const scanner . The parser functions manage
    this scanner.


    # Usage by program


    Parser is driven directly by Program (indirectly as its actually by CompilerHost
    which we mentioned previously). Basically this is the simplified call stack:


    ```

    Program ->

    CompilerHost.getSourceFile ->

    (global function parser.ts).createSourceFile ->

    Parser.parseSourceFile

    ```


