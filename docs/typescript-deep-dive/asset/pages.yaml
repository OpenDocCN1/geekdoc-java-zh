  md: 'Inline types are great for quickly providing a one off type annotation for
    something. It saves you the hassle of coming up with a (potentially bad) type
    name. However, if you find yourself putting in the same type annotation inline
    times it''s a good idea to consider refactoring it into an interface (or a type
    alias covered later in this section).


    # # Special Types


    Beyond the primitive types that have been covered are few types that have special
    meaning in TypeScript. These are `any`, `null`, `undefined`, `void`.


    # # any


    The `any` type holds a special place in the TypeScript system. It gives you an
    escape hatch from the type system to tell the compiler to bug off. `any` is compatible
    with **any** and all types in the type system. This means that *anything* can
    be assigned to it and it can be assigned to anything. This is demonstrated in
    the following example:


    ```

    var power: any;


    // Takes any and all types

    power = ''123'';

    power = 123;


    // Is compatible with all types

    var num: number;

    power = num;

    power = power;

    ```


    If you are porto JavaScript code to TypeScript, you are going to be close friends
    with `any` in the beginning. However, don''t take this friendship too seriously
    as it means that it is **up to you to ensure the type safety**. You are basically
    telling the compiler to **not do any meaningful static analysis.


    # # null and undefined


    The `null` and `undefined` JavaScript literals are effectively treated by the
    type system the same as something of type `any`. These literals can be assigned
    to any other type. This is demonstrated in the below example:'
