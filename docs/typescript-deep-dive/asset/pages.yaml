  md: "+   * webworker\n* scripthost\n\n+   * ESNext By-feature options (even smaller\
    \ than bulk feature)\n  * es2015.core\n  * es2015.collection\n  * es2015.generator\n\
    \  * es2015.iterable\n  * es2015.promise\n  * es2015.proxy\n  * es2015.reflect\n\
    \  * es2015.symbol\n  * es2015.symbol.wellknown\n  * es2016.array.include\n  *\
    \ es2017.object\n  * es2017.sharedmemory\n  * esnext.asynciterable\n\nNOTE: the\
    \ --lib option provides extremely fine tuned control. So you most likely want\
