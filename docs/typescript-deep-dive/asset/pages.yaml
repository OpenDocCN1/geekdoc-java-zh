  md: "# Iterators\n\nIterator itself is not a TypeScript ES6 feature, Iterator is\
    \ a Behavioral Design Pattern common for Objected programming languages. It is,\
    \ generally, an object which implements the following interface:\n\n```\ninterface\
    \ Iterator<T> {\n  next(value?: any): IteratorResult<T>;\n  return(value?: any):\
    \ IteratorResult<T>;\n  throw(value?: any): IteratorResult<T>;\n}\n```\n\nThis\
    \ interface allows to retrieve a value from some collection or sequence which\
    \ belongs to the object.\n\nThe IteratorResult is simply a value + done pair:\n\
    \n```\ninterface IteratorResult<T> {\n  done: boolean;\n  value: T;\n}\n```\n\n\
    Imagine that there's an object of some frame, which includes the list of components\
    \ of which this frame consists. With Iterator interface it is possible to retrieve\
    \ components from this frame object like below:"
