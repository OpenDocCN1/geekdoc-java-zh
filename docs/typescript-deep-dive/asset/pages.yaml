  md: "# Namespaces\n\nNamespaces provide you with a convenient syntax around a common\
    \ pattern used in JavaScript:\n\n```\n(function(something) {\n  something.foo\
    \ = 123;\n})(something || (something = {}))\n```\n\nBasically something || (something\
    \ = {})\\ allows an anonymous function function(something) {} to add to an existing\
    \ object (the something || portion) or start a new object then add stuff to that\
    \ object (the || (something = {}) portion). This means that you can have two such\
    \ blocks split by some execution boundary:\n\n```\n(function(something) {\n  something.foo\
    \ = 123;\n})(something || (something = {}))\n\nconsole.log(something); // {foo:123}\n\
    \n{function(something) {\n  something.bar = 456;\n})(something || (something =\
    \ {}))\n\nconsole.log(something); // {foo:123, bar:456}\n```\n\nThis is commonly\
    \ used in the JavaScript land for making sure that stuff doesn't leak into the\
    \ global namespace. With file based modules you don't need to worry about this,\
    \ but the pattern is still useful for logical grouping of a bunch of functions.\
    \ Therefore TypeScript provides the namespace keyword to group these e.g.:"
  merge: -1
  pgno: 106
