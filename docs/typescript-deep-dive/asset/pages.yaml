  md: "# Making JavaScript Better\n\nTypeScript will try to protect you from portions\
    \ of JavaScript that never worked (so you don't need to remember this stuff):\n\
    \n```\n[] + []; // JavaScript will give you \"\"\" (which makes little sense),\
    \ TypeScript will eror\n\n// other things that are nonsensical in JavaScript\n\
    // don't give a runtime error (making debugging hard)\n// but TypeScript will\
    \ give a compile error (making debugging unnecessary)\n\n{} + []; // JS : 0, TS\
    \ Error\n[] + {}; // JS : \"[object Object]\", TS Error\n{} + {}; // JS : NaN\
    \ or [object Object][object Object] depending upon browser, TS Error\n\n\"hello\"\
    \ - 1; // JS : NaN, TS Error\n\nfunction add(a,b) {\n  return\n  a + b; // JS\
    \ : undefined, TS Error 'unreachable code detected'\n}\n```\n\nEssentially TypeScript\
    \ is linting JavaScript. Just doing a better job at it than other linters that\
    \ don't have type information.\n\n# You still need to learn JavaScript\n\nThat\
    \ said TypeScript is very pragmatic about the fact that you do write JavaScript\
    \ so there are some things about JavaScript that you still need to know in order\
    \ not to be caught offguard. Let's discuss them next.\n\n> Note: TypeScript is\
    \ a superset of JavaScript. Just with documentation that can actually be used\
    \ by compilers / IDEs ;)"
