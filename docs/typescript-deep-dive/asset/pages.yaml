  md: "# nolplicitAny\n\nThere are some things that cannot be inferred or inferring\
    \ them might result in errors that might be unexpected. A fine example is function\
    \ arguments. If you don't annotate them its unclear what and shouldn't be valid\
    \ e.g.\n\n```\nfunction log(someArg) {\n  sendDataToServer(someArg);\n}\n\n//\
    \ What arg is valid and what isn't?\nlog(123);\nlog('hello world');\n```\n\nSo\
    \ if you don not annotate some function argument TypeScript assumes any and moves\
    \ on. This essentially turns off type checking for such cases which is what a\
    \ JavaScript dev expect but can catch people that high safety off guard. Here\
    \ there is an option noImplicitAny that switched on will flag the cases where\
    \ the type cannot be inferred e.g.\n\n```\nfunction log(someArg) { // Error :\
    \ someArg has an implicit `any` type\n  sendDataToServer(someArg);\n}\n```\n\n\
    of course you can then go ahead an annotate:\n\n```\nfunction log(someArg: number)\
    \ {\n  sendDataToServer(someArg);\n}\n```\n\nAnd if you truly want zero safety\
    \ you can mark it explicitly as any :\n\n```\nfunction log(someArg: any) {\n \
    \ sendDataToServer(someArg);\n}\n```"
  merge: -1
  pgno: 233
