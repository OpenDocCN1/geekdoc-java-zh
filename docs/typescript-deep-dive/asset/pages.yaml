  md: "# # Generics\n\nThe key motivation for generics is to provide meaningful type\
    \ constraints between members.\nThe members can be: \n\n+   * Class instance members\n\
    * Class methods\n* function arguments\n* function return values\n\n# ## Motivation\
    \ and samples\n\nConsider the simple Queue (in, first out) data structure implementation.\
    \ A simple one in TypeScript / JavaScript looks like:\n\n```\nclass Queue {\n\
    \  private data = [];\n  push = (item) => this.data.push(item);\n  pop = () =>\
    \ this.data.shift();\n}\n```\n\nOne with this implementation is that it allows\
    \ people to add *anything* to the queue and when they pop it - it can be *anything*.\
    \ This is shown below, where someone can push a `string` onto the queue while\
    \ the usage actually assumes that only `numbers` where pushed in:\n\n```\nclass\
    \ Queue {\n  private data = [];\n  push = (item) => this.data.push(item);\n  pop\
    \ = () => this.data.shift();\n}\n\nconst queue = new Queue();\nqueue.push(0);\n\
    queue.push(\"1\"); // Ops a mistake\n\n// a developer walks into a bar\nconsole.log(queue.pop().toPrecision(i));\n\
    console.log(queue.pop().toPrecision(i)); // RUNTIME ERROR\n```"
  merge: -1
  pgno: 179
- img_proc: true
  md: "One solution (and in fact the only one in languages that don't support generics)\
    \ is to go ahead and create special classes just for these constraints. E.g. a\
    \ quick and dirty number queue:\n\n```\nclass QueueNumber {\n    private data\
    \ = [];\n    push = (item: number) => this.data.push(item);\n    pop = () => this.data.shift();\n\
    }\n\nconst queue = new QueueNumber();\nqueue.push(0);\nqueue.push(\"i\"); // ERROR\
    \ : cannot push a string. Only numbers allowed\n```\n\n// ^ if that is fixed the\
    \ rest would be fine too\n\nOf this course can quickly become painful e.g. if\
    \ you want a string queue you have to go through all that effort again. What you\
    \ really want is a way to say that whatever type is of stuff getting pushed it\
    \ should be the same for whatever gets popped. This is done easily with a generic\
    \ parameter (in this case, at the class level):\n\n```\n/** A class definition\
    \ with a generic parameter */\nclass Queue<T> {\n    private data = [];\n    push\
    \ = (item: T) => this.data.push(item);\n    pop = () => T => this.data.shift();\n\
    }\n\n/** Again sample usage */\nconst queue = new Queue<number>();\nqueue.push(0);\n\
    queue.push(\"i\"); // ERROR : cannot push a string. Only numbers allowed\n\n//\
    \ ^ if that error is fixed the rest would be fine too\n```\n\nAnother example\
    \ that we have already seen is that of a reverse function, here the constraint\
    \ is between what gets passed into the function and what the function returns:"
  merge: -1
  pgno: 180
- img_proc: true
  md: "```\nfunction reverse<T>(items: T[]): T[] {\n  var toreturn = [];\n  for (let\
    \ i = items.length - 1; i >= 0; i--) {\n    toreturn.push(items[i]);\n  }\n  return\
    \ toreturn;\n}\n```\n\n```\nvar sample = [1, 2, 3];\nvar reversed = reverse(sample);\n\
    console.log(reversed); // 3,2,1\n\n// Safety!\nreversed[0] = '1'; // Error!\n\
    reversed = ['1', '2']; // Error!\n\nreversed[0] = 1; // Okay\nreversed = [1, 2];\
    \ // Okay\n```\n\nIn this section you have examples of generics being defined\
    \ at class level and at function level. Minor addition worth mentioning is that\
    \ you can have generics created just for member function. As a toy example consider\
    \ the following where we move the function into a utility class:\n\n```\nclass\
    \ utility {\n  reverse<T>(items: T[]): T[] {\n    var toreturn = [];\n    for\
    \ (let i = items.length - 1; i >= 0; i--) {\n      toreturn.push(items[i]);\n\
    \    }\n    return toreturn;\n  }\n}\n```\n\n> TIP: You can call the generic parameter\
    \ whatever you want. It is conventional to use T, U, V when you have simple generics.\
    \ If you have more than one generic argument to use meaningful names e.g. TKey\
    \ and TValue (conventional to prefix with T as generics are also called templates\
    \ in other languages e.g. C++).\n\n# Generics in TSX\n\nBecause .tsx /.jsx uses\
    \ syntax like <div> to denote JSX blocks it offers a few unique challenges for\
    \ Generics.\n\nQuick Tip: Use as for syntax for type assertions as we mentioned\
    \ before."
