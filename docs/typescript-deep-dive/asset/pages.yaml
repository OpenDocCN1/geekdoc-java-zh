  md: "# Generators\n\n> NOTE: You cannot use generators in TypeScript in a meaningful\
    \ way (the ES5 emitter is in progress). However that will change soon so we still\
    \ have this chapter.\n\nfunction * is the syntax to create a *generator function*.\
    \ Calling a generator function returns a *generator object*. The generator object\
    \ just follows the *iterator* interface (i.e. the `next`, `return` and `throw`\
    \ functions).\n\nThere are two key motivations behind generator functions:\n\n\
    # Lazy Iterators\n\nGenerator functions can be used to create lazy iterators e.g.\
    \ the following function returns an infinite list of integers on demand:\n\n```\n\
    function* infiniteSequence() {\n  var i = 0;\n  while (true) {\n    yield i++;\n\
    \  }\n}\n\nvar iterator = infiniteSequence();\nwhile (true) {\n  console.log(iterator.next());\
    \ // { value: xxxx, done: false } forever and ever\n}\n```\n\nOf course if the\
    \ iterator does end, you get the result of { done: true } as demonstrated below:\n\
    \n```\nfunction* idMaker() {\n  let index = 0;\n  while(index < 3) {\n    yield\
    \ index++;\n  }\n}\n\nlet gen = idMaker();\n\nconsole.log(gen.next()); // { value:\
    \ 0, done: false }\nconsole.log(gen.next()); // { value: 1, done: false }\nconsole.log(gen.next());\
    \ // { value: 2, done: false }\nconsole.log(gen.next()); // { done: true }\n```"
  merge: -1
  pgno: 78
