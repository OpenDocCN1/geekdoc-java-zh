  md: "# Limit usage of property setters\n\nPrefer explicit set/get functions (e.g.\
    \ `setBar` and `get`) over setters/getters.\n\nConsider the following code:\n\n\
    ```\nfoo.bar = {\n  a: 123,\n  b: 456\n};\n```\n\nIn the presence of setter/getters:\n\
    \n```\nclass Foo {\n  a: number;\n  b: number;\n  set bar(value:{a:number,b:number})\
    \ {\n    this.a = value.a;\n    this.b = value.b;\n  }\n}\nlet foo = new Foo();\n\
    ```\n\nThis is not a *good* use of property setters. The person reading the first\
    \ code sample has no context about all the things that will change. Where as someone\
    \ calling `foo.setBar(value)` might have an idea that something might change on\
    \ `foo`.\n\n> > Bonus points: Find references works better if you have different\
    \ functions. In TypeScript tools if you find references for a getter or a setter\
    \ you get *both* whereas with explicit function calls you only get references\
    \ to the relevant function."
