    \ lexically captures the meaning of arguments\n\nFor a language that claims to\
    \ be functional, in JavaScript you tend to be typing function quite a lot. The\
    \ fat arrow makes it simple for you to create a function\n\n```\nvar inc = (x)=>x+i;\n\
    ```\n\nthis has traditionally been a pain point in JavaScript. As a wise man once\
    \ said \"I hate JavaScript as it tends to lose the meaning of this all too easily\"\
    . Fat arrows fix it by capturing the meaning of this from the surrounding context.\
    \ Consider this pure JavaScript class:\n\n```\nfunction Person(age) {\n  this.age\
    \ = age;\n  this.growOld = function() {\n    this.age++;\n  }\n}\nvar person =\
    \ new Person(1);\nsetTimeout(person.growOld,1000);\n```\n\n```\nsetTimeout(function()\
    \ { console.log(person.age); }, 2000); // 1, should have been 2\n```\n\nIf you\
    \ run this code in the browser this within the function is going to point to window\
    \ because window is going to be what executes the growOld function. Fix is to\
    \ use an arrow function:"
