    \n+   2. Provides a consistent way for developers to use classes instead of every\
    \ framework (ember, react etc) coming up with their own version.\n\n+   3. Object\
    \ JavaScripted Developers already understand classes.\n\nFinally JavaScript developers\
    \ can have class . Here we have a basic class called Point:\n\n```\nclass Point\
    \ {\n  x: number;\n  y: number;\n  constructor(x: number, y: number) {\n    this.x\
    \ = x;\n    this.y = y;\n  }\n  add(point: Point) {\n    return new Point(this.x\
    \ + point.x, this.y + point.y);\n  }\n}\n\nvar p1 = new Point(0, 10);\nvar p2\
    \ = new Point(10, 20);\nvar p3 = p1.add(p2); // {x:10,y:30}\n```\n\nThis class\
    \ Point generates the following JavaScript on ES5 emit:\n\n```\nvar Point = (function\
    \ () {\n  function Point(x, y) {\n    this.x = x;\n    this.y = y;\n  }\n  Point.prototype.add\
    \ = function (point) {\n    return new Point(this.x + point.x, this.y + point.y);\n\
    \  };\n  return Point;\n})();\n```\n\nThis is a fairly idiomatic traditional JavaScript\
    \ pattern now as a first class language construct.\n\n# Inheritance"
