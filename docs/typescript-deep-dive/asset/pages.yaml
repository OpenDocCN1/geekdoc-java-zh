  md: "TypeScript objects are structurally typed. This means the names don't matter\
    \ as long as the structures match\n\n```\ninterface Point {\n  x: number;\n  y:\
    \ number;\n}\n\nclass Point2D {\n  constructor(public x:number, public y:number){}\n\
    }\n\nlet p: Point;\n// OK, because of structural typing\np = new Point2D(1,2);\n\
    ```\n\nThis allows you to create objects on the fly (like you do in vanilla JS)\
    \ and still have safety for whenever it can be inferred.\n\nAlso more data is\
    \ considered fine:\n\n```\ninterface Point2D {\n  x: number;\n  y: number;\n}\n\
    interface Point3D {\n  x: number;\n  y: number;\n  z: number;\n}\n\nvar point2D:\
    \ Point2D = { x: 0, y: 10 };\nvar point3D: Point3D = { x: 0, y: 10, z: 20 };\n\
    function iTakePoint2D(point: Point2D) { /* do something */ }\n\niTakePoint2D(point2D);\
    \ // exact match okay\niTakePoint2D(point3D); // extra information okay\niTakePoint2D({\
    \ x: 0 }); // Error: missing information `\n```\n\n# Variance\n\nVariance is an\
    \ easy to understand and important concept for type compatibility analysis.\n\n\
    For simple types Base and Child, if Child is a child of Base, then instances of\
    \ Child can be assigned to a variable of type Base.\n\n> This is polymorphism\
    \ 101"
