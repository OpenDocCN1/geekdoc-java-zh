  md: "# Type Assertion vs. Casting\n\nThe reason why it's not called \"type casting\"\
    \ is that casting generally implies some sort of runtime support. However type\
    \ assertions are purely a compile time construct and a way for you to provide\
    \ hints to the compiler on how you want your code to be analyzed.\n\n# Assertion\
    \ considered harmful\n\nIn many cases assertion will allow you to easily migrate\
    \ legacy code (and even copy paste other code samples into your codebase), however\
    \ you should be careful with your use of assertions. Take our original code as\
    \ a sample, the compiler will not protect you from forgetting to actually add\
    \ the properties you promised:\n\n```\ninterface Foo {\n  bar: number;\n  bas:\
    \ string;\n}\nvar foo = {} as Foo;\n// ahhhh forget something?\n```\n\nAlso another\
    \ common thought is using an assertion as a means of providing autocomplete e.g.:\n\
    \n```\ninterface Foo {\n  bar: number;\n  bas: string;\n}\nvar foo = <Foo>\n//\
    \ the compiler will provide autocomplete for properties of Foo\n// But it is easy\
    \ for the developer to forget adding all the properties\n// Also this code is\
    \ likely to break if Foo gets refactored (e.g. a new property a dded)\n);\n```\n\
    \nthe hazard here is the same, if you forget a property the compiler will not\
    \ complain. It is better if you do the following following:\n\n```\ninterface\
    \ Foo {\n  bar: number;\n  bas: string;\n}\nvar foo:Foo = {\n// the compiler will\
    \ provide autocomplete for properties of Foo\n);\n```"
