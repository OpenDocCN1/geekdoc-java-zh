  md: "# Literals\n\nLiterals are exact values that are JavaScript primitives.\n\n\
    # String Literals\n\nYou can use a string literal as a type. For example:\n\n\
    ```\nlet foo: 'Hello';\n```\n\nHere we have created a variable called foo that\
    \ will only allow the literal value 'Hello' to be assigned to it. This is demonstrated\
    \ below:\n\n```\nlet foo: 'Hello';\nfoo = 'Bar'; // Error: \"Bar\" is not assignable\
    \ to type \"Hello\"\n```\n\nThey are not very useful on their own but can be combined\
    \ in a type union to create a powerful (and useful) abstraction e.g.:\n\n```\n\
    type CardinalDirection =\n  \"North\"\n  | \"East\"\n  | \"South\"\n  | \"West\"\
    \n\nfunction move(distance: number, direction: CardinalDirection) {\n  // ...n}\n\
    ```\n\n```\nmove(1\n```\n\n# Other literal types\n\nTypeScript also supports boolean,\
    \ numbers as literals, e.g.:\n\n```\ntype OneFive = 1 | 2 | 3 | 4 | 5;\ntype Bools\
    \ = true | false;\n```\n\n# Inference"
  merge: -1
