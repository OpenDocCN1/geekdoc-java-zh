  md: "# Dynamic import expressions\n\nDynamic import expressions are a new feature\
    \ and part of ECMAScript bundle allows users to asynchronously request a module\
    \ at any arbitrary point in your program. TC39 JavaScript committee has its own\
    \ proposal which is in stage 3, and it is called import() proposal for JavaScript.\n\
    \nFrom other side, webpack bundler has a feature called Code Splitting which allows\
    \ you to split your bundle into chunks which can be downloaded asynchronously\
    \ at a later time. For instance, this allows to serve a minimal bootstrap bundle\
    \ and to asynchronously load additional features later.\n\nAt first glance, it's\
    \ natural to think (if we are using webpack in our dev workflow) that using TypeScript\
    \ 2.4 dynamic import expressions, will automatically produce chunks and asynchronously-split\
    \ your JS bundle. BUT, that is not as easy as it seems, because it depends on\
    \ the tsconfig.json configuration we are working with.\n\nThe thing is that webpack\
    \ code splitting supports two similar techniques to achieve this goal: using import()\
    \ (preferred, ECMAScript proposal) and require.ensure() (legacy, webpack specific).\
    \ And what that means is the expected TypeScript output is leave the import()\
    \ statement as it is instead of transpile to anything else.\n\nLet's see and example\
    \ to figure out how to configure webpack + TypeScript 2.4.\n\nIn the following\
    \ code I want to lazy load the library moment but I am interested on code splitting\
    \ as well, which having moment library in a separate chunk of JS (javascript file)\
    \ and that will be loaded only when required.\n\n```\nimport(/* webpackChunkName:\
    \ \"moment\" */ \"moment\"\n.then(moment) => {\n  // lazyModule has all of the\
    \ proper types, autocomplete works,\n  // type checking works, code references\
    \ \\\n  const time = moment().format();\n  console.log(\"TypeScript >= 2.4.0 Dynamic\
    \ Import Expression:\");\n  console.log(time);\n})\n.catch((err) => {\n  console.log(\"\
    Failed to load moment\", err);\n});\n```\n\nHere is the tsconfig.json:"
