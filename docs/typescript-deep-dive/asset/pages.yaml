    \ y);\n    this.z = z;\n  }\n  add(point: Point3D) {\n    var point2D = super.add(point);\n\
    \    return new Point3D(point2D.x, point2D.y, this.z + point.z);\n  }\n}\n```\n\
    \nIf you have a constructor in your class you *must* call the parent constructor\
    \ from your constructor (TypeScript will point this out to you). This ensures\
    \ that the stuff that needs to be on `this` gets set. Followed by the call to\
    \ `super` you can add any additional stuff you want to do in your constructor\
    \ (here we add another member `z`).\n\nNote that you override parent member functions\
    \ easily (here we override `add`) and still use the functionality of the super\
    \ class in your members (using `super.` syntax).\n\n# # Statics\n\nTypeScript\
    \ classes support `static` properties that are shared by all instances of the\
    \ class. A natural place to put (and access) them is on the class itself and what\
    \ is TypeScript does below:\n\n```\nclass Something {\n  static instances = 0;\n\
    \  constructor() {\n    Something.instances++;\n  }\n}\n```\n\n```\nvar s1 = new\
    \ Something();\nvar s2 = new Something();\nconsole.log(Something.instances); //\
    \ 2\n```\n\nYou can have static members as well as static functions.\n\n# # Access\
    \ Modifiers"
