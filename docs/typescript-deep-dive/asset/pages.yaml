  md: '# Null Bad


    JavaScript (and by extension TypeScript) has two bottom types : `null` and `undefined`nThey
    are `intended` to mean different things:


    +   - Something hasn''t been initialized : `undefined`

    - Something is currently unavailable: `null`


    Most other languages only have one (commonly called `null`). Since by default
    JavaScript will evaluate an uninitialized variable / parameter / property to `undefined`
    (you don''t get a choice) we recommend just use that for your own `unavailable`
    status and don''t bother with `null`


    # Real world discussions


    # Dealing with `null` style code bases


    If your code base interacts with other APIs that might give you a `null` you check
    with `== undefined` (instead of `===`). Using this is even for potentially `falsy`
    values.


