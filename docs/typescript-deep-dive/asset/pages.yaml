  md: 'You can use these Infinity values manually or using static members of the Number
    class as shown below:


    ```

    console.log(Number.POSITIVE_INFINITY === Infinity); // true

    console.log(Number.NEGATIVE_INFINITY === -Infinity); // true

    ```


    Fortunately comparison operators (< / >) work reliably on infinity values:


    ```

    console.log(Infinity > 1); // true

    console.log(-Infinity < -1); // true

    ```


    # Infinitesimal


    The smallest non-zero value representable in Number is available as static Number.MIN_VALUE


    ```

    console.log(Number.MIN_VALUE); // 5e-324

    ```


    Values smaller than MIN_VALUE ("underflow values") are converted to 0.


    ```

    console.log(Number.MIN_VALUE / 10); // 0

    ```


    > Further intuition: Just like values bigger than Number.MAX_VALUE get clamped
    to INFINITY, values smaller than Number.MIN_VALUE get clamped to 0.'
