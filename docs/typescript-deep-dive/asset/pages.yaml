  md: "# Null and Undefined\n\nFact is you will need to deal with both. Just check\
    \ for either == check.\n\n```\n/// Imagine you are doing `foo.bar == undefined`\
    \ where bar can be one of:\nconsole.log(undefined == undefined); // true\nconsole.log(null\
    \ == undefined); // true\nconsole.log(@ == undefined); // false\nconsole.log('\\\
    ' == undefined); // false\nconsole.log(false == undefined); // false\n```\n\n\
    Recomend == null to check for both undefined or null . You generally don't want\
    \ to make a distinction between the two.\n\n```\nfunction foo(arg: string | null\
    \ | undefined) {\n  if (arg != null) {\n    // arg must be a string `!=' rules\
    \ out both null and undefined.\n  }\n}\n```\n\n# undefined\n\nRemember how I said\
    \ you should use == null . Of course you do (cause I just said it ^).\nDon't use\
    \ it for root level things. In strict mode if you use foo and foo is undefined\
    \ you get a ReferenceError exception and the whole stack unwinds.\n\n> You should\
    \ use strict mode ... and in fact the TS compiler will insert it for if you use\
    \ modules ... more on those later in the book so you have to be explicit about\
    \ :\n\nSo check if a variable is defined or not at a global level you normally\
