    \ second uses an *interface*\n\n```\n// Sample A\ndeclare var myPoint: { x: number;\
    \ y: number; };\n\n// Sample B\ninterface Point {\n x: number; y: number;\n}\n\
    declare var myPoint: Point;\n```\n\nHowever the beauty of *Sample B* is that if\
    \ someone authors a library that builds on the myPoint library to add new members,\
    \ they can easily add to the existing declaration of myPoint :\n\n```\n// Lib\
    \ a.d.ts\ninterface Point {\nx: number; y: number;\n}\ndeclare var myPoint: Point;\n\
    \n// Lib b.d.ts\ninterface Point {\nz: number;\n}\n\n// Your code\nvar myPoint.z;\
    \ // Allowed!\n```\n\nThis is because **interfaces in TypeScript are open ended**.\
    \ This is a vital ten of TypeScript that allows you to mimic the extensibility\
    \ of JavaScript using *interfaces*.\n\n# Classes can implement interfaces\n\n\
    If you want to use *classes* that must follow an object structure that someone\
    \ declared for you in an *interface* you can use the `implements` keyword to ensure\
    \ compatibility:"
