  md: "# # Index Signatures\n\nAn object in JavaScript (and hence TypeScript) can\
    \ be accessed with a string to hold a reference to any other JavaScript object.\n\
    \nHere is a quick example:\n\n```\nlet foo = {};\nfoo['Hello'] = 'World';\nconsole.log(foo['Hello']);\
    \ // World\n```\n\nWe store a string \"World\" under the key \"Hello\". Remember\
    \ we said it store any JavaScript object, so lets store a class instance just\
    \ to show the concept:\n\n```\nclass Foo {\n  constructor(public message: string){}\n\
    \  log() {\n    console.log(this.message)\n  }\n}\n```\n\n```\nlet foo = {};\n\
    foo['Hello'] = new Foo('World');\nfoo['Hello'].log(); // World\n```\n\nAlso remember\
    \ that we said that it can be accessed with a string. If you pass any other object\
    \ to the index signature the JavaScript runtime actually calls .toString on it\
    \ before getting the result. This is demonstrated below:\n\n```\nlet obj = {\n\
    \  toString() {\n    console.log('toString called')\n    return 'Hello'\n  }\n\
    }\n```\n\n```\nlet foo = {};\nfoo[obj] = 'World';\nconsole.log(foo[obj]); // toString\
    \ called, World\nconsole.log(foo['Hello']); // World\n```\n\nNote that toString\
    \ will get called whenever the obj is used in an index position."
