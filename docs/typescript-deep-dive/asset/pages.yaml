    # Type Alias


    TypeScript provides convenient syntax for providing names for type annotations
    that you would like to use in more than one place. The aliases are created using
    the type symbolName = someValidTypeAnnotation syntax. An example is demonstrated
    below:


    ```

    type StrOrNum = string|number;


    // Usage: Just like any other notation

    var sample: StrOrNum;

    sample = 123;

    sample = ''123'';


    // Just checking

    sample = true; // Error!

    ```


    Unlike an interface you can give a type alias to literally any type annotation
    (useful for stuff like union and intersection types). Here are a few examples
    to make you familiar with the syntax:


    ```

    type Text = string | { text: string };

    type Coordinates = [number, number];

    type Callback = (data: string) => void;

    ```'
