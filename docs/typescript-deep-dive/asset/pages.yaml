    # lib.d.ts


    A special declaration file lib.d.ts ships with every installation of TypeScript.
    This file contains the ambient declarations for various JavaScript constructs
    present in JavaScript runtimes and the DOM.


    +   * This file is automatically included in the compilation context of a TypeScript
    project.

    * The objective of this file is to make it easy for you to start writing type
    checked JavaScript code.


    You can exclude this file from the compilation context by specifying the --noLib
    compiler command line flag (or "noLib" : true in tsconfig.json).


    # Example Usage


    As always we look at examples of this file being used in action:


    ```

    var foo = 123;

    var bar = foo.toString();

    ```


    This code type checks fine because the toString function is defined in lib.d.ts
    for all JavaScript objects.


    If you use the same sample code with the noLib option you get a type check error:


    ```

    var foo = 123;

    var bar = foo.toString(); // ERROR: Property ''toString'' does not exist on type
    ''number''.

    ```


    So now that you understand the importance of lib.d.ts what does its contents look
    like? We examine that next.'
