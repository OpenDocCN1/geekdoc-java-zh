  md: "# Discinated Union\n\nIf you have a class with a literal member then you can\
    \ use that property to discriminate between union members.\n\nAs an example consider\
    \ the union of a Square and Rectangle , here we have a member kind that exists\
    \ on both union members and is of a particular literal type:\n\n```\ninterface\
    \ Square {\n  kind: \"square\";\n  size: number;\n}\n\ninterface Rectangle {\n\
    \  kind: \"rectangle\";\n  width: number;\n  height: number;\n}\ntype Shape =\
    \ Square | Rectangle;\n```\n\nIf you use a type guard check ( == , === , != ,\
    \ !== ) or switch on the discriminant property (here kind) TypeScript realize\
    \ that the object must be of the type that has that specific literal and do a\
    \ type narrowing for you :\n\n```\nfunction area(s:Shape) {\n  if (s.kind ===\
    \ \"square\") {\n    // Now TypeScript \"knows* `s` must be a square ;\n    //\
    \ So you can use its members safely :\n    return s.size * s.size;\n  } else {\n\
