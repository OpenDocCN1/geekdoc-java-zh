  md: "# Be careful around parameters\n\nTypes do not flow into the function parameters\
    \ if it cannot be inferred from an assignment. For example in the following case\
    \ the compiler does not know the type of foo so it cannot infer the type of a\
    \ or b.\n\n```\nconst foo = (a,b) => { /* do something */ };\n```\n\nHowever if\
    \ foo was typed the function parameters type can be inferred (a, b are both inferred\
    \ to be type of number in the example below).\n\n```\ntype TwoNumberFunction =\
    \ (a: number, b: number) => void;\nconst foo: TwoNumberFunction = (a, b) => {\
    \ /* do something */ };\n```\n\n# Be careful around return\n\nAlthough TypeScript\
    \ can generally infer the return type of a function, it might not be what you\
    \ expect. For example here function foo has a return type of any.\n\n```\nfunction\
    \ foo(a: number, b: number) {\n  return a + addOne(b);\n}\n// Some external function\
    \ in a library someone wrote in JavaScript\nfunction addOne(a) {\n  return a +\
    \ 1;\n}\n```\n\nThis is because the return type is impacted by the poor type definition\
    \ for addOne (a is any so the return of addOne is any so the return of foo is\
    \ any).\n\n> I it simplest to always be explicit about function / returns. After\
    \ all these annotations are a theorem and the function body is the proof.\n\n\
    There are other cases that one can imagine, but the good news is that there is\
    \ a compiler flag that can help catch bugs.\n\n# noImplicitAny\n\nThe flag noImplicitAny\
    \ instructs the compiler to raise an error if it cannot infer the type of a variable\
    \ (and therefore can only have it as an implicit type). You can then\n\n+   -\
    \ either say you want it to be of type any by explicitly adding an : type annotation"
