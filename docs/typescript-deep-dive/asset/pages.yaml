  md: "TypeScript allows you to declare function overloads. This is useful for documentation\
    \ + type safety purpose.\n\n```\nfunction padding(a: number, b?: number, c?: number,\
    \ d?: any) {\n  if (b === undefined && c === undefined && d === undefined) {\n\
    \    b = c = d = a;\n  } else if (c === undefined && d === undefined) {\n    c\
    \ = a;\n    d = b;\n  }\n  return {\n    top: a,\n    right: b,\n    bottom: c,\n\
    \    left: d\n  };\n}\n```\n\nIf you look at the code carefully you realize the\
    \ meaning of a, b, c, d change based on how many arguments are passed in. Also\
    \ the function only expects 1, 2 or 4 arguments. These constraints can be enforced\
    \ and documented using function overloading.\nYou just:\n\n+   - declare the function\
    \ header multiple times,\n- the last function header is the one that is actually\
    \ active within the function body but is not available to the outside world.\n\
    \nThis is shown below:"
