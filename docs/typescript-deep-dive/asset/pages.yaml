  md: "# Nominal Typing\n\nThe TypeScript type system is structural and this is one\
    \ of the main motivating benefits. However, there are real-use cases for a system\
    \ where you want two variables to be differentiated because they have a different\
    \ type name even if they have the same structure. A very common use case is identity\
    \ structures (which are generally just strings with semantics associated with\
    \ their name in languages like C#/Java).\n\nThere are a few patterns that have\
    \ emerged in the community. I cover them in decreasing order of personal preference:\n\
    \n# Using literal types\n\nThis pattern uses generics and literal types:\n\n```\n\
    /** Generic Id type */\ntype IdT extends string = {\n  type: T,\n  value: string,\n\
    }\n\n/** Specific Id types */\ntype FooId = Id<'foo'>;\ntype BarId = Id<'bar'>;\n\
    \n/** Optional: ct constructors functions */\nconst createFoo = (value: string):\
    \ FooId => ({ type: 'foo', value: value });\nconst createBar = (value: string):\
    \ BarId => ({ type: 'bar', value: value });\n\nlet foo = createFoo('sample');\n\
    let bar = createBar('sample');\n\nfoo = bar; // Error\nfoo = foo; // Okay\n```\n\
    \n+   Advantages\n  - No need for any type assertions\n\n+   Disadvantage\n  -\
    \ The structure {type,value} might not be desirable and need server serialization\
    \ support\n\n# Using Enums"
  merge: -1
  pgno: 245
- img_proc: true
  md: "# Enums in TypeScript offer a certain level of nominal typing. Two enum types\
    \ aren't equal if they differ by name. We can use this fact to provide nominal\
    \ typing for types that are otherwise structurally compatible.\n\nThe workaround\
    \ involves:\n\n+   - Creating a *brand* enum.\n- Creating the type as an *intersection*\
    \ (&) of the brand enum + the actual structure.\n\nThis is demonstrated below\
    \ where the structure of the types is just a string:\n\n```\n// FOO\nenum FooBrand\
    \ {}\ntype FooId = FooBrand & string;\n\n// BAR\nenum BarBrand {}\ntype BarId\
    \ = BarBrand & string;\n\n/**\n * Usage Demo\n */\nvar fooId: FooId;\nvar barId:\
    \ BarId;\n\n// Safety!\nfooId = barId; // error\nbarId = fooId; // error\n\n//\
    \ Newing up\nfooId = 'foo' as FooId;\nbarId = 'bar' as BarId;\n\n// Both types\
    \ are compatible with the base\nvar str: string;\nstr = fooId;\nstr = barId;\n\
    ```\n\n# Using Interfaces\n\nBecause numbers are type compatible with enum s the\
    \ previous technique cannot be used for them. Instead we can use interfaces to\
    \ break the structural compatibility. This is still used by the TypeScript compiler\
    \ team, so worth mentioning. Using _ prefix and Brand suffix is a convention I\
    \ strongly recommend (and the one followed by the TypeScript team).\n\nThe workaround\
    \ involves the following:"
  merge: -1
  pgno: 246
- img_proc: true
  md: "+   - adding an unused property on a type to break structural compatibility.\n\
    - using a type assertion when needing to new up or cast down.\n\nThis is demonstrated\
    \ below:\n\n```\n// FOO\ninterface FooId extends String {\n  _fooIdBrand: string;\
    \ // To prevent type errors\n}\n\n// BAR\ninterface BarId extends String {\n \
    \ _barIdBrand: string; // To prevent type errors\n}\n\n/**\n * Usage Demo\n */\n\
    var fooId: FooId;\nvar barId: BarId;\n\n// Safety!\nfooId = barId; // error\n\
    barId = fooId; // error\nfooId = <FooId>barId; // error\nbarId = <BarId-FooId>;\
    \ // error\n\n// Newing up\nfooId = 'foo' as any;\nbarId = 'bar' as any;\n\n//\
    \ If you need the base string\nvar str: string;\nstr = fooId as any;\nstr = barId\
    \ as any;\n```"
