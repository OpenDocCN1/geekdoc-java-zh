  md: '# lib.d.ts inside look


    The contents of lib.d.ts are primarily a variable declarations e.g. window, document,
    math and a bunch of similar interface declarations e.g. Window, Document, Math.


    The simplest way to discover what is to type in code that you know works e.g.
    Math.floor and then F12 (go to definition) using your IDE (atom-typescript has
    great support for this).


    Let''s look at a sample variable declaration, e.g. window is defined as:


    ```

    declare var window: Window;

    ```


    That is just a simple declare var followed by the variable name (here window )
    and an interface for a type annotation (here Window interface). These variables
    generally point to some global interface e.g. here is a small sample of the (actually
    massive) Window interface:


    ```

    interface Window extends EventTarget, WindowTimers, WindowSessionStorage, WindowLocals,
    WindowConsole, GlobalEventHandlers, DBEnvironment, WindowBase64 {

    animationStartTime: number;

    applicationCache: ApplicationCache;

    clientInformation: Navigator;

    closed: boolean;

    crypto: Crypto;

    // so on and so forth...

    ```


    You can see here that there is a lot of type information in these interfaces.
    In the absence of TypeScript you would need to keep this in your head. Now you
    can offload that knowledge on the compiler with easy access to it things like
    intellisense.


    There is a good reason for using interfaces for these globals. It allows you to
    add additional properties to these globals without a need to change lib.d.ts .
    We will cover this concept next.


    # Modifying native types


    Since an interface in TypeScript is open ended this means that you can add members
    to the interfaces declared in lib.d.ts and TypeScript will pick up on the additions.
    Note that you need to make these changes in a global module for these interfaces
    to get'
