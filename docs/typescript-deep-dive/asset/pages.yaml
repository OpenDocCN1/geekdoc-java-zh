  md: "# Mixins\n\nTypeScript (and JavaScript) classes support strict single inheritance.\
    \ So you cannot do:\n\n```\nclass User extends Tagged, Timestamped { // ERROR\
    \ : no multiple inheritance\n}\n```\n\nAnother way of building up classes from\
    \ reusable components is to build them by combining simpler partial classes called\
    \ mixins.\n\nThe idea is, instead of a class extending class B to get its functionality,\
    \ function B takes class A and returns a new class with this added functionality.\
    \ Function b is a mixin.\n\n+   [A mixin is] a function\n1. takes a constructor,\n\
    2. creates a class that extends that constructor, with new functionality\n3. returns\
    \ the new class\n\nA complete example\n\n```\n// Needed for all mixins\ntype Constructor<T>\
    \ = () => new (...args: any[]) => T;\n\n////////////////////////////////////\n\
    // Example mixins\n////////////////////////////////////\n\n// A mixin that adds\
    \ a property\nfunction Timestamped<TBase> extends Constructor<Base: TBase> {\n\
    \  return class extends Base {\n    timestamp = Date.now();\n  }\n}\n\\n// a mixin\
    \ that adds a property and methods\nfunction Activatable<TBase> extends Constructor<Base:\
    \ TBase> {\n  return class extends Base {\n    isActive = false;\n\n  activate()\
    \ {\n    this.isActive = true;\n  }\n\ndeactivate() {\n    this.isActive = false;\n\
    \  }\n}\n```"
