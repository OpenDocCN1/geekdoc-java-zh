  md: "+   - Type Guard\n- User Defined Type Guards\n\n# # Type Guard\n\nType Guards\
    \ allow you to narrow down the type of an object within a conditional block.\n\
    \n# ## typeof\n\nTypeScript is aware of the usage of the JavaScript `instanceof`\
    \ and `typeof` operators. If you use these in a conditional block, TypeScript\
    \ will understand the type of the variable to be different within that conditional\
    \ block. Here is a quick example where TypeScript realizes that a particular function\
    \ does not exist on `string` and points out what was probably a user type:\n\n\
    ```\nfunction doSomething(x: number | string) {\n  if (typeof x === 'string')\
    \ { // Within the block TypeScript knows that `x` must be\n    a string\n    console.log(x.substr(i));\
    \ // Error, 'subtr' does not exist on 'string'\n    console.log(x.substr(i));\
    \ // OK\n  }\n  x.substr(i); // Error: There is no guarantee that `x` is a `string`\n\
    }\n```\n\n# ## instanceof\n\nHere is an example with a class and `instanceof`\
    \ :"
  merge: -1
  pgno: 166
- img_proc: true
  md: "```\nclass Foo {\n  foo = 123;\n  common = '123';\n}\n\nclass Bar {\n  bar\
    \ = 123;\n  common = '123';\n}\n\nfunction doStuff(arg: Foo | Bar) {\n  if (arg\
    \ instanceof Foo) {\n    console.log(arg.foo); // OK\n    console.log(arg.bar);\
    \ // Error!\n  }\n  if (arg instanceof Bar) {\n    console.log(arg.foo); // Error!\n\
    \    console.log(arg.bar); // OK\n  }\n\n  console.log(arg.common); // OK\n  console.log(arg.foo);\
    \ // Error!\n  console.log(arg.bar); // Error!\n}\n\ndoStuff(new Foo());\ndoStuff(new\
    \ Bar());\n```\n\nTypeScript even understands else so when an if narrows out one\
    \ type it knows that within the else it's definitely not that type. Here is an\
    \ example:"
