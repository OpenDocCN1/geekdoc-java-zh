  md: "+   * Freshness\n* Allowing extra properties\n* Use Case: React\n\n# # Freshness\n\
    \nTypeScript provides a concept of **Freshness** (also called *strict object literal\
    \ checking*) to make it easier to type object literals that would otherwise be\
    \ structurally type compatible.\n\nStructural typing is **extremely convenient**.\
    \ Consider the following piece of code. This allows you to **conveniently** upgrade\
    \ your JavaScript to TypeScript while preserving a level of type safety:\n\n```\n\
    function logName(something: { name: string }) {\n  console.log(something.name);\n\
    }\nvar person = { name: 'matt', job: 'being awesome' };\\var animal = { name:\
    \ 'cow', diet: 'vegan, but has milk of own species' };\\var random = { note: 'I\
    \ don't have a name property' };\n\nlogName(person); // okay\nlogName(animal);\
    \ // okay\nlogName(random); // Error: property 'name' is missing\n```\n\nHowever\
    \ *structural typing* has a weakness in that it allows you to misleadingly think\
    \ that something accepts more data than it actually does. This is demonstrated\
    \ in the following code which TypeScript will show on error as:\n\n```\nfunction\
    \ logName(something: { name: string }) {\n  console.log(something.name);\n}\n\n\
    logName({ name: 'matt' }); // okay\nlogName({ name: 'matt', job: 'being awesome'\
    \ }); // Error: object literals must only specify known properties. job is excessive\
    \ here.\n```\n\nNote that this *only happens on object literals*. Without this\
    \ error one might look at the call `logName({ name: 'matt', job: 'being awesome'\
    \ })` and think that **logName** would do something useful with `job` where in\
    \ reality it will completely ignore it.\n\nAnother use case is with interfaces\
    \ that have optional members, without such object literal checking, a type would\
    \ check just fine. This is demonstrated below:"
  merge: -1
  pgno: 163
