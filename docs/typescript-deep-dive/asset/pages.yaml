  md: '# Never


    A video lesson on the never type


    Programming language design does have a concept of *bottom* type that is a **natural**
    outcome as soon as you *code flow analysis*. TypeScript does *code flow analysis*
    () and so it needs to reliably represent stuff that might never happen.


    The `never` type is used in TypeScript to denote this *bottom type*. Cases when
    it occurs naturally:


    +   - A function never returns (e.g. if the function has `while(true){}`)

    - A function never returns (e.g. in `function foo(){throw new Error(''Not Implemented'')}`
    the return type of `foo` is `never`)


    Of course you can use this annotation yourself as well


    ```

    let foo: never; // Okay

    ```


    However `never` can only ever be assigned to another never. e.g.


    ```

    let foo: never = 123; // Error: Type number is not assignable to never


    // Okay as the function''s return type is `never`

    let bar: never = (()) => { throw new Error(''Throw my hands in the air like I
    just dont care'') })();();

    ```


    Great. Now let''s jump into its key use case :)


    # Use case: Exhaustive Checks


    You can call never functions in a never context.'
