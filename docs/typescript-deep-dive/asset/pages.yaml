    \ 1. Setup a Node.js project package.json . Quick one : npm init -y\n2. Add TypeScript\
    \ ( npm install typescript --save-dev )\n3. Add node.ts ( npm install @types/node\
    \ --save-dev )\n4. Init a tsconfig.json for TypeScript options ( npx tsc --init\
    \ )\n5. Make sure you have compilerOptions in your tsconfig.json\n\nThat's it!\
    \ Fire up your IDE (e.g. alm -o ) and play around. Now you can use all the built\
    \ in node modules (e.g. import fs = require('fs'); ) with all the safety and developer\
    \ ergonomics of TypeScript!\n\n# Bonus: Live compile + run\n\n+   * Add ts-node\
    \ which we will use for live compile + run in node ( npm install ts-node --save-dev\
    \ )\n* Add nodemon which will invoke ts-node whenever a file is changed ( npm\
