    # Security from the Vendor Perspective


    First, let''s start with the perspective of a software manufacturer (in this example,
    SolarWinds) that distributes software to its customers. When a supply-chain attack
    is carried out, you have to prepare yourself because you will be only the carrier
    of the viral software. Compared to a conventional attack, the damage is amplified
    because you are enabling hackers to open a security hole in thousands of your
    customers. Preventing this requires a stringent approach in your software development
    and distribution process.


    Securing the tools used in your software delivery pipeline is one of the most
    important aspects, because they have access to your internal systems and can maliciously
    modify binaries in your software pipeline. However, this is challenging because
    the number of direct and indirect tools used in software delivery lifecycles is
    constantly increasing and expanding the attack surface.


    # Security from the Customer Perspective


    As a customer of a vendor like SolarWinds, it is essential to develop all elements
    in the value chain, including all of the tools that a developer uses daily. You
    also have to check the binaries generated from your CI/CD system for the possibility
    of modification or vulnerability injection. It is essential to keep an overview
    of all components used with a secure and traceable bill of materials. Ultimately,
    it helps only if you break your products into their constituent parts and subject
    each element to a security review.


    How can you protect yourself as a consumer? The approach that all elements in
    the value chain must be subjected to a critical review also applies here. As shown
    in the SolarWinds case, individual fingerprints and the exclusive use of confidential
    sources do not provide the best protection. The components used must be subjected
    to a deeper security inspection.


    # The Full Impact Graph


    A full impact graph represents all areas of an application that are affected by
    the known vulnerability. Analyzing a full impact graph requires tools to check
    for weak points. These tools can develop their full potential only if they can
    recognize and represent the interrelationships across technology boundaries. Without
    considering a full impact graph, it is easy to focus on just one technology, which
    can quickly lead to dangerous pseudosecurity.'
