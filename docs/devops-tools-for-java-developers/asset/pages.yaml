    Workload management


    Refine health checks and the amount of CPU and memory used to avoid slow or nonresponsive
    functionalities.


    Observability aspects


    Use metrics, logs, and traces to provide visibility into internals of your distributed
    systems and measure its outputs.


    This chapter walks you through these activities and explores their impact at scale.


    # # Building and Pushing Container Images


    Deploying applications to containers requires the Java application artifacts and
    building container images. By leveraging the recommended artifact formats and
    practices shared in Chapter 6, we can focus on producing artifact images.


    Starting with Docker''s appearance in 2013, building container images using Dockerfile
    popular. A Dockerfile is a standardized image format consisting of the operating
    system, application artifacts to be added, and required runtime configurations.
    This file is the blueprint for how your future container will behave. As explained
    in Chapter 3, besides Docker, you can build container images with tools like Podman,
    Buildah and kaniko.


    DevOps methodology relies on good communication among application developers and
    infrastructure engineers, some teams find it best to keep the Dockerfiles at the
    repository root. Moreover, scripts or pipelines can further use that location
    when instrumenting a container image build. In addition to writing your Dockerfile,
    Java-specific options can help you make container images part of your standard
    build processes, such as Eclipse Jube or Jib.'
