  md: "The second purpose of dependencyManagement, listing dependencies that may be\
    \ imported, is accomplished by using the import alongside dependencies of type\
    \ pom. These types of dependencies usually define <dependencyManagement> sections\
    \ of their own, although nothing stops the POMs from adding more sections. POM\
    \ dependencies that define a <dependencyManagement> section and no <dependencies>\
    \ section are known as bill of materials (BOM). Typically, BOM dependencies define\
    \ a set of artifacts that belong together for a particular purpose. Although not\
    \ explicitly defined in the Maven documentation, you can find two kind of BOM\
    \ dependencies:\n\n# Library\n\nAll declared dependencies to the same project\
    \ even they might have different group IDs, and possibly even different versions.\
    \ An example can be seen at helidon-bom, which groups all artifacts from the Helidon\
    \ project.\n\n# Stack\n\nDependencies are grouped by behavior and the synergy\
    \ they bring. Dependencies may belong to disparate projects. See an example at\
    \ helidon-dependencies, which groups the previous helidon-bom with other dependencies\
    \ as Netty, logging, and so on.\n\nLet's keep the helidon-dependencies as a source\
    \ of dependencies. Inspecting this POM, we find dependencies declared inside its\
