  md: 'Container image


    An immutable, executable binary provides all the dependencies and configuration
    required for creating a container. It encompasses all the environment configuration
    and explicitly defines all the resources to which a container will have access
    after it is launched. Images can be thought of as a snapshot of a complete filesystem
    stored as an archive that can be unpacked and run within the context of root filesystem
    changes.


    Base image


    Images can inherit from other images, and many are built from an initial set of
    dependencies and configurations that come from a base image. Commonly used base
    images describe a base operating system and/or include a specific package or set
    of dependencies. A base image is not based on any other image and uses the command
    `scratch` as the first line of the image''s Dockerfile.


    An image that is based on another will specify it inherits from, also known as
    a parent image, in the first line of the Dockerfile. A parent image is not required
    to be a base image.


    Image ID


    When an image is built, it is assigned a unique ID in the form of a SHA-256 hash
    calculated from the contents of the image metadata configuration file.


    Image digest


    A unique ID in the form of a SHA-256 hash calculated from the contents of the
    image manifest file.


    Image manifest


    A JSON file that contains metadata about a container image. It contains the image
    digests of the image metadata configuration file and all of the image layers.


    Image layer


    Images are composed of image layers. Image layers are intermediate images that
    are generated from each command in a Dockerfile. As the commands are executed
    during a build, a corresponding layer is created that consists of the changes
    made from the previous layer. Beginning with a base layer, subsequent layers are
    stacked sequentially, and each layer consists of a delta of changes from the previous
    layer.


    Image tag


    An alias used to point to a specific image binary within an image repository.
    The tag can be set to any text but is generally used to indicate a specific version
    of a named image. A tag is unique to an image binary; however, an image binary
    can have multiple tags. This capability is commonly used along with semantic versioning
    to tag the latest minor and/or patch version as the latest version available.'
