  md: '# Determining the Metadata


    The build environment has no shortage of information that can be converted into
    metadata and packaged alongside an artifact. A good example is the build timestamp
    that identifies the time and when the build produced the artifact. Many timestamp
    formats can be found, but I recommend using ISO 8601, whose formatted representation
    using java.text.SimpleDateFormat is yyyy-MM-dd''TH:mm:ssXXX—useful when the captured
    timestamp relies on java.util.Date. Alternatively, the java.time.format.DateTimeFormatter.ISO_OFFSET_DATE_TIME
    may be used if the captured timestamp relies on java.time.LocalDateTime. The build''s
    OS details may be of interest, as well as JDK information such as version, ID,
    and vendor. Luckily for us, these bits of information are captured by the JVM
    and exposed via System properties.


    Consider the artifact''s ID and version as well (even though these values are
    usually encoded in the artifact''s filename) as a precaution in case the artifact
    were to be renamed at some point. SCM information is also crucial. Useful information
    from source control includes the commit hash, tag, and branch name. Additionally,
    you may want to capture specific build information such as the user who runs the
    build; the tool''s name, ID; and the hostname and IP address of the build machine.
    key/value pairs are likely the most significant and commonly found metadata. However,
    you may select additional key/value pairs required by tools and systems that consume
    the produced artifacts.


    ![](img/50358b52af39b0dcf9d284d547c73fdc_152_0.png)


    > I can''t stress enough how important it is to check your team and organization''s
    policies regarding access and visibility of sensitive data. Some of the key/value
    pairs mentioned before may be deemed a security risk if exposed to third parties
    or external consumers, though they may be of high importance to internal consumers.


    # Capturing Metadata


    We must find a way to gather the metadata with our build tool of choice after
    we have determined which metadata we need to capture. Some of the key/value pairs
    can be obtained directly from the environment, system settings, and command flags
    exposed by the JVM as environment variables or System properties. Additional properties
    may be exposed by the build tool itself, whether they are defined as additional
    command-line arguments or as configuration elements in the tool''s configuration
    settings.


    Let''s assume for the moment that we need to capture the following key/value pairs:


    +   - JDK information such as version and vendor

    - OS information such as name, arch, and version'
