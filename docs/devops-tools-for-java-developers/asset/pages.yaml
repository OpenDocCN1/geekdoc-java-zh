    # Serverless


    This chapter began by looking at monolithic applications and architectures, usually
    pieced together by components and tiers clustered into a single, cohesive unit.
    Changes or updates to a particular piece require updating and deploying the whole.
    Failure at one particular place could bring down the whole as well. Then we have
    moved to microservices. Breaking the monolith into smaller chunks that be'
  merge: -1
  pgno: 117
- img_proc: true
  md: 'updated and deployed individually and independently of one another should take
    care of the previously mentioned issues, but microservices bring a host of other
    issues.


    Before, it was enough to run the monolith inside an application server hosted
    on big iron, with a handful of replicas and a load balancer for good measure.
    This setup has scalability issues. With the microservices approach, we can grow
    or collapse the mesh of services depending on the load. That boosts elasticity,
    but we now have to coordinate multiple instances and provision runtime environments,
    load balancers become a must, API gateways are needed, network latency reries
    its ugly head, and did I mean distributed tracing? Yes, those are a lot of things
    to be aware of and manage. But what if you didn''t have? What if someone else
    took care of the infrastructure, monitoring, and “minutiae” required to run applications
    at scale? This is where the serverless approach comes in: where you concentrate
    on the business logic and let the serverless provider deal with everything.


    While distilling a component into smaller pieces, one thought should come to mind:
    “What’s the smallest piece of code I can turn this component into?” If your answer
    is a Java class with a handful of methods and perhaps a couple of injected collaborators/services,
    you''re close, but you''re not there yet. The smallest piece of reusable code
    is, as a matter of fact, a single method. Picture a microservice defined as a
    single class that performs the following steps:


    +   1. Reads the input arguments and transforms them into a consumable format
    required by the next step

    2. Performs the actual behavior required by the service, such as issuing a query
    to a database, indexing, or logging

    3. Transforms the processed data into an output format


    Now, each of these steps may be organized in separate methods. You may soon realize
    that some of these methods are reusable as is parameterized. A typical way to
    solve this would to provide a common super type among microservices. This creates
    a strong dependency among types, and for use cases, that''s all right. But for
    others, updates to the common code have to happen as soon as possible, in a versioned
    fashion, without disrupting currently running code, so I''m afraid we may need
    an alternative.


    With this scenario in mind, the common code could be provided as a set of methods
    that can be invoked independently of one another, with their inputs and outputs
    in such a way that you establish a pipeline of data transformations, then we arrive
    at what are now known as functions. Offerings such as function as a service (FaaS)
    are a common subject among serverless providers.'
