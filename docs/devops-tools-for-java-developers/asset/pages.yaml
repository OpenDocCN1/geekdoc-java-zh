  md: '+   - System monitoring crash recovery

    - Instruments for defining rules and constraints on container placement and performance.


    Kubernetes is an open source platform automating deployment, scaling, and management
    of containerized workloads. With Kubernetes, you can organize your deployments
    in a way that the platform can spin up or remove instances to match the load demand.
    Furthermore, Kubernetes can replace and reschedule containers when nodes die.


    Features like portability and extensibility increased the popularity of Kubernetes,
    stimulating community contributions and vendors'' support. The proven success
    of Kubernetes to support increasingly complex categories of applications continues
    to enable enterprise transition to both hybrid cloud and microservices.


    With Kubernetes, you can deploy your application(s) in such a way to have run
    more instances of your service if load increases, stop instances when load decreases,
    or spin up new instances when existing ones fail. As a developer, you want to
    deploy to Kubernetes, you need access to a Kubernetes cluster. A cluster consists
    of a set of nodes that run containerized applications, as shown in Figure 8-1.


    ![](img/50358b52af39b0dcf9d284d547c73fdc_228_0.png)


    Every cluster has at least one worker node, and each worker hosts Pods. Within
    a cluster, namespaces are used to isolate groups of resources (Pods included).
    Pods are the components in direct contact with your running containers, instantiated
    from container images previously built and pushed to a container registry.'
  merge: -1
