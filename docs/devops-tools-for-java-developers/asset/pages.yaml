  md: "The rolling deployment is the standard default deployment to Kubernetes if\
    \ you do not fill in a strategy in the object spec.\n\nIf your application is\
    \ using a database, you should consider the impact of having two application versions\
    \ running simultaneously. Another disadvantage with this strategy is that during\
    \ the upgrade, there will be a mix of old and new versions of the application.\
    \ If you want to keep the zero downtime and avoid mixing application versions\
    \ in production, take a look at the blue/green deployment technique.\n\nBlue/green\
    \ deployment is a strategy that reduces downtime and risk of failure by running\
    \ two identical (production) environments named Blue and Green; When using this\
    \ deployment strategy, no new instances will be server requests until all become\
    \ available; at that moment, all instances become instantly unavailable. You can\
    \ achieve this by orchestrating services and routing requests.\n\n![](img/50358b52af39b0dcf9d284d547c73fdc_239_0.png)\n\
    \n| 1. Traffic is routed to Blue. | 2. Green is deployed. | 3. Route traffic to\
    \ Green. |\n| :--- | :--- | :--- |\n| Blue | Green | Blue | Green |\n| LoadBalancer\
    \ | LoadBalancer | LoadBalancer |\n\nFigure 8-2. Blue/green strategy\n\nLet's\
    \ observe how we can implement blue/green deployments by using standard Kubernetes\
    \ objects:\n\n+   - Apply the blue version of the microservice having the label\
    \ version: blue. We will associate the convention of blue deployment by using\
    \ the value of the label\n\n```\nkubectl -f blue_deployment_sample.yml\napiVersion:\
    \ apps/v1\nkind: Deployment\nmetadata:\n  creationTimestamp: null\nlabels:\n \
    \ app: demo\\  version: blue\n```"
