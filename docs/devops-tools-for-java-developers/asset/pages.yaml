  md: '# Summary


    We covered a lot of ground in this chapter, starting with a traditional monolith,
    breaking it into smaller parts with reusable components that can be deployed independently,
    known as microservices, and going all the way to the smallest deployment unit:
    a function. Trade-offs occur along the way, as microservice architectures are
    inherently complex, composed as they are of more moving parts. Network latency
    becomes a real issue and must be tackled accordingly. Other aspects such as data
    transactions become more complex as their span cross service boundaries, depending
    on the case. The use of Java and native executable mode yields different results
    and requires to be customized setup, each with its pros and cons. My recommendation,
    dear reader, is to evaluate, measure, and select a combination; keep tabs on numbers
    and service level agreements (SLAs), because you may need to reevaluate decisions
    along the road and make adjustments.


    Table 4-1 summarizes the measurements obtained by running the sample application
    on both Java and native image modes, on my local environment and remote, for each
    one of the candidate frameworks. The size columns show the deployment unit size,
    while the time columns depict the time from startup up to the first request.


    | Framework | Java - size | Java - time | Native -size | Native - time |

    |---|---|---|---||

    | Spring Boot | 17 MB | 2200 ms | 78 MB | 90 ms |

    | Micronaut | 14 MB | 500 ms | 60 MB | 20 ms |

    | Quarkus | 13 MB | 600 ms | 47 MB | 13 ms |

    | Helidon | 15 MB | 2300 ms | 94 MB | 50 ms |


    As a reminder, you are encouraged to take your own measurements. Changes to the
    hosting environment, JVM version and settings, framework version, network conditions,
    and other environment characteristics will yield different results. The numbers
    shown should be taken with a grain of salt, never as authoritative values.'
