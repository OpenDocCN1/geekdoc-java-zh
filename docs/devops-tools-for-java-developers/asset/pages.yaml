  md: '# Advanced Training on Secure Coding


    A misconception exists that security can be learned in passing and that everyone
    has access to the necessary materials. Typically, a list of secure coding guidelines
    is in a public folder somewhere. In addition, the OWASP Top 10 is often published
    to the general public. As a rule, employees do not read documents or, at best,
    skim them. Often, after a while, teams no longer know where such documents are,
    let alone what they should get them from. Admonitions to encourage reading the
    guidelines are not very helpful if companies cannot create extra time to focus
    on secure coding.


    # Milestones for Quality


    Quality gates in development help check compliance with quality requirements.
    Analogous to the definition of done (DoD), the team-wide definition of when a
    task can be viewed as complete, quality gates should not be available only in
    stationary paper form. Ideally, automated checks are integrated into the CI/CD
    pipeline through static code analyses (SAST) or the evaluation of all dependencies.


    For developers, however, it can be helpful to receive feedback on the code and
    its dependencies in addition to feedback from the CI/CD pipeline during programming.
    Language- and platform-dependent IDE plug-ins and separate code analysis tools
    are available, such as FindBugs/SpotBugs, Checkstyle, and PMD. When using JFrog
    Xray, the IDE plug-in can be used to make it easier to compare against known vulnerabilities
    and compliance issues.


    An additional upstream process for checking the code in the IDE pursues the goal
    of familiarizing developers with security aspects during development. As a result,
    the code security is improved at the points identified by the plug-in and in the
    entire code since developers are given a security orientation. Another side effect
    is the reduction in the number of false positives on the build server. The latter
    is exceptionally high for security quality gates, security gaps in the code are
    often context-dependent and require manual verification, which leads to a considerable
    increase in the development effort.


    # The Attacker''s Point of View


    Evil user stories (also called bad user stories) present the desired functionality
    from an attacker''s perspective. Analogous to user stories, they are designed
    so that their focus is not on the technical implementation. Accordingly, people
    with a limited technical background in IT security can write bad user stories.
    However, this increases the effort required to generate tasks from the possibly
    unspecific (bad) user stories.


    Ideally, bad user stories try to depict the attack surface. They enable the development
    team to process identified attack methods in a familiar workflow. This creates'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'awareness of possible attack vectors, but these are limited. Evil user stories
    are limited not only by the knowledge and experience of their respective authors
    and their imagination, but also by the developer''s ability to fend off the attack
    vector in the context of the sprint. It''s not just about whether the developers
    develop the right damage-control strategy, but also about correctly and comprehensively
    identifying the use case in code.


    Like conventional user stories, the evil variants are not always easy to write.
    Teams with little experience in developing secure software, in particular, can
    encounter difficulties creating nasty user stories. If a SecM is on the team,
    that person should take on the task or offer support. Teams without a SecM should
    either look for external expertise or plan a structured process for creating the
    evil user stories.


    # Methods of Evaluation


    To establish security as a process within Agile development, regular code reviews
    must be carried out, with the focus on the security level of the code, both component
    and across segments. Ideally, errors that are easy to avoid and can security breaches
    be identified and corrected as part of the CI/CD pipeline through quality gates
    and automated tests. In this case, component-by-component test is primarily concerned
    with the investigation of the attack surface of the respective component and the
    weakening of attack vectors. A cheat sheet for analyzing the attack surface can
    be found on the OWASP Cheat Series on GitHub.


    The teams must regularly redefine the attack surface, as it can change with each
    development cycle. The cross-component check is used to monitor the attack surface
    of the overall product, as it can also change with every development cycle. Ultimately,
    only a cross-component view enables the search for attack vectors that result
    from interactions between components or dependencies.


    If SecMs are not available, a security assessment can be carried out through a
    structured approach and just training the team. The OWASP Cornucopia card game
    can, among other things, promote such an approach. The players try to apply the
    attack scenarios on the cards to a domain selected in advance by the team or,
    if necessary, to individual methods, such as the codebase. The team must decide
    whether the attack scenario of the card played is conceivable. Therefore, the
    focus is on identifying attack vectors; because of constraints, mitigation strategies
    should be discussed elsewhere. The winner of the card game is the one who can
    successfully play the most difficult cards. The team must document the resulting
    security analysis at the end.


    One benefit of Cornucopia is it increases awareness of code vulnerabilities across
    the team. The game also improves the developer''s expertise in IT security. The
    focus'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'is the ability of the developer and thus reflects Agile guidelines. Cornucopia
    sessions are an excellent tool to generate evil user stories afterward.


    The problem with Cornucopia sessions is that they present especially inexperienced
    teams with a steep learning curve at the beginning. There is also a risk that
    the team will incorrectly discard a potential attack vector. If the preparation
    is poor (e.g., components are too large, or the team doesn''t have enough technical
    knowledge about possible attack vectors), Cornucopia can be inefficient in terms
    of time. Therefore, it is advisable to examine small independent components and,
    if necessary, to consult security experts.


    # Be Aware of Responsibility


    Overall, developers should not allow the code security scepter to be taken out
    of their hands. Ideally, the team should jointly insist on sufficient time and
    financial resources to implement basic security aspects.


    Current developers will largely define and shape the world for years to come.
    Because of expected digitization and networking, security must not fall victim
    to budget and time constraints. According to the Agile Manifesto, the codebase
    remains the product of the team responsible for the outcome.


    # Summary


    With the proliferation of supply chain attacks in the industry, addressing security
    is more critical than ever for the success of your project and organization. The
    best way to mitigate vulnerabilities quickly is to shift left and start addressing
    security as a primary concern from day one of every software development project.
    This chapter introduced you to the basics of security, including various analysis
    approaches, such as SAST, DAST, IAST, and RASP. You also learned about basic scoring
    systems like the CVSS. With this knowledge, you will be able to put the right
    quality gates and criteria in place to improve the security of every project that
    you work on going forward.'
