  md: '# The Hidden Cost of Manual Updates


    Implementing continuous update best practices is not free, and often it can seem
    more cost-effective to delay automation and continual manual processes. In particular,
    doing automated testing, treating configuration like code, and automating deployment
    are all important, but costly to implement.


    However, what is the hidden cost of not automating your deployment? Manual deployments
    are fraught with errors and mistakes that cost time and effort to troubleshoot
    and business loss when they negatively impact customers. What is the cost of having
    production errors that persist for hours as staff is brought in to troubleshoot
    the issue on a live system?


    In the case of Knight Capital, where the answer turned out to be $10 million per
    minute of system failure, would you trust manual updates?


    # Case Study: Knight Capital


    Knight Capital is an extreme case of a software bug undetected, causing issues
    in production, and causing a huge amount of financial loss. However, the interesting
    thing about this bug is that the core issue was mistakes in the deployment process,
    which was both infrequent and manual. If Knight Capital were practicing continuous
    deployment, they would have avoided a mistake that ended costing it $440 million
    and control of the company.


    Knight Capital Group was a market-making trader specializing in high-volume transactions,
    and through 2011 and 2012 its trading in US equities represented approximately
    10% of the market volume. The company had several internal systems that handled
    trade processing, one of which was called Smart Market Access Routing System (SMARS).
    SMARS acted as a broker, taking trading requests from other internal systems and
    executing them in the market.


    To support a new Retail Liquidity Program (RLP) that was set to launch on August
    1, 2012, Knight Capital upgraded its SMARS system to add new trading functionality.
    It decided to use the API flag for a deprecated function Power Peg that was meant
    for internal testing only. This change was thought to have been successfully deployed
    to all production servers in the week leading up to the RLP launch.


    At 8:01 A.M. EST, the morning of August 1 started with something suspicious, but
    sadly ignored, email warnings about errors on pre-market trading orders that referenced
    SMARS and warned “Power Peg disabled.\ Once trading commenced at 9:30 A.M. EST,
    SMARS immediately started executing large volume of suspicious trades that repeatedly
    bought high (at offer) and sell low (at bid), immediately losing on the spread.
    Millions of these transactions were queued'
  merge: -1
  pgno: 317
- img_proc: true
  md: 'though the amounts were small (15 cents on every pair of trades), the losses
    piled up extremely quickly.


    In a business where seconds can be costly, minutes can wipe out weeks of earnings,
    and an hour is a lifetime, Knight Capital lacked an emergency response plan. During
    this 45-minute period, it executed 4 million orders for trading 397 million shares
    of 154 stocks. This gave the company a net long position of 3.4 billion and a
    net short position of 3.15 billion. After getting 6 of the 154 stocks reversed
    and selling the remaining positions, it was left with a net loss around $468 million.
    This was a very tough period for Knight Capital.


    Backtracking to the root cause of this problem, seven of the eight production
    servers were correctly upgraded with the new RLP code. The last server had the
    old Power Peg logic enabled on the same API flag, which explains the warning emails
    earlier in the morning. For every request that this eighth server, an algorithm
    designed for internal testing was run that executed millions of inefficient trades
    designed to quickly bump up the price of the stock.


    However, in troubleshooting this problem, the technical team erroneously thought
    that there was a bug on the newly deployed RLP logic and reverted the code on
    the other servers, essentially breaking 100% of the transactions and exacerbating
    the problem.


    While Knight Capital did not go entirely bankrupt from this, it had to give up
    70% of control of the company for $400 million bailout of its position. Before
    the end of the year, this turned into an acquisition by a competitor, Getco LLC,
    and the resignation of CEO Thomas Joycece.


    So, what happened to Knight Capital, and how can you avoid a disaster like this?
    The next sidebar for some additional continuous update best practices.


    # Continuous Update Best Practices


    +   - Frequent updates

    - Problem: If you only occasionally update your system, chances are that you are
    not very good (or efficient) at this and mistakes will be made. Knight Capital
    did not have the proper automation or control checks in place to reliably make
    production changes and was a continuous update disaster waiting to happen.

    - Solution: Update often and automate always. This will build the organizational
    muscle memory so that simple updates become routine and complex updates are safe.'
  merge: -1
  pgno: 318
- img_proc: true
  md: '+   - State awareness

    - Problem: The target state (the flags in the Knight Capital example) can affect
    the update process (and any subsequent rollbacks).

    - Solution: Know and consider target state when updating. Reverting might require
    reverting the state.


    # Continuous Update Best Practices


    Now that you have seen the dangers of not adopting continuous update best practices
    from a variety of companies in different areas of the technology industry, it
    should be obvious why you should start implementing or continue to improve your
    continuous deployment infrastructure.


    The following is the list of all the continuous update best practices along with
    the case studies that go into them in more detail:


    +   - Frequent updates

    - The only way to get good at updating is to do it a lot.

    - Case studies: iOS App Store, Knight Capital.

    - Automatic updates

    - And if you are updating a lot, automating becomes cheaper and less error prone.

    - Case study: iOS App Store.

    - Automated testing

    - The only way to make sure you are deploying quality is to test everything on
    every change.

    - Case studies: Java six-month release cadence, 2020 Cloudflare backbone outage.

    - Progressive delivery

    - Avoid catastrophic failures by deploying to a small subset of production with
    a rollback plan.

    - Case studies: 2013 Cloudflare router rule outage, 2019 Cloudflare regex outage.

    - State awareness

    - Don’t assume that the code is the only thing that needs to be tested; state
    exists and can wreak havoc in production.

    - Case study: Knight Capital.'
  merge: -1
  pgno: 319
- img_proc: true
  md: '+   • Observability

    — Don’t let your customers be the ones to notify you that you are down!

    — Case studies: 2019 Cloudflare regex outage, 2020 Cloudflare backbone outage.

    • Local rollbacks

    — Edge devices are typically numerous and hard to fix after a bad update hits,
    so always design for a local rollback.

    — Case study: 2013 Cloudflare router rule outage.


    Now that you are armed with knowledge, it is time to start convincing your coworkers
    to adopt best practices today, before you become the next Knight Capital “Nightmare”
    of the high-tech industry. Making headlines is great, but do it as an elite performer
    of the DevOps industry rather than on the front page of the Register. Don’t try
    to boil the ocean, but small continuous improvement initiatives will, eventually,
    get your organization to continuous updates. Good luck!'
