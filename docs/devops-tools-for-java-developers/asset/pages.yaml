    As you can see, there are actually five dependencies! However, four of them define
    an additional <optional> while two define a different value for <scope>. Dependencies
    marked as <optional> may be required for compiling and testing the producer (commons-logging
    in this case) but not necessarily for consumers; this is determined on a case-by-case
    basis.


    It''s time to discuss scopes now that we see them once again. Scopes determine
    whether a dependency is to be included in the classpath, as well as its limit
    its transitivity. Maven defines six scopes as follows:


    # compile


    +   The default scope, if none is specified, as we saw earlier. Dependencies in
    this scope will be used for all classpaths in the project (compile, runtime, test)
    and will be propagated to consuming projects.


    # provided


    +   Like compile, except that it does not affect the runtime classpath nor is
    it transitive. Dependencies set in this scope are expected to be provided by the
    hosting environment, as is the case for web applications packaged in WARs and
    launched from within an application server.


    # runtime


    +   This scope indicates the dependency is not required for compilation but for
    execution. Both the runtime and test classpaths include dependencies set in this
    scope, while the compile classpath is ignored.


    # test


    +   Defines dependencies required for compiling and running tests. This scope
    is not transitive.


    # system


    +   Similar to provided except that dependencies must be listed with an explicit
    path, relative or absolute. Therefore, this scope is seen as a bad practice and
    should be avoided at all costs. For a handful of use cases, it may come in handy,
    but you must bear the consequences. At best, it''s an option to the experts—in
    other words, imagine that this scope does not exist at all.


    # import


    +   Applies only to dependencies of type pom (the default is jar if not specified)
    and can be used only for dependencies declared inside the <dependencyManagement>'
