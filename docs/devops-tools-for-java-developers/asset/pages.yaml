  md: 'First, it is important to map out your build process, to determine what you
    need from your build script in order to gain the most benefit. To build a Java
    project, at the bare minimum you need to specify the following:


    Java version

    The version of Java required to compile the project


    Source directory path

    The directory that includes all of the source code for the project


    Destination directory path

    The directory where compiled class files are expected to be placed


    Names, locations, and versions of needed dependencies

    The metadata necessary to locate and gather any dependencies required by your
    project


    With this information, you should be able to execute a minimal build process with
    the following steps:


    +   1. Collect any needed dependencies.

    2. Compile the code.

    3. Run tests.

    4. Package your application.


    The best way to show how to massage your build process into a build script is
    by example. The following examples demonstrate the use of three of the most common
    build tools to script the minimal build process described for a simple Hello World
    application. In no way do these examples explore all of the functionality available
    in these tools. They are simply as a crash course to help you either begin to
    understand your existing build script or write your first build script to benefit
    from a full CI solution.


    In evaluating a build tool, bear in mind the actual process your project requires
    to complete a build. Your project may require scripting additional steps that
    are not shown here, and one tool may be more suited than another to accomplish
    this. It is important that the tool you choose helps you programmatically define
    and accelerate the build process your project requires rather than arbitrarily
    force you to modify your project to fit the requirements of the tool. That said,
    when you learn the capabilities of a tool, reflect on your project and be mindful
    of changes that would benefit your team. This is most important with established
    projects. Changes to the process, however well-intentioned, can be painful for
    a development team. They should be made only intentionally, with a clear understanding
    of the reason for the change and, of course, a clear benefit.'
