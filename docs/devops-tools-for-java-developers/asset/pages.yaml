    # Artifact Publication


    Up to now, I''ve discussed how artifacts and dependencies may be resolved, often
    from locations known as repositories, but what is a repository, and how do you
    publish artifacts to it? In the most basic sense, an artifact repository is file
    storage that keeps track of artifacts. A repository collects metadata on each
    published artifact and uses that metadata to offer additional capabilities such
    as search, archiving, access control lists (ACLs), and tools. Tools can harness
    this metadata to offer other capabilities on top such as vulnerability scanning,
    metrics, categorization, and more.


    We can use two types of repositories for Maven dependencies, those dependencies
    that can be resolved by GAV coordinates: local and remote. Maven uses a configure
    directory found in the local file system to keep track of dependencies that have
    been resolved. These dependencies may have been downloaded from a remote repository
    or directly placed there by the Maven tool itself. This directory is typically
    referred to as Maven Local, and its default location is .m2/repository, found
    at the home directory of the current user. This location is configurable. On the
    other side of the spectrum are remote repositories, which are handled by repository
    software as Sonatype Nexus Repository, JFrog Artifactory, and others. The most
    well-known remote repository is Maven Central, which is the canonical repository
    for resolving artifacts.


    Let''s discuss how we can publish artifacts to local and remote repositories.


    # Publish to Maven Local


    Maven offers three ways to publish artifacts to the Maven Local repository. Two
    are explicit, and one is implicit. We''ve already covered the implicit one—it
    whenever Maven resolves a dependency from a remote repository; as a result, a
    copy of the artifact and its metadata (the associated pom.xml) will be placed
    in the Maven Local repository. This behavior occurs by default since Maven uses
    Maven Local as a cache for requesting artifacts over the network all over again.


    The other ways of publishing artifacts to Maven Local are by explicitly "installing"
    into the repository. Maven has a set of lifecycle phases, of which install is
    one. This process is well-known by Java developers, as it''s used (and abused)
    to compile, test, package, and install artifacts to Maven Local. The lifecycle
    follows a predefined sequence


    ```

    Available lifecycle phases are: validate, initialize, generate-sources, process-sources,
    generate-resources, process-resources, compile, process-classes, generate-test,
    process-test-sources, generate-test-resources, process-test-resources, test-compile,

    ```'
