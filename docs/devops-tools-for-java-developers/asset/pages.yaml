  md: 'When you work with Kubernetes, you are using a set of objects that are validated
    and accepted by the system. To work with Kubernetes objects, you need to use the
    Kubernetes API. Nowadays it''s possible to instrument Kubernetes deployments by
    using visual helpers, command-line interfaces, or Java add-ons like Decorate and
    JCube to generate and deploy Kubernetes manifests.


    # Local Setup for Deployment


    As a developer, you are used to configuring a local setup to implement application
    features. Typically, this local setup involves having access to a version control
    system, and installing and configuring the following:


    +   * A JDK

    * Maven or Gradle

    * An IDE like IntelliJ IDEA, Eclipse, or Visual Studio for your code

    * Optionally, a database or middleware that integrates with your code

    * One or more tools for building, running, and pushing container images: Docker,
    Podman, Buildah, JCube, etc.

    * A Kubernetes development cluster: minikube, kind, or Red Hat CodeReady Containers.
    For development purposes, Docker Desktop also offers a single-node Kubernetes
    cluster that runs locally within your Docker instance. Rancher Desktop is another
    great tool... If running a local development cluster consumes too many resources,
    you may prefer to have development namespaces in Kubernetes cluster(s) or use
    an already provisioned one like Developer Sandbox for Red Hat OpenShift.


    Before creating any Kubernetes resources, let''s summarize some Kubernetes concepts:


    +   * A set of nodes where you can instruct Kubernetes on deploying containers.


    +   * A Kubernetes object responsible for isolating groups'' resources based on
    on different permissions.


    +   * Interaction with the Kubernetes API requires a form of authentication managed
    through users.


    +   * A specific combination that contains a Kubernetes cluster, a user, and a
    namespace.'
