    # # Static and Dynamic Security Analysis


    Two main types of security analysis exist: static application security testing
    and dynamic application security testing. Let''s examine what these mean and how
    the two approaches differ.


    # # Static Application Security Testing


    Static application security testing (SAST) analyzes an application at a specific
    point in time. The focus is on recognizing and localizing the known vulnerabilities.


    SAST is a so-called clear-testing process in which you look at the system internals
    to do the analysis. For this procedure, you need have access to the source code
    of the application to be tested. However, an operational runtime environment does
    not have to available. The application does not have to be executed for this procedure,
    which is why the term SAST is also used. Three types of security threats can be
    identified using SAST:


    +   * Does the security code have gaps in the functional area that allow, "tainted
    code" to be smuggled in? These are lines that can infiltrate malware.

    * Do any source code lines allow you to connect to files or certain object classes?
    The focus is on detecting and preventing the introduction of malware.

    * Do gaps exist on the application level that you interact with other programs
    unnoticed


    However, it should be noted that the analysis of the source code is itself a complex
    matter. The area of static security analysis also includes the tools that enable
    you to determine and evaluate all direct and indirect dependencies.


    As a rule, various SAST tools should check the source code at regular intervals.
    The source code scanners must also be adapted to your organizational needs with
    an initial implementation to adjust the scanner to your respective domain. The
    Open Web Application Security Project (OWASP) Foundation offers assistance; it
    not only lists typical security vulnerabilities, but also recommends suitable
    SAST tools.'
  merge: -1
