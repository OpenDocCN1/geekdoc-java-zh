  md: 'file merging: the conflicting files were analyzed via a difference (diff) algorithm,
    and any conflicting changes were presented to the user to resolve.


    By delaying the resolution of conflicting changes to a check-in, CVS allowed multiple
    developers to freely modify and refactor a large codebase without being blocked
    on other changes to the same files. This not only increases developer productivity,
    but also allows for the isolation and testing of large features, which can later
    be merged into an integrated codebase.


    The most popular second-generation SCM is currently Apache Subversion, which is
    designed as a d-replacement for CVS. It offers several advantages over CVS, including
    tracking commits as a single revision, which avoids file-update collisions that
    can corrupt the CVS repository state.


    The third generation of version control is distributed version control systems
    (DVCS). In a DVCS, every developer has a copy of the entire repository with the
    full history stored locally. Just as in a second-generation version control system,
    you check out a copy of the repository, make changes, and check it back in. However,
    to integrate those changes with other developers, you sync your entire repository
    in a peer-to-peer fashion.


    Several early VCS systems existed, including GNU Arch, Monotone, and Darcs, but
    DVCS became popularized by Git and Mercurial. Git was developed as a direct response
    to the Linux team''s need for a stable and reliable version control system that
    could support the scale and requirements for open source operating system development,
    and it has become the facto standard for both open source and commercial version
    control system usage.


    DVCSs offer several advantages over server-based version control:


    # Working entirely offline


    Since you have a local copy of the repository, checking code in and merging, and
    managing branches can be all done without a network connection.


    # No single point of failure


    Unlike a server-based SCM, where only one copy of the entire repository with full
    history exists, a DVCS creates a copy of the repository on every developer''s
    machine, increasing redundancy.


    # Faster local operations


    Since most version control operations are local to the machine, they are much
    faster and not affected by network speed or server load.'
