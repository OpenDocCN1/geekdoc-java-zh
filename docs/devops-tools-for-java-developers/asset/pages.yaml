    # Android Device Fragmentation


    The iOS ecosystem is tightly controlled by Apple, which limits the number of hardware
    models available, the variations in screen size, and the set of hardware sensors
    and features on its phones. Since 2007 when the first iPhone debuted, only 29
    different devices have been produced, only 7 of which are currently sold.


    In contrast, the Android ecosystem is open to a plethora of device manufacturers
    who customize everything from the screen size and resolution to the processor
    and hardware sensors, and even produce form factors like foldable screens. There
    are over 24,000 different devices from 1,300 manufacturers, which is 1,000 times
    more fragmentation than for iOS devices. This makes testing for Android platforms
    much more difficult to execute.


    When it comes to fragmentation, several key differences make it hard to uniformly
    test different Android devices:


    # Android version


    Android device manufacturers do not always provide updates for older devices to
    the latest Android version, so users may be stuck on old Android OS versions until
    they buy a new device. The drop-off in use of old Android versions is gradual,
    with active devices still running Android 4.x releases that are more than seven
    years old, including Jelly Bean and KitKat.'
