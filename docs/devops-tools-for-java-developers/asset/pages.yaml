    Vulkan is a newer graphics API that modern graphics chipsets support. It has the
    advantage of being portable between desktop and mobile devices, allowing for easier
    porting of desktop code as computing platforms continue to converge. Also, it
    allows an finer level of control over threads and memory management, and an asynchronous
    API for buffering and sequencing commands across multiple threads, making better
    use of multicrocessors and high-end hardware.


    Since Vulkan is a newer API, adoption has not been as quick as OpenGL ES; however,
    64% of Android devices have some level of Vulkan support. According to Google''s
    device statistics visualized in Figure 9-6, this is split between Vulkan 1.1,
    which is supported by 42% of devices, and the remaining 22% of devices that support
    only the Vulkan 1.3 API level.


    Similar to hardware sensor testing, a large variety of 3D chipsets are implemented
    by different manufacturers. Therefore, the only way to reliably test for bugs
    and performance issues in your application is to execute device testing on different
    phone models, covered in the next section.'
