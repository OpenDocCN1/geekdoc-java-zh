    # Continuous Testing on Parallel Devices


    The preceding section discussed the large amount of fragmentation in the Android
    device ecosystem. This is forced by technological factors like the Android OS
    architecture as well as the complex ecosystem of OEMs and SoC vendors. Also, the
    sheer popularity of the Android platform, with 1,300 manufacturers producing over
    24,000 devices, creates a continuous testing and deployment challenge.


    Device emulators are great for development and basic testing of applications,
    but cannot possibly simulate the complex interactions of unique hardware configurations,
    device drivers, custom kernels, and real-world sensor behavior. Therefore, a high
    level of manual and automated testing on devices is required to ensure a good
    experience for end users.


    Two basic approaches are used for hardware testing at scale. This is the first
    to build your own device lab with shared devices. This is a practical approach
    to get started with testing, since you likely have a large collection of Android
    devices available that could be put to use with proper infrastructure and automation.
    However, depending on the number of device configurations you want to support,
    this can be quite a large and expensive endeavor. Also, the ongoing maintenance
    and upkeep for a large device farm can be costly in both materials and labor.


    The second option is to outsource your device testing to a cloud service. Given
    the advances in remote control of Android devices and stability of the platform,
    it is convenient to select your matrix of devices and have your automated tests
    fired off in the cloud. Most cloud services offer detailed screenshots and diagnostic'
