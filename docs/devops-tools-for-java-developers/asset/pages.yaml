- img_proc: true
  md: 'Solution Design edge devices to store the last known good configuration and
    restore to that in the case of an update failure. This preserves network connectivity
    for subsequent network fixes.


    # 2019 Cloudflare regex outage


    By 2019, Cloudflare had grown to host 16 million internet properties, serve 1
    billion IP addresses, and in totality power 10% of the Fortune 1000 companies.
    The company had a very good run of six years with no global outages until 13:42
    UTC on July 2 when Cloudflare-proxied domains started returning 502 Bad Gateway
    errors and remained down for 27 minutes.


    This time the root cause was a bad regular expression (regex), shown in Example
    10-2. When this new rule was deployed to the Cloudflare web application firewall
    (WAF), it caused the CPU usage to spike on all cores handling HTTP/HTTPS traffic
    worldwide.


    # Example 10-2. The regular expression that caused Cloudflare''s outage


    ```

    (?<:\''|"|\|\|(?:nan|inf|infinity|false|null|undefined|symbol|math)|\w|\W|\S|\s|[^]|\d|\D))*\*(?:.*=\*)

    ```


    Like any regular expression, no human is capable of reading and understanding
    the series of unintelligible symbols, and has no chance of verifying the correctness
    wisely. In retrospect, it is obvious that the buggy part of the regex is \*(?:.*=\*).
    Part of this is a noncapturing group, for the purposes of this bug, it can be
    simplified to \*(?:.*=\*). The use of a double, non-optional wildcard (\.\*\*)
    is known to be a performance issue with regular expressions since they must perform
    backtracking that gets super harder as the length of the input to be matched increases.


    Given the difficulty of manually verifying bugs that get deployed to global infrastructure,
    you would think Cloudflare would have learned from its 2013 outage and implemented
    progressive delivery. In fact, it had implemented a complex progressive delivery
    system that involved three stages:


    DOG point of presence


    The first line of defense on new changes used only by Cloudflare employees. Changes
    deployed here first issues can be detected by employees before getting into the
    real world.


    PIG point of presence


    A Cloudflare environment for a small subset of customer traffic; new code can
    be tested without affecting paying customers.


    296 | Chapter 10: Continuous Deployment Patterns and Antipattern'
  merge: -1
  pgno: 313
