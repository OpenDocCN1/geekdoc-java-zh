    The view tool is useful in showing how the filesystem would look if you were to
    launch a container based on the openjdk image. As you move through subsequent
    layer, you can see the changes made to the initial filesystem. The most important
    part to convey is that subsequent layers may obfuscate parts of the previous (in
    the case of any moves or deletions of files), but the original layer still exists
    in its original form.


    # Leveraging layer cache


    Using images speeds up requests, builds, and pushes. It''s a clever way to decrease
    the amount of storage required for images. This strategy allows for identical
    layers to be shared across multiple images, and reduces the amount of time and
    bandwidth needed for pulling or pushing images that are cached locally or in the
    registry.


    If you''re using Docker, your system will have an internal cache of all the images
    you''ve requested from external registries or built yourself. When images are
    pushed and pulled, comparisons of each of the image layers are made between your
    local cache and the registry, and decisions are made about whether to push or
    pull individual layers, increasing efficiency.


    Anyone who has struggled with their internal Maven repository (we haven''t all
    at some point?), or with any caching mechanism for matter, there is aware that


    70 | Chapter 3: An Introduction to Containers'
  merge: -1
  pgno: 87
- img_proc: true
  md: 'the efficiency and performance improvements internal cache provides also come
    with caveats. Sometimes what you have stored in cache is not what you intended
    to use. Using stale cache can easily happen in active development and local testing
    if you aren''t mindful of how and when your local image cache is used.


    For example, the commands docker run and docker pull opens behave differently
    where cache is concerned. The former searches for the specified image in your
    local cache with the tag latest. If the image exists, the search will be considered
    satisfied, and a new container based on the cached image will be launched. The
    latter command will go further and update the cached image on your system if an
    update exists in the remote registry it was retrieved.


    Another common mistake is assuming a command in a Dockerfile will run again when
    an image is rebuilt. This is common with RUN commands as RUN apt-get update. If
    this in the Dockerfile doesn''t change at all, as if you were to specify package
    names along with specific versions, the initial layer built with this command
    will live in your cache. It will not get built again. This is not a bug, but a
    feature of the cache to speed up build processes. If a layer is determined to
    be already built, the layer will not be built again.


    In an attempt to avoid stale cache, you might be tempted to combine commands on
    one line (producing one) in a Dockerfile in order to be more easily recognized
    and acted on more frequently. The problem with this approach is that by squashing
    too much into a single layer, you lose the benefit of the cache altogether.


    ![](img/50358b52af39b0dcf9d284d547c73fdc_88_0.png)


    As a developer, conscientious regarding your local cache. And beyond local development,
    consider how your continuous integration, build servers, and automated integration
    testing is using cache. Ensuring that all systems are consistent in this will
    help keep you from chasing unexplained and intermittent failures.


    # Best Image Build Practices and Container Gotchas


    After some time spent building and playing with images, you''re going to discover
    that you can shoot yourself in the foot in a lot of places in even the most basic
    build process. The following is a set of practices to keep in mind as you start
    on your image-building journey. You will discover more, but these are the most
    important.


    # Respect the Docker Context and .dockerignore File


    You don''t want to have certain things in your production Docker image—things
    like your development environment configuration, keys, your .git directory, or
    other sensitive hidden directories. When you run the command to build a Docker
    image,'
  merge: -1
  pgno: 88
- img_proc: true
  md: 'you provide the context, or the location of files you want to make available
    to the build process.


    The following is a contrived Dockerfile example:


    ```

    FROM ubuntu


    WORKDIR /myapp


    COPY /myapp


    EXPOSE 8080


    ENTRYPOINT ["start.sh"]

    ```


    See the COPY instruction? Depending on what you sent in your working context,
    this could be problematic. It could be copying everything from your working directory
    into the Docker image, which will end up in any container launched from this image.


    Make sure to use a .dockerignore file to exclude files from the context that you
    don''t want showing unintentionally. You can use it to avoid accidentally adding
    any user-specific files or secrets that you might have stored locally. In fact,
    you can greatly reduce the size of the context (and the time it takes to build)
    by excluding anything the build needs access to:


    +   # Ignore these files in my project

    **/*.md

    !README.md

    words.txt

    .git

    logs/

    */temp

    */test/


    The .dockerignore matching format follows Go''s filepath.Match rules.


    # Used Base Images


    Whether you choose use images that include OpenJDK, Oracle JDK, GraalVM, or other
    images that include a web server or a database, make sure you are using trusted
    images as parent images, or creating your own from scratch.


    Docker Hub proclaims to be the world''s largest library for publicly available
    container images, with over 100,000 images from software vendors, open source
    projects, and the community. Not all of these images should be trusted to use
    as base images.'
  merge: -1
  pgno: 89
- img_proc: true
  md: 'Docker Hub includes a set of curated images labeled "Docker Official Images"
    that are suitable for use as base images (note that distribution of docs requires
    an agreement with Docker). These details are from the online Docker docs on official
    images:


    Inc. sponsors a dedicated team that is responsible for reviewing and publishing
    all content in the Docker Images. This work works in collaboration with upstream
    software maintainers, security experts, and the broader community.


    As important as understanding how Java dependencies are brought into your project
    and the depth of your dependency tree, so is understanding what your base image
    is bringing in under just one FROM line at the top of your Dockerfile. The inheritance
    structure of Dockerfiles can easily obfuscate how your base image is dragging
    along with it in the form of additional libraries and packages you don''t need
    or possibly even malevolent content.


    # Specify Versions and Keep Up with Updates


    Given the caveats discussed earlier about caching on top of the desire to maintain
    repeatable builds, specify versions in your Dockerfile just as you would in your
    Java project. Avoid broken and unexpected behavior from new versions or unexpected
    updates.


    That said, it is easy to get complacent with updating versions if they never force
    you to look at them because of a failed build or test. Regularly audit your project
    for needed updates and make these updates intentional. This should be part of
    your regular project planning. I advise that this activity be separate from any
    other feature development or bug fixing in order to eliminate unrelated moving
    parts in your development lifecycle.


    # Keep Your Images Small


    It is easy for images to become very, very fast. Monitor size increases in your
    automated builds and set up notifications for unusual size changes. Gluttonous
    disk storage packages can easily sneak in updates to a base image or be unintentionally
    included in a COPY statement.


    Utilize multistage builds to keep your images small. A multistage build can be
    set by creating a Dockerfile that uses multiple FROM statements, which begin a
    build with a different base image. By multistage builds, you can avoid including
    things like tools or package managers that are not needed (and really should not
    be included) in a production image. For example, the following Dockerfile shows
    a two-stage build. The first uses a base image that includes Maven. After the
    Maven build is complete, the required JAR file is copied to the second stage,
    which uses an image that does not include Maven:'
  merge: -1
  pgno: 90
- img_proc: true
  md: '# ####################

    # First build stage

    ####################


    FROM maven:3.8.4-openjdk-11-slim as build


    ```

    COPY .mvn .mvn

    COPY mvnw .

    COPY pom.xml .

    COPY src src

    ```


    RUN ./mvnw package


    # ####################

    # Second build stage

    ####################


    FROM openjdk:11-jre-slim-buster


    ```

    COPY --build target/my-project-1.0.jar .

    EXPOSE 8080

    ```


    ```

    ENTRYPOINT ["java", "-jar", "my-project-1.0.jar"]

    ```


    This is also a way to implement the use of proprietary software or even external
    resources, an image that has been stripped of everything (including a shell) but
    the absolute essentials for running your application.


    # Beware of External Resources


    I have often seen requests to external resources within Dockerfiles in the form
    of wget commands for installation of proprietary software or even external requests
    for shell scripts that perform a custom installation. These terrify me. More than
    general suspicion and paranoia are involved here. Even if the external resource
    is trusted, the more you relinquish control to parts of your build to external
    parties, the more likely you are to suffer failures that are out of your control
    to fix.


    The first response I get when making this observation is: “There’s nothing to
    worry about once you’ve built your image, it’s cached or stored within a base
    image, and you won’t have to ever make the request again.”


    This is absolutely true. When you have your base image stored, or your image layer
    cached, you''re good to go. The first time you build a new node (with zero cache)
    is put into play, or even when a new developer joins your team, building image
    might fail. When you need to build a new version of the base image, your build
    might fail. Why? Because time and time again, external managers of resources will
    move them, restrict access to them, or simply dispose of them.'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# Protect Your Secrets


    I include this because in addition to moving secrets into your image in the first
    place, don''t think that using a command in a Dockerfile to remove them from a
    base image or any other previous layer is good enough. I''ve seen this before
    as a hack to "fix" a base layer that couldn''t be rebuilt right away.


    Now that you know how layering works, you know that a subsequent layer deleting
    items does not actually remove them from the underlying layer. You can''t see
    them if you were to exec into a running container based on that image, but they
    are still there. They exist on the system the image is stored on, they exist wherever
    a container based on image is launched, and they also exist in the image registry
    you''ve chosen for long-term storage. This is close to the equivalent of checking
    your passwords into source code. Do not put secrets into images to begin with.


    # Know Your Outputs


    Numerous factors can cause a container to continuously grow while it''s running.
    One of the most common is not dealing log files appropriately. Ensure that your
    application is logging to a volume where you can implement a log-rotating solution.
    Given the ephemeral nature of containers, it doesn''t make sense to keep logs
    that you would use for troubleshooting or for compliance stored within the container
    (on the Docker host).


    # Summary


    Much of this chapter was about exploring Docker. And this is an excellent place
    to start. Once you are comfortable with images and containers, you can branch
    out to other tools available in the ecosystem. Depending on the operating system
    and build tools you''ve chosen for your project, tools such as Buildah, Podman,
    or Bazel might work well for you. You might also choose to use a Maven plugin-in
    as Shib to build your container image.


    One word of caution: whichever tool you choose, understand how your images and
    containers are built so you don''t suffer the consequences of bulky and/or insecure
    images and containers when you are ready to deploy.'
