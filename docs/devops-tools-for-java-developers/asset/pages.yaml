    Figure 8-3. Canary strategy using weighted traffic routing in Istio


    If you still struggle to choose a deployment mechanism, check out Table 8-3, which
    summarizes characteristics of the previously discussed strategies.


    Table 8-3. Characteristics of the deployment strategies


    | | Re-create | Rolling update | Blue/green | Canary |

    |---|---|---|---||

    | Out of the box in Kubernetes | Yes | Yes | No | No |

    | Downtime occurrence | Yes | No | No | No |

    | Rollback process | Manually roll out previous version | Stop rollout and keep
    the previous version | Switch traffic to previous version | Delete canary instance
    |

    | Traffic control | No | No | Yes | Yes |

