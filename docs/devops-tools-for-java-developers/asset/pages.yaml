    Quality


    A source code management system allows for easy peer review of changes before
    they are accepted, increasing the overall quality of the software.


    Since source code management plays such a critical role in software development,
    it is important to understand how it works and select a system that best meets
    the needs of your organization and the desired DevOps workflow.


    # Three Generations of Source Code Management


    Collaboration is a big part of software development, and as you scale with larger
    teams, the ability to collaborate effectively on a shared codebase often becomes
    a bottleneck to developer productivity. Also, the complexity of systems tends
    to rise, so rather than managing a dozen files or a handful of modules, it is
    common to see thousands of source files that need to be updated in masse to accomplish
    system-wide changes and refactorings.


    To manage the need to collaborate on codebases, source code management (SCM) systems
    were created. The first-generation SCM systems handled collaboration via file
    locking. Examples of these are SCCS and RCS, which required that you lock files
    before editing, make your changes, and then release the lock for other folks to
    contribute. This seingly eliminated the possibility of two developers making conflicting
    changes, with two major drawbacks:


    +   * Productivity was impacted since you had to wait for other developers to
    finish their changes before editing. In systems with large files, this could effectively
    limit the concurrency to one developer at a time.


    +   * This did not solve the problem of conflicts across files. It is still possible
    for two developers to modify different files with interdependencies and create
    a buggy or unstable system by introducing conflicting changes.


    A substantial improvement was made in the second-generation version control systems,
    starting with Concurrent Version Systems (CVS) created by Dick Grune. CVS was
    revolutionary in its approach to (or lack of) file locking. Rather than preventing
    changing files, it would allow multiple developers to make simultaneous (and possibly
    conflicting) changes to the same files. This was later resolved via'
