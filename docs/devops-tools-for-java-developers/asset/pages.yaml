  md: 'activity. Both report attacks as soon as they occur; with IAST, this happens
    at the time of the test, whereas with RASP, it takes place at runtime in production.


    # # SAST, DAST, IAST, and RASP Summary


    All approaches result in wide range of options for arming yourself against known
    and unknown security gaps. Reconciling your own needs and those of the company
    is essential when choosing your approach.


    With RASP, the application can protect itself against attacks at runtime. The
    permanent monitoring of your activities and the data transferred to the application
    enable an analysis based on the runtime environment. Here you can choose between
    pure monitoring or alerting, and active self-protection. However software components
    are added to the runtime environment with RASP approaches to manipulate the system
