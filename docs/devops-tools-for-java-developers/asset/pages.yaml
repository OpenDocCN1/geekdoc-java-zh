  md: '# CHAPTER 8


    # Deploying for Developers


    Ana-Maria Mihalceanu


    > However beautiful the strategy, you should occasionally look at the results.

    —Sir Winston Churchill


    When computers were extremely large and expensive, manufacturers often bundled
    together the software with the hardware. With the development of mass-market software,
    this type of operation was time-consuming, and new forms of software distribution
    emerged. Today''s development processes focus on decoupling build and deployment
    activities to facilitate fast software distribution and parallel activities in
    teams.


    The deployment of an application represents the transformation of software from
    a packaged artifact to an operational working state. Modern development days require
    this transformation to happen as fast as possible in order to get rapid feedback
    about the running state of our system.


    As a developer, your focus is mainly on writing performance code. Yet DevOps is
    collaboration centric, and your work should flawlessly blend within the infrastructure.
    While looking at your deployment process, you should continuously ask yourself,“What
    instructions would a machine need to execute this deployment as I envisioned it?”
    and share with the colleagues or experts in charge of the infrastructure and automation.
    When planning a deployment process, you can make a list that you can later scale
    to more components of the distributed system:


    +   - To gradually extend the functionalities of your system, conduct small deployments
    often. Using this approach, you can easily roll back to a previously working state
    in case of failures.

    - Isolate deployment of each microservice, as you should be able to scale or replace
    it individually.'
  merge: -1
