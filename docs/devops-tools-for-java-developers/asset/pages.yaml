  md: '# About the Authors


    # Stephen Chin


    Stephen Chin (@steonjava) is VP of developer relations at JFrog coauthor of The
    Definitive Guide to Modern Java Clients with JavaFX 17, Raspberry Pi with Java,
    and Pro Java Platform. He has knotted numerous conferences around the world including
    Devox, JNation, JavaOne, Joker, and Open Source India. Stephen is an avid motorcyclist
    who does evangelism tours in Europe, Japan, and Brazil, interviewing hackers in
    their natural habitat. When he is not traveling, he enjoys teaching kids how to
    do embedded and robot programming together with his teenage daughter.


    # Melissa McKay


    Melissa McKay (@melissajmckay) is a developer/software engineer turned international
    speaker and a developer advocate on the Frog Developer Relations team, sharing
    in the mission to improve the developer experience with DevOps methods. She is
    a mom, software developer, Java Champion, Docker Captain, huge promoter of Java
    for her passion for teaching, sharing and inspiring fellow practitioners, and
    she is active in the developer community. Given her passion for teaching, you
    are likely to cross paths with her on the international conference circuit—both
    online and off.


    # Ixchel Ruiz


    Ixchel Ruiz (@ischelruiz) is a developer advocate on the Frog Developer Relations
    team. She has developed software applications and tools since 2000. Her research
    interests include Java, dynamic languages, client-side technologies, DevOps, and
    testing. Ixchel is a Java Champion, Oracle Groundbreaker Ambassador, SuperFrog,
    Hackergarten enthusiast, open source advocate, public speaker, and mentor. She
    travels around the world (sometimes virtually) because sharing knowledge is one
    of her main drives in life!


    # Baruch Sadogursky


    Baruch Sadogursky (@baruch) gave Java its birth before it had a name. Now Baruch
    helps engineers solve problems with Docker, and DevRel helps solve problems, and
    helps companies help engineers solve problems.


    He is coauthor of Liquid Software, serves on multiple conference program committees,
    and regularly speaks at numerous industry conferences, including Kubecon, JavaOne,
    Devoxx, QCon, DevRelCon, DevOpsDays (all over), VeroOps (not a typo), and others.'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# Ana-Maria Mihalceanu


    Ana-Maria Mihalceanu (@ammbra1508) is a Java Champion, Certified Architect, cofounder
    of the Bucharest Software Craftsmanship Community, and a constant adopter of challenging
    technical scenarios involving Java-based frameworks and multiple cloud providers.
    She actively supports communities'' growth through knowledge sharing on architecture,
    Java, and DevOps and enjoys curating content for conferences as a program committee
    member. believes that every technical problem has solutions, each with benefits
    and drawbacks, and that we can remediate any mistake as we hold the passion for
    our work.


    # Sven Ruppert


    Sven Ruppert (@SvenRuppert) has been coding in Java since 1996 in industrial projects
    and is working as a developer advocate for jFrog with a focus on security and
    DevOps. He is a serial speaker at conferences worldwide and contributes to IT
    periodicals and tech pros as a domain expert. Sven has been working for more than
    15 years as a consultant worldwide in the automotive, space, insurance, and banking
    industries, as well as the UN and World Bank. In addition to his primary expertise
    in DevOps, Sven is also a recognized expert in mutation testing of web apps, distributed
    unit testing, core, and Kotlin.


    # Colophon


    The animal on the cover of DevOps Tools for Java Developers is a banded mongoose
    (Mungo mungo). These small carnivores are found in much sub-Saharan Africa, with
    the exception of the Congo and some parts of West Africa. They can live in a variety
    of habitats such as grasslands, grasslands, and woodlands, but they avoid the
    more arid climates of deserts and semideserts.


    Banded mongooses grow to lengths of 12 to 18 inches—not including a 6 to 12 inch
    tail!—typically weigh between 3 and 5 pounds. The distinguishing feature of this
    breed is the dark stripes interrupting their gray-brown coat from the base of
    the tail across. They have small, pointed faces, bushy tails that taper into a
    point, and long, curved claws on their front feet to allow for scratching and
    digging. Banded mongooses primarily eat insects, but may also scavenge for crabs,
    earthworms, birds, eggs, rodents, scorpions, and snakes. They are very aggressive
    and do not share food, and can travel more than five miles a day to forage.


    Banded mongooses are more social than other mongoose species and usually live
    in packs of 10 to 20 individuals. These packs will hunt, raise their young together,
    and even fight off predators by bunching together and moving as a group to create
    the appearance of a single large animal. Male banded mongooses court females by
    circling them with their tails head. They are nonmonogamous'
  merge: -1
  pgno: 341
- img_proc: true
  md: 'may sometimes synchronize reproduction so that all females in the pack give
    birth around the same time. Banded mongooses are born in litters of two to six,
    and are blind until they begin opening their eyes around 10 days later. The young
    may leave the den for short periods and begin accompanying the adults in foraging
    after to five weeks. Banded mongooses are considered a species of "least concern"
    by the IUCN; Many of the animals on O''Reilly covers are endangered; all of them
    are important to the world.


    The cover illustration is by Karen Montgomery, based on a black-and-white engraving
    from Lydekker''s *The Royal Natural History*. The cover fonts are Gilroy Semibold
    and Guardian Sans. The text font is Adobe Minion Pro; the heading font is Adobe
    Myriad Condensed; and the code font is Dalton Maag''s Ubuntu Mono.'
