  md: '# Runtime Application Self-Protection


    Runtime application self-protection (RASP) is the approach to secure the application
    from within. The check takes place at runtime and generally consists of looking
    for suspicious commands when they are executed.


    With the RASP approach, you can examine the entire application context on the
    production machine in real time. Here all commands that are processed are examined
    for attack patterns. Therefore, this procedure aims to identify existing security
    gaps and attack patterns and those that are not yet known. Here it goes clearly
    into the use of AI and machine learning (ML) techniques.


    RASP tools usually be used in two operating modes. The first operating mode (monitoring)
    is limited to observing and reporting possible attacks. The second operating mode
    (protection) includes implementing defensive measures in real time and directly
    on the production environment. RASP aims to fill the gap left by application security
    testing and network perimeter controls. SAST and DAST do not have visibility in
    real-time data and events to prevent vulnerabilities from sliding through the
    verification process or to block new threats that were overlooked during development.


    RASP is similar to IAST. The main difference is that IAST focuses on identifying
    vulnerabilities in the applications, and RASP focuses on protecting against cybersecurity
    attacks that can exploit these vulnerabilities or other attack vectors.


    The RASP technology has the following advantages:


    +   - RASP complements SAST and DAST with an additional layer of protection after
    the application is started (usually in production)

    - RASP can be easily applied with faster development cycles.

    - Unexpected entries are checked and identified in RASP.

    - RASP enables you to react quickly to an attack by providing comprehensive analysis
    and information about the possible vulnerabilities.


    However, since RASP tools sit on the application server, they can adversely affect
    application performance. In addition, the RASP technology may not be compliant
    with regulations or internal guidelines, because it allows the installation of
    other software or the automatic blocking of services. The use of this technology
    can also give a false sense of security and is not a substitute for application
    security testing, because it cannot provide comprehensive protection. Finally,
    the application must be switched offline until the vulnerability is eliminated.


    While RASP and IAST have similar methods and uses, RASP does not perform extensive
    scans but runs as part of the application to examine traffic and'
