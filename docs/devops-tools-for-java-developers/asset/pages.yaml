  md: 'allows developers to compose applications based on existing components and
    sensi-ble defaults.


    One of Micronaut''s key differentiators is the use of compile-time dependency
    injection for assembling the application, as opposed to runtime dependency injection,
    which is the preferred way of assembling applications with Spring Boot so far.
    The seemingly trivial change lets Micronaut exchange a bit of development time
    for a speed boost at runtime the application spends less time bootstrapping itself;
    this can also lead to less memory consumption and less reliance on Java reflection,
    which historically has been slower than direct methods invocation.


    There are a handful of ways to bootstrap a Micronaut project, but the preferred
    one is to browse to Micronaut Launch and select the settings and features you''d
    like to add to the project. The default application type defines the minimum settings
    to build a REST-based application such as the one we go through in a few minutes.
    Once satisfied with your selection, click the Generate Project button, as shown
