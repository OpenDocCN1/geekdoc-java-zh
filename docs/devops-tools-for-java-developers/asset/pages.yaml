  md: '+   • You should be able to reuse in another environment an already deployed
    microservice.


    +   • Automate infrastructure deployment and evolve it with your application features.


    Regardless of the container orchestration platform where you will deploy any of
    your microservices, you will likely start by packaging the application and continue
    with the following:


    +   1. Building and pushing a container image

    2. Choosing and implementing a deployment strategy


    As the application deployment progresses throughout various stages or environments,
