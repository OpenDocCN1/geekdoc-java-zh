- img_proc: true
  md: 'code sections, define the attack surface and attack vectors in each development
    cycle, support you in assessing the user stories'' effort, and implement mitigation
    strategies.


    To get a global overview of the codebase and its security level, aiming for a
    regular exchange between the SecMs of the teams involved makes sense. Since a
    company-wide synchronization of the development cycle is unrealistic, SecMs meet
    at regular, fixed times. In small companies or with synchronized sprints, the
    teams particularly benefit from an exchange during development cycle planning.
    In this way, security aspects and the effects of the development cycle on the
    security of the product increment can be assessed. The latter can currently be
    achieved only through downstream tests. Based on the development cycle review,
    a SecM meeting also occurs after implementing new components. In preparation for
    the next sprint, the participants evaluate the security level according to the
    increment.


    OWASP Security Champions are implemented differently. These are often developers,
    possibly junior developers, who acquire additional security knowledge that can
    be domain-specific depending on experience. Conceptual overlap with the SecMs;
    however, a key difference is that a SecM is a fully-fledged security expert with
    development experience who acts on the same level as the senior developer. When
    implementing secure software, however, it is crucial to take into account the
    security-relevant effects of implementation decisions and cross-thematic specialist
    knowledge.


    Regardless of whether a team can create a dedicated role, basic measures should
    be taken to support the process of developing secure software. These are the following
    best practice recommendations and empirical values.


    # Not All Clean Code Is Secure Code


    Clean Code by Robert Martin (Pearson), also known as Uncle Bob, coined the term
    clean code. However, a common misconception among decision makers is that clean
    code also covers the security of the clean code.


    Safe and clean code overlap but understandability, maintainability, and reusability
    of code. Secure code, on the other hand, also requires predefined specifications
    and compliance with them. However, clean code is often a requirement for safe
    code. The code can be written cleanly without any security features. However,
    only a clean implementation opens up the full potential for security measures.


    Well-written code is even easier to secure because the relationships between components
    and functions are clearly defined and delimited. Any development team looking
    for reasons to promote adherence and implementation of the clean code principles
    will find good arguments in the security of the code, which can also'
  merge: -1
  pgno: 214
- img_proc: true
  md: 'explained economically to decision makers in cost and time savings security
    hardening.


    # Effects on Scheduling


    In general, and particularly in Agile development, teams do not allow enough time
    to improve the codebase when planning the next version. In sprint planning, the
    focus on effort assessment is primarily on time to develop a new function. Hardening
    is considered explicitly only when a special requirement exists.


    The amount of time teams need to implement a function safely depends on the functionality,
    the status of the product increment, the existing technical debt, and the prior
    knowledge of the developer. However, as intended in Agile development, it should
    be up to the team to estimate the actual time required. Since miscalculations
    are to be expected, especially at the beginning, it can make sense to reduce the
    number of user stories adopted for the previous sprints.


    # The Right Contact Person


    Every team must have access to security professionals, but it can be hard to find
    the right contact person in large organizations. IT security is divided into numerous,
    highly specific and complex, subareas for full-time security experts are responsible.
    Good programmers are full-time developers and even after IT security training,
    cannot replace dedicated security experts.


    It is the responsibility of project management to ensure that organizational,
    structural, and financial requirements are met so that teams can quickly draw
    on technical expertise when needed and during an assessment. This is not the case
    by default in most organizations.


    # Dealing with Technical Debt


    Technical debt is an integral part of development, and project owners should treat
    it as such—in terms of time and budget. Technical debt has a negative impact on
    the maintainability, development, and security of the codebase. This means a significant
    increase in individual (new) implementation costs and a sustained slowdown in
    overall production by blocking developers for a more extended period of time with
    individual projects. Therefore, it is in the interest of everyone involved—especially
    management—to keep the technical debt of a codebase and continuously reduce it.


    Alternatively, the substrategy is to set a fixed portion of the estimated project
    time for servicing technical debt. The approach is minor, as there is a risk that
    teams will use the time spent processing technical debt to implement a function
    instead and misjudge the extent of technical debt under the development cycle
    pressure.'
