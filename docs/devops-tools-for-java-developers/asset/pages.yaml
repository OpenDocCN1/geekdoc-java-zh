  md: 'Canary point of presence

    Three global canary environments that get a subset of worldwide traffic as a last
    line of defense before changes goes global.


    Unfortunately, the WAF was primarily used for fast threat response, and as a result
    it bypassed all of these canary environments (as defined in the Canary Releases
    pattern) and went straight to production. In this case, the regular expression
    was only run through series of unit tests that did not check for CPU exhaustion
    before it was pushed to production. This particular change was not an emergency
    and thus could have done a staged rollout following the preceding process.


    The exact time of the problem and subsequent fix was as follows:


    +   1. 13:31—Check-in of the peer reviewed regex.

    2. 13:37—CI server build and ran the tests, which were passed. Well, apparently,
    these weren''t great. \(\u259d\uff01\u259d)_/\

    3. 13:42—The erroneous regex was deployed to the WAF in production.

    4. 14:00—The possibility of an attacker was dismissed, and the WAF was identified
    as the root cause.

    5. 14:02—It was decided to go to a global WAF kill.

    6. 14:07—The kill was finally executed after delays accessing the internal systems.

    7. 14:09—Service was restored for customers.


    To recap, let''s review the continuous update best practices that may have helped
    Cloudflare avoid another outage.


    # Continuous Update Best Practices


    +   * Progressive delivery

    - Problem: Canary deployments had now been implemented, but were not used for
    the WAF since this was used for fast threat response.

    - Solution: This particular rule was not an emergency and could have followed
    the canary deployment process.

    * Observability

    - Problem: Some problems are hard to trace relying on user feedback only.

    - Solution: Implementing tracing, monitoring, and logging in production. Cloudflare
    had specifically implemented a product watchdog designed to prevent excessive
    CPU use by regular expressions that would have caught this issue. However, a few
    weeks prior, this code was removed to optimize the WAF to use less CPU.'
