    To further complicate the situation, every OEM modifies the Android OS it offers
    for its devices, it is not enough to simply test one device per Android version.
    This is a result of the way Android uses the Linux kernel to access hardware devices.


    The Linux kernel is the heart of the operating system and provides the low-level
    device driver to access cameras, accelerometers, the display, and other hardware
    on the device. To the Linux kernel that Android is based on, Google adds Android-specific
    features and patches, SoC vendors add in hardware-specific support, and OEMs modify
    for their specific devices. Therefore, each device has a range of variation in
    performance, security, and potential bugs that could affect your application when
    a user runs it on a device.


    Google worked toward improving this situation with Android 8.0 Oreo, which includes
    a hardware abstraction layer allowing device-specific code to run outside the
    kernel. This allows OEMs to update to new Android kernel versions from Google
    without waiting for device driver updates from SoC vendors, which reduces the
    amount of redevelopment and testing required for OS upgrades. However, other than
    Pixel devices that Google handles OS updates for, the majority of Android device
    upgrades are in the hands of OEMs, which are still slow to upgrade to new Android
    versions.


    Android Device Fragmentation | 257'
