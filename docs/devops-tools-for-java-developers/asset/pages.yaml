  md: '# Trunk-Based Development


    All of the aforementioned approaches are variants of the feature branch development
    model; all active development is done on branches that get merged into either
    the master or a dedicated development branch. They take advantage of the great
    support Git for branch management, but if features are not granular enough, they
    suffer from the typical integration problems that have plagued them decades. The
    longer the feature branch is in active development, the higher the likelihood
    for merge conflicts with other features and maintenance going on in the master
    branch (or trunk).


    Trunk-based development solves this problem by recommending that development happen
    on the main branch with very short integrations that occur anytime that tests
    are passing, but not necessarily waiting for a full feature to be completed.


    Key attributes include the following:


    +   - Development branches

    - Optional, but no long-lived branches


    +   - Merge strategy

    - Only if using development branches


    +   - Rebasing history

    - Rebasing recommended


    +   - Release strategy

    - Separate release branches


    Paul Hammant, a strong advocate for trunk-based development, has set up a full
    website and written a book on the topic. While this is not a new approach to collaboration
    on source control management systems, it is a proven approach to Agile development
    in large teams and works equally well on classic central SCMs like CVS and Subversion,
    and modern DVCS like Git.


    # Summary


    Good source control systems and practices lay the foundation for a solid DevOps
    approach to building, releasing, and deploying code quickly. In this chapter,
    we discussed the history of source control systems and explained why the world
    has to move to embrace distributed version control.


    This consolidation has built a rich ecosystem of source control servers, developer
    tools, and commercial integrations. Finally, through the adoption of distributed
    version control by DevOps thought leaders, best practices and collaboration workflows
    have been established that you can follow to make your team successful with adopting
    a modern SCM.'
  merge: -1
