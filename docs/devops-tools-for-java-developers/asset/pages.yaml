  md: '# Build with Apache Maven


    According to the Apache Maven Project, maven is a Yiddish word meaning accumulator
    of knowledge. Like Apache Ant, Maven is also an open source project of the Apache
    Software Foundation. It began as an improvement to the Jakarta turbine build that
