  md: '# Microservice Frameworks


    The JVM ecosystem is vast and provides plenty of alternatives for a particular
    case. Dozens of microservice frameworks and libraries are available, to the point
    that it can be tricky to pick a winner among candidates.


    That said, certain candidate frameworks have gained popularity for several reasons:
    developer experience, time to market, extensibility, resource (CPU, memory) consumption,
    startup speed, failure recovery, documentation, third-party integrations, and
    more. These frameworks—Spring Boot, Micronaut, Quarkus, and Helidon—are covered
    in the following sections. Take into account that some of the instructions may
    require additional tweaks based on newer versions, as some of these technologies
    evolve rapidly. I strongly recommend reviewing the documentation of each framework.


    Additionally, these examples require Java 11 as a minimum, and trying out Native
    Image also requires an installation of GraalVM. I recommend using SDKMAN! to install
    and manage them. For brevity, I concentrate on production code alone—a single
    framework could fill a whole book! It without saying that you should take care
    of tests as well. The goal for each example is to build a trivial "Hello World"
    REST service that can take an optional name parameter and reply with a greeting.


    If you have not used GraalVM before, it''s an umbrella project for a handful of
    technologies that enable the following features:


    +   - A just-in-time JIT compiler written in Java, which compiles code on the
    fly, transforming interpreted code into executable code. The Java platform has
    a handler of Jits, most written using a combination of C and C++. Graal happens
    to be the most modern one, written in Java.


    +   - A virtual machine Substrate VM that is capable of running hosted languages
    like Python, JavaScript, and R on top of the JVM in a way that the hosted language
    benefits from tighter integration with JVM capabilities and features.


    +   - Native Image, a utility that relies on ahead-of-time (AOT) compilation,
    which transforms bytecode into machine-executable code. The resulting transformation
    produces a platform-specific binary executable.


    All candidate frameworks covered here provide support for GraalVM in one way or
    another, freely relying on GraalVM Native Image to produce platform-specific binaries
    with the cost of reducing deployment size and memory consumption. We are aware
    that there''s a trade-off between using the Java mode and the GraalVM Native Image.
    The latter can produce binaries with a smaller memory footprint'
