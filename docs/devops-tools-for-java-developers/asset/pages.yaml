  md: '# CHAPTER 5


    # Continuous Integration


    Melissa McKay


    > Always make new mistakes.

    —Esther Dyson


    Back in Chapter 2, you learned the value of source control and a common code repository.
    After you have organized and settled on your source control solution, you need
    to take a few more steps to reach an end result where your users can bask in the
    perfect user experience of your delivered software.


    Think about the process that you would take as an individual developer to progress
    your software through the entire software development lifecycle. After determining
    the acceptance criteria for a particular feature or bug fix for your software,
    you would proceed with adding the actual lines of code along with the related
    unit tests to the codebase. Then, you would compile and run all of the unit tests
    to ensure that your new code works as you expect (or least as defined by your
    unit tests) and doesn''t break any existing functionality. After you find that
    all tests pass, you would build and package your application and verify functionality
    in the form of integration tests in a quality assurance (QA) environment. Finally,
    happy with the well-oiled and maintained test suites, you would deliver and/or
    deploy your software to a production environment.


    If you have any development experience at all, you know as well as I do that rarely
    falls into place so neatly. Strict implementation of the ideal workflow is simplistic
    when you begin working on a larger project with a team of developers. Multiple
    complications are introduced that can gum up the gears of the software delivery
    lifecycle and throw your schedule into a lurch. This chapter discusses how continuous
    integration and the related best practices and toolsets will help you steer clear
    of or mitigate the most common hurdles and headaches that software development
    projects often encounter on the path to delivery.'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# Adopt Continuous Integration


    Continuous integration (CI) is most commonly described as frequently integrating
    code changes from multiple contributors into the main source code repository of
    a project. In practice, this definition itself is a little vague. Exactly how
    often is frequently? What does integrating actually mean in this context? Is it
    enough just to coordinate pushing changes to the source code repository? And most
    important, what problem does this process solve—for what benefit(s) should you
    adopt this practice?


    The concept of CI has been around for some time. According to Martin Fowler, the
    term continuous integration originated with Kent Beck''s Extreme Programming development,
    as one of the original 12 practices. In the DevOps community, the term itself
    is now common as butter on toast. But the way it is implemented may vary from
    team to team and project to project. The benefits are hit-or-miss if there isn''t
    a thorough understanding of the original intent or if best practices are abandoned.


    It''s interesting to see how our understanding of CI has changed over time. The
    way we talk about it is now much different from when it was introduced by Beck
    to address the issues of concurrent development. The problems we have today are
    more about keeping regular and frequent builds efficient minimizing bugs, whereas
    initially, CI and the proliferation of build tools spun out from it were more
    about getting a project to build after all coding was complete. Instead of trying
    to assemble a project only after all the coding has been completed by the team,
    CI required a change in mindset—to regularly build during development.


    Today, CI is meant to identify bugs and compatibility issues as quickly as possible
    in the development cycle through regular and frequent builds. The basic premise
    of CI is that if developers integrate changes often, bugs can be found sooner
    in the process, and less time is spent hunting down and where a problem was introduced.
    The longer a bug goes undiscovered, the greater the potential for it to become
    entrenched in the surrounding codebase.


    It is much easier from a development perspective to find, catch, and fix bugs
    when they are introduced rather than extract them from layers of code that have
    already moved to later stages of the delivery pipeline. Bugs that evade discovery
    until the latest acceptance phases, and especially those that escape all the way
    to release, directly translate to more money spent to fix and less time spent
    on new features. In the case of fixing a bug in production, in many instances,
    there is now a requirement to patch existing deployments in addition to including
    and documenting the fix in a new version. This inherently reduces the time the
    team has available to spend on the development of new features.'
  merge: -1
  pgno: 129
- img_proc: true
  md: 'It''s important to understand that implementing a CI solution does not equate
    to software that never has any bugs. It would be foolish to use such a definitive
    measure to determine whether the implementation of CI is worthy. A more valuable
    metric might be the number of bugs or compatibility issues that were caught by
    CI. In the same way that a vaccine is never 100% effective in a large population,
    CI is simply another level of protection to filter the most obvious bugs from
    a release. By, CI will never replace the well-known benefits of software development
    best practices that are in the pursuit of the initial design and development steps.
    It, however, provide a better safety net for software as it is repeatedly handled
    and massaged by multiple developers over time. Martin Fowler puts it this way:
    "Continuous integration doesn''t get rid of bugs, but it does make them dramatically
    easier to find and remove."


    My first experience with CI was during an internship at a small company that adopted
    the software development methodology of Extreme Programming (XP), of which CI
    is an important aspect. We did not have an incredibly fast system using all of
    the latest and greatest DevOps tools. What we did have a common code repository,
    and a single build server located in a small closet in the office.


    Unknown to when I first joined the development team, a speaker was set up on the
    build server that would erupt in sound of emergency sirens if a fresh checkout
    from source control resulted in the failure of a build or any automated tests.
    We were a relatively young team, this part of our CI was mostly in jest, guess
    who learned remarkably quickly not to push code to the main repository without
    verifying that the project build successfully and passed unit tests?


    To this day, I feel exceptionally fortunate to have been exposed to this practice
    in this way. The simplicity of it underscored the most important aspects of CI.
    I want to call out three by-products of this simple setup:


    Code integration is regular and rarely complicated


    My team had agreed to follow XP practices, which encourage integration as often
    as every few hours. More than a specific time interval was the amount of code
    requiring integration at any given point. When planning and booking actual development
    work, we focused our efforts on creating small, completable tasks, always beginning
    with the simplest thing that can possibly work. By completable, I mean after the
    development task was complete, it could be integrated into the main repository
    and the result would be expected to build successfully and pass all unit tests.
    This practice of organizing code updates in as small a package as possible made
    normal and unremarkable activity. Rarely was significant time spent on large integration
    efforts.'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'Build and test failures were relatively easy to troubleshoot


    Because the project was built and automated tests were run at regular intervals,
    it was readily apparent where to start troubleshooting any failures. A relatively
    small amount of code would have been touched since the latest successful build,
    and if the problem couldn''t immediately be identified and resolved, we would
    start with reverting the latest merge and work backward as needed to restore a
    clean build.


    Bugs and compatibility issues introduced by integration and caught by the CI system
    were fixed immediately


    The sound of the siren let everyone on the team know that a problem needed to
    be addressed, a problem that could not be ignored. Because our CI system halted
    whenever a build or test failure occurred, everyone was on board to figure out
    what was wrong and what to do to fix the problem. Team communication, coordination,
    and cooperation were all in top shape because no one would be able to move forward
    until the issue was resolved. A majority of the time, the offending code could
    be identified simply by analyzing the most recent merge, and the responsibility
    to fix was assigned to that developer or pair of developers. At times, a discussion
    with the entire team was necessary for a compatibility issue around multiple recent
    merges, as changes in one part of the system affected another unrelated part.
    These instances required our team to reevaluate the code changes being made holistically
    and then decide together the best plan of action.


    These three factors were key to the success of our CI solution. You might have
    discerned that all three imply the prerequisites of a healthy codebase and a healthy
    development team. Without these, the initial implementation of a CI solution will
    undoubtedly be more difficult. However, implementing a CI solution will in turn
    have a positive impact on the codebase, and taking the first steps will provide
    a measure of benefit that will be worth the effort.


    It is true there is much more to an effective CI than simple coordination of code
    contribution to a shared repository and following a mandate to integrate at agreed-upon
    frequency. The following sections will walk you through the essentials of a complete,
    practical CI solution that will unburden and accelerate the software development
    process.


    # Declaratively Script Your Build


    Regardless of the state of your project—whether it''s greenfield, legacy, a small
    individual library, or a large multimodule project—your first task in implementing
    a CI solution should be to script your build. Having a consistent and repeatable
    process that you automate help avoid the frustration of buggy build permutations
    due to the misman of dependencies, forgetting to include needed resources'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'when creating the distributable package, or unintentionally neglecting build
    steps, among other pitfalls.


    You will reap a tremendous amount of time savings from scripting your build. Your
    project lifecycle (all of the discrete steps required to build your project) can
    easily grow more complicated over time, especially as you consume more and more
    dependencies, include various resources, modules, and add tests. You may also
    need to build your project differently depending on the intended deployment environment.
    For example, you might need to enable debugging capabilities in a development
    or QA environment, but disable debugging in a build intended for release as well
    as prevent test classes from being included in the distributable package. Manually
    performing all of the required steps involved in building a Java project, is a
    hotbed for human error. The first time you neglect a step like using an updated
    dependency and consequently repeat the build of a huge multimodule project to
    correct your mistake, you will appreciate the value of a build script.


    Whatever tool or framework you choose for scripting your build, take care to use
    a declarative approach rather than imperative. Here''s a quick reminder of the
    meaning of these terms:


    # Imperative


    Defining an exact procedure with implementation details


    # Declarative


    Defining an action without implementation details


    In other words, keep your build script focused on what you need to do rather than
    how to do it. This will help keep your script understandable, maintainable, testable,
    and scalable by encouraging reuse on other projects or modules. To accomplish
    this, you may need to establish or conform to a known convention, or use plug-ins
    or other external code referenced from your build script that provides the implementation
    details. Some build tools are more apt to foster a declarative approach than others.
    This usually comes with the cost of conforming to a convention versus flexibility.


    The Java ecosystem has several well-established build tools available, so I would
    be surprised if are are compiling your project with javac and packaging your classes
    into a JAR or other package type. You likely already have some sort of build process
    and script established, but in the unlikely scenario you do not, you are starting
    a brand-new Java project, or you are looking to improve an existing script to
    utilize best practices, this section summarizes a few of the most common build
    tools/frameworks available in the Java ecosystem and what they provide you out
    of the box.


    Declaratively Script Your Build | 115'
  merge: -1
