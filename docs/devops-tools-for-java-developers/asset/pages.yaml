    # mv


    Renames or moves a file/directory, while also updating the version control record
    for the next commit. It is similar in use to the mv command in Unix and should
    be used instead of filesystem commands to keep version control history intact.


    # restore


    Allows you to restore files from the Git index if they are deleted or erroneously
    modified.


    # rm


    Removes a file or directory, while also updating the version control record for
    the next commit. It is similar in use to the rm command in Unix and should be
    used instead of filesystem commands to keep version control history intact.


    +   - History control:


    # branch


    With no arguments, lists all branches in the local repository. It can also be
    used to create a new branch or delete branches.


    # commit


    Saves changes in the working copy to the local repository. Before running commit,
    make sure to register all your file changes by calling add, mv, and rm on files
    that have been added, modified, renamed, or moved. You also need to specify a
    commit message that can be done on the command line with the -m option, or if
    omitted, a text editor (such as vi) will be spawned to allow you to enter a message.


    # merge


    Joins changes from the commits into the current branch. If the merged history
    is already a descendant of the current branch, a "fast-forward" is used to combine
    the history sequentially. Otherwise, a merge is created that combines the history;
    the user is prompted to resolve any conflicts. This command is also used by git
    pull to integrate changes from the remote repository.


    # rebase


    Replays the commits from your current branch on the upstream branch. This is different
    from merge in that the result will be a linear history rather than a merge commit,
    which can make the revision easier to follow.'
