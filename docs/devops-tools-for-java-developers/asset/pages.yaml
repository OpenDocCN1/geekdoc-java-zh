  md: '# Planning a Device-Testing Strategy


    Now you''ve seen the basics of setting up your own device lab and leveraging cloud
    infrastructure, you should have a better idea of how these map to your mobile
    device-testing needs.


    These are advantages of going with a cloud service:


    Low startup costs


    Cloud plans offer a limited number of free device tests for developers and utilization-based
    pricing for testing on devices. When starting out with device testing, this is
    the easiest and least costly way to begin exploring manual and automated device
    testing.


    Large selection of devices


    Since cloud testing providers support a large installed base of customers, they
    have a huge inventory of current and legacy phones to test against. This makes
    it possible to precisely target the device types, profiles, and configurations
    that your users are most likely to have.


    Fast scale-out


    App development is all about viral marketing and scaling quickly. Rather than
    investing in costly infrastructure up front, cloud services allow you to scale
    up the testing as the size and popularity of your application requires a larger
    device matrix.


    Reduced capital expenditures


    Building a large device lab is a costly up-front capital expenditure. By paying
    as you go for cloud infrastructure, you can delay the costs, maximizing your capital
    efficiency.


    Global access


    With remote and distributed teams becoming the norm, clouds by design allow for
    easy access from your entire team, no matter where they are located.


    However, even given all of these benefits, the traditional approach of building
    a device lab has unique advantages. Here are some reasons you may want to build
    your device lab:


    Reduced cost at scale


    The total cost of ownership for a device lab that you run and maintain at scale
    is much lower than the total monthly costs from a cloud provider over the device''s
    usable lifetime. For a small team, this threshold is hard to hit, but if you are
    a large mobile corporation, this can be significant savings.'
  merge: -1
  pgno: 292
- img_proc: true
  md: 'Fast and predictable cycle time


    With control over the device farm, you can guarantee that the tests will run in
    parallel and complete in a predictable time frame to enable responsive builds.
    Cloud providers have limited device availability and queued wait times for popular
    configurations that can limit your ability to iterate quickly.


    No session limits


    Device clouds typically put hardcoded session limits on their service to prevent
    tests from hanging because of test or device failure. As the complexity of your
    test suite grows, a 30-minute hard limit can become an obstacle to completing
    testing of a complex user flow.


    Regulatory requirements


    In regulated industries such as finance and defense, security requirements can
    restrict or prohibit the ability to deploy applications and execute tests outside
    the corporate firewall. This class of corporations would require an on-premises
    device setup.


    IoT device integration


    If your use case requires the integration of IoT devices and sensors, this is
    not a configuration that cloud providers would provide as a service out of the
    box. You are probably before creating a device lab with the IoT and mobile configuration
    that best matches your real-world scenario.


    ![](img/50358b52af39b0dcf9d284d547c73fdc_293_0.png)


    > In some scenarios, it also makes sense to do a mix of both cloud testing and
    local device lab testing. Based on your specific requirements for cycle time,
    maintenance cost, device scale-out, and regulatory requirements, this can allow
    you to get the best of both approaches to testing.


    # Summary


    Android is the most popular mobile platform on the planet, because of its huge
    ecosystem of manufacturers and application developers. However, this is also the
    challenge with Android development: an incredibly fragmented device market with
    thousands of manufacturers producing thousands of devices. Given this scale of
    fragmentation and device inconsistency, having a fully DevOps pipeline for mobile
    development is a necessity for success.


    The equivalent to DevOps for web application development would be if, instead
    of three major browsers, there were thousands of unique browser types. You would
    be forced to automate to any level of quality assurance, which is exactly why
    there is so much focus in the mobile space on UI test automation running on real
    devices.'
