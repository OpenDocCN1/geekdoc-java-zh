  md: "Although this strategy is efficient in terms of memory and amount of CPU consumption,\
    \ it introduces a gap in time when the microservice is unavailable.\n\nAnother\
    \ Kubernetes built-in strategy is RollingUpdate, where the current running instances\
    \ are slowly replaced by the new ones:\n\n```\napiVersion: apps/v1\nkind: Deployment\n\
    metadata:\n  labels:\n    app: demo\n    name: demo\nspec:\n  strategy:\n    type:\
    \ RollingUpdate\n    rollingUnavailable:\n      maxSurge: 1\n  replicas: 4\n \
    \ selector:\n    matchLabels:\n      app: demo\n  template:\n    metadata:\n \
    \     labels:\n        app: demo\n    spec:\n      containers:\n      - image:\
    \ quay.io/repo/demo:1.0.0-SNAPSHOT\n        imagePullPolicy: IfNotPresent\n  \
    \      name: quarkus\n        ports:\n        - containerPort: 8080\n        \
    \  name: http\n          protocol: TCP\n```\n\n+   - Maximum number of Pods that\
    \ can be unavailable when performing the deployment\n\n+   - Maximum number of\
    \ Pods that can be created over the desired number of Pods\n\n+   - Desired number\
    \ of Pods\n\nBy focusing on the maximum number of unavailable Pods, this strategy\
    \ safely upgrades your deployment, without experiencing any downtime. But, depending\
    \ on your microservice startup time, the entire transition to the newer version\
    \ of the deployment can take longer to complete. If the deployment introduces\
    \ a change that breaks the stability of the system, Kubernetes will update the\
    \ Deployment template but will keep the previous Pods."
