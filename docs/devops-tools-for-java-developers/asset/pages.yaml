    # Hardware and 3D Support


    The first Android device was the HTC Dream (a.k.a. T-Mobile G1), shown in Figure
    9-4. It had a medium density touchscreen of 320 × 480 px, a hardware keyboard,
    speaker, microphone, five buttons, a clickable trackball, and a rear-mounted camera.
    While primitive by modern smartphone standards, this was a great platform to launch
    Android, which lacked support for keyboards at the time.


    Compared to modern smartphone standards, this was a modest hardware set. The Qualcomm
    MSM7201A processor that drove the HTC Dream was a 528 MHz Arm11 processor with
    support for only OpenGL ES 1.1. In comparison, the Samsung Galaxy S21 Ultra 5G
    sports a 3200 × 1440 resolution screen with the following sensors:


    +   - 2.9 GHz 8-core processor

    - Arm Mali-G78 MP14 GPU with support for Vulkan 1.1, OpenGL ES 3.2, and OpenCL
    2.0

    - Five cameras (one front, four rear)

    - Three microphones (one bottom, two top)

    - Stereo speakers

    - Ultrasonic fingerprint reader

    - Accelerometer

    - Barometer

    - Gyro sensor (gyroscope)

    - Geomagnetic sensor (magnetometer)

    - Hall sensor

    - Proximity sensor'
