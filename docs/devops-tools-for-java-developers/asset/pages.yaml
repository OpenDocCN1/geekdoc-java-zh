  md: '# GitHub Flow


    GitHub Flow is a simplified Git workflow launched in response to the complexity
    of git-flow by Scott Chacon in another prominent blog. GitHub Flow or a close
    variant has been adopted by most development teams, since it is easier to implement
    in practice, handles the common case for continuous released web development,
    and well supported by tools.


    Key attributes include the following:


    +   Development branches

    - Branch per feature


    +   Merge strategy

    - No fast-forward merges


    +   Rebasing history

    - No rebasing


    +   Release strategy

    - No separate release branches


    GitHub Flow takes a simple approach to branch management, using master as the
    main codeline and as the release branch. Developers do all of their work on short-lived
    feature branches and integrate them back into the master as soon as their code
    passes tests and code reviews.


    ![](img/50358b52af39b0dcf9d284d547c73fdc_58_0.png)


    In general, GitHub Flow makes good use of available tooling by having a straightforward
    branching strategy and no use of complicated arguments to enable fast-forward
    merges or replace merges with rebasing. Developers who are not familiar with the
    team process or command-line Git interface therefore find GitHub Flow easy to


    GitHub Flow collaboration model works well for server-side and cloud-deployed
    applications, where the only meaningful version is the latest release. In fact,
    GitHub Flow recommends that teams continuously deploy to production to avoid feature
    stacking, in which a single release has multiple features that increase complexity
    and make it harder to determine the breaking change. However, for more complicated
    workflows with multiple concurrent releases, GitHub Flow needs to be modified
    to accommodate.'
