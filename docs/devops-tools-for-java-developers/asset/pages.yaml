  md: '# CHAPTER 1


    # DevOps for (or Possibly Against) Developers


    Baruch Sadogursky


    > While you here do snoring,

    Open-eyed conspiracy His time doth take.

    If of life you keep a care,

    Shake off slumber, and beware:

    Awake, awake!

    —William Shakespeare, The Tempest


    Most might ask if the DevOps movement is simply an ops-inspired plot against developers.
    Most (if not all) who would do so wouldn''t expect a serious response, not least
    because they intend the question as tongue-in-check teasing. It''s also because—regardless
    of how your origins are on the development or the operations side of the equation—when
    anyone strikes up a conversation about DevOps, it will take approximately 60 seconds
    before someone inquires, "What is DevOps really?”


    And you think, 11 years after the coining of the term (a decade within which industry
    professionals have spoken, debated, and shouted about it), that we had all arrived
    at a standard, no-nonsense, commonly understood definition. But this simply isn''t
    the case. In fact, despite an exponentially increasing corporate demand for DevOps
    personnel, it is highly doubtful that any five DevOps-titled employees, chosen
    at random, could tell you precisely what DevOps is.


    So, don''t be embarrassed if you still find yourself scratching your head when
    the subject comes up. Conceptually, DevOps may not be easy to grok, but it''s
    not impossible either.


    But regardless of how we discuss the term or what definition(s) we might agree
    upon, there''s one thing, above else all, that''s critical to bear in mind: DevOps
    is an entirely invented concept, and the inventors came from the ops side of the
    equation.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# DevOps Is a Concept Invented by the Ops Side


    My premise about DevOps may be provocative, but it''s provable too. Let''s start
    with the facts.


    # Exhibit 1: The Phoenix Project


    The Phoenix Project by Gene Kim et al. (IT Revolution) became a classic published
    almost a decade ago. It''s not a how-to manual (in the traditional sense, anyway).
    It''s a novel that tells the story of a highly problematic company and its IT
    manager who is suddenly assigned the task of implementing a make-or-break corporate
    initiative that''s already over budget and months behind.


    If you dwell in the realms of software, the rest of the book''s central characters
    will be familiar to you. For the moment, though, let''s have a look at their professional
    titles:


    +   * Director, IT service support

    * Director, distributed technology

    * Manager, retail sales

    * Lead systems administrator

    * Chief information security officer

    * Chief financial officer

    * Chief executive officer


    Notice the connective tissue between them? They''re the protagonists of one of
    the most important books about DevOps ever written and not one of them is a developer.
    Even when developers do figure into the plotline, well...let''s say they''re not
    spoken of in particularly growing terms.


