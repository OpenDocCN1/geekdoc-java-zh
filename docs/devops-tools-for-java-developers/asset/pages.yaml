  md: "# GitLab Flow\n\nGitLab Flow is basically an extension of GitHub Flow, as documented\
    \ on GitLab's website. It takes the same core design principles about using a\
    \ master as a single long-lived branch and doing the majority of development on\
    \ feature branches. However, it adds a few extensions to support release branches\
    \ and history cleanup that many teams have adopted as best practices.\n\nKey attributes\
    \ include the following:\n\n+   Development branches\n  Branch per feature\n\n\
    +   Merge strategy\n  Open-ended\n\n+   Rebasing history\n  Optional\n\n+   Release\
    \ strategy\n  Separate release branches\n\nThe key difference between GitHub Flow\
    \ and GitLab Flow is the addition of release branches. This is recognition that\
    \ most teams are not practicing continuous deployment at the level GitHub does.\
    \ Having release branches allows stabilization of code before it gets pushed into\
    \ production; however, GitLab Flow recommends making patches to the master and\
    \ then cherry-picking them for release rather than having an extra hotfix branch\
    \ like git-flow.\n\nThe other significant difference is the willingness to edit\
    \ history using rebase and squash. By cleaning up the history before committing\
    \ to master, it is easier to retroactively go back and read the history to discover\
    \ when changes or bugs were introduced. However, this involves rewriting the local\
    \ history and can be dangerous when history has already been pushed to the central\
    \ repository.\n\n![](img/50358b52af39b0dcf9d284d547c73fdc_59_0.png)"
