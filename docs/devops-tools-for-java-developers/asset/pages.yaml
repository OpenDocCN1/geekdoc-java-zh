  md: '# 8-5. Improving from observation to automatic recovery


    Observability also helps you measure the state of the system when traffic spikes
    occur. Applications respond with delay frustrations in end users. In such cases,
    you should investigate how you can scale your containerized applications. Moreover,
    autoscaling enables you to respond to traffic spikes that need new resources and
    instances by automatically changing their active.


    In Kubernetes, a HorizontalPodAutoscaler (HPA) resource automatically updates
    a workload resource like Deployment, aiming to scale the workload to match demand
    automatically. A HorizontalPodAutoscaler resource responds to increased load by
    deploying more Pods. If load diminishes and the number of Pods are above the minimum
    configured, the HorizontalPodAutoscaler scales the Deployment resource to scale
    down.


    As explained in the Kubernetes documentation, the algorithm HorizontalPodAutoscaler
    uses the ratio of the desired metric value to the current metric value:


    wantedReplicas = ceil[currentReplicas * (currentMetricValue / wantedMetricValue)]


    To demonstrate how the preceding algorithm works when you set up a HorizontalPodAutoscaler
    resource, let''s use the example from "Adjusting Resource Quotas" on page 231,
    where we adjusted resource quotas:


    ```

    quarkus.resources.limits.cpu=200m

    quarkus.resources.limits.memory=230Mi

    quarkus.resources.requests.cpu=100m

    quarkus.resources.requests.memory=115Mi

    ```


    Each Pod following the previous configuration can request a minimum of 100m for
    CPU. You can set the HorizontalPodAutoscaler to maintain an average CPU utilization
    across all Pods of 80% for this deployment by using the following command:

    \kubectl autoscale deployment demo --cpu-percent=80 --min=1 --max=10


    Assuming that the current metric value for CPU is 320 m and the desired value
    is 160 m, the number of replicas needed is 320 / 160 = 2.0. Based on the HorizontalPodAutoscaler
    configuration, the Deployment updates the ReplicaSet and then the ReplicaSet adds
    Pods to match the workload need. If the current metric value decreases by 120
    m, the number of replicas needed will be 120 / 160 = 0.75, and the scaledown to
    one replica will occur gradually.


