  md: '# Build with Apache Ant


    Apache Ant is an open source project released under an Apache License by the Apache
    Software Foundation. According to the Apache Ant documentation, the name is an
    acronym for Neat Tool and was initially part of the Tomcat codebase, written by
    James Duncan Davidson for the purpose of building Tomcat. Its first initial release
    was in 2000.


    Apache Ant is a build tool written in Java that provides a way to describe a build
    process as declarative steps in an XML file. This is the first build tool that
    I was exposed to in my Java career, and although Ant has heavy competition today,
    it is still an active project and widely used in combination with other tools.


    # Key Ant Terminology


    You will encounter the following terms when working with Apache Ant:


    Ant task


    +   - A small unit of work, such as deleting a directory or copying a file. Under
    the covers, Ant tasks map to Java objects, which contain the implementation details
    for the task. Many built-in tasks are available in Ant well as the ability to
    create custom tasks.


    Ant target


    Ant tasks are grouped into Ant targets. An Ant target is invoked by Ant directly.
    For example, for a target named compile, you would run the command ant compile.
    Targets can be configured to depend on each other in order to control the order
    of execution.


    ![](img/50358b52af39b0dcf9d284d547c73fdc_134_0.png)


    +   - Some Ant build files can grow to be quite large. In the same directory as
    build.xml, you can run the following command to get a list of available targets:


    ```

    ant -projecthelp

    ```


    Ant build file


    An XML file used to configure all of the Ant tasks and targets utilized by a project.
    By default, this file is named build.xml and is found at the root of the project
    directory.


    Example 5-1 is a simple Ant build file I created and executed with Ant 1.10.8.'
