    # Comparing SAST and DAST


    Table 7-1 summarizes the differences between the SAST and DAST testing approaches.


    Table 7-1: SAST versus DAST


    | SAST | DAST |

    | --- | --- |

    | Clear security testing | Opaque security testing |

    | The tester has access to the underlying framework, design, and implementation.
    | The tester has no knowledge of the technologies or framework that is built on.
    |

    | The application is tested from the inside out. | The application is tested from
    the outside in. |

    | This type of testing represents the developer approach. | This type of testing
    represents the hacker approach. |

    | Requires source code | Requires a running application |

    | SAST doesn''t require a deployed application. | DAST doesn''t require source
    code or binaries. |

    | It analyzes the source code or binary without executing the application. | It
    analyzes by executing the application. |

    | Find vulnerabilities earlier in the SDLC | Finds vulnerabilities towards the
    end of the SDLC |

    | The scan can be executed as soon as code is deemed complete. | Vulnerabilities
    can be discovered after the development cycle is complete. |

    | Less expensive to fix vulnerabilities | More expensive to fix vulnerabilities
    |

    | Since vulnerabilities are found earlier in the SDLC, remediating them is easier
    and faster. | Since vulnerabilities are found toward the end of the SDLC, remediation
    often gets into the next development cycle. |

    | Finding can be fixed before the code enters the QA cycle. | Critical vulnerabilities
    may be fixed as an emergency release. |

    | Can''t discover runtime environmental issues | Can discover runtime environmental
    issues |

    | Since the tool scans static code, it cannot discover runtime vulnerabilities.
    | The tool uses dynamic analysis on a running application, and it is able to find
    runtime vulnerabilities. |

    | Typically supports all kinds of software | Typically only scans web apps and
    web services |

    | Examples include web applications, web services, and their clients. | - DAST
    isn''t useful for other types of software. |


    If you look at the advantages and disadvantages of these two types of security
    testing, you can see that they are not mutually exclusive. On the contrary, these
    approaches complement each other perfectly. SAST can be used to identify known
    vulnerabilities. DAST can be used to identify vulnerabilities that are not yet
    known. This is primarily the case if the new attack is based on the pattern of
    common vulnerabilities. You'
  merge: -1
