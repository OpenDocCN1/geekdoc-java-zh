  md: '# Basic Tagging and Image Version Management


    After working with images awhile, you will see that identifying them and versioning
    them are a bit different from the way you version your Java software. Working
    with build tools like Maven has gotten Java developers accustomed to standard
    semantic versioning and always specifying dependency versions (or at least accepting
    of the version Maven chooses to pull within a particular dependency tree). These
    guardrails are a little more relaxed in other package managers like npm, where
    a dependency version can be specified as a range in order for ease and flexibility
    in updating dependencies.


    Image versioning can become a stumbling block if not well understood. No guardrails
    exist (at least not kind that Java developers are used to). Flexibility in tagging
    an image is preferred over any enforcement of good practices. However, just because
    you can, doesn''t mean you should, and just as with proper versioning of Java
    libraries and packages, it is best to start out with the gate naming and versioning
    scheme that makes sense and follows an accepted pattern.


    Container image names and versions follow a specific format, including multiple
    components that you rarely see in complete form in examples and tutorials. Most
    example code and Dockerfiles you find when searching the internet identifies images
    in an abbreviated format.


    It is easiest to visualize image management as a directory structure, where the
    name of an image (such as openjdk) is a directory containing all the versions
    available for this image. Images are usually identified by a name and a version,
    known as a tag. But these two components are composed of subunits that have assumed
    an default value if not specified, and often, even a tag is omitted in commands.
    For example, the simplest command for pulling the openjdk Docker image might take
    the following form:


    ```

    docker pull openjdk

    ```


    What is this actually giving us? Aren''t there several versions of the openjdk
    image that you could use? Indeed, yes, and if you are concerned with having repeatable
    builds, you will immediately spot this ambiguity as a potential problem.


    The first step is to include the image tag in this command, which represents a
    version. The following command implies that I would be pulling version 11 of the
    openjdk image:


    ```

    docker pull openjdk:11

    ```


    So what was I pulling previously, if not 11? A special tag called latest is implied
    by default if a tag is not specified. This tag is intended to point to the latest
    version of the image available, but that might not always be the case. At any
    point, a tag can be'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'updated to point to a different version of an image, and in some cases, you
    might find that the tag Latest has not been set to point to anything at all.


    It is easy to stumble over the nomenclature, notably tag, which can mean something
    different in different contexts. The term tag can mean a specific version, or
    it can also mean the image tag, which includes all the components of identification,
    including the image name.


    Here''s the complete format of a Docker tag with all possible components:


    ```

    [ registry { :port } / name [ :tag ]

    ```


    The only required component is the image name, also known as the image repository.
    If tag is not specified, then latest is assumed. If the registry is not specified,
    Docker Hub is the default registry. The following command is an example of how
    to reference an image on a registry other than Docker Hub:


    ```

    docker pull artifactory-prod.jfrog.io/openjdk:11

    ```


    # Image and Container Layers


    To build efficient containers, having a thorough understanding of layers is essential.
    The details behind how you build the source of your containers—your container
    images—greatly impact their size and performance, and some approaches security
    implications, making this concept even more important to master.


    Basically, Docker images are built by establishing a base layer and then subsequently
    making small changes until you arrive at your desired state. Each layer represents
    a set of changes including, but not limited to, the creation of users and related
    permissions, modifications to configuration or application settings, and updates
    to existing packages or adding/removing packages. These changes all amount to
    additions, modifications, or the removal of sets of files in the resulting filesystem.
    Layers are stacked on top of each other, each one being a delta of the changes
    from the previous layer, and each identified by a SHA-256 digest of its contents.
    As discussed in Docker on Your Your Machine on page 62, these layers are stored
    within the root Docker directory.


    # Visualizing layers


    One way to really visualize layers is to use the command-line tool dive, available
    on GitHub. Figure 3-5 shows a screenshot of the tool in action using the official
    openjdk image from Docker Hub. The left pane displays details about the three
    layers that compose the openjdk image. The right pane highlights the changes each
    layer applies to the filesystem of the image.'
