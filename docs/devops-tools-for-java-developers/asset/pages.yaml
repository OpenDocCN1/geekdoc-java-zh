    +   5. If the deployment is no longer needed, you can remove it using kubectl\
    \ delete.\n\nAlthough the deployment strategy is more complex and requires more\
    \ resources, you can shorten the time between software development and user feedback.\
    \ This approach is less disruptive for experimenting with features; if any issues\
    \ appear after a deployment, you can quickly route to a previous stable version.\n\
    \n![](img/50358b52af39b0dcf9d284d547c73fdc_241_0.png)\n\nYou can explore a blue/green\
    \ deployment strategy with more cloud native tools that are compatible with Kubernetes,\
    \ such as Istio and Knative.\n\nThe last strategy that we will look at is a canary\
    \ deployment. This is a way to reduce risk and validate new system features by\
    \ releasing software to a small percentage of users. Performing a canary deployment\
    \ allows you to try out the new version of a microservice with a small user audience\
    \ without replacing any of the existing instances of the application. To evaluate\
    \ the behavior of the deployments (canary and existing), you should implement\
    \ a load balancer configuration on top of the service instances and add weighted\
    \ routing to choose how much traffic is routed to each resource.\n\nCurrently,\
    \ the canary strategy can be achieved by adding an extra layer of tools (Figure\
    \ 8-3). API gateways with weighted routing support let you manage your API endpoints\
    \ and decide the amount of traffic routed towards them. Service mesh control planes\
    \ like Istio are a solution compatible with Kubernetes that can help you to control\
    \ service-to-service communication over a network and the percentage of user traffic\
    \ to each service version."
