  md: 'Git has become de facto standard in the open source community, which means
    a wide base of support exists for its usage along with a rich ecosystem. However,
    sometimes convincing your boss or peers to adopt new technologies is difficult
    if they have a deep investment in a legacy source control technology.


    Here are some reasons you can use to convince your boss to upgrade to Git:


    # Reliability


    Git is written like a filesystem, including a proper filesystem check tool (`git
    fsck`) and checksums to ensure data reliability. Given it is a DVCS, you would
    probably have your data also pushed to multiple external repositories, creating
    several redundant backups of the data.


    # Performance


    Git is not the first DVCS, but it is extremely performant. It was built from the
    ground up to support Linux development with extremely large codebases and thousands
    of developers. Git continues to be actively developed by a large open source community.


    # Tool support


    There are over 40 forwards for Git and support in just about every major IDE (JetBrains
    IntelliJ, Microsoft Visual Studio Code, Apache NetBeans, etc.), so you are unlikely
    to find a development platform that does not fully support it.


    # Integrations


    Git has first-class integrations with IDEs, issue trackers, messaging platforms,
    continuous integration servers, security scanners, code review tools, dependency
    management, and cloud platforms.


    # Upgrade tools


    There are migration tools to ease the transition from other version-control systems
    to Git, such `git svn` that supports bidirectional changes from Subversion to
    Git, or the Team Foundation Version Control (TFVC) repository import tool for
    Git.


    In summary, there is not much to lose by upgrading to Git, and a lot of additional
    capabilities to take advantage of. Getting started with Git is as simple as downloading
    a release for your development machine and creating a local repository.


    However, the real power comes in collaboration when you have a central repository
    to push changes to and collaborate with the rest of your team, and this you can
    self-host or run on their cloud platform. Several companies offer commercial Git
