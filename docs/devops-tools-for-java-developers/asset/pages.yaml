    # Interactive Application Security Testing


    Interactive application security testing (IAST) uses software tools to evaluate
    application performance and identify vulnerabilities. IAST takes an "agent-like"
    approach; agents and sensors run to continuously analyze application functions
    during automated tests, manual tests, or a mixture of both.


    The process and feedback occur in real-time during the IDE, CI or QA environment,
    during production. The sensors have access to the following:


    +   * All source code

    * Data and control flow

    * System configuration data

    * Web components

    * Backend connection data


    The main difference between IAST, SAST, and DAST is that IAST runs inside the
    application. Access to all static components as well as the runtime information
    enables a comprehensive picture. It is a combination of static and dynamic analysis.
    However, the part of the dynamic analysis is not a pure opaque text, as it is
