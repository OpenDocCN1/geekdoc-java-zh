  md: '# Extensible


    Because the wealth of human knowledge is ever increasing, the data needs to define
    mechanisms so that standards can be evolved and extended to accommodate new properties.


    Once you have defined what, when, why, and how to record the stages, inputs, outputs,
    and states of the software development cycle, you also need to keep in mind the
    consumers of subsets of the metadata. On one hand, you may have an intermediate
    consumer who will consume and react in different ways to the set of values—from
    triggering sub pipelines, promoting builds, deploying in different environments,
    or publishing artifacts. On the other hand, you may have final external consumers
    who will be able to extract information with skill and experience turn into insights
    that will help fulfill the overall goals of the organization.


    # Metadata Considerations


    The following are important considerations about metadata.


    Privacy and security


    Think twice about exposing values.


    Visibility


    Not all consumers are interested in all data.


    Format and encoding


    One specific property may be exposed during different stages in different formats,
    but consistency is needed in the naming, meaning, and possibly the general value.


    Let''s turn our attention to generating and packaging metadata with build tools.
    The Java ecosystem has no shortage of options when it comes to build tools. Arguably,
    the most popular are Apache Maven and Gradle; hence it makes sense to discuss
    them in depth. However, should your build depend on a different build tool, the
    information presented in this section will likely still prove to be useful, as
    some of the techniques to gather and package metadata may be reused.


    Now, before we jump into practical code snippets, we have to figure out three
    action items:


    +   1. Determine the metadata that should be packaged with an artifact.


    +   2. Find out how that metadata can be obtained during the build.


    +   3. Process the metadata and record it in the appropriate format or formats.


    The following subsections cover each of these aspects.'
