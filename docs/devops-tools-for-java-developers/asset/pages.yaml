    # The Role of SREs in Security


    An exception to the dev and ops specialization is the reliability engineer (SRE)
    role. The term originally comes from Google and describes the people on a team
    who deal with the reliability of services. The metric against which an SRE works
    is called the failure budget. It is assumed that the software has failures and
    that this is exactly what leads to downtimes. A service has a specific failure
    budget, or downtime budget. The SRE aims to keep service uptime within the defined
    budget by reducing downtime due to bugs, damage, or cyberattacks. To meet these
    goals, the SRE may choose to invest downtime on upgrades that can be used to deploy
    quality and security improvements to the system.


    Therefore, an SRE is a team member whose role is to ensure the balance between
    the robustness of the systems and the introduction of new features. For this purpose,
    the SRE is given up to a maximum of 50% of their working time to focus on the
    operations tasks and responsibilities. This time should be used to automate the
    systems and improve quality and security. The rest of the SRE’s is spent working
    as a developer and involved in implementing new features. And now we come to the
    exciting question: is an SRE also responsible for security?


    This role of an SRE can be in the middle of a DevOpsSec structure while the working
