    # # Spring Boot


    Spring Boot is perhaps the most well-known among the four candidates, as it builds
    on top of the legacy laid out by the Spring Framework. If developer surveys are
    to be taken at face value, more than 60% of Java developers have some sort of
    experience interacting with Spring-related projects, making Spring Boot the most
    popular choice.


    The Spring way lets assemble applications (or microservices, in our case) by composing
    components, customizing your configuration, and promising low-cost code ownership,
    as your custom logic is supposedly smaller in size than what the framework brings
    to the table, and for most organizations that''s true. The trick is to find an
    existent component that can be tweaked and configured before writing your own.
    The Spring Boot team makes a point of adding as many integrations as needed, from
    database drivers to monitoring services, logging, journaling, batch processing,
    report generation, and more.


    The typical way to bootstrap a Spring Boot project is by browsing to the Spring
    Initializr, selects the features you require in your application, and clicking
    the Generate button. This action creates a ZIP file that you can download to your
    local environment to get started. In Figure 4-1, I''ve selected the Web and Spring
    Native features. The first feature adds components that let you expose data via
    REST APIs; the second enhances the build with an extra packaging mechanism that
    can create Images with Graal.


    Unpacking the ZIP file and running the `./mvnw verify` at the root directory of
    the project ensures a sound starting point. You''ll notice the command will download
    a set of dependencies if you''ve not built a Spring Boot application before your
    target environment. This is normal Apache Maven behavior. These dependencies will
    not be downloaded again next time you invoke a Maven command—unless dependency
    versions are updated in the pom.xml file.'
