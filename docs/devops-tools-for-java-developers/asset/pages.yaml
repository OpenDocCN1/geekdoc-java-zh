    # The Common Vulnerability Scoring System


    The basic idea behind the Common Vulnerability Scoring System (CVSS) is to provide
    a general classification of the severity of a security vulnerability. The weak
    points are evaluated from various points of view. These elements are weighed against
    each other to obtain a standardized number from 0 to 10.


    A rating system, CVSS, allows us to evaluate various weak points and derive follow-actions
    from them. The focus is on standardizing the handling of these weak points. As
    a result, you can define actions based on the value ranges.


    In principle, CVSS can be described so that the probability and the maximum damage
    are related using predefined factors. The basic formula for this is risk = probability
    of occurrence × damage.


    These CVSS metrics are divided into three orthogonal areas that are weighted differently
