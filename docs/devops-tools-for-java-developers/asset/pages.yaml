  md: '# CHAPTER 10


    # Continuous Deployment

    Patterns and Antipatterns


    Stephen Chin

    Baruch Sadogursky


    > Learn from the mistakes of others. You can''t live long enough to make them
    all yourself.

    —Eleanor Roosevelt


    In this chapter, we will give you the patterns for continuous deployment that
    you need to be successful with implementing DevOps best practices in your organization.
    It is important to understand the rationale for continuous updates to be able
    to convince others in your organization about the change needed to improve your
    deployment process.


    We will also give you plenty of antipatterns from companies that have failed to
    adopt continuous update best practices. It is good to learn from the failures
    of others, and plenty of recent examples exist in the high technology industry
    of what not to do and the consequences of ignoring best practices.


    After completing this chapter, you will be armed with knowledge of seven best
    practices of continuous updates that you can start using today in join the top
    26% of DevOps “Elite Performers” of the software industry.


    # Why Everyone Needs Continuous Updates


    Continuous updates are no longer an optional part of a software development but
    are a best practice to be adopted by any major project. Planning for continuous
    delivery of updates is just as important as the functional requirements of the
    project and requires a high level of automation to execute on reliably.'
  merge: -1
  pgno: 296
- img_proc: true
  md: 'It was not always this way. Historically, software was delivered on a much
    lower cadence and received only critical updates. Also, installation of updates
    was often a manual and error-prone process that involved tweaking of scripts,
    data migration, and significant downtime.


    This has changed in the past decade. Now users expect new features to be added
    constantly, which is driven by their experience with consumer devices and continuously
    updated applications. Also, the business risk associated with deferring critical
    updates is significant, as security researchers constantly uncover new exploits
    that can be used to compromise your system unless it is patched. Finally, continuously
    updated software becomes a business expectation in the cloud age, as the entire
    infrastructure stack is constantly being updated to improve security, often with
    the requirement that you update your application.


    Not all software projects have been as quick to adopt continuous update strategies,
    especially in industries that are used to longer adoption cycles. However, the
    widespread use of common hardware architectures and open source technologies means
    that these projects are at an equal risk of exposure from critical vulnerabilities.
    When exposed, this can lead to catastrophic failures that are difficult or impossible
    to recover from. Like any other software, open source projects have bugs and security
    vulnerabilities, which are fixed and patched faster than in proprietary projects,
    but if the organization doesn''t update, what will the patches do?


    In the next few sections we will dig into the motivation for continuous updates
    in more detail. If you do not already have a continuous update strategy, the material
    in this chapter will help you convince others in your organization to adopt one.
    If you have already embraced continuous updates, you will be armed with knowledge
    to reap the business benefits of having infrastructure and DevOps processes superior
    to those of your competitors.


    # User Expectations on Continuous Updates


    The expectations of end users on release cadence of new features has dramatically
    shifted in the last decade. This is driven by a change in the way features and
    updates are delivered on consumer devices, which translates to similar expectations
    on other software platforms, even in the enterprise. Forcing users to wait for
    a long release cycle or to perform a costly migration to take advantage of new
    features will result in dissatisfied users and put you at a competitive disadvantage.


    This change in user expectations can be seen in several consumer industries, including
    cell phones. When mobile communication first started to gain popularity, Nokia
    was one of the dominant hardware manufacturers of 2G cell phones. While primitive
    today''s standards, the phones had excellent hardware design with good voice quality,
    tactile buttons, and rugged design.'
  merge: -1
  pgno: 297
- img_proc: true
  md: 'Small-form-factor mobile devices such as the Nokia 6110 accelerated adoption
    of cellular technology, but the software on these devices and users'' ability
    to update them were extremely poor. This was a common problem with early consumer
    device companies in that they considered themselves hardware companies first and
    were slow to adopt modern practices in software development.


    Like many emerging technologies, the software shipped with Nokia phones were bare-bones
    and buggy, requiring patches and updates to remain usable. While Nokia offered
    a data call, this was limited to basic operations like transferring contents from
    the device to a computer, but didn''t allow maintenance features such as performing
    firmware updates. To get a feature update on your phone that contained important
    patches and mission-critical features (like the Snake game), you would need to
    take your phone into a service center to update it.


    It wasn''t until the iPhone came out in 2007 that the phone industry took a software-first
    approach to mobile design. With the ability to update the firmware and entire
    operating system from an attached computer and later over-the-air updates, Apple
    could rapidly deploy new features to existing devices.


    In 2008, Apple announced the App Store, which created a vibrant app ecosystem
    and laid the foundation for modern store features like security sandboxing and
    automatic application updates, which we will come back in 2011 with this chapter
    a case study. With the release of iOS 5 in 2011, Embrace embraced over-the-air
    updates; you no longer needed a computer to install the latest version of the
    operating system.


    Now the process of updating software on your phone is seamless and automated to
    the point where most consumers have no idea which version of the operating system
    or individual applications they are running. As an industry, we have trained the
    general public that continuous updates are not only expected, but required for
    functionality, productivity, and security.


    This model of continuous updates has become the norm for consumer devices of all
    types, including smart TVs, home assistants, and ever never-updating routers.
    While the car industry has been slow to adopt a continuous update strategy, Tesla
    is pushing the industry with biweekly updates to your vehicle right on your home
    network. No longer do you need to drive to a vehicle service center for a recall
    or critical software update.


    # Security Vulnerabilities Are the New Oil Spills


    Oil spills have had a tremendously effect on the environment over the past 50
    years and continue to be an ongoing crisis. When running smoothly, oil drilling
    rigs are immensely profitable, but when accidents or natural disasters occur (particularly
    at sea, where environmental damage is amplified), the cost can be'
  merge: -1
  pgno: 298
- img_proc: true
  md: 'enormous. For large companies BP, which can afford to pay or set aside tens
    of billions of dollars for fines, legal settlements, and cleanups, oil spills
    are just a cost of doing business. However, for drilling operations run by smaller
    companies, a single oil spill can span financial disaster and puts out of business
    with no means to address the aftermath.


    This was the case for Taylor Energy, which lost an oil platform off the coast
    of Louisiana to Hurricane Ivan in 2004 and was leaking 300 to 700 barrels per
    day. This disaster continues to haunt Taylor Energy, which is both the recipient
    and instigator of multiple lawsuits surrounding the oil spill and ongoing containment
    efforts. Taylor Energy has already spent $435 million to reduce the oil leakage
    in what became the oil spill in US history, with the potential to keep leaking
    for the next century.


    This is analogous to the risk that software vulnerabilities pose to the technology
    industry. Software systems have become increasingly complex, which means that
    there are more dependencies on open source software and third-party libraries,
    and it''s a good thing. The problem is, old-school security audits doesn''t work
    anymore, making it virtually impossible to guarantee that a system is free of
    vulnerabilities.


    According to the 2021 “Open Source Security and Risk Analysis Report” by Synopsis,
    open source software is used in 99% of enterprise projects, and 84% of those contained
    at least one public vulnerability, with an average of 158 vulnerabilities per
    codebase.


    So how bad are these vulnerabilities that plague commercial codebases? The top
    10 vulnerabilities allow an attacker to obtain sensitive information like authentication
    tokens and user cookies, execute arbitrary code in the client browser, and trigger
    denial-of-service conditions.


    Organizations'' reactions to security vulnerabilities can be organized into three
    steps that have to occur sequentially in order to respond:


    +   1. Identify: first the organization must realize that a security issue exists
    and is currently or potentially be exploited by an attacker.


    +   2. Fix: once a security issue is identified, the development team must come
    up with a software fix to patch the issue.


    +   3. Deploy: the final step is to deploy the software fix that addresses the
    security issue, often to a large set of end users or target devices that are affected
    by the vulnerability.


    Going back to the Taylor Energy oil spill, you can see how difficult these steps
    are in the physical world:'
  merge: -1
  pgno: 299
