    # High Availability and Geographic Distribution


    When working on a software system, you have probably received a nonfunctional
    requirement indicating that your application(s) should be available 24/7. In the
    industry literature, availability refers to the probability that a system is operational
    at a given time; this is expressed as a percentage of uptime in a given year.


    High availability (HA) is the ability of a system to work continuously without
    failure for an established time. As developers, we create software with the intent
    to be always available for end users, external factors like power outages, network
    failures, and underprovisioned environments can impact the quality of service
    received by consumers.


    Small-size container images and successful deployments to Kubernetes are the first
    steps toward having an application available on Kubernetes. For example, let''s
    assume you have to upgrade your worker nodes to a newer Kubernetes version. This
    operation includes that your nodes have to pull all the containers before working
    with the latest Kubernetes version. The longer it takes for each node to pull
    the containers, the lengthier it will be for the cluster to work as expected.


    Different deployment strategies were explained in "Choose and Implement a Deployment
    Strategy" on page 219 because downtime, traffic routing between deployment versions,
    and the rollback process availability. In a failed deployment, a fast rollback
    process can save you from user discomfort, and compute resources. Moreover, you
    want your system to have a highly available state, and the way you define health
    checks and adjust resources for your containerized applications impacts its performance
    to work continuously without failure for an established time. Eventually, you
    can fine-tune your health checks, resource consumption, and deployments by observing
    your system''s behavior through logs, metrics, and traces.


    Availability is commonly defined as a percentage of uptime in a given year. Table
    8-7 shows the connection between a given availability percentage to the corresponding
    amount of downtime per year. The table uses a year with 365 days, and for consistency,
    all times are rounded to two decimal digits.'
