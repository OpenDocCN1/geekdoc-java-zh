    Twitter, and others getting better and better, and therefore needing to process
    larger amounts of data. This projection affirms more and more companies will be
    graduating into the world of big. With that comes the demands of vastly increased
    data loads, as well the shift from traditional staging-server environments, which
    offered exact replicas of production environments. And this shift is predicated
    on the fact that maintaining such pair-to-pair schemes is no longer feasible in
    terms of size or speed.


