  md: 'The disadvantage is that rebase creates entirely new commits when it moves
    the history, so if the current branch contains changes that have previously been
    pushed, you are rewriting history that other clients may depend upon.


    # reset


    Reverts the HEAD to a previous state, and has practical uses such as reverting
    an add or undoing a commit. However, if changes have been pushed remotely, this
    can cause problems with the upstream repository. Use with care!


    # switch


    Switches between branches for the working copy. If you have changes in the working
    copy, this can result in a three-way merge, so it is often better to commit or
    stash your changes first. With -c, this command will create a branch and immediately
    switch to it.


    # tag


    Allows you to create a tag on a specific commit that is signed by PGP. This uses
    the default email address PGP key. Keys are cryptographically signed and unique,
    they should not be reused or changed once pushed. Additional options on this command
    allow for deleting, verifying, and listing tags.


    # log


    Shows the commit logs in a textual format. It can be used for a quick view of
    recent changes, and supports advanced options for the history subset shown and
    formatting of the output. Later in this chapter, we also show how to visually
    browse the history by using tools like gitk.


    +   - Collaboration:


    # fetch


    Pulls the history from a remote repository into the local repository, but makes
    no attempt to merge with local commits. This is a safe operation that can be performed
    at any time and repeatedly without causing merge conflicts or affecting the working
    copy.


    # pull


    Equivalent to a git fetch followed by git merge FETCH_HEAD. It is convenient for
    the common workflow of grabbing the latest changes from a remote repository and
    integrating it with your working copy. However, if you have local changes, pull
    can cause merge conflicts that you are forced to resolve. For this reason, it
    is often safer to fetch first and then decide if a simple merge will suffice.'
