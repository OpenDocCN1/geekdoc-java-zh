  md: '# Continuous Uptime


    In the cloud age, one of the most important measures for business success is service
    uptime. Rather than just delivering software, many companies are moving to a software-as-a-service
    (SaaS) model, where they are also responsible for the infrastructure that runs
    on. Unexpected interruptions of service can be extremely costly, in breach of
    service-level agreements and in customer satisfaction and retention.


    While uptime is important for all business-provided internet services, there is
    no place where uptime is more important than in companies that build and support
    the very infrastructure the internet relies upon. Let''s take a deeper look at
    one of the internet giants that run global infrastructure underlying over 10%
    of the websites in the world and a myriad of applications and services that we
    rely upon on a daily basis.


    # Case Study: Cloudflare


    As internet usage has exploded, so has the need for highly reliable, globally
    distributed, and centrally managed infrastructure like content delivery networks
    (CDNs). Cloudflare’s business is providing a highly reliable content delivery
    infrastructure to businesses across the world with the promise that it can deliver
    faster and more reliably than your own infrastructure or cloud computing servers.
    This also means that Cloudflare has one job, which is never to go down.


    While Cloudflare has had production issues over the years involving DNS outages,
    buffer overflow data leaks, and security breaches, as its business has grown,
    the scale of the problem and resulting damage has gone up. Five of these outages
    occurred on a global scale, taking out an increasingly large portion of the internet.
    While many may secretly be happy to have a 30-minute break from the internet courtesy
    of continuous uptime failures (after which we promptly complain about on Twitter),
    losing access to hundreds of servers over the internet can cause major disruptions
    for businesses and high financial loss.


    We are going to focus on the three most recent global Cloudflare outages, what
    happened, and how they could have been prevented with continuous update practices.


    # 2013 Cloudflare router route outage


    In 2013, Cloudflare had 23 data centers across 14 countries serving 785,000 websites
    and over 100 billion page views per month. At 9:47 UTC on March 3, Cloudflare
    had a system-wide outage affecting all of its data centers when it effectively
    dropped off the internet.'
  merge: -1
  pgno: 311
- img_proc: true
  md: "After the outage commenced, diagnosing the problem took about 30 minutes, and\
    \ a full hour for all services to be restored at 10:49 UTC. The outage was caused\
    \ by a bad rule that was deployed to the Juniper routers that sat on the edge\
    \ of all its data centers, shown in Example 10-1. It was intended to prevent an\
    \ ongoing distributed-denial-of-service (DDoS) attack that had unusually large\
    \ packets in the range of 99,971 to 99,985 bytes. Technically, the packets would\
    \ have been discarded after hitting the network, since the largest allowed packet\
    \ size was 4,470, but this rule was intended to stop the attack at the edge before\
    \ it impacted other services.\n\n# Example 10-1. The rule that caused Cloudflare’s\
    \ routers to crash\n\n```\n+ route 173.X.X.X/32-DNS-DROP {\n+   destination 173.X.X.X/32;\n\
    +   port 53;\n+   packet-length [ 99971 99985 ];\n+ }\n+ then discard;\n+ }\n\
    ```\n\nThis rule caused the Juniper routers to consume all RAM until they crashed.\
    \ Removing the offending rule fixed the problem, but many routers were in a state\
    \ where they could not autobooted and required manual power cycling.\n\nCloudflare\
    \ blamed Juniper networks and their FlowSpec system that deploys rules across\
    \ a large cluster of routers, Cloudflare is the company that deployed an untested\
    \ rule to its hardware with no ability to fail or roll back in the case of failure.\n\
    \n# Continuous Update Best Practices\n\n+   - Progressive delivery\n  - Problem:\
    \ In a distributed system, deploying new code to all production nodes (in this\
    \ case, routers) simultaneously also breaks them simultaneously.\n  - Solution:\
    \ Using a canary release design pattern, you can deploy the change to a few nodes\
    \ first and test for issues before continuing the update. If an issue occurs,\
    \ simply roll back the affected nodes and debug it.\n- Local rollbacks\n  - Problem:\
    \ Reconfiguring edge devices can cause them to lose connectivity, making it difficult\
    \ or impossible to reset them. In this case, an additional 30 minutes of downtime\
    \ was spent manually resetting routers across 23 data centers and 14 countries."
