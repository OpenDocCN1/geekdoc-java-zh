    +   - Compliance/security


    Tracking

    Being able to track the code history is a core feature of any version control
    system, but often additional compliance checks and reports are required.


    Auditing changes

    For control and regulatory purposes, auditing the changes to a codebase often
    required, so having tools to automate this can be helpful.


    Permissions management

    Fine-grained roles and permissions allow for restricting access to sensitive files
    or codebases.


    Bill of materials

    For auditing purposes, a full list of all software modules and dependencies is
    often required, and can be generated off the source code.


    Security vulnerability scanning

    Many common security vulnerabilities can be uncovered by scanning the codebase
    and looking for common patterns that are used to exploit deployed applications.
    Using an automated vulnerability scanner on the source code can help identify
    vulnerabilities early in the development process.


    +   - Integration

    Issue tracking

    By having tight integration with an issue tracker, you can tie specific changesets
    to a software device, making it easier to identify the version a bug is fixed
    in and trace any regressions.


    CI/CD

    Typically, a continuous integration server will be used to build the code checked
    into source control. A tight control makes it easier to kick off builds, report
    back on success and test results, and automate promotion and/or deployment of
    successful builds.


    Binary package repository

    Fetching dependencies from a binary repository and storing build results provides
    a central place to look for artifacts and to stage deployments.'
