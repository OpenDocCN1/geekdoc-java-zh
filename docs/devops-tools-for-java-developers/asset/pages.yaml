    Compared to a physical disaster like an oil spill, you would think security vulnerabilities
    would be relatively easy to identify, fix, and deploy. However, as we will see
    in the following case studies, software vulnerabilities can be just as damaging
    and costly, and by far much more common.


    # UK hospital ransomware


    Let’s look at another security breach. In 2017, a worldwide cyberattack was launched
    that encrypted the hacked computers and required a bitcoin “ransom” payment to
    recover the data. This attack had been exploited via the EternalBlue exploit on
    the Windows Server Message Block (SMB) service that had been previously discovered
    by the US National Security Agency (NSA) and leaked a year prior to the attack.


    Upon infection, the virus attempted to replicate itself on the network and encrypted
    critical files, preventing their access, presenting a ransom screen. Microsoft
    had released patches for older versions of Windows that were affected by this
    exploit, but many systems were not updated because of poor maintenance or a requirement
    for 24/7 operation.


    One organization critically impacted by this ransomware attack was the United
    Kingdom National Health Service (NHS) hospital system. Up to 70,000 devices on
    its network—including computers, MRI scanners, blood-storage refrigerators, and
    other critical systems—were affected by the virus. This also involved diversion
    of emergency ambulance services to hospitals and at least 139 patients who had
    an urgent referral for cancer that got cancelled.


    The WannaCry ransomware attack resulted in an estimated 19,000 cancelled appointments
    and cost approximately £19 million in lost output and £73 million in IT costs
    to restore systems and data in the weeks after the attack. All of the affected
    systems were running an unpatched or unsupported version of Windows that were
    susceptible to the ransomware. The majority were on Windows 7, but many were also'
