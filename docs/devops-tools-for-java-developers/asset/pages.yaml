  md: '# Vulnerabilities: Timeline from Inception Through Production Fix


    Again and again, we read something in the IT news about security gaps that have
    been exploited. The more severe the classification of this loophole, the more
    attention this information will get in the general press. Most of the time, we
    hear and read nothing about the security holes found that are not as well-known
    as the SolarW hack. The typical timeline of a vulnerability is shown in Figure
    7-4.


    ![](img/50358b52af39b0dcf9d284d547c73fdc_205_0.png)


    # Creation of a vulnerability


    Let''s start with the birth of a vulnerability. This can be done in two ways.
    On the one hand, it can happen to any developer who has an unfortunate combination
    of source code pieces that creates a security hole. On the other hand, it can
    also be based on targeted manipulation. However, this has essentially no effect
    on the further course of the lifeline of a security vulnerability. In the following,
    we assume that a security hole has been created and that it is now active in some
    software. These can be executable programs or libraries integrated into other
    software projects as a dependency.


    # Discovery of the vulnerability


    In most cases, it is not possible to understand precisely when a security hole
    was created, but let''s assume that a security hole exists and that at some point
    it will be discovered. A few different scenarios could occur, depending on who
    finds the security hole first.'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'If a malicious actor finds the security hole, they will probably try to keep
    it a secret so they can profit from it. The two ways to profit are either to exploit
    the security hole themselves or to sell information about the security hole to
    an interested party. In either case, the quicker they are able to profit from
    the security hole, the less likely it is discovered and patched.


    Conversely, if the security hole is found by ethical attackers, they will first
    verify that the security hole can be exploited without any damage, and then disclose
    it to the affected parties. Often a financial motivation exists for this as well.
    These can be driven by bug bounties and rewards by companies aware of their potential
    for security holes and willing to pay to have them disclosed by the company rather
    than to attackers. Also, companies that maintain vulnerability databases are incentivized
    to find security holes and disclose them to their customer base in absence of
    making them publicly known.


    And another possibility is that the company discovers the security vulnerability
    by itself. In this case, the company may be inclined to either hide the vulnerability
    or present it as harmless. However, the best approach is to fix the vulnerability
    as soon as possible, a malicious actor could discover the vulnerability or perhaps
    already knows about it and is waiting to exploit it.


    Regardless of the route via which the knowledge comes to the vulnerability databases,
    only when the information has reached one of these points can we assume that this
    knowledge will be available to the general public over time.


    # Public availability of the vulnerability


    Each provider of security vulnerabilities has a subset of all publicly disclosed
    vulnerabilities. To get a more holistic set of vulnerabilities, you need to aggregate
    multiple sources. Furthermore, since the vulnerability databases are constantly
    being updated, this needs to be an automated process.


    It is also crucial that the vulnerabilities are processed in a way that further
    processing by machines is possible. Critical meta-information such as the CVE
    or CVSS value needs to be included. For example, the CVSS value can be used in
    CI environments to interrupt processing when a specific threshold value is reached.


    As an end user, there is really only one way to go here. Instead of contacting
    the providers directly, you should rely on services that integrate a wide variety
    of sources and offer a processed and merged database. Since the information generally
    represents a considerable financial value, commercial providers of such data sets
    invest a lot of resources to make sure it is accurate and up-to-date.'
