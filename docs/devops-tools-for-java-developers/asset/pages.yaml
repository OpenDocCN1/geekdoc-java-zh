  md: '# DevOps Tools for Java Developers


    With the rise of DevOps, low-cost cloud computing, and container technologies,
    the way Java developers approach today has changed dramatically. This practical
    guide helps you take advantage of microservices, serverless, and cloud native
    technologies using the latest DevOps techniques to simplify your build process
    and create hyperproductive teams.


    Stephen Chin, Melissa McKay, Ixchel Ruiz, and Baruch Sadogsky from JFrog help
    you evaluate an array of options. The list includes source control with Git, build
    declaration with Maven and Gradle, CI/CD with CircleCI, package management with
    Artifactory, containerization with Docker and Kubernetes, and whatever you''re
    building applications with Jakarta EE, Spring Boot, Dropwizard, MicroProfile,
    Micronaut, or Quarkus, this comprehensive guide has covered you.


    +   * Explore software lifecycle best practices

    * Use DevOps methodologies to facilitate software development and delivery

    * Understand the business value of DevOps best practices

    * Manage and secure software dependencies

    * Develop and deploy applications using containers and native technologies

    * Manage and administer source control repositories and development processes

    * Use automation to set up and administer build pipelines

    * Identify common deployment patterns and antipterns

    * Maintain and monitor after deployment


    > From the Foreword

    “The authors do an excellent job of walking you through all the related steps,
    from package management to securing artifacts and deploying.”


    — Daniel Bryant

    Head of DevRel at Ambassador Labs, Java Champion


    Stephen Chin is head of developer at JFrog and author of The Definitive Guide
    to Modern Java Clients with JavaFX 17 and Raspberry Pi (Oracle Press).


    Melissa McKay is a developer advocate at JFrog, a Java Champion, Docker Captain,
    and is active in the developer community.


    Ixchel Ruiz is a Java Champion, Groundbreaker Ambassador, Hackingarten enthusiast,
    JUG leader, public speaker, and mentor.


    Baruch Sadogsky is head of DevOps advocacy at JFrog. He''s co-author of Liquid
    Software (CreateSpace) and a passionate speaker on DevOps and DevSecOps.


