    * Measure and expose details about errors and exceptions that occur within your
    system. Use these details later to establish error patterns and thus proper enhancement.


    # Logging


    At the Java application level, developers use logging to record exceptional cases.
    Logs are useful to obtain insights with additional context information and can
    complement existing metrics. When it comes to logging, three formats are available:
    plain text, JSON or XML, and binary.


    Besides the Java language built-in log, several logging frameworks can help you
    achieve this task: Simple Logging Facade for Java (SLF4J) and Apache Log4j 2.
    Some logging best practices include the following:


    +   * Be conservative, log details that are relevant to a particular functionality
    of your system.

    * Write meaningful information in the log message in order to help you and your
    colleagues troubleshoot future issues.

    * Use the correct level: TRACE for capturing fine-grained insights, DEBUG for
    statements helpful when troubleshooting, INFO for general information, WARN and
    ERROR to signal events that might require action.

    * Make sure you use guard clauses or lambda expressions to log messages if the
    corresponding log level is enabled.

    * Have the log level customizable via variables that can be set at container runtime.

    * Set appropriate permissions to locations where your log files will live.'
