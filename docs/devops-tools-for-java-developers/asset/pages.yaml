  md: 'Hybrid cloud architecture differs from multicloud by including a private cloud
    infrastructure component and at least one public cloud (Figure 8-9). As a result,
    when a hybrid cloud architecture has more than one public offering, that architecture
    can be simultaneously a multicloud one.


    ![](img/50358b52af39b0dcf9d284d547c73fdc_265_0.png)


    Figure 8-9. Multicloud and hybrid cloud


    When deploying on hybrid or multicloud infrastructures, you should take into consideration
    these cross-team aspects:


    +   * Having a unified view over what and where you deployed.

    * Replacing provider-specific SaaS and IaaS services.

    * Following a unified approach for mitigating security vulnerabilities across
    clouds.

    * Scaling out and provisioning new seamlessly.

    * When you port applications across clouds, you need to avoid disconnection of
    services. There is a time to recover when moving workloads between infrastructures,
    but you can provide an end-user flawless transition using appropriate network
    configurations and deployment strategies.

    * At such large scale, automation helps when orchestrating processes. Besides,
    the orchestrations platform for containerized applications, and your team will
    likely add an extra layer of tools and processes to manage workloads.


    From a developer point of view, you can contribute to a hybrid or multicloud strategy
    by taking care of these elements:


    +   * Your application''s codebase should be the same regardless of the environment
    (namespace).

    * Your local building and deployment practice should be reproducible when other
    colleagues attempt to work with your code.

    * Avoid referencing local dependencies in your cloud or container image build.

    * When possible, parameterize the container image through build-time variables
    or environment variables.'
