  md: "Semantic versioning tells us version tokens (separated by dots) have specific\
    \ meaning based on their position. The first token identifies the major release,\
    \ the second token identifies the minor release, and the third token identifies\
    \ the build/patch/fix/revision release. It's also custom that version 27.0.1 is\
    \ seen as more recent than 25.1.0 because the number 27 is greater than 25. In\
    \ our case, we have two versions for guava in the graph, 27.0.1-android and 25.1-android,\
    \ and both are found at the same distance from the current POM—that is, one level\
    \ down in the transitive graph.\n\nIt's easy to assume that because we, as developers,\
    \ are aware of semantic versioning and can clearly determine which version is\
    \ more recent, so Maven—and that is where assumption clashes with reality! Maven\
    \ looks at the version, but looks only at the location within the graph. This\
    \ is why we get results if the order of dependencies changes. We use the <dependencyManagement>\
    \ section to fix this issue.\n\nDependencies in the <dependencyManagement> section\
    \ usually have three GAV coordinates. When Maven resolves dependencies, it will\
    \ look at the definitions in this section to see whether there's a match for groupId\
    \ and artifactId, in which case the associated version will be used. It does not\
    \ matter how deep in the graph a dependency may be, or how many times it be found\
    \ in the graph. If there's a match, that explicit version will be the chosen one.\
    \ We verify this by adding a <dependencyManagement> section to the consumer POM\
    \ like this:\n\n```\n<xml version=\"1.0\" encoding=\"UTF-8\"?>\n<project>\n  <xsi:schemaLocation=\"\
    http://maven.apache.org/POM/4.0.0 \n  xmlnsns:http=\"http://maven.apache.org/xsd/maven-4.0.0.xsd\"\
    \n  xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\">\n  <modelVersion>4.0.0</modelVersion>\n\
    \  <groupId>com.acme</groupId>\n  <artifactId>example</artifactId>\n  <version>1.0-SNAPSHOT</version>\n\
    \n  <dependencyManagement>\n    <dependencies>\n      <dependency>\n        <groupId>com.google.guava</groupId>\n\
    \        <artifactId>guava</artifactId>\n        <version>29.0-jre</version>\n\
    \      </dependency>\n    </dependencies>\n  </dependencyManagement>\n\n  <dependencies>\n\
    \    <dependency>\n```"
