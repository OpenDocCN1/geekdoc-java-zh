  md: '# Screen size and resolution


    Android devices come in a wide array of form factors and hardware configurations,
    with a trend toward larger and more pixel-dense displays. A well-designed application
    needs to scale in order to work well across a range of screen sizes and resolutions.


    # 3D support


    Particularly for games, it is critical to know what level of 3D support you will
    get on devices, in terms of APIs and performance.


    # Hardware features


    Most Android devices come with basic hardware sensors (camera, accelerometer,
    GPS), but support varies for newer hardware APIs as near-field communication (NFC),
    barometers, magnetometers, proximity and pressure sensors, thermometers, and so
    on.


    # Android OS Fragmentation


    Android version fragmentation affects device testing at two levels. The first
    is the major Android version, which determines the number of Android API versions
    you need to build for and test against. And the second is the OS customization
    done by original equipment manufacturers (OEMs) to support specific hardware configurations.


    In the case of iOS, since Apple controls the hardware and the operating system,
    it is able to push updates for all supported devices simultaneously. This keeps
    the adoption level of minor updates for performance and security fixes high. Apple
    also puts a lot of features and marketing into major releases to push the installed
    base to upgrade to the latest version quickly. As a result, Apple was able to
    achieve 86% adoption of iOS 14 only seven months after its initial release.


    The Android market is significantly more complex since OEMs modify and test custom
    versions of Android OSs for their devices. In addition, they are reliant on system-on-chip
    (SoC) manufacturers to provide code updates for different hardware components.
    This means devices created by major vendors are likely to receive only a couple
    of major OS versions, and devices from smaller vendors may never see an OS upgrade
    even when they are support.


    To help decide how far back you should support different Android versions, Google
    provides information in Android Studio about the device adoption by API level.
    The distribution of users as of August 2021 is shown in Figure 9-2. To achieve
    >86% adoption comparable to the latest iOS version, you need to support at least
    Android 5.1 Lollipop, a release that came out in 2014. Even then you are still
    missing out over 5% of users who are still using Android 4-based devices.'
