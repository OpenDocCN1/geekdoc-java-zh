  md: 'achieving the benefits of this architectural pattern while reducing the drawbacks
    of adopting it. This chapter covers antipatterns and contains code examples of
    microservices written with popular microservice frameworks such as Spring Boot,
    Micronaut, Quarkus, and Helidon.


    Traditionally a monolithic architecture delivers or deploys single units or systems,
    addressing all requirements from a single source application, and two concepts
    can be identified: the monolith architecture and the monolithic architecture.


    A monolith application has only one deployed instance, responsible for performing
    all steps needed for a specific function. One characteristic of such an application
    is a unique interface point of execution.


    A monolithic architecture refers to an application for which all requirements
    are addressed from a single source and all parts are delivered as one unit. Components
    may have been designed to restrict interaction with external clients in order
    to explicitly access private functionality. Components in the monolith may be
    interconnected or interdependent rather than loosely coupled. In other words,
    from the outside or user perspective, there is little knowledge of the definitions,
    interfaces, data, and services of other components.


    Granularity is the aggregation level exposed by a component to other external
    cooperating or collaborating parts of software. The level of granularity in software
    depends on several factors, such as the level of confidentiality that must be
    maintained within a series of components and not be exposed or available to other
    consumers.


    Modern software architectures are increasingly focused on delivering functionality
    by bundling or combining software components from different sources, resulting
    in or emphasizing a finer granularity in level of detail. The functionality exposed
    then different components, customers, or consumers is greater than in a monolithic
    application.


    To quantify how independent or interchangeable a module is, we should look closely
    at the following characteristics:


    +   * Number of dependencies

    * Strength of these dependencies

    * Stability of the module depends on


    Any high score assigned to the previous characteristics should trigger a second
    review of the modeling and definition of the module.'
