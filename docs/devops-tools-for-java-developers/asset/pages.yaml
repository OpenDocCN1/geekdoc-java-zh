    # # Tracing


    Within a distributed system, a request traverses multiple components. Tracing
    helps you capture metadata and timing details concerning the flow of a request
    to identify slow transactions or where failures occur.


    Finding the right instrumentation to capture traces can be challenging for a developer.
    Proprietary agents can help you with, but you should look into solutions aligned
    to vendor-neutral, open standards like OpenCensus or OpenTracing. Many developers
    found it difficult to choose the best option for an application and have it work
    across vendors and projects, so OpenTracing and OpenCensus projects merged and
    formed another CNCF incubating project called OpenTelemetry. This collection of
    tools, APIs, and SDKs standardizes the way you collect and transmit metrics, logs,
    and traces. The OpenTelemetry tracing specification defines the following:


    Trace

    A single transaction request that uses other services and resources as moves through
    a distributed system.


    Span

    A named, timed operation representing a workflow piece. A trace contains multiple
    spans.


    Attributes

    Key/value pairs that you can use to query, filter, and comprehend trace data.


    Baggage items

    Key/value pairs that cross process boundaries.


    Context propagation

    A common subsystem shared by traces, metrics, and baggage. A developer can pass
    additional context information to a span by using attributes, logs, and baggage
    items.'
