  md: '# Foreword


    When we began writing Continuous Delivery in Java in 2017, both Abraham Marin-Pérez
    and I know that DevOps would be a big part of our book. Since then, the importance
    for Java developers to know and understand operational concepts has only increased.
    With the rise of technologies such as cloud and containers, and supporting concepts
    of observability and site reliability engineering (SRE), the vast majority of
    us are no longer “just” developers; we’re now often responsible for the coding,
    shipping, and running of our applications. Therefore, it makes sense for developers
    to embrace ops and vice versa.


    The term DevOps is not new; it has been in use for 15 or 5 years. The concept
    was originally based around agile infrastructure, which emerged from the 2008
    Agile Conference in Toronto where Patrick Debois, Andrew Clay Shafer, and many
    others to discuss the challenges within traditional synonym approaches. The desire
    to “program” infrastructure meant that there has always been the influence of
    software engineering in this space. In the 2009 O’Reilly Velocity conference,
    John Allsp and Paul Hammond presented their now-famous titled, “10 Deploys a Day:
    Dev and Ops Operation at Flickr,” which cemented the importance of devs collaborating
    with ops.


    In my day at Ambassador Labs, I see an increasing number of organizations building
    platforms to enable developers to rapidly get their ideas and code into production
    and in first of customers. The most important goals are obtaining fast feedback
    and doing so safely, without crashes or security incidents. In my mind, these
    platforms are the products resulting from the effective collaboration of dev and
    ops.


    We know from the research by Dr. Nicole Forsgren, Jez Humble, and Gene Kim, which
    was captured in the most-read book, Accelerate (IT Revolution Press, 2018), high-performing
    organizations have a higher deployment frequency, lower lead time for changes,
    smaller change failure rate, and lower mean time to restore production issues.
    All of these factors are influenced by your platform, processes, and'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'people. Developers have to think like operators, and operators have to embrace
    development principles. It''s all about shared ownership, and this starts with
    shared understanding. This book will help you develop this understanding.


    As a developer, you''ve no doubt de-bt using version control to store and manage
    your application code for the past decade. Modern DevOps practices like GitOps
    take this step further and store application and infrastructure configuration
    in version control. It is, therefore, vital to learn version control systems skills
    as presented in the early chapters.


    The rise of microservices has presented many opportunities for developers, and
    also many challenges. Some of these challenges can be mitigated by appropriate
    technology. Containers and related scheduling frameworks, like Kubernetes, help
    with packaging and running microservice in a standardized and automated fashion.


    Of course, you will also need to understand the impact of these "cloud native"
    technologies on continuous integration and continuous delivery practices. The
    authors of this book have done an excellent job of walking you through all the
    related steps, from package management to securing assets and deploying.


    I''ve been to learn firsthand from all of the authors. I''ve lost count of the
    number of times I''ve been attending a DevOps conference with crowds of people
    wandering around only to see Baruch''s distinctive top hat moving slowly through
    the crowd, or to bump up against a leather jacket-wearing motorbike, only to realize
    it''s Stephen. From this point on, I know will soon be engrossed in interesting
    conversations about continuous delivery and the Java ecosystem.


    I''ve also followed Melissa''s teachings on building and securing containers as
    part of my work at JFrog and seeing her receive her Java Champion recognition
    live (and unexpectedly!) at Ifokus 2021 was a great moment. Ixchel has long been
    a guiding influence in the Java and JVM spaces. Since I first attended JavaOne,
    back in 2013—where I saw it with Andres Almay on the future of the polyglot JVM—I
    have learned many things from that that have made me a better developer.


    I''ve also had the privilege of sitting on several panels alongside Ana-Maria
    Mihalcean (who wrote Chapter 8 over the years, most recently covering topics as
    containers, Kubernetes, and Quarkus). I always enjoy hearing her take on the operational
    impact of new technologies on the Java platform, and I typically leave our conversation
    with a bunch of new tools to research.'
  merge: -1
