  md: '# It’s All About Metadata


    As W. Edwards Deming said, "In God we trust; all others bring data." Metadata
    is defined as a structured key/value storage of relevant information. In other
    words, it’s a collection of properties or attributes applicable to a particular
    entity, which in our case applies to artifacts and processes.


    Metadata enables the discovery of correlations and causations as well as insights
    into the organization''s behavior and outcomes. As a result, metadata can show
    whether the organization is tuned in to its stakeholders'' goals.


    Additional data can be used in later stages to extract or derive more information.
    This data helps expand perspectives and create more stories, or narratives. It
    is important to choose which attributes, cardinality, and values to add—too many,
    and we harm performance; too few, and we miss information. With too many values,
    insights can be lost.


    A good starting point is to answer the following questions concerning the main
    stages of each phase of the software development cycle: Who? What? How? Where?
    and When? Asking the right questions is only half of the effort, though. Having
    clear, relevant, specific, and clear answers that can be normalized or enumerated
    is always a good practice.


    # Key Attributes of Insightful Metadata


    Insightful data should be all of the following:


    Contextualized


    +   All data needs to be interpreted within a frame of reference. To extract and
    compare possible scenarios, it is important to have the right stage for analysis.


    Relevant


    +   The variability in the values has an impact on the outcome or describes a
    specific stage or time in the outcome or process.


    Specific


    +   The values describe a clear event (i.e., initial value, end value).


    Clear


    +   The possible values are well-known or defined, computable, and comparable.


    Unique


    +   Has a single, distinctive value.'
