    not only don''t care if you see the inside of your bricks-and-mortar going ever
    again, but also do not even know that branch is! What''s more, banks are reacting
    to these rapidly changing banking habits by consolidating closing physical branches,
    and offering incentives for their customers to shift their banking to the online
    sphere. This accelerated even more during the COVID-19 crisis, when access to
    branches was restricted to appointment-only services, walk-in access, and shorter
    hours.


    So, 10 years ago, if your bank''s website went down for 12 hours of maintenance
    while the bank was deploying a beta, you probably have taken that in stride. A
    dozen hours if it''s going to result in higher-quality services? You didn''t need
    24/7, online banking—and, besides, the local branch was there for you. Today''s
    simply not the case. Half a day''s worth of downtime is unacceptable. In essence,
