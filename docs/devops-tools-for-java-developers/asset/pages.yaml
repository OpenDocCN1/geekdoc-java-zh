    features, though are available only in an implicitly formulated form in most cases.
    The consequence of this, in combination with faulty security requirements engineering
    results, is miscalculated development cycles with increased time pressure; the
    sprint is canceled because of incorrect budget calculations, increased technical
    debts, persistent weak points, or specific security gaps within the codebase.


    Let’s now focus on how the necessary conditions can be created in an Agile team
    that improves the codebases’ security level as early as possible. Regardless of
    the specific project method used, the following approaches are not restricted
    in their validity.


    It is essential to secure the security level so that the respective development
    team should achieve a security increment when performing a product increment.
    A team with an implicit and pronounced security focus can immediately gain a different
    level of security than a team without this focus. Regardless of the experience
    of each team, a general minimum must be defined and adhered to.


    The OWASP Top 10 is a list of security vulnerabilities that developers can avoid
    with simple measures. Accordingly, they serve as an introduction to the topic
    and should be part of every developer’s security repertoire. However, code reviews
    reveal that teams are not adequately considering the top 10, so this is a good
    area to focus on improvement.


    It should also be recognized that developers can do an excellent job in their
    field but are not security experts. In addition to different levels of experience,
    developers and security experts have different approaches and ways of thinking
    that are decisive for their respective tasks. Therefore, the development team
    must be aware of their limitations regarding the assessment of attack methods
    and security aspects. When developing critical components or in the event of problems,
    the organizational option of calling a security expert must be determined in advance.
    Nevertheless, developers should generally be able to evaluate typical security
    factors and take simple steps to improve the security of the code.


    Ideally, each team has a member who has both development and detailed security
    knowledge. In the context of supported projects, the relevant employees are referred
    to as security managers (SecMs). They monitor the security aspects of the developed'
