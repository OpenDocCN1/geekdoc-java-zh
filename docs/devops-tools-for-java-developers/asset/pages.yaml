  md: '# CHAPTER 4


    # Dissecting the Monolith


    Ixchel Ruiz


    The ultimate goal should be to improve the quality of human life through digital
    innovation.

    —Pony Ma Huateng


    Throughout history, humans have been obsessed with deconstructing ideas and concepts
    into simple or composite parts. It is by combining analysis and synthesis that
    we can achieve a higher level of understanding.


    Aristotle called analytics "the resolution of compound into those things out of
    which the synthesis is the converse of synthesis. Synthesis is the road from the
    principles to those things that derive from the principles


    Software development follows a similar approach: analyze a system into its composite
    parts, identifying inputs, desired outputs, and detail functions. During the analytic
    process of software development, we have realized that non-business-specific functionality
    is always required to process inputs and communicate or persist outputs. This
    makes it obvious that we could benefit from reliable, well-defined, context-bound,
    atomic functionality that can be shared, consumed, or interconnected to simplify
    building software.


    Allowing developers to focus primarily on implementing business logic to fulfill
    purposes—like meeting well-defined needs of a client/business, meeting a perceived
    need of some of potential users, or using the functionality for personal needs
    (to automate tasks)—has been a long-held desire. Too much is wasted every day
    reinventing one of the most reinvented wheels: reliable boilerplate code.


    The microservices pattern has gained notoriety and momentum in recent years because
