    # Publish to JFrog Artifactory


    JFrog Artifactory is another popular option for artifact management. It offers
    similar capabilities as Sonatype Nexus while while the same time adding other
    features, including integration with other products that belong to the JFrog Platform,
    such as Xray and Pipelines. One particular feature I quite fond of is artifacts
    do not need to be signed at the source before publication. Artifactory can perform
    the signing with your PGP keys or with a site-wide PGP key. This relieves you
    of the burden of setting up keys on your local and CI environments while during
    publication. As before, the previous publication configuration we saw for Maven
    Central will work for Artifactory as well, by changing only the publication URLs
    to could potentially match the Artifactory instance.


