  md: "```\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  labels:\n    app:\
    \ demo\n    name: demo\nspec:\n  type: Recreate\n  revisionHistoryLimit: 15\n\
    \  replicas: 4\n  selector:\n    matchLabels:\n      app: demo\n  template:\n\
    \    metadata:\n      labels:\n        app: demo\n    spec:\n      containers:\n\
    \      - image: quay.io/repo/demo:1.0.0-SNAPSHOT\n        imagePullPolicy: IfNotPresent\n\
    \        name: quarkus\n        ports:\n        - containerPort: 8080\n      \
    \    name: http\n          protocol: TCP\n```\n\n1 The deployment strategy is\
    \ Recreate.\n\n2 You can set revisionHistoryLimit to specify the number of old\
    \ ReplicaSets for this deployment that you want to retain. By default, Kubernetes\
    \ stores the last 10 ReplicaSets.\n\nWhenever the preceding specification is applied\
    \ in a cluster, Kubernetes will take down the current running pod instances, and\
    \ once they are terminated, will bring new ones. We do not need to set up a minimum\
    \ and maximum number of instances, only the number of desired instances (4).\n\
    \nIn this example, Kubernetes does not delete the ReplicaSet immediately after\
    \ performing an update. It keeps the ReplicaSet around a replicas count of 0.\
    \ If the deployment introduced a change that breaks the stability of the system,\
    \ you can roll back to a previous version by choosing from the old ReplicaSets.\n\
    \nYou can find the previous revisions by running the following command:\n\n```\n\
    kubectl rollout undo deployment/demo --to-revision=[revision-number]\n```\n\n\
    Roll back to a previous version by using the following:"
