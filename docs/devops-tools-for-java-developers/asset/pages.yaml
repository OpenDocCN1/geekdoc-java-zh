    Nowadays, service providers use service-level indicators (SLIs) to measure the
    goal set by a service-level objective (SLO). SLOs are the individual commitments
    made by the service provider to a customer. You can incorporate the percentages
    from Table 8-7 by setting a value for availability as part of the SLO. Tools like
    Prometheus and Grafana help you calculate the performance of your applications
    by rating the SLO, querying metrics, and alerting when goals are endangered.


    To create highly unavailable systems, reliability engineering offers three principles
    of systems design:


    +   * Eliminate single points of failure at the application, network, and infrastructure
    level. Because even the way you internally code your application can sometimes
    generate failures, you should properly test every software component. Observability
    and great deployment strategies help you eliminate the possible failures in your
    system.

    * Detect failures as they occur. Monitoring and alerting help discover when a
    system reaches critical conditions.

    * Have a reliable transition to a running component when a failure occurs to another
    one. An efficient rollback process in case of deployment issues, the Kubernetes
    self-healing mechanism, and smooth traffic routing between Kubernetes resources
    help in this matter.


    A good plan for failure involves following the preceding principles and implementing
    them using several best practices:


    +   * Perform data backups, recovery, and replications.

    * Set up load balancing to distribute the traffic efficiently when increased workloads
    are revealed by the critical features of your applications. Load balancing helps
    eliminate single points of failure at the application level while using the network
    and infrastructure available.'
