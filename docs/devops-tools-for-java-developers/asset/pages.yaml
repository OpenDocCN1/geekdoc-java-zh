    The next order of business is declaring dependencies for a particular scope (in
    Maven''s terms), Gradle calls this configuration, and the behavior goes beyond
    what scopes are capable of. Assuming the java-library plug-in is applied to a
    Gradle build file, we gain access to the following configurations by default:


    # api


    Defines dependencies required for compiling production code and affects the compile
    classpath. It is equivalent to the compile scope and thus is mapped as such when
    a POM is generated.


    # implementation


    Defines dependencies required for compilation when deemed as implementation details;
    they are more flexible than dependencies found in the api configuration. This
    configuration affects the compile classpath but will be mapped to the run scope
    when a POM is generated.


    # compileOnly


    Defines dependencies required for compilation but not for execution. This configuration
    affects the compile classpath, but these dependencies are not shared with other
    classpaths. Also, they are not mapped to the generated POM.


    # runtimeOnly


    Defines dependencies in this configuration are needed for execution only and affect
    only the runtime classpath. They are mapped to the runtime scope when a POM is
    generated.


    # testImplementation


    Defines dependencies required for compiling test code and affects the testCompile
    classpath. They are mapped to the test scope when a POM is generated.


    # testCompileOnly


    Defines dependencies required for compiling test code but not for execution. This
    configuration affects the testCompile classpath, but these dependencies are not
    shared with the testRuntime classpath. Also, they are not mapped to the generated
    POM.


    # testRuntimeOnly


    Dependencies with this configuration are needed for executing test code and affect
    only the testRuntime classpath. They are mapped to the test scope when a POM is
    generated.'
