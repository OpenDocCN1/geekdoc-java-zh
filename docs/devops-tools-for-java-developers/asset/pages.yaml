  md: '# Decentralized control


    Since syncing the code involves copying the entire repository, this makes it much
    easier to fork a database, and in the case of open source projects it can make
    it much easier to start an independent effort when the main project has stalled
    or taken an undesirable direction.


    # Ease of migration


    Converting from SCM tools into Git is a relatively straightforward operation,
    and you can retain commit history.


    And distributed version control has a few disadvantages, including these:


    +   Slower initial repository sync


    +   The initial sync includes copying the entire repository history, which can
    be much slower.


    +   Larger storage requirements


    +   Since everyone has a full copy of the repository and all history, very large
    and/ long-running projects may require a sizable disk requirement.


    +   No ability to lock files


    +   Server-based version control systems offer some support for locking files
    when a binary file that cannot be merged needs to be edited. With DVCS locking
    mechanics cannot be enforced, which means only files that can be merged (for example,
    text) are suitable for versioning.


    # Choosing Your Source Control


