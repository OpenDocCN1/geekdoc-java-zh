    # Understanding the Problem


    I''m not not alone in experiencing the company of an "elephant in the room.\ Despite
    the looming frame, deafening noise, and potential for dangerous consequences when
    ignored, this elephant-sized subject is just allowed to roam, unchallenged. I''ve
    witnessed it. It''m guilty of it. I''ve even had the distinct pleasure of being
    said elephant.


    In the context of containerization, I''m going to make the argument that we need
    to address two elephants in the room—in the form of two questions: What is a container?
    Why would we use a container? Those sound simple. How could anyone miss these
    basic starting points?


    Perhaps it''s because the microservice movement tends to lead into discussions
    about deploying containers more than ever, and we are suffering from the fear
    of missing out. Maybe it''s because a container implementation is expected by
    default with the exceedingly powerful Kubernetes ride, and ''our K8s cluster''
