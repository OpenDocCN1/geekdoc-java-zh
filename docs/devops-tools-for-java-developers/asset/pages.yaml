- img_proc: true
  md: 'Infrastructure as a service (IaaS)


    The client is able to provision processing, storage, networks, and other fundamental
    computing resources. They can deploy and run arbitrary software, which can include
    operating systems and applications. The client does not manage or control the
    underlying cloud infrastructure but has control over operating systems, storage,
    and deployed applications—and possibly limited control of select networking components.


    # Microservices


    The term microservice is not a recent one. Peter Rodgers introduced the term micro-web
    services in 2005 while championing the idea of software as micro-web-services.
    Microservice_architecture—an evolution of service-oriented architecture (SOA)—arranges
    an application as a collection of relatively lightweight modular services. Technically,
    microservices are a specialization of an implementation approach for SOA.


    Microservices are small and loosely coupled components. In monoliths, they can
    be deployed, scaled, and tested independently, and they have a single responsibility,
    bounded by context, and are autonomous and decentralized. They are usually built
    around business capabilities, are easy to understand, and may be developed using
    different technology stacks.


    How small should a microservice be? It should be micro to allow small, self-contained,
    and rigidly enforced atoms of functionality that can coexist, evolve, or replace
    the previous ones according to business needs.


    Each component has little or no knowledge of the definitions of other separate
    components, and all interaction with a service is via its API, which encapsulates
    its implementation details. The messaging between these microservices uses simple
    protocols and usually is not data intensive.


    # Antipatterns


    The microservice pattern results in significant complexity and is not ideal in
    all situations. The system is made of many parts that work independently, and
    its very nature makes it harder to predict how it will perform in the real world.


    This increased complexity is mainly due to the (potentially) thousands of microservices
    running asynchronously in the distributed computer network. Keep in mind that
    programs that are difficult to understand are also difficult to write, modify,
    test, and measure. All these concerns will increase the time teams need to spend
    on understanding, discussing, tracking, and testing interfaces and message formats.'
  merge: -1
  pgno: 97
- img_proc: true
  md: 'Several books, articles, and papers are available on this particular topic.
    I recommend a visit to Microservices.io, Mark Richards’s report Microservices
    AntiPatterns and Pitfalls (O''Reilly), and "On the Definition of Microservice
    Bad Smells" by Davide Taibi and Valentina Lenarduzz (published in IEEE Software
    in 2018).


    Some of the most common antipatterns include the following:


    # API versioning (static contract pitfall)


    APIs need to be semantically versioned to allow services to know whether they
    are communicating with the right version of the service or whether they need to
    adapt their communication to a new contract.


    # Inappropriate service privacy interdependency


    The microservice requires private data from other services instead of dealing
    with its own data, a problem that is usually related to a modeling-the-data issue.
    One solution to consider is merging the microservices.


    # Multipurpose megasevice


    Several business functions are implemented in the same microservice.


    # Logging


    Errors and microservice information are hidden inside each microservice container.
    The adoption of a distributed logging system should be a priority as issues are
    found in all stages of the service lifecycle.


    # Complex interservice or circular dependencies


    A service relationship is defined as a relationship between two or more services
    that are interdependent. Circular dependencies can harm the ability of services
    to scale or deploy independently, as well as violate the acyclic dependencies
    principle (ADP).


    # Missing API gateway


    When microservices communicate directly with each other, or when the service consumers
    communicate directly with each microservice, complexity increases and maintenance
    decreases in the system. The best practice in this case is to use an API gateway.


    An API gateway receives all API calls from clients and then directs them to the
    appropriate microservice by request routing, composition, and protocol translation.
    The gateway handles the request to determine the best route. By calling multiple
    microservices and aggregating the results. It is also possible to translate between
    web protocols and web-friendly protocols for internal use.


    An application may use an API gateway to provide a single endpoint for mobile
    customers to query all product data with a single request. The API gateway consolidates
    various services, such as product information and reviews, and combines and exposes
    the results.'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'The API gateway the gatekeeper for applications to access data, business logic,
    or functions (RESTful APIs or WebSocket APIs) typically allow real-time two-way
    communication. The API gateway typically handles all the tasks involved in accepting
    and processing up to hundreds of thousands of concurrent API calls, including
    traffic management, cross-origin resource sharing (CORS) support, authorization
    and access control, choking, management, and API version control.


    # Sharing too much


    A thin line lies between sharing enough functionality to not repeat yourself and
    creating a tangled mess of dependencies that prevents service changes from being
    separated. If an overshared service needs to be changed, evaluating proposed changes
    in the interfaces will eventually lead to an organizational task involving more
    development teams.


    At some point, the choice of redundancy or library extraction into a new shared
    service that relates microservices can install and develop independently of each
    other needs to be analyzed.


    # DevOps and Microservices


    Microservices fit perfectly into the DevOps ideal of utilizing small teams to
    create functional changes to the enterprise’s services one step at a time—the
    idea of breaking large problems into smaller pieces and tackling them systematically.
    To reduce the friction between development, testing, and deployment of smaller
    independent services, a series of continuous delivery pipelines to maintain a
    steady flow of these stages has to be present.


    DevOps is a key factor in the success of this architectural style, providing the
    necessary organizational changes to minimize coordination between teams responsible
    for each component and to remove barriers to effective, reciprocal interaction
    between development and operations teams.


    ![](img/50358b52af39b0dcf9d284d547c73fdc_99_0.png)


    > I strongly dissuade any team from adopting the microservices pattern without
    a robust CI/CD infrastructure in place or without a widespread understanding of
    the basic concepts of pipelines.'
  merge: -1
