  md: '# OneFlow


    OneFlow, another collaboration workflow based on git-flow, was proposed by Adam
    Ruka and introduced in a detailed blog. OneFlow makes the same adaptation GitHub/GitLab
    Flow in separating the develop branch in favor of feature branches and direct
    integration on the main branch. However, it keeps the release and hotfix branches
    that are used in git-flow.


    Key attributes include the following:


    +   - Development branches

    Branch per feature


    +   - Merge strategy

    No fast-forward merges without rebase


    +   - Rebasing history

    Rebasing recommended


    +   - Release strategy

    Separate release branches


    The other big deviation in OneFlow is that it heavily favors modifying history
    to keep the Git revision history readable. It offers three merge strategies that
    have varying levels of revision cleanliness and rollback friendliness:


    Rebase


    This makes the merge history mostly linear and easy to follow. With the usual
    caveat that changesets pushed to the central server should not be rebased and
    makes it more difficult to roll back changes since they are not captured in a
    single commit.


    merge -no-ff


    This is the same strategy used in git-flow and has the disadvantage that the merge
    history is largely nonsequential and difficult to follow.


    rebase + merge -no-ff


    This is a rebase workaround that tacks on an extra merge integration at the end
    so it can be rolled back as a unit even though it is still sequential.


    ![](img/50358b52af39b0dcf9d284d547c73fdc_60_0.png)


    OneFlow is a thoughtful approach to Git collaboration workflow that is created
    from the experience of developers on large enterprise projects. It can be seen
    as a modern variant on git-flow that should serve the needs of projects of any
    size.'
  merge: -1
