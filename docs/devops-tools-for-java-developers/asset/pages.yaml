    The necessity to fast and remain competitive should inspire innovation and creativity
    in the ways required to execute controlled rollovers, test procedures, and more
    in-production testing—what''s now referred to as progressive delivery. This comes
    along with feature flags and observability tools, such as distributed tracing.


    Some equate delivery with the blast radius of an explosive device. The idea is
    that when we deploy to an in-production environment, explosions should be expected.
    Therefore, to optimize rollovers, the best we can hope for is to minimize casualties,
    keep the size of the blast radius as small as possible. This is consistently accomplished
    through improvements in the quality of servers, services, and products. And if
    we agree that quality is a concern of developers and its achievement is part of
    a developer''s definition of “done,” then there can be no pause or disconnect
