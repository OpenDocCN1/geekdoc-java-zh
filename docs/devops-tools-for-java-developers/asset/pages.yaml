  md: 'updated to add new features or patch security vulnerabilities. If you are a
    continuous update fan (which you should be by now), you know which one wins.


    However, Apple changed all of this with the App Store on the iPhone in 2008, which
    was a game changer for deploying client applications to phones and other devices.
    Here is what App Store offered:


    # Update in one click


    Updating a desktop application requires quitting the running version, following
    some sort of guided wizard to go through a seemingly dizzying array of choices
    for the common case (e.g., desktop shortcut, menu, optional packages), and often
    rebooting your computer after installation. Apple simplified this to a single-button
    update, and in the case of many updates, a bulk option to update all them at once.
    The update downloads, your mobile app quits, and the app is installed, all in
    the background with no user interruption.


    # There is only one version: latest


    Do you know which version of Microsoft Office you are running? Up until 2011,
    when Office 365 was released, you had to, had not upgraded in the past three to
    five years (or more). Apple changed all of this by providing only the latest version
    in the app store so the choice of which version to upgrade is entirely removed.
    Also, you are not provided a version number to reference, so all you know is you
    are on the latest with a few notes from the developer on what you are getting.
    Finally, there is no cost to upgrade your own app, so the financialincentive to
    upgrade that was the norm with paid desktop apps was entirely removed.


    # Security built in


    While security vulnerabilities are the number one reason to install a patch, security
    concerns are also the number reason not to upgrade. Being the first to upgrade
    puts you at risk if a vulnerability in the new software is discovered, which is
    why corporate IT policies forbid end from upgrading their apps for a certain period
    of time. However, Apple fixed this by integrating a sandboxed model in which the
    installed applications are limited in their ability to access data, contacts,
    photos, location, camera, and many other features without explicitly being given
    permission. This, combined with the rigorous review process Apple instituted on
    store submissions for developers, reduced malware and app viruses to the point
    where, generally speaking, security is almost not a concern for consumers when
    upgrading their apps.


    The availability of simple upgrades are low risk which makes the decision to update
    simple. Add to this the fact that releases are verified by a trusted authority,
    and users almost always make the decision to upgrade, as shown in Figure 10-5.'
