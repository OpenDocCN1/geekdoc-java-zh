  md: '# # Cloud Computing


    Cloud computing has several definitions. Peter Mell and Tim Grace define it as
    a model for enabling ubiquitous, convenient, on-demand network access to a shared
    pool of configurable computing resources (such as networks, servers, storage,
    applications, and services) that can be rapidly provisioned and released with
    minimal management effort or provider interaction.


    In recent years, cloud computing has increased considerably. For example, cloud
    infrastructure services spending increasing 32% to $39.9 billion in the last quarter
    of 2020. Total expenditure was more than $3 billion higher than the previous quarter
    and nearly $10 billion more than Q4 2019, according to Canvasys data.


    Several providers exist, but the market is not widely distributed. The three leading
    service providers are Amazon Web Services (AWS), Microsoft Azure, and Google Cloud.
    AWS is the leading cloud service provider, accounting 31% of total spending in
    Q4 2020. Azure''s growth rate accelerated, up by 50%, with a share close to 20%,
    whereas Google Cloud accounts for a 7% of the total market.


    Utilization of cloud computing services has been lagging. Ciner Kilcioglu and
    Aadharsh Kannan reported in 2017 in "Proceedings of the 26th International World
    Web Conference" that usage of cloud resources in data centers shows a substantial
    gap between the resources that cloud customers allocate and pay for (leasing VMs),
    and actual resource usage (CPU, memory, and so on). Perhaps customers are just
    leaving their VMs on but not actually using them.


    Cloud services are divided into categories for different types of computing:


    Software as a service (SaaS)


    The client can use the provider''s applications running on a cloud infrastructure.
    The applications are accessible from various client devices through either a thin
    client interface, such as a web browser, or a program interface. The client does
    not manage or control the underlying cloud infrastructure, including network,
    servers, operating systems, or even individual application capabilities, with
    the possible exception of limited user-specific application configuration settings.


    Platform as a service (PaaS)


    The client can deploy onto the cloud infrastructure client-made or acquired applications
    created using programming languages, libraries, services, and tools supported
    by the provider. The consumer does not manage or control the underlying cloud
    infrastructure, including network, servers, operating systems, or storage, but
    does have control over the deployed applications and possibly configuration settings
    for the application-hosting environment.'
  merge: -1
