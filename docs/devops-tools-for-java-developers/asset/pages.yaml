    # Building a Device Farm


    Building your device farm, even at a small scale, is a great way to leverage Android
    devices that you already have and increase their utility for your entire organization.
    At scale, device farms can significantly reduce the run cost of Android development
    once making the up-front investment in hardware. Keep in mind, managing a large
    device lab is a full-time job and has ongoing costs that need to be accounted
    for.


    A popular open source library for managing Android devices is Device Farmer (formerly
    Open ATF). Device Farmer allows you to remotely control an Android device from
    web browser with a real-time view of the device screen, as shown in Figure 9-7.
    For manual tests, you can type from your desktop keyboard and use your mouse to
    input single or multitouch gestures. For automated tests, a REST API allows you
    to use automation frameworks like Appium.


    ![](img/50358b52af39b0dcf9d284d547c73fdc_283_0.png)


    Figure 9-7. Device Farmer user interface (photo used under Creative Commons)


    Device Farmer also helps you manage your inventory of devices. It shows you which
    devices are connected, who is using each device, and the hardware spec for your
    devices, and it assists with physically locating devices in a large lab.'
  merge: -1
  pgno: 283
- img_proc: true
  md: 'Finally, Device Farmer also has a system for booking and partitioning groups
    of devices. You can split your device inventory into distinct groups that have
    owners and associated properties. These groups can then be permanently allocated
    to projects or organizations or they can be booked for a specific time period.


    To set up a device lab, you also need hardware to support the devices. The basic
    hardware setup includes the following:


    # Driver computer


    Even though Device Farmer can run on any operating system, it is recommended to
    run it on a Linux-based host for ease of administration and the best stability.
    A good option for getting started with this is a compact, powerful, computer like
    the Intel NUC.


    # USB hub


    Both for device connectivity and to supply stable power, a powered USB hub is
    recommended. Getting a reliable USB hub is important since this will affect the
    stability of your lab.


    # Wireless router


    The devices will get their network connectivity from a wireless router, so this
    this is an important part of the device setup. Having a dedicated network for
    your devices will increase reliability and reduce contention with other devices
    on your network.


    # Android devices


    And the most important part, of course, is having plenty of Android devices to
    test against. Start with devices that are the most common and popular with your
    target user base and add devices to hit the desired test matrix of Android OS
    versions, screen sizes, and hardware support as discussed in the previous section.


    # Plenty of cables


    You will need longer cables than usual for efficient cable management of devices
    to the USB hub. It is important to leave enough space between individual devices
    and hardware components to avoid overheating.


    With a little bit of work, you will be able to create a fully automated device
    lab similar to Figure 9-8, which was the world’s first conference device lab featured
    at the beyond tellerrand conference in Düsseldorf, Germany.'
