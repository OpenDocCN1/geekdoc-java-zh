  md: 'The docker inspect command spits out a ton of interesting information. But
    what I want to highlight here is the GraphDriver section, which contains the paths
    to the directories where all the layers belong to this image live.


    Docker images are composed of layers that correspond to instructions in the Dockerfile
    that was used to build the image originally. These layers translate into directories
    and can be shared across images in order to save space.


    Note the LowerDir, MergedDir, and UpperDir sections. The LowerDir contains all
    the directories, or layers, that were used to build the original image. These
    are read-only. The UpperDir directory contains all the content that has modified
    while the container is running. If modifications are needed for a read-only layer
    in LowerDir, then that is copied into the UpperDir where it can be written to.
    This is called a copy-on-write operation.


    It''s important to remember that the data in UpperDir is ephemeral that lasts
    as long as the container lives. If you have data you want to keep, you should
    utilize the volume features of Docker and a mount point that will stick around
    after the container dies. For example, a database-application running in a container
    will likely utilize a volume mounted to the container for the database data.


    Lastly, the MergedDir section is kind of a virtual directory that combines everything
    from LowerDir and Upper Dir. The Union File System works is that any edited layers
    that were copied into UpperDir overlay layers in LowerDir.


    ![](img/50358b52af39b0dcf9d284d547c73fdc_83_0.png)


    Notice all the references to directories within /var/lib/docker, the Docker root
    directory. If you monitor the size of this directory, you will notice that the
    more images and containers you create and run, the storage space required for
    this directory will increase substantially over time. Consider mounting a dedicated
    directory, and make sure that you are cleaning unused images and containers regularly.
    Also, make sure that containerized apps are not continuously producing unmanaged
    files or other artifacts. For example, utilize logging or log rotation to manage
    logs generated by your container and its running processes.


    Any number of containers can be launched using the same image. Each container
    will be created with the image blueprint and run independently. In the context
    of Java, think of a container image as a Java class, and a container as a Java
    object instantiated from that class.


    Containers can be stopped and later restarted without being re-created. To list
    containers on your system, use the docker ps -a command. Note that the -a flag
    display stopped containers as well as containers currently running:'
