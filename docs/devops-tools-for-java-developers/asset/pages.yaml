    # Getting Users to Update


    We have now hopefully convinced you that continuous updates are a good thing,
    from a feature/competitive standpoint as well as for security vulnerability mitigation.
    However, even if you deliver frequent updates, will end users accept and install
    them?


    Figure 10-1 models the user flow for deciding whether to accept or reject an update.


    ![](img/50358b52af39b0dcf9d284d547c73fdc_304_0.png)


    Figure 10-1. User model for update acceptance


    The first question for a user is whether they really want the update based on
    features and/or security fixes. Sometimes the model for update acceptance is not
    a binary decision, because there is a choice to stay on a maintenance line with
    patches for security, but delay major upgrades provide larger features but are
    riskier. This is the model that Canonical uses for Ubuntu release: long-term support
    (LTS) releases come out every two years, with public support for years. If you
    prefer riskier, but more frequent, interim releases occur every six months with
    shorter support periods.


    The second question is, how risky is the update? Security patches or minor upgrades,
    the answer is that it is low risk and safe to put in production with minimal testing.
    Typically, these are small, specifically designed to not touch any external or
    even internal APIs, and tested to make sure they address the security issue and
    not produce undesirable side effects before release. Ability to perform local
    rollbacks (on more than later in the chapter) mitigates the risk.


    Upgrading may also be safe when the releasing the upgrade verifies that it is
    a safe upgrade, as shown in the third decision box of Figure 10-1. This is the
    model'
  merge: -1
  pgno: 304
- img_proc: true
  md: 'for operating system upgrades, such as iOS, where significant changes cannot
    be individually verified to be non-breaking. The OS vendor has to spend a significant
    amount of time testing hardware combinations, working with application vendors
    to fix compatibility issues or helping them upgrade their apps, and performing
    user trials to see what issues happen during an upgrade.


    Finally, if it is both risky and the party producing the release cannot verify
    the safety, it is up to the recipient of the upgrade to do verification testing.
    Unless it can be fully automated, it is always a difficult and costly process
    to undertake. If the upgrade cannot be proven to be safe the release may get delayed
    or simply skipped over in the hopes that a later release will be more stable.


    Let''s look at some real-world use cases and see their continuous update strategy.


    # Case Study: Java Six-Month Release Cadence


    Java has historically very long release cycles between major versions, averaging
    from one to three years. However, the release frequency has been erratic and often
    delayed, as for Java 7, which took almost five years to be released. The release
    cadence has continued to decline as the platform has grown, due to several factors
    such as security issues and the difficulty of running and automating acceptance
    tests.


    Starting with Java 9 in September 2017, Oracle made the dramatic move to a six-month
    feature release cycle. These releases can contain new features and remove deprecated
    features, but the general pace of innovation was intended to stay constant. This
    means that each subsequent release should contain fewer features and less risk,
    making it easier to adapt. The actual adoption numbers of each JDK release are
    shown in Figure 10-2..


    Given that 67% of Java developers never made it Java 8, which came out in 2014,
    the new release model clearly has a problem! However, hidden under the data are
    a few issues.


    First, the Java ecosystem cannot handle six-month releases. As we learned in Chapter
    6, virtually all Java projects are dependent on a large ecosystem of libraries
    and dependencies. In order to upgrade to a new Java, all of those dependencies
    need to be updated and tested against the new Java release. For large open source
    libraries and complex application servers, this is almost impossible to accomplish
    in a six-month time frame.'
  merge: -1
  pgno: 305
- img_proc: true
  md: '![](img/50358b52af39b0dcf9d284d547c73fdc_306_0.png)


    To compound this, the OpenJDK support model provides public support for Java releases
    for only six months, until the next feature release comes. Even if you could upgrade
    every six months, you would be left without critical support and security patches,
    as detailed in [Stephen Colbourne''s blog]().



    The only exception to this is LTS releases that start with Java 11 and come every
    three years thereafter. These releases will get security patches and support from
