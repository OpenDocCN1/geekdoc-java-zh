    Figure 10-3. Developer adoption of Java 8 two years after release²


    This brings us to the second reason for the poor adoption of Java 9 and beyond,
    which is a poor value/cost trade-off. The main feature of Java 9 was the introduction
    of a new module system. The idea of a modular Java Platform was first suggested
    by Mark Reinhold back in 2008 and took nine years to complete the release of Java
    9.


    Because of the complexity and disruptiveness of this change, it was delayed several
    times, missing both Java 7 and Java 8 as initial targets. Also Java 9 was highly
    controversial on release because it was initially incompatible with OSGi, a competing
    module system released by the Eclipse Foundation targeted at enterprise applications.


    But perhaps the bigger issue with modularity is that no one really asked for it.
    Modularity has many benefits, including better library encapsulation, easier dependency
    management, and smaller packaged applications. However, to fully realize these
    benefits, you need to spend a lot of work rewriting your application to be modularized.
    Second, you need all of your dependencies to be packaged as modules, which has
    taken a while for open source projects to embrace. Finally, the practical benefits
    for most enterprise applications are small, even when upgrading to a module-enabled
    release, it is common practice to disable modularity and go back to the classpath
    model of Java 8 and prior. Figure 10-4 shows the simplified developer thought
    process on upgrading to Java 9 and beyond.'
