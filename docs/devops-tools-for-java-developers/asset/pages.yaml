  md: '# Git Collaboration Patterns


    DVCSs have a proven track record of scaling large teams with hundreds of collaborators.
    At this scale, it is necessary to agree on uniform collaboration patterns that
    help the team avoid rework, avoid large and unwieldy merges, and reduce the amount
    of time blocked on administering the version control history.


    Most projects follow a central repository model: a single repository is designated
    as the official repository for integrations, builds, and releases. Even though
    a DVCS allows uncentralized peer-to-peer exchanges of revisions, these are best
    reserved for short-lived efforts among a small number of developers. For any large
    project, having a single system of truth is important and requires one repository
    that every-one agrees is the official mainline.


    For open projects, it is common for a limited set of developers to have write
    access to the central repository, while others *fork* the project and issue pull
    requests to have their changes included. Best practices are to have small pull
    requests, and to have someone other than the pull creator accept them. This scales
    well to projects of contributors, and allows for review and oversight by a core
    team when the codebase is not well understood.


    However, for most corporate projects, a shared repository with a single master
    branch is preferred. The same workflow with pull requests can be used to keep
    a central or release branch clean, but this simplifies the contribution process
    and encourages more frequent integration, which reduces the size and difficulty
    of merging changes. For teams on tight deadlines or following an Agile process
    with short iterations, this also reduces the risk of last-minute integration failures.


    The last best practice employed by most teams is to use branches to work on features,
    which then get integrated back into the mainline. Git makes it inexpensive to
    create short-lived branches, so it is common to create and merge in a branch for
    work that takes only a couple of hours. The risk with creating long-lived feature
    branches is that they diverge too much from the main trunk of code development,
    they can become difficult to integrate back in.


    Following these general best practices for distributed version control, several
    collaboration models have emerged. They share a lot of commonalities and primarily
    diverge in their approach to branching, history management, and integration speed.


    # git-flow


    Git-flow is one of the earliest Git workflows and was inspired by a blog post
    by Vincent Driessen. It lays the groundwork for later Git collaboration workflows
    like GitHub Flow; however, git-flow is a more complicated workflow than many projects
    require and can add branch management and integration work.'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'Key attributes include the following:


    Development branches


    +   - Branch per feature


    Merge strategy


    +   - No fast-forward merges


    Rebasing history


    +   - No rebasing


    Release strategy


    +   - Separate release branch


    In git-flow, there are two long-lived branches: one for development integration,
    called *develop*, and another for final releases, called *master*. Developers
    are expected to do all of their coding in feature branches that are named according
    to the feature they are working on and integrate with the develop branch once
    complete. When the develop branch has the features necessary for a release, a
    new release branch is created that is used to stabilize the codebase with patches
    and bugfixes.


    Once the release branch has stabilized and is ready for release, it is integrated
    into the master branch and give a release tag. On the master, only small changes
    managed on a dedicated branch. These hotfixes also need to be applied back to
    the develop branch and any other concurrent releases that need the same fix. Figure
    2-14 shows a sample diagram for git-flow.


    Because of the design decisions on git-flow, it tends to create a complicated
    merge history. By not taking advantage of fast-forward merges or rebasing, every
    integration becomes a commit, and numerous branches can be hard to follow even
    with visual tools. Also, the complicated rules and branch strategy require team
    training and are difficult to enforce with tools, often requiring check-ins and
    integration to be done from the command-line interface.


    ![](img/50358b52af39b0dcf9d284d547c73fdc_56_0.png)


    Git-flow is best applied to versioned projects that have multiple releases needing
    to be maintained in parallel. Usually, this is not the case for web applications,
    which have only one *latest* version and can be managed with a single release
    branch.'
