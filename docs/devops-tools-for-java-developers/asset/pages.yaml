    # # Dependency Management Basics for Maven and Gradle


    Dependency management has been a staple of Java projects since Maven 1.x came
    to light in 2002. The gist behind this feature is to declare artifacts that are
    required for compiling, testing, and consuming a product, relying on additional
    metadata attached to an artifact such as its group identifier, artifact identifier,
    version, and sometimes a classifier as well. This metadata is typically exposed
    using a well-known file format: the Apache POM expressed in a pom.xml file. Other
    tools are capable of understanding this format, and can produce and publish pom.xml
    files despite a totally unrelated format for declaring builds, as is the case
    for Gradle with build.gradle (Groovy) or build.gradle.kts (Kotlin) build.


    Despite being a core feature provided by Maven since the early days, and also
    a core feature in Gradle, dependency management and dependency resolution remain
    a stumbling block for many. Even though the rules to declare dependencies are
    not complicated, you may find yourself at the mercy of metadata invalid, misleading,
    or missing constraints. The following subsections are a primer for dependency
    management using both Maven and Gradle, but it is by no means exhaustive explanation—that
    would take a book on this topic.


    In other words, tread carefully, reader, there be dragons ahead. I''ll do my best
    to point out the safest paths. We''ll begin with Maven, as it is the build tool
    that defines the artifact metadata using the pom.xml file format.


    # # Dependency Management with Apache Maven


    You likely have encountered a POM file before—after all, it''s ubiquitous. A POM
    file with model version 4.0.0 is responsible for defining the artifacts are produced
    and consumed. In Maven version 4, these two capabilities are split, although the
    model version remains the same for compatibility reasons. It is expected that
    the model format will change when Maven version 5.0.0 is introduced. although
    there are no details on how this model will look at the time of writing. One thing
    is sure: the Maven developers are keen on keeping backward compatibility. Let''s
    walk through the basics.


    Dependencies are identified by three required elements: groupId, artifact, and
    version. These elements are collectively known as Maven coordinates, and GAV coordinates,
    with GAV, as you may have guessed, stands for groupId,,, version. From time to
    time, you may find dependencies that define a fourth element named classifier.'
