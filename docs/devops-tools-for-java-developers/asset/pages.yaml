    release was in 2004.


    Like Apache Ant, Maven uses an XML document (a POM file) to describe and manage
    Java projects. This document records information about the project, including
    a unique identifier for the project, the required compiler version, configuration
    property values, and metadata on all required dependencies and their versions.
    One of the most powerful features of Maven is its dependency management and the
    ability to use repositories to share dependencies with other projects.


    Maven relies heavily on configuration in order to provide a uniform method of
    managing and deploying a project that can easily scale across all projects using
    Maven. A project is expected to be laid out on the filesystem in any way. To keep
    the script declarative, customized implementations require building plugins. Although
    it can be extensively customized to override expected defaults, Maven works out
    of the box with little configuration if you conform to the expected project structure.


    Key Maven Terminology

    You will encounter the following terms when working with Maven:

    ### Lifecycle phase

    A discrete step in a project''s build lifecycle. Maven defines a list of default
    phases that are executed sequentially during a build. The default phases are validate,
    compile, test, package, verify, install, and deploy. Two other Maven lifecycles
    consist of phases that handle cleaning and documentation for the project. Invoking
    Maven with a lifecycle phase will execute all of the lifecycle phases in order,
    up to including the given lifecycle phase.

    ### Maven goal

    Hands the implementation details of the execution of a lifecycle phase. A goal
    can be configured to be associated with multiple lifecycle phases.

    ### Maven plug-in

    A collection of common Maven goals with a common purpose. Goals are provided by
    plug-ins to be executed in the lifecycle phase they are bound to.

    ### POM file

    The Project Object Model, or POM, is implemented as an XML file that includes
    the configuration for all of the Maven lifecycle phases, goals, and plug-ins required
    for the project''s build lifecycle. The name of this


