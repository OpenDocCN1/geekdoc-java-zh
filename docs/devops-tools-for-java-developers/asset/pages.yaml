- img_proc: true
  md: '# Advantages of the SAST approach


    In comparison with security tests done at later stages in the software delivery
    process, a static security analysis approach offers the following advantages:


    +   - Because vulnerability detection testing takes place in the development phase,
    removing the weak points can be carried out much cost-effectively compared to
    detection that take place only at runtime. By accessing the source code, you can
    also understand how this vulnerability came about and prevent it from recurring
    in the future. These findings cannot be obtained using an opaque-testing process.

    - Partial analysis can be done, which means that even non-executable source text
    can be analyzed. The static security analysis can be carried out by the developers
    themselves, which significantly reduces the need for security experts.


    A 100% of the system at the source code level is also possible, which cannot be
    guaranteed with a dynamic approach. Opaque-testing systems can perform only penetration
    tests, which are an indirect analysis.


    # Disadvantages of the SAST approach


    Since you are starting with the source code, SAST seems like it has the potential
    to be the most comprehensive security scanning approach. However, in practice
    it has fundamental problems:


    +   - The programming work often suffers, which in turn manifests itself in domainspecific
    bugs. The developers focus too much on the security tests and related bug fixes.

    - The tools are problematic. This happens especially if the scanners have not
    been adapted to your entire stack. Most systems are polyglot these days. To get
    a complete list of known vulnerabilities, you need a tool that supports direct
    or indirect technologies.

    - SAST often replaces the subsequent security tests completely. However, problems
    that are directly related to an application in operation remain undetected.

    - Focusing on your source code is not enough. The static scan must analyze the
    binaries and additionally the source code if possible.


    In “How Much Is Enough?” on page 186, we will show you why you should focus on
    scanning binaries first.


    # Dynamic Application Security Testing


    Dynamic application security testing (DAST) is security analysis of a running
    application (usually a running web application). A wide variety of attack scenarios
    are'
  merge: -1
  pgno: 192
- img_proc: true
  md: 'performed in order to identify as many of the weak points as possible in the
    application. The term dynamic indicates that a running application must be available
    to carry out the tests. It is critical that the test system behaves the same as
    the production environment. Even minor variations represent serious differences,
    including different configurations or upstream load balancers and firewalls.


    DAST is an opaque-testing process in which the application is viewed only from
    the outside. The technologies used do not play a role in the type of security
    check, as the application is accessed only generically and externally. This means
    that all information that could be obtained from the source code is invisible
    for this type of test. It is, therefore, possible for the person testing for the
    typical problems with a generic set of tools. The benchmark OWASP project offers
    reasonable assistance for selecting a scanner for your own project. This evaluates
    the performance of the individual tools in relation to the specific application
    background.


    # Advantages of DAST


    The DAST process has the following advantages:


    +   - Security analysis works in a technology-neutral manner.

    - The scanners find errors in the runtime environment in which the test is carried
    out.

    - The rate of false positives is low.

    - The tools find faulty configurations in basically functional applications. For
    example, you can identify performance problems that other scanners cannot.

    - The DAST programs can be used in all phases of development and in a later operation.


    DAST scanners are based on the same concepts that real attackers use for their
    malware. They, therefore, provide reliable feedback on weaknesses. Tests have
    consistently show that the majority of DAST tools can identify the top 10 most
    common threats listed by the OWASP Foundation.


    # Disadvantages of DAST


    Using DAST tools has several disadvantages:


    +   - The scanners are programmed to carry out specific attacks on functional
    web apps and can usually be adapted only by security experts with the necessary
    product knowledge. They, therefore, offer little space for individual scaling.

    - DAST tools are slow; they can take several days to complete their analysis.'
