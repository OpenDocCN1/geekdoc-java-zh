    of materials (SBOM), which happens to be yet another metadata format. Observability,
    monitoring, and other concerns regarding the health and stability of the build
    pipeline can be greatly enhanced by the existence of this metadata.


    Specific to dependencies, we saw the basics of popular Java build tools such as
    Apache Maven and Gradle. Of course, more depth than we discussed in this chapter
    is warranted; these topics could certainly fill a book on their'
