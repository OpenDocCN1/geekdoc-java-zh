  md: '# Linear acceleration


    Combination of data from the accelerometer and gyroscope (or magnetometer if no
    gyroscope is present)


    # Rotation vector


    Combination of data from the accelerometer, magnetometer, and gyroscope


    # Significant motion


    Data from the accelerometer (and possibly substitutes other sensor data when in
    low-power mode)


    # Step detector/counter


    Data from the accelerometer (and possibly substitutes other sensor data when in
    low-power mode)


    These virtual sensors are available only if a sufficient set of physical sensors
    is present. Most phones contain an accelerometer, but may choose to omit either
    a gyroscope or magnetometer or both, reducing the precision of motion detection
    and disabling certain virtual sensors.


    Hardware sensors can be emulated, but it is much harder to simulate real-world
    conditions for testing. Also, much variation occurs in hardware chipset and SoC
    vendor-driver implementation, producing a huge test matrix required to verify
    your application across a range of devices.


    The other aspect of hardware that is particularly important for game developers,
    but increasingly is part of the basic graphics stack and expected performance
    of applications, is 3D API support. Almost all mobile processors support some
    basic 3D APIs, including the first Android phone, which had support for OpenGL
    ES 1.1, a mobile-specific version of the OpenGL 3D standard. Modern phones support
    later versions of the OpenGL ES standard, including OpenGL ES 2.0, 3.0, 3.1, and
    now 3.2.


    OpenGL ES 2.0 introduced a drastic shift in the programming model, switching from
    a functional pipeline to a programmable pipeline, allowing for more direct control
    to create complex effects through the use of shaders. OpenGL ES 3.0 further increased
    the performance and hardware independence of 3D graphics by supporting features
    like vertex array objects, instance rendering, and device-independent compression
    formats (ETC2/EAC).


    OpenGL ES adoption has been rather quick, with all modern devices supporting at
    least OpenGL ES 2.0. According to Google’s device data shown in Figure 9-5, the
    majority of devices (67.54%) support OpenGL ES 3.2, the latest version of the
    standard released in August 2015.'
