    Now that you have seen how to deploy to Kubernetes, let''s see how we can refine
    this by choosing and implementing a deployment strategy.


    # Choose and Implement a Deployment Strategy


    Deploying a single application to Kubernetes can be an easy task using the right
    tools. As developers, we should also think ahead and decide how we might replace
    an old version of a microservice with a newer one without downtime.


    When you choose a deployment strategy to Kubernetes, you need to look into establishing
    these quotas:


    +   * Number of desired instances for your application

    * Minimum healthy running instances

    * Maximum instances


    The ideal situation is to have the number of desired running instances in the
    shortest time while using minimal resources (CPU, memory). But let''s try the
    already established methodologies and compare their performance.


    All-in-one deployment using the Recreate strategy is the simplest available using
    Kubernetes Deployment objects:'
