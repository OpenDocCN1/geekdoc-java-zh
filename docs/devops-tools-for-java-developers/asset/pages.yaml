  md: '![](img/50358b52af39b0dcf9d284d547c73fdc_286_0.png)


    Running a large-scale device lab has challenges:


    # Device maintenance


    Android devices are not meant to be run 24/7 for automated testing. As a result,
    you are likely to experience higher than normal device failure and have to replace
    batteries or entire devices every year or two. Spacing out devices and keeping
    them well cooled will help with this.


    # WiFi interference/connectivity


    WiFi networks, especially consumer-targeted WiFi routers, are not highly stable,
    especially with a large number of devices. Reducing the broadcast signal power
    of the WiFi routers and making sure they are on noncompeting network bands can
    reduce interference.


    # Cable routing


    Running cables among all the devices and the USB hubs or computers can create
    a tangled mess. Besides being to maintain, this can also create connectivity and
    charging issues. Make sure to remove all loops in the cables and use shielded
    cables and ferrite cores as necessary to reduce electromagnetic interference.


    # Device reliability


    Running a device lab on consumer devices comes with the general risk that consumer
    devices are not reliable. Limiting automated test runs to a finite'
  merge: -1
  pgno: 286
- img_proc: true
  md: 'duration will help prevent tests from becoming blocked on nonresponsive devices.
    Between tests, some housekeeping to remove data and free memory will help with
    performance and reliability. Finally, the Android devices as well as the servers
    running them will need to be rebooted periodically.


    Starting on a small scale with devices you already own is easy and can improve
    the ability to test across a range of devices and fire off automated tests in
    parallel. At a large scale, this is an effective solution to solving testing across
    fragmented Android ecosystems, but comes with high up-front costs and ongoing
    support and maintenance.


    ![](img/50358b52af39b0dcf9d284d547c73fdc_287_0.png)


    The next section talks about device labs that you can get started with today on
    a simple pay-as-you-go basis.


    # Mobile Pipelines in the Cloud


    If the prospect of building your own device lab seems daunting, an easy and inexpensive
    way to get started with testing across a large range of devices is to use a device
    farm running on cloud infrastructure. Mobile device clouds have the advantage
    of being easy to get started with maintenance free for the end user. You select
    the devices you want to run on, and free off manual or automated tests of your
    application against a pool of devices.


    Some mobile device clouds also support automated robot tests that will attempt
    to exercise all the visible UI elements of your application to identify performance
    or stability issues with your application. Once tests are run, you get a full
    report of any failures, device logs for debugging, and screenshots for tracing
    issues.


    Many mobile device clouds are available, with some dating back to the feature
    phone era. However, the most popular and modern device clouds have ended aligning
    with the top three cloud providers—Amazon, Google, and Microsoft. They all have
    sizable investments in mobile test infrastructure that you can try for a reasonable
    price and a large range of emulated and real devices to test.


    # AWS device farm


    Amazon offers a mobile cloud as part of its public cloud services. Using AWS Device
    Farm, you can run automated tests on a variety of real-world devices by using
    your AWS account.


    The steps to create a new AWS Device Farm test are as follows:


    +   1. **Upload your APK file**: To start, upload your compiled APK file or choose
    from recently updated files.'
