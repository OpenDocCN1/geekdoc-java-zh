    \ version 15 of the JavaFX controls that may be used with Windows, macOS, and\
    \ Linux platforms.\n\nAnother set of common classifiers are sources and generated\
    \ documentation (via the javafx tool). The combination of GAV coordinates may\
    \ be unique; otherwise, the dependency resolution mechanism will have a hard time\
    \ finding out dependencies to use.\n\nPOM files let you define dependencies inside\
    \ the <dependencies> section, where you would list GAV coordinates for each dependency.\
