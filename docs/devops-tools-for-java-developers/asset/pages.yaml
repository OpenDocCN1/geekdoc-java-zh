  md: '# One-Time and Recurrent Efforts


    Comparing the effort of scanning against known vulnerabilities and for compliance
    issues, we see a few differences. Let''s start with the compliance issues.


    # Compliance issues


    The first step in scoping compliance is defining which licenses are allowed at
    which part of the production line. This definition of allowed licenses includes
    the dependencies during development and the usage of tools and runtime environments.
    Defining the noncritical license types should be checked by a specialized compliance
    process. With this list of allowed license types, we can start the build automation
    to scan the full stack on a regular basis. After the machine has found a violation,
    we have to remove this element, and it must be replaced by another that is licensed.


    # Vulnerabilities


    The ongoing effort to scan for vulnerabilities is low compared to the amount of
    work to fix vulnerabilities. A slightly different workflow is needed for the handling
    of discovered vulnerabilities. With more significant preparations, the build automation
    can do the work on a regular basis as well. The identification of a vulnerability
    will trigger a workflow that includes human interaction. The vulnerability must
    be classified internationally, which leads to a decision about the next action
    to take.


    # How Much Is Enough?


    So let''s come back to the initial question in this section. How much scanning
    is enough? No change is too small, because all changes that have to do with adding
    or changing dependencies will cause you to reevaluate the security and run a new
    scan. Checking for known vulnerabilities or checking the license can be carried
    out efficiently by automation.


    Another point that should not be underestimated is the quality with which an examination
    is carried out is constant, as nobody is involved at this point. If the value
    chain''s speed is not slowed by constantly checking all dependencies, this is
    a worthwhile investment.


    # Compliance Versus Vulnerabilities


    One other difference exists between compliance issues and vulnerabilities. If
    a compliance issue exists, it is a singular point inside the overall environment.
    Just this single part is a defect and not influencing other elements of the environment,
    as shown in Figure 7-2.'
