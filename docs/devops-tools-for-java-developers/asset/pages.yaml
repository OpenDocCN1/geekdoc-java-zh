    must be addressed.


    I''m deeply grateful for the incredible colleagues and mentors I''ve had the privilege
    of working over the years. I frequently recall, the formative years of my career,
    sage advice that has been a mantra of mine. It''s simple; always begin and then
    proceed working on any project with a constant, repeating question in mind: What
    is the problem you are trying to solve? The success of your solution will be measured
    by how well it meets this requirement—that indeed solves the original problem.


    Carefully consider whether you are solving the right problem to begin with. Be
    especially vigilant in disguise to reject problem statements that are actually
    implementation instructions in disguise: Improve the performance of your application
