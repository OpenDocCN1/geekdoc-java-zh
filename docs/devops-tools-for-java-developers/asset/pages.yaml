    The IAST approach combines the SAST and DAST approaches and is already used within
    the SDLC—that is, in the development phase. This means that the IAST tools are
    already transferred "to the left" compared to the RASP tools. Another difference
    to the RASP tools is that IAST consists of static, dynamic, and manual tests.
