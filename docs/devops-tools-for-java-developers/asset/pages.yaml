  md: 'CI implementation helps mitigate the problems that can arise during this workflow
    and bolster your efficiency and productivity as a developer.


    It is not enough for a developer to successfully build a project in their own
    local environment. Even if every developer diligently abides the agreed-upon process
    and commits code changes only after tests pass, you shouldn''t rely on this alone.
    The simplest reason is that a developer might not have the latest changes from
    the mainline (even more likely scenario when many developers are working in the
    same codebase). This could result in an incompatibility that isn''t discovered
    until after the code is merged.


    Sometimes issues with tests surface only when someone attempts to do a build or
    run tests in their own local environment. For example, more than once I''ve embarrassingly
    forgotten to commit a new file or resource that I created to the codebase. This
    means that the next developer who collects these changes to suffer through the
    annoyance of having either build or tests fails immediately. Another issue I''ve
    seen is code written in such a way that it works in only a specific environment
    or a specific OS.


    We have all bad days, and these problems slip by us from time to time in the most
    ideal circumstances. But rather than let builds spread through the team like a
    virus, strategies can be put in place to help mitigate issues like the most common
    is using automatic builds, or CI servers. These servers are shared by development
    teams responsible for performing full builds, including running tests, and reporting
    the result of the build after code changes have been committed.


    Popular CI servers you might recognize Jenkins, CircleCI, TeamCity, Bamboo, and
    GitLab. More options are coming on the scene like JFrog Pipelines, and have more
    features and capabilities than others, but the primary objective is to establish
    a reference for the code changes coming in to the shared repository by building
    frequently and reporting when a problem occurs. Utilizing a CI server for the
    purpose of building running builds automatically is the best way to ensure that
    builds are happening regularly, revealing any integrations issues early.


