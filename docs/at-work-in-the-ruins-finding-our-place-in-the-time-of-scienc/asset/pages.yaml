    techno-fixes and lifestyle adjustments.


    The trouble is, compared to the promise of science, the exercise of human judgement
    looks terribly fragile and fallible. Indeed, from early in the development of
    modern science, before it even got that name, there have been those who hoped
    that scientific ways of seeing and knowing the world could free us from dependence
    on the exercise of judgement and the disputes to which it often leads. You can
    trace this hope within the history of environmentalism and the climate movements
    arising from it. Yet to expect scientific knowledge to take the place of the exercise
    of judgement is to ask too much of science, and those who have done so tend to
    end up disappointed, as we shall see.'
