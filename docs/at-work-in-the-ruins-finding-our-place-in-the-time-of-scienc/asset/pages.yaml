  md: 'we find it is to wake into grief. Yet we don''t get to know how the story ends.
    In as much as it makes sense to speak of there being a greater story of which
    we are a part, our part is a small one, and the story will outlast us.


    Will humanity succeed in making itself extinct? Well, that fate comes to all species
    sooner or later; it is only our mortality, writ large. I remain far from convinced
    of its imminence. Will we manage to render this Earth a lifeless ball or a prison
    planet in which all life takes place within a system of technological management?
    As close as we have come to the latter, my hunch is that, like many of the other
    grand projects of modernity, these too will fail short in the realisation.


    When I interviewed Vanessa Machado de Oliveira for Dark Mountain, to mark the
    tenth anniversary of the manifesto, she said something that helped make sense
    of the dark certainty I had been across:


    > Wherever I speak about hospicing, there''s always a very strong normative desire
    for humans to create the new reality. It''s archetype of agency is extremely ingrained:
    the idea that we can create something, and then the lack of faith in humanity
    to create it, which then plays into this sense of resignation. People say, ''Well,
    I don''t believe we can do it'', and that''s it.¹


    If anything, it''s worse than this. In the rooms where people come together to
    talk about the trouble the world is in, the agency is assumed to lie not with
    humanity in general but with people like us: the world''s most modern, most developed
    humans, the ones who live close to the future. It doesn''t occur to the people
    in those rooms that they might not be the protagonists, that the unknown world
    ahead be made by others, and not through human attempts to know and manage control
    the world but in the encounters that begin when we show up as one kind of creature
