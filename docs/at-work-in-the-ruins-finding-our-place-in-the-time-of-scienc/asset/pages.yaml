    In a remarkable essay, to which she gave the title ‘COVID Positive or: How I learned
    to stop worrying and embrace death’, Rebekah Berndt writes about her experiences,
    before the pandemic, working as a critical care nurse in hospitals:


    > When I worked in the ICU, tending to people on the brink of death, I had a lot
    of opportunity to observe people’s response to terrifying situations over which
    they had no control. The patients were generally unconscious, but the families
    tended to respond in one of two ways. The first was to become hypervigilant, googling
    arcane cures and obsessing over the trends of vital signs and lab data as if by
    staying constantly alert, one could change the outcome.3 The other was to go toward
    denial and avoidance.'
