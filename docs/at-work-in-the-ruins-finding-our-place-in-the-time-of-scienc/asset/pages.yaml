  md: 'It’s a question that opens out beyond the scope of a closing chapter – and
    having set down so many of the conversations I’ve had over the past fifteen years,
    there’s a part of me that wants to end this book by tailing off into silence.
    There are mornings when I listen to another BBC presenter interviewing a climate
    scientist or campaigner and I think of those peace activists in West Germany in
    the early 1980s who held that silence was the only fit response to a technology
    of genocide. To enter into a reasoned discussion over the use of nuclear warheads
    was discussed. To participate in an obscenity, to deny the nature of what is being
    discussed. Better to offer silence: a horrified silence, public and demonstrative,
    their unspeaking presence haunting the streets where they stood in witness as
    the missiles were installed at American bases on the outskirts of German towns.


    But having come this far together, I owe you more than a sealing of the lips.
    So what if we were to begin, instead, by talking about loss and longing? The most
    powerful aspect of the climate movements that emerged in 2018 was their ability
    to speak to loss: the loss of species, the loss of promised future, the loss of
    certainty and security as the realities of the climate crisis roar of loss comes
    home to many for the first time. Far beyond these movements, the background roar
    of loss runs through the lives of all of us: a layered loss that goes beyond the
    ordinary rhythms of coming and going, that marks us as living in a time of endings.
    Modernity thrives on loss and cannot name it, deferring the consequences as long
    as possible, outsourcing them into the lives of others, calling this progress.
    Children of a failing modernity, we were not brought up to talk about loss. The
    pedlars of statistical optimism encourage us to put the world through a cost–benefit
    analysis but the losses of history cannot be written off against its gains, they
    need to be mourned. When a culture does not mourn its losses, then a rot begins
    to spread under the skin.


    The first step is to name the loss and it seems to me that any movement with a
    spark of life in it today has tapped into the power of this naming.'
