    A few years before the pandemic, the French philosopher Bruno Latour published
    a fascinating book called Down to Earth: Politics in the New Climatic Regime.
    He offers a set of maps that reveal how much our situation is than the familiar
    axis of choice can show. The first of these maps suggests that both right and
    left have had their versions of ‘progress’, one focused on market freedom and
    the other on social rights; in both cases, the direction of progress has been
    away from the local and towards the global, and this been pursued in the name
    of ‘modernisation’. Yet this direction of history is no longer available, since
    climate change has called time on it. Latour offers a memorable image for the
    resulting predicament:


    > People find themselves in the situation of passengers on a plane that has taken
    off for the Global, to whom the pilot has announced that he had to turn around
    because one can no longer land at airport, and who then hear with terror (‘Ladies
    and gentlemen, this is the captain speaking again’) that the emergency landing
    strip, the Local, is also inaccessible.


    The visions of progress of left and right alike no longer work, but the possibility
    of a return to some earlier condition is equally illusory. In place of the attractors
    of ‘the Global’ and ‘the Local’, Latour proposes that the direction of travel
    that remains available is the one proposed in the book’s title. A similar thought
    is voiced by the Nigerian philosopher Bayo Akoakala: ‘We are coming down to earth;
    we will not arrive intact.’ This is the trajectory that remains open to the political
