  md: 'where a group of American teenagers and their Gen X parents are enjoying an
    extended summer vacation. The parents are so culpably helpless, absorbed in their
    own hedonism, that the children abandon them. The discovery of a children’s Bible
    by the narrator’s younger brother provides a mythic mirror with which to approach
