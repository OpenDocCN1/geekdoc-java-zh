    role of science can sound downright perverse, for this is the site on which the
    gap between the rhetoric of science as authoritative knowledge and the reality
    of its powerlessness is painfully revealed. In those meetings where artists, activists,
    religious leaders and Indigenous knowledge carriers were brought together with
    climate scientists, there was always that background hum of helplessness. We were
