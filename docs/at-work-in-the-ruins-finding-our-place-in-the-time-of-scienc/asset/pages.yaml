  md: 'In this strange new reality, there were glimpses of the kind of shift towards
    community and household-centred provisioning implicit in any transition to a world
    beyond growth. Some of this was little more than theacting of the privileged:
    long before Covid, the urban middle classes had acquired a taste for simulations
    of a simpler and more wholesome existence, as embodied in the handmade aesthetic
    of a Whole Foods store, its fixtures and fittings carefully disguising the concrete
    box into which it is built.


    Meanwhile, at the far end of the supply chains, I listened to Ram Subramanian
    describe the reactivation of the rural economy in the Indian state of Tamil Nadu.3
    During the early weeks of the pandemic, millions of migrant workers returned to
    their villages, often by foot, and grassroots institutions dating back to pre-colonial
    times came into their own.


    Contained within this story is a complex truth, only part of which is usually
    given airtime: we’ve heard that whose lifestyles have done least to bring about
    the climate crisis tend to be the most exposed to consequences, and this is true;
    yet it is also the case that the winners of modernity, those whose lifestyles
    generate the most emissions, tend to be the ones cut off from any possibility
    of reactivating older institutions. We get reminded of our moral responsibilities
    – invited to play the hero, or at least the villain – but we are rarely encouraged
    to recognise our sheer cluelessness, drifting in the simulation, grasping onto
    fragments of feeling ‘real’.


    Somewhere between the rich world''s social media sourdough craze and the villages
    of Tamil Nadu, it seems that many people did use the Covid time as a chance to
    walk away from the parts of the economy no one would honestly miss. By the second
    year of the pandemic, there was talk of the Great Resignation: a widespread refusal
    to return to the regime of ‘bullshit jobs’ memorably diagnosed by David Graeber
    a few years earlier.4'
