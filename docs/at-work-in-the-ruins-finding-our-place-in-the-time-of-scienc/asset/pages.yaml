  md: 'Yet there was also hunger, homelessness and hopelessness brought about by the
    overnight shutdown and prolonged uncertainties of the pandemic. So it''s understandable
    that those economists whose work has been to map the possibilities of ‘degrowth’
    were keen to stress that the crash in GDP accompanying the early months of Covid
    was not at all what they had been advocating. In a statement headlined ‘The Virus
    Is Not Degrowth’, the editors of the website degrowth.info wrote that the transformation
    they sought ‘must be intentional and democratic’ 5 What the virus and the response
    to it revealed the vulnerability of a growth economy based on global-spanning
    supply chains and just-in-time stock-keeping; also, the speed at which governments
    could intervene, when they had the will to do so. What Covid offered was a demonstration
    of both the need and possibility for the kind of degrowth policies they advocated.


    This response made sense at a time when critics were seizing on the costs of the
    pandemic to discredit any critique of economic growth. All the same, what came
    to my mind were the words of Milton and Rose Friedman:


    > We do not influence the course of events by persuading people that we are right
    when we make what they regard as radical proposals. Rather, we exert influence
    by keeping options available when something has to be done at a time of crisis.6


    Their economics might have little in common, but for the degrowth thinkers as
    much as the pioneers of neoliberalism, any path to the kind of world they envisioned
    would have to go by way of crisis.


    Meanwhile, for all the talk of a green recovery and building back better, the
    grown-ups are still failing the Thunberg test. The policies pursued in the name
    of taking climate change seriously continue to fit the sobering description offered
    by Nicholas Beuret, a scholar of environmental politics: ‘techniques that aim
    to contain the worst effects of climate change without'
  merge: -1
