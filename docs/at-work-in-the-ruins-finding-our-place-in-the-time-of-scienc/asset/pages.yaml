  md: 'As I listen for another way of placing ourselves in time, what comes is a story
    that reached me like a rumour. I heard it from the British author Sarah Thomas;
    she heard it from Tyson Yunkaporta. You''d have to ask him he heard it. Maybe
    the land itself. In the best of worlds, this story goes, we stand near the beginning
    of a process that will take a thousand years, because that is how long it will
    be before the old growth have returned, how long it takes for the mother trees
    to grow back. On days when there is woodsmoke on the wind of a Swedish summer
    or when friends on the West Coast of the United States are eerie images of cities
    orange with smog, it takes some faith to imagine that there will be places forests
    have a chance of growing in the centuries ahead. As a Baman from the far north
    of Queensland, I reckon Tyson knows what this is. Yet I find there something quieting
    in the invitation contained in such a story. It is hardly a promise that this
    will come to pass and does not deny the urgency of all that we should be doing
    — or not doing — in our own lifetimes. It asks me to imagine that my kind might
    be a part of the process by which forests flourish, that is a part of what we
    have been and can still be, that making scars is not all we are good for, and
    that scars can heal.


    Modernity has gone around the world making no end of scars. Under its spell, we
    think the world is trying to kill us, because we have forgotten that dying is
    part of what we''re here for and have come to treat it as an error in need of
    correction. And we think that we are here to kill the world, that is how our species
    shows up, as a destroyer. But this spell is wearing off.


    And listening to Tyson''s story, as I let my imagination lean into the time of
    forests, there comes a humbling reminder: we live within stories whose ending
    lies beyond the horizon of our lifetimes. We will never know how of this turns
    out.


    Östervåla

    28 July 2022'
