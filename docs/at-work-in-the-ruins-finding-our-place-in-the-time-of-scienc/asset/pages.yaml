  md: '# SEVENTEEN


    # The Modern Way of Dying


    In the early 1960s, the sociologists Barney Glaser and Anselm Strauss spent six
    years embedded in American hospitals, studying the conversations that took place
    around death.¹ Among the findings reported in Awareness of Dying, from this fieldwork,
    they noticed two contrasting patterns: one group of patients came to the hospital
    for healing but when it became clear this this no longer a possibility, the family
    were keen to take the dying person from the ward, so they could die at home; another
    group, the movement was in the opposite direction and the hospital had become
    the place you go to die. The French historian Philippe Ariès put it, the first
    group consisted of ‘recent immigrants’ to the United States who were ‘still attached
    to the traditions of death’, while the second was made up of ‘those more involved
    in modernity’²


    The first thing to notice here is that we are not dealing with one of those cases
    like anaesthetic dentistry, where it is hard to think of anyone in their right
    mind who would prefer the order of doing things. Some of the offerings of modernity
    are compelling; others are ambiguous, a matter of judgement rather than a clear-cut
    example of progress.


    We might also consider those ‘traditions of death’ for which a patient needs rescuing
    from the hospital depend upon a certain set of capacities: cultural, social, economic
    and material capacities on the part of household, family and community, and even
    on the part of the dying person. A combination of skill and circumstance creates
    the possibility to care for the sick and the dying at home, and to make meaning
    out of the approach to death.'
  merge: -1
  pgno: 170
- img_proc: true
  md: 'Ariès points out that those keeping such traditions in mid-century America
    tended to be immigrants, so we may suppose that many were living precariously,
    under conditions of displacement, not always by choice. Yet in the insistence
    on bringing the dying member of the household home there is at least a memory
    of the home as something more than a set of rented rooms or a step on the housing
    ladder, an echo of a roof under which generations have been born and died. These
    older ways were unlikely to endure for long once the home became a space left
    empty in the daylight hours, with everyone except the very old elsewhere, working
    for money or sitting in classrooms.


    Such ways of dying also depend on the recognition of a threshold which the role
    of the doctor is at an end, because the work of medicine is to heal death is not
    an illness, only a natural part of life. In the early twentieth century, medical
    students were still trained to recognise the *facies hippocratica*, a change in
    the features of the patient that indicated the approach of death and was the sign
    for the doctor to withdraw. Within this way of seeing death there is a sense that
    dying might be something we do, a journey we go on, a struggle akin to giving
    birth, and not just something that happens to us. And that, with the assistance
    of those who matter to us and whom we matter, we might die well. But this all
    starts with recognising the threshold beyond which the work of medicine is no
    longer needed. I think of Thomas Hunter, weak with lung disease and weeks from
    death, dressed to leave the hospital, and the discomfort causes in his anthropologist
    friend, more deeply involved as he is in modernity.


    Among many ways in which humans have made life work and sense of their lives in
    different times and places, there has been a great variety of traditions and beliefs
    around death. Yet there are commonalities within these traditions, such that it
    is hard to overstate the strangeness of this new way of dying, presided over by
    strangers trained in the formalised'
  merge: -1
  pgno: 171
- img_proc: true
  md: 'skills of care. Nor was there a clear choice to leave the old ways behind;
    rather, the new way arrived as a product of the changed circumstances of modernised
    existence. In England, the custom by which the body was laid out in the home and
    kept until the day of burial, as friends and neighbours joined in the work of
    mourning, came to an end not just because of the entrepreneurial spread of the
    funeral parlour but as a result of the arrival of central heating. We can see
    in the work of the hospice movement an attempt to reclaim the possibility of a
    ‘good’ death, beyond the reduction of the body to a battlefield for medical interventions.
    Yet if this was a reaction against the medicalisation of death social scientists
    observed in the middle decades of the twentieth century, it was also an extension
    of the new economy of dying, since the hospital, is staffed by professional caregivers.
    This is the thread that will lead us back to the pandemic. To get there, we need
    to revisit the work of another social thinker whose observations of industrial
    society in general and its medical systems in particular drew international attention
    almost half a century.


    When Ivan Illich came to speak at Edinburgh University in 1974, so many people
    turned up to hear him that they had to relay his voice through loudspeakers in
    all the nearby lecture theatres. There’s an irony, since Illich detested the loudspeaker,
    a technology that amplified the voices of the few and meant that, for the first
    time in history, most of the words we hear in our lives are spoken by people who
    will never know that they exist.³3


    Among the audience that was a medical student by the name of Richard Smith. So
    impressed was Smith by Illich’s account of modern medicine as the ‘major threat
    to health in the world’ that he dropped out of medical school. Three days later,
    for want of anything else to do with his life, he dropped back in. He would go
    on to become the editor of the British Medical Journal but a life spent at the
    heart of the medical establishment has done little to to persuade him that Illich
    was mistaken. In 2002, he recalled'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'in the pages of the BMJ impact that Illich’s speech had on him and how it resonated
    with his own experience: ‘I felt that what I saw on the wards of the Royal Infirmary
    of Edinburgh was more for the benefit of doctors than patients.¹⁴


    Ivan Illich was a brilliant, difficult man, a high-flying Catholic priest who
    fell out with the Vatican and renounced the exercise of his vocation, becoming
    instead, for a while at least, a kind of intellectual rock star. In the course
    of the 1970s, he wrote a series of short, fiercely polemical books – ‘pamphlets’,
    he called them late – – on the counterproductivity of the institutions of industrial
    society. He observed that the advantages of modern systems tend to be cancelled
    out as we become increasingly dependent on them. The car adverts sell us freedom
    but the experience of driving is mostly sitting in traffic, trying to find parking
    spaces and commuting previously unimaginable distances to work, while our streets
    cease to be places where children can play freely. He saw this pattern playing
    out even in the institutions that we associate with fundamental goods: beyond
    a certain point, he argued, schools making our societies more ignorant, hospitals
    make us sick and prisons create criminality.


    In many areas of life, this counterproductivity shows up the loss of the ability
    to meet our needs as individuals, households and communities. Until quite recently,
