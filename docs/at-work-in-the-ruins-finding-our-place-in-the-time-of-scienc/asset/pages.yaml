  md: 'The crude choices offered at the ballot box encourage us to reduce politics
    to such-and-them challenges. What goes missing is the possibility that we live
    in a time that is stalked by multiple dangers. Beyond the judgements we are forced
    to make on election day, the question is not which of these dangers is least bad
    but how we try to evade them: what paths might lead beyond their double bind?


    There is comfort in the polarising lens of partisanship. It hides the depth of
    the mess we are in by dividing it between the camps and encouraging us to pay
    attention to only the part of it for which our opponents can be blamed. I think
    of the former Wall Street executive Amy Sind who spent the Trump presidency publishing
    a weekly catalogue of the president''s assault on the ‘norms’ of American democracy.
    Each week''s instalment opened with a reminder: ‘Experts in authoritarianism advise
    to keep a list of things subtly changing around you, so you''ll remember.’ It
    would not occur to Siskind or her allies to include in such a list the departures
    from norms born in the spring of 2020 in response to Covid or to consider that
    these too might be markers of a rising authoritarianism. The lockdowns, the increasing
    restrictions on who can say what in online spaces, the people losing their livelihoods
    or their freedom of movement for refusing a mandatory medical treatment: none
    of these changes needed logging because they were brought in for the right reasons.


    There is power in the name of science. I sometimes wonder whether there is anything
    that would count as a sign of authoritarianism, just now, so long as it were done
    in this name.


    Somewhere in the background of all of this, haunting the strange politics of the
    post-industrial West in the early decades of our century, is that sense of vulnerability,
    the thing that science seems to ward against. This is what links all the fault
    lines along which we see the known world ending, from'
