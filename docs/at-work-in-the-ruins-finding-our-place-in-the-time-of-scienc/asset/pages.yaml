  md: '# TWENTY-THREE


    # How to Give Up


    There were eagles riding the air overhead as we took the backroad out of San Pablo
    Etla to the Casa Esteva. The taxi driver left us at the crossroads; at ease with
    the high-speed free-for-all of the highway, had no desire to risk his exhaust
    on the unp road ahead, so a young man from one of the neighbouring households
    drove down to collect us. It was three months into the dry season. We bumped across
    the bed of an empty stream before climbing again to the adobe house among the
    trees.


    After days in downtown Oaxaca, its streets clogged with fumes, the air up here
    was a release. Twenty-five years earlier, when Gustavo Estrada and his partner
    left Mexico City to settle here, they must have felt the same contrast. For Gustavo,
    it was a return to his grandmother’s village; the grandmother who, in his childhood,
    was not allowed to enter her parents’ house by the front door, speak to her grandson
    in Zapotec.


    “My mother,” he told me, the best thing that she could do for her children was
    to uproot them from any connection with our ancestry, to avoid the discrimination
    she had suffered.”


    I’d come to listen to the stories of this old man, a friend of Ivan Illich, co-author
    of Grassroots Postmodernism, and self-declared ‘professionalised intellectual’.
    In the conversations we filmed, he spoke about the three turnings of his life:
    first, in his early twenties, when he walked away from a career as the youngest
    ever executive at IBM; then, a few years later, when he left the Marxist guerrilla
    group he had joined after one of the leaders shot another in a fight over a woman.¹¹
    ‘It was a revelation,’ he said, ‘of the kind of violence we wanted to impose on
    the'
  merge: -1
  pgno: 221
- img_proc: true
  md: 'whole of society.’ The third turning came in 1976, when he turned down a position
    in the Mexican government. ‘By that time, I knew at least two things: first, this
    is not what the people want, these beautiful development programmes. I did not
    know exactly why or what it is the people want, but I knew that it was not this.
    The second was, the logic of the government and the logic of the people are completely
    different.’


    I knew the outline of this story. ‘Back From the Future’, the essay in Gustavo
    wrote about these turnings and where they led him, and Rebecca Solnit’s A Paradise
    Built in Hell, which tells the story of the movements in the barrios of Mexico
    City to which he devoted the next chapter of his life and the role those movements
    played in reclaiming the city after the 1985 earthquake. But as we talked on the
    porch that afternoon, what struck me was his willingness to trust in his own uncertainty.
    At each of the turns in his journey, he had been willing to renounce the security
    of existing structures, structures he had come to find intolerable, even though
    he had no answer as to what else could be done. Willing to go and wait in the
    wilderness, with patience, to see what new things might come into view as a result
    of that letting go.


    When Paul and I published the Dark Mountain manifesto, people accused us of having
    ‘given up’ and worse, encouraging others to do so. This was said as though giving
    up were an absolute moral failing, but to me it never seemed that simple. In fact,
    I want to say that giving up can be a necessary step, a precondition for becoming
    able to see the world otherwise and find the moves that are called for now, the
    moves that will be called for as the project of the big path fails. To give up
    is always to give on something, though at the time it may well feel like everything.
    The question is what we are giving up on and how we come to see the world as a
    consequence.'
