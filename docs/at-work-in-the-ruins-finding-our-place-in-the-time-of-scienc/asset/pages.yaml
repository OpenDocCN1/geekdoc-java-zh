    Gail Bradbury, the co-founder of Extinction Rebellion, and wasn’t that the woman
    I’d told her about Stroud


    ![](img/3d5e36685ff1f229bd38467a8cec7d78_79_0.png)


    By the autumn of 2018 and the spring of 2020, when the first Covid lockdowns were
    introduced, a set of new climate movements sparked across networks and onto the
    streets. Fridays for the Future, Extinction Rebellion, the online community around
    Deep Adaptation: each had its own identity but they fed into each other and into
    a wider shift in the cultural weather. By the time Greta Thunberg sailed the Atlantic
    in August 2019, these movements were connecting with a wave of North American
    activity that included the Sunrise Movement, Zero Hour and the activists organising
    around the Green New Deal, a programme of climate action and job creation policies
    championed by Alexandria Ocasio-Cortez. There were differences: in the United
    States, activism aligned closely to the partisan divisions intensified by the
    election of Donald Trump, whereas the European movements called for a response
    that would ‘Go Beyond Politics’, in the words of Extinction Rebellion’s third
    demand. But there were also common features that marked this moment out from earlier
    waves of climate activism.


    In hindsight, the first sign had been the huge response to David Wallace-Wells’s
    *New York* magazine article ‘The Uninhabitable Earth’ in July 2017.'
  merge: -1
  pgno: 79
- img_proc: true
  md: 'It went viral like nothing he had written before, revealing the power there
    could be in naming our fears and the hunger out there for permission to talk about
    our darker thoughts. In the activism I''d been part of in the years before Dark
    Mountain, it seemed like there was only room for two shades of feeling: anger
    at them, the ones who were killing the Earth, and optimism, cheering each other
    on with the promise that we can still do this, with one more push, one more gathering
    at one more summit. Whatever else you felt was best kept to yourself. When Paul
    and I wrote the manifesto, there were friends who said: we get it, you''re burned
    out, so take a break! Yeah, I thought, go to Bali and spend three months on the
    beach, and maybe you''ll come back ready for another round, or maybe it''s time
    to move to Devon and Retrain as an acupuncturist. Just, whatever you do, don''t
    go around talking about it and bringing everyone down.*


    Ten years on, there were days when it seemed the weathervane swung 180 degrees.
    Feelings that once been taboo were now voiced in TV interviews and chanted by
    people putting their bodies on the line to stop traffic, bring business as usual
    to a halt and demand that we talk about what we know and where we are headed.


    ''What do you do, after you stop pretending?'' I''d written those words one night
    in early 2010, as we were preparing for the first Dark Mountain festival. Our
    manifesto had seeded a cultural movement: a network of activity drawing together
    artists and activists, engineers and gardeners, hackers and smallholders, centered
    on the books we published and the gatherings hosted. It all started with that
    invitation to look down, to step back from stories you no longer believe in and
    activities that have become a means of distraction, a way of keeping busy enough
    not to think about what you know or fear to be the case. What still seems worth
    doing, after you take that step? It was a question we didn''t know how to answer
    but which brought a new energy to conversations and spread like a rumour over
    the years that followed. In these new climate movements, I glimpsed'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'the outline of an activism that started from the place that question takes
    us, didn’t ask you to voice an optimism that you didn’t feel. Much of what I saw
    true to my experiences with Dark Mountain and the strange kind of hope we had
    finding in our fears and disillusionments. Only now it was spreading at large,
