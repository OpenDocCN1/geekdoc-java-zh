  md: '# FOUR


    # # The Only Prediction I Am Going to Make


    The walk from the station cuts through the modern shopping streets, then across
    the channelled river, its banks lined with the painted fronts of older buildings.
    The afternoon sky is a flawless blue but there''s an edge to the air that wouldn''t
    have been there a few weeks earlier. On the steep path that runs past the castle
    you have to stay alert for the cyclists who come flying the other way. It''s early
    September, the first day of a new academic year in this old university town.


    The lecture theatre is a cave, down a wide flight of steps, in the basement of
    one of the newest buildings. There are no seasons underground, here in the bright
    fluorescent light and the conditioned air. The rows of seats fill up with students,
    notebooks at the ready, phones set to silent, poised on the threshold.


    I have been asked to give the opening lecture of year at the Centre for Environment
    and Development Studies. During their courses, these students will hear from researchers
    who at the front line of the Anthropocene: earth scientists, ecologists, ethicists,
    engineers, political economists and economic anthropologists; people with PhDs
    and academic publications behind them. I am none one of these things and, through
    the weeks of late summer, I''ve been wondering what I could say that might be
    some help as they grapple with the knowledge that is coming their.


    ‘I want to talk about the future,’ I say, ‘but I’m afraid I don’t have any charts
    or projections. There won’t be one of those quadrant diagrams with'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'four scenarios for how the world might look in 2050. This isn’t going to be
    the kind of talk which ends with a list of things we can do that will make it
