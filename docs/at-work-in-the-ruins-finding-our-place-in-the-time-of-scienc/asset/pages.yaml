  md: 'In May that year, I found myself back in Brussels to speak at an event hosted
    by the European Commission, alongside Alison Green of Scientists’ Warning and
    Jem Bendell, the author of the Deep Adaptation paper. The whole day felt like
    a symptom of the interregnum that Antonio Gramsci famously described: the old
    world dying, the new one not yet born. A network of staff from across the commission
    had used the vehicle of the Connect University, an internal institution whose
    official responsibility was to explore ‘the digital future’, to stage a conference
    on climate change that stepped outside the usual frame of policy discourse. The
    night before it took place, I remembered my conversation with the source I met
    the last time I was.


    My message that day was sustainability is over: the challenge now is not to sustain
    the way of living of the European countries but to negotiate its surrender. This
    means the decommissioning of whole areas of economic activity, but also the decommissioning
    of deeply held beliefs and assumptions, including the growth assumption.


    A buzz of emails followed the event and I could sense the hunger for a different
    conversation to the ones that usually took place within these institutions, but
    also the struggle to find a frame that could hold that conversation without it
    unrav into dark imaginings of fear and control. Out of all those, the one that
    caught my attention came from an economist who worked at the commission. It concerned
    what he called ‘the unresolved question of delinking’: the crux of this, he wrote,
    lay not in the measurement of GDP but the viability of the European social model.
    When we talk about economic growth, our attention tends to be drawn to the private
    sector, but the structures we inherited from the industrial societies of the twentieth
    century are more deeply interlinked than this allows. The public institutions
    which, at their best, offer shelter from the raw force of economic exchange are
    dependent on and contribute to the overall scale of the economy. If we accept
    that the long-term trend of economic growth'
  merge: -1
  pgno: 154
- img_proc: true
  md: 'cannot continue, this is not just a problem for Amazon and Walmart, it’s a
    problem for the National Health Service, the schooling system and the welfare
    state.


    ‘I have not seen any proposal so far that even comes close to addressing the issue,’
    he went on. ‘Most of the talk is about investments, a climate bank, etc., but
    the much bigger issue is the addiction to current rates of growth via the public
    spending programmes.’


    The need for economic growth is a social construct, not a law of nature. It is
    the result of particular forms of money and ways of using debt; as Bernard Lietaer,
    one of the architects of the Euro, explained in *The Future of Money*, there have
    been human societies that thrived on other approaches to economics, though these
    were not societies of large-scale industrial extraction.² The need for growth
    starts as a social construct, yet this construct is the tablecloth on which our
    current societies have been arranged. The question, I thought, was how fast this
    cloth could be pulled out, and how many of the plates and glasses would get broken
    in the process.


    ‘How much of the economic activity you see around you could just go?’ I remember
    asking the audience that day in Brussels. ‘Not thirty years from now, or ten years,
    but overnight, and no one would honestly miss it, if this could happen without
    anyone going hungry or homeless as consequence’


    We all what happened next: in March 2020, the world’s economies went off a cliff,
    registering a drop in GDP the like of which had not been seen in centuries. There
