  merge: -1
  pgno: 81
- img_proc: true
  md: 'get to tell it and know that they are heard. The second time, she went on,
    it matters that I notice when to stop them. Otherwise, the retelling can harden
    into an identity, a new shell to hide behind. I wondered about all those who had
