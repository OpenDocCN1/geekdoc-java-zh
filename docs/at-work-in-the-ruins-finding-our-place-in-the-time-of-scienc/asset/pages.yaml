    the Dark Mountain manifesto.¹ Our conversation circled around the questions both
    of us were carrying: the grief-shadowed awakening to the more-than-human world;
    the journey into an awareness of all the relationships from which a mechanistic
    account of the universe cut us off; the task of Uncivilisation, the title we had
