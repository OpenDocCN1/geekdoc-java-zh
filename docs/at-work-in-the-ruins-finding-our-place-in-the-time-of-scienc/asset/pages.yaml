  md: '# THREE


    # Four Conversations


    That was a lot of ground to cover in a few pages, so let''s take a breath. I did
    not expect to write this book and there are things I''ve said already that don''t
    sit comfortably with me. This has taken me places I didn''t expect to go. So bear
    with me and I will do my best to walk us through the territory sketched out so
    far, starting with those questions which lie beyond the scientific framing of
    climate change.


    But first, before we go there, let me wind back to the week in September 2021
    when these thoughts began to crystallise. Because what I have to say make more
    sense in the light of the series of conversations I had that week, at the end
    of which I heard myself aloud, ‘I need to stop talking about climate change’,
    and realised, even as the words came out, that I would have to explain how this
    could be the case.


    The first conversation was with a researcher from Denmark who works on the borders
    between science and art, design and technology. We''d met or spoken maybe half
    a dozen times but it had been several years since the last occasion, and so we
    told each other about where our work had taken us in the meantime. I mentioned
    a series of essays I had written before the pandemic, sparked by the new climate
    movements. He responded by telling me about a project his team had done with scientists
    modelling the impact of climate change on a particular grassland habitat. They
    took the data and made an artwork, an immersive experience that brought the future
    of this habitat to life. The scientists were excited and so was he: this kind
    of'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'modelling was in urgent need of scaling up and art like this could make people
    feel why it mattered. There were 7,000 habitats like this that needed to be modelled
    in the same way, so that we could know and plan for how to manage them in the
    world of 2050.


    His excitement for this left me cold. All I could think of was the famous story
    by Jorge Borges, ‘On Exactitude in Science’, about an empire whose cartographers
    made a map on a scale of one-to-one. ‘In the Deserts of the West, still today,
    there are Tattered Ruins of that Map, inhabited by Animals and Beggars...*1 Fairly
    or not, I saw in this massive enterprise of modelling an endless drive to generate
    knowledge that the world does not need. Or worse, to remake the world into a thing
    that needs knowing in this way – the object of our total management – and to make
    ourselves into a life support system for a planet that, however damaged, still
    knows how to live. This was a vision that chilled my heart.


    The second conversation never happened. It was like this: an old colleague of
    my partner pinged me to ask if I had time for a call with one of her Palestinian
    contacts. He wanted to talk to someone about climate change and he''d been pointed
    to a team at Oxfam, but she thought she ought to talk to me.


    I said go ahead and connect us, and he followed up within minutes to introduce
    himself. His email said he was writing from a coastal city in the United States.
    He had started out in policy, advising on the Israeli–Palestinian negotiations
    and then on economic development. Next, he’d gone into the start-up world ‘with
    a healthcare focus’ and now he was ‘looking to pivot climate change (with a hybrid
    policy and entrepreneurial bent’).


    I saw two things at once. First, I had nothing to say to this guy. I couldn’t
    even find the energy to reply with a link to a talk that might give him a clue
    where I was coming from. But second, I saw that climate change now'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'belonged to guys like him: that once they ‘pivoted’ in to save the day, theirs
    would be the terms in which we all had to talk if we wanted to sound serious.


    The third conversation was fascinating but it left me sad. A journalist from Estonia
    wanted to talk to me for an article he was writing about a community caught in
    the crossfire of climate politics. This was a small town in the Russian-speaking
    east of the country, where the local economy was built on oil shale extraction.
    A region in decline, the industry was now to be shut down in the cause of meeting
    EU emissions targets. I''d never been to that part of Estonia but I couldn''t
    help thinking of the towns and villages of the South Yorkshire coalfield where
    I''d worked as a reporter twenty years earlier. I had friends who came from those
    places, artists and activists who have struggled for decades to build pockets
    of hope among the wreckage left by the closure of the pits.


    He told how the politics was shaping up: the populist big men promising to ‘save
    your jobs’ and shove this climate shit up the EU''s terse. His question was what
    else could be done for communities like these. We talked about how change can
    sometimes come from a community discovering its own strength, moving beyond helplessness;
    how the places where things are bad enough already can be where new forms of cooperation
    take root. We discussed what kind of policies might help. I said, where there
    is mistrust in politics, you have to start by treating this mistrust as well-founded
    – not a mistake but a product of experience. At the end, he asked if he could
    introduce me to the politicians he knew, and I did not say no.


    Yet afterwards the sadness came. Perhaps not here, but in most places like it,
    I saw how climate politics would play out, bringing the kind of casual devastation
    that Margaret Thatcher brought to the coalfields. There would be the same implicit
    calculation, *these are not our voters*, now'
