- img_proc: true
  md: 'that an increase in GDP no longer results in an increase in resources used
    or emissions released. This claim has been repeated in reports from the World
    Bank, the OECD and the UN Environment Programme, so Kallis and Hickel set out
    to examine its empirical basis. It turns out not to have one.


    The drop-off in resource use in the advanced economies of the post-industrial
    West – heralded by proponents of green growth the moment when we passed ‘peak
    stuff’ – turns out to be a statistical illusion created by the offshoring of manufacturing.
    Once you take into account the resources used in factories elsewhere to produce
    the goods and services we consume, the growth of our economies is more stuff-dependent
    than ever. Meanwhile, the ever-narrowing pathways towards the Paris goals for
    limiting change are paved by carbon capture technologies that are either ‘unproven
    or dangerous at scale’ – or else depend on rates of decarbonisation, starting
    right now, that are vastly greater than seems plausible for any economy without
    an overall slowdown in activity.


    Having surveyed the evidence and proved the models, Hickel and Kallis conclude
    that the claim that green growth is possible is a fantasy born of desperation.
    ‘It is not politically acceptable to question economic growth,’ they write, ‘therefore
    green growth must be true, since the alternative is disaster.


    This is what made the conversation between Thunberg and Macron so interesting.
    We were no longer in the realm of anonymous underlings wondering how to broach
    the unspeakable with their bosses. Now, Macron is a windsock of a politician,
    to be sure, blowing whichever his audience wants just now. All the same, when
    the incompatibility of economic growth and ecological viability becomes speakable
    in rooms like the one where that conversation took place, we are drifting towards
    an event horizon. I don’t know that anyone can say for sure what kind of world
    we’ll find ourselves in, on the far side.'
