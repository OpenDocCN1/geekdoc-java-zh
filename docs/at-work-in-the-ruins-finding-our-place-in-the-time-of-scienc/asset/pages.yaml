  md: 'Consider an article from a 2014 issue of the Swedish popular science magazine
    Forskning och Framsteg. The title of the magazine translates as ‘Research and
    Progress’, and the strap-line promises ‘fact-checked research findings’. In answer
    to a reader’s question, ‘Can the aurora make a noise?’, Professor Olof Lodén explains
    that earlier generations of researchers may have been unwise to dismiss the suggestion;
    however, we know how far up in the atmosphere the lights themselves occur, so
    we can rule out the possibility of hearing anything that connects to what we see.7


    Except that, in 2012, the Finnish physicist Unto Laine published a study with
    the help of scientific instruments what the Sami had known all along, under the
    right conditions you would indeed hear a gentle but distinctive crackling and
    rustling sounds that are part of the same phenomenon as the aurora.8


    You might think that such findings would occasion a little humility but this just
    isn''t how it goes. A cheerful BBC report explained that ‘these sounds and the
    myths surrounding them had no scientific basis’ until now, while another article
    declared that Laine had ‘shown’ that the sounds are real’.9 Others had known them
    to be real all along, while the scientific consensus consistently insisted that
    this could not be the case, does not seem to unsett the singular authority of
    science over what gets to be treated as real.


    It’s hard not to like Professor Laine. In fact, he reminds us of Caroline Ross.
    His quest to prove the reality of the lights that can be heard had begun decades
    earlier, when he and a group of friends heard these sounds for themselves. He
    received no funding to pursue this research but was led by his own desire to show
    others what he had experienced. He seems like a guy you’d enjoy sitting around
    the campfire with.'
