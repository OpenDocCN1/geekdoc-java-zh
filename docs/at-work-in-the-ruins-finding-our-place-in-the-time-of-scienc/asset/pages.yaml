    that opposing trajectories can be playing out at the same time, operating on different
    scales. When I speak of the big path and the small path, I don’t imagine these
    trajectories could translate into a clear choice on the same plane of politics,
    two boxes on a single ballot paper. Rather, my guess is that they coexist for
    a good yet, the one at the centre and the other closer to the edges, without fully
