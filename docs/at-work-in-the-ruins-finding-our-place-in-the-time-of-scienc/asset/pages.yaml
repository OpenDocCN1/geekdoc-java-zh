  md: '# SEVEN


    # Hanging Over the Void


    That late August when Greta Thunberg began her strike in the street outside parliament,
    Sweden had seen no rain worth mentioning in months. The radio told us that May
    2018 had been the hottest in over 250 years and then it said the same about July.
    But seeing as the oldest continuous series of daily weather observations anywhere
    is kept at the old astronomical observatory in Stockholm and dates back only to
    the 1750s, it struck me you could add a couple of zeros to that headline figure.


    At first, the blue skies and warm air came as a relief after the barrenness of
    winter. This far north, the light returns long before the trees come into leaf.
    But as the weeks went by, as the days grew longer and the heat built, this beautiful
    weather became ominous. Wildfires sparked up and down the country. The wind spread
    the flames and carried the smell of woodsmoke to the streets of far-off coastal
    cities, but it brought no rain.


    When July, we hired a car and drove north. By now, the authorities were dropping
    bombs on burning forests and bringing in firefighting planes from Italy. Our region
    had grown off so far but the countryside was on high alert. We stayed on a farm
    and the farmer told us that she had a problem: in this heat, the lambs didn’t
    notice the shock from the electric fencing, so they were getting out and running
    everywhere. But her farm was lucky, she said, as they had about three-quarters
    of the fodder they normally had at this point in the year. In other parts of the
    country, farmers were trying to send their animals to slaughter because they couldn’t
    feed them, except the slaughterhouses couldn’t handle the number of animals the
    farmers wanted to send them.'
  merge: -1
  pgno: 77
- img_proc: true
  md: 'At any other moment in history, I thought, to have to slaughter your herds
    before summer is out because of a lack of fodder would have been a crisis of high
    order. But for a handful of generations, we’ve lived in a world that is bound
    together by supply chains whose effect is to distribute the impact of any local
    crisis across the whole system, so that a failed harvest in the American wheat
    belt is more likely to cause bread riots on the streets of Cairo than the streets
    of Chicago. This works until it doesn’t, until the frequency of local crises strains
    the global system to breaking point. In the meantime, while the system holds,
    it it means that those whose ways of living place the most strain upon that system
    will be the last to notice.


    On hot nights, the mind starts playing tricks. A student confessed that she was
    starting to doubt if it would ever rain again. But of course, the drought broke
    and autumn came. In mid-October, I made a trip to England. At a talk I gave in
    Stroud, the organisers asked a local woman onto the stage. ‘A few of us are organising
    a rebellion,’ she said, not I were expecting to hear that night.


    I’d agreed to record an interview for the culture show on Swedish national radio
    on my first morning home. Still tired from the two-day journey across Europe,
    I sat with the presenter on a bench in the park from the railway station. He started
    asking about the fires that summer. He was hoping I’d say something had shifted
    as a result but all I could think of was the stream of comments overheard at the
    hairdresses or the supermarket, or around my in-laws’ dining table, through the
    rainless weeks of July and August. ‘Isn’t the weather amazing?’ people would say
    to each other. ‘Don’t the farmers complain a lot?’ and ‘The government should
    really buy more of those planes, so we don’t have to keep borrowing the ones from
    Italy.’


    Yet, after the interview, I began to wonder. Perhaps there was a shift going on,
    below the surface: a change in the conversation about climate'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'change in certain places, a darkening realism, a movement in the boundaries
    of what it was possible to talk about. I’d had some strange conversations that
    autumn with people on the inside of institutions who had lost all faith in the
