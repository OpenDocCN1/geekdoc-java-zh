    In November 2019, the editors of the Oxford English Dictionary selected ‘climate
    emergency’ as their word of the year. Its use had risen a hundredfold in the course
    of twelve months. On Google Trends, you can pinpoint the spike in the searches
    to the last days of April, for Extinction Rebellion’s London protests swung public
    opinion in the UK and beyond. By the end of the year, binding declarations of
    climate emergency had been passed by 1,195 jurisdictions and local governments
    around the world, representing more than half a billion citizens.


    If a willingness to go into the dark was one that set these new movements apart
    from earlier waves of climate activism, then another was the strange spectacle
    of activists organising to demand a declaration of emergency from the state. In
    a review of the book-length version of The Unhabitable Earth, the American psychologist
    Margaret Klein Salamon wrote ‘the climate emergency movement’, a banner under
    which the activism she saw on both sides of the Atlantic could fit.¹


    Among all this activity, I was struck by how little reference there was to what
    ‘climate emergency’ usually means in politics. Perhaps it was most of these movements
    had their roots in English-speaking countries. In the UK or the US, you can invoke
