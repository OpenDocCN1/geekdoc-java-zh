  md: '‘Dougal Hines’s very personable book makes a persuasive and welcome case for
    a new view of science. He shows clearly how movements that live by science – in
    its current, institutionalized meaning – will also die by science. At Work in
    the Ruins speaks up for practical judgment, common sense and the wisdom of heart
    as guides on the “small and branching path” that Hines contrasts with the big
    highway of surveillance and regulation which scientized technocracy proposes to
    address climate change. The Covid years have revealed a stark choice, long foreseen
    by the prophetic thinkers, such as Ivan Illich, by whom Hines is inspired. I hope
    many will Hines’s invitation to friendship and intellectual modesty, and join
    him on the adventure of the small path.’


    # David Cayley, author of Ivan Illich: An Intellectual Journey


    ‘If the hourglass has come to stand for the time of endings in which we find ourselves,
    Dougal Hines looks beyond it to recall the myriad encounters with thinkers and
    knowledges which have shaped his sense-making over the past two decades, and which
    shed light on our predicament. When our gaze returns to the hourglass, the reader
    might question its shape, the width of the opening, where the sand was taken from
    and who gets to turn it. What actually happens once the sand has drained? Or what
    happens if it doesn? What would happen if the glass cracked and the sand was allowed
    to spill out onto the table? Hines makes tentative maps with split sand, tracing
    lines with his finger that are clear, compelling and cathartic; reverent to the
    unknown and unknowable.’


    # SARAH THOMAS, author of The Raven’s Nest


    ‘Here is a book that explores the public understanding of science around climate
    change, Covid and social movements. Asking if we demand too much of science, Hines
    points beyond the “dark hubris” of despair. With eloquence and honesty, he invites
    us to the hope of deeper mystery that life on Earth might yet unfold.’'
