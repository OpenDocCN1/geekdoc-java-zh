  md: '# SIXTEEN


    # An Illness That Fits the Cure


    In the late autumn of 1979, Hugh Brody got back from a trip to find that his friend
    Thomas Hunter had been taken to hospital. Brody is an anthropologist who walked
    away from a university career to put his academic authority at the service of
    tribal peoples. For eighteen months, he had been living and working with the Dunne-za
    people of the Halfway River in northeastern British Columbia. Hunter was a Dunne-za
    elder in whose home he had been living, but now the old man’s health was failing.


    > ‘He’s old and his lungs have gone,’ the doctor told Brody. ‘Nothing can do.’


    Back on the public ward, he found Hunter lying on his bed, dressed in jeans and
    a vest. ‘The doctor says you can leave here when you want. But I guess you could
    stay, if that seemed better.’


    It’s clear from the way Brody tells the story that something here did not sit
    with him. To take a man in his eighties, weak with lung disease, away from the
    medical capabilities of the hospital felt wrong. But Hunter was clear enough,
    speaking the blunt English of his youth as a trader. ‘OK, we leave now?’


    This time of year, his family would be at the dry-meat camp, hunting moose and
    preparing food for the winter. Hunter wanted to join them and again Brody was
    troubled. Wouldn’t his friend be better off the reserve, with a proper bed, a
    clinic where the nurse comes once a week and access to a telephone? But the old
    man knew what he wanted.'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'When they got to the camp, they found it deserted. Once more, Brody wondered
    if they shouldn’t head to the reserve, at least to find some members of his family?
    ‘No,’ came the answer. ‘Better finish here.’


    Hunter went to sit outside the family tent. Brody made a fire, set a kettle to
