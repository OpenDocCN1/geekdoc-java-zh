    Over the years, I''ve sometimes felt a secret sympathy for the full-on climate
    deniers. Not the well-paid shills who sow confusion on behalf of the fossil fuel
    industry but the retired engineers who contour their reasoning to explain why
    the climate scientists got it wrong. In their efforts to avoid the implications
    of climate change, there''s a sense that they grasp what it would cost to face
    them. By contrast, those who talk up the possibilities for ‘green growth’ and
    a smooth transition to a decarbonised economy a slippery form of denial.


    I heard a story about what happened when Thunberg met Emmanuel Macron. This would
    have been February 2019, after her visit to Davos. For three months, the French
    president had been under siege as yellow-vest protesters made their anger felt
    on the streets and at the roundabouts. The trigger for this movement, the move
    that pushed people to breaking point, was a misunderstood attempt to accelerate
    the transition to a green economy by pushing up the price of fuel at the pump.
    It is tempting to imagine that Thunberg’s visit to the Elysée came as a relief,
    relatively speaking, though the frankness of the conversation that followed was
    still surprising.


    > ‘France is unable to decrease its emissions,’ Macron told her, ‘because its
    economic growth.’


    That spring, the journal New Political Economy published a paper by Jason Hickel
    and Giorgos Kallis which asked ‘Is Green Growth Possible?’¹ The authors began
    by noting that the theory of green growth – ‘continued expansion (as measured
    by Gross Domestic Product or GDP) is or can be made to compatible with our planet’s
    ecology’ – currently dominates talk about climate change. This theory is promoted
    by multilateral organisations and taken as read by policymakers at every level.
    It rests on the claim that economic growth can be ‘decoupled’ from its environmental
    impacts, so'
  merge: -1
