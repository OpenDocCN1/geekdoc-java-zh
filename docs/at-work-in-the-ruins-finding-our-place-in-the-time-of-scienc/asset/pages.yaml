  md: '# # ONE

    # Talking About Climate Change


    I never trained in how to do this. It''s not a job that I applied for. It''s not
    the only thing I''ve done with these past fifteen years, but it is the thread
    that has run through my life and work over that time: on stages and Zoom calls,
    in public and in private, on air or off the record, in essays and articles and
    conversations, I have been someone who talks to people about climate change. Then
    a day came when I saw that I had to stop. The words were failing me. Their meanings
    seemed to come adrift, the way a sign go on saying the same thing, only it has
    swung away from the path it used to point down. Or perhaps the path itself that
    changed. All I knew was that I would need to start again, to find another way
    of talking, another way into what we needed to talk about. This is the story of
    what I saw that day and where it led me.


    I worked with climate scientists, but I am not a scientist. When it comes to explaining
    what we know about the processes of climate change, I leave that to others. My
    role has been to come in at the place where the work of science runs out, when
    it''s time to talk about what climate change means, how we make sense of it, how
    we go from an arm’s-length knowledge of facts to the experience of knowing that
    can leave us changed, that might lead us to act as though we recognise the depth
    of the trouble we are in.


    People often come to me when they’ve hit the oh-fuck moment: the point where climate
    change stops being one on a list of serious matters that hover'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'in the corner of your field of vision and becomes the thing that keeps you
    awake at night and lives in the pit of your stomach all day. I hit my own oh-fuck
    moment in my late twenties. It was 2005 and I was working as a journalist at the
    BBC. In the months that followed, I''d go around switching light switches with
    an obsessive compulsion and recycling like it was going to save the Planet. I
    remember climbing over the ends of a late shift in the newsroom to switch off
    all the overhead screens my colleagues had left on when they went home. Under
    any other circumstance, linking the fate of the planet to the small behaviours
    of your daily routine would tick a major box on a psychiatrist''s diagnostic questionnaire,
    yet this is how we are taught to react to the news of the climate crisis. And
    maybe it''s the right response, to lose your mind as you wake up to the gap between
    the situation we are in and what is being done about it. Meanwhile, I had to to
    ambitious young colleagues talk smoothly about how we should always put climate
    skeptics on air alongside scientists or campaigners as part of our duty to provide
    balance in public broadcasting.


    Around that time, I met another disillusioned journalist, a few years my senior.
    Paul Kingsnorth had written for most of the national newspapers, he''d edited
    The Economist magazine and he had been an environmental activist since his teens.
    Together, we wrote a manifesto that was a call to look down: to abandon false
    optimism and face the depth of the crisis and the deep cultural roots of how we
    got here. Looking back, I think we were both in need of a place to talk about
    our fears and darkness without feeling judged and without a rush to answers. We
    had a hunch that others might need too, and when we published the Dark Mountain
    manifesto in 2009, the response proved this right.¹ a project: publishing books,
    holding an annual festival, hosting gatherings and courses, inspiring songwriters
    and filmmakers and sparking collaborations we could not have imagined at the outset.
    Within five years,'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'the New York Times could introduce us to its readers as ''changing the environmental
    debate in Britain and the rest of Europe'', 2


    Not everyone appreciated what we were doing. I once spent an hour on stage going
    head-to-head with the journalist and environmental campaigner George Monbiot as
    laid into the dangerous pessimism he saw in Dark Mountain. On the other hand,
    I was invited for a meeting with the artistic director of Sweden''s national theatre,
    who told me he had spent two years in despair as he read book after book about
    the climate crisis, until he came to our manifesto, which had provided a turning
    point. I went to work with his theatre, running a year-long workshop on the roles
    of art under the shadow of climate change and collaborating on a play that was
    based on interviews with scientists, where we set out to show what it does to
    you when the climate crisis is your day job. For many people I worked with those
    years, Dark Mountain became a journey to the far side of despair.


    I found myself invited to gatherings with scientists and policymakers, where they
    asked for help from those of us who came from the arts or education or religious
    traditions. I took part in public conversations with bishops and philosophers
    and Indigenous activists. I wrote about what I called ''the dark matter of climate
    change'', the part of the story that science can''t help us fathom. Often, people
    would come to me with a professional request – an interview for a newspaper or
    a research project – only for the conversation to take a more personal turn, as
    they began to speak about their dilemmas over parenthood or their doubts about
    the work they had once believed in.


    The summer of 2018 was hot and rainless in Sweden; by June, the grass in parks
    and gardens was a dead yellow and in July, I walked through fallen leaves in the
    streets of Stockholm. The news was full of wildfires and the politicians argued
    about why we were having to borrow planes from Italy to fight them. When the schools
    went back for the autumn term, fifteen-year-old Greta Thunberg chose to start
    a protest outside'
