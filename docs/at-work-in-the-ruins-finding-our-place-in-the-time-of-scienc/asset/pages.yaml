  md: 'so I heard half of what the guy they wanted me to argue with was saying. What
    stuck with me was a question that came from the host. I’d been talking about the
    lifestyles people still mostly take for granted in cities like Stockholm or Chicago.
    I said, ‘I don’t believe these lifestyles are going to be made sustainable.’ The
    next time he came to me, he asked, ‘So, in this future you’re talking about, how
    many humans are left at the end of the century? Are we talking a hundred thousand,
    a million?’ The question threw me. I couldn''t see how we got here, how my suggestion
    that the lifestyles of the professional-managerial classes are going away was
    equivalent, in his mind, to the elimination of 99.99 percent of the human species.


    Here’s the ambiguity contained in talk of existential threat: it can mean a threat
    to the continued existence of humans and life itself, or it can mean a threat
    to a mode of existence, a particular way of living. In a lot of climate talk,
    these meanings blur or we slip between them, unable or unwilling to see the difference.
    It doesn’t help that we are heirs to a culture haunted by the un-faced fear of
    death, the personal existential threat we do not best to think about. It doesn’t
    help that messages about our ecological predicament slip back and forth between
    these two meanings all the time.


    I’m thinking now of a corporate social responsibility campaign by Marks & Spencer
    from back when we were writing the manifesto, a list of sustainability commitments
    the company was making. I’d see the posters behind the tills at the food store
    at Sheffield railway station: Plan A: Because There Is No Plan B. And the more
    I saw them, the more I wondered, for whom there is no Plan B? For British department
    stores that sell very fine cheese-and-pickle sandwiches or for a liveable human
    existence? Or were we no longer making that distinction?


    Whatever else it starts out meaning ‘sustainability’ has a way of slipping into
    meaning ‘sustaining supermarkets and superhighways,’ promising that the lifestyle
    of the Western middle classes can be sustained and insisting'
