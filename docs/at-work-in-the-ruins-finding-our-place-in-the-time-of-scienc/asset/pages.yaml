  md: '# NINE


    # Potemkin Villagers


    The first time we meet, he takes me around his lab, explaining the devices they
    are working on just now. This sealed metal tub contains a simulated ocean, churning
    with the gases they pump through it; in the rack over for taking high-altitude
    measurements is assembled from a mix of off-the-shelf equipment and new components
    made here for the task. He lights up when he talks about this work, with a look
    I''ve seen before on the faces of craftsmen, hackers and engineers: the deep satisfaction
    of applying ingenuity to hard, material problems and getting to take the time
    job requires.


    In the corridor that leads back to his office, he points to a photograph on the
    wall: a research station in the Arctic where he did fieldwork as a post-doc, thirty
    years ago. Later, I learn that this was also where he met his wife. On the shelf
    over his desk is a model of a Soviet spy plane his team hired in the mid-nineties
    from some offshoot of the Russian military. They used it to take measurements
    in the outer reaches of the atmosphere. ‘I love flying,’ he admits.


    I’m here because I’ve been commissioned to write a play, or rather a quarter of
    a play, since four of us will work together on the script. Each writer is paired
    with a scientist. Our partners come from different fields, different backgrounds,
    different stages of career. What they have in common is their research has brought
    them to the frontline of ecological crisis. Our task is to learn about their lives
    and tell four stories about what it’s like when the Anthropocene is your day job;
    when climate change is not something you hear about the news, or make a placard'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'about, or try not to think about, but the thing that is waiting on your desk
    each morning. What does that do to you, as a human being?


    So we sit in his office with cups of tea, I switch on my recorder and he starts
    to tell me the stories of his life. And although I used to spending time around
    climate scientists, there are things that strike me now only as a result of working
    on this play.


    The first thing is that you don’t necessarily end up as a climate scientist because
    you started out with a burning concern for the damage we are doing to the planet.
    This must have been especially true for the older generation, who set out on their
    careers before the evidence had mounted up. Rather, it starts with having a certain
    shape of mind, suited to particular kinds of intellectual task, and, combined
    with the influences of your childhood – the world events and TV shows you grew
    up with – sets you pinballing through the early stages of an academic career.
    So you happen take this course rather than that, you wind doing a PhD with a professor
    who has this big project going on, you find yourself doing fieldwork at that research
    station and meet someone and end up moving continents to live together, where
    you put in an office next door to this other professor who needs help with an
    international research network he’s setting up – and somewhere down the line,
    steadily or slowly, it comes to you that what you are working with is no longer
    just intellectually rewarding but And this is the second thing that strikes me:
    when you reach that point, there is little in your training as a scientist or
    in the culture of science that is going to help.


    When we talk about science in everyday conversation, when we use the word as I’ve
    been doing in this book, it brings to mind the activities of the natural sciences:
    the figure in the white coat in the lab, looking down a microscope, or else in
    waterproofs and waders, collecting samples in the field, taking measurements,
    analysing data. There is no single scientific'
  merge: -1
