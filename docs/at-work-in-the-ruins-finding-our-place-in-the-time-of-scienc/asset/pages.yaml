  merge: -1
  pgno: 180
- img_proc: true
  md: 'Our lives are not statistically significant; their significance lies in particular
    encounters and experiences, in all the ways in which we are not interchangeable,
    and these are precisely the parts of ourselves that go missing from the phantom
    conjured by the genetic counsellor. We matter because we matter to each other.
    You are the fruit of all the relationships that constitute and arise from what
    makes you who you are.


    Looking along these webs of relationship, most of us can count our grandparents
    on the fingers of one hand. If Grandma is still around, we know without needing
    to consult a risk profile that there is a non-trivial chance she won''t be with
    us in a year from now. We''ll mourn her death; it will mark a deep change in our
    lives and the lives of those who loved her. But if, across the landscape of a
    society, there are twice as many families caring for dying elders and mourning
    their passing compared to the winter before, this hardly impinge on anyone''s
    awareness, except for the priest and the gravedigger.


    This is how a wave of mortality can pass through almost unnoticed – or could until
    quite recently. We are coming to what has changed and what these changes mean
    about the world we''re headed into, but let me underline what I have been saying
    in this chapter. Life is not a statistical experience; it is inherently anecdotal.
    This is not an illusion or an error in our perception. The patterns that can be
    traced when lives are reduced to statistics do not reveal an underlying truth,
    deeper and more trustworthy than the evidence of our own experience. These patterns
    are the footprints left on a beach across which we have walked. Read with care,
    we have things to tell us; but they are silent about almost everything that mattered
    about the day we spent together on that beach.'
