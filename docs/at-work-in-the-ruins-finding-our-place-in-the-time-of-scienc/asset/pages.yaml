  md: 'This is true of the yellow vests poured into Paris from la France pépérique
    – the France of the edges – one Saturday in November 2018 as it is of the Extinction
    Rebellion protesters who, by a strange chance, brought London to a standstill
    for the first time that same day. The coincidence was uncanny: the fluorescent
    fabrics of the protesters, the tactics of bringing traffic to a halt, even the
    demand for citizens assemblies that emerged on both sides of the Channel. Of course,
    it was easy to paint these movements as mirror opposites: the good protesters
    and the bad protesters, one demanding action on climate change and the other protesting
    a green tax on petrol. But where these movements meet, there are clues as to what
    the politics of the small path might look like, as well as warnings.


    ‘A lot depends on whether people feel that the promises were broken,’ Vanessa
    told me, ‘or whether they saw these were false promises all along.’ We were walking
    through the streets of Paris on the third Saturday of the yellow vests protest
    and it stirred memories for her of similar protests in Brazil fed into among the
    rise of Jair Bolsonaro. How much of today’s politics, around the world, is shaped
    by the d recognition that the ship of modernity – sailing under the flags of development
    and progress – is going down? If the promises of modernity were broken, then we
    look for who to blame and how to take revenge. A lot depends, then, on the recognition
    that those promises could never have been kept, that they were not only unrealistic
    but harmful. For only with this recognition is there a chance of working out what
    remains, what might be done, starting from the ruins in which we find ourselves.


    I’ve walked into a lot of rooms, over the past fifteen years, and started off
    talking about climate change, we often ended up talking about something else:
    the question of what might be worth doing in a time of endings. What is the work
    that makes sense among Most likely, it isn’t the work'
