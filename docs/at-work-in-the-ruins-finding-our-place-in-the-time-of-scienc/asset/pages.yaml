  md: '# Praise for At Work in the Ruins


    ‘Drawing on decades of experience in climate journalism and activism, Dougald
    Hines’s At Work in the Ruins is one of the most perceptive and thought-provoking
    books yet written about the multiple intersecting crises that are now upending
    our once-familiar world. Of particular importance is Hines’ deeply respectful
    yet unsparing analysis of the strengths and limitations of science in reckoning
    with these crises. At Work in the Ruins is essential reading for these turbulent
    times.’


    AMITAV GHOSH, author of The Great Derangement


    ‘In this age of confusion and corruption, Dougald Hines has always had a great
    gift for asking the right questions. He makes a stab at some answers, too – and,
    more bravely, identifies the places where “answers” are not available and the
    real work is rebooting our entire way of seeing. There are far too many books
    about climate change around, but this book is about something unsettling: our
    response to climate change reveals about us – and what we can’t do about what
    we can. You are certain to come away rethinking some of your own assumptions.’


    PAUL KINGSNORTH, author of Confessions of a Recovering Environmentalist


    ‘Dougald Hines’ book At Work in the Ruins is a deep reflection on the foundations
    of the destructive humanity has been pushed upon, driven by colonialism, modernity
    and fossil fuel addiction, by its love for centralization, control, consumerism,
    certainty. By stopping to talk about climate change and the other problems we
    face, Dougald invites us to make deeper shifts by making a turn in our hearts
    and minds, seeking smaller paths, paths to be discovered and walked along by individuals
    and communities, paths of diversity and decentralization. And trust uncertainty.’'
  merge: -1
  pgno: 2
- img_proc: true
  md: '# VANDANA SHIVA, author of Terra Viva


    ‘In this sonorous swoosh of earnest prose composed with the cadence of a fugitive
    journalist who has a news story that should end all other stories – as well as
    the unmistakable lilt of an elder who would have sat at the edge of my Nigerian
    village – Douglas Hine ushers into the Gordian knots of our strange times where
    “following the science”, “solving the climate challenge” and “saving the world”
    no longer hold much cartographical promise. Ironically, telling this way about
    a phenomenon that calls into question humanity’s claims to sovereignty is how
    the modern machine keeps reproducing the fires we want to extinguish.


    ‘Let Doug’s masterful storytelling mark you; let his song of loss and longing,
    his call to fugitivity, dispossess you of your steady gait and poise. Perhaps
    then we, collectively infected, might together witness the incomprehensible.’


    # BAYO AKOMOLAFE, author of These Wilds Beyond Our Fences


    ‘I love reading H’s writing. Here is a work that began with a feeling that was
    sensed before it was thought. The result is a book of rare originality and depth
    – profound, far-reaching, mind-altering stuff.’


    # HELEN JUKES, author of A Honeybee Heart Has Five Openings


    ‘There is great storytelling woven within Douglas’s timely and sometimes-disturbing
    book. Hine addresses the blessings and chaos of this moment without ever moving
    into relentless naysaying or vapid optimism, which makes it hugely refreshing.
    He seeks a third, truer position. A bigger one. At Work in the Ruins carries the
    weight of many years at the front line of thinking around climate emergency. This
    isn’t a weary, trotted-out mandate; it wonderfully tugs at what we think know
    and points towards what we may not.’


    # MARTIN SHAW, author of Courting the Wild Twin'
