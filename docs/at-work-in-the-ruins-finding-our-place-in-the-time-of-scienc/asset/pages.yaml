  md: 'that it may help us to recognise that our different commitments are not at
    odds, that we may be occupying different positions along a winding front without
    needing a plan around which to unite.


    It’s very strange, where you come from,’ says Martín Prechtel. ‘It seems to me
    that where you come from, everybody wakes up every day expecting to live.’


    I found these remarks in Stephen Jenkinson’s book Die Wise, where he wonders over
    what Prechtel is getting at. How might one wake up? It could sound as though those
    who don''t wake up with this expectation ‘have been robbed of it by the fatalism
    of their religion or the squalor of their daily life or the resignation to a basic
    misery of their high infant mortality rate, or the like’. But this would be a
    misunderstanding, Jenkinson suggests, and one cuts to the strangeness of our ways
    of living. The alternative is not that you wake up expecting to die, it is that
    you might wake up with a sense of your life as gift, ‘something good’ – not an
    entitlement or a reward for living right, but a source of wonder and an occasion
    for gratitude.


    When we come from, there has been no end of expectations. So much was crushed
    under their weight. We are still trying to take them with us, but they are more
    than we can bear. The kind of hope worth having now is the kind that lies on the
    far side of expectations, on the far side of despair.


    When I hear someone say, ‘Ours is the last generation that can make the difference!’,
    I understand where this comes from. I say things like this myself. But something
    in this way of speaking came to trouble me. To put the weight of the future on
    the shoulders of us who happen to be around just now can be paralysing, the weight
    unbearable. And then, again, in making it all us now, such statements feed a smuggled
    desire to be at the centre of the story. There’s a dark hubris lurking below the
    surface of this language.'
