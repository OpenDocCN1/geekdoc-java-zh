  md: 'you were doing before the earthquake hit. Out of those conversations, I began
    to put together a list. It''s an unfinished list, one that can no doubt be extended
    or improved on, but here it is.


    The first kind of work that makes sense is to salvage the good that may be taken
    with us from the ruins of the world that is ending. Among the tangled legacies
    of modernity, there are gifts that we would not gladly leave behind, so this is
    the attempt to bring with what we are able to carry.


    The second kind of work is to mourn the good that cannot be taken with us. There
    is no need to settle where the boundary lines between what is saved and what is
    to be mourned; you may answer that question differently to me and only time will
    tell us what was right, but this still leaves us with work to do in the meanwhile.
    Part of the work of mourning is to tell the stories of the good things that couldn''t
    be saved, for those stories can be taken with us and they may turn out to be saved.


    The third kind of work involves discernment: notice the things within our ways
    of living that never as good as we told ourselves were and the chance we are given
    to walk away from these. It is the strange gift of a time of endings to bring
    into view the gap between the things we are trying to do and the ways we went
    about them around here lately. Make use of this gift.


    The fourth kind of work is to look for the dropped threads, the moments earlier
    in the story that have something to tell us. Way of life that ending had a beginning,
    and other ways were ending in that moment or being pushed to the edges. So look
    for the skills or practices or knowledges that have been marked as extinct and
    obsolete, for some of these may yet make all the difference. There is no going
    back – but there are dropped threads that can be woven into the onward story.


    None of us should devote ourselves to all these kinds of task, nor do they exhaust
    the work that is called for. There is more to say about the work of resistance,
    for one thing. Part of the point of such a list is'
  merge: -1
