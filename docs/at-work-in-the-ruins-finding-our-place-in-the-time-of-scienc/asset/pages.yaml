  md: 'seeking to draw, and I know on which side of that line I stand. Moreover, Holmgren’s
    description brought into relief the relationship between the politics of the pandemic
    and the pattern I saw in conversations about the climate. Here, too, there was
    a widening gulf between two different understandings of what we are talking about
    when we talk climate change, and the increasing certainty of a particular approach;
    the same logic that foreclosed debate on the pandemic response would increasingly
    govern the response to the climate crisis and a similar asymmetry would emerge
    between those to whom this logic seemed beyond question and anyone else.


    What I think I can see is a fork in the road, beyond which lie two quite different
    paths: one big, the small and branching. The big path leads to the default future,
    the fish-tank towards which the logic of modernity always pointed. All the words
    we have been using, for half a century or more, to talk about the trouble we are
    in and what is called for, now flash up on the bright lit sign that points onward
    this path: ‘sustainability’ is there, ‘justice’, and the old language of the ‘commons’,
    and ‘taking climate change seriously’. This is where those words now point. The
    other path is unpaved, hardly a path at all, and it will be made by those who
    walk it.


    In as much as it opens divides like the one we have seen in the world of permaculture,
