  md: 'In a conversation filmed towards the end of his life, John Berger offered a
    picture of the world in which we find ourselves:


    What we have been living in the last twenty-five years is the beginning of a new
    dark age... In an illuminated age, although nothing is certain, there is a...sense
    of direction to the future and a kind of path – more than a path, a kind of a
    Roman road, if not an autoute...! In a dark age, there is no such road. There
    are only paths. Paths that have to be discovered and walked along by individuals,
    by groups of individuals, by groups coming together.


    It was the same image that Paul and I landed on, five years earlier, in the closing
    lines of our manifesto: ‘The end of the world as we know it is not the end of
    the world, full stop. Together, we will find the beyond hope, the paths that lead
    into the unknown world that lies ahead.


    I could fill a book with clues, places to start looking for these paths, yet no
    suggestion I make is likely to satisfy those looking for a plan for a highway.
    If the big path is paved by the planners, the converse of this is the absolute
    pessimism that tends to overcome these people when let themselves consider the
    possibility that no plan will get out of the trouble we are in. I’ve seen this
    in the eyes of staff at international institutions, heard it in the voices of
    executives, and I want to tell them that they are right to be afraid, but that
    there are also things they do not know about the world because of the systems
    they have spent their lives working within. Certainly, but also sources of resilience
    that lie beyond the horizon of their experience.


    You can catch that tone of institutional pessimism at times in Jem Bendell’s Deep
    Adaptation writings. In a post ‘Notes on Hunger and Collapse’, he lists a series
