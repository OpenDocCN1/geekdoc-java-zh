  md: '# FOURTEEN


    # Here Come

    the Grown-ups


    As the virus began to spread around the world, something was already changing
    in the public conversation about climate change. If you want to point to an event
    that marks the pivot, it was the election of Joe Biden, who had promised to return
    the United States to the Paris Agreement. ‘The grown-ups are back in charge in
    Washington,’ declared an editorial in the Financial Times as Biden’s transition
    team started work. For four years, the highest office in American politics had
    been held by an elderly man whose behaviour often resembled that of an overgrown
    toddler; yet this was a time in which moral authority seemed to lie with activists
    not yet enough to vote. The return of the grown-ups spelt a shift in the balance
    of power along more than one axis.


    The single most powerful voice in the climate movements that emerged during the
    pre-COVID years belonged to Greta Thunberg, who ended the decade on cover of Time
    magazine as her youngest ever ‘Person of the Year’. Inspired by her example, school
    strikers around the world gave governments either a foretaste of the judgement
    of history. Their protests showed today’s politicians how their actions would
    be seen by the generations coming after; the politicians either pretended not
    to notice what they were being shown, while asking for selfies with the protesters,
    or they lost their temperers. The Australian prime minister Scott Morrison rebuked
    striking students and told them to get back to class. In Belgium, a climate'
