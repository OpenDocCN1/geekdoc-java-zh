  md: '# FIFTEEN


    # Shades of Denial


    It was the autumn of 2018, two months after Greta Thunberg began her school strike
    and a fortnight before Extinction Rebellion first appeared on the streets of London.
    I was passing through Brussels on my way to England. A message came through on
    Facebook from someone I’d never met and we found each other in a café near the
    Eurostar terminal at Gare Midi.


    My new contact worked for an organisation close to the European institutions and
    had just completed a report on the future of shipping.


    > “To make the numbers work, I had to assume that, by 2030, half of Europe’s entire
    electricity supply will be used to produce the synthetic fuels to keep the container
    ships coming from China.”


    In offices across this city, reports were being written that made similar assumptions
    for other industries. Think of the projected electricity supply as a budget: this
    budget was spent many times over to explain how goals for decarbonising the European
    economy could be met without questioning the assumption of continued economic
    growth. In order, that is, to allow the report writers’ bosses to go on avoiding
    that question.


    We sat there with our cappuccinos, pondering this state of affairs. How do you
    break the silence, we asked each other, without becoming someone no one listens
    to?


    Thunberg offers a simple test for whether the grown-ups have really started to
    take climate change seriously: have the emissions started to fall? So long'
