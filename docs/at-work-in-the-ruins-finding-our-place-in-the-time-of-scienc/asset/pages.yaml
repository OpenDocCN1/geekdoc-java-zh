  md: 'There was, she adds, a third response, less common than the others, she calls
    ‘the path of engaged surrender’: ‘These were the people that accepted that they
    could not control all the variables or the outcome, and yet understood that by
    staying present to the process, they had a choice in how to experience it.’


    Clearly, these responses map onto the reactions people had to the pandemic, and
    this is why Berndt is writing about them. They also call to mind the ‘five stages
    of grief’ described by the Swiss-American psychiatrist Elisabeth Kübler-Ross,
    based on her study of patients with terminal diagnoses at the University of Chicago’s
    medical school in the 1960s.4 The first stage in the model is denial, followed
    by anger, bargaining, depression and acceptance. The idea that these stages mark
    a linear process grieving people pass through was later disavowed by Kübler-Ross
    herself but they offer a resonant set of terms to name some of the patterns that
    show up when we are thrown into an encounter with mortality.


    Throughout the Covid time, it seemed that the logic of bargaining shaped the dominant
    narrative. Back at the start, the story was about ‘flattening the curve’ and the
    lockdowns were going to a fortnight. If this never made much sense to me, it’s
    because the Swedish authorities were already saying they would only bring restrictions
    that could be sustained for a year or more. The pattern repeated itself, as one
    of promises about when it would all be over gave way to the next.


    When the vaccines came, I took myself to the public hall in a neighbouring centre
    that had been put to use as a vaccination centre. I’ve experienced has given me
