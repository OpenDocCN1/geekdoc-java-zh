  md: 'In the past five years, the climate crisis has become central to the way the
    people who go to Davos talk about the world situation and I suspect this will
    prove more than a passing phase. There is always a competition for headlines,
    waves of attention rise and fall, but the tide is coming in. The growing awareness
    and alarm over climate change among the general public, and the ongoing impact
    of extreme events that bring it close to home, mean that it will take a more prominent
    place in the politics of the 2020s than in previous decades.


    Even when seemingly unrelated events blow up and consume the oxygen of attention,
    the lines of cause and effect lead back a tightening knot of systemic crisis with
    climate change at its core. So a war breaks out in Ukraine and Europe has to face
    its dependence on Russian hydrocarbons, while the strain on supply chains is felt
    anywhere within reach of the industrial food system.


    Meanwhile, in industry after industry, business leaders scramble to show that
    they are taking climate change seriously. Here in Sweden, even McDonald’s runs
    adverts telling us it’s ‘Big Enough to Make a Difference’, hyping its ‘flexitarian’
    menus and charge points for electric cars.


    But what it means to take climate change seriously is framed in terms that fit
    the worldview of the tech billionaires and investment managers and the rest of
    the ‘adults in the room’. Either this will fill the politics of the Green New
    Deal or else the space between the two will form the axis of a political debate
    founded on shared assumptions about the nature of the trouble we are in. Either
    way, those of us who do not share these assumptions and are troubled by the direction
    in which they lead will find increasingly difficult to make ourselves understood.'
