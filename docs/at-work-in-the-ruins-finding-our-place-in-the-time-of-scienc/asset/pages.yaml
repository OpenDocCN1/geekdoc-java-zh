- img_proc: true
  md: 'that goes back to Plato between two different kinds of quantitative question.
    The first is the kind that can be answered with a number, the second is the question
    of ‘too much’ or ‘too little’. By definition, ‘too much’ and ‘too little’ are
    quantities, but they’re not numerically measurable.’ Both kinds of question are
    reasonable, but science can only answer the first kind.


    In order to answer the second kind of question, in order to treat it as capable
    of being answered reasonably, we need something like what European philosophers
    once spoke of ‘common sense’. This goes beyond the everyday meaning the term has.
    In the older understanding of the term, the sensus communis refers to a faculty
    we each have, the faculty by which we put together the experience of our senses
    and for judgements about the world. It is what allows us to recognise when a threshold
    is being crossed; when we have entered the territory of ‘too much’ or ‘too little’.
    Those fishermen in Newfoundland who wrote to the newspapers in the 1850s to sound
    the alarm about the new methods being introduced to increase the taste of cod
    were exercising their common sense.


    The faculty of common sense does not belong within the scientific worldview. This
    is not because science has disapproved its existence because the philosophical
    assumptions woven into this worldview do not allow for it. As I listen to Saraj,
    it occurs to me that the consequence of this philosophical move was to make science
    the fall guy of modernity. Promising that we can know the world as never before,
    science goes on measuring, counting and calculating. It constructs models and
    projections with degrees of certainty attached but it is constitutionally unable
    to tell us when to stop, and its singular authority muffles the other voices that
    might do so. Given time enough and funding, science can know many things; yet
    it cannot say, because it does not know, when enough is enough.


    The campfire is burning low now and some of our companions are already asleep.
    Many stories have been told. They do not all point in the same'
