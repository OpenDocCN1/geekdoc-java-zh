  md: 'The scenes of poverty and exploitation that come to mind when someone speaks
    of Dickensian England are examples of the wreckage, though more and worse lay
    at the far end of the colonial supply chains this first age of free-market globalisation
    was wrapping around the world. It was in response to the unfolding wreckage, Polanyi
    tells us, that a countermovement arose. Yet this was not the unified, class-based
    eruption of political consciousness imagined by the Marxists. Rather, this second
    movement was a messy patchwork of responses to ‘the degradation of existence’,
    improvised out of necessity by people coming from quite different political, religious
    or social starting points, as institutions created from below – friendly societies,
    cooperatives, trades unions, temperance penny libraries in the upper rooms of
    pubs – laid the ground for later social reforms.


