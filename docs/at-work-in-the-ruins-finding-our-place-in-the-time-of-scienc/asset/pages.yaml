  md: '# First There Must Be an End


    It seems like it''s growing all my adult life, this sense of living at the end
    of the world as we know it. For a long time, it was a rumour, a story mostly told
    in what got left unsaid. It was real enough in lots of people''s lives, but if
    you tried to talk about it in the places where the people who shape public opinion
    meet – in the TV newsrooms and the think-tank seminars, in the offices of government
    ministers or around the dining tables of dotcom millionaires – you would get strange
    and awkward laughter, a swift change of subject or a suggestion that you ought
    to get some perspective. I know this because my life in the early years of this
    century took me those places. Not often enough to get comfortable – that was never
    what I was looking for – but often enough that the opportunity arose, and I sometimes
    took it, to talk about what I thought I could see coming.


    By 2010, there were surveys from across the Western countries showing those who
    still believed today''s young people would have a better life than their parents
    were outnumbered, two-, three- or four-to-one, by those who thought they were
    going to have it harder. The basic promise of progress had broken down in the
    everyday experience of ordinary people in the societies that were meant to serve
    as a model of where everyone on the planet was headed.


    I saw such findings dismissed by journalists with smug lines about how the slow
    miracle of economic growth rolls onwards, whatever the ups and downs of the cycle,
    to touch the lives of most of us sooner or later. Their complacency lasted until
    the middle of the decade, when it was replaced – almost overnight – by panic at
    a series of unpredictable political eruptions. For those still sold on the big
    story of progress and sheltered from how'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'things were going for many of their fellow citizens, the Brexit vote and the
    election of Donald Trump felt like the end of the world.


    Meanwhile, in the last years of that decade, a new wave of awareness and activism
    around climate change broke into view. These movements didn’t talk about the climate
    crisis as a future threat, a problem that could be fixed and made to go away.
    They were shaped by a sharpening awareness of a crisis that is already here, a
    tide of chaos reaching the lives of more and more of us, an unfolding reality
    that will change all our lives.


    The shadow thrown by the climate crisis is long, and it will be at the heart of
    the story I have to tell. Even as I write, they keep on coming, these ruptures
    in the fabric of the world we thought we knew. Working on this book in Europe,
    in the spring of 2022, I’ve watched the shock of the war in Ukraine flash around
    the world. For millions of Ukrainians, the known world was ripped apart in a matter
    of days. For others, in Europe and beyond, the return of international conflict
    to this continent tears a fresh hole in the roughly stitched patchwork of assumptions
    that we mostly take for how things are. Ahead of us lies the greater shock of
    an energy crisis that will reveal the realities of dependence and helplessness
    cushioned ourselves against comforting visions of progress and development.


    So many ways in which a world ends, but in the middle of all these is the largest
    rupture we have yet experienced: the hole in the fabric of reality made by the
    Covid-19 virus and the decisions taken by governments as it spread around the
    world in the spring of 2020. This book was born out of the Covid times, so this
    is where the story needs to start.


    In the early weeks, there were memes that played on our expectations as to how
    the world ends: a still from Mad Max or The Road set against the hoarding of toilet
    roll and the tedium of lockdown. As apocalyapses go, the internet felt, this one
    was underwhelming.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'Yet the word ‘apocalypse’ starts out meaning something else: a moment of revelation,
    the point at which hidden things are brought into the light. In that sense, we
    have surely been living in apocalyptic times. The Covid-19 virus – and the reactions
    to it, both cultural and political – revealed and radicalised existing tendencies
    and tensions within our societies. It brought into view the gaps between the kind
    of world in which we find ourselves and the stories that we like to tell about
    it. It made it possible to see things we could only half make out before.


    What gets revealed depends on where you’re standing, though. This book is an account
    of the Covid years unsettled my assumptions, as someone who has spent much of
    his adult life talking to people about the trouble around and ahead of us, not
    least the trouble that rides under the name of climate change. I’ve had no cause
    to question the part of the story of climate change what science is able to tell
    us. In that sense, I remain convinced that humankind is in deep trouble. But what
    became clear to me, these past three years, is that the way we talk about this
    is making everything worse. mobilisation of fear and the language of emergency,
    the elevation of science into an article of faith and an overriding source of
    political authority – even when the intentions are good, even when the sense of
    urgency is sincere and well-founded, these moves push forward the project of making
    this living planet and its inhabitants into an object of technological management
    and control. For those of us who want part in that project, yet who remain convinced
    of the depth of the trouble that climate change represents, there is a need to
    find other ways of talking and other moves worth taking.


    What gets revealed depends on where you’re standing, and Sweden has been a strange
    place to call home in these years, especially for those of us who were born elsewhere.
    As was widely and sometimes accurately reported, this was the one major Western
    country that didn’t respond to'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'Covid by following the path of lockdown. Life here did change; there were some
    restrictions and more advice. But as the months went by, I felt the gap widen
    between the reality outside my front door and the one that my friends and family
    elsewhere were inhabiting. Our governments made different decisions, and I saw
    the difference these decisions made to the people closest to me. So I''m grateful
    to have lived through these years in a country that didn''t force its population
    to stay home, or encourage an overwhelming sense of fear, or make hellish for
    anyone who hadn''t been vaccinated.


    Yet none of these was obvious in the early days. What I remember from those first
    days and weeks were the conversations with friends, colleagues and acquaintances
    elsewhere who were deeply worried about the horror-show that Sweden was headed
    for, if its government didn''t cause course fast. I was worried, too, when I looked
    at the projections they sent me. It''s hard to share the confidence in the Swedish
    system felt by those who grew up it for granted. That was true of life as an immigrant
    to Sweden, before the pandemic put us to the test. So, through the early spring
    of 2020, I carried the fear that my friends elsewhere were right. I sat with the
    possibility that the society of which I now a part was weeks away from collapse
    and there was little I could do about it. I let this teach me something about
    vulnerability and the limits of what I can control.


    Whole books will be written about how Sweden came to take the path it did. Looking
    back now, you can argue over the consequences of that decision and whether the
    Swedish approach worked elsewhere. But what''s clear is the ''horror-show'' we
    were told to expect never came to pass. Nothing even close to it. And to live
    through that was a powerful experience, the kind it''s hard to know how you should
    feel about. It''s an experience that left me cautious about the sudden certainties
    born of the Covid times. I took the vaccine with no particular misgivings; I''ve
    had no cause to regret it and I don''t subscribe to any alternative set of certainties
    about the science of the virus and the illness it causes. But I reserve the'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'right to be less scared than I’m told I should be – and less impressed by the
    latest declarations about what we know and what our governments have to do.


    It has also left me sceptical about the new political maps that have been drawn
    around the pandemic. Sweden’s decision not to go into lockdown was overseen by
    a government made up of Social Democrats and Greens. The only party here arguing
    for tougher measures was the farright Sweden Democrats. So the way the lines have
    been drawn up in the wider political debates over Covid seems less obvious where
    I’m standing.


    The old maps will fail us. They are less and less help in making sense of where
    we find ourselves and where might be worth heading. This was true before the pandemic
    and has only become clearer in these years. It goes with the territory of living
    through the ending of a world. All I say, don’t be too quick to adopt the new
    maps that are offered when the ground is still moving under our feet. Stay puzzled
    by what has been revealed, take time to find your bearings and carry whatever
    claims you are offered around for a while to test them against your own experience
    and see which ones you can steer by.


    Here are two claims I have found that I can steer by.


    The first comes from the closing lines of a manifesto that a friend and I wrote,
    nearly fifteen years ago now: *The end of the world as we know it is not the end
    of the world, full stop.* Unless we inhabit that distinction, we will end defending
    the world as we have known it at all costs, no matter how monstrous those costs
    turn out to be. Think of the desperate schemes for geoengineering already being
    drawn up. Think of the walls built to defend against those already displaced by
    changing patterns of sea, rain and heat. How we name what is at stake will determine
    what we are prepared to do.'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'The second claim came out of the conversation started by that manifesto:

    The end of the world as we know it is also the end of a way of knowing the world.
    When a world ends, its systems and stories come apart, even the largest of them:
    the stories promised to explain everything, the systems organised all that could
    be said to be real. It''s not that those stories had no truth in them; it''s not
    that there was no reality in the description of the world those systems offered.
    It''s that they couldn''t hold. The things they valued betrayed them; the things
    they left out came back to haunt them.


    One name for the world as we have known it is modernity ; one name for its way
    of knowing the world is science. So this is also a book about navigating the end-times
    of modernity and what happens to science as its world ends.


    Here''s one more story from the Covid spring. I remember this post like a message
    in a bottle, thrown into the storm of social media, back in those first weeks.
    It was lost in the tide of memes and takes, I don''t know how to find it, but
    the author was a climate scientist. Already the lines were drawn and there was
    a take going round that like this: ‘Has anyone noticed how the people refusing
    to follow the Covid science are the same ones who refuse to accept the climate
    science?’ Hang on a minute, climate scientist said, it''s taken decades of careful
    work to be able to say with confidence the things that my colleagues and I can
    tell you about climate change. Please don''t treat that as equivalent to what
    it''s possible to say about a virus that only identified a few weeks ago.


    The iterative nature of the work of science means that the state of knowledge
    will vary from field to field. With a new object of study, it''s hardly surprising
    if the researchers think they know out to change from week to week, in contrast
    to the well-grounded consensus that can emerge in a mature field. But the political
    rhetoric of ‘following the science’ disregards these differences, casting a singular
    authority over'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'whatever is said in the name of science, so that the first provisional findings
    about a new disease are presented as though they were established certainties.


    Science in general – and climate science in particular – is not well served by
    this ideological conflation. Yet, as we shall see, this is a problem that runs
    deep because of the multitude of methods and practices that make up the work of
    science have been entangled for centuries with a singular story that grants this
    way of approaching the world a monopoly on telling what is real. It places a burden
    on the scientists’ shoulders that was always going to prove unsurviable, but we
    are living through an intensification of this logic that will push it to breaking
    point.


    One of the questions running through this book is how far, and in what shape,
    the work of science might survive the end of the world in which the story of science
    took shape. I might well say now that I don’t have an answer; it’s not the kind
    of question that can be answered with a book, but what a book can do is make an
    invitation to the kinds of conversations and encounters that might be called for,
    that might help us find some paths into the unknown world that lies ahead.


    > In these times, all we can do is a sign,’ a father tells his daughter in Ben
    Okri’s novel The Freedom Artist. ‘We have to help bring about the end of the world.’
    We must do this, he goes on, so that a new beginning can come. ‘But first there
    must be an end.’¹1


    It matters whatever world we think is ending, and it matters we tell each other
    is worth doing in such a time. Among the people we''ll meet in the story I tell
    in the pages ahead are those who have dedicated their lives to the study of climate
    science, those taking desperate measures as activists to break the trance they
    see around and those inside existing institutions who have been shaken to the
    core by what we know and what we have good grounds to fear about the trouble in
    which we find ourselves. There can be a'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'danger in allowing trouble to be defined solely in terms of climate change,
    but I''m convinced of the importance of each of these roles in these times. I''m
    also convinced that other roles need playing and other kinds of action are called
    for. There''s a lot to be unfolded along the way, but let''s have some leads to
    get started, taken from a few of those who have helped shape my thinking.


    First there must be an end – but many kinds of end are possible. My friend Vanessa
    Machado of Oliveira wrote a book called Hospicing Modernity² invites us to a kind
    of work in which the focus is not on saving modernity, or bringing it down, or
    rushing to build what comes afterwards, doing what we can give it a good ending.
    To let it hand on its gifts and teach the lessons that may only become apparent
    as the end approaches.


    > It may seem like this book is trying to kill or destroy modernity by announcing
    its death,’ she writes, but this is ‘something no book can do.’ It’s a warning
    that applies here, to.


    No one I''ve met has to offer by tools for the work of opposing, but the way Vanessa
    tells it, this must be accompanied by a work of midwifery: assisting with the
    birth of something new, unfamiliar and possibly (but not necessarily) wiser, and
    avoiding suffocating this new world with our projections.


    The philosopher Federico Campagna speaks about living at the end of a world³ In
    such a time, he suggests, the work is no longer to concern ourselves with making
    sense according to the logic of the world that is ending, but to leave good ruins,
    clues and starting points for those who come after, that they may use in building
    a world that is – as Vanessa say – ‘presently unimaginable’.


    They may be here already, the builders of that world. Some of them have been here
    all along, inhabiting the ruins made by the world of the powerful. The anthropologist
    Anna Lowenhaupt Tsing wrote a book called'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'The Mushroom at the End of the World: On the Possibility of Life in Capitalist
    Ruins.⁴ That could be a role to take in times like these, to go looking for possibilities
    of life among the ruins around and ahead of us.


    I don''t write to announce the end of the world or to change the minds of those
    who are convinced that the world as we have known it can be saved or made sustainable.
    I write for anyone who has found themselves, as I have, needing to make sense
    of what is ending, how we can talk about it and what tasks are worth taking on
    in whatever time turns out that we have. Something is coming over the horizon:
    a humbling from which none of us will be spared, that will not be managed or controlled,
    but will leave us changed. Before it is over, I suspect, we will need to learn
    again what it means to take seriously things that are larger or smaller than were
    allowed to be real or significant, according to the scales and systems of modernity.
    We will need to dance again with the rhythms of cosmology, to be carried by the
    kind of stories and images in whose company – as the mythographer Martin Shaw
    would say – a universe becomes a cosmos. We will need to remember that we are
    not alone and never were, that we are part of a world of many worlds, only some
    of which are human. And we will need to rediscover that any world worth living
    for centres not on the vast systems we built to are proportioned to the kind of
    creatures we are, the places where we meet, the acts of friendship and the acts
    of hospitality in which we shelter and kindness to the stranger at the door. In
    this way, even now, there may be time to find our place within the vastly larger
    and older story of which we always were a part.'
  merge: -1
