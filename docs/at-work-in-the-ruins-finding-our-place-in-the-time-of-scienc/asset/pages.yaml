  md: '# TWENTY


    # The Fish Tank


    Fifty years is a meaningful span of time. Just as old measurements were proportioned
    to the human body, the half-century is proportioned to the length of a human life:
    it is the distance between youth and age. You might think this is a recent development.
    After all, life expectancy barely reached half a century anywhere in the world
    around 1900. But headline figures can be misleading and the statistics for life
    expectancy at birth are best understood alongside another: the modal age of death.
    This tells us at what age it was most common to die, for those who had survived
    beyond the age of ten. In England in the 1840s, it stood at 71 for men and 77
    for women.¹ The great achievement of the generations since is to transform the
    likelihood of surviving childhood and most of this is down to public health rather
    than hospital treatment, which is why transformation spreads beyond the reach
    of high-tech medicine. Infant mortality has fallen remarkably in a handful of
    generations but the distance between youth and age has not changed that much since
    the psalmist wrote ‘the days of our years are three score and ten’, or four score
    ‘by reason of strength’. So it is an old truth that the golden anniversary of
    any event will be the last time that a significant part of those were young adults
    when that event took place are around to remember and reflect on what it meant.


    The period in which the virus reshaped all our lives happened to coincide with
    a sequence of these anniversaries. In April 2020, it was fifty years since the
    first Earth Day, when environmental demonstrations took place across the United
    States. September 2021 marked half a century since the'
