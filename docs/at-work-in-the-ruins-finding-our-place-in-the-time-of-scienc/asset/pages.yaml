  md: 'the pandemic to the climate crisis, but also the populist movements of the
    past decade.


    I think once more of the anthropologists Mario Blaser and Marisol de la Cadena,
    and what they recognise in the buzz surrounding the Anthropocene, the new geological
    epoch which names the damning recognition of our planetary situation. All this
    Anthropocene talk sounds a lot like the discovery by ‘the world of the powerful’
    of ‘the plausibility of its own destruction’. Having decreed the ending of so
    many other worlds on the way to the future, ‘in the name of the common goods of
    progress, civilization, development, and liberal inclusion’, suddenly appears
    that our world too could end.


    Two possibilities arise from this newfound sense of vulnerability. It can be a
    humbling moment in which, has brought down to earth, we are able to hear at last
    what those on the receiving end of Western projects of colonisation, salvation,
    modernisation and development have been trying to tell us for generations. Or
    it can be the licence for the grandest version of that project yet: an attempt
    to turn our planetary home and all those we share with, our human kin and our
    more-than-human kth, into an object of global management and control, and all
    in the name of ‘saving the world’.


    Clearly, our societies were already inclined towards the second of these possibilities
    but the supercharging of the language of ‘the science’ in the politics of the
    early 2020s makes it increasingly difficult to question the path down which we
    are accelerating. So does the turn that has been taking place in the narrative
    around climate change.'
