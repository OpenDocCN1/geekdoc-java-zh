    Spend any time with the work of those who study it and modernity emerges as an
    altogether messier and more questionable proposition than the econometricists
    suggest. The foundations of economodism lie in an approach to the world that projects
    a simple narrative onto impressive statistics, without looking at the processes
    in which the lives behind the statistics are entangled. As we will see in later
    chapters, it''s not that there''s no truth in the story told by Pinker or Rosling,
    it''s that too much has been left out in order to make this story work. Not least,
    the judgements hidden behind the data visualisations.


    To point out that it is not to suggest that we ought to go back to any pre-existing
    state of affairs – as if that were an option – but to ask that we start from where
    we are, willing to listen to the experience and insights of all our contemporaries,
    rather than using the lives of others as props to demonstrate the inevitability,
    desirability and virtue of the ways that some of us have been around here lately.
    If modernity cannot deliver on its promises – for reasons involving, but not reducible
    to, the encounter with limits that climate change represents – then the work that
    lies ahead looks less like sustaining modern lifestyles at all costs and more
    like salvaging what we can fare from these ways of living, learning from the many
    other ways that humans have made work in the long history of our species.


    To suggest that we explore such paths into the future will be dismissed as naive,
    childish or worse by those devoted to the tenets of economodism. No doubt it pushes
    at the limits of the plausible. Yet so does the future Gates envisages, built
    on a shopping list of yet-to-be-invented technologies. There are no sure bets
    for the times ahead of us; all we have long shots. The question is which set of
    miracles we are willing to work for, and what kind of world those miracles would
    bring about.'
