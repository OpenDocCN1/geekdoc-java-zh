  md: 'parliament: the image of this young woman in a yellow raincoat, sitting on
    the street, a handmade sign propped up beside her, spoke of a generation begging
    for a future. In London that autumn, Extinction Rebellion protesters dropped banners
    that just read: ‘Climate Change – We''re Fucked’. It was all a long way from the
    last wave of climate awareness, a decade earlier, when you had Al Gore with his
    PowerPoint and his after-dinner patter, guiding you to a viewing platform a quarter
    of a mile from the edge of the abyss, explaining the seriousness of the situation,
    then walking you safely back down with a list of ten things we could all do to
    make the horror away. The voices of the new climate movements belonged to people
    who were clearly hanging out there, over the abyss. They had no comforting message
    to send you home with. That was what made them powerful.


    Ten years after we published the manifesto, I spent the spring of 2019 travelling
    around Europe, speaking in universities and community gardens and at the European
    Commission. Back in England, with the momentum of Extinction Rebellion at its
    peak, I sat in a Cotswolds pub with Gailbrook, as she spoke eagerly of plans for
    what they would do. In these new movements, there was an approach to the climate
    crisis that lay far closer to what I had tried to talk about over the years. Yet,
    even before the virus blew in and swept the protesters off the streets, something
    had begun to trouble me. It wasn''t were, sometimes failed, critiqued. Rather,
    I had a sense of a larger pattern that I couldn’t yet bring into focus. And then,
    one afternoon in the second year of the pandemic, at the end of another week which
    had been punctuated by familiar conversations with researchers and journalists,
    I saw clearly and realised that I had nothing left to say. Or almost nothing,
    since, after fifteen years, I would need to offer an explanation as to why I was
    no longer talking to people about climate change.'
