  md: 'Start with the partisans of science and reason, things which – almost by definition
    – stand apart from matters of feeling. A neurobiologist may introduce us to the
    chemical substrate of our emotional experience, illuminating as such explanations
    are, no one acts as if her own life can be reduced to this layer of material causality.


    Now, notice how the sober set of nouns which define the first worldview are made
    strange by the choice of verb: these people are not simple (or perhaps at all)
    the practitioners of science and reason and technology, they are the ones who
    believe in these things, who have elevated them to the status of objects of faith.


    Turn to the others, the Viewworld B team, the ones who feel the fear and sense
    the threat. I want to say – is this not an appropriate response to our predicament?
    This is not how you feel when you read an article by David Wallace-Wells? You
    might then want to move through the fear, to find courage, but you don’t get there
    by mocking the fearful or treating fear as if it were a mistake.


    And if there’s some truth in the simple schema according to those who are fearful
    of the future are also ‘the ones who don’t believe that climate change is happening’,
    then this paradox deserves more than scorn. The poisoned seeds of climate denial
    were planted quite consciously by people who were well paid for their trouble
    on behalf of industries possessed a demonic drive for self-perpetuation and expansion.
    Yet these seeds grow in soil not fertilised by the overspill of a wider culture.
    As we account for the conditions under which such alienation and resentment towards
    science could take root, some share of the responsibility belongs to those who
    bundled up the practice of science, the faculty of reason and the promise of technology
    into a belief system. Their grand story of progress long since ceased to make
    sense of the experience of many people’s lives; their faith-based worldview contributed
    to the conditions in which denial could thrive.'
