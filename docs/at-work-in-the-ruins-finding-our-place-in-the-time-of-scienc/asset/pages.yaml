  md: 'fundamentally transforming the global economy’. Optimism comes in the form
    of a billionaire’s wish list of technologies that don’t exist yet.


    At their most ambitious, politicians will attempt to impose solutions from above
    that shift the market incentives and land most heavily on the people already struggling
    to get by. Then, when these people yellow vests and block the roundabout, this
    will be taken as proof that voters are unwilling to support stronger action on
