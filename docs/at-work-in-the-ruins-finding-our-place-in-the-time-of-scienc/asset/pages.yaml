    from Sweden to Norway.


    The conversation came around to climate change and she told me about driving to
    fix her uncle’s cabin. To get there, you take a winter road, the kind that runs
    across a frozen river. The river is always frozen until at least the third week
    in May – you can count on it – but this year they found it thawed, way ahead of
    schedule. There was no getting across. Further north, the same summer, they came
    to a mountain where they had always stored food in the ice of a glacier. Only
    this year, the glacier was gone. In July, the temperature remained at over 30°C
    for three straight weeks as the reindeer huddled, miserable in the heat.


    This is climate change in the present tense. Not a warning about what happens
