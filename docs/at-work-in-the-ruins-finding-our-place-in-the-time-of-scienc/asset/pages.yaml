  md: 'Permaculture is a design philosophy and a loose-knit social movement that originated
    in Australia in the late 1970s. The name comes from the aim of creating a ‘permanent
    agriculture’, a way of growing food and looking after land that does not deplete
    the ecological conditions on which it depends. As it spread around the world,
    its scope expanded to take in all aspects of creating self-sustaining human settlements
    while working with natural systems.


    The permaculture movement was founded by Bill Mollison, who taught environmental
    psychology at the University of Tasmania, and David Holmgren, a graduate student
    at the nearby College of Advanced Education, whom he met in 1974. The pair were
    inspired by Indigenous approaches to use land and sought to bring these together
    with systems thinking, so as to create a portable, universal toolkit for long-term
    sustainability on the scale of households and communities. This was delivered
    through courses that led to a Permaculture Design Certificate, as well as through
    *Permaculture One*, the book that Mollison and Holmgren wrote together.


    There are ambiguities in the project of permaculture. You could think of it as
    an attempt to reinvent the Palestinian hen, starting from within the ways of seeing
    the world bred by the modernised helplessness of such its Israeli cousin. The
    double-edged quality of such an undertaking is nicely summed up by Gordon White,
    the current president of Permaculture Tasmania, in his book *Ani.Mystic: Encounters
    with a Living Cosmos*: ‘Permaculture represents to the absolute limit of what
    you can achieve inside the metaphor of the universe as a machine.’¹


    The usefulness of the permaculture approach is reflected in how widely it has
    taken root around the world and the way its influence has spread steadily over
    the decades, while other movements rose and fell. But now, permaculture was in
    trouble. After forty years, Holmgren wrote, the pandemic had brought this movement
    to the point of rupture for the first'
  merge: -1
