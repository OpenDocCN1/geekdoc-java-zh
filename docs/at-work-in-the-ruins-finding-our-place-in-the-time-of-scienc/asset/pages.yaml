    Bendell’s self-published paper went viral. By the time VICE wrote about it, the
    PDF had been downloaded more than a hundred thousand times. When I met up with
    its author a few months later, that was approaching half a million.

    Bendell is not a climate scientist but to a lay audience his academic status lent
    weight to his words and the paper gave people permission to talk about fears they
    had previously kept to themselves. The response from readers overwhelmed his inbox,
    he set up online forums where they could connect and support each other, and an
    online community began to form around his writings. Meanwhile, from foreign correspondents
    I was hearing the Deep Adaptation paper had shifted the conversation about climate
    change in all kinds of circles. For some, the effect was more dramatic, if the
    VICE News report was to be believed. It included the story of Alison Green, who
    resigned as vice-chancellor of Arden University after reading Bendell’s paper.
    II heading for the hills,’ she was quoted as saying.


