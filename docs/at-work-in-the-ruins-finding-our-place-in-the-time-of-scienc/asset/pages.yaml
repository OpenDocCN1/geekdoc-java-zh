  md: '# SIX


    # Steering by Numbers


    The modern Western environmental movement differed from the other social movements
    that emerged in the second half of the twentieth century in the closeness of its
    involvement with science. Rachel Carson, whose book *Silent Spring* is widely
    acknowledged as the catalyst to the grassroots environmentalism of the 1960s,
    was a marine biologist by training and her professional background helped her
    to piece together the story of the impact of pesticides on ecosystems and humans.
    The figure of the concerned scientist continued to play a strong role in the movement’s
    development, as did the findings of research into the impact of human activities
    on the living world. Yet this was also a movement that questioned worldviews:
    the background maps and stories that shape our perception of the world and our
    sense of what is possible, while mostly passing for just how things are.


    As traced the consequences of industrial production, environmentalism started
    to reopen political questions that had been largely closed off since the mid-nineteenth
    century, when parties of the left and right converged on a framing of the space
    of politics as the organisation and distribution of the outputs of industrial
    society. By drawing attention to its undesired outputs – the scale of ‘negative
    externalities’ – the environmental movement called the core assumptions of industrial
    society into question. Following the trail upstream from the parts of the story
    that science could piece together, it entered the terrain of culture, the groundwork
    of habits and stories that make up a way of life, and it opened a conversation
    about what other ways of living together might be possible.'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'This kind of environmentalism had its heyday in the 1970s, or so I’m told by
    those who are old enough to remember it. My own early political memories coincide
    with the green wave of the late 1980s. I was eight years old the spring the reactor
    at Chernobyl caught fire, sending a plume of radioactive smoke across northern
    Europe. We followed it night by night on the Six O’Clock News. I remember the
    fear, but also the spreading sense of awareness in those few years later.


    By the time I was eleven, it felt as though the winds of history were blowing
    in a hopeful direction. The Green Party came from nowhere to take 15 percent of
    the votes across the UK in the European elections of 1989. Elsewhere, its German
    sister party had already established itself as a parliamentary force. The fall
    of the Iron Curtain felt like part of the same story: change was not just possible,
    it was happening at a speed that no one had predicted.


    In 1987, the Brundtland Report had established ‘sustainable development’ as the
    frame within which the international community talked about the planetary situation:
    a framing which yoked the pursuit of ecological sustainability to the trajectory
    of economic and technological development, without any proof that this pairing
    could pull in the same direction. In hindsight, the five years between its its
    publication and the Rio Earth Summit of 1992 appear as a high tide of international
    concern and intergovernmental action around the environment that remains unsurpassed
    to this day. This was also the moment at which the environmental movement drew
    back from the terrain of culture and established a new relationship with science.
    No longer was the scientific evidence a starting point for a larger questioning
    of society or making political arguments; now the evidence itself was to make
    the case for change, to carry the weight and do the work of politics.


    This turn is not hard to understand: in countries where Green politicians had
    entered parliament, the demands of working within existing institutions'
  merge: -1
  pgno: 69
- img_proc: true
  md: 'drove a certain kind of ‘realism’. Meanwhile, the journey of David Ike from
    BBC sports presenter to Green Party principal speaker to promoter of lizard-related
    conspiracy theories offered a cautionary example of how the attempt to call your
    whole culture into question could unravel.


    The logic was clear enough, too: the scientific evidence for the consequences
    of industrial activity was growing, so why get tangled in arguments over worldviews
    and values? Surely the fairly forward was to bypass that kind of politics, to
    lay out the facts and figures that would prove the necessity of massive societal
    change? It helps that this is the kind of language our society you''re meant to
    speak if you want to get invited to the grown-up policy discussions.


    Yet as an attempt to bypass the frailty, fallibility and slowness of human judgement,
    with the potential for conflict that it brings, belonged to a repeating pattern
    in the history of modern societies. Time and again, the power and cleanness of
    calculative reason seemed to hold out the possibility of leaving behind the clash
    of conflicting stories, but whatever the intentions behind it, this move never
    quite works out.


    For the New Atheists of our time, the scientific revolution that began in Europe
    in the seventeenth century might seem to have heralded the dethronement of God.
    At the time, however, the implications for religion looked rather different. Newton
    had revealed the invisible force of gravity and shown that its operation could
    be described with the tools of mathematics. Among the European scholars absorbing
    this news, the thought arose: what if we could trace the other hidden forces at
    work in the world and follow the chains of cause and effect back to the beginning?
    The possibility they had glimpsed was not to eliminate God but to offer the definitive
    account of His works.


    In its radical form, this project gave rise to deism: the belief in God as the
    Prime Mover, the first cause setting in motion a clockwork universe. As'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'religions go, deism was never going to pack churches or stir revival movements.
    It offers a cold, mechanical vision, stripped of love, sacrifice or the possibility
    of forgiveness. Yet its appeal within intellectual circles was powerful, for after
    two centuries in which religious disputes had provided the fault lines along which
    the princes of Europe had fought a series of exceptionally bloody wars, it seemed
    to offer a foundation for peace.


    As things turned out, the radical currents of deism fed into new political formations
    and revolutionary conflicts. Thomas Paine was an outspoken deist and several of
    the Founding Fathers of the United States were strongly influenced by deist ideas.
    The French Revolution was also an attempt at introducing deism as a state religion,
    in the form of the Cult of the Supreme Being, which this lasted all of three months.


    Beyond the intellectual and political avant-garde, a wider turn was taking place.
    Natural theology, a milder version of the project of explaining the existence
    of God in terms of science, allowed the established church to accommodate its
    doctrine to the latest discoveries. The role of myth and mystery, story, symbol
    and ritual gave way to a ‘reasonable’ Christianity, religion straightened out
    into a set of laws. The result was a structure of belief peculiarly vulnerable
    to the double shock that the natural sciences were about to deliver. The rocks
    given up their secrets of deep time to a culture grounded in the vast cycles of
    Hindu cosmology, had news of the origin of species reached the Ancient Greeks
    with their capricious gods, it is hard to imagine these discoveries triggering
    the kind of crisis of faith that shook the intellectual world of nineteenth-century
    Europe.


    The legacy of this rupture remains with us in the conflict between scientific
    atheism and its mirror opposite, a fundamentalist Christianity in which faith
    is remade in the image of science and equipped with alternative facts. What unites
    these opponents is their commitment to reading the opening of Genesis as though
    it claimed to be a physics and biology textbook. The endpoint of the project of
    applying science to religion, which'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'began with hope of defusing the theological and political conflicts of the
    seventeenth century, was to lay the foundations for what remains among the most
    infected divisions of our own time.


    The labels on the fault lines change from century to century. The ground shifts
    and the contours of conflicting worldviews get redrawn, but the promise of replacing
    the messy exercise of judgement with the cleanliness of calculation comes back
    in new forms.


    By the start of the 1970s, the Keynesian model of economic management that delivered
    industrial growth for Western Europe and North America in the post-war decades
    had run again. The era of steadily rising and broadly prosperous was over. In
    1973, an oil crisis brought talk of ‘limits to growth’ to the frontpages. The
    price of petrol at the pump made the future of energy an urgent question. Against
    this background of crisis, environmentalism flourished. Its thinkers had the ear
    of world leaders and for a while, it seemed they might shape the path the world
    would take. But it was another set of ideas that won out, coming from the margins
    to dominate the closing decades of the twentieth century.


    As of 1970, the economic theories of neoliberalism found a niche in certain academic
    departments and American think tanks that stood well outside the mainstream of
    political debate. By the end of that decade, with the election of Margaret Thatcher
    and Ronald Reagan, these theories had become the new mainstream. A commitment
    to free market reforms and tight control of the money supply were the principles
    of neoliberal economic policy, but as an approach to government, the project went
    deeper, seeking to embed the logic of market competition in the culture of organisations
    and the psychology of individuals. As Thatcher once told an interviewer, ‘Economics
    is the method; the object is to change the heart and soul.’¹1'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'Less often recognised are the roots of this project in the political conflicts
    of mid-twentieth-century Europe. The early neoliberal theorists were writing in
    the 1930s and 1940s, when world events had led them to a deeply pessimistic view
    of politics. As the sociologist William Davies explains, through their way of
    seeing ‘deliberation collapses into misunderstanding and ultimately violence’.2
    Against this, they put their faith in ‘economic calculation’: through market mechanisms,
    the desires and interests of the members of a society could be quantified and
    the optimal outcomes achieved. The ultimate goal of neoliberalism, is ‘disenchantment
    of politics by economics’.3 In this, it echoed the promise that deism once held
    dear in the sphere of religion.


    Like any new political ideology, neoliberalism arrived as an insurgent force.
    When championed by parties of the right in the 1980s, its claims were fiercely
    contested. It took the transformation of traditional parties of the centre left
    to bring something closer to the depoliticised market society envisaged by its
    architects. Bill Clinton’s New Democrats and Tony Blair’s New Labour inaugurated
    the era of neoliberal realism. Those involved in policymaking now thought of themselves
    as pragmatic technocrats, introducing market-style mechanisms wherever they were
    lacking and evaluating political decisions against the overriding criteria of
    efficiency and competitiveness. For these people, there was no such thing as neoliberalism,
    it was just reality.


    This logic met its limit in the democratic earthquakes of 2016. During the Brexit
    referendum campaign, leading figures from all the major UK parties campaigned
    for Britain to remain in the EU. They built their case on the testimony of economists
    that a leave vote would damage the country’s economic prospects. When a majority
    of those who voted chose to ignore such expert advice, this dealt a blow to the
    order of neoliberal realism from which it has yet to recover. In however messy
    form, to whatever ends it put, the Brexit vote represents the return of politics.'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'While he writes as a critic of neoliberalism, Davies is not sanguine about
    this return. The political can be ugly; the desire to break its spell is often
    understandable. You can wish for the end of a regime, only to find it replaced
    by something worse. The agendas of the populist movements that emerged in the
    mid-2010s were ‘unrealistic’ and ‘post-truth’, as their establishment critics
    never tired of pointing out. Yet the willingness of voters to embrace them reflects
    a well-founded sense that something is lacking in what is allowed to be ‘real’
    and ‘true’ within the neoliberal worldview. Too much is lost along the way when
    we try to steer by numbers and reduce reality to a matter of calculation.


    In the early 1990s, the mainstream environmental movement turned away from asking
    questions of the surrounding culture and towards a technocratic relationship with
    science. This coincided with the rise of climate change in the environmental debate.
    When the IPCC was set up in 1988, global warming was still seen as one among a
    number of potentially ominous threats. Then, as the data came in and the models
    became more robust, its status was upgraded, until this threat seemed to eclipse
    all the other forms of damage that environmentalists used to talk about. The new
    dominance of climate change reflected the growing concerns for alarm, the urgency
    of the crisis and the extent of its consequences, but I suspect there was another
    factor involved.


    Climate change – and the way climate change is represented – is particularly amenable
    to quantitative evaluation. All the specific factors and local implications can
    be crunched into a global figure: the number of parts per million of CO2 equivalent,
    the average temperature rise by 2100 as forecast by the models. This fungibility
    extends to encompass other ecological concerns, becoming a kind of currency of
    crisis: in place of earlier arguments for saving the whales, we now get papers
    demonstrating the contribution of whales to carbon sequestration.'
  merge: -1
  pgno: 74
- img_proc: true
  md: 'Yet once again, the promise that measurement and calculation would cut through
    the knots of politics fell short. Climate change rose and fell on the news agenda;
    activists would organise to demonstrate outside the UN’s annual COP meetings,
    while NGOs tried to edge the negotiations in the right direction. But whatever
    agreements were signed, they did not translate into action on the scale that was
    called for by the scientific evidence. and as the cycle repeated, the environmental
    movement became increasingly cut off from its roots, no longer able to speak to
    a deeper understanding of the nature and implications of the crisis that had called
    it into being.


    By the time I made my way into climate activism in my late twenties, I had a sense
    that something was missing. When I listened to leading environmentalists, when
    I read their newspaper columns backed up with footnotes to peer-reviewed papers,
    it felt as though we had learned to talk about the world we were using in a daylight
    language of facts and figures, forecasts and strategies. And this way of speaking
    was needed, no doubt; it’s just that on its own, it couldn’t carry the weight
    of what we were talking about. Where were the voices that spoke to the other moments
    of human experience? The ones who could talk the midnight language of loss and
    longing, the subtle language of twilight, the raw language of the wolf hour before
    dawn?


    And then, in the autumn of 2018, a strange alliance of the scared and the disillusioned
    launched a mobilisation around climate change that captured the cultural imagination
    to an extent not seen since the early 1990s. The language they spoke were new.
    They talked about their fear and about the courage that comes from a place beyond
    hope. Their voices travelled further than anyone expected. For many of those drawn
    to the movements they started, the experience resembled initiation, an encounter
    that would break them open.'
