  md: '# EIGHTEEN


    # Footsteps in the Sand


    The dead are not always counted. Thirteen years after Britain went to war in Iraq,
    the Chilcot report into the country''s role in the conflict concluded that no
    one knows how many people were killed.¹ It also pointed out that the way the British
    authorities were about producing figures of civilian casualties had been driven
    by concern for public perception.


    There is a history to the systematic counting of deaths and the publication of
    the numbers that result from it. It goes back to the seventeenth century: in London,
    the posting of Bills of Mortality for each parish on a weekly basis provided the
    raw material for the study of ‘political arithmetick’, the predecessor of modern
    economics. Meanwhile, the Dutch government had introduced the sale of annuities
    as a means to finance its expenditure. Since these provided a regular return to
    the named beneficiary for the rest of their life, they created a need for accurate
    projections of life expectancy.


    The business of counting the dead is bound up with the history of science, capitalism
    and modernity. It is part of a process that cuts in more than one direction. On
    the one hand, this process involved the discovery of patterns in the occurrence
    of what might seem wholly unpredictable events. The study of sociology grew out
    of the discovery that the number of suicides in each arrondissement of Paris was
    more or less consistent from year to year. Yet the search for regular patterns
    was accompanied by an active project of regularising the world. The heirs to the
    early scientific ways of seeing that inspired the deist vision of the divine First
    Cause conceived of the world as a great piece of clockwork, then set about making'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'the parts of the world with which they were involved as regular as a machine.


    The new way of life of the urban bourgeoisie was characterised by the desire for
    and the achievement of regularity, by the rhythms of work in their factories,
    the returns on investment, to the social conventions of behaviour. This is a theme
    taken up by Amitav Ghosh in The Great Derangement, where he associates the difficulty
    that literary novelists have in writing about climate change with the historical
    origins of the form in which they are writing. ‘Probability and the modern novel
    are in fact twins,’ Ghosh tells us, ‘born at the same time, among the same people,
    under a shared star that destined them to work as vessels for the containment
    of the same kind of experience.¹² So successful were the innovations of this era
    that people came to conceive of nature as orderly and predictable. Ghosh quotes
    the Canadian philosopher Ian Hacking’s description of probability as a ‘manner
    of conceiving the world without our being aware of it’. This way of seeing focuses
    our attention on certain aspects of experience and leaves others out least—as
    the American anthropologist Anna Lowenhlaut Tsing says—the work that it takes
    to create this kind of order and ‘the messes it makes’.³


    Ghosh writes to draw our attention to the mess, connect our thinking about climate
    change — or our difficulty in thinking about it — to the unfinished histories
    of empire. He suggests that our ability to think about climate change is muddied
    by the legacy of ‘gradualism’, a set of scientific assumptions that arose from
    the manner of world as a regular, orderly place. The role of improbable, catastrophic
    events in the Earth’s history came to be treated by geologists as a primitive
    superstition, a hangover from the time when we believed in gods and monsters.
    Well into the second half of the twentieth century, this mindset still dominated
    the way we thought about the world. As recently as 1985, a New York Times editorial
    could mock the idea that the extinction of the dinosaurs resulted from an'
  merge: -1
  pgno: 177
- img_proc: true
  md: 'asteroid impact on the grounds ''Astronomers should leave to astrologers the
    task of seeking the causes of events in the stars.''⁴4


    If the complacency of gradualism seems alien to us, here in the early twenty-first
    century, then this is— as Ghosh says— in no small part a reflection of how the
    awareness of climate change has already shaken the way we see the world. But what
    if we aren''t free of its assumptions as we imagine? Is there not, in the background
    of our thinking, and revealed in the ways our societies respond to crisis, a sense
    that the world ought to be a stable and ordered place, and that everything possible
    should be done to make it one?


    For all the history of mortality statistics, there has never been a moment outside
    of wartime—and scarcely within wartime, for that matter—when the numbering of
    the dead has impinged so relentlessly on public consciousness. The box with the
    big red numbers and accompanying charts became a fixture of the newspaper homepage.
    The national totals were painted on the placards of protesters at the gates of
    government buildings, demanding stricter measures. Meanwhile, across the widening
    gulf of pandemic politics, the same statistics were a focus of scepticism. Questions
    about co-morbidities and the difference between ''dying with'' and ''dying from''
    Covid led rabbit holes of claim and counterclaim.


    Let''s assume, if only as a thought experiment, that all the numbers were accurate.
    Because I want to say that the skeptics would still have a point, somewhat like
    the intuition I suggested underlies the Deep Adaptation paper. However accurate
    the numbers are, they do not adequately represent the reality they offer to describe.
    In the power given to the numbers, new prominence of a particular way of representing
    reality, there is something troubling. Why should it stop here? If the ultimate
    criterion by which the life of a society is structured to be the prevention of
    deaths, then by this logic, we ought to have a dashboard that includes all'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'the other ways that people die. Such a dashboard would be prominently displayed,
    it would form the basis of governance and the frame of our civic duty, the reference
    point according to which we should all feel entitled to engage in the moral policing
    of our own and each other''s behaviour. We should never return to the carelessness
    of pre-Covid existence, in which we did not base our actions on a constant awareness
