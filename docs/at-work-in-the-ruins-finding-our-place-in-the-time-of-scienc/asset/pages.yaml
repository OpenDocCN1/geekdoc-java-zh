  md: 'method but are a set of methods and practices and institutions, oriented towards
    the production of knowledge. One thing that these practices have in common is
    that they require a stance of detachment: by acting as if the world can be at
    arm’s length, it becomes possible to see and say things about it. The power of
    this way of acting is undeniable when detachment is no longer possible – desirable
    – the producers of knowledge reach the limits of their power.


    In account of the year she spent in the Norwegian coastal community that she calls
    Bygydaby, the sociologist Kari Norgaard describes the paradox of a place where
    climate change is playing out in real time – the snow comes two months late, the
    ski resort is struggling, the ice on the fjord is so thin that a woman walks through
    and drowns – and awareness of climate science is woven into everyday conversations,
