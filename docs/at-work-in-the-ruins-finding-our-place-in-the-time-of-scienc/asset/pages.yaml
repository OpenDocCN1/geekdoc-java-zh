  md: 'The kind of pessimism I’d met that day in Brussels is what happens when people
    lose faith in the ability of the institutions they have spent their lives within
    to make good on their promises – to tackle climate change and save the world and
    build a sustainable future – while the structure of their faith remains: they
    still see the world as in need of saving, and by institutions like these. I don’t
    know what is worse, the totalising pessimism that results from this loss of faith
    or the forced optimism of those attempting to sustain it with ever more desperate
    and dangerous plans to bring Earth’s systems under control. I know if I spent
    more time in the corridors along which power is meant to flow, I would probably
    share the dark certainty of some of those I’ve met. We need to break the frame
    within which agency is assumed to be concentrated in buildings like those and
    this means sharpening our sense of what is at stake.


    Here’s how I would put it: we have brought one of the great bottlenecks in the
    long history of this living Earth. The responsibility for bringing us to this
    pass is far from being shared evenly, yet few of us can claim to have no share
    in it. That is our birthright. How much will come through this bottleneck and
    in what shape – that seems to me to be what’s at stake, what remains to be settled,
    and our actions yet contribute to how it plays out.


    Let’s be honest: the number of people to whom it matters that I am no longer talking
    about climate change is limited, and some of those will be glad to hear it. I
    am not writing this book to tell anyone else what they should or shouldn’t talk
    about. But in this final chapter, I should say something about what else could
    be worth talking about. If climate change no longer serves as a starting point
    for the conversations that are called for, if the scale of the big path speeds
    our climate talk away from a recognition of the cracks in the foundations of modernity,
    then where else we might start from?'
