  md: 'The question was intended to be about climate change but a year on from the
    election of Donald Trump, it couldn’t avoid picking other wavelengths of anxiety.
    In case there was any doubt about this, the first speaker explained to us that
    everything now hung on the outcome of a collision between two worldviews.


    There is a division out there today, he said, between ‘those who believe in science,
    reason, technology and progress’ and ‘those who see a future undermined by threat
    and fear’. The first group, subscribers to what he called Worldview A, are the
    ones engaging with the issues of the Anthropocene, while the others, the Worldview
    B-ers – ‘Well,’ he shook his head, ‘these are the ones who don’t even believe
    that climate change is happening.’


    The point he meant was make clear enough: if there is to be hope, the first group
    must prevail. It’s a version of a story that’s been told enough, past few years.
    In the pantomime simplicity of the way he told it, I caught something else: an
    unexpected rhyme with an argument I hadn’t thought about years, a claim that T.S.
    Eliot once made about the history of English poetry. Somewhere, a long way back
    in the history of modern societies, around the time of the English Civil War and
    the founding of the Royal Society, Eliot thought he could discern a


    ‘dissociation of sensibility’, a severing of heart and head.6 On our side of this
    threshold, a new distance had opened up between thinking and feeling.


    Whatever the merits of this as a literary or historical claim, what strikes me
    is how it corresponds to the division described to us that night. Look at the
    terms in which those two worldviews are set out, the keywords used for each side
    of the divide: you have the people of science, reason, technology and progress
    set against the people of fear and threat. This is not a clash of ideologies,
    it is a map of a dissociated society: thinking versus feeling, head against heart.'
