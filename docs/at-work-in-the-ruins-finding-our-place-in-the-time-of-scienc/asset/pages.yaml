  md: '# Acknowledgements


    This book got written the way that guy in Hemingway went bankrupt: ‘Two ways.
    Gradually, then suddenly.’


    The sudden part involved a seven-week blaze of writing between February and April
    2022, when almost all you read here were written. The fuse for that lit the previous
    September, when the three short chapters that form Part I arrived in three straight
    days.


    The gradual part goes back to the first conversations with Paul Kingsnorth that
    led to the writing of the Dark Mountain, and even further back to undergraduate
    tutorials with A. D. Nuttall. Many friends, teachers, editors and audiences made
    it possible for me to cultivate the stories and lines of thought that came to
    fruit. Many debts accrued along the way, only a fraction of which I can honour
    in the notes of gratitude that follow.


    First, gratitude to Paul for glimpsing the possibility of the Dark Mountain Project,
    trusting me to help him make it real and taking more his share of the brickbats
    that came our way. And to all those who stepped into the space the two of us had
    opened, shared in the responsibilities and brought their own vision to its realisation:
    Charlotte and Mark, Nick, Sophie, Ava, Steve, Dougie and Em, Cate and everyone
    else who got involved.


    Next, to old friends, starting with Billie, my longest-standing collaborator,
    and Lucy, with whom I learned to laugh at myself. Rick, Emma and James who served
    alongside me in the OUHS. Mr Kotie, my'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'attorney and a good man in a tight spot. Mary Harrington, the comrade and intellectual
    sparring partner of my twenties, hoping that the circle comes around. Anthony
    McCann, in the hope that he finds something even a tenth as helpful here as his
    thinking on commons and the politics of gentleness was for me. And Charlie Davies,
    for interrupting my every sentence until I could talk in a way that had a chance
    of carrying, and for all the years of infuriating clarity.


    Like many of these days, I had to find my elders in books, but some of them would
    later get to know in the flesh. A deep thank you, then, to Alastair McIntosh for
    writing the only book that made me sit down and write to the author, and the blessing
    you gave when you wrote back. To Alan and Giselda Garner for the *refugium* found
    first in words and around the hearth at Blackden. To Sajay, Samar, Dean and all
    the others from the Illich mafia who welcomed me when I was a stranger in a strange
    land.


    Then there are the various crews with whom I went and sometimes stayed that way:
    the Pick Me Up gang, the Institute for Collapsomics, the Conference of the Birds,
    the Prayer Group and the Feral Bible Studies. Thanks, all of you, for the scenius.


    At Riksteatern, Måns Lagerlöf made the improbable decision to invite me into the
    core of his artistic team and Jocke Lindå and Lisa Färström were warm and brilliant
    colleagues. To all the members of the Dark Mountain Workshop that we ran there,
    and especially to those I got to work with *Medan klockan tikar* and *Kartan över
    oss*.


    Isak Stoddard and Ingrid Ries welcomed me to Uppsala the Centre for Environment
    and Development Studies the closest I''ve ever had to a corner of academia that
    feels like home. Per Johansson and Johan Red have been my closest buddies in my
    first decade in Sweden. Keri Facer and Christopher Brewster have both prodded
    me to write a book in the way that only good friends can prod. By a happy chance,
    Duncan'
  merge: -1
  pgno: 260
- img_proc: true
  md: 'McLaren and I found ourselves neighbours in Västerås. I''m grateful for our
    whisky conversations and the opportunity we had to develop our thinking on ‘emergency
    democracy’ in an article for openDemocracy.


    To Mike Small at Bella Caledonia, a special thanks for giving a home to my writing
    in the year after I moved on from Dark Mountain and publishing the ‘Notes from
    Underground’ essays out of which Part II of this book would later grow. And thanks
    to my good pal Robin Black who gave his time to edit those essays and tighten
    up the sentences.


    When the virus came and took us away for telling stories, Ed Gillespie''s invitation
    to collaborate on The Great Humbling podcast provided the space in to find another
    voice. Meanwhile, through Homeward Bound, the Assembly and the Long Table, I got
    the chance to teach and learn from hundreds of remarkable participants around
    the world who have found themselves drawn to the work of regrowing a living culture.
    Thank you to all those members who shared the journey of writing of this book.


    Certain encounters are too large in significance to justice in lines like these.
    Meeting Martin Shaw was an encounter. Likewise, the encounter with Vanessa that
    led me into the company of the Gesturing Towards Decolonial Futures collective.
    Chris Erskine knows how much of his support made over the years since we first
    sat drinking coffee at the Royal Festival Hall, but it''s time to finally put
    that in writing.


    It''s no accident that the fuse for this book was lit in one of my Friday morning
    conversations with Felix Marquardt. Thank you, brother. My old co-conspirator
    Keith Harris helped keep it alight with a well-timed introduction, and Rosalind
    Porter made me that I had a book on my hands.


    To all those who read the manuscript and provided feedback of one kind and another,
    a huge thank you: Caroline Ross, Christopher Brewster, David Armstrong McKay,
    Nicholas Wilkinson, Alastair McIntosh, Saskia'
  merge: -1
  pgno: 261
- img_proc: true
  md: 'Walentowitz, Ajay Samuel, Dean Bavington, Rieser, Mat Osmond, Elizabeth Slade
    and the Jaymo. They bear no responsibility for what I have written, but they made
    me think harder and often provided encouragement at just the moment it was needed.


    From our first emails about this project, Margo Baldwin conveyed the kind of enthusiasm
    that every author dreams of finding in a publisher. Matthew Derr has been as much
    a companion in the writing process as an editor and when the moment came at all
    for him to wield the knife, I found myself unable to argue with his judgement.
    All through the journey, working with Chelsea Green has felt like having a team
    behind me who know and care about the book.


    Finally, what can I say to Anna, who has shared not just the writing of this book,
    but the years of not-writing-a-book that went before it? Thank you for your faith
    in me, even through all the hard work of making a life together. You continue
    to amaze me. Nothing feels better than when we work together. And in a moment,
    I will stop pouring out these words of gratitude and go out sort the mess kitchen
    is in.


    But first, a last word, to Alfie, whose generation will travel further into the
    ruins, into the time of consequences, to inhabit the unknown world that lies ahead
    I imagine you''ll harder questions for us – and soon – than how it works when
    you wish on a falling star. I hope I can look you in the eye, as I struggle to
    answer them.'
