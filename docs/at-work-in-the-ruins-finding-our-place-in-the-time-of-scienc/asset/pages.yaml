    structural reality of our societies, along the lines that Ivan Illich described.
    If you want to die without going to hospital, these days, you need to do it fast.
    And this what turns a relatively mild pandemic that mainly affects the elderly
    into a threat that justified putting whole societies under house arrest. What
    we are dealing with is a scarcity of the means of dying.


    So long as the capacity to care for the sick and the dying exists at the level
    of households and communities, a wave of mortality can pass through almost unremarked.
    The shape of our lives has been remade so that households no longer have that
    capacity, once death requires us to pass through the bottleneck of hospitals and
    care homes, the means of dying have become scarce in a new way. Any significant
    deviation from the averages on which the capacity of the system is based threatens
    to overload the system as a whole and create a cascading failure leading to many
    deaths. This was the nightmare glimpsed by Western leaders as the virus began
    to spread in northern Italy. The prospect of hospitals and health services collapsing
    under the strain of a surge in cases drove the rush to lockdowns. Whatever hindsight
    has to say about the projections then on offer, it’s not hard to understand why
