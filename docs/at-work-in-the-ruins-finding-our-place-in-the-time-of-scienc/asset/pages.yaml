  md: '# ALASTAIR MCINTOSH, author of Soil and Soul and Riders on the Storm


    ‘We’ve tried browbeating people into saving the planet. It doesn’t work, both
    because most people don’t like to be told what to do and because it is pure folly
    to imagine that individual microchoices are sufficient to lift us out of this
    crisis. Why not instead, to invite people to think together with us in a spirit
    of honesty, not only about the crisis and possible ways out of it, but also the
    deeper reasons why we cherish the world we have been told we must save? This is
    Douglas Hines’s approach, and it is timely indeed – a desperately needed change
    of register in contemporary environmental thinking.’


    JUSTIN E. H. SMITH, author of The Internet Is Not What You Think It Is


    ‘In this book, Douglas Hines invites us to repurpose the ruins of the modern structures
    of organisation and existence (within and around us) that have led us on the path
    of premature extinction. The end of the world as we know it is the end of a world
    that needs hospicing, and perhaps, through this hospicing, humanity can learn
    to be taught by the violence it has inflicted on itself and the rest of nature.
    It is pretentious to think we (humans) can birth new world; but since we are part
    of nature and not the centre of it, we can learn to trust the healing capacity
    of its metabolism to work through us, if we can decentre ourselves to allow it
    to happen.’


    VANESSA MACHADO DE OLIVEIRA, author of Hospicing Modernity


    ‘It’s hard to exaggerate the importance and sheer nerve of Hines’s prophetic call
    to face the facts. It is an elegant and acute examination of our personal and
    societal pathology, and a stirring but never polemical insistence that we must
    start the treatment. What’s wrong with us? Our storylessness, our pathetic clutching
    at polarities, and our ludicrous faith in progress rather than process. And the
    therapy? Stories that are worthy of us, because we’re huge and enduring – unlike
    politics or institutions or ideas.'
