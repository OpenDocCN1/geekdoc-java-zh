  md: 'Vanessa writes about the difference between ‘divesting’ from modernity and
    ‘disinvesting’ in it. As we wake up to the costs of the ways we have been living,
    there’s an urge to escape, to get off the grid of dependencies and consequences.
    This is the move of divestment. But it’s almost impossible to get off that grid,
    and to the extent that we get anywhere close, this tends to be a mark of privilege,
    the resources and choices available to us as beneficiaries of the system we see
    ourselves as opting out. Disinvestment is a different kind of response, where
    we give up on modernity’s promises: ‘we do not invest in the future of modernity,
    while staying with modernity’s troubles, facing our responsibilities, and gradually
    developing discernment to reorient our desires away from modernity’s violence
    and unsustainability – without resorting to heroism or escapism.’⁷ This may look
    like staying in place within existing institutions with a commitment to limiting
