  md: 'If it were possible to leave aside the condescension towards Indigenous knowledge,
    I guess you could argue that no great harm came waiting until 2012 for the reality
    of those sounds to gain official recognition. The same cannot be said of the larger
    pattern to which this story belongs. Newfoundland, the environmental historian
    Dean Bavington has shown that it took fisheries scientists a century and a half
    to acknowledge the reality that local fishermen could see in the 1850s of how
    new fishing methods would affect the breeding cycle of the cod.¹10 The fishermen''s
    knowledge came from their experience as participants within the life of a place.
    It was, in scientific terms, anecdotal. It took the collapse of the cod fishery
    to overfishing – not once but twice – before the scientists caught up with what
    the fishermen had known.


    How much of the way we are inhabiting the world just now is the result of this
    same attitude to what is real? How many realities are on being confidently denied
    because they are known in ways that can be dismissed as myth or anecdote, and
    they lack a Professor Laine to follow his own experience rather than the incentives
    of scientific funding? What are the consequences?


    For the Sami, they go far beyond the condescension demonstrated in the story of
    the lights that can be heard. Between 1922 and 1958, researchers from Sweden’s
    State Institute for Race Biology in Uppsala travelled the country, measuring skulls
    and photographing children and adults, sometimes requiring them to strip naked,
    as to build a scientific evidence base for policies of ‘racial hygiene’. In recent
    years, those responsible for the university’s collections have begun the process
    of repatriating skeletons taken from Sami burial grounds for studies which claimed
    to prove that Sweden’s Indigenous minorities were of lower racial stock.¹¹ This
    was grave robbery in the name of science, carried out in Europe, in the twentieth
    century. You will find similar stories in every inhabited continent.'
