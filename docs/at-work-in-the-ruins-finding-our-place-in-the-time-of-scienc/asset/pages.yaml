  md: 'With all its well-meant calls to optimism and its othering of fear, Worldview
    A ends up approaching the clinical condition of dissociation, identified by psychologists:
    a pathological detachment from physical and emotional experience.


    The pandemic revealed and accelerated the fusion of science, politics and faith
    within the public discourse. In the already polarised political landscape of the
    United States, the ‘science’ now has a political party: following the recall election
    in California in September 2021, I heard a Democratic spokesman declare that ‘People
    voted for the science!’


    Whatever thoughts we have about the science of the pandemic, this fusion provides
    the basis for a suspension of democratic norms, not only in the emergency measures
    implemented in the name of science but also in the attitude to opponents: if your
    party is on the side of science, there is no reason to listen to or understand
    your opponents; they should be dealt with rather, as sources of dangerous misinformation
    and shown zero tolerance. At this point, ‘belief in science’ begins to resemble
    any political movement that is driven by a transcendent faith, convinced of the
    truth of its message and the goodness of its intentions.


    To suggest that there is a tendency towards theocracy, or something like it, in
    the politicisation of belief in science – this is, I know, to court outrage. The
    binary lens through which we look at politics makes it almost impossible to see
    and speak about these things. If I suggest that there is something alarming about
    developments on the progressive end of the political seesaw, I will be challenged
    as to whether I seriously consider these excesses to outweigh the ugliness of
    the forces on the other end. Am I willing to claim that this is more of a problem
    than the torch-bearing neo-Nazis of the Unite Right rally or the racist demagogue
    of a president whose rhetoric lit those flames?'
