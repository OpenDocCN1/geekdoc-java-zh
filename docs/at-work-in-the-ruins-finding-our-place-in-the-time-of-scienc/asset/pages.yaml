  md: '# THIRTEEN


    # What to Believe


    Compared to the other existential threats that haunt industrial humanity, is hard
    to make good fiction out of climate change. There''s no neat chain of cause and
    effect, no human finger on a button, no flash and boom and mushroom cloud, no
    moment that changes everything. The catastrophe creeps into our lives, each particular
    manifestation tangled up with other causes.


    In ten years of editing the Dark Mountain books, each one a collection of work
    from fifty or sixty writers and artists, I can think of only a handful of stories
    we published that would count as ‘climate fiction’. Mostly, the stories that worked
    were the ones went at our situation indirectly, often without naming it. Like
    a monster from an old myth, to look at the matter of climate change directly seems
    to turn the imagination to stone. You end up with Greenland, the play staged in
    2011 at the National Theatre in London, in which storylines with all the depth
    of a soap opera play out against a backdrop of melting icebergs and failing negotiations.
    Even the novelist Ian McEwan felt obliged, when he turned his attention to climate
    change in Solar, wrote the inevitable scene in which the central character delivers
    a lecture on the science of the Greenhouse Effect, attempting to rescue this with
    low comedy about bodily functions.¹


    The difficulty was taken up by the Indian novelist Amitav Ghosh in the branching,
    book-length essay, The Great Derangement: Climate Change and the Unthinkable.²
    Among the huge variety of storytelling traditions woven through the patchwork
    of human cultures, Ghosh suggests, the modern literary novel is uniquely ill-equipped
    to handle a thing like climate'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'change. Older modes of storytelling had room for gods and monsters: forces
    vastly larger than ourselves, exceeding our comprehension, yet entangled with
    the hopes and disappointments of our lives. By contrast, in the kind of stories
    our culture likes to take seriously, all of the actors are human and most of the
    action takes place indoors. The literary novel is stuck with a mode of ‘realism’
    in which the world serves as a passive backdrop for human events. What’s more,
    in order to be believable, the events it portrays need to meet a standard of ‘probability’
    that exceeds the experience of our lives: “Within the pages of the novel, an event
    that is only slightly improbable in real life – say, an unexpected encounter with
    a long-lost childhood friend – seem wildly unlikely: the writer will have to work
    hard to make it appear persuasive. To depart from these conventions, Ghosh adds,
    is to exile from the literary mansion to the shantytown of genre fiction at its
    gates.


    Having made his case in the form of an essay, Ghosh then applied it to the writing
    of his next book, *Gun Island*, which is among the handful of literary novels
    I can think of that take the matter of climate change successfully.³ He does so
    by deliberately courting the improbable, and even the miraculous, in a story woven
    around a Bengali legend and the journeys of present-day migrants; though enough,
    some of the book’s reviewers seemed puzzled as to whether they were dealing with
    the work of a serious novelist or an Indian twist on a Dan Brown thriller.


    The Swedish novelist Jesper Weith found another solution in *Anything That Isn’t
    Growing*, where the early consequences of climate change play out in the background,
    while the central characters remain almost oblivious to it, caught up in their
    own human-scale drama, which just happens to provide a rich pool of images reflecting
    our larger predicament⁴.


    The third example I can think of that succeeds Lydia Millet’s A *Children’s Bible*,
    a novel that echoes with the intergenerational fury of the school strikers.⁵ An
    apocalyptic storm breaks over the rented mansion'
