    an opportunity for the spread of disease.


    To approach reality through statistics can be maddening. Statistical methods belong
    to the category of scientific tools that allow us to act as if the world can be
    held at arm''s length, observing the landscape of experience with a satellite''s
    perspective. In the right circumstances, used with skill, such tools can be helpful,
    but if the results are presented as a truer reality than the ground-level experience
