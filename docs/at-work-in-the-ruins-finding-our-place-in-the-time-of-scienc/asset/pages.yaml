  md: '# TWENTY-ONE


    # Two Roads Diverged


    By the autumn of 2021, I had come to doubt that a conversation starts with climate
    change can any longer lead us to the larger questions about where we find ourselves
    and how we got here. Two things had changed around the start of this decade: first,
    the financial and political capital piling into ‘taking climate change seriously’
    and then the dramatic intensification of the authority of science in the ideological
    landscape. these changes make it harder for such a conversation to break out of
    the frame of science and arrive at the upstream questions, the territory in which
    we are called into question by what we know and what we have good grounds to fear
    about the trouble we are in.


    So I found myself needing to redraw the maps by which I had been steering, tracing
    the fault lines that will matter most in the years ahead. It seemed to me that
    the image of the fish tank could help in drawing the line. Those of us who are
    not willing to contribute to the project of remaking the world as a fish tank,
    an object of total human management, need to find ways of speaking and acting
    that offer another direction of travel.


    As I was setting out on this work, I became aware of a divide that had opened
    up within one of the most enduring and grounded manifestations of the environmental
    movement to emerge from cultural movement of the 1970s: a divide that linked the
    differing understandings of what it means to take climate change seriously to
    the pandemic.'
