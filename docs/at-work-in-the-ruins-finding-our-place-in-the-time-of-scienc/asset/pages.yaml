  md: 'minister had to resign after claiming the security services had told her the
    strikes were part of a conspiracy.


    You could trace the shift of power at the turn of the decade in the books that
    defined the climate conversation. If David Wallace-Wells’ The Uninhabitable Earth
    and Jonathan Franzen’s What If We Stopped Pretending? were like finding your dad
    in the kitchen late at night, admitting he''s terrified and doesn’t know what
    to do, the new mood summed up by Bill Gates’ How to Avoid a Climate Disaster.
    The Davos elite had found itself on the end of Thunberg''s fiercest words; now
    here was its foremost member, the original tech billionaire turned philanthropist,
    informing us that he and his friends had the situation in hand.


    By his own admission, Gates had only recently started to treat the climate crisis
    as a priority, but now he was giving it his full attention. ‘I’m optimistic that
    we’ll make real progress on climate change,’ he told readers, ‘because the world
    is more committed to solving this problem than it has ever been.¹ The grown-ups
    were here and ready to take charge.


    In we made the contrast, it was underlined by Gates’ friend Steven Pinker. ‘People
    tend to approach challenges in one of two ways — as problem-solving or as conflict,’
    Pinker told an interviewer. ‘You can think of it as Bill versus Greta.’²


    The Swedish flatpack furniture IKEA designs its stores so that customers have
    to follow a single route from entrance to exit. There are no junctions, no decision
    points, just one path that they have little but to take. There are books that
    work this way. ‘Conceptual IKEA’, the Irish philosopher Anthony McCann calls them.
    They start with a framing proposition that forms an entrance and, having crossed
    this threshold, everything that seems inevitable. There are no crossroads in an
    IKEA world, no forks in the road, no places where judgement is called for, just
    a sequence of obstacles to overcome.'
