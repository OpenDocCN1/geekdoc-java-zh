  md: '# TWO


    # The Trouble We’re In


    Just to be clear, I still think we’re deep in trouble; deeper than we know how
    to talk about. And this trouble shows up in the form of what we know as climate
    change: no longer a future, but a spreading reality, with floods and fires and
    heatwaves in the far north and strange weather patterns that get stuck in ways
    they didn’t used to. You can smell the smoke of burning forests from a continental
    away; fish are cooked alive in the heat of Canadian rivers – how much more biblical
    do you want this to get?


    There’s a rising tide of alarm, as well. The early momentum of Extinction Rebellion
    and Fridays for the Future fell away but the legacy of these movements includes
    a shift in public opinion that made even a former climate denier like Boris Johnson
    feel the need to bang the drum for ‘net zero’ emissions. In the US, a Democrat
    president promises to take the lead on global climate action. I passed through
    a northern European airport last summer, for the first time in years, and were
    adverts heral the imminent arrival of fossil-free flying. In small-town Sweden,
    we see more and more Teslas on the road. And as the latest report from the Intergovernmental
    Panel on Climate Change might be, it was greeted by a chorus of can-do messaging.
    Surely this is the decade in which climate change finally gets taken seriously?
    Why would anyone care about the trouble we are in to stop talking about it?


    This book grew out of an attempt to answer that question, so it’s a theme to which
    we will keep returning, but let me try to sketch the outline of an answer here
    to give a sense of what is at stake.'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'When we start to talk about climate change, we enter into a conversation that
    is framed by science. How could it be otherwise? Climate change is a scientific
    term. It refers to a set of processes that are described by the natural sciences.
    Yet climate change also asks questions that science cannot answer. When it comes
    to what to do about climate change, responsibility passes from the scientists
    to the engineers and the economists, while psychologists and marketing experts
    are brought in to figure out how ‘deliver the message’ and ‘drive behaviour change’.
    In the rooms where I was brought together with religious leaders and artists and
    Indigenous elders, it mostly felt as though we were being enlisted in this downstream
    effort. The hope was that we had some wisdom experience or practice that might
    help the news from the climate scientists to reach the wider public imagination.
    The point that I would make in these rooms – and that often seemed to land and
    lead to fruitful conversations with the scientists present – is that there are
    also questions that lie upstream of the work of science and take us beyond the
    frame it draws. These are not about what needs doing and how, but how we got here
    in the first place, the nature and the implications of the trouble we are in.
    Such questions might sound abstract compared to the practical concerns of those
    who want to find solutions, but how we answer them has consequences. It shapes
    our understanding of the situation, what kind of problem we think we’re dealing
    with and, therefore, what kind of solutions we go looking for.


    Not only the upstream questions not be answered by science alone, they cannot
    even be asked in a clear way as long as we allow what we are talking about to
    on being framed in terms of science. Yet, in a sense, these questions cannot not
    be answered: it’s just that, unless we can get beyond the frame of science to
    ask them clearly, our answers will tend to be unconscious. They will be default
    answers, the result of assumptions we don’t even know we’re making.'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'To follow these questions consciously may well lead us beyond climate change
    to a broader account of the trouble we are in and the ways that it shows up. We
    may no longer see climate change as the problem, but as an especially alarming
    storm of an underlying condition. This is, at least, the kind of answer I arrived
    at. In the pages ahead, I will retrace the paths that led me there, but I do so
    with growing doubts as to how far these paths remain open and for how much longer.


    I used to think that talking about climate change could be a gateway, the entry
    point to a larger, deeper conversation. Perhaps that used to be the case. Certainly,
    in the years before the pandemic, I witnessed a growing number of people having
    an encounter with climate change not as a problem that could be solved or managed,
    made to go away or reconciled with some existing arc of progress, but as a dark
    knowledge that calls our path into question the stories we were told and the trajectories
    our lives were meant to follow, the entitlements we were brought to believe we
    had, and our assumptions about the shape of history, the kind of world we were
    born into and our place within it. For those most sheltered from the shadow side
    of modernity, the facts of climate change can be the place where its shiny promises
    first crack; we recognise our vulnerability and it starts to dawn on us the shift
    might just be going down.


    You could hear this vulnerability in the voices of those at the heart of the climate
    movements that erupted in 2018 and in the quieter conversations going on within
    the local groups that formed that moment. Yet all this talk was still taking place
    within the vessel of science, and this produced strange contortions and contradictions.
    The language of science is understated by design. It is hardly suited to speaking
    in prophetic tones, but this was the signature of these movements. The strangeness
    of the shift in register applied as much as to Greta Thunberg, who was fiercely
    careful to keep her statements within the bounds of the scientific consensus,
    as it did'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'Extinction Rebellion’s Roger Hallam or Jem Bendell, the Cumbria University
    professor whose self-published paper ‘Deep Adaptation: A Map for Navigating Climate
    Tragedy’ – based on his alternative interpretation of the scientific data – went
    viral that autumn. Whether in alliance with or antagonism to the actual climate
    scientists, the calls to action were increasingly framed in the name of something
    called ‘the science’. An understandable shorthand for the consensus over the key
    processes of climate change built up decades of research by thousands of teams
    around the world, this way of talking also had the effect of invoking a singular
    authority whose implications remained to be seen. ‘United Behind the Science’
    read the placards and the hashtags, and the more this message was repeated, the
    stronger the frame of science around our climate conversations became and the
    less room there be for looking beyond that frame.


    Two things happened next to change the context of anything that any of us might
    have to say about climate change. First, in the time of Covid, the political invocation
    of science took on a new colour. With a novel threat about which there was far
    less scientific understanding or consensus than climate change, politicians nonetheless
    discovered the effectiveness of introducing radical policies in the name of ‘following
    the science’. Meanwhile, the implications of the demand to ‘Unite Behind the Science’
    became clearer. I saw the people who taught me to think carefully about science
    and the questions that it cannot answer on its own, when they attempted to address
    the questions raised by the pandemic, being told by angry, frightened readers
    ‘Just shut up and take the fucking vaccine!’ Or being scolded by their peers for
    drifting towards ‘conspiracy theory’. In the name of ‘the science’, it is possible
    to decree what should be done and to close off the possibility of further public
    conversation.


    This development coincided with a new phase in the relationship of existing social,
    political and economic institutions to the issue of climate'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'change, the emblem of which was the election of Joe Biden and the return of
    the United States to the Paris Climate Accord. In their rhetoric, at least, most
    of the dominant institutions of our societies are now taking climate change seriously.
    Yet, as we shall see, they remain invested in certain answers to the larger questions
    which climate change asks, and since these are largely the default answers that
    will govern the response to climate change so long as the conversation remains
    within the frame of science, the newly absolute authority of ‘the science’ will
    suit them very well.


    Here is what I''m seeing, then: the political contours emerging from the pandemic
    foreshadow a fork in the road for the politics of climate change. We would always
    have come to have climate change taken seriously, one way or another. As long
    as the goal was to have climate change taken seriously, this could unite us, however
    different our understandings of what taking climate change seriously might mean.
    As we get near that, though, the differences in understanding come more sharply
    into focus. But we have reached that point, or something like it, under conditions
    in which the authority of ‘the science’ has been supercharged.


    Two paths lead from here: one big, one small. The big path is a brightly lit highway
    on which many lanes converge. It unites elements of left and right, from Silicon
    Valley visionaries and Wall Street investors, through a broad swathe of liberal
    opinion, to the wild fringes of Fully Automated Luxury Communism, and in some
    form it will constitute the political orthodoxy of the 2020s. It sets out to limit
    the damage of climate change through large-scale efforts of management, control,
    surveillance and innovation, oriented to sustaining a version of existing trajectories
    of technological progress, economic growth and development. The small path is
    a trail that branches off into many paths. It is made by those who seek to build
    resilience closer to the ground, nurturing capacities and relationships, oriented
    to a future in which existing trajectories of technological progress, economic
    growth and development will not be sustained, but where the'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'possibility of a ‘world worth living’ nonetheless remains. Humble as it looks,
    as your eyes adjust, you may recognise just how many feet have walked this way
    and how many continue to do so, even now.


    Which of these paths I would have us take is clear enough. The big path is a fast
    track to nowhere. We will not arrive at the world of fossil-free jumbo jets promised
    by the airport adverts. The entitlements of late modernity are not compatible
    with the realities of life on a finite planet and they do not even make us happy.
    By may well follow that path for a while longer, as it leads us deeper into dystopia
    and leaves us more dependent on fragile technological systems that few of us understand
    or imagine living without. And what I think I can see now is that the very language
    of climate change will be owned, from here out, by the engineers and marketers
    of the big path. Any conversation about the trouble we are in, so long as it starts
    within the newly politicised frame of science, will lead inevitably to their solutions.


    If I’m anywhere close to right in this reading of the signs of the times, if the
    new politics of science emerging from the pandemic does stabilise something like
    its current shape, those of us who are partisans of the small path will find ourselves
    in a strange position. However far it may be from our political roots, we find
    that we have more in common with assorted conservatives, dissidents and sceptics
    whose scepticism extends to climate science – than with the mainstream progressive
    currents that have so far a claim to be on the right side of science when it comes
    to climate change. Under the authority of ‘the science’, talk of climate change
    will belong to the advocates of the big path, and those of us who do not wish
    to contribute to that future will need to find another place to start from when
    we want to talk about the depth of the trouble the world is undoubtedly in.'
