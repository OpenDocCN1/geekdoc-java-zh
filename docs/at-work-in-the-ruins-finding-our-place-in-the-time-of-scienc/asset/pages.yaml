    the left but there was something I already knew in my gut and saw more clearly
    as he spoke: the line I am setting out to draw does not map cleanly onto the old
    left–right axis. To turn aside from the big path is to turn aside from one side
    that familiar axis of political choice, it is the frame on which the whole axis
    was strung from the start. I still think of myself as coming from the left think
    of myself as coming from the left – but the frame is cracked, and where we are
    going, those labels may not mean that much.


    In the summer of 2019, my family spent two weeks at Newspeak House, an ominously
    named institution just off the top of Brick Lane that is home to the London College
    of Political Technologists. One night, I came downstairs after putting my son
    to bed and found a book launch underway. The book was Fully Automated Luxury Communism
