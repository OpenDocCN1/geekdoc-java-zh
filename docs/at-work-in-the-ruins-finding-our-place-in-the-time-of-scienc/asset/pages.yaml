  md: 'When a government makes a declaration of emergency, this generally implies
    the suspension of normal democratic process, the rights of individuals and even
    the rule of law. The thinker who did most to draw out the implications of this
    was the German legal theoretist, Carl Schmitt, who also became an enthusiastic
    member of the National Socialist party. For Schmitt, sovereignty was defined as
    the ability to decide when the legal norms do not apply: the sovereign is the
    person or institution which gets to declare ‘the state of exception’. Having identified
    an external threat great enough to justify such a declaration, any individual
    or group who gets in the way of action against this external enemy is now an internal
    enemy and it is in the public interest to take whatever action is necessary against
    them.


    The logic of Schmitt’s theory was put into practice by his political friends.
    The framework of international law which we have today was shaped by the exceptional
    horrors of the mass death machine they built and the resolve to prevent any repetition
    of those horrors. Yet the architects of the International Covenant for Civil and
    Political Rights could see that there are indeed situations in which a state is
    confronted by an extraordinary event – a natural disaster, civil unrest or armed
    combat – which justifies actions that would otherwise be illegal. Their answer
    was to define an outer frame, a set of boundaries around what can and cannot be
    in the name of a state of emergency. One of these concerns the duration for which
    the legal norms are to be suspended. According to international law, a government
    declaring a state of emergency is required to inform the secretary-general of
    the United Nations of its expected end date. This condition alone might give us
    pause, I thought, when it came to these climate declarations: once you declare
    a state of climate emergency, when is it going to end?


    It is hard to write about what happened in the moment when the new climate movements
    broke into view. First, because in asking questions of'
  merge: -1
  pgno: 83
- img_proc: true
  md: 'these movements, I don’t want to join the armchair critics who often seem to
    outnumber the activists putting their bodies on the line to bring bridges and
    motorways to a halt in the name of Extinction Rebellion or Insulate Britain or
    Just Stop Oil. Theirs is a courage that I don’t pretend to match and their example
    deserves to be remembered. Whatever else, it will give those who come after us
    a sense that we do not march cheerfully or blindly into disaster.


    I suspect these movements are significant in other ways, that the consequences
    of their actions are still to play for, and this is one reason for asking questions.
    It matters that we shine a light not only on the implications that may be overlooked
