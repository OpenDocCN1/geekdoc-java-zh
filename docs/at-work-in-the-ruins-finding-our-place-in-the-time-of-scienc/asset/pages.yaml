  md: '# Where to Begin


    Modernity is post-apocalyptic. It’s been that way from the start. It is born out
    of devastation: the destruction of the fabric of the living world and the destruction
    of the weave of culture.


    Modernity is also antibiotics and anaesthetic dentistry and the mother who can
    almost take for granted that she will survive childbirth and the father, who can
    almost take it for granted that he will live to see this creature grow strong
    while he grows old. Because modernity is all these things, it is hard to see or
    name its post-apocalyptic character. To do so is a kind of blasphemy.


    The standard answer has been to disregard the devastation, to treat culture as
    anachronism and to treat the living world as a storehouse of resources for our
    exploitation. We are coming to the end of this way of treating the world.


    The paths traced in this book belong to a search for other answers, clues that
    we might survive this ending, that it might be worth surviving.


    Somewhere after that first *oh-fuck* moment, when you''ve made all the changes
    you can think of, there comes the realisation that it might not be enough: you
    could turn your life into a checklist of things to do to stop climate change,
    you could go on every demonstration and throw yourself into each direct action,
    and climate change might just roll over you and everyone you know. When you hit
    this threshold, it’s not like you rush out and buy an SUV, but the manic edge
    of that first phase gives way to a deeper acquaintance with the fragility of our
    situation. You no longer base your actions on a secret deal with the universe,
    if you do all the things'
  merge: -1
  pgno: 248
- img_proc: true
  md: 'then it will be OK. It won''t be OK, it was and never could have been.

    But maybe we can live with this.


    That day in Brussels, when I''d talked about negotiating the surrender of a way
    of living, after the morning conference, with the bigger players were gone, there
    was a workshop for this network of European Commission staff and any guests who
    wanted to stick around. It was held in a long room and the workshop leader, who
    was part of Jem Bendell''s Deep Adaptation team, asked us to place ourselves up
    and down the room according to how likely we thought it that humanity would be
    in fifty years from now. I couldn''t relate to the scenario or see how this exercise
    might be useful to anyone. After years of being called a doomer for things we''d
    said in the Dark Mountain manifesto, it was bewildering to be surrounded by mainstream
    professionals who had crossed the threshold and landed in a depth of pessimism
    beyond anything I used to. I found myself talking to the most hopeful man in the
    room, a Belgian biologist who worked with peasant farmers in the Sahel. He showed
    me pictures on his phone of these projects, reclaiming semi-desert land through
    agroforestry, all done with the most basic tools. Then he looked around the room
    and shook his head. ''Do they think people are just going to give up?'' wondered.


    When people let go of the idea of climate change as a problem that can be fixed
    or managed, made go away or brought under control, they move into talking about
    it as an ''existential threat''. It''s an anthropocentric phrase: the focus is
    almost always on human existence. But I''ve come to notice an ambiguity in what
    is meant, even within the horizon of the human.


    I remember a radio interview, a few weeks before the Paris COP meeting. They set
    me up against another guest, a professor at Yale who specialised in the psychology
    of climate communication. The producer said she came to me because I said the
    things that others only say after the mic has been switched off. The ISDN line
    from the broom cupboard in Stockholm where I was sitting to my studio in Chicago
    kept dropping out,'
