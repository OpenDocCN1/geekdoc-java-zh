  md: 'In Australia, Apalech man and senior lecturer in Indigenous knows at Deakin
    University Tyson Yunkaporta observes that Indigenous participants in academic
    conferences are still expected to show up like displays in a museum, offering
    ‘a carefully curated version of their past’ ‘not sharing what we see when we look
    back through window’¹² Modernity is interested in the products of Indigenous thought,
    he says, but not the processes of Indigenous thinking. When I think of the bones
    that still sit in university basements, not far from where I am writing these
    words, a grim corollary comes to mind: science has been interested in measuring
    people’s skulls but not in listening to what those people know.


    The third story has to do with a specific kind of knowledge which science lacks.
    When Sanjay Samuel arrived at Penn State University from Kerala in the late 1980s
    it was to study business administration, but he attended a lecture by Ivan Illich
    which changed the course of his life. He became part of the travelling circus
    of Illich’s friends and collaborators – an entourage which set up home on the
    edge of the university wherever he was currently a visiting professor – and it
    was through Sanjay that I found my way into that circle and came to know many
    of its surviving members.


    A particular line of inquiry grew out of Sanjay’s conversations with Illich. It
    concerns the relationship between science and reason. As he told me in an interview
    for one of the early Dark Mountain books, science and reason are often taken to
    be one and the same, so that any question of science will be understood as emotional,
    romantic and irrational.¹³ Indeed, such a stance is sometimes embraced by those
    trying to articulate a sense of what is missing from the scientific account of
    the world. What I’ve come to appreciate about Sanjay is his insistence that the
    sphere of reason goes beyond what science can see and say.


    ‘Having trained as an accountant,’ he told me, ‘number and the limits of the numerical
    absorbs much of of my thinking.’ He brought up a distinction'
  merge: -1
