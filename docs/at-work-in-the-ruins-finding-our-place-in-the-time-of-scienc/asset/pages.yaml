  md: '# ELEVEN


    # Behind the Science


    The Øresund Bridge curves out of the suburbs of Malmö, over the water towards
    Copenhagen and into the imagination of Europe. Linking the lakes and forests of
    the Scandinavian peninsula to the densely settled lands of the continent, it carries
    travellers and commuters, but also words, images and numbers. The main cable that
    keeps Sweden and Finland connected to the internet runs across this bridge, a
    silent flow of ones and zeroes. The double-H of its pillars has become an icon
    of Nordic television drama. But you could make it to the final series of The Bridge
    discovering its strangest feature: two-thirds of the way across, it comes to an
    end. At the artificial island of Peberholm, the rail tracks and dual carriageway
    dive into the ground, completing the journey through a tunnel that runs under
    the Drogden Strait. Seen from above, this grand structure looks to be a bridge
    to nowhere.


    The first time I crossed the Øresund, as teenager hitching around Europe, the
    journey still involved a ferry, though you could make out the pillars under construction.
    Since the move to Sweden in my mid-thirties, the crossing has become familiar,
    a journey made few times a year on visits to friends and family in England or
    work trips to other parts of Europe. But this is October 2020 and, for half a
    year now, life has contracted to the small circuit between home, the nearby supermarket
    and my son’s preschool. The restrictions in Sweden have been lighter than elsewhere
    but it still feels improbable that I am making this journey to work with the glass
    museum in the small Danish town of Elbeloft. In my pocket is a letter from'
