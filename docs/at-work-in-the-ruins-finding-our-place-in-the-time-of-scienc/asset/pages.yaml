  md: 'As the second year of the pandemic went on and we moved from the promise that
    the vaccines would bring the whole thing to an end to the prospect of endless
    booster jabs, every three to six months, I found my scepticism growing. This looked
    like a step into a new relationship with our bodies, in which the work of the
    immune system was artificially augmented to a degree beyond anything we had seen.
    I thought once more of Munir Fashe’s Israeli hens, unable to survive without their
    regime of ‘special shots’. When it came to vaccine mandates and passports, I had
    a sense of a threshold being crossed: this was a dark direction for a society
    to take.


    Then, in a matter of weeks, it seemed that the wind had changed and the talk of
    endless boosters began to evaporate. I even read an article in the *Guardian*
    about protests in Australia that didn''t paint everyone opposed to compulsory
    vaccination as a far-right conspiracy theory, which was when I knew for sure a
    cause correction was underway. The latest variant was milder but more infectious,
    we were told, and the vaccines were helping. Another factor, less talked about,
    so that many of us had now experienced the actual disease that the fear of the
    imagined disease – the Covid conjured into our minds by the drastic measures and
    the messages from politicians – was wearing off.


    I won’t pretend I’m at ease with the thought that the divisions opened by the
    pandemic should serve as a template for the politics of the coming years. The
    angry certainties of the Covid war will only lead us deeper into that state of
