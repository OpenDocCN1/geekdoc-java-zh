  md: 'In the case of How to Avoid a Climate Disaster, the threshold comes in the
    opening pages. ‘Every activity in modern life...involves releasing greenhouse
    gases,’ Gates informs us, ‘and as time goes on, more people will be living this
    modern lifestyle.’ Offered as a statement of fact, this leaves no room for the
    possibility that climate change might call into question the activities of modern
    life and the story that frames them – according to which, the lifestyle of the
    Western middle classes in the early twenty-first century represents the destination
    and salvation of humanity, rescued from the hell that was our past and remains
    the present of many of our fellow humans.


    As one of the world''s wealthiest men, enriched by his ownership of the operating
    system on which a good part of what makes modern life was built, you might say
    that Gates has an interest in people buying into this story. But on the way into
    the book, he borrows moral authority from the lives of others for whom modernity
    has yet to arrive, glimpsed in the unlit streets of African cities, seen from
    the window of his private jet, which (he reassures the reader) now runs on sustainable
    jet fuel. Once you get this framing of our situation, the rest is engineering.
    Gates and his team plough through the economy, sector by sector, identifying existing
    solutions and the ‘breakthroughs’ needed to deliver a modern lifestyle to everyone
    on a zero-carbon footprint. That is to say, he builds up a list of technologies
    that have yet to be invented, on which this trajectory would depend.


    The Microsoft founder may only recently turned his attention to the climate crisis
    but others had laid the path on which he wants to take us. Indeed, it even has
    a manifesto: the Ecomonomist Manifesto, published in 2015 by a group of academics,
    journalists and entrepreneurs who declare their intention ‘to use humanity’s extraordinary
    powers in service of creating a good Anthropocene.’³


    One of the most debated essays we ever published at Dark Mountain was Chris Smaje’s
    ‘Dark Thoughts on Ecomonomism’, written in'
