  md: 'small farm future is not to go back but start from where we find ourselves.


    Chris distinguishes two ways of approaching the question of what is to be done:
    ‘shopping aisle ethics’ and ‘peasant ethics’. The former seeks to optimise the
    industrial food chain, reducing waste, promoting veganism and synthetic meat.
    This is the logic of modernity sustainable; given the vastly heavier demands of
    industrial food production, is a tall order to say the least, and if it succeeds
    then it has succeeded in bringing us closer to a fish-tank. The alternative involves
    reconstituting something like the peasant food web in those countries that have
    travelled deepest into industrialisation, and Chris applies his experience as
    both farmer and social scientist to demonstrating the viability of such a path.
    Working from conservative assumptions, he shows that a country like the UK could
    feed itself from this kind of small-scale agriculture by the middle of this century,
    even taking account of significant population growth due to climate-driven migration.


    It is one thing to show that such a future is viable, another to suggest that
    it is desirable, and so it is necessary to address the claims that are often made
    about agricultural modernisation and the lives of peasants. The persistence of
    small-scale farming despite its often predicted demise is testament to people’s
    attachment to a way of life whose advantages elude the statistical gaze. Household
    farming is a source of autonomy which tends to be given up only reluctantly. This
