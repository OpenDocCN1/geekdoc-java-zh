  md: '# TWENTY-TWO


    # No Left Turn


    The first snow was falling and young deer were straying onto the roadside from
    the frozen fields as I drove the thirty miles south from our small town to the
    university city of Uppsala. It was November 2021 and I was about to step out on
    stage for a live audience for the first time in twenty months. The venue was the
    city library; the event, a live recording for a podcast called The Forest of Thought.
    We’d framed the conversation with a question: ‘Does it still make sense to talk
    about climate change?’^1 This would be my first attempt at voicing the thoughts
    that were leading to this book to anyone beyond a handful of close friends.


    The host, Ingrid Rieser, was one of those friends. She and her partner, Isak,
    had both worked at the Centre for Environment and Development Studies in Uppsala
    where I delivered that lecture, seven years earlier, when I started telling the
    students we were all going to die. In recent months, the three of us had been
    talking about the pandemic and the way it changed the context of our work. Tonight,
    Ingrid and I would attempt to map this out for the audience. As we were getting
    upped, I saw Per Johansson taking his seat on the front row.


    Over the course of the next hour, we traced many of the lines of thought that
    I’ve been writing about here. Ingrid spoke of reports she’d heard from COP26,
    the UN climate meeting that had taken place in Glasgow a few weeks earlier: among
    the new players this year were nice stories about climate justice which turned
    out to be a cover for solutions based on AI agriculture and geoengineering. These
    were signs of how the big path is taking shape in practice.'
