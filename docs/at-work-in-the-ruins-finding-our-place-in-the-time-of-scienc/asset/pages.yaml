  md: '# NINETEEN

    When a Society Gets Sick


    The week first lockdowns in Europe were introduced, I had a conversation with
    an old friend whose oddly shaped career included a spell working on pandemic flu
    strategy for the US Department of Defence. ‘I’ve realised something,’ he said.
    ‘A disease is when a person gets sick – but a pandemic is when a society gets
    sick.’


    The best part of two years would go before I came to see the significance of what
    he was telling me. I don’t think either of us saw it at the time.


    Let’s go back to the contrast between the way our societies responded to Covid-19
    and what happened in the flu pandemics of 1957–58 and 1968. This can’t be purely
    explained in terms of the virus being deadliest this time around; there’s something
    deeper going on.


    One explanation is proposed by the British journalist Anthony Barnett in a long
    essay written at the time of the first lockdown. During earlier pandemics, he
    points out, governments did nothing and no one seems to have expected them to
    do anything. So what changed in the intervening decades? Barnett’s answer is that
    ‘an economic, social and political revolution’ took place in the half-century
    beginning in 1968, the implications of which only became visible when Covid-19
    came along:


    > An immense improvement in the standard of life has created a generalised capacity
    to become citizens everywhere. The masters of globalisation did everything possible
    to debilitate'
  merge: -1
  pgno: 183
- img_proc: true
  md: 'agency. They have generated slums and urban poverty and hard drug addiction
    on an unspeakable scale, but sweeping educational, sanitary and technological
    transformations have laid the basis for people to become fully human and this
    has blown away neoliberalism.¹


