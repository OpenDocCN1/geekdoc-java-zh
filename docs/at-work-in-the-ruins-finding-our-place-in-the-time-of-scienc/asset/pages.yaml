  md: '# About the Author


    Douglas Hines is a social thinker, writer and speaker. After an early career as
    a BBC journalist, he went looking for another way of telling stories and what
    he learned led to the creation of a series of organisations including School of
    Everything, Spacemakers and the Dark Mountain Project, which he co-founded with
    Paul Kingsnorth in 2009.


    ![](img/3d5e36685ff1f229bd38467a8cec7d78_288_0.png)


    Originally from the North East of England, Douglas now lives in a small town in
    central Sweden, where he and his partner, Anna Björkman, are creating a school
    called HOME: a gathering place and a community for those who are drawn to the
    work of regrowing a living culture. He publishes a Substack newsletter, Writing
    Home, and co-hosts The Great Humbling podcast with the futurist Ed Gillespie.


    Douglas has collaborated with scientists, artists and activists, including a two-year
    period as leader of artistic development at Rikstarten, Sweden’s national theatre,
    where he held a year-long workshop exploring the role(s) of art under the shadow
    of climate change. He is an associate of the Centre for Environment and Development
    Studies at Uppsala University and a guest lecturer at universities, art and architecture
    schools around Europe.


    At Work in the Ruins is Douglas’s first full-length book, the conclusion of the
    work that began with Uncivilization: The Dark Mountain Manifesto (2009), and his
    second title with Chelsea Green Publishing, following the'
  merge: -1
