  md: 'that must be: ‘There Is No Plan B’. Marks & Spencer started out as a stall
    on Kirkgate Market in Leeds in 1884, which makes it among the oldest names on
    the British high street. The supermarket chains came later. My dad can remember
    when they arrived; my gran would ride halfway across Birmingham and back on the
    buses to claim the frozen chicken you got for five pounds on opening day. If we''re
    saying that the future of life on Earth is at stake, then I''m not sure it’s wise
    to save everything getting to hang on on a way of doing things that’s been around
    for barely a lifetime.


    Around the time the 2018 climate movements emerged, I began to notice a dark certainty
    in some of the voices speaking to us about the existential threat of climate change.
    I''d been talking about surrender and suspect that these speakers would see themselves
    as illusioned, surrendering to what we know and what have good grounds to fear
    about the depth of the trouble we are in, abandoning the vanity of imagining that
    we can take control of and manage the processes of this living Earth. Yet what
    I hear is that note of certainty, knowing how the story ends, and this feels like
    the last thing they are holding onto, that stands in the way of what surrender
    could mean.


    So, my encouragement would be to surrender, yes – to surrender to the mystery,
    not the certainty. Set a place at the table for the stranger who might arrive
