  md: '# Chapter 7: Create, build and run HelloWorld using the Eclipse IDE


    # Starting Eclipse


    When you start Eclipse, the Welcome tab should not appear. (You closed it during
    installation.) If it does, close it. Click on “File”. When the dropdown menu appears,
    click on “Switch Workspace” and select your Hello workspace (I’m using C:\MyCode\workspace-mars-hello).


    # What does the error icon look like?


    Circle with a red triangle containing “!” in the left hand side of the Java editor
    view. The triangle is in the lower right corner. ❌ (quick fixable error) or ❌
    (more complex error).


    # What does the warning icon look like?


    Circle with a yellow triangle containing “!” in the left hand side of the Java
    editor view. The triangle is in the lower right corner. ⚠️ (quick fixable warning)
    or ⚠️ (more complex warning).


    # What’s a folding editor?


    Allows user to hide and reveal blocks of text—usually named. Typically done to
    allow the user to see better overall structure of a document or program.


    # What is a warning?


    Message sent to the user build that warns of some unusually (usually abnormal)
    condition that isn’t serious enough to throw an exception and terminate execution.
    The app will run but probably won’t give the desired results.


    # What is an error?


    Message sent to the user build warns of some error condition that is serious enough
    to throw an exception and terminate execution, possibly serious enough to prevent
    execution. Alternative: Run-time environment internal error or resource problem
    that prevents the application from continuing. Must be fixed before the program
    can run.


    # What is an execution environment JRE?


    Oldest JRE runtime on the target (destination) computer. The JRE used to build
    an app can be a newer version than the runtime version as the build knows what
    the oldest JRE is.


    # What is a CDC-1 execution environment? What is a JRE-1 execution environment?
    What is an OSGi/Minimum execution environment?


    Java 1.0, 1.1 or (sometimes) 1.2 compatible target. Curiosity value only.


    # What is a J2SE-1.x environment?'
