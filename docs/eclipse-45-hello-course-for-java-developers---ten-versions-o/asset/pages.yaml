  md: '# Chapter 1: Why Eclipse 4.5?


    # What books should I read?


    A good book is Lars Vogel''s Eclipse IDE (http://www.amazon.com/Eclipse-IDE-vogella-Lars-Vogel-ebook/dp/B0060IJ39S/ref=sr_1_3?s=books&ie=UTF8&qid=145759814&sr=1-3&keywords=lars+vogel).


    A good very pricey book by Ram Kulkarni''s Java EE Development with Eclipse (http://www.amazon.com/Java-Development-Eclipse-Ram-Kulkarni-ebook/dp/B014HFBN40/ref=sr_1_13?s=books&ie=UTF8&qid=145759962&sr=1-13&keywords=eclipse+computer).


    A useful complex book in the almost useless dead format is Kate Thompson''s Zero
    Bugs and Program Faster (http://www.amazon.com/Zero-Bugs-Program-Faster-Thompson/dp/099619308/ref=sr_1_38?s=books&ie=UTF8&qid=145780123&sr=1-38&keywords=eclipse+computer).
    Only recommended for experienced programmers with good eyes.


    # Why use the Eclipse IDE?


    In 2014 (last year was available), Eclipse (free) has 48% of the IDE market, IntelliJ
    (big bucks) has 33%, NetBeans (free) has 10%, and Spring (free, based on Eclipse)
    has 4%. Unless you want to develop both Java and Android applications using the
    same (well, similar) IntelliJ IDE, Eclipse is the tool of choice, especially at
    frugal companies. (Eclipse is free).


    # Why use Eclipse 4.5?


    It''s the second one Eclipse based on Java 8. It''s solid and reliable.'
