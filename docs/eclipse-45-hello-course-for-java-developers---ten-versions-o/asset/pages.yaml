  md: '# Chapter 8: Create a new project from the Hello project


    Creating a new project from scratch requires a lot of points and clicks. If you
    have a similar project, it is often easier to copy that project to create a new
    one. Eclipse has a refactoring tool that simplifies modifying a copy of an existing
    program.


    # What is a fully qualified name?


    The name of an object with its path (relative to the workspace).


    # What is refactoring?


    The ongoing redesign of software to improve its responsiveness to change. Also
    describes a software tool in an IDE that simplifies redesign.


    # What is the launcher (design pattern)?


    Design pattern that uses a class with a main to start an application. Usually
    the other classes in the application do not have mains, preventing them from being
    misused.


    # What’s a launcher?


    Class with a main method and little else. All it does is launch the application.


    # Exercise 8-1: Make a copy of the Hello project and name it HelloArgs


    # Possible Mistep 8-1


    Close the Hello project then right click on the project. When the dropdown menu
    appears, click on “Copy”. Right click on a blank of the Project Explorer. When
    the dropdown menu appears, click on “Paste”. Oops. Error about “can’t copy the
    clipboard...”. What went wrong? When a project is closed, all copies are the fully
    qualified name of the project (in this case, “Hello”). To copy the project (the
    object), it must be open.


    If Hello is closed, right click it in the Project Explorer main window. When the
    dropdown appears, click on “Open Project” (or, double click on Hello). Right click
    on the Hello project in the Project Explorer main window. When the dropdown menu
    appears, click on “Copy”. Right click on a blank region below the project. When
    the dropdown appears, click on “Paste”. When the “Copy Project” popup appears,
    enter the project name “HelloArgs” then click “Finish”.


    # Possible Mistep 8-2


    If you are working in a project that is similar to another open project, it is
    easy to accidentally make changes to the wrong project. Avoid this problem by
    right clicking on the project you want to work on. When the dropdown appears,
    click on “Close Unrelated Projects”. When the “Close Unrelated Projects” popup
    appears, click on “OK”.


    Click on the “>” icon in front of HelloArgs to expand the project. Drill down
    to HelloWorld.java, then click on it. When the dropdown appears, click on “Refactor>Rename”.
    When the “Rename Compilation Unit” popup appears, enter the new name'
