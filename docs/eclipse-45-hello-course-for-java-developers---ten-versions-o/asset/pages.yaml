    \ people will curse you on the day when the deprecated class or method is no longer\
    \ supported.\n\n# What is DI (Dependency injection)?\n\nDesign pattern that implements\
    \ inversion of control for software libraries. A caller delegates to an external\
    \ framework the control of discovering and importing a service module specified\
    \ or \"injected\" by the caller. There are three common forms of dependency injection:\
    \ setter, interface- and constructor-based injection, where responsibility of\
    \ injecting the dependency lies upon the client, the service or the constructor\
