  md: '# ## Chapter 11: Add a factory to improve Hello separation


    What can be assigned to a class reference?


    Null or an object of the class or an object of some child class of that. No object
    of a parent class can be assigned to the reference. Warning: The only thing the
    reference can do is call methods in the original interface.


    What can be assigned to an interface reference?


    Null or an object of some (already defined) class that implements the interface
    or an object of some child class of that class or object of some class that implements
    a child of the interface. No object of a class that implements a parent interface
    can be assigned to the interface. Warning: The only thing the reference can do
    is call methods in the original interface.


    What''s a child class?


    Another name for subclass.


    What''s a factory (factory class)?


    Class or object that creates other classes or objects, either by composition or
    extension.


    What''s a parent class?


    Another name for superclass.


    What''s a reference?


    Data element that has a type and whose value is an address (on the heap) of an
    object of that type or of a child type. Former C programmers might think of a
    reference as a pointer with self-control.


    What''s a class reference?


    Reference to an object that only knows about the characteristics and behaviors
    of the object''s (already existing) class or of some parent class.


    What''s a child reference (child class reference)?


    Reference to an object of some (already defined) child class.


    What''s a parent reference (parent class reference)?


    Reference to a parent class (superclass). A parent class reference can be assigned
    to child object but it can only the parts of the object inherited from its parent
    class.


    What''s an interface reference?


    Reference to an object that only knows about the behaviors of some interface implemented
    by the object''s class.


    Why do I care about class references and interface references?


    They can reduce coupling and simplify coding.'
