    # What is @Override


    Informs the compiler that you intend to override a method in the superclass. If
    the compiler does not detect the method in one of the superclasses, it will generate
    an error.

    Note: Quickly identify typos or API changes.


    # What is coupling?


    The relative complexity of the interfaces between code elements (the relative
    independence of code elements). The phrase "loose coupling" describes simple or
    minimum coupling (little complexity) (good design) while "tight coupling" describes
    complex or maximum coupling (much complexity) (bad design). It describes the relative
    independence of modules (a good thing).


    # What is a provider?


    Class or method that provides something other classes need, usually information.

    Alternative: A factory of swappable factories (implements the abstract factory
    pattern).

    Reduces coupling.


    # What is a renderer?


    Class or method that encodes and decodes information in a format that other classes
    or methods can understand. Reduces coupling.


    # What is SoR (Separation of Responsibilities)?


    A class should be (1) responsibility over a single part of the software functionality
    and (2) that responsibility should be entirely encapsulated by the class. All
    its services should be narrowly aligned with that responsibility. Alternative:
    Each class should do a very few things and do them completely.


    # What is an annotation?


    Form of metadata provides information about a program that is not part of the
    program itself (has no direct effect on the operation of the code it annotates).
    (1) information for the compiler (it can use them to detect errors or suppress
    warnings), (2) compile-time and deployment-time processing (software tools can
    process annotation information to generate code, XML files, and (3) runtime processing
    (it can be examined at runtime). Note: Java and Android annotations begin with
    "at" (@).


