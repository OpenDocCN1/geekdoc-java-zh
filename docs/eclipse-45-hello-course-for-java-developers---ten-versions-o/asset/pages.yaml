    Process of identifying errors in a program, locating the cause of errors and fixing
    the-errors.


    # ### What is a breakpoint (break point)?


    Location and/or conditions at a location in source where the debugger temporarily
    halts program execution so the developer can examine variable values before continuing
    program execution.


    # ### What does "Toggle breakpoint" mean?


    Turn on a breakpoint at the location of the mouse cursor if there is no breakpoint.
    Disable the breakpoint if one is there and turned on.


