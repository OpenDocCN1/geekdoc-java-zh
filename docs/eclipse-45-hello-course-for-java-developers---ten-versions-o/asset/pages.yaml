  md: '# ## Chapter 4: Eclipse 4 terms


    # ### What''s a build (noun)?


    A build project resource created by a builder from other resources of that project.
    Build (verb) is what a builder does.


    # ### What''s a builder?


    A tool that converts one or more resources in a project into another resource
    (called a build) in the project. All eclipse builders are incremental - after
    full build (sometimes called a “build all”), the builder only builds what has
    changed since the last build (sometimes called a “rebuild”). A builder is always
    associated with a project.


    # ### What''s a full build?


    A build where all resources in the project are built.


    # ### What''s an autobuild?


    An incremental build triggered automatically because (1) a resource has changed
    and (2) the autobuild feature is on. Note: unless you are doing something unusual,
    autobuild should be on!


    # ### What''s an incremental build?


    A partial build that starts with the results of a previous build and only modifies
    what''s been changed. Faster!


    # ### What''s a bundle?


    A mechanism for grouping, delivering, and managing content. Think of bundles as
    the implementation of components in Eclipse. There is no distinction in Eclipse
    between bundles and plug-ins. Note: Every bundle has its own classloader and its
    own manifest.mf file.


    # ### What''s a facet?


    A facet is a unit of functionality that can be added to a project. Java is a facet.
    (And a feature. And several other things.)


    # ### What''s a feature?


    Group of related plug-ins. (JDT is a feature, for example.)


    # ### What''s a file?


    A virtual (or actual) file associated with a project or a folder in a project
    in an Eclipse workspace.


    # ### What''s a folder?


    A virtual (or actual) directory associated with a project in an Eclipse workspace.
    Folders are useful tools for storing project resources hierarchically.


    # ### What''s a perspective?'
  merge: -1
