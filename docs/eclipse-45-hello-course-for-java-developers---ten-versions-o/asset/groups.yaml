    `import org.springframework.beans.factory.xml.XmlBeanFactory;`\n\n在导入列表的底部，错误消失了。但是，为什么\
    \ `XmlFactory` 下有波浪线？Eclipse 警告 `XmlBeanFactory` 已弃用。但仍然支持。此外，`FileSystemResource`\
    \ 处的错误可以通过右键点击“import 'org.springframework.core.io.FileSystemResource'”来解决。错误消失了。\n\
    \n你看到任何错误了吗？你看到了警告（如“factory can only be null”）之类的吗？运行它。一切似乎运行正常。\n\n# 练习 13-2：使用\
