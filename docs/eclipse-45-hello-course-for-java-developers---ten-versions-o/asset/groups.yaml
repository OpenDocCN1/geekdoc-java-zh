    \n# 什么是提供者（provider）？\n\n提供其他类需要（通常是信息）的类或方法。\n替代方案：一个可交换工厂的工厂（实现抽象工厂模式）。\n减少耦合。\n\
    \n# 什么是渲染器（renderer）？\n\n以其他类或方法可以理解的格式对信息进行编码和解码的类或方法。减少耦合。\n\n# 什么是 SoR（职责分离）？\n\
    \n一个类应该：(1) 负责软件功能的某一部分，并且 (2) 该职责应该完全由类封装。它所有的服务都应该与该职责紧密对齐。替代方案：每个类应该做非常少的事情，并完全地完成它们。\n\
