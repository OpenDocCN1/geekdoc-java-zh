    # What’s an IDE?


    Acronym for Integrated Development Environment, a development tool with a WIMP
    interface.


    ## What should I know before I start installing?


    Where to install eclipse, what version of eclipse IDE, 32- or 64-bit Windows,
    directory that will contain workspaces. Warning: Don’t use spaces in directory
    of file names. It may not matter. But, it might. Don’t do it!


    | Option | Suggestion |

    |---|---|---|

    | Where should I install Eclipse? | Under a root directory named Eclipse. You
    can install multiple versions of Eclipse in this directory. |

    | What version of Eclipse should I install? | Mars EE (Eclipse 4.5.1) |

    | Do I have 32- or 64-bit Windows? | You’ll have to find out by running “System
    Information”. |

    | What directory will contain workspaces? | To avoid privileges issues, create
    a root (C:\ directory named MyCode (no spaces). |

    | Should you avoid spaces in names? | Absolutely. It may not hurt. But, it might.
    |


    ## Installation


    **Warning: The fundamental rule for all installations is don’t change anything
    you are not absolutely sure you understand.**


    ### Step 1: What release (version) to install?


    Either install the current version of Eclipse (Eclipse 4.5.1, Mars in January,
    2016) or whatever version your company uses. Warning: Never install a new version
    (of any kind of software) until two or three months after its release. (“Never
    use version x.o.”) Eclipse releases in June so install the previous version in
    June and July.


    If you install version 4.3 or newer, you will be using Java 8 by default. If you
    install version 4.2 or 3.7, you will be using Java 7 by default.


    Before you go to Step 2, you should know the version of eclipse you want to install.


    ### Step 2: What type to install (classic ide, standard ide, Java ide or Java
    EE ide)?


    If you install the “classic” version of eclipse (3.7, 4.2), you will have to manually
    install a build system, desktop development tools, Java development tools, a version
    control system, and XML tools. (Not recommended.)


    If you install the “standard” version of eclipse (4.3), you will have to manually
    install a build system and XML tools. (Not recommended.)


    If you install the Java ide version of eclipse (4.3 or newer), you will not have
    to manually install any of the above. (Not recommended if you plan on doing databases
    or web development.)


    If you install the Java EE ide version of eclipse, you also get data tools and
    a bundle of web development tools. The ide is a little more complex but you don''t
    have to learn a slightly different ide if you have to move to EE.


    Before you go to Step 3, you should know the version and type (Classic ide, Standard
    ide, Java ide, or Java EE ide).


    ### Step 3: 32- or 64-bit Windows?


    If you are running Windows, you need to know if you are running 32-bit or 64-bit
    Windows. Click on the Start icon, click on “All apps->Windows Administrative Tools->System
    information”. Look for “System Type”.


    Before you go to Step 4, you should know what version of Windows you have.


    ### Step 4: Go to the eclipse website


    Go to https://www.eclipse.org/ide/


    ## Desktop IDEs


    Eclipse is famous for our Java Integrated Development Environment (IDE), but your
    C/C++ IDE and PHP IDE are pretty cool. You can combine language support and other
    features into any of our default packages, and the Eclipse Marketplace allows
    for virtually unlimited customization.


    ![](img/2747eedc6aaaaf4cb50e73a6f812e6a8_20_0.png)


    Select Java IDE or Java EE (recommended). Select the release you want.


    ## Eclipse Mars 1 Packages


    | | | | |

    |---|---|---|---|

    | Eclipse IDE for Java Developers | 275 MB - Downloaded 2,237,908 Times | Windows
    32-bit 64-bit Mac 64-bit Linux 32-bit 64-bit |

    | Eclipse IDE for C/C++ Developers | 176 MB - Downloaded 1,908,741 Times | Windows
    32-bit 64-bit Mac 64-bit Linux 32-bit 64-bit |

    | Eclipse IDE for Embeddedters 4.5.1 | 241 MB - Downloaded 434,074 Times | Windows
    32-bit 64-bit Mac 64-bit Linux 32-bit 64-bit |

    | Eclipse IDE for PHP Developers | 153 MB - Downloaded 276,840 Times | Windows
    32-bit 64-bit Mac 64-bit Linux 32-bit 64-bit |

    | Eclipse IDE for Java and DSL Developers | 296 MB - Downloaded 168,315 Times
    | Windows 32-bit 64-bit Mac 64-bit Linux 32-bit 64-bit |


    Select OS.


    ## Eclipse IDE for Java Developers


    The essential tools for any Java development, including a Java IDE, a Git client,
    web tools for integration and WebBuilder. This package includes:


    - Eclipse Git Team

    - Eclipse Development Tools

    - Maven Integration

    - Mylyn Task List

    - Code Reminders Tools for Java Developers

    - Windows Core

    - Eclipse XML Editor and Tools


    Detailed features


    Maintained by: Eclipse Packaging Project


    Download Eclipse. Warning: You may get ''gifts'' from one of the Members. To avoid
    complications, click on the left side down button.


    Note: The name of the file (win32-x86_64.zip) tells you that you are going to
    download the 64-bit version of the file. Wait patiently! (BTW: The donation is
    optional).


    Step 5: Unzip and deploy Eclipse.


    In File Manager, go to the download directory, right click on the zip file and
    select "extract all" and select the default destination. You may find it helpful
    to put the eclipse file system inside a directory named Eclipse. When eclipse
    releases a new version, you can install the new version next to the current version.


    Step 6: Decide where you are going to save your source files


    Drill down to eclipse.exe. Double click on it. Wait! When you select a workspace,
    the Welcome screen appears. Note: The name of the file (win32-x86_64.zip) tells
    you that you are going to download the 64-bit version of the file. Wait patiently!
    (BTW: The donation is optional).


    Step 7: View the Welcome screen


    After you''ve selected the workspace, the Welcome screen appears. Look through
    the links on the page. Once you''ve done, close the Welcome window by clicking
    the x.


    Step 8: Look at help


    When the workbench pops up, click on “Help”. Look through the help. Note: You
    can get back to the Welcome screen through the Help menu.


    Step 9: Look at your workspace


    (This may require privilege tweaking.) Use File Manager to look at your workspace.
    The .metadata folders indicate you’re in a workspace. You may also see a directory
    called RemoteSystemsFiles. It’s a free gift from eclipse that was created by the
    remote systems. Ignore it. Or, google it and note how many users want to make
    it go.)


    Step 10: Set helpful defaults


    Click on “Windows-Preferences”. Scroll through the top-level preferences. You
    will spend most of your time in the Java top-level preferences, the rest in the
    General. Ignore the others for now.


    Go to “General-Startup and Shutdown-Workspaces” and select your workspace for
    the Hello projects and click on “Apply”. Shrink the General sub-preferences.


    Go to “Java-Build Path-Installed JREs-Execution Environment”. Click on “JavaSE-1.8”
    (compatible with jdk 8 and higher) then click on the checkbox next to a jre currently
    installed in your environment.


    Click on “OK” to close the Preferences window.


    Step 11: Look through all the dropdowns and mouse over all the icons


    You may need to click on a blank space on the tool bar to close a dropdown or
    a tool popup (no program is perfect.). Grayed out dropdowns and buttons are currently
    disabled.


    Step 12: Done


    You’ve successfully installed eclipse. Congratulations.


    **Where do I find on-line help for mars?**


    Go to http://help.eclipse.org/mars/index.jsp.


    **Where do I find the meaning of Eclipse icons for mars?**


    Look in http://help.eclipse.org/mars/index.jsp?topic=%2org.eclipse.jdt.doc.user%2FPreference%2Fref-icons.htm.

