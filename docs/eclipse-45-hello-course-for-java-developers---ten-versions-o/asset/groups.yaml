    # Chapter 0: Getting Started


    # Prerequisites


    Students must:


    +   - Have some experience with Java. (If you can''t write the HelloWorld.java
    program, compile it and run it, you don''t have the background to succeed in this
    class.)


    +   - Have a memory stack (4GB or bigger) and bring it to every class.


    # Terminology


    | Terminology | Description |


    | Click | Left click on a screen object. Unless right is in front of the word
    click, always a left click. |


    | Highlight | Drag mouse from left to right to highlight. Sometimes, just clicking
    anywhere on the selection is enough to highlight it. |


    | Mouse over | Move the mouse on top of a tool icon and pause. A hint should pop
    up. |


    | Right click (Right-click) | Right click on a screen object. |


    # Typefaces


    The following terminology is used when describing Java syntax.


    | Typefaces | Description |


    | Courier plain text | required |


    | Courier bold text | default |


    | Courier italics | user-defined |'
