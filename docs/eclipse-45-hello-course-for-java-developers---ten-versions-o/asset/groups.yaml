    # 练习 8-2：将 Hello 项目复制 HelloLauncher


    如果 HelloArgs 仍然打开，请将其关闭。打开并复制 Hello 项目，将其命名为 HelloLauncher。右键点击 HelloLauncher。当下拉菜单出现时，点击“Close
    Unrelated Projects”（关闭无关项目）（只有当 Project Explorer 中有两个或多个项目时才会出现）。将 HelloLauncher
    设置为展开项目，向下查找 resource 文件夹直到找到“default package”。右键点击“default package”。当下拉菜单出现时，点击“New->Class”。当“New
    Class”向导弹出时，输入名称“HelloLauncher”。不要忘记点击“...main...”和“Generate ...”标签旁的复选框。点击“Finish”。当
    HelloLauncher.java 在 Java 编辑器中出现时，将 TODO 注释替换为语句：


    ```

    HelloWorld h = HelloWorld (“Hello from HelloLauncher and Eclipse”);

    ```


    语句的最左侧会出现一个错误（准确地说，是一个快速错误消息）。当你点击错误图标时，会弹出 Quick Fix（快速修复）。顺便说：语句右侧滚动条中的红线也是一条错误消息。在大文件中，点击细红线将直接带你到错误语句。此外，你还可以通过计算细红线的数量来估算文件中的错误数量。然而，点击细红线不会弹出
    Quick Fix。


    在这种情况下，Quick Fix 只有部分帮助。问题是 HelloWorld 没有一个接受字符串作为参数的构造函数，因此你必须修改 HelloWorld.java。保存
    HelloWorld.java。


    打开 HelloWorld 编辑器窗口。


    在类内部、main 方法的 Javadoc 注释上方添加成员：


    ```

    private String message;

    ```


    顺便说一下：注意看 Outline 选项卡中 detail 和 task 区域刚刚发生了什么。如果语句格式化不正确，右键点击该行。当下拉菜单出现时，点击“Source->Format
    element”。注意该变化。


    右键点击数据成员下方的行。当下拉菜单出现时，点击“Source->Generate Getters and Setters”。当“Generate getters
    and setters”向导弹出时，勾选“message”和“Generate method comments”复选框，然后点击“OK”按钮。注意源码和 Outline
    选项卡中的更改。


    右键点击 main 方法 Javadoc 注释上方的行。当下拉菜单出现时，点击“Source->Generate constructor using fields”。构造函数已创建。


    最后，高亮 main 方法体并将其删除。


    保存 HelloWorld.java 然后重新打开 HelloLauncher.java 编辑器。如果你仍然看到错误，可能需要通过再次保存文件来刷新编辑器。现在，你不应该再看到错误了。但在编辑窗口的最左侧有一个快速修复图标（带有“i”的黄色三角形）。将鼠标悬停其上查看消息。噢，是的，h
    被创建但从未被使用。在创建 h 的语句下方插入此语句：


    ```

    System.out.println( h.getMessage() );

    ```


    警告图标消失了，因为 h 现在在 println 方法中被使用了！（如果你仍然看到警告，保存文件后警告将会消失。）选择整个方法，右键点击它。当下拉菜单出现时，格式化该方法。


    右键点击项目。当下拉菜单出现时，点击“Run As->Java Application”。弹出“Select Java Application”对话框，是因为你项目项目中有两个带有方法的类。顺便说一下：如果你还没有保存对
    HelloWorld.java 的更改，会弹出“Save and Launch”（保存并启动）对话框。高亮 HelloWorldLauncher 类并点击“OK”。你应该会在
    Console 中看到欢迎信息。如果没有看到任何错误或警告指示，说明你成功了。


    # 可能的错误 8-4


    你有两个带有 main 方法的类。如果你右键点击项目并使用“Run As->Java Application”，哪个类会运行？在这种情况下，很容易看出：HelloWorld
    没有 main 方法体，所以如果运行它，Console 选项卡中不会显示任何内容；HelloWorld 有 main 方法体，所以如果运行它，“Hello...”应该出现在
    Console 选项卡中。再次试一次。Eclipse 会保护你：弹出“Select Java Application”并显示两个带有 main 方法的类。你必须在运行程序之前选择其中一个。


    为了避免这个问题，移除鼠标所在位置断点。“Save and Run”向导启动了 HelloLauncher.java。这正是我们所希望的。


    # 问题


    所有这些问题都假设项目是打开的。

    还有什么其他方法可以打开关闭的项目？


    为什么“File->Close”不关闭已打开的项目？


    ## 第 9 章：调试 HelloLauncher


    ### 什么是调试


    识别程序中的错误、定位错误原因并修复这些错误的过程。


    ### 什么是断点 (break point)？


    源代码中某个位置的位置和条件，调试器在此处临时停止执行，以便开发者检查变量值。


    ### “Toggle breakpoint”（切换断点）意味着什么？


    如果光标处没有断点，则在该处开启断点；如果已有开启的断点，则将其禁用。


    ### 练习 9-1：调试 HelloLauncher


    在 Project Explorer 中，展开“HelloLauncher”并打开 HelloLauncher.java。右键点击编辑器最左侧对应 main
    方法中“System...”语句的横条。当下拉菜单出现时，点击“Toggle breakpoint”，条上会出现一个带有小箭头的深色圆圈（表示激活的断点）。右键点击箭头。当下拉菜单出现时，点击“Toggle
    breakpoint”，断点将消失。设置断点后，右键点击它。当下拉菜单出现时，选择“Disable breakpoint”，条上会出现一个浅色圆。第三次，点击“Enable
    breakpoint”，圆将再次变深。


    在 Project Explorer 中，右键点击 HelloLauncher 项目。当下拉菜单出现时，选择“Debug as ->Java Application”。当弹出“Confirm
    Perspective Switch”窗口时，点击“Yes”（不要勾选“Remember my decision”旁边的复选框）。视图分组中添加了第三视图“Debug”，并成为当前视图。然后，Project
    Explorer 的“main”区域被切换为 Debug 的“main”区域。


    下方显示了一张图片。研究你所获得的新信息。鼠标悬停所有七个调试按钮上。悬停在“Console”选项卡右侧的图标上。


    ![](img/2747eedc6aaaaf4cb50e73a6f812e6a8_48_0.png)


    点击“Terminate debugging”（终止调试）按钮。你仍处于“Debug”视图。为了清除混乱，右键点击“Debug”视图。当下拉菜单出现时，点击“Close”（关闭），然后点击“Java
    EE”视图图标。


