    ## Chapter 9: Debugging HelloLauncher


    ### What is debugging


    Process of identifying errors in program, locating the cause of errors and fixing
    them.


    ### What is a breakpoint (break point)?


    Location and conditions at a location in source where the debugger temporarily
    halts execution so the developer can examine variable values.


    ### What does "Toggle breakpoint" mean?


    Turn on a breakpoint at the location of the cursor if there is no breakpoint.
    Disable the breakpoint if one is there and turned on.


