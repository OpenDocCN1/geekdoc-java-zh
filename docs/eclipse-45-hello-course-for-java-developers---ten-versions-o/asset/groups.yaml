    ![](img/2747eedc6aaaaf4cb50e73a6f812e6a8_32_0.png)


    ### What’s the difference between the Project Explorer view and the Package Explorer
    view?


    The Project Explorer is a hierarchical view of the artifacts in the Workbench
    (customized by the specific configuration of your Workbench). It can be used for
    many languages and project types. Additional plugins contribute “extra information”
    to the Project Explorer view making it much more “sophisticated”. For example,
    when the JDT (Java developer plugins) is installed in the Project Explorer, many
    of the features in the Package Explorer (part of JDT) appear in the Project Explorer
    when it is used for java projects.


    **What’s the outline view?**


    In the Java and Java EE perspectives, the outline tab in the outlines and tasks
    regions shows the currently selected class. It is always visible in these perspectives.


    ### What’s the problem view (problem tab)?


    In the Java and Java EE perspectives, the problem tab in the output region showing
    errors and warnings. You normally have to bring the problem view by clicking on
    “Window->Show View->Other->General->Problems".


    ### Where can I find information about the icons used in the IDE?


    For Mars, look in http://help.eclipse.org/mars/index.jsp?topic=org.eclipse.jdt.doc.user/preference/ref-icons.htm.
    For Luna, look in http://help.eclipse.org/luna/index.jsp?topic=org/eclipse.jdt.doc.user/reference/ref-icons.htm.


    Where do I find on-line help for Eclipse?


    Try http://help.eclipse.org/mars/index.jsp?topic=org.eclipse.jdt.doc.user/preference/ref-icons.htm.


    ### Where do I find eclipse error logs?


    Look in the .metadata folder.


    ## Creating basic Java apps using Eclipse


    ## Chapter 7: Create, build and run HelloWorld using the Eclipse IDE


    ### Starting Eclipse


    When you start Eclipse, the Welcome tab should not appear. (You closed it during
    installation.) If it does, close it. Click on “File”. When the dropdown menu appears,
    click on “Switch Workspace” and select your Hello workspace (I’m using C:\MyCode\workspace-mars-hello).


    ### What does the error icon look like?


    Circle with a red triangle containing “!” in the left hand side of the Java editor
    view. The triangle is in the lower right corner. ❌ (quick fixable error) or ❌
    (more complex error).


    ### What does the warning icon look like?


    Circle with a yellow triangle containing “!” in the left hand side of the Java
    editor view. The triangle is in the lower right corner. ⚠️ (quick fixable warning)
    or ⚠️ (more complex warning).


    ### What’s folding?


    Allows user to hide and reveal blocks of text—usually named. Typically done to
    allow the user to see better structure of a document or program.


    ### What is a warning?


    Message sent to the user build warns of some (usually abnormal) condition that
    isn’t serious enough to throw an exception and terminate execution. The app will
    run but probably won’t give the desired results.


    ### What is an error?


    Message sent to the user build warns of some error that is serious enough to throw
    an exception and terminate execution, possibly serious enough to prevent the application
    from continuing. Must be fixed before the program can run.


    ### What is an execution environment JRE?


    Oldest JRE on the target (destination). The JRE used to build an app can be a
    newer version than the runtime as the build knows what the JRE is.


    ### What is a JDK environment?


    Java 1.0, 1.1 or (sometimes) compatible target.


    ### What is Java2SE-1x environment?


    Java2SE 1.1, ..., or compatible target.


    ### What is a JavaSE-1x environment?


    Java2SE 1.6, or 1.7 execution environment.


    ### What is code folding?


    Editor''s ability to compress and expand code, markup, and blocks. Code folding
    simplifies navigating through large files.


    ### What is “drill down”?


    In tree structures (like file system), clicking on nodes to get to some special
    place. For example, click on C: drive to see the root directories, then click
    on Windows to see the directories, clicking on System32 to see the software.


    ### What is Javadoc?


    Tool that parses the declarations and documentation comments in a set of source
    files and produces a set of HTML pages describing the classes, interfaces, methods,
    and fields.


    ### How do I recognize a Javadoc comment?


    Begins with /**, have multiple lines, and ends with */. (Not the same as a comment
    begins with /* and ends with */).


    ### How do I see Javadoc?


    Open the Javadoc view. (Click on Window). When the dropdown appears, click on
    “Show View->Javadoc”. A Javadoc tab will appear in the output region.


    ### What is scope?


    Characteristic of a type or data item describes the region where the type or data
    item can be safely used without conflict or confusion. Class scope, local scope
    and module scope.


    ### What is the difference between a closed project, an open project and an expanded
    project?


    In Project Explorer, a closed project is a single line with a closed folder icon
    and the project name; an open project is a single line with a “>” icon, an open
    file icon, and the project name; an expanded project is on multiple lines, down
    arrow icon, open file icon (the project name on the first line and then a list
    of resources directly under the project).


    ### How do I change a closed project into an open project?


    Double click on the closed folder icon.


    ### How do I change an open project to an expanded project?


    Double click on the open folder icon. Or, just click on the “>” icon. BTW: In
    general, clicking on the “>” means “Show the next layer”.


    ### How do I change an open or expanded project into a closed project?


    Right on the project name. When the dropdown appears, click on “Close Project”.


    ### What’s the difference between the Project Explorer and the Package Explorer?


    The Project Explorer shows all projects. The Package Explorer shows a single project.


    ### Exercise 7-1: Create a Hello1


    You create projects in the Project Explorer tab in the “picture” region.


    ### Possible misstep 7-1


    Right click on the tab at the top of Project Explorer main window. A dropdown
    with the entry “close” pops up. Click on “close”. What happens? BTW: You can get
    back to the default IDE regions and formats by right clicking on the “Java EE”
    icon at the far right selecting “reset”.


    ![](img/2747eedc6aaaaf4cb50e73a6f812e6a8_37_0.png)


    Right click on the Project Explorer main window (not one at the top). When the
    “New->Project” When the dropdown appears, click on “Java->Java Project” then click
    on “Next”. When the “Create a Java Project” wizard appears, click the project
    name (Hello1) click on the checkbox to “Use default location”, and click on “Finish”.


    When the “Open Associated Perspective?” popup appears, click on “Yes”. (Don’t
    click “Remember my decision”). Never change a default until you understand the
    implication of changing it!) Notice you now have two perspectives, Java EE and
    Java. (What is the current perspective? Which one is highlighted?)


    ### Possible misstep 7-2


    What happened to the toolbars when “Java” became the current perspective? What
    happened in the “picture region” when Java became the current perspective? Click
    on the “Java EE” icon to make Java EE the current perspective. Same questions.
    If you''re not seeing what you expect in the toolbars or in the picture region,
    you may be in the wrong current perspective. BTW: What buttons appear in the “Java”
    perspective toolbars that are missing in the “Java EE” toolbars?


    ### Possible misstep 7-3


    What happened in the “picture region”? Bring back the Project Explorer tab in
    the “picture region” by clicking on “Window->Show View->Project Explorer”. You
    should see a Package Explorer tab and a Project Explorer tab in the “picture region”.


    Using File Manager, go in your workspace directory for the Hello1 project (it
    should be there). In File Manager, expand the Hello1 directory if it''s not opened.
    What folders and files do you see under the project name? Source folders named
    .settings, bin (maybe), and src as well as the .classpath and .project files.


    ### Possible misstep 7-4


    Why do you see strange icons instead of the file and directory names? These are
    “dot” files (they don''t have a name in front of dot). “dot” files and folders
    are usually treated as invisible. BTW: In File Manager, go back to workspace directory.
    Double click on the “dot” file with the package icon. Notepad or some other editor
    will bring up the “.log file”. You can see what errors has been written to “log”
    since you installed it.

