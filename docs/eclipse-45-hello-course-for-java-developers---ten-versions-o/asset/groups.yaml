    popup appears, click on “Yes”. (Do not click on the checkbox next to “Remember
    my decision.”) A third perspective “Debug” is added to the perspective grouping
    and it becomes the current perspective. Then, the Project Explorer “main” region
    is swapped for the Debug “main” region.


