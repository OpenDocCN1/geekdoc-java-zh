    所有这些问题都假设项目是一个已展开的项目。\n\n# 第 13 章：使用 DI（依赖注入）进一步减少耦合\n\n程序员可能会认为，在编译代码之前，仍然必须为每种不同的消息创建并添加新类。对于\
    \ `HelloSeparationWithInterfacesAndFactory2` 中使用的简单工厂类来说，确实如此。但是通过更智能的工厂（例如 Spring\
    \ Framework 提供的），可以通过编辑文本文件无需重新编译即可更改消息。\n\n# 什么是已弃（deprecated）？\n\n过时的，不推荐（但可能仍然支持）。顺便说一句：如果你使用了已弃类或方法，当这些类或方法不再被支持的那一天，人们会埋怨你的。\n\
    \n# 什么是 DI（依赖注入）？\n\n一种实现软件库控制反转（IoC）的设计模式。调用者将发现和导入由调用者指定或“注入”的服务模块的控制权委托给外部框架。依赖注入有三种常见形式：基于\
    \ setter 的注入、基于接口的和基于构造函数的注入，其中注入依赖的责任分别由客户端、服务或构造方法承担。Spring 广泛使用了 DI。\n\n# 练习\
    \ 13-1：使用 SpringAndSpring2 改进 Hello 分离\n\n复制 `HelloSeparationWithInterfacesAndDI`。在\
    \ `HelloMessageProvider.java` 中修改消息字符串。如果没有错误，运行应用程序。如果一切看起来运行正常，则继续。否则，修复问题。\n\
    \n在与 \"src\" 同级目录下创建一个空的 \"beans.xml\"，并插入以下行：\n\n```xml\n<xml version=\"1.0\"\
    \ encoding=\"UTF-8\"?>\n<!DOCTYPE beans PUBLIC \"-//Spring//DTD Spring Beans 2.0//EN\"\
    \ \"http://www.springframework.org/dtd/spring-beans.dtd\">\n<beans>\n  <bean id=\"\
    renderer\" class=\"HelloRenderer\">\n    <property name=\"messageProvider\">\n\
    \      <ref local=\"provider\"/>\n    </property>\n  </bean>\n  <bean id=\"provider\"\
    \ class=\"HelloMessageProvider\"/>\n</beans>\n```\n\n# 可能的失误 13-1\n\n当你将 xml 粘贴到\
    \ `beans.xml` 时，格式丢失了。你是通过手动编辑 xml 来修复它的吗？如果是，你就浪费了时间。你处于 xml 编辑器中，所以它知道如何格式化\
    \ xml。选中这些行，然后右键点击高亮部分。当弹出菜单时，点击“Source->Format”。xml 格式就会重新出现。\n\n（为什么这有效？.xml\
