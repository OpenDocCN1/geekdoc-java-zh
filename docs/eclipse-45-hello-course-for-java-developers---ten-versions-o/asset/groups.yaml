  mdcn: "\n\n![](img/2747eedc6aaaaf4cb50e73a6f812e6a8_32_0.png)\n\n### 项目资源管理器（Project\
    \ Explorer）视图和包资源管理器（Package Explorer）视图有什么区别？\n\n项目资源管理器是工作区中制品的分级视图（根据你工作区的特定配置自定义）。它可以用于许多语言和项目类型。额外的插件为项目资源管理器视图提供了“额外信息”，使其变得更加“复杂”。例如，当项目资源管理器安装了\
    \ JDT（Java 开发者插件）时，当用于 Java 项目时，包资源管理器（JDT 的）中的许多功能会出现在项目资源管理器中。\n\n**大纲视图（outline\
    \ view）是什么？**\n\n在 Java 和 Java EE 视图中，大纲和任务区域的大纲标签页显示当前选中的类。它在这些视图中始终可见的。\n\n\
    ### 问题视图（problem view，问题选项卡）是什么？\n\n在 Java 和 Java EE 视图中，输出区域的问题选项卡显示错误和警告。你通常需要点击“窗口(Window)->显示视图(Show\
    \ View)->其他(Other)->常规(General)->问题(Problems)”来调出问题视图。\n\n### 我可以在哪里找到 IDE 中使用的图标信息？\n\
    \n对于 Mars 版本，请查看 http://help.eclipse.org/mars/index.jsp?topic=org.eclipse.jdt.doc.user/preference/ref-icons.htm。对于\
    \ Luna 版本，请查看 http://help.eclipse.org/luna/index.jsp?topic=org/eclipse.jdt.doc.user/reference/ref-icons.htm。\n\
    \n我可以在哪里找到 Eclipse 的在线帮助？\n\n尝试访问 http://help.eclipse.org/mars/index.jsp?topic=org.eclipse.jdt.doc.user/preference/ref-icons.htm。\n\
    \n### 我可以在哪里找到 eclipse 错误日志？\n\n查看 .metadata 文件夹。\n\n## 使用 Eclipse 创建基础 Java \n\
    \n## 第 7 章：使用 Eclipse IDE 创建、构建和运行 HelloWorld\n\n### 启动 Eclipse\n\n当你启动 Eclipse\
    \ 时，欢迎（Welcome）标签页不应该出现。（你在安装期间已经关闭了它）。如果它出现了，请将其关闭。点击“文件(File)”。当下拉菜单出现时，点击“切换工作区(Switch\
    \ Workspace)”并选择你的 Hello 工作区（我使用的是 C:\\MyCode\\workspace-mars-hello）。\n\n### 错误图标看起来什么样？\n\
    \nJava 编辑器视图左侧有一个带有“!”的红色三角形圆圈。三角形位于右下角。❌（可快速修复的错误）或 ❌（更复杂的错误）。\n\n### 警告图标看起来什么样？\n\
    \nJava 编辑器视图左侧有一个带有“!”的黄色三角形圆圈。三角形位于右下角。⚠️（可快速修复的警告）或 ⚠️（更复杂的警告）。\n\n### 什么是折叠（folding）？\n\
    \n允许用户隐藏和显示文本块——通常带有命名。通常这样做是为了让用户能够更清楚地看到文档或程序的结构。\n\n### 什么是警告（warning）？\n\n\
    发送给用户构建的消息，警告存在某些（通常是异常的）情况，这些情况并不严重到会抛出异常并终止执行。程序将运行，但可能不会产生预期的结果。\n\n### 什么是错误（error）？\n\
    \n发送给用户构建的消息，警告某些错误，这些错误严重到足以抛出异常并终止执行，可能严重到阻止程序继续。在程序运行之前必须修复。\n\n### 什么是执行环境\
    \ JRE？\n\n目标（目标）上旧的 JRE。用于构建应用程序的 JRE 版本可以比运行时版本新，因为构建时知道 JRE 是什么。\n\n### 什么是\
    \ JDK 环境？\n\nJava 1.0、1.1 或（有时）兼容的目标。\n\n### 什么是 Java2SE-1x 环境？\n\nJava2SE 1.1、...\
    \ 或兼容的目标。\n\n### 什么是 JavaSE-1x 环境？\n\nJava2SE 1.6 或 1.7 执行环境。\n\n### 什么是代码折叠（code\
    \ folding）？\n\n编辑器压缩和展开代码、标记和块的能力。代码折叠简化了在大文件中的导航。\n\n### 什么是“钻取（drill down）”？\n\
    \n在树形结构中（如文件系统），点击节点以进入某些特殊地方。例如，点击 C 驱动器查看根目录，然后点击 Windows 查看目录，点击 System32 查看软件。\n\
    \n### 什么是 Javadoc？\n\n一种用于解析一组源文件中的声明和文档注释的工具，并生成一组描述类、接口、方法和字段的 HTML 页面。\n\n\
    ### 我如何识别 Javadoc 注释？\n\n以 /** 开头，多行，并以 */ 结束。（与以 /* 开头以 */ 结束的注释不同）。\n\n### 我如何查看\
    \ Javadoc？\n\n打开 Javadoc 视图。（点击“窗口(Window)”）。当下拉菜单出现时，点击“显示视图(Show View)->Javadoc”。Javadoc\
    \ 标签页将出现在输出区域。\n\n### 什么是范围（scope）？\n\n类型或数据项的特征，描述了类型或数据项可以安全使用而不产生冲突或混淆的区域。类范围、局部范围和模块范围。\n\
    \n### 闭的项目、打开的项目和展开的项目之间有什么区别？\n\n在项目资源管理器中，关闭的项目是带有关闭文件夹图标和项目名称的单行；打开的项目是带有“>”\
    \ 图标、打开的文件图标和项目名称的单行；展开的项目是多行的，带有向下箭头图标、打开的文件图标（项目名称在第一行，然后在项目正下方直接列出资源列表）。\n\n\
    ### 我如何将关闭的项目更改为打开的项目？\n\n双击关闭的文件夹图标。\n\n### 我如何将打开的项目更改为展开的项目？\n\n双击打开的文件夹图标。或者，只需点击“>”图标。顺便说一下：通常情况下，点击“>”\
    \ 意味着“显示下一层”。\n\n### 我如何将打开或展开的项目更改为关闭的项目？\n\n右键点击项目名称。当下拉菜单出现时，点击“关闭项目(Close\
    \ Project)”。\n\n### 项目资源管理器和包资源管理器有什么区别？\n\n项目资源管理器显示所有项目。包资源管理器显示单个项目。\n\n###\
    \ 练习 7-1：创建一个 Hello1\n\n你在“图片”区域的项目资源管理器标签页中创建项目。\n\n### 可能的失误 7-1\n\n右键点击项目资源管理器主窗口顶部的标签页。弹出一个带有“关闭(close)”选项的下拉菜单。点击“关闭”。发生了什么？顺便说一下：你可以通过右键点击最右侧的“Java\
    \ EE”图标并选择“重置(reset)”返回默认的 IDE 区域和格式。\n\n![](img/2747eedc6aaaaf4cb50e73a6f812e6a8_37_0.png)\n\
    \n"
