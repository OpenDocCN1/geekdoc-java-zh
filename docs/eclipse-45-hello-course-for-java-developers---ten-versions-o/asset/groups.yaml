- md: "\n# Chapter 10: Reduce coupling with separation of responsibility\nmore but\
    \ smaller classes)\n\nWarning: The game has changed: If you've been shown how\
    \ to do something, you'll have to find out where and how. I'll only show you how\
    \ to do new things.\n\n# What is @Override\n\nInforms the compiler that you intend\
    \ to override a method in the superclass. If the compiler does not detect the\
    \ method in one of the superclasses, it will generate an error.\nNote: Quickly\
    \ identify typos or API changes.\n\n# What is coupling?\n\nThe relative complexity\
    \ of the interfaces between code elements (the relative independence of code elements).\
    \ The phrase \"loose coupling\" describes simple or minimum coupling (little complexity)\
    \ (good design) while \"tight coupling\" describes complex or maximum coupling\
    \ (much complexity) (bad design). It describes the relative independence of modules\
    \ (a good thing).\n\n# What is a provider?\n\nClass or method that provides something\
    \ other classes need, usually information.\nAlternative: A factory of swappable\
    \ factories (implements the abstract factory pattern).\nReduces coupling.\n\n\
    # What is a renderer?\n\nClass or method that encodes and decodes information\
    \ in a format that other classes or methods can understand. Reduces coupling.\n\
    \n# What is SoR (Separation of Responsibilities)?\n\nA class should be (1) responsibility\
    \ over a single part of the software functionality and (2) that responsibility\
    \ should be entirely encapsulated by the class. All its services should be narrowly\
    \ aligned with that responsibility. Alternative: Each class should do a very few\
    \ things and do them completely.\n\n# What is an annotation?\n\nForm of metadata\
    \ provides information about a program that is not part of the program itself\
    \ (has no direct effect on the operation of the code it annotates). (1) information\
    \ for the compiler (it can use them to detect errors or suppress warnings), (2)\
    \ compile-time and deployment-time processing (software tools can process annotation\
    \ information to generate code, XML files, and (3) runtime processing (it can\
    \ be examined at runtime). Note: Java and Android annotations begin with \"at\"\
    \ (@).\n\n# Exercise 10-1: Improve Hello separation (Reducing Hello coupling)\n\
    (Decoupling Hello)\n\nCopy HelloLauncher to HelloSeparation. (Did you make HelloSeparation\
    \ an open expanded project? Did you close HelloLauncher?) Add empty classes HelloMessageProvider\
