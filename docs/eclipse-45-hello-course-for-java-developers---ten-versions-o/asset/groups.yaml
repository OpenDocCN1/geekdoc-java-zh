    the dropdown menu appears, click on “Paste”. Oops. Error about “can’t copy the
    clipboard...”. What went wrong? When a project is closed, all copies are the fully
    qualified name of the project (in this case, “Hello”). To copy the project (the
    object), it must be open.


    If Hello is closed, right click it in the Project Explorer main window. When the
    dropdown appears, click on “Open Project” (or, double click on Hello). Right click
    on the Hello project in the Project Explorer main window. When the dropdown menu
    appears, click on “Copy”. Right click on a blank region below the project. When
    the dropdown appears, click on “Paste”. When the “Copy Project” popup appears,
    enter the project name “HelloArgs” then click “Finish”.


    # Possible Mistep 8-2


    If you are working in a project that is similar to another open project, it is
