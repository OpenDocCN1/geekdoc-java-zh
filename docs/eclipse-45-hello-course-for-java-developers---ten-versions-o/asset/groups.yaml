    # What Eclipse version is used in this book?


    The screen shots and key clicks are from Eclipse 4.5.1 EE.


    # What Windows version is used in this book?


    The screen shots and key clicks are from Windows 10 Pro. Windows 7 and Windows
    8.1 will look (and click) slightly differently. If you’re running Windows 8 (not
    8.1) you may have problems (everyone else did).


    # Where did the exercises in these notes come from?


    I first saw a collection of more and complex Hello programs that eventually emphasized
    Spring Framework in a PDF attributed to Rebecca Ong. Since, I have seen similar
    collections of Hello programs associated with other developers. The last exercise
    came from Oz Brown at Collin County Community College Continuing Ed.


    Most of my examples are slightly different since my goal is to create Eclipse
    and editing, not to teach object-oriented programming. But, thanks to Rebecca
    and Oz.


    # Where did these notes come from?


    These notes are the result of thirty years of programming and twenty years of
    searches. Which means that some sections are not the latest and greatest. However,
    they describe ways of getting things done.


    (What can you expect from someone who started programming in GW Basic and wrote
    his first book in Windows 1.0?)


    # Why isn’t this eBook protected?


    You will want to cut and paste the book. I recommend you use Calibre to convert
    this book to DOCX. You can expand the images so you can see them better.


    BTW: If you want an Eclipse course taught at your company, send me an email at
    JRHInLucas@Yahoo.com.


    # Chapter 1: Why Eclipse 4.5?


    # What books should I read?


    A good book is Lars Vogel''s Eclipse IDE (http://www.amazon.com/Eclipse-IDE-vogella-Lars-Vogel-ebook/dp/B0060IJ39S/ref=sr_1_3?s=books&ie=UTF8&qid=145759814&sr=1-3&keywords=lars+vogel).


    A good very pricey book by Ram Kulkarni''s Java EE Development with Eclipse (http://www.amazon.com/Java-Development-Eclipse-Ram-Kulkarni-ebook/dp/B014HFBN40/ref=sr_1_13?s=books&ie=UTF8&qid=145759962&sr=1-13&keywords=eclipse+computer).


    A useful complex book in the almost useless dead format is Kate Thompson''s Zero
    Bugs and Program Faster (http://www.amazon.com/Zero-Bugs-Program-Faster-Thompson/dp/099619308/ref=sr_1_38?s=books&ie=UTF8&qid=145780123&sr=1-38&keywords=eclipse+computer).
    Only recommended for experienced programmers with good eyes.


    # Why use the Eclipse IDE?


    In 2014 (last year was available), Eclipse (free) has 48% of the IDE market, IntelliJ
    (big bucks) has 33%, NetBeans (free) has 10%, and Spring (free, based on Eclipse)
    has 4%. Unless you want to develop both Java and Android applications using the
    same (well, similar) IntelliJ IDE, Eclipse is the tool of choice, especially at
    frugal companies. (Eclipse is free).


    # Why use Eclipse 4.5?


    It''s the second one Eclipse based on Java 8. It''s solid and reliable.


    # Chapter 2: Getting Started with Eclipse


    How is the Eclipse project managed?

    All work at Eclipse is done in sub-projects and components organized under top-level
    projects. Top-level projects are managed by PMCs (project management committees).


    What are the 4.x versions of Eclipse?


    - 4.2 Juno First Eclipse 4

    - 4.3 Kepler Maven integration

    - 4.4 Luna Java 8 integration

    - 4.5 Mars Support for Java lambda expressions

    - 4.6 Neon To be released in June, 2016. Prerelease versions available now.


    What is a wizard?

    A fill-in-the-boxes windows that simplifies creating something. Eclipse is big
    on wizards.


    What is Eclipse?

    An open source community of software developers who are focused on building an
    open development platform with extensible frameworks, tools and runtimes that
    will build, deploy and manage software across the software lifecycle. Alternate:
    The Eclipse platform.


    What is the Eclipse “Big Picture”?


    ![](img/2747eedc6aaaaf4cb50e73a6f812e6a8_14_0.png)


    An alternate look at the big picture is shown below:


    ![](img/2747eedc6aaaaf4cb50e73a6f812e6a8_14_1.png)


    # What is Eclipsepedia?


    Eclipsepedia (http://wiki.eclipse.org/Main_Page) is a Wiki that contains much
    Eclipse knowledge.


    # What is open source?


    The term open source describes applications that make source code available for
    others to view and modify. Open source applications are not necessarily public
    domain; they are often licensed. Eclipse is distributed with the Eclipse Public
    License.


    # What is the difference between Eclipse 3 and Eclipse 4?


    Eclipse 3 is Java 6 (except 3.7.1 or 3.7.2). Eclipse 4 is Java 7 (or Java 8).
    Also, Eclipse 4 supports “modeled UI, dependency injection and service-based programming
    model, CSS-based styling.” Note: Eclipse 4 also has an Eclipse 3 simulation mode.


    # What is the Eclipse architecture?


    # Eclipse IDE Runtime Architecture


    ![](img/2747eedc6aaaaf4cb50e73a6f812e6a8_15_0.png)


    # What is the Eclipse platform?


    The extensible IDE developed by the Eclipse project to host its projects. Alternative:
    Tool for creating projects.


    # What is the Eclipse workbench?


    The Eclipse platform. “Workbench” is the term used for the generic Eclipse UI.
    Originally ... called the desktop but because Eclipse was a platform primarily
    for tools ... workbench was deemed more suitable.


    # What is Wiki?


    A website that uses the Wiki engine. Site visitors can add, remove, and otherwise
    edit and change content, typically without being registered at the web site.


    # When did Eclipse integrate Java 7?


    Eclipse 3.7.1.


    # When did Eclipse integrate Java 8?


    Eclipse 4.4. However, Eclipse 4.5.1 will run under Java 7 with some minor issues.


    # Chapter 3: Installing Eclipse Java


    # Do I have a JAVA_HOME environment variable?


    Right-click on "Start->System". When the System window appears, click on "Advanced
    system settings". When the "System Properties" pop up appears, click on "Environment
    Variables". When the "Environment Variables" pops up, scroll down the "System
    Variables". If you don''t see JAVA_HOME, click on "New..." and fill in the "New
    System Variable" form. The variable value should be the location of your jdk.
    Click on all the "OK" buttons to save and return to the "System" window. Click
    on the x in the upper right hand to close the window.


    # What version of Java do I have?


    Right-click on the Start icon and select Command Prompt (Admin). When the cmd
    window pops up, type "java-version ENTER". It should show some version of build
    1.8 and version SE Runtime Environment. (If not, download the jdk from http://www.oracle.com/technet/java/javase/downloads/index.html).


    # What''s a command line interface?


    Non-graphical user interface where the command line echoes characters on the monitor.
    It is usually identified by a flashing cursor following a "$", ">", or a drive
    name and a backslash (the prompt).


    # What is a release (version)?


    Significantly different version of Eclipse. (Different enough that you''d better
    read the documentation.)


    # What''s a visual IDE?


    Allows developers to program by pointing, clicking and dragging-and-dropping.


    # What''s a WIMP-Icon?


    Acronym for Windows-Icon-Mouse-Pulldown Menus interface that lets users create,
    edit, debug and deploy classes, components, applets and applications without leaving
    the environment. Command line interface developers think WIMP user interfaces
    are wimps. WIMP interface think command line users have low productivity.


    # What is a workspace?


    Manages a group of Eclipse resources regardless of where they are located. The
    workspace contains Eclipse projects. The Eclipse Platform typically has a single
    workspace. However, newer versions of Eclipse tend to overwrite information needed
    by older versions you may want to have a workspace for ach version of Eclipse
    you use.


    # How do I start eclipse using some predetermined workspace?


    Create a batch file with the single line like "C:\eclipse\Mars 4.5.1 EE \eclipse.exe"
    -data C:\MyCode\workspace-mars-hello.

