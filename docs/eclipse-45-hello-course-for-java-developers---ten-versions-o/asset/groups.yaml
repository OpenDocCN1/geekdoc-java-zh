  mdcn: "\n\n## 练习 7-2：创建一个包含 main 方法和注释的 Hello 项目\n\n重复练习 7-1，但将项目名称改为“Hello”。不要忘记创建\
    \ java 文件“HelloWorld”（相同的名称，不同的项目！听起来像是个范围问题，不是吗）。当“Java Class”窗口出现时，勾选“public\
    \ static void main...”和“Generate comments”旁边的复选框。\n\n## 练习 7-3：比较 HelloWorld.java\
    \ 和 Hello1.java\n\n在项目管理器中，Hello1 和 Hello 应该都是打开的项目。点击“>”图标让两个项目都处于打开并展开状态。找到\
    \ HelloWorld 类。双击 HelloWorld.java，它会出现在默认区域的“Editors”面板中。双击 Hello1.java，它会出现在“Editors”面板的第二个标签页中。我们可以同时看到这两个文件，点击并按住\
    \ Hello1.java 的标签，将其向左拖动，直到出现一个较小的面板，松开鼠标按钮。你看到了什么区别？HelloWorld.java 具有 Javadocs\
    \ 结构和一个允许该类独立运行的 main 方法。HelloWorld1.java 则没有。\n\n## 折叠的注释\n\n```\n/**\n * @author\
    \ JohnR_000\n */\npublic class HelloWorld {\n    /** Javadoc for method\n    /**\n\
    \     * @param args\n     */\n    public static void main(String[] args) {\n \
    \       // TODO Auto-generated\n    }\n}\n```\n\n## 误操作 7-5\n\n在编辑器中 Hello 项目的\
    \ HelloWorld.java 的左侧（最左侧），你会看到 Javadoc 注释和块（通常是方法）旁边有带有 + 的深圆和或带有 - 的浅圆。带 + 的深圆表示代码折叠，带\
    \ - 的浅圆表示没有代码折叠。点击文件顶部的圆（类 Javadoc 的开头）。圆会变成深色，且只显示注释或块中的一个。**不要**认为任何内容丢失了。点击深色圆，它会变成浅色，并显示整个内容或块。\n\
    \n## 练习 7-4：关闭 Hello 和 Hello1\n\n在项目管理器中，Hello 和 Hello1 都应该是打开的。（如果不是，请打开关闭的那个）。右键点击\
    \ Hello。当下拉菜单出现时，点击“Close Project”。对 Hello1 执行同样的操作。\n\n## 练习 7-5：删除 Hello1 项目\n\
    \n在项目管理器中，右键点击 Hello1 项目。当下拉菜单出现时，点击“Delete”。当出现“Delete Resources”弹出框时，检查项目位置以确认这是你想要删除的项目。如果“Delete\
    \ project”旁边的复选框已勾选，则点击“OK”。在工作空间和 IDE 中，项目都消失了！永久消失。它无法（轻易地）恢复。\n\n## 练习 7-6：在\
    \ Hello 项目 HelloWorld 的 main 方法中添加方法调用\n\n在项目管理器中，将 Hello 项目设为展开状态。将 HelloWorld.java\
    \ 加载到 Java 编辑器中。注意 main 方法内部的 TODO 注释。现在查看“Outlines and tasks”区域中的 Outlines 面板。你不需要搜索编辑器来寻找\
    \ TODO：它们已在 Outlines 面板中列出。\n\n找到并高亮“//TODO in main (.. )”，然后输入“System.”（你需要那个点！）\n\
    \n在 Eclipse 中按 ENTER（或双击），“out”将变为“System.”。再输入另一个点（.）。找到并高亮“out”，在“System.out”之后立即按\
    \ ENTER。Eclipse 弹出 PrintStream 类文档。找到并高亮“println”，并按 ENTER。现在你看到括号内有 `System.out.println(\"\
    Hello from HelloWorld and Eclipse\")`。现在没有错误指示了。（如果你看到一个蓝色笔图标，可以点击它可以查看消息。）\n\n\
    右键点击 HelloWorld.java 编辑器的主面板。当下拉菜单出现时，点击“save”。关闭 HelloWorld.java 编辑器标签页。\n\n\
    ## 练习 7-7：运行 Hello\n\n在项目管理器中，右键点击 Hello 项目。当下拉菜单出现时，点击“Run as ->” Java application。注意“output”区域打开了一个控制台，Console\
    \ 中出现了字符串“Hello World from Java and Eclipse”。点击“Problems”标签，注意没有列出错误。\n\n## 练习\
    \ 7-8：为什么 Hello 项目会有警告？\n\n在项目管理器中，如果点击 Hello 项目，你可能会在项目名称之间看到一个项目警告图标（带有黄色三角形和感叹号的文件夹）。深入找到\
    \ HelloWorld.java 文件。如果你在输出区域没有看到“Problems”标签，请点击“Window->Show View->Other...Problems”。现在你看到了项目警告。如果信息是“...no\
    \ compatible”，请忽略该项目。\n\n## 练习 7-9：关闭 Hello 项目\n\n在项目管理器中，右键点击 Hello 项目。当下拉菜单出现时，点击“Close\
    \ Project”。项目图标现在是一个关闭的文件夹。\n\n## 问题\n\n假设项目是一个已展开的项目。\n- 创建新项目的两种方法是什么？\n- 打开\
    \ HelloWorld.java 的两种方法是什么？\n- 关闭编辑器的方法是什么？\n- 保存 HelloWorld.java 的方法有哪些？\n- 运行项目的方法有哪些？\n\
    - 关闭项目的方法有哪些？\n- Eclipse 是从哪里获取 @author 标签的？\n\n## 第 8 章：从 Hello 创建新项目\n\n从零开始创建一个新项目需要很多步骤。如果你有一个相似的项目，复制该项目来创建一个新项目通常更简单。Eclipse\
    \ 有一个重构工具，可以简化对现有项目副本的修改。\n\n### 什么是限定名（qualified name）？\n带有路径的对象名称。\n\n### 什么是重构（refactoring）？\n\
    对软件进行持续重新设计以提高其对变化的响应能力。也指 IDE 中的一种工具。\n\n### 什么是启动器设计模式？\n一种使用带有 main 方法的类来启动应用程序的设计模式。通常应用程序中的其他类没有\
    \ main 方法，以防止它们被误用。\n\n### 什么是启动器（launcher）？\n带有 main 方法且几乎没有其他内容的类。它的唯一作用是启动应用程序。\n\
    \n## 练习 8-1：复制 Hello 项目并命名为 HelloArgs\n\n## 误操作 8-1\n\n关闭 Hello 项目，然后右键点击该项目。当下拉菜单出现时，点击“Copy”。在项目管理器的空白处右键。当下拉菜单出现时，点击“Paste”。哎。出现了关于“can’t\
    \ copy the clipboard...”的错误。哪里出错了？当项目被关闭时，所有事实上的副本都是项目的限定名（在本例中为“Hello”）。要复制项目（对象），它必须是打开的。\n\
    \n如果 Hello 是关闭的，在项目管理器主窗口中右键点击它。当下拉菜单出现时，点击“Open Project”（或者，双击 Hello）。在项目管理器主窗口中右键点击\
    \ Hello 项目。当下拉菜单出现时，点击“Copy”。在项目下方的空白区域右键。当下拉菜单出现时，点击“Paste”。当出现“Copy Project”弹出框时，输入项目名称“HelloArgs”然后点击“Finish”。\n\
    \n## 误操作 8-2\n\n如果你正在一个与另一个打开的项目相似的项目工作，很容易意外修改错误的项目。通过右键点击你想要工作的项目来避免这个问题。当下拉菜单出现时，点击“Close\
    \ Unrelated Projects”。当出现“Close Unrelated Projects”弹出框时，点击“OK”。\n\n点击 HelloArgs\
    \ 前的“>”图标以展开项目。找到 HelloWorld.java，然后点击它。当下拉菜单出现时，点击“Refactor>Rename”。当出现“Rename\
    \ Compilation Unit”弹出框时，输入新名称\n\n"
