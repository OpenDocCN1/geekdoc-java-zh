- "# Java 和 Spring GraphQL \n\n\n\n![](img/cover.png)\n\n1. 标题页\n2. 封面\n\n\n# 序言\n\
  \n## Andi (Andreas)\n\n2015 年，我（Andi）在德国柏林的一家小公司担任软件工程师。在一次对话中，我的同事之一（非常感谢 Stephan！）向我提到了这种名为“GraphQL”的新技术，它旨在改进客户端从服务访问数据的方式，并且他们计划很快发布它。\n\
  \n在研究了 GraphQL 之后，它立刻说服了我它能提供的价值。当然，我无法预测它的成功，但我已经在多家公司亲身体验了创建和维护 REST API 的挣扎。尽管付出了巨大的努力，但随着时间的推移，它们看起来越来越像\
  \ GraphQL，而不是一个良好的 REST API 应该享有的样子。也许这可能是因为对 REST 缺乏理解，但在非常不同的背景下反复目睹了相似的挑战后，我有了不同的看法。\n\
  \n由于坚信了它的价值，在 GraphQL 规范发布后，我立即开始着手 Java 实现。在工作之余投入大约两周的空闲时间后，我发布了 GraphQL Java\
  \ 的第一个版本。\n\n起初只有我一个人，但不久后我就收到了第一个修复拼写错误的 PR。今天，超过 [200 人](https://github.com/graphql-java/graphql-java/graphs/contributors)\
  \ 为 GraphQL Java 做出了贡献，没有他们，就没有 GraphQL Java。诚挚地感谢你们所有人。\n\n特别感谢 [Brad Baker](https://github.com/bbakerman)，他已经担任了六多年的共同维护者。他对\
  \ GraphQL Java 的贡献和影响怎么强调都不为。这既是他的项目，也是我的项目。\n\n最重要的是，我想感谢我的妻子 Elli 的所有支持：没有她，就没有今天的这本书。\n\
  \n## Donna\n\n我（Donna）非常激动能和 Andi 一起写，他创建了 GraphQL Java，并在 Spring for GraphQL 的创建中发挥了主要作用。Andi、Brad\
  \ 和我是 GraphQL Java 的维护者。\n\n我在较晚的时候才发现编程，最初这只是一个爱好。我学到的第一个编程概念之一是开源软件。作为一个追求利润最大化的投资银行家，看到高质量的工作被高兴地免费送出去，这似乎是奇妙的疯狂。我热爱开源世界中的协作和社区精神。我如此热爱它，以至于我改变了职业成为了一名软件工程师。\n\
  \n感谢 GraphQL Java 社区的各位多年来的贡献。\n\n## 关于本书\n\n本书适用于任何想要用 Java 构建生产环境 GraphQL 服务的人士。读完本书后，你将有信心使用\
  \ Spring for GraphQL 构建你自己的生产环境 GraphQL 服务，Spring for GraphQL 是构建在 GraphQL Java\
  \ 引擎之上的官方 Spring 集成。Spring for GraphQL 通过消除样板代码并与 Spring 生态无缝集成，使得构建 GraphQL 服务变得比任何时候都更加容易。\n\
  \nGraphQL Java 是 GraphQL 的主流 Java 实现，为 Twitter、AirBnB、Netflix、Atlassian 以及许多公司的服务提供支持。读完本书后，你将通过\
  \ Spring for GraphQL 使用相同的引擎。\n\n在本书中，你将学习关键的 GraphQL 概念，并结合我们运行大规模生产环境 GraphQL\
  \ 服务的实践建议。读完本书后，你将对 Spring for GraphQL 和 GraphQL Java 引擎有深入的知识，因此你会有信心运行生产就的 GraphQL\
  \ 服务。\n\n本书适合构建第一个生产环境 GraphQL 服务的初学者。书中后期还有针对中级读者的高级主题。\n\n我们不假设读者对 GraphQL 有任何先验知识。为了充分利用本书，我们假设你有基础的\
  \ Java 知识，并假设非常基础的 [Spring](https://spring.io/) 知识，例如熟悉 `@Component` 注解。可选，如果你打算构建响应式服务，你应该熟悉\
  \ Reactor 的 `Mono` 和 `Flux` 概念。\n\n所有代码示例都是用 Java 17 编写，这是 Spring Boot 3.x 需要的最低版本。书中的示例使用\
  \ Spring Boot 3.0.4 和 Spring for GraphQL 1.1.2 编写，使用了 GraphQL Java 19.2。\n\n如果你对本书有反馈或意见，请通过邮件\
  \ book-feedback@graphql-java.com 联系我们。\n\n我们深心希望你喜欢这本书。\n\n特别感谢我们的评审员提供的极佳反馈。感谢来自\
  \ Spring for GraphQL 团队的 Rossen Stoyanchev 和 Brian Clozel，我们的技术评审员 Doug Warren，以及评审员\
  \ Brad Baker、Antoine Boyer、Felipe Reis、Stephan Behnke 和 Josh Long。感谢我们的封面设计师 Mike\
  \ Riethmuller。\n\n# 引言\n\n## 你的第一个 Spring for GraphQL 服务\n\n感受 GraphQL 良好的最好方法就是体验它。我们将逐步介绍如何创建你的第一个\
  \ Spring for GraphQL 服务。在接下来的章节中，我们将更详细地解释这些步骤。\n\n首先，在 [Spring Initializr](https://start.spring.io)（https://start.spring.io）创建一个新项目。在书中，我们将使用\
  \ Spring Boot 3.x，它至少需要 Java 17。如果你喜欢使用 Java 11，请选择至少 2.7.0 的 Spring Boot 版本来使用\
  \ Spring for GraphQL。你可以选择 Maven 或 Gradle 项目。\n\n在依赖部分，添加 Spring for GraphQL。然后我们还需要一个传输依赖项。你可以选择\
  \ Spring Web (WebFlux) 或 Spring MVC（包含 Spring MVC）。在本书中，我们将使用 Spring Reactive 来利用\
  \ Netty 服务器构建响应式服务。如果你选择 Spring MVC，书中的所有内容仍然适用于你的服务，唯一的区别是控制器方法将不会被封装在 `Mono` 或\
  \ `Flux` 中。\n\n你可以添加自己的项目元数据，或者按照我们截图“Spring Start”中的示例进行操作。\n\n![Spring Start](img/file0.png)\n\
  \nSpring Start\n\n点击页面底部的 Generate 生成你的项目。在你喜欢的代码编辑器中打开项目。从 `myservice.service.ServiceApplication`\
  \ 中的 `main` 方法启动应用程序。它将在 `http://localhost:8080` 启动一个 HTTP 端点，但目前还没有什么！\n\n让我们让这个服务更有用，并实现一个非常简单的\
  \ GraphQL 服务，用于提供宠物数据。为了保持这个初始示例的简单，数据将是一个内存列表。稍后，在构建 GraphQL 服务章节中，我们将扩展这个示例来调用另一个服务。\n\
  \n对于这个初始示例，我们将从高层概述概念，以便我们能够快速获得一个可以交互的运行服务。在接下来的章节中，我们将更详细地解释这些概念。\n\n让我们从创建一个\
  \ GraphQL 模式开始，它是 API 的静态描述。在“resources”下创建一个新的“graphql”子目录。将以下内容粘贴到新文件 `src/main/resources/graphql/schema.graphqls`\
  \ 中。\n\n```\ntype Query {\n    pets: [Pet]\n}\n\ntype Pet {\n    name: String\n\
  \    color: String\n}\n```\n\n这个用于宠物的 GraphQL 模式使用模式定义语言（SDL）格式编写。它定义了一个 GraphQL\
  \ 查询类型，包含一个 `pets` 字段，它返回一个宠物列表。每个宠物都有 `name` 和 `color`，这两个字段都是字符串属性。在模式章节中，我们将深入讨论\
  \ GraphQL 模式元素。\n\n\n\n\n\n在 `myservice.service` 包中添加一个 `Pet` 记录类（record class）。\n\
  \n```java\npackage myservice.service;\n\nrecord Pet(String name, String color) {\n\
  }\n```\n\n接下来，我们将添加逻辑将模式（schema）与宠物数据连接起来。在 `myservice.service` 包中创建一个新的 Java 类\
  \ `PetsController`。\n\n```java\npackage myservice.service;\n\nimport org.springframework.graphql.data.method.annotation\n\
  \  .QueryMapping;\nimport org.springframework.stereotype.Controller;\n\nimport java.util.List;\n\
  \n@Controller\nclass PetsController {\n\n  @QueryMapping\n  List<Pet> pets() {\n\
  \    return List.of(\n      new Pet(\"Luna\", \"cappuccino\"),\n      new Pet(\"\
  Skipper\", \"black\"));\n  }\n}\n```\n\n这就是我们所需的所有代码了：一个模式文件、一个记录类和一个 GraphQL 控制器！`@QueryMapping`\
  \ 控制器注解将 `pets` 方法注册为 `DataFetcher`，将模式中的 `pets` 字段连接到数据（在此例中为内存中的列表）。我们将在 DataFetchers\
  \ 章节 中详细解释如何连接你的模式和数据。\n\n为了添加一个可视化前端来探索我们的 API，可以通过在 `src/main/resources` 的 `application.properties`\
  \ 文件中添加 `spring.graphql.graphiql.enabled=true` 来启用内置的 [GraphiQL](https://github.com/graphql/graphiql)\
  \ 交互操场。GraphiQL 是一个小型 Web 应用，用于从浏览器交互式地探索 GraphQL API。将其想象为 GraphQL 的 REPL（读取-评估-打印循环）工具。\n\
  \n重启你的服务。如果成功，你应该会看到日志条 `GraphQL endpoint HTTP POST /graphql`。然后访问 `http://localhost:8080/graphiql`\
  \ 打开 GraphiQL。\n\n如果你的服务没有正常启动，请双击检查模式文件 `schema.graphqls` 是否存储在 `resources` 内部的\
  \ `graphql` 子文件夹中。\n\n让我们尝试第一次查询。在 GraphiQL 操场的左侧输入以下内容：\n\n```graphql\nquery myPets\
  \ {\n    pets {\n        name\n        color\n    }\n}\n```\n\n然后点击播放按钮（带有三角形图标的粉按钮）发送查询，如截图“GraphiQL\
  \ request and response”所示。\n\n![GraphiQL request and response](img/file1.png)\n\n\
  GraphiQL 请求与响应\n\n在 GraphiQL 操场的左侧，我们看到了查询，在右侧看到了 JSON 响应。响应的结构与查询完全匹配。\n\n花点时间实验一下\
  \ GraphiQL。例如，你可以从查询中移除 `color`。尝试在输入查询时使用自动完成帮助。\n\n点击左上角的文档图标打开文档浏览器，如截图“GraphiQL\
  \ Documentation Explorer”所示。\n\n![GraphiQL Documentation Explorer](img/file2.png)\n\
  \nGraphiQL Documentation Explorer\n\n然后点击 pets 的根 `Query`，然后点击 `Pet` 查看其属性（`name`\
  \ 和 `color`），如截图“GraphiQL Pet documentation”所示。\n\n![GraphiQL Pet documentation](img/file3.png)\n\
  \nGraphiQL Pet documentation\n\n恭喜你完成了你的第一个 Spring for GraphQL 服务！在本章中，我们讨论了非常高层次的概念。在本书的剩余部分，我们将详细详细讨论每个概念。稍后在\
  \ Building a GraphQL service 章节 中，我们将使用更多功能扩展此服务。\n\n快速回顾一下我们所做的：\n\n*   通过 `https://start.spring.io`\
  \ 使用 WebFlux 创建了一个新的 GraphQL 服务\n*   添加了 SDL 格式的 GraphQL 模式文件\n*   实现了一个返回 `Pet`\
  \ 数据列表的 GraphQL 控制器\n*   执行了一个 GraphQL 查询\n\n## 什么是 GraphQL？\n\nGraphQL 是一种用于客户端-服务器数据交换的技术。典型的用例是\
  \ Web 或移动客户端访问或更改后端服务器上的数据，如图“Client Server”所示。我们有时将涉及的双方描述为 API 的“消费者”和“生产者”。\n\
  \n![Client Server](img/file4.png)\n\n客户端服务器\n\n在实践中，GraphQL 包含两个部分：一种允许客户端指定其意图（例如查询什么数据、执行什么操作、返回哪些数据属性）的领域特定语言，以及一个能够执行此请求的后端服务。这种领域特定语言被称为“GraphQL\
  \ 查询语言”；遗憾的是，“查询”（query）是一个重载术语，因为“查询语言”允许你执行更新（或“变异” mutations）、订阅和查询。\n\n例如，查询宠物列表及其名称的请求：\n\
  \n```graphql\n# 这是一个注释\n\n## 我们请求两个字段：\n### \"pets\" 以及每个宠物的 \"name\"\n\nquery myPets\
  \ {\n    pets { \n        name \n    }\n} \n```\n\n这是一个“查询操作”，但 GraphQL 服务还可以执行“变异（mutation）”和“订阅（subscription）”操作。我们将在查询语言章节中更详细地解释\
  \ operations。假设有两只名为 Luna 和 Skipper 的宠物，这是对应的 JSON 响应：\n\n```json\n{\n  \"data\"\
  : {\n    \"pets\": [\n      {\n        \"name\": \"Luna\"\n      },\n      {\n \
  \       \"name\": \"Skipper\"\n      }\n    ]\n  }\n}\n```\n\n\n\n\nGraphQL API\
  \ 是一种静态类型的 API。“类型化”意味着 GraphQL API 包含了对消费者可以使用 API 进行哪些操作的清晰描述。API 不会频繁更改。当 API\
  \ 发生变化时，通常涉及到服务的重新部署。\n\n例如，上述查询所使用的 API 看起来如下：\n\n```graphql\n[](#cb9-1)# 这是一个注释\n\
  [](#cb9-2)\n[](#cb9-3)# 这是根对象，因为它命名为 Query\n[](#cb9-4)type Query { \n[](#cb9-5)\
  \    # 一个名为 \"pets\" 的字段，返回 Pet 列表\n[](#cb9-6)    pets: [Pet] \n[](#cb9-7)}\n[](#cb9-8)\n\
  [](#cb9-9)# 一个名为 Pet 的对象\n[](#cb9-10)type Pet { \n[](#cb9-11)    # 类型为 String 的名为\
  \ \"name\" 的字段\n[](#cb9-12)    name: String \n[](#cb9-13)    color: String\n[](#cb9-14)}\n\
  ```\n\n这种语法被称为 Schema 定义语言 (SDL)，而 GraphQL API 的结构被称为 schema（模式）。每个 GraphQL API\
  \ 都有一个 schema，用 SDL 语法清晰地描述 API。目前理解 GraphQL API 的最佳方式是将其看作一个包含字段列表的类型列表。\n\n每个\
  \ GraphQL API 都提供了特殊的字段，允许你查询 API 内部的 schema。这一功能被称为内省（introspection）。例如，对于每个 GraphQL\
  \ API 的一个有效查询如下：\n\n```graphql\n[](#cb10-1)query myIntrospection {\n[](#cb10-2)\
  \    __schema {\n[](#cb10-3)        types {\n[](#cb10-4)            name\n[](#cb10-5)\
  \        }\n[](#cb10-6)    }\n[](#cb10-7)}\n```\n\n对于我们上的 API，它将返回：\n\n```json\n\
  [](#cb11-1){\n[](#cb11-2)  \"__schema\": {\n[](#cb11-3)    \"types\": \n[      {\n\
  [](#cb11-5)        \"name\": \"Query\"\n[](#cb11-6)      },\n[](#cb11-7)      {\n\
  [](#cb11-8)        \"name\": \"Pet\"\n[](#cb11-9)      }\n[](#cb11-10)    ]\n[](#cb11-11)\
  \  }\n[](#cb11-12)}\n```\n\n如你所示，特殊字段 `__schema` 以 `__` 开头，这这是一个内省字段，而不是普通字段。\n\n\
  ## GraphQL 是一种 API 技术\n\n我们想要强调 GraphQL 的一个非常重要的方面：它是一种与数据源无关的 API 技术。在实现 GraphQL\
  \ 服务时，实际数据可以来自任何地方。GraphQL 不是数据库或特定于持久化的技术。虽然有一些技术和服务可以让我们将数据库 schema 暴露为 GraphQL\
  \ API，但当我们的系统增长时，这不是一种健壮的架构：这些是我们不应该耦合在一起的东西。我们强烈建议你将数据库 schema 视为与 GraphQL schema\
  \ 完全不同的东西。\n\n## GraphQL 的简史\n\nGraphQL 的官方诞生生日是 2012 年 2 月 29 日，当时它是 Facebook 内部的一个提案，名为\
  \ [SuperGraph](https://twitter.com/leeb/status/1498759168689598464?s=20&t=817z2q0x1_x2En8xxH5X8w)。\n\
  \n它是将 Facebook iOS 客户端重写为原生应用工作的一部分，旨在解决团队在传统的 REST 类 API 中遇到的多个问题，正如共同创始人 Lee Byron\
  \ 在这段 10 分钟的视频主旨演讲中描述的 [GraphQL 简史](https://www.youtube.com/watch?v=VjHWkBr3tjI)\
  \ 中描述的：\n\n*   网络慢：获取所需数据需要多次协调的往返交互。\n*   脆弱的客户端/服务器关系：服务器 API 的变化很容易破坏应用程序，且文档往往过时。\n\
  *   代码和流程繁琐：必要的服务更改通常会阻塞客户端开发。\n\nGraphQL 通过前一节概述的特性解决了这些问题：查询语言允许客户端精确指定它们想要的内容，灵活且独立于服务器进行开发，而静态类型系统使得客户端/服务器关系变得更加稳定。\n\
  \n在 GraphQL 在 Facebook 内部成功使用几年后，它于 [2015 年 7 月开源](https://youtu.be/WQLzZf34FJ?t=1473)。同时发布了两个制品：GraphQL\
  \ 规范和参考实现。参考实现最初是规范的 JavaScript 实现，但现在也提供了 TypeScript 版本。这种拥有清晰规范和参考实现相结合的双重方法导致了跨越每个主要编程语言和生态系统的实现，包括\
  \ Ruby、PHP、.NET、Python、Go，当然还有 Java。\n\n在 2015 年开源后，GraphQL 一直由 Facebook 拥有并运行直到\
  \ 2018 年底成立了 [GraphQL Foundation](https://medium.com/@leeb/introducing-the-graphql-foundation-3235d8186d6d)。GraphQL\
  \ Foundation 是一个中立实体，由 25 多个成员组成，包括 AWS、Airbnb、Atlassian、IBM、Microsoft 和 Shopify。Foundation\
  \ 的[官方描述](https://graphql.org/foundation/)是：\n\n> GraphQL Foundation 是一个全球技术和应用公司的基金会。它鼓励贡献、管理和共同。\n\
  \n从法律上讲，GraphQL Foundation 拥有 GraphQL 商标以及某些 GraphQL 项目的版权。GraphQL 的官方网站是 `https://graphql.org`。在实践中，Foundation\
  \ 最终负责 GraphQL。\n\n开发 GraphQL 规范最重要的群体是 GraphQL 工作组（通常缩为 WG）。它是一个开放群体，每月在线会议三次，主要讨论\
  \ GraphQL 规范的更改和改进。 GraphQL 社区的每个人都可以加入 https://github.com/graphql-wg。\n\n## 从 GraphQL\
  \ Java 到 Spring for GraphQL\n\nGraphQL 开源后不久，GraphQL Java](https://github.com/graphql-java/graphql-java/releases/tag/1.0)\
  \ 的第一个版本发布了。我（Andi）的基本决策之一是专注于 GraphQL 的执行部分。GraphQL Java 始终旨在成为一个符合规范的 GraphQL\
  \ 引擎，而不是功能完备的服务框架。这意味着 GraphQL Java 永远不应该处理 HTTP I/O 或任何类型的线程，尽可能。\n\n虽然我仍然对这个决定感到非常满意，因为它让\
  \ GraphQL Java 有了强大的关注和广泛采用，但它带来了一个明显的缺点：每个服务都需要解决 HTTP 集成问题。\n\n在我发布 GraphQL Java\
  \ 一段时间后，第一个 GraphQL Java Spring 集成变得可用。我甚至开发了一个小型的 [GraphQL Java Spring](https://github.com/graphql-java/graphql-java-spring)\
  \ 库，旨在尽可能轻量。但没有什么优于由 Spring 团队维护的官方 Spring 集成，它可以获得最大的 GraphQL 采用和最佳体验。\n\n2020\
  \ 年 7 月，Spring 和 GraphQL Java 团队合作开发了官方的 Spring for GraphQL 集成。一年后，我们发布了[第一个里程碑](https://spring.io/blog/2021/07/06/hello-spring-graphql)，之后在\
  \ 2022 年 5 月发布了 [Spring for GraphQL](https://spring.io/projects/spring-graphql)\
  \ 的版本。\n\nSpring for GraphQL 旨在成为 GraphQL Java 到 Spring 的一种不带主见的集成，专注于全面且广泛的支持。它应该是\
  \ Spring GraphQL 解决方案的基础性构建块。另一个关键设计决策是直接使用 GraphQL Java 本身，在 Spring 和 GraphQL Java\
  \ 之间没有抽象或额外的层。\n\n\n\n\nSpring for GraphQL 包含两个部分：一个是与 GraphQL Java 的实际 [Spring\
  \ Framework 集成](https://docs.spring.io/spring-graphql/docs/current/reference/html/)，另一个在此基础上的针对\
  \ GraphQL 的 [Spring Boot Starter](https://docs.spring.io/spring-boot/docs/current/reference/htmlsingle/#web.graphql)。在本书中，我们将构建使用\
  \ Spring Boot 开发的服务，并利用 Spring Boot GraphQL Starter 的优势。\n\n我们将在 GraphQL Java 和\
  \ Spring 的世界之间不断切换，但理解哪一个层贡献了哪部分通常非常重要，以便充分利用 Spring for GraphQL 的功能。这对于排查故障尤为有价值。在整本书中，我们会清楚地说明何时我们是在讨论\
  \ Spring for GraphQL 概念，何时我们是在直接讨论 GraphQL Java 概念。\n\n在接下来的几个章节中，我们将更详细地解释初始服务中使用的概念，并讨论\
  \ GraphQL 的核心概念。之后，我们将构建一个更复杂的应用程序来回顾所学内容。在书的后面部分，我们将涵盖更高级的话题。\n\n# 概述\n\n在本章中，我们将介绍\
  \ Spring for GraphQL 和 GraphQL Java 的基础方面，以及它们之间的关系。这对于建立整体理解并避免在接下来的章节中迷失细节非常重要。\n\
  \n本章将从高层级涵盖概念以提供概述。在书的后面，我们将更详细地解释这些概念。\n\n### 三层架构\n\n我们需要考虑三层，其中较高层依赖于较低层。\n\n\
  ![Three layers](img/file5.png)\n\n### 三层架构\n\n从图“Three layers”从下到上依次是：\n\n* `GraphQL\
  \ Specification` (规范)：以一种与技术无关的方式定义什么是 GraphQL 以及一个 GraphQL 服务需要实现什么。\n* `GraphQL\
  \ Java`：为 Java 实现 GraphQL 规范。\n* `Spring for GraphQL`：将 GraphQL Java 与 Spring 集成。\n\
  \n我们也可以将其看作抽象的层级结构，从底部的低观点（less opinionated）到顶部的具体化：\n\n* `spec` 是最抽象的，因为它适用于 GraphQL\
  \ 的所有实现，不仅仅是 Java。它只是一个文本文档，而不是运行的软件。例如，它描述了什么是 GraphQL 变异（mutation），而不描述其实现的的细节。\n\
  * `GraphQL Java` 实现 `spec` 并实际上提供了运行的软件。它没有绑定到任何特定的框架（如 Spring），也不处理任何传输层的细节。\n\
  * `Spring for GraphQL`：利用 `GraphQL Java` 提供一个用于构建 GraphQL 服务的全面框架，包括传输层细节。\n\n从\
  \ Java 的实际角度来看，可以将 `GraphQL Java` 和 `spec` 视为等同的。`GraphQL Java` 没有提供 `spec` 之外的主要功能，而\
  \ `spec` 也没有定义任何在 Java 中未表示的内容，它们是一一一对应的关系。因此，我们不会脱离 `GraphQL Java` 独立讨论 `spec`，我们可以默认假设\
  \ `GraphQL Java` 中的功能已在 `spec` 中定义。\n\n## Schema 和 SDL\n\nGraphQL API 使用静态类型，因此它只能执行其被明确描述的内容。更改\
  \ API 通常意味着我们需要重新部署该服务。\n\nSchema 是 API 的描述，它是 GraphQL Java 中 `GraphQLSchema` 的实例。\n\
  \nSchema 定义语言（SDL）语法以人类可读的格式定义 schema。\n\n```\ntype Query {\n    pets: [Pet]\n}\n\
  \ntype Pet {\n    name: String\n    color: String\n}\n```\n\n这是一个 SDL 格式的 schema，定义了两个类型：`Query`\
  \ 和 `Pet`。`Query` 类型有一个 `pets` 字段。`Pet` 类型有两个字段，`name` 和 `color`。\n\nSDL 格式非常适合定义\
  \ schema，并使 schema 变得易于阅读。在执行期间，GraphQL Java 使用 `GraphQLSchema` 的实例，该实例代表提供的 SDL\
  \ schema。\n\n我们将在 Schema 章节 中深入讨论 GraphQL schemas。\n\n## GraphQL 查询语言\n\nGraphQL\
  \ 查询语言是一种用于描述客户端想要请求内容的领域特定语言。它故意设计得像 JSON，但它并不是 JSON。\n\n```graphql\nquery myPets\
  \ { \n    pets { \n        name \n    } \n}\n```\n\n客户端被要求显式地“选择”它想要的任何数据，例如宠物的名字。响应是\
  \ JSON 格式，并且仅包含请求的数据，不多不少。\n\n```json\n{\n  \"data\": \n    \"pets\": [\n      {\n\
  \        \"name\": \"Luna\"\n      },\n      {\n        \"name\": \"Skipper\"\n\
  \      }\n    ]\n}\n```\n\n响应还可以包含另外两个顶层 键，“errors”和“extensions”。我们将在 请求与响应章节 中详细讨论。\n\
  \nGraphQL API 消费者的每次交互都始于一个 GraphQL 请求并产生一个 GraphQL 响应。\n\nGraphQL Java 中的 GraphQL\
  \ 请求是 `ExecutionInput` 的实例，响应是 `ExecutionResult`。这些是独立于特定传输层的请求和响应定义。从 GraphQL Java\
  \ 的角度来看，请求和响应只是方法调用的参数和返回值。我们将在书的后面一个专门的章节中详细讨论 GraphQL 请求和响应。\n\nSpring for GraphQL\
  \ 定义了 `GraphQlRequest`，其中最重要的实现是用于通过 HTTP 或 WebSocket 请求的 `WebGraphQlRequest`。`WebGraphQlRequest`\
  \ 包含了用于 HTTP 请求的特定数据，如 URL 和 HTTP 请求头。\n\nSpring for GraphQL 中的响应是 `GraphQlResponse`，其中\
  \ `WebGraphQlResponse` 再次特定于 HTTP 或 WebSocket，包含 HTTP 响应头。\n\n最重要的是，GraphQL 请求包含一个\
  \ GraphQL 文档（document），它是 GraphQL 查询语言格式的文本，包含了客户端的意图。\n\n响应可以包含数据、错误和扩展。数据可以是任何内容。在\
  \ `ExecutionResult` 中，数据是 `Map<String, Object>`。在传输层上，我们通过 HTTP 以 JSON 格式发送响应。\n\
  \n## 执行与 DataFetcher\n\n我们可以大致将通过 HTTP 执行 GraphQL 请求的实际过程分为如下：\n\n1. 首先，请求被反序列化并处理（Spring）。\n\
  2. 我们调用 GraphQL Java，这涉及获取数据（GraphQL Java）。\n3. 然后我们创建并序列化响应（Spring）。\n\n第一步完全由\
  \ Spring 完成工作，也可能涉及身份验证等方面。然后 Spring 调用 GraphQL Java，一旦完成，响应将再次由 Spring 处理并发送给客户端。\n\
  \n第二步涉及多个步骤，例如调用相关的 `DataFetchers` 来获取满足请求所需的数据。我们将在书的后面一个专门的章节](#ch007.xhtml_datafetchers-part-1)\
  \ 中详细讨论 DataFetchers。\n\n在 Spring for GraphQL 中，带有注解的控制器方法被注册为 DataFetchers。例如，在之前的章节中，我们构建了一个带有宠物列表示例服务：\n\
  \n```java\npackage myservice.service;\n\nimport org.springframework.graphql.data.method.annotation.QueryMapping;\n\
  import org.springframework.stereotype.Controller;\n\nimport java.util.List;\n\n\
  @Controller\nclass PetsController {\n\n  @QueryMapping\n  List<Pet> pets() {\n \
  \   return List.of(\n      new Pet(\"Luna\", \"cappuccino\"),\n      new Pet(\"\
  Skipper\", \"black\"));\n  }\n}\n```\n\n\n\n\n`@QueryMapping` 注解将此方法注册为 `Query`\
  \ 类型中 `pets` 字段的 `DataFetcher`，将该方法与同名字段连接起来。我们将在 DataFetchers 章节 中详细解释 Spring for\
  \ GraphQL 的模式映射注解。\n\n创建和序列化响应的最后一步由 Spring for GraphQL 处理。\n\n有关执行的更多信息，请参阅本书后半部分的专用章节。\n\
  \n## 概念之间的关系\n\n![Concept relations](img/file6.png)\n\n概念关系\n\n如“Concept relations”图所示：\n\
  \n- SDL 定义了模式（schema）\n- 请求包含查询语言格式的文本\n- 请求的执行使用模式 和 `DataFetchers` 来产生响应\n\n##\
  \ GraphQL Java\n\nGraphQL Java 的主要类如“GraphQL Java classes”图所示：\n\n- `graphql.GraphQL`：通常每个服务只有一个实例。用于启动\
  \ GraphQL Java 执行。\n- `graphql.ExecutionInput`：GraphQL Java 请求。\n- `graphql.ExecutionResult`：GraphQL\
  \ Java 响应。\n- `graphql.schema.GraphQLSchema`：GraphQL API 的描述以及执行它所需的逻辑。\n- `graphql.schema.DataFetcher`：每个服务都需要实现的\
  \ Java 接口。你的 GraphQL 服务将通过 Spring for GraphQL 的模式映射注解实现 `DataFetchers`。\n\n![GraphQL\
  \ Java classes](img/file7.png)\n\nGraphQL Java classes\n\n## Spring for GraphQL\n\
  \nSpring for GraphQL 的主要类如下（所有类名均以 `org.springframework.graphql` 开头，缩写为 `o.s.g`）：\n\
  \n- `o.s.g.server.webflux.GraphQlHttpHandler`：WebFlux 处理器。创建 `WebGraphQlRequest`\
  \ 并调用 `WebGraphQlHandler`。\n- `o.s.g.server.webmvc.GraphQlHttpHandler`：Spring MVC\
  \ 处理器。创建 `WebGraphQlRequest` 并调用 `WebGraphQlHandler`。\n- `o.s.g.server.WebGraphQlRequest`：通过\
  \ HTTP 或 WebSocket 的 请求。\n- `o.s.g.server.WebGraphQlResponse`：通过 HTTP 或 WebSocket\
  \ 的 GraphQL 响应。\n- `o.s.g.server.WebGraphQlHandler`：处理通过 HTTP 或 WebSocket 的 GraphQL\
  \ 请求。\n- `o.s.g.server.WebGraphQlInterceptor`：拦截 `WebGraphQlRequest` 和 `WebGraphQlResponse`\
  \ 的钩子。\n- `o.s.g.graphql.ExecutionGraphQlService`：负责调用 GraphQL Java 的实际服务。\n\n一个请求通过\
  \ Spring for GraphQL 中的三个主要类，每个类都有其独特的职责，如“Spring for GraphQL classes”图所示：\n\n1.\
  \ 通用 HTTP 请求调用 `GraphQlHttpHandler`，它将请求转换为 `WebGraphQlRequest`。\n2. `WebGraphQlHandler`\
  \ 接收 `WebGraphQlRequest` 并调用 `ExecutionGraphQlService` 执行请求。\n3. `ExecutionGraphQlService`\
  \ 最终调用 GraphQL Java。\n\n![Spring for GraphQL classes](img/file8.png)\n\nSpring for\
  \ GraphQL classes\n\n在日常使用中，这些步骤中最相关的是第二步，因为 `WebGraphQlHandler` 提供了通过 `WebGraphQlInterceptor`\
  \ 拦截任何请求和响应的能力。\n\n关于大小写的简要说明。你可能注意到类名中字母“Q”和“L”的大小写情况各不相同。在所有 Spring for GraphQL\
  \ 类中，“Q”始终大大写，“l”始终是小写，以与 Spring 的命名规范保持一致。在 GraphQL Java 中，名称通常包含大写的“Q”和“L”。如果没有遵循此约定，我们会在相关的代码示例指出。\n\
  \n本章从高层次介绍了最基本的概念。在本书中，我们将详细讨论所有这些主题。\n\n### Schema\n\nGraphQL API 的模式是 API 的静态描述。模式描述了\
  \ API 消费者可以请求的内容，可以使用模式定义语言（SDL）格式表示（也称为“SDL 语法”或“SDL 记法”）。\n\n在底层，Spring for GraphQL\
  \ 使用 GraphQL Java 的 `GraphQLSchema` 表示一个可执行的模式，然后用它来创建一个 `GraphQL` 对象。它是一个“可执行”的模式，因为它包含了执行请求所需的所有逻辑，以及面向消费者的\
  \ API 描述。在本章中，我们将重点关注 API 描述。在 DataFetchers 章节 中，我们将讨论此 API 描述是如何连接到执行逻辑的。\n\n##\
  \ 模式优先 (Schema-first)\n\n“模式优先”是指 GraphQL 模式的设计应该独立完成，而不应该从其他内容生成或推断出来。模式不应该从数据库模式、Java\
  \ 领域类或 REST API 生成。\n\n模式应该是模式优先的，因为它们应该是以经过深思的方式创建的，而不仅仅是生成的。尽管 GraphQL API 与用于获取数据的数据库模式或\
  \ REST API 有许多共同之处，但模式仍然应该是经过深思构建的。\n\n我们坚信，这是任何现实世界中 GraphQL API 的唯一可行方法，我们将只关注这种方法。Spring\
  \ for GraphQL 和 GraphQL Java 均支持“模式优先”。\n\n在 GraphQL Java 中，模式由 `GraphQLSchema`\
  \ 实例表示。这可以通过 SDL 创建，也可以通过编程方式创建。这两种方法都是“模式优先”的，因为模式是经过深思设计的。在本书中，所有示例都将使用通过 SDL\
  \ 创建的模式。\n\n## 在 Spring for GraphQL 中加载模式资源\n\nSpring for GraphQL 会自动加载 `src/main/resources/graphql`\
  \ 目录下扩展名为 `.graphqls` 或 `.gqls` 的模式文件。你只需要将模式文件保存在正确的位置即可。你也可以从不同的位置加载模式文件，请参阅[文档](https://docs.spring.io/spring-graphql/docs/current/reference/html/#execution-schema-resources)。\n\
  \n在底层，Spring for GraphQL 自动读取模式文件、解析文件并实例化 GraphQL Java 的 `GraphQLSchema` 对象。\n\n\
  ## 模式元素\n\nGraphQL Java 中的模式表示为 `GraphQLSchema` 实例，它是 `GraphQLSchemaElement` 的图。我们将描述\
  \ `GraphQLSchema` 的重要元素以及 SDL 格式的记法。\n\n## GraphQL 类型\n\n模式中最重要的元素是类型。GraphQL 系统中有八种类型：Object、Interface、Union、Enum、Scalar、InputObject、List\
  \ 和 NonNull。前六种是“命名类型”，因为每个类型在整个模式中都有唯一的名称，而 List 和 NonNull 是“包装类型”，因为它们包装了命名类型，正如我们之后将看到的。\n\
  \n另一种类型分类区分了输入类型和输出类型。输出类型是描述结果的类型，而输入类型用于描述 GraphQL 请求的输入数据。我们将在关于 GraphQL 查询语言的下一章节详细介绍请求。\n\
  \n![Input and Output types](img/file9.png)\n\n输入和输出类型\n\n## 无处不在字段\n\n模式中最显著的元素是字段。对象和接口包含带有参数的字段。输入对象拥有输入字段，不能带有参数。如果我们眯起眼看，可以将模式看作带有字段列表的类型列表。\n\
  \n在 GraphQL Java 中，字段通过 `GraphQLFieldDefinition` 实例表示对象和接口字段，通过 `GraphQLInputObjectField`\
  \ 表示输入对象。\n\n## 标量 (Scalar)\n\n标量是描述某些允许值的原始类型。例如，`Boolean` 标量意味着值可以是 `true` 或 `false`，`Int`\
  \ 可以 -2³¹ 到 2³¹ 之间的任何数字，`String` 可以任何字符串字面量。标量的名称在整个模式中必须唯一。\n\nGraphQL 自带五个标量：`String`、`Int`、`Float`、`Boolean`\
  \ 和 `ID`。此外，每个 GraphQL 服务都可以定义自己的自定义标量。\n\n\n\n\n在 SDL 中，自定义标量需要显式声明，而内置标量可以在无需任何声明的情况下直接使用。\n\
  \n```\n\"\"\"\n一个表示不带时区的自定义日期标量。\n注意这个自定义标量必须显式声明。\n\"\"\"\nscalar Date @specifiedBy(url:\n\
  \  \"https://scalars.graphql.org/andimarek/local-date\")\n\ntype Pet {\n    \"String\
  \ 是内置标量，因此不需要声明。\"\n    name: String\n    dateOfBirth: Date\n}\n```\n\n内置的 `@specifiedBy`\
  \ 指令链接到自定义标量的规范 URL。我们将在指令章节 中更详细地讨论这一点。`@specifiedBy` 指令是可选的，但强烈建议使用。\n\n## 枚举\
  \ (Enum)\n\n枚举类型描述了一组可能的值的列表。它可以作为输入类型或输出类型。枚举和标量是 GraphQL 类型系统的原始类型。枚举名称在整个 schema\
  \ 中必须是唯一的。\n\n以下是在 SDL 中声明枚举的方法：\n\n```\nenum PetKind {\n    CAT, DOG, BIRD\n}\n\
  \ntype Pet {\n    name: String\n    kind: PetKind # 用作输出类型\n}\n\ntype Query {\n\
  \    pets(kind: PetKind!): [Pet] # 用作输入类型\n}\n```\n\n或者，枚举也可以通过每个值占一行的方式进行声明。这是因为逗号\
  \ `,` 被视为空白字符并被忽略。\n\n```\nenum PetKind {\n    CAT\n    DOG\n    BIRD\n}\n```\n\n\
  在 GraphQL Java 中，枚举由 `GraphQLEnumType` 实例表示。\n\n## 对象 (Object)\n\nGraphQL 对象类型通过字段列表来描述数据的特定形状。它在整个\
  \ schema 中有一个唯一的名称。每个字段都有一个特定的类型，该类型必须是输出类型。每个字段都有一有一个可选的参数列表。允许递归引用。\n\n对象类型在 SDL\
  \ 中通过 `type` 声明。\n\n```\ntype Pet {\n    name: String\n    color: String\n    friend:\
  \ Pet # 递归引用\n    owners: [Person!] # 人员列表\n}\n\ntype Person {\n    name: String\n\
  }\n\ntype Query {\n    pet(name: String!): Pet # 通过名称查找宠物\n}\n```\n\n在 GraphQL Java\
  \ 中，对象类型由 `GraphQLObjectType` 实例表示，并用 `GraphQLFieldDefinition` 定义其字段。\n\n## 输入对象\
  \ (Input object)\n\n输入对象类型描述了一组输入字段，每个字段都有一个输入类型。输入对象的名称在整个 schema 中必须是唯一的。\n\n\
  在 SDL 中，输入对象通过 `input` 声明。\n\n```\ninput PetFilter {\n    minAge: Int\n    maxAge:\
  \ Int\n}\n\ntype Pet {\n    name: String\n    age: Int\n}\n\ntype Query {\n    pets(filter:\
  \ PetFilter): [Pets]\n}\n```\n\n## 接口 (Interface)\n\n与对象类似，接口通过字段列表描述数据的特定形状并具有名称。与对象不同，接口可以被另一个接口或对象实现。实现接口的接口或对象必须包含接口中定义的相同字段。从这个意义上说，接口用于描述一种抽象形状，该形状可以由不同的对象来实现。\n\
  \n与对象类似，每个字段都有一个可选的参数列表。每个参数都有名称和类型，该类型必须是输入类型。\n\nSDL 中的接口声明为 `interface`。其他接口或对象的实现通过\
  \ `implements` 后面跟接口名称来指定。\n\n\n\n\n\n```graphql\ntype Query {\n    pet(name: String!):\
  \ Pet # 通过名称查找宠物\n}\n\ntype Pet {\n    name: String\n    color: String\n}\n```\n\
  \n可以使用等号 `=` 可选地定义默认值。在下面的示例中，你可以获取特定数量的宠物。或者，如果没有指定宠物数量，它将默认为 20。\n\n```graphql\n\
  type Query {\n  pets(howMany: Int = 20): [Pet]\n}\n```\n\n参数可以是可选或强制的。如果参数类型是非空（non-null）且没有默认值，则该参数是强制的。否则，该参数是可选的。例如，参数\
  \ `name: String!` 是强制的。\n\n## 带描述的文档\n\n文档是 GraphQL 的一项强大功能。字段和类型的等 GraphQL 定义描述嵌入在模式中，与其定义在一起。这些描述通过内省（introspection）可用，并用于生成交互式文档。\n\
  \n几乎每个 SDL 元素都可以拥有 [Markdown](https://commonmark.org/) 格式的描述作为文档。描述可以是引号 `\"` 包裹的字符串字面量，也可以包裹在三引号\
  \ `\"\"\"` 中的块字符串，用于带有换行符或额外 Markdown 的多行文档。\n\n```graphql\ntype Query {\n    \"\
  所有当前已知宠物\"\n    pets: [Pet]\n}\n\n\"\"\"\n宠物可以是狗，也可以是猫。\n宠物有一个人类所有者。\n\"\"\"\ntype\
  \ Pet {\n    name: String\n    owner: Person\n}\n```\n\n这些描述被汇编成文档，例如截图“Documentation\
  \ in GraphiQL”中的 [GraphiQL 游练场](https://github.com/graphql/graphiql)。\n\n![Documentation\
  \ in GraphiQL](img/file10.png)\n\nGraphiQL 中的文档\n\n若要在 GraphiQL 中访问文档，请点击左上角的书籍图标。请查看“引言”（Introduction）章节了解如何将\
  \ GraphiQL 添加到你的 Spring for GraphQL 应用中。\n\n[GraphQL 规范](https://spec.graphql.org/draft/#sec-Descriptions)\
  \ 建议模式和所有其他定义（包括类型、字段和参数）应该提供描述，除非它们被认为是自解释的。\n\n## 注释\n\n注释以哈希符号 `#` 开始，行行的所有内容都被视为注释的一部分。例如：\n\
  \n```graphql\ntype Query {\n    # 这是一个注释\n    hello: String\n}\n\n### 多行注释\n###\
  \ 需要\n### 多个哈希符号\n```\n\n注意，注释与描述有很大区别。描述用于构建模式的文档，这些文档通过内省可用。注释像空白字符一样被忽略，且不用于文档。\n\
  \n在本章中，我们讨论了描述 API 结构的模式元素。在 DataFetchers 章节 中，我们将讨论此 API 如何连接到执行请求的逻辑。在讨论 DataFetchers\
  \ 之前，让我们先讨论 GraphQL 查询语言。\n\n## GraphQL 查询语言\n\nGraphQL 查询语言是一种领域特定语言（DSL），它允许消费者定义他们想要的操作。\n\
  \n请注意，“查询语言”这一短语包含了查询（queries）、变变（mutations）和订阅（subscriptions），我们将在本章中讨论。\n\n查询语言语法与\
  \ GraphQL 模式密切相关。GraphQL 模式定义了查询语言中哪些查询、变变或订阅是有效的。在下面的查询语言示例中，假设有一个相应的 GraphQL 模式使得该查询语言有效。\n\
  \n## 字面量\n\n查询语言包含几个镜像模式输入类型的字面量。\n\n*   `String` 字面量写为 `\"String literal\"`，用双引号包裹。\n\
  *   `Boolean` 字面量为 `true` 或 `false`。\n*   `Int` 字面量写为 `123`。\n*   `Float` 字面量写为\
  \ `123.45`。\n*   无值的字面量（Null）写为 `null`。\n*   列表字面量写为 `[\"one list element\", \"\
  another list element\"]`，用方括号包裹。\n*   枚举值写为 `ENUM_VALUE`。\n*   输入对象字面量写为 `{ someField:\
  \ \"value\", anotherOne: { fieldInField: 123 } }`。它们代表无序键列表，用花括号包裹。\n\n## 操作\n\n\
  GraphQL 中有三种操作：\n\n*   `query`，只读获取\n*   `mutation`，写入后进行获取\n*   `subscription`，长连接请求，用于响应事件并获取数据\n\
  \n在 GraphQL 模式中，这些操作被建模为根操作类型。\n\n在 GraphQL 查询语言中，这些操作也构成了查询的根。\n\n## 查询操作\n\n在\
  \ GraphQL 模式中，这些操作被建模为根操作类型。\n\n查询操作是一个只读获取。\n\n一个名为 `myQuery` 的简单查询如下：\n\n```graphql\n\
  query myQuery {\n    someField\n}\n```\n\n查询操作请求 `data`。在这个示例中，`pet` 是根：\n\n```graphql\n\
  query {\n    pet\n}\n```\n\n`petName` 操作请求一个子选择：\n\n```graphql\nquery petName {\n\
  \    pet {\n        name\n    }\n}\n```\n\n此查询中选中的字段对应于相应的模式：\n\n```graphql\ntype\
  \ Query {\n    pet: Pet\n}\n\ntype Pet {\n    name: String\n}\n```\n\nGraphQL 的一个关键特性是只返回选中的字段，不多也不少。要求进行子选择是一项刻意的决定，以确保客户端始终收到他们请求的内容。\n\
  \n作为一个更复杂的例子，查询可以请求宠物地址的国家：\n\n```graphql\nquery petDetails {\n    pet {\n     \
  \   name\n        owner {\n            address {\n                country\n    \
  \        }\n        }\n    }\n}\n```\n\n查询始终针对 API 的模式进行验证。我们不能查询未定义的字段。\n\n对于此模式：\n\
  \n```graphql\ntype Query {\n    pet: Pet\n}\n\ntype Pet {\n    name: String\n}\n\
  ```\n\n我们将无法执行以下无效查询。由于 `Pet` 类型上没有 `nickName` 字段，将抛出错误：\n\n```graphql\nquery invalid\
  \ {\n    pet {\n        name\n        nickName\n    }\n}\n```\n\n## 变变操作\n\n变更操作是一个写入后进行获取。变变应该产生副作用，通常意味着更改（或“变异”）某些数据。\n\
  \n使用 `mutation` 关键字声明变更操作，后跟变变的名称：\n\n```graphql\nmutation myMutation {\n    changeSomething\n\
  }\n```\n\n变更操作的每个根字段必须是模式中 `Mutation` 对象类型的字段。根据 GraphQL 规范，只有变更操作的根字段可以产生副作用。\n\
  \n\n\n\n变更操作中根字段的子选择在语义上与查询等同。在实践中，让变更返回部分已更改的数据很有用。例如，在更新 `User` 的名称后，在响应中接收新更改的\
  \ `User` 是很有用的。\n\n例如，在 schema 中，`changeUser` 字段定义在 `Mutation` 类型中：\n\n```graphql\n\
  type Mutation {\n    changeUser(newName: String!): User\n}\n\ntype User {\n    name:\
  \ String\n    address: Address\n}\n\ntype Address {\n    street: String\n    country:\
  \ String\n}\n```\n\n在将用户名更改为“Brad”之后，我们可以像普通查询一样查询已更改用户的详情。注意看子选择的形式与查询子选择完全一致。\n\
  \n```graphql\nmutation changeUserName {\n    changeUser(newName: \"Brad\") {\n \
  \       name\n        address {\n            street\n            country\n     \
  \   }\n    }\n}\n```\n\n如果变更操作中有两个或多个根字段，它们将将按照 GraphQL 规范的要求按顺序执行。\n\n```graphql\n\
  mutation mutationWithTwoRootFields {\n    first: changeName(name: \"Bradley\")\n\
  \    second: changeName(name: \"Brad\")\n}\n```\n\n在这个示例中，用户的最终名称将始终是“Brad”，因为字段总是按顺序执行的。第二次更改名称为“Brad”将总是最后执行。\n\
  \n## 订阅操作\n\n订阅（Subscription）是一种长连接请求，当发生新事件时向客户端发送更新。\n\n例如，如果客户端想要获取符合特定标准的每封新邮件：\n\
  \n```graphql\nsubscription newMessage {\n    newEmail(criteria: {\n        sender:\
  \ \"luna@example.com\",\n        contains: \"playing\" }\n    ) {\n        text\n\
  \    }\n}\n```\n\n订阅只能包含正好一个根字段，例如 `newEmail`。这与可以包含许多根字段的查询和变更操作不同。\n\n订阅的执行以及传输层对请求的处理与查询和变更有显著不同。这仅仅是因为响应特定事件的长连接订阅请求，比简单的查询（或变更）请求、执行和响应过程要复杂得多。我们将在订阅章节中进一步讨论。\n\
  \n## 参数\n\n字段可以拥有参数，其类型在 schema 中定义。参数可以是可选的，也可以是强制的。正如 Schema 章节 中过的，如果参数是非空的（用\
  \ `!` 表示）且没有默认值（用 `=` 声明），则该参数是强制的。\n\n例如，定义了一个具有强制 `id` 参数的 `pet` 字段的 schema：\n\
  \n```graphql\ntype Query {\n    pet(id: ID!): Pet\n}\n\ntype Pet {\n    name: String\n\
  }\n```\n\n在查询中，这是使用字符串字面量“123”作为 `id` 值来请求 `pet`：\n\n```graphql\nquery petSearch\
  \ {\n    pet(id: \"123\") {\n        name\n    }\n}\n```\n\n参数可以是任何字面量，包括 `null`，只要它符合\
  \ schema。例如，这里有一个输入对象字面量的查询。\n\n```graphql\nquery petAgeSearch {\n    pets(filter:\
  \ { minAge: 10, maxAge: 20 }) {\n        name\n    }\n}\n```\n\n操作中的参数类型必须与其对应的\
  \ schema 定义。如果 schema 要求 `Int` 参数值，而我们在查询中提供了 `Boolean`，则错误的参数会导致验证错误。\n\n## 片段\n\
  \n片段（Fragments）允许我们复用查询的一部分。片段是针对特定类型的所选字段列表（包括子选择）。片段有一个名称和类型条件，类型条件必须是对象、接口（interface）或联合（union）。\n\
  \n片段在操作外部声明。片段的语法为：\n\n```graphql\nfragment <FragmentName> on <TypeCondition> {\n\
  \    <fields>\n}\n```\n\n在操作中使用片段扩展（fragment spread）来使用片段：\n\n```graphql\n...<FragmentName>\n\
  ```\n\n例如，让我们定义一个 `personDetails` 片段，以复用 `Person` 的重复字段。在 `petOwners` 查询中使用该片段。\n\
  \n```graphql\nfragment personDetails on Person {\n    firstName\n    lastName\n\
  \    title\n}\nquery petOwners {\n    pets {\n        owner {\n            ...personDetails\n\
  \        }\n        previousOwner {\n            ...personDetails\n        }\n \
  \   }\n}\n```\n\n在这个示例中，我们使用了两次 `personDetails`，分别用于 `owner` 和 `previousOwner` 字段。\n\
  \n## 内联片段\n\n内联片段（Inline fragments）是带有类型条件的字段选择。内联片段用于根据类型查询不同的字段。你可以将它们认为依赖于字段类型的\
  \ `switch` 语句。\n\n内联片段与片段不同，因为它们是内联声明的，而不是在操作外部。与片段不同，内联片段没有名称，且无法复用。\n\n内联片段的语法为：\n\
  \n```graphql\n... on <TypeCondition> {\n    <fields>\n}\n```\n\n考虑此 schema：\n\n\
  ```graphql\ntype Query {\n    pets: [Pet]\n}\n\ninterface Pet {\n    name: String\n\
  }\n\ntype Dog implements Pet {\n    name: String\n    doesBark: Boolean\n}\n\ntype\
  \ Cat implements Pet {\n    name: String\n    doesMeow: Boolean\n}\n```\n\n我们可以编写内联片段来查询\
  \ `Dog` 结果的 `doesBark` 字段以及 `Cat` 结果的 `doesMeow` 字段。\n\n```graphql\nquery allThePets\
  \ {\n    pets {\n        ... on Dog {\n            doesBark\n        }\n       \
  \ ... on Cat {\n            doesMeow\n        }\n    }\n}\n```\n\n根据 `Pet` 类型，我们选择了不同的字段。对于\
  \ `Dog` 我们只感兴趣 `doesBark`，而对于 `Cat` 我们只感兴趣 `doesMeow`。\n\n实现接口的类型可能会添加并非所有实现都具备的字段。例如，`doesBark`\
  \ 字段只出现在 `Dog` 类型中。必须使用片段或内联片段来查询跨实现无法保证的字段。\n\n作为反例，下面的查询是无效的，因为 `Pet` 接口中没有 `doesBark`\
  \ 字段。\n\n```graphql\nquery invalid {\n    pets {\n        doesBark\n    }\n}\n```\n\
  \n联合类型必须使用片段或内联片段。GraphQL 联合表示类型列表中任意类型的对象，但联合类型本身不定义任何字段。\n\n例如，考虑这个包含两个重要食品类的示例\
  \ schema：\n\n```graphql\nunion Food = Pizza | IceCream\n\ntype Query {\n    dinner:\
  \ [Food]\n}\n\ntype Pizza {\n    name: String\n    toppings: [String]\n}\n\ntype\
  \ IceCream {\n    name: String\n    flavors: [String]\n}\n```\n\n对 `dinner` 的查询必须包含片段或内联片段，因为联合类型本身不定义任何字段。\n\
  \n\n\n\n\n```graphql\nquery healthyDinner {\n    dinner {\n        ... on Pizza\
  \ {\n            name\n            toppings\n        }\n        ... on IceCream\
  \ {\n            name\n            flavors\n        }\n    }\n}\n```\n\n以下查询是无效的，因为联合类型\
  \ `Food` 没有定义任何字段。\n\n```graphql\nquery invalid {\n    dinner {\n        toppings\n\
  \        flavors\n    }\n}\n```\n\n## 变量\n\n我们可以在 GraphQL 操作中包含参数变量，这允许客户端重用操作，而无需动态重新构建它们。\n\
  \n操作可以声明变量，作为整个操作的输入。\n\n要声明变量，请在操作名称之后定义它们。变量名以 `$` 开头，后紧跟类型。变量可以使用感叹号 `!` 标记为非空，类似于字段或指令的参数。\n\
  \n例如，变量 `petId` 的类型为 `ID`，并且它是非空的。\n\n```graphql\nquery findPet($petId: ID!) {\n\
  \    pet(id: $petId) {\n        name\n    }\n}\n```\n\n可以提供默认值，定义在等号 `=` 之后。\n\n\
  ```graphql\nquery findPet2($petId: ID! = \"12345DefaultId\") {\n    pet(id: $petId)\
  \ {\n        name\n    }\n}\n```\n\n可以有多个变量。在示例变变中，第一个变量是必须的，第二个不是不是。\n\n```graphql\n\
  mutation changePetName($petId: ID!, $petName: String) {\n    changePetName(id: $petId,\
  \ name: $petName) {\n        success\n    }\n}\n```\n\n变量值与操作一起发送。例如，我们想要找到 ID 为\
  \ `9000` 的宠物。\n\n```graphql\nquery findPet($petId: ID!) {\n    pet(id: $petId) {\n\
  \        name\n    }\n}\n```\n\n如果以 JSON 格式提供变量值查找 ID 为 `9000` 的宠物，我们将发送：\n\n```json\n\
  {\n  \"petId\": \"9000\"\n}\n```\n\n## 别名\n\n默认情况下，响应对象中的键将设置为操作中对应的字段名。别名允许重命名响应中的键。\n\
  \n使用名称后跟冒号来定义别名：\n\n```graphql\nquery aliases {\n    alias1: someField\n    alias2:\
  \ someField\n}\n```\n\n虽然简单的重命名很有用，但别名更多地用于使用不同的参数多次查询同一个字段。由于响应键默认设置为字段名，如果我们想两次使用同一个字段，别名是必不可少的。例如：\n\
  \n```graphql\ntype Query {\n    search(filter: String!): String\n}\n```\n\n```graphql\n\
  query searches {\n    search1: search(filter: \"Foo\")\n    search2: search(filter:\
  \ \"Bar\")\n}\n```\n\n此查询将产生一个包含数据的响应：\n\n```json\n{\n  \"search1\": \"Foo result\"\
  ,\n  \"search2\": \"Bar result\"\n}\n```\n\n## GraphQL 文档\n\nGraphQL 可执行文档（通常简写为文档）是使用\
  \ GraphQL 查询语言符号编写的文本，包含至少一个查询、变变或订阅操作，以及可选的片段列表。\n\n### 具名和未命名操作\n\n操作名称是 `query`、`mutation`\
  \ 或 `subscription` 关键字之后的单词。在以下示例中，操作名称是 `findPet`。\n\n```graphql\nquery findPet($petId:\
  \ ID!) {\n    pet(id: $petId) {\n        name\n    }\n}\n```\n\n（注：原文中存在大量重复的段落，根据指令“不要重复输出原文”原则，此处仅保留首处逻辑说明翻译）\n\
  \n\n\n\n这种面向字段的数据加载方法与 REST 不同，在 REST 中，我们为每个资源的每个端点实现逻辑。而在 GraphQL 中，只有一个端点，数据加载根据请求按每个字段进行。这被带到了\
  \ Spring 控制中，我们将每个字段 `DataFetcher` 映射到 `Controller` 中的一个方法。这意味着 Spring for GraphQL\
  \ 控制器方法代表的是 GraphQL 的 `field`（字段），而不是 REST 的 `resource`（资源）。\n\n虽然每个字段都有关联的 `DataFetcher`，但在实践中，你并不需要为每个字段手动编写\
  \ `DataFetcher`。在在本章稍后的 PropertyDataFetcher 章节 中，我们将展示如何将大多数字段自动映射到 `DataFetchers`。\n\
  \n## Spring for GraphQL 注解方法\n\nSpring for GraphQL 提供了一种基于注解的编程模型，其中被标记了注解的方法会被注册为\
  \ `DataFetchers`。在本章的后半部分，我们将仔细查看 GraphQL Java 引擎内部的 `DataFetcher` 接口。现在，我们将看到 Spring\
  \ for GraphQL 控制器注解如何用更少的样板代码实现相同的结果。\n\n在继续之前，有几个关键类与 `DataFetchers` 紧密相关。在 GraphQL\
  \ Java 中，`GraphQLSchema` 既是 API 的结构（或形状），也是针对其执行请求所需的所有逻辑。另一个关键 GraphQL Java 概念是\
  \ `RuntimeWiring`，它包含了 `GraphQLCodeRegistry`，这是一个从 字段到 `DataFetchers` 的映射。每个 `DataFetcher`\
  \ 都需要注册到 `RuntimeWiring` 内部的 `GraphQLCodeRegistry` 中。\n\n注解控制器方法允许我们实现一个 `DataFetcher`\
  \ 并自动将其注册到 `RuntimeWiring` 内部的 `GraphQLCodeRegistry` 中。虽然 Spring Boot starter 会自动初始化并管理\
  \ GraphQL Java 的 `RuntimeWiring`，但你也可以灵活地手动访问并修改它。在本章稍后部分，当我们演示如何添加自定义标量 时，我们将看到如何修改\
  \ `RuntimeWiring`。\n\nSpring for GraphQL 四种不同的 schema 映射注解：通用的 `@SchemaMapping`\
  \ 以及三个快捷注解：`@QueryMapping`、`@MutationMapping` 和 `@SubscriptionMapping`。\n\n`@QueryMapping`\
  \ 是查询类型 `DataFetcher` 的快捷注解，`@MutationMapping` 和 `@SubscriptionMapping` 分别用于变更和订阅类型。这三者都是通用的\
  \ `@SchemaMapping` 注解的快捷方式，后者接收参数 `typeName` 和 `field`，用来指示 `DataFetcher` 应该映射到哪种类型和字段。\n\
  \n让我们通过示例来看这些注解。这是一个 Pet schema：\n\n```\ntype Query {\n    favoritePet: Pet\n}\n\
  \ntype Pet {\n    name: String\n    owner: Person\n}\n\ntype Person {\n    firstName:\
  \ String\n    lastName: String\n}\n```\n\n配合 Pet 和 Owner record 类：\n\n```java\n\
  package myservice.service;\n\nrecord Pet(String name, String ownerId) {\n}\n```\n\
  \n```java\npackage myservice.service;\n\nrecord Person(String id, String firstName,\
  \ String lastName) {\n}\n```\n\n以下是使用 Spring for GraphQL 控制器注解注册这两个 `DataFetchers`\
  \ 的方法：\n\n```\npackage myservice.service;\n\nimport org.springframework.graphql.data.method.annotation.QueryMapping;\n\
  import org.springframework.graphql.data.method.annotation.SchemaMapping;\nimport\
  \ org.springframework.stereotype.Controller;\n\n@Controller\nrecord PetsController(PetService\
  \ petService) {\n\n  @QueryMapping\n  Pet favoritePet() {\n    return petService.getFavoritePet();\n\
  \  }\n\n  @SchemaMapping(typeName = \"Pet\", field = \"owner\")\n  Person owner(Pet\
  \ pet) {\n    return petService.getPerson(pet.ownerId());\n  }\n}\n```\n\n`favoritePet`\
  \ 方法被标记了 `@QueryMapping`，表示它将被注册到 `Query` 类型中的一个字段上。默认情况下，Spring for GraphQL 会根据方法名确定字段名。这意味着\
  \ `favoritePet` 方法将被注册为字段 `favoritePet` 的 `DataFetcher`。\n\n`owner` 方法被标记了 `@SchemaMapping`，表示它将被注册到\
  \ `Pet` 类型中的一个字段上。\n\n## Spring for GraphQL 中的 PropertyDataFetchers\n\n我们之前提到每个字段都有一个关联的\
  \ `DataFetcher`。然而，在之前的 Pet 示例中，我们有五个字段，但只实现了两个 `DataFetchers`。这实际上是一个真实的场景。\n\n\
  虽然每个字段都有一个 `DataFetcher`，但我们只需要自己实现几个 `DataFetchers`。剩下的是 GraphQL Java 自动生成的默认 `DataFetchers`，被称为\
  \ `PropertyDataFetchers`。这在图“每个字段一个 DataFetcher”中所示。\n\n每个字段一个 DataFetcher\n\n**当\
  \ schema 父 DataFetcher 返回的 Java 对象时，`PropertyDataFetcher` 是完美选择。**\n\n回到我们的 Pet\
  \ 示例是理解点的最佳方式：我们为三个字段准备了 `PropertyDataFetcher`：`Pet.name`、`Person.firstName` 和 `Person.lastName`。\n\
  \n`PetService` 返回的 `Pet` record 类是：\n\n```java\npackage myservice.service;\n\nrecord\
  \ Pet(String name, String ownerId) {\n}\n```\n\n这是 `Person` record 类：\n\n```java\n\
  package myservice.service;\n\nrecord Person(String id, String firstName, String\
  \ lastName) {\n}\n```\n\n`Pet.name` 的父字段是 `Query.favoritePet`，我们的 `DataFetcher`\
  \ `favoritePet` 返回包含属性 `name` 的 Java 对象 `Pet`，该属性通过标准的 getter 方法暴露，因此 GraphQL 字段\
  \ `name` 与 Java 属性完全匹配。`Person` 也是如此：第二个 `DataFetcher` `owner` 返回一个 `Person` Java\
  \ 对象，其结构与 schema 相同：都包含名为 `firstName` 和 `lastName` 的两个字符串。\n\n**只要 GraphQL 字段匹配\
  \ Java 对象属性，`PropertyDataFetcher` 就可以从 Java 对象中获取数据。** 在我们的示例中，这意味着 Java 属性遵循 Java\
  \ getter 命名规范。\n\n\n\n\n\n`PropertyDataFetcher` 还可以从 Java 字段获取数据，与 record 类兼容，并且可以从\
  \ `java.util.Map` 中访问值。\n\n对 `Map` 的支持对于快速模拟（mock）DataFetchers 非常有用。例如，我们的 `owner`\
  \ DataFetcher 可以使用 `Map` 返回相同的 `Person` 对象。\n\n```java\n@SchemaMapping\nMap<String,\
  \ String> owner(Pet pet) {\n  return Map.of(\"firstName\",\"Andi\",\n    \"lastName\"\
  ,\"Marek\");\n}\n```\n\n不需要其他更改。`Map` 的键与 schema 字段 `firstName` 和 `lastName` ，因此\
  \ `PropertyDataFetcher` 将加载正确的值。\n\n## DataFetchers 和 schema 映射处理方法\n\n关于命名的简单说明。`@SchemaMapping`\
  \ 以及快捷注解 `@QueryMapping`、`@MutationMapping` 和 `@SubscriptionMapping` 用于声明 schema\
  \ 映射处理方法，这些方法随后会被 Spring for GraphQL 注册为 DataFetcher。schema 映射处理方法与 `DataFetcher`\
  \ 之间存在一一一的关系。因此，在本书的剩余部分中，我们将使用 DataFetcher 一词来指代这些 schema 映射处理方法。\n\n从技术上讲，schema\
  \ 映射处理方法并没有直接实现 `DataFetcher` 接口。是 Spring for GraphQL 的 `AnnotatedControllerConfigurer`\
  \ 将这些处理方法注册为 DataFetcher。但由于这些概念是一一对应的，我们希望你将这些 schema 映射处理方法视为 DataFetcher。\n\n\
  ## Spring for GraphQL 中的 TypeResolver\n\n如果字段的类型是 `interface`（接口）或 `union`（联合），GraphQL\
  \ Java 需要通过 `TypeResolver` 确定值的实际对象类型。关于接口和联合的介绍，请参见前面的 Schema 章节。\n\n例如，让我们考虑一个\
  \ `Pet` 接口，它由 `Cat` 和 `Dog` 类型实现。\n\n```graphql\ntype Query {\n    favoritePet:\
  \ Pet\n}\n\ninterface Pet {\n    name: String\n    owner: Person\n}\n\ntype Dog\
  \ implements Pet {\n    name: String\n    owner: Person\n    doesBark: Boolean\n\
  }\n\ntype Cat implements Pet {\n    name: String\n    owner: Person\n    doesMeow:\
  \ Boolean\n}\n\ntype Person {\n    firstName: String\n    lastName: String\n}\n\
  ```\n\n你可能不需要编写自己的 `TypeResolver`，因为 Spring for GraphQL 注册了一个实现了 `TypeResolver`\
  \ 接口的默认 `ClassNameTypeResolver`。它尝试将值的简单类名与 `GraphQLObjectType` 进行匹配。如果找不到匹配项，它将继续搜索超类型，包括基类和接口。这个默认的\
  \ `TypeResolver` 在 `graphql.GraphQL` 初始化时注册。\n\n如果你的 Java 模型与 API 是 1:1 映射且不需要任何额外配置，那么默认的\
  \ `ClassNameTypeResolver` 就足够了。你可以修改默认 `ClassNameTypeResolver` 的行为（参见[文档](https://docs.spring.io/spring-graphql/docs/current/reference/html/#execution.graphqlsource.default-type-resolver)），或通过\
  \ `RuntimeWiringConfigurer` 手动提供自己的 `TypeResolver`。\n\n对于此示例 schema，为了使用默认类型解析器，请创建一个\
  \ `Pet` Java 接口以及实现 `Pet` 的 `Dog` 和 `Cat` 类。\n\n```java\npackage myservice.service;\n\
  \ninterface Pet {\n  String name();\n  String ownerId();\n}\n```\n\n```java\npackage\
  \ myservice.service;\n\nrecord Dog(String name, String ownerId, Boolean doesBark)\
  \ \n  implements Pet {\n}\n```\n\n```java\npackage myservice.service;\n\nrecord\
  \ Cat(String name, String ownerId, Boolean doesMeow) \n  implements Pet {\n}\n```\n\
  \n然后为 Dog 和 Cat 类型添加两个 owner DataFetchers。\n\n```java\npackage myservice.service;\n\
  \nimport org.springframework.graphql.data.method.annotation.QueryMapping;\nimport\
  \ org.springframework.graphql.data.method.annotation.SchemaMapping;\nimport org.springframework.stereotype.Controller;\n\
  \n@Controller\nrecord PetsController(PetService petService) {\n  @QueryMapping\n\
  \  Pet favoritePet() {\n    return petService.favoritePet();\n  }\n\n  @SchemaMapping\n\
  \  Person owner(Dog dog) {\n    return petService.getPerson(dog.ownerId());\n  }\n\
  \n  @SchemaMapping\n  Person owner(Cat cat) {\n    return petService.getPerson(cat.ownerId());\n\
  \  }\n}\n```\n\n这是一个查询喜喜宠物的示例查询：\n\n```graphql\nquery bestPet {\n    favoritePet\
  \ {\n        name\n        owner {\n            firstName\n        }\n        ...on\
  \ Dog {\n            doesBark\n        }\n        ...on Cat {\n            doesMeow\n\
  \        }\n    }\n}\n```\n\n如果你遇到默认的 `ClassNameTypeResolver` 不适用的情况，可以通过通过创建 `RuntimeWiringConfigurer`\
  \ Bean 来手动注册 `TypeResolver`。`RuntimeWiringConfigurer` 接收 `RuntimeWiring.Builder`\
  \ 作为参数。\n\n```java\npackage myservice.service;\n\nimport graphql.schema.TypeResolver;\n\
  import graphql.schema.idl.TypeRuntimeWiring;\nimport org.springframework.context.annotation.Bean;\n\
  import org.springframework.context.annotation.Configuration;\nimport org.springframework.graphql.execution.RuntimeWiringConfigurer;\n\
  import static graphql.schema.idl.TypeRuntimeWiring.newTypeWiring;\n\n@Configuration\n\
  class Config {\n  TypeResolver petTypeResolver = (env) -> {\n    // 你的自定义类型解析\n\
  \  };\n\n  @Bean\n  RuntimeWiringConfigurer runtimeWiringConfigurer() {\n    return\
  \ wiringBuilder -> {\n      TypeRuntimeWiring petWiring = newTypeWiring(\"Pet\"\
  )\n        .typeResolver(petTypeResolver)\n        .build();\n      wiringBuilder.type(petWiring);\n\
  \    };\n  }\n}\n```\n\n当我们在本章后面详细查看 GraphQL Java 中的 TypeResolver 时，我们将看到如何使用纯 GraphQL\
  \ Java 手动编写自己的 `TypeResolver`。\n\n### Spring for GraphQL 中的参数\n\n要访问 GraphQL 参数，请通过\
  \ `@Argument` 注解声明它们。\n\n例如，schema 中的一个搜索字段带有参数。\n\n```graphql\ntype Query {\n \
  \   search(pattern: String, limit: Int): String\n}\n```\n\n在 Spring for GraphQL\
  \ 中，参数通过 `@Argument` 注解声明。\n\n```java\npackage myservice.service;\n\nimport org.springframework.graphql.data.method.annotation.Argument;\n\
  import org.springframework.graphql.data.method.annotation.QueryMapping;\nimport\
  \ org.springframework.stereotype.Controller;\n\n@Controller\nclass SearchController\
  \ {\n\n  @QueryMapping\n  String search(@Argument String pattern, @Argument int\
  \ limit) {\n    // 你的搜索逻辑\n  }\n}\n```\n\n\n\n\n\n`@Argument` 注解会自动获取方法的参数名称（如果可用），作为\
  \ GraphQL 参数的名称。请注意，这在 Java 8+ 中需要 `-parameters` 编译器标志，或者需要编译器的调试信息。你可能已经启用了该标志。\n\
  \n也可以通过注解自定义名称，如下例所示：\n\n```java\npackage myservice.service;\n\nimport org.springframework.graphql.data.method.annotation.Argument;\n\
  import org.springframework.graphql.data.method.annotation.QueryMapping;\nimport\
  \ org.springframework.stereotype.Controller;\n\n@Controller\nclass SearchController\
  \ {\n\n  @QueryMapping\n  String search(@Argument(\"pattern\") String searchPattern,\n\
  \                       @Argument(\"limit\") int maxElements) {\n    // 在此处编写搜索逻辑\n\
  \  }\n\n}\n```\n\nSpring for GraphQL 使用输入对象参数（input object arguments）变得简单得多。我们将在章稍后的部分看到，在\
  \ GraphQL Java 中，我们总是为输入对象获取 `java.util.Map`。Spring for GraphQL 通过将兼容的 GraphQL 参数自动绑定到\
  \ Java 类，简化了这一步骤。\n\n例如，一个带有输入对象参数的搜索 schema：\n\n```graphql\ntype Query {\n    search(input:\
  \ SearchInput): String\n}\n\ninput SearchInput {\n    pattern: String\n    limit:\
  \ Int\n}\n```\n\n`SearchInput` 记录类：\n\n```java\npackage myservice.service;\n\nrecord\
  \ SearchInput(String pattern, int limit) {\n}\n```\n\n以及搜索控制器方法：\n\n```java\npackage\
  \ myservice.service;\n\nimport org.springframework.graphql.data.method.annotation.Argument;\n\
  import org.springframework.graphql.data.method.annotation.QueryMapping;\nimport\
  \ org.springframework.stereotype.Controller;\n\n@Controller\nclass SearchController\
  \ {\n\n  @QueryMapping\n  String search(@Argument SearchInput input) {\n    // 在此处编写搜索逻辑\n\
  \  }\n\n}\n```\n\n该输入对象被绑定到 `SearchInput` 的实例。这比在没有 Spring for GraphQL 的使用 GraphQL\
  \ Java 时代表输入对象的 `java.util.Map` 更容易处理。\n\n如果没有 Spring for GraphQL 的参数注入，输入对象将是一个\
  \ map，处理起来没有那么方便。\n\n```java\npackage myservice.service;\n\nimport graphql.schema.DataFetchingEnvironment;\n\
  import org.springframework.graphql.data.method.annotation.QueryMapping;\nimport\
  \ org.springframework.stereotype.Controller;\n\nimport java.util.Map;\n\n@Controller\n\
  class SearchController {\n\n  @QueryMapping\n  String search(DataFetchingEnvironment\
  \ env) {\n    Map<String, Object> input = env.getArgument(\"input\");\n    String\
  \ pattern = (String) input.get(\"pattern\");\n    int limit = (int) input.get(\"\
  limit\");\n    // 在此处编写搜索逻辑\n  }\n\n}\n```\n\n## 更多 Spring for GraphQL 输入\n\nSpring\
  \ for GraphQL 还支持以下用于 schema 映射处理方法的方法参数。\n\n| 参数 | 说明 |\n| --- | --- |\n| Arguments\
  \ | 将所有参数绑定到单个对象 |\n| Source | 访问父实例 |\n| DataLoader | 来自 `registry` 的 `DataLoader`\
  \ |\n| ContextValue | 来自 `GraphQLContext` 的值 |\n| LocalValue | 来自 `localContext`\
  \ 的值 |\n| Context | `Context` 对象 |\n| DataFetching | `DataFetchingEnvironment` |\n\
  | Locale | `Locale` |\n| DataFetchingEnvironment | `DataFetchingEnvironment` |\n\
  | SelectionSet | `SelectionSet` |\n\n## 在 Spring for GraphQL 中添加自定义标量\n\n在 Schema\
  \ 中，除了内置类型，还可以添加自定义标量（scalars）。在我们看到的示例中：\n\n```graphql\ntype Pet {\n    name: String\n\
  \    dateOf: Date\n}\n```\n\n你可以使用库中的自定义标量实现，或者实现自己的。在这里我们将演示 [Extended Scalars](https://github.com/graphql-java/graphql-java-scalars)\
  \ 库，它由 GraphQL Java 团队维护。要在 GraphQL Java 中使用 `Date` 标量，请添加该包。\n\n对于 Gradle，在你的 `build.gradle`\
  \ 中添加：\n\n```gradle\nimplementation 'com.graphql-java:graphql-java-scalars:19.1'\n\
  ```\n\n对于 Maven：\n\n```xml\n<dependency>\n  <groupId>com.graphql-java</groupId>\n\
  \  <artifactId>graphql-java-scalars</artifactId>\n  <version>19.1</version>\n</dependency>\n\
  ```\n\n要在 Spring for GraphQL 中接接自定义标量，创建一个 `RuntimeWiringConfigurer` 。这将 `graphql-java-scalars`\
  \ 中的 `Date` 实现链接到你 schema 中声明的 `scalar Date`。\n\n```java\npackage myservice.service;\n\
  \nimport graphql.scalars.ExtendedScalars;\nimport org.springframework.context.annotation.Bean;\n\
  import org.springframework.context.annotation.Configuration;\nimport org.springframework.graphql.execution.RuntimeWiringConfigurer;\n\
  \n@Configuration\nclass GraphQlConfig {\n\n  @Bean\n  RuntimeWiringConfigurer runtimeWiringConfigurer()\
  \ {\n    return wiringBuilder ->\n      wiringBuilder.scalar(ExtendedScalars.Date);\n\
  \  }\n\n}\n```\n\n注意：Extended Scalars 库的主版本号与链接的 Java 发布主版本对应。由于书中的示例是使用 Spring\
  \ for GraphQL 1.1.2（它使用 GraphQL Java 19）编写的，我们将使用 Extended Scalars 19.1。\n\nSpring\
  \ Boot Starter 会自动检测所有的 `RuntimeWiringConfigurer` Bean。\n\n## 底层：GraphQL Java 内部的\
  \ DataFetchers\n\nSpring for GraphQL 自动化了将 DataFetchers 注册到 schema 字段的大部分工作。通过使用\
  \ Spring for GraphQL 控制器注解，你可能根本看不到 DataFetcher 或 `RuntimeWiring` 这些词。\n\n\n\n\n\
  为了更深入地理解 Spring for GraphQL 如何将数据获取逻辑连接到模式（schema），我们将讨论 GraphQL Java 的底层工作原理。在你的\
  \ Spring for GraphQL 应用中，你不需要编写本章剩余部分中的任何代码，但我们希望通过向你展示基础知识，来具体地解释 Spring 的“魔法”所在。\n\
  \n在本章的后半部分，我们将使用纯 GraphQL Java 构建一个可执行的模式。本章稍后部分将提供一个完整的端到端示例。\n\n## GraphQL Java\
  \ 中的 DataFetchers\n\n回想一下，GraphQL 操作基本上是一个字段树。我们需要指示 `GraphQL` `Java` 如何为每个字段加载数据。因此，每个字段必须有一个关联的\
  \ `DataFetcher`。\n\n在本章之前的章节，我们涵盖了如何使用 Spring for GraphQL 的控制器注解（如 `@QueryMapping`\
  \ 和 `@SchemaMapping`）来创建和注册 `DataFetchers`。现在让我们看看如何在不使用 Spring 自动“魔法”的情况下，为 `Pet`\
  \ 模式编写等效代码。\n\n`DataFetcher` 负责为某一个字段加载数据。在 GraphQL Java 内部，它被表示为一个通用的 Java 接口。\n\
  \n```\npublic interface DataFetcher<T> {\n  T get(DataFetchingEnvironment environment)\
  \ throws Exception;\n}\n```\n\n该接口只有一个方法 `get`，带有一个参数 `DataFetchingEnvironment`。返回的结果可以是任何类型。这个接口直接反映了\
  \ `GraphQL` 的一个核心原则：它不关心数据源自何。\n\n让我们为早之前 Spring for GraphQL 示例中的简单 `Pet` 模式实现 `DataFetchers`。注意，我们实现的是初始示例，其中\
  \ `Pet` 是一个对象类型而不是接口。\n\n```\ntype Query {\n    favoritePet: Pet\n}\n\ntype Pet\
  \ {\n    name: String\n    owner: Person\n}\n\ntype Person {\n    firstName: String\n\
  \    lastName: String\n}\n```\n\n作为一个通用规则，至少每个根字段都需要实现一个 `DataFetcher`。让我们为 `Query.favoritePet`\
  \ 实现 `DataFetcher`。注意，该逻辑与本章早之前 Spring for GraphQL 示例中的 `favoritePet` 控制器方法是相同的。\n\
  \n```java\n// 底层服务执行检索数据的工作\nPetService petService = new PetService();\n\nDataFetcher<Pet>\
  \ favoritePetDataFetcher = (env) -> {\n  return petService.getFavoritePet();\n};\n\
  ```\n\n这个 `DataFetcher` 也反映了最佳实践：`DataFetcher` 应该是轻量级的。`DataFetcher` 应该只处理 GraphQL\
  \ 特有的方面，并将实际的数据检索委托给更下层。\n\n这个特定的 `favoritePetDataFetcher` 非常简单，完全没有利用 `DataFetchingEnvironment`\
  \ (`env`)。\n\n由 `PetService` 返回的 `Pet` 记录类与本章早之前 Spring for GraphQL 示例中使用的类相同。\n\
  \n```java\npackage myservice.service;\n\nrecord Pet(String name, String ownerId)\
  \ {}\n```\n\n以及 `Person` 记录类：\n\n```java\npackage myservice.service;\n\nrecord Person(String\
  \ id, String firstName, String lastName) {}\n```\n\n由于 `Pet` 只包含一个 `ownerId` 而不是完整的\
  \ `Person` 对象，我们需要加载更多数据。让我们实现另一个 `DataFetcher`。\n\n```java\n// 底层服务执行检索数据的工作\n\
  PetService petService = new PetService();\n\nDataFetcher<Pet> favoritePetDataFetcher\
  \ = (env) -> {\n  return petService.getFavoritePet();\n};\n\nDataFetcher<Person>\
  \ ownerDataFetcher = (env) -> {\n  // 为该 Pet 加载正确的 Person\n  Pet pet = env.getSource();\n\
  \  return petService.getPerson(pet.ownerId());\n};\n```\n\n在 `ownerDataFetcher`\
  \ 中，我们需要访问 `DataFetchingEnvironment` 的 `source` 对象，它是一个 `Pet` 类型的对象。为了检索所有者的详细信息，宠物的实例信息是必要的。\n\
  \n为了凸显 Spring for GraphQL 的便利性，让我们与之前编写的 `owner` `DataFetcher` 进行对比：\n\n```java\n\
  @SchemaMapping\nPerson owner(Pet pet) {\n  return petService.getPerson(pet.ownerId());\n\
  }\n```\n\nSpring for GraphQL 将 `Pet` 源对象作为方法参数注入，而不是通过 `env.getSource()` 从 `DataFetchingEnvironment`\
  \ 手动访问它。\n\n## GraphQL Java 中的 Source 对象\n\n让我们扩展之前的示例，以更好地理解 `DataFetchers` 在实践中的工作方式，并讨论重要的\
  \ `source` 对象。\n\n`source` 来自于父字段 DataFetcher 的结果，该结果在子字段 DataFetcher 执行之前已经执行。`source`\
  \ 可以是任何内容，因此 `DataFetchingEnvironment` 中的实际方法签名是非常通用的。\n\n```java\n<T> T getSource();\
  \ // DataFetchingEnvironment 中\n```\n\n在上一节中，我们实现了一个 `ownerDataFetcher`。`ownerDataFetcher`\
  \ 的目的是加载一个 `Person`。\n\n```java\nDataFetcher<Person> ownerDataFetcher = (env) ->\
  \ {\n  // 为该 Pet 加载正确的 Person\n  Pet pet = env.getSource();\n  return petService.getPerson(pet.ownerId());\n\
  };\n```\n\n我们知道父级 DataFetcher `favoritePet` 返回了一个 `Pet`。我们可以通过 `DataFetchingEnvironment`\
  \ 的 `source` 对象访问父 DataFetcher 的结果。\n\n```java\nPet pet = env.getSource();\n```\n\
  \n然后使用宠物的所有者 ID 来查找所有者：\n\n```java\nreturn petService.getPerson(pet.ownerId());\n\
  ```\n\n除了根字段外，我们可以始终安全地假设 `source` 不是 `null`，因为根字段没有父字段。如果 DataFetcher 返回 `null`（这是一个有效的响应），执行将停止，子\
  \ DataFetchers 不会被调用。\n\n`source` 对象对于每个非根 DataFetcher 都是特定的。它为每个子 DataFetcher 了数据源和额外信息。\n\
  \n## GraphQL Java 中的 RuntimeWiring\n\n`RuntimeWiring` 是包含 `GraphQLCodeRegistry`\
  \ 的 GraphQL Java 类，后者将模式字段映射到 DataFetchers。\n\n我们实现了两个 DataFetchers，但还没有指示 GraphQL\
  \ Java 哪些模式字段对应它们。这是使用纯 GraphQL 代码在 `RuntimeWiring` 中手动注册 DataFetchers 的方法：\n\n\
  ```java\nTypeRuntimeWiring queryWiring = newTypeWiring(\"Query\")\n  .dataFetcher(\"\
  favoritePet\", favoritePetDataFetcher)\n  .build();\nTypeRuntimeWiring petWiring\
  \ = newTypeWiring(\"Pet\")\n  .dataFetcher(\"owner\", ownerDataFetcher)\n  .build();\n\
  \nRuntimeWiring runtimeWiring = newRuntimeWiring()\n  .type(queryWiring)\n  .type(petWiring)\n\
  \  .build();\n```\n\nSpring for GraphQL 的模式映射注解实现了 DataFetcher，并将它们自动注册到 `RuntimeWiring`\
  \ 内部 `GraphQLCodeRegistry` 中模式的正确字段和类型坐标上。\n\n\n\n我们在本章的早期中看到，另一个关键概念 `RuntimeWiring`\
  \ 包含了 `GraphQLCodeRegistry`，它将 schema 字段映射到 DataFetchers。每个 `DataFetcher` 都都需要在\
  \ `RuntimeWiring` 内部的 `GraphQLCodeRegistry` 中注册。\n\n在纯 GraphQL Java 代码中，以下是从头到尾创建\
  \ `GraphQLSchema` 的过程，以及一个执行查询的示例。\n\n```java\nimport graphql.GraphQL;\nimport graphql.schema.DataFetcher;\n\
  import graphql.schema.GraphQLSchema;\nimport graphql.schema.idl.RuntimeWiring;\n\
  import graphql.schema.idl.SchemaGenerator;\nimport graphql.schema.idl.SchemaParser;\n\
  import graphql.schema.idl.TypeDefinitionRegistry;\nimport graphql.schema.idl.TypeRuntimeWiring;\n\
  import myservice.service.Person;\nimport myservice.service.Pet;\nimport myservice.service.PetService;\n\
  \nimport static graphql.schema.idl.RuntimeWiring.newRuntimeWiring;\nimport static\
  \ graphql.schema.idl.TypeRuntimeWiring.newTypeWiring;\n\npublic class PureGraphQLJava\
  \ {\n\n  public static void main(String[] args) {\n    String sdl = \"\"\"\n   \
  \ type Query {\n        favoritePet: Pet\n    }\n    \n    type Pet {\n        name:\
  \ String\n        owner: Person\n    }\n    \n    type Person {\n        firstName:\
  \ String\n        lastName: String\n    }\n    \"\"\";\n    TypeDefinitionRegistry\
  \ parsedSdl = new SchemaParser().parse(sdl);\n\n    // Lower level layer service\
  \ does the work of retrieving data\n    PetService petService = new PetService();\n\
  \n    DataFetcher<Pet> favoritePetDataFetcher = (env) -> {\n      return petService.getFavoritePet();\n\
  \    };\n\n    DataFetcher<Person> ownerDataFetcher = (env) -> {\n      // Load\
  \ the correct Person for the Pet\n      Pet pet = env.getSource();\n      return\
  \ petService.getPerson(pet.ownerId());\n    };\n\n    TypeRuntimeWiring queryWiring\
  \ = newTypeWiring(\"Query\")\n      .dataFetcher(\"favoritePet\", favoritePetDataFetcher)\n\
  \      .build();\n    TypeRuntimeWiring petWiring = newTypeWiring(\"Pet\")\n   \
  \   .dataFetcher(\"owner\", ownerDataFetcher)\n      .build();\n\n    RuntimeWiring\
  \ runtimeWiring = newRuntimeWiring()\n      .type(queryWiring)\n      .type(petWiring)\n\
  \      .build();\n\n    GraphQLSchema schema = new SchemaGenerator()\n      .makeExecutableSchema(parsedSdl,\
  \ runtimeWiring);\n    GraphQL graphQL = GraphQL.newGraphQL(schema).build();\n \
  \   System.out.println(\"data:\" + graphQL\n      .execute(\"query pureGJ {favoritePet{name\
  \ owner{firstName}}}\")\n      .getData());\n  }\n}\n```\n\nschema 首先从字符串中解析。该 schema\
  \ 也可以从文件中解析。然后，实例化包含我们 `DataFetchers` 的 `TypeRuntimeWiring` 对象。紧接着，将这些 `TypeRuntimeWiring`\
  \ 对象注册到 `RuntimeWiring` 中。最后，通过结合解析后的 schema 和 `RuntimeWiring` 创建可执行的 schema。幸运的是，你不需要编写任何此类代码来实例化可执行的\
  \ schema，这由 Spring for GraphQL 自动管理。\n\n## GraphQL Java 中的 TypeResolver\n\n如果字段的类型是接口（interface）或联合（union），GraphQL\
  \ Java 需要通过 `TypeResolver` 来确定值的实际对象。在 GraphQL Java 中，`TypeResolver` 是一个非常通用的接口：\n\
  \n```java\npublic interface TypeResolver {\n  ObjectType getType(TypeResolutionEnvironment\
  \ env);\n}\n```\n\n每个接口和联合类型都有关联的 `TypeResolver`，就像每个字段都有关联的 `DataFetcher` 一样。需要实现\
  \ `TypeResolver` 接口。如果在不使用 Spring for GraphQL 默认 `ClassName` 的情况下使用 GraphQL Java，我们必须实现自己的\
  \ `TypeResolver`。回顾这个示例以理解 `TypeResolver` 在没有 Spring 魔法的情况下是如何工作的。例如，让我们为这个扩展的 schema\
  \ 编写一个 `TypeResolver`：\n\n```graphql\ntype Query {\n    favoritePet: Pet\n}\ninterface\
  \ Pet {\n    name: String\n    owner: Person\n}\ntype Dog implements Pet {\n   \
  \ name: String\n    owner: Person\n    doesBark: Boolean\n}\ntype Cat implements\
  \ Pet {\n    name: String\n    owner: Person\n    doesMeow: Boolean\n}\ntype Person\
  \ {\n    firstName: String\n    lastName: String\n}\n```\n\n如果直接使用 GraphQL Java，为上述\
  \ `Pet` 接口实现 `TypeResolver` 的方式如下。在这个示例中，我们将 Java 类映射到 schema 类型。然而，你可以在此处实现任何逻辑来解析类型：\n\
  \n```java\nTypeResolver petTypeResolver = (env) -> {\n  Object javaObject = env.getObject();\n\
  \  if (javaObject instanceof Dog) {\n    return env.getSchema().getObjectType(\"\
  Dog\");\n  } else if (javaObject instanceof Cat) {\n    return env.getSchema().getObjectType(\"\
  Cat\");\n  } else {\n    return null;\n  }\n};\n```\n\n然后，该 `TypeResolver` 会通过 `TypeRuntimeWiring`\
  \ 注册到 `RuntimeWiring` 中，类似于 `DataFetchers` 的注册。以下是注册 `TypeResolver` 以及为 `Cat` 和\
  \ `Dog` 类型所需的新 `DataFetcher` 连线的方法：\n\n```java\n// Lower level layer service does\
  \ the work of retrieving data\nPetService petService = new PetService();\n\nDataFetcher<Pet>\
  \ favoritePetDataFetcher = (env) -> {\n  return petService.getFavoritePet();\n};\n\
  \nDataFetcher<Person> ownerDataFetcher = (env) -> {\n  // Load the correct Person\
  \ for the Pet\n  Pet pet = env.getSource();\n  return petService.getPerson(pet.ownerId());\n\
  };\n\nTypeResolver petTypeResolver = (env) -> {\n  Object javaObject = env.getObject();\n\
  \  if (javaObject instanceof Dog) {\n    return env.getSchema().getObjectType(\"\
  Dog\");\n  } else if (javaObject instanceof Cat) {\n    return env.getSchema().getObjectType(\"\
  Cat\");\n  } else {\n    return null;\n  }\n};\n\nTypeRuntimeWiring queryWiring\
  \ = newTypeWiring(\"Query\")\n  .dataFetcher(\"favoritePet\", favoritePetDataFetcher)\n\
  \  .build();\n\nTypeRuntimeWiring petWiring = newTypeWiring(\"Pet\")\n  .typeResolver(petTypeResolver)\n\
  \  .build();\n\nTypeRuntimeWiring catWiring = newTypeWiring(\"Cat\")\n  .dataFetcher(\"\
  owner\", ownerDataFetcher)\n  .build();\n\nTypeRuntimeWiring dogWiring = newTypeWiring(\"\
  Dog\")\n  .dataFetcher(\"owner\", ownerDataFetcher)\n  .build();\n\nRuntimeWiring\
  \ runtimeWiring = newRuntimeWiring()\n  .type(queryWiring)\n  .type(petWiring)\n\
  \  .type(catWiring)\n  .type(dogWiring)\n  .build();\n```\n\n\n\n\n很可能，你不需要编写或注册任何\
  \ `TypeResolver`，而是直接使用 Spring for GraphQL 默认的 `ClassNameTypeResolver`。然而，我们希望这一章节能让你更好地理解\
  \ GraphQL Java 中接口（interfaces）和联合类型（unions）是如何解析的。\n\n在本章中，我们涵盖了 `DataFetchers`\
  \ 的核心内容，即连接模式与数据的逻辑。我们学习了如何在 Spring for GraphQL 中创建 `DataFetchers`。然后，我们深入了 GraphQL\
  \ Java 的内部机制。我们看到了 `DataFetchers` 在 GraphQL Java 中是如何运作的，并在不使用 Spring “魔法”的情况下，重新创建了相同的\
  \ `DataFetchers` 和可执行的架构。\n\n我们希望你对 `DataFetchers` 以及 Spring for GraphQL 如何消除大量样板代码有了更深入的理解。我们将在\
  \ DataFetchers 深度解析章节中涵盖更多高级的主题，并在执行章节中深入探讨执行过程。\n\n# 构建 GraphQL 服务\n\n本章侧重于使用 Spring\
  \ for GraphQL 构建服务的实操方面，并利用了我们在前章节中涵盖的概念。我们将基于在引言章节中开始的服务继续构建。在本章结束时，你将实现一个更实质性的\
  \ GraphQL 服务。\n\n## Spring for GraphQL\n\nSpring for GraphQL 的首页为 https://spring.io/projects/spring-graphql，源代码可以在\
  \ GitHub 上访问：https://github.com/spring-projects/spring-graphql。\n\n使用 Spring for\
  \ GraphQL 启动并运行一个项目的最佳方法是通过 https://start.spring.io 上的 Spring Initializr 工具。我们之前在引言章节的[“你的第一个\
  \ Spring for GraphQL 服务”部分中创建了该应用程序。\n\nSpring for GraphQL 项目包含多个制品：\n\n- `org.springframework.graphql:spring-graphql`:\
  \ 将 GraphQL Java 与 Spring 框架集成。\n- `org.springframework.boot:spring-boot-starter-graphql`:\
  \ 这是 GraphQL 的 Spring Boot Starter。\n- `org.springframework.graphql:spring-graphql-test:`:\
  \ Spring for GraphQL 的测试支持。我们将在测试章节中讨论此内容。\n\n除了 Spring for GraphQL 仓库外，某些 Boot\
  \ 特定的代码位于[Spring Boot 仓库](https://github.com/spring-projects/spring-boot)中。\n\n\
  当我们说“Spring for GraphQL”时，指的是带有 Spring Boot 的 Spring for GraphQL。\n\n## GraphQL\
  \ Java\n\nGraphQL Java 随 Spring for GraphQL 自动包含。如果你直接使用 GraphQL Java，可以通过 Maven\
  \ 或 Gradle 将其作为依赖添加到项目中。\n\nGraphQL Java 的首页为 https://www.graphql-java.com，源代码可以在\
  \ GitHub 上访问：https://github.com/graphql-java/graphql-java。\n\nGraphQL Java 拥有极少的依赖以最大化其使用率。[SLF4J](https://www.slf4j.org/)\
  \ 是唯一的关键依赖。\n\n每个版本的 GraphQL Java 包含两个部分：主版本和 修复部分。在编写时，最新的 Spring for GraphQL 1.1.2\
  \ 使用 GraphQL Java 19.2。GraphQL Java 不使用语义化版本。\n\n## Spring WebFlux 或 Spring MVC\n\
  \nSpring for GraphQL 同时支持响应式 Spring WebFlux 和 Spring MVC。启动新项目时，请选择以下一种作为依赖：\n\n\
  ```\norg.springframework.boot:spring-boot-starter-webflux\n```\n\n或\n\n```\norg.springframework.boot:spring-boot-starter-web\n\
  ```\n\nSpring for GraphQL 会自动检测其中一种依赖。在本章中，我们将在示例中使用 WebFlux，但通过移除 `Mono` 和 `Flux`\
  \ 类型，可以将所有示例轻松更改为 Spring MVC 版本。\n\n## 读取架构\n\nSpring for GraphQL 然后会扫描 `src/main/resources/graphql/`\
  \ 下以 `*.graphqls` 或 `*.gqls` 结尾的架构文件。找到并成功加载架构文件后，Spring for GraphQL 默认在 `/graphql`\
  \ 端点暴露 GraphQL API。\n\n## 配置属性\n\nSpring for GraphQL 提供了配置属性，无需编写代码即可调整默认行为。\n\n\
  - **Path**: 默认情况下，GraphQL API 通过 `/graphql` 暴露。可以通过设置 `spring.graphql.path` 为其他值来修改。\n\
  - **GraphiQL**: GraphiQL 是一个交互式的浏览器内 GraphQL IDE。Spring for GraphQL 内置了 GraphiQL\
  \ 支持，但默认启用。通过 `spring.graphql.graphiql.enabled=true` 激活它。默认 GraphiQL 路径为 `/graphiql`，可以通过\
  \ `spring.graphql.graphiql.path` 修改。\n- **Schema files**: Spring for GraphQL 会从默认位置\
  \ `classpath:graphql/**/` 扫描默认扩展名为 `*.graphqls` 和 `*.gqls` 的架构定义语言 (SDL) 文件。\n\n\
  你可以通过 `spring.graphql.schema.locations.file-extensions` 修改文件扩展名，并通过 `spring.graphql.schema.locations`\
  \ 修改位置。\n\n## 扩展我们的 Spring for GraphQL 服务\n\n在引言章节的“你的第一个 Spring for GraphQL 服务”部分中，我们构建了一个最小的\
  \ Spring for GraphQL 服务并执行了第一次查询。让我们回顾过去几个章节中的关键 Spring for GraphQL 概念，并构建一个功能更完整的\
  \ GraphQL 服务。\n\n## 宠物架构 (Pet schema)\n\n让我们继续引言章节的“你的第一个 Spring for GraphQL 服务”中开始的\
  \ GraphQL 服务，这是一个用于宠的 API。复习引言章节获取如何创建和下载 Spring for GraphQL 的指令。我们有一个简单的查询字段 `pets`，返回关于宠物的基本信息。你应该已经在\
  \ `src/main/resources/graphql/` 中有了这个架构文件。\n\n```graphql\ntype Query {\n    pets:\
  \ [Pet]\n}\n\ntype Pet {\n    name: String\n    color: String\n}\n```\n\n## 控制器\
  \ (Controllers)\n\n回顾 DataFetchers：DataFetchers 加载单个字段的数据。它们是执行 GraphQL 请求最重要的概念，因为它们连接了你的架构和数据。我们将使用\
  \ Spring for GraphQL 的注解编程模型来注册 DataFetchers，这之前在 DataFetchers 章节中讨论过。`@Controller`\
  \ 组件使用注解声明处理方法为特定字段的 DataFetcher。由于我们有一个查询字段 `pets`，让我们使用 `@QueryMapping` 注解。我们将\
  \ Pets 表示为 record 类。\n\n```java\npackage myservice.service;\n\nrecord Pet(String\
  \ name, String color) {}\n```\n\n```java\npackage myservice.service;\n\nimport org.springframework.graphql.data.method.annotation.QueryMapping;\n\
  import org.springframework.stereotype.Controller;\nimport java.util.List;\n\n@Controller\n\
  class PetsController {\n\n  @QueryMapping\n  List<Pet> pets() {\n    return List.of(\n\
  \      new Pet(\"Luna\", \"cappuccino\"),\n      new Pet(\"Skipper\", \"black\"\
  ));\n  }\n}\n```\n\n`@QueryMapping` 快捷注解将 `pets()` 方法注册为查询字段 `pets` 的 DataFetcher。我们不需要指定架构字段名称，因为它是从方法名自动检测的。有关\
  \ `@SchemaMapping` 以及像 `@QueryMapping` 这样的快捷版本的更多信息，请参见 DataFetchers 章节中的注解方法部分。\n\
  \n\n\n\n\n在这个示例中，我们不需要为 Pet 的字段 `name` 和 `color` 手动编写 `DataFetchers`。请记住，`name`\
  \ 和 `color` 的 `PropertyDataFetchers 是自动注册的，因为 GraphQL 字段与 Java 对象的属性匹配。关于 `PropertyDataFetchers`\
  \ 的更多信息，请参见早前的 DataFetchers 章节。\n\n`pets()` 方法目前返回的是一个内存列表。我们将在下一节中将其更改为调用另一个服务。\n\
  \n## 从外部服务获取数据\n\nGraphQL 与数据源无关。让我们将数据源从内存列表升级为更符合真实的场景。在生产服务中，你可能希望通过 Spring 的\
  \ `WebClient` 从另一个服务（例如 REST 服务）获取数据。\n\n```java\npackage myservice.service;\n\n\
  import org.springframework.graphql.data.method.annotation.QueryMapping;\nimport\
  \ org.springframework.stereotype.Controller;\nimport org.springframework.web.reactive.function.client.WebClient;\n\
  import reactor.core.publisher.Flux;\n\n@Controller\nclass PetsController {\n\n \
  \   WebClient petWebClient;\n\n    PetsController(WebClient.Builder builder) {\n\
  \        this.petWebClient = builder.baseUrl(\"http://pet-service\").build();\n\
  \    }\n\n    @QueryMapping\n    Flux<Pet> pets() {\n        return petWebClient.get()\n\
  \          .uri(\"/pets\")\n          .retrieve()\n          .bodyToFlux(Pet.class);\n\
  \    }\n}\n```\n\n在我们升级后的 `pets` DataFetcher 中，`bodyToFlux` 调用根据 `http://pets-service/pets`\
  \ 的 JSON 响应返回一个 `Flux<Pet>`。这是一个占位 URL，用于替代 REST 端点。如果你还没有想好的外部服务，可以在后续示例中恢复到使用内存对象。\n\
  \n## 源对象\n\nGraphQL 的核心概念是，你可以编写灵活的查询来精确地获取你需要的信息。\n\n让我们扩展 Pet Schema，为每只宠物建模一个主人。\n\
  \n```graphql\ntype Query {\n    pets: [Pet]\n}\n\ntype Pet {\n    name: String\n\
  \    color: String\n    owner: Person\n}\n\ntype Person {\n    name: String\n}\n\
  ```\n\n现在我们可以查询每只宠物主人的姓名。\n\n```graphql\nquery petsAndOwners {\n    pets {\n   \
  \     name\n        owner {\n            name\n        }\n    }\n}\n```\n\n我们的外部\
  \ Pet 服务仅包含带有 `ownerId` 的主人引用。为了获取如主人的 `name` 等信息，我们必须联系另一个独立的主人服务。为了建模这一点，向 Pet\
  \ 类中添加 `ownerId` 字段。\n\n```java\npackage myservice.service;\n\nrecord Pet(String\
  \ name, String color, String ownerId) {}\n```\n\n为 Person 添加一个类，它是 owner 字段的类型：\n\
  \n```java\npackage myservice.service;\n\nrecord Person(String name) {}\n```\n\n\
  为了为给定的宠物列表获取主人信息，我们需要实现一个名为 `owner` 的新 DataFetcher，它接受 `Pet` 作为参数。参数 `Pet` 被称为“源对象”（source\
  \ object），因为它决定了我们为哪只宠物获取主人数据。\n\n```java\npackage myservice.service;\n\nimport\
  \ org.springframework.graphql.data.method.annotation.QueryMapping;\nimport org.springframework.graphql.data.method.annotation.SchemaMapping;\n\
  import org.springframework.stereotype.Controller;\nimport org.springframework.web.reactive.function.client.WebClient;\n\
  import reactor.core.publisher.Flux;\nimport reactor.core.publisher.Mono;\n\n@Controller\n\
  class PetsController {\n\n    WebClient petWebClient;\n    WebClient ownerWebClient;\n\
  \n    PetsController(WebClient.Builder builder) {\n        this.petWebClient = builder.baseUrl(\"\
  http://pet-service\").build();\n        this.ownerWebClient = builder.baseUrl(\"\
  http://owner-service\").build();\n    }\n\n    @QueryMapping\n    Flux<Pet> pets()\
  \ {\n        return petWebClient.get()\n          .uri(\"/pets\")\n          .retrieve()\n\
  \          .bodyToFlux(Pet.class);\n    }\n\n    @SchemaMapping\n    Mono<Person>\
  \ owner(Pet pet) {\n        return ownerWebClient.get()\n          .uri(\"/owner/{id}\"\
  , pet.ownerId())\n          .retrieve()\n          .bodyToMono(Person.class);\n\
  \    }\n}\n```\n\n\n\n```java\npackage myservice.service;\n\nimport org.springframework.graphql.data.method.annotation.Argument;\n\
  import org.springframework.graphql.data.method.annotation.QueryMapping;\nimport\
  \ org.springframework.graphql.data.method.annotation.SchemaMapping;\nimport org.springframework.stereotype.Controller;\n\
  import org.springframework.web.reactive.function.client.WebClient;\nimport reactor.core.publisher.Flux;\n\
  import reactor.core.publisher.Mono;\n\n@Controller\nclass PetsController {\n\n \
  \ WebClient petWebClient;\n  WebClient ownerWebClient;\n\n  PetsController(WebClient.Builder\
  \ builder) {\n    this.petWebClient = builder.baseUrl(\"http://pet-service\").build();\n\
  \    this.ownerWebClient = builder.baseUrl(\"http://owner-service\")\n         \
  \                   .build();\n  }\n\n  @QueryMapping\n  Flux<Pet> pets() {\n  \
  \  return petWebClient.get()\n      .uri(\"/pets\")\n      .retrieve()\n      .bodyToFlux(Pet.class);\n\
  \  }\n\n  @SchemaMapping\n  Mono<Person> owner(Pet pet) {\n    return ownerWebClient.get()\n\
  \      .uri(\"/owner/{id}\", pet.ownerId())\n      .retrieve()\n      .bodyToMono(Person.class);\n\
  \  }\n\n  // 新\n  @QueryMapping\n  Mono<Pet> pet(@Argument String id) {\n    return\
  \ petWebClient.get()\n      .uri(\"/pets/{id}\", id)\n      .retrieve()\n      .bodyToMono(Pet.class);\n\
  \  }\n}\n```\n\n正如我们在查询语言章节中所看到的，参数也可以是一个输入对象。\n\n输入对象类型描述了一组输入字段，每个字段都有一个输入类型。在\
  \ SDL 中，输入对象是用 `input` 关键字声明的。\n\n让我们引入一个新的查询字段 `petSearch`，它接收一个输入对象 `PetSearchInput`。\n\
  \n```graphql\ntype Query {\n    pets: [Pet]\n    pet(id: ID!): Pet\n    petSearch(input:\
  \ PetSearchInput!): [Pet] # 新字段\n}\n\n# 新的输入类型\ninput PetSearchInput {\n    namePattern:\
  \ String\n    ownerPattern: String\n}\n\ntype Pet {\n    id: ID!\n    name: String\n\
  \    color: String\n    owner: Person\n}\n\ntype Person {\n    name: String\n}\n\
  ```\n\n让我们添加一个 Java 类 `PetSearch` 来表示模式中的输入类型。为了将此输入对象作为参数访问，我们将其作为 `petSearch`\
  \ 方法的参数添加。\n\n```java\npackage myservice.service;\n\nrecord PetSearch(String namePattern,\
  \ String ownerPattern) {}\n```\n\n```java\npackage myservice.service;\n\nimport\
  \ org.springframework.graphql.data.method.annotation.Argument;\nimport org.springframework.graphql.data.method.annotation.QueryMapping;\n\
  import org.springframework.graphql.data.method.annotation.SchemaMapping;\nimport\
  \ org.springframework.stereotype.Controller;\nimport org.springframework.web.reactive.function.client.WebClient;\n\
  import reactor.core.publisher.Flux;\nimport reactor.core.publisher.Mono;\n\n@Controller\n\
  class PetsController {\n  WebClient petWebClient;\n  WebClient ownerWebClient;\n\
  \n  PetsController(WebClient.Builder builder) {\n    this.petWebClient = builder.baseUrl(\"\
  http://pet-service\").build();\n    this.ownerWebClient = builder.baseUrl(\"http://owner-service\"\
  )\n                            .build();\n  }\n\n  @QueryMapping\n  Flux<Pet> pets()\
  \ {\n    return petWebClient.get()\n      .uri(\"/pets\")\n      .retrieve()\n \
  \     .bodyToFlux(Pet.class);\n  }\n\n  @SchemaMapping\n  Mono<Person> owner(Pet\
  \ pet) {\n    return ownerWebClient.get()\n      .uri(\"/owner/{id}\", pet.ownerId())\n\
  \      .retrieve()\n      .bodyToMono(Person.class);\n  }\n\n  @QueryMapping\n \
  \ Mono<Pet> pet(@Argument String id) {\n    return petWebClient.get()\n      .uri(\"\
  /pets/{id}\", id)\n      .retrieve()\n      .bodyToMono(Pet.class);\n  }\n\n  //\
  \ 新\n  @QueryMapping\n  Flux<Pet> petSearch(@Argument PetSearchInput input) {\n\
  \    // 执行搜索\n  }\n}\n```\n\n## 变更 (Mutations)\n\n正如我们在查询语言章节中所看到的，GraphQL 中通过变更操作\
  \ 更改数据。让我们添加一个变更来更改宠物的名称。\n\n```graphql\ntype Query {\n    pets: [Pet]\n    pet(id:\
  \ ID!): Pet\n    petSearch(input: PetSearchInput!): [Pet]\n}\n\n# 新的变更字段\ntype Mutation\
  \ {\n    changePetName(id: ID!, newName: String!): ChangePetPayload\n}\n\n# 新类型\n\
  type ChangePetPayload {\n    pet: Pet\n}\n\ninput PetSearchInput {\n    namePattern:\
  \ String\n    ownerPattern: String\n}\n\ntype Pet {\n    id: ID!\n    name: String\n\
  \    color: String\n    owner: Person\n}\n\ntype Person {\n    name: String\n}\n\
  ```\n\n变更字段的返回类型以 `Payload` 结尾，以遵循变更响应类型的准标准命名惯例。\n\n这是一个用于将 ID 为“123”的宠物名称更改“Mixie”的变更请求。\n\
  \n```graphql\nmutation changeName { \n    changePetName(id: \"123\", newName: \"\
  Mixie\") {\n        pet {\n            name\n        }\n    }\n}\n```\n\n让我们添加变更负载类。\n\
  \n```java\npackage myservice.service;\n\nrecord ChangePetPayload(Pet pet) {}\n```\n\
  \n使用快捷注解 `@MutationMapping` 实现变更 DataFetcher。\n\n\n\n```java\npackage myservice.service;\n\
  \nimport org.springframework.graphql.data.method.annotation.Argument;\nimport org.springframework.graphql.data.method.annotation.MutationMapping;\n\
  import org.springframework.graphql.data.method.annotation.QueryMapping;\nimport\
  \ org.springframework.graphql.data.method.annotation.SchemaMapping;\nimport org.springframework.http.MediaType;\n\
  import org.springframework.stereotype.Controller;\nimport org.springframework.web.reactive.function.BodyInserters;\n\
  import org.springframework.web.reactive.function.client.WebClient;\nimport reactor.core.publisher.Flux;\n\
  import reactor.core.publisher.Mono;\n\nimport java.util.Map;\n\n@Controller\nclass\
  \ PetsController {\n\n  WebClient petWebClient;\n  WebClient ownerWebClient;\n\n\
  \  PetsController(WebClient.Builder builder) {\n    this.petWebClient = builder.baseUrl(\"\
  http://pet-service\").build();\n    this.ownerWebClient = builder.baseUrl(\"http://owner-service\"\
  )\n                              .build();\n  }\n\n  @QueryMapping\n  Flux<Pet>\
  \ pets() {\n    return petWebClient.get()\n      .uri(\"/pets\")\n      .retrieve()\n\
  \      .bodyToFlux(Pet.class);\n  }\n\n  @SchemaMapping\n  Mono<Person> owner(Pet\
  \ pet) {\n    return ownerWebClient.get()\n      .uri(\"/owner/{id}\", pet.ownerId())\n\
  \      .retrieve()\n      .bodyToMono(Person.class);\n  }\n\n  @QueryMapping\n \
  \ Mono<Pet> pet(@Argument String id) {\n    return petWebClient.get()\n      .uri(\"\
  /pets/{id}\", id)\n      .retrieve()\n      .bodyToMono(Pet.class);\n  }\n\n  @QueryMapping\n\
  \  Flux<Pet> petSearch(@Argument PetSearchInput input) {\n    // 执行搜索\n  }\n\n \
  \ // 新\n  @MutationMapping\n  Mono<ChangePetNamePayload> changePetName(\n    @Argument\
  \ String id,\n    @Argument String newName\n  ) {\n    Map<String, String> changeNameBody\
  \ = Map.of(\n      \"name\", newName\n    );\n    return petWebClient.put()\n  \
  \    .uri(\"/pets/{id}\", id)\n      .contentType(MediaType.APPLICATION_JSON)\n\
  \      .body(BodyInserters.fromValue(changeNameBody))\n      .retrieve()\n     \
  \ .bodyToMono(ChangePetNamePayload.class);\n  }\n}\n```\n\n在我们的 `changePetName`\
  \ 方法中，我们通过 HTTP PUT 请求更新宠物的名称。HTTP PUT 的响应包含了新修改的宠物详情。变变控制器（mutation controller）可以拥有模式映射方法可用的任何参数。在这种情况下，`changePetName`\
  \ 方法接收两个参数 `id` 和 `newName`，它们代表变变字段的参数。\n\n## 联合类型、接口和 TypeResolver\n\n为了演示联合类型（unions）和接口（interfaces），我们将使用一个简单的示例来演示\
  \ Spring 默认的 `TypeResolver` 是如何工作的。如果你想在本章之前的示例中结合使用此 `Pet` 接口，我们将数据反序列化的任务留给你自己，因为反序列化取决于数据源。世界上有许多种宠物，每种宠物都有不同的属性。在我们的模式中，将\
  \ `Pet` 表示为一个 `interface` 会更好。让我们添加两个 `Pet` 的实现：`Dog` 和 `Cat`。你也可以添加你喜欢的 `Pet` 实现。\n\
  \n为了演示联合类型，我们还将添加一个 `Creature` 联合类型以及用于 `creatures` 的新查询字段。\n\n```graphql\ntype\
  \ Query {\n  creatures: [Creature]\n}\n\ninterface Pet {\n  id: ID!\n  name: String\n\
  \  color: String\n}\n\ntype Dog implements Pet {\n  id: ID!\n  name: String\n  color:\
  \ String\n  barks: Boolean\n}\n\ntype Cat implements Pet {\n  id: ID!\n  name: String\n\
  \  color: String\n  meows: Boolean\n}\n\ntype Human {\n  name: String\n}\n\nunion\
  \ Creature = Dog | Cat | Human\n```\n\n注意，GraphQL 规范要求联合类型只能包含对象类型。我们必须指定对象类型 `Dog`\
  \ 和 `Cat`，而不能指定接口 `Pet`。\n\n让我们在 Java 模型中反映这些更改。将 `Pet` 表示为一个接口。\n\n```java\npackage\
  \ myservice.service;\n\ninterface Pet {\n  String id();\n  String name();\n  String\
  \ color();\n}\n```\n\n并创建两个新类 `Dog` 和 `Cat`，它们实现了 `Pet` 接口。\n\n```java\npackage\
  \ myservice.service;\n\nrecord Dog(String id,\n           String name,\n       \
  \    String color,\n           boolean barks) implements Pet {}\n```\n\n```java\n\
  package myservice.service;\n\nrecord Cat(String id,\n           String name,\n \
  \          String color,\n           boolean meows) implements Pet {}\n```\n\n让我们创建一个新的\
  \ `Human` 类。\n\n```java\npackage myservice.service;\n\nrecord Human(String name)\
  \ {}\n```\n\n让我们为新的 `creatures` 查询字段注册一个 DataFetcher。注意，传入的数据必须被转换为正确的 Java 。。这将取决于远程服务的实现。在下面的示例中，我们包含了一个内存列表，因此你可以在设置如何从远程服务请求以及如何反序列化数据之前，验证这是否有效。\n\
  \n```java\npackage myservice.service;\n\nimport org.springframework.graphql.data.method.annotation.QueryMapping;\n\
  import org.springframework.stereotype.Controller;\nimport reactor.core.publisher.Flux;\n\
  \n@Controller\nclass PetsController {\n\n  @QueryMapping\n  Flux<Object> creatures()\
  \ {\n    // 添加你的获取逻辑\n\n    // 内存示例\n    return Flux.just(\n      new Dog(\"Dog01\"\
  , \"Spot\", \"Yellow\", true),\n      new Cat(\"Cat01\", \"Chicken\", \"Orange\"\
  , true),\n      new Human(\"Donna\"));\n  }\n}\n```\n\n在 `http://localhost:8080/graphiql`\
  \ 的 GraphiQL 交互式播放器尝试下面的查询。要启用 GraphiQL，请向你的 `application.properties` 文件添加以下内容。\n\
  \n```\nspring.graphql.graphiql.enabled=true\n```\n\n\n\n\n```graphql\nquery allTheThings\
  \ {\n    creatures {\n        ...on Dog {\n            name\n            barks\n\
  \        }\n        ... on Cat {\n            name\n            meows\n        }\n\
  \        ... on Human {\n            name\n        }\n    }\n}\n```\n\n如果一个字段类型是\
  \ `interface` 或 `union`，GraphQL Java 需要通过 `TypeResolver` 来确定值的实际对象类型。\n\n在此服务中，我们将利用\
  \ Spring for GraphQL 默认的 `ClassNameTypeResolver`，它尝试将值的简单类名与 `GraphQLObjectType`\
  \ 进行匹配。如果无法找到匹配项，它将继续搜索父类型，包括基类和接口。默认的 `ClassNameTypeResolver` 就足够了，因为在我们的服务中，Java\
  \ 模型与 API 是 1:1 映射的。如果你的模型与 API 并不完全匹配，请参阅 DataFetchers 章节中的 `TypeResolver` 部分，了解如何注册自定义的\
  \ `TypeResolver`。\n\n默认的 `ClassNameTypeResolver` 是在 Spring Boot starter 初始化 `graphql.GraphQL`\
  \ 时注册的，因此我们的服务不需要进一步配置。我们不需要手动为 `Pet` 接口或 `Creature` 联合类型编写 `TypeResolver`。\n\n\
  在本章中，你构建了一个更复杂的 Spring for GraphQL 应用，利用了我们在前面章节中讨论过的概念。\n\n如果你还没有，请通过向 `application.properties`\
  \ 文件添加以下内容来启用 GraphiQL 交互式环境。\n\n```\nspring.graphql.graphiql.enabled=true\n```\n\
  \n启动你的服务并导航到 `http://localhost:8080/graphiql` 的 GraphiQL 交互式环境。尝试各种查询和变更，并验证你的代码端端端端。\n\
  \n在随后的章节中，我们将讨论更专门的话题，例如模式设计和 GraphQL 错误。在书后期，我们将涵盖更高级的主题，包括对 GraphQL Java 引擎 `execution`\
  \ 的深度解析。\n\n# Subscriptions\n\nGraphQL 支持三种类型的操作：查询（queries）、变更（mutation）和订阅（subscriptions）。在本章中，我们将扩展订阅操作。虽然查询和变更在许多方面相似，但订阅非常不同。\n\
  \n订阅是一个长连接请求，客户端希望被服务器端的某些事件通知。订阅可以持续几分钟或几小时，而查询或变更最多持续几毫秒到几秒。\n\n通过订阅，客户端将为每个相关变化从服务器获取更新，这意味着存在数据的“流”，而不是单一的响应。\n\
  \n让我们来看一个在线商店的例子。客户端希望在每次有人创建一个新订单时都能收到通知，包括发生的时间以及由谁创建。订阅操作如下：\n\n```graphql\n\
  subscription myOrders {\n    newOrderCreated {\n        id\n        createdTime\n\
  \        customer {\n            name\n        }\n    }\n}\n```\n\n首先，客户端请求一个 `newOrderCreated`\
  \ 订阅，然后在 10 秒后接收到第一个响应。\n\n```json\n{\n  \"newOrderCreated\": {\n    \"id\": \"\
  123\",\n    \"createdTime\": \"2015-07-06T04:11:11.000Z\",\n    \"customer\": {\n\
  \      \"name\": \"Andi\"\n    }\n  }\n}\n```\n\n然后在 2 秒后又有另一个响应。依此类推。\n\n```json\n\
  {\n  \"newOrderCreated\": {\n    \"id\": \"124\",\n    \"createdTime\": \"2015-07-06T04:11:13.000Z\"\
  ,\n    \"customer\": {\n      \"name\": \"Elli\"\n    }\n  }\n}\n```\n\n注意单个订阅请求如何有多个响应。这与查询和变更不同，后者一个请求对应对应一个响应。\n\
  \n在协议方面，订阅也需要不同的解决方案，因为 HTTP 设计并不是用于通过长连接将数据从服务器发送到客户端。最常用的是使用 WebSocket 用作订阅的协议。Spring\
  \ for GraphQL 开箱支持 WebSocket 协议。\n\n## Getting started\n\n让我们使用 Spring for GraphQL\
  \ 实现订阅。\n\n通过 `https://start.spring.io/` 使用 Spring Initializr 从一个新的 Spring for GraphQL\
  \ 项目开始，就像我们在引言章节的“你的第一个 Spring for GraphQL 服务”部分所的那样。选择 Spring for GraphQL 作为依赖，并选择\
  \ Spring Web 或 Spring Reactive Web 作为依赖。在接下来的示例中，我们将使用 Spring Reactive Web，它包含了\
  \ Spring WebFlux。如果你倾向于使用 WebMVC 而非 WebFlux 来使用订阅，请添加 `org.springframework.boot:spring-boot-starter-websocket`\
  \ 作为依赖，并通过移除 `Mono` 和 `Flux` 来调整示例。\n\n新模式：\n\n```graphql\ntype Query {\n    hello:\
  \ String\n}\n```\n\n让我们向模式添加一个订阅字段。\n\n```graphql\ntype Subscription {\n    hello:\
  \ String\n}\n```\n\n在控制器中，添加带注解的方法 `hello`。该方法带有 `@SubscriptionMapping` 注解，这会将该\
  \ DataFetcher 注册到订阅字段。\n\n```java\npackage service;\n\nimport org.springframework.graphql.data.method.annotation.SubscriptionMapping;\n\
  import org.springframework.stereotype.Controller;\nimport reactor.core.publisher.Flux;\n\
  import java.time.Duration;\nimport java.util.List;\n\n@Controller\nclass HelloController\
  \ {\n\n  @SubscriptionMapping\n  Flux<String> hello() {\n    Flux<Integer> interval\
  \ = Flux.fromIterable(List.of(0, 1, 2))\n      .delayElements(Duration.ofSeconds(1));\n\
  \    return interval.map(integer -> \"Hello \" + integer);\n  }\n}\n```\n\n由于订阅的结果是数据流，Reactor\
  \ 的 `Flux` 是一个完美的抽象。在我们的示例中，我们发布了三次数据：“Hello 0”、“Hello 1”到“Hello 2”，每次都有一秒的延迟。\n\
  \n为了启用订阅，我们必须添加一个新的 Spring 配置属性，设置我们想要暴露订阅的路径。\n\n```\nspring.graphql.websocket.path=/graphql\n\
  ```\n\n让我们也启用 GraphiQL 环境进行手动测试。\n\n```\nspring.graphql.graphiql.enabled=true\n\
  ```\n\n让我们测试我们的订阅。启动服务并在 `http://localhost:8080/graphiql` 打开 GraphiQL 环境。\n\n在环境中，执行一个新的订阅。点击播放按钮执行，你应该能看到像截图“Subscription\
  \ request”所示的响应。\n\n```graphql\nsubscription myFirstSubscription {\n    hello\n\
  }\n```\n\n然后我们将看到响应每秒变化一次，从“Hello 0”到“Hello 1”再到“Hello 2”，如截图“Hello 2”所示。\n\n我们有一个工作的订阅。恭喜你！\n\
  \n如果你看到的是这个“isTrusted”错误消息，这是一个通用消息。\n\n```json\n{\n  \"errors\": [\n    {\n   \
  \   \"isTrusted\": true\n    }\n  ]\n}\n```\n\n\n\n\n\n请双倍检查你是否已经在配置文件中启用了 WebSocket\
  \ 路径。\n\n```\nspring.graphql.websocket.path=/graphql\n```\n\n# 执行\n\n与查询（query）和变更（mutation）类似，我们将订阅（subscriptions）实现为\
  \ `DataFetchers`。为了交付响应流，GraphQL Java 要求返回一个 `org.reactivestreams.Publisher` 实例。[Reactive\
  \ Streams](https://www.reactive-streams.org/) 倡议定义了这个接口，为异步流处理提供了一个标准。\n\n在 Spring\
  \ 中使用 GraphQL Java 时，我们使用 Project Reactor 中的 `Flux`，它实现了 `Publisher`。我们在在本章之前的示例中用过\
  \ `Flux`。\n\nSpring for GraphQL 负责将传输层的 WebSocket 协议桥接到此 `Publisher` 上。每当它发射新结果时，我们将其发送给客户端。\n\
  \nGraphQL 规范要求订阅请求始终包含**恰一个根字段**，这与查询和变更不同。例如，下面的订阅是无效的，因为它有多个根字段。\n\n```\n[](#cb150-1)#\
  \ 无效\n[](#cb150-2)subscription tooManyRoots {\n[](#cb150-3)    newCats {\n[](#cb150-4)\
  \        name\n[](#cb150-5)    }\n[](#cb150-6)    newDogs {\n[](#cb150-7)      \
  \  name\n[](#cb150-8)    }\n[](#cb150-9)}\n```\n\n此外，我们每个请求只能订阅一个订阅。\n\n我们执行根字段下方的所有子选择，就像执行查询或变更一样。让我们回到在本章之前的订单示例中。\n\
  \n```\n[](#cb151-1)subscription myOrders {\n[](#cb151-2)    newOrderCreated {\n\
  [](#cb151-3)        id\n[](#cb151-4)        createdTime\n[](#cb151-5)        customer\
  \ {\n[](#cb151-6)            name\n[](#cb151-7)        }\n[](#cb151-8)    }\n[](#cb151-9)}\n\
  ```\n\n`newOrderCreated` 的 `DataFetcher` 返回一个 `Publisher`。从它发射的每个新事件都会启动针对子选择的普通查询执行，并将事件有效负载作为源对象。\n\
  \n让我们逐步分析订阅的执行过程：\n\n我们从客户端接收到一个新的订阅请求，通过调用 `newOrderCreated` 的 `DataFetcher` 来执行，该方法返回一个\
  \ `Publisher`。\n\n当该 `Publisher` 发射新事件时，我们以事件有效负载作为源对象执行子选择 `{ id createdTime customer\
  \ }`。这一切的发生方式与执行章节中获取取数据节描述的完全相同：我们调用 `id`、`createdTime` 和 `customer` 的三个 `DataFetchers`\
  \ 并完成返回的值。如果 `customer` 返回了非空值，我们会调用 `name` 的 `DataFetcher`。\n\n我们将结果发回给客户端。当 `Publisher`\
  \ 发射新事件时，执行将重新开始，我们向客户端发送新结果。\n\n一旦 `Publisher` 信号它已完成，整个请求就会结束。\n\n需要注意的是，`Publisher`\
  \ 发射的数据并不是发送到客户端的实际数据，而仅用作子选择的输入，子选择遵循与查询和变更相同的 GraphQL 执行规则。\n\n## 协议\n\n订阅需要一种服务器通知客户端新事件的方法。最接近订阅标准的协议是基于\
  \ WebSocket 的协议：[graphql-ws](https://github.com/enisdenjo/graphql-ws)。Spring for\
  \ GraphQL 开箱支持此协议。\n\n该协议允许使用执行任何类型的 GraphQL 请求，但在实践中，它主要用于订阅请求，因为 WebSocket 协议比\
  \ HTTP 更复杂。\n\n要激活 WebSocket 路径，请通过 `spring.graphql.websocket.path` 配置属性设置路径。\n\n\
  ```\nspring.graphql.websocket.path=/graphql-subscriptions\n```\n\nGraphiQL 游分离了\
  \ HTTP 和 WebSocket URL，因此我们在打开 GraphiQL 时可以设置两个不同的端点。\n\n```\nhttp://localhost:8080/graphiql?path=/graphql&wsPath=/graphql-subscriptions\n\
  ```\n\nSpring for GraphQL 为我们自动处理 URL。当我们打开 `http://localhost:8080/graphiql` 时，我们将根据配置自动重定向到带有正确参数的\
  \ URL。\n\n也可以通过同一个 URL 提供 WebSocket 协议和普通 HTTP 协议，正如我们在本章之前的示例中所做的那样。\n\n## 客户端支持\n\
  \n我们可以与多种不同的客户端一起使用 `graphql-ws` 协议。然而，由于某些客户端可能默认不支持 `graphql-ws`，可能需要额外的设置。[graphql-ws\
  \ GitHub 仓库](https://github.com/enisdenjo/graphql-ws#recipes) 包含了不同客户端的配方。\n\n在本章中我们讨论了\
  \ GraphQL 订阅。在后面的测试章节中，我们将讨论如何测试订阅。\n\n# 请求与响应\n\n在本章中，我们将仔细研究 GraphQL 的请求和响应，包括\
  \ HTTP 协议。\n\n## 传输协议与序列化\n\n你可能会感到惊讶，GraphQL 规范并没有规定客户端与服务器通信的任何传输协议。虽然将传输问题从规范中排除是一个深意决定，但在实践中，HTTP\
  \ 已经成为最常用的协议。社区对常用的协议已有共识。\n\n## 请求\n\nGraphQL 请求最重要的元素是查询、操作名称和变量。通过 HTTP 的每个 GraphQL\
  \ 请求都是 POST，编码为 `application/json`，正体如下：\n\n```\n[](#cb154-1){\n[](#cb154-2)  \"\
  query\": \"<document>\",\n[](#cb154-3)  \"variables\": {\n[](#cb154-4)    <variables>\n\
  [](#cb154-5)  },\n[](#cb154-6)  \"operationName\": \"<operationName>\"\n[](#cb154-7)}\n\
  ```\n\n目标是执行恰一个 GraphQL 操作。HTTP 端点总是相同的，通常以 `/graphql` 结尾。\n\n在请求体中，第一个键 `query`\
  \ 实际上是一个 `document`，而不是查询。`document` 可以包含一个多个操作，并在请求中表示为字符串。该键不是可选的。\n\n下一个键 `variables`\
  \ 是所有操作变量的 JSON Map。该键是可选的，因为操作变量也是可选的。\n\n第三个键 `operationName` 指定要执行的操作。它是可选的，只有当文档中存在多个操作时才是必须的。\n\
  \n底层传输协议由 Spring for GraphQL 处理。Spring for GraphQL 中的 HTTP 请求由 `WebGraphQlRequest`\
  \ 表示，包含标头等 HTTP 信息。\n\n在 GraphQL Java 级别，GraphQL 请求由 `graphql.ExecutionInput` 实例表示。以下是重要的字段：\n\
  \n```\n[](#cb155-1)public class ExecutionInput {\n[](#cb155-2)  private final String\
  \ query;\n[](#cb155-3)  private final String operationName;\n[](#cb155-4)  private\
  \ final RawVariables rawVariables;\n[](#cb155-5)  // 以及更多字段\n[](#cb155-6)}\n```\n\
  \n`query` 代表 JSON 对象中的 “query” 键，`operationName` 代表 “operationName” 键。`rawVariables`\
  \ 代表 JSON 对象中的变量 Map。“raw”一词反映了变量尚未进行转换。我们将在执行章节中讨论变量转换。\n\n\n\n\n\n请注意，传输相关的问题是在\
  \ Spring for GraphQL 级别进行管理的。GraphQL Java 的 `ExecutionInput` 没有指定任何传输协议。该类中最重要的字段对应于我们之前看到的请求体中的\
  \ JSON 对象。\n\n## 响应\n\n通过 HTTP，GraphQL 请求的响应是一个 JSON 对象：\n\n```json\n{\n  \"data\"\
  : <data>,\n  \"errors\": <GraphQL 错误列表>,\n  \"extensions\": <扩展 映射表>\n}\n```\n\n\
  如果不存在 `data` 键，则必须存在 `errors` 键来解释为什么没有返回数据。如果 `data` 键存在，则 `errors` 键也可以存在，特别是在返回部分结果的情况下。请注意\
  \ `null` 是数据的一个有效值。\n\n`extensions` 键是可选的。其值是一个映射（map），且对其内容没有限制。\n\n在 GraphQL Java\
  \ 的底层，响应被表示为 `graphql.ExecutionResult`，它镜像了 JSON 响应。\n\n```java\npublic interface\
  \ ExecutionResult {\n  <T> T getData();\n  List<GraphQLError> getErrors();\n  Map<Object,\
  \ Object> getExtensions();\n  // 以及更多方法\n}\n```\n\n我们将在下一章中详细讨论 GraphQL 错误。\n\n\
  ## HTTP 状态码\n\n响应的 HTTP 状态码取决于是否调用了 GraphQL Java 引擎。\n\n如果请求在调用 GraphQL Java 引擎之前被拒绝，我们将使用\
  \ HTTP 状态码来指示问题。例如，身份验证失败时返回 `401 Unauthorized` 码，或者如果请求本身不是 GraphQL 请求（例如正文缺少“query”键），则返回\
  \ `400 Bad Request`。\n\n如果请求在调用 GraphQL Java 引擎后被拒绝，则始终返回 `200 OK` 状态码。任何错误都会以 JSON\
  \ 响应体中 GraphQL 错误的形式表示。\n\n为什么在响应存在错误时仍返回 `200 OK` 代码？这种模型之所以是为了与 REST API 相比实现更灵活的请求和部分响应。例如，部分响应仍然具有价值，因此它带有\
  \ `200 OK` 状态码返回，并带有响应中的错误解释为什么无法检索部分数据。\n\n这种模型的挑战在于，现在分析响应需要两个步骤：\n\n1. 检查 HTTP\
  \ 状态码\n2. 如果状态码是 `200 OK`，则检查响应中的任何 GraphQL 错误\n\n对于具有 REST API 经验的开发者来说，这是一个陷阱。要确定请求是否成功，请记住同时检查\
  \ HTTP 状态码和响应的 `errors` 键。\n\n## 请求头\n\n我们强烈建议将理解请求所需的信息作为 GraphQL 操作的一部分，而不是通过请求头传递。\n\
  \n这一通用规则源于在 GraphQL schema 中完全表达 API 的意图。让我们通过一个反面例子来演示，即在发送对 `ordersByCustomerId`\
  \ 字段的查询时，发送了一个 HTTP 请求头“Customer-Id”。在 schema 中，该字段定义为：\n\n```graphql\ntype Query\
  \ {\n    ordersByCustomerId: [Order]\n}\n```\n\n想象你是第一次阅读该 schema，想要理解 API。没有信息表明“Customer-Id”标头对于\
  \ `ordersByCustomerId` 字段是关重要的。schema 变成了对 API 的不描述。\n\n我们必须拥有客户 ID 才能使请求具有意义。在查询请求中显式地要求客户\
  \ ID 作为参数要好得多。\n\n```graphql\ntype Query {\n    ordersByCustomerId(id: ID!): [Order]\n\
  }\n```\n\n阅读此改进后 schema 的人将轻松理解必须提供 `id` 参数来满足请求。由于 `id` 参数是非空的，GraphQL 验证和工具也将要求提供该参数以继续请求。\n\
  \n我们建议在 GraphQL 操作中发送理解请求所需的信息。然而，这并不意味着完全不能使用请求头。您应该继续使用请求头发送元数据或辅助数据，这些数据对于理解\
  \ GraphQL 请求并非必需。\n\n一个显著的例子是发送身份验证信息。虽然执行请求需要身份验证，但我们可以在看不到凭据的情况下理解请求的意图。\n\n另一个例子是通过请求头发送测试标志（beta\
  \ flags）。如果客户端想要某些尚未稳定的字段，我们可以要求某些特殊头，例如“beta-features”。无论是否有这个测试标志信息，请求本身都是有意义的。\n\
  \n第三个例子是请求 ID 等追踪信息。请求 ID 等元数据对于日志很有用，但对于理解 GraphQL 请求并不是必需的。\n\n## 拦截请求\n\nSpring\
  \ for GraphQL  `WebGraphQlInterceptor` 来拦截请求。\n\nSpring for GraphQL 自动处理 HTTP 协议，包括实际执行请求的\
  \ GraphQL Java 调用。默认 URL 为 `/graphql`，我们可以通过配置属性 `spring.graphql.path` 对其进行自定义。\n\
  \n`WebGraphQlRequest` 和 `WebGraphQlResponse` 代表通过 HTTP 或 WebSocket 的 GraphQL 请求和响应。它们包含了\
  \ GraphQL 特有的信息以及 HTTP 细节。\n\n我们可以使用 `WebGraphQlInterceptor` 访问并更改请求。例如，我们可以拦截请求并在响应头中添加一个“special-header”。\n\
  \n```java\npackage myservice.service;\n\nimport org.springframework.graphql.server.WebGraphQlInterceptor;\n\
  import org.springframework.graphql.server.WebGraphQlRequest;\nimport org.springframework.graphql.server.WebGraphQlResponse;\n\
  import org.springframework.stereotype.Component;\nimport reactor.core.publisher.Mono;\n\
  \n@Component\nclass MyInterceptor implements WebGraphQlInterceptor {\n\n  @Override\n\
  \  public Mono<WebGraphQlResponse> intercept(\n    WebGraphQlRequest request, Chain\
  \ chain\n  ) {\n    return chain.next(request)\n      .map(response -> {\n     \
  \   response.getResponseHeaders().add(\"special-header\", \"true\");\n        return\
  \ response;\n      });\n  }\n}\n```\n\n另一个用例是根据请求头更改执行。在这个例子中，客户端需要发送特殊的测试标志“beta-features”来请求尚未稳定的测试字段。在拦截器中，如果存在此“beta-features”头，我们将其添加到\
  \ `GraphQLContext` 中，以便稍后执行时访问此信息。我们将在 DataFetchers 深度章节中更详细介绍 GraphQLContext。\n\
  \n\n\n\n\n```java\npackage myservice.service;\n\nimport org.springframework.graphql.server.WebGraphQlInterceptor;\n\
  import org.springframework.graphql.server.WebGraphQlRequest;\nimport org.springframework.graphql.server.WebGraphQlResponse;\n\
  import org.springframework.stereotype.Component;\nimport reactor.core.publisher.Mono;\n\
  \n@Component\nclass BetaFeaturesInterceptor implements WebGraphQlInterceptor {\n\
  \n  @Override\n  public Mono<WebGraphQlResponse> intercept(\n    WebGraphQlRequest\
  \ request, Chain chain\n  ) {\n    boolean betaFeatures = request\n      .getHeaders()\n\
  \      .containsKey(\"beta-features\");\n\n    request.configureExecutionInput((executionInput,\
  \ builder) -> {\n      executionInput\n        .getGraphQLContext()\n        .put(\"\
  beta-features\", betaFeatures);\n      return executionInput;\n    });\n\n    return\
  \ chain.next(request);\n  } \n}\n```\n\n上面的示例修改了 GraphQL Java 请求对象 `ExecutionInput`。我们也可以访问并修改整个\
  \ GraphQL Java 响应 `ExecutionResult`。在 `intercept` 方法中，返回你自定义的 `WebGraphQLResponse`。\n\
  \n例如，如果你已经为传入的请求附加了请求 ID，那么将请求 ID 添加到 GraphQL 响应的 `extensions` 部分将非常有用。这对于调试问题非常有帮助，因为使用你\
  \ API 的人员可以提供请求 ID，以便你快速找到相关的日志。\n\n以下是如何向响应的 `extensions` 中添加额外的键的方法：\n\n```java\n\
  package myservice.service;\n\nimport graphql.ExecutionResult;\nimport org.springframework.graphql.server.WebGraphQlInterceptor;\n\
  import org.springframework.graphql.server.WebGraphQlRequest;\nimport org.springframework.graphql.server.WebGraphQlResponse;\n\
  import org.springframework.stereotype.Component;\nimport reactor.core.publisher.Mono;\n\
  \nimport java.util.HashMap;\nimport java.util.Map;\n\n@Component\nclass ChangeResponse\
  \ implements WebGraphQlInterceptor {\n\n  @Override\n  public Mono<WebGraphQlResponse>\
  \ intercept(\n    WebGraphQlRequest request,\n    Chain chain\n  ) {\n    return\
  \ chain.next(request)\n      .map(response -> {\n        // response 是一个包含 ExecutionResult\
  \ \n        // 的 WebGraphQLResponse\n        ExecutionResult executionResult = response.getExecutionResult();\n\
  \        Map<Object, Object> newExtensions = new HashMap<>();\n        if (executionResult.getExtensions()\
  \ != null) {\n          newExtensions.putAll(executionResult.getExtensions());\n\
  \        }\n        // 使用你的请求 ID 机制替换值\n        newExtensions.put(\"request_id\"\
  , \"YOUR_REQUEST_ID_HERE\");\n\n        return response.transform(builder ->\n \
  \         builder.extensions(newExtensions).build()\n        );\n      });\n  }\n\
  }\n```\n\n在本章中，我们更详细地讨论了 GraphQL 的请求和响应，并演示了如何在 Spring for GraphQL 中访问这些对象。\n\n\
  在下一章中，我们将基于这些概念讨论 GraphQL 错误。\n\n# GraphQL 错误\n\n当出现问题时会发生什么？我们如何从我们的 GraphQL 服务传递错误？\n\
  \n在上一章中，我们开始讨论 GraphQL 响应，它们是包含三个关键条的 JSON 对象：`data`、`errors` 和 `extensions`。\n\n\
  ```json\n{\n  \"data\": <data>,\n  \"errors\": <list of GraphQL errors>,\n  \"extensions\"\
  : <map of extensions>\n}\n```\n\n在本章中，我们将详细讨论 GraphQL 错误。我们将讨论错误如何呈现给客户端，以及如何在我们的\
  \ Spring for GraphQL 服务中自定义 GraphQL 错误。\n\nGraphQL 错误大致分为两类：`request`（请求）错误和 `field`（字段）错误。我们将介绍错误是如何呈现。\n\
  \n## 请求错误\n\n请求错误在执行开始之前产生。换句话说，响应不包含 `data` 键。例如，如缺少右大括号 `}` 的语法错误。某些请求错误包括：\n\n\
  - 解析错误，包括 GraphQL 语法\n- 文档中的验证错误\n- 变量的输入值\n\n例如，此请求是无效的：\n\n```graphql\nquery invalid\
  \ {\n    foo\n}\n```\n\n响应包含 `errors` 键，在这种情况下，消息指示了哪里出了问题：\n\n```json\n{\n  \"\
  errors\": [\n    {\n      \"message\": \"Invalid Syntax : offending token '{' at\
  \ line 2 column 5\",\n      \"locations\": [\n        {\n          \"line\": 2,\n\
  \          \"column\": 5\n        }\n      ],\n      \"extensions\": {\n       \
  \ \"classification\": \"InvalidSyntax\"\n      }\n    }\n  ]\n}\n```\n\n## 字段错误\n\
  \n字段错误在执行期间产生。如果错误可以链接到 GraphQL 文档中的 `location`（位置），则应该呈现出来以便更容易找到错误。位置信息表示错误位于\
  \ GraphQL 文档的第 2 行第 5 列。\n\nGraphQL 规范还允许一个可选的 `extensions` 键，它是额外数据的映射。对该映射的内容没有限制。它对于错误日志记录中的错误进行分类很有用，因此\
  \ GraphQL Java 提供了许多常见的错误分类。在此基础上，Spring for GraphQL 增加了一些额外的错误分类。你也可以创建自定义的错误分类。我们将在本章稍些之后详细解释分类。在例例中，`InvalidSyntax`\
  \ 分类是由 GraphQL Java 添加的。\n\n让我们来看另一个请求错误的示例，当我们尝试请求架构中 `Query` 类型中不存在的字段 `doesNotExist`\
  \ 时：\n\n```graphql\nquery missing {\n    doesNotExist\n}\n```\n\n\n\n\n\n```json\n\
  {\n  \"errors\": [\n    {\n      \"message\": \"Validation error (FieldUndefined@[doesNotExist])\
  \ : Field 'doesNotExist' in type 'Query' is undefined\",\n      \"locations\": [\n\
  \        {\n          \"line\": 2,\n          \"column\": 5\n        }\n      ],\n\
  \      \"extensions\": {\n        \"classification\": \"ValidationError\"\n    \
  \  }\n    }\n  ]\n}\n```\n\n`message` 传达了 `Query` 类型中不存在 `doesNotExist` 字段。由于此错误可以与\
  \ GraphQL 文档中的某个 `location` 关联，因此提供了该信息。\n\n在 `extensions` 映射中，GraphQL Java 插入了分类\
  \ `ValidationError`。在 GraphQL 请求中请求 schema 中不存在的字段是无效的。\n\n注意，GraphQL 响应中没有 `data`\
  \ 键，因为没有调用任何 `DataFetchers`。当检测到验证错误时，执行已终止。\n\n## 字段错误\n\n字段错误在执行某个字段时抛出，导致了部分响应。换句话说，是在\
  \ `DataFetcher` 执行期间抛出的错误。例如，带有 `friends` 的基础 `Pet` schema：\n\n```graphql\ntype\
  \ Query {\n    favoritePet: Pet\n}\n\ntype Pet {\n    id: ID\n    name: String\n\
  \    friends: [Pet]\n}\n```\n\n我们使用此查询进行请求：\n\n```graphql\nquery isAGoodPup {\n\
  \    favoritePet {\n        name\n        friends {\n            name\n        }\n\
  \    }\n}\n```\n\n让我们编写 `friends` `DataFetcher` 使故意失败，以模拟错误。\n\n```java\npackage\
  \ myservice.service;\n\nimport java.util.List;\n\nrecord Pet(String id, String name,\
  \ List<String> friendIds) {\n  static List<Pet> pets = List.of(\n    new Pet(\"\
  1\", \"Luna\", List.of(\"2\")),\n    new Pet(\"2\", \"Skipper\", List.of(\"1\"))\n\
  \  );\n}\n```\n\n```java\n@Controller\nclass PetsController {\n  @QueryMapping\n\
  \  Pet favoritePet() {\n    // 返回用户喜爱的宠物的逻辑。\n    // 使用狗狗 Luna 进行模拟。\n    return\
  \ Pet.pets.get(0);\n  }\n\n  @SchemaMapping\n  List<Pet> friends(Pet pet) {\n  \
  \  throw new RuntimeException(\"Something went wrong!\");\n  }\n}\n```\n\n加载 `pet`\
  \ 的 `friends` 的 `DataFetcher` 抛出了异常。这是整个查询的 GraphQL 响应，JSON 格式：\n\n```json\n{\n\
  \  \"errors\": [\n    {\n      \"message\": \"INTERNAL_ERROR for f8f26fdc-4\",\n\
  \      \"locations\": [\n        {\n          \"line\": 4,\n          \"column\"\
  : 9\n        }\n      ],\n      \"path\": [\n        \"favoritePet\",\n        \"\
  friends\"\n      ],\n      \"extensions\": {\n        \"classification\": \"INTERNAL_ERROR\"\
  \n      }\n    }\n  ],\n  \"data\": {\n    \"favoritePet\": {\n      \"name\": \"\
  Luna\",\n      \"friends\": null\n    }\n  }\n}\n```\n\n我们的示例说明字段错误不会导致整个请求失败，`data`\
  \ 键是存在的。注意，`errors` 存在当且仅当出现一个或多个字段错误时。如果没有错误，`errors` 条目将不存在。如果响应中的 `data` 条目不存在，则\
  \ `errors` 条目必须存在。例如，当存在 `errors` 时，`data` 为 `null`。`data` 键在存在 `errors` 时为 `null`。\n\
  \n\n\n\n此外，Spring for GraphQL 增加了几个实用的错误分类，它们也实现了 `graphql.ErrorClassification`\
  \ 接口。\n\n- `BAD_REQUEST`\n- `UNAUTHORIZED`\n- `FORBIDDEN`\n- `NOT_FOUND`\n- `INTERNAL_ERROR`\n\
  \n如果异常未被解析，默认情况下它将被归类为 `INTERNAL_ERROR`，并带有一个包含类别名称和 `executionId` 的通用消息。你可以通过 `DataFetcherExceptionResolverAdapter`\
  \ 对此进行自定义，我们将在本章稍后部分讨论。\n\nGraphQL Java 提供的错误分类也用于 Spring for GraphQL。例如，一个带有无效\
  \ GraphQL 语法的请求将包含一个分类为 `InvalidSyntax` 的响应错误。同样，`ValidationError`、`OperationNotSupported`\
  \ 和 `NullValueInNonNullableField` 分类也被 Spring for GraphQL 使用。\n\n请注意，如果调用了 GraphQL\
  \ 引擎，始终返回 HTTP 响应码 `200` (OK)，即使响应中存在错误。错误分类包含在 GraphQL 响应的 `errors` 键中。例如，如果数据库可用，将引发一个字段错误，并在响应中出现\
  \ GraphQL 错误。对于出现此类数据库问题的请求，其 HTTP 响应码仍为 `200`。如果你有 REST 等其他 API 的经验，这可能会让你感到惊讶。请请上一节关于\
  \ HTTP 状态码 的讨论。\n\n### 自定义错误分类\n\n你也可以通过实现 GraphQL Java 的 `ErrorClassification`\
  \ 接口来创建自定义错误分类。错误分类会被添加到 GraphQL 错误生成器中，正如我们在本章后面看到的。\n\n例如，你可以对不同类型的授权检查失败进行分类，而不是使用全能的“UNAUTHORIZED”错误分类。你可以为每种类别的授权失败创建单独错误分类，并使用这些类别在服务器端通过指标来监控授权失败。\n\
  \n## 如何返回错误\n\n我们已经看到错误在 GraphQL 响应中是如何呈现的。现在让我们讨论如何在我们的 Spring for GraphQL 服务内部返回错误。我们将讨论两种返回字段错误的基本方法：在调用\
  \ `DataFetcher` 期间抛出异常，或者通过 `DataFetcherResult` 返回错误。\n\n### 在 DataFetcher 调用期间抛出异常\n\
  \n返回错误的一种方法是在 `DataFetcher` 调用期间抛出异常。当 `DataFetcher` 抛出异常时，GraphQL Java 会将其转换为 GraphQL\
  \ 错误，该错误被添加到整个 GraphQL 响应中，并且字段值被设置为 `null`。在我们之前的示例中，当 `friends` `DataFetcher`\
  \ 抛出一个 `RuntimeException`，数据中的 `friends` 字段被设置为 `null`。在更符合实际的服务中，`friends` 数据库可能不可，导致抛出异常。\n\
  \n当在 `DataFetcher` 调用期间抛出异常时，GraphQL Java 的 `DataFetcherExceptionHandler` 会被调用。GraphQL\
  \ Java 应用可以注册 `DataFetcherExceptionHandler`，而 Spring for GraphQL 提供了一个内置的处理器 `ExceptionResolversExceptionHandler`。该处理器允许注册一个异常解析器链。该配置是供\
  \ Spring Boot 启动器使用的。正如我们在本章前面的错误示例中所所示，配置异常处理不需要额外的代码。\n\n然而，如果你想自定义异常解析，可以注册 `DataFetcherExceptionResolver`。Spring\
  \ for GraphQL 使得注册自定义异常解析器变得非常简单，我们将在下一节关于自定义异常解析的章节中演示。\n\n即使你没有显式地将 Spring WebFlux\
  \ 作为你 GraphQL 服务的依赖，Spring for GraphQL 内部也使用了 `Mono` 等 Reactor 类型。Spring for GraphQL\
  \ 使用 `reactor-core` 作为依赖。请注意，虽然 Spring for GraphQL 内部使用了 Reactor，但你不需要在你的服务代码中使用\
  \ Reactor 类型。如果你对 `Mono` 和 `Flux` 等词不熟悉，可以跳过对 Spring for GraphQL 内部 Reactor 类型的讨论。\n\
  \n每个注册的异常解析器将一个接一个地调用，直到其中一个返回 GraphQL 错误列表（列表可以为空）。如果异常解析器返回的 `Mono` 空完成且没有发射列表，则异常将保持未解析状态，我们将调用下一个异常解析器。\n\
  \n如果没有异常解析器处理该异常，Spring for GraphQL 将创建一个带有 `INTERNAL_ERROR` 分类和通用错误信息的默认错误。Spring\
  \ for GraphQL 故意生成一个不透明的消息以避免泄露实现细节。通常，我们建议你只向客户端显示他们理解响应所需的信息。避免暴露实现细节。例如，避免在错误消息中转储堆栈跟踪。你应该单独监控堆栈跟踪等详细异常信息。\n\
  \n### 自定义异常解析\n\n如果你想自定义异常解析，Spring for GraphQL 提供了一个 `DataFetcherExceptionResolverAdapter`\
  \ 抽象类，它已经为你实现了大部分契约。\n\n例如，让我们实现一个覆盖实际异常消息的异常解析器。\n\n```java\npackage myservice.service;\n\
  \nimport graphql.GraphQLError;\nimport graphql.GraphqlErrorBuilder;\nimport graphql.schema.DataFetchingEnvironment;\n\
  import org.springframework.graphql.execution.DataFetcherExceptionResolverAdapter;\n\
  import org.springframework.graphql.execution.ErrorType;\nimport org.springframework.stereotype.Component;\n\
  \n@Component\nclass CustomErrorMessageResolver extends DataFetcherExceptionResolverAdapter\
  \ {\n    @Override\n    protected GraphQLError resolveToSingleError(Throwable ex,\
  \ DataFetchingEnvironment env) {\n      return GraphqlErrorBuilder.newError(env)\n\
  \            .errorType(ErrorType.INTERNAL_ERROR) // 错误分类\n            .message(\"\
  My custom message\") // 覆盖消息\n            .build();\n    }\n}\n```\n\nSpring Boot\
  \ 启动器在实例化 `GraphQlSource` 的过程中会自动检测 `DataFetcherExceptionResolver` Bean，该步骤同时也加载架构文件等内容。抽象类\
  \ `DataFetcherExceptionResolverAdapter` 实现了 `DataFetcherExceptionResolver`。在示例中，`CustomErrorMessageResolver`\
  \ 继承自 `DataFetcherExceptionResolverAdapter` 并使用 `@Component` 注解表示它应被 Spring Boot\
  \ 启动器扫描。\n\n在扩展 `DataFetcherExceptionResolverAdapter` 时，你可以选择覆盖 `resolveToSingleError`\
  \ 或 `resolveToMultipleErrors` 方法。正如名称，`resolveToSingleError` 将异常解析为单个 GraphQL 错误，而\
  \ `resolveToMultipleErrors` 将异常解析为 GraphQL 错误列表。\n\n请注意，`DataFetcherExceptionResolverAdapter`\
  \ 不需要你使用 Reactor 类型，因为需要 Reactor 类型的契约部分已经为你实现完毕。\n\n创建 `graphql.GraphQLError` 新实例的推荐方法是通过\
  \ `graphql.GraphqlErrorBuilder`。请注意名称中略有大小写差异。此构建器比直接实现 `graphql.GraphQLError` 接口要方便得多。如示例所示，使用接收\
  \ `DataFetchingEnvironment` 的工厂方法。\n\n\n\n如果你在使用没有配合 Spring for GraphQL 的 GraphQL\
  \ Java，请注意 GraphQL Java 中的处理器是不同的。GraphQL Java 使用 `SimpleDataFetcherExceptionHandler`\
  \ 实现。该处理器会创建一个分类为 `ErrorType.DataFetchingException` 的 `ExceptionWhileDataFetching`\
  \ 错误。\n\n## 使用 `DataFetcherResult` 返回数据和错误\n\n同时为字段返回数据和错误的唯一方法是使用 `DataFetcherResult`。这与抛出异常形成对比，抛出异常始终将字段值设为\
  \ `null`。\n\n例如，我们有一组宠物，但在执行期间并非所有宠物都可用。让我们来看一个简单的 Pet 模式（Schema）。\n\n```\ntype\
  \ Query {\n    myPets: [Pet]\n}\n\ntype Pet {\n    id: ID\n    name: String\n}\n\
  ```\n\n```java\npackage myservice.service;\n\nimport java.util.List;\n\nrecord Pet(String\
  \ id, String name) {\n  static List<Pet> pets = List.of(\n    new Pet(\"1\", \"\
  Luna\"),\n    new Pet(\"2\", \"Skipper\")\n  );\n}\n```\n\n```java\npackage myservice.service;\n\
  \nimport graphql.ErrorType;\nimport graphql.GraphQLError;\nimport graphql.GraphqlErrorBuilder;\n\
  import graphql.execution.DataFetcherResult;\nimport graphql.schema.DataFetchingEnvironment;\n\
  import org.springframework.graphql.data.method.annotation.QueryMapping;\nimport\
  \ org.springframework.stereotype.Controller;\n\nimport java.util.List;\n\n@Controller\n\
  class PetsController {\n\n  @QueryMapping\n  DataFetcherResult<List<Pet>> myPets(\n\
  \    DataFetchingEnvironment env) {\n    // 在此处放置部分数据列表\n    // 内存 Pet 示例\n    List<Pet>\
  \ result = List.of(Pet.pets.get(1));\n\n    GraphQLError error = GraphqlErrorBuilder.newError(env)\n\
  \      .errorType(ErrorType.DataFetchingException)\n      .message(\"Data could\
  \ only be partially loaded\")\n      .build();\n    return DataFetcherResult.<List<Pet>>newResult()\n\
  \      .data(result)\n      .error(error)\n      .build();\n  }\n}\n```\n\n在本章中，我们深入讨论了\
  \ GraphQL 错误。我们讨论了请求错误和字段错误，以及它们如何在 GraphQL 响应中呈现。然后，我们演示了如何在 Spring for GraphQL\
  \ 服务中抛出错误，以及如何自定义异常处理。\n\n# 模式设计（Schema design）\n\n模式设计是实现 GraphQL 服务的关键部分。在本章中，我们将讨论从运行\
  \ GraphQL 服务经验中总结的关键原则和最佳实践。\n\n## 演进优于版本化\n\n我们应该将模式设计作为一项独立的活动来审慎设计。根据经验，我们发现推断模式或从其他源生成模式并非最佳方法。生成的模式质量总是较低。\n\
  \nGraphQL 与我们可能用于获取查询数据的数据库模式或 REST API 不同。\n\n在 GraphQL API 中，只有一个 URL 和一个模式，该模式会随着增量变化而增长。例如，我们可能只从一个简单的\
  \ `User` 开始。\n\n```\ntype Query {\n    user(id: ID!): User\n}\ntype User {\n   \
  \ id: ID\n    name: String\n}\n```\n\n然后我们可能会更改模式以包含用户的地址信息，如下：\n\n```\ntype Query\
  \ {\n    user(id: ID!): User\n}\ntype User {\n    id: ID\n    name: String\n   \
  \ address: Address\n}\ntype Address {\n    street: String\n    city: String\n  \
  \  country: String\n}\n```\n\n这种模式更改使我们的 API 更加丰富，客户端可以通过在查询选择字段中包含地址来决定是否使用新功能。当更改属于破坏性变更（breaking\
  \ change）时，演进模式会更具挑战性。例如，如果我们认为当前的 `name: String` 不够用，我们就会引入一个更好的 `UserName` 对象，并包含\
  \ `legalName` 和 `preferredName` 等字段。\n\n```\ntype Query {\n    user(id: ID!): User\n\
  }\ntype User {\n    id: ID\n    name: UserName\n}\ntype UserName {\n    legalName:\
  \ String\n    preferredName: String\n}\n```\n\n然而，这种模式更改会破坏所有正在使用 `name` 的现有客户端，如下查询所示：\n\
  \n```query\nquery broken {\n    user(id: \"123\") {\n        name\n    }\n}\n```\n\
  \n该查询突然变得无效并始终导致错误，因为 `name` 不再是一个 `User` 字符串字段，而现在是一个需要子选择的 `UserName` 对象。\n\n\
  以下是管理破坏性变更的方法：\n\n1. 引入替代方案（如果适用）\n2. 弃用旧字段\n3. 监控使用情况和/或等待一段时间\n4. 移除旧字段\n\n让我们在\
  \ `User` 示例中演示如何管理这种破坏性变更。首先，我们为 `userName` 添加一个新字段，同时保留现有的 `User` 字段。\n\n```\n\
  type Query {\n    user(id: ID!): User\n}\ntype User {\n    id: ID\n    name: String\n\
  \    userName: UserName\n}\ntype UserName {\n    legalName: String\n    preferredName:\
  \ String\n}\n```\n\n然后我们使用内置的 `@deprecated` 指令弃用旧字段。注意，指令出现在其修饰的声明之后（例如 `name`）。\n\
  \n```\ntype Query {\n    user(id: ID!): User\n}\ntype User {\n    id: ID\n    name:\
  \ String\n    @deprecated(reason: \"Use richer alternative `userName`.\")\n    userName:\
  \ UserName\n}\ntype UserName {\n    legalName: String\n    preferredName: String\n\
  }\n```\n\n\n\n下一步具有非常具体的针对性。根据客户端 API 的类型以及任何服务保证，我们可能会监控其使用情况，并直到无人使用该字段。或者我们可能简单地给所有客户端留一段迁移时间（例如\
  \ 6 个月），或者将两者结合。\n\n在最后一步中，删除该字段。\n\n```graphql\ntype Query {\n    user(id: ID!):\
  \ User\n}\n\ntype User {\n    id: ID!\n    userName: UserName\n}\n\ntype UserName\
  \ {\n    legalName: String\n    preferredName: String\n}\n```\n\n现在，我们已经完成了从 `name:\
  \ String` 到 `userName: UserName` 的逐步过渡。\n\n当然，你应该根据自己的情况调整处理方法。\n\n例如，在以下情况下，你可能选择立即进行破坏性变更（breaking\
  \ change）：\n\n- 你检测到没有人在使用该特定字段\n- 你确定客户端可以处理该破坏性变更\n- 该更改用于公司内部测试 API，该 API 未在生产环境中使用\n\
  \n你可能还会选择在可预未来保留已弃用的（deprecated）字段，而不是删除它。\n\n对于这类破坏性变更，我们的其他通用建议是为演进而设计 Schema，并尽可能避免它们。本章涵盖了\
  \ Schema 演进的具体建议。\n\n每个生产级 GraphQL API 都不可避免地面临破坏性变更。总目标是减少破坏性变更的数量，而不是完全避免它们。\n\
  \n## 连接（Connected）\n\nGraphQL API 应该类似于连接的或图状结构，以获得最大的客户端灵活性。客户端应该能够在单次请求中从一条数据“遍历”到另一个相关数据。\n\
  \n例如，这个 Schema 并不是连接的。\n\n```graphql\ntype Query {\n    issue: Issue\n    userById(id:\
  \ ID!): User\n}\n\ntype Issue {\n    description: String\n    ownerId: ID\n}\n\n\
  type User {\n    id: ID\n    name: String\n}\n```\n\n此 Schema 需要两次查询来获取 issue 所有者的姓名。\n\
  \n```graphql\n# 第一\nquery myIssue {\n    issue {\n        ownerId\n    }\n} # 返回\
  \ \"123\"\n\n# 第二\nquery myUser {\n    userById(id: \"123\") {\n        name\n \
  \   }\n}\n```\n\n这是一个更好的、连接性更 Schema。\n\n```graphql\ntype Query {\n    issue: Issue\n\
  }\n\ntype Issue {\n    description: String\n    owner: User\n}\n\ntype User {\n\
  \    id: ID\n    name: String\n}\n```\n\n现在，客户端可以在一次查询中直接为 issue 查询完整的 `User` 对象。\n\
  \n```graphql\nquery connected {\n    issue {\n        owner {\n            name\n\
  \        }\n    }\n}\n```\n\n在 Schema 中寻找任何 `<name>Id: String/ID` 或其他唯一标识字段是一个好习惯，然后验证保留它们是否有充分理由，或者你是否可以直接将它们连接到某些其他数据。\n\
  \n当然，连接的程度是有限制的，取决于你所访问的数据源。\n\n## Schema 元素是廉价的\n\n不要为了尝试使其可复用而将类型和字段变得过于通用。例如，你可能会考虑复用像这样的搜索过滤器。\n\
  \n```graphql\ntype Query {\n    searchPets(filter: SearchFilter): [Pet]\n    searchHumans(filter:\
  \ SearchFilter): [Human]\n}\n\ninput SearchFilter {\n    name: String\n    ageMin:\
  \ Int\n    ageMax: Int\n}\n```\n\n复用输入对象不是一个好主意，因为将两个字段耦合在了一起。如果我们想为宠物添加 `breed`\
  \ 字段会怎样？现在我们要么有一个包含 `breed` 的人类过滤器，要么需要废弃字段并引入新字段。输出类型也是同样的原理。这个示例对于变更（mutations）来说似乎很有吸引力。\n\
  \n```graphql\ntype Mutation {\n    deleteUser(input: DeleteUserInput): ChangePayload\n\
  \    updateUser(input: UpdateUserInput): ChangePayload\n}\n\ntype ChangePayload\
  \ {\n    user: User\n}\n```\n\n这个示例与复用的输入相同的问题。一旦我们更改其中一个变更的返回类型，就会出现问题。我们可能陷入的另一个陷阱是试图将用例合并到一个字段中。字段是廉价的，就像任何其他元素一样。字段增加不会让我们的服务变慢或产生任何负面影响。我们应该通过命名使单一用途明确。\n\
  \n比较这两个示例：\n\n```graphql\ntype Query {\n    pet(id: ID, name: String): Pet\n}\n\
  ```\n\n对比\n\n```graphql\ntype Query {\n    petById(id: ID!): Pet\n    petByName(name:\
  \ String!): Pet\n}\n```\n\n第二个版本在每个方面都更好。我们有了更好的名称，且参数被标记为可空。我们也可以更容易地演进 Schema。\n\
  \n## 可空字段（Nullable fields）\n\nSchema 设计中最常被误解的话题之一是字段的可空性。在开始学习 GraphQL 时，字段默认是可空的，这让很多人感到困惑，导致学者将所有字段都设为不可空。\n\
  \n在 GraphQL 中，几乎所有字段都应该是可空的，以便结果返回更多数据。让我们通过示例详细查看 GraphQL 如何处理 `null` 数据。考虑这种情况：一个字段被标记为不可空，但在执行期间数据为\
  \ `null`。Schema 保证了字段永远不会为空，因此 GraphQL 无法返回 `null`。相反，在可能的情况下会将父节点设置为 `null`。如果原始字段的父节点也是不可空的，那么在可能的情况下将父节点的父节点设置为\
  \ `null`，以此此类推。错误通过父字段的层级结构传递，直到某个字段可以被设置为 `null`。\n\n让我们通过一个具体的示例逐步演示 `null` 结果的处理：\n\
  \n```graphql\ntype Query {\n    a: A\n}\n\ntype A {\n    b: B\n}\n\ntype B {\n \
  \   c: C!\n}\n\ntype C {\n    d: String!\n}\n```\n\n如果字段 `d` 在执行此查询时为 `null`，\n\n\
  ```graphql\nquery myQuery {\n    a {\n        b {\n            c {\n           \
  \     d\n            }\n        }\n    }\n}\n```\n\n我们将得到如下结果：\n\n```json\n{\n \
  \ \"data\": {\n    \"a\" : {\n      \"b\": null\n    }\n  }\n}\n```\n\n`d` 是 `null`，但标记为不可空。因此，我们尝试将父节点\
  \ `c` 设置为 `null`。但 `c` 也是不可空的，因此我们尝试并成功将 `b` 设置为 `null`。\n\n如果我们修改 Schema 使字段 `b:\
  \ B!` 也为空，我们将得到如下结果。\n\n```json\n{\n  \"data\": {\n    \"a\" : null\n  }\n}\n```\n\
  \n最后，如果我们将字段 `a` 改为 `a: A!`，那么我们将得到所有都被设置为 `null` 的结果。\n\n```json\n{\n  \"data\"\
  : null\n}\n```\n\n\n\n\n如果错误一直向上传递，我们将所有内容都设置为 `null`，甚至会丢失其他根字段的结果。让我们来看一个更现实的例子。\n\
  \n一个关于宠物和人类的 Schema：\n\n```graphql\ntype Query {\n    pet: Pet!\n    human: Human\n\
  }\n\ntype Pet {\n    name: String\n}\n\ntype Human {\n    name: String\n}\n```\n\
  \n这看起来很没问题，但如果我们同时查询 `pet` 和 `human`：\n\n```graphql\nquery petAndHuman {\n    pet\
  \ {\n        name\n    }\n    human {\n        name\n    }\n}\n```\n\n如果 `pet` 字段加载失败，但\
  \ `human` 字段加载成功，我们最终仍然无法获得数据。\n\n```json\n{\n  \"data\": null\n}\n```\n\n这是因为我们把\
  \ `pet` 标记为非空，错误会向上传播并抹除所有结果。\n\n现在既然我们已经理解了 GraphQL 如何处理非空，我们可以重新表述将一个字段声明为非空的意义是：“一个非空字段至关重要，以至于没有它，所有其他字段都意义不大”。\n\
  \n最基本的例子是 `id` 字段。通常，如果 `id` 的获取失败，我们就无法保证其他任何事情，因此应该将其设为非空。\n\n```graphql\ntype\
  \ User {\n    id: ID!\n    name: UserName\n    address: Address\n}\n```\n\n在这个例子中，`name`\
  \ 和 `address` 并不那么基础，因此没有声明为非空。\n\n有时我们也应该将其他字段设为非空。一个 `User` 可能有一个用于登录的主邮箱，但可以假设这个字段如此重要，以至于如果我们无法加载主邮箱，就不想提供任何数据。\n\
  \n```graphql\ntype User {\n    id: ID!\n    primaryEmail: String! # 也是非空\n    name:\
  \ UserName\n    address: Address\n}\n```\n\n以这种方式思考非空性一个有趣的结论是：根字段应该总是可空的。\n\n关于可空性的一个常见错误是基于当前的实现进行争论。例如：\n\
  \n```graphql\ntype Query {\n    orders: [Order]\n}\n\ntype Order {\n    id: ID!\n\
  \    customer: Customer!\n    # 这里还有更多订单字段\n}\n\ntype Customer {\n    id: ID!\n\
  }\n```\n\n也许这个 Schema 看起来很好，因为我们将所有当前订单都存储在一个数据库中，如果我们能加载订单，那么也会同时加载客户。但现在想象一下，我们将来可能会更改架构，决定引入订单服务和独立的客户服务。突然我们面临了这样一种情况：可以加载订单但无法加载客户，导致错误向上传播时整个\
  \ `Order` 变为 `null`。\n\n如果我们再次从“哪些字段是至关重要的”角度来看 `customer`，就会发现非空也不是一个好的选择。其他的订单数据（我们在示例中未显示的）即使在无法加载客户时可能仍然具有价值。\n\
  \n非空字段通常有意义的特殊情况是位于列表内部。例如：\n\n```graphql\ntype Query {\n    orders: [Order!]\n\
  }\n```\n\n根字段本身是可空的，但列表内部的元素是非空的。即使我们考虑到当前或未来的实现（即我们可以加载某些订单而非所有），我们大多数时候也不想让客户端承担特殊的错误处理负担。\n\
  \n总结一下关于非空字段的建议：\n\n*   根字段始终是可空的\n*   如 `id` 或 `key` 等关键字段是非空的\n*   列表内部的元素是非空的\n\
  *   所有其他字段都应该是可空的\n*   可空字段和参数：默认情况下应该是可空的\n\n非空字段至关重要，以至于没有它，所有其他字段都意义不大。用户。分成两个输入要好得多。\n\
  \n```graphql\ntype Query {\n    user(id: ID, name: String): User\n}\n```\n\n```graphql\n\
  input Update {\n    id: ID!\n    name: String\n}\n```\n\n```graphql\ninput Change\
  \ {\n    id: ID!\n    name: String!\n}\n```\n\n```graphql\ninput Delete {\n    id:\
  \ ID!\n    name: String\n}\n```\n\n```graphql\ninput UserInput {\n    id: ID!\n\
  \    name: String\n}\n```\n\n```graphql\ninput OrderInput {\n    id: ID!\n}\n```\n\
  \n与字段一样，列表内部的元素通常是非空的极佳候选对象。\n\n## 使用 Relay 游标连接规范进行列表分页\n\nGraphQL 最常见的分页方法来自 [Relay\
  \ 游标连接规范](https://relay.dev/graphql/connections.htm)，并已成为 GraphQL Schema 处理大型列表的事实标准。Relay\
  \ 连接规范是“基于游标的分页”，这意味着请求是相对于“游标”的整个列表的切片。该游标标识了我们从整个列表开始切片的位置。然后我们选取另一个游标并再次进行切片。我们可以向后或向前的切片。注意的是，我们不能跳过任何元素，必须请求相对于游标的新的切片。\n\
  \n### Schema\n\n这是一个实现 Relay 连接规范的 Pet Schema 示例。在遍历示例查询之后，我们将进入该规范的更多细节。\n\n\n\n\
  \n\n```\ntype Query {\n    pets(first: Int, after: String, last: Int, before: String):\
  \ \n        PetConnection\n}\n\ntype PetConnection {\n    edges: [PetEdge]\n   \
  \ pageInfo: PageInfo!\n}\n\ntype PetEdge {\n    cursor: String!\n    node: Pet!\n\
  }\n\ntype PageInfo {\n    startCursor: String\n    endCursor: String\n    hasNextPage:\
  \ Boolean!\n    hasPreviousPage: Boolean!\n}\n\ntype Pet {\n    name: String\n \
  \   # 在添加额外的 Pet 字段\n}\n```\n\n### 查询与响应\n\n这是如何使用实现 Relay 连接规范的架构来查询前 2 只宠物。\n\n\
  ```\nquery myPets {\n    pets(first: 2) {\n        edges {\n            cursor\n\
  \            node {\n                name\n            }\n        }\n        pageInfo\
  \ {\n            startCursor\n            endCursor\n            hasNextPage\n \
  \           hasPreviousPage\n        }\n    }\n}\n```\n\n让我们从查询的顶部开始。`first` 参数将结果限制为最多\
  \ 2 个元素。我们没有提供任何游标（cursor）参数，因为我们还没有游标。\n\n查询的下一层是我们的连接字段，`edges` 和 `pageInfo`。\n\
  \n边边（edge）是对我们想要迭代的实际实体的封装，在本例中，是一个代表 `Pet` 的节点（node）。查询中的 `name` 是 `Pet` 的名称字段。边边还提供了如\
  \ `cursor` 等元数据。\n\n在 `edges` 同级层上，我们还查询了 `pageInfo` 以获取有关结果的通用信息，以便我们可以在列表中向前或向后移动。\n\
  \n查询的响应示例如下。\n\n```\n{\n  \"pets\": {\n    \"edges\": [\n      {\n      \"cursor\"\
  : \"ABCD123\",\n      \"node\": {\n        \"name\": \"Luna\"\n      },\n      {\n\
  \      \"cursor\": \"XYZ789\",\n      \"node\": {\n        \"name\": \"Skipper\"\
  \n        }\n      }\n    ],\n    \"pageInfo\": {\n      \"startCursor\": \"ABCD123\"\
  ,\n      \"endCursor\": \"XYZ789\",\n      \"hasNextPage\": true,\n      \"hasPreviousPage\"\
  : false\n    }\n  }\n}\n```\n\n### 请求更多页面\n\n在我们的初始查询中，我们收到了两只宠物的数据及其相应的游标。在响应中，`hasNextPage`\
  \ 为 `true`，因此我们可以请求下一段数据。\n\n若要请求“Skipper”（游标为“XYZ789”）之后的后 10 只宠物，我们需要这样查询：\n\n\
  ```\nquery morePets {\n    pets(first: 10, after: \"XYZ789\") {\n        edges {\n\
  \            cursor\n            node {\n                name\n            }\n \
  \       }\n        pageInfo {\n            startCursor\n            endCursor\n\
  \            hasNextPage\n            hasPreviousPage\n        }\n    }\n}\n```\n\
  \n我们也可以向后移动，请求“Skipper”（游标为“XYZ789”）之前的一只宠物：\n\n```\nquery previousPet {\n    pets(last:\
  \ 1, before: \"XYZ789\") {\n        edges {\n            cursor\n            node\
  \ {\n                name\n            }\n        }\n        pageInfo {\n      \
  \      startCursor\n            endCursor\n            hasNextPage\n           \
  \ hasPreviousPage\n        }\n    }\n}\n```\n\n### Relay 游标连接的核心概念\n\n我们之前已经介绍了如何作为客户端使用分页。现在，让我们仔细查看如何在架构中对分页进行建模。\n\
  \n#### 连接 (Connection)\n\n连接代表一页数据（`edges`），并带有启用进一步页面请求的额外元数据（`pageInfo`）。分页意味着我们不是返回列表，而是返回一个名为\
  \ `<Entity>Connection` 的连接对象，例如我们示例中的 `PetConnection`。\n\n```\ntype Query {\n  \
  \  pets(\n        first: Int,\n        after: String,\n        last: Int,\n    \
  \    before: String\n    ): PetConnection\n}\n```\n\n正如我们在上一个查询所示，`first` 和 `last`\
  \ 的类型为 `Int`，因为它们代表我们想要请求的对象数量。`after` 和 `before` 的类型为 `String`，因为它们是标识元素列表中位置的游标。\n\
  \n注意，如果你不想支持双方向的分页，可以选择只支持 `first/after` 或 `last/before`。\n\n你还可以添加更多参数来过滤元素，例如使用\
  \ `namePattern` 来按名称过滤宠物：\n\n```\ntype Query {\n    pets(\n        first: Int,\n\
  \        after: String,\n        last: Int,\n        before: String,\n        namePattern:\
  \ String\n    ): PetConnection\n}\n```\n\n`<Entity>Connection` 类型必须至少包含 `edges`\
  \ 和 `pageInfo` 字段。\n\n```\ntype PetConnection {\n    edges: [PetEdge]\n    pageInfo:\
  \ PageInfo!\n}\n```\n\n边（edge）是一个包含元素数据和额外元数据的封装。边类型命名为 `<Entity>Edge`。在示例中，我们感兴趣的是\
  \ `Pet` 的页面，因此将此类型称为 `PetEdge`。分页元数据始终称为 `PageInfo`， 并在所有边之间共享。\n\n我们可以向连接类型添加更多字段。例如，连接类型可以包含一个\
  \ `totalCount` 字段。但请注意，添加 `totalCount` 可能会出现问题，因为当底层架构发生变化时可能很难支持。\n\n#### 边 (Edges)\n\
  \n连接的 `edges` 代表一页数据。边是一个包含数据元素（例如 `Pet`）和元数据的封装对象。它的命名格式为 `<Entity>Edge`。它必须包含两个字段：当前元素的\
  \ `cursor` 和命名为 `node` 的实际元素。可以性添加额外的字段。\n\n```\ntype PetEdge {\n    cursor: String!\n\
  \    node: Pet!\n}\n```\n\n#### 页信息 (PageInfo)\n\n`PageInfo` 类型包含查询中请求的所有 `edges`\
  \ 的分页元数据。它必须包含以下字段：\n\n```\ntype PageInfo {\n    startCursor: String\n    endCursor:\
  \ String\n    hasNextPage: Boolean!\n    hasPreviousPage: Boolean!\n}\n```\n\n`PageInfo`\
  \ 总结了当前页的位置以及是否可以在当前页前后请求额外数据。\n\n#### 可选快捷方式：在连接类型中添加节点\n\n你可能在之前的示例中注意到，我们在 `node`\
  \ 字段中的每个元素都有一个 `cursor` 字段，同时在 `PageInfo` 类型中也有 `cursor` 信息的总结。如果你只对整个页面的游标信息感兴趣，而不是每个单独元素，可以使用快捷方式来简化查询。\n\
  \n你可以在连接类型上直接添加一个 `nodes` 字段。\n\n```\ntype PetConnection {\n    edges: [PetEdge]\n\
  \    nodes: [Pet] # 可选快捷方式\n    pageInfo: PageInfo!\n}\n```\n\n\n\n\n\n这允许我们直接通过\
  \ `nodes` 查询宠物数据，而不是通过 `edges`。我们获取的是页面的 `startCursor` 和 `endCursor`，而不是像我们在初始分页响应示例中那样为每只宠物获取\
  \ `cursor`。\n\n```\n[](#cb220-1)query shortcut {\n[](#cb220-2)    pets(first: 2)\
  \ {\n[](#cb220-3)        nodes {\n[](#cb220-4)            name\n[](#cb220-5)   \
  \     }\n[](#cb220-6)        pageInfo {\n[](#cb220-7)            startCursor\n[](#cb220-8)\
  \            endCursor\n[](#cb220-9)            hasNextPage\n[](#cb220-10)     \
  \       hasPreviousPage\n[](#cb220-11)        }\n[](#cb220-12)    }\n[](#cb220-13)}\n\
  ```\n\n将上述查询与本节中的初始分页示例进行比较，后者之所以更长是因为它通过 `edges` 字段使用 `nodes` 查询宠物数据。\n\n```\n\
  [](#cb221-1)query myPets {\n[](#cb221-2)    pets(first: 2) {\n[](#cb221-3)     \
  \   edges {\n[](#cb221-4)            cursor\n[](#cb221-5)            node {\n[](#cb221-6)\
  \                name\n[](#cb221-7)            }\n[](#cb221-8)        }\n[](#cb221-9)\
  \        pageInfo {\n[](#cb221-10)            startCursor\n[](#cb221-11)       \
  \     endCursor\n[](#cb221-12)            hasNextPage\n[](#cb221-13)           \
  \ hasPreviousPage\n[](#cb221-14)        }\n[](#cb221-15)    }\n[](#cb221-16)}\n\
  ```\n\n## 预期错误\n\n在 GraphQL 错误章节 中，我们讨论了出现在 GraphQL 响应中的错误，这些错误通常源于不可预的问题（例如数据库无法访问或\
  \ Bug），但它们并不适用于 `expected`（预期内）错误。预期错误是客户端想要特殊处理的情况。在本节中，我们将演示管理预期错误的最佳实践。\n\n一些典型的预期错误示例：\n\
  \n*   支付详情无效\n*   新用户尝试使用已存在的电子邮件地址注册\n*   某个臭名不可靠的外部系统不可用\n\n如果客户端想要对这些情况做出反应，GraphQL\
  \ 错误并不是理想选择，因为它们存在于正常响应数据之外且没有类型。\n\n例如，一个支付详情错误的错误可能如下所示。\n\n```\n[](#cb222-1){\n\
  [](#cb222-2)  \"data\": {\n[](#cb222-3)     \"makePayment\": null\n[](#cb222-4)\
  \  },\n[](#cb222-5)  \"errors\": {\n[    \"message\": \"Payment failed\",\n[](#cb222-7)\
  \    \"extensions\": {\n[](#cb222-8)      \"classification\": \"PAYMENT_ERROR\"\
  ,\n[](#cb222-9)      \"details\": \"Invalid credit card\"\n[](#cb222-10)    }\n\
  [](#cb222-11)  }]\n[](#cb222-12)}\n```\n\n客户端现在必须解析 `message`，并且可能还要查看 `extensions`，而后者是无类型的且可以包含任何数据。\n\
  \n想象一个更复杂的查询，响应包含部分数据和一些错误。这将更难正确地解析和处理错误。\n\nGraphQL 错误的这些局限性导致了在 Schema 中建模预期错误的想法。这使其成为类型化\
  \ API 合约的一部分，并允许客户端更安全地处理它们。我们必须付出的代价是稍微复杂的 Schema，正如我们在下一个示例中所示。\n\n示例：\n\n```\n\
  [](#cb223-1)type Mutation {\n[](#cb223-2)    makePayment(input: MakePaymentInput!):\
  \ MakePaymentPayload\n[](#cb223-3)}\n\n[](#cb223-4)\ntype MakePaymentPayload {\n\
  [](#cb223-6)    payment: Payment\n[](#cb223-7)    error: MakePaymentError\n[](#cb223-8)}\n\
  \n[](#cb223-9)\nenum MakePaymentError {\n[](#cb223-11)    CC_INVALID,\n[](#cb223-12)\
  \    PAYMENT_SYSTEM_UNAVAILABLE\n[](#cb223-13)}\n```\n\n这把支付错误引入了响应类型中，它出现在 GraphQL\
  \ 响应的 `data` 部分。注意这些错误不再出现在 GraphQL 响应的 `errors` 部分中。\n\n```\n[](#cb224-1){\n[](#cb224-2)\
  \  \"data\": {\n[](#cb224-3)    \"makePayment\": {\n[](#cb224-4)      \"payment\"\
  : null,\n[](#cb224-5)      \"error\": \"CC_INVALID\"\n    }\n[](#cb224-7)  }\n```\n\
  \n对于变更，`Payload` 类型是放置错误的自然位置。对于查询，我们可以使用 `union`。\n\n```\n[](#cb225-1)type Query\
  \ {\n[](#cb225-2)    pet(id: ID!): PetLookup\n[](#cb225-3)}\n\n[](#cb225-4)union\
  \ PetLookup = Pet | MakePaymentError\n```\n\n\n\n\n\n```java\npackage myservice.service;\n\
  \nimport org.springframework.graphql.server.WebGraphQlInterceptor;\nimport org.springframework.graphql.server.WebGraphQlRequest;\n\
  import org.springframework.graphql.server.WebGraphQlResponse;\nimport org.springframework.stereotype.Component;\n\
  import reactor.core.publisher.Mono;\n\n@Component\nclass UserIdInterceptor implements\
  \ WebGraphQlInterceptor {\n\n  @Override\n  public Mono<WebGraphQlResponse> intercept(\n\
  \    WebGraphQlRequest request, Chain chain\n  ) {\n    request.configureExecutionInput((executionInput,\
  \ builder) -> {\n      executionInput\n        .getGraphQLContext()\n        .put(\"\
  userId\", \"123\");\n      return executionInput;\n    });\n\n    return chain.next(request);\n\
  \  }\n}\n```\n\n通过使用 `@ContextValue` 参数获取 `userId` 值，该参数可以从模式映射（schema mapping）或批量映射（batch\
  \ mapping）处理程序中的 `GraphQLContext` 中检索特定值。\n\n```java\n@SchemaMapping\nMyType myField(@ContextValue\
  \ String userId) {\n  // 在处编写你的逻辑\n}\n```\n\n在纯 GraphQL Java 中，我们可以通过 `ExecutionInput`\
  \ 或 `DataFetchingEnvironment` 向 `GraphQLContext` 添加 `userId`：\n\n```java\nExecutionInput\
  \ executionInput = ...;\nexecutionInput.getGraphQLContext().put(\"userId\", \"123\"\
  );\n```\n\n注意：`DataFetchingEnvironment` 中 getter 方法的字母“L”大小写略有不同。\n\n```java\nDataFetcher\
  \ df = (env) -> {\n    env.getGraphQlContext().put(\"userId\", \"123\");\n    ...\n\
  }\n```\n\n通过 `DataFetchingEnvironment` 获取 `userId` 值。\n\n```java\nDataFetcher df\
  \ = (env) -> {\n    String userId = env.getGraphQlContext().get(\"userId\");\n \
  \   ...\n}\n```\n\n### 本地上下文 (Local context)\n\n我们也可以设置本地上下文，它只为子 DataFetchers 提供数据，而不是更改全局上下文。\n\
  \n一个 GraphQL 请求是一个字段树，每个字段都有一个关联的 `DataFetcher`。子 DataFetchers 只有在当前 `DataFetcher`\
  \ 完成后才会被调用。我们将在[Execution]章节中详细详细讨论字段树的概念。因此，我们可以确保设置在本地上下文中信息仅对子 DataFetchers 可用。\n\
  \n我们可以通过返回一个新的 `DataFetcherResult` 来设置本地上下文，其中 `localContext` 不为空。我们在[Errors]章节中讨论过如何使用\
  \ `DataFetcherResult` 返回数据和错误。现在我们将展示如何使用它来设置本地上下文。\n\n例如，我们有关于客户及其订单的如下模式。\n\n\
  ```graphql\ntype Query {\n    order: Order\n    customerById(id: ID!): Customer\n\
  }\n\ntype Order {\n    id: ID\n    customer: Customer\n}\n\ntype Customer {\n  \
  \  id: ID\n    contact: Person\n}\n\ntype Person {\n    name: String\n}\n```\n\n\
  我们可以直接作为根字段查询客户，或者通过订单查询。\n\n```graphql\nquery customerDetails {\n    customerById(id:\
  \ \"ID-1\") {\n        contact {\n            name\n        }\n    }\n}\n```\n\n\
  或者\n\n```graphql\nquery orderDetails { \n    order {\n        customer {\n     \
  \       contact {\n                name\n            }\n        }\n    }\n}\n```\n\
  \n添加以下 Java 类。\n\n```java\npackage myservice.service;\nrecord Order(String id, String\
  \ customerId) {}\n```\n\n```java\npackage myservice.service;\nrecord Customer(String\
  \ id, String contactId) {}\n```\n\n```java\npackage myservice.service;\nrecord Person(String\
  \ name) {}\n```\n\n假设我们的持久层在订单旁边存储了完整的客户信息。这意味着当我们加载订单时，我们已经加载了完整的客户，包括他们的联系人。然而，在我们的持久层中，直接加载的客户并不包含相应的联系信息。\n\
  \n对于包含 `order` 字段的查询，我们可以在加载 `order` 时设置本地上下文，避免第二次获取客户信息，并在 `customer` `DataFetcher`\
  \ 中利用它。\n\n在 Spring for GraphQL 中，本地上下文必须是一个 `GraphQLContext` 对象，通过在 `Query.order`\
  \ `DataFetcher` 中返回 `DataFetcherResult` 来设置。注意，此 `GraphQLContext` 本地实例对于 `DataFetcher`\
  \ 及其子是局部的，与全局可用的 `GraphQLContext` 实例不同。\n\n我们可以从 `DataFetchingEnvironment` 获取本地上下文。如果\
  \ `Person` 在上下文中，我们可以复用该信息。否则，我们将向 `Person` 服务发送请求。\n\n在下面的示例中，我们使用了占位符检索方法。请将这些方法替换为你的逻辑。如果你希望快速端端端端，可以使用内存对象对这些方法进行\
  \ mock。\n\n```java\npackage myservice.service;\n\nimport graphql.GraphQLContext;\n\
  import graphql.execution.DataFetcherResult;\nimport graphql.schema.DataFetchingEnvironment;\n\
  import org.springframework.graphql.data.method.annotation.Argument;\nimport org.springframework.graphql.data.method.annotation.QueryMapping;\n\
  import org.springframework.graphql.data.method.annotation.SchemaMapping;\nimport\
  \ org.springframework.stereotype.Controller;\n\n@Controller\nrecord OrderController(OrderService\
  \ orderService,\n                       PersonService personService) {\n\n  @QueryMapping\n\
  \  DataFetcherResult<Order> order() {\n    Order order = orderService.getOrder();\n\
  \    Person personForContact = order.getPersonForContact();\n    // GraphQLContext\
  \ 的本地实例\n    GraphQLContext localContext = GraphQLContext.newContext()\n      .put(\"\
  personForContact\", personForContact)\n      .build();\n    // 返回数据和新的本地上下文\n  \
  \  return DataFetcherResult.<Order>newResult()\n      .data(order)\n      .localContext(localContext)\n\
  \      .build();\n  }\n\n  @SchemaMapping\n  Customer customer(Order order) {\n\
  \    return orderService.getCustomer(order);\n  }\n\n  @SchemaMapping\n  Person\
  \ contact(Customer customer, DataFetchingEnvironment env) {\n    GraphQLContext\
  \ localContext = env.getLocalContext();\n    if (localContext != null \n      &&\
  \ localContext.get(\"personForContact\") instanceof Person) {\n      return localContext.get(\"\
  personForContact\");\n    }\n    return personService.getPerson(customer.contactId());\n\
  \  }\n\n  @QueryMapping\n  Customer customerById(@Argument String id) {\n    return\
  \ orderService.getCustomerById(id);\n  }\n}\n```\n\n\n\n\n在这个示例中，`Person` 并不保证一定会在本地上下文中设置。如果查询仅针对\
  \ `customer` 详情而没有 `order`，则本地上下文中将没有 `personForContact`。由于我们无法确定 `personForContact`\
  \ 是否在本地上下文中，我们必须通过 `DataFetchingEnvironment` 访问本地的 `GraphQLContext`，然后检查 `personForContact`\
  \ 键下是否设置了 `Person`。\n\n如果你确定本地上下文中始终包含某个特定键，可以向模式映射方法传递一个参数，并使用 `@LocalContextValue`\
  \ 进行注解。在示例中，我们无法使用此注解，因为每当 `personForContact` 未设置时都会抛出运行时异常。\n\n在纯 GraphQL Java\
  \ 中，本地上下文也是通过 `Query.order` DataFetcher 中的 `DataFetcherResult` 设置的。如果使用不带 Spring\
  \ for GraphQL 的 GraphQL Java，插入到本地上下文中的对象可以是任何类型，而不必是 `GraphQLContext` 的实例。\n\n\
  ```java\n// DataFetcher for Query.order\nOrderService orderService;\nDataFetcher<DataFetcherResult<Order>>\
  \ orderDf = (env) -> {\n  Order order = orderService.getOrder();\n  Person personForContact\
  \ = order.getPersonForContact();\n  // Return data and a new local context\n  return\
  \ DataFetcherResult.<Order>newResult()\n    .data(order)\n    .localContext(personForContact)\n\
  \    .build();\n};\n```\n\n然后 `Customer.contact` 的 DataFetcher 可以利用本地上下文中预加载的 `Person`（如果可用）。如果\
  \ `Person` 不可用，则将向 `Person` 服务发送请求。\n\n```java\n// DataFetcher for Customer.contact\n\
  PersonService personService;\nDataFetcher<Person> contactDf = (env) -> {\n  // 如果我们之前已经加载了该人员\n\
  \  if (env.getLocalContext() instanceof Person) {\n    return env.getLocalContext();\n\
  \  }\n  Customer customer = env.getSource();\n  return personService.getPerson(customer.getContactId());\n\
  };\n```\n\n## DataFetcher 实现模式\n\n在实现 DataFetcher 时，有几点需要考虑：\n\n* 它是否涉及 I/O？（例如，对另一个服务的\
  \ `HTTP` 调用）\n* 它是否是计算密集型的？\n* 它 应该是响应式的（reactive）还是不是？\n\n我们将讨论这三种模式以及何时使用它们。由于接下来的几个示例演示了\
  \ DataFetcher 模式，我们将展示代码片段而不是完整的 Spring for GraphQL 控制器。\n\n### 非响应式 DataFetcher\n\
  \n非响应式的 DataFetcher 可以包含阻塞的 I/O 或计算工作。无论工作的类型如何，其结构都是相同的。\n\n```java\n@Controller\n\
  record ThingController(DoSomeThing service) {\n    @SchemaMapping\n    MyType myField()\
  \ {\n        return service.doSomething();\n    }\n}\n```\n\n或者在纯 GraphQL Java 中实现相同的\
  \ DataFetcher：\n\n```java\nDoSomeThing service;\nDataFetcher<MyType> myField = (env)\
  \ -> {\n    return service.doSomething();\n};\n```\n\n这是最直接的模式。如果你正在开发一个非响应式服务，这是你唯一需要的模式。\n\
  \n在响应式服务中，如果工作仅是快速的计算工作（即不涉及 I/O），这仍然是一个有效选项。“快”的确切定义取决于领域，但作为一个粗略指南，“快”是指完成时间少于一毫秒的工作。\n\
  \n### 封装阻塞 I/O\n\n如果 DataFetcher 涉及阻塞 I/O，我们可以将阻塞调用调度到另一个线程。\n\n在纯 GraphQL Java\
  \ 中，它看起来像这样：\n\n```java\nExecutor threadPool;\nDataFetcher<CompletableFuture<MyType>>\
  \ df = (env) -> {\n  return CompletableFuture.supplyAsync(\n    () -> client.blockingCall(),\n\
  \    threadPool);\n};\n```\n\n虽然封装 I/O 调用不会让整个服务完全变为响应式，但它仍然值得这样做，因为它不会阻塞 GraphQL\
  \ Java 本身，并允许字段的并行获取。\n\n在 Spring for GraphQL 中，我们推荐使用响应式方法而不是 `CompletableFuture`。\n\
  \n### 响应式 I/O\n\n响应式 DataFetcher 通常涉及使用库如 `WebClient`。代价是代码不再像“普通”Java 代码那样易于阅读、编写和调试。\n\
  \n```java\nReactiveClient client;\nDataFetcher<Something> df = (env) -> {\n  return\
  \ client.call();\n};\n```\n\n### 响应式计算工作\n\n响应式计算工作比之前的示例需要更多的努力，因为它需要将实际工作调度到另一个线程。主模式如下：\n\
  \n```java\nExecutor threadPool;\nDataFetcher<CompletableFuture<Something>> df =\
  \ (env) -> {\n  return CompletableFuture.supplyAsync(\n    () -> client.call(),\n\
  \    threadPool);\n};\n```\n\n### 响应式还是否？\n\n是否使用响应式模式是一个通用问题，并非 GraphQL 特有。\n\n\
  ```java\nRestTemplate restTemplate;\nURI url;\nExecutor threadPool;\n\nDataFetcher<CompletableFuture<MyType>>\
  \ df = (env) -> {\n  return CompletableFuture.supplyAsync(\n    () -> restTemplate.getForObject(url,\
  \ MyType.class), // 阻塞调用\n    threadPool);\n};\n```\n\n这个 DataFetcher 返回一个 `CompletableFuture`，但它实际上通过\
  \ `RestTemplate` HTTP 客户端执行了一个阻塞调用。主要的权衡是在扩展性或复杂的代码之间。在负载下，响应式服务比非响应式服务更稳定、更可预测。如果你将运行一个需要非常稳定的高负载服务，我们的建议是响应式的。\n\
  \n\n\n\n# Spring for GraphQL 的 Reactor 支持\n\nSpring WebFlux 是一个基于 [Reactor](https://projectreactor.io/docs/core/release/reference/index.html#intro-reactive)\
  \ 的异步非阻塞框架。你可以结合 Spring WebFlux 和 Spring for GraphQL 来构建 Reactor DataFetchers。\n\
  \nSpring for GraphQL 支持将 Reactor 类型 `Mono` 和 `Flux` 作为返回值，这使得能够编写响应式的 DataFetchers。如果\
  \ `Mono` 和 `Flux` 对你来说是全新的，请参阅 [Reactor 文档](https://projectreactor.io/docs/core/release/reference/index.html#core-features)。\n\
  \n我们建议在 Spring for GraphQL 中使用 Reactor 类型 `Mono` 和 `Flux` 而不是 Java 的 `CompletableFuture`，以便利用\
  \ Reactor 上上下文（context）。不过，仍然返回 `CompletableFuture` 值。\n\n要使用 Spring WebFlux，请包含\
  \ `org.springframework.boot:spring-boot-starter-webflux` 依赖项。我们之前在构建 GraphQL 服务章节\
  \ 中已经介绍过如何使用 Spring WebFlux。\n\n使用 Reactor 不需要额外的代码或配置。只需编写一个返回 Reactor  DataFetcher\
  \ 即可。例如：\n\n```\n@SchemaMapping(type = \"Foo\", field = \"bar\")\nMono<String> bar()\
  \ {\n  ...\n}\n\n@SchemaMapping(type = \"Foo\", field = \"bar\")\nFlux<String> bar()\
  \ {\n  ...\n}\n```\n\n要查看更多返回 Reactor 类型的 DataFetcher 示例，请参见构建 GraphQL 服务章节中的示例。\n\
  \n在使用 GraphQL Java 使用 Reactor 时的一个挑战是，GraphQL Java 本身是基于 `CompletableFuture` 的。Spring\
  \ for GraphQL 管理 Reactor 类型与 `CompletableFuture` 之间的转换。为了防止在与 `CompletableFuture`\
  \ 之间转换时丢失 [Reactor Context](https://projectreactor.io/docs/core/release/reference/#context)，Spring\
  \ for GraphQL 在不同的 DataFetcher 调用之间保存并恢复 Reactor 上下。\n\n例如，如果我们想通过 Reactor 上下传递日志前缀：\n\
  \n```\npackage myservice.service;\n\nimport org.springframework.graphql.server.WebGraphQlInterceptor;\n\
  import org.springframework.graphql.server.WebGraphQlRequest;\nimport org.springframework.graphql.server.WebGraphQlResponse;\n\
  import org.springframework.stereotype.Component;\nimport reactor.core.publisher.Mono;\n\
  import reactor.util.context.Context;\n\n//为 Reactor context 设置初始值\n@Component\n\
  class WebInterceptor implements WebGraphQlInterceptor {\n\n  @Override\n  public\
  \ Mono<WebGraphQlResponse> intercept(WebGraphQlRequest request,\n              \
  \                              Chain chain) {\n    return chain.next(request)\n\
  \      .contextWrite(Context.of(\"loggingPrefix\", \"123\"));\n  }\n}\n```\n\n关于\
  \ `WebGraphQlInterceptor` 的更多细节，请参阅请求章节中的拦截请求部分。\n\n每个 DataFetcher 以及 DataFetcher\
  \ 调用的任何其他代码都可以访问该前缀。\n\n```\n@QueryMapping\nMono<String> foo() {\n  return Mono.deferContextual(contextView\
  \ -> {\n    String loggingPrefix = contextView.get(\"loggingPrefix\");\n    return\
  \ Mono.just(loggingPrefix);\n  });\n}\n```\n\n在本章中我们涵盖了关于 DataFetcher 的更多高级细节，包括如何使用全局和局部上下文以及响应式模式。我们还讨论了如何在\
  \ Spring for GraphQL 中使用 Reactor 类型。\n\n# 指令（Directives）\n\n指令是 GraphQL 的一项强大功能，允许我们在模式或文档中声明任何种的额外数据。这些数据可以用于更改运行时执行或类型验证行为。\n\
  \n在这一高级章节中，我们将深入讨论指令并演示指令的用例。\n\n## 模式和操作指令\n\n指令大致分为两类：模式指令和操作指令。模式指令用于模式元素，而操作指令用于操作内部（#ch008.xhtml_fetching-data-external）。\n\
  \n模式指令和操作指令有一个名称，后面跟着一个可选的参数列表。例如，这是一个内置指令：\n\n```graphql\ntype Query {\n  search:\
  \ String @deprecated(reason = \"Too slow\")\n}\n```\n\nGraphQL 规范将 `@deprecated`\
  \ 定义为模式指令：\n\n```graphql\ndirective @deprecated(reason: String) on FIELD_DEFINITION\
  \ | ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION | INTERFACE | ENUM_VALUE | OBJECT_DEFINITION\
  \ | SCALAR_DEFINITION | UNION_DEFINITION\n```\n\n\n\n\n\n为了更有实用性，`@skip` 和 `@include`\
  \ 应该与变量结合，而不是硬编码布尔值。例如，我们可以根据变量值包含一个实验性字段：\n\n```\n[](#cb256-1)query myQuery($someTest:\
  \ Boolean!) {\n[](#cb256-2)    experimentalField @include(if: $someTest)\n[](#cb256-3)}\n\
  ```\n\n### `@deprecated`\n\n`@deprecated` 是一个模式指令（schema directive），可以用于标记模式中的字段、枚举值、输入字段和参数为已用。它提供了一种结构化的方式来记录弃用信息。默认情况下，内省\
  \ API（introspection API）会过滤掉已用的模式元素。\n\n由于 `@deprecated` 是一个内置指令，你不应该在自己的模式中声明它。为了说明\
  \ `@deprecated` 的用法，以下是它的定义方式：\n\n```\n[](#cb257-1)directive @deprecated(reason:\
  \ String = \"No longer supported\") \n[](#cb257-2)  on FIELD_DEFINITION | ARGUMENT_DEFINITION\
  \ | INPUT_FIELD_DEFINITION \n[](#cb257-3)    | ENUM_VALUE\n```\n\n你可以可选地提供一个弃用原因\
  \ `reason`，它将出现在自动生成的文档和工具中。默认的 `reason` 是“No longer supported”。\n\n这是一个在模式中将字段和枚举标记为已用的示例：\n\
  \n```\n[](#cb258-1)type Query {\n[](#cb258-2)    search: String @deprecated(reason:\
  \ \"Too slow, please use searchFast\")\n[](#cb258-3)    searchFast: String\n[](#cb258-4)}\n\
  [](#cb258-5)\n[](#cb258-6)enum Format {\n[](#cb258-7)    LEGACY @deprecated(reason:\
  \ \"Legacy format\")\n[](#cb258-8)    NEW\n[](#cb258-9)}\n```\n\n`@deprecated` 指令用于自动生成文档。例如，如上述模式在\
  \ GraphiQL 的文档页签中的显示方式所示。点击页面左上角的书籍图标，如截图“Deprecated documentation in GraphiQL”所示。\n\
  \n![Deprecated documentation in GraphiQL](img/file14.png)\n\nGraphiQL 中的弃用文档\n\n\
  ### `@specifiedBy`\n\n`@specifiedBy` 允许我们提供一个标量规范 URL 来描述自定义标量类型的行为。\n\n自定义标量 是\
  \ GraphQL 的一项强大功能，允许扩展类型系统。在 GraphQL 规范最初，自定义标量只能通过名称在模式中定义。例如：\n\n```\n[](#cb259-1)scalar\
  \ DateTime\n```\n\n这仍然是在模式中定义自定义标量的有效方式。然而，仅凭模式中的名称不足以解释自定义标量的行为。例如，`DateTime` 的实现可能跨服务有所异，但它们可能都包含相同名称\
  \ `DateTime` 的模式元素。引入 `@specifiedBy` 指令是为了提供一种清晰记录自定义标量行为的方法。提供的 URL 应链接到包含数据格式、序列化和转换规则的规范。有关详情和规范模板，请参见\
  \ [GraphQL Scalars 项目](https://scalars.graphql.org/)。\n\n我们建议使用 `@specifiedBy` 来清晰描述你的自定义标量。不过，对自定义标量使用此指令并非强制性的。\n\
  \n由于 `@specifiedBy` 是一个内置指令，你不应该在自己的模式中声明它。为了说明 `@specifiedBy` 的用法，以下是它的定义方式：\n\n\
  ```\n[](#cb260-1)directive @specifiedBy(url: String!) on SCALAR\n```\n\n这是一个 `DateTime`\
  \ 标量的示例：\n\n```\n[](#cb261-1)scalar DateTime @specifiedBy(url: \n[](#cb261-2)  \
  \  \"https://scalars.graphql.org/andimarek/date-time\")\n```\n\n通过 [GraphQL Scalars](https://scalars.graphql.org/)\
  \ 项目，你可以创建自己的自定义标量规范并将其托管在 GraphQL Foundation 的 `scalars.graphql.org` 域名上，如上一个示例中的链接\
  \ URL。你也可以阅读并链接到其他贡献的规范。更多信息请参见 [GraphQL Scalars](https://scalars.graphql.org/)\
  \ 项目。\n\n## 定义你自己的模式和操作指令\n\n模式指令和操作指令有一个以 `@` 开头的名称，括号内有一有一个可选的参数列表，随后是 `on` 以及允许使用的位置列表。允许的位置决定了该指令是操作指令还是模式指令。在创建自己的模式和操作指令时，它们必须在模式中定义。\n\
  \n需要理解的是，在我们实现自定义行为之前，所有自定义模式和操作指令都不会产生任何影响。我们首先讨论如何定义模式和操作指令，然后讨论如何实现它们。\n\n##\
  \ 定义模式指令\n\n让我们来看一些示例。让我们创建一个 `@important` 指令。该指令只能在字段定义上使用，使其成为一个模式指令：\n\n```\n\
  [](#cb262-1)# 无参数，且只能在字段定义上使用\n[](#cb262-2)directive @important on FIELD_DEFINITION\n\
  ```\n\n我们新的 `@important` 指令可以用来指示某些模式字段是重要的。\n\n```\n[](#cb263-1)type Query {\n\
  [](#cb263-2)    hello: String @important # 指令的使用\n[](#cb263-3)}\n```\n\n我们定义的 `@important`\
  \ 指令为仅允许在字段定义上使用。为了使该模式有效，我们可以通过 `|` 分隔为指令定义添加另一个位置。\n\n```\n[](#cb262-2)directive\
  \ @important on FIELD_DEFINITION | OBJECT\n```\n\n现在它是有效的：\n\n```\n[](#cb263-1)type\
  \ Query {\n[](#cb263-2)    hello: String @important # 指令的使用\n[](#cb263-3)}\n```\n\
  \n在我们实现自定义行为之前，所有自定义模式和操作指令都不会产生任何影响。模式指令和操作指令之间的区别在于允许的位置列表。这里有一个包含所有十一位置的模式指令\
  \ `@foo` 示例。\n\n```\ndirective @foo on SCHEMA | SCALAR | OBJECT | \nFIELD_DEFINITION\
  \ | ARGUMENT_DEFINITION | INTERFACE | UNION | ENUM | ENUM_VALUE | INPUT_OBJECT |\
  \ INPUT_FIELD_DEFINITION\nschema {\n    query: Query\n}\nCustomScalar @foo\ntype\
  \ Query @foo {\n    hello(\n        arg: SomeInput @ foo # 参数\n    ): String @foo\
  \ # 字段定义\n}\n```\n``` @foo {\n    hello: String\n}\ntype SomeImplementation implements\
  \ SomeInterface {\n    hello: String\n}\nunion SomeUnion = SomeImplementation @foo\n\
  enum SomeEnum @foo {\n    ENUM_VALUE @foo # 枚举值\n}\ninput SomeInput @foo {\n  inputField:\
  \ String @foo # 输入字段\n}\n```\n\n虽然在技术上可以定义一个包含模式和操作指令位置的指令，但在实践中这并不常见。\n\n### 定义操作指令\n\
  \n让我们定义一个操作指令 `@cache`，它可以用于操作字段。请注意，下例中的 `FIELD` 指的是操作字段，而上一个模式指令示例中使用的 `FIELD_DEFINITION`\
  \ 指的是模式字段。\n\n\n\n\n\n```graphql\n# 只能用在 GraphQL 文档的字段上\ndirective @cache on FIELD\n\
  \ntype Query {\n    pet: Pet\n}\n\ntype Pet {\n    name: String\n    lastTimeOutside:\
  \ String\n}\n```\n\n我们只能在包含操作的 GraphQL 文档的字段上使用 `@cache` 指令。\n\n```graphql\nquery\
  \ myPet {\n    pet {\n        name\n        lastTimeOutside @cache\n    }\n}\n```\n\
  \n指令也可以包含参数。让我们添加一个 `maxAge` 参数，其默认值为 1000。\n\n```graphql\n# 带有默认值的参数\ndirective\
  \ @cache(maxAge: Int = 1000) on FIELD\n```\n\n在 GraphQL 文档中，我们可以使用更新后的 `@cache`\
  \ 指令来指定 `maxAge` 值：\n\n```graphql\nquery myPet {\n    pet {\n        name\n    \
  \    lastTimeOutside @cache(maxAge: 500)\n    }\n}\n```\n\n在实现新的自定义行为之前，所有自定义架构指令和操作指令都不会产生任何影响。例如，在上面的操作中\
  \ `lastTimeOutside` 带有 `@cache` 指令，它的行为与没有该指令完全相同，直到我们实现了某些新逻辑。我们将在本章稍后演示指令行为的实现。你不需要为内置指令定义行为，它们都有定义明确的效果，并由每个\
  \ GraphQL 实现所共同实现。\n\n架构指令和操作指令的区别在于允许位置的列表。以下是一个在包含操作的 GraphQL 文档中列出的所有八种可能位置的操作指令：\n\
  \n```graphql\ntype @foo on QUERY | MUTATION | SUBSCRIPTION |\n  FIELD | FRAGMENT_DEFINITION\
  \ | FRAGMENT_SPREAD |\n  INLINE_FRAGMENT | VARIABLE_DEFINITION\n\nquery someQuery(\n\
  \    $var: String @foo # 变量定义\n    ) @foo # 查询\n    {\n        field @foo  # 字段\n\
  \        ... on Query @foo { # 内联片段\n            field\n        }\n        ...someFragment\
  \ @foo # 片段扩展\n    }\n\nfragment someFragment @foo { # 片段\n    field\n}\n\nmutation\
  \ someMutation @foo { # 变更\n    field\n}\n\nsubscription someSubscription @foo {\
  \ # 订阅\n    field\n}\n```\n\n虽然在技术上可以定义一个包含与架构指令和操作指令相关位置的指令，但在实践中这并不常见。\n\n## 可重复指令\n\
  \n我们可以将架构和操作指令定义为 `repeatable`（可重复），允许它在同一位置被多次使用。如果指令定义中没有包含 `repeatable`，则该指令默认为不可重复的。\n\
  \n例如，一个可重复的架构指令 `@owner`：\n\n```graphql\ndirective @owner(name: String!) repeatable\
  \ on FIELD_DEFINITION\n\ntype Query {\n    # 每个字段可以有所有者\n    hello: String @owner(name:\
  \ \"Brian\") @owner(name: \"Josh\")\n}\n```\n\n## 为架构指令实现逻辑\n\n要创建一个新的架构指令，我们必须定义该指令并实现其逻辑。\n\
  \n由于这是一个高级章节，接下来的代码示例更为复杂，并涉及架构的遍历和转换。\n\n### 使用架构指令更改执行逻辑\n\n让我们为新的 `@important`\
  \ 指令实现逻辑，该指令指示哪些架构字段是重要的，以及其重要的原因。它的定义如下：\n\n```graphql\ndirective @important(reason:\
  \ String!) on FIELD_DEFINITION\n```\n\n可以在架构中使用它：\n\n```graphql\ntype Query {\n\
  \    hello: String @important(reason: \"high priority\")\n}\n```\n\n为了解释架构定义和用法是如何表示的，我们将通过\
  \ Java 来说明。在实践中，我们经常在 DataFetcher 中使用架构指令。例如，在 Spring DataFetcher 中，我们可以这样使用 `@important`\
  \ 指令来更改处理重要字段的方式：\n\n```java\npackage myservice.service;\n\nimport graphql.schema.DataFetchingEnvironment;\n\
  import graphql.schema.AppliedDirective;\nimport graphql.schema.FieldDefinition;\n\
  import org.springframework.graphql.data.method.annotation.QueryMapping;\nimport\
  \ org.springframework.stereotype.Controller;\n\n@Controller\nclass GreetingController\
  \ {\n  @QueryMapping\n  String hello(DataFetchingEnvironment env) {\n    FieldDefinition\
  \ fieldDefinition = env.getFieldDefinition();\n    AppliedDirective important =\
  \ \n      fieldDefinition.getAppliedDirective(\"important\");\n    if (important\
  \ != null) {\n      return handleImportantFieldsDifferently(env);\n    }\n    return\
  \ \"Hello\";\n  }\n}\n```\n\n### 使用架构指令进行验证\n\n指令也可以用于验证。例如，用于参数的 `@size` 架构指令，用于强制执行最小数量。\n\
  \n```graphql\ndirective @size(min : Int = 0) on ARGUMENT_DEFINITION\n```\n\n\n\n\
  \n\n它可以被应用于参数定义，以验证输入中是否有足够的 `Application`：\n\n```\ntype Query {\n    hired(applications\
  \ : [Application!] @size(min : 3)) : [Boolean]\n}\n```\n\n验证是一个非常有用且被频繁请求的想法，因此有一个针对\
  \ GraphQL Java 的[扩展验证库](https://github.com/graphql-java/graphql-java-extended-validation)，该库由\
  \ GraphQL Java 团队维护。\n\n要使用 `graphql-java-extended-validation` 库中的验证指令，请添加该包。\n\n\
  对于 Gradle，在你的 `build.gradle` 文件中添加以下内容：\n\n```\nimplementation 'com.graphql-java:graphql-java-extended-validation:19.1'\n\
  ```\n\n对于 Maven：\n\n```xml\n<dependency>\n  <groupId>com.graphql-java</groupId>\n\
  \  <artifactId>graphql-java-extended-validation</artifactId>\n  <version>19.1</version>\n\
  </dependency>\n```\n\n注意：主版本号对应于主 GraphQL Java 版本的链接主版本。在编写本文时，Spring for GraphQL\
  \ 1.1.2 的最新版本使用了 GraphQL Java 19。\n\n要在 Spring for GraphQL 中接线这些验证指令，请创建一个 `RuntimeWiringConfigurer`\
  \ bean。这将添加来自 `graphql-java-extended-validation` 的一组默认指令实现。你应该在你的 schema 中单独为你的服务定义这些指令。\n\
  \n```java\n@Configuration\nclass GraphQlConfig {\n    @Bean\n    RuntimeWiringConfigurer\
  \ runtimeWiringConfigurer() {\n        // 添加库中所有的默认验证规则\n        ValidationRules\
  \ possibleRules \n            = ValidationRules.newValidationRules().build();\n\
  \        // ValidationSchemaWiring 使用了 SchemaDirectiveWiring\n        ValidationSchemaWiring\
  \ validationDirectiveWiring \n            = new ValidationSchemaWiring(possibleRules);\n\
  \        return wiringBuilder -> wiringBuilder\n                .directiveWiring(validationDirectiveWiring);\n\
  \    }\n}\n```\n\nSpring Boot starter 会自动检测所有的 `RuntimeWiringConfigurer` bean。\n\
  \n### 使用 schema 指添加元数据\n\nschema 指令另一个非常常见的用例是提供元数据，这些数据不会改变执行，仅与 schema 本身相关。\n\
  \n例如，我们在大型团队中工作，并通过 `@owner` 指令来记录某些类型的所有者：\n\n```\ndirective @owner(name: String)\
  \ on OBJECT\n\ntype User @owner(name: \"Antoine\") {\n    # More fields here\n}\n\
  \ntype Order @owner(name: \"Felipe\") {\n    # More fields here\n}\n\ntype Payment\
  \ @owner(name: \"Stephan\") {\n    # More fields here\n}\n```\n\n使用指令的一个显著优势是能够程序化地处理它们。例如，我们可以创建一个自动报告，显示哪些类型由谁所有。这个所有权报告示例更像是一个脚本，而不是\
  \ Spring for GraphQL 服务的一部分。因此，我们将在纯 GraphQL Java 中演示这个示例。\n\nGraphQL Java 提供了程序化访问\
  \ schema 元素的工具。在纯 GraphQL Java 代码中，我们可以使用 `SchemaTraverser` 类配合 `GraphQLTypeVisitor`\
  \ 将所有者映射到类型。在这个示例中，我们将访问 `GraphQLObjectType`。GraphQL Java 中有许多更多选项和钩子可以自定义访问器。\n\
  \n```java\nGraphQLSchema schema = ...;\nMap<String, List<GraphQLObjectType>> ownerToTypes\n\
  \  = new LinkedHashMap<>();\n\nSchemaTraverser schemaTraverser = new SchemaTraverser();\n\
  schemaTraverser.depthFirstFullSchema(new GraphQLTypeVisitorStub() {\n  @Override\n\
  \  public TraversalControl visitGraphQLObjectType(\n    GraphQLObjectType objectType,\n\
  \    TraverserContext<GraphQLSchemaElement> context\n  ) {\n    GraphQLAppliedDirective\
  \ directive\n      = objectType.getAppliedDirective(\"owner\");\n    if (directive\
  \ != null) {\n      String owner = directive.getArgument(\"name\").getValue();\n\
  \      ownerToTypes.putIfAbsent(owner, new ArrayList<>());\n      ownerToTypes.get(owner).add(objectType);\n\
  \    }\n    return TraversalControl.CONTINUE;\n  }\n}, schema);\n```\n\n我们访问 schema\
  \ 中的每一个 `GraphQLObjectType`，并检查每个对象类型的所有者。然后我们组装一个所有者到对象类型列表的映射。\n\n这个 `@owner`\
  \ 示例更像是一个脚本，而不是 Spring for GraphQL 服务中的核心功能。然而，如果你想在 Spring for GraphQL 中遍历 schema，可以通过\
  \ `GraphQlSource.builder` 配合 `builder.schemaResources(..).typeVisitors(..)` 注册 `graphql.schema.GraphQLTypeVisitor`。\n\
  \n更进一步，我们甚至可以使用 schema 指令更改全局的 `GraphQLSchema`。例如，我们可以根据指令自动为每个字段添加后缀。\n\n```\n\
  directive @suffix(name: String) on OBJECT\n\ntype Dog @suffix(name:\"__bark\") {\n\
  \    name: String\n}\n\ntype Cat @suffix(name: \"__meow\") {\n    name: String\n\
  }\n```\n\n在纯 GraphQL Java 中，我们可以 schema 转换器和类型访问器。\n\n```java\nGraphQLSchema newSchema\
  \ = SchemaTransformer.transformSchema(\n  schema, new GraphQLVisitorStub() {\n \
  \ @Override\n  public TraversalControl visitFieldDefinition(\n    GraphQLFieldDefinition\
  \ fieldDefinition,\n    TraverserContext<GraphQLSchemaElement> context\n  ) {\n\
  \    GraphQLSchemaElement parentNode = context.getParentNode();\n    if (!(parentNode\
  \ instanceof GraphQLObjectType)) {\n      return TraversalControl.CONTINUE;\n  \
  \  }\n    GraphQLObjectType objectType = (GraphQLObjectType) parentNode;\n    GraphQLAppliedDirective\
  \ directive = objectType\n      .getAppliedDirective(\"suffix\");\n    if (directive\
  \ != null) {\n      String suffix = directive.getArgument(\"name\").getValue();\n\
  \      GraphQLFieldDefinition newFieldDefinition\n        = fieldDefinition.transform(builder\n\
  \          -> builder.name(fieldDefinition.getName() + suffix));\n      return changeNode(context,\
  \ newFieldDefinition);\n    }\n    return TraversalControl.CONTINUE;\n  }\n});\n\
  ```\n\n我们正在使用 `SchemaTransformer` 类在遍历 schema 时更改它。`SchemaTransformer` 利用了与上一个示例中使用的\
  \ `SchemaTraverser` 相同的 `GraphQLTypeVisitor`。\n\n要在 Spring for GraphQL 中使用相同的 schema\
  \ 转换示例，请通过 `GraphQlSource.Builder` 配合 `builder.schemaResources(..).typeVisitorsToTransformSchema(..)`\
  \ 注册 `graphql.schema.GraphQLTypeVisitor`。\n\n\n\n\n\n需要注意的是：如你从代码示例所示，转换 schema\
  \ 并非易事。请不要在 schema 转换过程中无意中创建无效 schema。要查看更复杂的示例，请参考 GraphQL Java 中的 `graphql.util.Anonymizer`。这是一个工具，帮助\
  \ GraphQL Java 的用户对其 schema 进行匿名化，以便在报告问题或向维护团队提出改进时提供真实的示例。\n\n## 实现操作指令的逻辑\n\n\
  操作指令（Operation directives）用于 GraphQL 操作。请注意，这个概念通常也被称为“查询”（query）指令，尽管这种类型的指令可以使用于三种操作：查询（queries）、变变（mutations）和订阅（subscriptions）。\n\
  \n让我们来实现一个 `@cache` 操作指令的逻辑：\n\n```\ndirective @cache(maxAge: Int) on FIELD\n```\n\
  \n这是一个操作指令，允许客户端指定缓存条目的时效性。这是一个可以改变执行行为的操作指令示例。\n\n例如，客户端指定 `hello` 缓存条目的不能超过 500\
  \ ms，否则我们将重新获取这些条目。\n\n```graphql\nquery caching {\n    hello @cache(maxAge: 500)\n\
  }\n```\n\n在 GraphQL Java 中，操作指令的定义表示为 `GraphQLDirective`s。操作指令的使用表示为 `QueryAppliedDirective`s。注意，这里的“query”一词具有误导性，因为它实际上指的是适用于任何三种\
  \ GraphQL 操作（查询、变变或订阅）的指令。操作指令仍然通常地被称为“query”指令，因此有了该类名。\n\n为了解释操作指令的定义和用法在代码中是如何表示的，我们将通过使用纯\
  \ GraphQL Java 的示例代码进行演示。然后，我们将通过 Spring for GraphQL 中 `@cache` 的实现来结束本节。\n\n在纯\
  \ GraphQL Java 中，我们可以通过 `GraphQLSchema` 实例（在本例中称为 `schema`）访问 schema 中操作指令的定义。我们可以访问操作指令的名称、参数、位置以及它是否可重复。\n\
  \n```java\nGraphQLSchema schema = ...;\nGraphQLDirective cacheDirective = schema.getDirective(\"\
  cache\");\nString name = cacheDirective.getName();\nList<GraphQLArgument> arguments\
  \ = cacheDirective.getArguments();\nboolean repeatable = cacheDirective.isRepeatable();\n\
  EnumSet<Introspection.DirectiveLocation> directiveLocations \n        = cacheDirective.validLocations();\n\
  ```\n\n操作指令的使用在 GraphQL Java 中表示为 `QueryAppliedDirective` 实例，而提供的参数值表示为 `QueryAppliedDirectiveArgument`。\n\
  \n我们可以在执行期间通过 `DataFetchingEnvironment` 中的 `getQueryDirectives()` 访问操作指令的使用。例如：\n\
  \n```java\npackage myservice.service;\n\nimport graphql.execution.directives.QueryAppliedDirective;\n\
  import graphql.execution.directives\n  .QueryAppliedDirectiveArgument;\nimport graphql.execution.directives.QueryDirectives;\n\
  import graphql.schema.DataFetchingEnvironment;\nimport org.springframework.graphql.data.method.annotation\n\
  \  .QueryMapping;\nimport org.springframework.stereotype.Controller;\n\nimport java.util.List;\n\
  \n@Controller\nclass GreetingController {\n  \n  @QueryMapping\n  String hello(DataFetchingEnvironment\
  \ env) {\n    QueryDirectives queryDirectives = env.getQueryDirectives();\n    List<QueryAppliedDirective>\
  \ cacheDirectives = queryDirectives\n      .getImmediateAppliedDirective(\"cache\"\
  );\n    // 我们获取的是列表，因为我们可能有\n    // 可重复的指令\n    if (cacheDirectives.size() > 0)\
  \ {\n      QueryAppliedDirective cache = cacheDirectives.get(0);\n      QueryAppliedDirectiveArgument\
  \ maxAgeArgument\n        = cache.getArgument(\"maxAge\");\n      int maxAge = maxAgeArgument.getValue();\n\
  \n      // 现在我们知道了最大允许的缓存时间\n      // 并可以利用它\n      // 在此处编写你的逻辑\n    }\n  }\n}\n\
  ```\n\n在本章中，我们涵盖了指令，这是一个强大的 GraphQL 功能，允许我们更改运行时的执行和验证。我们涵盖了内置指令以及如何编写自定义指令。\n\n\
  # 执行\n\n执行由 GraphQL 引擎处理。在这一高级章节中，我们将深入了解 GraphQL 是如何执行的。\n\n## 初始化执行对象\n\n在执行任何\
  \ GraphQL 请求之前，Spring for GraphQL 必须理解 schema。为了实现这一点，Spring for GraphQL 初始化一个 `GraphQL`\
  \ 实例，该实例包含了 schema 和执行策略。\n\n作为 `GraphQL` 初始化过程的一部分，Spring for GraphQL 会加载 schema\
  \ 文件、暴露相关属性、检测 `RuntimeConfigurer` bean 等。通常，对于所有请求只会初始化一个 `GraphQL` 实例。\n\n当 Spring\
  \ for GraphQL 初始化 `GraphQL` 的时候，如果你有任何想要更改的内容，可以通过 `GraphQlSource` [契约](https://docs.spring.io/spring-graphql/docs/current/reference/html#execution.source)\
  \ 进行访问和修改。例如，要添加自定义的执行 ID，创建一个 `GraphQlSourceCustomizer` bean：\n\n```java\npackage\
  \ myservice.service;\n\nimport org.springframework.boot.autoconfigure.graphql\n\
  \  .GraphQlSourceCustomizer;\nimport org.springframework.context.annotation.Bean;\n\
  import org.springframework.context.annotation.Configuration;\n\n@Configuration\n\
  class GraphQlConfig {\n    @Bean\n    GraphQlSourceCustomizer sourceBuilderCustomizer()\
  \ {\n        return (builder) ->\n            builder.configureGraphQl(graphQlBuilder\
  \ ->\n                // 在这里可以使用 GraphQL.Builder\n                // 例如，executionIdProvider\n\
  \                graphQlBuilder\n                    .executionIdProvider(new MyExecutionIdProvider()));\n\
  \    }\n}\n```\n\n注意，自定义 `GraphQlSource` 是完全可选的。Spring for GraphQL 已经初始化了足够的内容以便在无需额外自定义配置的情况下启动请求。\n\
  \n如果你在使用没有 Spring for GraphQL 的 GraphQL Java，这就是手动初始化 `graphql.GraphQL` 对象的方法。\n\
  \n\n\n\n\n```\nString sdl = \"type Query { foo: String }\"; // Your schema here\n\
  TypeDefinitionRegistry parsedSdl = new SchemaParser().parse(sdl);\nDataFetcher<String>\
  \ foo = (env) -> \"foo\";\nTypeRuntimeWiring queryWiring = newTypeWiring(\"Query\"\
  )\n  .dataFetcher(\"foo\", foo)\n  .build();\nRuntimeWiring runtimeWiring = newRuntimeWiring()\n\
  \  .type(queryWiring)\n  .build();\n\nGraphQLSchema schema = new SchemaGenerator()\n\
  \  .makeExecutableSchema(parsedSdl, runtimeWiring);\nGraphQL graphQL = GraphQL.newGraphQL(schema).build();\n\
  ```\n\n## Spring for GraphQL 如何启动执行\n\n在请求与响应章节中，我们讨论了 Spring for GraphQL 如何处理 HTTP\
  \ 上的请求和响应。在本章中，我们将关注接收请求后的执行步骤。这些执行步骤发生在 GraphQL Java 引擎内部。\n\n回想一下请求与响应章节，Spring\
  \ for GraphQL 会自动处理 HTTP 协议。GraphQL 请求是一个编码为 `application/json` 的 HTTP POST 请求。\n\
  \n对于每个收到的 HTTP 请求，Spring for GraphQL 会自动创建一个 GraphQL Java 的 `ExecutionInput` 实例。回想一下请求与响应章节，`ExecutionInput`\
  \ 是代表 GraphQL 请求的 GraphQL Java 对象，不包含传输层的问题。在 Spring for GraphQL 内部，这一过程发生在 `DefaultExecutionGraphQlService`\
  \ 中。可以使用自定义的 `ExecutionGraphQlService` 实现来替换它。\n\n随后，控制权将交给 GraphQL Java，它会执行由 `ExecutionInput`\
  \ 实例表示的 GraphQL 请求。执行完成后，将返回一个包含响应数据和/或错误的 `ExecutionResult` 实例。GraphQL Java 引擎在\
  \ `ExecutionInput` 和 `ExecutionResult` 之间发生的情况是本章剩余部分的重点。\n\n如果你在没有 Spring for GraphQL\
  \ 的情况下使用 GraphQL Java，这是手动创建 `ExecutionInput` 并执行请求的方法：\n\n```\nGraphQL graphQL\
  \ = GraphQL.newGraphQL(schema).build();\n\nExecutionInput request = ExecutionInput.newExecutionInput()\n\
  \  .query(\"query test {foo}\")\n  .build();\n\nExecutionResult result = graphQL.execute(request);\n\
  ```\n\n## 执行步骤\n\n在 GraphQL Java 中，执行包括以下步骤：\n\n1. 从请求中解析“query”（文档）值为 GraphQL 文档\n\
  2. 验证文档\n3. 强制转换变量（coercing variables）\n4. 获取数据\n\n这些是在 GraphQL Java 引擎接收到 `ExecutionInput`\
  \ 请求到返回带有数据和/或错误的 `ExecutionResult` 实例之间所经历的步骤。\n\n### 解析与验证\n\n回想一下请求与响应章节，GraphQL\
  \ 请求中的“query”实际上是一个 GraphQL 文档，它可能包含一个或多个操作。此“query”值被插入到 GraphQL Java 的 `ExecutionInput`\
  \ 实例中，该实例代表一个 GraphQL 请求。\n\n第一步是从 `ExecutionInput` 中解析“query”（文档）值并对其进行验证。如果文档包含无效语法，解析将立即失败。否则，如果文档在语法上是有效的，则将根据\
  \ schema 进行验证。\n\n### 强制转换变量\n\n请参查询语言章节以了解 GraphQL 变量的概述，并在请求与响应章节中查看变量如何在 HTTP\
  \ 请求中发送。\n\n如果请求包含变量，则需要对它们进行“强制转换”。`coercing` 过程将请求中提供的变量值转换为内部表示，并验证变量。例如：\n\n\
  ```\nquery myQuery($name: String) {\n    echo(value: $name)\n}\n```\n\n此查询包含一个类型为\
  \ `String` 的变量 `$name`。如果请求现在包含以下变量，变量强制转换将失败，因为我们预期 `name` 是单个 `String`，而不是 `String`\
  \ 列表。\n\n```\n{\n  \"name\": [\"Luna\", \"Skipper\"]\n}\n```\n\n### 获取数据\n\n最后一步是执行的核心：GraphQL\
  \ Java 获取满足请求所需的数据。\n\n正如 DataFetchers 章节详细描述的，GraphQL Java 中的 `DataFetcher` 是一个加载特定特定字段数据的泛型函数。Spring\
  \ for GraphQL 通过 `@SchemaMapping` 控制器注解以及如 `@QueryMapping` 等快捷注解实现了 DataFetchers。\n\
  \nschema 中的每个字段都分配了一个 `DataFetcher`。与 GraphQL 请求中的字段关联的 DataFetchers 将被 GraphQL\
  \ Java 调用以获取数据。\n\n即使在生成了 `PropertyDataFetchers` 后，字段也可能意外地未映射到任何 `DataFetcher`。这可能是由于忘记了\
  \ `@SchemaMapping` 注解或缺少 Java 属性。遗忘的 `DataFetcher` 将被视为返回 `null` 结果的 `DataFetcher`。由于你通常不想忘记任何\
  \ DataFetcher，即将到来的 [Spring for GraphQL 1.2 版本](https://spring.io/blog/2023/03/21/spring-for-graphql-1-2-0-m1-released)\
  \ 将启动时添加 schema 映射检查。\n\n让我们更仔细地观察示例 schema 和查询，这将有助于我们理解整体执行算法。\n\n```\ntype Query\
  \ {\n    dogs: [Dog]\n}\n\ntype Dog {\n    name: String\n    owner: Person\n   \
  \ friends: [Dog]\n    details: DogDetails\n}\n\ntype Person {\n    firstName: String\n\
  \    lastName: String\n}\n\ntype DogDetails {\n    barking: Boolean\n    shedding:\
  \ Boolean\n}\n```\n\n```\nquery myDogs {\n    dogs {\n        name\n        owner\
  \ {\n            firstName\n            lastName\n        }\n        friends {\n\
  \            name\n        }\n        details {\n            barking\n         \
  \   shedding\n        }\n    }\n}\n```\n\nGraphQL Java 将每个 GraphQL 操作解释为字段树。每个字段都有一个关联的\
  \ DataFetcher。因此，将操作描述为 DataFetcher 闭包（匿名函数）也是同样有效的。\n\n![字段树](img/file15.png)\n\
  \n字段树\n\n如“字段树”图所示，此查询有三层，`dogs` 是唯一的根字段。GraphQL Java 广度优先遍历查询，并在访问每个字段时调用相应的 DataFetcher。一旦字段的\
  \ DataFetcher 成功返回数据，我们就会调用其每个子元素的 DataFetcher。因此，第一个调用的 DataFetcher 是 `/dogs`，随后是\
  \ `/dogs/name`、`/dogs/owner`、`/dogs/friends` 和 `/dogs/details`。\n\n一个关键细节是，如果可能，GraphQL\
  \ Java 会并行获取字段的子字段。\n\n\n\n\n总结来说，执行过程是对字段的广度遍历，当每个字段的 `DataFetcher` 完成时，该字段完成完成。在可能，我们会并行执行字段的子。\n\
  \n## 响应式并发无关\n\nGraphQL Java 是响应式并发无关的。这意味着 GraphQL Java 并不规定特定的线程数量，也没有规定在执行过程中何时使用它们。这是通过利用\
  \ `java.util.concurrent.CompletableFuture` 实现的。每个 `DataFetcher` 都可以返回一个 `CompletableFuture`，如果没有，GraphQL\
  \ Java 会将返回的值封装成 `CompletableFuture`。\n\n这使得 GraphQL Java 能够同时调用字段的所有子 `DataFetchers`，类似于下所示：\n\
  \n```java\n// 所有操作都发生在同一个线程中。\n// GraphQL Java 不创建新线程\n// 不使用线程池。\nList<CompletableFuture>\
  \ dataFetchersCFs = new ArrayList<CompletableFuture>();\nfor (DataFetcher df: childrenDFs)\
  \ {\n  Object cf = df.get(env);\n  // 包装非 CF 类型\n  if (!(cf instanceof CompletableFuture))\
  \ {\n    cf = CompletableFuture.completedFuture(cf);\n  }\n  dataFetchersCFs.add((CompletableFuture)\
  \ cf);\n}\n```\n\n一个关键问题是，DataFetcher 在当前线程中执行了多少工作？如果当前线程没有执行工作或只做了极少量的工作，那么 GraphQL\
  \ Java 本身就能以最高效率运行。如果 `DataFetcher` 使用了当前线程（通过计算或等待某些 I/O 返回），就会阻塞 GraphQL Java\
  \ 本身，导致其无法调用另一个 `DataFetcher`。\n\n这里有几个 `DataFetcher` 示例来说说明。注意，在 Spring for GraphQL\
  \ 中，通过标记了 `@SchemaMapping` 的控制器方法来实现这些 `DataFetchers` 是等效的。\n\n```java\n// 在当前线程中进行密集计算工作\n\
  DataFetcher<String> df = (env) -> {\n  String str = intensiveComputeString();\n\
  \  return str;\n};\n\n// 仍然在当前线程中执行实际工作\nDataFetcher<CompletableFuture<String>>\
  \ df = (env) -> {\n  String str = intensiveComputeString();\n  return CompletableFuture.completedFuture(str);\n\
  };\n\n// 阻塞 I/O 调用\nDataFetcher<String> df = (env) -> {\n  String str = makeHttpCallAndWaitForIt();\n\
  \  return str;\n};\n\n// 在当前线程中快速计算工作\nDataFetcher<String> df = (env) -> {\n  return\
  \ \"Hello\";\n};\n\n// 卸载到另一个线程的计算工作\nDataFetcher<CompletableFuture<String>> df\
  \ = (env) -> {\n  Executor threadPool = ...;\n  return CompletableFuture.supplyAsync(\
  \ () -> {\n    String str = intensiveComputeString();\n    return str;\n  },threadPool);\n\
  };\n\n// 将阻塞 I/O 调用卸载到另一个线程\nDataFetcher<CompletableFuture<String>> df = (env) ->\
  \ {\n  Executor threadPool = ...;\n  return CompletableFuture.supplyAsync( () ->\
  \ {\n    String str = makeHttpCallAndWaitForIt();\n    return str;\n  },threadPool);\n\
  };\n\n// 使用响应式 API 进行 HTTP 调用\nDataFetcher<CompletableFuture<String>> df = (env)\
  \ -> {\n  return makeReactiveHttpCall();\n};\n```\n\n为了达到最高效率，我们建议 `DataFetcher`\
  \ 永远不要占用它被调用的线程。Spring for GraphQL 也允许 `DataFetchers` 返回 `CompletableFuture` 之外的值。\n\
  \n## 完成字段\n\n在 `DataFetcher` 为字段返回一个值后，GraphQL Java 需要对其进行处理。这一阶段被称为“完成字段”（completing\
  \ a field）。\n\n如果值为 `null`，则完成操作不执行操作。\n\n如果字段类型为 `list`，我们根据列表的泛型类型完成列表内部的所有元素。\n\
  \n对于标量（scalars）和枚举，值会进行“强制转换”（coerced）。强制转换有两个目的：第一是确保值有效，第二是将值转换为内部表示。每个 `GraphQLType`\
  \ 都引用一个 `graphql.schema.Coercing` 实例。对于枚举，会调用 `EnumType.serialize` 方法。例如，内置标量 `Int`\
  \ 只接受 `Number` 值。这意味着如果我们为类型为 `Int` 的字段编写了 `DataFetcher` 但它返回了 `Boolean`，就会导致错误。\n\
  \n```graphql\nQuery {\n  someInt: Int\n}\n```\n\n```java\nDataFetcher df = (env)\
  \ -> {\n  return true; // 将导致错误\n};\n```\n\n### TypeResolver\n\n如果字段类型是接口（interface）或联合类型（union），GraphQL\
  \ Java 需要通过 `TypeResolver` 确定值的实际对象类型。参见 DataFetchers 章节关于 `TypeResolver` 的介绍以及如何在\
  \ Spring for GraphQL 和 GraphQL Java 中使用它们。本节侧重于 `TypeResolver` 的执行。\n\n在我们的架构中，有一个\
  \ `Pet` 接口：\n\n```graphql\nQuery {\n  pet: Pet\n}\n\ninterface Pet {\n  name: String\n\
  }\n\ntype Dog implements Pet {\n  name: String\n  barks: Boolean\n}\n\ntype Cat\
  \ implements Pet {\n  name: String\n  meows: Boolean\n}\n```\n\n在 `TypeResolver`\
  \ 返回值的类型后，该信息将用于确定需要获取的字段的实际子选择（sub-selection）。\n\n一个示例查询可能如下：\n\n```graphql\nquery\
  \ myPet {\n  pet {\n    ...on Dog {\n      barks\n    }\n    ...on Cat {\n     \
  \ meows\n    }\n  }\n}\n```\n\n在这里，`pet` 的子选择为 `{ ...on Dog { barks } ...on Cat\
  \ { meows } }`。如果 `DataFetcher` 返回的值是 `Dog`，我们需要获取 `barks` 字段；如果是 `Cat`，我们需要获取 `meows`。\n\
  \n然后，子选择中所有字段的 `DataFetcher` 将被调用，如前述章节所示。这是一个递归步骤，随后再次导致每个字段的完成。\n\n## Query 与\
  \ mutation\n\nQuery（查询）和 mutation（变更）的执行方式几乎相同。唯一的区别是规范要求在一个操作中的多个变更必须串行执行。\n\n\
  例如：\n\n```graphql\nmutation modifyUsers {\n  deleteUser(...) { ... }\n  addOrder(...)\
  \ { ... }\n  changeUser(...) { ... }\n}\n```\n\n对比\n\n```graphql\nquery getUsersAndOrders\
  \ {\n  searchUsers(...) { ... }\n  userById(...) { ... }\n  allOrders { ... }\n\
  }\n```\n\n变更的 `DataFetcher` 是串行调用的。变更字段 `addOrder` 的 `DataFetcher` 在 `deleteUser`\
  \ 完成后才被调用。同样，`changeUser` 的 `DataFetcher` 在 `addOrder` 完成后才被调用。对比查询的行为，在查询中我们并行调用所有三个字段（`searchUsers`、`userById`\
  \ 和 `allOrders`）的 DataFetchers。\n\n\n\n\n\n这是查询（queries）和变异（mutations）在执行上的唯一区别。我们将变异实现为\
  \ `DataFetcher`，但在使用 GraphQL Java 时有一条规则需要遵循：变异 `DataFetcher` 可能会有副作用，而查询则不能，尽管\
  \ GraphQL Java 并没有强制执行这一点。\n\n在这一高级章节中，我们深入研究了 GraphQL Java 引擎内部的执行机制。我们还讨论了 Spring\
  \ for GraphQL 如何初始化执行对象，以及它在接收到请求后如何在 GraphQL Java 中启动执行。\n\n# Instrumentation（探测）\n\
  \nInstrumentation 是一种钩入 GraphQL Java 的通用机制。你可以注入代码来观察查询的执行情况并更改运行时行为。Instrumentation\
  \ 对于性能监控和自定义日志特别有用。\n\n## Spring for GraphQL 中的 Instrumentation\n\nSpring Boot starter\
  \ 会自动检测 `Instrumentation` ，并作为 `graphql.GraphQL` 初始化过程的一部分。`graphql.GraphQL` 是一个关键的\
  \ GraphQL Java 类，包含了执行请求所需的必要信息。\n\n让我们添加第一个探测器 `MaxQueryDepth`。该探测器会检测操作深度何时超过指定的数字并提前终止执行。你可能想要添加此探测器以对操作深度实施硬性限制，作为限制资源消耗的一种手段。\n\
  \n例如，想象一个查询请求朋友的名字，继而请求他们朋友的名字，以此此类推。这种查询的巨大深度可能会导致服务消耗大量资源来完成请求。\n\n```graphql\n\
  query veryDeep {\n    hero {\n        name\n        friends {\n            name\n\
  \            friends {\n                name\n                friends {\n      \
  \              name\n                    # 等此类推！\n                }\n          \
  \  }\n        }\n    }\n}\n```\n\n为了方便起见，GraphQL Java 包含了一些内置的 Instrumentation，它们将在本章节后面列出。让我们将内置的\
  \ `MaxQueryDepth` 探测器作为 Bean 添加到我们的 Spring for GraphQL 服务中，并将最大深度设置为合适的数字。该探测器将被\
  \ Spring Boot starter 自动检测并注册，无需进一步配置。\n\n```java\npackage myservice.service;\n\n\
  import graphql.analysis.MaxQueryDepthInstrumentation;\nimport org.springframework.context.annotation.Bean;\n\
  import org.springframework.context.annotation.Configuration;\n\n@Configuration\n\
  class MyGraphQLConfiguration {\n    @Bean\n    MaxQueryDepthInstrumentation maxQueryDepthInstrumentation()\
  \ {\n        return new MaxQueryDepthInstrumentation(15);\n    }\n}\n```\n\n当请求的操作深度大于指定值时，执行将提前终止，并在响应中返回以下错误消息。\n\
  \n```json\n{\n  \"errors\": [\n    {\n      \"message\": \"maximum query depth exceeded\
  \ 42 > 15\",\n      \"extensions\": {\n        \"classification\": \"ExecutionAborted\"\
  \n      }\n    }\n  ]\n}\n```\n\n## 编写自定义 Instrumentation\n\n你可以使用 GraphQL Java\
  \ 中 `graphql.execution.Instrumentation` 接口提供的 Instrumentation 钩子编写自定义探测器。每个钩子都是一个独立的方法。可用钩子的列表将在本章节后面给出。\n\
  \n让我们写一个自定义探测器，用来测量执行 GraphQL 请求所花费的时间。这是从 GraphQL 执行开始到请求完成之间的时间。\n\n```java\n\
  package myservice.service;\n\nimport graphql.ExecutionResult;\nimport graphql.execution.instrumentation.InstrumentationContext;\n\
  import graphql.execution.instrumentation.InstrumentationState;\nimport graphql.execution.instrumentation.SimpleInstrumentation;\n\
  import graphql.execution.instrumentation.parameters\n  .InstrumentationExecutionParameters;\n\
  import org.springframework.stereotype.Component;\nimport java.util.concurrent.CompletableFuture;\n\
  import java.util.concurrent.atomic.AtomicLong;\n\n@Component\nclass LogTimeInstrumentation\
  \ extends SimpleInstrumentation {\n  @Override\n  public InstrumentationContext<ExecutionResult>\
  \ beginExecution(\n    InstrumentationExecutionParameters parameters,\n    InstrumentationState\
  \ state) {\n    return new InstrumentationContext<>() {\n      AtomicLong timeStart\
  \ = new AtomicLong();\n\n      @Override\n      public void onDispatched(CompletableFuture<ExecutionResult>\
  \ result) {\n        timeStart.set(System.currentTimeMillis());\n      }\n\n   \
  \   @Override\n      public void onCompleted(ExecutionResult result, Throwable t)\
  \ {\n        System.out.println(\"execution time: \" + (System.currentTimeMillis()\
  \ - timeStart.get()));\n      }\n    };\n  }\n}\n```\n\n让我们梳一下这个探测器。在 `beginExecution`\
  \ 钩子中，我们返回一个带有 `onDispatched` 和 `onCompleted` 方法的 `InstrumentationContext<ExecutionResult>`。它们在执行开始和结束时被调用。我们保存开始时间，并在执行完成后记录差值。\n\
  \nSpring for GraphQL 会自动检测并注册该探测。除了为此探测器添加 `@Component` 注解外，不需要进一步配置。\n\n在编写时，最新的\
  \ Spring for GraphQL 使用的是 GraphQL Java 19.x。在 Spring for GraphQL 1.2 中将使用 GraphQL\
  \ Java 20.x，它引入了改进的 `PerformantInstrumentation` 类。它的设计旨在提高性能并减少对象分配。\n\n如果你使用的是纯\
  \ GraphQL Java，则必须手动将探测传递给 `GraphQL` 构建器。\n\n```java\nGraphQLSchema schema = ...;\n\
  GraphQL graphQL = GraphQL.newGraphQL(schema)\n  .instrumentation(new LogTimeInstrumentation())\n\
  \  .build();\n```\n\n## `InstrumentationContext`\n\n`InstrumentationContext` 是特定步骤结束时会被调用的对象。`InstrumentationContext`\
  \ 由 `beginExecution` 等步骤方法返回。\n\n在 GraphQL Java 中，它被表示为一个简单的接口。\n\n```java\npublic\
  \ interface InstrumentationContext<T> {\n\n    /**\n     * 此方法在探测步骤最初分发时被调用\n  \
  \   *\n     * @param  result 以完成未来形式的步骤结果\n     */\n    void onDispatched(CompletableFuture<T>\
  \ result);\n\n    /**\n     * 此方法在探测步骤完全完成后被调用\n     *\n     * @param  result 步骤的结果（可能为\
  \ null）\n     * @param  t  如果在步骤期间抛出异常，则此异常将不为空\n     */\n    void onCompleted(T\
  \ result, Throwable t);\n}\n```\n\n\n\n\n“dispatching”（调度）和“completion”（完成）的使用反映了\
  \ GraphQL Java 内部基于 `CompleteableFuture` 实现的响应式方式。会先创建一个 `CompleteableFuture`，然后在稍后将其完成。一旦创建了关联的\
  \ `CompleteableFuture`，引擎就会调用 `onDispatched` 方法。当关联的 `CompletableFuture` 完成时，引擎会调用\
  \ `onCompleted` 方法。\n\n`InstrumentationContext` 是一个泛接口，在之前的 `LogTime` 示例中，我们为 `ExecutionResult`\
  \ 返回了一个 `InstrumentationContext`。\n\n## `InstrumentationState`\n\n让我们讨论一下在拦截中如何管理状态。\n\
  \n我们通常只有一个 `graphql.GraphQL` 实例，它在所有请求中被复用。拦截器是为每个 `graphql.GraphQL` 实例注册的。那么我们如何为每个请求维护不同的拦截器状态呢？如何管理需要在多个钩子之间进行协调的复杂拦截器的状态？\n\
  \n状态管理通过 `createState` 方法实现，该方法每个请求调用一次并返回一个 `InstrumentationState`。`InstrumentationState`\
  \ 是一个 Java 接口，代表任何类型的状态。该状态作为参数传递到每个钩子中，并且状态可以在每个请求的多个钩子之间进行追踪。\n\n让我们通过一个更复杂的拦截器来实际操作。`FieldCountInstrumentation`\
  \ 统计一个请求中执行的字段数量。\n\n```java\npackage myservice.service;\n\nimport graphql.ExecutionResult;\n\
  import graphql.execution.instrumentation.InstrumentationContext;\nimport graphql.execution.instrumentation.InstrumentationState;\n\
  import graphql.execution.instrumentation.SimpleInstrumentation;\nimport graphql.execution.instrumentation.parameters\n\
  \  .InstrumentationCreateStateParameters;\nimport graphql.execution.instrumentation.parameters\n\
  \  .InstrumentationExecutionParameters;\nimport graphql.execution.instrumentation.parameters\n\
  \  .InstrumentationFieldParameters;\nimport org.springframework.stereotype.Component;\n\
  \nimport java.util.concurrent.CompletableFuture;\nimport java.util.concurrent.atomic.AtomicInteger;\n\
  \nimport static graphql.execution.instrumentation\n  .SimpleInstrumentationContext.noOp;\n\
  \n@Component\nclass FieldCountInstrumentation\n  extends SimpleInstrumentation {\n\
  \n  static class FieldCountState implements InstrumentationState {\n    AtomicInteger\
  \ counter = new AtomicInteger();\n  }\n\n  @Override\n  public InstrumentationState\
  \ createState(\n    InstrumentationCreateStateParameters parameters) {\n    return\
  \ new FieldCountState();\n  }\n\n  @Override\n  public InstrumentationContext<ExecutionResult>\
  \ beginField(\n    InstrumentationFieldParameters parameters,\n    InstrumentationState\
  \ state) {\n    ((FieldCountState) state).counter.incrementAndGet();\n    return\
  \ noOp();\n  }\n\n  @Override\n  public InstrumentationContext<ExecutionResult>\
  \ beginExecution(\n    InstrumentationExecutionParameters parameters,\n    InstrumentationState\
  \ state) {\n    return new InstrumentationContext<ExecutionResult>() {\n      @Override\n\
  \      public void onDispatched(\n        CompletableFuture<ExecutionResult> result)\
  \ {\n      }\n\n      @Override\n      public void onCompleted(ExecutionResult result,\
  \ Throwable t) {\n        System.out.println(\n          \"finished with \" +\n\
  \            ((FieldCountState) state).counter.get()\n        );\n      }\n    };\n\
  \  }\n}\n```\n\n\n\n\n在本章中，我们将讨论 DataLoader，这是 GraphQL Java 用于对数据请求进行批处理和缓存的库。我们将讨论常见的\
  \ n+1 问题以及如何使用 DataLoader 的批处理功能来解决它。我们还将讨论 DataLoader 的缓存功能如何让数据请求更高效。\n\n我们将演示如何在\
  \ Spring for GraphQL 中使用 DataLoader。然后，我们将详细查看 DataLoader 在 GraphQL Java 中是如何运作的。\n\
  \n## n+1 问题\n\nn+1 问题是指检索对象的相关实体时效率低下，这可能导致严重的性能问题。在为 schema 实现 DataFetchers 时，这是一个常见问题。请注意，这是一个在\
  \ SQL 等其他场景中也会发生的通用问题，并不是 GraphQL Java 或 GraphQL 特有的。\n\n让我们用一个关于人及其 {实朋友的简单示例来解释\
  \ n+1 问题。\n\n```graphql\ntype Query {\n    people: [Person]\n}\n\ntype Person {\n\
  \    name: String\n    bestFriend: Person\n}\n```\n\n查询语句可能如下：\n\n```\nquery importantPeople\
  \ { \n    people { \n        bestFriend { \n            name \n        } \n    }\
  \ \n}\n```\n\n让我们在 Spring for GraphQL 中注册两个 DataFetchers，分别负责加载 `people` 及其它们的 `bestFriend`。\n\
  \n```java\npackage myservice.service;\n\nrecord Person(String name, Integer bestFriendId)\
  \ {}\n```\n\n```java\npackage myservice.service;\n\nimport org.springframework.graphql.data.method.annotation.QueryMapping;\n\
  import org.springframework.graphql.data.method.annotation.SchemaMapping;\nimport\
  \ org.springframework.stereotype.Controller;\n\nimport java.util.List;\n\n@Controller\n\
  record PersonController(PersonService personService) {\n\n  @QueryMapping\n  List<Person>\
  \ people() {\n    return personService.getAllPeople();\n  }\n\n  @SchemaMapping\n\
  \  Person bestFriend(Person person) {\n    return personService.getPersonById(person.bestFriendId());\n\
  \  }\n}\n```\n\n虽然这段代码可以运行，但在大型列表上表现并不良好。对于列表每一个人，我们都会调用加载好朋友的 DataFetcher。对于“n”个人，我们现在有了“n+1”次服务调用：一次用于加载初始人员列表，然后为\
  \ n 个人中的每一个人调用一次来加载他们的好朋友。这就是“n+1 问题”名称的由来。这可能会导致严重的性能问题，因为大型列表需要多次调用来检索数据。\n\n\
  ## 解决 n+1 问题\n\n解决方案不再是为每个人进行一次服务调用，而是一次性加载所有人的好朋友。好朋友的加载是延迟的，因此它们可以一起加载。无论有多少人，这都会将服务调用次数从\
  \ n+1 减少到两次。\n\nn+1 问题非常常见，因此解决方案已内置在 GraphQL Java 中并可以在 Spring for GraphQL 中通过控制器注解\
  \ `@BatchMapping` 访问。解决方案使用了 [java-dataloader](https://github.com/graphql-java/java-dataloader)\
  \ 库，该库由 GraphQL Java 团队维护。该库是 JS 库 [DataLoader](https://github.com/graphql/dataloader)\
  \ 的移植。请注意，在本书我们将 Java 库简称为“DataLoader”，并在讨论 JS DataLoader 时明确说明。\n\n在 Spring for\
  \ GraphQL 中实现这一解决方案只需要很小的更改。\n\n```java\npackage myservice.service;\n\nimport org.springframework.graphql.data.method.annotation.BatchMapping;\n\
  import org.springframework.graphql.data.method.annotation.QueryMapping;\nimport\
  \ org.springframework.stereotype.Controller;\nimport java.util.List;\nimport java.util.stream.Collectors;\n\
  \n@Controller\nrecord PersonController(PersonService personService) {\n\n  @QueryMapping\n\
  \  List<Person> people() {\n    return personService.getAllPeople();\n  }\n\n  @BatchMapping\n\
  \  List<Person> bestFriend(List<Person> people) {\n    List<Integer> ids = people.stream()\n\
  \      .map(Person::bestFriendId)\n      .collect(Collectors.toList());\n    return\
  \ personService.getPeopleByIds(ids);\n  }\n}\n```\n（注：源文件中提供的代码块被元数据严重干扰；我已根据文中提供的上下文对其进行了清理，以反映逻辑上的\
  \ Java 实现）。\n\n## DataLoader 概述\n\nDataLoader 是 GraphQL Java 用于批处理和缓存请求的库。批处理解决了\
  \ n+1 问题，而缓存让数据请求更高效。该库也由 GraphQL Java 团队维护。\n\n有两个关键概念。`DataLoader` 实例在概念上是一个延迟加载实体的层，通过某些键进行标识。分发（dispatch）的时机由\
  \ GraphQL Java 管理。该库被称为“DataLoader”。为了区分这两者，我们用“class”或“instance”来指代它。\n\n有趣的是，DataLoader\
  \ 并不是 GraphQL 特有的，也不是 GraphQL 规范的一部分。为了更好地理解 DataLoader 的工作原理，我们将通过多个示例。由于 DataLoader\
  \ 不是 GraphQL 特有的，让我们从一个不包含任何 GraphQL 概念的简单示例开始。\n\n```java\n// Setup\nUserService\
  \ userService = ...;\n// 预期返回 CompletableFuture\nBatchLoader<Integer, User> userBatchLoader\
  \ = userIds -> \n  userService.loadUsersById(userIds); \n\nDataLoader<Integer, User>\
  \ userLoader = DataLoaderFactory\n  .newDataLoader(userBatchLoader);\n\n// Usage\n\
  CompletableFuture<User> user1CF = userLoader.load(1);\nCompletableFuture<User> user2CF\
  \ = userLoader.load(2);\nuserLoader.dispatchAndJoin();\n\n// 获取加载的用户\nUser user1\
  \ = user1CF.get();\nUser user2 = user2CF.get();\n```\n\n\n\n\n然后我们通过 `DataLoaderFactory`\
  \ 创建一个新的 `DataLoader` 实例，并提供 `BatchLoader`。我们的 `DataLoader` 参数类型为 `Integer` 和 `User`，这表示我们有一个从\
  \ `Integer` 值到 `User` 的映射。`DataLoader` 的核心思想是我们有一个键（在此例中为 `Integer`）映射到一个实体（`User`）。这意味着我们可以根据给定的键加载实体。\n\
  \n到此设置完成，然后我们就可以开始使用 `DataLoader.load` 了。我们会立即返回这两个调用的 `CompletableFuture`，但请注意，此时尚未发生任何实际加载。\n\
  \n接着，我们要批量加载用户。这个分发步骤通过 `DataLoader.dispatchAndJoin()` 触发。这是一种手动通知 `DataLoader`\
  \ 实例是时候开始批量加载的方法。请注意，在随后的示例中，分发点将由 GraphQL Java 管理。\n\n`dispatchAndJoin` 会触发调用 `userBatchLoader`，并将用户\
  \ ID `1` 和 `2` 作为参数。在 `dispatchAndJoin` 返回后，我们已经加载了所有用户并可以访问它们。\n\n默认情况下，`DataLoader`\
  \ 使用一个简单的内存 `java.util.Map` 作为缓存，以防止多个实体被加载两次。因此，另一个 `userLoader.load(1)` 将从此缓存中返回一个\
  \ `User`。\n\n我们通过 `DataLoaderFactory` 创建了 `DataLoader` 实例，这允许通过 `DataLoaderOptions`\
  \ 配置多个选项。例如，我们可以更改缓存实现或完全禁用缓存。\n\n## DataLoader 与 GraphQL Java\n\n让我们结合 GraphQL\
  \ 概念来过一遍 `DataLoader` 示例。我们将使用纯 GraphQL Java 来展示这个示例，以便在没有 Spring 自动化魔力的情况下解释 DataLoader。你不需要编写这些代码，因为\
  \ Spring for GraphQL 的 `@BatchMapping` 控制器注解已经消除了大部分此类模板代码。\n\n继续我们关于人及其最好朋友的示例。这是\
  \ DataLoader 在纯 GraphQL Java 中与 `bestFriend` DataFetcher 协同工作的方式。\n\n```java\nimport\
  \ graphql.ExecutionInput;\nimport graphql.ExecutionResult;\nimport graphql.GraphQL;\n\
  import graphql.schema.DataFetcher;\nimport graphql.schema.GraphQLSchema;\nimport\
  \ graphql.schema.idl.RuntimeWiring;\nimport graphql.schema.idl.SchemaGenerator;\n\
  import graphql.schema.idl.SchemaParser;\nimport graphql.schema.idl.TypeDefinitionRegistry;\n\
  import graphql.schema.idl.TypeRuntimeWiring;\nimport myservice.service.Person;\n\
  import myservice.service.PersonService;\nimport org.dataloader.BatchLoader;\nimport\
  \ org.dataloader.DataLoader;\nimport org.dataloader.DataLoaderFactory;\nimport org.dataloader.DataLoaderRegistry;\n\
  \nimport java.util.List;\nimport java.util.concurrent.CompletableFuture;\n\nimport\
  \ static graphql.ExecutionInput.newExecutionInput;\nimport static graphql.schema.idl.RuntimeWiring.newRuntimeWiring;\n\
  import static graphql.schema.idl.TypeRuntimeWiring.newTypeWiring;\nimport static\
  \ java.util.concurrent.CompletableFuture.completedFuture;\n\npublic class PureGraphQLJava\
  \ {\n\n  public static void main(String[] args) throws Exception {\n    // 设置 schema\n\
  \    String sdl = \"\"\"\n    type Query {\n    people: [Person]\n    } \n    type\
  \ Person {\n      name: String\n      bestFriend: Person\n    }\n    \"\"\";\n \
  \   TypeDefinitionRegistry parsedSdl = new SchemaParser().parse(sdl);\n\n    PersonService\
  \ personService = new PersonService();\n    DataFetcher<List<Person>> people = (env)\
  \ -> personService\n                                                  .getAllPeople();\n\
  \n    // 设置 Person BatchLoader\n    BatchLoader<Integer, Person> personBatchLoader\
  \ = personIds ->\n      completedFuture(personService.getById(personIds));\n\n \
  \   // DataFetcher 实现：选择正确的 DataLoader\n    // 用来加载数据\n    String PERSON_DATA_LOADER\
  \ = \"person\";\n    DataFetcher<CompletableFuture<Person>> bestFriendDF = (env)\
  \ -> {\n      Person person = env.getSource();\n      DataLoader<Integer, Person>\
  \ dataLoader\n        = env.getDataLoader(PERSON_DATA_LOADER);\n      return dataLoader.load(person.bestFriend());\n\
  \    };\n    // 构建可执行 schema\n    TypeRuntimeWiring queryWiring = newTypeWiring(\"\
  Query\")\n      .dataFetcher(\"people\", people)\n      .build();\n    TypeRuntimeWiring\
  \ bestie = newTypeWiring(\"Person\")\n      .dataFetcher(\"bestFriend\", bestFriendDF)\n\
  \      .build();\n    RuntimeWiring runtimeWiring = newRuntimeWiring()\n      .type(queryWiring)\n\
  \      .type(bestie)\n      .build();\n    GraphQLSchema schema = new SchemaGenerator()\n\
  \      .makeExecutableSchema(parsedSdl, runtimeWiring);\n\n    // 每个请求：\n    //\
  \ 创建 DataLoader\n    DataLoader<Integer, Person> personDataLoader = DataLoaderFactory\n\
  \      .newDataLoader(personBatchLoader);\n    // 将 DataLoader 实例注册到 DataLoaderRegistry\n\
  \    DataLoaderRegistry registry = new DataLoaderRegistry();\n    registry.register(PERSON_DATA_LOADER,\
  \ personDataLoader);\n    String query = \"\"\"\n    query everyone {\n      people\
  \ {\n        name\n        bestFriend {\n          name\n        }\n      }\n  \
  \  }\";\n    // 将 DataLoader 实例提供给 ExecutionInput\n    ExecutionInput executionInput\
  \ = newExecutionInput()\n      .query(query)\n      .dataLoaderRegistry(registry)\n\
  \      .build(); \n    // 执行查询\n    GraphQL graphQL = GraphQL.newGraphQL(schema).build();\n\
  \    ExecutionResult executionResult = graphQL.execute(executionInput);\n  }\n}\n\
  ```\n\nPerson `DataLoader` 已经注册到 `bestFriend` DataFetcher 中。\n\n请注意，每个请求需要创建一个新的\
  \ `DataLoader` 实例，因为它存储了关于已分发和缓存的状态，这些状态不应跨请求共享。\n\n由于通常有多个想要使用 `DataLoader` 的实体，因此每个请求可能有多个不同的\
  \ `DataLoader` 实例。这些实例由 `DataLoaderRegistry` 管理，它通过名称标识每个 `DataLoader` 实例。也可以通过\
  \ `DataLoaderRegistry.dispatchAll` 一次分发所有注册的 `DataLoader` 实例。\n\n然后我们创建一个 `ExecutionInput`\
  \ 实例，它代表传入的 GraphQL 请求。关于 `ExecutionInput` 的更多信息请参考 Request 章节。执行查询并返回结果。\n\n强调一下，在这个纯\
  \ GraphQL Java 代码中并没有显式的“分发”（dispatch）操作。这是因为 GraphQL Java 在 `DataLoaderDispatcherInstrumentation`\
  \ 的帮助下知道何时进行分发，该拦截器会自动添加到 `GraphQL` 实例中。\n\n\n\n在 Spring for GraphQL 中，单一的中心 `BatchLoaderRegistry`\
  \ 暴露了工厂方法和构建器，用于创建和注册 `BatchLoader`。Spring Boot starter 声明了一个 `BatchLoaderRegistry`\
  \ bean，它可以被注入到示例中的控制器等组件中。Spring for GraphQL 会将 `DataLoader` 实例注入到 `DataFetcher`\
  \ 中。\n\n```java\npackage myservice.service;\n\nimport org.dataloader.DataLoader;\n\
  import org.springframework.graphql.data.method.annotation.QueryMapping;\nimport\
  \ org.springframework.graphql.data.method.annotation.SchemaMapping;\nimport org.springframework.graphql.execution.BatchLoaderRegistry;\n\
  import org.springframework.stereotype.Controller;\nimport reactor.core.publisher.Flux;\n\
  \nimport java.util.List;\nimport java.util.concurrent.CompletableFuture;\n\n@Controller\n\
  class PersonController {\n\n  PersonService personService;\n\n  PersonController(\n\
  \    PersonService personService,\n    BatchLoaderRegistry batchLoaderRegistry)\
  \ {\n    this.personService = personService;\n\n    // Registering the BatchLoader\
  \ \n    batchLoaderRegistry\n      .forTypePair(Integer.class, Person.class)\n \
  \     .registerBatchLoader(\n        (integers, batchLoaderEnvironment) -> Flux\n\
  \          .fromIterable(personService.getPeopleById(integers)\n          )\n  \
  \    );\n  }\n\n  @QueryMapping\n  List<Person> people() {\n    return personService.getAllPeople();\n\
  \  }\n\n  // Manually using DataLoader instance in DataFetcher\n  @SchemaMapping\n\
  \  CompletableFuture<Person> bestFriend(\n    Person person, DataLoader<Integer,\
  \ Person> dataLoader) {\n    // Using the DataLoader\n    return dataLoader.load(person.bestFriendId());\n\
  \  }\n}\n```\n\n`BatchLoaderRegistry` 是一个从名称到 `BatchLoader` 的映射。Spring for GraphQL\
  \ 会自动选择我们要加载的实体的完整类名作为名称。该名称可以自定义。注意，`BatchLoaderRegistry` 期望 `BatchLoader` 返回一个\
  \ `Flux` 而不是 `CompletableFuture`。\n\n基于自动选择的 `BatchLoader` 名称，我们可以将 `DataLoader<Integer,\
  \ Person> dataLoader` 声明为方法参数，Spring 会根据类型 `<Integer, Person>` 知道要注入哪个 `DataLoader`。\n\
  \n在我们的示例中，`bestFriend` DataFetcher 直接委托给 `DataLoader`。这允许我们像在本章之前看到的那样通过使用 `@BatchMapping`\
  \ 注解进一步减少代码。\n\n```java\npackage myservice.service;\n\nimport org.springframework.graphql.data.method.annotation.BatchMapping;\n\
  import org.springframework.graphql.data.method.annotation.QueryMapping;\nimport\
  \ org.springframework.stereotype.Controller;\n\nimport java.util.List;\nimport java.util.stream.Collectors;\n\
  \n@Controller\nclass PersonController {\n\n  PersonService personService;\n\n  PersonController(PersonService\
  \ personService) {\n    this.personService = personService;\n  }\n\n  @BatchMapping\n\
  \  List<Person> bestFriend(List<Person> people) {\n    List<Integer> ids = people.stream()\n\
  \      .map(Person::bestFriendId)\n      .collect(Collectors.toList());\n    return\
  \ personService.getPeopleById(ids);\n  }\n}\n```\n\n\n\n`DataFetchers` 是实现 Spring\
  \ for GraphQL 服务的核心概念，因为它们是模式（schema）和数据之间的桥。编写 `DataFetchers` 的主要指南是它们应该是非常轻量化的（thin），并将实际工作委托给下层的代码层。`DataFetcher`\
  \ 的唯一目的应该是处理 GraphQL 特有的方面。例如：读取和验证输入、映射返回数据、处理异常并将其转换为错误。\n\n通过有意识地将 `DataFetchers`\
  \ 设计得轻量化，它们也变得更容易编写单元测试。\n\n在第一个 `DataFetchers chapter` 中，我们讨论了 Spring for GraphQL\
  \ 中的 `DataFetchers` 是通过带有 `@SchemaMapping` 注解的控制器方法或如 `@QueryMapping` 等快捷注解注册的。\n\
  \n最初，我们将通过一个简单的 Hello World 示例来探索测试，说明 Spring for GraphQL 的不同测试类型。在本章稍后的部分，我们还将为一个更大的\
  \ Pet 模式编写测试。\n\n这里是我们 Hello World 示例的简单模式：\n\n```graphql\ntype Query {\n    hello:\
  \ String\n}\n```\n\n一个简单的查询：\n\n```graphql\nquery greeting {\n    hello\n}\n```\n\
  \n以及一个通过 `@QueryMapping` 控制器注解注册的简单 `DataFetcher`。\n\n```java\npackage myservice.service;\n\
  \nimport org.springframework.graphql.data.method.annotation.QueryMapping;\nimport\
  \ org.springframework.stereotype.Controller;\n\n@Controller\nclass GreetingController\
  \ {\n\n  @QueryMapping\n  String hello() {\n    return \"Hello, world!\";\n  }\n\
  }\n```\n\n`hello` DataFetcher 是一个可以轻松单元测试的轻量级 DataFetcher 良好示例。\n\n```java\npackage\
  \ myservice.service;\n\nimport org.junit.jupiter.api.Test;\nimport org.junit.jupiter.api.extension.ExtendWith;\n\
  import org.mockito.junit.jupiter.MockitoExtension;\n\nimport static org.assertj.core.api.Assertions.assertThat;\n\
  \n@ExtendWith(MockitoExtension.class)\nclass GreetingControllerTest {\n\n  @Test\n\
  \  void testHelloDataFetcher() {\n    GreetingController greetingController = new\
  \ GreetingController();\n\n    String greeting = greetingController.hello();\n \
  \   // 验证返回的对象是否是预期的\n    assertThat(greeting).isEqualTo(\"Hello, world!\");\n \
  \ }\n}\n```\n\n如果对一个 DataFetcher 进行单元测试变得困难，我们应该尝试将其拆分并编写多个较小的单元测试。\n\n正如我们在 `DataFetchers\
  \ chapter` 中看到的，DataFetcher 的 `get` 方法接收一个输入 `DataFetchingEnvironment`，这是一个 Java\
  \ 接口，包含了获取数据所需的 GraphQL 信息，包括源、模式、文档、上下文、选择集（selection set）等。我们还在 `DataFetchers\
  \ chapter` 中看到，Spring for GraphQL 提供了 `DataFetchingEnvironment` 中特定字段的快捷方式，用作通过控制器注解注册的\
  \ DataFetchers 的输入。在编写 DataFetcher 测试时，我们建议 mock `DataFetchingEnvironment` 并仅实现需要的部分。\n\
  \n## `GraphQlTester`\n\n`GraphQlTester` 是 Spring for GraphQL 中帮助我们进行测试的主要类。`GraphQlTester`\
  \ 是一个包含几个内部接口的 Java 接口，它提供了丰富的 API 来执行请求和验证响应。针对不同类型的测试有许多种实现：\n\n* `HttpGraphQlTester`\
  \ 用于基于 HTTP 的测试，利用了 `WebTestClient`\n* `WebGraphQlTester` 用于测试 `WebGraphQlHandler`\n\
  * `ExecutionGraphQlServiceTester` 用于测试 `ExecutionGraphQlService`\n* `WebSocketGraphQlTester`\
  \ 用于测试 WebSocket 请求\n\n这些不同的类通常只用于创建 `GraphQlTester` 实例。在代码中使用，我们只引用 `GraphQlTester`。\n\
  \n例如，这里是我们的 Hello World 示例的查询：\n\n```graphql\nquery greeting {\n    hello\n}\n```\n\
  \n通过 `GraphQlTester`，我们可以编写测试来验证它：\n\n```java\npackage myservice.service;\n\nimport\
  \ org.junit.jupiter.api.Test;\nimport org.junit.jupiter.api.extension.ExtendWith;\n\
  import org.mockito.junit.jupiter.MockitoExtension;\nimport org.springframework.beans.factory.annotation.Autowired;\n\
  import org.springframework.boot.test.autoconfigure.web.reactive.AutoConfigureTestClient;\n\
  import org.springframework.graphql.test.tester.Http.GraphQlTester;\n\nimport static\
  \ org.assertj.core.api.Assertions.assertThat;\n\n@ExtendWith(MockitoExtension.class)\n\
  @AutoConfigureTestClient\nclass GreetingControllerTest {\n\n  @Autowired\n  GraphQlTester\
  \ graphQlTester;\n\n  @Test\n  void test() {\n    graphQlTester\n      .document(\"\
  query greeting { hello }\")\n      .execute()\n      .path(\"hello\")\n      .entity(String.class)\n\
  \      .isEqualTo(\"Hello, world!\");\n  }\n}\n```\n\n### `GraphQlTester.Request`\
  \ 和 `execute`\n\n`GraphQlTester.document` 返回一个 `GraphQlTester.Request`。\n\n`GraphQlTester.Request`\
  \ 指定了请求的细节（操作名称、变量），然后 `GraphQlTester.Request.execute` 返回一个 `GraphQlTester.Response`。\n\
  \n### `GraphQlTester.Response`, `path`, `entity`, `entityList`\n\n`GraphQlTester.Response`\
  \ 继承了 `Traversable`，这是一个简单的接口：\n\n```java\ninterface Traversable {\n    Path path(String\
  \ path);\n}\n```\n\n我们可以配合 `path` 使用任何 [JsonPath]。在我们的 Hello World 示例中，我们使用了路径 `\"\
  hello\"`。在本章稍后更复杂的 Pets 示例中，我们将看到如何从 Pets 列表中选择名称。\n\n\n\n\n你可以通过提供路径并返回一个 `GraphQlTester.Path`\
  \ 来遍历 GraphQL 响应，它本身再次是一个 `Traversable`。`Path` 有多种不同的方法来断言或转换 GraphQL 响应的当前部分。我们可以将其转换为\
  \ `entity` 或 `entityList` 然后进行进一步断言。\n\n例如，`Pet` 可以被转换为 `entity` 然后进行进一步断言。例如，一个非常基本的喜爱的宠物\
  \ Schema：\n\n```graphql\ntype Query {\n    favoritePet: Pet\n}\n\ntype Pet {\n \
  \   name: String\n}\n```\n\n配合一个简单的 `Pet` 类：\n\n```java\npackage myservice.service;\n\
  \nrecord Pet(String name) {}\n```\n\n以及一个查询数据库的基础型 `DataFetcher`：\n\n```java\npackage\
  \ myservice.service;\n\nimport org.springframework.graphql.data.method.annotation.QueryMapping;\n\
  import org.springframework.stereotype.Controller;\n\n@Controller\nclass PetsController\
  \ {\n\n  @QueryMapping\n  Pet favoritePet() {\n    // 从数据库返回最喜爱的宠物\n  }\n\n}\n```\n\
  \n在 `GraphQlTester` 中，要将 GraphQL 响应的当前部分转换为 `Pet` 实体，请使用 `entity(Pet.class)`，然后在之后测试你的断言：\n\
  \n```java\nPet favoritePet = graphQlTester\n        .document(\"query whoIsAGoodBoyOrGirl\
  \ { favoritePet { name } }\")\n        .execute()\n        .path(\"favoritePet\"\
  )\n        .entity(Pet.class)\n        .get()\n        // 在此处编写你的断言\n```\n\n请参阅本章节后面更复杂的\
  \ Pets 示例，了解在返回 `Pets` 列表时如何使用 `entityList`。\n\n### `errors`\n\n默认情况下，响应中的 GraphQL\
  \ 错误不会导致测试失败，因为 GraphQL 中的部分响应仍然是一个有效的答案。请参考 Schema 设计章节，了解为什么部分响应和可空字段是有价值的。\n\n\
  然而，在测试中，你通常想检查没有返回任何错误。要验证测试中没有返回错误，请添加 `.errors().verify()`。\n\n```java\ngraphQlTester\n\
  \  .document(\"query greeting { hello }\")\n  .execute()\n  .errors()\n  .verify()\
  \ // 确保没有 GraphQL 错误\n  .path(\"hello\")\n  .entity(String.class)\n  .isEqualTo(\"\
  Hello, world!\");\n```\n\n为了过滤掉特定错误，我们可以使用 `errors().filter(error -> ...).verify()`\
  \ 来从测试中排除错误。要验证是否存在某个错误，可以使用 `.errors().expect(error -> ...).verify()`。\n\n## 测试不同的层\n\
  \n正如本书开的 Spring for GraphQL 概述 所示，Spring for GraphQL 有三个关键类：`GraphQlHttpHandler`、`WebGraphQlHandler`\
  \ 和 `ExecutionGraphQlService`。我们还可以测试 HTTP 传输层。\n\n回顾一下，请求会通过 Spring for GraphQL\
  \ 中的三个主要类，每个类都有不同的职责，如图“Spring for GraphQL classes”所示：\n\n1. 通用型 HTTP 请求调用 `GraphQlHttpHandler`\
  \ 将请求转换为 `WebGraphQlRequest`。\n2. `WebGraphQlHandler` 接收 `WebGraphQlRequest` 并调用\
  \ `ExecutionGraphQlService` 来执行请求。\n3. `ExecutionGraphQlService` 最终调用 GraphQL Java。\n\
  \n![Spring for GraphQL classes](img/file8.png)\n\nSpring for GraphQL classes\n\n\
  我们可以测试这些不同的层：\n\n* 跨 HTTP 的端到端：创建一个完全独立的进程并通过 HTTP 进行测试\n* 应用测试：在同一进程中进行测试，不包含完整的\
  \ HTTP 层，包含一个客户端\n* 服务端测试（不带客户端）：从 `WebGraphQlHandler` 开始\n* 服务端测试（不带客户端）：从 `ExecutionGraphQlService`\
  \ 开始\n\n注意，接下来的几节重点关注包含传输的 HTTP 测试。对于 WebSocket 测试，请参阅本章节后半部分的订阅测试部分。\n\n### 跨 HTTP\
  \ 的端到端\n\nSpring Boot 允许我们使用 `@SpringBootTest` 注解启动整个服务并通过 HTTP 进行端到端测试。如本章早些提到的，我们有\
  \ `SpringBootTest` 和 `HttpGraphQlTester` 来测试 GraphQL API。\n\n```java\npackage myservice.service;\n\
  \nimport org.junit.jupiter.api.Test;\nimport org.springframework.beans.factory.Autowired;\n\
  import org.springframework.boot.test.context.SpringBootTest;\nimport org.springframework.graphql.test.tester.GraphQlTester;\n\
  \n@SpringBootTest(webEnvironment = SpringBootTest.WebEnvironment.RANDOM_PORT)\n\
  class E2ETest {\n\n  @Autowired\n  GraphQlTester graphQlTester;\n\n  @Test\n  void\
  \ testHello() {\n    String document = \"query {}\";\n    graphQlTester.document(document)\n\
  \      .execute()\n      .path(\"hello\")\n      .entity(String.class)\n      .isEqualTo(\"\
  Hello, world!\");\n  }\n}\n```\n\n### 应用测试\n\n为了在没有 HTTP 层的情况下测试整个服务，我们可以在同一个 Java\
  \ 虚拟机 (JVM) 中启动整个应用程序。使用 `@AutoConfigureGraphQlTester` 注解来自动配置 `GraphQlTester`。\n\
  \n```java\npackage myservice.service;\n\nimport org.junit.jupiter.api.Test;\nimport\
  \ org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.boot.test.context.SpringBootTest;\n\
  import org.springframework.boot.test.autoconfigure.graphql.tester.AutoConfigureGraphQlTester;\n\
  import org.springframework.graphql.test.tester.GraphQlTester;\n\n@SpringBootTest(webEnvironment\
  \ = SpringBootTest.WebEnvironment.MOCK)\n@AutoConfigureGraphQlTester\nclass MockTest\
  \ {\n\n  @Autowired\n  GraphQlTester graphQlTester;\n\n  @Test\n  void testHello()\
  \ {\n    String document = \"query {}\";\n    graphQlTester.document(document)\n\
  \      .execute()\n      .path(\"hello\")\n      .entity(String.class)\n      .isEqualTo(\"\
  Hello, world!\");\n  }\n}\n```\n\n此测试仅验证应用程序 内部 JVM 内部的请求。它与之前的端到端测试不同，因为此测试中的请求没有通过\
  \ HTTP 传输层。\n\n\n\n\n\n```java\npackage myservice.service;\n\nimport org.junit.jupiter.api.Test;\n\
  import org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.boot.test.context.SpringBootTest;\n\
  import org.springframework.graphql.server.WebGraphQlHandler;\nimport org.springframework.graphql.test.tester.WebGraphQlTester;\n\
  \n@SpringBootTest(webEnvironment = SpringBootTest.WebEnvironment.MOCK)\nclass WebGraphQlTest\
  \ {\n\n  @Autowired\n  WebGraphQlHandler webGraphQlHandler;\n\n  @Test\n  void testHello()\
  \ {\n    WebGraphQlTester webGraphQlTester \n            = WebGraphQlTester.create(webGraphQlHandler);\n\
  \    String document = \"query greeting { hello }\";\n    webGraphQlTester.document(document)\n\
  \      .execute()\n      .path(\"hello\")\n      .entity(String.class)\n      .isEqualTo(\"\
  Hello, world!\");\n  }\n}\n```\n\n## `ExecutionGraphQlService` 测试\n\n`ExecutionGraphQlServiceTester`\
  \ 允许对 `ExecutionGraphQlService` 进行直接测试。通过提供相关的 `ExecutionGraphQlService` 来创建一个新的测试实例。\n\
  \n```java\npackage myservice.service;\n\nimport org.junit.jupiter.api.Test;\nimport\
  \ org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.boot.test.context.SpringBootTest;\n\
  import org.springframework.graphql.ExecutionGraphQlService;\nimport org.springframework.graphql.test.tester.ExecutionGraphQlServiceTester;\n\
  \n@SpringBootTest(webEnvironment = SpringBootTest.WebEnvironment.MOCK)\nclass GraphQlServiceTest\
  \ {\n\n  @Autowired\n  ExecutionGraphQlService graphQlService;\n\n  @Test\n  void\
  \ testHello() {\n    ExecutionGraphQlServiceTester graphQlServiceTester \n     \
  \       = ExecutionGraphQlServiceTester.create(graphQlService);\n    String document\
  \ = \"query greeting { hello }\";\n    graphQlServiceTester.document(document)\n\
  \      .execute()\n      .path(\"hello\")\n      .entity(String.class)\n      .isEqualTo(\"\
  Hello, world!\");\n  }\n}\n```\n\n## 使用 `@GraphQlTest` 进行聚焦的 GraphQL 测试\n\n为了获得更精的测试设置，我们可以使用\
  \ `@GraphQlTest` 注解代替 `@SpringBootTest`。`@GraphQlTest` 配置了一个切片测试（slice test），它只会加载应用程序的子集，仅关注\
  \ GraphQL 层。它是一个 `ExecutionGraphQlServiceTester`，增加的特性是：仅自动加载执行请求严格所需的内容，而不包含任何其他内容。\n\
  \n让我们通过一个 Pet 服务来检查 `@GraphQlTest`。该 Schema 如下：\n\n```graphql\ntype Query {\n  \
  \  pets: [Pet]\n}\n\ntype Pet {\n    name: String\n}\n```\n\n我们想要测试的查询是：\n\n```graphql\n\
  query myPets {\n    pets { \n        name \n    } \n}\n```\n\n这是 Pet 控制器，它包含一个静态的\
  \ `Pet` 类以及标记了 `@QueryMapping` 注解的 `pets` DataFetcher：\n\n```java\npackage myservice.service;\n\
  \nimport org.springframework.graphql.data.method.annotation.QueryMapping;\nimport\
  \ org.springframework.stereotype.Controller;\nimport java.util.List;\n\n@Controller\n\
  record PetsController(PetService petService) {\n  @QueryMapping\n  List<Pet> pets()\
  \ {\n    return petService.getPets();\n  }\n}\n```\n\n控制器使用 `Pet` 服务，该服务从数据源获取 `Pets`\
  \ 列表，数据源可以是数据库或任何地方。\n\n```java\npackage myservice.service;\n\nimport org.springframework.stereotype.Service;\n\
  \nclass PetService {\n  List<Pet> getPets() {\n    // 从数据库或其他地方获取数据\n  }\n}\n```\n\
  \n在这个示例中，我们的 `pets` DataFetcher 非常薄，它只负责委托给 `PetService`。这非常符合实际情况，通常我们追求这种这种设计。\n\
  \n现在使用 `@GraphQlTest`，我们的测试设置包含了 `PetController`，但没有包含 `PetService`，因为它不属于 GraphQL\
  \ 层。这意味着我们需要为 `PetService` 创建一个 mock（模拟）。\n\n```java\npackage myservice.service;\n\
  \nimport org.junit.jupiter.api.Test;\nimport org.mockito.Mockito;\nimport org.springframework.beans.factory.annotation.Autowired;\n\
  import org.springframework.boot.test.autoconfigure.graphql.GraphQlTest;\nimport\
  \ org.springframework.boot.test.mock.mockito.MockBean;\nimport org.springframework.graphql.test.tester.GraphQlTester;\n\
  import java.util.List;\n\n@GraphQlTest(PetsController.class)\nclass PetsControllerTest\
  \ {\n\n  @Autowired\n  GraphQlTester graphQlTester;\n\n  @MockBean\n  PetService\
  \ petService;\n\n  @Test\n  void testPets() {\n    Mockito.when(petService.getPets())\n\
  \      .thenReturn(List.of(\n        new Pet(\"Luna\"),\n        new Pet(\"Skipper\"\
  )\n      ));\n\n    graphQlTester\n      .document(\"query myPets { pets { name\
  \ }\")\n      .execute()\n      .path(\"pets[*].name\")\n      .entityList(String.class)\n\
  \      .isEqualTo(List.of(\"Luna\", \"Skipper\"));\n  }\n}\n```\n\n这是一个非常合适的设置，特别是当控制器下方有复杂的配置时。mock\
  \ `Pet` 服务依赖项允许实现非常聚焦且精简的测试。\n\n作为替代方案，你可以通过替换上述测试的最后块代码来验证至少有两个宠物名称：\n\n```java\n\
  graphQlTester\n  .document(\"query myPets { pets { name }\")\n  .execute()\n  .path(\"\
  pets[*].name\")\n  .entityList(String.class)\n  .hasSizeGreaterThan(2);\n```\n\n\
  在这些示例中，Pets 的 `path` 比我们的 Hello World 示例更复杂。`\"pets[*].name\"` 表示选择所有宠物的所有名称。我们可以在\
  \ `path` 中使用任何 [JsonPath](https://github.com/json-path/JsonPath)。\n\n## 订阅测试\n\n\
  `GraphQlTester` 提供了 `executeSubscription` 方法，它返回一个 `GraphQlTester.Subscription`。这可以被进一步转换为\
  \ `Flux` 并进行验证。为了更方便地测试 `Flux`，请添加 Reactor 测试库 `io.projectreactor:reactor-test`。\n\
  \n从端到端测试订阅章节中的 `hello` 订阅如下所示：\n\n```graphql\n# 每个 Schema 都需要一个 Query 类型\ntype Query\
  \ {\n    notUsed: String\n}\n\ntype Subscription {\n    hello: String\n}\n```\n\n\
  \n\n\n\n```java\npackage myservice.service;\n\nimport org.springframework.graphql.data.method.annotation.SubscriptionMapping;\n\
  import org.springframework.stereotype.Controller;\nimport reactor.core.publisher.Flux;\n\
  \nimport java.time.Duration;\nimport java.util.List;\n\n@Controller\nclass HelloController\
  \ {\n\n  @SubscriptionMapping\n  Flux<String> hello() {\n    Flux<Integer> interval\
  \ = Flux.fromIterable(List.of(0, 1, 2))\n      .delayElements(Duration.ofSeconds(1));\n\
  \    return interval.map(integer -> \"Hello \" + integer);\n  }\n}\n```\n\n如果你尚未设置，请在\
  \ `application.properties` 中设置 WebSocket 路径。\n\n```\nspring.graphql.websocket.path=/graphql\n\
  ```\n\n```java\npackage myservice.service;\n\nimport org.junit.jupiter.api.BeforeEach;\n\
  import org.junit.jupiter.api.Test;\nimport org.springframework.beans.factory.annotation.Value;\n\
  import org.springframework.boot.test.context.SpringBootTest;\nimport org.springframework.graphql.test.tester.GraphQlTester;\n\
  import org.springframework.graphql.test.tester.WebSocketGraphQlTester;\nimport org.springframework.web.reactive.socket.client.ReactorNettyWebSocketClient;\n\
  import reactor.core.publisher.Flux;\nimport reactor.test.StepVerifier;\n\nimport\
  \ java.net.URI;\n\n@SpringBootTest(\n    webEnvironment = SpringBootTest.WebEnvironment.RANDOM_PORT)\n\
  class SubscriptionTest {\n\n  @Value(\"http://localhost:${local.server.port}\"\n\
  \    + \"${spring.graphql.websocket.path}\")\n  private String baseUrl;\n\n  GraphQlTester\
  \ graphQlTester;\n\n  @BeforeEach\n  void setUp() {\n    URI url = URI.create(baseUrl);\n\
  \    this.graphQlTester = WebSocketGraphQlTester.builder(\n      url, new ReactorNettyWebSocketClient()\n\
  \    ).build();\n  }\n\n  @Test\n  void helloSubscription() {\n    Flux<String>\
  \ hello = graphQlTester\n      .document(\"subscription mySubscription {hello}\"\
  )\n      .executeSubscription()\n      .toFlux(\"hello\", String.class);\n\n   \
  \ StepVerifier.create(hello)\n      .expectNext(\"Hello 0\")\n      .expectNext(\"\
  Hello 1\")\n      .expectNext(\"Hello 2\")\n      .verifyComplete();\n  }\n}\n```\n\
