  \ 服务\n\n我们使用 `WebSocketGraphQlTester` 来测试不同的层。\n\n我们通过提供 URL 和 WebSocket 客户端来创建一个\
  \ `WebSocketGraphQlTester`。默认的 WebFlux 服务器是 Netty，意味着我们使用了 `ReactorNettyWebSocketClient`。\n\
  \n在这种情况下，我们使用 `StepVerifier` 来测试 `Flux`。\n\n默认的 WebFlux 服务器是 Netty，意味着我们使用了 `ReactorNettyWebSocketClient`。\n\
  \n我们使用 `WebSocketGraphQlTester` 来测试不同的层。\n\n我们通过提供 URL 和 WebSocket 客户端来创建一个 `WebSocketGraphQlTester`。默认的\
  \ WebFlux 服务器是 Netty，意味着我们使用了 `ReactorNettyWebSocketClient`。\n\n在这种情况下，我们使用 `StepVerifier`\
  \ 来测试 `Flux`。\n\n我们使用 `WebSocketGraphQlTester` 来测试不同的层。\n\n### 安全\n\n我们使用 `StepVerifier`\
  \ 来测试 `Flux`。\n\n由于 GraphQL 规范没有规定任何身份验证或授权逻辑，Spring 也没有提供这些功能。在本章中，我们将重点关注使用 Spring\
  \ Security 来保护你的服务。\n\n我们将通过一个示例服务来介绍核心概念。我们希望重要的部分是真实的，同时为了保持本章简洁，我们将采取一些简便方法。\n\
  \nWeb 客户端将通过 HTTP 使用 GraphQL API 使用我们的在线商店，在那里他们可以查询当前用户的所有订单。为了简洁起见，只有管理员可以删除订单，我们不会涵盖订单创建。\n\
  \n以下是我们的商店模式（Schema）。\n\n```\ntype Query {\n    # 每个登录用户都可以查询订单\n    myOrders: [Order]\n\
  }\n\ntype Order {\n    id: ID\n    details: String\n}\n\ntype Mutation {\n    #\
  \ 只有管理员可以删除订单\n    deleteOrder(input: DeleteOrderInput!): DeleteOrderPayload\n}\n\
  \ninput DeleteOrderInput {\n    orderId: ID\n}\n\ntype DeleteOrderPayload {\n  \
  \  success: Boolean\n}\n```\n\n让我们实现一个非常简单的 Java 类 `OrderService`，用于加载和更改存储在内存中的订单。\n\
  \n```java\npackage myservice.service;\n\nrecord Order(String id, String details,\
  \ String owner) {\n}\n```\n\n\n\n\n\n# 订单服务\n```java\npackage myservice.service;\n\
  \nimport org.springframework.stereotype.Service;\nimport java.util.ArrayList;\n\
  import java.util.List;\nimport java.util.stream.Collectors;\n\n@Service\nclass OrderService\
  \ {\n\n  private final List<Order> orders;\n\n  OrderService() {\n    // 一个可变的订单列表\n\
  \    this.orders = new ArrayList<>(List.of(\n      new Order(\"1\", \"Kibbles\"\
  , \"Luna\"),\n      new Order(\"2\", \"Chicken\", \"Skipper\"),\n      new Order(\"\
  3\", \"Rice\", \"Luna\"),\n      new Order(\"4\", \"Lamb\", \"Skipper\"),\n    \
  \  new Order(\"5\", \"Bone\", \"Luna\"),\n      new Order(\"6\", \"Toys\", \"Luna\"\
  ),\n      new Order(\"7\", \"Toys\", \"Skipper\")\n    ));\n  }\n\n  List<Order>\
  \ getOrdersByOwner(String owner) {\n    return orders\n      .stream()\n      .filter(order\
  \ -> order.owner().equals(owner))\n      .collect(Collectors.toList());\n  }\n\n\
  \  boolean deleteOrder(String orderId) {\n    return orders.removeIf(order -> order.id().equals(orderId));\n\
  \  }\n}\n```\n\n这个简单的 Java 类包含了我们想要的基础功能方面：`getOrdersByOwner` 返回提供所有者的订单列表，而 `deleteOrder`\
  \ 用于删除订单。\n\n我们的身份验证将使用 session cookies，并且我们要求每个请求都必须拥有有效的 session。这意味着在请求执行开始之前，我们需要确保我们有一个有效的\
  \ session，否则我们将返回 HTTP 401 状态码。\n\n一旦我们有了识别用户的有效 session，就可以查询他们的订单并检查他们是否可以删除某个订单。这部分授权是在\
  \ GraphQL 执行期间在 DataFetcher 级别处理的。\n\n要向我们的项目添加 Spring Security，请添加依赖：\n\n`org.springframework.boot:spring-boot-starter-security`\n\
  \n然后创建以下 `Config` 类。\n\n```java\npackage myservice.service;\n\nimport org.springframework.context.annotation.Bean;\n\
  import org.springframework.context.annotation.Configuration;\nimport org.springframework.security.config.annotation.web.reactive.EnableWebFluxSecurity;\n\
  import org.springframework.security.config.web.server.ServerHttpSecurity;\nimport\
  \ org.springframework.security.core.userdetails.MapReactiveUserDetailsService;\n\
  import org.springframework.security.core.userdetails.User;\nimport org.springframework.security.core.userdetails.UserDetails;\n\
  import org.springframework.security.web.server.SecurityWebFilterChain;\nimport org.springframework.security.web.server.authentication.RedirectServerAuthenticationSuccessHandler;\n\
  \n@Configuration\n@EnableWebFluxSecurity\nclass Config {\n\n  @Bean\n  SecurityWebFilterChain\
  \ springWebFilterChain(ServerHttpSecurity http) throws Exception {\n    http.formLogin()\n\
  \      .successHandler(new RedirectServerAuthenticationSuccessHandler(\"/graphql\"\
  ));\n    return http\n      .csrf(ServerHttpSecurity::disable)\n      .authorizeExchange(exchanges\
  \ -> {\n        exchanges.anyExchange().authenticated();\n      })\n      .build();\n\
  \  }\n\n  @Bean\n  @SuppressWarnings(\"deprecation\")\n  MapReactiveUserDetailsService\
  \ userDetailsService() {\n    User.Builder userBuilder = User.withDefaultPasswordEncoder();\n\
  \    UserDetails luna = userBuilder\n      .username(\"Luna\")\n      .password(\"\
  password\")\n      .roles(\"USER\")\n      .build();\n    UserDetails andi = userBuilder\n\
  \      .username(\"Andi\")\n      .password(\"password\")\n      .roles(\"ADMIN\"\
  )\n      .build();\n    return new MapReactiveUserDetailsService(luna, andi);\n\
  \  }\n}\n```\n\n## 安全配置详情\n`Config` 类执行了以下操作：\n- **表单登录 (Form Login)**：配置表单登录，并在成功后重定向到\
  \ `/graphql`。\n- **CSRF**：出于演示目的已禁用。\n- **授权 (Authorization)**：要求所有交换经过身份验证。\n-\
  \ **用户详情 (User Details)**：定义了两个模拟用户：`Luna`（角色 `USER`）和 `Andi`（角色 `ADMIN`）。\n\n##\
  \ GraphQL Controller\n这是实现授权的第一部分。我们使用当前用户来过滤返回的订单。我们只返回他们的订单。\n\n```java\npackage\
  \ myservice.service;\n\nimport org.springframework.graphql.data.method.annotation.QueryMapping;\n\
  import org.springframework.stereotype.Controller;\nimport java.security.Principal;\n\
  import java.util.List;\n\n@Controller\nrecord OrderController(OrderService orderService)\
  \ {\n\n  @QueryMapping\n  List<Order> myOrders(Principal principal) {\n    return\
  \ orderService.getOrdersByOwner(principal.getName());\n  }\n}\n```\n\n\n\n\n```java\n\
  package myservice.service;\n\nimport org.springframework.graphql.data.method.annotation.Argument;\n\
  import org.springframework.graphql.data.method.annotation.MutationMapping;\nimport\
  \ org.springframework.graphql.data.method.annotation.QueryMapping;\nimport org.springframework.security.access.AccessDeniedException;\n\
  import org.springframework.security.authentication.UsernamePasswordAuthenticationToken;\n\
  import org.springframework.security.core.authority.SimpleGrantedAuthority;\nimport\
  \ org.springframework.stereotype.Controller;\n\nimport java.security.Principal;\n\
  import java.util.List;\n\n@Controller\nrecord OrderController(OrderService orderService)\
  \ {\n\n  @QueryMapping\n  List<Order> myOrders(Principal principal) {\n    return\
  \ orderService.getOrdersByOwner(principal.getName());\n  }\n\n  @MutationMapping\n\
  \  DeleteOrderPayload deleteOrder(@Argument DeleteOrderInput input,\n          \
  \                        Principal principal) {\n    UsernamePasswordAuthenticationToken\
  \ user\n      = (UsernamePasswordAuthenticationToken) principal;\n    if (!user.getAuthorities()\n\
  \      .contains(new SimpleGrantedAuthority(\"ROLE_ADMIN\"))) {\n      throw new\
  \ AccessDeniedException(\"Only admins can delete orders\");\n    }\n    return new\
  \ DeleteOrderPayload(orderService\n      .deleteOrder(input.orderId()));\n  }\n\
  }\n```\n\n我们再次使用了注入的 `Principal`，但这次我们用它验证当前用户是否拥有正确的角色，而不是过滤订单。如果用户未授权，我们将抛出一个\
  \ `AccessDeniedException`。\n\n我们可以通过在 `/login` 以“Luna”身份登录（密码为“password”）来手动测试此服务，并通过\
  \ GraphiQL 玩具查询所有订单，如截图“Luna’s orders”所示。\n\n```graphql\nquery lunaOrders {\n  \
  \  myOrders {\n        id\n    }\n}\n```\n\n![Luna’s orders](img/file17.png)\n\n\
  Luna 的订单\n\n如果我们尝试以 Luna 的身份删除订单，我们将得到一个 GraphQL 错误，告诉我们没有权限，如截图“Luna is unauthorized\
  \ to delete orders”所示。\n\n```graphql\nmutation lunaUnauthorized {\n    deleteOrder(input:\
  \ {orderId: 1}) {\n        success\n    }\n}\n```\n\n![Luna is unauthorized to delete\
  \ orders](img/file18.png)\n\nLuna is unauthorized to delete orders\n\n在我们通过 `/logout`\
  \ 退出并以“Andi”身份登录（密码为“password”）后，我们就可以删除订单。\n\n需要注意的是，使用已登录用户进行未授权删除订单的操作**不会**导致\
  \ HTTP 错误。HTTP 响应的状态码为 `200`，其中包含一个 GraphQL 错误。\n\n## Spring for GraphQL 对安全的支持\n\
  \n在存储订单的示例中，我们看到了 Spring for GraphQL 支持 Spring Security 的一个特性：我们可以将 `java.security.Principal`\
  \ 声明为注解方法的输入（这包括 `@BatchMapping`）。\n\nSpring for GraphQL 自动注册一个 `ReactiveSecurityDataFetcherExceptionResolver`（或\
  \ WebMVC 的 `SecurityDataFetcherExceptionResolver`）来处理 `AuthenticationException`\
  \ 和 `AccessDeniedException`。`AuthenticationException` 和 `AccessDeniedException`\
  \ 分别导致错误类型为 `UNAUTHORIZED` 和 `FORBIDDEN` 的 GraphQL 错误。\n\n## 方法安全\n\n我们上面的存储订单示例中存在的一个问题是执行授权检查的位置。它们直接发生在每个\
  \ DataFetcher 内部。这并不好。更好且推荐的方法是保护 `OrderService` 本身，这样无论哪个 DataFetcher 使用它，它都是安全的。\n\
  \nSpring Security 提供了方法级注解以以声明的方式进行授权。由于 Spring for GraphQL 集成了 Spring Security，我们可以使用这些注解来重构\
  \ `OrderService`。\n\n```java\n@PreAuthorize(\"hasRole('ADMIN')\")\nMono<Boolean>\
  \ deleteOrder(String orderId) {\n  return Mono.just(orders.removeIf(order -> order.id().equals(orderId)));\n\
  }\n```\n\n为了让 `PreAuthorize` 在 WebFlux 服务中生效，带注解的方法必须返回 `Mono` 或 `Flux`。因此，我们需要将返回值封装在\
  \ `Mono` 中。\n\n我们还将 `getOrdersByOwner` 重构为 `getOrdersForCurrentUser`，并使用 `ReactiveSecurityContextHolder`\
  \ 来获取当前登录的用户。\n\n```java\nMono<List<Order>> getOrdersForCurrentUser() {\n  return\
  \ ReactiveSecurityContextHolder.getContext()\n    .map(securityContext -> {\n  \
  \    Principal principal = securityContext.getAuthentication();\n      return orders\n\
  \        .stream()\n        .filter(order -> order.owner().equals(principal.getName()))\n\
  \        .collect(Collectors.toList());\n    });\n}\n```\n\n我们需要将返回类型更改为 `Mono`，因为\
  \ `ReactiveSecurityContextHolder` 本身是响应式的。最后，我们需要在 `Config` 类中添加 `@EnableReactiveMethodSecurity`\
  \ 来启用这些注解。\n\n整合以上内容，这里是 `Config`、`Controller` 和 `OrderService` 的完整源代码。\n\n\n\n\n\
  \n```java\npackage myservice.service;\n\nimport org.springframework.context.annotation.Bean;\n\
  import org.springframework.context.annotation.Configuration;\nimport org.springframework.security.config.annotation.method\n\
  \  .configuration.EnableReactiveMethodSecurity;\nimport org.springframework.security.config.annotation.web\n\
  \  .reactive.EnableWebFluxSecurity;\nimport org.springframework.security.config.web.server\n\
  \  .ServerHttpSecurity;\nimport org.springframework.security.core.userdetails\n\
  \  .MapReactiveUserDetailsService;\nimport org.springframework.security.core.userdetails.User;\n\
  import org.springframework.security.core.userdetails\n  .UserDetails;\nimport org.springframework.security.web.server\n\
  \  .SecurityWebFilterChain;\nimport org.springframework.security.web.server.authentication\n\
  \  .RedirectServerAuthenticationSuccessHandler;\n\n@Configuration\n@EnableWebFluxSecurity\n\
  @EnableReactiveMethodSecurity\nclass Config {\n\n  @Bean\n  SecurityWebFilterChain\
  \ springWebFilterChain(\n    ServerHttpSecurity http\n  ) throws Exception {\n \
  \   http\n      .formLogin()\n      .authenticationSuccessHandler(\n        new\
  \ RedirectServerAuthenticationSuccessHandler(\"/graphiql\")\n      );\n\n    return\
  \ http\n      .csrf(ServerHttpSecurity.CsrfSpec::disable)\n      .authorizeExchange(exchanges\
  \ -> {\n        exchanges.anyExchange().authenticated();\n      })\n      .build();\n\
  \  }\n\n  @Bean\n  @SuppressWarnings(\"deprecation\")\n  MapReactiveUserDetailsService\
  \ userDetailsService() {\n    User.UserBuilder userBuilder = User.withDefaultPasswordEncoder();\n\
  \    UserDetails luna = userBuilder\n      .username(\"Luna\").password(\"password\"\
  )\n      .roles(\"USER\").build();\n    UserDetails andi = userBuilder\n      .username(\"\
  Andi\").password(\"password\")\n      .roles(\"USER\", \"ADMIN\").build();\n   \
  \ return new MapReactiveUserDetailsService(luna, andi);\n  }\n}\n```\n\n```java\n\
  package myservice.service;\n\nimport org.springframework.graphql.data.method.annotation\n\
  \  .Argument;\nimport org.springframework.graphql.data.method.annotation\n  .MutationMapping;\n\
  import org.springframework.graphql.data.method.annotation\n  .QueryMapping;\nimport\
  \ org.springframework.stereotype.Controller;\nimport reactor.core.publisher.Mono;\n\
  \nimport java.util.List;\n\n@Controller\nrecord OrderController(OrderService orderService)\
  \ {\n\n  @QueryMapping\n  Mono<List<Order>> myOrders() {\n    return orderService.getOrdersForCurrentUser();\n\
  \  }\n\n  @MutationMapping\n  Mono<DeleteOrderPayload> deleteOrder(\n    @Argument\
  \ DeleteOrderInput input) {\n    Mono<Boolean> booleanMono = orderService\n    \
  \  .deleteOrder(input.orderId());\n    return booleanMono.map(DeleteOrderPayload::new);\n\
  \  }\n\n}\n```\n\n```java\npackage myservice.service;\n\nimport org.springframework.security.access.prepost.PreAuthorize;\n\
  import org.springframework.security.core.context\n  .ReactiveSecurityContextHolder;\n\
  import org.springframework.stereotype.Service;\nimport reactor.core.publisher.Mono;\n\
  import java.security.Principal;\nimport java.util.ArrayList;\nimport java.util.List;\n\
  import java.util.stream.Collectors;\n\n@Service\nclass OrderService {\n  private\
  \ final List<Order> orders;\n\n  OrderService() {\n    // 可变订单列表\n    this.orders\
  \ = new ArrayList<>(List.of(\n      Order(\"1\", \"Kibbles\", \"Luna\"),\n     \
  \ Order(\"2\", \"Skipper\"),\n      Order(\"3\", \"Rice\", \"Luna\"),\n      Order(\"\
  4\", \"Skipper\"),\n      Order(\"5\", \"Bone\", \"Luna\"),\n      Order(\"6\",\
  \ \"Toys\", \"Luna\"),\n      Order(\"7\", \"Skipper\")\n    ));\n  }\n  \n  Mono<List<Order>>\
  \ getOrdersForCurrentUser() {\n    return ReactiveSecurityContextHolder.getContext()\n\
  \      .map(securityContext -> {\n        Principal principal = securityContext.getAuthentication();\n\
  \        return orders\n          .stream()\n          .filter(order -> order.owner().equals(principal.getName()))\n\
  \          .collect(Collectors.toList());\n      });\n  }\n\n  @PreAuthorize(\"\
  hasRole('ADMIN')\")\n  Mono<Boolean> deleteOrder(String orderId) {\n    return Mono.just(orders\n\
  \      .removeIf(order -> order.id().equals(orderId)));\n  }\n}\n```\n\n注意，所有的授权逻辑现在都包含在\
  \ `OrderService` 中。\n\n除了 `@PreAuthorize`，Spring Security 还提供了 `@PostAuthorize`、`@PreFilter`\
  \ 和 `@PostFilter` 用于在方法调用前后执行授权。\n\n## 测试认证\n\n关于测试的介绍，请参阅关于测试的上一章节。\n\n让我们来编写端到端认证测试。从最简单的测试开始并建立良好的基准，让我们验证我们是否会拒绝未身份验证的请求。\n\
  \n```java\npackage myservice.service;\n\nimport org.junit.jupiter.api.Test;\nimport\
  \ org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.boot.test.autoconfigure.web.reactive\n\
  \  .AutoConfigureWebTestClient;\nimport org.springframework.boot.test.context.SpringBootTest;\n\
  import org.springframework.http.HttpStatus;\nimport org.springframework.http.MediaType;\n\
  import org.springframework.test.web.reactive.server\n  .WebTestClient;\n\nimport\
  \ java.util.Map;\n\n@SpringBootTest(\n    webEnvironment = SpringBootTest.WebEnvironment.RANDOM_PORT)\n\
  @AutoConfigureWebTestClient\nclass AuthE2ETest {\n\n  @Autowired\n  WebTestClient\
  \ webTestClient;\n\n  @Test\n  void shouldRejectUnauthenticated() {\n    String\
  \ document = \"query orders { myOrders { id } }\";\n    Map<String, String> body\
  \ = Map.of(\"query\", document);\n    webTestClient\n      .mutateWith(\n      \
  \  (builder, httpHandlerBuilder, connector) \n                -> builder.baseUrl(\"\
  /graphql\"))\n      .post()\n      .contentType(MediaType.APPLICATION_JSON)\n  \
  \    .accept(MediaType.APPLICATION_JSON)\n      .bodyValue(body)\n      .exchange()\n\
  \      .expectStatus().isEqualTo(HttpStatus.FOUND);\n  }\n}\n```\n\n\n\n\n在此端到端测试中，我们拒绝了一个带有\
  \ `302 Found` 结果的 GraphQL 请求，并重定向到另一个页面（登录页面）。根据服务的不同，我们可以断言另一个 HTTP 状态码，例如 `401\
  \ Unauthorized`。\n\n如果你只想测试 GraphQL 层，而不是整个服务的端到端测试，可以使用 `WebGraphQlTester`。\n\n\
  让我们测试我们是否为已身份验证的用户返回了正确的订单。\n\n```java\npackage myservice.service;\n\nimport org.junit.jupiter.api.Test;\n\
  import org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.boot.test.context.SpringBootTest;\n\
  import org.springframework.context.annotation.Import;\nimport org.springframework.graphql.server.WebGraphQlHandler;\n\
  import org.springframework.graphql.server.WebGraphQlInterceptor;\nimport org.springframework.graphql.server.WebGraphQlRequest;\n\
  import org.springframework.graphql.server.WebGraphQlResponse;\nimport org.springframework.graphql.test.tester.WebGraphQlTester;\n\
  import org.springframework.security.authentication.UsernamePasswordAuthenticationToken;\n\
  import org.springframework.security.core.authority.SimpleGrantedAuthority;\nimport\
  \ org.springframework.security.core.context.ReactiveSecurityContextHolder;\nimport\
  \ org.springframework.security.core.context.SecurityContext;\nimport org.springframework.security.core.context.SecurityContextHolder;\n\
  import org.springframework.stereotype.Component;\nimport reactor.core.publisher.Mono;\n\
  \nimport java.util.List;\n\n@SpringBootTest(webEnvironment = SpringBootTest.WebEnvironment.MOCK)\n\
  @Import(WebGraphQlTest.WebInterceptor.class)\nclass WebGraphQlTest {\n\n  @Autowired\n\
  \  WebGraphQlHandler webGraphQlHandler;\n\n  @Component\n  static class WebInterceptor\
  \ implements WebGraphQlInterceptor {\n\n    @Override\n    public Mono<WebGraphQlResponse>\
  \ intercept(WebGraphQlRequest request, Chain chain) {\n      UsernamePasswordAuthenticationToken\
  \ authenticated =\n        UsernamePasswordAuthenticationToken.authenticated(\n\
  \          \"Luna\", \"password\",\n          List.of(new SimpleGrantedAuthority(\"\
  ROLE_USER\")));\n      SecurityContext context = SecurityContextHolder.getContext();\n\
  \      context.setAuthentication(authenticated);\n      return chain\n        .next(request)\n\
  \        .contextWrite(\n          ReactiveSecurityContextHolder.withSecurityContext(Mono.just(context)));\n\
  \    }\n\n    @Test\n    void testCorrectOrdersAreReturned() {\n      WebGraphQlTester\
  \ webGraphQlTester\n        = WebGraphQlTester.create(webGraphQlHandler);\n    \
  \  String document = \"query orders { myOrders { id }\";\n      webGraphQlTester.document(document)\n\
  \        .execute()\n        .errors()\n        .verify()\n        .path(\"myOrders[*].id\"\
  )\n        .entityList(String.class)\n        .isEqualTo(List.of(\"1\", \"3\", \"\
  5\", \"6\"));\n      // Luna's orders previously defined in OrderService\n    }\n\
  }\n```\n\n我们注册了一个新的 `WebInterceptor` 并创建了已身份验证的用户，因为 Spring Security 依赖于 `SecurityContext`，而它本身存储在\
  \ Reactor 上下文中。在测试本身中，我们验证了没有返回错误，然后检查响应中的订单 ID。这些订单 ID 之前在 `OrderService` 中定义。\n\
  \n在同一个类中，我们还可以测试未授权的用户是否无法删除订单。\n\n```java\n  @Test\n  void testMutationForbidden()\
  \ {\n    WebGraphQlTester webGraphQlTester\n      = WebGraphQlTester.create(webGraphQlHandler);\n\
  \    String document = \"\"\"\n mutation delete($id:ID){\n deleteOrder(input:{orderId:$id}){success}}\"\
  \"\";\n    webGraphQlTester.document(document)\n      .variable(\"id\", \"1\")\n\
  \      .execute()\n      .errors()\n      .expect(responseError ->\n        responseError.getMessage().equals(\"\
  Forbidden\") &&\n          responseError.getPath().equals(\"deleteOrder\")).verify();\n\
  \  }\n```\n\n注意此测试验证的是 GraphQL 错误，而不是 HTTP 状态码，因为整个 HTTP 响应是 `200`。我们验证了消息和路径是否符合我们的预期。\n\
  \n在本章中我们涵盖了如何利用 Spring for GraphQL 有用的 Spring Security 集成来保护 GraphQL 服务。\n\n# Java\
  \ 客户端\n\nSpring for GraphQL 自带了一个客户端 `GraphQlClient`，用于通过 HTTP 或 WebSocket 发送 GraphQL\
  \ 请求。\n\n`HttpGraphQlClient` 用于查询和变变，通过 HTTP 执行 GraphQL 请求。`WebSocketGraphQlClient`\
  \ 用于订阅，通过共享的 WebSocket 连接执行 GraphQL 请求。\n\n我们与基础 Java 接口 `GraphQlClient` 交互。我们使用\
  \ `HttpGraphQlClient` 和 `WebSocketGraphQlClient` 创建实现 `GraphQlClient` 接口的特定实例。这种设计与我们之前在测试章节中讨论过的\
  \ `GraphQlTester` 类似。\n\n## HTTP 客户端\n\nHTTP GraphQL 客户端基本上是 `WebClient` 的封装，因此在创建\
  \ `HttpGraphQlClient` 时我们需要提供一个 `WebClient`。\n\n```java\npackage myservice.service;\n\
  \nimport org.springframework.graphql.client.HttpGraphQlClient;\nimport org.springframework.web.reactive.function.client.WebClient;\n\
  \nWebClient webClient = ... ;\nHttpGraphQlClient graphQlClient = HttpGraphQlClient.create(webClient);\n\
  ```\n\n使用构建器方法，我们可以提供特定的 HTTP 设置，例如构建时的头。\n\n```java\nHttpGraphQlClient graphQlClient\
  \ = HttpGraphQlClient\n  .builder(webClient)\n  .header(\"Special-Header\", \"true\"\
  )\n  .build();\n```\n\n或者\n\n```java\nHttpGraphQlClient graphQlClient = HttpGraphQlClient\n\
  \  .builder(webClient)\n  .headers(httpHeaders -> httpHeaders.setBearerAuth(\"token\"\
  ))\n  .build();\n```\n\n我们还可以提供其他设置，如 `url`。\n\n```java\nHttpGraphQlClient graphQlClient\
  \ = HttpGraphQlClient\n  .builder(webClient)\n  .url(\"/public/graphql\")\n  .build();\n\
  ```\n\n一旦创建，我们就无法更改任何这些客户端设置。对于不同的设置，我们需要变异客户端并再次使用构建器方法。\n\n```java\nHttpGraphQlClient\
  \ newClient = graphQlClient\n  .mutate()\n  .header(\"Another-Header\", \"false\"\
  )\n  .build();\n```\n\n## WebSocket 客户端\n\n`WebSocketGraphQlClient` 底使用 `WebSocketClient`。在创建新的\
  \ `WebSocketGraphQlClient` 时，我们需要提供一个 `WebSocketClient`。注意 `WebSocketClient` 是一个抽象，提供了\
  \ Reactor Netty、Tomcat [以及其他](https://docs.spring.org/spring-framework/docs/current/reference/html/web-reactive.html#webflux-websocket-client)\
  \ 的实现。\n\n这是一个使用基于 Netty 实现的示例。\n\n\n\n\n\n```java\nimport org.springframework.graphql.client.WebSocketGraphQlClient;\n\
  import org.springframework.web.reactive.socket.client.ReactorNettyWebSocketClient;\n\
  import org.springframework.web.reactive.socket.client.WebSocketClient;\n\nString\
  \ url = \"http://localhost:8080/graphql\";\nWebSocketClient client = new ReactorNettyWebSocketClient();\n\
  WebSocketGraphQlClient graphQlClient = WebSocketGraphQlClient\n  .builder(url, client)\n\
  \  .build();\n```\n\n注意，在 WebSocket 客户端中，我们通过构建 `builder(url, client)` 提供 URL，而在\
  \ HTTP 客户端中，它是通过构建 `url` 设置的。\n\n一旦创建，我们就无法更改任何 WebSocket 客户端设置。对于不同的设置，我们需要变异客户端并再次使用构建方法。\n\
  \n```java\nWebSocketGraphQlClient newClient = graphQlClient\n  .mutate()\n  .url(\"\
  https://my-new-url\")\n  .build();\n```\n\n## GraphQlClient\n\n在创建 HTTP 或 WebSocket\
  \ 客户端实例后，我们才能使用 `GraphQlClient`。在以下示例中，`graphQlClient` 可以是 HTTP 客户端，也可以是 WebSocket\
  \ 客户端。\n\n使用 `document` 或 `documentName` 来定义请求操作，然后我们可以 `retrieve` 响应的特定部分。注意，这在设计上与\
  \ `GraphQlTester` 相似。\n\n```java\nMono<List<Pet>> pets = graphQlClient\n  .document(\"\
  query petNames {pets{name}}\")\n  .retrieve(\"pets\")\n  .toEntityList(Pet.class);\n\
  ```\n\n如果我们有订阅请求，我们使用 `retrieveSubscription` 来获取 `Flux` 而不是 `Mono`。\n\n```java\n\
  Flux<Pet> pets = graphQlClient\n  .document(\"subscription newPetNames {newPet{name}}\"\
  )\n  .retrieveSubscription(\"newPet\")\n  .toEntity(Pet.class);\n```\n\n作为 `retrieve`\
  \ 的替代方案，可以使用 `execute` 和 `executeSubscription` 分别返回 `Mono<ClientGraphQlResponse>`\
  \ 或 `Flux<ClientGraphQlResponse>`。`ClientGraphQlResponse` 允许访问完整的 GraphQL 响应，包括\
  \ GraphQL 错误。\n\n```java\nMono<List<Pet>> pets = graphQlClient\n  .document(\"query\
  \ {pets{name}}\")\n  .execute()\n  .map(response -> {\n    List<ResponseError> errors\
  \ = response.getErrors();\n    // 您的额外代码\n  });\n```\n\n在本章中，我们涵盖了 Spring for GraphQL\
  \ 内置的 `GraphQlClient`，用于通过 HTTP 或 WebSocket 发送 GraphQL 请求。\n\n"
