  md: 'Java (and most other languages).


    Immutable means the value of a string cannot be changed. Whenever we update a
    string variable, we are actually creating a new string and assigning the memory
    address to the String variable. Let’s consider an example. Suppose we have


    String message = "Hello";


    We learned earlier that the compiler will create the string “Hello” and store
    it somewhere in the computer’s memory. The variable message stores the address
    of that location. Now, if we update the value of message to “World” as shown below


    message = "World";


    the compiler actually does not go to the location where “Hello” is stored to change
    its value to “World”. Instead, it creates a new string “World” and stores it somewhere
    else in the computer’s memory. This new address is then assigned to message. In
    other words, there are two strings: “Hello” and “World”. If “Hello” is no longer
    needed in the program, it is eventually destroyed so as to free up that memory
    location. This process is known as garbage collection and is handled automatically
    by Java.'
