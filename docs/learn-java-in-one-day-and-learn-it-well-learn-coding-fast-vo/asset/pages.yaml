  md: 'Now, let us do a quick run-through of the basic program that you just coded.


    # 2.4.1 Package


    On the first line, we have the statement


    package helloworld;


    This statement tells the compiler that the Java file we wrote belongs to the helloworld
    package.


    A package is simply a grouping of related classes and interfaces. Do not worry
    if you do not know what classes and interfaces are, we’ll cover them in subsequent
    chapters.


    When we write package helloworld; at the top of our file, we are asking the compiler
    to include this file in the helloworld package. The compiler will create a folder
    named “helloworld” and save the file into that folder. Files that belong to the
    same package are stored in the folder.


    If you navigate to your “NetBeansProjects” folder now, you’ll find a folder “HelloWorld”.
    The “NetBeansProject” folder is normally located in your “Documents” folder. If
    you can’t find this folder, try searching for it using your computer’s search
    function.


    Within the “HelloWorld” folder, you’ll find a “src” folder that contains the “helloworld”
    folder.


    This folder stores the files of the helloworld package. It is a convention for
    us to name our packages in lowercase. Note that Java is a case-sensitive language.
    Hence, “HelloWorld” is not the same as “helloworld”. Inside the “helloworld” folder,
    you’ll find the HelloWorld.java file.


    The advantage of declaring packages is that it prevents naming conflicts. Two'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'or more files can have the same name as long as they belong to different packages.
    This is similar to how you can have two or more files of the same name on your
    computer as long as you put them in different folders. We''ll learn how to create
    different packages in Chapter 8.


    In addition to packages created by us, Java also comes with a large number of
    pre-created packages that contain code that we can use in our programs. For instance,
    code for input and output is bundled in the java.io package while code for implementing
    the components of a graphical user interface (like buttons, menus, etc) is bundled
    in the java.awt package. To use these pre-written packages, we need to import
    them into our programs. We''ll learn how to do that at a later time.


    # 2.4.2 The HelloWorld Class


    Next, let''s move on to the HelloWorld class. We''ll talk more about classes in
    Chapter 7. For now, just know that in our example, the HelloWorld class starts
    with line 3 with an opening curly brace and ends on line 10 with a closing curly
    brace. Curly braces are used extensively in Java to indicate the start and end
    of a code element. All opening braces in Java must be closed with a corresponding
    closing brace.


    Within the HelloWorld class, we have the main() method which starts on line 5
    and ends on line 8.


    # 2.4.3 The main() Method


    The main() method is the entry point of all Java applications. Whenever a Java
    application is started, the main() method is the first method to be called.


    Notice the words String[] args inside the parenthesis of our main() method? This
    means the main() method can take in an array of strings as input. Do not worry
    about this for the moment. We''ll cover arrays and input in subsequent chapters.'
