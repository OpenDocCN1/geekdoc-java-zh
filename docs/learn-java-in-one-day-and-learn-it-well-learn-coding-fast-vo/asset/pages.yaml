    # 3.8 Type Casting In Java


    Sometimes in our program, it is necessary to convert from one data type to another,
    as from a double to an int. This is known as type casting.


    If we want to convert a smaller data type into a larger data type, we do not need
    to do anything explicitly. For instance, the code below assigns a short (2 bytes)
    to a double (8 bytes). This is known as a widening primitive conversion and does
    not require any special code on our part.


    ```

    short age = 10;

    double myArray = age;

    ```


    However, if we want to assign a larger data type to a smaller data type, we need
    to indicate it explicitly using a pair of parenthesis. This is known as a narrowing
    primitive conversion. The example below shows how it can be done.


    ```

    int x = (int) 20.9;

    ```


    Here, we can casting a double (8 bytes) into an int (4 bytes).


    Narrowing conversion is not safe and should be avoided unless absolutely necessary.
    This is because narrowing conversion can result in a loss of data. When we cast
    20.9 into an int, the resulting value is 20, not 21. The decimal portion is truncated
    after the conversion.


    We can also cast a double into a float. Recall that we mentioned earlier that
    all non integers are treated as double by default in Java. If we want to assign
    a number like 20.9 to a float, we need to add a suffix ''F'' to the number. Another
    way to do it is to use a cast, like this:


    ```

    float num1 = (float) 20.9;

    ```'
