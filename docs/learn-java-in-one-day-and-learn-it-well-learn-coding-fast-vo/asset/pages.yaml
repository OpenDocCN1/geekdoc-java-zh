  md: 'In our example, the main() method contains two lines of code. The first line

    //Print the words Hello World on the screen

    is known as a comment and is ignored by the compiler.


    The second line

    System.out.println("Hello World");


    displays the line "Hello World" (without quotes) on the output window

    located at the bottom of the screen). Note that this statement ends with a semi-colon.
    All statements in Java must end with a semi-colon (;). This is similar to most
    of the other programming languages like C and C++.


    After the System.out.println("Hello World"); statement, we end our

    code with two closing braces to close the earlier opening braces.

    That''s it! There''s all there is to this simple program.


    # 2.5 Comments


    We''ve covered quite a bit in this chapter. You should now have a basic

    understanding of Java programming and be reasonably comfortable with

    NetBeans. Before we end this chapter, there''s one more thing to learn -

    comments.


    We mentioned in the previous section that the line

    //Print the words Hello World on the screen

    is is a comment and is ignored by the compiler.


    A comment is actually not part of the program. It is added to our code to

    make it more readable for other programmers. As such, comments are not

    compiled into bytecode.'
