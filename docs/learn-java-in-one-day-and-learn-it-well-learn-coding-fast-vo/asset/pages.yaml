    When overriding a method, there are some rules that we must follow. For instance,
    the method in the child class must have the same parameter list as the method
    in the parent class. If the method in the child class fails to override the method
    in the parent class correctly, the compiler will generate an error. If that happens,
    you can hover your mouse over the error for more information.


    Using the @Override annotation is optional when overriding a method. However,
    you are strongly encouraged to do so to prevent compilation errors.


    Annotations follow a fixed syntax and are case sensitive. @override, @Overriding
    or @ThisMethodAnother are all invalid annotations. Java comes with a number of
    predefined annotations. You can find the list of predefined annotations here

