  md: '# Chapter 3: The World of Variables and Operators


    Now that you are familiar with NetBeans and have some basic understanding of a
    Java program, let''s get down to the real stuff. In this chapter, you''ll learn
    all about variables and operators. Specifically, you''ll learn what variables
    are and how to manage, declare, and initialize them. You''ll also learn about
    the common operations that we can perform on them.


    # 3.1 What are variables?


    Variables are names given to data that we need to store and manipulate in our
    programs. For instance, suppose your program needs to store the age of a user.
    To do that, we can name this data userAge and declare the variable userAge using
    the following statement:


    ```

    int userAge;

    ```


    This declaration statement first states the data type of the variable, followed
    by its name. The data type of a variable refers to the type of data that the variable
    will store (such as whether it''s a number or a piece of text). In our example,
    the data type is int, which refers to integers. The name of our variable is userAge.


    After you declare the variable userAge, your program will allocate a certain area
    of your computer''s memory space to store this data. You can then access and modify
    this data by referring to it by its name, userAge.


    # 3.2 Primitive Data Types in Java


    There are eight basic data types that are predefined in Java. These are known
    as primitive data types.

    The first 4 data types are for storing integers (i.e. numbers with no fractional
    parts). They are as follows:


    byte'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'The byte data type is used for storing integers from -128 to 127. It uses 1
    byte of storage space (this is known as the width or the size of the data type).
    We normally use the byte data type if storage space is a concern or if we are
    certain the value of the variable will not exceed the -128 to 127 range.


