  md: 'The printf() method requires one or more arguments. In the example above,

    we passed in four arguments to the method.


    The first argument "The answer for %.3f divided by %d is %.2f." is the

    string to be formatted.


    You may notice a few weird symbols in the string: %.3f, %d and %.2f. These

    are known as format specifiers. They serve as placeholders and are replaced

    by the arguments that follow. The first format specifier (%.3f) is replaced by

    the first argument that follows (5.45), the second (%d) by the second

    argument (3) and so on.


    Format specifiers always begin with a percent sign (%) and end with a

    converter (such as f or d). They specify how the arguments that replace them

    should be formatted. In between the percent sign (%) and the converter, you

    can add additional information known as flags.


    In our example, the first format specifier is %.3f.


    f is the converter. It tells the compiler that it should be replaced by a floating

    point number (i.e. numbers with decimal places such as float or double). If

    we try to replace it with a non floating point number, we''ll get an error.


    .3 is the flag. It indicates that we want to display the number with 3 decimal

    places. Hence, the number 5.45 is displayed as 5.450 in the output.

    Other than the %.3f specifier, there are a lot of other specifiers that we can

    use in Java. The next two sections discuss some of the other commonly

    converters and flags in our specifiers.


