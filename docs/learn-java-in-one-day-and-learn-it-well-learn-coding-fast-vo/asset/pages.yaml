  md: '# Chapter 6: Control Flow Statements


    We’ve covered a bit in the previous chapters. By now, you should know the basic
    structure of a Java program and be able to write a simple Java program that uses
    variables. In addition, you also learned how you can use the various built-in
    Java methods to interact with your users.


    In this chapter, we are going to take things a step further – we are going how
    to control the flow of your program. By default, the statements inside your program
    are executed from top to bottom, in the order that they appear. However, we can
    alter this flow using control flow statements.


    These statements include decision-making statements (if, switch), looping statements
    (for, while, do-while), and branching statements (break, continue). We’ll look
    at each of them in subsequent sections.


    For now, let us first look at comparison operators.


    # 6.1 Comparison Operators


    Most control flow statements involve doing some form of comparison. The program
    proceeds differently depending on the result of the comparison.


    The most commonly used comparison operator is the equality operator. If we want
    to compare whether two variables are equal, we use the == (double =) operator.
    For instance, if you write x == y, you are asking the program to check if the
    value of x is equal to the value of y. If they are equal, the condition is met
    and the statement evaluates to true. Else, the statement evaluates to false.


    In addition to evaluating whether two values are equal, there are other comparison
    operators that we can use in our control flow statements.'
