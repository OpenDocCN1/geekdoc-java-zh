    generics. Sometimes, it may be useful to limit the data types that can be passed
    to a type parameter. For instance, we may want to create a generic class that
    only works with numbers. This generic class may contain methods that calculate
    the sum and average of these numbers. For cases like these, we can use a bounded
    type parameter. This can be done using the extends clause.


    If you specify the type parameter


    ```

    <T extends A>

    ```


    T can only accept data types that are subtypes of A.


    All numeric classes in Java (e.g. Integer and Double) are subclasses of the Number
    class. If we want our class to only work with numeric data types, we can declare
    the class as


    ```

    class MyGenericsClass2 <T extends Number>

    {}

    ```


    Now, if we instantiate a MyGenericsClass2 object as follows,


    ```

    MyGenericsClass2<String> g2 = new MyGenericsClass2();

    ```


    we''ll get an error as String is not a subclass of Number.


    In contrast, the statements


    ```

    MyGenericsClass2<Integer> g3 = new MyGenericsClass2();

    MyGenericsClass2<Double> g4 = new MyGenericsClass2();

    ```


    are fine as Integer and Double are both subclasses of Number.


    We''ve just covered a brief introduction of generics. A complete discussion will
    require a full chapter and is beyond the scope of this book.'
