    每当我们从俱乐部中删除一个成员时，就会调用此方法。当我们删除成员时，需要更新 CSV 文件。遗憾的是，Java 中没有方法可以让我们轻松地从文件中删除某行。我们只能对其进行写入或追加，但不能从中删除数据。


    因此，我们需要创建一个临时文件。这是编程中非常常见的做法。其工作原理如下：


    每当我们想从俱乐部中删除一个成员时，先从 `LinkedList` 中将其移除。接下来，我们将此 `LinkedList` 作为参数传递给 `overwriteFile()`
    方法。


    在 `overwriteFile()` 方法内部，我们将创建一个名为 `members.temp` 的临时文件，并将 `LinkedList` 中的所有数据写入该临时文件。注意，我们并不直接写入
