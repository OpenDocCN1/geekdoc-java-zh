    ```\n\n### 6.3.2 增强型 For 语句\n\n除了 `for` 语句外，在处理数组和集合（我们将在第 9 章讨论集合）时，我们使用增强型 `for`\
    \ 语句。如果你想从数组获取信息而不对其进行任何更改，那么增强型 `for` 语句非常有用。\n\n增强型 `for` 语句的语法是：\n\n```\nfor\
