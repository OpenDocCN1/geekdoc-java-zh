    \ 30, 40, 50};`\n\nWe can use a for for statement and the length field of the\
    \ array to loop through the array as shown below.\n\n```\nfor (int i = 0; i <\
    \ myNumbers.length; i++) {\n  System.out.println(myNumbers[i]);\n}\n```\n\nAs\
    \ `myNumbers.length` is equal to 5, this code runs from i = 0 to i = 4. If we\
    \ run the code, we'll get the following output:\n\n```\n10\n20\n30\n40\n50\n```\n\
    \n### 6.3.2 Enhanced For Statement\n\nIn addition to the for statement, we can\
    \ also use an enhanced for statement when working with arrays and Collections\
