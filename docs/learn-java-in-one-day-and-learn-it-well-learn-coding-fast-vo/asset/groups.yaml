    # binarySearch()


    The binarySearch() method allows you to search for a specific value in a sorted
    array. To use this method, make sure your array is sorted first. You can use the
    sort() mentioned above to do so.


    Suppose we have the following array:


    ```

    int[] myInt = {21, 23, 34, 45, 56, 78, 99};

    ```


    To determine if 78 is inside the array, we write


    ```

    int foundIndex = Arrays.binarySearch(myInt, 78);

    ```


    foundIndex will be equal to 5. This indicates that the number 78 is found at index
    5.


    On the other hand, if you write


    ```

    int foundIndex2 = Arrays.binarySearch(myInt, 39);

    ```


    foundIndex2 will be equal to -4.


    There are two parts to this result - the negative sign and the number 4.


    The negative sign simply indicates that 39 is not found.


    The number 4, on the other hand, is kind of weird. It tells you where the number
    should be if it exists in the array. However, it adds ONE to that'
