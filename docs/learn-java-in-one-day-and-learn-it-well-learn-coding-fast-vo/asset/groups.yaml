    A block body allows the body of a lambda expression to contain multiple statements.\
    \ To create a block body, you simply have to enclose the statements in braces\
    \ as shown in the example above. In addition, you have to add a semi-colon after\
    \ the closing brace. Finally, as the block body has more than one expression,\
    \ it is necessary to use the return keyword to return a value. This is in contrast\
