    \ 3 is met)\n10 {\n11   do Task C\n12 }\n13 else\n14 {\n15   do Task D\n16 }\n\
    ```\n\n第 1 行测试第一个条件。如果满足条件，随后的大括号内的所有内容（第 2 到 4 行）将被执行。`if` 语句的其余部分（第 5 到 16 行）将被跳过。\n\
    \n如果第一个条件不满足，可以使用随后的 `else` 块测试更多条件（第 5 到 12 行）。可以有多个 `else if` 块。最后，你可以使用 `else`\
    \ 块（第 13 到 16 行）在先前的任何条件都不满足时执行某些代码。`else if` 和 `else` 块是可选的。为了完全理解 `if` 语句的工作原理，让我们尝试一个示例。启动\
