    \ types of members: Single Club Members and Multi Club Members.\n\nA single club\
    \ member has access to only one of the three clubs. A multi club member, on the\
    \ other hand, has access to all three clubs.\n\nThe membership fee of a member\
    \ depends on whether he/she is a single club or a multi club member. For single\
    \ club members, the fees also depend on which club he/she has access to.\n\nFinally,\
    \ multi club members are awarded membership points for joining the club. Upon\
    \ sign up, they are awarded 100 points which they can use to redeem gifts and\
    \ drinks from the store. Our program will not handle the redemption process. All\
    \ that we’ll do is add 100 points to the multi club member’s account.\n\nThis\
