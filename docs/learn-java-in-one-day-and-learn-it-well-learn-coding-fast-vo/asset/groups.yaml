    index. In other words, if the number 39 exists in the array, it should be at index
    4-1 = 3.


    We’ve covered some of the more commonly used array methods in this section. For
    a complete list of all the array methods available in Java, check this page https://docs.oracle.com/java/8/docs/api/java/util/Arrays.html


    ## 4.2.2 Finding Array Length


    Finally, let’s look at how we can find the length of an array. The length of an
    array tells us the number of items the array has. Previously when we discussed
    strings, we mentioned we can use the length() method to find the length of a string.


    Contrary to what most would believe, there is no length() method when working
    with arrays. Instead, to find the length of an array, we use the length field.
    We’ll talk about fields vs methods in Chapter 7. For now, all you have to know
    is to find the length of an array, you do not need to add parenthesis after the
    word length.


    For instance, if we have


    ```

    int [] userAge = {21, 22, 26, 32, 40};

    ```


    userAgent.length is equal to 5 as there are 5 numbers in the array.


    ## 4.3 Primitive Type vs. Reference Type


    Now that we are familiar with strings and arrays, let us discuss an important
    concept regarding data types in Java.


    All data types in Java can be classified as either a primitive type or a reference
    type. There are only 8 primitive types in Java (byte, short, int, long, float,
    double, char and boolean), the rest are reference types. Examples of reference
    types include strings and arrays discussed in this chapter, and classes and interfaces
    that will be discussed in Chapter 7 and 8.


    One of the main differences between a primitive type and a reference type is the
    data that is stored.


    A primitive type stores its own data.


    When we write


    ```

    int myNumber = 5;

    ```


    the variable myNumber stores the actual value 5.


    A reference type, on the other hand, does not store the actual data. Instead,
    it stores a reference to the data. It does not tell the compiler what the value
    of the data is; it tells the compiler where to find the actual data.


    An example of a reference type is a String. When you write a statement like String
    message = "Hello";


    the variable message actually does not store the string “Hello”.


    Instead, the string “Hello” is created and stored elsewhere in the computer’s
    memory. The variable message stores the address of that memory location.


    That''s all we need to know about reference types at the moment. As this is a
    book for beginners, we will not go into details about why reference types are
    necessary. Be aware that there is a difference between primitive types and reference
    types; the former stores a value while the latter stores an address.


    ## 4.4 Strings are Immutable


    Before I end this chapter, I would like to cover one more concept about strings.
    Specifically, I would like to point out that strings are immutable in Java (and
    most other languages).


    Immutable means the value of a string cannot be changed. Whenever we update a
    string variable, we are actually creating a new string and assigning the memory
    address to the String variable. Let’s consider an example. Suppose we have


    ```

    String message = "Hello";

    ```


    We learned earlier that the compiler will create the string “Hello” and store
    it somewhere in the computer’s memory. The variable message stores the address
    of that location. Now, if we update the value of message to “World” as shown below


    ```

    message = "World";

    ```


    the compiler actually does not go to the location where “Hello” is stored to change
    its value to “World”. Instead, it creates a new string “World” and stores it somewhere
    else in the computer’s memory. This new address is then assigned to message. In
    other words, there are two strings: “Hello” and “World”. If “Hello” is no longer
    needed in the program, it is eventually destroyed so as to free up that memory
    location. This process is known as garbage collection and is handled automatically
    by Java.


    ## Chapter 5: Making our Program Interactive


    Now that we have covered the basics of variables and data types, let us write
    a program that accepts input from users, stores the data in a variable and displays
    messages to our users. After all, what good is a computer program if it cannot
    interact with its users?


    ## 5.1 Displaying Output


    We''ve already seen some examples of displaying outputs to users in Chapter 2
    and 4.


    Simply stated, to display outputs to our users, we can use the print() or println()
    method provided by Java. In order to use these methods, we have to add System.out
    of the method names. This is because the two methods belong to the PrintStream
    class and we have to use System.out to access them. Do not worry if this sounds
    very confusing at the moment. We''ll learn more about classes and methods in Chapter
    7.


    The difference between the println() and print() methods is that println() moves
    the cursor down to the next line after displaying the message while print() does
    not.


    For instance, if we write


    ```

    System.out.println("Hello ");

    System.out.println("How are you?");

    ```


    we''ll get


    ```

    Hello

    How are you?

    ```


    If we write


    ```

    System.out.print("Hello ");

    System.out.print("How are you?");

    ```


    we’ll get


    Hello How are you?


    Other than that, the two methods are the same.


    Let us look at a few examples of how we can use println() to display messages
    to our users. The print() method works exactly the same way.


    ### Displaying a simple text message


    To display a simple message, we write


    ```

    System.out.println("Hi, my name is Jamie.");

    ```


    Output:


    Hi, my name is Jamie.


    ### Displaying the value of a variable


    To display the value of a variable, we pass in the variable name as an argument.
    For instance, suppose we have


    ```

    int number = 30;

    ```


    we can display the value of number by writing


    ```

    System.out.println(number);

    ```


    Output:


    30


    Note that we do not enclose the variable name (number) in double quotes. If we
    write


    ```

    System.out.println("number");

    ```


    we’ll get


    number


    as the output instead.


    ### Displaying results without assigning them to variables


    We can also use the println() method to display the result of a mathematical expression
    or a method directly.


    For instance, if we write


    ```

    System.out.println(30+5);

    ```


    we’ll get


    35


    as the output. To display the result of a method, we can write


    ```

    System.out.println("Oracle".substring(1, 4));

    ```


    Here, we are displaying the result of substring() method. We’ll get


    rac


    ### Using the concatenation sign


    Next, let us look at a few examples of how we can display more complex strings
    by combining two shorter strings. To do that, we use the concatenation (+) sign.


    For instance, if we write


    ```

    System.out.println("Hello, " + "how are you?" + " I love Java.");

    ```


    we’ll get


    Hello, how are you? I love Java.


    To concatenate strings with variables, we can write


    ```

    int results = 79;

    System.out.println("You scored " + results + " marks for your test.");

    ```


    Here, we are concatenating the strings "You scored " and " marks for your test."
    with the variable results. We’ll get


    You scored 79 marks for your test.


    Finally, we can concatenate strings with mathematical expressions as shown below.


    ```

    System.out.println("The sum of 50 and 2 is " + (50 + 2) + ".");

    ```


    We’ll get


    The sum of 50 and 2 is 52.


    Note that in the example above, we added parenthesis to the mathematical 50+2.
    This is to force the compiler to evaluate the expression before concatenating
    the result with the other substrings. You are strongly advised to do so whenever
    you concatenate strings with mathematical expressions. Failure to do so can result
    in errors.


    ## 5.2 Escape Sequences


    Next, let''s look at sequences. Sometimes in our programs, we may need to print
    some special "unprintable" characters such as a tab or a newline. In this case,
    you need to use the \ (backslash) character to escape characters that otherwise
    have a different meaning.


    For instance to print a tab, we type the backslash character before the letter,
    like this: \t. Without the \ character, the letter "t" will be printed. With it,
    a tab is printed. \t is known as an escape sequence. If you type


    ```

    System.out.println("Hello\tWorld");

    ```


    you''ll get


    Hello

    World


    Other commonly used escape sequences include:


    # To prints a newline (\n)


    Example

    System.out.println("Hello\nWorld");


    Output

    Hello

    World


    # To print the backslash character itself (\\\)


    Example

    System.out.println("\\\");

