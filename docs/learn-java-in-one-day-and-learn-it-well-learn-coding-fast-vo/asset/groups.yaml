    these primitive types, Java also comes with a few advanced data types. In this
    chapter, we are going to cover two of them: strings and arrays. In addition, we
    are going to discuss the difference between a primitive data type and a reference
    data type.


    ## 4.1 String


    First, let us look at strings. A string is essentially a piece of text such as
    “Hello World” or “Good morning”.


    To declare and initialize a String variable, you write


    ```

    String message = "Hello World";

    ```


    where message is the name of the String variable and “Hello World” is the string
    assigned to it. Note that you need to enclose the string in double quotes (").


    You can also assign an empty string to a String variable like this:


    ```

    String anotherMessage = "";

    ```


    If you want to join two or more strings together, you can use the concatenate
    sign (+). For instance, you can write


    ```

    String myName = "Hello World, " + "my name is Jamie";

    ```


    This is the same as


    ```

    String myName = "Hello World, my name is Jamie";

    ```


    ### 4.1.1 String Methods


    Unlike the 8 primitive types we looked at in the previous chapter, a String is
    actually an object. Specifically, it is an object of the String class.


    Do not worry if you don''t understand what this means; we''ll discuss classes
    and objects in Chapter 7. For now, all that you have to know is that the String
    class provides us with a number of pre-written methods that we can use when working
    with strings. A method is a block of reusable code that performs a certain task.
    We''ll look at some examples later.


    In Java, a method may have different variations. Most of the examples discuss
    only one of the variations for each method. However, if you learn how to use one
    variation, you can figure out how to use the other variations with relative ease.
    Let''s look at some of the commonly used String methods now.


    ### length()


    The length() method tells us the total number of characters the string has.


    To find the length of the string "Hello World", we write


    "Hello World".length();


    Whenever we use a method, we need to use the dot operator. We type the name of
    the method (length in this case) after the dot operator, followed by a pair of
    parenthesis ( ). Most methods return an answer after they complete their tasks.
    The length() method returns the length of the string. You can assign this result
    to a variable as shown below.


    ```

    int myList = "Hello World".length();

    ```


    In the example above, myList will be equal to 11 as "Hello" and "World" both have
    5 characters each. When you add the space between the two words, you get a total
    length of 11.


    You can display the result of the length() method using the statements below.


    ```

    int maxLength = "Hello World".length();

    System.out.println(myLength);

    ```


    Try adding the two statements above to the HelloWorld.java file you wrote earlier
    in Chapter 2. You''ll have to add them inside the opening and closing braces of
    the main() method. Run the program. You''ll see the value 11 displayed as the
    output. We''ll tell you more about displaying outputs in the next chapter.


