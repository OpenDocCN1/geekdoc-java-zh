    This method has no parameter and returns the sum of 2 and 3. We can rewrite the\
    \ method as a lambda expression as shown below:\n\n() -> 2 + 3;\n\nNext, let's\
    \ look at a more complex example.\n\nSupposed you want to implement getValue()\
    \ as\n\n```\ndouble getValue()\n{\n    int counter = 1;\n    int sum = 0;\n  \
    \  while (counter<5) {\n        sum = sum + counter;\n        counter++;\n   \
