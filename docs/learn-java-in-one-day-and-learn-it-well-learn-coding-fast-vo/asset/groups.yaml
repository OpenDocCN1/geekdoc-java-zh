    } while (counter<0);\n```\n\n由于测试条件 `while (counter<0)` 放在大括号之后，它在代码执行一次后进行测试。如果你运行上述代码，将得到\n\
    \nCounter = 100\n\n在第一次执行 `System.out.println(\"Counter = \" + counter)` 语句后，`counter`\
