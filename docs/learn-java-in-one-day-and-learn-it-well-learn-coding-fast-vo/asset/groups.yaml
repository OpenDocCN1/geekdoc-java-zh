    # Chapter 9: Collections


    Congratulations on making it us far. We’ve come a long way.


    In the last two chapters, you learned how to write your own classes and instantiate
    objects.


    In this chapter, we are going to look at a framework that Java provides to enable
    us to easily store and manipulate these objects. Specifically, we’ll be looking
    at the Java Collections Framework.


    # 9.1 The Java Collections Framework


    The Java Collections Framework is a set of pre-written classes and interfaces
    that Java provides to help us organise and manipulate groups of objects. Using
    the Collections Framework, we can choose to organise our objects in different
    formats such as lists, sets, queues or maps.


    We’ll be looking at how to use lists in this chapter.


    The Java Collections Framework standardizes the way in which groups of objects
    are handled. Hence, once you know how to use lists, you’ll find it easier to learn
    other collections such as sets or queues.


    # 9.2 Autoboxing and Unboxing


    Before we can discuss the Java Collections Framework, we need to first discuss
    the concept of autoboxing and unboxing.


    Previously in Chapter 3, we learned about the 8 primitive types in Java. These
    8 primitive types are basic data types and not objects.


    However, Java is an object-oriented language and much of language revolves around
    the idea of treating everything as an object. Hence, oftentimes, we'
  - '[PAGE 139]


    find it necessary to convert a primitive type into object.


    To facilitate this conversion, Java provides us with what is known as wrapper
    classes. Each primitive type in Java has a corresponding wrapper class. These
    wrapper classes contain a number of useful methods that we can use. The wrapper
    classes for for


    boolean, char, byte, short, int, long, float and double


    are


    Boolean, Character, Byte, Short, Integer, Long, Float and Double respectively.


    Converting from a primitive data type into a wrapper class object is easy.


    For instance, to convert int into an Integer object, we do the following:


    ```

    Integer intObject = new Integer(100);

    ```


    Here, we declare and instantiate an Integer object by passing an int value of
    100 to the Integer class constructor. This constructor accepts the value and creates
    an Integer object based on that value.


    If we want to convert the Integer object back to an int, we use the intValue()
    method. The code is as follows:


    ```

    int m = intObject.intValue();

    ```


    The intValue() method returns an int type which we assign to m.


    As you can see, converting from a primitive data type to an object and vice versa
    is relatively straightforward. However in practice, it is actually simpler than
    what is shown above. Java provides us with two mechanisms known as autoboxing
    and unboxing. This allows for automatic conversion.'
