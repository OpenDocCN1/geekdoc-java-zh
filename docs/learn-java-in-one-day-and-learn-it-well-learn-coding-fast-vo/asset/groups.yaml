    Recall that the second argument (true) indicates that we want to append to the
    file.


    Try creating the BufferedWriter object yourself. You can refer to the previous
    method for guidance. Creating a BufferedWriter object is very similar to creating
    a BufferedReader object, with some slight modifications.


    After creating the BufferedWriter object, we''ll use the writer.write() method
    in the try block to append the string mem to the members.csv file. However, as
    we want to move the cursor to the next line after we append mem, we''ll concatenate
    "\n" to mem before passing it as an argument to the write() method. In other words,
    we use the statement below:


    ```

    writer.write(mem + "\n");

    ```


    If we do not do this, we''ll end up with


    S, 1, Yvonne, 950.0, 2M, Sharon, 1200.0, 100


    instead of


    S, 1, Yvonne, 950.0, 2

    M, 2, Sharon, 1200.0, 100


    After calling the write() method, we can exit the try block. Next, we add a catch
    block to catch any IOException error. This block simply prints out the error.
    After the catch block, the method is complete. Try coding this method yourself.


    ## overwriteFile()


    We are now ready to move on to the overwriteFile() method. This method has a LinkedList<Member>
    parameter called m and does not return anything. Try declaring the method yourself.


    This method is called whenever we want to remove a member from the club. When
    we remove a member, we need to update our csv file. Unfortunately, there is no
    method in Java that allows us to easily remove a line from a file. We can only
    write or append to it, but not remove data from it.


    Hence, we need to create a temporary file instead. This is a fairly common practice
    in programming. Here''s how it works.


    Every time we want to remove a member from our club, we''ll remove it from the
    LinkedList first. Next, we''ll pass this LinkedList as an argument to the overwriteFile()
    method.


    Inside the overwriteFile() method, we''ll create a temporary file called members.temp
    and write all the data in the LinkedList to this temporary file. Note that we
    do not write to the members.csv directly. This is to prevent any error from corrupting
    the file. If everything goes well, we''ll delete the original members.csv file
    and rename members.temp to members.csv.


    In order to achieve what is stated above, we''ll first declare a local variable
    in the overwriteFile() method as shown below:


    String s;


    Next, we''ll use a try-with-resources statement to create a BufferedWriter object
    called writer and pass the following FileWriter object to its constructor.


    ```

    new FileWriter("members.temp", false)

    ```


    Here, we state that we want the BufferedWriter object to overwrite any existing
    data in the members.temp file by passing false as the second argument.


    Try coding this try-with-resources statement yourself.


    After creating the BufferedWriter object, we can start coding the try block.

    The try block starts with a for statement as shown below:


    ```

    for (int i=0; i< m.size(); i++)

    {}

    ```


    This statement is used to loop through the elements in the LinkedList that is
    passed in. Inside the for statement, we first use the get() method to get the
    element at index i (refer to Chapter 9.5.1). We then use the toString() method
    to get a string representation of the element and assign it to the local variables
    s. Recall that we mentioned in Chapter 6.2.3 that you can call two methods in
    the same statement? We''ll do that to call the get() and toString() methods in
    the same statement as shown below:


    ```

    s = m.get(i).toString();

    ```


    Due to polymorphism (refer to Chapter 8.2), the correct toString() method will
    be invoked based on the run type of the element. For instance, if the first element
