    ```


    在这里我们将大小为 0 的 Integer 数组 (new Integer[0]) 传递给 `toArray()` 方法。


    这样做，`toArray()` 方法返回一个 Integer 数组，我们将其赋值给 `myIntArray`。


    #### clear()


    移除列表中所有的项，使用 `clear()` 方法。如果我们写


    ```

    ageList.clear();

    ```


    列表中将不再有任何元素。


