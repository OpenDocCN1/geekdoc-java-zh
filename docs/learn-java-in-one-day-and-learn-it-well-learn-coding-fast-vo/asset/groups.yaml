    Java is also designed to be platform independent. As mentioned earlier, Java code
    is compiled into bytecode first, which can be run on any machine that has the
    Java Virtual Machine. Hence with Java, you can write the code once and run it
    anywhere you want.


    Next, Java is an object-oriented programming (OOP) language. Object-oriented programming
    is an approach to programming that breaks a programming problem into objects that
    interact with each other. We''ll be looking at various object-oriented programming
    concepts in this book. Once you master Java, you will be familiar with these concepts.
    This will make it easier for you to master other object-oriented programming languages
    in future.


    Convinced that Java is a great language to learn? Let''s move on.'
  - '[PAGE 12]


    # Chapter 2: Getting Ready for Java


    # 2.1 Installing the JDK + NetBeans Bundle


    Before we can start developing applications in Java, we need to download and install
    the free JDK + NetBeans bundle provided by Oracle.


    # 2.1.1 What is JDK?


    JDK stands for Java Development Kit and is a free kit provided by Oracle that
    contains a number of tools to help us develop Java applications. Some of these
    tools include a compiler to compile our written code into bytecode (javac.exe),
    an archiver to package and distribute our Java files (jar.exe) and a documentation
    generator to generate HTML documentation from our Java code (javadoc.exe).


    In addition, JDK also includes the Java Runtime Environment (JRE). JRE contains
    the JVM mentioned in Chapter 1 and the resources that JVM needs in order to run
    Java programs.


    If you are only interested in running Java programs, all you need is the JRE.
    However, since we are also interested in developing Java programs, we need the
    JDK.


    # 2.1.2 What is NetBeans?


    Besides JDK, we also need to install NetBeans.


    NetBeans is an Integrated Development Environment (IDE) that we''ll be using to
    facilitate our coding process. Strictly speaking, we can develop Java applications
    without using NetBeans. We can write our code in Notepad (or any other text editor)
    and compile and execute them using the tools provided in JDK. The screenshot below
    shows an example of how this can be done.'
