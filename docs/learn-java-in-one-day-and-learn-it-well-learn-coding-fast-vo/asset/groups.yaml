    # Chapter 7: Object Oriented Programming Part 1


    In this chapter, we are going to look at a very important concept in Java programming
    – the concept of object-oriented programming.


    We''ll learn what object-oriented programming is and how to write our own classes
    and create objects from them. In addition, we''ll discuss the concept of fields,
    getters and setters, constructors and methods.


    # 7.1 What is Object-Oriented Programming?


    Simply stated, object-oriented programming is an approach to programming that
    breaks a programming problem into objects that interact with each other.


    Objects are created from templates known as classes. You can think of a class
    as the blueprint of a building. An object is the actual “building” that we build
    based on the blueprint.


    # 7.2 Writing our own class


    The syntax for declaring a class is as follows:


    ```

    AccessModifier class ClassName {

    //Contents of the class

    //including fields, constructors and methods

    }

    ```


    An example is


    ```

    public class ManagementStaff{

    }

    ```


    In the example above, we first state the access level of the class using an access
    modifier. Access modifiers are like gate keepers, they control who has access
    to that class. In other words, they control whether other classes can use'
  - '[PAGE 86]


    a particular field or method in that class.


    A class can either be public or package-private. In the example above, the class
    is public.


    public means the class can be accessed by any class in the program.


    Package-private, on the other hand, means the class is only accessible to other
    classes within the same package. There can be more than one packages within a
    single Java application. Refer to Chapter 2.3.1 if you have forgotten what a package
    is. Package-private is the default access level. If we do not write any access
    modifier, it means the class is package-private.


    We''ll look at access modifiers in greater depth in Chapter 8.5.


    After declaring the access level of the class, we type the class keyword to indicate
    that we are declaring a class, followed by the name of the class (ManagementStaff).


    It is common practice to use PascalCasing when naming our classes. PascalCasing
    refers to the practice of capitalizing the first letter of each word, including
    the first word (e.g. ThisIsClassName). This is the convention that we''ll be following
    in the book.


    The contents of the class are enclosed within the pair of curly braces that follows
    the class name. Contents of a class include constructors, fields, methods, interfaces,
    and other classes. We''ll cover some of them in this chapter.


    Now, let''s build a class from scratch together.


    First, launch NetBeans and create a new Java Application called ObjectOrientedDemo.

    Study the code that is generated for you. Notice that NetBeans has automatically
    created a public class for you?'
