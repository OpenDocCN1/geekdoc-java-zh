    # 7.2.1 Fields


    We''ll first declare the fields for our Staff class. To do that, add the following
    lines of code inside the curly braces of the class.


    ```

    private String nameOfStaff;

    private final int hourlyRate = 30;

    private int hoursWorked;

    ```


    Here, we declare one String variable (nameOfStaff) and two int variables (hourlyRate
    and hoursWorked). These variables are known as fields of the class. A field is
    simply a variable that is declared inside a class. Like any other variables, they
    are used to store data.


    All the three fields are declared as private.


    We can declare a field as either private, public or protected. If we choose not
    to access the access level of a class member, it is taken to package-private by
    default (i.e. only accessible to other classes within the same package). In our
    case, we declared the three fields as private. This means they can only be accessed
    from within the Staff class itself. Other classes, such as the ObjectOrientedDemo
    class, cannot access these fields.


    There are two reasons why we do not want other classes to access these fields.


    The first reason is that there is no need for other classes to know about these
    fields. For instance, in our case, the field hourlyRate is only needed within
    the Staff class. We have a method inside the Staff class that uses'
  - '[PAGE 89]


    hourlyRate to calculate the monthly salary of an employee. Other classes do not
    use the hourlyRate field at all. Hence, it is appropriate to declare hourlyRate
    as private so as to hide this field from other classes.


    This is known as encapsulation. Encapsulation enables a class to hide data and
    behaviour from other classes that do not need to know about them. This makes it
    easier for us to make changes to our code in future if necessary. We can safely
    change the value of hourlyRate without affecting other classes.


    The second reason for declaring a field as private is that we do not want other
    classes to freely modify them. This helps to prevent the fields from being corrupted.


    We''ll talk more about access modifiers in the next chapter.


    In addition to the private keyword, we also added the final keyword when we declared
    the hourlyRate field.


    ```

    private final int hourlyRate = 30;

    ```


    The final keyword indicates that the value cannot be changed after it is created.
    Any variable that is declared as final must be initialized at the point of declaration
    or within the constructor (we''ll talk about constructors later). In our example,
    we initialized hourlyRate to 30 when declaring it. This value cannot be changed
    subsequently anywhere in the code.


