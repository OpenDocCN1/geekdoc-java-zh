    The value is \" + n1.getValue());\n\n        MyNumber n2 = () -> 2 + 3;\n    \
    \    System.out.println(\"The value is \" + n2.getValue());\n\n        MyNumber\
    \ n3 = () -> {\n            int counter = 1;\n            int sum = 0;\n     \
    \       while (counter<5) {\n                sum = sum + counter;\n          \
    \      counter++;\n            }\n            return sum;\n        };\n      \
    \  System.out.println(\"The value is \" + n3.getValue());\n\n        MyNumberPara\
    \ p1 = (n, m) -> n + m;\n        System.out.println(\"The value is \" + p1.getValue2(2,3));\n\
    \n        MyNumberPara p2 = (n, m) -> {\n            if (n > 10)\n           \
