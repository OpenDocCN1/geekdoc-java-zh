    \ 的值。\n\n### 6.3.4 Do-while 语句\n\n`do-while` 语句与 `while` 语句相似，一个主要区别是是大括号内的代码至少执行一次。这里有一个\
    \ `do-while` 语句工作的示例：\n\n```\ndo {\n    //语句\n} while (条件);\n```\n\n```\nint counter\
