    # 6.4 Branching Statements


    We''ve now covered most of the control flow statements in Java. Next, let us look
    at branching statements.


    A branching statement is a statement that instructs the program to branch to another
    line of code. Branching statements are commonly used in loops and other control
    flow statements.


    # 6.4.1 Break Statement


    The first branching statement is the break statement. We have already seen how
    this statement can be used in a switch statement. In addition to using it in a
    switch statement, the break statement can also be used in other control flow statements.
    It causes the program to exit a loop prematurely when a certain condition is met.
    Let us look at an example of how the break statement can be used in a for statement.


    Consider the code segment below:


    ```

    1 for (int i = 0; i < 5; i++)

    2 {

    3   System.out.println("i = " + i);

    4   if (i == 2)

    5     break;

    6 }

    ```


