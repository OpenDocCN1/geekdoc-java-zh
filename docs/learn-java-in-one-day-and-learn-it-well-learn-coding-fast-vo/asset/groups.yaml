    ```\n\n# Chapter 10: File Handling\n\nWe've come a long way. By now, you are familiar\
    \ with quite a few core concepts in Java. In this chapter, we are going to cover\
    \ another important topic in Java - reading and writing to an external file.\n\
    \nIn Chapter 5 previously, we learned how to get input from users using methods\
    \ like next(), nextDouble() and nextLine(). However, in some cases, getting users\
    \ to enter data into our program may not be practical, especially if our program\
    \ needs to work with large amounts of data. In cases like this, a more convenient\
    \ way is to prepare the needed information as an external file and get our programs\
    \ to read the information from the file.\n\nJava provides us with a number of\
    \ classes and methods to work with files. The purpose of this chapter is to introduce\
    \ you to one of the numerous ways to do so. The classes that we are going to look\
    \ at in this chapter are the File, FileReader, BufferedWriter and FileWriter classes.\
    \ All these classes are available in the java.io package. To use the methods in\
    \ this chapter, you have to add the following import statement:\n\n```\nimport\
    \ java.io.*;\n```\n\nto your program.\n\n> * indicates that we are importing the\
    \ entire java.io package which contains all the classes that we are going to use.\
    \ Alternatively, you can import the individual classes by one if you prefer.\n\
    \n## 10.1 Reading a Text File\n\nTo read data from a text file, we use the FileReader\
    \ class. The FileReader class reads the contents of a file as a stream of characters,\
    \ reading in one character at a time.\n\nIn theory, this is all that is needed\
    \ to read from a file. Once you create a FileReader object, you are ready to read\
    \ data from the file. However, in practice, this is not the most efficient way\
    \ to do it. A more efficient way is to wrap a BufferedReader object around the\
    \ FileReader object.\n\nLike the name suggests, a BufferedReader object provides\
    \ buffering for our file reading operation. This concept is similar to video buffering\
    \ when we view videos online. Instead of reading one character at a time from\
    \ the network or disk, the BufferedReader object reads a larger block at a time\
    \ to speed up the process.\n\nSuppose we want to read data from the file myfile.txt\
    \ located in the same folder as your project. This example shows how it can be\
    \ done. To try this example, launch NetBeans and create a new project called HandlingDemo.\
    \ Replace the code with the code below:\n\n```\npackage filehandlingdemo;\nimport\
    \ java.io.*;\npublic class FileHandlingDemo {\n    public static void main(String[]\
    \ args) {\n        String line;\n        BufferedReader reader = null;\n     \
    \   try {\n            reader = new BufferedReader(new FileReader(\"myfile.txt\"\
    ));\n            line = reader.readLine();\n            while (line != null) {\n\
    \                System.out.println(line);\n                line = reader.readLine();\n\
    \            }\n        } catch (IOException e) {\n            System.out.println(e.getMessage());\n\
    \        }\nfinally\n{\n  try {\n    if (reader != null) {\n      reader.close();\n\
    \    }\n  } catch (IOException e) {\n    System.out.println(e.getMessage());\n\
    \  }\n}\n```\n\nIn the code above, we use a try-catch-finally statement to handle\
    \ our operations. This is because when working with files, errors can occur. For\
    \ instance, when we try to open the file, the system may not be able to find the\
    \ file. This will then generate an error which will be caught in the catch block.\n\
    \nLet's look at the try block now.\n\nOn line 13, we have the following statement:\n\
    \n`reader = new BufferedReader(new FileReader(\"myfile.txt\"));`\n\nHere, we first\
    \ create a FileReader object (the underlined portion) by passing the path of the\
    \ file that we want to read. As this file is in the same folder as the project,\
    \ the path is simply \"myfile.txt\".\n\nAfter creating the FileReader object,\
    \ we create a new BufferedReader object by passing in the FileReader object as\
    \ an argument to the BufferedReader constructor. This is what we mean when we\
    \ say \"wrap the BufferedReader object around a FileReader object\". This is necessary\
    \ because the BufferedReader object needs to know what data stream to buffer.\n\
    \nAfter creating the BufferedReader object, we assign it to the variable reader.\
    \ Now, we are ready to read from the file.\n\nOn line 14, we use the readLine()\
    \ method provided by the BufferedReader class to read the first line in the file.\
    \ We do that using the statement\n\n```\nline = reader.readLine();\n```\n\nIf\
    \ line is not null (i.e. data exists), the while statement from 15 to 19 will\
    \ be executed. Inside the while statement, we first use the println() method to\
    \ display the line read onto the screen. We then use another readLine() statement\
    \ (on line 18) to read the next line. This loop continues running until the last\
    \ line is read.\n\nNext, from line 21 to 24, we have the catch block. This block\
    \ simply displays an error message if an exception occurs.\n\nFrom line 25 to\
    \ 36, we have the finally block. Inside this block, we use an inner try block\
