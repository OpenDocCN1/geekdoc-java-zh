    a double using the parseDouble() method found in the Double class:


    ```

    double q = Double.parseDouble("5.1");

    ```


    Similarly, we''ll get an error if the string cannot be converted into a double.


    ## 9.3 Lists


    Now that we are familiar with wrapper classes, let us look at lists. A list is
    very similar to an array, but is more flexible. Specifically, its size can be
    changed.


    Previously, in Chapter 4, we learned that the size of an array cannot be changed
    once we initialize the array or if we state the number of elements when declaring
    it.


    For instance, if you declare the array

    int[] myArray = new int[10];


    myArray can only hold 10 values. If you write myArray[10] (which refers to the
    11th value since array index starts from zero), you will get an error.


    If you need greater flexibility in your program, you can use a list. Java comes
    with a pre-written List interface that is part of the Java Collections Framework.
    This interface is implemented by a few classes. The commonly used classes that
    implement the List interface are the ArrayList and LinkedList classes. We''ll
    look at ArrayList first.


    ## 9.4 ArrayList


    The ArrayList class is a pre-written class that implements the List interface.
    Like all other collections in the Java Framework Framework an ArrayList can only
    be used to store objects (not primitive data types). Hence, if we want to declare
    a list of integers, we have to use Integer instead of int.


    Whenever you use an ArrayList, you have to import the java.util.ArrayList class
    using the statement below


    ```

    import java.util.ArrayList;

    ```


    The syntax for declaring and instantiating an ArrayList is as follows:


    ```

    ArrayList<Type> nameOfArrayList = new ArrayList<>();

    ```


    For instance, to declare and instantiate an ArrayList of Integer objects, write


    ```

    ArrayList<Integer> userAge = new ArrayList<>();

    ```


    On the left side of the statement, we declared an ArrayList variable.


    ArrayList is a keyword to indicate that you are declaring an ArrayList <Integer>
    indicates that this ArrayList is used to store Integer objects


    userAge is the name of the ArrayList.


    On the right side, we instantiate a new ArrayList object using the new keyword
    and assign it to userAge.


    If you want the ArrayList to store String objects instead, you declare and instantiate
    it as


    ArrayList<String> userNameList = new ArrayList<>();


    In both examples above, we specifically declared an ArrayList and assigned an
    ArrayList to it. However, if you prefer, you can also choose to declare a List
    instead and assign an ArrayList to it.


    This is allowed because List is the superinterface of ArrayList.


