    extracts the character at index 1 and assigns it to myChar. Hence, myChar is equal
    to ‘e’.


    ### equals()


    The equals() method is used to compare if two strings are identical. This returns
    true if the strings are equal and false if they are not.


    If we have the statements:


    ```

    boolean equalsOrNot = "This is Jamie".equals("This is Jamie");

    boolean equalsOrNot2 = "This is Jamie".equals("Hello World");

    ```


    equalsOrNot will be true while equalsOrNot2 will be false.


    ### split()


