    Simply stated, binary compatibility means that when you change your interface,
    you do not need to make any changes to the classes that implement it.


    For instance, suppose we want to add a new method to our interface MyInterface.
    If we simply add the method declaration to the interface as shown below, we will
    get an error.


    ```

    interface MyInterface{


    int myInt = 5;

    void someMethod();

    void someNewMethod();

    }

    ```


    This is because the class that implements this interface (MyClass) did not implement
    the new method. A class that implements an interface must implement all the abstract
    methods in the interface. Hence, if you add an abstract method to your interface,
    you need to ensure that all classes that'
