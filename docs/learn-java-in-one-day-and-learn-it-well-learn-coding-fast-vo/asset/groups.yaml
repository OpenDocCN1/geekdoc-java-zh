    `ArrayList` 是一个关键字，表示你正在声明一个 `ArrayList`；`<Integer>` 表示此 `ArrayList` 用于存储 `Integer`
    对象；


    `userAge` 是该 `ArrayList` 的名称。


    在右侧，我们使用 `new` 关键字实例化了一个新的 `ArrayList` 对象并将其赋值给 `userAge`。


