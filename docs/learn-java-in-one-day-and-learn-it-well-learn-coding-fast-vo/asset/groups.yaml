- md: "\n# Chapter 6: Control Flow Statements\n\nWe’ve covered a bit in the previous\
    \ chapters. By now, you should know the basic structure of a Java program and\
    \ be able to write a simple Java program that uses variables. In addition, you\
    \ also learned how you can use the various built-in Java methods to interact with\
    \ your users.\n\nIn this chapter, we are going to take things a step further –\
    \ we are going how to control the flow of your program. By default, the statements\
    \ inside your program are executed from top to bottom, in the order that they\
    \ appear. However, we can alter this flow using control flow statements.\n\nThese\
    \ statements include decision-making statements (if, switch), looping statements\
    \ (for, while, do-while), and branching statements (break, continue). We’ll look\
    \ at each of them in subsequent sections.\n\nFor now, let us first look at comparison\
    \ operators.\n\n## 6.1 Comparison Operators\n\nMost control flow statements involve\
    \ doing some form of comparison. The program proceeds differently depending on\
    \ the result of the comparison.\n\nThe most commonly used comparison operator\
    \ is the equality operator. If we want to compare whether two variables are equal,\
    \ we use the == (double =) operator. For instance, if you write x == y, you are\
    \ asking the program to check if the value of x is equal to the value of y. If\
    \ they are equal, the condition is met and the statement evaluates to true. Else,\
    \ the statement evaluates to false.\n\nIn addition to evaluating whether two values\
    \ are equal, there are other comparison operators that we can use in our control\
    \ flow statements.\n\n### Not equal (!=)\n\nReturns true if the left is not equal\
    \ to the right\n\n```\n5 != 2 is true\n6 != 6 is false\n```\n\n### Greater than\
    \ (>)\n\nReturns true if the left is greater than the right\n\n```\n5 > 2 is true\n\
    3 > 6 is false\n```\n\n### Smaller than (<)\n\nReturns true if the left is smaller\
    \ than the right\n\n```\n1 < 7 is true\n9 < 6 is false\n```\n\n### Greater than\
    \ or equal to (>=)\n\nReturns true if the left is greater than equal to the right\n\
    \n```\n5 >= 2 is true\n5 >= 5 is true\n3 >= 6 is false\n```\n\n### Smaller than\
    \ or equal to (<=)\n\nReturns true if the left is smaller or equal to the right\n\
    \n```\n5 <= 7 is true\n7 <= 7 is true\n9 <= 6 is false\n```\n\nWe also have two\
    \ logical operators (&&, ||) that are useful if we want to combine multiple conditions.\n\
    \n### The AND operator (&&)\n\nReturns true if all conditions are met\n\n5==5\
    \ && 2>1 && 3!=7 is true\n5==5 && 2<1 && 3!=7 is false as the second condition\
    \ (2<1) is false\n\n### The OR operator (||)\n\nReturns true if at least one condition\
    \ is met.\n\n5==5 || 2<1 || 3==7 is true as the first condition (5==5) is true\n\
    5==6 || 2<1 || 3==7 is false as all conditions are false\n\n## 6.2 Decision Making\
    \ Statements\n\nNow that we are familiar with comparison operators, let us proceed\
    \ to learn how we can use these operators to control the flow of a program. We'll\
    \ look at the if statement first.\n\n### 6.2.1 If Statement\n\nThe if statement\
    \ is one of the most commonly used control flow statements. It allows the program\
    \ to evaluate if a certain condition is met and perform the appropriate action\
    \ based on the result of the evaluation.\n\nThe structure of an if statement is\
    \ as follows (line numbers are added for reference):\n\n```\n1 if (condition 1\
    \ is met)\n2 {\n3   do Task A\n4 }\n5 else if (condition 2 is met)\n6 {\n7   do\
    \ Task B\n8 }\n9 else if (condition 3 is met)\n10 {\n11   do Task C\n12 }\n13\
    \ else\n14 {\n15   do Task D\n16 }\n```\n\nLine 1 tests the first condition. If\
    \ the condition is met, everything inside the pair of curly braces that follow\
    \ (lines 2 to 4) will be executed. The rest of the if statement (from line 5 to\
    \ 16) will be skipped.\n\nIf the first condition is not met, you can use the else\
    \ blocks that follow to test more conditions (lines 5 to 12). There can be multiple\
    \ else if blocks. Finally, you can use the else block (lines 13 to 16) to execute\
    \ some code if none of the preceding conditions are met. The else if and else\
    \ blocks are optional. To fully understand how the if statement works, let's try\
    \ an example. Launch NetBeans and create a new project IfDemo. Replace the code\
    \ generated with the following code.\n\n```java\npackage ifDemo;\nimport java.util.Scanner;\n\
    public class IfDemo{\n    public static void main(String[] args) {\n        Scanner\
    \ input = new Scanner(System.in);\n        System.out.print(\"Please enter your\
    \ age: \");\n        int age = input.nextInt();\n        if (age < 0 || age >\
    \ 100) {\n            System.out.println(\"Invalid Age\");\n            System.out.println(\"\
    Age must be between 0 and 100\");\n        } else if (age < 18) {\n          \
    \  System.out.println(\"Sorry you are underage\");\n        } else if (age < 21)\
    \ {\n            System.out.println(\"You need parental consent\");\n        }\
    \ else {\n            System.out.println(\"Congratulations!\");\n            System.out.println(\"\
    You may sign up for the event!\");\n        }\n    }\n}\n```\n\nThe program first\
    \ prompts the user for age and stores the result in the age variable. The statement\
    \ `if (age < 0 || age > 100)` checks if the value of age is smaller than zero\
    \ or greater than 100. If either of the conditions is true, the program will execute\
    \ all statements within the curly braces that follow. In this example, it will\
    \ print \"Invalid Age\", followed by \"Age must be between 0 and 100\".\n\nOn\
    \ the other hand, if both conditions are false, the program will test the next\
    \ condition `else if (age < 18)`. If age is less than 18 (but more than 0 since\
    \ the first condition is not met), the program will print \"Sorry you are underage\"\
    . You may notice that we did not enclose the statement `System.out.println(\"\
    Sorry you are underage\");` in curly braces. This is because curly braces are\
    \ optional if there is only one statement to execute.\n\nIf the user did not enter\
    \ a value smaller than 18, but one greater than or equal to 18 but smaller than\
    \ 21, the next else if statement will be executed. In this case, the message “You\
    \ need parental consent” will be printed.\n\nFinally, if the user entered a value\
    \ greater than or equal to 21 but smaller than or equal to 100, the program will\
    \ execute the else block. In this case, it will print “Congratulations!” and “You\
    \ may sign up for the event!”.\n\nRun the program five times and enter -1, 8,\
    \ 20, 23 and 121 respectively for each run. You’ll get the following outputs:\n\
    \nPlease enter your age: -1\nInvalid Age\nAge must be between 0 and 100\n\nPlease\
    \ enter your age: 8\nSorry you are underage\n\nPlease enter your age: 20\nYou\
    \ need parental consent\n\nPlease enter your age: 23\nCongratulations!\nYou may\
    \ sign up for the event!\n\nPlease enter your age: 121\nInvalid Age\nAge must\
    \ be between 0 and 100\n\n### 6.2.2 Ternary Operator\n\nThe ternary operator (?)\
    \ is a simpler form of an if statement that is very convenient if you want to\
    \ assign a value to a variable depending on the result of a condition. The syntax\
    \ is:\n\n`condition ? value to return if condition is true : value to return if\
    \ condition is false;`\n\nFor instance, the statement\n\n```\n3>2 ? 10 : 5;\n\
    ```\n\nreturns the value 10 since 3 is greater than 2 (i.e. the condition 3 >\
    \ 2 is true). This value can then be assigned to a variable.\n\nIf we write\n\n\
    ```java\nint myNum = 3>2 ? 10 : 5;\n```\n\nmyNum will be assigned the value 10.\n\
    \n### 6.2.3 Switch Statement\n\nThe switch statement is similar to an if statement\
    \ except that it does not work with a range of values. A switch statement requires\
    \ each case to be based on a single value. Depending on the value of the variable\
    \ used for switching, the program will execute the correct block of code.\n\n\
    The syntax of a switch statement is as follows:\n\n```java\nswitch (variable used\
    \ for switching)\n{\n    case firstCase:\n        do A;\n        break;\n\n  \
    \  case secondCase:\n        do B;\n        break;\n\n    default:\n        do\
    \ C;\n        break;\n}\n```\n\nYou can have as many cases as you want when using\
    \ a switch statement. The default case is optional and is executed if no other\
    \ case applies. You can use either a byte, short, char or int variable for switching.\
    \ Starting from Java 7, you can also use a String variable for switching.\n\n\
    When a certain case is satisfied, everything starting from the next line is executed\
    \ until a break statement is reached. A break statement instructs the program\
    \ to break out of the switch statement and continue executing the rest of the\
    \ program.\n\nLet's look at an example of how the switch statement works. To try\
    \ this example, launch NetBeans and create a new project SwitchDemo. Replace the\
    \ code generated with the following code. In this example, we use a String variable\
    \ for switching.\n\n```java\npackage switchdemo;\nimport java.util.Scanner;\n\
    public class SwitchDemo {\n    public static void main(String[] args) {\n    \
    \    Scanner input = new Scanner(System.in);\n        System.out.print(\"Enter\
    \ your grade: \");\n        String userGrade = input.nextLine().toUpperCase();\n\
    \        switch (userGrade) {\n            case \"A+\":\n            case \"A\"\
    :\n                System.out.println(\"Distinction\");\n                break;\n\
    \            case \"B\":\n                System.out.println(\"B Grade\");\n \
    \               break;\n            case \"C\":\n                System.out.println(\"\
    C Grade\");\n                break;\n        }\n    }\n}\n```\n"
  mdcn: "\n\n# 第6 章：控制流语句\n\n在之前的章节中我们已经涵盖了一些内容。现在，你应该已经熟悉 Java 程序的基本结构，并能够编写使用变量的简单\
    \ Java 程序。此外，你还学习了如何使用各种内置 Java 方法与用户进行交互。\n\n在本章中，我们将更进一步——学习如何控制程序的执行控制流。默认情况下，程序内部的语句是按照它们出现的顺序从上到下执行的。然而，我们可以使用控制流语句来改变这种流。\n\
    \n这些语句包括决策语句（if, switch）、循环语句（for, while, do-while）和分支语句（break, continue）。我们将在随后的章节中逐一介绍每一种。\n\
    \n现在，让我们先来看比较运算符。\n\n## 6.1 比较运算符\n\n大多数控制流语句都涉及某种形式的比较。程序将根据比较的结果执行不同的操作。\n\n\
    最常用的比较运算符是等号运算符。如果我们想比较两个变量是否相等，我们使用 `==`（双等号）运算符。例如，如果你写 `x == y`，你是在要求程序检查 `x`\
    \ 的值是否等于 `y` 的值。如果它们相等，则满足条件，语句求值为 `true`。否则，语句求值为 `false`。\n\n除了判断两个值是否相等外，我们还可以在控制流语句中使用其他比较运算符。\n\
    \n### 不等于 (!=)\n\n如果左侧不等于右侧，则返回 `true`。\n\n```\n5 != 2 is true\n6 != 6 is false\n\
    ```\n\n### 大于 (>)\n\n如果左侧大于右侧，返回 `true`。\n\n```\n5 > 2 is true\n3 > 6 is false\n\
    ```\n\n### 小于 (<)\n\n如果左侧小于右侧，返回 `true`。\n\n```\n1 < 7 is true\n9 < 6 is false\n\
    ```\n\n### 大于等于 (>=)\n\n如果左侧大于等于右侧，返回 `true`。\n\n```\n5 >= 2 is true\n5 >= 5 is\
    \ true\n3 >= 6 is false\n```\n\n### 小于等于 (<=)\n\n如果左侧小于或等于右侧，返回 `true`。\n\n```\n\
    5 <= 7 is true\n7 <= 7 is true\n9 <= 6 is false\n```\n\n我们还有两个逻辑运算符 (`&&`, `||`)，它们在想要组合多个条件时非常有用。\n\
    \n#### 与逻辑运算符 (&&)\n\n如果所有条件都满足，则返回 `true`。\n\n`5==5 && 2>1 && 3!=7` 为 true\n\
    `5==5 && 2<1 && 3!=7` 为 false，因为第二个条件 (`2<1`) 为 `false`\n\n#### 或逻辑运算符 (||)\n\n\
    如果至少满足一个条件，则返回 `true`。\n\n`5==5 || 2<1 || 3==7` 为 true，因为第一个条件 (`5==5`) 为 `true`\n\
    `5==6 || 2<1 || 3==7` 为 false，因为所有条件均为 `false`\n\n## 6.2 决策语句\n\n现在我们已经熟悉了比较运算符，让我们学习如何使用这些运算符来控制程序的流程。我们先来看\
    \ `if` 语句。\n\n### 6.2.1 if 语句\n\n`if` 语句是最常用的控制流语句之一。它允许程序评估某个条件是否满足，并根据评估结果执行相应的操作。\n\
    \n`if` 语句的结构如下（添加了行号以便参考）：\n\n```\n1 if (condition 1 is met)\n2 {\n3   do Task\
