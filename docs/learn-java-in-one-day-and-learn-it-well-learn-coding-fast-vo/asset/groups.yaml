    ```


    On the right side of the statement, we use the “Hello World” string to call the
    substring() method. The number 6 in the parenthesis is known as the argument.
    extract the substring starting from index 6 (i.e. position 6) to the end of the
    string.


    Note that in programming, index starts with a value of ZERO not 1. This is a common
    practice in almost all programming languages such as Python and Java. Hence, in
    our example, ‘H’ is at index 0 while ‘W’ is at index 6. The statement below will
    extract the substring “World”. This result is then assigned to firstSubstring.


    firstSubstring is thus equal to “World”.


    The substring() method also comes with another variation that allows us to extract
    a substring from one index to another. Suppose you want to extract a substring
    from position 1 to 7, you can do it as follows:


    ```

    String message = "Hello World";

    String secondSubstring = message.substring(1, 8);

    ```


    In the example above, we first assigned “Hello World” to the variable message.
    We then use message to call the substring() method. The two arguments are 1 and
    8. As before, the first argument tells the compiler index of the starting position
    to extract. The second argument tells the compiler index of the first position
    to stop extracting. In other words, in our example, the compiler stops at position
    8 (not after position 8). That means the letter at position 8 is not included
    in the substring. Hence, the substring extracted is “ello Wo”.


    secondSubstring is thus equal to “ello Wo”.

    message remains as “Hello World”.


