  mdcn: "\n泛型。有时，限制传递给类型参数的数据类型可能是很有用的。例如，我们可能想要创建一个只适用于数字的泛型类。这个泛型类可能包含计算这些数字之和和平均值的方法。对于这种情况，我们可以使用边界类型参数。这可以通过\
    \ `extends` 子句来实现。\n\n如果你指定类型参数\n\n```\n<T extends A>\n```\n\nT 只能接受 A 的子类型的数据类型。\n\
    \nJava 中所有的数值类（例如 Integer 和 Double）都是 `Number` 类的子类。如果我们希望我们的类只处理数值数据类型，我们可以将类声明为：\n\
    \n```\nclass MyGenericsClass2 <T extends Number>\n{}\n```\n\n现在，如果我们如下所示实例化 `MyGenericsClass2`\
    \ 对象：\n\n```\nMyGenericsClass2<String> g2 = new MyGenericsClass2();\n```\n\n我们将得到一个错误，因为\
    \ `String` 不是 `Number` 的子类。\n\n相反，以下语句：\n\n```\nMyGenericsClass2<Integer> g3 =\
    \ new MyGenericsClass2();\nMyGenericsClass2<Double> g4 = new MyGenericsClass2();\n\
    ```\n\n是没问题的，因为 `Integer` 和 `Double` 都是 `Number` 的子类。\n\n我们刚刚涵盖了泛型的简要介绍。完整的讨论需要一整章，这超出了本书的范围。\n\
    \n接下来，让我们转向函数接口和 Lambda 表达式。\n\n## 11.2 函数接口和 Lambda 表达式\n\n函数接口和 Lambda 表达式的概念是紧密相分的。首先，让我们看看函数接口的概念。\n\
    \n函数接口简单来说就是包含一个且仅有一个抽象方法的接口。它可以包含其他静态方法和默认方法，但必须只有一个抽象方法。\n\n考虑以下接口：\n\n```\n\
    @FunctionalInterface\ninterface MyNumber{\n    double getValue();\n}\n```\n\n\
    此接口包含一个抽象方法（记住，不需要使用 `abstract` 修饰符，因为接口中的方法默认是抽象的）。由于此接口只包含一个抽象方法，因此被称为函数接口。在函数接口中，抽象方法指定了接口的意图目的。在这个例子中，接口的功能是返回一个\
    \ `double` 类型的数值。\n\n你可以添加 `@FunctionalInterface` 注解来通知编译器这是一个函数接口，如我们上面的示例所示。\n\
    \n现在我们已经定义了什么是函数接口，让我们看看我们如何实现这个接口。之前，我们学习了如何使用类来实现接口。在本章中，我们将学习如何使用 Lambda 表达式来实现接口。\n\
    \nLambda 表达式的语法如下：\n\n`(参数 列表) -> lambda 体`\n\n这种语法目前看起来可能毫无意义。让我们看一些例子来说说明它是如何使用的。\n\
    \n假设你想如下所示实现 `getValue()` 方法：\n\n```\ndouble getValue()\n{\n    return 12.3;\n\
    }\n```\n\n该方法没有参数，简单地返回值 12.3。我们可以将该方法重写为以下 Lambda 表达式：\n\n`() -> 12.3;`\n\nLambda\
    \ 表达式的左侧是一对空括号，表示方法没有参数。右侧仅包含数字 12.3。这等同于语句 `return 12.3;` 但省略了 `return` 关键字。\n\
    \n让我们看另一个例子。假设你想如下实现 `getValue()`：\n\n```\ndouble getValue()\n{\n    return 2\
    \ + 3;\n}\n```\n\n该方法没有参数，并返回 2 和 3 之和。我们可以将该方法重写为下所示的 Lambda 表达式：\n\n`() -> 2\
    \ + 3;`\n\n接下来，让我们看一个更复杂的例子。\n\n假设你想如下实现 `getValue()`：\n\n```\ndouble getValue()\n\
    {\n    int counter = 1;\n    int sum = 0;\n    while (counter<5) {\n        sum\
    \ = sum + counter;\n        counter++;\n    }\n    return sum;\n}\n```\n\n你可以将其重写为以下\
    \ Lambda 表达式：\n\n```\n() -> {\n    int counter = 1;\n    int sum = 0;\n    while\
    \ (counter<5) {\n        sum = sum + counter;\n        counter++;\n    }\n   \
    \ return sum;\n}\n```\n\n注意，这个 Lambda 表达式与之前的两个不同。首先，Lambda 体——Lambda 表达式的右侧——不是由单个表达式组成的（如前两个例子中的\
    \ 12.3 和 2+3）。相反，它包含一个整条语句。之前的两个 Lambda 体被称为**表达式体**（expression bodies），因为它们由单个表达式组成。相比之下，第三个例子中的\
    \ Lambda 体被称为**块体**（block body）。\n\n块体允许 Lambda 表达式的体包含多个语句。要创建块体，你只需要将语句封装在大括号中，如上面的示例所示。此外，必须在右括号后添加分号。最后，由于块体包含多个表达式，必须使用\
    \ `return` 关键字来返回值。这与前两个省略了 `return` 关键字的例子相反。\n\n现在我们已经熟悉了无参数 Lambda 表达式的工作原理，让我们看一些涉及参数的\
    \ Lambda 表达式例子。假设我们有另一个名为 `MyNumberPara` 的函数接口，如下所示：\n\n```\n@FunctionalInterface\n\
    interface MyNumberPara{\n    double getValue2(int n, int m);\n}\n```\n\n此接口有一个名为\
    \ `getValue2()` 的方法，具有两个参数 `n` 和 `m`。\n\n如果你如下实现 `getValue2()`：\n\n```\ndouble\
    \ getValue2(int n, int m)\n{\n    return n + m;\n}\n```\n\n我们可以将该方法重写为以下 Lambda\
    \ 表达式：\n\n`(n, m) -> n + m;` 左侧包含两个参数，右侧是计算返回值的表达式。在使用 Lambda 表达式时，我们不需要显式地声明参数的数据类型。但是，当我们调用\
    \ `getValue2()` 方法时，必须传入正确的数据类型。稍后我们将查看如何调用 `getValue2()` 方法。\n\n接下来，假设我们要实现 `getValue2()`：\n\
    \n```\ndouble getValue2(int n, int m)\n{\n  if (n > 10)\n    return m;\n  else\n\
    \    return m+1;\n}\n```\n\n我们可以将该方法重写为以下 Lambda 表达式：\n\n```\n(n, m) -> {\n  if\
    \ (n > 10)\n    return m;\n  else\n    return m+1;\n};\n```\n\n（等待，176-177 的 OCR\
