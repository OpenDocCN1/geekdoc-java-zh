    Collective Suffering and Survival:

    South Blitar During and

    After Trisula


    The Trisula operation sealed the dominant position of the New Order regime in
    1968, but the darker side of its legacy remained hidden in the villages of South
    Blitar. The operation lasted from June to September 1968. An estimated 2,000 people
    were killed. In the period from September 1968 to 1973, the government and military
    implemented a reconstruction and development programme in the area. The army portrayed
    its role in South Blitar as that of saviour, claiming it had saved the villagers
    from being manipulated by communists who were outsiders to the area. Instead,
    the population was persecuted for decades under the New Order regime, treated
    as potential rebels who had to be monitored and have their rights restricted,
    as a result of the 1968 PKI base in their midst.


    This chapter discusses the army''s perceptions about the villagers and how they
    were treated and after the operation, as well as the long-term effects on the
    area. I argue that these three factors combined to create a sense of collective
    victimhood among large sections of the population. Men and women experienced the
    operation differently according to gender, as we shall see.


    Before the operation commenced, Major General Jasin, in his troop briefing on
    31 May 1968, had emphasised that the army "must be able to win back the people"
    after the operation: so he warned soldiers "Do not injure (melukai) the hearts
    of the people.".¹ These words proved hollow, as the Trisula operation transformed
    the area and army-civilian relations in ways that adversely affected the population
    and destroyed their dignity.'
