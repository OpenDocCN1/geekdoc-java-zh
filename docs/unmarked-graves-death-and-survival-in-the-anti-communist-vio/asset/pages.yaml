    After Central Java, the PKI enjoyed its highest level of support in East Java.
    It was not surprising, therefore, that the PKI chose these provinces in which
    to carry out unilateral land occupations (aksi sephak) to pressure the government
    to enact land reform, following the passing of the 1960 Basic Agrarian Law. One
    reason for the party''s decision was the extent of landlandness in East Java,
    as desired their desire to heighten class struggle in the countryside. In 1964,
    the BTI began to occupy land around several towns, including Jediri, Jombang,
    and Bangil. These actions led to violent clashes in the countryside against landowners,
    Islamic religious groups and the army. The next chapter discusses how these land
    actions and responses to them contributed to the anticom violence in East Java.


    The PKI was a significant player in East Javanese politics and society up to 1965.
    Yet questions of how the province fitted into the history of the Left and leftist
    activism prior to 1965 in East Java remain underresearched, as is the question
    of what happened to the East Javanese Left after the pogroms began in October
    1965 until the final defeat of the Left in South Blitar. With the party seriously
    weakened, the remaining leaders chose the poor coastal region of East Java as
    the site of its most important regroupment base, believing that East Java and
    its regional party leaders and activist held the key to the party''s revival.


