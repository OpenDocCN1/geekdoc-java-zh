  md: 'The anti-communist violence that swept across Indonesia in 1965-66 produced
    a particularly high death toll in East Java. It also transformed the lives of
    hundreds of thousands of survivors, who faced decades of persecution, imprisonment
    and violence. In this book, Vannessa Hearman examines the human cost and community
    impact of the violence on people from different sides of the political divide.


    Her major contribution is an examination of the experiences of people on the political
    Left. Drawing on interviews, archival records, and government and military reports,
    she traces the lives of a number of individuals, following their efforts to build
    a base for resistance in the South Blitar area of East Java, and their subsequent
    journeys into prisons and detention centres, or into hiding and a shadowy underground
    existence. She also provides a new understanding of relations between the army
    and its civilian supporters, many of whom belonged to Indonesia''s largest Islamic
    organisation, Nahdlatul Ulama.


    In recent times, the Indonesian killings have increased attention, but researchers
    have struggled to overcome a dearth of available records and the stigma associated
    with communist party membership. By studying events in a single province and focusing
    on the experiences of individuals, Hearman has taken a large step toward a better
    understanding of a fraught period in Indonesia''s recent past.


    Vannessa Hearman holds a PhD in History from the University of Melbourne. She
    lectures in Indonesian Studies at Charles Darwin University in Australia.


    > “This extraordinary book documents with care, not only the horror of living
    through the 1965 killings, but also the political lives of members of the Indonesian
    Left.”

    — KATHARINE MCGREGOR, Melbourne University


    > Hearman''s moving account of resistance, survival and loss reveals the deep
    engagement of the Indonesian Communist Party with political life in East Java
    and the transformation wrought by military suppression.\n— ROBERT CRIBB, Australian
    National University


    ![](img/11e41e7c9922fd37c8b62c08d3a467eb_293_0.png)


    University of Hawai''i Press

