    # Arrest, Imprisonment and Disappearances


    On 22 October, after receiving instructions from Jakarta, Brawijaya commander
    Basuki Rachmat announced the temporary prohibition of the PKI and ten leftist
    mass organisations in East Java. Banned were the PR, Gerwani, BTI, Lekra, CGMI,
    the RKKS in Surabaya, the HSI, a faction of the teachers'' union, PGRI Noncentral,
    and SOBSI and unions under its umbrella. After the prohibition order was issued,
    the military and its allies stepped up their attacks against members and sympathisers
    of these organisations. From 23 October, all those associated with the named organisations
    had to report to the authorities twice daily.65


    Following the ban, state institutions suspended or terminated the employment of
    those in government and the public service who were suspected of involvement in
    the 30th September Movement.66 Wijono, who retained his position as governor,
    instructed the suspension of eight regents (bupati) and mayors for alleged involvement
    in the Movement. These were the mayors of Surabaya, Banyuwangi, Blitar, Magetan
    and Trenggalek, and the regent and mayor of Madiun, who were close to the PKI.67
    Caretakers, drawn mainly from the army, replaced them. District military commander
    Sukotjo replaced Moerachman as mayor of Surabaya.68 Local legislative and government
    purged “a member, sympathiser of—or were appointed to their positions as a result
    of nominations” by banned organisations.69


