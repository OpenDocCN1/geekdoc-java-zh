  md: 'In the early New Order period, a 1971 economic survey characterised East Java
    as a province that “combines some of the richest potential and some of the direct
    poverty of any area in Indonesia”.58

    It noted that the causes for this marked distinction were the province''s history
    of past political conflict, and geographic factors, such as differences in rainfall
    and soil fertility across the province. The following section unpacks this characterisation
    further by examining, chronologically, the nature of its economic development,
    the impact of history, and the combined effects of both on the population.


    Subsistence agriculture coexisted with modern estate in East Java. Plantations
    in East Java mainly produced sugar cane, coffee, tobacco and rubber.59 In the
    1920s, the province was the main source of the Netherlands East Indies'' sugar
    exports.,60 It became the most industrialised province by the 1930s, propelled
    by the rise of metal and engineering industries serving the sugar market from
    the late 19th century. Dutch and indigenous joint ventures in sugar required the
    support of metal and machinery workshops for the repair and maintenance of steam-powered
    machinery. The dominance of the plantation sector, particularly sugar, also led
    to the province being the most urbanised in the Indies, with Surabaya, Malang,
    Kediri and Jember towns that served the sector, becoming the largest in East Java.61


    For roughly 100 years, from the 1830s to the early 1930s, industrial development
    was concentrated in Surabaya. Howard Dick writes that the city was ideally located,
