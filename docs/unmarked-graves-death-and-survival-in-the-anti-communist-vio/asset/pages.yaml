    # Insiders and Outsiders: Gaining Villagers’ Cooperation


    Communists were not a foreign presence in South Blitar, as the army made them
    out not to be. Communists in the Brantas Battalion operated in the area during
    the independence struggle of the 1940s and, as Jasin himself had noted, the PKI
    won a sizeable majority of the vote in 1955. The population was involved in leftist
    organisations such as the BTI and Lekra-linked cultural groups. The army’s portrayal
    of villagers as having been manipulated and exploited by the communists robbed
    them of their agency and was quickly exposed as being wrong when the operation
    got underway. The boundary between activists and villagers was often not clearcut.
    Communists and villagers were not always separate categories.


    In spite of the army’s portrayal of the fugitives as uncomed, the arrival of thousands
    of soldiers brought more outsiders, who wielded force through their use of modern
    weapons. Policies introduced during the preparation phase of the operation quickly
    alienated the population. These included population and registrations and the
    replacement of village leaders with army caretakers. People’s movements were restricted
    when they had to pass through checkpoints and were prohibited from using shortcuts
    away from the main roads.


    The army overcame the villagers’ lack of cooperation through a combination of
    force and indoctrination. Songs and scripts were written to pressure the population
    to support the operation and to report communists, on the slogan 3M (Membantu,
    Menyerah atau Mati): “Assist, Surrender or Die”. The slogan spelt out three options
    for the people to assist (membantu) the army by searching for “PKI people” who
    were still in hiding; for the PKI people to surrender (menyerah), and for those
    who were neither willing to assist, nor to surrender, “there would only be one
    punishment, death” (mati), according to one army poster in the area.² Aircraft
    dropped leaflets over the villagers instructing the inhabitants to assist the
    army.


    Finding an insufficient level of cooperation among the villagers, the army began
    rounding up whole villages and herding their inhabitants into holding camps, where
    each villager could be interrogated. Between 22 June and 5 July, 12 holding camps
    were established throughout the South Blitar area, 6 in the western and eastern
    parts.³ Villagers recalled a time of great suffering. The army portrayed these
    holding camps as enjoying adequate facilities, but the conditions'
