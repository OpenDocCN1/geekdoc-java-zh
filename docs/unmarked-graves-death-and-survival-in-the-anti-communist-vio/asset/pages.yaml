    many others, at the grassroots level. While the party remained weaker in rural
    areas compared to urban areas, it attempted to address this imbalance by directing
    the work of the peasant organisation, BTI, in the hope of finding new recruits
    from rural areas. In schools and universities, the PKI also claimed influence
    by involving many youths in organisations such as IPPI and CGMI. The PKI fostered
    links with leftist parties abroad, as in China and the Soviet Union, enabling
    it to gain legitimacy in Indonesia and showing it as an important political leader.
    The PKI and its associated mass organisations represented a distinct current in
    Indonesian political and social life. They attracted millions to join, and to
    engage in other ways, such as participating in events and educational institutions
    run by the Left, reading various leftist publications, and contributing financially
    to the Left. They captured the imagination of some people whose recent experiences
    of war and revolution made them receptive and interested in ideas of how to build
    a new, prosperous society.


    The PKI could plausibly claim that its performance in the 1955 and 1957 elections
    showed the success of these rebuilding efforts. It became the fourth largest party
    in Indonesia following the 1955 elections. However, the PKI remained confined
    to the sidelines when it came to running government. The advent of Guided Democracy,
    a period of authoritarianism, and the increasing dominance of the army in politics
    created an even more difficult environment for the PKI. While PKI''s closeness
    to President Sukarno provided it with a measure of protection from the army and
    its political rivals, well as the ability to continue to exist and grow in an
    increasingly hostile atmosphere, leftist activists were imprisoned for insulting
    the government or running afoul of military administrators in the regions. Indonesia
    was under martial law until 1963 and there was no sign of general elections in
    the future that could have cemented the party''s place in Indonesian politics.
    The Left movement in Indonesia was large and powerful on the one hand, but on
    the other, it was constrained by the political situation and the structures of
    Guided Democracy from capitalising on its strength and mobilising its membership
    in pursuit of a greater role in government. The PKI sought to heighten the class
    struggle in the countryside from 1964 onwards, proving itself as staunch ally
    of the government in enacting land reforms. The party embarked on increased rural
    activism and land occupations, which resulted in the formation of a confrontational,
    anticommunist movement in the countryside, on the eve of the 30th September Movement.'
