    # Approach and Methodology


    In analysing the anticommunist repression in East Java, I have predominantly relied
    on oral history interviews, due to the paucity of historical documents dealing
    with the state’s practices of repression and with survivors’ experiences. Such
    an approach fits the radical origins of oral history, which focuses on underrepresented
    voices and attempts to redress the balance of historical accounting in their favour,
    replacing elites’ perspectives with those of people who are not traditionally
    seen as historical actors or who have suffered exclusion from official histories.¹141
    There are often written sources available on the lives of the marginalised or
    less powerful groups in society.


    There are other reasons for relying on the spoken word. This book focuses, in
    part on the survival strategies deployed by the Left. Clandestine or secret activities
    are seldom found in the written record. Illicit or underground activities in East
    Java, which were undertaken to protect political fugitives, have, by their very
    nature, been largely concealed by the actors because hiding fugitives are risky,
    especially from March 1966, when Suharto banned the party and leftist mass organisations.
    This political context, of an active PKI suppression campaign in the mid- to late
    1960s, led to some early scholarly writings on the 30th September Movement and
    its'
