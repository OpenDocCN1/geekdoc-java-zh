  md: 'When President Sukarno introduced the more authoritarian regime of Guided Democracy
    in 1959, he offered more space and protection to the PKI, in part as a counterbalance
    to the growing strength of the Army, and in part to strengthen its anti-imperialist
    foreign policy goals.


    In this context, PKI chairperson Aidit characterised Indonesia as a semifeudal
    and semicolonial society. In a seminar in 1964, he described the Indonesian revolutionary
    forces as consisting of four classes, namely the peasantry, the proletariat or
    working class, the national bourgeoisie and the petty-bourgeoisie.26 The PKI included
    the national and petty-bourgeoisie in its estimation of revolutionary forces because
    it recognised the need to cooperate with other national forces, including with
    President Sukarno. The PKI also regarded the Indonesian military as more pro-people
    as a result of its revolutionary origins and its support for the revolution under
    Sukarno. In this, the party departed from orthodox Marxism which characterizes
    the state as “a power which arises from society but places itself above it and
    alienates itself more and more from it”.27 Drawing on Engels’ analysis of the
    state, Lenin argued that the state developed because of the rise of a class society,
    thereby resulting in the need for public power supported by “armed people”.28
    The state relies on “special bodies of armed men” among an array of other mechanisms
    to perpetuate its existence. By this analysis, the Left should have regarded the
