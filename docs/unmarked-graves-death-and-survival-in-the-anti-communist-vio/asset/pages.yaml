  md: '# Conclusion


    with the commemoration, maybe in Indonesia we need 60 years too. Maybe we need
    60 years for people to acknowledge that the PKI members were innocent, maybe we
    need all the protagonists to die first.¹12


    Indonesians are fighting every day to open the door wider than ever, including
    Djoko himself who published his memoirs in 2013.¹13 Former Lekra-affiliated writers
    Putu Oka Sukanta and Hersri Setiawan, as well as history lecturer Harsuteje, whose
    experiences are reflected in this book, are three former political prisoners who
    have published and edited books and articles, and made films about various aspects
    of 1965 and the erasure of the Left from Indonesian history.¹14 They have been
    joined by a group of younger Indonesians, academics, researchers and activists.¹15
    It is because Indonesians themselves, although still in relatively small numbers,
    are speaking out and writing about 1965 that opponents-themselves are rising up
    and trying to stop them. The tussle between those who want to raise the 1965 events
    as a dark and bloody chapter of Indonesian history and those who want that version
    of history suppressed will continue, especially with the Indonesian government
    being unwilling to reopen national discussions into this past. Ordinary Indonesians
    are not waiting for the state. However, as in Havana in 1966 and The Hague in
    2015, they need solidarity from the international community. Over half a century
    after the massacres, and with fewer and fewer survivors left, justice still needs
    to be done.'
