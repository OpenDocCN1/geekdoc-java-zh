    tactics. The retreat from the cities provided a few dozen party members and sympathisers
    with a temporary reprieve from brutal detention, interrogation and torture. However,
    attempts at armed struggle were likely to fail, given the weakness of the PKI.
    Party members had little chance of success when faced with comprehensive military
    firepower during the Trisula operation. Rebuilding in a highly repressive and
    isolated context was bound to be difficult. Even so, despite the many arrests
    and long prison sentences, not to mention executions, many PKI activists and leaders
    preserved their liberty for longer than they might have otherwise done. Those
    captured and detained in connection with South Blitar were not indiscriminately
    killed like many PKI leaders in 1965–66.


    The base was, also significant for the response to this base, for the army and
    the New Order regime. The army’s commander Jasin’s decision to mount the Trisula
    operation, was part of his aggressive New Order strategy of East Java. This strategy
    included getting rid of Pro-Sukarno elements from state institutions and purging
    political parties such as the PNI. The presence of a PKI base provided Jasin with
    an opportunity to further his strategy in ways he could not have conceived of
    before. By deploying thousands of armed troops to conduct a ruthless operation,
    there was little chance of failure. The base provided the government with evidence
    that the PKI still represented a danger to society by pointing to all those who
    had been captured in South Blitar. By imposing upon them criminal proceedings
    through courts, and subsequent sentencing, the army showed that the New Order
    had suppressed the PKI threat successfully and in an orderly manner.


    Finally, Trisula’s significance was not just in its destruction of the PKI base
    and the PNI who had doubted the durability and strength of the military and the
    New Order. After the defeat of the East Java base, there remained only Sojan’s
    West Kalimantan base until that too was defeated in 1974 and Sojan killed.


