    operation to six, to enable closer surveillance of the often far-flung and remote
    villages.37


    As part of the rehabilitation phase from September 1968, the government initiated
    road building and other major construction projects. It recognised the lack of
    an adequate road system had hindered army operations in South Blitar in 1966–67
    and allowed communists to hide there. In fact, to prosecute the counter-insurgency
    campaign, the army had begun to lay down new roads during the Trisula operation
    itself.38 These efforts continued, as road construction extended to west and north
    to south, crisscrossing through the area, with the major Trisula Road constructed
    to link the whole area. These road construction projects opened up South Blitar
    simultaneously to the security forces, as well as to trade and commerce. The construction
    of the road network was part of establishing four economic and population centres
