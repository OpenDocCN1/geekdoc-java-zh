    # The 30th September Movement


    On 30 September 1965, army troops under the command of Lieutenant Colonel Untung
    of the Cakrabirawa palace guards fanned out across Jakarta, moving in the direction
    of the homes of several high-ranking army officers, with the intention of abducting
    the men to expose them as disyal to Sukarno and to replace them as army leaders.
    That night and into the next day, the group calling itself the 30th September
    Movement killed seven army officers. Army commander Lieutenant General Ahmad Yani,
    his Third Deputy, Major General MT Harjono and his assistant, Brigadier General
    DI Pandjaitan, died during the abduction attempt. Three other men, Yani''s second
    deputy, Major General Suprarto, his assistant, general Lieutenant General Sutojo
    and his, Major General S. Parman, were taken alive to the airforce base at Halim
    Lubang Buaya in eastern Jakarta before they too were killed. Another target of
    the kidnapping, Minister of Defence and Armed Forces Commander, General Abdul
    Haris Nasution, managed to evade the troops by jumping over the back wall of his
    home, but his adjutant, First Lieutenant Pierre Tan, was abducted instead and
    later killed at Lubang Buaya. Nasution''s five-year-old daughter, Ade Irma Suryani
    was shot and killed. The deaths of the army officers and the little girl were
    disastrous, and it seems that the Movement''s leaders had not planned for the
    killing of the army officers.'
