    fell in 1998, we have started to get a glimpse of what happened after 1 October
    1965 for the Left. In the post-Suharto environment, a few victims have regained
    their courage and written memoirs and autobiographies. Their main aim is to profess
    their innocence and to explain the injustice of incarceration. Some have gone
    further and written of political lives, activism and dreams that were radically
    cut short by the repression. Fewer still have dared to openly proclaim that they
    had resisted the New Order. Buried with the mass killings was the multitude of
    stories of what the Left did next. These stories are not well known, particularly
    in the cases of those who have not written a memoir or felt courageous enough
    to speak about their experiences. This book has recovered some of those stories.


    Based on interviews with people who at the time of these violent events were activists
    and leaders of the Left in East Java, as well as their opponents, I have reconstructed
    these cataclysmic times which had long been pushed aside, but yet reverberate
    in the day of suffering, survival and defense. While the world forgot or turned
    away decades, many Indonesians were busy seeking ways to survive and to live meaningful
    lives, despite the degrading conditions in which they were placed. James Scott
    contends that “even a failed revolt may achieve something”, including “a memory
    of resistance and courage that lie in wait for future”.By overlooking the importance
    of the PKI, including the way in which it was destroyed, we risk failing to understand
    the workings of an ideology and its interpretations and application among a significant
    section of the Indonesian people. We also risk failing to understand the deep
    roots of popular resistance and struggles for better living conditions in that
    country.


    The rise of a new generation of youth in the late 1980s, some of whose members
    began to bring about the end of the Suharto regime, might have shown members of
