    and the southern limestone coastal areas of the province and the dry plains of
    the northwest near Boonegoro were "among the most poverty-stricken in the world".72


    After independence, agricultural production continued to coexist alongside plantation
    cultivation, even though the heyday of sugar was well past. In 1958, plantations
    occupied 209,000 hectares of land in East Java. Based on available data, about
    20–25 per cent of land in the province was under forest (as of 1971), and so pressure
    on agricultural land was high.73 In the 1950s and 1960s, people cultivated mostly
    rice and cassava, followed by maize.


    In East Java, struggles over land were important, as the most significant sectors
    of its economy, agriculture and plantation cultivation, required access to land.
    Land was in high demand, but many families did not own land and those who did
    have some access to it had no secure legal tenure, with data collected by one
    peasant organisation suggesting that, in 1950, 70 per cent of farmers owned one
    hectare or less of land (both for wet rice cultivation and irrigated land).74
    Despite this fragmentation of land ownership, most farmers were landless. There
    were also few large landowners, defined as people owning more 20 hectares. In
    East Java, almost a third of regencies had no landowners with more than 20 hectares,
    and two regencies had no owner with land over 10 hectares.75 Agricultural productivity
    was low, as farming was reliant on labour-intensive methods with little mechanisation
    and fertiliser.


