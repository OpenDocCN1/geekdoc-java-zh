  md: '# Conclusion


    Left party has not. The task of Indonesia''s new Left might not have been so difficult
    had the destruction of the old Left not been so severe, but it is hard to speculate
    what the Indonesian Left might have looked like in the absence of the 1965–66
    repression.


    As Indonesian politics scholar Veid Hadiz pointed out, "It is easy to forget that
    the process of establishing the New Order... was a rather long and drawn out process."
    This book has turned attention back to the time of ferment that accompanied the
    creation of the New Order, to understand the regime''s path to winning broad acceptance.
    Transition to Suharto held did not occur easily, with the survival of the Left
    and initial discontent among other groups about the army takeover. Remnants of
    the PKI represented one group of people who, if they joined effectively with others,
    had the possibility of challenging the army, if not militarily, then politically.
    The army crushed the PKI''s efforts resoundingly in South Blitar in 1968 to drive
    home a political message that the New Order would prevail.


    The transition to New Order in East Java therefore had national significance in
    securing legitimacy for the regime. The 1965–66 repression had been part of a
    longer transition towards army-dominated rule, and the violence continued after
    1966 to consolidate that type of government. Violence was the foundation of a
    counter-revolution that overturned the course Indonesia had been following under
    Sukarno, the rise and survival of the New Order produced both winners and losers.


    The task of historical reconstruction has present-day implications because the
    doors to justice have opened slowly for survivors of the 1965–66 repression. Indonesian
    governments in the post-Suharto era had not formally recognised that the overwhelming
    majority of victims who were killed and imprisoned had nothing to do with the
    30th September Movement and suffered a great injustice. Victims obtained a small
    measure of official recognition in 2012, when Komnas HAM released its report into
    the violence. Komnas HAM considered the violence to constitute crimes against
    humanity and saw responsibility as resting with military officers throughout the
    territory. Even this small step, however, came too late for many victims, who
    had already died. The slow process in gaining official recognition underscores
    the urgency of making new histories in Indonesia while informants are alive and
    for whom these history-making exercises matter a great deal.'
