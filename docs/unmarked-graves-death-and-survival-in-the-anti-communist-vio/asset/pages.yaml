  md: 'The PKI campaigned for a socialist (and eventually communist) society by engaging
    in ceaseless organisational activity, such as running literacy campaigns and education
    courses, organising peasant labourers to demand a fairer distribution of crops
    and access to state-controlled land, holding protests and meetings of women against
    rape and underage marriage, and organising workers for improved wages and working
    conditions. Gerwani, SOBSI-affiliated unions and other leftist mass organisations
    conducted similar work, engaging in education and propaganda work among their
    members and supporters, and organising them in local units to expand their reach
    and influence. They brought such local activities into play with international
    solidarity, engaging Indonesians, for example, in mass actions and other activities
    promoting peace, independence and the right to self-determination for Algeria
    and Vietnam.


    During the 1950s and 60s, the PKI reformulated classical Marxism as part of its
    effort to adapt the Western-derived ideology to an Indonesian context.23 Rex Mortimer
    characterises the PKI under Aid as “the most outstanding example among major communist
    parties of a trend away from class strategy”.24 While party leaders deployed class
    theory and utilized class categories in explaining strategic concepts, “the influence
    of other bases of social cleavage upon the PKI’s political work”.25 Mortimer has
    argued that this approach was a result of Indonesia’s social structure and political
    history in which class was not as a dominant source of conflict as other social
    cleavages. Indonesia was a country overwhelmingly composed of peasants, with low
    differentiation of property ownership levels, and an underdeveloped national business
    sector. In recognition of Indonesia’s underdevelopment, party leaders viewed the
    national bourgeoisie as potential revolutionary allies, against continuing foreign,
    most notably Dutch, control of the economy. In the 1950s, Dutch companies controlled
    shipping and other transportation, as well as some of the major industrial estates
    in Java. The party’s ideological standpoint reflected party leaders’ pragmatic
    concern that the PKI should be able to work with non-Marxist social actors in
    the first decades of independence.


    This attitude also evolved alongside major political changes. In 1948, Musso’s
    strategy of confrontation set the scene for the bloody repression of Madiun. In
    the early 1950s, Aidit and his comrades were searching for a formula that would
    allow the party to grow in the relatively open environment of parliamentary democracy.'
