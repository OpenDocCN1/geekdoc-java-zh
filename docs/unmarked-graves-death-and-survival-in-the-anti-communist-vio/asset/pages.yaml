  md: '# The Massacres in a Global Context


    This large-scale anticommunist violence must be placed in a global context, as
    it was of worldwide significance and altered the course of the Cold War. In 1966,
    the US Time magazine had referred to Indonesia as "the land the communists lost"
    and hailed the rise of General Suharto and, by implication, the massacre of half
    a million communists, as "the West''s best news for years in Asia." 1965–66 repression
    was much more than the destruction of one party in Indonesia, but had significant
    implications for the global communist, socialist and national liberation movements.


    A group of Indonesians tried to internationalise the plight of their countrymen
    and women by pleading with 500 delegates at the Tricontinental Conference in Havana,
    Cuba in January 1966 for the world to stop the massacres and to shore up President
    Sukarno''s position. Indonesians had been centrally involved in organising this
    leftist conference, which brought together participants from Asia, Africa and
    Latin America to deepen cooperation between the three continents. The conference
    provided the Indonesian delegates with a platform to urge a sympathetic audience
    to express solidarity with Indonesia.


    During the conference, the leftist Indonesian delegates held several discussions
    with Cuban president Fidel Castro, who was very sympathetic to their cause. In
    his closing address, Castro told the delegates:


    > I do not want to close without mentioning... a concern which affects us all
    in the face of the events in Indonesia, confronted with the reports reaching us
    from Indonesia that more than 100,000 revolutionary militant individuals have
    been savagely assassinated, with the report that Ait and some other Communist
    Party leaders in Indonesia have been assassinated. We would like to register our
    reproach, our protest, and our solidarity with the Indonesian revolutionaries,
    today persecuted by militarist reaction, frightened by Yankee imperialism.


    Despite Castro''s words, the anti-imperialist forces that were gathered in Havana
    were weak and divided. Both the Soviet Union and China conveyed protests to the
    Indonesian government about the repression, but the Sino-Soviet split weakened
    the socialist camp. As China and Indonesia broke off diplomatic relations in 1967,
    China could do little to assist Sukarno or the PKI. Hundreds of Indonesians,'
