  md: '# The Villages of Widows


    The gender divide was evident in the different ways that men and women experienced
    the operation. Some women have still not spoken openly about their experiences
    of the operation, even to their closest family members. Men were forced to take
    part in search and patrol work and physically heavy tasks such as grave-digging
    and guarding detainees. They were also more likely to be killed, when they went
    on the run. Women suffered the loss of male family members and relatives, and
    became victims of abuses specific to their gender. Zainab said that, during the
    operation,"All the women were considered to have no men, widows all of us."20
    Indeed, women suddenly "became widowed", because most adult men fled to the forests
    to avoid engaging with the army. For many women, being widowed in a figurative
    sense quickly became being widowed in a literal sense, as men were killed or imprisoned
    over the course of the operation and afterwards. In the following sections, I
    discuss the experiences of three South Blitar women in this regard.


    During the operation, the army ordered villagers to post lists on the front of
    their houses containing the names of those residing within. Household population
    registers made it harder for fugitives to find shelter with local families. Searching
    for her husband who was not at home, the army interrogated 20-year-old Zainab
    as to her husband''s whereabouts. Her claim of ignorance earned her the army''s
    retribution, after another villager revealing his place in the field. After shooting
    her husband dead, the soldiers returned to find Zainab. They told her to strip
    to her underwear and to lie face down on a wooden bench in her kitchen. Beating
    her with a cassava plant and a piece of rattan, the soldiers proceeded to examine
    her for a stamp or a marking, as part of the mythology the army circulated during
    the 1965–66 repression that Gerwani members were tattooed on hidden parts of their
    body as part of their membership rituals. This myth gave licence to male captors
    to touch, feel and look at women''s bodies on the pretence of searching for the
    stamp. Zainab recalled,"They said my thigh had a PKI stamp, but there wasn''t
    one. I showed [them] my thigh and said, ''Here sir, there is no stamp of anything
    on my thigh.''21


    The pain of losing their husbands was then compounded by the widows'' marginalisation
    in dealing with the men''s deaths. Zainab''s husband was shot in the foot and
    his mouth was filled with sand in a gesture of contempt. She was prohibited from
    retrieving his body'
