    # Survival and Resistance


    The euphoria of having survived and being able to move freely was quickly replaced
    with the realisation that the PKI could not stand still and expect to be spared
    in the long. The massacre of communist leaders, party members and sympathisers
    made party leaders realise legal avenues were no longer available to them. While
    many had no previous experience in using arms, they saw armed resistance as a
    necessity, dictated by the threat they faced. Rewang put it, “Our departure to
    South Blitar was based on the view that there was no longer any legal guarantee
    for communists. The possibility for peaceful struggle had disappeared. We needed
    to take up armed resistance.”51 Munir, in his defence speech at his trial in 1973,
    further explained that PKI leaders agreed on the need for an armed revolutionary
    movement in South Blitar, aimed at achieving popular democracy (demokrasi rakyat).52
    Those who had been “hunted like animals” could legitimately resist,53


