    # Conclusion


    The 1948 Madiun Affair was a huge setback for the Left politically.

    However, the PKI tried to rebuild from 1949 onwards by reestab-

    lishing its illegal wing and working through other leftist parties,

    as as the Socialist Party and the Labour Party. A new leadership under

    Aidit took charge from 1951 and put the PKI on a different footing.

    The Aidit leadership team reconstructed the PKI into the legal, mass

    party that became the world’s third largest communist party by 1965.

    They held membership drives and expanded the party’s publishing

    education programmes, alongside literacy campaigns organised

    by the PKI and mass organisations such as Gerwani. The PKI also

    expanded its influence through unions such as Sarubpri, Sarbuki and'
