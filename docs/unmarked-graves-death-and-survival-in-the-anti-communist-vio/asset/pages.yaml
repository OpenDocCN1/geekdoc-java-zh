    villagers’ use of shortcuts, especially through forested and uninhabited areas.
    The small roads and paths previously used by local villagers were either closed
    or patrolled, leading them to the newly constructed or repaired major roads.40


    As well gaining easier access to these villages through an expansion of road construction,
    the army tightened security in other ways. It established guard posts and offices
    for village non-commissioned officers (Babinsa, bintara pembina desa), along with
