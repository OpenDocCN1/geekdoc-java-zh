  md: 'The rest of this chapter provides a background to the three major areas covered
    by this book: the history of the PKI, the 30th September Movement and the province
    of East Java. It then discusses the subsequent histories of the Indonesian Left
    over the decades, and how the field has been impacted by recent political changes
    globally and in Indonesia. In doing so, the section locates the Indonesian Left
    within a body of work dealing with histories of the Indonesian Left and shows
    that it was a little-discussed topic prior to May 1998 in Indonesia and internationally.
    The final sections discuss the approach and methodology of the study, and an outline
    of the other chapters in this book.


    # The Indonesian Communist Party: Its Beginnings


    To understand the 1965 repression and its aftermath, it is first necessary to
    review the history of the PKI and its organisational and political achievements
    in the early decades of Indonesian independence. The PKI was the first communist
    party in Asia to be established, and one of the largest and most influential of
    such parties for years. It was founded in 1914 by Dutch social democrats, in what
    then the Netherlands East Indies, as the Indies Social Democratic Association
    (Indies Sociaal-ocratische Vereeniging, ISDV).¹¹ On 23 May 1920, it became the
    PKI, and in December of that year, joined the Communist International (Comintern).¹²


    In PKI''s early years, communists worked with Islamists and nationalists within
    the Islamic Union (Sarekat Islam, SI), the Indies'' most important radical organisation,
    which had hundreds of thousands of members. Communists, however, faced stiff opposition
    from other political currents within SI. After years of fighting, the SI split
    in 1923, with communists winning only a minority of branches.¹³ The PKI set up
    new branches and controlled “Red Si” branches, the split was a significant setback.¹⁴


    Following the failed 1926–27 revolts in West Sumatra and West Java, the Dutch
    banned the PKI and imprisoned thousands of its militants. The PKI operated as
    an underground party during the remainder of the Dutch. The Dutch elected some
    1,300 communists to Boven Digul in Dutch New Guinea following the 1926–27 revolts.
    The subsequent invasion of the Japanese in 1942 did not result in the lifting
    of the ban. During the following three years of Japanese occupation, communists
    continued to organise politically underground or through front groups.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# The Indonesian Left


    On 17 August 1945, Sukarno and Mohammad Hatta declared Indonesia’s independence,
    following the defeat and surrender of the Japanese. The PKI could operate openly
    again from October of that year, but over a four-year period of the Indonesian
    Revolution, Indonesians still had to fight Dutch attempts to recolonise their
    territory.¹15 The PKI was a member of a coalition called the Left Wing (Sayap
    Kiri), established in 1946. The Socialist Party (Partai Sosialis, PS) was the
    largest party in this coalition; the Indonesian Party (Partai Buruh Indonesia)
    and Indonesian Socialist Youth (Pesindo, Pemuda Sosialis Indonesia) were also
    members.¹16 All Indonesia Trade Union Centre (Sentral Organisasi Buruh Seluruh
    Indonesia, SOBSI) and the Indonesian Peasants’ Union (Barisan Tani Indonesia,
    BTI) also supported the Left Wing.¹17 Members and supporters of the party took
    part in the armed and diplomatic struggle against the Dutch.


    With a stalemate in the fighting and diplomatic negotiations, differences arose
    among Indonesian nationalist leaders over strategy. Following the signing of the
    Renville Agreement in 1948, the cabinet under leftist Sjaruddin came under heavy
    criticism. The 1948 Renville Agreement affirmed Dutch de jure sovereignty over
    Indonesia, and Indonesian troops had to be withdrawn behind Dutch lines into the
    small, republican-held areas of Central and East Java.¹18 Sjaruddin believed the
    agreement was unavoidable in order to prevent a Dutch military assault, but he
    was widely criticised by key political parties for his approval of the agreement.
    His cabinet collapsed when Masyumi and the Indonesian Nationalist Party (Partai
    Nasional Indonesia, PNI) withdrew their support, and Sjaruddin resigned on 23
    January 1948. A new cabinet under Mohammad Hatta was established, a cabinet which
    the Left believed to be detrimental to its interests.


    The Left reorganised itself into a new formation called the People’s Democratic
    Front (Front Demokrasi Rakyat, FDR) in February 1948. Six months later, the PKI
    leader, Musso, returned from Moscow where he had lived in exile since 1935. He
    criticised the FDR and its earlier iteration, the Left Wing, for prioritising
    alliances with nationalist elite politicians at the expense of organising progressive
    social sectors, such as workers and farmers.¹⁹ In his view, the PKI should organise
    and lead popular struggles against the Dutch through the formation of a National
    Front government. Under the National Front, elected popular councils would be
    the primary form of government. The August 1948 PKI congress adopted a resolution
    that embodied these views, entitled “The New Road”. At the congress,'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'the Socialist Party and the Indonesian Labour Party dissolved into the PKI,
    forming one united party.


    At the same time, the Hatta cabinet introduced policies of rationalising and restructuring
    the military that at time consisted of regular troops, as well as a number of
    people’s militias (laskar) and fighting units. Hatta’s policy generated tension
    and unrest in the military, especially severe in areas of East and Central Java,
    as troop numbers were reduced and officers were replaced.


    These tensions, combined with a new, reemerged Left with a new, radical political
    manifesto, culminated in the seizure of the East Javanese town of Madiun, on the
    border with Central Java, by Pesindo''s command on 18 September. Sumarsono declared
    a PKI-led National Front government in the area.²0 Even so, Swift survived that
    the PKI leaders were most likely surprised by this turn of events.²¹ The republican
    government reacted forcefully to the events at Madiun and its troops crushed the
    movement in a little less than two weeks. In the following chapter, the aftermath
    of the Madiun Affair and how it entrenched divisions between the Left, Islamic
    groups and the army are discussed.


    # The PKI under Aidit


    Independence finally came with the Dutch transfer of sovereignty in December 1949.
    The PKI elected a new leadership and rebuilt its institutions, after years underground
    and following the fallout from the Madiun Affair. From 1951, a new generation
    of PKI leaders took over, with Dipa Nusantara Aidit as chairperson, and Njoto
    and Lukman as deputies. These men were heavily influenced by their involvement
    in the independence movement.²² They saw the independence period as ushering in
    a new era of political activism aimed at improving the welfare of Indonesians
    and providing new avenues for growth and promotion of socialist ideas for the
    PKI. Popular support resulted in rising membership in the party and the mass organisations
