    # Trisula Operation


    For Bwijaya commander Jasin, defeating the PKI in East Java was crucial to ensure
    a strong transition to the New Order in the whole of Indonesia. Several military
    operations against the Left had taken place earlier. In 1967, the military had
    mounted Operations Clean Sweep I and II in West Kalimantan against the PKI and
    PGRS/Paraku forces.⁸⁰ Operation Erode (Kikis) I in the Grobogan Regency in Central
    Java attacked remnants of the PKI there.⁸¹ But the base in East Java was the most
    prized target, according to army intelligence, the highest-ranking PKI leaders
    in Indonesia were there, and had been joined by a trickle of former soldiers and
    officers, and other Sukarno supporters. After the failure of intelligence and
    limited military operations in May 1968, Jasin was anxious to mount a larger operation.
    He also wanted to do so because he felt that the desire to crush the PKI had waned
    among elites, political parties and the military in East Java, likening it to
    a rice cracker that had lost its freshness⁸²


    As Bwijaya commander, Jasin explained to the East Java parliament in July 1968
    the reasons for his concern about ensuring the Trisula operation remained firmly
    under military control. One of the reasons harks back to the military''s goal
    of limiting the power of religious groups, such as NU, formerly a coalition partner
    of the military in suppressing the PKI in the province in 1965–66, but successive
    Bwijaya officers had to contain as as early as January 1966. Jasin stated:


    Some people and leaders have asked, why we can''t just return to the 1965 style
    of eradicating the PKI. No, because this would create anarchy and this is dangerous.
    We do not want a return to 1965, as some political organisations wanted. At that
    time [in'
