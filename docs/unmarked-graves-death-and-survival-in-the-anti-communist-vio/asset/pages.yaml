    # Rebuilding and Redesign: Land, Food and Life


    The operation left a population traumatised by their treatment at the hands of
    the military. The figure army supplied, of 2,000 dead, no doubt included a number
    of local villagers, as in Rewang’s estimate only several dozen PKI members entered
    South Blitar from elsewhere.29 The villagers urgently needed a stable food supply
    at the end of the operation. The forced evacuation of villagers and military instructions
    to villagers to pull out food crops had disrupted food cultivation; and food became
    a critical postoperation issue. The army recommended that food staples be provided
    to prevent hunger-related diseases and avert a famine.30 The local government
    provided army wives such as Pertiwi, Persist and Bhayangkari staffed stands at
    the night fair celebrating Indonesian independence in mid-August 1968, in the
    dying days of the operation, selling subsidised rice to villagers.31 To take into
    account the population''s lack of cash, the government introduced a system of
    barter, whereby local produce such as coconuts could be traded for subsidised
    commodities such as sugar and kerosene, made available through local village administration.32


    In the following sections, I trace how the reconstruction and development of this
    area accorded opportunities for the military and the government to introduce new
    regimes of life. Presiding over'
  merge: -1
  pgno: 198
- img_proc: true
