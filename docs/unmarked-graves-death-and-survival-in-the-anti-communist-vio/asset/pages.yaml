    the rebuilding of South Blitar, the government set out to transform all aspects
    for life, using mechanisms such as physical construction projects and changes
    to local government boundaries. The Brawijaya commander Major General Jasin had
    requested in July 1968 that parliament allocate a budget for South Blitar''s rehabilitation
    after the operation.³33 Though there was heavy military involvement, civilian
    government formally took charge of the area when the operation ended, with the
    East Java governor, Mohammad Noer, heading the next phase of reconstruction and
    development, assisted by the regents of Blitar, Malang and Tulungagung, those
    regencies also affected by the Trisula operation. The provincial government financed
    this next phase, with assistance from the central government.


    After the operation, the authorities assessed the population''s level of trust
    in the government and the army, as they prepared to implement a reconstruction
    and development programme. In data collection exercises from September 1968, the
    army conducted a census, registered the population and identity cards to all citizens.
    In Sector A, for example, Battalion 521 conducted a census in each village, recording
    the number who left their residences and the number of "PKI and bandits".34 The
    programme commenced under the Blitar regent, Sanoesi Prawiroirdarjo, from the
    end of the operation on 7 September 1968 and lasted until 16 December 1968.³35
    However, many of the changes to South Blitar villages can be traced to have begun
    even earlier.


    The government established new local government boundaries in South Blitar, while
    maintaining the caretaker system of government involving soldiers and army officers
    acting in various village administration roles. The involvement of the military
    in village government positions lasted, in some cases, for several years. However,
    compliant local village chiefs who had been screened and declared to be politically
    clean also ruled the area. During the operation, the military divided all local
    officials into four categories. Those whose "motivation was doubtful" and those
    who were "weak, incapable" or "suspected of having links to communists" were stood
    down. Those who "had come to their senses (insaf) and who had assimilated the
    contents of the state philosophy, the Pancasila and the 1945 Constitution" could
    continue to be employed.³36 New local government positions were created in South
    Blitar after the operation and local boundaries were redrawn and new administrative
    areas, subdistricts, were created. The number of subdistricts increased from three
    before the'
