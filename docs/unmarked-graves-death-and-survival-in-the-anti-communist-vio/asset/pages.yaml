    pro-independence party, the Revolutionary Front for an Independent East Timor
    (Frente Revolucionária Timor Leste Independente, Fretilin). The New Order also
    jailed more of its political opponents and critics in Indonesia, not just from
    the left of politics. The Indonesian Left broke its isolation as a result of these
    developments, though they were no longer the prominent political players they
    had been and instead seen as powerless victims.


    Indonesia today has an opportunity to deliver justice to those who were incarcerated,
    without trial, and to those who lost ones in the anticommunist killings. The Suharto
    regime fell two decades ago in 1998 and the Cold War has supposedly come to an
    end. Since 2014, for the first time since Sukarno, Indonesia has a president who
