    # Conclusion


    Major General Jasin''s words on 31 May 1968, urging his troops not to hurt the
    hearts of the people, were not put into practice, because to make his counter-insurgency
    operation a success, it was necessary to attack the population and hurt them,
    not only in their hearts, but in myriad ways. Suginome spoke of how her “heart
    couldn''t bear it” when she remembered the plight of her family, of her husband
    herded along other village men like cattle, their backs raised in welts after
    the beatings they received. It was no wonder that the military feared reprisals
    from the sons and daughters of such men, so much so they proposed the removal
    of those who had lost their fathers in the operation.


    Unlike the military''s portrayal of the population as simply being infiltrated
    by communists from without, the real picture was much more complicated than that.
    The case of South Blitar highlights instance of some of the meanings attached
    to the PKI and leftist organisations by ordinary people. When leftist organisations
    and leaders had become accepted as an ingrained and legitimate part of local political
    and social life, the military and government''s task to cleave away from the population
    was bound to be complicated and bloody. Through the military''s policies of surveillance
    and other forms of social control following the operation, and for decades afterwards,
    “South Blitar” became part of a political identity carried by its people, unified
    by their collective wounds.'
