    # Kediri and Bangil: A Comparison


    Perpetrators, too, harboured secrets and hid many aspects about the killings,
    and often continue to do so to this day. In spite of the greater openness after
    fall of Suharto, or perhaps because of it, it was difficult to find many perpetrators
    prepared to speak about the operations. Some feared they could be subjected to
    legal proceedings. It was not possible to find perpetrators of the killings who
    were willing to be interviewed in geographic areas that precisely corresponded
    with those of the victims of the political repression whom I interviewed, but
    I did manage to interview those with intimate knowledge of the operations in Kediri
    and Bangil. A discussion of these two areas allows us to make some comparisons
    between a town with strong communist support before October 1965 (Kediri), and
    a town in which the communists enjoyed less support (Bangil), providing us with
    insights into the killing process and its aftermath.


    Kediri was predominantly an agriculture-based regency, and industries such as
    sugar mills dotted around the countryside. The 1961 population census recorded
