    # Conclusion


    This chapter has traced the outbreak of the army-driven repression in East Java
    that resulted in the deaths of 200,000 people in a matter of months. I have discussed
    several case studies and interview testi-monies that shed light on the actors
    and patterns of the violence, mostly the security forces and civilian militias,
    especially those in the NU-linked Ansor youth organisation and its paramilitary
    force, Banser. Furthermore, this chapter has traced how army officers and Islamic
    religious leaders mobilised and incited civilian perpetrators, key actors in the
    violence, by using fear and terror, as well as by emphas the differences between
    adherents of Islam and the Left. The case studies have demonstrated the continuing
    ambiguities and silences surrounding the anti-PKI alliances, as eyewitnesses and
    perpetrators are still un-willing to implicate army structures and personnel in
    the violence. The silence of key eyewitnesses and perpetrators is also to blame
    for the large gaps in information about detention and disappearances in this period.
    Through interviews and an analysis of written memoirs, I have examined the suffering
    of detainees who spent months or years in detention without knowing much about
    what their future held. They witnessed the torture, mistreatment and disappearance
    of their fellow detainees, with prisons and detention centres supplying for victims
    for killing by Banser members. Years later, most remained angry and traumatised
    by what they saw. They and the comrades, family members and friends of the missing
    continue to search for those who disappeared from detention.'
