  md: '# A Note on Spelling and Textual Conventions


    In this book, I have used mainly the Indonesian spelling that has been in use
    since 1972, whereby dj became j, j became y, tj became c (pronounced ch). Exceptions
    are personal names where individuals have opted to continue using the old spelling,
    and the titles of books and newspapers that use the old spelling. With individuals''
    names, I have mostly used the Indonesian u, despite many people still opting to
    use the old spelling of oe, which originated from Dutch.'
