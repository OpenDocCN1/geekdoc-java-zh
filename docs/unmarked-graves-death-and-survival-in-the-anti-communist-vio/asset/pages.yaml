  md: '# Conclusion


    intimidation and violence, often with the collusion of security forces, is happening
    with greater frequency.¹10


    Just as the Indonesian delegates in 1966 at the Tricontinental Conference looked
    to the international community to act, thus certain international developments
    have assisted in rising open the doors to justice. Internationally, the prize-winning
    documentaries of Joshua Oppenheimer, The Act of Killing and The Look of Silence,
    have drawn world attention to the 1965–66 violence, bringing this case to new
    generations in Indonesia and around the world.¹¹ The-national People’s Tribunal
    1965 (IPT 1965), held in The Hague in 2015, found that the Indonesian state had
    committed crimes against humanity and genocide. Komnas HAM asked President Obama
    to assist by opening up files into the violence. In contrast, Indonesian politicians
    rejected the findings of the Tribunal and warned Komnas HAM not to sacrifice national
    sovereignty by asking for US cooperation. Showing of Oppenheimer’s films on university
    campuses and meetings held to publicise the IPT 1965’s outcomes are regularly
    shut down.


    The relationship between the international arena and what happens in Indonesia
    itself is complicated. Developments in the international arena can assist in pressuring
    the Indonesian government to provide certain measures of redress for the victims,
    such as an apology, but they cannot replace what Indonesians themselves have to
    do to address this past. Success in the international arena can sometimes backfire,
    as the nationalistic responses of Indonesian politicians to the IPT 1965 show.
    Still, Indonesians draw heavily on international examples of accountability and
    memorialisation. One of my interviewees, Djoko Sri Moeljno, now very elderly,
    with less and less mobility, was educated in the Soviet Union as a metallurgist.
    As a talented, intelligent and strong young man with a bright future ahead of
