    1953, in the lead up to the Gerwis East Java regional conference, it reported
    having 37 branches in East Java and over 7,000 members, with preparations for
    53 more branches.⁹⁰ It also reported having 52 literacy groups with 1,300 participants,
    29 handicap groups with 530 members, 17 branches holding cadre courses and kindergartens
    set up in 8 localities with 304 pupils.¹¹ In 1954, Gerwis changed its name to
    Gerakan Wanita Indonesia (Gerwani, Indonesian Women''s Movement) to broaden the
    appeal of the organisation to women.


    With the spread of Gerwani branches, women assumed leadership positions in local
    committees and branches. Gerwani provided many women with the experience of organising
    with other women and to be part of public life.¹² Women''s sense of identity and
    perception of their role in society changed, as I outline in the life stories
    in the next chapter. These changes threatened the notion, held in Java, of *kodrat*,
    women''s destiny arising from their innate characteristics.³


    Gerwani emphasised the importance of education, promoting the work of Javanese
    feminist and noblewoman Kartini (1879–1904), a familiar figure to most women,
    especially in Java. Gerwani activists highlighted not only her passion for girls''
    education, but also her criticism of Javanese feudalism and its negative effects
    on women.⁴ As well as providing literacy classes for women, Gerwani also expanded
    childcare access and education for poor children by establishing a network of
    kindergartens, the Jasmine (Melati) kindergartens by the mid-1950s.¹⁵ The kindergartens
    and creches employed teachers who had been given basic training in education.
    Parents sent their children to these facilities small amounts of money if they
