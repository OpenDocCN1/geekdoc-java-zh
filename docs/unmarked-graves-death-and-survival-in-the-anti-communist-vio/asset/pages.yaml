  md: '# 1


    # The Indonesian Left:

    Writing Its Histories


    After the fall of the Suharto regime, Father has felt more open about speaking
    out and I feel less oppressed than before. I would not have felt okay about meeting
    you before then. I try to communicate with my kids about what happened in 1965,
    giving them different versions of the story, but I have not been able to tell
    them about the history of their grandparents yet.


    Decades have passed since the army-led suppression of the Indonesian Communist
    Party (Partai Komunis Indonesia, PKI) in 1965–66, in which half a million people
    were killed. After the killings, the authoritarian New Order regime led by President
    Suharto ruled Indonesia for 32 years. During that time, former members and sympathisers
    of the PKI were stigmatised and discriminated against. Suharto''s rise, in the
    midst of the Cold War, was hailed as "the West''s best news for years in Asia"
    by Time magazine in the United States. After the New Order fell in May 1998, many
    survivors began to speak about their experiences of detention and of the persecution
    that had continued the years behind bars.


    Despite the time that has passed since those events, their legacy continues to
    have an impact on the lives of many ordinary people. The repression began after
    a group calling itself the 30th September Movement kidnapped and killed seven
    Indonesian army officers, including most of the highest eclons of the army, on
    30 September 1965 and into the following day. The army under Major General Suharto
    claimed that the PKI had masterminded the killings, as part of its "coup attempt"
    against then-President Sukarno. The PKI was at that time the world''s third largest
    communist party. From around mid-October 1965, the army began a series of violent
    purges against'
  merge: -1
  pgno: 18
- img_proc: true
  md: '2


    Unmarked Graves


    PKI members and sympathisers. Its efforts were supported by political parties
    and organisations opposed to the communists’ growing strength in Indonesia. The
    PKI and several mass organisations aligned to it were banned from March 1966.


    Dodi (pseudonym), quoted at the beginning of this chapter, is one of the hundreds
    of thousands whose lives were transformed by this political persecution. His parents,
    Tina (pseudonym) and Dading (pseudonym), had both been teachers and unionists
    in Lumajang, East Java. In November 1965, as leftists were being killed and detained,
    the couple fled to the safety of the provincial capital, Surabaya. The killings
    were worse in the smaller towns and rural areas than in the cities. After approximately
    two months, however, they began receiving death threats in their neighbourhood.
    They left for Blora, Central Java, to seek new teaching jobs, as an estimated
    25,000 teachers in Java had been stood from their jobs by the middle of 1966 for
    having suspected links with the 30th September Movement and the PKI.³ Tina and
    Dading were not safe in Blora either. In August 1969, the district military command
    (Komando Distrik Militer, Kodim) brought them and about 50 others for interrogation.
    They were asked about their involvement, prior to the 30th September Movement,
    in a now-banned faction of the teachers’ union, Persatuan Guru Republik Indonesia
    (PGRI, Teachers’ Association of the Republic of Indonesia) and about their knowledge
    of the PKI’s mass organisations. Tina and Dading were detained.


    Aged four and two, respectively, Dodi and his sister Herlina spent a few months
    with their parents in Blora prison. The family was separated, however, when Tina
    was sent to the Plantungan women’s prison in Central Java for two years, and Dading
    to the Buru Island penal colony for ten. Dodi and Herlina went to an orphanage
    and lived there with a foster family. When the family was finally reunited in
    Surabaya, their relationship was tense, as a result of their estrangement. Both
    Tina and Dading could no longer work as teachers in the public system. Dading’s
    ten years of detention affected his health and self-confidence. Neighbours taunted
    them for being a family of former political prisoners. The children had few opportunities
    to study or find good, stable employment. Dodi fought this stigma, sometimes with
    his fists, to silence those who taunted him. He found employment in the private
    sector in Jakarta, where he did not have to discuss his parents’ status and no
    one knew of his past. His sister became withdrawn and depressed.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# The Indonesian Left


    Democratisation from May 1998 ushered in great changes for Dodi and his family.
    People who had suffered in a similar way to his parents, eks tahanan politik (eks-tapol,
    former political prisoners), began to assert their rights, to complain about the
    decades of mistreatment and discrimination they had experienced and to form survivor
    groups. Dodi began to realise that there were many families like his throughout
    the country. In small ways, he tried to challenge the regime''s version of history,
    by telling one of his sons that the regime had lied about communists. But he still
    could not bring himself to tell his son that his grandparents, Tina and Dading,
    were former political detainees. Dodi was still trying to find ways to broach
    this topic with his sons. Part of the problem was that he himself did not feel
    he understood why they had been detained. Dodi agreed to speak to his parents,
    as a way for him to understand what they had suffered and why.


    Dodi''s family''s story, as please people whose lives were drastically altered
    by political persecution, is only one of many in Indonesia today. The recent political
    and social developments that allowed Dodi to begin to confront his family''s past
    became an impetus for this study. From 1998, there was a growing availability
    of eks-tapol accounts but only a narrow window for researchers to gather them,
    as a result of the advanced age of the people who had directly experienced the
    repression of 1965 and its immediate aftermath.


    Since the advent of the democratic era, victims and their families have become
    more open about their past, but they remain cautious. Anticommunist groups have
    attacked meetings and gatherings of former political prisoners and people interested
    in addressing the violence. Achieving justice, accountability and rehabilitation
    remains an elusive goal. The survivors of the anticommunist repression are elderly
    and many have already died. The reluctance of the state to prosecute past human
    rights abuses has disappointed survivor and advocacy groups. In 2005, the Jakarta
    District Court rejected a class lawsuit brought by former political prisoners
    against the state of Indonesia and its former presidents for its failure to uphold
    the rights of former political prisoners. In 2006, the Constitutional Court declared
    the law governing the formation of a Truth and Reconciliation Commission un, which
    seems to have ended the prospects for such a body in the near future. The National
    Human Rights Commission (Komisi Nasional Hak Asasi Manusia, Komnas HAM) and the
    victims'' groups that sprang up following'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Unmarked Graves


    democratisation have conducted research into the massacres, the results of this
    work remain unpublished.8 Faced with little prospect for justice, the survivors,
    their families, and advocacy groups struggle to publicise the violence. Despite
    the number of ordinary people, like Dodi and his family, who were affected, there
    is still little known, particularly outside of Indonesia, about the PKI, its adherents
    and the circumstances that led to the repression and the Left''s response to it.
    This book aims to contribute new knowledge about this history.


    The book examines the 1965–66 anticommunist violence in East Java and the responses
    of those on the Left, including people former schoolteachers Tina and Dading,
    to the violence. The term ''Left'' is used narrowly in this book to denote individuals
    who were members of the PKI or associated with it the mass organisations in which
    PKI members were heavily involved. Out of all the provinces of Indonesia where
    leftists were killed, the death toll was likely highest in East Java, a province
    of approximately 22 million people at that time, where as many as 200,000, were
    murdered, buried in mass graves or dumped into the rivers and the sea.9 This book
    looks at how violence occurred by tracing the experiences of survivors, perpetrators
    and people in the communities in which these events took place. It relies on firsthand
    interviews and other primary source materials, as well as documents and newspaper
    reports. It shows that the role of the army in organising civilians, civilians
    and unleashing the violence was key, as in the rest of Indonesia.10


    In East Java, civilians, particularly members of Indonesia''s largest Islamic
    organisation, Nahlatul Ulama (NU), helped the army to round up and kill leftists.
    East Java was the heartland of this distinguished religious organisation, which
    was a longstanding opponent of the PKI. Civilians involved in the violence were
    predominantly from the paramilitary organisation Barisan Ansor Serbaguna (Banser,
    Ansor Multipurpose Brigade) attached to Ansor, NU''s youth wing. The book analyses
    the degree of civilian involvement and explains how Islamic and community leaders
    and members of the security forces incited civilians to kill using a mixture of
    propaganda, threats and intimidation.


    As well as discussing the fateful last three months of 1965, this is the first
    study that provides a long perspective on the repression based on a wide range
    of firsthand interview materials, collected from people on different sides of
    the political divide in East Java. This book examines the period leading up to
    the violence to contextualise'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# The Indonesian Left


    what occurred during the mass killings. It also discusses the life stories of
    a small group of interviewees, before following them on their journeys after October
    1965.


    By taking a long perspective on the anticommunist violence, this book provides
    an insight into the protracted nature of the transition to the “New Order” regime
    that was created by Suharto. The transition to a new authoritarian system took
    years, partly as a result of the activities of remnants of Indonesia’s enormous
    Left, once the violence had subsided in early 1966. The book shows that the role
    of human agency was vital in the power struggle and political transition between
    the ascendant army-dominated government under Suharto and the pro-Sukarno and
    leftist forces. In turn, a regional perspective focused on East Java helps to
    unravel the puzzle of the relationship between the army and its civilian allies,
    in planning and carrying out the mass killings. In a province where support for
    President Sukarno was very strong, a regional focus also highlights how various
    social sectors, besides the Left, responded to his his power power March 1966
    onwards.


    Although this is a study primarily of events in one province of Indonesia, it
    is, by necessity, also a study of the journeys of a group of people. These are
    journeys into prison, to hiding, or towards the creation of new lives. Therefore,
    it sometimes discusses other provinces or the capital, Jakarta, as these journeys
    are retraced. The book discusses how some on the Left avoided detention by going
    on the run within the province or further afield, by using courier and safe house
    networks and by taking advantage of personal connections and resources. Some became
    politically active again within months, trying to prevent Suharto’s order. Finally,
    this book examines how remnants of the PKI sought refuge in the southern reaches
    of the province of East Java, in South Blitar, between 1967 and 1968, and developed
    plans to construct a resistance base to hold out against the New Order regime.


    The South Blitar base was an important episode of PKI regroupment and resistance
    after the 1965–66 violence. It did not last. This analysis of how remnants of
    the Left tried to organise underground was made possible by interviews conducted
    with the survivors. It examines why the army saw the destruction of the base as
    important for the New Order regime’s consolidation and, in turn, how the resulting
    military operation transformed the lives of villagers in South Blitar and the
    fugitives who had found shelter there.'
  merge: -1
  pgno: 22
