    # South Blitar Before the Operation


    The region known as South Blitar, an area of some 3,200 square kilometres, occupies
    the southern part of the Blitar regency. The Brantas River bisects the regency
    into northern and southern parts. South Blitar is bordered on the north by the
    river and on the south by the Indian Ocean. The regencies of Tulungagung and Malang
    lie adjacent to the west and east, respectively. The southern sections of East
    and Central Java are even less fertile compared to the Brantas River delta in
    the north. These southern regions of Java have primarily limestone-based soil.
    The area is mountainous and lacks reliable water supplies. The lack of rainfall
    led to the prevalence of dry-land agriculture, instead of *sawah* wet-rice cultivation,
    and only one annual harvest in the two or three possible in wet-rice areas. A
    1971 government survey of families in two areas in South Blitar, namely Bakung
    subdistrict and the village of Suruhawang, part of Kagemangan, showed that they
    mostly relied on small plots of land growing a variety of crops to survive. Local
    people lived in modest houses with walls made of woven bamboo and relied on oil
    lamps for lighting. They cultivated gardens of vegetables to their house, lived
    without running water and consumed meals of cassava or corn as staples twice a
    day. Most households did not have their own transport, even bicycles, unlike many
    in Blitar town. Walking was thus the main mode of transport. The roads were often
    simple paths.


