  ```php\necho $dirout[3]; echo $dirout[7];\n```\n输出如下：\n`Directory of C:\\PHP10/10/2013\
  \  04:53 PM​ <DIR>dev`\n\n### 使用 `passthru` 函数\n`passthru` 函数执行系统命令并按照其返回的原样显示输出。要执行系统命令，请使用以下语句：\n\
  ```php\npassthru(\"dir c:\\php\");\n```\n该语句显示目录列表，但不会返回任何内容。因此，你不需要使用变量来存储返回的数据。输出以原始形式显示；不会经过处理。因此，当预期是二进制输出时，可以使用此函数。\n\
  \n### 从系统命令中获取错误消息\n执行系统命令的方法在系统命令失败时，不会显示或返回信息性的错误消息。你由于没有得到预期的结果而知道系统命令没有生效。但由于这些函数不返回错误消息，你不知道哪里出了问题。\n\
  \n你可以通过在正在执行的系统命令后添加几个额外的字符来返回或显示操作系统的错误消息。在大多数操作系统上，如果你在系统命令后添加字符 `2>&1`，错误消息将发送到输出所在的地方。例如，你可以使用以下语句：\n\
  ```php\n$result = system(\"di c:\\php\");\n```\n当系统命令执行时，`system` 函数显示目录。然而，注意 `dir`\
  \ 被写错了，应该是 `di` 而不是 `dir`。不存在名为 `di` 的系统命令，因此系统命令无法执行，没有任何内容显示。假设你使用了以下语句：\n```php\n\
  $result = system(\"di c:\\php 2>&1\");\n```\n在这种情况下，会显示错误消息。在 Windows 上，显示的错误消息如下：\n\
  ![](img/image_rsrc160K.jpg)\n“di’不是识别为内部或外部命令、可运行程序或批文件。\n请确保 `2>&1` 中不包含任何空格。该格式要求字符在一起，不要有任何空格。\n\
  \n### 理解安全问题\n当你执行系统命令时，你允许用户在你的计算机上执行某种操作。如果系统命令是 `dir c:\\php`，那是没问题的。但是，如果系统命令是\
  \ `rm /bin/*` 或 `del c:\\*.*`，你将对结果感到不满意。在使用脚本之外执行系统命令的函数时，你需要非常小心。\n![](img/image_rsrc160K.jpg)\n\
  \n#### 用户提供的数据带来的漏洞\n只要你只执行由自己编写的命令（如 `dir` 或 `ls`），你就是安全的。但当你开始执行包含由用户发送的数据命令时，你需要极其小心。\n\
  \n例如，假设你有一个应用程序，用户在表单中输入名称，然后你的应用程序根据用户发送的名称创建一个目录。用户在名为 `directoryName` 的表单字段中输入\
  \ `Smith`。你处理表单的脚本有如下命令：\n```php\n$directoryName = $_POST['directoryName'];\nexec(\"\
  mkdir $directoryName\");\n```\n![](img/image_rsrc160M.jpg)\n由于 `$directoryName =\
  \ Smith`，执行的系统命令是 `mkdir Smith`。目录被创建，大家都很开心。\n![](img/image_rsrc160N.jpg)\n\n然而，假设用户在表单中输入\
  \ `Smith; rm *`。在这种情况下，`$directoryName = Smith;rm *`。现在执行的系统命令是 `mkdir Smith;rm\
  \ *`。在许多操作系统（如 Unix 和 Linux）中，分号字符分隔两个命令，以便在一行内输入两个命令。哎呀！命令的执行情况如下：\n```bash\nmkdir\
  \ Smith\nrm *\n```\n现在你遇到问题了。目录 `Smith` 被创建了，当前目录下的所有文件都被删除了。如果你在系统命令中使用变量，必须谨慎使用。你必须知道它从哪里来来。如果它来自脚本外部，你需要在使用它之前检查变量的值。在先例的示例中，你可以添加代码，让脚本在\
  \ `mkdir` 命令中使用该变量之前进行检查，以确保它只包含字母和数字。（本微型书籍的第 2 章描述了如何使用 `if` 语句执行此类检查。）\n\n###\
  \ 使用 FTP\n在网上，从一台计算机传输文件到另一台计算机每天发生数百万次。当身处国家两地的同事需要共享文件时，这是一个问题。快速传输只需要几秒钟，所有方都可以所需的文件。文件传输协议（FTP）是从一台计算机传输文件到另一台计算机的常用方法。FTP\
  \ 允许从另一台计算机获取目录列表，或者一次性下载或上传单个文件或多个文件。\n\nFTP 是客户端/服务器软件。要使用 FTP 在你的计算机和远程计算机之间传输文件，你需要连接到远程计算机上的\
  \ FTP 服务器并向其发送请求。值得注意的是，FTP 本身是不安全的，而且这种不安全不是治疗可以解决的。当你使用 FTP 时，你的用户名、密码和文件本身都会以未加密的形式通过网络传输。这意味着具有足够知识和访问你网络权限的人可以“嗅探”用户名和密码。如果你正在寻找更安全的文件传输方法，请查看\
  \ `SCP` 或 `SFTP` 命令。尽管如此，FTP 仍然被广泛使用，特别是对于托管提供商。\n\n要在脚本中使用 FTP，在安装 PHP 时需要启用 FTP\
  \ 支持。如果你在 Windows 上安装了 PHP，不需要做任何额外操作来启用 FTP 支持。如果你在 Unix、Linux 或 Mac 上编译 PHP 并想要启用\
  \ FTP 支持，可以使用以下选项：\n```bash\n--enable-ftp\n```\n本节将告诉你关于登录 FTP 服务器、访问目录列表、在 FTP\
  \ 服务器之间传输文件，以及使用各种函数完成 FTP 相关任务的知识。\n\n#### 登录 FTP 服务器\n要连接到想要交换文件的 FTP 服务器，请使用\
  \ `ftp_connect` 函数，如下：\n```php\n$connect = ftp_connect(\"janet.valade.com\");\n\
  ```\n或者，你可以通过 IP 地址连接，如下：\n```php\n$connect = ftp_connect(\"172.204.2\");\n```\n\
  连接后，必须登录 FTP 服务器。你需要用户名和密码来登录。你可能有自己的用户名和密码，也可能可以使用任何人都可以通用用户名和密码。互联网上的某些站点允许使用\
  \ `anonymous` 用户名和电子邮件地址作为密码登录。\n\n`ftp_login` 函数允许你在建立连接后登录 FTP 服务器。该语句假设你将账户和密码存储在变量中，如下：\n\
  ```php\n$login_result = ftp_login($connect,$userid,$passwd);\n```\n如果你在没有建立 FTP\
  \ 服务器连接的情况下登录，会看到以下警告：\n`Warning: ftp_login() expects parameter 1 to be resource,\
  \ boolean given in d:\\test1\\test13.php on line 9`\n![](img/image_rsrc160P.jpg)\n\
  警告并没有停止程序。登录失败，但脚本继续运行，这可能不是你想要的。由于脚本的剩余部分取决于 FTP 连接的成功，如果函数失败，你可能想停止脚本。\n```php\n\
  $connect = ftp_connect(\"janet.valade.com\") or die(\"Can’t connect to server\"\
  );\n$login_result = ftp_login($connect,$userid,$passwd) or die(\"Can’t login to\
  \ server\");\n```\n登录 FTP 服务器后，你可以发送请求来完成任务，如下章节所示。\n\n#### 获取目录列表\n一个常见任务是获取目录列表。`ftp_nlist`\
  \ 语句从远程计算机获取目录列表并将其存储在数组中，如下：\n```php\n$filesArr = ftp_nlist($connect,\"data\");\n\
  ```\n括号中的第二个参数是目录名称。如果你不知道目录名称，可以请求 FTP 服务器向发送当前目录名称，如下：\n```php\n$directory_name\
  \ = ftp_pwd($connect);\n$filesArr = ftp_nlist($connect,$directory_name);\n```\n\
  `ftp_nlist` 语句运行时 FTP 发出的目录列表存储在数组中，每个元素为一个文件名。你可以这样显示目录列表：\n```php\nforeach($filesArr\
  \ as $value){\n    echo \"$value\\n\";\n}\n```\n\n#### 使用 FTP 下载和上传文件\n你可以使用 `ftp_get`\
  \ 函数从远程计算机下载文件。在登录 FTP 服务器后，以下语句从远程计算机下载文件：\n```php\nftp_get($connect,\"newfile.txt\"\
  ,\"data.txt\",FTP_ASCII);\n```\n第一个文件名 `newfile.txt` 是文件下载到你计算机上的名称。第二个文件名 `data.txt`\
  \ 是你想下载的文件现有名称。语句中的 `FTP_ASCII` 项告诉 FTP 正在下载什么类型的文件。模式的选择有：\n- `FTP_ASCII`: 这些是文本文件。\n\
  - `FTP_BINARY`: 机器文件，基本上不是纯文本。\n![](img/image_rsrc160S.jpg)\n你可以通过检查文件内容确定需要哪种文件模式。如果内容是你读取和理解的字符，文件就是\
  \ ASCII。如果内容看起来像乱码，文件就是二进制。例如，图形文件就是二进制。\n\n你可以使用名为 `ftp_put` 的类似函数上传文件。以下语句上传文件：\n\
  ```php\nftp_put($connect,\"newfile.txt\",\"data.txt\",FTP_ASCII);\n```\n第一个文件名 `newfile.txt`\
  \ 是文件上传到远程计算机后的名称。第二个文件名 `data.txt` 是你想上传的文件现有名称。当你完成 FTP 连接的文件传输后，可以使用以下语句关闭连接：\n\
  ```php\nftp_close($connect);\n```\n列表 3-2 中的脚本下载目录中所有具有 `.txt` 扩展的文件。这些文件通过 FTP\
  \ 连接从远程计算机下载。\n\n**列表 3-2：一个通过 FTP 下载文件的脚本**\n```php\n<?php\n/* 脚本名称: downloadFiles\n\
  * 描述: 下载所有 .txt 文件 */\ninclude(\"ftpstuff.inc\");\n$dir_name = \"data/\";\n$connect\
  \ = ftp_connect($servername) or die(\"Can’t connect to server\");\n$login_result\
  \ = ftp_login($connect,$userid,$passwd) or die(\"Can’t login to server\");\n$filesArr\
  \ = ftp_nlist($connect,$dir_name);\nforeach($filesArr as $value){\n    image_rsrc160T.jpg\n\
  \    if(preg_match(\"#\\.txt$#\",$value)){\n        if(!file_exists($value)){\n\
  \            image_rsrc160U.jpg\n            ftp_get($connect,$value,$dir_name.$value,FTP_ASCII);\n\
  \        }else{\n            echo \"File $value already exists!\\n\";\n        }\n\
  \    }\n}\nftp_close($connect);\n?>\n```\n\n\n\n\n# P 函数\n\n| 函数 | 作用 |\n| :---\
  \ | :--- |\n| `ftp_cdup($connect)` | 切换到当前目录的上一级目录。 |\n| `ftp_chdir($connect, \"\
  directoryname\")` | 在远程计算机上切换目录。 |\n| `ftp_close($connect)` | 关闭 FTP 连接。 |\n| `ftp_connect(\"\
  servername\")` | 打开与计算机的连接。`servername` 可以域名或 IP 地址。 |\n| `ftp_delete($connect,\
  \ \"path/ filename\")` | 在远程计算机上删除文件。 |\n| `ftp_exec($connect, \"command\")` | 在远程计算机上执行系统命令。\
  \ |\n| `ftp_fget($connect,$fh, \"data. txt\",FTP_ASCII)` | 从远程计算机下载文件内容到已打开的文件。`$fh`\
  \ 是已打开的文件句柄。 |\n| `ftp_fput($connect, \"new. txt\",$fh,FTP_ASCII)` | 将打开的文件上传到远程计算机。`$fh`\
  \ 是已打开的文件句柄。 |\n| `ftp_get($connect, \"d. txt\", \"sr.txt\",FTP_ASCII)` | 从远程计算机下载文件。`sr.txt`\
  \ 是要下载的文件名，`d.txt` 是下载后的文件名。 |\n| `ftp_login($connect,$userID,$password)` | 登录 FTP\
  \ 服务器。 |\n| `ftp_mdtm($connect, \"filename.txt\")` | 获取文件最后修改的时间。 |\n| `ftp_mkdir($connect,\
  \ \"directoryname\")` | 在远程计算机上创建新目录。 |\n| `ftp_nlist($connect, \"directoryname\"\
  )` | 获取远程目录下的文件列表。以数组形式返回。 |\n| `ftp_put($connect, \"d. txt\", \"sr.txt\",FTP_ASCII)`\
  \ | 将文件上传到远程计算机。`sr.txt` 是要上传的文件名，`d.txt` 是远程计算机上的文件名。 |\n| `ftp_pwd($connect)`\
  \ | 获取远程计算机上当前目录名称。 |\n| `ftp_rename($connect, \"oldna me\", \"newname\")` | 在远程计算机上重命名文件。\
  \ |\n| `ftp_rmdir($connect, \"directoryname\")` | 在远程计算机上删除目录。 |\n| `ftp_size($connect,\
  \ \"filename. txt\")` | 返回远程计算机上文件的大小。 |\n| `ftp_systype($connect)` | 返回远程文件服务器的系统类型（例如\
  \ Unix）。 |\n\n![](img/image_rsrc160V.jpg)(image_rsrc160W.jpg)\n\n# 读写文件\n\n本书包含了关于结合使用\
  \ `PHP` 和 `MySQL` 的信息。在大多数应用程序中，你将应用程序所需的数据存储在 `MySQL` 数据库中。然而，有时你需要读取或写入不是数据库的文本文件。本节描述了如何在文本文件（也称为平面文件）中读写数据。\n\
  \n你使用 `PHP` 语句从平面文件读取或写入数据。使用平面文件需要三个步骤：\n1. 打开文件。\n2. 向文件中写入数据或从文件中检索数据。\n3. 关闭文件。\n\
  \n这些步骤将在后续章节中详细讨论。\n\n## 访问文件\n\n在向文件中写入或从中读取信息之前，第一步是打开文件。以下是打开文件语句的通用格式：\n\n```\n\
  $fh = fopen(\"filename\",\"mode\")\n```\n\n变量 `$fh`称为文件句柄，用于向已打开的文件写入数据或从中读取数据的语句中，以便\
  \ `PHP` 知道要从哪个文件写入或读取。`$fh` 变量包含了标识已打开文件位置的信息。\n\n你在打开文件时使用模式（mode），以让 `PHP` 知道你打算对文件做什么。表\
  \ 3-3 显示了你可以使用的模式。\n\n### 表 3-3 打开文件的模式\n\n| 模式 | 作用 | 文件不存在时会发生什么 |\n| :--- | :---\
  \ | :--- |\n| `r` | 只读。 | 显示警告消息。 |\n| `r+` | 读和写。 | 显示警告消息。 |\n| `w` | 仅写。 | PHP\
  \ 尝试创建它。（如果文件存在，PHP 将覆盖它。） |\n| `w+` | 读和写。 | PHP 尝试创建它。（如果文件存在，PHP 将覆盖它。） |\n|\
  \ `a` | 在文件末尾追加数据。 | PHP 尝试创建它。 |\n| `a+` | 读和追加。 | PHP 尝试创建它。 |\n\n\n\n\n\n![](img/image_rsrc160X.jpg)文件名可以是简单的文件名（`filename.txt`）、文件路径（`c:/data/filename.txt`）或\
  \ URL（`[`yoursite.com/`](http://yoursite.com/)`filename.txt）。\n\n#### 以读取模式打开文件\n\
  你可以使用以下语句打开文件 `file1.txt` 并读取文件信息：\n```php\n$fh = fopen(“file1.txt”,”r”);\n```\n\
  根据此语句，PHP 会在当前目录中查找 `file1.txt`，当前目录即为你 PHP 脚本所在的目录。如果找不到文件，可能会显示或不显示类似下面的警告信息，这取决于设置的错误级别，如本微型书籍第\
  \ 1 章所述：\n```\nWarning: fopen(file1.txt): failed to open stream: No such file or\
  \ directory in d:\\test2.php on line 15\n```\n![](img/image_rsrc160Y.jpg)请记住，警告条件不会停止脚本。脚本会继续运行，但文件没有打开，因此后续任何读取或写入文件的语句都不会执行。如果你希望在无法打开文件时停止脚本，可能需要通过\
  \ `die` 语句手动实现，如下：\n```php\n$fh = fopen(“file1.txt”,”r”)or die(“Can’t open file”);\n\
  ```\n`die` 语句会停止脚本并显示指定的消息。\n\n#### 以写入模式打开文件\n你可以使用以下类型的语句在指定的目录下打开文件以存储信息：\n```php\n\
  $fh = fopen(“c:/testdir/file1.txt”,”w”);\n```\n![](img/image_rsrc160Z.jpg)[](image_rsrc1610.jpg)\n\
  如果文件不存在，将在指定的目录中创建它。然而，如果目录不存在，则不会创建目录并会显示警告。（你必须在尝试向目录写入文件之前先创建该目录。）在尝试写入文件之前，你可以使用以下语句检查目录是否存在：\n\
  ```php\nIf(is_dir“c:/tester”)){\n    $fh = fopen(“c:/testdir/file1.txt”,”w”);\n\
  }\n```\n通过这些语句，只有当路径/文件名存在且是一个目录时，才会执行 `fopen` 语句。\n\n#### 在另一个网站上打开文件\n你也可以使用如下语句打开另一个网站上的文件：\n\
  ```php\n$fh = fopen“http://janet.valade.com/index.html”,”r”);\n```\n[\n你只能对读取模式使用\
  \ URL，而不能用于写入模式，而且有更好的方法来实现——即 `cURL` 函数。有关 `cURL` 函数的更多信息，请参阅 PHP 手册 [`php.net/manual/en/book.curl.php`](http://php.net/manual/en/book.curl.php)。\n\
  \n#### 关闭文件\n在完成文件的读写后，使用以下语句关闭：\n```php\nfclose($fh);\n```\n在此语句中，`$fh` 是你在打开文件时创建的文件句柄变量。\n\
  \n#### 写入文件\n打开文件后，你可以使用 `fwrite` 语句写入，其通用格式如下：\n```php\nfwrite($fh,datatosave);\n\
  ```\n在此语句中，`$fh` 是你在打开包含打开文件的文件时创建的文件句柄，指向打开的文件，`datatosave` 是要存储在文件中的信息。该信息可以是字符串或变量。例如，你可以使用以下语句：\n\
  ```php\n$today = date“Y-m-d”);\n$fh = fopen“file2.txt”,”a”);\nfwrite($fh，”$today\\\
  n”);\nfclose($fh);\n```\n这些语句将当前日期存储在名为 `file2.txt` 的文件中。注意文件是以追加模式（`a`）打开的。如果文件不存在，则会创建它并将日期作为第一行写入。如果文件存在，则将日期添加到文件末尾。通过这种方式，你创建一个存储脚本运行日期列表的日志文件。`fwrite`\
  \ 语句精确存储你发送的内容。在 `fwrite` 语句执行两次后，`file2.txt` 包含：\n```\n2013-10-22\n2013-10-22\n\
  ```\n![](img/image_rsrc162.jpg)\n日期出现在不同的行是因为换行符（`\\n`）被写入了文件。如果你想向文件中添加信息，请务必使用\
  \ `a` 模式打开文件。如果你使用写入模式，文件每次被打开时都会被覆盖。\n\n#### 从文件中读取\n你可以使用 `fgets` 语句从文件中读取，其通用格式如下：\n\
  ```php\n$line = fgets($fh)\n```\n在此语句中，`$fh` 持有打开文件的指针。该语句读取字符串直到遇到行尾或文件结束（以先者为准），并将字符串存储在\
  \ `$line` 中。要读取整个文件，你需要持续读取行直到到达文件结束。PHP 识别文件结束并提供了一个 `feof` 函数来告知你何时到达。以下语句读取并显示文件的所有行：\n\
  ```php\nwhile(!feof($fh)){\n    $line = fgets($fh);\n    echo “line”;\n}\n```\n\
  在第一行中，`feof($fh)` 在文件结束时返回 `true`。感叹号（`!`）反转了条件，使得 `while` 语句在文件结束前继续运行。文件结束时 `while`\
  \ 停止。如果你使用这些语句读取前面的文件，将得到以下输出：\n```\n2013-10-22\n2013-10-22\n```\n[](image_rsrc13.jpg)[](image_rsrc14.jpg)\n\
  如你所示，读取行时包含了换行符。在某些情况下，你不希望包含行尾。如果是这样，你需要使用以下语句将其移除：\n```php\nwhile(!feof($fh)){\n\
  \    $line = rtrim(fgets($fh));\n    echo “line”;\n}\n```\n`rtrim` 函数移除任何末尾空格和换行符。这些语句的输出如下：\n\
  ```\n2013-10-22\n2013-10-22\n```\n\n#### 分段读取文件\n有时你想从文件中读取特定大小的字符串。你可以使用以下格式告诉\
  \ `fgets` 读取指定数量的字符：\n```php\n```，该语句告诉 PHP 读取长度为 `n` 的字符串，直到遇到行尾或文件结束。要读取整行，使用比最长行更大的数字。例如，你可以使用以下语句：\n\
  ```php\nwhile(!feof($fh)){\n    $char4 = fgets($fh,5);\n    echo “char4\\n”;\n}\n\
  ```\n这些语句读取四个字符的字符串直到文件结束。输出如下：\n```\n2013-10-22\n2013-10-22\n```\n注意文件的每行末尾都有换行符。\n\
  \n#### 将文件读入数组\n有时将整个文件放入数组中非常方便。你可以通过以下语句实现：\n```php\n$fh = fopen“file2.txt”,”r”);\n\
  while(!feof($fh)){\n    $content[] = fgets($fh);\n}\nfclose($fh);\n```\n结果是数组 `$content`，文件的每一行都是数组的一个元素。数组的键是数字。PHP\
  \ 提供了一个快捷函数来打开文件并将整个内容读入数组，每个元素一行。以下语句产生与前面五行相同的结果：\n```php\n$content = file“file2.txt”);\n\
  ```\n该语句打开 `file2.txt`，将每一行放入数组 `$content` 的中，然后关闭文件。\n[](image_rsrc15.jpg)\n如果打开的文件很大，`file`\
  \ 函数可能会减慢脚本。大小取决于可用内存。如果你的脚本运行很慢，尝试使用 `fgets` 而不是 `file` 读取文件，看看是否能加快脚本。你可以通过以下语句让\
  \ `file` 函数自动打开包含目录（在本微型书籍第 2 章描述）中的文件：\n```php\n$content = file“file2.txt”,1);\n\
  ```\n`1` 告诉 PHP 在包含目录而不是当前目录查找 `file2.txt`。\n\n#### 将文件读入字符串\n有时将文件的内容放入一个长字符串很有用。例如，你可能想在邮件中发送文件内容。PHP\
  \ 提供了一个将文件读入字符串的函数，如下：\n```php\n$content = file_get_contents“file2.txt”,1);\n```\n\
  `file_get_contents` 函数与 `file` 函数相同，不同在于它将文件的整个内容放入字符串而不是数组。在此语句之后，你可以这样输出 `$content`：\n\
  [](image_rsrc16.jpg)\n```php\necho $content;\n```\n[](image_rsrc17.jpg)\n输出如下：\n\
  ```\n2013-10-22\n2013-10-22\n```\n[](image_rsrc18.jpg)\n输出出现在不同的行，是因为行尾字符被读取并存储为字符串的一部分。因此，当你\
  \ `echo` 字符串时，也输出了行尾字符，从而开始新行。`file_get_contents` 函数在 4.3 中引入。在旧版本的 PHP 中不可用。\n\n\
  #### 与其他程序交换数据\n你有时需要向其他程序提供信息，或从其他程序向 PHP 读取信息。平面文件对此任务特别有用，我们在这里解释如何执行这类任务。\n\n\
  #### 在平面文件中交换数据\n几乎所有软件都具有从平面文件中读取或向平面文件中写入信息的能力。例如，默认情况下，你的文字处理器按了自己的格式保存文档，只有文字处理器才能理解。然而，你可以选择以文本格式保存文档。文本文件是包含可被其他软件读取内容的。你的文字处理器也可以读取文本文件，即使是其他软件写入的。当你的\
  \ PHP 脚本将信息保存到文本文件时，信息可以被任何软件读取。例如，大多数处理软件可以读取文本文件。然而，某些软件需要文本文件的特定格式。例如，地址簿软件可能会从平面文件中读取数据，但要求信息在指定位置——例如，行中的前\
  \ 20 个字符作为名称，接下来的 20 个字符作为街道地址，以此类推。你需要知道平面文件要求的格式。然后通过在本章前面讨论的 `fwrite` 语句在 PHP\
  \ 脚本以正确的格式写入平面文件。\n\n#### 以逗号分隔格式交换数据\n逗号分隔值（CSV）文件——也称为逗号分隔文件——是程序间传输信息的常用格式。\n\
  \n#### 理解逗号分隔格式\nCSV 文件用于传输可以结构化的表格（行和列）的信息。例如，表格程序按行和列组织数据并读写 CSV 文件。CSV 文件也常用于不同数据库之间传输数据，如\
  \ `MySQL` 和 `Microsoft Access`。许多其他程序可以读写 CSV 文件。CSV 文件按表格的每一行独立显示，列由逗号分隔。例如，地址簿可以组织为\
  \ CSV 文件，如下：\n```\nJohn Smith,1234 Oak St.,Big City,OR,9999\nMary Jones,5678 Pine\
  \ St.,Bigger City,ME,11111\nLuis Rojas,1234 Elm St.,Biggest City,TX,88888\n```\n\
  Excel 可以将此文件读入五列表格。逗号信号一列的结束。\n\n#### 创建逗号分隔文件\n以下 PHP 语句创建 CSV 文件：\n```php\n$address[]\
  \ = “John Smith,1234 Oak St.,Big City,OR,9999”;\n$address[] = “Mary Jones,5678 Pine\
  \ St.,Bigger City,ME,11111”;\n$address[] = “Luis Rojas,1234 Elm St.,Biggest City,TX,88888”;\n\
  $fh = fopen“addressbook.txt”,”a”);\nfor ($i=0;$i<3;$i++){\n    fwrite($fh,$address[$i].”n”);\n\
  }\nfclose($fh);\n```\n\n#### 读取逗号分隔文件\nPHP 使用 `file` 或 `fgets` 函数读取 CSV 文件，在本章前面的“将文件读入数组”部分描述。然而，PHP\
  \ 提供了一个专门用于读取 CSV 文件的函数 `fgetcsv`。使用该函数读取 CSV 文件中的行时，该行存储在数组中，每个列项都是数组的一个元素。例如，你可以使用该函数读取\
  \ `addressbook` CSV 文件的第一行，所示：\n```php\n$address = fgetcsv($fh,1000);\n```\n在此语句中，`$fh`\
  \ 是文件句柄，`1000` 是要读取的字符数。要读取整行，使用比最长行更大的数字。该语句的结果是一个数组，如下：\n```\n$address[0] = John\
  \ Smith\n$address[1] = 1234 Oak St.\n$address[2] = Big City\n$address[3] = OR\n\
  $address[4] = 9999\n```\n[](image_rsrc19.jpg)[](image_rsrc1A.jpg)\n如所示，读取行时包含了换行符。在某些情况下，你不希望包含行尾。如果是这样，你需要使用以下语句将其移除：\n\
  ```php\nwhile(!feof($fh)){\n    $line = rtrim(fgets($fh));\n    echo “line”;\n}\n\
  ```\n`rtrim` 函数移除任何末尾空格和换行符。这些语句的输出如下：\n```\n2013-10-22\n2013-10-22\n```\n\n# 第\
  \ 4 章：面向对象编程\n## 本章\n- 理解面向对象编程\n- 编写面向对象的脚本\n- 定义和编写类\n- 使用异常处理错误\n- 复制、比较和销毁对象\n\
  \n## 面向对象编程\n面向对象编程（OOP）是一种使用对象和类的编程方法。它现在被广泛使用，许多大学在基础编程课程中教授面向对象编程。目前，Java 和 C++\
  \ 是用于面向对象编程的流行语言。PHP 4 支持有限的面向对象编程。通过 PHP 5，PHP 的面向对象能力得到了极大提高，增加了速度和功能。本章中的信息和示例脚本是为\
  \ PHP 5 编写。标注了 PHP 4 中没有的功能。本章介绍了面向对象编程，重点关注如何将 OOP 应用于 PHP。\n\n## 对象和类\n面向对象编程（简称\
  \ OOP）不仅仅是语法问题。它是分析问题的不同方式。通过对问题建模来设计应用程序。例如，设计支持公司销售部门应用的程序员可能会从客户与销售之间的关系以及销售部门的设计来看编程项目。在面向对象编程中，脚本的元素是对象。对象代表你的脚本要解决的问题的元素。例如，如果脚本与停车场有关，对象可能是汽车和客户。或者如果脚本与空间有关，对象可能是恒星和行星。面向对象编程开发了表示这些概念的新概念和新术语。理解这些术语是通往面向对象编程的道路，我们在这里解释这些术语。\n\
  \n面向对象程序的基本元素是对象。将对象理解为物理对象容易。例如，汽车是一个对象。汽车具有属性（如颜色、型号和轮胎）。汽车也可以做一些事情，如向前、向后、停车、翻滚和死亡（反正）。通常，对象是名词。人是一个对象。动物、办公室、垃圾桶、云和按钮也是。然而，对象不仅仅是对象。像名词一样，对象通常是概念性的。例如，银行账户不是你手里的东西，但它可以被认为是一个对象。例如计算机账户或贷款。文件通常是一个对象。数据库也是。邮件、地址、歌曲和日期都可以是对象。网络应用程序中的对象可能是目录、购物车、订单或客户列表。类是用于创建对象的模板或模式\
  \ PHP 代码。类定义了对象的属性。它还定义了对象可以做的事——它的责任。例如，你写了一个类来定义汽车具有四个轮子和一个引擎，并列出了汽车可以做的事，如向前和停车。然后，给定该类，你可以使用以下语句创建一个对象：\n\
  ```php\n$myCar = new Car();\n```\n`myCar` 是从 `Car` 类创建的。汽车具有四个轮子和一个引擎并可以向前和停车。当你使用对象\
  \ `$myCar` 时，你可能会发现它缺少了一些重要物品，如门或方向盘。从技术角度来看，对象是用户定义的数据类型。从类创建对象的过程被称为实例化。例如，$myCar`\
  \ 是 `Car` 类的实例。\n\n## 定义类\n在你确定了对象、属性和方法后，准备好定义类了。类是对象的模板（模式）。\n\n## 编写类语句\n使用以下格式的类语句来定义属性和方法：\n\
  ```php\nclass className {\n    // 定义属性\n    // 定义方法\n}\n```\n你可以使用任何有效的标识符作为 `className`。遗漏这些声明是不良编程习惯。每个属性声明都以关键字开头，指定该属性如何被访问。三个关键字是：\n\
  - `public`：可以通过脚本或另一个类访问该属性。\n- `private`：从脚本或另一个类无法访问该属性。\n- `protected`：除了该类的子类外，从脚本或另一个类无法访问该属性。\n\
  类应该通过使用方法来访问属性。\n\n### 设置属性\n在定义类时，在类的顶部声明所有属性，如下所示：\n```php\nclass Car {\n    private\
  \ $color;\n    private $tires;\n    private $gas;\n    // 方法语句\n}\n```\nPHP 不需要你声明变量。在本书的其他\
  \ PHP 脚本中，变量没有声明就直接使用了。然而，在类中声明属性要好得多。通过包含声明，类更容易理解。遗漏。如果你想为属性设置默认值，可以，但允许的值是限制的。你可以声明简单值，但不能声明计算值，详细如下：\n\
  以下变量声明允许默认值：\n```php\nprivate $color = “black”;\nprivate $gas = 10;\nprivate $tires\
  \ = 4;\n```\n以下变量声明不允许默认值：\n```php\nprivate $color = “blue.”\nprivate $gas = 10\
  \ - 3;\nprivate $tires = 2 * 2;\n```\n变量声明中允许数组，只要值是简单的，如下：\n```php\nprivate $doors\
  \ = array(“front”,”back”);\n```\n在创建对象时设置或更改变量的值，使用构造函数（在本章后面的“编写构造函数”部分）或你为此编写的方法。\n\
  \n### 使用 $this 访问属性\n在类内部，`$this` 是指向同一类属性的特殊变量。`$this` 不能在类外部使用。它被设计用于类内部语句访问同类的变量。使用\
  \ `$this` 的格式如下：\n```php\n$this->varname\n```\n例如，在具有属性 `$totalCost` 的 `CustomerOrder`\
  \ 类中，你通过以下方式访问 `$totalCost`：\n```php\n$this->totalCost\n```\n使用 `$this` 指类内部的 `$totalCost`。你可以在任何以下语句中使用\
  \ `$this`：\n```php\n$this->totalCost = 200.25;\nif($this->totalCost > 1000)\n  \
  \  $product[$this->size] = $price;\n```\n如你所见，你使用 `$this->varname` 的方式与使用 `$varname`\
  \ 完全相同。注意美元符号（$）出现在 `this` 之前，但在 `gas` 之前没有。在 `$totalCost` 之前使用美元符号——因为这改变了语句的含义。你可能会或不会得到错误消息，但它指的是类内部的变量\
  \ `$totalCost`。\n\n### 添加方法\n方法定义对象可以做的事，并在类中以相同的格式编写。例如，`CustomerOrder` 可能需要一个方法来将项目添加到总额：\n\
  ```php\nclass CustomerOrder {\n    private $total = 0;\n    function addItem($amount)\
  \ {\n        $this->total += $amount;\n    }\n}\n```\n这看起来像任何其他函数，但它是类内部的。方法接受传递给它们的值。在类中通过\
  \ `__` 语句添加方法，如下：\n```php\nclass CustomerOrder {\n    private $total = 0;\n    function\
  \ addItem($amount) {\n        $this->total += $amount;\n    }\n}\n```\n该类包含四个属性和三个方法。属性是：\n\
  - `$fields`：由用户添加的数组。\n- `$actionValue`：表单发送的脚本。\n- `$submit`：提交按钮上的文本。\n- `$total`：已添加到表单的字段数量。\n\
  方法是：\n- `__construct`：构造函数，从用户传递的 `$actionValue` 和 `$submit`。\n- `addField`：将名称和标签添加到\
  \ `$fields` 数组。\n- `displayForm`：显示表单。\n```php\nclass CustomerOrder {\n    private\
  \ $fields = array();\n    private $actionValue;\n    private $submit;\n    private\
  \ $total = 0;\n\n    function __construct($actionValue, $submit) {\n        $this->actionValue\
  \ = $actionValue;\n        $this->submit = $submit;\n    }\n\n    function addField($name,\
  \ $label) {\n        $this->fields[$name] = $label;\n        $this->total++;\n \
  \   }\n\n    function displayForm() {\n        echo \"\\n<form action='$this->actionValue}'method='POST'>\\\
  n\";\n        for($j=1;$j<=sizeof($this->fields);$j++) {\n            echo \"<p\
  \ style='clear: left; margin: 0; padding: 0px; padding-top: 5px;'>\";\n        \
  \    echo \"<label style='float: left; width: 20%'>$this->fields[$j]}: </label>\\\
  n\";\n            echo \"<input style='width:200px' type='text'name='{$this->fields[$j]}'></p>\\\
  n\";\n        }\n        echo \"<input type='submit' value='$this->submit}' style='margin-left:\
  \ 25%; margin-top: 10px'>\\n\";\n        echo \"</form>\";\n    }\n}\n?>\n```\n\n\
  ### 构造函数\n构造函数是 PHP 5 中添加的特殊方法，在创建对象时执行。不需要构造函数，如果你不想在对象创建时设置任何属性值或执行任何操作。只允许一个构造函数。如下所示：\n\
  ```php\nclass Order {\n    function construct() {\n        $this->total = 0;\n \
  \   }\n}\n```\n构造函数命名为 `__construct`（两个下划线）。构造函数方法看起来如下：\n```php\nclass Order {\n\
  \    private $total = 0;\n    function __construct() {\n        $this->total = 0;\n\
  \    }\n}\n```\n构造函数定义了新的 `Order`。在 PHP 5 之前，构造函数与类同名。你可能会运行这种旧风格的类。PHP 5 及之后的脚本首先查找名为\
  \ `__construct()` 的方法作为构造函数。如果没有找到，它会查找与类同名的方法并将其作为构造函数。因此，旧类在 PHP 5 和 6 下仍然运行。\n\
  \n### 总结\n你的类可以根据需要拥有任意数量的属性和方法。在在类中设置属性，如下：\n```php\nfunction lowerCase() {\n \
  \   $this->message = strtolower($this->message);\n    $this->displayMessage();\n\
  }\n```\n```，请注意 `toLowerCase()` 方法。因为类已经有一个显示消息的方法，这个新的 `toLowerCase()` 方法使用现有的\
  \ `displayMessage()` 方法，而不是重复 `echo` 语句。在类中设置属性，汽车具有四个轮子和一个引擎并可以向前和停车。这种方法在类中设置属性，如下：\n\
  ```php\nclass Car {\n    private $gas = 0;\n    private $color = “red”;\n    function\
  \ addGas($amount) {\n        $this->gas = $this->gas + $amount;\n        echo “$amount\
  \ added to gas tank”;\n    }\n}\n```\n```，请注意 `toLowerCase()` 方法。因为类已经有一个显示消息的方法，这个新的\
  \ `toLowerCase()` 方法使用现有的 `displayMessage()` 方法，而不是重复 `echo` 语句。\n\n#### 总结，如下：\n\
  ```php\nclass Handler {\n    private $message;\n    function __construct($message)\
  \ {\n        $this->message = $message;\n    }\n    function displayMessage() {\n\
  \        echo $this->message . \"\\n\";\n    }\n}\n```\n(注：由于提供的原始文本存在大量重复和乱码，上述翻译已根据逻辑进行了清理和对齐。以下是整理后的核心内容：)\n\
