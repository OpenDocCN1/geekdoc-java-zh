- "# PHP, HTML5, MySQL, Java Script 2021 最佳书籍\n\n\n\n![](img/image_rsrc1555.jpg)\n\
  \n\n\n\n\n\n\n\n\n\n\n## 关于作者\n\nSteve Suehring 是多本技术书籍的作者。Steve 为各种组织用各种编程语言编写了各种\
  \ Web 应用程序。Steve 的专长是为复杂的问题寻找创新的解决方案，为简单的问题寻找复杂的解决方案。\n\nJanet Valade 是 `PHP & MySQL\
  \ Dummies`（第三版）的作者。她还编写了 `PHP & MySQL Everyday For Dummies` 和 `PHP & MySQL: Your\
  \ blueprint for creating dynamic, database-driven sites`。此外，Janet 还是 `Spring into\
  \ Linux` 的作者以及 `Mastering Dreamweaver CS3 和 Flash CS Professional 的合著者。Janet 在计算机领域拥有\
  \ 20 年经验。最近，她在一家工程公司担任了四年 Web 设计师和程序员。在此之前，Janet 在大学环境中工作了 13 年，担任系统分析师。在任期间，她监督了计算资源的安装和运行，设计并开发了数据存档，支持教职员工和学生使用计算机，写了大量论文，并就各种技术主题开发并主持了研讨会。\n\
  \n## 献辞\n献给 Bob 和 Mary。– Steve Suehring\n献给每一个觉得有用的人。– Janet Valade\n\n## 作者致谢\n\
  \n### Steve Suehring 致谢\n对于这些致谢，我决定回顾我在 10 多年前为我的第一本书 `MySQL Bible` 写的章节。我很好奇在在那书中我感谢的所有人中（那里有非常多），在\
  \ 10+ 年后的这本书书中，谁还应该被感谢的。答案是：他们所有人。他们（以及你，读者）为我继续撰写书籍（以及文章、博客帖子以及其他一切）做出了贡献。我期待我们共同继续成功。\n\
  \n### Janet Valade 致谢\n首先，我想向整个开源社区表示感谢。如果没有那些愿意投入时间和才华的人，我就没有关于酷 `PHP and MySQL`\
  \ 的内容。此外，我永远不会从那些回答初学者问题的列表那里学到这些软件。我想感谢我的母亲传给我写作基因，以及许多其他事情。感谢我的孩子们一切。当然，我想感谢那些让这一切可能的专业人士，由于他们工作如此出色，我才能在这个项目上贡献我的一份力量。我们对这本书感到自豪；如果没有我的代理和\
  \ Wiley Publishing, Inc. 的人们，这本书就不会存在。有关我们其他产品和服务的通用信息，请联系我们的美国客户服务部门：877-762-2974，美国境外：317-572-3993，或传真\
  \ 317-572-4002。如技术支持，请访问 [www.wiley.com/techsupport](http://www.wiley.com/techsupport)。对于本书的意见，请通过\
  \ [`dummies.custhelp.com/`](http://dummies.custhelp.com/) 向我们发送。一些帮助这本书进入市场的人包括：\n\
  \n**采购、编辑和垂直网站**\n- 项目编辑：Heidi Unger（前版：Jean Nelson）\n- 采购编辑：Kyle Looper\n- 拷贝编辑：Debbye\
  \ Butler\n- 校对：Soss R. Smith\n- 技术编辑：Peter Veverka\n- 编辑经理：Kevin Kirschner\n- 垂直网站：Richard\
  \ Graves\n- 编辑助理：Annie Sullivan\n- 高级编辑助理：Cherie Case\n\n**封面：** © pagadesign/i\n\
  \n**制作**\n- 项目协调员：Patrick Redmond\n- 布局和图形：Jennifer Creasey\n- 校对：Jessica Kramer\n\
  - 索引：BIM Indexing & \n- 索引 & 校对服务\n\n**出版和编辑**\n- 副总裁：Richard Swadley\n- 副总裁：Andy\
  \ Cummings\n- 总监：Mary Bedarek\n\n**消费者出版**\n- 副总裁：Kathleen Nebenhaus\n- 总监：Debbie\
  \ Stailey\n- 制作服务\n\n验证你的 HTML\n如果你遵循了本章的练习，你将使用 W3C 验证器来确保你编写的 HTML 符合 HTML5 规范。按照这些步骤操作：\n\
  \n1. 使用文本编辑器打开 `firstpage.html`。\n2. 在本章之前的内部样式示例中，选择器是 `<div>` 元素，或页面上所有的 `<div>`\
  \ 元素。你可以通过使用更具体的选择器来缩小 CSS 规则的范围来解决这个问题。\n3. 使用鼠标或设备选择文件中的所有 HTML（Windows 上按 `Ctrl+A`\
  \ 或 Mac 上按 `Command+A`）。\n4. 将 HTML 复制到剪贴板（在大多数编辑器的编辑菜单中找到复制，Windows 上按 `Ctrl+C`\
  \ 或 Mac 上按 `Command+C`）。\n5. 打开网络浏览器并导航到 W3C 验证器。在浏览器打开的情况下，地址栏输入 `http://validator.w3.org`\
  \ 并按回车。\n6. 选择“通过直接输入”。通过直接输入选项卡将用于粘贴剪贴板中的代码。\n7. 检查。点击页面上的 Check 按钮来运行对 HTML 的验证。你应该得到一个类似于图\
  \ 14 的页面。图 13：将 HTML 粘贴到验证器。图 14：一个有效的 HTML 文档。\n\n注意验证中的三个警告。滚动页面发现其中一个警告是 HTML5\
  \ 实际上是实验性的，尽管在你读到这里时可能会改变。另外两个警告与语言设置有关。包含编码有助于浏览器确定如何读取文档，请查看 `http://www.w3.org/tutorials/char-enc/`\
  \ 获取更多编码的信息。\n\n第二本书：HTML 和 CSS\n第二章：使用 CSS 添加样式\n在本章中：\n* 了解样式意味着\n* 探索使用 CSS 的不同方法\n\
  * 选择元素进行样式设置\n* 更改字体并添加边框\n* 添加列表样式\n* 修改背景\n* 处理布局\n\n在前面的章节中，你学习了一些关于很多方面的少数方面的知识。具体，你学习了如何安装\
  \ Web 服务器和数据库系统，并了解了一些 HTML。虽然 HTML 用于向页面添加文本，但这些文本很无趣；需要一些样式。进入 CSS。\n\n在本章中，你学习了级联样式表\
  \ (CSS) 以及如何将其用于各种布局和样式目的。我们建议你从头到尾本章，因为有些练习是基于之前的练习的。\n\n发现 CSS 能和不能为你的网页做什么\n\
  本节从高层次审视 CSS，为你提供一个基础，你将在你的网站上学习使用 CSS。\n\n什么是 CSS？\nCSS 通过为网页提供视觉效果来补充 HTML。你在上一章创建的\
  \ HTML 页面看起来非常简单，使用了默认字体和字体大小。使用 CSS，你可以装饰外观，添加颜色和背景图片、更改字体和字体大小、为区域绘制边框甚至更改页面本身的布局。\n\
  \nCSS 有自己的语言，独立于 HTML，但如果没有 HTML 页面你就不会使用 CSS。换句话说，尽管 HTML 可以独立存在向浏览器展示页面，但 CSS\
  \ 不能。你不会编写 CSS 页面，而是编写 HTML 然后使用 CSS 帮助设置该页面，使其像你想要的样子。像 HTML 一样，CSS 由规范定义，最新版本是版本\
  \ 3，被称为 CSS3。\n\n为什么使用 CSS？\n在 CSS 之前，HTML 开发人员通过更改每个元素的属性来更改字体和颜色。如果开发者想让所有标题看起来像特定方式，他必须更改那些标题中的每一个。想象在一个有十个标题的页面上这样做，然后想象在\
  \ 50 个页面上。这项任务很快就会变得乏味。然后想想当网站所有者决定想将所有标题改回原始方式时发生什么。CSS 减轻了单独更新元素的负担，并让你可以在一个或多个元素上应用样式。你可以对同一个元素应用多种样式，并针对单个元素指定特定样式。例如，如果你想让所有标题加粗，但某个标题应该是斜体，你可以用\
  \ CSS 实现。使用 CSS 更改网页的布局、外观和效果。CSS 让这些更改变得简单。\n\nCSS 的局限性\nCSS 也没有局限性。CSS 的主要局限性并不是所有浏览器都以完全相同的方式支持\
  \ CSS。一个浏览器可能会以略不同的方式解释你的布局，将项目放置在高处或处或在不同的地方。此外，旧浏览器不支持新版本的 CSS，特别是 CSS3 规范。这意味着那些浏览器无法使用\
  \ CSS3 规范的某些功能。为了解决这个问题，你可以使用被更广泛支持的旧版本。\n\n绝对链接与相对链接\n前一个示例显示的链接被称为相对链接，因为它不是不是统一资源标识符\
  \ (URI) 方案（`http://`）或开头斜杠（`/`）。相对链接假设目标（示例中的 `table.html`）与与其链接的文档或页面位于同一个目录或文件夹中。在示例的情况下，相对链接有效，是因为当前页面\
  \ `link.html` 和被链接的页面 `table.html` 都存在于文档根目录中。\n\n如果两个页面不在同一个目录中（也就是说，如果 `table.html`\
  \ 在文档根目录的 `tables` 文件夹中，而 `link.html` 文件在文档根目录的 `links` 文件夹中），你需要创建一个绝对链接。绝对链接告诉服务器去哪里查找目标。例如，绝对链接可能看起来像\
  \ `/tables/table.html`。此链接告诉服务器需要从它的文档根查找名为 `tables` 的目录，然后在 `tables` 目录中找到名为 `tables.html`\
  \ 的文件。当你需要对被链接的目标提供精确或绝对引用时，使用绝对链接。当被链接的资源始终位于链接它的页面的相同位置时，使用相对链接。如果页面或目标的位置发生变化，链接将会失效。\n\
  \n页面内链接\n有时你想在同一个页面内链接。你可能在一个具有目录的长页面上这样做。创建页面内链接使用你见过的 `<a>` 元素，这次使用了 `name` 属性。列表\
  \ 8 显示了创建页面内锚点的 HTML：\n```html\n<!doctype html\n<html>\n<head>\n<title>Link</title>\n\
  </head>\n<body>\n  <ul>\n    <li><a href=\"#pine\">Pine</a></li>\n    <li><a href=\"\
  #oak\">Oak</a></li>\n    <li><a href=\"#elm\">Elm</a></li>\n  </ul>\n  <p><a href=\"\
  #pine\">trees are abundant in my yard.</p>\n  <p><a href=\"#oak\">There are a few\
  \ oak in my yard.</p>\n  <p><a href=\"#elm\">There’s one elm in my yard.</p>\n</body>\n\
  </html>\n```\n在列表 8 中，`href` 标签使用了井号或哈希符号（`#`），这是告诉浏览器资源位于页面上的。随后在 HTML 中你看到另一个\
  \ `<a>` 元素，这次使用了 `name` 属性。该 `name` 属性对应于之前的 `href` 属性。这就是全部了！页面内链接没有更多了。\n\n在新窗口中打开链接\n\
  有时你想让链接在新标签页或新窗口中打开。当访问者点击定义的链接时，浏览器将打开一个新标签页并加载链接的资源。现有网站仍然会在访问者的浏览器中打开。不要让每个链接都在新窗口中打开。你应该只在合理的情况下这样做。可以通过在\
  \ `<a>` 元素上添加 `target` 属性并使用特殊值 `_blank` 来。例如，之前的示例显示了如何链接到网站 www.braingia.org。你可以通过打开练习中的\
  \ `link.html` 文件并添加 `target=\"_blank\"` 来尝试这样做。注意 `blank` 单词前的下划线。当你保存文件并重新加载页面（`Ctrl+R`\
  \ 或 `Command+R`），链接看起来没有任何不同。但是，点击链接将打开一个新的标签页（取决于你的浏览器和配置）。\n\n添加图片\n照片或图形等图片增强网页的视觉吸引力。图片通常嵌入页面中，如图\
  \ 10 所示，其中显示了 Steve 的书（John & Sons, Inc.）的照片。只要你有法律权利，你可以从任何地方包含图片。换句话说，你可以将图片存储在你的\
  \ Web 服务器上，也可以包含在别人服务器上的图片。（我们重复一遍：首先，确保你没有违反任何版权！）还有另一种类型的图片，被称为背景图片。背景图片为页面本身提供背景。本书的第二章介绍了背景图片。\n\
  \n引用图片位置\n图片使用 `<img>` 元素添加。与 `<a>` 元素一样，`<img>` 元素使用属性告诉浏览器更多关于它的信息。`src` 属性用于告诉浏览器哪里找到图片。在之前的图\
  \ 10 中，你看到一张书封的图片。将该图片引入页面的 HTML 如下：\n```html\n<img src=\"images/books_mysqlbible.gif\"\
  >\n```\n你可以，`<img>` 元素添加了 `src` 属性，该属性引用了在 Web 服务器上找到图片的位置。你可能注意到 `<img>` 元素没有结束标签\
  \ `</img>`。这是因为该元素没有自己的内容，不像 `<p>` 和 `<a>` 元素——两者都需要内部内容因此需要关闭。你有时可能会看到类似`<img>`\
  \ 的元素使用 `/>` 而不是简单的 `>`，如示例所示。两者都是关闭这种元素的有效方式。`<img>` 元素应该有一个 `alt` 属性。`alt` 属性告诉搜索引擎和辅助技术有关正在使用的图片。当与\
  \ `<img>` 元素配合时，`alt` 属性如下：\n```html\n<img src=\"images/books_mysqlbible.gif\" alt=\"\
  MySQL Bible\">\n```\n你应该使用短描述作为 `alt` 属性的内容。使用类似“MySQL Bible 是一本很好的书，每个人都应该买一本”这样的并没有描述图片，但“MySQL\
  \ Bible”是。\n\n选择良好的网页图片\n在为网页选择图片时，你需要的不仅仅是确保图片被拍摄。你还应该考虑图片的宽度和高度、文件大小及其格式。浏览器可以查看多种格式的图片，包括\
  \ JPG、GIF 和 PNG 以及其他。图片的宽度和高度取决于你以及页面的需求。例如，示例显示了《MySQL Bible》书封面。许多图像处理软件都是可用的。Adobe\
  \ Photoshop 和 Gimp 是其中最流行的。文件大小是选择图片时最重要的因素之一。当你包含高质量图片时，取决于访问者的连接速度。如果使用的是拨号调制或较慢连接，下载文件可能花费长时间！为了避免这一点，你可以使用上述软件调整图片。将图片调整到\
  \ 100KB（KB）是重要的。另一个重要方面是页面上所有图片的总和。\n\n创建一个带有图片的页面\n是时候创建一个带有图片的页面了，你可以看到图片如何放入\
  \ HTML 页面。按照以下步骤操作：\n\n1. 打开你的文本编辑器。有关文本编辑器的更多信息，请参考前面的练习。\n2. 在文本编辑器中创建一个新的文本文档。大多数文本编辑器启动时都会打开一个空白或空文档。如果文档中有任何内容，请在继续之前将其清除。\n\
  3. 输入以下 HTML：\n```html\n<!doctype html\n<html>\n<head>\n<title>My First Web Page</title>\n\
  </head>\n<body>\n  <h1>My Table</h1>\n  <table>\n    <tr>\n      <th>Airport Code</th>\n\
  \      <th>Common Name/City</th>\n    </tr>\n    <tr>\n      <td>CWA</td>\n    \
  \  <td>Central Wisconsin Airport</td>\n    </tr>\n    <tr>\n      <td>ORD</td>\n\
  \      <td>Chicago O’Hare</td>\n    </tr>\n    <tr>\n      <td>LHR</td>\n      <td>London\
  \ Heathrow</td>\n    </tr>\n  </table>\n</body>\n</html>\n```\n4. 将文件保存为 `table.html`。像前面的练习一样，使用\
  \ `.html` 扩展名保存文件。该文件应保存在你的文档根目录中。如果你还没有在该练习中找到文档根目录，请参考前面的练习或第一本书获取有关查找文档根目录的信息。\n\
  5. 在浏览器中查看该文件。打开你的网络浏览器并在地址栏中输入 `http://localhost/table.html`。这将显示一个类似于图 1-7 所示的页面。图\
  \ 1-7：你为此练习创建的表格。注意表格没有任何边框。如果你想添加边框，请继续进行练习。否则，请继续下一节。\n6. 在文本编辑器中打开 `table.html`。如果你关闭了文本编辑器，请重新打开它并加载\
  \ table.html。\n7. 将 `table.html` 中的代码更改为以下：\n```html\n<!doctype html\n<html>\n<head>\n\
  <title>First Web Page</title>\n</head>\n<body>\n  <h1>My Table</h1>\n  <table border=\"\
  1\">\n    <tr>\n      <th>Airport Code</th>\n      <th>Common Name/City</th>\n \
  \   </tr>\n    <tr>\n      <td>WA</td>\n      <td>Central Wisconsin Airport</td>\n\
  \    </tr>\n    <tr>\n      <td>ORD</td>\n      <td>Chicago O’Hare</td>\n    </tr>\n\
  \    <tr>\n      <td>LHR</td>\n      <td>London Heathrow</td>\n    </tr>\n  </table>\n\
  </body>\n</html>\n```\n注意，唯一的更改是在 `<table>` 元素内添加了一个空格和 `border=\"1\"`。\n8. 在浏览器中重新加载\
  \ `table.html`。如果你关闭了浏览器，请重新打开它并访问 `http://localhost/table.html`。如果你的浏览器仍然开启，按 `Ctrl+R`\
  \ 刷新页面（Mac 上按 `Command+R`）。你现在可以看到表格周围有一个边框，如图 1-8 所示。图 1-8：每个单元格都有边框的表格。这是为表格添加边框的一种非常原始的方法。完成此任务更好的方法是使用\
  \ CSS，你在第一本书中简要学习过它。本书的第二章将更详细地介绍 CSS。\n\n在你的网页上包含链接和图片\n如果没有链接——如果没有图片——网页还会什么？几乎什么都没有。链接是你在网页内部点击的项目，以连接或加载其他页面。当我们谈论图片时，我们指的是插图和照片。本节介绍了如何在你的网页上添加链接和图片。\n\
  \n添加链接是使用 `<a>` 元素。`href` 属性告诉锚点元素的目标地。目标可以是任何内容，从同一网站的另一个网页到另一个网站、一个文档或文件，甚至是同一网页内的其他位置。链接本身可以添加到页面的任何地方。例如，你可以将上一节中提到的每种树链接到相关文章。\n\
  \n（由于后续部分文本存在大量重复和乱码，此处已根据核心逻辑进行清理并翻译）\n\n链接到其他页面（无论同一网站还是不同网站）的方法是相同的。例如，查看以下 HTML：\n\
  ```html\n<p>Here’s a link to <a href=\"http://www.braingia.org/\">Steve</a>’s site</p>\n\
  ```\n（此处省略了原文中大量重复的乱码内容，保留了核心 HTML 逻辑：绝对与相对链接的对比、CSS 样式应用以及验证 HTML 的说明等）\n\n\n\n\
  \n| 表 2-1 | 颜色的十六进制代码 |\n\n| 代码 | 颜色 |\n| :--- | :--- |\n| #FF0000 | 红色 |\n| #00FF00\
  \ | 绿色 |\n| #0000FF | 蓝色 |\n| #666666 | 深灰色 |\n| #00000 | 黑色 |\n| #FFFFFF | 白色 |\n\
  | #FFFF00 | 黄色 |\n| #FFA500 | 橙色 |\n\n![](img/image_rsrc15G3.jpg)![](img/image_rsrc15G4.jpg)\n\
  \n十六进制代码是 HTML 中设置颜色更准确、更优的方法，但它们很难记忆。使用像 [www.visibone.com/colorlab](http://www.visibone.com/colorlab)\
  \ 的 Visibone Color Lab 工具对于获取所需的颜色十六进制代码至关重要。字体颜色使用 `color` CSS 属性设置，如示例所示（这是红色的代码）：`color:\
  \ #FF0000;`。\n\n列表 2-4 显示了如何使用十六进制代码将 `<span>` 元素的颜色更改为蓝色：![](img/image_rsrc15G5.jpg)\n\
  \n列表 2-4：使用 CSS 为字体着色\n```css\nspan {color: #0000FF;}\n```\n\n在浏览器中查看在本章之前创建的 HTML\
  \ 时，输出结果如图 2-8 所示。注意页面上“nicest”一词的蓝色（在这部黑白书中可能有点难以阅读）。![](img/image_rsrc15G6.jpg)![](img/image_rsrc15G7.jpg)\
  \ \n\n图 2-8：将字体颜色改为蓝色。![](img/image_rsrc15G8.jpg)\n\n# 添加边框\n\n边框可以帮助页面元素之间提供视觉分离。你可以在\
  \ HTML 中的几乎任何元素周围添加边框，并且有边框样式可选。通过 `border` CSS 属性添加边框。\n\n当使用 CSS 创建边框时，你需要设置三项：\n\
  * 边框厚度\n* 边框样式\n* 边框颜色\n\n这三项设置在一个列表中，并用空格分隔，如示例所示：`border: 1px solid black;`。在此示例中，将创建一个厚度为\
  \ 1 像素的边框。边框是实线的且颜色为黑色。常见的边框样式如表 2-2 所示。\n\n| 表 2-2 | CSS 中的边框样式 |\n| 样式 |  |\n\
  | :--- | :--- |\n| Solid (实线) | 实线 |\n| Dotted (点线) | 点线 |\n| Dashed (虚线) | 带有破折效果的线\
  \ |\n| Double (双线) | 两条实线 |\n\n![](img/image_rsrc15G9.jpg)是时候练习为某些元素创建边框了。按照以下步骤操作：\n\
  \n1. ![](img/image_rsrc15GA.jpg)打开文本编辑器。\n2. 验证上一个练习的 HTML 文件。上一个练习的 HTML 是本次练习的起点。如果你的文件看起来不像这样，请将其更改为像这样的\
  \ HTML。对于那些文件与上一个练习完全相同的同学，你只需要在第一个 `<div>` 元素中添加一个名为 `addBorder` 的类即可。\n\n```html\n\
  <!doctype html>\n<html>\n<head>\n<title>A CSS Exercise</title>\n<link rel=\"stylesheet\"\
  \ type=\"text/css\" href=\"style.css\">\n</head>\n<body>\n<div class=\"boldText\
  \ addBorder\">This is my web page.</div>\n<div>This is the <span>nicest</span> page\
  \ I’ve made yet.</div>\n<div class=\"boldText\">Here is some text on my page.</div>\n\
  </body>\n</html>\n```\n\n3. 保存 HTML 文件。将其保存为 `css-border.html` 并放在你的文档根目录下。\n4.\
  \ 打开你的 CSS 文件。你应该有一个上一个练习的 CSS 文件。该练习的 CSS 文件应包含一个名为 `boldText` 的类以及一个将所有 `<span>`\
  \ 元素改为斜体的 CSS 规则。在你的 CSS 文件中，添加并修改 CSS 使其如下所示：\n\n```css\n.boldText {font-weight:\
  \ bold;}\nspan {font-style: italic;}\n.addBorder {border: 3px solid black;}\n```\n\
  5. 保存 CSS 文件。将文件保存为 `style.css`。\n6. 在浏览器中查看页面。![](img/image_rsrc15GB.jpg) 打开你的浏览器并指向\
  \ `http://localhost/css-border.html` 以查看页面。\n\n\n\n\n\n# 更改列表样式\n\n更改符号样式。查看这些样式效果的最佳方法是尝试它们。本练习使用了前一章节中的列表\
  \ 1-7，我们在步骤 3.1 中在此处向您展示了所有代码。\n\n1. 打开你的文本编辑器。\n2. 修改或创建 `ul.html`。如果你在上一章节有一个名为\
  \ `ul.html` 的文件，现在打开它。如果没有，你可以现在创建一个新的空白文本文档。在文件内部，使用以下 HTML。如果你正在使用 `ul.html`，你只需要添加\
  \ `<link>` 元素来引入 CSS 文件。\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>无序列表</title>\n\
  <link rel=\"stylesheet\" type=\"text/css\" href=\"ul.css\">\n</head>\n<body>\n<ul>\n\
  <li>松树</li>\n<li>橡树</li>\n<li>榆树</li>\n</ul>\n</body>\n</html>\n```\n\n3. 保存文件。将文件保存为文档根目录下的\
  \ `ul.html`。\n4. 创建新文件。使用你的文本编辑器创建一个新的空白文本文档。\n5. 将以下 CSS 放入新文档中：\n```css\nul {list-style-type:\
  \ square;}\n```\n6. 保存 CSS 文件。将文件保存为文档根目录下的 `ul.css`。\n7. 打开网页浏览器并查看页面。在浏览器中，在地址栏输入\
  \ `http://localhost/ul.html` 并按回车。你应该看到一个类似于图 2-11 的页面。图图 2-11：更改列表样式。你可以尝试 `list-style-type`\
  \ 属性来添加或更改符号样式。\n\n## 移除符号\n\n网页上列表的一种常见外观是完全不使用符号。这种效果通过将 `list-style-type` 的值设置为\
  \ `none` 来实现，如示例所示，这可以使用你刚刚创建的 `ul.css` 文件。\n\n```css\nul {list-style-type: none;}\n\
  ```\n\n当将其应用于你在上一个练习中创建的页面时，结果类似于图 2-12。你将 `list-style-type` 属性应用于 `<ul>` 或 `<ol>`，而不是应用于单个列表项（即\
  \ `<li>` 元素）。图 2-12：移除 HTML 列表中的符号。\n\n## 添加背景\n\n到目前为止创建的页面都是白色背景，或者更准确地说，它们具有浏览器选择的默认背景。在旧版本的浏览器中，该背景颜色是灰色的。你可以使用\
  \ CSS 更改背景颜色，或使用背景图像。背景颜色和背景图像可以应用于整个页面或单个元素。更改单个元素的背景颜色有助于为页面的某些区域添加突出和颜色。\n\n\
  ### 更改背景颜色\n\nHTML 元素的背景颜色通过 `background-color` CSS 属性更改。背景颜色使用与字体颜色相同的语法（十六进制代码）；请参考本章早些关于字体颜色的讨论，查看常用颜色的十六进制代码。\n\
  \n这是一个更改整个页面背景颜色的示例：\n```css\nbody {background-color: #FFFF00;}\n```\n\n图 2-13 显示了结果页面。注意，黄色在书中可能显示得不好，但它确实在那里！！图\
  \ 2-13：为页面添加黄色背景颜色。\n\n如前所述，单个元素也可以进行更改，你可以使用所有不同的选择器将该颜色聚焦于类（class）、单个元素（使用 id）或使用元素名称应用于所有元素。例如，将所有\
  \ `<div>` 元素更改为黄色如下：\n```css\ndiv {background-color: #FFFF00;}\n```\n\n你还可以使用 CSS\
  \ 通过元素的层级关系来定目标元素；换句话说，你可以在元素作为其他元素的元素出现时对其进行定位。这需要一个示例。书中的许多示例使用了与列表 2-5 类似的 HTML，因此我们使用列表\
  \ 2-5 来向你展示如何定位某些元素。\n\n### 某些示例中使用的 HTML\n\n```html\n<!doctype html>\n<html>\n\
  <head>\n<title>CSS 练习</title>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"\
  style.css\">\n</head>\n<body>\n<div class=\"boldText\">这是我的页面。</div>\n<div>这是我做过的<span\
  \ class=\"nicest\">漂亮</span>的页面。</div>\n<div class=\"boldText\">这是我页面上的一些文本。</div>\n\
  </body>\n</html>\n```\n\n关注此 HTML 中第二个 `<div>` 内部的 `<span>` 元素。你可以说 `<span>` 元素是\
  \ `<div>` 的子元素。使用 CSS，你可以通过其作为 `<div>` 子元素的位置来定位此 span。如果你想对所有特定类型的元素应用某些样式，但你没有（或不能）为这些元素添加类，这将非常有帮助。例如，如果你想让所有出现在\
  \ `<div>` 内部的 `<span>` 元素具有红色背景，你可以通过此 CSS 实现：\n```css\ndiv span {background-color:\
  \ #FF0000;}\n```\n\n将此 CSS 应用于之前看到的 CSS（包括图 2-13 的），你将得到类似于图 2-14 的结果，该结果显示了高亮的\
  \ *nicest* 一词。图 2-14：定位元素以应用 CSS 规则。这种 CSS 定位可以用你喜欢的方式应用，无论是定位特定的 ID、特定的类或某些元素，如示例所示。你可以创建强大的（有时是令人困惑的）CSS\
  \ 组合。\n\n### 添加背景图像\n\n背景图像是创建漂亮 HTML 页面的良好方法。使用背景图像，你可以创建一个渐变效果，页面的部分区域是实色，颜色随着向另一侧延伸而变淡。背景图像出现在其他元素之后。这意味着可以将所有\
  \ HTML（包括其他图像）叠加在[背景](http://search.creativecommons.org/) 图像之上。你可以通过知识共享找到许多免费图像。访问\
  \ [http://] 了解更多信息。确保选择的图像能让页面上的文字可读；深色背景上的黑色文字不是良好的匹配。背景图像通过 `background-image`\
  \ 属性添加，此处及后续章节描述。\n`background-image:url(\"my.jpg\");`\n\n### 添加单个背景图像\n\n背景图像的特征之一是你可以在页面内平铺或重复它们。这意味着无论访问者的屏幕有多大，背景图像都会出现。相反，你也可以选择不重复背景图像。本节介绍了如何添加单个不重复的图像。为了完成此练习，你需要一张图像。图像最好至少为\
  \ 800 像素 x600 像素。你可以通过在 Windows 上右键单击图像并选择“属性”，或在 Mac Finder 窗口中“显示简介”来查找图像分辨率。\n\
  \n1. 打开你的文本编辑器。创建一个空白文本文档。\n2. 在文本编辑器中输入以下 HTML：\n```html\n<!doctype html>\n<html>\n\
  <head>\n<title>背景图像</title>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"\
  image-style.css\">\n</head>\n<body>\n</body>\n</html>\n```\n\n3. 保存文件。将文件保存为文档根目录下的\
  \ `backimage.html`。\n4. 创建新文件。使用你的文本编辑器创建一个新的空白文本文档。\n5. 在新文档中放入以下 CSS：\n```css\n\
  body {background-image:url(\"large-snow.jpg\"); background-repeat: no-repeat;}\n\
  ```\n6. 保存 CSS 文件。将文件保存为文档根目录下的 `image-style.css`。\n7. 打开网页浏览器查看页面。在浏览器中，在地址栏输入\
  \ `http://localhost/backimage.html` 并按回车。你应该看到一个类似于图 2-15 的页面。图 2-15：单个背景图像。\n\n\
  取决于图像和屏幕的大小，你可能会注意到图像结束了，正如图 2-15 右侧所示。此外，你可能注意到图像没有居中。继续阅读获取解决方案。\n\n### 改进单个背景图像页面\n\
  \n创建更好看页面的常用方法是添加与图像边缘匹配的背景颜色。在我们图像的情况下，顶部和底部是黑色的。因此，我们可以向 CSS 添加一条规则将默认背景颜色设置为黑色。这在图像所在的地方没有任何效果，但在图像结束的底部将生效。这种外观的\
  \ CSS 如下：\n```css\nbody {background-image:url(\"large-snow.jpg\"); background-repeat:\
  \ no-repeat; background-color: #00000;}\n```\n\n有了该规则，图像仍然结束，但外观不会非常令人震惊或明显，因为它与图像边缘颜色匹配，如图\
  \ 2-16 所示。图 2-16：添加背景颜色和背景图像。\n\n虽然背景颜色技巧解决了图像边缘的问题，但它没有解决居中问题。当前的背景图像应用于 `body`——换句话说，整个页面。为了让背景图像居中，需要添加另一个\
  \ CSS 属性，如下所示：\n```css\nbody {background-color: #FFFF0;background-position: center\
  \ top;}\n```\n此 CSS 添加了 `background-position` 规则并将其置顶部顶部。其他值包括 `left`、`right` 和\
  \ `bottom`，你可以组合它们，使背景图像出现在右下角。此处显示的 CSS 将图像置于页面中心和顶部。这产生了图 2-17 所示的页面。图 2-17：带有背景颜色的顶部居中背景图像。\n\
  \n### 创建双列布局\n\n双列布局使用更多的 HTML 来实现多列效果。这通常是为了在页面侧边添加菜单或指向另一列的链接。列表 2-6 显示了双列固定宽度布局涉及\
  \ HTML。\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>双</title>\n<link rel=\"\
  stylesheet\" type=\"text/css\" href=\"double.css\">\n</head>\n<body>\n<div id=\"\
  container\">\n<div id=\"content\">\n<h2>这里有一些内容</h2>\n<p>这里是放置故事的地方</p>\n<h2>更多内容</h2>\n\
  <p>这是另一个故事</p>\n</div>\n<div id=\"sidebar\">\n<h3>菜单</h3>\n<ul>\n<li>项目 1</li>\n\
  <li>项目 2</li>\n<li>项目 3</li>\n</ul>\n</div>\n</div>\n</body>\n</html>\n```\n\n此\
  \ HTML 使用单列布局的 `container` `<div>` 添加了另一个 `<div>` 来存放内容。该 `<div>` 名为 `mainContainer`，包含了内容和侧边栏。另一个添加是侧边栏\
  \ `sidebar`。该侧边栏内部包含一个无序列表 (`<ul>`)。双列布局的 CSS 如列表 2-7 所示。\n\n```css\n#container\
  \ {margin: 0 auto; width: 900px;}\n#mainContainer {float: left; width: 900px;}\n\
  #content {clear: left; float: left; width: 500px; padding: 20px 0; margin: 0 30px;\
  \ display: inline;}\n#sidebar {float: right; width: 260px; padding: 20px 0; margin:\
  \ 0 0; display: inline; background-color: #CCCCCC;}\n```\n\n此 CSS 使用了你已经过的几项，包括\
  \ `margin`、`padding`、`clear` 和 `background-color` 等。CSS 中新增的是 `float` 和 `display`\
  \ 属性。`float` 属性定义了元素是在布局内左浮动还是右浮动，还是完全不浮动（`none`），作为默认。然而，因为你想创建并列，你需要让 `content`\
  \ 容器左浮动，让 `sidebar` 右浮动。因此，如果你想让 `sidebar` 现在右侧，只需将 `#content` 中的 `float: left`\
  \ 交换为 `#sidebar` 中的 `float: right`。\n\n### 创建单列布局\n\n你目前看到的所有都是单列布局。页面只有一列，左对齐。然而，你可以使用\
  \ CSS 控制这种对齐。这意味着创建比你见过的更复杂的 HTML，但 HTML 中并没有新的，只是比之前的 HTML 多。\n\n1. 打开文本编辑器。创建一个空白文本文档。\n\
  2. 在空白文档中输入以下 HTML：\n```html\n<!doctype html>\n<html>\n<head>\n<title>单列</title>\n\
  <link rel=\"stylesheet\" type=\"text/css\" href=\"style.css\">\n</head>\n<body>\n\
  <div id=\"container\">\n<div id=\"content\">\n<h2>这里有一些内容</h2>\n<p>这里是放置故事的地方</p>\n\
  <h2>更多内容</h2>\n<p>这是另一个故事</p>\n</div>\n</div>\n</body>\n</html>\n```\n\n3. 保存文件。将文件保存为文档根目录下的\
  \ `single.html`。\n4. 打开浏览器查看页面。在浏览器中访问 `http://localhost/single.html`。你应该看到一个类似于图\
  \ 2-19 的页面。图 2-19：添加 CSS 之前的基础页面。\n\n5. 创建新文本文档。使用你的文本编辑器创建一个空白文本文档。\n6. 在文档中放入以下\
  \ CSS：\n```css\nbody {font-family: arial,helvetica,sans-serif;}\n#container {margin:\
  \ 0 auto; width: 600px; background: #FFFFFF;}\n#content {clear: left; padding: 20px;}\n\
  ```\n7. 保存 CSS 文件。将文件保存为文档根目录下的 `single.css`。\n8. 打开浏览器。导航到 `http://localhost/single.html`。如果浏览器仍开启，用\
  \ `Ctrl+R` 或 `Command+R` 刷新页面。你会看到一个类似于图 2-20 的页面。图 2-20：单列布局。\n\n本节创建的布局被称为单列固定宽度布局。另一种选择是单列流布局。单列流布局在某些设备上效果更好。所示固定宽度布局有时会导致页面底部出现水平滚动条。要将布局更改流布局，只需更改\
  \ `#container` 中的一小部分 CSS，如下：\n```css\nbody {font-family: arial,helvetica,sans-serif;}\n\
  #container {margin: 0 30px; background: #FFFFFF;}\n#content {clear: left; padding:\
  \ 20px;}\n```\n\n唯一的更改是移除 `#container` 内的 `width` 属性，并将 `margin` 从 `auto` 更改为 `30px`。这样，布局变成了流布局，效果更好，尤其在移动设备上。\n\
  \n### margin 和 padding 的快捷方式\n\n与其为 margin 或 padding 的顶、下、右、左每个元素都定义一条规则，你可以使用快捷方法在一行内定义所有元素。例如：\n\
  ```css\nmargin: 0 50px 200px 300px;\n```\n等同于：\n```css\nmargin-top: 0px;\nmargin-right:\
  \ 50px;\nmargin-bottom: 200px;\nmargin-left: 300px;\n```\n\n当四个数字出现时，顺序是顶、右、下、左。为了帮助记忆，使用助记词“Trouble”（Top,\
  \ Right, Bottom, Left），将它们组成一个单词。而不是所有值，有时使用一、二、三个值，如示例所示：\n```css\nmargin: 0 auto;\n\
  ```\n使用两个值时，第一个值对应顶和下，第二个值对应右和左。使用三个值时，第一个是顶，第二个是左和右，第三是是。最后，使用一个值时，它应用于顶、右和左。\n\
  \n### 创建双列布局\n\n双列布局使用更多的 HTML 来实现多列效果。这通常是为了在页面侧添加菜单或指向另一列的链接。列表 2-6 显示了双列固定宽度布局涉及的\
  \ HTML。\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>双</title>\n<link rel=\"\
  stylesheet\" type=\"text/css\" href=\"double.css\">\n</head>\n<body>\n<div id=\"\
  container\">\n<div id=\"content\">\n<h2>这里有一些内容</h2>\n<p>这里是放置故事的地方</p>\n<h2>更多内容</h2>\n\
  <p>这是另一个故事</p>\n</div>\n<div id=\"sidebar\">\n<h3>菜单</h3>\n<ul>\n<li>项目 1</li>\n\
  <li>项目 2</li>\n<li>项目 3</li>\n</ul>\n</div>\n</div>\n</body>\n</html>\n```\n\n此\
  \ HTML 使用单列布局的 `container` `<div>` 添加了另一个 `<div>` 来存放内容。该 `<div>` 名为 `mainContainer`，包含了内容和侧边栏。另一个添加是侧边栏\
  \ `sidebar`。该侧边栏内部包含一个无序列表 (`<ul>`)。双列布局的 CSS 如列表 2-7 所示。\n\n```css\n#container\
  \ {margin: 0 auto; width: 900px;}\n#mainContainer {float: left; width: 900px;}\n\
  #content {clear: left; float: left; width: 500px;}\n```\n\n*(注：此处原文重复，已按逻辑处理：)*\n\
  \n```css\n#sidebar {float: right; width: 260px; padding: 20px 0; margin: 0 0; display:\
  \ inline; background-color: #CCCCCC;}\n```\n\n*(注：由于输入文本存在大量逻辑循环和乱码，上述翻译仅保留了核心技术说明部分。如需针对后续特定章节进行翻译，请提供更清晰的文本。)*\n\
  \n\n\n\n\n## 表 1-1: echo 语句\n\n| echo Statement | 输出 |\n| :--- | :--- |\n| `echo\
  \ \"Hello\";` | Hello |\n| `echo 123;` | 123 |\n| `echo \"Hello\",\"World!\";` |\
  \ HelloWorld! |\n| `echo Hello World!;` | 无效；会产生错误消息 |\n\n### 在网页中显示内容 ![279](img/image_rsrc15W1.jpg)\n\
  \n| echo Statement | 输出 |\n| :--- | :--- |\n| `echo \"Hello World!\";` | Hello World!\
  \ |\n| `echo 'Hello World!'` | Hello World! |\n\n`echo` 和 `print` 语句输出发送到浏览器的一行文本。浏览器会将该文本视为\
  \ HTML 并以这种方式进行处理。因此，你需要确保你的输出是有效的 HTML 代码，用于描述你希望用户看到的网页。\n\n当你想要使用 `PHP` 显示网页（或网页的部分内容）时，你需要考虑生成网页涉及的三个部分：\n\
  \n- **PHP 脚本**：你编写的 `PHP` 语句。\n- **HTML 源代码**：当你在浏览器中选择“查看 ➔ 源代码”时看到的网页源代码。源代码是\
  \ `echo` 或 `print` 语句的输出。![image_rsrc15W2.jpg]\n- **网页**：你的用户看到的网页。网页是由 HTML 源代码生成的。\n\
  \n`echo` 或 `print` 语句会将你 `echo` 的内容原封不动发送到浏览器——不多不少。如果你没有 `echo` 任何 HTML 标签，则没有任何标签都不会发送。![image_rsrc15W3.jpg]!(image_rsrc15W4.jpg)\n\
  \n`PHP` 允许一些格式化输出的特殊字符，但它们不是 HTML 标签。PHP 特殊字符只影响 `echo` 或 `print` 语句的输出，而不影响网页上的显示。例如，如果你想在\
  \ PHP 输出或 HTML 源代码中开始新行，必须包含一个特殊字符 `\\n`，它告诉 `PHP` 换行。然而，这个特殊字符只是在输出中开始一个新行；它不会发送实际的\
  \ HTML 标签来在生成的网页上换行。表 1-2 显示了这三个部分的示例。\n\n## 表 1-2: 网页生成的阶段\n\n| echo Statement\
  \ | HTML 源代码 |\n| :--- | :--- |\n| `echo \"Hello World!\";` | Hello World! |\n|\
  \ `echo \"Hello World!\";echo \"Here I am!\";` | Hello World!Here I am! |\n| `echo\
  \ \"Hello World!\\n\";echo \"Here I am!\";` | Hello World! Here I am |\n| （续） |\n\
  \n### 表 1-2（续）\n\n| echo Statement | HTML 源代码 | 网页显示 |\n| :--- | :--- | :--- |\n\
  | `echo \"Hello World!\";echo \"<br />\";echo \"Here I am!\";` | Hello World!<br\
  \ />Here I am! | Hello World! Here I am! |\n| `echo \"Hello\"; echo \" World!<br\
  \ />\\n\";echo \"Here I am!\";` | Hello World!<br />Here I am!” | Hello World! Here\
  \ I am! |\n\n\n\n\n表 1-2 总结了使用 PHP 创建网页时各个阶段之间的差异。为了更仔细地观察这些差异，请考虑以下两个 print 语句：\n\
  \n```\nprint “Line 1”;\nprint “Line 2”;\n```\n\n如果你将这些行放入脚本中，你可能期望网页会显示如下内容：\nLine\
  \ 1\nLine 2\n\n然而，这并不是你将得到的输出。网页将显示为：\nLine 1Line 2\n\n如果你查看网页的源代码，你会看到发送到浏览器的内容完全相同，如下：\n\
  Line 1Line 2\n\n请注意，发送到浏览器的行恰好包含你打印的字符——不多不少。你打印的字符字符串中不包含任何空格，因此行与行之间没有出现空格。还要注意，这两行是打印在同一行的。如果你想开始一个新行，你必须发送一个表示新行开始的信号。在\
  \ PHP 中，要信号此处开始一个新行，请打印特殊字符 `\\n`。将 print 语句更改为如下：\n\n```\nprint “line 1\\n”;\n\
  print “line 2”;\n```\n\n现在你得到了你想要的，对吧？不，并没有。现在你在网页上看到的是如下：\nline 1 line 2\n\n如果你查看源代码，你会看到：\n\
  line 1line 2\n\n所以，`\\n` 发挥了作用：它在输出中开始了一个新行。然而，HTML 在网页上将输出显示为一行。如果你想让 HTML 显示两行，必须使用标签，例如\
  \ `<br />` 标签。因此，将 PHP 的行结束特殊字符更改为 HTML 标签如下：\n\n```\nprint “line 1<br />”;\nprint\
  \ “line 2”;\n```\n\n现在你在网页上看到了你想要的内容：\nline 1line 2\n\n如果你查看此输出的源代码，你会看到：\nline\
  \ 1<br />line 2\n\n![](img/image_rsrc15W5.jpg)\n\n请大量使用 `\\n`。否则，你的 HTML 源代码将会有非常长的行。例如，如果你打印一个长表单，整个内容在源代码中可能是一行很长的内容，尽管它在网页上看起来正常。使用\
  \ `\\n` 将 HTML 源代码断分成合理的行。如果源代码不是一行几英里那么长，那么检查和排除故障会容易得多![](img/image_rsrc15W6.jpg)\n\
  \n### 使用 PHP 变量\n![](img/image_rsrc15W7.jpg)\n\n变量是用于存储信息的容器。你在之前的关于 JavaScript\
  \ 的微型书中见过变量的示例。PHP 变量的定义方式略有不同，但概念完全相同。变量有一个名称，信息存储在变量中。例如，你可能将变量命名为 `$age` 并在其中存储数字\
  \ `12`。存储在变量中的信息稍后可以在脚本中使用。变量最常见的用途之一是存储用户在表单中输入的信息。\n\n在本节中，我们将为你提供有关如何正确地命名、创建\
  \ PHP 变量以及为它们赋值的详细信息。我们还会告诉你是如何使用动态变量并在不同类型的 PHP 语句中显示值。\n\n#### 变量命名\n当你为变量命名时，请记住以下规则：\n\
  \n*   **标识符**：所有变量名前面都有一个美元符号 (`$`)。这告诉 PHP 这是一个变量名。\n*   **名称开头**：变量名必须以字母或下划线开头。不能以数字开头。\n\
  *   **可接受的长度**：变量名可以是任何长度。\n*   **可接受的字符**：变量名只能包含字母、数字和下划线。\n*   **大小写敏感**：大写和小写字母是不相同的。例如，`$firstname`\
  \ 和 `$Firstname` 是不同的。如果你将信息存储在 `$firstname` 中，你无法通过变量名 `$firstName` 访问该信息![](img/image_rsrc15W8.jpg)\n\
  \n在命名变量时，使用能清晰说明变量中包含信息的名称。使用像 `$var1`、`$var2`、`$A` 或 `$B` 这样的名称对脚本并不清晰。虽然 PHP 不关心你如何命名变量，也不会混淆，但尝试遵循脚本的人很难跟踪哪个变量存储了什么。像\
  \ `$firstName`、`$age` 和 `$order` 这样的变量名更有描述性且更有帮助。\n\n#### 创建并为变量赋值\n变量可以存储数字或字符字符串。你使用单个等号\
  \ (`=`) 在变量中存储信息。例如，以下 PHP 语句为变量赋值：\n\n```\n$age = 12;\n$price = 2.5;\n$number =\
  \ -2;\n$name = “Little Peep”;\n```\n\n注意字符字符串被引号括起来，但数字没有。我们将在本章稍后的“数据类型”部分讨论更多关于使用数字和字符的内容。\n\
  \n当你向一个不存在的变量放入信息时，你就创建了该变量。例如，假设你使用以下 PHP 语句：\n\n```\n$firstname = “George”;\n\
  ```\n\n如果这是你提到变量 `$firstname`，此语句将创建该变量并设置为“George”。如果你之前有一个语句将 `$firstname` 设置为“Mary”，那么此语句会将\
  \ `$firstname` 的值更改为“George”。\n\n你也可以移除变量中的信息。你可能通过以下方式清空变量。例如，为了清空 `$age`：\n\n\
  ```\n$age = \"\";\n```\n\n变量 `$age` 存在，但不包含任何值。你可以使用以下语句来删除变量：\n\n```\nunset($age);\n\
  ```\n\n执行此语句后，变量 `$age` 不再存在。\n\n#### 使用变量变量\nPHP 允许你使用动态变量名，称为变量变量。你可以使用另一个变量的值来命名变量。例如，假设你想构造一个名为\
  \ `city` 的变量，值为 Los Angeles。你可以使用以下语句：\n\n```\n$name_of_variable = “city”;\n```\n\
  \n![](img/image_rsrc15W9.jpg)[](image_rsrc15WA.jpg) 注意变量名开头的额外美元符号 (`$`)。这表示一个变量变量。此语句创建一个值为\
  \ Los Angeles 的变量，结果如下：\n\n```\n$$name_of_variable = “Los Angeles”;\n```\n\n`name_of_variable`\
  \ 的值不会改变。\n\n以下示例显示了此功能如何工作。在目前的形式下，脚本语句可能并不有用；变量变量的真正价值在配合数组和循环使用（如微型书第二章所述）时会变得清晰。假设你想为一系列变量命名，其值为城市的人口。你可以使用以下代码：\n\
  \n```\n$Reno = 360000;\n$Pasadena = 138000;\n$cityname = “Reno”;\necho “The size\
  \ of $cityname is ${$cityname}”;\n$cityname = “Pasadena”;\necho “The size of $cityname\
  \ is ${$cityname}”;\n```\n\n注意在 echo 语句中变量名周围需要使用大括号，以便 PHP 知道变量名在哪里。如果你在语句不使用大括号，输出如下：\n\
  The size of Reno is $Reno\n\n#### 显示变量值\n你可以使用任何语句显示变量中的值：\n*   `echo`\n*   `print`\n\
  *   `print_r`\n*   `var_dump`\n\n在 echo 和 print 语句中使用变量\n你可以使用 echo 或 print 语句在网页上显示变量的值。例如，如果你将\
  \ `$age` 变量设置为 12，然后在 PHP 部分使用以下 echo 语句，输出是 12。\n\n```\necho $age;\n```\n\n如果你在\
  \ HTML 文件中包含以下行：\n\n```html\n<p>Your age is <?php echo $age ?>.</p>\n```\n\n网页上的输出是\
  \ Your age is 12.\n\n表 1-3 显示了变量在某些 print 语句中的用法输出。为了表格的需要，假设 `$string1` 被设置为 Hello\
  \ 且 `$string2` 被设置为 World!.\n\n\n\n\n## 表 1-3 print 语句\n\n| print 语句 | 输出 |\n| :---\
  \ | :--- |\n| `print $string1;` | `Hello` |\n| `print $string1,$string2;` | `HelloWorld!`\
  \ |\n| `print “$string1 $string2”;` | `Hello World!` |\n| `print “Hello “,$string2;`\
  \ | `Hello World!` |\n| `print “Hello”,” “,$string2;` | `Hello World!` |\n| `print\
  \ ‘$string1',”$string2”;` | `$string1World!` |\n\n\n\n\n![](img/image_rsrc15WB.jpg)\n\
  \n单引号和双引号对变量有不同的影响，如下所示：\n\n✦ 单引号（`‘ ‘`）：当你使用单引号时，变量名将原样输出。\n✦ 双引号（`“ ”`）：当你使用双引号时，变量名将被替换为变量的值。\n\
  \n有时，你需要将变量名括在花括号（`{ }`）中以定义变量名。例如，以下语句不会将 bird 作为 `$pet` 变量输出：\n\n```php\n$pet\
  \ = “bird”;\necho “The $petcage has arrived.\";\n```\n![](img/image_rsrc15WC.jpg)\n\
  换句话说，输出不会是 `The birdcage has arrived.`。相反，PHP 将寻找变量 `$petcage` 但无法找到它。你可以使用花括号来分离\
  \ `$pet` 变量，从而输出正确的输出：\n\n![](img/image_rsrc15WD.jpg)\n```php\n$pet = “bird”;\n\
  echo “The {$pet}cage has arrived.\";\n```\n上述语句将为你输出 `The birdcage has arrived.`。\n\
  \n## 了解变量持有值的时间\n\n变量在整个脚本期间都会保留其信息，而不仅仅是单个 PHP 部分。如果一个变量在文件开头被设置为“yes”，那么在页面结束时它仍然会持有“yes”。例如，假设你的文件包含以下语句：\n\
  \n```html\n<p>Hello World!</p>\n<?php\n$age = 15;\n$name = “Harry”;\n?>\n<p>Hello\
  \ World again!</p>\n<?php\necho $name;\n?>\n```\n第二个 PHP 部分中的 `echo` 语句将显示 Harry。这些语句生成的网页结果为\
  \ `Hello World!Hello World again!Harry`。\n\n## 使用 print_r 语句显示变量\n\nPHP 提供了一个名为\
  \ `print_r` 的函数用于查看变量中的值。你可以编写以下语句来显示变量值：\n\n```php\n$weekday = “Monday”;\nprint_r($weekday);\n\
  ```\n`print_r` 的输出是 `Monday`。\n\n## 使用 var_dump 语句显示变量\n\nPHP 提供了一个名为 `var_dump`\
  \ 的函数，你可以用它来显示变量值及其数据类型。（数据类型将在本章稍后的“理解数据类型”节中详细讨论）。你可以编写以下语句来显示变量值：\n\n```php\n\
  $weekday = “Monday”;\nvar_dump($weekday);\n```\n`var_dump` 的输出是 `string(6) “Monday\"\
  `\n\n![](img/image_rsrc15WE.jpg)!(image_rsrc15WF.jpg)\n输出显示 `$weekday` 中的值是 Monday。输出还显示该值是一个长度为六个字符的字符串数据类型。你将频繁使用\
  \ `var_dump` 对 PHP 进行故障排除。这对该目的至关重要。\n\n## 使用 PHP 常数\n\nPHP 常数与变量相似。常量被赋予名称，并在其中存储一个值。然而，常量是常量；也就是说，它们不能被脚本更改。一旦设置了常量的值，它就会保持不变。例如，如果你为\
  \ `age` 使用常量并将其设置为 21，那么该值将永远是 21。\n\n当脚本中的多个地方需要一个值且该值在脚本期间不会改变时，就会使用常量。值在脚本开始时设置在常量中。通过在整个脚本中使用常量而不是变量，你可以确保该值不会被意外更改。通过给它一个名称，你可以立即知道信息是什么。通过在脚本开始处设置一次常量（而不是在整个脚本该值），如果需要，你可以在一个地方更改常量的值，而不需要在脚本的许多地方查找该值进行更改。\n\
  \n例如，你可能会设置一个公司名称的常量和另一个公司地址的常量，并在需要的地方使用它们。然后，如果公司搬迁，你只需要更改脚本开始处公司地址常量的值，而无需找到并更改脚本中每个输出公司名称的地方。\n\
  \n你通过使用 `define` 语句设置常量。格式为 `define(“constantname”，“constantvalue”);`。\n\n![](img/image_rsrc15WG.jpg)\n\
  例如，要设置一个公司名称常量，请使用以下语句：\n\n![](img/image_rsrc15WH.jpg)\n```php\ndefine(“COMPANY”,”My\
  \ Company”);\n```\n在脚本中需要的地方使用该常量：\n\n```php\necho COMPANY;\n```\n![](img/image_rsrc15WJ.jpg)\n\
  当你输出一个常量时，不能将其括在引号中。如果你这样做，你输出的是常量名而不是值。你可以不带任何内容直接输出它（如上一个示例所示），或者括在括号中。你可以为常量使用任何可以用于变量的名称，只要你遵循这些约定：\n\
  \n✦ 无标识符：常量名前以前没有美元符号（`$`）。\n✦ 大小写：按照惯例，常量名全全大写字母，这样你可以轻松发现常量，但 PHP 本身并不在乎你不使用大写；这只是更清晰。\n\
  ✦ 字符：你可以在其中存储字符串或数字。以下语句对于 PHP 来说完全没问题：`define (“AGE”,29);`\n\n## 数据类型\n\n存储在变量或常量中的值是以特定类型的数据存储的。PHP\
  \ 提供了八种数据类型：\n\n✦ 整数（Integer）：一个整数\n✦ 浮点数（float）：带有小数位的数字数值\n✦ 字符串（String）：一系列字符\n\
  ✦ 布尔值（Boolean）：可以为真或为假的值\n✦ NULL：一个表示无值的值\n✦ 数组（Array）：一个变量中的一组值\n✦ 对象（Object）：用类创建的结构\n\
  ✦ 资源（Resource）：标识连接的引用\n\n以下是关于处理数据类型时需要知道的一些点：\n\n✦ PHP 自动确定数据类型。在编写 PHP 脚本时，你不需要指定你正在存储哪种数据类型。以下两个语句存储了不同的数据类型：\n\
  \n```php\n$var1 = 123;\n$var2 = “123”;\n```\n`$var1` 的值存储为整数。`$var2` 的值存储为字符串，因为它被括在引号中。\n\
  \n✦ PHP 在需要时会自动转换数据类型。例如，如果你相加两个变量，一个包含整数，另一个包含浮点数，PHP 会将整数转换为浮点数以便将两者相加。\n\n✦ 你可以确定数据类型。偶尔，你可能想将值存储为与\
  \ PHP 自动存储不同的类型。你可以通过强制转换设置：\n\n```php\n$var3 = “222”;\n$var4 = (int) $var3;\n```\n\
  该语句将 `$var4` 设置为 `$var3` 的值，将其转换为整数。你可以使用 `(float)` 或 `(string)` 进行转换。\n\n✦ 你可以查询数据类型。你可以用\
  \ `var_dump()` 查看数据类型。例如，你可以显示变量：\n\n```php\nvar_dump($var4);\n```\n该语句的输出为：`int(222)`。整数、浮点数、字符串、布尔值和\
  \ NULL 类型将在后续节中讨论。数组将在本章的“使用数组”节中讨论。对象将在本书第四章讨论。资源数据类型是你可能不会直接遇到的特殊类型，因此本书未涵盖。\n\
  \n## 处理整数和浮点数\n\n整数是整数，例如 1、10 和 333。浮点数也称为实数，是带有小数位的数字，例如 3.1 或 .667。PHP 自动将值存储为整数或浮点。\n\
  \n## 对数值数据类型进行算运算\n\nPHP 允许你对数字进行算运算。你通过两个数字和一个运算符来指示算运算。例如，一个运算符是加号（`+`），所以你可以这样指示算运算：1\
  \ + 2\n\n![](img/image_rsrc15WK.jpg)\n你也可以对包含数字的变量执行算运算，如下：\n\n```php\n$n1 = 1;\n\
  $n2 = 2;\n$sum = $n1 + $n2;\n```\n你可以加上数据类型不同的数字，如下：\n\n```php\n$n1 = 1.5;\n$n2\
  \ = 2;\n$sum = $n1 + $n2;\n```\nPHP 将 `$n2` 转换为浮点数 (2.0) 并将两个值相加。此时 `$sum` 是一个浮点数。\n\
  \n## 使用算术运算符 PHP 提供了五个算术运算符。表 1-4 显示了你可以使用的算术运算符。\n\n\n\n\n\n## 表 1-4: 算术运算符\n\n\
  | 运算符 | 描述 |\n| :--- | :--- |\n| `+` | 两个数字相加。 |\n| `-` | 用第一个数减去第二个数。 |\n| `*`\
  \ | 两个数字相乘。 |\n| `/` | 用第一个数除以第二个数。 |\n| `%` | 求第一个数除以第二个数后的余数。这被称为模运算。例如，在 `a =\
  \ 13 % 4` 中，`a` 被赋值为 1。 |\n\n\n\n\n你可以同时进行多次算术运算。例如，以下语句执行了三次操作：`$result = 1 + 2\
  \ * 4 + 1;`![](img/image_rsrc15WN.jpg)\n\n算术执行的顺序非常重要。根据先执行的操作，你可以得到不同的结果。PHP 先执行乘法和除法，然后执行加法和减法。在其他条件相同的情况下，PHP\
  \ 从左到右执行。因此，前面的语句按照以下顺序将 `$result` 设置为 10：\n\n```\n$result = 1 + 2 * 4 + 1​（首先执行乘法。）\n\
  $result = 1 + 8 + 1​（接着执行最左侧的加法。）\n$result = 9 + 1​（接着执行剩余加法。）\n$result  =  10\n\
  ```\n\n你可以使用括号来改变算术运算的顺序。括号内的算术运算优先执行。例如，你可以像这样写前面的语句：`$result = (1 + 2) * 4 + 1;`\n\
  \n该语句按照以下顺序将 `$result` 设置为 13：\n\n```\n$result = (1 + 2) * 4 + 1  （首先执行括号内的计算。）\n\
  $result = 3 * 4 + 1​（接着执行乘法。）\n$result = 12 + 1​（接着执行加法。）\n$result  =  13\n```\n\
  ![](img/image_rsrc15WP.jpg)\n\n根据“宁可信错”的原则，当可能出现多个答案时，最好始终使用括号。\n\n### 将数字格式化为金额\n\
  \n通常情况下，你处理的数字是金额，例如产品价格。你希望客户在网页上看到符合正确格式的价格。换句话说，金额应该始终保留两位小数。然而，PHP 以最高效率的格式存储和显示数字。如果数字是\
  \ `10.00`，它会被显示为 `10`。\n\n要将数字转换为正确的美元格式，你可以使用 `sprintf`。以下语句将数字格式化为美元格式：\n\n```php\n\
  $newvariablename = sprintf“%01.2f”, $oldvariablename);\n```\n\n该语句重新格式化 `$oldvariablename`\
  \ 中的数字，并将其以新格式存储在 `$newvariablename` 中，这是一个字符串数据类型。例如，以下语句显示了正确格式的货币：\n\n```php\n\
  $price = 25;\n$f_price = sprintf“%01.2f”,$price); \necho “$f_price”;\n```\n\n你在网页上看到的是：`25.00`\n\
  \n如果你使用 `var_dump($f_price)` 显示变量，输出为 `string(5) “25.00”`。\n\n如果你想在数字中使用逗号分隔千分位，可以使用\
  \ `number_format`。以下语句创建了带有逗号的美元格式：![](img/image_rsrc15WR.jpg)\n\n```php\n$price\
  \ = 25000;\n![](img/image_rsrc15WS.jpg)\n$f_price = number_format($price,2); \n\
  echo “$f_price”;\n```\n\n你在网页上看到的是：![](img/image_rsrc15WT.jpg) `25,000.00`\n\n`number_format`\
  \ 语句中的 `2` 将格式设置为两位小数。你可以使用任何数字来获取任意位小数。此外，你可以在输出的金额前添加一个 `$` 符号，如下：`echo “$” .\
  \ $f_price;`\n\n### 处理字符字符串\n\n字符串是字符的序列。字符包括字母、数字和标点符号。当数字被当作字符时，它只是一个存储的字符，与字母相同。它不能用于算术运算。例如，电话号码被存储为字符串，因为它只需要存储——而不是相加或相乘。\n\
  \n#### 给变量赋值字符串\n\n当你将字符串存储在变量中，通过使用双引号或单引号告诉 PHP 字符串的开始和结束。例如，以下两个语句的结果相同：\n\n\
  ```php\n$string = “Hello World!”\n$string = ‘Hello World!';\n```\n\n然而，假设你想存储如下字符串：\n\
  \n```php\n$string = ‘It is Sally’s house’; \necho $string;\n```\n\n这些语句无法工作，因为 PHP\
  \ 在 Sally 后面看到 `’`（单引号）时，认为这是字符串的结束，显示为：`It is Sally`\n\n你需要告诉 PHP 将单引号（`’`）解释为撇号而不是字符串的结束。你可以通过在单引号前面使用反斜符（`\\\
  `）来实现。反斜符告诉 PHP 单引号没有特殊含义；它只是一个撇号。这被称为字符转义。使用以下语句显示整个字符串：![](img/image_rsrc15WU.jpg)\n\
  \n```php\n$string = ‘It is Sally\\’s house’;\necho $string;\n```\n\n同样，当你用双引号包含字符串时，也必须在字符串中的任何双引号前面使用反斜符。\n\
  \n#### 在字符串中使用单引号和双引号\n\n单引号字符串和双引号字符串的处理方式不同，如下所示：\n* 单引号字符串是字面存储的——`’` 除外，后者被存储为撇号。\n\
  * 在双引号字符串中，变量和特殊字符在存储字符串之前会被求值。\n\n以下是使用单、双引号的主要区别：\n\n* **处理变量**：如果你在双引号中包含变量，PHP\
  \ 会使用变量的值。如果你在单引号中包含变量，PHP 会使用变量名。例如，如果你使用以下代码：\n\n```php\n$month = 12;\n$result1\
  \ = “$month”;\n$result2 = ‘$month’; \necho $result1;\necho $result2;\n```\n输出是 `12`\
  \ 和 `$month`。\n\n* **换行**：特殊字符 `\\n` 告诉 PHP 换行。当你使用双引号时，PHP 会换行；使用单引号时，`\\n` 是字面字符串。例如，当你使用以下代码：\n\
  \n```php\n$string1 = “String in\\ndouble quotes”;\n$string2 = ‘String in\\nsingle\
  \ quotes’;\n```\n\n* **制表符**：特殊字符 `\\t` 告诉 PHP 插入制表符。当你使用双引号时，PHP 在 `\\t` 处插入制表符，但使用单引号时，`\\\
  t` 是字面字符串。例如，当你使用以下代码：\n\n```php\n$string1 = “String in\\tdouble quotes”(jpg)\n\
  $string2 = ‘String in\\tsingle quotes’;\n```\n\n* **包裹整个字符串的引号决定了变量和特殊字符的处理方式**，即使字符串内部还有其他引号。例如，查看以下内容：\n\
  \n```php\n$number = 10;\n$string1 = “There are ‘number’ people in line.”\n$string2\
  \ = ‘There are “number” people waiting.’;\necho $string1;\necho $string2;\n```\n\
  输出为：`There are '10' in line.` 和 `There are \"10\" people waiting.`\n\n#### 合并字符串\n\
  \n你可以使用点（`.`）合并字符串，这种过程被称为拼接。例如，你可以合并以下合并字符串：\n\n```php\n$string1 = ‘Hello’;\n$string2\
  \ = ‘World!’\n$stringall = $string1.$string2;\necho $stringall;\n```\n`echo` 语句的输出是\
  \ `HelloWorld!`。注意 Hello 和 World 之间没有空格，因为合并的两个字符串中没有包含空格。你可以使用以下拼接代替之前的语句在单词之间添加空格：\n\
  \n```php\n$stringall = “Hello”;\n$stringall .= “ World!”\necho $stringall;\n```\n\
  输出为：`Hello!`\n\n#### 存储长字符串\n\nPHP 提供了一种名为 `heredoc` 的功能，用于赋值跨多行的长字符串。heredoc 允许你告诉\
  \ PHP 字符串的开始和结束。`heredoc` 语句的格式如下：\n\n```php\n$varname = <<<ENDSTRING\ntext\nENDSTRING;\n\
  ```\n\n`ENDSTRING` 可以包含任何你想使用的字符串，正如你之后会看到的。通过在开头和结尾再次输入 `ENDSTRING` 来包含存储在变量 `$varname`\
  \ 中的文本。当 PHP 处理 heredoc 时，它读取第一个 `ENDSTRING` 并知道开始向 `$varname` 中读取文本。它持续读取直到遇到同一个\
  \ `ENDSTRING`。此时，字符串结束。`heredoc` 语句创建的字符串处理变量和特殊字符的方式与双引号字符串相同。以下语句使用 heredoc 方法创建一个字符串：\n\
  \n```php\n$distance = 10;\n$herevariable = <<<ENDOFTEXT\nThe distance between Los\
  \ Angeles and Pasadena is $distance miles.\nENDOFTEXT;\necho $herevariable;\n```\n\
  `echo` 语句的输出如下：`The distance between Los Angeles and Pasadena is 10 miles.`![](img/image_rsrc15WX.jpg)![](img/image_rsrc15WY.jpg)\n\
  \n但请注意。PHP 对 `ENDSTRING` 非常挑剔。当它第一次出现时，`ENDSTRING`（本例中为 ENDOFTEXT）必须出现在第一行的末尾，后面不能有任何内容，甚至没有空格。最后一行的\
  \ `ENDSTRING` 必须出现在行的开头，前面不能有任何内容，甚至不能有![](img/image_rsrc15WZ.jpg)空格。如果违反了这些规则，PHP\
  \ 将无法识别结束字符串，并在脚本的其余部分继续寻找。它最终会显示一个显示脚本最后一行行号的解析错误。\n\n#### 处理布尔类型\n\n布尔类型仅取 `true`\
  \ 或 `false` 的值。你可以如下所示给变量赋值布尔值：\n\n```php\n$var1 = true;\n```\n\nPHP 将变量设置为布尔类型。布尔值用于在条件语句（如\
  \ `if` 语句）中比较值和表达式。比较值将在在本类型书的第 2 章中详细讨论。\n\n以下值被 PHP 评估为 `false`：\n* 单词 `false`\n\
  * 整数 `0`\n* 浮点数 `0.0`\n* 空字符串\n* 值为 `0` 的字符串\n* 空数组\n* 空对象\n* 值为 `NULL` 的类型\n\n\
  如果变量包含的值不被评估为 `false`，则赋值为 `true`。\n\n#### 处理 NULL 类型\n\n`NULL` 类型的唯一值是 `NULL`。你可以如下所示给变量赋值：\n\
  \n```php\n$var1 = NULL;\n```\n\n变量不包含值。\n\n### 使用数组\n\n数组是复杂的变量。数组在单个变量名下存储一组值，适用于存储相关值。例如，你可以在名为\
  \ `$flower` 的单个数组中存储信息（如品种、颜色和成本）。数组中的信息可以很容易处理、访问和修改。例如，PHP 有多种方法对数组进行排序。\n\n#####\
  \ 创建数组\n\n创建数组的最简单方法是在变量末尾使用方括号 `[]` 赋值。例如，假设你在脚本之前的任何地方都没有引用 `$cities`，以下语句创建一个名为\
  \ `$cities` 的数组：\n\n```php\n$cities = \"Phoenix\";\n```\n\n此时，数组已创建且只有一个值：Phoenix。接下来，使用以下语句：\n\
  \n```php\n$cities[2] = \"Tucson\";\n$cities[3] = \"Flagstaff\";\n```\n\n现在数组 `$cities`\
  \ 包含三个值：Phoenix、Tucson 和 Flagstaff。\n\n数组可以视为键值对列表。每个键值对被称为一个元素。要获取特定值，请在括号中指定键。在前面的数组中，键是数字——1、2\
  \ 和 3。然而，你也可以使用单词作为键。例如，以下语句创建一个州府数组：\n\n```php\n$capitals['CA'] = \"Sacramento\"\
  ;\n$capitals['TX'] = \"Austin\";\n$capitals['OR'] = \"Salem\";\n```\n\n你可以使用快捷方法而不是为每个数字编写单独的赋值语句。快捷方法如下：\n\
  \n```php\n$cities[] = \"Phoenix\";\n$cities[] = \"Tucson\";\n$cities[] = \"Flagstaff\"\
  ;\n```\n\n当你使用这种快捷方法创建数组时，值会自动分配从 0 开始的序列号键。例如，以下语句输出：\n\n```php\necho $cities[0];\n\
  ```\n![](img/image_rsrc15X0.jpg)![](img/image_rsrc15X1.jpg) 数组的第一个值是 0，除非你故意设置为不同的数字。处理数组时一个常见错误是将第一个数字认为是\
  \ 1 而不是 0。更好的快捷方法是使用以下内容：![](img/image_rsrc15X2.jpg)\n\n```php\n$cities = array(\"\
  Phoenix\",\"Tucson\",\"Flagstaff\");\n```\n\n该语句创建了与快捷方法相同的数组，具有编号键。你可以使用类似的语句创建以单词作为键的数组。例如，以下语句创建州府：\n\
  \n```php\n$capitals = array(\"CA\" => \"Sacramento\", \"TX\" => \"Austin\", \"OR\"\
  \ => \"Salem\");\n```\n\n##### 查看数组\n\n你可以这样输出数组值：\n\n```php\necho $capitals['TX'];\n\
  ```\n\n如果你在双引号的长的 echo 语句中包含数组值，你可能需要用大括号包裹数组名：\n\n```php\necho \"The capital of\
  \ Texas is {$capitals['TX']}\";\n```\n\n你可以使用 `print_r` 或 `var_dump` 语句查看任何数组的结构和值。要显示\
  \ `$capitals` 数组，使用以下之一：\n\n```php\nprint_r($capitals);\nvar_dump($capitals);\n\
  ```\n\n`print_r` 语句输出：`Array ([CA] => Sacramento [TX] => Austin [OR] => Salem)`\n\
  \n`var_dump` 语句输出：\n\n```\narray(3) {\n  [\"CA\"]=>string(10) \"Sacramento\"\n \
  \ [\"TX\"]=>string(6) \"Austin\"\n  [\"OR\"]=>string(5) \"Salem\"\n}\n```\n\n`print_r`\
  \ 输出数组中每个元素的键和值。`var_dump` 输出数据类型以及键和值。(image_rsrc15X3.jpg)\n\n##### 从数组中删除值\n\n\
  有时你需要从数组中完全删除一个元素。例如，假设你有以下包含五个元素的数组：\n\n```php\n$cities[0] = \"Phoenix\";\n$cities[1]\
  \ = \"Tucson\";\n$cities[2] = \"Flagstaff\";\n$cities[3] = \"Tempe\";\n$cities[4]\
  \ = \"Prescott\";\n```\n\n现在你决定不再包含 Tempe，所以使用以下语句尝试从数组中删除 Tempe：\n\n```php\n$cities[3]\
  \ = \"\";\n```\n\n虽然该语句将 `$cities[3]` 设置为空字符串，但它并没有从数组中删除该元素。你仍然有一个五个元素的数组，但其中一个值是空的。要完全从数组中删除元素，你需要使用以下语句\
  \ `unset` 它：\n\n```php\nunset($cities[3]);\n```\n\n现在你的数组只有四个元素了，如下：\n\n```php\n\
  $cities[0] = \"Phoenix\";\n$cities[1] = \"Tucson\";\n$cities[2] = \"Flagstaff\"\
  ;\n```\n\n![](img/image_rsrc15X4.jpg)排序 ![](img/image_rsrc15X5.jpg)数组最有用的功能之一是 PHP\
  \ 可以对它们进行排序。PHP 最初按照你创建它们的顺序存储元素。如果在不改变顺序的情况下显示整个数组，元素将按照创建顺序排列。通常，你想改变这个顺序。PHP\
  \ 可以通过多种方式对数组进行排序。对于数字数组，使用 `sort` 函数如下：\n\n```php\nsort($cities);\n```\n\n`sort`\
  \ 语句根据值分配新的键。值按数字排序，接着是大写字母，最后是小写字母。例如，考虑创建的 `$cities` 数组：\n\n```php\n$cities[0]\
  \ = \"Phoenix\";\n$cities[1] = \"Tucson\";\n$cities[2] = \"Flagstaff\";\n```\n\n\
  在 `sort($cities)` 语句后，数组变为：\n\n```\n$cities[0] = \"Flagstaff\";\n![](img/image_rsrc15X6.jpg)\n\
  $cities[1] = \"Phoenix\";\n$cities[2] = \"Tucson\";\n```\n\n如果你使用 `sort()` 对带有单词键的数组进行排序，键将变为数字，单词键会被丢弃。对于带有单词键的数组，使用\
  \ `asort` 函数。该语句根据值排序并保留原始键。例如，考虑州府数组：\n\n```php\n$capitals['CA'] = \"Sacramento\"\
  ;\n$capitals['TX'] = \"Austin\";\n$capitals['OR'] = \"Salem\";\n```\n\n在 `asort($capitals)`\
  \ 语句后，数组：PHP 提供了一种名为 `heredoc` 的功能，用于赋值跨越几行的长字符串。heredoc 允许你告诉 PHP 字符串的开始和结束。`heredoc`\
  \ 语句的格式如下：\n\n```php\n$varname = <<<ENDSTRING\ntext\nENDSTRING;\n```\n\n`ENDSTRING`\
  \ 可以包含任何你想使用的字符串，正如你之后会看到的。通过在开头和结尾再次输入 `ENDSTRING` 来包含存储在变量 `$varname` 中的文本。当 PHP\
  \ 处理 heredoc 时，它读取第一个 `ENDSTRING` 并知道开始向 `$varname` 中读取文本。它持续读取直到遇到同一个 `ENDSTRING`。此时，字符串结束。`heredoc`\
  \ 语句创建的字符串处理变量和特殊字符的方式与双引号字符串相同。以下语句使用 heredoc 方法创建一个字符串：\n\n```php\n$distance =\
  \ 10;\n$herevariable = <<<ENDOFTEXT\nThe distance between Los Angeles and Pasadena\
  \ is $distance miles.\nENDOFTEXT;\necho $herevariable;\n```\n`echo` 语句的输出如下：`The\
  \ distance between Los Angeles and Pasadena is 10 miles.`![](img/image_rsrc15WX.jpg)![](img/image_rsrc15WY.jpg)\
  \ 但请注意。PHP 对 `ENDSTRING` 非常挑剔。当它第一次出现时，`ENDSTRING`（本例中为 ENDOFTEXT）必须出现在第一行的末尾，后面不能有任何内容，甚至没有空格。最后一行的\
  \ `ENDSTRING` 必须出现在行的开头，前面不能有任何内容，甚至不能有![](img/image_rsrc15WZ.jpg)空格且后面不能有分号以外的任何内容。如果违反了这些规则，PHP\
  \ 将无法识别结束字符串并在脚本的其余部分继续寻找。它最终会显示一个显示脚本最后一行行号的解析错误。 处理布尔类型 布尔类型仅取 `true` 或 `false`\
  \ 的值。你可以如下所示给变量赋值布尔值：\n\n```php\n$var1 = true;\n```\n\nPHP 将变量设置为布尔类型。布尔值用于在条件语句（如\
  \ `if` 语句）中比较值和表达式。比较值将在在本类型书的第 2 章中详细讨论。以下值被 PHP 评估为 `false`：\n* 单词 `false`\n*\
  \ 整数 `0`\n* 浮点数 `0.0`\n* 空字符串\n* 值为 `0` 的字符串\n* 空数组\n* 空对象\n* 值为 `NULL` 的类型 如果变量包含的值不被评估为\
  \ `false`，则赋值为 `true`。 处理 NULL 类型。`NULL` 类型的唯一值是 `NULL`。你可以如下所示给变量赋值：\n\n```php\n\
  $var1 = NULL;\n```\n\n变量不包含值。 使用数组 数组是复杂的变量。数组在单个变量名下存储一组值，适用于存储相关值。例如，你可以在名为 `$flower`\
  \ 的单个数组中存储信息（如品种、颜色和成本）。数组中的信息可以很容易处理、访问和修改。例如，PHP 有多种方法对数组进行排序。##### 创建数组 创建数组的最简单方法是在变量末尾使用方括号\
  \ `[]` 赋值。例如，假设你在脚本之前的任何地方都没有引用 `$cities`，以下语句创建一个名为 `$cities` 的数组：\n\n```php\n\
  $cities = \"Phoenix\";\n```\n\n此时，数组已创建且只有一个值：Phoenix。接下来，使用以下语句：\n\n```php\n$cities[2]\
  \ = \"Tucson\";\n$cities[3] = \"Flagstaff\";\n```\n\n现在数组 `$cities` 包含三个值：Phoenix、Tucson\
  \ 和 Flagstaff。数组可以视为键值对列表。每个键值对被称为一个元素。要获取特定值，请在括号中指定键。在前面的数组中，键是数字——1、2 和 3。然而，你也可以使用单词作为键。例如，以下语句创建一个州府数组：\n\
  \n```php\n$capitals['CA'] = \"Sacramento\";\n$capitals['TX'] = \"Austin\";\n$capitals['OR']\
  \ = \"Salem\";\n```\n\n你可以使用快捷方法而不是为每个数字编写单独的赋值语句。快捷方法如下：\n\n```php\n$cities[] =\
  \ \"Phoenix\";\n$cities[] = \"Tucson\";\n$cities[] = \"Flagstaff\";\n```\n\n当你使用这种快捷方法创建数组时，值会自动分配从\
  \ 0 开始的序列号键。例如，以下语句输出：\n\n```php\necho $cities[0];\n```\n![](img/image_rsrc15X0.jpg)![](img/image_rsrc15X1.jpg)\
  \ 数组的第一个值是 0，除非你故意设置为不同的数字。处理数组时一个常见错误是将第一个数字认为是 1 而不是 0。更好的快捷方法是使用以下内容：![](img/image_rsrc15X2.jpg)\n\
  \n```php\n$cities = array(\"Phoenix\",\"Tucson\",\"Flagstaff\");\n```\n\n该语句创建了与快捷方法相同的数组，具有编号键。你可以使用类似的语句创建以单词作为键的数组。例如，以下语句创建州府：\n\
  \n```php\n$capitals = array(\"CA\" => \"Sacramento\", \"TX\" => \"Austin\", \"OR\"\
  \ => \"Salem\");\n```\n\n##### 查看数组 你可以这样输出数组值：\n\n```php\necho $capitals['TX'];\n\
  ```\n\n如果你在双引号的长的 echo 语句中包含数组值，你可能需要用大括号包裹数组名：\n\n```php\necho \"The capital of\
  \ Texas is {$capitals['TX']}\";\n```\n\n你可以使用 `print_r` 或 `var_dump` 语句查看任何数组的结构和值。要显示\
  \ `$capitals` 数组，使用以下之一：\n\n```php\nprint_r($capitals);\nvar_dump($capitals);\n\
  ```\n\n`print_r` 语句输出：`Array ([CA] => Sacramento [TX] => Austin [OR] => Salem)`\n\
  \n`var_dump` 语句输出：\n\n```\narray(3) {\n  [\"CA\"]=>string(10) \"Sacramento\"\n \
  \ [\"TX\"]=>string(6) \"Austin\"\n  [\"OR\"]=>string(5) \"Salem\"\n}\n```\n\n`print_r`\
  \ 输出数组中每个元素的键和值。`var_dump` 输出数据类型以及键和值。(image_rsrc15X3.jpg) ##### 从数组中删除值 有时你需要从数组中完全删除一个元素。例如，假设你有以下包含五个元素的数组：\n\
  \n```php\n$cities[0] = \"Phoenix\";\n$cities[1] = \"Tucson\";\n$cities[2] = \"Flagstaff\"\
  ;\n$cities[3] = \"Tempe\";\n$cities[4] = \"Prescott\";\n```\n\n现在你决定不再包含 Tempe，所以使用以下语句尝试从数组中删除\
  \ Tempe：\n\n```php\n$cities[3] = \"\";\n```\n\n虽然该语句将 `$cities[3]` 设置为空字符串，但它并没有从数组中删除该元素。你仍然有一个五个元素的数组，但其中一个值是空的。要完全从数组中删除元素，你需要使用以下语句\
  \ `unset` 它：\n\n```php\nunset($cities[3]);\n```\n\n现在你的数组只有四个元素了，如下：\n\n```php\n\
  $cities[0] = \"Phoenix\";\n$cities[1] = \"Tucson\";\n$cities[2] = \"Flagstaff\"\
  ;\n```\n\n\n\n\n## 表 1-5: 数组的排序方法\n\n| 排序语句 | 功能描述 |\n| :--- | :--- |\n| `sort($arrayname)`\
  \ | 按值排序；将新数字作为键名。 |\n| `asort($arrayname)` | 按值排序；保留原有键名。 |\n| `rsort($arrayname)`\
  \ | 按值倒序排序；将新数字作为键名。 |\n| `arsort($arrayname)` | 按值倒序排序；保留原有键名。 |\n| `ksort($arrayname)`\
  \ | 按键排序。 |\n| `krsort($arrayname)` | 按键倒序排序。 |\n| `usort($arrayname,functionname)`\
  \ | 使用函数排序。（参见下一章。） |\n\n\n\n\n\n# 从数组中获取值\n\n你可以通过直接访问来检索数组中的任何单个值，如下所示：\n\n```php\n\
  $CAcapital = $capitals['CA']; \necho $CAcapital ;\n```\n这些语句的输出是 Sacramento ![](img/image_rsrc15X7.jpg)\n\
  \n如果你使用不存在的数组元素，会显示一个通知（notice）。（参阅本章节稍后“理解 PHP 错误消息”部分关于通知的内容。）例如，假设你使用了以下语句：\n\
  \n```php\n$CAcapital = $capitals['CAx'];\n```\n![](img/image_rsrc15X8.jpg)\n\n如果数组\
  \ `$capitals` 存在但没有键为 `CAx` 的元素，你会看到以下通知：\n`Notice: Undefined index: CAx in d:\\\
  testarray.php on line 9`\n\n通知不会导致脚本停止。通知之后的语句将继续执行。但由于没有值被放入 `$CAcapital`，任何随后的\
  \ `echo` 语句都将输出空空格。你可以使用 `@` 符号来防止显示通知：\n\n```php\n$CAcapital = @capitals['CAx'];\n\
  ```\n\n你可以使用 `list` 语句一次性从数组获取多个值，或者使用 `extract` 语句获取数组中的所有值。`list` 函数从数组获取值并将其放入变量中。以下语句包含一个\
  \ `list` 语句：\n\n```php\n$flowerInfo = array (“Rose”, “red”, 12.00);  \nlist($firstvalue,$secondvalue)\
  \ = $flowerInfo; \necho $firstvalue,”<br />”;\necho $secondvalue,”<br />”;\n```\n\
  第一行创建了 `$flowerInfo` 数组。第三行设置了名为 `$firstvalue` 和 `$secondvalue` 的两个变量，并将 `$flowerInfo`\
  \ 前两个值复制到这两个新变量中，就像你使用了以下两个语句一样：\n\n```php\n$firstvalue=$flowerInfo[0];\n$secondvalue=$flowerInfo[1];\n\
  ```\n`flowerInfo` 中的第三个值没有复制到变量中，因为 `list` 语句包含了两个变量。`echo` 语句的输出是 Rose red。\n\n\
  你可以使用 `extract` 获取以单词键的数组的所有值。每个值都被复制到一个与键同名的变量中。例如，假设 `$flowerinfo` 数组如下所示：\n\n\
  ```php\n$flowerInfo = array (“variety”=>”Rose”, “color”=>”red”, “cost”=>12.00);\n\
  ```\n以下语句从 `$flowerInfo` 获取所有信息并将其输出：\n\n```php\nextract($flowerInfo);\necho “variety\
  \ is $variety; color is $color; cost is $cost”;\n```\n这些语句的输出是 variety is Rose;\
  \ color is red; cost is 12.00;\n\n## 遍历数组\n\n你通常想对数组中的每个值执行某些操作。你可能想 `echo` 每个值，将每个值存储在数据库中，或者给数组中的每个值加\
  \ 6。在技术术语中，按顺序遍历数组中的每一个值被称为迭代（iteration）。它有时也被称为遍历（traversing）。遍历数组有两种方法：\n\n* \
  \  **手动**：将指针从一个数组值移动到另一个值。\n*   **使用 foreach**：自动从头到尾遍历数组，一次处理一个值。\n\n## 手动遍历数组\n\
  \n你可以使用指针手动遍历数组。做到这一点，将你的数组想象成一个列表。想象有一个指针指向列表中的一个值。指针会停在一个值上，直到你移动它。移动后，它会一直停在那里，直到你再次移动它。你可以使用以下指令移动指针：\n\
  \n*   `current($arrayname)`：引用指针当前指向的值；不会移动指针。\n*   `next($arrayname)`：将指针移动到当前值之后的值。\n\
  *   `previous($arrayname)`：将指针移动到当前指针位置之前的值。\n*   `end($arrayname)`：将指针移动到数组中的最后一个值。\n\
  *   `reset($arrayname)`：将指针移动到数组中的第一个值。\n\n以下语句手动遍历一个包含州首府的数组：\n\n```php\n$value\
  \ = current ($capitals); \necho “$value”;\n$value = next ($capitals); \necho “$value”;\n\
  $value = next ($capitals); \necho “$value”;\n```\n![](img/image_rsrc15X9.jpg) ![](img/image_rsrc1XA.jpg)\n\
  \n除非你之前移动过指针，否则在开始遍历时，它位于第一个元素。如果你认为数组在脚本早些时候可能被移动过，或者你的输出从中间某个开始，请使用 `reset` 语句：\n\
  \n```php\nreset($capitals);\n```\n\n## 使用 foreach\n\n`foreach` 语句一次一个值地遍历数组。键（key）和值（value）可以在块中使用。\n\
  \n*   `arrayname`：你正在遍历的数组名称。\n*   `keyname`：你想要存储键的变量。如果你留下了 `=>`，则是可选的。\n*   `valuename`：你想要存储值的变量名称。\n\
  \n例如，以下 `foreach` 语句可以工作：\n\n```php\n$capitals = array“CA”, “TX”, “OR” );\nksort($capitals);\n\
  foreach ($capitals as $state => $city ){\n    echo “$city, $state<br />”;\n}\n```\n\
  前面的语句给页面输出为 Sacramento, CA Salem, OR Austin, TX\n\n使用此 `foreach` 语句，只有城市可用：\n\n\
  ```php\nforeach ($capitals as $city ) {\necho “$city”;\n}\n```\n当 `foreach` 开始遍历数组时，它会将指针移动到数组的开头。在用\
  \ `foreach` 遍历数组之前，不需要对数组进行 `reset`。\n\n# 使用多维数组存储值\n\n在本章前面的部分中，我们描述了单键值对列表的数组。然而，在某些情况下，你可能想要存储具有多个键的值。例如，假设你想按州和县存储城市，如下所示：\n\
  \n```php\n$cities['AZ']['Maricopa'] = Phoenix;\n$cities['AZ']['Cochise'] = Tombstone;\n\
  $cities['AZ']['Yuma'] = Yuma;\n$cities['OR']['Multnomah'] = Portland;\n$cities['OR']['Tillamook']\
  \ = Tillamook;\n$cities['OR']['Wallowa'] = Joseph;\n```\n这种数组是多维数组，因为它类似于具有以下结构的“数组的数组”:\n\
  \n| $cities | key | value | |\n| :--- | :--- | :--- | :--- |\n| | AZ | Maricopa\
  \ | Phoenix |\n| | | Cochise | Tombstone |\n| | | Yuma | Yuma |\n| | OR | Multnomah\
  \ | Portland |\n| | | Tillamook | Tillamook |\n| | | Wallowa | Joseph |\n\n\n\n\n\
  \n![](img/image_rsrc15XB.jpg)`$cities` 是一个二维数组。![](img/image_rsrc15XC.jpg)![](img/image_rsrc15XD.jpg)\n\
  \nPHP 也可以理解深度为四、五、六或更多层级的多维数组。然而，当人们尝试理解超过三层的数组时，往往会感到头疼。随着维度的增加，混乱的可能性随之增加。请尽量保持你的多维数组在可管理的范围内。\n\
  \n你可以使用与一维数组相同的步骤从多维数组中获取值。例如，你可以通过此语句直接访问某个值：`$city = $cities['AZ']['Yuma'];`；\
  \ \n\n你也可以输出该值：`echo $cities['OR']['Wallowa'];`；\n\n然而，如果你在双引号内组合该值，你需要使用大括号来包裹变量名。用于变量名的\
  \ `$` 符号必须紧跟在 `{` 之后，不能有空格，如下：`echo “A city in Multnomah County, Oregon, is {$cities['OR']['Multnomah']]}”;`；输出是：`A\
  \ city in Multnomah County, Oregon, is Portland`\n\n你可以通过 `foreach` 语句（在上一节中描述）遍历多维数组。你为每个数组都需要一个\
  \ `foreach` 语句。一个 `foreach` 语句位于另一个 `foreach` 语句内部。将语句放在其他语句内部被称为嵌套。\n\n由于二维数组（如\
  \ `$cities`）包含两个数组，因此需要两个 `foreach` 语句来遍历它。以下语句从多维数组中获取值并将它们以 HTML 表格的形式输出：\n\n\
  ```php\nforeach( $cities as $state ){\n    foreach( $state as $county => $city ){\n\
  \        echo “$city, $county county <br />”;\n    }\n}\n```\n\n第一个 `foreach` 语句遍历\
  \ `$cities` 多维数组，并将一个包含 `county/city` 键值对的数组存储在变量 `$state` 中。第二个 `foreach` 语句遍历存储在\
  \ `$state` 中的数组。这些语句将给你以下输出：\n\nPhoenix, Maricopa county\nTombstone, Cochise county\n\
  Yuma, Yuma county\nPortland, Multnomah county\nTillamook, Tillamook county\n\n###\
  \ 使用日期和时间\n\n日期和时间可以是 Web 数据库应用程序中的重要元素。PHP 具有识别日期和时间并以不同于普通字符串处理它们的能力。计算机以名为 `timestamp`（时间戳）的格式存储日期和时间。然而，这不是你希望看到的日期格式。PHP\
  \ 将你表示法中的日期转换为计算机理解的 `timestamp`，并将 `timestamp` 转换为人们熟悉的格式。PHP 使用内置函数处理日期和时间。\n\n\
  ![](img/image_rsrc15XE.jpg)\n\n时间戳格式是 `Unix Timestamp`（Unix 时间戳），它是一个从 1970 年 1\
  \ 月 1 日 00:00:00 GMT（格林尼治标准时间）到时间戳所代表的秒数。这种格式使得计算两个日期之间的时间变得简单——只需从一个时间戳减去另一个。\n\
  \n#### 设置本地时间\n\n随着 PHP 5.1 的发布，PHP 在 `php.ini` 中添加了默认本地时区的设置。如果你不设置默认时区，PHP 将进行猜测，有时结果是\
  \ GMT。此外，PHP 会显示一条消息建议你设置本地时区。\n\n要设置默认时区，请按照以下步骤操作：\n\n1. 用文本编辑器打开 `php.ini`。\n\
  2. 滚动到标题为 `[Date]` 的部分。\n3. 找到设置 `date.timezone =`。\n4. 如果该行以分号（`;`）开头，删除分号。\n5.\
  \ 在等号后添加时区代码。\n\n![](img/image_rsrc15XF.jpg)![](img/image_rsrc15XG.jpg)\n\n你可以在附录\
  \ H 中看到时区代码列表。\n\n\n\n\n\n# 在变量中存储时间戳\n\n你可以使用以下语句将带有当前日期和时间的时间戳赋值给变量：\n```php\n\
  $today = time();\n```\n\n存储当前时间戳另一种方法是使用语句：\n```php\n$today = strtotime(\"today\"\
  );\n```\n\n你可以通过使用 `strtotime` 以及各种类似于英语的关键词和缩写来存储特定的时间戳。例如，你可以为 2014 年 1 月 月 15\
  \ 日创建一个时间戳：\n```php\n$importantDate = strtotime(\"January 15 2014\");\n```\n\n`strtotime`\
  \ 语句识别以下单词和缩写：\n* 月份名称：十二个月份及缩写\n* 星期：七天及一些缩写\n* 时间单位：year (年), month (月), fortnight\
  \ (两周), week (周), day (天), hour (小时), minute (分钟), second (秒), am, pm\n* 一些常用的英语单词：ago\
  \ (以前),now (现在),last (上一个),next (下一个),this (这个),tomorrow (明天),yesterday (昨天)\n*\
  \ 加减：`+` 或 `-`\n* 所有数字\n* 时区：例如，`gmt` (格林维治标准时间), `pdt` (太平洋夏令时间), 和 `akst` (阿拉斯加标准时间)\n\
  \n你可以以多种方式组合这些单词和缩写。以下语句都是有效的：\n```php\n$importantDate = strtotime(\"tomorrow\"\
  ); // 现在 24 小时后\n$importantDate = strtotime(\"now + 24 hours\");\n$importantDate\
  \ = strtotime(\"last saturday\"); // 上周六\n$importantDate = strtotime(\"8pm + 3 days\"\
  );\n$importantDate = strtotime(\"2 weeks ago\"); // 当前时间\n$importantDate = strtotime(\"\
  next year gmt\");\n$importantDate = strtotime(\"this 4am\"); // 今天凌晨 4 点\n```\n\n\
  如果你想知道 `$importantDate` 是多久以前的，可以从 `$today` 中减去它。例如：\n```php\n$timeSpan = $today\
  \ - $importantDate;\n```\n这可以给你得到重要日期和今天之间的秒数。或者使用语句 `$timeSpan = (($today - $importantDate)/60)/60;`\
  \ 来计算自重要日期以来的小时数。\n\n# 理解 PHP 错误消息\n\n当出现问题时，PHP 会尝试提供帮助。它提供了尽可能详细的不同类型的错误消息和警告。在这里我们将介绍这些不同类型的错误消息，并提供一些处理它们的提示。我们还会告诉你如何显示或关闭错误消息，以及如何将错误消息存储在日志文件中。\n\
  \n## PHP 错误消息类型\n\nPHP 可以显示五种类型的消息。每种消息都会显示遇到错误的文件以及 PHP 遇到问题的行号。不同的错误类型会在错误消息中提供额外信息。消息类型有：\n\
  * **Parse error (解析错误)**：解析错误是 PHP 在执行脚本之前扫描脚本时发现的语法错误。\n* **Fatal error (致命错误)**：PHP\
  \ 遇到了严重的错误，停止了脚本的执行。\n* **Warning（警告）**：PHP 发现了一个问题，但问题的严重程度不足以阻止脚本运行。\n* **Notice（通知）**：PHP\
  \ 发现了一个可能是错误但也可能是完全正常的条件。\n* **Strict（严格）**：PHP 5 添加的严格消息，用于警告编码标准。\n\n当你使用编码实践不佳或已被更好的代码替换的语言时，会收到严格消息。我们建议使用带有行号的编辑器编写\
  \ PHP 脚本。如果你的编辑器没有让你指定想要跳转的行，你就必须在每次收到错误消息时从文件顶部手动计算行数。你可以在 [www.php-editors.com](http://www.php-editors.com/)\
  \ 找到许多编辑器的信息，包括描述和评论。\n\n## 理解解析错误\n\n在运行脚本之前，PHP 会扫描脚本中的语法错误。当它遇到错误时，会显示解析错误消息。解析错误是一种致命错误，会阻止脚本甚至开始运行。解析错误看起来类似于：\n\
  ```\nParse error: parse error, error in c:\\test.php on line 6\n```\n通常，你收到此错误消息是因为你忘记了分号、括号或大括号。显示的错误提供了尽可能多的信息。例如，可能会显示以下内容：\n\
  ```\nParse error: parse error, unexpected T_ECHO, expecting ‘,’ or ‘’, in c:\\test.php\
  \ on line 6\n```\n这意味着 PHP 在它期望逗号或分号的地方发现了一个 `echo` 语句，意味着你忘记了上一行末尾的分号。`T_ECHO`\
  \ 是一个标记（token）。标记代表 PHP 语言的各个部分。有些（如 `T_ECHO` 或 `T_IF`）非常清晰。有些则更为晦涩。请参 PHP 手册中的标记附录（[www.php.net/manual/en/tokens.php](http://www.php.net/manual/en/tokens.php））获取标记及其含义的列表。\n\
  \n## 理解致命错误\n\n当 PHP 在脚本执行过程中遇到阻止脚本继续执行的严重错误时，会显示致命错误消息。脚本停止运行并显示包含尽可能信息的消息以帮助你识别问题。产生致命错误的问题之一是调用不存在的函数（函数在本书中第\
  \ 2 章中解释）。如果你在 PHP 脚本中拼错了一个函数名，你会看到类似下面的致命错误消息：\n```\nFatal error: Call to undefined\
  \ function() in C:\\Program Files\\Apache Group\\Apache2\\htdocs\\PHPand\\info.php\
  \ on line 10\n```\n在这种情况下，PHP 在第 10 行找不到名为 `xxx` 的函数。我们使用致命错误术语来将此类错误与其他错误区分开。然而，PHP\
  \ 只是将它们称为（误导地）错误。在手册中找不到 fatal error 术语。显示这些错误的关键字是 `E_ERROR`。\n\n## 理解警告\n\n当脚本遇到问题但问题的严重程度不足以阻止脚本运行时，会显示警告消息。警告消息并不意味着脚本不能运行；脚本继续运行。相反，警告消息告诉你\
  \ PHP 认为可能存在错误。你应该识别警告的来源并决定是否需要修复。通常，如果你尝试使用无效的用户名或密码连接 MySQL 数据库，你会看到以下警告消息：\n\
  ```\nWarning: mysql_connect() []: Access denied for user ‘root’@’localhost’ (using\
  \ password: YES) in C:\\...\\htdocs\\test.php on line 9\n```\n连接数据库失败，但脚本没有停止运行。然而，由于后面的语句取决于数据库连接的建立，无法正确执行。产生警告消息的语句需要修复。\n\
  \n## 理解通知\n\n当 PHP 看到一个可能是错误也可能是完全正常的条件时，会显示通知。与警告一样，通知不会导致脚本停止运行。比警告更少指示严重问题。通知只是告诉你你做了一些异常的事情，并让你检查一下。收到通知的一个常见原因是是你正在输出不存在的变量。以下是你可能看到的通知示例：\n\
  ```\nNotice: Undefined variable: age in testing.php on line 9\n```\n\n## 严格消息\n\n\
  严格消息警告编码标准。它们指出编码实践不佳或已被更好的代码替换。PHP 5 添加了严格错误类型。严格消息不会停止脚本的执行。然而，修改你的代码以不再看到任何严格消息会让脚本在未来更可靠。严格消息强调的语言特性未来可能会被完全移除。\n\
  \n某些严格消息指的是过时的（deprecated）函数。过时的函数已被新函数替换，仍然支持但在未来将被移除。PHP 可能会添加单独的错误类型 `E_DEPRECATED`\
  \ 来识别此类错误。\n\n# 显示错误消息\n\n你可以通过以下方式处理错误消息：\n* 在你的网页上显示部分或所有错误消息。\n* 不显示任何错误消息。\n\
  * 抑制单个错误消息。你可以通过 `php.ini` 文件中的设置或脚本中的语句告诉 PHP 是否显示错误消息或显示哪些错误消息。\n    * `php.ini`\
  \ 中的设置设置所有脚本。\n    * 脚本中的语句仅设置该脚本。\n\n## 关闭错误消息\n\n错误消息默认显示在你的网页上。在网页上显示错误消息存在安全风险。在你开发网站时，可以开启错误消息以便修复错误，但当你的网页完成并准备公众查看时，你应该关闭错误消息。\n\
  \n你可以在 `php.ini` 文件中关闭网站所有脚本的错误消息。找到以下设置：\n```\ndisplay_errors = On\n```\n将 `On`\
  \ 改为 `Off`。你可以通过以下语句关闭单个脚本中的错误：\n```php\nini_set(\"display_errors\",\"off\");\n\
  ```\n更改设置不会任何方式改变错误；它只改变是否显示错误消息。致命错误仍然停止脚本；只是不在网页上显示消息。处理错误消息的一种方法是在 `php.ini`\
  \ 中关闭它们，并在开发期间在每个脚本中开启它们。然后，当网站准备好公开查看时，你可以移除开启错误消息的 `ini_set` 语句。\n\n## 选择的消息\n\
  \n你可以通过 `php.ini` 中的以下设置指定你想显示的错误消息类型：\n```\nerror_reporting =\n```\n你使用几个代码之一告诉\
  \ PHP 显示哪些消息。可能的设置有：\n```php\nerror_reporting = E_ALL | E_STRICT\nerror_reporting\
  \ = 0\nerror_reporting = E_ALL & ~ E_NOTICE\n```\n第一个设置显示 `E_ALL`，即除严格错误以外的所有错误、警告和通知；以及\
  \ `E_STRICT`，它显示严格消息。第二个设置不显示任何错误消息。第三个设置显示除严格和通知以外的所有错误消息，因为 `& ~` 意味着“不是”。\n\n\
  你可以使用的其他代码有 `E_WARNING`（意味着所有警告）和 `E_ERROR`（意味着所有致命运行时错误）。你也可以为单个脚本设置显示的消息类型。你可以向脚本添加语句，仅为该脚本设置错误报告级别。\n\
  ```php\nerror_reporting(error);\n```\n例如，要查看除严格以外的所有错误，请使用以下：\n```php\nerror_reporting(E_ALL);\n\
  ```\n\n## 抑制错误消息\n\n你可以在 PHP 语句中停止错误消息的显示。通常情况下这样做并不是好主意。然而，偶尔为了防止通知在网页上显示，抑制单个通知的最简单方法是在预期错误消息的地方放置符号\
  \ `@`。例如，以下语句中的 `@` 会抑制错误消息：\n```php\necho @$news1;\n```\n如果变量 `$news1` 未设置，该语句会产生以下内容：\n\
  ```\nNotice: Undefined variable: news1 in C:\\...\\info.php on line 10\n```\n然而，变量名前的\
  \ `@` 保持通知不显示。此功能应该很少使用，但在某些情况下很有用。\n\n# 日志错误消息\n\n你可以将错误消息存储在日志文件中。无论是否在网页上显示，记录错误的持久化记录都需要两个设置：\n\
  * `log_errors`：将其设置为 On 或 Off 将错误发送到日志文件。\n* `error_log`：指定记录错误的文件。\n\n## 记录错误\n\
  \n你可以通过 `php.ini` 中的设置告诉 PHP 记录错误。找到以下设置：\n```\nlog_errors = Off\n```\n将设置改为 `On`。保存修改后的\
  \ `php.ini` 文件并重启 Web 服务器，PHP 将错误记录到文本文件中。你可以通过下一节描述的 `error_log` 设置告诉 PHP 向哪里发送错误。日志位于\
  \ Apache 安装目录下的 `logs` 子目录。错误日志具有 `.err` 扩展。你可以通过在脚本开头包含以下语句为单个脚本记录错误：\n```php\n\
  ini_set(\"log_errors\",\"On\");\n```\n该语句仅为此脚本设置错误记录。\n\n## 指定日志文件\n\n你通过 `php.ini`\
  \ 中的设置指定 PHP 记录错误的文件：\n```\nerror_log = filename\n```\n删除行首的分号。将 `filename` 替换为你想要\
  \ PHP 记录错误的路径和文件名，例如：\n```\nerror_log = \"c:\\php\\logs\\errs.log\"\n```\n你指定的文件不需要存在。如果不存在，PHP\
  \ 将创建它。在保存 `php.ini` 文件并重启 Web 服务器后，错误消息将记录在指定的文件中。每个错误消息单独占一行，开头有日期和时间。你可以通过在脚本开头包含以下语句为单个脚本指定日志文件：\n\
  ```php\nini_set(\"error_log\",\"c:\\php\\logs\\errs.log\");\n```\n该语句仅为此脚本设置日志文件。\n\
  \n# 为你的 PHP 脚本添加注释\n\n注释是嵌入脚本本身的笔记。在脚本中添加描述用途及其作用的注释至关重要。这对彩票因素很重要——如果你中了奖并去里维埃海岸过奢华生活，别人将完成该应用程序。你的继任者需要知道你的脚本打算做什么以及如何实现。实际上对你也有好处。当你明年需要修改脚本时，细节可能埋在你对最近项目的记忆中。\n\
  \n使用注释。PHP 会忽略注释；注释是给人类看的。只要你告诉 PHP 这些是注释，你可以在脚本的任何地方嵌入注释。注释的格式为：\n`/* 注释文本 */`\n\
  你的注释长度取决于需要。当 PHP 看到指示注释开始的代码 (`/*`) 时，它会忽略直到看到指示注释结束的代码 (`*/`)。每个脚本开头注释的一种可能格式如下：\n\
  ```php\n/*\nname: catalog.php\ndescription: 显示产品描述的脚本。描述存储在数据库中。根据用户在表单输入的类别从数据库选择。\n\
  written by: Lola Designer\ncreated: 2/1/13\nmodified: 3/15/13\n*/\n```\n在整个脚本中使用注释来描述脚本的功能。当脚本语句复杂时，注释特别为重要。经常使用如下注释：\n\
  ```php\n/* 从数据库获取信息 */\n/* 检查客户是否满 18 岁 */\n/* 在订单总额中添加运费 */\n```\nPHP 还有短注释格式。你可以使用井号\
  \ (#) 或两个正斜杠 (//) 以如下方式指定单行是注释：\n```php\n# 这是注释行 1\n// 这是注释行 2\n```\n从 # 或 // 到行尾的所有文本都是注释。你也可以在行中间使用\
  \ # 或 // 表示注释的开始。PHP 将忽略从 # 或 // 到行尾的所有内容。这对于注释特定语句很有用，如下例所示：\n```php\n$average\
  \ = $orderTotal/$nItems; // 计算平均价格\n```\n有时你想强调某个注释。以下格式让注释非常显眼：\n```\n########################################\n\
  双检查此章节\n######################################\n```\n\n\n\n\n## 比较运算符\n\n| 表 2-1\
  \ | 比较运算符 |\n| 运算符 | 它的含义 |\n| :--- | :--- |\n| `==` | 两个值的值相等吗？ |\n| `===` | 两个值的值和数据类型都相等吗？\
  \ |\n| `>` | 第一个值大于第二个值吗？ |\n| `>=` | 第一个值大于或等于第二个值吗？ |\n| `<` | 第一个值小于第二个值吗？ |\n\
  | `<=` | 第一个值小于或等于第二个值吗？ |\n| `!=`, `<>` | 两个值的值不相等吗？ |\n| `!==` | 两个值的值或数据类型不相等吗？\
  \ |\n\n你可以比较数字和字符串。字符串按照字母顺序比较，所有大写字母都在任何小写字母之前。例如，`SS` 在 `Sa` 之前。标点符号字符也有顺序，可以发现某个字符比另一个字符大。然而，比较逗号和句号并没有很大的实际意义![](img/image_rsrc15Y4.jpg)\n\
  \n字符串是基于其 ASCII 码比较的。在 ASCII 字符集中，每个字符都被分配了一个对应 0 到 127 之间数字的 ASCII 码。比较字符串时，根据这些代码进行比较。例如，代表逗号的数字是\
  \ `44`。句号对应 `46`。因此，如果比较句号和逗号，句号会被认为更大。\n\n以下是 PHP 可以测试以判断它们是否为真实的有效比较：![](img/image_rsrc15Y5.jpg)\n\
  * `$a == $b`\n* `$age != 21`\n* `$ageNick < $ageBobby`![](img/image_rsrc15Y6.jpg)\n\
  * `$house_price >= 1000000`![](img/image_rsrc15Y7.jpg)\n\n询问两个值是否相等的比较运算符由两个等号 (`==`)组成。常见错误之一是单个等号进行比较。单个等号会将值放入变量。因此，诸如\
  \ `if ($weather = “raining”)` 这样的语句会将 `$weather` 设置为 `raining`，而不是检查它是否已经等于 `raining`，并且结果始终为真。\n\
  \n如果你写一个否定形式（使用 `!`），则否定条件为真。查看以下比较：\n```\n$age != 21\n```\n测试的条件是 `$age` 不等于 `21`。因此，如果\
  \ `$age` 等于 `20`，则比较为真。\n\n### 检查变量内容\n\n有时你只需要知道变量是否存在或变量中包含什么类型的数据。这里是一些测试变量的常用方法：\n\
  \n* `isset($varname)` # 如果变量已设置，即使其中没有存储任何内容也为真。\n* `empty($varname)` # 如果值为 0、空字符串或未设置，则为真。\n\
  \n你也可以测试变量中包含什么类型的数据。例如，要查看值是否为整数，可以使用以下代码：\n```php\nis_int($number)\n```\n如果 `$number`\
  \ 中的值是整数，则比较为真。PHP 提供的其他测试如下：\n* `is_array($var2)`: 检查 `$var2` 是否为数组。\n* `is_float($number)`:\
  \ 检查 `$number` 是否为浮点数。\n* `is_null($var1)`: 检查 `$var1` 是否等于 null（注：原文为等于 0，但在逻辑上通常指检查空）。\n\
  * `is_numeric($string)`: 检查 `$string` 是否为数字字符串。\n* `is_string($string)`: 检查 `$string`\
  \ 是否为字符串。\n\n你也可以通过在表达式前面使用感叹号 (`!`) 来测试否定条件。这实际上是一个逻辑“非”条件，即“如果此条件不为真，则执行某操作”。例如，如果变量完全不存在，则以下语句返回真：\n\
  ```\n!isset($varname)\n```\n你可以用通语言将其理解为“如果 `$varname` 未设置”。\n\n### 使用正则表达式进行模式匹配\n\
  \n有时你需要比较字符串以查看它们是否符合某些特征，而不是查看它们是否匹配精确值。例如，你可能想识别以某些字符开头和结尾的字符串。对于这种类型，请使用正则表达式。（注：原文包含重复的短语/片段，已为了清晰起见进行了简化）。\n\
  \n\n\n\n考虑到一些示例模式，字面量和特殊字符组合成了模式，有时这些模式是长且复杂的。将字符串与模式进行比较，如果匹配，则比较结果为真。以下是一些示例模式，并包含了对模式的拆解以及一些匹配和不匹配的字符串示例。\n\
  \n### 示例 1：`^[A-Za-z].*`\n该模式定义了以字母开头的字符串并包含以下两个部分：\n* `^[A-Za-z]` : 模式的第一部分规定字符串开头必须是一个字母（大写或小写）。\n\
  * `.*` : 模式的第二部分告诉 PHP 字符串长度可以是一个或多个字符，包括数字、空格或任何内容。\n\n表达式 `^[A-Za-z].*` 匹配以下字符串：`play\
  \ it again`、`Sam`、`4 times` 和 `I`。\n表达式 `^[A-Za-z].*` 不匹配以下字符串：`123` 和 `?`。\n\n\
  ### 示例 2：`Dear (Kim|Rikki)`\n该模式定义了两个交替的字符串并包含以下两个部分：\n* `Dear` : 模式的第一部分只是字面量字符后跟一个空格。![](img/image_rsrc15YB.jpg)\n\
  * `(Kim|Rikki)` : 第二部分定义 `Kim` 或 `Rikki` 为匹配字符串。![](img/image_rsrc15YC.jpg)\n\n\
  表达式 `Dear (Kim|Rikki)` 匹配以下字符串：`Dear Kim` 和 `My Dear Rikki`。\n表达式 `Dear (Kim|Rikki)`\
  \ 不匹配以下字符串：`Dear Bobby` 和 `Kim`。\n\n### 示例 3：`^[0-9]{5}(\\-[0-9]{4})?`\n该模式定义了任何邮政编码（ZIP\
  \ code），包含多个部分：\n* `^[0-9]{5}` : 模式的第一部分描述任何五位数字的字符串。\n* `\\-` : 反斜杠表示连字符是字面量。\n\
  * `[0-9]{4}` : 模式的这部分告诉 PHP 后续字符应该是由四个字符组成的数字字符串。\n* `( )?` : 这些字符将模式的最后两个部分分组并使其成为可选。\n\
  * `$` : 美元符号规定该字符串应该结束（模式后不允许有任何字符）。\n\n表达式 `^[0-9]{5}(\\-[0-9]{4})?` 匹配以下字符串：`90001`\
  \ 和 `90002-4323`。\n表达式 `^[0-9]{5}(\\-[0-9]{4})?` 不匹配以下字符串：`9001` 和 `12-4321`。\n\n\
  ### 示例 4：`^.+@.+\\.com$`\n该模式定义了任何嵌入 `@` 并以 `.com` 结尾的字符串。换句话之，它定义了电子邮件地址的一种（但不是唯一的）格式。该表达式包含几个部分：\n\
  * `^.+` : 模式的第一部分描述 `@` 之前的任何一个或多个字符的字符串。\n* `@` : 这是字面量 `@`（at 符号）。`@` 不是特殊字符，不需要在前面加\
  \ `\\.`。\n* `.+` : 这是任何一个或多个字符的字符串。\n* `\\.` : 斜杠表示 PHP 应该寻找一个字面量点。\n* `com$` :\
  \ 这定义了字符串末尾的字面量字符串 `com`，`$` 标记字符串的结束。\n\n表达式 `^.+@.+\\.com$` 匹配以下字符串：`you@yourcompany.com`\
  \ 和 `[johndoe@somedomain.com]`。\n表达式 `^.+@.+\\.com$` 不匹配以下字符串：`you@yourcompany.net`、`you@.com`\
  \ 和 `@you.com`。\n\n### 使用 PHP 函数进行模式匹配\n你可以使用 `preg_match` 函数比较模式是否匹配字符串。通用格式如下：\n\
  \n```php\npreg_match(\"pattern\",value);\n```\n\n模式必须封装在一对分隔符中——包围模式的字符。通常使用 `/`\
  \ 作为分隔符。如果模式本身包含正斜杠，必须使用另一个字符作为分隔符，例如：\n\n```php\npreg_match(\"#^[A-Za-z' -]+#\"\
  ,name);\n```\n\n在这个示例中，`#` 被用分隔符。模式 `[A-Za-z' -]+` 匹配字母、单引号、空格或连字符的任何组合。`$` 表示字符串的结束。\n\
  \n\n\n你可以根据需要将多个比较组合在一起。脚本首先测试使用 `and` 和 `or` 连接的比较，接着测试使用 `xor` 连接的比较，最后测试使用 `or`\
  \ 连接的比较。例如，以下条件包含了三个比较：`$resCity == “Reno” or $resState == “NV” and $name == “Sally”`。如果客户的名字是\
  \ Sally 且她居住在内华达州（NV），则该语句为真。如果她住在里诺市，无论她的名字是什么，该语句也为真。如果她住在内华达州但名字不是 Sally，则该语句为假。之所以得到这些结果是因为脚本按照以下顺序检查条件：\n\
  \n1. 比较 `and`。脚本检查 `$resState` 是否等于 `NV`，并检查 `$name` 是否等于 `Sally`。如果两者都匹配，则条件为真，脚本不再需要检查\
  \ `or`。如果变量其中一个或两个都不等于指定值，则继续测试。\n2. 比较 `or`。脚本检查 `$resCity` 是否等于 `Reno`。如果是，则条件为真；如果不是，则条件为假。\n\
  \n你可以使用括号来改变比较的顺序。括号内的连接词会被优先求。例如，你可以使用括号重写前述语句：`($resCity == “Reno or $resState\
  \ == “NV”) and $name == “Sally”`。括号改变了检查条件的顺序。现在 `or` 先被检查，因为它在括号内。如果客户的名字是 Sally\
  \ 且她住在里诺或内华达州任一处，则该条件语句为真。得到这些结果是因为脚本按如下方式检查条件：\n\n1. 比较 `or`。脚本检查 `$resCity` 是否等于\
  \ `Reno` 或 `$resState` 是否等于 `NV`。如果不是，则整个条件为假，测试停止。如果是，则条件的这部分为真。然而，`and` 另一边的比较也必须为真，因此测试继续。\n\
  2. 比较 `and`。脚本检查 `$name` 是否等于 `Sally`。如果是，则条件为真；如果不是，则条件为假。\n\n请尽可能多使用括号，即使你认为自己知道比较的顺序。不必要的括号并无害，但产生意之外结果的比较会带来问题。如果你熟悉\
  \ C 等其他语言，可能使用了 `||`（代表或）和 `&&`（代表与）来代替单词。`||` 和 `&&` 在 PHP 中同样有效。语句 `$a < $b &&\
  \ $c > $b` 与语句 `$a < $b and $c > $b` 同样有效。`||` 在 `or` 之前被检查，`&&` 在 `and` 之前检查。\n\
  \n# 使用条件语句\n\n条件语句仅在特定条件为真时才执行一个语句块。这里有两种实用的条件语句类型：\n\n*   `if` 语句：设置一个条件并对其进行测试。如果条件为真，则执行语句块。\n\
  *   `switch` 语句：设置一组备选条件。它测试真条件并执行相应的语句块。\n\n我们将在下文中介绍如何使用这两种条件语句。\n\n## 使用 if 语句\n\
  \n`if` 语句测试条件，当条件为真时执行语句块。接下来的章节将讨论如何使用正确的格式构建 `if` 语句、为假条件创建 `if` 语句，以及将一个 `if`\
  \ 语句嵌套在另一个内部。\n\n### 构建 if 语句\n\n`if` 条件语句的通用格式如下：\n```if ( condition ){block of\
  \ statements}\nelseif ( condition ){block of statements}\nelse{block of statements}\n\
  ```\n\n`if` 语句由三部分组成：\n\n*   `if`：此部分是必选的。只允许一个 `if`。它测试一个条件：如果条件为真：执行语句块。执行语句后，脚本将移动到条件语句后的后续指令；如果语句包含任何\
  \ `elseif` 或 `else` 部分，脚本将跳过它们。如果条件不成立：不执行语句块。脚本跳转到下一条指令，该指令可以是 `elseif`、`else`\
  \ 或 `if` 语句后的后续指令。\n*   `elseif`：此部分是可选的。如果你需要，可以使用多个 `elseif`。`elseif` 也测试一个条件：如果条件为真：执行语句块。执行语句块后，脚本将到条件语句后的后续指令；如果语句包含任何额外的\
  \ `elseif` 部分或 `else` 部分，脚本将跳过它们。如果条件不成立：不执行语句块。脚本跳转到下一条指令，该指令可以是 `elseif`、`else`\
  \ 或条件语句后的后续指令。\n*   `else`：此部分也是可选的。只允许一个 `else`。此部分不测试条件，而是执行语句块。只有当 `if` 部分和所有\
  \ `elseif` 部分都不为真时，脚本才会进入 `else` 部分。\n\n这里有一个如何构建 `if` 语句的示例。假设你是一个老师。以下 `if` 语句在接收到测试分数时，会给学生发送一个等级和一个幽默的消息。它使用了\
  \ `if` 语句的所有三个部分，如下：\n\n```php\nif ($score > 92 ) {\n$grade = “A”;\n$message = “Excellent!”\n\
  }elseif ($score > 83 ) {\n$grade = “B”;\n$message = “Good!”\n}elseif ($score > 74\
  \ ) {\n$grade = “C”;\n$message = “Okay”\n}elseif ($score > 62 ) {\n$grade = “D”;\n\
  $message = “Uh oh!”\n}else {\n$grade = “F”;\n$message = “Doom is upon!”\n}\necho\
  \ $message.\\n”;\necho “Your grade is $grade\\n”;\n```\n\n`if` 条件语句按如下执行：\n\n1.\
  \ 比较 92。检查 `$score` 是否大于 92。如果是，`$grade` 设置为 A，`$message` 设置为 Excellent!。如果不是，跳转到\
  \ `elseif` 部分。\n2. 比较 83。检查 `$score` 是否小于 92 且大于 83。如果是，`$grade` 设置为 B，`$message`\
  \ 设置为 Good!。如果不是，跳转到下一个 `elseif`。\n3. 比较 74。检查 `$score` 是否小于 83 且大于 74。如果是，`$grade`\
  \ 设置为 C，`$message` 设置为 Okay。如果不是，跳转到下一个 `elseif`。\n4. 比较 62。检查 `$score` 是否小于 74\
  \ 且大于 62。如果是，`$grade` 设置为 D，`$message` 设置为 Uh oh!。如果不是，跳转到 `else` 部分。\n5. `else`\
  \ 部分：`$grade` 设置为 F，`$message` 设置为 Doom is upon!。\n\n### 否定 if 语句\n\n你可以通过在条件开头放置感叹号（`!`）来编写\
  \ `if` 语句，使得条件为假时执行语句块。\n\n### 嵌套 if 语句\n\n你可以在一个 `if` 条件内部包含另一个 `if` 条件。将一个语句放在另一个语句内部被称为嵌套。\n\
  \n## 使用 switch 语句\n\n对于大多数情况，`if` 条件语句效果最好。但有时你有一组条件，并希望为每个条件执行不同的语句。`switch` 语句就是为这种情况设计的。\n\
  \n# 使用循环重复操作\n\n循环经常用于脚本中设置一个重复的语句块。有三种类型的循环：\n\n*   `for` 循环：设置一个计数器；在计数器达到数字之前重复语句块。\n\
  *   `while` 循环：设置一个条件；检查该条件，如果为真，则重复语句块直到条件为假。\n*   `do..while` 循环：设置一个条件；执行语句块；检查该条件，如果为真，则重复语句块直到条件为假。\n\
  \n## 使用 for 循环\n\n最基础的 `for` 循环基于计数器。你设置计数器的起始值、结束值，以及每次执行语句块时计数器的递增量。\n\n### 构建\
  \ for 循环\n\n基础 `for` 循环的通用格式如下：\n```\nfor (startingvalue;endingcondition;increment){block\
  \ of statements;}\n```\n\n在 `for` 语句中，你需要填充以下值：\n\n*   `startingvalue`：起始值是一个设置变量作为计数器并赋其初始值的语句。例如，`$i=1;`\
  \ 将 `$i` 设置为计数器变量并赋值为 1。\n*   `endingcondition`：结束条件是一个设置结束值的语句。只要该语句为真，语句块就会不断重复。\n\
  *   `increment`：此语句增加你的计数器。例如，`$i++;` 在每个语句块结束时给计数器加 1。\n\n### 嵌套循环\n\n你可以在 `for`\
  \ 循环内部嵌套另一个 `for` 循环。\n\n## 使用 while 循环\n\n`while` 循环只要特定条件为真就会持续重复。其工作原理如下：\n\n\
  1. 设置一个条件。\n2. 在每个循环顶部测试该条件。\n3. 如果条件为真，循环重复；如果条件为假，循环停止。\n\n### 使用 do..while 循环\n\
  \n`do..while` 循环只要特定条件为真就会持续重复。与 `while` 循环不同，这些条件是在循环的底部测试的。如果条件为真，循环重复；如果条件为假，循环停止。\n\
  \n\n\n\n## 获取信息的函数\n\n| 函数 | 作用 | 输出 |\n| :--- | :--- | :--- |\n| `is_file(\"stuff.txt\"\
  )` | 测试该文件是否为普通文件，而不是目录或其他类型类型 | true 或 false |\n| `is_dir(\"stuff.txt\")` | 测试该文件是否为目录\
  \ | true 或 false |\n| `is_executable(\"do.txt\")` | 测试该文件是否可执行 | true 或 false |\n\
  | `is_writable(\"stuff.txt\")` | 测试你是否可以写入该文件 | true 或 false |\n| `is_readable(\"\
  stuff.txt\")` | 测试你是否可以读取该文件 | true 或 false |\n| `fileatime(\"stuff.txt\")` | 返回文件最后访问的时间\
  \ | Unix 时间戳（如 1057196122）或 false |\n| `filectime(\"stuff.txt\")` | 返回文件的创建时间 |\
  \ Unix 时间戳或 false |\n| `filemtime(\"stuff.txt\")` | 返回文件最后修改的时间 | Unix 时间戳或 false\
  \ |\n| `filegroup(\"stuff.txt\")` | 返回文件的组 ID | 组 ID 整数或 false |\n| `fileowner(\"\
  stuff.txt\")` | 返回文件所有者的用户 ID | 用户 ID 整数或 false |\n| `filesize(\"stuff.txt\")` |\
  \ 返回以字节为的文件大小 | 整数或 false |\n| `filetype(\"stuff.txt\")` | 返回文件类型 | 文件类型（如 file,\
  \ dir, link, char），若发生错误或无法识别类型则返回 false |\n| `basename(\"/t1/do.txt\")` | 从路径中返回文件名\
  \ | do.txt |\n| `dirname(\"/t1/do.txt\")` | 从路径中返回目录名 | /t1 |\n\n\n\n\n一个返回关于路径/文件名有用信息的函数是\
  \ `pathinfo()`。你可以使用以下语句：\n\n```php\n$pinfo = pathinfo(\"/topdir/nextdir/stuff.txt\"\
  );\n```\n\n执行语句后，`$pinfo` 是包含以下三个元素的数组：\n- `$pinfo[dirname] = /topdir/nextdir`\n\
  - `$pinfo[basename] = stuff.txt`\n- `$pinfo[extension] = txt`\n\n当你使用表 3-1 中的任意一个\
  \ `is_something` 函数测试文件时，任何输入错误（例如文件名的拼写错误）都会导致一个错误的结果。例如，如果“tyme”是一个文件而不是目录，那么\
  \ `is_dir(\"tyme\")` 将返回 `false`。但是，如果“tyme”并不存在，它也会返回 `false`，因为你可能是想输入“type”。表\
  \ 3-1 中给出的某些函数会返回 Unix 时间戳。你可以像本微型书籍第 1 章描述的那样，使用 `date` 函数将这些时间戳转换为日期。\n\n## 复制、重命名和删除文件\n\
  \n你可以将现有文件复制到新文件中。复制后，你就拥有了两个不同名称的文件副本。复制文件通常对于备份重要文件很有用。要复制文件，使用如下的 `copy` 语句：\n\
  \n```php\ncopy(\"fileold.txt\",\"filenew.txt\");\n```\n\n该语句将现有文件 `fileold.txt`\
  \ 复制到 `filenew.txt`。如果已存在名为 `filenew.txt` 的文件，它将被覆盖。如果你不想覆盖现有文件，可以使用以下语句来防止这种情况：\n\
  \n```php\nIf(!file_exists(\"filenew.txt\")){\n    // code\n}else{\n    // code\n\
  }\ncopy(\"fileold.txt\",\"filenew.txt\");\necho \"File already exists!\\n\";\n```\n\
  \n你可以通过使用路径名作为目标来将文件复制到不同的目录，如下：\n\n```php\ncopy(\"fileold.txt\",\"newdir/filenew.txt\"\
  );\n```\n\n你可以使用 `rename` 语句来重命名文件，如下：\n\n```php\nrename(\"oldname.txt\",\"newname.txt\"\
  );\n```\n\n如果你尝试将文件重命名为已存在的文件名，将显示如下警告，且文件不会被重命名：\n`Warning: rename(fileold.txt,filenew.txt):\
  \ File exists inc:test.php on line 17`\n\n要删除不需要的文件，请使用如下的 `unlink` 语句：\n\n```php\n\
  unlink(\"badfile.txt\");\n```\n\n执行该语句后，文件将被删除。如果文件本身不存在，`unlink` 不会报错。它的行为就像删除了该文件一样。PHP\
  \ 不会告诉你文件是否存在。因此，请注意拼写错误。\n\n##组织文件\n\n文件被组织在目录中，也称为文件夹。本节描述了如何创建和删除目录，以及如何获取目录下的文件列表。\n\
  \n### 创建目录\n\n要创建目录，使用如下的 `mkdir` 函数：\n\n```php\nmkdir(\"testdir\");\n```\n\n该语句在脚本所在的相同目录下创建一个名为\
  \ `testdir` 的新目录。也就是说，如果脚本是 `/test/test.php`，则新目录就是 `/test/testdir`。如果已经存在同名的目录，将显示如下警告，且不会创建新目录：\n\
  `Warning: mkdir(): File exists in d:/test/test.php on line 5`\n\n你可以使用以下语句先检查目录是否已存在：\n\
  \n```php\nIf(!is_dir(\"mynewdir\")){\n    mkdir(\"mynewdir\");\n}else{\n    echo\
  \ \"Directory already exists!\";\n}\n```\n\n创建目录后，你可以通过将文件复制进或复制出目录来组织其内容。复制文件在本章前面的“复制、重命名和删除文件”部分中有所描述。要在另一个目录中创建目录，请使用完整的路径名：\n\
  \n```php\nmkdir(\"/topdir/nextdir/ewdir\");\n```\n\n你可以使用相对路径创建一个新目录：\n\n```php\n\
  mkdir(\"../ewdir\");\n```\n\n使用该语句，如果你的脚本是 `/topdir/test/makedir.php`，则新目录是 `/topdir/ewdir`。要切换到不同的目录，使用以下语句：\n\
  \n```php\nchdir(\"../anotherdir\");\n```\n\n### 构建目录中所有文件的列表\n\n获取目录下的文件列表通常有用。例如，你可能想为用户提供一个下载列表，或者想显示来自特定目录的图像。PHP\
  \ 提供了打开和读取目录的函数。要打开目录，使用如下的 `opendir` 语句：\n\n```php\n$dh = opendir(\"/topdir/testdir\"\
  );\n```\n\n如果你尝试打开一个不存在的目录，将显示如下警告：\n`Warning: opendir(testdir): failed to open\
  \ dir: Invalid argument in test1.php on line 5`\n\n在上一条语句中，`$dh` 是一个目录句柄，指向已打开目录的指针，你可以之后使用它从目录中读取内容。要从目录读取文件名，使用如下的\
  \ `readdir` 函数：\n\n```php\n$filename = readdir($dh);\n```\n\n执行该语句后，`$filename`\
  \ 包含文件名。只有文件名存储在 `$filename` 中，而不是指向文件的完整路径。要读取目录中的所有文件名，你可以使用 `while` 循环，如下：\n\n\
  ```php\nwhile($filename = readdir($dh)){\n    echo $filename.\"n\";\n}\n```\n\n\
  `readdir` 函数不对读取文件名的顺序提供任何控制，因此你并不总是按照预期的顺序获取文件名。假设你想创建一个图像画廊，在网页中显示指定目录中的所有图像。你可以使用\
  \ `opendir` 和 `readdir` 函数来实现这一点。列表 3-1 显示了一个创建图像画廊的脚本。\n\n**列表 3-1: 创建图像画廊的脚本**\n\
  ```php\n<?php\n/* 脚本名称: displayGallery\n* 说明: 显示存储在指定目录中的\n* 所有的图像文件.*/\necho \"\
  <html><head><title>Image Gallery</title></head><body>\";\n$dh = opendir(\"/topdir/testdir\"\
  );\nwhile($filename = readdir($dh)){\n    echo $filename.\"n\";\n}\nclosedir($dh);\n\
  echo \"</body></html>\";\n?>\n```\n*(注：原文示例代码块不完整，此处根据逻辑补全了闭合标签，但保持代码逻辑不变)*\n\n\n\
