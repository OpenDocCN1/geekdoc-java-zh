  \ true;\n    } else {\n        return false;\n    }\n} //函数 is_valid_state 结束\n\n\
  function is_valid_zip($zip) {\n    if (preg_match('/[\\d]+$/',$zip)) {\n       \
  \ return true;\n    } else if (strlen($zip) == 5 || strlen($zip) == 9) {\n     \
  \   return true;\n    } else {\n        return false;\n    }\n} //函数 is_valid_zip\
  \ 结束\n?>\n```\n\n## 创建 Web 表单\n\n应用程序涉及的页面将使用 `jQuery` 以及外部 `JavaScript` 和层级样式表\
