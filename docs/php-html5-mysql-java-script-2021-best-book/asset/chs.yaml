  \ 创建 User 对象\n\n客户网站认证部分的基础是用户——具体来说，他们是谁以及他们是否登录。为此，一个 `User` 对象将提供一个有用的抽象，允许你稍后根据需要添加功能。\n\
  \n该 User 类旨在存储客户输入的数据——而不是你输入。当应用程序首次向客户提供时，它是空的，直到客户添加数据为止。当你测试你的应用程序脚本时，脚本将向数据库添加一行。在测试脚本时，你需要添加一个带有用户名和密码的行供你自己使用。\n\
  \n### 列表 10：User 类代码\n```php\n<?php\nclass User {\n    public $id;\n    public $email;\n\
  \    public $firstName;\n    public $lastName;\n    public $address;\n    public\
  \ $city;\n    public $state;\n    public $zip;\n    public $phone;\n    public $phoneType;\n\
  \    public $isLoggedIn = false;\n\n    function construct() {\n        if (!session_id())\
  \ {\n            session_start();\n        }\n    }\n\n    public function authenticate($user,\
  \ $pass) {\n        $mysqli = new mysqli(DBHOST, DBUSER, DBPASS, DB);\n        if\
  \ ($mysqli->connect_errno) {\n            error_log(\"无法连接到 MySQL: \" . $mysqli->connect_error);\n\
  \            return false;\n        }\n        $safeUser = $mysqli->real_escape_string($user);\n\
  \        $incomingPassword = $mysqli->real_escape_string($pass);\n        $query\
  \ = \"SELECT * from Customer WHERE email = '{$safeUser}'\";\n        if (!$result\
  \ = $mysqli->query($query)) {\n            $_SESSION['error'][] = \"未知错误\";\n  \
  \          return false;\n        }\n        if ($result->num_rows == 0) {\n   \
  \         $_SESSION['error'][] = \"未找到用户\";\n            return false;\n       \
  \ }\n        $row = $result->fetch_assoc();\n        $dbPassword = $row['password'];\n\
  \        if (crypt($incomingPassword, $dbPassword) != $dbPassword) {\n         \
  \   error_log(\"用户 $user 的密码不匹配\");\n            return false;\n        }\n    \
  \    $this->id = $row['id'];\n        $this->email = $row['email'];\n        $this->firstName\
  \ = $row['first_name'];\n        $this->lastName = $row['last_name'];\n        $this->address\
