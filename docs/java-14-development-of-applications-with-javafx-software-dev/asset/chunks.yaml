    ## 3.3 Shape properties


    The above has primarily concerned the shape of figures like straight lines, rectangles,
    circles, and more, but there are also some other properties attached to shapes,
    including how they are filled and how the perimeter is drawn. This section will
    discuss the most important of these features.


    The perimeter – which is a line / curve – can be drawn in three ways:


    1.  `StrokeType.CENTERED`, which is default and means the perimeter is drawn so
    that the edge of the shape is exactly the center of the perimeter line.

    2.  `StrokeType.INSIDE`, where the perimeter is drawn as it falls within the shape.

    3.  `StrokeType.OUTSIDE`, where the perimeter is drawn outside the shape.


    The program `StrokeProgram` opens the following window, which illustrates the
    three ways to draw the perimeter:


    ![](image/Image1950.jpg)


    The code is the following, where I have only shown `start()`:


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_36.jpg)


    Another thing is the endpoints of the line here especially for shapes composed
    of lines. There are three options (as you also know from Java2D):


    1.  `StrokeJoin.MITTER` which is default

    2.  `StrokeJoin.BEVEL`

    3.  `StrokeJoin.ROUND`


    You can find the exact explanation of these endpoints in the book about Java2D.
    The application `JoinProgram` opens the following window, which shows the effect
    of each of the three:


    ![](image/Image1957.jpg)![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_37.jpg)![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_38.jpg)[](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_39.jpg)


    There are similar options for specifying endpoints of lines (please check the
    book 10):


    1.  `StrokeLineCap.BUTT`

    2.  `StrokeLineCap.SQUARE`

    3.  `StrokeLineCap.ROUND`


