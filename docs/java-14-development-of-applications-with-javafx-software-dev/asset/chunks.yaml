    这些方法都非常简单且以相同的方式构建，你应该主要关注如何像上述描述的那样将过滤器（filters）和处理器（handlers）分配给各个节点。你应该注意 `createButton()`，它没有附加任何过滤器或处理器。如果你运行程序并点击按钮，你会发现分发链（dispatch
    chain）中没有执行任何事件处理器，这是因为通过 `setOnAction()` 关联的按钮与类型为 `EventHandler<ActionEvent>`
    的事件处理器相关。这意味着通过鼠标点击，按钮将处理事件动作，而不是触发普通的鼠标事件，而是触发一个 `ActionEvent`。此外，注意按钮的 `ActionEvent`
    事件处理器会打开一个简单的消息框，其中还包含了 JavaFX 中实现该操作的语法。


    下一个示例称为 `KeyEventProgram`，它会打开以下窗口：


    ![](img/Image2253.jpg)


    如果你在输入框中输入 `Enter` 键，绿色正方形将会旋转，点击正方形则将停止旋转。代码如下：


    ![](img/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_100.jpg)![](img/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_101.jpg)


    该类定义了一个过渡变量，它是旋转正方形的动画。它是通过 `createRotate()` 方法创建的，该方法在动画方面没有包含任何新内容。实际 `Transition`
    对象在 `start()` 方法中创建。在这里你也应该注意如何设置窗口的背景颜色。正方形在 `createRect()` 方法中创建。在这里，使用 `setOnMouseClicked()`
    方法为正方形附加了鼠标点击事件处理器，你应该注意如何使用 lambda 表达式定义事件处理器。


    然后是 `createField()` 方法，它用于创建输入框。它是一个 `TextField`，最重要的是事件处理器的关联。它是一个过滤器，且处理器与类型为
    `KEY_TYPED` 的 `KeyEvent` 关联。处理器使用 `getCharacter()` 方法来测试输入的内容，如果第一个字符的编码为 13，则表示了
    `Enter` 键，如果是这样，动画将开始。对于任何事件，该事件都会被标记为已消费（consumed），这样它就不会在链中传递，其效果是按键的字符永远不会显示在输入框中。


    因此，该示例展示了如何捕获鼠标和键盘事件。在示例中，它通过两种不同的方式实现：在 `createField()` 中通过 `addEventFilter()`
    在低级别发生，而在 `createRect()` 中则是使用方便方法发生。许多 JavaFX 类将事件处理器定义为属性，你随后可以使用该方便方法的 set
    方法来注册事件处理器。目标是更容易关联事件处理器，接下来的程序 `HandlerProgram` 应该说明这一点：


    ![](img/Image2261.jpg)


    点击 Start（开始）按钮会启动动画，圆形沿着曲线移动，动画一直运行到你点击 Stop（停止）按钮为止。如果你点击圆形，它会改变颜色。


    ![](img/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_103.jpg)![](img/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_104.jpg)


    关于如何创建动画和曲线并没有新内容，发生在 `createTrans()` 和 `createRect()` 方法中。如果你考虑创建圆形的 `createCircle()`
    方法，它使用一个名为 `setOnMouseClicked()` 的方便方法关联了鼠标点击事件处理器。你应该注意事件处理器是参数，并且是一个 lambda
    表达式。


    `createButton()` 方法用于创建按钮。它有三个参数：按钮的文本、在窗口中位置的 x 坐标以及按钮的事件处理器。后者的类型为 `EventHandler<ActionEvent>`，并与
    `setOnActionEvent()` 方法关联。


    ## 7.3 组件


    然后是组件（或控件），JavaFX 有许多组件，但最重要的是以下：


    | Label | MenuButton | Slider | ColorPicker |

    | Button | MenuItem | ScrollPane | DatePicker |

    | TextField | Menu | ScrollBar | ProgressIndicator |

    | PassWordField | ContextMenu | TabPane | ProgressBar |

    | TextArea | Separator | SplitPane | FileChooser |

    | RadioButton | ChoieBox | TitlePane | HTMLEditor |

    | Hyperlink | ComboBox | Accordion | TableView |

    | CheckBox | ListView | Pagination | TreeView |

    | ToggleButton | WebView | Tooltip | TreeTableView |


    这些组件中的一些已经在之前的示例中使用过，本节的其余部分由练习和问题组成，你应该你应该尝试使用上述组件（但最后一列的最后三个推迟到下一本书）。大多数组件都是易于使用的并占据了很大一部分，正如你从
    Swing 中了解的那样。其他组件更为复杂，总体来说，以下练习要求你使用文档，必要时还在互联网上寻找示例和帮助。


