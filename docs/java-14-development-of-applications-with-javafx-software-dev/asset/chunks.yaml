    在效果章节的引言中，我列出了可以应用的不同效果，并且远没有说明它们（也打算这样做），但我想通过对光的简单介绍来结束这个章节。原理是光源照射在图形上，图形的颜色取决于光源的性质及其相对于图形的位置。


    通常，你可以使用 `Lighting` 对象将光效果关联到图形，如果你不指示光源，则使用默认光源，这对应于直接射入图形的光，产生微弱的 3D 效果。你也可以显式地指示光源，有选择：


    1. `Light.Distant`

    2. `Light.Point`

    3. `Light.Spot`


