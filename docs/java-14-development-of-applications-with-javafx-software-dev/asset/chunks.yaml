    If you click on the name of a variable, the window closes and the value of the
    variable is inserted in the editor field at the cursor’s position. If you check
    one or more checkboxes and click the button `Remove`, these variables will be
    deleted.


    Center in the window is a `ListView` that is created as follows:


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_166.jpg)


    Here you should note that a `ListView` can contain anything, and especially a
    layout pane with components. It is thus an extremely flexible component, and the
    list box on the main window is initially initialized in the same way.


    In principle, this dialog box contains the same information as the list box to
    the left of the buttons, but the dialog is included partly to delete variables
    and partly to give a better overview.


    ### Implements the other functions


    This iteration is simple as the remaining buttons must do the same as for `Sqr`
    and `Sqrt`, where only a text must be inserted into the editor field at the cursor’s
    position. The only challenge is that it is the right text.


    However, the impact of the progress bar must be implemented. I have changed the
    component to a `ProgressIndicator`, which is constantly running, but from the
    start is invisible. When a calculation is started (clicked `Enter`), the component
    is made visible and it becomes invisible again when the calculation is completed
    and the user interface is updated. The only challenge is get the the user interface
    (`ProgressIndicator`) updated, and the calculation must be performed in its own
    thread:


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_167.jpg)


    After this iteration, the machine is in principle completed, but with a fixed
    precision of 200.


    ### Implements Set Precision


    This function opens a simple dialog box where you can enter the desired precision:


    ![](image/Image3728.jpg)


    If you click `OK`, both the controller and the status bar in the main window must
    be updated. The function has been moved from the menu to a button above the `Enter`
    key. The menu has been changed so that under `Functions` there is a menu item
    for each of the program’s buttons. The reason is partly to have a better description
    of the individual functions and to define key combinations for all functions and
    commands.


    ### Implements the menu item Expressions


    This iteration is empty, as the function corresponds to a click on `RCL`, and
    the function is already implemented. Since `RCL` also has a menu item, the function
    already exists in the  menu.


    ### Implements the File menu


    Five functions must be implemented, all located under the File menu:


    1. `Save`, which saves all variables in an existing file

    2. `Save as`, which saves all variables in a new file

    3. `Open`, which opens a file with variables, that ealier are saved

    4. `New`, which deletes all existing variables

    5. `Exit`, which terminates the program


    Variables must be saved with simple object serialization. Therefore, the class
    `Memory` is partly defined `Serializable`, and in addition, there are added two
    static methods:


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_169.jpg)


    Then it’s simple to implement the 5 event handlers using a `FileChooser` component.


    ### Implements missing features


    There is not much that are missing, but the following should be added:


    1. There should be warnings if you try to overwrite existing variables by loading
    variables from a file or closing the program and the variables are not been saved.

    2. Similarly, there should be a warning if you delete the content of the result
    field, and accordingly if you delete variables in the dialog that shows the list
    of variables (the command `RCL`). The same applies to the dialog boxes for entering
    the name of a variable and the dialog for change the precision if you enter an
    illegal value.

    3. If you use many significant digits (heigh precision), a calculation can take
    a long time and therefore a timeout should be defined so that the program giving
    up after the timeout.


    The first point is simple to solve and is primarily about include a `boolean`
    variable that keeps track of changes in the program’s variables. The problem is
    thus limited to ensuring that this variable is set at the correct places and then
    test the variable in the event handlers for the `File` menu. Additionally, you
    can override the `stop()` method and test the variable there so that you do not
    close the program without a warning if there are non-saved variables.


    The second point is similarly simple and refers to displaying a confirmation box
    in the event handler that deletes the content of the result field, as well as
    a test in the three dialog boxes.


    The last problem, on the other hand, is not quite simple to solve. First I have
    in the controller class (`MainController`) included a property `timeout`, which
    indicates the number of seconds for the timeout value. It is as default 15\. Next,
    I have expanded the program with the following dialog box:


    ![](image/Image3739.jpg)


    where you can enter the timeout value. There is no button for the dialog, but
    it is opened from the menu or with a shortcut key.


    When you click the `Enter` button in the main window, the following events are
    performed:


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_171.jpg)![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_172)


    It looks a bit complex. The calculation is performed by a method in an `Expression`
    object that takes time, and if executed directly, it will block the main window,
    which will mean that the progress indicator does not run. The calculation must
    therefore be performed in its own thread, which is the thread `calculator`. In
    Java, you can not interrupt a running thread, which must happen in the case of
    a timeout. The problem can be solved with an `Executor` and a `Future` object
    (possibly see Java 8). The thread `calculator` therefore starts with disabling
    the button `Enter`, and then an `Executor` object is created that is used to start
    a task of the type `Calculator`:


    ```

    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_171.jpg)

    ```


    It is then its `call()` method that performs the calculation. After this task
    has been created (in the thread `calculator`) the thread is set to wait for the
    task to be performed or a timeout occurs. In the case of the last the result is
    defined as the text `Timeout`, after which is executed


    ```![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_172.jpg)

    ```


    This causes that threats performed by the task to terminate, and even if it is
    still running due to a timeout. Hereafter the following method is called which
    updates the result:


    ```![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_173.jpg)

    ```


    and the button will be enabled again. After the thread `calculator` is defined,
    it is started and the result is that the calculation is performed in a thread
    (of a task object) that is started by the thread `calculator` that starts when
    clicking the `Enter` button.


    ### Styling the program


    After the above iterations, all windows and nodes are shown on basis of the default
    styles in JavaFX, and often, by a program of the current kind, it will be quite
    good, but if you want to put your own touch on how the components appear or for
    some reason want to change the specific components look and feel, you can add
    a style sheet. It is preferable not to directly assign values to properties in
    the code, as a style sheet makes it much easier to maintain the code.


    There are several strategies, but you can proceed as follows. The program (the
    main window) has the following groups of components:


    * 1 `TextArea` for the display (the result)

    * 1 `TextField` to the editor field

    * 1 `ListView` to variables

    * 1 `Button` to the `Enter` button

