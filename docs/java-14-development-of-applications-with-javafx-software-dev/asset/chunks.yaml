- fmt: '

    This chapter has provided a brief introduction to FXML, and although there is
    more to explain, the above should be sufficient to use FXML in practice. The question
    is then what is gained from using FXML and there are two purposes:


    1. to separate the design/definition of the user interface from the Java code

    2. to make it easier to develop complex user interfaces


    The first follows immediately from the separation of the code for a window in
    an XML part and a controller with the Java code. In principle, it is good, but
    it requires learning FXML, and although NetBeans provides good support, there
    is still a lot to learn, and in my opinion, it’s at least as easy to write the
    user interface in Java as in FXML. The separation of the code can easily be achieved
    by moving the code to event handlers in their own classes in a controller layer.
    The conclusion is that I do not find the big gains in using FXML, and in fact,
    I feel that the forces are better used by learning JavaFX in detail than using
    the power to get good at FXML. It’s my opinion and it’s not necessarily true and
    I know that others look different. Therefore, there is only to say, to try and
    gain your own experiences.


    According to what I’ve mentioned above, FXML does not make it easier to write
    user interfaces, but it is when using a tool. There is a program called `Scene
    Builder` that you can use to design the user interface. Instead of writing the
    code itself, you pull components from a toolbox and place them in the window where
    you think they should be. The tool will then form the FXML code for the user interface,
    and it is in this context that FXML comes into its own. The product `Scene Builder`
    can be downloaded from


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_159.jpg)


    and it is quite simple to install. Of course, you should learn to use the product,
    but also it is relatively easy, and if you often need to write complex user interfaces,
    it is worth knowing the product as it can generate significant progress in development
    projects.


    # 10 A final example


    As the final example, I will use the same program as in the previous book, but
    with the difference that the program this time should be a desktop application.
    This means that I can reuse the class library `FunctionsLib`, which implements
    the mathematical functions, as well as the classes for parsing and evaluating
    an expression can also be reused. Therefore, I only have to implement the user
    interface. The aim of the program is, of course, to show an example of a JavaFX
    program, which is slightly larger than the examples that are otherwise shown in
    this book.


    The program must have the same features as in the previous book and should be
    basically used in the same way where the user enters a mathematical expression
    that the program can then evaluates. Unlike the previous program, the program
    should have buttons for the mathematical functions where a button should do nothing
    but insert the function name in the input field of the expression. In the previous
    program you can save a value in a variable and the value can be inserted later
    in an expression. In the new version of the program you must be able to save an
    arbitrary expression so that you can insert an expression into an expression,
    and it should also be possible to save the program’s variables in a file.


    ## 10.1 Development


    The development of the program has been implemented as a form of prototyping,
    and in the following I will briefly describe how the development has been completed.
    From the start, I have planned the following iterations:


    1. First prototype

    2. Enhanced prototype

    3. Implements the square root and square function

    4. Implements Store and Recall

    5. Implements the other functions

    6. Implements Set Precision

    7. Implements the menu item Expressions

    8. Implements the File menu

    9. Implements missing features

    10. Styling the program

    11. Refactoring


    and the goal is that after completing the last iteration, you will have a finished
    program. The iterations are small, but after each iteration you have a version
    of the program that can be tested and used with the functions that have been implemented.


    ### First prototype


    The goal is to write an early version of the program, which should alone be a
    sketch of the user interface. The program must therefore not have calculating
    functions.


    ![](image/Image3696.jpg)


    Apart from the buttons, the program looks like the application from the previous
    book. The window must be resizable, and the two text fields must follow the size
    of the window, but the bottom must have a fixed height. The buttons should follow
    the right edge and bottom of the window. The `File` menu must have functions for
    saving and loading the variables, while the `Functions` menu must have a function
    to change the precision as well as a function that shows an overview and the variables
    that have been created.


    ### Enhanced prototype


    The result of the next iteration is still a prototype for the user interface,
    but with some changes with regard to buttons and with appropriate spacing and
    padding of the components.


    ![](image/Image3704.jpg)


    To the right of the buttons is a list box that displays the program’s variables
    and the size must be that part of the window that is not used for buttons. Additionally,
    a progress bar has been added because some the calculations may take a long time.


    ### Implements the square root and square function


    I have added a reference to the jar file `FunctionsLib.jar` from the final project
    in the previous book. Then I have created a package `bigcalc.models` and copied
    the files `Tokens.java` and `Expression.java` from the project `FunctionsEJB`
    to this package. After that, the entire math should be in place and the required
    functions should be available.


    I have then created a package `bigcalc.ctrls` and here a class `MainController`:


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_163.jpg)


    In the class `BigCalc`, event handlers are assigned to the following buttons:


    * `Sqr`

    * `Sqrt`

    * `Clear Result`, which deletes the content of the upper field for the result

    * `Clear Editor`, which deletes the content of enter field

    * `Enter`


    It is all simple event handlers. Then you can perform arithmetic and evaluate
    expressions, and the calculator is in principle complete. In particular, you can
    paste text into the editor by clicking the buttons `Sqr` and `Sqrt`.


    ### Implements Store and Recall


    If you click the `STO` button, you should get the following dialog box:


    ![](image/Image3711.jpg)


    where to enter the name of the variable. If you click `OK`, the last result that
    is calculated is saved. If, on the other hand, you have checked the `Store Expression`
    check box, it is the expression that is entered in the editor field that is saved.
    After clicking `OK` and the desired value is assigned to the variable, the list
    box is updated (the list box to the left of the buttons).


    In order to keep track of the variables, the following model class has been added:


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_164.jpg)!(image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_165.jpg)


    If you click on a variable in the list box, the corresponding value is inserted
    in the editor field (at the cursor’s position). The same syntax is used as in
    the previous program, that is `@A1`, and the difference is that the value can
    be a value or an expression. This means that the controller must be updated so
    that values for variables are substituted before the expression is sent to the
    parser.


    If you click the `RCL` button, you get the following window where two variables
    were created:


    ![](image/Image3719.jpg)

