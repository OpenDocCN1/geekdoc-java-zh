    JavaFX has its own event types, and the base type is called `Event`. Examples
    of specific event types include:


    *   `MouseEvent`

    *   `KeyEvent`

    *   `DragEvent`

    *   `WindowEvent`

    *   `ActionEvent`


    An event is characterized by:


    1.  a target, which is the node where an event occurs and may for example be a
    window, a scene or a node

    2.  a source, which is the one that has generated an event and can, for example,
    be the mouse

    3.  an event type, such as mouse pressed, mouse released and so on


    When an event occurs, one talks about an event dispatch chain, which is the route
    from the stage to that node. Is it a `Circle` node, for example, it could be


    `Stage` – `Scene` – `Group` – `Circle`


    When an event occurs, it is sent to all nodes in its `dispatch chain` from top
    to bottom. If there is a node that has registered a `filter` for that event, this
    will be done, after which the event will be sent to its target node where it will
    be processed if there is an event handler. This phase is called the `Event Capturing
    Phase`. After that, the event follows back, and this phase is called the `Event
    Bubbling Phase`.


    In either case, an event handler is `filters` (capturing phase) while the handlers
    (bubbubbling). ` `,` the the following:


