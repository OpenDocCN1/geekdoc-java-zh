    # 3 2D Shapes


    In this chapter I will review how to draw geometric shapes in a window, and as
    may be seen in the last example of chapter 1, it is almost the same as in Java2D,
    only other classes are used. A geometric shape is an object of the type *Shape2D*,
    and thus an object that is a node and can be included in a scene graph. Generally,
    there are the following predefined shapes (nodes):


    *   *Line*


    *   *Rectangle*


    *   *Circle*


    *   *Ellipse*


    *   *Polygon*


    *   *Polyline*


    *   *CubicCurve*


    *   *QuadCurve*


    *   *Arc*


    In addition, you can define general curves as *Path* objects consisting of segments
    of the types:


    *   *Line*


    *   *CubicCurve*


    *   *QuadCurve*


    *   *Arc*


    and finally you can define a shape like a *SVG Path*.


    The aim of this chapter is to show how to create and apply the above geometric
    shapes, but instead of reviewing the syntax (which is a lot about what you know
    from Java2D), I will instead formulate a series of exercises where the challenge
    is primarily to find out of what the types are called JavaFX.


