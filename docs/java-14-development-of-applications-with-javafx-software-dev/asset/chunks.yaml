    ## 6.1 动画


    在本节中，我介绍了动画，你也可以将其视为节点变换的一种形式。动画基本上意味着改变节点的一个或多个属性，如果你多次这样做并在很短的间隔内进行，在用户看来，该节点就像是“活”的一了一样。正如
    Java 10 所述，节点需要在短时间间隔内重绘，使得该值被重绘。在 JavaFX 中，基类是 `Transition`，具体的类有：


    - `FadeTransition`

    - `FillTransition`

    - `RotateTransition`

    - `ScaleTransition`

    - `StrokeTransition`

    - `TranslateTransition`

    - `PathTransition`

    - `SequentialTransition`

    - `PauseTransition`

    - `ParallelTransition`


    作为一个示例，我将向你展示如何使用 `FadeTransition`。如果你运行程序 `FadeAnimation`，以下窗口显示了一个圆：


    ![](img/Image2098.jpg)


