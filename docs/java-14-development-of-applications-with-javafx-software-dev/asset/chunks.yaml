    ## 3.1 SVG


    SVG stands for Scalable Vector Graphics, and in relation to JavaFX, you define
    a shape in the form of a path as a string containing commands. There are the following
    commands where the cursor denotes the drawing tool:


    1. `M` or `m`, which means `move to`. As a result, the cursor is moved to the
    following coordinate. Is the command `M`, the coordinates designate an absolute
    position, and is the command `m`, the coordinates denote a relative position.
    If you indicate more coordinates, they are perceived as multiple subsequent move
    to operations.


    2. `Z` or `z`, which means `close` and closes the path with a straight line from
    the current position of the cursor to the start of the curve.


    3. `L` or `l`, which means `line to`. As a result, the cursor draws a straight
    line from the current point to the subsequent coordinate. If the command is `L`,
    the coordinates denote an absolute position and is the command `l`, the coordinates
    denote a relative position. If you indicate more coordinates, they are perceived
    as multiple subsequent line to operations.


    4. `H` or `h`, which means `horizontal to`. As a result, the cursor draws a horizontal
    line from the current point to the following x-coordinate. Is the command `H`,
    the coordinates designate an absolute position and is the command `h`, the coordinates
    denote a relative position. If you specify multiple x coordinates, they are perceived
    as multiple subsequent horizontal to operations.

