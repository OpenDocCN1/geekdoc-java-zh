- fmt: '

    A linear gradient paint is defined by two or more colors, which are defined as
    objects of the type `Stop`. Each stop indicates a color and a position that can
    either be relative or absolute. The first color stop is in this case blue and
    the position is 0, which means that the color is the start color. The other color
    is red and the position is 1, which means that the last color value must be red.
    All colors between these two extremes are blends of blue and red.


    The `LinearGradient` parameters are the starting position (here (0.0)) and the
    final position (here (1.0)), and the next parameter indicates that the coordinates
    must be interpreted relative (`true`) or absolute. In this case, the coordinates
    indicate that they must be mixed along the x axis from the left edge of the shape
    to the right edge of the shape. The next last parameter indicates whether the
    pattern should be repeated if the coordinates do not define the entire shape,
    and finally the last parameter is the color stops.


    A radial gradient paint is defined in almost the same way:


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_531.jpg)


    Again, two or more color stops must be defined, and in this case three are defined.
    They say that starting with a white color, and after 20% the color should be red
    for the last to be blue. Parameters for a `RadialGradient` begins by defining
    a starting point, which is the focus point and is the first stop. The first parameter
    is the angle of this focus point, while the next is the distance to the focus
    point. The next two parameters are the coordinates of the focus point, while the
    next is a radius of a circle that defines the area that the `Paint` object is
    about. The last three parameters means the same as for a `LinearGradient`.


    Finally, there is an `ImagePattern`, which is a `Paint` object that draws an image.
    In the program’s `start()` method an image (`Bean.png`) is loaded as an `Image`
    object. This image can then be used to create an `ImagePattern` object:


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_54.jpg)


    In addition to the image, the parameters are the starting coordinate of the figure
    (upper left corner), the width and height of the figure (the figure is scaled
    to this size), and whether the coordinates should be interpreted relative or absolute.


    ## 5.2 Images


    In the previous examples, I have already shown how to load an image and display
    it in a window. Actually, pictures do not have much to do with effects, but some
    are pictures used in the example above, and there are a few more remarks to add,
    so therefore a few additional examples.


    An image is displayed in a scene graph as an `ImageView` node, and the image itself
    is represented in the program as an `Image` object and can be loaded from the
    machine’s hard disk by specifying the path of the image as a parameter to the
    constructor. The following program is called `ImageViewProgram` and it opens the
    following window:


    ![](image/Image2015.jpg)


    It is the same image shown three times, and the example should primarily show
    how to scale an image. The first image (the big one) is unscaled while the two
    others are scaled. The code is as follows:


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_55.jpg)![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_56.jpg)


    The image is loaded in the class’ constructor and can then be referred to with
    the instance variable `image`. The method `createView()` creates an `ImageView`
    for the image, and it has five parameters, the first two being the coordinates
    of the `ImageView` object’s upper left corner, while the two next indicate the
    width and height. The last indicates whether the image’s propositions are to be
    retained. The statements of the method are easy to interpret, perhaps apart from
    the meaning of `setEffect()`, but the result is that a frame is drawn outside
    the image. If no `width` or `height` is specified, these attributes are not set,
    and the result is that the physical dimensions of the image are applied.


    Examining the method `start()` shows that there is no size for the first image.
    The image size therefore becomes the physical size, which is 400 × 400. For the
    next image, the size is set to 100 × 200, and it will be scaled within this frame,
    but as it is said that the propositions are to be saved, the result is an image
    that is scaled to 1/4 in both directions and you gets a picture that is 100 ×
    100. For the last image, the same size is specified, but the propositions are
    not preserved, and the image is therefore scaled in both directions, so it will
    fill 100 × 200.


    As the last example concerning images, I will show a program called `PixelProgram`.
    The program should show how to manipulate the individual pixels in an image. The
    starting point is the same picture as shown above. Here is a portion of the image’s
    pixels white (the background), and the program should change the background to
    black. That is, all white pixels must be changed to black. In general, it is simple,
    but as it is a jpg image, pixels close to the figure will not be completely white,
    and it is therefore necessary to allow an uncertainty as to when a pixel is white.
    Performing the program gives you the result:


    ![](image/Image2028.jpg)![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_58.jpg)![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_59.jpg)


    Most importantly, of course, is the method `createImage()`, which returns an `ImageView`
    with the modified image. First, the width and height of the image are determined,
    and a memory representation of a picture of the same size is created. The type
    is `WritableImage` and I have called it `buffer`. Next, a `PixelReader` is defined
    for the original image, which means that you can refer to the pixels. In addition,
    a `PixelWriter` is created for `buffer` that allows you to modify the buffer’s
    pixels. Next, the program iterates using the reader over the pixels of the original
    image (line by line), and for each pixel, the corresponding pixel is updated in
    `buffer` – either modified or unchanged. Here you should note the method `isWhite()`
    which tests whether a pixel can be considered white.


    ## 5.3 Light


    In the introduction to this chapter on effects, I have listed the different effects
    that you can apply, and I have far from illustrating them all (and will not),
    but I want to conclude this chapter with a little about the effect light. The
    principle is that a light source shines on a figure, and the color of the figure
    is determined by the nature of the light source and its position in relation to
    the figure.


    Generally, you can associate a lighting effect to a figure with a `Lighting` object,
    and if you do not indicate a light source, a default light source is used, which
    corresponds to the light falling directly into the figure, resulting in a weak
    3D effect. You can also explicitly indicate a light source, where there are three
    options:


    1. `Light.Distant`

    2. `Light.Point`

    3. `Light.Spot`


    The first corresponds to the light source located at a distance, thus sending
    light that extends in one direction from a remote light source:


    ![](image/Image2035.jpg)


    You can set as a parameter two values (both of the type `double`):


    1. `azimuth`, which indicates the angle of the light source’s rotation about the
    z axis

    2. `elevation`, which indicates the angle of the light source’s rotation about
    the x axis


    In addition, you can indicate the color of the light source.


    The second option is a light source where the light is sent from a certain point,
    as indicated by 3 coordinates. The light spreads in all directions, and in the
    same way as a `Distant` light source, you can indicate the color of the light
    source.


    ![](image/Image2043.jpg)

