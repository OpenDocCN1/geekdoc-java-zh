    线性渐变画由两个或多个颜色定义，这些颜色被定义为 `Stop` 类型的对象。每个停止点表示一种颜色和一个位置，该位置可以是相对的也可以是绝对的。在这种情况下，第一个颜色停止点是蓝色，位置为
    0，这意味着该颜色是起始颜色。另一个颜色是红色，位置为 1，这意味着最后一个颜色值必须是红色。这两个极值之间的所有颜色都是蓝色和红色的混合。


    `LinearGradient` 的参数是起始位置（此处为 (0.0)）和结束位置（此处为 (1.0)），下一个参数指示坐标必须被解释为相对（`true`）或绝对的。在这种情况下，坐标表示它们必须沿着从形状的左边缘到形状的右边缘的
    x 轴进行混合。倒数第二个参数表示如果坐标没有定义整个形状，是否应该重复该模式，最后一个参数是颜色停止点。


    径向渐变画的定义方式几乎相同：


    ![](img/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_531.jpg)


    同样，必须定义两个或多个颜色停止点，在这种情况下定义了三个。它们表示从白色开始，在 20% 之后颜色应变为红色，最后一个是蓝色。`RadialGradient`
    的参数从定义一个起点开始，该点是焦点点，也是第一个停止点。第一个参数是该焦点的角度，而下一个是到焦点的距离。接两个参数是焦点的坐标，而下一个是定义 `Paint`
    对象所围区域的圆半径。最后三个参数的含义与 `LinearGradient` 相同。


    最后，还有一个 `ImagePattern`，它是一个绘制图像的 `Paint` 对象。在程序的 `start()` 方法中，一个图像（`Bean.png`）被加载为一个
    `Image` 对象。然后可以使用此图像来创建一个 `ImagePattern` 对象：


    ![](img/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_54.jpg)


