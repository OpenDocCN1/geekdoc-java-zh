    8.  Implements the File menu


    9.  Implements missing features


    10.  Styling the program


    11.  Refactoring


    and the goal is that after completing the last iteration, you will have a finished
    program. The iterations are small, but after each iteration you have a version
    of the program that can be tested and used with the functions that have been implemented.


    #### First prototype


    The goal is to write an early version of the program, which should alone be a
    sketch of the user interface. The program must therefore not have calculating
    functions.


    ![](image/Image3696.jpg)


    Apart from the buttons, the program looks like the application from the previous
    book. The window must be resizable, and the two text fields must follow the size
    of the window, but the bottom must have a fixed height. The buttons should follow
    the right edge and bottom of the window. The *File* menu must have functions for
    saving and loading the variables, while the *Functions* menu must have a function
    to change the precision as well as a function that shows an overview and the variables
    that have been created.


    #### Enhanced prototype


    The result of the next iteration is still a prototype for the user interface,
    but with some changes with regard to buttons and with appropriate spacing and
    padding of the components.


    ![](image/Image3704.jpg)


    To the right of the buttons is a list box that displays the program’s variables
    and the size must be that part of the window that is not used for buttons. Additionally,
    a progress bar has been added because some the calculations may take a long time.


    #### Implements the square root and square function


    I have added a reference to the jar file *FunctionsLib.jar* from the final project
    in the previous book. Then I have created a package *bigcalc.models* and copied
    the files *Tokens.java* and *Expression.java* from the project *FunctionsEJB*
    to this package. After that, the entire math should be in place and the required
    calculation functions should be available.


    I have then created a package *bigcalc.ctrls* and here a class *MainController*:


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_163.jpg)


    In the class *BigCalc*, event handlers are assigned to the following buttons:


    *   Sqr


    *   Sqrt


    *   Clear Result, which deletes the content of the upper field for the result


    *   Clear Editor, which deletes the content og the enter field


    *   Enter


    It is all simple event handlers. Then you can perform arithmetic and evaluate
    expressions, and the calculator is in principle complete. In particular, you can
    paste text into the editor by clicking the buttons *Sqr* and *Sqrt*.


    #### Implements Store and Recall


    If you click the *STO* button, you should get the following dialog box:


    ![](image/Image3711.jpg)


    where to enter the name of the variable. If you click *OK*, the last result that
    is calculated is saved. If, on the other hand, you have checked the *Store Expression*
    check box, it is the expression that is entered in the editor field that is saved.
    After clicking *OK* and the desired value is assigned to the variable, the list
    box is updated (the list box to the left of the buttons).


    In order to keep track of the variables, the following model class has been added:


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_164.jpg)![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_165.jpg)


    If you click on a variable in the list box, the corresponding value is inserted
    in the editor field (at the cursor’s position). The same syntax is used as in
    the previous program, that is *@A1*, and the difference is that the value can
    be a value or an expression. This means that the controller must be updated so
    that values for variables are substituted before the expression is sent to the
    parser.


    If you click the *RCL* button, you get the following window where two variables
    were created:


    ![](image/Image3719.jpg)'
