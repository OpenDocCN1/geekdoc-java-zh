    顶部的文本通过 `text1()` 方法作为一个 `Text` 对象被创建。在这里你需要注意，带有参数的构造函数包含了文本的坐标，这些坐标表示基基线的左端点（文本“所处”的基准线）。此外，你应该特别注意如何创建字体。这是通过
    `Font` 类中的静态方法 `font()` 以及两个枚举 `FontWeight` 和 `FontPosture` 实现的。


    `line()` 方法接受一个 `Shape` 对象作为参数，该方法创建一个与 `text1()` 创建的文本基线相对应的 `Line` 对象。在这里，你应该特别注意
    `getBoundsInLocal()` 方法，它返回一个 `Bounds` 对象（定义在 `javafx.geometry` 包中），该对象包含了 `Shape`
    对象的宽度、高度以及其位置，因此包含了外接矩形。关于后者，它不是一个简单的 (x, y) 值，而是分别是可能出现的最小和最大 x 和 y 值。


    `getBoundsInLocal()` 方法返回任何变换之前的外接矩形。还有一个 `getBoundsInParent()` 方法，它返回变换后的外接矩形。在这种情况下，仅使用
    `Bounds` 对象就足以确定要绘制的线的长度。


    `text2()` 方法为下方的文本创建一个 `Text` 对象。由于 `Text` 对象也是一个 `Shape` 对象，你可以像处理其他形状对象一样指定填充（fill）和描边（stroke）。在这种情况下，对象的位置并不是由构造函数定义的，这只是为了展示还有其他选项。特别要注意如何指示文本需要下划线。


    最后，有一个方法 `rect()` 用于返回最后一段文本的外接矩形，在这里你应该主要注意如何使用 `Bound` 对象定义矩形。


    # 5 效果


    如前所述，JavaFX 程序将用户界面的内容表示为场景图（scene graph）中的节点。可以使用所谓的“效果”（effects）来更改单个节点的显示方式，效果是一个用于修改节点绘制方式的对象。这对于表示图像和几何图形等图形对象的节点来说，主要很有意义。本章将对这些效果进行简要介绍。基本上，以下效果被表示为
    `javafx.scene.effect` 包中的类：


    *   `ColorAdjust`，可用于修改图像的颜色，你从中调整色调、饱和度、亮度和对比度。

    *   `ColorInput`，对应于绘制填充颜色的矩形。

    *   `ImageInput`，用于用图像填充矩形区域。

    *   `Blend`，用于合并两个输入的像素。

    *   `Bloom`，用于为节点的部分区域提供更多色调。

    *   `Glow`，用于增加节点的色调。

    *   `BoxBlur`，用于通过框滤（box filter）对节点进行模糊操作。

    *   `GausienBlur`，也用于对节点进行模糊处理，但使用的是核（kernel）。

    *   `MotionBlur`，一种高斯模糊，其中还包含一个角度。

    *   `Reflection`，对节点执行反射。

    *   `SepiaTone`，为节点染上棕色色调。

    *   `Shadow`，通过边缘模糊产生阴影效果。

    *   `DropShadow`，在节点后面创建阴影效果。

    *   `InnerShadow`，在节点边缘内部创建阴影效果。

    *   `Lighting`，用于模拟光效，你从中指定光源，如点光源、距离光或聚光灯。

    *   `Light.Distant`，`Lighting` 的变体。

    *   `Light.Spot`，`Lighting` 的变体。

    *   `Point.Spot`，`Lighting` 的变体。


    作为一个示例，我展示了一个调整图像颜色的程序。该程序名为 `ColorAdjustProgram`，并打开以下窗口：


    ![](img/Image1987.jpg)


    其中左侧图像是原图，而右侧是调整后的图像。程序应该只显示使用 `ColorAdjust` 的语法，但在这种情况下并没有对图像产生任何改进。程序还展示了如何从本地磁盘将图片加载到
    JavaFX 程序中。程序代码如下：


    ```

    ![](img/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_47.jpg)![](img/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_48.jpg)![](img/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_49.jpg)

    ```


    图像在 `start()` 方法中加载，通常通过定义图像的路径来实现，这是一个 `jpg` 图像。在这种情况下，图像被放置在我主目录下的 `data` 目录，但图像也是包含示例的书籍
    zip 文件的一部分。与文件名唯一的区别是它以协议名称开头，因为图像位于本地文件系统中。在其他情况下，它将是 `http` 协议。图像是通过创建一个 `Image`
    对象来加载的。


    图像作为 `ImageView` 对象插入到程序的场景图中，`image1()` 方法为原图创建一个 `ImageView` 对象并指定图像左侧的坐标。`image2()`
    方法为原图创建一个 `ImageView` 对象并指定图像左侧的坐标。


