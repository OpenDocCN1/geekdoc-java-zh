    Each node in a scene graph has a unique parent, except the root, which has no
    parent, and all nodes that do not have child nodes are called as mentioned for
    leaf nodes, while all other nodes are called branch nodes. The same node can only
    occur in the tree once, and each node may have defined effects, opacity, transforms,
    and event handlers.


    To render the graphics JavaFX uses `openGL` (on Linux systems) and, as far as
    possible, use the graphics card’s hardware accelerator with the result that JavaFX
    is highly effective in rendering graphics.


    As mentioned above, a JavaFX application is represented by a `Stage` object that
    contains all of the application’s objects, and the `Stage` object is created by
    the actual platform. A `Stage` object has a width and a height in addition to
    the content (the scene graph), and there are decorations as a `title line` and
    a `frame`. There are the following kind of `Stage` objects:


    * `Decorated`

    * `Undecorated`

    * `Transparent`

    * `Unified`

    * `Utility`


    and the individual objects are discussed continuously in connection with the examples.


    The `Stage` object’s content is represented by a `Scene` object, which defines
    the width and height as well as the scene graph. The individual nodes are discussed
    in connection with the examples, and there are many with each there purpose. Among
    other things, there are different branch nodes, where the simplest is a `Group`
    node, which is primarily a collection of child nodes. Other examples are `Pane`
    nodes with several specific derivative classes, which play the same role as layout
    managers in Swing. All the specific nodes are part of a hierarchy of class’s and
    are derived from one of the following classes:


    ![](image/Image1799.jpg)


