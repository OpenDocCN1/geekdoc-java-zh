    # 7 Components


    Looking at the foregoing, I have primarily focused on how you in JavaFX works
    with geometric objects, but I have only overall mentioned components that the
    user can interact with. Viewed from practical programs it is of course the most
    interesting and is the subject of this and the following chapters. It is about
    which components are available and how they are laid out in a window. In addition,
    there is event management.


    ## 7.1 Layout


    The program’s scene graph consists of components, and these components can be
    placed absolutely as I have used in conjunction with geometric objects, but typically,
    nodes are placed in the scene graph using layout panes where a layout pane is
    an branch node. Viewed from the programmer, a layout pane has the same characteristics
    (and purposes) as a layout manager in Swing, and the theory resembles what you
    know from Swing. All layout panes have a common basic class `Pane`, and there
    are the following specific panes:


    * `HBox`

    * `VBox`

    * `BorderPane`

    * `StackPane`

    * `Flow Pane`

    * `TextFlow`

    * `AnchorPane`

    * `TitlePane`

    * `Grid Pane`


    In this section I show how the layout panes are used to layout components, and
    of course they can be nested in the same way you know it from Swing. The following
    examples are similar to each other and briefly show the application of the different
    panes, but you should examine the online documentation and what properties are
    available.


    I want to start with a `HBox` (the `HBoxProgram` application) which places components
    horizontally in a window, and here with three buttons:


    ![](image/Image2152.jpg)


    As you can see, the size of the buttons (width) changes according to the available
    space, and below I have shown the same window after the size has changed:


    ![](image/Image2159.jpg)


    As you can see, the components are as default left-aligned, but it can be changed
    with a property. The code is as follows:


    ```

    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_80.jpg)

    ```


    You may notice that the last method `createButton()` assigns the button a preferred
    size, and in JavaFX, basically, the same applies to a component’s size, as you
    know from Swing. As for the method `start()`, there is not much to explain, but
    you should note how to define a gap between the components. A `HBox` is a very
    simple layout pane and can only be used to arrange components on a line relative
    to their preferred size.


    There is a layout pane, called `VBox`, which is parallel to `HBox`, the difference
    being that it places the components on a vertical line. The `VBoxProgram` program
    shows the application of this layout pane:


    ![](image/Image2167.jpg)!(image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_81.jpg)!(image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_82.jpg)


    There is not much new to explain, but you should note how to indicate that the
    components should be displayed centered in the window. You are encouraged to investigate
    what options the type of `Pos` otherwise defines.


    A `BorderPane` looks like a `BorderLayout` and divides the window into 5 areas,
    called `center`, `top`, `right`, `bottom` and `left` and usually referenced in
    this order. As with a `BorderLayout`, the center will fill what has not been used
    by the other areas. The program `BorderProgram` opens the window shown below.
    In addition to show a `BorderPane`, the program should also show the use of nested
    panes. The window has 9 components:


    1. `center` : a `TextArea`

    2. `top`: a `BorderPane` with a `TextField` and a `Button`

    3. `right`: a `BorderPane` with a `Button` and a `TextArea`

    4. `bottom`: a `BorderPane` with a `TextField` and a `Button`

    5. `left` : a `BorderPane` with a `Button` and a `TextArea`


    You should notice the spacing between the components and how they are defined
    in the code.


    ![](image/Image2174.jpg)!(image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_821.jpg)!(image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_83.jpg)


    The individual 5 areas are created with three helper methods named `createField()`.
    The first is used for the center and creates a `BorderPane` with a `TextArea`
    component. You should notice how to set a spacing of 10 to the remaining 4 areas
    with `setPadding()`. Also note that the `BorderPane` constructor specifies a single
    parameter, which is the component to be shown at the center. The second `createField()`
    is used to create a `BorderPane` to be placed at top and bottom respectively.
    Here you specify 5 parameters for the constructor in `BorderPane`, which is interpreted
    as `center`, `top`, `right`, `bottom` and `left`.


    ```

    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_84.jpg)

    ```


    Here, `setMargin()` is a static method in the `BorderPane` class, which defines
    the margin of the first parameter in the current layout pane. The last `createField()`
    method is used to create a `BorderPane` for the contents of the right and left
    area and, in principle, it works as the previous method. You should note that
    a bottom margin is defined for both components.


    Finally, there is the `start()` method, where the `root` element this time is
    a `BorderPane` (which is a branch node). Here you should note how to create `root`,
    and to set a margin of 20.


    A `StackPane` is a layout pane that arranges the components on top of each other
    in the order they are added. The program `StackProgram` shows three buttons placed
    on top of each other:


    ![](image/Image2182.jpg)


    The application is probably limited, but primarily for `Shape` objects, the possibility
    can be useful. It’s quite simple to use a `StackPane`:


    ```

    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_85.jpg)

    ```


    A `FlowPane` is a layout pane that essentially behaves like a `FlowLayout` in
    Swing:


    ![](image/Image2191.jpg)


    If you increase the width of the window, all components will appear on the same
    line. Regarding the code, you should first notice how to define the gap between
    the components:


    ```

    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_86.jpg)

    ```

