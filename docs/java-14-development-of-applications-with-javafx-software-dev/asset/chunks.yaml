    从 Swing 中你已经熟悉组件 `JList`，它是一个列表框，广泛使用的组件之一。在 JavaFX 中，它被 `ListView` 取代，这是一个更高级的组件，具有许多新选项，并使用了多个辅助类。你必须编写一个打开以下窗口的应用程序，该窗口显示四个
    `ListView` 控件（实际上是 5 个），每个 `ListView` 显示 10 个 `Person` 对象，其中 `Person` 是练习题 27
    中的类。


    ![](img/Image3378.jpg)


    1. 左上角的 `ListView` 控件应显示如何选择项目。你可以使用鼠标选择项目，也可以使用顶部的 5 个按钮选择项目。每当你选择一个项目时，空白的 `ListView`
    必须显示哪些项目被选中了。

    2. 右上角的 `ListView` 控件应显示如何编辑 `Person` 对象。如果你双击某个人，列表框必须打开一个字段，以便你编辑内容（这是组件内置的）。在控件下方有一个
    `TextField`，用于向列表添加新的 `Person` 对象。

    3. 左下角的 `ListView` 控件应显示项目，其中每个元素都是一个 `ChoiceBox`，你可以通过选择另一个 `Person` 对象来更新项目（这也是组件内置的）。

    4. 最后，最后一个 `ListView` 将项目作为 `CheckBox` 控件显示（这也被集成到了 `ListView` 组件中）。如果你点击按钮，程序必须弹出一个消息框，显示被选中（通过复框）的对象。


    任务要求你查阅文档以确定需要写什么，也许你也可以在网上找到帮助。


    ## 练习 29


