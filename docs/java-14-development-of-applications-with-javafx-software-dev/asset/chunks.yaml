    5. `V` or `v`, which means `vertical to`. As a result, the cursor draws a vertical
    line from the current point to the following y coordinate. If the command is `V`,
    the coordinates denote an absolute position and is the `v`, the coordinate denotes
    a relative position. If you specify more y coordinates, they are perceived as
    multiple subsequent vertical to operations.


    6. `C` or `c`, which means `cubic to`. As a result, the cursor draws a cubic curve
    from the current point to the last of the following three coordinate pairs. The
    first two are control points. Is the command `C`, the coordinates designate an
    absolute position, and is command `c`, the coordinates denote a relative position.
    If you specify more coordinate sets, they are perceived as several subsequent
    curve to operations.


    7. `Q` or `q`, which means `quad to`. As a result, the cursor draws a quad curve
    from the current point to the last of the following two coordinate pairs. The
    first is the control point. Is the command `Q`, the coordinates designate an absolute
    position and is the command `q`, the coordinates denote a relative position. If
    you specify more coordinate sets, they are perceived as several subsequent quad
    to operations.


    8. `A` or `a`, which means `arc to`. The result is that the cursor draws an arc
    starting in the current point to (x, y). The parameters are (`rx row rotation
    large sweep x y`), where `rx` and `row` are radii in an ellipse and rotation is
    the ellipse rotation about the x-axis. The two parameters `large` and `sweep`
    indicate which of the two arcs to be selected, and the center of the ellipse is
    calculated automatically from the parameters. Is the command `A`, the coordinates
    designate an absolute position and is the command `a`, the coordinates denote
    a relative position. If you specify more parameter sets, they are perceived as
    several subsequent arc to operations.


