    ## 5.2 图像


    在之前的示例中，我已经展示了如何加载图像并将其显示在窗口中。实际上，图片与效果关系不大，但上面的示例中用到了一些图片，还有几点备注需要添加，因此这里提供几个额外的示例。


    图像在场景图中作为 `ImageView` 节点显示，图像本身在程序中被表示为 `Image` 对象，可以通过指定图像路径作为构造函数的参数从机器的硬盘中加载。接下来的程序被称为
    `ImageViewProgram`，它会打开以下窗口：


    ![](img/Image2015.jpg)


    显示了三次相同的图像，该示例主要应展示如何缩放图像。第一张图像（大的那张）未缩放，而另外两张经过了缩放。代码如下：


    ![](img/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_55.jpg)![](img/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_56.jpg)


    图像在类的构造函数中加载，然后可以使用实例变量 `image` 进行引用。`createView()` 方法为图像创建一个 `ImageView`，它有五个参数，前两个是
    `ImageView` 对象左上角的坐标，接两个指示宽度和高度。最后一个指示图像的属性是否被保留。该方法的语句很容易理解，可能除了 `setEffect()`
    的含义外，但结果是在图像外绘制了一个帧。如果没有指定 `width` 或 `height`，则这些属性将不会被设置，结果是应用图像的物理尺寸。


    检查 `start()` 方法可以发现第一张图像没有尺寸。因此，图像尺寸变为物理尺寸，即 400 × 400。对于下一张图像，尺寸被设置为 100 × 200，它将在该框架内缩放，但由于提到了要保留属性，结果是图像在两个方向上都等缩放了
    1/4，你得到一张 100 × 100 的图片。对于最后一张图像，指定了相同的尺寸，但没有保留属性，因此图像在两个方向上都进行了缩放，所以它将填充 100
    × 200。


    作为关于图像的最后一个示例，我将展示一个名为 `PixelProgram` 的程序。该程序应该展示如何操作图像中的单个像素。起点是上面所示相同的图片。这里有一图像的像素是白色的（背景），程序应该将背景改为黑色。也就是说，所有白色像素必须改为黑色。通常情况下这是简单的，但由于它是一张
    jpg 图像，靠近图形的像素不会完全是白色，因此有必要对像素何时为白色允许不确定性。执行程序后将得到结果：


    ![](img/Image2028.jpg)![](img/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_58)


    最重要的重要的是 `createImage()` 方法，它返回一个带有修改图像的 `ImageView`。首先确定图像的宽度和高度，创建一个相同大小的内存表示。类型为
    `WritableImage`，我将其命名为 `buffer`。接下来为原始图像定义一个 `PixelReader`，这意味着你可以引用像素。此外，为 `buffer`
    创建一个 `PixelWriter`，允许你修改缓冲区。接下来程序使用读取器遍历原始图像的像素（逐行），对于每个像素，更新 `buffer` 中的像素。在这里你应该注意
    `isWhite()` 方法，它测试像素是否可以被视为白色。


