    can define the entire scene graph or just a part of it. If in NetBeans you select
    *JavaFX* and *JavaFX FXML Application* for *New Project*


    ![](image/Image3602.jpg)


    and when you click *Next*, you must enter a project name where I have typed *HelloFXML*,
    and when you click *Finish*, NetBeans creates a project with three files:


    ![](image/Image3610.jpg)


    and again it is a fully finished program that can be translated and executed:


    ![](image/Image3617.jpg)


    If you click on the button, you get a window where a label is updated:


    ![](image/Image3625.jpg)


    Then there is the code and I want to start with HelloFXML.java:


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_137.jpg)![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_138.jpg)


    Immediately, it is a usual JavaFX application with a method *start()*, and there
    is only one difference, which is the statement


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_1381.jpg)


    which loads the file *FXMLDocument.fxml*. It is the XML document that defines
    the user interface and hence the program’s sceen graph. When you see the content,
