    如果你在应用程序中考虑一个属性，它的值可以在多个地方确定，以下列表列出了哪个值的优先级最高：


    1. 内联（优先级最高）

    2. 父级节点

    3. 场景图

    4. 在代码中赋值的值（Java 属性）

    5. 默认样式表


    在这里你应该特别注意，样式的优先级高于在 Java 代码中以通常方式赋值的值。还要注意优先级最低的选项。如果你没有指定某些内容，属性的值将由默认样式表确定。


