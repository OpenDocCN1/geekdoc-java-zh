    ![](img/Image3509.jpg)


    ## 7.4 对话框


    你也可以使用对话框，就像 Swing 中有现成的对话框一样。最简单的是对应 `MessageDialog` 的 `Alert`。应用程序打开以下窗口：


    ![](img/Image3517.jpg)


    如果你点击 `Info` 按钮，你会得到下方的消息框，显示一条简单的消息，这里是消息，最后最后一个按钮将导致一个警告，它会要求你删除条目：


    ![](img/Image3524.jpg)


    按钮在 `createCommands()` 方法中创建，这里是 `ActionEvent` 监听器，它们被定义为程序最后的类。`InfoListener`
    类为 `Info` 按钮创建一个事件对象，并在处理器中创建一个类型为 `AlertType.INFORMATION` 的 `Alert` 对象，结果就是上面显示的对话框。你必须注意对话框是如何初始化的，以及各个消息是如何出现在消息框中的。对话框通过
    `show()` 方法打开。该方法是非阻塞的，程序不会等待返回值。


    `SaveListener` 类定义了 `Save` 按钮的监听器，并模拟保存了输入的文本。它测试文本长度，如果长度小于 5，则打开一个与上面类似的警框。区别在于类型，因为这里是
    `AlertType.ERROR`，对应错误消息，然后打开对话框，但用的是 `showAndWait()` 方法。这意味着消息框是阻塞的，随后的语句只有在对话框关闭后才会执行。


    最后一个监听器类与其他类相似，但这次类型是 `AlertType.CONFIRMATION`，它打开一个有两个按钮的对话框，用户必须选择 *YES* 或 *NO*。它也通过
    `showAndWait()` 打开，你应该注意这次有返回值，以及是如何测试该值的。


