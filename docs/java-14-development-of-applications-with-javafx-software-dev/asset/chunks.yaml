    # 3 2D 形状


    在本章中，我将回顾如何在窗口中绘制几何形状，正如第 1 章的最后一个示例所示，这与 Java2D 几乎相同，只是使用了不同的类。几何形状是 `Shape2D`
    类型的对象，因此它是一个节点对象，并可以包含在场景图中。通常，有以下预定义的形状（节点）：


    *   `Line`（直线）

    *   `Rectangle`（矩形）

    *   `Circle`（圆形）

    *   `Ellipse`（椭圆）

    *   `Polygon`（多边形）

    *   `Polyline`（折线）

