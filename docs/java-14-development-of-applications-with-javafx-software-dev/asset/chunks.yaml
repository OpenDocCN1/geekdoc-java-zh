    From Swing you know the component `JList`, which is a list box and is one of the
    widely used components. In JavaFX, it is replaced by a `ListView`, which is a
    much more advanced component with many new options, which uses multiple help classes.
    You must write an application that opens the following window, where the window
    shows four `ListView` controls (actually 5), each `ListView` showing 10 `Person`
    objects where `Person` is the class from exercise 27.


    ![](image/Image3378.jpg)


    1. The `ListView` control in the upper left corner should show how to select items.
    You can select an item with the mouse and select an item using the top 5 buttons.
    Each time you select an item, the blank `ListView` must show which items are selected.

    2. The `ListView` control in the upper right corner should show how to edit a
    `Person` object. If you double-click on a person, the list box must open a field
    so you can edit the content (it is built into the component). Under the control
    there is a `TextField` that will be used to add a new `Person` object to the list.

    3. The `ListView` control at the bottom left should show items where each element
    is a `ChoiceBox`, from which you can update the item by selecting another `Person`
    object (it is also built into the component).

    4. Finally, the last `ListView` shows the items as `CheckBox` controls (it is
    also incorporated into the `ListView` component). If you click on the button,
    the program must open a message box that displays the objects that are selected
    (by the checkboxes).


    The task requires you to examine the documentation to find out what to write,
    and maybe you can also can find help online.


