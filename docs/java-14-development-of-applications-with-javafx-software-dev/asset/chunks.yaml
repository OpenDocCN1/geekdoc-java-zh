    Another thing is the endpoints of the line and here especially for shapes composed
    of straight lines, such as polygons. There are three options (as you also know
    from Java2D):


    1.  *StrokeLineJoin.MITTER* which is default


    2.  *StrokeLineJoin.BEVEL*


    3.  *StrokeLineJoin.ROUND*


    You can find the exact explanation of how these endpoints are calculated in the
    book about Java2D. The application *JoinProgram* opens the following window, which
    shows the effect of each of the three options:


    ![](image/Image1957.jpg)![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_371.jpg)![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_38.jpg)![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_39.jpg)


    There are similar options for specifying endpoints of lines (please check the
    book Java 10 for an explanation):


    1.  *StrokeLineCap.BUTT*


    2.  *StrokeLineCap.SQUARE*


    3.  *StrokeLineCap.ROUND*


