  raw: 'These methods are all simple and all built in the same way, and you should
    primarily notice how to assign filters and handlers to the individual nodes in
    the same way as described above. You should note *createButton()*, where no filter
    or handler is attached. If you run the program and click on the button, you will
    find that no event handlers are performed in the dispatch chain, and the reason
    is that the button instead with *setOnAction()* is associated with an event handler
    of the type *EventHandler<ActionEvent>*. This means that with the mouse click,
    the button will take care of the event action and not fire a regular mouse event,
    but instead an *ActionEvent*. Also note that the event handler of the button’s
    *ActionEvent* opens a simple message box, including the syntax for how to do it
    in JavaFX.


    The next example is called *KeyEventProgram* and opens the following window:


    ![](image/Image2253.jpg)


    If you are in the entry field and enter the key *Enter*, the green square will
    rotate and clicking on the square it will stop the rotation. The code is as follows:


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_100.jpg)![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_101.jpg)


    The class defines a variable for a transition, which is the animation that rotates
    the square. It is created by the method *createRotate()*, which does not contain
    anything new in terms of animations. The actual *Transition* object is created
    in the method *start()*. Here you should also notice how to set the background
    color for the window. The square is created in the method *createRect()*. Here,
    the method *setOnMouseClicked()* is used to attach an event handler for mouse
    clicks to the square, and you should note how the event handler is defined using
    a lambda expression.


    Then there is the method *createField()* that creates the entry field. It is a
    *TextField*, and the most important is the association of the event handler. It
    is a filter and the handler is associated for a *KeyEvent* of the type *KEY_TYPED*.
    The handler uses the method *getCharacter()* to test what has been entered and
    has the first character the code 13, it is the *Enter* key that is pressed, and
    if so, the animation will start. For any event, the event is marked as cosumed
    so that it is not passed on in the chain, and the effect is that the character
    for the key pressed is never displayed in the input field.


    The example thus shows how to catch events for mouse and keyboard. In the example,
    it happens in two different ways, where in *createField()* it takes place at low
    level with *addEventFilter()* while in *createRect()* it occurs using a *convenience*
    method. Many of the JavaFX classes defines event handlers as properties, and you
    can then register an event handler using a set method for that *convenience* method.
    The goal is to make it easier to associate event handlers what the following program
    *HandlerProgram* should illustrate:


    ![](image/Image2261.jpg)


    Clicking the Start button starts an animation where the circle moves along the
    curve and the animation runs until you click the stop button. If you click on
    the circle, it changes color.


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_103.jpg)![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_104.jpg)


    As how to create the animation and the curve there is nothing new and happens
    in the two methods *createTrans()* and *createRect()*. If you consider the method
    *createCircle()* that creates the circle, it associates an event handler for mouse
    clicks using a convenience method called *setOnMouseClicked()*. You should note
    that the event handler is the parameter and is a lambda expression.


    The method *createButton()* is used to create a button. It has three parameters,
    which is the text of the button, the x-coordinate of the location in the window
    and the button’s event handler. The latter has the type *EventHandler<ActionEvent>*
    and is associated with the method *setOnActionEvent()*.


    ## 7.3 Components


    Then there are the components (or controls) where JavaFX has many, but the most
    important are the following:


    | Label | MenuButton | Slider | ColorPicker |


    | Button | MenuItem | ScrollPane | DatePicker |


    | TextField | Menu | ScrollBar | ProgressIndicator |


    | PassWordField | ContextMenu | TabPane | ProgressBar |


    | TextArea | Separator | SplitPane | FileChooser |


    | RadioButton | ChoieBox | TitlePane | HTMLEditor |


    | Hyperlink | ComboBox | Accordion | TableView |


    | CheckBox | ListView | Pagination | TreeView |


    | ToggleButton | WebView | Tooltip | TreeTableView |


    Some of these components have already been used in the previous examples and the
    rest of this section consists of exercises and problems where you should try using
    the above components (but not the last three in the last column postponed to the
    next book). Most of the components are easy to use and take a good part of the
    way, as you know it from Swing. Others are more complex, and on the whole, the
    following exercises require that you use the documentation and, if necessary,
    also find examples and help on the Internet.


