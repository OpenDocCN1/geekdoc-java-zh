    There also is a `ChoiceDialog`, where the user can choose a value between several
    options. The program `ChoiceProgram` opens a window with a button and clicking
    on the button gives you the following dialog box:


    ![](image/Image3532.jpg)


    where in a dropdown you can choose a text (in this case the name of a Danish king).
    If you click OK, the selected name will be returned to the application where it
    appears in the window. The code is as follows:


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_122.jpg)![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_123.jpg)


    Initially, a list named `dialogData`, which contains the names of 5 Danish kings,
    is defined. The method `start()` is simply and build a scene graph containing
    a button and a `Text` control. The button’s event handler calls the method `showDialog()`,
    which creates a dialog of the type `ChoiceDialog`. The parameters of the constructor
    are the data to be displayed in the dropdown field and which one should be selected
    by default. Otherwise, you should notice how to get the return value and test
    it.


    As the last of the standard dialog boxes, you have a `TextInputDialog` that is
    used to enter a text. The program `InputProgram` opens just like the previous
    program a window with a button and clicking on the button gives you a dialog box
    where you can enter a text:


    ![](image/Image3541.jpg)


    The program is basically identical to the previous one, so I would like only to
    show the method called from the event handler for the button, and compared to
    the previous example, there is not much to explain, the fact that the type of
    the dialog box is now `TextInputDialog`:


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_124.jpg)


    As the last example in this section, the following application opens two custom
    dialogs. The program is called `DialogProgram`, and if you run the program, you
    get the following window:


    ![](image/Image3552.jpg)


    If you click on the button at the top, you will get a dialog box where you should
