    # 5 Effects


    A JavaFX program, as mentioned, represents the content of the user interface as
    nodes in a scene graph. It is possible to change how the individual nodes are
    displayed using so-called effects, where an effect is an object that is used to
    modify how a node is to be drawn. It is primarily interesting for nodes, which
    represent graphic objects like images and geometric figures. This chapter is a
    brief introduction to these effects. Basically, the following effects are represented
    as classes in the package `javafx.scene.effect`:


    *   `ColorAdjust`, which can be used to modify the color of an image where you
    can adjust the hue, saturation, brightness and contrast.

    *   `ColorInput`, which corresponds to drawing a rectangle, filled with a color.

    *   `ImageInput` used to fill a rectangular area with an image.

    *   `Blend`, which is used to combine pixels from two inputs.

    *   `Bloom`, which is used to provide a portion of a node more hue.

    *   `Glow`, which is used to increase the hue of a node.

    *   `BoxBlur`, used to perform a blur operation on a node with a box filter.

    *   `GausienBlur`, also used to perform a blur of a node, but instead using a
    kernel.

    *   `MotionBlur`, which is a gaussien blur, where there is also an angle.

    *   `Reflection` that performs a reflection of a node.

    *   `SepiaTone`, which tones a node with a brownish color.

    *   `Shadow`, resulting in a shadow effect by a blur of edges.

    *   `DropShadow`, where the shadow effect is created behind the node.

    *   `InnerShadow`, where the shadow effect is created within the edge of the node.

    *   `Lighting`, which is used to simulate a light effect, where you can indicate
    a light source such as point, distance or sport.

    *   `Light.Distant`, which is a variant of `Lighting`.

    *   `Light.Spot`, which is a variation of `Lighting`.

    *   `Point.Spot`, which is a variation of `Lighting`.


    As an example I show a program that adjusts the colors of an image. The program
    is named `ColorAdjustProgram` and opens the following window:


    ![](image/Image1987.jpg)


    where the left image is the original, while the right is the adjusted image. The
    program should show only the syntax for using a `ColorAdjust`, but in this case
    does not result in any improvement of the image. The program also shows how to
    load a picture from the local disk into a JavaFX program. The program code is
    as follows:


    ```

    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_47.jpg)![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_48.jpg)![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_49.jpg)

    ```


    The image is loaded in the method `start()` and is usually done by defining a
    path to the image, which is a `jpg` image. In this case, the image is placed in
    a directory `data` under my home directory, but the image is also part of the
    book’s zip file with examples. The only difference with regard to the file name
    is that it starts with the name of the protocol as the image is located in the
    local file system. In other cases, it would be the `http` protocol. The image
    is loaded by creating an `Image` object.


    An image is inserted into the program’s scene graph as an `ImageView` object,
    and the method `image1()` creates an `ImageView` object for the original image
    and specifies the coordinates of the image’s left. The method `image2()` creates
    an `ImageView` object for the original image and specifies the coordinates of
    the image’s left.


