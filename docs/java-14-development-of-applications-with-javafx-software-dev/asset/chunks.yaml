    ## 6.1 Animations


    In this section I introduce animations, which you also can perceive as a form
    of transformations of a node. An animation basically means changing one or the
    properties of a node, and if you do it many times and do it at short intervals,
    it will seem to the user as if something is “alive” with that node. As described
    in Java 10, a node needs to be redrawn at short intervals, and such that the value
    of an option has been changed for each redraw. In JavaFX, this logic is encapsulated
    in a number of classes, where each class defines an animation for a particular
    value or property. The base class is called a *Transition*, but there are the
    following specific transitions:


    *   *FadeTransition*


    *   *FillTransition*


    *   *RotateTransition*


    *   *ScaleTransition*


    *   *StrokeTransition*


    *   *TranslateTransition*


    *   *PathTransition*


    *   *SequentialTransition*


    *   *PauseTransition*


    *   *ParallelTransition*


    and the names tells a little about what it is for properties that the class in
    question is an animation for. As an example, I will show you how to use a *FadeTransition*.
    A visual node has an *opacity* property that indicates the extent to which that
    node should be displayed transparent. If you perform an animation of this property,
    you can see that the figure appears fully drawn, after which it appears more transparent
    until it completely disappears. It is the task of a *FadeTransition*. If you run
    the program *FadeAnimation*, the following window shows a red circle:


    ![](image/Image2098.jpg)


    The circle becomes weaker and weaker and finally disappears completely. Then it
    grows again until it is shown as it original was. This cycle is repeated 5 times.
    The code is as follows:


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_73.jpg)


    The method *createCircle()* is trivial, while it is the method *createTransition()*
    that creates the transition. In this case, it is a *FadeTransition*, and the constructor
    tells that the animation should take 2 seconds, and what it is for a node that
    the animation should work on. Otherwise, the animation must change the value from
    from 1 (not transparent) to 0 (total transparent). The next statement tells the
    animation to be repeated 10 times and finally, after the animation is complete,
    the next one must go backwards. In *start()*, a *Transition* object is created
    and the statement


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_74.jpg)


    starts the animation.


    The other animation classes are used in the same way, but instead of showing examples,
    I have formulated a series of exercises that will illustrate applications of the
    most important classes. You can immediately start from the above program, but
    for some of the exercises it is necessary to read the documentation to find out
    what to write – which values should be initialized.


