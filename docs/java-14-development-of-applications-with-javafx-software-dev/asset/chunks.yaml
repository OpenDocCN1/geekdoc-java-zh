    # 8 Styling


    From web applications you know cascading style sheets, and you can also use it
    in JavaFX. The idea is the same as for web application, namely to separate the
    definition of windows and their content from the presentation so that you can
    change the look and feel of a program without changing the code. On the other
    hand, the syntax is a little different, and as for web applications, the biggest
    challenge is to learn how styles can be written and what they are called. The
    subject appears best with an example, and the program *StyleProgram* opens the
    following window:


    ![](image/Image3580.jpg)


    where the window contains two *Label* controls, two *TextField* controls and two
    *Button* controls. For all 6 components there is a style attached. For the *TextField*
    and *Button* controls, it happens in a style sheet, which is a file named *styles.css*:


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_130.jpg)


    Here are three styles defined. In the same way as for web pages, a style is defined
    with a selector that starts with a point followed by the type on the node in the
    scene graph, which should have that style – but with the class name written in
    lowercase. The first, therefore, defines a style for *Button* nodes. Here, two
    style attributes are defined, and the difficulty is of course to know which attributes
    can be specified, but in general, you can associate a style value with any of
    the class’s properties. Here is the syntax that if there is a property called
    *backgroundColor*, the style attribute is named *-fx-background-color*. That is,
    if the name of an attribute consists of two words, the last one starting with
    a capital letter, it is all written in lowercase letters and with a hyphen is
    inserted between the words. The same syntax is used for a selector, and a selector
    for the class *TextField* is written as:


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_1301.jpg)


    You can also have a custom selector, what the last style is an example of. It
    defines a style for the gray frame in the window, and when you see the individual
    attributes, it is easy enough to understand the meaning. In practice, of course,
    it is more difficult to find out what to write, and it is important to note that
    NetBeans knows JavaFX style sheets and which attributes are available.


    With respect to the syntax, the following applies to values of the individual
    attributes:


    *inherit*, where the value is inherited from the parent’s node, for example


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_1311.jpg)


    *boolean*, where the value can be *true* or *false*, for example


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_1312.jpg)


    *string*, where you enter the value in quotation marks, for example


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_1313.jpg)


    *number*, where you enter the value as a decimal number, for example


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_1314.jpg)


    You can also specify a unit such as *px* (pixels), *mm* (millimeters), *cm* (centimeters),
    *in* (inches), *pt* (points), *pc* (picas) or *em*. You can also specify a percent
    value. Examples could be:


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_1315.jpg)


    *angle*, which is specified by a number and a unit that must be *deg* (degrees)
    or *rad* (radians) for example


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_1316.jpg)


    *point*, which is specified using x and y coordinates as two numbers separated
    by whitespaces, for example


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_1317.jpg)


    There are several other values that you can specify for properties, and you should
    examine the documentation for a complete overview, for example


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_1318.jpg)'
