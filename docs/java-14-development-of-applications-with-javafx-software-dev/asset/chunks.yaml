    `STO`)

    * 2 `Button` controls to consts (`Pi`, `e`)

    * 36 `Button` controls to functions

    * 7 `Menu` controls

    * 41 `MenuItem` controls

    * 1 `ProgressIndicator`

    * 1 `Label` to the text in the status line

    * 1 `Label` to precision

    * 1 `Label` to the filename

    * 1 `Label` to the variable name in the list box

    * 1 `Label` to the variable valie in the list box


    You can then in a style sheet define a class (an empty class) for each of these
    groups (15 classes in total) and then associate these classes with the individual
    components. You can then write the styles you want to use and the advantage is
    that you can change the presentation of controls without changing the `Java` code,
    and as the most important thing, you can delegate the work to developers with
    special skills in styling.


    In this case, I have added a style sheet named `mainstyles.css` and written a
    few styles – and maybe even most for the example’s sake.


    You can then repeat it for all the application’s windows and dialogs, and maybe
    use the same style sheet for all or most dialogs. That way, you only have to write
    styles somewhere, and all of the application’s dialog boxes have the same look
    and feel. In this case, I have added a style sheet named `dlgstyles.css`, which
    is used by all dialogs. In many examples, you may want to use a single style sheet,
    which is used by all windows, and of course (at least for small programs) it may
    be appropriate.


    ### Refactoring


    Now the program is in principle complete and consists of the following files:


    ![](image/Image3752.jpg)


    I have previously argued that in this place you should conduct a code review,
    inspecting the code, adding comments, removing disabilities, and more. This code
    review often has character of a refactoring, which may result in code being moved
    to new classes or reorganizing the code in another way. Especially if the program
    is developed through many small iterations with the character of prototyping as
    in this case, there is a great risk that it may go beyond the architecture, and
    in particular there is a risk that the class of the main window swells up and
    becomes inappropriately design. For the sake of future maintenance, therefore,
    refactoring is important, and you should focus on the following:


    * If there are `import` statements that are no longer necessary (`NetBeans` shows
    which ones), they should be removed.

    * If there are variables that are no longer used, they should also be deleted.

    * If there is code (such as methods) that are not used, it should be removed.

    * Has instance variables and methods appropriate names. If not, consider changing
    the names so that they better reflect the use.

    * Consider visibility, so only what it’s going to be `public` is `public` while
    the rest is `private` and possibly `protected`.

    * Are variables and properties located in the right place (in the right classes)
    and here you must have the MVC pattern in mind. Often the user interface will
    contain variables that should be moved to the controller or model.

    * Pay special attention to code repetition where the same code is written in several
    places. Such a code should typically be moved to its own method, and the code
    repetitions can then be replaced by the call of this method.

    * Pay attention to the size of classes. If classes are very large, such as many
    hundred of lines or more, you might want to consider splitting up the class into
    several classes. Not that you must necessarily, but a class on a thousand lines
    or more is hard to overlook.

    * Be aware of event handlers, as they tend to contain code related to business
    logic, and if necessary, this code should be moved to controller classes (possibly
    to the model). In general, event handlers should be as simple as possible and
    contain only code that directly concerns the user interface. It’s a tough balance,
    since delegation of the code to the controller and model layers can also lead
    to code that is difficult to read and that the user interface needs to observer
    for the controller and model. However, it should be noted that the user interface
    should contain only what is necessary to update the components.


    And so: Refactoring is an important activity for future maintenance, but make
    sure that the process does not introduce new errors in the program. The program
    must then be tested again after the activity is completed.


    And then there are the comments, which are also part of the refactoring process
    or rather the maintenance of the comments. I have previously argued the importance
    of comments and especially the process of writing the comments. These views are
    still valid, but if you see my program examples (what the readers hopefully do),
    I have to admit that there is a long line between the comments. Should the truth
    come true, I must also admit that I am a bit ambivalent with regard to comments:
    I know it’s right to comment on the code, but I do not do that often, so some
    remarks about this problem.


    It’s a big job to write comments – at least if you have to make it complete, and
    then the comments also has to tell you something. You must therefore necessarily
    refer to whether it is worth the work. Comments documents the code and it is certainly
    important, but I find that good program architecture and good names for variables
    and methods are far more important – it is also a form of comments. The goal of
    all is to make the code easier to read and understand, and here I find that the
    things I have mentioned above regarding refactoring, exceeds the value of comments.
    Comments have definitely their applications, but with good names and a good architecture,
    there is a tendency for comments to commenting on self-esteem and comments make
    comments for their own sake, and if so, it’s not worth the effort – then there
    is hardly anyone who will pay for the assignment.


    Now it’s probably not either, but to explain a little about my wings, I will mention
    that when I have to read and understand foreign code, one of the first things
    I do is to delete all comments. They simply seem disturbing to me – at least if
    it’s a nice code. Is that the way it matters, of course, it does not make much
    sense of writing comments. Of course, it also has something to do with which code
    it is, where comments of the code in the user interface are rarely valuable, where
    comments of complex algorithms in control and model days may be required.


    I know that not everyone will agree with these views, but at least they explain
    why my code often lacks comments, which also reflects that much of what I should
    write as comments is a part of the text in the books.

