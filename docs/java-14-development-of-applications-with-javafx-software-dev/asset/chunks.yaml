    # Poul Klausen


    # Java 14: 使用 JavaFX 开发应用程序


    软件开发


    Java 14: 使用 JavaFX 开发应用程序：软件开发


    第一版


    © 2018 Poul Klausen & [bookboon.com](http://bookboon.com)


    ISBN 978-87-403-2188-3


    同行评审员：Ove Thomsen, EA Dania


    # 前言


    本书是软件开发系列书籍中的第 14 册，涉及 JavaFX。本书介绍了 JavaFX 如何作为 Swing 和 Java2D 的替代方案，因此讨论了如何在
    JavaFX 中处理 2D 图形，以及主要的组件和布局。目标是让你能够快速地使用 JavaFX 编写带有图形用户界面的程序。书中有许多主题，特别是 `JavaFX
    properties`，本书未涵盖这些内容，但这些主题将在接下来的书中进行讨论。JavaFX 旨在作为 Swing 的替代方案，特别用于用户界面中更好的图形和其他媒体。通过
    JavaFX，可以更容易开发出具有现代用户界面的应用程序，并具备用户从 Web 应用程序中所期望并习惯的所有功能。本书并不要求读者详细了解 Swing 和
    Java2D，但假设读者已经具备开发带有图形用户界面的程序的入门知识。


    正如标题所示，该系列书籍涉及软件开发，目标是教导读者如何在 Java 中开发应用程序。可以通过阅读相关主题和学习完整的示例程序来掌握，但最重要的是通过亲身实践并从零开始编写自己的程序。因此，书中的重要部分是练习和问题，读者必须其中编写与书中处理内容对应的程序。该系列中的所有书籍都围绕同一个骨架构建，将由文本、示例、练习和问题组成，这些内容被放置在文本中自然的位置。练习和问题的区别在于，练习在很大程度上是对文中介绍内容的重复，并且对要做什么描述得相对准确。相比之下，问题的描述较为松散，通常规模稍大，且很少有明确的最佳解决方案。这些书是应该从头到尾读完的，但大量的代码示例（包括练习和问题）起着核心作用，读者在详细预测并研究许多示例代码的同时，解决练习和问题（或者可能只是研究推荐的答案）是非常重要的。


    所有书籍都以一个或两个较大的示例程序结束，重点主要关注过程以及对程序如何编写的解释。另一方面，代码仅在有限范围内出现——如果有的话——读者反而应该学习完成的程序代码，也许是在测试程序时。除了展示比其他示例更大的程序开发外，结尾示例的目的还在于展示来自不同应用领域的程序示例。


    大多数书籍还以一个附录结束，处理一个书中未涉及的主题。这可能是软件安装问题或其他计算机技术的其他主题，这些主题不属于软件开发，但对于入门知识是必要的。如果读者已经熟悉该主题，可以跳过当前附录。


    编程语言如前所述是 Java，除了书籍外，还使用了以下产品：


    1. `NetBeans` 作为应用程序开发的 IDE

    2. `MySQL` 在需要数据库服务器时使用（从 `Java 6` 书籍开始）

    3. `GlassFish` 作为 Web 服务器和应用程序服务器（从 `Java 11` 书籍开始）


    这些产品都是免费且免费安装的，甚至谈到了某些产品的安装是完全自动进行的，不需要费力的努力和挑战。此外，网上还有所有这三个产品的详细安装说明。这些产品适用于
    Windows 和 Linux，因此你使用 Linux 还是 Windows 并没有特殊影响。


    所有示例程序均在运行 Linux 的机器上开发和测试。事实上，这并没有什么主要影响，因为无论平台是哪一个，Java 和其他产品的工作方式完全相同。书中某些地方你会看到平台是
    Linux，这主要适用于涉及文件系统的命令。否则，对于读者来说，程序在 Linux 机器上开发并没有意义，它们也可以立即在 Windows 下运行，除非程序引用了文件系统，在此时可能需要更改文件名。


    最后，简单介绍一下这些书不是什么。它们不是关于 Java 的“如何编写”指南，或者说它们不是参考手册，而是正如标题所示，是关于软件开发的书籍。我希望读者在阅读书籍并通过许多示例时，能够找到如何编写良好程序的灵感，也可以将其作为资源集，包含许多你作为软件开发人员经常面对的具体日常编程问题的解决方案示例。


    # 1 引言


    在 `Java 2`、`Java 9` 尤其是 `Java 10` 书中，我处理了如何编写带有图形用户界面的独立 Java 应用程序。所有内容都是基于 `Swing`，它是一个通过综合类库提供必要功能的
    API。`Swing` 本身没有问题，它在未来的许多年里仍然存在，部分原因是因为有许多基于 Swing 的程序。然而，也有替代方案，其中一种就叫做 `JavaFX`，作为开发带有图形用户界面的
    Java 应用程序的新 API。


    JavaFX 旨在作为 Swing 的替代方案，特别用于用户界面中更好的图形和其他媒体。通过 JavaFX，可以更容易开发出具有现代用户界面的应用程序，并具备用户从
    Web 应用程序中所期望并习惯的所有功能。然而，重要的是强调，你仍然可以使用 Swing 组件，因此所有已 Swing 功能依然可用。


    JavaFX 是 Swing 的替代方案，但该想法实际上源于世界维网，在其中可以使用标记语言构建用户界面，并在很大程度上可以使用样式来设计应用程序的用户界面。本书的目标是展示如何使用
    JavaFX，我将单独查看独立应用程序的，但 JavaFX 的目标也是开发 Web 应用程序的客户端，这意味着 JavaFX 应用程序可以作为


    1. 独立桌面应用程序

    2. 使用 `Java Web Start` 技术

    3. 作为网页的一部分


    目前，我将只考虑第一种。


    ## 1.1 HelloFX


    作为开始，我将展示一个非常简单的应用程序，它打开一个带有几个按钮和其他内容的窗口，但这是一个使用 JavaFX 而不是 Swing 的程序。我从 `Netbeans`
    中新建项目开始，但必须是一个 `JavaFX Application` 项目。我将项目命名为 `HelloFX`，创建项目后，NetBeans 创建了单个类（我删除了所有注释）：


    ```

    image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_8.jpg

    ```


    事实上，这是一个完整的程序，启动程序后会打开以下窗口：


    ```

    image/Image1760.jpg

    ```


    '
- fmt: '

    and clicking on the button it prints a message on the console. If you consider
    the code, first notice that the class inherits `Application`, which means that
    it is a `JavaFX` application. The class has a usual `main()` method as other Java
    applications, and it starts by calling a static method `launch()` (in the class
    `Application`). It basically performs the following:


    1. instantiates an object of the class (here the class `HelloFX`)

    2. performs a method `init()`, which in `Application` is an empty method

    3. performs a method `start()`, which in `Application` is an empty method

    4. waiting until the program terminates, where method `stop()`, as in `Application`
    is an empty method, is performed


    If you want an application to open a window, it usually happens to override the
    method `start()` from the class `Application`, as is the case in the above example.


    A JavaFX program basically consists of a `Stage` object that contains a `Scene`
    object, which again contains `Node` objects arranged in a tree. A `Stage` object
    represents a window and the primary `Stage` object is created by the runtime system
    and is sent as a parameter to the method `start()`, and in the above example it
    has the name `primaryStage`. A `Scene` object contains all of the window’s objects
    organized into a tree called a `scene graph`. The tree’s elements are `Node` objects,
    and a node can be an `branch node` (which has children) or a `leaf node` (which
    no children have). A node is a component in the window and may, for example, be
    a button or an entry field.


    In the example above, the method `start()` begins by creating a button, which
    is a node. The object is called `btn`, and besides attaching a text to the button,
    an action is also associated, which is an object with a single method, which simply
    performs a `System.out.println()`. You should note that it looks like a usual
    event handling as it is known from Swing, but it is not the case, and other types
    are used, although they have the same names as some of the known types from Swing.


    As a next step, a `root` object of the type `StackPane` is created, and it is
    the root of the scene graph and the button is inserted as a child to `root`. This
    program thus has a very simple scene graph consisting of a root and a single leaf
    node. The root object is then added to a `Scene` object, which represents the
    window’s content, while defining the window size. This `Scene` object must be
    attached to the `Stage` object, which is also assigned a title, and finally, the
    method `show()` is performed on the object `primaryStage`, which displays the
    window on the screen.


    It is thus easy to follow what happens in the above program, but it is more difficult
    to spot the benefits. They come later, but I can immediately point out that one
    of the advantages is that the technology used to draw the window with all its
    content is extremely effective.


    Before I leave this example, I will change the code a bit (for now, the code appears
    as NetBeans has created it). I have changed the code to the following:


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_10.jpg)!(image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_11.jpg)


    If you run the program, it first writes the following lines on the console:


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_111.jpg)


    after which you get the following window


    ![](image/Image1767.jpg)


    If you enter the text `Frode Fredegod` and click `Hello`, the window will be updated
    to:


    ![](image/Image1776.jpg)


    and clicking `Exit` terminates the program after writing the following text on
    the console:


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_13.jpg)


    This time, the method `start()` creates a scene graph with a `root` that has 5
    leaf nodes. Note that the type of `root` is `VBox`. There is no particular justification
    in addition to showing that there are more options, and the type is relevant to
    how the graph’s nodes are laid out in the window. The 5 nodes have the types `Label`,
    `TextField`, `Label`, `Button` and `Button`, where the first and the last are
    created when they are added to `root` (the last created of the method `createButton()`),
    while the other three are created explicitly.


    Note that the method `start()` starts by printing a text (on the console). I have
    also overwritten the two methods `init()` and `stop()` so they both print a text
    and finally I have added a default constructor. They show that the constructor
    is first executed, then `init()` and finally `start()`. Finally, they show that
    the method `stop()` is executed when the program terminates. Here you should note
    that the constructor, `start()` and `stop()` are executed in the same thread (called
    the `JavaFX Application Thread`), while `init()` is performed in its own thread
    (called the `JavaFX Launcher`).


    If you look at the directory `dist`, you can see that a jar file named `HelloFX.jar`
    has been created in the usual way, and the program can therefore be executed from
    the command line as (if current directory is the folder `dist`):


    ![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_111.jpg)


    ![](image/Image1784.jpg)


    ## 1.2 HelloLines


    As another example of JavaFX program, I will show an example that opens the following:


    ![](image/Image1791.jpg)


    The project is called `HelloLines`, and the window contains a scene graph, consisting
    of a root with 4 nodes. The code is as follows:![](image/Java_14_–_Development_of_applications_with_JavaFX_9-4-18_14.jpg)


