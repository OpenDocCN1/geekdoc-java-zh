    场景图中的每个节点都有一个唯一的父节点，根节点除外（它没有父节点）。所有没有子节点的节点如前所述被称为叶节点，而所有其他节点统称为分支节点。同一个节点在树中只能出现一次，且每个节点可能定义了效果、透明度、变换和事件处理器。


    为了渲染图形，JavaFX 使用 `openGL`（在 Linux 系统上），并尽可能使用显卡的硬件加速器，这使得 JavaFX 在渲染图形方面非常高效。


    如上所述，JavaFX 应用程序由一个 `Stage` 对象表示，该对象包含了应用程序所有的对象，且 `Stage` 对象是由实际平台创建的。`Stage`
    对象除了内容（场景图）外，还有宽度和高度，并有如`标题行`和`边框`等装饰。`Stage` 对象有以下几类类型：


    *   `Decorated`（有装饰的）

    *   `Undecorated`（无装饰的）

    *   `Transparent`（透明的）

    *   `Unified`（统一的）

    *   `Utility`（工具）


    具体的对象将结合示例连续讨论。


    `Stage` 对象的内容由一个 `Scene` 对象表示，它定义了宽度、高度以及场景图。具体的节点将结合示例进行讨论，其中许多节点都有其特定的用途。此外，还有不同的分支节点，其中简单的是
    `Group` 节点，它主要是子节点的集合。其他示例是带有多个特定派生类的 `Pane` 节点，它们的作用类似于 Swing 中的布局管理器。所有特定的节点都是类层级结构的一员，并派生自以下类中的之一：


