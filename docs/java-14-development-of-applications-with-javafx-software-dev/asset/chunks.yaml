  raw: 'and clicking on the button it prints a message on the console. If you consider
    the code, first notice that the class inherits *Application*, which means that
    it is a *JavaFX* application. The class has a usual *main()* method as other Java
    applications, and it starts by calling a static method *launch()* (in the class
    *Application*). It basically performs the following:


    1.  instantiates an object of the class (here the class *HelloFX*)


    2.  performs a method *init()*, which in *Application* is an empty method


    3.  performs a method *start()*, which in *Application* is an empty method


    4.  waiting until the program terminates, where method *stop()*, as in *Application*
    is an empty method, is performed


    If you want an application to open a window, it usually happens to override the
    method *start()* from the class *Application*, as is the case in the above example.


    A JavaFX program basically consists of a *Stage* object that contains a *Scene*
    object, which again contains *Node* objects arranged in a tree. A *Stage* object
    represents a window and the primary *Stage* object is created by the runtime system
    and is sent as a parameter to the method *start()*, and in the above example it
    has the name *primaryStage*. A *Scene* object contains all of the window’s objects
    organized into a tree called a *scene graph*. The tree’s elements are *Node* objects,
    and a node can be an *branch node* (which has children) or a *leaf node* (which
    no children have). A node is a component in the window and may, for example, be
    a button or an entry field.


    In the example above, the method *start()* begins by creating a button, which
    is a node. The object is called *btn*, and besides attaching a text to the button,
    an action is also associated, which is an object with a single method, which simply
    performs a *System.out.println()*. You should note that it looks like a usual
    event handling as it is known from Swing, but it is not the case, and other types
    are used, although they have the same names as some of the known types from Swing.


    As a next step, a *root* object of the type *StackPane* is created, and it is
    the root of the scene graph and the button is inserted as a child to *root*. This
    program thus has a very simple scene graph consisting of a root and a single leaf
    node. The root object is then added to a *Sceen* object, which represents the
    window’s content, while defining the window size. This *Scene* object must be
    attached to the *Stage* object, which is also assigned a title, and finally, the
    method *show()* is performed on the object *primaryStage*, which displays the
    window on the screen.


    It is thus easy to follow what happens in the above program, but it is more difficult
    to spot the benefits. They come later, but I can immediately point out that one
    of the advantages is that the technology used to draw the window with all its
    content is extremely effective.


