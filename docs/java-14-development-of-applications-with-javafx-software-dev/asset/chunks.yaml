    There is also a layout pane, which is called `TextFlow`, and behaving in the same
    way as a `FlowPane`, but only for `Text` nodes. The program `TextflowProgram`
    shows how to use this pane. It’s probably not the most commonly used layout pane,
    but it may be useful if you need to write a custom component that supports text
    wrapping – something that is actually relatively complicated in Swing.


