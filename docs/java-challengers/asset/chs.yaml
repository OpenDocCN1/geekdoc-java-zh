- "# Java 挑战者\n\n\n\n![](img/title_page.png)\n\n![Java Challengers](img/title_page.png)\n\
  \n\n\n\n本书可在 [`leanpub.com/javachallengers`](http://leanpub.com/javachallengers)\
  \ 购买\n\n\n\n\n\n\n\n\n# 前言\n\n## James Gosling\n\n```\n// 将很快添加！\n```\n\n## Jeanne\
  \ Boyarsky\n\n2017 年，我参加了 Rafael 的 JavaOne 演讲：“学习这 10 个 Java 挑战之间的概念并消除令人压力的 Bug”。我当时的反应是：\n\
  \n这太有趣了！作为一个认证书籍的作者给了我一些优势，但有些问题仍然棘手且困难！而且用《辛普森》作为例子很有趣。他针对每个选项都让大家举手；大多数人没有为任何一个选项举手。\n\
  \n现在五年过去了。我仍然是一个认证书籍的作者，但那场演讲已经变成了一本书！书中有很多挑战，但保持了同样的趣味和风格。我很高兴《辛普森》的角色依然在场！\n\n\
  无论你是正在学习 Java 还是一个经验丰富的开发者，书中都有适合你的内容。不要让 Bug 让你措手不及。在这里学习，你就可以避免代码中的意外！\n\n并且玩得开心。我确信你会发现它……嗯，很有挑战性。\n\
  \n# 1 引言\n\nJava 是世界上最流行的编程语言之一，而且也非常强大。深入了解 Java 的开发者深受市场青睐，并能够创建高质量、易于维护的代码。Java\
  \ 并不是一门容易掌握的语言，但这本书将为想要充分利用其能力的开发者提供宝贵的指导，并作为软件工程师的参考。\n\n即使是高级开发者也可能不熟悉 Java 语言的一些关键概念，这将影响他们编写的代码质量。但仅仅读书还不足以真正掌握某项技能。开发者必须通过以某种方式将所学知识付诸实践。\n\
  \n本书总共提供了超过 70 多个 Java 代码挑战，以测试你对这些内容的理解，并真正吸收它引入的概念。你将跟上最新的 Java 版本，并从真实的项目环境中学习\
  \ Java，这样当你遇到类似的情况时，你就知道如何有效地应对。\n\n正如名称所示，`Java Challengers` 并不是一本简单的书，但它将引导你理解这些概念，并且不会留下学习学习的障碍。尽管书中介绍的主题很复杂，但概念是以实用的方式解释的，旨在促进读者的学习过程。\n\
  \n在你阅读、思考并尝试解决每个挑战后，你可以测试提供的代码，并通过通过更改代码和分析输出来运行你自己的测试。这将帮助你将书中消耗的内容联系起来。\n\n随后，你就能在日常工作中使用学到的概念了，这正是深入研究编程语言概念的全部意义。\n\
  \n为了产生高度可维护的 Java 代码，你必须使用该语言最合适的特性。这样，Bug 就很难藏身了。这增加了开发者、经理和客户对交付产品的满意度，为公司带来更多利润。大家共赢。\n\
  \n投入时间深挖 Java 语言绝对是值得的，这正是本书将提供的。那么，你还在等什么？准备好接受所有的挑战了吗？你能答对多少个？你准备好将你的 Java 技能提升全新的水平了吗？\n\
  \n## 1.2 为什么选择 Java？\n\nJava 是世界上最流行的编程语言，懂 Java 的开发者很少会失业。许多公司选择使用这种语言是为了让招聘新开发者成为一项更轻松的任务——它的流行性意味着更容易找到懂\
  \ Java 的专业人士。\n\n可靠性、成熟和健壮性是该语言的精髓，各种规模的公司都因为这些特性而选择 Java。\n\nJava 还拥有庞大的开源项目生态系统，帮助程序员进行日常开发，其中许多是免费的。\n\
  \n通过 Java，可以创建组织良好、结构化的代码，并带有可靠的单元测试，帮助开发者构建能够抵御 Bug 的健壮软件。\n\n## 1.3 这本书包含哪些概念？\n\
  \n你将学习 Java 语言的核心概念，这些概念在你的日常工作中非常有用。书中涵盖了关键概念，如`多态`、`封装`、`重载`、`继承`、`组合`、`异常`、`Optionals`、`泛型`、`并发`、`equals\
  \ and hashCode`、`集合`、`流 (streams)`、`使用 lambda 和方法引用的函数式编程`等。\n\n如果一个 Java 开发者真正理解这些概念，将产生巨大的影响，这也就是为什么在本书书中探讨了这些概念的原因。\n\
  \n## 1.4 这本书是写给谁看的？\n\n`Java Challengers` 的目标是对那些希望在日常工作中创建高质量代码的开发者。通过对核心概念的知识，你将能够利用\
  \ Java 的全部力量，并将合适的特性应用于你面临的情况。\n\n喜欢解决挑战性谜题的开发者也会喜欢这本书——挑战并不简单，但很有趣。\n\n不需要成为经验丰富的开发者也能从中获得价值。至少具备编程逻辑和算法知识的开发者应该能够理解这本书，尽管推荐熟悉对象编程。\n\
  \n### 1.4.1 这本书不是给谁看的？\n\n`Java Challengers` 涵盖了大部分认证内容，但这本书并非针对认证的。你可以将其作为辅助材料，如果你的目标是\
  \ Java 认证，可以获取额外的材料，如模拟题、教程、文章或其他书籍。实际上，混合学习来源是一个好主意，当我们阅读、倾听、观看并对学到的概念做一些事情时，对某个主题的学习效果会更好。\n\
  \n对于那些只想写`能运行的代码`而不愿深入的开发者来说，这可能不是适合他们的书。\n\n### 1.4.2 书涵盖了哪些内容？\n\n许多在实际项目中很少使用的特性未包含在书中。例如，没有讨论\
  \ `JDBC`，因为在实际项目中，你很可能会使用某种持久化框架（一组具有预定义且更简单的结构、用以辅助日常工作的库），例如 `Hibernate`、`Spring\
  \ Data` 或其他。\n\n\n\n\n相反，我们将通过一种方式探索 `Java` 的核心特性，使其能够被完全吸收并尽可能地使用。重造轮子是软件开发中发生的最糟糕的事情之一。如果你非常熟悉\
  \ `Java` 的核心功能，你就不会冒用错误功能来解决问题的风险。你将精通地使用 `Java`。\n\n## 1.5 什么是 Java 挑战？\n\nJava\
  \ 挑战（Java Challenges）是极具挑战性的代码谜题，要求你非常熟悉相关的 `Java` 概念。大多数挑战都包含 `main` 方法，你的目标是猜测运行代码时会发生什么。\n\
  \n这些 `Java` 代码挑战经过精心设计，旨在探索最重要的 `Java` 概念，这些概念将对你作为 `Java` 开发者的日常工作产生影响。其中许多挑战以知名节目和角色为特色，并且你会看到有趣的\
  \ `class/method/variable` 命名。\n\n如果你正确完成了挑战，那太棒了！但如果没做到，也不要沮丧；尝试理解原因，你最终会吸收这些概念。本书的意义在于在挑战中通过乐趣加深你对\
  \ `Java` 的理解。\n\n你还将在每个章节的末尾发现一个真实世界的挑战，这会让你更充分地准备，以便对你在实际项目中可能遇到的问题应用合适的解决方案。这些挑战也将帮助你解决面试中的问题题。\n\
  \n真实世界的挑战通常是你必须应用在本章节中学到的概念来解决常见问题的情况。许多挑战涉及现有的设计模式和单元测试，并提供解决方案以便你检查自己的代码是否正确。\n\
  \n## 1.6 关于 Java 挑战的免责声明\n\nJava 挑战的意图是测试你对书中解释的概念的理解，因此不要期望在每个挑战中看到整洁的代码。相反，将这些挑战视为在脑中固化概念并练习代码分析能力的方法。\n\
  \n你分析代码的能力越强，成为程序员的速度越快、越敏锐。这些练习将能够并赋予你使用合适的 `Java` 概念产生灵活且有意义的代码。你掌握的 `Java` 特性和概念越多，就越能高效地追踪并修复\
  \ Bug。此外，你将能够针对许多不同情况产生高度优化的解决方案。\n\n### 1.6.1 在没有类和 main 方法的情况下运行 Java \n\n从 `Java\
  \ 9` 开始，对于简单的代码测试，你不需要创建类或 `main` 方法。你可以使用命令行配合 `jshell`。当你想要快速运行某些以测试语法或代码逻辑时，它是一个强大的工具。如果你愿意，可以使用\
