  \ `NullPointerException`。它还能帮助开发者用更少的代码创建更具可读性的代码。与其使用空检查，我们不如通过使用 `Optional` 创建优雅的代码并实现更多功能。\n\
  \n根据 [Optional 类文档](https://docs.oracle.com/en/java/javase/16/docs/api/java.base/java/util/Optional.html)\n\
  \n`Optional` 主要设计用于作为方法的 `return type`，在有明确需求表示“无结果”的情况下，且使用 `null` 可能会导致错误时。\n\n\
  ## 10.1 将值封装进 Optional\n\n要将值封装进 `Optional` 中，我们可以使用静态方法 `Optional.of`：\n\n```java\n\
  1 String snakeEaterOps = \"Secret info\";\n2 System.out.println(Optional.of(snakeEaterOps).isPresent());\n\
  ```\n\n由于 `snakeEaterOps` 变量中有值，因此 `isPresent` 方法返回：\n\n`true`\n\n注意，如果向 `Optional.of`\
  \ 方法传递了 `null` 值，该方法可能会抛出 `NullPointerException`：\n\n```java\n1 String snakeEaterOps\
  \ = null;\n2 Optional<String> optSnakeEaterOps = Optional.of(snakeEaterOps);\n```\n\
  \n上述方法将抛出：\n\n```\n1 Exception in thread \"main\" java.lang.NullPointerException\n\
  2     at java.base/java.util.Objects.requireNonNull(Objects.java:208)\n```\n\n注意，`Exception`\
  \ 是在 `JDK` 代码的后续方法 `Objects.requireNonNull(Objects.java:208)` 中抛出的。这是因为 `Optional.of`\
  \ 方法对空对象进行了 `null` 检查：\n\n```java\n1 public static <T> T requireNonNull(T obj) {\n\
  2     if (obj == null)\n3         throw new NullPointerException();\n4     return\
  \ obj;\n5 }\n```\n\n因此，每当我们向 `Optional.of` 方法传递 `null` 值时，`requireNonNull` 检查就会抛出\
  \ `NullPointerException`。\n\n### 10.1.1 使用 Optional.empty\n\n为了避免向方法传递 `null`，我们有一个创建一个空\
  \ `Optional` 的选项：\n\n```java\n1 Optional<String> emptyOpt = Optional.empty();\n\
  2 System.out.println(emptyOpt);\n```\n\n它打印了：\n\n`Optional.empty`\n\n还有使用 `Optional.ofNullable`\
  \ 方法的选项，它可以在 `null` 值被封装到其中时避免出现 `NullPointerException`：\n\n```java\n1 String metalGearName\
  \ = null;\n2 Optional<String> emptyOpt = Optional.ofNullable(metalGearName);\n3\
  \ System.out.println(emptyOpt);\n```\n\n### 以上代码将打印：\n\n`Optional.empty`\n\n因此，每当你认为想要处理的值可能是\
  \ `null` 时，请使用 `Optional.ofNullable` 代替 `Optional.of`。\n\n## 10.2 isPresent 和 isEmpty\n\
  \n要检查 `Optional` 中是否存在某个值，我们可以执行以下操作：\n\n```java\n1 Optional<String> optional =\
  \ Optional.of(\"Challenger\");\n2 System.out.println(optional.isPresent());\n```\n\
  \n它打印了：\n\n`true`\n\n现在让我们看看将 `null` 封装在 `Optional.ofNullable` 中会发生什么：\n\n```java\n\
  1 Optional<String> optional = Optional.ofNullable(null);\n2 System.out.println(optional.isPresent());\n\
  ```\n\n当我们将 `null` 值封装在 `Optional.ofNullable` 方法中，`optional` 变量将封装 `Optional.empty`\
  \ 的值。因此输出将为：\n\n`false`\n\n从 Java 11 开始，我们还可以使用 `isEmpty` 方法，正如其名所示，它检查该值是否为 `Optional.empty`：\n\
  \n```java\n1 Optional<String> optional = Optional.of(\"Challenger\");\n2 System.out.println(optional.isEmpty());\n\
  ```\n\n它打印了：\n\n`false`\n\n现在让我们看看将 `null` 封装在 `Optional.ofNullable` 中会发生什么：\n\n\
  ```java\n1 Optional<String> optional = Optional.ofNullable(null);\n2 System.out.println(optional.isEmpty());\n\
  ```\n\n它打印了：\n\n`true`\n\n### 10.2.1 OfNullable Spartan Warrior 挑战\n\n接下来的 Java\
  \ 挑战将专注于我们探索的概念，例如创建性的 `Optional` 方法、`Optional.of` 和 `Optional.ofNullable`。我们还将探索\
  \ `isPresent` 和 `isEmpty` 方法。\n\n那么，运行以下代码时会发生什么？\n\n```java\n 1 import java.util.Optional;\n\
  \ 2 \n3 public class OfNullableSpartanWarriorChallenge {\n 4 \n5public static void\
  \ main(String ... doYourBest) {\n 6     boolean isWarriorPresent = getOfWarrior(\"\
  Kratos\").isPresent();\n 7 \n8     Optional<Object> spartanGhost = Optional.empty();\n\
  \ 9     Optional<String> ofNullableWarrior = getNullableWarrior();\n10     System.out.printf(\"\
  %s %s %s\", isWarriorPresent, spartanGhost, ofNullableWarrior.isEmpty());\n11 }\n\
  12 \n13   static Optional<String> getOfWarrior(String name) {\n14     return Optional.of(name);\n\
  15   }\n16 \n17   static Optional<String> getNullableWarrior() {\n18     return\
  \ Optional.ofNullable(null);\n19   }\n20 }\n```\n\nA) `true` `Optional.empty` `true`\n\
  B) `false` `null` `true`\nC) `true` `Optional.empty` `false`\n**答案是：C**\nD) `true`\
  \ `Optional.empty` `false`\nException in thread \"main\" java.lang.NullPointerException\n\
  \n**解释**：\n\n在 `main` 方法的第一行，我们将 `\"Kratos\"` 传递给 `getOfWarrior` 方法。随后，`Optional.of`\
  \ 方法返回一个包含 `\"Kratos\"` 的 Optional。结果，`isPresent` 方法将返回 `true`。\n\n随后，我们将空 `String`\
  \ 赋值给 `spartanGhost`。记住，空 `String` 与空 `Optional` 是不同的。\n\n最后，调用 `getNullableWarrior()`，它返回\
  \ `Optional.empty`，因为我们使用了 `ofNullable` 方法。\n\n因此，当打印值时：\n\n*   `isWarriorPresent`\
  \ 为 true\n*   `spartanGhost` 为 `Optional.empty`\n*   `ofNullableWarrior.isEmpty()`\
  \ 为 false\n\n\n\n\n无论我们在何时调用 `processValue` 方法，都可以执行以下操作：\n\n```java\nOptional.ofNullable(\"\
  value\").ifPresentOrElse(this::processValue,\n    () -> System.out.println(\"Process\
  \ logic when there is no value...\"));\n```\n\n观察上面的方法可以发现，我们明确地表达了在有值和无值时的两种方法流。通过这样做，我们没有在方法中隐藏功能，而是让它显式化。因此，其他程序员将能够更容易理解代码。\n\
  \n### 10.3.2 方法重载\n\n当一个方法中有多个参数，且其中一个参数可能没有值时，使用 `Optional` 参数也不是一个好主意：\n\n```java\n\
  public void saveSimpson(String parentName, Optional<Child> optChild) {\n    Child\
  \ child = optChild.orElseGet(Child::new);\n    // Apply some logic...\n    simpsonDao.save(name,\
  \ child);\n}\n```\n\n现在，假设有一个开发者在调用上述方法时，为 `Optional<Child> child` 参数传递了 `null`：\n\
  \n```java\nsaveSimpson(\"Homer\", null);\n```\n\n你可能猜到了，这会抛出一个 `NullPointerException`！因此，这完全违背了\
  \ `Optional` 类的目的。\n\n为了更好地管理这种情况，我们可以移除 `Optional` 参数并处理 `null` 值：\n\n```java\n\
  public void saveSimpson(String parentName, Child child) {\n    Child childToPersist\
  \ = child != null ? child : new Child();\n    // Apply some logic...\n    simpsonDao.save(name,\
  \ child);\n}\n```\n\n处理这种情况的另一种方法是重载 `saveSimpson` 方法：\n\n```java\npublic void saveSimpson(String\
  \ parentName) {\n    doSaveSimpson(parentName, new Child(\"No child\"));\n}\n\n\
  public void saveSimpson(String parentName, Child child) {\n    Child childToPersist\
  \ = child != null ? child : new Child(\"No child\");\n    doSaveSimpson(name, child);\n\
  }\n\nprivate void doSaveSimpson(String parentName, Child child) {\n    // Apply\
  \ some logic...\n    simpsonDao.save(name, child);\n}\n```\n\n通过遵循上述方法，我们使 API 非常清晰。因此，任何使用该\
  \ API 的人都会立即注意到只接收 `parentName` 的方法。测试这两个方法也会变得容易得多。\n\n### 10.3.3 不要将 `Optional`\
  \ 作为 `Serializable`\n\n`Optional` 对象不是 `Serializable` 的，因为它并不是设计用来用作属性。相反，`Optional`\
  \ 旨在被用作**返回类型**，以便我们可以在值存在或缺失时处理相应的操作。\n\n此外，如果我们把 `Optional` 作为 `Serializable`\
  \ 使用，我们必须对类中的每个属性值进行解箱（`unbox`）操作，这在性能上是非常昂贵的。让 `Optional` 不实现 `Serializable` 的另一个良好理由是我们可以避免以下情况：\n\
  \n`Map<Optional<List<String>>>`\n\n在实际项目中，我们到处都是数据对象，如果我们将这些类的属性声明为 `Optional`，代码将很容易变得混乱。\n\
  \n如需更多信息，可以通过以下链接查看 Brian Goetz 的笔记：\n\n[`mail.openjdk.java.net/pipermail/lambda-libs-spec-experts/2013-May/001814.html`](http://mail.openjdk.java.net/pipermail/lambda-libs-spec-experts/2013-May/001814.html)\n\
  \n### 10.3.4 使用 `isPresent` 和 `get`\n\n`get` 方法违背了 `Optional` 类的目的，因为如果值不存在，将会抛出\
  \ `NullPointerException`：\n\n```java\nString javaMascot = null;\nOptional<String>\
  \ optJavaMascot = Optional.ofNullable(javaMascot);\nString result = optJavaMascot.get();\
  \ // 这里抛出 NullPointerException\n```\n\n如你在上面的代码所示，当 `Optional` 中为 `null` 值且我们使用\
  \ `get` 方法时，将会得到 `NullPointerException`。\n\n为了避免这种情况，我们可以使用 `isPresent` 方法先检查值：\n\
  \n```java\nString javaMascot = null;\nOptional<String> optJavaMascot = Optional.ofNullable(javaMascot);\n\
  if (optJavaMascot.isPresent()) {\n    System.out.println(optJavaMascot.get());\n\
  } else {\n    System.out.println(\"No value\");\n}\n```\n\n尽管如此，上面的代码并不是最优的，它没有发挥\
  \ `Optional` 的真正收益。\n\n更好的做法是使用 `ifPresent` 方法，因为我们可以用更少且可读性更高的代码实现上述操作：\n\n```java\n\
  String javaMascot = \"Duke\";\nOptional<String> optJavaMascot = Optional.ofNullable(javaMascot);\n\
  optJavaMascot.ifPresent(System::out::println);\n```\n\n如果你需要处理值缺失的情况，可以使用 Java 9\
  \ 的方法 `ifPresentOrElse`：\n\n```java\nString javaMascot = null;\nOptional<String>\
  \ optJavaMascot = Optional.ofNullable(javaMascot);\noptJavaMascot.ifPresentOrElse(System::out::println,\
  \ () -> System.out.println(\"No value\"));\n```\n\n### 10.3.5 总结\n\n总结 `Optional`\
  \ 的核心要点：\n\n-   不要将 `Optional` 作为参数；请使用方法重载代替。\n-   不要将 `Optional` 作为 `Serializable`\
  \ 字段。\n-   避免直接使用 `get()`，因为它可能会抛出 `NullPointerException`。\n-   优先使用 `isPresent()`、`ifPresent()`\
  \ 或 `ifPresentOrElse()` 以编写更安全的代码。\n-   `Optional` 主要设计用于**返回类型**，以表示值可能缺失。\n\n\n\
  \n\n\n```\n1 public T orElseGet(Supplier<? extends T> supplier) {\n2     return\
  \ value != null ? value : supplier.get();\n3 }\n```\n\n因此，我们不仅像 `orElse` 方法那样只返回一个值，还可以使用\
  \ lambda 表达式配合逻辑：\n\n```\n 1 public class OrElseGet {\n 2 \n3     static void printYoshiFoodIfPresent()\
  \ {\n 4         Optional<String> optYoshiFood = Optional.empty();\n 5         String\
  \ yoshiFood = optYoshiFood.orElseGet\n 6              (OrElseGet::askFoodWhenNoFoodForYoshi);\n\
  \ 7         System.out.println(yoshiFood);\n 8     }\n 9 \n10     static String\
  \ askFoodWhenNoFoodForYoshi() {\n11         String noFoodForYoshi = \"No food :(\"\
  ;\n12         String askMoreForMario = \" Mario needs to get more food!\";\n13 \
  \        return noFoodForYoshi.concat(askMoreForMario);\n14     }\n15 \n16 }\n```\n\
  \n输出是：\n\nNo food :( Ask Mario for more\n\n如你在上面的代码所示，通过使用 lambda 表达式，如果我们需要，可以在\
  \ `Supplier` 中使用某些逻辑。但这并不是 `orElse` 和 `orElseGet` 方法之间的唯一区别。\n\n### 10.5.1 orElseGet\
  \ 是惰性的，而 orElse 不是\n\n`orElseGet` 方法是惰性的，因为我们使用了函数式接口 `Supplier`。因此，当 `Optional`\
  \ 对象中存在值时，`printJavaMascot` 方法将完全不会执行：\n\n```\n 1 import java.util.Optional;\n 2\
  \ \n3 class JavaMascotOrElseOrElseGet {\n 4     public static void main(String[]\
  \ args) {\n 5         Optional<String> optJavaMascot = Optional.ofNullable(\"Duke\"\
  );\n 6         optJavaMascot.orElseGet(JavaMascotOrElseOrElseGet::printJavaMascot);\n\
  \ 7     }\n 8 \n 9     static String printJavaMascot() {\n10         System.out.println(\"\
  Duke gets prepared...\");\n11         return \"Duke\";\n12     }\n13 }\n```\n\n\
  上述程序的输出将什么内容都不会打印。\n\n`orElse` 方法无论值是否存在，始终会被执行：\n\n```\n 1 import java.util.Optional;\n\
  \ 2 \n3 class JavaMascotOrElseOrElse {\n 4     public static void main(String[]\
  \ args) {\n 5         Optional<String> optJavaMascot = Optional.ofNullable(\"Duke\"\
  );\n 6         optJavaMascot.orElse(printJavaMascot());\n 7     }\n 8 \n 9     static\
  \ String printJavaMascot() {\n10         System.out.println(\"Duke gets prepared...\"\
  );\n11         return \"Duke\";\n12     }\n13 }\n```\n\n输出是：\n\nDuke gets prepared…\n\
  \n如你在上面的代码所示，即使 `Optional` 有值，`printJavaMascot` 方法也会被执行。因此，`orElse` 方法更适合于不消耗大量资源的简单操作。\n\
  \n### 10.5.2 orElse 和 orElseGet Java 挑战\n\n在接下来的挑战中，我们将探索 `orElse` 和 `orElseGet`\
  \ 方法的行为，你的目标是找出在运行 `main` 方法时该程序的输出是什么。因此，你认为以下选项中哪一个是正确的？\n\n```\n 1 import java.util.Optional;\n\
  \ 2 \n3 public class VisionFromOracleChallenge {\n 4 \n5   static String finalZionValue\
  \ = null;\n 6   static int matrixCount = 0;\n 7 \n8   public static void main(String...\
  \ matrix) {\n 9     Optional<String> optFromMatrix = Optional.ofNullable(finalZionValue);\n\
  10     var agentSmith = \"Virus\";\n11 \n12     finalZionValue = finalZionValue\
  \ + Optional.ofNullable(agentSmith).orElse(getVisi\\\n13 onFromOracle());\n14  \
  \   finalZionValue += optFromMatrix.orElseGet(VisionFromOracleChallenge::getVisionFr\\\
  \n15 omOracle);\n16 \n17     finalZionValue += matrixCount;\n18 \n19     System.out.println(finalZionValue);\n\
  20   }\n21 \n22   static String getVisionFromOracle() {\n23     matrixCount++;\n\
  24     finalZionValue += \"KeyMaker\";\n25     return \"Architect\";\n26   }\n27\
  \ }\n```\n\n1. `nullVirusArchitect1`\n2. `nullVirusKeyMakerArchitect1`\n3. `nullVirusArchitect2`\n\
  4. `nullKeyMakerVirusKeyMakerArchitect2`\n\n解释：\n\n我们采取的第一个动作是将 `finalZionValue`\
  \ 变量封装在 `optFromMatrix` 中。然后，我们将字符串 `\"Virus\"` 赋值给变量 `agentSmith`。\n\n然后，我们将拼接值为\
  \ `null` 的 `finalZionValue`并将 `agentSmith` 变量封装在 `Optional` 中。然而，请记住，即使 `Optional`\
  \ 值存在，`orElse` 方法也会被调用。\n\n## 10.6 使用 orElseThrow 处理异常\n\n有时，我们希望在接收到 `null` 时简单地抛出一个\
  \ `Exception`。为了这个目的，我们有一个 `orElseThrow` 方法，它会在值为 `null` 时抛出异常。注意 `orElseThrow`\
  \ 接收一个 `Supplier`，因此我们可以使用一个返回值的 lambda 方法。\n\n```\n1 String noBeerForHomer = null;\n\
  2 Object homer = Optional.ofNullable(noBeerForHomer)\n3     .orElseThrow(() -> new\
  \ IllegalArgumentException(\"D'oh!\"));\n```\n\n也可以为 `IllegalArgumentException`\
  \ 使用构造方法引用，因为它符合 `Supplier` 的合约。`IllegalArgumentException` 构造函数返回一个值，这正是 `Supplier`\
  \ 所需的：\n\n```\n1 Object homer = Optional.ofNullable(noBeerForHomer)\n2     .orElseThrow(IllegalArgumentException::new);\n\
  ```\n\n如上面的代码所示，使用方法引用的权衡是我们无法像使用 `lambda` 时那样传递参数。但是，如果你真的想要一个特定的 `Exception` 消息，你可以创建一个特定的\
  \ `Exception`：\n\n```java\n1 class NoBeerException extends RuntimeException {\n\
  2     public NoBeerException() {\n3       super(\"D'oh!\");\n4     }\n5 }\n```\n\
  \n现在让我们作为方法引用使用 `NoBeerException`：\n\n```java\n1 Object homer = Optional.ofNullable(noBeerForHomer)\n\
  2     .orElseThrow(NoBeerException::new);\n```\n\n### 10.6.1 Java 10 `orElseThrow()`\
  \ 方法\n\nJava 10 有一个方便的方法，在你不在意特定的 `Exception` 或 `message` 时抛出 `Exception`。当值为 `null`\
  \ 时，该方法始终抛出以下内容：\n\n`throw new NoSuchElementException(\"No value present\");`\n\n\
  让我们就使用这个方法吧：\n\n```java\n1 Object homer = Optional.ofNullable(noBeerForHomer).orElseThrow();\n\
  ```\n\n\n\n\n输出将会是：\n\n`Exception in thread \"main\" java.util.NoSuchElementException:\
  \ No value present`\n\n### 10.6.2 OrElseThrow Lol Challenge\n\n下面的 Java 挑战探索了使用\
  \ `Optional` 进行 `Exception` 处理。我们在 `catch` 子句内部使用了 `orElseThrow` 方法。因此，通过运行下面的代码，你能猜到会发生什么吗？\n\
  \n```\n 1 import java.util.Optional;\n 2 \n 3 public class OrElseThrowLolChallenge\
  \ {\n 4   \n 5   public static void main(String... doYourBest) throws Throwable\
  \ {\n 6     String finalOpt = \"finalLol\";\n 7     Optional<String> opt = null;\n\
  \ 8 \n 9     try {\n10       opt = Optional.of(null);\n11     } catch (RuntimeException\
  \ exception) {\n12       System.out.println(opt.orElseThrow(() -> new Throwable()));\
  \ // Line 12\n13     } catch (Throwable error) {\n14       finalOpt = opt.orElse(\"\
  lol\");\n15     }\n16 \n17     System.out.println(finalOpt);\n18   }\n19 \n20 }\n\
  ```\n\n1.  lol\n2.  null\n3.  第 12 行将抛出 `NullPointerException`\n4.  finalLol\n\n\
  **解释**：\n\n在 `try` 块中，我们尝试将 `null` 封装到 `Optional` 中。当我们使用 `Optional.of` 方法时，会抛出\
  \ `NullPointerException`。\n\n考虑到 `NullPointerException` 是一个 `RuntimeException`，这个\
  \ `catch` 语句将捕获该 `NullPointerException`。\n\n然后，注意我们正尝试从变量 `opt` 访问 `orElseThrow`\
  \ 方法，但 `opt` 变量从未被初始化。因此，会抛出另一个 `NullPointerException`。然而，请注意，我们没有为这行代码提供另一个 `try`。结果，`NullPointerException`\
  \ 将在第 12 行中断程序的执行。\n\n结论，正确的选项是：\n\n**C) `NullPointerException` 将在第 12 行抛出**\n\n\
  ### 10.6.3 Filtering Optional Data\n\n我们也可以对 `Optional` 中的数据进行 `filter`（过滤），然后检查其中的值。与其创建一个\
  \ `if` 来检查值是否存在，我们只需简单地使用 `filter` 方法，后跟 `isPresent` 或 `isEmpty`：\n\n```\n1 String\
  \ simpsonName = \"Homer\";\n2 Optional<String> optSimpsonName = Optional.of(simpsonName);\n\
  3 \n4 boolean isHomer = optSimpsonName.filter(s -> s == \"Homer\").isPresent();\n\
  5 System.out.println(isHomer);\n6 \n7 boolean isMarge = optSimpsonName.filter(s\
  \ -> s == \"Marge\").isEmpty();\n8 System.out.println(isMarge);\n```\n\n**它将打印**：\n\
  \n```\n1 true\n2 false\n```\n\n我们还可以使用 `Optional` 进行复杂的过滤。让我们看看没有 `Optional` 的代码示例：\n\
  \n```\n 1 public static boolean isHomerWithoutOptional(Simpson simpson) {\n 2  \
  \   boolean isHomer = false;\n 3     if (simpson != null && simpson.name.equals(\"\
  Homer\") \n 4          && simpson.age >= 34 && simpson.age <= 39) {\n 5       isHomer\
  \ = true;\n 6     }\n 7     return isHomer;\n 8   }\n 9 \n10 public static void\
  \ main(String[] args) {\n11     System.out.println(isHomer(new Simpson(\"Bart\"\
  , 10)));\n12 }\n```\n\n**输出是**：\n\nfalse\n\n如你所示，上面的代码非常冗长。通过 `Optional` 的 `map`\
  \ 和 `filter` 方法，我们可以用更代码实现相同的功能。\n\n在下面的代码中，我们首先将 `simpson` 的值封装到 `Optional` 中。然后我们过滤\
  \ `Optional` 以使其只包含 `\"Homer\"`。我们使用方法引用 `Simpson::getAge` 将 `Simpson` 映射为年龄。然后在\
  \ `filter` 方法中，我们将处理 `age`，因此我们检查 `age` 是否在 `34` 到 `39` 之间。\n\n最后，我们检查值是否存在。\n\n\
  ```\n 1  public static boolean isHomerWithOptional(Simpson simpson) {\n 2     Optional<Simpson>\
  \ optSimpson = Optional.ofNullable(simpson);\n 3 \n 4     return optSimpson.filter(s\
  \ -> s.getName().equals(\"Homer\"))\n 5         .map(Simpson::getAge)\n 6      \
  \   .filter(age -> age >= 34 && age <= 39)\n 7         .isPresent();\n 8 }\n 9 \n\
  10 public static void main(String[] args) {\n11     System.out.println(isHomerWithOptional(new\
  \ Simpson(\"Homer\", 34)));\n12     System.out.println(isHomerWithOptional(null));\n\
  13   }\n```\n\n**输出是**：\n\ntrue\n\nfalse\n\n## 10.7 Transforming Optional Data\n\
  \n当我们想要转换 `Optional` 数据时，我们想要使用 `map` 方法。否则，我们必须得使用 `get` 方法从 `Optional` 中获取值，并像下面一样通过\
  \ `null` 检查处理数据：\n\n```\n1 Optional<String> simpsonName = Optional.ofNullable(\"\
  Homer\");\n2 if (simpsonName.get() != null) {\n3     System.out.println(simpsonName.get().concat(\"\
  \ Simpson\"));\n4 } else {\n5     System.out.println(\"No Value\");\n6 }\n```\n\n\
  如你在上面的代码所示，代码看起来很冗长。现在，让我们看看如何使用 `map` 方法从 `Optional` 中拼接一个 `String`：\n\n```\n1\
  \ Optional<String> simpsonName = Optional.ofNullable(\"Homer\");\n2 String result\
  \ = simpsonName.map(s -> s.concat(\" Simpson\")).orElse(\"no value\");\n3 System.out.println(result);\n\
  ```\n\n**输出是**：\n\nHomer Simpson\n\n注意，使用 `map` 方法后代码更简洁。此外，我们使用了 `orElse` 方法，它允许我们在值为为\
  \ `null` 时返回该值或其他其他内容：\n\n```\n1 Optional<String> simpsonName = Optional.ofNullable(null);\n\
  2 String result = simpsonName.map(s -> s.concat(\" Simpson\")).orElse(\"no value\"\
  );\n3 System.out.println(result);\n```\n\n\n\n请注意，`map` 方法并不是为了处理 `Optional` 值内部的\
  \ `Optional`。请记住 `getEatenApples` 方法返回一个 `Optional`，而 `map` 方法会使用 `Optional.ofNullable`\
  \ 来封装该值。因此，我们最终得到了这个奇异的结果：`Optional[Optional[7]]`。\n\n为了获取 `getEateanApples` 的值，我们必须使用这种极其糟糕的代码：\n\
  \n```\n1 Integer eatenApples = optEatenApples.orElseThrow().orElse(0);\n2 System.out.println(eatenApples);\n\
  ```\n\n上述代码既混乱又杂乱。这是因为 `map` 方法不应该处理来自 `Optional` 内部的 `Optional` 值。\n\n### 10.7.2\
  \ 使用 flatMap 处理 Optional 嵌套 Optional\n\n幸运的是，`flatMap` 方法专门用于在在一个 `Optional` 内部包含另一个\
  \ `Optional` 时处理数据。\n\n简要查看下面的 JDK 代码，然后检查下方的解释：\n\n```\n 1 public <U> Optional<U>\
  \ flatMap(Function<? super T, ? extends Optional<? extends U>> \\\n 2 mapper) {\n\
  \ 3     Objects.requireNonNull(mapper); own 4     if (!isPresent()) {\n 5      \
  \   return empty();\n 6     } else {\n 7         @SuppressWarnings(\"unchecked\"\
  )\n 8         Optional<U> r = (Optional<U>) mapper.apply(value);\n 9         return\
  \ Objects.requireNonNull(r);\n10     }\n11 }\n```\n\n注意上述代码中的 `else` 语句。我们没有像 `map`\
  \ 方法那样将值再次封装进 `Optional` 中。相反，我们是在转换数据并返回 `Optional` 的值：\n\n`Optional<U> r = (Optional<U>)\
  \ mapper.apply(value);`\n\n下面的代码是 `flatMap` 用目的良好示例。我们有一个带有 `Optional getEatenApples`\
  \ 方法的 `Yoshi` 类：\n\n```\n1 Yoshi yoshi = new Yoshi(7);\n2 Integer eatenApples =\
  \ Optional.of(yoshi)\n3                       .flatMap(Yoshi::getEatenApples).orElse(0);\
  \   // #A            \\\n4                                   \n5 System.out.println(eatenApples);\
  \ \n```\n\n**输出结果为**:\n\nOptional[7]\n\n*   #A: 注意我们将 `yoshi` 封装进一个 `Optional` 中，然后\
  \ `getEatenApples` 也返回一个 `Optional`。因此，我们得到了所需的：一个嵌套在 `Optional` 内部的 `Optional`。然后我们可以直接操作\
  \ `getEatenApples` 的值，避免在 `yoshi` 为 `null` 时出现 `NullPointerException`。\n\n在上面的代码中，我们可以直接作为\
  \ `Optional` 返回 `getEatenApples` 的值。因此，为了获取 `getEatenApples` 的值，我们只需要为我们的 `Optional`\
  \ 使用 getter 方法：\n\n`System.out.println(eatenApples.orElse(0));`\n\n**输出结果为**:\n\n\
  7\n\n### 10.7.3 Soprano Nullable Gun 挑战\n\n这个 Java 挑战探索了使用 `Optional` 进行数据映射、过滤和条件处理。通过分析以下代码，你能猜到执行时会发生什么吗？\n\
  \n```\n 1 import java.util.Optional;\n 2 \n 3 public class SopranoNullableGunChallenge\
  \ {\n 4 \tpublic static void main(String... args) {\n 5 \t\tSoprano soprano = new\
  \ Soprano();\n 6 \n 7 \t\tOptional.of(soprano)\n 8 \t\t\t\t.map(Soprano::getName)\n\
  \ 9 \t\t\t\t.map(String::toUpperCase)\n10 \t\t\t\t.filter(n -> n.contains(\"Tony\"\
  ))\n11 \t\t\t\t.ifPresentOrElse(System.out::println,\n12 \t\t\t\t() -> System.out.println(\"\
  No value!\"));\n13 \n14 \t\tString sopranoGun = Optional.of(soprano)\n15 \t\t\t\t\
  .flatMap(Soprano::getGun)\n16 \t\t\t\t.map(String::toLowerCase)\n17 \t\t\t\t.filter(g\
  \ -> g.equals(\"Beretta\"))\n18 \t\t\t\t.or(Optional::empty)\n19 \t\t.orElse(\"\
  Colt\");\n20 \n21 \t\tSystem.out.println(sopranoGun);\n22 \t}\n23 \n24 \tstatic\
  \ class Soprano {\n25 \t\tString name = \"Tony\";\n26 \t\tString gun = \"Beretta\"\
  ;\n27 \t\tpublic String getName() { return name; }\n28 \t\tpublic Optional<String>\
  \ getGun() { return Optional.of(gun); }\n29 \t}\n30 \n31 }\n```\n\n1.  Tony\n\n\
  \    Beretta\n\n2.  No value!\n\n    Colt\n\n3.  No value!\n\n4.  Tony\n\n    Colt\n\
  \n**解释**:\n\n第一个需要注意的细节是有静态内部类 `Soprano`，它有一个指向 `String name` 的 getter，以及另一个指向 `Optional<String>\
  \ for gun` 的 getter。\n\n然后，我们将 `String name` 封装进一个 `Optional` 中：\n\n`Optional.of(soprano)`\n\
  \n我们将 `soprano` 对象映射到 `getName` 方法，这意味着我们将操作 `getName` 的值而不是 `sopranos` 的值：\n\n\
  `.map(Soprano::getName)`\n\n现在我们将 `name` 转换为 `TONY`：\n\n`.map(String::toUpperCase)`\n\
  \n现在我们过滤包含 `Tony` 的名字：\n\n`.filter(n -> n.contains(\"Tony\"))`\n\n然后我们使用 `ifPresentOrElse`\
  \ 打印结果或打印 \"No value!\"：\n\n`.ifPresentOrElse(System.out::println, () -> System.out.println(\"\
  No value!\"))`\n\n接下来定义 `sopranoGun`：\n\n`String sopranoGun = Optional.of(soprano)`\n\
  \n我们使用 `flatMap` 获取 `gun` 的 `Optional`：\n\n`.flatMap(Soprano::getGun)`\n\n然后我们将枪转换为小写：\n\
  \n`.map(String::toLowerCase)`\n\n我们过滤等于 `Beretta` 的枪：\n\n`.filter(g -> g.equals(\"\
  Beretta\"))`\n\n如果没有匹配项，我们使用 `or` 返回一个空的 `Optional`：\n\n`.or(Optional::empty)`\n\
  \n最后，我们提供 `Colt` 作为默认值：\n\n`.orElse(\"Colt\")`\n\n然后我们打印 `sopranoGun`：\n\n`System.out.println(sopranoGun);`\n\
  \n\n\n\n在接下来的代码中，我们将 `\"Apple\"` 封装在 `Optional` 中。注意，当我们使用 `flatMap` 方法时，我们会使 `Optional`\
  \ 扁平化，这意味着我们不再返回一个 `Optional` 嵌套 `Optional`，而是只返回一个值为 `\"APPLE\"` 的 `Optional`。因此，它将等于\
  \ `Optional.of(\"APPLE\")` 并将返回 `true`。\n\n```\n1  boolean isApple = Optional.of(\"\
  Apple\").flatMap(a -> Optional.of(\"APPLE\"))\n2                               \
  \  .equals(Optional.of(\"APPLE\"));\n```\n\n总结来说，正确的选项是：\n\nC) 00 false true\n\n\
  ## 10.9 总结\n\n通过阅读本章，你现在可以做到以下几：\n\n* 将一个值封装到 `Optional` 中\n* 使用 `Optional` 测试值是否存在\n\
  * 使用 `Optional` 消费一个值或获取另一个值\n* 使用 `Optional` 消费一个值或抛出 `Exception`\n* 使用 `Optional`\
  \ 避免反模式\n* 过滤 `Optional` 值\n* 转换 `Optional value`\n\n恭喜你！通过掌握 `Optional` 概念，你现在已经充分准备好创建高质量的代码并更好地处理\
  \ `NullPointerException`。现在轮到你将这些知识应用到真实项目中了！\n\n# 11 泛型与对象比较\n\n**本章涵盖**：\n\n*\
  \ 使用 `equals` 和 `hashCode` 比较对象\n* 在 Lombok 中方便地使用 `equals` 和 `hashCode`\n* 为什么使用泛型很重要\n\
  * 泛型类型推断\n* 上界和下界泛型\n* 通配符泛型\n* 总共 5 个 Java 代码挑战\n\n`Generics` 和 `Collections` 是\
  \ `Java` 中最常用的概念之一。我们通常经常需要处理数据数组。`List`、`Set` 和 `Map` 是我们日常工作中经常出现的接口。因此，理解如何有效使用使用这些\
  \ `Collections` 对于创建高质量的代码至关重要。\n\n## 11.1 使用 equals 和 hashcode 比较对象\n\n`equals`\
  \ 和 `hashCode` 是检查一个 `Object` 是否与另一个对象 `equals`（相等）的方法。在日常工作中，我们经常使用这两个方法。许多重要的核心\
  \ `Java` 类都使用了 `equals` 和 `hashcCode` 概念。\n\n`equals` 和 `hashCode` 方法在 Java 的 `Object`\
  \ 类中声明。这意味着我们创建的每个类都会继承 `equals` 和 `hashCode` 方法。然而，`Object` 类中 `equals` 和 `hashCode`\
  \ 方法的实现是非常原始的：\n\n```\n 1 public class Object { \n 2     // Other methods ...\n\
  \ 3 \n 4     @IntrinsicCandidate\n 5     public native int hashCode();\n 6 \n 7\
  \     public boolean equals(Object obj) {\n 8         return (this == obj);\n```\n\
  \n考虑到 `equals` 和 `hashCode` 方法的原始实现，当我们创建一个自定义类时，必须 `override`（重写）这些方法。否则，我们将比较对象实例而不是对象的值。\n\
  \n请记住这条黄金法则：每当你重写 `equals` 方法时，务必也重写 `hashCode` 方法。记住，`equals` 和 `hashCode` 方法必须始终在一起。\n\
  \n在接下来的代码示例中，我们将重写 `equals` 方法，将当前实例属性与传入 `equals` 方法的对象进行比较。在 `hashCode` 方法中，我们根据\
  \ `SpiderMan` 类的字段生成一个唯一的 `hashCode`：\n\n```\n 1 import java.util.List;\n 2 import\
  \ java.util.Objects;\n 3 \n 4 public class SpiderMan {\n 5 \n 6   String armorName;\n\
  \ 7   String webGadget;\n 8   List<String> skills;\n 9 \n10   @Override\n11   public\
  \ boolean equals(Object o) {           \n12     if (this == o) {               \
  \                       // #A\n13       return true;\n14     }\n15     if (o ==\
  \ null || getClass() != o.getClass()) {        // #B\n16       return false;\n17\
  \     }\n18     SpiderMan spiderMan = (SpiderMan) o;                  // #C\n19\
  \     return Objects.equals(armorName, spiderMan.armorName) && Objects\n20     \
  \    .equals(webGadget, spiderMan.webGadget) && Objects.equals(skills, spiderMan.\\\
  \n21 skills);                                        // #D\n22   }\n23 \n24   @Override\n\
  25   public int hashCode() {\n26     return Objects.hash(armorName, webGadget, skills);\
  \    // #E\n27   }\n28  \n29 }\n```\n\n* #A: 我们在 `equals` 方法中进行的第一个检查是两个对象是否指向同一个对象引用。如果为\
  \ `true`，考虑到是同一个对象，我们可以确定属性也是相同的。\n* #B: 然后我们会检查传入的对象是否为 `null`，如果是 `true`，则这些对象肯定不\
  \ `equals`。这是因为调用 `equals` 方法需要创建一个实例，否则是不可能的调用 `equals` 方法。第二个条件检查对象是否具有不同的类类型。如果其中一个条件为\
  \ `true`，则对象是不同的。\n* #C: 我们将传入的对象强制转换为 `SpiderMan`。\n* #D: 我们使用 `Objects.equals`\
  \ 比较 `armorName`、`webGadget` 和 `skills`。\n* #E: 每当你重写 `equals` 方法时，务必也重写 `hashCode`\
  \ 方法。\n\n\n\n\n| 表 1. Hashcode 比较 | |\n| 如果 `hashcode()` 比较 … | 则 … |\n| — | — |\n\
  | 返回 true | 执行 `equals()` |\n| 返回 false | 不执行 `equals()` |\n\n出于性能考虑，这一原则主要用于 `Set`\
  \ 或 `Hash` 集合（collections）。\n\n### 11.1.3 对象比较的规则\n\n当 `hashcode()` 比较返回 `false`\
  \ 时，`equals()` 方法也必须返回 `false`。如果 `hashcode` 不同，则对象一定是不相等的（equal`）。\n\n| 表 2. 使用\
  \ `hashcode()` 进行对象比较 | |\n| --- | --- |\n| 当 hashcode 比较返回 … | `equals()` 方法应该返回\
  \ … |\n| --- | --- |\n| true | true 或 false |\n| false | false |\n\n当 `equals()`\
  \ 方法返回 `true` 时，意味着对象在所有值和属性上都是相等的。在这种情况下，`hashcode` 比较也必须为 `true`。\n\n| 表 3. 使用\
  \ `equals()` 进行对象比较 | |\n| --- | --- |\n| 当 `equals()` 方法返回 … | `hashcode()` 方法应该返回\
  \ … |\n| --- | --- |\n| true | true |\n| false | true 或 false |\n\n我们也可以返回一个始终相同的常量\
  \ `int` 数字。然而，通过这样做，我们将无法获得 `hashCode` 方法带来的收益。\n\n### 11.1.4 使用 Lombok 简化 `equals`\
  \ 和 `hashCode`\n\nLombok 库极大减少了样板代码（boiler-plate code）。为了自动生成 `equals` 和 `hashCode`\
  \ 方法，如果你正在使用 `Lombok` 库，只需在你的数据对象上加上 `@EqualsAndHashCode` 注解即可如下：\n\n```\n1 @EqualsAndHashCode\n\
  2 public class SpiderMan { ... }\n```\n\n如上面的代码所示，使用 Lombok 实现 `equals` 和 `hashCode`\
  \ 方法非常简单快捷。Lombok 也非常灵活，这意味着你可以按照自己的喜好来自定义使用 `equals` 和 `hashCode` 方法的方式。\n\n###\
  \ 11.1.5 SpiderMan `equals` & `hashCode` 挑战\n\n在接下来的 Java 挑战中，我们将探索 `equals` 和 `hashCode`\
  \ 方法从根本上应该是工作的。正如之前讨论的，这些方法的目的是确保两个对象状态的相等性。我们正在创建四个对象并对其进行比较。因此，你认为输出会是什么？\n\n\
  ```\n 1 public class SpiderEqualChallenge {\n 2   static int equalsCount = 0;\n\
  \ 3   public static void main(String... doYourBest) {\n 4     System.out.println(areEquals(new\
  \ SpiderMan(\"Peter\"), new SpiderMan(\"Peter\")));\n 5     SpiderMan symbiote =\
  \ new SpiderMan(\"Symbiote\") {\n 6       public int hashCode() { return 43 + 777\
  \ + 1; }\n 7     };\n 8     System.out.println(areEquals(symbiote, new SpiderMan(\"\
  Symbiote\")));\n 9     System.out.println(equalsCount);\n10   }\n 11   static boolean\
  \ areEquals(SpiderMan spiderMan1, SpiderMan spiderMan2) {\n 12     return spiderMan1.hashCode()\
  \ == spiderMan2.hashCode()\n 13         && spiderMan1.equals(spiderMan2);\n 14 \
  \  }\n 15   static class SpiderMan {\n 16     String name;\n 17     SpiderMan(String\
  \ name) {\n 18       this.name = name;\n 19     }\n 20     public boolean equals(Object\
  \ obj) {\n 21       final var spiderMan = (SpiderMan) obj;\n 22       equalsCount++;\n\
  \ 23       return name.equals(spiderMan.name);\n 24     }\n 25     public int hashCode()\
  \ {\n 26       return (43 + 777);\n 27     }\n 28   }\n 29 }\n```\n\n1.  false\n\
  \    true\n    2\n\n2.  true\n    false\n    1\n\n3.  false\n    false\n    0\n\n\
  4.  true\n    true\n    2\n\n**解释**：\n\n注意 `areEquals` 方法在 Java 比较两个对象时执行了它应该执行的操作。首先进行\
  \ `hashCode` 比较，然后对两个对象进行 `equals` 检查。\n\n数据类 `SpiderMan` 重写了 `equals` 和 `hashCode`\
  \ 方法。\n\n另一个需要注意的重点点是静态变量 `equalsCount`，它记录了 `equals` 方法被调用的次数。\n\n然后，在 `main` 方法中，我们通过传递两个名为\
  \ `\"Peter\"` 的 `SpiderMan` 对象来调用 `areEquals` 方法。由于两个对象的值相同，`areEquals` 方法将返回 `true`。同时注意\
  \ `equalsCount` 变量增加了 `1`。\n\n在接下来的语句中，我们实例化了另一个名为 `\"Symbiote\"` 的 `SpiderMan`。然而，我们也重写了\
  \ `hashCode` 方法并传递了一个不同的值。因此，当我们调用 `areEquals` 方法时，另一个 `\"Symbiote\"` 对象的 `hashCode`\
  \ 将不同的。\n\n当 `hashCode` 与另一个对象不同时，没有必要执行 `equals` 方法。因为如果 `hashCode` 方法与另一个对象的 `hashCode`\
  \ 不同，`equals` 方法必须返回 `false`。\n\n### 11.1.6 `equals` 和 `hashCode` 的总结\n\n*   `equals`\
  \ 和 `hashCode` 方法是互为补充的。\n*   创建数据对象时，务必重写 `equals` 和 `hashCode`。\n*   如果 `hashCode`\
  \ 比较返回 `false`，则 `equals` 方法应返回 `false`。\n*   如果 `equals` 方法返回 `true`，则 `hashCode`\
  \ 方法也必须返回 `true`。\n\n## 11.2 泛型（Generics）\n\n泛型常用于 `Collection`，因为你可以控制其中操作类型。最常见的\
  \ `Collection` 类型是使用 `ArrayList` 实现的 `List`。\n\n让我们看看没有使用泛型的 `List` 代码示例：\n\n```\n\
  1 List list = new ArrayList();                          // #A\n2 list.add(\"Duke\"\
  );                                     // #B\n3 list.add(777);                 \
  \                       // #C\n4 list.add(new Object());\n5 list.add(true);\n6 \n\
  7 Integer luckyNumber = (Integer) list.get(1);          // #D\n8 System.out.println(luckyNumber);\
  \ \n```\n\n**输出**：\n\n777\n\n让我们分析代码：\n\n*   #A：我们实例化了一个没有泛型的 `List`，这意味着我们可以向其中添加任何元素类型。\n\
  *   #B：我们添加了一个 `String`。\n*   #C：我们添加了一个 `int` 数字，它会被自动装箱并包装为 `Integer` 类型。\n* \
  \  #D：我们必须将结果强制转换为 `Integer`，因为该列表不是类型安全的。\n\n\n\n\n\n# D: 当我们需要获取数组元素时，需要将类型强制转换为我们预期的类型。出现这种情况是因为编译器无法知道我们在\
  \ `List` 中插入了什么类型。在这种情况下，我们正在获取包含 `Integer` 类型数字 `777` 的第二个元素，并将其添加到列表中。\n\n向 `List`\
  \ 中添加任何类型都是不好的，因为很容易在 `List` 中产生错误的数据类型，导致调试 bug 变得非常困难。\n\n### 11.2.2 使用泛型的 `List`\n\
  \n为了避免上述代码所示的类型转换，我们可以使用泛型！幸运的是，如如下代码所示，我们可以向 `List` 接口传递一个泛型类型：\n\n`public interface\
  \ List<E> extends Collection<E> { ... }`\n\n基本上，`<E>` 是 `List` 元素的类型。因此，在使用 `List`\
  \ 时候，我们需要在实例化时传递元素的类型：\n\n```\n1 List<String> list = new ArrayList<>();        //\
  \ #A\n2 list.add(\"Duke\");                             // #B\n3 \n4 String duke\
  \ = list.get(0);                    // #C\n5 System.out.println(duke); \n```\n\n\
  **输出：**\n\nDuke\n\n*   #A: 注意现在我们正在传递泛型类型 `<String>`，因此我们只能向 `List` 中添加类型为 `String`\
  \ 的对象。\n*   #B: 我们正在向 `List` 添加一个 `String` 类型。注意，如果我们尝试添加以下代码 `list.add(777);`，代码将无法编译，因为\
  \ `List` 仅预期 `String`。\n*   #C: 最后，我们通过索引获取 `List` 的第一个元素。注意我们没有使用强制转换，因为编译器知道这个\
  \ `List` 只接受 `String` 元素。\n\n### 11.2.3 泛型不接受基本类型\n\n如果我们尝试执行以下操作：\n\n`List<int>\
  \ listOfInts = new ArrayList<>();`\n\n代码将无法编译，请注意我们只能使用类类型。另一个重要的细节是，如果我们尝试以下操作，代码将运行：\n\
  \n```\n1 int number = 7;\n2 List<Integer> list = new ArrayList<>();\n3 \n4 list.add(number);\
  \ // 这因为自动装箱概念是可行的\n```\n\n正如我们在之前的章节中看到的，Java 有自动装箱（auto-boxing）概念。因此，当我们向 `List<Integer>`\
  \ 添加一个 `int` 类型时，实际上，`int` 类型会被编译器隐式地自动装箱为 `Integer`。\n\n其他基本类型也会发生相同的情况。\n\n###\
  \ 11.2.4 不使用泛型的蜘蛛侠反派挑战\n\n我们在这个挑战中将探索不使用泛型的 `List` 的用法。\n\n你在此代码挑战中的目标是替换 `##REPLACE##`\
  \ 区域的代码，使其打印出 `\"Venom\"`。\n\n**注意，多个替代方案可能是正确的。**\n\n```\n 1 import java.util.ArrayList;\n\
  \ 2 import java.util.List;\n 3 \n4 public class CollectionWithoutGenericsChallenge\
  \ {\n 5 \n 6   public static void main(String[] args) {\n 7     List list = new\
  \ ArrayList();\n 8     list.add(\"Venom\");\n 9\n10     // ##REPLACE##\n11 \n12\
  \     System.out.println(superVillain);\n13   }\n14 \n15 }\n```\n\n17 A) `String\
  \ superVillain = list.get(0);`\n\n18 B) `Object superVillain = list.get(0);`\n\n\
  20 C) `var superVillain = list.get(0);`\n\n22 D) `String superVillain = (String)\
  \ list.get(0);`\n\n**解释：**\n\n在替代方案 `A` 中，我们不能使用代码 `String superVillain = list.get(0);`，因为我们没有使用强制转换。注意，编译器无法猜测变量类型，因为我们可以向\
  \ `list` 中放入任何内容。\n\n在替代方案 `B` 中，我们可以使用 `Object superVillain = list.get(0);`，因为我们将\
  \ `list` 的值放入 `Object` 中，因为它可以接收任何类型。\n\n在替代方案 `C` 中，我们可以使用 `var superVillain =\
  \ list.get(0);`，因为 `var` 可以存储任何类型。\n\n在替代方案 `D` 中，我们可以使用 `String superVillain =\
  \ (String) list.get(0);`，因为我们正在将类型强制转换为 `String`。\n\n因此，正确的替代方案是：\n**B) Object superVillain\
  \ = list.get(0);**\n**C) var superVillain = list.get(0);**\n**D) String superVillain\
  \ = (String) list.get(0);**\n\n### 11.3 泛型类型推断\n\n我们也有创建自己的泛型类型的可能性。当我们想要创建高度复用且对数据类型有更多控制权的代码时，可以使用泛型。\n\
  \n让我们看看在 `class` 中使用泛型的示例：\n\n```java\npublic class GenericClass<T> {          \
  \    // #A\n \n  public T doSomething(T type) {            // #B\n    System.out.println(type.getClass());\
  \    // #C\n    return type;\n  }\n \n  public static void main(String[] args) {\
  \ \n    GenericClass<StringBuilder> genericClass = new GenericClass<>();    // #D\n\
  \    genericClass.doSomething(new StringBuilder(\"Generic Builder\"));     // #E\n\
  \     \n    new GenericClass<>().doSomething(\"Generic String\");              \
  \   // #F\n    Integer genericNumber = new GenericClass<Integer>().doSomething(7);\
  \ // #G\n    System.out.println(genericNumber);    \n  }\n \n }\n```\n\n**输出：**\n\
  \nclass.lang.StringBuilder\nclass.lang.String\nclass.lang.Integer\n\n**解释：**\n\n\
  *   #A: 这是在类级别使用泛型的语法。\n*   #B: 注意我们使用 `T` 作为参数。\n*   #C: 我们打印类类型。\n*   #D: 我们带有泛型类型实例化\
  \ `GenericClass`。\n*   #E: 注意我们已经将 `StringBuilder` 类型传递给 `GenericClass`，这意味着泛型类型被设置为\
  \ `StringBuilder`。\n*   #F: 我们再次实例化 `GenericClass<>`，但现在传递了 `String`。注意默认应用的泛型类型将是\
  \ `String`。\n*   #G: 我们在实例化 `GenericClass` 时传递了 `Integer` 类型。因此，`T` 将是 `Integer`，我们不需要对此类型进行强制转换。\n\
  \n### 11.3.1 方法中的泛型类型推断\n\n如果你不想在类级别声明泛型类型，也可以直接在方法中使用它：\n\n```\npublic class GenericsMethod\
  \ {\n \n  public <T> T doSomething(T type) {            // #A\n    System.out.println(type.getClass());\
  \        \n    return type;                          \n  }\n \n  public static void\
  \ main(String[] args) {\n    GenericsMethod genericsMethod = new GenericsMethod();\n\
  \    String result = genericsMethod.doSomething(\"Generics Method\");       // #B\n\
  \    System.out.println(result);\n \n\n    result = genericsMethod.<String>doSomething(\"\
  Method with Generics\"); // #C\n    System.out.println(result);\n  }\n \n }\n```\n\
  \n**输出：**\n\nclass java.lang.String\nMethod with Generics\nclass java.lang.String\n\
  Method with Generics\n\n**解释：**\n\n*   #A: 注意我们不在类级别声明泛型类型，而是在 `public` 修饰符之后声明。因此，我们能够在方法中使用泛型类型作为参数。\n\
  *   #B: 我们将 `String` 类型传递给泛型类型 `T`。注意，由于我们在方法级别使用泛型，当我们传递一个 `String` 作为参数时，`T` 将自动推断为\
  \ `String`。\n*   #C: 我们显式指定了泛型类型 `<String>`。\n\n\n\n\n\n# #C：注意，如果我们愿意，在调用方法时也可以传递方法的泛型类型。不过这并不是必要的，因为我们作为参数传递的类型已经会被推断为该泛型类型。这样做可行，但是多余的。\n\
  \n## 11.3.2 泛型类型实例变量\n\n可以定义泛型类型的实例变量。要这样做，我们需要在实例化 `GenericInstanceVariable` 时传递泛型类型，然后在构造函数中传递值：\n\
  \n```\n 1 public class GenericInstanceVariable<T>  {               // #A\n 2 \n\
  \ 3   T t;                                                   // #B\n 4 \n 5   public\
  \ GenericInstanceVariable(T t) {                  // #C\n 6     this.t = t;\n 7\
  \   }\n 8 \n 9   public static void main(String[] args) {\n10     GenericInstanceVariable<String>\
  \ genericInstance =\n11         new GenericInstanceVariable<>(\"T type\");     \
  \    // #D\n12 \n13     String tString = genericInstance.t;                  //\
  \ #E\n14     System.out.println(tString);\n15   }\n16 \n17 }\n```\n\n**输出：**\n\n\
  T type\n\n**代码分析：**\n\n* #A：注意，我们需要在类级别声明泛型类型，以便将其作为实例变量。另一个重要点是，`T` 类型可以作为构造函数或方法的参数使用。\n\
  * #B：由于我们在类中声明了 `T` 泛型类型，我们可以将 `T` 作为实例类型。\n* #C：我们可以在这里传递泛型类型的值，然后将其赋值给实例变量。\n\
  * #D：这里重要的是，当我们使用接下来的 `<String>` 时，我们传递了泛型类型。如果我们在这里不提供类型，那么当我们只传递一个值时，`T` 类型将无法被推断。这是因为当我们在类级别声明泛型类型时，该类型对于整个类来说应该是相同的。\n\
  * #E：我们可以作为 `String` 返回 `t` 值，因为我们在泛型类型中定义了它。这是使用泛型的巨大优势之一，即在运行时定义返回类型。\n\n## 11.3.3\
  \ 神秘泛型类型推断挑战\n\n在接下来的 Java 挑战中，我们将从类、实例变量、构造函数和方法层面探索泛型。你能猜到运行 `main` 方法后会发生什么吗？\n\
  \n```\n 1 public class GenericMystiqueChallenge<T> {\n 2   T t;\n 3   public GenericMystiqueChallenge(T\
  \ t) {\n 4     this.t = t;\n 5   }\n 6   public<K> K mystiqueTransform(K k) {\n\
  \ 7     return k;\n 8   }\n 9   public <T> T mystiqueAttackPower(T t) {\n10    \
  \ return t;\n11   }\n12   public static void main(String... doYourBest) {\n13  \
  \   GenericMystiqueChallenge<String> genericMystique = new GenericMystiqueChallenge<\\\
  \n14 >(\"Raven\");\n15  \n16     String realName = genericMystique.t;          \
  \                       // #A\n17     String transformed = genericMystique.mystiqueTransform(\"\
  Wolverine\"); // #B\n18     Integer normalForm = genericMystique.mystiqueAttackPower(7);\
  \         // #C\n19 \n20     System.out.printf(\"%s %s %s\", transformed, realName,\
  \ normalForm);\n21   }\n22 \n23 }\n```\n\n1. 行 // #A 处编译错误\n2. 行 // #B 处编译错误\n3.\
  \ Wolverine Raven 7\n4. 行 // #C 处编译错误\n\n**解释：**\n\n在这个 Java 挑战中，我们在类、构造函数和方法层面探索泛型。\n\
  \n当我们实例化 `GenericMystiqueChallenge` 时，我们传递了 `<String>` 泛型类型。这样做，我们会把 `String` 类型传递给\
  \ `T`。\n\n另外注意，我们在构造函数中传递了 `\"Raven\"`。如果我们尝试在那里传递任何其他内容，将会导致编译错误，因为我们已经将 `T` 的类型定义为\
  \ `String`。\n\n因此，将 `t` 变量作为 `String` 获取是安全的，因为 `T` 泛型类型是 `String`。\n\n然后我们调用 `mystiqueTransform`\
  \ 方法并传递 `\"Wolverine\"`。注意 `mystiqueTransform` 方法接收泛型类型 `K`。由于 `K` 泛型类型是在方法级别声明的，该类型将不需要\
  \ `<>` 运算符即可被推断。因此，变量 `transformed` 将具有值 `\"Wolverine\"`。\n\n最后，注意我们正在使用泛型类型遮蔽（shadowing）。我们已经在类级别声明了\
  \ `T` 类型，但我们在 `mystiqueAttackPower` 方法签名中再次声明了它，因为我们使用了 `<T>`。\n\n结论是，正确答案是：\n\n\
  **C) Wolverine Raven 7**\n\n### 11.3.4 声明多个泛型类型\n\n我们可以声明任意数量的泛型，而且对泛型的名称没有限制。在\
  \ `JDK` 代码中有很多许多包含多个泛型类型的良好示例。让我们来看看其中一些：\n\n`public interface Map<K, V> { ... }`\n\
  \n```\n1 public class HashMap<K,V> extends AbstractMap<K,V>\n```\n\n## 11.4 上界和下界泛型\n\
  \n为了限制泛型的使用，我们可以定义它应该扩展（extends）的什么类型，这被称为上界泛型（upper bounds generics）。要限制泛型到父类型，我们使用下界泛型（lower\
  \ bound generics）。\n\n在下面的代码中，让我们来看一个定义泛型 `T` 扩展 `String` 的示例：\n\n```\n1 public\
  \ class UpperBoundGenerics {\n 2 \n3   public static void main(String[] args) {\n\
  4     String upperBound = concatString(\"upperBound\");\n5     System.out.println(upperBound);\n\
  6   }\n 7 \n8   static <T extends String> String concatString(T t) {   // #A\n9\
  \     return t.concat(\"Generics\");                         // #B\n10   }\n11 \n\
  12 }\n```\n\n**输出：**\n\nGeneric\n\n**代码分析：**\n\n* #A：注意上界泛型的语法。我们将 `T` 声明为泛型类型并扩展\
  \ `String`。这意味着我们可以接收任何是 String 或扩展 String 的类型。\n* #B：另一个重要点是，我们使用了 `String` 类特定的\
  \ `concat` 方法。之所以可行是因为我们显式告诉编译器 `T` 扩展 `String`，因此 `t` 上会有 `concat` 方法。\n\n### 11.4.1\
  \ 无界通配符\n\n当我们不需要存储或推断泛型类型时，可以使用带有 `?` 的无界通配符。\n\n无界通配符对于创建灵活、健壮的 API 非常有用，如果你注意到，JDK\
  \ 代码中有大量的示例。让我们检查 `nio` 包中的 `Files` 类：\n\n```\n1 public static Path walkFileTree(Path\
  \ start, FileVisitor<? super Path> visitor){... }\n2 \n3 public static Path write(Path\
  \ path, Iterable<? extends CharSequence> lines,\n4                             \
  \ Charset cs, OpenOption... options)\n```\n\n\n因此，如果你想创建强大且健壮的 API，无界泛型（unbounded\
  \ generics）将为你大大帮助。\n\n当我们使用 `?` 时，可以使用上界或下界泛型类型。\n\n让我们通过下面的代码看看无界类型、下界泛型和上界泛型是如何工作的：\n\
  \n**无界类型**：我们可以传递一个任何类型的列表。`?` 会在运行时被擦除，并被我们传递的类型所替换：\n\n```\n1 List<?> stringList\
  \ = new ArrayList<String>();\n2 List<?> exceptionList = new ArrayList<Exception>();\n\
  3 List<?> booleanList = new ArrayList<Boolean>();\n4 List<?> consumerList = new\
  \ ArrayList<Consumer>();\n```\n\n**下界泛型**：我们可以传递一个为 `Double` 或 `Double` 的任何 `super`\
  \ 类型的列表：\n\n```\n1 List<? super Double> doubleList = new ArrayList<Double>();\n\
  2 List<? super Double> numberList = new ArrayList<Number>();\n```\n\n**上界泛型**：我们可以传递一个为\
  \ `Number` 或 `Number` 的任何子类型的列表：\n\n```\n1 List<? extends Number> numberList = new\
  \ new ArrayList<Number>(); \n2 List<? extends Number> doubleList = new ArrayList<Double>();\n\
  ```\n\n### 11.4.2 通配符下界泛型\n\n当我们将数据作为**输出**时，下界泛型类型更合适，这意味着数据将以某种方式由方法返回。\n\n如果我们想传递一个作为另一个类型的父类（super\
  \ type）的泛型类型，可以使用下面的代码：\n\n```\n 1 import java.util.ArrayList;\n 2 import java.util.List;\n\
  \ 3 \n 4 public class LowerUnboundedGenerics {\n 5   public static void main(String[]\
  \ args) {\n 6     List<Number> numbers = new ArrayList<>();\n 7     numbers.add(7.0);\n\
  \ 8     numbers.add(3.0);\n 9     List<? super Double> result = addNumbers(numbers);\n\
  10     System.out.println(result);\n11   }\n12 \n13   static List<? super Double>\
  \ addNumbers(List<? super Double> numbers) { // #A\n14     numbers.add(1.0);   \
  \                                                 // #B\n15     return numbers;\n\
  16   }\n17 }\n```\n\n**输出**:：\n\n[7.0, 3.0, 1.0]\n\n**代码分析**:\n\n* #A: 注意，只有在使用无界通配符时才能使用下界泛型类型。因此，我们不能声明无界泛型类型，只能将其作为类型传递给已存在的泛型类型。\n\
  \n* #B: 另一个重要点是，我们可以向列表添加一个 `Double` 类型。我们不能向此泛型类型中添加 `Integer`、`Float` 或任何其他类型。\n\
  \n### 11.4.3 上界和下界泛型战神挑战\n\n这是一个关于上界和下界泛型的 Java 代码挑战。\n\n你的目标是用其中一个代码替代方案替换 `##REPLACE##`，使得代码能够编译并打印出\
  \ `\"Everything went fine!\"`。\n\n哪些替代方案是正确的？**注意：可能有多个方案是正确的**。\n\n```\n 1 public\
  \ class UpperLowerBoundGenericChallenge {\n 2 \t\n 3 \t\tinterface Zeus {}\n 4 \t\
  \tinterface Kratos extends Zeus { }\n 5 \t\tinterface Atreus extends Kratos { }\n\
  \ 6 \t\tstatic class Warrior<T> {}\n 7 \n 8 \t\tpublic static void main(String ...\
  \ doYourBest) {\n 9 \t\t\tWarrior<Kratos> kratos = new Warrior<>();\n10 \t\t\tWarrior<Zeus>\
  \ zeus = new Warrior<>();\n11 \t\t\tWarrior<Atreus> atreus = new Warrior<>();\n\
  12 \n13             // ##REPLACE##\n14 \n15 \t\t\tSystem.out.println(\"Everything\
  \ went fine!\");\n16 \t\t}\n17 \n18 \tstatic void fight(Warrior<? extends Zeus>\
  \ warrior1, Warrior<? super Kratos> warrior\\\n19 2) {}\n20 \n21 }\n```\n\n1. `fight(kratos,\
  \ zeus);`\n\n2. `fight(atreus, new Warrior<>());`\n\n3. `fight(kratos, atreus);`\n\
  \n4. `fight(zeus, kratos);`\n\n**解释**:\n\n替代方案 `A` 中的代码可以正常编译，因为 `kratos` 扩展了 `Zeus`，而\
  \ `zeus` 是 `kratos` 的父类。\n\n替代方案 `B` 中的代码也可以正常编译，因为 `atreus` 扩展了 `zeus`，且 `new Warrior<>()`\
  \ 会推导出泛型类型为 `Kratos`。\n\n替代方案 `C` 无法编译，因为第二个参数 `atreus` 不是 `Kratos` 的父类。\n\n替代方案\
  \ `D` 代码运行正常，因为我们在通配符中看到的无论是 `extends` 还是 `super` 类型始终总是有效的。例如，在第一个战士中我们使用 `<? extends\
  \ Zeus>`，因此 `zeus` 是有效的。对于 `Warrior<? super Kratos>`，`kratos` 也是有效的。\n\n综上，正确的替代方案是：\n\
  \n**A) `fight(kratos, zeus);`**\n\n**B) `fight(atreus, new Warrior<>());`**\n\n\
  **D) `fight(zeus, kratos);`**\n\n### 11.4.4 上界泛型\n\n上界泛型与下界泛型完全相反。当我们使用数据作为**输入**时，上界泛型更合适，这意味着数据将以某种方式被方法接收。\n\
  \n如果我们想传递一个作为另一个类型的子类的泛型类型，可以使用下面的代码：\n\n```\n 1 import java.util.ArrayList;\n 2\
  \ import java.util.List;\n 3 \n 4 public class UpperBoundsGenerics {\n 5   public\
  \ static void main(String[] args) {\n 6     List<Number> numbers = new ArrayList<>();\n\
  \ 7     numbers.add(7.0);\n 8     numbers.add(3.0);\n 9     List<? extends Number>\
  \ result = processNumbers(numbers);\n10    System.out.println(result);\n11  }\n\
  12 \n13   static void processNumbers(List<? extends Number> numbers) { // #A\n14\
  \     for (Number n : numbers) { // #B\n15 }\n16   }\n17 }\n```\n\n* #A: 注意，只有在使用界通配符时才能使用上界泛型类型。因此，我们不能声明上界泛型类型，只能将其作为类型传递给已存在的泛型类型。\n\
  \n* #B: 另一个重要点是，我们可以遍历列表中的 `Number` 类型。我们不能向此泛型类型中添加 `Integer`、`Float` 或任何其他类型。\n\
  \n### 11.4.5 泛型中的多态\n\n如果你尝试这样做：\n\n`List<Number> list = new ArrayList<Integer>();`\n\
  \n代码将无法编译，因为我们无法在泛型中使用多态。为了修复上面的代码，我们必须使用：\n\n`List<Number> list = new ArrayList<>();`\n\
  \n尽管我们可以使用上界泛型来模拟多态的效果。我们可以创建一个接收 `List<? extends Number>` 的方法：\n\n```\n 1 import\
  \ java.util.ArrayList;\n 2 import java.util.List;\n 3 \n 4 public class NoPolymorphismGenerics\
  \ {\n 5   public static void main(String[] args) {\n 6     List<Integer> intNumbers\
  \ = new ArrayList<>();                  \n 7     intNumbers.add(7);\n 8     printNumbers(intNumbers);\n\
  \ 9   }\n10   \n11   public static void printNumbers(List<? extends Number> numbers)\
  \ { // #A\n12     numbers.forEach(System.out::println);                        \
  \   // #B\n13   }\n14 }\n```\n\n* #A: 我们在这里使用了通配符 `?`，这允许我们传递泛型类型为 `Number` 的列表。\n\
  \n* #B: 我们遍历 `Number` 列表并打印元素。\n\n另一种使用多态的方法是逐个添加元素。如果我们创建一个 `List<Number>` 并添加\
  \ `Integer`、`BigDecimal`、`Long`，代码将能够工作：\n\n```\n1   List<Number> numbers = new\
  \ ArrayList<>();   \n2   numbers.add(Integer.valueOf(\"7\"));          \n3   numbers.add(BigDecimal.TEN);\n\
  4   numbers.add(Long.valueOf(\"7\"));\n5   numbers.add(Double.valueOf(\"7\"));\n\
  ```\n\n注意我们可以在元素级别可以使用多态。这就是为什么我们可以向 `List` 添加任何 `Number`。但是，如果我们想像上一个例子那样在集合级别使用多态，就必须使用边界泛型。\n\
  \n### 11.4.6 上界与无界 MiniMog 泛型挑战\n\n是时候巩固边界通配符泛型的概念了！在下面的代码挑战中，`addInto` 方法将被多次调用，并传入带有不同泛型类型的\
  \ `List`。\n\n运行以下代码时会发生什么？\n\n\n\n\n\n```java\n 1 import java.math.BigDecimal;\n\
  \ 2 import java.util.ArrayList;\n 3 import java.util.List;\n 4 \n5 public class\
  \ MiniMogWildcardChallenge {\n 6     public static void main(String... doYourBest)\
  \ {\n 7         List<Integer> miniMogHitDamage;\n 8 \n 9         List<Integer> intDamage\
  \ = new ArrayList<>();\n10         intDamage.add(10);\n11         miniMogHitDamage\
  \ = addInto(intDamage);               // #A\n12 \n13         List<Long> longDamage\
  \ = new ArrayList<>();\n14         miniMogHitDamage.addAll(addInto(longDamage));\
  \        // #B\n15 \n16         List<BigDecimal> bigDecimalDamage = new ArrayList<>();\n\
  17         bigDecimalDamage.add(BigDecimal.ZERO);\n18         miniMogHitDamage.addAll(addInto(bigDecimalDamage));\n\
  19 \n20         miniMogHitDamage.forEach(System.out::println);       // #C\n21 \
  \    }\n22     static List addInto(List<? extends Number> list) {\n23         List<Number>\
  \ resultList = new ArrayList<>();\n24         resultList.addAll(list);         \
  \             \n25         return resultList;\n26     }\n27 }\n```\n\n1. `Exception\
  \ in thread “main” java.lang.ClassCastException: class java.math.Integer cannot\
  \ be cast to class java.lang.Number` 位于行 // #A\n\n2. 10\n\n   `Exception in thread\
  \ “main” java.lang.ClassCastException: class java.math.Long cannot be cast to class\
  \ java.lang.Integer` 位于行 // #B\n\n3. 10\n\n   0\n\n4. 10\n\n   `Exception in thread\
  \ “main” java.lang.ClassCastException: class java.math.BigDecimal cannot be cast\
  \ to class java.lang.Integer` 位于行 // #C\n\n### 解释\n\n我们首先带有 `intDamage` Integer\
  \ 列表调用 `addInto` 方法。然后，我们将所有的 `Integer` 元素添加到 `resultList` 中。这是可以运行的，因为 `Integer`\
  \ 继承了 `Number`。\n\n接着，我们再次带有 `longDamage` 列表调用 `addInto` 方法。它再次正常工作，因为 `Long` 也继承了\
  \ `Number`。\n\n我们最后一次带有 `bigDecimalDamage` 列表调用 `addInto` 方法。它也正常工作，因为 `BigDecimal`\
  \ 继承了 `Number`。\n\n最后，我们尝试遍历这个 `List<Integer>`，但出现了问题，我们向其中添加了 `Integer` 和 `BigDecimal`\
  \ 元素。因此，当我们尝试遍历此数组的元素时，将得到一个 `ClassCastException`，因为我们不能在 `Integer` 列表中使用 `BigDecimal`\
  \ 类型。\n\n结论，最终答案是：\n\n4. 10\n\n   `Exception in thread “main” java.lang.ClassCastException:\
  \ class java.math.BigDecimal cannot be cast to class java.lang.Integer` 位于行 // #C\n\
  \n## 11.5 总结\n\n泛型将帮助你更好地理解 `Java` API，并在需要时帮助你设计更好的 `APIs`。\n\n在本章中，你学习了：\n\n*\
  \ 它使泛型对象具有强类型，避免了类型转换。\n* 它通常用于构建健壮且灵活的 API。\n* 它组织代码的方式，使得 `Collection` 的对象类型在运行时是可靠的。\n\
  * 它被广泛用于 JDK 代码，你将在 `Collection` api、函数式接口、`Comparable` 接口等处看到泛型。\n* 泛型可以在类、变量、构造函数或方法级别使用。\n\
  * 泛型类型可以在类、构造函数、方法或实例变量级别声明。\n* 只有对象可以传递给泛型，不允许原始变量。\n\n# 12 Collections\n\n本章涵盖了：\n\
  \n* `List` 的常见用途\n* `List` 的实现，如 `ArrayList`、`LinkedList` 和 `Vector`\n* 使用 `Collections`\
  \ 在 `List` 中查找和排序元素\n* 使用 `Queue`、`Stack`、`Deque`、`ArrayDeque`\n* 使用 `CopyOnWriteArrayList`\
  \ 避免 `ConcurrentModificationException`\n* 使用 `Set` 使用唯一元素\n* `Set` 的实现，如 `HashSet`、`TreeSet`\
  \ 和 `LinkedHashSet`\n* 使用 `Map` 使用键值对数据\n* 使用 `HashMap`、`LinkedHashMap`、`Hashtable`、`TreeMap`\
  \ 和 `ConcurrentHashMap`\n* 在数组中搜索元素\n* 总共 **8 个 Java 代码挑战**\n\n## 12.1 Collections\
  \ API\n\n在接下来的章节中，我们将探索最常用的 `Collections` api。\n\n我们将探索 `List`、`Set`、`Queue`、`Deque`\
  \ 及其实现。为了让你对它们有一个宏观视图，请查看下图：\n\n![](img/collections_api_diagram.png)\n\n图 11.1 Collections\
  \ API 图表\n\n现在你已经对 `Collections` api 有了初步了解，让我们更深入地探索它们的概念，当然还会做一些 `Java` 代码挑战！\n\
  \n## 12.2 List\n\n`List` 接口是 Java 开发者日常工作中最常用的 `Collection` 接口。正如名称所示，我们可以在列表中添加许多元素，可以通过索引快速访问元素，并且元素按照插入的顺序排列。\n\
  \n注意，我们在这里还将使用 `ArrayList` 作为 `List` 的实现。\n\n让我们看下面的代码：\n\n```java\n1 import java.util.ArrayList;\n\
  2 import java.util.List;\n3 \n4 List<String> heroes = new ArrayList<>();       \
  \  // #A\n5 heroes.add(\"Batman\");                            // #B\n6 heroes.add(\"\
  Spider-Man\");\n7 heroes.add(\"Iron Man\");\n8 \n9 System.out.println(heroes); \
  \                     // #C\n```\n\n**输出**:\n```\n[Batman, Spider-Man, Iron Man]\n\
  ```\n\n**代码分析**：\n\n* #A: 我们正在实例化 `List`。\n* #B: 我们正在添加元素。\n* #C: 我们正在打印列表。\n\n\
  ### 12.2.1 使用索引遍历列表\n\n`list` 的最大优势之一是通过可以通过索引访问元素。因此，让我们看看如何创建一个访问索引的 `for` 循环：\n\
  \n```java\n1 for (int i = 0; i < heroes.size(); i++)       // #A\n2 System.out.println(heroes.get(i));\
  \              // #B\n```\n\n**输出**:\n\n```\nBatman\nSpider-Man\nIron Man\n```\n\
  \n**代码分析**：\n\n* #A: 我们创建了一个 `for` 循环，一直迭代到 `list` 的大小并不断增加变量 `i`。\n* #B: 然后通过索引获取每个元素。\n\
  \n### 12.2.2 使用 Iterator 遍历列表\n\n使用 `Iterator` 遍历 `List` 元素相当繁琐。然而，当我们需要使用 `while`\
  \ 循环询问是否存在下一个元素时，使用 `Iterator` 可能会很有用`Iterator`\n\n让我们来看 `Iterator` 的示例：\n\n```java\n\
  1 // 用于遍历列表的迭代器\n2 Iterator iterator = heroes.iterator();            // #A\n3 \n\
  4 验证迭代器是否存在下一个元素\n5 while (iterator.hasNext())                       // #B\n6  \
  \   System.out.print(iterator.next() + \" \");      // #C\n```\n\n**输出**:\n\n```\n\
  Batman Spider-Man Iron Man \n```\n\n**代码分析**：\n\n* #A: 注意 `List` 有 `iterator` 方法，它返回一个可以遍历\
  \ `list` 的 `iterator` 对象。\n* #B: 我们使用 `while` 循环。\n* #C: 我们打印下一个元素。\n\n\n\n\n\n\
  - **B**: 之后我们将 `iterator` 放入一个 `while` 循环中，并调用 `hasNext()` 来检查是否有下一个元素。\n- **C**:\
  \ 最后，我们使用 `next` 方法，它将有效地获取 `list` 元素，并将指针传递到下一个元素。\n\n### 12.2.3 使用 `forEach` 遍历列表\n\
  \n为了实现上述相同的操作，我们可以使用 `forEach` 或**增强型循环**（enhanced looping）概念。这种循环在字面上的与 `Iterator`\
  \ 的操作相同，但这些操作会在后台自动完成。\n\n当我们反编译代码时，可以看到它执行的操作与上述相同：\n\n```\n1 Iterator var2 = heroes.iterator();\n\
  2 \n3 while(var2.hasNext()) {\n4     String hero = (String)var2.next();\n5     System.out.print(hero\
  \ + \" \");\n6 }\n```\n\n因此，如果你不需要 `Iterator` 类提供的任何特定功能，你可以使用 `forEach` 语句来代替它。\n\
  \n让我们看看它是如何工作的：\n\n```\n1 // 省略了蝙蝠、蜘蛛侠和钢铁人的导入和列表添加\n2 for (String hero : heroes)\
  \ System.out.print(hero + \" \"); // #A\n```\n\n**输出：**\n\nBatman Spider-Man Iron\
  \ Man\n\n**代码分析：**\n\n- **A**: 它从 heroes 中检索 `String` 并将每一个放入 `String` 变量中。\n\n\
  ### 12.2.4 使用 lambda 遍历列表\n\n为了用更少的代码遍历元素，我们还可以使用 `lambda` 表达式。在 Java 8 中，`forEach`\
  \ 方法被作为默认方法添加到 `List` 接口中，如下代码所示：\n\n```\n1 default void forEach(Consumer<? super\
  \ T> action) {\n2     Objects.requireNonNull(action);\n3     for (T t : this) {\n\
  4         action.accept(t);\n5     }\n6 }\n```\n\n注意我们在 `forEach` 方法中接收了一个 `Consumer`。因此，如果我们想使用\
  \ lambda 打印所有元素，可以如下操作：\n\n```\n1 // 省略了蝙蝠、蜘蛛侠和钢铁人的导入和列表添加\n2 list.forEach(e ->\
  \ System.out.println(e));\n```\n\n**输出：**\n\nBatman\n\nSpider-Man\n\nIron Man\n\n\
  为了让上面的代码更完美，我们可以使用方法引用来打印 `list` 中的元素：\n\n`list.forEach(System.out::println); //\
  \ 输出将与上面相同`\n\n### 12.2.5 从列表中移除元素\n\n如果我们想删除一个元素，可以使用以下代码：\n\n```\n1 heroes.remove(0);\
  \          // #A 按索引\n2 heroes.remove(\"Iron Man\"); // #B 按对象\n3 System.out.println(heroes);\n\
  ```\n\n**输出：**\n\n[Spider-Man]\n\n**代码分析：**\n\n- **A**: 我们通过索引删除元素。因此，在那种情况下，我们删除了第一个元素\
  \ `Batman`。\n- **B**: 我们通过对象值删除元素。这意味着我们将删除 `\"Iron Man\"`，即最后一个最后一个元素。\n\n### 12.2.6\
  \ 修改列表中的元素\n\n我们也可以通过以下代码更改元素值：\n\n```\n1 heroes.set(0, \"Wolverine\"); // #A\n\
  2 System.out.println(heroes);\n```\n\n**输出：**\n\nWolverine\n\n**代码分析：**\n\n- **A**:\
  \ 它更改了位于我们传递的索引处的元素。在这种情况下，索引 `0` 的元素从 `Spider-Man` 更改为了 `Wolverine`。\n\n### 12.2.7\
  \ `Collection` 的重要方法\n\n让我们详细查看 `List` 和 `Collection` 接口中最常用的方法：\n\n**Collection：**\n\
  \n- `boolean add(E e)`: 向 `Collection` 添加一个元素\n- `boolean remove(Object o)`: 从 `Collection`\
  \ 中移除一个对象\n- `boolean contains(Object o)`: 检查集合是否包含某个元素\n- `default boolean removeIf(Predicate<?\
  \ super E> filter) { ... }`: 根据我们在 `Predicate` 泛式接口中传递的条件来移除元素\n- `default Stream<E>\
  \ stream()`: 可以使用顺序流 `stream` 来操作 `collection` 中的元素。`stream` 概念非常广泛，将在下一章中进行更详细介绍\n\
  \n### 12.2.8 `List` 的重要方法\n\n**List：**\n\n- `void add(int index, E element)`: 根据传递的索引添加元素\n\
  - `E get(int index)`: 根据索引检索元素\n- `boolean isEmpty();`: 验证列表是否为空\n- `<T> T[] toArray(T[]\
  \ a)`: 将列表转换为数组\n- `boolean containsAll(Collection<?> c)`: 检查 `Collection` 中的元素是否都在列表中\n\
  - `boolean addAll(Collection<? extends E> c)`: 将另一个 `collection` 中的所有元素添加到 `list`\
  \ 中\n- `void clear();`: 清空列表，移除所有元素\n- `int indexOf(Object o)`: 获取列表中某个对象的索引\n-\
  \ `int lastIndexOf(Object o)`: 获取对象的最后一个索引。如果列表中有多个相同的对象，将检索最后一个索引。\n- `static <E>\
  \ List<E> of(E... elements)`: 创建一个包含多个元素的不可变列表。该方法是后来的。\n\n\n\n\n当我们尝试向 `heroes`\
  \ 列表添加 `\"Robin\"` 时，我们将得到以下异常 `Exception`：\n\n`Exception in thread \"main\" java.lang.UnsupportedOperationException`\n\
  \n因此，每当我们有一个不可变的 `Collection` 时，我们就无法以任何方式添加、删除或更改 `list` 对象。如果我们真的需要更改数据，我们需要创建另一个\
  \ `ArrayList` 对象：\n\n```\n1 List<String> heroes = List.of(\"Batman\", \"Super Man\"\
  , \"Wonder Woman\");\n2 \n3 heroes = new ArrayList<>(heroes);\n4 heroes.add(\"Robin\"\
  );\n5 heroes.forEach(System.out::println);\n```\n\n### 12.3.4 Arrays.asList\n\n\
  `Arrays.asList` 方法与 `List.of` 方法相似，并且具有相同的行为。它会向其中添加元素并返回一个不可变的 `List`。\n\n让我们来看下面的代码示例：\n\
  \n```\n1 List<String> otherHeroes = Arrays.asList(\"Batman\", \"Super Man\", \"\
  Wonder Woman\");\n2 otherHeroes.add(\"Robin\");\n```\n\n我们将从 `List.of` 方法得到相同的 `Exception`：\n\
  \n`Exception in thread \"main\" java.lang.UnsupportedOperationException`\n\n###\
  \ 12.3.5 Collections.unmodifiableList\n\n在真实的 `Java` 项目中，通常会看到数据对象中的 `lists` 以不可变列表的形式。这是非常有用的，因为可以防止程序员在不合适的情况下更改数据。\n\
  \n让我们来看一个代码示例：\n\n```\n 1 import java.util.ArrayList;\n 2 import java.util.Collections;\n\
  \ 3 import java.util.List;\n 4 \n5 public class UnmodifiableList {\n 6   private\
  \ static List<String> villains = new ArrayList<>();\n 7   public static void main(String[]\
  \ args) {\n 8     villains.add(\"Magneto\");\n 9     villains.add(\"Venom\");\n\
  10     villains.add(\"Dr. Octopus\");\n11     \n12     villains = getUnmodifiableVillains();\
  \              \n13     villains.add(\"Carnage\");                            //\
  \ #B\n14   }\n15 \n16   public static List<String> getUnmodifiableVillains() {\n\
  \ 17     return Collections.unmodifiableList(villains);      // #A\n18   }\n19 }\n\
  ```\n\n*   #A: 我们使用 `Collections.unmodifiableList` 方法，它将返回一个不可变列表。注意我们将列表作为参数传递。。\n\
  *   #B: 当我们尝试向列表添加元素时，将得到以下异常 Exception：\n\n`Exception in thread \"main\" java.lang.UnsupportedOperationException`\n\
  \n当我们与不可变列表工作时，我们无法添加或删除元素。\n\n### 12.3.6 List.of Java Challenge\n\n在下面的 Java Challenge\
  \ 中，你将看到在 `Java 9` 中引入的 `List.of` 方法。通过该方法，只需要一行就可以向列表中添加许多元素。你知道运行以下代码后会发生什么吗？\n\
  \n```\n 1 import java.util.List;\n 2 \n 3 public class ListChallenge {\n 4  \n 5\
  \     public static void main(final String... doYourBest) {\n 6         final List<String>\
  \ soldiers = List.of(\"Tyrion\", \"Arya\", \"John\");\n 7  \n 8         if (soldiers.size()\
  \ > 3) {\n 9             soldiers.add(\"Cersei\");\n10         } else {\n 11   \
  \          soldiers.add(\"Bran\");\n 12         }\n 13  \n 14         System.out.println(soldiers);\n\
  \ 15     }\n 16  \n17 }\n```\n\n1. `[Tyrion, Arya, John, Bran]`\n2. `[Tyrion, Arya,\
  \ John, Cersei]`\n3. `java.lang.UnsupportedOperationException will thrown`\n4. `[Tyrion,\
  \ Arya, John]`\n\n`List.of` 方法中有一个关键概念，即不可变性。这意味着当我们使用 `List.of()` 方法时，不能从列表中添加、更改或删除任何元素。不可变对象使得代码更可靠，并且不容易受到\
  \ bug 的影响。\n\n因此，在 if 语句中，我们检查列表是否多于三个元素，结果为假（false）。然后将执行 else 语句：\n\n`soldiers.add(“Bran”);`\n\
  \n然而然而，由于我们正尝试向一个不可变列表添加元素，将抛出以下异常：\n\n`java.lang.UnsupportedOperationException`\n\
  \n结论，正确的选项是：\n\n`C) java.lang.UnsupportedOperationException will thrown`\n\n## 12.4\
  \ Vector\n\n`Vector` 类与 `ArrayList` 非常相似，不同之处它是线程安全的。如果你在多线程环境中工作，并且不希望数据与其他线程进程发生冲突，那么\
  \ `Vector` 可以是一个更好的选择。\n\n由于 `Vector` 是同步的，它的性能也低于 `ArrayList`。`Vector` 也实现了 `List`，这意味着我们可以像使用\
  \ `ArrayList` 一样使用多态性。\n\n让我们来看一个 `Vector` 的代码示例：\n\n```\n 1 import java.util.List;\n\
  \ 2 import java.util.Vector;\n 3 \n 4 public class VectorExample {\n 5   public\
  \ static void main(String[] args) {\n 6     List<String> vector = new Vector<>();\
  \                 // #A\n 7     vector.add(\"Batman\");\n 8     vector.add(\"Super\
  \ Man\");\n 9     vector.add(\"Wonder Woman\");\n10     \n11     if (vector.size()\
  \ > 3) {\n12         vector.add(\"Cersei\");\n13         } else {\n14         vector.add(\"\
  Bran\");\n15     }\n16     \n17     System.out.println(vector);\n18   }\n19 }\n\
  ```\n\n\n\n你可以使用 `Deque` 接口中上述的所有方法来保持与 `Stack` 的后兼容，但建议使用 `Deque` 中较新的方法。\n\n###\
  \ 12.5.2 Queue & ArrayDeque\n\n在操作 `Deque` 时，我们可以使用 `Queue` 的所有方法。然而，如果我们的意图仅使用\
  \ `Queue` 的功能，最好通过用 `Queue` 声明我们的列表来使其显式化。\n\n如果我们把 `Queue` 比作银行里排队的人，它就很容易理解。第一个被接待的人将第一个离开。它遵循\
  \ FIFO（先入先出）原则，如下图所示：\n\n______\n\n\U0001F629 \U0001F611 \U0001F610 | 银行 |\n\n/|\\\
  \ /|\\ /|\\ | |\n\n/ \\ / \\ / \\ | |\n\n↑\n\n**先入 (First-in)**\n\n______\n\n\U0001F629\
  \ \U0001F610 | 银行 |\n\n/|\\ /|\\ | |\n\n/ \\ / \\ | |\n\n\U0001F600\n\n/|\\\n\n\
  / \\\n\n↑\n\n**后出 (First-out)**\n\n现在你已经理解了 `queue` 的原理，让我们来看下使用 `ArrayDeque` 实现的代码示例。`ArrayDeque`\
  \ 不是线程安全的，而且在使用 `queue` 功能时比 `LinkedList` 更快：\n\n```\n 1 import java.util.ArrayDeque;\n\
  \ 2 import java.util.Queue;\n 3 \n 4 public class QueueLinkedList {\n 5 \n 6   public\
  \ static void main(String[] args) {\n 7     Queue<String> heroesQueue = new ArrayDeque<>();\
  \     // #A\n 8     heroesQueue.offer(\"Wolverine\");  // 先入        // #B\n 9  \
  \   heroesQueue.add(\"Storm\");                           // #C\n10     heroesQueue.offer(\"\
  Xavier\");                        \n11     System.out.println(heroesQueue);\n12\
  \     heroesQueue.remove();            // 后出       // #D\n13     heroesQueue.poll();\
  \                                 // #E\n14     System.out.println(heroesQueue);\n\
  15   }\n16 }\n```\n\n**输出**:\n\n```\n1 [Wolverine, Storm, Xavier]\n2 [Xavier]\n\
  ```\n\n- #A: 如果我们需要，可以使用 `LinkedList` 作为实现，但对于 `Queue` 的情况，`ArrayDeque` 更快。\n- #B:\
  \ 我们正在使用 `offer` 方法，它将简单地将元素添加到尾部，换说，添加到 `queue` 的末尾。如果元素成功插入 `queue`，则返回 `true`，否则取决于\
  \ `queue` 元素的容量返回 `false`。\n- #C: 我们也使用了 `add` 方法，它与 `offer` 方法类似，也会将元素添加到 `queue`\
  \ 的尾部。`add` 方法的区别在于，如果 `queue` 中没有可用容量，它将抛出 `IllegalStateException`。\n- #D: `remove`\
  \ 方法将检索并移除队列的头部元素，换说，它移除第一个元素。如果 `queue` 为空，它将抛出 `NoSuchElementException`。在这种情况下，它将移除\
  \ `\"Wolverine\"`。\n- #E: `poll` 方法将检索并移除队列的头部元素，换说，第一个元素。`poll` 方法不像 `remove` 方法那样抛出\
  \ `IllegalStateException`。相反，如果 `queue` 为空，它返回 `null`。在这次方法调用中，`\"Storm\"` 将移除。\n\
  \n总结 `Queue` 最重要的方法：\n\n| Queue | 说明 | 是否因容量限制抛出异常？ |\n| --- | --- | --- |\n| offer(e)\
  \ | 将元素添加到 `queue` 末尾 | 否 |\n| add(e) | 与 `offer` 类似 | 是 |\n| poll() | 移除 `queue`\
  \ 的第一个元素（头部） | 否 |\n| remove() | 与 `poll` 类似 | 是 |\n| peek() | 检索第一个元素但不移除它 | 否\
  \ |\n| element() | 与 `peek` 类似 | 是 |\n\n### 12.5.3 Stack 和 Queue 的 Big-O\n\n由于 `Stack`\
  \ 和 `Queue` 的操作时间复杂度相同，让我们一起检查它们：\n\n| 操作 | 平均和最坏情况的时间复杂度 | 说明 |\n| --- | --- |\
