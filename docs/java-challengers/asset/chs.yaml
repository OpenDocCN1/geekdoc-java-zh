  \ 的值。\n\n### 3.7.3 转账挑战\n\n你的目标是开发 `Account` 类的 `transfer` 方法，该方法将接收 `amount` 和另一个\
  \ `Account` 对象作为参数。该逻辑是从当前 `Account` 的 `balance` 中减去 `amount`，并将其加入 `recipient`\
