  4. // #B 处抛出 java.lang.ClassCastException\n\n**Explanation**:\n\n这个 Java 挑战的关键点在于，每当我们在\
  \ Java 中使用排序方法时，都需要实现 `Comparable`。或者至少通过 `Comparator` 告知排序策略。在上面的代码中，我们这两者都没有做。我们传递了一个没有实现\
  \ `Comparable` 的 `Hero` 对象。因此，`sorted()` 函数无法猜测排序策略。由于这个原因，在终端操作方法 `foreach` 中将抛出\
  \ `java.lang.ClassCastException`。\n\n结论是，正确的选项是：\n\n**D) `java.lang.ClassCastException`\
  \ will be thrown at // #B ** **\n\n### 13.4.14 使用 reverseOrder() 反转排序顺序\n\n为了在流中使用\
  \ `sorted` 方法时反转顺序，我们可以在 `sorted` 方法中传递 `Comparator.reverseOrder()`。\n\n此外，记住只有当你的类实现了\
  \ `Comparable` 时，`Comparator.reverseOrder()` 才会生效：\n\n```\n1 List<String> zodiacKnights\
  \ = Arrays.asList(\"Aldebaran\", \"Seya\", \"Shaka\",            \\\n2         \
  \                              \"Ikki\", \"Kanon\");\n3 zodiacKnights.stream().sorted(Comparator.reverseOrder())\n\
  4         .forEach(e -> System.out.print(e + \" \"));\n```\n\n**Output**:\n\nShaka\
  \ Seya Kanon Ikki Aldebaran\n\n### 13.4.15 使用 flatMap() 读取列表列表\n\n`flatMap` 的主要目标是将集合流扁平化为单个流。\n\
  \n在下面的代码中，我们将使用 `flatMap` 来处理嵌套列表结构。注意它与嵌套循环相比它是如何简化代码的：\n\n```\n1 List<List<String>>\
  \ nestedList = List.of(List.of(\"A\", \"B\"), List.of(\"C\", \"D\"));\n2 nestedList.stream()\n\
  3     .flatMap(List::stream)\n4     .forEach(s -> System.out.print(s + \" \"));\n\
  ```\n\n**Output**:\n\nA B C D\n\n### 13.4.16 使用 flatMap 转换原始数组\n\n通过 `flatMap`，可以将原始类型数组的流转换为原始类型的流。\n\
  \n在下面的代码示例中，我们将创建一个 `double` 数字数组流，然后将其转换为 `DoubleStream`：\n\n```\n1 Stream<double[]>\
  \ streamLongArray = Stream.of(new double[] {1.0, 1.5, 2.0});\n2 DoubleStream doubleStream\
  \ = streamLongArray.flatMapToDouble(Arrays::stream);\n3 doubleStream.forEach(n ->\
  \ System.out.print(n + \" \"));\n```\n\n**Output**:\n\n1.0 1.5 2.0\n\n### 13.4.17\
  \ 在 flatMap 中使用自定义对象\n\n在实际项目中，更常见的是使用 `flatMap` 对自定义对象进行操作。原理是相同的，但在书中介绍这一点是非常重要的。\n\
  \n\n\n\n\n首先，我们来创建数据对象：\n\n```\n 1 class FootballClub {\n 2     String name;\n 3\
  \     List<Player> players;\n 4 \n 5     // 省略构造函数和 getter 方法\n 6 }\n 7 \n 8 class\
  \ Player {\n 9     String name;\n10     int age;\n11     int goalsCount;\n12 \n\
  13     // 省略构造函数、getter 和 toString 方法\n14 }\n```\n\n现在我们可以使用带有自定义对象的 `flatMap` 来实现我们的代码示例：\n\
  \n```\n 1 List<Player> psgPlayers = List.of(\n 2     new Player(\"Lionel Messi\"\
  , 34, 679),\n 3     new Player(\"Neymar\", 30, 401));\n 4 List<Player> manchesterUnited\
  \ = List.of(\n 5     new Player(\"Cristiano Ronaldo\", 37, 801), \n 6     new Player(\"\
  Jadon Sancho\", 21, 50));\n 7 \n 8 List<FootballClub> footballClubs = List.of(\n\
  \ 9     new FootballClub(\"Paris Saint-Germain\", psgPlayers), \n10     new FootballClub(\"\
  Manchester United\", manchesterUnited));\n 11\n 12 footballClubs.stream()\n13  \
  \   .map(FootballClub::getPlayers)         // #A\n14     .flatMap(List::stream)\
  \                 // #B\n15     .filter(p -> p.getGoalsCount() > 500)  // #C\n16\
  \     .forEach(System.out::println);\n```\n\n**输出**：\n\nPlayer\n\nPlayer\n\n###\
  \ 代码分析：\n\n- **#A**: `map` 函数是方法引用的完美候选者。这是因为它接收一个 `Function`。因此，它必须接收一个我们的 `footballClub`\
  \ 对象作为参数，并返回一个 `Player` 列表。我们也可以使用 lambda 表达式 `f -> f.getPlayers()` 来达到与方法引用相同的效果。\n\
  \n- **#B**: 现在我们在流中拥有映射后的 `List<Player>`。这使得我们能够调用 `List` 接口中的 `stream` 方法。`flatMap`\
  \ 方法将允许我们访问 `List<Player>` 的流。\n\n- **#C**: 现在让我们过滤出进球超过 500 个的 `players`。注意，通过\
  \ `flatMap` 我们可以让代码变得简洁易读。\n\n在 `flatMap` 方法中最后一点需要注意的是，它接收一个 `Function`，该函数接收流的当前元素并必须返回一个\
  \ `Stream`：\n\n```\n1 <R> Stream<R> flatMap(\n2     Function<? super T, ? extends\
  \ Stream<? extends R>> mapper);\n```\n\n这就是为什么 `flatMap` 方法非常适合平化多个集合中的元素。它的设计目的是根据一个对象返回一个数据流。\n\
  \n现在你已经知道了 `flatMap` 的主要概念，对上面的示例进行一些更改并观察结果对你来说非常重要。这样做你将吸收这个概念！\n\n### 13.4.18\
  \ 使用 takeWhile() 获取元素\n\n`takeWhile` 方法在我们创建的条件真时获取元素。当条件为假时，迭代将停止。\n\n让我们来看一个实际示例：\n\
  \n```\n1 List<Integer> numbers = List.of(1, 2, 3, 4, 5, 6, 7);\n2 \n3 numbers.stream()\n\
  4     .takeWhile(e -> e < 5)\n5     .forEach(e -> System.out.print(e + \" \"));\n\
  ```\n\n**输出**：\n\n1 2 3 4\n\n现在改变数字的顺序看看结果是什么：\n\n```\n1 List<Integer> numbers =\
  \ List.of(1, 2, 7, 6, 4, 5, 3);\n2 \n3 numbers.stream()\n4     .takeWhile(e -> e\
  \ < 5)\n5     .forEach(e -> System.out.print(e + \" \"));\n```\n\n**输出**：\n\n1 2\n\
  \n注意，`takeWhile` 方法只有在条件为真时才会继续迭代。由于数字 `7` 不小于 5，`takeWhile` 方法将停止其迭代。因此，这就是为什么我们只得到了\
  \ `1` 和 `2`，而数字 `3` 和 `4` 被忽略了。\n\n### 13.4.19 使用 dropWhile() 丢弃元素\n\n`dropWhile`\
  \ 方法与 `takeWhile` 方法几乎相反。当我们设置的条件为时，元素将被丢弃。让我们来看一个实际示例：\n\n```\n1 List<Integer>\
  \ numbers = List.of(1, 2, 3, 4, 5, 6, 7);\n2 \n3 numbers.stream()\n4     .dropWhile(e\
  \ -> e < 5)\n5     .forEach(e -> System.out.print(e + \" \"));\n```\n\n**输出**：\n\
  \n5 6 7\n\n如上面的代码所示，小于 5 的元素被丢弃了。\n\n现在我们改变数字的顺序看看发生了什么：\n\n```\n1 List<Integer>\
  \ numbers = List.of(1, 2, 7, 6, 4, 5, 3);\n2 \n3 numbers.stream()\n4     .dropWhile(e\
  \ -> e < 5)\n5     .forEach(e -> System.out.print(e + \" \"));\n```\n\n\n\n\n\n\
  如果我们对流中的数据进行过滤操作，那么元素将先被过滤，然后找到第一个元素：\n\n```\n1 List<String> metalGearCharacters\
  \ = Arrays.asList(\"Snake\", \"Ocelot\", \"Otacon\");\n2 Optional<String> firstCharacter\
  \ = metalGearCharacters.stream()\n3                 .filter(e -> e.startsWith(\"\
  O\")).findFirst();\n4 System.out.println(firstCharacter.orElse(\"\"));\n```\n\n\
  **输出：**\n\nOcelot\n\n### 13.5.3 使用 anyMatch() 匹配任意元素\n\n`anyMatch` 方法将检查流中的元素是否有任何一个符合你指定的条件。如果满足了条件，它返回\
  \ `true`：\n\n```\n1 Stream<String> knights = Stream.of(\"Milo\", \"Aiolos\", \"\
  Shiryu\", \"Ikki\");\n2 boolean anyMatch = knights.anyMatch(s -> s.startsWith(\"\
  S\"));\n3 System.out.println(anyMatch);\n```\n\n**输出：**\n\ntrue\n\n由于 `Shiryu` 以\
  \ ‘S’ 开头，`anyMatch` 条件将满足，因此它将返回 `true`。\n\n### 13.5.4 使用 allMatch() 匹配所有元素\n\n\
  `allMatch` 方法将比较流中所有元素的值。因此，所有值都需要满足该条件：\n\n```\n1 Stream<String> knights = Stream.of(\"\
  Saori\", \"Shaka\", \"Shiryu\", \"Seya\");\n2 boolean allMatch = knights.allMatch(s\
  \ -> s.startsWith(\"S\"));\n3 System.out.println(allMatch);\n```\n\n**输出：**\n\n\
  true\n\n因为 `stream` knights 流中的所有名字都以 `S` 开头，上述代码返回 `true`。但是，如果我们更改 `stream` 中的一个名字，输出将为\
  \ `false`：\n\n```\n1 Stream<String> knights = Stream.of(\"Ikki\", \"Shaka\", \"\
  Shiryu\", \"Seya\");\n2 boolean allMatch = knights.allMatch(s -> s.startsWith(\"\
  S\"));\n3 System.out.println(allMatch);\n```\n\n**输出：**\n\nfalse\n\n### 13.5.5 使用\
  \ noneMatch() 匹配无元素\n\n`noneMatch` 方法将检查条件是否不匹配所有元素。它与 `allMatch` 方法几乎相反：\n\n```\n\
  1 Stream<String> knights = Stream.of(\"Saori\", \"Shaka\", \"Shiryu\", \"Seya\"\
  );\n2 boolean noneMatch = knights.noneMatch(s -> s.startsWith(\"B\"));\n3 System.out.println(noneMatch);\n\
  ```\n\n**输出：**\n\ntrue\n\n由于上述元素没有一个是以 `B` 开头的，`noneMatch` 方法将返回 `true`。如果我们传递 `S`，输出将为\
  \ `false`：\n\n```\n1 Stream<String> knights = Stream.of(\"Shun\", \"Shaka\", \"\
  Shiryu\", \"Seya\");\n2 boolean noneMatch = knights.noneMatch(s -> s.startsWith(\"\
  S\"));\n3 System.out.println(noneMatch);\n```\n\n**输出：**\n\nfalse\n\n### 13.5.6\
  \ noneMatch Java 挑战\n\n让我们在下面的 Java 挑战中探索 `IntStream.range` 和 `noneMatch` 方法的行为。\n\
  \n在以下代码中，你的目标是仔细分析代码并选择一个候选项：\n\n```\n 1 import java.util.stream.IntStream;\n 2\
  \ \n 3 public class IsPrimeNoneMatch {\n 4 \n 5     public static void main(String...\
  \ doYourBest) {\n 6         System.out.println(isPrime(6));\n 7         System.out.println(isPrime('1'));\
  \           // 行 #A\n 8     }\n 9\n10     static boolean isPrime(final int number)\
  \ {\n11         return number > 1 && IntStream.range(2, number)\n12            \
  \     .noneMatch(index -> {\n13                     boolean lol = number % index\
  \ == 0;\n14 \n15                     return false;\n16                 });\n17 \
  \    }\n18 \n19 }\n```\n\n1.  false\n    true\n\n2.  true\n    false\n\n3.  // 行\
  \ #A 处有编译错误\n\n4.  true\n    true\n\n**解释：**\n\n让我们分析代码，从第一次调用 `isPrime(6)` 开始：\n\
  \n* 我们检查 6 是否大于 1，结果为 `true`。\n* 我们创建了一个从 2 到 5 的流，因为 `range` 方法的第二个参数是不包含终点的。\n\
  * 然后我们调用了 `noneMatch` 方法，并注意到那里没有比较任何对象。我们只是返回了 `false`。因此，我们模拟在该方法中没有找到任何元素。由于如此，`noneMatch`\
  \ 方法将返回 `true`。\n\n在第二次调用 `isPrime('1')` 时，注意我们使用了一个字符 `'1'`，由于我们将其传递给 `int` 类型，它会被转换为\
  \ `49`。你可以从这里进一步查看 [ASCII 表格](https://en.wikipedia.org/wiki/ASCII)。因此，与上述情况发生相同的情况，区别是循环将持续到\
  \ `48`，但仍会返回 `true`。\n\n结论是，正确的选项是：\n\n4.  true\n    true\n\n### 13.5.7 使用 count()\
  \ 计数元素\n\n正如名称所示，`count` 方法将计算在管道处理完成后流中有多少个元素。在下面的示例中，我们将有一个在流水线处理完成后 `IntStream`\
