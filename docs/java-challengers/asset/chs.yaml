  \n## 17.1 其他 Java 特性\n\n书中无法涵盖所有的 Java 特性。否则，这本书将轻易超过 2000 页。好消息是，我们并不真的需要知道如何使用所有特性，相反，我们需要知道它们的存在，以便在需要时查阅文档。以下是我们可能需要注意的一些特性：\n\
  \n- 日期 API：在几乎所有的真实 `Java` 项目中，我们需要处理日期。我们经常需要创建和比较日期。幸运的是，Java 有一个非常强大的 API 来处理日期。`Java\
  \ 8` 之前的旧类（如 `Date` 和 `Calendar`）应该被避免，因为代码会变得复杂且不是线程安全的。为了解决这些问题，从 Java 8 开始我们有了\
  \ `LocalDate`、`LocalTime` 和 `LocalDateTime` 类，它们可以轻松处理任何日期时间问题。更多信息，请查看此链接：[`docs.oracle.com/javase/8/docs/api/java/time/LocalDate.html`](https://docs.oracle.com/javase/8/docs/api/java/time/LocalDate.html)\n\
  \n- 文件处理：这是一个在实际应用中很少使用的特性，但知道它的存在是有用的，因为在某些情况下我们需要它。处理文件最有效的 Java API 是 `java.nio.file`。基本上，我们可以使用这个\
  \ API 轻松地创建、更新、删除、读取和处理文件。更多信息，请查看文档：[`docs.oracle.com/javase/8/docs/api/java/nio/file/package-summary.html`](https://docs.oracle.com/javase/8/docs/api/java/nio/file/package-summary.html)\n\
  \n\n\n\n\n*   **分词 (Tokenization)**：为了拆解一个 `String`，我们可以使用任何标记符，如 `, | _`，这意味着任何字符。这在需要在大文本中搜索特定\
  \ `String` 时非常有用。有一个有趣的类可以实现这一点，即 `StringTokenizer`。更多信息，请查看以下链接：[`docs.oracle.com/javase/7/docs/api/java/util/StringTokenizer.html`](https://docs.oracle.com/javase/7/docs/api/java/util/StringTokenizer.html)\n\
  *   **正则表达式 (Regex)**：为了从 `String` 中搜索特定模式，我们可以使用正则表达式模式。正则表达式对于每种编程语言都是通用的，简单来说，正则表达式是一组预定义的且复杂的模式，允许开发者通过控制仅字符、仅数字、文本大小、行或文本的开头和结尾、文本重复等搜索特定的\
  \ `String`，可能性无限！更多信息，请查看以下链接：[`docs.oracle.com/javase/7/docs/api/java/util/regex/Pattern.html`](https://docs.oracle.com/javase/7/docs/api/java/util/regex/Pattern.html)\n\
  *   **序列化 (Serialization)**：为了通过网络将对象传输为字节，我们可以使用序列化技术。在日常工作中我们并不真的需要进行底层实现，但知道\
  \ Java 中存在这个概念是非常重要的。更多信息，请查看以下文档：[`docs.oracle.com/javase/7/docs/api/java/io/Serializable.html`](https://docs.oracle.com/javase/7/docs/api/java/io/Serializable.html)\n\
