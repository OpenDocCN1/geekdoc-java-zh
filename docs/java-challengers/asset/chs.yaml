  \n\n]\n[/\n]\n[/content]\n\n\n\n\n注意，创建线程池并不总是最佳解决方案，你必须根据面临的问题来考虑是否使用它。要做出此决定，请思考任务是否运行得非常频繁，如果是，那么使用\
  \ `thread` 池可能更好，因为多次创建新 `thread` 会产生开销。使用线程池的优势是线程已经创建好了。因此，没有创建线程的开销。线程会在线程池中被重用。\n\
  \n在 Java 中创建 `thread` 池的最简单方法是使用 `Executors` 类：\n\n```java\nExecutorService executor\
  \ = Executors.newFixedThreadPool(2);`\n```\n\n在上述代码中，我们有一个拥有 2 个线程的线程池。现在，让我们使用\
  \ `submit` 方法来利用这些线程：\n\n```\n1 ExecutorService executor = Executors.newFixedThreadPool(2);\n\
  2 \n3 Runnable runnableTask = () -> System.out.println(Thread.currentThread()  \
  \           \\\n4                                                        .getName());\n\
  5 \n6 executor.submit(runnableTask);\n7 executor.submit(runnableTask);\n8 executor.submit(runnableTask);\n\
  ```\n\n**输出**:\n\npool-1-thread-1\n\npool-1-thread-2\n\npool-1-thread-1\n\n程序执行继续……\n\
  \n注意在上面的代码，`submit` 方法接收一个 `Runnable` 对象并在线程池中处理它们。\n\n另一个重要的细节是，在输出中，我们可以看到一个线程池（`pool-1`）两个线程（`thread-1`\
  \ 和 `thread-2`）。如之前提到的，当需要频繁运行任务时，线程池非常有用，因为这样可以显著优化性能。\n\n还要注意程序执行会无限持续。除非我们显式告诉执行器\
  \ `shutdown`，否则程序将一直运行。\n\n### 16.6.1 使用 Callable\n\n`Runnable` 约是一个 `void` 方法，不返回任何值。但如果我们要在运行\
  \ `Executor` 任务时返回一个值呢？幸运的是，有 `Callable` 接口可以为我们做到。\n\n在使用 `Callable` 之前，让我们看看这个接口是如何定义的：\n\
  \n```\n1 @FunctionalInterface\n2 public interface Callable<V> {\n3     V call()\
  \ throws Exception;\n4 }\n```\n\n注意 `Callable` 是一个函数式接口，有一个返回泛型值 `V` 的 `call` 方法，这意味着任何通过泛型传递的类型。\n\
  \n现在我们知道 `Callable` 接口是什么样的了，让我们看看 `Callable` 在代码中是如何工作的：\n\n```\n 1 ExecutorService\
  \ executor = Executors.newFixedThreadPool(1);              \n 2 Callable<String>\
  \ callableTask = () -> Thread.currentThread().getName();  \n 3 \n4 Future<String>\
  \ future1 = executor.submit(callableTask);                  \n 5 Future<String>\
  \ future2 = executor.submit(callableTask);\n 6 \n7 System.out.println(future1.isDone());\n\
  \ 8 System.out.println(future1.get());\n 9 System.out.println(future1.isDone());\n\
  10 \n11 System.out.println(future2.get());\n```\n\n**输出**:\n\nfalse\n\npool-1-thread-1\n\
  \ntrue\n\npool-1-thread-1\n\n注意重载 `submit` 方法在以下方法签名中返回一个 `Future`：\n\n```\n1 public\
  \ interface ExecutorService extends Executor {\n2     <T> Future<T> submit(Callable<T>\
  \ task);\n3 }\n```\n\n它返回与 `Callable` 中传递相同的泛型类型。一旦我们拥有了 `Future` 对象，就可以使用 `get`\
  \ 方法。简单来说，`get` 会等待计算完成并返回 `Callable` 的值。\n\n### 16.6.2 ExecutorService invokeAny\n\
  \n`ExecutorService` 的 `invokeAny` 方法将调用多个任务，并由第一个完成执行的任务返回一个值。\n\n这在我们想要对数组进行排序时非常有用，例如我们处理的是复杂数据并启动了多个任务来排序。那么最快的算法将返回排序后的结果。\n\
  \n让我们来看一个简单的示例，演示 `invokeAny` 方法的使用：\n\n```\n 1 import java.util.ArrayList;\n 2\
  \ import java.util.Collections;\n 3 import java.util.List;\n 4 import java.util.Random;\n\
  \ 5 import java.util.concurrent.Callable;\n 6 import java.util.concurrent.ExecutionException;\n\
  \ 7 import java.util.concurrent.ExecutorService;\n 8 import java.util.concurrent.Executors;\n\
  \ 9 \n10 public class SortingInvokeAny {\n11 \n12   public static void main(String[]\
  \ args) throws ExecutionException,  \n13                                       \
  \           InterruptedException {\n14     List<String> heroes = new ArrayList<>(List.of(\"\
  Spider-Man\", \n15                                                   \"Batman\"\
  , \"Iron-Man\"));\n16 \n17     Callable<List<String>> naturalSort = () -> {    \
  \            // #A\n18       System.out.println(\"Natural Sort\");\n19       Thread.sleep(new\
  \ Random().nextInt(500));                  // #B\n20       heroes.sort(String::compareTo);\n\
  21       return heroes;\n22     };\n23 \n24     Callable<List<String>>  revertSort\
  \ = () -> {                // #C\n25       System.out.println(\"Revert Sort\");\n\
  26       Thread.sleep(new Random().nextInt(500));\n27       heroes.sort(String.reverseOrder());\n\
  28       return heroes;\n29     };\n30 \n31     List<Callable<String>> taskList\
  \ = List.of(naturalSort, revertSort);\n32     ExecutorService executor = Executors.newCachedThreadPool();\
  \  // #D\n33 \n34     try {\n35       List<String> sortedArray = executor.invokeAny(taskList);\
  \   // #E\n36       System.out.println(sortedArray);\n37       executor.shutdown();\n\
  38     } catch (ExecutionException e) {\n39       e.printStackTrace();\n40     }\n\
  41   }\n42 }\n```\n\n**输出（随机）**:\n\nRevert Sort\n\nNatural Sort\n\n[Spider-Man,\
  \ Iron Man, Batman]\n\n**代码分析**:\n\n注意上面的输出可能会变化，因为 `naturalSort` 可能比 `revertSort`\
  \ 快，反之亦然。这就是使用 `invokeAny` 方法的。\n\n让我们来看代码的高亮部分：\n\n*   #A: 这里创建一个返回 `List<String>`\
  \ 的 `Callable`，并按自然顺序返回列表。\n*   #B: 为了模拟处理过程，在随机时间调用 `Thread.sleep` 方法。这样我们就可以更容易看到随机输出。\n\
  *   #C: 与上面一个类似的 `Callable`，但这次将以逆序返回列表。\n*   #D: 创建一个 `CachedThreadPool` 来执行 `Callables`\
  \ 的 `invokeAny`。\n*   #E: 我们调用两个 `Callables`，通过输出可以清楚地看到这一点。\n\n然后，第一个返回值的 `Callable`\
  \ 将是实际使用的那个。\n\n### 16.6.3 ExecutorService invokeAll\n\n正如名称所示，`invokeAll` 方法将调用线程池中的所有方法。\n\
  \n在使用 `ExecutorService` 的 `invokeAll` 方法时，需要记住的一个重要点是任务将按照它们被包含的顺序完成。无论最后一个任务是否先完成，将始终遵循顺序。\n\
  \n让我们看看这在代码中是如何工作的：\n\n\n\n\n\n```java\nimport java.util.List;\nimport java.util.Random;\n\
  import java.util.concurrent.Callable;\nimport java.util.concurrent.ExecutionException;\n\
  import java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\
  import java.util.concurrent.Future;\n\npublic class RandomNumberInvokeAll {\n\n\
  \    public static void main(String... invokeAll) throws InterruptedException {\n\
  \        ExecutorService executor = Executors.newFixedThreadPool(2);\n        Callable<String>\
  \ delayedRandomNumberTask = () -> {\n          Thread.sleep(1000);\n          return\
  \ \"Delayed: \" + new Random().nextInt(1000);\n        };\n        Callable<String>\
  \ nonDelayedRandomNumberTask = () -> \"Non-delayed: \"\n                       \
  \                         + new Random().nextInt(1000);\n\n        List<Callable<String>>\
  \ taskList = List.of(delayedRandomNumberTask,\n                                \
  \            nonDelayedRandomNumberTask);\n        List<Future<String>> resultList\
  \ = executor.invokeAll(taskList);\n\n        executor.shutdown();\n\n        resultList.forEach(e\
  \ -> {\n          try {\n            System.out.println(e.get());\n          } catch\
  \ (InterruptedException | ExecutionException ex) {\n            ex.printStackTrace();\n\
  \          }\n        });\n    }\n\n}\n```\n\n**输出（随机）**：\n\nDelayed: 945\n\nNon-delayed:\
  \ 658\n\n如你在上面的代码所示，尽管 `delayed` 随机数任务的执行时间比 `non-delayed` 长，但执行顺序仍然是先 `delayed`\
  \ 后后 `non-delayed`。\n\n### 16.6.4 使用 shutdown\n\n除非我们使用 `shutdown` 方法，否则 `Executor`\
  \ 任务将一直运行。`shutdown` 方法将优雅地停止 `thread` 的执行。这意味着 `shutdown` 方法将等待所有已经开始执行的 `threads`\
  \ 完成。不过，它并不会等待那些提交了任务但尚未开始执行的线程：\n\n```java\nExecutorService executor = Executors.newFixedThreadPool(1);\n\
  Runnable callableTask = () -> System.out.println(Thread.currentThread()\n      \
  \                                            .getName());\n\nexecutor.submit(callableTask);\n\
  executor.submit(callableTask);\n\nexecutor.shutdown();\n```\n\n**输出**：\n\npool-1-thread-1\n\
  \npool-1-thread-1\n\n在上面的程序中注意，应用程序将会结束。\n\n如果我们希望等待已提交的任务完成，我们必须使用 `awaitTermination`\
  \ 方法：\n\n```java\n// 代码与上面相同\nexecutor.awaitTermination(500, TimeUnit.MILLISECONDS);\n\
  executor.shutdown();\n```\n\n请注意，在 `awaitTermination` 方法中，如果正在执行的任务需要很长时间才能完成，`await`\
  \ 将会在 500 毫秒超时后就会结束。\n\n### 16.6.5 使用 shutdownNow\n\n`shutdownNow` 方法将对正在执行的 `threads`\
  \ 强制强制停止。同时，它还会返回一个无法完成的任务列表。\n\n如果我们想等待任务完成，可以使用 `awaitTermination` 方法。需要注意的是，`shutdownNow`\
  \ 方法并不总是能停止 `thread` 的执行。例如，如果线程任务没有对 `Thread.interrupt` 响应，那么什么也不会发生。\n\n由于 `shutdownNow`\
  \ 方法并不能真正保证线程池的终止，Oracle 推荐以下代码实践：\n\n```java\nexecutor.shutdown(); // 执行完毕后终止任务\n\
  try {\n    // 等待正在执行的任务完成\n    if (!executor.awaitTermination(50, TimeUnit.SECONDS))\
  \ {\n        executor.shutdownNow(); // 尝试终止执行中的任务\n        if (!executor.awaitTermination(50,\
  \ TimeUnit.SECONDS))\n        System.err.println(\"Thread pool is not terminated\"\
  );\n    }\n} catch (InterruptedException ie) {\n    executor.shutdownNow();\n}\n\
  ```\n\n### 16.6.6 SingleThreadExecutor\n\n如其名，`SingleThreadExecutor` 将创建一个 `thread`\
  \ 并保证任务将按顺序执行。由于只有一个线程，因此在每次线程执行时只有一个任务处于激活状态。\n\n此外，如果 `thread` 中发生任何错误，任务将重新执行。\n\
  \n```java\nExecutorService executor = Executors.newSingleThreadExecutor();\nRunnable\
  \ runnableTask = () -> System.out.println(Thread.currentThread()\n             \
  \                                     .getName());\n\nexecutor.submit(runnableTask);\n\
  executor.submit(runnableTask);\nexecutor.submit(runnableTask);\n\nexecutor.shutdown();\n\
  ```\n\n**输出**：\n\npool-1-thread-1\n\npool-1-thread-1\n\npool-1-thread-1\n\n如你在上面的输出所示，三个任务都在同一个\
  \ `thread-1` 中执行。该程序也因为 `shutdown` 方法而终止了。\n\n### 16.6.7 newFixedThreadPool\n\n\
  注意 `newFixedThreadPool` 返回固定数量的线程。让我们看看 `ThreadPoolExecutor` 在其构造函数中期望什么：\n\n```java\n\
  public static ExecutorService newFixedThreadPool(int nThreads) {\n    return new\
  \ ThreadPoolExecutor(nThreads, nThreads,\n                               0L, TimeUnit.MILLISECONDS,\n\
  \                               new LinkedBlockingQueue<>());\n}\n```\n\n通过调用 `newFixedThreadPool()`，我们只有一个参数，即线程数。此外，我们无法控制放入\
  \ `LinkedBlockingQueue` 中的元素数量，因为这是该 `queue` 默认的最大元素数。这可能会掩盖你应用程序中的严重问题。\n\n让我们在代码中实际看看这个限制在\
  \ `LinkedBlockingQueue` 中是如何工作的：\n\n```java\nExecutorService executor = new ThreadPoolExecutor(100,\
  \ 100, 0L,\n                   TimeUnit.MILLISECONDS, new LinkedBlockingQueue<>(100));\n\
  \nfor (int i = 1; i < 1000; i++) {\n    Runnable runnableTask = () -> System.out.println(Thread.currentThread()\n\
  \                                                      .getName());\n    executor.submit(runnableTask);\n\
  }\n```\n\n**输出**：\n\njava.util.concurrent.RejectedExecutionException\n\n如你在上面的代码所示，我们将得到\
  \ `RejectedExecutionException`。这是因为我们创建了一个限制为 100 个元素的 `LinkedBlockingQueue`，但在\
  \ for 循环中我们执行了超过 1000 个任务。\n\n### 16.6.8 SingleThreadScheduledExecutor\n\n`SingleThreadScheduledExecutor`\
  \ 将创建一个线程，并根据配置的时间延迟下一个任务执行：\n\n```java\nScheduledExecutorService executor = Executors\n\
  \    .newSingleThreadScheduledExecutor();\n\nRunnable task = () -> System.out.println(Thread.currentThread().getName());\n\
  \nexecutor.schedule(task, 500, TimeUnit.MILLISECONDS);\nexecutor.schedule(task,\
  \ 1000, TimeUnit.MILLISECONDS);\n\nexecutor.shutdown();\n```\n\n**输出**：\n\npool-1-thread-1\n\
  \npool-1-thread-1\n\n\n\n\n上述代码中的执行器（executor）接收任务、延迟时间和时间单位。这意味着当任务执行时，会有 500 毫秒的延迟，然后执行下一个任务。同样请注意，`newSingleThreadScheduledExecutor`\
  \ 仅创建了一个线程。\n\n### 16.5.9 CachedThreadPool（缓存线程池）\n\n`CachedThreadPool` 用于执行短时间任务。因此，如果你有执行耗时较长的任务，最好避免使用\
  \ `CachedThreadPool`。\n\n`CachedThreadPool` 中的线程在空闲时将保持存活状态 60 秒。此后，该线程将被终止。理想情况下，`CachedThreadPool`\
  \ 中的线程应该尽可能频繁地执行任务。\n\n在查看如何使用 `CachedThreadPool` 工厂方法之前，让我们先看看它的实现方式：\n\n```\n\
  1 public static ExecutorService newCachedThreadPool() {\n2     return new ThreadPoolExecutor(0,\
  \ Integer.MAX_VALUE,\n3                                     60L, TimeUnit.SECONDS,\n\
  4                                     new SynchronousQueue<Runnable>());\n5 }\n\
  ```\n\n注意在上面的代码中，我们甚至没有传递线程数，这意味着线程将根据需要创建。\n\n让我们来看一个 `CachedThreadPool` 的代码示例：\n\
  \n```\n1 ExecutorService executor = Executors.newCachedThreadPool();\n2 for (int\
  \ i =1; i < 1000; i++) {\n3     Runnable runnableTask = () -> System.out.println(Thread.currentThread()\
  \         \\\n4                                                      .getName());\n\
  5     executor.submit(runnableTask);\n6 }\n```\n\n**输出（随机）**：\n\n…\n\npool-1-thread-165\n\
  \npool-1-thread-106\n\n注意在使用 `newCachedThreadPool` 方法时有一个局限性，即我们无法控制创建线程的数量。这意味着根据任务数量，可能会创建\
  \ `2147483647` 个线程。这可能会成为你软件的瓶颈。因此，最好用此线程池处理短寿命任务，以便线程缓存能够被有效利用。\n\n在上面的代码中，我们创建了一个\
  \ `CachedThreadPool`，然后创建了 1000 个任务，打印线程池名称后跟线程编号。然后我们将它们全部提交到 `CachedThreadPool`。\n\
  \n另一个重要点是，在输出中，`CachedThreadPool` 创建了多个线程。例如，创建了线程编号 `165`。\n\n### 16.6.10 ScheduledThreadPool（定时线程池）\n\
  \n`ScheduledThreadPool` 通常用于在短时间间隔内执行任务。\n\n```\n1 ScheduledThreadPoolExecutor threadPool\
  \ = new ScheduledThreadPoolExecutor(2);\n2 \n3 Runnable task = () -> System.out.println(Thread.currentThread().getName());\n\
  4 for (int i = 0; i < 5; i++) {\n5     threadPool.schedule(task, 1,  TimeUnit.SECONDS);\n\
  6 }\n7 \n8 threadPool.shutdown();\n```\n\n**输出**：\n\npool-1-thread-2\n\npool-1-thread-1\n\
  \npool-1-thread-2\n\npool-1-thread-1\n\n注意上面的代码中，定时线程池会等待 1 秒，然后开始执行每个任务。\n\n###\
  \ 16.6.11 scheduleAtFixedRate（固定频率执行）\n\n`scheduleAtFixedRate` 方法会根据任务执行所需的时间，以固定的间隔调用任务。\n\
  \n例如，如果固定频率时间为 1 秒，而任务需要半秒时间完成，则下一个任务将在 1 秒后执行。\n\n如果任务耗时超过 1 秒，则下一个任务将在当前任务完成后立即执行。这里`没有额外延迟`，只有`固定频率`。\n\
  \n让我们先看下 `scheduleAtFixedRate` 的方法签名：\n\n```\n1 public ScheduledFuture<?> scheduleAtFixedRate(Runnable\
  \ command,\n2                                                 long initialDelay,\n\
  3                                                 long period,\n4              \
  \                                   TimeUnit unit);\n```\n\n第一个参数是任务本身，它基本上是 `Runnable`\
  \ 接口中 `run` 方法的实现。\n\n`initialDelay` 是到第一个任务开始运行所需的时间。\n\n`period` 意味着每当任务完成后之间的间隔时间。\n\
  \n`TimeUnit` 是时间配置，它可以是以下所有值之一：`NANOSECONDS`、`MICROSECONDS`、`MILLISECONDS`、`SECONDS`、`MINUTES`、`HOURS`\
  \ 和 `DAYS`。\n\n现在我们知道了 `scheduleAtFixedRate` 的方法签名。让我们来看一个代码示例以更清楚地理解它：\n\n```\n\
  1 ScheduledExecutorService executor = Executors.newScheduledThreadPool(5);\n2 Runnable\
  \ task = () -> {\n3   System.out.println(\"Never stop learning! \" + LocalDateTime.now());\n\
  4   try { Thread.sleep(1000); } catch (InterruptedException e) {}\n5 };\n6 executor.scheduleAtFixedRate(task,\
  \ 1, 1, TimeUnit.SECONDS);\n```\n\n**输出**：\n\nNever stop learning! 2022-06-30T14:16:12.650819\n\
  \nNever stop learning! 2022-06-30T14:16:13.660476\n\nNever stop learning! 2022-06-30T14:16:14.661136\n\
  \n### 16.6.12 scheduleWithFixedDelay（固定延迟执行）\n\n另一方面，`scheduleWithFixedDelay` 会等待任务完成，在此基础上增加延迟。这意味着如果任务耗时\
  \ 1 秒，那么下一个任务将在 2 秒后开始。\n\n在看代码之前，让我们先看看 `scheduleWithFixedDelay` 的签名：\n\n```\n\
  1 public ScheduledFuture<?> scheduleWithFixedDelay(Runnable command,\n2        \
  \                                             long initialDelay,\n3            \
  \                                         long delay,\n4                       \
  \                              TimeUnit unit);\n```\n\n注意它与 `scheduleAtFixedRate`\
  \ 非常相似。让我们来看代码：\n\n```\n1 ScheduledExecutorService executor = Executors.newScheduledThreadPool(3);\n\
  2 Runnable task = () -> {\n3     System.out.println(\"Never stop learning! \" +\
  \ LocalDateTime.now());\n4     System.out.println(Thread.currentThread().getName());\n\
  5     try { Thread.sleep(1000); } catch (InterruptedException e) {}\n6 };\n7 executor.scheduleWithFixedDelay(task,\
  \ 1, 1, TimeUnit.SECONDS);\n```\n\n**输出**：\n\nNever stop learning! 2022-06-30T14:16:24.643794\n\
  \npool-1-thread-3\n\nNever stop learning! 2022-06-30T14:16:26.654136\n\npool-1-thread-2\n\
  \nNever stop learning! 2022-06-30T14:16:28.660036\n\npool-1-thread-1\n\n注意每个任务之间的时间差。`scheduleWithFixedDelay`\
  \ 运行 1 秒。\n\n### 16.6.13 CountDownLatch（计数计数器）\n\n`CountDownLatch` 类用于等待线程的执行。它计算任务执行的次数，有助于协调线程。\n\
  \n让我们来看一个代码示例，其中我们在构造函数中创建一个计数 3 的 `CountDownLatch`。这样我们就可以计数并控制 `ScheduledThreadPool`\
  \ 执行多少次任务：\n\n```\n1 CountDownLatch countDownLatch = new CountDownLatch(3); // #A\n\
  2 \n3 ScheduledExecutorService executor = Executors.newScheduledThreadPool(2); //\
  \ #B\n4 Runnable task = () -> {\n5     System.out.println(\"Never stop learning!\
  \ \" + LocalDateTime.now());\n6     countDownLatch.countDown(); // #C\n7 };\n8 executor.scheduleAtFixedRate(task,\
  \ 1, 1, TimeUnit.SECONDS); // #D\n9 \n10 countDownLatch.await(); // #E\n11 executor.shutdown();\
  \ // #F\n```\n\n**输出**：\n\nNever stop learning! 2022-06-30T14:16:33.944476\n\nNever\
  \ stop learning! 2022-06-30T14:16:34.930132\n\nNever stop learning! 2022-06-30T14:16:35.929230\n\
  \n进程退出，退出代码为 0\n\n**代码分析**：\n\n*   #A: 创建一个计数 3 的 `CountDownLatch`。\n\n*   #B: 创建一个具有两个线程的\
  \ `newScheduledThreadPool`。\n\n*   #C: 每次执行任务时调用 `countDown`。\n\n*   #D: 以每 1 秒一次的固定频率调度任务。\n\
  \n*   #E: 主线程等待直到 `countDownLatch` 达到 0。\n\n*   #F: 关闭执行器。\n\n\n\n\n# F: `ScheduledThreadPool`\
  \ 已关闭。\n\n`CountDownLatch` 的另一个巨大优势是，它可以通过方法参数或构造函数在各处传递。例如，这是 `Thread.sleep` 方法无法做到的点。\n\
  \n### 16.6.14 线程延迟挑战\n\n接下来的 Java 代码挑战将测试你关于使用 `scheduledThreadPool` 类调度进程的知识。此外，你将学习更多关于如何\
  \ `CountDownLatch` 来控制进程执行的次数。\n\n因此，只有**一个**选项可以作为答案。假设挑战现在的时间是 `05:00:00`。你能猜出哪是正确的选项吗？\n\
  \n```\n 1 import java.time.LocalTime;\n 2 import java.time.format.DateTimeFormatter;\n\
  \ 3 import java.util.concurrent.CountDownLatch;\n 4 import java.util.concurrent.Executors;\n\
  \ 5 import java.util.concurrent.ScheduledExecutorService;\n 6 import java.util.concurrent.TimeUnit;\n\
  \ 7 \n 8 public class ThreadDelayChallenge {\n 9 \n10   public static void main(String[]\
  \ args) throws InterruptedException {\n11     CountDownLatch countDownLatch = new\
  \ CountDownLatch(3);\n12     Runnable fixedRateTask = createScheduledTask(countDownLatch,\
  \ \n13                                                  \"Fixed rate task: \");\n\
  14     Runnable fixedDelayTask = createScheduledTask(countDownLatch, \n15      \
  \                                             \"Fixed delay task: \");\n16 \n17\
  \     ScheduledExecutorService executor = Executors.newScheduledThreadPool(2);\n\
  18 \n19     executor.scheduleAtFixedRate(fixedRateTask, 1, 1, TimeUnit.SECONDS);\n\
  20     executor.scheduleWithFixedDelay(fixedDelayTask, 1, 1, TimeUnit.SECONDS);\n\
  21     countDownLatch.await();\n22     executor.shutdown();\n23   }\n24 \n25   private\
  \ static Runnable createScheduledTask(CountDownLatch countDownLatch,        \\\n\
  26                                         String message) {\n27     return () ->\
  \ {\n28       try {\n29         Thread.sleep(1000);\n31         countDownLatch.countDown();\n\
  32         var count = countDownLatch.getCount();\n33         System.out.println(\"\
  Count: \" + count + \" - \" + message +\n34             LocalTime.now().format(DateTimeFormatter.ofPattern(\"\
  HH:mm:ss\")));\n35       } catch (InterruptedException e) {\n36         e.printStackTrace();\n\
  37       }\n38     };\n39   }\n40 }\n```\n\n1.  Count: 1 - Fixed delay task: 05:00:00\n\
  \    Count: 1 - Fixed rate task: 05:00:00\n    Count: 0 - Fixed rate task: 05:00:01\n\
  \    Count: 0 - Fixed delay task: 05:00:02\n\n2.  Count: 1 - Fixed delay task: 05:00:00\n\
  \    Count: 2 - Fixed rate task: 05:00:00\n    Count: 0 - Fixed rate task: 05:00:02\n\
  \n3.  Count: 3 - Fixed delay task: 05:00:00\n    Count: 2 - Fixed rate task: 05:00:00\n\
  \    Count: 1 - Fixed rate task: 05:00:01\n\n4.  Count: 1 - Fixed delay task: 05:00:00\n\
  \    Count: 1 - Fixed rate task: 05:00:00\n    Count: 0 - Fixed delay task: 05:00:01\n\
  \n**解析**：\n\n这个代码挑战的谜题部分是 `CountDownLatch` 类。该类的目的是计数任务应该执行的次数。\n\n在本次挑战中，我们将计数设置为\
  \ `3`。然而，请注意，我们在 `ThreadPool` 中创建了两个线程。这意味着在 `createScheduledTask` 方法中会有并行处理。\n\n\
  同时注意，我们在方法中包含以下代码：\n\n```\n1   Thread.sleep(1000);\n2   countDownLatch.countDown();\n\
  ```\n\n这里发生的情况是，两个线程将睡眠 1 秒，然后才会执行 `countDown`。\n\n同样注意，计数器将从 `3` 开始。因此，可能一个线程将值减到\
  \ `2`，而另一个减到 `1`。然后，两个线程都会读取到相同的值 `1`。\n\n因此，结果的第一个部分可能是可能的：\n\n```\n1 Count: 1\
  \ - Fixed delay task: 05:00:00\n2 Count: 1 - Fixed rate task: 05:00:00\n```\n\n\
  同样的逻辑也可能发生在 `countdown` 为 `0`，区别在于当它变为 `0` 时，将无法再减少倒计数数字了。然而，任务将停止执行，因为 `countDown`\
  \ 已经达到了 `0`。\n\n因此，结果的最后部分也是可能的：\n\n```\n1 Count: 0 - Fixed rate task: 05:00:01\n\
  2 Count: 0 - Fixed delay task: 05:00:02\n```\n\n我们还在探索 `scheduleAtFixedRate`、`scheduleWithFixedDelay`、`countDown`、`getCount`、`await`、`shutdown`、`Thread.sleep`、`LocalTime.now().format(DateTimeFormatter.ofPattern(\"\
  HH:mm:ss\"))` 以及 `System.out.println` 的机制。\n\n\n\n\n\n\n```java\n1 ConcurrentNavigableMap<Integer,\
  \ String> xmen = new ConcurrentSkipListMap<>();\n2 xmen.put(3, \"Xavier\");\n3 xmen.put(2,\
  \ \"Wolverine\");\n4 xmen.put(1, \"Cyclops\");\n5 \n6 xmen.forEach((k, v) -> System.out.println(k\
  \ +\" : \" + v));\n```\n\n**输出**:\n\n1 : Cyclops\n\n2 : Wolverine\n\n3 : Xavier\n\
  \n如上方的代码所示，只有键会根据 `compareTo` 方法的实现进行排序，在本例中，它是自然顺序。\n\n强化该集合类的一个关键点是：它可以在多线程环境中安全地使用，并且可以避免数据冲突。\n\
  \n## 16.8 ConcurrentSkipListSet\n\n该类与 `TreeSet` 类似，但区别在于它是`线程安全的`。`ConcurrentSkipListSet`\
  \ 类也会根据 `compareTo` 方法的实现来对元素进行排序。\n\n让我们来看一个代码示例：\n\n```java\n1 NavigableSet<String>\
  \ simpsons = new ConcurrentSkipListSet<>();\n2 simpsons.add(\"Homer\");\n3 simpsons.add(\"\
  Bart\");\n4 simpsons.add(\"Marge\");\n5 \n6 simpsons.forEach(System.out::println);\n\
  ```\n\n**输出**:\n\nBart\n\nHomer\n\nMarge\n\n## 16.9 使用 BlockingQueue 的生产者-消费者模型\n\
  \n`BlockingQueue` 接口非常适合在多线程环境中安全地添加元素。这意味着 `BlockingQueue` 以同步的方式插入元素。\n\n队列数据结构非常适用于从队列头部添加或移除元素。\n\
  \n```java\n 1 import java.util.Random;\n 2 import java.util.concurrent.*;\n 3 \n\
  \ 4 public class ProducerConsumer {\n 5 \n 6   public static void main(String[]\
  \ args) throws InterruptedException {\n 7     BlockingQueue<Integer> blockingQueue\
  \ = new LinkedBlockingQueue<>(); // #A\n 8 \n 9     Runnable producerTask = () ->\
  \ {\n10       try {\n11         int i = new Random().nextInt(100);\n12         blockingQueue.put(i);\
  \                                           // #B\n13         System.out.println(\"\
  Produced: \" + i);\n14       } catch (InterruptedException e) {\n15         e.printStackTrace();\n\
  16       }\n17     };\n18     Runnable consumerTask = () -> {\n19       try {\n\
  20         System.out.println(\"Consumed : \" + blockingQueue.take());       //\
  \ #C\n21       } catch (InterruptedException ex) {\n22         ex.printStackTrace();\n\
  23       }\n24     };\n 25 \n26     ScheduledExecutorService executor = Executors.newScheduledThreadPool(5);\n\
  27     executor.scheduleAtFixedRate(producerTask, 0, 1000, TimeUnit.MILLISECONDS);\n\
  28     executor.scheduleAtFixedRate(consumerTask, 0, 500, TimeUnit.MILLISECONDS);\n\
  29   }\n30 }\n```\n\n**输出（随机）**:\n\nProduced: 45\n\nConsumed : 45\n\nProduced: 88\n\
  \nConsumed : 88\n\n…\n\n**代码分析**:\n\n- #A: `BlockingQueue` 接口可以有效地同步地从`队列` 中添加和移除元素。因此，我们不需要使用\
  \ `synchronized` 块或 `ReentrantLock`，而是可以使用 `BlockingQueue` 来处理一组数据。\n\n- #B: `put`\
  \ 方法会按顺序放入元素，并在其实现中使用 `ReentrantLock`，如你所示：\n\n```java\n 1 public class LinkedBlockingQueue<E>\
  \ extends AbstractQueue<E>\n 2         implements BlockingQueue<E>, java.io.Serializable\
  \ { \n 3 \n 4   public void put(E e) throws InterruptedException {\n 5     if (e\
  \ == null) throw new NullPointerException();\n 6     final int c;\n 7     final\
  \ Node<E> node = new Node<E>(e);\n 8     final ReentrantLock putLock = this.putLock;\n\
  \ 9     // ...\n10   }\n11 }\n```\n\n因此，没有必要再次手动同步 `put` 方法。\n\n- #C: `take` 方法将等待队列中至少有一个元素，然后取出该值。与\
  \ `put` 方法类似，`take` 方法也是同步的，或者通过 `ReentrantLock` 类持有监视锁：\n\n```java\n 1 // ...\n\
  \ 2 public E takeFirst() throws InterruptedException {\n 3     final ReentrantLock\
  \ lock = this.lock;\n 4     lock.lock();\n 5     try {\n 6         E x;\n 7    \
  \     while ( (x = unlinkFirst()) == null)\n 8             notEmpty.await();\n 9\
  \         return x;\n10     } finally {\n11         lock.unlock();\n12     }\n13\
  \ }\n```\n\n如上方的代码所示，了解 Java 语言中的可用工具非常重要。否则，很容易重造轮子并手动实现所有这些生产者和消费者的逻辑。\n\n对于大多数日常问题，你可以相信\
  \ Java 语言中已经现成的解决方案。因此，请尽量保持跟进。\n\n## 16.10 总结\n\n- 使用 `ReentrantLock` 的锁机制\n- 使用\
  \ `ReadWriteLock` 的线程安全\n- 使用 `volatile` 的原子操作\n- 使用 `CompletableFuture` 的异步编程\n\
  - 使用 `Executors` 进行任务执行\n- 使用 `Callable` 进行函数式编程\n- 使用 `shutdown` 进行线程池管理\n- 专用线程池如\
