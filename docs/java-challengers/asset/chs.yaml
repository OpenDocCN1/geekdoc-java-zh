  \ `main` 方法来执行以下操作：\n\n- 实例化一个 `balance` 值为 1000 的 `Account` 对象。\n- 实例化另一个 `balance`\
  \ 值为 500 的 `Account` 对象。\n- 调用 `origin` 对象的 `transfer` 方法，传入 200 和 `recipient` 对象。\n\
  - 打印 `origin` 对象的 `balance` 值。\n\n\n\n\n- 你也知道对象变量并不是对象本身，而是指向 `JVM` 内存堆中中对象的引用。\n\
  \n# 4 封装、访问修饰符与包结构\n\n**本章涵盖内容**：\n\n封装的概念被许多软件工程师严重地误解了。\n\n如果一个类承担了过多的职责并做了太多的事情，我们也违反了封装的概念。\n\
  \n理解封装的概念对于任何软件工程师来说都是一个改变游戏规则的因素。仅仅通过使用这个概念，代码就会变得非常灵活且易于维护。\n\n仅仅限制属性和方法不足以创建一个封装良好的系统。\n\
  \n相反，有必要仔细考虑代码结构，以及系统的不同部分之间将如何相互通信。\n\n## 4.1 面向接口编程\n\n简单来说，面向接口编程是以这种方式进行编程：我们通过有意义的方法在不同的类之间进行通信，这样在需要更改代码时会变得更加容易。\n\
  \n封装的一个真实例子是汽车，我们开车时不需要知道汽车在背后是如何工作的，相反，我们应该访问汽车的“接口”（方法）来驾驶，例如 `drive`（行驶）、`switchGear`（换挡）、`break`（刹车）、`turnLeft`（左转）、`turnRight`（右转）。我们不需要知道汽车的所有特定组件。我们需要知道汽车能做什么和不能做什么，而不是汽车是如何工作的。\n\
  \n汽车的各个部分已经封装好了，只有当我们需要维护或修复汽车的某些特定部分时，才需要详细了解它。\n\n在面向对象的范式中，我们可以使用同样的类比：我们不应该暴露类的重要属性，而应该创建一个接口（有意义的方法），这个接口将清晰地说明它应该实现什么，而不是它是如何工作的。\n\
  \n汽车的接口非常直观，例如，我们知道如果访问 `accelerate`（加速）方法，汽车就会移动；如果访问 `turnRight` 方法，我们也会向右转。\n\
  \n通过应用将类的内部功能隐藏，并将对系统其他部分具有意义的方法进行外部化的相同原则，我们就在使用封装。\n\n让我们来看看代码中的 `Car` 类类示例：\n\
  \n```\n 1 public class Car {\n 2 \n 3     // 这里是属性，例如：engine, wheels, radiator bean,\
  \ fuel distribution pi\\\n 4 pe...\n 5 \n 6     public void accelerate() {\n 7 \
  \        System.out.println(\"Accelerating..\");\n 8     }\n 9     public void breakAcceleration()\
  \ {\n10         System.out.println(\"Breaking...\");\n11     }\n 12     public void\
  \ turnLeft() {\n13         System.out.println(\"Turning left...\");\n14     }\n\
  \ 15     public void turnRight() {\n16         System.out.println(\"Turning right...\"\
  );\n17     }\n 18 \n19 }\n```\n\n如你从上面的代码中所看到的，我们隐藏了属性，只暴露了我们应该交互的接口方法。这应该足够了，我们不需要知道一个类在背后是如何工作的，只需要知道它能做什么即可。\n\
  \n## 4.2 什么是 getters 和 setters？以及如何使用它们？\n\n使用 getters 和 setters 的目的是暴露私有属性以便进行读取和写入。\n\
  \n在实际应用中，对所有内容都使用 getters 和 setters 在某种程度上是常见的，但同时也是错误的，因为开发者往往破坏了封装的概念。\n\n我们不应该为每个属性创建\
  \ getters 和 setters，相反，我们应该考虑暴露是否真的必要。\n\n让我们来看一个 `Customer` 类通过 getter 和 setter\
  \ 暴露所有字段的示例：\n\n```\n 1 public class Customer {\n 2 \n 3     private String name;\n\
  \ 4     private String dateOfBirth;\n 5     private String address;\n 6 \n 7   \
  \  public String getName() {\n 8         return name;\n 9     }\n10 \n11     public\
  \ void setName(String name) {\n12         this.name = name;\n13     }\n 14 \n15\
  \     public String getDateOfBirth() {\n16         return dateOfBirth;\n17     }\n\
  \ 18 \n19     public void setDateOfBirth(String dateOfBirth) {\n20         this.dateOfBirth\
  \ = dateOfBirth;\n21     }\n 22 \n23     public String getAddress() {\n24      \
  \   return address;\n25     }\n 26 \n27     public void setAddress(String address)\
  \ {\n28         this.address = address;\n29     }\n30 \n31 }\n```\n\n更好的做法是让 `Customer`\
  \ 类更具限制性，不允许使用 setter 方法，并将每个属性转为 `final`。为了做到这一点，我们必须在构造函数中传递值：\n\n```\n 1 public\
  \ class MoreRestrictiveCustomer {\n 2     \n 3     private final String name;\n\
  \ 4     private final String dateOfBirth;\n 5     private final String address;\n\
  \ 6 \n 7     public MoreRestrictiveCustomer(String name, String dateOfBirth, String\
  \ address) {\n 8         this.name = name;\n 9         this.dateOfBirth = dateOfBirth;\n\
  10         this.address = address;\n11     }\n 12 \n13     public String getName()\
  \ {\n14         return name;\n15     }\n 16 \n17     public String getDateOfBirth()\
  \ {\n18         return dateOfBirth;\n19     }\n20     }\n21     public String getAddress()\
  \ {\n22         return address;\n23     }\n24     \n25 }\n```\n\n注意，在构造函数中传递值的方法在最多三个参数时是好的，否则就会变得混乱。\n\
  \n让我们在下一节中看看可以采用什么方法来创建复杂对象。\n\n## 4.3 Builder 模式\n\n对于开发简单的代码，我们不需要太复杂，但当代码变得复杂且连接部分变得困难时，我们需要使用更高级的技术，而设计模式是非常强大的技术。\n\
  \n设计模式是用优雅的方式解决不同代码情况的常用模式。\n\n为了解决“构造函数参数过多”以及许多问题，`Builder` 设计模式是由经验丰富的开发者创建的。\n\
  \n`Builder` 创建型模式非常有名且有用，在实际项目中被广泛使用。使用 Builder 模式的一种强大方法是使对象不可变，这意味着一旦创建了对象，状态（属性）就无法更改。\n\
  \n**使用 Builder 模式的优势是**：\n\n- 不可变性：没有方法更改对象的值（在数据对象中使用 setter 可能是错误的根源，因为很容易更改值）\n\
  - 可读性：使用 builder 模式构建数据对象要清晰得多\n- 灵活性：我们可以轻松更改构建器的结构，因为它封装在正在使用的数据对象内部。\n\n### 4.3.1\
  \ 何时使用 Builder 模式？\n\n- 当数据对象的构建复杂且需要大量初始化时\n- 当构造函数接收超过 3 个参数时\n- 当数据对象中有许多 setter\
  \ 时\n- 当我们不希望数据在整个系统中被更改时\n\n现在我们已经了 builder 模式的优势以及适用场景，让我们分析一个代码示例，看看该模式在实践中是如何工作的。\n\
  \n在以下代码中，我们将有一个名为 `BigBoss` 的类，带有 5 个私有属性，然后使用一个名为 `Builder` 的静态内部类，具有与 `BigBoss`\
  \ 相同的 5 个属性。然后我们在 `Builder` 内部类中创建公共方法，接收所有值，分配给构建器实例，然后返回 `this` 构建器实例。\n\n\n\n\
  \n在为 5 个 `Builder` 属性赋值后，我们将创建 `build` 方法，该方法将返回并构建 `BigBoss` 对象。为了以不可变的方式实现这一点，我们需要在\
  \ `BigBoss` 类中创建一个私有构造函数，它将接收 `builder`，然后我们将从 `builder` 中接收到的值赋给 `BigBoss` 对象。因此，我们将在\
  \ `build` 方法中通过 `this`（即 `builder` 的当前实例）返回 `BigBoss` 的实例，最终我们就得到了一个完全创建的 `Object`，可以直接使用。\n\
  \n如果解释仍然有些难以理解，通过代码就会变得简单：\n\n```\n 1 public class BigBoss {\n 2 \n 3     private\
  \ final String stealthCloth;\n 4     private final String primaryWeapon;\n 5   \
  \  private final String secondaryWeapon;\n 6     private final String meleeWeapon;\n\
  \ 7     private final String[] medicineItems;\n 8 \n 9     public static class Builder\
  \ {\n10 \n11         private String stealthCloth;\n12         private String primaryWeapon;\n\
  13         private String secondaryWeapon;\n14         private String meleeWeapon;\n\
  15         private String[] medicineItems;\n16 \n17         public Builder(String\
  \ stealthCloth, String primaryWeapon) {\n18             this.stealthCloth = stealthCloth;\n\
  19             this.primaryWeapon = primaryWeapon;\n20         }\n21 \n22      \
  \   Builder withExtraWeapons(String secondaryWeapon, String meleeWeapon) {\n23 \
  \            this.secondaryWeapon = secondaryWeapon;\n24             this.meleeWeapon\
  \ = meleeWeapon;\n25             return this;\n26         }\n27 \n28         Builder\
  \ withMedicineItems(String[] medicineItems) {\n29             this.medicineItems\
  \ = medicineItems;\n30             return this;\n31         }\n32 \n33         public\
  \ BigBoss build() {\n34             return new BigBoss(this);\n35         }\n36\
  \     }\n37 \n38     private BigBoss(Builder builder) {\n39         this.stealthCloth\
  \ = builder.stealthCloth;\n40         this.primaryWeapon = builder.primaryWeapon;\n\
  41         this.secondaryWeapon = builder.secondaryWeapon;\n42         this.meleeWeapon\
  \ = builder.meleeWeapon;\n43         this.medicineItems = builder.medicineItems;\n\
  44     }\n45 \n46   // Getters\n47 }\n```\n\n在接下来的代码中，我们将基本上打印通过使用 `Builder` 模式构建的信息。然后，注意我们还使用了\
  \ `printf` 方法。如果你还不熟悉这个方法，它会打印一个 `String`，其中我们使用占位符 `%s`，在方法的末尾，你可以看到参数必须在那里声明。\n\
  \n```\n 1 public class BuilderExecutor {\n 2 \n 3     public static void main(String[]\
  \ args) {\n 4         BigBoss bigBoss = new BigBoss.Builder(\"Military uniform\"\
  , \"Mk22\")\n 5                 .withExtraWeapons(\"AK-47\", \"CQC knife\")\n 6\
  \                 .withMedicineItems(new String[] {\"First Aid Kit\"})\n 7     \
  \            .build();\n 8 \n 9         System.out.printf(\"%s , %s , %s , %s ,\
  \ %s\", bigBoss.getStealthCloth(),\n10                 bigBoss.getPrimaryWeapon(),\
  \ bigBoss.getSecondaryWeapon(),\n11                 bigBoss.getMeleeWeapon(), bigBoss.getMedicineItems()[0]);\n\
  12     }\n13 \n14 }\n```\n\n为了练习你对 `Builder` 模式的知识，为 `IronMan` 类创建一个具有以下属性的 builder：`name`、`age`、`car`\
  \ 和 `specialWeapon`。然后在其内部创建一个静态内部类 `Builder`，并遵循上述 `Builder` 相同的过程。\n\n然后创建另一个名为\
  \ `IronManBuilderExecutor` 的类并使用你的 builder。尝试一下，如果你想检查，这个练习位于名为 `IronManBuilder`\
  \ 的源码文件中，你可以查看它，但在之前进行练习是很重要的。\n\n## 4.4 在真实项目中组织包\n\n项目项目中包（packages）的主要目的是将一组类组织到具有清晰名称的包中，以便更容易找到类。\n\
  \n想象一下，如果我们必须将所有类都放在一个包中，寻找类和理解系统结构将是糟糕的。在真实的 Java 项目中，很容易找到至少 100 个类，这就是为什么创建包并在那里组织类是如此有用。\n\
  \n### 4.4.1 为什么要分包？\n\n分包极其重要，因为在大型项目中如果没有组织，寻找类将非常困难。即使在小型项目中，以清晰的方式划分和组织代码（将其分组在不同的部分以便易于找到文件）也始终是一个良好的做法。\n\
  \n我们可以用访问博客网站时的“分类”来类比，如果我们寻找分类，找到我们想要的内容要容易得多。例如，如果我们去 `javachallengers` 网站寻找 Java\
  \ streams 类别，我们只会找到与 Java streams 相关的帖子。包也是如此，如果我们想找一个服务（service），我们就去 service 包。\n\
  \n### 4.4.2 如何命名包？\n\n但如何命名包呢？Java 包命名的通用模式是：公司域名、项目名、然后是包名：\n\n`com.javachallengers.service`\n\
  \n你可能会奇怪为什么要使用这种名称？在 Java 中，经常会使用第三方库（一组类），由于这个原因，我们可能会遇到类名冲突。但如果我们使用领域和项目名，永远不会发现重复的类。\n\
  \n假设我们必须处理日期的特殊操作，并使用一个外部库，那么会发生什么？代码将无法编译，会出现冲突。\n\n### 4.4.3 在真实项目创建创建包结构\n\n\
  在真实的 Java 应用中，我们通常会有三个抽象层。资源层（resource layer）拥有 API 端点，通常连接到前端。然后资源层调用 `service`\
  \ 层，该层包含业务逻辑。最后，service 与数据库层代码交互，它通常命名为 `dao` 或 `repository`。\n\n这三个拥有核心代码的主包通常命名为：\n\
  \n```\n1 com.company-name.domain-name.system-package\n2 \n3 com.javachallengers.payment.resources\n\
  4 com.javachallengers.payment.services\n5 com.javachallengers.payment.dao or \n\
  6 com.javachallengers.payment.repository\n```\n\n我们还有其他包来辅助我们的三个主包。其中包含 `config`\
  \ 包，它根据需要的初始值配置 Web 应用，它可能会从我们的应用程序加载资源类，它基本上会初始化整个应用程序。\n\n然后我们还需要一个异常包（exceptions），在其中声明针对业务需求的特定异常。我们将在后续章节中深入探讨异常：\n\
  \n`com.javachallengers.payment.exceptions`\n\n`dtos`（数据传输对象）包是用于通过网络传递数据的对象。我们将\
  \ dto 发送到应用程序的前端：\n\n`com.javachallengers.payment.dtos`\n\n模型层（model）是代表需求的对象，代表了我们应用程序的领域或核心业务数据是如何抽象的：`com.javachallengers.payment.model`\n\
  \n另一个在真实项目中常见且实用的包是 `util`。通常，在 `util` 包中，我们可以为 `services` 创建通用方法以避免代码重复。\n\n`com.javachallengers.payment.util`\n\
  \n\n\n\n上述包在所有项目中并不一定完全相同。例如，如果我们正在处理微服务，有时 `feature-name` 可能会从包名中移除，因为该领域本身就是一个微服务；在其他应用程序中，我们会在系统包之后加上功能名称。让我们来看看这些变化将会是怎样的：\n\
  \n```\n1 com.company-name.brief-project-name.system-package.domain-name\n2 com.company-name.brief-project-name.system-package\n\
  ```\n\n当使用仅负责一个域的微服务时，我个人喜欢以下包结构：\n\n`com.company-name.brief-project-name.system-package`\n\
  \n对于具有多个领域的项目，我喜欢的另一种方案是：：\n\n`com.company-name.brief-project-name.feature-name.system-package`\n\
  \n如果你一直在从事 Java 开发工作，你可能已经发现它与你的项目有许多相似之处；如果你从未见过真实的 Java 应用程序，现在你知道它们通常是如何组织的了，这有助于帮助你理解真实世界中的项目。\n\
  \n## 4.5 封装模式\n\n有许多重要的模式很好地利用了封装概念。这些模式有助于减少耦合（类与类之间的了解程度）并增强内聚性（类的专门化程度）。\n\n\
  让我们探索一些主要的封装概念，以便我们也能学习如何创建封装的代码。\n\n### 4.5.1 MVC 架构模式\n\nMVC 模式将代码分为三层：`Model`（模型）是包含业务数据类的层，我们也可以称之为模型类甚至甚至是领域类。然后是\
  \ `View`（视图）层，它是前端应用程序，拥有用户可以在其中与系统交互的用户界面。最后是 `Controller`（控制器）层，它是 `View` 层和 `Model`\
  \ 层之间的中间层，负责协调调用。\n\n让我们分析下面的图，使 MVC 模式变得清晰：\n\n![](img/mvc_diagram.png)\n\n如你在上图所示，我们正在使用\
  \ MVC 模式，它基本上通过不同的层将应用程序分离。\n\n这是`encapsulation`的一个绝佳例子，每一层都负责处理一个职责：视图层与用户交互，`controller`\
  \ 层负责协调视图和模型层之间的方法调用。模型层则处理业务逻辑和数据库交互。\n\n### 4.5.2 DTO（数据传输对象）的使用\n\n当我们处理 Web\
  \ 项目时，我们必须通过网络协议发送一个 `Object`，在当前的应用程序中，我们经常使用 HTTP 协议。\n\n网络请求和响应是昂贵的资源，我们应该只向前端传递必要的信息，例如。我们也不需要将业务需求的细节暴露给系统的每一个屏幕。\n\
  \n`DTO` 模式很好地解决了这个问题，我们可以向屏幕传递包含所需信息的 `Object`，且这些信息已经准备好被消费。使用 `DTO` 时，我们不应该将业务需求包含其中。\n\
  \n为了总结 DTO 的用法，假设我们有一个名为 `Customer` 的域 `Object`。\n\n```\n 1 public class Customer\
  \ {\n 2 \n 3     private String name;\n 4     private String dateOfBirth;\n 5  \
  \   private String email;\n 6     private String login;\n 7     \n 8     private\
  \ Product product;\n 9     private Address address;\n10     private PaymentAgreement\
  \ paymentAgreement;\n 11     \n 12     // 用于构建对象的 Builder\n 13     // Getters\n\
  \ 14 \n15 }\n```\n\n那么，假设系统中有一个屏幕，我们只需要显示客户的基本信息，但你是否注意到我们在 `Customer` 域对象中拥有多少的数据？我们有产品、地址和\
  \ `paymentAgreement` 对象，这些将包含许多未未使用的信息，我们还会使用更多的网络资源来传输这个对象。\n\n这就是为什么 `DTO` 模式在向屏幕发送信息时非常有用。在这种情况下，我们只想发送客户的基本信息，我们可以创建以下对象：\n\
  \n```\n 1 public class CustomerDTO implements Serializable { \n 2     private static\
  \ final long serialVersionUID = 1L;\n 3 \n 4     private String name;\n 5     private\
  \ String dateOfBirth;\n 6     private String email;\n 7     private String login;\n\
  \ 8 \n 9     // 用于构建对象的 Builder\n10     // Getters\n 11     \n 12 }\n```\n\n如你在上面的代码所示，我们移除了不需要的额外信息，只在\
  \ `DTO` 中保留了 `Customer` 的基本信息。\n\n## 4.6 访问修饰符\n\n为了应用封装概念，我们需要学习如何使用访问修饰符。有 4 种访问修饰符：\n\
  \n`public` = 完全开放，所有类都可以访问项目中的另一个公共 `class`/`method`/`attribute`\n\n让我们看一个带有 `public`\
  \ 修饰符的代码示例：\n\n```\n 1 // 注意包名\n 2 package com.javachallengers.encapsulation.accessmodifiers;\n\
  \ 3 \n 4 public class ThePublicModifier {\n 5 \n 6     public String publicAttribute;\n\
  \ 7 \n 8     public void thisMethodIsOpenedToBeAccessed() {\n 9         System.out.printf(\"\
  Public method!\");\n10     }\n 11 \n12 }\n```\n\n那么我们可以从另一个包使用 `public` 修饰符，因为 `ThePublicModifier`\
  \ 的所有成员都是公共的：\n\n```\n 1 // 注意包是不同的\n 2 package com.javachallengers.encapsulation.accessmodifiers;\n\
  \ 3 \n 4 import encapsulation.accessmodifiers.ThePublicModifier;\n 5 \n 6 public\
  \ class ThePublicModifierTest {\n 7 \n 8     public static void main(String[] args)\
  \ {\n 9         ThePublicModifier publicModifier = new ThePublicModifier();\n10\
  \         publicModifier.thisMethodIsOpenedToBeAccessed();\n11         System.out.printf(publicModifier.publicAttribute);\n\
  12     }\n13 }\n```\n\n`protected` = `class`/`method`/`attribute` 限制在它们所在的包，当存在继承时，可以在其他包中访问它们。\n\
  \n让我们创建一个具有 `protected` 属性和方法的类，以便在实践中查看它是如何工作的：\n\n```\n 1 package com.javachallengers.encapsulation.accessmodifiers.accesrotected;\n\
  \ 2 \n 3 public class ProtectedModifier {\n 4\n 5     protected String protectedAttribute;\n\
  \ 6 \n 7     protected void print() {\n 8         System.out.println(\"Protected\
  \ method! This method is accessible in this\n 9 package or outside with inheritance\"\
  );\n10     }\n11 }\n```\n\n在下面的代码中，由于我们在 `ProtectedModifier` 相同的包中工作，我们可以访问一切：\n\
  \n```\n 1 package com.javachallengers.encapsulation.accessmodifiers.accesrotected;\n\
  \ 2 \n 3 public class ProtectedModifierTest {\n 4 \n 5     public static void main(String[]\
  \ args) {\n 6         ProtectedModifier protectedModifier = new ProtectedModifier();\n\
  \ 7         System.out.println(protectedModifier.protectedAttribute);\n 8      \
  \   protectedModifier.print();\n 9     }\n10 }\n```\n\n当我们在不同的包中时，我们需要继承来访问受保护成员：\n\
  \n```\n 1 package com.javachallengers.encapsulation.accessmodifiers;\n 2 \n 3 import\
  \ encapsulation.accessmodifiers.accesrotected.ProtectedModifier;\n 4 \n 5 public\
  \ class ProtectedModifierOutsidePackage extends ProtectedModifier {\n 6 \n 7   \
  \  public static void main(String[] args) {\n 8         ProtectedModifier protectedModifier\
  \ = new ProtectedModifier(); \n 9         // protectedModifier.print();        \
  \                  \n10 \n11         // 我们在这里处使用了继承\n12         ProtectedModifierOutsidePackage\
  \ outsidePackage = new  ProtectedModifierOutsi\n13 dePackage();                \
  \             \n14         outsidePackage.print();  \n15         System.out.println(outsidePackage.protectedAttribute);\
  \ // #5    \n16     }\n17 }\n```\n\n*   #1 注意我们在不同的包中 \n*   #2 当我们扩展 `ProtectedModifier`\
  \ 类时，我们正在使用继承\n*   #3 在没有继承的情况下，我们在这里无法访问它\n*   #4 既然我们在这里使用了继承，我们可以访问该方法\n*   #5\
  \ 我们可以通过继承的类访问受保护属性\n\n\n\n\n\n# #5: 我们也可以访问属性\n\n`default` 或当我们不指定修符时 = `class/method/attribute`\
  \ 仅在创建它的包中可以访问。\n\n```java\n 1 package com.javachallengers.encapsulation.accessmodifiers.accesstodefault;\
  \ \n 2 \n3 public class DefaultModifier {\n 4 \n5     String defaultAttribute; //\
  \ #1\n 6 \n7     void print() {           // #2\n 8         System.out.println(\"\
  This method can only be accessed inside the accesstodefa\n9 ult package\");\n10\
  \     }\n11\n```\n\n* #1: 该属性只能在 `accesstodefault` 包内部访问\n\n* #2: 我们没有显式声明我们正在使用默认访问修符。如果我们不使用\
  \ `public`、`protected` 或 `private`，我们使用的就是默认访问修符。\n\n由于我们在同一个包中，我们可以访问所有内容：\n\n\
  ```java\n 1 package com.javachallengers.encapsulation.accessmodifiers.accesstodefault;\n\
  \ 2 \n3 public class DefaultModifierTest {\n 4 \n5     public static void main(String[]\
  \ args) {\n 6         DefaultModifier defaultModifier = new DefaultModifier();\n\
  \ 7         System.out.println(defaultModifier.defaultAttribute);\n 8         defaultModifier.print();\n\
  \ 9     }\n10 }\n```\n\n`private` = `class/method/attribute` 仅在其自身的类中可以访问：\n\n```java\n\
  \ 1 package com.javachallengers.encapsulation.accessmodifiers.accesstodefault;\n\
  \ 2 \n3 public class PrivateModifier {\n 4 \n5     private String privateAttribute;\
  \ // #1\n 6 \n7     private void print() {           // #2\n8     System.out.println(\"\
  This method can only be accessed inside the PrivateModifier class\");\n9     }\n\
  10 }\n```\n\n* #1: 该属性只能在 `PrivateModifier` 类内部使用\n\n* #2: 该方法只能在 `PrivateModifier`\
  \ 类内部访问\n\n### 4.6.1 限制性修符挑战\n\n在接下来的挑战中，你的目标是让类能够成功编译并运行。我们有一个 `LessRestrictiveModifiers`\
  \ 类，它在包中拥有所有的访问修符，还有一个 `LessRestrictiveModifiersExecutor` 类将使用这些属性。\n\n你的目标是在 `LessRestrictiveModifiersExecutor`\
  \ 类的 `main` 方法中将 `// Insert code here` 注释替换为可以运行的代码。\n\n以下哪些选项可以编译并运行？（**可能有多个选项正确**）\n\
  \n```java\n 1 package com.javachallengers.encapsulation.challengers.access;\n 2\
  \ \n3 public class LessRestrictiveModifiers {\n 4 \n5     public String publicVariable\
  \ = \"public\";\n 6     protected String protectedVariable = \"protected\";\n 7\
  \ \n8 }\n10 package com.javachallengers.encapsulation.challengers;\n11 \n12 import\
  \ encapsulation.challengers.access.LessRestrictiveModifiers;\n13 \n14 public class\
  \ LessRestrictiveModifiersExecutor {\n15 \n16     public static void main(String[]\
  \ args) {\n17         LessRestrictiveModifiers challenger = new LessRestrictiveModifiers();\n\
  18         // Insert code here\n19     }\n20 }\n```\n\n1. `System.out.println(challenger.publicVariable);`\n\
  \   `System.out.println(challenger.protectedVariable);`\n\n2. 在 `LessRestrictiveModifiersExecutor`\
  \ 类中继承 `LessRestrictiveModifiers`，并在 `main` 方法中插入以下代码：\n\n```java\n 1     System.out.println(challenger.publicVariable);\
  \                   \n2     System.out.println(new LessRestrictiveModifiers().protectedVariable);\n\
  ```\n\n3. 将 `LessRestrictiveModifiers` 类移动到 `com.javachallengers.encapsulation.challengers`\
  \ 包，将包声明改为移动后的包，并在 `main` 方法中插入以下代码：\n\n```java\n 1     System.out.println(challenger.publicVariable);\
  \              \n2     System.out.println(challenger.protectedVariable);\n```\n\n\
  4. 在 `LessRestrictiveModifiersExecutor` 类中继承 `LessRestrictiveModifiers`，并在 `main`\
  \ 方法中插入以下代码：\n\n```java\n 1     System.out.println(challenger.publicVariable); \
  \                  \n2     System.out.println(challenger.protectedVariable); \n\
  ```\n\n让我们先分析错误的选项，选项 `A` 是错误的，因为我们试图在没有继承的情况下从另一个包访问 `protectedVariable`，因此代码无法编译。另外注意，我们使用的是\
  \ `publicVariable`，它可以在项目的任何地方访问，所以不会产生 `public` 访问修符的编译错误。\n\n然后是比较复杂的选项 `D`，`publicVariable`\
  \ 将正常访问。问题在于 `protectedVariable`。尽管我们使用了继承，但我们直接访问了 `LessRestrictiveModifiers` 类，因此在代码实现中并没有使用继承。我们只是在\
  \ `LessRestrictiveModifiersExecutor` 中声明了它，但完全没有使用。\n\n现在我们分析正确的选项，选项 `B` 是正确的。同样，当我们使用\
  \ `protectedVariable` 时，该选项的有趣点在于我们使用了 `LessRestrictiveModifiers` 类。尽管我们在不同的包中，通过创建一个继承\
  \ `LessRestrictiveModifiers` 的实例，我们可以顺利地访问 `protectedVariable`。\n\n最后，选项 `C` 也是正确的。`publicVariable`\
  \ 将正常访问。该选项的关键点在于我们将 `LessRestrictiveModifiersExecutor` 类移动到与 `LessRestrictiveModifiers`\
  \ 类相同的包中，因此我们能够访问 `protectedVariable`。\n\n### 4.6.2 限制性修符挑战！\n\n在接下来的 Java 挑战中，我们在\
  \ `MoreRestrictiveModifiers` 类中拥有 `private` 和 `default` 变量，然后我们将尝试在 `MoreRestrictiveModifiersExecutor`\
  \ 中使用这些变量，你的目标是通过替换 `MoreRestrictiveModifiersExecutor` 类的 `main` 方法找出哪些代码可以编译。\n\
  \n你可以在 `MoreRestrictiveModifiersExecutor` 类的 `main` 方法中插入的代码选项可以编译并带错误运行？（**可能有多个选项正确**）\n\
  \n```java\n 1 package com.javachallengers.encapsulation.challengers.access;\n 2\
  \ \n3 public class MoreRestrictiveModifiers {\n 4 \n5     private String privateVariable\
  \ = \"private\";\n 6     String defaultVariable = \"default\";\n 7 \n8     public\
  \ static void main(String[] args) {\n 9         // Insert code here\n10     }\n\
  11 \n12 }\n13 \n14 package com.javachallengers.encapsulation.challengers;\n15 \n\
  16 import encapsulation.challengers.access.MoreRestrictiveModifiers;\n17 \n18 public\
  \ class MoreRestrictiveModifiersExecutor {\n19 \n20     public static void main(String[]\
  \ args) {\n21         MoreRestrictiveModifiers challenger = new MoreRestrictiveModifiers();\n\
  22         // Insert code here\n23     }\n24 }\n```\n\nA) 在 `MoreRestrictiveModifiersExecutor`\
  \ 类中插入以下代码：\n\n`System.out.println(challenger.defaultVariable);`\n\n2. 在 `MoreRestrictiveModifiersExecutor`\
  \ 类中插入以下代码：\n\n`System.out.println(challenger.privateVariable);`\n\n3. 将 `MoreRestrictiveModifiersExecutor`\
  \ 类移动到 `com.javachallengers.encapsulation.challengers` 包，将包声明改为移动后的包，并在 `main` 方法中插入以下代码：\n\
  \n`System.out.println(challenger.defaultVariable);`\n\n4. 在 `MoreRestrictiveModifiers`\
  \ 类中插入以下代码：\n\n`System.out.println(challenger.privateVariable);`\n\n**解释：**\n\n\
  让我们先分析错误的选项，选项 `A` 是错误的，因为我们试图从 `defaultVariable` 创建地之外的另一个包访问它。`default` 修符仅允许在同一个包内访问。\n\
  \n\n\n\n选项 `B` 也是错误的，因为我们正尝试访问 Java 中限制最严格的修饰符，即 `private`，它只能在变量创建的类内部被访问。因此，当尝试从另一个类访问\
  \ `private` 属性时，将会产生编译错误。\n\n选项 `C` 是正确的，因为首先将 `MoreRestrictiveModifiersExecutor`\
  \ 类移动到与 `MoreRestrictiveModifiers` 相同的包中，然后我们访问 `defaultVariable`，这将是可以的。\n\n选项\
  \ `D` 也是正确的，因为 `privateVariable` 在它创建的类内部被访问，因此它将能够成功编译并运行。\n\n### 4.6.3 本节核心要点\n\
  \n下表按照限制较松的 `public` 到限制较严格的 `private` 进行组织。\n\n在查看表格之前，让我们分析一下每个修饰符概念。\n\n`public`\
  \ 访问修饰符可以在项目的任何地方被访问。\n\n第二个限制较松的访问修饰符是 `protected`，因为 `protected` 修饰符可以通过继承在包外被访问。`default`\
  \ 修饰符则不能，`protected` 的限制比 `default` 小。\n\n然后 `default` 访问修饰符比 `protected` 更 `restricted`，因为我们只能访问相同包中的成员。\n\
  \n最后，`private` 访问修饰符只能在同一个类中被访问。\n\n| | public | protected | default | private |\
  \ | | | | | | | |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\
  \ --- |\n| 不同包访问 | yes | yes, 仅通过继承 | no | no | | 同一包访问 | yes | yes | yes | no |\n\
  | 同一类内 | yes | yes | yes | yes | | | | | | |\n\n## 4.7 内部类\n\n嵌套类表示了一种特殊的关系，它可以访问外部类的所有成员（数据成员和方法），包括\
  \ `private`。\n\n当我们想要有效使用封装概念时，理解内部类至关重要。内部类被广泛使用的示例是构建器模式（builder pattern）。\n\n\
  有时我们想要为测试创建伪数据，内部类在实现这一目标方面非常有用。\n\n让我们来看看内部类的主要类型：\n\n当我们希望在利用实例 `inner class`\
  \ 时也让外部类被实例化，那么我们应该创建一个成员级内部类（instance inner class）。让我们来看一个如何使用的示例：\n\n```\n 1 public\
  \ class EnclosingInstanceInnerClass {\n 2 \n3     public static void main(String[]\
  \ args) {\n 4         EnclosingInstanceInnerClass enclosingInstanceInnerClass =\
  \ new EnclosingInsta\\\n5 nceInnerClass(); // #1\n 6         enclosingInstanceInnerClass.new\
  \ InstanceInnerClass().print(); // #2\n 7     }\n 8 \n 9     private void print()\
  \ {\n10         System.out.println(\"Text from the enclosing class\");\n11     }\n\
  12 \n13     class InstanceInnerClass {\n14 \n15         public void print() {\n\
  16             new EnclosingInstanceInnerClass().print();\n17         }\n18 \n19\
  \     }\n20 \n21 }\n```\n\n* #1: 我们必须先从外部类创建一个实例\n* #2: 然后我们从外部实例创建一个新实例。我们正在使用\
  \ `EnclosingInstanceInnerClass.new` 这种奇怪的语法，但事实就是如此。我们必须这样做，是因为我们需要来自外部类的新实例来访问成员级内部类。\n\
  \n### 4.7.1 局部内部类 (Local Inner class)\n\n成员级内部类与局部内部类的唯一区别是，局部内部类将在方法中创建并在该方法执行后销毁。让我们在方法内部创建一个内部类：\n\
  \n```\n 1 public class EnclosingLocalInnerClass {\n 2 \n 3     public static void\
  \ main(String[] args) {\n 4         // new CustomPrinter(); It's not possible  \
  \   // #1\n 5         // new LocalInnerClass().new CustomPrinter(); // #2\n 6 \n\
  \ 7         new EnclosingLocalInnerClass().print(); \n 8     }\n 9 \n10     void\
  \ print () {\n11         class LocalInnerClass {\n12             void customPrint()\
  \ {\n13                 System.out.println(\"Customized print\");\n14          \
  \   }\n15         }\n16 \n17         new LocalInnerClass().customPrint();      \
  \     // #3\n18     }\n19 }\n```\n\n* #1: 我们无法访问 `CustomPrinter` 内部类，因为它只能在 print\
  \ 方法内部被访问。\n* #2: 我们无法从外部的 `LocalInnerClass` 创建实例来访问。\n* #3: 只能在 print 方法中访问该内部类\n\
  \n在方法中创建内部类的有用场景是：当我们想要重写或创建一个特定的功能时，可能只需要一个方法来完成一项任务，而我们不想将其暴露在类的外部，例如因为这个内部类应该只在该方法内可见。\n\
  \n### 4.7.2 静态内部类 (Static inner class)\n\n静态内部类在现实项目中被广泛使用，主要用于构建器设计模式。它是一种非常有用的内部类，因为它不依赖外部类的实例化。\n\
  \n```\n 1 public class EnclosingStaticInnerClass {\n 2 \n 3     public static void\
  \ main(String[] args) {\n 4         StaticInnerClass staticInnerClass = new EnclosingStaticInner\\\
  \n5 rClass(); // #1\n 6         staticInnerClass.print();             // #2\n 7\
  \     }\n 8 \n9     static class StaticInnerClass {\n10         void print() {\n\
  11             System.out.println(\"Static class\");\n12         }\n13     }\n14\
  \ }\n```\n\n* #1: 如你所示，我们不需要创建 `EnclosingStaticInnerClass` 的实例，只需要引用类即可。\n* #2:\
  \ 访问私有方法\n\n### 4.7.3 匿名内部类 (Anonymous inner class)\n\n如果我们不想为内部类指定实例名称，而只想使用特定的方法，处理这种情况的方法是使用匿名内部类。\n\
  \n让我们来看一个声明新方法并使用它的示例：\n\n```\n 1 public class AnonymousInnerClass {\n 2 \n 3  \
  \   public static void main(String[] args) {\n 4         new AnonymousInnerClass()\
  \ {             // #1\n 5             private void printSomethingElse() { // #2\n\
  \ 6               System.out.println(\"Printing from the anonymous class\");\n 7\
  \             }\n 8         }.printSomethingElse();                 // #3\n 9 \n\
  10 \n11     }\n12 \n13     private void print() {\n14         System.out.println(\"\
  Print something\");\n15     }\n16 }\n```\n\n* #1: 我们实例化 `AnonymousInnerClass` 对象，然后打开括号来指定我们正在创建一个匿名内部类\n\
  * #2: 然后我们在这个匿名内部类中创建 `printSomethingElse` 方法\n* #3: 最后我们调用 `printSomethingElse()`\
  \ 方法，它将打印：“Printing from the anonymous class”。\n\n匿名内部类最大的优势是我们不需要指定类名称，也不需要将其外部化。当我们只想使用几个方法但不想创建整个类结构时，匿名内部类非常方便。\n\
  \n我们将在未来的章节学习继承和接口时进一步探讨匿名内部类的主题。\n\n\n\n\n```java\npublic class StaticAttribute\
  \ {\n    static String staticEnergy;                       // #1 \n\n    public\
  \ static void main(String... staticAttributes) {\n        StaticAttribute.staticEnergy\
  \ = \"Very Strong\"; // #2\n        System.out.println(staticEnergy);          \
  \   // #3    \n    }\n}\n```\n\n- #1: 该属性在 `memory-heap` 中已经是 `static` 的了。\n- #2:\
  \ 我们可以直接使用 `staticEnergy` 变量，而不需要实例化 `StaticAttributes` 类。在这一行中，我们基本上是将 `\"Very\
  \ Strong\"` 赋值给 `staticEnergy` 变量。\n- #3: 然后我们将打印 `\"Very Strong\"`。\n\n`static`\
  \ 方法的行为与 `static` 变量非常相似。我们也不需要从类中创建实例来使用静态方法，直接使用即可。\n\n让我们来看来看一个代码示例，在其中我们可以通过使用静态方法在不需要实例的情况下立即使用方法：\n\
  \n```java\npublic class StaticMethod {\n    public static void main(String... staticAttributes)\
  \ {\n        StaticMethod.print();     // #1\n    }\n\n    static void print() {\
  \         // #2\n        System.out.println(\"Static method, no instance required\"\
  );\n    }\n}\n```\n\n- #1: 我们立即调用了 `static` 方法，不需要有实例，这就是为什么静态方法也被称为类方法。\n- #2:\
  \ 我们只需要在 print 方法中指定 `static` 关键字即可使其成为 `static` 的。\n\n### 4.8.1 静态方法的局限性\n\n`static`\
  \ 方法只能访问 `static` 成员，这意味着 `static` 方法不能通过 `this` 关键字访问当前实例。这是合理的，因为 `static` 方法是类方法而不是实例类方法，因此我们只能访问类成员。\n\
  \n让我们看看上面的示例在代码中是如何运行的，当我们尝试执行以下代码时：\n\n```java\npublic class StaticAccessToThis\
  \ {\n    private String name;\n\n    public static void main(String[] args) {\n\
  \        print();\n    }\n\n    static void print() {\n        System.out.println(this.name);\
  \ // #1\n    }\n}\n```\n\n- #1: 在这一行将编译错误，因为我们正尝试在静态上下文中访问当前实例。在静态上下文中不存在任何实例。\n\
  \n### 4.8.2 如何在静态上下文使用实例？\n\n在 `static` 方法中使用实例的唯一方法是使用已实例化的对象。由于我们正在操作自己的实例，因此不需要实例上下文，我们直接使用我们的实例即可。\n\
  \n在下面的代码中，我们将看到一个静态方法的示例，它将接收一个对象实例，以演示我们如何在静态方法中使用实例。\n\n```java\npublic class\
  \ InstanceInStaticContext {\n    String value;\n\n    public static void main(String[]\
  \ args) {\n        InstanceInStaticContext instance = new InstanceInStaticContext();\n\
  \        instance.value = \"It's an instance\";\n        print(instance);\n    }\n\
  \n    static void print(InstanceInStaticContext instance) {\n        System.out.println(instance.value);\n\
  \    }\n}\n```\n\n### 4.8.3 静态属性值对所有实例都是相同的\n\n由于静态属性实际上是类属性，当我们创建一个新实例时，该实例不会有一个特定的值，相反，静态值对于所有实例都是相同的。\n\
  \n正如之前提到的，静态变量或方法与实例没有关联，因此，是否创建一个新实例并不重要。\n\n让我们来看一个代码示例，我们创建不同的实例并更改一个静态值，看看会发生什么：\n\
  \n```java\npublic class StaticValuesWithInstances {\n    static String name;\n\n\
  \    public static void main(String[] args) {\n        StaticValuesWithInstances\
  \ staticValues1 = new StaticValuesWithInstances();\n        staticValues1.name =\
  \ \"value1\";          // #1\n\n        StaticValuesWithInstances staticValues2\
  \ = new StaticValuesWithInstances();\n        staticValues2.name = \"value2\"; \
  \         // #2\n\n        System.out.println(staticValues1.name); // #3\n     \
  \   System.out.println(staticValues2.name); // #4\n    }\n}\n```\n\n- #1: 这种语法可行，但并不合适，因为我们不是在操作实例值，而是静态值。变量名将被赋值\
  \ `\"value1\"`。\n- #2: 与上述情况相同，由于我们正在访问 `static` 变量，name 变量实际上是在实例之间共享的。\n- #3:\
  \ 它将打印 `\"value2\"`，因为我们正在使用类属性。\n- #4: 它也会打印 `\"value2\"`。\n\n重要的是，我们应该引用引用引用引用引用引用引用引用引用引用引用引用引用引用引用引用引用引用引用引用引用............\n\
  \n... the the the the the the::``````\n\n..Variable\n2..Method();\n```\n\n### 4.8.3\
  \ 实例与静态的主要区别\n\n- 实例方法可以访问实例\n\n- 实例变量可以访问静态\n\n- 实例变量可以被创建创建\n\n- 实例可以可以实例\n--\
  \ 静态方法可以\n\n\n- 静态静态这些这些到实例\n\n  .....到到到静态静态属性\n\n a---世界我们我们到到到到.......是是是是是是是是是\n\
  \n### 4.8.4 何时使用静态属性\n\n在现实项目中，当我们想要声明常量值时通常使用静态属性。因为无论是否创建新实例，值都是相同的：\n\n```java\n\
  public class StaticAttributesRealWorld {\n    static final String USER_NAME = \"\
  javachengers\"; // #1\n\n    public static void main(String[] args) {\n        System.out.println(USER_NAME);\
  \                 // #2\n    }\n}\n```\n\n- #1: 我们使用了变量 `USER_NAME`，并使用 `final`\
  \ 关键字来指定它是常量，不可更改。最后，它是 `static` 变量，意味着不需要创建实例即可访问它。\n- #2: 在没有实例的情况下使用了静态 变量\n\n\
  ### 4.8.4 静态方法\n\n与静态属性类似，静态方法遵循相同的概念。`static` 方法可以在没有实例的情况下调用。\n\n在下面的代码中，我们将探索一个打印静态静态方法的调用。注意我们也不需要创建实例来调用静态方法：\n\
  \n```java\npublic class StaticMethod {\n    static void print() {      // #1\n \
  \       System.out.println(\"Static method, no instance required\"); // #2\n   \
  \ }\n\n    public static void main(String... staticAttributes) {\n        StaticMethod.print();\
  \ // #3\n    }\n}\n```\n\n- #1: 定义静态 print 方法\n- #2: 打印消息\n- #3: 注意我们正在引用类名，这是一个良好的习惯，因为通过代码可以意识到这是一个\
  \ `static` 方法。然后我们调用了 print 方法，最后打印“Static method, no instance required”。\n\n###\
  \ 4.8.5 何时使用静态方法？\n\n你可以问自己，此方法是否可以在不依赖任何实例变量状态的情况下调用？此方法是否足够简单？只有这样，你才应该决定创建一个\
  \ `static` 方法。\n\n\n\n\n\n关于使用静态方法，另一个非常重要的考虑点是实现 `Unit Tests`（单元测试）会变得困难。当我们使用静态方法时，要以隔离的方式测试方法会困难。`Unit\
  \ Tests` 不在本书的讨论范围内，但记住这个原则同样重要，这样我们才能做出最佳决策。\n\n有很多优秀的 `JDK` 示例可以参考。`Math` 类就是一个完美的例子。让我们来看看一些方法的实际运行：\n\
  \n```\n 1 public class MathUsage {\n 2 \n 3     public static void main(String[]\
  \ args) {\n 4         System.out.println(Math.pow(2, 2));         // #1\n 5    \
  \     System.out.println(Math.max(2, 7));         // #2\n 6         System.out.println(Math.min(1,\
  \ 7));         # #3\n 7         System.out.println(Math.ceil(3.1));         // #4\n\
  \ 8         System.out.println(Math.floor(3.6));        // #5\n 9         System.out.println(Math.decrementExact(2));\
  \ // #6\n10         System.out.println(Math.random());          // #7\n11     }\n\
  \ 12 \n13 }\n```\n\n* #1: 我们正在对 `2` 进行 `2` 次幂运算，因此它将打印 `4`\n* #2: 我们正在验证哪个数字更大，`2`\
  \ 还是 `7`，因此它将打印 `7`\n* #3: 我们正在验证哪个数字更小，`1` 还是 `7`，因此它将打印 `1`\n* #4: 我们将数字 `3.1`\
  \ 取整到下一个整数，因此它将打印 `4`\n* #5: 我们将数字 `3.6`向下取整，因此它将打印 `3`\n* #6: 我们将精确数字 `2` 减 1，因此它将打印\
  \ `1`\n* #7: 我们正在打印一个 `random` 数字\n\n如你所见，在 `Math` 类的示例中，我们拥有简单且清晰的方法，不需要任何对象状态，我们只需将变量传递给每个方法，每个方法返回我们想要的结果。如果有像\
  \ `Math` 类类似的情况，使用静态方法是一个好主意。记住，我们通常使用静态方法来创建工具方法。\n\n这种查看 `JDK` 代码的技巧是一个很好的习惯，我们可以将其应用于应用程序中任何我们想要使用的功能。通过查看\
  \ `JDK` 代码，我们可以学到很多东西。\n\n### 4.8.6 静态 Simpson Java 挑战\n\n在接下来的挑战中，我们将探索实例变量和静态变量的主要原理。你能猜到以下挑战的输出是什么吗？\n\
  \n```\n 1 public class StaticSimpson {\n 2 \n 3     String name;\n 4     static\
  \ int age;\n 5 \n 6     public static void main(String[] args) {\n 7         StaticSimpson\
  \ homer = new StaticSimpson();\n 8         homer.name = \"Homer\";\n 9         homer.age\
  \ = 35;\n10 \n11         StaticSimpson bart = new StaticSimpson();\n12         bart.name\
  \ = \"Bart\";\n13         bart.age = 10;\n14         bart.age++;\n15 \n16      \
  \   System.out.println(homer.name + bart.name);\n17         System.out.println(homer.age\
  \ + bart.age);\n18     }\n19 }\n```\n\n1. BartBart 45\n2. HomerBart 45\n3. HomerHomer\
  \ 22\n4. HomerBart 22\n\n**解释**：\n\n这个挑战的要点是，实例值属于实例，而静态值属于类。\n\n注意 `name` 变量是一个实例变量，这意味着\
  \ `homer` 实例在 `name` 上的值将为 `\"Homer\"`，而 `bart` 将将为 `\"Bart\"`。\n\n在 `age` 变量中，我们处理的是类变量，因此当我们在\
  \ `homer` 和 `bart` 中更改 `age` 变量时，这没有关系，静态变量对所有实例都是相同的，因为它是一个类变量。因此，当我们把类变量 `age`\
  \ 改为 `10` 时，每个实例的该值都将是 `10`。\n\n只需记住，通过实例变量访问静态变量是一种坏做法，在开发代码时永远不要这样做，创建这个挑战就是为了帮助你理解实例和静态概念。你应该像这样使用静态变量，`StaticSimpson.age`。\n\
  \n这个挑战的最后一个细节是我们还对 `age` 变量加了 1，那么对于 `homer` 和 `bart` 来说它将变为 11。\n\n结论是正确的选项是：\n\
  \n```\n1 D) HomerBart\n2    22\n```\n\n## 4.9 实例块和静态块\n\n在 Java 中初始化变量或执行逻辑有多种方法。通过使用实例块和静态块，我们可以轻松地实现。\n\
  \n### 4.9.1 实例块\n\n实例块可能有助于初始化变量。这个概念在实际应用中并不常用，但了解它以及如何使用它是很有用的。\n\n实例块会在实例创建时被初始化。\n\
  \n让我们先看看实例块的实际用途，之后我们将讨论何时使用它。\n\n实例块会在实例创建时初始化。实例块的作用与构造函数相似，区别在于实例块会在构造函数之前执行。\n\
  \n在下面的示例中，我们将调用 `print` 方法并初始化 `name` 变量，注意执行顺序如下：\n\n```\n 1 class InstanceBlockPrint\
  \ {\n 2 \n 3     String name;\n 4     {                           // #2\n 5    \
  \     this.print();           // #3\n 6     }                           // #4\n\
  \ 7 \n 8     InstanceBlockPrint() {      // #5\n 9         name = \"Challenger\"\
  ;    // #6\n10     }\n 11 \n12     public static void main(String[] args) {\n13\
  \         InstanceBlockPrint instanceBlock = new InstanceBlockPrint(); // #1\n14\
  \         instanceBlock.print();                                       // #7\n15\
  \     }\n16 \n17     void print() {\n18         System.out.println(name);\n19  \
  \   }\n20 }\n```\n\n* #1: 最初执行是实例化 `InstanceBlockPrint` 类。\n* #2: 实例块开始 `{`。\n*\
  \ #3: 我们调用 `print()` 方法，此时会打印 null。\n* #4: 使用 `}` 结束实例块。\n* #5: 构造函数，现在会被调用。\n*\
  \ #6: 现在我们将 `name` 变量赋值为 `\"Challenger\"`。\n* #7: 最后我们调用 `instanceBlock.print()`，打印出\
  \ `\"Challenger\"`。\n\n### 4.9.2 何时使用实例块？\n\n通常，构造函数用于初始化实例变量，但很多时候我们在初始化之前添加复杂的逻辑。\n\
  \n当我们想在构造函数执行之前执行逻辑时，实例块非常方便。通过合理利用实例块，我们可以封装逻辑执行。\n\n### 4.9.3 静态块\n\n静态块的作用与实例块相同，用于初始化变量或执行逻辑。但两个块的主要区别在于静态块加载的时机。\n\
  \n我们在访问类时就会执行静态块。而实例块只有在创建实例时才会调用。\n\n静态块会在实例化和构造函数调用之前初始化。\n\n让我们来看看静态块的实际示例。我们将创建一个静态块，并在主方法中仅访问类名，这足以触发静态块的调用了。\n\
  \n```\n 1 public class StaticBlockPrint {\n 2 \n 3     static String name;     \
  \      // #1\n 4 \n 5     static {                      // #2\n 6         name =\
  \ \"Challenger\";      // #3\n 7     }\n 8 \n 9     public static void main(String[]\
  \ args) {\n10         System.out.println(StaticBlockPrint.name); // #4\n11     }\n\
  \ 12 }\n```\n\n* #1: 静态变量 `name` 的声明。\n* #2: 静态块开始。\n* #3: 将 `name` 赋值为 `\"Challenger\"\
  `。\n\n\n\n\n\n# #4: 打印名称变量，注意 `StaticBlockPrint` 类会在我们首次以某种方式访问该类时被加载。在我们的情况下，我们访问了类变量，这触发了变量声明，随后触发了静态块的执行。因此输出将是\
  \ `\"Challenger\"`。\n\n## 4.9.4 马里奥兄弟区块挑战\n\n在接下来的挑战中，我们将探索实例化新类时实例块和 `static` 静态块的概念。你的目标是确定运行\
  \ main 方法时以下挑战的输出结果：\n\n```\n 1 public class MarioBrosBlockChallenge {\n 2 \n3 \
  \    {\n 4         System.out.print(\"instance \");\n 5     }\n 6 \n7     static\
  \ {\n 8         System.out.print(\"static \");\n 9     }\n10 \n11     MarioBrosBlockChallenge()\
  \ {\n12         System.out.print(\"constructor \");\n13     }\n14 \n15     public\
  \ static void main(String... args) {\n16         System.out.print(\"Jump into \"\
  );\n17         new MarioBrosBlockChallenge();\n18         new MarioBrosBlockChallenge();\n\
  19         System.out.print(\"blocks.\");\n20     }\n21 }\n```\n\n1. static Jump\
  \ into instance constructor instance constructor blocks.\n2. Jump into static instance\
  \ constructor static instance constructor blocks.\n3. Jump into static constructor\
  \ instance constructor instance blocks.\n4. static Jump into constructor instance\
  \ static constructor instance blocks.\n\n**解释**：\n\n当我们处理静态块时，请记住它只会针对类执行，而不是针对每个实例执行。还要注意，静态块将始终是第一个执行的代码，因为类必须先被加载，没有类就不可能创建实例，甚至无法调用\
  \ `main` 方法。因此，第一个执行的文本将是 static。\n\n然后，在我们加载 `MarioBrosBlockChallenge` 类以及它的静态块后，会打印\
  \ main 方法中的第一个文本，然后是 Jump into。\n\n在接下来的行中，我们正在实例化 `MarioBrosBlockChallenge` 类，这将调用我们的实例块并打印\
  \ instance。\n\n在实例块执行之后，将调用构造函数，因此打印 constructor。\n\n然后我们将再次创建一个 `MarioBrosBlockChallenge`\
  \ 实例，请记住，由于类已经加载（类只会被加载一次），静态块不会再次执行。因此，只有实例块和构造函数会被执行，并打印以下内容：instance 和 constructor。\n\
  \n结论是此挑战的正确选项是：\n\nA - static Jump into instance constructor instance constructor\
  \ blocks.\n\n## 4.10 小型真实世界项目挑战\n\n你在这个挑战中的目标是使用封装的概念创建一个小型真实世界应用。\n\n在开始此挑战之前，请记住以下示例是虚构的，并且取决于未来的概念才能在真实世界中达到“完美”。此挑战的重点是让你清晰地理解封装的概念，而不是非要创建一个“真实的应用程序”。\n\
