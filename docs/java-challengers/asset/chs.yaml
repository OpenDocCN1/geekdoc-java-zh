  现实中的一切都必须按照定义的逻辑执行，当我们想要刷牙时，打开浴室柜，拿出刷子，挤上牙膏，把刷子放入嘴里，刷到牙齿干净，洗刷子，漱口，然后把刷子放回柜子。\n\n\
