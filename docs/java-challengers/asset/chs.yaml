  \ |\n| 变量名可以以 _ 开头 | `int _homerAge = 35;` |\n| 变量名可以以 $ 开头 | `int $homerAge = 35;`\
  \ |\n| 在第一个字符之后可以使用数字 | `int homerAge007 = 35;` |\n\n现在来看看 Java 中无效的变量名：\n\n| 场景\
