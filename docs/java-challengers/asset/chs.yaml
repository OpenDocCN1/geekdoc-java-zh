  \ `homerSweets` 指向对象，`println` 指令会输出 \"Pudding\"。\n\n### 3.6.1 Link 的冒险数组引用\n\n\
  在这个挑战中，一个大小为 `5` 的数组对象被创建并填充，然后该数组被赋值给另一个变量并在方法中进行操作。你能猜出输出是什么吗？\n\n```java\n1 public\
