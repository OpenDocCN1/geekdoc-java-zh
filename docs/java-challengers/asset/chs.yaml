  \n*   #A: 我们收集了一个包含英雄名字和战斗力的 `map`。\n\n*   #B: 我们创建了一个 `LinkedHashMap`。\n\n*   #C:\
  \ 使用 `Map.Entry.<String, Integer>comparingByValue().reversed()` 进行排序。\n\n```\n1\
  \ public static <K, V extends Comparable<? super V>> \n                 Comparator<Map.Entry<K,\
  \ V>> comparingByValue() {\n2     return (c1, c2) -> c1.getValue().compareTo(c2.getValue());\n\
  3 }\n```\n\n然后对 `Comparator` 对象使用 `reversed()` 方法来反转排序。\n\n*   #D: 将结果填充到 `highestHeroesFightPower`。\n\
  \n## 13.9 总结\n\n恭喜！在本章中，你学习了 `streams` 的主要原理，这些原理将帮助你通过使用 `streams` 的力量构建更好的代码：\n\
  \n*   Streams 是一个流水线\n*   Streams 是不可变的（immutable）\n*   中间操作在没有终端操作的情况下什么都不做\n*\
  \   终端操作每个 Stream 对象只能使用一次\n\n回顾一下，在本章中你学习了使用 `stream` 的重要方法：\n\n### 中间操作方法\n\n\
  *   `filter`: 过滤流中的元素\n*   `limit`: 限制流中的元素数量\n*   `sorted`: 对流进行排序\n*   `peek`:\
  \ 调试流中的元素\n*   `distinct`: 对流中的元素去重\n*   `map`: 使用流转换数据\n*   `flatMap`: 在数组内读取并处理数组\n\
  *   `skip`: 在遍历集合时跳过元素\n*   `takeWhile`: 在条件为真时获取流元素\n*   `dropWhile`: 在条件为真时丢弃流元素\n\
  \n### 终端操作方法\n\n*   `forEach`: 遍历并对每个元素执行操作\n*   `forEachOrdered`: 遍历并对顺序的元素执行操作\n\
  *   `collect`: 从流中收集 `list`、`set`、`map`、`array`\n*   `reduce`: 并行或顺序合并数据\n*   `count`:\
  \ 统计流中元素的数量\n*   `sum`: 对流中的元素求和\n*   `min`: 获取流中的最小值\n*   `max`: 获取流中的最大值\n*  \
  \ `toArray`: 将流中的元素转换为数组\n*   `findFirst`: 找到流中的第一个元素\n*   `findAny`: 找到流中的任意元素\n\
  *   `anyMatch`: 使用条件判断是否任意一个元素匹配\n*   `allMatch`: 使用条件判断所有元素是否都匹配\n\n\n\n\n\n* 使用\
  \ `noneMatch` 来匹配没有任何元素符合特定条件的条件\n\n# Java 的 14 个新特性\n\n**本章涵盖**：\n\n* Java 发布策略\n\
  * 模块\n* 使用 `var` 的类型引用\n* Lambda switch case 语句\n* 模式匹配 (Pattern Matching)\n* records\n\
  * 密封类 (Sealed Classes)\n* 文本块 (Text-blocks)\n* 总共 **7 个 Java 代码挑战题**\n\n## 14.1\
  \ Java 发布策略\n\n从 Java 10 开始，Java 每 6 个月发布一个新版本，这使得 Java 能够更快地发布新特性。\n\n在深入研究新 版本的发布之前，让我们来看看最重要的\
  \ Java 供应商有哪些：\n\n* Oracle (Oracle JDK)，个人使用免费，但商业用途免费\n* AdoptOpenJDK，商业用途免费\n\
  * Amazon (Corretto)\n* Red Hat\n* Azul\n* Alibaba\n* BellSoft (Liberica)\n* SAP\
  \ (SapMachine)\n\nJava 的发布版本分为两种类型：\n\n* 短期版本 (Short-Term Version)：该版本将不再由 Oracle、Azul、Amazon\
  \ 等 Java 供应商提供支持。这意味着不会再创建安全补丁或更新。\n\n* 长期版本 (Long-Term Version)：Java 供应商将对此版本进行更长时间的维护和支持，例如，最新的\
  \ LTS 版本是 2021 年发布的 Java 17，它将支持到 2026 年 9 月，并可能延长到 2029 年 9 月。\n\n关于 Java 新版本的另一个重要概念是，现在我们有了\
  \ `preview`（预览）特性和 `standard`（标准）特性：\n\n* `preview`：由于现在每 6 个月发布一次 Java 新版本，将新特性作为标准特性添加变得困难。因此，添加到\
  \ Java 中的特性通常会被视为 `preview`。简单来说，`preview` 特性可能会在后续发布中发生变化的特性，这意味着例如在生产环境中使用 `preview`\
  \ 特性并不是一个好主意。\n\n* `standard`：当一个特性成为标准特性时，意味着没有更改关键字或类似内容的计划。因此，它可以安全地在生产环境中使用。\n\
  \n最后，为了对使用哪个 Java 版本做出明智决定，选择长期支持版本是非常重要的，因为 Java 供应商会提供安全补丁和支持。这样你就不需要每 6 个月更改一次\
  \ Java 版本。\n\n## 14.2 模块简介\n\n非常重要的特性 `Jigsaw` 或 `JPMS`（Java 平台模块系统）在 Java 9 中引入！简单来说，它基本上是模块的概念，现在这个概念被称为\
  \ `Java modules`（Java 模块），更加简洁简单。\n\n为了构建轻量级应用并在 Java 应用中实现真正的封装，使用模块是至关重要的。为什么要实现真正的封装？因为通过模块，可以限制仅允许我们想要暴露的包使用。此外，还可以限制对\
  \ `private` 成员的反射访问。\n\n通过模块，还可以显式地声明哪些内容被暴露出来，以及从其他模块使用了哪些内容，使得应用程序更易维护。原因很简单，我们对不应被暴露的代码限制得越多，我们对代码的控制就越越大。\n\
  \n在 Java 9 之前，Java 源代码是一个巨大的单体结构（monolith），这使得难以维护或添加特性。通过模块功能，JDK 被拆分为多个模块，这样通过新特性扩展\
  \ `Java` 也变得更加容易。\n\n此外，我们还可以让自己的 Java 应用模块化。因此，我们不再需要为每个 Java 项目使用整个 Java 生态系统，并且可以控制哪些代码会被暴露给其他模块。\n\
  \n在模块出现之前，我们有一个巨大的 classpath 文件，在其中组织 Java 项目中的所有依赖。对于大型 Java 应用来说，classpath 通常是令而畏惧且困惑的。在模块模块时，不再需要使用\
  \ classpath。\n\n为了简明地解释模块，我们可以将其视为一种以组织且可控的方式共享多个包的方法。这在本章接下来的章节中将会变得更加清晰。\n\n###\
  \ 14.2.1 Jar 文件 `!=` 模块\n\n尽管我们可以 jar 包添加到 Java 应用的 classpath 中，但这并不意味着它成为了一个模块。\n\
  \n从 Java 9 的模块开始，我们可以对包进行真正的控制，或者允许哪些模块可以使用它。我们可以导入模块、导出包，如果需要，还可以允许特定模块对模块的 `private`\
  \ 成员进行反射访问。\n\n虽然有 `Maven` 和 `Gradle` 等构建自动化工具，但它们并没有真正解决在 `Java` 代码中内部控制启用或禁用特定包访问的问题。这些是构建在\
  \ `Java` 之上的工具，因此它们无法提供对 Java 应用内部导出或导入代码的细粒度控制。\n\n## 14.3 Java JDK Base Modules\n\
  \n在 Java 9 版本之前，`JDK` 是一个巨大的单体结构。以那种方式添加新特性非常困难。为了简化 `JDK` 并拆分为更小的部分，现在我们有了许多内聚的模块，使我们能够仅在使用应用程序所需的模块。\n\
  \n`java.base` 模块是核心模块，包含了最常用的 `Java` 类。下载 `JDK` 时，可以看到每个 `Java` 模块使用了哪些类。注意在 `Java\
  \ 17` 的以下文件夹中有一个名为 `src` 的压缩文件（路径取决于你下载的 `JDK` 版本）：\n\n在 MacOS 上：\n\n`Java/JavaVirtualMachines/17.0.1/Contents/Home/lib`\n\
  \n在 Windows 上：\n`/jdk-17.0.2/lib`\n\n这些是使用 `java.base` 时可以访问的模块：\n\n`io`, `util`,\
  \ `lang`, `math`, `net`, `nio`, `security`, `text`, `time`, `util`.\n\n### 14.3.1\
