  anyString\"::contains`，因为我们只需要传递一个参数并返回一个布尔值，就像 `contains` 方法期望的那样。\n\n5 - 答案是 B。原因是后面的代码\
  \ `(saber) -> System.out.println(\"Moe uses the \" + saber);` 只消耗了 `saber` 而没有返回任何值。这符合\
