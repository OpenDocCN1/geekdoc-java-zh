  \n在操作 `Deque` 时，我们可以使用 `Queue` 的所有方法。然而，如果我们的意图仅使用 `Queue` 的功能，最好通过用 `Queue` 声明我们的列表来使其显式化。\n\
  \n如果我们把 `Queue` 比作银行里排队的人，它就很容易理解。第一个被接待的人将第一个离开。\n\n______\n\n\U0001F629 \U0001F611\
  \ \U0001F610 | 银行 |\n\n/|\\ /|\\ /|\\ | |\n\n/ \\ / \\ / \\ | |\n\n↑\n\n**先入 (First-in)**\n\
  \n______\n\n\U0001F629 \U0001F610 | 银行 |\n\n/|\\ /|\\ | |\n\n/ \\ / \\ | |\n\n\U0001F600\
  \n\n/|\\\n\n/ \\\n\n↑\n\n**后出 (First-out)**\n\n现在你已经理解了 `queue` 的原理，让我们来看下使用 `ArrayDeque`\
  \ 实现的代码示例。`ArrayDeque` 不是线程安全的，而且在使用 `queue` 功能时比 `LinkedList` 更快：\n\n```\n 1 import\
  \ java.util.ArrayDeque;\n 2 import java.util.Queue;\n 3 \n 4 public class QueueLinkedList\
  \ {\n 5 \n 6   public static void main(String[] args) {\n 7     Queue<String> heroesQueue\
  \ = new ArrayDeque<>();     // #A\n 8     heroesQueue.offer(\"Wolverine\");  //\
  \ 先入        // #B\n 9     heroesQueue.add(\"Storm\");                          \
  \ // #C\n10     heroesQueue.offer(\"Xavier\");                        \n11     System.out.println(heroesQueue);\n\
  12     heroesQueue.remove();            // 后出       // #D\n13     heroesQueue.poll();\
  \                                 // #E\n14     System.out.println(heroesQueue);\n\
  15   }\n16 }\n```\n\n**输出**:\n\n```\n1 [Wolverine, Storm, Xavier]\n2 [Xavier]\n\
  ```\n\n- #A: 如果我们需要，可以使用 `LinkedList` 作为实现，但对于 `Queue` 的情况，`ArrayDeque` 更快。\n- #B:\
  \ 我们正在使用 `offer` 方法，它将简单地将元素添加到尾部，换说，添加到 `queue` 的末尾。如果元素成功插入 `queue`，则返回 `true`，否则取决于\
  \ `queue` 元素的容量返回 `false`。\n- #C: 我们也使用了 `add` 方法，它与 `offer` 方法类似，也会将元素添加到 `queue`\
  \ 的尾部。`add` 方法的区别在于，如果 `queue` 中没有可用容量，它将抛出 `IllegalStateException`。\n- #D: `remove`\
  \ 方法将检索并移除队列的头部元素，换说，它移除第一个元素。如果 `queue` 为空，它将抛出 `NoSuchElementException`。在这种情况下，它将移除\
  \ `\"Wolverine\"`。\n- #E: `poll` 方法将检索并移除队列的头部元素，换说，第一个元素。`poll` 方法不像 `remove` 方法那样抛出\
  \ `IllegalStateException`。相反，如果 `queue` 为空，它返回 `null`。在这次方法调用中，`\"Storm\"` 将移除。\n\
