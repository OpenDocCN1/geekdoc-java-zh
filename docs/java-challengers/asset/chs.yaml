  \n**输出**：\n\n### 13.8.8 排序 map 元素\n\n也可以按值对 `map` 中的元素进行排序。在下面的代码中，我们将以以 `name`\
  \ 为键、`fightPower` 为值的 `map`，并按最高的 `fightPower` 对英雄进行排序：\n\n```\n 1 List<Hero> heroes\
