  \ 中利用函数式编程的优势！这些概念将极大地提升你的代码质量！\n\n# 10 Optional\n\n## 本章涵盖\n\n*   理解如何使用 `Optional`\
  \ 避免 `NullPointerException`\n*   将值封装进 `Optional` 中\n*   使用 `Optional` 处理 `Exception`\n\
  *   操作存在和不存在的值\n*   `Optional` 的反模式（Anti-Patterns）\n*   使用 `Optional` 过滤数据\n*  \
