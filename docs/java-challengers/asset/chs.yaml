  \n    [3, 1]\n\n**解释**:\n\n注意，我们在这个 Java 代码挑战的底部创建了一个私接口 `Var`，它将在 `main` 方法的实现中使用。接口名称\
  \ `Var` 也可以毫无问题地使用。\n\n在 `main` 方法的第一条语句中，我们赋值了一个 `Var` 的匿名内部类，该类通过拼接两个 `String`\
