  \ `var` 即可。\n\n### 14.11.5 Var Intruder Java 挑战\n\n在接下来的 Java 代码挑战中，我们将探索 `var`\
  \ 的一些关键特性，结合变量赋值、Lambda 表达式、匿名内部类等。因此，你认为运行以下代码时会发生什么？\n\n```\n 1 import javax.annotation.Nonnull;\n\
  \ 2 import java.util.ArrayList;\n 3 import java.util.Arrays;\n 4 \n 5 public class\
  \ TurnAboutIntruderChallenge {\n 6     public static void main(String... awayTeam){\n\
  \ 7         var var = new Var() { public String collide(String c1, String c2) \n\
  \ 8                             { return  c1 + c2; }};\n 9         var drLester\
  \ = (Var) null;\n10         drLester = var;\n11 \n12         Var reliantMistake\
  \ = (@Nonnull var s1, final var s2) -> \n13                                String.join(\"\
  ;\", s1, s2, \"Darth Vader\");\n14 \n15         var numbers = new ArrayList<>(Arrays.asList(3,\
  \ 2, 1));\n16         numbers.remove(Integer.valueOf(2));\n17 \n18         System.out.println(var.collide(\"\
  Kirk\", \"Spock\"));\n19         System.out.println(reliantMistake.collide(\"Khan\"\
  , \"Borg\"));\n20         System.out.println(drLester.getClass().getName());\n21\
  \         System.out.println(numbers);\n22     }\n23 \n24     private interface\
  \ Var { String collide(String c1, String c2); }\n25 }\n```\n\n1. 第 9 行出现编译错误\n\n\
  2. SpockKirk\n\n    Khan;Borg;Darth Vader\n\n    TurnAboutIntruderChallenge$1\n\n\
  \    [3, 2]\n\n3. KirkSpock\n\n    ;KhanBorgDarth Vader\n\n    Var\n\n    [2, 1]\n\
