  \n# 5 方法重载\n\n**本章涵盖内容**：\n\n*   在不破坏代码的情况下修改和扩展遗留方法\n*   创建灵活且易读的 API\n*   创建更好的方法名称\n\
  *   创建简洁且易用的 API 和工具方法\n*   总共 **4 个 Java 代码挑战**\n\n`Overloading`（重载）指的是使用相同方法名但不同参数的能力。这是在\
  \ Java 中使你的方法更灵活的方法。重载是面向对象编程语言中广泛使用的技术，你可以在 JDK 的许多类中看到它的应用。它允许我们在不破坏现有代码的情况下扩展方法的可能性。在本章中，你将看到几个代码示例，它们将阐明这一极其用的语言特性的核心概念和细节。\n\
  \n## 5.1 重载基础\n\n以下示例是方法重载的简单说明。我们两次声明了 `learnAbility` 方法，使用了不同的参数。在第二次方法调用中，我们接收了额外的\
  \ `String` 参数 `weapon`：\n\n```\n 1 public class NeoOverloading {\n 2 \n 3     public\
  \ static void main(String... matrixTheme) {\n 4         NeoOverloading neo = new\
  \ NeoOverloading();\n 5         neo.learnAbility(\"Kung-Fu\", 1010101);\n 6    \
  \     neo.learnAbility(\"Taekwondo\", 100010101);\n 7         neo.learnAbility(\"\
  CloseQuartersCombat\", 11100101, \"Uzi\");\n 8         neo.learnAbility(\"Specialized\
  \ weapon training\", 10101, \"RPG\");\n 9     }\n 10 \n 11     void learnAbility(String\
  \ ability, int binaryCode) {\n 12         System.out.printf(\"Neo has learned %s\
  \ with the code %s \\n\", \n 13 ability, binaryCode);\n 14     }\n 15 \n 16    \
  \ void learnAbility(String ability, int binaryCode, String weapon) {\n 17      \
  \   System.out.printf(\"Neo has learned %s with a %s and the code %s \\n\", \n 18\
  \ ability, weapon, binaryCode);\n 19     }\n 20 \n 21 }\n```\n\n因此，我们可以根据情况使用两个或三个参数来调用该方法。\n\
  \n重载在真实系统中被广泛使用，如何应用这一强大概念可以通过简化开发者使用的 API 来提高代码质量。方法重载防止了开发者不得不使用多个方法名称。\n\n###\
  \ 5.1.1 重载可以做什么和不能做什么什么\n\n重载在真实系统中被广泛使用，如何应用这一强大概念可以通过简化开发者使用的 API 来提高代码质量。方法重载防止了开发者不得不使用多个方法名称。\n\
  \n因此，我们可以根据情况使用两个或三个参数来调用该方法。\n\n### 5.1.2 原生数据类型的类型提升\n\n重载在真实系统中被广泛使用，如何应用这一强大概念可以通过简化开发者使用的\
  \ API 来提高代码质量。方法重载防止了开发者不得不使用多个方法名称。\n\n### 5.1.3 使用硬编码的原生类型\n\n重载在真实系统中被广泛使用，如何应用这一强大概念可以通过简化开发者使用的\
  \ API 来提高代码质量。方法重载防止了开发者不得不使用多个方法名称。\n\n\n\n\n\n```java\npublic class MatrixExplicitHardcodedTypes\
  \ {\n\n    public static void main(String... hardcodedPrimitiveTypes) {\n      \
  \  System.out.println(1L); // It's a long\n        System.out.println(1l); // It's\
  \ a long\n        System.out.println(1F); // It's a float\n        System.out.println(1f);\
  \ // It's a float\n        System.out.println(1D); // It's a double\n        System.out.println(1d);\
  \ // It's a double\n    }\n}\n```\n\n后缀 `L` 或 `l` 用于指定 `long`。不建议使用小写字母 `'l'`，因为它与数字\
  \ `'1'` 相似，因此难以阅读。如果我们使用 `F` 或 `f`，该数字将会被解释为 `float`，而 `D` 或 `d` 则告诉编译器它是一个 `double`。作为一个一般规则，如果你需要这样做，最好使用大写字母，因为小写字母在代码中更难阅读。\n\
  \n关于 `char` 类型的一个重要细节是，当 `char` 转换为 int 或 long 时，是通过将其转换为提供字符的 `ASCII` 表值来完成的。例如，假设我们将\
  \ `char` ‘1’ 转换为 int，如下所示：\n\n```java\nchar charMatrixConversion = '1';\nint intMatrixConversion\
  \ = charMatrixConversion;\nSystem.out.println(intMatrixConversion);\n```\n\n输出将是\
  \ `49`，因为 `ASCII` 表中的数字 1 由 `49` 表示。同样的规则也适用于任何其他字符。例如，如果我们将 char 值 `'a'` 转换为 `int`，则\
  \ `ASCII` 表中对应于 a 的数字将赋值给 `int` 变量，输出将为 `97`。 \n\n与类型提升一样，理解 Java 语言中与方法重载（`overloading`）相关的这一特性也关重要。JVM\
  \ 如何解释方法的参数影响代码是否能够编译，理解这些概念将帮助你分析自己以及他人的代码。\n\n### 5.1.4 KeyMaker 重载挑战\n\n接下来的挑战探索了当参数值被硬编码时，JVM\
  \ 如何解释原始类型的概念。你能猜出这段代码执行时会发生什么吗？\n\n```java\npublic class KeyMakerOverloading {\n\
  \n    public static void main(String... primitiveOverloading) {\n        makeKey(1);\n\
  \        makeKey(1F);\n        makeKey('1');\n        makeKey(1.0);\n    }\n\n \
  \   static void makeKey(short shortCode) { \n        System.out.println(\"short:\"\
  \ + shortCode); \n    }\n    static void makeKey(long longCode) { \n        System.out.println(\"\
  long:\" + longCode); \n    }\n    static void makeKey(float floatCode) { \n    \
  \    System.out.println(\"float:\" + floatCode); \n    }\n    static void makeKey(double\
  \ floatCode) { \n        System.out.println(\"double:\" + floatCode); \n    }\n\
  }\n```\n\n1. `short:1`, `float:1.0`, `short:49`, `double:1.0`\n2. `long:1`, `float:1.0`,\
  \ `short:1`, `float:1.0`\n3. `short:1`, `float:1.0`, `long:49`, `float:1.0`\n4.\
  \ `long:1`, `float:1.0`, `long:49`, `double:1.0`\n\n**解释**：\n\n让我们分析这段代码。在第一次调用中，我们传递了硬编码值\
  \ 1：\n\n`makeKey(1);`\n\n`int` 是默认类型，用于解释符合该类型范围的非十进制数字，因此 JVM 将将此硬编码数字转换为 `int`。但没有任何一个重载方法接收\
  \ `int`，因此该类型将会被提升为更宽的类型。JVM 找到的第一个可以容纳该类型的方法是这一个：\n\n`static void makeKey(long\
  \ longCode) { ... }`\n\n因此，第一个输出将是：\n\n`long:1`\n\n在第二次方法调用中，我们传递了一个显式的 float，因为我们在数字后面使用了字母\
  \ F：\n\n`makeKey(1F);`\n\n由于我们已经有一个对应于 `float` 类型的方法，因此该调用的输出将是：\n\n`float:1.0`\n\
  \n在第三次方法调用中，我们传递了一个 char：\n\n`makeKey('1');`\n\n没有接收 `char` 的方法，因此此处将再次使用类型提升。如图\
  \ 5.1 所示所示，`char` 可以被提升为 `int`，正如我们已经看到的，在例例中它将进一步被提升为 `long`。char 值将转换为 `ASCII`\
  \ 表中对应的数字，即 49。因此，输出将是：\n\n`long: 49`\n\n最后，数字 1.0 将被 JVM 自动转换为 `double` 类型，然后它将调用接收\
  \ `double` 的方法：\n\n`double:1.0`\n\n## 5.2 包装类\n\n`short:1`, `float:1.0`, `short:49`,\
  \ `double:1.0`\n\n`long:1`, `float:1.0`, `short:1`, `float:1.0`\n\n`short:1`, `float:1.0`,\
  \ `long:49`, `float:1.0`\n\n`long:1`, `float:1.0`, `long:49`, `double:1.0`\n\n\n\
  \n\n同样无法将原始类型直接赋值给不匹配的包装类型。例如，你不能将 `int` 类型直接赋值给 `Double` 包装类。以下代码将无法编译：\n\n```\n\
  Double doubleMatrixNumber = 7;\n```\n\n实现此目的的唯一方法是将值强制转换为对应的原始类型。然后 `JVM` 就能能够对其进行自动拆箱：\n\
  \n```\nDouble doubleMatrixNumber = (double) 7;\n```\n\n最后，你应该意识到自动装箱对 `JVM` 来说是有成本的——包装类型比原始类型消耗更多的内存资源。越多地使用原始类型越好，因为你的逻辑操作执行速度会更快。但如果你需要你的值是\
  \ `null`，或者你需要处理 Java 集合（collections），例如集合只能存储对象，那么你将不得不使用包装类。\n\n### 5.2.2 包装类挑战\n\
  \n这个挑战将测试你对类型拓宽（type widening）概念的理解。看看你是否能猜出最终输出。如果不能，别担心；这是一个相当棘手的题！\n\n```\n 1\
  \ import java.math.BigDecimal;\n 2 \n 3 public class MatrixWrappers {\n 4 \n 5 \
  \    static String result = \"\";\n 6 \n 7     public static void main(String...\
  \ doYourBest) {\n 8         wrapBullets(5, 5D);\n 9         wrapBullets(1L, 5);\n\
  10         wrapBullets(new BigDecimal(4), 5D);\n11         wrapBullets(5, 4);\n\
  12         wrapBullets((short) 5.0, 5.);\n13 \n14         System.out.println(result);\n\
  15     }\n16 \n17     static void wrapBullets(Integer integerWrapper, Double doubleWrapper)\
  \ {         \\\n18 result += \"A\";\n19     }\n20     static void wrapBullets(Short\
  \ shortWrapper, Double doubleWrapper) {             \\\n21 result += \"B\"; \n22\
  \     }\n23     static void wrapBullets(Number numberWrapper, Double doubleWrapper)\
  \ {           \\\n24 result += \"C\"; \n25                                  \n26\
  \     static void wrapBullets(double doublePrimitive, int intPrimitive) {      \
  \       \\\n27 result += \"D\"; \n28     }\n29 }\n```\n\n1. `ADCDB`\n2. `BCBAA`\n\
  3. `BCDAC`\n4. `ACCAB`\n\n**解释**：\n\n让我们分析一下方法的调用。在第一次调用中，我们传递了一个 `int` 和一个 double\
  \ 值（由 `D` 明）：\n\n`wrapBullets(5, 5D);`\n\n这两个原始类型无法在另一个方法中拓宽为更宽类型，因此 `JVM` 将为我们进行自动装箱。调用的方法将是：\n\
  \n`static void wrapBullets(Integer integerWrapper, Double doubleWrapper)`\n\n在第二次方法调用中，我们传递了一个\
  \ `long` 原始类型和一个 `int`：\n\n`wrapBullets(1L, 5);`\n\n`long` 可以被拓宽为 `double`，因此 `JVM`\
  \ 会这样做，而不是将其转换为包装类型，因为拓宽消耗的内存资源更少。因此在这种情况下，它将调用以下方法：\n\n`static void wrapBullets(double\
  \ doublePrimitive, int intPrimitive) { ... }`\n\n在第三次方法调用中，我们使用了包装类型 `BigDecimal`\
  \ 和一个 double 原始类型：\n\n`wrapBullets(new BigDecimal(4), 5D);`\n\n`BigDecimal` 是一个\
  \ `Number`，因此这种类型可以拓宽为 `Number`，而 `double` 将被自动装箱。因此 `JVM` 调用的方法是：\n\n`static void\
  \ wrapBullets(Number numberWrapper, Double doubleWrapper) { ... }`\n\n在第四次方法调用中，我们使用了两个\
  \ `int` 类型：\n\n`wrapBullets(5, 4);`\n\n`JVM` 选择的策略是拓宽，因此将调用以下方法：\n\n`static void\
  \ wrapBullets(double doublePrimitive, int intPrimitive)`\n\n最后，在第五次方法调用中，我们传递了一个被强制转换为\
  \ `short` 类型的 `double`，以及另一个 `double`（注意可以这样使用 `double` 值，小数点后没有 0；它与 `5.0` 相同）：\n\
  \n`wrapBullets((short) 5.0, 5.);`\n\n`JVM` 在这里唯一选择的策略是自动装箱。`short` 原始类型将自动装箱为 `Short`，`double`\
  \ 原始类型将自动装箱为 `Double`。因此，调用的方法将是：\n\n`static void wrapBullets(Short shortWrapper,\
  \ Double doubleWrapper)`\n\n结论最终答案是：\n\n**A) ADCDB**\n\n## 5.3 可变参数 (Varargs)\n\n\
  某些方法需要接收变数量的参数。在 Java 中，可变参数（varargs）使得能够非常灵活地传递任意数量的参数。让我们看看这在代码中是什么样的。我们使用标准类型声明后跟省略号（…）来定义可变参数：\n\
  \n```\n 1 public class AgentSmithClones {\n 2 \n 3     public static void main(String...\
  \ varargs) {\n 4        createClones(\"smith1\", \"smith2\", \"smith3\", \"smith4\"\
  );\n 5     }\n 6 \n7     static void createClones(String... agentSmiths) {\n 8 \
  \        for (String agentSmith: agentSmiths) {\n 9             System.out.printf(agentSmith);\n\
  10         }\n11     }\n12 \n13 }\n```\n\n关于可变参数有一些规则：\n\n- 可变参数在资源使用方面是最贵的选项，因此\
  \ `JVM` 总是最后选择它。\n- 如果有多个可用选项，它会优先选择（按此顺序）：\n  1. 拓宽\n  2. 自动装箱\n  3. 可变参数\n- 可变参数只能声明一次。\n\
  - 可变参数必须是方法的最后一个参数。\n- 当有多个参数时，可变参数的优先级最低。\n- 当我们使用可变参数时，就像是。\n- 我们可以传递任意数量的参数，包括不传递参数。\n\
  \n让我们来看看这些规则的运行情况：\n\n```\n 1 public class Oracle {\n 2 \n 3     static String bits\
  \ = \"\";\n 4 \n 5     public static void main(String... varargs) {\n 6        \
  \ visionOf(1, 1);\n 7         visionOf(1.0, 1);\n 8         visionOf();\n 9 \n10\
  \         System.out.println(bits);\n11     }\n12 \n13     static void visionOf(Object\
  \ o, Object o) { bits += \"A\"; }\n14     static void visionOf(double d, int...\
  \ i) { bits += \"B\"; }\n15     static void visionOf(int... i) { bits += \"C\";\
  \ }\n16 }\n```\n\n你认为哪些方法会被调用？如果你遵循了规则，你可能得到了答案：`ABC`。\n\n在第一次调用中，我们传递了两个 `int`\
  \ 类型。\n\n在第二次调用中，我们传递了 `double` 和 `int`，所以唯一的选项是 `double`。\n\n在第三次调用中我们什么都不传，就像可变参数。\n\
  \n现在你已经学习了可变参数的主要原理，让我们尝试挑战！\n\n### 5.3.1 Neo Jump 重载可变参数\n\n在这个挑战中，你将探索可变参数、拓宽和自动装箱的概念。看看你是否能猜出最终结果。\n\
  \n```\n 1 public class NeoJump {\n 2 \n 3     static String finalResult = \"\";\n\
  \ 4 \n 5     public static void main(String... doYourBest) {\n 6         jump(1,\
  \ true);\n 7         jump();\n 8         jump(new int[]{1, 2, 3});\n 9         jump(1L);\n\
  10         jump(1);\n11         jump(Double.valueOf(1));\n 12 \n13         System.out.println(finalResult);\n\
  14     }\n 15 \n16     static void jump(Object o) { finalResult += \"1\"; }\n17\
  \     static void jump(Object... o) { finalResult += \"2\"; }\n18     static void\
  \ jump(Exception... i) { finalResult += \"3\"; }\n19     static void jump(Long l)\
  \ { finalResult += \"4\"; }\n20     static void jump(double d) { finalResult +=\
  \ \"5\"; }\n21 \n22 }\n```\n\n让我们逐一分析每个方法调用。首先我们传递了一个 `int` 和一个 `boolean` 类型：\n\n\
  `jump(1, true);`\n\n能够接收这些类型并进行自动装箱的唯一方法是：\n\n`static void jump(Object... o) { finalResult\
  \ += \"2\";}`\n\n下一个调用中我们什么都不传：\n\n`jump();`\n\n\n\n\n\n当我们传递任何内容时，类型最具体的变长参数方法将被调用：\n\
  \n```\nstatic void jump(Exception... i) { finalResult += \"3\";}\n```\n\n在下一次调用中，我们传递了一个新的\
  \ int 数组：\n\n```java\njump(new int[]{1, 2, 3});\n```\n\n请记住，`Java` 中的数组是一个对象，因此在这种情况下，JVM\
  \ 将数组拓宽为 `Object` 比调用变长参数方法更容易。被调用的方法将是：\n\n```java\nstatic void jump(Object o)\
  \ { finalResult += \"1\"; }\n```\n\n接下来，我们传递了一个 long 原始类型：\n\n```java\njump(1L);\n\
  ```\n\n对于 JVM 来说，最简单的策略是将 long 宽为 double 原始类型。因此，被调用的方法将是：\n\n```java\nstatic void\
  \ jump(double d) { finalResult += \"5\";}\n```\n\n在下一次调用中，我们传递了一个 int：\n\n```java\n\
  jump(1);\n```\n\n对于 JVM 来说，最快的解决方案再次是将 int 类型拓宽为 double，因此将调用同一个方法：\n\n```java\n\
  static void jump(double d) { finalResult += \"5\";}\n```\n\n最后，我们通过传递一个 `Double`\
  \ 包装类型调用方法：\n\n```java\njump(Double.valueOf(1));\n```\n\n对于 JVM 来说，最佳策略是将 `Double`\
  \ 包装类型拓宽为 `Object`，因此 JVM 最后调用的方法将是：\n\n```java\nstatic void jump(Object o) { finalResult\
  \ += \"1\"; }\n```\n\n结论，最终输出将是：\n\n**B) 231551**\n\n## 5.4 现实世界用法挑战\n\n本章的现实挑战分为三个部分，用于测试你对方法重载概念的理解。\n\
  \n### 5.4.1 方法重载\n\n假设你正在参与一个财务项目，你需要扩展一个无法直接修改的 `Java` 方法。幸运的是，你知道可以通过重载来扩展方法，而不会破坏现有方法。\n\
  \n你的目标是用一个新方法重载现有方法，该方法将接收一个额外的 `String` 参数。这是现有方法：\n\n```java\n1 public class DiscountController\
  \ {\n2 \n3     boolean isDiscountAvailable(String customerId) {\n4         return\
  \ discountService.isDiscountAvailable(customerId);\n5     }\n6 \n7     // 在此处实现带有额外\
  \ String 参数的方法\n8 }\n```\n\n你可以使用这个简单的 `DiscountService` 类来实现你的功能：\n\n```java\n\
  1 public class DiscountService {\n2 \n3     boolean isDiscountAvailable(String customerId)\
  \ {\n4         System.out.println(\"Discount available to \" + customerId);\n5 \
  \        return true;\n6     }\n7 \n8 } \n```\n\n你需要实现一个新的业务需求，即必须传递一个包含 `userName`\
  \ 的额外 `String`，以记录是哪个用户在执行此操作。解决方案是实现一个带有额外 `userName` 参数的新方法，记录 `customerId` 和\
  \ `userName`，最后调用现有方法以复用其功能。\n\n### 5.4.1 按客户名称插入\n\n现在假设你收到了一项任务，你只需要从前端应用程序接收客户名称，并且你需要插入这些信息。\n\
  \n但你已经有一个插入 `Customer` 的方法了，因此想法是利用重载概念来复用它。\n\n然后，你需要让你的 `CustomerService` 类足够灵活，能够仅接收客户名称并将其转换为\
  \ `Customer`，然后复用那个接收 `Customer` 类作为参数的现有插入方法。\n\n你不想将整个 `Customer` 对象传递到你在 `CustomerService`\
  \ 类中现有的插入方法。\n\n相反，你想重载这个方法，并只传递一个带有 `customer` 名称的 `String`。\n\n```java\n1 public\
  \ class CustomerService {\n2 \n3     CustomerDao dao;\n4 \n5     void insert(Customer\
  \ customer) {\n6         dao.insert(customer);\n7     }\n8 \n9 }\n```\n\n为了解决挑战的这部分，你可以使用这个预定义的\
  \ `CustomerDao` 类：\n\n```java\n1 public class CustomerDao {\n2 \n3     void insert(Customer\
  \ customer) {\n4         System.out.println(\"Customer inserted\");\n5     }\n6\
  \ \n7 }\n```\n\n你可以使用这个简单的 `POJO`（普通 Java 对象）将 `String` 传递给它：\n\n```java\n 1 public\
  \ class Customer {\n 2 \n 3     String name;\n 4 \n 5     public Customer(String\
  \ customerName) {\n 6         this.name = customerName;\n 7     }\n 8 \n 9     public\
  \ String getName() {\n10         return name;\n11     }\n12 }\n```\n\n如何利用方法重载的力量重新设计\
  \ `CustomerService` 类以满足你的需求？\n\n### 5.4.2 灵活重载\n\n对于挑战的这部分，假设你在一家大型零售商工作，你需要创建接收一个、两个或三个参数的方法：`customerId`、可选的\
  \ `discountId` 以及可选的 `productId`。\n\n你的目标是创建一个名为 `processCustomerProduct` 的方法，它可以仅通过\
  \ `customerId` 调用，或者通过 `customerId` 和 `discountId` 调用，或者通过 `customerId`、`productId`\
  \ 和 `discountId` 调用。\n\n接收一个或两个参数的方法应该调用接收三个参数的方法，对缺失的值传递 `null`。这种设计比创建三个不同名称的方法有效，因为每个情况下使用的逻辑非常相似。\n\
  \n```java\n1 public class CustomerService {\n2 \n3     // 变量\n4 \n5     void processCustomerProduct(String\
  \ customerId) {\n6         // 调用下一个方法\n7     }\n8 \n9     // 创建重载方法\n10 }\n```\n\
  \n不要担心接收三个参数方法的逻辑；只需打印这三个属性即可。挑战的重点是使用重载。\n\n## 5.5 总结\n\n*   在本章中，你学习了如何有效使用方法重载来创建灵活、可复用的易读方法。\n\
  *   你学习了原始类型和对象的拓宽顺序。\n*   你学习了如何使用类型转换将宽类型转换为窄类型。\n*   你学习了 JVM 如何解释硬编码数字以及如何用特定类型显式声明它们。\n\
  *   你了解如何良好使用自动装箱，并理解使用包装类型的缺点和权衡。\n*   你学习了如何使用变长参数整洁地传递多个参数。\n*   你现在能够使用高级重载，并且知道当有多种选择时（从拓宽到自动装箱，最后是变长参数），JVM\
  \ 会选择内存消耗最低的方法。\n\n# 6 继承与多态\n\n**本章涵盖**：\n\n*   使用`继承`和`多态`开发代码，并重写父类方法\n*   理解\
  \ `Java` 中的所有类都继承自 Object\n*   理解访问修饰符\n*   在继承和组合之间进行选择\n*   继承接口（多继承的替代方案）\n*\
  \   通过有效使用 super 关键字和通过 super 调用构造函数来开发灵活的代码\n*   利用`继承`进行对象转换\n*   使用 `final` 关键字和私\
  \ 修饰符防止类和方法被继承\n*   普通类和抽象类之间的区别，以及如何创建一个符合系统的抽象类设计\n*   总共 **5 个 Java 代码挑战**\n\n\
  继承是`面向对象`编程中一个非常强大的概念，极大地促进了代码的复用。\n\n\n\n\nJava 中的继承是一种基于现有父类（或超类）的特征创建新子类（或子类）的方法。子类继承父类的行为（方法）和状态（字段），并根据需要对它们进行修改，而无需重新实现所有的底层逻辑。如果使用得当，这一强大的概念将为你的项目带来巨大收益。\n\
  \n当我们谈论继承时，`polymorphism`（多态）与其密相随，因为只有通过`inheritance`（继承）才能使用它。`多态` 为代码提供了极大的活性，并帮助开发者创建简洁高效的代码设计。`Collections`\
  \ API 充分利用了`多态`，每个 Java 类都可以利用多态。每当我们 `override`（重写）父类中的方法时，我们都在使用多态。Collections\
  \ API 有许多例子，例如当我们声明一个 `List` 并用 `ArrayList` 实例化它时，我们已经在使用多态了。大多数设计模式都利用了多态，因此，它是`Object-Oriented\
  \ Programming`（面向对象编程）范式中一个极其强大的特性。\n\n组合（Composition）是另一种宝贵的代码复用机制，其耦合性较低。通过组合，一个类可以拥有另一个类的实例作为其字段——例如，一个\
  \ `House` 可以由 `Bedrooms`、`Kitchen` 等组成，而且每个部分都可以独立更改。这是面向对象编程中的一个重要概念，我们开发者的目标是将现实世界的问题抽象为使人们生活更简单的解决方案。\n\
  \n## 6 何时使用继承\n\n继承如果使用得当非常有益，但使用不当则会产生严重问题。它会导致高耦合，这意味着父类中的任何更改可能变成噩梦。因此，不要在代码中过度使用继承。\n\
  \n如何判断继承对你的代码是否有益？问问你自己正在创建的类与想要继承的类之间是否存在“是一个”（is-a）的关系。如果答案是否定的，那么使用继承并不是好主意。\n\
  \n继承的示例包括：\n\n```\n1 Car 继承 Vehicle（汽车是一种车辆）\n2 Dog 继承 Animal（狗是一种动物）\n3 Gold 继承\
  \ Metal（金是一种金属）\n```\n\n相反，不当的用法是让 `Dog` 继承 `Cat`：说“狗是一个猫”是不符合逻辑的。\n\nJava 中的继承是通过在子类定义中使用\
  \ `extends` 关键字声明的。例如：\n\n```\n1 public class Car extends Vehicle {\n2     ...\n\
  3 }\n```\n\n它对于具体类和抽象类（无法实例化的）的作用是相同的。Java API 广泛使用这些来封装功能和状态。我们将在本章节后面详细介绍抽象类。\n\
  \n### 6.1.1 重写方法\n\n继承提供的最强大的特性之一是重写父类行为。父类可以拥有默认行为，而子类可以拥有适用于它们的行为。这种通过继承关联父类的多个类的概念被称为多态。以下代码演示了通用类\
  \ `Hero` 以及继承它的特化类 `SpiderMan` 和 `Wolverine` 的`多态`和方法重写。看看你能否找出执行 `HeroExecutor`\
  \ 类的 main 方法产生这些结果的原因：\n\n```\n1 class Hero {\n2     void usePower() {\n3      \
  \   System.out.println(\"The hero is going to use his power!\");\n4     }\n5 }\n\
  6 \n7 class SpiderMan extends Hero {\n8     @Override\n9     void usePower() {\n\
  10         System.out.println(\"Hyper Web Throw\")\n11     }\n12 }\n13 \n14 class\
  \ Wolverine extends Hero {\n15      @Override\n16      void usePower() {\n17   \
  \       System.out.println(\"Fatal Claw\");\n18      }\n19 }\n20 \n21 public class\
  \ HeroExecutor {\n22 \n23     public static void main(String... methodOverridingExample)\
  \ {\n24         Hero hero = new Hero();\n25         hero.usePower();           \
  \    // #1\n26 \n27 \n28         Hero spiderMan = new SpiderMan();\n29         spiderMan.usePower();\
  \             // #2 \n30 \n31 \n32         Hero wolverine = new Wolverine();\n33\
  \         wolverine.usePower(); \t\t// #3\n34     }\n35 }\n```\n\n*   #1 输出“The\
  \ hero is going to use his power!”\n*   #2 输出“Hyper Web Throw”\n*   #3 输出“Fatal\
  \ Claw”\n\n当我们只实例化 `Hero` 时，得到该类指定的行为。然后我们再次用 `SpiderMan` 实例化 `Hero`。该类重写了 `usePower`\
  \ 方法，因此打印了不同的消息（\"Hyper Web Throw\"）。最后，我们用 `Wolverine` 实例化 `Hero`。该类也重写了 `usePower`，因此打印了\
  \ `Wolverine` 的输出（\"Fatal Claw\"）。\n\n### 6.1.2 啤酒多态挑战\n\n哪个家庭人角色喝啤酒？你能猜到当程序运行时会发生什么吗？\n\
  \n```\n 1 public class DrinkBeerChallenge {\n 2 \n3     public static void main(String...\
  \ doYourBest) {\n4         SimpsonCharacter bart = new Bart();\n5         drinkBeer(bart);\n\
  \ 6 \n7         drinkBeer(new Homer());\n8         drinkBeer(new SimpsonCharacter());\n\
  9     }\n10 \n11     static void drinkBeer(SimpsonCharacter simpsonCharacter) {\n\
  12         System.out.println(\"A character is drinking beer\");\n13     }\n14 }\n\
  15 \n16 class Homer extends SimpsonCharacter {\n17     void drinkBeer(SimpsonCharacter\
  \ simpsonCharacter) {\n18         System.out.println(\"Homer drinks\");\n19    \
  \ }\n20 }\n21 \n22 class Bart extends Homer {\n23     void drinkBeer(SimpsonCharacter\
  \ simpsonCharacter) {\n24         System.out.println(\"Bart can't drink!\");\n25\
  \     }\n26 }\n27 \n28 class SimpsonCharacter {\n29 \n30     void drinkBeer(SimpsonCharacter\
  \ simpsonCharacter) {\n31         System.out.println(\"A character is drinking beer\"\
  );\n32     }\n33 \n34 }\n```\n\n1.  Bart can't drink!\n    Homer drinks\n    A character\
  \ is drinking beer\n\n2.  A character is drinking beer\n    Homer drinks\n    A\
  \ character is drinking beer\n\n3.  A character is drinking beer\n    A character\
  \ is drinking beer\n    A character is drinking beer\n\n4.  Homer drinks\n    Homer\
  \ drinks\n    A character is drinking beer\n\n**解释：**\n\n这个挑战探索了多态概念，即动态方法调用。当子类中重写父类方法时，JVM\
  \ 在实例化该类时会执行子类中定义的方法，从而使我们能够更改其行为。这使得我们能够以灵活的方式调用方法。\n\n让我们逐步分析代码。在 `main` 方法中，我们首先创建一个\
  \ `Bart` 类的实例并将其赋值给类型为 `SimpsonCharacter` 的变量 `bart`。我们将 `Bart` 的实例传递给 `drinkBeer`\
  \ 方法：\n\n```\n1 SimpsonCharacter bart = new Bart();\n2 drinkBeer(bart);\n```\n\n\
  结果是 `Bart` 类的 `drinkBeer` 方法被调用，打印：\n\n**Bart can't drink!**\n\n接下来，我们实例化 `Homer`\
  \ 并直接将此实例传递给方法：\n\n`drinkBeer(new Homer());`\n\n在这种情况下，将执行 `Homer` 类的方法版本，因此输出为：\n\
  \n**Homer drinks**\n\n最后，我们传递一个 `SimpsonCharacter` 实例调用 `drinkBeer` 方法：\n\n`drinkBeer(new\
  \ SimpsonCharacter());`\n\n其对应的方法将被调用，打印：\n\n**A character is drinking beer**\n\n\
  因此，正确答案是：\n\n```\n1 A) Bart can't drink!\n2    Homer drinks\n3    A character is\
  \ drinking beer\n```\n\n\n\n\n请注意，我们在这里不仅使用了继承的力量，还使用了`polymorphism`（多态）。你能看到通过仅仅在方法中声明父类我们获得了多少灵活性吗？`main`\
  \ 方法负责提供实例，这意味着 `drinkBeer` 方法足够灵活可以接收任何类型的 `SimpsonCharacter`。如果此方法需要进行任何方式的扩展，将变得更容易，因为我们可以在\
  \ `main` 方法中操控它的行为。\n\n创建解耦的代码对于代码质量至关重要：它使得修改代码变得更容易，提高了可测试性，并使代码更具灵活性可重用性。\n\n\
  ## 6.2 每一个类都是对象\n\n每个 Java 类都是一个对象，这意味着每个类都继承自 `Object`。你是否注意到每个类都拥有 `equals` 和\
  \ `hashCode` 方法？这并不是巧合——这些方法是继承自 `Object` 类。它是 Java 的终极超类，位于类树的顶端。\n\n你创建的任何新类都会隐式地扩展\
  \ `Object`。这意味着你将能够在你的类中调用来自 `Object` 类的方法，如下所示：\n\n```\n 1 public class NewClassExtendsObject\
  \ {\n 2 \n 3     public static void main(String... thisClassExtendsObject) {\n 4\
  \         NewClassExtendsObject newClassExtendsObject = new NewClassExtendsObject();\n\
  \ 5         newClassExtendsObject.equals(\"Test\");\n 6         newClassExtendsObject.hashCode();\n\
  \ 7         newClassExtendsObject.toString();\n 8         // Other methods...\n\
  \ 9     }\n10 }\n```\n\n你也可以在类中`override`（重写）`Object` 类的任何方法，例如 `equals`、`hashCode`\
  \ 和 `toString`。我们未来的章节中更深入探索这些方法。现在，请记住你可以为这些 `Object` 方法定义你想要的行为。\n\n### 6.2.1\
  \ 蜘蛛侠身份检查器挑战！\n\n这个挑战探索了 `Object` 类的 `equals` 方法的使用。你不需要确切知道这个方法的功能就能解决它；你只需要知道什么是方法重写以及它是工作的。仔细观察代码，然后看看你能否猜出输出。\n\
  \n```\n 1 public class SpiderManIdentityChecker {\n 2 \n 3   public static void\
  \ main(String... doYourBest) {\n 4     System.out.println(new SpiderMan(\"Peter\"\
  ).equals(new SpiderMan(\"Peter\")));\n 5     System.out.println(new SpiderMan(\"\
  Peter\").equals(new SpiderMan(\"Parker\")));\n 6   }\n 7 }\n 8 \n 9 class SpiderMan\
  \ {\n10   String name;\n11   SpiderMan(String name) {\n12     this.name = name;\n\
  13   }\n14 \n15   @Override\n16   public boolean equals(final Object obj) {\n17\
  \     return this.equals(obj);\n18   }\n19 \n20 }\n```\n\n1. true\n   false\n2.\
  \ false\n   false\n3. `java.lang.StackOverflowError`\n4. true\n   true\n\n**解析**：\n\
  \n这个挑战的关键在于 `equals` 方法的实现。\n\n注意该方法被错误地重写了——因为我们通过关键字 `this` 指向当前实例，我们正在调用同一个 `equals`\
  \ 方法并传递 `obj`。这是一个无限递归方法调用（当方法调用自身时产生），为了避免无限循环，JVM 将抛出 `java.lang.StackOverflowError`。\n\
  \n结论，正确选项是：\n\n**C) `java.lang.StackOverflowError`**\n\n## 6.3 检查对象的类型\n\nJava 的\
  \ `instanceof` 关键字是一个非常有用的特性，它允许我们检查一个对象（实例）是否属于给定类型。当我们处理继承时，它变得非常有用。如果我们想开发需要知道类类型的逻辑，可以使用\
  \ `instanceof` 关键字来验证它。\n\n我们还可以使用 `instanceof` 关键字检查子类是否扩展了特定的父类，或实现了某个接口，即使声明的父类型拥有子类的实例。\n\
  \n像往常一样，让我们通过代码来让这些概念更清晰：\n\n```\n 1 public class InstanceofExample {\n 2 \n 3 \
  \  public static void main(String[] args) {\n 4     Object xavier = new Xavier();\n\
  \ 5     System.out.println(new Venom() instanceof Object);        // #1\n 6    \
  \ System.out.println(xavier instanceof Xavier && xavier instanceof Object); // #2\n\
  \ 7     System.out.println(new Wolverine() instanceof Hero);      // #3\n 8    \
  \ System.out.println(new Hero() instanceof Wolverine);      // #4 \n 9   }\n10 \n\
  11 }\n12 \n13 class Hero {}\n14 class Venom {}\n15 class Xavier {}\n16 class Wolverine\
  \ extends Hero {}\n```\n\n* #1: 打印 true\n* #2: 打印 true\n* #3: 打印 true\n* #4: 打印\
  \ false\n\n你能看到 `instanceof` 关键字有多强大吗？让我们逐一分析语句：\n\n* #1: 这打印 true\n* #2: 这打印 true\n\
  * #3: 这打印 true\n* #4: 这打印 false\n\n首先，我们实例化 `Venom` 并检查它是否为 `Object`：\n`System.out.println(new\
  \ Venom() instanceof Object);`\n\n所有类都继承自 `Object`，所以返回 true。\n\n接下来我们实例化 `Xavier`\
  \ 并将其赋值给变量 `xavier`，类型为 `Object`。然后检查 `xavier` 是否是 `Xavier` 且是 `Object`：\n`Object\
  \ xavier = new Xavier();`\n`System.out.println(xavier instanceof Xavier && xavier\
  \ instanceof Object);`\n\n接下来我们实例化 `Wolverine` 并检查它是否为 `Hero`：\n`System.out.println(new\
  \ Wolverine() instanceof Hero);`\n\n最后，我们检查 `Hero` 是否为 `Wolverine`：\n`System.out.println(new\
  \ Hero() instanceof Wolverine);`\n\n### 6.2.3 诡异对象挑战\n\n这个挑战通过一系列类检查来测试你对 `instanceof`\
  \ 关键字的理解。它还展示了继承的概念。\n\n```\n 1 public class TrickyObjectClass {\n 2 \n 3   public\
  \ static void main(String... doBest) {\n 4     System.out.println(new NoException()\
  \ instanceof Object);\n 5     System.out.println(new Barney() instanceof Object);\n\
  \ 6     System.out.println(Barney.class instanceof Object);\n 7     System.out.println(Class.class\
  \ instanceof Object);\n 8   }\n 9 }\n10 \n11 class NoException extends Exception\
  \ { }\n12 class Barney extends Object {}\n```\n\n1. 1111\n2. 1100\n3. 0000\n4. 第\
  \ 13 行编译错误\n\n**解析**：\n\n所有类都继承自 `Object`，没有异常。\n\n注意我们使用了 `Barney.class`，它引用了一个类字面量。换句话说，这意味着我们正在获取如类名、属性名、类型等类元数据。`Barney.class`\
  \ 等于 `Barney.getClass()`。\n\n因此正确答案是：\n\n**A - 1111**\n\n## 6.4 toString 方法\n\n\
  `toString` 方法的目标是揭示对象的状态。通过重写此方法，可以通过打印实例来显示对象的状态。\n\n让我们来看例子：\n\n```\n 1 public\
  \ class SimpsonToString {\n 2 \n 3     private String name;\n 4     private String\
  \ weight;\n 5 \n 6     private SimpsonToString(String name, String weight) {\n 7\
  \         this.name = name;\n 8         this.weight = weight;\n 9     }\n 10 \n\
  \ 11     public static void main(String... toStringExample) {\n 12         SimpsonToString\
  \ homer = new SimpsonToString(\"Homer\", \"240\");\n 13         System.out.println(homer);\
  \ \n 14     }\n 15 \n 16     @Override\n 17     public String toString() {\n 18\
  \         return \"Simpson name:\".concat(this.name).concat(\", weight:\").concat(weight);\n\
  \ 19     }\n 20 \n 21 }\n```\n\n该程序的输出将是：\n\n`Simpson name:Homer, weight:240`\n\n\
  `toString` 方法在日志记录等场景非常有用。例如，我们不需要创建显示对象对象的特定方法，只需重写 `toString` 方法并实现想要的内容即可。\n\n\
  \n\n\n\n`toString` 方法的一个重要细节是，我们可以简单地打印整个对象，此时 `toString` 方法的信息就会被打印出来，我们不需要显式地调用\
  \ `toString` 方法。\n\n## 6.5 访问修饰符与继承\n\n你可能已经注意在上一个示例中使用了 `private` 关键字。到目前，我们处理过的所有类和方法都是\
  \ `public` 的。这些关键字被称为 `访问修饰符`（access modifiers），它们控制着类及其成员（实例变量、字段和方法）的访问可见性。`public`\
  \ 访问修饰符意味着成员对所有代码都是可见的，而 `private` 修饰符意味着它们仅在该类内部可见。在超类中声明为 `private` 的方法对子类隐藏的，并且无法直接访问。\n\
  \n除了这些之外，Java 还提供了 `default`（或包级）和 `protected` 访问修饰符。如果你没有指定修饰符，提供的就是 `default`\
  \ 访问：此代码在类本身以及同一包中的任何其他类中（包括子类，只要它们在同一个包中）都是可用的。`protected` 访问类似，但它允许访问所有子类，无论它们位于哪个包中。\n\
  \n当你重写方法时，不能使用比超类中所使用的更严格的访问修饰符。如果你这样做，将会导致编译错误。不过，你可以使用限制性较小的修饰符，例如用 `public` 代替\
  \ `protected`。\n\n让我们通过代码示例来看看什么是可能的，哪些是不可能的：\n\n```\n 1 class Hero {\n 2    void\
  \ attack() {}\n 3    public void jump() {}\n 4 }\n 5 \n6 class Wolverine extends\
  \ Hero {\n 7     public void attack() {} // 可以更开放的访问修饰符\n 8     public void jump()\
  \ {} // 使用相同的访问修饰符\n 9     // void jump() {} 编译错误，默认访问修饰符限制性更大\n10 tive\n11    \
  \ // private void jump() {} 编译错误，private 访问修饰符限制性更\n12 restrictive\n13 }\n```\n\n\
  在重写方法时，请记住它们必须具有与超类中相同的访问限制，或者使用更开放的访问修饰符。\n\n### 6.5.1 继承修饰符限制挑战\n\n这个挑战侧重于访问修饰符。你能猜到这个程序的输出是什么吗？\n\
  \n```\n 1 public class TheHiddenModifier {\n 2 \n 3     public static void main(String...\
  \ doYourBest) {\n 4         System.out.println(new TheHiddenModifier());\n 5   \
  \      var hiddenModifier = new TheHiddenModifier();\n 6         System.out.println(hiddenModifier.equals(hiddenModifier));\n\
  \ 7     }\n 8 \n 9     @Override\n10     String toString() { \t     // 第 12 行\n\
  11         return \"theHiddenModifier\";\n12     }\n13 \n14     @Override\n15  \
  \   public boolean equals(Object obj) {\n16         return this.equals(obj); //\
  \ 第 18 行\n17     }\n18 }\n```\n\n1. `theHiddenModifier true`\n2. `theHiddenModifier\
  \ false`\n3. 第 12 行编译错误\n4. 第 18 行编译错误\n\n**解释**：\n\n`equals` 方法运行正常，因为我们使用 `public`\
  \ 访问修饰符对其进行了重写。\n\n然而，让我们分析一下 JDK 代码中 `Object` 类的 `toString` 方法：\n\n```\n1 public\
  \ class Object {\n2     public String toString() {\n3         return getClass().getName()\
  \ + \"@\" + Integer.toHexString(hashCode());\n4     }\n5 }\n```\n\n注意它是 public 的。这意味着它不能用更弱的访问修饰符来重写，例如此挑战中使用的\
  \ `default` 修饰符；它必须是 `public`。\n\n由于在第 12 行 `default` 访问修饰符比 `Object` 类的 `public`\
  \ 更严格，我们将得到编译错误。\n\n因此，最终答案是：\n\n`C) Compilation error at line 12`\n\n## 6.6 对象组合\n\
  \n`Composition`（组合）是 `inheritance`（继承）的替代方案，在实际项目中被广泛使用。它的主要优点之一是避免了继承带来的强耦合，这意味着修改代码更容易。\n\
  \n我们什么时候应该使用组合？要确定这一点，你必须问这个问题：这个对象是某个东西的一部分吗？如果答案是肯定的，它就是组合的候选对象。让我们来看几个例子：\n\n\
  * `Heart`（心脏）是 `Person`（人）的一部分（没有 `Heart`，`Person` 就无法生存）\n* `Engine`（引擎）是 `Car`（汽车）的一部分（没有\
  \ `Engine`，`Car` 就无法运行）\n* `Employee`（员工）是 `Company`（公司）的一部分（没有员工 `Company` 就无法运作）\n\
  \n同样注意这种关系是双向的。`Heart` 无法离开 `Person`（或类似的实体）生存，没有 `Car` 运行 `Engine` 就没用，而 `Employee`\
  \ 需要一个 `Company` 来雇佣他们。\n\n为了更好地理解这种关系，考虑 Person 的组合：\n\n```\n 1 public class CompositionExample\
  \ {\n 2     public static void main(String... personComposition) {\n 3         new\
  \ Person(new Brain(), new Heart() /* other elements */);\n 4         // 一个 Person\
  \ 由 Brain, Heart 和其他元素组成\n 5     }\n 6     static class Person {\n 7         Brain;\n\
  \ 8         Heart;\n 9         Person(Brain, Heart) {\n10             this.brain\
  \ = brain;\n11             this.heart = heart;\n12         }\n13     }\n14     static\
  \ class Brain { }\n15     static class Heart { }\n16 }\n```\n\n组合通过允许定义由其他对象组成的对象来实现代码复用。\n\
  \n### 6.6.1 聚合\n\n`Aggregation`（聚合）是一种较弱的对象依赖关系。简单来说，它是一种两个对象都可以独立存在的关系。如果我们问一个对象拥有另一个对象且答案为是，那么它是聚合的候选。例如：\n\
  \n* Library has Books（书籍没有图书馆也可以存在）\n* Person has Clothes（衣服没有人也可以存在）\n* Dog has\
  \ a Collar（项圈没有狗也可以存在）\n\n这在代码中看起来是这样的：\n\n```1 class Library {\n2     List<Book>\
  \ books = new ArrayList<>();\n3 class Book { }\n```\n\n注意组合和聚合是抽象概念。它们取决于你对现实世界的观点以及你为系统定义的规则。在现实应用中，你可以直接使用“组合”这个术语——不需要具体定义是组合还是聚合——但了解它们之间的区别是有好处的。\n\
  \n### 6.6.2 何用组合而不是继承\n\n下面是一个非常糟糕的继承示例：\n\n```\n 1 import java.util.ArrayList;\n\
  \ 2 \n 3 public class SimpsonCharacterInheritance extends ArrayList<String> {\n\
  \ 4 \n 5     public static void main(String... badExampleOfInheritance) {\n 6  \
  \       SimpsonCharacterInheritance simpsonCharacters = new SimpsonCharacterInheritance();\n\
  \ 7         simpsonCharacters.add(\"Homer\");\n 8         simpsonCharacters.forEach(System.out::println);\n\
  \ 9     }\n10 }\n```\n\n为什么？通过扩展 `ArrayList` 我们创建了巨大的耦合。如果我们问 `SimpsonCharacter`\
  \ 是否是一个 `ArrayList`，答案是否定的不是。我们从 `ArrayList` 类继承了所有方法到 `SimpsonCharacter` 中，但其中许多方法并不会被用到。\n\
  \n这种情况使用组合会好得多。让我们看看如果我们改为用 `ArrayList` 来组合 `SimpsonCharacter` 类会变成什么样：\n\n```\n\
  \ 1 import java.util.ArrayList;\n 2 import java.util.List;\n 3 \n 4 public class\
  \ SimpsonCharacterComposition {\n 5 \n 6     static List<String> characters = new\
  \ ArrayList<>();\n 7 \n 8     public static void main(String... goodExampleOfComposition)\
  \ {\n 9         characters.add(\"Homer\");\n10         characters.forEach(System.out::println);\n\
  11     }\n12 }\n```\n\n我们得到了所有需要的功能，而没有任何不需要的功能。\n\n\n\n\n多继承指的是子类继承自多一个父类的情况。与\
  \ `Python` 和 `C++` 等语言不同，`Java` 不允许类的多继承，因为这增加了复杂性——但我们可以通过接口（interfaces）模拟这种行为。`Java`\
  \ 中的接口是抽象方法和字段的集合，用于指定类的行为。接口不保存状态，这意味着它们不能包含实例变量，只能包含常量。我们将在下一章中更详细地学习它们，但目前，这就是你需要了解的全部。\n\
  \n如果你尝试继承多个类（如下例所示），代码将无法通过编译：\n\n```\n1 class Hero { }\n2 class MarvelCharacter\
  \ { }\n3 class SpiderMan extends Hero, MarvelCharacter { }\n```\n\n一种解决方案是逐个继承这些类：\n\
  ```\n4 class MarvelCharacter { }\n5 class Hero extends MarvelCharacter  { }\n6 class\
  \ SpiderMan extends Hero { }\n```\n\n另一个解决方案是将类替换为接口：\n\n```\n1 interface Hero {\
  \ }\n2 interface MarvelCharacter  { }\n3 class SpiderMan implements Hero, MarvelCharacter\
  \ { }\n```\n\n### 6.7.1 扩展接口\n\n如果我们想让一个接口继承父接口的方法呢？我们可以在 `Java` 中做到这一点！这是一个示例：\n\
  \n```\n1 public class InterfaceInheritance {\n2 \n3     interface Human { void talk();\
  \ }\n4     interface Hero { void rescue(Human human); }\n5 \n6     interface Batman\
  \ extends Hero, Human {}\n7 }\n```\n\n在 `Java` 中，接口可以继承另一个接口，就像类继承另一个类一样，因此我们可以在\
  \ `Batman` 接口中重用 `Human` 和 `Hero` 接口中的 `talk` 和 `rescue` 方法。当我们想要将职责分离到更通用的接口并更有效的方式重用它们时，这非常有用——我们不需要再次声明这些方法，这使得我们的代码更易维护。\n\
  \n## 6.8 使用 super 访问父类方法\n\n可以通过使用关键字 `super` 来访问父类的方法。在设计类时，这是一个非常实用的特性，并且在设计模式中被广泛使用。`super`\
  \ 关键字为我们的代码提供了极大的灵活性，因为它使我们能够重用父类的方法。当子类包含与父类中同名的成员时，且你想区分它们时，这种方法非常有用。\n\n在下面的示例中，`Homer`\
  \ 类调用了其超类 `Character` 的 `move` 方法：\n\n```\n 1 public class SuperMethodExample {\n\
  \ 2 \n3     public static void main(String[] args) {\n 4         new Homer().drinkBeer();\
  \ // 它将打印：Homer is walking...\n 5     }\n 6 \n 7     static class Character {\n\
  \ 8         void move(String name) {\n 9             System.out.println(name.concat(\"\
  \ is walking...\"));\n10         }\n11     }\n12 \n13     static class Homer extends\
  \ Character {\n14         void drinkBeer() {\n15             super.move(\"Homer\"\
  );\n16         }\n17     }\n18 \n19 }\n```\n\n### 6.8.1 在构造函数中使用 super 关键字\n\n类似于超类方法，我们可以使用\
  \ `super` 关键字从超类调用构造函数（constructors）。在下面的示例中，`Moe` 类正在调用来自 `Character` 类的超类构造函数：\n\
  \n```\n 1 public class SuperConstructor {\n 2     public static void main(String[]\
  \ args) {\n 3         new Moe(); // 这打印 \"Moe was created\"\n 4     }\n 5 \n 6 \
  \    static class Character {\n 7         Character(String name) {\n 8         \
  \    System.out.println(name.concat(\" was created\"));\n 9         }\n10     }\n\
  11 \n12     static class Moe extends Character {\n13         Moe() {\n14       \
  \      super(\"Moe\");\n15         }\n16     }\n17 }\n```\n\n该示例中 `main` 方法的输出将是\
  \ `\"Moe was created\"`。这是一个特别值得注意的特性，因为与其他方法不同，构造函数不会被子类继承。然而，在某些情况下，你可能想从子类调用父类的构造函数；例如，如果你想重用带有某些自定义设置的初始化代码以减少代码重复。\n\
  \n我们将在下一节考虑构造函数与继承之间关系的其他方面。\n\n## 6.9 构造函数与继承\n\n构造函数在 `Java` 中不是成员，因此它们不会被子类继承。这是有的：构造函数用于创建其定义所在类的对象，因此每个类都应该有自己的构造函数。一个特殊情况是默认构造函数，正如你接下来看到的。\n\
  \n### 6.9.1 默认构造函数\n\n在第 3 章中，你学习了如果如果没有定义任何构造函数，`JVM` 将为该类创建一个默认构造函数。每当实例化子类时，它还会自动调用父类的默认构造函数（即\
  \ \"super constructor\"）。这是必要的，因为父类可能有在其构造函数中初始化的私有字段。\n\n由于每个 `Java` 类都继承 `Object`，这意味着每当实例化对象时，都会隐式调用\
  \ `Object` 类的默认构造函数。想象如果我们必须为所有 `Java` 类调用超类构造函数——记住这一点将是一场噩梦。这就是 `JVM` 在没有传递参数时自动调用超类构造函数的原因之一。实际上，它为你包含了\
  \ `super();`。\n\n在下面的示例中，`Magneto` 类将调用由 `JVM` 创建的 `Villain` 类的默认构造函数：\n\n```\n\
  1 public class DefaultConstructoritance {\n2     static class Villain {\n3     \
  \    Villain() {\n4             System.out.println(\"A villain was created!\");\n\
  5         }\n6 \n7         public static void main(String...defaultConstructor)\
  \ {\n8             new Magneto();\n9         }\n10    }\n11 \n12    static class\
  \ Magneto extends Villain {\n13        // JVM 将创建默认构造函数\n14        /*  super();\
  \ */\n15    }\n16 }\n```\n\n这意味着当我们实例化 `Magneto` 类时，`JVM` 会调用超构造函数并打印 `\"A villain\
  \ was created!\"`。记住，在使用继承时，第一个执行的构造是来自顶级父类的。在我们的案例中，构造执行顺序将是 `Object`、`Villain`，然后是\
  \ `Magneto`。\n\n### 6.9.2 带参数的父类构造函数\n\n当父类定义了带有一个或多个参数的构造函数时，子类必须显式调用此构造函数。否则，你将得到编译错误。这是因为\
  \ `JVM` 只在类没有构造函数时才会创建默认构造函数。\n\n在下面的代码中，`Moe` 类显式调用了来自 `Character` 类的超类构造函数。这是必须的，否则代码将无法编译：\n\
  \n```\n1 public class CustomizedConstructorSuper {\n2 \n3     public static void\
  \ main(String...customizedConstructor) {\n4         new Moe();\n5     }\n6 \n7 \
  \    static class Character {\n8         Character(String name) {\n9           \
  \  System.out.println(name + \" was invoked\");\n10         }\n11     }\n12 \n13\
  \     static class Moe extends Character {\n14         // 如果我们不显式调用构造函数，将得到编译错误\n\
  15         Moe () {\n16             super(\"Moe Szyslak\");\n17         }\n18  \
  \   }\n19 }\n20 }\n```\n\n\n\n\n请注意，如果父类中定义了另一个不接收任何参数的构造函数，不需要显式地调用父类构造函数，就像本例所示。在下面的代码中，我们将看到一个重载构造函数（接收不同类型参数的构造函数）的示例。当父类中存在无参构造函数时，我们不需要显式添加对\
  \ `super` 构造函数的调用。\n\n在这个示例中，`Character` 类有一个无参数的构造函数，另一个接收 `String` 的构造函数。在这种情况下，`Moe`\
  \ 子类将自动调用父类的无参数构造函数，因为 `JVM` 能够创建一个调用无参数超构造函数的默认构造函数：\n\n```\n 1 public class NonParameterizedConstructorSuper\
  \ {\n 2 \n 3     public static void main(String... nonParameterizedConstructor)\
  \ {\n 4         new Moe();\n 5     }\n 6 \n 7     static class Character {\n 8 \
  \        Character() {\n 9             System.out.println(\"A Character was created\"\
  );\n10         }\n11 \n12         Character(String name) {\n13             System.out.println(name\
  \ + \"was created\");\n14         }\n15     }\n16 \n17     static class Moe extends\
  \ Character {\n18         // 这里没有必要添加 super，因为当父类中有无参构造函数时，\n19         // JVM 会自动添加\n\
  20         // 自动添加 super\n21     }\n22 \n23 }\n```\n\n请记住，`super` 关键字仅会被 `JVM` 自动用于不接收任何参数的父类构造函数。\n\
  \n## 6.10 类类型转换\n\n当我们需要将一种类型转换为另一种类型时，就会使用类型转换（casting）的概念。当我们想要处理不同的兼容类型时，这非常有用。我们在上一节中看到了一些基本类型转换的示例，但它也可以对类和接口进行转换。\n\
  \n为了说明这个概念，让我们来看一个代码示例，其中我们尝试调用子类的方法。你认为这能行通吗？\n\n```\n 1 public class DrinkBeer\
  \ {\n 2 \n 3   public static void main(String... drinkBeer) {\n 4     drinkBeer(new\
  \ Homer());\n 5     }\n 6 \n 7   static void drinkBeer(Character character) {\n\
  \ 8     character.drinkBeer();\n 9   }\n10 }\n11 \n12 class Character {\n13 }\n\
  14 \n15 class Homer extends Character {\n16     void drinkBeer() {\n17 \tSystem.out.println(\"\
  Homer drinks a beer\");\n18     }\n19 }\n```\n\n如果你认为这段代码会打印 `\"Homer drinks a beer\"\
  `，请重新考虑一下。我们将得到一个编译错误（`ClassCastException`），因为 `JVM` 在编译时无法知道实例具有哪种方法。`JVM` 只知道\
  \ `Character` 类中的方法，而由于 `Character` 类没有 `drinkBeer` 方法，因此无法从该类直接调用此方法。\n\n实现这一点的唯一方法是通过进行类类型转换。这就像是在说：“嘿\
  \ JVM，我知道我在做什么，所以请将此类强制转换为此类型。”当我们显式地这样做时，`JVM` 允许我们使用来自 `Homer` 类的特定方法 `drinkBeer`。\n\
  \n让我们看看在代码中是如何运作的：\n\n```\n 1 public class DrinkBeer {\n 2     public static void\
  \ main(String... drinkBeer) {\n 3         drinkBeer(new Homer());\n 4     }\n 5\
  \ \n 6     static void drinkBeer(Character character) {\n 7         Homer homer\
  \ = (Homer) character; // 将 Character 转换为 Homer\n 8         homer.drinkBeer();\n\
  \ 9     }\n10 \n11     static class Character {\n12     }\n13 \n14     static class\
  \ Homer extends Character {\n15         void drinkBeer() {\n16             System.out.println(\"\
  Homer drinks a beer\");\n17         }\n18     }\n19 }\n```\n\n这段代码将通过编译并产生预期的结果——通过使用类型转换的力量，我们可以调用\
  \ `Homer` 类中的 `drinkBeer` 方法。请记住，如果特定方法只存在于子类中，你将必须在代码中使用这种技术。这种从父类到子类的转换被称为**向下转换**（downcasting）。\n\
  \n### 6.10.1 将子类转换为父类\n\n如果你想将子类转换为父类（称为**向上转换**，upcasting），这是完全可以的：\n\n```\n 1\
  \ public class SubclassToSuperClass {\n 2 \n 3     public static void main(String...\
  \ args) {\n 4         Barney barney = new Barney();\n 5         Character characterBarney\
  \ = barney; // 这完全可行\n 6     }\n 7 \n 8     static class Character { }\n 9     static\
  \ class Barney extends Character { }\n10 \n11 }\n```\n\n这个示例之所以有效是因为 `Barney` 类扩展了\
  \ `Character` 类，因此 `Barney` 类知道 `Character` 的一切。考虑到这一点，`JVM` 不会对将 `Barney` 对象转换为\
  \ `Character` 报错：`Barney 是一个 Character`。\n\n## 6.11 防止继承\n\n我们在本章中考虑了继承的各个方面，现在你应该很好地理解它的用处。但如果你想防止类的继承呢？让我们来看一些选项。\n\
  \n### 6.11.1 final 关键字\n\n有时我们不希望类被扩展。JDK 中的一个很好的例子是 `String` 类：\n\n```\nfinal class\
  \ String\n```\n\n注意 `String` 类被声明为 `final`，这意味着它的属性永远不会改变。`final` 关键字用于不允许任何类扩展它。如果你这样做：`class\
  \ AnyClass extends String { }` 代码将无法编译，因为 `String` 类是 `final` 的。\n\n关于 `final` 类的另一个重要点是，无法重写它的任何方法。这是因为你无法继承这样的类。但如果……\n\
  \n### 6.11.2 防止特定方法被重写\n\n如果你希望一个类是可以扩展的，但要防止某些方法被重写，可以在这些方法上使用 `final` 关键字。下面的示例展示了当你尝试重写\
  \ `final` 方法时会发生什么：\n\n```\nclass Character { final void performAction() { }}\n\
  class Homer extends Character {\n    void performAction() { }\n}\n```\n\n这段代码无法编译，因为无法重写\
  \ `final` 方法。使其工作的唯一方法是从方法声明中删除 `final` 关键字，如下代码所示：\n\n```\nclass Character { void\
  \ performAction() { }}\nclass Homer extends Character {\n    void performAction()\
  \ { }\n}\n```\n\n### 6.11.3 继承中的 private 修饰符\n\n保护类中特定方法的另一种方法是使用 `private` 修饰符。正如你之前学过的，私有方法或字段对子类或任何外部类都是不可见的。它们只在定义的类中可访问。\n\
  \n在下面的示例中，`Villain` 类声明了一些私有成员，然后我们在 `Joker` 子类中尝试使用它们：\n\n```\nclass Villain {\n\
  \    private int age;\n    private void attack() {}\n}\n\nclass Joker extends Villain\
  \ {\n   void doTrick() {\n        System.out.println(super.age);\n        super.attack();\n\
  \   }\n}\n```\n\n这段代码无法编译，因为 `super.age` 变量和 `super.attack` 方法在子类中不可访问。使其工作的唯一方法是删除\
  \ `private` 修饰符并使用限制性较小的选项，例如默认修饰符。\n\n\n\n```java\n 1 class Villain {\n 2     int\
  \ age;\n 3     void attack() {}\n 4 }\n\n 6 class Joker extends Villain {\n    void\
  \ doTrick() {\n        System.out.println(super.age);\n        super.attack();\n\
  \    }\n```\n\n代码现在可以正常工作了，因为我们不再使用 `private` 修饰符来限制访问。将这些成员声明为 `protected`（或 `public`）也可以。\n\
  \n## 6.12 抽象类\n\n如前所述，无法直接实例化的类被称为抽象类。它们可以包含具体方法和抽象方法（带有实现和不带实现的方法）。许多 JDK 类使用了这个概念，因为实例化它们是没有意义的。例如：\n\
  \n```java\n 1 public abstract class AbstractList<E> extends AbstractCollection<E>\
  \ implements List<\\\n 2 E> { ... }\n 3 \n4 public abstract class AbstractCollection<E>\
  \ implements Collection<E> { ... }\n 5 \n6 public abstract class AbstractSet<E>\
  \ extends AbstractCollection<E> implements Set<E>\\\n 7  { ... }\n 8 \n9 public\
  \ abstract class AbstractMap<K,V> implements Map<K,V> { ... }\n10 \n11 public abstract\
  \ class Number implements java.io.Serializable { ... }\n```\n\n让我们探索一下抽象类 `Number`。实例化该类是没有意义的，因为它太通用了。Java\
  \ 是一种强类型编程语言，所以实例化 `Number` 类并不能帮助开发者处理数字。那么，这个类有什么用呢？当我们把 `Number` 类声明为 `abstract`\
  \ 时，一切就变得合理了！\n\n我们可以在 Java 包装类中重用 `Number` 的大量代码。以下是一些继承该类的 JDK 类示例：\n\n```java\n\
  \ 1 public final class Integer extends Number\n 2         implements Comparable<Integer>,\
  \ Constable, ConstantDesc { ... }\n 3 \n4 public final class Double extends Number\n\
  \ 5         implements Comparable<Double>, Constable, ConstantDesc { ... }\n 6 \n\
  7 public final class Long extends Number\n 8         implements Comparable<Long>,\
  \ Constable, ConstantDesc { ... }\n 9 \n10 public class BigDecimal extends Number\
  \ implements Comparable<BigDecimal> { ... }\n```\n\n事实上，所有的数值包装类都继承了 `Number`。注意，它们都通过了\
  \ `is a` 测试：`Integer` 是一个 `Number`，`Double`、`Byte` 等也是如此。这些类都可以重用 `Number` 类中声明的方法，并为抽象方法提供自己的实现——这是继承良好用法的完美范例。\n\
  \n说明抽象方法用途的一个很好的例子是抽象类 `OutputStream`，因为这个类本身是没有被实例化的。\n\n继承 `OutputStream` 的一些具体类包括\
  \ `FilterOutputStream`、`ByteArrayOutputStream`、`DataOutputStream` 等。这些类是可以实例化的，并且它们继承了来自\
  \ `OutputStream` 的通用行为。\n\n```java\n1 public abstract class OutputStream implements\
  \ Closeable, Flushable { \n2 // Attributes and methods...\n3 \n4 public abstract\
  \ void write(int b) throws IOException;\n5 }\n```\n\n\n\n\n此时 `damage` 变量的计数将为 `3`，因为每次实例化我们都调用了默认的\
  \ super 构造函数。记住，当实例化子类时，父类的构造函数总是会被先调用。（如果你在好奇为什么是 `3`，请注意在攻击方法内部创建了另一个 `SpiderMan`\
  \ 实例。）\n\n最后，我们再次调用 `protonCannon` 方法——但 `SpiderMan` 实例并没有这个方法，因此将抛出 `ClassCastException`：\n\
  \n```\n((IronMan)character).protonCannon();\n```\n\n因此，最终答案将是：\n\n1. —>>>\nBoom!\n\
  Spider-Web!\n3\n在第 10 行抛出 `ClassCastException`\n\n## 6.13 工厂方法策略：折扣逻辑的实战挑战\n\n假设你在一家金融公司工作，你被指派在一个暴露的\
  \ Web 服务中为客户计算最终产品价格。外部系统需要调用你项目中的某个特定方法来重用某些逻辑。\n\n你必须创建一个方法来计算价格，并将其作为 REST 服务暴露给其他系统。你将在方法中接收一个名为\
  \ `command` 的 `String`，它用于指示应用哪种类型的折扣（`\"NORMAL_DISCOUNT\"` 或 `\"VIP_DISCOUNT\"\
  `），以及一个产品 ID，你可以通过该 ID 从你的系统中获取产品的原始价格。该方法的目标是为客户购买的产品应用相应的折扣。该方法将返回应用折扣后的产品最终价格。\n\
  \n如果传递了 `\"NORMAL_DISCOUNT\"`，你需要对接收到的产品价格应用 20% 的折扣。如果传递了 `\"VIP_DISCOUNT\"`，则你必须应用\
  \ 50% 的折扣。\n\n注意，在这种情况下你可以使用多态性：你可以将 `\"NORMAL_DISCOUNT\"` 的逻辑封装在一个特定的类中，而将 `\"\
  VIP_DISCOUNT\"` 的逻辑封装在另一个类中。为了实现这一点，你需要一个通用的 `Discount` 类，该类不能被实例化（一个抽象类），并且它有一个公共方法，对于你方法中接收的每个输入，对每个产品都提供\
  \ 10% 的折扣。\n\n作为额外奖励，创建一个单元测试方法，传递以下输入数据，并确保输出与在该情况下定义的一致。\n\n这是你将接收到的输入数据：\n\n\
  ```\n1 \"NORMAL_DISCOUNT\", 1\n2 \"VIP_DISCOUNT\", 2\n3 \"NORMAL_DISCOUNT\", 3 \n\
  4 \"NORMAL_DISCOUNT\", 4\n5 \"VIP_DISCOUNT\", 5\n6 \"NORMAL_DISCOUNT\", 6\n```\n\
  \n在你的 Product `POJO` 中创建一个填充了以下信息的 `List`：\n\n```\n1 Product(1, \"Bat Mobile\",\
  \ 1000)\n2 Product(2, \"Flying Car\", 2000)\n3 Product(3, \"PS10\", 500)\n4 Product(4,\
  \ \"Jetpack\", 800)\n5 Product(4, \"Ultima Weapon Sword\", 700)\n6 Product(5, \"\
  Duff Beer\", 10)\n```\n\n在你的逻辑实现中，你应该记录产品名称、未折扣的价格以及应用折扣后的价格，然后返回应用相应折扣后的价格。\n\n\
  ## 6.14 总结\n\n在本章中，你学习了如何良好地利用继承，以及何时选择组合而非继承。\n\n*   你还学习了如何重写继承的方法，以及如何使用多态性的强大力量。\n\
  *   你现在知道所有的 Java 类都使用继承，因为它们都扩展了 `Object`，如果你曾经重写过 `toString`、`equals` 或 `hashCode`\
  \ 方法，你已经使用过多态性。\n*   你理解了访问修饰符与继承之间的工作原理，以及如何使用 `final` 关键字或 `private` 修饰符来防止类或方法的继承。\n\
  *   虽然 Java 不允许继承自多个类，但你已经看到了如何通过继承接口来模拟这种行为。\n*   你学习了如何使用 `super` 保留关键字来访问父类的方法和构造函数。\n\
  *   你还学习了如何使用抽象类来设计组织良好且于维护的系统。\n\n# 7 接口\n\n**本章涵盖**：\n\n*   开发依赖接口而非实例的灵活代码，并设计可重用的接口\n\
  *   通过使用 `default` 方法在接口中创建方法实现\n*   决定使用接口还是抽象类\n*   在接口中使用 `static` 方法\n*   使用\
  \ `default` 方法模拟多重继承\n*   在接口中使用 `private` 方法\n*   总共 5 个 Java 代码挑战\n\n使用接口是使 Java\
  \ 代码更灵活的极佳方法。这减少了我们代码中的耦合，使得在需要时更容易进行更改和扩展。\n\n接口的作用像一份合同。任何实现给定接口合约的类都必须实现该接口中的所有公共抽象方法。通过接口，我们可以应用多态性概念，这意味着我们可以向同一个接口传递不同的实现。对于构建易于扩展的代码至关重要的概念，因为更改可能只需要在接口参数的实现中。\n\
  \n许多 Java 核心类使用了接口的概念。例如，`ArrayList`实现了 `List`，`HashSet`实现了 `Set`，`HashMap`实现了 `Map`，`ArrayDeque`实现了\
  \ `Deque` 等。\n\n## 7.1 接口与多态性\n\n为了演示接口提供的灵活性，让我们考虑一个例子。在这里，`addElement` 方法接收 `List`\
  \ 接口作为参数。这意味着我们可以向该方法传递任何实现了该接口的类实例：\n\n```\npublic class ListExample {\n  public\
  \ static void main(String... usingFlexibility) {\n    addElement(new ArrayList());\n\
  \    addElement(new LinkedList());\n    addElement(new Vector());\n    addElement(new\
  \ CopyWriteArrayList());\n  }\n\n  static void addElement(List list) {\n    list.add(\"\
  Adding elements with different types of lists.\");\n    System.out.println(list\
  \ + \":\" + list.getSimpleName());\n  }\n}\n```\n\n这是一个强大的概念，因为它意味着如果你需要处理不同的 `List`，只需发送你需要类型即可。现在想象如果你要在不使用多态性的情况下实现相同的逻辑——你必须为每种\
  \ `List` 类型复制此代码一个特定的方法：\n\n```\nimport java.util.ArrayList;\nimport java.util.LinkedList;\n\
  import java.util.Vector;\nimport java.util.concurrent.CopyWriteArrayList;\n\npublic\
  \ class AddElementWithoutPolymorphism {\n\n  public static void main(String... addingElementsWithoutPolymorphism)\
  \ {\n    addElement(new ArrayList());\n    addElement(new LinkedList());\n    addElement(new\
  \ Vector());\n    addElement(new CopyWriteArrayList());\n  }\n\n  static void addElement(ArrayList\
  \ list) {\n    list.add(\"Adding elements with different types of lists.\");\n \
  \   System.out.println(list + \":\" + list.getSimpleName());\n  }\n\n  static void\
  \ addElement(LinkedList list) {\n    list.add(\"Adding elements with different types\
  \ of lists.\");\n    System.out.println(list + \":\" + list.getSimpleName());\n\
  \  }\n\n  static void addElement(Vector list) {\n    list.add(\"Adding elements\
  \ with different types of lists.\");\n    System.out.println(list + \":\" + list.getSimpleName());\n\
  \  }\n\n  static void addElement(CopyWriteArrayList list) {\n    list.add(\"Adding\
  \ elements with different types of lists.\");\n    System.out.println(list + \"\
  :\" + list.getSimpleName());\n  }\n}\n```\n\n注意这些重复代码——这段代码难以阅读得多，维护起来也困难得多。它与之前的版本实现了相同的功能，但需要多得代码。这应该让你对接口多态性的力量有一个初步了解。\n\
  \n7.2 协变返回类型\n\n\n\n我们知道，在使用多态时，方法的签名——即方法名、返回类型和参数类型——必须是相同的。然而，返回类型必须始终是相同的吗？只有当类之间存在继承关系时，方法的返回类型才能更改，且父类必须拥有最通用的类型。例如，如果父类中的返回类型是\
  \ `Number`，那么子类的返回类型可以是 `Integer`，因为 `Integer` 继承自 `Number`。这种子类的返回类型必须比父类的返回类型更具体的（即必须与子类关系以相同的方向变化）的想法被称为“协变”（`covariance`）。\n\
  \n在下面的示例中，我们在子类 `Pterodactyl` 中重写了 `Dinosaur` 的 `move` 方法并返回一个 `String`。这之所以行通，是因为\
  \ `String` 是 `Object` 的子类。如果我们尝试在子类中使用基本类型（例如），代码将无法编译，因为基本类型不是一个 `Object`：\n\n\
  ```\n 1 public class CovariantReturn {\n 2 \n 3     public static void main(String...\
  \ dinosaurs) {\n 4         new Dinosaur().move();\n 5         new Pterodactyl().move();\n\
  \ 6     }\n 7 \n 8 }\n 9 \n10 class Dinosaur {\n 11     Object move() {\n 12   \
  \      return \"The Dinosaur is moving\";\n 13     }\n 14 }\n 15 \n16 class Pterodactyl\
  \ extends Dinosaur {\n 17     @Override\n 18     String move() {\n 19         return\
  \ \"The Pterodactyl is moving in the air\";\n 20     }\n 21 }\n```\n\n子类的返回类型必须是父类返回类型的子类。这种技术在基本类型上不起作用，因为它们之间没有继承关系。\n\
  \n### 7.2.1 Jedi 协变多态挑战\n\n在这次挑战中，我们有一个抽象类和另一个继承它的类。这里使用了协变类型的概念。你认为在 `main` 方法编译并运行后的输出会是什么？代码能编译吗？\n\
  \n```\n 1 public class YodaForce {\n 2     public static void main(String... covariantType)\
  \ {\n 3         System.out.println(new Yoda().useSaber());\n 4         System.out.println(new\
  \ Yoda().attack());\n 5         System.out.println(new Yoda().lightForce); // Line\
  \ 6\n 6     }\n 7     static abstract class LightForce {\n 8         int lightForce;\n\
  \ 9         abstract Object useSaber();\n10         abstract long attack();\n11\
  \ \n12         LightForce() {\n 13             lightForce++;\n 14         }\n 15\
  \     }\n 16     static class Yoda extends LightForce {\n 17         String useSaber()\
  \ {\n 18             return \"useSaber\";\n 19         }\n 20         \n 21    \
  \     long attack() {\n 22             return 99999; \n 23         }\n 24     }\n\
  \ 25 }\n```\n\n1. `useSaber`\n`99999`\n`3`\n2. 第 6 行编译错误\n3. `useSaber`\n`99999`\n\
  `1`\n4. `RuntimeException`\n\n这段代码可以正常编译和运行。这里演示的概念大部分关于多态性。在第一次方法调用中，我们只是简单地调用了重写的\
  \ `useSaber` 方法：\n\n`System.out.println(new Yoda().useSaber());`\n\n注意，我们在重写的方法中使用了协变返回类型：`Yoda`\
  \ 子类的 `useSaber` 方法返回的是 `String` 而不是 `Object`。该方法打印了“useSaber”。\n\n在第二次方法调用中，我们调用了另一个重写的方法\
  \ `attack`：\n\n`System.out.println(new Yoda().attack());`\n\n我们在这里不能使用协变类型，因为基本类型之间没有继承关系；两个方法返回的都是\
  \ `long`。此方法调用的输出是 `99999`。\n\n最后，我们打印了 `lightForce` 变量，每当实例化 `LightForce` 类时，该变量就会加\
  \ 1：\n\n`System.out.println(new Yoda().lightForce); // Line 6`\n\n尽管我们实例化了三次 `LightForce`\
  \ 类，但请注意 `lightForce` 变量是一个实例变量。因此，每当创建一个新实例时，该变量都会重置。我们进行了三次实例化，但该变量在三个实例中的结果都将\
  \ `1`。\n\n结论是，正确的选项是：\n\n3. `useSaber`\n`99999`\n`1`\n\n## 7.3 默认方法\n\nJava 8 必须解决一个问题。由于现有\
  \ `Collection` API 使用了函数式编程，需要在 `List`、`Set` 和 `Map` 等广泛使用的接口中添加许多新方法。想象一下，如果在 `List`\
  \ 接口中声明公共抽象方法——大量的代码将会崩溃，因为实现该接口的类将无法正确实现新方法，如果必须为所有这些类添加这些方法，代码重复将是巨大的。\n\nJava\
  \ 是一种重视向后兼容性的语言，因此决定在接口中使用带有实现的方法。通过这些被称为默认方法的新方法，可以在接口中提供一个默认实现，这样每个类就不需要提供它自己的实现了。\n\
  \nJava 8 及更高版本中广泛使用的默认方法的一个绝佳例子是 `Iterable` 接口中实现的 `forEach` 方法。该方法遍历集合中的每个元素，执行指定的动作。让我们来看：\n\
  \n```\n1 interface Iterable<T> {\n2 // 其他方法\n3 default void forEach(Consumer<? super\
  \ T> action) {\n4         Objects.requireNonNull(action);\n5         for (T t :\
  \ this) {\n6             action.accept(t);\n7         }\n8     }\n9 }\n```\n\n我们也可以在自己的类中提供默认方法。看看它是如何工作的：\n\
  \n```\n 1 public class Yoda implements Jedi {\n 2 \n 3     public static void main(String...\
  \ defaultMethod) {\n 4         new Yoda().useForce();\n 5     }\n 6 }\n 7 \n8 interface\
  \ Jedi {\n 9 \n10     default void useForce() {\n11         System.out.println(\"\
  Using the force!\");\n12     }\n13 }\n```\n\n可以看出我们不需要实现默认方法；只需实例化 `Yoda` 类并使用 `useForce`\
  \ 方法即可。输出将是：\n\nUsing the force\n\n## 7.4 抽象类与接口\n\n你可能在接口是否与抽象类相同。答案是否定的——它们之间有很多区别。由于抽象类可以拥有存储状态的实例变量，而接口只能拥有常量。此外，一个类可以实现多个接口，但只能扩展一个抽象或具体类。最后，抽象类有构造方法而接口没有。\n\
  \n下面的代码说明了抽象类和接口之间的区别。`LightForce` 抽象类有一个构造和一个实例变量 `force`。`DarkForce` 接口有一个常量 `FORCE`\
  \ 和默认方法 `useForce`。在程序的主方法中，我们调用了抽象类的构造方法和来自 `DarkForce` 接口的默认方法：\n\n```\n 1 public\
  \ abstract class LightForce {\n 2     private int force;\n 3     LightForce(int\
  \ force) {\n 4         this.force = force;\n 5         System.out.println(\"The\
  \ force is being used:\" + this.force);\n 6     }\n 7 \n 8     public static void\
  \ main(String... abstractClassesVsInterfaces) {\n 9         new LukeSkywalker(1099);\n\
  \ 10         new DarthVader().useForce();\n 11     }\n 12 }\n 13 \n14 interface\
  \ DarkForce {\n 15     int FORCE = 999;\n 16 \n 17     default void useForce() {\n\
  \ 18         System.out.println(\"The force is being used:\" + FORCE);\n 19    \
  \ }\n 20 }\n 21 \n22 class LukeSkywalker extends LightForce {\n 23     LukeSkywalker(int\
  \ force) {\n 24         super(force);\n 25     }\n 26 }\n27 class DarthVader implements\
  \ DarkForce {}\n```\n\n该程序的输出将是：\n\nThe force is being used:1099\n\nThe force is\
  \ being used:999\n\n\n\n\n正如你所看到的，即使使用了默认方法，接口与类仍然有很大不同。默认方法只能接收参数作为变量，而如果我们在接口中声明一个变量，它必须是一个常量。然而，默认方法是避免代码重复的极佳解决方案，同时也是允许我们创建具有意义代码的更复杂接口的一大特性。\n\
  \n### 7.4.1 抽象类 VS 接口挑战\n\n在接下来的挑战中，我们有一个接口和一个抽象类。接口有一个默认方法 `useSaber`，而在抽象类中我们实现了方法\
  \ `attack`。我们还在 `main` 方法中使用了匿名内部类的概念。你认为当运行这个程序时会发生什么呢？\n\n```\n 1 public class\
  \ LightVsDarkSide {\n 2 \n 3     public static void main(String... abstractVsInterface)\
  \ {\n 4         Object object = new ObiWan() {\n 5             int attackPower =\
  \ 99999;\n 6             Object jump() {\n 7                 attackPower = 999999;\
  \             // Line 7\n 8                 return attack(attackPower);\n 9    \
  \         }}.jump();\n10 \n 11         System.out.println(object);\n 12 \n 13  \
  \       DarthMaul darthMaul = new DarthMaul() {\n 14             int defencePower\
  \ = 99999;             // Line 14\n 15             public void useSaber() {\n 16\
  \                 System.out.println(\"DarthMaul loses the saber and defends with\
  \ the p\\\n17 ower of \" + defencePower);\n 18             }\n 19         };\n 20\
  \ \n 21         darthMaul.useSaber();\n 22     }\n 23 \n 24 }\n 25 \n 26 abstract\
  \ class ObiWan {\n 27     Object attack(int attackPower) {\n 28         return \
  \ \"ObiWan attacks DarthMaul with the power of \" + attackPower;\n 29     }\n 30\
  \ }\n 31 \n 32 interface DarthMaul {\n 33     default void useSaber() {\n 34   \
  \      System.out.println(\"DarthMaul uses the saber\");\n 35     }\n 36 }\n```\n\
  \n1. 第 7 行出现编译错误\n2. 第 14 行出现编译错误\n3. ObiWan attacks DarthMaul with the power of\
  \ 999999\n   DarthMaul uses the saber\n4. ObiWan attacks DarthMaul with the power\
  \ of 999999\n   DarthMaul loses the saber and defends with the power of 99999\n\n\
  **解释**：\n\n让我们分析代码以理解发生了什么。在 `main` 方法的前几行中，我们使用了匿名内部类的概念。正如之前第 4 章所解释的那样，匿名内部类是一个没有名字且仅使用一次的类。它可以定义静态成员和类方法，扩展另一个类，或实现接口。\n\
  \n在我们的案例中，匿名内部类扩展了 `ObiWan` 并声明了 `attackPower` 变量。然后它重写了 `Object` 类的 `jump` 方法，将\
  \ `attackPower` 的值更改为 `999999`。方法中的最后一条指令是调用 `attack` 方法；我们传递了 `attackPower` 变量，它会正常打印\
  \ `String`。\n\n接下来，我们使用相同的匿名内部类概念来实现 `DarthMaul` 接口。请注意，我们没有实例化接口或抽象类；我们使用的是扩展抽象类或实现接口的无名类。在这个匿名内部类的开头，我们声明了一个名为\
  \ `defencePower` 的常量。然后我们重写了默认的 `useSaber` 方法，并将 `defencePower` 变量传递进去。最后，我们从 `DarthMaul`\
  \ 调用了 `useSaber` 方法。\n\n结论是，最终结果将：\n4. ObiWan attacks DarthMaul with the power of\
  \ 999999\n   DarthMaul loses the saber and defends with the power of 99999\n\n##\
  \ 7.5 接口中的静态方法\n\n接口中可以使用静态方法，就像在普通类中使用它们一样。我们只需要使用接口名称并调用静态方法，如下所示：\n\n```\n 1\
  \ public class StarWarsWarrior {\n 2 \n 3     public static void main(String...\
  \ staticMethodOnInterfaces) {\n 4         Chewbacca.roar();\n 5     }\n 6 \n 7 }\n\
  \ 8 \n 9 interface Chewbacca {\n10 \n 11     static void roar() {\n 12         System.out.println(\"\
  Roar!\");\n 13     }\n 14 }\n```\n\n在这种情况下，输出将是 \"Roar!\"。只需记住，当你使用接口的静态或默认方法时，不能使用访问修饰符\
  \ `protected`；如果你尝试这样做，将会得到编译错误。\n\n关于静态方法的另一个需要理解的重要点是，它们不能被重写。考虑到静态方法是类方法而不是实例方法，这是符合逻辑的。\n\
  \n如下示例所示，调用接口中定义的静态方法的唯一方法是通过引用接口名称并调用该方法。如果你尝试通过接口实现实例来调用静态方法，代码将无法编译：\n\n```\n\
  \ 1 public class LukeSkyWalker implements Jedi {\n 2 \n 3     public static void\
  \ main(String... methodShadowing) {\n 4         Jedi luke = new LukeSkyWalker();\n\
  \ 5         luke.useSaber(); // This line won't compile\n 6         Jedi.useSaber();\n\
  \ 7     }\n 8 \n 9 }\n10 \n11 interface Jedi {\n12 \n13     static void useSaber()\
  \ {\n 14         System.out.println(\"Luke uses his\");\n 15     }\n 16 }\n```\n\
  \n上面的代码将输出：Luke uses his\n\n## 7.6 模拟多继承\n\n你是否想过如果一个类实现了两个接口，将调用哪一个接口方法？如果你在实现类中没有包含特定的方法，代码将无法编译。\n\
  \n以下示例演示了这一点。`Anakin` 类实现了接口 `Jedi` 和 `Sith`，它们都声明了 `useSaber` 方法：\n\n```\n 1 public\
  \ class Anakin implements Jedi, Sith {\n 2 \n 3     public static void main(String...\
  \ defaultInheritance) {\n 4         new Anakin().useSaber();\n 5     }\n 6 \n 7\
  \      @Override\n 8      public void useSaber() {\n 9         System.out.println(\"\
  Anakin's Saber slash\");\n 10         Jedi.super.useSaber();\n 11         Sith.super.useSaber();\n\
  \ 12     }\n 13 \n 14 }\n 15 \n 16 interface Jedi {\n 17     default void useSaber()\
  \ {\n 18         System.out.println(\"Jedi's Saber slash\");\n 19     }\n 20 }\n\
  \ 21 \n 22 interface Sith {\n 23     default void useSaber() {\n 24         System.out.println(\"\
  Sith's Saber slash\");\n 25     }\n 26 }\n```\n\n此程序的输出将是：\n\n```\n1 Anakin's Saber\
  \ slash\n2 Jedi's Saber slash\n3 Sith's Saber slash\n```\n\n这个示例还演示了如何使用 `super`\
  \ 关键字引用特定的接口方法。需要注意的是，我们只有在实现接口时才能这样做。总之，正如上一章所提到的，虽然 Java 实际上并不支持多继承，但确实有一些方法可以模拟这种行为。\n\
  \n### 7.6.1 Chewbacca 默认攻击挑战\n\n这个挑战探索了多态和静态方法的概念。你能猜到当执行这个程序时会发生什么吗？\n\n\n\n\n\
  ```java\n 1 public class ChewbaccaWarrior implements Warrior {\n 2 \n 3     public\
  \ static void main(String... doYourBest) {\n 4         pilotShip();\n 5        \
  \ new ChewbaccaWarrior().attack();\n 6     }\n 7 \n 8     public void run() {\n\
  \ 9         System.out.println(\"Chewbacca is running\");\n10     }\n 11 \n12  \
  \   static void pilotShip() {\n 13         System.out.println(\"Chewbacca pilots\
  \ the ship\");\n 14     }\n 15 }\n 16 \n17 interface Warrior extends Brave {\n 18\
  \     int attackForce = 99999;\n 19 \n20     default void attack() {\n 21      \
  \   System.out.println(\"Warrior attack:\" + attackForce);\n 22         run(); \
  \ // Line 27\n 23         Brave.super.attack();\n 24     }\n 25 \n26     static\
  \ void pilotShip() {\n 27         System.out.println(\"Warrior pilots the ship\"\
  );\n 28     }\n 29 \n30     void run();\n 31 }\n 32 \n33 interface Brave {\n 34\
  \     default void attack() {\n 35         System.out.println(\"Brave attack\");\n\
  \ 36     }\n 37 }\n```\n\n1. 第 4 行编译错误\n2. Chewbacca pilots the ship\n    Warrior\
  \ attack:99999\n    Chewbacca is running\n    Brave attack\n3. 第 5 行编译错误\n4. 第 27\
  \ 行编译错误\n\n**解释**：\n\n如果你猜它可以正常编译，那么你通过了这次挑战——恭喜你！如果没有，不要担心；在我们分析代码时你就会明白原因。\n\n\
  我们在 `main` 方法中调用的第一个方法是静态方法 `pilotShip`：\n\n`pilotShip();`\n\n在这种情况下，将调用 `ChewbaccaWarrior`\
  \ 类中的 `pilotShip` 方法，因为我们没有显式表示想要从另一个类或接口调用 `pilotShip` 方法。JVM 会自动添加包含类的类名，如下所示：\n\
  \n`ChewbaccaWarrior.pilotShip();`\n\n记住，静态方法无法使用多态，因此它们始终引用类，而不是实例。\n\n现在我们将探索多态。在第二行中，我们调用了\
  \ `attack` 方法：\n\n`new ChewbaccaWarrior().attack();`\n\n该方法在 `Warrior` 和 `Brave`\
  \ 接口中都声明了。`Warrior` 接口覆盖了 `Brave` 接口的 `attack` 方法，因此 `Chewbacca` 类将使用 `Warrior`\
  \ 方法而不是 `Brave` 方法。\n\n让我们仔细查看一下 `Warrior` 接口中默认的 `attack` 方法：\n\n```java\n1 default\
  \ void attack() {\n2     System.out.println(\"Warrior attack: \" + attackForce);\n\
  3     run();\n4     Brave.super.attack();\n5 }\n```\n\n第一行简单地打印 `Warrior attack:\
  \ 99999`。记住 `attackForce` 常量不能修改的——接口没有状态，因此它们不能拥有实例变量。\n\n在 `attack` 方法的第二行中，我们调用了\
  \ `run()`。乍看之下似乎很奇怪，因为看起来我们正在调用一个没有体的方法。只需记住，在没有实例的情况下无法调用默认方法，而要拥有实例，必须拥有接口的实现；因此，我们可以得出，每当我们调用这个\
  \ `attack` 方法时，我们总会有 `run` 方法的实现。这正是我们挑战中正在发生的情况。`ChewbaccaWarrior` 类实现了 `Warrior`\
  \ 接口，并且也实现了 `run` 方法。因此，`ChewbaccaWarrior` 类中 `run` 方法实现的代码将执行执行。所以，此方法调用将打印：\n\n\
  `Chewbacca is running`\n\n`Warrior` 接口的 `attack` 方法的最后一行调用了 `Brave` 接口的默认 `attack`\
  \ 方法。这将会打印：\n\nBrave attack\n\n结论，正确的选项是 B。\n\n## 7.7 接口中的私有方法\n\nJava 9 引入了在接口中包含私有方法的可能性，目的是避免代码重复。有时在默认方法中需要一些代码，而能够在能够在私有方法中实现我们的逻辑是非常方便的。\n\
  \n让我们来看一个默认方法中需要代码重复的示例：\n\n```java\n1 public interface HanSolo {\n2 \n3     default\
  \ void shootWithBlaster() {\n4         String weapon = \"Blaster\";\n5         System.out.println(\"\
  Choose the weapon:\" + weapon);\n6         System.out.println(\"Get the \" + weapon);\n\
  7         System.out.println(\"Aim the \" + weapon);\n8         System.out.println(\"\
  Shoot with \" + weapon);\n9     }\n10 \n11     default void shootWithBowcaster()\
  \ {\n12         String weapon = \"Bowcaster\";\n13         System.out.println(\"\
  Choose the weapon:\" + weapon);\n14         System.out.println(\"Get the \" + weapon);\n\
  15         System.out.println(\"Aim the \" + weapon);\n16         System.out.println(\"\
  Shoot with \" + weapon);\n17     }\n18 \n19 }\n```\n\n这里有很多重复！现在让我们看看使用私有方法重构它会发生什么。这个示例演示了为什么私有方法对接口非常重要，以及如何利用这一特性：\n\
  \n```java\n1 public interface HanSolo {\n2     default void shootWithBlaster() {\n\
  3         String weapon = \"Blaster\";\n4         shoot(weapon);\n5     }\n6   \
  \  default void shootWithBowcaster() {\n7         String weapon = \"Bowcaster\"\
  ;\n8         shoot(weapon);\n9     }\n10     private void shoot(String weapon) {\n\
  11         System.out.println(\"Choose the weapon:\" + weapon);\n12         System.out.println(\"\
  Get the \" + weapon);\n13         System.out.println(\"Aim the \" + weapon);\n14\
  \         System.out.println(\"Shoot with \" + weapon);\n15     }\n16 }\n```\n\n\
  这是一种简单得多且具复用性的方法。\n\n### 7.7.1 私有 Jedi 跳挑战\n\n这个挑战探索了与私有、静态和默认接口方法相关的概念以及如何操作它们。你能猜到\
  \ `main` 方法执行时会发生什么吗？\n\n```java\n1 public class JediAttack {\n2     interface Jedi\
  \ {\n3         default int attack() {\n4             return jump() + useSaber()\
  \ + useForce();\n5         }\n6 \n7         private int jump() { return 1; }\n8\
  \         private static int useSaber() { return 3; }\n9         private int useForce()\
  \ { return 5; }\n10     }\n11     public static void main(String... doYourBest)\
  \ {\n12         System.out.println(new Jedi() {\n13             public int jump()\
  \ { // Line 13\n14                 return 2;\n15             }\n16         }.attack()\
  \ + Jedi.useSaber()); // Line 16\n17     }\n18 }\n```\n\n1. 13\n2. 12\n3. 第 14 行编译错误\n\
  4. 第 16 行编译错误\n\n\n\n\n\n你熟悉 `Command` 设计模式吗？通过你在本章中获得的知识，你将能够编写出遵循该模式的代码。`Thread`\
  \ 类是 `Command` 模式的一个绝佳示例——当我们启动一个 `Thread` 时，`run` 方法中的逻辑将被执行。这就是这个真实世界挑战的核心。\n\n\
  你的目标是验证一个产品是否符合折扣条件。你将在 `CommandExecutor` 中接收一个包含 `name`、`price`、`type` 和 `quantity`\
  \ 的 `Product`，以及一个包含三个 `Commands` 的 `List` 来处理不同的业务需求。\n\n在第一个 `Command` 中，你将实现逻辑来验证\
  \ `product quantity` 至少为 `2`。在第二个 `Command` 中，你将检查两个产品的价格是否至少为 `500`。最后，你验证产品类型是否为机器人（robotics）。如果所有条件都满足，你将记录一条消息：\n\
  \n`The product $productName is eligible for a discount`\n\n## 7.9 总结\n\n通过你在本章中获得的知识，你将能够通过接口结合多态和方法重写的概念，以更加松耦合且易于维护的方式来设计你的系统。多态是任何面向对象编程语言中最重要且最困难的概念之一，理解它将使掌握其他概念变得容易得多。\n\
  \n- 你学习了接口可以扩展另一个接口，这在你设计类时将非常有帮助。JDK 中的许多类都使用了这一概念。\n- 你了解接口和抽象类之间的区别，以及何时该使用哪一个。\n\
  - 你还知道如何在接口中使用 `default`、`static` 和 `private` 方法，以及如何通过 `default` 方法模拟多重继承。\n\n\
  # 8 异常\n\n**本章涵盖**：\n\n- 理解检查异常（checked exceptions）和未检查异常（unchecked exceptions）之间的区别，以及何时使用每种类型\n\
  - 使用堆栈跟踪（stack trace）识别错误的根源\n- 在代码中处理或声明检查异常\n- 有效使用 `try`、`catch`、`finally` 控制流\n\
  - 使用 `try-with-resources` 语句有效地关闭 Java 资源\n- 在单个 `catch` 块中捕获多个异常\n- 创建符合应用程序逻辑的自定义异常\n\
  - 使用“早抛出，后捕获”原则提高代码质量\n- 总共 **4 个 Java 代码挑战**\n\n异常——程序执行过程中发生的非预期或意外事件，它们会破坏程序指令的正常流程——是\
  \ Java 中最需要掌握的概念之一。作为开发者，你每天都需要处理它们。当异常处理不当时，Bug 更容易隐藏。这会给开发者带来巨大的压力，因此理解如何有效地使用异常至关重要。\n\
  \n当发生错误时，经常看到一些对开发者没有帮助的异常——例如，日志信息糟糕的通用异常。理解异常的核心概念以及在不同情况下最适合使用哪种异常，将对你开发的软件产生巨大影响。成功吸收本章内容，对于想要交付高质量代码的专业\
  \ Java 开发者将会有巨大的帮助。\n\n## 8.1 检查异常和未检查异常\n\n异常有两种主要类型：检查异常和未检查异常。理解它们之间的区别对于有效处理异常至关重要。\n\
  \n当我们希望一个类始终处理或声明异常时，应该使用检查异常。这些是在是在编译时检查的条件，因此它们可以被处理，程序也可以继续执行。当我们不希望应用程序恢复或处理异常时，应该使用未检查异常。这些异常在运行时检查，通常是程序控制之外的条件，并且应该导致执行停止。\n\
  \n正如 `Object` 是 Java 中所有对象类型的父类一样，`Throwable` 是所有异常类型（包括检查异常和未检查异常）的父类。当方法发生异常时，该方法会创建一个类型为\
  \ `Throwable`的对象，因此有了“抛出”（throwing）异常的术语。\n\n在有了这些介绍的基础上，让我们仔细查看不同异常类型的细节。\n\n###\
  \ 8.1.1 检查异常\n\n检查异常由方法抛出时会导致编译错误，除非它们被另一个方法处理，否则程序执行将停止。因此，许多开发者说检查异常破坏了封装的概念（即数据和处理该数据的方法应该包含在单元中，如类中）。在某种意义上他们是对的，因为抛出异常的方法会在逻辑上知道另一个方法正在抛出异常。\n\
  \n通常情况下，当你处理必须明确的业务业务需求时，或者当你无法控制应用程序中使用的外部资源时，应该使用检查异常。\n\n在处理 JDK 中著名的 `JDBC`（数据库操作）API\
  \ 时，你可以看到许多检查异常的示例。假设你正在使用一个外部数据库，当由于某种原因尝试访问它时，数据库没有运行。当数据库宕机时，抛出一个异常让我们知道发生了什么是有意义的。\n\
  \n使用检查异常，你将确定该异常确实被抛出了，因为如果你不处理异常，编译器就会报错。你也可以使用自定义日志消息来使错误变得清晰。\n\n让我们来看一个检查异常的运行示例：\n\
  \n```\n 1 public static Connection getConnection() {\n 2     Connection connection\
  \ = null;\n 3     try {\n 4         connection = DriverManager.getConnection(\n\
  \ 5             \"jdbc:postgresql://localhost:5432/anyDatabase\", \"user\", \"password\"\
  );\n 6     } catch (SQLException sqlException) {\n 7         // 一些逻辑\n 8       \
  \  sqlException.printStackTrace();\n 9     }\n 10 \n 11\n```\n\n有几种不同的策略可以恢复这种错误。例如，你可以从另一个数据库返回\
  \ `Connection`，或者将 `sqlException` 包装在更通用的类型中。你也可以使用通用异常来避免在单个方法中抛出多个异常，就像这里使用的 `InfrastructureException`：\n\
  \n```\n1 public static Connection getConnection() {\n 2     try {\n 3         return\
  \ connection = DriverManager.getConnection(\n 4             \"jdbc:postgresql://localhost:5432/anyDatabase\"\
  , \"user\", \"password\");\n 5     } catch (SQLException sqlException) {\n 6   \
  \      throw new InfrastructureException (sqlException);\n 7     }\n 8 }\n```\n\n\
  所有检查异常都继承自 `Exception`，它是 `Throwable` 的子类。\n\n### 8.1.2 未检查异常\n\n当你希望应用程序停止工作并且不想从错误状态中恢复时，未检查异常非常有用。它们用于应用程序运行时可能出现的问题，且不会导致编译错误。\n\
  \n所有未检查异常都继承自 `RuntimeException`，它是 `Exception` 的子类。\n\n在 JDK 代码中广泛使用的著名的 `NullPointerException`\
  \ 是 `RuntimeException` 用法的一个绝佳实践示例。考虑 `String` 类中 `toUpperCase` 方法的示例：\n\n```\n\
  1 public String toUpperCase(Locale locale) {\n 2     if (locale == null) {\n 3 \
  \        throw new NullPointerException();\n 4     }\n 5     ...\n 6 }\n```\n\n\n\
  \n\n请注意，我们简单地抛出了 `NullPointerException` 而没有对其进行处理。`Locale` 类对于该方法的逻辑至关重要；如果没有 `Locale`（一个表示特定地理、政治或文化区域的对象），那么实现\
  \ `toUpperCase` 方法的程序员的意图是让应用程序崩溃。\n\n另一个著名的例子是 `IllegalArgumentException`，当向方法传递了意外之外的参数时，应该抛出该异常。JDK\
  \ 中的 `File` 类在传递的统一资源标识符（`URI`）无效时会使用 `IllegalArgumentException`，因为没有办法通过程序手段来处理这种情况：\n\
  \n```\n1 public File(URI uri) {\n2     if (!uri.isAbsolute())\n3         throw new\
  \ IllegalArgumentException(\"URI is not absolute\");\n4         ...\n5 }\n```\n\n\
  ### 8.1.3 JVM 错误\n\n除了 `Exception` 和 `RuntimeException` 外，还有 `Error`。这是可能发生的最严重的错误类型，且永远应该被处理。Java\
  \ 中的各种错误类型都继承自 `Error`，而 `Error` 像 `Exception` 一样继承自 `Throwable` 类。一个例子是 `StackOverflowError`，它表示内存栈出现了问题。如果发生这种情况，应用程序应该立即崩溃。\n\
  \n我们可以通过创建一个递归方法调用来引发 `StackOverflowError`。如果问题没有被捕获，该方法将无限地调用自己，最终耗尽系统的内存资源：\n\n\
  ```\n1 void pressButton(String employeeName) {\n2     pressButton(\"Homer\");\n\
  3 }\n```\n\n### 8.1.4 异常层次结构\n\n图 8.1 展示了 Java 中各种 `Exception` 和 `Error` 类之间的关系。请注意，这些只是父类类型（`Exception`、`Error`、`RuntimeException`\
  \ 等）子类的少数代表性示例。要理解的关键是，所有检查异常都继承自 `Exception`，而所有非检查异常都继承自 `RuntimeException` 或\
  \ `Error`。\n\n![](img/exceptions_hierarchy_diagram.png)\n\n图 8.1 Java 中的异常层次结构\n\
  \n如你所示，`SQLException` 和 `FileNotFoundException` 是检查异常，而 `NullPointerException` 和\
  \ `StackOverflowError` 都是非检查异常。异常树顶部的类 `Throwable` 也是一个检查异常。\n\n## 8.2 堆栈跟踪 (Stack\
  \ Trace)\n\n异常最重要的特征可能就是堆栈跟踪。通过这些信息，我们可以追踪到错误的根源（错误发生在哪个方法中），然后弄清楚发生了什么以及如何修复。\n\
  \n考虑以下示例，异常将从 `applyDiscount` 服务方法抛出，该方法是从控制器类（与应用程序前端连接的类）被调用的：\n\n```\n 1 public\
  \ class BillingController {\n 2 \n3     BillingService billingService;\n 4 \n5 \
  \    BillingController(BillingService billingService) {\n6         this.billingService\
  \ = billingService;\n7     }\n 8 \n9     public static void main(String... stackTrace)\
  \ {\n10         BillingController controller = new BillingController(new BillingService());\n\
  11         controller.applyDiscount(\"1\");\n12     }\n13 \n14     void applyDiscount(String\
  \ customerId) {\n15         billingService.applyDiscount(customerId);\n16     }\n\
  17 }\n18 \n19 class BillingService {\n20     void applyDiscount(String customerId)\
  \ {\n21         throw new RuntimeException();\n22     }\n23 }\n```\n\n当执行 `main`\
  \ 方法时，将抛出一个 `RuntimeException` 并且堆栈跟踪将打印到控制台（这是每当抛出未处理的异常时的默认行为）。在这种情况下，异常的堆栈跟踪将如下：\n\
  \n```\n1 Exception in thread \"main\" java.lang.RuntimeException\n2 \tat exceptions.stacktrace.BillingService.applyDiscount(BillingService.java:5)\n\
  3 \tat exceptions.stacktrace.BillingController.applyDiscount(BillingController.java:17)\n\
  4 \tat exceptions.stacktrace.BillingController.main(BillingController.java:13)\n\
  ```\n\n请注意，堆栈跟踪是一个方法列表，从抛出异常的根方法（即 `applyDiscount`）到接收异常的最后一个方法（即 `main`）。\n\n###\
  \ 重要异常方法\n\n除了 `printStackTrace` 方法外，还有一个 `getMessage` 方法，它会告知应用程序中发生了什么错误。我们可以在\
  \ `Exception` 类或任何自定义异常的构造函数中传递此消息。\n\n```\n 1 public class NoBeerException extends\
  \ Exception {\n 2 \n3   NoBeerException(String message) {\n4     super(message);\n\
  5   }\n 6 \n7   public static void main(String[] args) throws NoBeerException {\n\
  8     throw new NoBeerException(\"All the beer is gone :(\");\n9   }\n10 }\n```\n\
  \n注意我们正在将异常消息传递给构造函数。这赋予了我们很多力量使错误清晰且容易修复。\n\n还有一个 `getCause` 方法，它可以帮助你找到异常的根源。\n\
  \n## 8.3 处理或声明检查异常\n\n当我们处理检查异常时，必须要么处理它们，要么声明它们。如果我们不这样做，代码将无法编译。例如，JDBC API 中有许多检查异常。我们有义务要么通过\
  \ `try` 和 `catch` 处理来自 JDBC API 的检查异常，要么在方法签名中抛出该异常。\n\n例如，当我们尝试创建一个 `File` 时，如果不处理或声明\
  \ `FileNotFoundException`，代码将无法编译：\n\n```\n1 public static void main(String[] args)\
  \ {\n2     File file = new File(\"Simpsons.txt\");\n3     BufferedReader br = new\
  \ FileReader(file);\n4 }\n```\n\n这里我们有两种选择。要么使用 `try` 和 `catch` 块处理它：\n\n```\n1\
  \ public static void main(String[] args) {\n2     File file = new File(\"Simpsons.txt\"\
  );\n3     try {\n4         BufferedReader br = new FileReader(file);\n5     } catch\
  \ (FileNotFoundException e) {\n6         e.printStackTrace();\n7     }\n8 }\n```\n\
  \n要么在方法签名中使用 `throws` 子句声明它：\n\n```\n1 public static void main(String[] args) throws\
  \ FileNotFoundException {\n2     File file = new File(\"Simpsons.txt\");\n3    \
  \ BufferedReader br = new FileReader(file);\n4 }\n```\n\n记住，这对于检查异常。当我们处理 `RuntimeException`\
  \ 或非检查异常时，不需要执行任何操作，因为理论上非检查异常不应该被处理，而应该通过编程避免。\n\n在我们处理异常的示例中，注意 `printStackTrace`\
  \ 方法的使用：\n\n`e.printStackTrace()`\n\n该方法将异常及其堆栈跟踪打印到标准错误流，这对于调试非常有帮助。\n\n### 8.3.1\
  \ throws 和 throw new\n\n我们刚刚看到 `throws` 关键字用于声明 `exception`。与之相关的是 `throw` 关键字，我们可以用它在方法中抛出特定的异常。这在实际应用程序中广泛使用，我们想要将更具体的异常封装在通用异常中。例如，在金融应用程序中，我们可能想创建一个通用的\
  \ `BusinessException` 和一个具体的 `NoAccountBalanceException`。让我们看看它们可能是什么样。\n\n首先我们创建一个通用的异常：\n\
  \n```\n1 class BusinessException extends Exception {\n2 \n3     BusinessException()\
  \ { }\n4 \n5     BusinessException(Exception exception) {\n6         super(exception);\n\
  7     }\n8 }\n```\n\n然后创建一个继承通用异常的更具体的异常：\n\n`class NoAccountBalanceException extends\
  \ BusinessException { }`\n\n如果我们有一个实现取款逻辑的 `BankAccountService` 类，那么当账户余额不足以满足取款请求时，我们可以抛出\
  \ `NoAccountBalanceException`：\n\n\n\n\n\n```java\nclass BankAccountService {\n\
  \    \n    void withdrawMoney(String accountNumber, double moneyAmount) throws NoAccountBalanceException\
  \ {\n        // 执行逻辑\n        throw new NoAccountBalanceException();\n    }\n}\n\
  ```\n\n现在考虑使用我们创建的服务的控制器类。在这个类中，我们只想抛出通用的 `BusinessException`。为了实现这一点，我们需要将 `NoAccountBalanceException`\
  \ 封装在 `BusinessException` 中：\n\n```java\npublic class BankAccountController {\n\n\
  \    BankAccountService bankAccountService;\n    BankAccountController(BankAccountService\
  \ bankAccountService) {\n        this.bankAccountService = bankAccountService;\n\
  \    }\n\n    void withdrawMoney(String customerId, double moneyAmount) throws BusinessException\
  \ {\n        try {\n            bankAccountService.withdrawMoney(customerId, moneyAmount);\n\
  \        } catch (NoAccountBalanceException noAccountBalanceException) {\n     \
  \       throw new BusinessException(noAccountBalanceException);\n        }\n   \
  \ }\n\n}\n```\n\n了解如何使用 `throw` 和 `throws` 关键字对代码有很大影响。记住，`throws` 将用于方法签名，而 `throw`\
  \ 将直接用在代码逻辑中。\n\n## 8.4 try, catch, finally\n\n在处理异常时有三个指令至关重要：`try`、`catch` 和 `finally`。\n\
  \n`try` 块应用于定义可能发生异常或错误的逻辑。\n\n`catch` 块是你提供处理异常代码的地方。只有当抛出指定类型的异常时，该代码才会执行。你可以在此处包含任何适当的逻辑，但通常会打印堆栈跟踪信息，以便更容易发现并处理错误。你可以包含多个\
  \ `catch` 块来处理不同的异常（正如你在本章稍后将看到的），或者你可以跳过此语句直接进入 `finally` 块。\n\n`finally` 块在 `try`\
  \ 块退出时始终会被执行，只要它是正常退出的。如果抛出了被 `catch` 子句处理的异常，它会在该块执行完毕后执行。\n\n此规则的例外是 `try` 或 `catch`\
  \ 块调用了 `System.exit()` 方法。在这种情况下，`finally` 块将不会执行。\n\n包含 `finally` 块也是可选的，但它是执行清理工作或任何你始终想要执行的操作良好地方，无论是否抛出了任何异常。\n\
  \n让我们来看一个 `try`、`catch` 和 `finally` 的实际示例。在这里，我们在 `try` 块中执行简单逻辑，并强制抛出一个 `NullPointerException`，因为\
  \ `remoteControl` 变量为 null，而我们随后尝试使用 `equals` 方法。`NullPointerException` 将在 `catch`\
  \ 块中被捕获，尽管发生了异常，`finally` 块也会执行：\n\n```java\npublic class PokerWithTheJoker {\n\n\
  \    public static void main(String... tryCatchFinally) {\n        try {\n     \
  \       System.out.println(\"Batman calls the BatMobile\");\n            String\
  \ remoteControl = null;\n            remoteControl.equals(\"BatMobile\");\n    \
  \    } catch (Exception exception) {\n            System.out.println(\"The BatMobile\
  \ takes a long time to arrive\");\n            exception.printStackTrace();\n  \
  \      } finally {\n            System.out.println(\"Batman is late for playing\
  \ poker with the Joker\");\n        }\n    }\n\n}\n```\n\n该程序的输出将是：\n\n```\nBatman\
  \ calls the BatMobile\nThe BatMobile takes a long time to arrive\njava.lang.NullPointerException\n\
  \tat exceptions.trycatchfinally.PokerWithTheJoker.main(PokerWithTheJoker.java:9)\n\
  Batman is late for playing poker with the Joker\n```\n\n早些时候我提到通过调用 `System.exit`\
  \ 方法可以避免 `finally` 块的执行。让我们来看一下：\n\n```java\npublic class OutlawJoker {\n\n    public\
  \ static void main(String... avoidingFinallyExecution) {\n        try {\n      \
  \      // 某些逻辑\n            System.exit(0);\n        } finally {\n            System.out.println(\"\
  Is the Joker getting caught?\");\n        }\n    }\n\n}\n```\n\n这会导致程序执行无论如何都停止，因此\
  \ `finally` 块中的代码不会运行。这个示例还演示了在没有 `catch` 的情况下使用 `try` 和 `finally`。这非常有用，例如，即使发生某些意外错误，你想在所有情况下都关闭特定资源。\n\
  \n### 8.4.1 深入研究 catch 块\n\n我们如何知道 `catch` 块是否会捕获异常？回答这个问题最有效的方法是使用我们在第 6 章中探索过的“is-a”（是一个）问题。如果该问题的答案是“是”，那么异常应该被捕获。让我们来看一些实际代码示例：\n\
  \n```java\nimport java.io.IOException;\n\npublic class CatchThemAll {\n\n    public\
  \ static void main(String... catchThemAll) {\n        try {\n            throw new\
  \ NullPointerException();\n        } catch (RuntimeException runtimeException) {\n\
  \        try {\n            throw new IOException();\n        } catch (Exception\
  \ exception) {\n        try {\n            throw new StackOverflowError();\n   \
  \     } catch (Error error)\n}\n```\n\n注意，`NullPointerException`、`IOException` 和\
  \ `StackOverflowError` 分别被更通用的类型 `RuntimeException`、`Exception` 和 `Error` 捕获。这是因为在每情况下\
  \ is-a 关系都成立：\n\n*   `NullPointerException` 是一个 `RuntimeException`。\n*   `IOException`\
  \ 是一个 `Exception`。\n*   `StackOverflowError` 是一个 `Error`。\n\n小心不要比你抛出的更具体的类型：如果你抛出一个\
  \ `RuntimeException` 但捕获一个 `IllegalArgumentException`，那么更通用的异常将不会被捕获。在这种情况下，is-a\
  \ 关系并不成立。\n\n### 8.4.2 Ryuuken 挑战\n\n现在你已经知道 `try`、`catch` 和 `finally` 块是什么，让我们在一个挑战中探索这些概念。你能猜到执行\
  \ main 方法时输出会是什么吗？\n\n```java\npublic class RyuShukenException {\n\n    public static\
  \ void main(String... doYourBest) {\n        try {\n            String ryu = null;\n\
  \            ryu.contains(\"Shoryuken\");\n        } catch(Error error) {\n    \
  \        System.out.println(\"Akuma Secret Art\");\n        } finally {\n      \
  \      System.out.println(\"Shinkuu Hadouken\");\n        }\n\n        System.out.println(\"\
  Isshun Sengiku\");\n    }\n\n}\n```\n\n1.  Shinkuu Hadouken\n    Isshun Sengiku\n\
  2.  java.lang.NullPointerException will be thrown\n    Shinkuu Hadouken\n3.  java.lang.NullPointerException\
  \ will be thrown\n    Akuma Secret Art\n    Shinkuu Hadouken\n4.  java.lang.NullPointerException\
  \ will be thrown\n    Akuma Secret Art\n    Shinkuu Hadouken\n    Isshun Sengiku\n\
  \n**解释**：\n\n让我们先分析 `try` 块。注意我们正在尝试访问空变量 `ryu` 的方法，这导致抛出了众知的 `NullPointerException`：\n\
  \n```java\ntry {\n    String ryu = null;\n    ryu.contains(\"Shoryuken\");\n}\n\
  ```\n\n在下一个代码块中我们有 `catch` 语句，但记住 `NullPointerException` 不是 `Error` 的子类。`NullPointerException`\
  \ 是一个 `RuntimeException`，而不是 `Error`，所以这个 catch 块不会执行：\n\n```java\ncatch(Error error)\
  \ {\n    System.out.println(\"Akuma Secret Art\");\n} \n```\n\n\n\n\n那么 `finally`\
  \ 块呢？正如你所学到的，`finally` 块几乎总是执行，除非在到达它之前调用了 `System.exit` 方法。在这里情况下并非如此，因此即使 `try`\
  \ 块中抛出了 `NullPointerException`，`finally` 块也会正常执行：\n\n```\n1 finally {\n2       \
  \ System.out.println(\"Shinkuu Hadouken\");\n3 }\n```\n\n结论是，正确的替代方案是：\n\n2. 将抛出\
  \ `java.lang.NullPointerException`\n\n    Shinkuu Hadouken\n\n## 8.6 try with resources\n\
  \n`try-with-resources` 语句是在 Java 7 中引入的，用于减少关闭资源所需的样板代码。在 Java 7 之前，我们必须使用 `finally`\
  \ 块来实现这一目的。让我们来看一个真实世界中的常见示例：\n\n```java\n 1 import java.sql.Connection;\n 2 import\
  \ java.sql.DriverManager;\n 3 import java.sql.SQLException;\n 4 \n 5 public class\
  \ TryWithFinally {\n 6 \n 7     public static void main(String... tryWithFinally)\
  \ throws SQLException {\n 8         Connection connection = null;\n 9         try\
  \ {\n10             connection = DriverManager.getConnection(\"dbURL\");\n11   \
  \      } catch (SQLException e) {\n12             e.printStackTrace();\n13     \
  \    } finally {\n14             connection.close();\n15         }\n16     }\n17\
  \ \n18 }\n```\n\n请注意，这段代码相当冗长。除了需要 `finally` 块来关闭连接外，我们必须在 `try` 块之外声明 `connection`\
  \ 变量，以便在 `finally` 块中访问它。一个不那么长的选项是使用 `try-with-resources` 语句来解决这个问题。这里是同一个示例，使用了这一特性：\n\
  \n```java\n 1 import java.sql.Connection;\n 2 import java.sql.DriverManager;\n 3\
  \ import java.sql.SQLException;\n 4 \n 5 public class TryWithResources {\n 6 \n\
  \ 7     public static void main(String... tryWithResources) {\n 8         try (Connection\
  \ connection = DriverManager.getConnection(\"dbURL\")) {\n 9             // Do the\
  \ database logic\n10         } catch (SQLException e) {\n11             e.printStackTrace();\n\
  12         }\n13     }\n14 }\n```\n\n在这段代码中，我们确保数据库资源将以相同的方式关闭，但这个版本紧凑得多——我们可以在\
  \ `try` 语句中声明资源，它会在我们离开该块时自动关闭。这适用于任何实现了 `AutoCloseable` 接口的资源，正如你很快看到的样。\n\n###\
  \ 8.6.1 Java 9 中的更改\n\nJava 9 引入了 `try-with-resources` 语句的一个微小但重要的更改。现在，我们可以从 `try`\
  \ 块外部传入资源；我们不需要在 `try` 块内部声明并实例化变量。这里是一个示例：\n\n```java\n 1 public class TryWithResourcesJava9\
  \ {\n 2 \n 3     void executeAction(AutoCloseable closeable) {\n 4         try (closeable)\
  \ {\n 5             // Perform your logic\n 6         } catch (Exception e) {\n\
  \ 7             e.printStackTrace();\n 8         } \n 9     }\n10 \n11 }\n```\n\n\
  如你所见，扩展这个方法很容易，因为我们传递的是一个接口，我们可以简单地将实例化类的责任转移给调用此方法的代码。\n\n### 8.6.2 可以在 try-with-resources\
  \ 语句中使用的类\n\n可以在 `try-with-resources` 语句中使用的类或接口是那些扩展了 `Closeable` 或 `AutoCloseable`\
  \ 接口的类。例如，`Connection` 接口扩展了 `AutoCloseable`：\n\n`public interface Connection extends\
  \ Wrapper, AutoCloseable { ... }`\n\n`OutputStream` 类是另一个示例；它实现了 `Closeable`：\n\n\
  `public abstract class OutputStream implements Closeable, Flushable { ... }`\n\n\
  注意 `Closeable` 扩展了 `AutoCloseable`：\n\n```java\n1 public interface Closeable extends\
  \ AutoCloseable {\n2 \tpublic void close() throws IOException;\n3 }\n```\n\n此外请注意，这两个接口都有\
  \ `close` 方法，必须在要关闭资源的类中实现。\n\n你也可以创建自己的 `AutoCloseable` 类。让我们来看一个示例：\n\n```java\n\
  \ 1 public class TheClose {\n 2 \n 3     public static void main(String... customAutocloseable)\
  \ {\n 4         try (Moe moe = new Moe(); Apu apu = new Apu()) { }\n 5     }\n 6\
  \ \n 7     static class Moe implements AutoCloseable{\n 8 \n 9         public void\
  \ close() {\n10             System.out.println(\"Moe closes the Bar\");\n11    \
  \     }\n12     }\n 13 \n14     static class Apu implements Closeable {\n15    \
  \     public void close() {\n16             System.out.println(\"Apu closes the\
  \ shop\");\n17         }\n18     }\n19 }\n```\n\n在这里我们创建了一个 `AutoCloseable` 类 Moe\
  \ 和一个 `Closeable` 类 Apu。尽管这些类实现了不同的接口，但行为是相同的；我们可以在 `try-with-resources` 语句中使用它们两者。\n\
  \n关于 `try-with-resources` 语句的另一个重要要点是，最后声明的资源将先关闭。这符合“后进先出”原则。它从右到左工作。\n\n### 8.6.3\
  \ Moe AutoCloseable 挑战\n\n在这个挑战中，我们有两个接口类：实现 `AutoCloseable` 的 Moe 和实现 `Closeable`\
  \ 的 Barney。看一眼代码，看看你能猜出执行它时会发生什么。\n\n```java\n1 import java.io.Closeable;\n2 import\
  \ java.io.IOException;\n3 \n4 public class ClosingBar {\n5     static String whoClosedBar\
  \ = \"\";\n6 \n7     public static void main(String... marvel) {\n8         Moe\
  \ moe = new Moe();\n9         executeAction(moe, new Barney());\n10         System.out.println(whoClosedBar\
  \ + moe.moeBarCount);\n11     }\n12 \n13     private static void executeAction(Closeable\
  \ moe, AutoCloseable barney) {\n14         try (moe; barney) {\n15             new\
  \ Moe().close();     // Line 16\n16         } catch (Throwable ignore) {\n17   \
  \          whoClosedBar += \"?\";\n18         }\n19     }\n20 \n21     static class\
  \ Barney implements AutoCloseable {\n22         public void close() {\n23      \
  \       throw new StackOverflowError();\n24         }\n25     }\n26 \n27     static\
  \ class Moe implements Closeable {\n28         int moeBarCount = 0;\n29        \
  \ public void close() throws IOException {\n30             moeBarCount++;\n31  \
  \           if (moeBarCount == 2) {\n32                 whoClosedBar += \"moe\"\
  ;\n33                 throw new IOException();\n34             }\n35         }\n\
  36     }\n37 }\n```\n\n1.  moe?2\n\n2.  抛出 StackOverflowError 并停止程序\n\n3.  ?1\n\n\
  4.  16 行的 Runtime\n\n**解释**:\n\n让我们检查 executeAction 方法，这是动作发生的地方。注意我们将 `moe` 作为\
  \ `Closeable` 实例传递，并将 `barney` 作为 `AutoCloseable`。第一个执行的关闭方法将是第 16 行的——这是因为关闭方法在\
  \ try 块执行后执行。\n\n一个重要的观察是，`try-with-resources` 语句总是从右到左关闭资源，所以先关闭 barney，然后是 moe。这意味着\
  \ barney 的关闭方法会先执行，抛出 `StackOverflowError`，然后执行 moe 的关闭方法。注意在这个方法中有一个逻辑：\n\n```java\n\
  if (moeBarCount == 2) {\n    ...\n}\n```\n\n但同样注意，我们正在使用不同的实例来调用关闭方法。实例变量 `moeBarCount`\
  \ 的值永远不会达到 2，因为每次创建实例时它都会被重置。\n\n唯一会被拼接的值将是“”，而 `moeBarCount` 的值将是 1。结论是，这个挑战的最终答案是：\n\
  \n**C) ?1**\n\n\n\n在 Java 中，一个 `try` 块后面可以跟多个 `catch` 块。这一特性在我们想要更好地控制错误日志时非常有用，可以帮助开发人员更容易发现应用程序中发生了什么错误。它通常用于处理具有复杂且不可预测逻辑的关键功能时。\n\
  \n在下面的示例中，我们从数据库获取一个 `Connection`，然后执行一些复杂逻辑。在 `executeComplexLogic` 方法中可能会发生 `RuntimeException`，在这种情况下，`Exception`\
  \ catch 块将捕获它，我们需要记录此信息。同样，如果发生了 `Error`，`Throwable` catch 块将捕获它并记录发生了什么：\n\n```java\n\
  \ 1 import java.sql.Connection;\n 2 import java.sql.DriverManager;\n 3 import java.sql.SQLException;\n\
  \ 4 \n 5 public class DatabaseConnection {\n 6 \n 7     public static void main(String...\
  \ multiCatchExample) {\n 8         try {\n 9             Connection connection =\
  \ DriverManager.getConnection(\"DBURL\");\n10             executeComplexLogic();\n\
  11         } catch (SQLException e) {\n12             e.printStackTrace();\n13 \
  \        } catch (Exception e) {\n14             e.printStackTrace();\n15      \
  \   } catch (Throwable e) {\n16             e.printStackTrace();\n17         }\n\
  18     }\n19 \n20     private static void executeComplexLogic() { }\n21\n```\n\n\
  注意，当我们使用多个 `catch` 块时，我们捕获的类必须具有继承关系，并且我们必须从最具体的类开始，到最通用的类。例如，在前面的代码中，注意 `SQLException`\
  \ 继承 `Exception`，而 `Exception` 继承 `Throwable`。这段代码无法编译，因为 `Throwable` 并不继承 `Exception`：\n\
  \n```java\n1 catch (Throwable e) {\n2      e.printStackTrace();\n3 } catch (Exception\
  \ e) {\n4     e.printStackTrace();\n5 }\n```\n\n同时请记住，只要下一个捕获的类位于更高的继承层级，就没有必要直接扩展某个类。例如，即使\
  \ `SQLException` 没有直接继承 `Exception` 类，这段代码也是可以编译的：\n\n```java\n1 catch (SQLException\
  \ e) {\n2      e.printStackTrace();\n3 } catch (Exception e) {\n4     e.printStackTrace();\n\
  5 }\n```\n\nJava 7 引入了另一种捕获异常的方法。类似于 `try-with-resources` 语句，它的目标是减少样板代码。在需要捕获许多不同异常的情况下，与其创建多个\
  \ `catch` 块，不如创建一个 `catch` 块来捕获多种一种类型的异常。\n\n在下面的示例中，我们将在同一个 `catch` 块中捕获 `ArrayIndexOutOfBoundsException`、`NullPointerException`\
  \ 和 `StackOverflowError`。注意，这些异常类之间没有任何继承关系，这就是为什么这段代码可以编译的原因：\n\n```java\n 1 public\
  \ class MoeFrisk {\n 2\n 3     public static void main(String... multicatch) {\n\
  \ 4         try {\n 5             String array[] = null;\n 6             System.out.println(array[0].contains(\"\
  shotgun\"));\n 7         } catch (ArrayIndexOutOfBoundsException | NullPointerException\
  \ | StackOverflowError e) {\n 9             e.printStackTrace();\n10         }\n\
  11     }\n12 }\n```\n\n如果我们在多 `catch` 语句中使用父类（例如下面的示例所示），代码将无法编译：\n\n```java\n1\
  \ try {\n2     String array[] = null;\n3     System.out.println(array[0].contains(\"\
  shotgun\"));\n4 } catch (ArrayIndexOutOfBoundsException | Exception | StackOverflowError\
  \ e) {\n5     e.printStackTrace();\n6 }\n```\n\n在这种情况下，我们将得到下所示编译错误：\n\n```\n1 Error:(16,51)\
  \ java: Alternatives in a multi-catch statement cannot be related by subclassing\n\
  3 java.lang.ArrayIndexOutOfBoundsException is a subclass of java.lang.Exception\n\
  ```\n\n子类和父类不能同时出现在多 `catch` 语句中。\n\n### 8.7.1 大爆炸理论异常挑战\n\n这个挑战探索了在多 `catch` 语句和单独的\
  \ `catch` 块中捕获多种异常类型的概念。它将测试你对这一实用的 Java 特性以及异常继承的理解。请仔细分析代码，看看你是否能猜出输出。\n\n```java\n\
  \ 1 public class BigBangTryCatchFinally {\n 2     static String s = \"\";\n 3  \
  \   public static void main(String... doYouBest) {\n 4         try {\n 5       \
  \      throw new IllegalArgumentException();\n 6         } catch (RuntimeException\
  \ e) {\n 7             try {\n 8                 throw new StackOverflowError();\n\
  \ 9             } catch (IllegalArgumentException | NullPointerException | IndexOutOfBoundsException\
  \ x) {\n11                 s += \"Sheldon \";\n12             } catch (Error error)\
  \ {\n13                 s += \"Penny \";\n14             } finally {\n15       \
  \          s += \"Leo \";\n16             }\n17         } finally {\n 18       \
  \      s += \"Howard \";\n 19             try {\n20                 throw new VirtualMachineError(\"\
  Wrong experience formula\") { };\n21             } catch (Exception | StackOverflowError\
  \ error) {\n22                 s += \"Raj \";\n23             } catch (Throwable\
  \ error) {\n24                 s += \"Melissa \";\n25             }\n26        \
  \ }\n27         System.out.println(s);\n28     }\n29 }\n```\n\n1. Sheldon Leo Raj\n\
  2. Sheldon Melissa\n3. Penny Leo Howard Melissa\n4. Sheldon Penny Howard Melissa\n\
  \n**解析**：\n\n让我们检查这个挑战的关键点。第一个抛出的异常是 `IllegalArgumentException`：\n\n`throw new IllegalArgumentException();`\n\
  \n`IllegalArgumentException` 继承 `RuntimeException`，因此 `RuntimeException` catch 块将捕获它：\n\
  \n```java\n1 catch (RuntimeException e) {\n2     throw new StackOverflowError();\n\
  3 }\n```\n\n然后抛出了 `StackOverflowError`：\n\n`throw new StackOverflowError();`\n\n\
  多捕获异常块无法捕获它：\n\n`catch (IllegalArgumentException | NullPointerException | IndexOutOfBoundsException\
  \ x) { ... }`\n\n但 `Error` catch 块会捕获 `StackOverflowError`，因为该类继承 `Error`：\n\n```java\n\
  1 catch (Error error) {\n2      s += \"Penny \";\n3 }\n```\n\n因此，第一个拼接的字符串是 `\"\
  Penny \"`。然后内部的 `finally` 块将执行（记住即使发生异常也会执行），它会拼接“Leo ”\n\n外部的 `finally` 块也会执行，它会拼接\
  \ \"Howard \"\n\n然后抛出了 `VirtualMachineError`：\n\n`throw new VirtualMachineError(\"\
  Wrong experience formula\") { };`\n\n第一个 catch 块无法捕获此异常，因为没有继承关系：\n\n`catch (Exception\
  \ | StackOverflowError error) { ... }`\n\n但第二个 catch 块会捕获，因为 `Throwable` 捕获所有异常：\n\
  \n```java\n1 catch (Throwable error) {\n2      s += \"Melissa \";\n3 }\n```\n\n\
  因此，`\"Melissa \"` 是最后一个拼接的字符串。\n\n结论，最终答案是：\n\n3. Penny Leo Howard Melissa\n\n##\
  \ 8.8 创建自定义异常\n\n创建有意义的自定义异常是帮助开发人员准确识别代码中发生了什么错误的有效有效方法。然而，这里需要一些判断。你不应该为每种情况都创建一个自定义异常；相反，你应该分析业务需求是否足够重要值得这样做。\n\
  \n\n\n如果我们有一个处理公司账单信息的模块，例如，我们可以创建一个名为 `BillingException` 的异常，用于表示在该模块中可能抛出的所有异常：\n\
  \n```\n1 public class BillingException extends Exception {\n2 \n3     public BillingException(String\
  \ message, Throwable cause) {\n4         super(message, cause);\n5     }\n6 \n7\
  \ }\n```\n\n我们还可以通过扩展 `RuntimeException` 来创建一个自定义的未检查异常：\n\n```\n1 public class\
  \ CalculationException extends RuntimeException {\n2 \n3     public CalculationException(String\
  \ message, Throwable cause) {\n4         super(message, cause);\n5     }\n6 \n7\
  \ }\n```\n\n注意，我们在 `BillingException` 和 `CalculationException` 类中创建了构造函数。这很重要，因为这使我们能够传递与异常相关的清晰消息和原因，从而更容易追踪和理解所发生的错误。例如：\n\
  \n`BillingException`\n\n```\n1 try {\n2     // do some logic\n3 } catch (SomeException\
  \ someException) {\n4     throw new BillingException(\"The customer can't be billed.\"\
  ,       someException);\n5 }\n```\n\n`CalculationException`:\n\n```\n1 try {\n2\
  \     // do some logic\n3 } catch (SomeException someException) {\n4     throw new\
  \ CalculationException(\"The sum operation has failed\",       someExcept\\\n5 on);\n\
  6 }\n```\n\n如果我们需要，我们也可以将消息封装到异常中。此外，如果我们想传递不同的消息，甚至可以重载 `CalculationException`\
  \ 构造函数。例如：\n\n```\n 1 public class CalculationException extends RuntimeException\
  \ {\n 2     static final String message = \"Calculation error\";\n 3     public\
  \ CalculationException(Throwable cause) {\n 4         super(this.message, cause);\n\
  \ 5     }\n 6 \n 7     public CalculationException(String message, Throwable cause)\
  \ {\n 8         super(message, cause);\n 9     }\n10 }\n```\n\n在处理异常时，我们的目标应该是创建清晰且有意义日志消息，使其对开发者有用。\n\
  \n正如之前提到的，我们可以对业务异常进行结构化。创建一个通用异常类是一个很好的主意，所有你需要的其他自定义异常类都可以扩展它。这样你只需要在 `throws`\
  \ 子句中声明通用类型，而无需列出方法抛出的所有特定异常。\n\n为了展示这是如何运作的，假设我们还有两个业务异常：\n\n```\n1 class NoDiscountException\
  \ extends Exception { ... }\n2 class NoAccountBalanceException extends Exception\
  \ { ... }\n```\n\n以及一个包含某些业务逻辑的方法：\n\n```\n1 void calculateCustomerBilling() throws\
  \ BillingException, NoDiscountException,  NoAcc\\\n2 ountBalanceException {\n3 \
  \    // 在逻辑中，此方法将抛出所有三个异常\n4 }\n```\n\n现在想象这种场景在系统中的各个类中被复制。处理所有这些不同的异常将非常痛苦，代码将变得难以阅读和维护。创建一个聚合了所有这些业务要求的通用异常类型会好得多——但如何实现呢？\n\
  \n幸运的是，这个问题有一个解决方案：我们只需要创建一个 `BusinessException` 类，并让所有其他业务异常扩展它，如下：\n\n```\n1 class\
  \ BusinessException extends Exception { ... }\n2 class NoDiscountException extends\
  \ BusinessException { ... }\n3 class NoAccountBalanceException extends BusinessException\
  \ { ... }\n4 class BillingException extends BusinessException { ... }\n```\n\n然后，我们可以从上一个示例的\
  \ `throws` 子句中移除所有特定异常，并且只抛出 `BusinessException`。这种方法简洁得多且组织更好：\n\n`void calculateCustomerBilling()\
  \ throws BusinessException { ... }`\n\n然后你可以编写代码来捕获可能抛出的各种异常，确保你对系统中发生的任何异常都有有详细且清晰的日志。\n\
  \n### 8.8.1 No Beer Exception 挑战\n\n这个挑战探索了本章介绍的几个概念，包括 `try-with-resource`、使用多个\
  \ catch 块以及创建自定义异常。你可以通过分析代码并尝试猜测输出来测试你对这些有用 Java 特性的理解。\n\n```\n 1 public class\
  \ NoBeerExceptionChallenge {\n 2     static String finalResult = \"\";\n 3 \n 4\
  \     public static void main(String... doYourBest) {\n 5         try (NoBeerException\
  \ exception = new NoBeerException()) {\n 6             finalResult += \"GetBeer\"\
  ;\n 7             throw new NoAlcoholError();\n 8         } catch (Exception exception)\
  \ {\n 9             finalResult += \"NoWhiskey\";\n10         } catch (Error error)\
  \ {\n11             finalResult += \"NoWine\";\n12         } finally {\n13     \
  \        try {\n14                 int i = 1 / 0;\n15                 } catch (NoBarException\
  \ noBar) { finalResult += \"NoBar\";\n16             } catch (RuntimeException exception)\
  \ {\n17                 finalResult += \"NoAlcohol\";\n18             }\n19    \
  \     }\n20 \n21         System.out.println(finalResult);\n22     }\n 23     static\
  \ class NoBeerException extends Exception implements AutoCloseable {\n 24      \
  \   public void close() {\n 25             finalResult += \"BarClosing\";\n 26 \
  \            throw new NoBarException(); \n 27         }\n 28     }\n 29     static\
  \ class NoBarException extends RuntimeException {}\n 30     static class NoAlcoholError\
  \ extends Error {}\n31 }\n```\n\n1. `GetBeerBarClosingNoWineAlcohol`\n2. `BarClosingNoBar`\n\
  3. `NoWineNoAlcohol`\n4. `GetBeerWhiskeyNoAlcohol`\n\n**解释**：\n\n第一部分展示了 `try-with-resource`\
  \ 的使用。我们有三个异常类：`NoBeerException` 扩展 `Exception` 并实现 `AutoCloseable`，`NoBarException`\
  \ 扩展 `RuntimeException` 以及 `NoAlcoholError` 扩展 `Error`。\n\n记住在使用 `try-with-resource`\
  \ 时，try 块会首先执行。第一个拼接的字符串是：\n\n`GetBeer`\n\n然后 `NoBeerException` 的 `close()` 方法被调用，拼接了第二个字符串：\n\
  \n`BarClosing`\n\n注意在 `close()` 方法中抛出了 `NoBarException`，但同时也抛出了 `NoAlcoholError`。这里发生了什么？当抛出一个异常，且随后\
  \ `AutoCloseable` 的 `close()` 方法抛出另一个异常时，第一个异常会被抑制。在我们的情况下，`NoBarException` 被 `NoAlcoholError`\
  \ 抑制。\n\n如果我们打印 `getSuppressed()` 方法引用的第一个位置，我们将得到以下结果：\n\n```\n1 catch (Error error)\
  \ {\n2       System.out.println(error.getSuppressed()[0]);\n3  }\n```\n\n`...NoBeerExceptionChallenge$NoBarException`\n\
  \n因此执行的 catch 块是：\n\n```\n1  catch (Error error) {\n2       finalResult += \"NoWine\"\
  ;\n3     }\n```\n\n第三个拼接的字符串是：\n\n`NoWine`\n\n`finally` 块总是会被执行，所以接下来执行 `1 / 0`\
  \ 计算。但当我们在 Java 中尝试除以零时，我们会得到以下异常：\n\n`java.lang.ArithmeticException: / by zero`\n\
  \n我们可以得出这是一个 `RuntimeException`，因为这个错误可以通过 if 语句避免。\n\n`NoBarException` 扩展了 `RuntimeException`\
  \ 但与 `ArithmeticException` 无关。因此，`RuntimeException` catch 块将捕获这个错误，最后一个拼接的字符串是：\n\
  \n`NoAlcohol`\n\n结论，最终答案是：\n\n`A - GetBeerBarClosingNoWineNoAlcohol`\n\n\n\n\n当我们在处理业务层时，针对异常最合适的操作是**尽早抛出并尽可能晚地捕获**，只有在最后才记录错误信息。遵循这种方法比在调用栈的每一层中都记录错误信息要清晰得多。\n\
  \n以下代码在 `Repository` 和 `Service` 系统层中打印日志消息。这使得追踪任何发生错误的来源变得更加困难，应该应该避免：\n\n```\n\
  \ 1 public class SimpsonRepository {\n 2 \n 3     List<Simpson> findAll() throws\
  \ SQLException {\n 4         try {\n 5             // Perform action to find all\
  \ Simpsons\n 6         } catch (SQLException sqlException) {\n 7             sqlException.printStackTrace();\n\
  \ 8             throw sqlException;\n 9         }\n 10     }\n 11 \n 12 }\n 13 \n\
  \ 14 import java.sql.SQLException;\n 15 import java.util.List;\n 16 \n 17 public\
  \ class SimpsonService {\n 18 \n 19     SimpsonRepository simpsonRepository = new\
  \ SimpsonRepository();\n 20 \n 21     public List<Simpson> findAllSimpsons() {\n\
  \ 22         try {\n 23             return simpsonRepository.findAll();\n 24   \
  \      } catch (SQLException sqlException) {\n 25             sqlException.printStackTrace();\n\
  \ 26         }\n 27     }\n 28 \n 29 }\n```\n\n相反，遵循“尽早抛出，晚捕获”的原则要好得多。这将发生的错误报告集中化，更容易发现问题出在哪里以及为什么。让我们看看应用这一原则后，相同的逻辑看起来是什么样的：\n\
  \n```\n 1 import java.sql.SQLException;\n 2 import java.util.List;\n 3 \n 4 public\
  \ class SimpsonRepository {\n 5 \n 6     List<Simpson> findAll() throws SQLException\
  \ {\n 7         // Perform action to find all Simpsons\n 8     }\n 9 \n 10 }\n 11\
  \ \n 12 public class SimpsonService {\n 13 \n 14     SimpsonRepository simpsonRepository\
  \ = new SimpsonRepository();\n 15 \n 16     public List<Simpson> findAllSimpsons()\
  \ {\n 17         try {\n 18             return simpsonRepository.findAll();\n 19\
  \         } catch (SQLException sqlException) {\n 20             sqlException.printStackTrace();\n\
  \ 21         }\n 22     }\n 23 \n 24 }\n```\n\n这段代码更简洁且更易于理解。我们应该尝试尽可能将异常处理代码集中化，以方便调试。\n\
  \n## 8.10 真实世界异常创建挑战\n\n想象你是一家金融公司的开发人员，被赋予一项任务：设计一个异常结构，让开发人员能够更容易更清晰地追踪错误。\n\n\
  你的目标是创建一个通用的检查型业务异常（checked business exception）以及一些扩展该类的更具体的自定义异常。你的自定义异常在打印堆栈跟踪时，应该显示清晰的错误消息，以指示问题的来源。\n\
  \n你还需要将错误代码 `\"NO_ACCOUNT_BALANCE\"` 传递给前端应用程序，以便它可以向用户显示清晰的消息。\n\n通用的 `BusinessException`\
  \ 类将拥有一个带有错误消息、`Throwable cause` 和错误代码的构造函数（如果你愿意，可以使用枚举）。你还将创建两个专门的异常类：`NoAccountBalanceException`\
  \ 和 `CentralBankServiceDownException`，它们都继承自 `BusinessException`。\n\n最后，你需要创建一个名为\
  \ `AccountService` 的简单服务类，实现一个名为 `withdrawAccountMoney` 的方法，接收 `customerId` 和 `moneyAmount`。你不需要在\
  \ `withdrawAccountMoney` 方法中实现逻辑；你只需要抛出你创建的异常，将其捕获为 `BusinessExceptions`，然后打印堆栈跟踪。对于这个挑战者来说足够了。交给你！\n\
  \n## 8.11 总结\n\n- 异常是 Java 中必须掌握的关键概念。在本章中，你学习了如何针对多种情况使用最合适的异常类型，以及如何在 `try`、`catch`\
  \ 和 `finally` 块中构建你的异常处理代码。\n- 你学习了检查异常（checked）和非检查异常（unchecked）的区别，以及 Java 中所有异常类型都继承自\
  \ `Throwable`。\n- 你知道如何处理和声明异常，以及如何将特定异常封装在通用异常中。\n- 你学习了可以使用 `try-with-resources`\
  \ 语句来关闭 Java 资源，而不是使用 `finally` 块。\n- 你理解了 Java 提供的捕获多种类型异常的选项，以及继承对异常处理的影响。\n-\
  \ 你学习了如何通过“尽早抛出，晚捕获”的原则来更好地使用异常。\n\n# 9 Lambda 与函数式接口\n\n**本章涵盖了**：\n\n- 理解为什么 Lambda\
  \ 很重要\n- 使用单行函数 Lambda\n- 使用简洁的方法引用异常\n- 理解何时使用 Lambda 或方法引用\n- 函数式编程原理\n- 函数式接口\n\
  - Java 挑战\n\n## 9.1 什么是 Lambda?\n\n`Lambda`、函数式接口和方法引用是函数式编程，帮助我们避免样板代码。在没有 Lambda\
  \ 的情况下，我们必须使用匿名内部类。例如：\n\n在处理 `Stream`、`Collections`、`Optional`、`Files` 等 API 时，通常会使用\
  \ Lambda 来方便地传递单行函数。开始使用 Lambda 和方法引用可能会有点困难，但随着使用，你会变得熟悉。\n\n简单来说，函数式编程在本质上是一种不产生数据突变或副作用的编程风格。这意味着当我们多次调用函数时，预期的行为是相同的。\n\
  \n如上所述，匿名类非常冗长。让我们看看在 Lambda 之前是如何使用 `Runnable` 接口的：\n\n```\nRunnable runnable =\
  \ new Runnable() {\n      @Override\n      public void run() {\n        System.out.println(\"\
  Running!!!\");\n      }\n};\n\nrunnable.run();\n```\n\n输出将是：\n\n**Running!!!**\n\
  \n我们可以仅一行将上面的匿名类代码转换为 Lambda！这就是 Lambda 的威力，它让代码更清晰、更于维护：\n\n```\nRunnable runnable\
  \ = () -> System.out.println(\"Running!!!\");\nrunnable.run();\n```\n\n输出相同：\n\n\
  **Running!!!**\n\n现在你知道了 Lambda 为什么强大，我们可以深入研究并了解如何有效地使用它们。\n\n### 9.1.1 Lambda\
  \ 不应改变外部状态\n\nLambda 本质上不改变外部变量，但在某些情况下这是可能的。我们可以像下面的示例那样更改实例变量或静态变量：\n\n```\npublic\
  \ class LambdaMutation {\n    private int instanceNumber;\n    private static int\
  \ staticNumber;\n\n    public static void main(String[] args) {\n        LambdaMutation\
  \ lambdaMutation = new LambdaMutation();\n        Runnable runnable = () -> System.out.println(\n\
  \            ++lambdaMutation.instanceNumber + \":\" + ++staticNumber);\n      \
  \  runnable.run();\n    }\n}\n```\n\n当运行上述代码时，输出将是：\n\n**1:1**\n\n\n\n\n如你在上面的代码所示，我们可以在\
  \ lambda 中更改实例变量或静态变量。由于 Java 不是一种纯函数式编程语言，因此这是可以的。\n\n### 9.1.2 有效最终变量 (Effective\
  \ Final Variables)\n\n我们可以在 Lambda 中更改实例和静态变量，但我们不能更改局部变量。Lambda 只能使用有效最终（effectively\
  \ final）的局部变量。\n\n有效最终变量是指初始化了一个值，且即使该变量没有声明为 `final`，该值也不会被改变的变量。让我们来看一个有效最终变量示例：\n\
  \n```\n1 int effectiveFinalVariable = 5;\n2 System.out.println(effectiveFinalVariable);\n\
  ```\n\n我们从未修改过上面的代码，因此 `effectiveFinalVariable` 是一个有效最终变量。\n\n让我们看看非有效最终变量现在是什么样的：\n\
  \n```\n1 int nonEffectiveFinalVariable = 5;\n2 System.out.println(++nonEffectiveFinalVariable);\
  \ \n```\n\n如你所见，我们更改了 `nonEffectiveFinalVariable`，因此不是有效变量。\n\n当然，如果我们将一个局部 final\
  \ 变量传递给 lambda 表达式，那是完全没，因为我们无法更改它。理想情况下，作为良好的实践，我们应该倾向在 lambda 中仅使用显式的 final 变量。\n\
  \n现在你已经很好地理解局部变量是如何与 lambda 工作的，尝试下一个 Java 挑战吧！\n\n### 9.1.3 神奇门 Lambda 挑战\n\n通过运行以下代码，你能猜到发生什么吗？\n\
  \n```\n 1 import java.util.Arrays;\n 2 import java.util.List;\n 3 \n4 public class\
  \ MysteriousDoorLambdaChallenge {\n 5 \n   public static void main(String... theDoors)\
  \ {\n 7     int doorNumber = 0;\n 8     doorNumber++;\n 9     List<String> doors\
  \ = Arrays.asList(\"A\", \"B\", \"C\");\n10     doors.forEach(e -> {\n11       System.out.println(e\
  \ + doorNumber);   // Line 11\n12     });\n13   }\n14 \n15 }\n```\n\n1. A0, B1,\
  \ C2\n2. A1, B2, C3\n3. 第 11 行编译错误\n4. 不可预测\n\n**解释**：\nLambda 只能访问 final 或有效最终的变量。如上所述，它的本质应该只访问外部的不可变数据。注意\
  \ `doorNumber` 变量在我们增加它时被更改了。因此，从那一刻起 `doorNumber` 变量不再是 final。简单来说，有效最终变量是在给定一个值后，该值永远不会改变的变量。结论，在这个挑战中，第\
  \ 11 行将出现编译错误，最终答案是：`C)`。\n\n## 9.2 函数式接口 (Functional Interfaces)\n\nJava 中有一些预定义的函数式接口，可以涵盖\
  \ 95% 的情况。简单来说，函数式接口只有一个抽象方法的接口。\n\n让我们从最简单的函数式接口 `Supplier` 开始。顾其名，`Supplier` 接口负责返回一个值。它提供一个值。\n\
  \n`Supplier<String> supplier = () -> \"Moe\";`\n\n我们唯一可以调用的方法是 `get`。因此，为了获取“Moe”值，我们可以这样做：\n\
  \n`System.out.println(supplier.get());`\n\n输出将是：`Moe`。\n\n为了让你清楚什么是函数式接口，你可以查看 JDK\
  \ 是如何定义它的：\n\n```\n1 @FunctionalInterface\n2 public interface Supplier<T> {\n3 \
  \    T get();\n4 }\n```\n\n如果我们想使用针对 `int` 类型的 `Supplier`，可以使用 `IntSupplier`。注意，我们在这里不需要使用泛型类型：\n\
  \n```\n1 IntSupplier supplier = () -> 7;\n2 System.out.println(supplier.getAs());\n\
  ```\n\n输出将是：`7`。\n\n然后我们有 `Consumer` 函数式接口。简单来说，`Consumer` 接口的目的是消费任何值。\n\n```\n\
  1 Consumer<Integer> consumer = (number) -> System.out.println(number);\n2 consumer.accept(7);\n\
  ```\n\n输出将是：`7`。\n\n### 9.2.1 Supplier Consumer 挑战\n\n在下面的挑战中，我们使用了 `Supplier` 和\
  \ `Consumer`，同时我们增加了一些数字。你能猜到运行以下代码会发生什么吗？\n\n```\n1 import java.util.function.Consumer;\n\
  2 import java.util.function.Supplier;\n3 \n4 public class SupplierConsumer {\n5\
  \ \n6     static int value;\n7     public static void main(String... args) {\n8\
  \         IntSupplier valueS = () -> value++;                          // Line 8\n\
  9         Consumer<Object> oneMoreValue = (Object) -> value++;    // Line 9\n10\
  \        oneMoreValue.accept(2);\n11        System.out.println(value + \" \" + valueS.getAs());\n\
  12    }\n13 }\n```\n\n解释：\n1. 第 8 行和第 9 行无法编译\n2. 第 8 行和第 5 行\n\n**解释**：\n虽然 lambda\
  \ 不应该改变任何外部状态，但我们仍然可以更改 `static` 变量。Lambda 也是惰惰的，这意味着除非我们调用 lambda 方法 `accept` 或\
  \ `getAs`，否则值不会增加。那么，`value` 变量增加的唯一时刻是当我们调用下面的方法时。注意，尽管我们向 `accept` 方法传递了 `2`，但我们没有对这个数字做任何操作。因此，在调用下面的方法后，`value`\
  \ 变量将是 `1`。最后，当我们打印 `value` 变量时，它将打印 `1`。然后当我们调用 `valueS.getAs()` 方法时，它也将打印 `1`，因为\
  \ `value` 变量是通过后自增运算符增加的。`value` 变量只在我们调用 `valueS.getAs()` 之后才会增加。调用 `valueS.getAs()`\
  \ 之后，`value` 变量将变为 `2`：\n\n`System.out.println(value + \" \" + valueS.getAs());`\n\
  \n因此，最终输出和正确选项是：`1`。\n\n### 9.2.2 Predicate 函数式接口\n\n如果我们想使用一个返回 `boolean` 并接收一个参数的函数，`Predicate`\
  \ 接口就是了！让我们来看 `Predicate` 如何使用的示例：\n\n`Predicate<String> isYodaedi = (jedi) -> jedi.equals(\"\
  Yoda\");`\n\n由于我们已经准备好了可以调用的函数，现在我们可以打印当检查 `String` 是否等于“Yoda”时发生了什么：\n\n`System.out.println(isYodaedi.test(\"\
  Yoda\"));`\n\n输出：`true`\n\n#### 在 Predicate 中使用 and\n\n现在让我们来看 `and` 方法。该方法连接两个条件，并且它们都必须为\
  \ `true` 才能满足。\n\n```\n1 Predicate<String> isYodaedi = (jedi) -> jedi.equals(\"\
  Yoda\");   // #A\n2 Predicate<String> isObiWanedi = (jedi) -> jedi.equals(\"ObiWan\"\
  );\n3 \n4 Predicate<String> isJedi = isYodaedi.and(isObiWanedi);        // #B\n\
  5 \n6 System.out.println(isJedi.test(\"Yoda\"));                        // #C\n\
  ```\n\n输出：`false`\n\n**解释**：\n*   #A 我们准备了 `Predicate` 条件。\n*   #B 我们使用 `and` 连接两个\
  \ `Predicate` 条件。\n*   #C 我们使用 `isJedi` `Predicate` 检查来自 `Yoda` 和 `ObiWan`。由于我们只向\
  \ `test` 方法传递了 `Yoda`，两个条件都无法满足。因此，输出将为 `false`。\n\n### 在 Predicate 中使用 or\n\n还有一个\
  \ `or` 方法，它的操作方式就像条件中的 `||` 运算符：\n\n```\n1 Predicate<String> isYodaedi = (jedi)\
  \ -> jedi.equals(\"Yoda\"); \n2 Predicate<String> isObiWanedi = (jedi) -> jedi.equals(\"\
  ObiWan\");\n3 \n4 Predicate<String> isJedi = isYodaedi.or(isObiWanedi);        \
  \ // #A\n5 \n6 System.out.println(isJedi.test(\"Yoda\"));                      \
  \  // #B\n```\n\n输出：`true`\n\n**解释**：\n*   #A 注意这里我们正在使用 `or` 运算符。\n*   #B 然后当我们向发送\
  \ `Yoda` 进行测试时，由于其中一个条件为真，最终结果也将是真。\n\n\n\n\n`Function` 接口的目的是接收一个我们定义的泛型类型的参数，然后根据我们定义的泛型类型返回一个值。\n\
  \n```\n1 Function<String, Integer> transformIntoNumber = (number) -> Integer.parseInt(number);\n\
  2 System.out.println(transformIntoNumber.apply(\"7\"));\n```\n\n输出将是：\n\n`7`\n\n\
  我们还可以组合函数。假设我们想先将一个数字乘以 2，然后加 2。在 Java 中有两种方法可以实现这一点。我们可以使用 `compose` 函数或 `andThen`\
  \ 函数。让我们看下面的示例：\n\n```\n1 Function<Integer, Integer> times2 = (number) -> number\
  \ * 2;\n2 Function<Integer, Integer> add2 = (number) -> number + 2;\n3 \n4 System.out.println(times2.compose(add2).apply(2));\n\
  5 System.out.println(times2.andThen(add2).apply(2));\n```\n\n输出将是：\n\n8\n\n6\n\n\
  注意 `compose` 和 `andThen` 函数之间的区别在于它们执行的顺序。在 `compose` 中，将先执行 `add2` 函数，我们先得到结果 4。然后执行\
  \ `times2` 函数，因此我们得到了结果 8。\n\n然后当我们调用 `andThen` 方法时，情况恰相反。`times2` 函数将先执行，让我们先得到结果\
  \ 4。然后将调用 `add2` 函数，加 2 并让我们得到最终结果 6。\n\n### 9.2.3 BiFunction 接口\n\n`BiFunction`\
  \ 与 `Function` 接口非常相似。正如名称所示，`BiFunction` 接收两个参数，而不是 `Function` 的一个参数。让我们看看在实践中它是如何工作的：\n\
  \n```\n1 BiFunction<Integer, Double, Double> addNumbers = (n1,n2) -> { return n1\
  \ + n2; };\n2 System.out.println(addNumbers.apply(2, 2.5));\n```\n\n输出将是：\n\n4.5\n\
  \n正如下面的示例所示，也可以将 `BiFunction` 与 `Function` 组合：\n\n```\n1 BiFunction<Integer, Double,\
  \ Double> addNumbers = (n1,n2) -> n1 + n2;\n2 Function<Double, Number> times2 =\
  \ (number) -> number * 2.0;\n3 System.out.println(addNumbers.andThen(times2).apply(2,\
  \ 2.5));\n```\n\n输出将是：\n\n9.0\n\n在上面的代码示例中，函数执行的顺序如下：`addNumbers BiFunction` 先运行，然后\
  \ `times2` 函数 获取来自 `addNumbers BiFunction` 的结果并将其乘以 2.0。\n\n考虑到上面的解释，你认为在以下代码会发生什么？\n\
  \n```\n1 BiFunction<Integer, Double, Double> addNumbers = (n1,n2) -> n1 + n2;\n\
  2 Function<Integer, Number> times2 = (number) -> number * 2.0;\n3 System.out.println(addNumbers.andThen(times2).apply(2,\
  \ 2.5));\n```\n\n当我们尝试将一个返回 `Double` 结果的 `BiFunction` 与一个接收 `Integer` 参数的 `Function`\
  \ 组合时，代码将无法编译。这是因为 `Double` 类型无法转换为 `Integer`。因此，`times2` 函数无法与 `addNumbers BiFunction`\
  \ 组合。\n\n如果 `times2` 函数接收的是 `Double` 参数，如下所示，情况就会不同：\n\n`Function<Double, Number>\
  \ times2 = (number) -> number * 2.0;`\n\n### 9.2.4 BiConsumer 函数式接口\n\n`BiConsumer`\
  \ 接口能够消费两个参数并返回 `void`。让我们看看代码示例：\n\n```\n1 BiConsumer<Integer, Integer> biConsumer\
  \ = (a, b)  -> System.out.println(a + b);\n2 biConsumer.accept(2, 2);\n```\n\n输出将是：\n\
  \n4\n\n与其他函数式接口类似，我们也可以与 `BiConsumer` 组合函数。\n\n```\n1 BiConsumer<Integer, Integer>\
  \ add = (a, b)  -> System.out.println(a + b);\n2 BiConsumer<Integer, Integer> subtract\
  \ = (a, b)  -> System.out.println(a - b);\n3 \n4 add.andThen(subtract).accept(2,\
  \ 2);\n```\n\n输出将是：\n\n0\n\n### 9.2.5 BiFunction Consumer 挑战\n\n现在你已经学习了更多关于 `Function`、`BiFunction`\
  \ 和 `BiConsumer` 接口的内容，是时候尝试 Java 挑战了！下面的 Java 挑战涉及使用上述接口执行加法、减法和乘法！\n\n你能猜出以下 Java\
  \ 挑战的输出是什么吗？\n\n```java\nimport java.util.function.BiConsumer;\nimport java.util.function.BiFunction;\n\
  import java.util.function.Function;\n\npublic class BiFunctionConsumerChallenge\
  \ {\n    public static void main(String[] args) {\n        BiFunction<Integer, Double,\
  \ Double> addNumbers = (n1,n2) -> n1 + n2;\n        Function<Integer, Number> times2\
  \ = (number) -> number * 2.0;\n        // 下面的行根据上面的解释将无法编译\n        // System.out.println(addNumbers.andThen(times2).apply(2,\
  \ 2.5));\n\n        BiConsumer<Integer, Integer> add = (a, b) -> System.out.println(a\
  \ + b);\n        BiConsumer<Integer, Integer> subtract = (a, b) -> System.out.println(a\
  \ - b);\n        add.andThen(subtract).accept(2, 2);\n    }\n}\n```\n（注：原文提供的挑战代码由于行号导致较为破碎，我在保持文中逻辑的基础上对其进行了结构调整。）\n\
  \n### 9.2.6 UnaryOperator 函数式接口\n\n`UnaryOperator` 接口与 `Function` 接口非常相似。主要区别是 `UnaryOperator`\
  \ 必须接收一个类型并返回相同的类型。让我们看看代码示例：\n\n`UnaryOperator<Integer> unaryOperator = (n) ->\
  \ n + 2;`\n\n正如上面的代码所示，我们只能设置一个泛型类型，在这种情况下是 `Integer`。因此，我们只能接收一个 `Integer` 参数并返回一个\
  \ `Integer` 值。\n\n现在当我们调用上面的函数时：\n\n`System.out.println(unaryOperator.apply(2));`\n\
  \n输出将是：\n\n4\n\n### 9.2.7 BinaryOperator 函数式接口\n\n`BinaryOperator` 接口类似于 `BiFunction`。主要区别是\
  \ `BinaryOperator` 的参数和返回值都是相同的类型。在 `BiFunction` 中，如果我们愿意，可以传递参数和返回不同的类型。\n\n注意，由于\
  \ `BinaryOperator` 只处理一种类型，因此只需要向接口传递一个泛型类型：\n\n```\nBinaryOperator<Integer> addNumbers\
  \ = (x,y) -> { return x + y;}; \nSystem.out.println(addNumbers.apply(2, 2));\n```\n\
  \n输出将是：\n\n4\n\n### 9.2.8 自定义函数式接口\n\n也可以创建自定义函数式接口。首先，我们使用 `@FunctionalInterface`\
  \ 注解创建函数式接口，以确保该接口只有一个公共抽象方法：\n\n```java\n@FunctionalInterface\ninterface Duke {\n\
  \    void dance(String song);\n}\n```\n\n然后我们调用 Duke 的 `dance` 方法：\n\n```java\n\
  Duke duke = d -> System.out.println(\"Duke is dancing: \" + d);\nduke.dance(\"tango\"\
  );\n```\n\n\n\n请注意，在函数式接口中也可以添加私有、默认或静态方法。这是因为编译器会假设我们只需要重写唯一的公共抽象方法。其他方法是为了支持该接口。请看以下代码：\n\
  \n```\n 1 @FunctionalInterface\n 2   interface Duke {\n 3     void dance(String\
  \ song);\n 4 \n 5     private void jump() {\n 6       System.out.println(\"Duke\
  \ is jumping!\");\n 7     }\n 8 \n 9     default void fly() {\n10       System.out.println(\"\
  Duke is flying!\");\n11     }\n12 \n13     static void playGame() {\n14       System.out.println(\"\
  Duke is playing Metal Gear!\");\n15     }\n16 \n17 }\n```\n\n记住在函数式接口中，我们的限制是不能超过**一个**公共抽象方法。因此，以下代码无法编译：\n\
  \n```\n1 @FunctionalInterface\n2   interface Duke {\n3     void dance(String song);\n\
  4     void fly();\n5 }\n```\n\n同样注意，导致上述代码无法编译的是 `@FunctionalInterface`。使用 `@FunctionalInterface`\
  \ 注解是一个良好的习惯，我们可以非常清晰地表明该接口是函数式的。\n\n其他重要点是 `public default` 和 `public static` 只在\
  \ Java 8 中可用。此外，`private` 和 `private static` 是在 Java 9 中首次引入的。\n\n## 9.2.9 JDK 函数式接口\n\
  \n在 Java 8 之前我们就有一些函数式接口了。`Runnable` 和 `Comparator` 接口就是很好的例子：\n\n```\n1 @FunctionalInterface\n\
  2 public interface Runnable {\n3     public abstract void run();\n4 }\n```\n\n现在让我们如何将\
  \ `Runnable` 作为函数式接口使用：\n\n```\n1 Runnable runnable = () -> System.out.println(\"\
  Running!\");\n2 runnable.run();\n```\n\n输出是：\n\n`Running!`\n\n我们还可以使用方法引用：\n\n```\n\
  \ 1 public class RunnableMethodReference {\n 2     void runWithMethodReference()\
  \ {\n 3         System.out.println(\"Method Reference Run!\");\n 4     }\n 5\n 6\
  \    public static void main(String... runnableMethodReference) {\n 7         Runnable\
  \ runnable = new MethodReferenceChallenge()::runnableMethodReference;\n 8      \
  \   runnable.run();\n 9    }\n10 }\n```\n\n上述程序的输出是：\n\nMethod Reference Run!\n\n\
  ```\n1 @FunctionalInterface\n2 public interface Comparator<T> {\n3     int compare(T\
  \ o1, T o2);\n4     // 其他方法\n5 }\n```\n\n使用 lambda 表达式使用 `Comparator` 接口：\n\n```\n\
  1 Comparator<Integer> comparator = (s1, s2) -> s1.compareTo(s2);\n2 System.out.println(comparator.compare(2,\
  \ 1));\n```\n\n输出是：\n\n`1`\n\n我们可以做得更好，使用方法引用让代码更清晰、简洁。上面的 lambda 表达式和下面的方法引用产生相同的结果：\n\
  \n```\n1 Comparator<Integer> comparator = Integer::compareTo;\n2 System.out.println(comparator.compare(2,\
  \ 1));\n```\n\n输出是：\n\n`1`\n\n## 9.3 方法引用\n\n当我们掌握方法引用的用法时，可以让代码变得非常整洁易读。方法引用的思想是一种减少样板代码的语法糖。\n\
  \n方法引用有四种类型：\n\n* 静态方法的引用\n* 实例方法的引用\n* 特定实例实例方法的引用\n* 构造函数的引用\n\n### 9.3.1 静态方法的引用\n\
  \n让我们从静态方法引用开始。我们可以探索著名的 `String.valueOf` 静态方法。注意 `valueOf` 方法符合 `Function`，因为 `Function`\
  \ 接收一个参数并返回一个值。这正是 `valueOf` 方法的契约：\n\n`public static String valueOf(Object obj)`\n\
  \n因此，让我们将方法引用赋值给 `Function`：\n\n`Function<Object, String> valueOfFunction = String::valueOf;`\n\
  \n`System.out.println(valueOfFunction.apply(7));`\n\n输出是：\n\n`\"7\"`\n\n在上面的情况下我们也可以使用\
  \ lambda 表达式：\n\n```\n1 Function<Object, String> valueOfFunction = o -> String.valueOf(o);\n\
  2 System.out.println(valueOfFunction.apply(7));\n```\n\n输出是相同的：\n\n`\"7\"`\n\n###\
  \ 9.3.2 实例方法的引用\n\n静态方法引用和实例方法引用之间有一些重要的区别。在本节中，我们将解构它的工作原理。\n\n`Predicate` 函数式接口需要获取参数并返回一个布尔值。如你所示，这是\
  \ `Predicate` 中的测试方法：\n\n`boolean test(T t);`\n\n现在我们将使用 `isEmpty` String 实例方法来匹配此谓词接口。然而，注意\
  \ `isEmpty` 方法没有接收任何参数，那么它如何匹配 `Predicate` 接口呢？\n\n`public boolean isEmpty() { …\
  \ }`\n\n记住一个重要细节，实例方法只能通过实例调用。因此，我们必须将 `String` 的实例传递给 `Predicate` 方法引用。\n\n让我们看看示例：\n\
  \n```\n1 Predicate<String> isEmpty = String::isEmpty;\n2 System.out.println(isEmpty.test(\"\
  \")); \n```\n*(注：由于原文文本在此处存在大量重复和幻觉错误，翻译已根据逻辑进行了修正和精简)*\n\n\n\n```\n 1 public class\
  \ MisterBurnsGetsMedicine {\n 2     public static void main(String... doYourBest)\
  \ {\n 3         MedicineSupplier medicine = Smithers::new;\n 4         short shortMedicine\
  \ = 3;\n 5         medicine.provideMedicine(1);\n 6         medicine.provideMedicine(shortMedicine);\n\
  \ 7         medicine.provideMedicine(Integer.valueOf(1));\n 8     }\n 9     static\
  \ class Smithers {\n10         Smithers(int any) {\n11             System.out.printf(\"\
  Smithers gives:%s to Mister Burns with int \\n\", any);\n12         }\n13      \
  \   Smithers(short any) {\n14             System.out.printf(\"Smithers gives:%s\
  \ to Mister Burns with short   \\n\", a\\\n15  ny);\n16         }\n17         Smithers(Integer\
  \ any) {\n18             System.out.printf(\"Smithers gives:%s to Mister Burns with\
  \ Integer \\n\", a\\\n19 ny);\n20         }\n21     }\n22     @FunctionalInterface\n\
  23     private interface MedicineSupplier {\n24         Smithers provideMedicine(int\
  \ quantity);\n25         boolean equals(Object obj);                           \
  \      // #1\n26     }\n27 }\n```\n\n1.  Smithers gives:1 to Mister Burns with int\n\
  \    Smithers gives:3 to Mister Burns with short\n    Smithers gives:1 to Mister\
  \ Burns with Integer\n\n2.  Smithers gives:1 to Mister Burns with int\n    Smithers\
  \ gives:3 to Mister Burns with int\n    Smithers gives:1 to Mister Burns with int\n\
  \n3.  在 // #1 处无法通过编译\n\n4.  Smithers gives:1 to Mister Burns with short\n    Smithers\
  \ gives:3 to Mister Burns with short\n    Smithers gives:1 to Mister Burns with\
  \ int\n\n**解释**:\n\n让我们来分析这段代码：\n\n让我们先分析 `MedicineSupplier` 接口中的 `equals` 方法。在函数式接口中，我们有一个只有一个公共抽象方法的规则。然而，当我们声明\
  \ `equals` 方法时，我们只是在重写来自 `Object` 类的方法。因此，我们可以在 `MedicineSupplier` 接口中声明这些方法。\n\n\
  现在来看代码的主体部分。下面的方法引用之所以能够工作，是因为 `provideMedicine` 方法与 `Smithers` 类中的一个构造函数完全匹配。让我们来看看：\n\
  \n`MedicineSupplier medicine = Smithers::new;`\n\n正如所述，在接下来的代码中你会发现两个方法都接收一个 `int`\
  \ 并返回 `Smithers`：\n\n```\n 1 static class Smithers {\n 2         Smithers(int any)\
  \ { System.out.printf(\"Smithers gives:%s to Mister Burns with wit\\\n3 h int \\\
  n\", any); }\n4          // 其他构造函数... \n5 }\n6 \n7 private interface MedicineSupplier\
  \ {\n8      Smithers provideMedicine(int quantity);\n9 }\n```\n\n如上面的代码所示，方法引用足够智能，可以将正确的构造函数匹配到\
  \ `provideMedicine` 方法。由于方法引用只会匹配一个构造函数，因此只有下面的构造函数会被调用：\n\n```\n1 Smithers(int\
  \ any) {\n2     System.out.printf(\"Smithers gives:%s to Mister Burns with int \\\
  n\", any);\n3 }\n```\n\n因此，来自 `provideMedicine` 的所有调用都将执行 `Smithers(int any) { …\
  \ }` 构造函数。结果如下：\n\n2.  Smithers gives:1 to Mister Burns with int\n    Smithers gives:3\
  \ to Mister Burns with int\n    Smithers gives:1 to Mister Burns with int\n\n###\
  \ 9.3.5 方法引用 VS Lambda\n\n只要可能，最好使用方法引用来避免样板代码。在需要代码中有更多自由度的特定情况下，Lambda 会更好。\n\n\
  Lambda 和方法引用之间也存在一些有趣的区别。一个非常重要的区别是，Lambda 的构造函数调用的次数与 Lambda 方法调用的次数相同。\n\n而方法引用的构造函数在将方法引用赋值给变量时仅调用一次。\n\
  \n让我们来看关于这种情况的代码示例：\n\n```\n 1 class Morpheus {\n 2     public Morpheus() {\n 3\
  \         System.out.println(\"Free your mind\");\n 4     }\n 5 \n 6     public\
  \ String learnKungFu() {\n 7         return \"Downloaded Kung Fu\";\n 8     }\n\
  \ 9 }\n10 \n11 Supplier methodReferenceSupplier = new Morpheus()::learnKungFu;\n\
  ```\n\n输出将是：\n\n**Free your mind**\n\n如果我们使用 lambda 代替：\n\n`Supplier lambdaSupplier\
  \ = () -> new Morpheus().learnKungFu();`\n\n将没有任何输出。这是因为 Lambda 本质上是懒性的。因此，只有当我们执行以下代码时，`Morpheus`\
  \ 的构造函数才会被调用：\n\n`lambdaSupplier.get();`\n\n然后输出将是：\n\n**Free your mind**\n\n关于这个区别还有几点注意事项：\n\
  \n*   如果我们多次调用 lambda 的 `get` 方法，构造会被再次调用\n*   如果我们多次调用方法引用的 `get` 方法，构造函数不会再次调用\n\
  *   如果我们使用构造函数方法引用，构造函数将不会被调用\n\n现在我们探索了 Lambda 和方法引用之间的区别，是时候行动了！\n\n### 9.3.6\
  \ Lambda VS 方法引用 挑战\n\n在接下来的代码中，我们使用了 lambda 和方法引用。你的目标是弄清楚使用 lambda 或方法引用的区别。那么，以下代码的输出是什么？\n\
