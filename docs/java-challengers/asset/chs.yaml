  B\"));\n3 System.out.println(noneMatch);\n```\n\n**输出：**\n\ntrue\n\n由于上述元素没有一个是以\
  \ `B` 开头的，`noneMatch` 方法将返回 `true。\n\n```\n1 Stream<String> knights = Stream.of(\"\
  Saori\", \"Shaka\", \"Shiryu\", \"Seya\");\n2 boolean allMatch = knights.allMatch(s\
