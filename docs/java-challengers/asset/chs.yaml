  \ 13        public String learnKungFu() {\n 14            return \"Downloaded Kung\
  \ Fu\";\n 15        }\n 16    }\n 17    @FunctionalInterface\n 18    private interface\
  \ Supplier {\n 19        String get();\n 20    }\n 21 }\n```\n\n\n\n\n现在让我们用 Lambda\
  \ 和方法引用来完成每个函数接口：\n\n1 - `Supplier<String> vaderSupplier = // 使用 A 或 B 完善`\n\nA)\
