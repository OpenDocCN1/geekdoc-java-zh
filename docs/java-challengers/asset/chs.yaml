  \n```java\n1 var path = Paths.get(\"customer_purchases.txt\");\n2 try (var lines\
  \ = Files.lines(path)){ ... } \n```\n\n### 14.11.3 在 Lambda 表达式中使用 `var`\n\n有时，在\
  \ lambda 的参数中使用如 `@Nonnull` 等注解来验证数据类型是有用的。为此，我们需要指定某种类型。\n\n```java\n1 Function<String,\
  \ String> products =\n```\n\n*(注：源文本在此部分包含大量重复片段；我已对唯一的结构元素进行了格式化。）*\n\n### 14.11.4\
