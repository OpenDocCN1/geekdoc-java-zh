  \n\n\n\n\n此代码挑战的核心概念是 Java 中的流（streams）是懒性的（lazy），这种设计是为了优化性能。这意味着只有我们在流式流水线中指示的元素才会被处理。\n\
  \n例如，我们使用了中间操作方法 `peek`，它只显示我们正在遍历的元素。但我们还使用了 `limit` 方法，它会将元素 `limit(1)` 限制为 `1`\
  \ 个。因此，我们不需要遍历列表中的三个元素，这将浪费计算机资源。\n\n考虑到只有我们通过中间操作方法编写的元素才会被处理，将发生以下情况：\n\n* 中间操作方法\
  \ `peek` 和 `limit` 将被处理但不会被执行。\n* 终端操作方法 `forEach` 将被读取，只有之后 `peek` 和 `limit` 才会被有效调用。\n\
  \n结果是只有 `Neo` 会被打印，因为方法的执行是从我们指示 `stream` 的顺序开始开始的。因此，正确的选项是：\n\n**C) Neo peek Neo\
  \ forEach ** **\n\n### 13.4.11 使用 skip() 跳过元素\n\n`skip` 方法可以跳过流中指定的任意数量的元素。你可以像下面的代码所示，将\
  \ `skip` 与 `filter` 方法结合使用：\n\n```\n1 Stream.of(\"Bojack\", \"Todd\", \"Peanutbutter\"\
  , \"Princess Carolyn\", \"Diane\")\n2     .filter(e -> e.length() > 4).     // #A\n\
  3     .skip(2).                         // #B\n4     .forEach(e -> System.out.print(e\
  \ + \" \"));\n```\n\n**Output**:\n\nPrincess Carolyn Diane\n\n* #A: 仅过滤出长度大于 4 的字符串。\n\
  * #B: 跳过 2 个符合过滤条件的元素。在这种情况下，`Bojack` 和 `Peanutbutter` 被跳过了。\n\n### 13.4.12 使用 sorted()\
  \ 对元素排序\n\n要对流中的元素进行排序，可以使用 `sorted` 方法。只需记住，你使用的对象必须实现 `Comparable` 接口，`sorted`\
  \ 方法才能工作。\n\n在下面的代码中，我们将使用一个已经实现了 `Comparable` 的 `String`。因此，运行以下代码时，元素将按照自然顺序排序：\n\
  \n```\n1 List<String> zodiacKnights = Arrays.asList(\"Shaka\", \"Kanon\", \"Aldebaran\"\
  ,           \\\n2                                       \"Seya\", \"Ikki\");\n3\
  \ zodiacKnights.stream().sorted().forEach(e -> System.out.println(e + \" \"));\n\
  ```\n\n**Output**:\n\nAldebaran Ikki Kanon Seya Shaka\n\n### 13.4.13 排序英雄流挑战\n\n\
  在接下来的 Java 挑战中，我们有一个 `Hero` 类，它将用于用于 `stream()` 的 `sorted()` 方法。那么，运行以下代码时会发生什么？\n\
  \n```\n 1 import java.util.List;\n 2 \n3 public class SortedHeroesStreamChallenge\
