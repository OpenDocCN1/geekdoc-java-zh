  \ 允许$） |\n\n### 2.1.7 变量规范\n\nJava 命名使用 `camelCase`，即第一个单词小写，后续单词首字母大写。\n\n### 2.1.8\
  \ 递增与递减\n\n有多种方法可以增加减少变量的值。\n\n```java\n1 grade = 0;\n2 grade++;\n3 System.out.println(++grade);\n\
  ```\n\n### 2.1.9 递增运算符\n\n常见的操作是将整数变量的值加一。在 Java 中，你可以这样做：\n\n```\n1 int luckNumber\
  \ = 0;\n2 luckNumber = luckNumber + 1;\n```\n\n但有一个更简洁的选择：使用递增运算符 `++`。通过在表达式中变量名称之前或之后包含\
  \ `++` 给变量加一。这些分别称为自增运算符和后增运算符。\n\n让我们看看后增运算符是如何工作的：\n\n```\n1 int luckNumber =\
  \ 0;\n2 System.out.println(luckNumber++);\n3 System.out.println(luckNumber); \n\
  ```\n\n通过 `jshell` 运行上述代码，它将输出：\n\n```\n0\n1\n```\n\n如你所见，`luckNumber` 变量的值在递增操作的下一行才会增加。\n\
  \n自增运算符的作用不同——变量的值在运算符出现的同一行内增加一。例如：\n\n```\n1 int luckNumber = 0;\n2 System.out.println(++luckNumber);\n\
  ```\n\n\n\n\n使用前置增运算符时，值先增加，然后计算结果。使用后置增运算符时，先计算结果，然后增加值。\n\n### 2.1.10 递减运算符\n\n\
  减法也适用相同的规则，使用 Java 的递减运算符（–）。同样，有两个版本。在下面的代码示例中，使用了后置减运算符，`homerGrade` 变量的值只会在下一行减\
  \ 1：\n\n```\n1 int homerGrade = 2;\n2 System.out.println(homerGrade--);\n3 System.out.println(homerGrade);\n\
  ```\n\n运行这段代码将输出：\n\n```\n1 2\n2 1\n```\n\n当使用前置减运算符时，`homerGrade` 变量的值会在计算结果之前立即减\
  \ 1：\n\n```\n1 int homerGrade = 2;\n2 System.out.println(--homerGrade);\n3 System.out.println(homerGrade);\n\
  ```\n\n这将输出：\n\n```\n1 1\n2 1\n```\n\n## 2.2 算术运算符\n\n算术运算符是每种编程语言中最核心的概念之一。在开发代码时，我们一直在处理信息。\n\
  \n让我们看看 Java 中最基础的算术运算符：\n\n| 运算符 | 说明 |\n| --- | --- |\n| `*` | 乘法运算符 |\n| `/`\
  \ | 除法运算符 |\n| `%` | 取余运算符 |\n| `+` | 加法运算符（也用于字符串拼接） |\n| `-` | 减法运算符 |\n\n让我们探索运算符的优先级。像数学中一样，乘法和除法的优先级高于加法和减法。让我们来看一些例子：\n\
  \n`System.out.println(5 + 5 * 5);`\n\n上述代码的结果将是 30，因为乘法操作优先级最高会先执行。考虑到 `5 * 5` 等于\
  \ 25，然后加加 5。\n\n然后，让我们分析另一个同样具有高优先级的除法示例：\n\n`System.out.println(5 + 5 / 5);`\n\n\
  输出将是：\n\n6\n\n结果将是 6，因为 `5 / 5` 会先执行得到结果 1，然后加到 5。\n\n但当同一个操作中同时存在除法和乘法时会发生什么？让我们看下面的例子：\n\
  \n`System.out.println(5 / 5 * 1);`\n\n输出将是：\n\n1\n\n在上述代码中，优先级由运算符引入的顺序决定。因此，`5\
  \ / 5` 将先执行得到结果 1，然后乘以 1，得到输出结果 1。\n\n现在让我们看看先使用乘法时会发生什么：\n\n`System.out.println(5\
  \ * 5 / 1);`\n\n输出将是：\n\n25\n\n在上述代码中，`5 * 5` 将先执行得到结果 25，然后除以 1，因此最终结果为 25。\n\n\
  还有取余运算符，让我们快速回顾一下它是如何工作的：\n\n`System.out.println(5 % 5);`\n\n输出将是：\n\n0\n\n`5 /\
  \ 5` 的余数 0，当我们用 5 除以 5 时，没有余数。\n\n算法的一个非常常见的用例是检查数字是偶数还是奇数，我们可以通过取余运算符来实现，让我们来看检查数字是否为偶数的例子：\n\
  \n`System.out.println(5 % 2);`\n\n输出将是：\n\n1\n\n上面的计算返回 1，因为那是 5 和 2 相除的余数，这意味着\
  \ `2 * 2` 是 4，而 1 是余数。因此，数字 5 是奇数。\n\n如果我们对偶数进行类似的操作，余数就是 0。\n\n`System.out.println(4\
  \ % 2);`\n\n在上述代码中 `4 / 2` 是 2，因此没有余数，也意味着 4 是一个偶数。\n\n取余运算符的优先级与乘法和除法相同，让我们来看下面的例子：\n\
  \n`System.out.println(5 + 4 % 2);`\n\n输出将是：\n\n5\n\n第一个执行的操作是 `4 % 2`，然后我们得到结果 0\
  \ 并加到 5。因此，最终结果为 5。\n\n还有一种强制计算优先级的方法，我们可以通过括号 `()` 实现。例如，如果我们想在执行乘法、除法或取余运算符之前执行加法操作，可以这样做：\n\
  \n`System.out.println( (5 + 5) * 5);`\n\n输出将是：\n\n50\n\n运行上述代码时，第一个执行的操作是 `5 + 5`，结果为\
  \ 10，然后乘以 5，这意味着最终结果是 50。如果没有括号，输出将是 30。\n\n### 关于算术运算符需要记住的几点：\n\n* 乘法、除法和取余运算符的优先级高于加法和减法。\n\
  * 如果只使用乘法、除法和取余运算符，优先级由先使用的运算符决定。\n* 括号的优先级总是最高的。\n\n## 2.3 流程控制\n\n流程控制是我们日常生活中经常使用的概念。我们定义条件来检查是否可以执行某个特定操作。例如，如果是温暖和晴朗的一天，我们可以去海滩。如果我们有休息时间并且还有闲钱，我们可以去度假。如果你解决了\
  \ Java 挑战，你就可以称自己为 Java 星星了！ :)\n\n\n\n流程控制基本上是测试条件并在条件为真时执行一个操作、假时执行另一个操作的能力。这是一种根据我们预期的条件来控制程序流的方法。\n\
  \n我们在编程中经常使用条件，深入了解如何操作条件对我们创建的代码质量有很大影响。许多开发者并不熟悉 Java 中条件的所有细节，因此让我们更深入地探索它们。\n\
  \n在分析第一个流程控制示例之前，请看表 3.2，它总结了我们在编程中用于比较变量和值的等值运算符和关系运算符。\n\n### 表 2.3 Java 中的等值和关系运算符\n\
  \n| 关系运算符 | 解释 | 示例 | 返回值 |\n| :--- | :--- | :--- | :--- |\n| == | | `1 == 1` |\
  \ true |\n| != | 不等于 | `1 != 1` | false |\n| > | 大于 | `2 > 1` | true |\n| >= | 大于等于\
  \ | `1 >= 1` | true |\n| < | 小于 | `3 < 2` | false |\n| <= | 小于等于 | `1 <= 3` | true\
  \ |\n\n让我们从任何编程语言中最基础的流程控制语句开始，if 语句：\n\n```\n1 int homerAge = 35;\n2 if (homerAge\
  \ >= 21) \n3     System.out.println(\"Homer can drink beer\"); \n```\n\n当执行此命令时，将打印\
  \ `\"Homer can drink beer\"`。\n\n注意在这个示例中，if 语句的条件周围没有使用大括号 `({})`。这在 Java 中是完全允许的，但仅当\
  \ if 语句只有一个指令时。如果我们这样做，例如，第二条消息将始终打印，即使（在此例中）条件 `homerWeight > 340` 为假：\n\n```\n\
  1 int homerWeight = 240;\n2 \n3 if (homerWeight > 340) \n4     System.out.println(\"\
  Homer is obese\");\n5     System.out.println(\"Homer needs to go on a diet\"); //#1\n\
  ```\n\n代码中的点 `//#1` 不会被视为 if 语句的一部分，并且始终会被执行，因为没有大括号。\n\n不使用大括号在某些情况下可能没问题，但当你向\
  \ if 条件中添加新指令时，可能会忘记添加大括号，所以如果你决定省略它们，就必须小心。最安全的做法是始终包含大括号。\n\n### 2.3.1 逻辑运算符\n\
  \n当我们需要比较两个或多个条件时，我们会使用逻辑运算符（`AND`、`OR`、`NOT`）。开发者经常使用这些运算符，我们在现实世界中也一直在使用它们。\n\n\
  ### 2.3.2 AND 逻辑运算符\n\n在 Java 中，连接两个条件（`AND`）的运算符如下：`&&`。该运算符的主要规则是两个条件都必须为 `true`\
  \ 才会返回 `true`。\n\n这是一个示例：\n\n```\n1 if (atLeast12YearsOld && hasMoney) { \n2   \
  \  System.out.println(\"Watch horror movie in the cinema\")); \n3 }\n```\n\n在这种情况下，如果一个人至少\
  \ 12 岁且有钱买票，那么他们就能在电影院看恐怖片。注意，这两个条件都必须为真，这个人才能去电影院。\n\n`&&` 运算符还有另一个重要的规则，从性能的角度来看是合理的。因为两个条件都必须为真，我们知道如果第一个条件为假，则第二个条件就不需要评估。这正是发生的情况：如果第一个条件为假，JVM\
  \ 就不会去评估第二个条件，因为它已经知道 `&&` 运算符将返回 `false`。这被称为“短路”（`short-circuit`）评估。\n\n让我们来看一个示例来解释它是如何工作的。在这个示例中，第一个条件\
  \ `bartAge >= 12` 不会被满足，因此第二个条件 `bartMoney >= 10` 甚至不会被评估：\n\n```\n1 int bartAge\
  \ = 10;\n2 double bartMoney = 20;\n3 \n4 if (bartAge >= 12 && bartMoney++ >= 10)\
  \ { // 第二个条件不会执行\n5 \tSystem.out.println(\"Bart can go to the cinema\"); // 这段代码不会执行\n\
  6 }\n7 \n8 System.out.println(bartMoney); // 将打印 20\n```\n\n你可以通过检查 `bartMoney`\
  \ 变量的值证明这一点，当执行第二个条件时，该变量会加 1。如果你在 if 语句之后打印这个变量，它输出 `20`，这表明 JVM 没有执行这个条件。\n\n\
  ### 2.3.3 OR 逻辑运算符\n\n`OR` 逻辑运算符验证是否至少有一个条件为真。它在 Java 中用 `||` 表示。让我们来看一个示例：\n\n\
  ```\n1 boolean isBartWithCinemaTicket = false;\n2 boolean isBartWithMoney = true;\n\
  3 \n4 if (isBartWithCinemaTicket || isBartWithMoney) { \n5 \tSystem.out.println(\"\
  Bart can watch a movie at the cinema\");\n6 }\n```\n\n在这种情况下，只需要一个条件为真即可：如果 Bart\
  \ 有票或有钱买票，他就能在电影院看电影。即使只有 `isBartWithCinemaTicket` 或 `isBartWithMoney` 为真，`||` 运算符也会返回真。\n\
  \n出于性能考虑，`||` 运算符的工作方式与 `&&` 类似。如果第一个条件为真，第二个条件就不会被评估。\n\n### 2.3.4 NOT 逻辑运算符\n\n\
  最后一个逻辑运算符是 NOT，在 Java 中用 `!` 表示。该运算符接收一个布尔值作为操作数并反转它——如果条件为真，`!` 运算符将其变为假，反之亦然。例如：\n\
  \n```\n1 System.out.println(!true); // 输出 false\n2 System.out.println(!false); //\
  \ 输出 true\n```\n\n## 2.3 变量和条件\n\n有时我们需要在代码中处理复杂的条件。提高代码可读性的方法之一是创建一个有意义的布尔变量，以指示条件是否成立。\n\
  \n假设我们需要检查账户是否有足够的资金取款：\n\n`if (moneyToWithdraw <= accountBalance) { ... }`\n\n\
  我们可以将此条件赋值给布尔变量：\n\n`boolean isMoneyAvailableInBalance = moneyToWithdraw <= accountBalance;`\n\
  \n然后在 if 语句中使用该变量：\n\n`if (isMoneyAvailableInBalance) { ... }`\n\n这种技术对于提高代码可读性非常有用，特别是当单个\
  \ if 语句中有多个条件需要比较时。\n\n提高单个 if 或 Java 语句中多个条件的另一种方法是嵌套，将一个 if 语句放在另一个内部。最好避免过度嵌套，因为这会增加复杂性并降低代码质量，但考虑到你很有可能在实际项目中看到代码嵌套，所以了解它是如何运作的很好。这是一个示例：\n\
  \n```\n1 int simpsonAge = 18;\n2 \n3 if (simpsonAge >= 18) {\n     if (simpsonAge\
  \ <= 50) {\n         System.out.println(\"The Simpson age is from 18 to 50\");\n\
  \     }\n4 }\n```\n\n更好的做法是在这种情况下我们可以使用 `&&` 来改进代码，结果完全相同：\n\n```\n1 if (simpsonAge\
  \ >= 18 && simpsonAge <= 50) {\n     System.out.println(\"The Simpson age is from\
  \ 18 to 50\");\n2 }\n```\n\n\n\n如果你知道 Java 的不同特性，就能看到你的代码可以变得多么简单。这仅仅只是一个简单的例子，说明了深入了解语言所提供的功能如何帮助你编写出更清晰、更好且更有意义的代码。\n\
  \n### 2.3.5 布尔变量的命名规范\n\n> 用于布尔变量命名的 JavaBeans 惯例使用以下模式：`<YourConditionName>`。在布尔值名称前加上\
  \ `has` 前缀也很常见，在很多情况下这可能看起来更合适（例如，`hasMoneyToSpend`）。然而，JavaBeans 规范并没有提到这种替代方案，但最好尽可能坚持使用标准，因此请务必尝试使用\
  \ `is` 前缀。\n\n### 2.3.6 三元运算符\n\n当你需要检查的条件非常简单时，并不总是需要使用 `if` 语句。相反，你可以使用 Java 的三元运算符\
  \ `?`，它的功能类似于 `if` 语句的简化形式。它接受三个操作数，如下：\n\n`条件 ? 条件为真时返回一个值 : 条件为假时返回一个值`\n\n以下代码检查\
  \ `beerQuantity` 变量的值是否大于或等于 50。如果是，将返回值“Homer”。如果条件为假，则返回值“Moe”：\n\n```\n1 int\
  \ beerQuantity = 50;\n2 String beersOwner = beerQuantity >= 50 ? \"Homer\" : \"\
  Moe\";\n3 System.out.println(beersOwner); // 这将打印 \"Homer\"\n```\n\n因为三元运算符的条件为真，所以将打印值“Homer”。\n\
  \n同样，可以将一个普通的 `if` 语句嵌套在另一个语句中，嵌套三元运算符也是可能的——但这要糟糕得多。嵌套三元运算符会让代码维护变成一场噩梦。\n\n这里有一个示例：\n\
  \n```\n1 String beerOwner = beerQuantity >= 100 ? beerQuantity >= 200 ? beerQuantity\
  \ >= 300 ?\\\n2  \"Barney\" : \"Homer\" : \"Lenny\" : \"Carl\";\n```\n\n这非常困惑且难以理解，你应该不惜一切避免这样做。\n\
  \n### 2.3.7 Homer 啤酒流控制挑战\n\n在下面的代码中，我们将探索 `if` 语句、`三元运算符`和`逻辑运算符`的概念。Homer 将消耗两批\
  \ `beer`，`batchOfBeer1` 和 `batchOfBeer2`。你认为 Homer 在这个挑战结束后会喝掉多少啤酒？\n\n```\n 1 public\
  \ class HomerBeersBatch {\n 2 \n3     public static void main(String... doYourBest)\
  \ {\n 4         int batchOfBeer1 = 5;\n 5         int batchOfBeer2 = 5;\n 6 \n 7\
  \         if (++batchOfBeer2 > batchOfBeer1 || batchOfBeer1++ == batchOfBeer2++)\
  \ {\n 8             batchOfBeer1++;\n 9         }\n10 \n11         batchOfBeer1\
  \ = (batchOfBeer1++ > batchOfBeer2 && \n12          ++batchOfBeer2 <  batchOfBeer1++\
  \ ?  ++batchOfBeer1 : ++batchOfBeer2);\n13 \n14         System.out.println(\"Homer\
  \ will have: \" + batchOfBeer1-- +\n15                            \" and \" + batchOfBeer2++\
  \ + \" beers.\");\n16     }\n17 \n18 }\n```\n\n1. Homer 将有：7 和 7 瓶啤酒。\n2. Homer\
  \ 将有：7 和 8 瓶啤酒。\n3. Homer 将有：5 和 7 瓶啤酒。\n4. Homer 将有：5 和 6 瓶啤酒。\n\n**解释**：\n\n这个挑战的关键要点是知道前置自增（pre-increment）运算符在变量使用时增加其值，而后置自增（post-increment）运算符在变量使用后增加值。另一个需要知道的重要点是，短路（short-circuit）逻辑运算符\
  \ `||` 只会检查确定条件是否满足所必需的内容。这意味着在第一个 `if` 中：\n\n```\n1 if (++batchOfBeer2 > batchOfBeer1\
  \ || batchOfBeer1++ == batchOfBeer2++) {  \n2     batchOfBeer1++;\n3 }\n```\n\n\
  只会检查第一个条件。因为它是真的，所以第二个条件不需要检查。因此，只有 `batchOfBeer2` 会增加。然后，`batchOfBeer1` 变量会在 `if`\
  \ 语句内部被增加。\n\n所以，这两个变量的值将是：\n\n```\n1 batchOfBeer1 = 6;\n2 batchOfBeer2 = 6;\n```\n\
  \n接下来的语句是三元运算符：\n\n```\n1 batchOfBeer1 = (batchOfBeer1++ > batchOfBeer2 && ++batchOfBeer2\
  \ < batchOfBeer1++ ?  \\\n2 ++batchOfBeer1 : ++batchOfBeer2);\n```\n\n条件 `batchOfBeer1++\
  \ > batchOfBeer2` 为假的，因为 `batchOfBeer1` 变量只有在该条件检查后才会增加。`batchOfBeer1` 和 `batchOfBeer2`\
  \ 将具有相同的值 `6`，所以“else”条件将满足并评估第三个操作数。由于我们使用了前置自增运算符，`batchOfBeer2` 变量将增加到 `7`，并且这个值将...\n\
  \n\n\n```\n 1 public class BreakingBadChallenge {\n 2 \n 3\tpublic static void main(String...\
  \ doYourBest) {\n 4 \t\tint formulaNumber = 10;\n 5 \n 6 \t\tString heisenbergFormula\
  \ = \"\";\n 7 \n 8 \t\tswitch (formulaNumber) {\n 9 \t\tcase 1:\n10 \t\t\theisenbergFormula\
  \ += \"H\";\n11 \t\tcase 10:\n12 \t\t\theisenbergFormula += \"Ne\";\n13 \t\tcase\
  \ 30:\n14 \t\t\theisenbergFormula += \"Zn\";\n15 \t\tcase 25:\n16 \t\t\theisenbergFormula\
  \ += \"Mn\";\n17 \t\t\tbreak;\n18 \t\tdefault:\n19 \t\t\theisenbergFormula += \"\
  He\";\n20 \t\t}\n21 \n22 \t\tSystem.out.println(heisenbergFormula);\n23 \t}\n24\
  \ \n25 }\n```\n\n1. `Ne`\n\n2. `NeZnMnHe`\n\n3. `NeZnMn`\n\n4. `NeHe`\n\n**解释**:\n\
  \n值为 `10` 的 `formulaNumber` 将满足条件，因此将打印 `Ne`。但请注意，我们没有在每个 case 之后使用 `break` 关键字。`switch`\
  \ 语句将继续执行，直到找到该关键字。这意味着 `Zn` 和 `Mn` 在 `switch` 语句被 `break` 关键字中断之前会被拼接到 `Ne` 之后，最终得到最终输出\
  \ `NeZnMn`。\n\n结论，正确的选项是：\n\n**C - NeZnMn**\n\n## 2.4 循环\n\n编程中的循环是一种在满足条件之前重复某些逻辑的方法。你可能能想到现实世界中的几个例子：当我们刷牙时，我们重复刷牙动作直到牙齿干净；当我们学习考试时，我们不断学习直到有足够的把握；当我们我们需要去某处时，我们不断开车直到到达目的地。\n\
  \n就像生活一样，编程中循环无处不在。但并不是所有开发者都了解 Java 中循环的所有可能性。我们每天都面临着各种挑战，了解循环的细微差别将帮助开发者编写出最好的代码。\n\
  \n### 2.4.1 for 循环\n\n`for` 循环是 Java 中最常用的循环。`for` 循环有三个部分：\n\n```\n1 for /* 初始化变量\
  \ */; /* 循环条件 */; /* 计数器 */\n2 \\) ... }\n```\n\n这是它的典型用法：\n\n`for (int i = 0; i\
  \ < 10; i++) { ... }`\n\n你可以在 `for` 循环中初始化任意数量的变量：\n\n`for (short i = 0, y = 0;\
  \ i < 10; i++) { ... }`\n\n你可以通过指定永远为假的条件来创建一个无限的 `for` 循环：\n\n`for ( ; ) { System.out.println(\"\
  This will print forever\"); }`\n\n你甚至可以在计数器区域使用 `System.out.println`：\n\n`for (;;\
  \ Incrementer area\")) ... }`\n\n### 2.4.2 循环中的 break 关键字\n\n正如你在 `switch` 案例中所示，如果由于原因你想跳出当前进程并退出循环，可以使用\
  \ `break` 关键字。\n\n假设你想在索引大于等于 2 时停止循环执行：\n\n```\n1 for (int i = 0; i < 10; i++)\
  \ {\n2     if (i >= 2) {\n3         System.out.println(i);\n4         break;\n5\
  \     }\n6 }\n```\n\n这段代码只会打印 `2`。由于 `break` 关键字位于 `for` 循环内部，循环将被中断，后续数字不会打印。\n\
  \n### 2.4.3 continue 关键字\n\n有时你想控制循环执行的继续。为了这个目标，有了 `continue` 关键字。\n\n在下面的代码中，我们将探索一个示例，当满足特定条件时我们不想执行某些逻辑：\n\
  \n```\n1 for (int i = 1; i <= 5; i++) {\n2     if (i >= 3) { \n3         System.out.println(\"\
  Goku beats one Majin Buu with \" + i + \" hits\");\n4         continue;\n5     \
  \ }\n6      System.out.println(\"Goku hits Majin Buu\");\n7 }\n```\n\n`for` 循环末尾有一条指令向控制台打印文本\
  \ `\"Goku hits Majin Buu\"`。但我们只想在变量 `i` 的值小于 3 时打印这段文本。\n\n如果 `i` 的值为 3 或更大，我们不想执行\
  \ `if` 语句之外的指令；相反，我们想打印消息“Goku beats one Majin Buu with + i + hits”。解决问题的完美方案是使用\
  \ `continue` 关键字跳转到下次循环迭代。\n\n当满足 `if` 条件时，`continue` 语句会将控制传回循环体的顶部，跳过其下面的任何语句；这意味着第二个打印语句将不会执行。\n\
  \n但请记住，通常应该避免使用 `continue` 关键字，因为代码中的多个流会使其更难以阅读和维护。只有当它特别适用于你正在编写的情况时才使用此功能。\n\n\
  ### 2.4.4 标签的使用\n\n有时我们需要控制循环。在情况下，标签（labels）是有用的。\n\n这是一个使用标签的示例：\n\n\n\n但正如你看到的，变量名是重复的，这使得代码变得难以理解。如果你使用数组类型，则可以使用一个变量名来包含多个值：\n\
  \n```\nString [] simpsonCharacterNames = { \"Moe\", \"Burns\", \"Bart\" };\n```\n\
  \n这种表示方式紧凑得多，只占用了一行。然后你可以通过索引访问数组的每个元素。Java 中的数组索引从 0 开始，因此如果你想打印“Burns”，你需要执行以下操作：\n\
  \n```\nSystem.out.println(simpsonCharacterNames[1]);\n```\n\n你可以使用任何类型的循环打印数组中的所有信息，例如标准的\
  \ for 循环：\n\n```\n1 for (int i = 0; i < simpsonCharacterNames.length; i++) {   \
  \      \n2     System.out.println(simpsonCharacterNames[i]); \n3 }\n```\n\nwhile\
  \ 循环：\n\n```\n1 int i = 0;\n2 while (i < simpsonCharacterNames.length) {       \
  \  \n3     System.out.println(simpsonCharacterNames[i++]); \n4 }\n```\n\n或者 for-each\
  \ 循环：\n\n```\n1 for (String eachCharacterName : simpsonCharacterNames) {\n2    \
  \ System.out.println(eachCharacterName);\n3 }\n```\n\n你甚至可以使用流和方法引用（这些概念将在后面的章节中解释，但这里可以让你了解它们的大致）：\n\
  \n```\nArrays.stream(simpsonCharacterNames).forEach(System.out::println);\n```\n\
  \n每个循环都会打印数组的元素：\n\n```\n1 Moe\n2 Burns\n3 Bart\n```\n\n如果我们只想声明一个数组并创建该数组的实例，可以使用以下语法：\n\
  \n```\nint [] simpsonCharacterAges = new int[3];\n```\n\n注意，这里的 `new` 关键字与数组实例有关，而不是与原始类型\
  \ `int`。\n\n现在我们有了一个大小为三个元素的数组实例，可以如下所示对其填充值。同样请注意，在 Java 中，数组的初始索引是 0，而不是 1：\n\n\
  ```\n1 simpsonCharacterAges[0] = 35;\n2 simpsonCharacterAges[1] = 102;\n3 simpsonCharacterAges[2]\
  \ = 10;\n```\n\n如果我们使用 for-each 循环来显示数组的值，如下：\n\n```\n1 for (int eachCharacterAge\
  \ : simpsonCharacterAges) {\n2     System.out.println(eachCharacterAge);\n3 }\n\
  ```\n\n输出将是：\n\n```\n1 35\n2 102\n3 10\n```\n\n### 2.5.1 数组：数组默认值\n\n还记得在本章开头分析的、带有默认值的原始变量吗（标记为表\
  \ 2.1“Java 中定义的原始变量类型”）？\n\nJava 数组中一个重要的细节是，如果我们声明一个数组且不在其中填充任何值，则每个元素的值将包含每个变量的默认值。让我们看一些例子。\n\
  \n```\n1 int[] intNumbers = new int[3];\n2 System.out.println(intNumbers[0]);\n\
  ```\n\n**它将打印 0。**\n\n```\n1 double[] doubleNumbers = new double[3];\n2 System.out.println(doubleNumbers[0]);\n\
  ```\n\n**它将打印 0.0。**\n\n还要考虑对象（我们将在下一章深入探讨的主题）在数组中使用时将具有默认值 `null`。让我们看看 `String`\
  \ 类型的示例：\n\n```\n1 String[] names = new String[3];\n2 System.out.println(names[0]);\n\
  ```\n\n**它将打印 null。**\n\n### 2.5.2 马里兄弟索引数组挑战\n\n这个挑战将测试你对数组创建语法、数组索引工作原理以及如何遍历数组的每个元素的理解。你的目标是仅通过分析代码来确定运行\
  \ main 方法后会发生什么。当你认为你知道答案时，尝试运行代码。\n\n```\n 1 public class MarioBrosIndexChallenge\
  \ {\n 2 \n 3     public static void main(String[] args) {\n 4         String[] marioCharacters\
  \ = new String[3];\n 5         marioCharacters[1] = \"Mario \";\n 6         marioCharacters[2]\
  \ = \"Luigi \";\n 7         marioCharacters[3] = \"Peach \";\n 8 \n 9         for\
  \ (String marioCharacter: marioCharacters) {\n10             System.out.print(marioCharacter);\n\
  11         }\n12     }\n13 }\n```\n\n1. Mario Luigi Peach\n2. nullMario Peach\n\
  3. 将抛出 java.lang.ArrayIndexOutOfBoundsException\n4. nullMario Luigi\n\n这个挑战的关键在于数组索引。正如前面提到的，数组索引从\
  \ 0 开始。在这里我们创建了一个包含三个元素的数组。因为 Java 中的每个数组都从索引 0 而不是 1 开始，这意味着访问索引 3 是不可能的，如果我们尝试这样做，JVM\
  \ 将抛出 `ArrayIndexOutOfBoundsException`。\n\n这个异常名称非常直观：它告诉我们无法访问索引越界的元素。目前，不要过度担心深入理解异常；我们将在后面的章节中详细探讨这个概念。\n\
  \n结论是，正确的选项是：\n\n**C - 将抛出 java.lang.ArrayIndexOutOfBoundsException**\n\n### 2.5.3\
  \ 多维数组\n\nJava 还提供了多维数组。这基本上是一个具有两个更多维的数组，或者说是数组的数组。你可以将二维数组想象成行和列。在每一对中，你可以将第一个索引视为行号，第二个索引视为列号。\n\
  \n该程序的输出将是：\n\n```\n1 0,0|0,1|0,2\n2 1,0|1,1\n```\n\n创建一个井字棋，可以使用以下代码：\n\n```\n\
  1 String[][] tictoeBoard = new String[3][3];\n2 for (int row = 0; row < 3; row++)\
  \ {\n3     for (int column = 0; column < 3; column++) {\n4         tictoeBoard[row][column]\
  \ = row + \",\" + column + \"|\";\n5         System.out.print(tictoeBoard[row][column]);\n\
  6     }\n7 }}\n```\n\n*   #1 有三列。\n*   #2 定义两个循环，一个遍历行，一个遍历列。\n*   #3 在循环中遍历行和列并填充\
  \ tictoeBoard。\n*   #4 在行结束打印值。\n\n### 2.5.4 数组挑战\n\n这个代码挑战探索了你在本节及之前章节中学到的几个概念：多维数组、for\
  \ 循环声明变量、while 循环和 if 语句。你的任务是预测最后某些数组元素的信息。\n\n这个挑战并不那么代码友好——正如引言章节提到的，有些挑战侧重于探索概念，而不是编写良好的代码。\n\
  \n```\n 1 public class BidimensionalArrayChallenge {\n 2 \n 3     public static\
  \ void main(String[] doBest) {\n 4         String[][] simpsonsFoods = new String[2][2];\n\
  \ 5 \n 6         simpsonsFoods[0][0] = \"Donuts\";\n 7         simpsonsFoods[1][0]\
  \ = \"Broccoli\";\n 8         simpsonsFoods[1][1] = \"Krusty burger\";\n 9 \n10\
  \         for (int lineIndex = 0, columnIndex; lineIndex < 2; lineIndex++) {\n 11\
  \             columnIndex = 0;\n 12 \n 13             while (columnIndex < 2) {\n\
  \ 14                 if (simpsonsFoods[lineIndex][0] == \"Broccoli\") {\n 15   \
  \                  simpsonsFoods[lineIndex][columnIndex++] = \"Healthy\";\n 16 \
  \                } else {\n 17                     simpsonsFoods[lineIndex][columnIndex]\
  \ = \"Junk\";\n 18                     break;\n 19                 }\n 20      \
  \       }\n 21         }\n 22 \n 23         System.out.println(simpsonsFoods[0][0]\
  \ + \"|\" + simpsonsFoods[0][1] +        \\\n24                \"|\" + simpsonsFoods[1][0]\
  \ + \"|\" + simpsonsFoods[1][1]);\n 25     }\n 26 }\n```\n\n1.  Junk|null|Healthy|Junk\n\
  2.  Junk|Junk|Junk|Healthy\n3.  Junk|Junk|Healthy\n4.  Junk|Healthy|Junk|\n\n让我们分析每次迭代中发生了什么。\n\
  \n在第一次迭代中，lineIndex 和 columnIndex 变量都是 0。\n\n\n\n\n在第一个 `if` 语句中，数组元素的值为 `\"Donuts\"\
  `。随后`\"Junk\"` 将赋值到 `\"Donuts\"` 的位置。由于我们使用的是后自增运算符，`columnIndex` 只会在该指令执行后才会增加。此外，注意此条件中使用了\
  \ `break` 关键字；因此，它将跳出遍历列的内层循环。\n\n在下一次迭代中，`lineIndex` 变量将增加到 1，`columnIndex` 将重置为\
  \ 0，现在要比较的值是“Broccoli”，它将满足 `if` 条件。因此，来自 `simpsonsFoods[1][0]` 的值将是“Healthy”。\n\
  \n然后，在最后一次迭代中，`lineIndex` 为 1，`columnIndex` 也为 1。满足条件的将是第二个。因此，赋值给 `simpsonsFoods[1][0]`\
  \ 的值将是“Junk”。\n\n请注意，数组中的 `simpsonsFoods[0][1]` 位置没有填充。在这种情况下，将分配 `String` 的默认值，即\
  \ `null`。\n\n结论，所选数组索引的最终值为：\n\n**A - Junk|null|Healthy|Junk**\n\n## 2.6 局部变量限制\n\
  \n变量可以被看到和使用的部分被称为其作用域。在 Java 中，变量的作用域限于它们定义所在的块。代码块是任何被花括号 `({})` 括起来的代码片段：\n\n\
  ```\n1 public static void main(String[] theSimpsons) {\n2     // main 方法内部的代码是一个代码块\n\
  3 \n4     if (true) { /* 这也是一个代码块 */ }\n5 \n6     for (;;) { /* 这是另一个代码块 */ }\n\
  7 }\n```\n\n在方法内部声明的变量只能在该方法块内使用。这些变量被称为局部变量或方法变量。局部变量在方法开始执行时有效存在，在方法执行结束时消失。它们可以在方法块内的任何地方被访问，包括\
  \ `inner/nested` 块，但无法在声明它的方法之外访问局部变量。\n\n在接下来的示例中，`simpsonName` 变量在 `main` 方法中声明，并在封闭\
  \ `for` 循环内部使用：\n\n```\n1 public static void main(String[] theSimpsons) {\n2   \
  \  String simpsonName = \"Homer\"; // 此变量可以在 main 块的任何地方使用\n3     for (int i = 0;\
  \ i <= 10; i++) {\n5         System.out.println(simpsonName); // simpsonName 在这里可以使用\n\
  6     }\n7 }\n```\n\n可以在任何 Java 语句中声明变量。如果你在 `for` 循环、`if` 语句或任何非方法块中声明变量，局部变量只能在那里访问。这被称为块作用域。\n\
  \n在接下来的示例中，你无法在 `if` 块之外访问 `allanHangoverAge` 变量。因为变量是在 `if` 块内部声明的，它只能在那里使用：\n\n\
  ```\n1 public static void main(String[] hangover) {\n2     if (true) {\n3      \
  \   int allanHangoverAge = 40; // 此变量仅在 if 块中可见\n4     }\n5 \n6     // System.out.println(allanHangoverAge);\
  \ 我们在这里无法访问 allanHangoverAge\n7 }\n```\n\n尝试在取消打印语句的情况下运行此代码将导致编译时错误，大多数 IDE 会高亮此行和变量以指示存在的问题。\n\
  \n我们甚至可以创建一个没有语句的块（“匿名块”），并应用相同的规则：\n\n```\n1 public static void main(String...\
  \ starWars) {\n2     {\n3         int jediForce = 0; // 此变量只能在此块内部使用\n4     }\n\
  5 \n6     // System.out.println(jediForce); 这里不能使用 jediForce\n7 }\n```\n\n注意，在实践中，这些块在\
  \ `switch case` 语句之外很少使用。\n\n正如这些示例所示，局部变量只能在声明它所在的块（大括号集合）以及任何嵌套块中被访问。\n\n变量也可能是某个循环的局部变量。在实际项目中，你可能会遇到如下代码：\n\
  \n```\n 1 public static void main(String... starWars) { \n 2     for (int outerLooping\
  \ = 0; outerLooping < 10; outerLooping++) {\n 3         System.out.println(outerLooping);\n\
  \ 4         // System.out.println(innerLooping); 这里无法使用 innerLooping\n 5       \
  \  \n 6         for (int innerLooping = 0; innerLooping < 10; innerLooping++) {\n\
  \ 7 \tSystem.out.println(innerLooping); // 两个变量在这里都可以使用\n 8             System.out.println(outerLooping);\n\
  \ 9         }\n10 \n11     }\n12 \n13     // System.out.println(innerLooping); 此变量在这里无法使用\n\
  14     // System.out.println(outerLooping); 此变量在这里无法使用\n15 }\n```\n\n在这里，`outerLooping`\
  \ 变量在外层 `for` 循环和内层 `for` 循环中声明并可访问，但在两个循环之外不可。\n\n`innerLooping` 变量仅在内层 `for` 循环内部声明并可用。\n\
  \nJava 语句中的另一个特殊情况是不使用花括号。例如：\n\n```\n1 for (int i = 0; i < 10; i++)\n2     if (i\
  \ > 5)\n3         System.out.println(i);\n```\n\n\n\n### 2.6.2 局部变量初始化\n\n如果你在声明局部变量时不对其进行初始化，代码将无法编译。局部变量不会赋予默认值，因此如果它们没有被初始化，就无法使用。\n\
  \n如果你尝试像这样使用一个未初始化的局部变量：\n\n```\n1 int moeAge;\n2 System.out.println(moeAge);\n\
  ```\n\nJVM 将生成如下编译错误：\n\n`moeAge` 可能未被初始化\n\n有一个特殊情况需要注意。如果你在 `if` 语句中使用显式的 `true`\
  \ 条件，变量将被 JVM 视为已初始化。因此，以下代码可以编译：\n\n```\n1 int been;\n2 if (true) {\n3       beerCount\
  \ = 0;\n4 }\n```\n\n这段代码同样有效：\n\n```\n1 int been;\n2 if (1 == 1) {\n3       beerCount\
  \ = 0;\n4 }\n```\n\n如果你在 `if` 条件中使用 `boolean` 变量将会得到编译错误，因为 JVM 无法预测该变量是 `true`\
  \ 还是 `false`，因此 `beerCount` 变量可能未被初始化：\n\n```\n1 int been;\n2 boolean test = true;\n\
  3 if (test) { // JVM 无法预测 been 是否已初始化\n4       beerCount = 0;\n5 }\n```\n\n如果我们尝试运行上面的程序将会得到以下编译信息：\n\
  \n`beerCount` 可能未被初始化\n\n此代码的解决方案是使用 `else` 子句来确保变量在所有情况下都初始化。以下代码可以正常编译：\n\n```\n\
  1 int been;\n2 boolean test = true;\n3 if (test) {\n4       beerCount = 0;\n5 }\
  \ else {\n6       beerCount = 1;\n7 }\n8\n // 这将打印 0\n```\n\n### 注意事项\n\n- 局部变量只能在代码块中使用。\n\
  - Java 中的局部变量必须始终初始化。\n- 如果局部变量没有初始化，将产生编译错误。\n\n## 2.7 糖价格挑战\n\n软件工程师经常处理算法，许多公司会在面试中要求申请者解决算法。能够分析情况并用代码解决问题是一项关键技能，你应该不断练习这一点。\n\
  \n在现实项目中，这始终是你应该尝试的首要工作。为了深入理解你正在处理的问题和系统，你应该与他人交流，提出问题，做笔记——保持好奇。随后，你将获得关于项目的知识。\n\
  \n话虽如此，让我们来看这个算法！\n\n糖果公司的老板有一笔资金要花费，他们希望用这笔钱购买尽可能多的糖果。假设每种物品只有一个。\n\n你的目标是计算老板用可用资金可以购买的最大糖果数量。\n\
  \n让我们先考虑一个简单的例子。如果老板有 10 元，糖果的价格为 `[5, 2, 1, 3, 4]`，数组首先必须进行排序：`[1, 2, 3, 4, 5]`。然后我们需要遍历该数组的元素，并验证资金何时被完全使用。如果我们计算可以购买的糖果数量，这个测试用例会有\
  \ 4 个项目（1+2+3+4=10）。\n\n本章没有介绍数组排序，但现在你可以使用冒泡排序，这是排序数组最简单的方法之一。\n\n根据所需的价格创建 `candyPrices`\
  \ 变量，然后使用以下代码对你的数组进行排序：\n\n```\n 1 int lengthOfPrices = candyPrices.length; \n 2\
  \ for (int i = 0; i < lengthOfPrices-1; i++) \n 3     for (int j = 0; j < lengthOfPrices\
  \ - i-1; j++) \n 4         if (candyPrices[j] > candyPrices[j+1]) { \n 5       \
  \      int temp = candyPrices[j]; \n 6             candyPrices[j] = candyPrices[j+1];\
  \ \n 7             candyPrices[j+1] = temp; \n 8         } \n 9     }\n10 }\n```\n\
  \n一旦数组排序完成，你可以打印老板可用资金可以购买的最大糖果数量信息。\n\n## 2.8 总结\n\n- 你学习了 Java 中不同的基本类型、它们可以存储什么类型的值以及如何命名它们。\n\
  - 学习了如何给变量赋值以及如何增减值。\n- 引入了 Java 中提供的不同流控制选项，如 `if` 语句、三元运算符和 `switch` 分支。\n- 学习了如何使用逻辑运算符比较条件和布尔变量以简化代码。\n\
  - 循环的核心类型有 `for`、`while`、`do while` 和 `for-each`。\n- 学习了多值变量（也称为数组），你了解到不需要多个变量来处理多个值。\n\
  - 学习了声明、遍历和操作二维数组。\n- 讨论了局部变量的限制条件，包括变量作用域、在哪里声明它们以及何时初始化它们。\n\n通过应用本章的概念，你能够解决具有一定难度的算法。\n\
  \n恭喜你完成了 Java 挑战赛的第一章！你正朝着成为更好的程序员的道路前进，并学习如何分析和改进代码。\n\n# 3 基础面向对象编程（复习）\n\n**本章涵盖**：\n\
  \n- 类的创建、命名和实例化\n- 创建和使用类方法，以及操作实例变量\n- 使用 `this` 关键字访问实例属性和方法\n- 理解如何灵活地使用构造函数\n\
  - 操作对象引用\n- 处理数组\n- 总共 5 个 Java 挑战\n\n在面向对象编程出现之前是过程式范式，它使得代码复用非常困难。在过程式范式中，代码很容易分散在整个系统中，因此难以维护。例如，每当需要验证某种类型的\
  \ ID 时，开发者都必须调用同一个函数来执行此操作。该函数的任何更改都需要对代码库的多个部分进行修改。开发者还编写编写文档以确保函数被正确使用。\n\n为了解决这些问题，创建了面向对象范式。该范式的主要目标是尽量减少软件代码与现实世界之间的差异，以便以更简洁的方式解决业务问题。通过面向对象，我们可以更好地表达现实世界问题中的实体和行为，使代码更容易复用。\n\
  \n\n\n为了更清晰地区分过程式编程和面向对象编程这两种范式，让我们来分析描述它们的图表。\n\n我们首先分析一下在使用过程式范式时，组织代码有多困难：\n\n\
  ![](img/basic_oo_procedural_diagram.png)\n\n现在，让我们分析一下理解不同对象之间的通信比只理解函数要容易得多：\n\n\
  ![](img/basic_oo_object_diagram.png)\n\n同样重要的是要强调，即使在使用像 `Java` 这样使用这种范式的语言时，也可能写出没有充分利用面向对象优势的代码。充分理解面向对象的原则至关重要，这样我们才能开发出灵活的代码，充分利用核心概念和工具的威力。\n\
  \n在本章中，我们将探索最基础的概念以及为什么它们在现实世界的应用中如此重要。\n\n## 3.1 类\n\n在面向对象编程范式中，类（class）是抽象和组织现实世界某些元素的方式：例如计算机、游戏、人、动物、角色、折扣、支付、房屋、船、城市等。你能发现所有这些多样化项目之间的相似之处吗？没错，它们都是名词——人、地点或物。为了在项目中（至少对于简单系统而言）产生意义，类应该从现实世界存在的某个中抽象出来。\n\
  \n检查此点的简单方法是验证类名是否为名词。不应该使用带有动作名称（动词）的类，例如 `PerformAction`。\n\n从现实世界中抽象元素以创建在你所工作的项目中具有意义的类，并不是一项易事。你需要分析你想要解决的问题中哪些是名词，并将这些信息浓缩成在你想要开发的解决方案中具有意义的类。\n\
  \n你也可以把类比比创建特定对象的蓝图或工厂。例如，如果你创建了一个名为 `Car`（汽车）的类，你将能够创建一个具有自身特征的特定汽车。\n\n以下是 `Java`\
  \ 中类声明的一些示例：\n\n```\n1 class Car { }\n2 class Animal { }\n3 class Discount { }\n\
  ```\n\n正如这些示例所示，我们可以创建一个 `car`、一个 `animal` 甚至一个 `discount`。\n\n一个类包含带有变量的状态以及行为（或称为动作）。例如，一个\
  \ `Car` 类可能会定义如 `maximumSpeed`（最高速度）、`color`（颜色）、`brandName`（品牌名称）等变量，以及 `accelerate`（加速）和\
  \ `brake`（刹车）等动作。你还可以创建一个名为 `Calculator`（计算器）的类，具有对数字执行不同操作（加、减、乘等）并打印结果的动作。\n\n\
  既然我们知道类是一个蓝图，在本章的剩余部分，我们将探索如何使用这个蓝图来让事情发生。\n\n### 3.1.1 类的命名\n\n命名是我们作为软件开发人员必须培养的关键技能。有时定义一个名称是很困难的。我们必须先抽象正在处理的概念，并确保我们理解自己试图用它们做什么，这可能需要大量的精力。\n\
  \n在上一章中，我提到 `Java` 开发者应该遵循 `JavaBeans` 约定来命名代码的不同元素。对于类的命名，约定是使用 `PascalCase`（大驼命名法）模式，这意味着类名的每个单词都用大字母开头。\n\
  \n示例类名包括 `Account`、`Discount`、`Person`、`CustomerAddress`、`BillingAddress` 和 `PaymentService`。\n\
  \n### 3.1.2 类的实例化\n\n类实例（instance）是类蓝图的一个活副本，能够拥有自己的状态和一组动作。这些实例也被称为对象（objects）。\n\
  \n例如，我们可以创建 `Person` 类的不同实例，并赋予它们特定的名称和行为。我们可以指定 `Person` 类的一个实例名为 `\"James Gosling\"\
  `，`birthDate` 为 1955 年 5 月 19 日，然后我们可以创建另一个 `Person` 实例，其名为 `\"Robert Cecil Martin\"\
  `，`birthDate` 为 1952 年 12 月 5 日。\n\n要创建或实例化 `Person` 类的对象，我们需要执行以下操作：\n\n```\n1\
  \ Person jamesGosling = new Person();\n2 Person robertCecil = new Person();\n```\n\
  \n图 3.1 展示了这种从其提供的蓝图中创建类的活副本的概念。\n\n![](img/class_instance_person_diagram.png)\n\
  \n`jamesGosling` 和 `robertCecil` 实例是 `Person` 类的独立副本，具有不同的名称和行为。\n\n同样，如果我们有一个 `Car`\
  \ 类，我们可以创建一个代表 `Porsche 911` 的实例，最高速度为每小时 `227` 英里，以及另一个代表 `Ferrari SF90 Stradale`\
  \ 的实例，最高速度为每小时 `212` 英里。一旦我们创建了这些实例，就可以孤立地操作它们中的每一个。`Porsche` 和 `Ferrari` 可以执行不同的动作而不互相影响。\n\
  \n要创建这些 `Car` 实例，`Java` 语法如下：\n\n```\n1 Car porsche = new Car();\n2 Car ferrari\
  \ = new Car();\n```\n\n图 3.2 展示了这种将 `Car` 类作为创建具有不同属性值的实例的工厂的概念。\n\n![](img/class_instance_car_diagram_.png)\n\
  \n图 3.2 `porsche` 和 `ferrari` 是 `Car` 类的实例。\n\n以下是一个小但完整的代码示例，我们在其中实例化一个 `Java`\
  \ 对象：\n\n```\n1 class Car {\n2 \n     public static void main(String[] args) {\n\
  4         Car = new =();\n5 }\n```\n\n### 3.1.3 类属性\n\n现在你知道了什么是实例，是时候探索属性（attributes）了。在\
  \ `Animal` 实例示例中，我提到了如类型和和属性。让我们来实现这个想法。下面的示例定义了 `Animal` 类，它有两个属性：`breed` 和 `emittedSound`。我们可以实例化该类的两个实例，`cat`\
  \ 和 `dog`，并为它们指定属性：\n\n```\n1 class Animal {\n2     String breed;\n3     String\
  \ emittedSound;\n4 \n5     public static void main(String [] args) {\n6        \
  \ Animal dog = new Animal();\n7         dog.breed = \"Husky\";\n8         dog.emittedSound\
  \ = \"woof\";\n9         \n10         System.out.println(dog.breed);\n11       \
  \  System.out.println(dog.emittedSound);\n12         \n13         Animal cat = new\
  \ Animal();\n14         cat.breed = \"Persian\";\n15         cat.emittedSound =\
  \ \"meow\";\n16         \n17         System.out.println(cat.breed);\n18        \
  \ System.out.println(cat.emittedSound);\n19     }\n20 }\n```\n\n`Animal` 类 main\
  \ 方法的输出是：\n\n```\n1 Husky\n2 woof\n3 Persian\n4 meow\n```\n\n### 3.1.4 默认值\n\n当你在\
  \ `Java` 类中声明一个属性而不赋值时会发生什么？在这种情况下，`JVM` 会自动将其初始化为默认值。\n\n表 3.1 列出了 `Java` 原始类型和对象类型的默认值。\n\
  \n| 类型 | 默认值 |\n| --- | --- |\n| boolean | false |\n| byte, short, int, long | 0\
  \ |\n| float, double | 0.0 |\n| char | '\\u0000' |\n| 引用类型（对象引用） | null |\n\n重要的是，这些默认值仅分配给在类级别或实例级别（在类内部、方法外部）的变量。正如你在第\
  \ 2 章记得的，未在类级别的局部变量（例如在方法内部定义的变量）必须在创建时手动初始化。\n\n让我们在实践中看看它是如何运作的：\n\n\n\n\n```\n\
  \ 1 public class DefaultAttributeValues {\n 2 \n3     boolean isHomerThin;\n 4 \
  \    int homerGrade;\n 5     double nedFlandersBeerCount;\n 6     char maggieWords;\n\
  \ 7     String margeSenseOfHumor;\n 8 \n9     public static void main(String[] defaultAttributesValues)\
  \ {\n10         DefaultAttributeValues values = new DefaultAttributeValues();\n\
  11         System.out.println(values.isHomerThin);          //#1\n12         System.out.println(values.homerGrade);\
  \           //#2\n13         System.out.println(values.nedFlandersBeerCount); //#3\n\
  14         System.out.println(values.maggieWords);          //#4\n15         System.out.println(values.margeSenseOfHumor);\
  \    //#5\n16     }\n17 }\n``````\n\n* #1 输出 false\n* #2 输出 0\n* #3 输出 0.0\n* #4\
  \ 输出 `\\u0000`\n* #5 输出 null\n\n了解 Java 中默认值的工作原理非常重要，因为我们一直都在处理变量。\n\n以错误方式传递数据是\
  \ bug 的常见原因。了解在你不手动赋值时系统会分配默认值，这在你开发代码、修复 bug 或添加新功能时将产生巨大差异，帮助你优化代码设计。\n\n## 3.2\
  \ 方法\n\n在面向对象的编程范式中，方法是类或实例的动作或行为。在 Java 中，方法必须声明其返回值的数据类型（我们将在本节稍后的部分进一步探讨这一概念）。如果它不返回值——例如，方法只是执行一个操作——则必须声明为\
  \ `void`。\n\n让我们看看 Java 代码中狗是如何发出声音的。`emitSound` 方法不返回值（它只是打印“woof”），因此我们用 `void`\
  \ 关键字来声明它：\n\n```\n 1 class AnimalMethodInvocation {\n 2 \n3         String emittedSound;\
  \            //#1\n 4 \n5         void emitSound() {              //#2\n 6     \
  \        System.out.println(emittedSound);\n 7         }\n 8 \n9         public\
  \ static void main(String[] args) {\n10             AnimalMethodInvocation dog =\
  \ new AnimalMethodInvocation();\n11             dog.emittedSound = \"woof\";  //#3\n\
  12             dog.emitSound();            //#4\n13         }\n 14 \n15 }\n``````\n\
  \n* #1 实例变量声明\n* #2 `emitSound` 方法声明\n* #3 将值“woof”赋值给实例变量 `emittedSound`\n* #4\
  \ 从 `dog` 实例调用 `emitSound` 方法\n\n### 3.2.1 向方法传递参数\n\n参数是一个可以从方法外部传入的变量，它的生命周期在方法内部开始并结束。根据你正在开发的逻辑，创建参数通常比直接操作实例变量更有意义。\n\
  \n为了阐明这一概念，让我们考虑一个示例，我们将消息作为参数传递并在方法中打印它：\n\n```\n 1 class MessageParameter {\n\
  \ 2 \n3     void print(String message) {                                    //#1\n\
  \ 4         System.out.println(message);                                //#2\n 5\
  \     }\n 6 \n7     public static void main(String[] args) {\n8         MessageParameter\
  \ messageParameter = new MessageParameter(); //#4\n9         messageParameter.print(\"\
  You are a Java Challenger\");        //#5\n10     }\n 11 \n12 }\n``````\n\n* #1\
  \ 声明带有 `message` 参数的 `print` 方法。\n* #2 打印 `message` 参数。\n* #3 创建 `MessageParameter`\
  \ 实例并赋值给变量 `messageParameter`。\n* #4 从 `messageParameter` 实例变量调用 `print` 方法，传递参数值“You\
  \ are a Java Challenger”。\n\n当执行 `print` 方法时，控制台将打印出“You are a Java Challenger”。\n\
  \n### 3.2.2 返回基本类型\n\n你通常希望从方法返回值，以便在另一个方法过程中使用方法调用的结果。当你想要从代码逻辑返回一个值时，可以在方法中进行声明。你在方法声明中指定方法的返回类型，并在方法体中使用\
  \ `return` 语句返回该值。例如，以下代码演示了如何从加法操作返回一个 `int` 值：\n\n```\n 1 class CalculatorSum\
  \ {\n 2     int sum(int number1, int number2) {                 //#1\n 3       \
  \  return number1 + number2;                       //#2\n 4     }\n 5 \n6     public\
  \ static void main(String[] args) {\n7         CalculatorSum calculator = new CalculatorSum();\
  \ //#3\n8         int sumResult = calculator.sum(2, 2);           //#4\n9      \
  \   System.out.println(sumResult);                  //#5\n10     }\n11 }\n``````\n\
  \n* #1 声明带有两个参数 `number1` 和 `number2` 的 `sum` 方法，并指定它将返回 `int` 基本类型。\n* #2 返回 `number1`\
  \ 和 `number2` 变量的和。\n* #3 实例化 `CalculatorSum` 实例并赋值给变量 `calculator`。\n* #4 从 `calculator`\
  \ 实例调用 `sum(2, 2)` 方法。\n* #5 打印 `sumResult` 变量。\n\n\n\n\nJava 中的 `this` 关键字提供了一种引用当前实例的方法，使我们可以访问它的状态（属性）或行为（方法）。在下面的示例中，我们通过调用\
  \ `setupCar` 方法，有效地将值 `\"Lamborghini\"` 赋值给品牌实例变量，并将 `\"black\"` 赋值给颜色实例变量。`this`\
  \ 关键字告诉 JVM 正在正在访问一个实例变量，尽管在这种情况下，由于没有声明与同名的局部变量（我们将在 3.3.1 节中考虑该场景），使用 `this` 是可选的：\n\
  \n```\n 1 class Car {\n 2 \n 3     String brand; // #1\n 4     String color; //\
  \ #1 \n 5 \n 6     void setupCar() { \n 7         this.brand = \"Lamborghini\";\
  \ // #2\n 8         color = \"black\";            // #3\n 9     }\n10     \n11 \
  \    public static void main(String[] args) {\n12         Car car = new Car();\n\
  13         car.setupCar();\n14         System.out.println(car.brand); // #4\n15\
  \         System.out.println(car.color); // #5\n16     }\n17 \n18 }\n```\n\n* #1\
  \ `brand` 和 `color` 被声明为实例变量。\n* #2 通过使用关键字 `this`，我们正在访问一个实例变量。\n* #3 在这种情况下使用关键字\
  \ `this` 是可选的，因为没有名为 `color` 的局部变量；无论如何，值 `\"black\"` 都将被赋值给实例变量。\n* #4 输出 `\"Lamborghini\"\
  `。\n* #5 输出 `\"black\"`。\n\n也可以使用 `this` 关键字调用实例方法：\n\n```\n 1 public class InvokingMethod\
  \ {\n 2 \n 3     public static void main(String[] args) {\n 4         InvokingMethod\
  \ invokingMethod = new InvokingMethod();\n 5         invokingMethod.accelerate();\
  \ \n 6     }\n 7 \n 8     void accelerate() {\n 9         System.out.println(\"\
  Accelerate!\"); // #1\n10         this.turnLeft();                   // #2\n11 \
  \    }\n12 \n13     void turnLeft() {\n14         System.out.println(\"Turn left\"\
  );   // #3\n15     }\n16 }\n```\n\n* #1 这输出 `\"Accelerate!\"`。\n* #2 调用 `turnLeft`\
  \ 方法。\n* #3 这输出 `\"Turn left\"`。\n\n如示例所示，你可以从另一个方法调用实例方法。请注意，你总是需要实例化类来调用实例方法。同样请注意，在调用实例方法时使用关键字\
  \ `this` 是可选的：你可以使用它，也可以不使用。\n\n### 3.3.1 局部变量与实例变量\n\n`this` 关键字的一个常见用途是区分同名的实例变量和局部变量，以便明确我们想要访问的是哪一个。在下面的示例中，我们探索了如果在这种情况下我们不使用\
  \ `this` 会发生什么。\n\n在这里，`color` 变量既被声明为 `Car` 类的属性，也被声明为 `changeColor` 方法中的局部变量。由于我们在此赋值时没有使用关键字\
  \ `this`，这里的效果是将局部变量的值赋值给自己。这种操作是没有意义的，因为局部变量在声明它的方法内部生存并销毁：\n\n```\n 1 public class\
  \ Car {\n 2 \n 3     String color = \"\";                 // #1\n 4 \n 5     void\
  \ changeColor(String color) {   // #2\n 6         color = color;               \
  \  // #3\n 7     }\n 8 \n 9     public static void main(String[] args) {\n10   \
  \      Car car = new Car();           // #4\n11         car.changeColor(\"black\"\
  );      // #5\n12         System.out.println(car.color); // #6\n13     }\n14 }\n\
  ```\n\n* #1 用空字符串 `\"\"` 初始化实例变量 `color`。\n* #2 此参数是一个局部变量。\n* #3 参数值将被赋值给局部变量并丢失，因为我们处理的是在\
  \ `changeColor` 方法执行完毕后就会销毁的局部变量。\n* #4 创建 `Car` 的实例。\n* #5 调用 `changeColor` 方法并传递参数\
  \ `\"black\"`（此值将丢失）。\n* #6 这将输出 `\"\"`。\n\n通过使用关键字 `this`，我们可以表明在 `changeColor`\
  \ 方法内部我们想要访问实例变量 `color` 而不是局部变量，从而避免混淆。调用以下方法会将 `Car` 实例的 `color` 变量值改为 `\"black\"\
  `：\n\n```\n 1 public class Car {\n 2 \n 3     String color;                    \
  \  // #1\n 4 \n 5     void changeColor(String color) {   // #2\n 6         this.color\
  \ = color;            // #3\n 7     }\n 8 \n 9     public static void main(String[]\
  \ args) {\n10         Car car = new Car();           // #4\n11         car.changeColor(\"\
  black\");      // #5\n12         System.out.println(car.color); // #6\n13     }\n\
  14 }\n```\n\n* #1 声明 `color` 为实例变量。\n* #2 此 `color` 参数是局部变量。\n* #3 `this.color =\
  \ color;` 使用实例变量。\n* #4 创建 `Car` 的实例。\n* #5 将实例变量 `color` 的值改为 `\"black\"`。\n\n\
  ## 3.4 构造方法\n\nJava 中的构造方法是一种特殊的方法，其主要职责是使用特定值创建类的对象。在下面的示例中，我们实例化一个 `Car` 对象并将\
  \ `\"Porsche\"` 和 `\"black\"` 传递给构造方法，以初始化它的属性：\n\n```\n 1 public class Car {\n\
  \ 2 \n 3     String brand;\n 4     String color;\n 5 \n 6     public Car(String\
  \ brand, String color) { // 这是构造方法\n 7         this.brand = brand;\n 8         this.color\
  \ = color;\n 9     }\n10 \n11     public static void main(String[] args) {\n12 \
  \        Car porsche = new Car(\"Porsche\", \"black\");\n13         System.out.println(porsche.brand);\
  \ // 将输出 Porsche\n14         System.out.println(porsche.color); // 将输出 black\n15\
  \     }\n16 }\n```\n\n如果你没有声明构造方法，JVM 会为你创建一个。当你实例化新对象时，总是会调用构造方法。例如，在下面的情况下：\n\n\
  ```\n1 class SimpsonCharacter {\n2 \n3     public static void main(String[] args)\
  \ {\n4         new SimpsonCharacter(); // 此实例化的 () 是构造方法\n5     }\n6 }\n```\n\n\
  JVM 将创建如下默认构造方法：\n\n```\n1 public SimpsonCharacter() { \n }\n```\n\n然而，如果你声明了自定义构造方法，JVM\
  \ 就不会自动创建。在这种情况下，因为我们创建了特定的构造方法，将没有默认构造方法：\n\n```\n1 public class SimpsonCharacter\
  \ {\n2     String name;\n3     \n4     public SimpsonCharacter(String name) { //\
  \ 构造方法\n5          this.name = name;\n6     }\n7 \n8     public static void main(String[]\
  \ args) {\n          new SimpsonCharacter(\"Homer\"); // 你需要在这里传递一个 String\n10 \
  \    }\n11     \n12 }\n```\n\n这意味着无法通过以下代码实例化 `SimpsonCharacter` 类：\n\n`new SimpsonCharacter();`\n\
  \n实例化该类的唯一方法是通过传递名称来调用自定义构造方法：\n\n`new SimpsonCharacter(\"Homer\");`\n\n\n\n\n\n\
  ```java\n 1 public class SimpsonCharacter {\n 2     String name;\n 3     \n 4  \
  \   public SimpsonCharacter() {  }\n 5 \n 6     public SimpsonCharacter(String name)\
  \ { \n 7          this.name = name;\n 8     }\n 9 \n10     public static void main(String[]\
  \ args) {\n11         new SimpsonCharacter(); // 你可以无参数实例化\n12         new SimpsonCharacter(\"\
  Homer\"); // 你也可以传递一个 String\n13     }\n 14     \n15 }\n```\n\n这里演示的概念被称为`重载`（overloading）。简单来说，这是通过为同名的构造函数或方法创建不同的版本，使其接收不同类型或数量的参数。这是后续章节将深入探讨的核心概念。\n\
  \n### 3.4.1 使用关键字 this 调用构造函数\n\n在同一个类中，也可以从一个构造函数调用另一个构造函数。这个功能非常有用，因为允许我们重用其他构造函数的代码；我们不需要重写相同的代码。\n\
  \n必须记住，你只能在构造函数的第一行调用另一个构造函数。否则，将导致编译错误。\n\n让我们探索一个可以使用该概念的常见现实项目场景。假设你希望能够实例化名为\
  \ `BatMobile` 的类，实例化方式有两种：使用你指定的两个参数 `versionName` 和 `modelYear`，或者使用带有两个常量值（“Batman\
  \ Forever”和 1995）的默认构造函数。\n\n要在构造函数中实现带参数或不带参数实例化该类的唯一方法是声明两个构造函数：\n\n```java\n\
  \ 1 public class BatMobile {\n 2 \n 3     String versionName;\n 4     int modelYear;\n\
  \ 5 \n 6     BatMobile(String versionName, int modelYear) {\n 7         this.versionName\
  \ = versionName;\n 8         this.modelYear = modelYear;\n 9     }\n10 \n11    \
  \ BatMobile() {\n12         this(\"Batman Forever\", 1995);\n13     }\n 14 \n15\
  \     public static void main(String[] batMobileRocks) {\n16         BatMobile batmanForever\
  \ = new BatMobile();\n17         batmanForever.printBatMobileDescription();    \
  \   // #1\n 18       \n19         BatMobile batmanArkhamKnight = new BatMobile(\"\
  Arkham Knight\", 2014);\n20         batmanArkhamKnight.printBatMobileDescription();\
  \  // #2\n21     }\n 22 \n23     void printBatMobileDescription() {\n24        \
  \ System.out.println(\"Version name: \" + this.versionName + \" Model year: \" +\
  \ t\\\n25 his.modelYear);\n26     }\n27 }\n```\n\n*   #1 这将打印“Version name: Batman\
  \ Forever Model year: 1995”\n*   #2 这将打印“Version name: Arkham Knight Model year:\
  \ 2014”\n\n如你所见，我们没有在 `BatMobile` 类外部传递值“Batman Forever”和 1995，而是在类内部完成的。这种实例化不需要暴露在类外部，这正是我们使用面向对象编程概念时想要实现的目标。\n\
  \n在类内部使用这种方法调用构造函数的另一个巨大优势是我们获得的灵活性；它使得我们的代码变得更容易维护。\n\n### 3.4.2 生化危机变量修改挑战\n\n\
  以下挑战探索了实例、构造函数和方法的概念。实例指针关键字 `this` 也会被用到，这是解决此问题的关键。准备好解决这个挑战了吗？尝试一下！\n\n```java\n\
  \ 1 public class ResidentEvilNameChange {\n 2 \n 3     String name = \"Nemesis\"\
  ;\n 4 \n 5     ResidentEvilNameChange(String name) {\n 6         name = name;\n\
  \ 7     }\n 8 \n 9     public static void main(String[] doYourBest) {\n10      \
  \   ResidentEvilNameChange residentEvilNameChange = new ResidentEvilNameChange(\"\
  \\\n11 Leon);\n12         System.out.println(residentEvilNameChange.name);\n 13\
  \ \n14         residentEvilNameChange.changeName(\"Claire\");\n15         System.out.println(residentEvilNameChange.name);\n\
  16     }\n 17 \n18     void changeName(String name) {\n19         this.name = this.name;\n\
