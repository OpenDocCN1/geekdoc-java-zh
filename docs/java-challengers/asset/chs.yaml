  \n| 类型 | 范围 | 默认值 | 大小 | 示例字面量 |\n| --- | --- | --- | --- | --- |\n| boolean | true\
  \ 或 false | false | 1 bit | true, false |\n| byte | -128 .. 127 | 0 | 8 bits | 1,\
