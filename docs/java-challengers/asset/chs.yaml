  \ `Integer.valueOf(2)`，我们返回的是一个包装类 `Integer`，因此将调用 `public boolean remove(Object\
  \ o)`。因此，数组中值为 `2` 的元素将被移除。\n\n因此，正确的替代方案是：\n\n4. KirkSpock\n\n    Khan;Borg;Darth\
  \ Vader\n\n    TurnAboutIntruderChallenge$1\n\n    [3, 1]\n\n## 14.12 新 switch case\
  \ 语句\n\n为了方便使用 `switch case` 语句，可以使用 Lambda 表达式来返回值。这意味着我们不再需要使用 `break` 关键字来退出\
  \ `switch` 语句。\n\n新的 `switch case` 语句最初在 Java 12 中作为预览特性引入，并在 Java 14 中成为标准。\n\n\
  让我们看看旧方法和新方法使用 `switch case` 有有多不同。\n\n```\n1 int formulaNumber = 7;\n2 String heisenbergElement\
  \ = \"\";\n3\n4 switch (formulaNumber) {\n5     case 5:\n6         heisenbergElement\
  \ += \"H\";\n7         break;\n8     case 7:\n9         heisenbergElement += \"\
  N\";\n10        break;\n11    default:\n12        heisenbergElement += \"He\";\n\
  13 }\n14\n15 System.out.println(heisenbergElement);\n```\n\n**输出**:\n\nN\n\n如上所示，这种代码很繁琐，并且需要在每个\
  \ case 中添加 `break`。我们可以通过新的 `switch` 语句实现相同的功能：\n\n```\n1 int formulaNumber = 7;\n\
  2 String heisenbergElement = \"\";\n3\n4 switch (formulaNumber) {\n5     case 5\
  \ -> heisenbergElement += \"H\";\n6     case 7 -> heisenbergElement += \"N\";\n\
  7     default -> heisenbergElement += \"He\";\n8 }\n9 System.out.println(heisenbergElement);\n\
  ```\n\n**输出**:\n\nH\n\n在 case 中使用 Lambda 可以减少大量的样板代码并使其更具可读性。注意上面的代码如果是单行的话可以这样使用。如果有多行，则必须使用\
  \ `yield` 关键字：\n\n```\n1 int elementNumber = 9;\n2 String heisenbergElement = \"\
  \";\n3\n4 var chemicalElement = switch (elementNumber) {\n5     case 7 -> {\n6 \
  \        heisenbergElement += \"N\";\n7         yield heisenbergElement;\n8    \
  \ }\n9     case 5 -> {\n10        heisenbergElement += \"H\";\n11        yield heisenbergElement;\n\
  12    }\n13    default -> {\n14        heisenbergElement += \"He\";\n15        yield\
  \ heisenbergElement;\n16    };\n17\n18 System.out.println(chemicalElement);\n```\n\
  \nHe\n\n注意上面的代码，在新的 `switch case` 语句是可以返回值的。同样注意，当 Lambda 有多行时，我们需要使用 `yield` 关键字。`yield`\
  \ 关键字将中断 `switch case` 过程并返回。在我们的情况下，值将返回给 `chemicalElement` 变量。\n\n### 14.12.1\
  \ Beer Switch Case 挑战\n\n在接下来的代码挑战中，我们将探索 Lambda 使用新的 `switch case` 语句。注意我们使用了对包装类和\
  \ `String` 的比较。话话不说说，你认为运行以下代码会发生什么？\n\n```\n1 public class BeerRescueChallenge\
  \ {\n 2\n 3   public static void main(String... beersRescue) {\n 4     Object homerBeers\
  \ = getBeers(\"Homer\");\n 5     Object carlBeers = getBeers(\"Carl\");\n 6    \
  \ Object barneyBeers = getBeers(\"Barney\");\n 7\n 8     System.out.println(\"\"\
  \ + homerBeers + carlBeers + \"\\n\" + barneyBeers);\n 9   }\n10 \n 11   static\
  \ Object getBeers(String character) {\n12     return switch (character) {\n13  \
  \     case \"Homer\" -> {\n14         System.out.print(\"Every day is a beer day.\
  \ \");\n15         yield (Integer.valueOf(129) == 129 ? 10 : 7) + \" beers for Homer.\
  \ \";\n16       }\n17       case \"Carl\" -> \"Lenny\" == new String(\"Lenny\")\
  \ ? 2 : 4 + \n18            \" beers for Carl.\";\n19       default -> new NumberFormatException(\"\
  9999 beers. Not enough beers for Barney!\\\n20 \");\n21     };\n22   }\n23 }\n```\n\
  \n1. Every day is a beer day. 10 beers for Homer. 4 beers for Carl.\n\n    java.lang.NumberFormatException:\
  \ 9999 beers. Not enough beers for Barney!\n\n2. 第 12 行出现编译错误\n\n3. Every day is\
  \ a beer day. 7 beers for Homer. 2 beers for Carl.\n\n    抛出了 java.lang.NumberFormatException\n\
  \n\n\n\n\n# 4. 第 19 行编译错误\n\n### 解释\n\n这个 Java 代码挑战的目的是帮助你熟悉新的 `switch case` 语法。第一个\
  \ `case` 语句针对“Homer”，因此将打印“Every day is a beer day. ”，紧接着打印 `Integer.valueOf(129)\
  \ == 129` 的结果。`valueOf` 方法返回一个 `new Integer()` 对象，但由于我们正在将其与基本类型 `129` 进行比较，由于这里会发生从包装类到基本类型的转换，它将返回\
  \ `true`。当我们比较基本类型时，我们比较的是值而不是对象，因此它返回 `true`。接下来，我们将打印：“10 beers for Homer.”。\n\
  \n在“Carl”的 `case` 语句中，我们对字符串“Lenny”与 `new String(\"Lenny\")` 进行了比较。请记住，当我们创建一个 `new\
  \ String()` 时，我们是在强制在内存堆中创建一个新对象。因此，“Lenny”和 `new String(\"Lenny\")` 是不同的对象。然后将打印“4\
  \ beers for Carl.”。\n\n最后，请注意 `new NumberFormatException(\"9999 beers. Not enough\
  \ beers for Barney!\")` 并没有抛出，而是被返回了。因此，`NumberFormatException` 对象的 `toString` 方法将被打印：`java.lang.NumberFormatException:\
  \ 9999 beers. Not enough beers for Barney!`。\n\n结论，正确的选项是：\n\n1. Every day is a\
  \ beer day. 10 beers for Homer. 4 beers for Carl.\n\n   `java.lang.NumberFormatException:\
  \ 9999 beers. Not enough beers for Barney!`\n\n## 14.13 Java 15 使用模式匹配类型检查\n\n为了减少样板代码，我们拥有模式匹配功能，它在在使用\
  \ `instanceof` 运算符时会隐式地转换变量类型。\n\n让我们看看以前是如何做它的：\n\n```\n1 Object simpson = \"Homer\"\
  ;\n2 \n3 if (simpson instanceof String) {\n4     String stringSimpson = (String)\
  \ simpson;\n5     System.out.println(stringSimpson.getClass());\n6 }\n```\n\n**输出**：\n\
  \nclass java.lang.String\n\n现在让我们看看如何使用模式匹配功能实现与上述代码相同：\n\n```\n1 Object simpson\
  \ = \"Homer\";\n2 \n3 if (simpson instanceof String stringSimpson) {\n4     System.out.println(stringSimpson.getClass());\n\
  5 }\n```\n\n**输出**：\n\nclass java.lang.String\n\n如你所示，模式匹配功能是一种语法糖，会隐式地进行类型转换。它也让代码更具读性。\n\
  \n### 14.13.1 在模式匹配中使用 && 和 ||\n\n在使用 `&&` 时，可以在后续条件中重用模式匹配变量。这是因为只有当第一个条件为 `true`\
  \ 时，第二个条件才会执行。因此，在以下情况中，我们始终拥有该模式匹配变量：\n\n```\n1 Object simpsonCharacter = \"Homer\"\
  ;\n2 if (simpsonCharacter instanceof String s && s.length() > 3) { }\n```\n\n另一方面，`||`\
  \ 运算符即使在第一个条件为 `false` 时也会执行第二个条件。因此，存在模式匹配变量可能被创建的情况。由于这个原因，我们会在下面的代码中遇到编译错误：\n\
  \n```\n1 Object simpsonCharacter = \"Homer\";\n2 if (simpsonCharacter instanceof\
  \ String s || s.length() > 3) { }\n```\n\n**输出**：\n\njava: cannot find symbol\n\n\
  symbol: variable s\n\n### 14.13.2 模式匹配的范围\n\n模式匹配变量范围的前提是 `if` 语句必须为 `true`。在下面的示例中，我们有一个\
  \ `if` 语句，并注意到模式变量 `s` 可以在 `if` 语句之外使用。但请记住，这仅在返回值的方法中是可能的：\n\n```\n1 static boolean\
  \ scopePatternMatchingMethodReturnsValue() {\n2   Object simpsonCharacter = \"Homer\"\
  ;\n3   if (!(simpsonCharacter instanceof String s)) {\n4     return true;\n5   }\n\
  6   return s.length() > 5; // 运行正常\n7 }\n```\n\n在 `void` 方法中，上述操作将不起：\n\n```\n1\
  \ static void scopePatternMatchingMethodDontReturnValue() {\n2   Object simpsonCharacter\
  \ = \"Homer\";\n3   if (!(simpsonCharacter instanceof String s)) {\n4     System.out.println(\"\
  Not instance of String\");\n5   }\n6   System.out.println(s); // 编译错误\n7 }\n```\n\
  \n如果编译器已经知道 `if` 语句将为 `false`，那么我们也无法像下面这样访问模式变量：\n\n```\n1 Object simpsonCharacter\
  \ = \"Homer\";\n2 if (!(simpsonCharacter instanceof String s)) {\n3   System.out.println(s);\
  \  // 编译错误\n4 }\n```\n\n由于编译器知道 `simpsonCharacter` 是一个 `String`，我们无法在 `if` 语句中使用模式变量\
  \ `s`。因此，我们将得到编译错误。\n\n### 14.13.3 武器模式匹配挑战\n\n在接下来的 Java 代码挑战中，我们将探索模式匹配功能的使用。同时，请注意在一次\
  \ `shoot` 方法调用中有一个数字是不常的。我们将探索一些关于继承和显式转换的概念。\n\n```java\n1 import java.io.Serializable;\n\
  2 \n3 class SpaceWeaponsChallenge {\n4   public static void main(String[] args)\
  \ {\n5     shoot(1);\n6   }\n7 \n8   static void shoot(Object object) {\n9     if\
  \ (object instanceof StringBuffer) {\n10      System.out.println(\"buffer\");\n\
  11    } else if (object instanceof Comparable) {\n12      System.out.println(\"\
  comparable\");\n13    } else if (object instanceof Serializable s) {\n14      System.out.println(s);\n\
  15    }\n16  }\n17 }\n```\n\n在第一次 `shoot` 调用中，我们传递了数字 `1`，并带有一个 `l` 表示它是 `long`\
  \ 类型，它**不是** `11`。但由于我们拼接了 `\"Type Phrase\"`，`long` 数字 `1` 会变成一个 `String`。`String`\
  \ 是 `Comparable` 的实例，如下：\n\n```\n1 public final class String implements java.io.Serializable,\n\
  2         Comparable<String>, Constant {\n```\n\n然而，`11 + \"Type Phrase\"` 与 `1l\
  \ + \"Type Phrase\"`，因此这里的输出是 `false`。\n\n我们传递了基本值 `true`。请记住，当我们把基本值传递给 `Object`\
  \ 时，该值会被装箱为包装类，在这种情况下是 `Boolean`，这样它就可以放入 `Object` 中。`Boolean` 类型也是 `Comparable`\
  \ 的：\n\n```\n1 public final class Boolean implements java.io.Serializable,\n2  \
  \       Comparable<Boolean>, Constant {\n```\n\n因此，由于 `true` 与 `11 + \"Type Phrase\"\
  ` 不同，我们也得到了 `false` 的输出。\n\n现在我们在 `shoot` 方法中传递了 `new StringBuffer(\"Plasma cannon\"\
  ).toString()`。注意我们正在将 `StringBuffer` 转换为 `String`。因此，`Comparable` 分支会再次执行，且 `\"\
  Plasma cannon\"` 不等于 `11 + \"Type Phrase\"`，因此我们在这里也会得到 `false` 的输出。\n\n最后，我们传递了一个\
  \ `RuntimeException` 类，正如下面的类层次结构所示，它实际上是 `Serializable` 的：\n\n```\n1 class Throwable\
  \ implements Serializable { ... }\n2 class Exception extends Throwable { ... }\n\
  3 class RuntimeException extends Exception { ... }\n```\n\n因此，`RuntimeException`\
  \ 对象的 `toString` 方法将带有 `\":serializable\"` 被打印。\n\n\n\n\n\n### 14.13.4 在 switch\
  \ case 中使用模式匹配\n\n在 Java `17` 中，有一个预览性特性（preview feature），允许我们能够在 `switch` case\
  \ 语句中使用模式匹配。预览性特性意味着该功能在未来的 Java 版本中可能会发生变化。\n\n可以使用 `switch` case 表达式来验证 `object`\
  \ 是否 `instanceof` 我们想要的类型，而且我们还可以使用模式匹配变量。\n\n```\n 1 Object anyObject = 1;\n 2\
  \ \n 3 String numberType = switch(anyObject) {\n 4     case Byte b -> b.getClass().toString();\n\
  \ 5     case Integer i -> i.getClass().toString();\n 6     case BigDecimal b ->\
  \ b.getClass().toString();\n 7     case Object o  -> o.getClass().toString();\n\
  \ 8 };\n 9 \n10 System.out.println(numberType);\n```\n\n**输出**:\n\n```\nclass java.lang.Integer\n\
  ```\n\n我们可以在不使用 lambda 表达式的情况下在 `switch` case 语句中使用模式匹配：\n\n```\n 1 Object getObjectTypeSwitchStatement()\
  \ {\n 2   Object anyObject = 1;\n 3 \n 4   switch(anyObject) {\n 5     case Byte\
  \ b: return b.getClass().toString();\n 6     case Integer i: return i.getClass().toString();\n\
  \ 7     case BigDecimal b: return b.getClass().toString();\n 8     case Object o:\
  \ return o.getClass().toString();\n 9   }\n10 }\n```\n\n**输出**:\n\n```\nclass java.lang.Integer\n\
  ```\n\n## 14.14 使用 record\n\n| 预览性特性 | 标准特性 |\n| — | — |\n| 自 Java 14 起 | 自 Java\
  \ 16 起\n\n为了减少 Java 语言中的样板代码（boilerplate-plate），引入了 `record` 特性。简单来说，通过创建一个 `record`，我们拥有了一个不可变的数据对象，并且免费实现了\
  \ `constructor`、`getters`、`toString()`、`equals` 和 `hashCode`。\n\n`record` 特性在 Java\
  \ `14` 中引入，并在 Java `16` 中成为标准特性。\n\n让我们在实践中看看不使用 `record` 创建数据对象，然后使用 `record` 的对比：\n\
  \n```\n 1 class CarWithoutRecord {\n 2 \n 3   private String brand;\n 4   private\
  \ String model;\n 5   private int year;\n 6 \n 7   public CarWithoutRecord(String\
  \ brand, String model, int year) {\n 8     this.brand = brand;\n 9     this.model\
  \ = model;\n10     this.year = year;\n11   }\n12 \n13   public String getBrand()\
  \ {\n14     return brand;\n15   }\n16 \n17   public String getModel() {\n18    \
  \ return model;\n19   }\n20 \n21   public int getYear() {\n22     return year;\n\
  23   }\n24 \n25   @Override\n26   public boolean equals(Object o) {\n27     if (this\
  \ == o) return true;\n28     if (o == null || getClass() != o.getClass()) return\
  \ false;\n29     CarWithoutRecord car = (CarWithoutRecord) o;\n30     return year\
  \ == car.year && Objects.equals(brand, car.brand) && Objects.equals(model, car.model);\n\
  31   }\n33 \n34   @Override\n35   public int hashCode() {\n36     return Objects.hash(brand,\
  \ model, year);\n37   }\n38 \n39   @Override\n40   public String toString() {\n\
  41     return \"CarWithoutRecord[\" +\n42             \"brand='\" + brand + '\\\
  '' +\n43             \", model='\" + model + '\\'' +\n44             \", year=\"\
  \ + year +\n45             ']';\n46   }\n47 }\n48 \n49 CarWithoutRecord carWithoutRecord\
  \ = new CarWithoutRecord(\"Lamborghini\", \"Aventador\", 2022);\n50 System.out.println(carWithoutRecord.getBrand());\n\
  51 System.out.println(carWithoutRecord);\n```\n\n**输出**:\n\n```\nLamborghini\nCarWithoutRecord[brand='Lamborghini',\
  \ model='Aventador', year=2022]\n```\n\n你可以看到，上面的代码中有大量的代码。现在让我们看看使用 `record` 实现相同的功能：\n\
  \n```\n1 record CarRecord(String name, String brand, int year) { }\n2 \n3 CarRecord\
  \ carRecord = new CarRecord(\"Ferrari\", \"Portofino\", 2022);\n4 System.out.println(carRecord.brand());\n\
  5 System.out.println(carRecord);\n```\n\n**输出**:\n\n```\nFerrari\nCarRecord[brand=Ferrari,\
  \ model=Portofino, year=2022]\n```\n\n如你所见，我们将 46 行代码减少到了 1 行，这是一个巨大的差异。另一个重要的区别是\
  \ `record` 的 `getters` 没有 `get` 前缀，我们只需要像下面的示例那样直接使用变量名：`brand()`。\n\n### 14.14.1\
  \ 使用紧凑构造函数验证数据\n\n使用 `records` 使用构造函数有不同的方法。我们可以通过紧凑构造函数（compact constructor）来验证数据。让我们看看在实践中它是如何工作的：\n\
  \n```\n1 record Car(String brand, String model) {\n2   Car {\n3     if (brand ==\
  \ null || model == null)\n 4       throw new NullPointerException(\"brand and model\
  \ cannot be null\");\n5   }\n6 }\n7 Car car = new Car(\"Ferrari\", null);\n```\n\
  \n**输出**:\n\n```\njava.lang.NullPointerException: brand and model cannot be null\n\
  ```\n\n**分析**:\n\n- **A**: 注意紧凑构造函数在赋值之后执行。\n- **B**: 如果 `brand` 或 `model` 为 `null`，则会抛出\
  \ `NullPointerException`。\n\n### 14.14.2 record 的可能性\n\n为了总结 `record` 可以做什么，让我们分析以下列表。`record`\
  \ 可以：\n\n- 实现接口\n- 使用泛型\n- 使用紧凑构造函数\n- 重载构造函数\n- 使用静态方法\n- 使用静态变量\n- 重写 `toString()`、`equals`\
  \ 和 `hashCode`\n- 内部类定义\n- 作为内部类使用\n\n### 14.14.3 record 的局限性\n\n注意 `record` 创建的是不可变对象，这意味着一旦对象创建就无法更改。这与普通数据类不同，普通类可以创建\
  \ `getters` 和 `setters`。\n\n`record` 在底层是一个 `final` 类，继承自 `java.lang.Record`：\n\n\
  ```\n1 package java.lang;\n2 \n3 abstract class Record {\n4 \n5     protected Record()\
  \ {}\n6 \n7     @Override\n8     public abstract boolean equals(Object obj);\n9\
  \ \n10    @Override\n11    public abstract int hashCode();\n12 \n13    @Override\n\
  14    public abstract String toString();\n15 }\n```\n\n它不能：\n\n- 继承另一个类\n- 实例变量\n\
  - 使用 `abstract` 关键字\n\n### 14.14.4 Star Trek 挑战\n\n在下面的代码挑战中，我们探索 `record` 的可能性以及\
  \ Java 语言的重要原则。因此，通过运行以下代码，你认为会发生什么？\n\n```\n1 import java.io.Serializable;\n2 \n\
  3 public class CommanderRecord {\n4 \n5   record Commander<T>(T ship, String name,\
  \ String planet) {\n6     public Commander {\n7       if (!(ship instanceof Serializable))\n\
  8         throw new RuntimeException();\n9     }\n10    \n11    public String name()\
  \ {\n12      return \"Worf\";\n13    }\n14    public boolean equals(Object obj)\
  \ {\n15      return (obj instanceof Commander commander) && \n16               (commander.name.equals(this.name));\n\
  17    }\n18  }\n19 \n20  public static void main(String[] args) {\n21     Commander<String>\
  \ commander = new Commander<>(\"V-ger\", \"Spock\", \"Vulcan\");\n22 \n23     record\
  \ NewString(String ship) implements Serializable { }\n24 \n25     System.out.println(commander.name());\n\
  26     System.out.println(commander.equals(new Commander<>(new NewString(\"V-ger\"\
  )      \\\n27                                                  , \"Spock\", \"Kronos\"\
  )));\n28   }\n29 }\n```\n\n1. `Worf`, `true`\n2. `Spock`, 会抛出 `java.lang.RuntimeException`\n\
  3. 第 5 行无法编译\n4. `Worf`, `false`\n\n\n\n\n在这个代码挑战中，有许多需要注意的点。第一个点是我们将 `Commander`\
  \ 记录（record）作为内部类。我们还为 `ship` 变量使用了泛型类型 `<T>`。\n\n然后我们使用紧凑构造函数，并验证 `ship` 变量是否是\
  \ `Serializable` 的实例。\n\n接着，我们重写了 `name()` 和 `equals()` 方法。\n\n在 `main` 方法中，我们通过传递字符串\
  \ `\"V-ger\", \"Spock\", \"Vulcan\"` 实例化了 `Commander` 记录。\n\n接着，我们创建了另一个内部记录 `record\
  \ NewString`，并注意我们实现了 `Serializable`。\n\n然后，我们打印来自 `commander.name()` 的值，记得我们已将此值重写为“Worf”，因此，将打印“Worf”。\n\
  \n最后，我们使用重写的 `equals` 方法对 `commander` 和一个 `new Commander` 进行比较。请注意，我们传递了创建的 `NewString`\
  \ 记录，这是完全没问题的，因为 `Commander` 的第一个参数接收的是泛型类型。`NewString` 也是 `Serializable` 的，这意味着不会抛出\
  \ `RuntimeException`。\n\n不过，`equals` 方法中有一个技巧，请注意我们在比较时没有使用 `name()` 方法。相反，我们使用的是\
  \ `name` 变量。因此，由于传递的名称也是“Spock”，`equals` 方法的结果将是 `true`。另一个细节是，我们在 `instanceof`\
  \ 操作中使用了模式匹配的概念。\n\n结论是，正确的选项是：\n\n1. Worf\n2. true\n\n## 14.15 Java 15 密封类 (Sealed\
  \ classes)\n\n密封类（Sealed classes）是一个帮助开发人员进行代码设计的概念。简单来说，它是限制类或接口继承的一种方式。这样，只有我们指定的类才能继承密封类或接口。\n\
  \n例如，如果我们有一个 `Aircraft` 类，只想让 `Airplane` 和 `Helicopter` 继承 `Aircraft`。这非常有用，因为如果另一个开发者创建了一个名为\
  \ `Jet` 的类，而该类本不应该继承 `Aircraft`，这在代码中将一而可见。\n\n让我们来看一个实际示例，其中 `Aircraft` 是密封类，仅允许\
  \ `Airplane` 和 `Helicopter` 扩展：\n\n```\n1 sealed class Aircraft permits Airplane,\
  \ Helicopter { }\n2 \n3 final class Airplane extends Aircraft { }\n4 \n5 non-sealed\
  \ class Helicopter extends Aircraft { }\n```\n\n在上面的代码中有几点需要注意：\n\n1. 只有密封类可以允许其他类扩展它。\n\
  2. 每一个继承密封类的类必须是 `final`、`sealed` 或 `non-sealed`。否则，代码将无法编译。\n\n### 14.15.1 扩展非密封类\n\
  \n在 `Java` 中 `final` 类不能被扩展，但另一方面，`non-sealed` 类可以：\n\n```\n1 sealed class Aircraft\
  \ permits Airplane, Helicopter { }\n2 \n3 non-sealed class Helicopter extends Aircraft\
  \ { }\n4 \n5 final class BellAH1Cobra extends Helicopter { }\n```\n\n### 14.15.2\
  \ 密封类的局限性\n\n`sealed` 类只有配合 `permits` 子句才有意义。因此，如果我们在声明 `sealed` 类时不使用它，代码将无法编译：\n\
  \n```\n1 sealed class Car { } // 编译错误\n```\n\n**输出**:\nSealed class must have subclasses\
  \ (密封类必须有子类)\n\n`sealed` 类不能被普通类扩展。以下代码无法编译：\n\n```\n1 sealed class Car permits\
  \ Ferrari { } // 编译错误\n2           \n3 class Ferrari extends Car { } // 编译错误\n```\n\
  \n**输出**:\nAll sealed class subclasses must either be final, sealed or non-sealed\
  \ (所有密封类的子类必须是 final、sealed 或 non-sealed)\n\n我们不能在密封类或密封接口中使用匿名内部类。让我们看看尝试对上述密封类\
  \ `Car` 使用它时会发生什么：\n\n```\n1 new Car() { }; // 编译错误\n```\n\n**输出**:\nAnonymous classes\
  \ must not extend sealed classes (匿名类不能扩展密封类)\n\n### 14.15.3 密封类与模块\n\n被许可的子类必须与密封类属于同一个模块中。否则，代码将无法编译。\n\
  \n### 14.15.4 密封接口\n\n就像我们可以拥有 `sealed` 类一样，也可以拥有 `sealed` 接口，规则是相同的：\n\n```\n1\
  \ sealed interface Car permits Ferrari, Porsche { }\n2 \n3 non-sealed class Ferrari\
  \ implements Car { }\n4 \n5 final class Porsche implements Car { }\n```\n\n### 14.15.5\
  \ 配合 record 使用密封\n\n为了将我们接口的使用限制到 `record`，我们可以使用以下代码：\n\n```\n1 sealed interface\
  \ Car permits Ferrari { }\n2 \n3 record Ferrari() implements Car {}\n```\n\n注意 `record`\
  \ 隐式地是一个 `final` 类。因此，没有必要显式声明它。由于 `record` 是隐式 `final` 的，它也不能是 `sealed` 的或扩展另一个类：\n\
  \n```\n1 sealed class Car permits Ferrari { }\n2 \n3 record Ferrari() extends Car\
  \ { } // 编译错误，final 不能扩展\n```\n\n### 14.15.6 密封类的反射方法\n\n可以通过 `Java` 的反射（reflection）API\
  \ 来判断一个类是否是 `sealed` 的。反射用于从代码中收集元数据，例如，知道一个类是否具有注解、是否具有 `private` 字段、是否是 `enum`，或继承了某个父类。\n\
  \n在 `Java` 17 中，我们还可以通过以下方式验证一个类是否是密封的：\n\n```\n1 System.out.println(Car.class.isSealed());\n\
  2 System.out.println(Car.class.PermittedSubclasses());\n```\n\n**输出**:\ntrue\n[Ferrari,\
  \ Porsche]\n\n### 14.15.7 密封类的模式匹配\n\n在使用密封类进行模式匹配时，不需要包含 `default` 子句。这是因为编译器知道哪些类可以继承：\n\
  \n```\n1 Car car = new Ferrari();\n2 switch (car) {\n3   case Ferrari f -> System.out.println(f.getSimpleName());\n\
  4   case Porsche p -> System.out.println(p.getSimpleName());\n5 }\n```\n\n**输出**:\n\
  Ferrari\n\n### 14.15.8 挑战\n\n下面的 Java 挑战将涵盖我们探索的许多概念：反射和匿名类。\n\n你认为运行以下代码会发生什么？\n\
  \n```\n1 public class SealedTrekChallenge {\n2 \n3   sealed interface Captain permits\
  \ Spock, Saru, Janeway {  // #A\n4     default void giveOrder() {\n5       System.out.println(\"\
  Attack!\");\n6     }\n7   }\n8   static non-sealed class Saru implements Captain\
  \ {}\n9   static class Janeway {}\n10 \n11   record Spock(String planetName) implements\
  \ Captain {     // #B\n12     public void giveOrder() { \n13       System.out.println(\"\
  Let's go to:\" + planetName); \n14     }\n15   }\n16 \n17   public static void main(String[]\
  \ args) {\n18     Captain captain = new Spock(\"Vulcan\");\n19     captain.giveOrder();\n\
  20     System.out.println(captain.getClass().getSuperclass().isSealed());\n21  \
  \   new Saru().giveOrder();\n22     new Captain() { }.giveOrder();             \
  \            // #C\n23   }\n24 }\n```\n\n1. 行 #A 和 #B 无法编译\n2. 行 #A, #B 和 #C 无法编译\n\
  3. Let’s go to:Vulcan\n    Attack!\n    Attack!\n\n**解释**:\n\n##A 处有编译错误，这是因为 `Janeway`\
  \ 既不是 `sealed`、`non-sealed` 也 `final`。因此，无法许可 `Janeway`。\n\n不过，在密封接口中拥有 `default`\
  \ 方法是可以的。\n\n`non-sealed` 类 `Saru` 可以实现 `Captain` 且没有问题。\n\n`record` `Spock` 也可以实现接口\
  \ `Captain`，正如前面提到的，`record` 是一个 `final` 类。在 `record` 中重写 `giveOrder` 方法也是可以的。\n\
  \n\n\n\n然后我们在 `Captain` 实例上使用了 `getClass` 和 `getSuperclass` 方法。但请注意，我们获取的不是 `interfaces`（接口），而是类。在接下来的用例中，`getSuperclass`\
  \ 方法实际上返回了一个 `record`。因此，如果没有编译错误，下面的代码将返回 `false`：\n\n```\nSystem.out.println(captain.getClass().getSuperclass().isSealed());\n\
  ```\n\n接着，我们在 `Saru` 上调用了 `giverOrder` 方法，该方法将打印来自 `Captain` 的 `default` 实现：\n\n\
  ```\nnew Saru().giveOrder();\n```\n\n最后，我们尝试在 `Captain` 上使用一个匿名内部类，这会导致编译错误，因为 `sealed`（受密封的）类或接口不能这样做：\n\
  \n```\nnew Captain() { }.giveOrder(); // 编译错误\n```\n\n结论是，正确的选项是：\n\nD) 第 #A 行和第\
  \ #C 行无法编译\n\n## 14.16 Java 15 文本块 (Text Blocks)\n\n文本块解决了我们在处理大型 `String` 时遇到的问题，例如通过多个\
  \ `+` 和 `\"` 拼接 `SQL` 查询，这会导致代码变得非常冗长。\n\n让我们看看 Java 以前使用 `String` 的旧方法：\n\n```\n\
  1 String customerProductSQL = \n2   \"select product.name, customer.name, address.city\
  \ \" +\n3        \"  from product \" +\n4        \"  inner join customer on customer.product_id\
  \ = product.id \" +\n5        \"  inner join address on customer.address_id = address.id\"\
  ;\n```\n\n如上面的代码所示，每一行字符串都有 `\"` 和 `+`，这使得代码难以阅读且非常冗长。现在有了文本块功能，情况变得不同。我们现在可以使用\
  \ `\"\"\"` 来存储一个大型 `String`。让我们看看如何使用文本块：\n\n```\n1 String customerProductSQL =\
  \ \"\"\"\n2     select product.name, customer.name, address.city \n3     from product\
  \ \n4     inner join customer on customer.product_id = product.id \n5     inner\
  \ join address on customer.address_id = address.id\n6 \"\"\";\n```\n\n同样，也可以使用 `\"\
  ` 或 `'` 而不需要作为字面量字符串进行转义：\n\n```\n1 String someText =  \"\"\"\n2 \"\"Some text here...\
  \ Test... Test...Some text here...'`'\"\" // 正常编译\n3 \"\"\";\n```\n\n请记住，当我们**没有**使用三个双引号（`\"\
  \"\"`）时，我们不需要转义 `\"`。这是因为编译器会将其识别为文本块的结束。为了规避这个问题，我们可以转义最后一个 `\\\"`：\n\n```\n1 String\
  \ someText =  \"\"\"\n2 \"\"\\\" Some text here... Test... Test...Some text here...\
  \ \"\"\\\"\n3 \"\"\";\n4 System.out.println(someText);\n```\n\n**输出**: “”” Some\
  \ text here… Test… Test…Some text here… “””\n\n### ### 14.16.1 语法限制\n\n有些使用文本块的方法是行不通的。例如，如果我们直接在第一个\
  \ `\"\"\"` 之后存储 `String`，代码将无法编译：\n\n```\n1 String someText = \"\"\" Big text here...\
  \ Test...  // 此处编译错误\n2     Big text here... Test... Test... Test...\n3 \"\"\";\n\
  ```\n\n无法像下面这样在单行中使用文本块：\n\n```\n1 String someText = \"\"\" Some text here... Test...\"\
  \"\"; // 此处编译错误\n```\n\n只有像下面这样才可以使用单行文本块：\n\n```\n1 String someText =  \"\"\"\n\
  2   Some text here... Test... Test...Some text here... // 正常编译\n3 \"\"\";\n```\n\
  \n### ### 14.16.2 文本块的缩进空格\n\n在文本块中声明并赋值文本时，我们不希望初始的缩进空格被视为普通空格。由于这个原因，取决于你使用文本块的方式，初始的缩进空格将被忽略。让我们通过下面的代码来看看它是工作的：\n\
  \n```\n1 String someText =  \"\"\"\n2   Some text here... Test... Test...Some text\
  \ here... \n3   Lorem Ipsum has been the industry's standard dummy text  \n4   ever\
  \ since the 1500s, when an unknown printer took a galley \n5   of type and scrambled\
  \ it to make a type specimen book.\n6   \"\"\";\n7 System.out.println(someText);\n\
  ```\n\n**输出**：\n\nSome text here… Test… Test…Some text here…\n\nLorem Ipsum has\
  \ been the industry’s standard dummy text\n\never since the 1500s, when an unknown\
  \ printer took a galley\n\nof type and scrambled it to make a type specimen book.\n\
  \n如果我们想在 `String` 文本块输出中看到空格，我们需要将 `String` 放在最后一个 `\"\"\"` 之前，如下面的示例所示：\n\n```\n\
  1 String someText =  \"\"\"\n2         Some text here... Test... Test...Some text\
  \ here... \n3         Lorem Ipsum has been the industry's standard dummy text \n\
  4         ever since the 1500s, when an unknown printer took a galley \n5      \
  \   of type and scrambled it to make a type specimen book.\n6     \"\"\";\n7 System.out.println(someText);\n\
  ```\n\n**输出**：\n\nSome text here… Test… Test…Some text here…\n\nLorem Ipsum has\
  \ been the industry’s standard dummy text\n\never since the 1500s, when an unknown\
  \ printer took a galley\n\n### ### 14.16.3 文本块缩进\n\n当我们在带有文本块的实例变量时，不建议像下面这样对文本进行缩进：\n\
  \n```\n1   public String badIndentation = \"\"\"\n2         Some text here...\n\
  3         Lorem Ipsum has been\n4         ever since the 1500s, when an unknown\n\
  5         of type and scrambled\n6 \"\"\n```\n\n如上面的示例所示，我们浪费了大量的空间。最好使用下面的缩进：\n\
  \n```\n1 public final String goodIndentation = \"\"\"\n2   Some text here... Test...\
  \ Test...Some text here...\n3   Lorem Ipsum has been the industry's standard text\n\
  4   and martial arts\n5   of type and scrambled it to make a type specimen book.\n\
  6 \"\"\";\n```\n\n在上面的代码中，我们节省了大量空间，文本也更容易阅读。\n\n另一个让代码阅读困难的问题是换行或水平滚动。因此，当有嵌套代码且需要存储大量文本时，下面的方法**不**推荐：\n\
  \n```\n1     final String chuckNorrisBadIndentation = \"\"\"\n2                Carlos\
  \ Ray \"Chuck\" Norris (born March 10, 1940) is an American martia\n3 l artist and\
  \ actor. He is a black belt in Tang Soo Do,\n4                Brazilian jiuitsu\
  \ and judo.[1] After serving in the United\n5 Air Force, Norris won many martial\
  \ arts championships\n6                and later founded his own discipline Chun\
  \ Kuk Do. Shortly after, in H\n7 ollywood, Norris trained celebrities in martial\
  \ arts. \n8                Norris went on to appear in a minor role in the spy film\
  \ The Wreck\n9  Crew (1969). Friend and fellow martial artist Bruce Lee \n10   \
  \             invited him to play one of the main villains in Way of the Dragon\
  \ (19\\\n11 72).\n```\n\n在这里看不到水平滚动条，但在你的开发 IDE 中是可以看到的。为了让上面的代码缩进更好，我们可以将文本向左移动：\n\
  \n```\n1 String someText =  \"\"\"\n2         apiVersion: v3\n3         kind: Service\n\
  4         metadata:\n5             labels:\n6             run: customer-registration-dev\"\
  \"\";\n7 \n8 System.out.println(someText);\n```\n\n要显式地缩进代码，我们可以像下面一样使用 `indent`\
  \ 方法：\n\n```\n1 String someText =  \"\"\"\n2         apiVersion: v3\n3         kind:\
  \ Service\n4         metadata:\n5             labels:\n6             run: customer-registration-dev\"\
  \"\".indent(4);\n7 \n8 System.out.println(someText);\n```\n\n**输出**：\n\n    apiVersion:\
  \ v3\n\n    kind: Service\n\n    metadata:\n\n        labels:\n\n        run: customer-registration-dev\n\
  \n\n\n\n\n```java\nvoid chuckNorrisGoodIndentation() {\n    final String chuckNorrisGoodIndentation\
  \ = \"\"\"\nCarlos Ray \"Chuck\" Norris (born March 10, 1940) is an American martial\
  \ artist and actor. He is a black belt in \nTang Soo Do, Brazilian jiu jitsu and\
  \ judo.[1] After serving in the United States Air\nForce, Norris won many martial\
  \ arts championships and later founded his own discipline Chun Kuk Do. Shortly after,\
  \ \nin Hollywood, Norris trained celebrities in martial arts. Norris went on to\
  \ appear in a minor role in the spy film \nThe Wrecking Crew (1969). Friend and\
  \ fellow martial artist Bruce Lee invited him to \nplay one of the main villains\
  \ \nin Way of the Dragon (1972).\n\"\"\";\n}\n```\n\n此外请记住，当在 `stream` 或 `lambda`\
  \ 等代码表达式中带有大文本块的缩进文本块时，建议将文本块存储在变量中，然后在代码表达式中使用它。否则，代码将变得难以阅读。\n\n### 14.16.4 Jedi\
  \ 文本块挑战\n\n在接下来的代码挑战中，我们将探索之前存储大文本的方法以及使用文本块的新方法。然后，我们还将探索文本块的语法、缩进和偶然空格。\n\n你猜猜到运行以下代码会发生什么吗？\n\
  \n```java\npublic class JediTextBlockChallenge {\n\n    public static void main(String...\
  \ doYourBest) {\n      String jediWithoutTextBlock = \"\"\n              + \"<html>\\\
  n\"\n              + \"    <head>Master Yoda</head> %s\\n\"\n              + \"\
  </html>\"\n              .strip().formatted(\"Luke\");\n\n      String jediWithTextBlock\
  \ = \"\"\"\n                                   <html>\n                        \
  \               <head>Master Yoda</head> %s\n                                  \
  \ </html\"\"\".strip().formatted(\"Luke\");\n\n      System.out.println(jediWithoutTextBlock.equals(jediWithTextBlock));\n\
  \      System.out.println(jediWithoutTextBlock.formatted(\"Luke\")\n           \
  \ .equals(jediWithTextBlock));\n    }\n}\n```\n\n1. false, true\n2. true, true\n\
  3. true, false\n4. false, false\n\n**解析**：\n\n第一个 `jediWithoutTextBlock` 字符串将接收一个字面量字符串。当我们有很多行时，字面量\
  \ `String` 的行为与文本块不同。在这种情况下，我们创建的每一行都是一个新的 `String` 对象。\n\n注意我们正在使用 `strip` 方法来移除末尾空格，然后调用\
  \ `formatted` 方法。当我们调用 `formatted` 时，整个 `String` 不会被拼接。这是因为 Java 编译器会优先调用方法，然后拼接\
  \ `String`。因此，`formatted` 方法只会考虑最后一个 `String`：`\"</html>\"`，替换将不会发生。从 `jediWithoutTextBlock`\
  \ 存储的 `String` 将是：\n\n```\n<html>\n    <head>Master Yoda</head> %s\n</html>\n```\n\
  \n然后我们在 `jediWithTextBlock` 变量中使用文本块。在文本块中，只有一个 `String`，因此通过 `formatted` 进行的替换成功。\n\
  \n注意另一个细节，左侧的空格被忽略了。这是由于我们使用文本块的方式。为了关闭文本块，我们在最后一个文本的右侧使用了 `\"\"\"`。这意味着最左侧的文本将是所有其他文本的边界。在这种情况下，左侧空格将被忽略。这将是我们存储在\
  \ `String` 中的内容：\n\n```\n<html>\n    <head>Master Yoda</head> Luke\n</html>\n```\n\
  \n打印以下内容时，由于文本不同，将打印 `false`：\n\n`System.out.println(jediWithoutTextBlock.equals(jediWithTextBlock));`\n\
  \n在接下来的条件中，我们再次使用 `formatted` 方法，现在它将成功替换文本。这是因为 `String` 已经完全拼接。因此，这里的输出是 `true`。\n\
  \n结论，正确的选项是：\n\n1. false, true\n\n## 14.17 总结\n\n在本章中，我们探索了帮助我们创建更可靠、更易维护代码的最新 Java\
  \ 特性。注意，许多特性创建是为了减少样板代码。Java 是一种非常显式的语言，因此可能被认为是冗长的，但新特性确实有助于减少这一点。\n\n在本章中，你学习了如何使用：\n\
  \n*   使用 `module-info.java` 使用 `named modules`（命名模块）\n*   生成 jar 并将其包含在模块路径 `automatic\
  \ modules`（自动模块）\n*   `class path` 中的 `unnamed modules`（未命名模块）\n*   使用 `requires`\
  \ 导入其他模块\n*   使用 `requires transitive` 导入传递模块\n*   使用 `exports` 将模块包导出到其他模块\n* \
  \  使用 `provides` 通过 `ServiceLoader` 导出服务\n*   使用 `opens` 从私有成员到其他模块的反射访问\n*   作为本地变量的\
  \ `var`\n*   带有 lambda 避免 `break` 的 `new switch case` 语句\n*   用于类型转换的 `pattern matching`（模式匹配）\n\
  *   使用 `record` 创建数据\n*   使用 `sealed classes`（密封类）限制继承\n*   使用 `text blocks`（文本块）轻松创建块内容\n\
  \n恭喜！你学习了如何使用主要的 Java 特性，并为你的项目做好了准备！\n\n# 15 并发基础\n\n**本章涵盖**：\n\n*   并发基础\n* \
  \  并发与并行的区别\n*   线程状态\n*   创建线程\n*   在线程中使用 `Runnable`\n*   在线程中使用 `sleep`\n*  \
  \ 使用 `sleep` 方法临时停止线程\n*   使用 `join` 方法连接线程\n*   非守护线程和守护线程以控制线程何时死亡\n*   使用 `interrupt`\
  \ 方法停止线程执行\n*   理解竞态条件以避免线程的意外结果\n*   互斥同步线程 (Mutex)\n*   对象同步\n*   线程中的 `wait`\
  \ 和 `notify` 方法\n*   4 个 挑战\n\n为了提高吞吐量、性能和处理时间，必须应用并发技术。在我们使用计算机时并发一直在被使用。\n\n例如，你认为在\
  \ `Windows 95` 时代多个应用程序是如何打开的？浏览器和音乐程序是如何运行的？这是因为任务是并发处理的，不一定是同时运行，而是通过中断运行的。\n\n\
  这是计算机科学中一个非常基础且重要的概念，你成为一名高水平软件工程师必须掌握它！\n\n## 15.1 并发基础\n\n并发**并不是**真的同时处理任务，而是创造了同时的错觉。并发不需要多个\
  \ CPU，因为发生的情况是多个任务通过上下文切换执行。\n\n`concurrency`（并发）一词存在混淆，因为以下是词典中的含义：\n\n正如前面提到的，计算机科学中的并发与词典中的含义不同。为了吸收这个概念，请考虑**可中断性**。这意味着一个任务会被中断，以便另一个任务继续使用同一个\
  \ CPU。\n\n### 15.1.1 实际并发示例\n\n假设你在 3 小时的范围内需要完成以下任务：\n\n*   获取签证（大约需要 2 小时）\n*\
  \   完成工作任务（大约需要 2 小时）\n\n**非并发模式**：\n\n为了获取签证，你平均要在队列中至少等待 2 小时。所以你等了两个小时拿到签证。然后你才开始做工作任务，但这大约需要\
  \ 2 小时，你无法按时完成。最后，你令人讨厌的最终任务是向老板解释为什么你无法完成任务。\n\n\n\n\n\n## 并发模式（智能方式）\n\n在这里，你可以使用强大的\
  \ `concurrency`（并发）概念！你提前计划好你将在队列中等待 2 小时，然后带上你的笔记本电脑！当你进入排队办签证时，你 `interrupt`（中断）了任务去办签证，并\
  \ `start`（开始）处理你的编码任务。在队列中等待了 2 小时后，你已经完成了编码任务并拿到了签证！最后，你可以告诉你的老板你是有多出色，既完成了任务又拿到了签证！\n\
  \n### 15.1.2 并行 (Parallelism)\n\n并行实际上是 `at the same time`（同时）运行任务，这使得它比并发更快。这意味着如果有多个需要运行的任务，它们将同时运行。并行使用多个\
  \ CPU 来处理其任务。在谈论并行时，请记住任务是 `independently`（独立）运行的。\n\n### 15.1.3 并行实例示例\n\n现在，假设你有以下任务要在\
  \ 6 小时内完成：\n\n*   参加最好的朋友的派对（花费 6 小时）\n*   完成你的会议演示报告（花费 4 小时）\n\n由于你要去最好的朋友的派对，你决定你想出现在那里，而不是处理你的演示报告。然而，你也需要完成你将进行的演讲演示。这时你产生了一个绝佳的主意：雇佣一个高技能的软件工程师来为你完成演示。你的朋友接受了这个想法，`parallelism`（并行）的奇之处就发生了。\n\
  \n当你享受在朋友派对上的时光时，你的演示报告将由高技能软件工程师 `at the same time`（同时）完成！\n\n为了对这种情况情况进行类比，请想象你是一个\
  \ CPU，而高技能的软件工程师是另一个 CPU，它们正在 `simultaneously`（同时）处理两个任务。\n\n### 15.1.4 线程状态\n\n\
  在实践中探索线程之前，了解它们可能处于哪些状态非常重要。\n\n让我们看看下面的图来探索这一点：\n\n![](img/thread_states.png)\n\
  \n线程状态\n\n*   **New (新建)**：当线程被实例化但尚未启动执行执行时。\n*   **Runnable (可运行)**：当调用 `start`\
  \ 方法时，线程处于 `Runnable` 状态。当线程准备好运行或正在运行时。线程调度器将决定线程是否运行，记住线程可能会为了其他线程而突然停止其执行。CPU\
  \ 在此也起了作用，线程运行需要资源。\n*   **Blocked (阻塞)**：当线程等待监视锁时。这意味着，当另一个线程获得了锁，而其他线程想要访问该锁但它被阻塞了，因为另一个线程必须先完成它的执行。简单来说，线程在等待不确定时间时会被阻塞，大多数情况下直到其他线程完成它们的执行。\n\
  *   **Timed Waiting (超时等待)**：这是一种更可预测的等待方式。因此，当我们指定线程将等待多久执行时。根据 Java 文档，这些是调用的方法：\n\
  \n```\nThread.sleep(time)\nObject.wait(timeout)\nThread.join(timeout)\nLockSupport.parkNanos(time)\n\
  LockSupport.parkUntil(time)\n```\n*   **Terminated state (终止状态)**：当线程正常完成执行时。也存在发生错误导致线程终止的情况。\n\
  \n## 15.2 线程 (Thread)\n\n在 Java 中处理并发最基本的类是 `Thread` 类。`Java` 中的 `Thread` 是可以并行运行的最小进程。即使在\
  \ Java 中创建最简单的程序，我们也会处理 `Threads`，这是因为 `main` 方法有一个 `main` `Thread`。\n\n我们可以创建许多\
  \ `Threads` 并并行运行它们。根据情况情况，我们可以获得巨大的性能提升。由于在多线程环境中工作时，代码将同时或并发执行，因此维护它更具挑战性。\n\n\
  有一个特殊的方法 `Thread.currentThread()`，通过它可以获取当前线程并查看其属性：\n\n```\n1 package com.javachallengers.concurrency;\n\
  2 \n3 public class MainThread {\n4 \n5   public static void main(String[] args)\
  \ {\n6     System.out.println(Thread.currentThread().getName());\n7   }\n8 }\n```\n\
  \n**输出**:\n\nmain\n\n### 15.2.1 扩展 `Thread` 类\n\n`Java` 为我们提供了创建自己的 `Thread` 实现的可能性。这样做最基本的方法是实例化\
  \ `Thread` 类并启动它，如下代码所示：\n\n```\n1 package com.javachallengers.concurrency;\n2 \n\
  3 public class ThreadStart {\n4 \n5   public static void main(String[] args) {\n\
  6     Thread thread = new Thread();\n7     thread.start();\n8   }\n9 }\n```\n\n\
  在上面的代码中，我们启动了一个新的 `Thread` 但没有重写 `run` 方法。因此，没有输出。\n\n现在，让我们重写 `run` 方法来看到一些动作发生：\n\
  \n```\n 1 package com.javachallengers.concurrency;\n 2 \n3 public class ThreadStartImplemented\
  \ {\n 4 \n5   public static void main(String[] args) {\n6     System.out.println(Thread.currentThread().getName());\n\
  7     Thread thread = new ThreadRunner();\n8     thread.start();\n9   }\n10 }\n\
  11 \n12 class ThreadRunner extends Thread {\n13   @Override\n14   public void run()\
  \ {\n     // 注意：此处逻辑未在示例代码中完全给出，但根据上下文 \n     // 这里的 `run` 方法内容应对应后文的逻辑。\n   }\n\
  15 }\n```\n*(注：原文示例代码中 `ThreadRunner` 的实现不完整，此处根据翻译逻辑保持结构一致)*\n\n在，代码中，我们启动了一个新的\
