  \ 1958 年的老旧概念。为了处理大量的线程，虚拟线程的概念非常强大。这是因为虚拟线程在不需要时真的会被被挂起。因此，如果你正在处理 10 万个线程（例如），处理时间将大幅减少。更多信息，请查看以下文档：[`openjdk.org/jeps/425`](https://openjdk.org/jeps/425)\n\
