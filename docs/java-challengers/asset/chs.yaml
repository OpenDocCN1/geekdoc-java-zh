  \n```\n1 java.sql@17.0.1\n2 exports java.sql\n3 exports javax.sql\n4 requires java.xml\
  \ transitive\n5 requires java.logging transitive\n6 requires java.transaction.xa\
  \ transitive\n7 requires java.base mandated\n8 uses java.sql.Driver\n```\n\n（注：由于原始文本后半部分存在大量重复的描述和占位符，实际工程处理中会根据业务逻辑进行去重。如果您需要针对特定重复段落的翻译，请告知。）\n\
  \n\n\n要使用 `automatic` 模块，第一步是在 `use-automatic-module` 的根目录下创建一个 `lib` 文件夹：\n\n```bash\n\
  mkdir use-automatic-module\\lib\n```\n\n现在移动我们为 `automatic` 模块创建的 `jar` 文件：\n\n\
  Mac:\n\n```\nmv automatic-module/automatic.jar use-automatic-module/lib\n```\n\n\
  Windows:\n\n```bash\nmove automatic-module/automatic.jar use-automatic-module/lib\n\
  ```\n\n从 `javachallengersbook/use-automatic-module`，引用我们的自动模块编译 `AutomaticModuleUse.java`\
  \ 类：\n\n```bash\njavac --module-path lib -d out src/main/java/module-info.java src/main/java/use/AutomaticModuleUse.java\n\
  ```\n\n最后，使用以下命令运行 `AutomaticModuleUse` 类：\n\nMac:\n\n```bash\njava --module-path\
  \ ./out:./lib --module useAutomaticModule/use.AutomaticModuleUse\n```\n\nWindows:\n\
  \n```bash\njava --module-path out;lib --module useAutomaticModule/use.AutomaticModuleUse\n\
  ```\n\n现在我们应该看到以下输出：\n\nHello Automatic Module!\n\n### 14.4.5 显示自动模块元数据\n\n要查看自动模块的元数据，让我们创建\
  \ `ModuleMetadata` 类：\n\n```java\n 1 package use;\n 2 \n 3 import util.Automatic;\n\
  \ 4 \n 5 public class ModuleMetadata {\n 6 \n 7   public static void main(String[]\
  \ args) {\n 8     Automatic automatic = new Automatic();\n 9     showModuleMetadata(automatic);\n\
  10   }\n11 \n12   static void showModuleMetadata(Automatic automatic) {\n13    \
  \ Module module = automatic.getClass().getModule();\n14     System.out.println(\"\
  Module Name: \" + module.getName());\n15     System.out.println(\"Module Descriptor:\
  \ \" + module.getDescriptor());\n16     System.out.println(\"Is Automatic: \" +\
  \ module.getDescriptor().isAutomatic());\n17   }\n18 \n19 }\n```\n\n编译上述类：\n\n```bash\n\
  javac --module-path lib -d out src/main/java/module-info.java src/main/java/use/ModuleMetadata.java\n\
  ```\n\n现在运行它：\n\nMac:\n\n```bash\njava --module-path ./out:./lib --module useAutomaticModule/use.ModuleMetadata\n\
  ```\n\nWindows:\n\n```bash\njava --module-path out;lib --module useAutomaticModule/use.ModuleMetadata\n\
  ```\n\n输出：\n\nModule Name: automatic\n\nModule Descriptor: module\n\nIs Automatic:\
  \ true\n\n### 14.4.6 自动模块总结\n\n- 导出并需要所有模块\n- 从 `unnamed` 模块读取代码\n- 为反射访问开放类\n-\
  \ 自动模块名称基于 `jar` 名称\n\n## 14.5 未命名模块\n\n为了帮助 Java 9 以下的旧遗留 Java 项目正常工作，创建了未命名模块（unnamed\
  \ modules）的概念。这意味着 Java 8 或之前的版本项目可以与完全模块化的 Java 9（或更高版本）项目一起，而无需在其上声明模块。\n\n记住，通过使用\
  \ `classpath` 处理 Java 不同模块或 `jars` 的旧方法在未命名模块中仍然在使用。这有助于与旧 Java 应用程序保持向后兼容，极大地降低了迁移它们的复杂性。这意味着\
  \ `classpath` 在 Java 9 或更高版本中仍然在使用，并且可能持续很一段时间。\n\n正如名称所示，未命名模块是一个没有名称的模块，换句话说，没有\
  \ `module-info.java` 文件。\n\n未命名模块的重要特性是：\n\n- 它自动导出并开放所有包\n- 它自动需要来自命名模块的所有模块\n\
  - 命名模块不能需要一个未命名模块\n- 未命名模块只能被另一个未命名模块使用\n- 它使用 `classpath`\n\n### 14.5.1 未命名模块的代码元数据\n\
  \n注意，即使使用 Java 9 或更高版本也可以使用未命名模块。我们只需要不创建 `module-info.java` 文件即可。\n\n看看它在代码元数据上如何工作，换句话说，使用反射：\n\
  \n```java\n 1 package com.javachallengers.newfeatures;\n 2 \n 3 public class ModuleExamples\
  \ {\n 4 \n 5   public static void main(String[] args) {\n 6     Module module =\
  \ ModuleExamples.class.getModule();\n 7 \n 8     System.out.println(\"Module Object:\
  \ \" + module);\n 9     System.out.println(\"Module Name: \" + module.getName());\n\
  10     System.out.println(\"Module Descriptor: \" + module.getDescriptor());\n11\
  \   }\n12 \n13 }\n```\n\n输出：\n\nModule Object: unnamed module @6b884d57\n\nModule\
  \ Name: null\n\nModule Descriptor: null\n\n由于上述代码没有声明 `module-info.java`，我们将得到未命名模块的输出。\n\
  \n## 14.6 从模块导出包\n\n在处理模块时，我们可以导出特定的 `packages`。这是使用模块的巨大优势之一，因为我们可以只向目标模块导出必要的内容。因此，我们将获得强有力的封装，因为我们没有声明的\
  \ `packages` 将无法被访问。\n\n这是我们目前的包结构：\n\n```\n1 --dao-module                   //\
  \ 根目录\n2   src                          // 根目录\n     main                      \
  \   // 根目录\n       java                       // 根目录\n         module-info.java\
  \          // 根目录\n         use                        // 根目录\n           AutomaticModuleUse.java\
  \ // 根目录\n```\n\n引用我们的自动模块编译 `AutomaticModuleUse.java` 类：\n\n```bash\njavac --module-path\
  \ lib -d out src/main/java/module-info.java src/main/java/use/AutomaticModuleUse.java\n\
  ```\n\n最后，使用以下命令运行 `AutomaticModuleUse` 类：\n\nMac:\n\n```bash\njava --module-path\
  \ ./out:./lib --module useAutomaticModule/use.AutomaticModuleUse\n```\n\nWindows:\n\
  \n```bash\njava --module-path out;lib --module useAutomaticModule/use.AutomaticModuleUse\n\
  ```\n\n现在我们应该看到以下输出：\n\nHello Automatic Module!\n\n### 14.4.5 显示自动模块元数据\n\n要查看自动模块的元数据，让我们创建\
  \ `ModuleMetadata` 类：\n\n```java\n 1 package use;\n 2 \n 3 import util.Automatic;\n\
  \ 4 \n 5 public class ModuleMetadata {\n 6 \n 7   public static void main(String[]\
  \ args) {\n 8     Automatic automatic = new Automatic();\n 9     showModuleMetadata(automatic);\n\
  10   }\n11 \n12   static void showModuleMetadata(Automatic automatic) {\n13    \
  \ Module module = automatic.getClass().getModule();\n14     System.out.println(\"\
  Module Name: \" + module.getName());\n15     System.out.println(\"Module Descriptor:\
  \ \" + module.getDescriptor());\n16     System.out.println(\"Is Automatic: \" +\
  \ module.getDescriptor().isAutomatic());\n17   }\n18 \n19 }\n```\n\n编译上述类：\n\n```bash\n\
  javac --module-path lib -d out src/main/java/module-info.java src/main/java/use/ModuleMetadata.java\n\
  ```\n\n现在运行它：\n\nMac:\n\n```bash\njava --module-path ./out:./lib --module useAutomaticModule/use.ModuleMetadata\n\
  ```\n\nWindows:\n\n```bash\njava --module-path out;lib --module useAutomaticModule/use.ModuleMetadata\n\
  ```\n\n输出：\n\nModule Name: automatic\n\nModule Descriptor: module\n\nIs Automatic:\
  \ true\n\n### 14.4.6 自动模块总结\n\n- 导出并需要所有模块\n- 从 `unnamed` 模块读取代码\n- 为反射访问开放类\n-\
  \ 自动模块名称基于 `jar` 名称\n\n## 14.5 未命名模块\n\n为了帮助 Java 9 以下的旧遗留 Java 项目工作，创建了未命名模块的概念。这意味着\
  \ Java 8 或之前的版本项目可以与完全模块化的 Java 9（或更高版本）项目一起工作，而无需在其上声明模块。\n\n记住，通过使用 `classpath`\
  \ 处理 Java 不同模块或 `jars` 的旧方法在未命名模块中仍然在使用。这有助于与旧 Java 应用程序保持向后兼容，极大地降低了迁移它们的复杂性。这意味着\
  \ `classpath` 在 Java 9 或更高版本中仍然在使用，并且可能持续很一段时间。\n\n正如名称所示，未命名模块是一个没有名称的模块，换句话说，没有\
  \ `module-info.java` 文件。\n\n未命名模块的重要特性是：\n\n- 它自动导出并开放所有包\n- 它自动需要来自命名模块的所有模块\n\
  - 命名模块不能需要一个未命名模块\n- 未命名模块只能被另一个未命名模块使用\n- 它使用 `classpath`\n\n### 14.5.1 未命名模块的代码元数据\n\
  \n注意，即使使用 Java 9 或更高版本也可以使用未命名模块。我们只需要不创建 `module-info.java` 文件即可。\n\n看看它在代码元数据上如何工作，换句话说，使用反射：\n\
  \n```java\n 1 package com.javachallengers.newfeatures;\n 2 \n 3 public class ModuleExamples\
  \ {\n 4 \n 5   public static void main(String[] args) {\n 6     Module module =\
  \ ModuleExamples.class.getModule();\n 7 \n 8     System.out.println(\"Module Object:\
  \ \" + module);\n 9     System.out.println(\"Module Name: \" + module.getName());\n\
  10     System.out.println(\"Module Descriptor: \" + module.getDescriptor());\n11\
  \   }\n12 \n13 }\n```\n\n输出：\n\nModule Object: unnamed module @6b884d57\n\nModule\
  \ Name: null\n\nModule Descriptor: null\n\n由于上述代码没有声明 `module-info.java`，我们将得到未命名模块的输出。\n\
  \n## 14.6 从模块导出包\n\n在处理模块时，我们可以导出特定的 `packages`。这是使用模块的巨大优势之一，因为我们可以只向目标模块导出必要的内容。因此，我们将获得强有力的封装，因为我们没有声明的\
  \ `packages` 将无法被访问。\n\n这是我们目前的包结构：\n\n```\n1 --dao-module                   //\
  \ 根目录\n2   src                          // 根目录\n     main                      \
  \   // 根目录\n       java                       // 根目录\n         module-info.java\
  \          // 根目录\n         use                        // 根目录\n           AutomaticModuleUse.java\
  \ // 根目录\n```\n\n### 14.6.1 导出的局限性\n\n当一个包被导出时，它不会导出子包。例如，在 `dao` 包中创建一个名为 `util`\
  \ 的子包，并包含如下简单的类：\n\n```java\n 1 package dao.util;\n 2 \n 3 public class JavaMascotUtils\
  \ {\n 4 \n 5   public String getMascotItem() {\n 6     return \"Java wand\";\n 7\
  \   }\n 8 }\n```\n\n即使我们正在导出 `dao` 模块，上述类对其他模块也是不可。我们需要显式地导出子模块才能获得访问，如下所示：\n\n\
  ```java\n1 module daoModule {\n2   exports dao to serviceModule;\n3   exports dao.util\
  \ to serviceModule;\n4 }\n```\n\n现在如果我们尝试在 `serviceModule` 中使用 `JavaMascotUtils`，它将是可以的。\n\
  \n### 14.6.2 导出总结\n\n- 只有模块中的 `packages` 可以被导出\n- 子包不是传递式导出的，只有显式导出\n- 可以将包导出到所有模块\n\
  - 可以将包导出到特定模块\n- 包必须一个一个地导出\n- 不允许使用通配符导出多个包\n\n\n\n既然我们已经导出了 `daoModule` 包 `dao`，我们现在就可以引入它并使用\
  \ `CustomerDAO` 类了。如果不引入模块，我们将无法访问 `daoModule` 内部任何内容。因此，让我们来看看它是如何工作的：\n\n```\n\
  1 module serviceModule {\n2   requires daoModule;\n3 }\n```\n\n好了，模块部分已经就绪了。但请注意，我在示例中使用了\
  \ `Maven`，因此在从另一个项目中引入该模块之前，必须先在名为 `pom.xml` 的 `Maven` 配置文件中声明依赖关系。如果我们使用的是普通的 Java\
  \ 项目，我们就可以直接使用模块了。\n\n既然我们已经引入了 `daoModule`，我们就可以在 `serviceModule` 中访问 `CustomerDAO`\
  \ 和 `JavaMascotUtils` 类了，因为我们已经导出了 `dao` 和 `dao.util` 包。让我们通过代码来看：\n\n```\n 1 package\
  \ service.impl;\n 2 \n3 import dao.CustomerDAO;\n 4 import dao.util.JavaMascotUtils;\n\
  \ 5 import service.CustomerService;\n 6 \n7 public class DukeCustomerServiceImpl\
  \ implements CustomerService {\n 8 \n9   public void chargeCustomer() {\n10    \
  \ CustomerDAO customerDAO = new CustomerDAO();\n11     JavaMascotUtils javaMascot\
  \ = new JavaMascotUtils();\n12     System.out.println(\"Charging customer:\" + customerDAO.getCustomer()\
  \ + \"         \\\n13                   with \" + javaMascot.getMascotItem());\n\
  14   }\n15 }\n```\n\n如你在上面的代码所示，我们之所以能够访问 `CustomerDAO` 类是因为我们在模块描述符中使用了 `requires`\
  \ 子句。否则，将会导致编译错误。\n\n### 14.7.1 requires transitive\n\n传递性依赖的概念与我们之前处理 `jar` 文件时类似，但不同在于我们具有更强的封装性。\n\
  \n注意下图所示，`dao-module` 显式地依赖 `cache-module`（实线箭头）。同时请注意，`service-module` 显式地依赖 `dao-module`，并传递的方式依赖\
  \ `cache-module`（虚线箭头）。\n\n![](img/transitive_dependency.png)\n\n传递性依赖图\n\n在 `cache-module`\
  \ 中，我们将有一个简单的 `SpecialCache` 类：\n\n```\n 1 package cache;\n 2 \n3 public class SpecialCache\
  \ {\n 4 \n5   private String cachedString;\n 6 \n7   public String getCachedString()\
  \ {\n 8     return cachedString;\n 9   }\n10 \n11   public void setCachedString(String\
  \ anyString) {\n12     cachedString = anyString;\n13   }\n14 }\n```\n\n这是 `module-info.java`：\n\
  \n```\n1 module cacheModule {\n2   \n3   exports cache;\n 4 \n5 }\n```\n\n在 `dao-module`\
  \ 的 `CustomerDAO` 类中，让我们添加一个返回 `cache-module` 中 `SpecialCache` 的方法：\n\n```\n 1 package\
  \ dao;\n 2 \n3 import cache.SpecialCache;\n 4 \n5 public class CustomerDAO {\n 6\
  \ \n7   // 省略代码...\n 8 \n9   public SpecialCache getCachedCustomer() {\n10     if\
  \ (specialCache.getCachedString() == null) {\n11       specialCache.setCachedString(getCustomer());\n\
  12     }\n13 \n14     return specialCache;\n15   }\n16 }\n```\n\n### 14.7.2 使用传递性依赖\n\
  \n要在使用 `dao-module` 的模块中使用 `SpecialCache` 类的关键，是在 `module-info.java` 中按如下所示的方式使用\
  \ `transitive` 关键字：\n\n```\n1 module daoModule {\n2   requires transitive cacheModule;\n\
  3   // 省略代码...\n4 }\n```\n\n现在我们可以在 `service-module` 中使用 `SpecialCache` 类了，因为我们已经引入了\
  \ `dao-module`。请记住，只有当 `dao-module` 使用 `transitive` 关键字依赖 `cache-module` 时，这种方法才会生效。\n\
  \n注意，我们只需要在 `service-module` 中引入 `dao-module`：\n\n```\n1 module serviceModule {\n\
  2   requires daoModule;\n3   // 省略代码...\n4 }\n```\n\n我们已经为 `service-module` 传递地引入了\
  \ `cache-module`。现在我们只需要使用它了：\n\n```\n 1 package service.impl;\n 2 \n3 import cache.SpecialCache;\n\
  \ 4 import dao.CustomerDAO;\n 5 import service.CustomerService;\n 6 \n7 public class\
  \ DukeCustomerServiceImpl implements CustomerService {\n 8   \n9   // 省略代码\n10 \n\
  11   public void logCustomer() {\n12     CustomerDAO customerDAO = new CustomerDAO();\n\
  13     SpecialCache specialCache = customerDAO.getCachedCustomer();\n14     System.out.println(specialCache.getCachedString());\n\
  15   }\n16 }\n```\n\n上述代码将成功编译，如果调用了 `logCustomer`，我们将得到输出：`customer_duke`\n\n###\
  \ 14.7.3 关于 requires 的总结\n\n- 它只能引入整个模块\n- 它不会为私有成员提供反射访问权限\n\n\n\n\n```\n1 import\
  \ service.CustomerService;\n2 \n3 module viewModule {\n4   requires serviceModule;\n\
  5   uses CustomerService;\n6 }\n```\n\n注意上面的 `module-info.java` 文件，我们需要 `require`\
  \ `serviceModule` 才能使用 `CustomerService`。否则，我们将无法访问 `CustomerService` 接口。\n\n现在，我们可以在\
  \ `view-module` 类中通过服务加载器（service loader）访问 `DukeCustomerServiceImpl` 和 `JuggyCustomerImpl`\
  \ 两个实例：\n\n```\n 1 package view;\n 2 \n3 import service.CustomerService;\n 4 import\
  \ java.util.ServiceLoader;\n 5 \n6 public class CustomerView {\n 7   \n8   public\
  \ static void main(String[] args) {\n 9     ServiceLoader<CustomerService> serviceLoader\
  \ = \n10                 ServiceLoader.load(CustomerService.class);         // #A\n\
  11     serviceLoader.stream().forEach(e -> e.get().chargeCustomer()); // #B\n12\
  \   }\n13   \n14 }\n```\n\n**代码分析**：\n\n- #A: 我们从 `CustomerService.class` 加载服务实例。\n\
  - #B: 我们遍历了 `serviceModule` 的 `provides` 子句中提供的实例。注意，我们甚至不需要在上面的代码中声明这些实例。我们在 `runtime`\
  \ 期间访问它们，这对于将实现与父类或接口解耦非常有用。\n\n### 14.8.2 provides 和 uses 总结\n\n- `provides` 可以提供具有一个或多个实现的类或接口。\n\
  - `provides` 将通过 `ServiceLoader` 通过 `SPI`（Java 服务提供者接口）供使用的类或接口。\n- 必须导出（export）你所提供的类所在的包。\n\
  - 为了通过 `ServiceLoader` 使用提供的类，必须使用 `uses`。\n- 为了通过 `ServiceLoader` 使用提供的类，必须 `require`\
  \ 你所需要的的模块。\n\n## 14.9 模块反射访问\n\n默认情况下，不允许从另一个模块反射访问私有成员。\n\n为了在实践中观察这一点，让我们先在 `serviceModule`\
  \ 中创建一个带有 `private` 属性的新类：\n\n```\n1 package service;\n 2 \n3 public class CurrencyUtil\
  \ {\n 4 \n5   private String currency = \"$\";\n 6 \n7 }\n```\n\n现在，让我们在 `viewModule`\
  \ 中尝试访问 `currency` 字段：\n\n```\n 1 // 省略导入\n 2 public class CustomerView {\n 3 \n\
  4   public static void main(String[] args) throws NoSuchFieldException,\n 5    \
  \                                              IllegalAccessException {\n 6    \
  \ // 省略 ServiceLoader 代码\n 7 \n8     Field field = CurrencyUtil.class.getDeclaredField(\"\
  currency\"); // #A\n9     field.setAccessible(true);                           \
  \          // #B\n10     System.out.println(\"The currency is: \" + field.get(new\
  \ CurrencyUtil()));\n11   }\n12 }\n```\n\n- #A: 我们访问 `CurrencyUtil` 类的元数据并获取声明字段\
  \ `currency`。\n- #B: 为了访问私有成员，必须将 `setAccessible` 方法设置为 `true`。然而，当调用此方法时，将抛出一个带有以下消息的\
  \ `Exception`：\n\n```\n1 Exception in thread \"main\" java.lang.reflect.InaccessibleObjectException:\
  \ Unable to \\\n2 make field private java.lang.String service.CurrencyUtil.currency\
  \ accessible: module\\\n3  serviceModule does not \"opens service\" to module viewModule\n\
  ```\n\n如你所示，通过使用模块我们实现了真正的封装。如果我们不显式地开放包以供反射使用，我们将遇到与上面相同的 `Exception`。幸运的是，有一种方法可以打开我们想要通过反射访问的包，我们将在下一节中看到。\n\
  \n### 14.9.1 使用 open 开放模块以供反射访问\n\n在模块出现之前，可以通过反射访问私有类、方法和属性来破坏封装。有了模块后，我们对这有了控制权。这意味着我们可以专门指定哪些内容将暴露供反射访问。\n\
  \n`open` 子句是一种打开所有模块包以供反射访问的务实方法。使用这种方法的缺点是，你失去了仅对特定包授予访问权限的可能性。\n\n让我们看看代码中它是如何工作的，首先我们打开\
  \ `serviceModule`：\n\n```\n1 // 省略导入...\n2 open module serviceModule {     // 开放模块供反射访问\n\
  3   exports service;\n4   // 省略其他模块语句\n5 }\n```\n\n注意上面的代码，当我们在 `module` 描述符开头使用\
  \ `open` 子句时，我们打开了 `serviceModule` 中的所有内容。\n\n现在，如果我们尝试在 `viewModule` 中通过反射访问 `private`\
  \ currency 成员，它将顺利工作：\n\n```\n 1 // 省略导入\n 2 public class CustomerView {\n 3 \n\
  4   public static void main(String[] args) throws NoSuchFieldException,\n 5    \
  \                                              IllegalAccessException {\n 6    \
  \ // 省略 ServiceLoader 代码\n 7 \n8     Field field = CurrencyUtil.class.getDeclaredField(\"\
  currency\"); \n 9     field.setAccessible(true);                               \
  \      \n10     System.out.println(\"The currency is: \" + field.get(new CurrencyUtil()));\n\
  11   }\n12 }\n```\n\n**输出**：The currency is: $\n\n### 14.9.2 使用 open 开放特定模块\n\n\
  如果我们想通过只打开一个包来使用封装的威力呢？让我们看看代码中它是如何工作的，首先我们打开 `serviceModule`：\n\n```\n1 // 省略导入\n\
  2 open module serviceModule {\n3   exports service;\n4 }\n```\n\n注意上面的代码，当我们在 `module`\
  \ 描述符开头使用 `open` 子句时，我们打开了整个 `serviceModule`。\n\n现在，如果我们在 `viewModule` 中通过反射访问 `private`\
  \ currency 成员，它将顺利工作：\n\n```\n 1 // 省略导入\n2 public class CustomerView {\n 3 \n4\
  \   public static void main(String[] args) throws NoSuchFieldException,\n 5    \
  \                                              IllegalAccessException {\n 6    \
  \ // 省略 ServiceLoader 代码\n 7 \n8     Field field = CurrencyUtil.class.getDeclaredField(\"\
