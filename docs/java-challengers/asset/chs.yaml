  \ Java 中的数组实际上是一个对象。当你实例化一个对象并将其赋值给变量时，对象本身将存储在 JVM 的内存堆中；变量仅存储一个引用，JVM 将使用该引用来定位对象并为\
  \ Java 应用程序获取它。\n\n只要对象在应用程序中仍然是可以访问的，它就会一直存在于内存堆中。我们如何知道一个对象是否仍然可访问呢？当仍有变量能够访问该对象时。\n\
  \n让我们逐步分析这个挑战。\n\n1 - 首先，我们声明一个 `int` 变量数组，然后实例化一个总大小为 5 的 `int` 数组，最后将新数组对象赋值给\
  \ `linkOcarinaOfTimeLevels` 变量。然后我们将数字 0, 2, 4, 6 和 8 填充到数组从 0 到 4 的索引中。\n\n```\n\
  int[] linkOcarinaOfTimeLevels = new int[5];\n```\n\n2 - 下面行代码是这个挑战的另一个大关键。我们将数组对象的引用\
  \ `linkOcarinaOfTimeLevels` 赋值给 `linkMajorasMaskLevels`。这意味着两个变量将指向同一个对象——它们只是名称不同。\n\
  \n```\nint[] linkMajorasMaskLevels = linkOcarinaOfTimeLevels;\n```\n\n3 - 然后，我们调用\
  \ `slayMonsters` 方法并将 `linkOcarinaOfTimeLevels` 数组传递给它。在方法调用期间，我们基本上给数组中的每个元素加了\
  \ 2。因此，在这次迭代中，数组值将变为 2 4 6 8 10。\n\n```\nlinkAdventure.slayMonsters(linkOcarinaOfTimeLevels);\n\
  ```\n\n4 - 最后，我们使用另一个数组变量引用 `linkMajorasMaskLevels` 调用 `slayMonsters` 方法，它指向内存堆中的同一个对象。由于两个数组变量都指向同一个对象，因此调用两次\
  \ `slayMonsters` 方法的效果将是每个元素的值都被增加了两次 2。因此，我们将得到值 4 6 8 10 12。\n\n```\nlinkAdventure.slayMonsters(linkMajorasMaskLevels);\n\
  ```\n\n结论，正确的答案是：4 6 8 10 12\n\n## 3.7 存款/取款挑战\n\n这个挑战的目标是使用你在本章中学到的面向对象编程概念，创建一个\
  \ `Account` 类，并创建 `deposit`（存款）和 `withdraw`（取款）方法，以操作资金。\n\n### 3.7.1 存款挑战\n\n挑战的第一步是创建一个\
  \ `Account` 类，带有一个 `balance` 属性，通过构造函数初始化它。创建一个 `deposit` 方法，它接收一个金额并将其加入 `balance`。如果金额为负数，则打印“不允许接受负数”且不执行操作。\n\
  \n### 3.7.2 取款挑战\n\n接下来，创建一个 `withdraw` 方法，它接收一个金额并从 `balance` 中减去。如果金额大于余额，则打印“金额不足”且不执行操作。你还需要创建一个\
