  \    Nemesis\n4.  Leon\n    Nemesis\n\n**解释**：\n\n如前所述，这个挑战的关键在于理解关键字 `this` 是如何工作的。通过使用该关键字，我们指向了当前实例。\n\
  \n这段代码中采取的第一个操作是实例化 `ResidentEvilNameChange`。然后我们将字符串 `\"Leon\"` 传递给它的构造函数——但请注意，我们在这里使用了局部变量，因为我们没有显式地使用关键字\
  \ `this`。你必须记住，当局部变量与实例变量同名时，如果不使用 `this`，局部变量将具有更高的优先级，并取代实例变量使用。\n\n构造函数将值“Leon”赋值给局部变量\
  \ `name`，该变量在构造函数调用结束后就消失了（记住局部变量只在构造函数调用期间存在）。\n\n接下来，我们调用 `changeName(\"Claire\"\
  )`。在方法内部，`this.name = this.name` 将局部变量赋值给自身，因此实例变量保持为“Nemesis”。因此，最终输出是：\n\n3. \
  \ Nemesis\n    Nemesis\n\n\n\n\n\n此挑战探索了变量如何指向内存堆中的对象。你将创建两个变量，`challenger` 和 `alternativeChallenger`，然后对它们的值进行操作。你能猜出输出是什么吗？\n\
  \n```java\n 1 public class Challenger {\n 2 \n3     int level;\n 4 \n5     public\
  \ static void main(String[] doYourBest) {\n 6         Challenger challenger = new\
  \ Challenger();\n 7         challenger.level = 7;\n 8 \n9         challenger.changeLevel();\n\
  10         Challenger alternativeChallenger = challenger;\n11 \n12         alternativeChallenger.level\
  \ = 12;\n13 \n14         System.out.print(challenger.level);\n15         System.out.print(alternativeChallenger.level);\n\
  16     }\n17 \n18     void changeLevel() {\n19         this.level = 9;\n20     }\n\
  21 }\n```\n\n1. 1212\n2. 77\n3. 912\n4. 99\n\n### 解析\n\n你在 `main` 方法中的第一个动作是实例化\
  \ `Challenger` 对象。然后，你将值 `7` 赋值给 `level` 变量。\n\n第二个重要的操作是从挑战实例中调用 `changeLevel`\
  \ 方法，然后将 `level` 变量的值改为 `9`。通过这种方式，你改变了内存堆中的真实对象。\n\n这个挑战的关键在于当你将挑战实例赋值给 `alternativeChallenger`\
  \ 变量时。记住，变量只是一个指向内存堆中真实对象的控制器。因此，两个变量都将指向同一个对象，并且会改变同一个对象的属性。\n\n当你将 `alternativeChallenger`\
  \ 的 `level` 变量的值改为 `12` 时，你是在改变你所创建的那个对象。此时，`challenger` 的 `level` 变量值也会变为 `12`。\n\
  \n结论，这个挑战的正确答案是：\n\n**A - 1212**\n\n如果你做对了这个挑战，意味着你对对象引用的概念有良好的理解。\n\n### 3.5.2\
