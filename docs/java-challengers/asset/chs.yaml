  | long | -9,223,372,036,854,775,808 .. 9,223,372,036,854,775,807 | 0 | 64 bits |\
  \ -4000L, -900l, 10L, 700L |\n| float | 3.40282347 x 1038 .. 1.40239846 x 10-45\
  \ | 0.0 | 32 bits | 1.67e200f, -1.57e-207f, .9f, 10.4F |\n| double | 1.7976931348623157\
  \ * 10308 .. 4.9406564584124654 * 10-324 | 0.0 | 64 bits | 1.e700d, -123457e, 37e1d\
  \ |\n\n### 2.1.4 Java 中定义的基本变量类型\n\n请注意，Java 中的基本类型永远不能拥有 `null` 值；如果你在创建时没有为它们赋值，`JVM`\
  \ 将为它们分配表中列出的默认值。这只会发生在实例变量上，我们将在未来的章节中深入探讨这一概念。正如你稍在本章后面部分看到的，如果没有提供值，局部变量不会被分配默认值；你必须在创建时为它们赋值，否则代码将无法编译。\n\
  \n### 2.1.5 在 Java 中操作变量\n\nJava 是一种强类型语言，在使用变量之前必须定义其类型。\n\n####声明变量后，我们必须赋值一个值，否则变量的存在没有多大意义。给变量赋值最基本的方法是使用简单的赋值运算符\
  \ `=`。当我们第一次给变量赋值时，我们称之为对其进行“初始化”。\n\n如果我们使用基本类型，例如，我们需要使用以下语法来声明并为这些变量赋值。\n\n```\n\
  1 int luckNumber = 7;\n2 double weight =  70.0;\n3 boolean isJavaRocker = true;\n\
  ```\n\n在 Java 10 中，我们还有定义非类型变量的可能性，该变量内部可以包含任何类型的值。\n\n例如：\n\n`var luckNumber =\
  \ 7;`\n\n`luckNumber` 变量将被推断为 `int` 类型，值为 7。\n\n我们不能像 Javascript 那样在不给出类型的情况下尝试声明变量，例如，以下代码将无法通过编译：\n\
  \n`luckNumber = 7;`\n\n### 2.1.6 变量命名规则\n\n变量命名需要遵循一些规则。在 Java 中，理想情况下我们应该简单遵循使用\
  \ `camelCase`（驼峰命名法）模式的 JavaBeans 规范。但至少知道变量可以使用哪些名称也是好的。\n\n让我们先看看 Java 中有效的变量名示例：\n\
