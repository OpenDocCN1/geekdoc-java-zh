    “Oh,” I said, as a thought popped into my head. “Scott’s great-uncle Randy has
    this cabin down by the river that he uses on occasion to get away from his wife.
    Everyone in the family has a key, including Scott. It’s not quite the type of
    accommodation Mandi’s used to, but it is secluded.”


    “Lead the way.”


    # Chapter 15


    Uncle Randy’s cabin had seen better days. But you couldn’t beat the lovely wooded
    setting, especially in October when the trees were bursting with color. There
    were no vehicles in sight when we pulled up, but I still held to the idea that
    the seven-mile trek out here was a mere warm-up for Marathon Mandi.


    Ryder went up and knocked on the front door while I went around to the back. Dated
    curtains covered every window, just like I’d remembered, so there would be no
    peeking inside. The place seemed deserted, so I went back around and met Ryder
    in the yard.


    “No one’s answering,” he said. “I don’t think anyone’s here.”


    I blew out a breath. “You know, we’re going to need to quit striking out at some
    point.”


    Ryder threw one arm around my shoulders and steered me toward his car. “Let’s
    get some lunch and regroup. We’ll come up with something. There are plenty of
    people we can talk to.”


    After taking a few steps, I said, “Oh, wait. You’ve got to see the cellar. It’s
    creepy as hell. Trust me, this will make it worth the trip.”


    “That’s trespassing.”


    “Who’s going to know?”


    I walked back toward the house and bent down to open the storm-cellar doors. The
    musty, gamey smell hit me as I descended the rickety steps. It was oddly comforting
    to know that some things around here hadn’t changed. Every flat surface in the
    place was littered with animal skins and carcasses in some stage of taxidermy.


    Ryder followed me down the steps, a disgusted yet awe-struck look on his face.
    “Wow. You weren’t kidding.”


    “Right? Uncle Randy is a hobby taxidermist.”


    “A sucky one.” Taking in the horrors around the room, he walked up to a finished
    groundhog and peered at its soulless eyes. “What’s up with the eyes? There’s something
    off about all of them.”


    “Yes, there is. He tries, but he’s never been able to quite master the art of
    it.” I went down the line of animals on one table. “This squirrel is cross-eyed.
    This fox has two different-sized eyes. Different colors, too. This owl’s eyes
    are bulging out of their sockets.” I shuddered. “He brought a particularly freaky
    raccoon to our apartment one time as a Christmas gift. I had to get rid of it.
    I felt like it was watching me wherever I went because its eyes were looking in
    two different directions.”'
