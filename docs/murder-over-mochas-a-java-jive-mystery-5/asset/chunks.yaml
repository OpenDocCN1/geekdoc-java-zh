    # Chapter 11


    Once I got rid of Scott’s man bag, I felt like a weight had been lifted from me.
    My life returned to normal, or at least my version of normal.


    I hadn’t seen Cooper at all on Monday—I’d been happy enough to assume he was giving
    me some time like he’d mistakenly thought I’d asked for. But when a bouquet of
    flowers arrived for me at Java Jive on Tuesday morning, I began to get that gnawing
    feeling in my gut again. He was doing some serious courting if he got me two sets
    of flowers in three days. The card simply read, *Can’t wait to hear your beautiful
    voice tonight,* with no signature. Anyone else I knew would have signed his or
    her name and taken the credit for sending me flowers, but Cooper was again trying
    to show that he respected my wishes by keeping our relationship a secret. I really
    needed to end this once and for all.


    At lunchtime, Pete came in the office and whistled. “Nice flowers, Jules. Must
    be from a super nice guy.”


    One more lie, and then I was breaking it off with Cooper this afternoon, and Pete
    never had to know. Referring to our now married (and very pregnant) barista and
    cook, I said, “They’re Camille’s. From Wayne.”


    Pete gave me a puzzled stare. “You sure about that?” He snatched the tiny envelope
    from the plastic pick nestled in the flowers.


    I jumped up and tried to wrestle it from his hands. “You can’t look at the card.
    It’s private.”


    He already had the card out and was reading it. “ ‘Can’t wait to hear your beautiful
    voice tonight.’ ” Turning the card so I could see it, he said, “Somehow I don’t
    think these are for Camille.”


    I hung my head. This had gone too far. “They’re mine.”


    “I know. I sent them.”


    I snapped my head up to stare at him. “What?”


    “They’re from me to you.”


    “Oh.”


    Pete’s eyebrows shot up. “Oh? That’s it?”


    “I mean, thank you.”


    “Why are you being so weird?”


    I retorted defensively, “Why didn’t *you* sign the card?”


    Squinting at me, he asked, “Exactly how many people are you expecting to get flowers
    from today?”


    Frowning, I said, “I wasn’t *expecting* flowers from anyone.”


    “But you thought they were from someone else and didn’t want me to know.”


    I didn’t reply.


    “Who did you think sent them, Jules?”


    I could feel the blush creeping up my cheeks. “It’s not important.”


    “Seems like it’s important enough to lie to your best friend about it.”


    Ooh, that got me. I moaned, “Okay, *fine*.” Covering my face with my hands, I
    mumbled, “Cooper.”


    “Who?”


    I took my hands off my face long enough to cringe and reply, “My neighbor,” before
    clamping them back on.


    Pete gently took my wrists and pulled my hands down. A smile was twinkling in
    his eyes, but he didn’t laugh at me. “Because he’s got a crush on you?”


    I sighed. “Because I’m sleeping with him.”


    His eyes widened. “Is that even legal?”


    Giving him a glare, I snapped, “Do the math, Pete. He’s in grad school, not high
    school.”


    “Oh, right. I don’t know if I should be grossed out or impressed by your cougarly
    ways.”


    “If I were one of your guy friends, you’d be high-fiving me right now.”


    Nodding, he said, “You’re probably right. So, in the spirit of not coming off
    like a sexist pig…” He held up one hand.


    I crossed my arms. “I don’t do pity fives.”


    He chuckled and put his hand down, but when he spoke, his voice wavered. “So are
    things, um, serious between you two?”


    I shuffled over and threw myself down onto the couch. “No. At least they’re not
    supposed to be. I thought we could do the ‘friends with benefits’ thing, but I
    guess that only works in rom-coms.”


    Pete came over and sat next to me. “So are you going to end it before you break
    his young little heart?”


    “Yes. I tried to already, but I didn’t do a good job of it. I’ll talk to him this
    afternoon.”


    “Good. Then you can pour out all that relationship angst onstage tonight.”


    —


    The only problem with my plan was that Cooper was not at his apartment when I
    went home to get ready for my performance, and I couldn’t get him on his cell.
    He was likely in class or in a clinical, so I only sent one text in order not
    to bother him. My nerves were beginning to get to me as I showered and changed
    into the new dress I’d bought for my performance, and they were threatening to
    take over when I heard a knock at my door.


    Pete stood there, smiling. “Wow. You look like a million bucks. You’re going to
    knock ’em dead tonight, Jules.”


    His words of encouragement were all I needed to replace my anxiety with excitement.
    He kept the conversation light on our way downtown, listing the famous musicians
    he’d met today at his job and telling me all about their recording sessions. When
    we got to the venue, the other members of our band were already there setting
    up.


    I got giddy every time I thought about having my own backup band again. Granted,
    it was only Pete on lead guitar, his friend Javier on bass, and Mick, my drummer
    from way back when, but playing with them made me feel like a real musician again.


    Setup, warm-up, and sound check were all a blur, but I did happen to notice that
    the place was filling up fast. Everyone I knew had come out to support me—even
    my parents had driven down and brought my cousin Melinda.'
