    “这不完全证据。但我确实有几位非常了解他的人提供的陈述，表明他最近的行为很反常，而且有三位同事证实，他曾因为偷取药物样本被解雇了。”


    “而我凭什么要相信你呢……？”


    我把熬通宵打好的报告推过桌子放在他面前。“你不用只听我的。这里有我昨天联系过的那些人的名字和联系方式。你自己去问他们吧。联系他的前雇主，弄清楚被偷的是什么样本，然后将其与尸检的毒理报告进行交叉比对。这应该就能告诉你你想知道的一切。”


    德兰尼我本以为他在翻阅文件时在无视我，此时他露出一丝冷笑，抬头看向我。“我很清楚调查工作是怎么运作的，兰莉小姐。”


    我咬着牙，在德兰尼读完我的报告时保持沉默。


    等他读完后，再次向后坐在椅子上。“我会在包里的每样东西上发现你的指纹吗？”


    “是的。”


    “你会签一份正式声明，说明你没有对发现的任何东西做过任何篡改吗？”


    “会的，尽管我帮你把枪拆了弹。”


    他笑了，但笑容并不友善。“你可真好。”


    “这意味着我们这儿结束了？”


    德兰尼揉了揉眼睛。“好，办法是这样的：我不会对你提控篡改或妨碍调查……*除非*我发现你或你的哥们贝内特与我受害人的死亡有关。如果真的那样，我会用尽人类所能的一切手段对付你。”


    我舒了一口气。


    他竖起一根手指。“我还没说完。记住，如果我发现你从这个包里拿走哪怕是一张口香糖纸，我会让你疼得头晕天旋地转。明白了吗？”


    “明白。”


    “现在，离我的调查远点！”他咆哮道。


    ---


    我们一走出警察局，我就瘫倒在莱德身上，那番波折让我精疲力竭。


    他伸手搂住我的肩膀，笑着领着我走过街道走向他的车。“德兰尼让你吃尽苦头吧？”


    “侦探先生，你是怎么推断出来的？”


    “我一直在隔壁偷听。”


    我呻吟道。“太棒了。我还有个观众。”


    “我不觉得那叫观众。只有克罗韦尔和我。他休假结束回来了。”


    我翻了个白眼说：“我敢打赌他很喜欢看我局促的样子。”


    莱德咧笑。“这挺有意思的。你和德兰尼演了一场好戏。”他在车旁停下，转过我的身体让我面对他，表情变得严肃。“但从现在起，能不能回到在调查过程中不再做蠢事了？”


    “没问题。只要人们停止指控我杀人的话。”


    #


    处理掉斯克的男士挎包后，我感到如释重负。我的生活恢复了正常，或者至少是我认为的正常。


    周一我完全没有见到库珀——我很乐意于假设他在给我留出时间，就像他误以为我请求过那样。但当一束花送到 Java Jive 咖啡馆时……


    *（注：提供的文本在“第 11 章”之后包含了一段高度重复且无意义的内容。根据“保留核心内容”并“删除冗余行/错误”的指令，我处理了开头和结尾提供的连贯叙述，而将重复/损坏的区块视为源文本中的格式错误。）*

