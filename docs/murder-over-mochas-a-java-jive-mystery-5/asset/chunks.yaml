    \ to do with Dr. Succubus tonight.”\n\nI wrinkled my nose. “Using his children\
    \ it is.”\n\nThis time the receptionist was a young woman who started drooling\
    \ the second she saw Ryder walk through the door. He didn’t even have to pull\
    \ out his badge to get her to agree to let us see her doctor. We didn’t have to\
    \ wait, either. She showed us back to Dr. Li’s office, and he walked in minutes\
    \ later.\n\n“My receptionist said you’re in the middle of a murder investigation\
    \ and need my help. What is it you think I can do for you?” he asked, not seeming\
    \ particularly happy about having to meet with us.\n\nRyder stared him down. “You\
    \ can start by telling us everything you know about Scott O’Malley and Silver\
    \ Spruce Pharmaceuticals.”\n\nDr. Li stared right back with the same stern expression.\
    \ “*You* can start by telling me who you are and showing me your badge.”\n\nRyder\
    \ unclipped his badge from his belt and held it out. “I’m Detective Ryder Hamilton.\
    \ This is Juliet Langley, a private investigator who’s consulting on the case.”\n\
    \nAs Ryder went to put his badge away, Dr. Li held up his hand. “Let me have a\
    \ closer look at that badge.”\n\nFrowning, Ryder extended his arm so Dr. Li could\
    \ get a better look at his badge.\n\n“Metropolitan Nashville Police Department.\
    \ You’re a long way from home, Detective. And well out of your jurisdiction.”\
    \ He stood. “Now, if you’ll excuse me, I have patients to see.”\n\nThat was it?\
    \ This guy was a real piece of work. Screw good cop/bad cop. I wanted answers.\
    \ “Wait a minute. A man is dead, and you won’t even listen to our questions before\
    \ deciding you’re not going to answer them? That’s a bunch of crap.”\n\n“What’s\
    \ ‘a bunch of crap’ is you bulldozing your way in here and trying to question\
    \ me without cause. My wife is a lawyer, and I know I don’t have to speak to you.”\n\
    \nI hopped up from my seat. “Well, it’s clear to me that you have something to\
    \ hide, Dr. Li, and I’ll bet it’s the kickbacks you’re getting from Silver Spruce.\
    \ What’s your weakness? Shiny cuff links? Fishing trips? Hookers?”\n\n“Out!” Dr.\
    \ Li roared. “One more word, and I call the cops.”\n\nI opened my mouth to fire\
