    I said, “Pete, that was a joke. I’m doing an undercover thing to get some time
    alone with a doctor.”


    “That wasn’t funny, Jules.”


    “It was kinda funny.”


    “No, not funny.”


    “Anyway, I didn’t call to get your panties in a bunch. I just wanted to say hi.”


    His voice softened. “Well, I’m glad you did. I want to see you tonight.”


    I got a text from Ryder that read, `If you don’t want that Pap smear, you’d better
    get out of there now. We’ll talk to Muniz later`.


    To Pete, I said, “Me, too. I gotta go, but I’ll call you later,” and ended the
    call as I slipped out of the exam room and hurried toward the front door.


    I made it to Ryder’s car a few moments before he did. We got in, and he drove
    us down the block before stopping so we could compare notes.


    He said, “The doctor made two calls. The first one was to a friend or acquaintance
    of `Scott’s`, I assume, from listening to her end of the conversation. She told
    whoever it was that a patient had come in raving about `Mandi` killing `Scott`.
    They must have asked her your name, but she wouldn’t give it out, although she
    gave a physical description of you as well as me. After that, she called the police
    and gave a statement, this time not giving up any information on you other than
    calling you ‘a female patient.’”


    I nodded slowly. “Hmm. Sounds like she knew `Scott` well enough to know someone
    who would be interested to know who killed him.”


    Ryder shrugged. “That could be any number of people.”


    “Right. Well, at least the police have a reason now to start looking at `Mandi`
    as the killer. If nothing else, it might goose them into spending a little time
    looking for her, which isn’t a bad thing either way.”


    “No, it isn’t. I think this went well, although we still need to try to run down
    `Muniz`. We could stake the place out and hope he leaves the clinic to go get
    lunch.”


    “Ooh, just what I wanted to do today—sit outside in a hot car.”


    “Better than a Pap smear. I assume.”


    “Eh. Barely.”


    He chuckled. “By the way, I think you need to work on your undercover game. That
    was some over-the-top soap opera acting.”


    I hung my head. “I know it was bad. I couldn’t find a good segue between ‘My baby
    daddy is dead!’ and ‘Where’d you get all these cool new medical supplies?’””


    “That’s why I advocated for the straightforward approach.”


    Wrinkling my nose, I said, “Is this where I have to tell you that you were right
    and I was wrong?”


    “Yes. Yes, it is.”


    My phone rang just then, and it was `Lizzie`. I said to Ryder, “Ooh, saved by
    the bell.” I put the call on speaker and said, “Hey, Lizzie. Ryder and I have
    you on speaker.”


    “Hey, guys. We talked to `Jason Brooks`. Sounds like he encouraged the reps to
    quietly give out kickbacks, but `McKay` isn’t so into them. However, since corporate
    is fairly lax about it, and according to `Jason`, `McKay` is—his words—a ‘limp
    dick manager,’ the reps pretty much do what they want and `McKay` looks the other
    way.”


    Grinning, Ryder murmured to me, “Jason Brooks’s assessment of `McKay` is spot
    on.”


    Lizzie continued, “And fun fact—according to `Jason`, `Scott` was not the person
    stealing the samples, at least not while he was there. It was `Chandra Thomas`.”


    “What?” I cried. “Chandra?”


    “Her mother, who lives with her, has Parkinson’s, and the cost of the medication
    for it is astronomical. She only stole that type of drug, if it makes it seem
    any better. Anyway, `Jason` demoted `Chandra` but didn’t fire her or slap her
    with any criminal charges for theft because he knew she was her mother’s only
    caregiver.”


    I blew out a disgusted breath. “Sweet `Chandra` lied through her teeth to us.”


    “Sounds like it. And `Jason` also said that when he left, all samples were present
    and accounted for, so `Chandra` did in fact stop stealing after she got caught.”


    Ryder said, “Good work. Anything else?”


    “Nope,” Lizzie replied.


    “Okay, we’ll talk later. Thanks,” I said, and ended the call.


    Ryder frowned. “So now there’s Parkinson’s drugs missing again, plus antianxiety
    and heartburn medications. `Chandra` could have wised up and decided to cover
    her theft a little better this time, stealing several types of meds to throw the
    new boss off track.”


    “If it’s `Chandra` doing the stealing, then does the drug theft even have anything
    to do with `Scott’s` death?”


    “Maybe not.”


    “What about `Jared` stealing the sodium oxybate from `Dr. Richardson`?”


    “Maybe it’s unrelated, and `Scott’s` death only has to do with the blackmail.”


    I scrunched up my face, in deep thought. “But everyone said `Scott` was using
    drugs. What’s up with that?”


    “Everyone’ as in all the people who’ve been lying to you throughout this investigation?”


    “Plus a couple of people who haven’t.”


    “There’s more than one place to get drugs, Scooby.”


    I rolled my eyes. “You know, your devil’s advocate routine is getting old.”


    Ryder grinned at me. “It’s called objectivity, which is an investigator’s best
    tool.”


    “Well, Detective, what do you propose?”

