    Ryder and I left his office, having to wade through the crowd to get out into
    the fresh air.


    Ryder asked, “Why were you on him?”


    “I was trying to get him to confess about taking kickbacks.”


    He gave me a confused look. “You were hinging your theory on him? He could have
    got it anywhere.” “False. You can’t buy designer bags like that around here. That
    was Burberry. I don’t know if you’ve heard, but there’s this cool thing called
    the Internet. You can buy stuff practically anywhere in the world and have it
    sent to you.” I growled as I got into the car. “Shut up. If he bought it on the
    Internet, why did he lie about buying it at the mall? I’m right about this.”


    Starting up the engine, Ryder said, “Your theory is still shaky. He’s a doctor,
    I’m sure he can afford it or whatever.” “One, he’s a pediatrician in a small town
    where everyone has insurance. He’s making decent money, but he’s not rolling in
    it. Enough to waste a couple hundred bucks on Burberry.” “Whatever you say, Juliet.”
    “I’m going to pretend I didn’t hear that and go on. Three, I saw the exact same
    bag in Mandi’s house along several others like it. It came from her.” He furrowed
    his brow. “How did you manage to get your hands on the bag Mandi uses for work?”
    Uh oh. When I’d told him about my previous trip to Liberty, I’d left out the fact
    that Pete and I broken into Mandi’s house. I merely told Ryder I’d spoken to her.
    When I didn’t reply, he pinched the bridge of his nose, a sure sign I was working
    his last nerve. “Tell me you didn’t steal from her.” I couldn’t say I didn’t steal
    from her either. “I didn’t steal her bag.” “Keep talking. Out with it.” I looked
    inside the bag when Pete and I went to her house. Now jaw jaw clenched. He did
    not like it when I was vague. “What did you do?” I sighed. “We um… sort of let
    ourselves into her house. Because you know, we had Scott’s purse, which had house
    keys in it. I found her bag and went through it.”


    He jerked the car over the side of the road, I guessed so he could turn his full
    wrath on me. “First Scott’s bag, then the tablet, and now unlawful entry and going
    through someone’s home? What the hell were you thinking?” he barked. “That Pete
    and I were both suspects who needed to clear our names.” “Come on, Juliet. As
    a PI, you should have known better than pull that amateur crap.” I frowned. “Hey,
    you’ve resorted to creative tactics in investigations before.” “We’re not talking
    about me right now. We’re talking about you. You could have—and still could be—arrested
    for the stupid things you’ve done this week.” “Better being arrested for a murder
    I didn’t commit.” Still fuming, he conceded, “Well, at least you didn’t get caught.”
    I kept my mouth shut about that one.


    # Chapter 18


    By the time we got to our next stop, Ryder had calmed down enough to at least
    hold a civil conversation with me. He made a move to get out of the car, but I
    put a hand on his arm. “Considering the direct approach didn’t go so great with
    Dr. Devaux, do you think we could try something different with Dr. Grantham?”
    “What do you have in mind?” he asked. “Well, Dr. Grantham is a forty-something
    divorcee who’s on the prowl for husband number four. Maybe it’s time we broke
    out Seth Davis and his charm. He’s good at winning over the ladies, or so I’ve
    heard.” And the glare came back. Seth Davis was the name Ryder had originally
    given me when we’d met, because he was working undercover at the time. I ended
    up figuring out his real name on my own, which of course caused waves in our already
    fiery relationship. Anytime I wanted to needle him about honesty, I tended to
    bring that up. “What can Seth Davis get out of her that Detective Hamilton and
    his badge can’t?” I shrugged. “Possibly a straight answer. I was thinking you
    could pretend to be a drug rep and try to buy her affection.” “With what? I don’t
    have anything to give her.” “You could always give her an invitation to dinner
    and a not-so-subtle implication of something more.” He frowned. “I said I’d help
    you investigate, not take one for the team. Besides, I don’t think Maya would
    appreciate me doing that.” “I’m not saying you have to follow through with it.
    Tell the doctor you’re a new Silver Spruce rep.”

