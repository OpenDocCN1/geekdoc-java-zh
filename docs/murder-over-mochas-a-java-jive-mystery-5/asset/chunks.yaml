    # Epilogue


    *Four weeks later*


    As we were packing up our equipment from our final band practice before heading
    out on tour the next morning, Pete said to me, “Why don’t we stop by Java Jive
    for one last coffee? I’m afraid the bile we’ll be subjected to on the road is
    not going to live up to our lofty standards of percolated perfection.”


    I laughed. “Okay, but then we go straight home. You still haven’t finished packing
    your suitcase.”


    He threw one arm around my shoulders and steered me toward his car. “Yes, dear.
    You know, I didn’t realize a perk of living with you is that you’d keep me in
    line.”


    I squinted up at him. “Are you calling me bossy?”


    “Would I do that?”


    Giving him a playful shove, I hurried around to the passenger side and got in.
    I was completely over the moon about this tour. Sure, I was scared to death, but
    more than that, I was so freaking excited about spending the month with Pete.
    Since we’d decided to go for it, our relationship had blossomed in ways I had
    never expected and couldn’t begin to explain. I had never been so happy, and I
    was pretty sure Pete felt the same way. Life could not possibly get any better.


    We got to Java Jive only a few minutes before closing. Rhonda, our newly named
    assistant manager who we’d decided to leave in charge while we were gone, was
    busy bossing everyone around (just like I would have) and getting the coffeehouse
    ready to shut down. Pete and I pulled our own espresso drinks and took them over
    to the couch. We sat and talked and laughed like we always had, and I felt a twinge
    of sadness as I realized it would be a long time before we’d be back here. I spent
    from sunup to sundown here six days a week. It was as much home to me as the home
    I shared with Pete. Aside from the emotional aspect, and as capable as our staff
    was, I was also concerned about Java Jive being out of my control for so long.


    “Hey, are you worrying about leaving the coffeehouse in someone else’s hands?”
    Pete asked. The man could read my mind like no one else.


    I laid my head on his shoulder. “Is it that obvious?”


    “Jules, everything will be fine. If Rhonda has a question, she can always call
    us. It’s not like we’re touring out of cellphone range.”


    “I know. It’s not just that.” I sighed. “I’m really going to miss this place,
    too.”


    He kissed the top of my head. “I love it that you love Java Jive every bit as
    much as Pop did.” Grabbing both my hands, he pulled me up off the couch and led
    me to the center of the room.


    Rhonda waved from the back hallway as she turned off most of the lights. “You
    guys have fun. I’ll take good care of the place while you’re gone.” Eyeing us,
    she added, “Be sure to lock up when you leave.”


    “Yes, ma’am,” I replied, stifling a chuckle. Rhonda was more than capable of filling
    my bossy shoes while we were gone.


    When I turned back around to Pete, he seemed nervous, his brow furrowed slightly
    and a forced smile fixed on his face.


    “What’s up?” I asked.


    He took both of my hands in his. “You know, Jules, the first time we met, you
    were standing right about here.”


    I smiled, remembering that day. “And you were hard at work behind the counter.
    Did I ever tell you I had a huge crush on you from seeing you around at school,
    and how terrifying it was that the first time I actually got to talk to you was
    when I had to interview with you for my job here?”


    Breaking into a grin, he said, “No. Did I ever tell you the main reason I hired
    you in under a minute is that I thought you were pretty and wanted to get the
    interview over with fast so I could hang out with you?”


    “No.”


    His expression turned serious. “While we’re confessing…when you moved back home
    after your music career went south…” He paused to take a deep breath. “It broke
    my heart. The night of your stage fright incident, I’d finally got up the nerve
    to ask you out, but after what happened I didn’t feel like it was the right time.
    Then you were gone.”


    My eyes filling with tears, I said, “Pete, I never knew that. I wouldn’t have
    left if I had. All I ever wanted was to be with you.”


    “Me, too.”


    “Why did it take us so long to admit it to each other?”


    He laid his forehead against mine. “We’re together now. That’s all that matters.”


    I kissed him. “I couldn’t agree more. Ready to go do that packing now?”


    “Almost. There’s one more thing I need to do here.”'
