    Ryder and I shared a glance. This guy.


    I said, “Are you asking on or off the record?”


    “Off,” Blake replied.


    “Off the record, yes.”


    Lizzie’s brow furrowed. “Who locks someone in a cellar to warn them away from
    investigating one day, then turns around the next day and sends an engraved invitation
    to return to said cellar to find her dead body? It makes no sense.”


    Blake said, “I think it does. After the initial rush of killing her husband wears
    off, she finally starts feeling bad about it. She can’t stomach the thought of
    sitting next to his mother and planning his funeral, so she disappears. She goes
    out to the cabin for some quiet time to think, only to be found by you, Juliet,
    one of her least favorite people. You’re clearly poking around again, getting
    closer by the second to figuring out what she’s done. She tries to threaten you
    by locking you in the cellar and slashing your tires, but deep down she knows
    you’ll never give up. Then, at some point—maybe in the dead of night when she
    can’t free herself from her nightmares—she snaps and decides to kill herself.
    She picks the one person who it won’t traumatize to find her dead to come out
    and deal with the aftermath. I think it’s more than plausible.”


    Ryder said, “I think it sounds like the plot of a TV crime drama.”


    He shrugged. “Life imitates art. So now that we’re sharing, I’ve been speaking
    with our favorite drug thief, Chandra Thomas. She swears up and down it wasn’t
    her stealing the drugs this time.”


    I said, “And you believe her because…”


    He showed me his phone. “Because she took a video of Mandi stealing meds out of
    her bag so she wouldn’t get accused of the crime.”


    Sure enough, the video showed Mandi, looking like she was trying to be sneaky,
    entering a cubicle with a nameplate reading `CHANDRA THOMAS`. She bent down and
    rifled through a duffel bag under the desk, coming up with four boxes of samples.
    Then she disappeared off screen.


    I said, “That’s great, but we no longer think the drug theft has much to do with
    the murders.”


    “Murders, plural? I was under the impression that the one today was a suicide.”


    Damn it. I probably wasn’t supposed to say that.


    Lizzie said, “If Mandi’s death was a murder instead of a suicide, then the drugs
    could have everything to do with it, especially if she and her boyfriend were
    the ones doing the stealing. Let’s not forget Jared disappeared this morning.
    He—and his wife—could have killed her on their way out of town.”


    I rubbed my forehead. “This is giving me a headache. I’m tired and hungry. I need
    to eat lunch and step back for a while.”


    Lizzie gave me a sympathetic smile. “I’m right there with you, sister.”


    Blake turned to her. “What do you mean? You already had lunch. Did you forget
    again?”


    She frowned at her husband. “You want to carry this baby for a while and see how
    tired and hungry and forgetful it makes you?”


    He looked like a deer in headlights. “No, dear. We’ll stop somewhere on the way
    back to work and get you a second lunch.”


    Ryder said, “We’ll be wrapping things up here soon, so if we don’t see you again,
    thanks for the help.”


    “Yes, thank you. We really appreciate it,” I said.


    Blake shrugged. “All in a day’s work. But I can tell you it was nice not to have
    to run point on a murder around here.” He put his arm around Lizzie. “I think
    we’re getting too old for it.”


    I was pretty sure Ryder and I were older than both of them, but whatever. I figured
    he was more referencing the fact that parenthood would take up most of their time
    and energy for the foreseeable future. I had to admit that domesticity (minus
    the baby, of course) and giving up the pro bono murder investigating would be
    a big improvement over my current life situation.


    ---


    Ryder took me to one of my favorite places, Cantina del Sol, but once we got there,
    I didn’t feel much like eating. What I really wanted to do was call Pete, if only
    to hear his voice and let him reassure me that everything was going to work out.
    The problem was, I didn’t want to tell him any of what happened since I last talked
    to him, because he’d only worry. Figuring I’d inadvertently blurt something out
    like I had with Blake and Lizzie, I thought it best to not call or even text him.


    “Are you queasy from finding Mandi?” Ryder asked, gesturing to the diminishing
    basket of chips and my untouched bowl of salsa. “If you don’t start eating some
    of these chips, I’m going to finish them off, and then you’ll be out of luck.”


    “No, I’m too scattered to focus on anything, including lunch.”


    “I could drive you to your parents’ house so you can take a nap.”


    I smiled. “Thanks, but don’t we need to continue our investigation?”


    He shrugged. “Maybe not. `LPD` is treating this as a homicide. They don’t buy
    the timeline any more than I do. Mandi was already dead or at least well on her
    way before that text was ever sent to you.”


    “I was kind of hoping you were wrong and that they’d decide it was in fact a suicide.
    Does this mean they think I had something to do with it?”


    “No, I don’t think they think that. And I have more information that I didn’t
    want to share with your newspaper friends.” He lowered his voice, even though
    the restaurant had emptied out after the lunch rush. “Harrison let me read a note
    that was found in Mandi’s pocket. It was a suicide note, but it seems bogus. They
    won’t know for sure until they can send it to the state police lab in Indianapolis
    for the questioned documents expert to have a look. It said that she was guilt-ridden
    over killing Scott. That he’d found out about her affair and become insufferable,
    especially at work when Jared was around. She came up with a plan to get him fired,
    and in the meantime she was going to work on divorcing him so she could be with
    Jared. She admitted to feeding Scott a steady stream of `levodopa` in order to
    alter his personality and make him seem aggressive and paranoid.”


    My jaw dropped. “Whoa. That’s evil.”


    “Yeah, it is. Once their coworkers started noticing his odd behavior, she started
    stealing samples and blaming him.”


    “Oh, right. She gave Daniel a sob story about Scott stealing drugs and using them,
    then Daniel turned around and narced on Scott for her. Perfect plan.”


    Ryder nodded. “The note also said that when she found out he was retaliating by
    trying to blackmail her with some made-up information, it was the last straw.
    She lured him down to Nashville and gave him a killer cocktail.”


    Frowning, I said, “Only the blackmail information wasn’t made-up. `Grantham` verified
    it.”


    “Exactly. Whoever wrote that note was covering his own ass. There was no mention
    of kickbacks or of the stolen `oxybate`, which mixed with `levodopa` would have
    made the perfect killer cocktail. What do you want to bet the note was written
    by Jared with the intent to pin the crimes he and Mandi committed all on her?”


    “Makes sense to me.”


    “It makes sense to the `LPD`, also. Finding `Jared Fisher` is their number-one
    priority.”


    “So does that mean we can go home?” I asked.


    He smiled. “We can go home.”


    ---


    I was so elated by Ryder’s good news that I scarfed down the rest of the chips
    plus my entire lunch. As we were heading to his car, he realized he’d left his
    phone at the table, so he ran back in to get it. While I was waiting outside,
    I got ambushed by none other than Detective Delaney, who was about the last person
    I expected to see here.


    He got in my face and barked, “I was under the impression you were told not to
    leave town.”


    I shook my head. “I was not under that impression.”


    A vein popped out on his forehead. “Get in your car and go back to Nashville!”


    Even though that was my plan, I wasn’t going to make him think I was doing it
    because he said so. “No.”


    “I know you won’t. You’re out of your jurisdiction. Besides, you can’t arrest
    me for coming to my hometown to visit my parents.”

