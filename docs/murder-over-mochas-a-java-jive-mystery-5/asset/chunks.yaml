    “他没带什么东西。他告诉过你打算在镇上呆多久吗？”皮特问着，一边翻找着装有几种零食和瓶装饮料的塑料袋。


    我开始整理行李箱。“没有。我猜只是直到他成功找到曼迪（Mandi）。”


    “他到底住在哪儿？”


    “在利伯蒂（Liberty），”我轻声说，“妈妈前阵子告诉我，听说他搬回来了。”


    印第安纳州的利伯蒂是我的家乡，我在那里遇到了斯柯特（Scott），并和他一起开了咖啡馆。他离开我时，我们也正住在那里。在他失踪时，我不知道他去了哪里，但我猜在我离开小镇后，他觉得回到这里继续他的生活是安全的。


    在整理他的东西时，我闻到了斯柯特古水水的味道（虽然我不喜欢，但他身上从没没有过）。这股味道让我猝不及防，勾起了与他在一起的快乐时光的回忆，令我的眼眶湿润。我看不清东西，于是停止了寻找。


    皮特察觉到了，走过来双臂搂住我。“嘿，我明白。你讨厌那家伙，但他现在已经死了。如果说还有谁能理解你现在的感受，那一定是我。我知道我会一直支持你的，无论昼夜，就像你一直支持我一样。”


    我吸了吸鼻子。我之前并没有意识到，现在的处境和他有着惊人的相似。我曾目睹皮特在女朋友告诉他她在见别人后陷入了地狱，他们争吵了，然后她在他们进一步解决任何问题之前被杀杀了。至少我有一年的时间来处理对前任的怨恨。


    在过度陷入自己的情绪之前，我提醒自己我们有工作要做。我可以等以后回到舒适的家里再大哭。镇上一个混乱地带的一间破旧旅馆并不是崩溃的地方。


    我直起身子，用袖子背擦了擦眼睛。“我没事。我需要集中注意力。”


    他拨开我挡脸的红发。“好。但当那种感觉完全袭来时——它迟早会——你知道去哪儿找我。”


    我点了点头，继续翻看斯柯特的行李箱。里面满了他的衣服——而且塞得很仓促。斯柯特通常是个严谨得令人心指的打包狂。这个箱子就像是一个直接把衣服扔进去就拉上链的人准备的。


    皮特在检查浴室，我喊道：“这个行李箱乱七八糟的。完全不像斯柯特的风格。如果他来这里的部分原因是因为他在逃避什么呢？”


    皮特从浴室走出来说：“或者是某个人。比如在逃命？”


    “也许吧。”


    皮特蹲在地板上掀开了床单。“中了。床底下着了个大包。”他伸手到床底用力拉。“电影里床底下总是装着他们需要的线索。”


    当他拖出一个旅行包放在床上时，我的胃部一阵收紧。他拉开链，发现里面是一盒接一盒包装精良的处方药，上面印着药物名称和药企名称。继续深挖，他发现了一些精美的传单和宣传材料，都在推销这些药物的疗效，还有几支印有`SILVER
    SPRUCE PHARMACEUTICALS`（银杉制药）字样的圆珠笔。他从侧面的拉链层掏出一个名牌给我看。


    他读道：“‘斯柯特·奥马利（Scott O’Malley），银杉制药销售代表。’斯柯蒂（Scotty）是个毒贩。”


    我皱了起眉。所以他从卖食物转行兜售处方药了。他的收入可能是以前工作的两倍或三倍，但感觉他像是背叛了自己。他总是强调食物是他的热情——他相信食物是“将我们聚在一起的人类骨干”。我猜那不过是他作为推销员的套路罢了。职业的改变并不重要，但这又是我件完全无法在他身上预料的事。


    皮特误以为我的皱眉是针对他的笑话，补充道：“说真的，朱尔（Jules），一个药代怎么会惹上大麻烦，导致妻子被绑架？这些样本大部分是针对`GERD`（胃食管反流病）、`帕金森病`和糖尿病的。这可不是人们在街上想要找的好药。”


    “没错，但你必须承认，这间旅馆是建立毒品业务的完美地点。也许他已经把好货卖光了。或者也许在黑市场上卖`GERD`药也能过上不错的生活。毕竟我们对毒品交易并不了解。”


    “有道理。”他叹了口气，用手抓了抓深色的短发。“不过你知道吗，我们可能在这里得出各种结论。斯柯特是个混蛋，这这一点不容否认。如果他是为了工作来这里，决定来看你并顺便逗逗你找乐呢？”


    “为什么是一年后？”


    他耸了耸肩。“那家伙脑脑子有问题。万一他的妻子只是离开了他，而他是在寻求关注呢？”


    “所以他就出现在`Java Jive`然后死在那里了？”


    “我没说我的理论有多好，朱尔。我没法断定，但他的故事里有些地方我不太信。”他打开了旅行包侧面的另一个拉链层，这次他发现了一个`平板电脑`。

    ```

    他打开它，但它设置了密码，就像他的手机一样。

