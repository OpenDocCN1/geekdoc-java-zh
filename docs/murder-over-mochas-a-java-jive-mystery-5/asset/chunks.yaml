    to make her care about her job.”


    I smiled. “Okay, so if we’re not going to hang out at the coffeehouse like we
    do every night, what *are* we going to do?”


    “Move you into my house.”


    “Tonight?” I was kind of tired.


    “No time like the present. Besides, after a whole year of me begging, you’ve finally
    accepted my offer to move in with me. I’m not giving you time to overthink it
    and change your mind.”


    —


    When we got to my apartment, it was still a gigantic mess. Not that I’d expected
    it not to be, but I was certainly wishing a magical cleaning fairy would take
    pity on me and tidy up while I was away fighting crime.


    Pete surveyed the disaster zone that was my living room. “Look on the bright side,
    Jules. Someone already emptied all the drawers for us. All we have to do is box
    everything up.”


    I laughed. Leave it to my sweet Pete to find the one positive in an otherwise
    horrendous situation.


    We worked for only a couple of hours and, to my surprise, had nearly everything
    packed and ready to go. It made me rather sad that I didn’t have enough stuff
    to warrant it taking a longer time to pack. Oh, well. It didn’t matter. Pete already
    had everything we’d need, so it was probably better I wasn’t bringing a ton of
    duplicate kitchen appliances or dishes or furniture or whatever.


    Pete looked at his watch. “Hey, you want to go grab some dinner? There’s a band
    playing downtown I think you’ll like.”


    I was sprawled out on my couch, hoping the most taxing thing I’d have to do in
    the next hour would be calling for pizza delivery. “Dude, where are you getting
    all of this energy?”


    He pulled me up into a standing position. “Come on. Don’t be an old grandma.”


    Smiling, I replied, “Life with you is never going to be dull, is it?”


    After giving me a kiss, he said, “Not even for a minute.”


    —


    We went to Big Shotz, our favorite downtown bar, but by the time we got there,
    the act he wanted me to see was already halfway through their set.


    “What do you think of their sound?” he asked, handing me a shot of our favorite
    drink from there—a Dirty Pirate Hooker.


    The band, the Maguire Girls, was an all-female acoustic band who could play anything
    from jazz standards to rock covers. They were quickly gaining popularity, already
    having an album released by one of the smaller labels on Music Row. In a town
    overrun with hungry and talented musicians, that was a major accomplishment.


    I took a sip and nodded. “I think they’re fantastic. We’ve heard them play several
    times before, though. Why the rush to come and see them tonight?”


    He shrugged, a smile playing at his lips. “You’ll see.”


    Our food arrived, and I suddenly realized how hungry I was. Badgering him for
    more information would have to wait. As we were finishing our dinner, the band
    played their final song.


    Wasting no time, Pete said, “Ready to go? I think we can move your stuff, minus
    the furniture, to my place in two trips if we use both our cars.”


    “As soon as you tell me why you insisted we come downtown to hear this band tonight.”


    He hopped up from our table and pulled me along with him. “Let’s talk where it’s
    a little quieter.”


    Once we were outside, I said, “It’s quieter. Spill it.”


    Seeming slightly apprehensive, he said, “Okay, here it is. The Maguire Girls’
    manager was at the studio last week with another client. We got to talking, and
    he started telling me that the opening act for their upcoming tour had bailed
    on them at the last minute. The tour rolls out next month, so he only has a couple
    of weeks to secure a new act. I told him I might know of someone who’d be interested.”


    I had no idea where he was going with this lengthy story about people I didn’t
    know, but I didn’t interrupt.


    He continued, “Do you know of anyone who’d like to go on tour with them?”


    “No. You’re the guy with the music industry connections.”


    He shook his head. “It’s you, Jules. *You* should tour with them. I let the tour
    manager listen to a recording of one of our gigs, and he loved it. The spot’s
    yours if you want it.”


    My jaw dropped. “Me? But I don’t tour. I mean, not anymore.”


    “Why not? You’re playing bigger venues around town now. The only difference is
    that you’d be performing in different towns.”


    That was a *huge* difference. “I can’t just drop everything and tour around the
    country. I have two jobs. Plus things are going pretty well with this guy I know…”


    Grinning, he said, “That won’t be a problem. I’m going with you. Javier and Mick
    are on board, too.”


    I could barely wrap my mind around what he was saying. Touring with Pete was a
    fantasy I’d had forever, but between his work schedule and me giving up on singing
    as a career long ago, I didn’t think it could ever happen. I felt giddy at the
    prospect, but my analytical side was doing its best to keep a lid on my excitement.


    “You’re taking off work to go? What about Java Jive? We can’t just leave it.”


    “It’s only five weeks.”


    “Oh.” That wasn’t *too* terribly long. “But—”


    He silenced my worrying with a kiss. “Say yes.”


    “Pete, do you really think we can do this?”


    “We can do anything together. You should know that by now.”


    That was true. “Okay, then. Yes.”


    —


    I felt like I was floating on our way back to my apartment. Touring the country,
    playing music every night with Pete was more than I ever could have asked for.
    And he’d made it happen because he believed in me and always had. My heart couldn’t
    get any fuller, and this was only the beginning.


    My phone rang, shaking me out of my dreamlike state. I frowned when I saw Cooper’s
    name on the display. What could he possibly want? I hit the decline button.


    “Screening your calls?” Pete asked.


    “Yes. It was Cooper.”


    “Poor brokenhearted kid.”


    I rolled my eyes. “Oh, stop.”


    A text came in from Cooper: *Your apartment has been broken into again*.


    I gasped. “What the hell? He says my apartment has been broken into again.” I
    put my head in my hands and moaned, “I couldn’t be happy for even an hour?”'
