  raw: 'As I fumed silently, Pete said, “Right, but you should at least have a clue
    what’s going on in his life. What he’s thinking and feeling. Didn’t you guys ever
    talk to each other? If you saw that he needed help, why didn’t you get him some?”


    Hopping up from the bed, she yelled, “I don’t have to answer to you! I think it’s
    time you got the hell out of my house.”


    I said, “Fine. I told Scott I’d try to find you, and I have. I’m done here.”


    As Pete and I followed her to the front door, I whispered to him, “Ask her what
    Scott meant when he said he’d stolen something important from some dangerous people.
    Keep her occupied, okay?”


    Pete nodded. “So, Mandi, why the leap from food service to peddling drugs? Is
    the pay that much better?”


    She turned and gave him a withering glance. “Duh. Look around. I make more than
    some doctors.”


    “Wow. Impressive. And with two incomes like that, you guys had some serious bank
    coming in.”


    I dawdled behind them. When I passed a table in the hallway, I grabbed an item
    displayed there and pocketed it. Pete somehow had Mandi gabbing away, so I hung
    even farther back, this time taking an item I’d found hidden behind some books
    on a bookshelf when we’d looked through the living room. I shoved it into the
    back waistband of my pants and pulled my shirt down over it. As I passed an end
    table, I swiped one more little thing.


    By now, Mandi had the door open. “I’d like to say it’s been fun catching up with
    you, Juliet, but it really hasn’t. Get out.”


    I gave her a fake smile as I passed her, trying not to let her see my undoubtedly
    lumpy backside. “Same here. You take care, now.”


    The door slammed behind us.


    Pete said, “What were you doing while I was entertaining Mandi?”


    I pulled my great-grandfather’s pocket watch out of my pocket and held it out
    for him to see. “Returning some things to their rightful owner.”


    His eyebrows shot up. “You stole stuff?”


    “How can it possibly be considered stealing when it was mine to begin with?”


    # Chapter 7


    Once we got into Pete’s car, I pulled a small guitar-shaped music box out of the
    waistband of my pants.


    When Pete looked over and saw it, his expression softened. “You took a risk to
    get back something I gave you years ago?”


    I shrugged. “It’s one of my favorite things. You gave it to me when I left Nashville.
    Remember what you said?”


    His gaze held mine. “I said this was to remind you of what you’re really meant
    to do. And that someday I was going to make sure you came back and fulfilled your
    dream.”


    Placing my hand on his arm, I smiled. “Which you did. It’s because of you that
    I ever got on another stage.”


    After a performance where I completely forgot the words to a song I’d written,
    I’d developed such a terrible case of stage fright that I’d given up on my music
    career altogether. Performing was what I’d gone to college to do, so I really
    had nothing to fall back on. I’d moved home with my parents and resigned myself
    to a life in food service, which admittedly wasn’t too bad, but it wasn’t what
    I’d planned to do with my life. When I returned to Nashville to manage Java Jive
    for Pete, he’d slowly worked on me, finally convincing me to take a baby step
    and perform at one of the coffeehouse’s open mic nights. He kept encouraging me
    to perform more, which I have, and now I had a gig in two days opening for a bigger
    act at one of the popular bars downtown. I was crazy nervous about it, but Pete
    was my lead guitarist, so he’d be right there with me every moment.


    He covered my hand with his. “I may have given you a few pushes, but when you’re
    performing, it’s all you up on that stage. There’s no one else in the world I’d
    rather listen to.”


    I felt all gooey inside at his words, but now was not the time to take my head
    out of the game. If anything, talking to Mandi had made things muddier, so I felt
    like our investigation was in even worse shape than before. I pulled the last
    item I’d pinched out of my pocket.


    Pete stared at it for a moment. “What’s so special about a TV remote?”


    “Nothing. I took this to irritate her.”


    He started the car and began driving down the street. “Now *that’s* technically
    stealing.”


    He had a point. I rolled down the window and chucked it out. It shattered when
    it hit the sidewalk. “There. Now all I’ve done is move it.”


    “And destroy it.”


    “Actually, the *sidewalk* destroyed it.”


    He chuckled and kept driving. “I should know better than to try to argue with
    you.”


    —


    We stopped at a local ice cream stand, Sweet Liberty, to get a cold drink and
    make more plans for the afternoon. Ryder and Maya had called to let us know they’d
    also figured out Mandi wasn’t missing. From looking into her background and checking
    her financials, they’d gleaned exactly nothing, just like we had on Scott. They
    promised to do some more digging, but I was starting to get the feeling they weren’t
    going to find anything.


    Sitting on a bench next to me at the outdoor eatery, Pete said, “You know, maybe
    it’s not out of the question that Scott was cuckoo. There’s nothing we’ve found
    that points to him doing anything illegal, aside from maybe stealing some sample
    drugs. The big bag of drugs in his motel room might have been his stolen stash
    instead of the legit samples he carried around for work. I mean, if he was using
    like Mandi said he was, what if he accidentally poisoned himself with a poorly
    mixed drug cocktail before he came into Java Jive? Maybe it took a little time
    to fry his system, and he just happened to be in our place when it dealt the final
    blow.”


    “So you’re saying we were listening to the ravings of a lunatic, and there are
    no ‘dangerous people’ and no kidnappers after all? That everything he said was
    the result of a bad trip?”


    “Yeah. Mandi said she had no idea what he’d supposedly taken from those so-called
    ‘dangerous people.’ Maybe his death isn’t so mysterious. It could have been an
    accident.”


    My gut didn’t agree. “I see your point, but I feel like we should keep looking.
    We’re here. Might as well use the time we have left today to cover all our bases.
    We need to speak with some of his coworkers and some of his friends. That should
    paint us a more accurate picture. Oh, and I still have to read through his texts
    and personal emails on his phone. If I can stomach it.”


    Pete laughed. “What kind of a friend would I be if I let you stomach that nonsense
    alone?” He scooted closer to me and put his arm on the back of the bench behind
    me. “We’re in this together.”


    I smiled and got out Scott’s phone, holding it between us so Pete could read along
    with me. I scrolled through his emails, relieved to find them mostly spam, but
    one caught my eye. It was from someone named Doug McKay at Scott’s former employer,
    Silver Spruce Pharmaceuticals.


    Once I pulled up the email, Pete read, “ ‘Dear Mr. O’Malley, at this time we must
    ask you to please refrain from entering the office building housing Silver Spruce
    Pharmaceuticals under any circumstances. Your employment was terminated earlier
    this week, and you no longer have clearance to enter the building per security.
    If you continue to violate the terms of your severance, criminal charges will
    be filed against you. Also, please be advised that if you do not return the pharmaceutical
    samples and the tablet belonging to Silver Spruce Pharmaceuticals, civil charges
    could be filed against you as well. Sincerely, Doug McKay, Ohio Valley District
    Manager, Silver Spruce Pharmaceuticals.’ ”


    I shook my head. “Wow. His manager sent him a formal cease and desist. Scott must
    have pissed him off.”


    Pete scrolled down to Scott’s reply. “Oh, this is a nice response. ‘Eff you’ in
    all caps. You sure this is the same guy you were engaged to, Jules? I always thought
    he was a knob, but I never got a stark-raving-mad vibe from him.”'
