    never knew him to carry a gun. I don’t even think he owned one when we were together.”
    I stopped to shake my head. “Wait. How did you get your hands on Scott’s man bag?
    You didn’t take it with you to the station, because you didn’t have it when we
    left. And Java Jive is on lockdown until the crime scene unit is done with it,
    so you couldn’t get back in there to grab it.”


    “You know after Scott was…um…gone, and I went to get you some water?”


    “Yeah.”


    Pete shrugged. “Call it intuition or déjà vu—I knew this thing was going to turn
    into a huge cluster—which it has—so I hid the bag in the bushes near the back
    door. I wanted you to be able to have a look through it before the police got
    it. And I didn’t want to tell you about it in front of Ryder Likeapony. I know
    he’s supposedly on our side and all, but he’s still a cop.”


    I was touched at the risk he took for me. “Thanks, Pete.”


    At the same time, I was concerned he’d created a problem. The police were going
    to be looking for Scott’s personal effects, like his keys, phone, and wallet.
    When they didn’t find them in his pockets, in his vehicle, or at the scene of
    his death, it was only a matter of time before they started asking questions.
    And of course Pete and I would be the first people they’d ask.


    For now, though, we had the upper hand. Maybe. Depending on if there was anything
    of use in Scott’s man bag. I opened the bag and emptied the contents onto my kitchen
    counter. As I suspected, we found his wallet, keys, phone, spare change, and lip
    balm. There were also a few crumpled receipts, an old-fashioned motel key, and
    some empty candy wrappers.


    “The phone is password protected, so it’s pretty well useless.” Pete picked up
    the motel key and wiggled it at me. “This is what I’m most interested in. Scott
    said he was in trouble. What do you say we do a little poking around in his motel
    room and see what else we can find? He was staying at the Franklin Motel. It’ll
    be just like old times.”


    I chuckled uneasily. The first time Pete and I had investigated a murder (the
    other time I’d been a person of interest), it had led us to the Franklin Motel.
    It was a horrendously run-down place in a seedy part of town, and we’d had a rather
    dangerous experience there. I didn’t know if I was up for it again, especially
    tonight. Sure, I tracked shady characters at my second job, but I never withheld
    evidence from the police or did any kind of breaking and entering.


    When I gave no response, Pete threw his arm around my shoulders. “I know you’re
    a fancy-pants PI who doesn’t break the rules anymore, but this is kinda serious.
    I think we need to do whatever it takes to clear both of our names. I’d much rather
    get a slap on the wrist for a B and E I did commit than a few decades with a cellmate
    named Tiny for a murder I didn’t.”


    I held up my hands. “Okay, okay. I get your point. Let’s go.”


    —


    During the drive over, I filled Pete in on the rest of my conversation with Scott
    and repeated what Detective Delaney had said to me during my interrogation. Pete
    said Delaney’s interrogation of him went largely the same way, so he had no additional
    information to add.


    When we pulled up to the aging motel, which was crawling with unsavory characters
    even at this ungodly hour, I said, “Something feels off about this. Scott O’Malley
    would never even consider stepping foot inside a fleabag motel, much less actually
    rent a room at one and stay overnight. Plus, he would have peed himself having
    to walk past all the dealers and pimps and hookers wandering around.”


    Pete cast a sideways glance at me. “You want to know what I think?”


    “Don’t I always?”


    “I think he came to this fine establishment so he could give a fake name, pay
    in cash, and remain unnoticed. You want a room at a posh hotel downtown, you have
    to give them your life story and your credit card. If he was trying to keep a
    low profile, this is the place to do it.”


    “I guess you have a point there.”


    Pete grinned. “Don’t I always?” He reached into the backseat and retrieved Scott’s
    gun from the bag, then stuffed it into the back waistband of his pants.


    My mouth dropped open. “What are you *doing*? This little field trip of ours is
    dangerous enough without you running around with a gun.”


    “Do you recall what happened the last time we poked around at the Franklin Motel?
    I had to assault a guy to get us out of here in one piece. If we get into a sticky
    situation again, holding someone at gunpoint will be much simpler. As for me ‘running
    around with a gun,’ it’s okay because this thing isn’t even loaded.”


    He got out of the car, and I followed him, complaining. “Oh, well that totally
    makes it okay. So what happens if one of those *fine* gentlemen over there decides
    we’re easy pickings and holds us at gunpoint with a gun with actual bullets in
    it?”


    “We run like hell. Now zip it and act like you own the place. Room ten.”


    On our way to room ten, as we passed the smelly green bog that had at one time
    been a swimming pool, we got offered both drugs and sex, but we did not in fact
    get held at gunpoint. Once we were inside the room, I leaned against the door
    and breathed a sigh of relief.


    Having almost forgotten an important part of our sleuthing (not leaving fingerprints
    behind), I reached into my pockets and produced two pairs of my winter gloves.
    I handed Pete the pink pair. “Here. These will look pretty on you.”


    Pete grunted at me, but obediently put on the gloves and then grabbed a chair
    and wedged it under the doorknob. “Now at least we won’t be interrupted.”


    I put on my gloves and looked around the icky room. They hadn’t changed a thing
    about their rooms (or probably cleaned any of them) since we were here a year
    ago. The stained orange shag carpet, the seventies wallpaper, and the nasty, nasty
    paisley bedspread added to the overwhelming dreariness of the place. I still couldn’t
    wrap my mind around Scott having been here, but a suitcase with his name on the
    tag sat open on the bed.'
