    Nodding slowly, Blake said, “Right, because if he’d been in on it, he wouldn’t
    have been threatening Silver Spruce that he’d ruin them over it.”


    “Probably not. Now, I have no way of knowing whether this is related to anything
    we’ve been discussing, or if Scott was into another underhanded deal as well,
    but something he managed to tell me before he died was that he had taken something
    from some ‘dangerous people,’ as he called them.”


    “Was he talking about the drugs he stole?”


    “I don’t know. He said the people had threatened him more than once because of
    what he did. He came to me because he was convinced they’d kidnapped Mandi and
    would kill her if he went to the cops. However, the next day I found Mandi alive
    and well at home, saying she’d been on a business trip, insisting that Scott was
    going nuts from all the drugs he’d been taking. I’m not sure what to believe.
    But given the unusual circumstances—and the nagging feeling that Scott was murdered—I
    think we need to start digging into Silver Spruce and find out if this kickback
    thing is worth killing or kidnapping over.”


    Lizzie wrinkled her nose. “But if Mandi is in on it, why would she have been kidnapped
    or threatened?”


    Frowning, I replied, “See, that’s the piece that doesn’t fit for me. I don’t get
    Mandi’s involvement in this.”


    Julia said, “So we need to find Mandi.”


    “Even if we do, we may not get the truth out of her. I think we should start with
    finding out who’s giving kickbacks and who’s getting them.”


    Blake said, “Since you found Mandi’s swag stash, we can assume at least some of
    her customers are getting kickbacks.”


    “Yes, and since Mandi is still in training, can we also assume her trainer, Jared
    Fisher, is in on it, as well?” I asked.


    Nodding, Julia said, “If he’s training her, I suspect he’d have to be in on it,
    or at least have an inkling that something shady is going on.”


    “By the way, Jared Fisher is also MIA today. Ryder and I ran around town this
    morning looking for him, but he’s nowhere. According to office gossip, Mandi and
    Jared are having an affair, so there’s that.”


    Blake seemed pretty excited, fidgeting with nervous energy. “This case is getting
    more interesting by the minute. I love the tangled ones.”


    I hated the tangled ones. “This one has way too many players right now. Anyone
    from the reps giving kickbacks to the doctors getting them or the higher-ups at
    Silver Spruce would have something to gain by silencing Scott. We need to start
    weeding some out. I think we should split up and visit some doctors this afternoon.
    I want to wait before speaking to any of the Silver Spruce reps again. I don’t
    want them to think we’ve switched our focus onto looking at them. Julia, can your
    husband get us a list of the doctors who’ve been seen out with Silver Spruce reps?
    And any others he suspects might be getting kickbacks?”


    “Sure.” She got out her phone and typed a quick text.


    I stood, suddenly remembering I had access to a key piece of information. “I’m
    going to work on getting us a list of Silver Spruce’s local clients.”


    Blake furrowed his brow. “You think Silver Spruce is simply going to hand that
    over to you? Or do you have an inside source you’re keeping to yourself?”


    Winking, I replied, “I’d tell you, but then I’d have to kill you.”


    ***


    I found Ryder pacing outside the auto repair shop, which was only a few blocks’
    walk from the *Chronicle* office on the town square.


    “How’s it going?” I asked gently, already knowing the answer from his stiff posture
    and perma-glare.


    “These bozos went to lunch at the same time, so all work halted. They haven’t
    even started on my car yet,” he fumed.


    I hid a smile. “Right. Things move at a slightly slower pace here than what you’re
    used to. Good ol’ boys are never in a hurry like you city boys.”


    “How did you stand living here for so long?”


    Ignoring his question, I said, “If they went to lunch, why didn’t you go to lunch,
    too?”


    “I’m too angry to eat.”


    “No, you’re not. You’re hangry. You were already angry, and it’s past your lunchtime,
    which makes you grumpy, so everything has snowballed. If we don’t get some food
    in you soon, you’re probably going to explode.”


    The corner of his mouth turned up. “How is it that you know me so well?”


    I chuckled. “Experience. Plus, men only have two basic needs—food and sex. I had
    a fifty-fifty shot at being right.”


    “That is a sexist attitude.”


    “Tell me I’m wrong.” When he couldn’t come up with a rebuttal, I changed the subject.
    “I need to get something out of your trunk.”


    He nodded to his car sitting in the shop’s parking lot and we headed in that direction.
    “What did you find out from your new friends?”


    I retrieved Ryder’s extra set of car keys we’d stashed in my purse and opened
    the trunk, pawing through my overnight bag to find Scott’s tablet. “Long story.
    I’ll tell you over lunch. The good news is, we have some leads. The bad news is,
    there’s a lot of them.”


    # Chapter 17


    Ryder and I walked back across the square to Sam’s Tavern. While we ate, I filled
    Ryder in on everything I’d learned.


    “We need to find Mandi,” Ryder said.


    “And Jared Fisher,” Julia added.


    “I think she’s in trouble,” I replied. “But we need to get back to the office.”


    My phone rang. When I saw Pete’s name, my irritation dissolved. “I need to take
    this,” I called.


    “Hey, Pete,” I said breathlessly.


    “Hey, Jules,” he mumbled. “Hope you don’t mind if I eat while we talk. I have
    like three minutes for lunch, and then I have to get back to the studio. The snippy
    little starlet we’re working with today doesn’t eat, so she doesn’t expect anyone
    else to, either.”


    I laughed, happy to think about something besides the case. “Ooh, she sounds like
    fun.”


    “Her momager is even worse. She’s been breathing down my neck all morning, telling
    me how to do my job. She keeps whining, ‘My daughter sounds flat. Fix it. Don’t
    you have `Auto-Tune`?’ She doesn’t seem to understand that `Auto-Tune` can only
    do so much when you’re singing the wrong notes. But enough about my first-world
    problems. How’s the investigation going?”

