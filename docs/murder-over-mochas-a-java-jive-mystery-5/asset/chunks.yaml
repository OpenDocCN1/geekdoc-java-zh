    莱德的声音听起来很紧。“我不是那个——”


    “听我说，大个子。我今天行程排得很满，但我保证今晚喝酒时会全神贯注陪你。你觉得晚上八点在 `Vecchio’s` 见怎么样？”


    沉默片刻，他回答道：“没问题，医生。”


    几分钟后，我看到莱德大步走出办公室，姿态僵硬。他把自己甩进驾驶座并启动汽车，然后冲出了停车场。


    “我从没想过会看到——或者说，听过——塞斯·戴维斯在一个女人面前碰钉子。”


    他皱起眉。“我今晚不是和她约了会吗？”


    “是，但她在其他方面很明确地拒绝了你。很明显，她并不想要推销的东西——当然，除了性以外。”


    “而她又得不到。”


    我轻笑一声，但在他开车回理查德森博士的办公室时，我保持了沉默。


    莱德似乎对约会这件事依然耿耿于怀，刷卡要求立即与理查德森博士会面，他那套硬汉的戏码把可怜的老女接待员吓得半死。不到一分钟，我们进了医生狭小的办公室，我们手里都拿着一瓶冰水，那是那位神神经过经过的接待员提供的。


    理查德森博士走了进来，满脸笑容，但有些戒备。“今天有什么能帮你们的吗？玛丽说你们和警察在一起？”


    莱德点点头。“我们正在调查斯科特·奥马利的死亡。他是一个银杉松——”


    医生皱了皱眉。“一个银杉松的代表。我认识他。他从我办公室里偷了一些药。我本该报警的，但那个像地地鼠一样的 `McKay` 恳求我让他内部处理。现在，当然了，那个男人死了，很可能是因为偷的那些药过量导致的，所以他已经受到了足够的惩罚了。”他摇了摇头。“你知道的，这种阴暗、不专业的行为正是我我拒绝与银杉松代表会面的原因。我没时间理这些胡闹。如果他们想留下药物样本，就留给我的接待员。他们不再有面见我了。”


    我问道：“你注意到银杉松代表除了和斯科特的事件外，还做过其他阴暗的事情吗？”


    理查德森博士嫌恶地哼了一声。“我该从何说起？镇上的几个同事医生似乎对银杉松代表喜欢提供的那些小好处印象深刻。单我个人而言，我比他们更有正直。”


    莱德说：“所以你知道其他医生在收回扣。”


    “在某些人身上这显而易见。比如这栋楼里的某个医生，突然收集了一堆贵领带，其中任何一条都够付他那辆破车的月供了。”


    我对着莱德低声说：“早告诉过你了。”


    理查德森博士继续道：“还有那些白痴，周末大摇胆地和他们的代表跑出去喝醉。世界上没有免费的酒。”


    “确实如此，”我回答道。“上次斯科特进进你办公室时，他表现如何？”


    “我本人没见到他。玛丽和他他聊过。她说他很无礼且好斗。”


    莱德问道：“他是怎么偷走你的药的？”


    医生叹了口气。“他坚持要洗手间，那里就在我们的物资室旁边。玛丽，保佑她那老心肠，让他进了这里，尽管即使她想拦，也拦不住他。当天晚些时候，我们发现我放药物样本的柜子被撬了。不需要天才也能看出是谁干的。”


    我点了点头，希望理查德森博士能为我们解开斯科特行为之谜。“从你办公室丢失的 `sodium oxybate` 并不是斯科特被指控偷窃的唯一药物。根据他的经理说，最近其他药物代表的包里也丢失了
    `levodopa`、`benzodiazepine` 和 `H2 抑制剂` 的样本。使用其中任何药物是否会导致一个人的性格变得变得特别焦躁和愤怒，甚至可能产生幻觉？”


    “绝对会。`levodopa` 很容易就能做到。那些是非常常见的副作用。”


    “任何这些药物的过量会死人吗？”


    “`H2 抑制剂`可能不会，但其他的可能会。将 `levodopa` 或 `苯二唑西平` 与 `sodium oxybate` 混合几乎可以确保死亡。在为睡眠障碍患者配发
    `sodium oxybate` 时，我必须非常小心，以确保他们与其他服用的药物之间不会发生任何相互作用。”


    “有人可能摄入这些药物却不知道吗？”


    理查德森博士打量着我。“你是问我是否有人可以在不被察觉的情况下把其中任何一种加入别人的食物或饮料中？”


    “是的。”


    “我想可以。它们都有液态，所以我认为非常简单。”


    我瞥了一眼莱德，他正担心地看着我。


    莱德转向医生。“感谢你的时间，先生。既然你的接待员处理了斯科特的事，我们在这里想和她谈谈。”


    “当然。我让她进来。”理查德森博士走出了门。


    莱德低声说：“我知道你还在执着于谋杀案，但斯科特完全可以自己这样做，甚至没有意识到潜在的后果。”


    我低声回答：“或者他妻子完全可以轻易毒死他。”


    “为什么要要在纳什尔做？”


    “为了制造不在场证明。你在家里死掉，警察会盯着你妻子；而在你妻子明明在几小时车程的地方，你在另一个地方死掉。”

