  trans: '

    “同感。我很感激。”皮特（Pete）向莱德（Ryder）伸出手。


    “不客气。”握完手后，莱德上车开车离开了停车场。


    皮特转向我。“好了，既然我们不再是头号和二号公敌了，你想做点什么来庆祝一下？”


    在我们分开的这段时间里，虽然并不长，但感觉像过了一辈子，发生了很多。我再次得到了一个残酷的提醒，意识到生命是短暂的。这让我明白，当你找到了你爱并信任的人时，没有理由等到你的生活不再是一团糟时才和那个人在一起。按照世界的标准，我的生活可能永远不会完美，但我知道，如果没有皮特在我的身边，我的生活对我来说也永远不会完美。


    我双臂环住他的脖子，踮起脚尖快速吻了他。“我想搬进我最好的朋友一起住。”


    他露出了我见过的最灿烂的笑容，手臂搂住我的腰。“关于这个，我想我不想再只做你的朋友了。”他俯下身，给了我一个深情的吻。


    当我们分开分开后，我回答道：“我也是。”


    # 第 25 章


    在回家的路上，我从莱德和我的调查开始说起，向皮特讲述了整个故事。他只停了一次车，因为发现我们曾刻意被困在发现曼迪（Mandi）尸体的同一个地下室里而发了火。他对我直到现在隐瞒这件事并不高兴，但承认如果早早，他会早点开车过去的，而这正是我没有告诉他的原因。他的老板已经对他今天早下班感到非常不悦了。


    一旦回到纳什维尔，皮特说：“你今晚想做什么？随尽管说。”


    “我们也许应该去 Java Jive 看看，确保一下——”


    “不用。罗娜（Rhonda）把那里打理得很好。尽管她很懒散，但管理得出奇地严密。也许她需要的只是额外的责任来让她在意自己的工作。”


    我笑了笑。“好吧，那么如果我们不再像每晚那样待在咖啡馆聚聚，我们*到底*要做些什么？”


    “把你搬到我家里去。”


    “今晚？”我有点累。


    “现在就是最好的时候。而且，在我恳求了一整年之后，你终于接受了我搬在一起住的提议。我不会给你时间去胡想并改变主意。”


    ***


    当我们到达我的公寓时，那里还是一团大糟。并不是说我预料到会这样，但我确实希望有一个魔法的清洁仙女能怜悯我，在我外出打击犯罪期间帮我打扫一下。


    皮特审视着我客厅这片灾难区。“从好的一面看，朱（Jules）。有人帮我们清空了所有的抽屉。我们只需要把所有东西装进箱子里。”


    我笑了起来。还是我亲爱的皮特，能在这种如此糟糕的情况下找到唯一的积极的一面。


    我们只忙了几个小时，令惊讶的是，几乎所有的东西都打包好准备就绪了。我的东西没有多到需要花更多时间打包，这让我感到有些难过。噢，也无所谓。皮特已经有了我们所需的一切，所以我不带一大堆重复的厨房电器、餐具、家具或之类的东西可能更好。


    皮特看了一眼表。“嘿，你想去吃点晚饭吗？我想市中心有一支你会喜欢的乐队在表演。”


    我趴在沙发上，希望接下来的一个小时里，我最费力的事情就是打电话叫比萨卖。“哥们儿，你从哪儿来这么多精力？”


    他拉着我站了起来。“来吧。别像个老奶奶一样。”


    我笑着回答道：“和你在一起的生活永远不会无聊，对吧？”


    他吻了我一下，说道：“哪怕一分钟也不会。”


    ***


    我们去了 Big Shotz，那是我们最喜欢的市中心酒吧，但当我们到达那里时，他想让我看的表演已经进行了一半了。


    “你觉得他们的音乐怎么样？”他问道，同时递给我一杯我们在那里最喜欢的饮料——肮脏海盗钩女（Dirty Pirate Hooker）。


    这支乐队“马瓜利尔女孩”（Maguire Girls）是一支全女性原声乐队，可以演奏从爵士标准曲到摇滚翻唱的任何曲目。他们正在迅速流行，已经在音乐街（Music
    Row）的一家较小的唱片公司发行了一张专辑。在一个充满渴望且才华横溢的音乐人的小镇上，这是一项巨大的成就。


    我抿了一口，点了点头。“我觉得他们很棒。不过，我们之前听过他们表演好几次了。为什么今晚急着来看他们？”


    他耸了耸肩，嘴角带着一丝微笑。“你会看到的的。”


    食物送到了，我突然意识到自己有多饿了。向他打听更多信息得等以后了。当我们吃完晚餐时，乐队演奏了最后一首歌。


    皮特毫不浪费时间地说：“准备好走了吗？我想如果我们用两辆车，分两次就能把你的东西（家具除外）搬我家那里。”


    “只要你告诉我你为什么坚持我们今晚来市中心听这支乐队。”


    他从桌旁跳起来，拉着我走。“我们去安静的地方的地方。”


    当我们走到外面后，我说：“这里安静了。说说吧。”


    他似乎有些顾虑，说道：“好吧，是这样。”

