    Donning my gloves again, I whispered to Pete, “Watch the door while I poke around.”


    He did, and I unzipped the duffel as quietly as I could. It looked just like the
    one we’d seen in Scott’s hotel room, and sure enough, it was stocked with samples
    of drugs, like the other one had been. But when I dug down past the promo materials,
    it got interesting. No cheap giveaway pens here. This was full-on swag. There
    were boxes of designer Burberry, Ferragamo, and Armani scarves and neckties, all
    made of gorgeous brightly colored silk. Under those were several boxes of sparkly
    earrings and shiny cuff links, by designers like Cartier and Montblanc.


    ### The Confrontation

    Engrossed in my digging, I hadn’t realized it had become quiet outside the door—no
    more footsteps or slamming doors. Pete whispered, “Do you think they’re gone?”


    I shrugged, peeled off my gloves, and went over to listen at the door. There was
    no sound outside, but I was not giving up our hiding spot on the off chance that
    someone had been here and gone in this short a time. Then, I began to hear faint
    footfalls, as if on thick carpet—like the plushy, white carpet in the bedroom
    we were in. Pete must have heard them, too, because he grabbed my hand and held
    tight. This was it.


    Suddenly the door wrenched open, and a black handgun appeared in our faces. A
    female voice demanded, “What are you doing in my house?”


    When I focused on the owner of the voice, my jaw dropped. “`Mandi? I thought you
    were kidnapped.”


    Damned if Mandi wasn’t even more beautiful than she’d been before, her long mane
    of once dark hair now a perfectly blended multi-tonal shade of blond. And from
    the looks of it, Scott’s spending spree had included a boob job for his previously
    flat-chested wife.


    Mandi stared at me for a moment, then dropped the gun to her side. “Juliet? What
    the…” She shook her head as if to clear it, then again pointed the gun in our
    faces. “For real, you shouldn’t be here. What are you doing in my house?”


    ### The Counterattack

    Pete and I put our hands up slowly. Mandi, not being the brightest woman I’d ever
    met, had her gun close enough to me that my hands were only inches away. She also
    held it with only one hand, which told me she had no real intention of using it
    on us, or at least had no real interest in accuracy. And little did she know that
    after I’d been held at gunpoint a few months ago, Ryder had made it his mission
    in life to teach me a few tactics to fight back in those types of situations.


    “Out of the closet, bitches,” she sniped, taking her eyes off us for a moment
    when she took a step backward.


    In that instant, I grabbed the side of the barrel of her handgun with my left
    hand and smashed my right palm into the underside of her wrist. Her wrist buckled,
    causing her grip on the gun to loosen. I ripped the gun from her hand and turned
    it on her. Wide-eyed and mouth hanging open, she backed away from me with her
    hands up.


    I smirked at her. “Who’s the bitch now?”


    Pete whispered in my ear, “Jules, that was so badass!”


    Her voice trembling, Mandi said, “You’ll fry for breaking into my house and shooting
    me.”


    “Which is why I’m not going to,” I replied.


    I ejected the clip from the gun and racked the slide to empty the chamber (which
    was already empty, another sure sign she had no intention of shooting us in the
    first place). I threw the gun at her feet and put the clip in my pocket.


    Mandi got all pouty, but picked up her gun and threw it on the bed, then backed
    away so Pete and I could exit the closet.


    ### Suspicion

    I said, “Let’s try this again. Hi, Mandi. Long time no see. You remember my friend
    Pete?”


    Pete gave her a nonchalant wave. “Hey, Mandi.”


    She rolled her eyes at us. “What do you want?”


    Something wasn’t right about her. This woman before us wasn’t a grieving widow.
    I didn’t think it was possible that she wouldn’t have already been contacted about
    Scott’s death, especially since she was hanging around at home and clearly not
    kidnapped. Scott had been dead for well over twelve hours, and even though the
    police hadn’t had his license for a quick positive ID, I’d given them his name,
    his wife’s name, and their town of residence. It’s not like there were a bunch
    of Mandi O’Malleys running around in Liberty for them to track down.


    I said gently, “Have you heard about Scott?”


    Her expression clouded over, but she seemed almost more mad than sad. “Yeah. The
    police asked me if I thought you’d have a reason to kill him.” She smirked. “I
    told them hell yes.”


    I shot Pete a look and tried not to growl. “I didn’t kill him. We tried to save
    him, but…evidently he’d been poisoned. There was nothing we could do. I’m sorry
    for your loss.”


    “Sure you are. You had to have hated the guy after what we did to you.”


    Pete, sensing the irritation building in me, said, “Let’s put a pin in that for
    now, okay? Scott told us you’d been kidnapped. You seem to not be kidnapped. Did
    you manage to get free or something?”


    ### The Truth Revealed

    She shook her head. “I was never kidnapped. Scott wasn’t doing so great lately.
    He’d become delusional and paranoid. He was convinced everyone was out to get
    him.”


    I stared at her for a moment, trying to decide whether or not she was giving me
    the whole story—and whether or not her story was even true. Even though Scott
    wasn’t quite himself last night when he was telling me about the trouble he was
    in, I didn’t feel like he was delusional or making it up. He’d seemed genuine,
    aside from being purposely vague about his involvement in the shady business dealings.


    “Scott wasn’t a user before. Why start now?” I asked, so badly wanting to add,
    “Did you drive him to it?”


    Mandi frowned at me. “How should I know?”


    “Um, because you’re married to him.”


    She shrugged, coming off totally indifferent. “I was married to him. You probably
    don’t know this, because you’ve never been married, but you’re still two individuals
    once you become husband and wife. I couldn’t control what he did, and I didn’t
    try to.”

