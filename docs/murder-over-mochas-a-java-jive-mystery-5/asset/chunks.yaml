  raw: '“You’re not visiting your parents. You and Hamilton are here poking into my
    investigation.” As Ryder came out the door of the restaurant, Delaney yelled at
    him, “The captain is going to hear about this.”


    Ryder rolled his eyes at Delaney and ambled toward us in no particular hurry.
    “Don’t you have anything better to do than drive all the way from Tennessee to
    harass us, Delaney?”


    The older detective glared at us. “I hear you two knuckleheads found my vic’s
    dead wife.” Smirking at me, he added, “You can imagine my surprise that you of
    all people were around when the woman your ex traded you in for kicked it.”


    I frowned. “Oh, so now I’m on the hook for two murders I didn’t commit. Do you
    ever do any actual investigating, or do you pick your suspects’ names out of a
    hat?”


    Ryder let out a snort of laughter, which made Delaney’s face turn purple.


    He exploded, “That’s it. You either go with me to the local station right now
    and turn over all the information you’ve gathered from your little sleuthing adventure,
    or the next time either of you sets foot inside the city of Nashville, I will
    have you arrested for obstruction. I’m not screwing around.”


    Ryder said, “Give us a minute,” and pulled me aside. “I promised the local boys
    that we’d stop by the station on our way out of town and drop off a flash drive
    with our findings and case notes. We might as well let Delaney think it was his
    idea and play along, otherwise he’s going to cause trouble for you until he closes
    his case. Which may be never, considering he’s such a bumbling idiot. What do
    you say?”


    “Anything to get that guy off my back.”


    —


    Delaney followed us to my parents’ house, thankfully staying in his car while
    Ryder and I packed up our stuff and said our goodbyes. Then he stuck to our back
    bumper like glue all the way to the police station.


    We headed into the station, Delaney still on our heels, and waited for Jack or
    William to be available to collect our information.


    William appeared and said, “Hey, guys. Thanks for coming back over. While I have
    you here, I’d like to take a look at the files you brought and make sure I don’t
    have any questions before you—”


    Delaney hijacked the conversation. “You Johnson?”


    “Yeah, and you are?”


    Delaney stuck out a meaty paw, and the two of them shook hands. “Detective Tom
    Delaney, MNPD Homicide. We spoke on the phone. I’ll be sitting in on this meeting,
    too.”


    William’s eyebrows shot up. “Detective Delaney. I didn’t expect you to drop everything
    and drive up here after I’d already brought you up to speed on my case.”


    Delaney grunted and glared at me. “That’s not the only reason I’m here.”


    William fought the smile pulling at the corner of his mouth as he glanced from
    Delaney to me. “Okay, then. I guess you can *all* follow me.”


    He brought us to the cops’ breakroom on the main floor. I guessed now that I’d
    been ruled out as a suspect (at least in the LPD detectives’ eyes), I no longer
    had to be treated like a delinquent.


    Once we were all seated around the large table in the center of the room, Ryder
    took a flash drive out of his pocket and slid it across the table to William.
    “That’s everything we’ve found on the O’Malleys and their acquaintances, Silver
    Spruce Pharmaceuticals and its employees, and a few doctors who were being blackmailed
    by Scott O’Malley.”


    William plugged the flash drive into the laptop in front of him. “Again, we appreciate
    your help and cooperation, Detective Hamilton and Ms. Langley.” He took a few
    minutes to peruse the files, which settled us into an uncomfortable quasi-silence,
    the only thing audible being Delaney’s mouth breathing.


    “This is great. Thanks.” He turned the laptop around so we could see it and pointed
    to the screen. “The only issue I have is that this third audio file isn’t named.”


    Ryder peered at it. “Sorry. It’s of my first conversation with Dr. Grantham. Pretty
    useless, but we included it anyway.”


    “No problem.”


    I said, “Oh, one other thing. If you haven’t talked to Lizzie and Blake Morgan
    yet, you might want to. After we left here earlier, they showed us a video of
    Mandi O’Malley stealing drugs out of a coworker’s bag.”


    William nodded. “I’ll be sure to meet with them. Every little bit helps. If you
    don’t have anything more to add, I think—”


    “Slow your roll there, son,” Delaney cut in. “I want to hear the whole story about
    everything these two have supposedly uncovered. Right now.”


    William didn’t flinch at Delaney’s verbal abuse. “I’m afraid I can’t help you
    there, Detective. I have work to do, and these fine folks are ready to go home.
    I’ll email you electronic files of the information they’ve given me that’s pertinent
    to your case.”


    Delaney began sputtering, but William paid him no attention as he got up and herded
    us out of the breakroom. I had a new appreciation for the young detective. As
    we neared the front of the station, I was shocked to see a familiar face at the
    reception desk.


    “Pete? What are you doing here?”


    Pete turned to me, eyes wide. “Jules, are you okay? Did you get arrested?”


    “No, but I was threatened,” I replied, giving Delaney the stink eye.


    Relief washed over his face. “So you aren’t being held here for Mandi’s murder?”


    “No.”


    William held out his hands. “To be clear, we haven’t officially classified it
    as a homicide yet.”


    Pete ignored him and turned on Delaney. “Delaney, you lying sack of shit.”


    “Piss off, Bennett. I don’t have to answer to you,” was Delaney’s response.


    William jumped in between Pete and Delaney. “Whoa, now. Let’s calm down, gentlemen.”


    Pete said to me, “He told me you and Ryder had been taken into police custody.”


    Ryder glared at Delaney. “We weren’t in custody. We were only being interviewed.
    You should know the difference.” He turned to Pete. “Why didn’t you call us before
    you drove up here?”


    “I thought you were incarcerated, and I wasn’t exactly thinking straight. Delaney
    barged into my work a few hours ago, interrupting a recording session, and proceeded
    to tell everyone who’d listen that he’s still got his eye on me for Scott’s murder
    and that you guys were being held for Mandi’s. I didn’t know what else to do,
    so I got in my car and drove straight here to bust you out of jail.”


    Poor Pete. He’d had as rough a day as I’d had. I took his hand. “I appreciate
    you coming to our rescue.”


    “Anytime.” He smiled down at me and squeezed my hand.


    Ryder got in Delaney’s face and growled, “I’ll make sure the entire department
    hears all about you harassing an innocent citizen at his workplace and purposely
    giving him misinformation to cause him grief, Delaney. Hope you enjoy your new
    position in traffic.”


    Spewing expletives, Delaney pushed past all of us and left the station, undoubtedly
    to go bother some other unwitting soul.


    Seeming shocked but amused, William said, “Well, I guess this is goodbye. Drive
    safe.”


    We gave him a wave as he walked away. Then we headed outside into the warm fall
    afternoon.


    Pete asked, “What now? Are you still investigating?”


    Ryder shook his head. “All done. This was our last stop before heading home.”


    “So did you figure out who killed Scott?” Pete asked.


    “Not exactly, but close enough,” I replied. “It was either Mandi, Jared, or the
    two of them together. Mandi’s dead. LPD is looking for Jared. There’s nothing
    left for us to do.”


    “Does that mean Delaney is out of our hair for good?” he asked hopefully.


    Ryder said, “It should mean that. I’m hoping now that the case has gotten more
    complex, the captain will assign an additional detective to help Delaney. He can
    use all the help he can get.”


    “No kidding.” Pete nudged my shoulder with his. “Since I drove all the way up
    here like an idiot, can I at least drive you home so the trip doesn’t feel like
    a total waste?”


    I raised a questioning eyebrow at Ryder. “Do you mind if I ditch you after everything
    you’ve done for us?”


    Smiling, he replied, “Not at all. You two kids have fun.”


    I gave him a hug. “Seriously, though. Thank you. For everything.”'
