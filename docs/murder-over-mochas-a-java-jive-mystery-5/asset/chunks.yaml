    莱德和我交换了一个眼神。这哥们儿。


    我说：“你是在问我公开回答还是私下回答？”


    “私下，”布莱克回答道。


    “私下的话，可以。”


    莉兹皱起眉头：“谁会某天把某人锁在地下室来警告她不要再调查，结果第二天转头就寄出了一封刻有字的邀请函，让她回到那个地下室，然后在那那里发现了她的尸体？这完全不合逻辑。”


    布莱克说：“我觉得合逻辑。在杀掉丈夫的最初的冲动过去后，她终于开始感到内疚。她无法忍受坐在他母亲旁边策划他葬礼的画面，于是她消失了。她去小木屋度过一段安静的思考时光，结果被你发现了，朱莉叶，你是她最不喜欢的人之一。你显然又在四处窥探，距离揭开她所做的一切每秒近了一步。她试图通过将你关进地下室并划破你的轮胎来威胁你，但从内心深处她知道你是永远不会放弃的。然后，在某个时刻——也许是在深夜她无法从噩梦中挣脱出来时——她崩溃了并决定自杀。她挑选了一个发现她尸体时不会产生太大心理创伤的人来处理后事。我认为这完全合情合理。”


    莱德说：“我觉得这听起来像某部电视犯罪剧剧的剧本。”


    他耸了耸肩：“生活模仿艺术。既然我们现在分享了这些，我一直在和我们最喜欢的毒品小偷钱德拉·托马斯交谈。她信誓旦旦地保证，这次不是她偷的药物。”


    我说：“你相信她是因为……”


    他向我展示了手机。“因为她拍了一段曼迪从她包里偷药的视频，这样她就不会被指控犯罪了。”


    果真如是，视频显示曼迪看起来正鬼鬼祟祟地进入一个写着 `CHANDRA THOMAS` 牌子的隔间。她弯下腰在桌子下的旅行包里翻找，拿出了四盒样本。然后她消失在屏幕外。


    我说：“那太好了，但我们不再认为偷毒案与这些谋杀案没有太大关系。”


    “谋杀案，复数？我一直以为今天这一起是自杀。”


    该死。我可能不该说那个。


    莉兹说：“如果曼迪的死是谋杀而不是自杀，那么药物就可能和这一切都有关系，特别是如果她和男朋友是偷药的人的话。我们别忘了杰里德今天早上失了。他——还有他的妻子——可能在离开镇子的路上杀了她。”


    我揉了揉额头。“这让我很头疼。我既累又饿。我需要吃个午饭，然后退后观察一下。”


    莉兹给了我一个同情的微笑。“我陪你一起的，姐妹。”


    布莱克转向她。“你什么意思？你已经吃过午饭了。你又忘了吗？”


    她对着丈夫皱起眉。“你想怀这个孩子一段时间，看看它让你变得多疲劳、饥饿和健忘吗？”


    他看起来像是一只被车灯照住的鹿。“不，亲爱的。我们回公司的路上会停在一个地方，再给你买第二份午餐。”


    莱德说：“我们很快就会在这里收尾了，所以如果我们没再见到你们，就感谢大家的帮助。”


    “不，谢谢你们。我们非常感激，”我说。


    布莱克耸了耸肩。“这都是日常工作。但我可以告诉你，不用在这里负责处理某起谋杀案的感觉真好。”他搂住莉兹。“我觉得我们真的太老了，干不了这个了。”


    我很确定莱德和我比他们两个都要大，但随他们吧。我猜他更多是指在可预见的未来，父母的身份将占据他们大部分的时间和精力。我必须承认，回归家庭（当然不包括孩子）以及放弃免费的谋杀调查，比起我目前的生活状况将是一个巨大的进步。


    ---


    莱德带我去了我最喜欢的地方之一——太阳酒馆（Cantina del Sol），但到达那里后，我并没有什么胃口。我真正想做的是给皮特打电话，哪怕只是听听他的声音，让他告诉我一切都会好起来。问题是，我不想告诉他自上次和他通话以来发生的任何事情，因为他只会担心。考虑到我可能会不经意间像对布莱克和莉兹那样脱口而出，我觉得最好不要给他打电话，甚至不发短信。


    “你是因为发现曼迪而感到恶心吗？”莱德问道，指了指越来越少的薯片篮和我那碗没动的莎莎酱。“如果你不吃这些薯片，我就把它们吃光，然后你就没得了。”


    “不，我心烦意乱，无法集中在任何事情上，包括午饭。”


    “我可以开车送你去父母家，你可以睡个午觉。”


    我笑了。“谢谢，但我们不需要继续调查吗？”


    他耸了耸肩。“也许不用。`LPD` 正把此视为谋杀案。他们对时间线的怀疑并不比我少。在那条短信发给你之前，曼迪已经死了，或者至少已经在走向死亡的路上了。”


    “我有点希望你是错的，希望他们决定那确实是自杀。这意味着他们认为我和这件事有关系吗？”


    “不，我不认为他们是想的。我还有更多不想和你的那些报纸朋友分享的信息。”他低低了声音。


    '
- fmt: '

    “You’re not visiting your parents. You and Hamilton are here poking into my investigation.”
    As Ryder came out the door of the restaurant, Delaney yelled at him, “The captain
    is going to hear about this.”


    Ryder rolled his eyes at Delaney and ambled toward us in no particular hurry.
    “Don’t you have anything better to do than drive all the way from Tennessee to
    harass us, Delaney?”


    The older detective glared at us. “I hear you two knuckleheads found my vic’s
    dead wife.” Smirking at me, he added, “You can imagine my surprise that you of
    all people were around when the woman your ex traded you in for kicked it.”


    I frowned. “Oh, so now I’m on the hook for two murders I didn’t commit. Do you
    ever do any actual investigating, or do you pick your suspects’ names out of a
    hat?”


    Ryder let out a snort of laughter, which made Delaney’s face turn purple.


    He exploded, “That’s it. You either go with me to the local station right now
    and turn over all the information you’ve gathered from your little sleuthing adventure,
    or the next time either of you sets foot inside the city of Nashville, I will
    have you arrested for obstruction. I’m not screwing around.”


    Ryder said, “Give us a minute,” and pulled me aside. “I promised the local boys
    that we’d stop by the station on our way out of town and drop off a flash drive
    with our findings and case notes. We might as well let Delaney think it was his
    idea and play along, otherwise he’s going to cause trouble for you until he closes
    his case. Which may be never, considering he’s such a bumbling idiot. What do
    you say?”


    “Anything to get that guy off my back.”


    ***


    Delaney followed us to my parents’ house, thankfully staying in his car while
    Ryder and I packed up our stuff and said our goodbyes. Then he stuck to our back
    bumper like glue all the way to the police station.


    We headed into the station, Delaney still on our heels, and waited for Jack or
    William to be available to collect our information.


    William appeared and said, “Hey, guys. Thanks for coming back over. While I have
    you here, I’d like to take a look at the files you brought and make sure I don’t
    have any questions before you—”


    Delaney hijacked the conversation. “You Johnson?”


    “Yeah, and you are?”


    Delaney stuck out a meaty paw, and the two of them shook hands. “Detective Tom
    Delaney, MNPD Homicide. We spoke on the phone. I’ll be sitting in on this meeting,
    too.”


    William’s eyebrows shot up. “Detective Delaney. I didn’t expect you to drop everything
    and drive up here after I’d already brought you up to speed on my case.”


    Delaney grunted and glared at me. “That’s not the only reason I’m here.”


    William fought the smile pulling at the corner of his mouth as he glanced from
