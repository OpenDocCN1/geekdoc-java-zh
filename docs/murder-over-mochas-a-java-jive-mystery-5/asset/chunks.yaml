    She shrugged. “I’m sure you’ve seen firsthand how unstable people really are when
    you peel back the shell they show to the world. After what I’ve seen, I have to
    tell you, I’m not surprised anymore at what people will do to one another.”


    That was alarmingly accurate of how I felt a lot of the time. “You’re right. I
    guess I’m not surprised. To be honest, I’m a little overwhelmed with this whole
    thing.”


    “Ah. You’re too close. Been there.” Her voice softening, she added, “I remember
    the rampant gossip around town when Scott left you. I can’t imagine any of this
    is easy for you—investigating his death to clear your name and your friend Pete’s
    name. Especially since you probably still hate Scott’s guts for how he treated
    you.”


    My stomach twisted. “Wait. How did you know we’re persons of interest?”


    Lizzie gave me an apologetic smile. “Ryan. I pried it out of him on Sunday when
    you guys came to town. It took a couple dozen cookies and a pan of brownies, but
    he finally spilled it.”


    I sighed. I knew all too well that Ryan Hart could be bought with baked goods.
    However, I hadn’t heard any word from my parents that my name had been mentioned
    in any of the `Chronicle’s` newspaper articles about Scott’s death. My dad read
    the paper cover to cover every day, and if he’d seen anything, he would have called
    me immediately.


    I said, “You and Blake knew the names of two murder suspects and didn’t include
    them in any articles?”


    “You’ve been so kind to my brother, and he thinks the world of you and your friend
    Pete. We didn’t believe for a second that you could have been involved, so there
    was no reason to ruin your reputation for nothing. Plus, contrary to what you
    might think, the `Chronicle` really does try to report actual facts and not just
    gossip and hearsay.”


    I shook my head. “Sorry about my predisposed ideas about the `Chronicle` and newspapers
    in general. I can’t say I’ve had any good experiences with the media.”


    “Maybe we can change that—”


    She stopped when we heard Blake say, “Crazy about what’s happening at your workplace.
    First O’Malley drops dead, then his wife disappears. She’s your trainee, right?
    Are you worried about her, or do you think she maybe took off to be alone?”


    There was a pause, then Jared’s strained voice said, “I don’t know. I can’t reach
    her. I’ve spent all day looking for her, but I can’t find her anywhere.”


    Blake said, “Do you think something bad happened to her?”


    Jared choked out a sob. “I…Maybe.”


    Ryder said, “I’m sorry to hear that. Can we do something to help?”


    “No, there’s nothing anyone can do,” Jared muttered.


    I frowned. “So if Jared didn’t run away with Mandi and he doesn’t know where she
    is—and I’m assuming he’s telling the truth, because he’s drunk—there’s either
    another player in this, or Mandi is the mastermind.”


    Lizzie said, “You’re convinced she killed her husband?”


    “I don’t know if she did the deed, but my gut says she was involved. I think Jared
    was, too.”


    Blake said, “There’s always something we can do. Ryder here is a…a PI.”


    “That’s right,” Ryder said. “I’d be happy to try to track her down.”


    “It’s no use,” Jared wailed, his words garbled. “It’s over and done. I know it.”


    “Wait. What do you mean? Do you think she’s dead?” Ryder asked.


    We heard a thump, then Blake said, “Damn it. He’s out.”


    I turned on the mic. “Out? Like passed out?”


    “Yep. Out cold,” Ryder replied. “This interview is over.”


    I turned off our listening equipment. “Well, that was short and sweet.”


    Lizzie wrinkled her forehead. “And we learned nothing, except that Jared wasn’t
    the one who made Mandi disappear.”


    “I guess that’s something.”


    Ryder and Blake appeared at the door, each with one shoulder under Jared’s limp
    arms. They began dragging his dead weight toward a black Range Rover parked at
    the edge of the parking lot.


    “Should we help them?” I asked.


    “Nah, they’re big strapping boys. They’ve got this.”


    After they crammed Jared into the passenger side of his vehicle, they walked back
    over to where we were parked.


    When they got within a couple feet of us, Lizzie gagged and held her nose. “Eww.
    You guys smell like soured beer and an ashtray had a baby. And then it vomited
    on itself.”


    I burst out laughing. I liked her. And she wasn’t wrong. They reeked of Old Depot.


    Blake lifted up his collar and smelled it. “Yep, that’s accurate. I’m going to
    drive Fisher home so he can sleep this off. Follow me over?”


    She replied, “You got it.” She vacated the driver’s seat.


    I leaned out the window and said, “I guess this is where we leave you guys. Thanks
    for your help.”


    Frowning, Blake said, “I don’t feel like we’ve helped you much. Maybe we can think
    about this tonight and meet tomorrow morning. What we need to know is out there.
    All we need to figure out is the right person to ask.”


    Sure. It wouldn’t be any more difficult than finding a needle in a haystack.


    # Chapter 20


    When we got to my parents’ house, my mom and dad greeted us with big hugs and
    huge smiles.


    Mom said, “We’re so happy you decided to stay the night with us. I know we just
    saw you yesterday, but we’re still thrilled to have you both.”


    I smiled. “Thanks, Mom.”


    “Yes, thank you, Mrs. Langley,” Ryder said.


    She sniffed the air and frowned at him. “Have you been smoking, dear?”


    “No, ma’am,” he replied. “I had to go inside the Old Depot to question someone.”


    My dad chuckled. “Being in there for five minutes will make you stink for a week.”


    “That’s what I’m afraid of. I think it’s time for me to hit the shower.”


    Mom bustled down the hall to show Ryder to the bathroom, and Dad pulled me over
    to sit on the couch with him.


    “I don’t quite understand something, Juliet. Why are you investigating Scott’s
    death? Isn’t it a police matter?” he asked.


    I blew out a breath. “It is, Dad. But I’d heard through the grapevine that Scott
    overdosed.”


    My dad frowned. “I thought I’d heard through the grapevine that Scott overdosed.”


    “What do you think?”


    I shrugged. “I think someone drugged or poisoned him.”


    Dad put his hand over mine. “But it could have been an accidental overdose.”


    “Exactly. Scott was many things, but stupid wasn’t one of them.”


    He sighed. “I hate that you have to be mixed up with that anymore. But I surely
    don’t want to see you in trouble with the law. I suppose Ryder is watching out
    for you?”


    I smiled. “Always.”


    “What does Pete think about you gallivanting off with another man?”


    Chuckling, I replied, “Pete’s fine with it. Why do you ask?”


    “Because of the way that boy looked at you during your performance last night.
    He could not take his eyes off you.”


    I felt a blush creeping up my face. “Really?”


    He nodded.


    My phone rang, and I showed it to my dad. “Speak of the devil.”


    “I think you’d better take that,” he said.


    I hurried out the back door and stretched myself on a lounge chair on the patio.
