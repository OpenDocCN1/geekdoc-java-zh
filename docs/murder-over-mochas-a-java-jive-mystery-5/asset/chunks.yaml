    time I could get to make sure that Ryder Hamilton was out of my system for good.


    As the staff arrived and began their pre-opening prep work, my thoughts quieted
    down somewhat, and by the time Java Jive was open and bustling with customers,
    my uneasy feeling had subsided. To my delight, my apprehension didn’t rear its
    ugly head when Pete came in to get his breakfast. All I felt was a surge of happiness.
    Maybe we could do this, after all.


    I was filling Gertie’s coffee mug when Pete came up singing, “ ‘No way I can get
    you up and outta my mind, you’re my Juliet.’ ”


    I did my best to squelch the blush warming my cheeks, but I was sure Pete saw
    it from the smile he tried to hide by leaning down to give Gertie a peck on the
    cheek.


    “Good morning, Gert,” he said, drumming his hands on the counter.


    “You’re certainly chipper this morning,” she remarked.


    He winked at me. “That’s because I have a hot date tonight.”


    This time, I had to turn around to hide the hot wave I felt flushing my whole
    face. I placed the coffeepot on the warmer and tried to compose myself before
    returning to the counter.


    While my back was turned, I heard Gertie ask, “Who’s the lucky girl?”


    “You’re looking at her,” Pete replied, his voice radiating happiness. “Well, sort
    of.”


    I took a breath and turned back around to find both of them staring at me. I gave
    a little wave. “I’m the lucky girl.”


    “Well, it’s about damn time,” was her only response, although she couldn’t stop
    beaming from ear to ear. Gertie had always wanted us to get together, which she
    wasn’t shy about telling us on a regular basis.


    After that, my discomfort vanished and the three of us talked and laughed like
    we did every morning. I had the feeling it was going to be a great day. My phone
    buzzed in my pocket. It was from a number I didn’t recognize, but from the area
    code and prefix, I assumed that it was someone in Liberty.


    I excused myself and walked to the edge of the counter to take the call. “Hello?”


    “Juliet?” asked a female voice.


    “Yes.”


    “Hi, this is Lizzie Hart Morgan. Bethany McCool gave me your number. I hope that’s
    okay.”


    Thinking I was going to have to have a talk with Bethany later about giving out
    my phone number, especially to her coworkers, I replied, “I’m sorry, but I have
    no comment about…well, anything.”


    “Oh, I’m not asking for an exclusive for the *Chronicle*. I’m only the lowly copy
    editor around here. I’m calling because I have some news I thought you might want
    to hear. Mandi O’Malley is missing.”


    # Chapter 13


    I waved to catch Pete’s attention and gestured for him to follow me to the office.
    On the way, I said, “Lizzie, do you mind if I put you on speaker so my, um, partner
    can hear this, too?”


    “Not a problem,” she replied.


    I switched over to speaker as Pete was closing the door behind us. I said to him,
    “This is Ryan’s sister, Lizzie. She says Mandi is missing.”


    His eyebrows shot up. “Again?”


    Lizzie asked, “Did you say ‘again’?”


    I replied, “Yes. Scott, her deceased husband, had been under the impression that
    she’d gone missing for a time this past weekend. He must have been confused, because
    it turned out she wasn’t actually missing.” I got on tiptoe to whisper in Pete’s
    ear, “Remember she works for the newspaper and is married to the lead investigative
    reporter. Don’t say anything you don’t want on the front page.”


    He nodded.


    “Hmm,” Lizzie said. “That seems a little fishy, given what’s going on now. Anyway,
    I heard this from my friend Bethany, who’s Scott’s cousin, who heard it from his
    mom. Mandi never made it to the appointment this morning to plan Scott’s funeral.
    She’d insisted on it being early so she didn’t have to miss work, and then she
    didn’t bother to show up at all. Scott’s mom got upset, naturally, and tried to
    track her down, but couldn’t. She freaked and filed a missing persons report.”


    I shot Pete a questioning look. This could easily have been hometown gossip gone
    wild, especially when Bethany McCool was involved.


    Lizzie continued, “To verify it, I called my cousin Becca, who’s the funeral director.
    She heard the whole thing. And then I called my friend William, who’s a cop, and
    he confirmed that Scott’s mom had reported Mandi missing. There’s a BOLO out for
    Mandi, but no official search yet. The police feel that it’s not a red flag that
    she skipped out on making the funeral arrangements, plus she’s technically only
    been missing for an hour or so. It’s not even out of the question that she might
    have left town for a while without mentioning it to anyone, since she’s a grieving
    widow and all.”


    Pete and I shared a look of disbelief at the term “grieving widow,” but I was
    still beginning to get an uneasy feeling in my gut.


    I said, “Scott’s mom can be a bit of a drama queen. Are you sure she didn’t blow
    this out of proportion just because Mandi flaked on the funeral planning?”


    “Becca said her reaction seemed pretty genuine. According to Becca, Scott’s mom
    got on the phone and called a bunch of Scott and Mandi’s family, friends, and
    coworkers. None of them had seen or heard from her since she left work yesterday.
    I spoke with one of her coworkers a moment ago, and as of now, she’s about thirty
    minutes late for work and has yet to call in.”


    Pete whispered to me, “She’s at work this week? Shouldn’t she be, I don’t know,
    *grieving*?”


    “You saw how indifferent she was the day after. If I were to guess, I think Scott
    dying didn’t cramp her style at all,” I murmured.


    While I wasn’t a bit surprised that Mandi had little interest in the planning
    of Scott’s funeral, I was worried about the rest of it. All else aside, Mandi
    wasn’t the kind of employee to miss work without calling in, “grieving widow”
    or not. Plus, whenever she’d worked for me, she had that cellphone of hers glued
    to her hand every moment she wasn’t actively waiting tables. She was constantly
    texting friends and posting stupid selfies on social media. If Mandi was on radio
    silence, something was up.


    I replied, “I appreciate the heads-up, Lizzie. Thank you.” Still a little worried
    she’d called to try to wrangle something else out of us, I pressed end call before
    she had a chance to reply.'
