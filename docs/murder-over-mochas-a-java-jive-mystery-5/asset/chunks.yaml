    “You had such good luck talking to Dr. Grantham as a sales rep. Let me do that
    here,” I said.


    He shook his head. “I think a straightforward approach will be best. Tell him
    what we know and then make him explain his involvement.”


    “Oh, because someone who may be involved with silencing a blackmailer is going
    to give a cop his life story willingly and without a lawyer. Remember how well
    our non-interview with Dr. Li went?”


    “Li was a prick.”


    “Maybe this guy is, too. Look, he may be our best lead. Devaux is too wimpy and
    old to have tried to kill `Scott`. Grantham is a man-eater, but I didn’t get a
    murdery vibe from her.”


    He replied, “Well, she admitted to calling Mandi after Scott tried to blackmail
    her. She could have suggested that Mandi silence him for good.”


    I gave him a skeptical look. “So Mandi’s a hired assassin now?”


    Frowning, he said, “All I’m saying is let’s not screw this up.”


    “That’s what I’m saying, too.”


    Both of us stared at each other stubbornly, neither backing down.


    After a few moments, I suggested, “One of us could pretend to be sick or hurt.”


    “How do you segue an office visit into ‘Hey, have you murdered anyone lately?’ ”


    “I could do without your sass.”


    Ryder smiled. “Sorry. I guess it could work to lure the doctor into an exam room
    and then trap him there while we grill him.”


    “Sounds like a plan. Who’s going to be the patient?”


    “You. I already got groped by a doctor.”


    “But you have an actual injury you could complain about. Show them your bullet
    scar.”


    “Can’t you complain of female trouble or something?”


    I made a face. “So I can get myself a Pap smear? No, thanks.”


    “It won’t get to that. I promise.”


    # Chapter 22


    After filling out a mountain of paperwork (using the alias `Leslie Kaufman`, which
    Maya and I used anytime we were undercover), I was beginning to think Ryder’s
    direct approach might have been the way to go. But true to the “Minute Clinic”
    name, we only waited mere minutes to see a doctor, who we’d requested be `Dr.
    Muniz`. The nurse who took us back to the exam room told me to strip down, but
    I didn’t—like Ryder had said, it wouldn’t get to that.


    Glancing around the aging, dingy room, I noticed that there was an abundance of
    new-looking gadgets—special lights, a defibrillator, a heart monitor, and a fancy
    computer. “Notice anything unusual in here?”


    Ryder tapped the defibrillator. “All the new equipment?”


    “Right. This place has been around forever, and I’ve never known it to have up-to-date
    anything. I always heard the clinic was one step away from closing its doors.
    Some GPs in town don’t accept government-provided insurance, so this is where
    people have to go if they don’t have a family doctor. The place is not a cash
    cow.”


    “So the doctors here have to take kickbacks if they want nice things.”


    “That’s what I—”


    “Knock, knock. Good morning, Ms. Kaufman,” said a cheerful female voice. A beautiful
    young doctor walked in, smiling wide. “I’m `Dr. Sophie Miller`. How are we feeling
    today?”


    “Um…I thought I was going to see `Dr. Muniz`,” I said.


    She gestured for me to sit on the exam table. “I’m sorry, `Dr. Muniz` is tied
    up with a patient, and we didn’t want you to have to wait.” She took a look at
    my chart. “Oh, looks like we may be getting some exciting news today.” Turning
    to Ryder, she asked, “Are you the daddy?”


    I’d had a stroke of genius out in the waiting room while filling out my forms.
    I was going to be “pregnant” with Scott’s child, so I could break down over the
    fact that he was dead, giving us the perfect lead-in to talk about him. Brilliant
    plan, except we didn’t take into account we might get the wrong doctor.


    Instead of aborting the mission, Ryder stuck to the script. He shook his head,
    seeming dejected. “No, the uncle. The father is…”


    Well, if he was sticking with it, so was I. Maybe we could get something out of
    `Dr. Miller`, even if she wasn’t directly involved.


    I heaved out a sob. “Dead. He’s *dead*.”


    Dr. Miller’s face fell, and she rushed over to put an arm around me. “Oh, my dear.
    I’m so sorry to hear that. I see that you have support here, but please know that
    there’s a lot the clinic can do for you in the way of counseling and other services.”


    I sniffed. “I could use some counseling, especially since…since my Scott was…”
    I broke down, squeezing my eyes to try to get some tears to flow.


    His voice grim, Ryder said, “He was murdered.”


    Dr. Miller rubbed my back. “That’s terrible. I’m so sorry.”


    Ryder said, “You probably knew him. `Scott O’Malley`. He was a drug rep for `Silver
    Spruce`.”


    When her hand froze on my back, I glanced up in time to see recognition on her
    face.


    “Yes, I knew him.”


    If she knew him, she probably knew he was married, so that could have been the
    source of her discomfort. Or she knew something we needed to find out.


    I said quietly, “Then you may know that he was married. He was leaving his wife
    for me.”


    She smiled kindly. “No judgment here.”


    “Do you know her, too? Mandi?” I asked.


    “Not well. She visits `Dr. Muniz` on occasion.”


    “And takes him on tropical fishing trips on occasion, I hear,” I snapped.


    Dr. Miller frowned. “I don’t know about that—”


    I kept going, raising my voice. “If she wanted a divorce, she should have asked
    for one instead of sneaking around, buying her new boyfriend expensive things,
    like ties and cuff links, on the company credit card. I bet she bought all this
    new equipment you have here just to impress him.”


    Dr. Miller took a step back from me. “Hold on there. I can’t speak for `Dr. Muniz`,
    but I can tell you our new equipment was donated by a nonprofit organization called
    `Health and Wellness Indiana`. They provide much-needed supplies to struggling
    clinics like this one. I applied for the grants myself. No funny business there.”


    I glanced at Ryder, then said, “Well, at least regarding the other stuff she gave
    him under the table, she blamed Scott for it, and he got fired for giving kickbacks.
    Then she killed him.” I was aiming for hormonal pregnant lady who’d lost her baby
    daddy, but I knew I had to be coming off way crazy.


    Ryder cleared his throat. “Now, sis. Let’s not bother the doctor with your conspiracy
    theory. She’s too busy for that.”


    She took a step back toward me and put her hand on my shoulder. “Not at all. I
    have a duty to report violence that harms my patients. I think this is somewhat
    related. Why do you think the father of your child was murdered by his wife?”


    “Well, she’s disappeared, for one. She’d been cheating on him and otherwise treating
    him horribly. And I know she had the means to poison him.”


    “Have you gone to the police with this information?”


    I cast my eyes down and cradled my belly protectively. “I’m afraid to. Afraid
    she’ll try to hurt me, too…I don’t want to do anything that could jeopardize the
    life of this baby. It’s all I have left of him.” I put my face in my hands and
    choked out a couple of sobs.


