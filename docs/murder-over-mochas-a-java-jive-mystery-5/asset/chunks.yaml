    She smiled and blushed slightly. “He said he would miss me too much if he didn’t.
    Dr. Richardson doesn’t mind accepting Silver Spruce products as long as he doesn’t
    have to listen to a sales pitch. So, I let Jared add his samples to our collection,
    and that seems to make him happy enough.”


    “And Jared never leaves anything here except the drug samples?”


    She shifted her eyes away from us. “I don’t know what you mean.”


    Marie struck me as a meek, simple old lady. Judging from the way she was dressed
    in her ill-fitting cardigan, dated dress, and droopy nylons, she wasn’t making
    a killing working here. However, just like Dr. Devaux with his Burberry tie, she
    had a fancy accessory that was likely out of her price range.


    “That’s a lovely bracelet you have there.”


    Her hands began to tremble again. “My…my daughter gave it to me for…Christmas.”


    Ryder caught my eye and shook his head slightly, signaling that we needed to pull
    back. He gave Marie another kind smile. “How nice. Getting back to the day Scott
    was here, since he wasn’t your normal Silver Spruce rep and he came in here and
    caused trouble for you, did you mention it to Jared?”


    “Of course. I called him right away, and he came straight over to apologize.”


    I nudged Ryder’s foot with mine.


    He asked, “So Jared got here just after Scott left?”


    “Yes, he wasted no time. He wanted to make sure Scott hadn’t completely ruined
    the relationship between Silver Spruce and this office.”


    “Did you tell Jared about Scott stealing the samples?”


    “No, I didn’t know it at the time.”


    There it was.


    I asked, “Did Jared bring some samples with him that day?”


    “Yes, what a dear he is. He brought some new and expensive meds that he doesn’t
    normally have with him.”


    I nodded. “It was nice of him to do that. He sounds like a great guy. So he put
    the samples he brought in the cabinet and then went on his way?”


    “He did. He’s so helpful.”


    Ryder said, “Did Jared say anything about the broken cabinet?”


    Marie’s eyes grew wide. “What?”


    “You said Jared put the samples he brought that day in the cabinet for you. He
    was here after Scott left. So surely he would have noticed the broken cabinet.”


    She drew in a breath. “Oh…oh, yes of course.”


    I pointed out, “A few minutes ago you told the detective here that it was you
    who noticed the broken cabinet and the missing samples. Now you say Jared was
    the one who noticed it. Which is it, Marie?”


    Marie fought to keep her composure, but couldn’t keep her lower lip from trembling.
    “I…I forget. I’m an old woman, after all.”


    Ryder said gently, “Marie, is Jared giving you presents—like that bracelet you’re
    wearing—to keep you quiet about some of the things he does? Maybe about things
    he knows Dr. Richardson won’t like?”


    A single tear slid down her weathered cheek. “He’s a nice boy.”


    “He stole the sodium oxybate samples, didn’t he?”


    Gulping, she shook her head. “No.”


    “Would you like us to bring your boss in here and ask that question again?”


    That got her. Her eyes brimmed over with tears. “Please, no. I need this job.
    I have to work to support my grandkids. Please don’t tell Dr. Richardson. I’ll
    tell you whatever you want to know.”


    Ryder said, “We want to know who took the sodium oxybate.”


    She sighed and whispered, “Jared.”


    “Did he ask you to make it look like Scott was the one who took it?”


    “Yes.”


    “Did Jared give you something to keep you quiet?”


    She nodded and held out her wrist. “This bracelet.”


    “Has he ever given you anything else, or was this the first time?”


    Marie’s face crumpled. “It wasn’t the first time. My granddaughter has asthma,
    and the government-sponsored insurance plan she’s on only pays half of the cost
    of the inhaler. That’s a hundred dollars a month I can’t afford. Jared is able
    to supply me with what she needs free of charge in exchange for me making sure
    he keeps a foot in the door here at the office.”


    I wasn’t expecting to see the other side of the kickback scheme. Aside from the
    bracelet, Marie wasn’t profiting from frivolous gifts and favors like the other
    recipients. She was receiving something that would keep her granddaughter alive.


    I blew out a breath. “Okay, Marie. We’ll leave you alone after one last question.
    Jared was scheduled to come here today. Did he ever show up?”


    She shook her head. “No. I’m a little worried, because he didn’t call to let me
    know he wouldn’t be here. It’s not like him. Plus, it’s time for him to bring
    another inhaler for my granddaughter. Her last one is almost out, and we have
    no extras.”


    After leaving Marie to weep quietly in Dr. Richardson’s office, we headed back
    to Ryder’s car.


    “This is bad,” I said.


    “Yeah, you made that poor old woman cry.”


    “Hey, you were right in there, too, pal. I meant that there’s an excellent possibility
    Jared Fisher had a hand in Scott’s death.”


    “We need to find this guy. Now.”


    # Chapter 19


    As Ryder drove us to the last doctor on our list, I called Doug McKay again, only
    to find out that Jared was scheduled to be out on calls the rest of the day. So
    essentially, he didn’t have a clue where Jared actually was, unless he was covering
    for him. I didn’t believe McKay to be smart enough to pull that off, but either
    way, I didn’t let on that Jared was nowhere to be found.


    After that, I called Lizzie. If anyone knew the dirt on people or where to find
    it, it would be our friends at the local newspaper. “Hey, do any of you know Jared
    Fisher? His boss thinks he’s out on the road all day, but we can’t find him anywhere
    and he won’t answer our calls on his cell. We seriously need to talk with him.”


    “I think Blake knows him. Hold on.” She put me on hold for a few moments, then
    got back on the call. “Yeah, he’s an acquaintance. Want Blake to give him a call
    and try to set up a meeting with him?”


    “That would be great. Thanks.”


    “Did you find anything out from your list of doctors?”


    I gave her the short version of what we’d found out. “We have one more stop to
    make. Oh, and of course Ryder’s date with Grantham tonight.”


    “You did better than we. All we got out of anyone was ‘Oh, Silver Spruce is awesome
    and so great to work with.’ No complaints, no confessions of taking bribes. Although
    I did notice one of them, Dr. Muniz, had a photo on his desk of himself on a fancy
    boat, holding a huge fish, and I swear your girl Mandi was in the background.”


    “Great. Now they’re handing out trips, also. Were all of your doctors clients
    of Mandi and Jared?”


    “Yes.”


    “Ours, too.”


    “Do you think they’re the only Silver Spruce reps giving out the swag?” she asked.


    I thought about Daniel and Chandra. They didn’t strike me as underhanded, like
    Mandi and Jared did, but who knew? Sometimes you did what you had to to get your
    job done. Like stealing evidence and unlawfully entering people’s homes and motel
    rooms.


    “I don’t know. But I’m sure we’ll find out. Thanks.”


    Ryder, who’d been quiet while I was on the phone, said, “I’m kind of surprised
    you let those reporters in the investigation. You’re always so personal about
    stuff like that.”


    “Well, I told them there’d be hell to pay if my name ended up in the paper. And
    we’d hit such a wall this morning, I was ready to try anything.”


    “I thought it was because Ryan is always telling us how many murderers his sister
    has taken down, and you wanted to see firsthand if her skills are on par with
    yours.”


    “No, it’s only guys who measure themselves that way. Girls only care about who’s
    prettier.”


    He snorted and rolled his eyes.


    —


    When we got to the last doctor on our list, we sat in the car for a moment to
    try to devise a game plan.


    “You know anything about this guy, Dr. Li?” Ryder asked.


    I shook my head. “Not really. I think he’s middle-aged and married, maybe has
    a couple of kids. Just a normal dude.”


    “I say we do good cop/bad cop. Guys with kids cave when they think everything
    they’ve been working their whole lives to build could collapse in an instant.”

