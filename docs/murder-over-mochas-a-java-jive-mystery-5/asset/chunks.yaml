  raw: '“You’re going use this man’s children to scare him into talking. That’s real
    nice.”


    He shrugged. “It’s either that or you honey-pot him like I have to do with Dr.
    Succubus tonight.”


    I wrinkled my nose. “Using his children it is.”


    This time the receptionist was a young woman who started drooling the second she
    saw Ryder walk through the door. He didn’t even have to pull out his badge to
    get her to agree to let us see her doctor. We didn’t have to wait, either. She
    showed us back to Dr. Li’s office, and he walked in minutes later.


    “My receptionist said you’re in the middle of a murder investigation and need
    my help. What is it you think I can do for you?” he asked, not seeming particularly
    happy about having to meet with us.


    Ryder stared him down. “You can start by telling us everything you know about
    Scott O’Malley and Silver Spruce Pharmaceuticals.”


    Dr. Li stared right back with the same stern expression. “*You* can start by telling
    me who you are and showing me your badge.”


    Ryder unclipped his badge from his belt and held it out. “I’m Detective Ryder
    Hamilton. This is Juliet Langley, a private investigator who’s consulting on the
    case.”


    As Ryder went to put his badge away, Dr. Li held up his hand. “Let me have a closer
    look at that badge.”


    Frowning, Ryder extended his arm so Dr. Li could get a better look at his badge.


    “Metropolitan Nashville Police Department. You’re a long way from home, Detective.
    And well out of your jurisdiction.” He stood. “Now, if you’ll excuse me, I have
    patients to see.”


    That was it? This guy was a real piece of work. Screw good cop/bad cop. I wanted
    answers. “Wait a minute. A man is dead, and you won’t even listen to our questions
    before deciding you’re not going to answer them? That’s a bunch of crap.”


    “What’s ‘a bunch of crap’ is you bulldozing your way in here and trying to question
    me without cause. My wife is a lawyer, and I know I don’t have to speak to you.”


    I hopped up from my seat. “Well, it’s clear to me that you have something to hide,
    Dr. Li, and I’ll bet it’s the kickbacks you’re getting from Silver Spruce. What’s
    your weakness? Shiny cuff links? Fishing trips? Hookers?”


    “Out!” Dr. Li roared. “One more word, and I call the cops.”


    I opened my mouth to fire something back, but Ryder grabbed me by the arm and
    pulled me out of the office before I could say anything more. He didn’t let go
    until we were safely in the parking lot.


    “What the hell was that? *I’m* the bad cop,” he griped.


    “And *I’m* sick of jokers like him standing in my way of getting to the bottom
    of this! This is my life we’re talking about. If we don’t figure this out, I could
    wind up in jail.”


    “If you don’t calm down and get your head in the game, you’re going to wind up
    in jail for something unrelated. Like harassment.”


    I fought to keep the tears away, but I knew they were coming. “Why does stupid
    Scott get to ruin my life twice, huh? Why do I deserve that?” One tear spilled
    over, which I angrily wiped away.


    Ryder’s face softened, and he put his arms around me and held tight. “It’s not
    fair. You shouldn’t have to deal with any of this. If you want, we can say screw
    it and go home now. We can get you a lawyer, and Maya and I will take over the
    investigation. All you have to do is say the word.”


    I sighed. As wonderful as it would be to stick my head in the sand, I was in this
    up to my eyeballs. It was my problem, and I was a grown woman. “Thank you. That’s
    a tempting offer, but you know I’d never be able to sit on the sidelines and let
    someone else do my dirty work for me. Scott may have been a dickhead, but he didn’t
    deserve to be killed for it. As much as I hated him, I still want his killer brought
    to justice.”


    He let me go. “Okay. As long as you’re in it, I’m in it with you.”


    Smiling, I said, “Thanks. That means more than you know.”


    Ryder nudged my shoulder with his as we began walking toward his car. “Don’t go
    getting all sappy on me. We have a lot more work left—”


    My phone rang, interrupting him. It was Lizzie.


    After I answered, she said, “Hey, we found Jared Fisher.”


    Finally. “Where?”


    “At the Old Depot, drowning his sorrows.”


    —


    The Old Depot was easily the grossest bar on the planet, and I’d been to some
    real stinkers in Nashville. We met Lizzie and Blake in the parking lot, but Lizzie
    wouldn’t even get out of the car.


    “I’m sitting this one out,” she announced. “My gag reflex is super strong right
    now, so there’s no way I could survive even a minute in there.”


    Blake seemed a little apprehensive about going in there himself. “Right, but more
    importantly I’m hoping there’s no bar brawl in there tonight.”


    The Old Depot, which had been the town’s actual train depot back in the day, was
    well-known for its rowdy bar fights that broke out almost weekly.


    I nodded. “I’ve seen some good ones in there. It’s early, though. You should be
    fine.”


    Ryder was looking at me thoughtfully. “You know, I think Juliet should sit this
    one out, too.”


    My jaw dropped. “Excuse me? Didn’t we just have a discussion about you not fighting
    my battles for me?”


    “My suggestion has nothing to do with that. Jared Fisher doesn’t like you, and
    your temper is already working overtime. Blake knows him. Let the two of us go
    in there and bro down with him. Maybe he’ll start talking if he thinks he’s only
    having drinks with the guys.”


    I glared at him, mulling over his idea.


    He added, “You can listen from the car.”


    “Fine,” I conceded, begrudgingly realizing he was right. We got out the listening
    equipment and checked it, then I settled into Ryder’s passenger seat and started
    the recording. As he began heading toward the door with Blake, I said, “A word
    of advice—don’t antagonize any of the hicks. They’re mean. Oh, and only drink
    bottled beer. I’m pretty sure they don’t wash the glasses.”


    Ryder winked at me. “Thanks. I’ll keep that in mind.”


    When they disappeared through the door, I called to Lizzie, “Want to listen in
    with me?”


    Her face lit up. “Absolutely!


    “Hop in.”


    She slid into the driver’s seat of Ryder’s car. I set the speaker and the mic
    on the dashboard and turned off the mic so we wouldn’t bother Ryder.


    “Where’s Julia?” I asked. “I thought she’d want to hear this, too.”


    Lizzie replied, “My bestie is not big on the hands-on investigating. Her husband
    frowns on it, because he thinks it’s ‘unsafe.’ Well, to be fair, I’ve gotten her
    in a lot of trouble over the years. So it’s kind of my fault that he feels that
    way.”


    “I get it. My bestie is not the biggest fan of me being a PI.”


    “That has got to be the best job.”


    “It has its moments. But you have to do things by the book, which is constrictive.
    I especially have to play by the rules with Ryder looking over my shoulder.”


    “I can see where that might be a drag. Are you *sure* you and your hunky detective
    aren’t more than friends? You fight like an old married couple,” Lizzie observed.


    I smiled. “We have quite a history, which makes it a little more complicated than
    it should be. But we’re both moving on.”


    Blake’s voice came over the speaker. “What’s up, Fisher? Long time no see. You
    doing okay?”


    Jared’s voice was flat and slightly slurred. “I’ve been better.”


    “Hey, this is my cousin Ryder. He’s visiting from out of town.”


    “Good to meet you, Jared,” Ryder said.


    Jared mumbled something in reply.


    Blake said, “Thanks for meeting me tonight. I’m doing a story on the upcoming
    Liberty Youth Soccer Tournament this weekend, and I wanted to get some input from
    an insider. I hear you’re quite the coach.”


    “I’m not so sure about that,” Jared said.


    “And that your oldest is becoming a star player.”


    “He’s really getting good.” Jared seemed to perk up once he began talking about
    his kid and the town’s soccer league.


    I tuned their conversation out and turned to Lizzie. “How does this guy go from
    soccer dad to possible murderer?”'
