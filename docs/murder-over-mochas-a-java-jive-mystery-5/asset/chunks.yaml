    we want to be with. Have you…decided on Maya?”


    Ryder put the now empty pie pan back on the coffee table and turned to me. “Have
    you decided on Pete?”


    “I asked you first.”


    He let out a breath. “Well, I’ve known Maya for years. We’ve always got along
    as friends, but lately I feel like things have changed. In a good way. I think
    I’m really starting to fall for her.”


    I nodded, a swirl of emotions needling at me. On one hand, I was thrilled for
    him and for Maya. On the other hand, it felt strange to hear those words from
    him about another woman. “That’s great.”


    His expression serious, he said, “I know it might not be the best time to bring
    this up, but I can tell you’ve got some sort of reservation about me dating her.
    I’d like to know what it is. You know us both well. Do you think we’re not right
    for each other or something?”


    The pie started churning in my stomach. So he did know I wasn’t as excited about
    him dating Maya as I tried to seem. Damn. I thought I was a better actress than
    that. And now I had no choice but to ’fess up to the truth about my feelings,
    because any other way I answered that question could hurt his relationship with
    Maya.


    “No. I think you’re perfect together. It’s just that…” I blew out a breath. “Sometimes
    it’s hard to watch someone else move on.”


    “You told me to move on.”


    “I know that. But there’s a tiny part of me that misses…us.”


    There it was. No taking it back now. I looked away, unable to meet his piercing
    blue eyes after that life-changing revelation. When he took both of my hands,
    though, I forced myself to look at him.


    “I don’t ever want you to think that what we had together isn’t important to me.
    I miss us, too.” Giving me a rueful smile, he squeezed my hands. “As amazing as
    it was at times, you and I both know we could never sustain it.”


    I sighed. “I know that. We’re too volatile. And while that can be fun, it can
    also be disastrous. As we’ve demonstrated time and time again.”


    He let go of my hands. “Right. So what do we do to fix this? The last thing I
    want is for things to be weird between us.”


    Shrugging, I replied, “I don’t know. Maybe it’s okay to own the fact that we care
    for each other even though we’re not meant to be together.”


    “Isn’t that what friends do?”


    “Yeah, I guess it sort of is.”


    “We’re pretty great at this friends thing.”


    I smiled. “I know. You’ve only yelled at me like twice today.”


    Snorting, he replied, “Which you had coming.” His face softened. “Are we good?”


    I nodded and said, “We’re good.” And I really meant it.


    —


    The next morning, Ryder and I met Blake, Lizzie, and Julia bright and early at
    the *Chronicle* office.


    Blake said, “Last night Lizzie and I put our heads together, and we decided since
    you guys were starting to focus more on the doctors that we would start focusing
    more on Silver Spruce as a company. Since the industry crackdown on kickbacks
    several years ago, Silver Spruce has been under scrutiny multiple times for non-compliance
    with the new guidelines.”


    Lizzie put down the enormous breakfast burrito she’d been working on. “Trouble
    has never been centered around this particular office, but it seems like Silver
    Spruce generally tends to look the other way when it comes to their employees
    offering kickbacks.”


    Blake nodded. “We looked into Doug McKay’s background, and he’s squeaky clean.
    However, he hasn’t been the manager for long—only a couple of months, actually.
    The manager before him, Jason Brooks, has an impressive list of misdemeanors to
    his name. Public intoxication, trespassing, resisting arrest, criminal mischief,
    disorderly conduct. Pretty much good ol’ boy carousing and general douchebaggery,
    but it shows he’s not shy about breaking the law.”


    “Where are you going with this?” Ryder asked.


    “Brooks got promoted to Midwest regional manager and moved to St. Louis. But I’m
    thinking he may know about or even be the one who started the kickback scheme.
    He could tell us how deep this goes.”


    “And he’d willingly offer up this information because…”


    Blake’s eyes got a mischievous sparkle. “Let’s just say he owes me a favor.”


    Ryder did not seem to like this idea, but kept listening.


    “And who knows? He would have been the one to give Mandi the promotion, so he
    might even be able to offer some insight as to her husband’s downward spiral,
    or who could have had it in for him at work.”


    I said, “Well, if you can get out of him more than we could get out of that idiot
    McKay, go for it.”


    Blake nodded. “I’ll get on tracking him down. Now that I’ve told you my good news…”
    He hesitated and glanced at his wife, who pulled a sympathetic face and stuffed
    a huge bite of burrito in her mouth. “There’s something I need to mention that
    you’re not going to like.”


    I sighed. “Go for it. This case couldn’t suck much more than it already does.”


    “Jared Fisher packed himself and his family up and left town. Lizzie and I went
    by this morning on our way to work to check on him, and their vehicles were gone.
    I called him, and instead of picking up, he shot back a quick text about taking
    the family on vacation. When I asked where and for how long, his reply was simply
    a question mark.”


    “He’s running…but why?” Ryder asked. “Is he scared or guilty?”


    Julia shrugged. “Could be either. Or both.”


    Her mouth full, Lizzie mumbled, “I say scared.”


    Ryder stood. “I say we’re burning daylight. We’re going to go have a chat with
    Dr. Muniz. You find out what you can from your contact.”


    To try to smooth over his curtness, I said, “Thanks for the help, guys.” I began
    to follow Ryder out of the room, but Lizzie caught up with me at the door.


    She said, “Your partner didn’t seem too impressed by Blake’s connection to Jason
    Brooks, which I totally understand. Blake’s got all these shady contacts around
    town that he uses for his stories. At this point, I’ve quit asking. But I have
    to admit, a lot of times it comes in handy. You need anything, he has a guy. The
    point is, shady or not, his sources nearly always pan out. He’ll get you what
    you need.”


    I smiled. “Ryder doesn’t mind going a little rogue, but don’t forget he is a cop.
    I think he didn’t want to know too much about the situation in order to have deniability
    if it gets *too* shady.”


    —


    Outside the Liberty Minute Clinic where Dr. Muniz worked, Ryder and I were arguing
    over how we were going to go about questioning him about the blackmail.'
