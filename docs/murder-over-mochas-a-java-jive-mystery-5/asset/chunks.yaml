    “你不是来看你父母的。你和汉尔顿是在这儿插手我的调查。”当莱德走出餐厅大门时，德兰尼对他大吼道：“局长会听到这件事的。”


    莱德对德兰尼翻了个白眼，不紧不慢地朝我们走来。“德兰尼，难道你没有什么更紧要要做，非要从田纳西州大老远来骚扰我们吗？”


    年长的侦探瞪着我们。“我听闻这两个笨蛋发现了我受害者的死妻子。”他对我坏笑，补充道，“你可以想象一下我有多惊讶，在你们这么多人里，那个你前任换掉你的那个女人断气的时候，你竟然在场。”


    我皱了皱眉。“噢，所以现在我要为两桩我并没犯的谋杀案负责了。你到底有没有做过真正的调查，还是说你们是从帽子里抽嫌疑人的名字？”


    莱德发出一声冷笑，这让德兰尼的脸气成了紫色。


    他爆发了：“够了。你要么现在就跟我去当地警察局，交出你们从那场小侦探冒险中收集的所有信息，要么下次你们中任何一个人踏进纳什维市，我就会以妨碍司法罪逮捕你们。我可不是在开玩笑。”


    莱德说：“给我们一点时间，”然后把我拉到一边。“我答应过当地的小伙子，我们离开镇时会顺便去趟警察局，留下一个存有我们发现和案件笔记的闪存盘。我们最好让德兰尼觉得那是他的主意并顺着他演，否则他会一直找你的麻烦，直到他结案为止。考虑到他是个大笨蛋，这可能永远不会发生。你怎么说？”


    “为了让那家伙离我远点，怎么都行。”


    ***


    德兰尼跟着我们去了我父母家，谢天地，莱德和我收拾行李告别时，他留在车里。然后，他像胶水一样粘在我们的后保险杠后面，一直到了警察局。


    我们走进警察局，德兰尼依然跟在我们身后，我们等杰克或威廉有空收集我们的信息。


    威廉出现了，说道：“嘿，伙计们。感谢你们又回来。既然你们在这儿，我想看看你们带来的文件，确保在你们……之前没有任何问题——”


    德兰尼劫持了话头。“你是约翰森？”


    “是的，你是？”


    德兰尼伸出一只肉乎乎的手，两人握了手。“侦探汤姆·德兰尼，明尼警察局谋杀组。我们通过通过过了。也会参加这次会议。”


    威廉的眉毛跳了起来。“德兰尼侦探。我没料到在我向你介绍完我的案件情况后，你会放下所有事情开车来这里。”


    德兰尼哼了一声，瞪着我。“那不是我在这的唯一理由。”


    威廉在德兰尼和我之间看了了一眼，努力忍住嘴角上扬的笑意。“好，那么。我想你们*所有人*都可以跟我来。”


    他带我们来到主楼的警察休息室。我猜我已经被排除在嫌疑人之外了（至少在当地警察侦探的眼中），我不再需要被像对待流氓一样对待了。


    当我们都坐在房间中心的大桌旁时，莱德从口袋里掏出一个闪存盘，滑过桌面交给威廉。“这是我们发现的关于奥马利家族及其熟人、银杉松制药公司及其员工，以及几位被斯科特·奥马利勒索的医生的所有信息。”


    威廉将闪存盘插入面前的笔记本电脑。“再次感谢大家的帮助和配合，汉尔顿侦探和兰格小姐。”他花了几分钟审阅文件，这让我们陷入了一种尴尬的类沉默状态，唯一能听到的只有德兰尼呼吸的声音。


    “这太棒了。谢谢。”他转过笔记本电脑让我们看到，指向屏幕。“我唯一的问题是第三个音频文件没有命名。”


    莱德凑近看了看。“抱歉。那和我格兰姆博士的第一次对话。没什么大用，但我们还是包含进去了。”


    “没问题。”


    我说：“噢，还有一件事。如果你还没和莉兹和布莱克·摩根谈过，你可能想聊聊。我们之前离开这里后，他们给我们看了一个视频，是曼迪·奥马利从同事的包里偷药物。”


    威廉点了点头。“我会确保和他们见面的。每一点信息都有帮助。如果你们没有什么要补充的，我想——”


    “慢点儿，小子，”德兰尼插话道。“我想听听这两个人所谓发现的所有事的完整故事。现在。”


    威廉对德兰尼的言语攻击毫无畏色。“恐怕我在这方面帮不了你，侦探。我有工作要做，这些体面的人已经准备好回家了。我会把他们给我的与你案件相关的电子信息文件邮件给你。”


    德兰尼开始结结巴巴嗦，但威廉完全没理会他，他起身把我们赶出休息室。我对这位年轻侦探有了新的改观。当我们靠近警察局门口时，我惊讶地看到接待台前有一张熟悉的脸孔。


    “皮特？你在这里干什么？”


    皮特转向我，睁大双眼睛。“朱莉，你还好吗？你被捕了吗？”


    “没有，但我被威胁了，”我回答道，给了德兰尼一个白眼。


    如释重负出现在他的脸上。“所以你被了？”


    “没有，但我被威胁了，”我回答道，给了德兰尼一个白眼。


    如释重负出现在他的脸上。“所以你被了？”'
