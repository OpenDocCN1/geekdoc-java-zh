  raw: 'I let out a bark of laughter. “Like hell I will.” I hadn’t seen or spoken
    to Scott since he’d walked out on me over a year ago. I didn’t want to start now.


    “I’m serious. Did you hear what he said before you clocked him?”


    “Not really.”


    “He said he needed your help.”


    “I’ll help him out the door.”


    Ryder smiled. “Come on. The Juliet Langley I know never turns down a person in
    need.”


    “Scott is not a person. He’s a slimy, cheating, no-good son of a—”


    He held up a hand. “I know. You mentioned that.”


    I crossed my arms. “I’m not talking to him. End of discussion.”


    “Okay, then I’ll talk to him.”


    “Knock yourself out!” I snapped as he slipped out the door. “Argh!” I cried, grabbing
    the nearest thing—a pillow off the couch—and chucking it across the room.


    Why in the world would Scott O’Malley have come crawling back to me of all people
    for help? Was he stupid enough to think I’d lift a finger to do *anything* for
    him? He’d ruined my life. After cheating on me with a waitress from the café we
    owned together, he wiped out our bank account and the café’s bank account, stole
    all of my belongings, and skipped town. I was left with an empty apartment I still
    had to make rent on and a café with no capital to buy supplies or pay employees.
    I’d had to close the café, which hurt more than anything. To add insult to injury,
    if my best friend, Pete Bennett, hadn’t stepped in when he did and offered me
    the manager’s job at Java Jive, I would have had to move back in with my parents.
    That was why I was even here in Nashville in the first place. If none of this
    had gone down, I’d be back in my hometown, probably married to that weasel Scott.


    I shuddered at the thought and poured myself a shot of the vodka Pete and I kept
    in the office for celebrations and emergencies. It burned all the way down, but
    it took the edge off a little. As I was storing the bottle away in the desk drawer,
    Ryder came back in and eyed it and my used shot glass, but made no comment.


    “Well?” I asked. “Did you have a nice chat?”


    Ryder’s lip curled slightly. “That guy is a real asshat.”


    “You think?”


    “And he carries a purse.”


    I snickered. As long as I’d known Scott, he’d always had a small messenger bag
    slung around one shoulder. And, yes, it kind of looked like a purse. If you wanted
    to get technical about it, since he kept his wallet, keys, phone, spare change,
    and lip balm in there, it *was* a purse. “He likes for people to call it a satchel.”


    “Whatever. He seems to be pretty adamant about talking to you. He wouldn’t tell
    me any particulars, but he says he’s in trouble and you’re the only one he trusts
    to help him.”


    “Did you relay the message that I couldn’t give a flying crap about his problems?”


    Ryder cracked a smile. “I’m pretty sure his nose is broken. I think you got your
    point across.”


    “Good. Is he gone?”


    Wincing, he said, “Sort of. He’s coming back tonight after you’ve had some time
    to cool off.”


    *“What?”* I cried.


    Ryder put both hands in front of his face. “Don’t punch the messenger.”


    I rolled my eyes. “Ha, ha.”


    His expression became serious. “Hey, I think you should hear him out. He seemed
    genuinely upset. I’m taking Maya to a movie later, so I won’t be able to play
    referee. You think you can keep those fists of fury under control without me?
    Will Pete be here to have your back?”


    “He should be. Although I have to warn you—he knows Scott, and he doesn’t like
    him any more than I do.”


    “Surely the two of you can be adults about this.”


    “Pete and me? Doubtful.”


    He pinched the bridge of his nose in frustration. “If I get a call in the middle
    of my date to come bail you out of jail…”


    I didn’t even want to think about getting thrown in jail (again), so I changed
    the subject. “So what movie are you going to see?”


    Shrugging, he replied, “I don’t know. Some chick flick. Maya picked it.”


    My jaw dropped. “See? Girl stuff!”


    “Why are you griping? You don’t even like those kinds of movies.”


    Well, he had me there.


    —


    Unable to shake the unsettled feeling I had about Scott showing up out of the
    blue at Java Jive, I headed home for a while to try to chill out. I trudged up
    the rusty steps to my second floor apartment, grumbling to myself as I thought
    about how it was all Scott’s fault that I had to live in this crummy building
    crawling with loud college kids because I couldn’t afford anything better.


    As I passed my new neighbor Cooper’s open window, he called out, “Hey, Juliet!”


    I gave him a halfhearted smile and a wave, but kept walking.


    Cooper caught up with me at my door. “You okay? You don’t look happy.” He reached
    out and gave my shoulder a squeeze as he looked at me with concern. I gave his
    hand a meaningful glance, and he quickly removed it. “Sorry. I wasn’t thinking.
    Want to talk about whatever’s bothering you?”


    I sighed. Cooper Milford was a great listener. He was a psych grad student at
    Vanderbilt, after all. “That would probably help. Thanks.”


    He followed me into my apartment. Once the door was closed, he took my hand, and
    this time I didn’t push him away. “What’s up?”


    I launched into my sad story, and Cooper listened, never interrupting or throwing
    in his two cents. When I was finished, I said, “This is probably more drama than
    you signed up for with me.”


    Chuckling, he said, “Are you kidding? Drama is my job. Or rather, it will be once
    I finish up this year.”


    I pulled my hand out of his as I was reminded how young he was—way too young for
    me. I’d just turned thirty-one, and he was only twenty-three. What was I thinking
    with this secret arrangement we had going on? Oh, right. He was adorable and amazing
    in the sack. I was lonely and one cat away from becoming a spinster. Pathetic?
    You betcha.


    He ran his hands through his brown hair. “Juliet, I hate that face you make every
    time our age difference comes up. You know we’re not doing anything wrong here.
    We’re both adults.”


    I scrunched up my nose. “It freaks me out when you read my facial expressions,
    Coop. But I have to admit you’re going to make one seriously good head-shrinker.”


    “It’s a blessing and a curse. Great for my future career, not so great for relationships.”


    “Luckily you don’t have to worry about that with me.”


    Cooper moved closer and put his arms around me. “Right. You know, I’ve been meaning
    to ask you—”


    I was tired of talking. “If I want to move this discussion to the bedroom?”


    After hesitating for only a split second, he smiled. “Yeah.”


    # Chapter 2


    When I returned to Java Jive later that evening, I was sufficiently calmed down.
    But when I walked into the office, the whole can of worms opened back up again.


    Wide-eyed, Pete jumped out of his chair and came over to grip my shoulders. “Jules,
    are you okay? What the hell happened this afternoon? I got a text from Ryder that
    said you broke Scott the Dickhead’s nose in the middle of the coffeehouse and
    that I needed to make sure you didn’t do it again tonight. Then I called you like
    seven times and you didn’t pick up.”


    I was a little busy earlier. I gave him a contrite smile. “I did text you.”


    “ ‘Talk soon’ is not the response I was looking for.”


    “Well, we’re talking now, aren’t we?”


    Pete let out a frustrated grunt and released me. “I can’t believe Scott just showed
    up here. What’s it been—over a year? How did that idiot even find you? And why?”


    I shrugged. “The extent of my conversation with him was me calling him a son of
    a bitch. Ryder was the one who actually talked to him, and he didn’t get much
    out of him.”


    “What could he possibly want from you now?”


    “Who cares? Unless it’s another broken body part, I’m not giving him anything.”


    Pete grinned at me. “It was kind of thuggy of you to coldcock him right out of
    the gate. Not that he didn’t have it coming.”


    I sighed. “I know. I feel kind of bad, though. That was some old school Juliet.”'
