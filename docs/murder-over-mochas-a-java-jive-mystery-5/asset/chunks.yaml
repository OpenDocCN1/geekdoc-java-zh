    I blew out a disgusted breath. “Sweet Chandra lied through her teeth to us.”


    “Sounds like it. And Jason also said that when he left, all samples were present
    and accounted for, so Chandra did in fact stop stealing after she got caught.”


    Ryder said, “Good work. Anything else?”


    “Nope,” Lizzie replied.


    “Okay, we’ll talk later. Thanks,” I said, and ended the call.


    Ryder frowned. “So now there’s Parkinson’s drugs missing again, plus antianxiety
    and heartburn medications. Chandra could have wised up and decided to cover her
    theft a little better this time, stealing several types of meds to throw the new
    boss off track.”


    “If it’s Chandra doing the stealing, then does the drug theft even have anything
    to do with Scott’s death?”


    “Maybe not.”


    “What about Jared stealing the sodium oxybate from Dr. Richardson?”


    “Maybe it’s unrelated, and Scott’s death only has to do with the blackmail.”


    I scrunched up my face, in deep thought. “But everyone said Scott was using drugs.
    What’s up with that?”


    “ ‘Everyone’ as in all the people who’ve been lying to you throughout this investigation?”


    “Plus a couple of people who haven’t.”


    “There’s more than one place to get drugs, Scooby.”


    I rolled my eyes. “You know, your devil’s advocate routine is getting old.”


    Ryder grinned at me. “It’s called objectivity, which is an investigator’s best
    tool.”


    “Well, Detective Objectivity, what do you propose we do now?”


    “I think we should grab some food and some caffeine and wait for Dr. Muniz to
    go to lunch. Then we ambush him.”


    —


    We went to a nearby gas station to stock up for our mini-stakeout. It was ten-thirty,
    so if Muniz took an early lunch, we weren’t looking at much wait time. If he went
    late, we could waste a lot of time. After we got our stuff and headed back to
    Ryder’s car, I got a text. Juggling my thirty-two-ounce soft drink and my junk
    food in one hand to pluck my phone out of my pocket, I read the first several
    words of the text that popped up on my home screen, and then my body turned limp.
    I dropped the snack foods and my drink, which exploded at my feet when it hit
    the sidewalk.


    Ryder said, “What are you doing?”


    Frozen, my eyes glued to the text, I managed to choke out, “We need to get to
    the cabin. Now.”


    He knew me well enough to know I wasn’t messing around. He hurried over and steered
    me to his car, then opened the door and stuffed me inside. Running back around,
    he jumped into the driver’s seat and peeled out of the parking lot.


    “I know that look. Tell me what happened.”


    I let out a slow breath. “I got a text from Mandi. I’ll read it.” After taking
    another breath, I read, “ ‘I can’t take this anymore. I killed Scott. I hated
    him, but I can’t live with the guilt. I’m at his uncle’s cabin, if you care.’ ”


    “That’s a cry for help, but it sounds like we’d better hurry. Call her.”


    As Ryder put the gas pedal to the floor, I sat stunned, barely registering the
    world rushing by at breakneck speed. Even though I’d batted around the idea that
    Mandi could be to blame for Scott’s untimely death, it was jarring to me to find
    out that she’d actually killed him. And even more jarring was the fact that she
    had made the decision to end her own life, as well.


    “Juliet, *call her,*” Ryder snapped.


    I managed to break myself out of the fog and with shaking fingers hit the right
    buttons to place the call. After a few rings, her voicemail picked up. “Mandi,
    it’s Juliet. Please don’t do anything until I get there. I’m sure we can find
    a way to work this out. Please, please, wait. I’m on my way.”


    I hung up and keyed in a text that said basically the same thing, having to stop
    every other word and correct the letters my still trembling fingers mistakenly
    typed in. I called her over and over again, getting voicemail every time.


    The trip out to the cabin took considerably less time today. The moment Ryder
    careened to a stop, a cloud of dust pluming up from the tires, we both jumped
    out of his vehicle and raced to the front porch. While he pounded on the door
    and called Mandi’s name, I checked the windows, hoping for a glimpse of life that
    would assure me it wasn’t too late. Mandi hadn’t answered the door, and the ratty
    curtains were still drawn tight, so I leaped off the porch and circled around
    back. The back door was locked, and I couldn’t see in those windows, either. Heading
    on around, I found the cellar’s storm doors open.


    I ran to the opening and called, “Mandi! Mandi! Are you down there?”'
