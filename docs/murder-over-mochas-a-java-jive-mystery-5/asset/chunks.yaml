    “Let’s not forget the fact that your doorframe is busted where your jilted boy
    toy forced his way in, which leaves you here with no security. Someone could come
    in and murder you in your sleep.”


    “There’s a pleasant thought,” I grumbled, stuffing clothes and toiletries into
    a bag.


    —


    As I followed Pete on the short drive over to his house, I tried again to wrap
    my mind around what had happened. I didn’t take mild-mannered Cooper for a vindictive
    ex, but who else would have gone to the trouble to mess up my apartment but yet
    still show a degree of respect by not vandalizing the place or robbing me?


    When we got to Pete’s house, I went in and collapsed on the couch, placing my
    head in my hands. Between the rush and excitement of performing and the contrasting
    bottoming out when I saw my apartment, I was crazy exhausted, and my head was
    killing me.


    “Jules,” Pete said.


    I looked up to find he’d sat down on the coffee table, facing me. “Yeah?”


    “If I had my way, you’d never have to go back to that craphole of an apartment
    ever again. Move in with me permanently. Tonight.”


    I groaned. “Pete, I so don’t have the energy to discuss this. And it’s a moot
    point anyway because your spare room is so packed with junk it could be featured
    on *Hoarders*.”


    Taking my hands, he pulled me to a standing position. “I have something to show
    you.” He led me down the hallway and opened the door to his spare room. It was
    completely empty.


    My jaw dropped as I walked into the room. “No freaking way. When did you have
    time to do this?”


    He shrugged. “I’ve been chipping away at it for a while.”


    “I totally take back the *Hoarders* comment. This is amazing.”


    Pete walked over and took my hands again. “I thought it was time to let go of
    some stuff to make room for something more important.”


    Whoa. That sounded pretty serious. He’d never presented me moving in here that
    way before. The whole situation scared the hell out of me in the first place,
    which was why every other time he’d brought it up, I’d deflected. Living in the
    same house it would be way too tempting, not to mention convenient, to bypass
    the friend zone and take things to the next level. And then what? Would it get
    awkward between us? Even though he never acted like it, he was my boss, after
    all, so that muddied the waters even more. But then again, I loved him, and I
    always had. Like the song said, *I’m torn*.


    “Pete, I…”


    He smiled. “I’m well aware of the million reasons why you think moving in with
    me is a bad idea. Let me give you one reason why it’s not.”


    Leaning toward me, he brushed my lips with his. I tilted my face up, and his lips
    met mine again, this time hungry and lustful, as if trying to make up for the
    years of lost time we’d spent keeping each other at arm’s length. I kissed him
    back every bit as passionately, wrapping my arms around his waist and holding
    on tight.


    When we finally pulled apart, he smiled down at me and set his forehead against
    mine. “Well?”


    “You make a compelling argument.”


    “I’m just getting started,” he replied, planting a row of steamy kisses down my
    neck.


    My insides trembling like jelly, I cleared my throat. “Don’t you think we’re rushing
    things just a bit?”


    Pete stopped what he was doing to give me a confused look. “Rushing things? It’s
    been twelve years, Jules. We probably hold the record for *not* rushing things.”


    “Maybe this”—I gestured between the two of us—“is post-performance adrenaline.
    Plus the whole thing with my apartment and Scott and…”


    Pete took a step back from me. “You want to take it slow? I can do that.”


    This was it. The moment I’d been waiting for since I was nineteen—when Pete and
    I finally came to the conclusion (at the same time) that we were both ready to
    give a relationship a real try. I thought I’d be elated, which I was, but I was
    also more frightened than I’d ever been in my life—and that was saying something
    given my knack for getting myself into dangerous situations.


    I let out a sharp breath. “Like, *glacially* slow? That would be okay with you?”


    “Whatever it takes to do this right—for both of us. You are the most important
    person in the world to me.”


    Feeling tears prickle at my eyes from his incredibly sweet words, I whispered,
    “You, too.”


    He took my hands again. “Okay, here goes. Juliet Langley, would you like to go
    out on a date with me tomorrow night?”


    I froze. “Tomorrow? I thought we were taking this slow.”


    A hint of frustration in his voice, he replied, “We have to start this at some
    point.”


    I tried to block out the hysteria in my brain. Taking a calming breath, I said,
    “Okay, tomorrow it is.”


