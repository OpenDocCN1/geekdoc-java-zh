- fmt: '

    Even though everything was going perfectly, my old friend stage fright was trying
    to sneak in and mess it up for me. I was struggling to blot it all out and focus
    when Pete came over and took me by both shoulders.


    He said, “I see you freaking a little. Don’t. You’re going to be great. And I
    will be by your side every moment.”


    Fighting to steady my voice, I said, “What if I forget the words?”


    “You won’t.” Wiggling his eyebrows, he said ominously, “But if you do, I’ll just
    shove you off the stage and take over the rest of your set.”


    I laughed. “That is `not` what I expected you to say.”


    “It was a joke. A terrible one. And it took your mind off your problems, didn’t
    it?”


    “It did.”


    “That’s what I’m here for.” He gave me a kiss on the cheek. “This is going to
    be so awesome.”


    With one more squeeze, he let me go, and we got our guitars strapped on and set
    ourselves up at the mics. The venue’s host introduced us, and then we were playing.
    The whole thing went by so fast, I felt like I missed big chunks of it. Before
    the final song, Pete nodded to me, reminding me it was time to say a little something.


    I smiled, the energy in the place giving me a buzz of excitement. “Thanks everyone
    for coming out tonight, especially all of our family and friends. This last song
    is a newer one Pete and I wrote together. Hope you like it. It’s called ‘I’m Torn.’”


    After Pete strummed the first chord, I sang.


    > *It’s complicated.*

    > *Too scared to love you, can’t bear to let you go.*

    > *I’m so jaded.*

    > *Unlucky in love, my heart has lost its glow.*

    > *But with you, I’m who I want to be.*

    > *You bring out the real me.*

    > *Shouldn’t fight it, can’t deny it,*

    > *Still I’m torn.*


    > *So uncertain.*

    > *If we don’t work out, will I lose it all?*


    > *We all stumble.*

    > *You’ve always been there to pick me up when I fall.*


    > *With you, I’m who I want to be.*

    > *You bring out the real me.*

    > *Shouldn’t fight it, can’t deny it,*

    > *Still I’m torn.*


    > *I know I’m lying to myself.*

    > *I’ve loved you from the start.*

    > *I let my head get in the way*

    > *And trample on my heart.*


    I happened to glance over at Pete during his guitar solo (which was amazing, as
    usual). He was looking right at me with the sweetest smile on his face. My heart,
    which I didn’t think could get any fuller tonight, grew warm as I finished out
    the song.


    > *With you, I’m who I want to be.*

    > *You bring out the real me.*

    > *Shouldn’t fight it, can’t deny it.*

    > *My heart keeps on telling me*

    > *You’re the only one for me.*

    > *Shouldn’t fight it, can’t deny it,*

    > *Still I’m torn.*

    > *Still I’m torn.*

    > *I’m still torn.*


    The crowd erupted into applause, and the moment the lights went down, I felt Pete
    sweep me up into a crushing hug.


    “You did it, Jules. I am so proud of you. I can’t…I can’t even find the words.”


    We were so close, his breath was hot on my neck as he spoke, and at the end, he
    let his lips brush against my collarbone. An electric tingle shot through my entire
    body, and I had to struggle to keep my focus. The rush of being onstage with Pete
    kindled all kinds of feelings I’d worked for years to keep dormant.


    “Thank you. You know I couldn’t have done it without you.”


    He pulled back and looked down at me, his expression serious and intense. Before
    he could say anything, Javier and Mick came over to give us high fives and hugs.
    We all congratulated one another on a performance that frankly had exceeded all
    of our expectations, especially since it was the first time we’d played together
    as a group outside of rehearsals. We went down into the sea of friends and family
    in the audience, all impatiently waiting to give hugs and congratulations of their
    own.


    ***


    Once most of our audience had cleared out and the next band began to play, Cooper
    found me and gave me a quick hug. “That was great, Juliet.”


    “Thank you. I appreciate you coming out to hear us.”


    “I wouldn’t have missed it. Hey, I’m going to be sitting at the bar for a while—giving
    you your space—so if you have time, you’re welcome to come over and hang with
    me there. No pressure, though.”


    “Thanks, Coop,” I replied. Ugh. Why did he have to be so stinking nice?


    When I returned to the table with my friends, Maya asked, “Who was `that`?”


    He pulled back and looked down at me, his expression serious and intense. Before
    he could say anything, Javier and Mick came over to give us high fives and hugs.

