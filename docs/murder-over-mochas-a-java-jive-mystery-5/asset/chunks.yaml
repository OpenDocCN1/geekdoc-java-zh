  trans: '

    我大笑出声。“我才不要。”自从一年多年前他离开我之后，我就再也没有见过或和斯科特谈过话。我不想现在开始。


    “我是认真的。在你揍他之前，你听听他说什么了吗？”


    “不太清楚。”


    “他说你需要他的帮助。”


    “我会送他出门。”


    莱德露笑了。“行了。我所认识的那个 `Juliet Langley` 永远不会拒绝需要帮助的人。”


    “斯科特不是人。他是个卑鄙、骗子、没出息的蛋——”


    他举起一只手。“我知道。你提到过了。”


    我双手抱在胸前。“我不想理他说话。讨论结束。”


    “好，那我去跟他谈。”


    “随你的便吧！”他溜出门门时，我冲他吼道。“啊！”我大叫着，抓起最近的东西——沙发上的一个枕头——朝着房间另一头扔了。


    天到底为什么斯科特·奥马利会在千百万人中偏跑回来向我寻求帮助？他是不是蠢到以为我会为他做 `anything` 事情？他毁了我的生活。在他和我共同经营的咖啡馆的一名女员出轨后，他掏空了我们的银行账户和咖啡馆的账户，偷走了我所有的财物，然后逃了。。我留下一个仍然要付房租的空公寓，以及一家没有资金购买物资或支付员工工资的咖啡馆。我不得不关闭咖啡馆，这比任何事情都让我痛苦。雪上加霜的是，如果我最好的朋友
    `Pete Bennett` 没有在当时伸出来并为我提供 `Java Jive` 的经理职位，我就得搬回父母家住了。这也是为什么我起初会在纳什维尔。如果这一切没有发生，我本应该回到老家，可能已经和那个鼠类一样的斯科特结婚了。


    想到这里，我不禁打了个冷颤，给自己倒了一小杯伏特加，我和皮特存在办公室里用来庆祝和应急的。酒液一直灼烧到喉咙，但稍微缓解了一些压力。当我把酒瓶收回写字抽屉时，莱德回来了，看了一眼瓶子和我用过的小酒杯，但什么也没说。


    “怎么样？”我问。“你们聊得愉快吗？”


    莱德的嘴角微微撇了一下。“那家伙真是个彻头彻尾的混蛋。”


    “你觉得呢？”


    “他还带包。”


    我笑了一下。自从我认识斯科特，他就总是单肩挎着一个小邮差包。而且是的，它看起来确实像个包。如果你非要从技术角度来说，由于他把钱包、钥匙、手机、零钱和润唇膏都放在里面，那它确确是一个包。“他喜欢别人称它为单肩包。”


    “随他吧。他似乎很坚持要和你谈。他没告诉我任何细节，但他说他遇到了麻烦，而你是唯一信任会帮助他的人。”


    “你传达了我的信息吗？我一点也不在乎他的问题？”


    莱德笑了笑。“我很确定他的鼻子被打断了。我觉得你的意思已经传达了。”


    “很好。他走了吗？”


    他忍着脸说：“算吧。等你有时间消气后，他今晚上会回来。”


    “什么？”我大叫道。


    莱德双手挡在脸上。“别打打信使。”


    我翻了个白眼。“哈，哈。”


    他的表情变得严肃。“嘿，我觉得你应该听听他的。他看起来是真的很难过。我晚点要带玛雅去看电影，所以我没法当裁判。你觉得没有我的情况下能控制住你愤怒的拳头吗？皮特会在这里支持你吗？”


    “他应该会。尽管我得提醒你——他认识斯科特，而且他讨厌他的程度并不比我少。”


    “你们两个完全可以像大人一样处理这件事。”


    “我和皮特？很难。”


    他沮丧地按了按山根。“如果我在约会期间接到电话要来从监狱里保你出来……”


    我甚至不想考虑被关进监狱（再次）的事，换了个话题。“所以你打算去看什么电影？”


    他耸耸肩回答道：“不知道。某部爱情片。玛雅选的。”


    我惊讶得掉了下巴。“看吧？女孩电影！”


    “你抱怨什么？你压根就不喜欢那种电影。”


    好吧，我被说得没错。


    ***


    我无法摆脱斯科特突然出现在 `Java Jive` 带来的不安感，于是先回家了一会儿试着让自己冷静。我走着生锈的楼梯回到我二楼的公寓，一边自言嘀咕，想着这一切都是斯科特的错，才导致我付不起更好的房子，不得不住在这个到处是吵闹的大学生的破旧建筑里。


    当我经过新邻居 `Cooper` 开开的窗户时，他喊道：“嘿，朱莉特！”


    我给了他敷衍的微笑并挥了挥手，继续往前走。


    库珀在门口赶上我。“你还好吗？你看起来并不开心。”他伸手捏了捏我的肩膀，担忧地看着我。我意味深地看了他的手，他很快收了回去。“抱歉。我没过脑。想聊聊困扰你的事吗？”


    我叹了口气。“我只是在想斯科特。”


    '
- fmt: '

    “Ah, yes. The infamous Redheaded She-Devil. Haven’t seen her in a long time. I
    was beginning to think she was gone for good.” Lowering his voice, he added, “If
    I’m honest, I’m happy she’s still in there somewhere. I like her style.”


    Chuckling at his reference to the alter ego he’d coined for when my fiery temper
    got the best of me, I said, “I’d be okay with her hibernating from now on. I want
    to be able to keep it together when Scott comes back here tonight.”


    “You’ve got me, and I’m not leaving your side. Although if it’s clear to both
    of us that he needs another good slug, I might pick that time to look the other
    way.”


    I smiled. Pete was always on my side. We’d been best friends since the first day
    I’d walked into `Java Jive` my freshman year in college. His dad owned the place
    and had left it to Pete when he’d passed away. But, since Pete already had a job
    working as a sound engineer at one of Nashville’s big `Music Row` recording studios,
    he needed someone to manage the place. I knew the ropes since I’d worked here
    with Pete all during college, so it was a no-brainer. That was one thing I didn’t
    blame Scott for—it was truly a joy to get to work and hang out with Pete again.


    “Thanks. Now that he and I are even, so to speak, I don’t want to come off looking
    like some miserable, jilted woman. Because…you know…I’m not…” I trailed off uncertainly.
    “Right?”


    Pete laughed. “You’re far from it. You might have had a few relationship ups and
    downs lately, but that happens to everyone. You always seem to come out on top.”


    I wasn’t too sure about that. My last few attempts at dating had had more downs
    than ups, which was probably why I’d all but given up on the prospect of an actual
    relationship anytime in the foreseeable future. At least in that sense, my young
    friend Cooper was the perfect fit for me, although I knew everything else was
    wrong. I was even too embarrassed to tell any of my friends about our arrangement.
    I told Pete everything, but not this.


    I blew out a breath. “If you say so.”


    “I know so. Think about what you’ve been through and accomplished in the past
    year and tell me you’re not the most awesome woman you know.”


    I blushed. “Aww, Pete.”


    He took my hand. “You’re the most awesome woman *I* know.”


    A flutter rippled through me. Pete and I had more-than-friends feelings for each
    other, and had for a while, but for one reason or another, our timing was never
    right. Plus there was the risk we’d ruin our friendship by trying to make a romantic
    relationship work, which was something neither of us could live with. So we just
    didn’t try. Hence, my seemingly inevitable looming spinsterhood.


    Thankfully, there was a knock at the door that broke up our little moment. Pete
    and I took a step apart.


    Cole, one of our evening-shift baristas, stuck his head in the door. “Juliet,
    that dude you jacked up this afternoon is back. You want me to throw him out,
    or are you ready for round two? Oh man, Pete, you should have seen it. She was
    like *POW,* and that dude was down for the count. Everyone’s been talking about
    it all afternoon.”


    Pete snickered, and I hung my head. I could imagine how much of a field day my
    staff had had discussing and dissecting my poor decision. Why did things like
    this always happen to me?


    “I’ll be out there in a sec,” I murmured.


    After Cole left, Pete said kindly, “You’ll do fine. Get this over with, and you’ll
    never have to give that loser another thought.”


    I nodded and headed out of the office. Scott was seated at a table, looking nervous
    and fidgety again. He’d put a bandage over his nose, and bruises had begun to
    form around both of his eyes. I’d really socked it to him.


    I didn’t quite feel that “Hey, Scott” would be the appropriate greeting after
    I’d rearranged his face, so I sat down wordlessly across the table from him. His
    “satchel” was between us, and I had to suppress a grin when I recalled Ryder dissing
    it earlier.


    He sighed. “I know I have no right to ask you for anything. And I don’t blame
    you a bit for punching me.”


    I bit back a pithy response about *him* not blaming *me* for something he clearly
    had coming. Instead, I said, “Why did you come here?”


    He glanced around to make sure no one was listening in on our conversation. There
    were only a few people, seated at the other end of the room, well out of earshot.
    “I’m in big trouble, Juliet. I don’t know who to trust…but even though you hate
    my guts I know I can trust you. I have no one else to go to.”


    “What about *Mandi*?” I asked, referring to the waitress he’d left me for. Couldn’t
    hold back that one.


    I noticed he was sweating. A lot. And he was pale. His blond hair, which normally
    was (too) perfectly styled, hung lank around his face. His hands were even shaking.
    I could have written off the paleness as a side effect of the nose-breaking incident,
    but not the rest of it. I also happened to notice he was sporting a wedding band
    on his left hand, which irritated me, but I tried not to dwell on it.

