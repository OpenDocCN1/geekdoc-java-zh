    Chandra seemed to be struggling. “It’s not polite for me to gossip.”


    I stared at her. “Someone poisoned Scott and he died. This is serious, Chandra.
    We’re here to investigate a murder, not to worry about what is and isn’t polite
    to talk about. If you know something and withhold it, Scott’s killer could go
    free. Do you want that on your conscience?”


    She choked out a sob. “N-n-no. It’s true there’s something going on between Jared
    and Mandi. When they’re in the office, they’re always whispering to each other
    or having meetings behind closed doors. They do some sales calls together, which
    isn’t necessary. I haven’t seen anything actually happen between the two of them,
    but if they’re not stepping out behind Scott’s back, I’d be shocked.”


    Trying to smooth things over after my last blunt statement, Pete said, “Thanks,
    Chandra. You’ve been a real help to us. Keep your eyes open at the office, and
    if you have any more information for us, please give us a call.”


    I handed her one of my business cards, and we got up to leave. Once we were back
    inside Pete’s car, he pulled out of the driveway and said, “You still got some
    angst going on, huh?”


    “Chandra needed a little nudge to get her talking.”


    “That wasn’t a nudge. That was a heavyweight knockout punch.”


    I smiled. “I thought you said we have to bend the rules to get stuff done today.”


    “Not with a nice lady like Chandra. She—”


    “Hey, looky there.” I pointed out my window at Scott and Mandi’s house as we drove
    past. “Mandi has a gentleman caller.”


    Jared Fisher, wearing a baseball cap and sunglasses, was ducking into the front
    door of the home.


    Pete’s eyes bulged out. “Wow. It hasn’t been twenty-four hours. Is Scott even
    cold yet?”


    “Well, to be fair, she was already cheating on him before he died, so it’s not
    like she was subject to the requisite postmortem wait time like a faithful spouse.”


    “That is terrible logic.”


    “Mandi is a terrible human being. Hey, I brought my parabolic mic. Want to try
    to listen in?”


    “Since they’re probably doing it, then no, not particularly. I want to get this
    over with and go home,” he replied, zooming past the house.


    —


    I’d wanted to try to stay away from Scott’s family members, partly because I didn’t
    want to disturb their grieving, but mostly because I didn’t think they’d give
    me the time of day. One cousin of his, though, had stayed in contact with me.
    Bethany McCool was an odd bird, but she never held back on a conversation. If
    she knew something, she’d spill it.


    Bethany lived in a new apartment complex over by the town’s small hospital. When
    she opened the door and saw me, she squealed in delight and tackled me in a hug.


    “Ooh, Juliet! Wow! I was so excited when I got your text. I can’t believe you
    decided to visit me after all this time.” She pulled back, as if suddenly remembering
    that she was supposed to be more solemn. “I mean, Scott dying is just so tragic.”
    Ever the drama queen, she put her hand over her mouth to stifle a fake-sounding
    sob.


    Pete gave me a puzzled look as she let us into her apartment.


    “Bethany, this is my friend Pete.”


    Bethany looked Pete up and down like he was a piece of meat. “Hey there, Pete.”
    She turned to me. “Friend or boyfriend?”


    I bit back the smile forming on my lips. We’d get all kinds of info out of Bethany
    if she was trying to impress Pete. “Just a friend.”


    I’d warned Pete not to give up any sensitive information to Bethany, since she
    worked at the `Liberty Chronicle`. I should have also warned him that Bethany
    flirted with every man she came in contact with, but I’d forgotten. It was too
    late now, and it would be rather funny to watch. Bethany was a great girl, but
    not what you might call attractive. That didn’t stop her from dressing like a
    nineteen-year-old reality TV star. Today she was sporting way too short cutoff
    jeans and a skintight tank top. It was unseasonably warm today, but not that warm.


    She pulled Pete by the arm to sit on the couch next to her. I took the chair beside
    them. Pete was already starting to squirm.


    I said, “Sorry for inviting myself over, but you know I’ve been doing some PI
    work lately.”


    “Ooh,” Bethany cut in. “Me, too! My best friend, Lizzie, and I are always wrapped
    up in some kind of crazy sleuthing adventure. Just a couple of months ago—”


    Pete cut in on her with a charming smile. “I would love to hear that story sometime,
    Bethany, but we’re in a real time crunch. We’ve got lots of…technical PI stuff
    to do and very little time to do it. Could we ask you a few questions? We think
    you may be able to help us out a lot.”


    Bethany was practically purring from his attention. “Sure. Ask me anything.”


    Pete cleared his throat and gave me a pleading glance.


    I said, “How much contact have you had with Scott lately? Did you notice a difference
    in his behavior around three months ago?”


    Scooting even closer to Pete, she said, “Yes, and even before that, I noticed
    a big change in him. I mean, you knew him well, too.”

