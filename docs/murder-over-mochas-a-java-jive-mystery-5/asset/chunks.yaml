    the Dickhead,” which was how I occasionally (okay, more than occasionally) referred
    to him. Detective Delaney knew the answer to his question. He just wanted to make
    me say it.


    “Yes. He left me.”


    He narrowed his beady, already too-close-together eyes at me. “And?”


    I sighed. “And stole my money and my belongings and caused my café to go under.”


    “Did you press charges against him for this or try to sue him?”


    “With what money? He’d taken everything. Plus, I was stupid enough to have joint
    bank accounts with him, so he had every right to wipe out the money. And how could
    I prove it was my tax return money that paid for our couch or that the lamp by
    our bed was passed down to me from my great-grandmother? Impossible.”


    His mouth pulled up in the corner. “Sounds like you’re still angry about it.”


    I didn’t reply.


    “So maybe you decided to take matters into your own hands to get even with him.”


    Again, I didn’t reply. I didn’t have to. This was an interview, not an interrogation,
    although it seemed to be heading that way fast.


    “I hear you assaulted him this afternoon.”


    “I hit him in the nose.”


    The detective leaned back in his chair, which caused the buttons of his shirt
    to strain against his ample beer belly. “Why would a nice girl like you do something
    like that?”


    “It was the first time I’d seen him since he left.”


    “So you had a score to settle.”


    I paused for a moment to come up with the right spin. “I let my temper get the
    better of me and acted before I thought.”


    “And then you lured him back here so you could kill him.”


    There it was. This guy clearly wasn’t aware of my expertise in being on the wrong
    side of a police investigation. “Oh, so you’ve already classified this as a homicide?
    That was quick. I didn’t realize the ME was doing complete autopsies on-site these
    days.”


    Delaney’s whole head turned a reddish-purple. He spat out, “Don’t be a smart-ass.
    You’re the only one who wanted to see him dead.”


    I highly doubted that, but it seemed like I was fast becoming a prime suspect
    anyway. “Do I need a lawyer?” I hoped not, because although I’d crawled out of
    my aforementioned bankruptcy hole, I wasn’t exactly rolling in it after a year
    of having to play catch-up.


    After mulling over my threat to lawyer-up, he backed off slightly. “What do you
    know about the victim’s wife being missing? Mr. Bennett mentioned that in his
    interview.”


    “Scott told me his wife had been abducted. Based on what he said, it sounded like
    she’s been missing since this morning, but he didn’t get around to telling me
    who had taken her. He said he’d been threatened because he had something someone
    else wanted. Mandi became the leverage. You know, you should probably be focusing
    some of your attention on looking into her disappearance, Detective.”


    Before he could blow another gasket, the door opened, and I heard a familiar voice.
    When I turned, I found Ryder striding toward me, his jaw locked up tight and his
    serious cop face in place. Detective Delaney lumbered out of his chair and pulled
    himself up to his full height, which was several inches shy of Ryder’s.


    Delaney barked, “What are you doing here, Hamilton? Didn’t you wash out of homicide
    after only one case, and aren’t you out on leave for a boo-boo, anyway?”


    Ryder ignored him and looked at me. “Are you okay? One of the guys at the station
    called me and told me something went down here. Is that…?” He gestured toward
    the big bag they’d just put Scott in.


    I nodded.


    His voice was strained. “I am so sorry, Juliet.”


    Delaney said, “Quit chatting up my suspect, Hamilton. I don’t know how you managed
    to badge yourself in, but this is my crime scene. Get lost.”


    Ryder finally turned to Delaney. “Yeah, it’s a crime scene. And because of that,
    it’s not a proper location to question anyone. Her lawyer gets hold of this, and
    your whole conversation could become inadmissible.”


    Yeah, *if* I had a lawyer, which I didn’t. But I was starting to think I might
    need to find one tonight.


    Delaney held up his hands. “Okay, fine. You want her out of here? I’ll take her
    out of here.” He grabbed my arm and hoisted me out of my chair. “We’re going to
    the station.”


    All I could think was *Please don’t handcuff me*. Ryder practically had steam
    coming out his ears, and he jawed at Delaney all the way out the door and down
    the sidewalk to his cruiser.


    As Delaney was unceremoniously stuffing me into the backseat, Ryder said to me,
    “Maya and I will grab Pete and meet you at the station. Don’t worry, okay?”


    Easy for him to say, although in the back of my mind I knew I had the truth on
    my side.


    Delaney smiled menacingly. “Don’t bother with Bennett. He’s already got a free
    ride downtown.”


    Okay, *now* I was worried.


    —


    I’d been “taken to the station for questioning” before, so I knew what to expect,
    but it was still embarrassing as hell. At least I didn’t have the added humiliation
    of arriving in handcuffs.


    I waited for what seemed like hours in a little interrogation room. Finally, Delaney
    came in smirking at me. But as cocky as he seemed, he’d become awfully disheveled.
    His shirt was rumpled, his tie was hanging loose, and it looked like he’d lost
    a button or two near his collar.


    He slapped a manila folder down on the table between us. “Scott O’Malley’s preliminary
    cause of death is cardiac arrest.”


    No kidding. His heart stopped. I could have told them that.


    He continued, “The ME informed me that she thinks he may have come in contact
    with some kind of substance that could have killed him.” Leaning toward me, he
    asked, “You know anything about that?”


    “No.”


    “Witnesses say he ingested coffee and water while he was talking to you. Maybe
    you slipped something into one of his drinks.”


    “No, I didn’t.”


    “Maybe your friend Pete Bennett did it, then. He served the victim both drinks—isn’t
    that correct?”'
