    I thought for a moment back to what Scott had said to me before he died. “So would
    you consider these doctors wealthy and powerful people who Scott had taken some
    information from?”


    “Sure, you could put it that way.”


    “Could they also be the dangerous people who Scott had had bad business dealings
    with and who might threaten him and supposedly kidnap Mandi the first time?”


    “They could be. And maybe they’re responsible for Mandi’s disappearance this time,
    too.”


    Lost in thought, I grabbed the pie pan and dug in as I sank back into the couch.


    Ryder pushed my fork aside and stabbed a big piece of apple. “I thought we were
    sharing, `Julie`.”


    I elbowed him out of my way. `Julie` is carrying your child, Seth. Would you rob
    her of food?”


    “No, but I would do it to Juliet the baby-hater.” He snatched the pan out of my
    hand.


    I rolled my eyes. “Are you going to keep bringing that up? Wait, you haven’t been
    talking to my mom about it, have you?”


    He shrugged, mouth full of pie. “It might have come up.”


    “In the five minutes you talked to her alone?”


    “Hey, none of us are getting any younger. It’s about time we figured out who we
    want to be with so we can do what needs to be done before it’s too late.”


    I stared at him. “You’re such a girl. I can hear your biological clock ticking
    from all the way over here.”


    “It’s called being an adult. You should try it sometime.”


    As light as this conversation seemed on the surface, I was getting a major vibe
    about the undertone. I said quietly, “You said that we need to figure out who
    we want to be with. Have you…decided on Maya?”


    Ryder put the now empty pie pan back on the coffee table and turned to me. “Have
    you decided on Pete?”


    “I asked you first.”


    He let out a breath. “Well, I’ve known Maya for years. We’ve always got along
    as friends, but lately I feel like things have changed. In a good way. I think
    I’m really starting to fall for her.”


    I nodded, a swirl of emotions needling at me. On one hand, I was thrilled for
    him and for Maya. On the other hand, it felt strange to hear those words from
    him about another woman. “That’s great.”


    His expression serious, he said, “I know it might not be the best time to bring
    this up, but I can tell you’ve got some sort of reservation about me dating her.
    I’d like to know what it is. You know us both well. Do you think we’re not right
    for each other or something?”


    The pie started churning in my stomach. So he did know I wasn’t as excited about
    him dating Maya as I tried to seem. Damn. I thought I was a better actress than
    that. And now I had no choice but to ’fess up to the truth about my feelings,
    because any other way I answered that question could hurt his relationship with
    Maya.


    “No. I think you’re perfect together. It’s just that…” I blew out a breath. “Sometimes
    it’s hard to watch someone else move on.”


    “You told me to move on.”


    “I know that. But there’s a tiny part of me…”

