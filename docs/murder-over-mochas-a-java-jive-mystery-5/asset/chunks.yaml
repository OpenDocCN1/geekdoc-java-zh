    Since we’d grown up together, Jack excused himself from questioning me and turned
    me over to William, who seemed nice enough although fairly businesslike. William
    showed me to a suffocatingly small room in the basement, which I vaguely remembered
    being in as a child. He left for what seemed like hours, and when he finally returned,
    he sat down across from me at a metal table, the room eerily quiet while he perused
    the file he brought with him.


    “So you’re a PI, Ms. Langley,” he said.


    I bit back a sigh, so not ready to do this yet another time. “Yes. You can call
    me Juliet. We did go to high school together, if only for a year or so.”


    “Sorry, force of habit. Juliet, you’re here investigating Scott O’Malley’s death,
    correct?”


    “Yes.”


    After a pause, he asked, “Who contracted you to do that?”


    “No one. This is a personal matter.”


    “Because you were at one time engaged to the victim or because you were the last
    person to see him alive?”


    “Look, William, I know you already know the answers to these questions. This isn’t
    my first time being interrogated.”


    His mouth pulled up in the corner, but he didn’t crack a smile. “This is only
    an interview.”


    “Right. That’s what they all say. Why don’t you cut to the chase? I’m sure you’ve
    talked to Detective Delaney about me.”


    Nodding, he replied, “I have. He’s not your biggest fan.”


    “It’s mutual.”


    “He says you’re a viable suspect in Scott O’Malley’s death. Today you find his
    wife’s dead body. I can’t imagine the two of you have been close after she ran
    off with your fiancé last year.”


    “No, we haven’t.”


    “Yet you are the one person she decides to inform that she’s about to end it all.”


    Yeah, I found that a little strange, too. “She knew I wanted to get to the bottom
    of who killed Scott, so maybe this was her way of making amends with me.”


    “I don’t think so.”


    “Well, what do you think?”


    William eyed me for a moment. “Let’s talk some more before I tell you what I think.
    In your investigation, did you find any evidence that would suggest that Mandi
    O’Malley had killed her husband, like her text to you stated?”


    I trusted Jack, but I didn’t know if I trusted this guy. He was Jack’s partner,
    which had to count for something. Plus, if I didn’t give up my info, it would
    only get me into more trouble, and Jack was interviewing Ryder, who probably felt
    a duty to share anything he knew with a fellow cop. I only hoped anything I said
    wouldn’t later be used against me.


    So, I started at the beginning and told him everything. Well, nearly everything.
    I wasn’t about to include any sensitive facts that would come back and bite me
    in the butt, like stealing evidence, multiple B and E’s, and the small matter
    of having to disarm Mandi when she held me at gunpoint for intruding in her home.
    From punching Scott in the nose to finding Mandi a short time ago, I walked him
    through my investigation and laid out all the dirt we’d uncovered so far, including
    the blackmail and drug theft Scott was mixed up in.


    William blew out a breath and leaned back in his chair, running his hands through
    his closely cropped blond hair. “That’s a lot of information.”


    “Tell me about it. What we’ve been stumbling over is what is and what isn’t pertinent
    to Scott’s death.”


    He leafed through the file and perused one of the reports. “They’re leaning toward
    drug overdose or poisoning as his COD. I’ve talked to a few of his friends and
    family members, and none of them seemed to be shocked to find out it was an overdose.
    Are you only investigating this to exonerate yourself or do you know something
    no one else does?”


    “I know how Scott was acting when he came to talk to me. He was convinced Mandi
    had been kidnapped by these ‘dangerous and powerful people’ he’d stolen some kind
    of information from. If he’d overdosed on purpose, why come to me and ask me for
    my help? When people get to that point, don’t they just hang at home and wait
    to die?”


    Shrugging, he replied, “I agree with you there. But what about the possibility
    of an accidental overdose?”


    “I guess that can’t be ruled out, but come on. He was a drug rep. Surely he was
    educated on dosage amounts. He was a smart enough guy.”


    “Unless he’d been using for so long he had to up his dose to get a high.”


    “Doesn’t that come after more prolonged drug use, though? According to his friends,
    he hadn’t been acting strangely for a terribly long time. A few months at the
    most.”


    “Okay, let’s say this wasn’t an OD. Let’s say it was a poisoning, and his wife
    did it. If she was missing—or at least he thought she was—how did she slip him
    the substance that killed him without him seeing her? It would have had to go
    in his food or drink, and it would have had to have been done shortly before he
    showed up at your coffeehouse.”


    I stared at him. That thought hadn’t crossed my mind, but he was right. Mandi
    could have easily slipped anything she wanted into his food or drinks at home,
    or even at the office for that matter, unnoticed. But he was in Nashville looking
    for her, so how did she get close enough to poison him without him seeing her?


    # Chapter 24


    After finishing up my interview with Detective Johnson and handing over Scott’s
    tablet, I was finally free to go. Ryder was waiting for me in his car. As soon
    as I got to the parking lot, a black Porsche pulled into the lot, and Blake and
    Lizzie both jumped out of it. Oh, boy, I was so not in the mood to regurgitate
    this story again.


    Blake demanded, “Why didn’t you call us when you found Mandi?”


    Ryder got out of his car as well and came over to stand next to me. “It’s not
    our job to inform you of police matters.”


    Blake drew himself up to his full height and crossed his arms. “I thought we were
    working together.”


    Ryder did the same. “Don’t forget you’re part of the media, pal. We called in
    an unattended death. It wasn’t something we needed to run by you.”

