    He explained, “The kickback itself isn’t the problem. The issue is that it’s a
    form of fraud to take or give anything—gifts, money, or even sex—in exchange for
    prescribing a particular medication that ends up being paid for by a federal health
    care program. By prescribing to a patient on `Medicare`, for example, you’ve involved
    the government in your scheme to make a profit on the side, and that’s what makes
    it fraudulent. The rep and the doctor could both be fined and go to jail for it,
    and the company generally gets in a fair amount of legal trouble, as well.”


    My heart twisted. “So everyone involved could get in enough trouble to make it
    worth their while to try to silence Scott?”


    “Unfortunately, yes, which means our suspect pool just got a lot bigger.”


    My phone rang, and it was Melinda. She said, “We’re here. You said you’re in the
    cellar?”


    “Yes. The entrance is through the storm doors on the west side of the cabin. And
    who’s we?”


    She hung up before hearing my question, and a moment later, we heard a scraping
    noise at the door. The doors opened, and sunlight flooded into the basement. When
    I looked up and my eyes adjusted to the brightness, my face twisted into a frown.
    She’d brought along my least favorite reporter, `Blake Morgan`, and his wife,
    `Lizzie`, who was a friend of hers.


    Ryder murmured to me, “I assumed she’d be coming alone.”


    “Me, too,” I replied.


    Melinda smirked down at us. “Didn’t think I’d be coming to your rescue today like
    some kind of superhero.” She glanced past us into the cellar. “Wow. What a creeptastic
    place to be stuck in. I’m jealous.”


    As I climbed the stairs, I muttered, “Thanks for coming out to help us, Wonder
    Woman, but I didn’t realize you’d be bringing…sidekicks.”


    When Ryder and I got up to ground level, Lizzie said, “Hey, Juliet. I don’t know
    if you’ve met my husband, `Blake Morgan`.”


    Blake flashed me a megawatt smile and stuck his hand out to me, but I didn’t take
    it. His pretty-boy charm did nothing for me. “I know who he is.”


    Lizzie rolled her eyes at her husband and slapped him on the arm. “Don’t tell
    me this is yet another woman you dated and dumped when you first came to town.”


    Blake studied me with a puzzled expression. “I don’t think so…”


    I said, “No, he just wrote a scathing review of my café that ended up being the
    final nail in its coffin.”


    I could tell by the gleam in her overly kohl-rimmed eyes that Melinda was enjoying
    the excruciating awkwardness in the air way too much. Twisting a strand of her
    black and blue striped hair around her finger, she said, “So…while we’re making
    polite introductions, this is `Ryder Hamilton`, one of Juliet’s friends. Ryder,
    `Lizzie` and `Blake Morgan`.”


    After they shook hands somewhat stiltedly, Ryder said, “I appreciate you guys
    coming out here, but I’m going to have to ask you not to report anything you’ve
    seen or that Melinda has told you. We’re in the middle of an ongoing investigation,
    and we don’t want to tip off our suspects to what we’re working on. That’s why
    you’re here, right? For the story?”


    Blake at least had the grace to laugh. “Guilty, sort of. Melinda was at the `Chronicle`
    office picking up `Lizzie` to go to lunch when she got your call. I insisted on
    tagging along, but partly for safety in numbers. Never can be too careful around
    here.”


    Melinda pulled me aside, out of earshot, while Ryder continued to impress upon
    Blake how important it was to keep information about our investigation off the
    front page.


    She frowned. “Sorry about bringing them with me. I said you probably didn’t want
    an audience, but Blake never listens. So seriously, who in the hell would want
    to lock you in someone’s freaky basement?”


    “If I knew that, I might also know who killed Scott and why `Mandi`’s missing.
    What had been done to the door to lock it, anyway? Scott’s uncle always leaves
    the latch open.”


    “A piece of rusty rebar was shoved through the loop of the latch.”


    “And you didn’t see anyone around when you arrived?”


    We looked up when we heard Ryder start shouting expletives, then watched as he
    stalked toward his vehicle and began inspecting it.


    Melinda replied, “No. It was deserted except for that car. Which I assume belongs
    to him, given the fact that he’s the one having an aneurysm over the four flat
    tires.”


    I glanced down at the tires, and darned if they weren’t all flat as a pancake.
    I shook my head tiredly. “This day is getting worse by the minute.”


    “Well, look at the bright side. You must be close to figuring this out if someone
    locked you up and ruined your only means of transportation.”


    I sighed. “True.”


    Blake had begun speaking with Ryder, and after a few moments Lizzie wandered over
    to us. A pretty blonde who was known for speaking her mind, `Lizzie` had been
    the talk of the town when she’d managed to rein in `Blake Morgan`, `Liberty`’s
    most eligible bachelor. She and I were never more than acquaintances, with her
    being a few classes behind me in high school.


    She said, “Hey, sorry Blake and I kind of made your business our business, but
    we wanted to get the chance to speak to you today, since you were in town again.
    My best friend’s husband is a drug rep for a rival of `Silver Spruce`’s.”

