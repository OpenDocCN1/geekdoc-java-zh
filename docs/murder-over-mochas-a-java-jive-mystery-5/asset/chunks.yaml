  raw: 'Hearing no response, I almost turned away. But my gut twinged, and I felt
    compelled to at least look. I descended the rickety steps, and that taxidermy
    scent hit me immediately. On the next to bottom step, I stopped dead in my tracks
    and sucked in a gulp of air. Mandi was hanging by her neck from one of the metal
    pipes that ran along the ceiling, tongue out, dead-eyed, and still.


    # Chapter 23


    Stifling a sob, I turned away from the sight of Mandi hanging by an old frayed
    rope she’d no doubt found down here. Why couldn’t she have waited even a few minutes?
    We could have saved her. It didn’t have to end like this.


    My feet were leaden, but I managed to drag myself back up the stairs in time to
    see Ryder kicking in the front door of the cabin. Before he went in, I called,
    “Ryder!”


    After taking one look at my face, he raced over and put his hands on my shoulders.
    “Did you find her?”


    I nodded, tears spilling down my cheeks. “She’s gone.”


    He put his arms around me and held me, but not for long enough. “I’m sorry. I
    hate that you had to find her. But you know the drill from here on out. I need
    to go check for a pulse and call this in. Will you be okay by yourself?”


    I nodded again, afraid I’d totally lose it if I spoke.


    Ryder gave me one last squeeze, and then headed down into the cellar. I spent
    a few excruciating minutes alone, shaking so much I had to sit on the porch steps
    and so nauseated I couldn’t see straight. He finally emerged, phone at his ear,
    already on the horn with the local PD.


    I picked up the last of his conversation once he got within earshot. “No, no need
    to rush. I found no pulse.” After a pause, he said, “No, I didn’t touch anything
    besides her wrist. What, do you think I don’t know what I’m doing?” After another
    pause, he said, “We’re not going anywhere. We’ll be here.”


    I couldn’t even fathom going through a round of interrogations about finding another
    dead body, especially of yet another person I’d had a rocky history with.


    Ryder stood in front of me. “You doing okay?”


    “Sure. Why wouldn’t I be?”


    He sat down next to me on the steps. “At least you’re not too out of it to be
    sarcastic. That’s something.”


    I sighed, putting my head in my hands. “I can’t believe she did it.”


    “Really? I thought she was your number-one suspect.”


    “Well, she was, but…I don’t know. I mean, yes, the evidence on her is compelling.
    It’s just…I guess I wanted to blame her, but at the same time I don’t want to
    believe that she actually had it in her to do it.”


    “I get it. You worked side by side with her for a long time, right?”


    I nodded. “As long as I’ve worked with some of my staff at Java Jive. It would
    shock me just as much if any of them did something like this. It’s not what you’d
    expect from someone you think you know so well.” Blowing out a breath, I added,
    “It’s difficult to be angry with her when she took care of punishing herself for
    what she did.”


    He put his arm around me and left it there while we waited for the Liberty Police
    Department to show up. It was only minutes before we heard the wail of sirens
    approaching. The circus was about to begin.


    Two plainclothes detectives got out of the first police vehicle and approached
    us. One of them was someone I’d known practically all my life.


    “Jack,” I said, standing and walking over to meet them. Ryder followed behind
    me.


    Jack Harrison, who’d been a classmate of mine since kindergarten, smiled. “Juliet.
    I never dreamed we’d find you out here. How are you?”


    “I’ve been better.”


    “Sure, I’m sorry.” He gestured to the other detective. “This is my partner, Detective
    William Johnson.”


    William waved. He was another one I remember being a few classes behind me in
    school.


    I said, “This is Detective Ryder Hamilton.”


    The three men shook hands as Jack said, “Nice to put a face with a voice. You
    keeping Callahan in line down in Nashville?”


    Ryder’s fellow MNPD detective, Brody Callahan, had worked for the Liberty PD briefly
    and had given Ryder a contact there, which I guessed turned out to be Jack.


    Ryder smiled. “He’s doing fine.”


    Jack nodded. “Good to know. We miss him here. Now I hate to break up the pleasantries,
    but I hear we have a death to attend to. We’ll be back around to get your statements
    in a while.” He gestured to Ryder’s car, which was blocked in by several emergency
    vehicles. “Looks like you couldn’t go anywhere if you wanted to.”


    Ryder pointed them in the direction of the cellar, and they were on their way,
    followed by a few uniforms who pushed us back from the cabin and began taping
    off the perimeter with crime scene tape. The coroner followed.


    Ryder and I found a big tree out of the way and sat with our backs against it,
    in the shade of its leaves.


    He said, “Do you have a problem with this?”


    I rolled my head toward him. “I have all sorts of problems with this.”


    “I don’t mean it that way. I mean, Mandi texted you that she was going to end
    it all, then we sped out here—it took about seven minutes. With this type of hanging,
    which was done with little to no drop to break her neck because there simply wasn’t
    enough headspace down in the cellar, I think it would have taken longer than that
    for her to be dead by the time we showed up. It could take upward of twenty minutes
    for that type of noose to have strangled her.”


    I shrugged, not wanting to think too hard about this. “Maybe her text took a long
    time to get through. It’s pretty rural out here. Maybe her cell signal was bad.”


    “Maybe she had help.”


    My eyebrows shot up. “Like someone killed her and made it look like she committed
    suicide?”


    “It happens.”


    I did *not* want to add a new wrinkle to this case. “But the original way makes
    more sense.”


    “Didn’t you say only a few minutes ago that you found it hard to believe she killed
    Scott?”


    “What I want to believe is that this is over. Don’t go muddying things up for
    me with your facts, Detective.”


    Ryder grinned. “You hate it when I come up with facts, don’t you?”


    “Only always. Besides, if Mandi didn’t kill herself because of her guilt over
    Scott, then this case is not solved. That means I’m still on Delaney’s radar.”


    “And of course there’s the mild inconvenience that a killer is on the loose.”


    I smiled. “Look, I’m trying really hard to make this about me, okay? Just go with
    it.”


    That got a snicker out of him. “Okay. But that means we have more investigating
    to do.”


    Groaning, I said, “This thing here is going to put a big cramp in our plans. It’ll
    be hours before we can get back to work.”


    “Since the time frame is a little fishy, I’m betting they’ll want to take us to
    their station to make our statements, so we have that to look forward to.”


    After some time had passed, the two detectives came ambling up to us. William
    said, “We think it would be best to take your statements at the station.”


    Ryder gave me his “I told you so” smile and extended his hand to help me up off
    the ground.


    Jack gave me an apologetic smile. “Juliet, we’ll give you a ride. Hamilton, you
    can drive your vehicle over.”


    Of course. Because I hadn’t had enough riding in the back of a police car in the
    past week. As we were heading to their vehicle, I heard my name being called.
    Blake and Lizzie were waving wildly at me from behind the outer perimeter of the
    crime scene tape. This was sure to be front-page news in tomorrow’s *Chronicle*.
    How I was going to manage to keep my name out of the article would be a story
    in itself.


    —


    The building housing the police station in Liberty used to be the town’s library
    when I was a kid, so I’d been in there countless times. Once it had been turned
    into the police station, though, I hadn’t been in it again until now. (My life
    of crime hadn’t begun until I moved to Nashville.) Funny how the place still had
    a faint aroma of old books along with the requisite stale coffee and gun cleaner
    smell of a police department.'
