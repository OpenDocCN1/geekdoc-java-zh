  trans: '

    皮特剩下的路程一路开回我的公寓，我打电话给库珀核实他的信息。他给我发了一张我（再次）被坏的门框照片。接着，我拨打了莱德和 911。


    当我们到达我的公寓时，库珀正站在我敞开的前门旁守卫。


    “库珀，谢谢你照看我。我很感激，”我说。


    他面无表情地回答道：“不客气，”然后一言不说地走进了自己的公寓。


    皮特和我进入公寓，看到所有的心血都付诸东流，不禁局促不安。我们打包好的每一个箱子和包都被打开，里面的东西被倒在了地板上。当最初的愤怒平息后，一种刺骨的恐惧开始占据上头。据我所知，贾雷德·菲舍（Jared
    Fisher）还没有被找到，但现在我很清楚他的行踪了。


    两名穿着警服的明尼阿波利警察（MNPD）最先到达。他们做了我和库珀的笔录。不久，莱德和玛雅面色沉地赶。


    雅冲过去抱住我。“虽然很高兴看到你回来，但你非得把那个疯子也带过来吗？”


    我皱起眉。“这不在计划内。”


    她压低声音说。“你确定不是那个小玩物？莱德说是他打来通知你的。”


    “不，不是库珀。我听见他告诉那个穿警服的，他从下午三点起一直在诊所，直到回到家给我打的电话。他为了学分必须打卡上班，而且整个过程中都在跟随医生观察实习，所以他今天下午和傍晚的每一分钟在哪儿都有证明。”


    莱德说：“在回来的路上我联系了哈里森。他们还没有找到贾雷德·菲舍，但我想他们可以将搜索范围缩小到市里的这里。我担心他由于某种原因正执着于你。这已经是第二次了，同样的
    `MO`（作案手法）。我只是庆幸你不在不在。”


    皮特捏了捏我的肩膀。“我也是。”


    一辆没有标记标识的警车急刹驶入停车场。德兰尼跳下车，气喘吁吁。他那双豆豆眼睛落在我们身上，直朝我奔来。随着他的靠近，我感到内心残存的一点快乐也被被抽干了。


    “这到底发生什么了？”他质问道，推开皮特和一名穿警服的警察以便看清我的公寓内部。


    我长舒了一口气。“显然，我们这个有趣的小案还没结束。”


    他发出一声冷笑。“或者你为了引起注意力自己干的。”


    “认真的？如果你真那样想，那可比我们想象的任何一个人都要蠢。”


    我的朋友们不得不捂住嘴笑，而德兰尼的脸变成了紫色。


    “离我的调查远点！”


    我提高声音回敬。“我不在时家里被洗劫了，这怎么能解释成我插手你的调查？如果你一开始尽到本职，而不是浪费时间试图把谋杀案栽罪在我们身上，这一切根本就不会发生！找。贾雷德。菲舍！！”


    他低声咒骂着，径过我们冲进我的公寓，把怒火发在了里面的一名警察身上。


    皮特问：“我们还要留多久？”


    “不长了，”莱德回答道。他转向我，眉头紧锁。“我觉得你不应该像上次一样住在皮特那儿。这家伙可能在盯着你。在他被捕之前，我想让你待在保护性监管下。”


    “噢，得了，”我抱怨道。“没没你的意思，但我现在真的受够警察了。而且这周我已经请了两天假。据我所，咖啡馆可能已经乱成一糟了。”


    “我告诉过你那里没事。听听他的，”皮特说。


    莱德让道：“也许不必那么有侵入性。你可以住一家需要 `key card`（房卡）才能进入高层的酒店，我们可以在你门外守一个 `uni`（警员）。这样你明天可以去上班，我会负责看你。这样行吗？”


    我揉了揉额头。“我想……”


    玛雅同情地拍了拍我的肩膀。“你看起来还是很慌。”


    “是的。我并不期待晚晚剩下的时间独自待在空荡的酒店房间里，只有思绪相伴。”


    她看向皮特，嘴角微微上扬。“我打赌你可以带个 `friend`（朋友）陪你。”


    ---


    一名穿警服的 MNPD 警察护送皮特我和从公寓来到市中心的一家酒店，那里离警察局只有两个街区。我们从送货门进入，并乘服务电梯上房间。警察检查了房间，在确认没有杀手后，留给了我们自己空间。


    皮特握住我的手。“我知道这不是我今天早上醒来时预想的这一天的结束方式。你呢？”


    我苦笑了一下笑。“完全不是。真可惜我们不能把时间倒回到我接到库珀电话之前的时刻。”


    “老实说——你对去巡演绝对确定吗？我曾担心是我越界了，但我想请求原谅比试图说服你让我尝试一下容易得多。而且我不想先让你抱有希望，结果如果那家伙拒绝了再让你大幻灭。但这百分之百是你的决定。你仍然可以拒绝，无论如何我都能接受。”

