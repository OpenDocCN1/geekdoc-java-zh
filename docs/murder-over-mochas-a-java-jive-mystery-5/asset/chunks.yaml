  raw: 'Pete smiled. “Good. Because we have a ton of stuff to discuss about your upcoming
    performance on Tuesday. We have one more rehearsal tomorrow and then—”


    The waiter interrupted him, and after we placed our order, Pete picked right back
    up talking about set lists and staging for the performance. I loved the gleam
    in his eye when he talked music. As bad as my stage fright had been at one time,
    I had to say I was looking forward to this performance, if for no better reason
    than it was a chance to team up (musically) with Pete again. There was nothing
    more fun for me than collaborating with him. We clicked perfectly when we were
    playing music together, somehow knowing exactly what the other one was thinking,
    and always perfectly in sync.


    As we talked and laughed over our appetizer, I began to actually feel normal,
    for lack of a better word. Who’d have thought?


    “Hey, did you re-up the lease on your apartment?” Pete asked out of the blue.


    “Not exactly. The year was up a couple of weeks ago, and I convinced the super
    to give me a month-to-month option.”


    He brightened. “Excellent. We need to talk about you getting a new place.”


    This was such a bone of contention between the two of us. Sighing, I replied,
    “Yes, Dad. I know I live in a hole.”


    “So do something about it.”


    “Apartment shopping takes time. In case you haven’t noticed, I’m kind of a busy
    girl.”


    “That’s why I wanted to ask you if you wanted to—”


    My phone buzzed again, this time a long buzz signaling I was receiving a call.
    “Hold that thought.” It was from a local number I vaguely recognized. “Hello?”


    “Juliet, this is Daniel Stevenson.”


    “Daniel, hey. Thanks for calling me back.”


    Pete grunted and sat back against the booth, radiating grumpiness.


    I mouthed “sorry” to Pete and continued my conversation with Daniel. “I’m so sorry
    about the loss of your friend.”


    Daniel sighed. “I’m absolutely sick about it. And I know you and I haven’t spoken
    for a while, but I’m sure this isn’t easy on you, either.”


    “No, I can’t say that it is.”


    “In the message you left, you said you wanted to speak with me about Scott. I’m
    happy to do anything to help. Are you still free to meet tonight?”


    Pete was going to kill me for this. I replied, “Yes, I’m free.” Yep. Got the glare
    from Pete I was expecting.


    Daniel said, “Is now a good time? I’ll come to you if that will help.”


    If we finished dinner, went and talked to Daniel, went and saw my parents, picked
    up Ryan, and *then* started home, it would take all night. It was getting late,
    so we had to start doing some multitasking here. I was already in the doghouse
    with Pete, so I bit the bullet and told Daniel where we were, cringing as Pete’s
    frown deepened.


    After I ended the call, Pete said quietly, “Did you just schedule another interview
    for right now? During our dinner?”


    I grabbed his hand. “I’m so sorry. I just want to get this day over with and go
    home. I think Daniel will be the best person to tell us the real, full story about
    Scott. Then I promise I’m done.”


    He stared at our hands for a moment. “Jules, I…”


    When he didn’t continue, I asked, “What?”


    After giving my hand a squeeze, he pulled his hand away. “Never mind. I think
    our food’s here.”


    We ate for several minutes in a tense silence. Even though I knew Pete wasn’t
    looking forward to talking to yet another person, I was relieved when I saw Daniel
    walk through the front door of the restaurant.


    Tall, dark, and handsome, Daniel Stevenson was one fine-looking man. Always dressed
    in an expensive suit, this time minus the power tie, he’d been a drug rep for
    years. I wondered briefly if Daniel had been the reason Scott finally got into
    the business when he’d seemed to have no interest in it before.


    “Hi, Daniel. Thanks so much for meeting us,” I said as he approached our table.


    “It’s my pleasure, Juliet. You’re looking lovely as ever,” Daniel replied with
    a sad but charming smile as he scooted in next to me and gave me a one-armed hug,
    leaving his arm draped across my shoulders. Daniel’s relentless flirting left
    women swooning. Not always a big hit with the guys, though.


    Pete cleared his throat.


    I said, “Daniel, this is my friend Pete Bennett. Pete, Daniel Stevenson.”


    The two men nodded politely at each other.


    Daniel waved over the waiter. “A bottle of your best Merlot for the table.” Daniel
    liked to throw his money around, too.


    Pete held up his hand. “None for me, thanks. I’m driving us back to Nashville
    as soon as this is over.”


    Nodding, Daniel said, “Of course. A glass for myself and for the lady, then.”


    Pete eyed Daniel. “If you don’t mind me saying so, you’re not exactly crying in
    your beer over the passing of your best bud.”


    Daniel seemed to deflate before our eyes. “Truth be told, Scott and I had grown
    apart lately. I’m crushed over his death, but…I feel like I’d already lost my
    friend months ago. I’m honestly not at all surprised that this happened.”


    “You’re not surprised that he’s dead?” I asked.


    “No, not with his drug abuse. It was getting out of hand.”


    I glanced at Pete, but was unable to catch his eye because his gaze was fastened
    on Daniel’s arm, which was still around my shoulders. I said to Daniel, “You know
    for certain that he was using drugs?”


    “Yes. I’ve seen him using. At work.” He sighed. “I feel responsible for him losing
    his job. Mandi told me she found him with his hands in Chandra’s bag and asked
    me what she should do. I thought if Scott could get out of that environment and
    away from his easy access, it would help him. She didn’t want it to come from
    her, so I’m the one who told the higher-ups that he was stealing the samples,
    but I didn’t tell them that he was using. I tried going to him first and begging
    him to stop, but he pushed me away. He pushed everyone away. I felt like I had
    no other choice.”


    My heart sank. So it was true. Scott had descended into being a common druggie,
    and his death could have easily been an overdose or a bad combo. I let out a long
    sigh.


    At my reaction, Daniel tightened his grip on my shoulders and leaned his head
    toward me. “I’m sure you no longer held him on any kind of pedestal after what
    he did to you, but I know it hurts to hear the ugly truth about someone you once
    loved.” He removed his arm and handed me a glass of the wine that had just been
    delivered to our table. Holding his glass out toward mine, he said, “To Scott.”


    “To Scott.” I clinked my glass with his and took a big swig.


    Pete asked, “Do you know if Scott ever tried to get drugs from other sources?
    Was he involved with any dangerous people?”


    Daniel’s eyebrows shot up. “Scott O’Malley? No, he was way too cautious a guy
    to ever consider using a drug dealer. It would have scared him to even talk to
    one over the phone.”


    “Too bad he wasn’t scared enough of what the drugs could do to his body,” I said
    quietly, an image of Scott as he keeled over flashing in my mind.


    Daniel nodded solemnly. “So true.” After we descended into a few minutes of awkward
    silence, he drained what was left in his wineglass and asked me, “Anything else
    you need from me? It seems your friend Pete here is more than ready to take you
    home.”


    I chuckled, if only to hide my discomfort. “Right. Um, I think we’re good. You’ve
    been a really great help, Daniel. I hated to hear what you had to say, but it
    helped me finally accept the fact that Scott’s death was simply a tragic accident.”


    He forced another sad smile. “I’m glad I could help. You keep in touch, okay?
    Pete, it’s been a pleasure.”


    “Something like that,” Pete replied.


    After Daniel had gone, I turned to Pete. “Not a fan?”


    “That guy is a world-class douche.”


    “Yeah. So?”


    Pete wrinkled his nose. “You think so, too? You weren’t mesmerized by his prettiness?”


    I couldn’t keep the grin off my face. “I’m not some stupid schoolgirl, Pete. The
    Casanova thing is his shtick. You get past the douchery and he’s a fun guy to
    be around.”'
