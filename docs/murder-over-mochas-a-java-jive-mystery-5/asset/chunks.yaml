    Smiling again, he let go of my hands and took something out of his pocket. Before
    I knew what he was doing, he was down on one knee, holding up a gorgeous antique
    diamond ring (Gertie’s wedding ring, if I wasn’t mistaken) and looking at me with
    the sweetest expression on his face. My breath caught in my throat.


    “Marry me, Jules. I want to be with you and love you for the rest of our lives.
    I want to make music with you and drink coffee here with you every day and make
    you laugh. I want to grow old and fat and wrinkly with you. You’re the best friend
    I’ve ever had, and now what I want more than anything is to be your husband. To
    be your family. I love you.”


    The tears that had been threatening now spilled down my cheeks in earnest. I nodded.
    “Yes. Yes, of course I’ll marry you!” After he stood and slipped the ring on my
    finger, I threw my arms around him and said, “I love you, Pete. I’ve loved you
    from the moment I met you, and I’ve never stopped. Not even for a minute.”


    To Julia Maguire


