    to haul out then work through my emotions. I didn’t have time for that.


    Luckily, I was saved from answering his question by another knock at the door.
    But as I opened it, I realized my current visitor situation was going to open
    up a whole new vein of drama in my life.


    Pete walked in with a bakery box and two large to-go cups of coffee. “Hey, Jules,
    I thought we’d need plenty of caffeine and sugar to get started on—” He stopped
    abruptly when his eyes fell on Cooper, who’d come over in his pajamas, with bare
    feet, no less. “Am I interrupting something?”


    I groaned inwardly, hoping Pete wasn’t thinking what I thought he was thinking.
    “Not at all. Pete, this is my neighbor Cooper Milford. Cooper, this is Pete Bennett,
    my bestie.”


    Cooper stuck out his hand. “Pete. I’ve heard a lot about you.”


    Pete shook his hand and cast a smirky glance at me. “Funny, I haven’t heard a
    word about you.”


    Cooper’s eyes registered hurt, which made my heart clench. This was an idiotic
    arrangement we had going on. Worse, I had the sneaking suspicion that Cooper was
    becoming way more emotionally invested in it than I was.


    “Okay,” I said a little too loudly. “Cooper, I appreciate you coming over and
    checking on me this morning, but Pete and I have some…work stuff we need to…work
    on. I’ll see you later?”


    Cooper got the hint and headed for the door, but just as I was about to close
    it, he said quietly, “Juliet, I’d really like to discuss something with you. When
    can I see you?”


    “It may be a while. I’ll let you know, okay?”


    He nodded, looking thoroughly dejected. *This* was why you shouldn’t get involved
    with someone in his early twenties. He didn’t yet have that thick skin that came
    with life experiences. He was a baby. A hot baby, but still a baby.


    “Wow, Jules. I didn’t take you for a cougar,” Pete said, not even trying to hide
    his amusement.


    I lied between gritted teeth, “I am *not* a cougar. He’s just a friend.”


    “Does he know that?”


    “Shut up, Pete.”


    Still grinning, he held up his hands. “Okay, okay. Shutting up. So, boss—what’s
    on today’s sleuthing agenda?”


    “I figure I’ll run background checks on Scott and on Mandi, and I’ll have Trevor
    hack the tablet and the phone. Once we have that done, then we can look at the
    info and decide what our next step is.” I walked over to him and plucked one of
    the coffee cups out of his hands. “But first, coffee.”


    Before I could get a sip, my phone rang. “Hey, Maya,” I said.


    “I’ve got Ryder with me on speaker. How are you this morning?” she asked.


    “Hanging in there.”


    Ryder’s deep voice said, “You keep your chin up, okay?”


    “I am,” I replied.


    Maya said, “We came to the office early to run background on Scott for you.”


    I smiled, even though they couldn’t see me. “Aww, thanks, you guys.”


    Ryder said, “We just emailed it to you. Anything else we can do?”


    “Can you also run one on Mandi Jenkins O’Malley? She’s the missing wife.”


    Ryder replied, “Will do. And we’ll also check it against Scott’s and email you
    our notes. Save you a little time.”


    “Thanks.”


    Maya said, “Juliet, please be careful, and keep us up-to-date on your progress
    with the case.”


    “I will. Thanks again, you two.”


    After we said our goodbyes, I pulled up the email they’d sent with Scott’s background
    info and let Pete read it over my shoulder. “Not even a parking ticket,” I grumbled.
    “Not a lot to work with.”


    Pete pointed at my phone. “Hey, you’re listed.”


    “Yes, unfortunately, because we shared an address at one time. Wait. Look at the
    credit history. He took out a mortgage six months ago. *Three* months ago he was
    already behind on the payment, which is a whopper, but now he seems to be current.
    During that same time he also got behind on his car payments to both Audi and
    Mercedes financial services. Now they’re up-to-date, too. He also nearly maxed
    out his credit cards during this time, but he’s paid them down as well. None of
    this is like him. He always kept his payments current every month and drove a
    middle-of-the road vehicle. We had a small apartment with reasonable rent. I don’t
    get it.”


    “I do. He stole your money, got a fancy new job, and thought he was rolling in
    it, only to overextend himself. Happens all the time. He probably had to keep
    up appearances as a drug rep. Did you see the outrageous dry-cleaning receipt
    in his murse?”


    “I did. I could have bought a whole new wardrobe for what it cost to clean part
    of his.”


    He stared at me thoughtfully for a moment. “What would you think about taking
    a road trip with me?”


    My eyebrows shot up. “A road trip? I think we’re kinda busy for the foreseeable
    future, Pete.”


    “I mean to Liberty. You always say everyone there is in everyone else’s biz. We
    find some gossipy housewives and listen while they spill what Scott and his wife
    have been up to the past year.”


    I wrinkled my nose. “I don’t know. Wouldn’t it be kind of weird for me to go back
    home asking a bunch of probing questions about my ex like I’m some kind of stalker?”


    “You can’t be accused of stalking someone who’s dead.”


    “Well, I can’t argue with that logic. Let’s go see a man about a phone.”


