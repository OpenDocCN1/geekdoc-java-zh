    皮特笑了。“很好。因为关于你下周二的表演，我们有很多事情要讨论。明天我们还有一次排练，然后——”


    服务生打断了他的话。在我们点完菜后，皮特又接着聊起表演的曲目单和舞台布置。我喜欢喜欢他谈起音乐时眼中闪烁的光芒。尽管我曾经的舞台症很严重，但我不得不说，我很期待这次表演，如果不是为了别的什么理由，仅仅是因为这是一个再次与皮特（在音乐上）合作的机会。对我来说，没有什么比和他合作更有趣的。当我们一起演奏音乐时，我们契合得非常完美，仿佛能确切地知道对方在想什么，并且始终完美同步。


    当我们吃着前菜边聊天边笑时，我开始感到很“正常”，如果找不到更贴切的词的话。谁能想到呢？


    “嘿，你的公寓租约续签了吗？”皮特突如其问道。


    “不完全是。合同几周前到期了，我说服管理员给了我按月租的选项。”


    他亮了起来。“太极了。我们需要谈谈你找新地方的事。”


    这可是我们之间争论的焦点。我叹了口气回答道：“是的，爸爸。我知道我住在地窟里。”


    “那就想办法解决它。”


    “找房子需要时间。如果你没注意的话，我是个挺忙的女孩。”


    “这就是为什么我想问你想不想——”


    我的手机再次震动起来，这次是长震动，表示我接到电话了。“先等一下。”是一个我模糊记得的本地号码。“喂？”


    “朱丽叶，我是丹尼尔·史文森。”


    “丹尼尔，嘿。谢谢你回电话。”


    皮特哼了一声，靠在卡座背上，满脸不悦。


    我对着皮特口型说了“不起”，然后继续和丹尼尔交谈。“你朋友的去世我感到非常遗憾。”


    丹尼尔叹了口气。“我对此非常难过。我知道我们有一段时间没说话了，但我确定这对你来说也不容易过。”


    “不，我不认为这容易。”


    “在你留的消息里，你说你想和我聊聊斯斯特的事。我很乐意提供任何帮助。你今晚还有空见面吗？”


    皮特会为此杀了我的。我回答道：“是的，我有空。”没错。我收到了意料之中皮特的目光。


    丹尼尔说：“现在方便吗？如果有帮助，我可以去找你。”


    如果我们吃完晚饭，去找丹尼尔谈谈，去看我父母，接上瑞恩，*然后*再回家，就要花上一整晚。时间不早了，我们必须开始多管齐下。我已经在皮特那里吃软子了，于是我咬着牙告诉丹尼尔我们所在地，看着皮特的眉头越皱越深，我不畏缩不已。


    挂掉电话后，皮特轻声说：“你刚才是不是现在又安排了另一场面试？就在我们吃饭的时候？”


    我抓住他的手。“我很抱歉。我只想快点结束这一天回家。我觉得丹尼尔是那个能告诉我们关于斯柯真实、完整故事的人选。然后我保证我结束了。”


    他盯着我们的手看了一会儿。“朱斯，我……”


    看到他没有继续下去，我问：“怎么？”


    他捏了捏我的手，然后抽了回来。“没事。我觉得我们的菜上了。”


    我们在紧张的沉默中吃了几分钟。尽管我知道皮特并不期待再和另外一个人交流，但看到丹尼尔走进餐厅大门时，我松了一口气。


    高大、深邃、帅气，丹尼尔·史文森是个非常出色的男人。他总是穿着昂贵的西装，这次没系那条权力领带，他已经做了多年医药代表了。我短暂地想，丹尼尔是否是斯柯特最终进入这个行业的原因，因为斯柯特以前似乎对此感兴趣。


    “你好，丹尼尔。非常感谢你来见我们。”他走向我们的桌子说道。


    “这是我的荣幸，朱丽叶。你还像既往一样，”丹尼尔带着忧伤但迷人的微笑回答道，他坐在我身边，单手搂住我，手臂搭在我的肩膀上。丹尼尔无情的调情会让女性倾倒。不过，在男士们并不总是买账。


    皮特清了清嗓子。


    我说：“丹尼尔，这是我的朋友皮特·本内特。皮特，丹尼尔·史文森。”


    两个男人礼貌地互相点头。


    丹尼尔招了招服务生。“给这桌来一瓶你们最好的梅洛。”丹尼尔也喜欢挥霍金钱。


    皮特举起手。“我不要了，谢谢。等这结束后我会开车送我们回纳什维。”


    丹尼尔点头说：“当然。那么为我和这位女士点一杯。”


    皮特打量着丹尼尔。“如果你不介意我说的话，你并不是在为你好哥们的去世而哀伤不已。”


    丹尼尔似乎在我们面前泄了气。“说实话，斯柯特和我最近变得疏远了。他的死让我心碎，但……我觉得我在几个月前就已经失去我的朋友了。老实说，我对这件事发生一点也不意外。”


    “你不意外他死了吗？”我问。


    “不，考虑到他的滥用药物史。那已经失控了。”


    我看了皮特一眼，但没对上他的目光，因为他的目光盯着丹尼尔那只搭在我肩膀上的手臂。我对丹尼尔说：“你确定他在吸药吗？”


    “是的。我见过他用。在公司里。”他叹了口气。“我觉得对他丢工作有责任。曼迪告诉我，她发现他把手伸进了钱德拉的包里，问我该怎么办。我想如果斯柯特能离开那个环境，远离那些容易获得的毒品，对他会有帮助。她不希望这件事从她口中说出，所以我告诉高层他在偷样本的人，但我没有告诉他们他在吸药。我试过先去找他并求他停止，但他推开了我。他推开了所有人。我觉得我没有其他选择。”

