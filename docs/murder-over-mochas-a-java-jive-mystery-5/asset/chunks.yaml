    get out into the fresh air.


    Ryder asked, “Why were you on him about his tie?”


    “I was trying to get him to ’fess up about taking a kickback.”


    He gave me a confused look. “You were hinging your theory on a tie? He could have
    got it anywhere.”


    “False. You can’t buy a designer tie like that around here. That was a Burberry.”


    “I don’t know if you’ve heard, but there’s this cool new thing called the Internet.
    You can buy stuff on it from practically anywhere in the world and have it sent
    to you.”


    I growled as I got into his car. “Shut up. If he bought it on the Internet, then
    why did he lie about buying it at the mall in the next town? I’m right about this.”


    Starting up the engine, Ryder said, “Your theory’s still shaky. He’s a doctor.
    I’m pretty sure he can afford a blackberry tie or whatever.”


    “One, it’s *Bur*berry. Two, he’s a pediatrician in a small town where everyone
    has shitty insurance. He’s making decent money, but he’s not rolling in it. Not
    enough to waste a couple hundred bucks on a tie.”


    “Whatever you say, *Julie*.”


    “I’m going to pretend I didn’t hear that and go on. Three, I saw the exact same
    tie in Mandi’s drug bag along with several others like it. It came from her.”


    He furrowed his brow. “How did you manage to get your hands on the bag Mandi uses
    for work?”


    Uh-oh. When I’d told him about my previous trip to Liberty, I’d kind of left out
    the fact that Pete and I had broken into Mandi’s house. I merely told Ryder I’d
    spoken to her, leaving out the other details.


    When I didn’t reply, he pinched the bridge of his nose, a sure sign I was super
    close to working his last nerve. “Tell me you didn’t steal from her.”


    I couldn’t say I didn’t steal from her, either. “I didn’t steal her bag.”


    “Keep talking. Out with it.”


    “I looked inside the bag when Pete and I went to her house.”


    Now his jaw was clenched. He did not like it when I was vague. *“What did you
    do?”*


    I sighed. “We, um…sort of let ourselves into her house. Because we, you know,
    had Scott’s man purse, which had his house keys in it. I found her bag and went
    through it.”


    He jerked the car over to the side of the road, I guessed so he could turn his
    full wrath on me. “First Scott’s bag, then the tablet, and now unlawful entry
    and going through someone’s home? What the hell were you thinking?” he barked.


    “That Pete and I were both murder suspects who needed to clear our names.”


    “Come on, Juliet. As a PI, you should have known better than to pull that amateur
    crap.”


    I frowned. “Hey, you’ve resorted to creative tactics in investigations before.”


    “We’re not talking about me right now. We’re talking about you. You could have
    been—and still could be—arrested for the stupid things you’ve done this week.”


    “Better than being arrested for a murder I didn’t commit.”


    Still fuming, he conceded, “Well, at least you didn’t get caught.”


    I kept my mouth shut about that one.


    # Chapter 18


    By the time we got to our next stop, Ryder had calmed down enough to at least
    hold a civil conversation with me. He made a move to get out of the car, but I
    put a hand on his arm.


    “Considering the direct approach didn’t go so great with Dr. Devaux, do you think
    we could try something different with Dr. Grantham?”


    “What do you have in mind?” he asked.


    “Well, Dr. Grantham is a forty-something divorcee who’s on the prowl for husband
    number four. Maybe it’s time we broke out Seth Davis and his charm. He’s good
    at winning over the ladies, or so I’ve heard.”


    And the glare came back. Seth Davis was the name Ryder had originally given me
    when we’d met, because he was working undercover at the time. I ended up figuring
    out his real name on my own, which of course caused waves in our already fiery
    relationship. Anytime I wanted to needle him about honesty, I tended to bring
    that up.


    “What can Seth Davis get out of her that Detective Hamilton and his badge can’t?”


    I shrugged. “Possibly a straight answer. I was thinking you could pretend to be
    a drug rep and try to buy her affection.”


    “With what? I don’t have anything to give her.”


    “You could always give her an invitation to dinner and a not-so-subtle implication
    of something more.”


    He frowned. “I said I’d help you investigate, not take one for the team. Besides,
    I don’t think Maya would appreciate me doing that.”


    “I’m not saying you have to follow through with it. Tell the doctor you’re a new
    Silver Spruce rep and that you want to make sure to give her the same level of
    service she’s used to. If all else fails, ask her what it would take to ensure
    her exclusive business.”


    “Fine,” he conceded. “But next time, you’re the bait.”


    I glanced down at my blouse and jeans, which were perfectly acceptable for interviewing
    potential suspects and witnesses, but wouldn’t begin to turn a man’s head. “I’m
    hardly dressed for it.”


    “Like I am?”


    Ryder, on the other hand, looked good enough to eat in anything he wore, which
    today was a black button-down with the sleeves rolled up and dark denim jeans.
    Most of the time, he didn’t have a clue how attractive he was.


    “You’re fine. Flex a little and she’ll be eating out of your hand. And wear the
    mic and earpiece we brought so I can hear what goes on.”


    Clearly unhappy with the situation, Ryder reached into the backseat and produced
    our listening/recording equipment. After we each got our own items ready, we did
    a quick test, and he was on his way.


    No doubt charming the receptionist with his stellar smile, Ryder said, “Hi there.
    I’m Seth Davis with Silver Spruce Pharmaceuticals. I’m here to speak with Dr.
    Grantham. Looks like I’m going to be her new rep.”


    A female voice cooed, “Oh, Mr. Davis, she’s with a patient right now, but I’m
    sure she’ll want to see *you*. I’ll let you wait in her office. Come with me.”


    “Thank you so much, Tessa,” Ryder said smoothly. “You can call me Seth.”


    I parroted breathily into my mic, “Oh, Mr. Davis, come with me.”


    Hearing two sets of footfalls, I knew he was still with Tessa the receptionist,
    so he couldn’t fire off a retort at me.


    “Here you go,” Tessa said cheerily. “If you need anything, Seth, you ask me.”


    “I’ll be sure to do that,” he replied. After a pause he whispered, “Knock it off,
    Juliet.”


    I chuckled. “Oh, whatever. You’d totally do it to me if I were the one in there
    playing the bait. Snoop around in her office while you’re in there.”


    “Thanks for the tip. I haven’t done a lot of these investigation things before.”


    “My, my. You are quite salty this afternoon, Detective.”


    “You could be making yourself useful right now instead of bothering me.”


    “Nah, bothering you is way more fun.”


    He huffed out a breath. “I was thinking maybe you could take that stolen tablet—”


    “*Borrowed* tablet,” I interjected.


    “And poke around some more. I know you said it was mostly Scott’s work stuff,
    but maybe there’s something on there you missed. Some notes or saved files you
    might have skimmed over before.”


    “You know, that’s not a terrible idea—”


    “Dr. Grantham,” Ryder said. “Nice to meet you. I’m Seth Davis.”


    “Hello, Seth,” Dr. Grantham purred. “I hear you’re my new rep from Silver Spruce.
    I can’t say I mind trading in that twit Mandi and her married friend Jared for
    a big, strong man like you. You’re not married, are you?”


    I stifled a snicker and got to work on Scott’s tablet, tuning out their small
    talk. I didn’t need to listen to everything they said, so I keyword-filtered their
    conversation and kept most of my attention on the tablet, opening every app and
    thoroughly perusing everything I could find. Again, I was coming up with a lot
    of nothing.


    My ears perked up when I heard Ryder say, “Wait, if you could just give me a few
    minutes, I promise to be quick.”


    Dr. Grantham laughed. “I hope you don’t say that to all the ladies.”


    That time I couldn’t contain my snicker. At least this conversation was more interesting
    than the load of useless information on Scott’s tablet.'
