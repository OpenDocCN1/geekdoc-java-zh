  trans: '


    “Seth，你哪儿也去不了。”


    噢，没错，他需要帮忙。在想出一个绝妙的主意后，我在后座里翻找了一件连帽衫，把它揉成一团，尽可能地塞进我的牛仔裤前面。在把衬衫向下拉盖住它后，我在手包里找到了一根旧橡皮筋，用它把头发扎成一个故意为之的乱马尾。


    我冲进餐厅，径过领位员，在酒吧里一个舒适的卡座发现了 Ryder 和他的约会对象。


    我把一只手放在背上，挪着屁股走过去，尽可能把我的假肚子向前挺挺。“你到底在干什么，Seth？”我质问道。


    当 Ryder 的眼睛盯着我的连帽衫“宝宝”时，他惊讶得掉掉了下巴。“嗯……我……”


    我转向`Dr. Grantham`，她看起来同样震惊。“你好。我是朱莉·戴维斯。他的妻子。你呢？”


    她对 Ryder 冷笑一声。“我要走了。我想换个代表。”


    在她愤然离去后，我坐在了她空出的座位上。“你好，老公。”


    他脸上堆满了溢出来的笑容。“嘿，朱莉。来得真及时。那位好医生正对我手不不乱呢。”


    我笑着，从头发里拿出橡皮筋，抖了抖红色的卷发。“是的，听起来确实是朝着那个方向发展的。我想我的华丽登场不会完全暴露你的身份，但还是能把她吓跑。”


    他盯着我的肚子。“你里面到底装了什么？”


    我掏出连帽衫。“这个。”


    “你可真是机智多才。”


    “过奖。”


    他在桌上扔了几张钞票，然后我们往外走。


    我说：“尽管那对你来说可能很糟糕，但多亏了你从`Dr. Grantham`那里得到的信息，我相信我们即将彻底破解这个案子了。”


    “你是说 Scott 勒索她的事吗？是的，那改变了局面。”


    “超乎你的想象。她不是他勒索的唯一一个。”


    我们回到车上，我把平板电脑递给他。我伸过点屏幕，调出了 Scott 与 `Dr. Grantham` 的会议。“看看吧。Scott 安排了他的勒索行程。这就是他和你女朋友会面的地方。”


    “这简直太强迫症了。”


    “没开玩笑。”我调出了下一个勒索事件。“这儿是他与 `Dr. Devaux` 会面的地方。我真喜欢他在备注里写下他勒索了他们多少钱。看到这一个备注里写着‘2K’吗？他可能只让
    `Devaux` 掏了两千，但他向你那位女士朋友——一位心脏病学家——收了五千。”


    “有意思的，尤其是考虑到在 Mandi 告诉 `Dr. Grantham` 她会‘处理好这个问题’之后，Scott 在还没来他的钱之前就去世了。”


    我叹了口气。“没错。我得出了同样的结论。”


    “这让我们回到了把寻找 Mandi 作为首要任务。”


    “是的，但你现在开始明白我的观点了吗——不要太担心她所谓的失踪？”


    “我明了。”


    我再次点击屏幕，调出 Scott 的周四日程。“继续，这是另一个十五分钟的会议，这次是和 `Dr. Muniz`，也就是 Julia、Lizzie 和 Blake
    今天下午面试的医生之一。这一个的备注写着‘3K’。Lizzie 说他们从受访者那里一无所获，但这说明了很多问题。这让勒索金总达到了整整一万块。”我拿出手机，给
    Lizzie 发了一条短短信，告诉她我们今晚学到的东西。


    Ryder 点点头。“我们拥有的只是理论、一些晦涩的笔记，以及一个永远不会给警察提供同样说词的不可信证词。我们需要真正的证据。如果能找到 Scott 告诉
    `Dr. Grantham` 他拥有的那些照片，将会非常有帮助。”


    “会有用，但我翻了他的个人手机和这台平板电脑上所有的照片。一无所获。”


    “他可能把它们存在了硬盘、闪盘、云端……”思考片刻后他说，“你认为 Scott 发起这场反对回扣的斗争是为了报复 Mandi 的出轨？还是你认为他只是非常反感同行代表们不遵守规矩？”


    “通过勒索来反对回扣的斗争简直蠢透了。”


    “你说过他的行为是非理性的，可能是因为使用了药物，这意味着他没有做出明智的决定。”


    我皱起眉。“他从来没有做过特别出色的决定。”


    “想想看。Mandi 升职了而他没有，所以他嫉妒、自尊受挫，甚至可能在等着她失败。Mandi 必须提高自己的表现，因为升职意味着有更大的责任去确保确保有更多关于
    Silver Spruce 药物的处方被开出来。”


    我点头。“那时她可能开始使用非法手段来完成工作了。”


    “完全正确。比方 Scott 发现了她的秘密——事实证明那也是她教练 Jared 的秘密。Scott 决定自己也想分一杯羹，但是……由于某种原因，他没有权限或预算发放任何回扣。”


    “这很令人沮丧。他的妻子在工作上比他好，而且在那段时间她也开始对他出轨。无疑他已经到了爆发边缘……”我声音小了，几乎开始同情 Scott 了。


    Ryder 替我完成了想法。“所以他想出了赚外快的方法，据我们所知，他要的这笔钱可能只是许多笔中的第一笔。如果在任何时候他能证明欺诈并决定把这些医生交给联邦调查，他们付出的代价将远比这笔勒索金得多。”


