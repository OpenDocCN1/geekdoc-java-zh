    All unattended deaths (“unattended” meaning not occurring under medical care,
    like in a hospital or something) had to be investigated by homicide. Having found
    several dead bodies, I’d been through this before. I’d never seen anyone die,
    though. And I never dreamed `Scott` would be the one I’d have to witness the life
    ebb out of.


    The police took `Pete` back to our office for questioning first, since he owned
    `Java Jive`. Then I wasn’t allowed to speak with him. I sat alone with my thoughts
    while the customers and the rest of the staff were questioned. I knew why I was
    left for last, and I would have used the same technique if I were the investigator
    on the case. From talking with `Pete`, the `MNPD` detective (who I didn’t happen
    to know) would find out my connection to `Scott`. Then, as he interviewed the
    other witnesses, he’d form a theory of what had happened.


    It was like putting together a mosaic. I was the jilted woman whom `Scott` had
    done wrong. I broke his nose earlier today, as witnessed by my staff and several
    dozen customers. The next time `Scott` got near me, he dropped dead. Unless he
    had some voracious, fast-acting disease, his sudden death was looking pretty fishy.
    That mosaic was coming together fast, and it formed a big, red arrow pointing
    straight at me.


    Finally, it was my turn. The police had excused the customers and the staff—except
    `Pete`. That got me worrying what their reasoning was for keeping him around.


    The detective approached me and stuck out a meaty hand. “Detective `Tom Delaney`,
    homicide.”


    I stood and shook his hand. “Juliet Langley`.”


    He gestured to my chair. “Have a seat.”


    My stomach clenched. “I thought you were conducting interviews in the office.”


    The detective shrugged. “I’m fine with doing yours out here.”


    Clever touch, although cruel, making me sit in the same room with a dead body
    while I was questioned. I didn’t like this guy already. I lowered myself slowly
    back into my seat.


    “Ms. Langley, how did you know Mr. O’Malley?”


    Oh, here we go. “He and I were engaged once.”


    “Once? But not now, though. Did it end badly?”


    He already knew this, because all of my employees had heard stories about `Scott
    the Dickhead`, which was how I occasionally (okay, more than occasionally) referred
    to him. Detective `Delaney` knew the answer to his question. He just wanted to
    make me say it.


    “Yes. He left me.”


    He narrowed his beady, already too-close-together eyes at me. “And?”


    I sighed. “And stole my money and my belongings and caused my café to go under.”


    “Did you press charges against him for this or try to sue him?”


    “With what money? He’d taken everything. Plus, I was stupid enough to have joint
    bank accounts with him, so he had every right to wipe out the money. And how could
    I prove it was my tax return money that paid for our couch or that the lamp by
    our bed was passed down to me from my great-grandmother? Impossible.”


    His mouth pulled up in the corner. “Sounds like you’re still angry about it.”


    I didn’t reply.


    “So maybe you decided to take matters into your own hands to get even with him.”


    Again, I didn’t reply. I didn’t have to. This was an interview, not an interrogation,
    although it seemed to be heading that way fast.


    “I hear you assaulted him this afternoon.”


    “I hit him in the nose.”


    The detective leaned back in his chair, which caused the buttons of his shirt
    to strain against his ample beer belly. “Why would a nice girl like you do something
    like that?”


    “It was the first time I’d seen him since he left.”


    “So you had a score to settle.”


    I paused for a moment to come up with the right spin. “I let my temper get the
    better of me and acted before I thought.”


    “And then you lured him back here so you could kill him.”


    There it was. This guy clearly wasn’t aware of my expertise in being on the wrong
    side of a police investigation. “Oh, so you’ve already classified this as a homicide?
    That was quick. I didn’t realize the `ME` was doing complete autopsies on-site
    these days.”


    `Delaney`’s whole head turned a reddish-purple. He spat out, “Don’t be a smart-ass.
    You’re the only one who wanted to see him dead.”


    I highly doubted that, but


