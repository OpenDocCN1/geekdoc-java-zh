  trans: '

    莱德轻笑一声，走向房间的远角。他用手机手电筒照向半昏暗处，说道：“看来标本制作不只是兰迪叔叔唯一的爱好了。”


    我走到他身边，盯着一具用得久了的标本。“噢，是啊。我忘了那月光酒了。那玩意儿能让你胸口长满胡须。”


    “我怀疑在印第安纳州酿自制酒是不合法的。”


    “不合法。你觉得他为什么在这儿酿而不是在家里？笨蛋。”


    一声巨大的砰当声震得我们俩跳了一跳。周围的光线明显暗了许多。当我们转过身时，发现了原因。防风门被砰地一声关上了。


    莱德大步走向唯一的出口，低声嘀咕道：“最好是风吹的。”


    他冲上楼梯，用力推着木门，但门纹纹丝不动。他皱着脸，在台阶上调整了一下位置，用尽全力推着。无果而归，他开始猛捶门。“嘿！让我们离开这儿！”


    在几分钟的捶门、尖叫和咒骂后，他转看向我，满脸阴沉。“真棒了。现在我们被困在这个鬼地方了。我觉得这绝对是有人故意的。你笑什么？”


    我不得不承认，我对我们的处境感到相当兴奋。并不一定是因为喜欢被关在这个充满噩梦素材的酷刑室里，而是因为显而易见，有人认为我们已经快要发现真相了，以至于不费心思地阻止我们。


    “两个原因。第一，有人在向我们传递信息，说明我们的调查方向是正确的，而几分钟前我刚开始怀疑这一点。第二，我们都有手机。又不是没法打电话求救。”


    “你给谁打电话？我们不会报警的，因为我们是闯入者。我赌上我的养老金保证你不会给你父母打电话。玛雅和皮特还有好几个小时的车程。”


    我已经在翻阅联系人了。“我要给这个镇上唯一一个不会对这事问一堆刺探问题的人。”


    我的表妹梅琳达·费尔霍尔茨（Melinda Fairholz）接了电话：“嘿，表妹。”


    “嘿。我在利伯蒂。嗯……你现在方便吗？”


    “我正要去吃午饭，但我可以通话。怎么了？”


    “我有点……被困住了。”


    她停顿了一下。“字面意义上的？”


    “是的，字面意思。我又回这个镇调查斯考特的死亡和曼迪的失踪，结果设法我和莱德锁在了地下室里。我们没没事，但你需要过来把我们放出来。”


    她笑了起来。“噢，为了这个翘午饭值了。你在哪儿？”


    我把地址给了她并挂了电话。莱德依然皱着眉。


    “怎么了？”我问。


    “如果把我们锁的人在这里怎么办？我担心来接我们的人的安全。顺便问一下，你给谁打了？”


    “我的表妹梅琳达。”


    他的皱眉变成了一个冷笑。“噢，完美的选择。也许她能把我们的劫持变成青蛙。”


    我翻了个白眼。“你知道她做不到那种。”梅琳达从高中起就开始接触巫教（Wiccan），这在印第安纳州的小镇，或者说大多数地方都不是一种流行的生活选择。“我会发短信告诉她留神，但她很坚强的。会没事的。”


    “她试图装出的那副强硬样子是演戏。”


    “你去跟皮特说吧。她吓死他。”


    莱德打量了我一会儿。“关于皮特的事。今天早上我提到这件事——提了两次——关于你们俩表现得比比常友好一点，你两次都闪避了。现在我们无处可去，除了时间别无所有，我想知道真相。”


    我与皮特的亲近一直是莱德和我之间的争论点。当莱德和我约会时，他认为我与皮特的友谊往往过分亲密，甚至在一次争吵中指责我们是相互依赖的。而现在莱德和我仅仅是朋友，这似乎依然让他感到恼火，因为遇到问题时我倾向于去找皮特而不是他。当然，我对于向莱德谈论我的感情生活感到有些抵触，因为我对他还有残留的感觉。那种情感正在消退，但在离他近时，我仍会感到一丝触动。”


    “真的没什么。”


    他摇了摇头。“我知道我看到了什么。别试图骗我，你知道你办不到。”


    我什么时候才能学会不对侦探撒谎？“好吧，行。如果你非要知道我的私事——”


    “等等，等等。我们总是会分享私事。但这是你这周第二个试图对我隐瞒的关系了。”


    “公平地说，我把库珀的事隐瞒了所有人。”


    “你还在闪避。”


    “我相信是打断我的你，侦探。”


    他叹了口气。“继续说。”


    “和皮特的事……真的很新。而且……我们还没正式约过会。”


    “那昨晚你们俩丢下我们单独去吃饭怎么说？那怎么不算约会？”


    我皱了皱鼻子，思考了一下。如果非要钻牛角尖，那确实像约会。


    “而且玛雅说他带你去了一个地方。那又怎么不算约会？”

