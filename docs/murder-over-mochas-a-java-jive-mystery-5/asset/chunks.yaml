  raw: 'Pete turned to me, his face stony. “Does this mean what I think it could mean?”


    “That there’s an excellent possibility Scott *wasn’t* raving like a lunatic when
    he came in here Saturday railing about Mandi being missing? Yes. What if Mandi
    actually had disappeared for a time, but for some reason felt she had to lie to
    us about it?”


    He let out a breath. “If she’s in danger, it could also mean that our theory on
    Scott’s accidental overdose is bogus.”


    “Yep.”


    “Which means when Detective Delaney hears about this—and he will—he could think
    the same thing, and we’re back to being persons of interest.”


    “Also yep.”


    “What are we going to do about it?”


    I pulled a face. “Up for another road trip?”


    Sighing, he walked over to the desk and began fiddling with the guitar-shaped
    music box I’d stolen back from Scott. I’d displayed it on the desk because I’d
    see it much more here than if it were at my apartment. “I’m sorry, Jules, but
    there’s no way I can take a day off right now. I’ve got some serious country music
    royalty coming in this week, and I have to be there.”


    “I know you’re busy. I’m a big girl. I’ll go by myself.”


    He turned, a worried frown marring his face. “I don’t like that idea, either.”


    There was a knock at the door. When I opened it, Ryder was standing there with
    an expression similar to Pete’s. He said, “My contact at the Liberty PD just informed
    me that there’s been a missing persons report filed on Mandi O’Malley.”


    Pete and I said in unison, “We know.”


    Ryder said, “Bad news travels fast. Do you feel like this puts a new spin on Scott’s
    death? Or are you thinking this is another instance of misinformation concerning
    his wife’s whereabouts?”


    I sighed. “We were just discussing that.”


    “I think you and I should discuss it on the drive to Liberty.”


    His willingness to help was incredibly touching. “Thanks for offering, but this
    is my fight. You don’t have to get mixed up in it.”


    “I don’t want to see you being harassed by one of my fellow detectives for something
    you didn’t do.”


    “It could be another wild-goose chase.”


    Shrugging, he replied, “Sure, it could be. Or think of it this way—if the woman
    really is missing, maybe we can help. If not, running an investigation is still
    good practice for you and something for me to do today.”


    “You must be seriously bored if you think a trip to Liberty will be interesting.”


    Pete cut in, “Jules, now that you have some backup, I’m all for it. If something
    bad has happened to Mandi, the police are going to take another look at Scott’s
    case, which could mean more headaches for us. Rhonda can hold down the fort here,
    and I’ll take a raincheck for tonight. Go do what you gotta do.”


    I nodded, knowing they were both right. “Okay. I guess that means we’re road-tripping,
    then.”


    Ryder smiled. “Let’s get a move on.”


    Once Ryder headed out the door, Pete caught me by the arm. “Be safe, okay? Don’t
    take any unnecessary risks or anything.”


    I grinned. “When have I ever done that?”


    He pulled me closer. “I’m serious. And hurry back.” Leaning toward me, he gave
    me a light kiss on the cheek, which was enough to send a tingly thrill through
    me.


    “I will,” I replied. I grabbed my purse and Scott’s tablet, which I’d stashed
    in Java Jive’s safe, not having known what else to do with it. After giving Pete
    a wave, I hurried to catch up with Ryder, who was not as far down the hall as
    I’d expected him to be. “I’ll drive,” I said to him, reaching for my keys.


    “Nah, I’ll do it.”


    “Hey, you’re doing me a huge favor here. The least I can do is drive.”


    He held the front door of the coffeehouse open for me. “No, thanks.”


    “Why not?”


    “You’re a terrible driver.”


    I stopped in the parking lot to stare at him. “What? I am *not*.”


    “Yes, you are. Do you know how many traffic laws you break every time you get
    behind the wheel? You speed, you don’t stop at stop signs, you pass people on
    the wrong side, and you generally scare the shit out of me anytime I ride with
    you. I could have given you seven citations the last time you drove me somewhere.”


    “Seven citations? Whatever. You’re a white-collar-crime detective, not Tennessee’s
    version of CHiPs. When was the last time you even pulled someone over? You probably
    don’t know how to operate a radar gun.”


    “Maybe not, but I can look over and see your speedometer.” He opened the passenger
    door of his car. “Get in.”


    “Fine,” I huffed, secretly happy I didn’t have to drive. Ryder complained incessantly
    when he rode with me, which had been a lot more in the past few months due to
    his injury. It wasn’t a bad thing to not have to listen to his nagging all the
    way to Indiana.


    “I’ll drive you to your apartment so you can pack an overnight bag.”


    I made a face. “Overnight? Are we going to be there that long? And who’s going
    to take care of Max for you?” I was his go-to dog sitter.


    “If we end up staying, Maya said she’d feed him and let him out. I think we should
    be prepared for anything. You of all people should know investigations never go
    quickly.”


    “I guess I see your point.” I glanced in his backseat and noticed a duffel bag.
    “You already had your bag packed?”


    “Yeah.”


    “*Before* you came and asked me if I wanted to make the trip.”


    “So?”


    Laughing, I said, “You’re such a nerd. You’re dying to investigate this. Why?”


    He sighed. “I’m bored out of my mind doing busywork for Maya.”


    There was more to it than that. I could tell by the consternation on his face.
    “And?”


    “And…nothing.”


    “Liar.”


    “Fine. If you must know, I’m tired of taking orders from my girlfriend.”


    I nodded. “There it is.”


    “If you tell her I said that…”


    “Your secret is safe with me.”


    “Hey, speaking of nerds, what’s going on with you and Pete?”


    I felt a blush tinge my cheeks. “Nothing.”


    “Right. So that heartfelt goodbye in the office was nothing.”


    I gasped. “I knew you were spying on us.”


    “So you’re dating him *and* that little boy?”


    “Okay, one, don’t ever say it like that, because it makes me sound like a child
    molester. And two, I am most certainly not still involved with Cooper, especially
    after what he did.”


    “What did he do?”


    By now we had pulled into the parking lot of my apartment complex. I nodded toward
    my apartment. “I’ll let you see for yourself.”


    True to his word, my super had already fixed the damage to my front door, which
    I was happy to see, especially since I was going to be out of town.


    I opened the door and gestured inside. “I figure Cooper broke in last night between
    when I dumped him and when I got home.”


    As Ryder took a look around at the mess, his jaw clenched and unclenched at least
    three times. He finally ground out, “This kid lives next door?”


    “Yeah, why?”


    Ryder stalked to Cooper’s door and started pounding on it with his fist.


    “Ryder, stop. I don’t want to get into it right now with him.”


    But of course Ryder being Ryder, he didn’t listen to a word I said. Cooper finally
    answered the door, groggy with sleep and in his pajamas. Ryder grabbed him by
    the front of his shirt and dragged him, protesting, into my apartment and pinned
    him against the wall.


    Getting in Cooper’s face, Ryder demanded, “What the hell did you think you were
    doing breaking into this apartment and trashing it? Did Juliet break your little
    millennial heart and you couldn’t find a better way to control your hurt feelings?
    Is that it?”


    While he was grilling his suspect, I was busy covering my face with my hands and
    wishing the ground would open up and swallow me.


    Cooper squeaked out, “I didn’t do this. I swear. I would never do anything to
    hurt her or upset her. Juliet, you know me. Tell him I would never do this to
    you!”


    I looked Cooper straight in the eye. “So you really didn’t bust in my door last
    night and wreck the place after I broke things off with you?”


    “No, and it makes me sad that you’d even think that about me.”'
