    尽管皮特非常努力地想劝说我今晚留在他房间里睡（当然，只有他一个人），但我拒绝了。我知道我无法应对那种局面。这种过夜越像纯友关系越好，于是我他在他的沙发上占了一个位置，就再没挪动过。早晨的气氛略显尴尬，因为我们彼此不知道该是用招手、拥抱，还是再来一个极其火热的吻来问候对方。我们决定用一种单臂拥抱/挤压的方式。从皮特的脸色看，他对整个状况也和我一样一样困惑。我以极快的速度洗完澡准备妥当，来到咖啡馆，期待着我清晨的惯例——为我们烘焙当天的点心，这总能让我平静下来。


    但今天，这段安静的独处时间只会让我的思绪野蛮生长。我今晚和皮特约会时该穿什么呢？整个晚上会像今天早晨在他家里时一样尴尬吗？约会之后呢——我们能停在一个晚安吻吗？我昨晚联系了公寓楼的管理员说我的门坏了，他承诺今天早上些时候会来修理，所以我没有紧迫的理由再次留在皮特那里过夜……除非是因为完全不同的原因。


    但他和我约定过要慢慢来。无论那是什么意思，可能都不包括在我们的第一次正式约会后就跳上床，所以我可能是在多此多虑。并不是说我*不想要*和他跳上床。但一旦你那样做了，就无法挽回了。此外，关于莱德，我还有一些需要处理完的情感，诚承认，这也是我极力主张和皮特的关系进展缓慢的理由之一。我需要尽可能的时间来确保莱德·汉密尔顿彻底从我的世界里消失。


    当员工到达并开始营业前的准备工作时，我的思绪平静了许多，等 Java Jive 开门、顾客熙熙攘攘时，我的不安感消失了。令我高兴的是，当皮特进来吃早餐时，我的恐惧并没有抬头。我只感到一阵幸福的涌动。也许，我们真的可以的。


    当我正在给格蒂的咖啡杯接咖啡时，皮特走过来，一边唱着：“ ‘我无法把你从脑海中抹去，你是我的朱丽叶。 ”


    我尽力压住脸颊上泛起来的红晕，但我确定皮特看到了，就在他试图俯身在格蒂脸颊上亲一下来掩饰笑容时他看到了。


    “早安，格特，”他说，手在柜台上敲击着。


    “你今天早上心情真不错，”她评论道。


    他向我眨眨眼。“那是因为我今晚有一个火辣约会。”


    这一次，我不得不转过身去掩盖涌遍满脸的热浪。我把咖啡壶放在加热器上，试着在回到柜台前调整好情绪。


    当我背过身去时，我听到格蒂问：“谁是那个幸运女孩？”


    “你正看着她呢，”皮特回答道，声音溢满了幸福，“嗯，某种吧。”


    我吸了一口气转过头，发现他们都在盯着我。我挥了挥小手。“我是那个幸运女孩。”


    “噢，真是该是时候了，”这是她唯一的回答，尽管她正笑得合不拢嘴。格蒂一直希望我们在一起，她对此并不害羞，还经常向我们提起。


    在那之后，我的局促感消失了，我们三个人像每天早晨一样聊天大笑。我觉得今天会是很棒的一天。我的手机在口袋里震动。那是一个我不熟悉的号码，但从区号和前缀来看，我假设那是利伯蒂（Liberty）的一个人。


    我道了歉，走到柜台边缘接电话。“喂？”


    “朱丽叶？”一个女声音问道。


    “是的。”


    “嗨，我是莉兹·哈特·摩根。贝塞尼·麦库尔给了我你的号码。希望这没关系。”


    我想我晚后得和贝塞尼谈谈她给出我号码的事，尤其是给她的同事，于是回答道：“抱歉，对于……嗯，任何事，我都没有评论。”


    “噢，我不是在为《编年史》（Chronicle）要独家采访。我只是这里一个卑微的校对。我打电话是因为我有些消息，我想你可能想听。曼迪·奥马利失踪了。”


    # 第 13 章


    我挥了挥手引起皮特的注意，示意他跟我回办公室。在路上，我说：“莉兹，你介意我开免提吗，让我的，嗯，伴侣也能听到这个？”


    “没问题，”她回答道。


    当皮特在我们身后关门时，我切换到了免提。我对他说：“这是瑞恩的姐姐，莉兹。她说曼迪失踪了。”


    他的眉毛挑了起来。“又？”


    莉兹问：“你刚说‘又’吗？”


    我回答道：“是的。她去世的丈夫斯蒂一直以为她上个周末失踪了一段时间。他一定是搞混了，因为事实证明她并没有真的失踪。”我踮起脚在皮特的耳边低声说，“记得她在报社工作，而且和首席调查记者结婚了。什么都别说。”


    他点了点头。“嗯，”莉兹说，“斯蒂的妈妈有点是个戏精。你确定她不是因为曼迪没去参加葬礼而故意大惊小怪的？”

