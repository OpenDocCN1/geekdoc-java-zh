  trans: '

    她耸了耸肩。“我确定你亲眼看到过，当你剥开他们展示给世界的壳时，人其实是多么不稳定。在见过了这一切之后，我不得不告诉你，对于人们彼此之间所做的事情，我已经不再感到惊讶了。”


    这准确得令人心惊，正是我很多时候的真实感受。“你说得对。我猜我并不意外。老实说，这整件事让我有些措手不及。”


    “啊。你离得太近了。我经历过。”她的声音柔了下来，补充道，“我记得斯科斯特离开你后，镇上流言蜚语四起。我无法想象这一切对你来说有多容易——调查他的死因以洗你和你朋友皮特的清白。尤其是你可能还在因为他对待你的方式而恨斯科斯特入骨子里。”


    我的胃一阵抽搐。“等一下。你怎么知道我们是重点怀疑对象？”


    莉莉丝给了我一个抱歉的微笑。“瑞恩。周日你们你们来到城里时，我从他那儿套话出来的。用了几十块饼干和一盘布朗尼，他才终于开了口了。”


    我叹了口气。我太清楚瑞恩·哈特可以用甜点收买了。然而，我并没有从父母那里听到任何关于《编年史》关于斯科斯特死因的报纸文章提到过我的名字。我爸爸每天从头到尾读报纸，如果他发现了什么，会立刻给我打电话。


    我说：“你和布莱克知道两个谋杀案嫌疑人的名字却没有把他们写进任何文章里？”


    “你对我哥哥太好了，他对你和你的朋友皮特崇得至极。我们一秒钟相信你可能参与其中，所以没有理由无故毁掉你的名誉。而且，和你可能想的相反，《编年史》确实在努力报道真实事实，而不只是八卦和传闻。”


    我摇了摇头。“抱歉我对《编年史》以及整类报纸有偏见。我不能说我对媒体有过过什么好的经历。”


    “也许我们可以改变这一点——”


    当我们听到布莱克说“对你你们公司发生的事疯了。先是奥马利猝死，然后他的妻子又消失了。她是你的实习生，对吧？你担心她吗，还是你认为她可能是为了独自一人而跑了？”


    现场沉默了片刻，接着杰德紧张的声音响起：“我不知道。我联系不上她。我花了一整天找她，但哪里都找不到她。”


    布莱克说：“你觉得她身上发生了什么坏事吗？”


    杰德哽出抽泣声。“我……也许吧。”


    瑞德说：“听到这个消息真难过。我们能做些什么帮忙吗？”


    “不，谁也做不了，”杰德嘟囔道。


    我皱起眉。“所以如果杰德没有和曼迪私奔，他不知道她在哪里——我假设他在说真话，因为他醉了——那么要么这件事里还有另一个参与者，要么曼迪才是幕后黑手。”


    莉莉丝说：“你认定她杀了丈夫？”


    “我不知道她是否真的动手了，但我的直觉告诉我她参与了。我觉得杰德也是。”


    布莱克说：“我们总有能做的事。这里的莱德是个……私家侦探。”


    “没错，”莱德说，“我很乐意尝试追踪她的踪。”


    “没用的，”杰德哀嚎着，话语模糊不清。“都结束了。我知道。”


    “等等。你什么意思？你认为她死了？”瑞德问。


    我们听到“咚”的一声，接着布莱克说：“该死。他睡过去了。”


    我打开麦克风。“睡了？像昏过去那样？”


    “是的。彻底睡死了，”瑞德回答。“这次采访结束。”


    我关掉了我们的监听设备。“好吧，那可真是短促愉快。”


    莉莉丝皱起额头。“我们什么都没学到，除了杰德不是那个让曼迪消失的人。”


    “我觉得那算是个收获。”


    瑞德和布莱克出现在门口，每人腋下夹着杰德软绵的手臂。他们开始拖着他沉重的尸体走向停车场边缘的一辆黑色越路虎 Rover。


    “我们要帮他们吗？”我问。


    “不用，他们是高大壮的小伙子。他们行得了。”


    在把杰德塞进汽车副驾驶座后，他们走回我们停车的地方。


    当他们离我们几英尺远时，莉莉丝作呕了并捂住鼻子。“呕。你们闻起来像发掉的啤酒和烟灰缸生了个孩子，然后那个孩子又在自己身上吐了一了。”


    我大笑起来。我喜欢她。而且她没说。他们身上散发着“旧仓库”的味道。


    布莱克拉起衣领闻了闻。“没错，很准。我要开车送费舍尔回家，好让他睡一觉过去。跟我过去吗？”


    她回答：“没问题。”

