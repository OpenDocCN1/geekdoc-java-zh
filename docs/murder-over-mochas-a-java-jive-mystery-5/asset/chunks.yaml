    I stifled a groan. Typical Scott, changing the subject when the conversation got
    a little too real for him. I pointed across the coffeehouse to the restrooms.
    “Over there.”


    He jumped up and shot across the front of the house, making me wonder if his sudden
    need for a restroom was legit, after all. I wandered over and plopped down on
    the stool across the counter from where Pete was standing.


    “You didn’t put `Ex-Lax` in his coffee, did you?” I asked him, hoping that wasn’t
    the reason for Scott’s emergency bathroom break.


    Pete snapped his fingers. “Darn it. Why didn’t I think of that? You know, a waffle
    taco would probably have the same effect even without any added laxative. Want
    me to whip one up for him?”


    Chuckling, I said, “No thanks. Maybe if we’t have any more interruptions, this
    conversation will be over soon.”


    He shrugged. “I make no promises.”


    “Oh, and bring back his stupid satchel.”


    “Yes, ma’am.”


    Scott came out of the restroom, his face much grayer than when he went in. Something
    was up with him.


    I met him back at the table. “Let’s get down to business so you can go somewhere
    and lie down. I think you need to rest.”


    He nodded. “Okay, Juliet. Here it is. Mandi’s not just missing. She’s been…abducted.”


    “What?” I cried. “Why?”


    Lowering his eyes, he continued, “I’ve had some…business dealings go wrong lately
    with some dangerous people. I’ve been threatened multiple times. And this time—”
    His breath caught on a sob. “This time they made good on their threats.”


    My jaw dropped. “Some ‘dangerous people’ have taken your wife and—what? Are they
    holding her for ransom? Are they going to hurt her? Why aren’t you talking to
    the police right now?”


    He grabbed his belly again and groaned. “They said no police. That if the police
    got involved, they’d kill her.”


    “Why did they take her? What do they want from you?”


    “I kind of…illegally obtained some sensitive information. I’ve got evidence that
    will ruin a lot of people’s lives.”


    “Really?” I griped. How had I not realized how much of a sleaze this guy was?


    “I need your help. You’re a PI, right?”


    I rubbed my temples, trying to wrap my head around what he was saying. “Scott,
    this is `insane`. You have to go to the cops. They can help you without calling
    attention to themselves. Plus, PIs don’t even do this kind of thing. We find out
    if people are cheating on their spouses or their business partners. We don’t do
    kidnapping or ransom stuff.”


    Scott reached across the table and seized my hands. “The people I’m dealing with
    are wealthy and powerful. They have connections. If I go to the police and they
    find out, Mandi’s dead. I can’t trust anyone I know except you. Please, you have
    to help me. We have to find her.”


    He was asking the impossible. “Are you proposing that you and I go up against
    a bunch of powerful and dangerous kidnappers all by ourselves?” I demanded. “In
    what scenario could you imagine that `not` ending badly?” The last thing I needed
    in my life was to get tangled up with some more violent delinquents.


    “I know it’s a lot to ask. I’m sorry. But I need you,” he pleaded.


    “Look, I have some good friends who are cops. We can go to them—”


    “No!” he shouted, jumping up. His eyes glazed over, and he began to sway. “Is
    the room spinning?”


    I lunged toward him and guided him back down into his seat. Pete was already on
    his way over to help. Luckily, it was late on a Saturday night and the place was
    fairly empty. We didn’t need a bunch of prying eyes watching us. Pete and I got
    Scott settled, then Pete ran and got him a glass of water.


    Scott took a swig of the water and wiped his mouth with the back of his hand.
    “Okay, I’m better. Please, will you help me save her?”


    I sank back down into my chair. “Scott…be rational. You and I do not have the
    skill set for hostage rescue. If you won’t go to the police, can’t you just give
    these people what they want? And who are they, anyway?”


    His eyes did not look right, and he wasn’t himself at all. “It’s complicated.
    Juliet, I’m begging you. Will you at least help me find out where my wife is being
    held?”


    I sighed. I could try, but I’d have to know a lot more than the cryptic bits and
    pieces he’d been giving me. There was something he wasn’t telling me, and if I
    had to guess, I’d bet he was holding back because the whole truth would incriminate
    him. This “illegally obtained” info of his had to be pretty huge.


    “If you’ll start giving me some actual information I can use.”


    “I think she may be here in town. She drove down here for a work trip yesterday
    afternoon, and then I got a call early this morning saying she’d been abducted.”


    “Who called you? Who took her?”


    His response was to lean over the side of the table and vomit on the floor.


    Pete, ever-the adult, muttered, “Eww. I’m not cleaning that up.”


    I glanced down at the small puddle of dark brown liquid on the hardwood floor.
    “It’s not that much, Pete.”


    # Chapter 3


    I was in a fog. Pete sat me down at a table, facing the wall, and ran to get me
    some water. Other than that, he didn’t leave my side, even when I insisted on
    going out the back door, trying to run away and never come back. He managed to
    coax me back inside, and the police and medical examiner arrived several minutes
    later. I could hear them conferring, but was too out of it to focus on what they
    were saying. I wanted nothing more than to get out of here, but I knew that wouldn’t
    happen for hours. I had a long night ahead of me, as did Pete. Because of that,
    I used every ounce of energy I could muster to settle myself down and push my
    personal feelings about Scott aside. I had to have my head on straight when the
    police questioned me.

