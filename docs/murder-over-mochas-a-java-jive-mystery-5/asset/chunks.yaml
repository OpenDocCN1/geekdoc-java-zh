    # Arrival

    Once I got to my apartment, it hit me how tired I was from everything that had
    gone down today. But before I even made it to my bedroom to change into my pajamas,
    there was a knock at my door. Immediately assuming it was Cooper, who had probably
    heard either through the grapevine or on the news about what had happened at `Java
    Jive`, I cringed. I didn’t have the energy to talk—or do anything else, for that
    matter. Maybe he’d go away if I didn’t answer the door. I hid quietly in my bedroom,
    only to be startled nearly out of my mind when my phone began ringing and vibrating
    in my pocket.


    “Hey, Pete,” I said as my greeting. No matter the mood I was in, I never minded
    talking to Pete.


    “Answer your door.”


    “Okaaaay…”


    I ended the call and hurried to the door, wondering what could have possessed
    him to drive over here at midnight.


    He stood at my door with `Scott’s satchel` in his hands. “I…um…didn’t get a chance
    to give Scott his man purse back before…you know…”


    I sighed. “Right. I guess we should—”


    Pete barged into my apartment. “There’s some stuff in here you need to see.”


    I followed him into my kitchen, where he placed the bag carefully onto my counter
    and opened the flap. “You went through his bag?”


    He gave me a sheepish look. “I had a good reason, okay? I took his murse because
    in the back of my mind I was worried he’d come back to get revenge on you for
    punching him earlier. I figured it was my responsibility to make sure he didn’t
    pull some kind of weapon out in the middle of my place…or worse, try to use it
    on you.”


    I couldn’t keep the smile off my face. “Thanks for looking out for me.”


    “And I was right,” he went on, brandishing a handgun he pulled from the bag.


    Jumping back in horror, I cried, “Put that thing down! It’s probably loaded.”


    He showed me the butt end of the gun, which was missing its magazine. “Calm down,
    Jules. I removed the clip and emptied the chamber.”


    Staring at the gun, I said, “Scott must have thought he was in real trouble. I
    never knew him to carry a gun. I don’t even think he owned one when we were together.”
    I stopped to shake my head. “Wait. How did you get your hands on `Scott’s man
    bag`? You didn’t take it with you to the station, because you didn’t have it when
    we left. And `Java Jive` is on lockdown until the crime scene unit is done with
    it, so you couldn’t get back there to grab it.”


    “You know after Scott was…um…gone, and I went to get you some water?”


    “Yeah.”


    Pete shrugged. “Call it intuition or déjà vu—I knew this thing was going to turn
    into a huge cluster—which it has—so I hid the bag in the bushes near the back
    door. I wanted you to be able to have a look through it before the police got
    it. And I didn’t want to tell you about it in front of `Ryder Likeapony`. I know
    he’s supposedly on our side and all, but he’s still a cop.”


    I was touched at the risk he took for me. “Thanks, Pete.”


    At the same time, I was concerned he’d created a problem. The police were going
    to be looking for Scott’s personal effects, like his keys, phone, and wallet.
    When they didn’t find them in his pockets, in his vehicle, or at the scene of
    his death, it was only a matter of time before they started asking questions.
    And of course Pete and I would be the first people they’d ask.


    For now, though, we had the upper hand. Maybe. Depending on if there was anything
    of use in `Scott’s man bag`. I opened the bag and emptied the contents onto my
    kitchen counter. As I suspected, we found his wallet, keys, phone, spare change,
    and lip balm. There were also a few crumpled receipts, an old-fashioned motel
    key, and some empty candy wrappers.


    “The phone is password protected, so it’s pretty well useless.” Pete picked up
    the motel key and wiggled it at me. “This is what I’m most interested in. Scott
    said he was in trouble. What do you say we do a little poking around in his motel
    room and see what else we can find? He was staying at the `Franklin Motel`. It’ll
    be just like old times.”


    I chuckled uneasily. The first time Pete and I had investigated a murder (the
    other time I’d been a person of interest), it had led us to the `Franklin Motel`.
    It was a horrendously run-down place in a seedy part of town, and we’d had a rather
    dangerous experience there. I didn’t know if I was up for it again, especially
    tonight. Sure, I tracked shady characters at my second job, but I never withheld
    evidence from the police or did any kind of breaking and entering.


    When I gave no response, Pete threw his arm around my shoulders. “I know you’re
    a fancy-pants PI who doesn’t break the rules anymore, but this is kinda serious.
    I think we need to do whatever it takes to clear both of our names. I’d much rather
    get a slap on the wrist for a `B and E` I did commit than a few decades with a
    cellmate named `Tiny` for a murder I didn’t.”


    I held up my hands. “Okay, okay. I get your point. Let’s go.”


    ---


