  trans: "\n丹尼尔也拿起了我的手机，然后把它们都扔进了仍在运行的深油炸锅里。\n\n我呻了一声。“太棒了。我现在得换另一部手机了。可能连油炸锅也得换，等那些手机变得又烫又脆，有毒废物渗出来的时候。”\n\
    \n丹尼尔坏笑着说：“你死后就不需要手机了。进冷冻室，你们两个都。”他打开冷冻室门，向里面看了一眼。“这是紧急释放按钮吗？”他问道，指着门内侧的一个旋钮。\n\
    \n我一直希望他没打算去检查有没有那种东西。\n\n皮特说：“如果我说没有，你会相信我吗？”\n\n“主意得不错。拿个平底锅之类的东西，把它砸断。”\n\n\
    皮特皱着眉说：“我觉得我想那样做，因为那样我们就出不来了。”\n\n丹尼尔朝我走了几步路，依然保持在遥不可及的距离，枪指着我的头。“快做，自大狂的。”\n\n\
    皮特的眼神里充满了恐惧和痛苦，听从了他的指令，在准备台下找到了一个巨大的铸铁煎锅。他慢慢走到冷冻室前，像挥斧头一样举起锅，将锅边砸在旋钮顶部。塑料旋钮裂开并断成两半，穿过门的金属杆轻微弯曲。\n\
    \n丹尼尔说：“再来。”\n\n皮特扭着脸又击了一下，这次把金属杆弯得更厉害。内部的紧急释放装置现在没用了。如果我们进去，除非有外力帮助，否则我们出不来。\n\
    \n丹尼尔说：“你可以放下平底锅了。我看得出来你恨不得立刻把它砸在我的脸上。”\n\n皮特把它扔在地上。 \n\n丹尼尔用枪指着皮特说：“好了，你们两个。进箱子里。”\n\
    \n我向水池后退去，注意到我们的员工还留了一些没洗的碗筷——包括一把随手扔在里面的小水果刀，正等着某个毫无防备的手伸下去拿时被刺伤。通常情况下我会大发雷霆，但这次有人要加薪了。\n\
    \n我犹豫了一下。“等等，丹尼尔。没有什么我们可以做做来改变你的主意吗？比如……你可以付钱让我们保持沉默。你知道斯斯科拿走了我所有的钱，你也见过我的公寓了。买下我并不需要多少钱。”\n\
    \n从他的表情中，我看出丹尼尔正在考虑。他用下巴朝向皮特。“这地方是你的？”\n\n“是。”\n\n丹尼尔摇摇头。“买你代价太高了。”\n\n我靠在水池旁说：“好吧，你可以只买我一个。”\n\
    \n“我不认为你这里的男朋友会太喜欢那样。你们两个，进箱子里。”\n\n皮特咬着牙说：“如果你放她走……我自愿进冷冻室。”\n\n“噢，那是我听过最动听的话了。”丹尼尔对我说道，“老斯斯科永远不会为你做那事的，对吧？”\n\
    \n我对着皮特笑了，尽管泪水几乎要夺眶而出。我的一部分在担心他的承受得如何（看起来并不太妙），但我需要保持清醒，试图想办法找到生路。\n\n“不，他不会那样的，”我回答道，硬化了表情。“不过，他得到了应得的因果报应，对吧？”\n\
    \n丹尼尔耸了耸肩。“他惹恼了很多人。时候到了了。”\n\n“我想知道是谁杀了他。如果你打算杀我，我至少应该知道这件事。”\n\n“好。是曼迪……主要是她。”\n\
    \n“你是怎么‘大部分’杀掉一个人的？”\n\n“她把药加进了他的饮料里，由我递给他的。”\n\n“是左多巴胺和乙丙酸钠的致命配方吗？”\n\n丹尼尔似乎被惊艳到了。“你做过功。”\n\
    \n皮特插话道，“嗯……那意味着你某种程度上也杀了他。”\n\n我盯着丹尼尔。“等等。你和曼迪在斯斯科来看我之前，就在纳什维尔和他在一起，还为了着曼迪被绑架的事哀哭流涕？那到底是怎么回事？斯斯科从一开始就在欺骗我吗？”\n\
    \n“所谓的绑架是曼迪和我想出的一个诡计，为了让斯斯科交出他的勒索信息。当他拒绝用他的信息换取她的命，并试图自己去找她时，她生气了。我同意帮她做一件她一直想做的事。我安排在酒吧和斯斯科见面，敦促他对勒索的事做出更好的决定，但他根本不听。。曼迪也在酒吧，但她避开了他的视线。斯斯科不知道她在那儿，他完全不知道发生了什么。”\n\
    \nJava Jive 厨房墙上的电话响了，丹尼尔目光从我们身上移开了一秒。我迅速夺过那把小而锋利的刀，将其滑进我的后口袋。\n\n他的气焰有些动摇，他问道：“谁知道你们在这里？”\n\
    \n希望他没听到我和莱德对话的末尾，我无辜地说：“才过十点几。这个时间总有人在这里打扫。我们经常在下班后接到电话。”在他纠结电话时，我继续道，“嘿，为了满足我自己的好奇，曼迪第二次消失是她自己离开的——还是你参与了？”\n\
    \n他对我冷笑了一下，这给了我所需的全部答案。“她在小屋里。当然，处于昏迷状态。乙丙酸钠让人变得非常顺从和安静。但如果你在第一个早上找得仔细一点，你可能就会发现她，这就是为什么我必须分散你的注意力。”\n\
    \n真个变态。“好吧，我得佩服你——把我们关在兰迪叔叔阴森的地窖室确实是个很好的注意力分散。”\n\n“我是这么认为的。”"
