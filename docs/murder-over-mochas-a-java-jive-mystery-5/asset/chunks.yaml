    Pete sped the rest of the way to my apartment while I called Cooper to verify
    his message. He sent me a picture of my (again) busted doorframe. I then called
    Ryder and 911.


    When we got to my apartment, Cooper was standing guard by my open front door.


    “Cooper, thanks for watching out for me. I appreciate it,” I said.


    Stony-faced, he replied, “You’re welcome,” then marched into his apartment without
    another word.


    Pete and I entered my apartment, cringing as we saw all our hard work ruined.
    Every box and bag we’d packed had been opened and emptied onto the floor. When
    the initial irritation began to subside, a chilling fear began to take over. To
    my knowledge, Jared Fisher hadn’t been found yet, but now I had a pretty good
    idea of his whereabouts.


    Two uniformed MNPD officers got there first. They took my statement and Cooper’s.
    Not long after that, Ryder and Maya arrived, grim-faced.


    Maya rushed to hug me. “While I’m happy to see you back, did you have to bring
    the crazy with you?”


    I frowned. “This was not the plan.”


    She lowered her voice. “And you’re sure it wasn’t the boy toy? Ryder said he was
    the one who called to let you know.”


    “No, it wasn’t Cooper. I overheard him telling the uniform he’d been at a clinical
    from three o’clock until he got home and called me. He has to clock in and out
    for school credit, and he’s shadowing a doctor the whole time so there’s proof
    of where he was every minute this afternoon and evening.”


    Ryder said, “I called Harrison on the way over here. They’ve yet to locate Jared
    Fisher, but I’m thinking they can narrow their search to here in town. I’m afraid
    he’s fixated on you for some reason. This is twice now, same `MO`. I’m just thankful
    you weren’t here.”


    Pete squeezed my shoulder. “Me, too.”


    An unmarked police car squealed into the parking lot. Delaney jumped out, huffing
    and puffing. His beady eyes landed on us, and he made a beeline for me. I could
    feel what little joy that was left inside me being sucked out as he approached.


    “What the hell happened here?” he demanded, shoving Pete and one of the uniformed
    officers aside to get a better look inside my apartment.


    I blew out a long breath. “Evidently our fun little case isn’t over yet.”


    He let out a bark of laughter. “Or you did this yourself for the attention.”


    “Seriously? If you actually think that, then you’re a bigger tool than any of
    us ever imagined.”


    My friends had to cover their smiles as Delaney’s face turned purple.


    “Stay out of my investigation!”


    I raised my voice to match his. “How does my place getting ransacked while I’m
    gone translate to me inserting myself into your investigation? If you’d done your
    job in the first place instead of wasting time trying to pin a murder on us, none
    of this would ever have happened! Find. Jared. Fisher!”


    Cursing under his breath, he brushed past us and barged into my apartment, turning
    his wrath on one of the officers inside.


    Pete said, “How long do we have to stick around?”


    “Shouldn’t be long,” Ryder replied. His brow furrowed as he turned to me. “I don’t
    think you should stay at Pete’s like you did last time. This guy could be watching
    you. I want you in protective custody until he’s caught.”


    “Oh, come on,” I whined. “No offense, but I’m soooo tired of cops right now. And
    I’ve already taken two days off work this week. The coffeehouse could be in a
    shambles, for all I know.”


    “I told you the place is fine. Listen to what the man has to say,” Pete said.


    Ryder conceded, “Maybe it doesn’t have to be so invasive. You can go stay in a
    hotel that requires a `key card` to grant access to the upper floors, and we can
    post a `uni` outside your door. Then you can go to work tomorrow, and I’ll babysit
    you. Will that work?”


    I rubbed my forehead. “I guess…”


    Maya gave me a sympathetic pat on the shoulder. “You seem rather shaken still.”


    “I am. And I’m not looking forward to the prospect of spending the rest of the
    evening alone in an empty hotel room with only my thoughts to keep me company.”


    The corner of her mouth turned up as she glanced at Pete. “I bet you could bring
    a `friend` along to keep you company.”


    ---


    A uniformed MNPD officer escorted Pete and me from my apartment to a hotel downtown
    that was only two blocks from the police station. We were taken in through the
    delivery entrance and up to our room via a service elevator. The officer checked
    around the room, and after pronouncing it free of murderers, left us alone.


    Pete took my hands. “I know this isn’t how I expected my day to end when I woke
    up this morning. How about you?”


    I laughed mirthlessly. “Not even close. Too bad we can’t rewind the day to the
    part right before I got the call from Cooper.”


    “Tell me the truth—are you absolutely positive about going on tour? I was worried
    I was overstepping, but I figured it would be easier to ask for forgiveness than
    to try to talk you into letting me give it a shot. Plus I didn’t want to get your
    hopes up, only to crush them if the guy said no. But it’s one hundred percent
    your decision. You can still say no, and I’ll be fine with it either way.”

