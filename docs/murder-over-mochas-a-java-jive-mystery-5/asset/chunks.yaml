    “What now?” Pete asked, having heard me grumble under my breath for the better
    part of an hour.


    “A dick pic. I officially need a break from delving into Scott’s personal life.”


    “That’s kinda what today is all about, Jules.”


    “I don’t think we need to get *that* personal.”


    Ryan asked, “What’s up with Scott becoming such a shit show all of a sudden?”


    I replied, “I don’t know, but I’m afraid we’re going to have to find out. I don’t
    think I can take many more surprises.”


    Pete chuckled. “Well, look on the bright side. At least you dodged the bullet
    of becoming Mrs. Shit Show.”


    I shot him a look while Ryan dissolved into a laughing fit.


