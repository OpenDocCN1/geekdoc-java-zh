  raw: 'I hesitated. Telling him about this morning’s incident would only worry him,
    plus it was over and done, and we were fine. “Um, it’s going okay. Didn’t make
    a lot of headway this morning, but we’ve got a plan for the afternoon.”


    “Find Mandi yet?”


    “Nope. And her boyfriend is nowhere to be found, as well.”


    “I bet they ran off together.”


    I smiled. “That’s what I said.”


    Pete groaned. “Aw, crap. Momzilla is back. I gotta bounce. Call you later.”


    “Okay, have fun.”


    “Jules?”


    “Yeah?”


    “Be careful.”


    “I will.”


    I ended the call and went back into Sam’s, only to find Ryder still smirking.
    “What?” I asked.


    “You do like him. A lot.”


    “What? Who?”


    “Pete. That’s who the call was from, right?”


    Time for some more deflecting. There was no way I could talk about my feelings
    for Pete (with Ryder, no less) and be expected to run a successful investigation
    of my ex-fiancé’s murder. It was way too much to ask of anyone. “Yeah, and shouldn’t
    I like him since he’s my BFF?”


    Ryder shook his head. “You know what I mean.”


    “Are we done here?” I asked, gesturing to our empty plates.


    “Oh, I’m just getting started. Did you realize you were giggling while you were
    talking to him?”


    I said between gritted teeth, “I don’t giggle.”


    “You were giggling.” He jerked his head toward the front of the restaurant. “I
    saw you through the window.”


    I stood and tossed some money down on the table. “We’re burning daylight, Detective.”


    Shrugging, he got up and threw down some cash of his own. “Yes, ma’am.”


    —


    Julia’s husband had been able to come up with the names of six doctors he thought
    might be getting kickbacks, which she’d emailed to me. We decided to divide them
    up, each team (Ryder/me, Blake/Lizzie/Julia) taking three. I sent Julia the master
    list of Silver Spruce’s clients from Scott’s tablet, hoping she might have an
    idea of who to try after we exhausted her list.


    When Ryder and I got to Dr. Richardson’s office, we found out that he was taking
    an extended lunch, aka golfing, and would be back later to see the remainder of
    his patients for the day. Another doctor on the list, Dr. Devaux, had an office
    in the same building. This was an interview I was not looking forward to. Dr.
    Devaux had been my childhood pediatrician until I was ten years old. He’d made
    a major misdiagnosis, insisting I had a flu that lasted for weeks when I actually
    had Lyme disease from a tick bite. Needless to say, my parents lost their confidence
    in him and found another doctor for me, making sure to let Dr. Devaux know what
    they thought of him after the fact.


    Dr. Devaux wasn’t free to speak with us when we walked in, so Ryder and I had
    to sit for what seemed like hours in a waiting room full of haggard-looking moms,
    and children with snotty noses and croupy coughs. For me, the place was a hellscape,
    and not only because it brought back bad memories of childhood doctor visits.
    Strangely enough, Ryder watched mesmerized as the kids ran and played, grinning
    as they sometimes (horror of horrors) stopped to touch us with their grubby hands
    before looking up to realize we weren’t Mom or Dad.


    I leaned over and whispered to him, “You seem to be enjoying this. What’s up with
    that?”


    He turned to me, puzzled. “These little guys are adorable. You don’t think so?”


    “No.”


    “Oh, right. You’re the one who doesn’t want kids.”


    “That’s me.”


    “Why not?”


    I gagged as I watched a little boy grab the hem of his mother’s skirt and wipe
    his dripping nose with it. “I have to touch enough gross things at work. I don’t
    want to do it at home, too.”


    “They grow out of the gross phase pretty quickly.”


    “Then they grow into the annoying-questions phase, followed by the sulky teenager
    phase—”


    “I think you skipped a few phases in between.”


    “See? I know nothing about kids. I’m doing the world a favor by not having one
    of my own.”


    Fighting a smile, he asked, “What does Pete think of your anti-kid sentiment?”


    I shrugged. “He knows.”


    “And?”


    “And I get that you’re trying to segue our conversation into another chance to
    pry into my personal life again. Stop it, or you’re next in the time-out chair
    over there.” I jerked my thumb in the direction of a red-faced girl sitting on
    a tiny chair in the corner. She’d just slapped her younger brother for no apparent
    reason, so their mom had made a makeshift punishment area in the waiting room.


    “Detective Hamilton, Ms. Langley, Dr. Devaux will see you now.”


    Ryder didn’t miss the fact that every little boy in the room turned to gawk admiringly
    at him when the receptionist called out “Detective Hamilton.” I hadn’t pegged
    Ryder for such a softie where kids were concerned.


    Dr. Devaux was waiting for us in his office. When we walked in the door, he looked
    up, recognizing me immediately. I wondered if he remembered the angry phone call
    my mother made to tell him what she thought of his bogus diagnosis. “Little Julie
    Langley. You’re all grown up. I guess I haven’t seen you since you were ten years
    old. Please, sit.”


    Ryder introduced himself as I cringed inwardly, wondering how many times I’d hear
    the phrase “Little Julie Langley” come out of Ryder’s mouth in the next few hours.
    Dr. Devaux for some reason could never get my name right.


    Fighting to keep a straight face, Ryder said, “Dr. Devaux, we’d like to ask you
    a few questions about Silver Spruce Pharmaceuticals.”


    Dr. Devaux smoothed his tie and tried to keep his doughy face passive. The plaid
    fabric was unmistakably Burberry. Unless Dr. Devaux had grown some fashion sense,
    someone had given him that tie. All I’d ever seen him wear were polyester clip-ons,
    which went just fine with his paper-thin dress shirts that showed his ill-fitting
    wife beater underneath and his Sansabelt slacks. The Burberry tie was strikingly
    out of place.


    “Ask away,” he replied.


    Ryder said, “Who is your drug rep?”


    The doctor cleared his throat. “I think her name is Mandi. Oh, and sometimes Jared
    comes calling.”


    “How about Scott O’Malley?”


    He shook his head so fast it made his droopy jowls flop back and forth. “I don’t
    know him. He’s…dead, right?”


    “Yes,” I replied. “Possibly murdered.”


    Dr. Devaux’s eyes grew wide. “Julie, you’re investigating a murder? But…I thought
    you were going to be a famous singer when you grew up.”


    “I’m a woman of many talents. So do you have drug reps from other pharmaceutical
    companies who visit you?”


    “Well, not too many. I mainly do business with Silver Spruce. They carry most
    everything I need to dispense.”


    “Are there any particular reasons why you tend to choose Silver Spruce products
    over others?” I asked.


    He got out a grayish hankie and wiped his forehead with it. “No.”


    “I love your tie, Dr. Devaux. Where did you get it?”


    His eyes narrowed at me. “My receptionist told me you were here investigating
    Scott O’Malley’s death. What does my tie have to do with him?”


    “Maybe something if his wife gave it to you.”


    His face flaming red, the doctor slammed his hands down on his desk. “Are you
    insinuating there’s something going on between myself and Mandi?”


    I laughed out loud at the thought before I could catch myself. Not only was Dr.
    Devaux old enough to be Mandi’s grandfather, but he also hadn’t been even remotely
    attractive in his younger years. Time had unfortunately not been his friend, either.


    “No, I’m asking if she gave you that tie. It’s a simple question with a simple
    answer.”


    “My tie has nothing to do with her husband’s overdose. But if you must know, I
    bought it at the mall in Ellsworth.”


    Ryder nudged my foot with his. The coroner hadn’t yet confirmed whether it was
    an overdose or a poisoning, although according to Detective Delaney it was looking
    more like the latter. The toxicology tests often took weeks to be completed and
    returned to the coroner, so they wouldn’t know for sure for a while. It seemed
    that someone had started a rumor—or told Dr. Devaux a flat-out lie—about Scott’s
    cause of death.


    Dr. Devaux cleared his throat. “Now, if you’re quite finished wasting my time,
    I have patients to see.”'
