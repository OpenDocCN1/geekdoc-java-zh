    I put my hand on his arm. “I don’t want to think that someone might have killed
    Scott, either. But that’s why I’m here, and this time I brought an actual detective
    with me. I want to get to the bottom of it.”


    “As happy as I am to hear that, I feel like I should tell you…” He lowered his
    voice. “Mandi’s behavior since Scott passed concerns me. Until today, she hasn’t
    missed a minute of work. She’s not grieving. In fact, Monday night she went out
    clubbing with some friends. Granted, Scott and Mandi were having marital problems
    and even had some knock-down, drag-out fights here at the office, but she’s so
    indifferent to the fact that he died. I know people are worried that something
    bad happened to her, but…when I heard about her deappearance, I began to wonder
    if she disappeared on purpose, if you know what I mean. What I’m trying to say
    is, please be careful—especially if you happen to find her.”


    “You think she could be dangerous.”


    He nodded, his expression grave.


    I smiled. “Thanks for telling me.”


    Daniel nodded again, his shoulders slumped like I’d never seen them before. This
    morning he wasn’t bothering with the suave act like he had at our first meeting.
    Scott’s wife might not have been grieving, but his former best bud was.


    As he put his hand on the doorknob to let us out, I said, “Wait. I have another
    question about Scott, if you don’t mind.”


    He turned back with a sad smile. “Not at all.”


    “Your boss told my partner and me that right after Scott got fired, he went off
    about something, talking crazy. But when we tried to pin down `McKay` as to what
    exactly Scott said, he clammed up and got all shifty. He was definitely trying
    to hide something. Were you around when it happened to hear what was said?”


    “No, but I bet I can find out easily enough. `McKay` is notoriously terrible at
    holding his liquor. Give me till after lunch. I’ll get it out of him for you.”


    ---


    I filled Ryder in on my conversation with Daniel on our way to Dr. Richardson’s
    office. As we sat in the parking lot outside, I grew more fidgety by the second.


    Ryder looked over at me. “Would you relax? Maya is running a background check
    on `Jared Fisher` as we speak, so we should know something here pretty soon. If
    nothing else, we’ll find out what type of car he drives, so we’ll know if he’s
    even here.”


    “I knew this couldn’t be simple,” I grumbled.


    “If investigating were easy, everyone would be able to do it, and we would both
    be out of a job.”


    “You should get that put on a coffee mug.”


    Ignoring my comment, he studied his phone. “Here we go. Our guy drives a black
    Range Rover. Can’t miss one of those.”


    We glanced around the parking lot, but saw no vehicles like that.


    Ryder called `Doug McKay` and asked him where else `Jared Fisher` might be if
    he wasn’t at Dr. Richardson’s office. He gave us the name of another doctor on
    `Jared`’s list this morning, but when we went to that office, there was no sign
    of `Jared` there, either.


    “Now what?” I said.


    Ryder shrugged. “We do what we always do when we hit a wall. Find a way around
    it. Let’s go check out the guy’s house.” He pulled out of the parking lot and
    headed the short distance to `Jared`’s home.


    As something in my gut continued to gnaw at me, I absently tapped my fingers on
    the center console of Ryder’s car.


    After a moment, he put his hand over mine to halt my tapping. “Something bothering
    you?”


    I sighed. “Yes. This whole thing feels so twisted and sad. It’s really getting
    to me.”


    “I think this is yet another instance where you’re too close to the case. You
    want me to handle some of the interviews today? I brought surveillance equipment,
    so you can listen from the car.”


    “Thank you for the offer, but no. I made this mess.”


    “You got dragged into this mess. At least you didn’t bumble into it this time.”


    I gave him a rueful smile.


    He pulled up to the curb and studied the `Fisher` house for a moment. “You say
    this is the guy who threw you out of his house last time you talked to him?”


    “Yes.”


    “Let me try this one solo.”


    Realizing he made a good point, I didn’t object. He was only gone for as long
    as it took him to jog up the sidewalk, knock on the door, ask `Jared`’s wife a
    question, listen to her short reply, and jog back to the car.


    As he sank into his seat, he said, “The wife says he went into work early this
    morning.”


    “Only he doesn’t seem to be working, because he’s not where he’s supposed to be.
    I’ll call his cell.” I dug my phone out of my pocket and dialed `Jared`’s number,
    only to get his voicemail. “So `Mandi`’s side piece goes MIA around the same time
    she does. Coincidence?”


    “Doubt it. Maybe he’s out trying to find her.”


    “Or they ran off together.”


    “It’s possible…but why would they walk away from good jobs and nice houses when
    their semi-secret affair seems to have been working up to this point?”


    “If they killed Scott and think they’re going to get caught.”


    “They don’t seem to be at the top of the wanted list.”


    “Right, let’s go.”


    # Chapter 15


    Uncle Randy’s cabin had seen better days. But you couldn’t beat the lovely setting,
    especially in October when the trees were bursting with color. There were no vehicles
    in sight when we pulled up.


    Ryder went up and knocked on the front door while I went around the back. The
    place seemed deserted, so I went back and met Ryder in the yard.


    “No one’s answering,” he said. “I don’t think anyone’s here.”

