  trans: '

    尽管一切进展得非常顺利，但我老友——舞台恐惧症正试图溜入并搞乱我的表现。当我正努力忘掉这些情绪并集中注意力时，皮特走过来，双手抓住我的双肩。


    他说：“我看到你有点发慌。别怕。你会表现得很棒。而且每一秒我都会你身边。”


    我努力稳住声音，说道：“如果我忘了歌词怎么办？”


    “你不会的。”他挑了挑眉，带着开玩笑地说道，“但如果你真的忘了，我就直接把你推下台，接替你完成剩下的表演。”


    我笑了。“这可`不是`我预料中你会说的话。”


    “那是个玩笑。一个很糟糕的笑话。但这让你转移了对问题的注意力，不是吗？”


    “确实如此。”


    “这就是我在这里的意义。”他在脸颊上亲了我一下。“这将会太棒了。”


    他又用力捏了一下，松开了手，我们背上吉他，在麦克风前就位。场地的主持人介绍了我们，接着我们就开始了表演。整个过程过得非常快，我觉得自己错过了大段的记忆。在最后一首歌之前，皮特对我点了点头，提醒我该说几句话了。


    我笑了，现场的能量让我感到兴奋不已。“感谢大家今晚的光临，特别是我们所有的家人和朋友。最后一首歌是我和皮特一起写的新歌。希望你们喜欢。它叫作《挣扎（I’m
    Torn）。”


    在皮特拨下第一个和弦后，我开始歌唱。


    > *一切都很复杂。*

    > *害怕爱你，却无法忍心让你离开。*

    > *我是如此世俗。*

    > *感情运不顺，我的心失去了光彩。*

    > *但有了你，我可以成为我想成为。*

    > *你挖掘出了真实的我。*

    > *不该抗拒，无法拒绝，

    > *我依然在挣扎。*


    > *如此不确定。*

    > *如果我们走不下去，我会失去一切吗？*


    > *我们都会跌倒。*

    > *但每当我倒下时，你总那里将我扶起。*


    > *有了你，我可以成为我想成为。*

    > *你挖掘出了真实的我。*

    > *不该抗拒，无法拒绝，*

    > *我依然在挣扎。*


    > *我知道我在自我欺骗。*

    > *从一开始就开始爱着你。*

    > *我让理智占据了主导*

    > *并践踏了我的心。*


    在皮特的吉他独奏期间（一如既往地精彩），我不经意地看了他。他正看着我，脸上带着最甜美的微笑。当我结束歌曲时，我那颗今晚本无法更满的心变得温暖了。


    > *有了你，我可以成为我想成为。*

    > *你挖掘出了真实的我。*

    > *不该抗拒，无法拒绝。*

    > *我的心一直在告诉我*

    > *你是我我的唯一。*

    > *不该抗拒，无法拒绝，*

    > *我依然在挣扎。*

    > *我依然在挣扎。*

    > *我仍在挣扎中。*


    观众爆发出掌声，就在灯光熄灭的瞬间，我感到皮特给了我一个有力的拥抱。


    “你做到了，朱莉。我为你感到非常骄傲。我……我甚至找不到合适的词汇。”


    我们靠得很近，他说话时，热的呼吸洒在我的脖子上，最后，他的双唇轻掠过我的锁骨。一阵电流般的触感贯穿全身，我不得不努力保持专注。与皮特同台舞台的快感点燃了我多年来一直压抑的所有情感。


    “谢谢你。你知道的，没有你我做不到。”


    他退后一步，低头看着我，表情严肃而专注。在他开口之前，哈维埃尔和米克走过来，我们击击掌并拥抱。我们互相庆祝这场表演，坦率地说，它超出了所有人的预期，尤其是由于这是我们第一次在排练之外作为一个组合演出。我们走入观众席的朋友友海洋，他们都在迫不及待地想要给予自己的拥抱和祝贺。


    ***


    当大部分观众离开，下一支乐队开始表演时，库珀找到了我并给了我一个快速的拥抱。“很棒，朱丽叶。”


    “谢谢你。感谢你来听我们表演。”


    “我不会错过的。嘿，我会在酒吧那边坐一会儿——给你留点空间——所以如果你有时间，欢迎来那儿和我待在一起。不过没压力。”


    “谢谢你，库珀，”我回答道。唉，他为什么非要这么好呢？


    当我回到朋友所在的桌旁时，玛雅问：“那个人`是谁`？”


    他退后一步，低头看着我，表情严肃而专注。在他开口之前，哈维埃尔和米克走过来，我们击击掌并拥抱。

    '
- fmt: '

    We lingered over a shared dessert until closing time, and then Pete drove me home.
    He insisted on carrying my guitar up to my apartment for me. I figured he didn’t
    want the evening to end. I knew I didn’t.


    When we got to my door, he took my hand. “I don’t think your performance could
    have gone any better.”


    “*Our* performance. And I agree. It was perfect. Tonight was perfect.” I smiled
    up at him. The look in his deep brown eyes gave me a tug at my heart.


    He leaned my guitar against my door and moved to take my other hand, but stopped
    suddenly when the weight of the guitar pushed my door open. “What the hell?” he
    said, staring into my apartment.


    I looked inside, my warm and fuzzy feeling turning instantly to ice. My apartment
    was in shambles.


    # Chapter 12


    We stepped inside, and I had to choke back a sob. Every drawer and cabinet in
    my living room and kitchen was open, the contents spilling out and strewn on the
    floor. Nothing seemed to be broken, but someone had spent a lot of time making
    a mess, which was going to take a lot of my time to clean up.


    Pete put his arm around me. “We need to call the police. You’ve been robbed.”


    Getting a sick feeling in my gut, I replied, “Let’s take a look around first.”


    I hurried to my bedroom, Pete hot on my heels. My drawers and closets were open,
    and it looked like a bomb had gone off in here as well. However, my jewelry was
    sitting untouched on my dresser, like my TV had been in my living room. This was
    no robbery.


    I sank down onto my bed, lost in thought.


    Pete sat down next to me. “Can I call the cops now?”


    I shook my head. “No need. I don’t want to press charges.”


    His jaw dropping, he replied, “Why would you say that? You don’t even know who
    did it.”


    “I’m pretty sure I do.”


    “How?”


    I turned to him. “Do you think I did anything in the past couple of hours that
    might have warranted a retaliation?”


    “No.” His eyes bulged out. “Oh…yeah.”


    “Yeah. And if we went knocking on doors, which of my neighbors do you think would
    not be home?”


    “The one who tossed your apartment.”


    “Bingo.”


    “You sure know how to pick ’em, Jules.”


    I sighed heavily.


    Pete put his hand on my shoulder and gave it a squeeze. “Grab an overnight bag.
    You’re staying with me tonight.”


    “Pete, I’ll be fine here. This is nothing more than a childish prank.”


    He shook his head and stood up. “Not up for discussion. Start packing.” He reached
    down and plucked a particularly lacy pair of my underwear from the floor, then
    shot it at me like a rubber band. “I’ll help.”


    I chuckled in spite of the situation. “Okay, I’ll let you do your macho man–protector
    thing. But only for tonight, and mainly because I wouldn’t be able to sleep with
    this place looking like it does.”


    “Let’s not forget the fact that your doorframe is busted where your jilted boy
    toy forced his way in, which leaves you here with no security. Someone could come
    in and murder you in your sleep.”


    “There’s a pleasant thought,” I grumbled, stuffing clothes and toiletries into
    a bag.


    —


    As I followed Pete on the short drive over to his house, I tried again to wrap
    my mind around what had happened. I didn’t take mild-mannered Cooper for a vindictive
    ex, but who else would have gone to the trouble to mess up my apartment but yet
    still show a degree of respect by not vandalizing the place or robbing me?


    When we got to Pete’s house, I went in and collapsed on the couch, placing my
    head in my hands. Between the rush and excitement of performing and the contrasting
    bottoming out when I saw my apartment, I was crazy exhausted, and my head was
    killing me.


    “Jules,” Pete said.


    I looked up to find he’d sat down on the coffee table, facing me. “Yeah?”


    “If I had my way, you’d never have to go back to that craphole of an apartment
    ever again. Move in with me permanently. Tonight.”


    I groaned. “Pete, I so don’t have the energy to discuss this. And it’s a moot
    point anyway because your spare room is so packed with junk it could be featured
    on *Hoarders*.”


    Taking my hands, he pulled me to a standing position. “I have something to show
    you.” He led me down the hallway and opened the door to his spare room. It was
    completely empty.


    My jaw dropped as I walked into the room. “No freaking way. When did you have
    time to do this?”


    He shrugged. “I’ve been chipping away at it for a while.”


    “I totally take back the *Hoarders* comment. This is amazing.”


    Pete walked over and took my hands again. “I thought it was time to let go of
    some stuff to make room for something more important.”


    Whoa. That sounded pretty serious. He’d never presented me moving in here that
    way before. The whole situation scared the hell out of me in the first place,
    which was why every other time he’d brought it up, I’d deflected. Living in the
    same house it would be way too tempting, not to mention convenient, to bypass
    the friend zone and take things to the next level. And then what? Would it get
    awkward between us? Even though he never acted like it, he was my boss, after
    all, so that muddied the waters even more.

