  raw: 'Sighing, I replied, “I feel the same way. Something caused this change in
    him. Maybe it was the drugs. Or…maybe he was telling us the truth, and whatever
    he got mixed up in had him cracking under the pressure. If his story was true,
    it could have sent him over the edge.”


    “Yeah, only Mandi wasn’t kidnapped.”


    “So she says.”


    He leaned back and gave me a confused look. “Why would she lie about being kidnapped?”


    I shrugged. Something about Mandi’s story didn’t add up for me, but I couldn’t
    put my finger on it. I muttered, “I don’t know,” and kept scrolling. There was
    nothing of note in the past couple of months of incoming mail, so I went into
    his sent folder, then his trash folder. Nothing there, either. As for phone calls,
    there was nothing much to glean. His voicemail folder was empty. Most incoming
    and outgoing calls came from people in his list of contacts except for one unknown
    number that kept popping up the last few days before he died. I made a note of
    it for Ryder and Maya to track down.


    “On to the texts, then?” Pete asked.


    These were what I was dreading—Scott’s daily, non-filtered communications with
    everyone close to him. Even though I was over him in a romantic sense, it pained
    me to have to go through his personal information. I didn’t want to know all the
    little inside jokes he had with his wife. I didn’t want to read through his banter
    with his friends, the plans they’d made to go places and do things—him essentially
    going about his life like I hadn’t even mattered. Aside from his crappy apology
    last night (which was offered only *after* I’d brought up his transgressions),
    there was nothing to show that he had even an ounce of remorse for what he’d done
    to me.


    I cleared my throat. “On to the texts.”


    Pete took the phone from my hands. “On second thought, let me take this one for
    the team.”


    After blowing out a quick breath of relief, I said, “Thanks.”


    “Ooh. Scott and the wifey have been text-fighting.” He scrolled quite a ways.
    “For a while.”


    “How long?”


    “Um…” He scrolled a little farther. “Looks to me like things started heading south
    about three months ago.”


    “Three months ago…hmm…Wasn’t that when he started missing house and car payments?”


    Pete nodded. “ ‘Listen to this: I know you’re bleeping cheating on me with that
    bleeping bleep Jared. I’m going to bleeping punch that bleep in his bleeping bleep
    face next time I bleeping see him.’ ” He looked over at me and grinned. “I added
    the bleeps, by the way. Scott had quite the potty mouth.”


    Another newly acquired trait. “Okay, so this Jared guy is now on our list to track
    down today. What did Scott’s blushing bride say in response to his allegations
    of cheating?”


    “She told him to go bleep himself.”


    “Classy. See if he had a text war going with Jared, too.”


    Pete scrolled down the list of texts. “Here’s a Jared. Jared Fisher.” His eyes
    bulged out. “Whoa. I think we’ve found the right Jared. Scott had a one-sided
    text war with this guy going back about three months. Jared didn’t respond to
    any of the text taunting, not that I blame him. It’s uuu-gly. Before all that,
    the texts between them seemed to be work-related.”


    “Jared Fisher was a coworker, then. That would explain how he got close to Mandi
    and how Scott could have found out about it.”


    “And rather poetic justice that Scott’s wife was cheating on him with a coworker
    right under his nose. Sound familiar?”


    “*Too* familiar. Keep looking.”


    Pete scrolled through some more texts, making faces now and again. “Aside from
    texts to his wife and her lover, Scott’s texts to everyone else are all fairly
    normal. A lot of stupid guy talk between him and his friends, work stuff, a few
    to his parents and brother, and things like that. In the last couple of weeks,
    though, Scott hasn’t had nearly as much interaction with his bros or his family.
    His texts about work are shorter and a lot less conversational. He sent hardly
    any texts this past week except angry ones to his wife and to Jared.”


    “If he was in some kind of trouble, whether it was financial, marriage, work,
    or a combination of those things, it would be a normal human reaction for him
    to get snippy with everyone and pull away from his friends.”


    “Right. What about checking his social media accounts—I remember you gagging over
    some of them on the drive here. Do you think he had a little something on the
    side who was unstable and decided to off him?”


    I shrugged. “I guess it’s a possibility. I didn’t see any PMs about meet-ups with
    anyone he was having Internet intercourse with. From the locations listed on their
    profiles, his cyber-skanks were out-of-towners, but it doesn’t hurt to check.”


    “Mmm. Internet girlfriends. What do you want to bet some of them were old dudes
    pretending to be girls so they could get into Scotty’s cyber-pants?”


    “Thanks for *that* mental image.”


    Laughing, he gave me a squeeze with the arm draped over the back of the bench.
    “I’m sorry, Jules. I’m only trying to lighten things up. I hate to see you still
    hurting over what that bastard did to you. Let’s go talk to his loser friends,
    and then I’ll take you out to a nice dinner, where we will not discuss anything
    having to do with the case. After that, we can stop in and say hi to your folks
    and call it a day. Does that sound good?”


    I laid my head on his shoulder. “It sounds wonderful. Thanks for being here with
    me today. I couldn’t get through this without you.”


    “I wouldn’t want to be anywhere else.”


    —


    Not only was Jared Fisher home when we went to his house, but so were his wife
    and their three adorable children, who were playing in a sprinkler outside on
    this particularly warm October afternoon.


    Pete and I had to zigzag up the front sidewalk to stay out of the sprinkler’s
    path. When we approached Jared, who was sitting on the porch next to an attractive
    blonde, he stood and gave us a questioning smile.


    “Hi, can I help you?” he asked politely.


    I held out my hand. “I’m Juliet Langley, and this is Pete Bennett. I’m a private
    investigator, and I’m here to ask you a few questions about a coworker of yours.”


    His smile fading, Jared shook hands with both of us. “Let’s talk inside.” He turned
    to the woman. “Honey, I’ll be a minute.”


    The woman smiled. “Take your time.”


    Jared showed us into the house, which was every bit as nice as Scott’s, but was
    an older restored home closer to town. We sat at his purposely weathered kitchen
    table.


    “What can I do for you?” he asked, smiling again. I had Jared pegged as another
    pharmaceutical rep. He was a nice-looking guy, smiled a lot, and had that larger-than-life
    quality most good salespeople had.


    I cleared my throat. “We came to ask you about Scott O’Malley.”


    Jared blew out a breath and furrowed his brow. “Too bad about Scott. He has not
    been himself lately. And now…”


    It suddenly hit me how I *so* didn’t want to spend all day running around and
    talking about Scott. I wanted to go home and pretend this weekend never happened.
    It might not have been the best approach, but I got right to the point. “Well,
    now he’s dead. And someone killed him. He thought you’d been sleeping with his
    wife, so you’re as good a place to start as any.”


    Jared’s jaw dropped. He looked like I’d just slapped him.


    Pete said under his breath to me, “Dang, Jules. Leave your tact at home?”


    Trying to smooth things over, I said, “Look, Jared, I’m sorry to be so blunt,
    but we have a lot of people to talk to this afternoon, so…” Yeah, I probably had
    indeed left my tact at home.


    Jared continued to stare at me.


    Pete cut in. “Jared, I take it you’ve already heard about Scott’s passing?”


    Jared nodded.


    Pete replied, “He told us he’d been in some trouble. We need to find out what
    that trouble was.”


    “All I know is the office gossip about Scott. That he was responsible for some
    missing samples.”


    I asked as politely as I could, “Can you tell us about you and Mandi?”'
