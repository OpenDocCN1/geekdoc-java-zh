    Sighing, McKay replied, “It may be nothing, but when Mandi came back to the office
    yesterday afternoon from a sales call, she seemed…upset. Shaken, even. I was getting
    coffee from the breakroom and saw her duck into the ladies’ room crying.”


    I said, “Did you find out what was wrong?”


    He shook his head. “I…I assumed it had to do with her husband’s death. It seemed
    perfectly normal to me that she might have bouts of crying, especially here at
    first.”


    “In other words, you did nothing to try to comfort an employee—a fellow human
    being—who’d just lost her husband.”


    “Well, no…but—”


    “You know, Mr. McKay, when my employees are visibly upset, I try to help them
    out. Don’t you feel like that’s an important part of your job as manager? To make
    sure the employees you oversee are doing okay?”


    Ryder wiped a hand across his face to hide the smirk forming there.


    Judging from the sweat beading on McKay’s forehead, I figured I’d got under his
    skin. “It’s not my job to worry every time a woman cries in this office,” he blustered.


    Ryder murmured under his breath, “Bad move, pal.”


    I glared at McKay. “Wow. A misogynist. My favorite.”


    McKay shrunk a couple of inches under my gaze.


    I continued, “We also need you to verify where Mandi was this past Friday and
    Saturday. She said she was on an out-of-town work trip. Is that correct?”


    McKay grabbed his mouse and clicked it a few times, frowning at his computer screen.
    “Yes, she was in Nashville from Friday afternoon until Saturday around noon.”


    That information backed up what she and Scott had told me. It also put her near
    Scott within hours of his death, which was troubling.


    “Do you know what time she returned to town on Saturday?” I asked.


    He peered at the screen again. “She made a stop in Louisville to have dinner with
    some clients, so it would have been quite late.”


    Ryder said, “I don’t suppose you’d give us the names of those clients so we can
    verify that?”


    “No, not without a warrant. But you can speak with Jared Fisher, another of our
    reps. He was also present at the dinner.”


    Great. Mandi’s boyfriend was the only person we could speak to about her alibi
    for her husband’s time of death. How convenient.


    I said, “Let’s move on to Scott O’Malley. You sent him a cease and desist about
    not coming back into the building. What exactly prompted you to threaten criminal
    charges?”


    McKay loosened his tie. “He was out of control. He would burst in and rant and
    rave about ruining this place. I thought he might come in here and try to hurt
    people, so I had to resort to drastic action.”


    Ryder asked, “Was he that angry over losing his job?”


    “He was completely unhinged. As manager, I was the one who had the task of letting
    him go. Let me tell you, it wasn’t a pleasant meeting. After I told him his employment
    was terminated—and I gave ample reasoning for it—he began shouting and saying
    all sorts of crazy things.”


    “What crazy things?”


    McKay paused, glancing away. “Oh, just gibberish.”


    “All of it was gibberish? You could make out no words?” I asked.


    McKay’s cheeks flushed. “The gist of it was that he was upset over losing his
    job. He became so belligerent that I had him immediately escorted out by security
    before he could have the chance to cause anyone any harm.”


    “Or the chance to steal any more drugs?” Ryder asked? “That’s one of the reasons
    he was let go, correct?”


    Grimacing, McKay replied, “Yes. He was stealing samples from the other reps’ bags
    right under our noses. There are dozens of samples unaccounted for.”


    “What drugs, exactly?” I asked.


    “Levodopa, benzodiazepine, and H2 blockers.”


    “In English, please.”


    McKay refrained from rolling his eyes, but just barely. “Levodopa is used to treat
    Parkinson’s, benzodiazepine is an antianxiety med, and H2 blockers relieve heartburn.
    Oh, and a local neurologist complained he was missing some sodium oxybate early
    last week after Scott made an impromptu call to his office. Sodium oxybate is
    prescribed to treat narcolepsy. Silver Spruce doesn’t manufacture it, so I assume
    that’s why Scott had to find another way to obtain it.”


    “Do you have an idea why Scott would have stolen those specific drugs?”


    Shrugging, McKay replied, “There’s always the danger that a rep will decide to
    take drugs from the company and sell them on the black market. Meds are so expensive
    these days, people are being forced to turn to alternative sources to get them.”


    I nodded. “Okay, I get that. Would any of these medications be ones Scott might
    want to abuse? We keep hearing that he was actually taking the drugs he was supposedly
    stealing.”


    McKay frowned. “I wondered that myself, given his erratic behavior. Benzodiazepine,
    which you might know better as Xanax, one of our competitors’ products, is one
    I can see someone abusing. However, given Scott’s state of agitation lately, it
    was clear he wasn’t taking anything remotely resembling benzodiazepine. H2 blockers
    wouldn’t give you any kind of high, so I doubt he’d bother with those. Levodopa
    is essentially dopamine, which is an interesting one. It can increase alertness,
    energy, and confidence, and dopamine is what drives the pleasure center in the
    brain. I suppose it could give you a boost, but sodium oxybate is GHB.”


    Ryder said, “Don’t worry, we can be subtle.”


    I turned to Ryder, “I know where that is. Let’s go.”


    Ryder said, “Thanks for your help, Mr. McKay.”


    McKay jumped clumsily out of his seat. “Please, please. Don’t go barging into
    Dr. Richardson’s office waving your badge and asking to see Jared. Our relationship
    with the good doctor is precarious at best, thanks to Scott and his sticky fingers.
    We don’t need to give him any more reason to forbid us from calling on him.”


    On our way out, Daniel hurried from his cubicle and caught my arm. “Hey, Juliet.
    Could I speak to you for a second?”


    “Sure,” I replied. To Ryder, I said, “I’ll meet you in the parking lot.”


    Ryder left the office, and Daniel pulled me into a supply closet and shut the
    door.


    “What’s up?” I asked, a bit surprised by his choice of venue for our chat.


    His forehead was creased with worry. “I did not expect to see you back so soon.
    Do you have some new information on Scott’s death?”


    “Well, since Mandi turned up missing, it kind of put his death in a new light.”


    Daniel wiped a hand down his face. “I was afraid of that. I could stomach an accidental
    or even a purposeful overdose. But I hate to think…”

