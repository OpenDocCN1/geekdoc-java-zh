    A uniformed MNPD officer escorted Pete and me from my apartment to a hotel downtown
    that was only two blocks from the police station. We were taken in through the
    delivery entrance and up to our room via a service elevator. The officer checked
    around the room, and after pronouncing it free of murderers, left us alone.


    Pete took my hands. “I know this isn’t how I expected my day to end when I woke
    up this morning. How about you?”


    I laughed mirthlessly. “Not even close. Too bad we can’t rewind the day to the
    part right before I got the call from Cooper.”


    “Tell me the truth—are you absolutely positive about going on tour? I was worried
    I was overstepping, but I figured it would be easier to ask for forgiveness than
    to try to talk you into letting me give it a shot. Plus I didn’t want to get your
    hopes up, only to crush them if the guy said no. But it’s one hundred percent
    your decision. You can still say no, and I’ll be fine with it either way.”


    I slid my arms around his waist. “I’d be crazy to give up five weeks with you
    all to myself, with nothing to do but hang out and perform.”


    Smiling, he said, “There are probably a few other things we could do.”


    “Like what?” I asked innocently.


    “This.”


    He leaned down and pressed a kiss against my neck, which sent a flash of heat
    through my body. I tightened my grip on his waist and pulled him closer to me.
    His lips found mine, hot and insistent, as his fingers threaded through my hair.


    Pulling away much too fast for my liking, he said breathlessly, “Just so we’re
    on the same page…are we still planning to take this glacially slow? Or is that
    not a thing anymore?”


    I slid my hands up his back. “We’ve done glacially slow for twelve years. I think
    that’s long enough.”


    —


    I’d never experienced this level of bliss before in my life. Not even once. Had
    I never truly been in love with the men I’d dated before? And had I always been
    in love with Pete with my whole heart and simply been too stupid and afraid to
    ever do anything about it? I was sure I was guilty on all counts, but luckily
    I had the rest of my life to make up for it.


    I nestled into Pete’s arms, and he pulled me close.


    Unable to wipe the grin off his face, he said, “That was pretty great.”


    “Only pretty great? As amazing as your other bedroom skills are, your pillow talk
    could use some work.”


    “That was pretty great…honey? No, wait. That somehow sounded worse. Should I be
    calling you ‘honey’ or ‘sweetie’ now or not?”


    I pinched his cheek. “No, you keep calling me ‘Jules.’ No one else is allowed
    to call me that except you.”


    “What are you going to call me?”


    “I seem to remember calling you ‘stud muffin’ a couple of times. What would you
    think of that?”


    He gave me a mock frown. “I think you were using it sarcastically. And while an
    accurate moniker, I don’t think it quite captures the essence of me.”


    “Hmm. A moniker that captures the essence of Pete Bennett…Man child?”


    “Maybe I’ll just stick with Pete.”


    I tilted my head up so I could look straight into his deep brown eyes. “That works
    for me, because then I can say this—I love you, Pete.”


    Cradling my face with his hand, he said, “I love you, too, Jules. I always have.”


    # Chapter 26


    As I was reaching to silence the alarm clock, Pete flung his arm across me and
    beat the thing until it stopped beeping.


    I said, “You realize I get up at this time every morning, right? If this living-together
    thing is going to work, you can’t be karate chopping my alarm every day.”


    Eyes squeezed firmly shut, he wrapped both arms around me and pulled me close
    to him. “No one gets up this early.”


    “Do you think the pastries magically appear overnight at Java Jive’s doorstep?”


    “No, I know some hot chick goes in and bakes them. Now, shh. I’m trying to sleep.”


    I couldn’t help but smile. He was even more adorable in the morning, if that was
    possible.'
