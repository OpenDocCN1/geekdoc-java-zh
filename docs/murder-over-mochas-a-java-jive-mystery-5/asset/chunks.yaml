- fmt: '

    His voice softened. “Hey, you’ll figure it out, Jules. I know you will.”


    “Thanks. I wish I were as confident as you are.”


    “I wish we were on our date right now.”


    I smiled. “Me, too.”


    “Think you’ll be back tomorrow?”


    “I better be. I’m `so` sick of this.”


    My mom peeked her head out the door, calling, “Dinner’s ready.”


    Pete heard her. “Aw, I’m jealous. Your mom’s cooking is the best.”


    “Sorry. I’ll bring you with me next time.”


    “You better. I’ll call you tonight.”


    “Bye, Pete.”


    I ended the call and went into the kitchen. It smelled heavenly. Pete was right—my
    mom’s cooking was the best.


    She gave me a knowing wink. “I take you were talking to Pete.”


    “Did Dad tell you?”


    “Well, yes. But the smile on your face confirmed it. When are two going to realize
    you’re made for each?”


    I sighed. “I think we’re almost there.”


    “Oh!” she cried, wrapping me up in a hug.


    “Now, Mom, don’t start planning a wedding or anything.”


    She let me go and scoffed. “Wedding? Who cares about wedding? I want some grandkids.”


    “You know where I stand on that, Mom. Pfft. You’ll get the urge someday, missy.”


    After surprisingly relaxing dinner with my parents—probably because no one brought
    up the investigation—Ryder and I headed for `Vecchio’s` to meet his date.


    “So. Are you nervous?” I asked.


    He gave me a puzzled look. “Why would I be? It’s your first date. You should be.”


    “Can it, Julie,” he growled.


    I laughed. “Whatever you say, Seth.”


    He pulled to a stop in `Vecchio’s` parking lot and turned to me with a serious
    expression as he readied his earpiece. “If this goes too far, I’m pulling the
    plug.”


    Define ‘too far.’ Over-the-top innuendo? Inappropriate groping?”


    “I’m not joking here. You want a safe word to use so I know when to storm in and
    save you?”


    I got a mega glare for that.


    “Oh, lighten up. If we don’t start laughing at some of stuff we’ve had to do,
    I’m going to start crying.”


    Ryder’s expression softened. “I’ll do what can, okay? I appreciate you being the
    bait. Now get her, tiger.”


    We checked the equipment, and I began heading for the restaurant. After a few
    moments, I heard him say to Dr. Grantham, “You look beautiful tonight.”


    I made a gagging noise and jeered into the mic, “Come on, Seth can do better than
    that.”


    Dr. Grantham asked him, “What are drinking tonight? A beer for me, thanks.”


    There was some shuffling, as Ryder was settling into his seat. I heard Grantham
    placing their drink order. “Are you new to Liberty? I would have remembered you
    around,” she purred.


    “Just moved here. I used to live in Nashville. I adore Nashville. I’d love to
    hit the town with a local. You should take me sometime.”


    I said into my mic, “Wow. She’s not shy.”


    Ryder said to the doctor, “Sounds like a plan. So, I hear that you prefer Silver
    Spruce exclusively. As a doctor whose patients regularly use our products, what
    kind of services and assistance have you come to expect from our representatives?
    What can I do to serve you better?”


    Grantham replied, “Let’s not talk work. I want to know you.”


    He chuckled. “Well, if we don’t talk a little shop, I can’t charge drinks to the
    company credit card.”


    “Oh, well in that case, let’s get the shop talk over with quickly. Hmm. What can
    you do to serve me? You could give me some hands-on training for some of your
    products.”


    Ryder didn’t miss a beat. “Hands-on training is my specialty.”


    She let out a peal of laughter. “What else?” he asked.


    “I like shiny things.”


    “Duly noted. Any other requests?”


    “Designer labels. Got it. On a serious note…and this is somewhat sensitive—one
    of our former reps, Scott O’Malley, has caused trouble with one of the other doctors
    in town. Did you ever have contact with him? I’ve been tasked with finding out
    to make sure our reputation around here hasn’t been too badly tarnished.”


    Nice. He wasn’t a detective for nothing.


    Grantham replied, “Yes, actually. He’s—I mean, he `was`—a dreadful little man.
    He came in my office early last week, angry and belligerent. Tessa tried to make
    him leave, but he pushed past her and came into exam room while I was with a patient.”


    Ryder sighed. “That’s awful. I apologize on behalf of the company. What did he
    say to you?”


    She paused. “Wait. You don’t already know?”


    Ooh, she was calling him out. He took it in stride, though. “I heard the version
    spun by Silver Spruce, but I’d rather hear it straight from you. Please don’t
    leave anything out.”


    “Oh. Well, okay.” The man was good at his job.


    Grantham continued, “He wasn’t making a great deal of sense at first, but he managed
    to get his point across. The two Silver Spruce reps I deal with are quite generous
    and attentive—in a quiet way, of course. I thought Scott would have been aware
    of that, especially since one of them was his wife, but he kept saying things
    like, ‘I know you’re taking kickbacks, and I’ll make it public unless you pay
    up.’ He said if I didn’t give him five thousand dollars by Monday he’d send the
    `Chronicle` photos of me accepting bribes. I can’t have that kind of bad press.
    It would ruin my practice. I’d have to move there.”

