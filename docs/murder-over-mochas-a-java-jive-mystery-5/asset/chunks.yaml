    “Not exactly proof. But I do have statements from a number of people who knew
    him well that point to the fact that he was not acting like himself lately, and
    confirmation from three coworkers that he’d been fired for stealing drug samples.”


    “And I’m supposed to believe you because…?”


    I slid the report I’d stayed up all night typing across the table to him. “You
    don’t have to take my word for it. There are names and contact information for
    the people I spoke with yesterday. Ask them yourself. Contact his former employer
    and find out what kind of samples were stolen, then cross-reference that with
    the toxicology report from the autopsy. That should tell you all you need to know.”


    Delaney, who I thought had been ignoring me while he flipped through the document,
    glanced up at me with a smirk. “I’m familiar with how investigating works, Ms.
    Langley.”


    I gritted my teeth and kept quiet while Delaney read through my report.


    Once he was finished, he sat back again. “Am I going to find your fingerprints
    on everything in the bag?”


    “Yep.”


    “Will you sign an official statement that says you did nothing to tamper with
    anything you found in it?”


    “Yes, although I did unload the gun for you.”


    He smiled, but not nicely. “How kind of you.”


    “Does that mean we’re done here?”


    Delaney rubbed his eyes. “Okay, here’s the deal. I won’t press tampering or obstruction
    charges against you…*unless* I find out that you or your buddy Bennett had something
    to do with my vic’s death. If that happens, I’m going to throw everything humanly
    possible at you.”


    I breathed out a sigh of relief.


    He held up one finger. “I’m not finished. Understand that if I find you’ve taken
    even a gum wrapper out of this bag, I’ll bust your ass so fast it’ll make your
    head spin. Got it?”


    “Got it.”


    “Now stay out of my investigation!” he barked.


    ---


    As soon as we stepped out of the police station, I slumped against Ryder, drained
    from my ordeal.


    He threw his arm around me and chuckled as he steered me down the street toward
    his car. “Delaney put you through the ringer, didn’t he?”


    “How did you ever deduce that, Detective?”


    “I was listening in from next door.”


    I groaned. “Great. I had an audience.”


    “I wouldn’t call it an audience. It was only Cromwell and me. He’s back from vacation.”


    Rolling my eyes, I said, “I bet he loved watching me squirm.”


    Ryder grinned. “It was entertaining. You and Delaney put on a good show.” He stopped
    me at his car and turned me to face him, growing serious. “But from now on, can
    you go back to not doing stupid things in the course of your investigations?”


    “Sure. If people will quit accusing me of murder.”


    #


    Once I got rid of Scott’s man bag, I felt like a weight had been lifted from me.
    My life returned to normal, or at least my version of normal.


    I hadn’t seen Cooper at all on Monday—I’d been happy enough to assume he was giving
    me some time like he’d mistakenly thought I’d asked for. But when a bouquet of
    flowers arrived for me at Java Jive...


