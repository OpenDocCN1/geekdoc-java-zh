    we dropping you?”


    Ryan sobered up and gave him directions, and after about ten minutes we pulled
    up to a mansion of a house out in the country.


    “Whoa,” Pete said. “Nice digs.”


    Ryan replied, “Yeah, Lizzie’s husband, Blake, is old money. Good guy, though.”


    I snorted, inadvertently aloud.


    Ryan said, “You know, the two of them have actually solved a few murders themselves.
    They kind of remind me of you guys a little. I bet they could help.”


    I waved away his offer. “No, we don’t want to bother them with our problem, especially
    if your sister is pregnant. Go have a nice afternoon visiting them. We’ll text
    you when we’re ready to pick you up.”


    As we pulled away, Pete asked, “What’s your beef with this Blake guy?”


    “How much time do you have?”


    # Chapter 6


    “That bad?” Pete asked.


    I wrinkled my nose. “I guess it’s not a long story, just a pitiful one. He’s the
    writer whose article in the *Liberty Chronicle* put the final nail in my café’s
    coffin. You remember me showing you the review?”


    “Yeah. It was a pretty bad one as I recall.”


    “Right, and since people around here believe everything they read in the town
    newspaper, after the story came out, I essentially had no more business.”


    Pete reached over and gave my hand a squeeze, but said nothing.


    I shrugged. “It’s not like his review was inaccurate. But it still hurt.”


    When the review was published, I was running the place practically by myself because
    my employees began to quit once their paychecks started bouncing. So, the service
    was terrible and the food quality went down the drain because I was trying to
    cover the kitchen and the front of the house all at the same time. To make things
    even worse, we were always running out of food to serve because I didn’t have
    money to buy ingredients. Just another thing that was *all Scott’s fault*.'
