    他解释道：“回扣本身并不是问题。问题在于，为了获取或给予任何东西——礼物、金钱，甚至是性——来换取开具特定的药物，而这些药物最终由联邦医疗计划买单，这是一种欺诈行为。例如，通过给参加
    `Medicare` 的患者开处方，你就让政府卷入了你获取外快利润的计划中，这便构成了欺诈。销售代表和医生都可能因此被罚款并入狱，而且公司通常也会面临相当大的法律麻烦。”


    我的心一阵一绞。“所以，每个参与的人都可能陷入足够的麻烦，以至于让他们尝试让斯考闭是值得的？”


    “遗憾的是，是的，这意味着我们的嫌疑人范围又扩大了很多。”


    我的手机响了，是梅琳达。她说：“我们到了。你说你在地下室里？”


    “是的。入口在木屋西侧的防风门处。而且‘我们’是指谁？”


    她在听完我的问题之前就挂了电话，片刻后，我们听到门处传来刮擦声。门开了，阳光洒进了地下室。当我抬头，眼睛适应了光亮时，我的脸因皱眉而扭曲。她带了我最不喜欢的记者
    `Blake Morgan` 以及他的妻子 `Lizzie`，后者是梅琳达的朋友。


    莱德对我低声说：“我以为她会一个人来。”


    “我也是。”我回答道。


    梅琳达俯视着我们笑了。“没没想到我今天会像个超级英雄一样来救你们。”她越过我们看向地下室内部。“哇。被困在这种地方真是个毛骨悚然的地方。我真嫉妒。”


    当我爬上楼梯时，我低声念道：“谢谢你们过来。”


    当莱德和我上到地面层时，Lizzie 说：“谢谢你们过来帮忙，奇迹女士，但我没想到你会带上……这些人。”


    Blake 对我露出一个灿烂的笑容，对我伸出手，但我没有接。他带着困惑的表情打量着我。“不知道你是否见过他，”`Lizzie` 说道。这在 Blake 介绍的介绍。


    我说道：“我不知道。”他那帅哥的魅力对我毫无起作用。


    Lizzie 对她的丈夫翻了个白眼，拍了拍他的胳膊。至少 Blake 还有点风度，笑了起来。“我们，”Ryder 说道，“梅琳达在 `Chronicle`
    办公室接 `Lizzie` 去吃午饭时接你的电话。我坚持要一起去，部分也是为了人多胆大。在这里怎么小心都不为过。”


    她把我拉到一旁避开视线，而莱德继续向 Blake 强调不让调查信息上头条有多重要。


    她皱眉道。“抱歉带了他们。我说你可能不想有观众，但 Blake 从不听话。所以说真的，到底是谁想把你们关在别人的怪异地下室里？”


    梅琳达绕着手指间的一缕黑发，说道：“在我们做自我介绍时，这是 `Ryder`，朱莉特的朋友，还有 `Blake Morgan`。”


    他们有些尴尬地握了手，莱德说：“我很感谢你们过来，但我不得不请你们不要报告你们看到或梅琳达告诉你们的任何事。我们正在进行一项调查，不想惊动嫌疑人。你们来这儿对吧？为了那个？”


    Blake 至少表现得体面，他道。“有，某种意义上是。”


    当我们听到莱德开始咒骂时，我们抬头，看着他走向车辆并开始检查。


    梅琳达回答：“没有。除了那辆车，这里空无一人。我推测那车是他的，因为对那四个瘪胎气要要脑动脉的人是他。”


    我扫了一眼轮胎，该死的，它们全都扁得像饼一样。我疲惫地摇了摇头。“这一天每分钟都在糟糕。”


    “好吧，看到好的一面。既然有人把你们关起来并毁了你们唯一的交通工具，说明你们一定接近破解真相了。”


    我叹了口气。“没错。”


    Blake 已开始和 Ryder 说话。“你们到达时没有看到任何人吗？”


    “如果我知道那个，我也可能知道是谁害了斯考特，以及 `Mandi` 为什么失踪了。反正门到底是怎么被锁上的？斯考特的叔叔总是让门锁开着。”


    “一根生锈的钢筋穿过了门锁的环。”

