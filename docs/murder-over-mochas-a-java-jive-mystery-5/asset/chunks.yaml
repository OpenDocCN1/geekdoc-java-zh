    and fidgety again. He’d put a bandage over his nose, and bruises had begun to
    form around both of his eyes. I’d really socked it to him.


    I didn’t quite feel that “Hey, Scott” would be the appropriate greeting after
    I’d rearranged his face, so I sat down wordlessly across the table from him. His
    “satchel” was between us, and I had to suppress a grin when I recalled Ryder dissing
    it earlier.


    He sighed. “I know I have no right to ask you for anything. And I don’t blame
    you a bit for punching me.”


    I bit back a pithy response about *him* not blaming *me* for something he clearly
    had coming. Instead, I said, “Why did you come here?”


    He glanced around to make sure no one was listening in on our conversation. There
    were only a few people, seated at the other end of the room, well out of earshot.
    “I’m in big trouble, Juliet. I don’t know who to trust…but even though you hate
    my guts I know I can trust you. I have no one else to go to.”


    “What about *Mandi*?” I asked, referring to the waitress he’d left me for. Couldn’t
    hold back that one.


    I noticed he was sweating. A lot. And he was pale. His blond hair, which normally
    was (too) perfectly styled, hung lank around his face. His hands were even shaking.
    I could have written off the paleness as a side effect of the nose-breaking incident,
    but not the rest of it. I also happened to notice he was sporting a wedding band
    on his left hand, which irritated me, but I tried not to dwell on that at the
    moment.


    Scott’s eyes filled with tears. “She’s missing.”


    I wanted so badly to say, “Maybe she left you without so much as a goodbye,” but
    again I bit my tongue. When he’d left me, I’d thought for a brief but terrible
    moment that he’d gone missing, then when all of the other pieces started falling
    into place, I realized that wasn’t the case. Although I loathed the guy, I couldn’t
    bring myself to kick him when he was down. Instead, I asked, “Are you sure she’s
    missing? Could she have been suddenly called away by a family emergency or something?”


    Pete, who had been puttering around, cleaning off tables near us that were already
    clean in a not-so-veiled attempt to eavesdrop, finally brought us a couple of
    coffees so he could horn in on our conversation. “Hey, Scott. Long time no see,”
    he said fake-nicely. “You feeling okay, buddy? You look like you lost a fight.”


    Giving Pete a reproachful frown, I said, “Scott, you remember my friend Pete.”


    Scott nodded, his expression pained. This was not the same man I knew and unfortunately
    once loved. Scott O’Malley was a masterful salesman—everyone’s best bro, the life
    of the party, big man on campus. His constantly cheerful mood was infectious,
    which was why he was always the top sales rep for the food-service supplier he’d
    worked for. I’d honestly never seen him like this in all the years I’d known him.


    Pete wouldn’t shut up. “So what brings you to Nashville?” he asked as he sat our
    mugs down in front of us. He (purposely) sloshed some coffee onto Scott’s satchel.
    “Oh, I’m sorry, man. Let me get that cleaned up for you.” He took the towel off
    his shoulder and began wiping at the stain.


    Scott took a sip of his coffee and winced. “Don’t worry about it. Um…Pete, I don’t
    mean to be rude, but we’re kind of in the middle of something here…”


    I said meaningfully, “Pete, I think I hear Shane calling you from the kitchen.”


    Pete shook his head. “Nah, I don’t think so.”


    I gave him a hard stare and jerked my head toward the kitchen.


    He finally got the point. “Well, the coffee stain is not coming out, so I’ll take
    this in the back and see if I can do something with it.” As Scott feebly objected,
    Pete grabbed the messenger bag and hightailed it to the kitchen.


    I said apologetically, “It’ll be fine. Pete’s just being…Pete. He’ll bring your
    bag back.”


    Running a hand through his hair, Scott said, “He never did like me. I suspect
    it only got worse after I…”


    “After you left me and stole everything I had?”


    He hung his head. “Juliet, I’m sorry. I…I got scared. Everything was happening
    too fast. I got cold feet about us getting married.”


    So he’d had cold feet about marrying me after we’d been together for years, but
    it took him under a year to be ready to take the plunge with Mandi. Whatever.


    I snapped, “When that happens, most people just break up, Scott. They don’t bankrupt
    a person and her business in the process.”


    Scott took another gulp of coffee and clutched his gut. “Where’s the restroom?”'
