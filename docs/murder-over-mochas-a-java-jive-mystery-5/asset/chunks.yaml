    “Well, look at the bright side. You must be close to figuring this out if someone
    locked you up and ruined your only means of transportation.”


    I sighed. “True.”


    Blake had begun speaking with Ryder, and after a few moments Lizzie wandered over
    to us. A pretty blonde who was known for speaking her mind, Lizzie had been the
    talk of the town when she’d managed to rein in Blake Morgan, Liberty’s most eligible
    bachelor. She and I were never more than acquaintances, with her being a few classes
    behind me in high school.


    She said, “Hey, sorry Blake and I kind of made your business our business, but
    we wanted to get the chance to speak to you today, since you were in town again.
    My best friend’s husband is a drug rep for a rival of Silver Spruce’s. She got
    some dirt from him on Silver Spruce for an article she’s been working on for the
    *Chronicle*. With everything that’s gone on with Scott and now Mandi, we think
    it could actually be pertinent to your case. If you’d like to come back to the
    office with us, she’d be happy to share it with you.”


    I hesitated. This could turn out to be nothing more than small town gossip, or
    this could be the break I needed to finally start making some real headway on
    this case. It would most likely cost me some polite reciprocation in the form
    of an interview, which these people had been trying to get out of me for days.
    On a personal note, I didn’t relish the idea of cooperating with Blake Morgan,
    but I needed this information more than I needed to hold on to my grudge. Time
    to put on my big girl panties and do what needed to be done.


    Smiling, I replied, “I’d love to hear what she has to say. Thanks.”


    Lizzie’s face lit up. “That’s great!” Her face fell just as quickly. “Oh, but
    what about your friend’s tires?”


    “Getting them fixed is going to slow down our day, for sure.”


    Melinda said, “At least Ryder isn’t making his aneurysm face anymore.”


    Staring at Ryder, Lizzie said, “Is there a reason you’re only friends with that
    guy? He is super hot.”


    Melinda’s eyebrows shot up. “Why don’t you say that a little louder, Lizzie? Your
    husband didn’t hear it.”


    Lizzie scoffed. “What? I may be married and pregnant, but I’m not dead.” She turned
    her attention back to me. “I can’t imagine it was too much of a hardship to be
    stranded here alone with that hunk of man, Juliet. I could see the two of you
    as a couple.”


    She clearly wasn’t going to be satisfied with “we’re just friends,” plus one word
    from her brother, Ryan, could confirm that Ryder and I had at one time been much
    more. I conceded and gave her the bit of gossip she was looking for. “We did date
    for a short time.”


    “Knew it.”


    I was quick to add, “But it’s definitely over.”


    # Chapter 16


    It was decided that I would ride back to town with Melinda, Lizzie, and Blake
    while Ryder waited for a tow truck. I’d offered to wait with him, mainly so I
    could be there to pay for replacing his tires because this was *so* my fault,
    but he’d insisted I go on and keep working to avoid wasting our time. I didn’t
    relish the thought of heading into the lion’s den, so to speak, by myself, especially
    since we’d parted ways with Melinda, who had to return to work.


    The moment the three of us stepped into the *Chronicle* office, Bethany swooped
    in on me with a too-tight hug. “Wow! Two times visiting me in one week, Juliet?
    Did you come back to see where I work?”


    “Not specifically, but it’s a nice perk,” I replied, trying to keep the sarcasm
    from my voice. I liked Bethany, but she was a total ding-dong.'
