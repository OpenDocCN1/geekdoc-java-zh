  trans: '

    “你打算用那个男人的孩子来恐吓他开口。可真够不错的。”


    他耸了耸肩。“要么这样，要么你就像我今晚要对魅魔博士做的那样，用美人色计诱惑他。”


    我皱了皱鼻子。“那就用他的孩子吧。”


    这次接待员是一个年轻女性，她从看到莱德走进门的那一刻就开始流口水。他甚至不需要掏出证件，她就同意让我们见医生。我们也没有等候。她带我们回到了李医生的办公室，李医生几分钟后就走了进来。


    “我的前台说你们正处于一起杀调查中，需要我的帮助。你们认为我能为你们做什么？”他问道，似乎对要见我们并不特别高兴。


    莱德直直地盯着他。“你可以从告诉我们关于斯科特·奥马马利和银杉杉制药公司的一切信息开始。”


    李医生用同样严厉的表情回直着他。“*你*可以从告诉我你是谁的，并向我展示你的证件开始。”


    莱德从腰带上取下证件并递了出去。“我是莱德·汉密尔顿警探。这是朱莉叶·兰格，一名负责本案咨询的私人侦探。”


    当莱德准备收起证件时，李医生抬起手。“让我仔细看看那个证件。”


    莱德皱着眉，伸出手让李医生能更清楚地看到他的证件。


    “纳什维尔都会警察局。警探，你离家可远了。完全超出了你的管辖范围。”他站了起来。“现在，如果我不介意的话，我有病人要看。”


    就这？这家伙可真够对付的。去他的好警察/坏警察戏吧。我要答案。“等一下。死了一个人，你竟然甚至在决定不回答问题之前，什么都不听我们的提问？这简直是胡扯。”


    “所谓的‘胡扯’是你们横冲直撞地闯进来，并在没有理由的情况下质问我。我妻子是律师，我知道我不需要和你们说话。”


    我从座位上跳了起来。“李医生，对我来说显然你隐瞒了什么，我敢打赌那是你从银杉杉那里拿的回扣。你的弱点是什么？闪亮的袖扣？钓鱼之旅？还是妓女？”


    “出去！”李医生咆哮道。“再说一句话，我就叫警察。”


    我张嘴想要回击，但莱德抓住我的胳膊，在我还没多说什么之前就把我拉出了办公室。直到我们安全到达停车场，他才松了手。


    “那到底是怎么什么鬼？*我*才是坏警察，”他抱怨道。


    “而*我*受够了像他那样的家伙挡着我查明真相！我们谈论的是我的命。如果我们不搞清楚这一切，我可能会进监狱的。”


    “如果你不冷静下来并进入状态，你会因为某些无关的事情进监狱的。比如骚扰罪。”


    我努力忍着不让眼泪流出来，但我知道快止不住了。“为什么愚蠢的斯科特可以毁掉我的生活两次，哈？我凭什么受这种罪？”一颗眼泪流了，我愤怒地擦掉。


    莱德的表情柔和了，他双臂环住我，紧紧地抱住。“这不公平。你不必处理这一切。如果你愿意，我们可以现在管它不顾回家。我们可以为你找个律师，玛雅和我接手调查。你只需要说个话。”


    我叹了口气。虽然把头埋进沙子里会很美好，但我深陷其中。这是我的问题，而且我是个成年女性了。“谢谢。这是一个很有吸引力的提议，但你知道我永远无法坐坐旁观，让别人替我做那些脏活。斯科特可能是个混蛋，但他不该因此被杀。尽管我那么讨厌他，我还是想让他的杀害者受到法治。”


    他放开了我。“好。只要你参与，我就陪你。”


    我笑着说：“谢谢。这意义比你想象的要大。”


    当我们开始走向他的车时，莱德用肩膀碰了碰我的肩膀。“别跟我起感性。我们还有很多工作要做——”


    我的手机响了，打断了他的话。是莉兹。


    接完电话后，她说：“嘿，我们找到贾雷德·费舍了。”


    终于了。“在哪儿？”


    “在旧火站，正在那里愁愁。”


    ***


    旧火站绝对是地球上最恶心的酒吧，而我在纳什维尔也见过一些真的很糟糕的地方。我们在停车场见了莉兹和布莱克，但莉兹甚至不想下车。


    “这次我不参加，”她宣布道。“我现在的呕吐反射非常强烈，所以我绝对没办法在里面活过一分钟。”


    布莱克似乎对自己进去也有些顾虑。“对，但更重要的是，我希望今晚那里别发生酒吧斗殴。”


    旧火站曾是这个小镇真正的火车站，以其几乎每周都会爆发一次的闹腾酒吧斗殴而闻名。


    我点了点头。“我见过一些精彩的。”


    “对，但更重要的是，我希望今晚那里别发生酒吧斗殴。”


