- fmt: '

    Lizzie cut in, “She’s here so Julia can fill her in about the Silver Spruce thing.”


    “Oh,” Bethany breathed, tapping the side of her nose with her finger. Whispering,
    she added, “So does this mean you guys are teaming up on the investigation? That
    would be the coolest thing *ever*.”


    The only reply I had to that was a no, but Lizzie gave me a hopeful smile and
    said, “It would really be great to work with an actual private investigator.”


    Blake snorted. “What am I? Chopped liver?”


    Not seeming the least bit sorry, she cooed at him, “Oh, honey. Did I bruise your
    fragile male ego?”


    Unable to keep a grin off his face, Blake put his hand on her nearly nonexistent
    baby bump. “Yes, to the core. But considering you’re bearing my child, I’m more
    than happy to forgive you.”


    “So does that mean I get a free pass to say whatever I want for the next six months?”


    He put his arm around her and steered her away, whispering something in her ear
    that made her giggle.


    Bethany sighed. “Don’t they make the most adorable couple?”


    As much as I hated to admit it, I agreed. “Yes, they do.”


    “Speaking of adorable, did you not bring Pete back with you?”


    I smiled involuntarily at the mention of his name and got the sudden urge to call
    him. Unfortunately, he’d be unavailable most of the day, stuck in a long recording
    session. “Not this time. Sorry.”


    “How do you think he’d feel about a long-distance relationship?”


    “I think he’s seeing someone.” After the words were out, I felt a blush heat my
    cheeks. To change the subject, I said, “So…can I talk to Julia now?”


    Bethany had me follow her back to the office’s breakroom, snagging Julia Simmons,
    who I remembered vaguely from high school, along the way. As Bethany left and
    Julia and I finished greeting each other, Lizzie and Blake slipped in, still smiling
    at each other. Judging from Lizzie’s flushed cheeks and lack of lipstick, I assumed
    they’d found a secluded place to stop for a sixty-second make-out session.


    Once everyone was settled, Julia said, “Okay, so my husband, Dillon, works for
    Greenway Pharmaceuticals, Silver Spruce’s main competitor in this area. They sell
    a lot of similar types of drugs, so they’ve historically had something of a rivalry.
    He told me the Silver Spruce reps have always had the reputation of being more
    aggressive than most. And, as a result, there are rumors that they go the extra
    mile, so to speak, to get the doctors to push their scripts.”


    I thought back to the text I got from Daniel earlier and sat up straighter. “You
    mean like giving kickbacks?” Maybe Scott was indeed on to something.


    “Yes. Kickbacks were a serious problem in the industry until a recent crackdown.
    Reps were giving out all sorts of things, including sexual favors. Now, aside
    from the drug samples themselves, the reps aren’t allowed to give out anything
    besides informational pamphlets. Not even cheap stuff like tissue boxes or mouse
    pads or anything. Dillon doesn’t think Silver Spruce is playing by the new rules.”


    I asked, “What kind of things did they used to give out?”


    “Personal gifts, like golf bags or expensive liquors. Laptops, office supplies.
    Sometimes medical supplies. Trips, pricey dinners. Prostitutes. Anything that
    might wow the doctors.”


    “Maybe designer ties, cuff links, and earrings?”


    “Definitely.”


    “Does your husband have proof that Silver Spruce is still giving out these freebies?”
    I had proof—or at least I knew where some proof was. Mandi’s work duffel bag was
    full of the no-longer-acceptable swag I’d named off.


    “Not technically. The doctors aren’t exactly complaining about getting free stuff,
    and of course none of the Silver Spruce employees are going to out themselves.
    A former receptionist for one of the doctors in town told Dillon she’s seen gifts
    exchange hands. But she was fired on bad terms, so we don’t know how credible
    she is. Also, there have been a few doctors who all of a sudden in the last few
    months won’t let Greenway reps in the door.”


    Shrugging, I said, “Maybe they’re tired of dealing with salespeople.”


    Julia frowned. “Dillon originally thought that might have been the case. But then
    he and his coworkers started seeing the doctors out partying with Silver Spruce
    reps, sporting new watches and ties. Then one of the doctors got caught with a
    hooker not too long ago. That one’s harder to link to Silver Spruce, but Dillon
    wouldn’t put it past them.”


    “Is that enough ammo for you to write an article?”


    All Julia seemed to have was conjecture. I was beginning to feel sorry for the
    Silver Spruce reps and the doctors, because I knew what a scathing article (true
    or not) in the *Chronicle* could do to a person’s business reputation in this
    town.


    She sighed. “No, but we were hoping you could help with that.”


    I groaned inwardly. I knew this was coming. “Me?”


    Furrowing her brow, Julia said, “If you’re investigating Scott’s death, surely
    you’ve talked with people at his work.”


    “I have,” was all I offered in reply.


    Lizzie jumped in, “Since you’re familiar with all the players and kind of working
    it from the opposite end—just like Blake, who’s writing an article on Mandi’s
    disappearance—we were hoping we could all help one another by pooling our resources.”


    I was pretty sure what she meant by that was pool our information.


    I said, “My biggest question is—why do you think the kickbacks have something
    to do Scott?”


    Blake, who’d been silent so far, chimed in. “Given the fact that this kickback
    seems to be gaining momentum and one of Silver Spruce’s employees dropped this
    week and his wife is missing, we think it makes sense.”


    Julia brightened. “So it is true about the kickbacks. But how do we prove it?
    Do you have pictures?”


    I shook my head. “No. And if I hadn’t heard about it from Daniel, I probably wouldn’t
    have given this theory any merit. But now that I had more pieces of the puzzle,
    it began to make sense.”


    I blew out a breath, bracing myself to throw in with these guys. I was ready to
    do whatever needed to solve this once and for all. “Okay. We can partner up.”
    As I glanced around the table at the three of them, all excited to have won me
    over, I snapped, “But any information I share with you will not end up in any
    article. My parents live in this town, and I will not stand for them having to
    field questions about my involvement. Are we clear?”


    They nodded.


    Blake said, “Absolutely.” He gestured toward his wife. “She’s the same way. She
    took down a serial killer—at our wedding, no less—and wouldn’t let me use her
    name in the story.”


    Lizzie winked at me. “And if one of these boneheads forgets, I’ll take care of
    it in my copyedit.”


    I smiled. “Good enough. As far as I’m concerned, your idea about everything being
    connected has merit.”


    Blake said, “What about the evidence O’Malley said he had? Did he tell you about
    it or did you run across anything in your investigation?”


    I replied, “No. And it’s possible that his ‘evidence’ is that he found the same
    stuff I saw in his wife’s bag. I happened to see inside his bag also, and all
    he had was the drugs and a couple of cheap giveaway pens, so I’m assuming he wasn’t
    in on the kickback scheme.”

