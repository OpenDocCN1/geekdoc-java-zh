    Shrugging, he said, “If you say so. Now can we put this investigation to rest
    and weather whatever Detective Delaney tries to pin on us?”


    “Absolutely. Let’s go home.”


    # Chapter 10


    I hadn’t informed my parents that I was coming to town, so I figured if they somehow
    found out I’d been to Liberty, I could beg forgiveness for not stopping in to
    see them. It was well after nine o’clock by the time we finished dinner, so my
    parents would have already been in bed even if we did try to visit them. We swung
    by and grabbed Ryan, finally rolling into the parking lot at my apartment just
    before midnight.


    Ryan said, “Hey, thanks, you guys. I appreciate the ride.” He hopped out of Pete’s
    car and jogged over to the adjacent apartment building, where he lived.


    I took Pete’s hand. “Yeah, Pete. Thanks. For everything. Tomorrow’s agenda will
    consist of figuring out how in the world we’re going to get Scott’s satchel to
    the police without getting busted for obstruction.”


    Pete grinned. “That should be fun.”


    “See you tomorrow.” I got out of the car, and as I did, Pete got out, too. “Where
    are you going?”


    He came around beside me. “I thought I’d walk you to your door.”


    “Why?”


    He shrugged. “Lots of seedy characters around.”


    I looked around the complex. The only “characters” were a handful of not-seedy
    frat boys stumbling down the stairs and a few girls holding a too-loud conversation
    between two open doorways on my floor. “I think I’m probably going to be okay.”


    Rolling his eyes, he muttered, “You try to be a gentleman, and it gets you nowhere.”


    I smiled. “Drive home safely, please.”


    He got back into his car, a little grudgingly, I thought. I blew out a breath.
    Now it was time to deal with Cooper. I marched up the stairs, straight to his
    apartment, ready to get this over with.


    Cooper met me at the door with a pretty bouquet of flowers and a sweet smile.
    “Hey, Juliet. These are for you.”


    I accepted the flowers and breathed in their scent, getting a little stabby feeling
    in my heart. “Thanks, Coop. They’re beautiful.”


    “Come on in,” he said, taking my hand and leading me over to his couch.


    “I’m sorry for blowing you off earlier. I had to stay focused.”


    “It’s okay. Did you find what you were looking for?”


    I’d told him only that I was going to be spending all day out of town working
    on a big case, but no other particulars. “Yes. And I think we should talk about—”


    He laid a hand on my arm. “You know I’m usually not one to interrupt, but there’s
    something I need to say, so I’m just going to say it. I want to go public with
    our relationship.”


    My gut clenched, and all I could do was stare at him. Into his big, blue puppy-dog
    eyes. When I finally found my voice, I said, “Are you sure that’s a good idea?”


    “Yes, I am. I want to be able to take you out and get to know you outside the
    bedroom. While what we have now is fun, I know we could be great together if we
    gave us a chance.”


    Oh, no, no, no. I’d suspected he was into me, but I figured I could keep him at
    arm’s length easily enough. I’d thought wrong. “We should take a step back and
    think about this.”


    “Why? Are you…” His brow furrowed. “Are you embarrassed to be with me?”


    “No.” Yes. Our age difference was incredibly inappropriate. Which was probably
    why our arrangement was so appealing to me. It felt dangerous, but without actual
    danger, which I didn’t need any more of.


    “Then what is it?”


    I sighed. “I don’t want a relationship right now. My life is too messy.”


    He brightened a bit. “So you’re saying you need some time? I can live with that.”


    “No, that’s not what I—”


    Cooper leaned over and kissed me. “I’m going to prove to you that this is a good
    idea.”


    ---


    I yawned deeply as I fought to stay awake while I made the morning pastries for
    Java Jive. Pete had let me know late last night that the police had released the
    coffeehouse back to us, so I’d arrived even earlier than usual so I could straighten
    up after their investigation. I’d managed to wriggle away from Cooper fairly quickly
    and go home, but to my dismay (though not to my surprise), I hadn’t been able
    to sleep. While I laid in bed, I felt like Scott’s satchel was mocking me from
    its place on the dresser in my bedroom. I had to do something about that thing.
    If the police weren’t already on the hunt for it, they soon would be. So, I’d
    stayed up all night, devising a plan that would hopefully keep both Pete and myself
    out of trouble with the law.


    When Pete’s grandmother Gertie came in for her daily breakfast, I was nearly asleep
    on my feet.


