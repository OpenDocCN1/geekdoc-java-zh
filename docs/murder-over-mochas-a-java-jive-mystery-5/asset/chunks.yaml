    “Who called you? Who took her?”


    His response was to lean over the side of the table and vomit on the floor.


    Pete, ever the adult, muttered, “Eww. I’m not cleaning that up.”


    I glanced down at the small puddle of dark brown liquid on the hardwood floor.
    “It’s not that much, Pete. And there aren’t any chunks. Sack up and go get the
    mop bucket. Scott, I think you need to see a doctor. Maybe we should take you
    to the ER.”


    “No, I—” Scott suddenly grabbed his chest and leaned back in his chair, making
    strangled grunting noises.


    “Pete, call an ambulance!” I cried, getting up to help Scott.


    Pete, who hadn’t yet gone to fetch the bucket, took out his phone and quickly
    dialed for help. Before I could get my hands on Scott, he lurched to the side,
    tumbling out of his chair and onto the floor. I rolled him onto his back and tilted
    his head to open his airway, then called his name a couple of times, but he was
    unresponsive. I checked his neck for a pulse and listened for breathing. I found
    neither.


    # Chapter 3


    As I placed my hands over Scott’s heart and began chest compressions, the whole
    place got eerily silent. I could hear myself breathing and Pete finishing his
    911 call, but there were no other sounds. Someone had even turned off the music
    we always played over the sound system.


    Pete was down on the floor at my side in an instant. “What can I do for you, Jules?”


    Near panic and trying to keep count of my chest compressions, I only stared at
    him dazedly in reply. I stopped to give Scott two rescue breaths and checked to
    see if he’d started breathing on his own again. He hadn’t.


    As my face crumpled, Pete said, “I’ll take over the compressions.”


    While Pete worked on Scott, tears slid down my cheeks. I barely heard Pete say,
    “Breaths, now!” but I managed to give Scott two more breaths. I listened for breathing,
    but again heard nothing. We continued this agonizing cycle until two EMTs burst
    in through the front door of the coffeehouse and pushed us aside.


    Pete held me as we watched the EMTs continue CPR until their defibrillator was
    ready and in place. The female EMT shocked Scott, waited, then shocked him again.
    She sat back on her heels and shook her head.


    I choked out a sob and buried my head in Pete’s chest so I didn’t have to look
    at Scott’s still body.


    Pete tightened his arms around me. “I’m so sorry, Jules. I’m so sorry,” he said,
    over and over again.


    I was in a fog. Pete sat me down at a table, facing the wall, and ran to get me
    some water. Other than that, he didn’t leave my side, even when I insisted on
    going out the back door, trying to run away and never come back. He managed to
