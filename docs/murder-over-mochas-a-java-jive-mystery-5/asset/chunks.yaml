  raw: 'The name of the file was “Kickbacks and Assholes.xlsx.” Overly organized Scott
    had done his homework and put it all in a nice, neat spreadsheet. Column A was
    a list of purchase dates. Column B was a list of items. Column C was the price
    of each item. And Column D (evidently the “assholes” column) showed which Silver
    Spruce employee had ordered said item.


    “This lists the kickback swag we found in Mandi’s work bag—ties, cuff links, scarves,
    and earrings. There’s also restaurant and bar receipts—a couple hundred dollars
    a pop. Hotels, airfare, fishing cruises.” I paused, realizing Pete was more on
    target than I’d given him credit for. “Then there’s also medical-type stuff—a
    defibrillator, heart monitors, X-ray machines, scales, exam tables…even computers.
    Daniel is the one who purchased all of that.”


    The rest of the thumbnails looked like screenshots, so I clicked on each of those.
    They were all shots of purchase orders and receipts for the items listed in Scott’s
    swag spreadsheet.


    As I was staring at the screen trying to process this information, Pete said,
    “You’re looking thinky. What’s up?”


    “Besides the medical stuff, the other kickbacks on Scott’s spreadsheet are things
    that we know were given to Grantham, Devaux, and Muniz.” I brought the spreadsheet
    back up and pointed to the screen. “What Daniel purchased is essentially a list
    of the brand-spanking-new medical equipment Ryder and I saw at the Liberty Minute
    Clinic—which has been hovering on bankruptcy for years. When I asked Dr. Miller
    about it, she got all offended that I insinuated the stuff was Silver Spruce kickbacks
    and told me it had all been donated through a nonprofit organization.”


    I got on the Internet and found a place to search for Indiana nonprofit businesses
    and entered “Health and Wellness Indiana” into the search bar. It immediately
    popped up a listing. When I pulled up the business details, under “Incorporator”
    there was only one name listed: Daniel Stevenson.


    I flipped back to the photo of Daniel and Dr. Miller and sat back in the chair,
    staring at it in disbelief. “He’s running a front. He’s using this fake nonprofit
    to conceal the mountain of medical equipment he’s giving his girlfriend. You know,
    I’d even be willing to bet Silver Spruce isn’t fully aware of how much of their
    money he’s funneling into it. Look at the amounts on the spreadsheet. There’s
    over a hundred grand worth of medical equipment on here. The couple thousand Mandi
    spent on Muniz for a weekend fishing trip to the Caribbean is pocket change in
    comparison.”


    Pete’s expression had become increasingly uneasy as I spoke. “More importantly,
    Jules, your boy Dan is the mystery man, and this…” He gestured to my laptop and
    the flash drive. “This is what Jared Fisher warned you he’d stop at nothing to
    find. Call Ryder, call 911, and let’s get the hell out of here.”


    “Sounds like a plan.” I pulled out my phone and called Ryder, only to get his
    voicemail. After the week we’d had, I expected he and Maya were taking some much-needed
    alone time. “Hey, Ryder, um…sorry to bother you, but I’m pretty sure we’ve got
    trouble.” I gave him the short version of Jared’s message and brought him up to
    speed on Daniel’s nonprofit front. “I think we’re not quite out of danger yet.
    Pete and I are going to head to the station with the flash drive now. Talk to
    you soon.” To Pete, I said, “You ready? We should probably check out the kitchen
    and see if everything is turned off before we leave.”


    Pete grabbed my arm and pulled me up out of the chair. “We can deal with that
    later. I say we leave now and call the cops on the way. I’ve got a bad feeling
    about this.”


    As I reached back down to retrieve the flash drive, a voice behind us said, “You’re
    right, Pete. If you two don’t give me what I want, things are going to get real
    bad real fast.”


    Pete and I turned around to find Daniel Stevenson aiming a gun at us from the
    doorway.


    Glancing past us toward the desk, Daniel said, “I turned your place upside down
    twice and couldn’t find that stupid music box. I came here to persuade you to
    tell me where it is, or even to try to buy it from you. But it looks like you’ve
    found out why it’s so important to me. I’ll take the flash drive and that laptop
    now.”


    Trying not to let my voice shake, I said, “Wait. What’s up with the music box?
    How did you know I had it?”


    “Mandi, rest her soul, was too stupid to keep it in a safe place. It took her
    two days after you broke into her house to realize it was gone.”


    Pete cleared his throat. “So Mandi knew about the flash drive with Scott’s blackmail
    pictures? Why didn’t she destroy it?”


    Daniel sighed. “Because the bitch got greedy. She knew I wanted it, so she decided
    it was worth something. I don’t appreciate blackmail of any kind.”


    I replied, “Clearly. Is that why you killed her and pinned everything on her?”


    Smiling, Daniel said, “If I admitted that, then I’d have to kill both of you.”


    Pete nodded. “Fair enough. Give him the flash drive, Jules, and then he can be
    on his way.”


    I so wanted the chance to grill Daniel about the kickback scheme and to find out
    who killed Scott, but he seemed way too calm about the whole situation here. For
    this reason, I was going to assume he was a sociopath and not try to be a hero.
    I reached behind me and grabbed the flash drive, then held it out to him.


    “Take it and go,” I said.


    He gave me a mock wounded look, but didn’t move to take it from me. “Juliet, I
    thought we were friends, but I’m sensing that the moment I leave here, you’re
    going to call your cop buddies and tattle on me.”


    I shook my head and tried to muster a smile. “Tattle on what? The flash drive
    doesn’t belong to me, so as long as you keep quiet that I stole it in the first
    place, I’ll keep quiet that you coerced us at gunpoint to give it to you. Deal?”
    I tossed the flash drive across the floor, and it landed at his feet.


    Daniel kept his eye (and his gun) on us as he stooped down to pick up the drive.
    “That’s a decent offer, except you’re a smart girl who’s seen what’s on here.
    I’m afraid you know too much. Both of you know too much.” He regarded us for a
    moment, deep in thought. “Does this place have a walk-in freezer?”


    “No,” Pete lied—badly. His reply sounded more like a question than an answer.


    Grinning at him, Daniel said, “Oh, come on now. I bet that’s not true. Let’s go
    have a look in the kitchen. Bring the laptop.”


    Pete leaned toward me and muttered in my ear, “This guy’s nuts.”


    I got the laptop and followed Pete out of the room. Daniel kept himself far enough
    away that neither of us could have lunged at him without running the risk of getting
    shot. There was nothing we could do except follow his orders. However, once we
    got to the kitchen, we’d be on my turf. Plenty of things in there could be used
    as weapons.


    When we entered the kitchen, Daniel said, “What’s that? Looks like a walk-in freezer
    to me. Pete, you lied to me.” He pointed his gun straight at Pete’s chest.


    I screamed, “Daniel, don’t!”


    Daniel laughed. “You guys are so jumpy. Set that laptop and your phones on the
    counter here.”


    I had to keep him talking, because I could see where this was going. If he managed
    to trap us in that freezer and no one looked for us until morning, we’d be popsicles.
    I put the laptop on the counter, and did the same with my phone. Pale and sweating,
    Pete tossed his phone onto the counter. Pete had been through a lot in the last
    year and had toughened up, but he didn’t have much experience in dealing head-on
    with armed crazies.


    Daniel picked up Pete’s phone and studied it. It was a mess. The screen was shattered
    and had a nearly dime-sized hunk out of it. The back of it was all banged up and
    seemed to be held on with electrical tape. “Does this thing even work anymore?”


    “It makes calls. That’s about it.” Pete turned to me. “I dropped it on the sidewalk
    yesterday after my chat with Delaney. I was a little jittery.”'
