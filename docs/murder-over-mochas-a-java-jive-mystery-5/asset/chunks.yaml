    莱德和我走出了他的办公室，不得不穿过人群才呼吸到新鲜空气。


    莱德问：“你刚才为什么要揪着他不不放？”


    “我正试着让他招供收回扣的事。”


    他给了我一个困惑的眼神。“你把你的理论建立在他身上？那包包他在哪儿都能买到。” “不是的。在这一带买不到那种名牌包。那是博伯利。我不知道你有没有听说过，现在有一种叫作互联网的酷炫东西。你可以在世界上任何地方买东西，然后让他们寄给你。”
    我在上车时低吼了一道，“闭嘴。如果他是在网上买的，他为什么要撒谎是在商场买的？我在这件事上是对的。”


    莱德启动引擎，说道：“你的理论还是站不住脚。他是个医生，我确定他付得起，或者类似的钱。” “第一，他是一个小镇上的儿科医生，那里每个人都有保险。他的收入很可观，但还没到富得流油的地步，不够花几百美元买一个博伯利。“随你怎么说，朱丽特。”
    “我打算假装没听到那句话并继续下去。第三，我在曼迪家里看到了那个完全一模一样的包，还有好几个类似的。包是从她那儿来的。”他皱起眉。“你是怎么弄到曼迪工作用的那个包的？”
    噢，糟。当我告诉他我之前去利伯蒂（Liberty）的旅行时，我隐瞒了彼特和我闯入曼迪家的事实。我只是告诉莱德我和她通过过话。当我没回答时，他揉了揉山根，这说明我快耗尽了他的最后一点。“告诉我你没没她的她的东西。”
    我也没法说我没偷她的东西。“我没偷她的包。” “继续说。统统出来。” 当彼特和我去她家里时，我看了包内部。现在他紧紧锁着牙关。他不喜欢我含糊其辞。“你到底做了什么？”
    我叹了口气。“我们那个……我们自己溜进了她家。因为你知道的，我们手里有斯科特的提包，里面有房子钥匙。我找到了她的包并翻找了。”


    他猛地把车停在路边，我猜他是想把所有的怒火都发在我身上。“先是斯科特的包，然后是平板电脑，现在又是非法闯入和搜查别人的家？你到底在想什么？”他咆哮道。“我和彼特都是嫌疑人，我们需要证明自己的清白。“得了，朱丽特。作为一个私家探，你应该知道不要玩这种业余把戏。”我皱起眉。“嘿，你以前在调查中也用过创意手段。”
    “我们现在不是在说我。是在说你。你可能会因为这周干的蠢事被捕，现在也可能被捕。“总比因为一起我没犯的谋杀案被捕好。”他还在发气，但他承认道：“好吧，至少你没被抓。”关于这一点，我保持了沉默。


    # 第 18 章


    当我们到达下一个目的地时，莱德已经冷静下来，至少能和我进行文明的对话了。他准备下车，但我把手按在他的手臂上。“考虑到直接攻势对德沃医生（Dr. Devaux）效果并不好，你觉得我们能不能对格兰塔姆医生（Dr.
    Grantham）尝试不同的方法？” “你想怎么做？”他问。“嗯，格兰塔姆医生是个四十岁的离婚女性，正在寻找第四个丈夫。也许是时候祭出塞斯·戴斯（Seth
    Davis）和他的魅力了。我听说他很擅长赢得女性的心。” 那个目光又回来了。塞斯·戴斯是我们第一次见面时莱德最初给我的名字，因为他当时正在卧底工作。我最后我自己查出了他的真名，这无疑在我们本就火星烹油的关系中引起了波澜。每当我想在诚实问题上刺他时，往往会提起这件事。“塞斯·戴斯能从她那里得到汉密尔顿探员勋章给不了的东西？”我耸耸肩。“也许是一个直接的回答。我在想你可以假装一个医药代表，试图赢得她的好感。“用什么？我没什么可以送给她。“你完全可以给她一张晚宴邀请函，并不含蓄地暗示更多的关系。”他皱起眉。“我说过我会帮你调查，不是让你替团队背锅。而且，我觉得玛雅（Maya）不会喜欢我那样做。“我不是说你必须执行到底。告诉医生你是一个银杉林（Silver
    Spruce）的新代表就行。”

