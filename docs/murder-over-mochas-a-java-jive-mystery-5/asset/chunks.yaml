    # Chapter 1


    “You want me to go *where* with you?” I asked, arching one eyebrow and hoping
    I’d misheard over the din of chattering customers, sputtering espresso machines,
    and mellow jazz music inside the Java Jive Coffeehouse.


    “The gun and knife show,” Ryder repeated.


    Unfortunately, I hadn’t misheard. I wiped at a coffee stain on the counter between
    us while I tried to invent a polite excuse as to why I couldn’t go. Unable to
    come up with anything nice, I blurted out the only thing that came to mind. “Hard
    pass.”


    His face fell. “Why don’t you want to go with me?”


    I pretended to think. “Um…let me see…” I started ticking off the reasons on my
    fingers. “I hate guns. Knives aren’t much better. Oh, and I always have to do
    boy stuff with you, and you never do girl stuff with me.”


    His brow furrowed as he took a sip of his coffee. “Boy stuff?”


    “Yeah. You know—hiking, going to the gun range, going to the gym, watching sports.
    In all fairness, Maya should have to take some of those activities. I shouldn’t
    have to shoulder the boy stuff alone.” My closest girlfriend, Maya Huxley, was
    dating my ex-boyfriend-turned-friend, Ryder Hamilton.


    “Maya and I are at a point in our relationship where I still need to woo her a
    little. You, I don’t need to woo.”


    Didn’t I know it. I’d kind of fallen for Ryder again a few months back after he
    took a bullet trying to save my life. I’d been working really hard to put my feelings
    for him out of my mind, especially since he was dating my friend, who was also
    sort of my boss at my second job. My life had become quite the tangled web.


    “Still not fair.”


    He shrugged. “You have plenty of friends who’ll do girl stuff with you. Besides,
    my ‘boy stuff,’ as you call it, is good for you. Character building.”


    “How exactly does looking at a gazillion boring guns and knives build character?
    If I don’t feel the overwhelming urge to use one to off myself during the show,
    then I’m a better person for it?”


    His handsome face fighting a grin, he said, “Your brand of logic leaves something
    to be desired sometimes, Juliet.”


    I rolled my eyes at him and went to go grab a carafe so I could freshen his coffee.
    When I came back and began to top off his mug, a familiar voice saying, “Hey,
    Juliet,” startled me so much my hand jerked and splashed coffee all over the counter.
    I glanced up, just past Ryder’s shoulder, and when I laid eyes on the owner of
    that voice, my blood began to boil.


    “Scott,” I spat out between gritted teeth.


    In the time it took Ryder to say, “Hey, you okay?” I had already flown around
    the side of the counter. I headed straight for Scott, whose face was a picture
    of apprehension with a slight hint of terror, as well it should have been.


    He stammered, “J-Juliet, I know it’s sudden for me to—to show up here, but I need
    your help.”


    In my blind rage, I didn’t process a word he said. Instead, I came at him, shouting,
    “You son of a bitch!” Then I reeled my fist back and slammed it straight into
    his nose.


    Amid a chorus of gasps from my horrified staff and customers, Scott groaned in
    pain and covered his nose with his hands.


    “Whoa, whoa!” Ryder yelled, jumping off his stool and grabbing me around the waist
    just in time to keep me from lunging at Scott again.


    Struggling to get free, I cried, “Let me go! I’m not finished with him.”


    “Oh, yes you are,” Ryder replied, literally dragging me out of the room full of
    staring faces.


    I fought him all the way back to Java Jive’s office, where he finally released
    me but stood guard in front of the closed door. My whole body shaking with unbridled
    anger, I couldn’t do anything but glare at him.


    He was unfazed by my tantrum. “What the hell was that?” he asked calmly.


    “Scott,” I managed to choke out.


    His eyebrows shot up. “Your ex-fiancé, Scott?”


    I nodded, still breathing heavily.


    “The one who stole all your money and everything you owned and left you with a
    dying café, Scott?”


    “That’s the one.”


    His expression softening, he walked over and enveloped me in a hug. “Now I get
    why you went full Hulk on him. I probably would have done the same thing in your
    shoes.” He let me go but held my gaze with his intense blue eyes. “But I wouldn’t
    have assaulted him in front of a police officer and a room full of witnesses.
    Rookie mistake.”


    I smiled in spite of myself. “I’m hoping the police officer in question will cut
    me some slack, especially since he’s off duty.”


    Ryder had been “off duty” for a few months now as he recovered from a gunshot
    wound that had shattered the bone in his upper arm. Not one to sit around and
    do nothing while waiting for his doctor and the department to clear him and reinstate
    his full active status, he’d been keeping himself busy by helping Maya and me
    with our private investigation business. It had really broadened my investigative
    skills to work with an actual police detective.


    “Yeah, I can do that. But I think you should go talk to the guy.”'
