    \ I said quietly. “Mom told me a while ago that she heard he’d moved back.”\n\n\
    Liberty, Indiana, was my hometown, where I’d met Scott and started my café with\
    \ him. It was also where we were living when he left me. I hadn’t known where\
    \ he went when he disappeared, but I guessed after I left town he figured it was\
    \ safe to come back and resume his life there.\n\nI caught a whiff of Scott’s\
    \ cologne (which I didn’t love, but he was never without) as I went through his\
    \ things. It caught me off guard and triggered a memory of happier times with\
    \ him, bringing tears to my eyes. I couldn’t see clearly, so I stopped my search\
    \ for a moment.\n\nPete noticed and came over and put his arms around me. “Hey,\
    \ I get it. You hated the guy, but now he’s dead. If there’s anyone who understands\
    \ what you feel right now, it’s me. You know I’m here for you, day or night, like\
    \ you’ve been for me.”\n\nI sniffed. I hadn’t realized it before, but my current\
    \ situation was eerily similar to his. I’d watched Pete go through hell after\
    \ his girlfriend told him she was seeing someone else, they fought, and then she\
    \ was murdered before they resolved anything further. At least I’d had a year\
    \ to work out my resentment toward my ex.\n\nBefore I got too caught up in my\
    \ own feelings, I reminded myself we had a job to do. I could cry about this later\
    \ in the comfort of my own home. A seedy motel in a bad part of town was not the\
    \ place to break down. \n\nStraightening up, I wiped the back of my sleeve across\
    \ my eyes. “I’m good. I need to focus.”\n\nHe brushed my red hair away from my\
    \ face. “Right. But when it hits you full on, and it will, you know where to find\
    \ me.”\n\nI nodded and went back to looking through Scott’s suitcase. It was only\
    \ filled with his clothes—and hastily done, at that. Scott was normally an agonizingly\
    \ neat packer. This was the suitcase of someone who’d literally thrown his clothes\
    \ in and zipped it up.\n\nPete was checking out the bathroom, so I called, “This\
    \ suitcase is a mess. Very un-Scott-like. What if part of him coming here was\
    \ because he running away from something?”\n\nAppearing out of the bathroom, Pete\
    \ said, “Or someone. Like running for his life?”\n\n“Maybe.”\n\nPete knelt down\
    \ on the floor and pulled up the bedspread. “Bingo. Big bag wedged under the bed.”\
    \ He reached under the bed and gave a tug. “The bag under the bed always holds\
    \ the one clue they need in the movies.”\n\nMy stomach clenched as he hauled out\
    \ a duffel bag and set it on the bed. He unzipped it, opening it to find box after\
    \ box of prescription drugs packaged in fancy wrappers with the names of the drugs\
    \ and the drug companies splashed across the fronts. Digging deeper, he found\
    \ fancy printed flyers and promotional materials all touting the effectiveness\
    \ of the drugs, plus a handful of ballpoint pens with `SILVER SPRUCE PHARMACEUTICALS`\
    \ printed on them. Reaching into the zippered compartment on the side, he pulled\
    \ out a nametag and showed it to me.\n\nHe read, “ ‘Scott O’Malley, Pharmaceutical\
    \ Sales Representative, Silver Spruce Pharmaceuticals.’ Scotty was a drug dealer.”\n\
    \nI frowned. So he’d made the move from selling food to shilling prescription\
    \ drugs. He probably made double or triple what his old job paid, but it kind\
    \ of felt like he’d sold out. He’d always made a huge deal about how food was\
    \ his passion—that he believed it was “the backbone of humanity that brought us\
    \ all together.” I guessed that was all just more of his salesman shtick. Not\
    \ that it mattered that he’d changed careers, but it was yet another thing I would\
    \ never have expected out of him.\n\nMistakenly thinking that my frown was directed\
    \ at his joke, Pete added, “Seriously though, Jules, how does a drug rep get into\
    \ enough trouble to get his wife kidnapped? Most of these samples are for stuff\
    \ like `GERD` and `Parkinson’s` and diabetes. Not exactly the good drugs people\
    \ are looking for on the street.”\n\n“True, but you have to admit this motel is\
    \ the perfect place to set up your drug-selling operation. Maybe he’s already\
    \ sold the good stuff. Or maybe you can make a decent living selling `GERD` pills\
    \ on the black market. It’s not like we know a lot about the drug trade.”\n\n\
    “Fair point.” He sighed, running one hand through his dark spiky hair. “You know,\
    \ though, it’s possible we’re jumping to all kinds of conclusions here. Scott\
    \ was an asshole. There’s no denying that. What if he was in town for work and\
    \ decided to look you up and yank your chain a little for fun?”\n\n“Why after\
    \ a year?”\n\nHe shrugged. “The man had a screw loose. What if his wife simply\
    \ left him, and he was looking for some attention?”\n\n“So he showed up at `Java\
    \ Jive` and dropped dead?”\n\n“I didn’t say my theory was a good one, Jules. I\
    \ can’t put my finger on it, but there’s something about his story I’m not quite\
    \ buying.” He opened another zippered compartment on the side of the duffel, and\
    \ this time he found a `tablet computer`. \n```\nHe turned it on, but it was password\
    \ protected, just like Scott’s phone had been.\n```\n“Well, there’s another electronic\
    \ paperweight for our collection,” I muttered.\n\nPete thought for a moment. “How\
    \ about your neighbor Trevor? You think he could hack his way around the passwords\
    \ for the tablet and the phone?”\n\n“I’m really not supposed to have him hack\
    \ stuff anymore.”\n\n“Remember our discussion about you needing to be open to\
    \ breaking a few rules so we don’t get thrown in the pokey? This is one of those\
    \ times where that would be applicable.”\n\nI sighed. “Okay, I’ll ask him.”\n\n\
    “Let’s get out of here. I feel like I could contract a disease just from being\
    \ in this room.”\n\nI took photos of everything we found, whether I thought it\
    \ was important or not, and then we packed everything back up and put it back\
    \ exactly the way we’d found it—except for the `tablet`, which we essentially\
    \ stole. I didn’t like this old, rogue-Juliet approach I was taking toward this\
    \ investigation, but we didn’t have a lot to work with right now.\n\nWe exited\
    \ the room, and this time we got a bit of a different reaction from the motel\
    \ patrons, who clearly thought we’d rented room ten for a late-night tryst.\n\n\
    Amid the catcalls and whooping and hollering, there was of course the requisite\
    \ “Does the carpet match the drapes?” joke, an overused taunt to all redheads.\
    \ One of the prostitutes stepped in front of us and cooed at Pete, “You look like\
    \ you could afford more than a quickie, sugar. Did this bitch not get the job\
    \ done for you?” he couldn’t keep quiet.\n\n“Are you kidding? You think I have\
    \ to pay for it?” he scoffed. “This was an audition. A freebie, if you will.”\
    \ He leered down at me and slapped me on the butt. “Don’t worry, dollface. You’re\
    \ hired.”\n\nIt was all I could do to keep my expression impassive after that,\
    \ but I managed to clench my jaw hard enough to immobilize most of my face. One\
    \ of the larger men we’d walked past barked, “Yo, Destiny! You better not be stepping\
    \ out on me.”\n\nDestiny took a step back from Pete and said, “Of course not.\
    \ I—”\n\nApproaching us, the guy silenced her with one finger and lasered his\
    \ gaze in on Pete. “And *you* better not be trying to poach my property.” He moved\
    \ his jacket back to show a large, silver revolver.\n\nI didn’t know what offended\
    \ me more—the fact that he’d called another human being his “property” or that\
    \ he’d threatened to shoot someone for speaking to said property.\n"
