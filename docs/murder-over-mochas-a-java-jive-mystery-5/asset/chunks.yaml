    I chuckled, but otherwise kept my mouth shut as he drove us back to Dr. Richardson’s
    office.


    Still in a mood over the whole date thing, Ryder badged himself into an immediate
    meeting with Dr. Richardson, scaring the poor old receptionist lady half to death
    with his bad cop routine. In under a minute, we were in the doctor’s tiny office,
    both with a cold bottle of water in hand, courtesy of the jumpy receptionist.


    Dr. Richardson came in, all smiles, but somewhat guarded. “What can I help you
    with today? Marie said you’re with the police?”


    Ryder nodded. “We’re looking into Scott O’Malley’s death. He was a Silver—”


    The doctor frowned. “A Silver Spruce rep. I knew him. He stole some meds from
    my office. I probably should have filed a police report, but that weasel McKay
    begged me to let him deal with it internally. Now, of course, the man in question
    is dead, probably from an overdose of what he stole, so he’s been punished enough.”
    He shook his head. “You know, this kind of shady, unprofessional behavior is why
    I refuse to meet with Silver Spruce reps. I don’t have time for the nonsense.
    If they want to leave their drug samples, they have to leave them with my receptionist.
    They no longer get an audience with me.”


    I asked, “You’ve noticed Silver Spruce reps doing shady things other than the
    incident with Scott?”


    Dr. Richardson snorted in disgust. “Where should I start? A few of my fellow doctors
    in town seem to be overly impressed by the little extras Silver Spruce reps like
    to offer. I, for one, have more integrity than that.”


    Ryder said, “So you’re aware that other doctors are taking kickbacks.”


    “It’s painfully obvious with some of them. Like a certain doctor in this building
    who suddenly has a collection of expensive ties, any of which could cover the
    monthly payment for his POS car.”


    I murmured to Ryder, “Told you so.”


    Dr. Richardson went on, “Or the idiots who blatantly go out and get drunk with
    their reps on the weekends. There’s no such thing as a free drink.”


    “That’s true,” I replied. “When Scott came in your office that last time, how
    was he acting?”


    “I didn’t see him myself. Marie spoke with him. She said he was rude and belligerent.”


    Ryder asked, “How did he manage to steal some of your medicine?”


    The doctor sighed. “He insisted on using the restroom, which is next to our supply
    room. Marie, bless her elderly heart, let him back here, not that she could have
    stopped him if she’d wanted to. Later that day we noticed that the cabinet where
    I keep my medicine samples had been broken into. It didn’t take a genius to figure
    out who did it.”


    I nodded, hoping maybe Dr. Richardson could unravel the mystery of Scott’s behavior
    for us. “The sodium oxybate that went missing from your office wasn’t the only
    drug Scott had been accused of stealing. According to his manager, samples of
    levodopa, benzodiazepine, and H2 blockers have also gone missing lately from other
    drug reps’ bags. Would using any of those drugs make a person’s personality change
    to be especially agitated and angry, and maybe even delusional?”


    “Absolutely. The levodopa could easily do that. Those are fairly common side effects.”


    “Could an overdose of any of those drugs kill a person?”


    “Probably not the H2 blockers, but the others could. Mixing levodopa or benzodiazepine
    with sodium oxybate would practically ensure death. I have to be quite careful
    when dispensing sodium oxybate for my patients with sleep disorders to make sure
    there are no possible interactions with other meds they’re taking.”


    “Could someone ingest these drugs and not know it?”


    Dr. Richardson eyed me. “Are you asking me if someone could slip any of them into
    another person’s food or drink unnoticed?”


    “Yes.”


    “I suppose. They’re all available in liquid form, so I would think it would be
    quite simple.”


    I cast a glance at Ryder, who was already staring at me worriedly.


    Ryder turned to the doctor. “Thank you for your time, sir. Since your receptionist
    dealt with Scott, we’ll want to speak with her while we’re here.”


    “Of course. I’ll send her in.” Dr. Richardson disappeared out the door.


    Ryder said quietly, “I know you’re still holding out for a murder, but Scott could
    have easily done this to himself, not even realizing the potential consequences.”


    I whispered back, “Or his wife could have easily poisoned him.”


    “Why do it in Nashville?”


    “For the alibi. You drop dead at home, the police look at your wife. You drop
    dead somewhere else while your wife is supposedly a couple of hours away, wifey
    is no longer a suspect.”


    “Wifey may have been long gone by the time he died, but she was in town earlier
    that day on business. Not exactly the best alibi. Your theory is a bit convoluted.”


    “This whole case is convoluted. Besides, poisoning isn’t a crime of passion. It
    takes some pre-planning. Maybe she overthought it.”


    Marie came in, her orthopedic shoes squeaking as she shuffled across the floor.
    She cleared her throat. “Dr. Richardson said you wanted to see me?”


    Ryder must have realized he’d come on too strong earlier, so he gave her a big
    smile and softened his voice. “Yes, please have a seat, Marie.”


    She lowered herself into Dr. Richardson’s vacated chair and placed her trembling
    hands in her lap. I couldn’t decide if she was just old or freaked out.


    Ryder said, “Could you walk us through what happened when Scott O’Malley came
    to your office last week?”


    Marie cleared her throat again. “Yes, Officer…He came in and introduced himself
    rather brusquely. He’s not our normal Silver Spruce representative—that nice Jared
    fellow is. This new boy was gruff with me, insisting to speak with the doctor.”
    She held her head up proudly. “But I wouldn’t let him. Dr. Richardson doesn’t
    like interruptions, and he has made it clear that he no longer wants to meet with
    anyone from Silver Spruce Pharmaceuticals.” She shrugged. “He didn’t tell me why.
    I don’t know why he wouldn’t want to meet with Jared. He’s such a sweet boy.”


    Hmm. I had a feeling her old lady crush on Jared rivaled the one Gertie had on
    Ryder. She was veering off topic, so I said, “And what did Scott say after you
    told him he couldn’t see the doctor?”


    “Oh, then he began pacing the waiting room, muttering to himself. Then all of
    a sudden, he began begging to use our restroom. I often have bouts of incontinence,
    so I’m sympathetic to people who have an uncontrollable urge to go.”


    I flicked my gaze at Ryder, and sure enough, he seemed appalled at Marie’s oversharing.


    She continued, “I let him go on back, although now I realize he was pulling the
    wool over my old eyes in order to gain access to our supply room where we keep
    our drug samples.”


    I asked, “When did you notice the cabinet had been broken into and the samples
    were missing?”


    Looking away, she replied, “Later that afternoon.”


    Ryder shifted in his seat. “Were you the one who noticed it?”


    Toying with a shiny gold bracelet barely peeking out under her cardigan sweater
    sleeve, she cleared her throat again. “Yes.”


    A thought was forming in my head, so I went with it. “About Jared—he still comes
    around to your office even though he knows he has no chance to speak with Dr.
    Richardson?” I asked.'
