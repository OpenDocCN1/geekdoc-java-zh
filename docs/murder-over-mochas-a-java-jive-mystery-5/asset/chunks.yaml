  raw: 'After I had to nearly physically drag Pete out of bed, we finally made it
    to Java Jive not too late. The morning shift uni who had brought us here stood
    guard in the front of the house, since Ryder wasn’t scheduled to arrive until
    a little later.


    As I was trying to concentrate on cutting the butter into my dry scone ingredients,
    Pete was busy smooching my neck. “Not that I mind this while we’re alone, but
    sooner or later our staff is going to start arriving. Are we ready to make our
    new…situation public?”


    Between kisses, he said, “Well, if anyone asks who put that smile on your face
    today, I’m not opposed to you telling them the truth.”


    “Okay.” I turned around so we were face-to-face. “But get this out of your system
    now, because it’s not fair for us to make out in here if I don’t let the employees
    do it.”


    He kissed me thoroughly, leaving me breathless. “There you go. Out of my system.
    Now if I don’t pry myself away from you, it’s going to get back into my system
    real fast.”


    “Then go to the office and do some accounting or something.”


    “Ah yes, accounting. The age-old boner killer.”


    —


    When we opened and Gertie came in, Pete was still in the office, so I sent Rhonda
    back to get him.


    As I poured her coffee, Gertie said, “You’re particularly rosy-cheeked this morning.
    Does this mean you and my grandson went out on a date last night?”


    Gertie always wanted the scoop on who I was dating, and she was never shy about
    asking prying questions about my sex life I didn’t want to answer. I hoped she
    didn’t get too personal, considering this was her *grandson* we were talking about.


    “Yes, we did.” Normally, I wouldn’t have considered the impromptu trip to Big
    Shotz a date, but if you counted the hotel and all the sex, I thought it more
    than qualified.


    I smiled at Pete as he sat down next to her and gave her a kiss on the cheek.
    He gave me a shy smile back.


    Eyeing the exchange between the two of us, she asked, “And? Did you finally admit
    that you love each other?”


    Not taking our eyes off each other, we answered, “Yes.”


    “Hells bells. It’s about time. You could make the record books for longest foreplay.”


    And there it was.


    Feeling my face flame up, I looked away.


    Pete groaned. “Aw, come on, Gert.”


    She laughed and took one of our hands in each of her own. “Oh, don’t get your
    panties in a bunch. All I’m trying to say is I’m happy for you two.”


    The line at the cash register was beginning to lengthen, so I left them to help
    Camille make the coffee orders. While I was away from Pete and Gertie, I saw them
    speaking with their heads together. At one point she wiped a tear from her eye
    and beamed at him. Gertie was thrilled that Pete and I had got together. She’d
    been encouraging us forever and had treated me like a part of her family from
    the first moment I’d met her. They both glanced my way, so I pretended not to
    have been openly watching them. I flicked my eyes back over and noticed her covertly
    press something into his hand, which he put in his pocket. Those two were up to
    something, but I wasn’t going to poke my nose into it. I’d done enough investigating
    lately to last me awhile.


    Gertie and Pete waved at me and left, and a few minutes later Ryder came in and
    took a stool at the counter. We’d managed to get the customer line manageable
    again, so I went over and poured him a cup of coffee.


    “I take it you’re going to park here all day? Sounds kind of boring, if you ask
    me,” I said.


    He grinned. “I’ve got hot coffee, good food, and marginally decent company. It’s
    much better than sitting in a sweltering vehicle doing surveillance or being chained
    to a desk.”


    “I suppose you have a point there. Any word on Jared Fisher’s whereabouts?”


    Taking a sip of coffee, he shook his head. “Not yet. You trying to get rid of
    me already?”


    “Never. But I wouldn’t mind getting back to my normal life.”


    “Nothing about your life is normal.”


    I wrinkled my nose. “Does *everyone* think that?”


    He eyed me for a moment. “I didn’t have a chance to ask you this last night, but
    I noticed it looked like you’d been packing up your apartment. Going somewhere?”


    It was an odd feeling, but I’d finally got to the place where I’d moved on where
    Ryder was concerned. Before, it had always felt wrong to talk about Pete with
    him. Not anymore.


    “I’m moving in with Pete.”


    He nodded. “Good for you guys.” Judging by his sincere reaction, I thought he
    seemed to have moved on, too.


    “Thanks.” I took a breath as I readied myself to break the news about the tour.
    “Also, I’m going on tour with the Maguire Girls.”


    Ryder’s jaw dropped. “Are you serious? That’s fantastic. Congratulations.” He
    reached across the counter and gave me a hug. “When? Where? Tell me all about
    it.”


    —


    Once I filled him in on all the details I knew, I got back to work. But after
    a few hours, I was beginning to get fidgety. It had been over fifteen hours since
    the break-in at my apartment. In my mind, the cops had had a ton of time to locate
    Jared Fisher, but we hadn’t heard a peep. I walked over to where Ryder was sitting
    on the couch and flung myself down next to him.


    “Any word?”


    “Since the last time you asked ten minutes ago? No,” he replied, not glancing
    up from the magazine he was perusing.


    “Besides being frustrating and dragging out forever, this case is…*sad*. Usually
    our cases end with a bang, and you feel justified in having brought down a killer.
    This time it’s just depressing.”


    He gave me a sidelong glance. “What, someone has to get shot for it to feel like
    a victory to you?”


    I rolled my eyes. “That is *so* not what I said. I mean, Scott’s dead. Mandi’s
    dead. Jared has three kids who are going to grow up without a dad around. Nobody
    wins here.”


    “As opposed to other murder cases where there’s a clear winner.”


    “You know, I came over here to talk to a friend. If I wanted to get hassled, I’d
    work the cash register.”


    He nudged my knee with his. “Oh, lighten up. You’re feeling like a caged animal—I
    get it. Have a little patience.”


    “Have you met me?”


    Chuckling, he replied, “I know. ‘Patience’ is not your middle name.”


    Pete didn’t get to come in for lunch, since he was trying to make up some time
    for having left work early the previous day. Not getting to see him only made
    me more unsettled, and not being allowed to even step foot outside for some fresh
    air was getting to me as well. I settled for pacing in the office while Ryder
    sat at the desk and ate his lunch.


    “Juliet, do you think you could give it a rest for a few minutes?” he asked, clearly
    irritated by the angst I was no doubt radiating into the air.


    I stopped and made an apologetic face. “I’m sorry. I’m helpless, and I hate that
    feeling. Can’t you use me as bait or something? Maybe that would speed things
    up. I could stand on the sidewalk and wave my arms. Surely if Jared’s watching,
    he’d see me and come after me. Then you could nab him.”


    Ryder stared at me. “That is the dumbest thing I’ve ever heard you say.”


    “Well, that’s because I’m being slowly driven nuts.”


    He sighed. “Do something to take your mind off it. Take a nap. Watch a movie on
    your laptop. Day drink. Hell, do some actual work around here. Find something
    that will keep you occupied, or you’ll drive us both crazy.”


    I frowned at him and stalked across the hall to the kitchen, where I took out
    my aggression by chopping up some unsuspecting vegetables.


    The rest of the afternoon was excruciatingly long, but I did my best not to let
    it get to me or complain about it to Ryder. But once Pete walked into the office
    after he got off work, I ran to him and jumped into his arms, tears springing
    to my eyes.


    Ryder got up from his seat on the couch. “I’ll give you two some alone time.”


    Once the door clicked shut, Pete pulled back so he could look at me. Brushing
    my tears away, he said, “What’s the matter, Jules? Did something happen?”


    I sniffed, feeling foolish. “No. I’m freaked out, that’s all. I can’t handle the
    waiting and not knowing.”'
