  trans: '

    他的声音变软了。“嘿，你会搞定的，朱莉丝。我知道你可以的。”


    “谢谢。我希望我像你这么自信。”


    “我真希望我们现在是在约会。”


    我笑了笑。“我也是。”


    “觉得你明天还会回来吗？”


    “我最好回来。我`so`受够了这一切。”


    我妈妈从门后探出头来，叫道：“饭好了。”


    皮特听到了她。“噢，我真嫉妒。你妈妈的厨艺是最棒。”


    “抱歉。下次我带你一起去。”


    “你最好这样。我今晚给你打电话。”


    “拜拜，皮特。”


    我挂了电话走进厨房。那里弥漫着天堂般的香味。皮特说得没错——我妈妈的厨艺是最棒。


    她给了我一个懂的眨眼。“我知道你刚才在和皮特聊天。”


    “爸爸告诉你了？”


    “嗯，是。但你脸上的笑容证实了这一点。你们两个什么时候才能意识到你们是一天一对的？”


    我叹了口气。“我觉得我们快要了。”


    “噢！”她叫道，将我搂入怀中。


    “现在，妈妈，别开始计划婚礼或之类的。”


    她放开了我并嗤之以鼻。“婚礼？谁在乎婚礼啊？我想要些孙子。”


    “你知道我对此的立场，妈妈。哼。你总有一天会有这种冲动的，小姑娘。”


    在和父母吃了一顿意外地放松的晚餐后——可能是因为没有人提到那个调查的事——莱德和我来到 `Vecchio’s` 去见他的约会对象。


    “那么。你紧张吗？”我问。


    他给了我一个困惑的眼神。“我为什么要紧张？这是你的第一次约会。你应该紧张才对。”


    闭嘴吧，朱莉，”他低吼道。


    我笑了。“随你怎么说，塞斯。”


    他在 `Vecchio’s` 的停车场停下，在准备好耳机时神情严肃地转向我。“如果事情进展得太分，我就收手。”


    定义一下‘太分’。过度的暗示？不恰当的摸？”


    “我可不是在开玩笑。你想要一个安全暗号，让我知道什么时候该冲进去救你？”


    因为这句话，我被狠狠瞪了一眼。


    “噢，轻松点。如果我们不为我们不得不做的一些事大笑一场，我要哭了。”


    莱德的表情柔和了。“我会尽力而为，好吗？感谢你当鱼饵。现在去忙吧，老虎。”


    我们检查了设备，我开始走向餐厅。过了一会儿，我听到他对格坦姆医生说：“你今晚真美。”


    我发出了一个作呕声，对着麦克风嘲讽道：“加油，塞斯可以比这更好。”


    格坦姆医生问他：“今晚喝点什么？给我来啤酒，谢谢。”


    听到了一阵挪动声，莱德正坐在座位上。我听到格坦姆在点餐。“你是自由市的新来的吗？如果是在这我应该记得你，”她轻声说道。


    “刚搬过来。我以前住在纳什尔。我爱死纳什尔了。我想和当地人逛逛。你应该找机会带我去一次。”


    我对着麦克风说：“哇。她一点都不害。”


    莱德对医生说：“听起来是个好计划。那么，我听说你只偏好 Silver Spruce。作为一名患者经常使用我们产品的医生，你预期我们的代表提供什么样的服务和协助？我能做什么来更好地服务你？”


    格坦姆回答道：“我们别谈工作了。我想了解你。”


    他笑了。“嗯，如果我们不聊点业务，我就没法把酒钱报在公司信用卡上。”


    “噢，既然这样，那快点把业务谈完吧。嗯。你能做什么来服务我？你可以对你们的一些产品提供一些实操培训。”


    莱德没有停顿。“实操培训是我的专长。”


    她发出一阵大笑。“别的呢？”他问。


    “我喜欢亮晶晶的东西。”


    “收到了。还有其他要求吗？”


    “设计师品牌。明白。说正经的……而且这有点敏感——我们的一位前代表，斯科特·奥马利，和镇上的另一位医生闹了矛盾。你和他有过接触吗？我被指派去查这件事，以确保我们这里的声誉没有被损害得太严重。”


    不错。他可不是白当侦探的。


    格坦姆回答道：“是的，实际上有。他——我的意思是，他`曾`是个糟糕的小人。上周早些时候他来到我的办公室，愤怒又好斗。特莎试图让他离开，但他推开她，在我正在看病人时闯进了诊疗室。”


    莱德叹了口气。“那太糟糕了。我代表公司向你道歉。他对你说了什么？”


    她停顿了一下。“等等。你不是已经知道了吗？”


    噢，她在拆穿他。但他应对得很自然。“我听过 Silver Spruce 传出来的版本，但我更想直接从你口中听到。请不要漏掉任何细节。”


    “噢。行吧吧。”这个男人很擅长工作。


    格坦姆继续道：“起初他说话没什么逻辑，但他成功传达了观点。我接触的两个 Silver Spruce 代表都非常大方且周到——当然，是以很安静的方式。我以为斯科特会意识到那的，尤其是其中一个还是他的妻子，但他一直说类似之的话，比如‘我知道你们在收回扣，如果你不交钱，我就把它公开。’他说如果我不在周一之前不给他五千美元，他就会给《编年史》寄送我受贿的照片。我不能接受那种负面报道。那会毁掉我的诊疗的。我得搬到那里去。”

