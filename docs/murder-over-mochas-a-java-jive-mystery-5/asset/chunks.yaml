    我们共用一份甜点一直等到打烊时间，然后皮特开车送我回家。他坚持要帮我把吉他提上公寓。我猜他是不想让这个夜晚就这样结束。我知道我也是。


    当我们到达我家门口时，他拉起我的手。“我不认为你的演出可以比这更完美了。”


    “是*我们的*演出。我同意。它太完美了。今晚非常完美。”我抬头微笑看着他。他那深邃的棕色眼睛让我的心一阵颤动。


    他把我的吉他靠在门上，正准备去牵我的另一只手，但当吉他的重量推开我的门时，他突然停住了。“搞什么鬼？”他盯着我的公寓说道。


    我向里看去，心里那股暖暖的感觉瞬间化为冰霜。我的公寓一片狼藉。


    # 第 12 章


    我们走进屋，我不得不忍住抽泣。客厅和厨房里的每一个抽屉和柜子都是开着的，里面的东西洒了一地，散落在地上。似乎没有被弄坏，但有人花了很长时间把这里搞得一团糟，这需要我花很多时间来清理。


    皮特把手臂揽住我的肩膀。“我们需要报警。你被抢劫了。”


    胃里感到一阵恶心，我回答道：“我们先到处看看。”


    我冲进卧室，皮特紧随其后。我的抽屉和衣柜都是开着的，看起来这里也像是发生过爆炸一样。然而，我的珠宝依然完好无损地摆在梳妆台上，就像我的电视还留在客厅一样。这根本不是抢劫。


    我瘫坐在床上，陷入了沉思。


    皮特坐在我身边。“我现在可以报警了吗？”


    我摇了摇头。“不需要。我不想起诉。”


    他惊讶得掉下巴，回答道：“你为什么这么说？你甚至不知道是谁干的。”


    “我很确定我知道。”


    “怎么知道？”


    我转向他。“你觉得在过去的几个小时里，我做了什么可能引起报复的事吗？”


    “没有。”他的眼睛睁圆了。“噢……也是。”


    “没错。如果我们去挨户敲门，你觉得我的哪位邻居不在家里？”


    “那个乱你公寓的家伙。”


    “Bingo。”


    “你可真会挑人，朱莉。”


    我沉重地叹了口气。


    皮特把手放在我的肩膀上捏了捏。“拿个过夜包。今晚你住我这儿。”


    “皮特，我在这里没事的。这不过是个幼稚的恶作剧。”


    他摇摇头站了起来。“没商量的余地。开始收拾。”他弯腰从地板上捡起一条蕾丝特别多的内裤，然后像弹橡皮筋一样朝我甩了过去。“我帮你。”


    尽管在这种情况下，我还是笑了起来。“好吧，我让你展示一下你那硬汉保护者的风范。但仅限今晚，而且主要是因为这地方变成这样，我根本睡不着。”


    “别忘了，你的门框被那个抛弃的小情人强行闯入撞坏了，这让你留在这里没有任何安全可言。有人可能会在你睡觉时杀了你。”


    “这真是个愉快的想法，”我抱怨着，一边把衣服和洗漱用品塞进包里。


    ——


    当我跟着皮特开车去到他家时，我再次尝试理清发生发生的一切。我不认为性格温和的库珀是个报复心强的前任，但还有谁会费尽心思弄乱我的公寓，却又表现出某种程度，不去破坏房屋或抢劫我的东西呢？


    当我们到达皮特的家时，我进屋倒在沙发上，双手抱头。在演出的忙碌与兴奋，以及看到公寓后的那种剧烈落差之间，我感到精疲力竭，头疼得厉害。


    “朱莉，”皮特说道。


    我抬头发现他正坐在咖啡桌上，面对着我。“嗯？”


    “如果听我的，你再也不用回到那个破公寓里了。永久地搬到我这儿住。今晚。”


    我呻吟道。“皮特，我真的没精力讨论这个。而且这根本没意义，因为你的客房里塞满了杂物，完全可以上《收纳大作战》（*Hoarders*）节目。”


    他拉住我的手，将我拉了起来。“我有东西给你看。”他带我穿过走廊，打开客房的门。里面空空如也。


    走进房间时，我惊讶得掉了下巴。“绝不可能。你什么时候有时间做这个？”


    他耸了耸肩。“我已经在清理一段时间了。”


    “我完全收回刚才关于《收纳大作战》的评价。这太棒了。”


    皮特走过来再次握住我的手。“我觉得是时候丢掉一些东西，为更重要的东西留出空间了。”


    哇。这听起来相当严肃。他以前从未这样提过让我搬进来。起初整个情况就吓死我够了，这也是为什么每次当他提到这件事时，我都会避开。住在同一栋房子里太有诱人了，更不用说方便，可以直接跨越朋友区让关系更上一层楼。那之后呢？我们之间会变得尴尬吗？尽管他从未表现得像那样，但他毕竟是我的老板，这让情况变得更加复杂。

