  trans: '

    他低笑着看着我。“我理解。一想到你可能处于危险之中，我今天很难集中注意力。我的意思是，我信任赖德，但这一整天都在折磨着我的神经。”


    “如果这能让你感觉好受点，我今天唯一的危险就是我的大脑快要疯了。”我抱了住他。“但现在你在这了，我感觉好多了。”


    他吻了吻我的头顶。“我很乐意提供帮助。”


    等我平复了心情，我们走到屋前。玛雅也过来了，所以我们四个人一起吃了晚饭。期间没有提到那个案子，对此我很感激。他们确实非常出色地让我忘记了烦恼，直到赖德的手机响了，他皱了皱眉，然后猛身跳起来走去接电话了。


    注意到我惊恐的表情，玛雅说：“可能是好消息。”


    皮特把手放在我的背上，画着圈子揉了揉。“是的。打起精神来。”


    赖德回到桌边，面无表情。但紧接着他露出了灿烂的笑容。“杰里德·菲舍尔被拘留了。”


    我长舒了一口气，皮特俯身抱了抱我。赖德拍了拍我的肩膀，坐了回去。


    皮特问道：“所以`now` 现在结束了吗？”


    赖德说：“结束了。杰里德·菲舍尔在德克萨斯州的埃尔帕索加油时用了他的信用卡，可能是开了那么久的车后没怎么过。当交易记录跳出来时，当地的警局通知了当地警察，他们找到了他并抓了他。大功告成。”


    玛雅吹了口口子。“到那个时候他可能已经疯了。埃尔帕索从这里开车过去要近二十小时。你说他有三个孩子？”


    我点了点头。


    “在车里困那么久，还带着三个小鬼，换做谁都会疯的。”


    赖德对我说：“现在我们的杀手被抓获了，你觉得‘理所应当’了吗？还是说你仍然为没能亲历行动现场感到懊闷？”


    我在桌子下捏了捏皮特的手。“不，我很好。这次我有更有趣要做。”


    ***


    在赖德和玛雅离开后，地方空旷了很多，所以皮特和我决定让剩下的员工早点回家。就像老样子一样，我们守在柜台后，一边工作一边保持着聊天。当最后一个客户在闭店前几分钟离开时，我接到了布莱克·摩根的电话。


    我拿起：“嘿，布莱克。听好消息了吗？”


    “我听说杰里德·菲舍尔被拘留了，”他的声音听起来很紧张。“但这不是我打来的原因。我有……关于你的新信息。你有空通话吗？”


    担忧再次袭上心头，我说：“等一下。”


    皮特问：“怎么了，朱莉？”


    我回答道：“是布莱克·摩根。”我把手机开了免提，对布莱克说：“好的。皮特·本内特和我都在。”


    布莱克回答道：“嘿，伙计们。我打电话是因为我刚收到了菲舍尔的语音邮件。或者说，我刚才注意到。我带妻子出去吃饭看电影，手机关了几个小时。声音有些模糊，但我让你们听听。”


    信号不是很好，但我们还是能听出杰里德的声音听起来有多疯狂。“布莱克，你得帮帮我。我没做。我没杀曼迪……或者还有斯科特。我不想……我不想再有人受伤了，所以……你能不能找到那个调查员……朱莉特·兰格利……并警告她他正去找她吗？她手里有他想要的东西，在得到它之前他不会停止的。”他停顿了一下，背景中响起了警报声。“该死。我得走了。”


    信息结束后，布莱克说：“我试着回拨那个号码，但那是德克萨斯州埃尔帕索的一个公共电话。如果你不介意我问的话，你手里有什么东西是别人想要的？”


    我给了皮特一个不安的眼神，耸了耸肩。“我老实完全不知道。”


    布莱克回答道：“嗯，听起来你最好搞清楚。在此期间，你可能想从你那个警察朋友那里要一些保护。”


    “我们会的。谢谢告诉我们。”挂掉电话后，我转向皮特。“那太诡异了。”


    “开玩笑的。但也很可怕。也许我们应该锁好门回家休息了。报警一下可能也没坏处。”


    我点了点头，陷入了沉思。“我有‘他’想要的东西？‘他’是谁？我到底可能有什么东西？”


    “你有斯科特的平板电脑。”


    “不再有了。我把它交给利伯蒂警方了。”


    皮特皱了皱眉。“你觉得这个神秘的‘他’是翻你公寓的人，而不是杰里德？”


    “可能吧。但除了平板电脑和没人知道我们有的斯科特的公文包，我从未持有过任何与案子相关的东西。在调查期间，我们和人交流并收集了信息，但除了在斯科特的酒店房间拍了几张照片，我们没有收集任何实证。”


    皮特的眼睛睁大了。“没错，但你确实从利伯蒂家里带了东西回来。”


    “哈？”


    “从斯科特家里——怀表和音乐盒。”


    “但那是我的东西。那个神秘的‘他’为什么要我的旧东西？”


    皮特神色怀疑，朝办公室走走去。我跟在他后面，不知道他的意图。他捡起了桌子上的吉他形状的音乐盒。

