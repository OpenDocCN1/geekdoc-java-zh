    She couldn’t have.


    Unless…I remembered Pete finding a sack of snacks and drinks in Scott’s hotel
    room. Mandi could have snuck into his room while he was out—possibly when he was
    at Java Jive getting punched in the nose by me—and put the poison or drugs in
