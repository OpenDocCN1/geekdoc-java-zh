    # 到达

    回到公寓后，我才发现今天发生的一切让我是多么疲惫。但在我还没来得及进卧室换睡衣，门外就响起了敲门声。我立刻以为是库珀，他可能通过小道消息或新闻听说了 `Java
    Jive` 发生的事情，我不禁缩了缩脖。我没精力说话——或者说，没精力做任何其他事情。也许如果我不开门，他就会离开。我静静地躲在卧室里，结果手机在口袋里开始响起来并震动时，我吓得魂飞魄散。


    “嘿，皮特，”我打了个招呼。无论我心情如何，我从不介意和皮特聊天。


    “开门。”


    “好吧……”


    我挂了电话冲向门口，心里纳闷到底是什么样的力量驱使他在半夜开车来这里。


    他站在我门口，手里拿着 `Scott’s satchel`。“我……额……在……你知道的之前，我没机会把斯考的男士包还给他……”


    我叹了口气。“行。我想我们应该——”


    皮特闯进了我的公寓。“这里有些东西你需要看看。”


    我跟着他进入厨房，他小心翼翼地把包放在我的台上并打开盖子。“你翻过他的包？”


    他给了我一个羞愧的眼神。“我有理由，好吗？我拿走他的男士包是因为我潜意识里担心他会回来为了你早之前打他一拳的事报复。我觉得我有责任确保他不会在我房子正中间掏出什么武器……更糟，试图用它对付你。”


    我不禁脸上露出了微笑。“谢谢你照顾我。”


    “而且我是对的，”他继续说道，从包里掏出一把手枪。


    我惊恐地向后跳了一下，大道：“把那东西放下！它可能上膛了。”


    他给我看了枪的枪托，那里没有弹匣。“冷静点，朱尔。我拆掉了弹匣并清空了膛室。”


    盯着那把枪，我说：“斯考一定觉得他遇到大麻烦了。我从来不知道他随带枪。。我觉得在我们在一起期间他可能根本没有枪。”我停下来摇了摇头。“等等。你是怎么弄到 `Scott’s
    man bag` 的？我们离开时你没带它去车站，而且 `Java Jive` 在犯罪现场小组完成工作之前处于封锁状态，所以你没法回去拿。”


    “你知道在斯考……额……离开后，我去给你拿水之后？”


    “记得。”


    皮特耸了耸肩。“管这叫直觉还是既视感吧——我知道这事会演变成一个大乱子——事实也如此——所以我把包藏在后门附近的灌木丛里。我想让你在警察拿到它之前能翻看一下。而且我不想在
    `Ryder Likeapony` 面前告诉你这件事。我知道他据说站在我们这一边，但他毕竟是个警察。”


    我被他为我承担的风险而深受感动。“谢谢你，皮特。”


    与此同时，我也担心他制造了麻烦。警察会寻找斯考的个人物品，比如他的钥匙、手机和钱包。当他们从他的口袋、车辆或死亡现场没有找到这些东西时，他们开始提问只是时间问题。当然，皮特和我将是他们要问的第一个人。


    但目前，我们占据了主动。也许吧。这取决于 `Scott’s man bag` 里有没有有用的东西。我打开包，把里面的东西倒在厨房台上。正如我所料的那样，我们找到了他的钱包、钥匙、手机、零钱和唇膏。还有几张皱皱的收据、一把老式的旅馆钥匙和一些空糖果包装纸。


    “手机有密码保护，所以完全没用。”皮特拿起旅馆钥匙，向我晃了晃。“这我最感兴趣。斯考说他遇到麻烦了。你说我们要不要去他的旅馆房间里翻翻，看看还能发现什么？他住在
    `Franklin Motel`。这会就像以前一样。”


    我不安地笑了笑。我跟皮特第一次调查谋杀案时（另一次我是嫌疑人），它带我们去了 `Franklin Motel`。那是城市偏僻地区一个破烂得不堪的地方，我们在那里有过一次相当危险的经历。我不知道自己是否还能再来一次，尤其是今晚。没错，我在我的第二份工作中跟踪可疑人物，但我从未向警察隐瞒证据，也进行过任何形式的闯入。


    当我没有回应时，皮特把手臂搭在我的肩膀上。“我知道你是一个不再破坏规矩的高级私侦探，但这事挺严肃的。我觉得我们需要不惜一切洗清我们两个人的清白。我宁愿因为我犯下的
    `B and E` 受到轻罚，也不愿为了我没犯的谋杀案和一个叫 `Tiny` 的狱友关几十年。”


    我举起双手。“好了，好了。我明白你的意思了。走吧。”


    ---


    # 调查

    在路上，我向皮特交代了我和斯考剩下的对话内容。


    ## Franklin 旅馆

    我跟皮特第一次调查谋杀案时（另一次我是嫌疑人），它带我们去了 `Franklin Motel`。那是城市偏僻地区一个破烂得不堪的地方，我们在那里有过一次相当危险的经历。我不知道自己是否还能再来一次，尤其是今晚。没错，我在我的第二份工作中跟踪可疑人物，但我从未向警察隐瞒证据，也进行过任何形式的闯入。


