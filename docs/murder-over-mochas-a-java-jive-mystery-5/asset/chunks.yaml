    Pete cut in on her with a charming smile. “I would love to hear that story sometime,
    Bethany, but we’re in a real time crunch. We’ve got lots of…technical PI stuff
    to do and very little time to do it. Could we ask you a few questions? We think
    you may be able to help us out a lot.”


    Bethany was practically purring from his attention. “Sure. Ask me *anything*.”


    Pete cleared his throat and gave me a pleading glance.


    I said, “How much contact have you had with Scott lately? Did you notice a difference
    in his behavior around three months ago?”


    Scooting even closer to Pete, she said, “Yes, and even before that, I noticed
    a big change in him. I mean, you knew him well, too, right? The old Scott wasn’t
    into fancy cars and expensive suits. After he screwed you over, it was like he
    was a totally different guy when he moved back to town with that bitch Mandi.
    I *hate* her, by the way.”


    I nodded. “She’s not easy to like.”


    “Anyway, they both got these important jobs as drug reps and decided the rest
    of us were peons. He kept a few of his old friends, but not many. He drifted away
    from the family. I’m sure it was all Mandi’s doing, but still.” She leaned in,
    a sure sign she was about to spill a secret. “Then out of the blue he came to
    my parents for money a few months ago. Can you believe the nerve of that guy?
    He parades around flashing his new cars and toys, then suddenly he’s broke? Whatever.
    My parents said no, of course.”


    “So do you know if he managed to talk anyone else into giving him money?”


    She shook her head. “Not that I’d heard. The whole family said no to him. But
    then I guess everything worked itself out, because Mandi got a big promotion at
    work, and they went back to acting like rich snobs.”


    Interesting. Mandi got a promotion at work—but Scott didn’t—and then Scott got
    fired a few months later.


    “What about lately? How was Scott acting the last couple of weeks?”


    “Not a clue. Haven’t heard a word from him. I tried to text him a few times to
    invite him to my mom’s fiftieth birthday party, but he never responded.”


    Pete asked, “Did you hear about him losing his job last week?”


    Bethany turned her full attention onto Pete, almost as if she’d momentarily forgotten
    he was there. “Oh, no, Pete. I hadn’t. Bummer to get fired and die all in one
    week, right? Worst week *ever*.”


    I had to cover my smile at Pete’s stunned reaction to Bethany’s blunt comment.
    I cleared my throat. “One more question—have you ever known Scott to use drugs?”


    Now it was Bethany’s turn to be stunned. “No way. Not Scott. I’m surprised you
    even would think that, given how well you knew him.”


    Pete said, “She knew the old Scott. How about the new and unimproved Scott?”


    She thought for a moment, then shrugged. “Well…maybe. But I don’t have any proof.
    You might talk to Paul Jackson, though. He told me they’d hung out lately, and
    that he thought Scott seemed a little off.”


    Paul Jackson was one of Scott’s oldest friends in Liberty. I nodded. “Paul’s already
    on our list to speak to today, but thanks for the heads-up.” I stood, ready to
    move on to our next interview. “I hate to rush off, but we’re pressed for time.”


    Pouting, Bethany stood as well. “Hey, you never told me why you were investigating
    Scott in the first place.”


    Pete put his hand on her shoulder. “I’m afraid that’s confidential PI information.”


    Bethany practically swooned. “Oh, how exciting!”


    I headed for the door, in serious danger of chuckling aloud. Bethany never met
    an attractive man she didn’t immediately start crushing on. Pete managed to slip
    around her before she could trap him in a hug, and hustled out the open door ahead
    of me.'
