  trans: '

    文件名是“回扣与混蛋.xlsx”。极有条理斯考特做了功课，把所有内容都放在了一个漂亮、整洁的电子表格里。A 列是购买日期列表。B 列是物品列表。C 列是每件物品的价格。而
    D 列（显然是“混蛋”列）显示了是哪位银杉（Silver Spruce）的员工订购了物品。


    “这份清单列出了我们在曼迪工作包里发现的回扣回品——领带、袖扣、围巾和耳环。还有餐厅和酒吧的收据——每张都有几百美元。酒店、机票、钓鱼巡游。”我停顿了一下，意识到皮特的判断得比我想象的要准得多。“还有医疗类的物品——除颤器器、心率监护仪、X
    光机、秤、检查床……甚至电脑。所有这些都是丹尼尔购买的。”


    剩下的缩略图看起来像截图，所以我点击了每一个。它们都是斯考特回扣回品表格中列出的物品的采购单和收据照片。


    当我盯着屏幕试图处理这些信息时，皮特说：“你看起来在思考什么。怎么了？”


    “除了医疗用品，斯考特表格上的其他回扣物品是我们知道送给了格兰塔姆、德沃克斯和穆尼兹的东西。”我重新调出电子表格并指向屏幕。“丹尼尔购买的本质上是莱德和我在自由分钟诊所（Liberty
    Minute Clinic）看到的那些崭崭新的医疗设备——那家诊所已经在破产边缘徘徊多年了。当我问米勒博士关于这件事时，她感到非常生气，认为我暗示那些东西是银杉的回扣，并告诉我这一切都是通过一家非营利组织捐赠的。”


    我上网找到了一个可以搜索印第安州非营利企业的地方，并在搜索栏中输入了“印第安州健康与福祉”。立即弹出了列表。当我打开业务详情时，在“发起人”下只列出了一个名字：丹尼尔·史文森。


    我翻回丹尼尔和米勒博士的照片，坐回椅子上，难以置信地盯着它看。“他正在经营一个幌子。他利用这个虚假的非营利组织来掩盖他送给女朋友的大量医疗设备。你知道的，我甚至愿意打赌银杉并完全不知道他把他们的多少钱转向了那里。看看表格上的金额。这里有价值超过十万美元的医疗设备。曼迪为了和穆尼兹去加勒比周末钓鱼之旅花费的那几千美元，相比之下简直是零钱。”


    随着我的说话，皮特的表情变得越来越不安。“更重要的是，朱尔斯，你的小丹是那个神秘人物，而这个……”他指向我的笔记本电脑和闪存盘。“这就是杰德·菲舍警告过你的，他会不择手段要找到的东西。给莱德打电话，打
    911，让我们离开这个鬼地方。”


    “听起来是个计划。”我掏出手机拨给莱德，结果只接到了语音信箱。经历了这一周，我预料他和玛雅正在享受一些急需的独时光。“嘿，莱德，嗯……抱歉打扰你，但我很确定我们遇到麻烦了。”我告诉他杰德消息的简短版本，并向他同步了丹尼尔非营利幌子的情况。“我觉得我们还没有完全脱险。皮特和我现在带着闪存盘去警察局。回头聊。”对皮特说：“你准备好了吗？我们离开前应该检查一下厨房，看看所有东西都关掉了。”


    皮特抓住我的手臂，将我从椅子上拉了起来。“我们可以以后再处理那个。我觉得我们现在就离开并在路上报警。我对这件事有不好的预感。”


    当我再次伸手去拿闪存盘时，我们身后传来一个声音：“你说得对，皮特。如果你们两个不给我我想要的，事情会变得非常糟糕。”


    皮特和我一起转过身，发现丹尼尔·史文森正站在门口对着我们举枪。


    越过我们看向桌子，丹尼尔说：“我翻遍了你们的地方两次，没找到那个愚蠢的音乐盒。我来这里是为了说服你告诉我在哪里，甚至尝试从你那买买。但看起来你已经发现了它为什么对我如此重要。现在我要拿闪存盘和那台笔记本电脑。”


    我努力不让声音颤抖，说道：“等一下。音乐盒是怎么回事？你怎么知道我有？”


    “曼迪，愿她安息，太蠢了，没有把它放在安全的地方。在你闯入她家后，她过了两天才发现它丢了。”


    皮特清了清嗓子。“所以曼迪知道那个带有斯考特勒索照片的闪存盘？她为什么不毁掉它？”


    丹尼尔叹了口气。“因为那个婊娘贪了。她知道我想要，所以她决定它值钱。我不欣赏任何形式的勒索。”


    我回答道：“显然如此。这就是你杀了她并把一切都推在她身上的原因吗？”


    丹尼尔笑着说：“如果我承认了，我就得杀掉你们两个。”


    皮特点头。“有道理。把闪存盘给他，朱尔斯，然后他就可以走了。”


    我真想找个机会审问丹尼尔关于回扣计划的事，并查出是谁杀了斯考特，但他对整个局面似乎太冷静了。正因于此，我打算他是一个反社会人格者，而不是。

