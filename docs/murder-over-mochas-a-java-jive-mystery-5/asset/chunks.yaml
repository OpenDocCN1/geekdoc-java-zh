  trans: '

    我陷入了沉思，回想起斯考特去世前对我说过的话。“那么你会认为这些医生是斯考特从他们那里获取信息的财富权势者吗？”


    “当然，你可以这么说。”


    “他们也可能是那些与斯考特有过不愉快生意交易、可能会威胁他，并据称在第一次绑架了曼迪的危险人物吗？”


    “有可能。也许这次曼迪的失踪他们也有责任。”


    我迷失了思绪，抓起派盘，陷回沙发里，大口地吃了起来。


    莱德推开了我的叉子，叉起了一大块苹果。“我原以为我们是在分享呢，`Julie`。”


    我用手肘把他撞开开。“`Julie`正怀着你的孩子，赛斯。你会抢夺她的食物吗？”


    “不，但如果是对上那个讨厌孩子的朱丽叶特，我是会这么做的。”他从我手里夺回了派盘。


    我翻了个白眼。“你打算一直提这件事吗？等一下，你没没私下跟我妈提过这事儿吧？”


    他耸了耸肩，嘴里塞满了派。“可能提过了。”


    “就在你和她单独相处的五分钟里？”


    “嘿，我们谁都不年轻了。是时候弄清楚我们到底想和谁在一起了，这样我们可以在一切太晚之前做好该做的事。”


    我盯着他。“你真是个中国娘。我隔在这儿都能听到你生物钟在滴答响。”


    “这叫成年人。你应该尝试一下。”


    虽然这段对话表面上看起来轻松，但我强烈地察觉到了言外之音。我轻声说道：“你说我们需要弄清楚想和谁在一起。你……决定好玛雅了吗？”


    莱德把空了的派盘放回咖啡几，转看向我。“你决定好皮特了吗？”


    “是我先问你的。”


    他吐了一口气。“嗯，我认识玛雅好很多年了。我们一直作为朋友相处很好，但最近我觉得事情发生了变化。朝好的方向发展。我觉得我真的开始爱上她了。”


    我点了点头，百感交集在心中挣扎着。一方面，我为他和玛雅感到高兴；但另一方面，从他口中听到关于另一个女人的话，感觉很异样。“那太好了。”


    他表情严肃，说道：“我知道现在可能不是提这件事的最佳时机，但我能看出来你对我约会她有些顾虑。我想知道那是什么。你对我们两个都很了解。你是觉得我们不合适还是怎么的？”


    派在我的胃里翻江倒海。所以他确实知道我并没有表面表现出的那样对他约会玛雅感到兴奋。该死。我以为我的演技比这好呢。现在我没选择，只能坦白我的真实感受了，因为回答那个问题的任何其他方式都可能伤害他与玛雅的关系。


    “不。我觉得你们非常般配。只是……”我吐出一口气气。“有时候，看着别人开启新生活是很难的。”


    “是你让我往前过去的。”


    “我知道。但我心里还是有一小部分……”

