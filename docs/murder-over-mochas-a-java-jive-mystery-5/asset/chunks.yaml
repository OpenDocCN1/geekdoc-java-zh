  raw: 'My stomach clenched. Now I realized why they were looking so closely at Pete.
    “Yes, Pete brought Scott coffee and water.” I quickly replayed the events of tonight
    in my mind, hoping to find some way to prove Scott’s sudden death couldn’t have
    been caused by anything Pete did. My eyes widened as an image of how Scott had
    looked when first I sat down to talk with him shot through my head. “But neither
    had anything to do with his death. Scott was showing clear signs of being unwell
    long before he ingested anything at Java Jive. He was sweating, pale, and shaking
    when he got there. If he came ‘in contact with some kind of substance that could
    have killed him,’ it happened before he walked in the door. Test the coffee and
    the water he drank. I’m sure both cups are still on the table where we were sitting.”


    He gave me a condescending glare. “Oh, we’re already testing them, but thanks
    for being an armchair detective. I hear you’re quite the investigator.”


    “About that, I know you have zero evidence to hold me, or Pete Bennett for that
    matter. When can we leave?”


    Delaney snarled, “Well, seeing as how Hamilton has been beating down the captain’s
    door and professing your innocence, I doubt you’ll be here too much longer. I
    suppose it pays to sleep your way around the department.”


    My temper flared at his biting remark (which wasn’t inaccurate—I had in fact dated
    two MNPD detectives), but I held my tongue. My lack of response seemed to incense
    him. He stormed out and slammed the door. I blew out a pent-up breath and let
    my shoulders slump. I hadn’t been this exhausted in a long time.


    After a few minutes, a uniformed officer came in and told me I was free to go,
    but that I needed to be available for further questioning. In other words, *don’t
    leave town*. He led me to the front doors, where Ryder and Maya were both pacing,
    impatiently waiting for me outside. The moment I got out the door, they both rushed
    up to me and gave me tight hugs and awkward condolences about Scott. Once I assured
    them I was okay, they both seemed to relax a bit.


    Ryder was relieved enough to crack a joke. “Didn’t I tell you that you’d be in
    big trouble if I had to cut our date short to come bust you out of jail?”


    Maya elbowed him in the ribs. “Oh, stop. But seriously, Juliet, you really are
    going to have to stop being nearly arrested.” Her tone was light and crisp, as
    it usually was thanks to her British accent. However, her voice still wavered
    underneath, and her dark eyes were strained.


    Ryder chuckled. “Yes, you’re going to have to stay out of trouble, but only because
    Maya can’t handle it. I had to run interference so she didn’t earn herself a spot
    for the night downstairs in the zoo. Did you know she got kicked out of the station
    for barging in there and losing her crap, demanding they release you and Pete
    immediately?”


    She gave him a wry smile. “I wasn’t the only one with my knickers in a twist.
    Your bad behavior nearly succeeded in getting your temporary leave turned into
    a permanent one.” Winking at me, she said, “He had Delaney by the collar, itching
    to beat some sense into him. Luckily, their captain didn’t happen to see it.”


    For some reason, that got me. Tears pooled in my eyes. “You guys are the best.
    I’m betting Pete and I would be guests of the MNPD tonight if it weren’t for you
    sticking your necks out for us. Both of you took really stupid risks.” I smiled.
    “I don’t know how to thank you.”


    “It’s what friends do,” Maya said, putting her arm around Ryder’s waist. “You
    would have done the same for us.”


    Oddly enough, when I looked at the two of them smiling at each other and gazing
    into each other’s eyes, I didn’t feel the pang of discomfort I usually got. I
    didn’t have time to think about what that meant, because Pete exited the station
    at that time, and I hurried into his arms.


    “I’m sorry I got you mixed up in this mess, Pete. The last thing I’d ever want
    is for you to go through another interrogation over a murder.”


    Pete had made some major strides lately in getting over the heartache of his former
    girlfriend’s death, but I knew there was still some pain there about him being
    charged with her murder and put in jail for a time.


    He said, “Don’t worry about me. I need to know if you’re okay.”


    “I’m fine.”


    Pete let me go and took a step back so he could study my face. I could tell he
    didn’t believe me, but he didn’t press it. “Bottom line, Jules, we’re both suspects
    or persons of interest or whatever you want to call it. We could be in some serious
    trouble here.”


    Ryder cut in, “Pete’s right. The situation is nothing we should take lightly.
    However, the good news is that the facts and evidence are on your side. They can’t
    charge you without evidence.”


    Pete stared at him. “Are you forgetting what happened to me?”


    Ryder sighed. “Technically, there was evidence against you. It just wasn’t the
    right evidence.”


    Maya said, “According to what we’ve learned, they’re thinking it could be some
    kind of poisoning. But since they won’t find any poison in the drinks you two
    served the victim, you’ll soon be off the hook.”


    Pete wasn’t convinced. He wasn’t exactly trusting of the MNPD. “I think the detective
    on the case has all but made up his mind. Even if they find nothing in the drinks,
    they could still say we cleaned up the evidence before anyone got there. This
    is far from over.”


    Frowning, Ryder said, “I don’t think Delaney would make stuff up, but he isn’t
    the best detective they could have thrown at this case.”


    “Where’s Cromwell? For once, I’d rather he be the one investigating us,” I said.
    Detective Cromwell had been a thorn in my side through some other cases, but the
    last time I’d gotten tangled up in a murder investigation, he’d surprised me by
    being totally on my side and even treating me like an equal.


    “Vacation,” Ryder replied.


    Maya said to me, “If Delaney is the incompetent git he seems to be, I think the
    quickest way to clear your names is to investigate this thing yourself.”


    Over the past year, I had decided I really hated investigating murders. Give me
    a cheating spouse or a dirty business partner any day. Murderers were nuts.


    I protested, “But what about the big case I’m working on? I’ve got a lot of hours
    yet to put in—”


    “You’re off the case,” Maya said matter-of-factly.


    My jaw dropped. “But…You can’t—”


    “I can, and I just did. You’re going to be distracted by this thing with your
    ex either way, so you’ll be no use to me. Get your personal life in order, and
    then come back to work.”


    Tears again welled up in my eyes. It felt like I was being fired.


    Maya took my hands. “Juliet, I’m not doing this to hurt you. If you’re not giving
    your full attention to an investigation, you’ll either miss something important,
    or worse, get yourself hurt. I couldn’t stand for that to happen on my watch.
    Find the proof of your innocence, and then you can get on with your life. Delaney
    could drag this out for months. Trust me, you don’t want that.”


    Ryder nodded. “As much as this goes against everything I’ve ever said to you,
    I think you should investigate Scott’s death on your own. We’ll help you every
    step of the way.”


    I felt Pete fidgeting beside me. He said, “I’m on board, too, but I think we should
    pick this up tomorrow. It’s late, and you’ve been traumatized. You need some rest
    so you can think clearly.”


    Patting me on the back, Ryder said, “Come on. I’ll drive you guys home.”


