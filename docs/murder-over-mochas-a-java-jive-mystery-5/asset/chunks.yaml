    Pete didn’t flinch, which totally impressed me. It was becoming more evident to
    me by the moment how hell-bent he was on clearing our names. He was definitely
    all-in. Calmly, and to my dismay, Pete removed the gun from the back of his waistband
    and transferred it to the front of his waistband to make it visible to Destiny’s
    pimp.


    Even though every fiber of my freaked-out being wanted to step in and diffuse
    this situation, it was clear that “the property” weren’t allowed to butt in while
    the men were talking.


    Pete said evenly, “I don’t want any trouble, and I don’t need any more girls.
    Happy?”


    The pimp stared him down for a long moment. He grunted, “Get the hell out of here,”
    then grabbed Destiny and wandered off the other way.


    Pete gripped my hand tightly as we hurried toward his car. Once inside, he threw
    it into gear and zoomed out of the parking lot, not slowing down until we were
    several blocks away.


    Still trying to calm himself and return his heavy breathing to normal, Pete said,
    “See? Told you the gun was a good idea.”


    I shook my head. “Pete, I can’t even…”


    “And I’m truly sorry about the ass-slapping thing. Won’t happen again.” Turning
    to me with an impish grin, he added, “Unless you want it to.”


    # Chapter 5


    Java Jive was closed on Sundays (not that it would have mattered this weekend,
    because the police still hadn’t released the place back to Pete yet to reopen),
    so Pete and I had decided we’d get cracking on the case early in the morning.
    But before he showed up at my apartment, I had another visitor.


    I opened the door to find Cooper standing there, his face stricken. Without warning,
    he barged in and put his arms around me, squeezing until I had to squeak, “I can’t
    breathe, Coop.”


    He loosened his grip but didn’t let me go. “I heard about what happened at Java
    Jive on the news, and social media is blowing up about it. I knocked on your door
    several times last night, but you didn’t seem to be here. I tried to stay awake
    and watch for you to come home, but I ended up falling asleep. I’m sorry I wasn’t
    here for you. Were you there when it happened? Are you involved? Is this Scott
    person the same guy you were talking about yesterday?”


    I sighed. This was a little more than I could handle before my morning coffee.
    “Um…yes.”


    “To which of my questions?”


    Wincing, I replied, “All of them?”


    Cooper let me go to stare down at me. “You were there when he…died?”


    I nodded.


    “Your former fiancé who you’d taken your aggression out on earlier in the day?”


    I nodded again.


    His expression was stunned. “How are you coping with that, Juliet?”


    I held back the urge to roll my eyes. What I didn’t need today, especially since
    I planned to spend every waking moment investigating, was to be shrinked and have
    to haul out then work through my emotions. I didn’t have time for that.


    Luckily, I was saved from answering his question by another knock at the door.
    But as I opened it, I realized my current visitor situation was going to open
    up a whole new vein of drama in my life.


    Pete walked in with a bakery box and two large to-go cups of coffee. “Hey, Jules,
    I thought we’d need plenty of caffeine and sugar to get started on—” He stopped
    abruptly when his eyes fell on Cooper, who’d come over in his pajamas, with bare
    feet, no less. “Am I interrupting something?”


    I groaned inwardly, hoping Pete wasn’t thinking what I thought he was thinking.
    “Not at all. Pete, this is my neighbor Cooper Milford. Cooper, this is Pete Bennett,
    my bestie.”


    Cooper stuck out his hand. “Pete. I’ve heard a lot about you.”


    Pete shook his hand and cast a smirky glance at me. “Funny, I haven’t heard a
    word about you.”


    Cooper’s eyes registered hurt, which made my heart clench. This was an idiotic
    arrangement we had going on. Worse, I had the sneaking suspicion that Cooper was
    becoming way more emotionally invested in it than I was.


    “Okay,” I said a little too loudly. “Cooper, I appreciate you coming over and
    checking on me this morning, but Pete and I have some…work stuff we need to…work
    on. I’ll see you later?”


    Cooper got the hint and headed for the door, but just as I was about to close
    it, he said quietly, “Juliet, I’d really like to discuss something with you. When
    can I see you?”


    “It may be a while. I’ll let you know, okay?”


    He nodded, looking thoroughly dejected. *This* was why you shouldn’t get involved
    with someone in his early twenties. He didn’t yet have that thick skin that came
    with life experiences. He was a baby. A hot baby, but still a baby.


    “Wow, Jules. I didn’t take you for a cougar,” Pete said, not even trying to hide
    his amusement.


    I lied between gritted teeth, “I am *not* a cougar. He’s just a friend.”


    “Does he know that?”


    “Shut up, Pete.”


    Still grinning, he held up his hands. “Okay, okay. Shutting up. So, boss—what’s
    on today’s sleuthing agenda?”


    “I figure I’ll run background checks on Scott and on Mandi, and I’ll have Trevor
    hack the tablet and the phone. Once we have that, we’ll have a lot to work with.”

