    我的胃猛地收缩了一下。现在我明白为什么他们盯着皮特看不放了。“是的，皮特给斯特带了咖啡和水。”我在脑海中快速回放着今晚发生的一切，试图找到某种方法证明斯特的猝死与皮特所做的任何行为无关。当我第一次坐下与他交谈时，斯特的样子闪过我的脑海，我不由得睁大了眼睛。“但这和他的死都没有关系。斯特在进
    `Java Jive` 服下任何东西之前，就已经表现出明显的不适迹象。他到达那里时满汗、脸色苍白且发抖。如果他‘接触了某种可能杀死他的物质’，那也是发生在他进门之前。测试他喝过的咖啡和水。我确定那两杯还在我们坐过的那张桌子上。”


    他给了我一个轻蔑的眼光。“噢，我们已经在测试了，但感谢你当这个沙发侦探。我听闻你是个挺厉害的调查员。”


    “关于这个，我知道你们完全没有证据留我，或者留皮特·伯内特。我们什么时候能离开？”


    德兰尼咆哮道：“好吧，既然汉密尔顿一直在敲队长的门并声称你是清白的，我怀疑你不会在这里呆太久了。我想，在部门里睡遍所有人确实是有回报的。”


    他那句刻薄的话点燃了我的火（这并不不准确——我确实和两个 `MNPD` 侦探交往过），但我忍住了没有说话。我的沉默似乎激怒了他。他冲了出去，砰地一声关上门。我吐出一口积压已久的气，肩膀垮了下来。我已经很久没有这么疲惫了。


    几分钟后，一名制服警察走进来告诉我我可以走了，但需要随时准备接受进一步问询。换句话说，`不要离开这里`。他带我来到大门口，莱德和玛雅正在外面徘徊，不耐烦地等我。我一一大门，他们就冲向我，给了我紧有力的拥抱，并对斯特表达了尴尬的慰问。一旦我向他们保证我没事，他们似乎都放松了一些。


    莱德得松得足以开个玩笑了。“我没告诉过你吗，如果我得缩短我们的约会来把你从监狱里放出来，你就会有大麻烦？”


    玛雅用肘撞了一下他的肋骨。“噢，住口。但说真的，朱莉特，你真的得停止这种几乎被逮捕的情况了。”她的语气轻快干脆，这通常得益于她的英国口音。然而，她的声音底层依然带着颤抖，深色的眼睛里充满了紧绷。


    莱德咯笑道。“是的，你得远离麻烦，但仅仅是因为玛雅受不了。我得去打圆场，免得让她在晚上楼下的‘动物园’里留个位子。你知道吗，她曾因为冲进那里大发雷霆被踢出警局，当时要求他们立即释放你和皮特？”


    她给了他一个苦涩的微笑。“我不光一个人乱了阵脚。你那糟糕的行为险些就让你的临时假变成了永久假。”她向我眨了眨眼，说道：“他当时揪着德兰尼的领子，恨不得教他做人。幸运的是，他们的队长恰好没看到这一幕。”


    不知道为什么，这触动了我。泪水在眼眶里打转。“你们是最好的。我敢打赌，如果不是你们为我们挺身而出，我和皮特今晚就是 `MNPD` 的客人了。你们两个都冒了非常愚蠢的险。”我笑了。“我不知道该感谢你们。”


    “这是朋友应该做的事，”玛雅说着，手臂搂住莱德的腰。“你也会为我们这么做的。”


    奇怪的是，当我看着他们面面微笑、凝视彼此眼神时，我并没有感到往常那种不适感。我没时间思考这意味着什么，因为这时皮特走出了警局，我急忙扑进了他的怀里。


    “抱歉让你卷入了这团乱子，皮特。我最不希望的就是你再次为了一起谋杀案接受审讯。”


    皮特最近在走出前女友去世的悲痛方面取得了很大进展，但我知道，对于被指控杀害她并被关一段时间，他心中仍残留着痛苦。


    他说：“别担心我。我需要知道你是否好。”


    “我很好。”


    皮特放开了我，后退了一步以便观察我的脸。我看得出他不相信我，但他没有追问。“底线是，朱斯，我们都是嫌疑人或利益相关者，随你怎么称呼。我们在这里可能会面临严重的麻烦。”


    莱德插话道：“皮特说得对。这种情况不应该轻视。然而，好消息是，事实和证据在你这一边。没有证据，他们不能起诉你。”


    皮特盯着他。“你忘记发生在我身上的事了吗？”


    莱德叹了口气。“从技术上讲，确实有针对你的证据。只是不是正确的证据。”


    玛雅说：“根据我们了解的情况，他们认为可能是某种中毒。但由于在你们给受害者的饮料中找不到任何毒药，你很快就能脱身的。”


    皮特并不信服。他并不信任 `MNPD`。“我觉得办案的侦探几乎已经下定决心了。即使他们在饮料里没发现什么，这件事也远未结束。”

