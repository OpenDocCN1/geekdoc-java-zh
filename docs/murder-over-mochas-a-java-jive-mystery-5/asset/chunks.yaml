    # 调查


    我叹了口气，回答道：“我同感。有些东西让他发生了变化。也许是药物的原因。或者……也许他说的的是真话，无论他卷入了什么麻烦，导致他在压力下崩溃了。如果他说的话是真的，那可能会让他彻底失控。”


    “是啊，只不过曼迪（Mandi）并没有被绑架。”


    “她是这么说的。”


    他向后靠了靠，困惑地看着我。“她为什么要对被绑架这件事撒谎呢？”


    我耸了耸肩。曼迪的故事里有些地方让我觉得不对劲，但我又说不上具体在哪里。我嘟囔道：“我不知道，”继续向下滑动。过去几个月收到的邮件里没什么值得注意的，于是我进入了他的发送箱，然后是垃圾邮件箱。那里也什么也没有。至于电话，，没发现太多可挖掘的。他的语音信箱是空的。大部分来电和电话都来自他联系人列表里的人，除了他在去世前最后几天反复出现的一个未知号码。我把它记下来，让
    `Ryder` 和 `Maya` 去追踪。


    “那看短信了？”皮特（Pete）问。


    这些是我最害怕的——斯科特（Scott）与所有亲近的人每天进行的、毫无过滤的交流。尽管我在感情上已经放下他了，但翻看他的个人信息仍然让我痛苦。我不想知道他与妻子之间那些内部的小笑话。我不想读读他与朋友之间的打趣，以及他们计划去哪里、做什么——他基本上就过着自己的生活，好像我根本没有存在过一样。除了他昨晚那句糟糕的道歉（那是在我提起他的过错*之后*才提供的），没有什么能证明他对他对我所的一切存有哪怕一丁点点悔意。


    我清了清嗓子。“开始看短信吧。”


    皮特从我手中拿过手机。“再仔细想想，让我来分担这部分吧。”


    我长舒了一口气，随口说：“谢谢。”


    “噢。斯科特和他老婆一直在发短信吵架。”他滑动了很一段。“持续一段时间了。”


    “多久了？”


    “嗯……”他又往下滑了一点。“在我看来，事情是从三个月前开始变得糟糕的。”


    “三个月前……嗯……那不是他开始欠交房贷和车贷的时候吗？”


    皮特点了点头。“ ‘听着：我知道你正和那个该死的贾雷德（Jared）该死的背叛我。下一次看到那个该死的家伙时，我要该死的揍扁他那张该死的、该死的脸。’ ”他看向我，笑了笑。“顺便说一下，我加了那些星号。斯科特的嘴巴其实很脏。”


    又一个新发现的特质。“好吧，所以这个叫 `Jared` 的家伙现在也在我们今天的追踪名单上了。斯科特那个害羞的新娘对他对他出轨的指控是怎么回的？”


    “她告诉他去死自己吧。”


    “真高雅。看看他是不是也和 `Jared` 爆发过短信战。”


    皮特滑动着短信列表。“这里有一个 `Jared`。`Jared Fisher`（贾雷德·菲舍）。”他的眼睛瞪大了。“哇。我想我们找到了那个正确的 `Jared`。斯科特和这家伙从三个月前开始就进行了一场单方面的短信战。`Jared`
    对任何挑衅短信都没有回应，不过我并不怪他。这太太丑了。在这一切之前，他们之间的短信似乎是和工作相关的。”


    “那 `Jared Fisher` 是个同事。这就能解释他是如何接近 `Mandi` 的，以及斯科特是如何发现这件事的。”


    “而且斯科特的妻子竟然在他眼皮子底下和同事出轨，这倒也是种讽刺的报应。听起来熟悉吗？”


    “*太*熟悉了。继续找。”


    皮特又翻看了一些短信，时不时做个鬼脸。“除了发给妻子和她情人的短信，斯科特给其他所有人的短信都很正常。他跟朋友之间有很多幼稚的直男对话，工作内容，还有几条给父母和兄弟的，之类的。但在过去的两周里，斯科特和哥们儿或家人的互动少了很多。他关于工作的短信变短了，也没那么随性。过去这一周除了给妻子和
    `Jared` 发愤怒短信外，几乎没发过其他短信。”


    “如果他陷入了某种困境，无论是财务、婚姻、工作还是这些因素的结合，他对每个人变得易躁并疏远朋友是正常的人类反应。”


    “对。检查一下他的社交媒体账号怎么样——我记得你开车来这儿看其中几个时恶心作呕。你觉得他是不是外面有个不稳定的外遇，然后决定杀了他？”


    我耸了耸肩。“我觉得这是一种可能。我没看到任何关于和他那些网恋对象见面的私信。从他们个人资料上列出的地点来看，他的那些网恋都是外地人，但检查一下也无害处。”


    “嗯。网恋。你敢打赌其中一些是假装成女孩的老大叔，好让他们能钻进斯科蒂的网裤里？”


    “谢谢你给我提供*这种*心理阴影画面。”


    他笑着，手臂搭在长椅背上拍了拍我。“抱歉，`Jules`。我只是想活跃一下气氛。我不忍看到你还在为那个混蛋对你做的事而痛苦。我们去聊聊那些失败的哥们儿吧。”


    '
- fmt: '

    “There’s nothing to tell. I’m not sleeping with Mandi, and I never was. I love
    my wife.” Jared ran his hands through his expensively cut hair.


    Oh, yeah, he was definitely a cheater.


    The heartfelt “I love my wife” ploy was always the cheater’s first line of defense.
    I’d thought it was a joke when Maya had told me about it when I’d first started
    working for her, but darned if I didn’t quickly learn for myself that the more
    a husband cheated, the louder he professed his love for his wife.


    He continued, “I went through this a few months ago. She came on to me at work.
    I turned her down. I told my wife all about it, but I tried to keep it quiet at
    work so it wouldn’t affect our jobs.”


    “And so her husband wouldn’t find out and try to come after you?” Pete asked.


    “Yes, I suppose that was also a concern. Somehow he got it in his head that we’d
    actually had an affair, and he made my life miserable around the office. Quite
    frankly, he went crazy.”


    “So you wouldn’t say you were sad to see him fired?” I asked.


    “Not particularly. In fact, it was partly due to the threats he made to me that
    he lost his job.”


    Pete nudged me.


    I asked, “Did he ever threaten anyone besides you? Your lovely family, perhaps?”


    Jared’s face got white with anger. “I see where you’re going with this. So to
    answer your veiled question—no, I did not kill Scott to keep him from threatening
    me and my family.” He stood. “I think it’s time for you to leave.”


    As he ushered us out the door, I turned and asked, “Where were you yesterday evening?”


    Through gritted teeth, he replied, “I was entertaining clients in Louisville.
    You can check with my employer if you don’t believe me.”


    Jared stood on his porch and scowled at us until we got in Pete’s car and drove
    away.


    Pete began cautiously, “Um, Jules, maybe dial it down a little next time?”


    I heaved out a pent-up breath. “Sorry. I just realized how much I seriously don’t
    want to go around delving into Scott’s life.”


    He pulled the car over and took my hands. “We don’t have to do this. We can go
    home and face whatever charges the MNPD wants to throw at us—together. Maybe it
    won’t be so bad.”


    Smiling, I said, “You’d risk getting tossed in the pokey again so I don’t have
    to suffer through a few uncomfortable conversations?”


    “Yes.”


    I got a warm feeling all over. “Well, that tears it. I am going to put my big
    girl panties on and get this investigation done. But only because I never want
    to see you—or me—behind bars again.”


    He chuckled. “My offer still stands, but I’m glad you want to keep going with
    this. The pokey is no joke. It’s boring as hell, and I’ve decided there is no
    greater humiliation in life than having to take a crap out in the open in front
    of a bunch of other dudes.”


    I groaned and pulled my hands away. “You know how to ruin a conversation better
    than anyone I know.”


    # Chapter 8


    Daniel Stevenson, Scott’s best bro, wasn’t at his home. He also didn’t answer
    the calls Pete and I both placed to the phone number listed in Scott’s contacts.
    I’d known him well from all the years I’d been with Scott, but of course he’d
    taken Scott’s side in the whole breakup disaster, so we hadn’t been in contact
    since then. I wasn’t sure if he’d be willing to speak with me or not.


    As we drove away to find the next person on our list, Pete had an idea. “Call
    him from Scott’s phone.”


    “Eww. No. That’s sick.”


    “What? Maybe the guy will pick up for a number he recognizes.”


    “You forget we’re not in the big city anymore. I guarantee everyone in this town
    knows Scott is dead by now. Nobody’s going to pick up a call from a dead guy.”


    He shrugged. “I probably would.”


    “Still not doing it.”


    “Wimp. Who’s next?”


    “It looks like someone named Chandra Thomas is the only other coworker Scott had
    any kind of polite communication with lately. Her address is in Freedom Hills,
    not too far from Scott’s place. Let’s hope she can shed some non-biased light
    on the situation.”


