  trans: '

    在我几乎是费了力气把皮特（Pete）从床上拽出来后，我们终于没算太晚地到达 Java Jive。带我们来的早班大学生守在店门口守着，因为莱德（Ryder）要晚些时候才会到。


    当我努力集中注意力把黄油切进我的干司康饼原料中时，皮特正忙着亲吻我的脖子。“我不介意在我们独处时这样做，但迟早我们的员工就要开始上班了。我们准备好让我们新的……关系公开了吗？”


    在吻的间隙，他说：“好吧，如果有人问起是谁让你今天露出了笑容，我不反对让你直接告诉他们实话。”


    “好的。”我转过身，让我们面对面。“但现在就把这种欲望发泄出来，因为如果我不让员工亲热，那我们在这里亲吻就不公平了。”


    他深情地吻了我，吻得我喘不过气来。“好了，发泄完了。现在如果我不把自己从你身上移开，它很快又会回到我的身体里了。”


    “那你去办公室做点会计之类的吧。”


    “啊，是的，会计。老古的勃起杀手。”


    ---


    当我们开门，格特蒂（Gertie）进来时，皮特还在办公室里，所以我让罗琳达（Rhonda）回去接他。


    当我给她倒咖啡时，格特蒂说：“你今天早上脸蛋红红的。这意味着你和我孙子昨晚去约会了吗？”


    格特蒂总是想打听我的约会对象，她从不害于询问那些我不想回答的性生活隐私问题。考虑到我们谈论的是她的孙子，我希望她不要问得太私。


    “是的，我们确实去了。”通常情况下，我不会把那次去 Big Shotz 的随行看作约会，但如果你算上酒店和所有的性，我觉得这完全够了。


    当皮特坐在她身边并亲吻她的脸颊时，我对他微笑。他也回给了我一个羞涩的微笑。


    她看着我们俩之间的互动，问道：“然后？你们终于承认彼此相爱了吗？”


    我们彼此对视着，回答道：“是的。”


    “老天爷。是时候了。你们可以创下最长前戏的记录了。”


    就这样这样。


    感觉到脸颊发烫，我移开了目光。皮特呻吟道：“噢，得吧，格。”


    她笑了，两手各握住我们的一只。“噢，别紧张。我只是说我为你们两个感到高兴。”


    收银台的队伍开始变长，所以我留下他们，去帮卡米尔（Camille）处理咖啡订单。在我离开皮特和格特蒂期间，我看到他们凑在一起交谈。有一刻，她擦掉了眼角的泪水，对他露出灿烂的笑容。格特蒂对皮特和我在一起非常开心。她一直都在鼓励我们，从我第一次见到她起，就一直把我当家里人对待。他们都看向我这边，所以我假装没在偷偷看他们。我目光收回来，注意到她悄悄地把什么东西塞进他的手里，他把它放进了兜里。那两个在搞鬼动作，但我不想插手。我最近调查的精力已经够我用好一段时间了。


    格特蒂和皮特向我挥挥手离开了，几分钟后，莱德进来并在吧台旁坐了一个凳子。我们已经成功让顾客队重新变得可控，于是我过去为他倒了一杯咖啡。


    “我猜你要在这儿呆一整天？听我的，听起来挺无聊的，”我说。


    他坏笑。“我有热咖啡、好食物，还有算凑合的陪伴。这比坐在闷热的车里监视或被拴在办公桌旁好得多。”


    “我想你说得对。关于贾德·菲舍尔（Jared Fisher）的行踪有什么消息吗？”


    他喝了口咖啡，摇头。“还没。你已经想把我打发走了？”


    “绝不是。但我介意回到正常生活。”


    “你的生活里没有一点是正常的。”


    我皱了皱鼻子。“大家都这么想吗？”


    他盯着我看了一会儿。“昨晚没机会问你这个，但我注意到你看起来像是在收拾你的公寓。要去哪儿吗？”


    这种感觉很奇怪，但在关于莱德方面，我终于到了可以释怀的地步。之前，跟他谈论皮特总觉得是不对的。现在不再了。


    “我要和皮特一起住了。”


    他点了点头。“真为你们好。”从他真诚的反应来看，我觉得他也已经放下了过去。


    “谢谢。”我吸了一气，准备宣布关于巡演的消息。“另外，我要和麦奎尔女孩（Maguire Girls）一起巡演了。”


    莱德的下巴都掉了。“你是认真的吗？太棒了。祝贺你们。”他越过吧台给了我一个拥抱。“什么时候？在哪儿？详细跟我说一下。”


    ---


    一旦我向他交代了所有的细节，我就回到了工作中。但几小时后，我开始感到坐立不安。自从我的公寓被闯入已经过去十五小时了。在我心里，警察有大量的时间去定位贾德·菲舍尔了。

