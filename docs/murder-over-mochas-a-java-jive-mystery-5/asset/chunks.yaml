    her a hug.


    “No problem. Remember, I *love* investigating. And I’m hella good at it. Next
    time you need help, call me.”


    “Will do,” I lied.


    Pete had already jogged across the parking lot and had his car running by the
    time I got in. He shook his head. “That girl needs a cold shower.”


    “Yeah, I kinda forgot to warn you about that.”


    Frowning, he said, “On purpose, I bet. You love to watch me get hit on by weirdos.”


    I pinched his cheek. “It wouldn’t happen if you weren’t so stinking adorable.”


    He sighed dramatically. “That is so true.”


    —


    Paul Jackson agreed to talk with us, but only if we met him at Sam’s Tavern, where
    he was setting up for his music gig later tonight. Although he was a little on
    the nerdy side, Paul was one of the most talented musicians in the area. I wouldn’t
    have minded to stay for his performance, but Pete insisted on going somewhere
    quiet for dinner so we could relax. Sam’s, while not the cleanest establishment
    in Liberty, had the best bar food around. They were just opening for the evening,
    and the smell wafting out of the kitchen was heavenly. It only served to remind
    me how hungry I was and how much I wanted our sleuthing to be over for the day.


    Paul was setting up his amps when we approached him. He looked way different than
    I remembered. His curly mop of hair was gone, and instead his head was shaved
    clean. He’d totally transformed his geeky persona into that of a rocker guy. The
    only thing left of the Paul I knew were his thick glasses. What was with these
    guys reinventing themselves?


    “Hey, Paul,” I said.


    “Hi, Juliet.” Paul’s nasally voice was at least the same.


    “This is Pete. He’s helping me look into Scott’s death.”


    They shook hands. Paul said, “I can’t believe he’s gone. I just saw him last week.”


    I replied, “I know. I’m sorry for the loss of your friend. Bethany told us you’d
    seen him recently. How was he? Did you notice anything unusual about the way he
    was acting?”


    “Well, he was pissed over losing his job, which isn’t unusual. I was that angry
    when I got canned a few months ago.”


    Pete asked, “Aside from losing his job, was there anything else he was worried
    or upset about? Anything with Mandi?”


    “He and his wife have been at each other’s throats for a while. Her cheating was
    driving him crazy. I told him to leave her. She was no good for him anyway. When
    I got back to town this summer, it was like he’d turned into this whole different
    guy. We’d kept in touch while I was living in LA, so I knew you guys had broken
    up, but I didn’t realize Scott had become such a sellout.”


    I nodded. “Right. He’d definitely adopted a different lifestyle. About that, did
    you ever get the feeling that he was using drugs?”


    Paul replied, “He was never high around me, but drug use would explain his behavior
    otherwise. He seemed to be getting almost…paranoid, for lack of a better word.
    The last couple of times I saw him, I got the feeling he thought he needed to
    be constantly looking over his shoulder. He was jittery and out of it.”


    “Did he mention anything about him or Mandi being in danger?”


    “No, never.” He furrowed his brow. “In fact, I’m still trying to wrap my head
    around the idea of someone wanting to kill him. I can’t see him getting messed
    up in something dangerous enough to make anyone want to hurt him. He was kind
    of a scaredy-cat.”


    If Paul (at least the pre-rocker Paul I knew) called you a scaredy-cat, that was
    pretty pathetic. However, his assessment wasn’t wrong. Scott was never much of
    a risk-taker. He never drove over the speed limit. He wouldn’t gamble or play
    the stock market. He didn’t even like to ride the carnival rides at the county
    fair, because he was skeptical of their safety after being carted across the country
    and repeatedly set up and broken down.


    Speaking of jittery, Pete was fidgeting like there was no tomorrow. “So that should
    be all we need, right, Jules?”


    I shrugged. “I think that should do it. Paul, it was good to see you, and thanks
    for the info.”


    Paul smiled. “It was good to see you, too, Juliet.”


    We stood to leave, and Pete said, “We’d love to stay and listen to your set, but
    we have to get back. If you’re ever in Nashville, look us up, okay?”


    “You got it,” Paul replied.


    As Pete ushered me out the door, I said, “You know, I’d enjoy some greasy pub
    food and music just as much or more than a fancy dinner. We don’t have to leave
    on my account.”


    “Jules, can you just let a guy do something nice for you?”


    Odd response, because I was sure he would rather have stayed at Sam’s as well.
    “Okay, but you’ve been doing something nice for me all day. You drove me here,
    sleuthed with me—”


    “Yes, and now the sleuthing is officially over for the day. No more talking about
    it or thinking about it.”


    “But—”


    “No buts. You, me, dinner. Now.”


    I hid a smile at Pete’s sudden assertiveness. “Yes, sir.”


    # Chapter 9


    Pete took me to a lovely little Italian restaurant called Vecchio’s at the edge
    of town. It was a nice place, and in jeans and T-shirts we were hardly dressed
    well enough to be here. Nevertheless, we were led to a cozy circular booth for
    two. A little weird for dinner with your BFF.


    “Have you been here before?” Pete asked, perusing the menu.


    “Yeah, but it’s been a while. The last time I was here was with Sc—”


    He cut me off. “We’re not mentioning that name tonight, remember?”


    My eyebrows shot up. “Not even in the context of the question you asked me?”


    He put down his menu and turned to me. “No. Not at all. This is you and me having
    a nice, normal dinner like people do. We’re going to talk about the weather, music,
    movies, and normal stuff that people talk about at normal dinners.”


    I cocked my head to the side. “Like a date?”


    Looking away quickly, he scoffed, “No, of course not like a *date*. Not really.
    I mean, we can be normal, can’t we?”


    “You’ve said ‘normal’ four times in the last ten seconds.”


    He picked his menu back up and muttered, “And *you’re* being difficult on purpose.”


    I put my menu in front of my face to cover a snicker. There was something going
    on with Pete. He wasn’t as laid-back and witty as usual. Then again, we were persons
    of interest in a murder investigation, and I wasn’t exactly exuding sweetness
    and light after the events of this weekend, not that I ever did anyway.


    My phone buzzed in my pocket. I’d put it on silent earlier so we wouldn’t be interrupted
    during our interviews. I’d been getting regular updates from Ryder and Maya—mostly
    “sorry we’re not finding much of anything you don’t already know.” They’d tracked
    down the unknown phone number that showed up in Scott’s call list, but it belonged
    to a pre-paid cell, which was a dead end. Since they’d struck out with the meager
    information they found through the background checks, they’d taken it upon themselves
    to call people we’d decided weren’t as close to Scott, like coworkers he hadn’t
    been text-warring with. They’d gotten the same story from everyone—Scott was becoming
    more and more out of control, and no one would have been surprised if his poisoning
    was self-inflicted. No new news.


    Another reason my phone had to be silenced was that Cooper kept calling and texting
    me, which I was trying to hide from Pete. He was insistent on seeing me when I
    got back home tonight, but I kept putting him off. This was yet another text from
    him, and I’d had it. I had decided to end things with him. Our relationship was
    supposed to be the most uncomplicated thing in my life, but it was fast becoming
    one of the most complicated.


    “Who’s that?” Pete asked as I began typing my response to Cooper’s text.


    “Um…another non-update from Maya,” I lied.


    He put his hand on my arm. “We said no case during dinner.”


    “I’m just telling her we’re at dinner and that we’re done for the day.” I finished
    up the text and crammed the phone back in my pocket. “There. No more interruptions.”'
