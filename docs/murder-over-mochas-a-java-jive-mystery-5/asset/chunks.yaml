    send the *Chronicle* photos of me accepting bribes. I can’t have that kind of
    bad press. It would ruin my practice. I’d have to move to another town. Or worse,
    I could be fined or even jailed.”


    As I sat there slack-jawed at the thought of Scott shaking down Dr. Grantham for
    cash, a thought came to me. Hauling Scott’s tablet out of my oversized purse,
    I opened his calendar. I found Dr. Grantham’s name on his schedule at one o’clock
    last Tuesday.


    Ryder said, “This sickens me. I suppose the good news is that he won’t be bothering
    you anymore. I assume you let Mandi or Jared know what Scott had said to you.”


    “You better believe I did. I contacted Mandi immediately. She said the problem
    would be taken care of.”


    My gut started churning as I murmured uneasily, “Yeah, the problem was taken care
    of, all right.” It didn’t seem like much of a coincidence that Scott didn’t make
    it until Monday to collect his blackmail money.


    Ryder said to Dr. Grantham, “Scott had already been fired before he even spoke
    to you, but even so, we at Silver Spruce feel like it happened on our watch. I’m
    at a loss for how we can begin to make this up to you.”


    As I tapped the screen to check the appointment’s details, I noticed it said “5K”
    in the notes section, which matched the amount of money Grantham said Scott was
    blackmailing her for. Scott was nothing if not a planner. Every event in his life—even
    down to tiny things like what day mail-order packages were supposed to arrive
    and when he was supposed to change the filter in the HVAC system—was listed on
    his personal calendar. His work calendar was no different. He’d scheduled out
    a fifteen-minute time frame to go blackmail someone. Nerd.


    Dr. Grantham’s voice got husky. “I know *exactly* how you can make it up to me,
    Seth.”


    “Eww. Abort. Abort. We have what we need,” I said to Ryder, my eyes glued to the
    tablet.


    On the calendar for Wednesday, I found another entry for a fifteen-minute spot
    with a doctor who was also not one of Scott’s clients—Dr. Devaux. Not a surprise
    he’d lied to us about not knowing Scott. I kept looking while Ryder tried to figure
    out a way to get out of Dr. Grantham’s clutches without being violated.


    Ryder cleared his throat. “I…uh, I need to go. I have an early morning tomorrow.
    Can’t be late my first week on the job.”


    “Nonsense. You just got here. I’ll call your boss tomorrow morning and tell him
    I’ve detained you.”


    It was sounding like he needed some help getting away from this woman. I wanted
    to keep his cover intact, mainly so she wouldn’t find out he was a cop.


    He laughed uneasily. “Tempting, but I’m new, so I don’t want to rock the boat
    just yet. Maybe we can do this again sometime.”'
