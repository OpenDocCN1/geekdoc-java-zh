    He roared, “I am not losing my—” Letting out a strangled grunt, he lowered his
    voice, which now had a sharp edge to it. “If you’re not in that freezer in ten
    seconds, I’ll shoot you. Ten, nine…”


    As Daniel counted down, I backed toward Pete, sliding one hand behind me and grasping
    the knife. The problem was, Daniel wasn’t moving toward us like I’d hoped he would.
    Suddenly there was a hissing sound near Daniel, which made him pause his counting
    and glance at the deep fryer beside him. The oil began bubbling, and before Daniel
    could move away, there was a loud pop. Smoke plumed up, and hot oil sprayed two
    feet in every direction.


    Daniel screeched like a banshee and dropped his gun. Pete and I gaped at each
    other as both of Daniel’s hands flew to his face and he continued to cry out in
    agonizing pain. The hot oil only sprayed for a few seconds, so once it stopped,
    Pete approached the area and snatched the gun. Backing away from the still-gurgling
    fryer, he pointed the gun at Daniel, who’d dropped to his knees.


    I said, “Pete, call 911. We need police and an ambulance. I’ll deal with Daniel,
    but if he tries anything, shoot him.”


    While I carefully turned off the fryer, lest we have another incident with a hot
    grease geyser, Pete kept the gun trained on Daniel as he used the kitchen phone
    to call 911. Daniel was in his own world, now writhing on the floor and sobbing,
    the skin of his face, arms, and hands popping up with more and more big splotches
    by the second. Deciding he was no longer in any shape to be a threat to us, I
    grabbed the first aid kit, found some sterile pads, and ran them under cool water.


    I kneeled down next to Daniel and began tending his wounds as gently as I could.
    His handsome face was such a mess of blotches and blisters, I wasn’t convinced
    it would ever fully heal. It was all I could do to keep him still so I could pour
    some clean water over the burns and place the wet dressings over them. It certainly
    didn’t help that after Pete finished his 911 call, he stood over Daniel with the
    gun aimed at the poor man’s head.


    Trying not to stare at Daniel’s painful burns, Pete said, “How can you do that
    when only a couple of minutes ago he was dead-set on killing us?”


    I shrugged. “Just because he’s terrible doesn’t mean I have to be terrible back.
    Besides, I’ve had enough grease burns to know that they hurt like a bitch. Trust
    me—he’s getting his `own` karmic kick in the nuts right now.”


    “I suppose that’s true. Hey, but that explosion was awesome, right? I mean, not
    for him, but it was pretty impressive otherwise. That hot oil seeped into my janky
    phone and literally fried the battery. It would have made a great viral video—”


    Ryder burst into the kitchen, gun drawn, ready to kick some ass.


    Pete and I both greeted him with a nonchalant “Hey.”


    When he surveyed the situation, his serious cop face fell into an expression of
    bewilderment. “What the hell happened here? You didn’t show up at the station,
    and you wouldn’t answer any of your phones, so I figured you two got yourselves
    into trouble again. I came to save you guys, but…” He glanced at Daniel, who had
    now descended into whimpering and shaking. “It looks like you’ve taken down the
    bad guy on your own.”


    Technically, it was the exploding battery inside Pete’s phone that had taken down
    the bad guy, but I didn’t correct him. Dumb luck aside, we had the situation well
    under control. The fact remained that Pete and I hadn’t needed to be rescued,
    finally.


    That fact was not lost on Ryder. With a proud grin, he added, “It’s about time.”


    # Epilogue


    ## Four weeks later


    As we were packing up our equipment from our final band practice before heading
    out on tour the next morning, Pete said to me, “Why don’t we stop by Java Jive
    for one last coffee? I’m afraid the bile we’ll be subjected to on the road is
    not going to be live up to our lofty standards of percolated perfection.”


    I laughed. “Okay, but then we go straight home. You still haven’t finished packing
    your suitcase.”


    He threw one arm around my shoulders and steered me toward his car. “Yes, dear.
    You know, I didn’t realize a perk of living with you is that you’d keep me in
    line.”


    I squinted up at him. “Are you calling me bossy?”


    “Would I do that?”


    Giving him a playful shove, I hurried around to the passenger side and got in.
    I was completely over the moon about this tour. Sure, I was scared to death, but
    more than that, I was so freaking excited about spending the month with Pete.
    Since we’d decided to go for it, our relationship had blossomed in ways I had
    never expected and couldn’t begin to explain. I had never been so happy, and I
    was pretty sure Pete felt the same way. Life could not possibly get any better.


    We got to Java Jive only a few minutes before closing. Rhonda, our newly named
    assistant manager who we’d decided to leave in charge while we were gone, was
    busy bossing everyone around (just like I would have) and getting the coffeehouse
    ready to shut down. Pete and I pulled our own espresso drinks and took them over
    to the couch. We sat and talked and laughed like we always had, and I felt a twinge
    of sadness as I realized it would be a long time.

