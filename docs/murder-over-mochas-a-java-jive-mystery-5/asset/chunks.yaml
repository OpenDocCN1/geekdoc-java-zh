    “谢谢你，贝塔尼，”我说，一边给了她一个拥抱，一边阻止她去追皮特。


    “没问题。记住，我*很喜欢*调查。而且我在这方面超级擅长。下次如果你需要帮助，尽管叫我。”


    “我会的，”我撒谎道。


    等我上车时，皮特已经跑过了整个停车场并启动了汽车。他摇了摇头：“那个女孩真该泼盆冷水清醒醒。”


    “是啊，我有点忘了提醒你这件事了。”


    他皱着眉说：“我打赌你是故意的。你喜欢看我被那些怪人搭讪。”


    我捏了捏他的脸：“如果你不是那么该死地可爱，这种事根本就不会发生。”


    他戏剧性地叹了口气：“事实确实如此。”


    ***


    保罗·杰克逊（Paul Jackson）同意和我们谈，但前提是在萨酒馆（Sam’s Tavern）见他，他正在那里为今晚的音乐演出做准备。虽然他有点宅男，但保罗是当地最有才华的音乐人之一。我不介意留下来看表演，但皮特坚持要去个安静的地方吃晚餐，这样我们可以放松一下。萨酒馆虽然不是利伯蒂市最干净的，但有当地最好的酒吧小吃。他们刚开始晚间营业，从厨房飘出来的味道简直是人间美味。这只是提醒了我自己有多饿，以及我多希望今天的侦查工作能快点结束。


    当我们靠近他时，保罗正在调试音响器。他看起来和我记忆中完全不同。他那头波波浪的卷发不见了，取而代之的是光光的光头。他完全将自己的宅男形象转变成了一个摇滚青年。我所认识的保罗身上留下的唯一就是那副厚眼镜。这些男人怎么就喜欢重塑自我呢？


    “嘿，保罗，”我说。


    “嗨，朱丽叶。”保罗那带着鼻腔的声音至少没变。


    “这是皮特。他正在帮我调查斯科特的死因。”


    他们握了手。保罗说：“我无法相信他去世了。我上周才见过他。”


    我回答道：“我知道。对你失去朋友感到非常遗憾。贝塔尼告诉我们你最近见过他。他怎么样？你有没有注意到他的行为有什么异常？”


    “嗯，他因为丢了工作而发火，这并不稀奇。几个月前我被开除时也那样。”


    皮特问道：“除了丢工作，还有什么事让他担心或不顺心的吗？和曼迪（Mandi）有什么问题吗？”


    “他和妻子已经争吵了一段时间了。她的出轨让他快把他逼疯了。我告诉他离开她吧，反正她对他没好处。当我今年夏天回到镇上时，他变成了一个完全不同的人。我在洛杉矶期间一直和他保持联系，所以我知道你们分手了，但我没想到斯科特竟然变成了一个如此世俗的人。”


    我点头：“没错。他确实采取了完全不同的生活方式。关于这个，你有没有觉得过他在用毒品？”


    保罗回答道：“在我面前他从没有兴奋过，但除此之外，吸毒可以解释他的行为。他似乎变得几乎有些……偏执，找不到更贴切的词了。我最后几次见到他时，我觉得他觉得自己必须时刻提防后身后。他很烦躁，魂不在焉。”


    “他有没有提到过他或曼迪处于危险之中？”


    “没有，从来没有。”他皱起眉，“事实上，我还在努力理解有人想杀他的这种想法。我无法想象他会卷入某种足以让任何人想伤害他的危险事件中。他其实是个胆小鬼。”


    如果保罗（至少是我认识的那个摇滚之前的保罗）说你是个胆小鬼，那确实挺可怜的。然而，他的评估并没有错。斯科特从来不是一个冒险者。他从不超速开车。他不赌博也不玩股票。他甚至不喜欢坐县博览会的游乐设施，因为在这些设施被运往全国各地并反复组装、拆卸后，他对它们的安全性表示怀疑。


    说到烦躁，皮特不安动得像没有明天一样。“所以这就是我们需要的全部了，对吧，朱斯？”


    我耸了耸肩：“我觉得这样就行了。保罗，见到你很高兴，感谢提供的信息。”


    保罗笑了：“见到你也很高兴，朱丽叶。”


    我们站起身离开，皮特说：“我们很想留下来听你的演出，但我们得回去了。如果你哪天来纳什维，找找我们，好吗？”


    “没问题，”保罗回答道。


    当皮特送我出门时，我说：“你知道的，我同样甚至更喜欢油腻的酒吧食物和音乐，而不是高级晚餐。我们没必要为了我的缘离开。”


    “朱斯，你就不能让男孩子为你做件好事吗？”


    这反应很奇怪，因为我很肯定他也同样更想留在萨酒馆。“好吧，但你整天都在为我做好事。你开车送我过来，跟我一起侦查——”


    “是的，现在今天的侦查正式结束了。不要再谈论它，也不要想它了。”


    “但是——”


    “没有但是。你，我，晚餐。现在就。”


    看到皮特突然强势，我忍住微笑。“好的，先生。”


