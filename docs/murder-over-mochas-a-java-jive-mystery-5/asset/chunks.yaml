    Uncle Randy’s only hobby.”


    I walked over beside him to stare at a well-used still. “Oh, yeah. I’d forgotten
    about the moonshine. It’ll put hair on your chest.”


    “I doubt that making ’shine is legal in Indiana.”


    “It’s not. Why do you think he does it here and not at home? Duh.”


    A loud bang made both of us jump. The room got considerably darker around us.
    When we spun around, we found out why. The storm doors had been slammed shut.


    Striding toward the only exit, Ryder muttered, “That better have been the wind.”


    He hurried up the stairs and pushed against the wooden doors, but they wouldn’t
    budge. Grimacing, he repositioned himself on the steps and pushed with all his
    might. Getting nowhere, he started pounding on the door. “Hey! Let us out of here!”


    After a couple of minutes of pounding and yelling and cursing, he turned to me,
    his face stuck in a scowl. “Nice. Now we’re trapped in this hellhole. And I’m
    thinking someone did it on purpose. Why are you smiling?”


    I had to admit I was rather excited about our situation. Not necessarily about
    being trapped in this torture chamber full of nightmare fuel, but because it was
    evident that someone thought we were close enough to figuring something out that
    they’d bothered to try to stop us.


    “Two reasons. One, someone’s sending us a message, so we’re on the right track
    with our investigation, which I was beginning to doubt only minutes ago. Two,
    we both have our phones. It’s not like we can’t call for help.”


    “Who are you going to call? We’re not calling the cops, because we’re trespassing.
    I’ll bet my retirement fund you won’t call your parents. Maya and Pete are hours
    away.”


    I was already scrolling through my contacts. “I’m calling the one person in this
    town who won’t ask a bunch of prying questions about this.”


    My cousin Melinda Fairholz answered, “Hey, cuz.”


    “Hey. I’m in Liberty. Um…are you free at the moment?”


    “I’m heading to lunch, but I can talk. What’s up?”


    “I’m kind of…trapped.”


    She paused for a moment. “Literally?”


    “Yes, literally. I’m in town again looking into Scott’s death and Mandi’s disappearance,
    and somehow I managed to get myself and Ryder locked in a cellar. We’re fine,
    but we need you to come let us out.”


    She chuckled. “Oh, this is so worth skipping lunch for. Where are you?”


    I gave her the address and hung up. Ryder was still frowning.


    “What is it?” I asked.


    “What if the person who locked us up is still here? I’m worried about the safety
    of whoever comes to let us out. Who did you call, by the way?”


    “My cousin Melinda.”


    His frown turned into a smirk. “Oh, perfect choice. Maybe she can turn our captor
    into a toad.”


    I rolled my eyes. “You know she can’t do that.” Melinda had been a practicing
    Wiccan since high school, not a popular life choice in small-town Indiana, or
    most places for that matter. “I’ll text her and let her know to be on the lookout,
    but she’s tough. She’ll be fine.”


    “That tough chick thing she tries to pull is an act.”


    “Tell that to Pete. She scares him.”


    Ryder regarded me for a moment. “So about Pete. When I brought it up this morning—twice—about
    the two of you being a little more friendly than usual, you deflected both times.
    Now that we have nowhere to go and nothing but time, I want to know the truth.”


    My closeness with Pete had always been a bone of contention between Ryder and
    me. When Ryder and I were dating, he thought my friendship with Pete often bordered
    on too close, even going so far during one argument as to call us codependent.
    And now that Ryder and I were nothing more than friends, it seemed to still irk
    him that I was more likely to go to Pete with a problem than to him. And then
    of course there was some reluctance on my part to talk to Ryder about my love
    life since I still had some residual feelings for him. The feelings were waning,
    but I still felt a little electricity when I was near him.


    “It’s really nothing.”


    He shook his head. “I know what I saw. Don’t try to snow me, because you know
    you can’t.”


    When would I learn not to try to lie to a detective? “Okay, fine. If you *must*
    know my personal business—”


    “Whoa, whoa. We always share our personal business. But this is the second relationship
    you’ve tried to hide from me this week.”


    “To be fair, I hid the Cooper thing from everyone.”


    “You’re still deflecting.”


    “I believe you were the one who interrupted me, Detective.”


    He sighed. “Go on.”


    “This thing with Pete…It’s really new. And…it’s totally nothing, yet. We haven’t
    even been out on a date.”


    “What about last night when you two ditched the rest of us to have dinner alone?
    How was that not a date?”


    I scrunched up my nose, thinking about it. I supposed it was kind of datelike,
    if you wanted to get technical about it.


    “And Maya said he took you to some fancy place when the two of you came up here
    this past weekend. Was that also not a date?”


    “Well…”


    Was Pete dating me and I didn’t even know it? Pretty dense of me not to realize,
    but since we’d always been so close, that line was incredibly blurry. Then again,
    Pete had been pretty pissed at Daniel Stevenson for horning in on our dinner,
    even though I’d been the one to invite him. And Pete hadn’t seemed to want Ryan
    to tag along on the ride to Liberty, either. Maybe he’d wanted me all to himself.
    To top it all off, he did send me flowers yesterday, which wasn’t something he
    normally did.


    Ryder walked over and took one of my hands. “What I want to know more than anything
    is…are you sure this is what you want? I don’t want to see you get hurt if he
    decides to pull his ‘let’s just be friends’ routine after you’ve invested your
    heart in a relationship.”


    If I wasn’t already conflicted, I sure was *now*. Why did he have to be so caring
    and protective of me? Granted, he’d broken my heart once, and even though I’d
    forgiven him for it, I didn’t think he’d quite got around to forgiving himself.


    I pulled my hand away. “I appreciate your concern, but…I know what I’m doing.
    And it’s not exactly easy to have this conversation with a bunch of dead eyes
    staring me down.”


    “Okay,” he replied, conceding. Not quite the hotheaded reaction I had expected
    out of Ryder Hamilton, but he’d mellowed a lot lately, which wasn’t a bad thing.


    We descended into an awkward silence after that, waiting impatiently for Melinda
    to arrive and rescue us. I could tell from the set of Ryder’s jaw that being surprised
    like we’d been was killing him. He was the large-and-in-charge badass who could
    fight his way out of anything. Not so much this time, but then again, we probably
    would have tried harder to free ourselves if we hadn’t easily been able to find
    help who’d be here in a matter of minutes.


    I got a text from Daniel, which I let Ryder read over my shoulder: *Took the boss
    out to an early lunch. Found out why he wouldn’t tell you any specifics. Scott
    said he had proof of certain Silver Spruce reps giving incentives to doctors in
    exchange for agreeing to prescribe Silver Spruce drugs exclusively. He threatened
    to use it to ruin everyone involved.*


    “What’s the big deal with giving doctors a nudge to push your product? Is it frowned
    upon?” I asked Ryder.


    “Yeah, it’s frowned upon. And illegal. I’ve had several cases in white collar
    dealing with kickbacks.”


    I texted Daniel back: *Did he say if Scott mentioned who the reps are?*


    Daniel: *No, but I bet I can guess who’d be dumb enough to do it.*


    Me: *Rhymes with candy?*


    Daniel: *Bingo.*


    I said to Ryder, “I still don’t get why this kickback thing is such an issue.
    Lots of companies use incentives to sell their stuff.”'
