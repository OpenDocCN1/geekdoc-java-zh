    He smiled down at me. “I understand. I found it difficult to concentrate today
    knowing you could be in danger. I mean, I trust Ryder, but it still ate away at
    me all day.”


    “If it makes you feel any better, the only danger I was in today was of losing
    my mind.” I hugged him. “But now that you’re here, I feel much better.”


    He kissed the top of my head. “I’m happy to help.”


    Once I composed myself, we went out to the front of the house. Maya had come over,
    so the four of us ate dinner together. No mention was made of the case, which
    I was thankful for. They actually did a fantastic job keeping my mind off my problems,
    until Ryder’s phone rang and he frowned, then jumped up and walked away to answer
    it.


    Noticing my stricken expression, Maya said, “It could be good news.”


    Pete put his hand on my back and rubbed in a circular pattern. “Yeah. Keep your
    chin up.”


    Ryder walked back to the table, his face unreadable. But then he broke into a
    big grin. “Jared Fisher is in custody.”


    I let out a huge sigh of relief, and Pete leaned over to hug me. Ryder gave me
    a pat on the shoulder and sat back down.


    Pete asked, “So `now` is it over?”


    Ryder said, “It’s over. Jared Fisher stopped for a fill-up in El Paso, Texas,
    and used his credit card, probably not thinking after the long drive. When the
    transaction popped up, the LPD called the local cops, and they found him and picked
    him up. Done and done.”


    Maya whistled. “He was probably bloody mental by that point. El Paso is nearly
    twenty hours from here by car. You say he’s got three little kids?”


    I nodded.


    “That many hours stuck in a vehicle with three wee ones, and anyone would have
    lost his mind.”


    Ryder said to me, “Now that our killer has been caught, do you feel ‘justified’?
    Or are you still bummed you didn’t get to be in the middle of the action?”


    I squeezed Pete’s hand under the table. “No, I’m good. This time I’ve got better
    things to do.”


    ***


    After Ryder and Maya left, the place emptied out quite a bit, so Pete and I decided
    to let the rest of our staff go home early. Just like old times, we manned the
    counter, keeping up a steady stream of chatter as we worked. As our last customer
    left a few minutes before closing time, I got a phone call from Blake Morgan.


    I answered, “Hey, Blake. Hear the good news?”


    “I heard Jared Fisher was taken into custody,” he said, his voice seeming strained.
    “But that’s not why I’m calling. I have…new information for you. Are you free
    to talk?”


    Worry washing over me yet again, I said, “Just a sec.”


    Pete asked, “What’s up, Jules?”


    I replied, “It’s Blake Morgan.” I switched the phone to speaker and said to Blake,
    “Okay. You’re on speaker with Pete Bennett and me.”


    Blake replied, “Hey, guys. The reason I called is that I just got a voicemail
    from Fisher. Or, rather, I just noticed it. I took my wife out to dinner and a
    movie and had my phone off for a few hours. It’s somewhat garbled, but I’ll let
    you listen to it.”


    The connection wasn’t the best, but we could still hear how crazed Jared’s voice
    sounded. “Blake, you have to help me. I didn’t do it. I didn’t kill Mandi…or Scott.
    I don’t…I don’t want any more people to get hurt, so…can you find that investigator…Juliet
    Langley…and warn her he’s coming for her? She has something he wants, and he won’t
    stop until he gets it.” He paused as sirens began wailing in the background. “Damn
    it. I have to go.”


    When the message ended, Blake said, “I tried calling the number back, but got
    a payphone in El Paso, Texas. If you don’t mind me asking, what is it you have
    that someone wants?”


    I gave Pete an uneasy glance and shrugged. “I honestly have no clue.”


    Blake replied, “Well, it sounds like you better figure it out. In the meantime,
    you might want to get yourself some protection from your cop friend.”


    “Will do. Thanks for letting us know.” After I ended the call, I turned to Pete.
    “That was bizarre.”


    “No joke. But it was also scary. Maybe we should lock up and call it a night.
    It probably wouldn’t hurt to call the cops, too.”


    I nodded, lost in thought. “I have something ‘he’ wants? Who’s ‘he’? And what
    could I possibly have?”


    “You have Scott’s tablet.”


    “Not anymore. I turned it in to the Liberty PD.”


    Pete frowned. “You think this mysterious ‘he’ was the one who tossed your apartment
    instead of Jared?”


    “Could be. But aside from the tablet and Scott’s man bag, which no one knew we
    had, I was never in possession of anything pertaining to the case. During our
    investigation, we talked to people and gathered information, but we didn’t collect
    any physical evidence besides a couple of photos we took in Scott’s motel room.”


    Pete’s eyes grew wide. “Right, but you did take something from Liberty home with
    you.”


    “Huh?”


    “From Scott’s house—the pocket watch and the music box.”


    “But that’s my stuff. Why would the mysterious ‘he’ want my old stuff?”


    His expression suspicious, Pete headed back toward the office. I followed along,
    not knowing where he was going with this. He picked up the guitar-shaped music
    box off the desk.


    “I noticed yesterday it didn’t play music anymore. See?” He cranked the key, but
    no music came out. “I didn’t think much of it until now.” Rummaging around in
    one of the desk drawers, he found a tiny screwdriver and used it to remove the
    back of the music box. His eyes bulged out.


    “I think we found what this guy wants.”


    Where the guts of the music box should have been, there was a tiny flash drive
    about the size of my thumbnail. I plucked it out of the music box and shoved it
    into my laptop sitting on the desk. I sat down and clicked on the folder for the
    drive and found dozens of files on it, most of them JPEG photos.


    I pulled up the first one and pointed at the screen. “Look, Pete. That’s Mandi,
    Jared, and Dr. Devaux having drinks together. She’s handing him one of those boxes
    I found that held the fancy ties.”


    “These are the infamous blackmail photos. This could be what Scott was killed
    for. Pull up the next.”


    The next shot was of Jared and Dr.am practically sitting on top of each other
    in a restaurant booth. It showed him placing a sparkly necklace around her neck.


    I said, “We’re two for three on doctors he was blackmailing.”


    # Chapter 27


    Pete and I quickly checked through the remaining photos. Aside from the ones with
    Daniel cozying up to Dr. Miller, the photos were all of Mandi and Jared with the
    doctors we knew Scott was blackmailing—Graham, Devaux, and Muniz.


    Pete said, “You said there was no record in Scott’s calendar of him making an
    appointment to go blackmail this. Miller lady.”


    “Right. But I suppose he could have talked to her when he went to talk to Muniz.
    They work at the same clinic.”


    “He could have, or…after he took the photos it’s possible he decided against blackmailing
    her. Maybe because of his friendship with Daniel.”


    “Or because he didn’t have any proof of her taking kickbacks. She’s not one of
    Mandi and Jared’s clients, and she wasn’t on Julia’s husband’s list of doctors
    who openly showed a bias for Silver Spruce. She and Daniel could be innocently
    dating.”


    “Trust me, that sleaze doesn’t ‘innocently’ date anyone.”


    Pete pointed at the screen. “Click on that Excel file. I like the name.”

