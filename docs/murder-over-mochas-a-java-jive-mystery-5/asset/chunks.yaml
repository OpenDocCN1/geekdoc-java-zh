- fmt: '

    Well, now I felt bad. In the back of my mind, I never believed Cooper had it in
    him to trash my apartment, even though the timing and motive made perfect sense.
    Worse, since Cooper didn’t do it, there was someone out there who had broken in
    for a whole other reason, and I had no idea what that reason was.


    Ryder wasn’t as convinced of Cooper’s innocence as I was. “Where did you go last
    night after Juliet’s performance?”


    “I called a couple of buddies and had them meet me downtown. We closed down one
    of the bars, and I got back here around two. You’re welcome to check with them
    if you don’t believe me.”


    Ryder started to say something, but I stopped him. “That’s not necessary, Cooper.
    I believe you. I’m sorry I accused you.”


    Striving for a bit of dignity, Cooper straightened his rumpled T-shirt and walked
    out the door without another word.


    I frowned at Ryder. “Did you have to go all bad cop on him?”


    He ignored my comment, busying himself with walking around my living room and
    inspecting the damage. After a few moments, he said, “If your boy toy didn’t do
    this, I’m worried about who did. Why didn’t you call this in last night?”


    “I thought I knew who did it. Plus, I wasn’t robbed. My TV and jewelry are both
    still here. I had my guitar with me, and my laptop was at Java Jive. Other than
    that, I don’t have much else to steal.”


    “If nothing valuable was stolen, then someone was either sending a message or
    looking for something. Who have you pissed off lately?”


    “Only Cooper. And maybe a couple of people in Liberty. But who’d drive all this
    way to get even with me for asking a few uncomfortable questions?”


    “Someone who thought you were getting too close. Who were your uncomfortable conversations
    with?”


    “Mandi, for one. But I guess she might have an alibi, if she’s actually been kidnapped
    this time. And her lover, Jared Fisher, essentially threw me out of his house.”


    “Looks like we have our first good suspect in this mess.”


    # Chapter 14


    Ryder and I formulated our game plan for the day on the drive to Liberty. We’d
    decided to begin at Mandi’s house. When we pulled up to the curb, the place looked
    exactly like it had when Pete and I were here earlier in the week. There wasn’t
    anything that seemed amiss, even though one occupant was dead, and the other had
    vanished without a trace.


    We got out of the car and began to look around. I wished I hadn’t been so quick
    to give up Scott’s keys, but I didn’t figure Ryder would be on board with unlawful
    entry, so it would have been a moot point anyway.


    Ryder peered through the tiny decorative windows on the garage door. “There’s
    a vehicle in there.”


    “Must be Mandi’s, because Scott’s is probably still in Nashville.”


    Ryder went to the front door, knocked, and waited. “Mandi? Mandi O’Malley? This
    is Detective Ryder Hamilton. Can you open up, please?” He turned to me. “With
    her vehicle still here, if she went somewhere of her own free will, it either
    had to be within walking distance or she had to have someone drive her. But you
    said none of the people Scott’s mother called knew where she was?”


    “Right. Two problems with that, though. Mandi is a marathon runner—the real deal.
    I think she’s done the Boston Marathon before. So, ‘walking distance’ for her
    is like twenty-six miles. Also, it’s a good possibility Scott’s mom didn’t know
    all her daughter-in-law’s friends, especially if one of them is her lover. I think
    we need to run down Jared Fisher.”


    “Works for me.”


    As we walked up the sidewalk between two perfectly manicured flowerbeds bursting
    with colorful fall mums, I said, “I wonder if anyone at Silver Spruce Pharmaceuticals
    is going to give us the time of day.” The Silver Spruce office was one of many
    in a complex in a new office park at the edge of town.


    “Why wouldn’t they?” Ryder asked.


    “We have no clout here. You have no jurisdiction, and in Indiana, my Tennessee
    PI license isn’t worth the paper it’s printed on.”


    He grinned and held the door open for me. “I’m banking on the fact that a bunch
    of suits in an office don’t know that. I’m certainly not going to tell them.”


    The Silver Spruce Pharmaceuticals office was on the second floor, so we took the
    elevator up and had to walk only a short distance down the hall. When we opened
    the door, a young receptionist every bit as beautiful as Mandi looked up from
    her desk and asked, “May I help you?”


    Ryder flashed his badge at her, too quickly for her to notice that it read, `metropolitan
    nashville police department`. Then he flashed her one of his trademark sexy smiles.
    “I hope so. I’m Detective Ryder Hamilton, and this is my partner, Juliet Langley.
    We’re here to speak to Jared Fisher.”


    She gave him an apologetic smile. “I’m sorry, Detective. Jared is out on a call
    this morning.”


    I had a thought, racking my brain to come up with the name of the man who had
    sent Scott the email I’d read. “Maybe it would be helpful to speak to the manager…”
    The name finally came to me. “Is Doug McKay available?”


    While the receptionist hurried away from her desk to get Doug McKay, Ryder murmured,
    “Did you pull that name out of your ass or what?”


    “Scott got a strongly worded email last week,” I replied. “I need to know if he’s
    been talking to anyone lately.”


    Ryder looked at me. “We’ll find out.”


    The receptionist returned with Doug McKay. “Mr. McKay is ready for you.”


    We followed him into his office. The room was large and smelled of old paper and
    coffee. McKay sat behind a massive desk and gestured for us to sit.


    “So,” I started- said, “we’re here to ask about Mandi O’Malley.”


    Ryder leaned forward. “We want to know where she is.”


    McKay opened the door for Ryder and me and offered us two chairs facing his desk,
    then splayed his hands on the desk in front of him. “What can I help you?”


    Ryder said, “Is Mandi O’Malley still MIA this morning?”


    McKay’s face crumpled. “Yes. Poor girl. I can’t imagine what she’s going through
    now. It’s such a tragedy.”


    “What do you think she’s going through now?” I asked, unsure if he meant Scott’s
    death or if he thought she was in some immediate danger.


    McKay seemed shocked by my question. “The passing of her husband, of course. We’ve
    all been affected. Not like she has, but still…affected.”


    I nodded. “Affected. Right. And how many days of bereavement leave has Mandi taken
    since Scott died?”


    McKay frowned. “Well…none. But I assumed she was saving them for the visitation
    and funeral.”


    “Would you say that she’s been distracted this week? Has she been performing her
    job as she normally does?”


    He thought for a moment. “She doesn’t seem terribly distracted. I would have to
    say she’s been doing good work this week, especially given the situation.”


    Ryder asked, “Anything happen yesterday that would lead you to believe that she
    was planning to leave town or that she needed some time by herself?”


    “Not that I know…” McKay replied, trailing off as his brow furrowed. “Well…” He
    paused again, deep in thought.


    “You seem to be mulling something over, Mr. McKay. What is it you’re not telling
    us?” Ryder said.


    McKay squirmed in his seat. “It’s nothing, really.”


    Ryder stared him down. “You sure about that?”

