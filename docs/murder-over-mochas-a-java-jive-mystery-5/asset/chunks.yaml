    I really did in fact have a crap ton of motive to kill the guy. To be fair, Detective
    Delaney’s theory about me wasn’t that far-fetched. If I were the investigator
    on the case, I would focus all my energy on finding evidence against the victim’s
    über-jilted ex. Inept or not, Delaney would be coming after me (and Pete by association)
    with both barrels. Which was why Pete and I had a lot of work to do, and fast.


    ### Entering Freedom Hills


    We’d decided to start with Scott’s house. We had his keys, plus after stealing
    his satchel from the crime scene and ransacking his motel room, what was one more
    breaking and entering to add to our list of sins?


    Pete let out a low whistle as he turned into the entrance of Freedom Hills, a
    fancy golf community and the place to live in Liberty. The homes were all McMansions
    that overwhelmed the small lots they sat on. Try as I might, I couldn’t picture
    Scott living here. He’d always made fun of this subdivision—he’d called it Stepford
    Hills.


    Pete pulled his car to a stop in front of Scott’s house. “Are you going to be
    okay with this? Going through the guy’s man bag and his suitcase wasn’t terribly
    personal, but this is his home.”


    I nodded my head. “I’m sure it’ll be fine. I’m more at an angry stage than a sad
    stage at the moment. I can work with that.”


    We donned our gloves (Pete had brought some more manly ones from home this time)
    and marched up to the front door like we had all the permission in the world to
    enter the house. After letting ourselves in, I had to take a moment to battle
    the rage that bubbled up and threatened to overtake me. This place was furnished
    with my stuff. Sure, there was new furniture here and there and new knickknacks
    that seemed to have been chosen specifically for this house, but sprinkled throughout
    were things I’d bought, things that had been given to me, and things I’d inherited
    from my family. I felt ill.


    “Jules, you’re not blinking,” Pete said uneasily. “I know,” I ground out through
    gritted teeth.


    “Uh…So I’ll start looking around, and when you’re ready to join me, you can.”
    He hurried away, knowing from experience it was best not to try to talk to me
    when I was like this.


    ### The Search


    I let out a pent-up breath. I had to remind myself it was not productive to have
    murderous thoughts about Scott, especially since he was already dead. Once I focused
    myself on looking for information rather than giving my attention to items in
    the house, I was able to join Pete in the kitchen. He was looking through a junk
    drawer. I found a bunch of notepads by the house phone and began perusing them.
    He gave me a faint smile, but didn’t try to start a conversation.


    Finally after several minutes, I was able to say, “There’s a lot of my stuff in
    here.”


    He came over and put his hands on my shoulders. “I know. I recognized a couple
    things in here that I gave you. But we’ve got to keep our heads in the game. Our
    mission is to find out what really happened to Scott—not to get justice for that
    dillhole, but to cover our own asses.”


    I smiled. Leave it to Pete to point out what was really important here. “Thanks
    for the pep talk.” “The quicker we can get this done, the quicker we can get you
    out of here.”


    We found Scott’s home office, but there wasn’t a lot in it. The computer was password
    protected, so there was no way Pete and I were getting into it. We both rifled
    through his desk drawers, but it was mostly personal stuff like home and vehicle
    insurance policies, warranty papers, credit card statements, bank statements,
    and bills.


    Pete looked through a couple of the credit card statements and whistled. “This
    guy was a shopaholic. Or maybe his wife’s the shopper. Lots of big purchases on
    here from stores that sell expensive toys…and a couple of big payments to doctors.
    What do you want to bet someone had work done?”


    I was busy going through a stack of bank statements, but found nothing out of
    the ordinary with Scott’s and Mandi’s deposits or withdrawals. I did happen to
    find it interesting that they had separate bank accounts. After Mandi saw what
    Scott did to me, maybe she was smart enough to keep her money separate from his
    just in case he got the itch to trade her in for a newer model.


    ### Questions on Mandi


    “Speaking of his wife, I wonder if the police have any leads on her disappearance.”
    I let out a chuckle. “If I know Mandi, she’s giving whoever kidnapped her a run
    for their money.” “How so?”


    “Well, if there’s more than one kidnapper, she’s probably found a way to pit them
    against each other and get them fighting among themselves. That’s what she did
    to the other staff members at the café when she got bored. Other than that, she
    was a fantastic waitress. She could wrap even the crankiest customer around her
    little finger.”


    “Yeah, I remember her being pretty charming the couple of times I met her at your
    café. And it didn’t hurt that she looks like a supermodel.” Frowning, I replied,
    “Yeah, that too.”


    ### A Call from Ryan


    My phone rang, and it was Ryan. “Hey,” I said, putting it on speaker and setting
    down the phone on the desk so I could continue my search.


    “Hey…I know you don’t love talking to reporters, but would you be willing to give
