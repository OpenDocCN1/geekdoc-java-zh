    you a list of the places I’ve been this morning, which you can use to verify that
    I was nowhere near that cabin until well after she was dead.”


    “Okay, start listing,” he replied, pen poised to take notes.


    “*Chronicle* office, Liberty Minute Clinic, and the gas station on Main and Jefferson.”


    He quit writing and popped his head up. “*Chronicle* office? Don’t tell me you’re
    working with Lizzie on this murder investigation.”


    “Why? You got a problem with her, too?”


    He grimaced. “No, but let’s just say she also sticks her nose in where it doesn’t
    belong way too much for my liking.”


    “So it was your serial killer case that ruined her wedding day?”


    “This interview is about you, not me.”


    # Chapter 24


    After finishing up my interview/interrogation with Detective Johnson and handing
    over Scott’s tablet (which the detective was none too impressed that I’d kept),
    I was finally free to go. Ryder was waiting for me in his car. As soon as I got
    to the parking lot, a black Porsche pulled into the lot, and Blake and Lizzie
    both jumped out of it. Oh, boy. I was so not in the mood to regurgitate this story
    again.


    Blake demanded, “Why didn’t you call us when you found Mandi O’Malley?”


    Ryder got out of his car as well and came over to stand next to me. “It’s not
    our job to inform you of police matters.”


    Blake drew himself up to his full height and crossed his arms. “I thought we were
    working together.”


    Ryder did the same. “Don’t forget you’re part of the media, pal. We called in
    an unattended death. It wasn’t something we needed to run by you.”


    “I’m talking about common courtesy—”


    Lizzie rolled her eyes. “To your corners, boys. This isn’t about who’s got more
    testosterone.”


    I snickered in spite of the tense situation. She’d voiced exactly what I was thinking.


    Backing down, Blake said in a calmer voice, “Will you at least tell us if it’s
    true that you got a message from Mandi O’Malley saying she killed her husband?”


    “Where did you hear that?” I asked.


    Lizzie said, “You know those contacts I told you he has? Well, one of them is
    in the LPD.”'
