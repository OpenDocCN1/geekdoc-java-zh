    “Seth, you’re not going anywhere.”


    Oh, yeah, he needed help. After getting a brilliant idea, I scrounged in the backseat
    and found a hoodie, which I rolled up into a ball and stuffed as much as I could
    into the front of my jeans. After stretching my blouse down over it, I found an
    old elastic band in my purse, which I used to put my hair up in a messy-on-purpose
    ponytail.


    Hurrying into the restaurant and blowing past the hostess, I spotted Ryder and
    his date at a cozy booth in the bar.


    Placing one hand on my back, I waddled over there, sticking out my fake belly
    as far as it would go. “What the hell do you think you’re doing, Seth?” I demanded.


    Ryder’s jaw dropped as his eyes zeroed in on my hoodie baby. “Um…I…”


    I turned to `Dr. Grantham`, who seemed equally shocked. “Hi. I’m Julie Davis.
    His wife. And you are?”


    She sneered at Ryder. “Leaving. I want a new rep.”


    After she stormed away, I took her vacated seat in the booth. “Hello, hubby.”


    He couldn’t keep the grin off his face. “Hey, Julie. Nice timing. The good doctor
    was getting handsy.”


    Chuckling, I took the elastic band out of my hair and shook out my red curls.
    “Yeah, it sounded like it was heading that way. I figured my grand entrance wouldn’t
    totally blow your cover, yet it would still scare her away.”


    He stared at my belly. “What in the world do you have in there?”


    I pulled out the hoodie. “This.”


    “You’re nothing if not resourceful.”


    “That’s me.”


    He threw a couple of bills on the table, and then we headed out.


    I said, “As horrific as that probably was for you, thanks to the information you
    were able to from `Dr. Grantham` I believe we’re about to crack this case wide
    open.”


    “You mean about Scott blackmailing her? Yeah, that changes things.”


    “Like you wouldn’t believe. She’s not the only one he’s blackmailing.”


    We got in the car, and I handed him the tablet. I reached over and tapped the
    screen to bring up Scott’s meeting with `Dr. Grantham`. “Check it out. Scott scheduled
    his blackmailing. Here’s where he met with your girlfriend.”


    “That’s super anal.”


    “No kidding.” I pulled up the next blackmail event. “And here’s where he met with
    `Dr. Devaux`. I love how he puts in the notes how much he’s blackmailing them
    for. See where it says ‘2K’ in the notes on this one? He must’ve only told `Devaux`
    to cough up two grand, but he charged your lady friend, who’s a cardiologist,
    five grand.”


    “Interesting, especially since after Mandi told `Dr. Grantham` that she’d ‘take
    care of the problem,’ Scott ended up dead before he could collect his money.”


    I sighed. “Right. I came to the same conclusion.”


    “Which brings us back to making it a priority to find Mandi.”


    “Yes, but now are you beginning to see my point about not being too concerned
    about her supposed disappearance?”


    “I am.”


    I tapped the screen again, pulling up Scott’s Thursday schedule. “Moving on, here’s
    another fifteen-minute meeting, this one with `Dr. Muniz`, one of the doctors
    Julia, Lizzie, and Blake interviewed this afternoon. The note on this one says
    ‘3K.’ Lizzie said they got nothing out of their interviewees, but this speaks
    volumes. That makes an even ten grand in blackmail money.” I got out my phone
    and shot a quick text to Lizzie to let her know what we’d learned tonight.


    Ryder nodded. “What we have here is a theory, some cryptic notes, and an inadmissible
    statement from someone who’ll never give the cops the same story. We need actual
    proof. What would really be helpful is if we could find the photos Scott told
    `Dr. Grantham` he had.”


    “It would, but I’ve been through all the photos on his personal phone and this
    tablet. No luck.”


    “He could have saved them to a hard drive, a flash drive, the cloud…” After thinking
    for a moment, he said, “Do you think Scott took up this crusade against kickbacks
    to get back at Mandi for her affair? Or do you think he simply felt strongly about
    his fellow reps not playing by the rules?”


    “It’s pretty dumb to crusade against kickbacks by way of blackmail.”


    “You said his behavior was irrational, possibly due to drug use, which meant he
    wasn’t making good decisions.”


    I frowned. “He never made particularly fantastic decisions.”


    “Think about it. Mandi gets the promotion and he doesn’t, so he’s jealous and
    emasculated and maybe even looking for her to fail. Mandi has to step up her game,
    because with the promotion comes a bigger responsibility to secure more prescriptions
    being written for Silver Spruce drugs.”


    I nodded. “That’s when she might have started using illegal tactics to get the
    job done.”


    “Absolutely. Let’s say Scott finds out her secret—which turns out to be her trainer
    Jared’s secret as well. Scott decides he wants a piece of the action, too, but…for
    whatever reason, he doesn’t have the clearance or the budget to give out any swag.”


    “Which is frustrating. His wife is doing better than him at work, and around that
    time she also starts cheating on him. No doubt he had to be at his boiling point…”
    I trailed off, almost feeling sorry for Scott.


    Ryder finished my thought. “So he comes up with a way to make money on the side,
    for all we know, this payment he asked for may have been the first of many. If
    at any point he could prove fraud and decided to turn these doctors in to the
    feds, it could cost them way more than a little blackmail money.”


    A chill ran down my spine. “Until he lost everything.”


    # Chapter 21


    When Ryder and I got back to my parents’ house, they had already turned in for
    the night, so we did the same. I tried to persuade him to take the bed in my room,
    but ever the suffering hero, he insisted on sleeping on the living room. Once
    we’d got back to the house, I’d called Pete and told him all about the blackmail
    we’d uncovered. My new information only made him apprehensive about me continuing
    the investigation, and we ended up getting into a bit of an argument over it.
    Between worrying over that, my brain working overtime on the investigation, and
    the uncomfortable bed, I couldn’t sleep.


    I shuffled out to the dark kitchen and opened the refrigerator, excited to find
    there was one piece of my mother’s heavenly apple left. I grabbed the pie pan
    and a fork and turned to head back to my room.


    “You gonna hog that all for yourself?”


    Startled, I sucked in a gulp of air. My heart pounding, I whirled around the living
    room and hissed, “Are you trying to give me a heart attack?”


    I saw Ryder’s silhouette sit up from the couch. He chuckled. “Sorry, did I scare
    you?”


    “Yes,” I grumbled, grabbing another fork for him and walking his way. I plopped
    down next to him on the couch and set the pie and forks in front of us on the
    coffee table. “I take it you can’t sleep, either?”


    He shook his head. “Nope. You know when I get focused on a case I rarely sleep.
    What’s your excuse?”


    I took a big forkful of pie and mumbled, “Same.”


    “I took Scott’s tablet and began crossreferencing the doctors’ names on his schedule
    with the other reps’ client lists. Based on that, it looks like Grantham, Devaux,
    and Muniz are the only ones he’s shaking down for money, so they’re all decent
    suspects.” He took a bite of pie for himself.

