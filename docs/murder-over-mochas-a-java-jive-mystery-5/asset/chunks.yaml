    # Chapter 17


    Ryder and I walked back across the square to Sam’s Tavern. I’d had a craving for
    their greasy pub food ever since Pete and I were here this weekend. While we ate,
    I filled Ryder in on everything I’d learned. At that point, I had to confess to
    him that I’d kept Scott’s tablet, because I wanted to be able to show him the
    list of Silver Spruce’s clients. After enduring a couple of minutes’ worth of
    his reprimands, I got out the tablet and we perused the list together. All of
    the reps had a few clients within the county plus a larger outlying region they
    were responsible for, but there was no way to tell which clients—if any or perhaps
    all of them—were receiving bonuses under the table.


    “That’s a long list. We need to cut it down,” Ryder said.


    “Julia is getting a list from her husband of docs who seem to have become exclusive
    clients of Silver Spruce. I figure we can start with them, plus I’d like to go
    back and actually talk with Dr. Richardson, the one who complained about Scott
    stealing from him. Oh, and we really need to find Jared Fisher.”


    “And Mandi O’Malley.”


    I shrugged. “I doubt if she’ll be any help.”


    He stared at me for a moment. “I meant we need to find her because she could be
    in danger. You don’t seem like you care either way.”


    Rolling my eyes, I replied, “Look, she—or someone—has already cried wolf once
    about being missing. And she’s a pro at playing people. I should know. So forgive
    me if I call bullshit on this one.”


    “You don’t think she’s in trouble?”


    “No. I think she’s being selfish. I think she took a vacay so she wouldn’t have
    to deal with Scott’s death. Trust me, she’s not in mourning. Who knows? Maybe
    she and Jared decided to run away together. She does that with other women’s men.”


    Ryder smirked at me. “Well, it’s nice to know you’re not still bitter about it.”


    Before I could come up with a snappy comeback, my phone rang. When I saw Pete’s
    name, my irritation dissolved. I got up from the table and hurried toward the
    door, calling, “I need to take this,” over my shoulder.


    “Hey, Pete,” I said breathlessly. Why all of a sudden was a mere phone call from
    my best friend enough to get me all hot and bothered?


    “Hey, Jules,” he mumbled. “Hope you don’t mind if I eat while we talk. I have
    like three minutes for lunch, and then I have to get back to the studio. The snippy
    little starlet we’re working with today doesn’t eat, so she doesn’t expect anyone
    else to, either.”


    I laughed, happy to think about something besides the case. “Ooh, she sounds like
    fun.”


    “Her momager is even worse. She’s been breathing down my neck all morning, telling
    me how to do my job. She keeps whining, ‘My daughter sounds flat. Fix it. Don’t
