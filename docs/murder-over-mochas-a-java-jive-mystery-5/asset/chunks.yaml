    After downing our coffee and donuts, we headed next door to Trevor Wells’s apartment.
    He had several friends over, but he welcomed Pete and me in anyway.


    Trevor said, “Sorry about the mess. We’re nearing the end of a twelve-hour videogame
    tournament. Hope we weren’t too noisy in the middle of the night.”


    I’d heard them loud and clear through our thin apartment walls after I got home,
    but I was so exhausted, I’d fallen instantly asleep. “Nope. Didn’t bother me.”


    Ryan Hart, his eyes trained on the TV, waved from his seat on the couch. “Hey,
    guys.” Ryan was from Liberty as well, although I’d met him here in Nashville through
    Trevor.


    “Hey, Ryan,” Pete and I both replied.


    Trevor said, “What’s up? I know you’re not here as a late entry into our tournament.”


    “We are not. I have a hacking favor to ask of you.” I handed him `Scott’s` tablet
    and `phone`.


    A smile pulled at the corner of his mouth. “I thought you were above hacking these
    days.”


    “Not when we’re the prime suspects in my ex-fiancé’s murder.”


    Trevor’s eyes bugged out.


    Ryan snapped his head in our direction. “Scott O’Malley’s dead?”


    Pete nodded. “And it happened at Java Jive.”


    Ryan blew out a breath. “That sucks. Sorry, guys. What happened?”


    “The police think he may have been poisoned,” I replied. “Have you been on radio
    silence or something? We heard it’s all over the news and social media.”


    Trevor pointed to a stack of `cellphones` on his counter. “Actually, we have.
    No outside communication during the tournament ensures no cheating.” He turned
    to one of the other boys and added, “Not that cheating would be a problem, `Tyler`


    Tyler raised his hands in defense. “You can’t prove anything.”


    Trevor shook his head. “Anyway, I assume these belonged to the dead guy?”


    “Yeah,” Pete replied. “Both password protected. We obtained them marginally legally—”


    “Totally illegally,” I corrected him.


    “And we need to get into them to get some information off them.”


    “Give me a minute,” Trevor said, taking the devices back to his bedroom.


    Ryan abandoned his post on the couch and came over to us. “I knew Scott, kind
    of. He was in college when his family moved to town, I think, so he wasn’t around
    much. His younger brother graduated with me.”


    “Aaron. Right.” I hadn’t even thought about how `Scott’s` family would be taking
    his death. They’d turned their backs on me after Scott left me, but I still would
    hate to see them hurting.


    “So I take it if you two are suspects, the police don’t believe this was an accidental
    poisoning. Why do you think someone would want to kill him?” Ryan asked.


    Pete shrugged. “He came down here spouting some story about his wife being kidnapped
    and saying that he was in trouble.”


    “Kidnapped? This story keeps getting crazier and crazier.”


    I replied, “You’re right about that. We’re going to take a day trip to Liberty
    once we get done here and see if we can glean anything from the locals.”


    “Liberty, huh? I haven’t been there since this summer.” Ryan gave us a hopeful
    smile. “I don’t suppose you’d consider taking a hitchhiker, would you? My sister
    found out not too long ago that she’s pregnant, so I’ve been meaning to drive
    up for weeks and tell her congratulations in person. Unfortunately, my junker
    can’t handle the trip until I have some significant work done on it.”


    “Sure. The more the merrier. Right, Pete?” I asked.


    Something flashed in his eyes for a moment, but then he smiled. “Absolutely.”


    —


    Ryan kept up a running commentary on the two-hour drive to Liberty, telling us
    who we should speak to about Scott and who might have the juiciest gossip on him.
    I’d lived in Liberty all my life except for my brief stint in Nashville during
    college and the couple of years after when I tried (and failed) to get my singing
    career off the ground, and then of course when I’d moved back this past year.
    I knew all the town gossips and busybodies already. However, I let him ramble
    on because I had some work to do sifting through the files on `Scott’s` electronics
    and didn’t have time for chitchat.


    `Scott’s` tablet seemed to be all business-related. His `calendar` showed his
    travel schedule of doctors’ offices he visited. His `contacts app` was overflowing
    with names, so I didn’t even know where to start with it. Other than that, he
    had a bunch of presentations on various drugs, a spreadsheet of doctors’ names
    broken down by geographic region and assigned Silver Spruce rep, business-related
    emails in his `email folder`, and not much else.


    His `phone`, on the other hand, was the total opposite. He had at least one active
    profile on every social media app known to man. On some of them, he had more than
    one profile, under different names but with his photo, which was super creepy.
    And worse, he seemed to use these profiles for sexting women through `private
    messaging`. Disgusting, but not illegal.


    He’d downloaded every currently popular gaming app in existence. He also had numerous
    paid entertainment apps—who needed `Netflix` and `Hulu` and `Crackle`? And then
    there was the porn. Oh, the porn. He had a whole page dedicated to porn apps.
    How had I ever managed to love this loser? And because I couldn’t stop myself
    from continuing to study this train wreck, I pulled up `Scott’s` photos.


    # Chapter 6


    “That bad?” Pete asked.


    I wrinkled my nose. “I guess it’s not a long story, just a pitiful one. He’s the
    writer whose article in the `Liberty Chronicle` put the final nail in my café’s
    coffin. You remember me showing you the review?”


    “Yeah. It was a pretty bad one as I recall.”


    “Right, and since people around here believe everything they read in the town
    newspaper, after the story came out, I essentially had no more business.”

