    他耸了耸肩说：“既然你这么说的话。现在我们可以结束这项调查，并应付德兰尼侦探想加在我们身上的身上的任何罪名了吗？”


    “没问题。我们回家吧。”


    # 第 10 章


    我没有告诉父母我要来这趟城市，所以我想，如果他们通过某种方式发现我来过利伯蒂，我可以为没能去看他们而请求原谅。当我们吃完晚饭已经是晚上九多了，所以即使我们尝试去拜访，父母可能已经上睡觉了。我们顺路接了莱恩，最终在午夜前刚开进我公寓的停车场。


    莱恩说：“嘿，谢谢你们。我很感谢你们送我。”他从皮特的车里跳出来，跑向相邻的公寓楼，他住在那里。


    我握住皮特的手：“好的，皮特。谢谢。谢谢这一切。明天的行程将包括想办法我们该如何在不触犯妨碍司法罪的情况下，把斯蒂特的提包交给警察。”


    皮特笑了笑：“那应该会很有趣。”


    “明天见。”我下了车，皮特也跟着下车。“你要去哪？”


    他走到我身旁。“我想送你回门口。”


    “为什么？”


    他耸了耸肩。“周围有很多形迹不端的人。”


    我环顾了一下小区。唯一的“人物”是几个跌跌撞撞下楼梯的并不不安分的兄弟会男生，以及我楼层两个敞开的门之间大声交谈的女孩。“我觉得我大概没事的。”


    他翻了个白眼，嘟囔道：“你越想表现得绅士，就越一无是。”


    我笑了。“请安全开车回家。”


    他回到了车里，我觉得他有些不情愿。我舒了一口气。现在是时候对付库珀了。我走上楼梯，直奔他的公寓，准备好结束这一切。


    库珀在门口接我，手里拿着一束漂亮的花，带着甜美的微笑。“嘿，朱莉叶。这些是送给你。”


    我接过花，深吸了一口香气，心里感到一阵刺痛。“谢谢你，库普。它们很美。”


    “进来吧，”他说，拉着我的手带我走向他的沙发。


    “抱歉我刚才放了你鸽。我必须保持专注。”


    “没关系。你找到你想找的东西了吗？”


    我只告诉他我要离开城待一整天处理一个大案子，没有说其他细节。“是的。我想我们应该谈谈——”


    他把手放在了我的手臂上。“你知道我通常不是那种会打断别人的人，但有些话我说，所以我直说了吧。我想公开我们的关系。”


    我的心里一收紧，我能做的就是盯着他。盯着他那双大大的蓝色小狗眼睛。当我终于找回声音时，我说：“你确定这是好主意吗？”


    “我确定。我想能带你出去，在卧室之外更好地了解你。虽然我们现在的关系很有趣，但我知道如果我们给彼此一个机会，我们可以过得很好。”


    噢，不，不，不。我怀疑过他对我意思，但我以为我可以很容易地与他保持距离。我想得错了。“我们应该后退一步考虑一下这事。”


    “为什么？你是……”他皱起眉头。“你是觉得跟我在一起很丢脸吗？”


    “不。”是。。我们的年龄差距极不恰当。这可能也是为什么我们的安排对我如此有吸引力。它感觉很危险，但并没有真正的危险，而我不需要更多的危险了。


    “那到底是什么？”


    我叹了口气。“我现在不想建立关系。我的生活太乱了。”


    他变得好了一点。“所以你的意思是你需要一些时间？我可以接受。”


    “不，我不是那个意——”


    库珀俯过身吻了我。“我会向你证明这是一个好主意。”


    ---


    当我在为 Java Jive 咖啡馆制作早晨点心时，一边努力保持清醒，一边打了个大哈欠。皮特昨晚晚告诉我，警察已经把咖啡馆还给了我们，所以我比平时来得更早，以便在他们的调查结束后我收拾一下。我设法相当很快地从库珀身边脱身回到家，但令我失望的是（尽管并不意外），我没能睡着。当我躺在床上时，我觉得卧室梳妆台上的斯蒂特的提包像是在那里嘲笑我。我必须对那件东西做些处理。如果警察还没有在找它，他们很快就会找了。于是，我熬了一整晚，制定了一个希望能让皮特和我都不陷入法律麻烦的计划。


    当皮特的祖母格蒂来吃日常早餐时，我几乎要站着睡着了。


    (注：提示中提供的剩余文本似乎是乱码/重复的占位符。根据保留核心内容和优化格式的指令，我处理了上述连贯的叙述部分。)


