    he was holding up (which didn’t appear to be so great), but I needed to keep my
    wits about me and try to think of a way out of this.


    “No, he wouldn’t have,” I answered, hardening my expression. “He got the karmic
    kick in the nuts he deserved, though, right?”


    Daniel shrugged. “He pissed plenty of people off. It was time.”


    “I want to know who killed him. If you’re going to kill me, I deserve to know
    that much.”


    “Okay. It was Mandi…mostly.”


    “How do you ‘mostly’ kill someone?”


    “She put the drugs in his drink, which I delivered to him.”


    “Was it a lethal mix of levodopa and sodium oxybate?”


    Daniel seemed impressed. “You’ve done your homework.”


    Pete interjected, “Um…that means you sort of killed him, too.”


    I stared at Daniel. “Hold on. You and Mandi were with Scott here in Nashville
    right before he came to see me, boo-hooing about Mandi being kidnapped? What the
    hell’s up with that?” Did Scott lie to me from the get-go?


    “The alleged kidnapping was a ploy Mandi and I thought up to get Scott to hand
    over his blackmail information. When he refused to trade his info for her life
    and tried to look for her on his own, she got pissed. I agreed to help her do
    something she’d been wanting to do for a while. I arranged to meet Scott at a
    bar to urge him to make a better decision about the blackmail, but he wouldn’t
    listen to reason. Mandi was also at the bar, but she stayed out of his sight.
    Scott didn’t know she was there, and he never knew what hit him.”


    The phone on Java Jive’s kitchen wall rang, and Daniel took his eyes off us for
    a second. I quickly swiped the small but sharp knife and slid it into my back
    pocket.


    His bravado wavering, he demanded, “Who knows you’re here?”


    Hoping he hadn’t heard the tail end of my conversation with Ryder, I said innocently,
    “It’s only a little after ten. Someone’s always here closing up at this time.
    We often get calls after hours.” While he was stewing about the phone, I went
    on, “Hey, to settle my own curiosity, did Mandi disappear on her own—the second
    time—or did you have something to do with it?”


    He smirked at me, which gave me all the answer I needed. “She was at the cabin.
    Indisposed, of course. Sodium oxybate makes people incredibly pliable and quiet.
    But if you’d looked a little harder that first morning, you might have found her,
    which was why I had to distract you.”


    What a psycho. “Well, I have to hand it to you—locking us in Uncle Randy’s creepy
    cellar was a real distraction.”


    “I thought so.”


    “Speaking of distractions, Dr. Sophie Miller is an awfully pretty thing.”


    His eyes got a bit strained, but a ghost of a smile crossed his lips. “She’s quite
    an attractive woman, yes.”


    “So Scott blackmailing you and your lady doctor friend was enough to turn you
    from his BFF to his co-killer? Pretty harsh, if you ask me.”


    Daniel frowned for the first time. “He had no right to even speak to Sophie. She
    has nothing to do with this.”


    I nodded, moving a little closer to him. I knew better than to bring a knife (a
    paring knife, at that) to a gunfight, but something had to happen here. He wasn’t
    going to keep talking all evening.


    “You’re saying Dr. Sophie has no idea all the fun new toys she’s been getting
    from your bogus nonprofit are actually kickbacks from Silver Spruce?”


    “They’re not technically kickbacks. The items are purchased through Silver Spruce’s
    philanthropic fund and then routed through the nonprofit.”


    “Do they know how much of their budget you’re wasting on her? Probably not, or
    else you wouldn’t be going to such lengths to conceal it.”


    He bristled. “It’s not a waste. The clinic needs supplies or they’ll be forced
    to shut their doors. It would crush Sophie if that happened.”


    “I still can’t get over the fact that she believes a nonprofit no one’s ever heard
    of is feeding her a steady stream of donations that get delivered by you. You
    sure she’s a real doctor? Because she sounds kind of dumb if she doesn’t realize
    what’s going on here.”


    As Daniel’s eyes flashed with rage, Pete threw me a horrified glance and shook
    his head slightly. I was sure he didn’t think it was a good idea to poke at Daniel,
    but I felt like I was getting somewhere with him. I had a disturbing amount of
    experience at getting sociopaths to crack under pressure, and I felt like I’d
    found the right thing to pick at with this particular lunatic.


    Glaring at me, he spat, “How dare you say things like that about her? She’s brilliant
    and beautiful, and…and perfect in every way.”


    “Hmm. And hard to get into the pants of, evidently. You sound like a tween girl
    with a crush.” As I was speaking, I took another step toward Daniel and turned
    my back a bit in Pete’s direction. I pulled the knife slightly out of my pocket,
    hoping Pete would see it and know I had at least part of a plan. “What’s the matter,
    Danny? Is your normal Don Juan routine not enough to win Dr. Sophie’s heart? If
    you had to supplement your moves with a hundred grand worth of medical equipment,
    you must be losing your touch, buddy.”'
