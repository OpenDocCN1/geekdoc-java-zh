  trans: '

    麦凯叹了口气回答道：“可能没什么什么，但当曼迪昨天下午跑完业务回到办公室时，她看起来……很难过。甚至很动摇。我当时正去茶水间拿咖啡，看到她哭着躲进了女洗手间。”


    我问：“你查出是怎么什么事了吗？”


    他摇了摇头。“我……我以为这和她丈夫的去世有关。对我来说，她可能会发崩溃是完全正常的，尤其是刚开始来这里的时候。”


    “换句话说，你什么都没有尝试去安慰一个刚刚失去丈夫的员工——一个同类的人类。”


    “这个，没有……但是——”


    “你知道的，麦凯先生，当我的员工明显很难过时，我会尝试帮助他们。你不觉得这是你作为经理工作的重要部分吗？要确保你监管的员工过得还好？”


    赖德用手抹了把脸，试图掩住脸上呼之欲出的冷笑意。


    从麦凯额头上渗出的汗珠来看，我判断自己触碰到他的神经了。“我的工作不是每次办公室里有女人哭泣我就得担心，”他大声反驳道。


    赖德低声咕哝道：“这招下错了，伙计。”


    我盯着麦凯。“哇。一个厌女者。我最喜欢的类型。”


    麦凯在我的目光下缩了缩脖。


    我继续道：“我们还需要你核实一下曼迪上周五和周六在哪儿。她说她去外地出差了。对吗？”


    麦凯抓起鼠标点了几几次，皱着眉头看着电脑屏幕。“是的，从周五下午到周六中午左右，她一直都在纳什维尔。”


    这条信息证实了她和斯考告诉我的话。这同时也说明了，在斯考去世后的几小时内，她就在斯考附近，这令人不安。


    “你知道她周六几回到镇上的吗？”我问。


    他再次盯着屏幕。“她在路易斯维尔停下来和几个客户吃晚饭，所以时间会很晚。”


    赖德说：“我想你不会给我们提供那些客户的名字好让我们核实一下吧？”


    “不，没有搜查令不行。但你可以和贾德·费舍尔谈谈，我们的另一位代表。他也参加了那顿晚餐。”


    太巧了。曼迪的男朋友是唯一能就她丈夫去世时的她的不在场证明与我们交谈的人。真方便。


    我说：“我们来谈谈斯考·奥马利。你给他发了一封警告函，不让他再进入大楼。到底是什么促使你威胁要刑事指控的？”


    麦凯松了松领带。“他失控了。他会冲进来，大吼大闹说要毁掉这个地方。我以为他可能会进来伤害人，所以我不得不采取果断的行动。”


    赖德问：“他真的因为失去工作而气成那种程度吗？”


    “他当时完全疯了。作为经理，我是那个负责解雇他的人。让我告诉你，那可不是一次愉快的会面。在我告诉他他的聘用终止——并给出了充分的理由之后——他开始大喊，乱说着各种疯狂的话。”


    “些什么疯狂的话？”


    麦凯停顿了一下，目光移开。“噢，只是一些胡语而已。”


    “全都是胡语？你一个字也听不出来吗？”我问。


    麦凯的脸涨红了。“大意就是他对丢工作感到难过。他变得非常好斗，我立刻让保安人员把他护送出去，没让他得及伤害任何人的机会。”


    “或者没得及偷更多药物的机会？”赖德问，“那是他被解雇的原因之一，对吧？”


    麦凯皱着脸回答道：“是的。他就在我们眼皮底下从其他代表的包里偷样品。现在有几十份样品没法交代。”


    “具体是什么药？”我问。


    “多巴胺、苯二卓西类和 H2 受体阻剂。”


    “请用大白话翻译。”


    麦凯制止了翻白眼的动作，只是勉强忍住。“多巴胺用于治疗帕金森病，苯二卓西类是抗焦虑药物，H2 受体阻剂缓解胃热。噢，还有一位当地神经科医生抱怨，上周早些时候在斯考突然给他办公室打电话后，他发现丢了一些乙酸钠。乙酸钠是用来治疗嗜睡症的药物。银杉林公司不生产这种药，所以我猜这就是为什么斯考不得不找其他办法获取它。”


    “你知道为什么斯考会偷那些特定的药物吗？”


    麦凯耸耸肩回答道：“代表总是存在决定从公司拿药并在黑市出售的风险。现在的药太贵了，人们被迫转而寻找其他渠道。”


    我点了点头。“好的，我明白了。这些药物中会有哪些是斯考可能想滥用的吗？我们一直听到他其实在服用那些据称被偷的药物。”


    麦凯皱起眉。“考虑到他反复的行为，我也在想这一点。苯二卓西类，你可能更熟悉它叫赞安，那是我们竞争对手的产品之一，是我能看到有人会滥用的药物。然而，考虑到斯考最近焦虑的状态，显然他没有服用任何类似于苯二卓西类的药物。H2
    受体阻剂不会带来任何快感，所以我怀疑他不会费心去弄。多巴胺本质上是多巴胺，这很有趣。它可以增加警觉性、能量和自信，而多巴胺是驱动大脑快感中心的动力。我想它能给你提提神，但乙酸钠是
    GHB。”


    赖德说：“别担心，我们会含蓄的。”


    我转向赖德：“我知道那地方。走吧。”


    赖德说：“谢谢你的帮助，麦凯先生。”


    麦凯笨拙地从座位上跳了起来。“求了，求你了。别拿着你的证件冲进理德森医生的办公室去找贾德。我们和那位好医生的关系已经很脆弱了，全亏了斯考和他那只偷手。我们不需要再给他任何拒绝我们拜访的理由了。”

