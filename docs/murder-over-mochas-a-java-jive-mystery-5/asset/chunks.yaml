  trans: '

    我把手放在他的手臂上。“我也不想认为可能有人杀杀了斯科特。但这正是我来这里的原因，而且这次我带了一位真正的侦探。我想查出这件事的真相。”


    “听到这话我很高兴，但我觉得我应该告诉你……”他低了声音，“自从斯科特去世后，曼迪的行为让我很担心。直到今天，她没有缺过一次勤。她并没有表现出悲伤。事实上，周一晚上她还和几个朋友去夜店玩了。诚然，斯科特和曼迪确实有婚姻问题，甚至在办公室里发生过激烈的肢体冲突，但对他去世这件事却如此冷淡。我知道人们在担心她出了什么坏事，但是……当我听到她失踪的消息时，我开始怀疑她是不是故意消失的，你懂我的意思吗。我想说的是，请务必小心——尤其是如果你找到了她的话。”


    “你认为她很危险。”


    他点点头，表情凝重。


    我笑了。“谢谢你告诉我这些。”


    丹尼尔再次点头，肩膀垮了下去，那是我以前从未见过的样子。今天早上，他没有像我们第一次见面时那样装出一副儒雅的样子。斯科特的妻子可能没有悲伤，但他的老哥们却有。


    当他把手放在门把上准备让我们出去时，我说：“等一下。如果你不介意，关于斯科特我还有一个问题。”


    他带着忧伤的微笑转过身。“不介意。”


    “你的老板告诉和我档，斯科特被解雇后，他因为某事发了火，胡言乱语。但当我们试图让 `McKay` 说明斯科特到底说了什么时，他却沉默了，变得闪闪烁烁。他绝对在试图隐藏什么。在事情发生时你在场吗？有没有听见说了什么？”


    “不在，但我敢打赌我能很快查出来。`McKay` 的酒量是出了名的差。给我午饭后的时间。我会从他那里打听出来的。”


    ---


    在去理查森博士办公室的路上，我向莱德详细说明了我和丹尼尔的谈话。当我们坐在外外的停车场时，我变得一秒一秒地焦躁。


    莱德看向我。“你能放松点吗？玛雅现在正在对 `Jared Fisher` 进行背景调查，所以我们很快就能掌握一些情况。哪怕别的没有，我们也能查到他开的是什么车，这样我们就知道他是否在这里了。”


    “我知道这不会简单，”我嘟囔道。


    “如果调查很容易的话，那大家都能做得了，我们俩都会失业的。”


    “你应该把这句话印在咖啡杯上。”


    莱德忽略了我的话，研究起他的手机。“来了。我们的目标开着一辆黑色的路虎虎。那种车可不会看错。”


    我们环顾了停车场，但没有看到那样的车辆。


    莱德打了 `Doug McKay` 的电话，问他如果 `Jared Fisher` 不在理查森博士的办公室，可能在哪里。他给了我们 `Jared` 今天早上名单上另一个医生的名字，但当我们去那间办公室时，那里也没有
    `Jared` 的踪迹。


    “现在该怎么办？”我说。


    莱德耸了耸肩。“在我们碰壁时，一常这样做。找个办法绕过去。我们去那家伙的房子看看。”他驶出停车场，前往 `Jared` 家的短路程。


    随着我内心的某种不安持续侵扰着我，我心不在焉地用手指敲击莱德汽车的中控控制台。


    片刻，他把手盖在我的手上停下了我的敲击。“有什么事扰你了吗？”


    我叹了口气。“有的。整件事感觉是如此扭曲和悲伤。真的让我很难受。”


    “我觉得这又是一个你离案件太近的例子。你想让我今天处理一些采访吗？我带了监控设备，你可以在车里听。”


    “谢谢你的提议，但不用了。这个摊子是我造成的。”


    “你是被卷进这个局的。至少这次你没有没头撞进去。”


    我给了他一个苦涩的微笑。


    他停在路边，观察了一会儿 `Fisher` 家的房子。“你说这就是上次你跟他聊天时，把你从家里赶出来的家伙？”


    “是的。”


    “让我独自来尝试这一次吧。”


    意识到他说得有道理，我没有反对。他离开的时间仅够他跑上人行道、敲门、问 `Jared` 的妻子一个问题、听她简短的回答，然后跑回车里。


    当他坐在座位上时，他说：“妻子说他今天早上很早就上班了。”


    “但他看起来并没有在工作，因为他不在他该在的地方。我会打他的手机。”我从口袋里掏出手机拨通了 `Jared` 的号码，结果接到了语音信箱。“所以 `Mandi`
    的情夫在她同一时间失踪了。巧合吗？”


    “我不。也许他正在外面找她。”


    “或者他们私奔了。”


    “有可能……但如果他们半秘密的恋情到目前为止一直顺利，他们为什么要放弃好工作和好房子离开呢？”


    “如果他们杀了斯科特，并且认为自己会被抓。”


    “他们看起来并不在通缉名单的前列。”


    “好吧，走吧。”

