- "# 面向对象语言(Java) 实验指导与习题解答\n\n\n\n\n\n# Fore 言\n\n本书主要介绍了 Java 程序设计的基础知识和综合应用，全书分为两部分，第一部分是基础实验，第二部分是习题指导。基础实验部分共有\
  \ 8 个实验，从 Java 程序设计的运行环境开始，由简入深，逐步到更为复杂的应用，每一个实验都是一个完整的案例，通过使用这些直观的教学案例，能有效帮助教师及学生开展对\
  \ Java 基本知识与技术的教与学。习题指导部分为 10 个章节，从 Java 的入门到 Java 的应用程序、线程和异常，每个章节都列出了大量的相关练习题，包括选择题、判断题、填空题、程序填空题、程序改错题、程序阅读题、程序设计题。\n\
  \n本书从介绍基本的编程入门知识开始，循序渐进地增加课程内容的难度，在每一个实验中都列出了具体的实验步骤和代码，同学可以通过实际操作这些代码来完成对知识点的学习与体验，同时，提供了思考题用于学习者反思学习效果，并有助于启迪思维，每一章节的习题都给出了参考答案，方便同学们学习。\n\
  \n本书得到了赣南师范大学校本特色教材立项资助，同时也得到了面向对象程序设计（Java）精品课程组教师们的大力支持。另外，黄媚、肖毅、邱熙雯、张永强、邓凌、周佳文等参与了书中代码的调试工作，在此一并表示感谢！\n\
  \n由于水平有限，尽管编者不遗余力，书中仍可能有错误和不足之处，敬请同行和读者，特别是使用本书的教师和同学们批评指正。\n\n编　者\n\n2017 年 4 月\n\
  \n\n\n# 第一部分　实验\n\n# 实验一　Java 运行环境，Java 程序的编辑、编译与运行\n\n### 一、实验目的\n\n1.掌握设置 Java\
  \ 程序运行环境的方法，并熟悉 Java 程序的集成开发工具。\n2.掌握编辑、编译、运行简单的 Java Application 和 Java Applet\
  \ 程序的方法步骤，初步了解 Java 程序的特点和基本结构。\n\n### 二、实验内容\n\n1.安装 JDK。\n2.进行环境变量的配置。\n3.安装 Eclipse。\n\
  4.熟悉 Eclipse 开发环境。\n5.编写一个 Java Application，利用 JDK 软件包中的工具编译并运行这个程序，使之能够输出字符串信息“Hello\
  \ Java！”\n\n### 三、实验要求\n\n完成 Java 程序开发以及相关配置，并实现 Hello。\n\n### 四、实验过程\n\n1.下载 JDK\n\
