    \n# 第一部分　实验\n\n# 实验一　Java运行环境，Java程序的编辑、编译与运行\n\n## 一、实验目的\n\n1.掌握设置`Java`程序运行环境的方法，并熟悉`Java`程序的集成开发工具。\n\
    2.掌握编辑、编译、运行简单的`Java Application`和`Java Applet`程序的方法步骤，初步了解`Java`程序的特点和基本结构。\n\
    \n## 二、实验内容\n\n1.安装`JDK`。\n2.进行环境变量的配置。\n3.安装`Eclipse`。\n4.熟悉`Eclipse`开发环境。\n\
    5.编写一个`Java Application`，利用`JDK`软件包中的工具编译并运行这个程序，使之能够输出字符串信息“Hello Java！”\n\n\
    ## 三、实验要求\n\n完成`Java`程序开发平台安装以及相关配置，并实现Hello Java。\n\n## 四、实验过程\n\n1.下载`JDK`\n\
    `http://www.oracle.com/technetwork/java/javase/downloads/jdk8－downloads－213351.html`\n\
    以上是下载`JDK`的官方网址，进入后跟着流程走，选择适合于自己平台（这里是Windows）的`JDK`包下载。下载后直接解压就可以使用了。\n\n2.配置环境变量\n\
    在桌面上右击“我的电脑”，依次点击【属性】＞【高级】＞【环境变量】。\n双击【系统变量】里面的`Path`项，将`JDK`中`bin`目录的完整路径添加到这里。\n\
    \n3.下载`Eclipse`\n`https://www.eclipse.org/downloads/`\n以上是下载`Eclipse`的官方网址，进入后跟着流程走，选择适合于自己平台的`Eclipse`包下载。下载后直接解压就可以使用了。\n\
    \n4.编写一个`Java Application`，利用`JDK`软件包中的工具编译并运行这个程序，使之能够输出字符串信息“Hello Java！”\n\
    步骤（1）：编辑、编译`Java`源程序。\n打开`MyEclipse`，新建一个`Java`文件，键入如下程序代码：\n```\n![img](images/txt000_1.jpg)\n\
    ```\n步骤（2）：编译`Java`源程序。\n观察控制台输出。\n```\n![img](images/txt000_2.jpg)\n```\n步骤（3）：运行`Java`源程序。\n\
    观察输出结果。\n```\n![img](images/txt000_3.jpg)\n```\n\n## 五、思考题\n（此处省略，原文未具体内容）\n\n\
    # 实验二　使用流程控制语句编程序\n\n## 一、实验目的\n\n1.掌握流程控制语句的用法。\n2.学会使用流程控制语句解决实际问题。\n\n## 二、实验内容\n\
    \n1.学习`if-else`分支语句。\n2.学习`switch`分支语句。\n3. 学习`for`、`while`、`do-while`循环语句。\n\n\
    ## 三、实验要求\n\n1.能够编写带有流程控制语句的程序。\n2. 理解程序执行的逻辑顺序。\n\n## 四、实验过程\n\n1.编写一个简单的`if-else`程序，判断奇偶。\n\
    2.编写一个使用`switch`语句的计算器。\n3.编写一个使用`for`循环求阶和。\n\n## 五、思考题\n（此处省略，原文未具体内容）\n\n#\
    \ 实验三　类与类之间的关系\n\n## 一、实验目的\n\n1.理解类的继承关系。\n2. 掌握构造方法的重载。\n\n## 二、实验内容\n\n1. 学习`extends`关键字。\n\
    2. 学习`super`关键字的使用。\n3. 学习方法的重写。\n\n## 三、实验要求\n\n1.能够实现简单的类继承。\n2. 理解子类对类的类的。\n\
    \n## 四、实验过程\n\n1. 定义父类`Shape`。\n2. 定义子类`Circle`和`Rectangle`。\n3. 使用`super`调用父类方法。\n\
    \n## 五、思考题\n（此处省略，原文未具体内容）\n\n# 实验四　编制用户自己的异常类\n\n## 一、实验目的\n\n1.理解异常处理机制。\n2.学会使用`try-catch-finally`处理异常。\n\
    \n## 二、实验内容\n\n1. 自定义一个异常类。\n2. 在程序中使用`throw`和`throws`关键字。\n\n## 三、实验要求\n\n1.能够抛出并捕捉自定义异常。\n\
    2. 理解异常的堆栈信息。\n\n## 四、实验过程\n\n1. 创建继承`Exception`的类`MyException`。\n2. 在方法中抛出该异常。\n\
    \n## 五、思考题\n（此处省略，原文未具体内容）\n\n# 实验五　文件操作\n\n## 一、实验目的\n\n1.掌握文件的读写操作。\n2. 学会使用`File`类和输入输出。\n\
    \n## 二、实验内容\n\n1. 使用`BufferedWriter`写入数据。\n2. 使用`BufferedReader`读取数据。\n\n## 三、实验要求\n\
    \n1.能够完成基本的文件读写。\n2. 理解文件流的概念。\n\n## 四、实验过程\n\n1. 创建一个`.txt`文件并写入内容。\n2. 读取该文件内容并打印。\n\
    \n## 五、思考题\n（此处省略，原文未具体内容）\n\n# 实验六　Java Applet编程与事件的处理机制\n\n## 一、实验目的\n\n1.了解`Applet`的基础。\n\
    2. 学会事件监听机制。\n\n## 二、实验内容\n\n1. 编写一个简单的`Applet`。\n2. 实现点击事件处理。\n\n## 三、实验要求\n\n\
    1.能够运行一个简单的`Applet`。\n2. 理解事件处理器的原理。\n\n## 四、实验过程\n\n1. 编写继承`Applet`的类。\n2. 添加`ActionListener`监听。\n\
    \n## 五、思考题\n（此处省略，原文未具体内容）\n\n# 实验七　动画及声音的设置\n\n## 一、实验目的\n\n1.掌握简单的动画实现。\n2.\
    \ 学会处理音频文件。\n\n## 二、实验内容\n\n1. 使用`线程`实现动画。\n2. 播放`.wav`文件。\n\n## 三、实验要求\n\n1.能够实现基础动画效果。\n\
    2. 理解资源的使用。\n\n## 四、实验过程\n\n1. 编写一个移动图形的程序。\n2. 加载并播放背景音乐。\n\n## 五、思考题\n（此处省略，原文未具体内容）\n\
    \n# 实验八　Java与数据库的连接\n\n## 一、实验目的\n\n1.了解`JDBC`连接。\n2. 学会对数据库进行操作。\n\n## 二、实验内容\n\
    \n1. 建立数据库连接。\n2. 执行`SQL`语句并获取结果。\n\n## 三、实验要求\n\n1.能够连接数据库并查询数据。\n2. 理解`JDBC`的流程。\n\
    \n## 四、实验过程\n\n1. 配置数据库驱动。\n2. 编写连接代码执行。\n\n## 五、思考题\n（此处省略，原文未具体内容）\n"
