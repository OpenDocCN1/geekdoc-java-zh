    ## 三、实验要求


    1.必须编写成Java Applet程序。


    2.程序界面要有时间、日期显示。


    ## 四、实验过程


    1.进入Java编程环境（这里以Eclipse为例）。


    ![img](images/txt008_2.jpg)


    图1－7－2　程序建立界面


    2.新建一个Java文件，命名为Zhong.java（右击mycode，选择新建，点击类，在名称栏填写Zhong，点击完成）。


