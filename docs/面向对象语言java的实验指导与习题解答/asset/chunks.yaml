    \n# Fore 言\n\n本书主要介绍了 Java 程序设计的基础知识和综合应用，全书分为两部分，第一部分是基础实验，第二部分是习题指导。基础实验部分共有\
    \ 8 个实验，从 Java 程序设计的运行环境开始，由简入深，逐步到更为复杂的应用，每一个实验都是一个完整的案例，通过使用这些直观的教学案例，能有效帮助教师及学生开展对\
    \ Java 基本知识与技术的教与学。习题指导部分为 10 个章节，从 Java 的入门到 Java 的应用程序、线程和异常，每个章节都列出了大量的相关练习题，包括选择题、判断题、填空题、程序填空题、程序改错题、程序阅读题、程序设计题。\n\
