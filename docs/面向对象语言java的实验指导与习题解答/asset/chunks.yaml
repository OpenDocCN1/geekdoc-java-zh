    \n[实验八　Java与数据库的连接](#txt029.xhtml_txt029_1)\n\n# 第一部分　实验\n\n# 实验一　Java运行环境，Java程序的编辑、编译与运行\n\
    \n## 一、实验目的\n\n1.掌握设置Java程序运行环境的方法，并熟悉Java程序的集成开发工具。\n\n2.掌握编辑、编译、运行简单的Java Application和Java\
    \ Applet程序的方法步骤，初步了解Java程序的特点和基本结构。\n\n## 二、实验内容\n\n1.安装JDK。\n\n2.进行环境变量的配置。\n\
    \n3.安装Eclipse。\n\n4.熟悉Eclipse开发环境。\n\n5.编写一个Java Application，利用JDK软件包中的工具编译并运行这个程序，使之能够输出字符串信息“Hello\
    \ Java！”。\n\n## 三、实验要求\n\n完成Java程序开发平台安装以及相关配置，并实现Hello Java。\n\n## 四、实验过程\n\n\
    1.下载JDK\n\nhttp://www.oracle.com/technetwork/java/javase/downloads/jdk8－downloads－2133151.html\n\
    \n以上是下载JDK的官方网址，进入后跟着流程走，选择适合于自己平台（这里是Windows）的JDK包下载。下载后直接解压就可以使用了。\n\n2.配置环境变量\n\
    \n在桌面上右击“我的电脑”，依次点击【属性】＞【高级】＞【环境变量】。\n\n双击【系统变量】里面的Path项，将JDK中bin目录的完整路径添加到这里。\n\
    \n3.下载Eclipse\n\nhttps://www.eclipse.org/downloads/\n\n以上是下载Eclipse的官方网址，进入后跟着流程走，选择适合于自己平台的Eclipse包下载。下载后直接解压就可以使用了。\n\
    \n4.编写一个Java Application，利用JDK软件包中的工具编译并运行这个程序，使之能够输出字符串信息“Hello Java！”\n\n步骤（1）：编辑、编译Java源程序。\n\
    \n打开MyEclipse，新建一个Java文件，键入如下程序代码：\n\n![img](images/txt002_1.jpg)\n\n将文件命名为Hello.java，保存文件Hello.java到某路径（“e：\\\
    java\\”）下。\n\n步骤（2）：编译Java源程序。\n\n打开命令提示符窗口（MS－DOS窗口）进入Java源程序所在路径e：\\java\\、键入编译器文件名和要编译的源程序文件名，按回车键开始编译（注意：文件名H要大写，否则运行会出问题）。如果源程序没有错误，则屏幕上没有输出；否则，将显示出错信息。\n\
    \n步骤（3）：运行Java程序。\n\n在命令提示符窗口或MS－DOS窗口键入解释器文件名和要解释的字节码文件名，按回车键即开始解释并可看到运行结果。\n\
    \n## 五、思考题\n\n编程输出以下信息：\n\n![img](images/txt002_2.jpg)\n\n# 实验二　使用流程控制语句编程序\n\n\
    ## 一、实验目的\n\n理解Java基本语法，掌握Java的基本数据类型和控制结构，熟悉简单的数据和字符串操作。\n\n## 二、实验内容\n\n编写一个Java程序，输出区间［200，300］上的所有素数，并统计素数的个数。\n\
    \n## 三、实验要求\n\n1.使用双重for循环等语句实现。\n\n2.从屏幕输出区间［101，200］上的所有素数。\n\n## 四、实验过程\n\n\
    1.进入Java编程环境（这里以Eclipse为例）。\n\n![img](images/txt003_1.jpg)\n\n图1－2－1　工程建立界面\n\n\
    2.新建一个Java文件，命名为Exam.java（右击mycode，选择新建，点击类，在名称栏填写Exam，点击完成）。\n\n![img](images/txt003_2.jpg)\n\
    \n图1－2－2　工程建立的目录\n\n3.开始写实现输出区间［101，200］上的所有素数且输出素数个数的代码。\n\n![img](images/txt003_3.jpg)\n\
    \n}\n\n![img](images/txt003_4.jpg)\n\n图1－2－3　程序建立界面\n\n4.编译运行程序，观察输出结果。\n\n![img](images/txt003_5.jpg)\n\
    \n图1－2－4　程序运行结果\n\n## 五、思考题\n\n1.阅读下列程序，分析运行结果：\n\n![img](images/txt003_6.jpg)\n\
    \n2.指出以下程序段的错误：\n\n![img](images/txt003_7.jpg)\n\n# 实验三　类与类之间的关系\n\n## 一、实验目的\n\
    \n熟悉Java类之间的结构，掌握类、方法和属性的定义，理解类的继承。\n\n## 二、实验内容\n\n1.定义一个“圆”类，该圆类的数据成员包括：圆心位置及圆的半径；方法成员有：构造方法、设置圆心位置、获取圆的圆心位置。要求构造方法可以接收圆心位置参数，而半径使用缺省值1。\n\
    \n2.定义以上圆的子类，使它具有构造方法、获取半径方法、设置半径方法和计算圆的面积并输出，要求构造方法可同时接收圆心位置及半径两个参数。\n\n3.编写完整的程序实现上述两个圆类的对象，并且分别调用以上方法，对比这些方法的执行结果。\n\
    \n## 三、实验要求\n\n1.实现两个类的继承。\n\n2.程序应包括各个被调用方法的执行结果的显示。\n\n## 四、实验过程\n\n1.进入Java编程环境。\n\
    \n![img](images/txt004_1.jpg)\n\n图1－3－1　登录应用界面\n\n2.新建一个Java文件，命名为circles.java。\n\
    \n![img](images/txt004_2.jpg)\n\n图1－3－2　程序设置界面\n\n3.定义圆类fatherCircle，按实验内容1定义它的属性和方法。\n\
    \n![img](images/txt004_3.jpg)![img](images/txt004_4.jpg)\n\n4.定义子类sunCircle，按实验内容2定义它的属性和方法。\n\
    \n![img](images/txt004_5.jpg)\n\n5.定义主类和主方法，构建上述两个类的对象fatherObject和sonObject，并通过这两个对象调用它们的属性和方法，输出方法执行结果。\n\
    \n父类圆中圆心的坐标为：10.0，10.0\n\n子类圆中圆心的坐标为：位置为：20.0，20.0半径为：120.0\n\n![img](images/txt004_6.jpg)\n\
    \n## 五、思考题"
