  // 约束 4：Diana 在晚上 6 点到晚上 8 点有志愿者活动，\n// 并在晚上 8 点到晚上 11 点有工作\nfunction c4(d) {\n\
  \  return (d < 6 || d > 22)\n}\n```\n\n### 第 4 步：主算法\n我们将使用一个简单的“生成与搜索”算法来解决调度问题。\n\
  \n它的工作原理是，对于每个朋友的每个小时，算法将检查小时的组合是否有效——基于我们在第 2 步和第 3 步中创建的目标和约束函数。\n\n为了构建此算法，请为所有需要安排的朋友创建系列嵌套迭代循环，如下所示。\n\
  \n```javascript\n// 主算法：生成与搜索\nfor (v = 0; v < Anna.length; v++) {\n```\n\n\n\n\n\
  \n```javascript\nfor (w = 0; w < Betty.length; w++) {\n  for (x = 0; x < Cara.length;\
  \ x++) {\n    for (y = 0; y < Donna.length; y++) {\n      if (g1(Anna[v], Betty[w],\
  \ Cara[x], Donna[y])\n        && c1(Anna[v])\n        && c2(Betty[w])\n        &&\
  \ c3(Cara[x])\n        && c4(Donna[y])\n      ) {\n        // === 解决方案结果\n     \
  \   print(\"Anna, Betty, Cara, and Diana can hang out at: \" + Anna[v] + \":00\"\
  )\n        // ===\n      }\n    }\n  }\n}\n```\n\n如果你使用了上述步骤中的所有示例代码并编译/运行，输出如下：\n\
  \nAnna, Betty, Cara, and Diana can hang out at: 9:00 \n\nAnna, Betty, Cara, and\
  \ Diana can hang out at: 10:00\n\nAnna, Betty, Cara, and Diana can hang out at:\
  \ 16:00\n\nAnna, Betty, Cara, and Diana can hang out at: 17:00\n\n## 计算量：生成与测试 (Generate-and-Test)\n\
  \n此过程会产生大量的小时组合需要检查。粗来说，它是每个人的小时数，关于需要安排的人数的次方：\n\n`(#小时数) ^ (#人数)`\n\n在我们的示例中，时间范围是\
  \ 9 点到 23 点，所以每个人有 15 个小时。我们有四位朋友。因此有 `15⁴ = 50625` 种可能的组合组合需要检查。别担心，我们幸运有计算机为我们解决这个问题。\n\
  \n## Javascript 01d：调度求解器，快速版\n\n对于下面的过程，请选择你任的 IDE。你也可以使用在线 IDE，如 [rextester.com](http://rextester.com)、[ideone.com](http://ideone.com)\
  \ 或 [codpad.org](http://codpad.org)。\n\n如果你觉得 50625 种组合处理起来很大，那确实如此。有时对于计算机系统本身也是如此。\n\
  \n但如果我告诉你可能有另一种方法呢？\n\n如果存在机会用更少的精力解决调度问题呢？\n\n在这个备选版本中，我们首先移除每个朋友不可用的时间段，然后生成解决方案。\n\
  \n### 步骤 1 & 2：\n\n这些步骤没有变化。它们遵循与原始版本相同的代码。\n\n### 步骤 3：时间限制\n\n在这里，我们修改了约束功能（Constraint\
  \ Functionality）。\n\n注意它们不再是函数，而是要执行的直接过程化代码。每个人的不可用时间被推入一个 `array`（数组），该数组用于清除该朋友的时间段，直到只剩下可用时间。\n\
  \n我们使用这个函数来帮助自己：\n\n```javascript\n// 输入：两个数组，1 & 2\n// 输出：无\n// 效果：删除第二个数组中任何存在于第一个数组的元素\n\
  \nfunction searchDelete(array1, array2) {\n  for (i=0;i<array1.length;i++) {\n \
  \   for (j=0;j<array2.length;j++) {\n      if (array2[j] == array1[i]) {\n     \
  \   array2.splice(j, 1)\n      }\n    }\n  }\n}\n```\n\n但你可能在想，为什么我们不直接删除项？这是因为一旦数字被删除，`array`\
  \ 中其后的项就会向前移动。一旦迭代移动到下一个项，它就会跳过一个项。\n\n```javascript\n// 约束过程\n// 约束 1：Anna 上午 11\
  \ 点到下午 1:50 有课\ndelList = []\nfor (a=0;a<Anna.length;a++) { // $Anna.each do |a|\n\
  \  x = Anna[a]\n  if (x >= 11 && x < 14) {\n    delList.push(x)\n    //Anna.splice(a,\
  \ 1) // 直接删除\n  }\n}\n// (删除 Anna 的所有不可用时间)\nsearchDelete(delList, Anna)\n\n// 约束\
  \ 2：Betty 中午到下午 3 点有课，\n// 之后有舞蹈练习到下午 4 点\ndelList = []\nfor (b=0;b<Betty.length;b++)\
  \ {\n  x = Betty[b]\n  if (x >= 12 && x < 16) {\n    delList.push(x)\n  }\n}\n//\
  \ (删除 Betty 的所有不可用时间)\nsearchDelete(delList, Betty)\n\n// 约束 3：Cara 晚上 7 点到 11 点要上班\n\
  delList = []\nfor (c=0;c<Cara.length;c++) {\n  x = Cara[c]\n  if (x >= 19 && x <=\
  \ 23) {\n    delList.push(x)\n  }\n}\n// (删除 Cara 的所有不可用时间)\nsearchDelete(delList,\
  \ Cara)\n\n// 约束 4：Donna 晚上 6 点到 8 点有志愿者服务时间，\n// 晚上 8 点到 11 点要上班\ndelList = []\n\
  for (d=0;d<Donna.length;d++) {\n  x = Donna[d]\n   ( (x >= 18 && x <= 22) {\n  \
  \  delList.push(x)\n  }\n}\n// (删除 Donna 的所有不可用时间)\nsearchDelete(delList, Donna)\n\
  ```\n\n\n\n\n如果需要，我们还可以轻松添加更多事实和知识。可以有一个或两个真实事实。然后，两个真事实或假事实会导致另一个真相。以此类推。例如，我们可以说出一个真陈述，比如“外面是晴天”，然后是另一个，比如“外面很暖”。这些陈述会导致另一个真相：“外面既晴朗又温暖。因此，我要跑步一英里”。\n\
  \n如果你将上述内容合并为一个命题语句，它看起来是这样的：\n\n“我要跑步一英里” <— “外面是晴天” AND “外面是晴天”\n\n如果你使用 `variableName`\
  \ 标签来表示上述语句，看起来是这样的：\n\n`c <— b AND a`\n\n## 使用逻辑调试\n\n相反，你可以使用逻辑来解释某个事实的根源。如果一个陈述是真实的，它可以通过另一个事实得到解释和证明，然后这些事实又由更多的事实得到证明，以此类推。这里有一个例子：你发现“遥控器无法打开电视”。你仔细观察遥控器，发现“它的电池没电了”。你更换了遥控器的电池，尝试打开电视，结果发现它仍然无法打开。你检查了电视电源线，发现“它没有插好”。好的，你把它插好，再次尝试打开。这一次，它成功了。\n\
  \n你可以将上述内容作为逐步的逻辑语句，如下：\n\n1) 真：“遥控器无法打开电视。”\n2) 真：“电视电源线没有插好”\n3) 真：“遥控器电池没有电”\n\
  AND “电视电源线没有插好”\n\n这种程序通常用于调试；如果你发现某处无法正常工作，你必须回头检查其内部运作，以找出导致该问题的原因。\n\n## AI 如何分析基于逻辑的系统\n\
  \nAI 代理可以根据某些条件是否真实来分析给定的系统。这些条件将导致其他条件的为或为假，然后是其他条件，以此类推。\n\n执行此操作有两种通用程序。第一种是**自上而下的诊断**，程序将检查某些关键条件（最可能是影响其他条件的最顶部语句），然后遍历系统以查看结果。\n\
  \n另一种是**自下而上的诊断**，程序将检查为什么某个终端状态符合或不符合预期。这是通过检查哪些其他条件导致了这种状态来实现的。\n\n## Javascript\
  \ 02a: 使用基于逻辑的 AI\n\n对于下面的程序，请选择你选择的 IDE。你也可以使用在线 IDE，如 [rextester.com](http://rextester.com)、[ideone.com](http://ideone.com)\
  \ 或 [codpad.org](http://codpad.org)。\n\n市上有许多设计和系统。几乎所有的都可以表示为基于逻辑的系统——可以由 AI 系统进行诊断、修复和分析。然而，为了让\
  \ AI 代理很好地管理系统，程序员必须非常了解该系统。然后，程序员必须将系统表示为良好的逻辑代码。\n\n例如，你家中的电线系统可以使用一系列真/假系统来构建。墙上的插座以及房间里的灯都是真/假开关，它们接收来自断路器和配线盒的供电——更多组真/假开关。这种设计造了家庭开发人员，因为他们可以追踪从外部进入的主电源，并判断电力是否流向所有插座、灯光以及房屋内任何需要用电的地方。这种设计也造了住户；如果某个灯或插座不工作，可以一直追溯线路到外部源头，查看电是在哪里被切断的。\n\
  \n### 房屋水流示例：\n\n下面是一个一室套房的水流图：\n![M-AI-WaterDiagram.jpg](img/00001.jpeg)\n\n浴缸、洗手间水池和厨房都有龙头。洗衣机可以运行短段时间，使用冷热水的组合。马桶有一个开关，可以将水流引向它。马桶处于冲水状态或非冲水状态。此外，还有一个开关向锅炉系统供水或不供水。还有标记为\
  \ `A` 到 `H` 的龙头，可以停止或允许水流。最后，总水开关可以允许或停止进入整个套房的总水流。\n\n水是否会从某个水源流出，取决于房屋内的连接、水龙头和开关。\n\
  \n#### 开关和龙头在哪里？\n\n你想要做的第一件事是识别上述系统中的哪些水流点可以开启或关闭。\n\n如果你查看图表，开关有：\n- 浴缸、洗手间和厨房的一对冷热龙头\n\
  - 洗衣机的一对冷热开关\n- 标记为 `A - -H` 的龙头\n- 锅炉开关\n- 总水开关\n\n这些将是布尔龙头，其值为 `TRUE`（真）、`FALSE`（假），或取决于另一个开关/龙头的真假状态。\n\
  \n#### 将系统表示为逻辑语句\n\n在这个阶段，最好先不要代码。我们需要确定每个开关如何将水输送到下一个开关——一直到为居民供水的终端龙头。\n\n我们可以从马桶开始。房屋居民通过冲马桶来使用水。我们可以有一个这样的语句：“马桶可以冲水。因此，它连接到了水。”\n\
  \n```\nThe Toilet can Flush. Therefore, it is connected to the water.\n```\n\n```\n\
  `c <— b AND a`\n```\n\n\n\n\n\n## 表示方案\n\n对于人工智能单元要能够为你生成数据和解决方案，它通常需要某种数据源。\n\n\
  而且有时，这种数据源依赖于环境：AI 代理体需要确定并观察它所关注的环境。\n\n因此，AI 代理体需要用数据来对其环境进行表示。之后，它可以使用它自己的算法处理这些数据并生成解决方案。\n\
  \n## Javascript 03a：使用 Javascript 构建环境模型\n\n对于下面的步骤，请选择一个你喜的 IDE。你也可以使用在线 IDE，例如\
  \ [rextester.com](http://rextester.com)、[ideone.com](http://ideone.com) 或 [codpad.org](http://codpad.org)。\n\
  \n### 环境建模\n\n人工智能中一个至关重要的元素是拥有其关注环境的代码模型。为了让你的 AI 代理体能够创建解决方案，它需要了解它的环境及其周围。\n\n\
  所以，为 AI 代理体建模环境有两种主要方法。\n\n首先，你可以使用“红灯”原则——对 AI 代理体关注的可能状态或条件进行枚举。这是一种非常简单的环境表示方式。\n\
  \n例如，AI 代理体可以监控你最近的路口的交通信号灯，并确定灯将是什么颜色（红色、黄色或绿色）。\n\n使用这种方法对 AI 代理体关注的任何内容进行非常简单的解释。\n\
  \n```javascript\nvar trafficLights = [\"Red\", \"Yellow\", \"Green\"]\n```\n\n其次，你可以将环境特征描述为详细的数据表示。通过面向对象编程，你可以简单地创建关于\
  \ AI 环境观测的类对象——将许多小细节作为类字段。使用这种方法进行更自然、更详细的环境观测。\n\n```javascript\nfunction BeachVisit\
  \ (loc, tide, crowd, temp) {\n\n  this.location = loc\n  this.tide = tide\n  this.crowdSize\
  \ = crowd\n  this.temperature = temp\n}\n\nvar b1 = new BeachVisit(\"Santa Monica\
  \ Beach\",\n\n  \"high\",\n  \"large\",\n  \"81f\")\n\nvar b2 = new BeachVisit(\"\
  Santa Monica Beach\",\n\n  \"medium\",\n  \"medium\",\n  \"78f\")\n```\n\n### 使用数据组合的环境模型\n\
  \n如果你选择让 AI 代理体通过面向对象编程来描述环境，你也可以连接两个不同类的对象。你在它们之间建立一种关系，并注意它们是如何连接在一起的。\n\n例如，我们可以将我们的海滩访问对象与照片将它们连接起来：\n\
  \n```javascript\n//（假设实例 b1 - b25 已创建）\n// 将所有海滩访问放入数组：\nvar allBeachVisits = [b1,\
  \ b2, b3, b4, b5]\n\n//（假设实例 ph1 - ph7 已创建）\n// 将所有照片放入数组：\nvar allPhotos = [ph1,\
  \ ph2, ph3, ph4, ph5, ph6, ph7]\n\n// 可能的关系命题：\n// #1: 已拍摄的照片\n// 命题：如果在海滩访问期间拍摄了照片，返回\
  \ TRUE\nfunction photoTakenAtVisit(ph1, b3)\n\n// #2: 在拍摄的照片\n// 命题：如果在海滩访问地点拍摄了照片，返回\
  \ TRUE\nfunction photoTakenHere(ph3, b5)\n```\n\n## Javascript 03b：创建一个模型环境\n\n\
  对于下面的步骤，请选择一个你喜的 IDE。你也可以使用在线 IDE，例如 [rextester.com](http://rextester.com)、[ideone.com](http://ideone.com)\
  \ 或 [codpad.org](http://codpad.org)。\n\n现在让我们练习为我们的 AI 创建供其检查的环境。这些在之后将整合在一起，因为\
  \ AI 代理体将有机会利用它既定的知识和能力来探索它的环境。\n\n### 建模房屋\n\n建模环境最简单的方法是前面提到的红灯原则。\n\n如果你用简单的枚举类型数据集合为你的房屋建模，你可能会得到类似的内容：\n\
  \n```javascript\nvar myHouse = [\"livingRoom\", \"diningRoom\", \"den\", \"bathroom1\"\
  , \"bathroom2\", \"hallway\", \"bedroom1\", \"bedroom2\", \"patio\"]\n```\n\n你也可以使用面向对象编程来建模房屋。你可以将房子中的每个房间表示为一个\
  \ `Room` 对象。\n\n```javascript\n// 一个 Room 具有：\n// - 一个名称\n// - 相邻的、连接的房间\nfunction\
  \ Room(name) {\n\n  this.name = name\n  this.connected = []\n  this.addRoom = function(room)\
  \ {\n\n    this.connected.push(room)\n  }\n}\n```\n\n为了现在保持简单，你可以建模位于繁华市中心的一个简单的公寓。\n\
  \n```javascript\n// 在城市里的一个简单公寓中创建 5 个房间\nvar kitchen = new Room(\"kitchen\")\n\
  var livRM = new Room(\"livingRoom\")\nvar dineRM = new Room(\"diningRoom\")\nvar\
  \ bd = new Room(\"bedroom\")\nvar wr = new Room(\"washroom\")\n\n/*\n// 如下连接所有房间：\n\
  // <-> 洗手间 <-> 卧室 <-> 客厅 <-> 厨房 <-> 餐厅 <->\n*/\nkitchen.connected.push(livRM, dineRM)\n\
  livRM.connected.push(bd, kitchen)\nbd.connected.push(wr, livRM)\nwr.connected.push(dineRM,\
  \ bd)\ndineRM.connected.push(kitchen, wr)\n```\n\n建模环境的方法取决于你。\n\n只需记住，你最终将设计与你的模型环境对应的\
  \ AI 代理体。\n\n### 轮到你了\n\n使用 Javascript（或任何编程语言），根据上述内容为你的家建模。首先，使用枚举方法进行红灯建模。然后，作为面向对象编程，用\
  \ `Room` 实例表示每个房间。\n\n\n\n\n\n为了方便运行代码，请选择一个你喜欢的 IDE（集成开发环境：本质上就是你编写和运行代码的地方）。你也可以使用在线\
  \ IDE，例如 `rextester.com`、`ideone.com` 或 `codpad.org`。\n\n### 1) 基础数据类型\n\n#### 布尔值\
  \ (Booleans)\n这些本质上是开关状态的值。在代码中，布尔值将是 `TRUE`（真）或 `FALSE`（假）。\n\n在 `Javascript` 中，布尔值只能小写（即\
  \ `true`、`false`）。布尔值不能包含任何大写字母（即 `TRUE`、`True`）。\n\n示例：\n`true`, `false`\n\n###\
  \ 字符串 (Strings)\n这些是键盘字符 - 包括字母、数字和其他符号 - 按照某种顺序形成一个文本短语。它们以双引号开头和结尾。\n\n示例：\n`\"\
  \ This is a String. \"`\n`\" This 15 4 &^%$! 5tring t00\\. \"`\n\n#### 数字 (Numbers)\n\
  `Javascript` 对所有数字一视同仁。它们都是 64 位浮点数（如果你不知道它的意思，可以去查一下）。\n\n但通常情况下，编程中有两种主要的数字类型：`Integers`（整数）和\
  \ `Floats`（浮点/小数）。\n\n#### 整数 (Integers)\n它们完全正如定义的那样 - 没有分数或小数的整数。这里是一些示例：\n`12`\n\
  `143`\n`19999932`\n\n#### 浮点数 (Floats)\n也称为浮点数，它们代表 `Integers` 的相反 - 它们小数点后的数字。\n\
  \n示例：\n`0.12`\n`.12`\n\n### 2) 变量 (Variables)\n记得小学数学里你用 `X` 和 `Y` 等字母来代表数字吗？教科书中会有\
  \ `let x = 4` 和 `let y = 19` 这样的短语。这些被称为变量。\n\n变量在编程中也普遍存在。但在编程中，你可以给变量命名。而不是数字，变量可以是你分配给它们的任何数据。它们可以是字符串、布尔值、整数等。\n\
  \n在 `Javascript` 中，你可以按照以下语法创建变量：\n`var (变量名) = (初始值)`\n\n或者，可选：\n`(变量名) = (初始值)`\n\
  \n示例：\n`var a = \" This is a String. \"`\n`var b = 122`\n`c = true`\n`d = 0.1234`\n\
  \n将变量想象成形式为 `(名称) 是一个 ____` 的单句。使用变量来告诉计算机关于你代码的某些事实。这个概念就像告诉我消火栓是红色的或者天空是蓝色的一样简单。\n\
  \n### 3a) 创建函数 (Making Functions)\n如果变量是句子，那么函数仅仅是动作或动词。\n\n本质上，函数是一组定义好的指令。当某行代码调用它们的名称时，计算机就会执行这些指令。例如，如果一行代码告诉计算机行走，计算机就会按照指令行走（即向前迈一步，身体前倾，用另一只脚走路等）。\n\
  \n在 `Javascript` 中创建函数，请遵循此语法：\n\n```javascript\nfunc <函数名>( input1, input2, etc…)\
  \ {\n    // 在此处编写代码\n    // 如果函数输出任何数据，请使用下一行：\n    // return (带有数据类型的变量名，或任何数据)\n\
  }\n```\n\n### 3b) 使用函数 (Using Functions)\n要调用函数，只需写出它的名称以及任何输入（如果需要）。\n\n然而，通常有两个地方可以放置函数。\n\
  \n单独占一行：\n`<函数名>(任何必要的输入)`\n\n或者放置在任何期望其输出数据类型的地方：\n`var (变量名) = <函数名>(任何必要的输入)`\n\
  \n示例：\n```javascript\n// 无输出：\nfunctionABC(a, b, c)\n\n// 输出一个整数：\nvar integer1\
  \ = functionABC(a, b, c)\n```\n\n记住；虽然 `Javascript` 是一种比大多数其他语言宽松得多的语言，但你应该将函数放在期望其输出数据的地方。例如，如果函数\
  \ `n1()` 和 `n2()` 各自输出一个数字，请将它们放在代码中期望这些数字的地方：\n`var sum = n1() + n2()`\n\n如果你将函数放在不合理的地方，你可能会遇到错误并一路上头疼！\n\
  \n### 4) 复合数据 (Composite Data)\n这个概念意味着一组个的、较小的数据组合在一起形成一个完整的、单一的数据块。用最简单的话说，如果变量是句子，复合数据就是由句子组成的整个段落。\n\
  \n在 `Javascript` 中，变量可以用于创建简单的复合数据。你可以按照以下语法创建它们：\n\n```javascript\nvar (复合名称) =\
  \ {\n    part1name: value1,\n    part2name: value2,\n    part3name: value3,\n}\n\
  ```\n\n这些被称为关联数组。我们稍后会讨论数组。但现在，只需记住语法。\n\n示例：\n```javascript\nvar c = {\n    c1:\
  \ “String Sample\",\n    c2: 234,\n    c3: true\n}\n```\n\n## 学习 JAVASCRIPT 的简单方法，第\
  \ 2 部分\n\n为了方便运行代码，请选择一个你喜欢的 IDE（集成开发环境：本质上就是你编写和运行代码的地方）。你也可以使用在线 IDE，例如 `rextester.com`、`ideone.com`\
  \ 或 `codpad.org`。\n\n### 5: 数组 (Arrays)\n\n### 5a: Javascript 中的数组\n数组是存储数据的有序列表。要创建一个数组，使用此语法：\n\
  `var (name) = []`\n\n### 5b: 迭代 (Iteration)\n要处理每个项目，使用这些：\n```javascript\nfor (var\
  \ x in array) {\n    // 代码\n}\n```\n\n或者，你也可以用传统方式迭代它们：\n```javascript\nfor (var\
  \ x=0; x < arrayName;x++) {\n    // 代码\n}\n```\n\n### 6) 逻辑运算符 (Logic Operators)\n\
  有三种基础逻辑运算符：`AND`（与）、`OR`（或）和 `NOT`（非）。`AND` 和 `OR` 用于比较两个或多个语句。形式为 `(x AND y)` 或\
  \ `(x OR y)`。\n\n`AND` 在所有项目为真时为真。`OR` 在其中一个项目为真时为真。\n\n`NOT` 返回它所设置的语句的相反；所以 `NOT\
  \ true` 结果为假。\n\n在 `Javascript` 中，运算符如下：\n- `AND 运算符`：`&&`\n- `OR 运算符`：`||`\n- `NOT\
  \ 运算符`：`!`boolean`\n\n示例：\n```javascript\n// 输出假：\nprint(true && false)\n\n// 输出真：\n\
  print(true || false)\n\n// 输出假：\nprint(!true)\n```\n\n### 7) IF-ELSE 语句 (IF-ELSE\
  \ Statements)\n这个概念很简单：有一个要检查的布尔语句。如果为真，执行 `IF` 行之后的程序。如果为假，执行 `ELSE` 行之后的程序。\n\n\
  ```javascript\nif (<可以输出布尔值的内容>) {\n    // 为真执行的代码\n}\nelse {\n    // 为假执行的代码\n\
  }\n```\n\n注意条件程序位于大括号 `{ }` 之间。\n\n`IF` 语句也不需要 `ELSE` 语句；它可以独立存在：\n```javascript\n\
  if (<可以输出布尔值的内容>) {\n    // 为真执行的代码\n}\n```\n\n示例：\n```javascript\n// IF-ELSE 同时使用：\n\
  if (age > 20) {\n    drinkingAge = true\n}\nelse {\n    drinkingAge = false\n}\n\
  \n// 单独 IF 语句：\nif (happy() and knowIt()) {\n    hands.clap()\n}\n```\n\n# 学习面向对象的最简单方法\
  \ (OBJECT-ORIENTED)\n我们还包含了一份关于面向对象编程的补充指南——这是目前最流行的编程类型之一。\n\n\n\n\n为了方便运行代码，请选择一个你喜欢的\
  \ IDE（集成开发环境：本质上是你编写和运行代码的地方）。你也可以使用在线 IDE，例如 [rextester.com](http://rextester.com)、[ideone.com](http://ideone.com)\
  \ 或 [codpad.org](http://codpad.org)。\n\n## 1a) 面向对象编程\n\n在编程世界中，你会非常频繁地听到这个术。。这是因为面向对象编程（简称\
  \ OOP）是目前最广泛使用的编程风格之一。\n\n在其他编程语言中，`Classes`（类）作为复合数据的形式，被用于将较小的数据组合成较大的整体。\n\n\
  面向对象编程的核心点在于：\n\n在面向对象编程中，你创建你设计的那些类的“副本”。更简单地说，一个 `Class`（类）是一个充当“蓝图”的数据结构。你基于该类“蓝图”创建的那些“副本”被称为\
  \ `Objects`（对象）。\n\n但为什么呢？因为随着你对编程的越来越深入，你会遇到“抽象”的概念——将一个通用的思想应用于多次和多个场景——最终能够节省时间和精力，同时极大地减少困惑和挫败感。\n\
  \n反复编码相同的复合数据会导致更多的努力和挫败感，而重复使用同一个思想则会带来效率和一致性。\n\n## 2) 类与构造函数\n\n构造函数是特殊的类方法。它们根据所属的类，为你创建\
  \ `Objects`。\n\n在 Javascript 中，函数被用作组合的类和构造函数。在定义类时，你同时也定义了它的构造函数。\n\n在 Javascript\
  \ 中定义一个类以及其构造函数，请使用以下语法：\n\n```javascript\nvar ClassName = function(<any inputs>)\
  \ {\n  // 在此处插入方法、字段和其他代码\n}\n```\n\n此外，构造函数简单来说就是作为函数形式的类名。要根据某个类创建数据对象，请遵循此语法：\n\
  \n```javascript\nvar <variable name> = new Classname()\n```\n\n你本质上是将其他某个变量设置为一个数据对象。\n\
  \n示例：\n\n```javascript\nvar House = function() {\n  // 在此处插入代码\n}\n\nvar h = new\
  \ House()\n```\n\n要调用类对象，只需引用它即可：\n\n示例：\n\n```javascript\nlet h = House()\nvar\
  \ MyHouse = h\n```\n\n## 3) OOP 术语\n\n变量和 `Functions`（函数）在 OOP 中可以承担新的角色。它们分别被称为\
  \ `Fields`（字段）和 `Methods`（方法）。它们也可以被称为 `Member functions`（成员函数）或 `Member Variables`（成员变量）。在某些情况下，完全取决于你想使用哪个名称，只要你理解其他程序员在使用这些术语时指的是什么即可。\n\
  \n`Fields` 代表 OOP 中的变量，因为就像任何输入表单中的字段一样，数据对象可以拥有你可以想象到的许多不同值的字段。\n\n将字段视为对象的特定属性。每个对象的属性可能与其他对象各不同：\n\
  \n```javascript\nvar Cat = function() {\n  var color = \"green\"\n}\n\n// 这些猫是基于\
  \ Cat 类的对象：\ncatA.color = \"white\"\ncatB.color = \"grey\"\ncatC.color = \"orange\"\
  \n```\n\n`Methods` 代表 `Objects` 拥有的函数。将 `Methods` 视为对象执行的“动作”和“行为”。\n\n要为特定的 `Class`\
  \ 创建类方法 `Method`，请遵循以下语法：\n\n```javascript\n<Class Name>.prototype.<Method Name>\
  \ = function() {\n  // 一些代码\n}\n```\n\n示例：\n\n```javascript\nCat.prototype.meow\
  \ = function() {\n  // 一些代码\n}\n```\n\n接下来，在 OOP 中你需要从对象本身访问方法。例如，如果我们根据某个 `Cat`\
  \ 类创建了几个 `Cat` 对象，每个 `Cat` 对象都将拥有在 `Cat` 类上定义的方法：\n\n```javascript\nclass Cat {\n\
  \  // 一些代码\n}\n\nCat.prototype.meow = function() {\n  // 一些代码\n}\n\n// 这些猫是基于 Cat\
  \ 类的对象：\ncatA.meow()\ncatB.meow()\ncatC.meow()\n```\n\n最后，记住 `Methods` 本质仍然是函数。你仍然将它们放置在预期函数输出数据类型的地方。\n\
  \n示例：\n\n```javascript\n// 输出一个字符串\nFox.prototype.say = function() {\n  return \"\
  ringdingdingding\"\n}\n\nvar whatDoesTheFoxSay = someFox.say()\nprint(whatDoesTheFoxSay)\n\
  ```\n\n## 存档 Javascript-A1a: 解决调度问题\n\n使用人工智能解决调度问题\n\n使用生成并测试算法 (Generate-and-test\
