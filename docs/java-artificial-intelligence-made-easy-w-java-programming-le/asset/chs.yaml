  \ 23];\n\n### 第 2 步：目标函数\n你的目标是确定哪些时间都有空。用一个函数来表示。输入的数量与朋友的数量相同。函数在所有小时相等时输出 True。\n\
  \n```javascript\n// 目标 1：找到都有空的时间段\n// INPUT: 四个整数，表示小时\n// OUTPUT: 布尔值\n// EFFECT:\
  \ 如果所有小时相等则返回真\nfunction g1(a, b, c, d) {\n  return (a == b && b == c && c == d)\n\
  }\n```\n\n### 第 3 步：时间约束\n对于每个需要安排的朋友，创建一个函数来表示哪些时间不可用。如果某人正忙于某事，那么这些时间就是不可用的。\n\
  \n```javascript\n// 约束函数\n// INPUT: 一个整数，表示朋友的小时\n// OUTPUT: 布尔值\n// EFFECT: 如果小时满足约束则返回真\n\
  // 在我们的示例中，我们将为每个朋友创建许多时间约束。有人上课、工作或其他事情。\n\n// 约束 1：Anna 在上午 11 点到下午 1:50 点有课\n\
  function c1(a) {\n  return (a < 11 || a > 13)\n}\n\n// 约束 2：Betty 在中午到下午 3 点有课，\n\
  // 然后一直到下午 4 点有舞蹈训练\nfunction c2(b) {\n  return (b < 12 || b >= 16)\n}\n\n// 约束\
