    `c <— b AND a`


    ## Debugging with Logic


    Conversely, you can use logic to explain the root causes of a certain fact. If
    one statement is true, it can be explained and justified by another fact, then
    those facts are justified by more facts, and so on. Here’s an example: you realize
    that “the remote control is not turning on the TV.” You carefully look at the
    remote and realize “its batteries are dead”. You change the batteries on the remote,
    try to turn on the TV, and realize that it’s still not turning on. You check the
    TV power cord and realize “it’s not plugged in.” Okay, you plug it in, try to
    turn it on again. And this time, it works.


    You can have the above as step-by-step logic statements as so:


    1) True: “The remote control is NOT turning on the TV.”

    2) True: “TV power cord is NOT plugged in”

    3) True: “Remote batteries are NOT charged”

    AND “TV power cord is NOT plugged in”


    This procedure is often used for debugging; if you find something that doesn’t
    work, you must go back and examine the inner workings to figure out what’s causing
    it.


    ## How AI analyzes a Logic-Based System


    An AI agent can analyze a given system based on whether or not certain conditions
    are true. Those conditions will lead to other conditions being true or not, then
    other conditions, and so on.


    There are two general procedures to do this. First is a **top-down diagnosis**,
    where the procedure will check certain key conditions (most likely topmost statements
    that affect other conditions), then go through the system to see what results.


    The other is a **bottom-up diagnosis**, where the procedure will check why a certain
    end condition is or isn’t what it should be. This is done by checking what other
    conditions lead it to be the way it is.


    # Javascript 02a: Using Logic-Based AI


    For the procedure below, select an IDE of your choice. You may also use online
    IDE’s such as [rextester.com](http://rextester.com), [ideone.com](http://ideone.com),
    or [codepad.org](http://codepad.org).


    There are plenty of designs and systems out there. Almost all of them can be represented
    as logic-based systems - which can be managed by AI systems to diagnose, repair,
    and analyze. However, in order to have the AI agent manage the system well, its
    programmer must understand the system very well. The programmer then has to represent
    the system as a logical code very well.


    For example, the electric wiring system in your house can be built using a series
    of true/false systems. The plugs in the wall, as well as the lights in your room,
    are all true/false switches that receive their feed from circuit breakers and
    wiring panels - more sets of true/false switches. This design benefits home developers,
    as they can trace the main power coming from outside and figure out whether or
    not electrical power flows to all plugs, lights, and generally anything that needs
    electricity in the house. This design also benefits house residents; if a certain
    light or plug isn’t working, the wiring can be traced all the way to the outside
    source to see where is the electricity getting cut off.


    ### Water Flow In a House Example:


    Below is a diagram for water flow for a 1-bedroom suite:

    ![M-AI-WaterDiagram.jpg](images/00001.jpeg)


    There are taps for the bath tub, washroom sink, and kitchen. The laundry washer
    can activate for a short time, using some combination of hot and cold water. The
    toilet has a switch that directs flow to it. The toilet is either flushing or
    not. Also, there is a switch that either feeds water onto the boiler system or
    not. There are also taps labelled `A` to `H` that stop or allow water flow. And
    lastly, the Main Water Switch either allows or stops overall water flow into the
    suite.


    Whether or not water will flow from a certain water source will depend on the
    connections, taps, and switches in the house.


