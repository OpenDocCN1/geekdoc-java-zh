    # Chapter 2: Logic & Reasoning


    ==== ==== ==== ==== ====


    Logic and AI?


    Boolean, or “True/False” logic is widely used in the field of Artificial Intelligence.
    It is essentially working with a collection of facts and statements that are either
    true or false.


    Think of the implementations for AI. You can use logic-based programming to have
    an AI agent make better decisions based on certain conditions. Further, you can
    have an AI agent diagnose technical problems, and even have AI agents take actions
    for you - such as fetch coffee (if the robot meets certain conditions, that is).


    Why use Logic?


    Perhaps the most compelling reason is how simple, easy, and natural it is to express
    facts and statements as true or false. You can have a statement such as “We’re
    having steak dinner tonight”, yet it clearly can’t be represented by numbers.
    You can also try assigning variables as strings or objects as such, but that will
    require more time and effort.


    But as a boolean, the statement “We’re having steak dinner tonight” will either
    be True or False. It’s that simple; either it’s true (we really are having steak
    dinner tonight) or it’s false.


    An AI agent can use several true/false statements and combine them in complex
    ways. And even so, the AI agent will manage the information much more easily.
    This is because one true statement can lead to another, then another, resulting
    in a conclusion, decision, or even a course of action for the agent.


