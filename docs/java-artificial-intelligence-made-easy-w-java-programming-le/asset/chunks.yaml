    sunny AND warm outside. Therefore, I will be running for a mile”.


    If you put the above together into a proposition statement, it would look like
    so:


    “I will be running for a mile” <— “it’s sunny outside” AND “it’s sunny outside”


    And if you use `variableName` labels to represent the above statements, it would
