    # Preface: JAVASCRIPT as Artificial Intelligence


    Javascript has been making waves lately as one of the main Web Technologies (HTML,
    CSS, and Javascript). Some websites and web apps are fully embracing Javascript
    technology to carry out most web tasks. The best part of all is that Javascript
    is a client-side language, meaning that your computer or mobile device does the
    computation - and not the Server itself. So this gives apps an opportunity stay
    usable even when servers aren’t.


    In the future, Javascript may be a first choice for multi-platform apps due to
    its universality and flexibility. Therefore, it will be worth your while to learn
    more advanced concepts using Javascript code.


    ## How you’ll progress through this book


    The goal of this book is to expand your programming skills onto a new paradigm
    - namely, the realm of artificial intelligence. You may be a skilled programmer
    hoping to learn new skills, or someone new to programming, or even both.


    No matter what your programming skill level is, we hope you find some intriguing
    information within these pages.


    You’ll see first-hand how algorithm procedures within AI make decisions and generate
    answers, given sets of data.


    First, we’ll go over Constraint Satisfaction. Ever had schedule a night out with
    friends, but had to consider their availability throughout a day? Of course, you’d
    ask what times they’re available. Now, try scheduling a meeting with thousands
    of people. That’ll be quire hard to do alone, wouldn’t it?


    ## A Quick Start


    Included is a quick start to cover Basic Javascript. You’ll find what you need
    to get a good start in programming. Then, you’ll be prepared to use the many tools
    and components of AI throughout the book.


    # Introduction


    Logic. Rationality. Reasoning. Thought. Analysis. Calculation. Decision-making.


    All this is within the mind of a human being, correct? Humanity has been blessed
    with the ability to think and act so intelligently.


    Then came Machine. Humanity has also blessed it the gift of intelligence.


    And in today’s world, you can see firsthand what an intelligent mind can do; carry
    a conversation, give you directions to a certain location, play a video game as
    an opponent, and so on.


    In essence, only our imaginations will limit us from what’s truly possible


    ## An Artificial Intelligence Agent


    In terms of Artificial Intelligence, an agent can be anything that, given an environment
    to focus on, can think intelligently and act independently. It can continue observing
    and learning through experience. It can calculate and independently decide the
    best course of action, whether it has perfect knowledge of the situation or just
    a part of it. It can also take note and adapt to a changing environment.


    So you might wonder, how has mankind developed developed something so complex?


    Well, it’s not as complex as you think.


    If you understand the process of how a computer can observe, learn, and expand
    its knowledge - and how it can take all this information and come with an ideal
    solution or decision - then an artificially created mind won’t be as complex as
    you think.


    Sometimes, it can take as little as a few lines of code to have a computer come
    with solutions for you. Sometimes it can take hundreds. Sometimes, thousands.


    # Chapter 1: Algorithms: The Essentials


    In essence, how an AI agent will contemplate, process, rationalize, apply logic,
    & ultimately generate solutions will mainly be through the use of algorithms.


    If you’re new to programming, don’t be intimidated. An algorithm is essentially
    a procedure to handle data. As long as you understand how a certain algorithm
    processes its data, you’ll be fine.


    ## Algorithm Traits

