- fmt: "\nFirst, you’ll want your algorithms to satisfy four key factors:\n\n- Completeness\n\
    - Optimization\n- Time Complexity\n- Space Complexity\n\nNow we’ll go through\
    \ each of these and explain them all. Afterwards, you’ll explore some algorithm\
    \ ideas and determine how they fit in to each of these factors.\n\n### Completeness\n\
    If an algorithm is guaranteed to find at least one existing solution or conclusion\
    \ within a certain time frame, we can say that an algorithm is complete.\n\n###\
    \ Optimization\nIf an algorithm finds a solution and guarantees that it is the\
    \ optimal one, then that algorithm is considered optimal.\n\n### Time Complexity\n\
    For an algorithm, this is an expression for the longest possible time it will\
    \ take to complete. In other words, the worst-case scenario when it runs and finds\
    \ a suitable solution.\n\n### Space Complexity\nThis expression is similar to\
    \ Time Complexity, but instead it represents the maximum amount of memory the\
    \ algorithm may use in order to find a solution. This is also considered the worst-case\
    \ scenario.\n\n### Your Ideal Algorithm\nAfter discussing the traits your algorithm\
    \ can have, you’ll get an idea in what to look for when creating an AI algorithm.\
    \ You want to design yours to find at least one solution (completeness), and the\
    \ best solution it can create given data it has (optimization) while using up\
    \ as little computational effort as you can (Time & Space Complexity)\n\n# Javascript\
    \ 01a: using AI to Solve Complex Time Scheduling\n\nImagine 5 of your friends\
    \ trying to get together and have fun somewhere.\n\nIt might sound simple at first,\
    \ but it can become far more complicated than you think.\n\nWhat if one of your\
    \ friends has work at certain times? What if another friend has school? What if\
    \ he/she has a prior engagement? Soccer practice? Dance classes? Study time? Sure,\
    \ you can all get together and have fun. However, it has to be at a time when\
    \ EVERYONE is available.\n\nSo, given each friend you have, you need to lay out\
    \ their time schedules, then cross out times that they’re busy. Afterwards, if\
    \ there is some common available time among all your friends, everyone says they’re\
    \ available, then you and your friends have fun.\n\nLet’s have another example.\n\
    \nHow do you think a 32-team Sports League will schedule games throughout a year?\
    \ For all 32 teams, they each need to match up with up to one other team to schedule\
    \ a game. Each team needs a certain amount of games scheduled in a season of,\
    \ say, 6 months. There can only be a certain number of games in a single week\
    \ and there needs to be enough time to travel between cities to have a game.\n\
    \nThese are times when a Scheduling Algorithm can help. It will take all members’\
    \ availabilities and time constraints, then generate a viable solution. For scheduling,\
    \ it can tell you what times of the day is everyone available. For large-scale\
    \ implementations, it can be used to schedule sports league match-ups, schedule\
    \ exams for tens of thousands of college students, and more.\n\nA very simple\
    \ and easy algorithm to start with is the `Generate-and-Test` algorithm.\n\nThe\
    \ next chapters will show you the Algorithm and guide you through its procedure…\n\
    \n# Javascript 01b: The Generate-And-Test General Algorithm\n\nFor the procedure\
    \ below, select an IDE of your choice. You may also use online IDE’s such as [rextester.com](http://rextester.com),\
    \ [ideone.com](http://ideone.com), or [codepad.org](http://codepad.org).\n\nThis\
    \ is the generalized algorithm. It will assess every combination of values from\
    \ each of its lists. The constraints check each combination if they’re valid.\
    \ A goal function also checks whether or not a certain combination provides a\
    \ solution.\n\nFor this algorithm, you can have as many number of lists, constraints,\
    \ and goal checks as you need.\n\n```javascript\n// INPUT:\n// - any number of\
    \ Lists\n// - at least one Goal Function (must return a Boolean)\n// - any number\
    \ of Constraint Functions (each must return a Boolean)\n\n// OUTPUT: - (optional;\
    \ select any output type)\n\n// EFFECT: - For all possible combinations of each\
    \ list,\n// check to see if it’s the goal combination,\n// while checking if it\
    \ satisfies the constraints.\n\nfunction generateAndTest(list1, list2, … listN,\
    \ goal1(), .. goalN(), cons1(), … consN())\n{\n  for (a = 0; v < list1.length;\
    \ a++) {\n    for (b = 0; b < list2.length; b++) {\n      …\n      for (i = 0;\
    \ i < listN.length; i++){\n        if (goal1(a,b, …, n)\n        &&\n        …\
