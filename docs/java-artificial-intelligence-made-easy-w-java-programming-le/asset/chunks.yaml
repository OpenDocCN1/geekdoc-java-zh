    \ MyHouse = h\n```\n\n# 3) OOP 术语\n\n变量和 `Functions`（函数）在 OOP 中可以承担新的角色。它们分别被称为\
    \ `Fields`（字段）和 `Methods`（方法）。它们也可以被称为 `Member functions`（成员函数）或 `Member Variables`（成员变量）。在某些情况下，完全取决于你想使用哪个名称，只要你理解其他程序员在使用这些术语时指的是什么即可。\n\
    \n`Fields` 代表 OOP 中的变量，因为就像任何输入表单中的字段一样，数据对象可以拥有你可以想象到的许多不同值的字段。\n\n将字段视为对象的特定属性。每个对象的属性可能与其他对象各不同：\n\
    \n```javascript\nvar Cat = function() {\n  var color = \"green\"\n}\n\n// 这些猫是基于\
    \ Cat 类的对象：\ncatA.color = \"white\"\ncatB.color = \"grey\"\ncatC.color = \"orange\"\
    \n```\n\n`Methods` 代表 `Objects` 拥有的函数。将 `Methods` 视为对象执行的“动作”和“行为”。\n\n要为特定的 `Class`\
    \ 创建类方法 `Method`，请遵循以下语法：\n\n```javascript\n<Class Name>.prototype.<Method Name>\
