    对于下面的步骤，请选择一个你喜的 IDE。你也可以使用在线 IDE，例如 [rextester.com](http://rextester.com)、[ideone.com](http://ideone.com)\
    \ 或 [codpad.org](http://codpad.org)。\n\n现在让我们练习为我们的 AI 创建供其检查的环境。这些在之后将整合在一起，因为\
    \ AI 代理体将有机会利用它既定的知识和能力来探索它的环境。\n\n## 建模房屋\n\n建模环境最简单的方法是前面提到的红灯原则。\n\n如果你用简单的枚举类型数据集合为你的房屋建模，你可能会得到类似的内容：\n\
    \n```javascript\nvar myHouse = [\"livingRoom\", \"diningRoom\", \"den\", \"bathroom1\"\
    , \"bathroom2\", \"hallway\", \"bedroom1\", \"bedroom2\", \"patio\"]\n```\n\n\
    你也可以使用面向对象编程来建模房屋。你可以将房子中的每个房间表示为一个 `Room` 对象。\n\n```javascript\n// 一个 Room 具有：\n\
    // - 一个名称\n// - 相邻的、连接的房间\nfunction Room(name) {\n\n  this.name = name\n  this.connected\
    \ = []\n  this.addRoom = function(room) {\n\n    this.connected.push(room)\n \
    \ }\n}\n```\n\n为了现在保持简单，你可以建模位于繁华市中心的一个简单的公寓。\n\n```javascript\n// 在城市里的一个简单公寓中创建\
    \ 5 个房间\nvar kitchen = new Room(\"kitchen\")\nvar livRM = new Room(\"livingRoom\"\
    )\nvar dineRM = new Room(\"diningRoom\")\nvar bd = new Room(\"bedroom\")\nvar\
    \ wr = new Room(\"washroom\")\n\n/*\n// 如下连接所有房间：\n// <-> 洗手间 <-> 卧室 <-> 客厅 <->\
    \ 厨房 <-> 餐厅 <->\n*/\nkitchen.connected.push(livRM, dineRM)\nlivRM.connected.push(bd,\
    \ kitchen)\nbd.connected.push(wr, livRM)\nwr.connected.push(dineRM, bd)\ndineRM.connected.push(kitchen,\
    \ wr)\n```\n\n建模环境的方法取决于你。\n\n只需记住，你最终将设计与你的模型环境对应的 AI 代理体。\n\n## 轮到你了\n\n使用 Javascript（或任何编程语言），根据上述内容为你的家建模。首先，使用枚举方法进行红灯建模。然后，作为面向对象编程，用\
    \ `Room` 实例表示每个房间。\n\n"
- fmt: "\nTo easily run code, select an IDE (Integrated Development Environment: essentially\
    \ somewhere that you write and run code) of your choice. You may also use online\
    \ IDE’s such as `rextester.com`, `ideone.com`, or `codpad.org`.\n\n## 1) The Basic\
    \ Data Types\n\n### Booleans\nThese are essentially on-off switch values. In code,\
    \ boolean values are going to be either `TRUE` or `FALSE`.\n\nIn `Javascript`,\
    \ booleans can only be in lower-case (i.e. `true`, `false`). Booleans cannot have\
    \ any upper-case letters in them (i.e. `TRUE`, `True`).\n\nExamples:\n`true`,\
    \ `false`\n\n### Strings\nThese are sets of keyboard characters - including letters,\
    \ numbers, and other symbols - arranged in some order to make a text phrase. They\
    \ start and end with double quotation marks.\n\nExamples:\n`\" This is a String.\
    \ \"`\n`\" This 15 4 &^%$! 5tring t00\\. \"`\n\n### Numbers\n`Javascript` treats\
    \ all numbers the same. They’re all 64-bit floating points (you can look it up\
    \ if you don’t know what it means).\n\nBut in general, there are two main types\
    \ of numbers in programming: `Integers` (whole numbers) and `Floats` (decimal-point\
    \ numbers).\n\n#### Integers\nThey’re exactly as they’re defined - whole numbers\
    \ without any fractions or decimals. Here are some examples:\n`12`\n`143`\n`19999932`\n\
    \n#### Floats\nalso called floating-point numbers, they represent the opposite\
    \ of `Integers` - they are numbers beyond the decimal point.\n\nExample:\n`0.12`\n\
    `.12`\n\n## 2) Variables\nRemember in grade school math where you used letters\
    \ such as `X` and `Y` to represent numbers? Textbooks had phrases such as `let\
    \ x = 4` and `let y = 19`. These were called variables.\n\nVariables prevalently\
    \ exist in programming too. But in programming, you can give your variables a\
    \ name. And instead of numbers, variables can be whatever data you assign them\
    \ as. They can be strings, booleans, integers, and more.\n\nIn `Javascript`, you\
    \ can create variables in the following syntax:\n`var (Variable Name) = (Initial\
    \ Value)`\n\nOr, alternatively:\n`(Variable Name) = (Initial Value)`\n\nExamples:\n\
    `var a = \" This is a String. \"`\n`var b = 122`\n`c = true`\n`d = 0.1234`\n\n\
    Think of variables as one-sentence statements in the form of `(name) is a ____`\
    \ . Use variables to tell the computer certain facts about your code. The concept\
    \ is just as simple as telling me that a fire hydrant is red or the sky is blue.\n\
    \n## 3a) Making Functions\nIf Variables are sentences, Functions are merely actions\
    \ or verbs.\n\nIn essence, functions are outlined set of instructions. They are\
    \ carried out by the computer once a line of code calls their names. For example,\
    \ if a line of code told a computer to walk, the computer would follow the instructions\
    \ to walk (i.e. one step forward, lean forward, step with other foot, etc.)\n\n\
    To create a function in `Javascript`, follow this syntax:\n\n```javascript\nfunc\
    \ <Function Name>( input1, input2, etc…) {\n    // write code here\n    // use\
    \ the next line if the function outputs any data:\n    // return (variable name\
    \ with data type, or any data)\n}\n```\n\n## 3b) Using Functions\nTo call a function,\
    \ you just write its name, along with any inputs (if necessary).\n\nHowever, there\
    \ are generally two places where you place a function.\n\nOn a line of its own:\n\
    `<Function Name>(any required inputs)`\n\nOr wherever its output data type is\
    \ expected:\n`var (variable name) = <Function Name>( any required inputs)`\n\n\
    Examples:\n```javascript\n// No Output:\nfunctionABC(a, b, c)\n\n// Outputs an\
    \ Integer:\nvar integer1 = functionABC(a, b, c)\n```\n\nJust keep in mind; while\
    \ `Javascript` is a far more lenient programming language than most others, you\
    \ should place your function where its output data is expected. For example, if\
    \ functions `n1()` and `n2()` each output a single number, place them somewhere\
    \ in your code that expects those numbers:\n`var sum = n1() + n2()`\n\nIf you\
    \ place functions where they don’t make sense, you can get errors and headaches\
    \ along the way!\n\n## 4) Composite Data\nThis concept means that a set of individual,\
    \ lesser data are comprised together to form a whole, singular chunk of data.\
    \ Put in the simplest way possible, if Variables are sentences, Composite Data\
    \ are entire paragraphs that can be made of sentences.\n\nIn `Javascript`, variables\
    \ can be used to create simple composite data. You can create them in the following\
    \ syntax:\n\n```javascript\nvar (CompositeName) = {\n    part1name: value1,\n\
    \    part2name: value2,\n    part3name: value3,\n}\n```\n\nThese are called associative\
    \ arrays. We’ll get to arrays later on. But for now, just take note of the syntax.\n\
    \nExample:\n```javascript\nvar c = {\n    c1: “String Sample\",\n    c2: 234,\n\
    \    c3: true\n}\n```\n\n# EASIEST WAY TO LEARN JAVASCRIPT, Part 2\n\nTo easily\
    \ run code, select an IDE (Integrated Development Environment: essentially somewhere\
    \ that you write and run code) of your choice. You may also use online IDE’s such\
    \ as `rextester.com`, `ideone.com`, or `codpad.org`.\n\n## Part 5: Arrays\n\n\
    ### Part 5a: Arrays in Javascript\nArrays are sequenced list of data. To set up\
    \ an array, use this syntax:\n`var (name) = []`\n\n### Part 5b: Iteration\nTo\
    \ process each item, use these:\n```javascript\nfor (var x in array) {\n    //\
    \ code\n}\n```\n\nAlternatively, you can also iterate them the traditional way:\n\
    ```javascript\nfor (var x=0; x < arrayName;x++) {\n    // code\n}\n```\n\n## Part\
    \ 6: Logic & Operators\nThere are three Basic Logic Operators: `AND`, `OR`. and\
    \ `NOT`. `AND` and `OR` are used to compare two or more statements that are either\
    \ `True` or `False`. They are used in the form of `(x AND y)` or `(x OR y)`.\n\
    \n`AND` is true if all items between it is true. `OR` is true if either one of\
    \ its items is true.\n\n`NOT` returns the opposite of a single statement it’s\
    \ set to; so `NOT true` would be false and `NOT False` would be true.\n\nIn `Javascript`,\
    \ here are how the operators are:\n- `AND operator`: `&&`\n- `OR operator`: `||`\n\
    - `NOT operator`: `!`boolean`\n\nExamples:\n```javascript\n// print false:\nprint(true\
    \ && false)\n\n// print true:\nprint(true || false)\n\n// print false:\nprint(!true)\n\
    ```\n\n## Part 7: IF-ELSE Statements\nThe concept is simple: There’s a boolean\
    \ statement to check. If it’s true, do the procedure after the `IF` line. If it’s\
    \ false, do the procedure after the `ELSE` line.\n\n```javascript\nif (<insert\
    \ something that would output a boolean>) {\n    // code that happens if true\n\
    }\nelse {\n    // code that happens if false\n}\n```\n\nNote that the conditional\
    \ procedures are in between the curly brackets `{ }`.\n\nan `IF` statement also\
    \ doesn’t need an `ELSE` statement; it can be by itself:\n```javascript\nif (<insert\
    \ something that would output a boolean>) {\n    // code that happens if true\n\
    }\n```\n\nExamples:\n```javascript\n// IF-ELSE together:\nif (age > 20) {\n  \
    \  drinkingAge = true\n}\nelse {\n    drinkingAge = false\n}\n\n// IF-statement\
    \ alone:\nif (happy() and knowIt()) {\n    hands.clap()\n}\n```\n\n# EASIEST WAY\
    \ TO LEARN OBJECT-ORIENTED\nWe’ve also included a complementary guide to learning\
    \ Object-Oriented programming -one of the most popular types of programming in\
    \ use today.\n"
  raw: 'To easily run code, select an IDE (Integrated Development Environment: essentially
    somewhere that you write and run code) of your choice. You may also use online
    IDE’s such as [rextester.com](http://rextester.com), [ideone.com](http://ideone.com),
    or [codepad.org](http://codepad.org).


    ========================= ======


    1) The Basic Data Types.


    Booleans:


    These are essentially on-off switch values. In code, boolean values are going
    to be either TRUE or FALSE.


    In Javascript, booleans can only be in lower-case (i.e. true, false). Booleans
    cannot have any upper-case letters in them (i.e. TRUE, True)


    Examples:


    true, false


    Strings:


    These are sets of keyboard characters - including letters, numbers, and other
    symbols - arranged in some order to make a text phrase. They start and end with
    double quotation marks.


    Examples:


    " This is a String. "


    " This 15 4 &^%$! 5tring t00\. "


    Numbers:


    Javascript treats all numbers the same. They’re all 64-bit floating points (you
    can look it up if you don’t know what it means).


    But in general, there are two main types of numbers in programming: Integers (whole
    numbers) and Floats (decimal-point numbers).


    Integers:


    They’re exactly as they’re defined - whole numbers without any fractions or decimals.
    Here are some examples:


    12


    143


    19999932


    Floats: also called floating-point numbers, they represent the opposite of Integers
    - they are numbers beyond the decimal point.


    Example:


    0.12


    .12


    2) Variables


    Remember in grade school math where you used letters such as X and Y to represent
    numbers? Textbooks had phrases such as ‘let x = 4’ and ‘let y = 19’. These were
    called variables.


    Variables prevalently exist in programming too. But in programming, you can give
    your variables a name. And instead of numbers, variables can be whatever data
    you assign them as. They can be strings, booleans, integers, and more.


    In Javascript, you can create variables in the following syntax:


    var (Variable Name) = (Initial Value)


    Or, alternatively:


    (Variable Name) = (Initial Value)


    Examples:


    var a = " This is a String. "


    var b = 122


    c = true


    d = 0.1234


    Think of variables as one-sentence statements in the form of “(name) is a ____”
    . Use variables to tell the computer certain facts about your code. The concept
    is just as simple as telling me that a fire hydrant is red or the sky is blue.


    3a) Making Functions


    If Variables are sentences, Functions are merely actions or verbs.


    In essence, functions are outlined set of instructions. They are carried out by
    the computer once a line of code calls their names. For example, if a line of
    code told a computer to walk, the computer would follow the instructions to walk
    (i.e. one step forward, lean forward, step with other foot, etc.)


    To create a function in Javascript, follow this syntax:


    func <Function Name>( input1, input2, etc…) {


    // write code here


    // use the next line if the function outputs any data:


    // return (variable name with data type, or any data)


    }


    3b) Using Functions


    To call a function, you just write its name, along with any inputs (if necessary)


    However, there are generally two places where you place a function.


    On a line of its own:


    <Function Name>(any required inputs)


    Or wherever its output data type is expected:


    var (variable name) = <Function Name>( any required inputs)


    Examples:


    // No Output:


    functionABC(a, b, c)


    // Outputs an Integer:


    var integer1 = functionABC(a, b, c)


    Just keep in mind; while Javascript is a far more lenient programming language
    than most others, you should place your function where its output data is expected.
    For example, if functions n1() and n2() each output a single number, place them
    somewhere in your code that expects those numbers:


    var sum = n1() + n2()


    If you place functions where they don’t make sense, you can get errors and headaches
    along the way!


    4) Composite Data


    This concept means that a set of individual, lesser data are comprised together
    to form a whole, singular chunk of data. Put in the simplest way possible, if
    Variables are sentences, Composite Data are entire paragraphs that can be made
    of sentences.


    In Javascript, variables can be used to create simple composite data. You can
    create them in the following syntax:


    var (CompositeName) = {


    part1name: value1,


    part2name: value2,


    part3name: value3,


    }


    These are called associative arrays. We’ll get to arrays later on. But for now,
    just take note of the syntax.


    Example:


    var c = {


    c1: “String Sample",


    c2: 234,


    c3: true


    }


    # EASIEST WAY TO LEARN JAVASCRIPT, Part 2


    To easily run code, select an IDE (Integrated Development Environment: essentially
    somewhere that you write and run code) of your choice. You may also use online
    IDE’s such as [rextester.com](http://rextester.com), [ideone.com](http://ideone.com),
    or [codepad.org](http://codepad.org).


    ========================= ======


    Part 5a: Arrays in Javascript


    Arrays are a sequenced list of a certain data type. Those data types can be simple
    or compound data.


    To set up an array, follow this syntax:


    var (variable name) = []


    Or:


    (variable name) = []


    You can also access individual items based on that item’s position within the
    array. 0 is the first item; the array size minus one is the last item.


    (In programming, the very 1st number is often 0\. Remember this!)


    For example, you would get the first item of an array like so:


    someArray[0]


    And you would get the last item of an array like so:


    // an Array with room for 10 items:


    someArray[9]


    Part 5b: Iteration


    To process each item in an array, use these lines:


    for (var x in <arrayName>) {


    // every time you mention ‘x’ in this code,


    // it will be applied to every item within the array


    }


    For example, this would print out 1 to 5:


    var a = [1,2,3,4,5]


    for (var x in a) {


    print(a[x])


    }


    Alternatively, you can also iterate them the traditional way. Many other programming
    languages


    for (var x=0; x < arrayName.length;x++) {


    // every time you mention ‘x’ in this code,


    // it will be applied to every item within the array


    }


    Again, this would print out 1 to 5:


    var a = [1,2,3,4,5]


    for (var x=0; x < a.length;x++) {


    print(a[x])


    }


    Part 6: Logic & Operators


    There are three Basic Logic Operators: AND, OR. and NOT.


    AND and OR are used to compare two or more statements that are either True or
    False. They are used in the form of (x AND y) or (x OR y)


    AND is true if all items between it is true. OR is true if either one of its items
    is true.


    NOT returns the opposite of a single statement it’s set to; so ‘NOT true’ would
    be false and ‘NOT False’ would be true.


    In Javascript, here are how the operators are:


    AND operator: &&


    OR operator: ||


    NOT operator: !<boolean>


    Examples:


    // print false:


    print(true && false)


    // print true:


    print(true || false)


    // print false:


    print(!true)


    Part 7: IF-ELSE Statements


    The concept is simple: There’s a boolean statement to check. If it’s true, do
    the procedure after the IF line. If it’s false, do the procedure after the ELSE
    line.


    if (<insert something that would output a boolean>) {


    // code that happens if true


    }


    else {


    // code that happens if false


    }


    Note that the conditional procedures are in between the curly brackets ‘{ }’.


    an IF statement also doesn’t need an ELSE statement; it can be by itself:


    if (<insert something that would output a boolean>) {


    // code that happens if true


    }


    Examples:


    // IF-ELSE together:


    if (age > 20) {


    drinkingAge = true


    }


    else {


    drinkingAge = false


    }


    // IF-statement alone:


    if happy() and knowIt() {


    hands.clap()


    }


    # EASIEST WAY TO LEARN OBJECT-ORIENTED


    We’ve also included a complementary guide to learning Object-Oriented programming
    -one of the most popular types of programming in use today.'
