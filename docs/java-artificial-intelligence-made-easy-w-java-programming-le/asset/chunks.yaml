    // KitchenTap_Cold <- E and C


    // LaundryWasher_Hot <- H


    // LaundryWasher_Cold <- E and C


    // BathTubTap_Hot <- F


    // BathTubTap_Cold <- B


    // WashroomTap_Hot <- F and G


    // WashroomTap_Cold <- C


    // F and H <- BoilerSwitch


    Using AI to Analyze a system


    Because we’ve mapped out the logical links between facts (namely, we now know
    which taps and switches feed water into what) we can start creating procedure
    to analyze and diagnose the system.


    We’ll create both top-down and bottom-up diagnoses for this system, explaining
    what happens for each one.


    The Top-Down Procedure:


    Based on how the system was mapped out using boolean logic, we’ve found five root
    taps and switches that affect the rest of the water system - the Main Water Switch,
    the Boiler Switch, and taps D, E, and G. Therefore, a Top-down procedure can determine
    which water sources within the house are affected.


    You can find the Procedure Code in the Archive section


    The Bottom-Up Procedure:


    Here, the same five root taps and switches are global variables you can toggle
    true/false. Then you can run the procedure for one of the water sources in the
    house to check whether or not water flows through it.


    You can also find the Procedure Code in the Archive section


