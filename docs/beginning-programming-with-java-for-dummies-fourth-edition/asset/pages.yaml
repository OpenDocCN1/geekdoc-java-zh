  md: "# 224 Part III: Controlling the Flow\n\nThis mixing of cases may slow you down\
    \ when you're trying to read a program, but it's legal nonetheless.\n\n+   You\
    \ don't need a case for each expected value of the Expression. You can leave some\
    \ expected values to the default. Here's an example:\n\n```\nswitch (randomNumber)\
    \ {\n  case 1:\n    System.out.println(\"Yes. Isn't it obvious?\");\n    break;\n\
    \  case 5:\n    System.out.println(\"No chance, Lance.\");\n    break;\n  case\
    \ 7:\n    System.out.print(\"Yes, but only if\");\n    System.out.println(\" you're\
    \ nice to me.\");\n    break;\n  case 10:\n    System.out.print(\"No, not until\"\
    );\n    System.out.println(\" Nell squeezes Rover.\");\n    break;\n  default:\n\
    \    System.out.print(\"Sorry,\");\n    System.out.println(\" I just can't decide.\"\
    );\n    break;\n}\n```\n\n+   The default clause is optional.\n\n```\nswitch (randomNumber)\
    \ {\n  case 1:\n    System.out.println(\"Yes. Isn't it obvious?\");\n    break;\n\
    \  case 2:\n    System.out.println(\"No, and don't ask again.\");\n    break;\n\
    \  case 3:\n    System.out.print(\"I'm too tired.\");\n    System.out.println(\"\
    \ Go ask somebody else.\");\n}\nSystem.out.println(\"Goodbye\");\n```\n\nIf you\
    \ have no default clause, and a value that's not covered by any of the cases comes\
    \ up, the switch statement does nothing. For example, if randomNumber is 4, the\
    \ preceding code displays Goodbye, and nothing else."
