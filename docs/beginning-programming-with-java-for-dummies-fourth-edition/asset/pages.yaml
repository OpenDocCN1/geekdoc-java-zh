    trouble imagining such thing, just look at Figure 19-1.) In the figure, each

    account has a last name, an identification number, and a balance. In addition

    (and here''s the important part), each account knows how to display itself on

    screen. Each row of the table has its own copy of a display method.


    | lastName | id | balance | display |

    | Aju | 9936 | $8,734.00 | (method to display account info) |

    | Iap | 3492 | $6,718.00 | (method to display account info) |

    | Ngp | 2151 | $1,008.00 | (method to display account info) |


    Figure 19-1: A table of accounts.


    The names in Figure 19-1 may seem strange to you. That''s because I gen-

    erated the table''s data randomly. Each last name is a phahazard combination

    of three letters — one uppercase letter followed by two lowercase letters.


    ![](img/6d9dcff12e52b997f3ad31445b712549_387_0.png)


    Though it may seem, generating account values at random is common

    practice. When you write new code, you want to test the code to find out if

    it runs correctly. You can make up your own data (with values like "Smith,

    0000.0.). But to give your code a challenging workout, you should

    use some unexpected values. If you have values from some real-life case stud-

    ies, you should use them. But if you don''t have real data, randomly generated

    values are easy to create.


    To find out I randomly generate three-letter names, see this chapter''s

