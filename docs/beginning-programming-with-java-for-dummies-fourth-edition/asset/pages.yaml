    Goodbye


    # The default in a switch statement


    What if something goes wrong terribly during a run of the Listing 11-1 program?
    Suppose that the expression myRandom.nextInt(10) + 1 generates a number that''s
    not in the 1 to 10 range. Then the computer responds by dropping past all the
    case instances. Instead of landing on a case clause, the computer jumps to the
    default clause, the computer displays You think you have problems?... and then
    breaks out of the switch statement. After the computer is out of the switch statement,
    the computer displays Goodbye.


    You don''t really need to put a break at the very end of a switch statement. In
    Listing 11-1, the last break (the break that''s part of the default clause) is
    just for the sake of overall tidiness.'
