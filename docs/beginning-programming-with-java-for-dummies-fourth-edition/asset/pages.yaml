  md: '# The Java class


    Have you heard the term object-oriented programming (also known as OOP)? OOP is
    a way of thinking about computer programming problems — a way that is supported
    by several different programming languages. OOP started in the 1960s with a language
    called Simula. It was reinforced in the 1970s with another language named Smalltalk.
    In the 1980s, OOP took off big with the language C++.


    Some people want to cry the acronym, and call it COP — class-oriented programming.
    Because object-oriented programming begins with something called a class. In Java,
    everything starts with classes, everything is enclosed in classes, and everything
    is based on classes. You can''t do anything in Java until you''ve created a class
    of some kind. It''s like being on Jeopardy, hearing Alex Trebek say “Let''s go
    to a commercial” and then interrupting him by saying, “I''m sorry, Alex. You can''t
    issue an instruction without putting your inside a class.


    It''s important to understand what a class really is, so I dare not give a haphazard
    explanation in this chapter. Instead, I devote much of Chapter 17 to the question,
    “What is a class?” in Java, your main method has to be inside a class. I wrote
    the code in Listing 4-1, so I got to make up a name for my new class. I chose
    the name ThingsLike, so the code in Listing 4-1 starts with the words class ThingsLike.


    Take another look at Listing 4-1 and notice what happens after the line class
    ThingsLike. The rest of the code is enclosed in curly braces. These braces mark
    all the stuff inside the class. Without these braces, you''d know the declaration
    of the ThingsLike starts, but you wouldn''t know where the declaration ends.


    It''s as though the inside ThingsLike class is in a box. (Refer to Figure 4-3)
    To box a chunk of code, you do two things:


    +   - You brace a chunk. These braces tell the compiler where a chunk of code
    begins and ends.


    +   - You indent code. Indentation tells your human eye (and the eyes of other
    programmers) where a chunk of code begins and ends.


    Don''t forget. You have to do both.'
