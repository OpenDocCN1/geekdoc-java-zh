  md: '# 166 Part II: Writing Your Own Java Programs


    Of course, the greater-than-or-equal-to comparison gets you only so far.

    Table 8-1 shows you the operators you can use to compare things with another.


    Table 8-1 Comparison Operators

    | Operator | Meaning | Example |

    | == | is equal to | yourGuess == winningNumber |

    | != | is not equal to | 5 != numberOfCows |

    | < | is less than | strikes < 3 |

    | > | is greater than | numberOfBoxtops > 1000 |

    | <= | is less than equal to | numberOfCows + numberOfBulls <= 5 |

    | >= | is greater than equal to | gumballsPerKid >= 10 |


    With the operators in Table 8-1, you can compare numbers and characters.


    Notice the double sign in the first row of Table 8-1. Don''t try to use a single
    equal sign to compare two values. The expression yourGuess = winningNumber (with
    a single equal sign) doesn''t compare yourGuess with winningNumber. Instead, yourGuess
    = winningNumber changes the value of yourGuess. (It assigns the value of winningNumber
    to the variableGuess.)


    ![](img/6d9dcff12e52b997f3ad31445b712549_181_0.png)


    You can compare other things (besides numbers and characters) with the == and
    ! operators. When you do, you will have to be careful. For more information, see
    Chapter 18.


