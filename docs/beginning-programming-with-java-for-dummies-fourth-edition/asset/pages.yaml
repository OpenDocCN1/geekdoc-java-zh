  md: "# 86 Part II: Writing Your Java Programs\n\nIn English, you write all the way\
    \ across one line and then you wrap your text to the start of the next line. In\
    \ programming, you seldom work like this. Instead, the code’s punctuation guides\
    \ the indenting of certain lines. indentation shows which parts of the program\
    \ are subordinate to which other parts. It’s in English, you wrote Suzanne’s sentence\
    \ like this:\n\n> Suzanne says \"eh\" because\n\n+   - as you know\n- lives in\
    \ Canada.\n\nThe diagrams in Figures 4-3 and 4-4 show how parts of the ThingsLike\
    \ program are contained inside other parts. Notice how a pair of curly braces\
    \ acts like a box. To make the program’s structure visible at a glance, you indent\
    \ the stuff inside of each box.\n\n![](img/6d9dcff12e52b997f3ad31445b712549_101_0.png)\n\
    \n```\nClass ThingsLike {\n  public static void main(String args[]) {\n    System.out.println(\"\
    Chocolate, royalties, sleep\");\n  }\n}\n```\n\n![](img/6d9dcff12e52b997f3ad31445b712549_101_1.png)\n\
    \n```\nHere’s a Java class named ThingsLike:\n  Here’s the main starting point\
    \ for the instructions:\n  Display Chocolate, royalties, sleep on the screen.\n\
    }\n```\n\nI cannot emphasize this point enough. If you don’t indent your code\
