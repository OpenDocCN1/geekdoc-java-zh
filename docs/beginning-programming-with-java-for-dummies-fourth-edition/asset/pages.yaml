  md: '# 126 Part II: Writing Your Own Java Programs


    # What Do All Those Zeros and Ones Mean?


    Here''s a word:


    gift


    The question for discussion is, what does that word mean? Well, it depends on
    who looks at the word. For example, an English-speaking reader would say that
    "gift" stands for something one person bestows upon another in a box covered in
    bright paper and ribbons.


    Look! I''m giving you a gift!


    But in German, the word "gift" means "poison."


    Let me give you some gift, my dear.


    And in Swedish, "gift" can mean either "married" or "poison."


    As soon as they got gift, she slipped a gift into his drink.


    Then there''s French. In France, there''s a candy bar named "Gift."


    He came for the holidays, and all he gave me a bar of Gift.


    So what do the letters g4-f4 really mean? Well, they don''t mean anything until
    you decide on how to interpret them. The same is true of the zeros and ones inside
    a computer''s circuitry.


    Take, for example, the sequence 0101010. This sequence can stand for the letter
    J, but it can also stand for the number 74. $1.0369608636003646\times10^{-43}$.
    And when interpreted as screen pixels, the same sequence can represent the dots
    shown in Figure 6-6. The meaning of 01010110 depends entirely on the way the software
    interprets this sequence.


    ![](img/6d9dcff12e52b997f3ad31445b712549_141_0.png)'
