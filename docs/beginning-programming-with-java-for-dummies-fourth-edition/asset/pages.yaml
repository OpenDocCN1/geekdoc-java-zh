  md: '# Beginning Programming with Java For Dummies, 4th Edition


    # # How to Use This Book


    If I could say, "Open to a random page of this book and start writing Java code.
    Just fill in the blanks and don''t look back." In a sense, this is true. You can''t
    break anything by writing Java code, so you''re always free to experiment.


    But I have to be honest, if you don''t understand the bigger picture, writing
    a program is difficult. That''s true with Java. If you''re typing code without
    knowing what''s about, and the code doesn''t exactly do what you want it to, then
    you''re just plain stuck.


    So in this book, I divide programming into manageable chunks. Each is (more or
    less) a chapter. You can jump in anywhere you want — Chapter 5, Chapter 10, or
    wherever. You can even start by poking around the middle of a chapter. I''ve tried
    to make the examples interesting without making a chapter depend on another. When
    I use an important idea from another chapter, I include a note to help you find
    your way around.


    In general, my advice is as follows: ✔


    +   - If you already know something, don''t bother reading about it.

    - If you''re curious, don''t be afraid to skip ahead. You can always sneak a peek
    at an earlier chapter if you really need to do so.


    # # Conventions Used in This Book


    Almost every technical book starts with a little typeface legend, and Beginning
    Programming with Java For Dummies, 4th Edition is no exception. What follows is
    a brief explanation of the typefaces used in this book:


    +   - New terms are in italics.

    - When you want to type something short or perform a step, I use bold.

    - You''ll also see `computer` font. I use the computer font for Java code, filenames,
    web page addresses (URLs), onscreen messages, and other such things. Also, if
    something you need to be really long, it appears in computer font on its own line
    (or lines).

    - You need to change certain things when you type on your own computer keyboard.
    For example, I may ask you to type


    ```

    class Anyname

    ```


    which means you should type `class` and then some name that you make up on your
    own. Words that you need to replace with your own words are set in italicized
    `computer`.'
