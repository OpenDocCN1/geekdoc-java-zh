    \ bad room number 10 gets no response.\n\n![](img/6d9dcff12e52b997f3ad31445b712549_332_0.png)\n\
    \nIn Listing 16-3, I want to know if the occupancy file contains any more data\
    \ (any data that I haven't read yet). So I call the Scanner's hasNext method looks\
    \ ahead to see whether I can read any kind of data: an int value, a double value,\
    \ a word, or boolean. That's for this section's example, but in some situations,\
    \ you need to be picky about your input data. For example, you may want to know\
    \ if you call nextInt (as opposed to nextDouble or nextLine). Fortunately, Java\
    \ has methods for your pickiest needs. A method like (Scanner.hasNextInt()) tests\
    \ to see whether you can read an int value from the disk file. Java also has methods\
    \ like nextLine, hasNextDouble, and so on. For more information on the plain old\
    \ hasNext, see Chapter 14.\n\nListing 16-3 has a bit condition to keep the loop\
    \ going:\n\n```\nfor (int roomNum = 0;\n     roomNum < scanner.hasNext();\n  \
    \   roomNum++) {\n}\n```\n\nMany for loop conditions are \"less-than\", but there's\
    \ no rule saying that all for loop conditions have to be simple. In fact, any\
