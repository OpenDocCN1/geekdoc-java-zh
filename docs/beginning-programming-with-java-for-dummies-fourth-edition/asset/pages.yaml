  md: '# 80 Part II: Writing Your Java Programs


    # The Elements in a Java Program


    Both English and Java are called languages is no coincidence. You use a language
    to express ideas. English expresses ideas to people, and Java expresses ideas
    to computers. What''s more, both English and Java have things like words, names,
    and punctuation. In fact, the biggest difference between the two languages is
    that Java is easier to learn than English. (If English were easy, then everyone
    would understand English. Unfortunately, they can''t.)


    Take an ordinary English sentence and compare it with the code in Listing 4-1.
    Here''s the sentence:


    Suzanne says "eh" because, as you know, she lives in Canada.


    In your high school grammar class, you worried about verbs, adjectives, and other
    things. But in this book, you''ll find in terms of keywords and identifiers, as
    in Figure 4-2.


    | Keywords:

    Suzanne says "eh" because, as you know, she lives in Canada.

    An identifier that you or can define:

    Suzanne says "eh" because, as you know, she lives in Canada.

    An identifier with a commonly agreed upon meaning:

    Suzanne says "eh" because, as you know, she lives in Canada.

    Figure 4-2:

    The things you find in a simple sentence. | A literal:

    Suzanne says "eh" because, as you know, she lives in Canada.

    Punctuation:

    Suzanne says "eh" because, as you know, she lives in Canada.

    A comment:

    Suzanne says "eh" because, as you know, she lives in Canada. |


    Suzanne''s sentence has all kinds of things in it. They''re the same kinds of
    things you find in a computer program. So here''s the plan: Compare the elements
    in Figure 4-1 with similar elements in Listing 4-1. You already understand English,
    so you use this understanding to find out new things about Java.


    But first, there''s a friendly reminder: In the next paragraphs, I draw comparisons
    between English and Java. As you read these paragraphs, it''s important to keep
    an open mind. For example, in comparing Java with English, I might write that
    "names of things aren''t the same as dictionary words." Sure, you can argue that
    some dictionaries list proper nouns and that some people have first names like
    Hope, Prudence, and Spike, but please don''t. You''ll get out of the reading if
    you avoid nitpicking. Okay? Are we still friends?'
