    The filenames displayed in Windows File Explorer or in a Finder window can be
    misleading. You may browse one of your directories and see the name Mortgage.java,
    Mortgage.class, Mortgage.somethingelse, or old Mortgage. File extensions like
    .java and .class are called filename extensions. In the resulting search box,
    type Folder Options and press Enter. Then follow the instructions in the In All
    Versions of Windows bullet.


    The ugly truth is that by default, Windows and Macs hide many filename extensions.
    This awful feature tends to confuse programmers. So, if you don''t want to be
    confused, change your computer''s system-wide settings. Here''s how you do it:


    +   - In Windows XP: Choose Start>Control Panel>Appearance and Theme: Follow the
    options in the In All Versions of Windows bullet.

    - In Windows 7: Choose Start>Control Panel>Appearance and Personalization>Folder
    Options. Then follow the instructions in the In All Versions of Windows bullet.

    - In Windows 8: In the Start screen, hold down the Windows key while pressing
    Q.


    +   - In all versions of Windows (XP and newer): Follow the instructions in one
    of the preceding bullets. Then, in the Options dialog box, click the View tab.
    Look for the Hide Extensions for File Types option. Make sure that this check
    is not selected.


    +   - In OS X: In the Finder application''s menu, select Preferences. In the resulting
    dialog box, select the Advanced tab and look for the Show All File extensions.
