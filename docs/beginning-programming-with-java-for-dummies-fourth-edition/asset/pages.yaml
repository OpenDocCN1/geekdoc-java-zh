  md: '# Chapter 20: Ooey GUI Was a Worm


    In Listing 20-2, the words new MyFrame() get the MyFrame constructor to do its
    work. and the constructor in Listing 20-2 does quite a bit of work! The constructor
    does the stuff that the main method does in Listing 20-1.


    +   - The constructor creates an ImageIcon containing the androidBook.jpg picture.

    - The constructor creates a JLabel object and puts the androidBook.jpg on the
    new label''s face.

    - The constructor adds the JLabel object.


    Time''s out. What added? In Listing 20-1, the statement

    frame.add(label);

    adds the JLabel object to the frame. But in Listing 20-2, there''s no frame variable.
    In Listing 20-2, all you have

    add(label);


    Well, here''s the good news: Inside a constructor declaration, the object that
    you''re constructing is "given". You don''t name new object in order to refer
    to new object. It''s as though the constructor''s code looks like this:


    ```

    MyFrame() {

    ImageIcon icon = new ImageIcon("androidBook.jpg");

    JLabel label = new JLabel(icon);

    frame_that_is_being_constructed.add(label);

    frame_that_is_being_constructed.

    setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);

    frame_that_is_being_constructed.pack();

    frame_that_is_being_constructed.

    setVisible(true);

    }

    ```


    Here\u20s how the constructor in Listing 20-2 finishes its work:


    +   - The constructor adds the JLabel object to the MyFrame object that''s being
    constructed.

    - The constructor tells the Java Virtual Machine to shut itself down when you
    close the frame.

    - The constructor shrink-wraps the frame around the image that appears on the
    frame.

    - The constructor makes the frame appear on your screen.


    the extends keyword adds a very important idea to Java programming \ the notion
    of inheritance. In Listing 20-2, the newly created MyFrame class inherits the
    methods (and other things) that are declared in the existing JFrame class. Inheritance
    is a pivotal feature of an object-oriented language.'
