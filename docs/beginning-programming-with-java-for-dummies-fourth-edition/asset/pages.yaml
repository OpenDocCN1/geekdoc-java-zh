    # Computers Are Stupid


    Handy as they are, all computers do the same thing. They do exactly what you tell
    them to do, and that''s very unfortunate. For example, in 1962, a Mariner spacecraft
    to Venus was destroyed just four minutes after its launch. Why? It was destroyed
    because of a missing keystroke in a FORTRAN program. Around the same time, NASA
    scientists caught an error that could have trashed the Mercury flights (Yup! These
    were flights with people on board!) The error was a period instead of a comma.
    (A programmer wrote DO 10 I=1.10 instead of DO 10 I=1,10.)


    With all due to my buddy RoboJeeves, and his computer cousins we are incredibly
    stupid. Sometimes they look like they''re second-guessing us, but actually they''re
    just doing what other humans tell them to do. They can toss virtual coins and
    use elaborate schemes to mimic creative behavior, but they never think on their
    own. If you say, "Jump," they do what they are programmed to do in response to
    the letters J-m-p.


    So when you write a computer program, you have to imagine that a genie has granted
    you three wishes. Don''t ask for eternal love, because if you do, the genie will
    give you a slobbering, adorable mate — someone that you don''t like at all. And
    don''t ask for a million dollars unless you want the genie to turn you into a
    band robber.


    Everything you write in a computer program has to be very precise. Take a look
    at an example. . . .


    # A Program to Echo Keyboard Input


    Listing 5-1 contains a small Java program. The program lets you type one line
    of characters on the keyboard. As soon as you press Enter, the program displays
    a second line that copies whatever you typed.'
