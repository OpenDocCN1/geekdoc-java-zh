    Java has a very strict rules about the use of types. For example, you cannot assign
    a double value (like 3.14) to an int variable (The compiler simply refuses to
    chop off the .14). You get an error message. So what else is new? Java isn''t
    completely unreasonable about the use of types. Java allows you to assign an int
    value (like myRandom.nextInt(5)) to a double variable (like interestRate). If
    you assign the int 2 to the double variable the value of interestRate becomes
    2.0. The result is shown on the second line of Figure 19-5.


    # Handing off a value


    When you call a method, you can pass information to that method on the fly. This
    information is in the method''s parameter list. Listing 19-7 has a call to the
    addInterest:


    ```

    anAccount.addInterest(interestRate);

    ```


    The first time you through the loop, the value of interestRate is 2.0. (Remember,
    I''m using the data in Figure 19-5). So at that point in your program''s run,
    the method calls as though it''s the following statement:


    ```

    anAccount.addInterest(2.0);

    ```


    The computer is to run the code inside the addInterest method (a method in Listing
    19-6). But first, the computer passes the value 2.0 to the parameter in the addInterest
    method''s header. So inside the addInterest method, the value of rate becomes
    2.0. For an illustration of this idea, see Figure 19-6.'
