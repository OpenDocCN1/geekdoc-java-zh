  md: '# Chapter 10: Which Way Did He Go?


    Runs of the Listing 10-3 code look like the stuff in Figure 10-5. The only difference
    between Listings 10-2 and 10-3 is the use of boolean variables. In Listing 10-3,
    you get past all the less-than signs and double equal signs before the start of
    any if statements. By the time you encounter the two statements, the conditions
    can use simple words — like isKid, and hasCoupon. With all these boolean variables,
    expressing each statement condition is a snap. You can read more about boolean
    variables in Chapter 8.


    Adding a boolean variable can make your code more manageable. But some programming
    languages don''t have boolean variables, so many programmers prefer to create
    conditions on the fly. That''s why I mix the two techniques (conditions with and
    without boolean variables) in this book.


    # Mixing different logical operators together


    If you read about Listing 10-2, you know that my local movie theater offers discount
