  md: '# # Chapter 3


    # # Running Programs


    **In This Chapter**


    +   - Compiling and running a program

    - Working with a workspace

    - Editing your Java code


    > > If you''re a programming newbie, for you, running a program probably means
    clicking a mouse. When you want to run Internet Explorer, so you double-click
    the Internet Explorer icon. That''s all there is to it.


    When you create your programs, the situation is a bit different. With a new program,
    the programmer (or someone from the programmer''s company) creates the program''s
    icon. Before that process, a perfectly good program may not have an icon at all.
    So what do you do with a brand-new Java program? How do you get the program to
    run? This chapter tells you what you need to know.


    # # Running a Canned Java Program


    The best way to get to know Java is to do Java. When you''re writing, testing,
    and running your own Java programs. This section prepares you by describing how
    you run and test a program. Instead of writing your own program, you run a program
    that I''ve already written for you. The program calculates your monthly payments
    on a home loan.


    The mortgage-calculating program doesn''t open its own window. Instead, the program
    runs in Eclipse''s Console view. The Console view is one of the tabs in the lower-right
    part of the Eclipse workbench (see Figure 3-1). A program that operates completely
    in this Console view is called a text-based program.'
