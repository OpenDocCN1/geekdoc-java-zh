  md: '# About the Author


    Dr. Barry Burd has an M.S. in Computer Science from Rutgers University and a Ph.D.
    in Mathematics from the University of Illinois. As a teaching assistant in Campaign-Urbanana,
    Illinois, he was elected five times to the university-wide List of Teachers Ranked
    as Excellent by their Students.


    Since 1980, Dr. Burd has been a professor in the Department of Mathematics and
    Computer Science at Drew University in Madison, New Jersey. When he''s not lecturing
    at Drew University, Dr. Burd leads training courses for professional programmers
    in business and industry. He has lectured at conferences in the United States,
    Europe, Australia, and Asia. He is the author of several articles and books, including
    Java For Dummies and Android Application Development All-in-One For Dummies, both
    published by John Wiley & Sons, Inc.


    Dr. Burd lives in Madison, New Jersey with his wife and two kids (both in their
    twenties, and mostly on their own). As an avid indoor enthusiast, Dr. Burd enjoys
    sleeping, talking, and eating.'
