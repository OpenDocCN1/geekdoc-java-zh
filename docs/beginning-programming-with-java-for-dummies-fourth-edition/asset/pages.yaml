    # Your Java Programming Toolset


    To write Java programs, you need the tools described previously in this chapter.


    +   - You need a Java compiler. (Refer to the section "Translating your code.")

    - You need a JVM. (Refer to the section "Running code.")

    - You need the Java API. (Refer to the section "Code you can use.")

    - You need access to the Java API documentation. (Again, refer to the "Code you
    can use" section.)


    You need some less exotic tools:


    +   - You need an editor to compose your Java programs. Listing 1-1 contains part
    of a computer program. When you come right to edit it, a computer program is a
    big bunch of text. To write a computer program, you need an editor — for creating
    text documents.


    An editor is like Microsoft Word, or any other word-processing program. The big
    difference is that an editor adds no formatting to your text — no bold, italic,
    or distinctions among fonts. Computer programs have no formatting whatsoever.
    They have nothing except plain old letters, numbers, and other keyboard characters.


    When you edit a program, you may see bold text, italic text, and text in several
    colors. But your program contains none of this formatting. If you see that looks
    like formatting, it''s because the editor you''re using does syntax highlighting.
    With syntax highlighting, an editor makes the text appear to be formatted in order
    to help you understand the structure of your program. Believe me, syntax highlighting
    is helpful.


    +   - You need a way to issue commands. You need a way to say things like "compile
    this program" and "run the JVM". Every computer provides ways of issuing commands
    in a Run dialog box. But when you use your facilities, you jump from one window
    to another. You open one window to read Java documentation, another window to
    edit a Java program, and a third window to start up the Java compiler. The process
    can be very tedious.


