  md: '# 366 Part IV: Using Program Units


    The class java.lang.System

    The package java.lang contains about 35 classes, including the ever-popular System
    class. (The class''s fully qualified name is java.lang.System, and the class''s
    simple name is System). Instead of writing java.lang.System throughout your code,
    you can just write System. You don''t need an import declaration.


    Among all of Java''s packages, the java.lang package is special. With or without
    an import declaration, the compiler imports everything in the java.lang package.
    You can start your program with import java.lang.System. If you don''t, the compiler
    adds this declaration automatically.


    The static.out variable

    What kind do you do in order to abbreviate System.out.println()? How can you shorten
    it to .out? An import declaration lets you abbreviate a class name. But in the
    expression System.out, the word out isn''t a class. The out is a static variable.
    (The out variable refers to the place where a Java program sends text output.)
    So you can''t write


    ```

    //This code is bogus. Don''t use it:

    import java.lang.System;

    ```


    What do you do instead? You write


    ```

    import static java.lang.System;

    ```


    To find out about the out variable''s being a static variable, read the next section.


    | All ye need to know |

    | I can summarize much of Java''s complexity in only a few sentences: | An object
    can have its own methods. An object can also have its own variables. |

    | The Java API contains many packages. | A class can have its static methods.
    A class can also have its static variables. |

    | A package contains classes. | |

    | From a class, you can create objects. | |'
