    # Expressions and conditions


    In Listing 8-4, the code gumballsPerKid >= 10 is an expression. The expression''s
    value depends on the variable gumballsPerKid. On a bad day, the value of gumballsPerKid
    >= 10 is false. The variable eachKidGetsTen is assigned the value false.


    An expression like gumballsPerKid >= 10, whose value is true or false, is sometimes
    called a condition.


    Values like true and false may look as though they contain characters, but they
    don''t. Internally, the Java Virtual Machine doesn''t store boolean values with
    the letters t-r-u-e or f-a-l-s-e. Instead, the JVM stores codes like 0 and 1.
    When the computer displays a boolean (as in System.out.println(eachKidGetsTen)),
    the Java Virtual Machine converts a 0 into the five-letter word false.


