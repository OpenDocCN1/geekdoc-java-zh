  md: '# Chapter 5: Composing a Program


    | Table 5-1 Some Scanner Methods |

    | To Read This... | ... Make This Method Call |

    | A number with no decimal point in it | nextInt () |

    | A number with a decimal point in it | nextDouble () |

    | A word (ending in a blank space, for example) | next () |

    | A line (or what remains) of a line after you''ve already read some data from
    the line | nextLine () |

    | A single character (such as a letter, charAt(character)) | findWithinHorizon(".",
    0) . charAt(0) |


