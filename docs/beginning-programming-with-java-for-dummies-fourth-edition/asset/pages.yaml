  md: "# Chapter 4: Exploring the Parts of a Program\n\n# Comments\n\n**A comment**\
    \ is text that's outside the normal flow. In Figure 4-2, the words \"A call comment:\"\
    \ aren't part of the Suzanne sentence. Instead, these words are about Suzanne\
    \ sentence.\n\nThe same is true of comments in computer programs. The first five\
    \ lines in Listing 4-1 contain one big comment. The computer doesn't act on this\
    \ comment. There are no instructions for the computer to perform this inside.\
    \ Instead, the comment tells others something about your code.\n\nComments are\
    \ for your own benefit, Imagine that you set aside your code for a while and on\
    \ something else. When you return to work on the code again, the comments help\
    \ you remember what you were doing.\n\nThe Java programming language has three\
    \ kinds of comments:\n\n+   * **Traditional comments**: The comment in Listing\
    \ 4-1 is a traditional comment. The comment begins with /* and ends with */ for\
    \ human eyes only. Nothing between the opening /* and the closing */ gets translated\
    \ by the compiler.\nThe second, and fourth lines in Listing 4-1 have extra asterisks.\
    \ I call \"extra\" because these asterisks aren't required when you create a comment.\
    \ They just make the comment look pretty. I include them in Listing 4-1 because,\
    \ for some reason I don't entirely understand, most Java programs add these asterisks.\n\
    \n+   * **End-of-line comments**: Here's some code with end-of-line comments:\n\
    ```java\nclass ThingsLike {\n    // Two things are missing\n    public static\
    \ void main(String[] args) {\n        System.out.println(\"sleep\"); // Missing\
    \ from here\n    }\n}\n```\n\n**End-of-line comment** starts with two slashes\
    \ and goes to the end of a line of type.\n\nYou may hear programmers talk about\
    \ *commenting* certain parts of their code. When you're writing a program and\
    \ something's not working, it often helps to try removing some of the code. If\
    \ nothing else, you find out what happens when suspicious code is removed. Of\
    \ course, you may not like what happens when the code is removed, you don't want\
    \ to delete the code completely. Instead, turn your statements into comments.\
    \ For example, turn `System.out.println(\"sleep\");` into `/* System.out.println(\"\
    sleep\"); */`. This keeps the Java compiler from seeing the code while you try\
    \ to figure out what's wrong with your program.\n\n![](img/6d9dcff12e52b997f3ad31445b712549_102_0.png)\n\
    \n+   * Tip"
