  md: '# 428 Part V: The Part of Tens


    # # ArrayList


    Chapter 16 introduces arrays. This is good stuff, but in any programming language,
    arrays have their limitations. For example, take an array of size 100. If you
    suddenly need to store a 101st value, you''re out of luck. You can''t change an
    array''s size without rewriting some code. Inserting a value into an array is
    another problem. To squeeze "Tim" alphabetically between "Tom" and "Tom", you
    may have to make room by moving thousands of "Tyler", "Uriah", and "Vector" names.


    But Java has ArrayList classes. An ArrayList objects grow and shrink as needed.
    You can also insert new values using the ArrayList class''s add method. ArrayList
    objects are very useful because they do all kind of nice things that arrays can''t.


    # # File


    Talk about your useful Java classes! The File class does a bunch of things that
    aren''t included in this book''s examples. Method canRead tells you whether you
    can read from a file or not. Method canWrite tells you if you can write to a file.
    Calling method deleteOnExit ensures you can delete a file, but not until your
    program stops running. Method exists checks to see whether you have a particular
    file. Methods isHidden, lastModified, and length give you even more information
    about a file. You can create a new directory by calling the mkdir method. Face
    it, this File class is powerful!


    # # Integer


    Chapter 18 describes the Integer class and its parseInt method. The Integer class
    has lots of other features that come in handy when you work with int values. For
    example, Integer.MAX_VALUE stands for the number 2147483647. That''s the largest
    value that an int variable can store. (Refer to Chapter 7.) The expression Integer.MIN_VALUE
    stands for the number -2147483648 (the smallest value that an int variable can
    store). A call to Integer.toBinaryString takes an int and returns its base-2 (binary)
    representation. And what Integer.toHexString does for base 2, Integer.toHexString
    does for base 16 (hexadecimal).'
