  md: '# Some handy import declarations


    When I wrote this section''s example, I was tired of writing the word System.
    After all, Listing 9-4 has ten System.out.print lines. By this point in the book,
    shouldn''t my computer remember out.print means?


    Of course, computers don''t work that way. If you want a computer to "know" out.print
    means, you have to code that knowledge somewhere inside the Java compiler.


    Fortunerately, the ability to abbreviate things like System.out.print is available
    from Java 5.0 onward. (An older compiler just chokes on the code in Listing 9-4.)
    This ability to abbreviate things is called static import. It''s illustrated in
    the second and third lines of Listing 9-4.


    Whenever I start a program with the line


    ```

    import static java.lang.System.out;

    ```


    I replace System.out with plain out in the remainder of the program. The same
    holds true of System.in. With an import declaration near the top of Listing 9-4,
    I can replace Scanner (System.in) with the simpler Scanner(in).


    You may be wondering all the fuss is about. If I can abbreviate java.util.Scanner
    by writing Scanner, what''s so special about abbreviating System.out? And why
    do I have to write out.print? Can I try System.out.print down to the single word
    print? Look again at the first few lines of Listing 9-4. When you need to use
    the static word? What''s the difference between java.util and java.lang?


    I''m sorry. Response to these questions won''t thrill. The fact is, I can''t explain
    any of these issues until Chapter 18. Before I can explain static import declarations,
    I need to introduce some ideas. I need to describe classes, packages, and members.


    So until you reach Chapter 18, please bear with me. Just paste this import declarations
    to the top of your Java programs and trust that everything will work well.


    You can abbreviate System.out with the single word out. And you can abbreviate
    System.in with the single word in. Just be sure to copy the import declarations
    exactly as you see them in Listing 9-4. With any deviation from the lines in Listing
    9-4, you may get a compiler error.


