    # Using JavaFX and Scene Builder


    GUI programs have two interesting characteristics:


    +   - GUI programs typically contain lots of code.

    - Much of this code differs very little from one GUI program to another.

    - GUI programs provide visual elements.


    > The best way to describe visual elements is to "draw" them. Describing them
    with code can be slow and unintuitive.


    So to make your GUI life easier, you can use JavaFX and Scene Builder. With Scene
    Builder, you describe your program visually. Scene Builder automatically turns
    your visual description into Java source code and XML code.


    # Installing Scene Builder


    Installing Scene Builder is like installing most software. Here''s how you do
    it:


    +   1. Visit www.oracle.com/technetwork/java/javase/downloads.

    2. Click the Download button for JavaFX Scene Builder.

    3. Accept the license agreement.

    4. Click the link corresponding to your computer''s operating system (Windows,
    Mac, or Linux).


    As a result, the download begins. On a Windows computer, you get an .exe file
    or a .msi file. Double-click the file to begin the installation.'
