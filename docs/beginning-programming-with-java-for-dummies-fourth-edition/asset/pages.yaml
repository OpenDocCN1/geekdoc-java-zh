  md: '# 138 Part II: Writing Your Own Java Programs


    You should notice a couple of things about Listing 7-2. First, you can read an
    int value with the nextInt method. Second, you can issue successive calls to Scanner
    methods. In Listing 7-2, I call nextInt twice. All do not have to separate the
