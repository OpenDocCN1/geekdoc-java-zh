  md: "# Chapter 16: Using Loops and Arrays\n\n![](img/6d9dcff12e52b997f3ad31445b712549_342_0.png)\n\
    \nHey! The program in Listing 16-5 is pretty big! It may be the biggest program\
    \ so far in this book. But big doesn't necessarily mean difficult. If each piece\
    \ of the program makes sense, you can create each piece on its own, and then put\
    \ all the pieces together. Voilà! The code is manageable.\n\n# Looping in Style\n\
    \nChapter 15's Listing 15-6 uses an enhanced for loop to step through a bunch\
    \ of values. In that, the values belong to an enum type. Well, this chapter also\
    \ deals with a bunch of values — namely, the values in an array. So you're probably\
    \ not surprised if I show you an enhanced for loop that steps through an array's\
    \ values.\n\nTo see such loop, start with the code in Listing 16-5. The last loop\
    \ in that program looks something like this:\n\n```\nfor (int roomNum = 0; roomNum\
