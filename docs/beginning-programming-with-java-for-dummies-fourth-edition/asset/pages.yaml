  md: "# Picky details about the switch statement\n\nA switch statement can take the\
    \ following form:\n\n```\nswitch (Expression) {\ncase FirstValue:\n    Statements\n\
    case SecondValue:\n    MoreStatements\n    // ... more cases...\ndefault:\n  \
    \  EvenMoreStatements\n}\n```\n\nHere are some tidbits about switch statements:\n\
    \n+   The Expression doesn't have to have an int value. It can be char, byte,\
    \ short, or int.\n\nFor example, the following code works in Java 5 and later:\n\
    \n```\nchar letterGrade;\nletterGrade =\n    keyboard.findWithinHorizon(\".\"\
    ,0).charAt(0);\nwitch (letterGrade) {\ncase 'A':\n    System.out.println(\"Excellent\"\
    );\n    break;\ncase 'B':\n    System.out.println(\"Good\");\n    break;\ncase\
    \ 'C':\n    System.out.println(\"Average\");\n    break;\n```\n\nIn fact, if you\
    \ avoid using the Scanner class and its findWithinHorizon method, this bullet's\
    \ switch statement works with all versions of Java — old and new."
