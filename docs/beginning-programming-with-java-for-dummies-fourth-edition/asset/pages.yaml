  md: "# Chapter 10: Which Way Did He Go?\n\nOne of the goals in computer programming\
    \ is for each program's structure to mirror whatever problem the program solves.\
    \ When a program reminds you of its underlying problem, the program is easy to\
    \ understand and inexpensive to maintain. For example, a program to tabulate customer\
    \ accounts should use names like customer and account. A program that deals with\
    \ three outcomes (home wins, visitor wins, and tie) should have a variable with\
    \ three possible values. The enum WhoWins {home, visitor, neither} creates a type\
    \ to store three values.\n\nThe WhoWins type is called an enum type. Think of\
    \ the new WhoWins type as a boolean (true and false), the WhoWins type has three\
    \ values (home, visitor, and neither). You can create a variable of type WhoWins\n\
    \n```\nWhoWins who;\n```\n\nand assign a value to the new variable.\n\n```\nwho\
    \ = WhoWins.home;\n```\n\nIn the next section, I put the WhoWins type to get good\
    \ use.\n\n# Using an enum type\n\nListing 10-7 shows how to use the brand new\
    \ WhoWins type.\n\n# Listing 10-7: Proud Winners and Sore Losers\n\n```\nimport\
    \ java.util.Scanner;\nimport static java.lang.System;\n\nclass' {\n\n    enum\
    \ WhoWins {home, visitor, neither}\n    public static void main(String[] args[])\
    \ {\n        Scanner keyboard = new Scanner(System.in);\n        int hankees,\
    \ socks;\n        WhoWins who;\n\n        out.println(\"Hankees and Socks scores?\"\
    );\n        hankees = keyboard.nextInt();\n        socks = keyboard.nextInt();\n\
    \        out.println();\n\n(continued)\n```"
