    # Some questions about object-oriented programming


    Here''s the world''s briefest object-oriented programming FAQ:


    +   - Can I have an object without having a class?

    No, you can. In Java, every object is an instance of a class.


    +   - Can I have a class without having an object?

    Yes, you can. In fact, almost every program in this book creates a class without
    an object. Take Listing 17-5, for example. The code in Listing 17-5 defines a
    class named ProcessPurchase. And nowhere (or anywhere else) do I create an instance
    of the ProcessPurchase. I have a class with no objects. That''s just fine. It''s
    business as usual.


    +   - After I''ve created a class and an instance, can I add more instances to
    the class?

    Yes, you can. In Listing 17-5, I create one instance, then another, and then a
    third if I wanted one time around the for loop. I''d have a fourth instance, and
    I''d put a fourth row in the table of Figure 17-8. With no objects, three objects,
    four objects, or more objects, I still have the same old Purchase class.


    +   - Can an object come from more than one class?

    Bite your tongue! Maybe object-oriented languages allow this nasty class cross-breeding,
    but in Java, it''s strictly forbidden. That''s one of the things that distinguishes
    Java from some of the languages that preceded it. Java is cleaner, more uniform,
    and easier to understand.'
