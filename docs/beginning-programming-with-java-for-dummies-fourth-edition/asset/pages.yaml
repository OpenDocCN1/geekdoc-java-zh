  md: '# Chapter 3: Running Programs


    # # What can possibly go wrong?


    Ridding the editor of jagged underlines is cause for celebration. Eclipse like
    the look of your code, so from that point on, it''s smooth sailing. Right?


    Well, it''s not necessarily so. In addition to some conspicuous compile-time errors,
    your code can have other, less obvious errors.


    Imagine someone telling you to "go to the intersection, and then run right." You
    notice immediately that the speaker made a mistake, and you respond with a polite
    "Huh?" The nonsensical runtime phrase is like the jagged underlines in Eclipse''s
    editor. As a listening being, you might be able to guess what run right means,
    but Eclipse''s never dares to fix your mistakes.


    In addition to compile-time exceptions, some kind of gremlins can hide inside
    your Java program:


    +   * Unchecked runtime exceptions: You have no compile-time errors, but when
    you run your program, the run ends prematurely. Somewhere in the middle of the
    run, your instructions tell Java to do something that can''t be done. For example,
    if you''re running the Mortgage program in the "Running a Canned Java Program"
    section, you type 1,000,000.00 instead of 100,000.00. Java doesn''t like the mistake,
    so your program crashes and displays a nasty-looking message, as shown in the
    figure.


    ![](img/6d9dcff12e52b997f3ad31445b712549_82_0.png)


    This is an example of an unchecked runtime exception — the equivalent of someone
    telling you to run right at the intersection when the only thing to hit is a big
    wall. Eclipse''s editor doesn''t warn you about an unchecked runtime exception
    because, until you run the program, the computer can''t predict that the exception
    will occur.


    +   * Logic errors: You see no error in Eclipse''s editor, and when you run your
    code, the program runs to completion. But the answer is not correct. Instead of
    $552.20, the output is $552,200,000.00. The program wrongly tells you to pay thousands
    of times what your house is worth and totals each month! The equivalent of being
    told to run right instead of turning. You can drive in the right direction for
    a long time.


    ![](img/6d9dcff12e52b997f3ad31445b712549_82_1.png)


    (continued)'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# 68 Part I: Getting Started with Java Programming


    (continued)


    Logic errors are the most challenging to find and fix. And worst of all, logic
    errors often go unnoticed. In March 1985, I got a monthly home heating bill for
    $1,328,932.21. Clearly, some computer had printed the incorrect amount. When I
    called the gas company to complain about it, the service representative said,
    "Don''t be upset. Pay half that amount."


    +   Compile-time warnings: A warning is not as severe as an error message. So,
    when Eclipse notices something suspicious in your program, the editor displays
    a jagged yellow underline, a tiny yellow icon exclamation point and several other-intrusive
    clues.


    For example, in the figure below I add something about amount = 10 to the code
    from Listing 3-1. (It''s bit on on line 8). The problem is, I never make use of
    the amount or of the number 10 anywhere in my program. With its faint yellow marks,
    Eclipse tells me "Your amount = 10 code isn''t enough to be a show-stopper. Eclipse
    can still manage to run your program. Are you sure you want amount = 10 (the stuff
    that seems to serve no purpose)?


    ![](img/6d9dcff12e52b997f3ad31445b712549_83_0.png)


    Being told to "turn when you reach the intersection." The direction may be just
    fine. If you''re suspicious, you ask, "Which way should I turn? Left or right?"


    When you''re sure that you know what you''re doing, you can ignore warnings and
    worry about them at some later time. But a warning can be an indicator that something
    more serious is with your code. My sweeping recommendation is this: Pay attention
    to warnings. But, if you can''t figure out why you''re getting a particular warning,
    don''t let it prevent you from moving forward.


    # What''s All That Stuff in Eclipse''s Window?


    It it or not, an editor rejected one of my book proposals. In the margins, the
    editor scribbled "This is not a word" next to things like "can''t," "it''s," and
    "I''ve". To this day, I still do not know what this editor did not know about
    contractions. My own opinion is that language always needs to expand. Where would
    we be without new words — words like dotcom, infomercial, and vaporware?'
