  md: "# 230 Part III: Controlling the Flow\n\nFebruary also contains its own if statement.\
    \ In Chapter 10, I nest state-ments within other statements. But in February,\
    \ I nest an if statement within a switch statement. That's cool.\n\n# Using a\
    \ Conditional Operator\n\nJava has a neat feature that I can't resist writing\
    \ about. Using this feature, I can think about alternatives in a very natural\
    \ way.\n\nAnd what do I mean by a \"natural way\"? If I think out loud as I imitate\
    \ the statement near the end of Listing 11-3, I come up with this:\n\n```\n//\
    \ thinking in Listing 11-3:\nWhat should I do next?\nIf this is a leap year,\n\
    \  I make the numberOfDays be 29;\nOtherwise,\n  I make the numberOfDays be 28.\n\
    ```\n\nI'm wandering in an if statement without a clue about what I'm doing next.\
    \ It seems silly. It's February, and everybody knows what you do in February.\
    \ You ask how many days the month has.\n\nIn my opinion, the code in Listing 11-3\
    \ doesn't reflect the most natural way to think about February. Here's a more\
    \ natural way:\n\n```\n// A more natural way to think about the problem:\nThe\
    \ value of numberOfDays is...\nWait! Is this a leap year?\n  If yes, 29\n  If\
    \ no, 28\n```\n\nIn this second, more natural way of thinking, I know from the\
    \ start that I'm picking a number of days. By the time I reach a fork in the road\
    \ (is this a leap year?), the only remaining task is to choose between 29 and\
    \ 28.\n\nI can make the choice with finesse:\n\n```\ncase 2:\n  System.out.print(\"\
    Leap year (true/false)? \");\n  isLeapYear = keyboard.nextBoolean();\n  numberOfDays\
    \ = isLeapYear ? 29 : 28;\n```\n\nThe ? : is called a conditional operator. In\
    \ Figure 11-6, I show you how my natural thinking about February can morph into\
    \ the conditional operator's format."
