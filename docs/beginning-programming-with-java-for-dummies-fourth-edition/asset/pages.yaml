  md: '# Chapter 18: Using Methods and Variables from a Java Class


    # Calling an object''s methods


    Calling a string''s equals method is like getting a purchase''s total. With both
    equals and total, you use your old friend, the dot. For example, in Listing 17-3,
    you write


    ```

    System.out.println(onePurchase.total);

    ```


    and in Listing 18-5, you write


    ```

    if (password.equals(userInput))

    ```


    A dot works the same way for an object''s variables and its methods. In either
    case, a dot takes the object and picks out one of the object''s parts. It works
    whether that part is piece of data (as in onePurchase.total) or a method (as in
    password.equals).


    # Combining and using data


    At this point in the chapter, I can finally say, "I told so." Here''s a quote
    from Chapter 17:


    > A class is a design plan; it describes the way in which you intend to combine
    and use pieces of data.


    A class defines the way you use data. How do you use a password and a user''s
    input? Check to see whether they''re the same. That''s how Java''s String class
    defines an equals method.


    An object can be more than a bunch of data. With object-oriented programming,
    each object possesses copies of methods for using that object.


    ![](img/6d9dcff12e52b997f3ad31445b712549_372_0.png)


    # Static Methods


    You have a fistful of checks. Each check has a number, an amount, and a payee.
    You print checks like these with your own laser printer. To print the checks,
    you use a Java class. Each object made from the Check class has three variables
    (number, amount, and payee). And each object has one method (a print method).
    You can see all this in Figure 18-7.'
