  md: '# 394 Part IV: Using Program Units


    # The Java Swing Classes


    Java''s Swing classes (AWT) create graphical objects on a computer screen. The
    objects can include buttons, icons, text fields, check boxes, and other good things
    that make windows so useful.


    The name "Swing" isn''t an acronym. When the people at Sun Microsystems were first
    creating the code for these classes, one of the developers named "Swing" because
    swing music was enjoying a nostalgic revival. And, in addition to String and Swing,
    the standard Java API has a Spring class. That''s another story.


    Actually, Java''s API has several sets of windowing components. For details see
    the "Java GUIs" sidebar.


    # Java GUIs


    Java has four (''count'', four) sets of classes for creating GUI components.


    The AWT implements only the kinds of components that were available on all common
    operating systems in the mid-1990s. So, using AWT, you can add a button to your
    application, but you can''t easily add a table or tree.


    +   **The Abstract Window Toolkit**: The original set of classes, dating back
    to JDK 1.0.


    +   **Swing**: A set of classes created to fix some of the difficulties posed
    by the use of the AWT. The Swing was introduced in JOSE 1.2.


    Classes in this set belong to packages whose names begin with java.awt. Components
    in this set have names like Button, TextField, Frame, and so on.


    Classes in this set belong to packages whose names begin with java.swing. Components
    in this set have names like JButton, JTextField, JFrame, and so on.


    Each component in an AWT program has a *peer*—a companion that belongs to the
    computer''s own operating system. For example, when you create an AWT Button,
    Mac creates its own kind of button to be displayed on the user''s screen. When
    the same program runs on Windows, the Windows computer creates a different kind
    of button (a Windows button) to display on the computer''s screen. The Java code
    in the AWT interacts with the Mac or Windows button, adding additional functionality
    when needed.


    Unlike an old AWT component, Swing has no peer. When you create a JButton in your
    Java program, the computer''s operating system doesn''t create a button of its
    own. Instead, the JButton you see is a pure Java object. Java''s visual rendering
    code draws this object on a window. This is good news and bad news. The good news
    is, a Swing program


    ![](img/6d9dcff12e52b997f3ad31445b712549_409_0.png)'
