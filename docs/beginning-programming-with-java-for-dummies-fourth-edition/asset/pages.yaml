  md: '# 270 Part III: Controlling the Flow


    # # Name that file


    What if a file that contains data isn''t in your program''s project folder? If
    that''s the case, when you call File, the file''s name must include folder names.
    For example, in Windows, your TallyComputer.java program might be in c:\Users\MyUsername\workspace\13-09
    folder, and a file named totals might be in a folder named c:\advertisements.
    (See the following figure).


    ![](img/6d9dcff12e52b997f3ad31445b712549_285_0.png)


    Then, to refer to the totals file, you include the folder name, the filename,
    and (to on the safe side) the drive name:


    ```

    Scanner diskScanner = new Scanner(

    new File("c:\advertisements\totals")\));

    ```


    Notice that I do use the sidebar to separate the drive letter, the folder name,
    and the filename. To find out, look at the sidebar entitled "Escapism" in Chapter
    12. The string "totals" with a single backslash for a tab, followed by totals.
    In this example, the file''s name is totals, not totals. With a single backslash,
    the name ...advertisements\totals" would not work correctly.


    Inside quotation, you use the double backslash to indicate what would usually
    be a single backslash. The string "c:\advertisements\totals" stands for c:\advertisements\totals.
    That''s good because c:\totals is how you normally refer to a file in Windows.


    If you want to avoid this backslash confusion, use forward slashes to specify
    each file''s location. Windows responds exactly the same way as to New File("c/advertisements/totals")
    . And if you use UNIX, Linux, or a Macintosh, the double backslash nonsense doesn''t
    apply to you. Just write


    ```

    Scanner diskScanner =

    new Scanner (new File(

    "/Users/me/advertisements/totals")\));

    ```


    or something that reflects your system''s structure.'
