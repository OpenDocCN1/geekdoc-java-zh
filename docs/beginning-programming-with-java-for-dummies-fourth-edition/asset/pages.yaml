  md: '# 318 Part IV: Using Program Units


    It''s so hard to get help these days. How many times have you told the clerk to
    fill the higher numbered rooms first? The lower numbered rooms are older, and
    they are badly in need of repair. For example, Room 3 has an indoor pool.(The
    pipes leak, so the carpet is soaking wet.) Room 2 has no heat (so, not in winter,
    anyway). Room 1 has serious electrical problems (so, for that room, you always
    get payment in advance). Besides, Room 8 is vacant, and you charge for the higher
    numbered rooms.


    Here''s where subtle change in presentation can make a big difference. You need
    a program that lists vacant rooms in reverse order. That way, Room 8 catches the
    clerk''s eye before Room 2 does.


    Think about strategies for a program that displays data in reverse. With the input
    from Figure 16-1, the program''s output should look like the display shown in
    Figure 16-5.


    ![](img/6d9dcff12e52b997f3ad31445b712549_333_0.png)


    Here''s the first (bad) idea for a programming strategy:


    ```

    Get the last value in the occupancy file.

    If the value is 0, print the room number.

    Get the next-to-last value in the occupancy file.

    If the value is 0, print the room number.

    ...

    And so on.

    ```


    With some fancy input/output programs, this strategy may be workable. But no matter
    what input/output program you use, jumping to the end or to the middle of a file
    is a big pain in the boot. It''s especially bad if you plan to jump repeatedly.
    So go back to the drawing board and think of something better.


    Here''s an idea! Read all the values in the occupancy file and store each in a
    variable of its own. Then you step through the variables in reverse order, displaying
    a room number when it''s appropriate to do so.'
