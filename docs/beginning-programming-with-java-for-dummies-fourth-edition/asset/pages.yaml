  md: '# 302 Part III: Controlling the Flow


    Here''s how the loop in Listing 15-5 follows the format:


    +   **In Listing 15-5, the word Symbol is the name of a type.**


    The int type describes values like -1, 0, 1, and 2. The boolean type describes
    the values true and false. And (because of the code in Listing 15-5) the Symbol
    type describes the values cherry, lemon, kumquat, and rutabaga. For more information
    on enum types like Symbol, see Chapter 10.


    +   **In Listing 15-1, the word leftReel is the name of a variable.**


    The loop in Listing 15-1 defines count as an int variable. Similarly, the loop
    in Listing 15-5 defines leftReel to be a Symbol variable. So in theory, the variable
    leftReel can take on any of the four Symbol values.


    By the way, this variable leftReel because the symbols that can take any of the
    leftmost of the slot machine''s reels Because all three of the slot machine''s
    reels have the same symbols, I also have named this variable middleReel or rightReel.
    But on second thought, I''ll save the names middleReel and rightReel for a later
    example.


    +   **In Listing 15-5, the expression Symbol.values() stands for the values in
    Listing 15-5.**


    To quote myself in the previous bullet, "in theory, the variable leftReel can
    take on any of the four Symbol values." "Well, the RangeOfValues part of the statement
    turns theory into practice. This third item inside the parentheses, "Have as many
    loop iterations as there are Symbol values, and have the leftReel variable take
    on a different Symbol value during each of the loop''s iterations."


    The loop in Listing 15-5 undergoes four iterations—an iteration in which leftReel
    has value cherry, another iteration in which leftReel has value lemon, a third
