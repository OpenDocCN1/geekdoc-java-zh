    \n# Too many curly braces\n\nYou're looking for the nearest gas station, so you\
    \ ask one of the locals. \"Go to the first traffic light and make a left,\" says\
    \ the local. You go straight for a few streets and see a blinking yellow signal.\
    \ You turn left at the signal and travel for a mile or so. No gas station? Maybe\
    \ you mistook the blinking signal for a real traffic light.\n\nYou come to a fork\
    \ in the road and say to yourself, \"The directions said nothing about a fork.\
    \ Which should I go?\" You veer right, but a minute later, you're forced onto\
    \ a highway. You see a sign that says, Next Exit 24 Miles. Now you're really lost,\
    \ and gas gauge points to \"S.\" (The \"S\" stands for \"Stranded.\")\n\nSo here's\
    \ what happened: You made one mistake. You shouldn't have turned left at the yellow\
    \ blinking light. That mistake alone wasn't so terrible. But that first mistake\
    \ led to more confusion, and eventually, your choices made no sense at all. If\
    \ you hadn't turned at the blinking light, you'd never encountered stinking fork\
    \ in the road. Then getting on the highway was sheer catastrophe.\n\nIs there\
    \ a point to this story? Of course there is. A computer can get itself into the\
    \ same sort of mess. The computer notices an error in your program. Metaphorically\
    \ speaking, the computer takes a fork in the road — a fork based on the original\
