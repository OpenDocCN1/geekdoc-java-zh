  md: '# 254 Part III: Controlling the Flow


    # Running a Disk-Oriented Program


    To deal with volumes of data, you need tools for reading from (and writing to)
    disk files. At the mere mention of disk files, some people'' hearts start to pulsate
    with fear. After all, a disk file is exclusive and invisible. It''s stored inside
    your computer, with some magic process.


    The truth is, getting data from a disk is very much like getting data from the
    keyboard. And printing data to a disk is like printing data to the computer screen.


    In this book, displaying a program''s output "the computer screen" means displaying
    text in Eclipse''s Console view. If you shun Eclipse in favor of a different IDE
    (such as NetBeans or IntelliJ IDEA) or shun all IDEs in favor of your system''s
    command window, then "the computer screen" means something slightly different.
    Please read between the lines as necessary. Also, I am well aware that some computers
    have flash memory with no honest-to-goodness disks inside. Terms like "disk-oriented"
    and "disk files" are showing signs of age. But let face facts: A "record store"
    no longer sells vinyl records, and in U.S. measurement units, 12 inches are no
    longer the length of the king''s foot. Today''s LCD screens no longer need saving.
    Unlike the old mechanical car radios, a web page buttons don''t make your favorite
    stations.


    ![](img/6d9dcff12e52b997f3ad31445b712549_269_0.png)


    Consider the scenario when you run the code in the previous chapters. You type
    some stuff on the keyboard. The program takes this stuff and spits out some stuff
    of its. In effect, the flow of data goes from the keyboard, to the computer''s
    innards, and to the screen, as shown in Figure 13-1.


    Of course, the goal in this chapter is the scenario in Figure 13-2. There''s a
    file containing data on your hard drive. The program takes data from the disk
    file and spits out some brand-new data. The program sends the new data to another
    file on the hard drive. In effect, the flow of data goes from a disk file, to
    the computer''s, and on to another disk file.


    The two scenarios in Figures 13-1 and 13-2 are very similar. In fact, helps to
    remember these fundamental points:


    +   * The stuff in a disk file is no different from the stuff that you type on
    a keyboard.


    +   * If a keyboard-reading program expects you to type 19.95, 5, then the corresponding
    disk-reading program expects a file containing those same characters, 19.95, 5.
    If a keyboard-reading program expects you to press Enter and type more characters,
    then the corresponding disk-reading program expects more characters on the next
    line in the file.'
