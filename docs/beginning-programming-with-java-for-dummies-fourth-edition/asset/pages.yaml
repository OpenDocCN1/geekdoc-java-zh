  md: '# 20 Part I: Getting Started with Java Programming


    # Code you can use


    During the 1980s, my cousin-in-law Chris worked for a computer firm. The firm
    wrote code for word-processing machines. (At the time, if you wanted to compose
    documents without a typewriter, you bought a “computer” that did nothing but word
    processing.) Chris complained about being asked to write the same code over and
    over again. “First, I wrote a search-and-replace program. Then I wrote a spell
    checker. Then I wrote another search-and-replace program. Then, a different kind
    of spell checker. And then, a better search-and-replace.


    How did Chris manage to stay interested in his work? How did his employer manage
    to stay in business? Every few months, Chris had to reinvent the wheel. Toss out
    the search-and-replace program and write a new one. That’s inefficient. What’s,
    boring.


    For years, computer professionals were seeking the Holy Grail — a way to write
    software that’s easy to reuse. Don’t write and rewrite your search-and-replace
    code. Just break the task into tiny pieces. One piece searches for a single character,
    another piece looks for blank spaces, and a third piece substitutes one for another.
    When you have all the pieces, assemble these pieces to form a search-and-replace
    program. Later, when you think of a new feature for your word-processing software,
    you reassemble the pieces in a slightly different way. It’s sensible, it’s cost
    efficient, and it’s much more.


    The 1980s saw several advancements in software development, and by the early 1990s,
    many large programming projects were being written from prefab components. Java
    came along in 1995, so it was natural for the language’s founders to create a
    library of reusable code. The library included about 250 programs, including code
    for dealing with disks, code for windows, and code for passing information over
    the Internet. Since 1995, this library has grown to include more than 4,000 programs.
    This library is called the Application Programming Interface (API).


    Every program, even the simplest one, calls on the Java API. This Java API is
    both useful and formidable. It’s useful because all of the things you can do with
    the API’s programs. It’s formidable because the API is so extensive. No one ever
    all the features available by the Java API: Programmers remember the features
    they use often and look up the features they need in a pinch. They look up these
    features in an online document called the API Specification (known affectionately
    to most Java programmers as the API documentation, or Javadoc).'
