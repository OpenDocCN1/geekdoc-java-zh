    # Indenting statements in your code


    Notice how, in Listing 9-2, the println calls inside the if statement are indented.
    Strictly speaking, you don''t have to indent the statements that are inside if
    statement. For all the compiler cares, you can write your program on a single
    line or all your statements in an artful, misshapen zigzag. The problem is, if
    you don''t indent your statements in some logical fashion, then not anyone else
    can make sense of your code. In Listing 9-2, the indenting of the println helps
    your eyes (and brain) see that these statements are subordinate to the overall
    if/else flow.


    In a small program, unindented or poorly indented code is tolerable. But in a
    complicated program, indentation that doesn''t follow a neat, logical pattern
    is a bad, ugly nightmare.


