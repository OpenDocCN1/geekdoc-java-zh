  md: '# 90 Part II: Writing Own Java Programs


    # The declaration, the header, and the call!


    If you have a basic understanding of what a method is and how it works (preceding
    section), you can dig a little deeper into some useful terminology:


    +   - If I''m not being lazy, I refer to the code in Listing 4-2 as a method.
    If I''m not being lazy, I refer to this code as a method declaration.

    - The method declaration in Listing 4-2 has two parts. The first line (the part
    with the name FixTheAlternator in, up to not including the open curly brace) is
    called a method header. The rest of Listing 4-2 (the part surrounded by curly
    braces) is a method body.

    - The term method declaration distinguishes the list of instructions in Listing
    4-2 from the instruction in Listing 4-3, which is known as a method call.


    For a handy illustration of all the method terminology, see Figure 4-5.


    ![](img/6d9dcff12e52b997f3ad31445b712549_105_0.png)


    Figure 4-5:

    The terminology describing methods.


    A method''s header and body are like an entry in a dictionary. An entry doesn''t
    really use the word that it defines. Instead, an entry tells you what happens
    if and when you use the word.'
