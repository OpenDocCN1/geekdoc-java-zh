    Some methods have this substitution effect, but when you run `System.out.println`
    don''t. To find out about this topic, see Chapter 19.


    # Who does that, and how?


    When you write a program, you''re called a programmer, but when you run a program,
    you''re called a user. So when you test your code, you''re being both the programmer
    and the user.


    Suppose that your program contains a `keyboard.nextSomething()` call, like the
    calls in Listings 5-1 and 6-2. When your program gets input from the user. But,
    when the user does not know what is on the keyboard? If the user and the programmer
    are the same person, knowing what to type is no big deal. For example, when you
    start running the code in Listing 5-1, you have this book in front of you, and
    the books say ...The computer is working for you to type something... So you type
    the line of text... press Enter. Everything is fine.


    But very few programs come with their own books. In many instances, when a program


    starts running, the user has to stare at the screen to figure out what to do.
    The code in Listing 6-2 runs in this-at-the-screen scenario. In Listing 6-2, the
    first call to print puts an informative message (what''s the price of a CD-ROM?)
    on the user''s screen. A message of this is called a prompt.


    When you start running, you can confuse the rules of the program and the user''s
    input. So no predefined relationship between a programmer and the subset. To create
    a prompt, you can call `print` or `println`. Then, to read the user''s input,
    you call `nextLine`, `nextDouble`, or one of the Scanner class''s other `nextSomething`
    methods. These print and next calls belong in two separate statements. Java has
    no commonly used, single statement that does both the prompting and the "next-ing."'
