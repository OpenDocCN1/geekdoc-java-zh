  md: '# 170 Part II: Writing Own Java Programs


    # ## Automated debugging


    If your program is not working correctly, you can try something called a debugger.
    A debugger automatically adds invisible print and println to your suspicious code.
    In fact, debuggers have all kinds of features to help you diagnose problems. For
    example, a debugger can pause a run of your program and accept special commands
    to display variables'' values. With some debuggers, you can pause a run and change
    a variable''s value (just to see if things goes better when you do).


    An Eclipse perspective is a collection of views intended to help you with a certain
    aspect of program development. By default, Eclipse starts in the Java perspective
    — the arrangement of views to help you create programs. Another perspective —
    the Debug perspective helps you diagnose errors in your code.


