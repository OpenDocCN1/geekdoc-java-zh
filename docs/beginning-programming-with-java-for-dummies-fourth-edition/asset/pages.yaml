  md: '# Chapter 3: Running Programs


    Even the Oxford English Dictionary (the last word in any argument about words)
    grows by more than 4,000 entries each year. That''s an increase of more than one
    percent per year. It''s about 11 new words per day!


    The fact is, human thought is like a big high-rise building. You can''t build
    the fift floor until you''ve built at least part of the forty-ninth. You can''t
    talk about spam until you have a word like e-mail. With all that goes on these
    days, you need verbal building blocks. That''s why this section contains a bunch
    of new terms.


    In this section, each newly defined term describes an aspect of the Eclipse IDE.
    Before you read all Eclipse terminology, I provide the following disclaimers:


    +   - This section is optional reading. Refer to this section if you have trouble
    understanding some of this book''s instructions. But if have no trouble navigating
    the Eclipse IDE, don''t complicate things by fussing over the terminology in this
    section.

    - This section provides explanations of terms, not formal definitions of terms.
    My explanations are fairly precise, but no airtight. Almost every description
    in this section has hidden exceptions, omissions, emissions, and exclusions. Take
    the paragraphs in this section to be friendly reminders, not legal contracts.

    - Eclipse is a very useful tool. Eclipse isn''t officially part of the Java ecosystem.
    Although I dont describe details in this book, you can write Java programs without
    ever using Eclipse.


    # Understanding the big picture


    Your tour of Eclipse begins with a big Bird''s eye view.


    +   - Workbench: The Eclipse desktop (refer to Figure 3-3). The workbench is the
    environment in which you develop code.

    - Area: A section of the workbench. The workbench in Figure 3-3 contains five
    areas. To illustrate the point, I''ve drawn borders around each of the areas (see
    Figure 3-15).

    - Window: A copy of the Eclipse workbench. With Eclipse, you can have several
    copies of the workbench open at once. Each copy appears in its own window.

    - Action: A choice that''s offered to you, typically when you click something.
    For example, when you choose File:New in Eclipse''s main menu bar, you see a list
    of new things you can create. The list usually includes Project, Folder, File,
    and Other, but it may also include things like Package, Class, and Interface.
    Each of these things (item in the menu) is called an action.'
