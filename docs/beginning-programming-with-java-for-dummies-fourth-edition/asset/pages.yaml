  md: "# Part IV: Using Program Units\n\nThis loop takes the place of ten assignment\
    \ statements because the computer executes the statement guestsIn[roomNum] = 1\
    \ ten times. The first time around, the value of roomNum is 0, so in effect, the\
    \ computer executes\n\n```\nguestsIn[0] = 1;\n```\n\nIn the next loop iteration,\
    \ the value of roomNum is 1, so the computer executes the equivalent of the following\
    \ statement:\n\n```\nguestsIn[1] = 1;\n```\n\nDuring the next iteration, the computer\
    \ behaves as if it's executing\n\n```\nguestsIn[2] = 1;\n```\n\nAnd so on. When\
    \ roomNum gets to be 9, the computer executes the equivalent of the following\
    \ statement:\n\n```\nguestsIn[9] = 1;\n```\n\nNotice that the loop's counter goes\
    \ from 0 to 9. Compare this with Figure 16-6 and remember that the indices of\
    \ an array go from 0 to one fewer than the number of components in the array.\
    \ Looping with room numbers from 0 to 9 covers all the rooms in the Java Motel.\n\
    \n![](img/6d9dcff12e52b997f3ad31445b712549_337_0.png)\n\nWhen you work with an\
    \ array, and you step through your components using a for loop, you normally start\
    \ the loop's counter to 0. To form the condition that for another iteration, you\
    \ often write an expression like roomNum < arraySize, where arraySize is the number\
    \ of components in the array.\n\n# Creating a report\n\nThe code to create the\
