  md: "# Chapter 11: How to Flick a Virtual Switch\n\nIn some ways, if statements\
    \ are more versatile than switch state-ments. For example, you can't use a condition\
    \ in a switch statement's Expression:\n\n```\n// You can't do this:\nswitch (age\
    \ >= 12 && age < 65)\n```\n\nYou can't use a condition as a case value, either:\n\
    \n```\n// You can't do this:\nswitch (age) {\ncase age <= 12: //...etc.\n```\n\
    \n# To break or not to break\n\nAt one time or another, every Java programmer\
    \ forgets to use break state-ments. At first, the resulting output is confusing,\
    \ but then the programmer remembers fall-through. The term fall-through describes\
    \ what happens when you end a case without a break statement. What happens is\
    \ execution of the code falls right through to the next case in line. Execution\
    \ keeps fall-ing until you eventually reach a break statement or the end of the\
    \ entire statement.\n\nIf you don't believe me, just look at Listing 11-2. This\
    \ listing's code has a switch statement gone bad.\n\n# Listing 11-2: Please, Gimme\
    \ a Break!\n\n```\n/*\n* This isn t good code. The programmer forgets some\n*\
    \ of the break statements.\n */\nimport java.util.Scanner;\nimport java.util.Random;\n\
    import static java.lang.System.out;\n\nclass BadBreaks {\n\n    public static\
    \ void main(String[] args[]) {\n        Scanner keyboard = new Scanner(System.in);\n\
    \        Random myRandom = new Random();\n        int randomNumber;\n\n      \
    \  out.print(\"Type your question, my child: \");\n        keyboard.nextLine();\n\
    \n        randomNumber = myRandom.nextInt(10) + 1;\n```"
