  md: '# Chapter 3: Running Programs


    When you use a view to change something, the change takes immediately. For example,
    when you choose Delete in the Package Explorer''s context menu, whatever item
    you''ve selected is deleted immediately. In a way, this behavior is nothing new.
    The same kind of happens when you recycle a file using Windows Explorer or a trash
    file using the Macintosh Finder.


    +   - Editor: A part of the Eclipse workbench displays information for you to
    modify. Typical editor displays information in the form of text. This text can
    be the contents of a file. For example, in Figure 3-10 displays the contents of
    the MyFirstClass.java file.


    When you use an editor to change something, the change doesn''t take place immediately.
    For example, look at the editor in Figure 3-10. This editor displays the contents
    of the MyFirstClass.java. You can type all kinds of things in the editor. Nothing
    happens to MyFirstClass.java until you choose File:Save from Eclipse''s menu bar.
    Of, this behavior is nothing new. The same kind of happens when you work in Microsoft
    Word or in any other wordprocessing program.


    Like others, I occasionally become lazy and use the word ''view'' when I really
    mean ''view'' or ''editor''. When you catch me doing this, shake your head and
    move onward. When I''m being very careful, I use the official Eclipse terminology.
    Unfortunately, this ''parts'' terminology doesn''t stick in people''s very well.


    An area of the Eclipse workbench might contain several views or editors. Most
    users get alone without giving this ''several views'' business a second thought
    (or even a first thought). But if you care about the terminology surrounding tabs
    and views, here''s the scoop:


    +   - Tab: That''s impossible to describe except by calling a ''tab''. That we
    can call a tab by any name that would move us as well from one view to another
    or one editor to another. The important thing is, views can be stacked on top
    of one another. Eclipse displayed views show as though they''re in a tabbed notebook.
    For example, Figure 3-14 displays one area of the Eclipse workbench. The area
    contains five views (the Problem view, the Javadoc view, the Declaration view,
    the Search view, and the Console view). Each view has its own tab.


    A bunch of stacked views is called a tab group. To bring a view in the stack to
    the front, you click that view''s tab.


    And, by way, all this about tabs and views holds true for tabs and editors. The
    only interesting thing is the way Eclipse uses the word ''editor.'' In Eclipse,
    each tabbed page of the editor area is an individual editor. For example, the
    Editor area in Figure 3-16 contains three editors (not three tabs belonging to
    a single editor)


