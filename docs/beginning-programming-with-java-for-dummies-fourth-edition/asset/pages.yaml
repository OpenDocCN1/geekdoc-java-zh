  md: '# 92 Part II: Writing Your Java Programs


    When the ThingsLike program runs, the computer automatically finds the program''s
    main method and executes any instructions inside the method''s body. In the ThingsLike
    program, the main method body has only one instruction. That instruction tells
    the computer to print Chocolate, royalties, sleep on screen.


    None of the instructions in a method are executed until the method is called into
    action. If you give the method name main, that method is called into action automatically.


    # How you finally tell the computer to do something


    Buried in the heart of Listing 4-1 is the single line that actually issues direct
    instruction to the computer. The line


    ```

    System.out.println("Chocolate, royalties, sleep");

    ```


    tells the computer to display the words Chocolate, royalties, sleep. If you use
    Eclipse, the computer displays Chocolate, royalties, sleep in the Console view.)
    I can describe this line of code in at least two different ways:


    +   It''s a statement. In Java, a direct instruction that tells the computer to
    do something is called a statement. The statement in Listing 4-1 tells the computer
    to put 7 in a memory location or make a window appear on the screen. The statements
    in computer programs do all kinds of things.


    +   It''s a method call. In the "What is a method?" section, earlier in this chapter,
    I describe something named a "method call." The statement


    ```

    FixTheAlternator(junkyOldFord);

    ```


    is an example of a method call, and so is


    ```

    System.out.println("Chocolate, royalties, sleep");

    ```


    Java has many different kinds of statements. A method call is just one kind.'
