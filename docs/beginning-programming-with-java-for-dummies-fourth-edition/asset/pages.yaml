  md: "# Part IV: Using Program Units\n\nThe Java API has a class named NumberFormat,\
    \ and the NumberFormat class has a static method getCurrencyInstance. When you\
    \ call NumberFormat.getCurrencyInstance() with nothing inside the parentheses,\
    \ you get an object that can mold numbers into U.S. currency amounts.\nListing\
    \ 18 has an example.\n\nListing 18-7: The Right Way to Display a Dollar Amount\n\
    \n```\nimport java.text.NumberFormat;\nimport java.util.Scanner;\n\nclass BetterProcessData\
    \ {\n    public static void main(String args[]) {\n        Scanner keyboard =\
    \ new Scanner(System.in);\n        double amount;\n        boolean taxable;\n\
    \        double total;\n        NumberFormat currency = =\n            NumberFormat.getCurrencyInstance();\n\
    \        String niceTotal;\n\n        System.out.print(\"Amount: \");\n      \
    \  amount = keyboard.nextDouble();\n        System.out.print(\"Taxable: (true/false)\
    \ \");\n        taxable = keyboard.nextBoolean();\n\n        if (taxable) {\n\
    \            total = amount * 1.05;\n        } else {\n            total = amount;\n\
    \        }\n\n        niceTotal = currency.format(total);\n        System.out.print(\"\
    Total: \");\n        System.out.println(niceTotal);\n\n        keyboard.close();\n\
    \    }\n```\n\nFor beautiful runs of the code in Listing 18-7, see Figure 18-10.\
    \ Now at last, you will see a total like $20.34, not 20.338500000000003. Ah, That's\
    \ much better."
