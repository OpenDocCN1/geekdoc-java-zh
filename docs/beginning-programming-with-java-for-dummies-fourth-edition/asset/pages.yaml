  md: "# Another Way to Think about Classes\n\nWhen you start learning object-oriented\
    \ programming, you may think this class idea is a bit hoax. Some geeks in Silicon\
    \ Valley had nothing better to do, so they went to a bar and made up some confusing\
    \ gibberish about classes. They don't know what it means, but they have watching\
    \ people struggle to understand it.\n\nWell, that's not what classes are. Classes\
    \ are serious stuff. What's more, classes are useful. Many reputable studies have\
    \ shown that classes and object-oriented programming save time and money.\n\n\
    Even so, the notion of a class can be elusive. Even experienced programmers —\
    \ the who are new to object-oriented programming — have trouble understanding\
    \ how an object differs from a class.\n\n# Classes, objects, and tables\n\nBecause\
    \ classes can be so mysterious, I'll expand your understanding with another analogy.\
    \ Figure 17-7 has a table of three purchases. The table's title consists of one\
    \ word (the word \"Purchase\"), and the table has three columns headings — the\
    \ words \"amount,\" \"taxable,\" and \"total.\" Well, in code Listing 17-2 has\
    \ the same stuff — Purchase, amount, taxable, and total. So in Figure 17-7, think\
    \ of the part of the table (the title and column headings) as a class. Like the\
    \ code in Listing 17-2, this part of the table tells us what it means to be a\
    \ Purchase. (It means having an amount value, a taxable value, a total value.)\n\
    \n| amount | taxable | total |\n|--- |--- |--- |\n| Figure 17-7: A table of purchases.\
    \ | 20.00 | true | 21.00 |\n| | 20.00 | false | 20.00 |\n| | 95.00 | true | 99.75\
    \ |\n\n```\nclass Purchase {\n  double amount;\n  boolean taxable;\n  double total;\n\
    }\n```\n\nA class is like the part of a table. And what about an object? An object\
    \ is like a row of a table. For example, with the code in Listing 17-5 and the\
    \ input in Figure 17-5, I create three objects (three instances of the Purchase\
    \ class). The first object has amount value 20.00, taxable value true, and total\
    \ value 21.00. In the table, the first row has these three values — 20.00, true,\
    \ and 21.00, as shown in Figure 17-8."
