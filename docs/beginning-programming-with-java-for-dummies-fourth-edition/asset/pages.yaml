    \nThe red marks in Eclipse's editor refer to compile-time errors in your Java\
    \ code. A compile-time error (also known as a compiler error) is an error that\
    \ prevents the compiler from translating your code.(See the talk about code translation\
    \ in Chapter 1.)\n\nThe markers in Figure 3-12 appear on line 8 of the Java program.\
    \ Line numbers appear in the editor's display line names, choose Window:Preferences\
    \ (on Windows) or Eclipse:Preferences (on a Mac). Then choose General:Editors:Text\
    \ Editors. Put a check mark in the Show Line Numbers check box.\n\nTo fix compile-time\
    \ errors, you must become a detective. You join an elite squad as Law & Order:\
    \ Java Programming Unit. You will find no easy answers. Instead, comb the evidence\
    \ slowly and carefully for clues. When you compare everything you see in the editor,\
    \ character by character, with your code in Listing 3-1. You won't miss a single\
    \ detail, including spelling, punctuation, and uppercase lowercase.\n\nEclipse\
    \ has few nice features to help you find the source of a compile-time error. For\
    \ example, you can hover over the jagged red underline. When you do, see a brief\
    \ explanation of the error with some suggestions for repairing the error — some\
    \ quick fixes (see Figure 3-13).\n\nIn Figure 3-13, a popup tells you Java knows\
    \ what the system means — that, system cannot be resolved. Near the bottom of\
