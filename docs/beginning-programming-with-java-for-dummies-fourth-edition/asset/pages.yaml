  md: "# 402 Part IV: Using Program Units\n\nIn the expression new JFrame(), Java's\
    \ new keyword signals a call to a constructor. A constructor is like a method,\
    \ except that a constructor's name is the same as the name of a Java class. Java's\
    \ standard API classes named JFrame, ImageIcon, and JLabel, and the code in Listing\
    \ 20-1 calls JFrame, ImageIcon, and JLabel constructors.\n\nAs the terminology\
    \ suggests, a constructor is a piece of code that constructs an object. So in\
    \ Listing 20-1, when you call\n\n```\nJFrame frame = new JFrame();\n```\n\nyou\
    \ make a frame variable refer to a newly constructed object (an object constructed\
    \ from the JFrame class).\n\nConstructors and methods have a lot in common with\
    \ one another. You can't call a method without having a corresponding method declaration-where\
    \ the code is. (In the case of Java's nextLine method, the method declaration\
    \ lives inside Java's enormous bunch of API classes.) The same is true of constructors.\
    \ You can't call new JFrame() without having a constructor for the JFrame class\
    \ somewhere in your code. And, sure enough, the Java API class, you can find a\
    \ declaration for the JFrame() constructor. The code looks like this:\n\n```\n\
    public class JFrame {\n    int height;\n    int width;\n    public Component add()\
    \ ...\n    public void setDefaultCloseOperation() ...\n    public void pack()\
    \ ...\n    public void setVisible() ...\n\n    /**\n * Constructs a new frame\
    \ that is initially invisible.\n */\n    public JFrame() {\n    }\n}\n```\n\n\
    The constructor declaration looks almost like a method declaration. But notice\
    \ that the constructor declaration doesn't start with public void JFrame() or\
    \ with public double JFrame() or with public anything JFrame(). Aside from the\
    \ optional word public, a constructor declaration contains only the name of the\
    \ class whose object is being constructed. More on this in the next section."
