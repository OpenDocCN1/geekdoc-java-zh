    # Write once, run anywhere


    Java first hit the tech scene in 1995, the language became popular almost immediately.
    This happened in part because of the JVM. The JVM is like a foreign language interpreter,
    turning Java bytecode into native language a particular computer understands.
    So if you hand your Windows a Java bytecode file, the JVM interprets the file
    for the Windows environment. If you hand the same Java bytecode file to Apple''s
    Macintosh, then the Macintosh JVM interprets that same bytecode for the Mac environment.


    code for each operating system. But with the JVM, just one piece of bytecode works
    on Windows machines, Unix boxes, Macs, or whatever. This is called portability,
    and in the computer-programming world, portability is a very precious commodity.
    Think about all the people using computers to browse the Internet. These people
    do not run Microsoft Windows, but each person''s computer can have its own bytecode
    interpreter — its own JVM.


    Look again at Figure 1-5. Without a virtual machine, you need a different kind
