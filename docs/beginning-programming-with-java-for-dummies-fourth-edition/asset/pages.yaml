  md: '# Author’s Acknowledgments


    Author’s To-Do List, February 13, 2014:


    **Item**: Send chocolates to Paul Levesque (the book’s project editor) and Melba
    Hoff (the book’s copy editor). As anyone who reads Chapter 4 learns, chocolate
    is one of the most precious commodities on earth. So when I give chocolate, I
    give it thoughtfully and intentionally.


    **Item**: Have a plaque erased in honor of Connie Santisteban, your acquisitions
    editor at Wiley. While you worked on other projects, Connie kept on insisting
    that you write this book’s fourth edition. (Sure, you wanted a long vacation instead
    of another book project, but who cares? She was right; you were wrong.)


    **Item**: Send a thank-note to tech editor Russ Mullen who helped polish your
    original work and, miraculously, didn’t make a lot of extra work for you.


    **Item**: Visit Frank Thornton, Bonnie Averbach, and Herbert Putz at Temple University.
    Thank them for steering you to a career as a professor. In any other career, you’d
    have no time left to write. (And by the way, while you’re in Philly, don’t forget
    to stop for a cheesecake.)


    **Item**: Send e-mail to Gaisi Takeuti at the University of Illinois, and to William
    Wisdom and HughesLeBlanc at Temple University. Thank them for teaching you about
    Symbolic Logic. It made your life as a computer scientist and mathematician much
    richer.


    **Item**: Spend more time with your family. (Remind them that you’re the guy who
    wandered around the house before you started writing books.) Renew your pledge
    to clean up after yourself. Don’t be high-strung and finish each sentence that
    you start. Remember that you can never fully return the love they’ve given you,
    but you should always keep trying.'
  merge: -1
