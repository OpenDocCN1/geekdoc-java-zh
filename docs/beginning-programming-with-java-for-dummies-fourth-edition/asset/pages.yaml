    # What you read is what you get


    When you''re writing your code, you should never take anything for granted. Suppose
    that you accidentally reverse the order of the gumballs and kids assignment statements
    in Listing 7-2:


    ```

    // code is misleading;

    System.out.print("How many gumballs? How many kids? ");


    kids = keyboard.nextInt();

    gumballs = keyboard.nextInt();

    ```


    Here line How many gumballs? How many kids? is misleading. Because the kids assignment
    statement comes before the gumballs assignment, the first number you type becomes
    the value of kids, and the second number you type becomes the value of gumballs.
    It doesn''t matter that your program displays the How many gumballs? How many
    kids?. What matters is the order of the assignment statements in the program.


    If the kids assignment statement accidentally comes first, you can get a strange
    answer, like the zero answer in Figure 7-4. That''s how int division works. It
    cuts off any remainder. Divide a small number (like 6) by a big number (like 80),
    and you get 0.'
