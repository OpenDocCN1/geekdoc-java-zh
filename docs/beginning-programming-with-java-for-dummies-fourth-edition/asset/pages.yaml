    "FixTheAlternator on that junkyOldford."


    A method declaration tells the computer what will happen if you call the method
    into action. A method call (a separate piece of code) tells the computer to actually
    call the method into action. A method''s declaration and the method''s call tend
    to be in different parts of the Java program.


