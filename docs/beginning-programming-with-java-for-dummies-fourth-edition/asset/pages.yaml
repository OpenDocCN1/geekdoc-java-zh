  md: "# Chapter 14: Creating Loops within Loops 277\n\nSo here's the strategy: Take\
    \ the statements in Listing 14-1 and enclose them in a larger loop:\n\n```\nwhile\
    \ (not at the end of the email.txt file) {\n  Execute the statements in Listing\
    \ 14-1\n}\n```\n\nLooking back at the code in Listing 14-1, you see that the statements\
    \ in code have a while loop of their own. So this strategy involves putting one\
    \ loop inside another loop:\n\n```\nwhile (not at the end of the email.txt file)\
    \ {\n//Blah-blah\n  while (symbol != '@') {\n    //Blah-blah-blah\n  }\n  //Blah-blah-blah\n\
    }\n```\n\nBecause one loop is inside the other, they're called nested loops. The\
    \ old loop (the symbol != '@' loop) is the inner loop. The new loop (the end-of-file\
    \ loop) is called the outer loop.\n\n# Checking for the end of a file\n\nNow you\
    \ need a way to test the loop's condition. How do you know when you're at the\
    \ end of the email.txt file?\n\nThe answer comes from Java's Scanner class. This\
    \ class's hasNext method answers true or false to the following question:\n\n\
    > Does the email.txt file have anything to read in it (beyond what you're already\
    \ read)?\n\nIf the program's findWithin calls haven't gobbled all the characters\
    \ in the email.txt file, the value of diskScanner.hasNext() is true. So, to keep\
    \ looping while you're not at the end of the email.txt file, you do the following:\n\
    \n```\nwhile (diskScanner.hasNext()) {\n  Execute the statements in Listing 14-1\n\
    }\n```"
