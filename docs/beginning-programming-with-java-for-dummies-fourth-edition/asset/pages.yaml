  md: "# Nested if statements\n\nA run of the code in Listing 10-5 looks identical\
    \ to a run for Listing 10-4. You can see several runs in Figure 10-6. The main\
    \ idea in Listing 10-5 is to put an if statement inside another if statement.\
    \ After all, Chapter 9 says that an if statement can take the following form:\n\
    \n```\nif (Condition) {\n    SomeStatements\n} else {\n    OtherStatements\n}\n\
    ```\n\nWho says SomeStatements can't contain an if statement? For that matter,\
    \ OtherStatements can also contain an if statement. You can create an if statement\
    \ within an if statement within an if statement. There's no predefined limit on\
    \ the number of if statements you can have.\n\n```\nif (age >= age < 65) {\n \
    \   price = 9.25;\n    if (reply == 'Y' || reply == 'y') {\n        if (isSpecialFeature)\
    \ {\n            price = 1.00;\n        } else {\n            price = 2.00;\n\
    \        }\n    } else {\n    price = 5.25;\n}\n}\n```\n\nWhen you put one if\
    \ statement inside another to write, you create nested if statements. Nested statements\
    \ aren't difficult as long as you take things slowly and keep a clear picture\
    \ of the code's flow in your mind. If it helps, draw a diagram like the one in\
    \ Figure 10-10.\n\n![](img/6d9dcff12e52b997f3ad31445b712549_223_0.png)\n\nWhen\
    \ you nest statements, you must be compulsive about the use of indentation and\
    \ braces. (See Figure 10-11.) When code has misleading indentation, no one (even\
    \ the programmer who wrote the code) can figure out how the code works. A nested\
    \ statement with sloppy indentation is a programmer's nightmare."
