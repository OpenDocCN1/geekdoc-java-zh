    \ a double equal sign. When you do, things work exactly as you would expect. For\
    \ example, the condition in the following code is true:\n\n```\n```\nint apples\
    \ = 7;\nint oranges = 7;\n\nif (apples == oranges) {\n    System.out.println(\"\
    They're equal.\");\n}\n```\n```\n\n+   * When you compare String values with the\
    \ double equal sign, things don't work the way you expect. The computer doesn't\
    \ check to see if the String values contain the same letters. Instead, the computer\
    \ checks some esoteric property of the way variables are stored in memory.\n\n\
    For purposes, the term reference type is just a fancy name for a class. Because\
    \ String is defined to be a class in the Java API, I call String a reference type.\
    \ This terminology highlights the parallel between primitive types (such as int)\
    \ and classes (that is, reference types, such as String).\n\n![](img/6d9dcff12e52b997f3ad31445b712549_369_0.png)\n\
