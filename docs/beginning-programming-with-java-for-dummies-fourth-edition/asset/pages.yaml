  md: '# Chapter 16: Using Loops and Arrays


    # Grabbing input here and there


    Listing 16-2 illustrates some pithy issues surrounding the input of data. For
    one thing, the program gets input from the keyboard and a disk file. (The program
    gets a number from the keyboard. The program gets the number of guests in that
    room for make this, Listing 16-2 sports Scanner declarations — one to declare
    keyboard, and a second to declare diskScanner.


    the code in Listing 16-2, I go to my old 16-01 project in Eclipse''s Package Explorer.
    I click the 16-01 project and select Copy from the context menu. I right-click
    the new 16-02 project branch and select Paste from the context menu. Using Mac,
    users do control-click instead of right-click.


    In real life, several copies of a data file can be dangerous. You can modify any
    one and then accidentally read out-of-date data from a different copy. You should
    have backup copies, but you should have only one "master" copy — the copy by which
    all programs get the same input.


    Later in the program, the call keyboard. nextInt reads from the keyboard and diskScanner.nextInt
    reads from the file. Within the program, you can read from the keyboard or the
    disk as many times as you want. You can intend the matters — reading once from
    the keyboard, three times from the disk, then twice and so on. All you have to
    remember is use keyboard whenever you read from the keyboard and use diskScanner
    whenever you read from the disk.


    So in a real-life program, you don''t copy the occupancy file from one project
    to another. What do you do? You put an occupancy file in one place on your hard
    and have each program refer to the file name of the file''s directories. For example,
    if your occupancy file is in the c:\Oct\22 directory, you use


    ```

    Scanner diskScanner = new Scanner (File("c:\22\occupancy"));

    ```


    A sidebar in Chapter 13 has more details about filenames and double backslashes.


    Another tricky in Listing 16-2 concerns the occupancy file. Many of this examples
    read from an occupancy file, and I use the same data in each of the examples.
    (I use the data shown in Figure 16-1.) To run an example, I copy the occupancy
    file from one Eclipse to another. Before running


