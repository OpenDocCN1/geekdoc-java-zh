  md: '# Troubleshooting problems with disk files


    When you run the code in Listing 13-2, the computer executes new Scanner (new
    File("rawData.txt")). If the Java virtual machine can''t find the rawData.txt
    file, you see a message like the one shown in Figure 13-6. This error message
    can be very frustrating. In many cases, you know well that a rawData.txt file
    is on your hard drive. The stupid computer can''t find it.


    Figure 13-6- The computer cannot find your file.


    ![](img/6d9dcff12e52b997f3ad31445b712549_279_0.png)


    There''s no sure way to fix this problem. But you should always check the following
    things first:


    +   * Check for a file named rawData.txt.

    * Open My Computer (on Windows) or Finder (on a Mac) and poke around for a file
    with that name.

    * The filenames displayed in My Computer and Finder can be misleading. You may
    see the name rawData.txt, even though the file''s real name is rawData.txt. To
    fix this problem once and for all, refer to Chapter 2.

    * Check the spelling of the file''s name.

    Make sure that the name in your program is exactly the same as the name of the
    file on your hard drive. One misplaced letter can keep the computer from finding
    a file.

    * If you use Linux (or a flavor of UNIX over Mac OS X), check the capitalization
    of the file''s name.

    In Linux, and in many versions of UNIX, the difference between uppercase and lowercase
    can baffle the computer.

    * Check that the file is in the correct directory.

    Sure, if you have a file named rawData.txt, but it doesn''t expect your Java program
    to look in every folder on your hard drive to find the file. How do you know which
    folder should house files like rawData.txt?'
