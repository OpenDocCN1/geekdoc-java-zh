    \ To read a bit about the static import declaration (with an apology for not explaining\
    \ this concept more thoroughly), see Chapter 9. Then to get the real story on\
    \ static import declarations, Chapter 18.\n\n# Enumerating the Possibilities\n\
    \nChapter 8 describes Java's boolean type — the type with only two values (true\
    \ and false). The boolean type is very handy, but sometimes you need more values.\
    \ After all, a traffic light's values can be green, yellow, or red. A playing\
    \ card's suit can be spade, heart, or diamond. And a weekday can be Monday, Tuesday,\
    \ Wednesday, Thursday, or Friday.\n\nLife is filled with small sets of possibilities,\
    \ and Java has a feature that can reflect these possibilities. The feature is\
    \ called an enum type. It's available from Java version 5.0 onward.\n\n# Creating\
    \ an enum type\n\nThe story in Listing 10-6 has three possible endings — the Hankees\
    \ win, the Socks win, or the game is tied. You can represent the possibilities\
    \ with the following of Java code:\n\n```\nenum WhoWins {home, visitor, neither}\n\
    ```\n\nThis week's game is played at Hankeeville's Snit Stadium home represents\
    \ a win for the Hankees, and the value visitor represents a win for the Socks."
