  md: '# 186 Part III: Controlling the Flow


    # # Randomness makes me dizzy


    When you call myRandom.nextInt(10) + 1, you get a number from 1 to 10. As a test,
    I write a program that calls the Random.nextInt(10) + 10 times.


    ```

    Random myRandom=new Random();

    System.out.print(myRandom.nextInt(10) + 1);

    System.out.print(" ");

    System.out.print(myRandom.nextInt(10) + 1);

    System.out.print(" ");

    //...And so on.

    ```


    precisely, a number is random if the process used to generate the number follows
    the two preceding trends. When they''re being careful, scientists avoid the term
    random number and use the term generated number instead.


    +   - It''s hard to generate random numbers. Computer programs do the best they
    can, but ultimately, today''s programs follow a pattern, and that pattern isn''t
    truly random.


    +   - To generate numbers in a truly random fashion, you need a big of ping-pong
    balls, like the kind they use in state lottery drawings. The problem is, most
    computers don''t have tubs of ping-pong balls among their peripherals. Strictly
    speaking, the numbers generated by Java''s Random class aren''t random. Scientists
    call them pseudorandom.


    I ran the program several times and the results showed the following. (I copied
    the results from Eclipse''s Console to Windows Notepad. I stared at the flow and
    noticed two trends:)


    +   - There''s no way to predict what number comes next


    +   - No number occurs much more than any of the others.


    | 4 4 9 4 6 8 3 8 3 9 |

    | 7 2 1 6 1 0 5 3 7 9 |

    | 4 8 7 6 5 1 3 2 5 6 |

    | 2 1 0 2 3 3 5 4 4 8 |

    | 7 5 8 3 7 3 3 7 4 7 |

    | 9 4 1 9 4 1 4 7 7 2 |

    | 1 2 0 3 1 2 5 6 3 2 |

    | 4 6 3 9 4 8 3 3 1 2 |


    The Java Machine jumps through loops to maintain these numbers. That''s cracking
    out numbers in a random fashion is a very tricky business. Here are some interesting
    facts about the process:


    +   - Scientists and nonscientists use the term random number. In reality, there''s
    nothing such as a single random number. After all, how is a random number like?


    A number is random only when it''s one in a very disorderly collection of numbers.
    More


    +   - It surprises us all, but knowing randomly generated value is one of help
    in predicting the next randomly generated value.


    For example, if you throw a coin twice, and get heads each time, are you more
    likely to get tails on the third flip? It''s still 50-50.


    If you have three sons, and you''re expecting a fourth, is the child more likely
    to be a girl? No child''s gender has nothing to do with the genes of the others.
    (If ignoring any biological effects, which I know nothing about. Wait! I know
    some biological trivia: A newborn child is more likely to be a boy than a girl.
    For 21 newborn boys, there are 20 newborn girls. Boys are weaker, so we die off
    faster. That''s why nature makes more out of us birth)


    ![](img/6d9dcff12e52b997f3ad31445b712549_201_0.png)'
