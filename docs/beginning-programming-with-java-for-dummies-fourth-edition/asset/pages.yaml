    # One character only, please


    A char variable stores only one character. If you''re tempted to write the following
    statements


    ```

    char smallLetters;

    smallLetters = ''barry''; //Don''t do this

    ```


    resist the tension. You can''t store more than one letter at a time in a char
    variable, and you can''t put more than one letter between a pair of single quotes.
    If you''re trying to store words or sentences (not just single letters), then
    you need to use something called a String. For a look at Java''s String type,
    see Chapter 18.


