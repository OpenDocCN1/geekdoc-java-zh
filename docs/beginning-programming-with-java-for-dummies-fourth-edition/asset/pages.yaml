    # # Getting a Value from a Method


    Say that you''re sending a friend to groceries. You make requests for groceries
    in the form of method calls. You issue calls such as


    ```

    goToSupermarketAndBuySome(bread);

    gotoTheSupermarketAndBuySome(bananas);

    ```


    The things in parentheses are parameters. Each time you call goToSupermarketAndBuySome
    method, you put a different value in the method''s parameter list.


    Now what happens when your friend returns from the supermarket? “Here the bread
    you asked me to buy,” says your friend. As a result of carrying out your wishes,
    your friend returns something to you. You made a method call, and the method returns
    information (or better yet, the method returns some food).


    The thing returned to you is called the method''s return value, and the type of
    thing returned to you is called the method''s return type.


    # # An example


    To see how return values and return types work in a real Java program, check out
    the code in Listings 19-8 and 19-9.'
