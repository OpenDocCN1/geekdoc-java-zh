  md: "# 84 Part II: Writing Your Java Programs\n\nMost programming languages have\
    \ identifiers with agreed-upon meanings. In Java, almost all these identifiers\
    \ are defined in the Java API. Listing 4-1 has five such identifiers. They're\
    \ the words main, String, System, out, and println:\n\n```\npublic static void\
    \ main(String args[]) {\n    System.out.println(\"Chocolate, royalties, sleep\"\
    );\n}\n```\n\nA quick rundown on the meaning of each of these names (and more\
    \ detailed descriptions appear throughout this book):\n\n+   **main**: The main\
    \ starting point for execution in every Java program.\n**String**: A bunch of\
    \ text; a row of characters, one after another.\n**System**: A canned program\
    \ in the Java API. This program accesses features of your computer that are outside\
    \ the direct control of the Java Virtual Machine (JVM).\n**out**: The place where\
    \ a text-based program displays its text. (For a program running in Eclipse, the\
    \ word out represents the Console view. To read more about text-based programs,\
    \ check the first few paragraphs of Chapter 3)\n**println**: Display text on your\
    \ computer screen.\n\nThe name println comes from the words \"print a line.\"\
    \ If you were allowed to write the name in uppercase letters, it would be PRINTLN,\
    \ with a lower near the end of the word. When the computer executes println, the\
    \ computer puts some text in Eclipse's Console view and immediately moves to the\
    \ beginning of the next line in preparation for whatever will appear in the Console\
    \ view.\n\nStrictly speaking, the meanings of the identifiers in the Java API\
    \ are not cast in stone. You could make your own meanings for things like System\
    \ or println, doing so isn't a good idea — because you would confuse the dickens\
    \ out of other programmers, who are used to the standard API meanings for these\
    \ familiar names.\n\n# Literals\n\nA literal is a chunk of text that looks like\
    \ whatever value it represents. In Suzanne's sentence (refer to Figure 4-2), \"\
    eh\" is a literal because \"eh\" refers to the word \"eh.\"\n\nProgramming languages\
    \ have literals, too. For example, in Listing 4-1, the stuff in quotes is a literal:\n\
    \n```\nSystem.out.println(\"Chocolate, royalties, sleep\");\n```\n\n![](img/6d9dcff12e52b997f3ad31445b712549_99_0.png)"
