    \ 4-1, you can replace public with Public. If you do, THE PROGRAM STOPS WORKING.\n\
    \n![](img/6d9dcff12e52b997f3ad31445b712549_96_0.png)\n\nThis chapter has little\
    \ or no detail about the meanings of the keywords class, public, static, and void.\
    \ You can peek ahead at the material in other chapters, but you can also get along\
