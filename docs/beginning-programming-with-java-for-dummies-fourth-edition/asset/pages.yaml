    \ program in Listing 4-1 uses four of Java's keywords (shown in bold):\n\n```\n\
    class ThingsLike{\n    public static void main(String[] args) {\n```\n\nEach Java\
    \ keyword has a specific meaning — a meaning that remains unchanged from one program\
    \ to another. For example, whenever I write a Java program, the word public always\
    \ stays a part of the program that's accessible to any other piece of code.\n\n\
