  md: '# 64 Part I: Getting Started with Java Programming


    # # Do I see formatting in my Java program?


    When you use Eclipse''s editor to write a Java program, you see words in various
    colors. Certain words are always blue. Other words are always black. You even
    see bold and italic phrases. But you don''t. Instead, what you see is syntax coloring
    or syntax highlighting.


    program file. Instead, the editor displays each word in a way that makes the Java
    program easy to read.


    No matter what you call it, the editor is as follows:


    +   - With Microsoft Word, things like formatting are marked inside a document.
    When you save myPersonalDiary.docx, the instructions to make the words "love"
    and "hate" are bold inside the MyPersonalDiary.docx file.


    +   - With a Java program, things like bold and coloring aren''t marked inside
    the


    For example, in a Java program, certain words (words like class, public, and void)
    have their own special meanings. Eclipse''s editor displays class, public, and
    void in bold, reddish letters. When I save my Java program file, the computer
    stores nothing about bold, colored letters in my program file. But the editor
    uses its discretion to highlight special words with reddish coloring.


    Some other editors may display the same words in a blue font. Another editor (like
    Windows Notepad) displays all words in plain old black.


    ![](img/6d9dcff12e52b997f3ad31445b712549_79_0.png)


    Java is case-sensitive, which means that system.out.println isn''t the same as
    System.out.println. If YoUype system.out.println, your programW sUre cAPralize
    your codeExactly it is in Listing 3-1.


    If you copy and paste code from an ebook, check to make sure that the quotation
    marks in the code are straight quotation marks (""), not curly quotation marks
    (“”). In a Java program, straight quotation marks are good; quality quotation
    marks are troublesome.


