  md: '# Chapter 11: How to Flick a Virtual Switch 231


    ```

    numberOfDays = isLeapYear ? 29 : 28;

    ```


    ![](img/6d9dcff12e52b997f3ad31445b712549_246_0.png)


    As a whole, isLeapYear ? 29 : 28 is an expression with a value. And what value
    does this expression have? Well, the value of isLeapYear ? 29 : 28 is either 29
    or 28. It depends on whether isLeapYear is or isn''t true. That is how the conditional
    operator works:


    +   - If the stuff before the question mark is true, the whole expression''s value
    is whatever comes between the question mark and the colon.

    - If the stuff before the question mark is false, the whole expression''s value
    is whatever comes after the colon.


    Figure 11-7 gives you a goofy way to visualize these ideas.


    ![](img/6d9dcff12e52b997f3ad31445b712549_246_1.png)


    Figure 11-7: Have you ever seen an expression talking to itself?'
