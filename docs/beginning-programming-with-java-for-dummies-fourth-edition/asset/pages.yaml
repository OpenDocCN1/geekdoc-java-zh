    # The main method in a program


    In Listing 4-1, the bulk of the code is the declaration of a method named main.
    (Just look for the word *main* in the code''s method header.) For now, don''t
    worry about the other words in the method header — the words *public, static,
    void, String, args.* I explain these words (on a need-to-know basis) in the next
    several chapters.


    Like any Java method, the main method is a recipe:


    ```

    How to make biscuits:

    Preheat the oven.

    Roll the dough.

    Bake the rolled dough.

    ```


    or


    ```

    How to follow the main instructions in

    t ThingsLike code:

    Display Chocolate, royalties, sleep on the screen.

    ```


    The main method has a special role in Java. In particular, you never explicitly
    calls a *main* method into action. The word *main* is the name of the method that
    is called into action automatically when the program begins running.'
