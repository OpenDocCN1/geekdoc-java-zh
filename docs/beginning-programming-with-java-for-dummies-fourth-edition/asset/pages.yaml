    # Shedding light on the static darkness


    I love to quote myself. When I quote my words, I don''t need permission. I don''t
    have to think about copyright infringement, and I never hear from lawyers. Best
    of all, I can change and distort anything I say. When I paraphrase my ideas, I
    can''t be misquoted.


    With that in, here''s a quote from the previous section:


    > Anything that static belongs to a whole class, not to any particular instance
    of the class.... To call a static method, you use a class''s name along with a
    dot.


    How profound! In Listing 18-6, I introduce a static method named parseInt. Here''s
    the same quotation applied to the static parseInt method:


    > The static parseInt method belongs to the whole Integer class, not to any particular
    instance of the Integer class.... To call the static method, you use the Integer
    class''s name along with a dot. You write something like Integer.parseInt(reply).


    That''s very nice! How about Systemout business that I introduce in Chapter 3?
    Can I apply my quotation to that,


    > The out variable belongs to the whole System class, not to any particular instance
    of the System class.... To refer to the static out you use the System''s name
    along with a dot. You write something like System.out.println().


    If you think about Systemout means, then this static business makes sense. After
    all, the name Systemout refers to the place where a Java sends text output (When
    you use Eclipse, Systemout refers to Eclipse''s Console view). A typical program
    has only one place to send its output. So a Java program has only one variable.
    No matter how many objects you create—three, ten, or none—you have just one variable.
    And when you make something static, you ensure that the program has only one of
    those things.


    All right, The out variable is static.


    To abbreviate the name of a static variable (or a static method), you don''t use
    an ordinary import declaration. Instead, use a static import declaration. That''s
    why, in Chapter 9 and beyond, I use the word static to import the out variable:


    ```

    import static java.lang.Systemout;

    ```'
