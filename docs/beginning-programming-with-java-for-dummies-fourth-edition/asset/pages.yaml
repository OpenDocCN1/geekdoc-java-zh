    In the call findWithinHorizon("\d\d", 0), each d stands for a single digit.

    d\d is one of many abbreviations in special code called regular expressions.


    Now there''s something strange. In the world of regular expressions, a dot stands
    for anyncharacter at all. (That is, a dot for "any character, not necessarily
    a d")

    findWithinHorizon(".*", 0) tells the computer to find the next character of any

    d that the user uses on the keyboard. When you''re trying to find a single character,

