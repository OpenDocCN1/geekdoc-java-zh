    # Statements and blocks (plagiarizing my own sentences from Chapter 9)


    Java''s while statements have a lot in common with statements. Like an if statement,
    a while statement is a compound statement that is, a while includes other statements
    within it. Also, both if and while statements typically block of statements. When
    you surround a bunch of statements with curly braces, you''ve created a block
    which behaves, in all respects, like a single statement.


    ```

    die1=myRandom.nextInt(6)+1;

    die2=myRandom.nextInt(6)+1;

    ```


    In a typical while statement, you want the computer to repeat smaller statements
    over and over again. To repeat smaller statements, you combine those statements
    into one big statement. To do this, you make a block using curly braces.


    ```

    out.print(die1);

    out.print(" ");

    out.println(die2);

    ```


    is a single statement. It''s that that within five smaller statements. So this
    block (this single statement) serves as one big statement inside the while statement
    in Listing 12-1.


    That''s the story about how while statements and blocks. To find out how this
    stuff applies to if statements see the "Statements and blocks" sidebar near the
    end of Chapter 9.


