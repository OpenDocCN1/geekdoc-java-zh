    # How many bits does your computer use?


    As you follow this chapter''s instructions, you may be prompted to choose between
    two versions of software — the 32-bit version and the 64-bit version. What''s
    the difference, and why should you care?


    A bit is the smallest piece of information that you can store on a computer. Most
    people think of bit as either a zero or a one, and that definition of "bit" is
    unique. To represent any number, you could place several bits next to one another
    and do fancy things with powers of two. Turning the system''s details isn''t hard.
    The important thing to remember is that each piece of circuitry inside your computer
    stores the same number of bits. (Well, some circuits inside your computer are
    out with their particular number of bits, but that''s no big deal.)


    In an older computer, each piece of circuitry stores 32 bits. In a newer computer,
    each piece of circuitry 64 bits. This number of bits (either 32 or 64) is the
    computer''s word length. In a newer computer, a word is 64 bits long.


    "Great! You bought my computer last week. It be a 64-bit computer." Well, the
    story may not be that. In addition to your computer having a word length, the
    operating system on your computer also has a word length. An operating system''s
