    # # Forming Bigger and Better Conditions


    In Listing 9-2 (refer to Chapter 9), the code chooses a course of action based
    on one call to the Random class''s nextInt method. That''s fine for electronic
    oracle program described in Chapter 9, but what if you''re rolling a pair of dice?
    In Backgam and other dice games, rolling 3 and 5 isn''t the same as rolling 4
    and 4, even though the total for both rolls 8. The next move varies, depending
    on whether you roll doubles. To get the computer to roll two dice, you execute
    myRandom.nextInt($6)+1 two times. Then you combine the two rolls into a larger,
    more complicated if statement.'
