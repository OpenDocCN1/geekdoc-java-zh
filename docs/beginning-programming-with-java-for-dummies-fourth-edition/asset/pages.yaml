    # # Running code


    Several years ago, I spent a week in Copenhagen with a friend who spoke both Danish
    and English fluently. As we chatted in the public park, vaguely noticed some kids
    orbiting us. I don''t speak a word of Danish, so I assumed the kids were talking
    about ordinary stuff.'
