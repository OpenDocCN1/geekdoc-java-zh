    the expert. I aim this book specifically towards the novice — the person who has
    never programmed a computer or has never felt comfortable programming a computer.
    If you''re one of these people, you''re reading the right book.


    # How This Book Is Organized


    This book is divided into subsections, which are grouped into sections, which
    come together to make chapters, which are lumped finally into five parts. (When
    you write a book, you get to know your book''s structure pretty well. After months
    of writing, you find yourself dreaming in sections and chapters when you go to
    bed at night.) The parts of the book are listed here.


    # Part I: Getting Started with Java Programming


    The chapters in Part I prepare you for the overall programming experience. In
    these chapters, you find out what programming is all about and get your computer
    ready for writing and testing programs.


    # Part II: Writing Your Own Java Programs


    This part covers the basic building blocks — the elements in any Java program
    and in any program using a Java-like language. In this part, you discover how
