    Anyway, whenever you''re skinning catfish, skinning kitties, or writing computer

    programs, the same principle holds true. You always have alternatives. Listing
    9-2

    shows one way to write an if statement. The rest of this chapter (and all of

    Chapter 10) show you other ways to create if statements.


    # Or else?


