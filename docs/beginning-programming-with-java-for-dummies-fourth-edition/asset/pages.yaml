    In Java, *true*, *false*, and *null* have specific meanings. Like the keywords
    in Table 4-1, you can use *true*, *false*, and *null* to mean anything other than
    what they normally mean in a Java program. For reasons that concern only the fuzziest
    Java experts, *true*, *false*, and *null* are not called keywords. One way or
    another, if you scribble the *true*, *false*, and *null* into Table 4-1, you''ll
    be okay.


    Here''s one thing to remember about keywords: In Java, each keyword has an official,
    predetermined meaning. The people at Oracle, who have the final say on what constitutes
    a Java program, created all of Java''s keywords. You can''t make up your own meaning
    for any of the Java keywords. For example, you can''t use the word **public**
    in a calculation:


    ```

