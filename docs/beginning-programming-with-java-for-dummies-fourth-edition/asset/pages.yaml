    \ next line of input.\n\nListing 14-3: That's Much Better!\n\n+   * This code\
    \ is correct!\n*/\n\n```\nimport java.util.Scanner;\nimport java.io.File;\nimport\
    \ java.io.FileNotFoundException;\nimport java.io.PrintStream;\nnclass ListAllUsernames\
