    # Understanding the Big Picture


    In this section, I answer some of the burning questions that I raise throughout
    the book. "What does java.util stand for? "Why do I need the word static at certain
    points in the code? "How can a degree in Horticultural Studies help you sort cancelled
    checks?


    I also explain "static" in some unique and interesting ways. After, all static
    methods and variables are not easy to understand. It helps to read Java''s static
    feature from several points of view.


    # Packages and import declarations


    In Java, you can group a bunch of classes into something called a package. In
    fact, classes in Java''s standard API are divided into about 200 packages. This
    book makes heavy use of three packages — the packages named java.util, java.lang,
    and java.io.


    The class java.util.Scanner


    The package java.util contains about 50 classes, including the very useful Scanner
    class. Like other classes, this Scanner has two names — a fully qualified name
    and an abbreviated simple name. The class''s fully qualified name is java.util.Scanner,
    and the class''s simple name is Scanner. You get the fully qualified name by adding
    the package name to the class''s simple name. You get java.util.Scanner.


    An import declaration lets you abbreviate a name. With the declaration


    ```

    import java.util.Scanner;

    ```


    The Java compiler figures out where to look for the Scanner class. So instead
    of writing java.util.Scanner throughout your code, you can just write Scanner.'
