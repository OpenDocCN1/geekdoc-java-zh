  \n# JAVA 编程简介\n\n# 第 1 章节：Java 编程简介\n\n## 1.1 什么是 Java？\n\nJava 是一种健壮且流行的编程语言，广泛用于开发各种软件应用程序。无论你想构建移动应用、基于\
  \ Web 的系统、桌面应用程序甚至是企业级软件，Java 都能满足你的需求。\n\nJava 由 James Gosling 及其团队在 20 世纪 90 年代的\
  \ Sun Microsystems 创建。它被设计成一种通用且平台无关的语言，这意味着它可以在不同的操作系统上运行而无需任何修改。这种移植性使得 Java 在软件开发行业中备受青睐。\n\
  \nJava 受欢迎的核心原因之一是其“一次编写，随运行”（write once, run anywhere）的概念。这意味着你编写一次 Java 代码，就可以在任何支持\
  \ Java 的设备或操作系统上运行，而无需进行特定的适配。这种灵活性为开发者节省了宝贵的时间精力。\n\nJava 是一种面向对象的编程语言，这意味着它专注于创建相互交互的对象来构建复杂的应用程序。这种方法允许代码模块化和可重用，使得你的项目更易于维护和扩展。\n\
  \nJava 的另一个优势是其庞大的预构建代码库，即 Java 开发工具包（`JDK`）。`JDK` 提供了大量即插即用的类和方法，简化了开发过程并加速了你的编码速度。\n\
  \n此外，Java 为多线程提供了极佳的支持，允许开发者创建同时执行多个任务的程序。这一特性对于构建能够高效处理高负载的高性能应用程序特别有用。\n\n除了技术能力外，Java\
  \ 还拥有一个庞大且活跃的开发者社区，他们为增长做出贡献，并通过各种在线论坛和社区提供支持。这个充满活力的社区确保了你在继续 Java 程序员之旅程时，始终能够随时获得资源和帮助。\n\
  \n## 1.2 为什么要学习 Java？\n\nJava 是一门极具价值的编程语言，以下是你应该学习 Java 编程的一些引人理由：\n\n1. **应用范围广泛**：Java\
  \ 应用于众多领域，包括 Web 开发、移动应用开发、企业软件、科学研究等。通过学习 Java，你打开了通往大量职业机会的大门，并可以参与各种且令人兴奋的项目。\n\
  \n2. **平台无关性**：Java 的“一次编写，随运行”原则允许你编写可以在任何操作系统上运行的代码，如 `Windows`、`macOS` 或 `Linux`，无需大幅修改。这种移植性让开发者免于为不同平台重写代码的麻烦，使\
  \ Java 成为一个高效的选择。\n\n3. **就业市场需求**：Java 在就业市场上一直保持高需求。许多公司和组织依赖 Java 来构建他们的软件系统，并积极寻找熟练的\
  \ Java 程序员。通过掌握 Java，你增加了获得丰厚职位机会的机会，并能享受稳定且富有回报的职业。\n\n4. **强大的社区支持**：Java 拥有一个健壮且支持良好的开发者社区。通过大量的在线论坛、讨论板和用户组，你可以轻松地寻求指导、分享知识并与其他\
  \ Java 爱好者协作。成为社区的一部分不仅增强了你的学习体验，还提供了宝贵的人脉机会。\n\n5. **面向对象编程 (OOP)**：Java 遵循面向对象编程范式，这促进了模块化和可重用的代码。OOP\
  \ 允许高效的代码组织，减少冗余并增强代码的可维护性。通过学习 Java，你对 OOP 原理有了深入理解，这些原理在其他编程语言中同样适用。\n\n6. **资源丰富**：Java\
  \ 拥有丰富的学习资源，包括全面的文档、教程、书籍和在线课程。无论你倾向于自学还是引导式教学，你都可以获得大量高质量资源来支持你的学习旅程。\n\n7. **行业标准**：Java\
  \ 已经存在了几十年，确立了其作为许多企业级应用行业标准的地位。学习 Java 使你能够与既有的实践和技术接轨，从而更容易与其他开发者协作并将你的代码集成到现有系统中。\n\
  \n## 1.3 设置 Java 开发环境\n\n在开始编写 Java 代码之前，你需要设置开发环境。请遵循以下步骤以确保设置过程的顺畅高效：\n\n\n\n\n\
  \n1. 安装 Java Development Kit (JDK)：`JDK` 是一个软件包，它为 Java 开发提供了必要的工具、库和运行环境。访问 Oracle\
  \ 官方网站并下载适用于你操作系统的最新 `JDK` 版本。然后，运行安装程序并按照屏幕上的指示完成安装。\n\n2. 设置 Java 环境变量：安装 `JDK`\
  \ 后，你需要设置 Java 环境变量。此步骤可确保你的操作系统能够识别 Java 安装路径并找到必要的文件。该过程因操作系统而而而异，但通常涉及设置 `JAVA_HOME`\
  \ 和 `PATH` 变量。请在线搜索针对你操作系统的特定说明以获取详细指南。\n\n3. 选择集成开发环境 (IDE)：虽然可以使用简单的文本编辑器编写 Java\
  \ 代码，但使用集成开发环境 (IDE) 可以极大地提高你的效率。IDE 提供了代码补全、调试工具和项目管理等功能。一些流行的 Java `IDE` 包括 `Eclipse`、`IntelliJ\
  \ IDEA` 和 `NetBeans`。选择一个适合你喜好的 `IDE` 并在计算机上安装它。\n\n4. 配置 IDE：一旦你选择并安装了 `IDE`，请花时间根据你的需求进行配置。这包括设置\
  \ `JDK` 路径、选择编码风格、调整字体大小以及配置代码格式选项。请参考你所选 `IDE` 的特定文档或在线教程，获取如何有效配置它的详细说明。\n\n5.\
  \ 验证设置：完成上述步骤后，验证你的 Java 开发环境是否设置正确至关重要。打开你的 `IDE` 并创建一个 Java 项目。编写一个简单的“Hello,\
  \ World!”程序并运行它，以确保一切运行如预期。如果你遇到任何问题，请参考你的 `IDE` 提供的故障排除指南或向 Java 开发者社区寻求帮助。\n\n\
  ## 1.4 你的第一个 Java 程序\n\n现在你已经设置好了 Java 开发环境，是时候编写你的第一个 Java 程序了。按照以下步骤开始：\n\n1.\
  \ 打开你选择的集成开发环境 (IDE)：启动你的 `IDE` 并创建一个项目。给它一个反映程序目的的有意义名称。\n\n2. 创建 Java 类：在 Java\
  \ 中，程序被组织成类。在项目中创建一个新的 Java 类。通常，类名应该大大写字母开头，并遵循驼峰命名法（CamelCase）。例如，`MyFirstProgram`。\n\
  \n3. 编写 main 方法：每个 Java 程序都从一个名为 `main` 的特殊方法开始。该方法是程序的入口点。在类内部，使用以下语法创建 `main`\
  \ 方法：\n\n```java\npublic static void main(String[] args) {\n    // 你的代码写在这里\n}\n\
  ```\n\n4. 为你的程序添加代码：在 `main` 方法内部，你可以编写程序运行时将执行的代码。对于你的第一个程序，让我们保持简单，并在控制台打印“Hello,\
  \ World!”。使用以下代码：\n\n```java\npublic static void main(String[] args) {\n    System.out.println(\"\
  Hello, World!\");\n}\n```\n\n5. 运行你的程序：一旦写完代码，就可以运行你的程序了。在你的 `IDE` 中，找到“Run”（运行）或“Play”（播放）按钮并点击它。`IDE`\
  \ 将编译并执行你的代码。你应该能在控制台中看到输出的“Hello, World!”\n\n恭喜你！你成功编写并执行了你的第一个 Java 程序。花点时间庆祝你作为\
  \ Java 程序员旅程中的这一里程碑。\n\n现在你已经对如何编写和运行 Java 程序有了基本的了解，可以开始进一步探索这门语言了。尝试不同的代码片段，学习变量、控制结构和其他基础概念。不断练习并积累你的知识，成为一名熟练的\
  \ Java 程序员。可能性是无限的，而你才刚刚开始！\n\n## 1.5 理解 Java 语法\n\n要成为一名熟练的 Java 程序员，理解语法（即 Java\
  \ 语言的规则和结构）非常重要。让我们进入 Java 语法的一些关键元素：\n\n1. 语句 (Statements)：在 Java 中，语句是执行特定操作的指令。每个语句都以分号（`;`）结束。例如，以下代码是一个将值\
  \ 10 赋值给变量 `x` 的简单语句：\n\n```java\nint x = 10;\n```\n\n2. 块 (Blocks)：块包含在大括号（`{}`）内，包含多个语句。块通常用于将相关的语句放在一起。例如：\n\
  \n```java\nif (x > 5) {\n    System.out.println(\"x is greater than 5\");\n    System.out.println(\"\
  This is inside the block\");\n}\n```\n\n3. 注释 (Comments)：注释用于添加解释说明或临时禁用代码。在 Java\
  \ 中，单行注释以 `//` 开头，而多行注释包含在 `/*` 和 `*/` 之间。程序不会执行注释，注释仅供人类理解。例如：\n\n```java\n// 这是一个单行注释\n\
  \n/*\n这是一个\n多行注释\n*/\n```\n\n4. 变量 (Variables)：变量用于存储数据。在 Java 中，你需要在使用变量之前对其对其进行声明。变量可以持有的数据类型由其数据类型决定。例如，要声明一个名为\
  \ `num` 的整数变量并给其赋值为 5，你会使用：\n\n```java\nint num = 5;\n```\n\n5. 数据类型 (Data Types)：Java\
  \ 拥有多种数据类型，包括整数（`int`）、浮点数（`float`, `double`）、字符（`char`）、布尔值（`boolean`）等。根据你处理的数据性质选择合适的数据类型很重要。\n\
  \n6. 控制结构 (Control Structures)：控制结构允许你控制程序的流程。Java 中常见的控制结构包括 `if-else` 语句、循环（`for`,\
  \ `while`）和 `switch` 语句。这些结构帮助你做出决策、迭代数据并执行不同的代码块。\n\n7. 方法声明 (Method Declaration)：方法是执行特定任务的代码块。它们定义了一个返回类型（如果没有返回值则为\
  \ `void`）、一个名称和一组参数（可选的）。例如：\n\n```java\npublic int add(int a, int b) {\n    return\
  \ a + b;\n}\n```\n\n这些只是当你深入学习这门语言时会遇到的一些 Java 语法元素。通过练习编写代码并熟悉语法，对于掌握 Java 编程至关重要。\n\
  \n\n\n\n\n# 4. 变量类型\nJava 支持多种变量数据类型，包括：\n\n*   基本数据类型：包括整数（`int`）、浮点数（`float`,\
  \ `double`）、字符（`char`）、布尔（`boolean`）等。例如：\n\n```java\nint num = 10;\ndouble price\
  \ = 19.99;\nchar grade = 'A';\nboolean isTrue = true;\n```\n\n*   引用类型：包括对象、数组和类。引用类型存储实际数据的内存地址。例如：\n\
  \n```java\nString name = \"John\";\nint[] numbers = {1, 2, 3, 4, 5};\n```\n\n# 5.\
  \ 使用变量\n一旦你声明并初始化了一个变量，你就可以在代码中使用它。变量可以用于计算、作为函数参数、存储用户输入等。例如：\n\n```java\nint x\
  \ = 5;\nint y = 10;\nint sum = x + y;\nSystem.out.println(\"The sum is: \" + sum);\n\
  ```\n\n在上面的代码中，变量 `x` 和 `y` 分别持有值 `5` 和 `10`。变量 `sum` 存储 `x` 和 `y` 相加的结果，然后将其打印到控制台。\n\
  \n# 2.2 基本数据类型\n在 Java 中，基本数据类型是存储和处理数据的构建构建。它们代表基础的数据类型，并具有预定义的特性和范围。让我们探索 Java\
  \ 中不同的基本数据类型：\n\n1.  整数类型：\n    *   `byte`：表示有符号的 8 位整数。范围：`-128` 到 `127`。\n   \
  \ *   `short`：表示有符号的 16 位整数。范围：`-32,768` 到 `32,767`。\n    *   `int`：表示有符号的 32 位整数。范围：`-2,147,483,648`\
  \ 到 `2,147,483,647`。\n    *   `long`：表示有符号的 64 位整数。范围：`-9,223,372,036,854,775,808`\
  \ 到 `9,223,372,036,854,775,807`。\n\n2.  浮点数类型：\n    *   `float`：表示单精度 32 位浮点数。范围：大约\
  \ `±3.40282347E+38F`，具有 6-7 位有效小数数字。\n    *   `double`：表示双精度 64 位浮点数。范围：大约 `±1.79769313486231570E+308`，具有\
  \ 15 位有效小数数字。\n\n3.  字符类型：\n    *   `char`：表示单个 Unicode 字符。范围：`0` 到 `65,535` 或 `'\\\
  u0000'` 到 `'\\uffff'`。\n\n4.  布尔类型：\n    *   `boolean`：表示布尔值，可以是 `true` 或 `false`。\n\
  \n5.  其他基本类型：\n    *   `byte`：表示单字节数据。范围：`-128` 到 `127`。\n    *   `short`：表示 16\
  \ 位整数。范围：`-32,768` 到 `32,767`。\n    *   `int`：表示 32 位整数。范围：`-2,147,483,648` 到 `2,147,483,647`。\n\
  \    *   `long`：表示 64 位整数。范围：`-9,223,372,036,854,775,808` 到 `9,223,372,036,854,775,807`。\n\
  \    *   `float`：表示单精度 32 位浮点数。\n    *   `double`：表示双精度 64 位浮点数。\n\n每种数据类型都有自己的范围和精度。为了优化内存使用并确保计算准确，需要根据需求选择合适的数据类型：\n\
  \n```java\nint age = 25;\ndouble price = 19.99;\nchar grade = 'A';\nboolean isTrue\
  \ = true;\n```\n\n在上面的代码中，变量 `age` 持有整数值，`price` 持有浮点数值，`grade` 持有字符值，`isTrue` 持有布尔值。\n\
  \n## 2.3 字符串\n在 Java 中，字符串用于表示字符序列。它们通常用于存储和处理文本。以下是与字符串操作的一些重要概念：\n\n1.  字符串声明和初始化：\n\
  \    *   声明字符串变量并使用 `String` 关键字。例如：\n    ```java\n    String message = \"Hello\"\
  ;\n    ```\n    *   使用赋值运算符 `=` 初始化字符串变量。例如：\n    ```java\n    message = \"Hello\
  \ World!\";\n    ```\n\n2.  字符串拼接：\n    *   字符串拼接是将两个或多个字符串合并为一个字符串的过程。在 Java 中，可以使用\
  \ `+` 运算符进行拼接。例如：\n    ```java\n    String firstName = \"John\";\n    String lastName\
  \ = \"Doe\";\n    String fullName = firstName + \" \" + lastName;\n    ```\n\n3.\
  \  字符串长度：\n    *   使用 `length()` 方法获取字符串的长度。例如：\n    ```java\n    String message\
  \ = \"Hello\";\n    int len = message.length();\n    ```\n\n4.  字符串比较：\n    *  \
  \ 使用 `equals()` 方法比较字符串的相等性。例如：\n    ```java\n    String str1 = \"Hello\";\n   \
  \ String str2 = \"Hello\";\n    boolean isEqual = str1.equals(str2);\n    ```\n\n\
  5.  字符串操作：\n    *   Java 提供了许多操作字符串的方法，如 `toUpperCase()`、`toLowerCase()`、`substring()`、`replace()`、`trim()`\
  \ 和 `split()`。\n\n6.  字符串格式化：\n    *   可以使用 `printf()` 格式化字符串。例如：\n    ```java\n\
  \    String name = \"John\";\n    int age = 25;\n    System.out.printf(\"My name\
  \ is %s and I am %d years old.\", name, age);\n    // 输出：My name is John and I am\
  \ 25 years old.\n\n# 2.4 类型转换与强制类型转换\n在 Java 中，类型转换允许将值从一种数据类型转换为另一种。有时，你可能需要将变量或值转换为不同的数据类型。让我们探索\
  \ Java 中类型转换和强制类型转换的概念：\n\n1.  自动类型转换：\n    *   当你将一种数据类型的值赋值给另一种兼容的数据类型时，Java 会自动执行转换。这被称为自动类型转换或宽转换。\n\
  \    *   例如，将整数值赋值给 `double` 变量：\n    ```java\n    int num = 10;\n    double decimalNum\
  \ = num; // 自动类型转换\n    ```\n\n2.  强制类型转换：\n    *   类型转换是将值从一种数据类型转换为另一种类型的手动过程，这可能不会由\
  \ Java 自动完成。\n    *   强制类型转换需要在转换的值之前指定目标数据类型。\n    *   强制类型转换分为两种：宽转换（隐式）转换和窄转换（显式）转换。\n\
  \    *   宽转换：当你从较小的数据类型转换为较大的数据类型时发生。宽转换不会发生数据丢失。\n    ```java\n    int num = 10;\n\
  \    double decimalNum = num; // 自动类型转换\n    ```\n    *   窄转换：当你从较大的数据类型转换为较小的数据类型时发生。窄转换可能会发生数据丢失，因为目标数据类型可能无法容纳整个值。\n\
  \    ```java\n    double decimalNum = 10.5;\n    int num = (int) decimalNum; //\
  \ 手动类型转换（窄转换）\n    ```\n\n3.  类型转换规则：\n    *   当没有数据丢失的可能性时，Java 会自动执行宽转换。\n   \
  \ *   窄转换需要显式转换，并可能导致数据丢失。\n    *   在不兼容的数据类型之间转换并不总是可能的。例如，直接将字符串转换为整数是不允许的。\n\n\
  4.  隐式转换和显式转换：\n    *   隐式转换：也称为宽转换，当 Java 自动将较小的数据类型转换为较大的数据类型时发生。\n    *   显式转换：也称为窄转换，当你使用强制类型转换手动将较大的数据类型转换为较小的数据类型时发生。\n\
  \n这是一个同时演示了自动类型转换和显式类型转换的示例：\n\n```java\nint num1 = 10;\n```\n\n\n\n\n\n```java\n\
  double num2 = 20.5;\n\ndouble sum = num1 + num2; // 类型转换\n\ndouble decimalNum =\
  \ 10.5;\n\nint num = (int) decimalNum; // 强制类型转换\n```\n\n# 第 3 章：运算符与表达式\n\n## 3.1\
  \ 算术运算符\n\n在 Java 中，算术运算符用于对数值进行数学运算。它们允许你进行加、减、乘、除以及其他数学计算。以下是 Java 中提供的算术运算符：\n\
  \n1. 加法 (+)：将两个操作数相。\n```java\nint sum = num1 + num2;\n```\n\n2. 减法 (-)：从第一个操作数中减去第二个操作数。\n\
  ```java\nint difference = num1 - num2;\n```\n\n3. 乘法 (*)：将两个操作数相乘。\n```java\nint\
  \ product = num1 * num2;\n```\n\n4. 除法 (/)：将第一个操作数除以第二个操作数。如果两个操作数都是整数，结果将是一个整数（截弃任何小数）。如果至少有一个操作数是浮点数，结果将是一个浮点数。\n\
  ```java\nint quotient = num1 / num2; // 整数除法\ndouble result = (double) num1 / num2;\
  \ // 浮点数除法\n```\n\n5. 取模 (%)：返回第一个操作数与第二个操作数除法的余数。\n```java\nint remainder = num1\
  \ % num2;\n```\n\n6. 增 (++) 和 减 (--)：\n   * 增 (`++`) 将 `variable` 的值加 1。\n   * 减\
  \ (`--`) 将 `variable` 的值减 1。\n```java\nint num = 10;\nnum++; // num 现在是 11\nnum--;\
  \ // num 回到了 10\n```\n\n7. 复合赋值运算符：\n   * 复合赋值运算符将算术运算与赋值结合。\n   * 示例：`+=`、`-=`、`*=`、`/=`、`%=`\n\
  ```java\nint num = 10;\nnum += 5; // 等于 num = num + 5\nnum -= 3; // 等于 num = num\
  \ - 3\n```\n\n算术运算符遵循优先级规则，这些规则决定了操作的顺序。你可以使用括号来覆盖默认优先级。\n\n这里是一个演示算术运算符用法的示例：\n\
  ```java\nint num1 = 10;\nint num2 = 5;\nint sum = num1 + num2; // 15\nint difference\
  \ = num1 - num2; // 5\nint product = num1 * num2; // 50\nint quotient = num1 / num2;\
  \ // 2\nint remainder = num1 % num2; // 0\nSystem.out.println(sum);\nSystem.out.println(difference);\n\
  System.out.println(product);\nSystem.out.println(quotient);\nSystem.out.println(remainder);\n\
  ```\n\n## 3.2 比较运算符\n\n比较运算符用于在 Java 中比较两个值或表达式。它们根据比较结果评估布尔值（true 或 false）。以下是\
  \ Java 中提供的比较运算符：\n\n1. 等于 (==)：检查两个操作数的值是否相等。\n```java\nint num1 = 10;\nint num2\
  \ = 5;\nboolean isEqual = num1 == num2; // false\n```\n\n2. 不等于 (!=)：检查两个操作数的值是否相等。\n\
  ```java\nint num1 = 10;\nint num2 = 5;\nboolean isNotEqual = num1 != num2; // true\n\
  ```\n\n3. 大于 (>)：检查第一个操作数的值是否大于第二个操作数的值。\n```java\nint num1 = 10;\nint num2 = 5;\n\
  boolean isGreater = num1 > num2; // true\n```\n\n4. 小于 (<)：检查第一个操作数的值是否小于第二个操作数的值。\n\
  ```java\nint num1 = 10;\nint num2 = 5;\nboolean isLess = num1 < num2; // false\n\
  ```\n\n5. 大于等于 (>=)：检查第一个操作数的值是否大于等于第二个操作数的值。\n```java\nint num1 = 10;\nint num2\
  \ = 5;\nboolean isGreaterOrEqual = num1 >= num2; // true\n```\n\n6. 小于等于 (<=)：检查第一个操作数的值是否小于等于第二个操作数的值。\n\
  ```java\nint num1 = 10;\nint num2 = 5;\nboolean isLessOrEqual = num1 <= num2; //\
  \ false\n```\n\n比较运算符经常用于条件语句（如 if-else 语句）中，根据特定条件做出决策。它们通过评估比较的真假来帮助控制程序的流程。\n\
  \n这里是一个演示比较运算符用法的示例：\n```java\nint num1 = 10;\nint num2 = 5;\nboolean isEqual =\
  \ num1 == num2; // false\nboolean isNotEqual = num1 != num2; // true\nboolean isGreater\
  \ = num1 > num2; // true\nboolean isLess = num1 < num2; // false\nboolean isGreaterOrEqual\
  \ = num1 >= num2; // true\nboolean isLessOrEqual = num1 <= num2; // false\nSystem.out.println(isEqual);\n\
  System.out.println(isNotEqual);\nSystem.out.println(isGreater);\nSystem.out.println(isLess);\n\
  System.out.println(isGreaterOrEqual);\nSystem.out.println(isLessOrEqual);\n```\n\
  \n## 3.3 逻辑运算符\n\n逻辑运算符用于对布尔值进行逻辑运算。以下是 Java 中提供的逻辑运算符：\n\n1. 逻辑与 (&&)：当两个操作数都为真时返回\
  \ true，否则返回 false。\n```java\nboolean condition1 = true;\nboolean condition2 = false;\n\
  boolean result = condition1 && condition2; // false\n```\n\n2. 逻辑或 (||)：当至少有一个操作数为真时返回\
  \ true，否则返回 false。\n```java\nboolean condition1 = true;\nboolean condition2 = false;\n\
  boolean result = condition1 || condition2; // true\n```\n\n3. 逻辑非 (!)：反转操作数的值。\n\
  ```java\nboolean condition = true;\nboolean result = !condition; // false\n```\n\
  \n逻辑运算符经常用于条件语句和循环以控制程序的流程。这里是一个演示逻辑运算符用法的示例：\n```java\nboolean condition1 = true;\n\
  boolean condition2 = false;\nboolean result1 = condition1 && condition2; // false\n\
  boolean result2 = condition1 || condition2; // true\nboolean result3 = !condition1;\
  \ // false\nSystem.out.println(result1);\nSystem.out.println(result2);\nSystem.out.println(result3);\n\
  ```\n\n## 3.4 赋值运算符\n\n赋值运算符用于给变量赋值。它们允许使用不同的操作来存储和更新值。以下是 Java 中的赋值运算符：\n\n1. 赋值\
  \ (=)：将右侧的值赋给左侧变量。\n```java\nint num = 10;\n```\n\n2. 加赋值 (+=)：将右侧的值加到左侧变量上并将结果赋给变量。\n\
  ```java\nint num = 10;\nnum += 5; // 等于 num = num + 5\n```\n\n3. 减赋值 (-=)：从左侧变量中减去右侧的值并将结果赋给变量。\n\
  ```java\nint num = 10;\nnum -= 3; // 等于 num = num - 3\n```\n\n4. 乘赋值 (*=)：将右侧的值与左侧变量相乘并将结果赋给变量。\n\
  ```java\nint num = 10;\nnum *= 2; // 等于 num = num * 2\n```\n\n5. 除赋值 (/=)：将左侧变量除以右侧的值并将结果赋给变量。\n\
  ```java\nint num = 10;\nnum /= 3; // 等于 num = num / 3\n```\n\n6. 取模赋值 (%=)：计算左侧变量除以右侧值的余数并将结果赋给变量。\n\
  ```java\nint num = 10;\nnum %= 4; // 等于 num = num % 4\n```\n\n\n\n\n\n这是一个演示赋值运算符用法的示例：\n\
  \n```java\nint num = 10;\nnum += 5; // num = num + 5\nnum -= 3; // num = num - 3\n\
  num *= 2; // num = num * 2\nnum /= 3; // num = num / 3\nnum %= 4; // num = num %\
  \ 4\nSystem.out.println(num);\n```\n\n## 3.5 优先级和结合性\n\n在 Java 中，运算符具有不同的优先级级别，这决定了表达式中操作的顺序。当一个表达式包含多个运算符时，优先级较高的会被先计算。如果两个运算符的优先级相同，则由结合性决定求值顺序。\n\
  \n以下是 Java 中一些常用运算符的优先级和结合性：\n\n1. 后置运算符：\n   - `()`, `[]`, `.`（从左到右）\n   - 示例：`myArray[0]`\n\
  2. 一元运算符：\n   - `++`, `--`（后置）\n   - `+`, `-`, `!`, `~`（前置，从右到左）\n   - 示例：`-num`\n\
  3. 乘除运算符：\n   - `*`, `/`, `%`（从左到右）\n   - 示例：`num1 * num2`\n4. 加减运算符：\n   - `+`,\
  \ `-`（从左到右）\n   - 示例：`num1 + num2`\n5. 移位运算符：\n   - `<<`, `>>`, `>>>`（从左到右）\n  \
  \ - 示例：`num << 2`\n6. 关系运算符：\n   - `<`, `>`, `<=`, `>=`（从左到右）\n   - 示例：`num1 < num2`\n\
  7. 相等运算符：\n   - `==`, `!=`（从左到右）\n   - 示例：`num1 == num2`\n8. 按位与运算符：\n   - `&`（从左到右）\n\
  \   - 示例：`num1 & num2`\n9. 按位异或运算符：\n   - `^`（从左到右）\n   - 示例：`num1 ^ num2`\n10.\
  \ 按位或运算符：\n    - `|`（从左到右）\n    - 示例：`num1 | num2`\n11. 逻辑与运算符：\n    - `&&`（从左到右）\n\
  \    - 示例：`condition1 && condition2`\n12. 逻辑或运算符：\n    - `||`（从左到右）\n    - 示例：`condition1\
  \ || condition2`\n13. 条件运算符：\n    - `? :`（从右到左）\n    - 示例：`condition ? value1 :\
  \ value2`\n14. 赋值运算符：\n    - `=`, `+=`, `-=`, `*=`, `/=`, `%=`（从右到左）\n    - 示例：`num\
  \ += 5`\n\n括号可以覆盖默认优先级并显式地定义求值顺序。括号内的表达式会被先计算。\n\n以下是一个演示运算符优先级和结合性的示例：\n\n```java\n\
  int result = 5 + 10 * 2; // result = 25, 乘法的优先级高于加法\nboolean condition = (true &&\
  \ false) || true; // condition = true, 括号覆盖了默认优先级\nint value = (num1 + num2) * num3;\
  \ // value = (num1 + num2) * num3, 括号定义了求值顺序\n```\n\n# 第 4 章：控制结构\n\n## 4.1 条件语句\
  \ (if, else, switch)\n\n条件语句用于根据某些条件控制程序的执行流。它们允许你根据条件的结果执行不同的代码块。在 Java 中，有两种类型的条件语句：if-else\
  \ 语句和 switch 语句。\n\n### 1. If-else 语句：\n\nif-else 语句允许你根据条件指定两个代码块。如果条件为真，则执行 `if`\
  \ 块；如果为假，则执行 `else` 块。\n\n语法：\n```java\nif (condition) {\n    // 条件为真时执行的代码\n} else\
  \ {\n    // 条件为假时执行的代码\n}\n```\n\n示例：\n```java\nint num = 10;\nif (num > 0) {\n\
  \    System.out.println(\"Positive number\");\n} else {\n    System.out.println(\"\
  Negative number\");\n}\n```\n\n### 2. Switch 语句：\n\nswitch 语句允许根据变量或表达式的值选择多个代码块之一。与多个\
  \ if-else 语句相比，它提供了更简洁的方式。\n\n语法：\n```java\nswitch (expression) {\n    case value1:\n\
  \        // 如果表达式匹配 value1 则执行的代码\n        break;\n    case value2:\n        //\
  \ 如果表达式匹配 value2 则执行的代码\n        break;\n    // 其他情况...\n    default:\n        //\
  \ 如果一个都不匹配时执行的代码\n}\n```\n\n示例：\n```java\nint day = 3;\nString dayName;\nswitch\
  \ (day) {\n    case 1:\n        dayName = \"Monday\";\n        break;\n    case\
  \ 2:\n        dayName = \"Tuesday\";\n        break;\n    case 3:\n        dayName\
  \ = \"Wednesday\";\n        break;\n    // 其他情况...\n    default:\n        dayName\
  \ = \"Invalid day\";\n}\nSystem.out.println(\"Day: \" + dayName);\n```\n\n条件语句对于根据某些条件做出决策和控制程序流至关重要。它们帮助根据不同的场景执行特定的代码块。\n\
  \n## 4.2 循环语句 (while, do-while, for)\n\n循环语句用于重复执行代码块直到满足特定条件。在 Java 中有三种：while、do-while\
  \ 和 for。\n\n### 1. While 循环：\n\n`while` 循环只要条件为真就会重复代码块。它在每次迭代之前检查条件。\n\n语法：\n```java\n\
  while (condition) {\n    // 执行的代码\n}\n```\n\n示例：\n```java\nint count = 0;\nwhile\
  \ (count < 5) {\n    System.out.println(\"Count: \" + count);\n    count++;\n}\n\
  ```\n\n### 2. Do-while 循环：\n\n`do-while` 循环与 `while` 循环类似，但它在每次迭代后检查条件。它保证代码块至少执行一次。\n\
  \n语法：\n```java\ndo {\n    // 执行的代码\n} while (condition);\n```\n\n示例：\n```java\n\
  int count = 0;\ndo {\n    System.out.println(\"Count: \" + count);\n    count++;\n\
  } while (count < 5);\n```\n\n### 3. For 循环：\n\n`for` 循环用于固定次数地遍历一组值。它提供了一种紧凑的方式来初始化、测试和更新循环变量。\n\
  \n语法：\n```java\nfor (initialization; condition; update) {\n    // 执行的代码\n}\n```\n\
  \n示例：\n```java\nfor (int i = 0; i < 5; i++) {\n    System.out.println(\"Count: \"\
  \ + i);\n}\n```\n\n## 4.3 嵌套控制结构\n\n嵌套控制结构是指在一个控制结构内部另一个控制结构。它允许你创建复杂的程序逻辑和层次。在\
  \ Java 中，你可以相互嵌套 if-else 语句、switch 语句和循环。\n\n以下是一些嵌套控制结构的示例：\n\n### 1. 嵌套 if-else\
  \ 语句：\n\n你可以相互嵌套 if-else 语句来处理多个条件并创建更复杂的决策逻辑。\n\n示例：\n```java\nint num = 10;\n\
  if (num > 0) {\n    if (num % 2 == 0) {\n        System.out.println(\"Positive even\
  \ number\");\n    } else {\n        System.out.println(\"Positive odd number\");\n\
  \    }\n} else {\n    System.out.println(\"Negative number\");\n}\n```\n\n### 2.\
  \ 嵌套 switch 语句：\n\n你可以相互嵌套 switch 语句来处理不同的情况并创建复杂的控制流。\n\n示例：\n```java\nint num1\
  \ = 10;\nint num2 = 5;\nchar operator = '+';\nswitch (operator) {\n    case '+':\n\
  \        System.out.println(\"Addition result: \" + (num1 + num2));\n        break;\n\
  \    case '-':\n        System.out.println(\"Subtraction result: \" + (num1 - num2));\n\
  \        break;\n    case '*':\n        System.out.println(\"Multiplication result:\
  \ \" + (num1 * num2));\n        break;\n    case '/':\n        if (num2 != 0) {\n\
  \            System.out.println(\"Division result: \" + (num1 / num2));\n      \
  \  } else {\n            System.out.println(\"Cannot divide by zero\");\n      \
  \  }\n        break;\n    default:\n        System.out.println(\"Invalid operator\"\
  );\n        break;\n}\n```\n\n### 3. 嵌套循环：\n\n你可以相互嵌套循环以结构化的方式执行重复操作。这通常用于遍历多维数组或执行复杂的迭代。\n\
  \n示例：\n```java\nint rows = 5;\nint columns = 5;\nfor (int i = 1; i <= rows; i++)\
  \ {\n    for (int j = 1; j <= columns; j++) {\n        System.out.print(i * j +\
  \ \" \");\n    }\n    System.out.println();\n}\n```\n\n\n\n\n嵌套控制结构允许你通过组合多个条件和迭代来创建更复杂的程序逻辑。然而，保持可读性并避免过度嵌套至关重要，因为这会导致代码更难以理解和维护。请明智地使用嵌套控制结构，如果嵌套深度过深，请考虑进行重构。\n\
  \n## 4.4 break 和 continue 语句\n\n在 Java 中，`break` 和 `continue` 语句用于循环内部以控制执行流。它们提供了额外的控制机制来修改循环的默认行为。\n\
  \n1. break 语句：\n\n`break` 语句用于提前退出循环。当遇到它时，会立即终止最内层循环，并从循环后的下一个语句开始继续执行。\n\n示例：\n\
  \n```java\nfor (int i = 1; i <= 10; i++) {\n    if (i == 5) {\n        break;\n\
  \    }\n    System.out.println(i);\n}\n```\n\n在上述示例中，当 `i` 等于 5 时，循环将终止。输出将是：\n\
  1\n2\n3\n4\n\n2. continue 语句：\n\n`continue` 语句用于跳过循环体的剩余部分并进入下一次迭代。当遇到它时，会立即跳转到循环的控制表达式并对其求值，以决定继续循环还是终止循环。\n\
  \n示例：\n\n```java\nfor (int i = 1; i <= 5; i++) {\n    if (i == 3) {\n        continue;\n\
  \    }\n    System.out.println(i);\n}\n```\n\n在上述示例中，循环将跳过数字 3 的打印并继续下一次迭代。输出将是：\n\
  1\n2\n4\n5\n\n`break` 和 `continue` 语句为控制循环执行提供了灵活性。它们可以根据某些条件提前终止循环或跳过特定的迭代。然而，谨慎地使用它们对于维护代码可读性以及避免创建难以理解和调试的复杂程序逻辑至关重要。\n\
  \n# 第 5 章：函数与方法\n\n## 5.1 函数简介\n\n函数（也称为方法）是执行特定任务的可重用代码块。它们通过将代码拆分为更小、易于管理的块来帮助实现代码的组织和模块化。函数可以从程序的不同部分被多次调用，减少代码重复并提高代码可读性。\n\
  \n在 Java 中，函数有一个返回类型、名称，并可能接受参数。返回类型指定了函数将返回值的类型，如果函数不返回任何值，则可以为 `void`。函数的名称应该是描述性的，并指明它所执行的任务。参数是可选的，允许你将值传递给函数进行处理。\n\
  \n函数声明的语法：\n\n```java\nreturnType functionName(parameterType parameter1, parameterType\
  \ parameter2, ...) {\n    // 要执行的代码\n    return value; // 如果返回类型不是 void，则可选\n}\n\
  ```\n\n计算数字平方的函数示例：\n\n```java\nint square(int num) {\n    int result = num * num;\n\
  \    return result;\n}\n```\n\n在上述示例中，函数 `square` 接收一个整数参数 `num` 并计算该数字的平方。函数的返回类型为\
  \ `int`，表示它将返回一个整数值。\n\n可以使用名称后加括号来调用函数。如果函数期望参数，则可以向函数传递参数。\n\n调用 `square` 函数的示例：\n\
  \n```java\nint number = 5;\nint squareResult = square(number);\nSystem.out.println(\"\
  Square of \" + number + \" is: \" + squareResult);\n```\n\n输出将是：\nSquare of 5 is:\
  \ 25\n\n函数对于模块化编程、代码重用和改进代码组织至关重要。它们有助于将复杂任务拆分为较小、易于管理的部分。练习创建和使用函数以增强你的编程技能并编写更整洁、更易维护的代码。\n\
  \n## 5.2 定义和调用方法\n\n在 Java 中，方法通过将代码拆分为更小、易于管理的块来帮助实现代码的组织和模块化。方法可以从程序的不同部分被多次调用，减少代码重复并提高代码可读性。\n\
  \n在 Java 中，方法有一个返回类型、名称，并可能接受参数。返回类型指定了方法将返回值的类型，如果方法不返回任何值，则可以为 `void`。方法的名称应该是描述性的，并指明它所执行的任务。参数是可选的，允许你将值传递给方法进行处理。\n\
  \n方法声明的语法：\n\n```java\nreturnType methodName(parameterType parameter1, parameterType\
  \ parameter2, ...) {\n    // 要执行的代码\n    return value; // 如果返回类型不是 void，则可选\n}\n\
  ```\n\n计算数字平方的方法示例：\n\n```java\nint square(int num) {\n    int result = num * num;\n\
  \    return result;\n}\n```\n\n在上述示例中，方法 `square` 接收一个整数参数 `num` 并计算该数字的平方。方法的返回类型为\
  \ `int`，表示它将返回一个整数值。\n\n可以使用名称后加括号来调用方法。如果方法期望参数，则可以向方法传递参数。\n\n调用 `square` 方法的示例：\n\
  \n```java\nint number = 5;\nint squareResult = square(number);\nSystem.out.println(\"\
  Square of \" + number + \" is: \" + squareResult);\n```\n\n输出将是：\nSquare of 5 is:\
  \ 25\n\n方法对于模块化编程、代码重用和改进代码组织至关重要。它们有助于将复杂任务拆分为较小、易于管理的部分。练习创建和使用方法以增强你的编程技能并编写更整洁、更易维护的代码。\n\
  \n## 5.3 参数传递\n\n在 Java 中，参数用于将值传递给方法。它们允许方法根据输入执行操作。参数传递有两种：按值传递和引用传递。\n\n1. 按值传递：\n\
  \n在 Java 中，所有基本数据类型（如 `int`、`float`、`boolean`）按值传递。当将值传递给方法时，会创建该值的拷贝，方法内部对参数的修改不会影响原始值。\n\
  \n示例：\n\n```java\npublic static void modifyValue(int value) {\n    value = value\
  \ + 10;\n    System.out.println(\"Inside method: \" + value);\n}\n\npublic static\
  \ void main(String[] args) {\n    int num = 5;\n    System.out.println(\"Before\
  \ method call: \" + num);\n    modifyValue(num);\n    System.out.println(\"After\
  \ method call: \" + num);\n}\n```\n\n在上述示例中，`modifyValue` 方法接收整数参数 `value` 并对其加\
  \ 10。然而，方法内部的修改不会影响原始的 `num`。\n\n输出：\nBefore method call: 5\nInside method: 15\n\
  After method call: 5\n\n2. 引用传递：\n\n在 Java 中，非基本数据类型（如数组、对象）按引用传递。当将对象或数组的引用传递给方法时，方法内部对参数的修改会影响原始对象或数组。\n\
  \n示例：\n\n```java\npublic static void modifyArray(int[] array) {\n    array[0] =\
  \ 10;\n    System.out.println(\"Inside method: \" + array[0]);\n}\n\npublic static\
  \ void main(String[] args) {\n    int[] numbers = { 1, 2, 3 };\n    System.out.println(\"\
  Before method call: \" + numbers[0]);\n    modifyArray(numbers);\n    System.out.println(\"\
  After method call: \" + numbers[0]);\n}\n```\n\n在上述示例中，`modifyArray` 方法接收整数数组参数\
  \ `array`并将索引 0 的值更改为 10。方法内部的修改会影响原始的 `numbers` 数组。\n\n输出：\nBefore method call:\
  \ 1\nInside method: 10\nAfter method call: 10\n\n\n\n\n在 Java 中，方法可以使用 `return`\
  \ 语句返回值。方法的返回类型指定了方法将返回的值的类型。当方法遇到 `return` 语句时，它会立即退出方法并返回指定的值（如果返回类型不是 `void`）。\n\
  \n带有 `return` 语句的方法语法：\n\n```java\nreturnType methodName(parameterType parameter1,\
  \ parameterType parameter2, ...) {\n    // 要执行的代码\n    return value; // 指定返回类型对应的值\n\
  }\n```\n\n以下是一个计算两个数字之和并返回结果的方法示例：\n\n```java\npublic int sum(int num1, int num2)\
  \ {\n    int result = num1 + num2;\n    return result;\n}\n```\n\n在上面的示例中，`sum`\
  \ 方法接收两个整数参数 `num1` 和 `num2`。它计算两个数字之和并将结果作为整数返回。\n\n要使用返回的值，你可以将其赋值给一个变量，或直接在表达式中使用它。\n\
  \n调用 `sum` 方法并使用返回值的示例：\n\n```java\nint number1 = 5;\nint number2 = 10;\nint sumResult\
  \ = sum(number1, number2);\nSystem.out.println(\"Sum of \" + number1 + \" and \"\
  \ + number2 + \" is: \" + sumResult);\n```\n\n输出将是：\nSum of 5 and 10 is: 15\n\n\
  如果方法的返回类型为 `void`，则意味着方法不返回任何值。在这种情况下，可以省略 `return` 语句，或者可以使用不带指定值的 `return;`。\n\
  \n返回类型为 `void` 的方法示例：\n\n```java\npublic void printMessage() {\n    System.out.println(\"\
  Hello, world!\");\n}\n```\n\n在上面的示例中，`printMessage` 方法不返回任何值。它只是向控制台打印一条消息。\n\n\
  从方法返回值允许你执行计算或处理数据，并将结果提供给调用代码。利用返回语句可以使你的方法更具通用性且可重用性。\n\n## 5.5 方法重载\n\n在 Java\
  \ 中，方法重载允许你定义多个同名但参数列表不同的方法。重载方法通过允许使用不同类型或数量的参数执行相似的操作，提供了灵活性和便利性。\n\n要重载一个方法，你需要定义多个同名但参数列表不同的方法。参数列表可以在参数数量、类型或两者方面有所不同。\n\
  \n方法重载的示例：\n\n```java\npublic int calculateSum(int num1, int num2) {\n    return\
  \ num1 + num2;\n}\n\npublic double calculateSum(double num1, double num2) {\n  \
  \  return num1 + num2;\n}\n\npublic int calculateSum(int num1, int num2, int num3)\
  \ {\n    return num1 + num2 + num3;\n}\n```\n\n在上面的示例中，我们有三个名为 `calculateSum` 的方法，但每个方法都有不同的参数列表。第一个方法接收两个整数并返回它们的和。第二个方法接收两个双精度数字并返回它们的和。第三个方法接收三个整数并返回它们的和。\n\
  \n调用重载方法时，Java 根据提供的参数决定调用哪个方法。Java 将参数的类型和数量与可用重载方法的参数进行匹配。\n\n调用重载的 `calculateSum`\
  \ 方法的示例：\n\n```java\nint sum1 = calculateSum(5, 10);\ndouble sum2 = calculateSum(3.5,\
  \ 2.7);\n int sum3 = calculateSum(1, 2, 3);\n```\n\n重载方法为方法设计提供了灵活性并提高了了代码的可读性。它们允许你为相似的操作使用相同的方法名，使代码更加直观且易于理解。在使用方法重载时，确保方法具有不同的参数列表以避免歧义。\n\
  \n# 第 6 章：面向对象编程\n\n## 6.1 面向对象编程简介\n\n面向对象编程（OOP）是一种围绕对象（类的实例）来组织代码的编程范式。它专注于通过定义类（作为创建对象的蓝图）来创建可重用的模块化代码。\n\
  \n在 OOP 中，核心概念有：\n\n1. **类 (Class)**：类是定义对象的属性（字段）和行为（方法）的蓝图或模板。它指定了对象可以做什么以及持有什么数据。\n\
  2. **对象 (Object)**：对象是类的实例。它代表具有特定状态和行为的特定实体或事物。对象由类创建并可以与其他对象相互作用。\n3. **封装 (Encapsulation)**：封装是将数据和方法封装在类内部的概念。它从外部访问中隐藏类的内部实现细节，并通过方法提供对数据的访问。\n\
  4. **继承 (Inheritance)**：继承允许类从另一个类继承属性和行为的机制。它促进了代码重用并能够创建类层次。\n5. **多态 (Polymorphism)**：多态允许不同类的对象被视为共同父类的对象。它允许使用单一的接口来表示不同类型的对象，并为方法的实现提供了灵活性。\n\
  6. **抽象 (Abstraction)**：抽象专注于表示对象的本质特征，同时隐藏不必要的细节。它允许你创建抽象类和接口，定义共同行为而不指定其具体实现。\n\
  \nOOP 促进了代码的可重用性、模块化和可维护性。它允许你将现实世界的实体建模为对象，并通过方法定义它们的行为。理解 OOP 的原理对于编写结构化且高效的代码非常重要。练习创建类、对象并利用\
  \ OOP 概念来设计更健壮、灵活的应用。\n\n## 6.2 类与对象\n\n在 Java 中，类和对象是面向对象编程的基础构建块。类是定义对象属性和行为的蓝图或模板，而对象是类的实例。\n\
  \n要创建一个类，你需要定义它的属性（变量）和行为（方法）。\n\n类声明的语法：\n\n```java\npublic class ClassName {\n\
  \    // 类变量（属性）\n    // 类方法（行为）\n}\n```\n\n以下是一个名为 `Person` 的类示例：\n\n```java\npublic\
  \ class Person {\n    // 实例变量\n    private String name;\n    private int age;\n\n\
  \    // 构造函数\n    public Person(String name, int age) {\n        this.name = name;\n\
  \        this.age = age;\n    }\n\n    // 实例方法\n    public void sayHello() {\n \
  \       System.out.println(\"Hello, my name is \" + name);\n    }\n\n    public\
  \ void celebrateBirthday() {\n        age++;\n        System.out.println(\"Happy\
  \ birthday! Now I am \" + age + \" years old.\");\n    }\n}\n```\n\n在上面的示例中，`Person`\
  \ 类有两个实例变量 `name` 和 `age`，代表人的名字和年龄。它还有一个构造函数在创建类对象时初始化这些变量的值。该类还定义了两个方法 `sayHello()`\
  \ 和 `celebrateBirthday()` 来执行某些操作。\n\n要创建一个类的对象，你需要使用 `new` 关键字，后跟类名和构造参数（如果有）。\n\
  \n创建 `Person` 类对象的示例：\n\n```java\nPerson person1 = new Person(\"Alice\", 25);\n\
  Person person2 = new Person(\"Bob\", 30);\n```\n\n你可以使用点操作符访问对象的属性并调用方法。\n\n访问属性和调用方法的示例：\n\
  \n```java\nSystem.out.println(person1.name); // 输出: Alice\nperson2.sayHello(); //\
  \ 输出: Hello, my name is Bob\nperson1.celebrateBirthday(); // 输出: Happy birthday!\
  \ Now I am 26 years old.\n```\n\n\n\n\n类和对象在面向对象编程中至关重要，因为它们允许你模拟现实世界的实体并定义它们的行为。通过创建类和对象，你可以在程序中实现代码重用、模块化和可维护性。\n\
  \n## 6.3 构造函数与初始化\n\n在 Java 中，构造函数是用于初始化类对象的特殊方法。它们的名称与类名相同，且没有返回值，即使是 `void` 也没有。当使用\
  \ `new` 关键字创建对象时，构造函数会被调用。\n\n构造函数允许你设置类实例变量的初始值，并执行任何必要的设置任务。\n\n构造函数的语法：\n\n```java\n\
  public ClassName(parameterType parameter1, parameterType parameter2, ...) {\n  \
  \  // 初始化代码\n}\n```\n\n以下是一个带有构造函数的类示例：\n\n```java\npublic class Person {\n    private\
  \ String name;\n    private int age;\n\n    public Person(String name, int age)\
  \ {\n        this.name = name;\n        this.age = age;\n    }\n    // 其他方法和属性\n\
  }\n```\n\n在上面的示例中，`Person` 类有一个接收两个参数 `name` 和 `age` 的构造函数。该构造函数使用提供的参数值来初始化实例变量\
  \ `name` 和 `age`。\n\n在创建该类的对象时，构造函数会自动调用，作为参数传递的值用于初始化对象。\n\n使用构造函数创建对象的示例：\n\n\
  ```java\nPerson person1 = new Person(\"Alice\", 25);\n```\n\n在上面的示例中，调用了 `Person`\
  \ 构造函数并传入参数 \"Alice\" 和 25，创建了一个名为 \"Alice\" 年龄为 25 的新 `Person` 对象。\n\n构造函数还可以被重载，允许你创建具有不同初始值的对象。\n\
  \n重载构造函数的示例：\n\n```java\npublic class Person {\n    private String name;\n    private\
  \ int age;\n\n    public Person(String name) {\n        this.name = name;\n    \
  \    this.age = 0;\n    }\n\n    public Person(String name, int age) {\n       \
  \ this.name = name;\n        this.age = age;\n    }\n    // 其他方法和属性\n}\n```\n\n\
  在上面的示例中，`Person` 类有两个构造函数：一个只接收名称参数并将年龄设置为 0，另一个同时接收名称和年龄参数。\n\n构造函数对于初始化对象并确保它们具有有效的初始状态至关重要。它们允许你设置实例变量的初始值并执行任何必要的设置任务。利用构造函数创建具有所需初始值的对象，并确保对象的正确初始化。\n\
  \n## 6.4 封装与数据隐藏\n\n封装是面向对象编程（OOP）的核心原则之一，它促进了数据隐藏并将数据与方法在类内部紧密结合。它允许你控制对对象内部数据的访问，并确保数据通过定义的方法进行访问和修改。\n\
  \n数据隐藏是将类的内部数据设为私有（private）的实践，这意味着无法从类外部直接访问它们。相反，通过公共（public）方法（即 getter 方法和 setter\
  \ 方法）来提供对数据的访问。\n\nGetter 方法是提供访问私有变量值的方法，而 setter 方法是允许更改或修改私有变量值的方法。\n\n是 Java\
  \ 中封装和数据隐藏的示例：\n\n```java\npublic class Person {\n    private String name;\n   \
  \ private int age;\n\n    public String getName() {\n        return name;\n    }\n\
  \n    public void setName(String name) {\n        this.name = name;\n    }\n\n \
  \   public int getAge() {\n        return age;\n    }\n\n    public void setAge(int\
  \ age) {\n        if (age >= 0) {\n            this.age = age;\n        }\n    }\n\
  }\n```\n\n在上面的示例中，`Person` 类拥有私有实例变量 `name` 和 `age`。该类提供了公共 getter 和 setter 方法来访问和修改这些变量。\n\
  \ngetter 方法（`getName()` 和 `getAge()`）允许其他类检索私有变量的值。setter 方法（`setName()` 和 `setAge()`）允许其他类修改私有变量的值，并对\
  \ `age` 变量进行额外的验证以确保值非负。\n\n通过封装数据并通过 getter 和 setter 方法提供受控访问，类可以强制数据完整性并保持一致性。它还允许类隐藏其内部实现细节，为未来的更改提供灵活性，而不影响使用该类的其他代码部分。\n\
  \n使用 getter 和 setter 访问和修改数据的示例：\n\n```java\nPerson person = new Person();\nperson.setName(\"\
  Alice\");\nperson.setAge(25);\n\nSystem.out.println(\"Name: \" + person.getName());\
  \ // 输出: Name: Alice\nSystem.out.println(\"Age: \" + person.getAge()); // Output:\
  \ Age: 25\n```\n\n在上面的示例中，私有变量 `name` 和 `age`是通过公共 getter 和 setter 方法进行访问和修改的。\n\
  \n封装和数据隐藏是 OOP 中的重要概念，因为它们促进了代码的可维护性、重用性和安全性。它们允许你控制对对象内部数据的访问，并为处理数据提供了一个一致且受控的接口。\n\
  \n## 6.5 继承与多态\n\n继承和多态是面向对象编程（OOP）中的重要概念，允许你创建类的层次结构，并通过通用接口处理不同类型的对象。\n\n继承是一种允许类（子类）从另一个类继承属性和行为的机制。它促进了代码重用，并允许创建扩展通用类的特化类。\n\
  \n要创建子类，你可以使用 `extends` 关键字后跟父类名。子类继承父类的所有公共和保护成员。\n\n继承的语法：\n\n```java\npublic\
  \ class Subclass extends Superclass {\n    // 子类成员\n}\n```\n\n以下是 Java 中继承的示例：\n\
  \n```java\npublic class Animal {\n    protected String name;\n\n    public Animal(String\
  \ name) {\n        this.name = name;\n    }\n\n    public void makeSound() {\n \
  \       System.out.println(\"动物发出声音\");\n    }\n}\n\npublic class Dog extends Animal\
  \ {\n    public Dog(String name) {\n        super(name);\n    }\n\n    @Override\n\
  \    public void makeSound() {\n        System.out.println(\"狗在汪汪叫\");\n    }\n\
  }\n```\n\n在上面的示例中，`Animal` 类是父类，而 `Dog` 类是扩展 `Animal` 的子类。`Dog` 类继承了 `name` 变量和\
  \ `makeSound()` 方法。\n\n多是将是将类的对象视为公共类对象的能力。它允许使用单一接口表示不同类型的对象，并为方法实现提供灵活性。\n\n多态通过方法重写实现，子类对父类中已定义的方法提供自己的实现。\n\
  \n要重写方法，你在子类中使用 `@Override` 注解，后跟该方法的签名。\n\n以下是 Java 中多态的示例：\n\n```java\nAnimal\
  \ animal = new Dog(\"Buddy\");\nanimal.makeSound(); // 输出: 狗在汪汪叫\n```\n\n在上面的示例中，一个\
  \ `Dog` 类对象被赋值给 `Animal` 类型的变量。尽管变量类型是 `Animal`，但调用的 `makeSound()` 方法来自 `Dog` 类，结果为“狗在汪汪叫”。这就是多态的体现，即将子类对象被视为父类对象处理。\n\
  \n\n\n\n# 第 7 章：异常处理\n\n## 7.1 理解异常\n\n在 Java 中，异常是程序执行过程中发生的事件，它会破坏指令的正常执行流。异常是由运行时发生的非预期条件或错误引起的。\n\
  \n当异常发生时，它会创建一个表示异常状态的对象。该对象被称为异常对象，它包含了有关异常类型以及异常发生时程序状态的信息。\n\nJava 提供了一种名为“异常处理”的机制，用来处理这些异常情况，并确保你的程序能够优雅地处理错误并从中恢复。\n\
  \nJava 中有两种类型的异常：检查异常（checked exceptions）和未检查异常（unchecked exceptions）。\n\n1. **检查异常\
  \ (Checked Exceptions)**：这些是在编译时就会被检查的异常。它们通常是由程序无法控制的外部因素引起的，例如文件输入/输出、网络操作或数据库访问。检查异常必须在方法签名中使用\
  \ `throws` 关键字声明，或者使用 `try-catch` 块进行处理。\n2. **未检查异常 (Unchecked Exceptions)**：这些是在编译时不会进行检查的异常。它们通常是由代码中的编程错误或无效条件引起的，例如空指针异常或数组下标越界异常。未检查异常不需要显式声明或捕获，但如果需要，仍然可以使用\
  \ `try-catch` 块进行处理。\n\n以下是 Java 中处理异常的示例：\n\n```java\npublic class ExceptionHandlingExample\
  \ {\n    public static void main(String[] args) {\n        try {\n            int\
  \ result = divide(10, 0);\n            System.out.println(\"Result: \" + result);\n\
  \        } catch (ArithmeticException e) {\n            System.out.println(\"Error:\
  \ Division by zero\");\n        }\n    }\n\n    public static int divide(int dividend,\
  \ int divisor) {\n        return dividend / divisor;\n    }\n}\n```\n\n在上面的示例中，`divide()`\
  \ 方法执行两个数字之间的除法。然而，如果除数为 0，它将抛出一个 `ArithmeticException`。在 `main()` 方法中，除法操作被封装在\
  \ `try` 块中，异常被 `catch` 块捕获并处理。如果发生异常，将执行 `catch` 块并显示相应的错误信息。\n\n异常处理允许你优雅地处理错误并在异常发生时提供备选的执行路径。它有助于防止程序因意外错误而突然终止，从而维护程序的稳定性和可靠性。\n\
  \n## 7.2 使用 Try-Catch 块处理异常\n\n在 Java 中，异常处理通过 `try-catch` 块完成。`try` 块用于封装可能抛出异常的代码，而一个或多个\
  \ `catch` 块用于处理被抛出的异常。\n\n`try-catch` 块的语法如下：\n\n```java\ntry {\n    // 可能抛出异常的代码\n\
  } catch (ExceptionType1 exceptionVariable1) {\n    // 处理 ExceptionType1 的代码\n} catch\
  \ (ExceptionType2 exceptionVariable2) {\n    // 处理 ExceptionType2 的代码\n} catch (ExceptionType3\
  \ exceptionVariable3) {\n    // 处理 ExceptionType3 的代码\n}\n```\n\n以下是使用 `try-catch`\
  \ 块处理异常的示例：\n\n```java\npublic class ExceptionHandlingExample {\n    public static\
  \ void main(String[] args) {\n        try {\n            int result = divide(10,\
  \ 0);\n            System.out.println(\"Result: \" + result);\n        } catch (ArithmeticException\
  \ e) {\n            System.out.println(\"Error: Division by zero\");\n        }\n\
  \    }\n\n    public static int divide(int dividend, int divisor) {\n        return\
  \ dividend / divisor;\n    }\n}\n```\n\n在上面的示例中，`try` 块中的代码尝试执行除法操作。如果除数为 0，它将抛出一个\
  \ `ArithmeticException`。带有 `ArithmeticException` 参数的 `catch` 块用于捕获并处理此异常。在 `catch`\
  \ 块内部，会显示相应的错误信息。\n\n如果 `try` 块内部发生异常，程序流将立即跳转到对应的 `catch` 块。只有与抛出的异常类型匹配的 `catch`\
  \ 块会被执行。如果没有 `catch` 块匹配该异常类型，异常将沿着调用栈向上传播，直到被捕获或程序终止。\n\n你可以拥有多个 `catch` 块来处理 `try`\
  \ 块中可能抛出的不同类型的异常。`catch` 块按照从上下的顺序进行评估，并执行第一个匹配的 `catch` 块。\n\n你还可以使用 `Exception`\
  \ 类创建一个不指定特定异常类型的 `catch` 块。该 `catch` 块将捕获任何未被之前的 `catch` 块捕获的异常。\n\n```java\ntry\
  \ {\n    // 可能抛出异常的代码\n} catch (ExceptionType1 exceptionVariable1) {\n    // 处理\
  \ ExceptionType1 的代码\n} catch (ExceptionType2 exceptionVariable2) {\n    // 处理 ExceptionType2\
  \ 的代码\n} catch (Exception exceptionVariable) {\n    // 处理任何其他异常\n}\n```\n\n使用 `try-catch`\
  \ 块进行异常处理允许你处理并从异常恢复恢复防止程序突然终止。它提供了一种处理异常情况的结构化方法，有助于维护代码的稳定性和可靠性。\n\n## 7.3 多个\
  \ Catch 块\n\n在 Java 中，你可以拥有多个 `catch` 块来处理 `try` 块中可能抛出的不同类型的异常。这允许你根据异常的性质所需的行为为每种异常提供特定的处理。\n\
  \n多个 `catch` 块的语法如下：\n\n```java\ntry {\n    // 可能抛出异常的代码\n} catch (ExceptionType1\
  \ exceptionVariable1) {\n    // 处理 ExceptionType1 的代码\n} catch (ExceptionType2 exceptionVariable2)\
  \ {\n    // 处理 ExceptionType2 的代码\n} catch (ExceptionType3 exceptionVariable3) {\n\
  \    // 处理 ExceptionType3 的代码\n}\n```\n\n以下是多个 `catch` 块的示例：\n\n```java\npublic\
  \ class ExceptionHandlingExample {\n    public static void main(String[] args) {\n\
  \        try {\n            int[] numbers = {1, 2, 3};\n            System.out.println(numbers[5]);\n\
  \        } catch (ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"\
  Error: Array index out of bounds\");\n        } catch (NullPointerException e) {\n\
  \            System.out.println(\"Error: Null pointer exception\");\n        }\n\
  \    }\n}\n```\n\n在上面的示例中，`try` 块中的代码尝试访问数组中索引为 5 的元素。由于数组长度为 3，它将抛出一个 `ArrayIndexOutOfBoundsException`。带有\
  \ `ArrayIndexOutOfBoundsException` 参数的 `catch` 块用于捕获并处理此异常。\n\n如果 `try` 块中的代码抛出的是\
  \ `NullPointerException`，则带有 `NullPointerException` 参数的 `catch` 块将执行。\n\n`catch`\
  \ 块按照从上下的顺序进行评估。第一个与抛出的异常类型匹配的 `catch` 块将执行，后续的 `catch` 块将被跳过。\n\n正确排序 `catch` 块是非常重要的。如果将父类异常的\
  \ `catch` 块放在子类异常的 `catch` 块之前，则父类异常的 `catch` 块将始终执行，子类异常的 `catch` 块将永远无法到达。\n\n\
  你还可以使用 `Exception` 类创建一个不指定特定异常类型的 `catch` 块。该 `catch` 块将捕获任何未被之前的 `catch` 块捕获的异常。\n\
  \n```java\ntry {\n    // 可能抛出异常的代码\n} catch (ExceptionType1 exceptionVariable1)\
  \ {\n    // 处理 ExceptionType1 的代码\n} catch (ExceptionType2 exceptionVariable2) {\n\
  \    // 处理 ExceptionType2 的代码\n} catch (Exception exceptionVariable) {\n    // 处理任何其他异常\n\
  }\n```\n\n[/content] 非常抱歉，在上述翻译的末尾似乎重复输入了 `[/content]` 标签。以下是修正后的完整翻译内容：\n\n[content]\n\
  # 第 7 章：异常处理\n\n## 7.1 理解异常\n\n在 Java 中，异常是程序执行过程中发生的事件，它会破坏指令的正常执行流。异常是由运行时发生的非预期条件或错误引起的。\n\
  \n当异常发生时，它会创建一个表示异常状态的对象。该对象被称为异常对象，它包含了有关异常类型以及异常发生时程序状态的信息。\n\nJava 提供了一种名为“异常处理”的机制，用来处理这些异常情况，并确保你的程序能够优雅地处理错误并从中恢复。\n\
  \nJava 中有两种类型的异常：检查异常（checked exceptions）和未检查异常（unchecked exceptions）。\n\n1. **检查异常\
  \ (Checked Exceptions)**：这些是在编译时就会被检查的异常。它们通常是由程序无法控制的外部因素引起的，例如文件输入/输出、网络操作或数据库访问。检查异常必须在方法签名中使用\
  \ `throws` 关键字声明，或者使用 `try-catch` 块进行处理。\n2. **未检查异常 (Unchecked Exceptions)**：这些是在编译时不会进行检查的异常。它们通常是由代码中的编程错误或无效条件引起的，例如空指针异常或数组下标越界异常。未检查异常不需要显式声明或捕获，但如果需要，仍然可以使用\
  \ `try-catch` 块进行处理。\n\n以下是 Java 中处理异常的示例：\n\n```java\npublic class ExceptionHandlingExample\
  \ {\n    public static void main(String[] args) {\n        try {\n            int\
  \ result = divide(10, 0);\n            System.out.println(\"Result: \" + result);\n\
  \        } catch (ArithmeticException e) {\n            System.out.println(\"Error:\
  \ Division by zero\");\n        }\n    }\n\n    public static int divide(int dividend,\
  \ int divisor) {\n        return dividend / divisor;\n    }\n}\n```\n\n在上面的示例中，`divide()`\
  \ 方法执行两个数字之间的除法。然而，如果除数为 0，它将抛出一个 `ArithmeticException`。在 `main()` 方法中，除法操作被封装在\
  \ `try` 块中，异常被 `catch` 块捕获并处理。如果发生异常，将执行 `catch` 块并显示相应的错误信息。\n\n异常处理允许你优雅地处理错误并在异常发生时提供备选的执行路径。它有助于防止程序因意外错误而突然终止，从而维护程序的稳定性和可靠性。\n\
  \n## 7.2 使用 Try-Catch 块处理异常\n\n在 Java 中，异常处理通过 `try-catch` 块完成。`try` 块用于封装可能抛出异常的代码，而一个或多个\
  \ `catch` 块用于处理被抛出的异常。\n\n`try-catch` 块的语法如下：\n\n```java\ntry {\n    // 可能抛出异常的代码\n\
  } catch (ExceptionType1 exceptionVariable1) {\n    // 处理 ExceptionType1 的代码\n} catch\
  \ (ExceptionType2 exceptionVariable2) {\n    // 处理 ExceptionType2 的代码\n} catch (ExceptionType3\
  \ exceptionVariable3) {\n    // 处理 ExceptionType3 的代码\n}\n```\n\n以下是使用 `try-catch`\
  \ 块处理异常的示例：\n\n```java\npublic class ExceptionHandlingExample {\n    public static\
  \ void main(String[] args) {\n        try {\n            int result = divide(10,\
  \ 0);\n            System.out.println(\"Result: \" + result);\n        } catch (ArithmeticException\
  \ e) {\n            System.out.println(\"Error: Division by zero\");\n        }\n\
  \    }\n\n    public static int divide(int dividend, int divisor) {\n        return\
  \ dividend / divisor;\n    }\n}\n```\n\n在上面的示例中，`try` 块中的代码尝试执行除法操作。如果除数为 0，它将抛出一个\
  \ `ArithmeticException`。带有 `ArithmeticException` 参数的 `catch` 块用于捕获并处理此异常。在 `catch`\
  \ 块内部，会显示相应的错误信息。\n\n如果 `try` 块内部发生异常，程序流将立即跳转到对应的 `catch` 块。只有与抛出的异常类型匹配的 `catch`\
  \ 块会被执行。如果没有 `catch` 块匹配该异常类型，异常将沿着调用栈向上传播，直到被捕获或程序终止。\n\n你可以拥有多个 `catch` 块来处理 `try`\
  \ 块中可能抛出的不同类型的异常。`catch` 块按照从上下的顺序进行评估，并执行第一个匹配的 `catch` 块。\n\n你还可以使用 `Exception`\
  \ 类创建一个不指定特定异常类型的 `catch` 块。该 `catch` 块将捕获任何未被之前的 `catch` 块捕获的异常。\n\n```java\ntry\
  \ {\n    // 可能抛出异常的代码\n} catch (ExceptionType1 exceptionVariable1) {\n    // 处理\
  \ ExceptionType1 的代码\n} catch (ExceptionType2 exceptionVariable2) {\n    // 处理 ExceptionType2\
  \ 的代码\n} catch (Exception exceptionVariable) {\n    // 处理任何其他异常\n}\n```\n\n使用 `try-catch`\
  \ 块进行异常处理允许你处理并从异常恢复恢复防止程序突然终止。它提供了一种处理异常情况的结构化方法，有助于维护代码的稳定性和可靠性。\n\n## 7.3 多个\
  \ Catch 块\n\n在 Java 中，你可以拥有多个 `catch` 块来处理 `try` 块中可能抛出的不同类型的异常。这允许你根据异常的性质所需的行为为每种异常提供特定的处理。\n\
  \n多个 `catch` 块的语法如下：\n\n```java\ntry {\n    // 可能抛出异常的代码\n} catch (ExceptionType1\
  \ exceptionVariable1) {\n    // 处理 ExceptionType1 的代码\n} catch (ExceptionType2 exceptionVariable2)\
  \ {\n    // 处理 ExceptionType2 的代码\n} catch (ExceptionType3 exceptionVariable3) {\n\
  \    // 处理 ExceptionType3 的代码\n}\n```\n\n以下是多个 `catch` 块的示例：\n\n```java\npublic\
  \ class ExceptionHandlingExample {\n    public static void main(String[] args) {\n\
  \        try {\n            int[] numbers = {1, 2, 3};\n            System.out.println(numbers[5]);\n\
  \        } catch (ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"\
  Error: Array index out of bounds\");\n        } catch (NullPointerException e) {\n\
  \            System.out.println(\"Error: Null pointer exception\");\n        }\n\
  \    }\n}\n```\n\n在上面的示例中，`try` 块中的代码尝试访问数组中索引为 5 的元素。由于数组长度为 3，它将抛出一个 `ArrayIndexOutOfBoundsException`。带有\
  \ `ArrayIndexOutOfBoundsException` 参数的 `catch` 块用于捕获并处理此异常。\n\n如果 `try` 块中的代码抛出的是\
  \ `NullPointerException`，则带有 `NullPointerException` 参数的 `catch` 块将执行。\n\n`catch`\
  \ 块按照从上下的顺序进行评估。第一个与抛出的异常类型匹配的 `catch` 块将执行，后续的 `catch` 块将被跳过。\n\n正确排序 `catch` 块是非常重要的。如果将父类异常的\
  \ `catch` 块放在子类异常的 `catch` 块之前，则父类异常的 `catch` 块将始终执行，子类异常的 `catch` 块将永远无法到达。\n\n\
  你还可以使用 `Exception` 类创建一个不指定特定异常类型的 `catch` 块。该 `catch` 块将捕获任何未被之前的 `catch` 块捕获的异常。\n\
  \n```java\ntry {\n    // 可能抛出异常的代码\n} catch (ExceptionType1 exceptionVariable1)\
  \ {\n    // 处理 ExceptionType1 的代码\n} catch (ExceptionType2 exceptionVariable2) {\n\
  \    // 处理 ExceptionType2 的代码\n} catch (Exception exceptionVariable) {\n    // 处理任何其他异常\n\
  }\n```\n\n\n\n使用多个 `catch` 块允许你对不同类型的异常进行单独处理，并提供适当的错误处理或恢复机制。它通过处理特定的异常及其相应的场景，有助于创建更健壮、更可靠的代码。\n\
  \n## 7.4 抛出自定义异常\n\n在 Java 中，你可以定义并抛出自定义异常，以处理内置异常类未涵盖的特定异常情况。当你需要区分不同类型的异常，或者想要提供更具体的错误信息时，自定义异常非常有用。\n\
  \n要创建一个自定义异常，你需要定义一个继承自 `Exception` 类或其某个子类的类。通常，你会创建一个 `Exception` 类的子类，因为它提供了异常所需的\
  \ set 功能。\n\n这里是一个自定义异常类的示例：\n\n```java\npublic class CustomException extends Exception\
  \ {\n    public CustomException(String message) {\n        super(message);\n   \
  \ }\n}\n```\n\n在上面的示例中，`CustomException` 类继承了 `Exception` 类。它有一个构造函数，接收一个 `String`\
  \ 参数作为异常消息。`super(message)` 语句调用了 `Exception` 类的构造函数并传递该消息。\n\n你可以使用 `throw` 关键字后跟自定义异常类的实例来抛出自定义异常。\n\
  \n这里是一个抛出自定义异常的示例：\n\n```java\npublic class ExceptionHandlingExample {\n    public\
  \ static void main(String[] args) {\n        try {\n            throwCustomException();\n\
  \        } catch (CustomException e) {\n            System.out.println(\"Caught\
  \ custom exception: \" + e.getMessage());\n        }\n    }\n\n    public static\
  \ void throwCustomException() throws CustomException {\n        throw new CustomException(\"\
  This is a custom exception\");\n    }\n}\n```\n\n在上面的示例中，`throwCustomException()`\
  \ 方法使用 `throw` 关键字抛出了 `CustomException` 类的实例。`main()` 方法在 `try` 块中调用该方法，并在 `catch`\
  \ 块中捕获了抛出的 `CustomException`。然后显示自定义异常的错误消息。\n\n在创建自定义异常时，你可以根据需要添加额外的方法或字段以提供更多信息或功能。自定义异常允许你以更有意义的方式处理特定的异常情况，并为错误处理过程提供更多上下文。\n\
  \n需要注意的是，自定义异常应该在需要时使用，而不应过度使用。它们应该用于处理特定于你的应用程序且需要特殊处理的异常情况。对于常见的异常，通常优于使用 Java\
  \ 提供的内置异常类。\n\n## 7.5 Finally 块和资源管理\n\n在 Java 中，`finally` 块用于指定一段无论是否发生异常都将执行的代码。`finally`\
  \ 块通常用于执行清理或资源管理任务，例如关闭文件、释放数据库连接或空释放系统资源。\n\n`try-finally` 块的语法如下：\n\n```java\n\
  try {\n    // 可能会抛出异常的代码\n} finally {\n    // 始终会被执行的代码\n}\n```\n\n这里是一个使用 `finally`\
  \ 块进行资源管理的示例：\n\n```java\nimport java.io.*;\n\npublic class ExceptionHandlingExample\
  \ {\n    public static void main(String[] args) {\n        BufferedReader reader\
  \ = null;\n        try {\n            reader = new BufferedReader(new FileReader(\"\
  file.txt\"));\n            String line = reader.readLine();\n            System.out.println(\"\
  Read line: \" + line);\n        } catch (IOException e) {\n            System.out.println(\"\
  Error reading file: \" + e.getMessage());\n        } finally {\n            try\
  \ {\n                if (reader != null) {\n                    reader.close();\n\
  \                }\n            } catch (IOException e) {\n                System.out.println(\"\
  Error closing file: \" + e.getMessage());\n            }\n        }\n    }\n}\n\
  ```\n\n在上面的示例中，创建了一个 `BufferedReader` 来从文件中读取。`try` 块尝试从文件中读取一行并显示它。如果发生 `IOException`，`catch`\
  \ 块将处理它并显示错误消息。\n\n`finally` 块用于确保无论是否发生异常，`BufferedReader` 总是被关闭。在 `finally` 块中对\
  \ `BufferedReader` 对象调用 `close()` 方法以释放与其相关的任何系统资源。如果在关闭文件时发生异常，异常将在 `finally` 块内部的\
  \ `catch` 块中被捕获处理。\n\n`finally` 块在 `try` 块完成后执行，无论是否抛出或捕获了异常。它确保了指定的清理或资源管理任务始终会被执行。\n\
  \n使用 `finally` 块进行资源管理对于防止资源泄漏和确保系统资源的有效利用非常重要。它有助于在即使存在异常的情况下通过妥善处理资源来维护程序的稳定性和可靠性。\n\
  \n值得注意的是，在 Java 7 及更高版本中，你可以使用 `try-with-resources` 语句自动管理和关闭资源，而不需要显式的 `finally`\
  \ 块。只要资源实现了 `AutoCloseable` 接口，`try-with-resources` 语句就会自动关闭它们。这简化了资源管理过程并减少了资源泄漏的概率。\n\
  \n# 第 8 章：文件输入/输出\n\n## 8.1 操作文件和目录\n\n在 Java 中，`java.io` 包提供了用于处理文件和目录的类和方法。文件输入/输出（I/O）操作允许从文件中读取数据、向文件中写入数据、创建目录等。要处理文件和目录，你通常使用\
  \ `File` 类。`File` 类代表文件系统中的文件或目录。它提供了对文件和目录的操作，例如创建文件。以下是 `File` 类的一些常用方法：\n\n-\
  \ `exists()`：检查文件或目录是否存在。\n- `isFile()`：检查 `File` 对象是否为文件。\n- `isDirectory()`：检查\
  \ `File` 对象是否为目录。\n- `getName()`：返回文件或目录的名字。\n- `getPath()`：返回文件或目录的路径。\n- `createNewFile()`：创建一个新文件。\n\
  - `mkdir()`：创建一个新目录。\n- `delete()`：删除文件或目录。\n\n这里是一个操作文件和目录的示例：\n\n```java\nimport\
  \ java.io.File;\nimport java.io.IOException;\n\npublic class FileIOExample {\n \
  \   public static void main(String[] args) {\n        File file = new File(\"example.txt\"\
  );\n        // 检查文件是否存在\n        if (file.exists()) {\n            System.out.println(\"\
  文件存在\");\n        } else {\n            System.out.println(\"文件不存在\");\n       \
  \     try {\n                // 创建新文件\n                boolean created = file.createNewFile();\n\
  \                if (created) {\n                    System.out.println(\"文件已创建\"\
  );\n                } else {\n                    System.out.println(\"创建文件失败\"\
  );\n                }\n            } catch (IOException e) {\n                System.out.println(\"\
  创建文件出错: \" + e.getMessage());\n            }\n        }\n\n        // 检查是否为文件\n\
  \        if (file.isFile()) {\n            System.out.println(\"这是一个文件\");\n   \
  \     } else {\n            System.out.println(\"这不是一个文件\");\n        }\n\n    \
  \    // 获取名称和路径\n        System.out.println(\"名称: \" + file.getName());\n      \
  \  System.out.println(\"路径: \" + file.getPath());\n\n        // 删除文件\n        boolean\
  \ deleted = file.delete();\n        if (deleted) {\n            System.out.println(\"\
  文件已删除\");\n        } else {\n            System.out.println(\"删除文件失败\");\n     \
  \   }\n    }\n}\n```\n\n在上面的示例中，创建了一个名为 `\"example.txt\"` 的 `File` 对象。使用 `exists()`\
  \ 方法检查文件是否存在。如果不存在，则调用 `createNewFile()` 方法创建一个新文件。使用 `isFile()` 方法检查 `File` 对象是否为文件。`getName()`\
  \ 和 `getPath()` 方法用于获取文件的名称和路径。最后，调用 `delete()` 方法删除该文件。\n\n\n\n\n对文件和目录的操作允许你向文件读写数据、在目录中组织和管理数据，并执行各种文件相关的操作。它是文件输入输出（I/O）的一个重要方面，经常用于涉及文件处理的应用程序。\n\
  \n## 8.2 读取和写入文本文件\n\n在 Java 中，你可以使用 `java.io` 包来读取和写入文本文件。文本文件输入输出（I/O）操作允许你从文件中读取文本并将文本写入文件。这对于读取配置文件、处理日志文件或以人类可读的格式存储数据等任务非常有用。\n\
  \n要从文件中读取文本，你可以使用 `BufferedReader` 类，它提供了从字符输入流读取文本的方法。要向文件中写入文本，可以使用 `BufferedWriter`\
  \ 类，它提供了向字符输出流写入文本的方法。\n\n以下是一个读取和写入文本文件的示例：\n\n```java\nimport java.io.BufferedReader;\n\
  import java.io.BufferedWriter;\nimport java.io.FileReader;\nimport java.io.FileWriter;\n\
  import java.io.IOException;\n\npublic class TextFileIOExample {\n    public static\
  \ void main(String[] args) {\n        String fileName = \"example.txt\";\n     \
  \   // 将文本写入文件\n        try (BufferedWriter writer = new BufferedWriter(new FileWriter(fileName)))\
  \ {\n            writer.write(\"Hello, World!\");\n            writer.newLine();\n\
  \            writer.write(\"This is a text file.\");\n        } catch (IOException\
  \ e) {\n            System.out.println(\"Error writing to file: \" + e.getMessage());\n\
  \        }\n        // 从文件中读取文本\n        try (BufferedReader reader = new BufferedReader(new\
  \ FileReader(fileName))) {\n            String line;\n            while ((line =\
  \ reader.readLine()) != null) {\n                System.out.println(line);\n   \
  \         }\n        } catch (IOException e) {\n            System.out.println(\"\
  Error reading file: \" + e.getMessage());\n        }\n    }\n}\n```\n\n在上面的示例中，创建了一个名为\
  \ `\"example.txt\"` 的文本文件，并使用 `BufferedWriter` 向其写入了文本。`write()` 方法用于将文本写入文件，`newLine()`\
  \ 方法用于插入新行。在 fact `try-with-resources` 语句后，`BufferedWriter` 在 try 块结束后会被自动关闭。\n\n\
  要从文件中读取文本，使用了 `BufferedReader`。`readLine()` 方法用于从文件中读取一行文本。同样，在使用 `try-with-resources`\
  \ 语句后，`BufferedReader` 在 try 块结束后也会自动关闭。\n\n通过使用 `BufferedReader` 和 `BufferedWriter`，你可以高效地读写文本文件。这些类提供了缓冲功能，通过减少磁盘\
  \ I/O 操作次数提高性能。\n\n在读取或写入文件时，处理异常是非常重要的。在上面的示例中，捕获了 `IOException` 并显示了错误信息。适当的异常处理可以确保任何错误都能被优雅地处理，并防止程序在发生文件\
  \ I/O 错误时崩溃或出现不可预测的行为。\n\n读取和写入文本文件是 Java 编程中的常见任务，理解如何执行这些操作对于处理基于文件的数据至关重要。\n\n\
  ## 8.3 对象序列化\n\n在 Java 中，对象序列化允许将对象转换为字节流，字节流可以写入文件或通过网络发送。这个过程被称为序列化。序列化的对象稍后可以反序列化，即将字节流转换回对象。\n\
  \n要序列化一个对象，该对象的类必须实现 `Serializable` 接口。`Serializable` 接口是一个标记接口，这意味着它没有需要实现的方法。它仅仅表示该类是可以被序列化的。\n\
  \n以下是一个序列化和反序列化对象的示例：\n\n```java\nimport java.io.*;\n\npublic class ObjectSerializationExample\
  \ {\n    public static void main(String[] args) {\n        String fileName = \"\
  object.ser\";\n        // 序列化对象\n        try (ObjectOutputStream outputStream =\
  \ new ObjectOutputStream(new FileOutputStream(fileName))) {\n            Person\
  \ person = new Person(\"John\", 25);\n            outputStream.writeObject(person);\n\
  \            System.out.println(\"Object serialized\");\n        } catch (IOException\
  \ e) {\n            System.out.println(\"Error serializing object: \" + e.getMessage());\n\
  \        }\n        // 反序列化对象\n        try (ObjectInputStream inputStream = new\
  \ ObjectInputStream(new FileInputStream(fileName))) {\n            Person person\
  \ = (Person) inputStream.readObject();\n            System.out.println(\"Object\
  \ deserialized: \" + person);\n        } catch (IOException | ClassNotFoundException\
  \ e) {\n            System.out.println(\"Error deserializing object: \" + e.getMessage());\n\
  \        }\n    }\n}\n\nclass Person implements Serializable {\n    private String\
  \ name;\n    private int age;\n\n    public Person(String name, int age) {\n   \
  \     this.name = name;\n        this.age = age;\n    }\n\n    @Override\n    public\
  \ String toString() {\n        return \"Person{name='\" + name + \"', age=\" + age\
  \ + '}';\n    }\n}\n```\n\n在上面的示例中，`Person` 类实现了 `Serializable`。创建了一个 `Person` 对象并使用\
  \ `ObjectOutputStream` 进行序列化。`writeObject()` 方法用于写入对象。反序列化对象时使用了 `ObjectInputStream`。`readObject()`\
  \ 方法被强制转换为 `Person`。如果对象的类结构自序列化发生了变化，可能会抛出 `ClassNotFoundException`。\n\n序列化对于保存和加载应用程序状态、通过网络发送对象或缓存对象等任务非常有用。需要注意的是，并不是所有对象都可以序列化。无法序列化的对象包括包含不可序列字段的对象的对象实现\
  \ `Serializable` 的对象。在序列化对象时，还需要考虑安全性，并确保敏感信息不会存储在序列化数据中。\n\n## 8.4 读取和写入二进制文件\n\
  \n除了读取和写入文本文件，Java 还允许你读取和写入二进制文件。二进制文件包含人类不可读的格式的数据，例如图像、音频文件或序列化对象。读写二进制文件需要处理字节流而不是字符流。\n\
  \n要从文件中读取二进制数据，你可以使用 `FileInputStream` 类，它提供了从输入流读取字节的方法。要向文件中写入二进制数据，可以使用 `FileOutputStream`\
  \ 类，它提供了向输出流写入字节的方法。\n\n以下是一个读取和写入二进制文件的示例：\n\n```java\nimport java.io.FileInputStream;\n\
  import java.io.FileOutputStream;\nimport java.io.IOException;\n\npublic class BinaryFileIOExample\
  \ {\n    public static void main(String[] args) {\n        String inputFile = \"\
  input.bin\";\n        String outputFile = \"output.bin\";\n        // 将二进制数据写入文件\n\
  \        try (FileOutputStream outputStream = new FileOutputStream(outputFile))\
  \ {\n            byte[] data = {0x48, 0x65, 0x6C, 0x6C, 0x6F, 0x2C, 0x20, 0x57,\
  \ 0x6F, 0x72, 0x6C, 0x64, 0x21};\n            outputStream.write(data);\n      \
  \      System.out.println(\"Binary data written to file\");\n        } catch (IOException\
  \ e) {\n            System.out.println(\"Error writing to file: \" + e.getMessage());\n\
  \        }\n        // 从文件中读取二进制数据\n        try (FileInputStream inputStream = new\
  \ FileInputStream(inputFile)) {\n            int bytesRead;\n            byte[]\
  \ buffer = new byte[1024];\n            while ((bytesRead = inputStream.read(buffer))\
  \ != -1) {\n                for (int i = 0; i < bytesRead; i++) {\n            \
  \        System.out.print(buffer[i] + \" \");\n                }\n            }\n\
  \        } catch (IOException e) {\n            System.out.println(\"Error reading\
  \ file: \" + e.getMessage());\n        }\n    }\n}\n```\n\n\n\n要从文件中读取二进制数据，可以使用\
  \ `FileInputStream`。`read()` 方法用于从文件中读取字节并到字节数组中。该方法返回读取的字节数，如果到达文件末尾，则返回 -1。循环会打印从文件中读取的字节。\n\
  \n在处理二进制文件时，仔细处理数据并确保你正在读取和写入正确类型和大小的数据至关重要。处理不当二进制数据可能会导致数据损坏或对数据的解释错误。\n\n二进制文件\
  \ I/O 通常用于诸如读取和写入图像、音频文件或其他二进制数据的任务。它允许你处理数据的原始字节，并为处理不同类型的二进制数据提供了灵活性。\n\n## 8.5\
  \ 文件处理最佳实践\n\n在 Java 中处理文件时，遵循一些最佳实践以确保高效且可靠的文件处理非常重要。以下是一些需要记住的最佳实践：\n\n1. **使用\
  \ try-with-resources**：在处理文件流或读取器/写入器时，始终使用 `try-with-resources` 语句。这确保了资源在使用后会自动关闭，即使发生异常也是如此。例如：\n\
  \n```java\ntry (FileInputStream inputStream = new FileInputStream(\"file.txt\"))\
  \ {\n    // 从文件中读取的代码\n} catch (IOException e) {\n    // 异常处理\n}\n```\n\n2. **检查文件是否存在**：在对文件执行任何操作之前，使用\
  \ `File` 类的 `exists()` 方法检查文件是否存在。这有助于防止在尝试读取或写入不存在的文件时发生错误。\n\n3. **使用绝对文件路径**：在处理文件时，使用绝对路径通常比相对路径更安全。这确保了无论当前工作目录如何，始终从正确的位置访问文件。\n\
  \n4. **处理异常**：在从文件或写入文件时，务必正确处理异常。这包括捕获并处理特定异常、显示有意义的错误信息，并根据特定情况采取适当行动。\n\n5. **使用缓冲流**：在读取或写入大量数据时，使用缓冲流（例如\
  \ `BufferedReader` 或 `BufferedWriter`）。缓冲流通过减少磁盘 I/O 操作的频率来提高性能。\n\n6. **显式关闭资源**：虽然\
  \ `try-with-resources` 会自动关闭资源，但在完成资源使用后显式关闭它们仍然是一个良好的习惯。这有助于确保资源被及时释放并防止资源泄漏。\n\
  \n7. **使用适当的字符编码**：在处理文本文件时，在读取或写入文件时指定适当的字符编码。这确保了文本被正确编码并避免了字符编码不匹配的问题。\n\n8.\
  \ **检查权限**：在尝试从文件或写入文件之前，使用 `File` 类的 `canRead()` 和 `canWrite()` 方法检查文件的权限。这有助于防止错误并确保可用所需的权限。\n\
  \n9. **谨慎使用相对文件路径**：如果你需要使用相对路径，请注意当前的工作目录，并确保可以从该位置访问文件。避免假设特定的工作目录以使你的代码更具移植性。\n\
  \n10. **清理未使用的文件**：当你完成对文件的操作后，请确保删除或清理任何未使用的文件，以释放磁盘空间并避免混乱。使用 `File` 类的 `delete()`\
  \ 方法删除文件。\n\n# 第 9 章：与数据库交互\n\n## 9.1 数据库引言\n\n数据库是许多软件系统的关键组件。它们提供了一种结构化的方式来存储、管理和检索数据。在\
  \ Java 中，你可以使用 Java 数据库连接 (JDBC) API 与数据库交互。\n\n数据库是以特定方式组织和结构化的相关数据的集合。它由表格（存储实际数据）以及这些表格之间的关系组成。数据库管理系统\
  \ (DBMS) 用于管理数据库并提供数据存储、检索和查询等功能。\n\n有不同类型的数据库，例如关系型数据库（如 MySQL, Oracle）、NoSQL 数据库（如\
  \ MongoDB, Cassandra）和内存数据库（如 Apache Ignite, Redis）。关系型数据库是最广泛使用的类型，使用结构化查询语言 (SQL)\
  \ 与数据交互。\n\n在 Java 中与数据库交互，你需要使用 JDBC 建立与数据库的连接。JDBC 提供了一系列类和接口，允许你执行 SQL 语句、检索和操作数据，以及处理数据库事务。\n\
  \n这是一个使用 JDBC 连接到数据库的示例：\n\n```java\nimport java.sql.*;\n\npublic class DatabaseExample\
  \ {\n    public static void main(String[] args) {\n        String url = \"jdbc:mysql://localhost:3306/mydatabase\"\
  ;\n        String username = \"root\";\n        String password = \"password\";\n\
  \        try (Connection connection = DriverManager.getConnection(url, username,\
  \ password)) {\n            System.out.println(\"连接到数据库\");\n            // 执行数据库操作\n\
  \        } catch (SQLException e) {\n            System.out.println(\"连接数据库出错：\"\
  \ + e.getMessage());\n        }\n    }\n}\n```\n\n在上面的示例中，使用 `DriverManager.getConnection()`\
  \ 方法建立了到 MySQL 数据库的连接。URL 指定了数据库位置，用户名和密码用于身份验证。`getConnection()` 方法返回一个 `Connection`\
  \ 对象，该对象代表与数据库的连接。\n\n一旦建立连接，你就可以执行各种数据库操作，例如执行 SQL 语句、检索和更新数据以及管理事务。这些操作是通过从 `Connection`\
  \ 对象获取 `Statement` 和 `PreparedStatement` 对象完成的。\n\n理解如何与数据库交互对于构建健壮且数据驱动的应用程序至关重要。JDBC\
  \ 提供了一种强大且灵活的方式。\n\n## 9.2 连接数据库\n\n在 Java 中连接数据库需要使用 JDBC API。JDBC 通过一组通类和接口与不同的数据库交互。连接数据库的步骤包括加载\
  \ JDBC 驱动程序、建立连接以及处理可能发生的异常。\n\n这是一个使用 JDBC 连接到 MySQL 数据库的示例：\n\n```java\nimport\
  \ java.sql.*;\n\npublic class DatabaseConnectionExample {\n    public static void\
  \ main(String[] args) {\n        String url = \"jdbc:mysql://localhost:3306/mydatabase\"\
  ;\n        String username = \"root\";\n        String password = \"password\";\n\
  \        try {\n            // 加载 JDBC 驱动\n            Class.forName(\"com.mysql.cj.jdbc.Driver\"\
  );\n            // 建立连接\n            Connection connection = DriverManager.getConnection(url,\
  \ username, password);\n            System.out.println(\"连接到数据库\");\n          \
  \  // 执行数据库操作\n            // 关闭连接\n            connection.close();\n          \
  \  System.out.println(\"连接已关闭\");\n        } catch (ClassNotFoundException e) {\n\
  \            System.out.println(\"未找到 JDBC 驱动\");\n        } catch (SQLException\
  \ e) {\n            System.out.println(\"连接数据库出错：\" + e.getMessage());\n       \
  \ }\n    }\n}\n```\n\n\n\n\n处理连接过程中可能发生的异常非常重要。在示例中，如果找不到 JDBC 驱动，将捕获 `ClassNotFoundException`；如果在连接数据库时发生错误，将捕获\
  \ `SQLException`。\n\n在执行必要的数据库操作后，应使用 `Connection` 对象的 `close()` 方法关闭连接。关闭连接会释放与其相关的任何资源并确保妥善清理。\n\
  \n不同的数据库对连接 URL 和身份验证可能有特定的要求。请务必参考你正在使用的特定数据库和 JDBC 驱动的文档以进行正确的配置。\n\n连接到数据库是 Java\
  \ 中处理数据库的第一步。一旦建立连接，你就可以执行各种操作，例如执行 SQL 语句、检索和更新数据以及管理事务。\n\n## 9.3 执行 SQL 查询\n\n\
  在使用 JDBC 建立数据库连接后，你可以执行 SQL 查询来检索和操作数据。JDBC 提供了不同类型的语句来执行 SQL 查询，例如 `Statement`、`PreparedStatement`\
  \ 和 `CallableStatement`。这些语句允许你执行 SQL 语句并获取结果。\n\n以下是一个使用 JDBC 执行简单 SELECT 查询的示例：\n\
  \n```java\nimport java.sql.*;\n\npublic class ExecuteQueryExample {\n    public\
  \ static void main(String[] args) {\n        String url = \"jdbc:mysql://localhost:3306/mydatabase\"\
  ;\n        String username = \"root\";\n        String password = \"password\";\n\
  \        try (Connection connection = DriverManager.getConnection(url, username,\
  \ password)) {\n            System.out.println(\"Connected to the database\");\n\
  \            // Create a statement\n            Statement statement = connection.createStatement();\n\
  \            // Execute the query\n            String query = \"SELECT * FROM customers\"\
  ;\n            ResultSet resultSet = statement.executeQuery(query);\n          \
  \  // Process the results\n            while (resultSet.next()) {\n            \
  \    int id = resultSet.getInt(\"id\");\n                String name = resultSet.getString(\"\
  name\");\n                String email = resultSet.getString(\"email\");\n     \
  \           System.out.println(\"ID: \" + id);\n                System.out.println(\"\
  Name: \" + name);\n                System.out.println(\"Email: \" + email);\n  \
  \              System.out.println(\"--------------------\");\n            }\n  \
  \          // Close the result set, statement, and connection\n            resultSet.close();\n\
  \            statement.close();\n            connection.close();\n        } catch\
  \ (SQLException e) {\n            System.out.println(\"Error executing query: \"\
  \ + e.getMessage());\n        }\n    }\n}\n```\n\n在上述示例中，使用 `Connection` 对象的 `createStatement()`\
  \ 方法创建了一个 `Statement` 对象。然后使用 `Statement` 对象的 `executeQuery()` 方法来执行 SELECT 查询。查询结果以\
  \ `ResultSet` 对象的形式返回。\n\n为了处理结果，你可以使用 `ResultSet` 对象的 `next()` 方法移动到下一行。使用 `getInt()`、`getString()`\
  \ 以及其他 getter 方法根据列名或索引从当前行检索值。\n\n在处理结果后，务必关闭 `ResultSet`、`Statement` 和 `Connection`\
  \ 对象，以释放任何资源并确保妥善清理。\n\n值得注意的是，JDBC 支持使用 `PreparedStatement` 进行参数化查询。参数化查询允许你使用带有动态值占位符的\
  \ SQL 语句执行执行，这有助于防止 SQL 注入攻击，并在当使用不同值多次执行同一查询时提高性能。\n\n执行 SQL 查询是 Java 中处理数据库的一项基础操作。JDBC\
  \ 提供了一种灵活且高效的方式来执行查询并从数据库中检索数据。\n\n## 9.4 检索和操作数据\n\n一旦你执行了 SQL 查询并使用 JDBC 获取了结果集，就可以根据需要检索和操作数据。JDBC\
  \ 提供了多种处理结果集的方法和技术，包括检索值、更新数据以及在结果集中导航。\n\n以下是你可以对结果集执行的一些常见操作：\n\n1. **检索值**：你可以使用\
  \ `ResultSet` 对象的 getter 方法从结果集中检索值。例如，`getInt()`、`getString()`、`getDouble()` 等。你可以通过列名或列索引来检索值。\n\
  2. **在结果集中导航**：`ResultSet` 对象维护一个指向当前行的游标。你可以使用 `next()`、`previous()`、`first()`、`last()`、`absolute()`、`relative()`\
  \ 等方法来移动游标并导航结果集。\n3. **更新数据**：如果结果集是可更新的，你可以使用 setter 方法修改数据，例如 `updateInt()`、`updateString()`、`updateDouble()`\
  \ 等。在做出更改后，你可以调用 `updateRow()` 方法更新数据库。\n4. **插入数据**：你可以使用 `INSERT INTO` SQL 语句向表中插入新行。你可以使用\
  \ `VALUES` 子句提供值，或者使用子查询从另一个结果集中检索值。\n5. **删除数据**：你可以使用 `DELETE FROM` SQL 语句根据特定条件从表中删除行。例如，`DELETE\
  \ FROM customers WHERE id = 1` 将删除 `id` 等于 1 的行。\n\n以下是一个演示其中一些操作的示例：\n\n```java\n\
  import java.sql.*;\n\npublic class ManipulateDataExample {\n    public static void\
  \ main(String[] args) {\n        String url = \"jdbc:mysql://localhost:3306/mydatabase\"\
  ;\n        String username = \"root\";\n        String password = \"password\";\n\
  \        try (Connection connection = DriverManager.getConnection(url, username,\
  \ password)) {\n            System.out.println(\"Connected to the database\");\n\
  \            // Create a statement\n            Statement statement = connection.createStatement();\n\
  \            // Execute the query\n            String query = \"SELECT * FROM customers\"\
  ;\n            ResultSet resultSet = statement.executeQuery(query);\n          \
  \  // Process the results\n            while (resultSet.next()) {\n            \
  \    int id = resultSet.getInt(\"id\");\n                String name = resultSet.getString(\"\
  name\");\n                String email = resultSet.getString(\"email\");\n     \
  \           System.out.println(\"ID: \" + id);\n                System.out.println(\"\
  Name: \" + name);\n                System.out.println(\"Email: \" + email);\n  \
  \              System.out.println(\"--------------------\");\n            }\n  \
  \          // Close the result set, statement, and connection\n            resultSet.close();\n\
  \            statement.close();\n            connection.close();\n        } catch\
  \ (SQLException e) {\n            System.out.println(\"Error executing query: \"\
  \ + e.getMessage());\n        }\n    }\n}\n```\n*(注：由于提供的待翻译文本中 9.4 的示例代码块似乎重复了\
