  \ Python 中的文件处理。\n\n# 第 7 章：面向对象编程 (OOP)\n\n## 7.1 OOP 简介\n面向对象编程（OOP）是一种专注于创建对象（类的实例）的编程范式，允许将代码组织成可重用的模块化结构。OOP\
  \ 提供了一种基于真实世界对象及其交互来构建和设计程序的方法。\n\n让我们进入 OOP 的核心概念：\n\n1. **类 (Class)**：类是创建对象的蓝图或模板。它定义了类对象将拥有的属性（数据）和行为（方法）。例如，`Car`\
  \ 类可以有颜色、型号和速度等属性，以及 `accelerate`（加速）和 `brake`（刹车）等方法。\n2. **对象 (Object)**：对象是类的实例。它代表基于类定义的特定实体，拥有自己的一组属性值。例如，`Car`\
  \ 类的对象可能颜色为“红色”，型号为“轿车”，速度为 50 km/h。\n3. **封装 (Encapsulation)**：封装是将数据（属性）和方法（行为）封装在类中的过程。它允许数据隐藏和抽象，使对象的内部细节对外部世界隐藏。通过使用公共（public）、私有（private）和保护（protected）等访问修饰符控制对对象属性和方法的访问。\n\
  4. **继承 (Inheritance)**：继承机制允许类继承另一个类（称为父类）的属性和方法。\n5. **多态 (Polymorphism)**：多态是允许对象以不同的形式表现的能力。它允许不同的类对相同的调用执行不同的操作。\n\
  6. **抽象 (Abstraction)**：抽象是将复杂的系统拆分为更易于管理的组件的过程，隐藏不必要的细节。\n\n## 7.2 类与对象\n在 Python\
  \ 中，类是创建对象的蓝图或模板，而对象是类的实例。类提供了定义属性和方法的方法。让我们探索如何定义类和对象：\n\n1. **类定义**：使用 `class`\
  \ 关键字后跟类名来定义类。例如：\n```python\nclass Car:\n    def __init__(self, color, model):\n\
  \        self.color = color\n        self.model = model\n    def accelerate(self):\n\
  \        print(\"汽车正在加速\")\n    def brake(self):\n        print(\"汽车正在刹车\")\n```\n\
  \n2. **创建对象**：使用类名后跟括号来创建对象。\n```python\nmy_car = Car(\"red\", \"Sedan\")\n```\n\
  \n3. **访问属性和方法**：使用点符号（.`）访问对象的属性和方法。例如：\n```python\nprint(my_car.color) # 输出: red\n\
  print(my_car.model) # 输出: Sedan\nmy_car.accelerate() # 输出: 汽车正在加速\nmy_car.brake()\
  \      # 输出: 汽车正在刹车\n```\n\n4. **修改属性**：通过给属性赋值新值来修改对象的属性。例如：\n```python\nmy_car.color\
  \ = \"blue\"\nprint(my_car.color) # 输出: blue\n```\n\n5. **类变量**：类变量在类的实例之间共享。它们定义在类内部、方法外部。可以使用类名或实例访问。例如：\n\
  ```python\nclass Car:\n    wheels = 4  # 类变量\n    def __init__(self, color, model):\n\
  \        self.color = color\n        self.model = model\n\nprint(Car.wheels) # 输出:\
  \ 4\nmy_car = Car(\"red\", \"Sedan\")\nprint(my_car.wheels) # 输出: 4\n```\n\n## 7.3\
  \ 继承与多态\n继承和多态是面向对象编程（OOP）中两个重要的概念，允许代码重用和灵活。让我们探索继承和多态在 Python 中是如何工作的：\n\n1. **继承**：继承是一种允许类继承另一个类（称为父类或基类）的属性和方法的机制。继承父类的类被称为子类或派生类。子类可以添加新的属性和方法，或重写现有的。例如：\n\
  ```python\nclass Vehicle:\n    def __init__(self, color, model):\n        self.color\
  \ = color\n        self.model = model\n    def accelerate(self):\n        print(\"\
  车辆正在加速\")\n\nclass Car(Vehicle):\n    def __init__(self, color, model, num_doors):\n\
  \        super().__init__(color, model)\n        self.num_doors = num_doors\n  \
  \  def accelerate(self):\n        print(\"汽车正在加速\")\n\nmy_car = Car(\"red\", \"\
  Sedan\", 4)\nmy_car.accelerate() # 输出: 汽车正在加速\n```\n\n2. **多态**：多态允许不同类对相同的方法调用有不同的实现。\n\
  \n\n\n\n\n多态是指对象根据其所处的环境呈现不同形式或具有不同行为的能力。它允许不同类的对象被视为共同父类的对象。多态赋予了代码的灵性和扩展性。\n\n\
  示例：\n\n```python\nclass Animal:\n    def speak(self):\n        pass\n\nclass Dog(Animal):\n\
  \    def speak(self):\n        print(\"Woof!\")\n\nclass Cat(Animal):\n    def speak(self):\n\
  \        print(\"Meow!\")\n\ndef make_animal_speak(animal):\n    animal.speak()\n\
  \nmy_dog = Dog()\nmy_cat = Cat()\nmake_animal_speak(my_dog)  # Output: Woof!\nmake_animal_speak(my_cat)\
  \  # Output: Meow!\n```\n\n在上面的示例中，`Dog` 和 `Cat` 类都继承自 `Animal` 类并重写了 `speak` 方法。`make_animal_speak`\
  \ 函数接收一个 `Animal` 对象并调用它的 `speak` 方法。这允许我们把 `Dog` 和 `Cat` 对象传递给函数，并让它们根据 `speak`\
  \ 方法的具体实现表现出不同的行为。\n\n继承和多态是面向对象编程（OOP）的强大特性，促进了代码复用、模块化和灵活性。它们允许创建类层次，并使对象根据其特定的类实现展示不同的行为。\n\
  \n## 7.4 封装与抽象\n\n封装和抽象是面向对象编程（OOP）中的两个重要概念，有助于组织和管理代码复杂度。让我们探索封装和抽象在 Python 中是如何工作的：\n\
  \n### 1. 封装\n封装是将数据（属性）和方法（行为）封装在类内部的过程。它实现了数据隐藏和抽象，使得对象的内部细节对外部世界是隐藏的。通过使用公共（public）、私有（private）和受保护（protected）等访问修饰符来控制对对象属性和方法的访问。\n\
  \n在 Python 中，封装通过命名约定和访问修饰符来实现。根据约定，意图为私有的属性和方法以下划线（`_`）开头。然而，这仅仅是一种约定，仍然可以从类外部访问该属性或方法。\n\
  \n示例：\n\n```python\nclass Employee:\n    def __init__(self, name, salary):\n   \
  \     self._name = name      # 私有属性\n        self._salary = salary  # 私有属性\n\n \
  \   def get_name(self):\n        return self._name  # 私有方法\n\n    def get_salary(self):\n\
  \        return self._salary  # 私有方法\n\nemployee = Employee(\"John Doe\", 5000)\n\
  print(employee.get_name())      # Output: John Doe\nprint(employee.get_salary())\
  \  # Output: 5000\n```\n\n在上面的示例中，`_name` 和 `_salary` 属性意图为私有，但仍然可以在类外部访问。`get_name`\
  \ 和 `get_salary` 方法提供了对这些私有属性的受控访问。\n\n### 2. 抽象\n抽象是将复杂系统分解为更小、更容易管理的组件来简化系统的过程。它涉及识别对象或系统的本质特征并隐藏不必要的细节。抽象允许创建抽象类和接口，它们定义了共同行为，并为子类的实现提供了契。在\
  \ Python 中，抽象通过使用 `abc` 模块中的抽象基类（ABCs）来实现。ABC 定义了子类必须实现的抽象方法。\n\n示例：\n\n```python\n\
  from abc import ABC, abstractmethod\n\nclass Shape(ABC):\n    @abstractmethod\n\
  \    def area(self):\n        pass\n\nclass Rectangle(Shape):\n    def __init__(self,\
  \ width, height):\n        self.width = width\n        self.height = height\n\n\
  \    def area(self):\n        return self.width * self.height\n\nrectangle = Rectangle(5,\
  \ 8)\nprint(rectangle.area())  # Output: 40\n```\n\n在上面的示例中，`Shape` 类是一个抽象基类，它将\
  \ `area` 方法定义为抽象方法。`Rectangle` 类继承自 `Shape` 类并实现了 `area` 方法。这强制任何继承自 `Shape` 的类必须实现\
  \ `area` 方法。\n\n封装和抽象是 OOP 中重要的概念，有助于代码组织、数据隐藏和模块化。它们有助于管理复杂度并创建更具维护性和可重用的代码。理解这些概念对于设计和实现有效的面向对象解决方案至关重要。\n\
  \n## 7.5 OOP 练习\n\n*   **练习 1：银行账户**：创建一个 `BankAccount` 类，包含账号、持有人姓名和余额的属性。包括存款和取款的方法，以及显示当前余额的方法。\n\
