  \ `\"python23\"`。5. 编写一个程序打印到指定项数的斐波纳契数列。斐波纳契数列是每个数字都是前两个数字之和的序列。6. 编写一个程序计算给定数的阶乘。7.\
  \ 编写一个程序打印给定数的乘法表。8. 编写一个程序找到 1 到 100 之间所有被 7 整除的数字的和。9. 编写一个程序检查给定字符串是否为回文。回文是指正反读相同的单词、短语、数字或其他字符序列。10.\
  \ 编写一个程序找到 1 到 100 之间的质数。\n\n这些练习将帮助你练习并加强对 Python 条件流的理解。可以探索这些问题的不同方法和解决方案。\n\n\
  是上述上述流练习的解答：\n\n1. 检查数字是正、负还是零的解答：\n\n```python\nnum = float(input(\"输入数字: \"))\n\
  if num > 0:\n    print(\"Positive\")\nelif num < 0:\n    print(\"Negative\")\nelse:\n\
  \    print(\"Zero\")\n```\n\n2. 找到三个数中的最大值的解答：\n\n```python\nnum1 = float(input(\"\
  输入第一个数字: \"))\nnum2 = float(input(\"输入第二个数字: \"))\nnum3 = float(input(\"输入第三个数字:\
  \ \"))\nif num1 >= num2 and num1 >= num3:\n    print(num1)\nelif num2 >= num1 and\
  \ num2 >= num3:\n    print(num2)\nelse:\n    print(num3)\n```\n\n\n\n\n\n```python\n\
  num3 = float(input(\"Enter the third number: \"))\n\nif num1 >= num2 and num1 >=\
  \ num3:\n    largest = num1\nelif num2 >= num1 and num2 >= num3:\n    largest =\
  \ num2\nelse:\n    largest = num3\n\nprint(\"The largest number is:\", largest)\n\
  ```\n\n### 3. 打印 1 到 50 之间所有偶数的解决方案：\n\n```python\nfor num in range(2, 51, 2):\n\
  \    print(num)\n```\n\n### 4. 询问密码直到输入正确为止的解决方案：\n\n```python\npassword = input(\"\
  Enter the password: \")\nwhile password != \"python123\":\n    password = input(\"\
  Incorrect password. Try again: \")\nprint(\"Access granted!\")\n```\n\n### 5. 打印指定项数的斐波那契序列的解决方案：\n\
  \n```python\nterms = int(input(\"Enter the number of terms: \"))\nnum1, num2 = 0,\
  \ 1\n\nif terms <= 0:\n    print(\"Invalid input\")\nelif terms == 1:\n    print(num1)\n\
  else:\n    print(num1, num2, end=\" \")\n    for _ in range(2, terms):\n       \
  \ next_num = num1 + num2\n        print(next_num, end=\" \")\n        num1, num2\
  \ = num2, next_num\n```\n\n### 6. 计算给定数字阶乘的解决方案：\n\n```python\nnum = int(input(\"\
  Enter a number: \"))\nfactorial = 1\n\nif num < 0:\n    print(\"Factorial does not\
  \ exist for negative numbers.\")\nelif num == 0:\n    print(\"Factorial of 0 is\
  \ 1.\")\nelse:\n    for i in range(1, num + 1):\n        factorial *= i\nprint(\"\
  Factorial of\", num, \"is\", factorial)\n```\n\n### 7. 打印给定数字乘法表的解决方案：\n\n```python\n\
  num = int(input(\"Enter a number: \"))\nfor i in range(1, 11):\n    print(num, \"\
  x\", i, \"=\", num * i)\n```\n\n### 8. 寻找 1 到 100 之间所有 7 的倍数之和的解决方案：\n\n```python\n\
  total = 0\nfor num in range(1, 101):\n    if num % 7 == 0:\n        total += num\n\
  print(\"The sum is:\", total)\n```\n\n### 9. 检查给定字符串是否为回文的解决方案：\n\n```python\nstring\
  \ = input(\"Enter a string: \")\nif string == string[::-1]:\n    print(\"Palindrome\"\
  )\nelse:\n    print(\"Not a palindrome\")\n```\n\n### 10. 寻找 1 到 100 之间质数的解决方案：\n\
  \n```python\nfor num in range(2, 101):\n    is_prime = True\n    for i in range(2,\
  \ int(num ** 0.5) + 1):\n        if num % i == 0:\n            is_prime = False\n\
  \            break\n    if is_prime:\n        print(num)\n```\n\n这些解决方案将帮助你理解并实现\
  \ Python 中的控制流概念。你可以随意修改它们或探索不同的方法来解决这些练习题。\n\n# 第 4 章：函数\n\n## 4.1 定义和调用函数\n\n\
  函数是编程中至关重要的部分，因为允许你将代码分组为可重用的块并执行特定任务。在 Python 中，你可以使用 `def` 关键字定义自己的函数。让我们探索如何定义和调用函数：\n\
  \n### 1. 定义函数\n\n要定义一个函数，你需要为函数提供一个名称以及一段指定函数应执行的代码。\n\n语法：\n```python\ndef function_name(parameters):\n\
  \    # 代码块\n    # 缩进对于定义函数的范围至关重要\n```\n\n示例：\n```python\ndef greet():\n    print(\"\
  Hello, welcome!\")\n```\n\n### 2. 调用函数\n\n一旦定义了函数，你可以通过其名称后跟括号来调用它。如果函数有参数，你可以在括号内传递值。\n\
  \n语法：\n```python\nfunction_name(arguments)\n```\n\n示例：\n```python\ngreet() # 调用\
  \ greet() 函数\n```\n\n输出：\n```\nHello, welcome!\n```\n\n注意：函数在被调用时执行，程序执行将从上次停止的地方继续。\n\
  \n### 3. 参数和参数\n\n函数可以拥有参数，参数是用于接收函数调用传来的值的变量。在调用函数时，你可以传递参数（arguments），即将赋值给参数的实际值。\n\
  \n示例：\n```python\ndef greet(name):\n    print(\"Hello,\", name)\n\ngreet(\"Alice\"\
  ) # 将 \"Alice\" 作为参数传递给 greet() 函数\n```\n\n输出：\n```\nHello, Alice\n```\n\n注意：参数和参数允许你的函数更具活性和可重用性。\n\
  \n## 4.2 参数和参数\n\n在 Python 函数中，参数用于接收函数调用传来的值，而参数是传递给函数的实际值。理解参数和参数的工作原理对于创建灵活且可重用的函数至关重要。让我们更地探索参数和参数：\n\
  \n### 1. 函数定义中的参数\n\n在定义函数时，你可以在括号内指定参数。这些参数充当传递给函数的值的占位符。\n\n示例：\n```python\ndef\
  \ add_numbers(x, y):\n    sum = x + y\n    print(\"The sum is:\", sum)\n```\n\n\
  ### 2. 调用中的参数\n\n在调用函数时，你可以传递参数，这些是传递给函数的实际值。\n\n示例：\n```python\nadd_numbers(5,\
  \ 10) # 传递 5 和 10 作为参数\n```\n\n输出：\n```\nThe sum is: 15\n```\n\n### 3. 位置参数\n\n\
  默认情况下，参数根据其位置匹配。\n\n示例：\n```python\ndef greet(name, age):\n    print(f\"Hello {name},\
  \ you are {age} years old.\")\n\ngreet(\"Alice\", 25) # 按位置传递\n```\n\n输出：\n```\n\
  Hello Alice, you are 25 years old.\n```\n\n### 4. 关键字参数\n\n你也可以使用关键字来传递参数，这样顺序就不再重要。\n\
  \n示例：\n```python\ndef greet(name, age):\n    print(f\"Hello {name}, you are {age}\
  \ years old.\")\n\ngreet(age=25, name=\"Alice\") # 使用关键字传递\n```\n\n输出：\n```\nHello\
  \ Alice, you are 25 years old.\n```\n\n### 5. 默认参数\n\n你可以在函数定义中指定默认值。如果在调用时没有提供参数，将使用这些默认值。\n\
  \n示例：\n```python\ndef greet(name=\"Guest\"):\n    print(f\"Hello, {name}\")\n\n\
  greet() # 使用默认值\ngreet(\"Alice\") # 使用提供的值\n```\n\n输出：\n```\nHello, Guest!\nHello\
  \ Alice!\n```\n\n## 4.3 从函数返回值\n\n在 Python 中，函数可以使用 `return` 语句返回值。从函数返回值允许执行计算或处理并将结果返回给调用者。让我们探索如何从函数返回值：\n\
  \n### 1. 使用 `return` 语句\n\n要从函数返回值，使用 `return` 关键字后跟你想返回的值或表达式。\n\n示例：\n```python\n\
  def add_numbers(x, y):\n    return x + y\n```\n\n### 2. 调用返回值的函数\n\n当调用返回值的函数时，你可以将返回值存储在变量中供以后使用或直接在表达式中使用。\n\
  \n示例：\n```python\nresult = add_numbers(10, 5)\nprint(\"The result is:\", result)\n\
  ```\n\n输出：\n```\nThe result is: 15\n```\n\n`return` 语句会结束函数的执行并将值返回给调用者。\n\n###\
  \ 3. 返回多个值\n\nPython 函数还可以返回多个值。你可以使用逗号分隔这些值，或者将它们作为集合（如元组或列表）返回。\n\n示例：\n```python\n\
  def divide_numbers(x, y):\n    quotient = x / y\n    remainder = x % y\n    return\
  \ quotient, remainder\n\nq, r = divide_numbers(10, 3)\nprint(\"Quotient:\", q)\n\
  print(\"Remainder:\", r)\n```\n\n输出：\n```\nQuotient: 3.3333333333333335\nRemainder:\
  \ 1\n```\n\n注意：返回多个值时，你可以将它们解包到单独的变量或作为集合使用。\n\n### 4. 返回 `None`\n\n如果函数没有 `return`\
  \ 语句或者 `return` 语句没有值，它将返回 `None`。`None` 表示值的缺失，通常用于指示函数没有有意义的结果。\n\n示例：\n```python\n\
  def greet(name):\n    print(\"Hello,\", name)\n\nresult = greet(\"Alice\")\nprint(\"\
  Result:\", result)\n```\n\n输出：\n```\nHello, Alice\nResult: None\n```\n\n\n\n\n\n\
  你好，Alice\n\n结果：无\n\n注意：未显式返回值的函数将隐式返回 `None`。\n\n从函数返回值允许你封装逻辑和计算，使你的代码更具模块化和可重用。\n\
  \n## 4.4 函数作用域与递归\n\n在 Python 中，函数有自己的作用域，这意味着在函数内部定义的变量只能在该函数内部访问。理解函数作用域对于编写简洁且组织良好的代码非常重要。此外，递归是编程中的一个强大概念，函数调用自己来解决问题。让我们探索函数作用域和递归：\n\
  \n### 1. 函数作用域：\n\n在函数内部定义的变量具有局部作用域，这意味着它们只能在该函数内部访问。\n\n示例：\n```python\ndef my_function():\n\
  \    x = 10\n    print(\"Inside the function:\", x)\n\nmy_function()\nprint(\"Outside\
  \ the function:\", x) # 这将产生错误\n```\n\n输出：\n```\nInside the function: 10\nNameError:\
  \ name 'x' is not defined\n```\n\n注意：定义在任何函数外的变量具有全局作用域，可以在程序的任何地方访问。\n\n### 2.\
  \ 全局变量：\n\n要在函数内部访问全局变量，你可以使用 `global` 关键字来指示该变量是全局的而非局部的。\n\n示例：\n```python\nx\
  \ = 10\ndef my_function():\n    global x\n    x += 5\n    print(\"Inside the function:\"\
  , x)\n\nmy_function()\nprint(\"Outside the function:\", x)\n```\n\n输出：\n```\nInside\
  \ the function: 15\nOutside the function: 15\n```\n\n注意：在函数内部修改全局变量应该小心，因为这可能让你的代码更难理解和调试。\n\
  \n### 3. 递归：\n\n递归是一种函数调用自己来解决问题的技术。递归函数有一个基本情况（base case），规定了函数何时停止调用自己，以及一个递归情况（recursive\
  \ case），定义函数如何调用自己。\n\n示例：\n```python\ndef factorial(n):\n    if n == 0:\n     \
  \   return 1\n    else:\n        return n * factorial(n - 1)\n\nresult = factorial(5)\n\
  print(\"Factorial:\", result)\n```\n\n输出：\n```\nFactorial: 120\n```\n\n注意：递归函数可以是解决可以拆分为更小子问题的优雅优雅解决方案。\n\
  \n## 4.5 函数练习\n\n现在你已经学习了 Python 中的函数，是时候将你的知识付诸实践了。这里有一些练习可以帮助你巩固对函数的理解：\n\n###\
  \ 练习 1：摄氏度转华氏度转换器\n\n编写一个名为 `celsius_to_fahrenheit` 的函数，接受摄氏度作为参数并返回华氏度。摄氏度转为华氏度的公式为：`F\
  \ = (C * 9/5) + 32`。\n\n### 练习 2：三数最大值\n\n编写一个名为 `max_of_three` 的函数，接受三个数字作为参数并返回三个数中的最大值。不允许使用内置的\
  \ `max()` 函数。\n\n### 练习 3：回文检查\n\n编写一个名为 `is_palindrome` 的函数，接受字符串作为参数，如果字符串是回文（正反读相同），则返回\
  \ `True`，否则返回 `False`。\n\n### 练习 4：斐波纳契数列\n\n编写一个名为 `fibonacci` 的函数，接受一个数字 `n` 作为参数并返回第\
  \ `n` 个斐波纳契数。斐波纳契数列从 0 和 1 开始，之后的每个数字都是前两个数字之和（例如 0, 1, 1, 2, 3, 5, 8, 13, ...）。\n\
  \n### 练习 5：质数检查\n\n编写一个名为 `is_prime` 的函数，接受一个数字作为参数，如果该数字是质数（只能被 1 和自身整除），则返回 `True`，否则返回\
  \ `False`。\n\n以下是上述函数练习的答案：\n\n### 练习 1：摄氏度转华氏度转换器\n```python\ndef celsius_to_fahrenheit(celsius):\n\
  \    fahrenheit = (celsius * 9/5) + 32\n    return fahrenheit\n```\n\n### 练习 2：三数最大值\n\
  ```python\ndef max_of_three(num1, num2, num3):\n    if num1 >= num2 and num1 >=\
  \ num3:\n        return num1\n    elif num2 >= num1 and num2 >= num3:\n        return\
  \ num2\n    else:\n        return num3\n```\n\n### 练习 3：回文检查\n```python\ndef is_palindrome(string):\n\
  \    reversed_string = string[::-1]\n    if string == reversed_string:\n       \
  \ return True\n    else:\n        return False\n```\n\n### 练习 4：斐波纳契数列\n```python\n\
  def fibonacci(n):\n    if n <= 0:\n        return \"Invalid input. Please enter\
  \ a positive integer.\"\n    elif n == 1:\n        return 0\n    elif n == 2:\n\
  \        return 1\n    else:\n        a, b = 0, 1\n        for _ in range(3, n+1):\n\
  \            a, b = b, a + b\n        return b\n```\n\n### 练习 5：质数检查\n```python\n\
  def is_prime(number):\n    if number < 2:\n        return False\n    for i in range(2,\
  \ int(number**0.5) + 1):\n        if number % i == 0:\n            return False\n\
  \    return True\n```\n\n这些是上述函数练习的答案：\n\n## 5. 数据结构\n\n在 Python 中，列表（list）是一种可变的数据结构，可以包含一组项目。在本章中，我们将探索如何创建列表、访问元素并执行各种操作。\n\
  \n### 5.1 列表和列表操作\n\n**1. 创建列表：**\n\n要创建一个列表，用方括号 `[]` 包裹项目并用逗号分隔。\n\n示例：\n```python\n\
  numbers = [1, 2, 3]\nfruits = [\"apple\", \"banana\"]\nmixed = [1, \"hello\"]\n\
  ```\n\n**2. 访问元素：**\n\n你可以通过索引访问列表元素。索引从 0 开始。\n\n示例：\n```python\nnumbers = [1,\
  \ 2, 3, 4, 5]\nprint(numbers[0]) # 输出: 1\nprint(numbers[2]) # 输出: 3\n```\n\n**3.\
  \ 修改元素：**\n\n列表是可变的，这意味着你可以通过特定的索引修改元素。\n\n示例：\n```python\nnumbers = [1, 2, 3, 4,\
  \ 5]\nnumbers[2] = 10\nprint(numbers) # 输出: [1, 2, 10, 4, 5]\n```\n\n**4. 列表操作：**\n\
  \n列表支持拼接、重复、长度计算和成员测试操作。\n\n示例：\n```python\nlist1 = [1, 2, 3]\nlist2 = [4, 5, 6]\n\
  result = list1 + list2\nprint(result) # 输出: [1, 2, 3, 4, 5, 6]\n\nfruits = [\"apple\"\
  , \"banana\"]\nrepeated_fruits = fruits * 3\nprint(repeated_fruits) # 输出: ['apple',\
  \ 'banana', 'apple', 'banana', 'apple', 'banana']\n\nnumbers = [1, 2, 3, 4, 5]\n\
  length = len(numbers)\nprint(length) # 输出: 5\n\nif 3 in numbers:\n    print(\"3\
  \ 在列表中\")\n```\n\n**5. 列表方法：**\n\n列表具有内置方法允许你执行各种操作，如添加、插入、删除和排序。\n\n示例：\n```python\n\
  numbers = [1, 2, 3]\nnumbers.append(4)\nprint(numbers) # 输出: [1, 2, 3, 4]\n\nfruits\
  \ = [\"apple\", \"banana\"]\nfruits.insert(1, \"orange\")\nprint(fruits) # 输出: [\"\
  apple\", \"orange\", \"banana\"]\n\nnumbers = [1, 2, 3, 4, 5]\nnumbers.remove(3)\n\
  print(numbers) # 输出: [1, 2, 4, 5]\n\nnumbers = [4, 2, 1, 3, 5]\nnumbers.sort()\n\
  print(numbers) # 输出: [1, 2, 3, 4, 5]\n```\n\n### 5.2 元组和元组操作\n\n在 Python 中，元组（tuple）是一种不可变的数据结构，可以包含一组项目。元组常用于将相关数据组合。在本节中，我们将探索如何创建元组、访问元素并执行各种操作。\n\
  \n**1. 创建元组：**\n\n要创建一个元组，用括号 `()` 包裹项目并用逗号分隔。\n\n示例：\n```python\nnumbers = (1,\
  \ 2, 3, 4, 5)\nfruits = (\"apple\", \"banana\", \"orange\")\nmixed = (1, \"hello\"\
  , True, 3.14)\n```\n\n**2. 访问元素：**\n\n你可以通过索引访问元组的单个元素，类似于列表。\n\n示例：\n```python\n\
  numbers = (1, 2, 3, 4, 5)\nprint(numbers[0]) # 输出: 1\nprint(numbers[2]) # 输出: 3\n\
  ```\n\n\n\n\n元组（Tuples）支持多种操作，例如拼接、重复、长度计算和成员测试，类似于列表。\n\n示例：\n\n```python\ntuple1\
  \ = (1, 2, 3)\ntuple2 = (4, 5, 6)\nresult = tuple1 + tuple2\nprint(result) # Output:\
  \ (1, 2, 3, 4, 5, 6)\n\nfruits = (\"apple\", \"banana\")\nrepeated_fruits = fruits\
  \ * 3\nprint(repeated_fruits) # Output: (\"apple\", \"banana\", \"apple\", \"banana\"\
  , \"apple\", \"banana\")\n\nnumbers = (1, 2, 3, 4, 5)\nlength = len(numbers)\nprint(length)\
  \ # Output: 5\n\nif 3 in numbers:\n    print(\"3 is present in the tuple\") # Output:\
  \ 3 is present in the tuple\n```\n\n### 4. 元组方法\n\n元组是不可变的，因此它们没有像列表那样用于修改元素的内置方法。然而，它们拥有几个用于基本操作的方法，例如计数出现次数和查找元素的索引。\n\
  \n示例：\n\n```python\nnumbers = (1, 2, 3, 2, 4, 2)\ncount = numbers.count(2)\nprint(count)\
  \ # Output: 3\n\nindex = numbers.index(4)\nprint(index) # Output: 4\n```\n\n###\
  \ 5.3 集合与集合操作\n\n在 Python 中，集合（set）是一个无序的唯一元素集合。集合用于执行数学集合操作，如并集、交集和差集。在本节中，我们将探索如何创建集合、执行集合操作以及在集合上使用内置方法。让我们进入集合和集合操作：\n\
  \n#### 1. 创建集合\n\n要创建一个集合，将元素封装在大括号 `{}` 中，或使用 `set()` 函数。\n\n示例：\n\n```python\n\
  fruits = {\"apple\", \"banana\", \"orange\"}\nnumbers = set([1, 2, 3, 4, 5])\n```\n\
  \n#### 2. 集合操作\n\n集合支持并集、交集、差集和对称差等各种操作。\n\n示例：\n\n```python\nset1 = {1, 2, 3}\n\
  set2 = {3, 4, 5}\nunion = set1.union(set2)\nprint(union) # Output: {1, 2, 3, 4,\
  \ 5}\n\nintersection = set1.intersection(set2)\nprint(intersection) # Output: {3}\n\
  \ndifference = set1.difference(set2)\nprint(difference) # Output: {1, 2}\n\nsymmetric_difference\
  \ = set1.symmetric_difference(set2)\nprint(symmetric_difference) # Output: {1, 2,\
  \ 4, 5}\n```\n\n#### 3. 集合方法\n\n集合拥有内置方法，允许你执行各种操作，如添加元素、删除元素和检查成员性。\n\n示例：\n\n\
  ```python\nfruits = {\"apple\", \"banana\"}\nfruits.add(\"orange\")\nprint(fruits)\
  \ # Output: {\"apple\", \"banana\", \"orange\"}\n\nfruits.remove(\"banana\")\nprint(fruits)\
  \ # Output: {\"apple\", \"orange\"}\n\nif \"apple\" in fruits:\n    print(\"apple\
  \ is present in the set\") # Output: apple is present in the set\n```\n\n当你想要存储一组唯一元素并对它们执行集合操作时，集合非常有用。它们对于查找唯一项目或从列表中删除重复项等任务特别特别有用。\n\
  \n### 5.4 字典与字典操作\n\n在 Python 中，字典（dictionary）是一个无序的键值对（key-value pairs）集合。字典用于高效地存储和检索数据。在本节中，我们将探索如何创建字典、访问值、添加或删除元素以及对其执行各种操作。让我们进入字典和字典操作：\n\
  \n#### 1. 创建字典\n\n要创建一个字典，将键值对封装在大括号 `{}` 中。每个键值对之间用冒号 `:` 分隔。\n\n示例：\n\n```python\n\
  student = {\n    \"name\": \"John\",\n    \"age\": 20,\n    \"grade\": \"A\"\n}\n\
  ```\n\n#### 2. 访问值\n\n你可以通过引用相应的键来访问字典中的值。\n\n示例：\n\n```python\nstudent = {\n  \
  \  \"name\": \"John\",\n    \"age\": 20,\n    \"grade\": \"A\"\n}\nprint(student[\"\
  name\"]) # Output: John\nprint(student[\"age\"]) # Output: 20\n```\n\n#### 3. 修改值\n\
  \n你可以通过给相应的键分配新值来修改字典中的值。\n\n示例：\n\n```python\nstudent = {\n    \"name\": \"John\"\
  ,\n    \"age\": 20,\n    \"grade\": \"A\"\n}\nstudent[\"age\"] = 21\nprint(student[\"\
  age\"]) # Output: 21\n```\n\n#### 4. 字典操作\n\n字典支持各种操作，如添加或删除键值对、检查成员性以及获取项目数量。\n\
  \n示例：\n\n```python\nstudent = {\n    \"name\": \"John\",\n    \"age\": 20,\n   \
  \ \"grade\": \"A\"\n}\nstudent[\"city\"] = \"New York\" # 添加一个新的键值对\nprint(student)\
  \ # Output: {'name': 'John', 'age': 20, 'grade': 'A', 'city': 'New York'}\n\ndel\
  \ student[\"grade\"] # 删除一个键值对\n```\n\n## 5.5 列表推导式\n\n在 Python 中，列表推导式（list comprehensions）提供了一种简洁的方式来创建列表。\n\
  \n#### 1. 基础语法\n\n列表推导式的基本语法由方括号 `[]` 内部的表达式和 `for` 循环组成。\n\n示例：\n\n```python\n\
  numbers = range(10)\ndoubled_numbers = [num * 2 for num in numbers]\n```\n\n####\
  \ 2. 使用条件\n\n你可以在列表推导式中包含 `if` 条件来过滤元素。\n\n示例：\n\n```python\nnumbers = range(10)\n\
  even_numbers = [num for num in numbers if num % 2 == 0]\n```\n\n#### 3. 嵌套列表推导式\n\
  \n你可以使用嵌套推导式来处理复杂的列表。\n\n示例：\n\n```python\nmatrix = [[1, 2, 3], [4, 5, 6], [7, 8,\
  \ 9]]\nflattened_matrix = [num for row in matrix for num in row]\n```\n\n#### 4.\
  \ 列表推导式中的函数\n\n你可以在列表推导式中使用函数来转换数据。\n\n示例：\n\n```python\nnames = [\"Alice\", \"\
  Bob\", \"Charlie\"]\nname_lengths = [len(name) for name in names]\n```\n\n### 5.6\
  \ 数据结构练习\n\n现在我们已经涵盖了列表、元组、集合、字典和推导式的知识，让我们通过一些练习来测试对数据结构的理解！这里是一些你可以尝试的练习：\n\n\
