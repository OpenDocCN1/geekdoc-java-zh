  \ York', 'London', 'Paris', 'Sydney']}\n\ndf = pd.DataFrame(data)\n\n# 按 'City'\
  \ 分组并计算年龄平均值\ngrouped_data = df.groupby('City')['Age'].mean()\nprint(grouped_data)\n\
