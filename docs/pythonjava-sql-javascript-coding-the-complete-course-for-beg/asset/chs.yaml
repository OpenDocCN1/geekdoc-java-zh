  \ OOP 练习的答案：\n\n### 练习 1：银行账户\n```python\nclass BankAccount:\n    def __init__(self,\
  \ account_number, account_holder, balance=0):\n        self.account_number = account_number\n\
  \        self.account_holder = account_holder\n        self.balance = balance\n\n\
  \    def deposit(self, amount):\n        self.balance += amount\n\n    def withdraw(self,\
