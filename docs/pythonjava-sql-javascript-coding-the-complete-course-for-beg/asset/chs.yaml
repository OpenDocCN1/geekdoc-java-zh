  plt.show()\n```\n\n这些答案演示了如何使用 Matplotlib 库创建不同类型的图表。\n\n# 第 12 章：使用 API\n\n## 12.1\
  \ API 简介\n\nAPI 全称为应用程序编程接口（Application Programming Interface）。它是一套允许不同应用程序相互通信的规则和协议。API\
  \ 定义了应用程序可以使用的方法和数据格式。\n\nAPI 如何工作？\n\nAPI 通过发送请求和接收响应来工作。当应用程序需要访问另一个应用程序或服务时，它会向\
  \ API 带有特定的参数请求。API 然后处理请求并返回请求的数据或执行操作。\n\n为什么 API 很重要？\n\nAPI 让应用程序能够共享并集成数据和功能。它们允许开发者利用现有系统构建新的应用程序。API\
  \ 还为开发者提供了访问和交互外部资源的标准方法，例如数据库、网络服务和云平台。\n\nAPI 类型\n\n根据实现和使用方式，API 有不同的类型：\n\n\
  *   `Web APIs`：通过互联网使用标准协议的 API。它们允许应用程序访问和交互基于网络的服务，例如从数据库检索数据或向第三方 API 请求。\n*\
  \   `库 APIs`：包含在软件库或框架中的 API。它们提供了开发者可以使用函数和类。库 API 通常在相同的编程语言中使用。\n*   `操作系统 APIs`：由操作系统提供的\
  \ API，允许应用程序与系统资源和服务交互。它们提供了用于文件管理、网络通信和进程控制任务的功能。\n\nAPI 文档\n\n对 API 进行文档记录是为了向开发者提供如何使用它们的信息。API\
  \ 文档通常包括可用端点、方法、参数和数据格式的详细信息。它还包括关于如何身份验证和向 API 发请求的示例和指南。\n\n\n\n\n\n在 Python 中发送\
  \ API 请求，你可以使用 `requests` 库。`requests` 库通过处理底层的 HTTP 请求和响应，提供了一种与 API 交互的简单方便的方法。\n\
  \n### 安装 requests 库\n\n在使用 `requests` 库之前，你需要先安装它。你可以使用 Python 的包管理器 `pip` 来安装它。打开你的命令提示符或终端并运行以下命令：\n\
  \n```bash\npip install requests\n```\n\n这将在你的系统上安装 `requests` 库。\n\n### 发起 GET 请求\n\
  \n一旦安装了 `requests` 库，你就可以开始发送 API 请求。常见的请求类型是 GET 请求，用于从服务器检索数据。这里是一个发送 GET 请求的示例：\n\
  \n```python\nimport requests\n\n# 发起一个 GET 请求\nresponse = requests.get('https://api.example.com/data')\n\
  \n# 检查响应状态码\n\nif response.status_code == 200:\n    # 请求成功\n    data = response.json()\n\
  \    print(data)\nelse:\n    # 请求失败\n    print('Error:', response.status_code)\n\
  ```\n\n在这个示例中，我们使用 `requests` 库中的 `get` 方法向指定的 URL 发起 GET 请求。然后我们检查响应状态码来判断请求是否成功（状态码\
  \ 200）。如果成功，我们可以使用 `json` 方法访问响应数据。\n\n### 发起 POST 请求\n\n除了 GET 请求之外，你还可以通过 POST\
  \ 请求向服务器发送数据。POST 请求通常用于执行操作或提交表单。这里是一个发送 POST 请求的示例：\n\n```python\nimport requests\n\
  \n# 要发送的数据\ndata = {\n    'name': 'John Doe',\n    'email': 'johndoe@example.com'\n\
  }\n\n# 发起一个 POST 请求\nresponse = requests.post('https://api.example.com/submit',\
  \ data=data)\n\n# 检查响应状态码\n\nif response.status_code == 200:\n    # 请求成功\n    result\
  \ = response.json()\n    print(result)\nelse:\n    # 请求失败\n    print('Error:', response.status_code)\n\
  ```\n\n在这个示例中，我们使用 `requests` 库中的 `post` 方法向指定的 URL 发起 POST 请求。我们通过 `data` 参数将数据以字典的形式传递。然后我们可以使用\
  \ `json` 方法访问响应数据。\n\n### 处理错误和异常\n\n在发送 API 请求时，恰当地处理错误和异常是非常重要的。`requests` 库提供了\
  \ `status_code` 属性来检查响应的状态码。常见的状态码包括表示成功的 200、表示请求错误的 400 以及表示服务器错误的 500。\n\n你可以使用条件语句根据状态码来处理不同的场景。此外，你还可以使用\
  \ `try-except` 块来捕获请求过程中可能发生的任何异常。\n\n```python\nimport requests\n\ntry:\n    response\
  \ = requests.get('https://api.example.com/data')\n    if response.status_code ==\
  \ 200:\n        data = response.json()\n        print(data)\n    else:\n       \
  \ print('Error:', response.status_code)\nexcept requests.exceptions.RequestException\
  \ as e:\n    print('Error:', e)\n```\n\n在这个示例中，我们使用 `try-except` 块来捕获请求过程中可能发生的任何异常。如果发生异常，我们会打印错误信息。\n\
  \n### 添加请求头和身份验证\n\n某些 API 要求请求中包含身份验证或额外的请求头（headers）。你可以使用 `headers` 参数添加请求头，并使用\
  \ `auth` 参数包含身份验证令牌。这里有一个示例：\n\n```python\nimport requests\n\nheaders = {\n    'Authorization':\
  \ 'Bearer YOUR_AUTH_TOKEN'\n}\n\nresponse = requests.get('https://api.example.com/data',\
  \ headers=headers)\nif response.status_code == 200:\n    data = response.json()\n\
  \    print(data)\nelse:\n    print('Error:', response.status_code)\n```\n\n在这个示例中，我们在请求中包含了一个带有令牌（bearer\
  \ token）的 `Authorization` 请求头。\n\n## 12.3 解析与处理 API 响应\n\n在发送 API 请求后，你通常需要解析并处理响应数据以提取你需要的信息。这涉及到处理\
  \ JSON 数据，JSON 是与 API 交换数据的常用格式。在本节中，我们将探索如何在 Python 中解析和处理 API 响应。\n\n### 1 解析\
  \ JSON 响应\n\n在处理 API 时，响应数据通常以 JSON 格式返回。JSON（JavaScript 对象表示法）是一种轻量级数据格式，对于人类和机器来说都易于读和写。Python\
  \ 提供了一个名为 `json` 的内置模块，可以方便地处理 JSON 数据。\n\n这里是一个解析 JSON 响应的示例：\n\n```python\nimport\
  \ requests\nimport json\n\nresponse = requests.get('https://api.example.com/data')\n\
  data = response.json()\n\n# 访问特定数据\nprint(data['name'])\nprint(data['age'])\n\n\
  # 遍历项目列表\nfor item in data['items']:\n    print(item['name'])\n```\n\n在这个示例中，我们使用\
  \ `requests` 库中的 `json` 方法来解析 JSON 响应。这会将响应数据转换为我们可以操作的字典。然后我们可以使用字典键访问特定数据，或者遍历项目列表。\n\
  \n### 2 处理 API 响应\n\n一旦解析了 API 响应，就可以对数据进行处理以提取你需要的信息或进行进一步处理。以下是几种处理技术：\n\n-  \
  \ **过滤数据**：你可以根据特定条件过滤响应数据。例如，你可以只提取符合某些标准的项。\n-   **排序数据**：你可以根据某些字段对响应数据进行排序。例如，你可以按流行程度对产品列表进行排序。\n\
  -   **聚合数据**：你可以对响应数据进行聚合以计算统计摘要。例如，你可以计算特定字段的平均值、总和或计数。\n-   **转换数据**：你可以将响应数据转换为不同的格式或结构。例如，你可以将项目列表转换为字典以便索引。\n\
  \n这里是一个处理响应数据的示例：\n\n```python\nimport requests\nimport json\n\nresponse = requests.get('https://api.example.com/data')\n\
  data = response.json()\n\n# 过滤数据\nfiltered_items = [item for item in data['items']\
  \ if item['price'] > 50]\n\n# 排序数据\nsorted_items = sorted(data['items'], key=lambda\
  \ item: item['popularity'], reverse=True)\n\n# 聚合数据\ntotal_price = sum(item['price']\
  \ for item in data['items'])\n\n# 转换数据\nindexed_items = {item['id']: item for item\
  \ in data['items']}\n```\n\n在这个示例中，我们根据条件（`price > 50`）过滤项目，按流行程度倒序排序，计算所有项目的总价格，并将项目列表转换为以\
  \ ID 为键的字典。\n\n解析并处理 API 响应允许你从 API 返回的数据中提取相关信息。通过处理 JSON 数据并使用过滤、排序、聚合和转换等技术，你可以让数据符合你的需求。Python\
  \ 内置的 `json` 模块和语言的活性使得处理 API 响应和操作数据变得简单。\n\n## 12.4 身份验证与频率限制\n\n在处理 API 时，身份验证和频率限制是确保安全和资源公平使用的重要考虑。在本节中，我们将探索如何在\
  \ Python 中进行 API 请求身份验证以及处理频率限制。\n\n### 1 身份验证\n\nAPI 通常需要身份验证以确保只有授权用户才能访问某些资源或执行某些操作。身份验证方法有多种，如\
  \ API Key、OAuth 和 JWT（JSON Web 令牌）。具体取决于你你使用的 API。\n\n这里有一个使用 API Key 进行身份验证的示例：\n\
  \n```python\nimport requests\n\nheaders = {\n    'Authorization': 'Bearer YOUR_API_KEY'\n\
  }\n\nresponse = requests.get('https://api.example.com/data', headers=headers)\n\
  if response.status_code == 200:\n    data = response.json()\n    print(data)\nelse:\n\
  \    print('Error:', response.status_code)\n```\n\n\n\n\n在本示例中，我们在请求中包含了一个带有 API\
  \ key 的 Authorization 请求头。包含 API key 的特定方法可能取决于 API 的文档。请务必参考 API 文档获取正确的身份验证方法和参数。\n\
  \n## 2 频率限制 (Rate Limiting)\n\nAPI 提供者通常实施频率限制以防止滥用并确保资源的公平使用。频率限制限制了你在特定时间内可以发送的请求数量。频率限制通常按每分钟或每小时的数定义。\n\
  \n为了处理频率限制，你需要跟踪已发送的请求次数，并确保不超过允许的限制。以下是使用 `time` 模块实现频率的示例：\n\n```python\nimport\
  \ requests\nimport time\n\nRATE_LIMIT = 100 # 每分钟最大请求数\nTIME_PERIOD = 60 # 时间周期（秒）\n\
  \nrequests_made = 0\nstart_time = time.time()\n\nwhile True:\n    if requests_made\
  \ < RATE_LIMIT:\n        response = requests.get('https://api.example.com/data')\n\
  \        requests_made += 1\n        if response.status_code == 200:\n         \
  \   data = response.json()\n            print(data)\n        else:\n           \
  \ print('Error:', response.status_code)\n    else:\n        elapsed_time = time.time()\
  \ - start_time\n        if elapsed_time < TIME_PERIOD:\n            time.sleep(TIME_PERIOD\
  \ - elapsed_time)\n        start_time = time.time()\n        requests_made = 0\n\
  ```\n\n在此示例中，我们维护了一个 `requests_made` 计数器来跟踪时间周期内发送的请求次数。如果计数器超过频率限制，我们将等待周期内的剩余时间后再发送更多请求。这确保了我们不会超过\
  \ API 设置的频率限制。\n\n注意的是，不同的 API 可能有不同的频率限制规则和机制。请确保参考 API 文档获取具体的频率限制规则和指南。\n\n身份验证和频率限制是处理\
  \ API 的重要方面。通过正确验证 API 请求并处理频率限制，你可以确保 API 资源的安全和公平使用。Python 提供了必要的工具和库，例如 `requests`\
  \ 库和 `time` 模块，来有效处理身份验证和频率限制。\n\n## 12.5 API 练习\n\n为了练习在 Python 中操作 API，这里有几个你可以尝试的练习：\n\
  \n*   **练习 1：天气 API**\n    使用天气 API 获取特定位置的当前天气数据。你可以使用 OpenWeatherMap API 或你选择的任何其他天气\
