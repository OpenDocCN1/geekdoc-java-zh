  df['Age'] = pd.to_numeric(df['Age'])\n\n# 将 'Age' 列转换为整数数据类型\ndf['Age'] = df['Age'].astype(int)\n\
  \nprint(df.dtypes)\n```\n\n## 应用数学或统计操作\n\nPandas 提供了函数和方法来对你的数据应用数学或统计操作。示例包括 `df.sum()`、`df.mean()`、`df.min()`、`df.max()`\
