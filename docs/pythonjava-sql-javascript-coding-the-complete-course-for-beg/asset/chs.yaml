  \ `even_numbers` 的列表，其中仅包含 `numbers` 中的偶数。\n\n\n\n\n```python\nprint(colors)\n```\n\
  Output: `{\"red\", \"green\", \"yellow\", \"purple\"}`\n\n### 练习 4:\n\n```python\n\
