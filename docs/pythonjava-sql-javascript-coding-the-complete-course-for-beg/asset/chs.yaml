  \        print(f\"Account Number: {self.account_number}\")\n        print(f\"Account\
  \ Holder: {self.account_holder}\")\n        print(f\"Balance: {self.balance}\")\n\
  ```\n\n### 练习 2：学生\n```python\nclass Student:\n    def __init__(self, name, age):\n\
  \        self.name = name\n        self.age = age\n        self.courses = []\n\n\
  \    def add_course(self, course):\n        self.courses.append(course)\n\n    def\
