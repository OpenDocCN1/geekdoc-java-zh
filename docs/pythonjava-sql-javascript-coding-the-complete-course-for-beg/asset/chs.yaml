  \ 提供了 `df.groupby()` 函数来分组，以及 `df.agg()` 函数来执行聚合操作。\n- 数据合并和连接：你可以根据公共列或键合并或连接多个\
  \ `DataFrames`。`Pandas` 提供了 `df.merge()` 和 `df.join()` 等函数来实现这些操作。\n\n## 10.3 过滤、排序和分组\n\
  \n在数据处理和分析中，通常需要对数据进行过滤、排序和分组以提取有意义的见解。`Pandas` 库提供了高效执行这些操作的函数和方法。\n\n### 数据过滤\n\
  要根据特定条件过滤数据，可以使用布尔索引或 `df.query()` 方法。布尔索引允许你根据条件选择行或列。`df.query()` 方法允许你使用查询字符串语法来过滤数据。\n\
  \n```python\nimport pandas as pd\n\n# 创建一个 DataFrame\ndata = {'Name': ['John', 'Emily',\
  \ 'Michael', 'Jessica'],\n'Age': [25, 30, 35, 40],\n'City': ['New York', 'London',\
  \ 'Paris', 'Sydney']}\n\ndf = pd.DataFrame(data)\n\n# 使用布尔索引过滤数据\nfiltered_data\
  \ = df[df['Age'] > 30]\nprint(filtered_data)\n\n# 使用 df.query() 过滤数据\nfiltered_data\
  \ = df.query('Age > 30')\nprint(filtered_data)\n```\n\n### 数据排序\n要根据一列或多列对数据进行排序，可以使用\
  \ `df.sort_values()` 方法。默认情况下，该方法按升序排序数据。你可以指定 `ascending=False` 参数按降序排序。\n\n```python\n\
  import pandas as pd\n\n# 创建一个 DataFrame\ndata = {'Name': ['John', 'Emily', 'Michael',\
