  \ `numbers` 中每个数字的平方。\n\n**练习 2**：创建一个包含三种水果的元组 `fruits`。然后，使用元组操作添加另一种水果。\n\n**练习\
  \ 3**：创建一个包含五种颜色的集合 `colors`。然后，使用集合操作从集合中删除一种颜色。\n\n**练习 4**：创建一个名为 `student`，包含以下键值对：`name`（姓名）、`age`（年龄）、`major`（专业）。然后，添加一个名为\
