  \ 2:\n    # 语句块\nelif expression 3:\n    # 语句块\nelse:\n    # 语句块\n```\n\n![](img/image00323.jpeg)\n\
  \n示例\n\n```python\nnumber = int(input(\"Enter the number?\"))\nif number==10:\n\
  \    print(\"number is equals to 10\")\nelif number==50:\n    print(\"number is\
