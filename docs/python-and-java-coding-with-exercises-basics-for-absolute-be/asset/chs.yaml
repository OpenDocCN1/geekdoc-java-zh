  ![](img/image00325.jpeg)\n\n# Python for 循环\n\n在 Python 中，`for` 循环用于多次迭代语句或程序的片段。它通常用于遍历数据结构，如列表\
  \ `list`、元组 `tuple` 或字典 `dictionary`。\n\nPython 的 `for` 循环语法所示。\n\n```python\nfor\
  \ iterating_var in sequence:\n    statement(s)\n```\n\n流程图\n![](img/image00326.jpeg)\n\
