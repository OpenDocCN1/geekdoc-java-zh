  ```\n\n## elif 语句\n\n`elif` 语句允许我们检查多个条件，并根据这些条件中的真值执行特定的语句块。根据我们的需求，可以在程序中包含任意数量的\
  \ `elif` 语句。另一方面，使用 `elif` 是可选的。\n\n在 C 语言中，`elif` 语句类似于 `if-else-if` 阶梯语句。它后面必须跟一个\
