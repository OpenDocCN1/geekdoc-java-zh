  \n## Python 缩进\n\nPython 缩进用于定义代码块。在 Python 中，使用空格来表示缩进。缩进用于代码的开头，并以行结束。代码块由相同的缩进定义。在大多数情况下，使用四个空格作为缩进。为了简单方便编程，声明代码块的缩进是\
  \ Python 中最常用的特性。我们将查看 Python 中缩进的实际情况。\n\n## if 语句\n\n`if` 语句用于测试一个条件，如果条件为真，则执行\
