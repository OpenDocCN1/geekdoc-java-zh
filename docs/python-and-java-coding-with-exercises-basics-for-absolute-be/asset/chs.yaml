  \    print(\"number is not equal to 10, 50 or 100\")\n```\n\n输出:\n```\nEnter the\
  \ number?15\nnumber is not equal to 10, 50 or 100\n```\n\n# Python 循环\n\n默认情况下，任何编程语言编写的程序流都是顺序的。我们可能需要随时更改程序的执行流。特定代码的执行可能需要重复几次。\n\
