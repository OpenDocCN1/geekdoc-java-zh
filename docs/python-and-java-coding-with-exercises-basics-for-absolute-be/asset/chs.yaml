  ['Aman', 'Mumbai']\n```\n\n## 从列表中移除重复元素的程序\n### 示例：\n**输入：**\n`list1`: `[10, 20,\
  \ 10, 20, 30, 40, 30, 50]`\n**输出：**\n移除重复元素的列表\n`list2`: `[10, 20, 30, 40, 50]`\n\
  \n### 程序\n```python\n# 定义列表\nlist1 = [10, 20, 10, 20, 30, 40, 30, 50]\n# 创建一个具有唯一元素的另一个列表\n\
  list2 = list(set(list1))\n```\n\n\n\n\n\n# 声明另一个列表\n\n`list2 = []`\n\n# 添加元素\n\n\
  ```python\nfor n in list1:\n    if n not in list2:\n        list2.append(n)\n```\n\
  \n# 打印列表\n\n```python\nprint \"Original list\"\nprint \"list1: \", list1\nprint\
  \ \"List after removing duplicate elements\"\nprint \"list2: \", list2\n```\n\n\
  ### 输出\n```\nOriginal list\nlist1: [10, 20, 10, 20, 30, 40, 30, 50]\nList after\
  \ removing duplicate elements\nlist2: [10, 20, 30, 40, 50]\n```\n\n## 程序 (由用户定义函数):\n\
  \n# 去重函数\n\n```python\ndef removeDuplicates (list1):\n    # 声明另一个列表\n    list2 =\
  \ []\n    # 添加元素 \n    for n in list1:\n        if n not in list2:\n           \
  \ list2.append (n)\n    return list2\n\n# 主代码\n# 声明一个列表\nlist1 = [10, 20, 10, 20,\
  \ 30, 40, 30, 50]\n# 打印列表\nprint \"Original list: \", list1\nprint \"List after\
  \ duplicate remove: \", removeDuplicates (list1)\n```\n\n### 输出\n```\nOriginal list:\
  \ [10, 20, 10, 20, 30, 40, 30, 50]\nList after duplicate remove: [10, 20, 30, 40,\
  \ 50]\n```\n\n## JAVA 编码与 JAVA 练习\n绝对初学者的基础\n快速学习编程的逐步指南\nJ NEWMAN\n\n## JAVA 编码：\n\
  绝对初学者的基础\n快速学习编程的逐步指南\nJ NEWMAN\n\n## 什么是 Java\n\nJava 既是一个平台，也一门编程语言。Java 是一种高级编程语言，同时具有健壮性、面向对象性和安全性。\n\
  \nJava 是由 Sun Microsystems（现为 Oracle 的一个部门）于 1995 年创建。Java 的创始人詹姆斯·戈斯林（James Gosling）被认为是“Java\
  \ 之父”。在 Java 出现之前，它被称为 Oak。由于 Oak 已经是一个受认可的商业名称，詹姆斯·戈斯林和团队决定将名称更改为 Java。\n\n平台：平台是指运行程序的任何硬件或软件环境。Java\
  \ 被称为平台是因为因为它拥有运行时环境（`JRE`）和 `API`。\n\n## Java 示例\n\n让我们来看一个 Java 编程示例。下一页包含 Hello\
  \ Java 示例的完整描述。\n\n`Simple.java`\n\n```java\n1. class Simple{  \n2. public static\
  \ void main(String args[]){  \n3. System.out.println(\"Hello Java\");  \n4. }  \n\
  5. }\n```\n\n## Java 类型\n\nJava 编程可以用于构建四种应用程序：\n\n### 1) 独立应用程序\n\n桌面应用程序和基于窗口的程序是独立应用程序的示例。这些必须安装在每台机器上的典型程序。媒体播放器、防病毒软件和其他独立应用程序都是示例。在\
  \ Java 中，使用 `AWT` 和 `Swing` 创建独立应用。\n\n### 2) Web 应用\n\nWeb 应用是一种运行在服务器上并生成动态页面的应用程序。现在使用\
  \ `Servlet`、`JSP`、`Struts`、`Spring`、`Hibernate`、`JSF` 等技术用 Java 开发 Web 应用。\n\n###\
  \ 3) 企业级应用\n\n分布式应用程序（如银行软件）被称为企业级应用。高安全性、负载均衡和集群只是其优点之一。`EJB` 是用于开发企业级应用的 Java\
  \ 框架。\n\n### 4) 移动应用\n\n移动应用是专门为移动设备设计的程序。目前，移动应用使用 `Android` 和 `Java ME` 开发。\n\n\
  ## Java 平台\n\nJava 提供了四个不同的平台或版本：\n\n### 1) Java SE (Java 标准版)\n\n这是一个 Java 编程环境。它包含了\
  \ Java 编程 API，如 `java.lang`、`java.io`、`java.net`、`java.util`、`java.sql` 和 `java.math`。涵盖了面向对象编程（OOPs）、`String`、正则表达式（Regex）、异常（Exception）、内部类、多线程、I/O\
  \ 流、网络、`AWT`、`Swing`、反射（Reflection）、集合（Collection）以及其他关键主题。\n\n### 2) Java EE (Java\
  \ 企业版)\n\n这是一个主要用于创建在线和企业级应用的业务平台。它是使用 `Java SE` 平台构建的。涵盖了 `Servlet`、`JSP`、Web 服务、`EJB`、`JPA`\
  \ 和其他主题。\n\n### 3) Java ME (Java 微型版)\n\n这是一个专注于移动应用的微平台。\n\n### 4) JavaFX\n\n这是一种用于创建富内容的在线应用的编程语言。它利用了一个简单的用户界面\
  \ API。\n\n# JAVA 编码\n\n## Java 的特性\n\nJava 编程语言开发的主要目标是使其具有可移植性、简单性和安全性。此外，还有许多有助于该语言流行的优秀方面。Java\
  \ 术语指的是该语言的特性。\n\n以下是 Java 编程语言最核心的特征列表。\n\n![](img/image00342.jpeg)\n\n### 简单\n\
  \nJava 是一种非常容易学习的语言。根据 Sun Microsystems 的说法，Java 是一种易于理解的简单语言，因为：\n\nJava 语法简单。\n\
  \nJava 删除了困难且很少使用的特性，如指针和运算符重载。\n\n### 面向对象\n\nJava 是一种关注对象的计算机语言。在 Java 中，一切都是对象。面向对象编程指的是软件作为数据和行为的集合。\n\
  \n### 平台无关\n\n与 `C`、`C++` 等编译为特定平台的语言相比，Java 是一种“编写一次，处运行”的语言。运行程序的任何硬件或软件环境被称为平台。平台分为基于软件和基于硬件两种。Java\
  \ 是一种构建在软件上的平台。\n\n### 安全\n\n安全性是 Java 最为人知的特性。我们可以 Java 创建防病毒解决方案。由于以下原因，Java 是安全的：\n\
  \n没有特定的指针。\n\nJava 程序运行在沙箱环境中。\n\n管理器是 Java 运行时（JRE）的一个组件，用于动态加载 Java 类。它通过隔离本地文件系统与网络包提高了安全性。\n\
  \n字节码验证器：检查可能破坏访问权限的代码片段。\n\n管理器：确定类可以访问的资源，如读写本地磁盘。\n\n### 健壮\n\n英语行业蓬勃发展。Java\
  \ 是一种健壮的编程语言，是因为：\n\n它大量利用内存管理。\n\n没有指针，因此没有安全问题。\n\nJava 提供自动垃圾回收，并在虚拟机上删除不再被 Java\
  \ 程序使用的对象。\n\nJava 具有异常处理和类型检查机制。所有这些因素都有助于 Java 的健壮性。\n\n### 架构中立\n\n由于 Java 中没有依赖于实现的方面（例如原始类型的大小），因此它是架构中性的。\n\
  \n在 `C` 编程中，`int` 数据类型在 32 位架构中占用两个字节，在 64 位架构中占用四个字节。但在 Java 中，它在 32 位和 64 位架构上都占用\
  \ 4 字节内存。\n\n### 可移植\n\nJava 是可移植的，因为它允许你将 Java 字节码移动到另一个平台。它不需要任何种的实现。\n\n### 高性能\n\
  \n由于 Java 字节码接近原生代码，因此比其他传统的解释型编程语言更快。尽管如此，它仍然慢于编译语言（例如 `C++`）。\n\n\n\n\n因为它允许用户在\
  \ Java 中构建分布式程序，因此它是分布式的。在开发分布式应用程序时，使用了 `RMI` 和 `EJB`。这种 Java 能力允许我们通过调用连接到互联网的任何系统中的方法来访问文件。\n\
  \n### 多线程\n线程就像一个在后台运行的第二个软件。通过定义许多线程，我们可以设计出同时处理多个任务的 Java 应用程序。多线程的根本优势是每个线程不占用内存。它具有一个共享的内存空间。线程对于多媒体、Web\
  \ 应用程序和其他应用程序至关重要。\n\n### 动态\nJava 是一种动态编程语言。它允许类被动态加载。这意味着类仅在需要时才被加载。它还支持用其原生语言\
  \ `C` 和 `C++` 编写的函数。\n\nJava 允许动态编译和内存管理（垃圾回收）。\n\n# C++ vs Java\n`C++` 和 `Java`\
  \ 编程语言有很多许多相似之处和不同之处。以下是 `C++` 和 `Java` 之间最重要的区别的总结：\n\n![](img/image00343.jpeg)\n\
  ![](img/image00344.jpeg)\n![](img/image00345.jpeg)\n![](img/image00346.jpeg)\n\n\
  ## C++ 程序示例\n文件: `main.cpp`\n\n```cpp\n1. #include <iostream>\n2. using namespace\
  \ std;\n3. int main() {\n4. cout << \"Hello C++ Programming\";\n5. return 0;\n6.\
