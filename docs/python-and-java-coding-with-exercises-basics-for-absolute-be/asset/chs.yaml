  \n输出：\nEnter a? 100\nEnter b? 120\nEnter c? 130\nc is largest\n\n## if-else 语句\n\
  \nif-else 语句将 `else` 块与 `if` 语句结合，当条件为假时执行 `else` 块。\n\n\n\n\n`if-else` 语句的语法所示。\n\
  \n```python\nif condition:\n    # 语句块\nelse:\n    # 另一个语句块 (else-块)\n```\n\n示例\n\
  \n一个判断一个人是否有资格投票的程序。\n\n```python\nage = int (input(\"Enter your age? \"))\nif age>=18:\n\
