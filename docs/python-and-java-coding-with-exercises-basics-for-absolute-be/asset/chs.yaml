  \n给出一个整数（十进制），并使用 Java 程序将其转换为二进制。\n\n### 程序\n```java\n// Scanner 类用于接收用户输入\nimport\
  \ java.util.Scanner;\n\nclass DecimalToBinaryClass{\npublic static void main(String[]\
  \ args)\n{\n//创建 Scanner 对象\nScanner sc = new Scanner(System.in);\nSystem.out.println(\"\
  输入任意十进制数字：\");\n//接收输入\nint input_decimal_num = sc.nextInt();\nString binary_string\
  \ = \"\";\n//循环直到 input_decimal_num > 0\nwhile(input_decimal_num > 0){\n//余数添加到字符串变量\n\
  binary_string = input_decimal_num%2 + binary_string;\ninput_decimal_num = input_decimal_num/2;\n\
  }\n// 显示最终结果\nSystem.out.println(\"转换为二进制为： \" + binary_string);\n}\n}\n```\n\n\
  ### 输出\n```\n输入任意十进制数字：\n30\n转换为二进制为： 11110\n```\n\n# 一维数组和二维数组的加法 Java 程序\n\n有\
  \ 2 个程序：一维数组相加，二维数组相加\n\n### 1) 一维数组相加\n```java\nclass AddTwoArrayClass{\npublic\
  \ static void main(String[] args){\n//声明并初始化数组\nint a[] = {1,2,3,4,5};\nint b[]\
  \ = {6,7,8,9,10};\n//实例化第三数组以存储结果\nint c[] = new int[5];\nfor(int i=0; i<5;i++){\n\
  //两个数组相加并将结果存入第三数组\nc[i] = a[i] + b[i];\n//输出结果\nSystem.out.println(\"索引 \"+i+\"\
  \ 的和为：\" + c[i]);\n}\n}\n```\n\n### 输出\n```\n索引 0 的和为：7\n索引 1 的和为：9\n索引 2 的和为：11\n\
  索引 3 的和为：13\n索引 4 的和为：15\n```\n\n### 2) 二维数组相加\n```java\nclass AddTwoArrayOf2DClass{\n\
  public static void main(String[] args){\n//声明并初始化 2D 数组\nint a[][] = {{1,2,3},{4,5,6}};\n\
  int b[][] = {{7,8,9},{10,11,12}};\n//实例化第三数组以存储结果\nint c[][] = new int[2][3];\n\
  for(int i=0; i<2;i++){\nfor(int j=0; j<3;j++){\n//两个数组相加并将结果存入第三数组\nc[i][j] = a[i][j]\
  \ + b[i][j];\n//输出结果\nSystem.out.println(\"索引 \"+i+\" \"+\" + j+\" 的和为：\" + c[i][j]);\n\
  }\n}\n}\n}\n```\n\n### 输出\n```\n索引 0 0 的和为：8\n索引 0 1 的和为：10\n索引 0 2 的和为：12\n索引 1\
  \ 0 的和为：14\n索引 1 1 的和为：16\n索引 1 2 的和为：18\n```\n\n\n\n\n\n这是第 4 行\n\n### 程序\n\n```java\n\
