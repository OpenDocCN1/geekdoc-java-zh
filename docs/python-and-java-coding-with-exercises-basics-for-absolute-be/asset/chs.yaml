  \ Now)\n\n双击下载的可执行文件打开以下窗口。通过选择“自定义安装”(Customize installation) 继续。当你勾选 `Add Path`\
  \ 复选框时，Python 路径将自动配置。\n\n![](img/image00294.jpeg)\n\n我们也可以通过点击自定义安装按钮选择所需的位置和功能。另一个需要考虑的关键因素是是否为所有用户安装启动器。\n\
  \n步骤 3：安装过程\n\n![](img/image00295.jpeg)\n\n现在尝试从命令提示符运行 `python`。如果你使用的是 Python\
  \ `3`，输入 `python -version`。\n\n![](img/image00296.jpeg)\n\n我们已经准备好使用 Python 了。\n\
  \n# 第一个 Python 程序\n\n在本节中，我们将学习 Python 的基本语法，并运行一个在终端打印 Hello World 的简单程序。\n\nPython\
  \ 为我们运行程序提供了两种选择：\n\n- 使用交互式解释器的提示符\n- 使用脚本文件\n\n让我们仔细查看每一个一个。\n\n## 交互式解释器提示符\n\
  \n在交互式提示符下，Python 允许我们逐条执行每个 Python 语句。当我们关注 Python 程序每一行的输出时，这种方法更好。\n\n要进入交互模式模式，请在终端（或命令提示符）上输入\
  \ `python`（如果系统中同时安装了 Python `2` 和 Python `3`，则输入 `python3`）。\n\n它将打开下面的提示符，可以在这里运行\
  \ Python 语句并查看它如何影响终端。\n\n![](img/image00297.jpeg)\n\n完成打印语句后按下回车键。\n\n![](img/image00298.jpeg)\n\
  \n## 多行语句\n\n多行语句输入到类似记事本的文本编辑器并保存为 `.py` 文件。在下面的示例中，我们使用 Python 脚本描述了许多代码行的执行。\n\
  \n代码：\n\n```python\n1. name = \"Andrew Venis\"\n2. branch = \"Computer Science\"\
  \n3. age = \"25\"\n4. print(\"My name is: \", name )\n5. print(\"My age is: \",\
  \ age)\n```\n\n脚本文件：\n\n![](img/image00299.jpeg)\n![](img/image00300.jpeg)\n\n#\
  \ Python 变量\n\n变量是指内存区域的术语。Python 变量（通常称为标识符）是数据的容器。\n\n由于 Python 是一种推类型语言，我们不需要描述变量的类型，因为它足够智能可以识别出来。\n\
  \n变量名可以是字母和数字的组合，但必须以字母或下划线开头。\n\n变量名应该使用小写字母。`rahul` 和 `rahul` 是两个不同的变量。\n\n##\
  \ 标识符命名\n\n标识符是变量的示例。程序中的字面量使用标识符标识。以下是命名标识符的规则。\n\n- 变量的起始字符必须是字母或下划线 (`_`）。\n\
  - 除了第一个字符外，所有字符可以是小写 (a-z)、大写 (A-Z)、下划线或数字 (0-9)。\n- 标识符名称中不能有空格或特殊字符（`!`, `@`,\
  \ `#`, `%`, `,`, `&`, `*`）。\n- 标识符名称不能与语言的任何关键字相同。\n- 标识符名称区分大小写；例如 `my name` 和\
  \ `MyName` 不是同一个东西。\n- 有效的标识符包括 `a123`、`_n`、`n9` 等。\n- `1a`、`n4`、`n9` 等其他错误的标识符是示例。\n\
  \n## 声明变量\n\nPython 不需要要求我们在代码中使用变量之前对其声明。它允许我们在特定时间点构建变量。\n\n在 Python 中，我们不需要显式声明变量。任何时候给变量赋值时，它就会自动定义。\n\
  \n变量的值使用等号 (`=`) 运算符赋值。\n\n# 对象引用\n\n在声明变量时，理解 Python 解释器如何工作很重要。处理变量的方式与许多其他编程语言不同。\n\
  \n由于 Python 是一种面向对象的语言，变量属于一个类。让我们来看示例。\n\n```python\na = 50\n```\n![](img/image00301.jpeg)\n\
  \n我们将 `50` 赋值给 `a`。创建 `b`。\n\n```python\nb = 50\n```\n![](img/image00302.jpeg)\n\
  \n`a` 和 `b` 指向同一个对象。现在我们更改 `a` 的值。\n\n```python\na = 100\n```\n![](img/image00303.jpeg)\n\
  \n现在 `a` 指向不同的对象。\n\n## 对象标识\n\nPython 中每个创建的对象都有一个唯一的标识。Python 确保两个对象不共享相同的标识符。对象标识使用\
  \ `id()` 函数进行标识。考虑以下示例。\n\n```python\na = 50\nb = 50\nprint(id(a))\nprint(id(b))\n\
  ```\n输出：\n```\n140734926918\n140734926918\n```\n\n我们设置 `b = a` 因为 `a` 和 `b` 指向相同内容。我们重新赋值\
  \ `a` 为 `500`。\n\n```python\na = 500\nprint(id(a))\n```\n输出：\n```\n282205696094\n\
  ```\n\n# Python 数据类型\n\n值可以存储在变量中，每个值都有一个数据类型。由于 Python 是动态类型语言，我们在声明变量时不需要指定类型。值由解释器隐含绑定类型。\n\
  \n```python\na = 5\n```\n\n我们没有定义变量 `a` 的类型，它的整数值为 5。变量 `a` 将被 Python 解释器自动解释为整数类型。\n\
  \n```python\na=10\nb=\"Hi Python\"\nc = 10.5\nprint(type(a))\nprint(type(b))\nprint(type(c))\n\
  ```\n输出：\n```\n<type 'int'>\n<type 'str'>\n<type 'float'>\n```\n\n## 标准数据类型\n\n\
  不同类型的值可以存储在变量中。例如，人的姓名必须保存为字符串，而他的 ID 必须记录为整数。\n\n\n\n\nPython 支持多种标准数据类型，每种类型都有自己的存储技术。以下是\
  \ Python 数据类型的列表。\n\n1. 数字 (Numbers)\n2. 序列类型 (Sequence Type)\n3. 布尔值 (Boolean)\n\
  4. 集合 (Set)\n5. 字典 (Dictionary)\n\n![](img/image00304.jpeg)\n\n在本节课程中，我们将对上述数据类型进行简要概述。在课程的后面，我们将深入介绍每一种类型。\n\
  \n### 数字\n\n数字是一种存储数值的数据类型。Python 的数字数据类型包含整数（integer）、浮点数（float）和复数（complex）。Python\
  \ 中的 `type()` 方法可以确定变量的数据类型。`isinstance()` 函数用于判断对象是否属于某个特定的类。\n\n当给变量赋值一个数字时，Python\
  \ 会产生数字对象。例如：\n\n```\na = 5\nprint(\"The type of a\", type(a))\nb = 40.5\nprint(\"\
  The type of b\", type(b))\nc = 1+3j\nprint(\"The type of c\", type(c))\nprint(\"\
  \ c is a complex number\", isinstance(1+3j,complex))\n```\n\n输出：\n```\nThe type\
  \ of a <class 'int'>\nThe type of b <class 'float'>\nThe type of c <class 'complex'>\n\
  c is complex number: True\n```\n\nPython 识别三种数值数据类型。\n\n整数值可以是任意长度，例如 10、2、29、-20、-150\
  \ 等。在 Python 中，整数的长度是不限制的。它的值为 `int`。\n\n浮点数（Float）用于存储浮点数，如 1.9、9.902、15.2 等。它的精度高达\
  \ 15 位小数。\n\n复数（Complex number）由有序对组成，即 `x + iy`，其中 `x` 和 `y` 分别代表实部和虚部。复数如 `2.14j`、`2.0\
  \ + 2.3j` 等。\n\n# Python 关键字\n\nPython 关键字是保留字，用于向编译器/解释器传达特定的含义。每个关键字都有独特的含义和操作。这些关键字不能用作变量。Python\
  \ 关键字列表如下。\n\n![](img/image00305.jpeg)\n\n- `True` - 代表布尔真值，意味着如果给定条件为真，则返回 \"True\"\
  。非零值被假设为真。\n- `False` - 代表布尔假假；如果给定条件为假，则返回 \"False\"。值为 0 被解释为假。\n- `None` - 表示空或无效值。空列表或零不能表示\
  \ `None`。\n- `And` - 它也是一个逻辑运算符。用于测试多个条件。如果两个条件都满足，则返回真。请参考下方的真表。\n\n![](img/image00306.jpeg)\n\
  - `or` - 在 Python 中，它是逻辑运算符。如果满足其中一个条件，则返回真。请参考下方的真表。\n\n![](img/image00307.jpeg)\n\
  - `not` - 它是一个翻转真值的逻辑运算符。请参考下方的真表。\n\n![](img/image00308.jpeg)\n- `assert` - 在 Python\
  \ 中，此关键字用作调试工具。它验证代码的正确性。如果代码中发现错误，它会抛出 `AssertionError` 并打印错误消息。\n\n示例：\n```\n\
  a = 10\nb = 0\nprint('a is dividing by Zero')\nassert b != 0\nprint(a / b)\n```\n\
  \n输出：\n```\na is dividing by Zero\n```\n\n运行时异常：\n```\nTraceback (most recent call\
  \ last):\n  File \"/home/40545678b342ce3b70beb1224bed345f.py\", line 4, in \n  \
  \  assert b != 0, \"Divide by 0 error\"\nAssertionError: Divide by 0 error\n```\n\
  - `Def` - 在 Python 中，此关键字用于声明函数。如果后面跟着函数名。\n\n```\ndef my_func(a,b):\n  c = a+b\n\
  \  print(c)\nmy_func(10,20)\n```\n\n输出：\n```\n30\n```\n- `class` - 在 Python 中，它用于表示类。类作为对象的蓝图。它是变量和方法的组合。请看下面的类。\n\
  \n```python\nclass Myclass:\n  #Variables……\n  def function_name(self):\n    #statements………\n\
  ```\n- `continue` - 该命令用于停止当前迭代的执行。考虑以下场景。\n\n```\na = 0\nwhile a < 4:\n  a += 1\n\
  \  if a == 2:\n    continue\n  print(a)\n```\n\n输出：\n```\n1\n3\n```\n\n# Python\
  \ 字面量 (Literals)\n\nPython 中的字面量是存储在变量或常量中的数据。Python 支持：\n\n### 1. 字符串字面量\n字符串字面量通过将文本封装在引号中创建。创建一个字符串，我们可以使用单引号和双引号。\n\
  示例：\n```\n\"A\", '12345'\n```\n\n### 2. 数字字面量\n数字字面量是不可变的。数字字面量可以分为以下类型：\n- 整数 (Integer)\n\
  - 浮点数 (Float)\n- 复数 (Complex)\n- 二进制 (Binary)\n- 八进制 (Octal)\n- 十六进制 (Hexadecimal)\n\
  - 科学计数法 (Scientific)\n- 下划 (Underscore)\n\n整数值可以是任意长度，例如 10、2、29、-20、-150 等。在 Python\
  \ 中，整数的长度是不限制的。它的值为 `int`。\n\n浮点数（Float）用于存储浮点数，如 1.9、9.902、15.2 等。它的精度高达 15 位小数。\n\
  \n复数（Complex number）由有序对组成，即 `x + iy`，其中 `x` 和 `y` 分别代表实部和虚部。复数如 `2.14j`、`2.0 +\
  \ 2.3j` 等。\n\n### 3. 布尔字面量\n布尔字面量可以是 `True` 或 `False`。\n示例：\n```\nTrue, False\n\
  ```\n\n### 4. 特殊字面量\n`None` 表示空或无效值。\n示例：\n```\nNone\n```\n\n### 5. 字面量集合\nPython\
  \ 支持四种字面量集合：\n- 列表 (List)\n- 元组 (Tuple)\n- 字典 (Dict)\n- 集合 (Set)\n\n#### 列表 (List)\n\
  列表中的项可以是各种数据类型。列表是可变的，意味着它们可以更改。列表值用逗号（`,`）隔开，并封装在方括号（`[]`）中。\n示例：\n```\nlist =\
  \ [1, 2, 3]\n```\n\n#### 元组 (Tuple)\nPython 中的元组是不同数据类型的集合。它是不可变的，意味着在创建后不能更改。它被封装在括号（`()`）中，每个元素用逗号（`,`）隔开。\n\
  示例：\n```\ntuple = (1, 2, 3)\n```\n\n#### 字典 (Dict)\n数据以键值对的形式存储在 Python 字典中。它封装在大括号（`{}`）中，每对用逗号（`,`）隔开。\n\
  示例：\n```\ndict = {\"key\": \"value\", \"key2\": 2}\n```\n\n#### 集合 (Set)\nPython\
  \ 集合是无序数据集的集合。它被封装在 且每个元素用逗号（`,`）隔开。\n示例：\n```\nset = {1, 2, 3}\n```\n\n# Python\
  \ 运算符 (Operators)\n\n运算符是负责两个操作数之间特定操作的符号。运算符是程序的基础，特定编程语言的逻辑构建在其之上。Python 有许多运算符，如下所示。\n\
  \n- 算术运算符 (Arithmetic operators)\n- 比较运算符 (Comparison operators)\n- 赋值运算符 (Assignment\
  \ Operators)\n- 逻辑运算符 (Logical Operators)\n- 位运算符 (Bitwise Operators)\n- 成员运算符 (Membership\
  \ Operators)\n- 身份运算符 (Identity Operators)\n\n## 算术运算符\n\n\n\n\n\n算术运算符用于对两个操作数进行操作。它包含运算符\
  \ `+`（加法）、`-`（减法）、`*`（乘法）、`/`（除法）、`%`（取模）、`//`（地板除）和幂运算 `**`。\n\n请参考下表以对算术运算符进行更深入的解释。\n\
  \n![](img/image00310.jpeg)\n\n## 比较运算符\n\n比较运算符用于比较两个操作数的值，并返回布尔值真（true）或假（false）。比较运算符如表所示。\n\
  \n![](img/image00311.jpeg)\n\n## 赋值运算符\n\n赋值运算符用于将右表达式的值赋值给左操作数。赋值运算符如表所示。\n\n![](img/image00312.jpeg)\n\
