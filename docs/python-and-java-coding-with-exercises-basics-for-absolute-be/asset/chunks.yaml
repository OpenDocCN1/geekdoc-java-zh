    ## Boolean Data Type


    Only two potential values are stored in the Boolean data type: true and false.
    Simple flags that track true/false circumstances are stored in this data type.


    The Boolean data type specifies a single bit of data, but its "size" cannot be
    precisely defined.


    Example:


    1.  Boolean one = false  


    ## Byte Data Type


    The primitive data type byte is an example of this. It''s an 8-bit two-s complement
    signed integer. It has a value range of -128 to 127\. (inclusive). It has a minimum
    of -128 and a high of 127\. It has a value of 0 by default.


    The byte data type is used to preserve memory in huge arrays where space is at
    a premium. Because a byte is four times smaller than an integer, it saves space.
    It can also be substituted with the "int" data type.


    Example:


    1.  byte a = 10, byte b = -20  


    ## Short Data Type


    A 16-bit signed two''s complement integer is the short data type. It has a value
    range of -32,768 to 32,767\. (inclusive). It has a minimum of -32,768 and a maximum
    of 32,767\. It has a value of 0 by default.


    The short data type, like the byte data type, can be used to save memory. A short
    data type is twice the size of an integer.


    Example:


    1.  short s = 10000, short r = -5000  


    ## Int Data Type


    A 32-bit signed two''s complement integer is represented by the int data type.
    Its range of values is - 2,147,483,648 (-231 -1) to 2,147,483,647 (231 -1). (inclusive).
    It has a minimum of 2,147,483,648 and a maximum of 2,147,483,647\. It has a value
    of 0 by default.


    Unless there is a memory constraint, the int data type is usually chosen as the
    default data type for integral values.


    Example:


    1.  int a = 100000, int b = -200000  


    ## Long Data Type


    A 64-bit two''s complement integer is the long data type. It has a value range
    of -9,223,372,036,854,775,808(-263 -1) to 9,223,372,036,854,775,807(263 -1). (inclusive).
    Its lowest and maximum values are 9,223,372,036,854,775,808 and 9,223,372,036,854,775,807\.
    It has a value of 0 by default. When you need a larger range of values than int
    can supply, you should utilise the long data type.


    Example:


    1.  long a = 100000L, long b = -200000


    ## Float Data Type


    The float data type is a 32-bit IEEE 754 floating point with single precision.
    It has an infinite value range. If you need to preserve memory in big arrays of
    floating point integers, use a float (rather than a double). For precise numbers,
    such as currency, the float data type should never be used. 0.0F is the default
    value.


    Example:


    1.  float f1 = 234.5f  


    ## Double Data Type


    A double data type is a 64-bit IEEE 754 floating point with double precision.
    It has an infinite value range. Like float, the double data type is commonly used
    for decimal values. For precise values, such as currency, the double data type
    should never be utilised. 0.0d is the default value.


    Example:


    1.  double d1 = 12.3  


    ## Char Data Type


    A single 16-bit Unicode character is represented by the char data type. It has
    a value range of ''u0000'' (or 0) to ''uffff'' (or 65,535 inclusive). Characters
    are stored using the char data type.


    Example:


    1.  char letterA = ''A''  


    # Operators in Java


    In Java, an operator is a symbol that performs operations. For instance, +, -,
    *, /, and so on.


    In Java, there are many different types of operators, which are listed below:


    *   Unary Operator,


    *   Arithmetic Operator,


    *   Shift Operator,


    *   Relational Operator,


    *   Bitwise Operator,


    *   Logical Operator,


    *   Ternary Operator and


    *   Assignment Operator.


