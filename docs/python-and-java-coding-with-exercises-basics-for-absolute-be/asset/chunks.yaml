  trans: "\nPython 支持多种标准数据类型，每种类型都有自己的存储技术。以下是 Python 数据类型的列表。\n\n1. 数字 (Numbers)\n\
    2. 序列类型 (Sequence Type)\n3. 布尔值 (Boolean)\n4. 集合 (Set)\n5. 字典 (Dictionary)\n\n\
    ![](img/image00304.jpeg)\n\n在本节课程中，我们将对上述数据类型进行简要概述。在课程的后面，我们将深入介绍每一种类型。\n\n###\
    \ 数字\n\n数字是一种存储数值的数据类型。Python 的数字数据类型包含整数（integer）、浮点数（float）和复数（complex）。Python\
    \ 中的 `type()` 方法可以确定变量的数据类型。`isinstance()` 函数用于判断对象是否属于某个特定的类。\n\n当给变量赋值一个数字时，Python\
    \ 会产生数字对象。例如：\n\n```\na = 5\nprint(\"The type of a\", type(a))\nb = 40.5\nprint(\"\
    The type of b\", type(b))\nc = 1+3j\nprint(\"The type of c\", type(c))\nprint(\"\
    \ c is a complex number\", isinstance(1+3j,complex))\n```\n\n输出：\n```\nThe type\
    \ of a <class 'int'>\nThe type of b <class 'float'>\nThe type of c <class 'complex'>\n\
    c is complex number: True\n```\n\nPython 识别三种数值数据类型。\n\n整数值可以是任意长度，例如 10、2、29、-20、-150\
    \ 等。在 Python 中，整数的长度是不限制的。它的值为 `int`。\n\n浮点数（Float）用于存储浮点数，如 1.9、9.902、15.2 等。它的精度高达\
    \ 15 位小数。\n\n复数（Complex number）由有序对组成，即 `x + iy`，其中 `x` 和 `y` 分别代表实部和虚部。复数如 `2.14j`、`2.0\
    \ + 2.3j` 等。\n\n# Python 关键字\n\nPython 关键字是保留字，用于向编译器/解释器传达特定的含义。每个关键字都有独特的含义和操作。这些关键字不能用作变量。Python\
    \ 关键字列表如下。\n\n![](img/image00305.jpeg)\n\n- `True` - 代表布尔真值，意味着如果给定条件为真，则返回 \"\
    True\"。非零值被假设为真。\n- `False` - 代表布尔假假；如果给定条件为假，则返回 \"False\"。值为 0 被解释为假。\n- `None`\
    \ - 表示空或无效值。空列表或零不能表示 `None`。\n- `And` - 它也是一个逻辑运算符。用于测试多个条件。如果两个条件都满足，则返回真。请参考下方的真表。\n\
    \n![](img/image00306.jpeg)\n- `or` - 在 Python 中，它是逻辑运算符。如果满足其中一个条件，则返回真。请参考下方的真表。\n\
    \n![](img/image00307.jpeg)\n- `not` - 它是一个翻转真值的逻辑运算符。请参考下方的真表。\n\n![](img/image00308.jpeg)\n\
    - `assert` - 在 Python 中，此关键字用作调试工具。它验证代码的正确性。如果代码中发现错误，它会抛出 `AssertionError` 并打印错误消息。\n\
    \n示例：\n```\na = 10\nb = 0\nprint('a is dividing by Zero')\nassert b != 0\nprint(a\
    \ / b)\n```\n\n输出：\n```\na is dividing by Zero\n```\n\n运行时异常：\n```\nTraceback\
    \ (most recent call last):\n  File \"/home/40545678b342ce3b70beb1224bed345f.py\"\
    , line 4, in \n    assert b != 0, \"Divide by 0 error\"\nAssertionError: Divide\
    \ by 0 error\n```\n- `Def` - 在 Python 中，此关键字用于声明函数。如果后面跟着函数名。\n\n```\ndef my_func(a,b):\n\
    \  c = a+b\n  print(c)\nmy_func(10,20)\n```\n\n输出：\n```\n30\n```\n- `class` -\
    \ 在 Python 中，它用于表示类。类作为对象的蓝图。它是变量和方法的组合。请看下面的类。\n\n```python\nclass Myclass:\n\
    \  #Variables……\n  def function_name(self):\n    #statements………\n```\n- `continue`\
    \ - 该命令用于停止当前迭代的执行。考虑以下场景。\n\n```\na = 0\nwhile a < 4:\n  a += 1\n  if a == 2:\n\
    \    continue\n  print(a)\n```\n\n输出：\n```\n1\n3\n```\n\n# Python 字面量 (Literals)\n\
    \nPython 中的字面量是存储在变量或常量中的数据。Python 支持：\n\n### 1. 字符串字面量\n字符串字面量通过将文本封装在引号中创建。创建一个字符串，我们可以使用单引号和双引号。\n\
    示例：\n```\n\"A\", '12345'\n```\n\n### 2. 数字字面量\n数字字面量是不可变的。数字字面量可以分为以下类型：\n- 整数\
    \ (Integer)\n- 浮点数 (Float)\n- 复数 (Complex)\n- 二进制 (Binary)\n- 八进制 (Octal)\n- 十六进制\
    \ (Hexadecimal)\n- 科学计数法 (Scientific)\n- 下划 (Underscore)\n\n整数值可以是任意长度，例如 10、2、29、-20、-150\
    \ 等。在 Python 中，整数的长度是不限制的。它的值为 `int`。\n\n浮点数（Float）用于存储浮点数，如 1.9、9.902、15.2 等。它的精度高达\
    \ 15 位小数。\n\n复数（Complex number）由有序对组成，即 `x + iy`，其中 `x` 和 `y` 分别代表实部和虚部。复数如 `2.14j`、`2.0\
    \ + 2.3j` 等。\n\n### 3. 布尔字面量\n布尔字面量可以是 `True` 或 `False`。\n示例：\n```\nTrue, False\n\
    ```\n\n### 4. 特殊字面量\n`None` 表示空或无效值。\n示例：\n```\nNone\n```\n\n### 5. 字面量集合\nPython\
    \ 支持四种字面量集合：\n- 列表 (List)\n- 元组 (Tuple)\n- 字典 (Dict)\n- 集合 (Set)\n\n#### 列表 (List)\n\
    列表中的项可以是各种数据类型。列表是可变的，意味着它们可以更改。列表值用逗号（`,`）隔开，并封装在方括号（`[]`）中。\n示例：\n```\nlist\
    \ = [1, 2, 3]\n```\n\n#### 元组 (Tuple)\nPython 中的元组是不同数据类型的集合。它是不可变的，意味着在创建后不能更改。它被封装在括号（`()`）中，每个元素用逗号（`,`）隔开。\n\
    示例：\n```\ntuple = (1, 2, 3)\n```\n\n#### 字典 (Dict)\n数据以键值对的形式存储在 Python 字典中。它封装在大括号（`{}`）中，每对用逗号（`,`）隔开。\n\
    示例：\n```\ndict = {\"key\": \"value\", \"key2\": 2}\n```\n\n#### 集合 (Set)\nPython\
    \ 集合是无序数据集的集合。它被封装在 且每个元素用逗号（`,`）隔开。\n示例：\n```\nset = {1, 2, 3}\n```\n\n# Python\
    \ 运算符 (Operators)\n\n运算符是负责两个操作数之间特定操作的符号。运算符是程序的基础，特定编程语言的逻辑构建在其之上。Python 有许多运算符，如下所示。\n\
    \n- 算术运算符 (Arithmetic operators)\n- 比较运算符 (Comparison operators)\n- 赋值运算符 (Assignment\
    \ Operators)\n- 逻辑运算符 (Logical Operators)\n- 位运算符 (Bitwise Operators)\n- 成员运算符\
    \ (Membership Operators)\n- 身份运算符 (Identity Operators)\n\n## 算术运算符\n\n"
- fmt: "\nArithmetic operators are used to perform operations on two operands. It\
    \ has the operators `+` (addition), `-` (subtraction), `*` (multiplication), `/`\
    \ (divide), `%` (reminder), `//` (floor division), and exponent `**`.\n\nConsider\
    \ the table below for a more in-depth explanation of arithmetic operators.\n\n\
    ![](Images/image00310.jpeg)\n\n## Comparison operator\n\nComparison operators\
    \ are used to compare the values of two operands and return a Boolean true or\
    \ false result. The comparison operators are listed in the table below.\n\n![](Images/image00311.jpeg)\n\
    \n## Assignment Operators\n\nThe assignment operators are used to assign the right\
    \ expression's value to the left operand. The assignment operators are listed\
    \ in the table below.\n\n![](Images/image00312.jpeg)\n![](Images/image00313.jpeg)\n\
    \n## Bitwise Operators\n\nThe bitwise operators operate on the values of the two\
    \ operands bit by bit. Consider the following scenario.\n\nFor example,\n\n1.\
    \ if `a = 7`\n2. `b = 6`\n3. then, `binary (a) = 0111`\n4. `binary (b) = 0110`\n\
    6. hence, `a & b = 0011`\n7. `a | b = 0111`\n8. `a ^ b = 0100`\n9. `~ a = 1000`\n\
    \n![](Images/image00314.jpeg)\n\n## Logical Operators\n\nTo make a decision, logical\
    \ operators are primarily used in expression evaluation. Python supports the logical\
    \ operators listed below.\n\n![](Images/image00315.jpeg)\n\n## Membership Operators\n\
    \nPython membership operators are used to determine whether a value is a member\
    \ of a Python data structure. If the value exists in the data structure, the result\
    \ is true; otherwise, it returns false.\n\n![](Images/image00316.jpeg)\n\n## Identity\
    \ Operators\n\nThe identity operators are used to determine whether an element\
    \ belongs to a specific class or type.\n\n![](Images/image00317.jpeg)\n\n## Operator\
    \ Precedence\n\nThe precedence of the operators is critical to determining because\
    \ it tells us which operator should be evaluated first. The precedence table of\
    \ Python operators is shown below.\n\n![](Images/image00318.jpeg)\n![](Images/image00319.jpeg)\n\
    \n# Python Comments\n\nPython Comment is a must-have tool for programmers. In\
    \ general, comments are used to explain the code. If the code is properly explained,\
    \ we can easily understand it. A good programmer should use comments because if\
    \ anyone wants to modify the code or implement a new module in the future, it\
    \ will be much easier to do so.\n\nOther programming languages, such as C++, use\
    \ the `/` for single-lined comments and `/*.... */` for multiple-lined comments,\
    \ whereas Python only uses the `#` for single-lined Python comments. To include\
    \ a comment in code, place a hash(`#`) at the beginning of the statement or code.\n\
    \nLet's take a look at an example.\n\n1. `# This is the print statement`\n2. `print(\"\
    Hello Python\")`\n\nUsing the hash(`#`), we have added a comment to the print\
    \ statement. It will have no effect on our print statement.\n\n## Multiline Python\
    \ Comment\n\nTo use the multiline Python comment, we must use hash(`#`) at the\
    \ beginning of each line of code. Consider the following scenario.\n\n1. `# First\
