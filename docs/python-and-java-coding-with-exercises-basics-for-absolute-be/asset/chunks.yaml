    are compared, the result is false.


    Lists keep the element''s order for the duration of their existence. That is why
    it is a collection of objects in a specific arrangement.


    1.  a = [1, 2,"Peter", 4.50,"Ricky",5, 6]  


    2.  b = [1, 2,"Peter", 4.50,"Ricky",5, 6]  


    3.  a == b  


    Output:


    True


    Let''s take a closer look at the list example.


    1.  emp = ["John", 102, "USA"]     


    2.  Dep1 = ["CS",10]  


    3.  Dep2 = ["IT",11]    


    4.  HOD_CS = [10,"Mr. Holding"]    


    5.  HOD_IT = [11, "Mr. Bewon"]    


