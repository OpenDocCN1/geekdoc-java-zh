    \ \", list1\nprint \"List after duplicate remove: \", removeDuplicates (list1)\n\
    ```\n\n### Output\n```\nOriginal list: [10, 20, 10, 20, 30, 40, 30, 50]\nList\
    \ after duplicate remove: [10, 20, 30, 40, 50]\n```\n\n## JAVA CODING AND JAVA\
    \ EXERCISES\nBASICS FOR ABSOLUTE BEGINNERS\nSTEP BY STEP GUIDE TO LEARN CODING\
    \ QUICKLY\nJ NEWMAN\n\n## JAVA CODING:\nBASICS FOR ABSOLUTE BEGINNERS\nSTEP BY\
    \ STEP GUIDE TO LEARN CODING QUICKLY\nJ NEWMAN\n\n## What is Java\n\nJava is a\
    \ platform as well as a programming language. Java is a high-level programming\
    \ language that is also robust, object-oriented, and secure.\n\nJava was created\
    \ in 1995 by Sun Microsystems (which is now a division of Oracle). The founder\
    \ of Java, James Gosling, is recognised as the \"Father of Java.\" It was known\
    \ as Oak before Java. Because Oak was already a recognised business, James Gosling\
    \ and his team decided to alter the name to Java.\n\nPlatform: A platform is any\
    \ hardware or software environment in which a programme runs. Java is referred\
    \ to as a platform because it has a runtime environment (`JRE`) and `API`.\n\n\
    ## Java Example\n\nLet's take a look at an example of Java programming. The next\
    \ page contains a full description of the Hello Java example.\n\n`Simple.java`\n\
    \n```java\n1. class Simple{  \n2. public static void main(String args[]){  \n\
    3. System.out.println(\"Hello Java\");  \n4. }  \n5. }\n```\n\n## Types of Java\
    \ Applications\n\nJava programming can be used to construct four different sorts\
    \ of applications:\n\n### 1) Standalone Application\n\nDesktop applications and\
    \ window-based programmes are examples of stand-alone applications. These are\
    \ typical programmes that must be installed on each machine. Media player, antivirus,\
    \ and other standalone applications are examples. In Java, `AWT` and `Swing` are\
    \ used to create standalone apps.\n\n### 2) Web Application\n\nA web application\
    \ is an application that runs on the server and generates a dynamic page. `Servlet`,\
    \ `JSP`, `Struts`, `Spring`, `Hibernate`, `JSF`, and other technologies are now\
    \ used to develop web applications in Java.\n\n### 3) Enterprise Application\n\
    \nA distributed application, such as banking software, is referred to as an enterprise\
    \ application. High-level security, load balancing, and clustering are just a\
    \ few of the benefits. `EJB` is a Java framework for developing enterprise applications.\n\
    \n### 4) Mobile Application\n\nA mobile application is a programme designed specifically\
    \ for mobile devices. Currently, mobile applications are developed using `Android`\
    \ and `Java ME`.\n\n## Java Platforms\n\nJava is available on four different platforms\
    \ or editions:\n\n### 1) Java SE (Java Standard Edition)\n\nIt's a Java programming\
    \ environment. Java programming APIs like `java.lang`, `java.io`, `java.net`,\
    \ `java.util`, `java.sql`, and `java.math` are included. OOPs, `String`, `Regex`,\
    \ `Exception`, Inner classes, Multithreading, `I/O Stream`, Networking, `AWT`,\
    \ `Swing`, `Reflection`, `Collection`, and other key subjects are covered.\n\n\
    ### 2) Java EE (Java Enterprise Edition)\n\nIt's a business platform that's primarily\
    \ used for creating online and corporate apps. It is constructed using the `Java\
    \ SE` platform. `Servlet`, `JSP`, `Web Services`, `EJB`, `JPA`, and other subjects\
    \ are covered.\n\n### 3) Java ME (Java Micro Edition)\n\nIt's a mobile application-focused\
    \ microplatform.\n\n### 4) JavaFX\n\nIt's a programming language that's used to\
    \ create rich online apps. It makes use of a simple user interface API.\n\n# JAVA\
    \ CODING\n\n## Features of Java\n\nThe major goal of the Java programming language's\
    \ development was to make it portable, simple, and secure. Apart from that, there\
    \ are a number of good aspects that contribute to the language's popularity. Java\
    \ buzzwords refer to the aspects of the language.\n\nThe following is a list of\
    \ the most essential characteristics of the Java programming language.\n\n![](Images/image00342.jpeg)\n\
    \n### Simple\n\nJava is a fairly straight language to learn. Java is a simple\
    \ language with a grammar that is easy to comprehend, according to Sun Microsystems,\
    \ because:\n\nJava syntax is simple and easy to understand.\n\nMany difficult\
    \ and rarely-used features, such as pointers and operator overloading, have been\
    \ eliminated from Java.\n\n### Object-oriented\n\nJava is a computer language\
    \ that focuses on objects. In Java, everything is an object. Object-oriented programming\
    \ refers to the organisation of software as a collection of both data and behaviour.\n\
    \n### Platform Independent\n\nJava is platform independent in contrast to other\
    \ languages such as `C`, `C++`, which are compiled into platform-specific machines,\
    \ whereas Java is a write-once, run-where language. The hardware or software environment\
    \ in which a programme runs is referred to as a platform. Software-based and hardware-based\
    \ platforms are the two sorts of platforms. Java is a platform that is built on\
    \ software.\n\n### Secured\n\nThe security of Java is its most well-known feature.\
    \ We can create anti-virus solutions using Java. Because of the following, Java\
    \ is protected:\n\nThere is no specific pointing.\n\nJava programmes run in a\
    \ sandbox environment.\n\nSecurity Manager is a component of the Java Runtime\
    \ Environment (`JRE`) that is used to dynamically load Java classes. It improves\
    \ security by isolating the package for local file system from those imported\
    \ from network.\n\nBytecode Verifier: It examines code fragments for illegal code\
    \ that could compromise access privileges.\n\nSecurity Manager: It determines\
    \ the resources a class has access to, such as reading and writing to the local\
    \ disc.\n\n### Robust\n\nRobust's English industry is thriving. Java is a robust\
    \ programming language because:\n\nIt makes extensive use of memory management.\n\
    \nThere aren't any pointers, hence there aren't any security issues.\n\nAutomatic\
    \ garbage collection is provided by Java and operates on the Java Virtual Machine\
    \ to get rid of things that are no longer in use by a Java application.\n\nIn\
    \ Java, there are exception handling and type checking mechanisms. All of these\
    \ factors contribute to Java's robustness.\n\n### Architecture-neutral\n\nBecause\
    \ there are no implementation-dependent aspects in Java, such as the size of primitive\
    \ types, it is architecture neutral.\n\nIn `C` programming, the `int` data type\
    \ takes up two bytes in 32-bit architecture and four bytes in 64-bit architecture.\
