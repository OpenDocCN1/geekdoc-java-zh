    \ Literals:\n```\nx = (1 == True)\ny = (2 == False)\nz = (3 == True)\na = True\
    \ + 10\nb = False + 10\nprint(\"x\", x)\nprint(\"y\", y)\nprint(\"z\", z)\nprint(\"\
    a:\", a)\nprint(\"b:\", b)\n```\n\nOutput:\n```\nx is True\ny is False\nz is False\n\
    a: 11\nb: 10\n```\n\n### 4. Special literals\nPython has a single special literal,\
    \ `None`. `None` is used to specify a field that has not been created. In Python,\
    \ it is also used to indicate the end of a list.\nExample - Special Literals:\n\
    ```\nval1 = 10\nval2 = None\nprint(val1)\nprint(val2)\n```\n\nOutput:\n```\n10\n\
    None\n```\n\n### 5. Literal Collections\nPython supports four different types\
    \ of literal collections:\n- List literals\n- Tuple literals\n- Dict literals\n\
    - Set literals\n\n#### List\n- The items in a list are of various data types.\
    \ Lists are mutable, which means they can be changed.\n- List values are separated\
    \ by commas (`,`) and enclosed in square brackets (`[]`). A List can hold various\
    \ types of data.\nExample - List literals:\n```\nlist = ['John',678,20.4,'Peter']\n\
    list1 = [456,'Andrew']\nprint(list)\nprint(list + list1)\n```\nOutput:\n```\n\
    ['John', 678, 20.4, 'Peter']\n['John', 678, 20.4, 'Peter', 456, 'Andrew']\n```\n\
    \n#### Dictionary\n- The data is stored in a Python dictionary as a key-value\
    \ pair.\n- It is surrounded by curly braces, and each pair is separated by commas\
    \ (`,`).\nExample:\n```\ndict = {'name': 'Pater', 'Age':18,'Roll_nu':101}\nprint(dict)\n\
    ```\nOutput:\n```\n{'name': 'Pater', 'Age': 18, 'Roll_nu': 101}\n```\n\n#### Tuple\n\
    - A tuple in Python is a collection of different data types. It is immutable,\
    \ which means it cannot be changed after it is created.\n- It is surrounded by\
    \ parentheses (`()`), and each element is separated by a comma (`,`).\nExample:\n\
    ```\ntup = (10,20,\"Dev\",[2,3,4])\nprint(tup)\n```\nOutput:\n```\n(10, 20, 'Dev',\
    \ [2, 3, 4])\n```\n\n#### Set\n- The Python set is a collection of unordered datasets.\n\
    - It is surrounded by and each element is separated by a comma (`,`).\nExample\
    \ - Set Literals:\n```\nset = {'apple','grapes','guava','papaya'}\nprint(set)\n\
    ```\nOutput:\n```\n{'guava', 'apple', 'papaya', 'grapes'}\n```\n\n# Python Operators\n\
    \nThe operator is a symbol that is in charge of a specific operation between two\
    \ operands. Operators are the foundations of a program, upon which the logic is\
    \ built in a particular programming language. Python has a number of operators,\
    \ which are listed below.\n\n- Arithmetic operators\n- Comparison operators\n\
    - Assignment Operators\n- Logical Operators\n- Bitwise Operators\n- Membership\
    \ Operators\n- Identity Operators\n\n## Arithmetic Operators\n"
  raw: 'Python supports a number of standard data types, each with its own storage
    technique. The following is a list of Python data types.


    1.  Numbers


    2.  Sequence Type


    3.  Boolean


    4.  Set


    5.  Dictionary


    ![](Images/image00304.jpeg)


    We''ll give a quick overview of the above data types in this section of the lesson.
    Later in this course, we''ll go over each of them in depth.


    ### Numbers


    Number is a type of data that stores numerical values. A Python Numbers data-type
    has integer, float, and complex values. The type() method in Python can be used
    to determine the data type of a variable. The isinstance() function is used to
    determine whether an object belongs to a specific class.


    When a variable is assigned a number, Python produces Number objects. As an example;


    1.  a = 5  


    2.  print("The type of a", type(a))  


    4.  b = 40.5  


    5.  print("The type of b", type(b))  


    7.  c = 1+3j  


    8.  print("The type of c", type(c))  


    9.  print(" c is a complex number", isinstance(1+3j,complex)) 


    Output:


    The type of a <class ''int''>


    The type of b <class ''float''>


    The type of c <class ''complex''>


    c is complex number: True


    Python recognises three types of numerical data.


    Integer values can be any length, such as 10, 2, 29, -20, -150, and so on. An
    integer''s length is not limited in Python. Its value is an int.


    Float is used to store floating-point numbers such as 1.9, 9.902, 15.2, and so
    on. It has a precision of up to 15 decimal places.


    A complex number is made up of an ordered pair, i.e., x + iy, where x and y represent
    the real and imaginary parts, respectively. Complex numbers such as 2.14j, 2.0
    + 2.3j, and so on.


    # Python Keywords


    Python keywords are reserved words that communicate a specific meaning to the
    compiler/interpreter. Each keyword has a distinct meaning and a distinct operation.
    These keywords are ineligible for use as variables. The list of Python keywords
    is as follows.


    ![](Images/image00305.jpeg)


    True - It represents the Boolean true, which means that if the given condition
    is true, it returns "True." Non-zero values are assumed to be true.


    False - It represents the Boolean false; it returns "False" if the given condition
    is false. A value of zero is interpreted as false.


    None - It denotes a null or void value. An empty list or Zero cannot be used to
    represent None.


    And - It is also a logical operator. It''s used to test for multiple conditions.
    If both conditions are met, it returns true. Consider the truth table below.


    ![](Images/image00306.jpeg)


    or - In Python, it is a logical operator. If one of the conditions is met, it
    returns true. Consider the truth table below.


    ![](Images/image00307.jpeg)


    not - It''s a logical operator that flips the truth value. Consider the truth
    table below.


    ![](Images/image00308.jpeg)


    assert - In Python, this keyword is used as a debugging tool. It verifies the
    code''s correctness. If an error is found in the code, it raises an AssertionError
    and prints an error message.


    Example:


    1.  a = 10  


    2.  b = 0  


    3.  print(''a is dividing by Zero'')  


    4.  assert b != 0  


    5.  print(a / b)


    Output:


    a is dividing by Zero


    Runtime Exception:


    Traceback (most recent call last):


      File "/home/40545678b342ce3b70beb1224bed345f.py", line 4, in 


        assert b != 0, "Divide by 0 error"


    AssertionError: Divide by 0 error


    Def - In Python, this keyword is used to declare the function. If it is followed
    by the name of the function.


    1.  def my_func(a,b):  


    2.  c = a+b  


    3.  print(c)  


    4.  my_func(10,20)  


    Output:


    30


    class - In Python, it is used to represent a class. The class serves as the objects''
    blueprint. It is a grouping of variables and methods. Consider the class below.


    1.  class Myclass:  


    2.  #Variables……..  


    3.  def function_name(self):  


    4.  #statements………  


    continue - This command is used to halt the current iteration''s execution. Consider
    the following scenario.


    1.  a = 0  


    2.  while a < 4:  


    3.  a += 1   


    4.  if a == 2:  


    5.  continue  


    6.  print(a)  


    Output:


    1


    3


    4


    # Python Literals


    Literals in Python are data that is stored in a variable or constant.


    Python supports - following literals:


    ### 1\. String literals:


    String literals are created by enclosing text in quotes. To make a string, we
    can use both single and double quotes.


    Example:


    1.  "Aman" , ''12345''  


    ### 2. Numeric literals


    Numeric Literals are unchangeable. Numeric literals can be classified into one
    of four numerical types.


    ![](Images/image00309.jpeg)


    Example - Numeric Literals


    1.  x = 0b10100 #Binary Literals  


    2.  y = 100 #Decimal Literal   


    3.  z = 0o215 #Octal Literal  


    4.  u = 0x12d #Hexadecimal Literal  


    6.  #Float Literal  


    7.  float_1 = 100.5   


    8.  float_2 = 1.5e2  


    10.  #Complex Literal   


    11.  a = 5+3.14j  


    13.  print(x, y, z, u)  


    14.  print(float_1, float_2)  


    15.  print(a, a.imag, a.real)  


    Output:


    20 100 141 301


    100.5 150.0


    (5+3.14j) 3.14 5.0


    ### 3. Boolean literals:


    A Boolean literal can have either True or False as its value.


    Example - Boolean Literals


    1.  x = (1 == True)  


    2.  y = (2 == False)  


    3.  z = (3 == True)  


    4.  a = True + 10  


    5.  b = False + 10  


    7.  print("x is", x)  


    8.  print("y is", y)  


    9.  print("z is", z)  


    10.  print("a:", a)  


    11.  print("b:", b)  


    Output:


    x is True


    y is False


    z is False


    a: 11


    b: 10


    ### 4\. Special literals.


    Python has a single special literal, None.


    None is used to specify a field that has not yet been created. In Python, it is
    also used to indicate the end of a list. A Boolean literal can have either True
    or False as its value.


    Example - Special Literals


    1.  val1=10    


    2.  val2=None    


    3.  print(val1)     


    4.  print(val2)  


    Output:


    10


    None


    ### 5. Literal Collections.


    Python supports four different types of literal collections:


    *   List literals,


    *   Tuple literals,


    *   Dict literals, and


    *   Set literals.


    List:


    *   The items in a list are of various data types. Lists are mutable, which means
    they can be changed.


    *   List values are separated by commas (,) and enclosed in square brackets ([]).
    A List can hold various types of data. Python supports four different types of
    literal collections: List literals, Tuple literals, Dict literals, and Set literals.


    Example - List literals


    1.  list=[''John'',678,20.4,''Peter'']    


    2.  list1=[456,''Andrew'']    


    3.  print(list)    


    4.  print(list + list1)  


    Output:


    [''John'', 678, 20.4, ''Peter'']


    [''John'', 678, 20.4, ''Peter'', 456, ''Andrew'']


    Dictionary:


    *   The data is stored in a Python dictionary as a key-value pair.


    *   It is surrounded by curly braces, and each pair is separated by commas (,).


    Example


    1.  dict = {''name'': ''Pater'', ''Age'':18,''Roll_nu'':101}  


    2.  print(dict)  


    Output:


    {''name'': ''Pater'', ''Age'': 18, ''Roll_nu'': 101}


    Tuple:


    A tuple in Python is a collection of different data types. It is immutable, which
    means it cannot be changed after it is created.


    It is surrounded by parentheses (), and each element is separated by a comma (,).


    Example


    1.  tup = (10,20,"Dev",[2,3,4])  


    2.  print(tup)  


    Output:


    (10, 20, ''Dev'', [2, 3, 4])


    Set:


    The Python set is a collection of unordered datasets.


    It is surrounded by and each element is separated by a comma (,).


    Example: - Set Literals


    1.  set = {''apple'',''grapes'',''guava'',''papaya''}  


    2.  print(set)  


    Output:


    {''guava'', ''apple'', ''papaya'', ''grapes''}


    # Python Operators


    The operator is a symbol that is in charge of a specific operation between two
    operands. Operators are the foundations of a program, upon which the logic is
    built in a particular programming language. Python has a number of operators,
    which are listed below.


    *   Arithmetic operators


    *   Comparison operators


    *   Assignment Operators


    *   Logical Operators


    *   Bitwise Operators


    *   Membership Operators


    *   Identity Operators


    ## Arithmetic Operators'
