  trans: "\n\n# Java OR 运算符\n\n### 示例\n```java\npublic static void main(String args[]){\n\
    \  int a=10;\n  int b=5;\n  int c=20;\n  System.out.println(a<b&&a++<c);//false\
    \ && true = false\n  System.out.println(a);//10 because second condition is not\
    \ checked\n  System.out.println(a<b&a++<c);//false && true = false\n  System.out.println(a);//11\
    \ because second condition is checked\n}}\n```\n**输出：**\n```\nfalse\n10\nfalse\n\
    11\n```\n\n### Java 逻辑 || 与按位 |\n\n如果第一个条件为真，逻辑或运算符 `||` 运算符将不检查第二个条件。只有当第一个条件为假时，才会检查第二个条件。\n\
    \n无论第一个条件是真是假，按位或运算符 `|` 总是都会验证两个准则。\n\n### 示例\n```java\npublic class OperatorExample{\n\
    \  public static void main(String args[]){\n  int a=10;\n  int b=5;\n  int c=20;\n\
    \  System.out.println(a>b||a<c);//true || true = true\n  System.out.println(a>b|a<c);//true\
    \ | true = true\n  //|| vs |\n  System.out.println(a>b||a++<c);//true || true\
    \ = true\n  System.out.println(a);//10 because second condition is not checked\n\
    \  System.out.println(a>b|a++<c);//true | true = true\n  System.out.println(a);//11\
    \ because second condition is checked\n}}\n```\n**输出：**\n```\ntrue\ntrue\ntrue\n\
    10\ntrue\n11\n```\n\n# Java 三元运算符\n\n在 Java 编程中，三元运算符是 `if-then-else` 表达式的一种行替代方案。它是唯一接受三个输入的条件运算符。\n\
    \n### 示例\n```java\npublic class OperatorExample{\n  public static void main(String\
    \ args[]){\n  int a=2;\n  int b=5;\n  int min=(a<b)?a:b;\n  System.out.println(min);\n\
    }}\n```\n**输出：**\n```\n2\n```\n\n### 另一个示例\n```java\npublic class OperatorExample{\n\
    \  public static void main(String args[]){\n  int a=10;\n  int b=5;\n  int min=(a<b)?a:b;\n\
    \  System.out.println(min);\n}}\n```\n**输出：**\n```\n5\n```\n\n# Java 赋值运算符\n\n\
    Java 中常用的运算符之一是赋值运算符。它用于将左侧的操作数赋值给右侧的值。\n\n### 示例\n```java\npublic class OperatorExample{\n\
    \  public static void main(String args[]){\n  int a=10;\n  int b=20;\n  a+=4;//a=a+4\
    \ (a=10+4)\n  b-=4;//b=b-4 (b=20-4)\n  System.out.println(a);\n  System.out.println(b);\n\
    }}\n```\n**输出：**\n```\n14\n16\n```\n\n### 示例\n```java\npublic class OperatorExample{\n\
    \  public static void main(String[] args){\n  int a=10;\n  a+=3;//10+3\n  System.out.println(a);\n\
    \  a-=4;//13-4\n  System.out.println(a);\n  a*=2;//9*2\n  System.out.println(a);\n\
    \  a/=2;//18/2\n  System.out.println(a);\n}}\n```\n**输出：**\n```\n13\n9\n18\n9\n\
    ```\n\n### 示例：相加 short 类型\n```java\npublic class OperatorExample{\n  public static\
    \ void main(String args[]){\n  short a=10;\n  short b=10;\n  a+=b;//a=a+b internally\
    \ so\n  a=a+b;//Compile time error because 10+10=20 int\n  System.out.println(a);\n\
    }}\n```\n**输出：**\n`编译时错误 (Compile time error)`\n\n### 类型转换后\n```java\npublic class\
    \ OperatorExample{\n  public static void main(String args[]){\n  short a=10;\n\
    \  short b=10;\n  a=(short)(a+b);//20 which is converted to short\n  System.out.println(a);\n\
    }}\n```\n**输出：**\n```\n20\n```\n\n# Java 控制语句\n\nJava 编译器从头到尾运行代码。代码中的语句按照它们出现的顺序执行。相反，Java\
    \ 包含了控制代码流的语句。这些语句被称为控制流语句。它是 Java 最重要的方面之一，因为它确保了程序流的顺畅运行。\n\nJava 中有三种类型的控制流语句：\n\
    \n1. **决策语句**\n   - `if` 语句\n   - `switch` 语句\n2. **循环语句**\n   - `do while` 循环\n\
    \   - `while` 循环\n   - `for` 循环\n   - `for-each` 循环\n3. **跳转语句**\n   - `break`\
    \ 语句\n   - `continue` 语句\n\n## 决策语句\n\n决策语句如其名，决定了执行哪些语句以及何时执行。决策语句分析布尔表达式。\n\n\
    ###  if 语句\n\nif 语句根据布尔表达式的结果执行代码块。如果表达式为真，则执行 if 块；如果为假，则跳过。\n\n### if-else 语句\n\
    \nelse 语句与 if 语句配合使用。如果 if 的条件为假，则执行 else 块。\n\n### if-else-if 阶梯\n\nif-else-if\
