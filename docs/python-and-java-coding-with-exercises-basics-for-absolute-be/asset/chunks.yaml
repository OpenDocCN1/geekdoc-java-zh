    Output:\n*\n**\n***\n****\n*****\n\n## For-each 循环\n\n在 Java 中，`for-each` 循环用于迭代数组或集合。因为我们不需要增加值或使用下标表示法，所以它比标准的\
    \ `for` 循环更容易使用。它是基于元素而不是索引。它逐个返回每个元素。\n\n语法：\n```java\nfor(data_type variable\
