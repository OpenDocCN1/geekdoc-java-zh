    \ 30, 40, 50]\nlist2: [10, 20, 30, 60, 70]\nDifference elements:\n[40, 50]\n```\n\
    \n### 程序 2\n```python\n# list1 混合类型列表\n# list2 混合类型列表\nlist1 = [\"Amit\", \"Shukla\"\
    , 21, \"New Delhi\"]\nlist2 = [\"Aman\", \"Shukla\", 21, \"Mumbai\"]\n# 打印列表\n\
