    # Python 注释


    Python 注释是程序员必不可少的的工具。通常情况下，注释用于解释代码。如果代码得到了良好的解释，我们就可以轻松地理解它。优秀的程序员应该使用注释，因为如果以后有人想要修改代码或实现新模块，这样做将得易得多。


    其他编程语言（如 C++）使用 `/` 进行单行注释，使用 `/*.... */` 进行多行注释，而 Python 仅使用 `#` 进行单行 Python
    注释。要在代码中包含注释，请在语句或代码的开头放置井号（#`）。


    让我们来看一个例子。


    1. `# 这是一个打印语句`

    2. `print("Hello Python")`


