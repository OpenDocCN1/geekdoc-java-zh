    Name: %s, ID: %d, Country: %s\" % (emp[0], emp[1], emp[2]))`\n8. `print(\"printing\
    \ departments...\")`\n9. `print(\"Department 1:\\nName: %s, ID: %d\\nDepartment\
    \ 2:\\nName: %s, ID: %d\" % (Dep1[0], Dep1[1], Dep2[0], Dep2[1]))`\n10. `print(\"\
