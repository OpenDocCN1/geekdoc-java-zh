    amt = int(input("Enter Sale Amount: "))


    # checking conditions and calculating discount


    if(amt>0):


        if amt<=5000:


           disc = amt*0.05


        elif amt<=15000:


            disc=amt*0.12


        elif amt<=25000:


            disc=0.2 * amt


        else:


