    # First Java Program


    We will learn how to write a simple Java application in this section. After installing
    the JDK, we can quickly construct a basic hello Java application.


    You must first construct a class that contains the main function in order to create
    a simple Java programme. Let''s start with the requirements.


    Install the Java Development Kit. Download and install the JDK if you haven''t
    already done so.


    Set the jdk/bin directory''s path.


    Make a Java programme.


    Run the Java programme after it has been compiled.


