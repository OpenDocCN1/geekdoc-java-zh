    对于多行注释，我们也可以使用三引号 `"""`。字符串格式化也是通过三引号完成的。考虑以下场景。


    ## Docstring Python 注释


    docstring（文档字符串）注释通常出现在模块、函数、类或方法中。它是一个 Python 文档字符串。在随后的教程中，我们将解释类/方法。


