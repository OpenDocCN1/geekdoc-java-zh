    5. `print(str[3])`\n6. `print(str[4])`\n7. `# It returns the IndexError because\
    \ 6th index doesn't exist`\n8. `print(str[6])`\n\nOutput:\nH\nE\nL\nL\nO\nIndexError:\
    \ string index out of range\n\nThe slice operator `[]` is used to access the individual\
    \ characters of the string, as demonstrated in Python. In Python, however, we\
    \ can obtain the substring from the given string by using the `:` (colon) operator.\
    \ Consider the following illustration.\n\n![](Images/image00329.jpeg)\n\n## Python\
    \ List\n\nIn Python, a list is used to store the sequence of different types of\
    \ data. Python lists are changeable, which means we can change their elements\
    \ after they've been formed. However, Python has six data types that can be used\
    \ to store sequences, with the list being the most common and stable.\n\nA list\
    \ can be defined as a collection of distinct types of values or items. The comma\
    \ (`,`) separates the elements in the list, which are enclosed in square brackets\
    \ `[]`.\n\nThe following is an example of a list.\n\n1. `L1 = [\"John\", 102,\
    \ \"USA\"]`\n2. `L2 = [1, 2, 3, 4, 5, 6]`\n\nWhen we try to print the type of\
