    ## 12. Dynamic Memory Allocation


    We don''t need to specify the variable''s data type in Python. When we assign
    a value to a variable, the variable''s memory is automatically allocated at run
    time. If the integer value `15` is assigned to `x`, we don''t need to write `int
    x = 15`. Simply write `x = 15` on a piece of paper.


    # Install Python


    The first step toward becoming a Python developer is to understand how to install
    and update Python on a local system or computer. We''ll go over how to install
    Python on various operating systems in this topic.


    ## Installation on Windows


    To get the newest version of Python, go to `https://www.python.org/downloads/`.
    We will install Python `3.8.6` on our Windows operating system during this procedure.
    When we click the link above, we will be sent to the following website.


    Step - 1: Select - Python''s version - download.


    ![](Images/image00293.jpeg)


    Step - 2: Click - Install Now


    Double-click the downloaded executable file to bring up the following window.
    Proceed by selecting Customize installation. When you select the `Add Path` check
    box, the Python path will be automatically configured.


    ![](Images/image00294.jpeg)


    We may also select the required location and features by clicking on the customise
    installation button. Another key factor to consider is whether or not to install
    a launcher for all users.


    Step - 3 Installation in Process


    ![](Images/image00295.jpeg)


    Try running `python` from the command prompt now. If you''re using Python `3`,
    type `python -version`.


    ![](Images/image00296.jpeg)


    We''re all set to work with Python.


    # First Python Program


    In this section, we''ll go through Python''s fundamental syntax and run a simple
    program that prints Hello World to the terminal.


    Python gives us two options for running a program:


    - Using a prompt from an interactive interpreter

    - Making use of a script file


    Let''s take a closer look at each of them.


    ## Interactive interpreter prompt


    At the interactive prompt, Python allows us to execute each Python statement one
    by one. When we are concerned with the output of each line of our Python program,
    it is preferable.


    To enter interactive mode, type `python` on the terminal (or command prompt) (`python3`
    in case if you have Python `2` and Python `3` both installed on your system).


    It will open the prompt below, where we can run the Python statement and see how
    it affects the terminal.


    ![](Images/image00297.jpeg)


    Press the Enter key after finishing the print statement.


    ![](Images/image00298.jpeg)


    ## Multi-line Statements


    Multi-line statements are typed into a notepad like text editor and saved as `.py`
    files. We''ve used the Python script to describe the execution of numerous code
    lines in the following example.


    Code:


    ```python

    1. name = "Andrew Venis"

