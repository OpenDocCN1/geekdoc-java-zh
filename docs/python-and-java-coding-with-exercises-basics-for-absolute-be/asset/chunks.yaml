  trans: "\n\n*   `byte` 数据类型\n*   `char` 数据类型\n*   `short` 数据类型\n*   `int` 数据类型\n\
    *   `long` 数据类型\n*   `float` 数据类型\n*   `double` 数据类型\n\n![](img/image00347.jpeg)\n\
    \n## 布尔数据类型\n\n`Boolean` 数据类型仅存储两个潜在值：`true` 和 `false`。这种数据类型用于存储跟踪真/假情况的简单标记。\n\
    \n`Boolean` 数据类型指定单个位的数据，但其“大小”无法精确定义。\n\n示例：\n\n1. `Boolean one = false`\n\n\
    ## 字节数据类型\n\n原始数据类型 `byte` 就是其中的例子。它是一个 8 位的补码符号整数。它的取值范围为 -128 到 127（包含）。最小值为\
    \ -128，最大值为 127。默认值为 0。\n\n`byte` 数据类型用于在空间极其紧张的巨大数组中节省内存。因为 `byte` 比 `integer`\
    \ 矮四倍，所以它可以节省空间。它也可以被 `int` 数据类型替代。\n\n示例：\n\n1. `byte a = 10, byte b = -20`\n\
    \n## 短整数据类型\n\n16 位的符号补码整数是 `short` 数据类型。它的取值范围为 -32,768 到 32,767（包含）。最小值为 -32,768，最大值为\
    \ 32,767。默认值为 0。\n\n`short` 数据类型像 `byte` 数据类型一样可以节省内存。`short` 数据类型的大小是整数的两倍。\n\
    \n示例：\n\n1. `short s = 10000, short r = -5000`\n\n## 整数数据类型\n\n32 位的符号补码整数由 `int`\
    \ 数据类型表示。它的取值范围为 -2,147,483,648 (-2³¹ -1) 到 2,147,483,647 (2³¹ -1)（包含）。最小值为 -2,147,483,648，最大值为\
    \ 2,147,483,647。默认值为 0。\n\n除非有内存限制，否则 `int` 数据类型通常被选择为整数值的默认数据类型。\n\n示例：\n\n1.\
    \ `int a = 100000, int b = -200000`\n\n## 长整数数据类型\n\n64 位的补码整数是 `long` 数据类型。它的取值范围为\
    \ -9,223,372,036,854,775,808 (-2⁶³ -1) 到 9,223,372,036,854,775,807 (2⁶³ -1)（包含）。它的最小值和最大值为\
    \ -9,223,372,036,854,775,808 和 9,223,372,036,854,775,807。默认值为 0。当你需要比 `int` 提供的更大的取值范围时，应该利用\
    \ `long` 数据类型。\n\n示例：\n\n1. `long a = 100000L, long b = -200000`\n\n## 单精度浮点类型\n\
    \n`float` 数据类型是 32 位 IEEE 754 单精度浮点数。它具有无限的取值范围。如果你需要在大型浮点整数数组中节省内存，请使用 `float`（而不是\
    \ `double`）。对于精确数字（例如货币），永远不应使用 `float` 数据类型。`0.0F` 是默认值。\n\n示例：\n\n1. `float\
    \ f1 = 234.5f`\n\n## 双精度浮点类型\n\n`double` 数据类型是 64 位 IEEE 754 双精度浮点数。它具有无限的取值范围。像\
    \ `float` 一样，`double` 数据类型常用于小数。对于精确数值（例如货币），永远不应利用 `double` 数据类型。`0.0d` 是默认值。\n\
    \n示例：\n\n1. `double d1 = 12.3`\n\n## 字符类型\n\n单个 16 位 Unicode 字符由 `char` 数据类型表示。它的取值范围从\
    \ 'u0000'（或 0）到 'uffff'（或 65,535，包含）。字符使用 `char` 数据类型存储。\n\n示例：\n\n1. `char letterA\
    \ = 'A'`\n\n# Java 运算符\n\n在 Java 中，运算符是执行操作的符号。例如，`+`、`-`、`*`、`/` 等。\n\n在 Java\
    \ 中有许多不同的运算符，列如下：\n\n*   一元运算符\n*   算术运算符\n*   移位运算符\n*   关系运算符\n*   位运算符\n* \
    \  逻辑运算符\n*   三元运算符\n*   赋值运算符\n\n## Java 运算符优先级\n\n![](img/image00348.jpeg)\n\
    \n![](img/image00349.jpeg)\n\n### 一元运算符\n\nJava 一元运算符只需要一个操作数。一元运算符用于执行各种任务。\n\
    \n![](img/image00350.jpeg)\n\n### 一元运算符示例：++ 和 --\n\n```java\npublic class OperatorExample{\n\
    \  public static void main(String args[]){\n  int x=10;\n  System.out.println(x++);\
    \ //10\n  System.out.println(++x);//12\n  System.out.println(x--);//12\n  System.out.println(--x);//10\n\
    \  }\n}\n```\n输出：\n```\n10\n12\n12\n10\n```\n\n### 一元运算符示例 2：++ 和 --\n\n```java\n\
    public class OperatorExample{\n  public static void main(String args[]){\n  int\
    \ a=10;\n  int b=10;\n  System.out.println(a++ + ++a);//10+12=22\n  System.out.println(b++);11\n\
    \  }\n}\n```\n输出：\n22\n11\n\n### 一元运算符示例：~ 和 !\n\n```java\npublic class OperatorExample{\n\
    \  public static void main(String args[]){\n  int a=10;\n  int b=-10;\n  boolean\
    \ c=true;\n  boolean d=false;\n  System.out.println(~a);//-11（值的取反）\n  System.out.println(~b);//9（正值的取反）\n\
    \  System.out.println(!c);//false（值的取反）\n  System.out.println(!d);//true（值的取反）\n\
    \  }\n}\n```\n输出：\n```\n-11\n9\nfalse\ntrue\n```\n\n### 算术运算符\n\n加法、减法、乘法和除法都是通过\
    \ Java 操作执行的。它们作为基础数学过程。\n\n### 算术运算符示例\n\n```java\npublic class OperatorExample{\n\
    \  public static void main(String args[]){\n  int a=10;\n  int b=5;\n  System.out.println(a+b);//15\n\
    \  System.out.println(a-b);//5\n  System.out.println(a*b);//50\n  System.out.println(a/b);//2\n\
    \  System.out.println(a%b);//0\n  }\n}\n```\n输出：\n```\n15\n5\n50\n2\n0\n```\n\n\
    ### 算术运算符示例：表达式\n\n```java\npublic class OperatorExample{\n  public static void\
    \ main(String args[]){\n  System.out.println(10*10/5+3/2);\n  }\n}\n```\n输出：\n\
    ```\n21\n```\n\n### Java 左移运算符\n\nJava 左移运算符将值中的所有位向左移动指定的次数。\n\n### 左移运算符示例\n\
    \n```java\npublic class OperatorExample{\n  public static void main(String args[]){\n\
    \  System.out.println(10<<2);//10*2²=40\n  System.out.println(10<<3);//10*2³=80\n\
    \  System.out.println(20<<2);//20*2²=80\n  System.out.println(15<<4);//15*2⁴=240\n\
    \  }\n}\n```\n输出：\n```\n40\n80\n80\n240\n```\n\n### - 右移运算符\n\nJava 右移运算符 `>>`\
    \ 将左操作数的值向右移动右操作数指定的位数。\n\n### 右移运算符示例\n\n```java\npublic class OperatorExample{\n\
    \  public static void main(String args[]){\n  System.out.println(10>>2);//10/2²=2\n\
    \  System.out.println(20>>2);//20/2²=5\n  System.out.println(20>>3);//20/2³=2\n\
    \  }\n}\n```\n输出：\n```\n2\n5\n2\n```\n\n### 移位运算符示例：>> vs >>>\n\n```java\npublic\
    \ class OperatorExample{\n  public static void main(String args[]){\n  // 对于正数，>>\
    \ 和 >>> 作用相同\n  System.out.println(20>>2);\n  System.out.println(20>>>2);\n  //\
    \ 对于负数，>>> 将符号位（MSB）变为 0\n  System.out.println(-20>>2);\n  System.out.println(-20>>>2);\n\
    \  }\n}\n```\n输出：\n```\n5\n5\n-5\n1073741819\n```\n\n### Java 与运算符示例：逻辑 && 和 位运算符\
    \ &\n\n如果第一个条件为假，逻辑 `&&` 运算符不会验证第二个条件。只有当第一个条件为真时，才会检查第二个条件。\n\n无论第一个条件是真是假，位运算符\
    \ `&` 总是会验证两个标准。\n\n```java\npublic class OperatorExample{\n  public static void\
    \ main(String args[]){\n  int a=10;\n  int b=5;\n  int c=20;\n  System.out.println(a<b&&a<c);//false\
    \ && true=false\n  System.out.println(a<b&a<c);//false & true=false\n  }\n}\n\
    ```\n输出：\n```\nfalse\nfalse\n```\n\n"
- fmt: "\n# Java OR Operator\n\n### Example\n```java\npublic static void main(String\
    \ args[]){\n  int a=10;\n  int b=5;\n  int c=20;\n  System.out.println(a<b&&a++<c);//false\
    \ && true = false\n  System.out.println(a);//10 because second condition is not\
    \ checked\n  System.out.println(a<b&a++<c);//false && true = false\n  System.out.println(a);//11\
    \ because second condition is checked\n}}\n```\n**Output:**\n```\nfalse\n10\n\
    false\n11\n```\n\n### Java Logical || and Bitwise |\n\nIf the first condition\
    \ is true, the logical `||` operator does not examine the second condition. Only\
    \ if the first condition is false is the second condition checked.\n\nWhether\
    \ the first condition is true or false, the bitwise `|` operator always verifies\
    \ both criteria.\n\n### Example\n```java\npublic class OperatorExample{\n  public\
    \ static void main(String args[]){\n  int a=10;\n  int b=5;\n  int c=20;\n  System.out.println(a>b||a<c);//true\
    \ || true = true\n  System.out.println(a>b|a<c);//true | true = true\n  //|| vs\
    \ |\n  System.out.println(a>b||a++<c);//true || true = true\n  System.out.println(a);//10\
    \ because second condition is not checked\n  System.out.println(a>b|a++<c);//true\
    \ | true = true\n  System.out.println(a);//11 because second condition is checked\n\
    }}\n```\n**Output:**\n```\ntrue\ntrue\ntrue\n10\ntrue\n11\n```\n\n# Java Ternary\
    \ Operator\n\nIn Java programming, the Ternary operator is a one-line substitute\
    \ for the `if-then-else` expression. It's the only conditional operator that accepts\
    \ three inputs.\n\n### Example\n```java\npublic class OperatorExample{\n  public\
    \ static void main(String args[]){\n  int a=2;\n  int b=5;\n  int min=(a<b)?a:b;\n\
    \  System.out.println(min);\n}}\n```\n**Output:**\n```\n2\n```\n\n### Another\
    \ Example\n```java\npublic class OperatorExample{\n  public static void main(String\
    \ args[]){\n  int a=10;\n  int b=5;\n  int min=(a<b)?a:b;\n  System.out.println(min);\n\
    }}\n```\n**Output:**\n```\n5\n```\n\n# Java Assignment Operator\n\nOne of the\
    \ most used operators in Java is the assignment operator. It's used to assign\
    \ the operand on the left to the value on the right.\n\n### Example\n```java\n\
    public class OperatorExample{\n  public static void main(String args[]){\n  int\
    \ a=10;\n  int b=20;\n  a+=4;//a=a+4 (a=10+4)\n  b-=4;//b=b-4 (b=20-4)\n  System.out.println(a);\n\
    \  System.out.println(b);\n}}\n```\n**Output:**\n```\n14\n16\n```\n\n### Example\n\
    ```java\npublic class OperatorExample{\n  public static void main(String[] args){\n\
    \  int a=10;\n  a+=3;//10+3\n  System.out.println(a);\n  a-=4;//13-4\n  System.out.println(a);\n\
    \  a*=2;//9*2\n  System.out.println(a);\n  a/=2;//18/2\n  System.out.println(a);\n\
    }}\n```\n**Output:**\n```\n13\n9\n18\n9\n```\n\n### Example: Adding short\n```java\n\
    public class OperatorExample{\n  public static void main(String args[]){\n  short\
    \ a=10;\n  short b=10;\n  a+=b;//a=a+b internally so\n  a=a+b;//Compile time error\
    \ because 10+10=20 int\n  System.out.println(a);\n}}\n```\n**Output:**\n`Compile\
    \ time error`\n\n### After type cast\n```java\npublic class OperatorExample{\n\
    \  public static void main(String args[]){\n  short a=10;\n  short b=10;\n  a=(short)(a+b);//20\
    \ which is converted to short\n  System.out.println(a);\n}}\n```\n**Output:**\n\
    ```\n20\n```\n\n# Java Control Statements\n\nThe Java compiler runs the code from\
    \ beginning to end. The statements in the code are executed in the order they\
    \ occur. Java, on the other hand, includes statements for controlling the flow\
    \ of code. Control flow statements are what they're called. It is one of Java's\
    \ most important aspects, as it ensures a smooth programme flow.\n\nThere are\
    \ three sorts of control flow statements in Java:\n\n1. **Decision Making statements**\n\
    \   - `if` statements\n   - `switch` statement\n2. **Loop statements**\n   - `do\
    \ while` loop\n   - `while` loop\n   - `for` loop\n   - `for-each` loop\n3. **Jump\
    \ statements**\n   - `break` statement\n   - `continue` statement\n\n## Decision-Making\
    \ statements\n\nDecision-making statements, as the name implies, decide which\
    \ statements to execute and when. Decision-making statements analyse the Boolean\
    \ expression and control the programme based on the condition's result. In Java,\
    \ there are two sorts of decision-making statements: `if` and `switch`.\n\n###\
    \ 1) If Statement\n\nTo assess a condition in Java, use the `if` statement. Depending\
    \ on the circumstances, the program's control is diverted. The `if` statement's\
    \ condition returns a Boolean value, either true or false. There are four forms\
    \ of `if`-statements in Java, as shown below:\n\n1. Simple `if` statement\n2.\
    \ `if-else` statement\n3. `if-else-if` ladder\n4. Nested `if`-statement\n\n###\
    \ 1) Simple if statement\n\nIt is the most fundamental of all Java control flow\
    \ statements. It evaluates a Boolean statement and, if the expression is true,\
    \ allows the programme to begin a block of code. The `if` statement's syntax is\
    \ seen below.\n\n```java\nif(condition) {\n  statement 1; //executes when condition\
    \ is true\n}\n```\n\nConsider the following java code example, in which the `if`\
    \ statement is utilised:\n\n**Student.java**\n```java\npublic class Student {\n\
    \  public static void main(String[] args) {\n    int x = 10;\n    int y = 12;\n\
    \    if(x+y > 20) {\n      System.out.println(\"x + y is greater than 20\");\n\
    \    }\n  }\n}\n```\n**Output:**\n```\nx + y is greater than 20\n```\n\n### 2)\
    \ if-else statement\n\nThe `if-else` statement is an expansion of the `if`-statement\
    \ that employs the `else` block of code. If the `if-condition` block's is evaluated\
    \ as false, the `else` block is executed.\n\n**Syntax:**\n```java\nif(condition)\
    \ {\n  statement 1; //executes when condition is true\n} else {\n  statement 2;\
    \ //executes when condition is false\n}\n```\n\n**EXAMPLE**\n```java\npublic class\
    \ Student {\n  public static void main(String[] args) {\n    int x = 0;\n    int\
    \ y = 12;\n    if(x+y < 10) {\n      System.out.println(\"x + y is less than 10\"\
    );\n    } else {\n      System.out.println(\"x + y is greater than 20\");\n  \
    \  }\n  }\n}\n```\n**Output:**\n```\nx + y is greater than 20\n```\n\n### 3) if-else-if\
    \ ladder\n\nThe `if-else-if` statement is made up of an `if` statement and several\
    \ `else-if` statements. In other words, a decision tree is created by a sequence\
    \ of `if` statements in which the computer can enter the block of code where the\
    \ condition is true. At the end of the chain we may define an `else` statement.\n\
    \n**Syntax:**\n```java\nif(condition1) {\n  statement 1; //executes when condition\
    \ 1 is true\n} else if(condition2) {\n  statement 2; //executes when condition\
    \ 2 is true\n} else {\n  statement 3; //executes when all conditions are false\n\
    }\n```\n\n**EXAMPLE**\n**Student.java**\n```java\npublic class Student {\n  public\
    \ static void main(String[] args) {\n    String city = \"Delhi\";\n    if(city\
    \ == \"Meerut\") {\n      System.out.println(\"city is meerut\");\n    } else\
    \ if(city == \"Noida\") {\n      System.out.println(\"city is noida\");\n    }\
    \ else if(city == \"Agra\") {\n      System.out.println(\"city is agra\");\n \
    \   } else {\n      System.out.println(city);\n    }\n  }\n}\n```\n**Output:**\n\
    ```\nDelhi\n```\n\n### 4) Nested if-statement\n\nThe `if` statement can contain\
    \ an `if` or `if-else` statement inside another `if` or `else-if` statement in\
    \ nested if-statements.\n\n**Syntax:**\n```java\nif(condition1) {\n  statement\
    \ 1; //executes when condition 1 is true\n  if(condition2) {\n    statement 2;\
    \ //executes when condition 2 is true\n  } else {\n    statement 2; //executes\
    \ when condition 2 is false\n  }\n}\n```\n"
