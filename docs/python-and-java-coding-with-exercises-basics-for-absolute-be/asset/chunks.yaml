    \n# Python 列表\n## 在列表中添加、删除元素\n### Python 列表 `append()` 方法\n**语法：** `list.append(element)`\n\
    在这里，`list` 是列表名。`Append()` 是用于向列表添加元素（对象或项）的方法名称。\n\n### 程序\n```python\n# 定义带有整数和字符串元素的列表\n\
    list = [10, 20, 30, \"New Delhi\", \"Mumbai\"]\n# 打印列表\nprint \"List elements:\
    \ \", list\n# 添加元素\nlist.append(40)\nlist.append(50)\nlist.append(\"Chennai\"\
