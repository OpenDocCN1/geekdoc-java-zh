    \ = [1, 2, \"Peter\", 4.50, \"Ricky\", 5, 6]`\n2. `b = [1, 2, \"Peter\", 4.50,\
    \ \"Ricky\", 5, 6]`\n3. `a == b`\n\nOutput:\nTrue\n\nLet's take a closer look\
