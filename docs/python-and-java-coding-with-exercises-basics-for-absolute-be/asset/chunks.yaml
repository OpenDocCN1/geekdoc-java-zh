    # Difference between JDK, JRE, and JVM


    Before moving on to Java, we must first understand the differences between JDK,
    JRE, and JVM. Here''s a quick summary of JVM.


    Go to the following page if you want to learn more about the Java Virtual Machine
    in depth. Let''s look at the distinctions between the JDK, JRE, and JVM first.


    ### JVM


    JVM (Java Virtual Machine) is a machine that is abstract. Because it does not
    exist physically, it is called a virtual machine. It''s a specification that creates
    a runtime environment for Java bytecode to run in. It can also run applications
    written in other languages that have been compiled into Java bytecode.


    For a wide range of hardware and software platforms, JVMs are available. Because
    each operating system''s setup differs, JVM, JRE, and JDK are platform dependent.
    Java, on the other hand, is platform agnostic. The JVM is divided into three parts:
    specification, implementation, and instance.


    The JVM''s principal functions are as follows:


    *   Loads code


    *   Verifies code


    *   Executes code


    *   Provides runtime environment


    ### JRE


    The Java Runtime Environment (JRE) is an acronym for Java Runtime Environment.
    It''s also referred to as Java RTE. The Java Runtime Environment (JRE) is a collection
    of software tools for creating Java applications. It''s responsible for creating
    the runtime environment. It is the JVM implementation. It is a real thing. It
    comprises a collection of libraries as well as other files that JVM uses during
    execution.


    ### JDK


    The term JDK stands for Java Development Kit. The Java Development Kit (JDK) is
    a software development environment for creating Java programmes and applets. It
    is a real thing. It includes JRE as well as developer tools.


    # Java Variables


    A variable is a container that holds the value during the execution of a Java
    programme. A data type is assigned to a variable.


    The term "variable" refers to the name of a memory region. Local, instance, and
    static variables are the three types of variables in Java.


    In Java, data types are divided into two categories: primitive and non-primitive.


    ## Variable


    A variable is the name of a memory-allocated reserved space. To put it another
    way, it''s the name of the memory place. It''s made out of the words "variy +
    ability," which signifies that its value can be modified.


    1.  int data=50;//Here data is variable  


    ### Types of Variables


    *   local variable


    *   instance variable


    *   static variable


    #### 1) Local Variable


    A local variable is a variable declared within the method''s body. This variable
    can only be used within that method, and the other methods in the class are unaware
    that it exists.


    The keyword "static" cannot be used to declare a local variable.


    #### 2) Instance Variable


    An instance variable is a variable declared inside the class but outside the method
    body. It hasn''t been declared static.


    Because its value is instance-specific and not shared across instances, it''s
    called an instance variable.


    #### 3) Static variable


    A static variable is one that has been declared as static. It''s not possible
    for it to be local. You can make a single duplicate of the static variable and
    share it across all of the class''s instances. Static variables are only allocated
    memory once, when the class is loaded into memory.


