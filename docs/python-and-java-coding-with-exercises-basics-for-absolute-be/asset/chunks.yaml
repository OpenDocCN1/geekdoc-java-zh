    ## What is Java


    Java is a platform as well as a programming language. Java is a high-level programming
    language that is also robust, object-oriented, and secure.


    Java was created in 1995 by Sun Microsystems (which is now a division of Oracle).
    The founder of Java, James Gosling, is recognised as the "Father of Java." It
    was known as Oak before Java. Because Oak was already a recognised business, James
    Gosling and his team decided to alter the name to Java.


    Platform: A platform is any hardware or software environment in which a programme
    runs. Java is referred to as a platform because it has a runtime environment (JRE)
    and API.


    ## Java Example


    Let''s take a look at an example of Java programming. The next page contains a
    full description of the Hello Java example.


    Simple.java


    1.  class Simple{  


    2.  public static void main(String args[]){  


    3.  System.out.println("Hello Java");  


    4.  }  


    5.  }


    ## Types of Java Applications


    Java programming can be used to construct four different sorts of applications:


    #### 1) Standalone Application


    Desktop applications and window-based programmes are examples of stand-alone applications.
    These are typical programmes that must be installed on each machine. Media player,
    antivirus, and other standalone applications are examples. In Java, AWT and Swing
    are used to create standalone apps.


    #### 2) Web Application


    A web application is an application that runs on the server and generates a dynamic
    page. Servlet, JSP, Struts, Spring, Hibernate, JSF, and other technologies are
    now used to develop web applications in Java.


    #### 3) Enterprise Application


    A distributed application, such as banking software, is referred to as an enterprise
    application. High-level security, load balancing, and clustering are just a few
    of the benefits. EJB is a Java framework for developing enterprise applications.


    #### 4) Mobile Application


    A mobile application is a programme designed specifically for mobile devices.
    Currently, mobile applications are developed using Android and Java ME.


    ## Java Platforms


    Java is available on four different platforms or editions:


    #### 1) Java SE (Java Standard Edition)


    It''s a Java programming environment. Java programming APIs like java.lang, java.io,
    java.net, java.util, java.sql, and java.math are included. OOPs, String, Regex,
    Exception, Inner classes, Multithreading, I/O Stream, Networking, AWT, Swing,
    Reflection, Collection, and other key subjects are covered.


    #### 2) Java EE (Java Enterprise Edition)


    It''s a business platform that''s primarily used for creating online and corporate
    apps. It is constructed using the Java SE platform. Servlet, JSP, Web Services,
    EJB, JPA, and other subjects are covered.


    #### 3) Java ME (Java Micro Edition)


    It''s a mobile application-focused microplatform.


    #### 4) JavaFX


    It''s a programming language that''s used to create rich online apps. It makes
    use of a simple user interface API.


    # JAVA CODING


    # Features of Java


    The major goal of the Java programming language''s development was to make it
    portable, simple, and secure. Apart from that, there are a number of good aspects
    that contribute to the language''s popularity. Java buzzwords refer to the aspects
    of the language.


    The following is a list of the most essential characteristics of the Java programming
    language.


    ![](Images/image00342.jpeg)


    ### Simple


    Java is a fairly straight language to learn, with a grammar that is simple, clear,
    and easy to comprehend. Java is a simple programming language, according to Sun
    Microsystem, because:


    Java syntax is based on C++ (making it easier for programmers to pick up after
    they''ve learned C++).


    Many difficult and rarely-used features, such as explicit pointers and operator
    overloading, have been eliminated from Java.


    Because Java has Automatic Garbage Collection, there is no need to remove unreferenced
    objects.


    ### Object-oriented


    Java is a computer language that focuses on objects. In Java, everything is an
    object. Object-oriented programming refers to the organisation of software as
    a collection of various types of objects that include both data and behaviour.


    Object-oriented programming (OOPs) is a software development and maintenance technique
    that follows a set of rules.


    ### Platform Independent


    Java is platform independent in contrast to other languages such as C, C++, and
    others, which are compiled into platform-specific machines, whereas Java is a
    write-once, run-anywhere language. The hardware or software environment in which
    a programme runs is referred to as a platform.


    Software-based and hardware-based platforms are the two sorts of platforms. Java
    is a platform that is built on software.


    ### Secured


    The security of Java is its most well-known feature. We can create anti-virus
    solutions using Java. Because of the following, Java is protected:


    There is no specific pointing device.


    Java programmes are run in a sandbox environment.


    Security Manager is a component of the Java Runtime Environment (JRE) that is
    used to dynamically load Java classes into the Java Virtual Machine. It improves
    security by isolating the package for local file system classes from those imported
    from network sources.


    Bytecode Verifier: It examines code fragments for illegal code that could compromise
    object access privileges.


    Security Manager:  It determines the resources a class has access to, such as
    reading and writing to the local disc.


    ### Robust


    Robust''s English mining industry is thriving. Java is a robust programming language
    because:


    It makes extensive use of memory management.


    There aren''t any pointers, hence there aren''t any security issues.


    Automatic garbage collection is provided by Java and operates on the Java Virtual
    Machine to get rid of things that are no longer in use by a Java application.


    In Java, there are exception handling and type checking mechanisms. All of these
    factors contribute to Java''s robustness.


    ### Architecture-neutral


    Because there are no implementation-dependent aspects in Java, such as the size
    of primitive types, it is architecture neutral.


    In C programming, the int data type takes up two bytes in 32-bit architecture
    and four bytes in 64-bit architecture. In Java, however, it takes up 4 bytes of
    memory on both 32-bit and 64-bit architectures.


    ### Portable


    Java is portable because it allows you to move the Java bytecode from one platform
    to another. It does not necessitate any kind of implementation.


    ### High-performance


    Because Java bytecode is "near" to native code, it is faster than other traditional
    interpreted programming languages. It is nevertheless slower than a compiled language
    (for example, C++). Because Java is an interpreted language, it is slower than
    compiled languages such as C, C++, and others.


