  trans: "\n因为它允许用户在 Java 中构建分布式程序，因此它是分布式的。在开发分布式应用程序时，使用了 `RMI` 和 `EJB`。这种 Java\
    \ 能力允许我们通过调用连接到互联网的任何系统中的方法来访问文件。\n\n### 多线程\n线程就像一个在后台运行的第二个软件。通过定义许多线程，我们可以设计出同时处理多个任务的\
    \ Java 应用程序。多线程的根本优势是每个线程不占用内存。它具有一个共享的内存空间。线程对于多媒体、Web 应用程序和其他应用程序至关重要。\n\n###\
    \ 动态\nJava 是一种动态编程语言。它允许类被动态加载。这意味着类仅在需要时才被加载。它还支持用其原生语言 `C` 和 `C++` 编写的函数。\n\n\
    Java 允许动态编译和内存管理（垃圾回收）。\n\n# C++ vs Java\n`C++` 和 `Java` 编程语言有很多许多相似之处和不同之处。以下是\
    \ `C++` 和 `Java` 之间最重要的区别的总结：\n\n![](img/image00343.jpeg)\n![](img/image00344.jpeg)\n\
    ![](img/image00345.jpeg)\n![](img/image00346.jpeg)\n\n## C++ 程序示例\n文件: `main.cpp`\n\
    \n```cpp\n1. #include <iostream>\n2. using namespace std;\n3. int main() {\n4.\
    \ cout << \"Hello C++ Programming\";\n5. return 0;\n6. }\n```\n输出：\nHello C++\
    \ Programming\n\n## Java 程序示例\n文件: `Simple.java`\n\n```java\n1. class Simple{\n\
    2. public static void main(String args[]) {\n3. System.out.println(\"Hello Java\"\
    );\n4. }\n5. }\n```\n输出：\nHello Java\n\n# 第一个 Java 程序\n在这一节中，我们将学习如何编写一个简单的 Java\
    \ 应用程序。在安装 `JDK` 后，我们可以快速构建一个基础的 hello Java 应用程序。\n\n为了创建一个简单的 Java 程序，你必须构造构造包含\
    \ `main` 函数的类。让我们从要求开始。\n\n1. 安装 Java 开发工具包 (JDK)。如果你还没有安装，请下载并安装 `JDK`。\n2. 设置\
    \ `jdk/bin` 目录的路径。\n3. 制作 Java 程序。\n4. 在编译后运行该 Java 程序。\n\n### Hello World 示例\n\
    ```java\n1. class Simple{\n2. public static void main(String args[]) {\n3. System.out.println(\"\
    Hello Java\");\n4. }\n5. }\n```\n| 编译：`javac Simple.java` |\n| 执行：`java Simple`\
    \ |\n输出：\nHello Java\n\n# JDK, JRE 和 JVM 的区别\n在继续 Java 之前，我们必须首先理解 `JDK`、`JRE`\
    \ 和 `JVM` 之间的区别。这里是 `JVM` 的快速总结。\n\n如果你想深入学习 Java 虚拟机，请访问以下页面。让我们先来看 `JDK`、`JRE`\
    \ 和 `JVM` 的区别。\n\n### JVM\n`JVM`（Java 虚拟机）是一个抽象的机器。因为它在物理上不存在，所以被称为虚拟机。它是一个为 Java\
    \ 字节码运行创建一个运行时环境的规范。它还可以运行用其他语言编译成 Java 字节码的应用程序。\n\n对于广泛的硬件和软件平台，都有相应的 `JVMs`。由于每个操作系统的设置不同，`JVM`、`JRE`\
    \ 和 `JDK` 是依赖于平台的。相反，Java 是平台无关的。`JVM` 分为三个部分：规范、实现和实例。\n\n`JVM` 的主要功能如下：\n* 加载代码\n\
    * 验证代码\n* 执行代码\n* 提供运行时环境\n\n### JRE\nJava 运行环境 (`JRE`) 是 Java Runtime Environment\
    \ 的缩写。它也被称为 Java `RTE`。Java 运行环境 (`JRE`) 是用于创建 Java 应用程序的软件工具集。它负责创建运行时环境。它是 `JVM`\
    \ 的实现。它是真实存在的。它由一组库以及 `JVM` 在执行期间使用的其他文件组成。\n\n### JDK\n`JDK` 术语代表 Java Development\
    \ Kit（Java 开发包）。Java 开发工具包 (`JDK`) 是用于创建 Java 程序和 applet 的软件开发环境。它是真实存在的。它包含了\
    \ `JRE` 以及开发者工具。\n\n# Java 变量\n变量是一个在 Java 程序执行期间持有值的容器。变量被分配一个数据类型。\n\n“变量”一词是指内存区域的名称。局部变量、实例变量和静态变量是\
    \ Java 中的三种类型的变量。\n\n在 Java 中，数据类型分为两类：基本类型和非基本类型。\n\n## 变量\n变量是内存分配的保留空间的名称。换句话说，它是内存位置的名称。它由“vari\
    \ + ability”这两个词组成，意味着它的值是可以修改的。\n\n1. `int data=50;` // 这里 `data` 是变量\n\n###\
    \ 变量类型\n* 局部变量\n* 实例变量\n* 静态变量\n\n#### 1) 局部变量\n局部变量是在方法体内部声明的变量。该变量只能在该方法内部使用，类的其他方法并不知道它的存在。\n\
    \n不能使用 `static` 关键字来声明局部变量。\n\n#### 2) 实例变量\n实例变量是声明在类内部方法外部的变量。它没有 `static` 关键字。\n\
    \n#### 3) 静态变量\n静态变量是使用 `static` 关键字的变量。它的值在所有实例中共享，并且在类加载时被初始化。\n\n静态变量是声明在类内部方法外部的变量。它的值在所有实例中共享，并且在类加载时被初始化。\n\
    \n### 变量 变量在类中定义\n```java\nclass A {\n    int data=50; // 这里的 data 是变量\n}\n```\n\
    \n### 局部变量示例\n```java\nclass A {\n    void method() {\n        int data=50; //\
    \ 这里的 data 是局部变量\n        // 只能在方法方法中使用\n    }\n}\n```\n\n### 实例变量示例\n```java\n\
    class A {\n    int data=50; // 这里的 data 是实例变量\n    void method() {\n        System.out.println(data);\n\
    \    }\n}\n```\n\n### 静态变量示例\n```java\nclass A {\n    static int data=50; // 这里的\
    \ data 是静态变量\n    void method() {\n        System.out.println(data);\n    }\n\
    }\n```\n"
- fmt: "\n*   `byte` data type\n*   `char` data type\n*   `short` data type\n*   `int`\
    \ data type\n*   `long` data type\n*   `float` data type\n*   `double` data type\n\
    \n![](Images/image00347.jpeg)\n\n## Boolean Data Type\n\nOnly two potential values\
    \ are stored in the `Boolean` data type: `true` and `false`. Simple flags that\
    \ track true/false circumstances are stored in this data type.\n\nThe `Boolean`\
    \ data type specifies a single bit of data, but its \"size\" cannot be precisely\
    \ defined.\n\nExample:\n\n1. `Boolean one = false`\n\n## Byte Data Type\n\nThe\
    \ primitive data type `byte` is an example of this. It's an 8-bit two's complement\
    \ signed integer. It has a value range of -128 to 127 (inclusive). It has a minimum\
    \ of -128 and a high of 127. It has a value of 0 by default.\n\nThe `byte` data\
    \ type is used to preserve memory in huge arrays where space is at a premium.\
    \ Because a `byte` is four times smaller than an `integer`, it saves space. It\
    \ can also be substituted with the `int` data type.\n\nExample:\n\n1. `byte a\
    \ = 10, byte b = -20`\n\n## Short Data Type\n\nA 16-bit signed two's complement\
    \ integer is the `short` data type. It has a value range of -32,768 to 32,767\
    \ (inclusive). It has a minimum of -32,768 and a maximum of 32,767. It has a value\
    \ of 0 by default.\n\nThe `short` data type, like the `byte` data type, can be\
    \ used to save memory. A `short` data type is twice the size of an integer.\n\n\
    Example:\n\n1. `short s = 10000, short r = -5000`\n\n## Int Data Type\n\nA 32-bit\
    \ signed two's complement integer is represented by the `int` data type. Its range\
    \ of values is -2,147,483,648 (-2^31 -1) to 2,147,483,647 (2^31 -1). (inclusive).\
    \ It has a minimum of -2,147,483,648 and a maximum of 2,147,483,647. It has a\
    \ value of 0 by default.\n\nUnless there is a memory constraint, the `int` data\
    \ type is usually chosen as the default data type for integral values.\n\nExample:\n\
    \n1. `int a = 100000, int b = -200000`\n\n## Long Data Type\n\nA 64-bit two's\
    \ complement integer is the `long` data type. It has a value range of -9,223,372,036,854,775,808\
    \ (-2^63 -1) to 9,223,372,036,854,775,807 (2^63 -1). (inclusive). Its lowest and\
    \ maximum values are -9,223,372,036,854,775,808 and 9,223,372,036,854,775,807.\
    \ It has a value of 0 by default. When you need a larger range of values than\
    \ `int` can supply, you should utilize the `long` data type.\n\nExample:\n\n1.\
    \ `long a = 100000L, long b = -200000`\n\n## Float Data Type\n\nThe `float` data\
    \ type is a 32-bit IEEE 754 floating point with single precision. It has an infinite\
    \ value range. If you need to preserve memory in big arrays of floating point\
    \ integers, use a `float` (rather than a `double`). For precise numbers, such\
    \ as currency, the `float` data type should never be used. `0.0F` is the default\
    \ value.\n\nExample:\n\n1. `float f1 = 234.5f`\n\n## Double Data Type\n\nA `double`\
    \ data type is a 64-bit IEEE 754 floating point with double precision. It has\
    \ an infinite value range. Like `float`, the `double` data type is commonly used\
    \ for decimal values. For precise values, such as currency, the `double` data\
    \ type should never be utilized. `0.0d` is the default value.\n\nExample:\n\n\
    1. `double d1 = 12.3`\n\n## Char Data Type\n\nA single 16-bit Unicode character\
    \ is represented by the `char` data type. It has a value range of 'u0000' (or\
    \ 0) to 'uffff' (or 65,535 inclusive). Characters are stored using the `char`\
    \ data type.\n\nExample:\n\n1. `char letterA = 'A'`\n\n# Operators in Java\n\n\
    In Java, an operator is a symbol that performs operations. For instance, `+`,\
    \ `-`, `*`, `/`, and so on.\n\nIn Java, there are many different types of operators,\
    \ which are listed below:\n\n*   Unary Operator\n*   Arithmetic Operator\n*  \
    \ Shift Operator\n*   Relational Operator\n*   Bitwise Operator\n*   Logical Operator\n\
    *   Ternary Operator\n*   Assignment Operator\n\n## Java Operator Precedence\n\
    \n![](Images/image00348.jpeg)\n\n![](Images/image00349.jpeg)\n\n### Java Unary\
    \ Operator\n\nOnly one operand is required for the Java unary operators. Unary\
    \ operators are employed to carry out a variety of tasks.\n\n![](Images/image00350.jpeg)\n\
    \n### Java Unary Operator\n\n### Example: ++ and --\n\n```java\npublic class OperatorExample{\n\
    \  public static void main(String args[]){\n  int x=10;\n  System.out.println(x++);//10\
    \ (11)\n  System.out.println(++x);//12\n  System.out.println(x--);//12 (11)\n\
    \  System.out.println(--x);//10\n  }\n}\n```\nOutput:\n```\n10\n12\n12\n10\n```\n\
    \n### Java Unary Operator: Example 2: ++ and --\n\n```java\npublic class OperatorExample{\n\
    \  public static void main(String args[]){\n  int a=10;\n  int b=10;\n  System.out.println(a++\
    \ + ++a);//10+12=22\n  System.out.println(b++ + b++);10+11=21\n  }\n}\n```\nOutput:\n\
    ```\n22\n21\n```\n\n### Java Unary Operator Example: ~ and !\n\n```java\npublic\
    \ class OperatorExample{\n  public static void main(String args[]){\n  int a=10;\n\
    \  int b=-10;\n  boolean c=true;\n  boolean d=false;\n  System.out.println(~a);//-11\
    \ (minus of total value starts from 0)\n  System.out.println(~b);//9 (positive\
    \ of total starts from 0)\n  System.out.println(!c);//false (opposite of value)\n\
    \  System.out.println(!d);//true\n  }\n}\n```\nOutput:\n```\n-11\n9\nfalse\ntrue\n\
    ```\n\n### Java Arithmetic Operators\n\nAddition, subtraction, multiplication,\
    \ and division are all performed using Java operations. They function as fundamental\
    \ mathematical procedures.\n\n### Java Arithmetic Operator Example\n\n```java\n\
    public class OperatorExample{\n  public static void main(String args[]){\n  int\
    \ a=10;\n  int b=5;\n  System.out.println(a+b);//15\n  System.out.println(a-b);//5\n\
    \  System.out.println(a*b);//50\n  System.out.println(a/b);//2\n  System.out.println(a%b);//0\n\
    \  }\n}\n```\nOutput:\n```\n15\n5\n50\n2\n0\n```\n\n### Java Arithmetic Operator\
    \ Example: Expression\n\n```java\npublic class OperatorExample{\n  public static\
    \ void main(String args[]){\n  System.out.println(10*10/5+3-4/2);\n  }\n}\n```\n\
    Output:\n```\n21\n```\n\n### Java - Left Shift Operator\n\nThe Java left shift\
    \ operator shifts all the bits in a value to the left by a specified number of\
    \ times.\n\n### Java Left Shift Operator Example\n\n```java\npublic class OperatorExample{\n\
    \  public static void main(String args[]){\n  System.out.println(10<<2);//10*2^2=40\n\
    \  System.out.println(10<<3);//10*2^3=80\n  System.out.println(20<<2);//20*2^2=80\n\
    \  System.out.println(15<<4);//15*2^4=240\n  }\n}\n```\nOutput:\n```\n40\n80\n\
    80\n240\n```\n\n### Java - Right Shift Operator\n\nThe Java right shift operator\
    \ `>>` shifts the left operand's value to the right by the number of bits given\
    \ by the right operand.\n\n### Java - Right Shift Operator Example\n\n```java\n\
    public class OperatorExample{\n  public static void main(String args[]){\n  System.out.println(10>>2);//10/2^2=2\n\
    \  System.out.println(20>>2);//20/2^2=5\n  System.out.println(20>>3);//20/2^3=2\n\
    \  }\n}\n```\nOutput:\n```\n2\n5\n2\n```\n\n### Java Shift Operator Example: >>\
    \ vs >>>\n\n```java\npublic class OperatorExample{\n  public static void main(String\
    \ args[]){\n  // For positive number, >> and >>> works same\n  System.out.println(20>>2);\n\
    \  System.out.println(20>>>2);\n  // For negative number, >>> changes parity bit\
