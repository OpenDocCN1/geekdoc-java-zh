    commercial interests change values in medical practice.


    This chapter will analyse the process of commercialization and its transformation
    since independence in India. It identifies and elaborates how the process of commercialization
    has contributed to the many anomalies we see at present in the Indian health services.
    The many systemic weaknesses in the public sector are reflected in the patterns
    of inequality in access to health services, rising costs, high out of (p.123)
    expenditure and lack of satisfaction with the quality of services. This results
    in shifting from the public to the private sector that is largely unregulated,
    exploitative with differential quality of care. The crisis in the health services
    exemplifies the fault lines of India''s socioeconomic development.


    This chapter is divided into the following sections—the history of markets in
    medical care; the changing relationship of market and state; the characteristics
    of the private sector and lastly, how markets are able to exert their influence
    and transform the culture and behaviour of public and for-profit services.'
