    envisioning of science and technology by Indian planners and policy makers as
    a catalyst for social transformation predates the ''knowledge era''. The post-colonial
    developmental model has projected science and technology as one of the main factors
    of India''s social transformation. Typically, this approach took the level of
    productive forces as the main cause of underdevelopment in India and identified
    the import of modern (p.198) technology as a means to ''catch up'' with leading
    economies. India welcomed the import of science and technology as a means to solve
    problems of poverty, food production, health, and unemployment. ''Social uplift''
    and ''technological uplift'' became synonymous. Scientific experts, policy makers,
    planners, and international ''aid'' providers depicted technology as a thing to
    be implanted in Indian society. Successive governments have untimely pushed fundamental
    transformation of social relations.3 Despite the repeated failures of the Indian
    state in addressing poverty, unemployment, malnutrition, housing, health, and
    education, there is a stubborn persistence of this techno-centric approach.


    The introduction of neoliberal reforms in India has, radically, transformed this
    discourse on development, welfare, and social justice. Advocates of neoliberalism
    have created a new rhetoric of economic growth fostered by the policies of free
    trade, privatization, and liberalization. They argue that economic growth would
    automatically address the issues of poverty and inequality. Within this neoliberal
    paradigm of economic growth, Indian planners have placed high premium on ''knowledge-based
    sectors''.4


    (p.199) The neoliberal paradigm stipulates that the state ought to withdraw from
    productive activities and welfare measures allowing the market to freely shape
    aspect of the economy. This is usually understood as a ''withdrawal of the state''.
    This is a generalised rhetoric; by dramatically oversimplifying the complexities
    emerging through—and brought about—neoliberal capitalism, it stands in fact to
    do. Advocates of neoliberal reforms call for the state to concentrate on maintaining
    ''law and order'' and providing the policy and institutional frameworks necessary
    for the market to operate without constraints. The neoliberal state is thus cast
    in the role of a ''market activist''.5 Shedding its presence of neutrality, it
    becomes an open promoter and defender of the interests of capital.6


    Can we agree with the claims of Indian planners and policy makers, actively pursuing
