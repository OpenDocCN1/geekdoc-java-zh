    mediating poverty in India. Not only does the problem of poverty appear unsolved
    today, in contrast to a century ago, poverty eradication as a goal in itself has
    fallen off India''s scientific agenda almost entirely. How do we account for this
    side-lining of poverty? Has there been a loss of faith in the ability of science
    to tackle poverty? Or in light of India''s recent economic successes, has the
    problem of poverty simply become inconvenient?


