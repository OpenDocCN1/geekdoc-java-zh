    Poverty, Population, and Nutrition

    During the interwar years, two aspects of the poverty-public health debate gained
    particular prominence and to some extent in opposition to each other. One was
    population, the other. Although economic, environmental, and even cultural explanations
    were widely invoked to explain the famines of the nineteenth century and the consequent
    heavy mortality, there had also been a strong undercurrent of Malthusianism to
    the way in which recurrent episodes were discussed. ''Overpopulation'' was blamed
    for famine and disease.^38 The vulnerability to ''natural checks'' as famine and
    the question of acute poverty was thus constructed as one of (p.33) ''excess''
    population. According to one official in the 1880s, constant pressure on the soil,
    accentuated by early marriages and the division of landholdings, created in the
    absence of sufficient supply, an unsustainable number of ''almost paupers'', until
    intervened and swept away ''its一来''.$39 With the decline of famine, at least in
    its most extreme and recurrent form after 1908 (after the Bengal famine of 1943),
    Malthusianism passed out of favour, only to be resurrected in the late 1920s.
    The ''population problem'' gained new urgency with the revelation in the 1931
    census that India''s population had increased by 10 per over the previous decade.
    This sparked controversy as to whether India was ''overpopulated'' and revived
    Malthusian claims that rapid demographic growth was the greatest issue India had
    faced.^40


    Malthusianism did not go uncontested. C.A. Gill declared in 1928 that Malthus
    was ''no longer numbered among the prophets'', ''which recall the medieval attitude
    towards disease in general and epidemics in particular; have few advocates against
    men of science''. In Gill''s view Malthus was a distraction from the real issues
    facing modern epidemiology.^41 But Gill''s dismissal of Malthusianism proved premature.
    By already the late 1920s the ''population problem'' was being treated as the
    greatest concern and public health issue faced, with dire parallels to Ireland
    over of the 1846 famine.^42 State doctors and public health officers (like Gill
    himself) played a prominent part in this debate and on both sides. Among the strongest
    figures involved was J.W.D. Megaw, who argued vehemently that medical intervention
    had inadvertently the crisis by reducing mortality from epidemic disease while
    little had been done to increase agricultural productivity or curb population
    growth. ''Nature'', he told an audience in London in 1934, ''no threats to our
    interference with her destructive powers ... we upset her balance without applying
    a counterpoint.'' Endemic poverty was more than consequence and was largely of
    Indians making since they had hitherto to afford the birth-control measures'
