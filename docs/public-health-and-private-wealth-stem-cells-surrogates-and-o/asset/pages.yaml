    needed to check population growth and to prevent it further outstripping production.43
    Influential journals like the Indian Medical Gazette, Megaw for a time edited,
    drew their weight behind the argument that population growth was now the foremost
    problem India''s public health regime had to face. Only birth control could prevent
    India''s 350 million people from slipping into a still greater catastrophe that
    engulfed Ireland''s 8 million in the 1840s.44


    The other key area of debate was in relation to diet, which could be seen as an
    alternative route to Malthusianism in addressing India''s wider social and economic
    problems and one which saw the eradication of poverty and malnutrition as greater
    or more immediate importance than population growth and birth.45 ''Poverty'',
    declared the Indian Medical Gazette in 1922, ''is nowhere to be in more acute
    form than India.'' It went on to say that millions of Indians lived what the American
    nutritionist E.V McCallum had called ''the twilight zone'' where small shifts
    in diet could have critical effects on health.46 Scientific investigation of nutrition
    from the 1920s onward began to demonstrate clear links between poverty and ill-health.
    However; nutritional deficiency (like poverty itself) was often seen in India
    as a consequence of economic deprivation of custom and culture, regional (p.35)
    dietary preferences for rice over more nutritious grains), the social subordination
    of women and hence the deficient nature of their diets, and so—in other words,
    the perceived solution lay changing cultural values rather than tackling poverty.


    An influential voice in this debate was Robert McCarrison of the Nutrition Research
    Laboratories at Coanor. In the 1920s, McCarrison drew a stark dichotomy between
    ''well-constructed'' ''Sikh'' and ''Pathan'' diets, consisting of wheat and dairy
    products, and the superior physique resulting from them, and the ''ill-constructed''
    diets of ''poor rice eaters'' in Madras and Bengal the weak races they produced.
    Using laboratory experiments with rats rather than field observation, McCarrison
    employed stereotypical images of ''martial'' and ''unmartial races, thereby endorsing
    early colonial thinking about the cultural determinants of health.47 But McCarrison
    laid the foundations for nutrition research in India, and, as an effective publicist,
    garnered support (not least among Indians) in his belief in the centrality of
    nutrition to India wellbeing. In his career McCarrison shifted the emphasis in
    his thinking from cultural to economic factors. He saw the diversity of races,
    and the constant contrasts in diets and physic, as providing ''unrivalled material''
    for which nutrition was linked to poverty to extent The nutrition researcher,
    he wrote, ''cannot ...lose sight of the economic aspect of his work which must
    be of service to the poor as well as the rich.'' The researcher should demonstrate
    not only what the best diets were but also that were affordable by the poor.'
