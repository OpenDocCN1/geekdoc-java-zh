  md: '# The Globalization of Reproduction in India


    ![](img/da3dd5a3769d858cb753e2331797dc6e_150_0.png)


    # The Globalization of Reproduction in India


    From Population Control to Surrogacy


    Mohan Rao


    DOI:10.1093/acprof/oso/9780199463374.003.0008


    # Abstract and Keywords


    In this wide-ranging essay, the author traces the making and re-making of the
    fertility of India''s poor over the past few centuries: from the problem of so-called
    overpopulation to the ‘solution’ of surrogacy. Within a political economy of health
    approach, this essay describes how nineteenth century overpopulation theories
    detailed with India''s surplus being sucked into Britain''s empire. It goes on
    to show nineteenth and twentieth century eugenic arguments intertwined with those
    of a surplus population and the resulting family planning goals that skewed health
    care services. It concludes by setting the emergence of India''s high-tech medicine
    in the context of its pursuit of neo-liberal economics over the past decades.
    It explores three ideas and practices in what has become a global surrogacy industry
    with India as its major hub. In short, this shows how India''s thriving surrogacy
    industry aims to give life to a very particular people is promised on at least
    two centuries'' influential theories and powerful practices—population, eugenics,
    and neo-liberal—that ‘recycle’ the problem of the poor into the resources of the
    rich.


    *Keywords:* political economy of reproduction, surrogacy, India, global health
    markets, population, eugenics, family planning


