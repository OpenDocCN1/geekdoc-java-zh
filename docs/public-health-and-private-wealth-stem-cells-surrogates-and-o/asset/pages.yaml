    # ‘Surveillance for Equity’


    Poverty, Inequality, and the Anti-politics of Family Planning


    Rebecca Williams


    DOI:10.1093/acprof:oso/97801999463374.003.0004


    # Abstract and Keywords


    During the 1970s, health inequalities became a key issue for international health
    experts. Ever since, health ‘equity’ projects attempt to rectify these inequalities
    through technical interventions which are, typically, narrowly focused on health
    outcomes, and centrally concerned with the health of the poor. To understand the
    care of ‘equity’ in health expertise, this chapter turns to the system of surveillance
    promoted as a means to rectify health inequalities within the Khanna study, a
    well-known population control experiment by Carl E. Taylor and his colleagues
    from the Harvard School of Public Health conducted in the Ludhiana District of
    Punjab during the 1950s. By tracing the adaptation of this mode of surveillance
    from the Khanna study to health ‘equity’, this chapter shows that ‘surveillance
    for equity’ was not a new approach to health care, but an existing set of technical
    interventions repackaged in the language of social justice.


    *Keywords:* health equity, surveillance, Khanna Study, Harvard School of Public
    Health, India, Punjab, Carl E. Taylor


