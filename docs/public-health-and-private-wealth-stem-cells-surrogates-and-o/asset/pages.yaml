    by private, individual practitioners. The Committee was of the view that presence
    of individual private practitioners was not a threat to the idea of a national
    health service therefore did not challenge their interests. By choosing not to
    challenge private interests it implicitly amounted to the accommodation in the
    Committee''s blueprint for health service development. The Committee was of the
    opinion that private practice should not be allowed by government doctors because
    this would lead to differential treatment based on the ability to pay. Therefore
    it would lead to a dual system of care and will guided the principle of equal
    access and treatment to all. The rationale that guided the Committee''s thinking
    on the role of the private practitioners was based on the assumption that a strong
    public sector would make the private sector redundant over time. The Committee
