  md: '# Afterword


    rhythms of social change that causally determines social reality. This social
    reality is conditioned by three basic oppositions, the span between birth and
    death, inner and outer, and above and below. Furthermore, the historicization
    of conceptual evolution itself reveals the evolution of the language of historians.¹
    This shifts the focus to the constitutive nature of historical discourse.


    In the discussion that follows, I shall look at the different institutional arenas
    and actors in India, and to an extent outside India, for the current discussion
    on indigenous knowledge, indigenous knowledge systems, and indigenous sciences,
    my intention being to explore the mainstreaming of the concept of indigenous science
    and knowledge. (p.253) In doing so, nevertheless, I do not present a detailed
    history of these cases but highlight conjunctures in the discussion in India.
    When seen as a kind of knowledge, indigenous science or knowledge is deployed
    as a meta-concept, frequently marking the geographical situatedness or social
    identity of knowledge possessed by a certain community or social group. Furthermore,
    awesome located within the social studies of science examining also as cognitive
    movements where the boundaries are often blurred, there is the academic, critical,
    and technocratic side to the life-history of any concept. In other words genealogy
    of the concept and its subsequent deployment is linked with constituencies and
    institutions that include movements, NGOs, academics, and international agencies
    that at times mediate the linkages with the others and the world of politics,
    and in the process orient its ‘mainstreaming’. The neologism ‘mainstreaming’ in
    this context refers to the institutional translation that draws an ‘out-group’
    and its cognitive resources into the epistemological and normative regime of ‘globalized
    science’.


    The quest for the indigenous towards the last quarter of the twentieth century
    was an outcome of several factors, one of them being the disenchantment of modern
    science and the developmental imagination that swept across colonizing nations
    in the decades after the Second World War. This discourse around development was
    characterized by a manifold of terms that included science and technology, standard
    of living, resources, production, poverty, population, planning, market, needs,
    equality, and environment.² Approach towards deconstructing development, it has
    been pointed out, is to analyse the words of development discourse, for example,
    those listed previously, in order to get a better grasp of not just systems but
    cultures characterized as ways of knowing.³ Indigenous knowledge and indigenous
    sciences too belong to another manifold or family of terms and concerns which
    though related to the earlier set, (p.254) in a relation of opinion, foreground
    the negative outcomes that were seen to be the underside of development.'
