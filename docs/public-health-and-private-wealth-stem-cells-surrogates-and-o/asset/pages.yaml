    Eurocentric theories of knowledge. This embeddedness of theories of knowledge
    implies a place which is ‘… an external, physical construct (p.256) as well as
    internally constituted’.12 Thus, in this conception knowledge carries the signature
    of specific lands and traditions, and the notion of modernity is not to be construed
    as the antonym in a social theoretic framework where tradition-modernity constitute
    the idea of ‘ being evolved and matured over time and … as a characteristic or
    attribute of the peoples concerned’. Secondly, of being anchored in space it is
    ‘… not seen in time or space but continually evolving and responding to the natural
    world’.13 This means that it does share features of scientific knowledge though
    it is substantially different. Lest the term be conflated with knowledge in the
    cultures of ‘first peoples’ alone, the term non-indigenous was employed to signify
    a ‘… long-standing, eurocentric mainstream culture’.14 This notion of indigenous
    knowledge a provenance that it shares with non-Western and when qualifying forms
    of knowledge underscores the relationship of subalternity with respect to knowledge
    from the European world.


    Furthermore, arguing against the common trope of traditional knowledge whose development
    had been arrested, which in turn marked their distinction from the sciences, indigenous
    knowledge systems came to be characterized as ‘… dynamic: new knowledge is continuously
    added. Systems do innovate from within and also utilize, and add external knowledge
    to suit the local situation’.15 For those in social movements indigenous knowledge
    is ‘… stored in people’s memories and activities and is expressed in stories,
    songs, folklore, proverbs, devices, myths, cultural values, beliefs, rituals,
