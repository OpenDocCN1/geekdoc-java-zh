    Engaging the Meta-Concepts of Indigenous Knowledge/Science, Shiv

    In an elegant counterfactual construction of another science for India, Shiv Visvanthan
    puts the words into the mouth of a fictitious Indian scientist disenchanted with
    the green revolution in India and agriculture: ‘Our science should have begun
    in the forest or in our fields. Instead of the engine, our knowledge should have
    grown around the ground, the leaf or the cow. We forgot that these were metaphors
    and that is why we deflated the forest.^4 Discussions on indigenous knowledge
    systems are replete with metaphors taken from the agricultural or horticultural
    world to not just the multiplicity of resources and their uses, but are equally
    embedded within multiple life-forms as well. The ‘coconut’ for one is often used
    as such a metaphor for ‘scientific and technological knowledge developed and used
    by indigenous and traditional ecological participants worldwide.^5 The term indigenous
    knowledge in some native contexts is used to play up a kind of indigenousm or
    projects a radical activity. But those who creatively play around with the coconut
    as metaphor of a different knowledge ideal, underscore the fact that its origins
    are contested, and that its history of migration celebrates its rooting and subsequently
    naturalization in a multitude of natural landscapes.


    What could be said of the diversity of coconut species or peoples could then be
    extended further to the notion of indigenous knowledge and there is no single
    notion or construct that captures its diversity. Rather it denotes encompasses
    the complexity and heterogeneity of peoples, tribes, and ethnicities which have
    (p.255) “subjugated in ancestral lands to those who still removed from their land
    today.^6 As a result it is sometimes alluded to as the ‘ traditional knowledge
