    articles which used the word ''equity'' used the term to connect wealth. That
    is, ''equity capital'' in the sense of economic assets; ''equity investments''
    in private hospitals; medical group practices; ''equity'' in savings deposits
    in the context of discussions on health insurance.83 By the mid-1970s, authors
    more frequently used the term ''equity'' in the sense of social justice or equity.


