    # Afterword


    Mainstreaming Indigenous Knowledge: Genealogy of a Meta-concept


    Dhruv Raina


    DOI:10.1093/acprof/oso/9780199463374.003.0011


    # Abstract and Keywords


    This chapter examines the dual career of the ‘indigenous knowledge’ within development
    practice and science studies. It shows the interest in indigenous knowledge emerged
    in tandem with the politicization of indigenous groups and indigenous-rights movements,
    wherein the indigenous peoples began demand the right to be heard in development-related
    decisions concerning themselves. As a result, ‘indigenous knowledge’ came to be
    lauded as an alternative collective wisdom relevant to a variety of matters at
    a time when existing norms, values, and laws have increasingly called into question
    and in cases where development planning has not delivered on promised results.
    In other words, indigenous knowledge comes to form part of the project of sustainable
    development. This possible mainstreaming of indigenous knowledge and indigenous
    science has begun earnest with the recognition in the scientific community that
    the problems of poverty and sustainability are far too complex and risky to be
    handled by what is received as big science today.


    Keywords: indigenous knowledge, science policy, development practice, indigenous
    science, indigenous rights movements


