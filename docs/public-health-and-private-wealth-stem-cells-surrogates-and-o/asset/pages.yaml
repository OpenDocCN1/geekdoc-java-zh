  md: 'be productive. If children grow without having been deprived of maternal attention
    and food because the family has more (p.95) children than can be cared for, they
    will have measurably better intellectual and physical development and a greater
    chance of growing into adults who contribute to progress.¹100


    Similarly, in the monograph of the Narangwal nutrition study, Taylor and his colleagues
    argued in particular, ‘represents society’s greatest resource for the future’.101
    In words, Taylor viewed international health projects not only as a way to improve
    the health of the poor, but to transform them into a productive workforce.


    As I noted earlier in this chapter, the word ‘equity’ carries more than one meaning.
    It can also mean justice, impartiality, and fairness. However, it can also make
    an economic incentive. Thus, I argue that ‘surveillance for equity’ only makes
    sense if we think of ‘equity’ not in terms of fairness of justice, but in terms
    of wealth. Within the ‘surveillance for equity’ model, the health of the people
    is the wealth of the nation.


    Though concerned with the health of the poor, ‘surveillance for equity’ functioned
    to sideline the political and structural causes of poverty in favour of a narrow
    focus on health outcomes. In viewing the diseases of poverty as a set of technical
    problems requiring technical solutions, Taylor’s approach to ‘equity’ in health
    politicized the problem of poverty. While formulated in response to international
    demands for economic redistribution ‘surveillance for equity’ was not a new approach
    to health care. Rather, it was a way to rationalize health services in order to
    achieve optimal health outputs at minimal cost. In place of socioeconomic justice,
    the poor were provided with surveillance.


    Since Taylor formulated his approach to ‘equity’, in international health projects
    have continued to implement systems of continuous monitoring in an attempt to
    deliver equitable health outcomes.¹102 Yet, as Fabienne Peter and Timothy Evans,
    if (p.96) inequalities are rooted in broader social processes, then the remedies
    to those inequalities must also be sought in ‘social policies at later’.103 In
    other words, health ‘equity’ cannot function as an apolitical concept, with a
    narrow focus on health outcomes and specific, technocratic interventions. Rather,
    the search for equity in health must be embedded in a broader pursuit of equality.¹104


