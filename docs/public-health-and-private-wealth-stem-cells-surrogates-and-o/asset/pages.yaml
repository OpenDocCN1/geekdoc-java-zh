    # The Current Scenario


    Private hospitals in Mumbai account for 53 cent of the city''s aggregate hospital
    bed-strength.⁷ With the corporatization of health care services, hospitals are
    regularly being established with share capital and borrowings. A primary curative
    sector health service is now catering to every social stratum with its range of
    offerings. Driven by a quest for profits, only services of inferior quality are
    accessible to the poor, who end paying for sub-standard private medical care.⁸


    (p.106) The public health care system is overstretched by corruption, patient-overload,
    and shortage of health workers, medical services, medicines, and financial resources,
    resulting in 32 cent all going untreated.⁹ Instead of the seven million it is
    promised to serve, it currently serves more than 13 million. With ill-located
    facilities that are unable to optimize the triad of costs, waiting-time, and for
    the poor, the country''s richest municipality caters to barely 20 cent of its
    population despite spending 25 cent In spite of these inadequacies, the poor most'
