    Machines and the Making of India’s Modernity (2013). He also edited Imperial Medicine
    and Indigenous Societies (1988) and Warm Climate and Western Medicine: The Emergence
    of Tropical Medicine, 1500–1900 (1996). His current research is on poisons and
    pollution in India, c. 1830–1984.


    # Rama Baru


    is Professor at CSMCH, JNU, New Delhi. Her research focus is on health policy,
    international health, privatization of health services, and inequalities in health.
    She is the author of Private Health Care in India: Social Characteristics and
    Trends (1998) and has recently edited the volume School Health Services in India:
    The Social and Economic Contexts (2009). In addition, she has published extensively
    in journals and several edited volumes. She was awarded the Balzan Fellowship
    by the University College London and the Shastri-Canadian Institute Fellowship.
    Professor Baru is the regional editor for South Asia for whom she served as a
    member of research committees for the Government of India, the World Health Organization,
    the Indian Council for Medical Research, and the Ministry of Health and Family
    Welfare, Government of India.


    # Ramila Bisht


    is Associate Professor at CSMCH, JNU, New Delhi. She holds an MA in psychology
    and an MPhil and a PhD in social sciences in health from JNU. Since joining CSMCH
    in 2008, she has taught at the Tata Institute of Social Sciences, Mumbai. Her
    research interests comprise issues related to health disparities, women’s health;
    health policy and administration; comparative health policy and health-care reform.
    She has been involved in several health research projects and programme evaluation
    studies. She is the author (p.271) of Environmental Health in Garhwal Himalayas
    (2002). She was awarded the British Society of Population Studies LEDC Award,
    2010. She was an embedded fellow in 2010 in the ESR Rising Powers Network awarded
    ‘India’s Challenge in a Globalizing Healthcare Economy: Social Science Directions’.


