    The Khanna Study and the Family Folder System: A Genealogy of Surveillance

    In the post-war period, a number of government and non-government organizations,
    private foundations, and academic institutions became (p.73) vitally concerned
    about population growth across the so-called underdeveloped third world.¹12 Carl
    Taylor, John, and John Gordon, epidemiologists from the HSPH, were among those
    concerned with third ‘overpopulation’. Taylor, Wyon, and Gordon argued that ‘population
    pressure’ was a ‘social malady’ that could lead to famine, poverty, and civil
    unrest.¹13 In particular, they argued that population growth presented a public
    health problem.¹14 In a theory that they called the ‘epidemiology of population’,
    Gordon, Taylor, and Wyon argued that India, with a young population and ‘high
    natural potential of growth’, ‘post the most secure economic and public health
    problem’ to the entire world.¹15


    During the early 1950s, Gordon, Taylor, and Wyon designed a research project to
    study ‘population dynamics’ in a series of villages surrounding the market town
    of Khanna, in the Ludhiana District of Punjab.¹⁶ In addition to collecting information
    on the reproductive processes and sexual practices of the populations of these
    villages, the Khanna study aimed to test the effects of ‘simple methods’ of (p.74)
    contraception on the birth rate.¹¹⁷ By the end of the Khanna study, its architects
    and funders considered the project ‘glorious failure’.¹⁸ The study had not reached
    the rates of ‘acceptance’ of family planning methods required to affect the birth
    rate.¹⁹ Nevertheless, Government of Indian officials cited the Khanna study as
    evidence that the Indian people were ready and willing to limit the size of their
    families.¹²⁰


    Subsequently, the Khanna study gained infamy among Mahmud Mamd’s The Myth of Population
    Control (1972). After spending several months interviewing villagers in one of
    the Khanna study experimental villages, Mamd argued that the Khanna staff failed
    to understand that families in Manipur needed large families for economic and
    physical security.¹²¹ Furthermore, Mamd argued that the study had been plagued
    by the biased understanding of the problem, shared by the study’s architects and
    Indian staff alike, of population as a disease to be treated with the techniques
    of an epidemiologist.¹²²


    Indeed, wanting a ‘pandemic of births’, Gordon, Taylor, and Wyon designed the
    Khanna study as an epidemiological investigation to address the ‘disease’ of ‘overpopulation’.¹²³
    Having framed population growth as a public health problem, the Harvard epidemiologists
    adopted procedures of measuring, census taking, and preparation of communicable
    disease.¹²⁴ Gordon, Taylor, and Wyon'
