    # Abstract and Keywords


    This chapter reviews the health care landscape of Mumbai over the last few decades
    and examines the public-private partnership (PPP) that converted a dysfunctional
    maternity home into a multi-specialty peripheral hospital, optimally to benefit
    the slum-dwellers in the catchment area. It is divided into three parts. The first
    provides an overview of Mumbai’s health care system. The second part studies the
    changes in the city’s health care infrastructure over the last two decades with
    a focus on health care for the poor. In third part, the first public health care
    PPP in Mumbai is discussed as an illustration of the changing relationships of
    the state and the private sector. In conclusion, the broader implications of the
    findings of this case study for the poor are analysed in the context of generating
    greater exclusions through new forms of marginalization.


    Keywords: Mumbai, health care, public-private partnerships, the poor


    The state (public part), citizens (beneficiaries), and private enterprises (concessionaires)
    are forging a new relationship in a rapidly globalizing environment, called public–private
    partnership or PPP With dwindling resources and poor efficacy in delivering public
    good, even social policy—a quintessential duty and responsibility of the state—is
    rising this new vehicle. However, a PPP in health care in Mumbai has gone all
    wrong for the ‘beneficiaries’, especially the poor and the marginalized. The chapter
    reviews'
