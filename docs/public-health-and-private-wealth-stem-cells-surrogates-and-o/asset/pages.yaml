    Lakshmi Kutty, in her chapter “Tabular Optics: Health, Techno-science, and the
    Obfuscation of Poverty’, notes that tuberculosis has long been acknowledged as
    the quintessential disease of poverty. She narrates how, in the middle of the
    twentieth century, drug treatments emerged that could control TB in the short-term.
    These were seized by both India’s national government and international agencies
    that had long seen TB as one of the biggest obstacles to achieving an efficiently
    functioning and productive economy. By the 1980s, there was a policy reconsideration.
    The approaches adopted had not yielded dividends. Not only had the problem of
    TB not being under control, there was a resurgence of TB. Dominant policy understandings
    of TB moved away from political questions of poverty, deprivation, or mounting
    inequalities. In their place, policy workers attempted to work round poverty by
    casting the ending TB rates as an effect of inadequate implementation of techno-scientific
    solutions. Earlier questions of a political nature were systematically excluded.


    The overview of twentieth-century TB interventions measures because it demonstrates
    the state change in the strategic understanding of poverty and ill-health. Kutty’s
    account of the changing fortunes of TB control strategy in India adds needed update
    to earlier McKeown debates about the relationship between nutrition and health
    across. Briefly, the McKeown thesis was that scale improvements in population
    health (particularly in Europe) promoted modern medical interventions or cures.
    Rather taking up this debate in the aggregate, Kutty shows, even if McKeown was
    wrong and medical breakthroughs behind improvements in health over the course
    of the nineteenth century in Europe, this argument could not be used to support
    TB programs in India. In the absence of basic levels of nutrition, the technological
    solution to TB (taking medicine) is simply ineffective. Malnourished ‘poor bodies’
    do not respond to therapies. By systematically excluding a broader political approach
    to poverty eradication from programmes to control TB, the specifics of TB treatment
    could not improve health but gravely undermined the possibilities of such intervention
    to improve the lives of the poor; let alone heal their bodies.


