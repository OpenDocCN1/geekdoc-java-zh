  md: '# Globalization and the Health of a Megacity


    seem to prefer public hospitals and avail private health care in the absence of
    public health services.11 Against this backdrop of unmet demand and rising dependency
    of the poor; the state government of Maharashtra and MCGM decided to binding in
    PPPs in health care as a potential solution.


    Public–Private Partnerships in Mumbai''s Health Care System Compelled by a severe
    budget deficit in the late 1990s, MCGM was forced to charge user fees in its public
    hospitals. So, MCGM transferred financial burden to the poor.12 It also took World
    Bank (p.107) advice and instituted the PPP model in health care with the aid of
    ''effective and efficient delivery of quality services to the people''.13 Initially
    limited to hiring in or outsourcing services, MCGM eventually took the PPP route
    to try and revitalize municipal hospitals.14 Guidelines for tending, scrutinizing,
    and contracting private partners to run health facilities on ''care-taker'' and
    ''no-profit-no-loss'' basis for a period between 10 and 30 years that the facilities
    be kept for the poor while charging the paying patients reasonably''.15


    While pushing for PPPs, MCGM has offered numerous incentives to private players
    in the development, maintenance, running, and management of its dysfunctional
    hospitals. These moves have raised concerns and public ire, but have been met
    with either apathy or tokenism. Despite its imperfect financial position, MCGM
    has neither established new hospitals nor upgraded ones.16


    Public-private partnerships are of course not entirely new. They have existed
    in the past, although on a modest scale. Today however, they are not only ubiquitous,
    but also have a new meaning. The changing nature of PPPs today is placed within
    the larger context of infrastructural needs, which in turn is driven by new economic
    imperatives. Land, on which many public hospitals stand, is lucrative for the
    health entrepreneur-builder nexus that enjoys tacit support from politicians and
    bureaucrats. While powerful houses actively influence decisions, international
    consultancy sanctify these new models of delivering public health (p.108) services.17
    The Chief Minister of Maharashtra''s task force, in pursuing its grandiose vision
    to develop Mumbai into a world-class hub for high-end health care services, also
    joined the agenda.18


    As a result, a ''social policy'' has emerged that seeks to make public services
    commercially viable, through virtual privatization of public assets as PPPs. Against
    this backdrop, the rest of this chapter will examine a specific PPP in Mumbai.


