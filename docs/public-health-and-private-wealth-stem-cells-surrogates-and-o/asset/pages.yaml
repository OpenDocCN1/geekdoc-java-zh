    Health, Techno-science, and the Obfuscation of Poverty*


    Lakshmi Kutty


    DOI:10.1093/acprof:oso/9780199463374.003.003


    # Abstract and Keywords


    Tuberculosis (TB) has long been acknowledged as the quintessential disease of
    poverty. By the 1980s, however, there was a policy reconsideration. The drug-based
    approaches adopted not yielded dividends: not had the problem of TB not brought
    under control, there was a resurgence of TB, often associated with HIV/AIDS and
    sometimes in a new form, namely with lethal multi-drug resistance. What is led
    to a ‘casting and ‘recoding’ of the link between TB and poverty. Dominant policy
    understandings of TB moved from political questions of poverty, deprivation, and
    mounting inequalities. In their place, health workers attempted to work round
    poverty by casting ending rates as an effect of inadequate implementation of techno-scientific
    solutions and questions of a political nature were systematically excluded.


    Keywords: tuberculosis, India, poverty, international health policy, politics


    That tuberculosis (TB) is a social disease, quintessentially related to poverty,
    hardly needs re-stating. Literature on the decline and resurgence of TB in different
    regions and periods of time has noted its close relationship with social and structural
    change, including wage rates and incomes, diet and nutrition, and working conditions,
    urbanization, and health infrastructure.¹ Different meanings of poverty have the
    potential to forward vastly different understandings of TB illness, treatment,
    and making policy, with it enabling differing possibilities of health and well-being
    for patients. Poverty has been understood as the lack of economic'
