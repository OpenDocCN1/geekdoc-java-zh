    In the chapter “Surveillance for Equity?” Poverty, inequality, and the Anti-policies
    of Family Planning”, Rebecca Williams turns to the system of surveillance promoted
    as a measure to rectify health inequalities within one of the earliest and most
    influential population studies—the well-known ‘applied’ research population control
    experiment was run in the Ludhiana District of Punjab during the 1950s by researchers
    from Harvard. The Khanna study took to system of continuous population monitoring,
