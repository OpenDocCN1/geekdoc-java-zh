    On the part of the Indian state, specific efforts to foster the development of
    BT were set in motion with the setting up of an apex body, the National BT Board
    or the NBTB in 1982. The board, chaired by a member of India''s Planning Commission,
    comprised representatives from other public institutions related to science and
    scientific research as the Council of Scientific and Industrial Research (CSIR),
    the Indian Council of Agricultural Research (ICAR), the Indian Council for Medical
    Research (ICMR), the University Grants Commission (UGC), as representatives of
    departments such as the Department of Science and Technology (DST) and the Department
    of Atomic Energy (DAE).


    The NBTB''s mandate was to pinpoint specific areas within the promotion of BT.
    By 1983, it had executed its mission and submitted a report titled Long Term Plan
    in Biotechnology for India.^32 The long-term programmes delineated by the NBTB
    lay the emphasis on boosting the necessary infrastructure for BT. This included
    the setting up of research universities and university academic programmes which
    would enhance the availability of a skilled labour practise in BT R&D.^33 It is
    noteworthy that from the very beginning India had laid stress on the industry-academia
    (p.208) link and on commercialization of BT research, a point we shall return
    to later in the chapter.


    In 1986, the NBTB was replaced by the DBT, a full-fledged department established
    by the Ministry of Science and Technology. The DBT has since become the nodal
    government agency for BT-related initiatives. Public investment in the BT sector
    has increased over the years. The plan allocation for the DBT increased from INR
    6,210 million to INR 65,000 million in the Ninth Year Plan (1998-2002) in the
    Eleventh Year Plan (2007-12).^34 The major share of plan allocation goes to human
    resource and infrastructure development and R&D. More than 70 cent of total outlay
    earmarked for the DBT by the Eleventh Year Plan went into human resource and infrastructure
