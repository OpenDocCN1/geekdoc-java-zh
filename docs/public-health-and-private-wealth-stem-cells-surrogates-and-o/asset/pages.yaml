    ‘for India is a land in which the poor exceed the rich in’.48 McCarrison further
    argued that public health was a matter for the public to decide. The solution
    to India’s nutrition problem did not lie with nutritionists alone. It was ‘in
    the hands of others—the people of India themselves’.49 A proper knowledge of nutrition
    could potentially empower the poor.


    (p.36) The close of McCarrison’s Indian career in the mid-1930s coincided with
    intense and uninterested interest in the poverty question. This arose in part
    from a recognition that the decline of famine had not brought an end to the problem
    of endemic hunger, and also, with the slow emergence of India’s ‘development regime’.50
    mass poverty and the resulting ill-health and inefficiency of Indian workers stood
    in the matter of progress. The new critique of poverty came especially from left-wing
    nationalists, who saw an intimate connection between poverty, public health, and
    social justice. In 1929, Rajani Kanta Das argued ‘all the important social, political,
    and economic problems calling for immediate solution ... none is more complex
    and more than that of the age and perpetual poverty of the masses throughout the
    length and breadth of the country’. Observed that, even with famine in abeyance,
    ‘perpetual starvation’ still stalked the land.51 Another economist, N. Gangullie,
    similarly argued in 1939 that India had no more pressing problem than nutrition.
    For him the question was closely bound up the economic organization of society
    and the ‘contradictions inherent in the capitalist mode of production’. He was
    scornful of claims that ‘overpopulation’ was the cause of Indian poverty but he
    was equally skeptical that cultural choice dictated poor order. Only the eradication
    of poverty would solve the nutrition problem.52


    In the West, widespread unemployment and the far-reaching effects of the Depression
    had generated a new concern for nutrition: in India, where unemployment was less
    of an issue, this translated into a new awareness of the impact of deficient diets
    on the health of the population as a whole and of the poorer classes and vulnerable
    groups like women and children. Crucial to this new-focused view of public health
    was the work of W.R. Ayroyd, McCarrison’s successor as Director of the Nutrition
    Research Laboratories. Ayroid(p.37) was something of an exception in being a member
    of the Indian Medical Service and not so burdened by the same prejudices and assumptions
    as those whose entire career had spent in the Indian services. Highly regarded
    for his earlier work on nutrition for the League of Nations Health Organization,
    Ayroyd brought to nutritional science in India a much-needed underpinning and
    a visionary understanding of how diet was reciprocally linked to poverty and to
    public health.53 Aided by a team of committed Indian researchers, and financial
    support from the Indian Research Foundation Asia, Ayroyd oversaw a series of more
    than fifty food surveys by 1940.54 These yielded the first surveys of Indian diets,
    identified differences in consumption within households, and provided significant
    markers'
