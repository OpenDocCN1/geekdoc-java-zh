  md: '# Surveillance for Equity?


    or unjust.3 Health ‘equity’ projects attempt to rectify these inequalities through
    technical interventions which are typically narrowly focused on health outcomes,
    and centrally concerned with the health of the poor.4


    One influential proponent of ‘equity’ in health was Carl E. Taylor, Professor
    of International Health at the Johns Hopkins School of Public Health (JHSPH).
    This chapter explains how, from the mid-1970s, Taylor advocated ‘equity’ in health
    as a means to improve the health of poor populations in ‘developing’ nations.5
    Importantly, Taylor upheld ‘systematic monitoring’ of the population—rather than
    political, social, and structural change—the solution to inequalities in health.6
    Specifically, Taylor advocated the implementation of epidemiological methods of
    surveillance as a route to health ‘equity’.7 In approach which he called ‘surveillance
    for equity’, Taylor argued that through systematic monitoring, community health
    workers could improve the health of poor populations in the absence of socioeconomic
    equity, and at minimal cost.8


    (p.72) In this chapter, I argue that ‘surveillance for equity’ is what James Ferguson
    terms an ‘anti-political’ project.9 By focusing narrowly on health inputs and
    outputs, Taylor’s model of health systematically erased the political and structural
    causes of poverty, and replaced them with technical causes, requiring technical
    solutions.10 In short, ‘surveillance for equity’ isolated the bodies of the poor
    from their social, economic, and political contexts, and transformed them into
    objects of medical knowledge and management. In its attempt to provide an immediate
    solution to the diseases of poverty, Taylor’s ‘equity’ project sidelined the problem
    of poverty in favour of a limited focus on specific indices.


    To understand the genesis of Taylor’s approach to ‘equity’ in health, this chapter
    will first turn to the system of surveillance that Taylor promoted as a means
    to rectify inequalities. I trace this system of surveillance to the Khanna study,
    a well-known population control experiment which Taylor and his colleagues from
    the Harvard School of Public Health (HMPH) conducted in the Ludhiana District
    of Punjab during the 1950s.11 The Khanna study took a system of continuous population
    monitoring, derived from communicable disease study, and applied it to population
    control. Subsequently, Taylor and his colleagues adapted this epidemiological
    model of surveillance to a broader set of family planning, nutrition, and community
    health interventions. By tracing the adaptation of this mode of surveillance from
    the Khanna study to health ‘equity’, this chapter shows that ‘surveillance for
    equity’ was not a new approach to health care, but an existing set of technical
    interventions repackaged in the language of social justice.'
