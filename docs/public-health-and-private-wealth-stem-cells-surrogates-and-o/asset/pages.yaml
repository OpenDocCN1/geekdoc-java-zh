    the chapter tracks changes in the city''s health care infrastructure over the
    last two decades, giving particular attention to the formulation and operationalization
    of new policy initiatives—push towards privatization of the public health system.
    Bisht and Virani''s material shows that these changes have substantially undermined
    the provision of health care for the poor. In fact, rather than extending quality
    health care to underserved populations, Bisht and Virani find that the first health
    care PPP of its kind in Mumbai created greater obstacles for the poor in accessing
    health care.


