    Developments in the late 1980s galvanized the widespread and global legitimacy
    of the ARI-related tools, set in motion by a network of initiatives such as the
    HSPR and the Ad Hoc Commission for Health Research. While Stylo’s chemotherapy
    work was taken up by the Commission for Health Research and became the DOTS strategy,
    his epidemiological research was taken up by the HSPR to provide burden of disease
    estimates for TB. In turn, these exercises also gained legitimacy from the perspective
    of a cost-effectiveness rationale, and (p.67) scientific facts transform them
    into techno-scientific solutions for the use of TB programmes in developing countries.
    The unstable nature of some of these research initiatives did not come in the
    way of their being taken up by influential research. The HSPR studied the ground
    from which subsequent research developments of the World Bank emerged, fine-tuning
    the rationale of cost-effectiveness for translation into health policy.


    It stimulated the Global Burden of Disease (GBD) study, for instance, gave rise
    to another quantitative metric, a composite index expressing ‘burden of disease’
    in terms of years of human life affected. This index became the ‘Disability-Adjusted
    Life Year’, DALY, incorporating diverse outcomes—morbidity, disability and mortality—into
    a single measure.92 This aided cost-effectiveness analysis measuring costs of
    specific interventions for day averted. exercises combined to form the conceptual
    and methodological base for the World Development Report (WDR) 1993, Investing
    in Health, which proved to be the defining feature of the turnaround that the
    World Bank was to effect in global public health.93


