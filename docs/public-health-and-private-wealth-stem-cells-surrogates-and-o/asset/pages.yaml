    (as body weight, caloric intake, and vitamin content) through which nutritional
    poverty could be accurately assessed. The surveys targeted social groups, especially
    poor and rural workers, women and children, who were most at risk from deficient
    diets, they directed attention to several hitherto little known common deficiency
    diseases, and they made practical recommendations as how even the poor could improve
    their daily diets.55 Evidence from these studies helped inform government policy,
    as in Madras where milk and cod-liver oil were introduced for schoolchildren (p.38)
    in 1936.56 At the all-India level, too nutrition became a major policy issue.57


    Although the Second World War brought the diet surveys to a halt, it provided
    fresh impetus for a new nutrition policy. The government was forced to jettison
    laissez-faire and intervene on an unprecedented scale to regulate the grain trade
    and food consumption. Publication of the Beveridge Report in Britain in 1942 gave
    further impetus to the social objectives of public health in India. This was reflected
    in the Health Survey and Development Committee''s report in 1946, which in its
    discussion of the ''social background'' of ill-health quoted Beveridge enthusiastically
    while adding apologetically that it was beyond the scope of the committee ''to
    suggest ways and means by which poverty and unemployment should be eliminated''.58


    Famine had ceased to be a factor in the understanding of mass poverty. The Bengal
    famine of 1943 and the official inquiry it spawned strengthened the belief that
    the quality as well of the foodstuffs consumed by the public was a cause for public
    concern and indeed to state action. The report of the Famine Inquiry Commission
    (of윅 was a member) in 1945 contained an extended discussion of ''population, nutrition
    and food policy''. Having attacked the ''fanatical Malthusian'' position, the
    report argued that nutrition was vital to public health and that income levels
    needed to rise in order to allow an improvement in the diets of the masses. The
    commission declared that a ''well-balance and satisfactory diet'' was currently
    ''beyond the means of a large section of the population and that this was a prime
    cause of debility, disease, and death. It followed that the ''improvement of nutrition''
    was an ''essential part of [any] public health programme in India.59 Seldom had
    the ''government of poverty'' enjoyed such endorsement.


    But the science of nutrition and the agency of public health were by no means
    the only ways in which the problem of poverty could (p.39) be addressed. One alternative
    from the physicist Meghnad Saha, who in the 1930s showed that the dual problem
    of flooding and malaria in Bengal could be resolved by large-scale measures of
    river-control and irrigation. Saha made clear that poverty eradication lay at
    the core of his proposals, arguing in 1938, ''If we desire to sufficiently secure
    the security of poverty and when from 90% of our countrymen are suffering ...
    we must make the full use of the power which a knowledge of Nature has given us.60
    The agency of public health, it'
