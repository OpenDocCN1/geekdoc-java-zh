    Neoliberal economic reforms in India have led to an increase in the wealth of
    a few businesses, real estate developers, rural elite, and benefited a section
    of the English educated urban middle-class. Rising GDP figures, exchange booms
    and a high growth rate of the economy provide a measure of these changes. This
    growth rate, however, makes state fail to address issues of inequality. (p.220)
    poverty, unemployment, malnutrition, health, and education⁸⁶ The inability of
    a large number of people to meet their basic nutritional requirements has led
    scholars such as Utsna Patnaik to describe India a ‘rap of hunger’, with over
    three-fourths of the population below the poverty line⁸⁷ Neoliberal policies have
    further exacerbated the situation for those who depend on agriculture. Between
    980 and 2007, the agricultural sector’s contribution to the GDP declined from
    39 cent to 17 cent, whereas the number of people dependent on it only declined
    from 68 per cent to 57 per cent of the population.⁸⁸ This has seen in effect large-scale
    migration to cities. Statistics offered by the 2011 Census show that for the first
    time since 1921, urban India added more people to the total population than rural
    India.⁸⁹ Cities, on the other hand, have few jobs to offer these rural migrants
    and a large number of them smell the bracket of the urban ‘surplus people’ living
    in slums and pavements


    In the last two decades, neoliberal reforms have overwhelmed the character of
    BT sector in India. The same economic, political, and ideological processes which
    are responsible for growing inequality and poverty also underlie India’s promotion
    of the biotech industry. Thus, the claim of Indian planners and policy makers
    that BT address issues of food, nutrition, and health of the vast majority of
    poor people seems rhetorical. Throughout this chapter, we can find at least two
    basic senses in which the poor/poverty emerge as the ultimate/intended beneficiaries
    of BT. This is achieved by replicating a near universal and compulsory rhetoric
    of policies ushering in welfare of the poor. This benefit-to-benefit-poor rhetoric
    is important for the legitimacy of not only BT but also technologies. In the second,
    (p.221) we see the Indian state blatantly advertising poverty as one of the most
    basic reasons for the global BT'
