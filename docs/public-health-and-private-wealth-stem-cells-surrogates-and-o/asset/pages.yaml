    The chapter has argued that ne-liberal forms of organizations that have been proactively
    ushered by the government under PPP (the SWAN MGH in Mumbai), have failed to meet
    their stated policy goals. Instead of improving services for the poor, such initiatives
    are bringing greater exclusion and marginalization. Findings suggest that PPPs
    in their current form, as a surrogate for the state''s social responsibilities
    (like health care), are ill-advised on many counts.


    > (p.119) In this particular case, the state has justified a shift in social policy
    on the pretext of lack of funds, and in the process neglected its responsibility
    towards the health of the poor. Under MCM''s market-oriented philosophy, servicing
    the poor was seen as a drain on the state''s resources. The government thus justified
    the reconfiguration of the public health apparatus in the name of catering to
    the poor through market mechanisms, while creating more benefits for paying patients
    and the private partner. The more damaging implication is that even the bureaucracy
    is not always guided by a culture of public service. Elements within the babadum
    are no less commercial than private players and often facilitate this process
    in many ways.


    Inequality of provisioning is overtly embedded in PPP MoUs through active connivance
