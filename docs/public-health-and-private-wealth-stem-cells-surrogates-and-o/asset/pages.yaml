    and the role of commissions in referral for clinical and (p.122) diagnostic testing
    to the private sector. Further, the private sector has grown as a result of various
    subsidies and incentives provided by the public sector. These include investment
    in medical, nursing and paramedical education, bank loans for doctor entrepreneurs,
    the reduction of import duties on high technology medical equipment, granting
    of an industry status to hospitals to facilitate access to loans, and subsidies
    for infrastructure from investment companies.


    For the purpose of this chapter we choose to employ the concept of commercialization
    introduced by privatization as the former goes beyond the activities of the private
    actor and brings into its ambit the increasingly commercial orientation of publicly
    owned and non-profit institutions. This concept was used to study the commercialization
    of health services in low and middle countries by Mackintosh and Koivusalo (2005).³
    Most health service systems across developed and developing countries have been
    transformed along the principles of commercialization and India is no exception.
    Mackintosh and Koivusalo (2005) define commercialization as


    > the provision of health care services through market relationships to those
    to pay; investment, and production of those services, and inputs to them, cash
    income or profit, including private contracting and supply to publicly financed
    health care; and health care derived from individual payments and private insurance.⁴


