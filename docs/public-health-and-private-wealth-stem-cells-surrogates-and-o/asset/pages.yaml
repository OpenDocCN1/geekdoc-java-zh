    the structural causes of poverty, the ‘anti-politics machine’ of development simultaneously
    expands and entrenches bureaucratic state power.³38


    In an effort to provide immediate, practical solutions to the physical symptoms
    of poverty, Taylor and his colleagues produced a blueprint for a system of health
    intervention to improve the health of the poor (p.79) without improving their
    socioeconomic status. In doing so, ‘equity’ isolated the bodies of the poor from
    their social, economic, and political contexts, and transformed them into objects
    of medical knowledge and management. In addition, Taylor promoted ‘surveillance
    for equity’ as a way to improve health at low cost; ‘equity’ in health outcomes
    were also compatible with efficiency of health care provision. Thus, ‘surveillance
    for equity’ required economic redistribution and social change within nor nations.
    In place of political and structural equality, Taylor’s model provided the poor
    with continuous monitoring.


    Taylor began to advocate ‘equity’ in health during the mid-1970s. He crystallized
    his ideas within a 1992 article titled ‘Surveillance for Equity in Primary Health
    Care: Policy Implications from International Experience’.³⁹ In this article, Taylor
    outlined what he described as a ‘management paradigm’ for improving health using
    epidemiological methods of surveillance. In summary, Taylor argued that health
    could be controlled by ‘identifying subgroups among whose disease and risk are
    concentrated, defining priority problems, and implementing corrective interventions’⁴⁰
    Taylor suggested that international organizations should make the implementation
    of a health care system within their aid.⁴¹


    In his ‘Surveillance for Equity’ article, Taylor offered an ‘operational definition’
    of ‘equity’ as the ‘distribution of benefits across demonstrable need rather than
    on the basis of political or socioeconomic privilege’.⁴² Taylor made an important
    distinction between the concept of ‘equity’ in health and alternative notions
    of equity. He explained that his approach to health ‘equity’ differed from others
    which aimed to ‘promote fairness’ in that it focused on ‘disparities in health
    status’, rather than inequalities in provision of, or access to, health services.³³
    In short, Taylor argued that his model of ‘surveillance for equity’ could produce
    equitable health outputs—expressed as (p.80) measurable health indices—rather
    than equality of health care inputs. Distribution of, and access to, health care
    were not at issue in the ‘surveillance for equity’ model. Nor was the broader
    question of socioeconomic inequality—with its known effects on health—under scrutiny.
    At stake was the distribution of health itself. I will return to this important
    distinction later. However, in order to further understand the concept of ‘surveillance
    for equity’, this chapter will first outline how Taylor proposed this system should
    operate in practice.'
