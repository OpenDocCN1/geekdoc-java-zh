    The Depolitization of Poverty


    By contrast, Taylor''s concept of ''surveillance for equity'' bypassed these commitments
    to redistribute entirely. In fact, ''surveillance for equity'' was designed to
    produce optimal ''outputs'' at low cost, without additional'
