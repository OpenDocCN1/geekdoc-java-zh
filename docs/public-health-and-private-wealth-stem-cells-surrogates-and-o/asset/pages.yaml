    # Introduction


    Science, Technology, and Medicine in India: The Problem of Poverty


    Sarah Hodges

    Mohan Rao


    DOI:10.1093/acprof/oso/9780199463374.001.0001


    # Abstract and Keywords


    Today more than ever, we confront a pressing question: Has the problem of poverty
    in India been solved, or the rise of new narratives that frame India as a viable
    economic growth? This volume charts changes in the conceptualization of poverty,
    the poor, and how best to understand and intervene in the career of poverty and
    in the lives of the poor. Together we ask two questions: (1) What accounts for
    a change in the targeting of poverty (and its corollary social determinants of
    health) to targeting the poor? (2) How did poverty fall off within the trajectories
    of science, technologies, and medicine in India Does the career of poverty illuminate
    broader patterns—particularly ones in which the poor change from being a problem
    of poverty to a resource for its solution and economic growth more broadly?


    Keywords: poverty, India, science, technology, medicine, economic resource


    As ‘dream theory’ in 1901 or ‘garibi haata’ in 1971, the eradication of poverty
    was the predominant economic, political, and social paradigm through which India’s
    late colonial, national, and post-independence critics and leaders constructed
    their legitimacy. Whether as critics of India’s poverty, or as architects of measures
    for its eradication, India’s commentators called a broad framework of ‘science’
    both to diagnose and treat poverty. Looking back, we are today'
  merge: -1
  pgno: 9
