    # (p.60) Annual Risk of Infection, the Stylo Rule and Global Estimates for TB


    The need for ''risk of infection'' information arose from concerns over the severe
    pace of TB morbidity and mortality information, especially in developing countries.68
    Understanding the rate of new infection was important for controlling measures,
    as ''the epidemiology of tuberculosis may differ between communities with high
    and low risks of infection'';69 The concept of annual risk of tuberculosis infection
    (ARTI, or ARI) is defined as the probability of acquiring new infection or re-infection
    during the course of one year, and is computed from the estimated prevalence of
    infection among young children tested through tuberculin skin test surveys.;70
    A concept developed by Stylo at the TSRU in 1969, is thus a calculated average
    from an observed prevalence of infection, approximating the incidence of infection.71


    (p.61) Incidence of disease; prevalence to existing cases or cases of disease.
    ARTI has the potential to be informative about the extent of transmission of tuberculosis
    bacilli in a community.72


