    that contribute directly to improving the quality of children’s lives’.94 Therefore,
    through a series of technical interventions, health experts could address poor
    health without addressing poverty.


    Indeed, the Narangwal study was geared towards providing solutions to the physical
    manifestations of poverty. The design of the Narangwal study incorporated strategies
    such as the recruitment of individuals who had previously worked on practical
    development programs serving communities. Reports from the Narangwal study stressed
    that such strategies helped keep services ‘simple, practical and inexpensive’
    by reducing ‘the tendency to concentrate on complicated and esoteric ideas which
    seem academically interesting but are the economic constraints of developing countries’.95
    In other words, the Narangwal study deliberately circumvented the problem of poverty
    in order to focus on specific, technical interventions which were within the immediate
    remit of public health experts.


    # Entering Wedge


    Yet, Taylor viewed these short-term technical interventions as part of a longer-term
    strategy of economic transformation. Taylor claimed that the integrated package
    of health, family planning, and nutrition he proposed to deliver via the ‘surveillance
    for equity’ model could not only improve health outcomes, but also act as (p.94)
    entering wedge in the process of socioeconomic development’.96 It is striking
    that Taylor chose this particular phrase—‘entering wedge’—to talk about health
    care provision. It is striking because this is the phrase which the Rockefeller
    Foundation used to describe the role of its public health work in paving the way
    for industrial capitalism during the early twentieth century. Wicklif, the first
    director of the Rockefeller Foundation’s International Health Board (IHB), described
    the IHB’s groundwork campaigns as an ‘entering wedge to enlighten public interest
    and participation in public health.’97—otherwise known as the ‘term of laziness’
    because of its association with low productivity—the Rockefeller Foundation’s
    first public health project. The Rockefeller Sanitary Commission instigated its
    first groundwork campaign in 1909 in order to facilitate industrial capitalism
    in the southern states of the US.98 Internationally, another Rockefeller Foundation
    officer described their public health work as ‘an entering wedge for permanent
    influencing influences’ as industrial tools.’99


    Just as the Rockefeller Foundation’s earlier public health work aimed to pave
    the way for industrial capitalism, Taylor saw ‘surveillance for equity’ as a means
    to raise the productivity of the poorest peoples in the ‘underdeveloped’ nations
    and pave the way for economic ‘development.’ He wrote:


    It seems evident that in order to work hard people need hope. If life holds less
    threat of death, illness, chronic weakness from lack of nutrients, and days from
    stressful make the daily efforts of the poor'
