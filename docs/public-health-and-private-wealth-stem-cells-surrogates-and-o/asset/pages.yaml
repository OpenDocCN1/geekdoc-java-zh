  md: '# ‘Surveillance for Equity’?


    Within Taylor’s model, the key to achieving health ‘equity’ was the establishment
    of surveillance, which Taylor defined as ‘an information system to identify emerging
    problems promptly so as to respond with appropriate action’.44 The system of surveillance
    which Taylor proposed to deliver health ‘equity’ was a modified version of the
    epidemiologic methodology—as I described earlier in this chapter—the Khanna Study
    had employed. In the same way as the Khanna Study surveyed, ‘surveillance for
    equity’ consisted of ‘systematic monitoring’ of a district population. The first
    step towards establishing this system was the registration of all families in
    the district.45 Next, health workers would work with ‘community leaders’ to identify
    ‘priority problems’ and decide how to allocate resources most efficiently.’46
    As part of this process, health workers would also identify what Taylor called
    ‘equity indicators’. That is, specific health indices—for example, the distribution
    of births and deaths, and child growth—in which disparities between socioeconomic
    groups were visible. By identifying these ‘equity indicators’, health workers
    could concentrate their efforts among ‘high risk groups’ whose health measured
    poorest these indices.’47


    Once health workers had registered all families, identified priorities and established
    ‘equity’ indices, they would continue to monitor the community by visiting each
    home at least once a year. Community health workers would visit homes in poorer
    areas, in which they had ‘high risk’ subpopulations, more frequently. For example,
    a (p.81) population with high death rates and poor rates of child growth would
    be a prime target for more intensive surveillance. By paying particular attention
    to these ‘high risk’ homes, health workers could identify and treat illnesses—or
    potential illnesses—at an early stage, using ‘simple and low-cost interventions.’48
    In this way, community health programmes could level disparities in ‘equity indicators’
    between social groups, and maximize health outputs without adding extra services.
    Thus, Taylor argued that ‘equity and efficiency’ could be ‘complementary’.49


    ‘Surveillance for equity’ meant continuous, intensive targeting of the bodies
    of the poor to equalize specific health indices without additional health care
    inputs. As the most socially disadvantaged people were transformed into ‘high-risk’
    medical subgroups, their poor health could be improved through rational medical
    management. Taylor considered households not only to be the sites of highest disease
    concentration, he also considered these households to be the least able to manage
    their own health. Taylor explicitly stated that health workers should provide
    the most intensive surveillance for the ‘poor and least educated’. By contrast,
    Taylor suggested that ‘educated’ families could be taught to conduct much of their
    own monitoring—for example, by weighing and initiate their own care.50 Within
    the ‘surveillance for equity’'
