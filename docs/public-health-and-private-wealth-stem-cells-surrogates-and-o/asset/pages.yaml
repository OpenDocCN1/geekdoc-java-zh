    # Background


    The 86-bedded hospital, well-utilized by women from eight slums till the 1980s,
    was reduced to an effective strength of 20 by the mid-1990s owing to neglect by
    MCGM. In 1997-8, the state-owned power company offered to upgrade it to a 100-bedded
    hospital to provide health care for its employees.²¹ In 1998, MCGM and the power
    company (hereafter PC) entered into an agreement that resulted in the reconstruction
    of a 544 square feet (basement + ground + six floors) peripheral hospital at a
    cost of INR 62.5 million using PC’s welfare funds. However, MCGM soon declared
    its inability to keep its commitment of annual operational costs, estimated at
    INR 22.5 million. With PPPs in vogue, MCGM entered into a tripartite memorandum
    of understanding (MoU) with PC and a faith-based charitable trust (hereafter CT),
    in April 2002.


    # The Contours of the MoU²


    The CT was entrusted with the maintenance and management of SWAN MGH—a 100-bedded
    hospital equipped with an out-patient department (OPD), an in-patient department
    (IPD), and an operation theatre; services in medicine, surgery, pediatrics, gynaecology
    and obstetrics, and basic diagnostic facilities in pathology and radiology—‘no-profit-no-loss’
    basis.(p.110) for an initial period of 30 years on ‘caretaker’²³


    The CT’s obligations:


    +   1. To ‘reserve’ services and facilities for the poor and needy—40 cent of
    all out-patients and 33 cent of all in-patients—referred to ‘general’ patients,
    at charges prescribed by MCGM,²⁴²⁵

    2. To give quality care to all—ensure a high standard of medical care without
    discrimination and distinction between ‘general’ and paying patients.'
