  md: '# Globalization and the Health of the Megacity


    the health care landscape of Mumbai over the last few eventful decades and examines
    the PPP that converts a dysfunctional municipal maternity home into a multi-specialty
    peripheral hospital, ostensibly benefiting the slum-dwellers in the catchment
    area. It further attempts to infer the implications of PPPs on access to health
    care services and draws lessons for public policy from this experience.


    With global economic and market forces increasingly driving social policies, erstwhile
    the democratic welfare state and its citizens getting radically redefined by the
    private sector playing a significantly greater role. For countries low on human
    development, opening up of social sectors like health and education raises (p.100)
    serious concerns about the efficacy of such measures. These policy shifts have
    raised moral dilemmas and ideological debates over the world.


    In India, international norms of health policy—with greater emphasis on the private
    sector—mediated through the World Bank package for health reforms initiated during
    the 1990s. International debates on health strategies for developing countries
    pushed policy towards privatization of public provision for health care through
    PPPs. A central concern with PPPs as a prominent route to organizing and delivering
    public health services is its suitability and effectiveness in honouring public
    health commitments of the state. What do partnerships mean for equity and access
    to good health care services for the context where trends in public health are
    not encouraging? We will examine the withering social commitment of the state
    and the resulting inequities through an analysis of changing modes of health service
    delivery, particularly the emergence of PPPs.


    This chapter attempts to assess the social impact of the changing health care
    delivery system in the city of Mumbai. It is divided into three sections. The
    first provides an overview of Mumbai''s health care system, taking stock of the
    public and private infrastructure and the inequities it breeds. The second section
    studies the changes in the city''s health care infrastructure over the last two
    decades with a focus on health care for the poor. It reviews how new policy initiatives
    push privatization of the public health system and how these changes are formulated
    and operationalized. In the third section, the first public health PPP of its
    kind in Mumbai, in which a Municipal Corporation of Greater Mumbai (MCGM) underwent
    a transformation, is discussed as an illustration of changing relationships of
    state and private sector. In conclusion, the broader implications of the findings
    of this case study for the poor are analysed in the context of engendering greater
    exclusions through new forms of marginalization.


