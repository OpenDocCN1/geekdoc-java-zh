    There was a wide consensus, among the different conceptual and technical critiques
    that emerged, ‘burden of disease’ was defined in normative terms, excluding socioeconomic
    factors which had a significant influence on the actual burden experienced by
    an individual, family or community.The measure was criticized for having moved
    the idea of health back from ‘well-being’ to a greater disease orientation and
    focus on health, with the entire exercise aiming to ‘justify technical interventions
    and undermine socio-political dimensions of health’. Thus, not the evidence base
    nor these trends deployed for TB programmes during these decades purged any possibility
    of a socioeconomic or political economy perspective on TB disease and treatment;
    the question of TB as a social disease remained bounded by cost-effective biomedical
    interventions for infectious disease control.


    This chapter has attempted to lay out the processes behind the casting of poverty
    in TB through a techno-scientific framing. It has discussed the ways this has
    been articulated through an individualized, behavioural framing of the structure
    of care, as well as a cost-effectiveness framing of the attainment of health.
    It has shown this ways having attained legitimacy, and been translated from (p.69)
    local to global contexts under the aegis of influential scientific and policy-making
    initiatives.


    This discussion has shown that the stable and dynamic nature of scientific judgements,
    such judgements tend to be ‘artefacts of the chosen rather than [ ] representations
    of reality’.The Chapter has tried to elaborate the manners in which scientific
    judgements get validated from being ‘backed up by an organisational infrastructure;
    and these rightly tends to emphasize those aspects of risk that its scientific
    bureaucracy has the tools to measure’.


    For the most part, this chapter has to illustrate that poverty appearing to hold
    sway over a mirage; the development of scientific tools and policy in TB has consistently
    ruptured any possibility of engaging with the structural, political, and discursive
    elements of poverty in TB.


