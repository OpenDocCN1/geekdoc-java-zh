    A number of scholars have identified certain US legislative measures that made
    scientific research institutions more friendly one of the important factors for
    the growth of US industry. The Stevenson-Wydler Technology Innovation Act and
    the Bayou-Dole Act, both passed in 1980, prepared the grounds for ''interaction''
    between the US academia and industry. These legislations fostered the transfer
    of technologies developed in federally funded research institutions to industries
    for their commercialization and made it mandatory for universities to patent technologies
    developed by them.


    (p.213) These legislative measures were part and parcel of larger reforms initiated
    by the US since the 1970s. In the US, neoliberal reforms led to the privatization
    of higher education and R&D. Spending on higher educational institutions declined
    gradually in the last four decades. In 2006-7, state contribution to the total
    budgets of public research institutions was close to 20 per cent.¹² In the US,
    public research institutions primarily depend on corporate investment. US corporations
    have increasingly abandoned the process of in-house R&D. They outsource their
    research and development to process research organizations and universities.³⁴
    While the general tendency of neoliberal reforms is to promote privatization,
    it adopts different strategies in different institutional and political contexts.
    For instance, scientific research and development activities are mainly carried
    out by public-funded universities and research institutes. Although the investment
    of private sector in R&D activities has increased in recent years, their contribution
    to total R&D expenditure in India still remains close to 20 per cent.⁵ However,
    the neoliberal policies pursued by India since the early 1990s have initiated
    a series of reforms in public-funded scientific research institutions which have
    increasingly become market friendly and industry oriented.


    We can take the case of the CSIR to highlight the neoliberal reframing of scientific
    research institutions in India. Established in 1942, the CSIR is a body that coordinates
    and supports a network of 37 public-funded research laboratories and institutes.³⁵
    The CSIR''s mandate was to promote scientific and industrial research which would
    cater to the requirements of industry. It is important to note that in the pre-reform
    period the industrial sector in India was largely dominated by Public Sector Undertakings
    (PSUs). In the early 1980s, ‘public sector (p.214) enjoyed a 3:1 advantage over
    the private sector in paid-up capital, and a 4:1 advantage in the value of sales⁶
    However, the CSIR''s contributions to PSUs, which were largely dependent on imported
    technologies, were minimal. The CSIR continues to fail in its mandate.³⁷


    With the introduction of neoliberal policies, the process of privatization of
    PSUs and metamorphosis of the CSIR started. In fact, in 1986, the CSIR Review
    Committee for the Development of Science and Technology laid the foundation for
    changes in the CSIR⁸ This Committee was headed by Abid Hussain, who was a member
    of the Planning Committee, and a key figure in the'
