    the language of social justice. In particular, this chapter argues by focusing
    narrowly on health inputs and outputs, the model of health equity systematically
    erased the political and structural causes of poverty, and replaced them with
    technical causes, requiring technical solutions. In short, ‘surveillance for equity’
    isolated the bodies of the poor from their social, economic, and political contexts,
    and transformed them into objects of medical knowledge and management.


