    treatment that claimed the emergence and uptake of medical technology has largely
    been responsible for the commodification of hospital care in India. Here to refute
    this argument briefly, for India, beginning in the 1980s, intensive medical technologies
    (such as MRI scanners, CT Scans) came to dominate clinical diagnostics and hospital
    care. Practitioners who purchased these machines were under pressure to make their
    money back as quickly as possible. Because this equipment required substantial
    outlay, and were often financed through debt. Whereas the earlier model of care
    in smaller private hospitals and pathology labs, a regime of ‘interpretation changes’
    came to dominate the relationships that connected practitioners’ diagnostic practices
    to the prospect of broader financial gain. Under the large multi-specificity private
    hospital model, hospitals took on more debt, but consolidated clinical diagnosis
    and care under one roof. Having taken on debt, hospitals needed to net more revenue.
    This in turn drove more investigations with specialist equipment, which in turn
    led to more diagnoses of care and treatment, and often, further investigations.
    In other words, use (and what is suggested here is deliberate overuse) of one
    piece of equipment not only to pay for itself but the revenues from one machine
    were designed to push the purchase of the next. This has been particularly the
    case in a landscape of rapidly'
