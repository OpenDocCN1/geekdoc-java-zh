    The Politics of Health and Social Justice: From Bucharest to Alma ATA

    How we explain this shift in terminology? I suggest that Taylor and his colleagues''
    concern for ''equity'' was a response to the prevailing political climate. Taylor
    began to write frequently about social justice and equity in the mid-1970s. He
    did so specifically in response to the questions surrounding international inequality,
    and for the redistribution of resources, represented by the New International
    Economic Order (NIEO). In 1974, a special session of the General Assembly of the
    United Nations adopted a declaration which called for the establishment of a NIEO
    ''based on equity, sovereign equality, interdependence, common interest and cooperation
    among all States ... which shall correct all inequalities and redress injustices''.75

    The General Assembly also adopted a Programme of Action which would implement
    the principles of the NIEO through a series of economic measures—incorporating
    international production, consumption and trade.76


    The political climate surrounding the formation of the NIEO had a palpable impact
    on international health and population debates. One notable example of this effect
    was the rhetoric of the 1974 World Population Conference in Bucharest. During
    the Bucharest conference, (p.89) delegates from the called third nations rejected
    the idea of narrow population control in favour of a broader approach to the redistribution
    of resources and economic development.77 For instance, Karan Singh, Minister of
    Health and Family Planning for India, declared that ''development is best contraceptive;
    a move which—like the ostensible drive for health ‘equity’—cannot be seen as anything
    but rhetorical in light of the aggressive population control programme Singh oversaw
    during the Emergency of 1975–7.78


    In his writings, Taylor noted this increasing concern for social justice and human
    rights, and referred specifically to the NIEO and Bucharest conference.79 Taylor
    wrote that the NIEO was ''attempting to articulate a new approach focusing on
    the basic human needs of the world’s poorest billion''.80 He argued that international
    assistance programmes should help translate these concepts of social justice into
    international standards and norms''.81 Through his involvement with ‘equity'',
    therefore, Taylor simply reinterpreted his pre-existing public health work in
    the light of prominent political concerns.


    Others also began to talk about health ‘equity’ during this period. During, during
    the 1970s, the concept of ‘equity’ began to take off internationally. Figure 3.1—which
    shows the number of texts that employed the words ‘health’ and ‘equity’ between
    1970 and 2013 in the PubMed database of biomedical'
