    high levels of infant and maternal mortality, and the incidence of diseases like
    cholera, typhoid, and malaria. A correlation between poverty and the so-called
    tropical diseases has become almost axiomatic.¹ But this has not always been the
    case and it is worthwhile to consider when and how the concept of poverty began
    to impact on the medical and sanitary understanding in India and how began to
    figure in emerging public health discourse and practice. An obvious point of reference
    for such is Michel Foucault''s discourse on governmentality, but this also draws
    inspiration from Christopher'
