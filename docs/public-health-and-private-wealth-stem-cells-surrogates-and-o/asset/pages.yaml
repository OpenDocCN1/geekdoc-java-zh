    # Commercialization and the Poverty of Public Health Services in India


    Rama Baru


    DOI:10.1093/acprof:oso/9780199463374.003.0006


    # Abstract and Keywords


    This chapter traces the shifts in the relationship between the public and private
    sectors in medical care over the twentieth century and argues that the boundaries
    between the two are blurred. The author makes a critical distinction between privatization
    and commercialization, drawing attention to the fact that what is edited in discussions
    of privatization is how market principles and commercialization are taking place
    in the public sector itself. To say, even the public and non-profit sector can
    become ‘commercialized’ without getting ‘privatized’. Not only does the author
    claim that this commercialization is leading to the culture of unnecessary investigations
    and interventions, it is also leading to demoralization in the public sector.


    *Keywords:* India, commercialization, health care, privatization, twentieth century,
    public sector


    This chapter examines the transformation of commercial medicine over the last
    six decades. Much of the scholarly writing on this subject has tended to focus
    on the characteristics, distribution, quality, and role of the ‘for-profit’ segment
    of the private sector:¹ A few scholars have argued, that it is important to acknowledge
    that there is a mixed economy in health services.² The public and private sectors
    have not grown independently of one another. The latter has used the former as
    a springboard for its growth resulting in the blurring of boundaries between these
    two sectors. There are several pathways through which these sectors are interrelated.
    Include private practice by government doctors, their engagement with the private
    hospitals as consultants,'
