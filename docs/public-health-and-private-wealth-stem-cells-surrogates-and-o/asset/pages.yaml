    government and non-government institutions across India have, in turn, adopted
    the family folder system of the Ludhiana CMC for community health work.32


    (p.77) Most important for the purposes of this chapter were the uses to which
    Taylor his family-based system of surveillance after the Khanna study. During
    the mid-1960s to mid-1970s, Taylor adapted the field procedures of the Khanna
    study to a field study at Narangwal, also in the Ludhiana District of Punjab.33
    The Narangwal study consisted of two interconnected research projects: a nutrition
    study and a population study. Through the nutrition study, Taylor and his colleagues
    from the Department of International Health at the JHSPI sought out to demonstrate
    that a clear relationship existed between nutrition and infection. Specifically,
    the Narangwal nutrition study aimed to test the hypothesis that villages in which
    community health workers provided better nutritional supplements and medical care
    would have better health outcomes than villages in which health workers supplied
    either medical or nutritional services.34


    Meanwhile, the Narangwal population study attempted to show that an integrated
    program of maternal and child health and family planning services would be more
    effective at reducing the birth rate than the so-called ‘vertical’ interventions—such
    as the Khanna study—which offered family planning services. Underpinning this
    approach was what Taylor called the ‘child survival hypothesis’. That is, the
    idea that couples would be more likely to limit the size (p.78) of families if
    they could be sure that their children were likely to survive until adulthood.35
    Parallel to these two academic goals, the Narangwal study also developed a package
    of integrated health care which combined family planning, women’s services, care,
    and nutrition. The Narangwal study team aimed to demonstrate how such a package
    could be rolled out, across India and beyond, at minimal cost.36


    Lastly, from the mid-1970s, Taylor argued that this system of surveillance, centred
    upon family folders and house-to-house visitation, could enable public health
    practitioners to address a rapidly-growing concern among international health
    experts: ‘equity’ in health. What is ‘equity’ in health, and how did Taylor believe
    surveillance would deliver it?


    Taylor conceptualized ‘equity’ in health as a means of delivering equity in outcomes
    on the basis of socioeconomic justice. In other words, ‘equity’ was a means to
    mitigate the physical manifestations of poverty—in terms of increased ill-health—without
    addressing the root causes of poverty. Taylor’s approach to ‘equity’ is an explicit
    example of what James Ferguson terms the ‘anti-politics’ of development projects.
    That, is, the process whereby the political and structural causes of poverty are
    ‘systematically erased and replaced with technical solutions.’37 While silencing'
