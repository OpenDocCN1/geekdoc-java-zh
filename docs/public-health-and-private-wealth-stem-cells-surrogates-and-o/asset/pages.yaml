    # Re-Casting Poverty Through Techno-Scientific Rationality


    The domain of policy is an interweaving of technical, managerial, and political
    characteristics; it is fleshed in the power relations and hierarchies between
    citizens, experts, and political authorities. Such reading has been interpreted
    as an advancing instance of Foucault’s concept of ‘political technologies’.^6
    Dreyfus and Rabinin, dialoguing with Foucault, note that ‘p[olitical technologies
    advance by taking what is essentially a political problem, removing it from the
    realm of political discourse, and recasting it into the neural language of science.
    Once this is achieved, the problems become technical ones for specialists to debate.^9
    Alongside, there is also the question of the nature of scientific expertise, and
    how ‘the power of the professions depends, at least in part, on the ability to
    make claims successfully about the scientific value of their work and the way
    in which they (p.44) professional knowledge is grounded in practise, accurate
    and reliable scientific information’.^10


    Critics have, however, pointed out that the unstable and dynamic nature of scientific
    judgements, such deemed to be ‘artefacts of the chosen methodologies rather than
    [ ] representations of reality.^11 The validation of scientific judgements from
    being ‘backed up by an organizational infrastructure’ further merits scrutiny,
    as organizational bureaucracy tends to ‘emphasize the aspects of risk that this
    bureaucracy has the tools to measure (expected losses) at expense of less measured,
    but not necessarily important, aspects of risk-bearing.^12 Further, policies from
    the realm of politics can appear ‘technical responses to particular problems,
    which fall within the mandate or objectives for which an international organization
    has established.^13


    Thus, we have critical analyses of the controversies arresting the development
    of international BCG vaccination policies by the World Health Organization'
