    Empirical evidence from this study suggests that existing PPP models in the health
    sector are tantamount to privatization of public assets and the attendant destruction
    of public institutions, particularly in the absence of any regulatory framework.
    In contrast, while public health facilities may not have been able to attain the
    desired levels of efficacy, their intent to ameliorate the pain and suffering
    of the poor never been in question as their mandate is better defined.


    This chapter concludes that there is no ground to dismantle public health care
    or place undue faith in the market economy for fulfilling the state''s social
    obligations. This would only push the poor into further deprivation or marginalize
    them, grievous affecting their health. Along with the ability of PPP-like initiatives
    (p.120) to deliver public good, there is a growing conviction that revival and
    strengthening of the public health system is urgently called for.


