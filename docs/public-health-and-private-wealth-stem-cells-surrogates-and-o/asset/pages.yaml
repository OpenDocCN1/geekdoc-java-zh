    # ‘It All Changed after Apollo’ and Other Corporate Hospital Myths


    Sarah Hodges


    DOI:10.1093/acprf:oso/9780199463374.003.0007


    # Abstract and Keywords


    In this chapter, the author examines a touchstone in India’s recent health history:
    that the 1983 launch and subsequent three-decade career of Apollo Hospitals in
    Chennai. She argues that one of the singular successes of Apollo Hospitals (and
    its founder and Chairman, Prathap Reddy) has in image management. In order to
    do this, the author explores the popular myths that these stories are regularly
    reproduced around Apollo and Reddy and also how these stories survive within a
    community of medical professionals across the region. To anticipate the argument
    somewhat, the Apollo ‘success story’, which central to today’s dominant narrative
    of economic growth produced by India’s private health care sector, is based on
    assumptions and assertion. These assumptions and assertions begin to crumble under
    the most basic historical scrutiny. In short, in three decades, Apollo’s greatest
    success may perhaps be its story.


    Keywords: Apollo Hospitals, Prathap Reddy, corporate health, India, myth-making


