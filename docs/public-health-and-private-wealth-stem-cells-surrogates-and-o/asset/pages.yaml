    # Rebecca Williams


    is Lecturer in Medical History at the University of Exeter. Her

    research interests are in the history of medicine and development in

    modern South Asia, particularly the history of population control in

    India. She received her PhD from the University of Warwick, UK. Her

    doctal thesis looked at the establishment of India as a ‘laboratory’

    for population control during the 1950s, focusing on a well-known

    family planning project known as the Khanna Study. She has also

