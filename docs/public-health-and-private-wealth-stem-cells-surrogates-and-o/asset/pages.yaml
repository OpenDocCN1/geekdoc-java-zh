    # Methodology


    This chapter is based on a study carried out between April and May 2010. The methodology
    included secondary research (newspaper articles, journal publications, and so
    on) and primary data collection through observations, in-depth interviews, and
    group discussions. The respondents were purposively selected and included the
    management and staff of SWAN Municipal General Hospital (hereafter, SWAN MGH),
    the local corporation, MCGM officials, social workers, and patients (and their
    families) who were treated at the hospital.¹⁹ SWAN MGH officials agreed to a request
    for a one-time interview (p.109) were reluctant to share concrete information
    (agreement details, utilization statistics, and beneficiary details) or allow
