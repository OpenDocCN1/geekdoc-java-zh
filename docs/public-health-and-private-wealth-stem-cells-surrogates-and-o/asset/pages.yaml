    # (p.26) Poverty and the New Public Health


    By the 1890s the colonial medical establishment in India was moving away from
    miasmatic theories of disease to explanations grounded in bacteriology, parasitology,
    and entomology. The new ‘scientific’ focus of this ‘biomedical mission’, as Hamlin
    describes it, tended to still diminish rather than enhance the attention paid
    to poverty as a causative factor.² One example of this was the bubonic plague
    that erupted in Bombay in 1896.² The common-sense view, as expressed in the press
    and initially by some government officers, that plague was essentially ‘a poor
    man’s disease’, for it seemed to be the poorer quarters of Bombay city that were
    hardest in the epidemic’s phase.²² But increasing the poverty question was marginalized
    as the British responded to the epidemic by focusing, for the inspection of Indian
    bodies and then, as epidemiological knowledge progressed, on rats, rats, and their
    extermination, and on anti-plague inoculation. The reports and recommendations
    of the Indian Plague Commission and the Plague Advisory Commission between 1900
    and 1908 further directed expert opinion to the need for more detailed bacteriological
    and entomological studies.


    Eradicating rats became a far higher priority than eliminating poverty, though
    neither appeared applicable.


