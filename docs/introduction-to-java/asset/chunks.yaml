    \ + i );\n        }\n    }\n}\n```\n\nN.B: An improved ‘for loop’ is available\
    \ for collections and arrays. You would find the loop covered in the array description.\n\
    \n### The while loop\n\nThere is another repetition control structure that only\
    \ allows one to write a block of code that is executed until a specific condition\
