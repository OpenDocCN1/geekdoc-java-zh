    import java.util.Map;\nimport java.util.Set;\nimport java.util.stream.Collectors;\n\
    \npublic class Example {\n // 基于\n // https://www.eclipsecon.org/europe2015/sites/default/files/slides/2015-11-05%20EclipseCon-%20EclipseCollectionsByExample_0.pdf\n\
    \n private List<Person> people;\n\n public static void main(String[] args) {\n\
    \n      List<Person> persons = createData();\n\n // 这些人中有人养猫吗？\n\n boolean result\
    \ = persons.stream().anyMatch(person ->person.hasPet(PetType.CAT));\n\n // 有几个人养猫？\n\
    \n long catCount = persons.stream().filter(person ->person.hasPet(PetType.CAT)).count();\n\
    \n System.out.println(catCount);\n\n // 谁养了猫？\n\n      List<Person> peopleWithCats\
    \ = persons.stream().filter(person -> person.hasPet(PetType.CAT))\n\n .collect(Collectors.toList());\n\
    \n // 谁没有养猫\n\n      List<Person> peopleWithoutCats = persons.stream().filter(person\
    \ ->  !person.hasPet(PetType.CAT))\n\n .collect(Collectors.toList());\n\n // 分类有猫和没猫的人\n\
    \n      Map<Boolean, List<Person>> catsAndNoCats = persons.stream()\n\n .collect(Collectors.partitioningBy(person\
    \ ->person.hasPet(PetType.CAT)));\n\n // 获取 Tim 的猫的名字\nPerson person = persons.stream().filter(each\
    \ ->each.isNamed(\"Tim Taller\")).findFirst().get();\n\n boolean test = (\"Dolly\
    \ & Spot\") .equals(person.getPets().stream().map(Pet::getName).collect(Collectors.joining(\"\
    \ & \")));\n\n      System.out.println(\"Tim has Dolly & Spot as cats \"  + test);\n\
    \n // 获取所有的宠物类型\n\n      Set<PetType> allPetTypes = persons.stream().flatMap(p\
    \ -> p.getPetTypes().stream()).collect(Collectors.toSet());\n\n System.out.println(allPetTypes);\n\
    \n // 按姓对人分组\n\n      Map<String, List<Person>> byLastName = persons.stream().collect(Collectors.groupingBy(Person::getLastName));\n\
    \n      Map<String, List<Person>> byLastNameTargetBag = persons.stream()  .collect(Collectors.groupingBy(Person::getLastName));\
    \ System.out.println(byLastName);\n\n // 获取宠物的年龄统计信息\n\n      List<Integer> agesList\
    \ = persons.stream().flatMap(p -> p.getPets().stream()).map(Pet::getAge)  .collect(Collectors.toList());\n\
    IntSummaryStatistics stats = agesList.stream().collect(Collectors.summarizingInt(i\
    \ -> i));\n\n System.out.println(\"Min \"  + stats.getMin()  +  \" Max \"  + stats.getMax()\
    \  +  \" Average \"  + stats.getAverage());\n\n // 按宠物年龄计数\n\n      Map<Integer,\
    \ Long> counts = Collections.unmodifiableMap(persons.stream().flatMap(p -> p.getPets().stream())\n\
    \n .collect(Collectors.groupingBy(Pet::getAge, Collectors.counting())));\n\n }\n\
    \n private static List<Person> createData() {\n\n return Arrays.asList(new Person(\"\
    Tim\", \"Taller\", Arrays.asList(new Pet(PetType.CAT, \"Dolly\", 4), new Pet(PetType.CAT,\
    \ \"Spot\", 5))),\nnew Person(\"John\", \"Doe\", Arrays.asList(new Pet(PetType.DOG,\
    \ \"Fido\", 3))),\nnew Person(\"Jane\", \"Smith\", Arrays.asList(new Pet(PetType.CAT,\
    \ \"Whiskers\", 2))));\n }\n}\n```\n\n### 17: OPTIONAL\n\n`return age;`\n\n`}`\n\
    \n`}`\n\n`Optional` 类用于避免 `NullPointerException`。\n\n`Optional` 类用于在访问字段时避免 `NullPointerException`。为了避免这种异常，可以使用\
    \ `orElse` 或 `orElseGet`。\n\n`Optional` 类用于处理可能为空的值。使用 `get()` 方法时会抛出 `NoSuchElementException`。为了避免此异常，可以使用\
    \ `orElse` 或 `orElseGet`。\n\n`Optional` 类用于检查值是否存在。如果值存在，可以使用 `ifPresent` 执行某些代码。\n\
    \n`Optional` 类用于通过 `map` 方法转换对象。如果值存在，可以使用 `map` 方法进行转换。\n\n`Optional` 类用于通过 `filter`\
    \ 方法过滤某些值。如果值满足条件，可以使用 `filter` 方法进行过滤。\n\n"
- fmt: "\nTo schedule tasks, you can make use of the `java.util.Timer` or the `java.util.TimerTask`.\
    \ The `Timer` would then perform the `TimeTask` implemented by the object based\
    \ on the given interval.\n\nCheck out the illustrations below:\n\n```java\npackage\
    \ schedule;\n\nimport java.util.TimerTask;\n\npublic class MyTask extends TimerTask\
    \ {\n    private final String string;\n    private int count = 0;\n\n    public\
    \ MyTask(String string) {\n        this.string = string;\n    }\n\n    @Override\n\
    \    public void run() {\n        count++;\n        System.out.println(string\
    \ + \" called \" + count);\n    }\n}\n```\n\n```java\npackage schedule;\n\nimport\
    \ java.util.Timer;\n\npublic class ScheduleTest {\n    public static void main(String[]\
    \ args) {\n        Timer timer = new Timer();\n        // wait 2 seconds (2000\
    \ milli-secs) and then start\n        timer.schedule(new MyTask(\"Task1\"), 2000);\n\
    \        for (int i = 0; i < 100; i++) {\n            // wait 1 seconds and then\
    \ again every 5 seconds\n            timer.schedule(new MyTask(\"Task \" + i),\
    \ 1000, 5000);\n        }\n    }\n}\n```\n\n# CHAPTER 19: JAVA EXERCISES\n\n##\
    \ Exercise 1: Writing, compiling and running a Java program\n\nTest yourself with\
    \ exercises\n\n### Step 1: Write Source Code\n\nThe Java program below was developed\
    \ under Linux through the use of a command line and a text editor. How this can\
    \ be done on other operating systems should be pretty much the same, but this\
    \ illustration does not cover it.\n\n- For your Java development, choose or create\
    \ a new directory that will be used. For this illustration, we use the path `\\\
    home\\vogella\\javastarter`. For a Microsoft Windows operating system, the path\
    \ `c:\\temp\\javastarter` can be used. In the following illustration, we call\
    \ this path `javadir`.\n- Open a text editor that supports plain text. For example:\
    \ `Notepad` if you are using windows or `Gedit` if you are using Linux. Then,\
    \ write the following source code:\n\n```java\n// a small Java program\npublic\
    \ class HelloWorld {\n    public static void main(String[] args) {\n        System.out.println(\"\
    Hello World\");\n    }\n}\n```\n\n**Warning**: Never use a rich editor such as\
    \ the LibreOffice or Microsoft Word when writing your Java code. If you are not\
    \ sure, go on Google and search for ‘Plain text editor for <insert your OS>’.\n\
    \n![C:\\Users\\USER\\Downloads\\xfirstjava10.png.pagespeed.ic.-9onYaF0Km.png](Images/image00207.jpeg)\n\
    \n- Now, go to your `javadir` directory, and save the source code with the `HelloWorld.java`\
    \ filename. Always remember that the name of a Java source file must always equal\
    \ the class name (within the source code) and end with the `.java` extension.\
    \ In this exercise, the filename should be `HelloWorld.java`, due to the fact\
    \ that the class is called `HelloWorld`.\n\n### Step 2: Compiling and running\
    \ your Java program\n\n- For this step, first of all open a shell for command\
    \ line access.\nHint: If you have no clue as to how to do this, go on Google and\
    \ search for ‘How to open a shell under <insert your OS>’.\n- Now switch to the\
    \ `javadir` directory using the command `cd javadir` for instance, in the above\
    \ example through the `cd \\home\\vogella\\javastarter` command. Use the `ls`\
    \ command (`dir` under Microsoft Windows) to clarify that the source file is indeed\
    \ in the directory.\n- Now, using the command below, compile your Java source\
    \ file into a class file:\n\n```bash\njavac HelloWorld.java\n```\n\n- After a\
    \ while, list the content of the directory again using the `ls` or `dir` command.\
    \ Now, the directory contains the file `HelloWorld.class`. Note that you would\
    \ have successfully compiled your first Java source code into bytecode when you\
    \ see this file.\nHint: The compiler always puts every class file in the same\
    \ directory as its source file by default. Using the `-d` compiler flag, you can\
    \ specify a separate destination directory.\n- Finally, you can now start compiling\
    \ your Java program. Remember to make sure that you are still in the `javadir`\
    \ directory before entering the command below to start your Java program:\n\n\
    ```bash\njava HelloWorld\n```\n\n- The system would write \"Hello World\" on the\
    \ command line.\n\n![C:\\Users\\USER\\Downloads\\xfirstjava20.png.pagespeed.ic.WJun3cLajc.png](Images/image00208.jpeg)\n\
    \n### Step 3: Making use of the classpath\n\n- To run the program from another\
    \ place in your directory, you can always use the classpath.\n- All you need to\
    \ do, is switch to the command line. For example, under Windows Start Run `cmd`.\
    \ Switch to a directory of your choice, then type:\n\n```bash\njava HelloWorld\n\
    ```\n\n- The system will show an error message if you are not in the directory\
    \ where the compiled class is stored. The error message could look like this:\n\
    `Exception in thread \"main\" java.lang.NoClassDefFoundError: test/TestClass`\n\
    - Type in the command below to use the class. Substitute ‘mydirectory’ with the\
    \ directory that contains the test directory. The `HelloWorld` output should be\
    \ seen again afterwards.\n\n```bash\njava -classpath \"mydirectory\" HelloWorld\n\
    ```\n\n## Exercise 2: Creating Java objects and methods\n\n### Step 1: Create\
    \ a Person class and instantiate it\n\nCreate a new Java project called `com.vogella.javastarter.exercises1`\
    \ and a package with the same name. Create a class called `Person`.\n\nAdd three\
    \ instance variables to it, one for storing the first name of the person, one\
    \ for storing the last name and one for storing the age of the Person.\nUse the\
    \ constructor of the `Person` object to set the values to some default value.\n\
    Add a `toString` method as described by the following coding and solve the TODO.\
    \ This method is used to convert the object to a String representation.\n\nSee\
    \ illustration below:\n\n```java\n@Override\npublic String toString() {\n    //\
    \ TODO replace \"\" with the following:\n    // firstName + \" \" + lastName\n\
    \    return \"\";\n}\n```\n\nCreate a new class called `Main` with a `public static\
    \ void main (String [] args)`. In this method create an instance of the `Person`\
    \ class.\n\n### Step 2: Use constructor\n\nAdd a constructor to your `Person`\
    \ class which takes first name, last name and age as parameter. Assign the values\
    \ to your instance variables.\nIn your main method create at least one object\
    \ of type `Person` and use `System.out.println()` with the object as parameter.\n\
    \n### Step 3: Define getter and setter methods\n\nDefine methods which allow you\
    \ to read the values of the instance variables and to set them. These methods\
    \ are called setter and getter.\nGetters should start with `get` followed by the\
    \ variable name whereby the first letter of the variable is capitalized.\nSetter\
    \ should start with `set` followed by the variable name whereby the first letter\
    \ of the variable is capitalized.\n\nFor example, the variable called `firstName`\
    \ would have the `getFirstName()` getter method and the `setFirstName(String s)`\
    \ setter method.\n\nChange your main method so that you create one `Person` object\
    \ and use the setter method to change the last name.\n\n### Step 4: Create an\
    \ Address object\n\nCreate a new object called `Address`. The `Address` should\
    \ allow you to store the address of a person. ownAdd a new instance variable of\
    \ this type in the `Person` object. Also, create a getter and setter for the `Address`\
    \ object in the `Person` object.\n"
