    \ to String\nString s3 = String.valueOf(1 < 2); // \"true\"\n// Convert from date\
    \ to String\nString s4 = String.valueOf(new Date()); // \"Tue Jun 03 14:40:38\
    \ CEST 2003\"\n```\n\n#### [Conversion from String to Number](https://www.vogella.com/tutorials/JavaIntroduction/article.html#conversion_tonumber)\n\
    \n```java\n// Conversion from String to int\nint i = Integer.parseInt(String);\n\
    // Conversion from String to float\nfloat f = Float.parseFloat(String);\n// Conversion\
    \ from String to double\ndouble d = Double.parseDouble(String);\n```\n\nThe local\
    \ settings does not play a significant role in the conversion from string to number.\
    \ For example, the English notification for number is always used. A correct number\
    \ format in this notification is ‘8.20’. An error would occur if the German number\
    \ ‘8.20’ is used. The `NumberFormat` class would have to be used to convert from\
    \ a German number. There would be only one problem though; when the value is,\
    \ for instance, 98.00, the `NumberFormat` class would create a `Long` that cannot\
    \ be cast to `Double`. This is why the complex conversion class should be used.\n\
    \n```java\nprivate Double convertStringToDouble(String s) {\n  Locale l = new\
    \ Locale(\"de\", \"DE\");\n  Locale.setDefault(l);\n  NumberFormat nf = NumberFormat.getInstance();\n\
    \  Double result = 0.0;\n  try {\n    if(Class.forName(\"java.lang.Long\").isInstance(nf.parse(s)))\
    \ {\n      result = Double.parseDouble(String.valueOf(nf.parse(s)));\n    } else\
    \ {\n      result = (Double) nf.parse(new String(s));\n    }\n  } catch (ClassNotFoundException\
    \ e1) {\n    e1.printStackTrace();\n  } catch (ParseException e1) {\n    e1.printStackTrace();\n\
    \  }\n  return result;\n}\n```\n\n### [Double to int](https://www.vogella.com/tutorials/JavaIntroduction/article.html#conversion_toint)\n\
