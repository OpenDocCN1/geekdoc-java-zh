    \n# 使用默认方法演进接口\n\n在过去，Java 8 演进接口（例如向接口添加新方法）是不可能的，除非破坏现有的客户端。自从 Java 8 提供了默认方法，通过简单地提供默认实现，现在可以扩展接口而无需破坏现有的客户端。这种默认方法的发明是一个二进制且兼容的更改。\n\
    \n现在，类可以重写默认方法以提供更好的行为。\n\n## 方法的多重继承\n\n当一个类实现两个接口，且这些接口提供了相似的默认方法时，Java 将通过以下规则为类解析实际方法：\n\
    \n-   **子类型优于父类型**：如果一个类可以从两个接口继承同一个方法，且其中一个接口是另一个接口的子类型，则该类将继承来自子类型的方法。\n-  \
    \ **父类总是优于父接口**：如果一个类可以从父接口和父类继承同一个方法，则该类将继承父类方法。这条规则对于抽象和具体的父类方法尤其如此。该规则还意味着，如果该方法也在父类链中声明，则将不会使用默认方法。\n\
    -   **在所有其他情况下**，类必须实现该默认方法。\n\n下面的图演示了编号为 3 的列表：\n\n```java\npublic interface\
    \ A {\n    default void m() {}\n}\n\npublic interface B {\n    default void m()\
    \ {}\n}\n\npublic class C implements A, B {\n    @Override\n    public void m()\
    \ {}\n}\n```\n\n在进行自己的实现时，你始终可以调用你喜欢的父类方法。如下所示：\n\n```java\npublic class C implements\
    \ A, B {\n    @Override\n    public void m() {\n        A.super.m();\n    }\n\
    }\n```\n\n# 函数接口\n\n函数式接口是各种只有一个方法的接口。所有函数式接口都有一个特殊的特性：它们可以与 lambda 表达式一起使用。所有函数式接口都由\
    \ Java 编译器自动识别。它们只需要只有一个抽象方法。尽管如此，使用 `@FunctionalInterface` 注解来捕捉设计意图是非常可能的。\n\
    \n许多默认 Java 接口都是函数式接口。例如：\n\n-   `java.beans.PropertyChangeListener`\n-   `java.util.Comparator`\n\
    -   `java.io.FileFilter`\n-   `java.util.concurrent.Callable`\n-   `java.lang.Runnable`\n\
    \n还有一个名为 `java.util.function` 的包，包含了 Java 中频繁使用的函数式接口。`java.util.function` 包包括：\n\
    \n-   `BinaryOperator<T>` - 一个从 `(T, T)` 到 `T` 的函数\n-   `UnaryOperator<T>` - 一个从\
    \ `T` 到 `T` 的函数\n-   `Supplier<T>` - 提供 `T` 的实例（例如工厂）\n-   `Function<T, R>` -\
    \ 一个将 `T` 转换为 `R` 的函数\n-   `Consumer<T>` - 对对象执行的操作\n-   `Predicate<T>` - 对象的布尔值属性\n\
    \n# 第 5 章：JAVA 中的注解\n\n关于非编程逻辑本身成员的类所需的所有数据都由注解提供。注解对它们标记的代码没有直接影响。注解提供的信息或数据可以被其他组件使用。\n\
    \n注解仅存在于开发阶段（`RetentionPolicy.SOURCE`），并且只能在运行时保留（`RetentionPolicy.RUNTIME`）。\n\
    \n## @Override 注解和重写方法\n\n任何扩展另一个类的都会自动从父类继承该类的方法。要成功更改这些方法，只能重写它们。这意味着它只能重新声明这些方法。除非类本身被定义为抽象类，否则此过程是绝对必要的。\n\
    \n可以添加到此类方法中的一个注解是 `@Override` 注解。这是因为 Java 编译器用它来检查标记的方法是否实际上重写了扩展类或接口中的方法。\n\
    \n你始终可以在子类的源码中使用相同的方法签名来重写方法。同时，你也可以利用 `@Override` 注解向源代码的阅读者和 Java 编译器表明你打算重写一个方法。\n\
    \n关于如何重写父类方法的示例，请看下面的代码：\n\n```java\npackage com.vogella.javaintro.base;\n\nclass\
    \ MyBaseClass {\n    public void hello() {\n        System.out.println(\"Hello\
    \ from MyBaseClass\");\n    }\n}\n\npackage com.vogella.javaintro.base;\n\nclass\
    \ MyExtensionClass2 extends MyBaseClass {\n    @Override\n    public void hello()\
    \ {\n        System.out.println(\"Hello ExtensionClass2\");\n    }\n}\n```\n\n\
    使用 `@Override` 注解始终是一个良好的做法。这是因为确保了 Java 编译器会验证你是否真的重写了方法。\n\n## @Deprecated 注解\n\
    \n该注解可以用于类、构造函数、方法或字段，并表示该元素已过时，不应使用。\n\n## 类型注解\n\n根据 Java 规定，注解可以放在任何类型上。下面是一个示例：\n\
    \n```java\n@NonNull String name;\n\nList<@NonNull String> names;\n\nclass UnmodifiableList<T>\
    \ {}\n\nemail = (@Email String) input;\n\nnew @Information Object();\n\nvoid doSomething()\
    \ throws @ImportantMe Exception { }\n```# 第 6 章：变量与方法\n\n## 变量\n\nJava 程序通过变量在运行时存储值。变量分为基本类型或引用。基本类型包含值，而引用类型包含对象的指针（或引用）。这意味着在比较引用变量时，实际上是在比较它们是否指向同一个对象。\n\
    \n利用 `object1.equals(object2)` 方法调用来识别对象是否相同相同。\n\n## 实例变量\n\n实例变量是与类的实例（或对象）关联的变量。访问适用于这些对象。所有实例变量都可以被标记为\
    \ `transient` 或 `final`，并具有任何访问控制。而且，一旦实例变量被标记为 `final`，在赋值后就不能再更改。\n\n## 局部变量\n\
    \n局部（或栈）变量声明是那些无法访问修饰符的。所有局部变量都没有默认值，因此在使用它们之前必须初始化。事实上，局部变量唯一的可用修饰符是 `final`。该修饰符定义了在第一次赋值后变量无法更改。\n\
    \n## 方法\n\n具有返回值和参数的代码块被称为方法。方法始终可以在对象上调用。\n\n```java\npackage com.vogella.javaintro.base;\n\
    \npublic class MyMethodExample {\n    void tester(String s) {\n        System.out.println(\"\
    Hello World\");\n    }\n}\n```\n\n可以使用变长参数来声明方法。发生这种情况时，方法声明了一个接受从零到多个参数的参数（语法：`type\
    \ ... name`）。一个方法只能有一个变长参数，且该参数必须是方法的最后一个参数。\n\n重写父类方法：\n\n"
- fmt: "\nThere is a rule that states that a method must be of the same arguments\
    \ and the exact same return parameter. It also states that the return parameter\
    \ must be the same.\n\n## Overload methods\n\nAny method that has the same name,\
    \ but different arguments is called an overloaded method. The return type can\
    \ never be used to overload a method.\n\n## Main method\n\nThere is a `public\
    \ static` method with a signature that can be used to start a Java application\
    \ (check for signature below). This `public static` method is usually referred\
    \ to as the main method.\n\n```java\npublic static void main(String[] args) {}\n\
    ```\n\n## Constructors\n\nEvery class contains one or two constructors that are\
    \ invoked by the Java runtime to create objects based on the definition of the\
    \ class. Except for the fact that they use the name of the class and come with\
    \ no return type, constructor declarations look like method declarations.\n\n\
    Every class can have several constructors with varying parameters. In the illustration\
    \ below, the constructor of the class expects a parameter:\n\n```java\npackage\
    \ com.vogella.javaintro.base;\n\npublic class MyConstructorExample2 {\n    String\
    \ s;\n    public MyConstructorExample2(String s) {\n        this.s = s;\n    }\n\
    }\n```\n\nAt least one constructor must be defined by each class. The compiler\
    \ would implicitly add a constructor if no explicit constructor is defined in\
    \ the Java source file. The constructor of the super class would always be called\
    \ implicitly in every case that the class is sub-classed.\n\nIn the illustration\
    \ below, the definition of the constructor without parameters (also popularly\
    \ called the empty constructor) is not necessary. The compiler would always create\
    \ one, if it is not specified.\n\n```java\npackage com.vogella.javaintro.base;\n\
    \npublic class MyConstructorExample {\n    // unnecessary: would be created by\
    \ the compiler if left out\n    public MyConstructorExample() {\n    }\n}\n```\n\
    \nTo create a constructor, the naming convention goes like this: `classname (Parameter\
    \ p1, …) { }. All objects are created based on a constructor. Before anything\
    \ can be done with an object, the constructor method is the first statement that\
    \ would be called.\n\n## CHAPTER 7: MODIFIERS\n\n### Access modifiers\n\nIn Java,\
    \ you would find three access modifiers available: the `private`, the `protected`,\
    \ and the `public`. You would also find four access levels available. They are:\
    \ the `private`, the `default`, the `public`, and the `protected`. All these levels\
    \ define how the corresponding element is visible to other components. An example\
    \ of when something is declared `public` is when classes or methods are freely\
    \ created or called by other Java objects. While, an example of when something\
    \ is declared `private` is when maybe a method can only be accessed within the\
    \ class in which it is declared.\n\nThe access levels `default` and `protected`\
    \ are very similar. A `default` class can be accessed only through the same package,\
    \ while a `protected` class can be accessed from the package and sub-classes from\
    \ outside the package.\n\nFor illustration on their visibility, look at the table\
    \ below:\n\n### Access Level Table\n\n| Modifier | Class | Package | Subclass\
    \ | World |\n| :--- | :--- | :--- | :--- | :--- |\n| `private` | Y | N | N | N\
    \ |\n| No modifier | Y | Y | N | N |\n| `protected` | Y | Y | Y | N |\n| `public`\
    \ | Y | Y | Y | Y |\n\n### Other modifiers\n\n- **Final methods**: These ones\
    \ cannot be overwritten in a subclass.\n- **Abstract method**: These ones have\
    \ no method body.\n- **Synchronized method**: Thread safe, can have any access\
    \ control, and be final.\n- **Native methods**: These ones are codes that depend\
    \ solely on platforms. They apply only to methods.\n- **Strictfp**: These ones\
    \ are methods or classes.\n\n## CHAPTER 8: IMPORT STATEMENTS AND MORE JAVA LANGUAGE\
    \ CONSTRUCTS\n\n### Usage of import statements\n\nTo access a Java class, you\
    \ always have to use its full qualified name. Meaning, the package name plus a,\
    \ followed by the class name. Import statements can also be added to your class\
    \ file. These statements would allow you to use the related classes in your code\
    \ without the package qualifier.\n\n### Static imports\n\n`public static` members\
    \ (whether methods or fields) of another class can only be used in Java code without\
    \ a class reference when allowed by `static imports`. A typesafe mechanism is\
    \ provided by this feature to include constants into code. Code readability is\
    \ also improved, while Java API designers are allowed to write a concise API.\n\
    \n## MORE JAVA LANGUAGE CONSTRUCTS\n\n### Class variables and class methods\n\n\
    Class variables and class methods are associated with the class, and not with\
    \ an instance of the class like the objects. You can use the dot (`.`) and the\
    \ `classname` followed by the class variable name or class method, to refer to\
    \ these elements.\n\nThe `static` keyword is used to declare class variables and\
    \ class methods. Class variables are also referred to as `static fields` or `static\
    \ variables`, while class methods are also referred to as `static methods`. A\
    \ classic example on how to use a static field is `println` of the following statement:\
    \ `System.out.println(\"Hello World\")`. Where `out` is a static field, an object\
    \ of type `PrintStream` and you call the `println()` method on this object.\n\n\
    If you define a static variable, the Java runtime environment associates one class\
    \ variable for a class no matter how many instances (objects) exist. The static\
    \ variable can therefore be seen as a global variable.\n\nThe following code demonstrates\
    \ the usage of static fields:\n\n```java\npackage com.vogella.javaintro.base;\n\
    \npublic class MyStaticExample {\n    static String PLACEHOLDER = \"TEST\";\n\
    \    static void test() {\n        System.out.println(\"Hello\");\n    }\n}\n\
    ```\n\n```java\npackage com.vogella.javaintro.base;\n\npublic class Tester {\n\
    \    public static void main(String[] args) {\n        System.out.println(MyStaticExample.PLACEHOLDER);\n\
    \        MyStaticExample.test();\n    }\n}\n```\n\nIf a variable should be defined\
    \ as constant, you declare it with `static` and `final`. The `static` method runs\
    \ without any instance of the class, it cannot directly access non-static variables.\n\
    \n### Abstract class and methods\n\nA class and method can be declared as `abstract`.\
    \ An `abstract` class cannot be directly instantiated. If a class has at least\
    \ one method which only contains the declaration of the method but not the implementation,\
    \ then this class is `abstract` and cannot be instantiated. Sub-classes need then\
    \ define the methods except if they are also declared as `abstract`.\n\nIf a class\
    \ contains an abstract method, it also needs to get defined with the `abstract`\
    \ keyword. The following example shows an abstract class:\n\n```java\npackage\
    \ com.vogella.javaintro.base;\n\npublic abstract class MyAbstractClass {\n   \
    \ abstract double returnDouble();\n}\n```\n\n## CHAPTER 9: CHEAT SHEETS\n\nDuring\
    \ your Java development time, you will be asked to do certain things, like creating\
    \ a local variable. The following can be used as a reference for such tasks, so\
    \ that you how you have to do.\n\n### Working with classes\n\nWhile programming\
    \ Java you have to create several classes, methods, instance variables. The following\
    \ uses the package test.\n\n| What to do | How to do it |\n| :--- | :--- |\n|\
    \ Create a new class called `MyNewClass`. | `package test;public class MyNewClass\
    \ {}` |\n| Create a new attribute (instance variable) called `var1` of type `String`\
    \ in the `MyNewClass` class. | `package test;public class MyNewClass { private\
    \ String var1; }` |\n| Create a Constructor for your `MyNewClass` class which\
    \ has a `String` parameter and assigns the value of it to the `var1` instance\
    \ variable. | `package test;public class MyNewClass { private String var1; public\
    \ MyNewClass(String para1) {var1 = para1; // or this.var1= para1; } }` |\n"
