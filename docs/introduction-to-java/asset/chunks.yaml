    \ ->person.hasPet(PetType.CAT)).count();\n\n System.out.println(catCount);\n\n\
    \ // who has a cat?\n\n       List<Person> peopleWithCats = persons.stream().filter(person\
    \ -> person.hasPet(PetType.CAT))\n\n .collect(Collectors.toList());\n\n // who\
    \ does not have a cat\n\n       List<Person> peopleWithoutCats = persons.stream().filter(person\
    \ ->  !person.hasPet(PetType.CAT))\n\n .collect(Collectors.toList());\n\n // partition\
    \ people with/without cats\n\n      Map<Boolean, List<Person>> catsAndNoCats =\
    \ persons.stream()\n\n .collect(Collectors.partitioningBy(person ->person.hasPet(PetType.CAT)));\n\
    \n // get the name of Tims cats\n\nPerson person = persons.stream().filter(each\
    \ ->each.isNamed(\"Tim Taller\")).findFirst().get();\n\n boolean test =  (\"Dolly\
    \ & Spot\")  .equals(person.getPets().stream().map(Pet::getName).collect(Collectors.joining(\"\
    \ & \")));\n\n      System.out.println(\"Tim has Dolly & Spot as cats \"  + test);\n\
    \n // get the set of all pet types\n\n      Set<PetType> allPetTypes = persons.stream().flatMap(p\
    \ -> p.getPetTypes().stream()).collect(Collectors.toSet());\n\n System.out.println(allPetTypes);\n\
    \n // group people by their last name\n\n     Map<String, List<Person>> byLastName\
    \ = persons.stream().collect(Collectors.groupingBy(Person::getLastName));\n\n\
          Map<String, List<Person>> byLastNameTargetBag = persons.stream()  .collect(Collectors.groupingBy(Person::getLastName));\
    \ System.out.println(byLastName);\n\n // get the age statistics of pets\n\n     \
    \ List<Integer> agesList = persons.stream().flatMap(p -> p.getPets().stream()).map(Pet::getAge)\
    \  .collect(Collectors.toList());\n\nIntSummaryStatistics stats = agesList.stream().collect(Collectors.summarizingInt(i\
    \ -> i));\n\n System.out.println(\"Min \"  + stats.getMin()  +  \" Max \"  + stats.getMax()\
    \  +  \" Average \"  + stats.getAverage());\n\n // counts by pet age\n\n     \
    \ Map<Integer, Long> counts = Collections.unmodifiableMap(persons.stream().flatMap(p\
    \ -> p.getPets().stream())\n\n .collect(Collectors.groupingBy(Pet::getAge, Collectors.counting())));\n\
    \n }\n\n private  static List<Person>  createData()  {\n\n return Arrays.asList(\n\
    \n new  Person(\"Mary\",  \"Smith\").addPet(PetType.CAT,  \"Tabby\",  2),\n\n\
    \ new  Person(\"Tim\",  \"Taller\").addPet(PetType.CAT,  \"Dolly\",  3).addPet(PetType.DOG,\
    \  \"Spot\",  2),\n\n new  Person(\"Ted\",  \"Smith\").addPet(PetType.DOG,  \"\
    Spike\",  4),\n\n new  Person(\"Jake\",  \"Snake\").addPet(PetType.DOG,  \"Serpy\"\
    ,  1),\n\n new  Person(\"Lars\",  \"Vogel\").addPet(PetType.BIRD,  \"Twirly\"\
    ,  1),\n\n new  Person(\"Harry\",  \"Hamster\").addPet(PetType.HAMSTER,  \"Fuzzy\"\
    ,  1).addPet(PetType.HAMSTER,  \"Wuzzy\",  1)\n\n );\n\n }\n\n}\n\nCHAPTER 17:\
    \ OPTIONAL\n\nYou will inevitably receive a NullPointerException (NPE) the moment\
    \ you access a field, or call a method on an object that is null, or not initialized.\
    \ To avoid these NPEs, there is a class that can be used. It is called the java.util.optional\
    \ class.\n\nThe java.util.optional class is a tool that helps with indicating\
    \ that a return value may not be present. This can be viewed directly in the method\
    \ signature instead of just mentioning that null may be returned in the JavaDoc.\n\
    \nThe filter method can be used if and when you want to call a method on an object,\
    \ or if you want to simply check if there are properties that can be used. A predicate\
    \ is seen as an argument by the filter method at all times. If there is a value\
    \ seen in an optional object that corresponds with the predicate, the filter method\
    \ sends back that value; if not, it simply returns an empty optional object.\n\
    \n    An optional can be created using different methods. See some of them below:\n\
    \n// use this if the object is not null\n\nopt = Optional.of(o);\n\n// creates\
    \ an empty Optional, if o is null\n\nopt = Optional.ofNullable(o);\n\n// create\
    \ an empty Optional\n\nopt = Optional.empty();\n\nA programmer can execute some\
    \ codes on an object by using the ifpresent method, if the code is actually present.\
    \ If for instance, you have a Todo object, and want to call the getId() method\
    \ on it, the following codes below can be used to do this:\n\nTodo todo =  new\
    \ Todo(-1);\n\nOptional<Todo> optTodo = Optional.of(todo);\n\n// get the id of\
    \ the todo or a default value\n\noptTodo.ifPresent(t-> System.out.println(t.getId()));\n\
    \nA programmer can also transform an object if it is present by using the map\
    \ method. While the programmer can filter an object for certain values by using\
    \ the filter method.\n\nTodo todo =  new Todo(-1);\n\nOptional<Todo> optTodo =\
    \ Optional.of(todo);\n\n// get the summary (trimmed) of todo if the id is higher\
    \ than 0\n\nOptional<String> map = optTodo.filter(o -> o.getId()  >  0).map(o\
    \ -> o.getSummary().trim());\n\n// same as above but print it out\n\noptTodo.filter(o\
    \ -> o.getId()  >  0).map(o -> o.getSummary().trim()).ifPresent(System.out::println);\n\
    \nAnd finally, the get () method has to be used if a programmer wants to get the\
    \ actual value of an Optional. However, in scenarios where the Optional is empty,\
    \ a NoSuchElementException will be thrown. For this NoSuchElementException to\
    \ be avoided, the orElse or the orElseGet can be used to provide a default in\
    \ case there is an absence.\n\n// using a String\n\nString s =  \"Hello\";\n\n\
    Optional<String> maybeS = Optional.of(s);\n\n// get length of the String or -1\
    \ as default\n\nint len = maybeS.map(String::length).orElse(-1);\n\n// orElseGet\
    \ allows to construct an object / value with a Supplier\n\nint calStringlen =\
    \ maybeS.map(String::length).orElseGet(()->  \"Hello\".length());\n\nCHAPTER 18:\
    \ SYSTEM PROPERTIES\n\nAccess to the configuration of the current working environment\
    \ can be provided by the System class. And, they can all be accessed through system.getProperty\
    \ (‘property_name’), for instance System.getPropery (‘path.separator’).\n\n    \
    \ The most important properties are described by the list below:\n\n- ‘user.home’\
    \ – User home directory = schedule tasks.\n\n- ‘user.dir’ – User working directory.\n\
    \n- ‘line separator’ – Sequence used to separate lines in text files by operating\
    \ system.\n\nProgrammers are allowed to schedule tasks by Java. Tasks that have\
    \ been scheduled can perform once or several times."
