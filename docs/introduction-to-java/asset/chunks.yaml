    \ the command line.\n\n![C:\\Users\\USER\\Downloads\\xfirstjava20.png.pagespeed.ic.WJun3cLajc.png](Images/image00208.jpeg)\n\
    \nStep 3: Making use of the classpath\n\n- To run the program from another place\
    \ in your directory, you can always use the classpath.\n\n- All you need to do,\
    \ is switch to the command line. For example, under Windows Start Run cmd. Switch\
    \ to a directory of your choice, then type:\n\n[java HelloWorld]\n\n- The system\
    \ will show an error message if you are not in the directory where the compiled\
    \ class is stored. The error message could look like this:\n\nException in thread\
    \ \"main\" java.lang.NoClassDefFoundError: test/TestClass\n\n- Type in the command\
    \ below to use the class. Substitute ‘mydirectory’ with the directory that contains\
    \ the test directory. The ‘HelloWorld’ output should be seen again afterwards.\n\
    \n[java -classpath \"mydirectory\" HelloWorld]\n\nExercise 2: Creating Java objects\
    \ and methods\n\nStep 1:  Create a Person class and instantiate it\n\nCreate a\
    \ new Java project called com.vogella.javastarter.exercises1 and a package with\
    \ the same name.\n\nCreate a class called Person.\n\nAdd three instance variables\
    \ to it, one for storing the first name of the person, one for storing the last\
    \ name and one for storing the age of the Person.\n\nUse the constructor of the\
    \ Person object to set the values to some default value.\n\nAdd a toString method\
    \ as described by the following coding and solve the TODO. This method is used\
    \ to convert the object to a String representation.\n\nSee illustration below:\n\
    \n@Override\n\npublic String toString()  {\n\n // TODO replace \"\" with the following:\n\
    \n // firstName + \" \" + lastName\n\n return  \"\";\n\n}\n\nCreate a new class\
    \ called Main with a public static void main (String [] args). In this method\
    \ create an instance of the Person class.\n\nStep 2: Use constructor\n\nAdd a\
    \ constructor to your Person class which takes first name, last name and age as\
    \ parameter. Assign the values to your instance variables.\n\nIn your main method\
    \ create at least one object of type Person and use System.out.println() with\
    \ the object as parameter.\n\nStep 3: Define getter and setter methods\n\nDefine\
    \ methods which allow you to read the values of the instance variables and to\
    \ set them. These methods are called setter and getter.\n\nGetters should start\
    \ with get followed by the variable name whereby the first letter of the variable\
    \ is capitalized.\n\nSetter should start with set followed by the variable name\
    \ whereby the first letter of the variable is capitalized.\n\nFor example, the\
    \ variable called firstName would have the getFirstName() getter method and the\
    \ setFirstName(String s) setter method.\n\nChange your main method so that you\
    \ create one Person object and use the setter method to change the last name.\n\
    \nStep 4: Create an Address object\n\nCreate a new object called Address. The\
    \ Address should allow you to store the address of a person.\n\nAdd a new instance\
    \ variable of this type in the Person object. Also, create a getter and setter\
    \ for the Address object in the Person object."
