  trans: "\n\n![](img/cover00209.jpeg)\n\n# Java 入门\n## 初学者 Java 编程\n\n## 目录\n- 第一章：Java\
    \ 简史\n- 第二章：安装 Java\n- 第三章：Java 基础语言结构\n- 第四章：Java 接口\n- 第五章：Java 中的注解\n- 第六章：变量与方法\n\
    - 第七章：修饰符\n- 第八章：导入语句及更多 Java 语言结构\n- 第九章：备查清单\n- 第十章章：集成开发环境\n- 第十一章章：Java 语句\n\
    - 第十二章：Java 中的循环\n- 第十三章章：数组\n- 第十四章章：字符串\n- 第十五章章：Lambda 表达式\n- 第十六章章：流 (Streams)\n\
    - 第十七章：可选类型 (Optional)\n- 第十八章：系统属性\n- 第第十九一章：Java 练习题\n\n# 第一章：Java 简史\n\n1991\
    \ 年，Sun 微公司（SUN）的 James Gosling 创造了一种在今天被称为“Java”的编程语言。直到 1995 年，第一个公开的 Java 版本（Java\
    \ 1.0）才被发布。2006 年，Sun 公司在 GNU 通用公共许可证（GPL）下发布了 Java。这个也被称为 OpenJDK 的项目至今仍由 Oracle\
    \ 公司继续维护。\n\n现在由 Oracle 管理 Java 的 Oracle 公司于 2010 年收购了 Sun 微公司。随着时间的推移，经过改进和增强的\
    \ Java 版本不断发布。目前的最新版本是 Java 1.8，或 Java 8。\n\n### 什么是 Java？\n\nJava 是一种编程语言，可用于设计或开发移动应用、桌面应用或\
    \ Web 应用、游戏等。它由一组规范定义，由编程语言、运行时（Java 虚拟机）、核心库和编译器组成。通过 Java 运行时，软件开发者可以使用不同于熟悉的\
    \ Java 编程语言编写程序代码，而这些代码仍然运行在 Java 虚拟机上。\n\nJava 核心类库和 Java 虚拟机是 Java 平台的重要组成部分。通过\
    \ Java，目标是实现“编写一次，即可在多个操作系统上运行”。\n\n以下属性构成了 Java 语言：\n\n- **面向对象的编程语言**：除了基本数据类型外，构成\
    \ Java 的所有元素都是对象。\n- **平台无关**：Java 虚拟机被 Java 程序用作抽象，Java 程序也不直接访问操作系统。这种访问性使得\
    \ Java 程序具有高度的可移植性。任何遵循特定规则并符合标准的 Java 程序都可以在 Linux 或 Windows 等支持的平台上无需修改即可运行。\n\
    - **自动内存管理**：创建新对象的内存分配和释放由 Java 管理。该程序无法直接访问内存。没有活动指针的对象将由所谓的“垃圾回收器”自动删除。\n-\
    \ **编译型和解释型语言**：所有 Java 源代码都被转换为不依赖于目标平台的字节码格式。然后，Java 虚拟机（JVM）会解释这些字节码指令。JVM\
    \ 包含一个名为“热点编译器”（Hotspot-Compiler）的组件，它可以性能关键的字节码指令翻译成原生代码指令。\n- **强类型编程语言**：Java\
    \ 编程语言是一种强类型语言。例如，与其他对象之间的转换相对严格，例如大多数时候必须由程序员完成，而所用变量的类型必须预定义。\n\n注意：- Java 的语法看起来像\
    \ C++。\n- Java 同样对大小写敏感。例如，名为 `myvalue` 和 `myValue` 的变量始终被视为不同的变量。\n\n### 编写第一个\
    \ Hello World 程序\n\n要开始，下面的图示代码可以有所帮助：\n\n```java\n// 一个小型 Java 程序\npublic class\
    \ HelloWorld {\n    public static void main(String[] args) {\n        System.out.println(\"\
    Hello World\");\n    }\n}\n```\n\n### Java 虚拟机\n\n有一种计算机的软件实现，可以像真实机器一样实现并执行问题。该软件被称为\
    \ Java 虚拟机（JVM）。\n\nJava 虚拟机（JVM）是为特定的操作系统编写的。例如，Linux 需要一个特殊的实现，Windows 同样需要一个实现。此外，Java\
    \ 编译器将 Java 程序转换为字节码，而 Java 虚拟机则帮助解释转换后的字节码，或者直接执行 Java 程序。\n\n### Java 开发工具包\
    \ vs Java 运行时环境\n\nJava 有两种发行类型。分别是 Java 开发工具包（JDK）和 Java 运行时环境（JRE）。在 Java 运行时环境（JRE）中，你可以找到\
    \ Java 类库和 Java 虚拟机（JVM）。它们都包含了启动 Java 程序所需的功能。\n\nJDK 额外包含了创建 Java 程序所需的开发工具。因此，JDK\
    \ 由 Java 编译器、Java 虚拟机和 Java 类库组成。\n\n### 使用 Java 进行开发流程\n\nJava 源文件以纯文本文档的形式编写。程序员通常在集成开发环境（IDE）中编写\
    \ Java 源代码。IDE 支持程序员编写代码的任务，例如，它可以提供源代码的自动格式化、重要关键词的高亮等功能。\n\n在某个时刻，程序员（或 IDE）调用\
    \ Java 编译器 `javac`。Java 编译器创建字节码。这些指令存储在 `.class` 文件中，并由 Java 虚拟机执行。\n\n### 垃圾回收器\n\
    \nJVM 会自动收集未被对象引用的内存。Java 垃圾回收器检查所有对象引用并寻找可以自动释放的对象。虽然垃圾回收器让程序员无需显式管理内存，但程序员仍然需要确保自己不保留不必要的引用，否则垃圾回收器无法释放关联内存。保留不必要的对象引用被称为内存泄漏。\n\
    \n### 类路径 (Classpath)\n\n类路径定义了 Java 编译器和 Java 运行时在哪里查找用于加载的 `.class` 文件。这些指令可以在\
    \ Java 程序中使用。例如，如果你想使用外部库，就必须将该库添加到类路径中。\n\n# 第二章：安装 Java\n\n### 第一 步：推荐的 Java\
    \ 版本\n\n为了安装 Java，强烈建议使用 Java 的最新长期支持版本。在编写本文时，这是 JAVA 12。\n\n### 第二 步：检查安装\n\n\
    在运行 Java 程序之前：\n- 必须安装 Java 运行时环境\n- 环境变量中必须包含 Java 可执行文件\n\n通过控制台，也可以测试 JRE 是否安装正确。在\
    \ Windows 上打开控制台：按 Win+R，输入 `cmd`，然后按回车。现在，输入以下命令：\n\n```bash\njava -version\n\
    ```\n\n如果 JRE 安装正确，此命令将打印出关于 Java 安装的信息。如果发生这种情况，你可以跳过 Java 安装说明。如果命令行返回找不到程序的信息，你也必须安装\
    \ Java。\n\n### 第 3 步：安装 Java\n\n在 [Java 网站](http://java.com/)上可以找到 Oracle 提供的适用于\
    \ Microsoft Windows 的原生安装程序。该原生安装程序包含了在如何在所有支持的平台上安装 Java 的说明。\n\n例如：\n\n####\
    \ 在 Ubuntu 上安装 Java\n\n在 Ubuntu 上，你可以通过命令行中的以下命令安装 Java 11。这些命令可能会随时间变化，如果它们不再有效，请搜索新的安装方法。\n\
    \n```bash\n# 如果你倾向于使用 Oracle Java 发行版\n# 你也可以备选使用以下命令\n```\n\n"
- fmt: "\n```bash\nsudo add-apt-repository ppa:linuxuprising/java\nsudo apt-get update\n\
    sudo apt-get install oracle-java11-installer\n```\n\n# Final step: Check for installation\
    \ problems and other operating systems\n\nIf you discover problems while trying\
    \ to install Java on your system, go on Google and search for ‘How to install\
    \ JDK on my OS’. Remember to replace the word ‘OS’ with your current operating\
    \ system like Ubuntu, Mac OS X or Windows. You are bound to find really helpful\
    \ links.\n\n# CHAPTER 3: BASE JAVA LANGUAGE STRUCTURE\n\n## Class\n\nAny template\
    \ that describes the behavior and date associated with an instance of a class\
    \ is called a ‘Class’.\n\nThe `class` keyword is used to define a class, and it\
    \ must always begin with a capital letter. The body of every class is enclosed\
    \ in the symbols `{}`.\n\nFor example:\n\n```java\npackage test; class MyClass\
    \ { }\n```\n\nAny data associated with a class is stored in variable, while any\
    \ behavior associated to an object or a class is implemented using methods.\n\n\
    Also, you would find every class in a text file that has the same name as the\
    \ class plus the `.java` extension. You can also always define inner classes (classes\
    \ that are defined inside another class). To do this successfully, you do not\
    \ need a separate file for this class.\n\n## Object\n\nAny instance of a class\
    \ is called an object. It is the real element that can perform actions and has\
    \ data. Every object is created based on the definition of a class. The blueprint\
    \ of every object is the class, meaning that the class describes how every object\
    \ is created.\n\n## Package\n\nClasses are grouped into functional ‘packages’\
    \ by Java.\n\nClasses are also typically grouped into logical units by packages.\
    \ For instance, every graphical view of an application may be placed in the same\
    \ package known as `com.vogella.webapplication.views`.\n\nA lot of people commonly\
    \ use the reverse domain name of a company as the top level package. For instance,\
    \ a company which owns the domain, `backdrops.com` would have their Java package\
    \ started with `com.backdrops`.\n\nAnother reason why packages are used is for\
    \ the sake of avoiding name collisions of classes. For a name collision to occur,\
    \ two programmers would have to give the same fully qualified name to a class.\
    \ A fully qualified name of a class in Java is made up of the package name, then\
    \ a dot (`.`), and finally the class name.\n\nIf there are no packages, a Java\
    \ class called `Test` may be created by the programmer. The same name may be used\
    \ to create a class by another programmer. Through the use of packages, one can\
    \ instruct a system on which class to call. For instance, if the `Test` class\
    \ is put into the package `report` by the first programmer, while the second programmer\
    \ puts his class into package `xmlreader`, one can differentiate between these\
    \ classes by making use of the fully qualified name like `report.Test` or `xmlreader.Test`.\n\
    \n## Inheritance\n\nYou can always derive a class from another class. When this\
    \ happens, the derived class is called a ‘subclass’. Another common occurrence,\
    \ is that a class is extended by another class.\n\nThe class from which a subclass\
    \ is gotten from is called a ‘superclass’.\n\nWhen inheritance occurs, it allows\
    \ a class to inherit the data definitions and the behavior of another class.\n\
    \nBelow, you would find codes that demonstrate how a class can extend another\
    \ class. Bear in mind, that in Java, a class can only extend a maximum of one\
    \ class.\n\n```java\npackage com.vogella.javaintro.base;\n\nclass MyBaseClass\
    \ {\n public void hello() {\n    System.out.println(\"Hello from MyBaseClass\"\
    );\n }\n}\n\npackage com.vogella.javaintro.base;\n\nclass MyExtensionClass extends\
    \ MyBaseClass {\n}\n```\n\n### Object as superclass\n\nIn Java, each object implicitly\
    \ extends the `Object` class. For every Java object, the following methods are\
    \ defined by the class:\n\n- `equals(o1)` allows checking if the current object\
    \ is equal to `o1`\n- `getClass()` returns the class of the object\n- `hashCode()`\
    \ returns an identifier of the current object\n- `toString()` gives a string representation\
    \ of the current object\n\n## Exception handling in Java\n\nThere is an event\
    \ which indicates an error during the runtime of an application in Java. This\
    \ event is known as the exception. When this occurs, the usual flow of the application’s\
    \ instructions is disrupted. Generally, exceptions are thrown up in the call hierarchy\
    \ until they get catched.\n\n![C:\\Users\\USER\\Downloads\\exception_throw_callstack.png](Images/image00206.jpeg)\n\
    \n### Checked Exceptions\n\nChecked Exceptions are explicitly thrown by methods,\
    \ which might cause the exception or re-thrown by methods in case a thrown `Exception`\
    \ is not caught.\n\nSo when calling methods, which throw checked Exceptions the\
    \ `Exceptions` have either to be caught or to be re-thrown.\n\n```java\npublic\
    \ void fileNotFoundExceptionIsCaughtInside() {\n try {\n    createFileReader();\n\
    \  } catch (FileNotFoundException e) {\n    logger.error(e.getMessage(), e);\n\
    \ }\n}\n\npublic void fileNotFoundExceptionIsReThrown() throws FileNotFoundException\
    \ {\n    createFileReader();\n}\n\npublic void createFileReader() throws FileNotFoundException\
    \ {\nFile file = new File(\"/home/Documents/JavaTraining.txt\");\n // creating\
    \ a new FileReader can cause a FileNotFoundException\n new FileReader(file);\n\
    }\n```\n\nN.B: Checked Exceptions are used when an error can be predicted under\
    \ certain circumstances, e.g., a file which cannot be found.\n\n### Runtime Exceptions\n\
    \nRuntime Exceptions are Exceptions, which are not explicitly mentioned in the\
    \ method signature and therefore do not have to be catched.\n\nThe most famous\
    \ runtime exception is the `NullPointerException`, which occurs during runtime,\
    \ when a method is invoked on an object, which actually is null.\n\n```java\n\
    public void causeANullPointerException() {\nString thisStringIsNull = getMessage(false);\n\
    \ // because the thisStringIsNull object is null\n // this will cause a NullPointerException\n\
    \ thisStringIsNull.toLowerCase();\n}\n\npublic String getMessage(boolean messageIsAvailable)\
    \ {\n if(messageIsAvailable) {\n return message;\n }\n return null;\n}\n```\n\n\
    # CHAPTER 4: INTERFACES\n\n## What is an interface in Java?\n\nAn interfaces is\
    \ a type similar to a class and is defined via the `interface` keyword. Interfaces\
    \ are used to define common behavior of implementing classes. If two classes implement\
    \ the same interface, other code which work on the interface level, can use objects\
    \ of both classes.\n\nLike a class an interface defines methods. Classes can implement\
    \ one or several interfaces. A class which implements an interface must provide\
    \ an implementation for all abstract methods defined in the interface.\n\n## Abstract,\
    \ default and static methods in Interfaces\n\nAn interface can have abstract methods\
    \ and `default` methods. A default method is defined via the `default` keyword\
    \ at the beginning of the method signature. All other methods defined in an interfaces\
    \ are public and abstract; explicit declaration of these modifiers is optional.\n\
    \nInterfaces can have constants which are always implicitly public, static and\
    \ final.\n\nThe following code shows an example implementation of an interface.\n\
    \n```java\npackage testing;\n\npublic interface MyInterface {\n // constant definition\n\
    String URL = \"https://www.vogella.com/\";\n // public abstract methods\n void\
    \ test();\n void write(String s);\n // default method\n default String reserveString(String\
    \ s){\n return new StringBuilder(s).reverse().toString();\n }\n}\n```\n\n## Implementing\
    \ Interfaces\n\nA class can implement an interface. In this case it must provide\
    \ concrete implementations of the abstract interface methods. If you implement\
    \ a method defined by an interface, you can use `@Override` annotation. This indicates\
    \ to the Java compiler that you actually want to implement a method defined by\
    \ this interface. This way the compiler can give you an error in you mis-typed\
    \ the name of the method or in the number of arguments. The following class implements\
    \ the `MyInterface` interface, it must therefore implement the abstract method\
    \ and can use the default methods.\n"
