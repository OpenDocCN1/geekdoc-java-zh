    ### 第十章：集成环境\n\n在最后一章中，我们讨论了在命令行上创建和编译 Java 程序所需的步骤。然而，我们有了更好的选择：如果你使用 Java 开发环境\
    \ (`IDE`），你会发现创建 Java 程序非常方便。而且，还有。有许多其他强大的 `IDEs` 可以，例如 `Eclipse` IDE。如果你想学习使用\
    \ `IDE` 所需的步骤，可以去搜索 `Eclipse` 教程。你还会发现最后的描述使用了短语：‘创建一个名为 …… 的 Java 项目’。此描述指的是在\
    \ Eclipse 中创建 Java 项目。如果你一直在使用不同的 `IDE`，请确保你了该 `IDE` 中必要的步骤。\n\n### 类型转换\n\n如果使用了不同类型的变量，Java\
    \ 将对某些类型要求显式转换。在下面的插图中，你会找到此类转换的示例。要从其他类型转换为 `Strings`，可以使用以下方法：\n\n```java\n\
    // 将 int 转换为 String\nString s1 = String.valueOf(10); // \"10\"\n// 将 double 转换为\
    \ String\nString s2 = String.valueOf(Math.PI); // \"3.141592653589793\"\n// 将\
    \ boolean 转换为 String\nString s3 = String.valueOf(1 < 2); // \"true\"\n// 将 date\
    \ 转换为 String\nString s4 = String.valueOf(1 < 2); // \"true\"\n```\n\n#### [字符串转换为数字](https://www.vogella.com/tutorials/JavaIntroduction/article.html#stringtonumber)\n\
    \n如果使用了不同类型的变量，Java 将对某些类型要求显式转换。在下面的插图中，你会找到此类转换的示例。要从其他类型转换为 `Strings`，可以使用以下方法：\n\
    \n```java\n// 将 int 转换为 String\nString s1 = String.valueOf(10); // \"10\"\n//\
    \ 将 double 转换为 String\nString s2 = String.valueOf(Math.PI); // \"3.141592653589793\"\
    \n// 将 boolean 转换为 String\nString s3 = String.valueOf(1 < 2); // \"true\"\n```\n\
    \n#### [Double 转 int](https://www.vogella.com/tutorials/JavaIntroduction/article.html#conversion_toint)\n\
    \n要将 `double` 转换为 `int`，你可以：\n\n```java\nint = double;\n```\n\n#### [SQL 日期转换](https://www.vogella.com/tutorials/JavaIntroduction/article.html#conversion_sqldate)\n\
    \n### 以下应该用于将 `Date` 转换为 SQL Date：\n\n```java\npackage test;\nimport java.text.DateFormat;\n\
    import java.text.ParseException;\nimport java.text.SimpleDateFormat;\npublic class\
    \ ConvertDateToSQL {\n  private void convertToSQL() {\n    SimpleDateFormat template\
    \ = new SimpleDateFormat(\"yyyy-MM-dd\");\n    java.util.Date enddate = new java.util.Date(\"\
    10/31/99\");\n    java.sql.Date sqlDate = java.sql.Date.valueOf(template.format(enddate));\n\
    \  }\n\n  public static void main(String[] args) {\n    ConvertDateToSQL date\
    \ = new ConvertDateToSQL();\n    date.convertToSQL();\n  }\n}\n```\n\n### 第十一章：Java\
    \ 语句\n\n某些语句在 Java 语言中具有预定义的含义。在本章中，你会发现列出了一些描述。\n\n#### if-then 和 if-then-else\n\
    \n`if-then` 语句是一种控制流语句。只有当 `if` 部分指定的测试为‘真’时，才会执行代码块。然而，如果 `if` 部分求值为假，则可选的 `else`\
    \ 块将被执行。\n\n#### switch\n\n多个替代方案可以由 `switch` 语句处理，如果它们都作用于同一个常量值。\n\n```java\n\
    switch (expression) {\n  case constant1:\n    command;\n}\n```\n"
- fmt: "\n```java\nbreak;  // will prevent that the other cases or also executed\n\
    \ncase constant2:\n    command;\n    break;\n\n...\n\ndefault:\n}\n\n// Example:\n\
    \nswitch (cat.getLevel()) {\n    case 0:\n        return true;\n    case 1:\n\
    \        if (cat.getLevel() == 1) {\n            if (cat.getName().equalsIgnoreCase(req.getCategory()))\
    \ {\n                return true;\n            }\n        }\n    case 2:\n   \
    \     if (cat.getName().equalsIgnoreCase(req.getSubCategory())) {\n          \
    \  return true;\n        }\n}\n\n// you can also use the same logic for different\
    \ constants\n\npublic static void main(String[] args) {\n    for (int i = 0; i\
    \ < 6; i++) {\n        switch (i) {\n            case 1:\n            case 5:\n\
    \                System.out.println(\"Hello\");\n                break;\n    \
    \        default:\n                System.out.println(\"Default\");\n        \
    \        break;\n        }\n    }\n}\n```\n\n## Boolean Operations\n\nTo see if\
    \ two references refer to the same object or to compare two primitives, you can\
    \ use `==`. You can also use the `equals()` method to see if two different objects\
    \ are equal.\n\nThere are short circuit methods that terminate the moment the\
    \ result of an evaluation is made clear. Examples are `&&` and `||`.\n\nIn illustrations,\
    \ `(true || …)` is always true, while `(false && …)` is always depicted as false.\n\
    \nE.g.: `(var != null && var.method1 …)` makes sure that `var` is not null before\
    \ the original check is done.\n\n### BOOLEAN OPERATIONS TABLE\n\n| Operations\
    \ | Description |\n| --- | --- |\n| `==` | This stands for ‘is equal’.When objects\
    \ are involved, the system will check whether the reference variable points to\
    \ the same object. The content of the objects will not be compared! |\n| `&&`\
    \ | This stands for ‘And’ |\n| `!=` | This stands for ‘is not equal, similar to\
    \ `==`.’ |\n| `a.equals(b)` | This is used for checking whether ‘string a equals\
    \ b’ |\n| `a.equalsIgnoreCase(b)` | This is used for checking whether ‘string\
