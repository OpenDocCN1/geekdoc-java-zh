  trans: "\n要调度任务，你可以利用 `java.util.Timer` 或 `java.util.TimerTask`。`Timer` 将根据给定的间隔执行由对象实现的\
    \ `TimeTask`。\n\n查看下方的示例：\n\n```java\npackage schedule;\n\nimport java.util.TimerTask;\n\
    \npublic class MyTask extends TimerTask {\n    private final String string;\n\
    \    private int count = 0;\n\n    public MyTask(String string) {\n        this.string\
    \ = string;\n    }\n\n    @Override\n    public void run() {\n        count++;\n\
    \        System.out.println(string + \" called \" + count);\n    }\n}\n```\n\n\
    ```java\npackage schedule;\n\nimport java.util.Timer;\n\npublic class ScheduleTest\
    \ {\n    public static void main(String[] args) {\n        Timer timer = new Timer();\n\
    \        // 等待 2 秒 (2000 毫秒) 然后开始\n        timer.schedule(new MyTask(\"Task1\"\
    ), 2000);\n        for (int i = 0; i < 100; i++) {\n            // 等待 1 秒，然后每\
    \ 5 秒执行一次\n            timer.schedule(new MyTask(\"Task \" + i), 1000, 5000);\n\
    \        }\n    }\n}\n```\n\n# 第 19 章：JAVA 练习\n\n## 练习 1：编写、编译和运行 Java 程序\n\n\
    通过练习来测试自己\n\n### 第 1 步：编写源代码\n\n下面的 Java 程序是在 Linux 环境下通过命令行和文本编辑器开发的。在其他操作系统上的操作方法大体相同，但本示例未涵盖这部分。\n\
    \n- 对于你的 Java 开发，选择或创建一个将要使用的新目录。在本示例中，我们使用路径 `\\home\\vogella\\javastarter`。对于\
    \ Microsoft Windows 操作系统，可以使用路径 `c:\\temp\\javastarter`。在接后的示例中，我们将此路径称为 `javadir`。\n\
    - 打开一个支持纯文本的文本编辑器。例如：如果你使用 windows，可以使用 `记事本`；如果你使用 Linux，则使用 `Gedit`。然后，编写以下源代码：\n\
    \n```java\n// 一个小型 Java 程序\npublic class HelloWorld {\n    public static void\
    \ main(String[] args) {\n        System.out.println(\"Hello World\");\n    }\n\
    }\n```\n\n**警告**：在编写 Java 代码时，永远不要使用如 LibreOffice 或 Microsoft Word 之类的富编辑器。如果你不确定，请在\
    \ Google 上搜索“<插入你的操作系统> 的纯文本编辑器”。\n\n![C:\\Users\\USER\\Downloads\\xfirstjava10.png.pagespeed.ic.-9onYaF0Km.png](img/image00207.jpeg)\n\
    \n- 现在，进入你的 `javadir` 目录，并将源代码保存为 `HelloWorld.java` 文件。始终记住，Java 源文件的文件名必须与类名（源代码中）一致，并以\
    \ `.java` 扩展结尾。在本次练习中，由于类名为 `HelloWorld`，因此文件名应该是 `HelloWorld.java`。\n\n### 第\
    \ 2 步：编译并运行你的 Java 程序\n\n- 为了这一这一步，首先打开一个用于命令行访问的 shell。\n提示：如果你不知道如何操作，请在 Google\
    \ 上搜索“如何打开 <插入你的操作系统> 的 shell”。\n- 现在使用命令 `cd javadir` 切换到 `javadir` 目录，例如在上面的示例中通过\
    \ `cd \\home\\vogella\\javastarter` 命令。使用 `ls` 命令（Microsoft Windows 下使用 `dir`）确认源文件确实在目录中。\n\
    - 现在，使用以下命令将 Java 源文件编译为类文件：\n\n```bash\njavac HelloWorld.java\n```\n\n- 一过会儿，再次使用\
    \ `ls` 或 `dir` 命令列出目录内容。现在目录包含 `HelloWorld.class` 文件。注意，当你看到这个文件时，说明你已成功将第一个 Java\
    \ 源编译为字节码。\n提示：编译器默认会将每个类文件放在与其源文件相同的目录下。使用编译器标志 `-d`，你可以指定一个独立的输出目录。\n- 最后，你现在可以开始编译你的\
    \ Java 程序了。在输入以下命令启动 Java 程序之前，请确保你仍然处于 `javadir` 目录中：\n\n```bash\njava HelloWorld\n\
    ```\n\n- 系统将在命令行输出 \"Hello World\"。\n\n![C:\\Users\\USER\\Downloads\\xfirstjava20.png.pagespeed.ic.WJun3cLajc.png](img/image00208.jpeg)\n\
    \n### 第 3 步：使用 classpath\n\n- 要从目录的另一个位置运行程序，你可以始终使用 classpath。\n- 你需要做的只是切换到命令行。例如，在\
    \ Windows 启动运行输入 `cmd`。切换到你选择的目录，然后输入：\n\n```bash\njava HelloWorld\n```\n\n- 如果你不在存储编译类的目录中，系统将显示错误信息。错误信息可能如下所示：\n\
    `Exception in thread \"main\" java.lang.NoClassDefFoundError: test/TestClass`\n\
    - 输入以下命令来使用该类。将 ‘mydirectory’ 替换为包含 test 目录的目录。之后应该再次看到 `HelloWorld` 的输出。\n\n\
    ```bash\njava -classpath \"mydirectory\" HelloWorld\n```\n\n## 练习 2：创建 Java 对象和方法\n\
    \n### 第 1 步：创建 Person 类并实例化\n\n创建一个名为 `com.vogella.javastarter.exercises1` 的新\
    \ Java 项目，并创建一个同名的包。创建一个名为 `Person` 的类。\n\n为它添加三个实例变量：一个用于存储人的名字，一个用于存储姓氏，一个用于存储人的年龄。\n\
    使用 `Person` 对象的构造函数将值设置为某些默认值。\n按照以下代码描述添加一个 `toString` 方法并解决 TODO。此方法用于将对象转换为字符串表示。\n\
    \n查看下方的示例：\n\n```java\n@Override\npublic String toString() {\n    // TODO 将 \"\
    \" 替换为以下：\n    // firstName + \" \" + lastName\n    return \"\";\n}\n```\n\n创建一个名为\
    \ `Main` 的新类，并包含 `public static void main (String [] args)`。在该方法中创建 `Person` 类的实例。\n\
    \n### 第 2 步：使用构造函数\n\n为你的 `Person` 类添加一个构造函数，接受名字、姓氏和年龄作为参数。将这些值赋值给你的实例变量。\n在主方法中创建至少一个\
    \ `Person` 类型的对象，并使用对象作为参数调用 `System.out.println()`。\n\n### 第 3 步：定义 getter 和\
    \ setter 方法\n\n定义允许你读取和设置实例变量值的方法。这些方法被称为 setter 和 getter。\nGetter 应该以 `get` 开头，后跟变量名，其中变量的首字母大写。\n\
    Setter 应以 `set` 开头，后跟变量名，其中变量的首字母大写。\n\n例如，名为 `firstName` 的变量将拥有 `getFirstName()`\
    \ getter 方法和 `setFirstName(String s)` setter 方法。\n\n修改你的主方法，以便你创建一个 `Person` 对象并使用\
    \ setter 方法更改姓氏。\n\n### 第 4 步：创建 Address 对象\n\n创建一个名为 `Address` 的新对象。`Address`\
    \ 应允许你存储人的地址。在 `Person` 对象中添加一个该类型的新实例变量。此外，在 `Person` 对象中为 `Address` 对象创建 getter\
    \ 和 setter。\n"
