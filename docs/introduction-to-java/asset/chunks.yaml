    public interface A {\n    default void m() {}\n}\n\npublic interface B {\n   \
    \ default void m() {}\n}\n\npublic class C implements A, B {\n    @Override\n\
    \    public void m() {}\n}\n```\n\nWhen doing your own implementation, you can\
    \ always call the super method you prefer. As illustrated below:\n\n```java\n\
