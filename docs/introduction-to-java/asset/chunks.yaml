    \ be inherited by the class. This rule is especially true for abstract and concrete\
    \ superclass methods. The rule also implies that if this method is also declared\
    \ in the superclass chain, the default methods would not be used.\n- **In every\
    \ other case**, the default method would have to be implemented by the class.\n\
