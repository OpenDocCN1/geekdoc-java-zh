    \n### String pool in Java\n\nFor memory efficiency Java uses a `String` pool.\
    \ The string pool allows string literals to be reused. This is possible because\
    \ strings in Java are immutable.\n\nIf the same string literal is used in several\
    \ places in the Java code, only one copy of that string is created.\n\nWhenever\
    \ a `String` object is created and gets a string literal assigned the string pool\
