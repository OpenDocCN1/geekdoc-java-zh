- fmt: "\n![](Images/cover00209.jpeg)\n\n# INTRODUCTION TO JAVA\n## Java Programming\
    \ for Beginners\n\n## Table Of Content\n- CHAPTER 1: A SMALL HISTORY OF JAVA\n\
    - CHAPTER 2: INSTALLING JAVA\n- CHAPTER 3: BASE JAVA LANGUAGE STRUCTURE\n- CHAPTER\
    \ 4: JAVA INTERFACES\n- CHAPTER 5: ANNOTATIONS IN JAVA\n- CHAPTER 6: VARIABLES\
    \ AND METHODS\n- CHAPTER 7: MODIFIERS\n- CHAPTER 8: IMPORT STATEMENTS AND MORE\
    \ JAVA LANGUAGE CONSTRUCTS\n- CHAPTER 9: CHEAT SHEETS\n- CHAPTER 10: INTEGRATED\
    \ DEVELOPMENT ENVIRONMENT\n- CHAPTER 11: JAVA STATEMENTS\n- CHAPTER 12: LOOPS\
    \ IN JAVA\n- CHAPTER 13: ARRAYS\n- CHAPER 14: STRINGS\n- CHAPTER 15: LAMBDAS\n\
    - CHAPTER 16: STREAMS\n- CHAPTER 17: OPTIONAL\n- CHAPTER 18: SYSTEM PROPERTIES\n\
    - CHAPTER 19: JAVA EXERCISES\n\n# CHAPTER 1: A SMALL HISTORY OF JAVA\n\nIn 1991,\
    \ James Gosling of Sun Microsystems (SUN) created a programming language that\
    \ would be today known as ‘Java’. It was not until 1995 that the first publicly\
    \ available version of Java (the Java 1.0) was released. While in the year 2006,\
    \ Java was made available by Sun under the GNU General Public License (GPL). This\
    \ project which is also called OpenJDLK is continued to this day by Oracle.\n\n\
    The Oracle Corporation which is now the steermanship for Java purchased Sun Microsystems\
    \ in the year 2010. As years went by, the improved and enhanced versions of Java\
    \ have been published. The latest version being the Java 1.8, or the Java 8.\n\
    \n### What Is Java?\n\nJava is a programming language that can be used to design\
    \ or develop mobile, desktop or web apps, games etc. It is defined by a set if\
    \ specifications, and is made up of a programming language, a runtime (Java virtual\
    \ machine), core libraries, and a compiler. With the Java runtime, software developers\
    \ can write program codes in languages different from the familiar Java programming\
    \ language that still runs on the Java virtual machine.\n\nThe Java core libraries\
    \ and the Java virtual machine is important facets of the Java platform. With\
    \ Java, the target is writing a program once and then running it on several operating\
    \ systems.\n\nThe following properties are what make up the Java language:\n\n\
    - **Object-oriented programming language**: All the elements that make up Java\
    \ are objects, except for the primitive data types.\n- **Platform independent**:\
    \ The Java virtual machine is used as an abstraction by Java programs who also\
    \ do not access the operating system directly. This accessibility is what makes\
    \ Java programs highly portable. Any Java program that follows certain rules and\
    \ complies with standard can run without being modified on supported platforms\
    \ such as Linux or Windows.\n- **Automatic memory management**: The memory allocation\
    \ and de-allocation for the creation of new objects is managed by Java. There\
    \ is no direct access to the memory by this program. Objects that do not have\
    \ existing active pointers are automatically deleted by the so-called garbage\
    \ collector.\n- **Compiled and interpreted language**: All Java source codes are\
    \ moved into the bytecode format which is not dependent on the target platform.\
    \ The Java Virtual Machine (JVM) then interprets these bytecode instruction. The\
    \ JVM contains a so called Hotspot-Compiler which translates performance critical\
    \ bytecode instructions into native code instructions.\n- **Strongly-typed programming\
    \ language**: The Java programming language is a strongly-typed one. For example,\
    \ conversion to other objects is relatively strict e.g. must be done most of the\
    \ time by a programmer, while the types of the used variables must be pre-defined.\n\
    \nN.B: - The Java Syntax is a look-like of the C++.\n- Java is also case-sensitive.\
    \ For instance, variables called `myvalue` and `myValue` would always be treated\
    \ as different variables.\n\n### Say Hello to the World Java Program\n\nTo begin,\
    \ the codes in the illustration below can help:\n\n```java\n// a small Java program\n\
    public class HelloWorld {\n    public static void main(String[] args) {\n    \
    \    System.out.println(\"Hello World\");\n    }\n}\n```\n\n### The Java Virtual\
    \ Machine\n\nThere is a software implementation of a computer that implements\
    \ and executes problems like a real machine. That software is called the Java\
    \ Virtual Machine (JVM).\n\nThere is a specific operating system that the Java\
    \ Virtual Machine (JVM) is written for. For instance, a special implementation\
    \ is needed for Linux, as it is also needed for Windows. Also, the Java compiler\
    \ converts Java programs into bytecodes, while the Java Virtual Machine helps\
    \ to interpret the converted bytecode, or to simply execute the Java program.\n\
    \n### Java Development Kit vs Java Runtime Environment\n\nThere are two types\
    \ of a Java distribution. They are the Java Development Kit (JDK), and the Java\
    \ Runtime Environment (JRE). In the Java Runtime Environment (JRE), you would\
    \ find the Java class libraries and the Java Virtual Machine (JVM). They both\
    \ contain the necessary functionality needed to start Java programs.\n\nThe JDK\
    \ additionally contains the development tools necessary to create Java programs.\
    \ The JDK therefore consists of a Java compiler, the Java virtual machine and\
    \ the Java class libraries.\n\n### Development Process with Java\n\nJava source\
    \ files are written as plain text documents. The programmer typically writes Java\
    \ source code in an Integrated Development Environment (IDE) for programming.\
    \ An IDE supports the programmer in the task of writing code, e.g., it provides\
    \ auto-formatting of the source code, highlighting of important keywords, etc.\n\
    \nAt some point the programmer (or the IDE) calls the Java compiler `javac`. The\
    \ Java compiler creates the bytecode. These instructions are stored in `.class`\
    \ files and can be executed by the Java Virtual Machine.\n\n### Garbage collector\n\
    \nThe JVM automatically re-collects the memory which is not referred to by objects.\
    \ The Java garbage collector checks all object references and finds the objects\
    \ which can be automatically released. While the garbage collector relieves the\
    \ programmer from the need to explicitly manage memory, the programmer still need\
    \ to ensure that he does not keep unneeded references, otherwise the garbage collector\
    \ cannot release the associated memory. Keeping unneeded object references are\
    \ called memory leaks.\n\n### Classpath\n\nThe classpath defines where the Java\
    \ compiler and Java runtime look for `.class` files to load. These instructions\
    \ can be used in the Java program. For example, if you want to use an external\
    \ library you have to add this library to your classpath.\n\n# CHAPTER 2: INSTALLING\
    \ JAVA\n\n### Step 1: The recommended Java version\n\nTo install Java, it is highly\
    \ recommended that the latest long-term version of Java is used. At the time of\
    \ writing, this is the JAVA 12.\n\n### Step 2: Check installation\n\nBefore Java\
    \ programs can be run:\n- one must install the Java runtime environment\n- the\
    \ path environment must have the Java executables\n\nThrough the use of a console,\
    \ one can also test if the JRE is installed correctly. To open a console on Windows:\
    \ Win+R, enter `cmd`, then press Enter. Now, enter type in the command below:\n\
    \n```bash\njava -version\n```\n\nThis command would print information about the\
    \ Java installation if the JRE is installed correctly. If this happens, you can\
    \ skip the Java installation description. You would also have to install Java\
    \ if the command line returns the information that the program could not be found.\n\
    \n### Step 3: Install Java\n\nThere is a native installer that can be found on\
    \ the [Java website](http://java.com/) provided by Oracle for Microsoft Windows.\
    \ This native installer has instructions on how to install Java for all supported\
    \ platforms.\n\nFor example:\n\n#### Install Java on Ubuntu\n\nOn Ubuntu you can\
    \ install Java 11 via the following command on the command line. These commands\
    \ might change over time, if they do not work anymore please Google for the installation.\n\
    \n```bash\n# in case you prefer the Oracle Java distribution\n# you can alternatively\
    \ use the following commands\n```\n"
