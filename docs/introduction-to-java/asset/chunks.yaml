  trans: "\n\n有一条规则规定方法必须具有相同的参数和完全相同的返回参数。它还规定返回参数必须相同。\n\n## 方法重载 (Overload methods)\n\
    \n任何同名但参数不同的方法都称为重载方法。返回类型永远不能用于重载方法。\n\n## Main 方法\n\n有一个签名为 `public static`\
    \ 方法可以用于启动 Java 应用程序（查看下文签名）。这个 `public static` 方法通常被称为 main 方法。\n\n```java\n\
    public static void main(String[] args) {}\n```\n\n## 构造函数\n\n每个类都包含一个或两个构造函数，这些函数由\
    \ Java 运行时根据类的定义来创建对象。除了它们使用类名且没有返回类型外，构造函数的声明看起来类似于方法声明。\n\n每个类可以有多个具有不同参数的构造函数。在下面的示例中，类的构造函数期望一个参数：\n\
    \n```java\npackage com.vogella.javaintro.base;\n\npublic class MyConstructorExample2\
    \ {\n    String s;\n    public MyConstructorExample2(String s) {\n        this.s\
    \ = s;\n    }\n}\n```\n\n每个类必须至少定义一个构造函数。如果在 Java 源文件中没有定义式构造函数，编译器将隐式地添加一个。在类被子类的任何情况下，父类的构造函数始终会被隐式地调用。\n\
    \n在下面的示例中，无参数构造函数的定义（也通俗称为空构造函数）不是必须的。如果没有指定，编译器始终会创建一个。\n\n```java\npackage com.vogella.javaintro.base;\n\
    \npublic class MyConstructorExample {\n    // 无必要：如果省略，将由编译器创建\n    public MyConstructorExample()\
    \ {\n    }\n}\n```\n\n要创建一个构造函数，命名规范如下：`classname (Parameter p1, …) { }`。所有对象都是根据构造函数创建的。在对对象进行任何操作之前，构造方法是第一个被调用的语句。\n\
    \n## 第 7 章：修饰符 (MODIFI)\n\n### 访问修饰符 (Access modifiers)\n\n在 Java 中，你可以找到三种访问修饰符：`private`、`protected`\
    \ 和 `public`。你还可以找到四种访问级别。它们是：`private`、`default`、`public` 和 `protected`。所有这些级别定义了相应元素对其他组件的可见性。声明为\
    \ `public` 的示例是类或方法被其他 Java 对象自由地创建或调用。而声明为 `private` 的示例可能是某个方法只能在声明它的类内部被访问。\n\
    \n`default` 和 `protected` 访问级别非常相似。`default` 类只能通过同一个包访问，而 `protected` 类可以从包内以及包外部的子类访问。\n\
    \n为了说明它们的可见性，请看下表：\n\n### 访问级别表\n\n| 修饰符 | 类 | 包 | 子类 | 世界上 |\n| :--- | :--- |\
    \ :--- | :--- | :--- |\n| `private` | Y | N | N | N |\n| 无修饰符 | Y | Y | N | N\
    \ |\n| `protected` | Y | Y | Y | N |\n| `public` | Y | Y | Y | Y |\n\n### 其他修饰符\
    \ (Other modifiers)\n\n- **Final 方法 (Final methods)**：这些方法在子类中不能被重写。\n- **抽象方法\
    \ (Abstract method)**：这些方法没有方法体。\n- **同步方法 (Synchronized method)**：线程安全，可以有任何访问控制，并且可以是\
    \ final 的。\n- **原生方法 (Native methods)**：这些是完全取决于平台的代码。它们仅适用于方法。\n- **Strictfp**：这些是方法或类。\n\
    \n## 第 8 章：导入语句及更多 Java 语言结构\n\n### 导入语句的使用 (Usage of import statements)\n\n要访问\
    \ Java 类，你始终必须使用它的全限定名。这意味着包名加上一个点 `.`，然后是类名。导入语句也可以添加到你的类文件中。这些语句允许你在代码中不使用包限定符的情况下使用相关的类。\n\
    \n### 静态导入 (Static imports)\n\n在由 `static imports` 允许的情况下，另一个类的 `public static`\
    \ 成员（无论是方法还是字段）只能在 Java 代码中不通过类引用来使用。此功能提供了一种类型安全的机制，将常量包含在代码中。这提高了代码的可读性，同时允许\
    \ Java API 设计师编写简洁的 API。\n\n## 更多 Java 语言结构\n\n### 类变量和类方法 (Class variables and\
    \ class methods)\n\n类变量和类方法与类相关，而不是与类的实例（如对象）相关。你可以使用点 (`.`) 和 `classname` 后跟类变量名或类方法来引用这些元素。\n\
    \n`static` 关键字用于声明类变量和类方法。类变量也被称为 `static fields` 或 `static variables`（静态变量），而类方法也被称为\
    \ `static methods`。使用静态字段的一个经典例子是以下语句中的 `println`：`System.out.println(\"Hello\
    \ World\")`。其中 `out` 是一个静态字段，类型为 `PrintStream` 的对象，你在这个对象上调用了 `println()` 方法。\n\
    \n如果你定义了一个静态变量，Java 运行时环境无论存在多少实例（对象），都会为类关联一个类变量。因此，静态变量可以被视为全局变量。\n\n以下代码演示了静态字段的使用：\n\
    \n```java\npackage com.vogella.javaintro.base;\n\npublic class MyStaticExample\
    \ {\n    static String PLACEHOLDER = \"TEST\";\n    static void test() {\n   \
    \     System.out.println(\"Hello\");\n    }\n}\n```\n\n```java\npackage com.vogella.javaintro.base;\n\
    \npublic class Tester {\n    public static void main(String[] args) {\n      \
    \  System.out.println(MyStaticExample.PLACEHOLDER);\n        MyStaticExample.test();\n\
    \    }\n}\n```\n\n如果一个变量应该被定义为常量，用 `static` 和 `final` 声明它。`static` 方法在没有实例的情况下运行，它无法直接访问静态变量。\n\
    \n### 抽象类和方法 (Abstract class and methods)\n\n类和方法可以被声明为 `abstract`。`abstract`\
    \ 类不能直接实例化。如果一个类至少有一个只包含声明没有实现的方法，那么这个类就是抽象的，不能实例化。子类类需要定义这些方法，除非它们也被声明为 `abstract`。\n\
    \n如果一个类包含一个抽象方法，它也需要用 `abstract` 关键字定义。以下示例显示了一个抽象类：\n\n```java\npackage com.vogella.javaintro.base;\n\
    \npublic abstract class MyAbstractClass {\n    abstract double returnDouble();\n\
    }\n```\n\n## 第 9 章：速查表 (CHEATETS)\n\n在 Java 开发期间，你需要执行某些操作，例如创建局部变量。以下可以作为此类任务的参考，告诉你如何操作。\n\
    \n### 类操作 (Working with classes)\n\n在编写 Java 时，你必须创建多个类、方法、实例变量。以下使用了包 test。\n\
    \n| 操作内容 | 如何操作 |\n| :--- | :--- |\n| 创建一个名为 `MyNewClass` 的类。 | `package test;public\
    \ class MyNewClass {}` |\n| 在 `MyNewClass` 类中类型为 `String` 的名为 `var1` 的新属性（实例变量）。\
    \ | `package test;public class MyNewClass { private String var1; }` |\n| 为你的 `MyNewClass`\
    \ 类创建一个构造函数，它有一个 `String` 参数并将值赋值给 `var1` 实例变量。 | `package test;public class MyNewClass\
    \ { private String var1; public MyNewClass(String para1) {var1 = para1; // 或 this.var1=\
    \ para1; } }` |\n\n"
