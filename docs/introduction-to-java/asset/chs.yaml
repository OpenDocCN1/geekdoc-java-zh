  \n`}`\n\n`Optional` 类用于避免 `NullPointerException`。\n\n`Optional` 类用于在访问字段时避免 `NullPointerException`。为了避免这种异常，可以使用\
  \ `orElse` 或 `orElseGet`。\n\n`Optional` 类用于处理可能为空的值。使用 `get()` 方法时会抛出 `NoSuchElementException`。为了避免此异常，可以使用\
  \ `orElse` 或 `orElseGet`。\n\n`Optional` 类用于检查值是否存在。如果值存在，可以使用 `ifPresent` 执行某些代码。\n\
  \n`Optional` 类用于通过 `map` 方法转换对象。如果值存在，可以使用 `map` 方法进行转换。\n\n`Optional` 类用于通过 `filter`\
  \ 方法过滤某些值。如果值满足条件，可以使用 `filter` 方法进行过滤。\n\n\n\n\n要调度任务，你可以利用 `java.util.Timer` 或\
  \ `java.util.TimerTask`。`Timer` 将根据给定的间隔执行由对象实现的 `TimeTask`。\n\n查看下方的示例：\n\n```java\n\
  package schedule;\n\nimport java.util.TimerTask;\n\npublic class MyTask extends\
  \ TimerTask {\n    private final String string;\n    private int count = 0;\n\n\
  \    public MyTask(String string) {\n        this.string = string;\n    }\n\n  \
  \  @Override\n    public void run() {\n        count++;\n        System.out.println(string\
  \ + \" called \" + count);\n    }\n}\n```\n\n```java\npackage schedule;\n\nimport\
  \ java.util.Timer;\n\npublic class ScheduleTest {\n    public static void main(String[]\
  \ args) {\n        Timer timer = new Timer();\n        // 等待 2 秒 (2000 毫秒) 然后开始\n\
  \        timer.schedule(new MyTask(\"Task1\"), 2000);\n        for (int i = 0; i\
  \ < 100; i++) {\n            // 等待 1 秒，然后每 5 秒执行一次\n            timer.schedule(new\
  \ MyTask(\"Task \" + i), 1000, 5000);\n        }\n    }\n}\n```\n\n# 第 19 章：JAVA\
