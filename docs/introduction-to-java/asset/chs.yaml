  \         .filter(s -> s.contains(\"e\"))\n                .map(s -> s.toUpperCase())\n\
  \                .reduce(\"\", (a, b) -> a + \" \" + b);\n        System.out.println(result\
  \ + \"!\");\n    }\n}\n```\n\n## Lambda 和流的示例\n下面的插图是使用流的大型示例。所有代码均提取自 EclipseCon\
