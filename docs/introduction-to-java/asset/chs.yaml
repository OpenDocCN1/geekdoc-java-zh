  \ ‘.’，因此必须使用两个反斜杠进行引用。 |\n\n# 第 15 章：LAMBDAS\n\n## 什么是 Lambda？\n任何带有参数的代码块都被称为 lambda\
  \ 表达式。Lambda 允许程序员标记一段稍后应该执行的代码块。它们对于编程来说非常重要。\n\n从 Java 8 开始，Java 编程语言支持 lambda。‘函数式接口’是\
  \ Java 中 lambda 表达式的一种。每当方法期望一个函数式接口作为参数时，就可以传递一个 lambda 表达式。\n\n## lambda 表达式的用途\n\
  与其他 Java 编程结构相比，使用 lambda 允许程序员使用更紧凑的语法。例如，Collection 接口有一个接受 lambda 表达式的 `forEach`\
  \ 方法。\n\n查看此插图/示例：\n\n```java\nList<String> list = Arrays.asList(\"vogella.com\"\
  ,\"google.com\",\"heise.de\");\nlist.forEach(s-> System.out.println(s));\n```\n\n\
  ## 使用方法引用\n在 lambda 表达式可以使用方法引用。通过 `CalledFrom::method` 调用的方法通常由该方法引用定义。\n\n`CalledFrom`\
  \ 可以是 `instance::instanceMethod`、`SomeClass::staticMethod` 或 `SomeClass::instanceMethod`。\n\
  \n看下方的插图：\n\n```java\nList<String> list = new ArrayList<>();\nlist.add(\"vogella.com\"\
  );\nlist.add(\"google.com\");\nlist.add(\"heise.de\");\nlist.forEach(System.out::println);\n\
  ```\n\n### 闭包与 lambda 表达式的区别\nJava 编程语言支持 lambda，但不支持闭包（closures）。lambda 是匿名函数（例如，它可以被定义为参数），而闭包是在不需要类或方法的情况下使用的代码块或代码片段。这意味着未在参数中定义的变量可以被闭包访问，而且它也可以赋值给变量。\n\
  \n# 第 16 章：STREAMS（流）\n\n## 什么是流（streams）？\n来自支持聚合操作源的元素序列被称为来自 `java.util.stream`\
  \ 包的流。\n\n## IntStream\n`Intstreams` 允许创建原始类型 int 值元素的序列，这些序列支持顺序和并行聚合操作。\n\n##\
  \ 查看下方的插图：\n```java\npackage com.vogella.java.streams;\n\nimport java.util.ArrayList;\n\
  import java.util.List;\nimport java.util.stream.IntStream;\n\npublic class IntStreamExample\
  \ {\n    public static void main(String[] args) {\n        // 输出从 1 到 100 的数字\n\
  \        IntStream.range(1, 101).forEach(s -> System.out.println(s));\n        //\
  \ 为 1 到 100 创建整数列表\n        List<Integer> list = new ArrayList<>();\n        IntStream.range(1,\
  \ 101).forEach(it -> list.add(it));\n        System.out.println(\"Size \" + list.size());\n\
  \    }\n}\n```\n\n## 使用 lambda 和流进行规约操作\n流和 lambda 允许创建原始类型 int 值元素的序列，这些序列支持顺序和并行聚合操作。见下方：\n\
  \n```java\npackage com.vogella.java.streams;\n\npublic class Task {\n    private\
  \ String summary;\n    private int duration;\n\n    public Task(String summary,\
  \ int duration) {\n        this.summary = summary;\n        this.duration = duration;\n\
  \    }\n\n    public String getSummary() {\n        return summary;\n    }\n\n \
  \   public void setSummary(String summary) {\n        this.summary = summary;\n\
  \    }\n\n    public int getDuration() {\n        return duration;\n    }\n\n  \
  \  public void setDuration(int duration) {\n        this.duration = duration;\n\
  \    }\n}\n```\n\n```java\npackage com.vogella.java.streams;\n\nimport java.util.ArrayList;\n\
  import java.util.List;\nimport java.util.Random;\nimport java.util.stream.Collectors;\n\
  import java.util.stream.IntStream;\n\npublic class StreamTester {\n    public static\
  \ void main(String[] args) {\n        Random random = new Random();\n        //\
  \ 生成随机列表\n        List<Task> values = new ArrayList<>();\n        IntStream.range(1,\
  \ 20).forEach(i -> values.add(new Task(\"Task\" + random.nextInt(10), random.nextInt(10))));\n\
  \n        // 获取时长大于 5 的列表\n        List<String> resultList = values.stream()\n \
  \               .filter(t -> t.getDuration() > 5)\n                .map(t -> t.getSummary())\n\
  \                .collect(Collectors.toList());\n        System.out.println(resultList);\n\
  \n        // 获取时长大于 5 的任务的连接字符串\n        String collect = values.stream()\n    \
  \            .filter(t -> t.getDuration() > 5)\n                .map(t -> t.getSummary())\n\
  \                .collect(Collectors.joining(\"-\"));\n        System.out.println(collect);\n\
  \    }\n}\n```\n\n## 映射和过滤列表内容的示例\n下面的插图解释了如何通过流过滤列表，如何执行映射操作，以及如何使用 `reduce` 方法从其创建一个最终结果。\n\
  \n```java\nimport java.util.Arrays;\nimport java.util.List;\n\npublic class JavaStreamExample\
  \ {\n    public static void main(String[] args) {\n        List<String> list = Arrays.asList(\"\
