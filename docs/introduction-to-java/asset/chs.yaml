  \ getDog() {\n    return dog;\n  }\n  public void setDog(Dog dog) {\n    this.dog\
  \  = dog;\n  }\n}\n``` |\n\n### 局部变量的使用\n\n必须始终在方法中声明局部变量。请看下面的插图：\n\n| 操作 | 执行方法\
  \ |\n| --- | --- |\n| 应该声明一个 `String` 类型的（局部）变量。 | `String variable1;` |\n| 应该声明一个\
  \ `String` 类型的（局部）变量，并为其赋值 ‘Test’。 | `String variable2 = \"Test\";` |\n| 应该声明一个\
  \ `Person` 类型的（局部）变量。 | `Person person;` |\n| 应该声明一个 `String` 类型的（局部）变量，创建一个新对象并将变量赋值该对象。\
  \ | `Person person = new Person();` |\n| 应该声明一个 `String` 类型的数组。 | `String array[];`\
