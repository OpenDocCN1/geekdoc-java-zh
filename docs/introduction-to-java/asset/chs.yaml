  \n long catCount = persons.stream().filter(person ->person.hasPet(PetType.CAT)).count();\n\
  \n System.out.println(catCount);\n\n // 谁养了猫？\n\n      List<Person> peopleWithCats\
  \ = persons.stream().filter(person -> person.hasPet(PetType.CAT))\n\n .collect(Collectors.toList());\n\
  \n // 谁没有养猫\n\n      List<Person> peopleWithoutCats = persons.stream().filter(person\
