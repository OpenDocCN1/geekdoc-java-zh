  \ `pers1`。 | `pers1 = pers2;` |\n| 应该声明一个可以容纳 `Person` 对象的 `ArrayList` 变量。 | `ArrayList<Person>`\
  \ |\n| 应该创建一个包含 `Person` 对象的新 `ArrayList` 并赋值给现有变量 `persons`。 | `persons = new ArrayList<Person>();`\
  \ |\n| 应该声明一个可以容纳 `Person` 对象的 `ArrayList` 变量，并为其创建一个新对象。 | `ArrayList<Person> persons\
  \ = new ArrayList<Person>();` |\n\n# 第十章：集成环境\n\n在最后一章中，我们讨论了在命令行上创建和编译 Java 程序所需的步骤。然而，我们有了更好的选择：如果你使用\
  \ Java 开发环境 (`IDE`），你会发现创建 Java 程序非常方便。而且，还有。有许多其他强大的 `IDEs` 可以，例如 `Eclipse` IDE。如果你想学习使用\
  \ `IDE` 所需的步骤，可以去搜索 `Eclipse` 教程。你还会发现最后的描述使用了短语：‘创建一个名为 …… 的 Java 项目’。此描述指的是在 Eclipse\
  \ 中创建 Java 项目。如果你一直在使用不同的 `IDE`，请确保你了该 `IDE` 中必要的步骤。\n\n### 类型转换\n\n如果使用了不同类型的变量，Java\
  \ 将对某些类型要求显式转换。在下面的插图中，你会找到此类转换的示例。要从其他类型转换为 `Strings`，可以使用以下方法：\n\n```java\n//\
  \ 将 int 转换为 String\nString s1 = String.valueOf(10); // \"10\"\n// 将 double 转换为 String\n\
  String s2 = String.valueOf(Math.PI); // \"3.141592653589793\"\n// 将 boolean 转换为\
  \ String\nString s3 = String.valueOf(1 < 2); // \"true\"\n// 将 date 转换为 String\n\
  String s4 = String.valueOf(1 < 2); // \"true\"\n```\n\n#### [字符串转换为数字](https://www.vogella.com/tutorials/JavaIntroduction/article.html#stringtonumber)\n\
  \n如果使用了不同类型的变量，Java 将对某些类型要求显式转换。在下面的插图中，你会找到此类转换的示例。要从其他类型转换为 `Strings`，可以使用以下方法：\n\
  \n```java\n// 将 int 转换为 String\nString s1 = String.valueOf(10); // \"10\"\n// 将\
  \ double 转换为 String\nString s2 = String.valueOf(Math.PI); // \"3.141592653589793\"\
  \n// 将 boolean 转换为 String\nString s3 = String.valueOf(1 < 2); // \"true\"\n```\n\
  \n#### [Double 转 int](https://www.vogella.com/tutorials/JavaIntroduction/article.html#conversion_toint)\n\
  \n要将 `double` 转换为 `int`，你可以：\n\n```java\nint = double;\n```\n\n#### [SQL 日期转换](https://www.vogella.com/tutorials/JavaIntroduction/article.html#conversion_sqldate)\n\
  \n### 以下应该用于将 `Date` 转换为 SQL Date：\n\n```java\npackage test;\nimport java.text.DateFormat;\n\
  import java.text.ParseException;\nimport java.text.SimpleDateFormat;\npublic class\
  \ ConvertDateToSQL {\n  private void convertToSQL() {\n    SimpleDateFormat template\
  \ = new SimpleDateFormat(\"yyyy-MM-dd\");\n    java.util.Date enddate = new java.util.Date(\"\
  10/31/99\");\n    java.sql.Date sqlDate = java.sql.Date.valueOf(template.format(enddate));\n\
  \  }\n\n  public static void main(String[] args) {\n    ConvertDateToSQL date =\
  \ new ConvertDateToSQL();\n    date.convertToSQL();\n  }\n}\n```\n\n# 第十一章：Java\
  \ 语句\n\n某些语句在 Java 语言中具有预定义的含义。在本章中，你会发现列出了一些描述。\n\n#### if-then 和 if-then-else\n\
  \n`if-then` 语句是一种控制流语句。只有当 `if` 部分指定的测试为‘真’时，才会执行代码块。然而，如果 `if` 部分求值为假，则可选的 `else`\
  \ 块将被执行。\n\n#### switch\n\n多个替代方案可以由 `switch` 语句处理，如果它们都作用于同一个常量值。\n\n```java\n\
  switch (expression) {\n  case constant1:\n    command;\n}\n```\n\n\n\n```java\n\
  break;  // 将防止其他 case 也执行\n\ncase constant2:\n    command;\n    break;\n\n...\n\n\
  default:\n}\n\n// 示例：\n\nswitch (cat.getLevel()) {\n    case 0:\n        return\
  \ true;\n    case 1:\n        if (cat.getLevel() == 1) {\n            if (cat.getName().equalsIgnoreCase(req.getCategory()))\
  \ {\n                return true;\n            }\n        }\n    case 2:\n     \
  \   if (cat.getName().equalsIgnoreCase(req.getSubCategory())) {\n            return\
  \ true;\n        }\n}\n\n// 你也可以对不同的常量使用相同的逻辑\n\npublic static void main(String[]\
  \ args) {\n    for (int i = 0; i < 6; i++) {\n        switch (i) {\n           \
  \ case 1:\n            case 5:\n                System.out.println(\"Hello\");\n\
  \                break;\n            default:\n                System.out.println(\"\
  Default\");\n                break;\n        }\n    }\n}\n```\n\n## 布尔运算\n\n要检查两个引用是否指向同一个对象，或者比较两个基本类型，你可以使用\
  \ `==`。你也可以使用 `equals()` 方法来检查两个不同对象是否相等。\n\n存在短路方法，一旦评估结果明确，它们就会终止。示例有 `&&` 和 `||`。\n\
  \n在图示中，`(true || …)` 始终为真，而 `(false && …)` 始终被描述为假。\n\n例如：`(var != null && var.method1\
  \ …)` 确保在执行原始检查之前 `var` 不为空。\n\n### 布尔运算表\n\n| 操作 | 描述 |\n| --- | --- |\n| `==`\
  \ | 这代表“相等”。当涉及对象时，系统将检查引用变量是否指向同一个对象。对象的内容将不会被比较！ |\n| `&&` | 代表“与 (And)” |\n|\
  \ `!=` | 代表“不相等，类似于 `==`。” |\n| `a.equals(b)` | 用于检查“字符串 a 是否等于 b” |\n| `a.equalsIgnoreCase(b)`\
  \ | 用于检查“在忽略大小写的情况下，字符串 a 是否等于 b” |\n| `If (value ? false : true) {}` | 这是一个协商：如果\
  \ value 不为真则返回真。 |\n\n# 第 12 章：JAVA 中的循环\n\n### for 循环\n\n有一种重复控制结构，允许你编写一个可以执行指定次数的代码块。该结构被称为“for\
  \ 循环”。\n\n该结构的语法可以参于下文：\n\n```java\nfor(initialization; expression; update_statement)\n\
  {\n     // 要运行的代码块\n}\n```\n\n关于“for 循环”结构的示例，请查看下方的图示：\n\n```java\npublic class\
  \ ForTest {\n    public static void main(String args[]) {\n        for(int i = 1;\
  \ i < 10; i = i+1) {\n            System.out.println(\"value of i : \" + i );\n\
  \        }\n    }\n}\n```\n\n注意：对于集合和数组，提供了改进的“for 循环”。你会在数组描述中找到该循环。\n\n### while\
  \ 循环\n\n有另一种重复控制结构，它只允许编写一个代码块，该块一直执行直到特定条件变为假。该结构被称为“while 循环”。以下是该结构的语法：\n\n```java\n\
  while(expression)\n{\n     // 要运行的代码块\n}\n```\n\n关于“while 循环”的示例，请看下方的示例：\n\n```java\n\
  public class WhileTest {\n    public static void main(String args[]) {\n       \
  \ int x = 1;\n        while (x < 10) {\n            System.out.println(\"value of\
  \ x : \" + x);\n            x++;\n        }\n    }\n}\n```\n\n### do while 循环\n\n\
  do-while 循环与 while 循环相似，不同之处是在执行后检查条件。语法如下。\n\n```java\ndo\n{\n     // 要运行的代码块\n\
