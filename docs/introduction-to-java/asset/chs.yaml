  \ 中的循环\n- 第十三章章：数组\n- 第十四章章：字符串\n- 第十五章章：Lambda 表达式\n- 第十六章章：流 (Streams)\n- 第十七章：可选类型\
  \ (Optional)\n- 第十八章：系统属性\n- 第第十九一章：Java 练习题\n\n# 第一章：Java 简史\n\n1991 年，Sun 微公司（SUN）的\
  \ James Gosling 创造了一种在今天被称为“Java”的编程语言。直到 1995 年，第一个公开的 Java 版本（Java 1.0）才被发布。2006\
  \ 年，Sun 公司在 GNU 通用公共许可证（GPL）下发布了 Java。这个也被称为 OpenJDK 的项目至今仍由 Oracle 公司继续维护。\n\n\
  现在由 Oracle 管理 Java 的 Oracle 公司于 2010 年收购了 Sun 微公司。随着时间的推移，经过改进和增强的 Java 版本不断发布。目前的最新版本是\
  \ Java 1.8，或 Java 8。\n\n### 什么是 Java？\n\nJava 是一种编程语言，可用于设计或开发移动应用、桌面应用或 Web 应用、游戏等。它由一组规范定义，由编程语言、运行时（Java\
  \ 虚拟机）、核心库和编译器组成。通过 Java 运行时，软件开发者可以使用不同于熟悉的 Java 编程语言编写程序代码，而这些代码仍然运行在 Java 虚拟机上。\n\
  \nJava 核心类库和 Java 虚拟机是 Java 平台的重要组成部分。通过 Java，目标是实现“编写一次，即可在多个操作系统上运行”。\n\n以下属性构成了\
  \ Java 语言：\n\n- **面向对象的编程语言**：除了基本数据类型外，构成 Java 的所有元素都是对象。\n- **平台无关**：Java 虚拟机被\
  \ Java 程序用作抽象，Java 程序也不直接访问操作系统。这种访问性使得 Java 程序具有高度的可移植性。任何遵循特定规则并符合标准的 Java 程序都可以在\
  \ Linux 或 Windows 等支持的平台上无需修改即可运行。\n- **自动内存管理**：创建新对象的内存分配和释放由 Java 管理。该程序无法直接访问内存。没有活动指针的对象将由所谓的“垃圾回收器”自动删除。\n\
  - **编译型和解释型语言**：所有 Java 源代码都被转换为不依赖于目标平台的字节码格式。然后，Java 虚拟机（JVM）会解释这些字节码指令。JVM 包含一个名为“热点编译器”（Hotspot-Compiler）的组件，它可以性能关键的字节码指令翻译成原生代码指令。\n\
  - **强类型编程语言**：Java 编程语言是一种强类型语言。例如，与其他对象之间的转换相对严格，例如大多数时候必须由程序员完成，而所用变量的类型必须预定义。\n\
  \n注意：- Java 的语法看起来像 C++。\n- Java 同样对大小写敏感。例如，名为 `myvalue` 和 `myValue` 的变量始终被视为不同的变量。\n\
  \n### 编写第一个 Hello World 程序\n\n要开始，下面的图示代码可以有所帮助：\n\n```java\n// 一个小型 Java 程序\npublic\
  \ class HelloWorld {\n    public static void main(String[] args) {\n        System.out.println(\"\
  Hello World\");\n    }\n}\n```\n\n### Java 虚拟机\n\n有一种计算机的软件实现，可以像真实机器一样实现并执行问题。该软件被称为\
  \ Java 虚拟机（JVM）。\n\nJava 虚拟机（JVM）是为特定的操作系统编写的。例如，Linux 需要一个特殊的实现，Windows 同样需要一个实现。此外，Java\
  \ 编译器将 Java 程序转换为字节码，而 Java 虚拟机则帮助解释转换后的字节码，或者直接执行 Java 程序。\n\n### Java 开发工具包 vs\
  \ Java 运行时环境\n\nJava 有两种发行类型。分别是 Java 开发工具包（JDK）和 Java 运行时环境（JRE）。在 Java 运行时环境（JRE）中，你可以找到\
  \ Java 类库和 Java 虚拟机（JVM）。它们都包含了启动 Java 程序所需的功能。\n\nJDK 额外包含了创建 Java 程序所需的开发工具。因此，JDK\
  \ 由 Java 编译器、Java 虚拟机和 Java 类库组成。\n\n### 使用 Java 进行开发流程\n\nJava 源文件以纯文本文档的形式编写。程序员通常在集成开发环境（IDE）中编写\
  \ Java 源代码。IDE 支持程序员编写代码的任务，例如，它可以提供源代码的自动格式化、重要关键词的高亮等功能。\n\n在某个时刻，程序员（或 IDE）调用\
  \ Java 编译器 `javac`。Java 编译器创建字节码。这些指令存储在 `.class` 文件中，并由 Java 虚拟机执行。\n\n### 垃圾回收器\n\
  \nJVM 会自动收集未被对象引用的内存。Java 垃圾回收器检查所有对象引用并寻找可以自动释放的对象。虽然垃圾回收器让程序员无需显式管理内存，但程序员仍然需要确保自己不保留不必要的引用，否则垃圾回收器无法释放关联内存。保留不必要的对象引用被称为内存泄漏。\n\
  \n### 类路径 (Classpath)\n\n类路径定义了 Java 编译器和 Java 运行时在哪里查找用于加载的 `.class` 文件。这些指令可以在\
  \ Java 程序中使用。例如，如果你想使用外部库，就必须将该库添加到类路径中。\n\n# 第二章：安装 Java\n\n### 第一 步：推荐的 Java 版本\n\
  \n为了安装 Java，强烈建议使用 Java 的最新长期支持版本。在编写本文时，这是 JAVA 12。\n\n### 第二 步：检查安装\n\n在运行 Java\
  \ 程序之前：\n- 必须安装 Java 运行时环境\n- 环境变量中必须包含 Java 可执行文件\n\n通过控制台，也可以测试 JRE 是否安装正确。在 Windows\
  \ 上打开控制台：按 Win+R，输入 `cmd`，然后按回车。现在，输入以下命令：\n\n```bash\njava -version\n```\n\n如果\
  \ JRE 安装正确，此命令将打印出关于 Java 安装的信息。如果发生这种情况，你可以跳过 Java 安装说明。如果命令行返回找不到程序的信息，你也必须安装\
  \ Java。\n\n### 第 3 步：安装 Java\n\n在 [Java 网站](http://java.com/)上可以找到 Oracle 提供的适用于\
  \ Microsoft Windows 的原生安装程序。该原生安装程序包含了在如何在所有支持的平台上安装 Java 的说明。\n\n例如：\n\n#### 在\
  \ Ubuntu 上安装 Java\n\n在 Ubuntu 上，你可以通过命令行中的以下命令安装 Java 11。这些命令可能会随时间变化，如果它们不再有效，请搜索新的安装方法。\n\
  \n```bash\n### 如果你倾向于使用 Oracle Java 发行版\n### 你也可以备选使用以下命令\n```\n\n\n\n\n\n```bash\n\
  sudo add-apt-repository ppa:linuxuprising/java\nsudo apt-get update\nsudo apt-get\
  \ install oracle-java11-installer\n```\n\n### 最后一步：检查安装问题和其他操作系统\n\n如果你在尝试在系统上安装\
  \ Java 时遇到问题，请在 Google 上搜索“如何在我的 OS 上安装 JDK”。请记住将“OS”一词替换为你当前正在使用的操作系统，如 Ubuntu、Mac\
  \ OS X 或 Windows。你一定能找到非常有用的链接。\n\n# 第 3 章：Java 语言基础结构\n\n## 类 (Class)\n\n任何描述与类实例相关的行为和数据的模板都称为“类（Class）”。\n\
  \n`class` 关键字用于定义一个类，它必须以大写字母开头。每个类的类体都包含在符号 `{}` 之中。\n\n例如：\n\n```java\npackage\
  \ test; class MyClass { }\n```\n\n与类相关的任何数据都存储在变量中，而与对象或类相关的行为则通过方法来实现。\n\n此外，你会在文本文件中找到每个类，该文件名与类名相同，并带有\
  \ `.java` 扩展名。你也可以定义内部类（定义在另一个类内部类）。要成功实现这一点，你不需要为该类准备单独的文件。\n\n## 对象 (Object)\n\
  \n类的任何实例都称为对象。它是可以执行操作并拥有数据的真实元素。每个对象都是根据类的定义创建的。每个对象的蓝图都是类，这意味着类描述了如何创建每个对象。\n\n\
  ## 包 (Package)\n\nJava 将类分组在功能性的“包（packages）”中。\n\n类通常也通过包分组在逻辑单元中。例如，应用程序的每个图形视图都可以放在同一个名为\
  \ `com.vogella.webapplication.views` 的包中。\n\n许多人通常使用公司的反向域名作为顶级包。例如，拥有 `backdrops.com`\
  \ 域名的公司其 Java 包将以 `com.backdrops` 开头。\n\n使用包的另一个原因是为了避免类的命名冲突。要发生命名冲突，两个程序员必须给同一个类提供相同的完全限定名。Java\
  \ 中类的完全限定名由包名、紧跟其后的点（`.`）、最后是类名组成。\n\n如果没有包包，程序员可能会创建一个名为 `Test` 的 Java 类。另一个程序员可能会使用相同的名称来创建一个类。通过使用包，可以指示系统调用哪个类。例如，如果第一个程序员将\
  \ `Test` 类放在包 `report` 中，而第二个程序员将他的类放在包 `xmlreader` 中，人们可以使用完全限定名（如 `report.Test`\
  \ 或 `xmlreader.Test`）区分这些类。\n\n## 继承 (Inheritance)\n\n你可以始终从另一个类派生出一个类。当这种情况发生时，派生的类被称为“子类（subclass）”。另一种常见情况是一个类被另一个类扩展。\n\
  \n获取子类的类被称为“父类（superclass）”。\n\n当发生继承时，它允许一个类继承另一个类的数据定义和行为。\n\n下面你将找到演示类如何扩展另一个类的代码。请记住，在\
  \ Java 中，一个类最多继承一个类。\n\n```java\npackage com.vogella.javaintro.base;\n\nclass MyBaseClass\
  \ {\n public void hello() {\n    System.out.println(\"Hello from MyBaseClass\");\n\
  \ }\n}\n\npackage com.vogella.javaintro.base;\n\nclass MyExtensionClass extends\
  \ MyBaseClass {\n}\n```\n\n### 对象作为父类\n\n在 Java 中，每个对象都隐式地继承自 `Object` 类。对于每个 Java\
  \ 对象，类定义了以下方法：\n\n- `equals(o1)` 允许检查当前对象是否等于 `o1`\n- `getClass()` 返回对象的类类型\n- `hashCode()`\
  \ 返回当前对象的标识符\n- `toString()` 给出当前对象的字符串表示\n\n## Java 中的异常处理 (Exception handling\
  \ in Java)\n\n在 Java 中，有一种事件指示应用程序在运行期间发生了错误。这种事件被称为异常（exception）。当异常发生时，应用程序指令的通常执行流会被中断。通常情况下，异常会在调用层次结构中向上抛出，直到它们被捕获（catched）。\n\
  \n![C:\\Users\\USER\\Downloads\\exception_throw_callstack.png](img/image00206.jpeg)\n\
  \n### 检查异常 (Checked Exceptions)\n\n检查异常是由方法显式抛出的，这些方法可能会导致异常发生，或者在抛出的 `Exception`\
  \ 未被捕获时由方法重新抛出。\n\n因此，在调用抛出检查异常的方法时，`Exceptions` 要么必须被捕获，要么被重新抛出。\n\n```java\npublic\
  \ void fileNotFoundExceptionIsCaughtInside() {\n try {\n    createFileReader();\n\
  \  } catch (FileNotFoundException e) {\n    logger.error(e.getMessage(), e);\n }\n\
  }\n\npublic void fileNotFoundExceptionIsReThrown() throws FileNotFoundException\
  \ {\n    createFileReader();\n}\n\npublic void createFileReader() throws FileNotFoundException\
  \ {\nFile file = new File(\"/home/Documents/JavaTraining.txt\");\n // 创建新的 FileReader\
  \ 可能会导致 FileNotFoundException\n new FileReader(file);\n}\n```\n\n注意：当在某些情况下可以预测到错误时，使用检查异常，例如找不到文件。\n\
  \n### 运行时异常 (Runtime Exceptions)\n\n运行时异常是那些在方法签名中没有显式指出的异常，因此不需要被捕获。\n\n最著名的运行时异常是\
  \ `NullPointerException`，它发生在运行时，当对一个实际上为空的对象调用方法时。\n\n```java\npublic void causeANullPointerException()\
  \ {\nString thisIsNull = getMessage(false);\n // 因为 thisIsNull 对象为空\n // 这会导致 NullPointerException\n\
  \ thisStringIsNull.toLowerCase();\n}\n\npublic String getMessage(boolean messageIsAvailable)\
  \ {\n if(messageIsAvailable) {\n return message;\n }\n return null;\n}\n```\n\n\
  # 第 4 章：接口 (INTERFACES)\n\n## 什么是 Java 接口？\n\n接口是一种与类类似的类型，通过 `interface` 关键字定义。接口用于定义实现类的公共行为。如果两个类实现了同一个接口，在接口级别工作的代码就可以使用这两个类的对象。\n\
  \n和类一样，接口定义了方法。类可以实现一个或多个接口。实现接口的类必须为接口定义的所有抽象方法提供实现。\n\n## 接口中的抽象方法、默认方法和静态方法\n\
  \n接口可以包含抽象方法 `default` 方法。默认方法通过方法签名开头的 `default` 关键字定义。接口中定义的所有其他方法都是公共且抽象的；显式声明这些修饰符是可选的。\n\
  \n接口可以拥有常量，这些常量始终是公共、静态且最终的（final）。\n\n以下代码展示了接口实现的示例。\n\n```java\npackage testing;\n\
  \npublic interface MyInterface {\n // 常量定义\nString URL = \"https://www.vogella.com/\"\
  ;\n // 公共抽象方法\n void test();\n void write(String s);\n // 默认方法\n default String\
  \ reserveString(String s){\n return new StringBuilder(s).reverse().toString();\n\
  \ }\n}\n```\n\n## 实现接口 (Implementing Interfaces)\n\n类可以实现接口。在这种情况下，它必须为抽象接口方法提供具体实现。如果你实现由接口定义的方法，可以使用\
  \ `@Override` 注解。这告诉 Java 编译器你实际上想要实现接口定义的方法。这样，如果你写错了方法名称或参数数量，编译器可以给你报错。以下类实现了\
  \ `MyInterface` 接口，因此它必须实现抽象方法，并可以使用默认方法。\n\n\n\n\n\n```java\npackage com.vogella.javaintro.base;\n\
  \npublic class MyClassImpl implements MyInterface {\n\n    @Override\n    public\
  \ void test() {\n    }\n\n    @Override\n    public void write(String s) {\n   \
  \ }\n\n    public static void main(String[] args) {\n        MyClassImpl impl =\
  \ new MyClassImpl();\n        System.out.println(impl.reserveString(\"Lars Vogel\"\
  ));\n    }\n}\n```\n\n## 使用默认方法演进接口\n\n在过去，Java 8 演进接口（例如向接口添加新方法）是不可能的，除非破坏现有的客户端。自从\
  \ Java 8 提供了默认方法，通过简单地提供默认实现，现在可以扩展接口而无需破坏现有的客户端。这种默认方法的发明是一个二进制且兼容的更改。\n\n现在，类可以重写默认方法以提供更好的行为。\n\
  \n### 方法的多重继承\n\n当一个类实现两个接口，且这些接口提供了相似的默认方法时，Java 将通过以下规则为类解析实际方法：\n\n-   **子类型优于父类型**：如果一个类可以从两个接口继承同一个方法，且其中一个接口是另一个接口的子类型，则该类将继承来自子类型的方法。\n\
  -   **父类总是优于父接口**：如果一个类可以从父接口和父类继承同一个方法，则该类将继承父类方法。这条规则对于抽象和具体的父类方法尤其如此。该规则还意味着，如果该方法也在父类链中声明，则将不会使用默认方法。\n\
  -   **在所有其他情况下**，类必须实现该默认方法。\n\n下面的图演示了编号为 3 的列表：\n\n```java\npublic interface A\
  \ {\n    default void m() {}\n}\n\npublic interface B {\n    default void m() {}\n\
  }\n\npublic class C implements A, B {\n    @Override\n    public void m() {}\n}\n\
  ```\n\n在进行自己的实现时，你始终可以调用你喜欢的父类方法。如下所示：\n\n```java\npublic class C implements A,\
  \ B {\n    @Override\n    public void m() {\n        A.super.m();\n    }\n}\n```\n\
  \n## 函数接口\n\n函数式接口是各种只有一个方法的接口。所有函数式接口都有一个特殊的特性：它们可以与 lambda 表达式一起使用。所有函数式接口都由 Java\
  \ 编译器自动识别。它们只需要只有一个抽象方法。尽管如此，使用 `@FunctionalInterface` 注解来捕捉设计意图是非常可能的。\n\n许多默认\
  \ Java 接口都是函数式接口。例如：\n\n-   `java.beans.PropertyChangeListener`\n-   `java.util.Comparator`\n\
  -   `java.io.FileFilter`\n-   `java.util.concurrent.Callable`\n-   `java.lang.Runnable`\n\
  \n还有一个名为 `java.util.function` 的包，包含了 Java 中频繁使用的函数式接口。`java.util.function` 包包括：\n\
  \n-   `BinaryOperator<T>` - 一个从 `(T, T)` 到 `T` 的函数\n-   `UnaryOperator<T>` - 一个从\
  \ `T` 到 `T` 的函数\n-   `Supplier<T>` - 提供 `T` 的实例（例如工厂）\n-   `Function<T, R>` - 一个将\
  \ `T` 转换为 `R` 的函数\n-   `Consumer<T>` - 对对象执行的操作\n-   `Predicate<T>` - 对象的布尔值属性\n\
  \n# 第 5 章：JAVA 中的注解\n\n关于非编程逻辑本身成员的类所需的所有数据都由注解提供。注解对它们标记的代码没有直接影响。注解提供的信息或数据可以被其他组件使用。\n\
  \n注解仅存在于开发阶段（`RetentionPolicy.SOURCE`），并且只能在运行时保留（`RetentionPolicy.RUNTIME`）。\n\n\
  ## @Override 注解和重写方法\n\n任何扩展另一个类的都会自动从父类继承该类的方法。要成功更改这些方法，只能重写它们。这意味着它只能重新声明这些方法。除非类本身被定义为抽象类，否则此过程是绝对必要的。\n\
  \n可以添加到此类方法中的一个注解是 `@Override` 注解。这是因为 Java 编译器用它来检查标记的方法是否实际上重写了扩展类或接口中的方法。\n\n\
  你始终可以在子类的源码中使用相同的方法签名来重写方法。同时，你也可以利用 `@Override` 注解向源代码的阅读者和 Java 编译器表明你打算重写一个方法。\n\
  \n关于如何重写父类方法的示例，请看下面的代码：\n\n```java\npackage com.vogella.javaintro.base;\n\nclass\
  \ MyBaseClass {\n    public void hello() {\n        System.out.println(\"Hello from\
  \ MyBaseClass\");\n    }\n}\n\npackage com.vogella.javaintro.base;\n\nclass MyExtensionClass2\
  \ extends MyBaseClass {\n    @Override\n    public void hello() {\n        System.out.println(\"\
  Hello ExtensionClass2\");\n    }\n}\n```\n\n使用 `@Override` 注解始终是一个良好的做法。这是因为确保了\
  \ Java 编译器会验证你是否真的重写了方法。\n\n## @Deprecated 注解\n\n该注解可以用于类、构造函数、方法或字段，并表示该元素已过时，不应使用。\n\
  \n## 类型注解\n\n根据 Java 规定，注解可以放在任何类型上。下面是一个示例：\n\n```java\n@NonNull String name;\n\
  \nList<@NonNull String> names;\n\nclass UnmodifiableList<T> {}\n\nemail = (@Email\
  \ String) input;\n\nnew @Information Object();\n\nvoid doSomething() throws @ImportantMe\
  \ Exception { }\n```# 第 6 章：变量与方法\n\n## 变量\n\nJava 程序通过变量在运行时存储值。变量分为基本类型或引用。基本类型包含值，而引用类型包含对象的指针（或引用）。这意味着在比较引用变量时，实际上是在比较它们是否指向同一个对象。\n\
  \n利用 `object1.equals(object2)` 方法调用来识别对象是否相同相同。\n\n## 实例变量\n\n实例变量是与类的实例（或对象）关联的变量。访问适用于这些对象。所有实例变量都可以被标记为\
  \ `transient` 或 `final`，并具有任何访问控制。而且，一旦实例变量被标记为 `final`，在赋值后就不能再更改。\n\n## 局部变量\n\
  \n局部（或栈）变量声明是那些无法访问修饰符的。所有局部变量都没有默认值，因此在使用它们之前必须初始化。事实上，局部变量唯一的可用修饰符是 `final`。该修饰符定义了在第一次赋值后变量无法更改。\n\
  \n## 方法\n\n具有返回值和参数的代码块被称为方法。方法始终可以在对象上调用。\n\n```java\npackage com.vogella.javaintro.base;\n\
  \npublic class MyMethodExample {\n    void tester(String s) {\n        System.out.println(\"\
  Hello World\");\n    }\n}\n```\n\n可以使用变长参数来声明方法。发生这种情况时，方法声明了一个接受从零到多个参数的参数（语法：`type\
  \ ... name`）。一个方法只能有一个变长参数，且该参数必须是方法的最后一个参数。\n\n重写父类方法：\n\n\n\n\n\n有一条规则规定方法必须具有相同的参数和完全相同的返回参数。它还规定返回参数必须相同。\n\
  \n## 方法重载 (Overload methods)\n\n任何同名但参数不同的方法都称为重载方法。返回类型永远不能用于重载方法。\n\n## Main 方法\n\
  \n有一个签名为 `public static` 方法可以用于启动 Java 应用程序（查看下文签名）。这个 `public static` 方法通常被称为 main\
  \ 方法。\n\n```java\npublic static void main(String[] args) {}\n```\n\n## 构造函数\n\n\
  每个类都包含一个或两个构造函数，这些函数由 Java 运行时根据类的定义来创建对象。除了它们使用类名且没有返回类型外，构造函数的声明看起来类似于方法声明。\n\n\
  每个类可以有多个具有不同参数的构造函数。在下面的示例中，类的构造函数期望一个参数：\n\n```java\npackage com.vogella.javaintro.base;\n\
  \npublic class MyConstructorExample2 {\n    String s;\n    public MyConstructorExample2(String\
  \ s) {\n        this.s = s;\n    }\n}\n```\n\n每个类必须至少定义一个构造函数。如果在 Java 源文件中没有定义式构造函数，编译器将隐式地添加一个。在类被子类的任何情况下，父类的构造函数始终会被隐式地调用。\n\
  \n在下面的示例中，无参数构造函数的定义（也通俗称为空构造函数）不是必须的。如果没有指定，编译器始终会创建一个。\n\n```java\npackage com.vogella.javaintro.base;\n\
  \npublic class MyConstructorExample {\n    // 无必要：如果省略，将由编译器创建\n    public MyConstructorExample()\
  \ {\n    }\n}\n```\n\n要创建一个构造函数，命名规范如下：`classname (Parameter p1, …) { }`。所有对象都是根据构造函数创建的。在对对象进行任何操作之前，构造方法是第一个被调用的语句。\n\
  \n## 第 7 章：修饰符 (MODIFI)\n\n### 访问修饰符 (Access modifiers)\n\n在 Java 中，你可以找到三种访问修饰符：`private`、`protected`\
  \ 和 `public`。你还可以找到四种访问级别。它们是：`private`、`default`、`public` 和 `protected`。所有这些级别定义了相应元素对其他组件的可见性。声明为\
  \ `public` 的示例是类或方法被其他 Java 对象自由地创建或调用。而声明为 `private` 的示例可能是某个方法只能在声明它的类内部被访问。\n\
  \n`default` 和 `protected` 访问级别非常相似。`default` 类只能通过同一个包访问，而 `protected` 类可以从包内以及包外部的子类访问。\n\
  \n为了说明它们的可见性，请看下表：\n\n### 访问级别表\n\n| 修饰符 | 类 | 包 | 子类 | 世界上 |\n| :--- | :--- | :---\
  \ | :--- | :--- |\n| `private` | Y | N | N | N |\n| 无修饰符 | Y | Y | N | N |\n| `protected`\
  \ | Y | Y | Y | N |\n| `public` | Y | Y | Y | Y |\n\n### 其他修饰符 (Other modifiers)\n\
  \n- **Final 方法 (Final methods)**：这些方法在子类中不能被重写。\n- **抽象方法 (Abstract method)**：这些方法没有方法体。\n\
  - **同步方法 (Synchronized method)**：线程安全，可以有任何访问控制，并且可以是 final 的。\n- **原生方法 (Native\
  \ methods)**：这些是完全取决于平台的代码。它们仅适用于方法。\n- **Strictfp**：这些是方法或类。\n\n# 第 8 章：导入语句及更多\
  \ Java 语言结构\n\n### 导入语句的使用 (Usage of import statements)\n\n要访问 Java 类，你始终必须使用它的全限定名。这意味着包名加上一个点\
  \ `.`，然后是类名。导入语句也可以添加到你的类文件中。这些语句允许你在代码中不使用包限定符的情况下使用相关的类。\n\n### 静态导入 (Static imports)\n\
  \n在由 `static imports` 允许的情况下，另一个类的 `public static` 成员（无论是方法还是字段）只能在 Java 代码中不通过类引用来使用。此功能提供了一种类型安全的机制，将常量包含在代码中。这提高了代码的可读性，同时允许\
  \ Java API 设计师编写简洁的 API。\n\n## 更多 Java 语言结构\n\n### 类变量和类方法 (Class variables and\
  \ class methods)\n\n类变量和类方法与类相关，而不是与类的实例（如对象）相关。你可以使用点 (`.`) 和 `classname` 后跟类变量名或类方法来引用这些元素。\n\
  \n`static` 关键字用于声明类变量和类方法。类变量也被称为 `static fields` 或 `static variables`（静态变量），而类方法也被称为\
  \ `static methods`。使用静态字段的一个经典例子是以下语句中的 `println`：`System.out.println(\"Hello World\"\
  )`。其中 `out` 是一个静态字段，类型为 `PrintStream` 的对象，你在这个对象上调用了 `println()` 方法。\n\n如果你定义了一个静态变量，Java\
  \ 运行时环境无论存在多少实例（对象），都会为类关联一个类变量。因此，静态变量可以被视为全局变量。\n\n以下代码演示了静态字段的使用：\n\n```java\n\
  package com.vogella.javaintro.base;\n\npublic class MyStaticExample {\n    static\
  \ String PLACEHOLDER = \"TEST\";\n    static void test() {\n        System.out.println(\"\
  Hello\");\n    }\n}\n```\n\n```java\npackage com.vogella.javaintro.base;\n\npublic\
  \ class Tester {\n    public static void main(String[] args) {\n        System.out.println(MyStaticExample.PLACEHOLDER);\n\
  \        MyStaticExample.test();\n    }\n}\n```\n\n如果一个变量应该被定义为常量，用 `static` 和 `final`\
  \ 声明它。`static` 方法在没有实例的情况下运行，它无法直接访问静态变量。\n\n### 抽象类和方法 (Abstract class and methods)\n\
  \n类和方法可以被声明为 `abstract`。`abstract` 类不能直接实例化。如果一个类至少有一个只包含声明没有实现的方法，那么这个类就是抽象的，不能实例化。子类类需要定义这些方法，除非它们也被声明为\
  \ `abstract`。\n\n如果一个类包含一个抽象方法，它也需要用 `abstract` 关键字定义。以下示例显示了一个抽象类：\n\n```java\n\
  package com.vogella.javaintro.base;\n\npublic abstract class MyAbstractClass {\n\
  \    abstract double returnDouble();\n}\n```\n\n## 第 9 章：速查表 (CHEATETS)\n\n在 Java\
  \ 开发期间，你需要执行某些操作，例如创建局部变量。以下可以作为此类任务的参考，告诉你如何操作。\n\n### 类操作 (Working with classes)\n\
  \n在编写 Java 时，你必须创建多个类、方法、实例变量。以下使用了包 test。\n\n| 操作内容 | 如何操作 |\n| :--- | :--- |\n\
  | 创建一个名为 `MyNewClass` 的类。 | `package test;public class MyNewClass {}` |\n| 在 `MyNewClass`\
