    \ :\n                name : common-values\n```\n\n在命令行中运行以下命令：\n\n```bash\nkubectl\
    \ apply -f front-deployment4.yaml\n```\n\n你应该得到类似下方的输出：\n\n```\n> kubectl apply\
    \ -f front-deployment4.yaml\ndeployment.apps/front configured\n```\n\n刷新浏览器中的\
    \ `http://localhost:8080/files` 页面。你的浏览器应该显示一个与该所示的页面：\n\n![](img/file81.jpg)\n\
    \n运行以下命令：\n\n```bash\nkubectl delete .\n```\n\n### 15.5 练习 - 创建并使用 Secret\n\n\
    目标：以不同的方式创建并使用 Secret。\n\n为 `learnbook/k8s-front:0.4` 镜像创建一个 Deployment，并使用 `LoadBalancer`\
    \ Service 将其暴露。\n\n在浏览器中访问 `http://localhost:8080/files` URL（它显示了容器中 `/shared`\
    \ 文件夹下所有文件的名称）。不应出现任何文件。\n\n更新 Deployment，使容器将 `ConfigMap` 对象视为其 `/shared` 目录下的文件。\n\
    \n刷新浏览器中的 `http://localhost:8080/files` 页面。应该显示来自 `ConfigMap` 的三个条目（注意只显示了文件的名称）。\n\
    \n在浏览器中访问 `http://localhost:8080/details` URL（它显示了容器看到的所有环境变量名称）。请注意，没有名为 `message`、`config`\
    \ 或 `magicNumber` 的项。\n\n更新 Deployment，使容器将 `ConfigMap` 对象中的所有项视为环境变量。\n\n刷新浏览器中的\
    \ `http://localhost:8080/details` 页面。应该显示来自 `ConfigMap` 的三个条目。\n\n删除所有创建的资源。\n\
    \nSecrets 与 `ConfigMap` 非常相似，但为存储需要安全的信息提供了额外功能。\n\n使用 `stringData` 创建 Secret：\n\
    \n```yaml\napiVersion : v1\nkind : Secret\nmetadata :\n  name : secret-values\n\
    stringData :\n  key1 : “secret1”\n  key2 : “secret2”\n  message : “secret3”\n\
    ```\n\n在 Pod 中使用 Secret 与使用 `ConfigMap` 完全相同；你可以作为环境变量或文件使用。\n\n作为文件使用：\n\n```yaml\n\
    apiVersion : apps/v1beta1\nkind : Deployment\nmetadata :\n  name : front\nspec\
    \ :\n  template :\n    metadata :\n      labels :\n        app : front\n    spec\
    \ :\n      volumes :\n        - name : shared\n          secret :\n          \
    \  name : secret-values\n      containers :\n        - name : front\n        \
    \  image : learnbook/k8s-front:0.4\n          volumeMounts :\n            - mountPath\
    \ : /shared\n              name : shared\n```\n\n作为环境变量使用：\n\n```yaml\napiVersion\
    \ : apps/v1beta1\nkind : Deployment\nmetadata :\n  name : front\nspec :\n  template\
    \ :\n    metadata :\n      labels :\n        app : front\n    spec :\n      containers\
    \ :\n        - name : front\n          image : learnbook/k8s-front:0.4\n     \
    \     envFrom :\n            - secretRef :\n                name : secret-values\n\
    ```\n\n作为命名的环境变量使用：\n\n```yaml\napiVersion : apps/v1beta1\nkind : Deployment\n\
    metadata :\n  name : front\nspec :\n  template :\n    metadata :\n      labels\
    \ :\n        app : front\n    spec :\n      containers :\n        - name : front\n\
    \          image : learnbook/k8s-front:0.4\n          env :\n            - name\
    \ : VAR_NAME\n              valueFrom :\n                secretKeyRef :\n    \
    \              name : secret-values\n                  key : key2\n```\n\n"
