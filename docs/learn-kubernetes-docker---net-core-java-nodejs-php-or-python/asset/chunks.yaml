    \ transmitted, 1 packets received, 0% packet loss\nround-trip min/avg/max = 9.735/9.735/9.735\
    \ ms\nSleeping for 5 seconds```\n\n## 12.5 练习 - 观察 Kubernetes 处理失败的 pod\n\n**目标：**\
    \ 检查当 `Pod` 失败时会发生什么。\n\n- 显示 `Pods` 和 `Deployments`。检查是否存在可用的 `pinger` `Pod`\
    \ 实例。\n- 使用以下命令删除 `pinger` `Pod`（删除 `Pod`，不是 `Deployment`）：\n```bash\nkubectl\
    \ delete pod -l app=pinger\n```\n- 显示 `Pods` 和 `Deployments`。检查之前的 `Pod` 正在关闭，并且已经启动了一个新的\
    \ `Pod` 来替换它。\n- 删除 `pinger` `Deployment`。显示 `Pods` 和 `Deployments`。检查所有的 `pinger`\
    \ Pod 是否已删除。\n\n## 12.6 练习解答\n\n打开命令行。\n\n运行以下命令：\n\n```bash\nkubectl get deployments\n\
    kubectl get pods\n```\n\n注意存在一个 `pinger` `Pod` 实例：\n\n```\n> kubectl get deployments\n\
    NAME    READY  UP-TO-DATE  AVAILABLE  AGE\npinger  1/1    1               1  \
    \        15m\n```\n\n```\n> kubectl get pods\nNAME             READY  STATUS \
    \   RESTARTS  AGE\npinger-7489665  1/1    Running   0          15m\n```\n\n运行以下命令：\n\
    \n```bash\nkubectl delete pod -l app=pinger\nkubectl get deployments\nkubectl\
    \ get pods\n```\n\n注意为了替换正在删除的 Pod 而创建的新 `Pod`。这是由于 `Deployment` 那里，确保了 `Pod`\
    \ 持续运行。\n\n运行以下命令：\n\n```bash\nkubectl delete deployment pinger\nkubectl get deployments\n\
    kubectl get pods\n```\n\n注意 `Deployment` 及其所属的 `Pods` 已删除或正在删除过程中。\n\n## 12.7\
    \ 声明式命令\n\n从长远来看，管理 Kubernetes 对象的更好方法是：声明式命令。与其告诉 Kubernetes 要做什么，不如告诉 Kubernetes\
    \ 你期望的状态是什么。这允许 Kubernetes 无论初始状态如何，都能达到预期的状态。这反过来简化了你的部署和维护工作。\n\n例如，假设你告诉 Kubernetes\
    \ 你想要两个 `Pods`。它将采取的行动将取决于你提供命令时以及之后 Kubernetes 集群的实际状态：\n- 如果集群中没有 `Pod`，它将创建两个。\n\
    - 如果集群中有一个这样的 `Pod`，它将创建另一个。\n- 如果集群中有 4 个这样的 `Pod`，它将删除两个。\n- 如果集群中有两个这样的 `Pod`\
    \ 运行的是旧版本的镜像，它们将被新镜像替换。\n- 如果运行其中两个 `Pod` 的任一集群 `Node` 崩溃，相应的 `Pod` 将在另一个 `Node`\
    \ 上创建。\n\n声明式命令有一个缺点：起初它们看起来比命令式命令更复杂。这是因为它们很冗长，因为描述了预期状态中所有非默认的值。但从长远来看你会习惯的，而且把事情显式化本身就是一种良好的实践。\n\
    \n声明式命令带来了许多优势：\n- 对于应用维护，比命令式命令更简单。\n- 易于在 CI/CD 链中使用。\n- 应用良好的实践，如：基础设施即代码和单一事实来源。\n\
    \n给定一个命令式命令，Kubernetes 会采取适当步骤来达到命令所描述的预期状态。\n\n### 运行声明式命令\n\n为了运行声明式命令，常用的方法是创建一个描述预期状态的\
    \ YAML 文件，并将该文件提供给 `kubectl` 命令。\n\n这是一个 YAML 文件示例（稍后将介绍语法）：\n\n`deploy.yaml`\n\
    ```yaml\napiVersion: apps/vbeta1\nkind: Deployment\nmetadata:\n  name: my-front\n\
    spec:\n  replicas: 1\n  template:\n    spec:\n      containers:\n      - name:\
    \ my-front\n        image: my-wordpress:1.0\n        ports:\n        - containerPort:\
    \ 80\n```\n\n这里是让 Kubernetes 集群符合该描述的命令：\n\n```bash\nkubectl apply -f deploy.yaml\n\
    ```\n\n运行该命令后，Kubernetes 创建一个 `Deployment`，进而创建一个 `ReplicaSet`，然后创建一个运行 `my-wordpress:1.0`\
    \ 镜像容器的 `Pod`：\n\n![](img/file47.jpg)\n\n### 要达的状态\n\nKubernetes 将尝试达到 YAML 文件描述的状态，无论集群初始状态如何。这对于在本地机器、测试集群或生产集群上部署应用非常有用：大部分只需要提供相同的\
    \ YAML（以及不同的参数或环境变量，稍后将介绍）。\n\n这意味着扩容或升级应用程序变成了应用 YAML 文件的简单问题。例如，让我们扩容。处理大量的用户，更多的\
    \ Pod 将处理更高的用户量。扩容的另一个优势是你的应用程序变得更具韧性：四个 Pod 中丢失一个并无妨。\n\n所以，让我们扩容。只需更改 YAML 文件中的一个数字并使用与之前相同的命令即可。\n\
    \n```yaml\napiVersion: apps/vbeta1\nkind: Deployment\nmetadata:\n  name: my-front\n\
    spec:\n  replicas: 4\n  template:\n    spec:\n      containers:\n      - name:\
    \ my-front\n        image: my-wordpress:1.0\n        ports:\n        - containerPort:\
    \ 80\n```\n\n```bash\nkubectl apply -f deploy.yaml\n```\n\n![](img/file48.jpg)\n\
    \n"
- fmt: "\nSince there are 4 running Pods of version 1.0 in my cluster, they need to\
    \ be replaced with Pods from version 1.1. Kubernetes will create one new 1.1 Pod,\
    \ and wait to check if the Pod works. In case the Pod doesn’t work, Kubernetes\
    \ stops creating 1.1 Pods and version 1.0 remains available. In case the Pod works,\
    \ Kubernetes deletes one 1.0 Pod and proceeds with a second 1.1 Pod, and so on.\n\
    \n![](media/file49.jpg)\n\nIn short, your application remains stable during updates\
    \ and doesn’t eat up more resources that it ought to; and the best part is that\
    \ all of this is automated by default.\n\nAgain, the declarative commands work\
    \ whatever the starting state. If you `kubectl apply` the previous YAML to an\
    \ empty cluster, it will just create the 4 Pods one by one. This is a very convenient\
    \ feature, because applications are generally deployed more often to a development\
    \ cluster than to a production one. You could define your CI/CD chain to publish\
    \ to a development cluster each time code is pushed, and to a test cluster only\
    \ when a tag is added to the repository or some other manual action is taken;\
    \ that would be done very easily, using exactly the same YAML file and same `kubectl\
    \ apply` except that it would be done more often on the development cluster than\
    \ on the test one.\n\nShould you want to use a single Kubernetes cluster in order\
    \ to deploy both a development and a test version of your application, this is\
    \ also easy: Namespaces can isolate your Kubernetes objects from one another.\
    \ We’ll learn about Namespaces later on.\n\n## Declarative syntax\n\nLet’s have\
    \ a closer look at the YAML file we just applied to the Kubernetes cluster, and\
    \ how you can get help writing it.\n\nThe `kubectl` command can also output the\
    \ necessary YAML so that when you create a declarative YAML file you start from\
    \ an existing file instead of a blank page. All you have to to is add the `--dry-run`\
    \ and `-o yaml` switches to an imperative command.\n\nFor instance, the same `kubectl\
    \ create deployment` command I used earlier would output the following YAML when\
    \ we add the necessary switches:\n\n```bash\nkubectl create deployment hello --image=hello-world\
    \ -dry-run -o yaml\n```\n\n```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n\
    \  creationTimestamp: null\n  labels:\n    app: hello\n  name: hello\nspec:\n\
    \  replicas: 1\n  selector:\n    matchLabels:\n      app: hello\n  strategy: {}\n\
    \  template:\n    metadata:\n      creationTimestamp: null\n      labels:\n  \
    \      app: hello\n    spec:\n      containers:\n      - image: hello-world\n\
    \        name: hello-world\n        resources: {}\nstatus: {}\n```\n\nThat YAML\
    \ is more verbose than what I used for my demos because it includes default values.\
    \ That’s a good thing since we want this as a base template. Another point worth\
    \ noting is that the actual YAML will vary according to the version of the Kubernetes\
    \ cluster you run it against: it is generated using the Kubernetes API, and that\
    \ API varies slightly from one Kubernetes version to another.\n\nIf you prefer\
    \ JSON you can also use it. Both YAML and JSON are formats for a textual representation\
    \ of objects, lists of objects, and object properties. I use YAML in this book\
    \ since this is the format most seen for Kubernetes declarative commands. The\
    \ YAML specification is available on the official site and you can get a quick\
    \ startup from the preview section of the site or that quickstart ..\n\nThere\
    \ are four main properties in the document used to create a deployment (the one\
    \ that we just obtained from the `kubectl` command, or the ones we used earlier\
    \ in the book):\n\n- `apiVersion`: states the Kubernetes API version that the\
    \ following properties use.\n- `kind`: the Kubernetes object we are creating or\
    \ updating. Here, a `Deployment`.\n- `metadata`: data that should be attached\
    \ to the Kubernetes object. It’s used for finding Kubernetes objects for several\
    \ purposes. We used it earlier when creating a selector to see logs (remember\
    \ `kubectl logs -l app=hello`), and it will also be used for Kubernetes objects\
    \ to reference one another.\n- `spec`: describes what the `Deployment` should\
    \ be like:\n  - `template`: describes what the Pods managed by this `Deployment`\
    \ should be like.\n  - `replicas`: number of Pods that this `Deployment` should\
    \ have. This involves creating Pods when this number is increased or a Pod dies,\
    \ or deleting Pods when this number is decreased or that they exist with a different\
    \ template.\n  - `strategy`: states how the `Deployment` should proceed with the\
    \ current Pods in case of a previous version of this `Deployment` should be updated;\
    \ we’ll see more about that in the Update strategies chapter.\n\n## Declarative\
    \ commands\n\nLet’s recapitulate how a Kubernetes cluster is managed with declarative\
    \ commands.\n\nThis is how you create objects:\n\n```bash\nkubectl apply -f deploy.yaml\n\
    ```\n\nThis is how you update objects (same command as above):\n\n```bash\nkubectl\
    \ apply -f deploy.yaml\n```\n\nAnd this is how you completely delete objects:\n\
    \n```bash\nkubectl delete -f deploy.yaml\n```\n\nWhile Kubernetes can be quite\
    \ complex, the simplicity of these commands blatantly illustrates how complex\
    \ operations are made simple by Kubernetes.\n\nIn all of the above commands, you\
    \ can replace the file name with a folder name. In that case, all of the files\
    \ in the folder will be passed through the command. This enables you to write\
    \ each Kubernetes object in a separate file instead of packing them all together.\n\
    \nFor instance, consider the following file (truncated for brevity):\n\n`deploy.yaml`\n\
    ```yaml\napiVersion : apps / v1beta1 kind : Deployment … — apiVersion : v1 kind\
    \ : Service …\n```\n\nThe `--` separator allows for several objects to be described\
    \ in a single YAML file.\n\nIt would be applied with the command:\n\n```bash\n\
    kubectl apply -f deploy.yaml\n```\n\nYou could instead replace it with two files\
    \ in a `k8s` folder:\n\n`k8s/deployment.yaml`\n```yaml\napiVersion : apps / v1beta1\
    \ kind : Deployment …\n```\n\n`k8s/service.yaml`\n```yaml\napiVersion : v1 kind\
    \ : Service …\n```\n\nAnd those files would be applied using a single command:\n\
    \n```bash\nkubectl apply -f ./k8s\n```\n\n## 12.8 Exercise - Create resources\
    \ using declarative commands\n\n**Objective**: get acquainted with creating a\
    \ resource declaratively.\n\n1. In a YAML file, describe a `Deployment` named\
    \ `pinger` that deploys the `learnbook/k8s-pinger:0.6` image with an `app=pinger`\
    \ label.\n2. Use the `kubectl apply` command to create the corresponding `Deployment`\
    \ in the Kubernetes cluster.\n3. Display the Pods and Deployments and check that\
    \ the Deployment and corresponding Pod were created.\n\n## 12.9 Exercise solution\n\
    \nCreate a file named `pinger-deployment.yaml` with the following contents:\n\n\
    ```yaml\napiVersion : apps/v1beta1 kind : Deployment metadata :\n\nname : pinger\
    \ spec :\n\ntemplate :\n\nmetadata :\n\nlabels :\n\napp : pinger\n\nspec :\n\n\
    containers :\n- name : pinger\n  image : learnbook/k8s-pinger:0.6\n```\n\nOpen\
    \ a command-line in the folder where you created the above file.\n\nRun the following\
    \ commands:\n\n```bash\nkubectl apply -f pinger-deployment.yaml\nkubectl get deployment\n\
    kubectl get pods\nkubectl logs -lapp=pinger\n```\n\nYou should get an output similar\
    \ to the following:\n\n```bash\n$ kubectl apply -f pinger-deployment.yaml\ndeployment.apps/pinger\
    \ created\n\n$ kubectl get deployment\nNAME    READY   UP-TO-DATE   AVAILABLE\
    \   AGE\npinger  1/1     1               1           52s\n\n$ kubectl get pods\n\
    NAME        READY   STATUS    RESTARTS AGE\npinger-646  1/1     Running   0  \
    \       92s\n\n$ kubectl logs -lapp=pinger\nround-trip min/avg/max = 12.100/12.100/12.100\
    \ ms\nSleeping for 5 seconds\nPinging at: www.google.com (216.58.209.228): 56\
    \ data bytes\n\n\n## Environment variables\n\nThe containers that run in your\
    \ Pods will often need to be provided environment variables. An environment variable\
    \ can be read from the executable running inside the container; it’s a common\
    \ way to provide extra information like the URL of an API or a connection string\
    \ to a data store.\n\nEnvironment variables may be provided to your Pods using\
    \ the `env` property of the container definition. Here is an example definition\
    \ of a container running with two environment variables:\n\n```yaml\napiVersion\
    \ : apps / v1beta1 kind : Deployment metadata :\n\nname : my - front spec : template\
    \ :\n\nspec :\n\ncontainers :\n```\n"
