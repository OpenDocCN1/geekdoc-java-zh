  trans: "\n当你设置限制（limits）时，Kubernetes 会监控相应 `Pods` 使用的资源，并在实际使用的资源超过你设置的限制时将它们终止。\n\
    \n简而言之，限制（limits）基本上是你允许 `Pod` 使用的 CPU 和内存的最大量。\n\n以下是一个使用限制的示例 `Deployment` 定义：\n\
    \n```yaml\napiVersion: apps/v1beta1\nkind: Deployment\nspec:\n  template:\n  \
    \  spec:\n      containers:\n      - name: front\n        image: learnbook/k8s-front:0.4\n\
    \        resources:\n          limits:\n            cpu: \"200m\"\n          \
    \  memory: \"50Mi\"\n```\n\n实际上，Kubernetes 调度器会对资源进行超额配额（overcommits）：它不会立即终止超出其配额限制的\
    \ `Pods`，而是在总 `Node` 资源匮乏时才这样做。当这种情况发生时，Kubernetes 调度器会首先终止那些超出限制最严重的 `Pods`。\n\
    \n# 13. 暴露服务\n\n## 13.1 服务的需求\n\n既然你已经可以运行 `Pods`，你可能希望它们能够相互通信。这带来了几个问题，`Service`\
    \ 对象将回答这些问题。\n\n### 监听集群外部的连接\n\n当你托管一个服务器时（例如 Web 服务器），你希望来自客户端的入站连接能够到达你的 `Pods`：\n\
    \n![](img/file51.jpg)\n\n你可以通过以下命令来实现，该命令在 `8085` 端口监听来自集群外部的连接，并将其路由到名为 `name`\
    \ 的 `Deployment` 部署在 `8080` 端口的 `Pods`：\n\n```bash\nkubectl port-forward deployment/name\
    \ 8085:8080\n```\n\n然而，这是一个命令式命令，你现在已经知道对于中期维护来说，命令式命令并不是想要的。\n\n我们如何使用声明式命令来描述集群应该监听连接这一事实呢？`Services`\
    \ 回答这个问题。\n\n### 跨 Node 通信\n\n由于 Kubernetes 集群的目标是利用在不同 `Nodes` 上运行容器的优势，你的 `Pods`\
    \ 将分布在不同的 `Nodes` 上。\n\n一项常规任务（特别是在微服务架构中）是像这个简化示例所示的跨 `Nodes` 通信：\n\n![](img/file52.jpg)\n\
    \n我们如何跨 `Nodes` 通信？我们应该保留一个运行中的 `Pods` 列表并对它们进行寻址吗？`Services` 也回答这个问题。\n\n###\
    \ 负载均衡到多个 Pod\n\n为了提供应用程序的高可用性，在工作 `Nodes` 上复制相同的 `Pod` 是一种良好的做法。我们之前看到 `Deployments`\
    \ 如何轻松地做到。但我们如何确保来自客户端的入站连接会被定向到所有的 `Pods`，如下例所示？\n\n![](img/file53.jpg)\n\n再次，答案是使用\
    \ `Services`。\n\n## 13.2 Services\n\n`Services` 是提供上述三个问题答案 Kubernetes 对象。\n\n\
    `Service` 对象监听传入连接并将其路由到使用标签（labels）选择的 `Pods`，如下：\n\n![](img/file54.jpg)\n\n\
    两种广泛使用的 `Service` 类型是 `LoadBalancer` 和 `ClusterIP`。区别在于它们是否允许来自集群外部的连接。让我们详细说明每一种。\n\
    \n### 来自集群外部的连接\n\n在创建 `Service` 时使用 `LoadBalancer` 类型，它将把来自集群外部的请求路由到匹配给定选择器（selector）的\
    \ `Pods`。\n\n这是一个 `LoadBalancer` 服务的示例定义：\n\n```yaml\napiVersion: v1\nkind: Service\n\
    metadata:\n  name: mon-front-service\nspec:\n  type: LoadBalancer\n  ports:\n\
    \    - port: 8081\n      targetPort: 80\n  selector:\n    app: web-app\n```\n\n\
    当你 `kubectl apply` 该定义时，集群会为你的服务分配一个公共 IP。到该 IP 发出的请求将被路由到匹配的 `Pods`，如下所示：\n\n\
    ![](img/file55.jpg)\n\nIP 如何分配取决于你在云端托管集群时选择的 Kubernetes 提供程序，或者你为自托管集群添加的扩展。\n\
    \n让我们部署一个面向 Web 的 应用程序作为示例。`Adminer` 是用 PHP 编写的数据库管理界面，作为名为 `adminer` 的 docker\
    \ 镜像。为了部署它，我使用了以下两个定义：\n\n**adminer-deployment.yaml**\n```yaml\napiVersion: apps/v1\n\
    kind: Deployment\nmetadata:\n  name: adminer\nspec:\n  selector:\n    matchLabels:\n\
    \      app: adminer\n  template:\n    metadata:\n      labels:\n        app: adminer\n\
    \    spec:\n      containers:\n        - name: adminer\n          image: adminer:latest\n\
    \          ports:\n            - containerPort: 8080\n```\n\n**adminer-service.yaml**\n\
    ```yaml\napiVersion: v1\nkind: Service\nmetadata:\n  name: adminer\nspec:\n  type:\
    \ LoadBalancer\n  selector:\n    app: adminer\n  ports:\n    - port: 80\n    \
    \  targetPort: 8080\n```\n\n这两个定义使用以下命令应用，正如你现在知道的那样：\n\n```bash\nkubectl apply\
    \ -f .\n```\n\n第一个定义实际上部署了一个运行 `adminer` 应用程序的容器。第二个定义创建了一个 `Service`，将此应用程序暴露到外部世界。下面的图显示了我们刚刚创建的元素：\n\
    \n![](img/file56.jpg)\n\nIP 的分配取决于你在云托管集群时选择的 Kubernetes 环境：\n\n- 如果在 Docker Desktop\
    \ 上运行，该 `Service` 将通过 `localhost`。\n- 如果在 Minikube 上，通过 `kubectl get service`\
    \ 查看。\n- 如果在 PaaS 集群上运行，`EXTERNAL-IP` 列将显示 IP。\n\n`EXTERNAL-IP` 显示了该 `Service`\
    \ 是否可以访问。\n\n## 13.3 练习 - 将服务暴露到互联网\n\n**目标**：部署一个 Web 应用程序并从互联网访问它。\n\n创建一个带有\
    \ `app=front` 标签的 `Pod`。使用 `LoadBalancer` `Service` 暴露该 `Pod`，它监听 `80` 端口。\n\n\
    打开浏览器并指向 `http://localhost:8080`（或者在 PaaS 中获取公共 URL）。完成后，删除创建的所有资源。\n\n## 13.4\
    \ 练习答案\n\n创建一个名为 `front-deployment.yaml` 的文件，内容如下：\n\n```yaml\napiVersion: apps/v1beta1\n\
    kind: Deployment\nmetadata:\n  name: front\nspec:\n  template:\n    metadata:\n\
    \      labels:\n        app: front\n    spec:\n      containers:\n        - name:\
    \ front\n          image: learnbook/k8s-front:0.4\n```\n\n创建一个名为 `front-service.yaml`\
    \ 的文件，内容如下：\n\n```yaml\napiVersion: v1\nkind: Service\nmetadata:\n  name: front\n\
    spec:\n  type: LoadBalancer\n  ports:\n    - port: 8080\n      targetPort: 80\n\
    \  selector:\n    app: front\n```\n\n在创建上述文件的文件夹中打开终端。运行以下命令：\n\n```bash\nkubectl\
    \ apply -f front-deployment.yaml\nkubectl apply -f front-service.yaml\nkubectl\
    \ get deployment\nkubectl get service\n```\n\n你应该应该得到类似下面的输出：\n\n```text\n> kubectl\
    \ apply -f front-deployment.yaml\ndeployment.apps/front created\n\n> kubectl apply\
    \ -f front-service.yaml\nservice/front created\n\n> kubectl get deployment\nNAME\
    \    READY   UP-TO-DATE   AVAILABLE   AGE\nfront   1/1     1               1 \
    \             9s\n\n> kubectl get service\nNAME    TYPE           CLUSTER-IP \
    \  EXTERNAL-IP   PORT(S)\nfront   LoadBalancer   10.103.108.49  localhost    \
    \  8080:30164/TCP\n```\n\n将浏览器指向返回的 `EXTERNAL-IP`，在此情况下为 `http://localhost:8080`。你的浏览器应该显示以下页面：\n\
    \n![](img/file57.jpg)\n\n运行以下命令：\n\n```bash\nkubectl delete -f .\n```\n"
- fmt: "\nSuppose we want to create the following application, where some auditer\
    \ `Pods` need to make HTTP requests to web-app `Pods`:\n\n![](media/file58.jpg)\n\
    \nNote that such an architecture is representative of a microservices architecture\
    \ where services call other services inside a cluster. It can easily be achieved\
    \ using the following definition of a `ClusterIP` service:\n\n```yaml\napiVersion\
    \ : v1\nkind : Service\nmetadata :\n  name : my-front-service\nspec :\n  type\
    \ : ClusterIP\n  ports :\n    - port : 80\n  selector :\n    app : web-app\n```\n\
    \nThe `my-front-service` name we assign to the `Service` is important: a name\
    \ resolution server inside the Kubernetes cluster ensures that it resolves to\
    \ the actual `Pods` that match the selector defined as part of that `Service`.\
    \ In other words, when an auditer `Pod` queries the `http://my-front-service`\
    \ URL, it actually queries a web-app `Pod`.\n\nRemember the adminer service I\
    \ deployed in order to illustrate a `LoadBalancer` `Service`? It can query a database,\
    \ so I’d like to deploy a MySQL database as another `Pod`. In order for the adminer\
    \ `Pod` to communicate with the MySQL `Pod`, I can use a `Service`. Since that\
    \ `Service` doesn’t need to be accessed from outside the cluster, the `ClusterIP`\
    \ service type is a perfect match. Here is a schema of what I want to achieve:\n\
    \n![](media/file59.jpg)\n\nLet’s deploy the components shown in the schema. For\
    \ the adminer part, I can reuse the exact same two definitions used above:\n\n\
    **adminer-deployment.yaml**\n```yaml\napiVersion : apps/v1\nkind : Deployment\n\
    metadata :\n  name : adminer\nspec :\n  selector :\n    matchLabels :\n      app\
    \ : adminer\ntemplate :\n    metadata :\n      labels :\n        app : adminer\n\
    \    spec :\n      containers :\n        - name : adminer\n          image : adminer:latest\n\
    \          ports :\n            - containerPort : 8080\n```\n\n**adminer-service.yaml**\n\
    ```yaml\napiVersion : v1\nkind : Service\nmetadata :\n  name : adminer\nspec :\n\
    \  type : LoadBalancer\n  selector :\n    app : adminer\n  ports :\n    - port\
    \ : 80\n      targetPort : 8080\n```\n\nNow, let’s add two definitions for the\
    \ MySQL `Pod` and the `Service` that make it available from inside the cluster:\n\
    \n**mysql-deployment.yaml**\n```yaml\napiVersion : apps/v1\nkind : Deployment\n\
    metadata :\n  name : mysql\nspec :\n  selector :\n    matchLabels :\n      app\
    \ : mysql\ntemplate :\n    metadata :\n      labels :\n        app : mysql\n \
    \   spec :\n      containers :\n        - name : mysql\n          image : mysql:5.7\n\
    \          ports :\n            - containerPort : 3306\n          env :\n    \
    \        - name : MYSQL_ROOT_PASSWORD\n              value : “root”\n```\n\nYes,\
    \ that’s a very insecure password. This is a demo. Don’t do this at home.\n\n\
    **mysql-service.yaml**\n```yaml\napiVersion : v1\nkind : Service\nmetadata :\n\
    \  name : mysql\nspec :\n  type : ClusterIP\n  selector :\n    app : mysql\n \
    \ ports :\n    - port : 3306\n      targetPort : 3306\n```\n\nThose four definitions\
    \ are applied to the cluster using the `kubectl apply` command:\n\n```bash\nkubectl\
    \ apply -f .\n```\n\nThe adminer `Pod` can be accessed using a browser thanks\
    \ to the public `LoadBalancer` `Service`, so I can point my browser to `http://localhost`\
    \ (or `http://<public-ip>`) and get the login screen. Since the `mysql` `Service`\
    \ exposes the MySQL `Pod`, it can be reached from the adminer `Pod` using the\
    \ Service name: `mysql`. Which means I can use `mysql` as the address of the MySQL\
    \ Server: `<public-ip>`\n\n![](media/file60.jpg)\n\nAs expected, I can now access\
    \ the MySQL database hosted by the `mysql` `Pod`:\n\n![](media/file61.jpg)\n\n\
    # 13.5 Exercise - Expose an API inside the cluster\n\n**Objective:** deploy an\
    \ API and make it accessible from the internet, then make it accessible to `Pods`\
    \ that run inside the cluster.\n\nYou first need to deploy an API and make sure\
    \ it is accessible from outside the cluster, in order to easily check that it\
    \ is correctly deployed. We want the following application architecture at first:\n\
    \n![](media/file62.jpg)\n\nThe `learnbook/k8s-back:0.2` image is an API that listens\
    \ on port 80. Deploy the `learnbook/k8s-back:0.2` image as a `Pod` named `back`\
    \ that has the `app=back` label. Expose that `Pod` using a `LoadBalancer` `Service`\
    \ that listens on port 8081.\n\nOpen a browser and point it to `http://localhost:8081/v1/currenttime`\
    \ (or the public URL you obtain if running in a PaaS cluster). Make sure you can\
    \ access the API.\n\nYou now need to deploy the front web application and make\
    \ it consume the API using its external address. The expected target application\
    \ architecture will be the following:\n\n![](media/file63.jpg)\n\nDeploy the `learnbook/k8s-front:0.5`\
    \ image as a `Pod` named `front` that has the `app=front` label and the following\
    \ environment variables:\n- `API_EXTERNAL_URL : http://localhost:8081`\n- `API_CLUSTER_URL\
    \ : http://back-inside`\n\nNote that the `API_EXTERNAL_URL` variable enables the\
    \ front `Pod` to know which URL it should use to call the API. For now, the `API_CLUSTER_URL`\
    \ variable does not match any endpoint; it will be used later in the exercise.\n\
    \nExpose the front `Pod` using a `LoadBalancer` `Service` that listens on port\
    \ 8080.\n\nOpen a browser and point it to `http://localhost:8080` (or the public\
    \ URL you obtain if running in a PaaS cluster). Make sure you can access the web\
    \ application. As of now, the application main page should display values in its.\n\
    \nAs a last step, we want the front `Pod` to call the API using its internal address,\
    \ not the public address. That’s why we provided the `API_CLUSTER_URL` variable.\
    \ We now want to obtain the following architecture:\n\n![](media/file64.jpg)\n\
    \nExpose the back `Pod` using a `ClusterIP` `Service` named `back-inside` that\
    \ listens on port 80.\n\nOpen a browser and point it to `http://localhost:8080`\
    \ (or the public URL you obtain if running in a PaaS cluster). Make that the web\
    \ application main page now displays values in both its “outside cluster” and\
    \ “inside cluster” zones. Once done, delete all resources created during that\
    \ exercise.\n\n# 13.6 Exercise solution\n\nCreate a file named `back-deployment.yaml`\
    \ with the following contents:\n\n```yaml\napiVersion : apps/v1\nkind : Deployment\n\
    metadata :\n  name : back\nspec :\n  template :\n    metadata :\n      labels\
    \ :\n        app : back\n    spec :\n      containers :\n        - name : back\n\
    \          image : learnbook/k8s-back:0.2\n```\n\nCreate a file named `back-service-outside.yaml`\
    \ with the following contents:\n\n```yaml\napiVersion : v1\nkind : Service\nmetadata\
    \ :\n  name : back-outside\nspec :\n  type : LoadBalancer\n  selector :\n    app\
    \ : back\n  ports :\n    - port : 8081\n      targetPort : 80\n```\n\nOpen a command-line\
    \ in the folder where you created the above files. Run the following commands:\n\
    \n```bash\nkubectl apply -f back-deployment.yaml\nkubectl apply -f back-service-outside.yaml\n\
    kubectl get deployment\nkubectl get service\n```\n\nYou should get an output similar\
    \ to the following:\n\n```text\n> kubectl apply -f back-deployment.yaml\ndeployment.apps/back\
    \ created\n\n> kubectl apply -f back-service-outside.yaml\nservice/back-outside\
    \ created\n\n> kubectl get deployment\nNAME  READY   UP-TO-DATE   AVAILABLE  \
    \ AGE\nback   1/1     1            1              55s\n\n> kubectl get service\n\
    NAME           TYPE           EXTERNAL-IP   PORT(S)\nback-outside  LoadBalancer\
    \   localhost      8081:31388/TCP\n```\n\nPoint your browser to the `EXTERNAL-IP`\
    \ returned plus `/v1/currenttime in that case `http://localhost:8081/v1/currenttime`.\
    \ Your browser should display the resulting JSON:\n\n![](media/file66.jpg)\n\n\
    Create a file named `front-deployment.yaml` with the following contents:\n\n```yaml\n\
    apiVersion : apps/v1beta1\nkind : Deployment\nmetadata :\n  name : front\nspec\
    \ :\n  template :\n    metadata :\n      labels :\n        app : front\n    spec\
    \ :\n      containers :\n        - name : front\n          image : learnbook/k8s-front:0.5\n\
    \          env :\n            - name : API_EXTERNAL_URL\n              value :\
    \ “http://localhost:8081”\n            - name : API_CLUSTER_URL\n            \
    \  value : “http://back-inside”\n```\n\nCreate a file named `front-service.yaml`\
    \ with the following contents (that one is the same as in the previous exercise):\n\
    \n```yaml\napiVersion : v1\nkind : Service\nmetadata :\n  name : front\nspec :\n\
    \  type : LoadBalancer\n  selector :\n    app : front\n  ports :\n    - port :\
    \ 8080\n      targetPort : 80\n```\n"
