    我们可以看到 NGINX 接收到的浏览器 HTTP 请求轨迹：


    ![](img/file24.jpg)


    NGINX 容器继续运行并在端口 `8085` 上处理传入的请求。我可以通过 `docker ps` 命令看到它正在运行。让我们把它关掉，以便让我的机器不再有未使用的容器：


    ```bash

    docker stop 8451

    docker rm 8451

    ```


    ## 总结


    你注意到了吗？我们现在等同于获得了一台全新的服务器，在上面安装任何我们需要的软件，并随时随地将其丢弃。


    我特别喜欢容器的一点是，它们允许我使用任何软件而不会污染我的机器。通常情况下，在你的机器上尝试新软件之前你会犹豫不决，因为这意味着要安装几个依赖项，这些依赖项可能会与现有软件冲突，而且如果你改变主意并卸载主软件，这些依赖项仍会遗留。得益于容器，我甚至可以尝试大型服务器软件而不污染我的机器。


    让我运行一个 Jenkins 服务器来证明这一点。Jenkins 是一个用 Java 编写的完整持续集成服务器。得益于 Docker，我不需要在机器上安装
    Java 或任何依赖项就可以运行 Jenkins 服务器。Jenkins 默认在端口 `8080` 上监听，所以我只需要输入：


    ```bash

    docker run -p 8088:8080 jenkins

    ```


    注意，我可以添加 `-d` 选项，因为这是一个长时间运行的进程。然而，我在这里没有使用它，因为我想直接看到详细的输出。对于实际部署，我将使用 `-d` 选项，并在需要时使用
    `docker logs` 命令检查输出。


    然后，我可以将浏览器指向 `http://localhost:8088` 并完成设置：


    ![](img/file25.jpg)


    我得到了一个功能完整的 Jenkins：


    ![](img/file26.jpg)


    如果我决定不再继续 Jenkins 并尝试另一个持续集成服务器，我只需运行 `docker stop` 和 `docker rm` 命令即可。我也可以通过通过使用另一个端口再次执行
    `docker run` 命令来运行两个独立的 Jenkins 服务器。


    这种极低资源成本的隔离性和易用性是容器的巨大优势。现在你已经看到了在单台开发人员机器上管理服务器软件变得多么简单，想象一下这在服务器机器上将有多强大。得益于容器，DevOps
    中的运维（Ops）部分变得顺畅无比。


    在使用此类镜像时，你可能会好奇数据存储在哪里。Docker 使用卷（volumes）来实现这一点，我们将在本章节后面的部分介绍卷。此外，可能需要数据库来存储数据，那些也可以运行在容器中。目前，不要担心这些，因为我们需要先学习其他内容。


    ## 5.6 练习题 - 运行服务器容器


    在容器中运行 Nextcloud 服务器。你需要使用的镜像是 `nextcloud`，它默认在端口 `80` 上监听。


    确保你可以使用浏览器访问 Nextcloud 实例。


    完成后，停止并删除容器。检查浏览器中是否已无法访问 Nextcloud 实例。


    关于 Nextcloud 容器的更多信息可以从此处找到 。


    ## 5.7 练习题答案


    打开命令行。


    运行以下命令：


    ```bash

    docker run -d -p 8086:80 nextcloud

    ```


    注意显示的容器 ID 的开头部分。


    打开浏览器并指向 `http://localhost:8086`


    你应该能看到提示你创建账户的登录页面。输入你想要的用户名和密码，然后点击 Finish（完成）。


    你应该能看到 Nextcloud 首页。


    切换回命令行。


    运行以下命令：


    ```bash

    docker stop <id>

    docker rm <id>

    ```


    关闭浏览器。


    ## 5.8 使用卷


    在使用此类镜像时，你可能会好奇数据存储在哪里。Docker 使用卷（volumes）来实现这一点，我们将在本章节后面的部分介绍卷。此外，可能需要数据库来存储数据，那些也可以运行在容器中。目前，不要担心这些，因为我们需要先学习其他内容。


    容器是瞬态的，这意味着任何写入其内部的数据在容器停止时都会丢失。为了持久化数据，我们使用卷。卷允许我们将容器内部的目录映射到宿主机上的目录。这确保了即使容器被删除，数据依然存在。


    我们使用 `-v` 选项来映射卷。例如：


    ```bash

    docker run -v /host/dir:/container/dir image

    ```


    在这个示例中，`/host/dir` 是主机上的路径，而 `/container/dir` 是容器内的路径。我们还可以使用命名卷：


    ```bash

    docker run -v volume_name:/container/dir image

    ```


    命名卷由 Docker 管理，比绑定挂载（bind mounts）更易用。


    ## 5.9 镜像从哪里来？


    每个容器都是从镜像创建的。你向 `docker run` 命令提供镜像名称。Docker 首先在本地查找镜像，如果存在则使用它。如果镜像不存在，则将从注册表（registry）下载。


    ![](img/file27.png)


    你可以使用以下命令列出本地镜像：


    ```bash

    docker images

    ```


    当镜像发布到注册表时，它的名称必须是：`repository_name/name:tag`


    `tag` 是可选的。如果缺失，它被视为 `latest`。`repository_name` 可能是注册表的 DNS 或像 Docker Hub 这样的注册表名称。我们很快就会看到更多关于
    Docker Hub 和私有仓库的内容。我们现在使用的所有镜像都是从 Docker Hub 下载的，因为它们不是 DNS 名称。


    例如，可以在这里找到 Jenkins 镜像 。


    虽然 `docker run` 命令会自动下载镜像，但你可能想手动触发下载。你可以直接使用 `docker pull` 命令。`pull` 命令将强制下载镜像，无论其是否已经存在。使用
    `pull` 命令的相关场景包括：


    - 你预计运行容器的机器在运行时无法访问注册表（例如没有互联网连接）；

    - 你想确保拥有标记为 `latest` 的镜像的最新版本。


    ## 6. 创建 Docker 镜像


    正如我们之前看到的，容器是从镜像创建的。到目前，我们一直在使用他人创建的镜像。现在是时候学习创建自己的镜像了。在我们的镜像中，我们可以放入程序及其依赖项，这样就可以从这些镜像创建许多容器并长期运行。


    ### 6.1 创建简单的镜像


    ![](img/file28.png)


    Docker 镜像是通过 `docker build` 命令和 `Dockerfile` 文件创建的。`Dockerfile` 文件包含了说明如何构建镜像的指令。


    `Dockerfile` 文件可以有任何名称。命名为 `Dockerfile` 可以让其他人看到项目中的该文件时更容易理解其用途，并且意味着我们在使用 `docker
    build` 命令时不需要指定文件名。


    我想创建一个基础镜像，该容器在运行时显示“hello world”消息。

    '
- fmt: "\nFor this, I create a file named `Dockerfile` that describes how my image\
    \ should be built. A `Dockerfile` file always begins with a `FROM` instruction\
    \ because an image is based on another base image. This is a powerful feature\
    \ since it allows you to extend images that may already be complex.\n\nFor my\
    \ simple text output need, I may use a Debian Linux image. Here’s my `Dockerfile`\
    \ file:\n\n```dockerfile\nFROM debian:8\n```\n\nThis is not enough. I really get\
    \ a Debian Linux basis but I do not run any command that could display “hello\
    \ world”. This can be achieved using the `CMD` instruction. The `CMD` instruction\
    \ states which executable is ran when a container is created using your image,\
    \ and provides optional arguments.\n\nHere’s an improved `Dockerfile` file that\
    \ creates a Debian Linux-based image and instructs it to greet our users when\
    \ a container spawns:\n\n```Dockerfile\nDockerfile\nFROM debian:8\nCMD [\"echo\"\
    , \"Hello world\"]\n```\n\nNote that the program to be ran and its arguments are\
    \ provided as a JSON array of strings.\n\nIn order to create an image from my\
    \ `Dockerfile` file, I need to run the `docker build` command. So I type the following\
    \ command in my terminal, in the folder where the `Dockerfile` file lives:\n\n\
    ```bash\ndocker build -t hello .\n```\n\nThe `-t` switch is used in front of the\
    \ desired image. Indeed, an image may be created without a name (it would have\
    \ only a generated unique ID) so it is an optional parameter on the `docker build`\
    \ command.\n\nNote the dot at the end of the command above. It states which path\
    \ is used as the build context (more about that later), and where the `Dockerfile`\
    \ is expected to be found. Should my `Dockerfile` have another name or live elsewhere,\
    \ I can add a `-f` switch in order to provide the file path.\n\nThe `docker build`\
    \ command just created an image named `hello`. That image is stored locally on\
    \ my computer, and I can run it as I would run any other image:\n\n```bash\ndocker\
    \ run --rm hello\n```\n\nAs expected, the `docker run` command above simply prints\
    \ the message:\n\n![](media/file29.png)\n\nFrom there, you may want to publish\
    \ your image for others to run containers based on it. We’ll see how to do that\
    \ in the Publish Docker images chapter but for now I want to tell you more about\
    \ creating images.\n\nJust to make things crystal clear, here’s what I did:\n\n\
    - create an image:\n- create a file named `Dockerfile`\n- run a `docker build`\
    \ command\n- run a container from the image created.\n\nI’d like to insist again\
    \ on what this means: running a container is the virtual equivalent of starting\
    \ a brand new machine then trashing it. I mean, in order to print that “Hello\
    \ world” message we virtually got a new computer, had it execute an `echo` command,\
    \ then trashed it. Docker makes fire-and-forget computing cheap. Of course, this\
    \ is complete overkill for such a simple purpose, but it will remain true even\
    \ when we install frameworks or move files around inside our containers: it’s\
    \ a fantastic feature and most of your Docker power will come when you understand\
    \ how easily you can create and trash isolated virtual computers.\n\n## 6.2 Creating\
    \ an image including files\n\nThe image we just created didn’t need anything more\
    \ than what the base image already contained, which is why our `Dockerfile` file\
    \ was so simple. In a real world scenario however I’m very likely to want files\
    \ to be part of an image I create.\n\nSuppose I have a file named `index.html`\
    \ on my disk with the following contents:\n\n```html\nindex.html\n<html>\n<body>\n\
    \  <h1>Hello !</h1>\n  <div>I’m hosted by a container.</div>\n</body>\n</html>\n\
    ```\n\nI’d like to create an image that includes a web server that will serve\
    \ this page over HTTP. NGINX is a good candidate. I could keep using the debian\
    \ base image and add instructions to my `Dockerfile` file that install NGINX,\
    \ but it’s easier to base my work on images that were already configured and tested.\
    \ The Docker Hub contains an NGINX image where NGINX was already installed with\
    \ a configuration that serves files found in the `/usr/share/nginx/html` directory.\n\
    \nI create the following `Dockerfile` file in the same folder as the HTML file:\n\
    \n```Dockerfile\nFROM nginx:1.15\nCOPY index.html /usr/share/nginx/html\n```\n\
    \nApart from the `nginx` base image, you can see a `COPY` instruction. Its first\
    \ parameter is the file to be copied from the build context and second is the\
    \ destination directory inside the image.\n\nThe build context is basically the\
    \ directory you provide to the `docker build` command. Its contents are available\
    \ for `COPY` instructions to use, but only during the image build process. That\
    \ means it’s available only for the instructions in the `Dockerfile` file, and\
    \ files from it won’t be part of the build image (and containers that you’ll spawn\
    \ from that image) unless you use the `COPY` instruction. Which is why we have\
    \ a `COPY` instruction: we want the `index.html` file to be part of the `/usr/share/nginx/html`\
    \ directory inside the image we create.\n\nYou may have noticed that this time\
    \ the `Dockerfile` file contains no `CMD` instruction. Remember that the `CMD`\
    \ instruction states which executable should be ran when a container is created\
    \ from my image, so it’s weird that I don’t include a `CMD` instruction that runs\
    \ an NGINX server. Right. The reason why I didn’t include a `CMD` instruction\
    \ is because the base `nginx:1.15` image already contains such a `CMD` instruction\
    \ to run the NGINX server, so it’s part of my image and I don’t need to include\
    \ my own `CMD` instruction as long as I don’t want to run another executable on\
    \ container startup.\n\nBack to creating our HTTP server image, I open a command\
    \ line inside the folder where my `index.html` and `Dockerfile` files are, and\
    \ run the following commands:\n\n```Dockerfile\nDockerfile\n```\n\n```bash\ndocker\
    \ build -t webserver .\ndocker run --rm -it -p 8082:80 webserver\n```\n\nThose\
    \ commands build a `webserver` from the `Dockerfile` instructions, then start\
    \ a container that listens to my machine’s 80 port. I can start a browser and\
    \ point it to `http://localhost:8082`. That displays the HTML file contents since\
    \ they are served by the running container:\n\nIn the command-line I can see a\
    \ log from NGINX that proves it received the HTTP request from my browser:\n\n\
    ```\n172.17.0.1 - - [.../2019:21:46 +0000] \"GET / HTTP/1.1\" 304 0 \"-\" \"-\"\
    \n```\n\nWhen running my container I added the `--rm` and `-it` switches simply\
    \ for demo purposes. In real life that server container would be long running\
    \ so I’d run it without those switches. Here’s why I used the switches:\n\n- `-it`\
    \ allows me to stop the container using Ctrl-C from the command-line;\n- `--rm`\
    \ ensures that the container is deleted once it has stopped.\n\n## 6.3 Images\
    \ are created locally\n\nWhen I run the `docker build` command in order to create\
    \ an image from a `Dockerfile`, the resulting image is stored locally on the computer\
    \ where the `docker build` command is ran.\n\nThis allows me to run as many containers\
    \ as I want from the locally created image, but chances are that I want other\
    \ computers to be able to run containers from the image I created. We’ll learn\
    \ how to do that in the next chapter.\n\nI can see the images available locally\
    \ on my computer by running the following command:\n\n```bash\ndocker image ls\n\
    ```\n\nTaking into account the images I built earlier, I can see something along\
    \ those lines:\n\nHaving the images readily available locally makes it fast to\
    \ run a container from them. However, there will be a time when some images are\
    \ useless. I can remove them from my local machine using the `docker rmi` command\
    \ and providing it the image name or image ID.\n\nFor instance, I could remove\
    \ the `webserver:latest` image using any of the following two commands:\n\n```bash\n\
    docker rmi c067edac5ec1\ndocker rmi webserver:latest\n```\n\n## 6.4 Exercise -\
    \ Build an image and run it\n\nCreate a file named `compute.js` with the following\
    \ code that computes and displays the area of a disk using JavaScript:\n\n```javascript\n\
    var radius = 2.0 ; var area = Math.pow(radius, 2) * Math.PI ; console.log(\n \
    \ `Area of a ${radius} cm circle:   ${area} cm²`\n);\n```\n"
  raw: 'For this, I create a file named Dockerfile that describes how my image should
    be built. A Dockerfile file always begins with a FROM instruction because an image
    is based on another base image. This is a powerful feature since it allows you
    to extend images that may already be complex.


    For my simple text output need, I may use a Debian Linux image. Here’s my Dockerfile
    file:


    FROM debian:8


    This is not enough. I really get a Debian Linux basis but I do not run any command
    that could display “hello world”. This can be achieved using the CMD instruction.
    The CMD instruction states which executable is ran when a container is created
    using your image, and provides optional arguments.


    Here’s an improved Dockerfile file that creates a Debian Linux-based image and
    instructs it to greet our users when a container spawns:


    Dockerfile


    FROM debian:8


    CMD [“echo”, “Hello world”]


    Note that the program to be ran and its arguments are provided as a JSON array
    of strings.


    In order to create an image from my Dockerfile file, I need to run the docker
    build command. So I type the following command in my terminal, in the folder where
    the Dockerfile file lives:


    docker build -t hello .


    The -t switch is used in front of the desired image. Indeed, an image may be created
    without a name (it would have only a generated unique ID) so it is an optional
    parameter on the docker build command.


    Note the dot at the end of the command above. It states which path is used as
    the build context (more about that later), and where the Dockerfile is expected
    to be found. Should my Dockerfile have another name or live elsewhere, I can add
    a -f switch in order to provide the file path.


    The docker build command just created an image named hello . That image is stored
    locally on my computer , and I can run it as I would run any other image:


    docker run –rm hello


    As expected, the docker run command above simply prints the message:


    ![](media/file29.png)


    From there, you may want to publish your image for others to run containers based
    on it. We’ll see how to do that in the Publish Docker images chapter but for now
    I want to tell you more about creating images.


    Just to make things crystal clear, here’s what I did:


    create an image:


    create a file named Dockerfile


    run a docker build command


    run a container from the image created.


    I’d like to insist again on what this means: running a container is the virtual
    equivalent of starting a brand new machine then trashing it. I mean, in order
    to print that “Hello world” message we virtually got a new computer, had it execute
    an echo command, then trashed it. Docker makes fire-and-forget computing cheap.
    Of course, this is complete overkill for such a simple purpose, but it will remain
    true even when we install frameworks or move files around inside our containers:
    it’s a fantastic feature and most of your Docker power will come when you understand
    how easily you can create and trash isolated virtual computers.


    6.2 Creating an image including files


    The image we just created didn’t need anything more than what the base image already
    contained, which is why our Dockerfile file was so simple. In a real world scenario
    however I’m very likely to want files to be part of an image I create.


    Suppose I have a file named index.html on my disk with the following contents:


    index.html


    < html >


    < body >


    < h1 > Hello ! </ h1 >


    < div > I’m hosted by a container. </ div >


    </ body > </ html >


    I’d like to create an image that includes a web server that will serve this page
    over HTTP. NGINX is a good candidate. I could keep using the debian base image
    and add instructions to my Dockerfile file that install NGINX, but it’s easier
    to base my work on images that were already configured and tested. The Docker
    Hub contains an NGINX image where NGINX was already installed with a configuration
    that serves files found in the /usr/share/nginx/html directory.


    I create the following Dockerfile file in the same folder as the HTML file:


    Dockerfile


    FROM nginx:1.15


    COPY index.html /usr/share/nginx/html


    Apart from the nginx base image, you can see a COPY instruction. Its first parameter
    is the file to be copied from the build context and second is the destination
    directory inside the image.


    The build context is basically the directory you provide to the docker build command.
    Its contents are available for COPY instructions to use, but only during the image
    build process. That means it’s available only for the instructions in the Dockerfile
    file, and files from it won’t be part of the build image (and containers that
    you’ll spawn from that image) unless you use the COPY instruction. Which is why
    we have a COPY instruction: we want the index.html file to be part of the /usr/share/nginx/html
    directory inside the image we create.


    You may have noticed that this time the Dockerfile file contains no CMD instruction.
    Remember that the CMD instruction states which executable should be ran when a
    container is created from my image, so it’s weird that I don’t include a CMD instruction
    that runs an NGINX server. Right. The reason why I didn’t include a CMD instruction
    is because the base nginx:1.15 image already contains such a CMD instruction to
    run the NGINX server, so it’s part of my image and I don’t need to include my
    own CMD instruction as long as I don’t want to run another executable on container
    startup.


    Back to creating our HTTP server image, I open a command line inside the folder
    where my index.html and Dockerfile files are, and run the following commands:


    Dockerfile


    docker build -t webserver .


    docker run –rm -it -p 8082:80 webserver


    Those commands build a webserver from the Dockerfile file instructions, then start
    a container that listens to my machine’s 8082 port and redirect the incoming connections
    to the container’s 80 port. I can start a browser and point it to http://localhost:8082
    . That displays the HTML file contents in my browser, since they are served over
    HTTP by the running container:


    ![](media/file30.png)


    In the command-line I can see a log from NGINX that proves it received the HTTP
    request from my browser:


    172.17.0.1 - - […/2019:21:14:46 +0000] “GET / HTTP/1.


    1” 304 0 “-” “…” “-”


    When running my container I added the –rm and -it switches simply for demo purposes.
    In real life that server container would be long running so I’d run it without
    those switches. Here’s why I used the switches:


    the -it switch allows me to stop the container using Ctrl-C from the command-line;


    the –rm switch ensures that the container is deleted once it has stopped.


    6.3 Images are created locally


    When I run the docker build command in order to create an image from a Dockerfile
    file, the resulting image is stored locally on the computer where the docker build
    command is ran.


    This allows me to run as many containers as I want from the locally created image,
    but chances are that I want other computers to be able to run containers from
    the image I created. We’ll learn how to do that in the next chapter.


    I can see the images available locally on my computer by running the following
    command:


    docker image ls


    Taking into account the images I built earlier, I can see something along those
    lines:


    Having the images readily available locally makes it fast to run a container from
    them. However, there will be a time when some images are useless. I can remove
    them from my local machine using the docker rmi command and providing it the image
    name or image ID.


    For instance, I could remove the webserver:latest image using any of the following
    two commands:


    docker rmi c067edac5ec1


    docker rmi webserver:latest


    6.4 Exercise - Build an image and run it


    Create a file named compute.js with the following code that computes and displays
    the area of a disk using JavaScript:


    var radius = 2.0 ; var area = Math . pow ( radius , 2 ) * Math . PI ; console
    . log (


    `Area of a ${ radius } cm circle:     ${ area } cm²` );'
