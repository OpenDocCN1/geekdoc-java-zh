    \n## 15. 配置\n\n### 15.1 相似但不同\n\n无论你的 `Pods` 内部使用什么编程语言，你的容器可能都需要取决于其配置的运行时参数。例如，连接数据库的地址或某些凭据。Kubernetes\
    \ 的 `ConfigMap` 和 `Secret` 对象使得此类信息成为集群中的一等公民。\n\n因此，这两个对象都可以使用我们见过的用于 `Pods`、`Deployments`\
    \ 和 `Services` 的常用 `kubectl` 命令进行管理。例如，你可以使用以下命令获取所有 `ConfigMap` 列表：\n\n```\n\
    kubectl get configmaps\n```\n\n`ConfigMap` 和 `Secret` 非常相似，尽管对于更敏感的信息，会优先使用 `Secret`\
    \ 而非 `ConfigMap`。让我们来看两者。\n\n### 15.2 ConfigMap\n\n#### 声明\n\n`ConfigMap` 存储了键值对，这些键值对将提供给跨\
    \ `Nodes` 的任意数量的 `Pods`。这些键及其值可以通过以下任一选项被 `Pods`get：\n\n- 为所有条目定义的环境变量；\n- 为某些条目定义的环境变量；\n\
    - 文件。\n\n在声明 `ConfigMap` 的时候，你不需要知道它将如何暴露给 `Pods`。这里有一个定义示例：\n\n```yaml\napiVersion:\
    \ v1\nkind: ConfigMap\nmetadata:\n  name: configmap-values\ndata:\n  key1: \"\
    value1\"\n  key2: \"value2\"\n```\n\n在上述的定义中，有两个条目。`key1` 条目具有 `value1` 值，而 `key2`\
    \ 条目具有 `value2` 值。\n\n如上所述，有三种方法从 `Pod` 消费这些键。\n\n#### 作为文件消费\n\n还记得用于持久化存储的 `Volumes`\
    \ 吗？`ConfigMap` 对象可以作为 `Volume` 挂载到 `Pod` 内部。这意味着它的每个键都被视为一个只读文件；每个文件的内容就是分配给键的值。\n\
    \n大多数编程语言都可以从文件中读取配置，因此大多数容器都期望此类配置文件。`ConfigMap` 对象可以用于此，这意味着配置数据可以来自单个 YAML\
    \ 文件。\n\n作为一个例子，让我们将之前显示的 `ConfigMap` 挂载到 `Pod` 中：\n\n```yaml\napiVersion: apps/v1beta1\n\
    kind: Deployment\nspec:\n  template:\n    spec:\n      volumes:\n        - name:\
    \ config\n          configMap:\n            name: configmap-values\n      containers:\n\
    \        - name: front\n          image: learnbook/k8s-front:0.3\n          volumeMounts:\n\
    \            - mountPath: /config\n              name: config\n```\n\n这与我们用于 `Volumes`\
    \ 的语法完全相同，但 `Volume` 类型是 `configMap`。你可以看到 `front` 容器挂载了卷到 `/config` 路径；结果是 `front`\
    \ 容器看到了如下文件：\n\n#### 作为环境变量消费\n\n许多容器需要以环境变量的形式提供参数。当配置存储在 `ConfigMap` 时，这很容易实现。考虑以下定义：\n\
    \n```yaml\napiVersion: apps/v1beta1\nkind: Deployment\nspec:\n  template:\n  \
    \  spec:\n      containers:\n        - name: front\n          image: learnbook/k8s-front:0.3\n\
    \          envFrom:\n            - configMapRef:\n                name: configmap-values\n\
    ```\n\n`envFrom` 条目意味着 `ConfigMap` 中的所有键都将以相同的名称作为环境变量暴露。考虑到我们定义的 `configmap-values`\
    \ `ConfigMap`，`front` 容器将看到如下环境变量：\n\n#### 选择性环境变量消费\n\n在某些情况下，你想为容器提供环境变量，但不想暴露\
    \ `ConfigMap` 的所有条目，或者你想以特定的变量名提供它们。这样做有一种更详细的语法，你可以在列出每个想要暴露的键以及分配给其值的环境变量名称。\n\
    \n考虑以下定义：\n\n```yaml\napiVersion: apps/v1beta1\nkind: Deployment\nspec:\n  template:\n\
    \    spec:\n      containers:\n        - name: front\n          image: learnbook/k8s-front:0.3\n\
    \          env:\n            - name: VAR_NAME\n              valueFrom:\n    \
    \            configMapKeyRef:\n                  name: configmap-values\n    \
    \              key: key2\n```\n\n它创建了一个 `Pod` 并将单个 `ConfigMap` 值暴露为单个环境变量。名为 `configmap-values`\
    \ 的 `ConfigMap` 中的 `key2` 条目被视为名为 `VAR_NAME` 的环境变量。你可以根据需要重复 `env/name` 条目，以创建所需的任意环境变量。\n\
    \n考虑到我们刚刚看到的定义，`front` 容器将看到如下环境变量：\n\n### 15.3 练习 - 创建并使用 ConfigMap\n\n目标：创建一个\
    \ `ConfigMap` 并从 `Pod` 以不同的方式消费它。\n\n我们的目标是如下架构：\n\n![](img/file77.jpg)\n\n创建一个具有以下条目的\
    \ `ConfigMap` 对象：\n\n"
