  trans: "\n命名空间（Namespaces）为你提供了一种在 Kubernetes 集群内部将对象相互隔离的方法。它们允许对象名称、`Services`\
    \ 的网络名称、资源配额和授权（`RBAC`）进行分离。\n\n命名空间是隔离集群内部团队的一种方便方式：对象被限制在它所在的 `Namespace` 中，这避免了某个团队修改另一个团队具有相同名称的对象。\n\
    \nKubernetes 集群启动时有两个 `Namespaces`，你可以添加自己的命名空间。两个默认的 `Namespaces` 是：\n\n- `default`：用于未分配\
    \ `Namespace` 的对象。\n- `kube-system`：用于提供 Kubernetes 功能的对象。\n\n你可以像声明其他 Kubernetes\
    \ 对象一样声明 `Namespace`：\n\n```\napiVersion : v1 kind : Namespace metadata : name\
    \ : prod\n```\n\n一旦在你的集群中存在一个 `Namespace`，你就可以向我们之前见过的 `kubectl` 命令中添加 `--namespace`\
    \ 参数。例如，以下命令会在命名为 `team1` 的命名空间中创建或更新 `dep.yaml` 文件中描述的对象：\n\n```bash\nkubectl\
    \ apply -f dep.yaml –namespace team1\n```\n\n假设 `dep.yaml` 文件描述了一个名为 `front` 的\
    \ `Deployment`。如果你运行上述命令，`front` Deployment 及其 `Pods` 将被限制在 `team1` 命名空间中，因此你可以在\
    \ `team2` 命名空间中运行相同的命令，并在 `team2` 命名空间中获得另一个“隔离”的 `front` 部署：\n\n```bash\nkubectl\
    \ apply -f dep.yaml –namespace team2\n```\n\n查询 Kubernetes 资源时也是如此。例如，以下命令返回属于\
    \ `team1` 命名空间的 `Pods`：\n\n```bash\nkubectl get pods –namespace team1\n```\n\n\
    当你不带 `--namespace` 参数运行相同的命令时，你不会获得来自所有命名空间的对象：你只会获得命名为 `default` 的命名空间中的对象。如果你想列出所有命名空间的\
    \ `Pods`，请在 `kubectl get` 命令上使用 `--all-namespaces` 参数。\n\n由于你很可能每天都在同一个 `Namespace`\
    \ 中工作，你不想在每个命令中都添加 `--namespace` 参数。只需运行以下命令，当前上下文将将设置为默认在 `team1` 内部工作：\n\n```bash\n\
    kubectl config set-context –current –namespace=team1\n```\n\n从现在起，你的命令将在 `team1`\
    \ `Namespace` 内部的对象上执行。由于 `Namespace` 与 `kubectl` 上下文关联，当你切换到另一个上下文并回到设置的上下文时，它会被记住。简而言之：一个\
    \ `kubectl` 上上下文指向一个集群、一个用户和一个 `Namespace`。\n\n我们之前看到 `Services` 可以从集群内部通过名称进行访问，因此名为\
    \ `front` 的 `Service`可以通过 `http://front` URL 访问。这种 DNS 功能由 `CoreDNS` 组件提供。此外：`Service`\
    \ 有两个域名：一个包含它的 `Namespace`，另一个不包含。例如，`front` Service 拥有两个域名：\n\n- `front.team1`\n\
    - `front`\n\n`front` 域名解析为请求来源所在的 `Namespace`。因此，如果来自 `team2` `Namespace` 的 `Pod`\
    \ 查询 `http://front` URL，它实际上看到的只是 `team2` 命名空间中的 `front` `Service`。如果它需要访问 `team1`\
    \ 命名空间的 `Service`，可以使用 `http://front.team1` URL。这种名称解析再次提供了命名空间之间的隔离：它在避免命名冲突的同时仍允许跨命名空间通信。\n\
    \n集群管理员可以使用 `ResourceQuota` 对象。它允许限制 `Namespace` 内部可以使用的资源。这样，来自某个 `Namespace`\
    \ 的对象就不会因为占用集群的所有资源而饿死其他命名空间。可以定义以下属性：\n\n- `limits.cpu`：`Pods` 请求的 CPU 限制总和；\n\
    - `limits.memory`：`Pods` 请求的内存限制总和；\n- `requests.cpu`：`Pods` 的 CPU 请求总和；\n- `requests.memory`：`Pods`\
    \ 的内存请求总和。\n\n注意，某些 Kubernetes 对象无法被限制在 `Namespace` 中，它们位于 `Namespaces` 之外：\n\n\
    - `Namespaces` 自身；\n- `Nodes`；\n- `PersistentVolumes`；\n\n## 17.2 RBAC\n\n到为止，我们一直使用\
    \ `kubectl` 命令对集群内部进行基础更改。这意味着管理集群只需要一个正确的 `context`。现在，想象一下某些恶意用户拥有这种权力：他会给你的集群带来混乱，获取机密信息，或迅速添加恶意的\
    \ `Pods`。你肯定不希望这样。\n\n除了阻止外部用户，你还想限制特定用户在 Kubernetes 集群内部可以执行的操作。例如，在预生产集群中，你可能希望确保开发者只能列出\
    \ Kubernetes 对象而不能更改它们，而 CI/CD 引擎是唯一允许创建或更改对象的实体。你可能还希望确保只有特定用户或系统可以创建和读取 `Secrets`。\n\
    \n此类限制可以使用 `RBAC` 来定义。你可以将用户（或服务账户）链接到 Kubernetes API 的特定权限。\n\n在配置 `RBAC` 之前，你必须确保你的集群已启用\
    \ `RBAC`。由于启用 `RBAC` 功能是在创建集群时做出的选择，你可能没有关于是否启用的信息。如果集群启用了 `RBAC`，你可以使用以下命令：\n\
    \n```bash\nkubectl describe pod -n kube-system\n``` ...\n```\n\n如果 `RBAC` 已启用，你应该在授权模式中看到\
    \ `RBAC` 的提及：\n\nmedia/file91jpg\n\n正如许多授权系统一样，`RBAC` 不直接将用户链接到权限。相反，它将权限链接到 `Roles`，然后将用户分配给\
    \ `Roles`。这允许随着团队的变化轻松添加和删除用户，并为组重新配置权限。简而言之：`Roles` 是用户组。\n\n角色有两种类型：\n\n- `Role`：定义限制在命名空间的授权；\n\
    - `ClusterRole`：定义跨集群有效的授权。\n\nmedia/file92jpg\n`RoleBinding` 将一个用户（或服务账户）链接到\
    \ `Role`。同样地，`ClusterRoleBinding` 将一个用户（或服务账户）链接到 `ClusterRole`。\n\n为了让启用了 RBAC\
    \ 的集群正常运行，已经定义了一些 `ClusterRoles`，并绑定到你用于连接的用户。这里是一些 `ClusterRoles`：\n\n```bash\n\
    kubectl get clusterroles\nNAME                                    \nadmin    \
    \                               8d\ncluster-admin                           8d\n\
    edit                                    8d\nsystem:coredns                   \
    \       8d\nsystem:persistent-volume-provisioner\nview                       \
    \             8d\n```\n\n列表经过简化。你可以看到三个常用的 `ClusterRoles`，如果你不想花时间创建自己的角色，可以将它们分配给新用户。`admin`\
    \ 和 `cluster-admin` 角色具有扩展权限，应该谨慎授予。你可以使用以下命令检查分配给角色的授权：\n\n```bash\nkubectl describe\
    \ clusterrole view\n```\n\n该列表再次经过简化。我们可以看到 `view` `ClusterRole` 具有列出 pod 的能力，因此该角色获得了\
    \ `kubectl get logs` 命令。\n\n## 18. Helm\n\n### 18.1 使用 Helm\n\nHelm 被称为“Kubernetes\
    \ 的包管理器”：\n\nmedia/file93jpg\n\n来自 Helm 网站的截图"
- fmt: "\nI wouldn’t compare Helm to package managers like `NPM` or `NuGet` that also\
    \ manage your packages’ dependencies, but it sure means an easy path when you\
    \ want to deploy complex applications to Kubernetes.\n\nPractically speaking,\
    \ it mainly allows to add extra power to the `kubectl apply` command: it enables\
    \ the use of variables and even scripting inside YAML files, then those files\
    \ are packed together. Helm packages are called `Charts`.\n\n## Using Helm Charts\n\
    \nThe easiest part in Helm is using an existing `Chart`, that is, installing an\
    \ application in a Kubernetes cluster using a Helm chart. It is done in two steps:\n\
    \n1. add a Helm repository (the source for charts, just like a `Registry` for\
    \ Docker Images);\n2. install a chart using the following command:\n\n`helm install\
    \ <name>--set version=1.0,key=value,... chart`\n\nThe `--set` switch allows you\
    \ to override default values from the chart. When there are many values, you can\
    \ instead provide them in a YAML file.\n\nLet’s take an example to illustrate\
    \ this. Suppose I want to install Redis. Redis is a distributed cache, which means\
    \ values are stored across different machines: a great example of something that\
    \ can easily be distributed across different `Pods` on several `Nodes`.\n\nFrom\
    \ the Redis chart description I can see that the number of slaves to create is\
    \ set by the `cluster.slaveCount` variable. It has a default of 1 and I want to\
    \ override it to 3 so that I have 4 `Pods` running my Redis cluster (1 master,\
    \ 3 slaves).\n\n```bash\nhelm repo add stable https://kubernetes-charts.storage.googleapis.com/\n\
    “stable” has been added to your repositories\n\nhelm install mycache stable/redis\
    \ --set cluster.slaveCount=3\n\nNAME: mycache\nLAST DEPLOYED: Thu Jan 30 14:07:47\
    \ 2020\nNAMESPACE: default\nSTATUS: deployed\nREVISION: 1\nTEST SUITE: None\n\
    NOTES:\n  Please be patient while the chart is being deployed\n```\n\nRedis can\
    \ be accessed via port 6379 on the following DNS names from within your cluster:\n\
    - `mycache-redis-master.default.svc.cluster.local` for read/write operations\n\
    - `mycache-redis-slave.default.svc.cluster.local` for read-only operations\n\n\
    To get your password run:\n`...`\n\nThe output has been shortened for brevity,\
    \ but as you can see upon installation a chart provides some documentation based\
    \ on the parameters you provided.\n\nLet’s list the `Pods` running in my cluster:\n\
    \n```bash\nkubectl get pods\nNAME                     READY  STATUS    AGE\nmycache-redis-master-0\
    \   1/1     Running   3m20s\nmycache-redis-slave-0    1/1     Running   3m20s\n\
    mycache-redis-slave-1    1/1     Running   2m34s\nmycache-redis-slave-2    1/1\
    \     Running   2m17s\n```\n\nAlright, I really have 4 `Pods` running Redis. Just\
    \ that simple.\n\n## 18.2 Creating Helm packages (charts)\n\nWe just saw how a\
    \ well-made chart eases deployment of complex applications. Once you create a\
    \ Kubernetes-ready application you will probably want to package it as a chart\
    \ for an easier distribution. Mind you, it’s quite an easy process.\n\nA chart\
    \ actually is a collection of files in a `*.tar.gz` package:\n\n![](media/file94.jpg)\n\
    \nThe files are:\n- YAML files that describe Kubernetes objects just like the\
    \ ones we saw up to now, but with the possibility to add scripting;\n- A `values.yaml`\
    \ file that defines the default values for variables used in your scripting;\n\
    - A `NOTES.txt` file that will render the help text when the chart is installed.\n\
    \nAs mentioned, in the YAML file you can use YAML syntax, and you can add script\
    \ blocks: for that matter, Go templates are used:\n\n```yaml\napiVersion: apps/v1beta1\n\
    kind: Deployment\nmetadata:\n  name: back-{{ .Values.config }}\n```\n\nThe above\
    \ file defines a `Deployment`, and the name of that deployment will be generated\
    \ by appending a config entry to the `back-` prefix. The actual value of the config\
    \ entry is set in the `values.yaml` file but can be overridden using the `--set`\
    \ switch or a YAML file upon install.\n\nInstead starting with a blank folder,\
    \ you can scaffold a chart template with the following command:\n\n`helm create\
    \ <name>`\n\nThat simply creates a folder with enough starter files to have an\
    \ actual chart. You then edit the files to suit your needs. Any YAML file you\
    \ place in the `templates` directory will be part of the chart.\n\nYou then create\
    \ the chart package using the following commands (lint is just for verification\
    \ purposes):\n\n```bash\nhelm lint <name>\nhelm package <name>--debug\n```\n\n\
    That creates an installable chart in a file named `<name>-0.1.0.tgz` (the version\
    \ number comes from the `Chart.yaml` file). Before you distribute your chart,\
    \ you may want to check what it actually does. That can be done with the following\
    \ command that will output the YAML that would otherwise be sent to the Kubernetes\
    \ cluster on install:\n\n```bash\nhelm install --dry-run --debug <name>-0.1.0.tgz\n\
    ```\n\nYou can now distribute your chart in one of two ways:\n- distribute the\
    \ `*.tar.gz` file;\n- place the `*.tar.gz` file on a Helm repository (a simple\
    \ HTTP file server hosting the `*.tar.gz` files).\n\nWhen distributed as a file,\
    \ the chart can be installed using the file name:\n\n`helm install <name> <name>-0.1.0.tgz`\n\
    \nWhen distributed using a repository, users will simply need to add your repository\
    \ using the `helm repo add` command.\n\n## A word from the author\n\nI sincerely\
    \ hope you enjoyed reading this book as much as I liked writing it and that you\
    \ quickly become proficient enough with containerizing and deploying your applications\
    \ using Docker over Kubernetes clusters.\n\nIf you would like to get in touch\
    \ you can use:\n- email: `books@aweil.fr`\n- Facebook: `facebook.com/learncollection`\n\
    - Twitter: `@epo`\n\nIn case your project needs it, I’m also available for speaking,\
    \ teaching, consulting and coding, all around the world. If you liked this book,\
    \ you probably saved a lot of time thanks to it. I’d be very grateful if you took\
    \ some minutes of your precious time to leave a comment on the site where you\
    \ purchased this book. Thanks a ton!\n\n## Image attributions\n\n- Classic ship\
    \ loading: public domain, from Wikimedia Commons\n- Container ship loading: public\
    \ domain, `Tvabutzku1234`, from Wikimedia Commons .\n- Freight train: public domain,\
    \ `G-Man March 2005`, from Wikimedia Commons , originally uploaded to the English\
    \ Wikipedia.\n\n## The Learn collection\n\nThis book is part of the Learn collection\
    \ .\n\nThe Learn collection allows developers to self-teach new technologies in\
    \ a matter of days.\n\n### Published books\n- Learn ASP.NET Core MVC\n- Learn\
    \ ASP.NET MVC\n- Learn Docker\n- Learn Kubernetes\n- Learn Kubernetes & Docker\n\
    - Learn Meteor\n- Learn Microservices\n- Learn WPF MVVM\n\n### To be published\n\
    - Learn Unit Testing\n"
