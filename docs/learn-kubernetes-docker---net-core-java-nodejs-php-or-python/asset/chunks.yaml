  trans: "\n\n`HorizontalPodAutoscaler` 会监控可用 Pod 的 CPU 使用情况，并将其与 Pod CPU 请求中设置的限制进行比较。如果\
    \ Pod 的使用率低于目标百分比，某些 Pod 将被销毁。反之，当 Pod 的使用率超过目标百分比时，会创建新的 Pod 直到达到目标百分比。当然，创建的\
    \ Pod 数量不会超过定义中 `maxReplicas`，也不会低于 `minReplicas` 的数量。\n\n在上面的示例中，自动扩展是基于 CPU\
    \ 使用率的，但你也可以使用目标内存使用率。\n\n简而言之，感谢 `HorizontalPodAutoscaler`，你可以定义一个根据实际使用消耗资源的应用程序，在低负载时为其他应用程序留出空间。\n\
    \n### 16.3 更新策略\n\n当你修改 `Deployment` 的模板部分时，现有的 Pod 不再是最新的，需要用使用新模板创建的 Pod 来替换。一旦你\
    \ `kubectl apply` 修改后的 `Deployment`，Kubernetes 就会为你处理此任务。具体是如何操作的？让我们来看看。\n\n\
    由于 `ReplicaSet` 会确保给定版本的 Pod 正在运行，一旦版本发生变化，Kubernetes 就会创建一个新的 `ReplicaSet`。旧的\
    \ `ReplicaSet` 会删除它管理的 Pod，而新的 `ReplicaSet` 将创建 Pod。这些删除和创建的顺序由 `Deployment` 的\
    \ `strategy` 属性决定。\n\n#### Recreate（重建）\n\n当你将策略设置为 `Recreate` 时，所有旧的 Pod 会首先停止。一旦它们不再运行，就会启动新的\
    \ Pod。\n\n```yaml\napiVersion: apps/v1beta1\nkind: Deployment\nmetadata:\n  name:\
    \ my-front\nspec:\n  strategy:\n    type: Recreate\n  replicas: 3\n  template:\n\
    \    metadata:\n      labels:\n        app: front\n    spec:\n      containers:\n\
    \      - name: my-front\n        image: my-wordpress\n```\n\n下面的序列说明了当使用 `recreate`\
    \ 策略 `kubectl apply` `Deployment` 模板的更改时会发生什么。\n\n![](img/file83.jpg)\nDeployment\
    \ 更改之前的状态\n\n![](img/file84.jpg)\nPod 停止，然后 ReplicaSet 被删除\n\n![](img/file85.jpg)\n\
    创建了一个新的 ReplicaSet\n\n![](img/file86.jpg)\n新的 ReplicaSet 使用新模板创建 Pod\n\n`Recreate`\
    \ 更新策略意味着在任何时刻，运行的 Pod 数量都不会超过你设置的副本数，因此更新消耗的资源不会比运行中的应用程序多。但它意味着会在某一点没有 Pod 可用，这意味着你的应用程序将发生服务中断。这是否可行取决于你的决定。如果不可，`RollingUpdate`（滚动更新）策略可能对你很有吸引力。\n\
    \n#### Rolling update（滚动更新）\n\n与其先停止所有现有的 Pod 再创建新的 Pod，Kubernetes 默认提供了一种更平滑的方法。你只需要为\
    \ `strategy` 类型指定 `RollingUpdate` 值即可：\n\n```yaml\napiVersion: apps/v1beta1\n\
    kind: Deployment\nmetadata:\n  name: my-front\nspec:\n  strategy:\n    type: RollingUpdate\n\
    \  replicas: 3\n  template:\n    metadata:\n      labels:\n        app: front\n\
    \    spec:\n      containers:\n      - name: my-front\n        image: my-wordpress\n\
    ```\n\n事实上，`RollingUpdate` 是默认值，所以到目前为止我们没有指定任何策略类型时，我们使用的就是滚动更新策略。这意味着你通过 Kubernetes\
    \ 免费获得了了细粒度、高可用且智能的更新。我告诉过你 Kubernetes 开发者很幸运吗？当然，想要运行它需要一些知识，但一旦你读到书的这一部分，你就获得了强大的力量，能够让你轻松地完成以前非常繁琐的工作。但让我详细说明滚动更新是如何发生的。\n\
    \n在滚动更新期间，Pod 会按 25% 的批次进行替换（这是一个可以更改的默认值）。首先使用新模板创建第一批 25% 的 Pod（当运行 3 个 Pod\
    \ 时创建 1 个，当运行 8 个 Pod 时创建 2 个）。Kubernetes 等待新 Pod 运行后，然后停止相同数量的旧 Pod。一旦旧 Pod 停止，它将重复该过程，用新\
    \ Pod 替换另一批 25% 的旧 Pod。该过程不断重复直到所有旧 Pod 都被新 Pod 替换。\n\n滚动更新过程甚至更好：当创建 25% 的新 Pod\
    \ 组时，Pod 可能会失败；如果新 Pod 无法达到运行状态，滚动更新过程将停止并保留旧 Pod。这意味着如果新 Pod 有 Bug，应用程序仍保持运行；它仅由旧\
    \ Pod 提供服务，你可以使用新模板并再次 `kubectl apply` 来整理并解决问题。\n\n简而言之，滚动更新过程确保了即使在新版本出现问题的情况下你的应用程序始终运行，并且在更新过程中使用的资源较少。\n\
    \n下面的序列说明了当使用滚动更新策略 `kubectl apply` `Deployment` 模板的更改时会发生什么。\n\n![](img/file87.jpg)\n\
    使用新模板创建了 25% 的新 Pod\n\n![](img/file88.jpg)\n删除了 25% 的旧 Pod\n\n![](img/file89.jpg)\n\
    对 Pod 的 25% 重复此过程\n\n![](img/file90.jpg)\n旧的 ReplicaSet 被删除\n\n##### 滚动更新参数\n\n\
    如果你有高级需求，且以上方法还不能满足你，可以通过一些参数来修改它的行为：\n\n```yaml\napiVersion: apps/v1beta1\nkind:\
    \ Deployment\nmetadata:\n  name: my-front\nspec:\n  strategy:\n    type: RollingUpdate\n\
    \    rollingUpdate:\n      maxSurge: 25%\n      maxUnavailable: 25%\n  replicas:\
    \ 3\n  template:\n    metadata:\n      labels:\n        app: front\n    spec:\n\
    \      containers:\n      - name: my-front\n        image: my-wordpress\n```\n\
    \n`maxSurge` 和 `maxUnavailable` 参数指定了批次大小，即在更新期间可以额外创建或处于不可用的 Pod 数量。你可以提供数字或百分比。在百分比的情况下，它是相对于\
    \ `replicas` 参数的。\n\n##### 蓝绿发布、金丝雀和彩虹\n\n`rolling update` 或 `recreate` 策略对于大多数需求都是足够的，但如果你运行的应用程序拥有大量用户，你可能希望尝试更微妙的更新类型。对于所有这些类型，你需要在更新过程中添加一些逻辑，这主要通过调整路由到\
    \ Pod 的 `Service` 选择器来实现。\n\n在蓝绿发布期间，创建一个新版本（蓝色），同时用户被路由到旧版本（绿色）。新版本经过测试，一旦宣布就绪（绿色），它将完全替换旧版本，旧版本随后被删除。你可以通过简单地为\
    \ Pod 添加额外的蓝绿标签来实现这一点。\n\n金丝雀发布试图模仿煤矿里的金丝雀：只要鸟是健康的，矿工就知道他们没有面临危险。在金丝雀发布中，你对应用程序进行监控，并将一部分用户路由到新版本，同时监控你的指标。如果指标显示问题，你就减少百分比；如果指标正常，你就增加百分比。这可以通过匹配部分新\
    \ Pod 的 `Service` 选择器来实现。\n\n"
- fmt: "\nNamespaces provide you with a way to isolate objects from one another inside\
    \ a Kubernetes cluster. They allow for separation of object names, network names\
    \ for `Services`, resource quotas and authorizations (`RBAC`).\n\nNamespaces are\
    \ a handy way to isolate teams inside a cluster: an object is scoped to its `Namespace`\
    \ which avoids that a team modifies another team’s object that has the same name.\n\
    \nA Kubernetes cluster starts with two `Namespaces` and you can add your own.\
    \ The two default `Namespaces` are:\n\n- `default`: for objects that weren’t assigned\
    \ a `Namespace`.\n- `kube-system`: for objects that provide Kubernetes functionality.\n\
    \nYou declare a `Namespace` like you would declare other Kubernetes objects:\n\
    \n```\napiVersion : v1 kind : Namespace metadata : name : prod\n```\n\nOnce a\
    \ `Namespace` exists in your cluster, you can add the `--namespace` switch to\
    \ the `kubectl` commands we already saw. For instance, the following command creates\
    \ or updates in a namespace named `team1` the objects described in the `dep.yaml`\
    \ file:\n\n```bash\nkubectl apply -f dep.yaml –namespace team1\n```\n\nSuppose\
    \ that the `dep.yaml` file describes a `Deployment` named `front`. If you run\
    \ the above command, the `front` Deployment and its `Pods` will be scoped to the\
    \ `team1` namespace so you can run the same command in another `team2` namespace\
    \ and get another “isolated” `front` deployment in the `team2` namespace:\n\n\
    ```bash\nkubectl apply -f dep.yaml –namespace team2\n```\n\nThe same goes when\
    \ you query Kubernetes resources. For instance, the following command returns\
    \ `Pods` that belong to the `team1` namespace:\n\n```bash\nkubectl get pods –namespace\
    \ team1\n```\n\nWhen you run the same command without the `--namespace` switch\
    \ you don’t get the objects from all namespaces: you only get objects from the\
    \ namespace named `default`. In case you want to list the `Pods` from all namespaces,\
    \ use the `--all-namespaces` switch on the `kubectl get` command.\n\nSince you’re\
    \ likely to work inside the same `Namespace` from day to day, you don’t want to\
    \ be adding the `--namespace` switch to each of your commands. Simply run the\
    \ following command, and the current context will be set to work inside the `team1`\
    \ ` by default:\n\n```bash\nkubectl config set-context –current –namespace=team1\n\
    ```\n\nFrom now on your commands will take place on objects inside the `team1`\
    \ `Namespace`. Since the `Namespace` is associated with the `kubectl` context,\
    \ it will be remembered when you switch to another context and back to the ones\
    \ for which you set the context. In short: a `kubectl` context points to a cluster,\
    \ a user and a `Namespace`.\n\nWe saw earlier that `Services` can be addressed\
    \ using their names from inside the cluster, so a `Service` named `front` can\
    \ be accessed over the `http://front` URL. Such DNS functionality is offered by\
    \ the `CoreDNS` component. Better yet: a `Service` has two domain names: one that\
    \ includes its `Namespace` and one that doesn’t. For instance, the `front` Service\
    \ has both domain names:\n\n- `front.team1`\n- `front`\n\nThe `front` domain name\
    \ resolves to the `Namespace` from which a requests originates. So if a `Pod`\
    \ from the `team2` `Namespace` queries the `http://front` URL it actually sees\
    \ only a `front` `Service` from the `team2` `Namespace`. Should it need to address\
    \ the `Service` from the `team1` `Namespace`, it could use the `http://front.team1`\
    \ URL. This name resolution again offers isolation between `Namespaces`: it avoids\
    \ name conflicts while still allowing cross-Namespace communication.\n\nCluster\
    \ administrators can use a `ResourceQuota` object. It allows for limiting the\
    \ resources that can be used inside a `Namespace`. That way, objects from a `Namespace`\
    \ cannot starve other `Namespaces` by taking up all of a cluster’s resources.\
    \ The following properties can be defined:\n\n- `limits.cpu`: total of the CPU\
    \ limits that can be requested by `Pods`;\n- `limits.memory`: total of the memory\
    \ limits that can be requested by `Pods`;\n- `requests.cpu`: total of the CPU\
    \ requests that can be made by `Pods`;\n- `requests.memory`: total of the memory\
    \ requests that can be made by `Pods`.\n\nNote that some Kubernetes objects cannot\
    \ be scoped to a `Namespace` and they live outside of `Namespaces`:\n\n- `Namespaces`\
    \ themselves;\n- `Nodes`;\n- `PersistentVolumes`;\n\n## 17.2 RBAC\n\nUp to now\
    \ we’ve been doing fundamental changes inside our cluster simply using the `kubectl`\
    \ command. This means that all you need in order to administer a cluster is a\
    \ correct `context`. Now, imagine that some malicious user has access to such\
    \ power: he would bring havoc to your cluster, get access to confidential information,\
    \ or add malicious `Pods` in no time. You surely don’t want this.\n\nApart from\
    \ blocking external users, you also want to limit what specific users can do inside\
    \ a Kubernetes cluster. For instance, in a pre-production cluster you may want\
    \ to ensure that developers can only list Kubernetes objects but not change them,\
    \ while the CI/CD engine would be the only one allowed to create or change objects.\
    \ You may also want to ensure that only a specific user or system can create and\
    \ read `Secrets`.\n\nSuch limitations can be defined using `RBAC`. You can link\
    \ users (or service accounts) to specific permissions on the Kubernetes API.\n\
    \nBefore you configure `RBAC`, you must ensure that your cluster has `RBAC` enabled.\
    \ Since enabling the `RBAC` feature is a choice made when the cluster is created,\
    \ you may not have information about whether that decision was made. In such a\
    \ case, you may use the following command:\n\n```bash\nkubectl describe pod -n\
    \ kube-system -l component=kube-apiserver\n```\n\nIf `RBAC` is enabled on the\
    \ cluster, you should see a mention of `RBAC` in the authorization mode:\n\n![](media/file91.jpg)\n\
    \nJust like many authorization systems, `RBAC` doesn’t directly link users to\
    \ permissions. Instead, it links permissions to `Roles`, and users are assigned\
    \ to `Roles`. This allows for easily adding and removing users as your team changes,\
    \ and for reconfiguring rights for a group in a snap. In short: `Roles` are user\
    \ groups.\n\nThere are two types of roles:\n\n- `Role`: defines authorizations\
    \ that are scoped to a namespace;\n- `ClusterRole`: defines authorizations that\
    \ are valid across the cluster.\n\n![](media/file92.jpg)\nA `RoleBinding` connects\
    \ one User (or ServiceAccount) to a `Role`. Symmetrically, a `ClusterRoleBinding`\
    \ connects one User (or ServiceAccount) to a `ClusterRole`.\n\nIn order for a\
    \ RBAC-enabled cluster to function, some `ClusterRoles` are already defined, and\
    \ bound to the User that you are using to connect from your command-line. Here\
    \ are some of the `ClusterRoles`:\n\n```bash\nkubectl get clusterroles\nNAME \
    \                                   \nadmin                                  \
    \ 8d\ncluster-admin                           8d\nedit                       \
    \             8d\nsystem:coredns                          8d\nsystem:persistent-volume-provisioner\n\
    view                                    8d\n```\n\nThe list above was edited for\
    \ brevity. You can see three `ClusterRoles` that are commonly used, and that you\
    \ can assign to new users if don’t want to spend time creating your own. The `admin`\
    \ and `cluster-admin` roles have extended permissions and should be granted with\
    \ due care. You can examine the authorizations assigned to a role with the following\
    \ command:\n\n```bash\nkubectl describe clusterrole view\nName:      view\nLabels:\
    \    kubernetes.io/bootstrapping=rbac\nAnnotations: rbac.authorization.k8s.io/aggregating\n\
    rbac.authorization.kubernetes.io...\nPolicyRule:\n  Resources               Verbs\n\
    \  ———                      ––\n  configmaps             [get list watch]\n  persistentvolumeclaims\
    \  [get list watch]\n  pods/log                [get list watch]\n  pods/status\
    \             [get list watch]\n  pods                    [get list watch]\n```\n\
    \nThat list was again edited for brevity. We can see that the `view` `ClusterRole`\
    \ has the ability to list pods, so the `kubectl get logs` command would be granted\
    \ for that role.\n\n## 18. Helm\n\n### 18.1 Using Helm\n\nHelm is coined as “The\
    \ package manager for Kubernetes”:\n\n![](media/file93.jpg)\n\nScreenshot from\
    \ the Helm web site\n"
  raw: 'Namespaces provide you with a way to isolate objects from one another inside
    a Kubernetes cluster. They allow for separation of object names, network names
    for Services, resource quotas and authorizations (RBAC).


    Namespaces are a handy way to isolate teams inside a cluster: an object is scoped
    to its Namespace which avoids that a team modifies another team’s object that
    has the same name.


    A Kubernetes cluster starts with two Namespaces and you can add your own. The
    two default Namespaces are:


    default for objects that weren’t assigned a Namespace.


    kube-system for objects that provide Kubernetes functionality.


    You declare a Namespace like you would declare other Kubernetes objects:


    apiVersion : v1 kind : Namespace metadata :


    name : prod


    Once a Namespace exists in your cluster, you can add the –namespace switch to
    the kubectl commands we already saw. For instance, the following command creates
    or updates in a namespace named team1 the objects described in the dep.yaml file:


    kubectl apply -f dep.yaml –namespace team1


    Suppose that the dep.yaml file describes a Deployment named front . If you run
    the above command, the front Deployment and its Pods will be scoped to the team1
    namespace so you can run the same command in another team2 namespace and get another
    “isolated” front deployment in the team2 namespace:


    kubectl apply -f dep.yaml –namespace team2


    The same goes when you query Kubernetes resources. For instance, the following
    command returns Pods that belong to the team1 namespace:


    kubectl get pods –namespace team1


    When you run the same command without the –namespace switch you don’t get the
    objects from all namespaces: you only get objects from the namespace named default
    . In case you want to list the Pods from all namespaces, use the –all-namespaces
    switch on the kubectl get command.


    Since you’re likely to work inside the same Namespace from day to day, you don’t
    want to be adding the –namespace switch to each of your commands. Simply run the
    following command, and the current context will be set to work inside the team1
    Namespace by default:


    kubectl config set-context –current –namespace=team1


    From now on your commands will take place on objects inside the team1 Namespace.
    Since the Namespace is associated with the kubectl context, it will be remembered
    when you switch to another context and back to the ones for which you set the
    context. In short: a kubectl context points to a cluster, a user and a Namespace
    .


    We saw earlier that Services can be addressed using their names from inside the
    cluster, so a Service named front can be accessed over the http://front URL. Such
    DNS functionality is offered by the CoreDNS component. Better yet: a Service has
    two domain names: one that includes its Namespace and one that doesn’t. For instance,
    the front Service has both domain names:


    front.team1


    front


    The front domain name resolves to the Namespace from which a requests originates.
    So if a Pod from the team2 Namespace queries the http://front URL it actually
    sees only a front Service from the team2 Namespace. Should it need to address
    the Service from the team1 Namespace, it could use the http://front.team1 URL.
    This name resolution again offers isolation between Namespaces: it avoids name
    conflicts while still allowing cross-Namespace communication.


    Cluster administrators can use a ResourceQuota object. It allows for limiting
    the resources that can be used inside a Namespace. That way, objects from a Namespace
    cannot starve other Namespaces by taking up all of a cluster’s resources. The
    following properties can be defined:


    limits.cpu: total of the CPU limits that can be requested by Pods;


    limits.memory: total of the memory limits that can be requested by Pods;


    requests.cpu: total of the CPU requests that can be made by Pods;


    requests.memory: total of the memory requests that can be made by Pods.


    Note that some Kubernetes objects cannot be scoped to a Namespace and they live
    outside of Namespaces:


    Namespaces themselves;


    Nodes;


    PersistentVolumes.


    17.2 RBAC


    Up to now we’ve been doing fundamental changes inside our cluster simply using
    the kubectl command. This means that all you need in order to administer a cluster
    is a correct context. Now, imagine that some malicious user has access to such
    power: he would bring havoc to your cluster, get access to confidential information,
    or add malicious Pods in no time. You surely don’t want this.


    Apart from blocking external users, you also want to limit what specific users
    can do inside a Kubernetes cluster. For instance, in a pre-production cluster
    you may want to ensure that developers can only list Kubernetes objects but not
    change them, while the CI/CD engine would be the only one allowed to create or
    change objects. You may also want to ensure that only a specific user or system
    can create and read Secrets.


    Such limitations can be defined using RBAC. You can link users (or service accounts)
    to specific permissions on the Kubernetes API.


    Before you configure RBAC, you must ensure that your cluster has RBAC enabled.
    Since enabling the RBAC feature is a choice made when the cluster is created,
    you may not have information about whether that decision was made. In such a case,
    you may use the following command:


    kubectl describe pod -n kube-system -l component=kube-a


    piserver


    If RBAC is enabled on the cluster, you should see a mention of RBAC in the authorization
    mode:


    ![](media/file91.jpg)


    Just like many authorization systems, RBAC doesn’t directly link users to permissions.
    Instead, it links permissions to Roles, and users are assigned to Roles. This
    allows for easily adding and removing users as your team changes, and for reconfiguring
    rights for a group in a snap. In short, Roles are user groups.


    There are two types of roles:


    Role: defines authorizations that are scoped to a namespace;


    ClusterRole: defines authorizations that are valid across the whole cluster.


    ![](media/file92.jpg)


    A RoleBinding connects one User (or ServiceAccount) to a Role. Symmetrically,
    a ClusterRoleBinding connects one User (or ServiceAccount) to a ClusterRole.


    In order for a RBAC-enabled cluster to function, some ClusterRoles are already
    defined, and bound to the User that you are using to connect from your kubectl
    command-line. Here are some of the ClusterRoles in my cluster:


    > kubectl get clusterroles


    NAME                                  AGE


    admin                                  8d


    cluster-admin                          8d


    edit                                  8d


    system:coredns                        8d


    system:persistent-volume-provisioner  8d


    view                                  8d


    The list above was edited for brevity. You can see three ClusterRoles that are
    commonly used, and that you can assign to new users if you don’t want to spend
    time creating your own roles. The admin and cluster-admin roles have extended
    permissions and should be granted with due care. You can examine the authorizations
    assigned to a role with the following command:


    > kubectl describe clusterrole view


    Name:        view


    Labels:      kubernetes.io/bootstrapping=rbac…


                  rbac.authorization.k8s.io/aggreg…


    Annotations:  rbac.authorization.kubernetes.io…


    PolicyRule:


      Resources              Verbs


      ———              —–


      configmaps              [get list watch]


      persistentvolumeclaims  [get list watch]


      pods/log                [get list watch]


      pods/status            [get list watch]


      pods                    [get list watch]


    That list was again edited for brevity. We can see that the view ClusterRole has
    the ability to list pods, so the kubectl get logs command would be granted for
    that role.


    18.  Helm


    18.1 Using Helm


    Helm is coined as “The package manager for Kubernetes”:


    ![](media/file93.jpg)


    Screenshot from the Helm web site'
