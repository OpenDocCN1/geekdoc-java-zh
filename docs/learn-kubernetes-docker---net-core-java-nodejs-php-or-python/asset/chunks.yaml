    \ URL（它显示了容器看到的所有环境变量名称）。请注意，没有名为 `message`、`config` 或 `magicNumber` 的项。\n\n更新\
    \ Deployment，使容器将 `ConfigMap` 对象中的所有项视为环境变量。\n\n刷新浏览器中的 `http://localhost:8080/details`\
    \ 页面。应该显示来自 `ConfigMap` 的三个条目。\n\n删除所有创建的资源。\n\n### 15.4 练习解答\n\n创建一个名为 `commonvalues-configmap.yaml`\
    \ 的文件，内容如下：\n\n```yaml\napiVersion : v1\nkind : ConfigMap\nmetadata :\n  name\
    \ : common-values\ndata :\n  message : “Hello world”\n  config : “Debug”\n  magicNumber\
    \ : “42”\n```\n\n创建一个名为 `front-deployment1.yaml` 的文件，内容如下：\n\n```yaml\napiVersion\
    \ : apps/v1beta1\nkind : Deployment\nmetadata :\n  name : front\nspec :\n  template\
    \ :\n    metadata :\n      labels :\n        app : front\n    spec :\n      containers\
    \ :\n        - name : front\n          image : learnbook/k8s-front:0.4\n```\n\n\
    创建一个名为 `front-service.yaml` 的文件，内容如下：\n\n```yaml\napiVersion : v1\nkind : Service\n\
    metadata :\n  name : front\nspec :\n  type : LoadBalancer\n  ports :\n    - port\
    \ : 8080\n      targetPort : 80\n  selector :\n    app : front\n```\n\n在创建上述文件的文件夹下打开命令行。\n\
    \n运行以下命令：\n\n```bash\nkubectl apply -f commonvalues-configmap.yaml\nkubectl apply\
