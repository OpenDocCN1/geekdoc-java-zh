    ```\n\n你应该得到类似下方的输出：\n\n```\n> kubectl apply -f front-deployment2.yaml\ndeployment.apps/front\
    \ configured\n```\n\n刷新浏览器中的 `http://localhost:8080/files` 页面。你的浏览器应该显示一个与该所示的页面：\n\
