    Pods and terminates them when used resources are actually higher than the limits
    you set.


    In short, limits are basically the maximum amount of CPU and memory that you allow
    a Pod to use.


    Here is a sample Deployment definition using limits:


    apiVersion: apps/v1beta1


    kind: Deployment


    spec:


      template:


        spec:


          containers:


          - name: front


            image: learnbook/k8s-front:0.4


            resources:


              limits:             cpu: “200m”             memory: “50Mi”


    Actually, the Kubernetes scheduler overcommits resources: it doesn’t immediately
    terminates Pods that go beyond their assigned limits, but rather does so when
    the total Node resources are scarce. When this happens, the Kubernetes scheduler
    terminates first the Pods that most exceed their limits.


    13.  Exposing services


    13.1 The need for services


    Now that you can run Pods, you probably want them to communicate. This brings
    several questions that will be answered by the Service object.


    Listen to connections from outside the cluster


    When you host a server, for instance a web server, you want inbound connections
    from clients to reach your Pods:


    ![](media/file51.jpg)


    You can do so with the following command that listens to connections from outside
    the cluster on port 8085 and routes them to the Pods deployed by the Deployment
    named name on its 8080 port:


    kubectl port-forward deployment/name 8085:8080


    However, this is an imperative command and you know by now that imperative commands
    are not what you want for medium-term maintenance.


    How can we describe the fact that the cluster should listen for connections using
    declarative commands? Services answer that question.


    Communicate across Nodes


    Since the aim of a Kubernetes cluster is to harness the power of having different
    Nodes running your containers, your Pods will be spread across Nodes.


    A routine task (especially on microservices architectures) will be to communicate
    across Nodes as shown in that simplified example:


    ![](media/file52.jpg)


    How do we communicate across Nodes? Should we keep a list of running Pods and
    address them? Services answer that question too.


    Load-balance to multiple Pods


    In order to provide high availability of your applications, it is good practice
    to have the same Pod duplicated across worker Nodes. We saw earlier how Deployments
    easily allow us to do so. But how can we ensure that inbound connections from
    clients will be directed to all of the Pods, as shown in the example below?


    ![](media/file53.jpg)


    Once again, the answer is to use Services.


    13.2 Services


    Services are Kubernetes objects that provide answers to the three questions we
    just raised.


    A Service object listens for incoming connections and routes them to Pods that
    are selected using labels, as shown below:


    ![](media/file54.jpg)


    The two widely used Service types are the LoadBalancer and ClusterIP ones. The
    difference is whether they allow for connections from outside the cluster. Let’s
    detail each of them.


    Connections from outside the cluster


    Use the LoadBalancer type when you create a Service, and it will route requests
    coming from outside the cluster to Pods that match a given selector.


    Here is an example definition of a LoadBalancer service:


    apiVersion : v1 kind : Service metadata :


    name : mon - front - service spec :


    type : LoadBalancer


    ports :


    *   port : 8081


    targetPort : 80


    selector :


    app : web - app


    When you kubectl apply that definition, the cluster assigns a public IP to your
    service. Requests made to that IP are routed to the matching Pods, as shown in
    the following schema:


    ![](media/file55.jpg)


    How the IP is assigned depends on the Kubernetes provider you chose when cloud-hosting
    your cluster, or the extensions you add to your self-managed cluster.


    Let’s deploy a public-facing web application as an example. Adminer is database
    management interface written in PHP and available as a docker image named adminer
    . In order to deploy it, I use the following two definitions:


    adminer-deployment.yaml


    apiVersion : apps/v1 kind : Deployment metadata :


    name : adminer spec :


    selector :


    matchLabels :


    app : adminer


    template :


    metadata :


    labels :


    app : adminer


    spec :


    containers :


    *   name : adminer


    image : adminer:latest


    ports :


    *   containerPort : 8080


    adminer-service.yaml


    apiVersion : v1 kind : Service metadata :


    name : adminer spec :


    type : LoadBalancer


    selector :


    app : adminer


    ports :


    *   port : 80


    targetPort : 8080


    Those two definitions are applied using the following command, as you know by
    now:


    kubectl apply -f .


    The first definition actually deploys a container that runs the adminer application.
    The second definition creates a Service that exposes this application to the outside
    world. The following schema shows the elements we just created:


    ![](media/file56.jpg)


    The URL used to access the service depends on the type of Kubernetes cluster that
    you are running:


    When running on Docker Desktop, the service is immediately available on the localhost
    address, so you can point your browser to the http://localhost URL and access
    the adminer application.


    When running on Minikube, you need to run the following command that returns the
    URL on which your service can be accessed:


    minikube service mon-front-service –url


    When running on a PaaS cluster in the cloud, you can get the service address by
    running the kubectl get services command as shown below:


    > kubectl get services


    NAME      TYPE          CLUSTER-IP    EXTERNAL-IP


    adminer    LoadBalancer  10.0.13.249    52.x.x.190


    See the EXTERNAL-IP column? It gives the IP address on which the Service (and
    thus the adminer Pod) is accessible.


    13.3 Exercise - Expose a web application to the internet


    Objective: deploy a web application and make it accessible from the internet.


    The learnbook/k8s-front:0.5 image is a web application that listens on its port
    80\. Deploy that image a Pod named front that has the app=front label. Expose
    that Pod using a LoadBalancer Service that listens on port 8080.


    Open a browser and point it to http://localhost:8080 (or the public URL you obtain
    if running in a PaaS cluster). Make sure you can access the web application.


    Once done, delete all resources created during that exercise.


    13.4 Exercise solution


    Create a file named front-deployment.yaml with the following contents:


    apiVersion : apps/v1beta1 kind : Deployment metadata :


    name : front spec :


    template :


    metadata :


    labels :


    app : front


    spec :


    containers :


    *   name : front


    image : learnbook/k8s-front:0.5


    Create a file named front-service.yaml with the following contents:


    apiVersion : v1 kind : Service metadata :


    name : front spec :


    type : LoadBalancer


    ports :


    *   port : 8080


    targetPort : 80


    selector :


    app : front


    Open a command-line in the folder where you created the above files.


    Run the following commands:


    kubectl apply -f front-deployment . yaml kubectl apply -f front-service . yaml
    kubectl get deployment kubectl get service


    You should get an output similar to the following one:


    > kubectl apply -f front-deployment.yaml


    deployment.apps/front created


    > kubectl apply -f front-service.yaml


    service/front created


    > kubectl get deployment


    NAME    READY  UP-TO-DATE  AVAILABLE  AGE


    front  1/1    1            1          9s


    > kubectl get service


    NAME  TYPE          CLUSTER-IP    EXTERNAL-IP  PORT(S)


    front  LoadBalancer  10.103.108.49  localhost    8080:3


    0164/TCP


    Point your browser to the EXTERNAL-IP returned, in that case http://localhost:8080


    Your browser should display the following page:


    ![](media/file57.jpg)


    Run the following command:


    kubectl delete -f .


    Connections from inside the cluster


    The ClusterIP Service type makes Pods available to other Pods inside the cluster.
    Just like the LoadBalancer type we saw earlier, but only for services that should
    be available from inside the cluster.'
