    be replaced with Pods from version 1.1\. Kubernetes will create one new 1.1 Pod,
    and wait to check if the Pod works. In case the Pod doesn’t work, Kubernetes stops
    creating 1.1 Pods and version 1.0 remains available. In case the Pod works, Kubernetes
    deletes one 1.0 Pod and proceeds with a second 1.1 Pod, and so on.


    ![](media/file49.jpg)


    In short, your application remains stable during updates and doesn’t eat up more
    resources that it ought to; and the best part is that all of this is automated
    by default.


    Again, the declarative commands work whatever the starting state. If you kubectl
    apply the previous YAML to an empty cluster, it will just create the 4 Pods one
    by one. This is a very convenient feature, because applications are generally
    deployed more often to a development cluster than to a production one. You could
    define your CI/CD chain to publish to a development cluster each time code is
    pushed, and to a test cluster only when a tag is added to the repository or some
    other manual action is taken; that would be done very easily, using exactly the
    same YAML file and same kubectl apply except that it would be done more often
    on the development cluster than on the test one.


    Should you want to use a single Kubernetes cluster in order to deploy both a development
    and a test version of your application, this is also easy: Namespaces can isolate
    your Kubernetes objects from one another. We’ll learn about Namespaces later on.


    Declarative syntax


    Let’s have a closer look at the YAML file we just applied to the Kubernetes cluster,
    and how you can get help writing it.


    The kubectl command can also output the necessary YAML so that when you create
    a declarative YAML file you start from an existing file instead of a blank page.
    All you have to to is add the –dry-run and -o yaml switches to an imperative command.


    For instance, the same kubectl create deployment command I used earlier would
    output the following YAML when we add the necessary switches:


    > kubectl create deployment hello –image=hello-world -


    -dry-run -o yaml


    apiVersion: apps/v1


    kind: Deployment


    metadata:


      creationTimestamp: null


      labels:


        app: hello


      name: hello


    spec:


      replicas: 1


      selector:


        matchLabels:


          app: hello


      strategy: {}


      template:


        metadata:


          creationTimestamp: null


          labels:


            app: hello


        spec:


          containers:


          - image: hello-world


            name: hello-world


            resources: {}


    status: {}


    That YAML is more verbose than what I used for my demos because it includes default
    values. That’s a good thing since we want this as a base template. Another point
    worth noting is that the actual YAML will vary according to the version of the
    Kubernetes cluster you run it against: it is generated using the Kubernetes API,
    and that API varies slightly from one Kubernetes version to another.


    If you prefer JSON you can also use it. Both YAML and JSON are formats for a textual
    representation of objects, lists of objects, and object properties. I use YAML
    in this book since this is the format most seen for Kubernetes declarative commands.
    The YAML specification is available on the official site and you can get a quick
    startup from the preview section of the site or that quickstart .


    There are four main properties in the document used to create a deployment (the
    one that we just obtained from the kubectl command, or the ones we used earlier
    in the book):


    apiVersion: states the Kubernetes API version that the following properties use.


    kind: the Kubernetes object we are creating or updating. Here, a Deployment .


    metadata: data that should be attached to the Kubernetes object. It’s used for
    finding Kubernetes objects for several purposes. We used it earlier when creating
    a selector to see logs (remember kubectl logs -l app=hello ), and it will also
    be used for Kubernetes objects to reference one another.


    spec: describes what the Deployment should be like:


    template: describes what the Pods managed by this Deployment should be like.


    replicas: number of Pods that this Deployment should have. This involves creating
    Pods when this number is increased or a Pod dies, or deleting Pods when this number
    is decreased or that they exist with a different template.


    strategy: states how the Deployment should proceed with the current Pods in case
    a previous version of this Deployment should be updated; we’ll see more about
    that in the Update strategies chapter.


    Declarative commands


    Let’s recapitulate how a Kubernetes cluster is managed with declarative commands.


    This is how you create objects:


    > kubectl apply -f deploy.yaml


    This is how you update objects (same command as above):


    > kubectl apply -f deploy.yaml


    And this is how you completely delete objects:


    > kubectl delete -f deploy.yaml


    While Kubernetes can be quite complex, the simplicity of these commands blatantly
    illustrates how complex operations are made simple by Kubernetes.


    In all of the above commands, you can replace the file name with a folder name.
    In that case, all of the files in the folder will be passed through the command.
    This enables you to write each Kubernetes object in a separate file instead of
    packing them all together.


    For instance, consider the following file (truncated for brevity):


    deploy.yaml


    apiVersion : apps / v1beta1 kind : Deployment … — apiVersion : v1 kind : Service
    …


    The — separator allows for several objects to be described in a single YAML file.


    It would be applied with the command:


    > kubectl apply -f deploy.yaml


    You could instead replace it with two files in a k8s folder:


    k8s/deployment.yaml


    apiVersion : apps / v1beta1 kind : Deployment …


    k8s/service.yaml


    apiVersion : v1 kind : Service …


    And those files would be applied using a single command:


    > kubectl apply -f ./k8s


    12.8 Exercise - Create resources using declarative commands


    Objective: get acquainted with creating a resource declaratively.


    In a YAML file, describe a Deployment named pinger that deploys the learnbook/k8s-pinger:0.6
    image with an app=pinger label.


    Use the kubectl apply command to create the corresponding Deployment in the Kubernetes
    cluster.


    Display the Pods and Deployments and check that the Deployment and corresponding
    Pod were created.


    12.9 Exercise solution


    Create a file named pinger-deployment.yaml with the following contents:


    apiVersion : apps/v1beta1 kind : Deployment metadata :


    name : pinger spec :


    template :


    metadata :


    labels :


    app : pinger


    spec :


    containers :


    *   name : pinger


    image : learnbook/k8s-pinger:0.6


    Open a command-line in the folder where you created the above file.


    Run the following commands:


    kubectl apply -f pinger-deployment . yaml kubectl get deployment kubectl get pods
    kubectl logs -lapp = pinger


    You should get an output similar to the following one:


    > kubectl apply -f pinger-deployment.yaml


    deployment.apps/pinger created


    > kubectl get deployment


    NAME    READY  UP-TO-DATE  AVAILABLE  AGE


    pinger  1/1    1            1          52s


