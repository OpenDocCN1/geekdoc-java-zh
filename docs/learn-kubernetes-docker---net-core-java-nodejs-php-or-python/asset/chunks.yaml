    10.5 Connecting to a cluster


    The kubectl tool


    Once your Kubernetes cluster is ready, you need a tool in order to interact with
    it. kubectl is a command-line tool that meets most needs. It is flexible and complete
    enough to be used during development deployments as well as from your continuous-delivery
    server (you sure use a CI/CD chain, don’t you?). It works in connection with your
    local development cluster as well as with productions clusters. This is where
    it fits:


    ![](media/file38.jpg)


    The kubectl tool sends commands to your Kubernetes cluster through the cluster
    API. It allows for cluster inspection and monitoring (listing nodes, pods, and
    other cluster resources), and enables for creation, deletion and update of elements
    inside your Kubernetes cluster.


    You can get kubectl from there . Make sure that the kubectl version fits the Kubernetes
    cluster version of the cluster you want to target. In order to check that everything
    is fine, you can run the following command:


    kubectl version


    If everything is set up correctly, you should get an output similar to the following:


    Client Version: version.Info{Major:“1”, Minor: … }


    Server Version: version.Info{Major:“1”, Minor: … }


    The Client part shows what you have on your machine, and the Server part shows
    information about the Kubernetes cluster. But wait, which cluster? And what if
    nothing appears in the Server part on your machine?


    Kubectl contexts


    The kubectl tool connects to a Kubernetes cluster thanks to a context . Each context
    stores credentials for a given user in a given cluster.


    Having several contexts is an obvious way to connect to different clusters (development
    and production clusters for instance), but it also is an handy way to connect
    to the same cluster using different credentials. For instance it allows you to
    test that the credentials used by a CI/CD tool work correctly.


    You can list the current contexts using the get-contexts command:


    > kubectl config get-contexts


    CURRENT  NAME


              some-cluster


              anotherOne


    *        docker-desktop


              cloudk8s


    Note the star to the left of “my-cluster”. It indicates that this is the current
    cluster. In other words, any command issued using the kubectl tool will act on
    that cluster.


    In order to use another context, you can use the following command:


    kubectl config use-context<context-name></context-name>


    In case you installed Docker Desktop, it enables you to list and switch contexts
    using a right-click on it system tray icon.


    Oftentimes the tools you will use to connect to clusters you create will create
    a new context entry for you, but you may add entries using the set-cluster , set-credentials
    and set-context subcommands of the kubectl config command.


    Basic commands


    From there, we can use some kubectl commands:


    ![](media/file39.jpg)


    The get nodes command lists the master and worker nodes of your cluster. The get
    node command will describe an individual node; you need to provide it with a node
    name that you got from the get nodes command.


    > kubectl get nodes


    NAME            STATUS  ROLES  AGE    VERSION


    aks-1923416-1  Ready  agent  27d19h  v1.14.6


    aks-1923416-2  Ready  agent  27d19h  v1.14.6


    > kubectl describe node aks-1923416-1


    Name:      aks-1923416-1


    Roles:    agent


    (lots of information about that node)


    In some environments like Azure AKS, master nodes are managed for you and won’t
    get listed by a get nodes command. The sample above shows such an case.


    11.  Tooling


    There are many tools aimed at making your Kubernetes life easier. Since Kubernetes
    can fully be API-driven, you could even write your own. However, for most needs
    you should need only two : a text editor and kubectl.


    Since we already saw kubectl, let me introduce some optional tools that may help
    you through your Kubernetes path.


    11.1 Kubernetes Dashboard


    Though kubectl is an extremely powerful swiss-knife tool for Kubernetes, those
    who aren’t used to command-line interfaces often turn to me with an anxious face
    asking whether there is a graphical tool. Yes, there is, and it’s the Kubernetes
    Dashboard. Not an essential tool, but one that may reassure those used to graphical
    user interfaces instead of command-line tools.


    The Dashboard is a web interface which may be accessed using a browser. It allows
    for simple cluster supervision in a user-friendly interface. It also allows for
    basic creation of pods and services.


    Its home page provides you with a high-level view of your cluster’s workloads:


    ![](media/file40.jpg)


    It allows you to dig into Kubernetes objects including the nodes. For instance,
    here’s the page showing details of a worker node:


    ![](media/file41.jpg)


    You may notice a “create” button located in the upper right. When clicked, a page
    that allows for creating a Deployment and an optional Service appears:


    ![](media/file42.jpg)


    The Dashboard may be installed following the instructions on the project page


    For those running on Azure AKS, there should be a link to the Dashboard on the
    details page of your cluster. When running an RBAC-enabled AKS cluster, it may
    be necessary to create the appropriate rights for the Dashboard to access you
    cluster’s details:


    kubectl create clusterrolebinding kubernetes-dashboard


    –clusterrole=cluster-admin –serviceaccount=kube-syste


    m:kubernetes-dashboard


    11.2 Visual Studio Code


    Routine work with a Kubernetes cluster involves manipulating YAML files, which
    are text files. This needs a good text editor. In case you don’t have one already,
    I can only recommend Visual Studio Code since it is lightweight, flexible and
    cross-platform.


    Visual Studio Code is customized through the use of extensions. Click on the “Extensions”
    button in the toolbar (located to the left). There’s a Kubernetes extension from
    Microsoft (ms-kubernetes-tools.vscode-kubernetes-tools) that provides a GUI for
    mundane Kubernetes and Helm (see later) tasks. It’s like a mix between the Kubernetes
    Dashboard and kubectl and I can only recommend it. Here’s the extension in action:


    ![](media/file43.jpg)


    11.3 Helm


    In a later chapter we’ll learn about Helm and how to create charts that can be
    deployed using Helm. It’s a common deployment tool in the Kubernetes world since
    it takes Kubernetes deployments one step further. Per se, Kubernetes deployments
    are easy and great in comparison to what someone could achieve without it, but
    Helm makes the following actions easy:


    vary deployments according to parameters


    deploy several resources as one single entity


    rollback the deployment


    It’s not yet time to create our Helm charts , but we’ll need to use Helm in order
    to deploy an Ingress controller and then to create our charts so let me introduce
    it. Basically, Helm is installed both on your deployment machine (your machine
    or CD server) and in the Kubernetes cluster. The component installed inside the
    cluster is called Tiller . Tiller tracks the deployments made and takes care of
    upgrading or rolling them back when required to do so. From a conceptual standpoint
    a Helm installation looks like this:


    ![](media/file44.jpg)'
