    如果你不使用容器，运维（Ops）需要处理你的托管环境：运行时、库以及你的应用程序所需的操作系统。另一方面，当使用容器时，他们只需要一种单一的方法，就可以处理你提供的容器，无论里面装的是什么。你大可以使用
    `.NET Core`、`Java`、`Node.JS`、`PHP`、`Python` 或其他开发工具：只要你的代码是容器化的，对他们来说就无关紧要。在 DevOps
    方面这对于容器来说是一个巨大的优势。


    在“带有常用开发配置的 Docker”一章中，我们将看到如何为特定的开发技术创建容器镜像。但你的运维人员并不知道你是如何创建镜像的，他们只看到容器镜像。


    ### 1.2 它解决了依赖冲突


    一个典型的 Web 应用看起来如下：


    ![](img/file1.jpg)


    该应用由 HTTP 服务器提供的文件（这里是 `Apache`，但也可以是 `Kestrel`、`IIS`、`NGINX` 等）、一个运行时（这里是 `PHP
    5.6`）和一个开发框架（这里是 `Wordpress 4.9`）组成。


    如果没有容器，依赖项和文件都将放在同一个服务器上。由于管理这些依赖项非常耗时，类似的应用通常会被分组在同一台服务器上，共享它们的依赖项：


    ![](img/file2.jpg)


    现在假设你想将 `PHP` 运行时从版本 `5.6`升级到 `7.2`。但版本更改会导致应用发生破坏性变化，因此应用也需要更新。在进行升级时，你需要同时更新
    `App 1` 和 `App 2`。在一个可能托管了许多此类应用的服务器上，这将是一项艰巨的任务，你可能需要推迟升级直到所有应用都准备就绪。


    另一个类似的问题是你想在同一台服务器上托管例如 `App 3`，但 `App 3` 使用 `Node.JS` 运行时以及一个包，该包在安装时会更改 `PHP`
    运行时所使用的依赖项。运行时之间的冲突並不罕见，所以你可能已经遇到过这个问题了。


    容器解决了这个问题，因为每个应用都将运行在自己的容器中，并拥有自己的依赖项。你典型的服务器看起来像这样：


    ![](img/file3.jpg)


    每个容器都封装了它自己的依赖项。这意味着你可以在容器中将 `PHP` 运行时从 `5.6` 版本迁移到 `7.2` 而不影响其他容器。任何其他使用例如 `Node.JS`
    的容器都不会干扰任何 `Wordpress` 容器。


    ### 1.3 它允许轻松水平扩展


    当服务器应用需要处理比单台服务器处理能力更高的流量时，解决方案是众而易知的：在它前面放置一个反向代理，并根据需要复制服务器。在我们之前的 `Wordpress`
    应用示例中，这意味着将服务器连同所有的依赖项一起复制：


    ![](img/file4.jpg)


    这在升级时只会让情况变得糟糕：我们需要升级每台服务器的依赖项，以及可能引发的所有冲突。


    再次，容器对这个问题提供了解决方案。正如我们将在“基础概念”章节中看到的，容器是基于镜像的。你只需要从单个镜像运行你任意数量的容器，它们都将拥有完全相同的依赖项。


    更好的是：当使用编排器（orchestrator）时，你只需要说明你想运行多少个容器、镜像名称，编排器就会在你所有的 Docker 服务器上创建相应数量的容器。我们将在编排器部分看到这些。它看起来是这样：


    ![](img/file5.png)


    ### 1.4 它允许无缝升级


    即使在扩展后的场景中，基于容器的方法也让一个原本复杂的概念变得轻而易举。如果没有容器，如果你喜欢的管理员必须更新包括依赖项在内的每台服务器，他将不会高兴：


    ![](img/file6.jpg)


    当然，在这种情况下，更新过程将取决于应用及其依赖项。如果你想活命，就别尝试向你的管理员提什么 DevOps 了。


    通过使用容器，只需要告诉编排器你想运行新版本的镜像即可，它将逐渐将每个容器替换为另一个运行新版本的容器。无论容器内部运行的是什么技术栈，这都是一个简单的命令（事实上，正如我们将看到的，只需更改一行）。


    下面的插图展示了这一过程：编排器替换一个容器，然后移动到其他容器。在新容器准备就绪之前，流量将被路由到旧版本的容器，这样就不会有服务中断。


    ![](img/file7.png)


    ### 1.5 国际贸易早已在使用容器


    当然，你可能在奇怪我为什么要做这样的比较。你甚至可能在评估我有多疯狂，或者考虑是否要回到买书的地方退书。别再想了：我不疯。国际贸易面临着同样的交付问题：我们正试图尽可能流畅地交付软件，而商业需要尽可能流畅地交付货物。


    在过去，装载一艘船货物需要几天时间：


    ![](img/file8.jpg)


    经典的装船方式


    船在码头停留几天，期间每件货物都被装入其中。货物的大小不一，处理要求也不同，而船也有不同类型和尺寸的存储空间。这使得装载（卸载）变成了一个缓慢的过程。缓慢且昂贵：它需要许多人操作，而且船和货的固定是有成本的。


    找到了解决方案：容器。这个想法非常简单：使用标准尺寸的箱子，并在里面装入你任何东西。你现在只需要处理标准的箱，无论里面装的是什么。问题解决了：船可以根据许多容器


    ![](img/file9.jpg)


    集装箱装船


    事实上，整个运输链（火车、卡车）都可以根据标准高效管理容器：


    ![](img/file10.jpg)


    货运火车


    信不信由：Docker 容器非常相似。当你创建一个镜像时，你把软件装进容器。当机器运行它时，容器被创建。容器镜像和容器可以以标准方式管理，从而在容器化软件的生命周期内提供标准的解决方案：


    - 通用的构建；

    - 通用的镜像存储；

    - 通用的扩展方式；

    - 通用的运行容器托管；

    - 通用的运行容器控制和监控；

    - 通用的更新运行容器到新版本。


    最重要的部分是：无论容器内部是什么软件，都可以以通的方式处理。这不是 DevOps 的梦想吗？


    # 2. 为什么需要 Kubernetes?


    ## 2.1 容器编排的需求


    当你高度依赖容器或高负载时，管理容器将引发许多问题。思考如何：


    - 部署和维护使用许多容器的应用。

    - 部署和维护在不同机器上生成容器的应用。

    - 管理容器使用的资源。

    - 通过添加和删除容器来扩展应用，可能跨越不同的机器或动态配置的机器。

    - 更新你的应用程序。

    - 在不中断应用程序的情况下更新运行应用程序的服务器。

    - 从一个主机切换到另一个主机。


    这些问题被容器编排系统优雅地解决了。Kubernetes 就是这样一个容器编排平台。你可以把它看作是容器的操作系统。它自动执行跨主机集群的容器化应用的部署、扩展和运行。


    ## 2.2 什么是 K8s?


    K8s 仅仅是 Kubernetes 的缩写。取开头 K 和结尾 s 之间的字母，数数它们的个数并用该数字替换它们。由于 `ubernete` 是 8 个字母，它可以被替换为
    `8`，从而得到 K8s。


    '
- fmt: '

    While we’re at it, there’s a complete Kubernetes glossary on the Kubernetes site.


    ## 3. Get Docker up and running


    ### 3.1 Various products for various needs


    In a production environment that runs containers that host critical applications,
    you’d rather let your favorite admins install `Docker Enterprise`.


    On your development machine or a continuous integration build machine though,
    you can simply use the free `Docker Engine Community` or `Docker Desktop` (depending
    on your machine type).


    In short:


    The rest of this chapter will point you to installation steps for various platforms.


    ### Hello world test


    Whatever the edition you install, you can check your installation by running the
    following command in a command-line (your terminal on Linux, or PowerShell on
    Windows):


    ```

    docker run hello-world

    ```


    It should pull an image and output text that begins with:


    Hello from Docker!


    This message shows that your installation appears to be working correctly.


    ### 3.2 Community on a developer or CI machine


    #### Windows 10

    `Docker Desktop` requires a Professional or Enterprise 64-bit edition of Windows
    10, because it is based on `Hyper-V`.


    In case you have a desktop version of Windows that doesn’t meet the requirements,
    you may use the older `Docker Toolbox` based on `VirtualBox`.


    Before you install `Docker Desktop` it’s important that you:

    - enable `Hyper-V`

    - enable hardware virtualization in the `BIOS`


    Then, follow this link and follow the instructions found there.


    During installation, you will be prompted whether to use Windows or Linux containers.
    I’d suggest Linux containers because:

    - you can change your mind at any moment later on, just right-click the Docker
    icon in your toolbar and select “Switch to Windows containers...”.

    - most containers images are based on Linux as of now.


    #### Linux

    There are other Docker packages available and you can simply follow the steps
    depending on your version:

    - CentOS 7

    - Debian or Raspbian

    - Fedora 26+ 64-bit

    - Ubuntu Bionic, Xenial or Trusty 64-bit


    Whatever your Linux flavor, there are common post-installation steps here. Make
    sure that you read them carefully, more so if you cannot successfully run the
    `hello-world` test.


    #### Mac

    `Docker Desktop` requires a Mac OS Sierra 10.12 or above.


    In case you have an older macOS version, you may use the older `Docker Toolbox`
    based on `VirtualBox`.


    At the bottom of this page are the instructions on installing `Docker Desktop`.


    ### 3.3 Enterprise on a Server


    #### Windows Server 2016

    `Docker Enterprise` is available at no additional cost to Windows Server 2016
    customers. Just follow the instructions.


    #### Linux

    `Docker Enterprise` can be ran on CentOs, Red Hat, SUSE, Ubuntu and more. Check
    here to see if your edition of Linux is supported.


    #### Cloud

    `Docker Enterprise` is available as a template for `Azure` and for `AWS`.


    ## 4. Basic concepts


    There are three concepts I need you to grasp so that we can begin smoothly: `containers`,
    `images` and `registries`.


    A `container` is what we eventually want to run and host in Docker. You can think
    of it as an isolated machine. Or a virtual machine if you prefer.


    From a conceptual point of view, a `container` runs inside the `Docker host` isolated
    from the other containers and even the host OS. It cannot see the other containers,
    physical storage, or get incoming connections unless you explicitly state that
    it can. It contains everything it needs to run: OS, packages, runtimes, files,
    environment variables, standard input and output.


    Your typical Docker server would look like this - a host for many containers:


    ![](media/file11.jpg)


    The fact that there are two `app2` containers in the schema above is normal: this
    is typically the case when a server hosts a release and a test version. Which
    means you could host both versions on the same server. In fact, each container
    has its own `ID` but let’s keep things simple for now.


    Any `container` that runs is created from an `image`. An `image` describes everything
    that is needed to create a `container`: it is a template for containers. You may
    create as many containers as needed from a single `image`.


    The whole picture looks like:


    ![](media/file12.jpg)


    `Images` are stored in a `registry`. In the example above, the `app2` image is
    used to create two containers. Each container lives its own life, and they both
    share a common root: their image from the `registry`.


    In the next chapters, you’re going to learn how to run containers from existing
    images, then you’ll learn to create your own images and upload them to registries.


    ## 5. Use Docker images


    ### 5.1 Do-it-yourself: run a container


    Run the following command on a command-line:


    ```

    docker run hello-world

    ```


    You can see the following text output:


    ![](media/file13.jpg)


    Congratulations, you just ran your first container! Here’s what just happened
    in detail:

    - Your command asks Docker to create and run a container based on the `hello-world`
    image.

    - Since the `hello-world` image wasn’t present already on your disk, Docker downloaded
    it from a default registry, the `Docker Hub`. More about that later.

    - Docker created a container based on the `hello-world` image.

    - The `hello-world` image states that when started it should output some text
    to the console, so this is the text you see as the container is ran.

    - The container stopped.


    Here’s what you did, slightly simplified:


    ![](media/file14.jpg)


    If you run exactly the same command again, you’ll see that all steps above are
    repeated except for step 2: since the image is already present on your machine,
    it is not downloaded again. This is a simple optimization, but you’ll see later
    that Docker optimizes many more steps. As such, Docker makes scarce use of a machine’s
    resources.


    ### 5.2 Container management commands


    You can get help for Docker commands from the command-line using the `--help`
    switch. For instance, in order to know more about the `docker run` command we
    just used, you could type:


    ```

    docker run --help

    ```


    You may use the following commands for container management:

    - `docker ps`: lists the containers that are still running. Add the `-a` switch
    in order to see containers that stopped.

    - `docker logs`: retrieves the logs of a container, even when it has stopped.

    - `docker inspect`: get detailed information about a running or stopped container.

    - `docker stop`: delete a container that is still running.

    - `docker rm`: delete container.


    ### 5.3 Do-it-yourself: post-mortem inspection


    The container we ran previously stopped because its only job was to output some
    text. We’ll soon run more containers, but let’s play with that stopped container
    in order to get to grips with the container tooling.


    Run the following command on a command-line:


    ```

    docker ps

    ```


    There is no output because no container is currently running on your machine.
    Now run the following command on a command-line:


    ```

    docker ps -a

    ```


    You should see output similar to the one below (the exact container ID varies):
    Note the container ID. It allows you to run commands on that container. Run the
    following command (replacing the ID with your container ID):


    ```

    docker logs 487f673b3

    ```


    That command outputs exactly the same text you saw when you ran the container.
    This is the standard output of the container. In real-world scenarios, you’ll
    have containers running in the background (web servers for instance) and that
    command will allow you to have a look at their output.


    Run the following command (replacing the ID with your container ID):


    ```

    docker inspect 487f673b3

    ```


    That gets you lots of information about many aspects of the container - whether
    it is still running or stopped. Again, in real-world scenarios that may prove
    useful for understanding what happens inside your containers.


    All of that information takes up space and once you’re completely done with a
    stopped container you may want to reclaim that space. That’s what the `docker
    rm` command is for.


    Run the following command (replacing the ID with your container ID):


    ```

    docker rm 487f673b3

    ```


    Now you can make sure that the container isn’t there anymore by running the above
    commands:


    ```

    docker ps -a

    ```

