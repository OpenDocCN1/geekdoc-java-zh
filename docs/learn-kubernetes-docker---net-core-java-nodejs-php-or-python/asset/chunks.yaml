    Pods 是你想要运行的实际软件单元，而节点（nodes）是运行这些单元的硬件部分。将节点视为可以运行你 Pod 的资源。Pods 需要 CPU 和内存，而节点提供这些
    CPU 和内存。节点作为 Kubernetes 集群的一部分，允许它们分布在整个集群中，这样我们就可以获得许多优势，例如韧性、高可用性和水平伸缩性。


    节点有两种类型：工作节点（worker nodes）和主节点（master nodes）。我们刚刚看到的架构图只显示了工作节点，因为那些是真正运行你 Pod
    的节点。主节点不运行你的 Pod：它们控制工作节点，以确保它们遵循你的意愿。我们已经看到 Kubernetes 集群的生存目标是运行你的 Pod，而主节点正是实现这一切的者。


    这是我们的集群，现在包含了主节点：


    ![](img/file36.jpg)


    主节点之于工作节点，就像现实生活中管理者之于技术人员的关系：它们的工作是确保他人执行可见的工作。就像开发者编写实际软件，而他们的经理将待编写的软件任务分配给可用的开发者一样，工作节点运行实际面向用户的软件（Pods），而它们的主节点将待运行的
    Pod 分配到可用的工作节点上。


    可以有一个主节点，但通常为了实现高可用性会有多个主节点。无论是一个还是多个主节点，它们在逻辑上被组合在一起形成我们所说的控制平面（control plane）。


    工作节点是非关键资源。万一其中一个节点发生，控制平面将在剩余节点上启动新 Pod，以替换在丢失节点上运行的 Pod。你需要确定你的集群需要多少个工作节点：节点太多意味着你无法充分利用每个节点的容量，但节点太少意味着你可能无法承受丢失某些节点的代价。希望节点可以动态添加和删除。


    控制平面通过其 `API server` 接收你的指令。每个工作节点都运行一个 `kubelet` 守护进程，允许控制平面管理其 Pod 和其他资源。


    由于你的 Kubernetes 集群希望确保你的 Pod 按预期运行，它还使用了几个额外的组件：


    ![](img/file37.jpg)


    为了在 Kubernetes 中迈出第一步，你不需要理解这些额外的组件，因此之前的架构图是一个很好的简版参考。但是，请允许我向你介绍将让我们的 Kubernetes
    集群更强大的“隐藏工人”。


    `etcd` 是一个数据库，存储了集群的期望状态，以便控制平面可以在工作节点上采取适当行动，无论发生什么情况，都能达到并保持该状态。你的集群内部可能会发生很多事情：工作节点可能变得不可用，或者新节点可能加入集群，某个
    Pod 可能会死亡或需要更新或扩展。得益于 `etcd` 数据库，控制平面可以确保它有一份关于需要达到什么状态的参考。只要有一半的主节点可用，`etcd`
    就能正常工作。


    `kube-scheduler` 负责在正确的节点上创建 Pod，而 `kube-controller-manager` 确保所需数量的 Pod 以预期的状态运行。


    现在我们已经有了全局视图，可以回到 Kubernetes 集群更简单的表示方式：


    ![](img/file35.jpg)


    当我们每天在集群上运行应用程序时，重要的是 Kubernetes 提供了一种“工作节点/Pod”抽象：Pods 是你的软件单元，可以原子化地运行，而工作节点是硬件单元，提供运行这些单元所需的
    CPU 和内存资源。你的软件需要 CPU 和内存，Kubernetes 在所有可用的工作节点上分配这些资源。


    ## 10.2 创建集群


    有多种方法可以获取运行中的 Kubernetes 集群，你的选择取决于你想对它做什么。选择可分为 3 类：


    我们现在想要的是一个可以工作的 Kubernetes，这样我们就可以学习如何使用 Kubernetes，并为生产集群准备工作负载，因此“开发工作站”解决方案是我们将奔向的目标。但是，为了运行面向用户的应用程序，我们需要一个私有的或云
    PaaS Kubernetes 集群。让我们回顾一下这些。


    ### 开发工作站


    在将应用程序发送到远端生产集群之前，你更倾向于在机器的 Kubernetes 集群上进行设置和测试，这就是为什么你需要在开发机器上拥有本地 Kubernetes
    集群的原因之一。其他原因和你为任何开发平台安装本地设置而不是使用远程设置的原因相同。


    幸运的是，在大多数情况下，在机器上设置 Kubernetes 集群是一项简单任务。至少有两个选项：`Docker Desktop` 和 `Minikube`。它们都建立一个单节点
    Kubernetes 集群。


    `Docker Desktop` 包含了 Docker 开发工具以及开箱即用的 Kubernetes 集群。如果你要在集群中运行 Docker 容器，这是一个很好的选择，特别是在
    Windows 和 Mac 机器。


    `Minikube` 更加灵活。它让你决定想使用的 Kubernetes 版本、安装哪些扩展以及需要哪种容器运行时。灵活性是有代价的，所以要准备花一些时间设置，但在
    Linux 机器上它非常简单。


    ### 云 PaaS


    对于你的生产工作负载，你可以从主要的云提供商获取 Kubernetes 集群。这些集群的基础设置通常是一项枯燥的任务，而升级或保护集群等活动大多是不费力的或自动的。


    使用 PaaS Kubernetes 集群的另一个优势是你可以根据需要添加或删除节点，因为你运行在云基础设施上。由于 Kubernetes 具有伸缩能力，它是运行资源密集工作负载的完美选择，因此能够几乎无限制地添加虚拟机，对于那些面临高负载或波动工作负载的人来说无疑是一个加分项。对此，许多
    PaaS 服务允许动态节点供给。


    一些 Kubernetes 服务包括：


    - `Azure AKS`：仅对工作节点收费。你不需要管理主节点，也不为它们付费。AKS 在集群达到峰值时允许自动配置节点。

    - `Google GKE`：仅对工作节点收费，并且在集群达到峰值时允许自动配置节点。

    - `Amazon EKS`、`RedHat OpenShift`、`IBM CKS`、`Heptio Kubernetes Subscription`。


    ### 私有


    某些用例是云 Kubernetes 服务无法涵盖的。例如，我的客户需要在指定的密封数据中心创建并管理 Kubernetes 集群。`kubeadm` 是 Kubernetes
    发行版的一部分。它帮助使用 `init`、`join`、`upgrade` 和 `reset` 等基本命令设置和维护 Kubernetes 集群。


    由于 `kubeadm` 是可组合，有许多工具构建在其之上，帮助你在各种场景下设置 Kubernetes 集群。例如，你可以使用：


    - `Kubespray`：在云端或裸机上设置自定义集群。它可以使用 `Ansible` 或 `Vagrant`。

    - `Kops`：在 `AWS` 和 `GCE` 等云提供商上设置自定义集群。


    这些工具可以让你在几小时内获得运行中的集群。然而，请注意，正确地保护集群需要一些努力，维护集群确实需要时间和投入。这不仅仅是备份或升级服务器：导致使用 Kubernetes
    的业务需求通常意味着高可用性、自动扩展和可靠性，这反过来又意味着管理集群的人需要大量工作。


    如果你自己构建集群，请确保你能提供：


