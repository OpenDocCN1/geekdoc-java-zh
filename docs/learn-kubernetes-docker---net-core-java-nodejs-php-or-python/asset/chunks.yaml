    \ `Pod`. Expose the front application from the `Pod` using a `LoadBalancer` Service\
    \ that listens on port `8080`.\n\nOpen a browser and point it to `http://localhost:8080/files`\
    \ (or the public URL you obtain if running in a PaaS cluster). There is no file\
    \ in the folder. Explain why.\n\nAdd an `emptyDir` type `Volume` in the `Pod`,\
    \ and make sure it is exposed to the front and creator containers.\n\nOpen a browser\
    \ and point it to `http://localhost:8080/files`. Files should be displayed as\
    \ you refresh the page.\n\nDelete all resources created during that exercise.\n\
    \nRecreate the same `Pod` using the same containers, same `Volume` and same `Service`.\n\
    \nOpen a browser and point it to `http://localhost:8080/files`. There are no files\
    \ anymore. Explain why.\n\n## 14.4 Exercise solution\n\nCreate a file named `front-deployment.yaml`\
    \ with the following contents:\n\n```yaml\napiVersion : apps/v1beta1\nkind : Deployment\n\
    metadata :\n  name : front\nspec :\n  template :\n    metadata :\n      labels\
    \ :\n        app : front\n    spec :\n      containers :\n        - name : front\n\
    \          image : learnbook/k8s-front:0.3\n        - name : creator\n       \
    \   image : learnbook/k8s-creator:0.2\n```\n\nCreate a file named `front-service.yaml`\
    \ with the following contents:\n\n```yaml\napiVersion : v1\nkind : Service\nmetadata\
    \ :\n  name : front\nspec :\n  type : LoadBalancer\n  ports :\n    - port : 8080\n\
    \      targetPort : 80\n  selector :\n    app : front\n```\n\nOpen a command-line\
    \ in the folder where you created the above files.\n\nRun the following commands:\n\
    \n```bash\nkubectl apply -f front-deployment.yaml\nkubectl apply -f front-service.yaml\n\
    kubectl get service\n```\n\nYou should get an output similar to the following\
    \ one:\n\n> `kubectl apply -f front-deployment.yaml`\ndeployment.apps/front created\n\
    \n> `kubectl apply -f front-service.yaml`\nservice/front created\n\n> `kubectl\
    \ get deployment`\nNAME    READY  UP-TO-DATE  AVAILABLE  AGE\nfront   1/1    1\
    \               1          97s\n\n> `kubectl get service`\nNAME  TYPE        \
    \   CLUSTER-IP      EXTERNAL-IP   PORT(S)\nfront  LoadBalancer  10.102.58.78 \
    \ localhost      8080:30221/TCP\n\nPoint your browser to the `EXTERNAL-IP` returned,\
    \ in that case `http://localhost:8080/files`. You should get a page similar to\
    \ the following one:\n\n![](media/file71.jpg)\n\nThe displayed page doesn’t list\
    \ any file. This is due to the fact that the creator container creates files in\
    \ a `/shared` directory which is local to the creator container itself. The `/shared`\
    \ directory of the front container that we see listed is another directory, local\
    \ to the front container.\n\nCreate a file named `front-deployment.yaml2` with\
    \ the following contents:\n\n```yaml\napiVersion : apps/v1beta1\nkind : Deployment\n\
    metadata :\n  name : front\nspec :\n  template :\n    metadata :\n      labels\
    \ :\n        app : front\n    spec :\n      volumes :\n        - name : shared\n\
    \          emptyDir : {}\n      containers :\n        - name : front\n       \
    \   image : learnbook/k8s-front:0.3\n          volumeMounts :\n            - mountPath\
    \ : /shared\n              name : shared\n        - name : creator\n         \
    \ image : learnbook/k8s-creator:0.2\n          volumeMounts :\n            - mountPath\
    \ : /shared\n              name : shared\n```\n\nOpen a command-line in the folder\
    \ where you created the above files.\n\nRun the following command:\n\n```bash\n\
    kubectl apply -f front-deployment2.yaml\n```\n\nYou should get an output similar\
    \ to the following one:\n\n> `kubectl apply -f front-deployment2.yaml`\ndeployment.apps/front\
    \ configured\n\nRefresh the `http://localhost:8080/files` page in your browser.\
    \ Your browser should display a page similar to that one:\n\n![](media/file72.jpg)\n\
    \nRun the following commands:\n\n```bash\nkubectl delete -f .\nkubectl apply -f\
    \ front-deployment2.yaml\nkubectl apply -f front-service.yaml\n```\n\nYou should\
    \ get an output similar to the following one:\n\n> `kubectl delete -f .`\ndeployment.apps\
    \ “front” deleted\nservice “front” deleted\n\n> `kubectl apply -f front-deployment2.yaml`\n\
    deployment.apps/front created\n\n> `kubectl apply -f front-service.yaml`\nservice/front\
    \ created\n\nRefresh the `http://localhost:8080/files` page in your browser.\n\
    \n## 14.5 Persistent storage with PersistentClaims\n\n### Consuming persistent\
    \ storage\n\nThere are two ways a `PersistentVolumeClaim` actually gets persistent\
    \ storage, and it is up to the Ops to decide the strategy.\n\nThe first one is\
    \ for the cluster’s administrator to create `PersistentVolumes`, which will be\
    \ consumed by the `PersistentVolumeClaims`.\n\nThe second one is to specify a\
    \ `StorageClass` on the `PersistentVolumeClaim`, which allows for dynamic creation\
    \ of `Volumes`.\n\nIn order to handle persistent storage that you share between\
    \ `Pods`, Kubernetes provides the `PersistentVolumeClaim`. A `PersistentVolumeClaim`\
    \ exists independently from any `Pod`. \n\n### PersistentVolumeClaim declaration\n\
    \n```yaml\napiVersion : v1\nkind : PersistentVolumeClaim\nmetadata :\n  name :\
    \ claiming-disk\nspec :\n  accessModes :\n    - ReadWriteOnce\n  resources :\n\
    \    requests :\n      storage : 1 Gi\n```\n\n### Declaration of a Deployment\
    \ where the Pod consumes aVolumeClaim\n\n```yaml\napiVersion: apps/v1beta1\nkind:\
    \ Deployment\nmetadata :\n  name : front\nspec :\n  template :\n    metadata :\n\
    \      labels :\n        app : front\n    spec :\n      volumes :\n        - name\
    \ : persistent-data\n          persistentVolumeClaim :\n            claimName\
    \ : claiming-disk\n      containers :\n        - name : front\n          image\
    \ : my-image:1.0\n          volumeMounts :\n            - mountPath : /external\n\
    \              name : persistent-data\n```\n\n## 14.6 Exercise - Create and use\
    \ a PersistentVolume\n\n**Objective**: use a `PersistentVolume` to persist files\
    \ even when a `Pod` dies.\n\nUse the Deployment from the previous exercise but\
    \ replace the `emptyDir` with a reference to a `PersistentVolumeClaim` that you\
    \ create.\n\nOpen a browser and point it to `http://localhost:8080/files` (or\
    \ the public URL you obtain if running in a PaaS cluster). Files should be displayed\
    \ as you refresh the page.\n\nDelete the Deployment and Service. Refresh the browser:\
    \ the page is unavailable.\n\nRecreate the Deployment and Service.\n\nRefresh\
    \ the browser. The previous files should still be displayed as you refresh the\
    \ page. They weren’t lost as the `Pod` was deleted.\n\nDelete all resources created.\n"
