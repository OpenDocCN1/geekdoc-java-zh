    \  Ready  agent  27d19h  v1.14.6\naks-1923416-2  Ready  agent  27d19h  v1.14.6\n\
    ```\n\n```bash\nkubectl describe node aks-1923416-1\n```\n\n```text\nName:   \
    \   aks-1923416-1\nRoles:     agent\n(lots of information about that node)\n```\n\
    \nIn some environments like Azure AKS, master nodes are managed for you and won’t\
    \ get listed by a `get nodes` command. The sample above shows such an case.\n\n\
    ## 11. Tooling\n\nThere are many tools aimed at making your Kubernetes life easier.\
    \ Since Kubernetes can fully be API-driven, you could even write your own. However,\
    \ for most needs you should need only two : a text editor and `kubectl`.\n\nSince\
    \ we already saw `kubectl`, let me introduce some optional tools that may help\
    \ you through your Kubernetes path.\n\n### 11.1 Kubernetes Dashboard\n\nThough\
    \ `kubectl` is an extremely powerful swiss-knife tool for Kubernetes, those who\
    \ aren’t used to command-line interfaces often turn to me with an anxious face\
    \ asking whether there is a graphical tool. Yes, there is, and it’s the Kubernetes\
    \ Dashboard. Not an essential tool, but one that may reassure those used to graphical\
    \ user interfaces instead of command-line tools.\n\nThe Dashboard is a web interface\
    \ which may be accessed using a browser. It allows for simple cluster supervision\
    \ in a user-friendly interface.\n\n![](media/file40.jpg)\n\nIts page provides\
