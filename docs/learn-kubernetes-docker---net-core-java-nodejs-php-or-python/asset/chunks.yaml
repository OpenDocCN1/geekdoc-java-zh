    15.5 Secret


    Secrets are very similar to ConfigMap objects, and offer a few extra features
    geared toward storing information that needs to be secured.


    Secrets add an extra level of security but they are far from very secure. You
    need to make sure that only the appropriate users or Pods can access them; this
    is done by assigning the correct roles to User and ServiceAccount objects (see
    RBAC ). Also be aware that they don’t provide for auditing or access control checks
    at a glance that some regulations may require your cluster to conform to. Secrets
    may be “good enough” security solution for simple needs, but for secure secrets
    management you will need more robust solutions like Azure Key Vault.


    A Secret may be created using a configuration file:


    apiVersion : v1 kind : Secret metadata :


    name : secret - values stringData :


    key1 : “secret value1”


    key2 : “secret value2”


    If the secret data isn’t encrypted, you probably don’t want it to appear in a
    clear text file like the one above. You are better off using the kubectl create
    secret command to create them.


    Using a Secret in a Pod is exactly like using a ConfigMap: you can consume it
    as environment variables or files, as shown in the following definitions.


    Consuming a secret as files


    apiVersion : apps / v1beta1 kind : Deployment spec :


    template :


    spec :


    volumes :


    *   name : config - volume


    secret :


    secretName : secret - values


    containers :


    *   name : front


    image : learnbook / k8s - front : 0.4


