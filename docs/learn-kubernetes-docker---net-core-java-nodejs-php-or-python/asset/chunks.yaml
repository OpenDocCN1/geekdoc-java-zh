    5.4 More about docker run


    You can think of the docker run command as the equivalent of buying a new computer,
    executing some command on it, then trashing it. Really. Each time a container
    is created from an image you get a new isolated and virgin environment to play
    with inside the container.


    What you get inside the container depends on which image your container is based
    on. After the image name, you can pass commands to execute inside the container.


    Let’s illustrate the new-computer-that-you-trash metaphor using the alpine image.
    The alpine image is a very small Linux image that does enough for our purpose.


    Let’s run a container and ask it to display its hostname.


    docker run alpine printenv


    We basically ask for a container to be created using the alpine image, and for
    the container to execute the printenv command that is one of the binary programs
    packed in the alpine image.


    Without surprise, the alpine image is downloaded in order to create the container,
    since it was not present on my disk already.


    The result is the following:


    ![](media/file16.jpg)


    Now let’s run two more containers and ask them to display their respective hostnames.


    docker run alpine printenv


    docker run alpine printenv


    This is the same command as above, repeated twice. On each line we’re asking for
    a new container to be created using the alpine image, and for the container to
    execute the printenv command.


    The alpine image isn’t downloaded because it is already on our disk. Two more
    independent containers are created. The result is the following:


    ![](media/file17.jpg)


    Note that inside each container the displayed hostname is different. See? You
    get the equivalent of a new machine on each container.


    Here is a simplified schema of what I did:


    ![](media/file18.jpg)


    What I want you to understand is that Docker is a tool that allows you to get
    the equivalent of a disposable, single-time use computer. Once you get that clear,
    a whole new world opens for you. You come from a world where obtaining a new machine
    and configuring it required enough efforts to justify keeping it, with all the
    side effects that meant on each subsequent use; in the containers’ world, getting
    a brand new environment is cheap enough for us to get many, many of them.


    If I list the stopped containers on my machine (docker ps -a) I’ll get 3 stopped
    containers since I just asked for that number of containers to be created. Being
    quite lazy, I don’t want to remove them one by one, so I use the following handy
    command:


    docker container prune -f


    This is simply the equivalent of running one docker rm command for each stopped
    container. The -f switch is an implicit confirmation to proceed and delete all
    stopped containers right away, instead of asking to confirm that operation.


    5.5 Running a server container


    We just saw how to run short-lived containers. They usually do some processing
    and output something. There’s a very common use for long-lived containers however:
    server containers. Whether you want to host a web application, an API or a database,
    you want a container that listens for incoming network connections and is potentially
    long-lived.


    A word of warning: it’s best not to think about containers as long-lived, even
    when they are. Don’t store information inside the containers. In other words,
    ensure your containers are stateless not stateful. We’ll see later how and where
    to store your container’s state. Docker containers are very stable, but the reason
    for having stateless containers is that this allows for easy scaling up and recovery.
    More about that later.


    In short, a server container


    is long-lived;


    listens for incoming network connections.


    How can we manage that ? Read on.


    Running a long-lived container


    Up to now we remained connected to the container from our command line using the
    docker run command. That makes it impractical for running long-lived containers.


    To disconnect while allowing the long-lived container to continue running in the
    background, we use the -d or –detach switch on the the docker run command.


    Running a container as detached means that you immediately get your command-line
    back and the standard output from the container is not redirected to your command-line
    anymore.


    Suppose I want to run a ping command. I can use a Linux alpine container for this:


    docker run alpine ping www.docker.com


    ![](media/file19.jpg)


    The ping command doesn’t end since it keeps pinging the Docker server. That’s
    a long-lived container. I can detach from it using the Ctrl-C shortcut, and it
    keeps running in the background. But it’s best to run it as detached from the
    beginning:


    docker run -d alpine ping www.docker.com


    Note the addition of a -d switch. When doing so, the container is started but
    we don’t see its output. Instead, the docker run command returns the ID of the
    container that was just created:


    ![](media/file20.jpg)


    The container ID is long. You don’t need to write it completely in your commands
    however. As long as there is no ambiguity, you can use the beginning of the container
    ID in commands that require the container ID like docker logs or docker run .
    That comes very handy when you’re managing containers manually.


    The container is still running. I can see it using a docker ps command that outputs
    something like:


    The status means the container has been running for 2 minutes and is still alive.


    I can interact with the running container using commands we saw above: docker
    logs to see its output, docker inspect to get detailed information, and even docker
    stop in order to kill it.


    Let’s look at the standard output of the container using the following command
    (note I use only the beginning of the container ID):


    docker logs 789b


    That prints the whole standard output of the container from its beginning, which
    may be long. But we can get just a portion of the output using the –from , –until
    or –tail switches. Let’s see the latest 10 seconds of logs for our running container:


    docker logs –since 10s 789b


    ![](media/file21.jpg)


    In real-world applications with many running containers you would typically redirect
    your containers’ output to log management services, but anyway it can still be
    useful to get the last output of a container for debugging purposes.


    A long-running container is bound to run for quite some time, but for now I’m
    going to stop and clean up that container. So I just use:


    docker stop 789b


    docker rm 789b


    docker ps -a


    The last command is just here so that I can check that the container is completely
    gone.


    Listening for incoming network connections


    By default a container runs in isolation and as such, it doesn’t listen for incoming
    connections on the machine where it is running. You must explicitly open a port
    on the host machine and map it to a port on the container.


    Suppose I want to run the NGINX web server. It listens for incoming HTTP requests
    on port 80 by default. If I simply run it, my machine will not route incoming
    requests to it unless I use the -p switch on the docker run command.


    The -p switch takes two parameters: the incoming port you want to open on the
    host machine, and the port to which it should be mapped inside the container.
    For instance, here is how I state that I want my machine to listen for incoming
    connections on port 8085 and route them to port 80 inside a container that runs
    NGINX:


    docker run -d -p 8085:80 nginx


    Note the -d switch. Not mandatory, but since I’m running a server container it’s
    a good idea to keep in the background. An NGINX server container is started and
    I get its ID:


    ![](media/file22.jpg)


    Now I can run a browser and query that server using the http://localhost:8085
    URL:


    ![](media/file23.jpg)


    Since that container is running in the background, its output isn’t displayed
    in my terminal. But I can get it using a docker logs command:


    docker logs 8451526dbe11'
