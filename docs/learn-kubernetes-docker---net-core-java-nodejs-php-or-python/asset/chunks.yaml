    \ you should get an output similar to the following:\n\n```text\nClient Version:\
    \ version.Info{Major:“1”, Minor: … }\nServer Version: version.Info{Major:“1”,\
    \ Minor: … }\n```\n\nThe Client part shows what you have on your machine, and\
    \ the Server part shows information about the Kubernetes cluster. But wait, which\
    \ cluster? And what if nothing appears in the Server part on your machine?\n\n\
    ### Kubectl contexts\n\nThe `kubectl` tool connects to a Kubernetes cluster thanks\
    \ to a `context`. Each context stores credentials for a given user in a given\
    \ cluster.\n\nHaving several contexts is an obvious way to connect to different\
    \ clusters (development and production clusters for instance), but it also is\
    \ an handy way to connect to the same cluster using different credentials. For\
    \ instance it allows you to test that the credentials used by a CI/CD tool work\
    \ correctly.\n\nYou can list the current contexts using the `get-contexts` command:\n\
    \n```bash\nkubectl config get-contexts\n```\n\n```text\nCURRENT  NAME\n      \
    \    some-cluster\n          anotherOne\n*       docker-desktop\n          cloudk8s\n\
    ```\n\nNote the star to the left of “my-cluster”. It indicates that this is the\
    \ current cluster. In other words, any command issued using the `kubectl` tool\
    \ will act on that cluster.\n\nIn order to use another context, you can use the\
    \ following command:\n\n```bash\nkubectl config use-context<context-name></context-name>\n\
    ```\n\nIn case you installed Docker Desktop, it enables you to list and switch\
    \ contexts using a right-click on it system tray icon.\n\nOftentimes the tools\
    \ you will use to connect to clusters you create will create a new context entry\
    \ for you, but you may add entries using the `set-cluster`, `set-credentials`\
    \ and `set-context` subcommands of the `kubectl config` command.\n\n### Basic\
    \ commands\n\nFrom there, we can use some `kubectl` commands:\n\n![](media/file39.jpg)\n\
    \nThe `get nodes` command lists the master and worker nodes of your cluster. The\
