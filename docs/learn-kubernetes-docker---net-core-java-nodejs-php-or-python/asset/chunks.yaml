    Create a Docker image that runs this code using the `node:11-alpine` image that
    contains Node.JS. The command that runs a JavaScript program using Node.JS is
    `node <filename>`.


    You may find the source code for the `compute.js` file in the `create-docker-images/exercises/jsimage/starter`
    folder, and the source code for the solution in the `create-docker-images/exercises/jsimage/solution`
    folder.


    ## 6.5 Exercise solution


    Create a file named `Dockerfile` and add the following code to it:


    ```docker

    FROM node:11-alpine

    COPY compute.js .


    CMD node compute.js

    ```


    Open a command-line. Change the current directory to the directory where you created
    the `Dockerfile` and the `compute.js` file.


    Run the following command:


    ```bash

    docker build -t jsimage .

    ```


    Once the image has been built, run the following command:


    ```bash

    docker run –rm jsimage

    ```


    You can see an output similar to that one:


    ![](media/file31.png)


    ## 6.6 Tags matter


    We saw earlier that image names include a name and tag. As a quick reminder about
    this, an image name is:


    `<repository_name>/<name>:<tag>`


    `tag` is optional. When missing, it is considered to be `latest`.


    `repository_name` may be a registry DNS or the name of a registry in the Docker
    Hub.


    While your images aren’t published to a registry (which is what we do in this
    chapter, but that will change in the next one) you don’t need to include a registry
    name. So your image name is:


    `<name>:<tag>`


    ### The latest tag


    In my demonstrations I didn’t include a tag, hence the default `latest` tag was
    used. For instance, the actual image name was `hello:latest` when I ran the following
    command:


    ```bash

    docker build -t hello .

    ```


    As long as you are creating simple software, running on a simple CI/CD pipeline,
    it can be fine to use the `latest` tag. In a simple scenario, you may:


    - update the source code;

    - build a new image with the `latest` tag;

    - run a new container with the newest image;

    - kill the previous container.


    There’s a caveat with this however: when using the `docker run hello` command
    on a distant machine (which actually means `docker run hello:latest`), the distant
    machine has no means to know that there is a newer version of the `hello:latest`
    image, so you need to run the `docker pull hello` on the distant machine in order
    for the newest version of your image to be downloaded to that machine.


    This may sound awkward an that’s one reason for not just using the `latest` tag.


    ### Why would you tag your images?


    Other reasons soon come once you become more serious with your CI/CD pipeline.
    For instance, you may want any or all of the following features:


    - be able to rollback to a previous version if you detect a problem with the latest
    image;

    - run different versions in different environments, for instance the `latest`
    version in a test environment and the previous version in a production environment;

    - run different versions at the same time, routing some users to the latest version
    and some to the previous versions (known as canary release);

    - deploy different versions to different users, and be able to run whatever version
    on your development machine while you support them.


    Those are all good reasons for tagging your images. If you ensure each released
    image has a different tag, you can run any of the scenarios mentioned above.


    You’re free to tag your images however you want. Common tags include:


    - a version number, e.g. `hello:1.0`, `hello:1.1`, `hello:1.2`

    - a Git commit tag, e.g. `hello:2cd7e376`, `hello:b43a14bb`


    In order to apply a tag, just state it during your build command:


    ```bash

    docker build -t hello:1.0 .

    ```


    ### Tags for base images


    Remember your images are based on other images. This is done using the `FROM`
    instruction in your `Dockerfile` file. Just as you can tag your images, the base
    image you use may be the `latest` one or a tagged one.


    In my demos I used tagged images. For instance, I based my server image on the
    `nginx:1.15` base image. It’s quite tempting to base your images on the latest
    ones so that you’re always running on up-to-date software, especially since it’s
    very easy: all you need to do is omit the tag or state the `latest` one. So you
    could be tempted to use the following instruction in your `Dockerfile` file:


    ```dockerfile

    FROM nginx:latest

    ```


    Don’t. First, it doesn’t mean that any container running will be based on the
    latest available version of the `nginx` image. Docker is about having reproducible
    image, so the latest version is evaluated when you build your image, not when
    the container is ran. It means that the version will not change unless you run
    the `docker build` command again.


    Second, you’re likely to run into trouble. What about the `nginx` image releasing
    a new version with breaking changes? If you build your image again, you’re likely
    to get a broken image.


    For these reasons, I recommend specifying the image tag. If you want to keep up
    to date with new releases of the base image, update the tag manually and make
    sure you test your image before releasing it.


    ## 6.7 Parameters as environment variables


    In real life, a container’s inputs and outputs are likely to vary according to
    its environment. For instance, if you run a web application it is likely to connect
    to a database and listen for incoming requests on a given DNS. The database connection
    details and DNS will have different values on a development machine, on the test
    server and the production server.


    ### Reading a value


    Whatever the technology you use inside your container, you can access environment
    variables. For instance, if you run a web application it is likely to connect
    to a database and listen for incoming requests on a given DNS. The database connection
    details and DNS will have different values on a development machine, on the test
    server and the production server.


    ### Providing a value


    On a real machine, environment variables are set from several sources. Inside
    a container, they can be set. In order to provide an environment variable at runtime,
    you simply use the `-e=value` parameter.


    ### Default value


    You may also want to define a default value for an environment variable, in case
    it isn’t provided. This may be done in the `Dockerfile` file, using the `ENV`
    instruction. For instance:


    ```dockerfile

    ENV name=Dockie

    ```


    It’s good practice to add a `ENV` instruction for every environment variable your
    image expects, since it documents your image.


    ### Sample usage


    I want to create an image that can ping any given site. I’ll do this using a Linux
    shell script. I define it in `ping.sh` file:


    ```sh

    #!/bin/sh

    echo “Pinging $host …”

    ping -c 5 $host

    ```


    Note that I make use of a `host` environment variable. I’m going to define an
    image that includes and runs that script:


    ```dockerfile

    FROM debian:8

    ENV host=www.google.com

    COPY ping.sh .

    CMD ["sh", "ping.sh"]

    ```


    Note that my `Dockerfile` file includes an `ENV` instruction that specifies that
    the `host` variable will be `www.google.com` in case it isn’t provided. I create
    my image from that `Dockerfile` file by running a `docker build` command:


    ```bash

    docker build -t pinger .

    ```


    Next, I run two containers based on that image:


    ```bash

    docker run –rm pinger

    docker run –rm -e host=www.bing.com pinger

    ```


    The first one isn’t provided any value for the `host` environment variable so
    it defaults to the `www.google.com` value specified in the `Dockerfile` file.
    The second container is provided the `www.bing.com` value. Here’s the output from
    those two containers (shortened for brevity):


    ```text

    C:>docker run –rm pinger

    Pinging www.google.com…

    PING www.google.com (172.217.18.196) 56(84) bytes of data

    64 bytes from par10s38-in-f4.1e100.net (172.217.18.196)\

    icmp_seq=1 ttl=37 time=6.52 ms

    ...

    64 bytes from par10s38-in-f4.1e100.net (172.217.18.196)\

    icmp_seq=5 ttl=37 time=7.35 ms

    ```

