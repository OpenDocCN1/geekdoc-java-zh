    13.7 Ingress


    An Ingress is a Kubernetes object used to add extra power to Services. Ingresses
    add an extra layer between inbound connections and Services. They are an abstraction
    for reverse proxies.


    ![](media/file68.jpg)


    Some of the benefits of using Ingresses are:


    Route incoming requests to different Services according to the incoming URL. For
    instance, you could use similar URLs to route users to different versions of an
    application:


    http://front/store could route to a store:1.0 application;


    http://front/old/store could route to a store:0.8 application.


    Add TLS between incoming requests and your Services in order to secure connections
    to your cluster (in short, https:// addresses instead of http:// ones), managing
    certificates and encryption in a common Ingress Controller.


    Manage your own load balancing service.


    Ingress objects are declared in your Kubernetes cluster, but the actual functionality
    is provided by an Ingress Controller. You can deploy and manage your Ingress Controller
    of choice, for instance:


    nginx-ingress


    contour


    traefik


    PaaS controllers when running in the Cloud.


    Note that the ingress controllers are based on reverse-proxy software. This is
    totally normal since Ingress objects are abstractions for reverse proxies.


    Once an Ingress Controller is deployed to your Kubernetes cluster, you can add
    as many Ingress objects as you wish. The Ingress Controller will scan the Ingress
    objects in order to know which services it should provide.


    This is how you declare a simple Ingress object:


    apiVersion : extensions / v1beta1 kind : Ingress metadata :


    name : frontandback - ingress spec :


    rules :


    *   host : server . com


    http :


    paths :


    *   path : / app


    backend :


    serviceName : web - app


    servicePort : 80


    Thanks to the above Ingress object, the Ingress Controller will know that an incoming
    http://server.com/app request should be routed to the Service named web-app .
    That service can be a ClusterIP type service.


    14.  Volumes


    14.1 The need for volumes


    Changes made to the file system inside a container are ephemeral. Once the container
    stops, they are lost unless you take some steps to make them persist elsewhere.
    Containers are more easily managed when they are stateless, but you will need
    to persist data at some point.


    Persistence needs depend on your applications. Persisted data may be shared across
    containers in the same Pod, or shared across several containers from different
    Pods on a Worker Node, or even shared among containers that run on different Worker
    Nodes.


    You could try and persist data on the file system of the Worker Nodes, but from
    a Kubernetes point of view Nodes are interchangeable and a Pod may be restarted
    on another Worker Node for many reasons. Also, how would you manage sharing data
    to other Pods running on different Nodes?


    Kubernetes provides an abstraction model for persistent storage, in the same way
    that it provides an abstraction model for memory and CPU resources. You know by
    now that Pods make memory and CPU requests while Nodes offer memory and CPU. The
    same goes with persistent storage: Pods make requests for Volumes, and volume
    providers offer persistent storage.


    A Pod may make any of two request types:


    Volume: its duration is limited to that of the Pod that declares it.


    PersistentVolumeClaim: an object that lives independently from Pods, so it can
    live longer than Pods.


    Let’s see both in more details.


    14.2 Short-lived storage with Volumes


    A Volume is declared by a Pod. All of the containers running inside a Pod can
    see the Volume. The Volume lives only as long as the declaring Pod.


    It may look like Volumes are short-lived, but that is only partly true. The Volume
    object is short lived just like its declaring Pod, but it can rely on storage
    that persists for much longer. For instance, if a Volume uses an external storage
    type like an Azure Disk , its data is persisted and may be read later by another
    Pod that attaches its Volume to the same storage. Actually, most storage types
    that can be used by Volumes are persistent.


    Anyway, a short-lived storage that is scoped to a Pod may also be useful if you
    want to exchange data between containers running inside the same Pod, as illustrated
    by this chapter’s exercise.


    Here is a Volume declaration for a Pod:


    apiVersion : apps / v1beta1 kind : Deployment spec :


    template :


    spec :


    volumes :


    *   name : persistent - data


    emptyDir : {}


    containers :


    *   name : front


    image : my - image : 1.0


    volumeMounts :


    *   mountPath : / external


    name : persistent - data


    As you can see, the Volume is declared within a Pod and mounted on the Pod’s containers.
    The front container sees the Volume as its /external folder.


    In the above example, the Volume type is emptyDir . It’s a short-lived, non-reliable
    storage that can be read from and written to, and may be stored in memory or onto
    the Worker Node’s disk.


    The following Volume types are available as of writing (full list here ):


    ![](media/file69.jpg)


    You can see that there are traditional types like nfs and hostPath that enable
    writing to well-known disk systems, but also distributed persistent storage tailored
    for clusters like glusterfs and flocker . There are also the configMap and secret
    types that refer to Kubernetes objects we will see in the Configuration chapter;
    those enable you to see configuration data as files from your containers.


    Some Volume types need extra information when declared. For instance, the azureDisk
    type needs you to specify the URI of the disks it actually refers to:


    apiVersion : apps / v1beta1 kind : Deployment spec :


    template :


    spec :


    volumes :


    *   name : persistent - data


    azureDisk :


    diskName : test . vhd


    diskURI : https ://… oft . net /vhds/ test . vhd


    containers :


    *   name : front


    image : my - image : 1.0


    volumeMounts :


    *   mountPath : / external


    name : persistent - data


