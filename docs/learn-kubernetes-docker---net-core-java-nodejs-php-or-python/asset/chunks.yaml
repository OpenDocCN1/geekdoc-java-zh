    \ --serviceaccount=kube:dashboard\n```\n\n### 11.2 Visual Studio Code\n\nRoutine\
    \ work with a Kubernetes cluster involves manipulating YAML files, which are text\
    \ files. This needs a good text editor. In case you don’t have one already, I\
