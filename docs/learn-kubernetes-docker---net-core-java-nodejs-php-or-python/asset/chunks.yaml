    docker stop


    docker rm


    Switch back to the browser. Check that the application doesn’t respond anymore.


    Close the browser.


    5.8 Using volumes


    When a container writes files, it writes them inside of the container. Which means
    that when the container dies (the host machine restarts, the container is moved
    from one node to another in a cluster, it simply fails, or many other reasons)
    all of that data is lost. It also means that if you run several times the same
    container in a load-balancing scenario, each container will have its own data,
    which may result in an inconsistent user experience.


    A rule of thumb for the sake of simplicity is to ensure that containers are stateless,
    for instance storing their data in an external database (relational like SQL Server
    or document-based like MongoDB) or distributed cache (like Redis). But sometimes
    you actually want to store files in a place where they are persisted. This is
    done using volumes.


    Using a volume, you actually map a directory inside the container to a persistent
    storage. Persistent storages are manages through drivers and depend on the actual
    Docker host. They may be an Azure File Storage on Azure, or Amazon S3 on AWS.
    With Docker Desktop, you can map volumes to actual directories on the host system.
    This is done using the -v switch on the docker run command.


    Suppose you run a MySQL database with no volume:


    docker run -d mysql:5.7


    Any data stored in that database will be lost when the container is stopped or
    restarted. In order to avoid data loss, you can use a volume mount:


    docker run -v /your/dir:/var/lib/mysql -d mysql:5.7


    It will ensure that any data written to the /var/lib/mysql directory inside the
    container is actually written to the /your/dir on the host system. Hence that
    data is kept when the container is restarted.


    5.9 Where do images come from?


    Each container is created from an image. You provide the image name to the docker
    run command. Docker first looks for the image locally, and uses it when present.
    When the image is not present locally, it is downloaded from a registry .


    ![](media/file27.png)


    You can list the local images using the following command: docker images ls .


    When an image is published to a registry, its name must be:


    <repository_name>/<name>:<tag>></tag></name></repository_name>


    tag is optional. When missing, it is considered to be latest


    repository_name may be a registry DNS or the name of a registry in the Docker
    Hub.


    We’ll soon see more about Docker Hub and private registries . All of the images
    we’ve been using now were downloaded from Docker Hub since they are not DNS names.
    The Docker Hub may be browsed here .


    For instance, the Jenkins image may be found here on the Docker Hub.


    Although the docker run command downloads images automatically when missing, you
    may want to manually trigger the download. You can simply use the docker pull
    command. A pull command will force a download of an image, whether it is already
    present or not.


    Some scenarios where using a docker pull command is relevant:


    you expect that the machine that will run the containers will not have access
    to the registries (e.g. no internet connection) at the time of running the containers;


    you want the ensure you have the latest version of an image tagged as “latest”,
    which wouldn’t be downloaded by the docker run command.


    6.  Create Docker images


    As we saw earlier, containers are created from images. Up to now we’ve been using
    images created by others. It’s high time we learnt how to create our own images.
    Inside our images we can stuff our programs and their dependencies, so that many
    containers can be created from those images and live happily ever after.


    6.1 Creating a simple image


    ![](media/file28.png)


    A Docker image is created using the docker build command and a Dockerfile file.
    The Dockerfile file contains instructions that state how the image should be built.


    The Dockerfile file can have any name. Naming it Dockerfile makes it easier for
    others to understand its purpose when they see that file in your project, and
    means we don’t need to state the file name when using the docker build command.


    I’d like to create a basic image for a container that displays a “hello world”
    message when ran.'
