    7.  Publish Docker images


    7.1 Rationale for publishing


    When you create a container, you create it from an image that is available on
    your machine:


    ![](media/file32.png)


    There are two ways to have an image available on your machine:


    create an image using the docker build command: we saw this in the previous chapter;


    get an image from a Registry, using the docker pull command or implicitly when
    using the docker run command for an image that is not available locally.


    Here’s what happens when you create a container from an image that is pulled from
    a registry:


    ![](media/file27.png)


    As a developer, you create images for your software to run in a controlled environment.
    Since you want your images to run on other machines, you need to make sure they
    are distributed to those machines. Your option for this is simply to publish your
    images to a Registry. When the other machines need to create containers from your
    images, they will simply pull them from the Registry.


    In other words, when you want to publish your application to test or to put on
    a production environment, you simply upload your image to a Registry.


    7.2 Registries


    A Docker Registry is basically an image store that offers the following functions:


    ability to store various images;


    ability to store various tags for the same image;


    an HTTP API that allows to push images from a machine that produces them, or pull
    images to a machine that runs containers from those images;


    TLS-secured connection to the API in order to avoid man-in-the-middle attacks.


    There are many registries available. You can use the publicly available Docker
    Hub (following chapter) or use a private registry of your own. There are many
    ways to create private registries, and we’ll cover several of them in the Private
    registries chapter. In any case, the process to tag and publish your images remains
    the same on every registry.


    7.3 Publishing an image


    Whatever the Registry you choose, publishing an image is a three-step process:


    build your image ( docker build ) with the appropriate prefix name or tag ( docker
    tag ) an existing one appropriately;


    log into the Registry ( docker login );


    push the image into the Registry ( docker push ).


    ![](media/file33.png)


    There are slight variations according to the actual Registry, which we’ll see
    in the following chapters.


    7.4 Docker Hub


    Docker Hub is a Docker Registry offered by Docker Inc. It allows unlimited storage
    of public images, and paid plans to host your private images. A public image may
    be accessed by others, which is exactly what you want when you make your software
    widely available - less for internal enterprise software.


    In order to publish images on Docker Hub you need to create an account. I’m going
    to create one. For this, I head to https://hub.docker.com/ and click the Sign
    Up link. The Docker ID I select will be the prefix of images I publish to the
    Docker Hub.


    When creating your account make sure you select the right ID since it will be
    part of your images’ names. Suppose your ID name is short-name , your images should
    be tagged:


    <short_name>/<name>:<tag></tag></name></short_name>


    For this book I created the learnbook account, and I want to publish the webserver
    image I created earlier. It’s as simple as naming it correctly and pushing it
    to the Registry. I need to name it learnbook/webserver , and there are two ways
    to do this.


    First is to run the docker build command again using the correct name. That’s
    a good option when you’re using it from the start, but if I do this now it will
    result in two separate images on my disk - same contents but different names and
    IDs. Not a good idea.'
