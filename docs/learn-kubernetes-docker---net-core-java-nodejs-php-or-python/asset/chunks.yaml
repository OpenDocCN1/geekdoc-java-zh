    ## Introduction


    ### What this book is not

    I made my best to keep this book small, so that you can learn both Kubernetes
    and Docker quickly without getting lost in petty details. If you are looking for
    a reference book where you’ll find answers to all the questions you may have within
    the next 4 years of your Kubernetes and Docker practice, you’ll find other heavy
    books for that.


    ### Prerequisites

    This book is for anyone who needs to run containers. Whether you’re a developer,
    a DevOps manager or a technician, this book should help you run containers then
    run them. I assume that you have no previous knowledge about containers.


    ### How to read this book

    This book’s aim is to make you productive as quickly as possible. For this we’ll
    use some theory, several demonstrations, plus exercises. Exercises appear like
    the following:


    Do it yourself: Time to grab your keyboard and code away.


    In code samples, a backslash is used to wrap long lines. Do not type these backashes
    when you copy code from the book.


    ### Tools you need

    The only tools you’ll need to work through this book are the following:


    - A Windows, Linux or Mac machine that meets the specifications for Docker Desktop
    or Minikube, or the ability to create a PaaS cluster (Azure AKS, Google GKE, Amazon
    EKS).

    - A text editor.


    ### Source code

    All of the source code for the demos and do-it-yourself solutions is available
    at `https://bitbucket.org/epobb/kubernetesdockerfiles`. It can be downloaded as
    a ZIP file, or if you installed GIT you can simply type:


    ```bash

    git clone https://bitbucket.org/epobb/kubernetesdockerfiles.git

    ```


    ## 1. Why Docker?


    ### 1.1 A DevOps enabler tool

    Docker is an engine that runs containers, and containers as a tool allow to solve
    many challenges created by the growing DevOps trend.


    In DevOps, the Dev and Ops teams have conflicting goals:


    As an agile developer I want to frequently publish my applications so that deployment
    becomes a routine. The rationale behind this is that this agility makes the “go
    to production” event a normal, frequent, completely mastered event instead of
    a dreaded disaster that may awake monsters who will hit me one week later. On
    the other hand, it is the Ops team that will have to face the user if anything
    goes wrong in deployment - so they naturally want stability.


    Containers ease deployment because deploying is as simple as running a new container,
    routing users to the new one, and trashing the old one. It can even be automated
    by orchestration tools, and since it’s dead easy we can afford to have many containers
    serving a single application for increased stability during updates.

