    ## 引言


    ### 本书不是什么

    我尽力让本书保持简洁，以便让你快速学习 Kubernetes 和 Docker 而而迷失在琐碎的细节中。如果你正在寻找一本能解决未来几年内问题的参考书，那么找到了。我假设你对容器没有先验知识。


    ### 准备工作

    本书适用于任何需要容器的人。无论你是开发者、DevOps 经理还是技术人员，本书都能帮助你运行容器。


    ### 如何阅读本书

    本书的目标是尽快让你产生效率。为此，我们将使用一些理论、多个演示以及练习。练习将如下：


    动手实践：该拿起键盘编写代码了。


    在代码示例中，反斜杠 `\` 用于折行。当你从书中复制代码时，不要输入这些反斜杠。


    ### 你需要的工具

    完成本书所需的工具如下：


    - 一台符合 Docker Desktop 或 Minikube 要求的 Windows、Linux 或 Mac 机器，或者具备创建 PaaS 集群的能力（Azure
    AKS, Google GKE, Amazon EKS）。

    - 文本编辑器。


    ### 源代码

    所有的演示和动手实践答案都可以在 bitbucket.org/epobb/kubernetesdockerfiles 获取。你可以以 ZIP 文件格式下载，如果你安装了
    GIT，只需输入：


    ```bash

    git clone https://bitbucket.org/epobb/kubernetesdockerfiles.git

    ```


    ## 1. 为什么用 Docker?


    ### 1.1 一个 DevOps 赋能工具

    Docker 是一个运行容器的引擎，容器作为一种工具可以解决 DevOps 趋势带来的许多挑战。


    在 DevOps 中，开发团队和运维团队的目标是冲突的：


    作为一个敏捷的开发者，我希望频繁发布应用程序，这样部署就会变成常规。这背后的逻辑是，这种敏捷让“上线”事件变成一个正常、频繁且完全掌控的事件，而不是一个可能在一周后袭击我的可怕灾难。相反，如果部署出现任何问题，都是运维团队需要面对用户——所以他们自然希望稳定性。


    容器让部署变得简单，因为部署仅仅是运行一个新容器、将用户路由到新容器并丢弃旧容器。这甚至可以由编排工具自动化，而且由于非常容易，我们可以让多个容器服务于同一个应用程序，以增加更新期间的稳定性。


    '
- fmt: '

    If you don’t use containers, Ops need to handle your hosting environment: runtimes,
    libraries, OS needed by your application. On the other side, when using containers
    they just need one single methodology that can handle the containers you provide
    no matter what’s inside them. You may as well use `.NET Core`, `Java`, `Node.JS`,
    `PHP`, `Python` or another development tool: it doesn’t matter to them as long
    as your code is containerized. This is a huge advantage for containers when it
    comes to DevOps.


    In the Docker with common development profiles chapter we’ll see how to create
    container images for specific development technologies. But your your Ops don’t
    see how you create the images, they just see container images.


    ### 1.2 It solves dependency conflicts


    A typical web application looks something like the following:


    ![](media/file1.jpg)


    The application is made of files served by an HTTP server (`Apache` here, but
    it could be `Kestrel`, `IIS`, `NGINX`, …), a runtime (`PHP 5.6` here) and a development
    framework (`Wordpress 4.9` here).


    Without containers, the dependencies and files are all placed together on a server.
    Since managing those dependencies is time-consuming, similar apps are typically
    grouped on the same server, sharing their dependencies:


    ![](media/file2.jpg)


    Now suppose you want to upgrade the `PHP` runtime from version `5.6` to `7.2`.
    But the version change induces breaking changes in the applications that hence
    need to be updated. You need to update both `App 1` and `App 2` when proceeding
    with the upgrade. On a server that may host many apps of this type, this is going
    to be a daunting task and you’ll need to delay the upgrade until all apps are
    ready.


    Another similar problem is when you want to host say `App 3` on the same server,
    but `App 3` uses the `Node.JS` runtime together with a package that when installed
    changes a dependency that is used by the `PHP` runtime. Conflicts between runtimes
    are not scarce, so you probably faced that problem already.


    Containers solve this problem because each app is going to run inside its own
    container with its own dependencies. Your typical server would look like:


    ![](media/file3.jpg)


    Each container encapsulates its own dependencies. Which means you can migrate
    the `PHP` runtime from version `5.6` to `7.2` in a container without affecting
    other. Any other container that would use, e.g., `Node.JS` would not interfere
    with any of the `Wordpress` containers.


    ### 1.3 It allows for easy scaling up


    When a server application needs to handle a higher usage than what a single server
    can handle, the solution is well-known: place a reverse proxy in front of it,
    and duplicate the server as many times as needed. In our previous `Wordpress`
    application example, this means duplicating the server together with all of its
    dependencies:


    ![](media/file4.jpg)


    That is only going to make things worse when upgrading: we’ll need to upgrade
    each server’s dependencies, together with all of the conflicts that may induce.


    Again, containers have a solution for this. As we’ll see in the Basic concepts
    section , containers are based on images. You simply need to run as many containers
    as you wish from a single image, and they will all sport the exact same dependencies.


    Better yet: when using an orchestrator you simply need to state how many containers
    you want, the image name, and the orchestrator will create that many containers
    on all of your Docker servers. We’ll see this in the orchestrators part. This
    is how it looks:


    ![](media/file5.png)


    ### 1.4 It allows for seamless upgrades


    Even in scaled-up scenarios, a container-based approach makes trivial a concept
    that would otherwise be tricky. Without containers, your favorite admin will not
    be happy with you if he has to update every server including the dependencies:


    ![](media/file6.jpg)


    Of course, in such a case the update process will depend on the application and
    its dependencies. Don’t even try to tell your admins about DevOps if you want
    to remain alive.


    By using containers, it’s a simple matter of telling the orchestrator that you
    want to run a new image version, and it will gradually replace every container
    with another one running the new version. Whatever the technology stack running
    inside the containers, it’s a simple command (in fact, by changing just one line
    as we’ll see).


    The illustration below shows the process as it goes on: the orchestrator replaces
    one container, and will then move on to the other ones. While the new container
    is not ready, traffic is being routed to the old version containers so that there
    is no interruption of service.


    ![](media/file7.png)


    ### 1.5 International commerce already uses containers


    Sure, you may wonder why I make such a comparison. You may even be trying to evaluate
    how crazy I am or wondering whether to return this book where you bought it. Wonder
    no more: I’m not crazy. International commerce faced the same delivery problem:
    we are trying to deliver software as fluently as possible, and commerce needs
    to deliver goods as fluently as possible.


    In the old times, it took days to load a ship with goods:


    ![](media/file8.jpg)


    Classic ship loading


    The ship remained docked at the pier during a few days while each good was being
    loaded into it. Goods had varying sizes and handling precautions, and ships had
    storage of varying types and sizes. That’s what made loading (and unloading) a
    slow process. Slow and costly: it required many people to do it, plus the immobilization
    of the ship and goods has a cost.


    A solution was found: containers. The idea is very simple: use boxes of a standard
    size, and fill them with whatever you want. You now only need to handle standardized
    boxes no matter what they contain. Problem solved: the ship can be tailored to
    host many containers in


    ![](media/file9.jpg)


    Container ship loading


    In fact, the whole transport chain (trains, trucks) can be tailored to manage
    containers efficiently to standardized tools like cranes:


    ![](media/file10.jpg)


    Freight train


    Believe it or not: Docker containers are very similar. When you create an image,
    you stuff your software into a container image. When a machine runs it, a container
    is created from the image. Container images and containers can be managed in a
    standardized way, which allows for standard solutions during a containerized software’s
    lifecycle:


    - common build chain;

    - common image storage;

    - common way to deploy and scale up;

    - common hosting of running containers;

    - common control and monitoring of running containers;

    - common ways to update running containers to a new version.


    The most important part being: whatever the real software inside the container,
    it can be handled in a common way. Isn’t that a DevOps’ dream?


    # 2. Why Kubernetes?


    ## 2.1 The need for container orchestration


    When you highly rely on containers and/or have high workloads, managing containers
    will raise several concerns. Think about how you would:


    - Deploy and maintain applications that use many containers.

    - Deploy and maintain applications that spawn containers over different machines.

    - Manage resources used by the containers.

    - Scale applications up and down by adding and removing containers, possibly across
    different machines or dynamically provisioned ones.

    - Update your applications.

    - Update the servers running your applications without application outages.

    - Switch from one host to another.


    Such problems are elegantly solved by container orchestration systems. Kubernetes
    is such a container orchestration platform. You can think of it as an operating
    system for containers. It automates deployment, scaling, and operation of containerized
    applications across a cluster of host machines.


    ## 2.2 What’s K8s?


    K8s is simply an abbreviation for Kubernetes. Take the letters between the leading
    `K` and trailing `s`, count them, and replace them with that count. Since `ubernete`
    is 8-letters long, it can be replaced with an `8`, which gives us K8s.

