    \ tool\n\nOnce your Kubernetes cluster is ready, you need a tool in order to interact\
    \ with it. `kubectl` is a command-line tool that meets most needs. It is flexible\
    \ and complete enough to be used during development deployments as well as from\
    \ your continuous-delivery server (you sure use a CI/CD chain, don’t you?). It\
    \ works in connection with your local development cluster as well as with productions\
    \ clusters. This is where it fits:\n\n![](media/file38.jpg)\n\nThe `kubectl` tool\
    \ sends commands to your Kubernetes cluster through the cluster API. It allows\
    \ for cluster inspection and monitoring (listing nodes, pods, and other cluster\
    \ resources), and enables for creation, deletion and update of elements inside\
    \ your Kubernetes cluster.\n\nYou can get `kubectl` from there. Make sure that\
    \ the `kubectl` version fits the Kubernetes cluster version of the cluster you\
    \ want to target. In order to check that everything is fine, you can run the following\
