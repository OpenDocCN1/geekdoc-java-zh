    \ -f .\n```\n\n# 13.7 Ingress\n\nIngress 是一种用于为 Service 添加额外功能的 Kubernetes 对象。Ingress\
    \ 在入站连接和 Service 之间增加了一个额外的层。它们是反向代理的抽象。\n\n![](img/file68.jpg)\n\n使用 Ingress\
    \ 的一些优势包括：\n\n- 根据传入的 URL 将请求路由到不同的 Service。例如，您可以使用类似的 URL 将用户路由到不同版本的应用程序：\n\
    \  - `http://front/store` 可以路由到 `store:1.0` 应用；\n  - `http://front/old/store`\
    \ 可以路由到 `store:0.8` 应用。\n- 在传入的请求和您的 Service 之间添加 TLS，以确保到集群的安全性（简而言之，使用 `https://`\
    \ 地址代替 `http://` 地址），并在公共 Ingress Controller 中管理证书和加密。\n- 管理您自己的负载均衡服务。\n\nIngress\
    \ 对象在您的 Kubernetes 集群中声明，但实际功能由 Ingress Controller 提供。您可以部署并管理您选择的 Ingress Controller，例如：\n\
    \n- `nginx-ingress`\n- `contour`\n- `traefik`\n- 在云端运行时使用的 PaaS 控制器\n\n注意，ingress\
    \ 控制是基于反向代理软件的。这是完全正常的，因为 Ingress 对象是反向代理的抽象。\n\n一旦将 Ingress Controller 部署到您的\
    \ Kubernetes 集群，就可以根据需要添加任意数量 Ingress 对象。Ingress Controller 将扫描 Ingress 对象以确定它应该提供哪些服务。\n\
    \n以下是如何声明一个简单的 Ingress 对象：\n\n```yaml\napiVersion : extensions / v1beta1 kind\
    \ : Ingress metadata :\nname : frontandback-ingress spec :\nrules :\n*   host\
    \ : server.com\n  http :\n    paths :\n    *   path : /app\n      backend :\n\
    \        serviceName : web-app\n        servicePort : 80\n```\n\n得益于上述 Ingress\
    \ 对象，Ingress Controller 将知道入站的 `http://server.com/app` 请求应该路由到名为 `web-app` 的 Service。该服务可以是一个\
    \ `ClusterIP` 类型的服务。\n\n# 14. Volumes\n\n## 14.1 卷的必要\n\n对容器内部文件系统进行的更改是瞬即逝的。一旦容器停止，这些更改就会丢失，除非您采取某些步骤将它们持久化到其他地方。容器在无状态时更容易管理，但您在某些时刻需要持久化数据。\n\
    \n持久化需求取决于您的应用程序。持久化数据可以在同一个 Pod 的不同容器之间共享，可以在 Pod 之间共享，甚至可以在不同的集群之间共享。\n\nKubernetes\
    \ 提供了几种类型来管理这些：\n\n- `emptyDir`：短寿命存储，其生命周期与 Pod 等等。\n- `Volume`：生命周期独立于任何 Pod\
    \ 的卷。\n- `PersistentVolumeClaim`：向集群资源请求存储的对象。\n\n## 14.2 使用 Volumes 进行短寿命存储\n\
    \nVolume 是在 Pod 内部声明的。在上面的示例中，Volume 类型是 `emptyDir`。它是一个可以写入的短寿命存储。\n\n以下是一个 Pod\
    \ 的 Volume 声明：\n\n```yaml\napiVersion : apps / v1beta1 kind : Deployment spec\
    \ :\ntemplate :\nspec :\nvolumes :\n*   name : persistent-data\n  emptyDir : {}\n\
    containers :\n*   name : front\n  image : my-image:1.0\n  volumeMounts :\n  *\
    \   mountPath : /external\n    name : persistent-data\n```\n\n如您所示，Volume 是在 Pod\
    \ 内部声明的并挂载到 Pod 的容器上的。`front` 容器将 Volume 视为其 `/external` 文件夹。\n\n"
- fmt: "\n# Objective\nCreate and use an `emptyDir` type `Volume` in order to share\
    \ files between containers that run in the same `Pod`.\n\nThe `learnbook/k8s-creator:0.2`\
    \ image creates files with a random name in its directory named `/shared`. The\
    \ `learnbook/k8s-front:0.5` image lists files that are located in its own directory\
    \ named `/shared`.\n\nYou should run those two images as two containers inside\
    \ the same `Pod`, and create a `Volume` of type `emptyDir` inside the `Pod`. Make\
    \ sure that both containers use the same `Volume`, so that files written by one\
    \ container are consumed by the other.\n\nYou should aim for the following target\
    \ architecture:\n\n![](media/file70.jpg)\n\nCreate a Deployment that hosts the\
