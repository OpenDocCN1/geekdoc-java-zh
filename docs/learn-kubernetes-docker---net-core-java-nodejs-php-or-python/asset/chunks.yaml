    # 12. Running pods


    ## 12.1 Deployments and ReplicaSets


    As we saw, a Kubernetes cluster is a set of available CPU and memory resources
    that will run your Pods. Pods should be considered as ephemeral since many things
    can cause their death: they may crash, may need to be killed because they consume
    too much resources, they may need to be replaced by a newer version during application
    upgrades, and they may disappear simply because the node that runs them is powered
    off or becomes unavailable in some other way.


    Fear not: Kubernetes will make its best to have your Pods run whatever the circumstances.
    This means restarting as many of them as needed, on available worker nodes. The
    way it does this is through a `ReplicaSet` object. A `ReplicaSet` ensures that
    a required number of Pods are running in a sane state, starting new ones or stopping
    unnecessary or insane ones as needed.


    In order to manage version changes, which mean reducing Pods in the older `ReplicaSet`
    and growing them in the newer `ReplicaSet`, Kubernetes uses a `Deployment` object.
    Here’s how it all looks:


    ![](media/file45.jpg)


    That may look complicated, but it’s actually simple if you consider all of its
    responsibilities. For most of your work, you can think of it in a simple (less
    accurate) way:


    ![](media/file46.jpg)


    We’ll come back to `ReplicaSets` later when detailing upgrade strategies, but
    for now just consider that you create `Deployments` in order to run and upgrade
    your Pods.


    How do you create a `Deployment`? There are actually two ways to do so: imperative
    and declarative. Imperative looks easy so we’ll begin with them. Declarative looks
    more complex, but in the long run it will make your work much easier.


    ## 12.2 Imperative commands


    The `kubectl create` command allows you to imperatively create a Kubernetes resource.
    Here’s how you would create a `Deployment` of the `hello-world` Docker image:


    ```bash

    kubectl create deployment hello –image=hello-world

    ```


    ```text

    deployment.apps/hello created

    ```


    We can then check that the Deployment was actually created:


    ```bash

    kubectl get deployments -l app=hello

    ```


    ```text

    NAME    READY  UP-TO-DATE  AVAILABLE  AGE

    hello   0/1   1             0          1m45s

    ```


    There are several things worth noting here: the status of the Deployment, and
    the selector. Let me explain both.


    The selector `-lapp=hello` is optional. It means “return only those that have
    a label named `app` whose value is `hello`. If your cluster is empty you could
    as well not use that selector. Labels are metadata you can place on Kubernetes
    objects. Selectors don’t change how an object behaves; they allow you to select
    similar objects later on.


    The status reported above looks quite strange because it states that 0 of 1 expected
    resource is available, though one is up to date. This is simply due to the fact
    that the `hello-world` image is a short-running image that outputs some text and
    stops, hence the Pod is short-lived. Had we launched a long-running image like
    an HTTP server, it would still be available.


    In details, the columns returned by the `kubectl get deployment` command have
    the following meaning:


    - **NAME**: this is the name of the `Deployment`. We provided it in the `kubectl
    get deployment` command.

    - **READY**: this is the number of up and running Pods created by this `Deployment`
    versus the ones we requested. We didn’t specify any quantity of Pods so the default
    is `1`. 0 means that there is no running Pod, and this is due to the fact that
    the Pod was short-lived and stop.

    - **UP-TO-DATE**: this is the number of Pods that could actually run the requested
    `hello-world` image. This means the image could successfully be pulled from a
    Docker registry.

    - **AVAILABLE**: this is the number of Pods available to your users. Again, the
    fact that a 0 is reported here is due to the fact that we ran a short-lived image.


    In fact, things are a little more complicated. Remember that a `Deployment`’s
    aim is to ensure that your Pod is running whatever happens? That means that once
    our short-lived Pod stops, the deployment creates a new one. So if you run the
    above `kubectl get` command several times in a row you will see that at some points
    in time there is one Pod marked as “Ready”. Mind you, Deployments are not for
    short-lived Pods and we should have used a `Job` instead so that the Pods is not
    restarted uselessly. More about `Jobs` later, but an interesting feature is that
    between two Pod restarts the Deployment will wait during increasing times; which
    means that a malfunctioning Pod should not stop your cluster due to excessive
    restarts.


    Wait, I missed some text in between. Let’s now see the output generated by the
    Pod. It’s the actual output of the `hello-world`.


    kubectl logs -l app=helloTo try something more ambitious,, can run an Ubuntu container
    with:


    ```bash

    docker run -it ubuntu

    ```


    Docker ID:

    https://hub.docker.com/


    For more examples and ideas, visit:

    https://docs.docker.com/get-started/


    The output was truncated to the last 10 lines. We could add the `tail` switch
    to output more:


    ```bash

    kubectl logs -l app=hello –tail100

    ```


    Now let’s look at the Pod itself. The `kubectl get` command accepts names of other
    resource types, hence we can use it for Pods:


    ```bash

    kubectl get pods -l app=hello

    ```


    ```text

    NAME      READY  STATUS       RESTARTS AGE

    hello-f8  0/1    CrashLoopOff 32      22m

    ```


    We can see some details about the Pod, which reveal the reason why it isn’t running:
    `CrashLoopOff` means that it’s in a waiting state because of a crash inside the
    Pod.


    We could dig further into the Pod for details, but that’s enough for now. Let’s
    get back to our interactive command. The problem with an interactive command is
    that its outcome depends on the current state of resources inside the cluster.
    If I run the initial command again, it has a different output:


    ```bash

    kubectl create deployment hello –image=hello-world

    ```


    ```text

    Error from server (AlreadyExists): deployments.apps “hello” already exists

    ```


    As you can see, the command fails because a Deployment with the same name was
    already created. Should you manage a cluster manually, you can check whether the
    Deployment already exists and use different commands according to the current
    Deployment state. But who wants to manually manage applications inside a Kubernetes
    cluster in the long run?


    Obviously, we want to be able to automate creation and update of resources inside
    our Kubernetes cluster. We could write scripts that take into account the current
    state of resources before deciding what to do, but this is going to be tricky
    to test and complicated to write and maintain. Since the advantage of imperative
    commands is their simplicity, once we get into tricky things we can consider using
    a more simple tool. Good news: declarative commands will make automation much
    simpler. Before we move on to declarative command, let’s clean the resources we
    created. In fact, we just need to delete the Deployment, which in turn will delete
    the Pod it created (and the ReplicaSet).


    ```bash

    kubectl delete deployment hello

    ```


    ```text

    deployment.extensions “hello” deleted

    ```

