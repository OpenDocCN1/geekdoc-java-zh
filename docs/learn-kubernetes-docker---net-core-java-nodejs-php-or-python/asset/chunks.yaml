    \ 31h\n```\n\n```bash\nkubectl get pods\nNAME READY STATUS RESTARTS AGE\ndebugging1-85\
    \ 0/1 ImagePullBackOff 0 12h\ndebugging2-7c 0/1 CrashLoopBackOff 8 12h\npinger-68bf5\
    \ 1/1 Running 2 31h\n```\n\n```bash\nkubectl delete -f pinger-deployment.yaml\n\
    deployment.apps/pinger deleted\nkubectl delete -f debugging1-deployment.yaml\n\
    deployment.apps/debugging1 deleted\nkubectl delete -f debugging2-deployment.yaml\n\
    deployment.apps/debugging2 deleted\nkubectl get deployment\nNo resources found.\n\
    kubectl get pods\nNo resources found.\n```\n\n#### Is there always one container\
    \ in a Pod?\n\nPods often run a single container but that isn’t true. This is\
    \ a point of detail, but a Pod may run several containers. You mostly don’t want\
    \ to do that since Pods are ephemeral resources, but it may be interesting in\
    \ cases like the one below: (media/file50.jpg)\n\nIn that case, the `data-producer`\
    \ container produces transient files that are read by the `data-consumer` container.\
    \ The `data-consumer` container itself exposes an API to the `web-interface` container.\n\
    \nIn that case, containers are grouped inside the same Pod because they are tightly\
    \ bound. While they could be ran in separate Pods, there would be some overhead\
    \ in communicating between the containers across different Pods.\n\nNote that\
    \ there is a drawback: in case you want to scale out the corresponding application,\
    \ you can only duplicate the whole Pod. In the case that the `web-interface` container\
    \ is the bottleneck, you can’t just scale that one. In that case you could decouple\
    \ the containers and run three different Pods so that only the Pod that runs the\
    \ `web-interface` container is duplicated.\n\n### 12.17 Resources management\n\
    \nAs we saw in the introduction, Pods and Nodes are abstractions that allow for\
    \ an abstraction of memory and CPU resources. Nodes offer memory and CPU while\
    \ Pods consume memory and CPU.\n\nKubernetes needs to ensure that Pods are effectively\
    \ consuming the memory and CPU resources, and this means:\n- scheduling Pods on\
    \ Nodes that have enough resources to run them;\n- terminating buggy Pods that\
    \ consume too much memory and CPU.\n\nKubernetes does so thanks to the concepts\
    \ of `requests` and `limits`. They are optional, but it’s good practice to use\
    \ them since they allow Kubernetes to correctly manage your Pods under pressure.\n\
    \n#### Requests\n\nRequests allow your Controllers to state how much memory and\
    \ CPU they need for a Pod to run. They specify a minimum that should be available\
    \ on the Node where the Pod will be scheduled. When the Kubernetes scheduler needs\
    \ to create a Pod, it selects a Node that has at least the memory and CPU resources\
    \ stated in the `requests` section of the Controller definition.\n\nHere is a\
    \ sample definition of a Deployment:\n\n```yaml\napiVersion: apps/v1beta1\nkind:\
    \ Deployment\nspec:\n  template:\n    spec:\n      containers:\n      - name:\
    \ front\n        image: learnbook/k8s-front:0.4\n        resources:\n        \
    \  requests:\n            cpu: \"100m\"\n            memory: \"10Mi\"\n```\n\n\
    When the Kubernetes scheduler needs to create a Pod for that Deployment, it selects\
    \ a Node that has at least 10M of memory and 100 millicpus still available.\n\n\
    It means that if you provide values that are too high, Kubernetes may not be able\
    \ to schedule your Pods, so choose wisely.\n\n#### Limits\n\nWhen the executable\
    \ running inside a container goes wrong, it may end up eating too much CPU and\
    \ memory resources. Limits allow you to have Kubernetes handle that case.\n"
