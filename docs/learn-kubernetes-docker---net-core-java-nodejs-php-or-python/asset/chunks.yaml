    the target percentage is reached. Of course, the created number of Pods will not
    exceed the maxReplicas stated in the definition, and will not drop under the minReplicas
    number.


    In the above example the automatic scaling is done based on CPU usage but you
    can also use a target memory usage.


    In short, thanks to an HorizontalPodAutoscaler you can define an application that
    will consume resources according to its actual usage, leaving room for other applications
    when it is under low use.


    16.3 Update strategies


    When you modify the template part of a Deployment, existing Pods are no longer
    up to date, and need to be replaced by Pods created using the new template. As
    soon as you kubectl apply the modified Deployment, Kubernetes handles this task
    for you. How exactly? Let’s see.


    Since a ReplicaSet makes sure Pods of a given version are running, once the version
    changes Kubernetes simply creates a new ReplicaSet. The older ReplicaSet will
    delete the Pods it manages while the new one will create Pods. The order in which
    those deletions and creations take place is determined by the stragegy property
    of a Deployment.


    Recreate


    When you set the strategy to Recreate , all of the older Pods are stopped first.
    Once they are no longer running, new Pods are started.


    apiVersion: apps/v1beta1


    kind: Deployment


    metadata:


      name: my-front


    spec:


      strategy:     type: Recreate


      replicas: 3


      template:


        metadata:


          labels:


            app: front


        spec:


          containers:


          - name: my-front


            image: my-wordpress


    The following sequence illustrates what happens when you kubectl apply changes
    to a Deployment’s template with a recreate strategy.


    ![](media/file83.jpg)


    State before the Deployment change


    ![](media/file84.jpg)


    Pods are stopped, then the ReplicaSet is deleted


    ![](media/file85.jpg)


    A new ReplicaSet is created


    ![](media/file86.jpg)


    The new ReplicaSet creates Pods with the new template


    A Recreate update strategy means that there will be no more Pods running at any
    given moment than the replicas count you set, so the update doesn’t consume more
    resources than the running application. But it also means there will be a point
    at which no Pod is available, which means a service outage for your application.
    It’s up to you to decide whether this is fine. In case it’s not, the RollingUpdate
    strategy should look appealing to you.


    Rolling update


    Instead of stopping all existing Pods first and then create the new ones, there
    is a smoother approach that Kubernetes offers by default. All you have to do is
    specify a RollingUpdate value for the strategy type:


    apiVersion: apps/v1beta1


    kind: Deployment


    metadata:


      name: my-front


    spec:


      strategy:     type: RollingUpdate


      replicas: 3


      template:


        metadata:


          labels:


            app: front


        spec:


          containers:


          - name: my-front


            image: my-wordpress


    In fact, RollingUpdate is the default value, so when we didn’t specify any strategy
    type up to now, we had a rolling update strategy. That means you get a fine grained,
    high-availability and intelligent update at no cost with Kubernetes. Did I tell
    you that Kubernetes developers are lucky? Sure, it takes some knowledge to get
    up and running, but once you reach this point in the book you get fantastic powers
    that enable you to easily do what was very tedious. But let me detail how a rolling
    update takes place.


    During a rolling update, Pods are replaced by batches of 25% (this is a default
    value that can be changed ). A first batch of 25% (1 Pod when 3 are running, 2
    Pods when 8 are running) of Pods are created using the new template. Kubernetes
    waits for the new Pods to be running, then stops the same quantity of old Pods.
    Once the old Pods are stopped, it repeats the process with another batch of 25%
    of the old Pods that are replaced by new Pods. That process is repeated until
    all the old Pods are replaced with new ones.


    The rolling update process is even better: when the batch of 25% of new Pods is
    created, the Pods may fail; in case the new Pods can’t reach a running state,
    the rolling update process stops and the old Pods are kept. This means that the
    application keeps running in case the new Pods are buggy; it is simply served
    by the old Pods while you can sort out and solve the problem with the new template
    and kubectl apply again.


    In short, the rolling update process ensures that your application is always running
    even in case of a problem with the new version, and that few resources are used
    during the update process.


    The following sequence illustrates what happens when you kubectl apply changes
    to a Deployment’s template with a rolling update strategy.


    ![](media/file87.jpg)


    25% new Pods are created using the new template


    ![](media/file88.jpg)


    25% old Pods are deleted once the new ones are running


    ![](media/file89.jpg)


    The process repeats with 25% of the Pods


    ![](media/file90.jpg)


    The old ReplicaSet is deleted


    Rolling update parameters


    In case you have advanced needs and all of this nifty rolling update isn’t enough
    for you, it’s possible to modify its behavior using some parameters:


    apiVersion: apps/v1beta1


    kind: Deployment


    metadata:


      name: mon-front


    spec:


      strategy:


        type: RollingUpdate


        rollingUpdate:       maxSurge: 25%       maxUnavailable: 25%


      replicas: 3


      template:


        spec:


          containers:


          - name: mon-front


            image: mon-wordpress


    The maxSurge and maxUnavailable parameters specify the batch size, that is, how
    many extra Pods may be created or left unavailable during an update. You can provide
    a number or a percentage. In the case of a percentage, it is relative to the replicas
    parameter.


    Blue/green, canary and rainbow


    The rolling update or recreate strategies should be fine for most needs, but if
    you are running an application that has a very high number of users you may want
    to go with more subtle update types. For all of those types you need to add some
    logic to your update process, and it is mostly done by tweaking the selector of
    the Service that route to your Pods.


    During a blue/green update, a new version (blue) is created while users are routed
    to the old (green) version. The new version is tested, and once declared ready
    (green) it completely replaces the old one which in turn is deleted. You can do
    this by simply adding an extra blue/green label to your Pods and have two Services:
    one public for the green Pods, one private for the blue Pods.


    A canary update tries to mimic the canary in a coal mine: as long as the bird
    was fine the miners knew they weren’t facing the dangerous gaz. With a canary
    update, you instrument the application and route a little percentage of users
    to a new version while monitoring your metrics. If the metrics show problems,
    you decrease the percentage, and if the metrics are fine you increase the percentage.
    This can be achieved by matching the Service selector on some of the new Pods.


    In extreme cases, you simply cannot stop an older version as long as it being
    used, but still want to publish a new version side-by-side. It’s called a rainbow
    update since you will end up with different side-by-side versions of your application.
    This can be the case with microservices that introduce breaking changes. Using
    Namespaces you can quite easily deploy different versions of your application
    side-by-side, monitor the usage of each and kill the ones that aren’t used anymore.


    17.  Sharing a cluster


    17.1 Namespaces'
