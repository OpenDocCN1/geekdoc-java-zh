  trans: "\n创建一个名为 `commonvalues-secret.yaml` 的文件，内容如下：\n\n```yaml\napiVersion : v1\
    \ kind : Secret metadata :\nname : commonvalues-secret stringData :\nmessage :\
    \ “Hello secret world”\nconfig : “Hidden”\nmagicNumber : “0”\n```\n\n创建一个名为 `front-deployment1.yaml`\
    \ 的文件，内容如下：\n\n```yaml\napiVersion : apps/v1beta1 kind : Deployment metadata :\n\
    name : front spec :\ntemplate :\nmetadata :\nlabels :\napp : front\nspec :\ncontainers\
    \ :\n  - name : front\n    image : learnbook/k8s-front:0.4\n```\n\n创建一个名为 `front-service.yaml`\
    \ 的文件，内容如下：\n\n```yaml\napiVersion : v1 kind : Service metadata :\nname : front\
    \ spec :\ntype : LoadBalancer\nports :\n  - port : 8080\n    targetPort : 80\n\
    selector :\napp : front\n```\n\n在创建上述文件的文件夹中打开命令行。\n\n运行以下命令：\n\n```bash\nkubectl\
    \ apply -f commonvalues-secret.yaml\nkubectl apply -f front-deployment1.yaml\n\
    kubectl apply -f front-service.yaml\nkubectl get secret\nkubectl describe secret\
    \ commonvalues-secret\n```\n\n你应该得到类似于下方的输出：\n\n```text\n> kubectl apply -f commonvalues-secret.yaml\n\
    secret / commonvalues-secret created\n> kubectl apply -f front-deployment1.yaml\n\
    deployment.apps/front created\n> kubectl apply -f front-service.yaml\nservice\
    \ / front created\n> kubectl get secret\nNAME                   TYPE      DATA\
    \  AGE\ncommonvalues-secret   Opaque    3       76s\n> kubectl describe secret\
    \ commonvalues-secret\nName :         commonvalues-secret\nNamespace :    default\n\
    Labels :       < none >\nAnnotations: Type:         Opaque\nData ==== config :\
    \       6 bytes\nmagicNumber :   1 bytes\nmessage :       18 bytes\n```\n\n将浏览器访问到\
    \ `http://localhost:8080/files`。页面上没有显示任何文件。\n\n通过向 `front-deployment1.yaml` 添加一些条目，创建一个名为\
    \ `front-deployment2.yaml` 的文件。`front-deployment2.yaml` 应该包含以下内容：\n\n```yaml\n\
    apiVersion : apps/v1beta1 kind : Deployment metadata :\nname : front spec :\n\
    template :\nmetadata :\nlabels :\napp : front\nspec :\nvolumes :\n  - name : shared\n\
    \    secret :\n      secretName : commonvalues-secret\ncontainers :\n  - name\
    \ : front\n    image : learnbook/k8s-front:0.4\n    volumeMounts :\n      - mountPath\
    \ : /shared\n        name : shared\n```\n\n在命令行中运行以下命令：\n\n```bash\nkubectl apply\
    \ -f front-deployment2.yaml\n```\n\n你应该得到类似于下方的输出：\n\n```text\n> kubectl apply\
    \ -f front-deployment2.yaml\ndeployment.apps/front configured\n```\n\n刷新浏览器中刷新\
    \ `http://localhost:8080/files` 页面。你的浏览器应该显示一个列出 `config`、`magicNumber` 和 `message`\
    \ 文件的页面。\n\n将浏览器访问到 `http://localhost:8080/details`。页面上没有显示名为 `message`、`config`\
    \ 或 `magicNumber` 的条目。\n\n通过向 `front-deployment1.yaml` 添加一些条目，创建一个名为 `front-deployment4.yaml`\
    \ 的文件。`front-deployment4.yaml` 应该包含以下内容：\n\n```yaml\napiVersion : apps/v1beta1\
    \ kind : Deployment metadata :\nname : front spec :\ntemplate :\nmetadata :\n\
    labels :\napp : front\nspec :\ncontainers :\n  - name : front\n    image : learnbook/k8s-front:0.4\n\
    \    envFrom :\n      - secretRef :\n        name : commonvalues-secret\n```\n\
    \n在命令行中运行以下命令：\n\n```bash\nkubectl apply -f front-deployment4.yaml\n```\n\n你应该得到类似于下方的输出：\n\
    \n```text\n> kubectl apply -f front-deployment4.yaml\ndeployment.apps/front configured\n\
    ```\n\n在浏览器中刷新 `http://localhost:8080/details` 页面。你现在应该能在页面上看到 `message`、`config`\
    \ 和 `magicNumber` 条目。\n\n运行以下命令：\n\n```bash\nkubectl delete -f .\n```\n\n# 16.\
    \ 更新与扩展\n\n## 16.1 水平扩展\n\n水平扩展（Horizontal scaling）是一种允许应用程序处理更多并发请求的技术，也称为 `scaling\
    \ out`（扩容）。当你在机器上运行服务器应用程序时（或者对于 `Pod` 来说），它只能处理特定数量的并发请求，因为每个请求都需要某些 `RAM` 和\
    \ `CPU` 资源。\n\n例如，你的应用程序可能每秒能处理 100 个请求。如果你想处理更多请求，可以在不同的服务器上复制该应用程序，以便处理更多请求。假设我们想每秒处理\
    \ 300 个请求，我们可以运行 3 个应用程序实例。\n\n在传统的服务器托管应用程序上，水平扩展需要费费一些工作。机器及其应用程序需要被复制，并且在三个副本前面需要使用负载均衡器应用程序，以便让传入的请求由三个副本均匀地提供。好消息是：Kubernetes\
    \ 让这项任务变得极其简单。你只需要在 `Deployment` 的定义中设置 `replicas` 属性即可：\n\n```yaml\napiVersion:\
    \ apps/v1beta1\nkind: Deployment\nmetadata:\n  name: my-front\nspec:\n  template:\n\
    \    metadata:\n      labels:\n        app: front\n    spec:\n      replicas:\
    \ 3\n      containers:\n        - name: front\n          image: learnbook/k8s-front:0.4\n\
    ```\n\n## 16.2 自动水平扩展\n\n扩容曾是一项困难的任务，但 Kubernetes 使其变得简单。但我们这些 IT 人总是想要更多，所以当某些任务变得简单时，我们就会寻找更多挑战。老实说，市场也在要求创新，因此我们也顺应市场。那么，我们如何让水平扩展更具挑战性呢？\n\
    \n考虑一下：能够设置处理传入请求的 `Pods` 数量是可以的，但你如何设置那个数字呢？如果数字太低，`Pods` 将无法处理用量高峰；如果数字太高，会有太多的\
    \ `Pods` 闲置无无事事，这意味着它们在白白消耗 `CPU` 和内存资源。\n\n最好的办法是动态更改 `Pods` 的数量以满足实际需求：当出现用量高峰期时，创建更多\
    \ `Pods`；当应用程序面临低使用率时，销毁无用的 `Pods` 以释放资源。\n\n实际上，这可以通过一个简单的 Kubernetes 对象完成：\n\
    \n```yaml\napiVersion: autoscaling / v1\nkind: HorizontalPodAutoscaler\nmetadata:\n\
    \  name: captureorder\nspec:\n  scaleTargetRef:\n    apiVersion: apps / v1\n \
    \   kind: Deployment\n    name: front\n  minReplicas: 4\n  maxReplicas: 10\n \
    \ targetCPUUtilizationPercentage: 70\n```\n\n"
- fmt: "\nThat `HorizontalPodAutoscaler` monitors the CPU used by the available Pods,\
    \ and compares it to the limits set by the Pod’s cpu requests . In case the Pods\
    \ use less than the target percentage, some Pods are destroyed. On the contrary,\
    \ when the Pods use more than the target percentage, new Pods are created until\
    \ the target percentage is reached. Of course, the created number of Pods will\
    \ not exceed the `maxReplicas` stated in the definition, and will not drop under\
    \ the `minReplicas` number.\n\nIn the above example the automatic scaling is done\
    \ based on CPU usage but you can also use a target memory usage.\n\nIn short,\
    \ thanks to an `HorizontalPodAutoscaler` you can define an application that will\
    \ consume resources according to its actual usage, leaving room for other applications\
    \ when it is under low use.\n\n### 16.3 Update strategies\n\nWhen you modify the\
    \ template part of a `Deployment`, existing Pods are no longer up to date, and\
    \ need to be replaced by Pods created using the new template. As soon as you `kubectl\
    \ apply` the modified `Deployment`, Kubernetes handles this task for you. How\
    \ exactly? Let’s see.\n\nSince a `ReplicaSet` makes sure Pods of a given version\
    \ are running, once the version changes Kubernetes simply creates a new `ReplicaSet`.\
    \ The older `ReplicaSet` will delete the Pods it manages while the new one will\
    \ create Pods. The order in which those deletions and creations take place is\
    \ determined by the `strategy` property of a `Deployment`.\n\n#### Recreate\n\n\
    When you set the strategy to `Recreate`, all of the older Pods are stopped first.\
    \ Once they are no longer running, new Pods are started.\n\n```\napiVersion: apps/v1beta1\n\
    kind: Deployment\nmetadata:\n  name: my-front\nspec:\n  strategy:\n    type: Recreate\n\
    \  replicas: 3\n  template:\n    metadata:\n      labels:\n        app: front\n\
    \    spec:\n      containers:\n      - name: my-front\n        image: my-wordpress\n\
    ```\n\nThe following sequence illustrates what happens when you `kubectl apply`\
    \ changes to a `Deployment`’s template with a `recreate` strategy.\n\n![](media/file83.jpg)\n\
    State before the Deployment change\n\n![](media/file84.jpg)\nPods are stopped,\
    \ then the ReplicaSet is deleted\n\n![](media/file85.jpg)\nA new ReplicaSet is\
    \ created\n\n![](media/file86.jpg)\nThe new ReplicaSet creates Pods with the new\
    \ template\n\nA `Recreate` update strategy means that there will be no more Pods\
    \ running at any given moment than the replicas count you set, so the update doesn’t\
    \ consume more resources than the running application. But it also means there\
    \ will be a point at which no Pod is available, which means a service outage for\
    \ your application. It’s up to you to decide whether this is fine. In case it’s\
    \ not, the `RollingUpdate` strategy should look appealing to you.\n\n#### Rolling\
    \ update\n\nInstead of stopping all existing Pods first and then create the new\
    \ ones, there is a smoother approach that Kubernetes offers by default. All you\
    \ have to do is specify a `RollingUpdate` value for the `strategy` type:\n\n```\n\
    apiVersion: apps/v1beta1\nkind: Deployment\nmetadata:\n  name: my-front\nspec:\n\
    \  strategy:\n    type: RollingUpdate\n  replicas: 3\n  template:\n    metadata:\n\
    \      labels:\n        app: front\n    spec:\n      containers:\n      - name:\
    \ my-front\n        image: my-wordpress\n```\n\nIn fact, `RollingUpdate` is the\
    \ default value, so when we didn’t specify any strategy type up to now, we had\
    \ a rolling update strategy. That means you get a fine grained, high-availability\
    \ and intelligent update at no cost with Kubernetes. Did I tell you that Kubernetes\
    \ developers are lucky? Sure, it takes some knowledge to get up and running, but\
    \ once you reach this point in the book you get fantastic powers that enable you\
    \ to easily do what was very tedious. But let me detail how a rolling update takes\
    \ place.\n\nDuring a rolling update, Pods are replaced by batches of 25% (this\
    \ is a default value that can be changed). A first batch of 25% (1 Pod when 3\
    \ are running, 2 Pods when 8 are running) of Pods are created using the new template.\
    \ Kubernetes waits for the new Pods to be running, then stops the same quantity\
    \ of old Pods. Once the old Pods are stopped, it repeats the process with another\
    \ batch of 25% of the old Pods that are replaced by new Pods. That process is\
    \ repeated until all the old Pods are replaced with new ones.\n\nThe rolling update\
    \ process is even better: when the batch of 25% of new Pods is created, the Pods\
    \ may fail; in case the new Pods can’t reach a running state, the rolling update\
    \ process stops and the old Pods are kept. This means that the application keeps\
    \ running in case the new Pods are buggy; it is simply served by the old Pods\
    \ while you can sort out and solve the problem with the new template and `kubectl\
    \ apply` again.\n\nIn short, the rolling update process ensures that your application\
    \ is always running even in case of a problem with the new version, and that few\
    \ resources are used during the update process.\n\nThe following sequence illustrates\
    \ what happens when you `kubectl apply` changes to a `Deployment`’s template with\
    \ a rolling update strategy.\n\n![](media/file87.jpg)\n25% new Pods are created\
    \ using the new template\n\n![](media/file88.jpg)\n25% old Pods are deleted\n\n\
    ![](media/file89.jpg)\nThe process repeats with 25% of the Pods\n\n![](media/file90.jpg)\n\
    The old ReplicaSet is deleted\n\n##### Rolling update parameters\n\nIn case you\
    \ have advanced needs and all of this isn’t enough for you, it’s possible to modify\
    \ its behavior using some parameters:\n\n```\napiVersion: apps/v1beta1\nkind:\
    \ Deployment\nmetadata:\n  name: my-front\nspec:\n  strategy:\n    type: RollingUpdate\n\
    \    rollingUpdate:\n      maxSurge: 25%\n      maxUnavailable: 25%\n  replicas:\
    \ 3\n  template:\n    metadata:\n      labels:\n        app: front\n    spec:\n\
    \      containers:\n      - name: my-front\n        image: my-wordpress\n```\n\
    \nThe `maxSurge` and `maxUnavailable` parameters specify the batch size, that\
    \ is, how many extra Pods may be created or left unavailable during an update.\
    \ You can provide a number or a percentage. In the case of a percentage, it is\
    \ relative to the `replicas` parameter.\n\n##### Blue/green, canary and rainbow\n\
    \nThe `rolling update` or `recreate` strategies should be fine for most needs,\
    \ but if you are running an application that has a very high number of users you\
    \ may want to go with more subtle update types. For all of those types you need\
    \ to add some logic to your update process, and it is mostly done by tweaking\
    \ the selector of the `Service` that route to your Pods.\n\nDuring a blue/green\
    \ update, a new version (blue) is created while users are routed to the old (green)\
    \ version. The new version is tested, and once declared ready (green) it completely\
    \ replaces the old one which in turn is deleted. You can do this by simply adding\
    \ an extra blue/green label to your Pods and have two Services: one public for\
    \ the green Pods, one private for the blue Pods.\n\nA canary update tries to mimic\
    \ the canary in a coal mine: as long as the bird was fine the miners knew they\
    \ weren’t facing the dangerous. With a canary update, you instrument the application\
    \ and route a little percentage of users to a new version while monitoring your\
    \ metrics. If the metrics show problems, you decrease the percentage, and if the\
    \ metrics are fine you increase the percentage. This can be achieved by matching\
    \ the `Service` selector on some of the new Pods.\n"
