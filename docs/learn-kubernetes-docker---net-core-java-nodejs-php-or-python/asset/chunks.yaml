    14.5 Persistent storage with PersistentVolumeClaims


    Consuming persistent storage


    In order to handle persistent storage that you can share between Pods and across
    Worker Nodes, Kubernetes provides the PersistentVolumeClaim object.


    A PersistentVolumeClaim object exists in your cluster independently from any Pod,
    and points to an actual storage endpoint which is the PersistentVolume :


    ![](media/file73.jpg)


    PersistentVolumes are provisioned by those administering the Kubernetes cluster,
    either “manually” or using dynamically assigned PersistentVolumes (see Providing
    persistent storage ).


    The PersistentVolumes mechanics isn’t complex just for the sake of complexity:
    those objects provide you with an abstraction layer that completely decouples
    the storage needs (consumed by the Devs) from the actual storage providers (provisioned
    by the Ops). In fact, a PersistentVolumeClaim consumes part of a PersistentVolume
    just like a Pod consumes part of a Node.


    For Devs, consuming a piece of a PersistentVolume is a two-step process: first
    you create a PersistentVolumeClaim, next you hook that PersistentVolumeClaim to
    your Pod just like you would mount a plain Volume. Here are the two objects:


    PersistentVolumeClaim declaration


    apiVersion : v1 kind : PersistentVolumeClaim metadata :


    name : claiming - disk spec :


    accessModes :


    *   ReadWriteOnce


    resources :


    requests :


    storage : 1 Gi


    Declaration of a Deployment where the Pod consumes a PersistentVolumeClaim


    apiVersion: apps/v1beta1


    kind: Deployment


    spec:


      template:


        spec:


          volumes:         - name: persistent-data           persistentVolumeClaim:
                claimName: claiming-disk


          containers:


          - name: front


            image: my-image:1.0


            volumeMounts:


              - mountPath: /external


                name: persistent-data


    Providing persistent storage


    There are two ways a PersistentVolumeClaim actually gets persistent storage, and
    it is up to the Ops to decide for a strategy.


    The first one is for the cluster’s administrator to create PersistentVolumes,
    which will be consumed by the PersistentVolumeClaims.


    The second one is to specify a StorageClass on the PersistentVolumeClaim, which
    allows for dynamic creation of Volumes.


    At the time of writing, the following storage classes are available:


    ![](media/file74.jpg)


