    that is needed to create a container: it is a template for containers. You may
    create as many containers as needed from a single image.


    The whole picture looks like:


    ![](media/file12.jpg)


    Images are stored in a registry . In the example above, the app2 image is used
    to create two containers. Each container lives its own life, and they both share
    a common root: their image from the registry.


