    \n![](img/file80.jpg)\n\n页面上没有显示名为 `message`、`config` 或 `magicNumber` 的项。\n\n\
    通过向 `front-deployment1.yaml` 添加一些条目，创建一个名为 `front-deployment4.yaml` 的文件。`front-deployment4.yaml`\
    \ 以下内容：\n\n```yaml\napiVersion : apps/v1beta1\nkind : Deployment\nmetadata :\n\
