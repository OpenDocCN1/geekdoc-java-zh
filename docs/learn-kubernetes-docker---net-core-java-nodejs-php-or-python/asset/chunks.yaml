    Controllers


    Creating a Deployment in order to manage your Pods allows you to ensure that there
    is always (more or less, depending on cluster conditions and updates) a given
    number of Pods running at any given time. There are other types of Pod controllers
    that you may want to create depending on your needs:


    ReplicaSet / Deployment: run Pods that should always be there.


    Job: run Pods in a fire-and-forget way : Kubernetes makes sure that a given number
    of Pods run to completion (that is, the main executable in the container terminates
    without an error).


    CronJob: same as a Job, but on a recurring basis. It’s like creating a Job on
    a regular basis.


    DaemonSet: ensures that a Pod is running on each cluster Node. This is useful
    for Kubernetes-related Pods that should be present on every node like kube-proxy
    .


    Job and CronJob are appropriate for containers with executables that stop after
    they have done their work. Kubernetes expects them to stop and will not restart
    them. Deployment, on the contrary, is appropriate for containers with executables
    that should not stop (for instance a web server) : Kubernetes restarts the Pod
    in case it stops (since that means there is an error).


    12.12 Debugging


    What can go wrong will go wrong, according to Murphy’s law, so we’d better have
    tools to understand what goes wrong. Common errors on a Pod include:


    Container image that can’t be found. For instance, when it wasn’t published by
    a CI/CD yet or that you provided a wrong name.


    Error inside the container’s main executable. That is, the executable returns
    with an error.


    In both cases, the Kubernetes controller restarts the container. In order to ensure
    that system resources aren’t starved by problematic Pods, a growing delay is introduced
    between two container restarts.


    The first thing you can do is to get details about the problematic Pod. Run the
    following command:


    kubectl describe pod<name></name>


    This will allow you to see whether there was an image problem, or the state of
    the Pod otherwise. In case you have a problem with the executable inside the container,
    displaying logs should help:


    kubectl logs -lapp=hello


    Remember that logs are the actual output of the container, so what you get here
    depends on the verbosity of the container.


    In case you need to run code inside the Kubernetes cluster in order to interact
    with a problematic Pod (for instance initiate network communications to it or
    check the Node’s disk), you can actually run another debugger Pod inside the cluster:


    kubectl run -i –tty busybox –image=busybox – sh


    The above command runs a container with the busybox image and keeps your terminal
    connected to it. This allows you to use the bunch of utilities packed inside the
    busybox image in order to inspect the problematic Pod.


