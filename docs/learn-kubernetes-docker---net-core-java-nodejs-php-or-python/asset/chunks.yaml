    \ No entry named `message`, `config` or `magicNumber` is displayed on the page.\n\
    \nCreate a file named `front-deployment4.yaml` by adding some entries to the `front-deployment1.yaml`.\
    \ The `front-deployment4.yaml` should have the following contents:\n\n```yaml\n\
    apiVersion : apps/v1beta1 kind : Deployment metadata :\nname : front spec :\n\
    template :\nmetadata :\nlabels :\napp : front\nspec :\ncontainers :\n  - name\
    \ : front\n    image : learnbook/k8s-front:0.4\n    envFrom :\n      - secretRef\
    \ :\n        name : commonvalues-secret\n```\n\nIn the command-line, run the following\
    \ command:\n\n```bash\nkubectl apply -f front-deployment4.yaml\n```\n\nYou should\
    \ get an output similar to the following one:\n\n```text\n> kubectl apply -f front-deployment4.yaml\n\
    deployment.apps/front configured\n```\n\nRefresh the `http://localhost:8080/details`\
    \ page in your browser. You should now see the `message`, `config` and `magicNumber`\
    \ entries on the page.\n\nRun the following command:\n\n```bash\nkubectl delete\
    \ -f .\n```\n\n# 16. Updating and scaling\n\n## 16.1 Horizontal scaling\n\nHorizontal\
    \ scaling is a technique that allows an application to handle more concurrent\
    \ requests, and is also called `scaling out`. When you run a server application\
    \ on a machine (or a `Pod` for that matter), it can only handle a certain number\
    \ of concurrent requests since each request requires some `RAM` and `CPU` resources.\n\
    \nFor instance, your application may be able to handle 100 requests per second.\
    \ If you want to handle more requests, you can duplicate the application on separate\
    \ servers so that it handles more requests. Say we want to handle 300 requests\
    \ per second, we can run 3 instances of our application.\n\nOn a traditional,\
    \ server-hosted application, horizontal scaling requires some effort. The machine\
    \ and its application need to be duplicated, and a load balancer application needs\
    \ to be used in front of the three replicas so that incoming requests are served\
    \ evenly by the three replicas. Good news: Kubernetes makes this task extremely\
    \ easy. All you have to do is set a `replicas` property on the `Deployment`’s\
    \ definition:\n\n```yaml\napiVersion: apps/v1beta1\nkind: Deployment\nmetadata:\n\
    \  name: my-front\nspec:\n  template:\n    metadata:\n      labels:\n        app:\
    \ front\n    spec:\n      replicas: 3\n      containers:\n        - name: front\n\
    \          image: learnbook/k8s-front:0.4\n```\n\n## 16.2 Automatic horizontal\
    \ scaling\n\nScaling out was a difficult task but Kubernetes makes it easy. But\
    \ we IT people always want more, so when some task becomes easy we look for more\
    \ challenges. To be honest, the market is also asking for innovation so we also\
    \ go the market way. How can we make horizontal scaling more challenging, then?\n\
    \nConsider this: it is fine to be able to set the number of `Pods` that handle\
    \ incoming requests, but how would you set that number? In case it is too low,\
    \ the `Pods` won’t be able to handle peaks in usage; in case it is too high, there\
    \ will be too many `Pods` sitting around not doing much, which means they are\
    \ consuming `CPU` and `memory` resources for nothing.\n\nWhat would be great would\
    \ be to dynamically change the number of `Pods` in order to meet the actual demand:\
    \ when there are peaks of use, create more `Pods`, and when the application faces\
    \ lower use, destroy useless `Pods` so that they free up resources.\n\nActually,\
    \ this can be done by a simple Kubernetes object:\n\n```yaml\napiVersion: autoscaling\
    \ / v1\nkind: HorizontalPodAutoscaler\nmetadata:\n  name: captureorder\nspec:\n\
    \  scaleTargetRef:\n    apiVersion: apps / v1\n    kind: Deployment\n    name:\
    \ front\n  minReplicas: 4\n  maxReplicas: 10\n  targetCPUUtilizationPercentage:\
    \ 70\n```\n"
