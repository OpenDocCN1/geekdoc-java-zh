    \n```bash\nkubectl get pods\n```\n\nNAME READY STATUS RESTARTS AGE\ndebugging1-85\
    \ 0/1 ImagePullBackOff 0 56s\n\n```\n\n你可以看到该 Pod 尚未就绪，它的状态为“ImagePullBackOff”。\n\
    \n```bash\nkubectl describe pod debugging1-85994956bc-cnlnq\n```\n\n…\n\nContainers:\n\
    \  debugging1:\n    Container ID:\n    Image:          learnbook/debugging1:0.6\n\
    \n…\n\nEvents:\n  Age               Message\n  —-               -----\n…\n  30s\
    \ (x6 over 111s) Back-off pulling image …\n  16s (x4 over 111s) Pulling image\
    \ “learnbook/debugging1:0.6”\n  16s (x4 over 111s) Failed to pull image ……\n \
    \ 16s (x4 over 111s) Error: ErrImagePull\n  3s (x7 over 111s) Error: ImagePullBackOff\n\
    \n你可以看到导致 ImagePullBackOff 状态的事件：Kubernetes 尝试拉镜像（两分钟内尝试了 4 次），但失败了。\n\n实际上，这是由于\
    \ `learnbook/debugging1:0.6` 镜像不存在。\n\n创建一个名为 `debugging2-deployment.yaml` 的文件，内容如下：\n\
    \n```yaml\napiVersion : apps/v1beta1\nkind : Deployment\nmetadata :\n  name :\
    \ debugging2\nspec :\n  template :\n    metadata :\n      labels :\n        app\
    \ : debugging2\n    spec :\n      containers :\n        - name : debugging2\n\
    \          image : mongo-express:0.49.0\n```\n\n在创建上述文件的文件夹中打开命令行。\n\n运行以下命令：\n\
    \n```bash\nkubectl apply -f debugging2-deployment.yaml\nkubectl get deployment\n\
    kubectl get pods\nkubectl logs -lapp=debugging2\n```\n\n你应该将得到类似下面所示的输出：\n\n```bash\n\
    kubectl apply -f debugging2-deployment.yaml\ndeployment.apps/debugging2 created\n\
    ```\n\n```bash\nkubectl get deployment\n```\n\nNAME READY UP-TO-DATE AVAILABLE\
    \ AGE\ndebugging1 0/1 1 0 13m\ndebugging2 0/1 1 0 26s\n```\n\n你可以看到 Deployment\
    \ 中的一个 Pod 已经是最新的，但尚未就绪。\n\n```bash\nkubectl get pods\n```\n\nNAME READY STATUS\
    \ RESTARTS AGE\ndebugging1-85 0/1 ImagePullBackOff 0 13m\ndebugging2-7c 0/1 CrashLoopBackOff\
    \ 1 31s\n\n```\n\n你可以看到 Pod 被重启了一次，并且处于 CrashLoopBackOff 状态。Kubernetes 重启 Pod\
    \ 是因为它的主执行程序正在崩溃。\n\n```bash\nkubectl logs -lapp=debugging2\n```\n\n…\n    at\
    \ Pool.emit (events.js:211:7)\n    at Connection. <anonymous>(/node_modules/mongodb-core/lib/connection/pool.js:270:12)\n\
    …\n    at Connection.emit (events.js:214:7)\n    at Socket. <anonymous>(/node_modules/mongodb-core/lib/connection/connection.js:175:49)\n\
    …\n\n你可以看到 Pod 内部的执行程序是一个 Node.JS 应用，它将堆栈跟踪发送到了日志（其输出）。在跟踪信息中，你可以看到失败的代码与到 MongoDB\
    \ 的连接有关。\n\n实际上，`mongo-express:0.49.0` 镜像需要一个包含 MongoDB 数据库连接字符串的环境变量，因为它是用于数据库管理的\
    \ Web 前。这就是你收到这条消息的原因，因为我没有要求为 Pod 提供环境变量。\n\n### 12.15 练习 - 删除已创建的内容\n\n**目标**：释放之前练习中创建的资源。\n\
    显示当前运行的 Pods 和 Deployment。\n使用 `kubectl delete` 命令和之前练习创建的 YAML 文件，删除所有的 Pods\
    \ 和 Deployment。\n\n### 12.16 练习答案\n\n在创建之前文件的文件夹中打开命令行。\n\n运行以下命令：\n\n```bash\n\
    kubectl get deployment\nkubectl get pods\nkubectl delete -f pinger-deployment.yaml\n\
    kubectl delete -f debugging1-deployment.yaml\nkubectl delete -f debugging2-deployment.yaml\n\
    kubectl get deployment\nkubectl get pods\n```\n\n你应该将得到类似下面的输出：\n\n```bash\nkubectl\
    \ get deployment\nNAME READY UP-TO-DATE AVAILABLE AGE\ndebugging1 0/1 1 0 12h\n\
    debugging2 0/1 1 0 12h\npinger 1/1 1 31h\n```\n\n```bash\nkubectl get pods\nNAME\
    \ READY STATUS RESTARTS AGE\ndebugging1-85 0/1 ImagePullBackOff 0 12h\ndebugging2-7c\
    \ 0/1 CrashLoopBackOff 8 12h\npinger-68bf5 1/1 Running 2 31h\n```\n\n```bash\n\
    kubectl delete -f pinger-deployment.yaml\ndeployment.apps/pinger deleted\nkubectl\
    \ delete -f debugging1-deployment.yaml\ndeployment.apps/debugging1 deleted\nkubectl\
    \ delete -f debugging2-deployment.yaml\ndeployment.apps/debugging2 deleted\nkubectl\
    \ get deployment\nNo found.\nkubectl get pods\nNo found.\n```\n\n#### Pod 中总是含有一个容器吗？\n\
    \nPod 通常运行单个容器，但事实并非如此。Pod 可能会运行多个容器，正如这种情况所示：(media/file50.jpg)。在这种情况下，容器被组在同一个\
    \ Pod 中，因为它们是紧密耦合的。虽然它们可以在不同的 Pod 中运行，但跨 Pod 的容器通信会产生开销。\n\n注意有一个缺点：如果你想扩展相应的应用程序，你只能扩展整个\
    \ Pod。如果 `web-interface` 容器是瓶颈，你无法单独扩展它。在这种情况下，你可以解耦容器并运行不同的 Pod，以便只需扩展 `web-interface`\
    \ 容器。\n\n### 12.17 资源管理\n\n正如我们在引言中所看到的，Pods 和 Nodes 是内存和 CPU 资源的抽象。Node 提供内存和\
    \ CPU，而 Pod 消耗内存和 CPU。\n\nKubernetes 需要确保 Pod 有效地消耗内存和 CPU，这意味着：\n- 将 Pod 调度到资源足够的\
    \ Node；\n- 终止消耗过多内存和 CPU 的异常 Pod。\n\nKubernetes 依靠 `requests` 和 `limits` 概念来实现这一点。这些是可选的，但使用它们是良好的实践，因为它们允许\
    \ Kubernetes 在压力下正确管理你的 Pod。\n\n#### Requests\n\nRequests 允许 Controller 声明运行 Pod\
    \ 需要的内存和 CPU。它们指定了调度 Pod 的 Node 上应该具备的最小资源。当 Kubernetes 调度器需要创建 Pod 时，它会选择一个拥有\
    \ Controller 定义中 `requests` 部分指定的内存和 CPU 资源的 Node。\n\n这是一个 Deployment 的示例定义：\n\
    \n```yaml\napiVersion: apps/v1beta1\nkind: Deployment\nspec:\n  template:\n  \
    \  spec:\n      containers:\n      - name: front\n        image: learnbook/k8s-front:0.4\n\
    \        resources:\n          requests:\n            cpu: \"100m\"\n        \
    \    memory: \"10Mi\"\n```\n\n当 Kubernetes 调度器为该 Deployment 创建 Pod 时，它会选择一个至少可用\
    \ 10Mi 内存和 100 毫毫 CPU 的 Node。\n\n这意味着如果你提供的值过高，Kubernetes 可能无法调度你的 Pod，因此请明智选择。\n\
    \n#### Limits\n\n当容器内部运行的执行程序出错时，它可能会消耗过多的 CPU 和内存资源。Limits 允许 Kubernetes 处理这种情况。\n\
    \n"
- fmt: "\nWhen you set a limit, Kubernetes monitors resources used by the corresponding\
    \ `Pods` and terminates them when used resources are actually higher than the\
    \ limits you set.\n\nIn short, limits are basically the maximum amount of CPU\
    \ and memory that you allow a `Pod` to use.\n\nHere is a sample `Deployment` definition\
    \ using limits:\n\n```yaml\napiVersion: apps/v1beta1\nkind: Deployment\nspec:\n\
    \  template:\n    spec:\n      containers:\n      - name: front\n        image:\
    \ learnbook/k8s-front:0.4\n        resources:\n          limits:\n           \
    \ cpu: \"200m\"\n            memory: \"50Mi\"\n```\n\nActually, the Kubernetes\
    \ scheduler overcommits resources: it doesn’t immediately terminates `Pods` that\
    \ go beyond their assigned limits, but rather does so when the total `Node` resources\
    \ are scarce. When this happens, the Kubernetes scheduler terminates first the\
    \ `Pods` that most exceed their limits.\n\n# 13. Exposing services\n\n## 13.1\
    \ The need for services\n\nNow that you can run `Pods`, you probably want them\
    \ to communicate. This brings several questions that will be answered by the `Service`\
    \ object.\n\n### Listen to connections from outside the cluster\n\nWhen you host\
    \ a server, for instance a web server, you want inbound connections from clients\
    \ to reach your `Pods`:\n\n![](media/file51.jpg)\n\nYou can do so with the following\
    \ command that listens to connections from outside the cluster on port `8085`\
    \ and routes them to the `Pods` deployed by the `Deployment` named `name` on its\
    \ `8080` port:\n\n```bash\nkubectl port-forward deployment/name 8085:8080\n```\n\
    \nHowever, this is an imperative command and you know by now that imperative commands\
    \ are not what you want for medium-term maintenance.\n\nHow can we describe the\
    \ fact that the cluster should listen for connections using declarative commands?\
    \ `Services` answer that question.\n\n### Communicate across Nodes\n\nSince the\
    \ aim of a Kubernetes cluster is to harness the power of having different `Nodes`\
    \ running your containers, your `Pods` will be spread across `Nodes`. \n\nA routine\
    \ task (especially on microservices architectures) will be to communicate across\
    \ `Nodes` as shown in that simplified example:\n\n![](media/file52.jpg)\n\nHow\
    \ do we communicate across `Nodes`? Should we keep a list of running `Pods` and\
    \ address them? `Services` answer that question too.\n\n### Load-balance to multiple\
    \ Pods\n\nIn order to provide high availability of your applications, it is good\
    \ practice to have the same `Pod` duplicated across worker `Nodes`. We saw earlier\
    \ how `Deployments` easily allow us to do so. But how can we ensure that inbound\
    \ connections from clients will be directed to all of the `Pods`, as shown in\
    \ the example below?\n\n![](media/file53.jpg)\n\nOnce again, the answer is to\
    \ use `Services`.\n\n## 13.2 Services\n\n`Services` are Kubernetes objects that\
    \ provide answers to the three questions we just raised.\n\nA `Service` object\
    \ listens for incoming connections and routes them to `Pods` that are selected\
    \ using labels, as shown below:\n\n![](media/file54.jpg)\n\nThe two widely used\
    \ `Service` types are the `LoadBalancer` and `ClusterIP` ones. The difference\
    \ is whether they allow for connections from outside the cluster. Let’s detail\
    \ each of them.\n\n### Connections from outside the cluster\n\nUse the `LoadBalancer`\
    \ type when you create a `Service`, and it will route requests coming from outside\
    \ the cluster to `Pods` that match a given selector.\n\nHere is an example definition\
    \ of a `LoadBalancer` service:\n\n```yaml\napiVersion: v1\nkind: Service\nmetadata:\n\
    \  name: mon-front-service\nspec:\n  type: LoadBalancer\n  ports:\n    - port:\
    \ 8081\n      targetPort: 80\n  selector:\n    app: web-app\n```\n\nWhen you you\
    \ `kubectl apply` that definition, the cluster assigns a public IP to your service.\
    \ Requests made to that IP are routed to the matching `Pods`, as shown in the\
    \ following schema:\n\n![](media/file55.jpg)\n\nHow the IP is assigned depends\
    \ on the Kubernetes provider you chose when cloud-hosting your cluster, or the\
    \ extensions you add to your self-managed cluster.\n\nLet’s deploy a public-facing\
    \ web application as an example. `Adminer` is database management interface written\
    \ in PHP and available as a docker image named `adminer`. In order to deploy it,\
    \ I use the following two definitions:\n\n**adminer-deployment.yaml**\n```yaml\n\
    apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: adminer\nspec:\n  selector:\n\
    \    matchLabels:\n      app: adminer\n  template:\n    metadata:\n      labels:\n\
    \        app: adminer\n    spec:\n      containers:\n        - name: adminer\n\
    \          image: adminer:latest\n          ports:\n            - containerPort:\
    \ 8080\n```\n\n**adminer-service.yaml**\n```yaml\napiVersion: v1\nkind: Service\n\
    metadata:\n  name: adminer\nspec:\n  type: LoadBalancer\n  selector:\n    app:\
    \ adminer\n  ports:\n    - port: 80\n      targetPort: 8080\n```\n\nThose two\
    \ definitions are applied using the following command, as you know by now:\n\n\
    ```bash\nkubectl apply -f .\n```\n\nThe first definition actually deploys a container\
    \ that runs the `adminer` application. The second definition creates a `Service`\
    \ that exposes this application to the outside world. The following schema shows\
    \ the elements we just created:\n\n![](media/file56.jpg)\n\nThe URL used to access\
    \ the service depends on the type of Kubernetes cluster that you are running:\n\
    \n- When running on Docker Desktop, the service is immediately available on the\
    \ `localhost` address, so you can point your browser to the `localhost`.\n- When\
    \ running on Minikube, you need to run the following command: `minikube service\
    \ mon-front` returns the URL on which it can be accessed.\n- When running on a\
    \ PaaS cluster, you can get the IP by running `kubectl get services` as shown\
    \ below:\n\n```text\nkubectl get services\nNAME     TYPE           CLUSTER-IP\
    \     EXTERNAL-IP   PORT(S)\nadminer  LoadBalancer   10.103.108.49  52.x.x.190\
    \     80:30164/TCP\n```\n\nThe `EXTERNAL-IP` `52.x.x.190` See the `EXTERNAL-IP`\
    \ column? It gives the IP on which the `Service` (and thus `adminer`) is accessible.\n\
    \n## 13.3 Exercise - Expose a web application to the internet\n\n**Objective**:\
    \ deploy a web application and make it accessible from the internet.\n\nThe `learnbook/k8s-front:0.5`\
    \ image is a web application that listens on its port `80`. Deploy a `Pod` named\
    \ `front` that has the `app=front` label. Expose that `Pod` using a `LoadBalancer`\
    \ `Service` that listens on port `8080`.\n\nOpen a browser and point it to `http://localhost:8080`\
    \ (or the public URL you obtain if running in PaaS cluster). Once done, delete\
    \ all resources created during exercise.\n\n## 13.4 Exercise solution\n\nCreate\
    \ a file named `front-deployment.yaml` with the following contents:\n\n```yaml\n\
    apiVersion: apps/v1beta1\nkind: Deployment\nmetadata:\n  name: front\nspec:\n\
    \  template:\n    metadata:\n      labels:\n        app: front\n    spec:\n  \
    \    containers:\n        - name: front\n          image: learnbook/k8s-front:0.5\n\
    ```\n\nCreate a file named `front-service.yaml` with the following contents:\n\
    \n```yaml\napiVersion: v1\nkind: Service\nmetadata:\n  name: front\nspec:\n  type:\
    \ LoadBalancer\n  ports:\n    - port: 8080\n      targetPort: 80\n  selector:\n\
    \    app: front\n```\n\nOpen a command-line in the folder where you created the\
    \ above files. Run the following commands:\n\n```bash\nkubectl apply -f front-deployment.yaml\n\
    kubectl apply -f front-service.yaml\nkubectl get deployment\nkubectl get service\n\
    ```\n\nYou should get an output similar to the following:\n\n```text\n> kubectl\
    \ apply -f front-deployment.yaml\ndeployment.apps/front created\n\n> kubectl apply\
    \ -f front-service.yaml\nservice/front created\n\n> kubectl get deployment\nNAME\
    \    READY   UP-TO-DATE   AVAILABLE   AGE\nfront   1/1     1               1 \
    \             9s\n\n> kubectl get service\nNAME    TYPE           CLUSTER-IP \
    \  EXTERNAL-IP   PORT(S)\nfront   LoadBalancer   10.103.108.49  localhost    \
    \  8080:30164/TCP\n```\n\nPoint your browser to the `EXTERNAL-IP` returned, in\
    \ that case `http://localhost:8080`. Your browser should display the following\
    \ page:\n\n![](media/file57.jpg)\n\nRun the following command:\n\n```bash\nkubectl\
    \ delete -f .\n```\n\n### Connections from inside the cluster\n\nThe `ClusterIP`\
    \ Service type makes `Pods` available to other `Pods` inside the cluster. Just\
    \ like the `LoadBalancer` type we saw earlier, but only for services that should\
    \ be available from inside the cluster.\n"
