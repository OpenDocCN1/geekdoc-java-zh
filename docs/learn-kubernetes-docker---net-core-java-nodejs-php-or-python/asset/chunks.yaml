    \ 选项将哪些端口重定向到外部。\n\n## 6.12 了解更多\n\nDocker 维护了可以在 `Dockerfile` 文件中使用的指令的参考。你可以在这里找到它。\n\
    \n## 7 发布镜像\n\n### 7.1 发布的理由\n\n当你创建一个镜像时，你需要一个仓库来发布它：![](img/file32.png)\n\n\
    在机器上拥有镜像有两种方式：\n- 使用正确的前缀构建镜像（`docker build`）；\n- 给现有的镜像打标签（`docker tag`）；\n\n\
    无论你选择哪个仓库，标签过程都是相同的。\n\n### 7.2 仓库\n\nDocker 仓库基本上是一个存储器，提供以下功能：\n- 存储各种镜像；\n\
    - 为同一镜像存储各种标签；\n- 一个允许从机器推送镜像或为容器拉取镜像的 API；\n- 使用 TLS 连接 API 以防止中间人攻击。\n\n有很多仓库可用。你可以使用公共\
    \ Docker Hub，也可以使用自己的私有仓库。\n\n### 7.3 发布镜像\n\n无论选择哪个仓库，发布镜像都是一个三步骤的过程：\n1. 使用正确的前缀构建镜像或打标签；\n\
    2. 登录仓库（`docker login`）；\n3. 将镜像推送到仓库（`docker push`）。\n\n![](img/file33.png)\n\
    \n### 7.4 Docker Hub\n\nDocker Hub 是由 Docker Inc 提供的 Docker 仓库。它允许无限存储公共镜像，并提供付费计划托管你的私有镜像。公共镜像可以被他人访问，这正是你希望让软件广泛传播所需的，而非内部软件。\n\
    \n为了在 Docker Hub 上发布镜像，你需要创建一个账户。为此，我访问 https://hub.docker.com/ 并点击 Sign Up 链接。我选择的\
    \ Docker ID 将是我发布到 Docker Hub 的镜像的前缀。在创建账户时，确保选择正确的 ID，因为它是你镜像名称的一部分。假设你的 ID 名称为\
    \ `short-name`，你的镜像应该标记为：\n\n`<short_name>/<name>:<tag></tag></name></short_name>`\n\
    \n对于这本书，我创建了 `learnbook` 账户，我想发布之前创建的 webserver 镜像。只需正确命名并将其推送到仓库即可。有两种方法：\n\n\
    第一种是使用正确的名称再次运行 `docker build` 命令。当你从开始使用它时这是一个很好的选择，但如果我现在这样做，会导致我的磁盘上产生两个独立的镜像\
    \ - 内容相同但名称和 ID 不同。这不是一个好主意。\n\n"
- fmt: "\nMy second option is much better: use the `docker tag` command. A Docker\
    \ image can have several names as needed, and they can all be added to an already\
    \ existing image thanks to the `docker tag` command. The `docker tag` doesn’t\
    \ duplicate the image (contrary to running `docker build` again).\n\nThe `docker\
    \ tag` command accepts two arguments: first the name of an existing image, second\
    \ the name you want to add to that image.\n\n```\ndocker tag webserver learnbook/webserver\n\
    ```\n\nI now have a single Docker image known by my machine under two names: `webserver`\
    \ and `short_name/webserver`. In case I run the `docker image ls` command, it\
    \ will appear as two separate lines: Note that the image ID is the same for both\
    \ lines, which means there really is just one image on my machine, known under\
    \ different names.\n\nNow that my image is named correctly, I can publish it to\
    \ the Docker hub. It’s just a matter of running two commands:\n\n```\ndocker login\n\
    docker push learnbook/webserver\n```\n\nThe `docker login` command asks for my\
    \ Docker Hub credentials interactively, but I could have just as well provided\
    \ them as arguments to the command.\n\nThe `docker push` command is smart enough\
    \ to push only the bits that differ from the base nginx image I used since it\
    \ is already stored in the Docker Hub, as the output shows:\n\n```\nThe push refers\
    \ to repository [docker.io/learnbook/servers]\n0f83d7865e1e: Pushed\n6b5e2ed60418:\
    \ Mounted from library/nginx\n92c15149e23b: Mounted from library/nginx\n0a07e81f5da3:\
    \ Mounted from library/nginx\nlatest: digest: sha256:e8597…1ae0b1efb1 size: 1155\n\
    ```\n\nThat’s it! The Docker Hub now hosts my image for everyone to see and run\
    \ it. Everyone can see my image because it is public. In case I don’t want to\
    \ share it with the whole world, I can set it as private.\n\n### 7.5 Run an image\
    \ on another machine\n\nThis is an extremely easy process. In fact you already\
    \ know how: use the `docker run` command. Or first get the image with `docker\
    \ pull` then use it with `docker run` (this would be useful in case you plan to\
    \ disconnect from the internet before running a container, for instance).\n\n\
    In fact, you can try it on your machine (with Docker Engine or Docker Desktop\
    \ installed). Run the following command:\n\n```\ndocker run –rm -it -p 8085:80\
    \ learnbook/webserver\n```\n\nThen pop-up your browser and head on to the following\
    \ URL in order to see my web page being served over HTTP by that container.\n\n\
    `http://localhost:8085`\n\nIsn’t that neat? A painless delivery system.\n\nThere’s\
    \ a little variant to this. In case you want to run an image that is stored in\
    \ a private registry, you first need to log into the registry using the `docker\
    \ login` command. Once this is done, you can `docker pull` the image. Should you\
    \ want to run another container with that image later on, you don’t need to login\
    \ since the image is stored on your machine.\n\n### 7.6 Exercise - Publish an\
    \ image and run a container on another machine\n\n1. Create a Docker ID on `https://hub.docker.com/`\n\
    2. Publish your `jsparam` image to the Docker Hub.\n3. Get another machine that\
    \ runs Docker Engine or Docker Desktop and create two containers from the published\
    \ `jsparam` image in order to compute the area of circles that have diameters\
    \ of 3.5 cm and 1.5 cm.\n\n### 7.7 Exercise solution\n\nHead to `https://hub.docker.com/`\
    \ with a browser and click the `Sign Up` link. Create an account with the Docker\
    \ ID you wish (in the rest if this solution we’ll suppose it is `learnbook`, but\
    \ replace it with your own).\n\nOpen a command-line. Run the following commands:\n\
    \n```\ndocker tag jsparam learnbook/jsparam\ndocker login -u learnbook -p <your-password>\n\
    docker push learnbook/jsparam\n```\n\nGet another machine that runs Docker Engine\
    \ or Docker Desktop and open a command-line. Run the following commands:\n\n```\n\
    docker run –rm -e diameter=3.5 learnbook/jsparam\ndocker run –rm -e diameter=1.5\
    \ learnbook/jsparam\n```\n\nYou should get the following output:\n\n```\n> docker\
    \ run –rm -e diameter=3.5 learnbook/jsparam\nUnable to find image ‘learnbook/jsparam:latest’\
    \ locally\nlatest: Pulling from learnbook/jsparam\nDigest: sha256:a80621fe…328f3\n\
    Status: Downloaded newer image for learnbook/jsparam:latest\nArea of a 1.75 cm\
    \ radius disk:\n    9.62112750161874 cm²\n\n> docker run –rm -e diameter=1.5 learnbook/jsparam\n\
    Area of a 0.75 cm radius disk:\n    1.7671458676442586 cm²\n```\n\n### 7.8 Private\
    \ registries\n\nPublic registries are a convenient way to share your Docker images,\
    \ but you will probably want to keep some images to your company, yourself or\
    \ an organization. Private registries ensure you can keep your private images…\
    \ private.\n\nWhen we published our images to the Docker Hub using the `docker\
    \ push` command, we had to use the `docker login` command first in order to authenticate.\
    \ A private registry will require users to also use `docker login` before they\
    \ can pull an image.\n\nThere are many ways to get a private registry:\n- Docker\
    \ Hub, where you pay according to the quantity of private repositories used;\n\
    - Azure Container Registry allows you to have your own private registry in Azure;\n\
    - GitLab has an included optional Docker registry: enable it so that each project\
    \ can store the images it creates;\n- The registry image allows you to host your\
    \ own registry on a Docker enabled machine as a container.\n\nStoring images in\
    \ a private registry is the same process we used when pushing images to the Docker\
    \ Hub: your images’ names simply need to be prefixed with the registry name before\
    \ they are pushed.\n\n### 7.9 Size matters\n\nWhen you create an image, you want\
    \ it to be as small as possible for several reasons:\n- reduce pull and push times;\n\
    - use a minimum amount of space in the Registry;\n- use a minimum amount of space\
    \ on the machines that will run the containers;\n- use a minimum amount of space\
    \ on the machine that creates the image.\n\nIn order to reduce the size of an\
    \ image, you need to understand that it is influenced by several factors:\n- the\
    \ files included in your image;\n- the base image size;\n- image layers.\n\nIdeally\
    \ you want to reduce those. Let’s see how.\n\n#### Files included in your image\n\
    \nInclude only necessary files in your image. That may sound obvious, but it’s\
    \ easy to include unwanted files.\n\nFirst of all, avoid `COPY` instructions that\
    \ are too broad. A typical example that should be avoided is:\n```\nCOPY . .\n\
    ```\n\nTry to be as precise as possible. If necessary, split them into separate\
    \ `COPY` instructions such as:\n```\nCOPY ./Project/src/*.ts\nCOPY ./Project/package.json\
    \ .\n```\n\nObviously, there are times when you will need to use `COPY` instructions\
    \ that copy whole folders, as below:\n```\nCOPY ./js/built /app\n```\n\nHowever,\
    \ you may want to exclude files from that copy. You can use a `.dockerignore`\
    \ file for that purpose. Simply add a `.dockerignore` file at the root of your\
    \ build context that lists files and folders that should be excluded from the\
    \ build like a `.gitignore` file.\n\nHere is an example .dockerignore file:\n\
    ```\n#Ignore .git folder\n.git\n#Ignore Typescript files in any folder or subfolder\n\
    **/*.ts\n```\n\nSecond, when using package managers like NPM, NuGet, apt and so\
    \ on, make sure you run them while building the image. It will avoid sending them\
    \ as the context of the image, and it will allow the layer caching system to cache\
    \ the result of running them. As long as the definition file doesn’t change, Docker\
    \ will reuse its cache.\n\n#### Base image size\n\nThe base image you choose in\
    \ your `FROM` instruction (the one at the top of your `Dockerfile` file) is part\
    \ of the image you build.\n\nThere are optimizations in which a machine will not\
    \ pull the base image when pulling your image, as long as it already pulled that\
    \ base image before. But oftentimes such optimizations cannot be ran, so you’d\
    \ better reference small base images.\n\nMany images that you can use as base\
    \ images have smaller variants. For instance, the `debian` image I used in the\
    \ Create Docker images chapter is quite big. Here is the definition I used:\n\n\
    ```docker\nFROM debian:8\nCMD [\"echo\", \"Hello world\"]\n```\n\nThat definition\
    \ results in an image that weights 127 MB (size can be checked using the `docker\
    \ image ls` command).\n"
  raw: 'My second option is much better: use the docker tag command. A Docker image
    can have several names as needed, and they can all be added to an already existing
    image thanks to the docker tag command. The docker tag doesn’t duplicate the image
    (contrary to running docker build again).


    The docker tag command accepts two arguments: first the name of an existing image,
    second the name you want to add to that image.


    docker tag webserver learnbook/webserver


    I now have a single Docker image known by my machine under two names: webserver
    and short_name/webserver . In case I run the docker image ls command, it will
    appear as two separate lines:


    Note that the image ID is the same for both lines, which means there really is
    just one image on my machine, known under different names.


    Now that my image is named correctly, I can publish it to the Docker hub. It’s
    just a matter of running two commands:


    docker login


    docker push learnbook/webserver


    The docker login command asks for my Docker Hub credentials interactively, but
    I could have just as well provided them as arguments to the command.


    The docker push command is smart enough to push only the bits that differ from
    the base nginx image I used since it is already stored in the Docker Hub, as the
    output shows:


    The push refers to repository [docker.io/learnbook/webs


    erver]


    0f83d7865e1e: Pushed


    6b5e2ed60418: Mounted from library/nginx


    92c15149e23b: Mounted from library/nginx


    0a07e81f5da3: Mounted from library/nginx


    latest: digest: sha256:e8597…1ae0b1efb1 size: 1155


    That’s it! The Docker Hub now hosts my image for everyone to see and run it.


    Everyone can see my image because it is public. In case I don’t want to share
    it with the whole world, I can set it as private.


    7.5 Run an image on another machine


    This is an extremely easy process. In fact you already know how: use the docker
    run command. Or first get the image with docker pull then use it with docker run
    (this would be useful in case you plan to disconnect from the internet before
    running a container, for instance).


    In fact, you can try it on your machine (with Docker Engine or Docker Desktop
    installed). Run the following command:


    docker run –rm -it -p 8085:80 learnbook/webserver


    Then pop-up your browser and head on to the following URL in order to see my web
    page being served over HTTP by that container.


    http://localhost:8085


    Isn’t that neat? A painless delivery system.


    There’s a little variant to this. In case you want to run an image that is stored
    in a private registry, you first need to log into the registry using the docker
    login command. Once this is done, you can docker pull the image. Should you want
    to run another container with that image later on, you don’t need to login since
    the image is stored on your machine.


    7.6 Exercise - Publish an image and run a container on another machine


    Create a Docker ID on https://hub.docker.com/


    Publish your jsparam image to the Docker Hub.


    Get another machine that runs Docker Engine or Docker Desktop and create two containers
    from the published jsparam image in order to compute the area of circles that
    have diameters of 3.5 cm and 1.5 cm.


    7.7 Exercise solution


    Head to https://hub.docker.com/ with a browser and click the Sign Up link.


    Create an account with the Docker ID you wish (in the rest if this solution we’ll
    suppose it is learnbook , but replace it with your own).


    Open a command-line.


    Run the following commands:


    docker tag jsparam learnbook/jsparam


    docker login -u learnbook -p


    <


    your-password>


    docker push learnbook/jsparam


    Get another machine that runs Docker Engine or Docker Desktop and open a command-line.


    Run the following commands:


    docker run –rm -e diameter=3.5 learnbook/jsparam


    docker run –rm -e diameter=1.5 learnbook/jsparam


    You should get the following output:


    > docker run –rm -e diameter=3.5 learnbook/jsparam


    Unable to find image ‘learnbook/jsparam:latest’ locally


    latest: Pulling from learnbook/jsparam


    Digest: sha256:a80621fe…328f3


    Status: Downloaded newer image for learnbook/jsparam:la


    test


    Area of a 1.75 cm radius disk:


        9.62112750161874 cmÂ²


    > docker run –rm -e diameter=1.5 learnbook/jsparam


    Area of a 0.75 cm radius disk:


        1.7671458676442586 cmÂ²


    7.8 Private registries


    Public registries are a convenient way to share your Docker images, but you will
    probably want to keep some images to your company, yourself or an organization.
    Private registries ensure you can keep your private images… private.


    When we published our images to the Docker Hub using the docker push command,
    we had to use the docker login command first in order to authenticate. A private
    registry will require users to also use docker login before they can pull an image.


    There are many ways to get a private registry:


    Docker Hub, where you pay according to the quantity of private repositories used;


    Azure Container Registry allows you to have your own private registry in Azure;


    GitLab has an included optional Docker registry: enable it so that each project
    can store the images it creates;


    The registry image allows you to host your own registry on a Docker enabled machine
    as a container.


    Storing images in a private registry is the same process we used when pushing
    images to the Docker Hub: your images’ names simply need to be prefixed with the
    registry name before they are pushed.


    7.9 Size matters


    When you create an image, you want it to be as small as possible for several reasons:


    reduce pull and push times;


    use a minimum amount of space in the Registry;


    use a minimum amount of space on the machines that will run the containers;


    use a minimum amount of space on the machine that creates the image.


    In order to reduce the size of an image, you need to understand that it is influenced
    by several factors:


    the files included in your image;


    the base image size;


    image layers.


    Ideally you want to reduce those. Let’s see how.


    Files included in your image


    Include only necessary files in your image. That may sound obvious, but it’s easy
    to include unwanted files.


    First of all, avoid COPY instructions that are too broad. A typical example that
    should be avoided is:


    COPY . .


    Try to be as precise as possible. If necessary, split them into separate COPY
    instructions such as:


    COPY ./Project/src/*.ts ./src


    COPY ./Project/package.json .


    Obviously, there are times when you will need to use COPY instructions that copy
    whole folders, as below:


    COPY ./js/built /app/js


    However, you may want to exclude files from that copy. You can use a .dockerignore
    file for that purpose. Simply add a .dockerignore file at the root of your build
    context that lists files and folders that should be excluded from the build like
    a .gitignore file.


    Here is an example .dockerignore file:


    #Ignore .git folder


    .git


    #Ignore Typescript files in any folder or subfolder


    **/*.ts


    Second, when using package managers like NPM, NuGet, apt and so on, make sure
    you run them while building the image. It will avoid sending them as the context
    of the image, and it will allow the layer caching system to cache the result of
    running them. As long as the definition file doesn’t change, Docker will reuse
    its cache.


    Base image size


    The base image you choose in your FROM instruction (the one at the top of your
    Dockerfile file) is part of the image you build.


    There are optimizations in which a machine will not pull the base image when pulling
    your image, as long as it already pulled that base image before. But oftentimes
    such optimizations cannot be ran, so you’d better reference small base images.


    Many images that you can use as base images have smaller variants. For instance,
    the debian image I used in the Create Docker images chapter is quite big. Here
    is the definition I used:


    Dockerfile


    FROM debian:8


    CMD [“echo”, “Hello world”]


    That definition results in an image that weights 127 MB (size can be checked using
    the docker image ls command).'
