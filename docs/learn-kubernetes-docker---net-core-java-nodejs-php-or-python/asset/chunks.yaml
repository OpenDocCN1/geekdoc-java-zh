    12.7 Declarative commands


    There’s a better way to manage Kubernetes objects on the long run: declarative
    commands. Instead of telling Kubernetes what to do , you tell Kubernetes what
    you expect . This allows Kubernetes to reach the expected state no matter what
    the initial state is. Which in turn simplifies your deployment and maintenance
    routines.


    For instance, suppose you tell Kubernetes that you want two Pods. The actions
    it will take will depend on the actual state of the Kubernetes cluster at the
    moment you provide your command and later on:


    If the cluster has no Pod, it will create two.


    If the cluster has one such Pod, it will create another one.


    If the cluster has 4 such Pods, it will delete two.


    If the cluster has two such Pods running an older version of the image, they will
    be replaced by new ones.


    If a cluster Node crashes that was running any of those two Pods, the corresponding
    number of Pods will be created on another Node.


    There’s one drawback to declarative commands: they look more complex than imperative
    commands at first. This is due to the fact that they are verbose because they
    describe all the values of the expected state that are not default ones. But you’ll
    get used to it on the long run, plus it’s good practice anyway to make things
    explicit.


    Declarative commands bring many advantages:


    Simpler than imperative commands for application maintenance.


    Easily used in a CI/CD chain.


    Apply good practices like: Infrastructure as Code and Single Source of Truth.


    Given an imperative command, Kubernetes takes the appropriate steps for reaching
    the expected state described by the command.


    Running declarative commands


    In order to run declarative commands, the commonly used way is to create a YAML
    file that describes the expected state and provide that file to the kubectl apply
    command.


    Here’s an example YAML file (more about that syntax later):


    deploy.yaml


    apiVersion : apps / v1beta1 kind : Deployment metadata :


    name : my - front spec :


    replicas : 1


    template :


    spec :


    containers :


    *   name : my - front


    image : my - wordpress : 1.0


    ports :


    *   containerPort : 80


    And here’s the command to make the Kubernetes cluster conform to that description:


    > kubectl apply -f deploy.yaml


    After running that command, Kubernetes creates a Deployment, which in turn creates
    a ReplicaSet, which creates a Pod running a container from the my-wordpress:1.0
    image:


    ![](media/file47.jpg)


    A state to be reached


    Kubernetes will try to reach the state described in the YAML file whatever the
    starting state of the cluster. That makes it very handy to deploy an application
    equally on a local machine, a test cluster or a production one: it will mostly
    be a matter of providing the same YAML (and varying parameters or environment
    variables, more about that later).


    It also means that scaling out or upgrading a Kubernetes application - a task
    that may have been daunting for non-containerized applications - becomes a simple
    one: all you need to do is apply the desired YAML file.


    For instance, let’s scale out our application. Scaling out means that we create
    more Pods in order to handle more workload : if one Pod on a Node can handle a
    given amount of users, four Pods on several Nodes will handle a higher number.
    Another advantage of scaling out is that your application becomes more resilient:
    losing one Pod out of four is no big deal, at least much less that losing your
    only Pod.


    So, let’s scale out. It’s a simple matter of changing one number in the YAML file
    and use the same kubectl apply command as before.


    deploy.yaml


    apiVersion: apps/v1beta1


    kind: Deployment


    metadata:


      name: my-front


    spec:


      replicas: 4


      template:


        spec:


          containers:


          - name: my-front


            image: my-wordpress:1.0


            ports:


            - containerPort: 80


    > kubectl apply -f deploy.yaml


    ![](media/file48.jpg)


    Kubernetes will compare the submitted file and the current cluster state. Since
    there is already one running Pod, it is going to create 3 other Pods running the
    same image. Easy and smooth. Downscaling would be just as easy: I can change the
    replicas count to a lower number and Kubernetes will terminate the Pods that are
    not needed anymore.


    Kubernetes creates the new Pods in a deliciously clever way: in runs one more
    Pod, and checks that the Pod actually works; in case the Pod works, it proceeds
    with the next Pod. That way, it avoids filling a cluster with invalid Pods. And
    this is just the default behavior, which can be configured.


    How would we upgrade those 4 running Pods to a newer version of the image? Just
    as easily: we change the image part of the YAML file and run the same kubectl
    apply command.


    deploy.yaml


    apiVersion: apps/v1beta1


    kind: Deployment


    metadata:


      name: my-front


    spec:


      replicas: 4


      template:


        spec:


          containers:


          - name: my-front


            image: my-wordpress:1.1


            ports:


            - containerPort: 80


    > kubectl apply -f deploy.yaml'
