    `ping` 命令不会结束因为它一直在 ping Docker 服务器。这是一个长寿容器。我可以使用 `Ctrl-C` 快捷键从它分离，它会在后台继续运行。但最好从开始就以分离模式运行它：


    ```bash

    docker run -d alpine ping www.docker.com

    ```


    注意增加了 `-d` 选项。这样做时，容器启动了但我们看不到它的输出。相反，`docker run` 命令返回了刚创建的容器的 ID：


    ![](img/file20.jpg)


    容器 ID 很长。不过，你不需要在命令中完全写出它。只要没有冲突，你可以在像 `docker logs` 或 `docker run` 这样需要容器 ID
    的命令中使用 ID 的开头。这在你管理容器时非常方便。


