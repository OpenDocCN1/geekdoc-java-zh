  trans: "\n\n我的第二个选择要好得多：使用 `docker tag` 命令。Docker 镜像可以根据需要拥有多个名称，通过 `docker tag`\
    \ 命令，可以将所有这些名称都添加到已有的镜像中。`docker tag` 不会复制镜像（这与再次运行 `docker build` 不同）。\n\n`docker\
    \ tag` 命令接受两个参数：第一个是现有镜像的名称，第二个是你想要添加到该镜像上的新名称。\n\n```\ndocker tag webserver learnbook/webserver\n\
    ```\n\n现在我的机器上可以通过两个名称识别的同一个 Docker 镜像：`webserver` 和 `short_name/webserver`。如果我运行\
    \ `docker image ls` 命令，它将以两行的形式显示：注意，这两行的镜像 ID（Image ID）是相同的，这意味着在我的机器上实际上只有一个镜像，只是以不同的名称存在。\n\
    \n现在我的镜像已经命名正确，我可以将其发布到 Docker Hub 了。这只需要运行两个命令：\n\n```\ndocker login\ndocker\
    \ push learnbook/webserver\n```\n\n`docker login` 命令会以交互方式要求输入我的 Docker Hub 凭据，但我也可以将它们作为参数传递给命令。\n\
    \n`docker push` 命令足够智能，它只会推送与我使用的基础 nginx 镜像不同的部分，因为它已经存储在 Docker Hub 中，如输出所示：\n\
    \n```\nThe push refers to repository [docker.io/learnbook/servers]\n0f83d7865e1e:\
    \ Pushed\n6b5e2ed60418: Mounted from library/nginx\n92c15149e23b: Mounted from\
    \ library/nginx\n0a07e81f5da3: Mounted from library/nginx\nlatest: digest: sha256:e8597…1ae0b1efb1\
    \ size: 1155\n```\n\n就是这样！Docker Hub 现在托管了我的镜像，供所有人查看和运行。每个人都能看到我的镜像，因为它是公开的。如果我不想向全世界共享它，可以将其设置为私有。\n\
    \n### 7.5 在另一台机器上运行镜像\n\n这是一个极其简单的过程。事实上，你已经知道怎么做了：使用 `docker run` 命令。或者先用 `docker\
    \ pull` 获取镜像，然后用 `docker run` 使用它（这在你计划在运行容器之前断开网络连接时非常有用）。\n\n事实上，你可以在自己的机器上尝试一下（需已安装\
    \ Docker Engine 或 Docker Desktop）。运行以下命令：\n\n```\ndocker run –rm -it -p 8085:80\
    \ learnbook/webserver\n```\n\n然后打开浏览器并访问到以下 URL，查看该容器如何通过 HTTP 提供我的网页。\n\n`http://localhost:8085`\n\
    \n这不酷吗？一个无痛的交付系统。\n\n这有一个小变体。如果你想运行存储在私有仓库（private registry）中的镜像，首先需要使用 `docker\
    \ login` 命令登录仓库。完成后，你就可以 `docker pull` 镜像。如果你以后想用该镜像运行另一个容器，就不需要再次登录，因为镜像已经存储在你的机器上了。\n\
    \n### 7.6 练习 - 发布镜像并在另一台机器上运行容器\n\n1. 在 `https://hub.docker.com/` 上一个 Docker ID。\n\
    2. 将你的 `jsparam` 镜像发布到 Docker Hub。\n3. 找另一台运行 Docker Engine 或 Docker Desktop 的机器，并根据发布的\
    \ `jsparam` 镜像创建两个容器，以计算直径为 3.5 cm 和 1.5 cm 的圆的面积。\n\n### 7.7 练习解答\n\n使用浏览器访问\
    \ `https://hub.docker.com/` 并点击 `Sign Up` 链接。用你想要的 Docker ID 创建账户（在本解答的剩余部分中，我们假设它是\
    \ `learnbook`，但请替换为你自己的）。\n\n打开命令行。运行以下命令：\n\n```\ndocker tag jsparam learnbook/jsparam\n\
    docker login -u learnbook -p <your-password>\ndocker push learnbook/jsparam\n\
    ```\n\n找另一台运行 Docker Engine 或 Docker Desktop 的机器并打开命令行。运行以下命令：\n\n```\ndocker\
    \ run –rm -e diameter=3.5 learnbook/jsparam\ndocker run –rm -e diameter=1.5 learnbook/jsparam\n\
    ```\n\n你应该会得到如下输出：\n\n```\n> docker run –rm -e diameter=3.5 learnbook/jsparam\n\
    Unable to find image ‘learnbook/jsparam:latest’ locally\nlatest: Pulling from\
    \ learnbook/jsparam\nDigest: sha256:a80621fe…328f3\nStatus: Downloaded newer image\
    \ for learnbook/jsparam:latest\nArea of a 1.75 cm radius disk:\n    9.62112750161874\
    \ cm²\n\n> docker run –rm -e diameter=1.5 learnbook/jsparam\nArea of a 0.75 cm\
    \ radius disk:\n    1.7671458676442586 cm²\n```\n\n### 7.8 私有仓库\n\n公共仓库是共享 Docker\
    \ 镜像的方便方式，但你可能想将某些镜像留给公司、你自己或某个组织。私有仓库确保你可以保持你的私有镜像……私有。\n\n当我们使用 `docker push`\
    \ 命令将镜像发布到 Docker Hub 时，私有仓库确保你可以保持你的私有镜像……私有。（注：此处原文似乎重复提了 Docker Hub）。当我们将镜像发布到\
    \ Docker Hub 时，在私有仓库，你首先需要使用 `docker login` 命令登录仓库。完成后，你就可以 `docker pull` 镜像。如果你以后想用该镜像运行另一个容器，就不需要再次登录，因为镜像已经存储在你的机器上了。\n\
    \n### 7.9 大小很重要\n\n当你创建镜像时，你希望它尽可能小，原因有许多：\n- 减少拉取和推送时间；\n- 节省空间；\n- 在运行容器的机器上，你希望减小镜像的大小。\n\
    \n为了减小镜像的大小，你需要理解它受哪些因素影响：\n- 镜像包含的文件；\n- 基础镜像的大小；\n- 层。\n\n#### 镜像包含的文件\n\n在镜像中包含必要的文件。这可能显而易见，但很容易包含不需要的文件。\n\
    \n首先，避免过于宽泛的 `COPY` 指令。一个典型的例子是：\n```\nCOPY .\n```\n\n尽量精确。如果有必要，将其拆分为分开的 `COPY`\
    \ 指令，例如：\n```\nCOPY ./Project/src/*.ts\nCOPY ./Project/package.json\n```\n\n显然，有时你需要复制整个文件夹的\
    \ `COPY` 指令，如下：\n```\nCOPY ./js/built /app\n```\n\n但是，你可能想从拷贝中排除文件。可以使用 `.dockerignore`\
    \ 文件来实现。只需在构建上下文的根目录下添加 `.dockerignore` 文件，列出应排除的文件和文件夹，就像 `.gitignore` 文件一样。\n\
    \n这是一个 `.dockerignore` 示例：\n```\n#忽略 .git 文件夹\n.git\n#忽略任何文件夹或子文件夹下的 TypeScript\
    \ 文件\n**/*.ts\n```\n\n其次，在使用 NPM、NuGet、apt 等包管理器时，确保在构建镜像时运行它们。这会避免将它们作为镜像上下文发送，并允许层缓存系统缓存运行结果。只要定义文件没有更改，Docker\
    \ 就会重用缓存。\n\n#### 基础镜像大小\n\n你在 `FROM` 指令中选择的基础镜像（`Dockerfile` 顶部的指令）是你构建的镜像的一部分。\n\
    \n在某些优化情况下，如果机器已经拉取过该基础镜像，则不需要再次拉取。但通常无法进行此类优化，因此你最好引用较小的基础镜像。\n\n许多可以作为基础的镜像都有更小的变体。例如，我在“创建\
    \ Docker 镜像”章节使用的 `debian` 镜像很大。这是我使用的定义：\n\n```docker\nFROM debian:8\nCMD [\"\
    echo\", \"Hello world\"]\n```\n\n该定义生成的镜像重量 127 MB（可以使用 `docker image ls` 命令检查大小）。\n\
    \n"
- fmt: "\nIf I head to the description page of that image, I can see that there is\
    \ a smaller variant using the `8-slim` tag. Here is an optimized definition:\n\
    \n```dockerfile\nFROM debian:8-slim\nCMD [\"echo\", \"Hello world\"]\n```\n\n\
    That revised definition yields an image that weights 79.3 MB. We just saved 38%\
    \ of the original image size.\n\nThe same can be done using a `node:alpine` image\
    \ instead of the default `node` image. For instance, the image definition I used\
    \ for my webserver image results in a 109 MB image:\n\n```dockerfile\nFROM nginx:1.15\n\
    COPY index.html /usr/share/nginx/html\n```\n\nIf I switch the base image from\
    \ `nginx:1.15` to `nginx:1.15-alpine`, the resulting image weights only 16.1 MB.\
    \ That’s a 85% saving over the original image size! Here’s the optimized image\
    \ definition:\n\n```dockerfile\nFROM nginx:1.15-alpine\nCOPY index.html /usr/share/nginx/html\n\
    ```\n\n### Image layers\n\nWhen creating an image, Docker reads each instruction\
    \ in order and the resulting partial image is kept separate: it is cached and\
    \ labeled with a unique ID. Such caching is very effective because it is used\
    \ at different moments of an image life:\n\n- in a future build, `Docker` will\
    \ use the cached part instead of recreating it as long as it is possible;\n- when\
    \ pushing a new version of the image to a `Registry`, the common part is not pushed;\n\
    - when pulling an image from a `registry`, the common part you already have is\
    \ not pulled.\n\nThe caching mechanism can be summed up as follows: when building\
    \ a new image `Docker` will try its best to skip all instructions up to the first\
    \ instruction that actually changes the resulting image. All prior instructions\
    \ result in the cached layers being used. Let’s see some examples.\n\nSuppose\
    \ I want to create an image that included PHP, so I create the following `Dockerfile`\
    \ file:\n\n```dockerfile\nFROM debian:8\nCOPY . .\nRUN apt-get update && apt-get\
    \ upgrade && apt-get dist-upgrade -y\nRUN apt-get install -y php5\n```\n\nWhen\
    \ I build it using the `docker build` command, it takes quite some time because\
    \ the two `RUN` steps need to download files and manipulate them. That’s normal\
    \ and expected. Here’s the truncated output:\n\n```\nStep 1/4 : FROM debian:8\n\
    —> ec0727c65ed3\nStep 2/4 : COPY . .\n—> cb8153c1f09a\nStep 3/4 : RUN apt-get\
    \ update && apt-get upgrade && apt-get dist-upgrade -y\n—> Running in eff335d4aeba\n\
    Get:1 http://security.debian.org jessie/updates InRelease [44.9 kB][…]\n[…]\n\
    Removing intermediate container eff335d4aeba\n—> f4a652ba0849\nStep 4/4 : RUN\
    \ apt-get install -y php5\n—> Running in d43a7a64606d\n```\n\nWait, let's look\
    \ at the rest of the output:\n\n```\nReading package lists…\nBuilding dependency\
    \ tree…\nReading state information…\nThe following extra packages will be installed:\n\
    \  apache2 apache2-bin apache2-data apache2-utils file ifupdown isc-dhcp-client\n\
    \  isc-dhcp-common krb5-locales libalgorithm-c3-perl libapache2-mod-php5\n[…]\n\
    Need to get 23.2 MB of archives.\nAfter this operation, 88.3 MB of additional\
    \ disk space will be used.\nGet:1 http://deb.debian.org/debian/ jessie/main libgdbm-3\
    \ amd64 1.8.3-13.1 [30.0 kB]\nGet:2 http://deb.debian.org/debian/ jessie/main\
    \ libjson-c2 amd64 0.11-4 [24.8 kB]\n[…]\nPreparing to unpack …/libkrb5support0_1.12.1+dfsg-19+deb8u5_amd64.deb\
    \ …\nUnpacking libkrb5support0:amd64 (1.12.1+dfsg-19+deb8u5)\n…\nSelecting previously\
    \ unselected package libk5crypto3:amd64.\n[…]\nRemoving intermediate container\
    \ d43a7a64606d\n—> 3499256d8527\nSuccessfully built 3499256d8527\n```\n\nSince\
    \ this is the first build, each instruction is processed. Each of the 4 steps\
    \ has been cached however.\n\nIf I run the same `docker build` command without\
    \ changing anything, I can benefit from the cached layers. The whole build process\
    \ takes less than a second and here’s the output:\n\n```\nStep 1/4 : FROM debian:8\n\
    —> ec0727c65ed3\nStep 2/4 : COPY . .\n—> Using cache\n—> cb8153c1f09a\nStep 3/4\
    \ : RUN apt-get update && apt-get upgrade && apt-get dist-upgrade -y\n—> Using\
    \ cache\n—> f4a652ba0849\nStep 4/4 : RUN apt-get install -y php5\n—> Using cache\n\
    —> 3499256d8527\nSuccessfully built 3499256d8527\n```\n\nNote that each layer\
    \ ID matches. To improve this, we should reorder the instructions. If we move\
    \ `COPY . .` to the end, the `RUN` steps will be cached and only the `COPY` will\
    \ execute when the source code changes.\n\nHere’s the optimized `Dockerfile` by\
    \ placing the `COPY` instruction last:\n\n```dockerfile\nFROM debian:8\nRUN apt-get\
    \ update && apt-get upgrade && apt-get dist-upgrade -y\nRUN apt-get install -y\
    \ php5\nCOPY . .\n```\n\n### 8. Forget SDK installs\n\n#### 8.1 One tool to rule\
    \ them all\n\nIn the next chapter I’ll show you examples of Dockerfile files for\
    \ several development technologies. What I’d like you to note beforehand is that\
    \ the processes we use don’t depend on the development technology. Whether Java,\
    \ Python, .NET Core, Node.JS, PHP (or many other ones), the same instructions\
    \ are used to build, ship and deploy the applications.\n"
  raw: 'If I head to the description page of that image, I can see that there is a
    smaller variant using the 8-slim tag. Here is an optimized definition:


    Dockerfile


    FROM debian:8-slim


    CMD [“echo”, “Hello world”]


    That revised definition yields an image that weights 79.3 MB. We just saved 38%
    of the original image size.


    The same can be done using a node:alpine image instead of the default node image.
    For instance, the image definition I used for my webserver image results in a
    109 MB image:


    Dockerfile


    FROM nginx:1.15


    COPY index.html /usr/share/nginx/html


    If I switch the base image from nginx:1.15 to nginx:1.15-alpine , the resulting
    image weights only 16.1 MB. That’s a 85% saving over the original image size!
    Here’s the optimized image definition:


    Dockerfile


    FROM nginx:1.15-alpine


    COPY index.html /usr/share/nginx/html


    Image layers


    When creating an image, Docker reads each instruction in order and the resulting
    partial image is kept separate: it is cached and labeled with a unique ID. Such
    caching is very effective because it is used at different moments of an image
    life:


    in a future build, Docker will use the cached part instead of recreating it as
    long as it is possible;


    when pushing a new version of the image to a Registry, the common part is not
    pushed;


    when pulling an image from a registry, the common part you already have is not
    pulled.


    The caching mechanism can be summed up as follows: when building a new image Docker
    will try its best to skip all instructions up to the first instruction that actually
    changes the resulting image. All prior instructions result in the cached layers
    being used. Let’s see some examples.


    Suppose I want to create an image that included PHP, so I create the following
    Dockerfile file:


    FROM debian:8


    COPY . .


    RUN apt-get update && apt-get upgrade && apt-get dist-u


    pgrade -y


    RUN apt-get install -y php5


    When I build it using the docker build command, it takes quite some time because
    the two RUN steps need to download files and manipulate them. That’s normal and
    expected. Here’s the truncated output:


    Step 1/4 : FROM debian:8


    —> ec0727c65ed3


    Step 2/4 : COPY . .


    —> cb8153c1f09a


    Step 3/4 : RUN apt-get update && apt-get upgrade && apt


    -get dist-upgrade -y


    —> Running in eff335d4aeba


    Get:1 http://security.debian.org jessie/updates InRelea


    se [44.9 kB][…]


    […]


    Removing intermediate container eff335d4aeba


    —> f4a652ba0849


    Step 4/4 : RUN apt-get install -y php5


    —> Running in d43a7a64606d


    Reading package lists…


    Building dependency tree…


    Reading state information…


    The following extra packages will be installed:


      apache2 apache2-bin apache2-data apache2-utils file i


    fupdown isc-dhcp-client


      isc-dhcp-common krb5-locales libalgorithm-c3-perl lib


    apache2-mod-php5


    […]


    Need to get 23.2 MB of archives.


    After this operation, 88.3 MB of additional disk space


    will be used.


    Get:1 http://deb.debian.org/debian/ jessie/main libgdbm


    3 amd64 1.8.3-13.1 [30.0 kB]


    Get:2 http://deb.debian.org/debian/ jessie/main libjson


    -c2 amd64 0.11-4 [24.8 kB]


    […]


    Preparing to unpack …/libkrb5support0_1.12.1+dfsg-19+


    deb8u5_amd64.deb …


    Unpacking libkrb5support0:amd64 (1.12.1+dfsg-19+deb8u5)


    …


    Selecting previously unselected package libk5crypto3:am


    d64.


    […]


    Removing intermediate container d43a7a64606d


    —> 3499256d8527


    Successfully built 3499256d8527


    Since this is the first build, each instruction is processed. Each of the 4 steps
    has been cached however.


    If I run the same docker build command without changing anything, I can benefit
    from the cached layers. The whole build process takes less than a second and here’s
    the output:


    Step 1/4 : FROM debian:8


    —> ec0727c65ed3


    Step 2/4 : COPY . .


    —> Using cache


    —> cb8153c1f09a


    Step 3/4 : RUN apt-get update && apt-get upgrade && apt


    -get dist-upgrade -y


    —> Using cache


    —> f4a652ba0849


    Step 4/4 : RUN apt-get install -y php5


    —> Using cache


    —> 3499256d8527


    Successfully built 3499256d8527


    Note that each layer ID matches the ID of a layer that has been cache previously.
    For instance, the apt-get update command created the 5fa6ecc854bb layer, and running
    the same command gets us the same layer. If I had pushed the previous image to
    a Registry and I would push that one, almost nothing would actually be pushed.


    That’s efficient but unreal. In real life I would rebuild my image because some
    of the files used in the COPY step changed. Let’s change a file in the current
    directory and run the exact same docker build command. We can painfully see that
    the cache isn’t used and the build process takes several seconds again because
    it needs to download, unpack and install all the packages:


    Step 1/4 : FROM debian:8


    —> ec0727c65ed3


    Step 2/4 : COPY . .


    —> edec0c4e4746


    Step 3/4 : RUN apt-get update && apt-get upgrade && apt


    -get dist-upgrade -y


    —> Running in ddc4ad55ab7d


    Ign http://deb.debian.org jessie InRelease


    Get:1 http://deb.debian.org jessie-updates InRelease [1


    45 kB]


    Get:2 http://security.debian.org jessie/updates InRelea


    se [44.9 kB]


    […]


    Removing intermediate container ddc4ad55ab7d


    —> 6d484f51c8f8


    Step 4/4 : RUN apt-get install -y php5


    —> Running in b6ba3afb3cc9


    Reading package lists…


    Need to get 23.2 MB of archives.


    After this operation, 88.3 MB of additional disk space


    will be used.


    […]


    Removing intermediate container b6ba3afb3cc9


    —> 48c3c3bf2fad


    Successfully built 48c3c3bf2fad


    Why wasn’t any cache used this time? Simply because the COPY instruction was impacted
    by our changing a file. If we push that image to a Registry, the whole image will
    be pushed since no cache was used.


    How can we improve this? Simply by changing the order of the instructions in the
    Dockerfile file. Indeed, the files copied by the COPY instruction are much more
    likely to change than the packages needed to install PHP5\. So we can first install
    PHP and then copy the files. Here’s the improved Dockerfile file:


    FROM debian:8


    RUN apt-get update && apt-get upgrade && apt-get dist-u


    pgrade -y


    RUN apt-get install -y php5


    COPY . .


    Note that the COPY instruction has been placed last. That’s the only change.


    If I run the docker build instruction, then change some files in the folder (as
    we did earlier), and run the docker build command again, here’s what we get. On
    the first docker build , the whole build is done, taking up several seconds:


    Step 1/4 : FROM debian:8


    —> ec0727c65ed3


    Step 2/4 : RUN apt-get update && apt-get upgrade && apt


    -get dist-upgrade -y


    […]


    —> 219277a22ec2


    Step 3/4 : RUN apt-get install -y php5


    […]


    —> e493f018171f


    Step 4/4 : COPY . .


    […]


    —> 5d1f58a397c7


    Successfully built 5d1f58a397c7


    Now, if I change a file and run the docker build command again, the whole process
    only takes a few seconds because cached layers are used for everything except
    the COPY instruction:


    Step 1/4 : FROM debian:8


    —> ec0727c65ed3


    Step 2/4 : RUN apt-get update && apt-get upgrade && apt


    -get dist-upgrade -y


    —> Using cache


    —> 219277a22ec2


    Step 3/4 : RUN apt-get install -y php5


    —> Using cache


    —> e493f018171f


    Step 4/4 : COPY . .


    —> 08c87dcf7267


    Successfully built 08c87dcf7267


    Note how the ID of the layers resulting from step 1 to 3 are the same. Only step
    4 produces a different layer.


    As you can see, we had the exact same instructions in both case. The only change
    was the order of those instructions, which yielded a fantastic boost. In order
    to benefit from caching, do the steps in the Dockerfile that are likely to change,
    or have their input change, as late as possible.


    8.  Forget SDK installs


    8.1 One tool to rule them all


    In the next chapter I’ll show you examples of Dockerfile files for several development
    technologies. What I’d like you to note beforehand is that the processes we use
    don’t depend on the development technology. Whether Java, Python, .NET Core, Node.JS,
    PHP (or many other ones), the same instructions are used to build, ship and deploy
    the applications.'
