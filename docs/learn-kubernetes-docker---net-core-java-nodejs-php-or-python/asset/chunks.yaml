  trans: "\n\n由于我的集群中运行着 4 个版本为 1.0 的 Pod，它们需要被版本为 1.1 的 Pod 替换。Kubernetes 会创建一个新的\
    \ 1.1 Pod，并等待检查该 Pod 是否正常工作。如果 Pod 无法工作，Kubernetes 将停止创建 1.1 Pod，并保持 1.0 版本可用。如果\
    \ Pod 正常工作，Kubernetes 将删除一个 1.0 Pod 并继续创建第二个 1.1 Pod，以此此类推。\n\n![](img/file49.jpg)\n\
    \n简而言之，你的应用程序在更新期间将保持稳定，且不会消耗超出范围的资源；最棒的部分是，这一切默认情况下都是自动化的。\n\n再次，声明式命令无论初始状态如何都有效。如果你对空集群执行\
    \ `kubectl apply` 之前的 YAML 文件，它将一个接一个创建这 4 个 Pod。这是一个非常方便的功能，因为应用程序部署到开发集群的频率通常比部署到生产集群高。你可以定义\
    \ CI/CD 流水线，在每次推送代码时发布到开发集群，仅在向仓库添加标签或执行某些其他手动操作时发布到测试集群；使用完全相同的 YAML 文件和相同的 `kubectl\
    \ apply` 命令就可以轻松实现，只是在开发集群上的执行频率比测试集群高而已。\n\n如果你想使用单个 Kubernetes 集群来部署应用程序的开发版本和测试版本，这也是很容易：命名空间（Namespaces）可以将你的\
    \ Kubernetes 对象相互隔离。我们稍后会学习命名空间。\n\n## 声明式语法\n\n让我们仔细查看一下刚刚应用到 Kubernetes 集群的\
    \ YAML 文件，以及如何获取编写该文件的帮助。\n\n`kubectl` 命令还可以输出必要的 YAML，这样当你创建一个声明式 YAML 文件时，可以从现有文件开始，而不是从空白页开始。你只需要在命令式命令中添加\
    \ `--dry-run` 和 `-o yaml` 开关即可。\n\n例如，我之前使用的相同 `kubectl create deployment` 命令在添加必要的开关后，将输出以下\
    \ YAML：\n\n```bash\nkubectl create deployment hello --image=hello-world -dry-run\
    \ -o yaml\n```\n\n```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n\
    \  creationTimestamp: null\n  labels:\n    app: hello\n  name: hello\nspec:\n\
    \  replicas: 1\n  selector:\n    matchLabels:\n      app: hello\n  strategy: {}\n\
    \  template:\n    metadata:\n      creationTimestamp: null\n      labels:\n  \
    \      app: hello\n    spec:\n      containers:\n      - image: hello-world\n\
    \        name: hello-world\n        resources: {}\nstatus: {}\n```\n\n该 YAML 比我在演示中使用的更冗长，因为它包含了默认值。这是一件好事，因为我们希望将其作为基础模板。另一个值得注意的点是，实际的\
    \ YAML 会根据你运行的 Kubernetes 集群版本而有所异：它是使用 Kubernetes API 生成的，而该 API 在不同 Kubernetes\
    \ 版本之间略有不同。\n\n如果你更倾向于 JSON，也可以使用它。YAML 和 JSON 都是对象、对象列表和对象属性的文本表示格式。我在本书中使用 YAML，因为这是\
    \ Kubernetes 声明式命令中最常见的格式。YAML 规范可以在官方网站上找到，你可以通过该网站的预览部分或该快速入门快速上手……\n\n用于创建部署的文档中有四个主要属性（我们刚刚从\
    \ `kubectl` 命令获取的那些，或者我们在书中之前使用的那些）：\n\n- `apiVersion`: 指明后续属性使用的 Kubernetes API\
    \ 版本。\n- `kind`: 我们正在创建或更新的 Kubernetes 对象。在这里是 `Deployment`（部署）。\n- `metadata`:\
    \ 应附加到 Kubernetes 对象上的数据。它被用于多种目的查找 Kubernetes 对象。我们之前在创建选择器以查看日志时使用过它（记得 `kubectl\
    \ logs -l app=hello`），它也将用于 Kubernetes 对象之间的相互引用。\n- `spec`: 描述 `Deployment` 应该是什么样：\n\
    \  - `template`: 描述由此 `Deployment` 管理的 Pod 应该是什么样。\n  - `replicas`: 此 `Deployment`\
    \ 应该拥有的 Pod 数量。这涉及到在数量增加或 Pod 死亡时创建 Pod，或者在数量减少或 Pod 具有不同的模板存在时删除 Pod。\n  - `strategy`:\
    \ 说明当此 `Deployment` 的之前的版本需要更新时，`Deployment` 将如何对当前 Pod 执行操作；我们将在“更新策略”章节中看到更多内容。\n\
    \n## 声明式命令\n\n让我们回顾一下如何使用声明式命令管理 Kubernetes 集群。\n\n这是创建对象的方法：\n\n```bash\nkubectl\
    \ apply -f deploy.yaml\n```\n\n这是你更新对象的方法（与上方命令相同）：\n\n```bash\nkubectl apply\
    \ -f deploy.yaml\n```\n\n这是你完全删除对象的方法：\n\n```bash\nkubectl delete -f deploy.yaml\n\
    ```\n\n虽然 Kubernetes 可能非常复杂，但这些命令的简单性直白地说明了 Kubernetes 如何让复杂的操作变得简单。\n\n在所有上述命令中，你可以将文件名替换为文件夹名。在这种情况下，文件夹中的所有文件都将通过命令。这允许你将每个\
    \ Kubernetes 对象写在单独的文件中而不是将它们全部打包。\n\n例如，考虑以下文件（为了简洁已进行了截断）：\n\n`deploy.yaml`\n\
    ```yaml\napiVersion : apps / v1beta1 kind : Deployment … — apiVersion : v1 kind\
    \ : Service …\n```\n\n使用 `--` 分隔符允许在单个 YAML 文件中描述多个对象。\n\n它可以通过以下命令应用：\n\n```bash\n\
    kubectl apply -f deploy.yaml\n```\n\n你也可以将其替换为 `k8s` 文件夹中的两个文件：\n\n`k8s/deployment.yaml`\n\
    ```yaml\napiVersion : apps / v1beta1 kind : Deployment …\n```\n\n`k8s/service.yaml`\n\
    ```yaml\napiVersion : v1 kind : Service …\n```\n\n这些文件将使用单个命令应用：\n\n```bash\n\
    kubectl apply -f ./k8s\n```\n\n## 12.8 练习 - 使用声明式命令创建资源\n\n**目标**：熟悉声明式创建资源。\n\
    \n1. 在 YAML 文件中描述名为 `pinger` 的 `Deployment`，部署 `learnbook/k8s-pinger:0.6` 镜像并带有\
    \ `app=pinger` 标签。\n2. 使用 `kubectl apply` 命令在 Kubernetes 集群中创建该 Deployment。\n\
    3. 显示 Pod 和 Deployment，检查 Deployment 是否创建。\n\n## 12.9 练习答案\n\n创建一个名为 `pinger-deployment.yaml`\
