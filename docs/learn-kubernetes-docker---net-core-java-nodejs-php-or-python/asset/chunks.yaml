    ```cs

    using Microsoft.AspNetCore.Builder ; using Microsoft.AspNetCore.Hosting ; using
    Microsoft.AspNetCore.Mvc ; using Microsoft.Extensions.Configuration ; using Microsoft.Extensions.DependencyInjection
    ;


    namespace aspnet_core {


    public class Startup


    {


    public void ConfigureServices (


    IServiceCollection services )


    {


    services . AddMvc (). SetCompatibilityVersion (


    CompatibilityVersion . Version_2_1 );


    }


    public void Configure (


    IApplicationBuilder app ,


    IHostingEnvironment env


    )


    {


    app . UseDeveloperExceptionPage ();


    app . UseDefaultFiles ();


    app . UseStaticFiles ();


    app . UseMvc ();


    }


    } }

    ```


    Spin up the HTTP server:


    `Program.cs`


    ```cs

    using Microsoft.AspNetCore ; using Microsoft.AspNetCore.Hosting ;


    namespace aspnet_core {


    public class Program


    {


    public static void Main ( string [] args )


    {


    WebHost . CreateDefaultBuilder ( args )

    . UseStartup < Startup >()

    . Build ()

    . Run ();


    }


    } }

    ```


    The `.csproj` file containing build instructions:


    `aspnet-core.csproj`


    ```xml

    <targetframework>netcoreapp2.2</targetframework>

    <PackageReference

    Include= “Microsoft.AspNetCore.App” />

    <PackageReference

    Include= “Microsoft.AspNetCore.Razor.Design”

    Version= “2.2”

    PrivateAssets= “All” />

    ```


    Definition of the image to build:


    `Dockerfile`


    ```dockerfile

    #Use an image with the SDK for compilation

    FROM microsoft/dotnet:2.2-sdk AS builder

    WORKDIR /app

    #Get the build file

    COPY *.csproj  .

    #Optinal. Run this first so that it is cached

    RUN dotnet restore

    #Get the source code inside the image

    COPY . .

    RUN dotnet publish –output /out/ –configuration Relea

    #Create a lightweight image

    FROM microsoft/dotnet:2.2-aspnetcore-runtime-alpine

    WORKDIR /app

    #Copy compiled artifacts from previous image

    COPY –from=builder /out .

    EXPOSE 80

    ENTRYPOINT [“dotnet”, “aspnet-core.dll”]

    ```


    # 9.2 Java


    ### Result

    The resulting image is published as `learnbook/java`. You can run a container
    from it with the following command:


    `docker run –rm learnbook/java`


    ### Files

    You may find those files in the `code/common-development-profiles/demos/java`
    folder.


    ### Simple Java source code:

    `Hello.java`


    ```java

    class Hello {

    public static void main ( String [] args ) {

    System . out . println ( “Java in a container.” );

    } }

    ```


    ### Docker image definition:

    `Dockerfile`


    ```dockerfile

    #Use an image with the SDK for compilation

    FROM openjdk:8-jdk-alpine AS builder

    WORKDIR /out

    #Get the source code inside the image

    COPY *.java .

    #Compile source code

    RUN javac Hello.java

    #Create a lightweight image

    FROM openjdk:8-jre-alpine

    #Copy compiled artifacts from previous image

    COPY –from=builder /out/*.class .

    CMD [“java”, “Hello”]

    ```


    # 9.3 Node.JS


    ### Result

    The resulting image is published as `learnbook/node-server`. You can run a container
    from it with the following command:


    `docker run –rm -it -p 8087:80 learnbook/node-server`


    Then point your browser to `http://localhost:8087`


    ### Files

    You may find those files in the `code/common-development-profiles/demos/nodejs`
    folder.


    ### A static HTML file to be served:

    `www/index.htm`


    ```html

    < h1 > Hello ! </ h1 > < p > This page is served by Node.JS </ p > < p > Try our
    < a href = “/v1/square/4” > multiply API </ a > . </ p >

    ```


    ### Define and run an HTTP server, a static files server and a REST API:

    `index.js`


    ```javascript

    const HTTP_PORT = 80 ;

    const cors = require ( ‘cors’ ); const express = require ( ‘express’ ); const
    path = require ( ‘path’ );

    var sourcesDirectory = path . resolve ( __dirname , ‘www’ ); var app = express
    (); app . use ( cors());

    // API app . get ( ‘/v1/square/:value’ , function ( req , res ) {

    const value = req . params . value ;

    const square = Math . pow ( value , 2 );

    res . send ({

    value ,

    square

    }); });

    // Static files app . use ( express . static ( sourcesDirectory , {

    index : ‘index.htm’ ,

    extensions : [ ‘htm’ ] }));

    var server = require ( ‘http’ ). createServer ( app ); server . listen ( HTTP_PORT
    );

    console . log ( `Listening on http://localhost: ${ HTTP_PORT } \` );

    ```


    ### List dependencies that will need to be restored during the build:

    `package.json`


    ```json

    {

    “name” : “node-server” ,

    “version” : “1.0.0” ,

    “main” : “index.js” ,

    “scripts” : {

    “start” : “node index.js”

    },

    “dependencies” : {

    “async” : “^2.4.1” ,

    “cors” : “^2.8.3” ,

    “express” : “^4.15.2”

    } } }

    ```


    ### Docker image definition:

    `Dockerfile`


    ```dockerfile

    FROM node:10-alpine

    #Create app directory

    RUN mkdir -p /usr/src/app

    WORKDIR /usr/src/app

    #Install app dependencies

    COPY package.json /usr/src/app/

    RUN npm install

    WORKDIR /usr/src/app

    #Bundle app source

    COPY . /usr/src/app/

    EXPOSE 80

    CMD [“npm”, “start”]

    ```


    # 9.4 PHP


    ### Result

    The resulting image is published as `learnbook/php-server`. You can run a container
    from it with the following command:


    `docker run –rm -it -p 8090:80 learnbook/php-server`


    Then point your browser to `http://localhost:8090`


    ### Files

    You may find those files in the `code/common-development-profiles/demos/php` folder.


    ### A static HTML file to be served:

    `index.php`


    ```html

    < h1 > Hello !</ h1 > < p > This page is served by PHP </ p > < p > Try our <
    a href = “/v1/square/4” > multiply API </ a >.</ p >

    ```


    ### A simple REST API definition:

    `myapi.php`


    ```php

    <?php

    $url = $_REQUEST [ ‘rquest’ ];

    $components = explode ( “/” , $url );

    $value = ( float ) $components [ 2 ];

    $square = $value * $value ;

    header ( “Content-Type: application/json; charset=UTF-8” );

    $result = array (

    ‘value’ => $value ,

    ‘square’ => $square

    );

    echo json_encode ( $result );

    ?>

    ```


    ### URL rewriting for Apache:

    `.htaccess`


    ```apache

    <IfModule mod_rewrite.c>

    RewriteEngine On

    RewriteCond %{REQUEST_FILENAME} -f [OR]

    RewriteCond %{REQUEST_FILENAME} -d

    RewriteRule ^(.+)$ myapi.php=$1 [L]

    </IfModule>

    ```


    ### Docker image definition:

    `Dockerfile`


    ```dockerfile

    FROM php:7.0-apache

    #Install Apache module

    RUN a2mod rewrite

    #Copy source files into the image

    COPY . /var/www/html/

    ```


    # 9.5 Python


    ### Result

    The resulting image is published as `learnbook/python-server`. You can run a container
    from it with the following command:


    `docker run –rm -it -p 8089:5000 learnbook/python-server`


    Then point your browser to `http://localhost:8089`


    ### Files

    You may find those files in the `code/common-development-profiles/demos/python`
    folder.


    ### A static HTML file to be served:

    `templates/index.htm`


    ```html

    < h1 > Hello ! </ h1 > < p > This page is served by Python </ p > < p > Try our
    < a href = “/v1/square/4” > multiply API </ a > . </ p >

    ```


    ### Define and run an HTTP server, a static files server and a REST API:

    `server.py`


    ```python

    from flask import Flask

    from flask import render_template

    from flask import request , jsonify


    app = Flask ( __name__ )


    @app.route ( ‘/v1/square/<value>’ )

    def show_user_profile ( value ):

    value = int(value)

    square = value * value

    return jsonify ( value = value , square = square )


    @app.route ( ‘/’ )

    def hello (:

    return render_template ( ‘index.htm’ )

    ```


    ### Docker image definition:

    `Dockerfile`


    ```dockerfile

    FROM python:3.7-stretch

    #Install modules

    RUN pip install Flask

    #Needed by the Flask module

    ENV FLASK_APP=server.py

    #Copy source files into the image

    COPY templates ./templates

    COPY server.py .

    EXPOSE 5000

