  trans: "\n\n我不会将 Helm 与 `NPM` 或 `NuGet` 这种同样管理包依赖关系的包管理器相提并，但当你想要向 Kubernetes 部署复杂应用时，它确实意味着了一条简便的路径。\n\
    \n从实践上讲，它主要允许为 `kubectl apply` 命令添加额外的功能：它允许在 YAML 文件中使用变量甚至是脚本，然后将这些文件打包在一起。Helm\
    \ 包被称为 `Charts`（（图表）。\n\n## 使用 Helm Charts\n\nHelm 中最简单的部分是使用现有的 `Chart`，即使用 Helm\
    \ 图表在 Kubernetes 集群中安装应用程序。这通过两个步骤完成：\n\n1. 添加 Helm 存储库（chart 的来源，类似于 Docker 镜像的\
    \ `Registry`）；\n2. 使用以下命令安装 chart：\n\n`helm install <name>--set version=1.0,key=value,...\
    \ chart`\n\n`--set` 选项允许你重写 chart 中的默认值。当有许多值时，你可以在一个 YAML 文件中提供它们。\n\n让我们举一个例子来说明这一点。假设我想安装\
    \ Redis。Redis 是一个分布式缓存，这意味着值存储在不同的机器上：这是一个可以轻松分发到多个 `Nodes` 上的 `Pods` 的绝佳示例。\n\
    \n从 Redis chart 的描述中可以看到创建的从节点数量由 `cluster.slaveCount` 变量设置。它的默认值为 1，我想将其重写为 3，以便我有\
    \ 4 个 `Pods` 运行我的 Redis 集群（1 个主节点，3 个从）。\n\n```bash\nhelm repo add stable https://kubernetes-charts.storage.googleapis.com/\n\
    “stable” has been added to your repositories\n\nhelm install mycache stable/redis\
    \ --set cluster.slaveCount=3\n\nNAME: mycache\nLAST DEPLOYED: Thu Jan 30 14:07:47\
    \ 2020\nNAMESPACE: default\nSTATUS: deployed\nREVISION: 1\nTEST SUITE: None\n\
    NOTES:\n  Please be patient while the chart is being deployed\n```\n\n在集群内部，可以通过以下\
    \ DNS 名称通过端口 6379 访问 Redis：\n- `mycache-redis-master.default.svc.cluster.local`\
    \ 用于读写操作\n- `mycache-redis-slave.default.svc.cluster.local` 用于只读操作\n\n要获取密码请运行：\n\
    `...`\n\n输出为了简洁已经缩短，但正如你所看到的，在安装时 chart 会根据你提供的参数提供一些文档。\n\n让我们列出我的集群中运行的 `Pods`：\n\
    \n```bash\nkubectl get pods\nNAME                     READY  STATUS    AGE\nmycache-redis-master-0\
    \   1/1     Running   3m20s\nmycache-redis-slave-0    1/1     Running   3m20s\n\
    mycache-redis-slave-1    1/1     Running   2m34s\nmycache-redis-slave-2    1/1\
    \     Running   2m17s\n```\n\n好了，我确实有 4 个 `Pods` 在运行 Redis。就这么简单。\n\n## 18.2 创建\
    \ Helm 包 (charts)\n\n我们刚刚看到一个制作良好的 chart 如何简化复杂应用程序的部署。一旦你创建了适用于 Kubernetes 的应用程序，你可能想将其封装成一个\
    \ chart 以于分发。请注意，这是一个非常简单的过程。\n\n一个 chart 实际上是 `*.tar.gz` 包中的文件集合：\n\n![](img/file94.jpg)\n\
    \n这些文件有：\n- 描述 Kubernetes 对象的 YAML 文件，就像我们目前看到的那些一样，但增加了添加脚本的可能性；\n- 一个 `values.yaml`\
    \ 文件，定义了脚本中使用变量的默认值；\n- 一个 `NOTES.txt` 文件，在安装 chart 时将渲染帮助文本。\n\n如前提到的，在 YAML\
    \ 文件中可以使用 YAML 语法，并可以添加脚本块：就此而言，使用了 Go 模板：\n\n```yaml\napiVersion: apps/v1beta1\n\
    kind: Deployment\nmetadata:\n  name: back-{{ .Values.config }}\n```\n\n上述文件定义了一个\
    \ `Deployment`，该部署名称将通过在 `back-` 前缀后附加配置项来生成。配置项的实际值设置在 `values.yaml` 文件中，但在安装时可以使用\
    \ `--set` 选项或 YAML 文件进行重写。\n\n与其从空文件夹开始，不如使用以下命令脚手架 chart 模板：\n\n`helm create\
    \ <name>`\n\n这简单地创建一个包含足够启动文件的文件夹，以形成真正的 chart。然后你根据需要编辑这些文件。放置在 `templates` 目录中的任何\
    \ YAML 文件将成为 chart 的一部分。\n\n然后你使用以下命令创建 chart 包（lint 仅用于验证目的）：\n\n```bash\nhelm\
    \ lint <name>\nhelm package <name>--debug\n```\n\n这会在一个名为 `<name>-0.1.0.tgz` 的文件中创建一个可安装的\
    \ chart（版本号来自 `Chart.yaml` 文件）。在你分发 chart 之前，你可能想检查它实际上做了什么。可以通过以下命令完成，它将输出原本会被发送到\
    \ Kubernetes 集群的 YAML：\n\n```bash\nhelm install --dry-run --debug <name>-0.1.0.tgz\n\
    ```\n\n你现在可以通过两种方式分发你的 chart：\n- 分发 `*.tar.gz` 文件；\n- 将 `*.tar.gz` 文件放置在 Helm\
    \ 存储库上（托管 `*.tar.gz` 文件的简单 HTTP 文件服务器）。\n\n作为文件分发时，可以使用文件名安装 chart：\n\n`helm install\
    \ <name> <name>-0.1.0.tgz`\n\n当使用存储库分发时，用户只需使用 `helm repo add` 命令添加你的存储库即可。\n\n\
