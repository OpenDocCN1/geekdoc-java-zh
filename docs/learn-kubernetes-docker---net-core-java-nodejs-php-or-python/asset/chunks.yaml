    ![](media/file46.jpg)


    We’ll come back to ReplicaSets later when detailing upgrade strategies, but for
    now just consider that you create Deployments in order to run and upgrade your
    Pods.


    How do you create a Deployment ? There are actually two ways to do so: imperative
    and declarative. Imperative looks easy so we’ll begin with them. Declarative looks
    more complex, but in the long run it will make your work much easier.


    12.2 Imperative commands


    The kubectl create command allows you to imperatively create a Kubernetes resource.
    Here’s how you would create a Deployment of the hello-world Docker image:


    > kubectl create deployment hello –image=hello-world


    deployment.apps/hello created


    We can then check that the Deployment was actually created:


    > kubectl get deployments -l app=hello


    NAME    READY  UP-TO-DATE  AVAILABLE  AGE


    hello  0/1    1            0          1m45s


    There are several things worth noting here: the status of the Deployment, and
    the selector. Let me explain both.


    The selector -lapp=hello is optional. It means “return only those that have a
    label named app whose value is hello”. If your cluster is empty you could as well
    not use that selector. Labels are metadata you can place on Kubernetes objects.
    Selectors don’t change how an object behaves; they allow you to select similar
    objects later on.


    The status reported above looks quite strange because it states that 0 of 1 expected
    resource is available, though one is up to date. This is simply due to the fact
    that the hello-world image is a short-running image that outputs some text and
    stops, hence the Pod is short-lived. Had we launched a long-running image like
    an HTTP server, it would still be available.


    In details, the columns returned by the kubectl get deployment command have the
    following meaning:


    NAME: this is the name of the Deployment. We provided it in the kubectl get deployment
    command.


    READY: this is the number of up and running Pods created by this Deployment versus
    the ones we requested. We didn’t specify any quantity of Pods so the default is
    1\. 0 means that there is no running Pod, and this is due to the fact that the
    Pod was short-lived and stop.


    UP-TO-DATE: this is the number of Pods that could actually run the requested hello-world
    image. This means the image could successfully be pulled from a Docker registry.


    AVAILABLE: this is the number of Pods available to your users. Again, the fact
    that a 0 is reported here is due to the fact that we ran a short-lived image.


    In fact, things are a little more complicated. Remember that a Deployment’s aim
    is to ensure that your Pod is running whatever happens ? That means that once
    our short-lived Pod stops, the deployment creates a new one. So if you run the
    above kubectl get command several times in a row you will see that at some points
    in time there is one Pod marked as “Ready”. Mind you, Deployments are not for
    short-lived Pods and we should have used a Job instead so that the Pods is not
    restarted uselessly. More about Jobs later, but an interesting feature is that
    between two Pod restarts the Deployment will wait during increasing times; which
    means that a malfunctioning Pod should not stop your cluster due to excessive
    restarts.


    Let’s now see the output generated by the Pod. It’s the actual output of the hello-world
    image.


    > kubectl logs -l app=hello


    To try something more ambitious, you can run an Ubuntu


    container with:


    $ docker run -it ubuntu bash


    Share images, automate workflows, and more with a free


    Docker ID:


    https://hub.docker.com/


    For more examples and ideas, visit:


    https://docs.docker.com/get-started/


    The output was truncated to the last 10 lines. We could add the –tail switch in
    order to output more, like:


    > kubectl logs -l app=hello –tail 100


    Now let’s look at the Pod itself. The kubectl get command accepts names of many
    other Kubernetes resource types, hence we can use it for Pods:


    > kubectl get pods -l app=hello


    NAME      READY  STATUS            RESTARTS  AGE


    hello-f8  0/1    CrashLoopBackOff  32        22m


    We can see some details about the Pod, which reveal the reason why the it isn’t
    running: CrashLoopBackOff means that it’s in a waiting state because of a crash
    inside the Pod.


    We could dig further into the Pod for details, but that’s enough for now. Let’s
    get back to our interactive command. The problem with an interactive command is
    that its outcome depends on the current state of resources inside the cluster.
    If I run the initial command again, it has a different output:


    > kubectl create deployment hello –image=hello-world


    Error from server (AlreadyExists): deployments.apps “he


    llo” already exists


    As you can see, the command fails because a Deployment with the same name was
    already created. Should you manage a cluster manually, you can check whether the
    Deployment already exists and use different commands according to the current
    Deployment state. But who wants to manually manage applications inside a Kubernetes
    cluster in the long run?


    Obviously, we want to be able to automate creation and update of resources inside
    our Kubernetes cluster. We could write scripts that take into account the current
    state of resources before deciding what to do, but this is going to be tricky
    to test and complicated to write and maintain. Since the advantage of imperative
    commands is their simplicity, once we get into tricky things we can consider using
    a more simple tool. Good news: declarative commands will make automation much
    simpler.


    Before we move on to declarative command, let’s clean the resources we created.
    In fact, we just need to delete the Deployment, which in turn will delete the
    Pod it created (and the ReplicaSet).


    > kubectl delete deployment hello


    deployment.extensions “hello” deleted'
