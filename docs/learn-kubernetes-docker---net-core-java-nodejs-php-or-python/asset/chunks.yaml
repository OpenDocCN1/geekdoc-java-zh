- fmt: "\n```\ndocker logs 48bab7f673b3\ndocker inspect 48bab7f673b3\n```\n\nDocker\
    \ doesn’t know about that container anymore:\n\n![](media/file15.jpg)\n\n## 5.4\
    \ More about docker run\n\nYou can think of the `docker run` command as the equivalent\
    \ of buying a new computer, executing some command on it, then trashing it. Really.\
    \ Each time a container is created from an image you get a new isolated and virgin\
    \ environment to play with inside the container.\n\nWhat you get inside the container\
    \ depends on which image your container is based on. After the image name, you\
    \ can pass commands to execute inside the container.\n\nLet’s illustrate the new-computer-that-you-trash\
    \ metaphor using the `alpine` image. The `alpine` image is a very small Linux\
    \ image that does enough for our purpose. \n\nLet’s run a container and ask it\
    \ to display its hostname.\n\n```bash\ndocker run alpine printenv\n```\n\nWe basically\
    \ ask for a container to be created using the `alpine` image, and for the container\
    \ to execute the `printenv` command that is one of the binary programs packed\
    \ in the `alpine` image.\n\nWithout surprise, the `alpine` image is downloaded\
    \ in order to create the container, since it was not present on my disk already.\n\
    \nThe result is the following:\n\n![](media/file16.jpg)\n\nNow let’s run two more\
    \ containers and ask them to display their respective hostnames.\n\n```bash\n\
    docker run alpine printenv\ndocker run alpine printenv\n```\n\nThis is the same\
    \ command as above, repeated twice. On each line we’re asking for a new container\
    \ to be created using the `alpine` image, and for the container to execute the\
    \ `printenv` command.\n\nThe `alpine` image isn’t downloaded because it is already\
    \ on our disk. Two more independent containers are created. The result is the\
    \ following:\n\n![](media/file17.jpg)\n\nNote that inside each container the displayed\
    \ hostname is different. See? You get the equivalent of a new machine on each\
    \ container.\n\nHere is a simplified schema of what I did:\n\n![](media/file18.jpg)\n\
    \nWhat I want you to understand is that Docker is a tool that allows you to get\
    \ the equivalent of a disposable, single-time use computer. Once you get that\
    \ clear, a whole new world opens for you. You come from a world where obtaining\
    \ a new machine and configuring it required enough efforts to justify keeping\
    \ it, with all the side effects that meant on each subsequent use; in the containers’\
    \ world, getting a brand new environment is cheap enough for us to get many, many\
    \ of them.\n\nIf I list the stopped containers on my machine (`docker ps -a`)\
    \ I’ll get 3 stopped containers since I just asked for that number of containers\
    \ to be created. Being quite lazy, I don’t want to remove them one by one, so\
    \ I use the following handy command:\n\n```bash\ndocker container prune -f\n```\n\
    \nThis is simply the equivalent of running one `docker rm` command for each stopped\
    \ container. The `-f` switch is an implicit confirmation to proceed and delete\
    \ all stopped containers right away, instead of asking to confirm that operation.\n\
    \n## 5.5 Running a server container\n\nWe just saw how to run short-lived containers.\
    \ They usually do some processing and output something. There’s a very common\
    \ use for long-lived containers however: server containers. Whether you want to\
    \ host a web application, an API or a database, you want a container that listens\
    \ for incoming network connections and is potentially long-lived.\n\nA word of\
    \ warning: it’s best not to think about containers as long-lived, even when they\
    \ are. Don’t store information inside the containers. In other words, ensure your\
    \ containers are stateless not stateful. We’ll see later how and where to store\
    \ your container’s state. Docker containers are very stable, but the reason for\
    \ having stateless containers is that this allows for easy scaling up and recovery.\
    \ More about that later.\n\nIn short, a server container:\n- is long-lived;\n\
    - listens for incoming network connections.\n\nHow can we manage that? Read on.\n\
    \n### Running a long-lived container\n\nUp to now we remained connected to the\
    \ container from our command line using the `docker run` command. That makes it\
    \ impractical for running long-lived containers.\n\nTo disconnect while allowing\
    \ the long-lived container to continue running in the background, we use the `-d`\
    \ or `--detach` switch on the `docker run` command.\n\nRunning a container as\
    \ detached means that you immediately get your command-line back and the standard\
    \ output from the container is not redirected to your command-line anymore.\n\n\
    Suppose I want to run a `ping` command. I can use a Linux `alpine` container for\
    \ this:\n\n```bash\ndocker run alpine ping www.docker.com\n```\n\n![](media/file19.jpg)\n\
    \nThe `ping` command doesn’t end since it keeps pinging the Docker server. That’s\
    \ a long-lived container. I can detach from it using the `Ctrl-C` shortcut, and\
    \ it keeps running in the background. But it’s best to run it as detached from\
