  trans: "\n\n如果我进入该镜像的描述页面，可以看到有一个使用 `8-slim` 标签的较小变体。这是一个优化的定义：\n\n```dockerfile\n\
    FROM debian:8-slim\nCMD [\"echo\", \"Hello world\"]\n```\n\n这个修改后的定义生成了一个权重 79.3\
    \ MB 的镜像。我们刚刚节省了原始镜像 38% 体。\n\n使用 `node:alpine` 镜像代替默认的 `node` 镜像也可以同样的操作。例如，我用于\
    \ Web 服务器镜像的镜像定义生成了一个 109 MB 的镜像：\n\n```dockerfile\nFROM nginx:1.15\nCOPY index.html\
    \ /usr/share/nginx/html\n```\n\n如果我将基础镜像从 `nginx:1.15` 切换到 `nginx:1.15-alpine`，生成的镜像仅重\
    \ 16.1 MB。这比原始镜像节省了 85%！以下是优化的镜像定义：\n\n```dockerfile\nFROM nginx:1.15-alpine\n\
    COPY index.html /usr/share/nginx/html\n```\n\n### 镜像层 (Image layers)\n\n在创建镜像时，Docker\
    \ 会按顺序读取每条指令，并将生成的部分镜像分开保留：它们被缓存并用一个唯一的 ID 标记。这种缓存非常有效，因为它在镜像生命周期的不同阶段都会使用：\n\n\
    - 在未来的构建中，只要可能，`Docker` 将使用缓存部分而不是重新创建它；\n- 当将镜像的新版本推送到 `Registry` 时，公共部分不会被推送；\n\
    - 当从 `registry` 拉取镜像时，你已拥有的公共部分不会被拉取。\n\n缓存机制可以总结如下：当构建新镜像时，`Docker` 将尽力跳过直到第一个实际更改结果镜像的指令之前的所有指令。所有之前的指令都会导致使用缓存层。让我们来看一些例子。\n\
    \n假设我想创建一个包含 PHP 的镜像，因此我创建了以下 `Dockerfile` 文件：\n\n```dockerfile\nFROM debian:8\n\
    COPY . .\nRUN apt-get update && apt-get upgrade && apt-get dist-upgrade -y\nRUN\
    \ apt-get install -y php5\n```\n\n当我使用 `docker build` 命令构建它时，需要花费相当长的时间，因为两个 `RUN`\
    \ 步骤需要下载文件并对它们进行操作。这是正常且预期的。以下是截断的输出：\n\n```\nStep 1/4 : FROM debian:8\n—> ec0727c65ed3\n\
    Step 2/4 : COPY . .\n—> cb8153c1f09a\nStep 3/4 : RUN apt-get update && apt-get\
    \ upgrade && apt-get dist-upgrade -y\n—> Running in eff335d4aeba\nGet:1 http://security.debian.org\
    \ jessie/updates InRelease [44.9 kB][…]\n[…]\nRemoving intermediate container\
    \ eff335d4aeba\n—> f4a652ba0849\nStep 4/4 : RUN apt-get install -y php5\n—> Running\
    \ in d43a7a64606d\n```\n\n等等，让我们看看输出的剩余：\n\n```\nReading package lists…\nBuilding\
    \ dependency tree…\nReading state information…\nThe following extra packages will\
    \ be installed:\n  apache2 apache2-bin apache2-data apache2-utils file ifupdown\
    \ isc-dhcp-client\n  isc-dhcp-common krb5-locales libalgorithm-c3-perl libapache2-mod-php5\n\
    […]\nNeed to get 23.2 MB of archives.\nAfter this operation, 88.3 MB of additional\
    \ disk space will be used.\nGet:1 http://deb.debian.org/debian/ jessie/main libgdbm-3\
    \ amd64 1.8.3-13.1 [30.0 kB]\nGet:2 http://deb.debian.org/debian/ jessie/main\
    \ libjson-c2 amd64 0.11-4 [24.8 kB]\n[…]\nPreparing to unpack …/libkrb5support0_1.12.1+dfsg-19+deb8u5_amd64.deb\
    \ …\nUnpacking libkrb5support0:amd64 (1.12.1+dfsg-19+deb8u5)\n…\nSelecting previously\
    \ unselected package libk5crypto3:amd64.\n[…]\nRemoving intermediate container\
    \ d43a7a64606d\n—> 3499256d8527\nSuccessfully built 3499256d8527\n```\n\n由于这是第一次构建，每条指令都被处理了。不过，4\
    \ 个步骤中的每一个都已被缓存。\n\n如果我在不更改任何内容的情况下运行相同的 `docker build` 命令，我可以从缓存层中获益。整个构建过程不到一秒钟，以下是输出：\n\
    \n```\nStep 1/4 : FROM debian:8\n—> ec0727c65ed3\nStep 2/4 : COPY . .\n—> Using\
    \ cache\n—> cb8153c1f09a\nStep 3/4 : RUN apt-get update && apt-get upgrade &&\
    \ apt-get dist-upgrade -y\n—> Using cache\n—> f4a652ba0849\nStep 4/4 : RUN apt-get\
    \ install -y php5\n—> Using cache\n—> 3499256d8527\nSuccessfully built 3499256d8527\n\
    ```\n\n注意每个层 ID 都匹配。为了改进这一点，我们应该重新排列指令。如果我们将 `COPY . .` 移动到末尾，`RUN` 步骤将被缓存，只有当源代码发生变化时才会执行\
    \ `COPY`。\n\n以下是将 `COPY` 指令放在最后优化的 `Dockerfile`：\n\n```dockerfile\nFROM debian:8\n\
    RUN apt-get update && apt-get upgrade && apt-get dist-upgrade -y\nRUN apt-get\
    \ install -y php5\nCOPY . .\n```\n\n### 8. 忘记安装 SDK\n\n#### 8.1 一种工具统治一切\n\n在下一章节中，我将向你展示几种开发技术的\
    \ Dockerfile 文件示例。我想让你提前注意，我们使用的流程并不依赖于开发技术。无论是 Java、Python、.NET Core、Node.JS、PHP（或其他许多），用于构建、传输和部署应用程序的指令都是相同的。\n\
    \n"
- fmt: "\nThis is a major benefit in many environments. If you’re part of a team,\
    \ chances are that many technologies are being used; however, the way to build,\
    \ ship and deploy the applications depends on the applications’ development tools.\
    \ Having a single tool to manage them all yields several benefits:\n\n- members\
    \ of the team that use one development stack can help those using others;\n- a\
    \ single CI/CD process and common tools can be used across most projects, and\
    \ improvements benefit to all of those projects;\n- Practically, whatever the\
    \ technology the same instructions are used to build, ship and deploy the applications.\
    \ Something around those lines:\n\nBuild, deliver on the CI/CD server\n\n```bash\n\
    docker build -t learnbook/my-server .\ndocker push learnbook/my-server\n```\n\n\
    Deploy on the target machine\n\n```bash\ndocker run –rm -it -p 80:80 learnbook/my-server\n\
    ```\n\n## 8.2 Building rationally: easy CI\n\nNote that I wrote “build” in the\
    \ preceding chapter, while most of what we did in our `Dockerfile` files was pack\
    \ our software, not build it.\n\nBut I really meant build. `Docker` is not only\
    \ a technology to pack your software, but it can actually build it. When you build\
    \ an image, you are actually running software inside a container (the `RUN` commands\
    \ in the `Dockerfile` file). Since those `RUN` commands run in an image, the image\
    \ describes the dependencies needed to build the software.\n\nRemember those hard\
    \ times you had as a developer? You cloned some code only to realize that building\
    \ it took you a day since you needed to install many build dependencies and SDK\
    \ tools. Once you decide to build your software inside images, all you need is\
    \ `Docker`. Whether on a development machine or CI/CD server: `Docker`. This is\
    \ a major benefit for the projects I’ve been working on and I have no doubt that\
    \ you’re going to benefit from it.\n\nIn fact, that can even be taken a step further:\
    \ you can use the same `Docker` machines to build and run your software. Instead\
    \ of having a build server and test server, you can actually use the test server\
    \ to build. Going a step further with orchestration, you can use the same `Kubernetes`\
    \ cluster to host your deployments and build your code - but that’s another story.\n\
    \nLet’s take an ASP.NET Core application as an example. ASP.NET Core requires\
    \ us to restore the `NuGet` packages referenced by the `.csproj` files, then build\
    \ the source code (C# files) into `DLLs` and pack in any necessary dependencies.\
    \ This may be done with the following `Dockerfile` definition:\n\n```dockerfile\n\
    FROM microsoft/dotnet:2.2-sdk AS builder\nWORKDIR /app\nCOPY . .\nRUN dotnet restore\n\
    RUN dotnet publish –output /out/ –configuration Release\nEXPOSE 80\nENTRYPOINT\
    \ [\"dotnet\", \"aspnet-core.dll\"]\n```\n\nThe `FROM` instruction makes sure\
    \ we have the tools needed to build (SDK) then calls the `dotnet restore` and\
    \ `dotnet publish` to get our code ready for deployment inside the image. This\
    \ allows us to run `docker build` on the CI server or a developer machine and\
    \ get an image that contains built files. When the container starts on a server\
    \ (`docker run`), the `ENTRYPOINT` instruction simply makes sure that our code\
    \ is started inside the container.\n\nSince the `Dockerfile` definition is archived\
    \ with our source code, we are sure that we’ll keep the build instructions synchronized\
    \ with our code, and different branches may even have different `Dockerfile` definitions.\n\
    \nThere’s a problem with the resulting image however. Can you guess it?\n\n##\
    \ 8.3 Multi-stage dockerfiles\n\nThe problem with the image we created above is\
    \ that it’s fat. It weights 1730 MB ! This is because it contains the build tools:\
    \ tools like `dotnet restore` and `dotnet publish`. We do not need those tools.\
    \ Also, it contains the source code and intermediate build artifacts.\n\nWe could\
    \ use the `RUN` command to try and clean the image: delete intermediate build\
    \ artifacts, uninstall build tools, delete source code, but that would be tedious.\
    \ Time to remember that containers are like cheap, disposable machines. Let’s\
    \ dispose of the build machine and grab a brand new one that has only the runtime\
    \ installed!\n\n`Docker` has a neat way to do this: use a single `Dockerfile`\
    \ file with distinct sections. An image can be named simply by adding `AS <name>`\
    \ at the end of the `FROM` instruction. Consider the following simplified `Dockerfile`\
    \ file:\n\n```dockerfile\nFROM fat-image AS builder\n…\nFROM small-image\nCOPY\
    \ –from=builder /result .\n…\n```\n\nIt defines two images, but only the last\
    \ one will be kept as the result of the `docker build` command. The filesystem\
    \ that has been created in the first image, named `builder`, is made available\
    \ to the second image thanks to the `--from` argument of the `COPY` command. It\
    \ states that the `/result` folder from the `builder` image will be copied to\
    \ the current working directory of the second image.\n\nThis technique allows\
    \ you to benefit from the tools available in `fat-image` but get a resulting image\
    \ with only the environment defined in the `small-image` it’s based on. And you\
    \ can have many stages in a `Dockerfile` file when necessary.\n\nHere is an actual\
    \ example. I just improved the `Dockerfile` file shown in the preceding chapter,\
    \ so that this time it uses a multi-stage build:\n\n```dockerfile\nFROM microsoft/dotnet:2.2-sdk\
    \ AS builder\nWORKDIR /app\nCOPY *.csproj .\nRUN dotnet restore\nCOPY . .\nRUN\
    \ dotnet publish –output /out/ –configuration Release\nFROM microsoft/dotnet:2.2-aspnetcore-runtime-alpine\n\
    WORKDIR /app\nCOPY –from=builder /out .\nEXPOSE 80\nENTRYPOINT [\"dotnet\", \"\
    aspnet-core.dll\"]\n```\n\nIn the first part, I use the full and fat image that\
    \ contains the whole SDK in order to build my application to an `/out` directory.\
    \ Then this image is trashed, except that the contents of its `/out` directory\
    \ are copied to the `/app` directory of a second image. The second image is based\
    \ on a runtime, much smaller than the SDK image. When I build an image from that\
    \ multi-stage definition I get an image that weights only 161 MB . That’s 91%\
    \ improvement over the image size!\n\nYou definitely want to produce small images\
    \ for the reasons we saw in the Size section, so if you plan to generate artifacts\
    \ inside Docker, make sure to use multi-stage `Dockerfile` files.\n\n## 9. Docker\
    \ with common development profiles\n\nWe saw how an application can be packaged\
    \ into a `Dockerfile`, and you should be good to go. However, when creating your\
    \ first images you may hesitate over some patterns. I listed basic application\
    \ images for common development technologies. Just pick your own.\n\nEach subchapter\
    \ is divided into two parts:\n\n- Result: points you to the resulting image (I\
    \ published them on the Docker Hub so you can run them right away);\n- Files:\
    \ details the files (especially the `Dockerfile` file) I used to create the image.\n\
    \n### 9.1 .NET Core\n\n#### Result\nThe resulting image is published as `learnbook/aspnetcore-server`.\
    \ You can run a container from it with the following command:\n\n```bash\ndocker\
    \ run –rm -it -p 8088:80 learnbook/aspnetcore-server\n```\n\nThen point your browser\
    \ to `http://localhost:8088`\n\n#### Files\nYou may find those files in the `code/common-development-profiles/demos/aspnet-core`\
    \ folder.\n\nA static HTML file to be served:\n\n```html\nwwwroot/index.htm\n\
    <h1>Hello !</h1>\n<p> This page is served by ASP.NET Core </p>\n<p> Try our <a\
    \ href=\"/v1/square/4\">multiply API</a>.</p>\n```\n\nA REST API coded with ASP.NET\
    \ Core MVC:\n\n```csharp\n// ApiController.cs\nusing System;\nusing Microsoft.AspNetCore.Mvc;\n\
    \nnamespace aspnet_core {\n    [Route(\"v1\")]\n    [ApiController]\n    public\
    \ class ValuesController : ControllerBase {\n        // GET api/values\n     \
    \   [HttpGet(\"square/{value}\")]\n        public IActionResult Square(double\
    \ value) {\n            var result = Math.Pow(value, 2);\n            return Ok(new\
    \ {\n                value = value,\n                result = result\n       \
    \     });\n        }\n    }\n}\n```\n\nConfiguration of the HTTP server (middleware\
    \ and dependency injection):\n\n```csharp\n// Startup.cs\n```\n"
  raw: 'This is a major benefit in many environments. If you’re part of a team, chances
    are that many technologies are being used; however, the way to build, ship and
    deploy the applications depends on the applications’ development tools. Having
    a single tool to manage them all yields several benefits:


    members of the team that use one development stack can help those using others;


    a single CI/CD process and common tools can be used across most projects, and
    improvements benefit to all of those projects;


    Practically, whatever the technology the same instructions are used to build,
    ship and deploy the applications. Something around those lines:


    Build, deliver on the CI/CD server


    docker build -t learnbook/my-server .


    docker push learnbook/my-server


    Deploy on the target machine


    docker run –rm -it -p 80:80 learnbook/my-server


    8.2 Building rationally: easy CI


    Note that I wrote “build” in the preceding chapter, while most of what we did
    in our Dockerfile files was pack our software, not build it.


    But I really meant build . Docker is not only a technology to pack your software,
    but it can actually build it. When you build an image, you are actually running
    software inside a container (the RUN commands in the Dockerfile file). Since those
    RUN commands run in an image, the image describes the dependencies needed to build
    the software.


    Remember those hard times you had as a developer? You cloned some code only to
    realize that building it took you a day since you needed to install many build
    dependencies and SDK tools. Once you decide to build your software inside images,
    all you need is Docker. Whether on a development machine or CI/CD server: Docker.
    This is a major benefit for the projects I’ve been working on and I have no doubt
    that you’re going to benefit from it.


    In fact, that can even be taken a step further: you can use the same Docker machines
    to build and run your software. Instead of having a build server and test server,
    you can actually use the test server to build. Going a step further with orchestration,
    you can use the same Kubernetes cluster to host your deployments and build your
    code - but that’s another story.


    Let’s take an ASP.NET Core application as an example. ASP.NET Core requires us
    to restore the NuGet packages referenced by the .csproj files, then build the
    source code (C# files) into DLLs and pack in any necessary dependencies. This
    may be done with the following Dockerfile definition:


    Dockerfile


    FROM microsoft/dotnet:2.2-sdk AS builder


    WORKDIR /app


    COPY . .


    RUN dotnet restore


    RUN dotnet publish –output /out/ –configuration Relea


    se


    EXPOSE 80


    ENTRYPOINT [“dotnet”, “aspnet-core.dll”]


    The FROM instruction makes sure we have the tools needed to build (SDK) then calls
    the dotnet restore and dotnetpublish to get our code ready for deployment inside
    the image. This allows us to run docker build on the CI server or a developer
    machine and get an image that contains built files. When the container starts
    on a server (docker run) , the ENTRYPOINT instruction simply makes sure that our
    code is started inside the container.


    Since the Dockerfile definition is archived with our source code, we are sure
    that we’ll keep the build instructions synchronized with our code, and different
    branches may even have different Dockerfile definitions.


    There’s a problem with the resulting image however. Can you guess it?


    8.3 Multi-stage dockerfiles


    The problem with the image we created above is that it’s fat. It weights 1730
    MB ! This is because it contains the build tools: tools like dotnet restore and
    dotnet publish . We do not need those tools. Also, it contains the source code
    and intermediate build artifacts.


    We could use the RUN command to try and clean the image: delete intermediate build
    artifacts, uninstall build tools, delete source code, but that would be tedious.
    Time to remember that containers are like cheap, disposable machines. Let’s dispose
    of the build machine and grab a brand new one that has only the runtime installed!


    Docker has a neat way to do this: use a single Dockerfile file with distinct sections.
    An image can be named simply by adding AS <name>at the end of the FROM instruction.
    Consider the following simplified Dockerfile file:</name>


    FROM fat-image AS builder


    …


    FROM small-image


    COPY –from=builder /result .


    …


    It defines two images, but only the last one will be kept as the result of the
    docker build command. The filesystem that has been created in the first image,
    named builder , is made available to the second image thanks to the –from argument
    of the COPY command. It states that the /result folder from the builder image
    will be copied to the current working directory of the second image.


    This technique allows you to benefit from the tools available in fat-image but
    get a resulting image with only the environment defined in the small-image it’s
    based on. And you can have many stages in a Dockerfile file when necessary.


    Here is an actual example. I just improved the Dockerfile file shown in the preceding
    chapter, so that this time it uses a multi-stage build:


    Dockerfile


    FROM microsoft/dotnet:2.2-sdk AS builder


    WORKDIR /app


    COPY *.csproj  .


    RUN dotnet restore


    COPY . .


    RUN dotnet publish –output /out/ –configuration Relea


    se


    FROM microsoft/dotnet:2.2-aspnetcore-runtime-alpine


    WORKDIR /app


    COPY –from=builder /out .


    EXPOSE 80


    ENTRYPOINT [“dotnet”, “aspnet-core.dll”]


    In the first part, I use the full and fat image that contains the whole SDK in
    order to build my application to an /out directory. Then this image is trashed,
    except that the contents of its /out directory are copied to the /app directory
    of a second image. The second image is based on a runtime image, much smaller
    than the SDK image. In order to make it even lighter, I used an alpine-based image.


    When I build an image from that multi-stage definition I get an image that weights
    only 161 MB . That’s a 91% improvement over the image size!


    You definitely want to produce small images for the reasons we saw in the Size
    matters section, so if you plan to generate artifacts inside Docker, make sure
    to use multi-stage Dockerfile files.


    9.  Docker with common development profiles


    We saw how an application can be packaged into a Dockerfile, and you should be
    good to go. However, when creating your first images you may hesitate over some
    common patterns. I’d rather you didn’t loose time with that, so I listed in this
    chapter some basic application images for common development technologies. Just
    pick your own.


    Each subchapter is divided into two parts:


    Result points you to the resulting image (I published them on the Docker Hub so
    you can run them right away);


    Files details the files (especially the Dockerfile file) that I used to create
    the image.


    9.1 .NET Core


    Result


    The resulting image is published as learnbook/aspnetcore-server . You can run
    a container from it with the following command:


    docker run –rm -it -p 8088:80 learnbook/aspnetcore-ser


    ver


    Then point your browser to http://localhost:8088


    Files


    You may find those files in the the code/common-development-profiles/demos/aspnet-core
    folder.


    A static HTML file to be served:


    wwwroot/index.htm


    < h1 > Hello ! </ h1 > < p > This page is served by ASP.NET Core </ p > < p >
    Try our < a href = “/v1/square/4” > multiply API </ a > . </ p >


    A REST API coded with ASP.NET Core MVC:


    ApiController.cs


    using System ; using Microsoft.AspNetCore.Mvc ;


    namespace aspnet_core {     [Route(“v1”)]     [ApiController]


    public class ValuesController : ControllerBase


    {


    // GET api/values         [HttpGet(“square/{value}”)]


    public IActionResult Square ( double value )


    {


    var result = Math . Pow ( value , 2 );


    return Ok ( new {


    value = value ,


    result = result


    });


    }


    } }


    Configuration of the HTTP server (middleware and dependency injection):


    Startup.cs'
