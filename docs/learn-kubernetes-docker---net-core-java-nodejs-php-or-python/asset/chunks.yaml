    \ -- 42\nmessage:     -- Hello world\nEvents:  < none >\n```\n\n将浏览器指向 `http://localhost:8080/files`。你应该得到一个类似下方的页面：\n\
    \n![](img/file78.jpg)\n\n通过向 `front-deployment1.yaml` 添加一些条目，创建一个名为 `front-deployment2.yaml`\
