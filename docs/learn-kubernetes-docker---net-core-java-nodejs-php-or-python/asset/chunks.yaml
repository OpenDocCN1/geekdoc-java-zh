    \ Pod 完全停止，日志将仅显示对 `www.qcant.com` 的 ping。\n\n## 控制器 (Controllers)\n\n创建一个 `Deployment`\
    \ 来管理你的 Pods，可以让你确保在任何时候（多或少，取决于集群状况和更新）始终运行给定数量的 Pod。根据你的需求，你可能想要创建其他类型的 Pod\
    \ 控制器：\n\n*   **ReplicaSet / Deployment**: 运行应该始终存在的 Pod。\n*   **Job**: 以“发后后置不理”的方式运行\
    \ Pod：Kubernetes 确保规定数量的 Pod 运行完成（即容器中的主可执行程序无错误地退出）。\n*   **CronJob**: 与 `Job`\
    \ 相同，但是是周期性运行。它就像定期创建一个 `Job`。\n*   **DaemonSet**: 确保每个集群 `Node` 上都运行一个 Pod。这对于与\
    \ Kubernetes 相关的 Pod 很有用。\n\n## 12.12 调试 (Debugging)\n\n出错的问题总会出错，常见错误包括：\n\n\
