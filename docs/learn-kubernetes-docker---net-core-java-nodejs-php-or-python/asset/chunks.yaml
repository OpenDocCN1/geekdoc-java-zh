    \ could decouple the containers and run three different Pods so that only the\
    \ Pod that runs the web-interface container is duplicated.\n\n12.17 Resources\
    \ management\n\nAs we saw in the introduction, Pods and Nodes are abstractions\
    \ that allow for an abstraction of memory and CPU resources. Nodes offer memory\
    \ and CPU while Pods consume memory and CPU.\n\nKubernetes needs to ensure that\
    \ Pods are effectively consuming the memory and CPU resources, and this means:\n\
    \nscheduling Pods on Nodes that have enough resources to run them;\n\nterminating\
    \ buggy Pods that consume too much memory and CPU.\n\nKubernetes does so thanks\
    \ to the concepts of requests and limits . They are optional, but it’s good practice\
    \ to use them since they allow Kubernetes to correctly manage your Pods under\
    \ pressure.\n\nRequests\n\nRequests allow your Controllers to state how much memory\
    \ and CPU they need for a Pod to run. They specify a minimum that should be available\
    \ on the Node where the Pod will be scheduled. When the Kubernetes scheduler needs\
    \ to create a Pod, it selects a Node that has at least the memory and CPU resources\
    \ stated in the requests section of the Controller definition.\n\nHere is a sample\
    \ definition of a Deployment:\n\napiVersion: apps/v1beta1\n\nkind: Deployment\n\
    \nspec:\n\n  template:\n\n    spec:\n\n      containers:\n\n      - name: front\n\
    \n        image: learnbook/k8s-front:0.4\n\n        resources:           requests:\
    \             cpu: “100m”             memory: “10Mi”\n\nWhen the Kubernetes scheduler\
    \ needs to create a Pod for that Deployment, it selects a Node that has at least\
    \ 10M of memory and 100 millicpus still available.\n\nIt means that if you provide\
    \ values that are too high, Kubernetes may not be able to schedule your Pods,\
    \ so choose wisely.\n\nHow do you decide which values to use, then? A rule of\
    \ thumb is to actually run your Pods and see how much they consume under run conditions,\
    \ then assign a value that is slightly higher.\n\nNote that values are provided\
    \ per container. Which means that you would provide several values to a Pod that\
    \ runs several containers.\n\nLimits\n\nWhen the executable running inside a container\
    \ goes wrong, it may end up eating too much CPU and memory resources. Limits allow\
    \ you to have Kubernetes handle that case."
