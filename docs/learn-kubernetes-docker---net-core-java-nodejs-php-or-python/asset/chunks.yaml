    13.5 Exercise - Expose an API inside the cluster


    Objective: deploy an API and make it accessible from the internet, then make it
    accessible to Pods that run inside the cluster.


    You first need to deploy an API and make sure it is accessible from outside the
    cluster, in order to easily check that it is correctly deployed. We want the following
    application architecture at first:


    ![](media/file62.jpg)


    The learnbook/k8s-back:0.2 image is an API that listens on port 80. Deploy the
    learnbook/k8s-back:0.2 image as a Pod named back that has the app=back label.
    Expose that Pod using a LoadBalancer Service that listens on port 8081.


    Open a browser and point it to http://localhost:8081/v1/currenttime (or the public
    URL you obtain if running in a PaaS cluster). Make sure you can access the API.


    You now need to deploy the front web application and make it consume the API using
    its external address. The expected target application architecture will be the
    following:


    ![](media/file63.jpg)


    Deploy the learnbook/k8s-front:0.5 image as a Pod named front that has the app=front
    label and the following environment variables:


    API_EXTERNAL_URL : http://localhost:8081


    API_CLUSTER_URL : http://back-inside


    Note that the API_EXTERNAL_URL variable enables the front Pod to know which URL
    it should use to call the API. For now, the API_CLUSTER_URL variable does not
    match any endpoint; it will be used later in the exercise.


    Expose the front Pod using a LoadBalancer Service that listens on port 8080.


    Open a browser and point it to http://localhost:8080 (or the public URL you obtain
    if running in a PaaS cluster). Make sure you can access the web application. As
    of now, the application main page should display values in its “API call outside
    cluster” zone but not in its “API call inside cluster” zone:


    ![](media/file64.jpg)


    As a last step, we want the front application to call the API using an internal
    cluster address, not the public address. That’s why we provided an internal address
    using the API_CLUSTER_URL variable. In a real world application, we would probably
    not call the same API from an external and internal address, but the external
    one was easier and that’s why we began that exercise using it.


    We now want to obtain the following application architecture:


    ![](media/file65.jpg)


    Expose the back Pod using a ClusterIP Service named back-inside that listens on
    port 80.


    Open a browser and point it to http://localhost:8080 (or the public URL you obtain
    if running in a PaaS cluster). Make that the web application main page now displays
    values in both its “API call outside cluster” and “API call inside cluster” zones.


    Once done, delete all resources created during that exercise.


