    16.  Updating and scaling


    16.1 Horizontal scaling


    Horizontal scaling is a technique that allows an application to handle more concurrent
    requests, and is also called scaling out . When you run a server application on
    a machine (or a Pod for that matter), it can only handle a certain number of concurrent
    requests since each request requires some RAM and CPU resources.


    For instance, your application may be able to handle 100 requests per second.
    If you want to handle more requests, you can duplicate the application on separate
    servers so that it handles more requests. Say we want to handle 300 requests per
    second, we can run 3 instances of our application.


    On a traditional, server-hosted application, horizontal scaling requires some
    effort. The machine and its application need to be duplicated, and a load balancer
    application needs to be used in front of the three replicas so that incoming requests
    are served evenly by the three replicas. Good news: Kubernetes makes this task
    extremely easy. All you have to do is set a replicas property on the Deployment’s
    definition:


    apiVersion: apps/v1beta1


    kind: Deployment


    metadata:


      name: my-front


    spec:


      replicas: 3


      template:


        metadata:


          labels:


            app: front


        spec:


          containers:


          - name: my-front


            image: my-wordpress


    This definition states that three Pods are to be created. Kubernetes will ensure
    that three Pods are in a running state at all times, creating missing Pods or
    replacing failing ones as needed.


    What about the load balancer that routes users to the three Pods? You already
    have it, and you don’t need to modify it. At some point, in order to publicly
    expose even just a single Pod you created a LoadBalancer type Service that looks
    like:


    apiVersion : v1 kind : Service metadata :


    name : my - front - service spec :


    type : LoadBalancer


    ports :


    *   port : 8080


    targetPort : 80


    selector :


    app : front


    Since that Service routes requests to any Pod that has a label app with the value
    front , it will naturally route requests to any of the three deployed Pods.


    We already presented the ReplicaSet type and you may have wondered why this type
    exists between a Deployment and a Pod, as in the following image. The main difference
    between a ReplicaSet and a Deployment is that the ReplicaSet is responsible for
    running a specific number of replicas for a particular Pod (same specs for all
    the Pods), while the Deployment makes sure that the necessary ReplicaSet is created
    when you run the kubectl apply command. In case the spec part of a Deployment
    changes, a new ReplicaSet is created and the existing one is bound to be deleted.


    The schema we saw for a ReplicaSet was the following:


    ![](media/file45.jpg)


    This was when the Deployment didn’t specify a replica count, so just one Pod was
    needed. Once we add the replicas: 3 value to the Deployment, the ReplicaSet creates
    two additional Pods and makes sure to keep three Pods in a running state:


    ![](media/file82.jpg)


    16.2 Automatic horizontal scaling


    Scaling out was a difficult task but Kubernetes makes it easy. But we IT people
    always want more, so when some task becomes easy we look for more challenges.
    To be honest, the market is also asking for innovation so we also go the market
    way. How can we make horizontal scaling more challenging, then?


    Consider this: it’s fine to be able to set the number of Pods that handle incoming
    requests, but how would you set that number? In case it is too low, the Pods won’t
    be able to handle peaks in usage; in case it is too high, there will be too many
    Pods sitting around not doing much, which means they are consuming CPU and memory
    resources for nothing.


    What would be great would be to dynamically change the number of Pods in order
    to meet the actual demand: when there are peaks of use, create more Pods, and
    when the application faces lower use, destroy useless Pods so that they free up
    resources.


    Actually, this can be done by a simple Kubernetes object:


    apiVersion : autoscaling / v1 kind : HorizontalPodAutoscaler metadata :


    name : captureorder spec :


    scaleTargetRef :


    apiVersion : apps / v1


    kind : Deployment


    name : front


    minReplicas : 4


    maxReplicas : 10


    targetCPUUtilizationPercentage : 70'
