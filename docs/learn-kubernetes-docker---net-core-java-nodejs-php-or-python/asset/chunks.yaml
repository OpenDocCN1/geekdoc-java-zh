- fmt: '

    Pods are the actual pieces of software you want to run, and nodes are the hardware
    pieces that run them. Think of nodes as a resource that can run your pods. Pods
    require CPU and memory, nodes provide this CPU and memory. The fact that nodes
    are part of a Kubernetes cluster allow them to be spread over the cluster so that
    we can get many benefits like resilience, high availability and horizontal scaling.


    There are two types of nodes: worker nodes and master nodes. The schema we just
    saw pictures only worker nodes because those are the nodes that actually run your
    pods. Master nodes don’t run your pods: they control the worker nodes in order
    to make sure that they respect your will. We saw that a Kubernetes cluster’s goal
    in life is to run your pods, and the master nodes are those who make this happen.


    Here’s our cluster, now with the master nodes included:


    ![](media/file36.jpg)


    Master nodes are to worker nodes what managers are to technicians in real life:
    their work is to make sure that others do the visible work. Much like developers
    write the actual software while their managers distribute the software pieces
    to be written over the available developers, worker nodes run the actual user-facing
    software (pods) while their master nodes distribute the pods to be run over available
    worker nodes.


    There can be a single master node, but there are usually several of them in order
    to achieve high availability. Whether there is one or several master nodes, they
    are logically grouped together into what we call the control plane.


    Worker nodes are non-critical resources. In case one of them goes away, the control
    plane will start new pods on the remaining nodes in order to replace those that
    were running on the missing node. You’ll have to find out how many worker nodes
    your cluster needs: too many of them means that you won’t use each to its fullest
    capacity, but too little means that you may not be able to afford losing some
    of them. Hopefully nodes can be added and removed dynamically.


    The control plane receives your orders through its `API server`. Each worker node
    runs a `kubelet` daemon that allows the control plane to manage its pods and other
    resources.


    Since your Kubernetes cluster wants to ensure that your pods run as desired, it
    uses a few more components:


    ![](media/file37.jpg)


    You don’t need to understand those extra components in order to make your first
    steps in Kubernetes, so the previous schema would be a good simplified reference.
    However, please allow me to introduce you to the hidden workers that will make
    our Kubernetes cluster stronger.


    `etcd` is a database that stores the desired state of your cluster so that the
    control plane can take appropriate actions on the worker nodes in order to reach
    and keep that state no matter what happens. And many things may happen inside
    your cluster: a worker node may become unavailable or a new one can join the cluster,
    a pod can die or need to be updated or scaled out. Thanks to the `etcd` database
    the control plane can ensure it has a reference of what state needs to be reached.
    As long as half of the master nodes are available, `etcd` works correctly.


    `kube-scheduler` is responsible for creating pods on the right nodes, and `kube-controller-manager`
    makes sure that the required number of pods are running in an expected state.


    Now that we saw the big picture, we can go back to a simpler representation of
    your Kubernetes cluster:


    ![](media/file35.jpg)


    As we run our applications on the cluster day to day, what matters is that Kubernetes
    offers a worker / pod abstraction: pods are the units of your software that can
    be ran atomically, and worker nodes are the units of hardware that offer the CPU
    and memory resources needed for that. Your software requires CPU and memory, which
    Kubernetes allocates on all of the available worker nodes.


    ## 10.2 Creating a cluster


    There are several ways to get a running Kubernetes cluster, and what you choose
    depends on what you want to do with it. Choices fall within 3 categories:


    What we want now is to have a working Kubernetes so that we can learn how to use
    Kubernetes and prepare our workloads for a production cluster, so the “development
    workstation” solutions are those we’ll head for. In order to run user-facing applications
    though, we’ll need a private or Cloud PaaS Kubernetes cluster. Let’s review those.


    ### Development workstation


    Before you send your application to a distant production cluster, you’d rather
    set it up and test it on a Kubernetes cluster on your machine, and that’s one
    reason why you need a local Kubernetes cluster on your development machine. Other
    reasons are exactly the same that make you install a local setup for any development
    platform instead of using a distant one.


    Luckily, setting up a Kubernetes cluster on your machine is an easy task in most
    cases. There are at least two options: `Docker Desktop` and `Minikube`. Both set
    up a single-node Kubernetes cluster.


    `Docker Desktop` includes Docker development tools plus a Kubernetes cluster out
    of the box. If you are going to run Docker containers in your cluster, that’s
    a good candidate especially on Windows and Mac machines.


    `Minikube` is more flexible. It lets you decide which Kubernetes version you want
    to use, which extensions are installed, which container runtime will be needed.
    Flexibility comes at a price so be prepared to spend some time setting it up,
    but on Linux machines it’s quite straightforward.


    ### Cloud PaaS


    For your production workloads, you can get Kubernetes clusters from major cloud
    providers. A basic setup of these usually is a mundane task, and activities like
    upgrading or securing your cluster are mostly effortless or automated.


    Another advantage of using a PaaS Kubernetes cluster is that you can add or remove
    nodes as necessary, since you are running on a Cloud infrastructure. Since Kubernetes
    is a perfect choice for running resource-intensive workloads thanks to its scaling
    capabilities, having the ability to add virtual machines with virtually no limit
    is definitely a plus for those of you who will face high or varying workloads.
    For that matter, many PaaS cloud offerings allow you to have dynamic nodes provisioning.


    Some Kubernetes offerings are:


    - `Azure AKS`: you are only charged for worker nodes. You don’t need to manage
    the master nodes and you don’t pay for them. AKS enables automatic provisioning
    of worker nodes when your cluster reaches peak usage.

    - `Google GKE`: you are only charged for worker nodes, and it enables automatic
    provisioning of worker nodes when your cluster reaches peak usage.

    - `Amazon EKS`, `RedHat OpenShift`, `IBM CKS`, `Heptio Kubernetes Subscription`.


    ### Private


    Some use cases cannot be covered by a Cloud Kubernetes offering. For instance,
    a client of mine needs to create and manage Kubernetes clusters at designated
    data centers that are airtight secured. `kubeadm` is part of the Kubernetes distribution.
    It helps setting up and maintaining a Kubernetes cluster using basic commands
    like `init`, `join`, `upgrade` and `reset`.


    Since `kubeadm` is composable, there are several tools that build upon it and
    help you with setting up a Kubernetes cluster in various contexts. For instance,
    you can use:


    - `Kubespray` in order to setup custom clusters both whether in the Cloud or on
    bare metal. It can use `Ansible` or `Vagrant`.

    - `Kops` in order to setup custom clusters at some Cloud providers like `AWS`
    and `GCE`.


    Such tools can enable you to get a running cluster in matter of hours. However,
    be aware that correctly securing a cluster requires some efforts, and maintaining
    a cluster does need time and dedication. It’s not just about backing up or upgrading
    your servers: business needs that lead to using Kubernetes often imply high availability,
    automatic scaling and reliability, which in turn imply work for those administering
    the cluster.


    In case you build your own cluster, make sur that you can provide:

