    15.  Configuration


    15.1 Similar but different


    Whatever the programming language inside your Pods, your containers are likely
    to need runtime parameters dependent on their configuration. For instance, the
    address of a database to connect to or some credentials. The ConfigMap and Secret
    Kubernetes objects make such information a first-class citizen in a cluster.


    As such, both objects can be managed with the common kubectl commands we saw for
    Pods, Deployments and Services. For instance you would get a list of all the ConfigMap
    objects using the following command:


    kubectl get configmaps


    Both ConfigMap and Secret are very similar, although Secret will be preferred
    over ConfigMap for more sensitive information. Let’s see about both.


    15.2 ConfigMap


    Declaration


    A ConfigMap stores key / value pairs that will be made available to any number
    of Pods across Nodes. Those keys and their values can be consumed by Pods as any
    of those options:


    environment variables defined for all entries;


    environment variables defined for some entries;


    files.


    At the moment of declaring a ConfigMap, you don’t need to know how it will be
    exposed to Pods. Here is an example definition:


    apiVersion : v1 kind : ConfigMap metadata :


    name : configmap - values data :


    key1 : “value1”


    key2 : “value2”


    In the definition above, there are two entries. The key1 entry has the value1
    value, while the key2 entry has the value2 value.


    As stated above, there are three ways to consume those keys from a Pod.


    Consume as files


    Remember the Volumes used for persistent storage? A ConfigMap object can be mounted
    as a Volume inside a Pod. That means that each of its keys is seen as a read-only
    file; the contents of each file are the values assigned to the keys.


    Most programming languages can read their configuration from files, so most containers
    expect such configuration files. ConfigMap objects can be used for this, and this
    means that the configuration data can come from a single YAML file.


    As an example, let’s mount the ConfigMap shown earlier into a Pod:


    apiVersion : apps / v1beta1 kind : Deployment spec :


    template :


    spec :


    volumes :


    *   name : config - volume


    configMap :


    name : configmap - values


    containers :


    *   name : front


    image : learnbook / k8s - front : 0.4


    volumeMounts :


    *   mountPath : / config


    name : config - volume


    This is the exact same syntax we used for Volumes, but the Volume type is configMap
    . You can see that the front container mounts the Volume as its /config path;
    as a result, the front container sees the following file:


    Note that the syntax allows each container to mount the same Volume in a different
    path, to better suit the container’s needs.


    Consume as environment variables


    Many containers need their parameters to be provided as environment variables.
    This is easily done when configuration is stored as a ConfigMap object.


    Consider the following ConfigMap definition:


    apiVersion : apps / v1beta1 kind : Deployment spec :


    template :


    spec :


    containers :


    *   name : front


    image : learnbook / k8s - front : 0.4


    envFrom :


    *   configMapRef :


    name : configmap - values


    The envFrom entry means that all of the keys from the ConfigMap named configmap-values
    will be exposed to the container as environment variables with the same names.
    Considering the configmap-values ConfigMap we defined, the front container will
    see the following environment variables:


    Consume as select environment variables


    There are cases where you want to provide environment variables to a container,
    but you don’t want to expose all of the entries from a ConfigMap, or you want
    to provide them under specific variable names. There is a more verbose syntax
    for doing so, where you state each key that you want to expose and the name of
    the environment variable to which its value will be assigned.


    Consider the following definition:


    apiVersion : apps / v1beta1 kind : Deployment spec :


    template :


    spec :


    containers :


    *   name : front


    image : learnbook / k8s - front : 0.4


    env :


    *   name : VAR_NAME


    valueFrom :


    configMapKeyRef :


    name : configmap - values


    key : key2


