  \n我想让你理解的是，Docker 是一个工具，让你能够获得等同于一次性、临时使用的计算机。一旦你明确了这一点，一个全新的世界就会向你敞开。你来自这样一个世界：获取一台新机器并配置它所需的精力足以让你决定保留它，而且每次后续使用都会产生副作用；而在容器的世界里，获取一个全新的环境廉到足以我们可以获取很多很多个。\n\
