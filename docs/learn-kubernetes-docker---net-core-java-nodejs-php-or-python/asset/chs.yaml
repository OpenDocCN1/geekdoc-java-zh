  ![](img/file72.jpg)\n\n运行以下命令：\n\n```bash\nkubectl delete -f .\nkubectl apply -f\
  \ front-deployment2.yaml\nkubectl apply -f front-service.yaml\n```\n\n你将得到类似下方的输出：\n\
  \n> `kubectl delete -f .`\ndeployment.apps “front” deleted\nservice “front” deleted\n\
  \n> `kubectl apply -f front-deployment2.yaml`\ndeployment.apps/front created\n\n\
  > `kubectl apply -f front-service.yaml`\nservice/front created\n\n刷新浏览器中的 `http://localhost:8080/files`\
  \ 页面。\n\n### 14.5 使用 PersistentClaims 的持久存储\n\n### 消费持久存储\n\n`PersistentVolumeClaim`\
  \ 实际获取持久存储有两种方式，由运维人员决定策略。\n\n第一种是由集群管理员创建 `PersistentVolumes`，它们会被 `PersistentVolumeClaims`\
  \ 消费。\n\n第二种是在 `PersistentVolumeClaim` 上指定 `StorageClass`，这允许动态创建 `Volumes`。\n\n\
  为了处理在 `Pod` 之间共享的持久存储，Kubernetes 提供了 `PersistentVolumeClaim`。`PersistentVolumeClaim`\
  \ 独立存在于任何 `Pod`。\n\n### PersistentVolumeClaim 声明\n\n```yaml\napiVersion : v1\nkind\
  \ : PersistentVolumeClaim\nmetadata :\n  name : claiming-disk\nspec :\n  accessModes\
  \ :\n    - ReadWriteOnce\n  resources :\n    requests :\n      storage : 1 Gi\n\
  ```\n\n### 消费 VolumeClaim 的 Deployment 声明\n\n```yaml\napiVersion: apps/v1beta1\n\
  kind: Deployment\nmetadata :\n  name : front\nspec :\n  template :\n    metadata\
  \ :\n      labels :\n        app : front\n    spec :\n      volumes :\n        -\
  \ name : persistent-data\n          persistentVolumeClaim :\n            claimName\
  \ : claiming-disk\n      containers :\n        - name : front\n          image :\
  \ my-image:1.0\n          volumeMounts :\n            - mountPath : /external\n\
  \              name : persistent-data\n```\n\n### 14.6 练习 - 创建并使用 PersistentVolume\n\
  \n**目标**：使用 `PersistentVolume` 在 `Pod` 死亡后持久化文件。\n\n使用上一个练习中的 Deployment，但将 `emptyDir`\
  \ 替换为你创建的 `PersistentVolumeClaim` 的引用。\n\n打开浏览器并指向 `http://localhost:8080/files`（或者如果你在\
  \ PaaS 集群中运行，则指向公共 URL）。当你刷新页面时，文件应该显示出来。\n\n删除 Deployment 和 Service。刷新浏览器：页面不可用。\n\
  \n重新创建 Deployment 和 Service。\n\n刷新浏览器。当你刷新页面时，之前的文件仍然显示。即使 `Pod` 被删除，它们也没有丢失。\n\n\
  删除所有创建的资源。\n\n\n\n\n\n```yaml\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n\
  \  name: shared-on-disk\nspec:\n  accessModes:\n    - ReadWriteOnce\n  resources:\n\
  \    requests:\n      storage: 1Gi\n```\n\n复用上练习中名为 `front-deployment.yaml` 文件，修改\
  \ `volumes` 部分以获得以下内容：\n\n```yaml\napiVersion: apps/v1beta1\nkind: Deployment\n\
  metadata:\n  name: front\nspec:\n  template:\n    metadata:\n      labels:\n   \
  \     app: front\n    spec:\n      volumes:\n        #- name: shared\n        #\
  \  emptyDir: {}\n        - name: shared\n          persistentVolumeClaim:\n    \
  \        claimName: shared-on-disk\n      containers:\n        - name: front\n \
  \         image: learnbook/k8s-front:0.3\n          volumeMounts:\n            -\
  \ mountPath: /shared\n              name: shared\n        - name: creator\n    \
  \      image: learnbook/k8s-creator:0.2\n          volumeMounts:\n            -\
  \ mountPath: /shared\n              name: shared\n```\n\n复用上练习中名为 `front-service.yaml`\
  \ 文件，其内容如下：\n\n```yaml\napiVersion: v1\nkind: Service\nmetadata:\n  name: front\n\
  spec:\n  type: LoadBalancer\n  ports:\n    - port: 8080\n      targetPort: 80\n\
  \  selector:\n    app: front\n```\n\n在创建上述文件的文件夹中打开命令行。\n\n运行以下命令：\n\n```\nkubectl\
  \ apply -f persistentvolumeclaim.yaml\nkubectl apply -f front-deployment.yaml\n\
  kubectl apply -f front-service.yaml\n```\n\n你将得到类似下面所示的输出：\n\n```\n> kubectl apply\
  \ -f persistentvolumeclaim.yaml\npersistentvolumeclaim/shared-on-disk created\n\
  > kubectl apply -f front-deployment.yaml\ndeployment.apps/front created\n> kubectl\
  \ apply -f front-service.yaml\nservice/front created\n```\n\n将浏览器指向 `http://localhost:8080/files`。你将看到一个类似下面的页面：\n\
  \n![](img/file75.jpg)\n\n在命令行中运行以下命令：\n\n```\nkubectl delete -f front-deployment.yaml\n\
  kubectl delete -f front-service.yaml\nkubectl apply -f front-deployment.yaml\nkubectl\
  \ apply -f front-service.yaml\n```\n\n你将得到类似下面所示的输出：\n\n```\n> kubectl delete -f\
  \ front-deployment.yaml\ndeployment.apps \"front\" deleted\n> kubectl delete -f\
  \ front-service.yaml\nservice \"front\" deleted\n> kubectl apply -f front-deployment.yaml\n\
  deployment.apps/front created\n> kubectl apply -f front-service.yaml\nservice/front\
  \ created\n```\n\n在浏览器中刷新 `http://localhost:8080/files` 页面。你的浏览器应该显示一个与之类似的页面：\n\
  \n![](img/file76.jpg)\n\n请注意，尽管 `Pod` 被删除并重建，但上一步中可见的文件仍然可见。\n\n运行以下命令：\n\n```\n\
  kubectl delete -f .\n```\n\n我需要你，超级英雄！\n\n非常感谢阅读这本书。我真心希望它能帮助你理解并对 Kubernetes 建立自信。\n\
