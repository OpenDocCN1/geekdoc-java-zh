  \ Kubernetes Dashboard。它不是必需的工具，但可能会让习惯于图形用户界面而不是命令行工具的人感到安心。\n\nDashboard 是一个可以使用浏览器访问的\
  \ Web 界面。它允许在用户界面中进行简单的集群监管。\n\n![](img/file40.jpg)\n\n它提供了工作负载的高级视图：\n\n![](img/file41.jpg)\n\
  \n它允许你深入 Kubernetes 对象，包括节点。例如，这里是节点的详细页面：\n\n![](img/file42.jpg)\n\n你可能会注意到右上角的“create”按钮。点击后，会出现创建一个\
