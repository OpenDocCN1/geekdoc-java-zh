  \n运行以下命令：\n\n```bash\nkubectl delete -f .\n```\n\n### 13.7 Ingress\n\nIngress 是一种用于为\
  \ Service 添加额外功能的 Kubernetes 对象。Ingress 在入站连接和 Service 之间增加了一个额外的层。它们是反向代理的抽象。\n\
  \n![](img/file68.jpg)\n\n使用 Ingress 的一些优势包括：\n\n- 根据传入的 URL 将请求路由到不同的 Service。例如，您可以使用类似的\
  \ URL 将用户路由到不同版本的应用程序：\n  - `http://front/store` 可以路由到 `store:1.0` 应用；\n  - `http://front/old/store`\
  \ 可以路由到 `store:0.8` 应用。\n- 在传入的请求和您的 Service 之间添加 TLS，以确保到集群的安全性（简而言之，使用 `https://`\
  \ 地址代替 `http://` 地址），并在公共 Ingress Controller 中管理证书和加密。\n- 管理您自己的负载均衡服务。\n\nIngress\
  \ 对象在您的 Kubernetes 集群中声明，但实际功能由 Ingress Controller 提供。您可以部署并管理您选择的 Ingress Controller，例如：\n\
  \n- `nginx-ingress`\n- `contour`\n- `traefik`\n- 在云端运行时使用的 PaaS 控制器\n\n注意，ingress\
  \ 控制是基于反向代理软件的。这是完全正常的，因为 Ingress 对象是反向代理的抽象。\n\n一旦将 Ingress Controller 部署到您的 Kubernetes\
  \ 集群，就可以根据需要添加任意数量 Ingress 对象。Ingress Controller 将扫描 Ingress 对象以确定它应该提供哪些服务。\n\n\
  以下是如何声明一个简单的 Ingress 对象：\n\n```yaml\napiVersion : extensions / v1beta1 kind : Ingress\
  \ metadata :\nname : frontandback-ingress spec :\nrules :\n*   host : server.com\n\
  \  http :\n    paths :\n    *   path : /app\n      backend :\n        serviceName\
  \ : web-app\n        servicePort : 80\n```\n\n得益于上述 Ingress 对象，Ingress Controller\
  \ 将知道入站的 `http://server.com/app` 请求应该路由到名为 `web-app` 的 Service。该服务可以是一个 `ClusterIP`\
  \ 类型的服务。\n\n## 14. Volumes\n\n### 14.1 卷的必要\n\n对容器内部文件系统进行的更改是瞬即逝的。一旦容器停止，这些更改就会丢失，除非您采取某些步骤将它们持久化到其他地方。容器在无状态时更容易管理，但您在某些时刻需要持久化数据。\n\
  \n持久化需求取决于您的应用程序。持久化数据可以在同一个 Pod 的不同容器之间共享，可以在 Pod 之间共享，甚至可以在不同的集群之间共享。\n\nKubernetes\
  \ 提供了几种类型来管理这些：\n\n- `emptyDir`：短寿命存储，其生命周期与 Pod 等等。\n- `Volume`：生命周期独立于任何 Pod 的卷。\n\
  - `PersistentVolumeClaim`：向集群资源请求存储的对象。\n\n### 14.2 使用 Volumes 进行短寿命存储\n\nVolume\
  \ 是在 Pod 内部声明的。在上面的示例中，Volume 类型是 `emptyDir`。它是一个可以写入的短寿命存储。\n\n以下是一个 Pod 的 Volume\
  \ 声明：\n\n```yaml\napiVersion : apps / v1beta1 kind : Deployment spec :\ntemplate\
  \ :\nspec :\nvolumes :\n*   name : persistent-data\n  emptyDir : {}\ncontainers\
  \ :\n*   name : front\n  image : my-image:1.0\n  volumeMounts :\n  *   mountPath\
  \ : /external\n    name : persistent-data\n```\n\n如您所示，Volume 是在 Pod 内部声明的并挂载到 Pod\
  \ 的容器上的。`front` 容器将 Volume 视为其 `/external` 文件夹。\n\n\n\n\n\n# 目标\n创建并使用类型为 `emptyDir`\
  \ 的 `Volume`，以便运行在同一个 `Pod` 中的容器之间共享文件。\n\n`learnbook/k8s-creator:0.2` 镜像会在名为 `/shared`\
  \ 的目录中创建随机名称的文件。`learnbook/k8s-front:0.5` 镜像会列出其名为 `/shared` 目录下的文件。\n\n你应当将这两个镜像作为两个容器运行在同一个\
  \ `Pod` 中，并在 `Pod` 内部创建一个类型为 `emptyDir` 的 `Volume`。确保两个容器使用同一个 `Volume`，以便一个容器写入的文件可以被另一个容器消费。\n\
  \n你应该实现以下目标架构：\n\n![](img/file70.jpg)\n\n创建一个 Deployment，在同一个 `Pod` 中托管 `learnbook/k8s-creator:0.2`\
  \ 和 `learnbook/k8s-front:0.5` 镜像。使用监听 `8080` 端口的 `LoadBalancer` 服务从 `Pod` 暴露前端应用。\n\
  \n打开浏览器并指向 `http://localhost:8080/files`（或者如果你在 PaaS 集群中运行，则指向公共 URL）。文件夹中没有文件。解释为什么。\n\
  \n在 `Pod` 中添加一个类型为 `emptyDir` 的 `Volume`，并确保它暴露给前端和创建容器。\n\n打开浏览器并指向 `http://localhost:8080/files`。当你刷新页面时，文件应该显示出来。\n\
  \n删除练习练习期间创建的所有资源。\n\n使用相同的容器、相同的 `Volume` 和相同的 `Service` 重新创建 `Pod`。\n\n打开浏览器并指向\
  \ `http://localhost:8080/files`。现在没有文件了。解释为什么。\n\n### 14.4 练习解答\n\n创建一个名为 `front-deployment.yaml`\
  \ 的文件，内容如下：\n\n```yaml\napiVersion : apps/v1beta1\nkind : Deployment\nmetadata :\n\
  \  name : front\nspec :\n  template :\n    metadata :\n      labels :\n        app\
  \ : front\n    spec :\n      containers :\n        - name : front\n          image\
  \ : learnbook/k8s-front:0.3\n        - name : creator\n          image : learnbook/k8s-creator:0.2\n\
  ```\n\n创建一个名为 `front-service.yaml` 的文件，内容如下：\n\n```yaml\napiVersion : v1\nkind :\
  \ Service\nmetadata :\n  name : front\nspec :\n  type : LoadBalancer\n  ports :\n\
  \    - port : 8080\n      targetPort : 80\n  selector :\n    app : front\n```\n\n\
  在创建上述文件的文件夹中打开命令行。\n\n运行以下命令：\n\n```bash\nkubectl apply -f front-deployment.yaml\n\
  kubectl apply -f front-service.yaml\nkubectl get service\n```\n\n你将得到类似下方的输出：\n\n\
  > `kubectl apply -f front-deployment.yaml`\ndeployment.apps/front created\n\n> `kubectl\
  \ apply -f front-service.yaml`\nservice/front created\n\n> `kubectl get deployment`\n\
  NAME    READY  UP-TO-DATE  AVAILABLE  AGE\nfront   1/1    1               1    \
  \      97s\n\n> `kubectl get service`\nNAME  TYPE           CLUSTER-IP      EXTERNAL-IP\
  \   PORT(S)\nfront  LoadBalancer  10.102.58.78  localhost      8080:30221/TCP\n\n\
  将你的浏览器指向返回的 `EXTERNAL-IP`，在这种情况下为 `http://localhost:8080/files`。你将得到一个类似下面的页面：\n\
  \n![](img/file71.jpg)\n\n显示的页面没有列出任何文件。这是因为 creator 容器在 `/shared` 目录中创建文件，该目录是 creator\
  \ 容器本地的。我们看到的前端容器的 `/shared` 目录是另一个目录，属于前端容器本地。\n\n创建一个名为 `front-deployment.yaml2`\
  \ 的文件，内容如下：\n\n```yaml\napiVersion : apps/v1beta1\nkind : Deployment\nmetadata :\n\
  \  name : front\nspec :\n  template :\n    metadata :\n      labels :\n        app\
