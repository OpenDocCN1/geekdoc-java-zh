  \ 的混合体，我只能推荐它。这里是扩展的运行情况：\n\n![](img/file43.jpg)\n\n### 11.3 Helm\n\n在后面的章节中，我们将学习\
  \ Helm 以及创建可以使用 Helm 部署的 chart。它是 Kubernetes 世界中常用的部署工具，因为它让 Kubernetes 部署更进了一层。本质上，比起没有它，Kubernetes\
  \ 部署已经很容易很棒，但 Helm 让以下操作变得简单：\n- 根据参数变动部署\n- 将多个资源作为单一实体部署\n- 回滚部署\n\n现在还没有创建我们的\
  \ Helm chart 的时候，但我们需要使用 Helm 来部署 Ingress 控制器，然后创建我们的 chart，所以我介绍一下它。基本上，Helm 同时安装在你的部署机器（你的机器或\
  \ CD 服务器）和 Kubernetes 集群中。安装在集群内部的组件称为 Tiller。Tiller 跟踪已部署并在并在时进行升级或回滚。从概念角度来看，Helm\
  \ 的安装如下：\n\n![](img/file44.jpg)\n\n\n\n\n为了避免以后浪费时间，如果还没有安装 Helm，现在是安装的好时机。只需以下步骤操作即可。\n\
  \n运行以下命令：\n\n```bash\nhelm version\n```\n\n如果 Helm 已经安装了，你会看到类似的内容：\n\n```text\n\
  Client: &version.Version{SemVer:“v2.12.3”, …}\nServer: &version.Version{SemVer:“v2.12.3”,\
  \ …}\n```\n\n在这种情况下，你可以直接跳到下一章。否则，请继续后续。\n\n如果客户端（你的机器）缺少该程序，你需要获取 `helm` 可执行文件并将其添加到路径中。这可以通过手动完成，也可以通过包管理器完成，操作说明请参考\
  \ https://github.com/helm/helm#install。\n\n以下指令用于非安全安装。请确保你对其进行进一步的安全加固。\n\n使用以下命令在服务器上安装\
  \ Helm 的 Tiller 部分：\n\n```bash\nhelm init –history-max 200\n```\n\n# 12. 运行 pods\n\
  \n### 12.1 Deployments 和 ReplicaSets\n\n如我们所见，Kubernetes 集群是一组可用的 CPU 和内存资源，用于运行你的\
  \ Pods。Pods 应该被认为是瞬态的，因为许多因素都会导致它们的死亡：它们可能会崩溃、可能因为消耗资源过多而被杀掉、在应用程序升级期间可能需要替换为新版本，并且它们可能仅仅因为运行它们的节点关机或以其他方式变得不可而消失。\n\
  \n不要担心：Kubernetes 会尽力让你的 Pods 在任何情况下都运行。这意味着将在可用的工作节点上重启尽可能多的 Pod。它实现这一点的方法是通过一个\
  \ `ReplicaSet` 对象。`ReplicaSet` 确保指定数量的 Pod 运行在正常状态，并根据需要启动新的 Pod 或停止不必要的或异常的 Pod。\n\
  \n为了管理版本变更（即减少旧 `ReplicaSet` 中的 Pods 并增加新 `ReplicaSet` 中的 Pods），Kubernetes 使用 `Deployment`\
  \ 对象。其结构如下：\n\n![](img/file45.jpg)\n\n这看起来可能很复杂，但如果你考虑到它所有的职责，实际上其实很简单。对于你的大部分工作，你可以用一种简单（虽然不那么准确）的方式来理解它：\n\
  \n![](img/file46.jpg)\n\n我们稍后在详细介绍升级策略时会回到 `ReplicaSets`，但现在只需认为创建 `Deployments`\
  \ 是为了运行和升级你的 Pods。\n\n你如何创建一个 `Deployment` 呢？实际上有两种方法：命令式（imperative）和声明式（declarative）。命令式看起来简单，所以我们从它们开始。声明式看起来更复杂，但从长远来看，它会让你的工作变得容易得多。\n\
  \n## 12.2 命令式命令\n\n`kubectl create` 命令允许你以命令式创建 Kubernetes 资源。以下是使用 `hello-world`\
  \ Docker 镜像创建 `Deployment` 的方法：\n\n```bash\nkubectl create deployment hello –image=hello-world\n\
  ```\n\n```text\ndeployment.apps/hello created\n```\n\n然后我们可以检查 Deployment 是否已实际创建：\n\
  \n```bash\nkubectl get deployments -l app=hello\n```\n\n```text\nNAME    READY \
  \ UP-TO-DATE  AVAILABLE  AGE\nhello   0/1   1             0          1m45s\n```\n\
  \n这里有几点值得注意：Deployment 的状态和选择器（selector）。让我解释一下这两者。\n\n选择器 `-lapp=hello` 是可选的。它的意思是“只返回那些标签名为\
  \ `app` 值为 `hello` 的对象”。如果你的集群是空的，也可以不使用该选择器。标签是可以放置在 Kubernetes 对象上的元数据。选择器不会改变对象的行为；它们允许你日后选择相似的对象。\n\
  \n上面报告的状态看起来很奇怪，因为它声称 1 个预期资源中有 0 个可用，尽管其中一个是最新的。这仅仅是因为 `hello-world` 镜像是一个短运行镜像，它输出一些文本后就会停止，因此\
  \ Pod 是短命的。如果运行的是一个像 HTTP 服务器那样长时间运行的镜像，它将一直是可用的。\n\n详细来说，`kubectl get deployment`\
  \ 命令返回的列具有以下含义：\n\n- **NAME**: 这是 `Deployment` 的名称。我们在 `kubectl get deployment`\
  \ 命令中提供了它。\n- **READY**: 这是由此 `Deployment` 创建的正在运行的 Pod 数量与我们请求数量的对比。我们没有指定 Pod\
  \ 的数量，所以默认值是 `1`。0 表示没有运行的 Pod，这是由于 Pod 是短命的并停止了。\n- **UP-TO-DATE**: 这是实际上可以运行请求的\
  \ `hello-world` 镜像的 Pod 数量。这意味着镜像可以成功从 Docker 注册表中拉取。\n- **AVAILABLE**: 这是供你的用户使用的\
  \ Pod 数量。同样，这里报告 0 是因为我们运行了一个短命镜像。\n\n事实上，情况要稍微复杂一点。记得 `Deployment` 的目标是确保无论发生什么，你的\
  \ Pod 都在运行吗？这意味着一旦我们的短命 Pod 停止，部署就会创建一个新的。所以，如果你连续运行几次上面的 `kubectl get` 命令，你会发现在某些时间点有一个\
  \ Pod 被标记为“Ready”。注意，Deployments 并不是为短命 Pod 设计的，我们本应该使用 `Job`，这样 Pod 就不会被无意义地重启。\n\
  \n\n\n\n注意：在命名 Kubernetes 对象时（任何需要名称的地方），请确保仅使用小写字母和/或连字符，且最大长度为 64 个字符。\n\n## 12.3\
  \ 练习 - 使用命令式命令\n\n**目标：** 熟悉命令式创建资源。\n\n`learnbook/k8s-pinger:0.6` 镜像每 5 秒 ping\
  \ 一 `www.google.com`。\n\n- 创建一个名为 `pinger` 的 `Deployment`，部署 `learnbook/k8s-pinger:0.6`\
  \ 镜像。\n- 显示 `Pods` 并检查是否有一个运行 `learnbook/k8s-pinger:0.6` 镜像的 Pod。\n- 显示 `pinger`\
  \ `Pod` 的日志，以确认它确实在 远程服务器。\n\n### 12.4 练习解答\n\n打开命令行。\n\n运行以下命令：\n\n```bash\nkubectl\
  \ create deployment pinger --image=learnbook/k8s-pinger\n```\n\n确保输出结果显示 `Deployment`\
  \ 已创建。\n\n运行以下命令：\n\n```bash\nkubectl get pods -l app=pinger\nkubectl logs -l app=pinger\n\
  ```\n\n你应该得到类似下方的输出：\n\n```NAME          READY  STATUS    RESTARTS  AGE\npinger-7489\
  \   1/1     Running   0          32s\n\nround-trip min/avg/max = 12.100/12.100/12.100\
  \ ms\nSleeping for 5 seconds\nPinging at: …\nPING www.google.com (216.58.209.228):\
  \ 56 data bytes\n— www.google.com ping statistics —\n1 packets transmitted, 1 packets\
  \ received, 0% packet loss\nround-trip min/avg/max = 9.735/9.735/9.735 ms\nSleeping\
  \ for 5 seconds```\n\n## 12.5 练习 - 观察 Kubernetes 处理失败的 pod\n\n**目标：** 检查当 `Pod`\
  \ 失败时会发生什么。\n\n- 显示 `Pods` 和 `Deployments`。检查是否存在可用的 `pinger` `Pod` 实例。\n- 使用以下命令删除\
  \ `pinger` `Pod`（删除 `Pod`，不是 `Deployment`）：\n```bash\nkubectl delete pod -l app=pinger\n\
  ```\n- 显示 `Pods` 和 `Deployments`。检查之前的 `Pod` 正在关闭，并且已经启动了一个新的 `Pod` 来替换它。\n- 删除\
  \ `pinger` `Deployment`。显示 `Pods` 和 `Deployments`。检查所有的 `pinger` Pod 是否已删除。\n\n\
  ### 12.6 练习解答\n\n打开命令行。\n\n运行以下命令：\n\n```bash\nkubectl get deployments\nkubectl\
  \ get pods\n```\n\n注意存在一个 `pinger` `Pod` 实例：\n\n```\n> kubectl get deployments\n\
  NAME    READY  UP-TO-DATE  AVAILABLE  AGE\npinger  1/1    1               1    \
  \      15m\n```\n\n```\n> kubectl get pods\nNAME             READY  STATUS    RESTARTS\
  \  AGE\npinger-7489665  1/1    Running   0          15m\n```\n\n运行以下命令：\n\n```bash\n\
  kubectl delete pod -l app=pinger\nkubectl get deployments\nkubectl get pods\n```\n\
  \n注意为了替换正在删除的 Pod 而创建的新 `Pod`。这是由于 `Deployment` 那里，确保了 `Pod` 持续运行。\n\n运行以下命令：\n\n\
  ```bash\nkubectl delete deployment pinger\nkubectl get deployments\nkubectl get\
  \ pods\n```\n\n注意 `Deployment` 及其所属的 `Pods` 已删除或正在删除过程中。\n\n## 12.7 声明式命令\n\n从长远来看，管理\
  \ Kubernetes 对象的更好方法是：声明式命令。与其告诉 Kubernetes 要做什么，不如告诉 Kubernetes 你期望的状态是什么。这允许 Kubernetes\
  \ 无论初始状态如何，都能达到预期的状态。这反过来简化了你的部署和维护工作。\n\n例如，假设你告诉 Kubernetes 你想要两个 `Pods`。它将采取的行动将取决于你提供命令时以及之后\
  \ Kubernetes 集群的实际状态：\n- 如果集群中没有 `Pod`，它将创建两个。\n- 如果集群中有一个这样的 `Pod`，它将创建另一个。\n-\
  \ 如果集群中有 4 个这样的 `Pod`，它将删除两个。\n- 如果集群中有两个这样的 `Pod` 运行的是旧版本的镜像，它们将被新镜像替换。\n- 如果运行其中两个\
  \ `Pod` 的任一集群 `Node` 崩溃，相应的 `Pod` 将在另一个 `Node` 上创建。\n\n声明式命令有一个缺点：起初它们看起来比命令式命令更复杂。这是因为它们很冗长，因为描述了预期状态中所有非默认的值。但从长远来看你会习惯的，而且把事情显式化本身就是一种良好的实践。\n\
  \n声明式命令带来了许多优势：\n- 对于应用维护，比命令式命令更简单。\n- 易于在 CI/CD 链中使用。\n- 应用良好的实践，如：基础设施即代码和单一事实来源。\n\
  \n给定一个命令式命令，Kubernetes 会采取适当步骤来达到命令所描述的预期状态。\n\n### 运行声明式命令\n\n为了运行声明式命令，常用的方法是创建一个描述预期状态的\
  \ YAML 文件，并将该文件提供给 `kubectl` 命令。\n\n这是一个 YAML 文件示例（稍后将介绍语法）：\n\n`deploy.yaml`\n\
  ```yaml\napiVersion: apps/vbeta1\nkind: Deployment\nmetadata:\n  name: my-front\n\
  spec:\n  replicas: 1\n  template:\n    spec:\n      containers:\n      - name: my-front\n\
  \        image: my-wordpress:1.0\n        ports:\n        - containerPort: 80\n\
  ```\n\n这里是让 Kubernetes 集群符合该描述的命令：\n\n```bash\nkubectl apply -f deploy.yaml\n```\n\
  \n运行该命令后，Kubernetes 创建一个 `Deployment`，进而创建一个 `ReplicaSet`，然后创建一个运行 `my-wordpress:1.0`\
  \ 镜像容器的 `Pod`：\n\n![](img/file47.jpg)\n\n### 要达的状态\n\nKubernetes 将尝试达到 YAML 文件描述的状态，无论集群初始状态如何。这对于在本地机器、测试集群或生产集群上部署应用非常有用：大部分只需要提供相同的\
  \ YAML（以及不同的参数或环境变量，稍后将介绍）。\n\n这意味着扩容或升级应用程序变成了应用 YAML 文件的简单问题。例如，让我们扩容。处理大量的用户，更多的\
  \ Pod 将处理更高的用户量。扩容的另一个优势是你的应用程序变得更具韧性：四个 Pod 中丢失一个并无妨。\n\n所以，让我们扩容。只需更改 YAML 文件中的一个数字并使用与之前相同的命令即可。\n\
  \n```yaml\napiVersion: apps/vbeta1\nkind: Deployment\nmetadata:\n  name: my-front\n\
  spec:\n  replicas: 4\n  template:\n    spec:\n      containers:\n      - name: my-front\n\
  \        image: my-wordpress:1.0\n        ports:\n        - containerPort: 80\n\
  ```\n\n```bash\nkubectl apply -f deploy.yaml\n```\n\n![](img/file48.jpg)\n\n\n\n\
  \n\n由于我的集群中运行着 4 个版本为 1.0 的 Pod，它们需要被版本为 1.1 的 Pod 替换。Kubernetes 会创建一个新的 1.1 Pod，并等待检查该\
  \ Pod 是否正常工作。如果 Pod 无法工作，Kubernetes 将停止创建 1.1 Pod，并保持 1.0 版本可用。如果 Pod 正常工作，Kubernetes\
  \ 将删除一个 1.0 Pod 并继续创建第二个 1.1 Pod，以此此类推。\n\n![](img/file49.jpg)\n\n简而言之，你的应用程序在更新期间将保持稳定，且不会消耗超出范围的资源；最棒的部分是，这一切默认情况下都是自动化的。\n\
  \n再次，声明式命令无论初始状态如何都有效。如果你对空集群执行 `kubectl apply` 之前的 YAML 文件，它将一个接一个创建这 4 个 Pod。这是一个非常方便的功能，因为应用程序部署到开发集群的频率通常比部署到生产集群高。你可以定义\
  \ CI/CD 流水线，在每次推送代码时发布到开发集群，仅在向仓库添加标签或执行某些其他手动操作时发布到测试集群；使用完全相同的 YAML 文件和相同的 `kubectl\
  \ apply` 命令就可以轻松实现，只是在开发集群上的执行频率比测试集群高而已。\n\n如果你想使用单个 Kubernetes 集群来部署应用程序的开发版本和测试版本，这也是很容易：命名空间（Namespaces）可以将你的\
  \ Kubernetes 对象相互隔离。我们稍后会学习命名空间。\n\n## 声明式语法\n\n让我们仔细查看一下刚刚应用到 Kubernetes 集群的 YAML\
  \ 文件，以及如何获取编写该文件的帮助。\n\n`kubectl` 命令还可以输出必要的 YAML，这样当你创建一个声明式 YAML 文件时，可以从现有文件开始，而不是从空白页开始。你只需要在命令式命令中添加\
  \ `--dry-run` 和 `-o yaml` 开关即可。\n\n例如，我之前使用的相同 `kubectl create deployment` 命令在添加必要的开关后，将输出以下\
  \ YAML：\n\n```bash\nkubectl create deployment hello --image=hello-world -dry-run\
  \ -o yaml\n```\n\n```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  creationTimestamp:\
  \ null\n  labels:\n    app: hello\n  name: hello\nspec:\n  replicas: 1\n  selector:\n\
  \    matchLabels:\n      app: hello\n  strategy: {}\n  template:\n    metadata:\n\
  \      creationTimestamp: null\n      labels:\n        app: hello\n    spec:\n \
  \     containers:\n      - image: hello-world\n        name: hello-world\n     \
  \   resources: {}\nstatus: {}\n```\n\n该 YAML 比我在演示中使用的更冗长，因为它包含了默认值。这是一件好事，因为我们希望将其作为基础模板。另一个值得注意的点是，实际的\
  \ YAML 会根据你运行的 Kubernetes 集群版本而有所异：它是使用 Kubernetes API 生成的，而该 API 在不同 Kubernetes\
  \ 版本之间略有不同。\n\n如果你更倾向于 JSON，也可以使用它。YAML 和 JSON 都是对象、对象列表和对象属性的文本表示格式。我在本书中使用 YAML，因为这是\
  \ Kubernetes 声明式命令中最常见的格式。YAML 规范可以在官方网站上找到，你可以通过该网站的预览部分或该快速入门快速上手……\n\n用于创建部署的文档中有四个主要属性（我们刚刚从\
  \ `kubectl` 命令获取的那些，或者我们在书中之前使用的那些）：\n\n- `apiVersion`: 指明后续属性使用的 Kubernetes API\
  \ 版本。\n- `kind`: 我们正在创建或更新的 Kubernetes 对象。在这里是 `Deployment`（部署）。\n- `metadata`:\
  \ 应附加到 Kubernetes 对象上的数据。它被用于多种目的查找 Kubernetes 对象。我们之前在创建选择器以查看日志时使用过它（记得 `kubectl\
  \ logs -l app=hello`），它也将用于 Kubernetes 对象之间的相互引用。\n- `spec`: 描述 `Deployment` 应该是什么样：\n\
  \  - `template`: 描述由此 `Deployment` 管理的 Pod 应该是什么样。\n  - `replicas`: 此 `Deployment`\
  \ 应该拥有的 Pod 数量。这涉及到在数量增加或 Pod 死亡时创建 Pod，或者在数量减少或 Pod 具有不同的模板存在时删除 Pod。\n  - `strategy`:\
  \ 说明当此 `Deployment` 的之前的版本需要更新时，`Deployment` 将如何对当前 Pod 执行操作；我们将在“更新策略”章节中看到更多内容。\n\
  \n## 声明式命令\n\n让我们回顾一下如何使用声明式命令管理 Kubernetes 集群。\n\n这是创建对象的方法：\n\n```bash\nkubectl\
  \ apply -f deploy.yaml\n```\n\n这是你更新对象的方法（与上方命令相同）：\n\n```bash\nkubectl apply -f\
  \ deploy.yaml\n```\n\n这是你完全删除对象的方法：\n\n```bash\nkubectl delete -f deploy.yaml\n\
  ```\n\n虽然 Kubernetes 可能非常复杂，但这些命令的简单性直白地说明了 Kubernetes 如何让复杂的操作变得简单。\n\n在所有上述命令中，你可以将文件名替换为文件夹名。在这种情况下，文件夹中的所有文件都将通过命令。这允许你将每个\
  \ Kubernetes 对象写在单独的文件中而不是将它们全部打包。\n\n例如，考虑以下文件（为了简洁已进行了截断）：\n\n`deploy.yaml`\n\
  ```yaml\napiVersion : apps / v1beta1 kind : Deployment … — apiVersion : v1 kind\
  \ : Service …\n```\n\n使用 `--` 分隔符允许在单个 YAML 文件中描述多个对象。\n\n它可以通过以下命令应用：\n\n```bash\n\
  kubectl apply -f deploy.yaml\n```\n\n你也可以将其替换为 `k8s` 文件夹中的两个文件：\n\n`k8s/deployment.yaml`\n\
  ```yaml\napiVersion : apps / v1beta1 kind : Deployment …\n```\n\n`k8s/service.yaml`\n\
  ```yaml\napiVersion : v1 kind : Service …\n```\n\n这些文件将使用单个命令应用：\n\n```bash\nkubectl\
  \ apply -f ./k8s\n```\n\n## 12.8 练习 - 使用声明式命令创建资源\n\n**目标**：熟悉声明式创建资源。\n\n1. 在 YAML\
  \ 文件中描述名为 `pinger` 的 `Deployment`，部署 `learnbook/k8s-pinger:0.6` 镜像并带有 `app=pinger`\
  \ 标签。\n2. 使用 `kubectl apply` 命令在 Kubernetes 集群中创建该 Deployment。\n3. 显示 Pod 和 Deployment，检查\
  \ Deployment 是否创建。\n\n## 12.9 练习答案\n\n创建一个名为 `pinger-deployment.yaml` 的文件，内容如下：\n\
  \n```yaml\napiVersion : apps/v1 kind : Deployment metadata :\n\nname : pinger spec\
  \ :\n\ntemplate :\n\nmetadata :\n\nlabels :\n\napp : pinger\n\nspec :\n\ncontainers\
  \ :\n- name : pinger\n  image : learnbook/k8s-pinger:0.6\n```\n\n在创建上述文件的文件夹中打开命令行。\n\
  \n运行以下命令：\n\n```bash\nkubectl apply -f pinger-deployment.yaml\nkubectl get deployment\n\
  kubectl get pods\nkubectl logs -lapp=pinger\n```\n\n你应该得到类似下面的输出：\n\n```bash\n$\
  \ kubectl apply -f pinger-deployment.yaml\ndeployment.apps/pinger created\n\n$ kubectl\
  \ get deployment\nNAME    READY   UP-TO-DATE   AVAILABLE   AGE\npinger  1/1    \
  \ 1               1           52s\n\n$ kubectl get pods\nNAME        READY   STATUS\
  \    RESTARTS AGE\npinger-646  1/1     Running   0         92s\n\n$ kubectl logs\
  \ -lapp=pinger\nround-trip min/avg/max = 12.100/12.100/12.100 ms\nSleeping for 5\
  \ seconds\nPinging at: www.google.com (216.58.209.228): 56 data bytes\n```\n\n\n\
  ## 环境变量\n\n运行在 Pod 中的容器通常需要提供环境变量。环境变量可以从容器内部的可执行程序读取；它是提供 API URL 或数据库连接字符串等额外信息的常用方法。\n\
  \n可以使用容器定义的 `env` 属性为 Pod 提供环境变量。这是一个带有两个环境变量的容器示例：\n\n```yaml\napiVersion : apps\
  \ / v1beta1 kind : Deployment metadata :\n\nname : my - front spec : template :\n\
  \nspec :\n\ncontainers :\n```\n\n\n\n\n\n* `name`: `my - front`\n\n`image`: `my\
  \ - wordpress : 1.0`\n\n`env`:\n\n* `name`: `someName`\n  `value`: `\"some value\"\
  `\n\n* `name`: `someOtherName`\n  `value`: `\"some other value\"`\n\n当运行在 `my-wordpress:1.0`\
  \ 镜像内部的可执行程序查询环境变量 `\"someName\"` 的值时，它接收到的值为 `\"some value\"`。\n\n## 12.10 练习 -\
  \ 更新声明式创建的 Pod\n\n**目标**: 更新一个声明式创建的 Pod，为容器提供环境变量。\n\n更新你在上一个练习中创建的 YAML 文件。你应该向容器传递以下环境变量：\n\
  \n`target`: `www.qwant.com`\n`delay`: `30`\n\n由于容器运行的是 `learnbook/k8s-pinger:0.6`\
  \ 镜像，这些变量指定了容器应该每 30 秒 ping 一次 `www.qwant.com` 地址。\n\n1. 显示 Pods 和 Deployments 并检查\
  \ Pod 是否已更新。\n2. 显示带有 `app=pinger` 标签的 Pod 日志。检查是否正在向 `www.qwant.com` 进行 ping。\n\
  3. 在日志的某个时刻，你可以看到 `www.google.com` 和 `www.qwant.com` 都被 ping 了。你能解释为什么吗？\n\n## 12.11\
  \ 练习答案\n\n编辑名为 `pinger-deployment.yaml` 的文件，内容如下：\n\n```yaml\napiVersion : apps/v1beta1\n\
  kind : Deployment\nmetadata :\n  name : pinger\nspec :\n  template :\n    metadata\
  \ :\n      labels :\n        app : pinger\n    spec :\n      containers :\n    \
  \  - name : pinger\n        image : learnbook/k8s-pinger:0.6\n        env :\n  \
  \        - name : target\n            value : \"www.qwant.com\"\n          - name\
  \ : delay\n            value : \"30\"\n```\n\n在创建上述文件的文件夹中打开命令行。\n\n运行以下命令：\n\n\
  ```bash\nkubectl apply -f pinger-deployment.yaml\nkubectl get deployment\nkubectl\
  \ get pods\nkubectl logs -lapp=pinger --tail 20\n```\n\n你应该得到类似下方的输出：\n\n> kubectl\
  \ apply -f pinger-deployment.yaml\ndeployment.apps/pinger configured\n\n注意这里显示的是\
  \ configured（已配置）而不是你上一个练习中的 created（已创建）。这是因为 `Deployment` 已经存在。\n\n> kubectl get\
  \ deployment\nNAME    READY  UP-TO-DATE  AVAILABLE  AGE\npinger  1/1    1      \
  \       1          3m54s\n\n> kubectl get pods\nNAME        READY  STATUS      RESTARTS\
  \  AGE\npinger-646  1/1    Terminating  0         62s\npinger-688  1/1    Running\
  \      0         8s\n\n我们可以看到 Kubernetes 创建了一个新的 Pod 以使用适当的环境变量运行它。一旦新 Pod 启动并运行，旧的\
  \ Pod 就会终止。\n\n> kubectl logs -lapp=pinger --tail 20\n```round-trip min/avg/max\
  \ = 11.246/11.246/11.246 ms\nSleeping for 5 seconds\nPinging at: …\nPING www.google.com\
  \ (216.58.201.228): 56 data bytes\n— www.google.com ping statistics —\n1 packets\
  \ transmitted, 1 packets received, 0% packet loss\nround-trip min/avg/max = 11.083/11.083/11.083\
  \ ms\nSleeping for 5 seconds\nPinging at: …\nPING www.qwant.com (194.187.168.100):\
  \ 56 data bytes\n— www.qwant.com ping statistics —\n1 packets transmitted, 0 packets\
  \ received, 100% packet loss\nSleeping for 30 seconds\n```\n\n日志显示了对 `www.google.com`\
  \ 和 `www.qwant.com` 的 ping，因为它先创建了新 Pod 然后终止了上一个 Pod。在这段时间内，两个 Pod 都是活跃状态，由于我们是使用应用于\
  \ Pod 的标签进行筛选的，`kubectl logs` 命令会获取两者的输出。如果稍后运行该命令，一旦第一个 Pod 完全停止，日志将仅显示对 `www.qcant.com`\
  \ 的 ping。\n\n## 控制器 (Controllers)\n\n创建一个 `Deployment` 来管理你的 Pods，可以让你确保在任何时候（多或少，取决于集群状况和更新）始终运行给定数量的\
  \ Pod。根据你的需求，你可能想要创建其他类型的 Pod 控制器：\n\n*   **ReplicaSet / Deployment**: 运行应该始终存在的\
  \ Pod。\n*   **Job**: 以“发后后置不理”的方式运行 Pod：Kubernetes 确保规定数量的 Pod 运行完成（即容器中的主可执行程序无错误地退出）。\n\
  *   **CronJob**: 与 `Job` 相同，但是是周期性运行。它就像定期创建一个 `Job`。\n*   **DaemonSet**: 确保每个集群\
  \ `Node` 上都运行一个 Pod。这对于与 Kubernetes 相关的 Pod 很有用。\n\n## 12.12 调试 (Debugging)\n\n\
  出错的问题总会出错，常见错误包括：\n\n1. 找不到容器镜像。\n2. YAML 文件语法错误。\n3. 资源限制（OOMKilled）。\n4. 应用启动崩溃。\n\
  \n要进行调试，可以使用以下命令：\n\n*   `kubectl describe pod<name>`: 显示 Pod 的详细信息和事件。\n*   `kubectl\
  \ logs -lapp=<label>`: 显示容器的实际输出。\n\n如果你需要在容器内部运行代码检查，可以使用：\n\n```bash\nkubectl\
  \ run -i --tty busybox\n```\n\n## 12.13 练习 - 调试 Pod\n\n**目标**: 观察 Kubernetes 如何处理错误并找到错误原因。\n\
  \n1. 创建一个 `learnbook/debugging1:0.6` 的 `Deployment`，标签为 `app=debugging`。使用 `kubectl\
  \ apply` 命令创建对应的 Deployment。\n2. 显示 Pods 和 Deployments 以确保 Deployment 已创建。\n3. 该\
  \ Deployment 的状态是什么？对应的 Pod 状态是什么？\n4. 使用 `kubectl describe` 命令了解 Pod 内部发生了什么。\n\
  5. 创建一个 `mongo-express:0.49.0` 的 `Deployment`，标签为 `app=debugging2`。使用 `kubectl apply`\
  \ 命令创建对应的 Deployment。\n6. 显示 Pods 和 Deployments 以确保 Deployment 已创建。\n7. 你可以看到对应的\
  \ Pod 不断重启。解释为什么。\n\n## 12.14 练习答案\n\n创建一个名为 `debugging1-deployment.yaml` 的文件，内容如下：\n\
  \n```yaml\napiVersion : apps/v1beta1\nkind : Deployment\nmetadata :\n  name : debugging1\n\
  spec :\n  template :\n    metadata :\n      labels :\n        app : debugging1\n\
  \    spec :\n      containers :\n      - name : debugging1\n        image : learnbook/debugging1:0.6\n\
  ```\n\n在创建上述文件的文件夹中打开命令行。\n\n运行以下命令：\n\n```bash\nkubectl apply -f debugging1-deployment.yaml\n\
  kubectl get deployment\nkubectl get pods\n```\n\n> kubectl apply -f debugging1-deployment.yaml\n\
  deployment.apps/debugging1 created\n\n\n\n\n\n```\ndebugging1 0/1 1 0 24s\n```\n\
  \n你可以看到 Deployment 中的一个 Pod 已经是最新的，但尚未就绪。\n\n```bash\nkubectl get pods\n```\n\n\
  NAME READY STATUS RESTARTS AGE\ndebugging1-85 0/1 ImagePullBackOff 0 56s\n\n```\n\
  \n你可以看到该 Pod 尚未就绪，它的状态为“ImagePullBackOff”。\n\n```bash\nkubectl describe pod debugging1-85994956bc-cnlnq\n\
  ```\n\n…\n\nContainers:\n  debugging1:\n    Container ID:\n    Image:          learnbook/debugging1:0.6\n\
  \n…\n\nEvents:\n  Age               Message\n  —-               -----\n…\n  30s\
  \ (x6 over 111s) Back-off pulling image …\n  16s (x4 over 111s) Pulling image “learnbook/debugging1:0.6”\n\
  \  16s (x4 over 111s) Failed to pull image ……\n  16s (x4 over 111s) Error: ErrImagePull\n\
  \  3s (x7 over 111s) Error: ImagePullBackOff\n\n你可以看到导致 ImagePullBackOff 状态的事件：Kubernetes\
  \ 尝试拉镜像（两分钟内尝试了 4 次），但失败了。\n\n实际上，这是由于 `learnbook/debugging1:0.6` 镜像不存在。\n\n创建一个名为\
  \ `debugging2-deployment.yaml` 的文件，内容如下：\n\n```yaml\napiVersion : apps/v1beta1\n\
  kind : Deployment\nmetadata :\n  name : debugging2\nspec :\n  template :\n    metadata\
  \ :\n      labels :\n        app : debugging2\n    spec :\n      containers :\n\
  \        - name : debugging2\n          image : mongo-express:0.49.0\n```\n\n在创建上述文件的文件夹中打开命令行。\n\
  \n运行以下命令：\n\n```bash\nkubectl apply -f debugging2-deployment.yaml\nkubectl get deployment\n\
  kubectl get pods\nkubectl logs -lapp=debugging2\n```\n\n你应该将得到类似下面所示的输出：\n\n```bash\n\
  kubectl apply -f debugging2-deployment.yaml\ndeployment.apps/debugging2 created\n\
  ```\n\n```bash\nkubectl get deployment\n```\n\nNAME READY UP-TO-DATE AVAILABLE AGE\n\
  debugging1 0/1 1 0 13m\ndebugging2 0/1 1 0 26s\n```\n\n你可以看到 Deployment 中的一个 Pod\
  \ 已经是最新的，但尚未就绪。\n\n```bash\nkubectl get pods\n```\n\nNAME READY STATUS RESTARTS\
  \ AGE\ndebugging1-85 0/1 ImagePullBackOff 0 13m\ndebugging2-7c 0/1 CrashLoopBackOff\
  \ 1 31s\n\n```\n\n你可以看到 Pod 被重启了一次，并且处于 CrashLoopBackOff 状态。Kubernetes 重启 Pod 是因为它的主执行程序正在崩溃。\n\
  \n```bash\nkubectl logs -lapp=debugging2\n```\n\n…\n    at Pool.emit (events.js:211:7)\n\
  \    at Connection. <anonymous>(/node_modules/mongodb-core/lib/connection/pool.js:270:12)\n\
  …\n    at Connection.emit (events.js:214:7)\n    at Socket. <anonymous>(/node_modules/mongodb-core/lib/connection/connection.js:175:49)\n\
  …\n\n你可以看到 Pod 内部的执行程序是一个 Node.JS 应用，它将堆栈跟踪发送到了日志（其输出）。在跟踪信息中，你可以看到失败的代码与到 MongoDB\
  \ 的连接有关。\n\n实际上，`mongo-express:0.49.0` 镜像需要一个包含 MongoDB 数据库连接字符串的环境变量，因为它是用于数据库管理的\
  \ Web 前。这就是你收到这条消息的原因，因为我没有要求为 Pod 提供环境变量。\n\n### 12.15 练习 - 删除已创建的内容\n\n**目标**：释放之前练习中创建的资源。\n\
  显示当前运行的 Pods 和 Deployment。\n使用 `kubectl delete` 命令和之前练习创建的 YAML 文件，删除所有的 Pods 和\
  \ Deployment。\n\n### 12.16 练习答案\n\n在创建之前文件的文件夹中打开命令行。\n\n运行以下命令：\n\n```bash\nkubectl\
  \ get deployment\nkubectl get pods\nkubectl delete -f pinger-deployment.yaml\nkubectl\
  \ delete -f debugging1-deployment.yaml\nkubectl delete -f debugging2-deployment.yaml\n\
  kubectl get deployment\nkubectl get pods\n```\n\n你应该将得到类似下面的输出：\n\n```bash\nkubectl\
  \ get deployment\nNAME READY UP-TO-DATE AVAILABLE AGE\ndebugging1 0/1 1 0 12h\n\
  debugging2 0/1 1 0 12h\npinger 1/1 1 31h\n```\n\n```bash\nkubectl get pods\nNAME\
  \ READY STATUS RESTARTS AGE\ndebugging1-85 0/1 ImagePullBackOff 0 12h\ndebugging2-7c\
  \ 0/1 CrashLoopBackOff 8 12h\npinger-68bf5 1/1 Running 2 31h\n```\n\n```bash\nkubectl\
  \ delete -f pinger-deployment.yaml\ndeployment.apps/pinger deleted\nkubectl delete\
  \ -f debugging1-deployment.yaml\ndeployment.apps/debugging1 deleted\nkubectl delete\
  \ -f debugging2-deployment.yaml\ndeployment.apps/debugging2 deleted\nkubectl get\
  \ deployment\nNo found.\nkubectl get pods\nNo found.\n```\n\n#### Pod 中总是含有一个容器吗？\n\
  \nPod 通常运行单个容器，但事实并非如此。Pod 可能会运行多个容器，正如这种情况所示：(media/file50.jpg)。在这种情况下，容器被组在同一个\
  \ Pod 中，因为它们是紧密耦合的。虽然它们可以在不同的 Pod 中运行，但跨 Pod 的容器通信会产生开销。\n\n注意有一个缺点：如果你想扩展相应的应用程序，你只能扩展整个\
  \ Pod。如果 `web-interface` 容器是瓶颈，你无法单独扩展它。在这种情况下，你可以解耦容器并运行不同的 Pod，以便只需扩展 `web-interface`\
  \ 容器。\n\n### 12.17 资源管理\n\n正如我们在引言中所看到的，Pods 和 Nodes 是内存和 CPU 资源的抽象。Node 提供内存和 CPU，而\
  \ Pod 消耗内存和 CPU。\n\nKubernetes 需要确保 Pod 有效地消耗内存和 CPU，这意味着：\n- 将 Pod 调度到资源足够的 Node；\n\
  - 终止消耗过多内存和 CPU 的异常 Pod。\n\nKubernetes 依靠 `requests` 和 `limits` 概念来实现这一点。这些是可选的，但使用它们是良好的实践，因为它们允许\
  \ Kubernetes 在压力下正确管理你的 Pod。\n\n#### Requests\n\nRequests 允许 Controller 声明运行 Pod\
  \ 需要的内存和 CPU。它们指定了调度 Pod 的 Node 上应该具备的最小资源。当 Kubernetes 调度器需要创建 Pod 时，它会选择一个拥有 Controller\
  \ 定义中 `requests` 部分指定的内存和 CPU 资源的 Node。\n\n这是一个 Deployment 的示例定义：\n\n```yaml\napiVersion:\
  \ apps/v1beta1\nkind: Deployment\nspec:\n  template:\n    spec:\n      containers:\n\
  \      - name: front\n        image: learnbook/k8s-front:0.4\n        resources:\n\
  \          requests:\n            cpu: \"100m\"\n            memory: \"10Mi\"\n\
  ```\n\n当 Kubernetes 调度器为该 Deployment 创建 Pod 时，它会选择一个至少可用 10Mi 内存和 100 毫毫 CPU 的 Node。\n\
  \n这意味着如果你提供的值过高，Kubernetes 可能无法调度你的 Pod，因此请明智选择。\n\n#### Limits\n\n当容器内部运行的执行程序出错时，它可能会消耗过多的\
  \ CPU 和内存资源。Limits 允许 Kubernetes 处理这种情况。\n\n\n\n\n当你设置限制（limits）时，Kubernetes 会监控相应\
  \ `Pods` 使用的资源，并在实际使用的资源超过你设置的限制时将它们终止。\n\n简而言之，限制（limits）基本上是你允许 `Pod` 使用的 CPU\
  \ 和内存的最大量。\n\n以下是一个使用限制的示例 `Deployment` 定义：\n\n```yaml\napiVersion: apps/v1beta1\n\
  kind: Deployment\nspec:\n  template:\n    spec:\n      containers:\n      - name:\
  \ front\n        image: learnbook/k8s-front:0.4\n        resources:\n          limits:\n\
  \            cpu: \"200m\"\n            memory: \"50Mi\"\n```\n\n实际上，Kubernetes\
  \ 调度器会对资源进行超额配额（overcommits）：它不会立即终止超出其配额限制的 `Pods`，而是在总 `Node` 资源匮乏时才这样做。当这种情况发生时，Kubernetes\
  \ 调度器会首先终止那些超出限制最严重的 `Pods`。\n\n## 13. 暴露服务\n\n## 13.1 服务的需求\n\n既然你已经可以运行 `Pods`，你可能希望它们能够相互通信。这带来了几个问题，`Service`\
  \ 对象将回答这些问题。\n\n### 监听集群外部的连接\n\n当你托管一个服务器时（例如 Web 服务器），你希望来自客户端的入站连接能够到达你的 `Pods`：\n\
  \n![](img/file51.jpg)\n\n你可以通过以下命令来实现，该命令在 `8085` 端口监听来自集群外部的连接，并将其路由到名为 `name`\
  \ 的 `Deployment` 部署在 `8080` 端口的 `Pods`：\n\n```bash\nkubectl port-forward deployment/name\
  \ 8085:8080\n```\n\n然而，这是一个命令式命令，你现在已经知道对于中期维护来说，命令式命令并不是想要的。\n\n我们如何使用声明式命令来描述集群应该监听连接这一事实呢？`Services`\
  \ 回答这个问题。\n\n### 跨 Node 通信\n\n由于 Kubernetes 集群的目标是利用在不同 `Nodes` 上运行容器的优势，你的 `Pods`\
  \ 将分布在不同的 `Nodes` 上。\n\n一项常规任务（特别是在微服务架构中）是像这个简化示例所示的跨 `Nodes` 通信：\n\n![](img/file52.jpg)\n\
  \n我们如何跨 `Nodes` 通信？我们应该保留一个运行中的 `Pods` 列表并对它们进行寻址吗？`Services` 也回答这个问题。\n\n### 负载均衡到多个\
  \ Pod\n\n为了提供应用程序的高可用性，在工作 `Nodes` 上复制相同的 `Pod` 是一种良好的做法。我们之前看到 `Deployments` 如何轻松地做到。但我们如何确保来自客户端的入站连接会被定向到所有的\
  \ `Pods`，如下例所示？\n\n![](img/file53.jpg)\n\n再次，答案是使用 `Services`。\n\n### 13.2 Services\n\
  \n`Services` 是提供上述三个问题答案 Kubernetes 对象。\n\n`Service` 对象监听传入连接并将其路由到使用标签（labels）选择的\
  \ `Pods`，如下：\n\n![](img/file54.jpg)\n\n两种广泛使用的 `Service` 类型是 `LoadBalancer` 和 `ClusterIP`。区别在于它们是否允许来自集群外部的连接。让我们详细说明每一种。\n\
  \n### 来自集群外部的连接\n\n在创建 `Service` 时使用 `LoadBalancer` 类型，它将把来自集群外部的请求路由到匹配给定选择器（selector）的\
  \ `Pods`。\n\n这是一个 `LoadBalancer` 服务的示例定义：\n\n```yaml\napiVersion: v1\nkind: Service\n\
  metadata:\n  name: mon-front-service\nspec:\n  type: LoadBalancer\n  ports:\n  \
  \  - port: 8081\n      targetPort: 80\n  selector:\n    app: web-app\n```\n\n当你\
  \ `kubectl apply` 该定义时，集群会为你的服务分配一个公共 IP。到该 IP 发出的请求将被路由到匹配的 `Pods`，如下所示：\n\n![](img/file55.jpg)\n\
  \nIP 如何分配取决于你在云端托管集群时选择的 Kubernetes 提供程序，或者你为自托管集群添加的扩展。\n\n让我们部署一个面向 Web 的 应用程序作为示例。`Adminer`\
  \ 是用 PHP 编写的数据库管理界面，作为名为 `adminer` 的 docker 镜像。为了部署它，我使用了以下两个定义：\n\n**adminer-deployment.yaml**\n\
  ```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: adminer\nspec:\n\
  \  selector:\n    matchLabels:\n      app: adminer\n  template:\n    metadata:\n\
  \      labels:\n        app: adminer\n    spec:\n      containers:\n        - name:\
  \ adminer\n          image: adminer:latest\n          ports:\n            - containerPort:\
  \ 8080\n```\n\n**adminer-service.yaml**\n```yaml\napiVersion: v1\nkind: Service\n\
  metadata:\n  name: adminer\nspec:\n  type: LoadBalancer\n  selector:\n    app: adminer\n\
  \  ports:\n    - port: 80\n      targetPort: 8080\n```\n\n这两个定义使用以下命令应用，正如你现在知道的那样：\n\
  \n```bash\nkubectl apply -f .\n```\n\n第一个定义实际上部署了一个运行 `adminer` 应用程序的容器。第二个定义创建了一个\
  \ `Service`，将此应用程序暴露到外部世界。下面的图显示了我们刚刚创建的元素：\n\n![](img/file56.jpg)\n\nIP 的分配取决于你在云托管集群时选择的\
  \ Kubernetes 环境：\n\n- 如果在 Docker Desktop 上运行，该 `Service` 将通过 `localhost`。\n- 如果在\
  \ Minikube 上，通过 `kubectl get service` 查看。\n- 如果在 PaaS 集群上运行，`EXTERNAL-IP` 列将显示 IP。\n\
  \n`EXTERNAL-IP` 显示了该 `Service` 是否可以访问。\n\n### 13.3 练习 - 将服务暴露到互联网\n\n**目标**：部署一个\
  \ Web 应用程序并从互联网访问它。\n\n创建一个带有 `app=front` 标签的 `Pod`。使用 `LoadBalancer` `Service`\
  \ 暴露该 `Pod`，它监听 `80` 端口。\n\n打开浏览器并指向 `http://localhost:8080`（或者在 PaaS 中获取公共 URL）。完成后，删除创建的所有资源。\n\
  \n## 13.4 练习答案\n\n创建一个名为 `front-deployment.yaml` 的文件，内容如下：\n\n```yaml\napiVersion:\
  \ apps/v1beta1\nkind: Deployment\nmetadata:\n  name: front\nspec:\n  template:\n\
  \    metadata:\n      labels:\n        app: front\n    spec:\n      containers:\n\
  \        - name: front\n          image: learnbook/k8s-front:0.4\n```\n\n创建一个名为\
  \ `front-service.yaml` 的文件，内容如下：\n\n```yaml\napiVersion: v1\nkind: Service\nmetadata:\n\
  \  name: front\nspec:\n  type: LoadBalancer\n  ports:\n    - port: 8080\n      targetPort:\
  \ 80\n  selector:\n    app: front\n```\n\n在创建上述文件的文件夹中打开终端。运行以下命令：\n\n```bash\n\
  kubectl apply -f front-deployment.yaml\nkubectl apply -f front-service.yaml\nkubectl\
  \ get deployment\nkubectl get service\n```\n\n你应该应该得到类似下面的输出：\n\n```text\n> kubectl\
  \ apply -f front-deployment.yaml\ndeployment.apps/front created\n\n> kubectl apply\
  \ -f front-service.yaml\nservice/front created\n\n> kubectl get deployment\nNAME\
  \    READY   UP-TO-DATE   AVAILABLE   AGE\nfront   1/1     1               1   \
  \           9s\n\n> kubectl get service\nNAME    TYPE           CLUSTER-IP   EXTERNAL-IP\
  \   PORT(S)\nfront   LoadBalancer   10.103.108.49  localhost      8080:30164/TCP\n\
  ```\n\n将浏览器指向返回的 `EXTERNAL-IP`，在此情况下为 `http://localhost:8080`。你的浏览器应该显示以下页面：\n\n\
  ![](img/file57.jpg)\n\n运行以下命令：\n\n```bash\nkubectl delete -f .\n```\n\n\n\n假设我们想要创建一个如下应用程序，其中一些审计器\
  \ `Pods` 需要向 web-app `Pods` 发送 HTTP 请求：\n\n![](img/file58.jpg)\n\n请注意，这种架构是微服务架构的代表，其中服务在集群内部调用其他服务。通过以下\
  \ `ClusterIP` 服务的定义很容易实现：\n\n```yaml\napiVersion : v1\nkind : Service\nmetadata\
  \ :\n  name : my-front-service\nspec :\n  type : ClusterIP\n  ports :\n    - port\
  \ : 80\n  selector :\n    app : web-app\n```\n\n我们分配给 `Service` 的名称 `my-front-service`\
  \ 非常重要：Kubernetes 集群内部的名称解析服务器将确保它被解析为与该 `Service` 中定义的选择器匹配的实际 `Pods`。换句话说，当审计器\
  \ `Pod` 查询 `http://my-front-service` URL 时，它实际上查询的是一个 web-app `Pod`。\n\n还记得我为了演示\
  \ `LoadBalancer` `Service` 而部署的 adminer 服务吗？它可以查询数据库，因此我想部署一个 MySQL 数据库作为另一个 `Pod`。为了让\
  \ adminer `Pod` 与 MySQL `Pod` 通信，我可以使用一个 `Service`。由于该 `Service` 不需要从集群外部访问，`ClusterIP`\
  \ 服务类型是完美匹配。这里是我想要实现的架构图：\n\n![](img/file59.jpg)\n\n让我们部署架构图中所示的组件。对于 adminer 部分，我可以复用上面使用的完全相同的两个定义：\n\
  \n**adminer-deployment.yaml**\n```yaml\napiVersion : apps/v1\nkind : Deployment\n\
  metadata :\n  name : adminer\nspec :\n  selector :\n    matchLabels :\n      app\
  \ : adminer\ntemplate :\n    metadata :\n      labels :\n        app : adminer\n\
  \    spec :\n      containers :\n        - name : adminer\n          image : adminer:latest\n\
  \          ports :\n            - containerPort : 8080\n```\n\n**adminer-service.yaml**\n\
  ```yaml\napiVersion : v1\nkind : Service\nmetadata :\n  name : adminer\nspec :\n\
  \  type : LoadBalancer\n  selector :\n    app : adminer\n  ports :\n    - port :\
  \ 80\n      targetPort : 8080\n```\n\n现在，我们为 MySQL `Pod` 和允许其从集群内部访问的 `Service`\
  \ 添加两个定义：\n\n**mysql-deployment.yaml**\n```yaml\napiVersion : apps/v1\nkind : Deployment\n\
  metadata :\n  name : mysql\nspec :\n  selector :\n    matchLabels :\n      app :\
  \ mysql\ntemplate :\n    metadata :\n      labels :\n        app : mysql\n    spec\
  \ :\n      containers :\n        - name : mysql\n          image : mysql:5.7\n \
  \         ports :\n            - containerPort : 3306\n          env :\n       \
  \     - name : MYSQL_ROOT_PASSWORD\n              value : “root”\n```\n\n是的，这是一个非常不安全的密码。这是一个演示。不要在家里这样做。\n\
  \n**mysql-service.yaml**\n```yaml\napiVersion : v1\nkind : Service\nmetadata :\n\
  \  name : mysql\nspec :\n  type : ClusterIP\n  selector :\n    app : mysql\n  ports\
  \ :\n    - port : 3306\n      targetPort : 3306\n```\n\n这四个定义使用 `kubectl apply`\
  \ 命令应用到集群：\n\n```bash\nkubectl apply -f .\n```\n\n得益于公共 `LoadBalancer` `Service`，可以使用浏览器访问\
  \ adminer `Pod`，因此我可以将浏览器指向 `http://localhost`（或 `http://<public-ip>`）并获得登录界面。由于\
  \ `mysql` `Service` 暴露了 MySQL `Pod`，因此可以使用 Service 名称 `mysql` 从 adminer `Pod` 访问它。这意味着可以使用\
  \ `mysql` 作为 MySQL 服务器的地址：`<public-ip>`\n\n![](img/file60.jpg)\n\n如所预期，我现在可以访问由\
  \ `mysql` `Pod` 托管的 MySQL 数据库：\n\n![](img/file61.jpg)\n\n# 13.5 练习 - 在集群内部暴露 API\n\
  \n**目标：** 部署一个 API 并使其从互联网访问，然后让运行在集群内部的 `Pods` 访问。\n\n你首先需要部署一个 API 并确保它可以从集群外部访问，以便于轻松检查它是否部署正确。我们首先想要如下的应用程序架构：\n\
  \n![](img/file62.jpg)\n\n`learnbook/k8s-back:0.2` 镜是一个监听 80 端口的 API。将 `learnbook/k8s-back:0.2`\
  \ 镜像部署为名为 `back` 的 `Pod`，并带有 `app=back` 标签。使用监听 8081 端口的 `LoadBalancer` `Service`\
  \ 暴露该 `Pod`。\n\n打开浏览器并指向 `http://localhost:8081/v1/currenttime`（如果在 PaaS 集群中运行则使用公共\
  \ URL）。确保你可以访问该 API。\n\n你现在需要部署前端 Web 应用程序并使用其外部地址使其消费 API。预期的目标应用程序架构如下：\n\n![](img/file63.jpg)\n\
  \n将 `learnbook/k8s-front:0.5` 镜像部署为名为 `front` 的 `Pod`，并带有 `app=back` 标签。使用监听 8081\
  \ 端口的 `LoadBalancer` `Service` 暴露该 `Pod`。\n\n打开浏览器并指向 `http://localhost:8081/v1/currenttime`（如果在\
  \ PaaS 集群中运行则使用获取的公共 URL）。确保你可以访问该 API。\n\n你现在需要部署前端 Web 应用程序并使用其外部地址使其消费 API。\n\
  \n将 `learnbook/k8s-front:0.5` 镜像部署为名为 `front` 的 `Pod`，并带有 `app=back` 标签。使用监听 8081\
  \ 端口的 `LoadBalancer` `Service` 暴露该 `Pod`。\n\n打开浏览器并指向 `http://localhost:8081/v1/currenttime`（如果在\
  \ PaaS 集群中运行则使用获取的公共 URL）。确保你可以访问该 API。\n\n你现在需要部署前端 Web 应用程序并使用其外部地址使其消费 API。\n\
  \n`API_EXTERNAL_URL` 环境变量让 `front` 知道应该调用哪个 API。使用监听 8081 端口的 `LoadBalancer` `Service`\
  \ 暴露该 `Pod`。\n\n打开浏览器并指向 `http://localhost:8081/v1/currenttime`（如果在 PaaS 集群中运行则使用获取的公共\
  \ URL）。确保你可以访问该 API。\n\n你现在需要部署前端 Web 应用程序并使用其外部地址使其消费 API。\n\n`API_CLUSTER_URL`\
  \ 环境变量让 `front` 知道应该调用哪个 API。使用监听 8081 端口的 `LoadBalancer` `Service` 暴露该 `Pod`。\n\
  \n最后一步，使用名为 `back-inside` 的 `ClusterIP` `Service` 暴露 `back` `Pod`，它监听 80 端口。\n\n\
