- "# 学习 Kubernetes 与 Docker - .NET Core, Java, Node.JS, PHP 或 Python\n\n\n\n![](img/cover.jpg)\n\
  \n![](img/file0.jpg)\n\n\n准备好下周创建并运行你的容器化和编排应用程序。\n\n\n\n致我的父母，感谢你们教会我自由，并确保我能享受它。\n\
  \n致我伟大的家人。你们的爱与支持支持本书。\n\n致那些对本书提出改进建议的读者，特别是 Doğan Kartaltepe，感谢你一如既往的支持支持。\n\n\
  \n## 引言\n\n### 本书不是什么\n我尽力让本书保持简洁，以便让你快速学习 Kubernetes 和 Docker 而而迷失在琐碎的细节中。如果你正在寻找一本能解决未来几年内问题的参考书，那么找到了。我假设你对容器没有先验知识。\n\
  \n### 准备工作\n本书适用于任何需要容器的人。无论你是开发者、DevOps 经理还是技术人员，本书都能帮助你运行容器。\n\n### 如何阅读本书\n本书的目标是尽快让你产生效率。为此，我们将使用一些理论、多个演示以及练习。练习将如下：\n\
  \n动手实践：该拿起键盘编写代码了。\n\n在代码示例中，反斜杠 `\\` 用于折行。当你从书中复制代码时，不要输入这些反斜杠。\n\n### 你需要的工具\n\
  完成本书所需的工具如下：\n\n- 一台符合 Docker Desktop 或 Minikube 要求的 Windows、Linux 或 Mac 机器，或者具备创建\
  \ PaaS 集群的能力（Azure AKS, Google GKE, Amazon EKS）。\n- 文本编辑器。\n\n### 源代码\n所有的演示和动手实践答案都可以在\
  \ bitbucket.org/epobb/kubernetesdockerfiles 获取。你可以以 ZIP 文件格式下载，如果你安装了 GIT，只需输入：\n\
  \n```bash\ngit clone https://bitbucket.org/epobb/kubernetesdockerfiles.git\n```\n\
  \n## 1. 为什么用 Docker?\n\n### 1.1 一个 DevOps 赋能工具\nDocker 是一个运行容器的引擎，容器作为一种工具可以解决 DevOps\
  \ 趋势带来的许多挑战。\n\n在 DevOps 中，开发团队和运维团队的目标是冲突的：\n\n作为一个敏捷的开发者，我希望频繁发布应用程序，这样部署就会变成常规。这背后的逻辑是，这种敏捷让“上线”事件变成一个正常、频繁且完全掌控的事件，而不是一个可能在一周后袭击我的可怕灾难。相反，如果部署出现任何问题，都是运维团队需要面对用户——所以他们自然希望稳定性。\n\
  \n容器让部署变得简单，因为部署仅仅是运行一个新容器、将用户路由到新容器并丢弃旧容器。这甚至可以由编排工具自动化，而且由于非常容易，我们可以让多个容器服务于同一个应用程序，以增加更新期间的稳定性。\n\
  \n\n\n\n\n如果你不使用容器，运维（Ops）需要处理你的托管环境：运行时、库以及你的应用程序所需的操作系统。另一方面，当使用容器时，他们只需要一种单一的方法，就可以处理你提供的容器，无论里面装的是什么。你大可以使用\
  \ `.NET Core`、`Java`、`Node.JS`、`PHP`、`Python` 或其他开发工具：只要你的代码是容器化的，对他们来说就无关紧要。在 DevOps\
  \ 方面这对于容器来说是一个巨大的优势。\n\n在“带有常用开发配置的 Docker”一章中，我们将看到如何为特定的开发技术创建容器镜像。但你的运维人员并不知道你是如何创建镜像的，他们只看到容器镜像。\n\
  \n### 1.2 它解决了依赖冲突\n\n一个典型的 Web 应用看起来如下：\n\n![](img/file1.jpg)\n\n该应用由 HTTP 服务器提供的文件（这里是\
  \ `Apache`，但也可以是 `Kestrel`、`IIS`、`NGINX` 等）、一个运行时（这里是 `PHP 5.6`）和一个开发框架（这里是 `Wordpress\
  \ 4.9`）组成。\n\n如果没有容器，依赖项和文件都将放在同一个服务器上。由于管理这些依赖项非常耗时，类似的应用通常会被分组在同一台服务器上，共享它们的依赖项：\n\
  \n![](img/file2.jpg)\n\n现在假设你想将 `PHP` 运行时从版本 `5.6`升级到 `7.2`。但版本更改会导致应用发生破坏性变化，因此应用也需要更新。在进行升级时，你需要同时更新\
  \ `App 1` 和 `App 2`。在一个可能托管了许多此类应用的服务器上，这将是一项艰巨的任务，你可能需要推迟升级直到所有应用都准备就绪。\n\n另一个类似的问题是你想在同一台服务器上托管例如\
  \ `App 3`，但 `App 3` 使用 `Node.JS` 运行时以及一个包，该包在安装时会更改 `PHP` 运行时所使用的依赖项。运行时之间的冲突並不罕见，所以你可能已经遇到过这个问题了。\n\
  \n容器解决了这个问题，因为每个应用都将运行在自己的容器中，并拥有自己的依赖项。你典型的服务器看起来像这样：\n\n![](img/file3.jpg)\n\n\
  每个容器都封装了它自己的依赖项。这意味着你可以在容器中将 `PHP` 运行时从 `5.6` 版本迁移到 `7.2` 而不影响其他容器。任何其他使用例如 `Node.JS`\
  \ 的容器都不会干扰任何 `Wordpress` 容器。\n\n### 1.3 它允许轻松水平扩展\n\n当服务器应用需要处理比单台服务器处理能力更高的流量时，解决方案是众而易知的：在它前面放置一个反向代理，并根据需要复制服务器。在我们之前的\
  \ `Wordpress` 应用示例中，这意味着将服务器连同所有的依赖项一起复制：\n\n![](img/file4.jpg)\n\n这在升级时只会让情况变得糟糕：我们需要升级每台服务器的依赖项，以及可能引发的所有冲突。\n\
  \n再次，容器对这个问题提供了解决方案。正如我们将在“基础概念”章节中看到的，容器是基于镜像的。你只需要从单个镜像运行你任意数量的容器，它们都将拥有完全相同的依赖项。\n\
  \n更好的是：当使用编排器（orchestrator）时，你只需要说明你想运行多少个容器、镜像名称，编排器就会在你所有的 Docker 服务器上创建相应数量的容器。我们将在编排器部分看到这些。它看起来是这样：\n\
  \n![](img/file5.png)\n\n### 1.4 它允许无缝升级\n\n即使在扩展后的场景中，基于容器的方法也让一个原本复杂的概念变得轻而易举。如果没有容器，如果你喜欢的管理员必须更新包括依赖项在内的每台服务器，他将不会高兴：\n\
  \n![](img/file6.jpg)\n\n当然，在这种情况下，更新过程将取决于应用及其依赖项。如果你想活命，就别尝试向你的管理员提什么 DevOps 了。\n\
  \n通过使用容器，只需要告诉编排器你想运行新版本的镜像即可，它将逐渐将每个容器替换为另一个运行新版本的容器。无论容器内部运行的是什么技术栈，这都是一个简单的命令（事实上，正如我们将看到的，只需更改一行）。\n\
  \n下面的插图展示了这一过程：编排器替换一个容器，然后移动到其他容器。在新容器准备就绪之前，流量将被路由到旧版本的容器，这样就不会有服务中断。\n\n![](img/file7.png)\n\
  \n### 1.5 国际贸易早已在使用容器\n\n当然，你可能在奇怪我为什么要做这样的比较。你甚至可能在评估我有多疯狂，或者考虑是否要回到买书的地方退书。别再想了：我不疯。国际贸易面临着同样的交付问题：我们正试图尽可能流畅地交付软件，而商业需要尽可能流畅地交付货物。\n\
  \n在过去，装载一艘船货物需要几天时间：\n\n![](img/file8.jpg)\n\n经典的装船方式\n\n船在码头停留几天，期间每件货物都被装入其中。货物的大小不一，处理要求也不同，而船也有不同类型和尺寸的存储空间。这使得装载（卸载）变成了一个缓慢的过程。缓慢且昂贵：它需要许多人操作，而且船和货的固定是有成本的。\n\
  \n找到了解决方案：容器。这个想法非常简单：使用标准尺寸的箱子，并在里面装入你任何东西。你现在只需要处理标准的箱，无论里面装的是什么。问题解决了：船可以根据许多容器\n\
  \n![](img/file9.jpg)\n\n集装箱装船\n\n事实上，整个运输链（火车、卡车）都可以根据标准高效管理容器：\n\n![](img/file10.jpg)\n\
  \n货运火车\n\n信不信由：Docker 容器非常相似。当你创建一个镜像时，你把软件装进容器。当机器运行它时，容器被创建。容器镜像和容器可以以标准方式管理，从而在容器化软件的生命周期内提供标准的解决方案：\n\
  \n- 通用的构建；\n- 通用的镜像存储；\n- 通用的扩展方式；\n- 通用的运行容器托管；\n- 通用的运行容器控制和监控；\n- 通用的更新运行容器到新版本。\n\
  \n最重要的部分是：无论容器内部是什么软件，都可以以通的方式处理。这不是 DevOps 的梦想吗？\n\n## 2. 为什么需要 Kubernetes?\n\n\
  ## 2.1 容器编排的需求\n\n当你高度依赖容器或高负载时，管理容器将引发许多问题。思考如何：\n\n- 部署和维护使用许多容器的应用。\n- 部署和维护在不同机器上生成容器的应用。\n\
  - 管理容器使用的资源。\n- 通过添加和删除容器来扩展应用，可能跨越不同的机器或动态配置的机器。\n- 更新你的应用程序。\n- 在不中断应用程序的情况下更新运行应用程序的服务器。\n\
  - 从一个主机切换到另一个主机。\n\n这些问题被容器编排系统优雅地解决了。Kubernetes 就是这样一个容器编排平台。你可以把它看作是容器的操作系统。它自动执行跨主机集群的容器化应用的部署、扩展和运行。\n\
  \n## 2.2 什么是 K8s?\n\nK8s 仅仅是 Kubernetes 的缩写。取开头 K 和结尾 s 之间的字母，数数它们的个数并用该数字替换它们。由于\
  \ `ubernete` 是 8 个字母，它可以被替换为 `8`，从而得到 K8s。\n\n\n\n\n\n顺便提一下，Kubernetes 网站上有一个完整的\
  \ Kubernetes 术语表。\n\n## 3. 运行 Docker\n\n### 3.1 针对不同需求的各种产品\n\n在运行托管关键应用程序容器的生产环境中，你可能倾向于让你熟悉的管理员来安装\
  \ `Docker Enterprise`。\n\n但在你的开发机器或持续集成构建机器上，你可以简单地使用免费的 `Docker Engine Community`\
  \ 或 `Docker Desktop`（取决于你的机器类型）。\n\n简而言之：\n\n本章的其余部分将引导你完成各种平台的安装步骤。\n\n### Hello\
  \ world 测试\n\n无论你安装的是哪种版本，都可以在命令行（Linux 上的终端或 Windows 上的 PowerShell）中运行以下命令来检查安装情况：\n\
  \n```\ndocker run hello-world\n```\n\n它应该拉取一个镜像并输出以以下开头的文本：\n\nHello from Docker!\n\
  \n这条消息表明你的安装看起来工作正常。\n\n### 3.2 开发者或 CI 机器 上的社区版\n\n#### Windows 10\n`Docker Desktop`\
  \ 需要 Windows 10 专业版或企业版 64 位系统，因为它基于 `Hyper-V`。\n\n如果你使用的 Windows 桌面版不符合要求，可以使用基于\
  \ `VirtualBox` 的旧版 `Docker Toolbox`。\n\n在安装 `Docker Desktop` 之前，务必执行以下操作：\n- 启用\
  \ `Hyper-V`\n- 在 `BIOS` 中启用硬件虚拟化\n\n然后，点击此链接并按照其中的说明操作。\n\n在安装过程中，系统会提示你使用 Windows\
  \ 容器还是 Linux 容器。我建议使用 Linux 容器，因为：\n- 你以后随时更改主意，只需右键点击工具栏上的 Docker 图标并选择“切换到 Windows\
  \ 容器 (Switch to Windows containers...)”。\n- 目前大多数容器镜像都是基于 Linux 的。\n\n#### Linux\n\
  还有其他 Docker 包可用，你可以根据你的版本遵循相应的步骤：\n- CentOS 7\n- Debian 或 Raspbian\n- Fedora 26+\
  \ 64 位\n- Ubuntu Bionic, Xenial 或 Trusty 64 位\n\n无论你用的是哪种 Linux 发行版，这里都有通用的安装后步骤。请仔细阅读，特别是如果你无法成功运行\
  \ `hello-world` 测试时。\n\n#### Mac\n`Docker Desktop` 需要 Mac OS Sierra 10.12 或更高版本。\n\
  \n如果你使用的是较旧的 macOS 版本，可以使用基于 `VirtualBox` 的旧版 `Docker Toolbox`。\n\n页面底部是安装 `Docker\
  \ Desktop` 的说明。\n\n### 3.3 服务器上的企业版\n\n#### Windows Server 2016\nWindows Server\
  \ 2016 客户可以免费额外使用 `Docker Enterprise`。只需按照说明操作即可。\n\n#### Linux\n`Docker Enterprise`\
  \ 可以在 CentOS、Red Hat、SUSE、Ubuntu 等更多系统上运行。点击此处查看你的 Linux 版本是否受支持。\n\n#### 云服务\n\
  `Docker Enterprise` 作为 `Azure` 和 `AWS` 的模板可用。\n\n## 4. 基础概念\n\n我需要你掌握三个概念，以便我们能够顺利开始：`containers\
  \ (容器)`、`images (镜像)` 和 `registries (镜像仓库库)`。\n\n`container (容器)` 是我们最终想要在 Docker\
  \ 中运行和托管的对象。你可以把它想象成一个隔离的机器，或者如果你愿意，也可以把它看作虚拟机。\n\n从概念角度来看，`container` 运行在 `Docker\
  \ host (Docker 主机)` 内部，与其他容器甚至宿主机操作系统隔离。除非你显式说明，否则它无法看到其他容器、物理存储或获取传入连接。它包含了运行所需的所有内容：操作系统、软件包、运行时、文件、环境变量、标准输入和输出。\n\
  \n你典型的 Docker 服务器看起来像这样——许多容器的宿主机：\n\n![](img/file11.jpg)\n\n在上面的图中有两个 `app2` 容器是正常的：这通常发生在服务器同时托管发布版本和测试版本时。这意味着你可以在同一台服务器上托管这两个版本。事实上，每个容器都有自己的\
  \ `ID`，但我们现在先保持简单。\n\n任何运行的 `container` 都是从 `image (镜像)` 创建的。`image` 描述了创建 `container`\
  \ 所需的所有内容：它是容器的模板。你可以从单个 `image` 创建任意数量的容器。\n\n整个蓝图如下：\n\n![](img/file12.jpg)\n\n\
  `Images (镜像)` 存储在 `registry (仓库)` 中。在上面的示例中，`app2` 镜像被用于创建两个容器。每个容器都有自己的生命，它们都共享一个公共根节点：来自\
  \ `registry` 的镜像。\n\n在接下来的章节中，你将学习如何从现有镜像运行容器，然后将学习创建自己的镜像并将其上传到仓库。\n\n## 5. 使用\
  \ Docker 镜像\n\n### 5.1 动手实践：运行容器\n\n在命令行中运行以下命令：\n\n```\ndocker run hello-world\n\
  ```\n\n你可以看到以下文本输出：\n\n![](img/file13.jpg)\n\n恭喜，你刚刚运行了第一个容器！以下是详细过程说明：\n- 你的命令请求\
  \ Docker 根据 `hello-world` 镜像创建并运行一个容器。\n- 由于磁盘上原本没有 `hello-world` 镜像，Docker 从默认仓库\
  \ `Docker Hub` 下载了它。关于它的更多信息将在稍后介绍。\n- Docker 于 `hello-world` 镜像创建了一个容器。\n- `hello-world`\
  \ 镜像规定启动时应向控制台输出一些文本，因此这就是你在容器运行时看到的这些文本。\n- 容器停止了。\n\n以下是你所的操作（经过简化处理）：\n\n![](img/file14.jpg)\n\
  \n如果你再次运行完全相同的命令，你会发现除了步骤 2 之外，所有步骤都重复了：由于镜像已存在于你的机器上，因此不会被再次下载。这是一个简单的优化，但你以后会看到\
  \ Docker 优化了更多步骤。因此，Docker 极少消耗机器资源。\n\n### 5.2 容器管理命令\n\n你可以通过命令行使用 `--help` 选项获取\
  \ Docker 命令的帮助。例如，为了了解更多关于我们刚刚使用的 `docker run` 命令，你可以输入：\n\n```\ndocker run --help\n\
  ```\n\n你可以使用以下命令进行容器管理：\n- `docker ps`：列出仍在运行的容器。添加 `-a` 参数查看已停止的容器。\n- `docker\
  \ logs`：检索容器的日志，即使它已停止也是如此。\n- `docker inspect`：获取运行中或停止容器的详细信息。\n- `docker stop`：停止仍在运行的容器。\n\
  - `docker rm`：删除容器。\n\n### 5.3 动手实践：事后检查\n\n我们之前运行的容器停止了是因为它的任务只是输出文本。我们很快就会运行更多容器，但让我们通过这个停止的容器来熟悉容器工具。\n\
  \n在命令行中运行以下命令：\n\n```\ndocker ps\n```\n\n没有输出，因为机器上没有正在运行的容器。现在在命令行中运行以下命令：\n\n\
  ```\ndocker ps -a\n```\n\n你应该能看到类似下面的输出（具体的容器 ID 会不同）：注意容器 ID。它允许你对该容器运行命令。运行以下命令（将\
  \ ID 替换为你的容器 ID）：\n\n```\ndocker logs 48f673b3\n```\n\n该命令输出与你运行容器时看到的完全相同。这是容器的标准输出。在现实场景中，你会会有后台运行的容器（例如\
  \ Web 服务器），该命令允许你查看它们的输出。\n\n运行以下命令（将 ID 替换为你的容器 ID）：\n\n```\ndocker inspect 48f673b3\n\
  ```\n\n这可以让你关于容器许多方面的大量信息——它是仍在运行还是已停止。同样，在现实场景中，这对于理解容器内部发生了什么可能有用。\n\n所有这些信息占用空间，当你完全不再一个停止的容器时，你可能想要回收这些空间。这就是\
  \ `docker rm` 命令的作用。\n\n运行以下命令（将 ID 替换为你的容器 ID）：\n\n```\ndocker rm 48f673b3\n```\n\
  \n现在你可以通过上述命令来确认该容器已不存在：\n\n```\ndocker ps -a\n```\n\n\n\n\n\n```\ndocker logs 48bab7f673b3\n\
  docker inspect 48bab7f673b3\n```\n\nDocker 已经不再识别该容器了：\n\n![](img/file15.jpg)\n\n\
