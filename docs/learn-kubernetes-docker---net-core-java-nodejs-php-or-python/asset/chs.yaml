  docker stop 8451\ndocker rm 8451\n```\n\n## 总结\n\n你注意到了吗？我们现在等同于获得了一台全新的服务器，在上面安装任何我们需要的软件，并随时随地将其丢弃。\n\
  \n我特别喜欢容器的一点是，它们允许我使用任何软件而不会污染我的机器。通常情况下，在你的机器上尝试新软件之前你会犹豫不决，因为这意味着要安装几个依赖项，这些依赖项可能会与现有软件冲突，而且如果你改变主意并卸载主软件，这些依赖项仍会遗留。得益于容器，我甚至可以尝试大型服务器软件而不污染我的机器。\n\
  \n让我运行一个 Jenkins 服务器来证明这一点。Jenkins 是一个用 Java 编写的完整持续集成服务器。得益于 Docker，我不需要在机器上安装\
  \ Java 或任何依赖项就可以运行 Jenkins 服务器。Jenkins 默认在端口 `8080` 上监听，所以我只需要输入：\n\n```bash\ndocker\
  \ run -p 8088:8080 jenkins\n```\n\n注意，我可以添加 `-d` 选项，因为这是一个长时间运行的进程。然而，我在这里没有使用它，因为我想直接看到详细的输出。对于实际部署，我将使用\
  \ `-d` 选项，并在需要时使用 `docker logs` 命令检查输出。\n\n然后，我可以将浏览器指向 `http://localhost:8088`\
  \ 并完成设置：\n\n![](img/file25.jpg)\n\n我得到了一个功能完整的 Jenkins：\n\n![](img/file26.jpg)\n\
  \n如果我决定不再继续 Jenkins 并尝试另一个持续集成服务器，我只需运行 `docker stop` 和 `docker rm` 命令即可。我也可以通过通过使用另一个端口再次执行\
  \ `docker run` 命令来运行两个独立的 Jenkins 服务器。\n\n这种极低资源成本的隔离性和易用性是容器的巨大优势。现在你已经看到了在单台开发人员机器上管理服务器软件变得多么简单，想象一下这在服务器机器上将有多强大。得益于容器，DevOps\
  \ 中的运维（Ops）部分变得顺畅无比。\n\n在使用此类镜像时，你可能会好奇数据存储在哪里。Docker 使用卷（volumes）来实现这一点，我们将在本章节后面的部分介绍卷。此外，可能需要数据库来存储数据，那些也可以运行在容器中。目前，不要担心这些，因为我们需要先学习其他内容。\n\
  \n## 5.6 练习题 - 运行服务器容器\n\n在容器中运行 Nextcloud 服务器。你需要使用的镜像是 `nextcloud`，它默认在端口 `80`\
  \ 上监听。\n\n确保你可以使用浏览器访问 Nextcloud 实例。\n\n完成后，停止并删除容器。检查浏览器中是否已无法访问 Nextcloud 实例。\n\
  \n关于 Nextcloud 容器的更多信息可以从此处找到 。\n\n## 5.7 练习题答案\n\n打开命令行。\n\n运行以下命令：\n\n```bash\n\
  docker run -d -p 8086:80 nextcloud\n```\n\n注意显示的容器 ID 的开头部分。\n\n打开浏览器并指向 `http://localhost:8086`\n\
  \n你应该能看到提示你创建账户的登录页面。输入你想要的用户名和密码，然后点击 Finish（完成）。\n\n你应该能看到 Nextcloud 首页。\n\n切换回命令行。\n\
  \n运行以下命令：\n\n```bash\ndocker stop <id>\ndocker rm <id>\n```\n\n关闭浏览器。\n\n## 5.8\
  \ 使用卷\n\n在使用此类镜像时，你可能会好奇数据存储在哪里。Docker 使用卷（volumes）来实现这一点，我们将在本章节后面的部分介绍卷。此外，可能需要数据库来存储数据，那些也可以运行在容器中。目前，不要担心这些，因为我们需要先学习其他内容。\n\
  \n容器是瞬态的，这意味着任何写入其内部的数据在容器停止时都会丢失。为了持久化数据，我们使用卷。卷允许我们将容器内部的目录映射到宿主机上的目录。这确保了即使容器被删除，数据依然存在。\n\
  \n我们使用 `-v` 选项来映射卷。例如：\n\n```bash\ndocker run -v /host/dir:/container/dir image\n\
  ```\n\n在这个示例中，`/host/dir` 是主机上的路径，而 `/container/dir` 是容器内的路径。我们还可以使用命名卷：\n\n```bash\n\
  docker run -v volume_name:/container/dir image\n```\n\n命名卷由 Docker 管理，比绑定挂载（bind\
  \ mounts）更易用。\n\n## 5.9 镜像从哪里来？\n\n每个容器都是从镜像创建的。你向 `docker run` 命令提供镜像名称。Docker\
  \ 首先在本地查找镜像，如果存在则使用它。如果镜像不存在，则将从注册表（registry）下载。\n\n![](img/file27.png)\n\n你可以使用以下命令列出本地镜像：\n\
  \n```bash\ndocker images\n```\n\n当镜像发布到注册表时，它的名称必须是：`repository_name/name:tag`\n\
  \n`tag` 是可选的。如果缺失，它被视为 `latest`。`repository_name` 可能是注册表的 DNS 或像 Docker Hub 这样的注册表名称。我们很快就会看到更多关于\
  \ Docker Hub 和私有仓库的内容。我们现在使用的所有镜像都是从 Docker Hub 下载的，因为它们不是 DNS 名称。\n\n例如，可以在这里找到\
  \ Jenkins 镜像 。\n\n虽然 `docker run` 命令会自动下载镜像，但你可能想手动触发下载。你可以直接使用 `docker pull` 命令。`pull`\
  \ 命令将强制下载镜像，无论其是否已经存在。使用 `pull` 命令的相关场景包括：\n\n- 你预计运行容器的机器在运行时无法访问注册表（例如没有互联网连接）；\n\
  - 你想确保拥有标记为 `latest` 的镜像的最新版本。\n\n## 6. 创建 Docker 镜像\n\n正如我们之前看到的，容器是从镜像创建的。到目前，我们一直在使用他人创建的镜像。现在是时候学习创建自己的镜像了。在我们的镜像中，我们可以放入程序及其依赖项，这样就可以从这些镜像创建许多容器并长期运行。\n\
  \n### 6.1 创建简单的镜像\n\n![](img/file28.png)\n\nDocker 镜像是通过 `docker build` 命令和 `Dockerfile`\
  \ 文件创建的。`Dockerfile` 文件包含了说明如何构建镜像的指令。\n\n`Dockerfile` 文件可以有任何名称。命名为 `Dockerfile`\
  \ 可以让其他人看到项目中的该文件时更容易理解其用途，并且意味着我们在使用 `docker build` 命令时不需要指定文件名。\n\n我想创建一个基础镜像，该容器在运行时显示“hello\
  \ world”消息。\n\n\n\n为此，我创建了一个名为 `Dockerfile` 的文件，它描述了如何构建我的镜像。`Dockerfile` 文件始终以\
  \ `FROM` 指令开始，因为镜像是基于另一个基础镜像的。这是一个强大的功能，因为它允许你扩展可能已经很复杂的镜像。\n\n对于我简单的文本输出需求，我可以使用\
  \ Debian Linux 镜像。这里是我的 `Dockerfile` 文件：\n\n```dockerfile\nFROM debian:8\n```\n\n\
  这还远远不够。我确实获得了一个 Debian Linux 基础环境，但我没有运行任何可以显示“hello world”的命令。这可以通过 `CMD` 指令来实现。`CMD`\
  \ 指令规定了在使用你的镜像创建容器时会运行哪个可执行文件，并提供了可选参数。\n\n这里有一个改进后的 `Dockerfile` 文件，它创建了一个基于 Debian\
  \ Linux 的镜像，并指示它在容器启动时问候我们的用户：\n\n```Dockerfile\nDockerfile\nFROM debian:8\nCMD\
  \ [\"echo\", \"Hello world\"]\n```\n\n注意，要运行的程序及其参数是以字符串字符串数组的形式提供的。\n\n为了从我的 `Dockerfile`\
  \ 文件创建镜像，我需要运行 `docker build` 命令。因此，我在终端中进入 `Dockerfile` 文件所在的文件夹，输入以下命令：\n\n```bash\n\
  docker build -t hello .\n```\n\n`-t` 切换开关用在所需的镜像之前。事实上，镜像可以在没有名称的情况下创建（它将只有一个生成的唯一\
  \ ID），因此它是 `docker build` 命令的一个可选参数。\n\n注意上述命令末尾的点。它指定了使用哪个路径作为构建上下文（稍后会详细介绍），以及在何处寻找\
  \ `Dockerfile`。如果我的 `Dockerfile` 有另一个名称或位于其他地方，我可以添加 `-f` 切换开关来提供文件路径。\n\n`docker\
  \ build` 命令刚刚创建了一个名为 `hello` 的镜像。该镜像存储在我的本地计算机上，我可以像运行任何其他镜像一样运行它：\n\n```bash\n\
  docker run --rm hello\n```\n\n如所预期，上面的 `docker run` 命令简单地打印了消息：\n\n![](img/file29.png)\n\
  \n从那里开始，你可能想要发布你的镜像，以便他人运行基于它的容器。我们将在“发布 Docker 镜像”章节中学习如何这样做，但现在我想告诉你们更多关于创建镜像的知识。\n\
  \n为了让事情变得非常清晰，以下是我所做的：\n\n- 创建了一个镜像：\n- 创建了一个名为 `Dockerfile` 的文件\n- 运行了 `docker\
  \ build` 命令\n- 从创建的镜像运行了一个容器。\n\n我想再次强调一下这意味着：运行容器在虚拟上等同于启动一台全新的机器然后将其丢弃。我的意思是，为了打印那条“Hello\
  \ world”消息，我们虚拟上获得了一台新电脑，让它执行了 `echo` 命令，然后把它丢掉。Docker 让“发后即忘”的计算变得廉价。当然，对于如此简单的目的来说，这完全是大材小用，但即使当我们安装框架或在容器内部移动文件时，这一点仍然成立：这是一个极佳的功能，当你理解了如何轻松地创建和销弃隔离的虚拟计算机时，你将获得大部分\
  \ Docker 的力量。\n\n## 6.2 创建包含文件的镜像\n\n我们刚刚创建的镜像不需要基础镜像已经包含的任何内容，这就是为什么我们的 `Dockerfile`\
  \ 文件如此简单。但在现实世界的场景中，我很可能想要文件成为我创建的镜像的一部分。\n\n假设我的磁盘上有一个名为 `index.html` 的文件，内容如下：\n\
  \n```html\nindex.html\n<html>\n<body>\n  <h1>Hello !</h1>\n  <div>I’m hosted by\
  \ a container.</div>\n</body>\n</html>\n```\n\n我想创建一个包含 Web 服务器的镜像，该服务器将通过 HTTP\
  \ 提供此页面。NGINX 是一个很好的选择。我可以继续使用 debian 基础镜像，并在我的 `Dockerfile` 文件中添加安装 NGINX 的指令，但基于已经配置并测试过的镜像进行工作更容易。Docker\
  \ Hub 包含一个 NGINX 镜像，其中 NGINX 已经安装并配置为提供 `/usr/share/nginx/html` 目录下的文件。\n\n我在与 HTML\
  \ 文件相同的文件夹中创建了以下 `Dockerfile` 文件：\n\n```Dockerfile\nFROM nginx:1.15\nCOPY index.html\
  \ /usr/share/nginx/html\n```\n\n除了 `nginx` 基础镜像外，你还可以看到一个 `COPY` 指令。它的第一个参数是从构建上下文拷贝的文件，第二个参数是镜像内部的目标目录。\n\
  \n构建上下文基本上是你提供给 `docker build` 命令的目录。它的内容可供 `COPY` 指令使用，但仅在镜像构建过程中可用。这意味着它仅对 `Dockerfile`\
  \ 文件中的指令可用，除非你使用 `COPY` 指令，否则来自该目录的文件不会成为构建镜像（以及从该镜像启动的容器）的一部分。这就是为什么我们有一个 `COPY`\
  \ 指令的原因：我们希望 `index.html` 文件成为我们创建的镜像内部 `/usr/share/nginx/html` 目录的一部分。\n\n你可能注意到，这次\
  \ `Dockerfile` 文件没有包含 `CMD` 指令。记住，`CMD` 指令规定了从我的镜像创建容器时应该运行哪个可执行文件，所以我没有包含运行 NGINX\
  \ 服务器的 `CMD` 指令这似乎很奇怪。没错。我没有包含 `CMD` 指令是因为基础 `nginx:1.15` 镜像已经包含了这样一个运行 NGINX 服务器的\
  \ `CMD` 指令，所以它是我镜像的一部分，只要我不想在容器启动时运行另一个可执行文件，就不需要包含自己的 `CMD` 指令了。\n\n回到创建我们的 HTTP\
  \ 服务器镜像，我在 `index.html` 和 `Dockerfile` 文件所在的文件夹内打开命令行，并运行以下命令：\n\n```Dockerfile\n\
  Dockerfile\n```\n\n```bash\ndocker build -t webserver .\ndocker run --rm -it -p\
  \ 8082:80 webserver\n```\n\n这些命令根据 `Dockerfile` 指令构建了一个 `webserver`，然后启动了一个监听我机器\
  \ 80 端口的容器。我可以启动浏览器并将其指向 `http://localhost:8082`。这显示了 HTML 文件的内容，因为它们是由运行中的容器提供的：\n\
  \n在命令行中，我看到来自 NGINX 的日志，证明它收到了来自浏览器的 HTTP 请求：\n\n```\n172.17.0.1 - - [.../2019:21:46\
  \ +0000] \"GET / HTTP/1.1\" 304 0 \"-\" \"-\"\n```\n\n在运行容器时，我添加 `--rm` 和 `-it`\
  \ 开关仅仅是为了演示。在现实生活中，服务器容器将长时间运行，因此我会不带这些开关运行它。以下是我使用这些开关的原因：\n\n- `-it` 允许我通过命令行使用\
  \ Ctrl-C 停止容器；\n- `--rm` 确保容器在停止后被删除。\n\n## 6.3 镜像本地创建\n\n当我运行 `docker build` 命令从\
  \ `Dockerfile` 创建镜像时，生成的镜像存储在运行 `docker build` 命令的本地计算机上。这允许我从本地创建的镜像运行任意数量的容器，但可能我希望其他计算机也能运行我创建的镜像的容器。我们将在下一节学习如何这样做。\n\
  \n可以通过运行以下命令查看本地计算机上可用的镜像：\n\n```bash\ndocker image ls\n```\n\n考虑到我之前构建的镜像，我可以看到类似以下的内容：\n\
  \n在本地随时可用镜像使得从它们运行容器变得非常快。然而，将来会有某些镜像是无用的。我可以使用 `docker rmi` 命令并提供镜像名称或 ID 来从我的本地机器上删除它们。\n\
  \n例如，可以使用以下任一命令删除 `webserver:latest` 镜像：\n\n```bash\ndocker rmi c067edac5ec1\ndocker\
  \ rmi webserver:latest\n```\n\n## 6.4 练习 - 构建并运行镜像\n\n创建一个名为 `compute.js` 的文件，包含以下代码，它使用\
  \ JavaScript 计算并显示圆的面积：\n\n```javascript\nvar radius = 2.0 ; var area = Math.pow(radius,\
  \ 2) * Math.PI ; console.log(\n  `Area of a ${radius} cm circle:   ${area} cm²`\n\
  );\n```\n\n\n\n\n创建一个 Docker 镜像，使用包含 Node.JS 的 `node:11-alpine` 镜像来运行这段代码。使用 Node.JS\
  \ 运行 JavaScript 程序的命令是 `node <filename>`。\n\n你可能可以在 `create-docker-images/exercises/jsimage/starter`\
  \ 文件夹中找到 `compute.js` 文件的源代码，并在 `create-docker-images/exercises/jsimage/solution`\
  \ 文件夹中找到解决方案的源代码。\n\n## 6.5 练习题解答\n\n创建一个名为 `Dockerfile` 的文件并向其中添加以下代码：\n\n```docker\n\
  FROM node:11-alpine\nCOPY compute.js .\n\nCMD node compute.js\n```\n\n打开命令行。将当前目录切换到创建\
  \ `Dockerfile` 和 `compute.js` 文件的目录。\n\n运行以下命令：\n\n```bash\ndocker build -t jsimage\
  \ .\n```\n\n一旦镜像构建完成，运行以下命令：\n\n```bash\ndocker run –rm jsimage\n```\n\n你可以看到类似下面的输出：\n\
  \n![](img/file31.png)\n\n## 6.6 标签（Tags）的重要性\n\n我们早之前看到过镜像名称包含一个名称（name）和一个标签（tag）。为了快速回顾这一点，镜像名称的格式为：\n\
  \n`<repository_name>/<name>:<tag>`\n\n`tag` 是可选的。如果缺失，它被认为是 `latest`。\n\n`repository_name`\
  \ 可能是一个注册表的 DNS 或者是 Docker Hub 中某个注册表的名称。\n\n虽然你的镜像没有发布到注册表（这是我们在本章中会做的，但在下一章将会改变），但你不需要包含注册表名称。因此你的镜像名称为：\n\
  \n`<name>:<tag>`\n\n### latest 标签\n\n在我的演示中，我没有包含标签，因此使用了默认的 `latest` 标签。例如，当我运行以下命令时，实际镜像名称为\
  \ `hello:latest`：\n\n```bash\ndocker build -t hello .\n```\n\n只要你创建的是简单的软件，并且运行在简单的\
  \ CI/CD 流水线上，使用 `latest` 标签是可以接受的。在简单的场景下，你可以：\n\n- 更新源代码；\n- 使用 `latest` 标签构建新镜像；\n\
  - 使用最新镜像运行新容器；\n- 杀死之前的容器。\n\n然而，这有一个限制：当在远程机器上运行 `docker run hello` 命令时（实际上意味着\
  \ `docker run hello:latest`），远程机器无法得知是否有更新版本的 `hello:latest` 镜像，因此你需要在远程机器上运行 `docker\
  \ pull hello`，以便将镜像的最新版本下载到该机器上。\n\n这听起来可能很麻烦，这也是不只使用 `latest` 标签的原因之一。\n\n### 为什么要给镜像打标签？\n\
  \n一旦你开始认真对待 CI/CD 流水线，很快就会出现其他原因。例如，你可能想要实现以下功能或全部：\n\n- 如果发现最新镜像存在问题，可以回滚到之前的版本；\n\
  - 在不同的环境中运行不同的版本，例如在测试环境中运行 `latest` 版本，在生产环境中运行上一个版本；\n- 同时运行不同版本，将某些用户路由到最新版本，将部分用户路由到之前的版本（金金丝发布\
  \ canary release）；\n- 为不同用户部署不同版本，并在支持他们时，可以在你的开发机上运行任何版本。\n\n这些都是给镜像打标签的充分理由。如果你确保每个发布的镜像都有不同的标签，你就可以运行上述任何场景。\n\
  \n你可以随心所欲为镜像标记标签。常见的标签包括：\n\n- 版本号，例如 `hello:1.0`, `hello:1.1`, `hello:1.2`\n- Git\
  \ 提交标签，例如 `hello:2cd7e376`, `hello:b43a14bb`\n\n为了应用标签，只需在构建命令中指定它即可：\n\n```bash\n\
  docker build -t hello:1.0 .\n```\n\n### 基础镜像的标签\n\n记住你的镜像是基于其他镜像的。这是通过在 `Dockerfile`\
  \ 文件中使用 `FROM` 指令实现的。正如你可以给自己的镜像打标签一样，你使用的基础镜像可能是 `latest`，也可以是带标签的。\n\n在我的演示中使用了带标签的镜像。例如，我的服务器镜像基于\
  \ `nginx:1.15` 基础镜像。将你的镜像基于最新版本是非常具有吸引力的，因为这样你始终运行在最新的软件上，尤其是这非常简单：你只需要省略标签或指定 `latest`\
  \ 即可。因此，你可能想在 `Dockerfile` 文件中使用以下指令：\n\n```dockerfile\nFROM nginx:latest\n```\n\
  \n不要这样做。首先，这并不意味着运行的任何容器将基于 `nginx` 镜像的最新可用版本。Docker 是关于可复现的镜像，因此最新版本是在你构建镜像时评估的，而不是在运行容器时。这意味着除非你再次运行\
  \ `docker build` 命令，否则版本不会改变。\n\n其次，你可能会遇到麻烦。如果 `nginx` 镜像发布了带有破坏性更改（breaking changes）的新版本怎么办？如果你再次构建镜像，可能会得到一个损坏的镜像。\n\
  \n出于这些原因，我建议指定镜像标签。如果你想跟上基础镜像的新发布，请手动更新标签，并确保在发布之前测试你的镜像。\n\n## 6.7 作为环境变量的参数\n\n\
  在现实生活中，容器的输入和输出可能会根据环境而变化。例如，当你运行一个程序时，它可能会连接到某个数据库。\n\n### 读取值\n\n无论使用什么技术，你都可以访问环境变量。在，在运行时，你可以设置环境变量。\n\
  \n### 提供值\n\n要在运行时提供环境变量，你只需使用 `-e=value` 参数。\n\n### 默认值\n\n你可能还想为环境变量定义一个默认值。这可以通过\
  \ `Dockerfile` 文件中的 `ENV` 指令完成。例如：\n\n```dockerfile\nENV name=Dockie\n```\n\n为镜像期望的每个环境变量添加\
  \ `ENV` 指令是良好的实践。\n\n### 示例用法\n\n我想创建一个可以 ping 任何站点的镜像。我将使用 Linux 脚本来实现。我在 `ping.sh`\
  \ 文件中定义它：\n\n```sh\n#!/bin/sh\necho “Pinging $host …”\nping -c 5 $host\n```\n\n\
  注意我使用了环境变量 `host`。我将定义一个包含并运行该脚本的镜像：\n\n```dockerfile\nFROM debian:8\nENV host=www.google.com\n\
  COPY ping.sh .\nCMD [\"sh\", \"ping.sh\"]\n```\n\n注意我的 `Dockerfile` 文件包含一个 `ENV`\
  \ 指令，指定在缺失时 `host` 将为 `www.google.com`。我通过运行 `docker build` 命令从该 `Dockerfile` 文件创建镜像：\n\
  \n```bash\ndocker build -t pinger .\n```\n\n接下来，基于该镜像运行两个容器：\n\n```bash\ndocker\
  \ run –rm pinger\ndocker run –rm -e host=www.bing.com pinger\n```\n\n第一个没有为 `host`\
  \ 环境变量提供任何值，因此它默认为使用 `Dockerfile` 文件中指定的 `www.google.com` 值。第二个容器被提供了 `www.bing.com`\
  \ 值。这里是这两个容器的输出（为了简洁进行了了短）：\n\n```text\nC:>docker run –rm pinger\nPinging www.google.com…\n\
  PING www.google.com (172.217.18.196) 56(84) bytes of data\n64 bytes from par10s38-in-f4.1e100.net\
  \ (172.217.18.196)\\\nicmp_seq=1 ttl=37 time=6.52 ms\n...\n64 bytes from par10s38-in-f4.1e100.net\
  \ (172.217.18.196)\\\nicmp_seq=5 ttl=37 time=7.35 ms\n```\n\n\n\n\n```\n5 packets\
  \ transmitted, 5 received, 0% packet loss, time\n4005ms\nrtt min/avg/max/mdev =\
  \ 5.632/7.854/11.031/1.890 ms\n\nC:>docker run –rm -e host=www.bing.com pinger\n\
  \nPinging www.bing.com…\n\nPING dual-a-0001.a-msedge.net (204.79.197.200) 56(84)\
  \ bytes of data.\n\n64 bytes from a-0001.a-msedge.net (204.79.197.200): icmp_seq=1\
  \ ttl=37 time=7.82 ms\n[...]\n64 bytes from a-0001.a-msedge.net (204.79.197.200):\
  \ icmp_seq=5 ttl=37 time=8.08 ms\n\n— dual-a-0001.a-msedge.net ping statistics —\n\
  \n5 packets transmitted, 5 received, 0% packet loss, time\n4005ms\nrtt min/avg/max/mdev\
  \ = 7.820/8.669/10.193/0.954 ms\n```\n\n你可以看到，根据提供它们的值，每个容器都探测了不同的主机。这是一个简单的演示，但你可以提供更高级的值。通常情况下，你会提供完整的连接字符串、其他服务的\
  \ URL、用户名和密码等。这是一个灵活且强大的功能，因为一旦你开始使用编排器，这些值可能来自许多来源。\n\n## 6.8 练习 - 允许镜像参数化\n\n\
  在 `create-docker-images/exercises/jsparam/starter` 文件夹中，你会找到一个 `compute.js` 文件，其代码如下：\n\
  \n```javascript\nvar radius = process . env . diameter / 2 ; var area = Math . pow\
  \ ( radius , 2 ) * Math . PI ; console . log (\n`Area of a ${ radius } cm radius\
  \ disk:     ${ area } cm²` );\n```\n\n它是之前练习中代码的修改版本。它期望一个 `diameter` 环境变量可用，并显示给定直径的磁盘面积。创建一个包含\
  \ Node.JS 的 `node:11-alpine` 镜像来运行此代码的 Docker 镜像。运行两个具有不同 `diameter` 值的容器。\n\n解决方案的源代码可以在\
  \ `create-docker-images/exercises/jsparam/solution` 文件夹中找到。\n\n## 6.9 练习解答\n\n创建一个名为\
  \ `Dockerfile` 的文件并将以下代码添加到其中：\n\n```dockerfile\nFROM node:11-alpine\nENV diameter=4.0\n\
  COPY compute.js .\nCMD node compute.js\n```\n\n打开命令行。将当前目录更改到你创建 `Dockerfile` 和\
  \ `compute.js` 文件的目录。运行以下命令：\n\n```bash\ndocker build -t jsparam .\n```\n\n一旦构建好镜像，运行以下命令：\n\
  \n```bash\ndocker run –rm jsparam\ndocker run –rm -e diameter=5.0 jsparam\n```\n\
  \n你可以看到类似所示的输出：\n\n```bash\nC:>docker run –rm jsparam\nArea of a 2 cm radius disk:\n\
  \    12.566370614359172 cm2\n\nC:>docker run –rm -e diameter=5.0 jsparam\nArea of\
  \ a 2.5 cm radius disk:\n    19.634954084936208 cm2\n```\n\n## 6.10 存储\n\n正如我们在“使用卷”章节中看到的，你最好创建导致无状态容器的镜像，依赖于外部数据存储。然而，有时你需要将数据存储在持久文件系统中。当这种需要出现时，使用如下\
  \ `VOLUME` 指令：\n\n```dockerfile\nVOLUME /path/to/directory\n```\n\n`/path/to/directory`\
  \ 是镜像内部使用的目录路径。当使用 `docker run` 命令创建容器时，可以使用 `-v` 选项将此目录映射到主机系统上的实际卷。这仅仅是一个指示。默认情况下，如果用户没有将此卷映射到容器的外部存储器，则数据将存储在容器内部。\n\
  \n## 6.11 网络\n\n当你的镜像托管服务器软件时，它会在一个或多个端口上监听。例如，HTTP 服务器通常监听在 TCP 端口 80。你可以使用 `EXPOSE`\
  \ 指令明确表示这一点：\n\n```dockerfile\nEXPOSE 80\n```\n\n使用此指令纯粹是为了文档目的。事实上，当从该镜像创建容器时，它**不会**将该端口开放到外部。任何创建容器的人都需要使用\
  \ `docker run` 命令的 `-p` 选项显式将该端口绑定到主机的实际端口上。如果忘记了，这就是我们在“等待入站网络连接”章节中看到的。\n\n那么为什么要使用\
  \ `EXPOSE` 指令呢？再次，它仅用于文档目的：它让想要从你的镜像运行容器的人知道，他们应该使用 `docker run` 命令的 `-p` 选项将哪些端口重定向到外部。\n\
  \n## 6.12 了解更多\n\nDocker 维护了可以在 `Dockerfile` 文件中使用的指令的参考。你可以在这里找到它。\n\n## 7 发布镜像\n\
  \n### 7.1 发布的理由\n\n当你创建一个镜像时，你需要一个仓库来发布它：![](img/file32.png)\n\n在机器上拥有镜像有两种方式：\n\
  - 使用正确的前缀构建镜像（`docker build`）；\n- 给现有的镜像打标签（`docker tag`）；\n\n无论你选择哪个仓库，标签过程都是相同的。\n\
  \n### 7.2 仓库\n\nDocker 仓库基本上是一个存储器，提供以下功能：\n- 存储各种镜像；\n- 为同一镜像存储各种标签；\n- 一个允许从机器推送镜像或为容器拉取镜像的\
  \ API；\n- 使用 TLS 连接 API 以防止中间人攻击。\n\n有很多仓库可用。你可以使用公共 Docker Hub，也可以使用自己的私有仓库。\n\n\
  ### 7.3 发布镜像\n\n无论选择哪个仓库，发布镜像都是一个三步骤的过程：\n1. 使用正确的前缀构建镜像或打标签；\n2. 登录仓库（`docker login`）；\n\
  3. 将镜像推送到仓库（`docker push`）。\n\n![](img/file33.png)\n\n### 7.4 Docker Hub\n\nDocker\
  \ Hub 是由 Docker Inc 提供的 Docker 仓库。它允许无限存储公共镜像，并提供付费计划托管你的私有镜像。公共镜像可以被他人访问，这正是你希望让软件广泛传播所需的，而非内部软件。\n\
  \n为了在 Docker Hub 上发布镜像，你需要创建一个账户。为此，我访问 https://hub.docker.com/ 并点击 Sign Up 链接。我选择的\
  \ Docker ID 将是我发布到 Docker Hub 的镜像的前缀。在创建账户时，确保选择正确的 ID，因为它是你镜像名称的一部分。假设你的 ID 名称为\
  \ `short-name`，你的镜像应该标记为：\n\n`<short_name>/<name>:<tag></tag></name></short_name>`\n\
  \n对于这本书，我创建了 `learnbook` 账户，我想发布之前创建的 webserver 镜像。只需正确命名并将其推送到仓库即可。有两种方法：\n\n第一种是使用正确的名称再次运行\
  \ `docker build` 命令。当你从开始使用它时这是一个很好的选择，但如果我现在这样做，会导致我的磁盘上产生两个独立的镜像 - 内容相同但名称和 ID\
  \ 不同。这不是一个好主意。\n\n\n\n\n\n我的第二个选择要好得多：使用 `docker tag` 命令。Docker 镜像可以根据需要拥有多个名称，通过\
  \ `docker tag` 命令，可以将所有这些名称都添加到已有的镜像中。`docker tag` 不会复制镜像（这与再次运行 `docker build`\
  \ 不同）。\n\n`docker tag` 命令接受两个参数：第一个是现有镜像的名称，第二个是你想要添加到该镜像上的新名称。\n\n```\ndocker tag\
  \ webserver learnbook/webserver\n```\n\n现在我的机器上可以通过两个名称识别的同一个 Docker 镜像：`webserver`\
  \ 和 `short_name/webserver`。如果我运行 `docker image ls` 命令，它将以两行的形式显示：注意，这两行的镜像 ID（Image\
  \ ID）是相同的，这意味着在我的机器上实际上只有一个镜像，只是以不同的名称存在。\n\n现在我的镜像已经命名正确，我可以将其发布到 Docker Hub 了。这只需要运行两个命令：\n\
  \n```\ndocker login\ndocker push learnbook/webserver\n```\n\n`docker login` 命令会以交互方式要求输入我的\
  \ Docker Hub 凭据，但我也可以将它们作为参数传递给命令。\n\n`docker push` 命令足够智能，它只会推送与我使用的基础 nginx 镜像不同的部分，因为它已经存储在\
  \ Docker Hub 中，如输出所示：\n\n```\nThe push refers to repository [docker.io/learnbook/servers]\n\
  0f83d7865e1e: Pushed\n6b5e2ed60418: Mounted from library/nginx\n92c15149e23b: Mounted\
  \ from library/nginx\n0a07e81f5da3: Mounted from library/nginx\nlatest: digest:\
  \ sha256:e8597…1ae0b1efb1 size: 1155\n```\n\n就是这样！Docker Hub 现在托管了我的镜像，供所有人查看和运行。每个人都能看到我的镜像，因为它是公开的。如果我不想向全世界共享它，可以将其设置为私有。\n\
  \n### 7.5 在另一台机器上运行镜像\n\n这是一个极其简单的过程。事实上，你已经知道怎么做了：使用 `docker run` 命令。或者先用 `docker\
  \ pull` 获取镜像，然后用 `docker run` 使用它（这在你计划在运行容器之前断开网络连接时非常有用）。\n\n事实上，你可以在自己的机器上尝试一下（需已安装\
  \ Docker Engine 或 Docker Desktop）。运行以下命令：\n\n```\ndocker run –rm -it -p 8085:80\
  \ learnbook/webserver\n```\n\n然后打开浏览器并访问到以下 URL，查看该容器如何通过 HTTP 提供我的网页。\n\n`http://localhost:8085`\n\
  \n这不酷吗？一个无痛的交付系统。\n\n这有一个小变体。如果你想运行存储在私有仓库（private registry）中的镜像，首先需要使用 `docker\
  \ login` 命令登录仓库。完成后，你就可以 `docker pull` 镜像。如果你以后想用该镜像运行另一个容器，就不需要再次登录，因为镜像已经存储在你的机器上了。\n\
  \n### 7.6 练习 - 发布镜像并在另一台机器上运行容器\n\n1. 在 `https://hub.docker.com/` 上一个 Docker ID。\n\
  2. 将你的 `jsparam` 镜像发布到 Docker Hub。\n3. 找另一台运行 Docker Engine 或 Docker Desktop 的机器，并根据发布的\
  \ `jsparam` 镜像创建两个容器，以计算直径为 3.5 cm 和 1.5 cm 的圆的面积。\n\n### 7.7 练习解答\n\n使用浏览器访问 `https://hub.docker.com/`\
  \ 并点击 `Sign Up` 链接。用你想要的 Docker ID 创建账户（在本解答的剩余部分中，我们假设它是 `learnbook`，但请替换为你自己的）。\n\
  \n打开命令行。运行以下命令：\n\n```\ndocker tag jsparam learnbook/jsparam\ndocker login -u learnbook\
  \ -p <your-password>\ndocker push learnbook/jsparam\n```\n\n找另一台运行 Docker Engine\
  \ 或 Docker Desktop 的机器并打开命令行。运行以下命令：\n\n```\ndocker run –rm -e diameter=3.5 learnbook/jsparam\n\
  docker run –rm -e diameter=1.5 learnbook/jsparam\n```\n\n你应该会得到如下输出：\n\n```\n> docker\
  \ run –rm -e diameter=3.5 learnbook/jsparam\nUnable to find image ‘learnbook/jsparam:latest’\
  \ locally\nlatest: Pulling from learnbook/jsparam\nDigest: sha256:a80621fe…328f3\n\
  Status: Downloaded newer image for learnbook/jsparam:latest\nArea of a 1.75 cm radius\
  \ disk:\n    9.62112750161874 cm²\n\n> docker run –rm -e diameter=1.5 learnbook/jsparam\n\
  Area of a 0.75 cm radius disk:\n    1.7671458676442586 cm²\n```\n\n### 7.8 私有仓库\n\
  \n公共仓库是共享 Docker 镜像的方便方式，但你可能想将某些镜像留给公司、你自己或某个组织。私有仓库确保你可以保持你的私有镜像……私有。\n\n当我们使用\
  \ `docker push` 命令将镜像发布到 Docker Hub 时，私有仓库确保你可以保持你的私有镜像……私有。（注：此处原文似乎重复提了 Docker\
  \ Hub）。当我们将镜像发布到 Docker Hub 时，在私有仓库，你首先需要使用 `docker login` 命令登录仓库。完成后，你就可以 `docker\
  \ pull` 镜像。如果你以后想用该镜像运行另一个容器，就不需要再次登录，因为镜像已经存储在你的机器上了。\n\n### 7.9 大小很重要\n\n当你创建镜像时，你希望它尽可能小，原因有许多：\n\
  - 减少拉取和推送时间；\n- 节省空间；\n- 在运行容器的机器上，你希望减小镜像的大小。\n\n为了减小镜像的大小，你需要理解它受哪些因素影响：\n- 镜像包含的文件；\n\
  - 基础镜像的大小；\n- 层。\n\n#### 镜像包含的文件\n\n在镜像中包含必要的文件。这可能显而易见，但很容易包含不需要的文件。\n\n首先，避免过于宽泛的\
  \ `COPY` 指令。一个典型的例子是：\n```\nCOPY .\n```\n\n尽量精确。如果有必要，将其拆分为分开的 `COPY` 指令，例如：\n```\n\
  COPY ./Project/src/*.ts\nCOPY ./Project/package.json\n```\n\n显然，有时你需要复制整个文件夹的 `COPY`\
  \ 指令，如下：\n```\nCOPY ./js/built /app\n```\n\n但是，你可能想从拷贝中排除文件。可以使用 `.dockerignore`\
  \ 文件来实现。只需在构建上下文的根目录下添加 `.dockerignore` 文件，列出应排除的文件和文件夹，就像 `.gitignore` 文件一样。\n\n\
  这是一个 `.dockerignore` 示例：\n```\n#忽略 .git 文件夹\n.git\n#忽略任何文件夹或子文件夹下的 TypeScript 文件\n\
  **/*.ts\n```\n\n其次，在使用 NPM、NuGet、apt 等包管理器时，确保在构建镜像时运行它们。这会避免将它们作为镜像上下文发送，并允许层缓存系统缓存运行结果。只要定义文件没有更改，Docker\
  \ 就会重用缓存。\n\n#### 基础镜像大小\n\n你在 `FROM` 指令中选择的基础镜像（`Dockerfile` 顶部的指令）是你构建的镜像的一部分。\n\
  \n在某些优化情况下，如果机器已经拉取过该基础镜像，则不需要再次拉取。但通常无法进行此类优化，因此你最好引用较小的基础镜像。\n\n许多可以作为基础的镜像都有更小的变体。例如，我在“创建\
  \ Docker 镜像”章节使用的 `debian` 镜像很大。这是我使用的定义：\n\n```docker\nFROM debian:8\nCMD [\"echo\"\
  , \"Hello world\"]\n```\n\n该定义生成的镜像重量 127 MB（可以使用 `docker image ls` 命令检查大小）。\n\n\
  \n\n\n\n如果我进入该镜像的描述页面，可以看到有一个使用 `8-slim` 标签的较小变体。这是一个优化的定义：\n\n```dockerfile\nFROM\
  \ debian:8-slim\nCMD [\"echo\", \"Hello world\"]\n```\n\n这个修改后的定义生成了一个权重 79.3 MB\
  \ 的镜像。我们刚刚节省了原始镜像 38% 体。\n\n使用 `node:alpine` 镜像代替默认的 `node` 镜像也可以同样的操作。例如，我用于 Web\
  \ 服务器镜像的镜像定义生成了一个 109 MB 的镜像：\n\n```dockerfile\nFROM nginx:1.15\nCOPY index.html\
  \ /usr/share/nginx/html\n```\n\n如果我将基础镜像从 `nginx:1.15` 切换到 `nginx:1.15-alpine`，生成的镜像仅重\
  \ 16.1 MB。这比原始镜像节省了 85%！以下是优化的镜像定义：\n\n```dockerfile\nFROM nginx:1.15-alpine\nCOPY\
  \ index.html /usr/share/nginx/html\n```\n\n### 镜像层 (Image layers)\n\n在创建镜像时，Docker\
  \ 会按顺序读取每条指令，并将生成的部分镜像分开保留：它们被缓存并用一个唯一的 ID 标记。这种缓存非常有效，因为它在镜像生命周期的不同阶段都会使用：\n\n\
  - 在未来的构建中，只要可能，`Docker` 将使用缓存部分而不是重新创建它；\n- 当将镜像的新版本推送到 `Registry` 时，公共部分不会被推送；\n\
  - 当从 `registry` 拉取镜像时，你已拥有的公共部分不会被拉取。\n\n缓存机制可以总结如下：当构建新镜像时，`Docker` 将尽力跳过直到第一个实际更改结果镜像的指令之前的所有指令。所有之前的指令都会导致使用缓存层。让我们来看一些例子。\n\
  \n假设我想创建一个包含 PHP 的镜像，因此我创建了以下 `Dockerfile` 文件：\n\n```dockerfile\nFROM debian:8\n\
  COPY . .\nRUN apt-get update && apt-get upgrade && apt-get dist-upgrade -y\nRUN\
  \ apt-get install -y php5\n```\n\n当我使用 `docker build` 命令构建它时，需要花费相当长的时间，因为两个 `RUN`\
  \ 步骤需要下载文件并对它们进行操作。这是正常且预期的。以下是截断的输出：\n\n```\nStep 1/4 : FROM debian:8\n—> ec0727c65ed3\n\
  Step 2/4 : COPY . .\n—> cb8153c1f09a\nStep 3/4 : RUN apt-get update && apt-get upgrade\
  \ && apt-get dist-upgrade -y\n—> Running in eff335d4aeba\nGet:1 http://security.debian.org\
  \ jessie/updates InRelease [44.9 kB][…]\n[…]\nRemoving intermediate container eff335d4aeba\n\
  —> f4a652ba0849\nStep 4/4 : RUN apt-get install -y php5\n—> Running in d43a7a64606d\n\
  ```\n\n等等，让我们看看输出的剩余：\n\n```\nReading package lists…\nBuilding dependency tree…\n\
  Reading state information…\nThe following extra packages will be installed:\n  apache2\
  \ apache2-bin apache2-data apache2-utils file ifupdown isc-dhcp-client\n  isc-dhcp-common\
  \ krb5-locales libalgorithm-c3-perl libapache2-mod-php5\n[…]\nNeed to get 23.2 MB\
  \ of archives.\nAfter this operation, 88.3 MB of additional disk space will be used.\n\
  Get:1 http://deb.debian.org/debian/ jessie/main libgdbm-3 amd64 1.8.3-13.1 [30.0\
  \ kB]\nGet:2 http://deb.debian.org/debian/ jessie/main libjson-c2 amd64 0.11-4 [24.8\
  \ kB]\n[…]\nPreparing to unpack …/libkrb5support0_1.12.1+dfsg-19+deb8u5_amd64.deb\
  \ …\nUnpacking libkrb5support0:amd64 (1.12.1+dfsg-19+deb8u5)\n…\nSelecting previously\
  \ unselected package libk5crypto3:amd64.\n[…]\nRemoving intermediate container d43a7a64606d\n\
  —> 3499256d8527\nSuccessfully built 3499256d8527\n```\n\n由于这是第一次构建，每条指令都被处理了。不过，4\
  \ 个步骤中的每一个都已被缓存。\n\n如果我在不更改任何内容的情况下运行相同的 `docker build` 命令，我可以从缓存层中获益。整个构建过程不到一秒钟，以下是输出：\n\
  \n```\nStep 1/4 : FROM debian:8\n—> ec0727c65ed3\nStep 2/4 : COPY . .\n—> Using\
  \ cache\n—> cb8153c1f09a\nStep 3/4 : RUN apt-get update && apt-get upgrade && apt-get\
  \ dist-upgrade -y\n—> Using cache\n—> f4a652ba0849\nStep 4/4 : RUN apt-get install\
  \ -y php5\n—> Using cache\n—> 3499256d8527\nSuccessfully built 3499256d8527\n```\n\
  \n注意每个层 ID 都匹配。为了改进这一点，我们应该重新排列指令。如果我们将 `COPY . .` 移动到末尾，`RUN` 步骤将被缓存，只有当源代码发生变化时才会执行\
  \ `COPY`。\n\n以下是将 `COPY` 指令放在最后优化的 `Dockerfile`：\n\n```dockerfile\nFROM debian:8\n\
  RUN apt-get update && apt-get upgrade && apt-get dist-upgrade -y\nRUN apt-get install\
  \ -y php5\nCOPY . .\n```\n\n## 8. 忘记安装 SDK\n\n### 8.1 一种工具统治一切\n\n在下一章节中，我将向你展示几种开发技术的\
  \ Dockerfile 文件示例。我想让你提前注意，我们使用的流程并不依赖于开发技术。无论是 Java、Python、.NET Core、Node.JS、PHP（或其他许多），用于构建、传输和部署应用程序的指令都是相同的。\n\
  \n\n\n\n\n这在许多环境中都是一个巨大的优势。如果你是一个团队的一员，可能有很多技术正在被使用；然而，构建、发布和部署应用程序的方法取决于应用程序的开发工具。使用单一工具来管理所有内容可以带来许多好处：\n\
  \n- 使用同一套开发栈的团队成员可以帮助使用其他栈的成员；\n- 单一的 CI/CD 流程和通用工具可以用于大多数项目，且改进将惠及所有这些项目；\n- 在实践中，无论使用什么技术，都使用相同的指令来构建、发布和部署应用程序。内容大致如下：\n\
  \n在 CI/CD 服务器上构建并分发\n\n```bash\ndocker build -t learnbook/my-server .\ndocker push\
  \ learnbook/my-server\n```\n\n在目标机器上部署\n\n```bash\ndocker run –rm -it -p 80:80 learnbook/my-server\n\
  ```\n\n## 8.2 理性地构建：易的 CI\n\n注意，我在上一节中使用了“构建（build）”一词，而我们在 `Dockerfile` 文件中执行的大部分工作是打包软件，而不是构建它。\n\
  \n但我真正的指的是构建。`Docker` 不仅仅是一种打包软件的技术，它实际上可以构建你的软件。当你构建一个镜像时，你实际上是在容器内部运行软件（`Dockerfile`\
  \ 文件中的 `RUN` 命令）。由于这些 `RUN` 命令是在镜像中运行的，因此镜像描述了构建软件所需的依赖项。\n\n还记得你作为开发人员时经历的那些艰难时光吗？你克隆了一些代码，结果发现构建它需要一整天，因为你需要安装许多构建依赖项和\
  \ SDK 工具。一旦你决定在镜像内部构建软件，你只需要 `Docker`。无论是在开发机上还是 CI/CD 服务器上：都需要 `Docker`。对于我一直从事的项目来说这是一个巨大的优势，我毫不相信你也将从中受益。\n\
  \n事实上，这甚至可以更进一步：你可以使用相同的 `Docker` 机器来构建和运行你的软件。与其拥有一个构建服务器和一个测试服务器，你实际上可以使用测试服务器进行构建。在编排上更进一步，你可以使用同一个\
  \ `Kubernetes` 集群来托管你的部署并构建代码——但那是另一个故事了。\n\n让我们以 ASP.NET Core 应用程序为例。ASP.NET Core\
  \ 要求我们恢复 `.csproj` 文件引用的 `NuGet` 包，然后将源代码（C# 文件）构建为 `DLLs` 并打包任何必要的依赖项。这可以通过以下 `Dockerfile`\
  \ 定义完成：\n\n```dockerfile\nFROM microsoft/dotnet:2.2-sdk AS builder\nWORKDIR /app\n\
  COPY . .\nRUN dotnet restore\nRUN dotnet publish –output /out/ –configuration Release\n\
  EXPOSE 80\nENTRYPOINT [\"dotnet\", \"aspnet-core.dll\"]\n```\n\n`FROM` 指令确保了我们拥有构建所需的工具（SDK），然后调用\
  \ `dotnet restore` 和 `dotnet publish` 使我们的代码准备好在镜像内部进行部署。这允许我们在 CI 服务器或开发人员机器上运行\
  \ `docker build`，并获得一个包含已构建文件的镜像。当容器在服务器上启动时（`docker run`），`ENTRYPOINT` 指令简单地确保了我们的代码在容器内启动。\n\
  \n由于 `Dockerfile` 定义与我们的源代码存储一起归档，我们就可以确保构建指令与代码保持同步，不同的分支甚至可能有不同的 `Dockerfile`\
  \ 定义。\n\n然而，生成的镜像存在一个问题。你能猜到吗？\n\n## 8.3 多阶段 Dockerfile\n\n我们上面创建的镜像存在的问题是它太胖了。它的重量是\
  \ 1730 MB！这是因为镜像包含了构建工具：如 `dotnet restore` 和 `dotnet publish` 等工具。我们不需要那些工具。此外，它还源码和中间构建产物。\n\
  \n我们可以使用 `RUN` 命令尝试清理镜像：删除中间构建产物、卸载构建工具、删除源代码，但将非常繁琐。是时候记住容器就像廉价的、一次性的机器了。让我们丢弃构建机器，换一个只安装了运行环境的全新机器吧！\n\
  \n`Docker` 有一种巧妙的方法来做到这一点：使用具有不同阶段的单个 `Dockerfile` 文件。可以通过在 `FROM` 指令末尾添加 `AS <name>`\
  \ 来简单地命名镜像。考虑以下简化的 `Dockerfile` 文件：\n\n```dockerfile\nFROM fat-image AS builder\n\
  …\nFROM small-image\nCOPY –from=builder /result .\n…\n```\n\n它定义了两个镜像，但只有最后一个会被保留作为\
  \ `docker build` 命令的结果。得益于 `COPY` 命令的 `--from` 参数，在第一个镜像（命名为 `builder`）中创建的文件系统供第二个镜像使用。它表示将\
  \ `builder` 镜像中的 `/result` 文件夹复制到第二个镜像的当前工作目录。\n\n这种技术允许你从 `fat-image` 中受益工具，但得到的镜像仅包含其所基础的\
  \ `small-image` 中定义的环境。需要时，你可以在 `Dockerfile` 文件中包含许多阶段。\n\n这是一个真实的示例。我改进了上一节中显示的\
  \ `Dockerfile` 文件，以便这次它使用多阶段构建：\n\n```dockerfile\nFROM microsoft/dotnet:2.2-sdk\
  \ AS builder\nWORKDIR /app\nCOPY *.csproj .\nRUN dotnet restore\nCOPY . .\nRUN dotnet\
  \ publish –output /out/ –configuration Release\nFROM microsoft/dotnet:2.2-aspnetcore-runtime-alpine\n\
  WORKDIR /app\nCOPY –from=builder /result .\nEXPOSE 80\nENTRYPOINT [\"dotnet\", \"\
  aspnet-core.dll\"]\n```\n\n在第一部分，我使用了完整的 SDK 镜像，并将 `/out` 目录的内容复制到 `/app`。第二个镜像基于运行时环境，我得到的镜像仅为\
  \ 161 MB。相比 SDK 镜像缩小了 91%！\n\n为了在 Docker 内部生成产物，请确保使用多阶段 `Dockerfile`。正如我们在 Size\
  \ 章节中所看到的原因，你想要生成小镜像。\n\n## 9. 通用开发配置的 Docker\n\n我们看到了如何将应用程序封装到 `Dockerfile` 中，你应该已经了。然而，在创建第一个镜像时你可能对某些模式感到犹豫。我列出了常用开发技术的示例镜像。只需选择你自己的。\n\
  \n每个小节分为两个部分：\n\n- 结果：指向镜像（我已经发布到了 Docker Hub，你可以直接运行它们）；\n- 文件：详细介绍了用于创建镜像的文件（特别是\
  \ `Dockerfile` 文件）。\n\n### 9.1 .NET Core\n\n### 结果\n镜像发布为 `learnbook/aspnetcore-server`。你可以通过以下命令运行容器：\n\
