  \ 更新与扩展\n\n## 16.1 水平扩展\n\n水平扩展（Horizontal scaling）是一种允许应用程序处理更多并发请求的技术，也称为 `scaling\
  \ out`（扩容）。当你在机器上运行服务器应用程序时（或者对于 `Pod` 来说），它只能处理特定数量的并发请求，因为每个请求都需要某些 `RAM` 和 `CPU`\
  \ 资源。\n\n例如，你的应用程序可能每秒能处理 100 个请求。如果你想处理更多请求，可以在不同的服务器上复制该应用程序，以便处理更多请求。假设我们想每秒处理\
  \ 300 个请求，我们可以运行 3 个应用程序实例。\n\n在传统的服务器托管应用程序上，水平扩展需要费费一些工作。机器及其应用程序需要被复制，并且在三个副本前面需要使用负载均衡器应用程序，以便让传入的请求由三个副本均匀地提供。好消息是：Kubernetes\
  \ 让这项任务变得极其简单。你只需要在 `Deployment` 的定义中设置 `replicas` 属性即可：\n\n```yaml\napiVersion:\
  \ apps/v1beta1\nkind: Deployment\nmetadata:\n  name: my-front\nspec:\n  template:\n\
  \    metadata:\n      labels:\n        app: front\n    spec:\n      replicas: 3\n\
  \      containers:\n        - name: front\n          image: learnbook/k8s-front:0.4\n\
  ```\n\n## 16.2 自动水平扩展\n\n扩容曾是一项困难的任务，但 Kubernetes 使其变得简单。但我们这些 IT 人总是想要更多，所以当某些任务变得简单时，我们就会寻找更多挑战。老实说，市场也在要求创新，因此我们也顺应市场。那么，我们如何让水平扩展更具挑战性呢？\n\
  \n考虑一下：能够设置处理传入请求的 `Pods` 数量是可以的，但你如何设置那个数字呢？如果数字太低，`Pods` 将无法处理用量高峰；如果数字太高，会有太多的\
  \ `Pods` 闲置无无事事，这意味着它们在白白消耗 `CPU` 和内存资源。\n\n最好的办法是动态更改 `Pods` 的数量以满足实际需求：当出现用量高峰期时，创建更多\
  \ `Pods`；当应用程序面临低使用率时，销毁无用的 `Pods` 以释放资源。\n\n实际上，这可以通过一个简单的 Kubernetes 对象完成：\n\n\
  ```yaml\napiVersion: autoscaling / v1\nkind: HorizontalPodAutoscaler\nmetadata:\n\
  \  name: captureorder\nspec:\n  scaleTargetRef:\n    apiVersion: apps / v1\n   \
  \ kind: Deployment\n    name: front\n  minReplicas: 4\n  maxReplicas: 10\n  targetCPUUtilizationPercentage:\
  \ 70\n```\n\n\n\n\n\n`HorizontalPodAutoscaler` 会监控可用 Pod 的 CPU 使用情况，并将其与 Pod CPU\
  \ 请求中设置的限制进行比较。如果 Pod 的使用率低于目标百分比，某些 Pod 将被销毁。反之，当 Pod 的使用率超过目标百分比时，会创建新的 Pod 直到达到目标百分比。当然，创建的\
  \ Pod 数量不会超过定义中 `maxReplicas`，也不会低于 `minReplicas` 的数量。\n\n在上面的示例中，自动扩展是基于 CPU 使用率的，但你也可以使用目标内存使用率。\n\
  \n简而言之，感谢 `HorizontalPodAutoscaler`，你可以定义一个根据实际使用消耗资源的应用程序，在低负载时为其他应用程序留出空间。\n\n\
  ### 16.3 更新策略\n\n当你修改 `Deployment` 的模板部分时，现有的 Pod 不再是最新的，需要用使用新模板创建的 Pod 来替换。一旦你\
  \ `kubectl apply` 修改后的 `Deployment`，Kubernetes 就会为你处理此任务。具体是如何操作的？让我们来看看。\n\n由于\
  \ `ReplicaSet` 会确保给定版本的 Pod 正在运行，一旦版本发生变化，Kubernetes 就会创建一个新的 `ReplicaSet`。旧的 `ReplicaSet`\
  \ 会删除它管理的 Pod，而新的 `ReplicaSet` 将创建 Pod。这些删除和创建的顺序由 `Deployment` 的 `strategy` 属性决定。\n\
  \n#### Recreate（重建）\n\n当你将策略设置为 `Recreate` 时，所有旧的 Pod 会首先停止。一旦它们不再运行，就会启动新的 Pod。\n\
  \n```yaml\napiVersion: apps/v1beta1\nkind: Deployment\nmetadata:\n  name: my-front\n\
  spec:\n  strategy:\n    type: Recreate\n  replicas: 3\n  template:\n    metadata:\n\
  \      labels:\n        app: front\n    spec:\n      containers:\n      - name:\
  \ my-front\n        image: my-wordpress\n```\n\n下面的序列说明了当使用 `recreate` 策略 `kubectl\
  \ apply` `Deployment` 模板的更改时会发生什么。\n\n![](img/file83.jpg)\nDeployment 更改之前的状态\n\n\
  ![](img/file84.jpg)\nPod 停止，然后 ReplicaSet 被删除\n\n![](img/file85.jpg)\n创建了一个新的 ReplicaSet\n\
  \n![](img/file86.jpg)\n新的 ReplicaSet 使用新模板创建 Pod\n\n`Recreate` 更新策略意味着在任何时刻，运行的\
  \ Pod 数量都不会超过你设置的副本数，因此更新消耗的资源不会比运行中的应用程序多。但它意味着会在某一点没有 Pod 可用，这意味着你的应用程序将发生服务中断。这是否可行取决于你的决定。如果不可，`RollingUpdate`（滚动更新）策略可能对你很有吸引力。\n\
  \n#### Rolling update（滚动更新）\n\n与其先停止所有现有的 Pod 再创建新的 Pod，Kubernetes 默认提供了一种更平滑的方法。你只需要为\
  \ `strategy` 类型指定 `RollingUpdate` 值即可：\n\n```yaml\napiVersion: apps/v1beta1\nkind:\
  \ Deployment\nmetadata:\n  name: my-front\nspec:\n  strategy:\n    type: RollingUpdate\n\
  \  replicas: 3\n  template:\n    metadata:\n      labels:\n        app: front\n\
  \    spec:\n      containers:\n      - name: my-front\n        image: my-wordpress\n\
  ```\n\n事实上，`RollingUpdate` 是默认值，所以到目前为止我们没有指定任何策略类型时，我们使用的就是滚动更新策略。这意味着你通过 Kubernetes\
  \ 免费获得了了细粒度、高可用且智能的更新。我告诉过你 Kubernetes 开发者很幸运吗？当然，想要运行它需要一些知识，但一旦你读到书的这一部分，你就获得了强大的力量，能够让你轻松地完成以前非常繁琐的工作。但让我详细说明滚动更新是如何发生的。\n\
  \n在滚动更新期间，Pod 会按 25% 的批次进行替换（这是一个可以更改的默认值）。首先使用新模板创建第一批 25% 的 Pod（当运行 3 个 Pod 时创建\
  \ 1 个，当运行 8 个 Pod 时创建 2 个）。Kubernetes 等待新 Pod 运行后，然后停止相同数量的旧 Pod。一旦旧 Pod 停止，它将重复该过程，用新\
  \ Pod 替换另一批 25% 的旧 Pod。该过程不断重复直到所有旧 Pod 都被新 Pod 替换。\n\n滚动更新过程甚至更好：当创建 25% 的新 Pod\
  \ 组时，Pod 可能会失败；如果新 Pod 无法达到运行状态，滚动更新过程将停止并保留旧 Pod。这意味着如果新 Pod 有 Bug，应用程序仍保持运行；它仅由旧\
  \ Pod 提供服务，你可以使用新模板并再次 `kubectl apply` 来整理并解决问题。\n\n简而言之，滚动更新过程确保了即使在新版本出现问题的情况下你的应用程序始终运行，并且在更新过程中使用的资源较少。\n\
  \n下面的序列说明了当使用滚动更新策略 `kubectl apply` `Deployment` 模板的更改时会发生什么。\n\n![](img/file87.jpg)\n\
  使用新模板创建了 25% 的新 Pod\n\n![](img/file88.jpg)\n删除了 25% 的旧 Pod\n\n![](img/file89.jpg)\n\
  对 Pod 的 25% 重复此过程\n\n![](img/file90.jpg)\n旧的 ReplicaSet 被删除\n\n##### 滚动更新参数\n\n\
  如果你有高级需求，且以上方法还不能满足你，可以通过一些参数来修改它的行为：\n\n```yaml\napiVersion: apps/v1beta1\nkind:\
  \ Deployment\nmetadata:\n  name: my-front\nspec:\n  strategy:\n    type: RollingUpdate\n\
  \    rollingUpdate:\n      maxSurge: 25%\n      maxUnavailable: 25%\n  replicas:\
  \ 3\n  template:\n    metadata:\n      labels:\n        app: front\n    spec:\n\
  \      containers:\n      - name: my-front\n        image: my-wordpress\n```\n\n\
  `maxSurge` 和 `maxUnavailable` 参数指定了批次大小，即在更新期间可以额外创建或处于不可用的 Pod 数量。你可以提供数字或百分比。在百分比的情况下，它是相对于\
  \ `replicas` 参数的。\n\n##### 蓝绿发布、金丝雀和彩虹\n\n`rolling update` 或 `recreate` 策略对于大多数需求都是足够的，但如果你运行的应用程序拥有大量用户，你可能希望尝试更微妙的更新类型。对于所有这些类型，你需要在更新过程中添加一些逻辑，这主要通过调整路由到\
  \ Pod 的 `Service` 选择器来实现。\n\n在蓝绿发布期间，创建一个新版本（蓝色），同时用户被路由到旧版本（绿色）。新版本经过测试，一旦宣布就绪（绿色），它将完全替换旧版本，旧版本随后被删除。你可以通过简单地为\
  \ Pod 添加额外的蓝绿标签来实现这一点。\n\n金丝雀发布试图模仿煤矿里的金丝雀：只要鸟是健康的，矿工就知道他们没有面临危险。在金丝雀发布中，你对应用程序进行监控，并将一部分用户路由到新版本，同时监控你的指标。如果指标显示问题，你就减少百分比；如果指标正常，你就增加百分比。这可以通过匹配部分新\
  \ Pod 的 `Service` 选择器来实现。\n\n\n\n\n命名空间（Namespaces）为你提供了一种在 Kubernetes 集群内部将对象相互隔离的方法。它们允许对象名称、`Services`\
  \ 的网络名称、资源配额和授权（`RBAC`）进行分离。\n\n命名空间是隔离集群内部团队的一种方便方式：对象被限制在它所在的 `Namespace` 中，这避免了某个团队修改另一个团队具有相同名称的对象。\n\
  \nKubernetes 集群启动时有两个 `Namespaces`，你可以添加自己的命名空间。两个默认的 `Namespaces` 是：\n\n- `default`：用于未分配\
  \ `Namespace` 的对象。\n- `kube-system`：用于提供 Kubernetes 功能的对象。\n\n你可以像声明其他 Kubernetes\
  \ 对象一样声明 `Namespace`：\n\n```\napiVersion : v1 kind : Namespace metadata : name :\
  \ prod\n```\n\n一旦在你的集群中存在一个 `Namespace`，你就可以向我们之前见过的 `kubectl` 命令中添加 `--namespace`\
  \ 参数。例如，以下命令会在命名为 `team1` 的命名空间中创建或更新 `dep.yaml` 文件中描述的对象：\n\n```bash\nkubectl apply\
  \ -f dep.yaml –namespace team1\n```\n\n假设 `dep.yaml` 文件描述了一个名为 `front` 的 `Deployment`。如果你运行上述命令，`front`\
  \ Deployment 及其 `Pods` 将被限制在 `team1` 命名空间中，因此你可以在 `team2` 命名空间中运行相同的命令，并在 `team2`\
  \ 命名空间中获得另一个“隔离”的 `front` 部署：\n\n```bash\nkubectl apply -f dep.yaml –namespace team2\n\
  ```\n\n查询 Kubernetes 资源时也是如此。例如，以下命令返回属于 `team1` 命名空间的 `Pods`：\n\n```bash\nkubectl\
  \ get pods –namespace team1\n```\n\n当你不带 `--namespace` 参数运行相同的命令时，你不会获得来自所有命名空间的对象：你只会获得命名为\
  \ `default` 的命名空间中的对象。如果你想列出所有命名空间的 `Pods`，请在 `kubectl get` 命令上使用 `--all-namespaces`\
  \ 参数。\n\n由于你很可能每天都在同一个 `Namespace` 中工作，你不想在每个命令中都添加 `--namespace` 参数。只需运行以下命令，当前上下文将将设置为默认在\
  \ `team1` 内部工作：\n\n```bash\nkubectl config set-context –current –namespace=team1\n\
  ```\n\n从现在起，你的命令将在 `team1` `Namespace` 内部的对象上执行。由于 `Namespace` 与 `kubectl` 上下文关联，当你切换到另一个上下文并回到设置的上下文时，它会被记住。简而言之：一个\
  \ `kubectl` 上上下文指向一个集群、一个用户和一个 `Namespace`。\n\n我们之前看到 `Services` 可以从集群内部通过名称进行访问，因此名为\
  \ `front` 的 `Service`可以通过 `http://front` URL 访问。这种 DNS 功能由 `CoreDNS` 组件提供。此外：`Service`\
  \ 有两个域名：一个包含它的 `Namespace`，另一个不包含。例如，`front` Service 拥有两个域名：\n\n- `front.team1`\n\
  - `front`\n\n`front` 域名解析为请求来源所在的 `Namespace`。因此，如果来自 `team2` `Namespace` 的 `Pod`\
  \ 查询 `http://front` URL，它实际上看到的只是 `team2` 命名空间中的 `front` `Service`。如果它需要访问 `team1`\
  \ 命名空间的 `Service`，可以使用 `http://front.team1` URL。这种名称解析再次提供了命名空间之间的隔离：它在避免命名冲突的同时仍允许跨命名空间通信。\n\
  \n集群管理员可以使用 `ResourceQuota` 对象。它允许限制 `Namespace` 内部可以使用的资源。这样，来自某个 `Namespace` 的对象就不会因为占用集群的所有资源而饿死其他命名空间。可以定义以下属性：\n\
  \n- `limits.cpu`：`Pods` 请求的 CPU 限制总和；\n- `limits.memory`：`Pods` 请求的内存限制总和；\n- `requests.cpu`：`Pods`\
  \ 的 CPU 请求总和；\n- `requests.memory`：`Pods` 的内存请求总和。\n\n注意，某些 Kubernetes 对象无法被限制在\
  \ `Namespace` 中，它们位于 `Namespaces` 之外：\n\n- `Namespaces` 自身；\n- `Nodes`；\n- `PersistentVolumes`；\n\
  \n## 17.2 RBAC\n\n到为止，我们一直使用 `kubectl` 命令对集群内部进行基础更改。这意味着管理集群只需要一个正确的 `context`。现在，想象一下某些恶意用户拥有这种权力：他会给你的集群带来混乱，获取机密信息，或迅速添加恶意的\
  \ `Pods`。你肯定不希望这样。\n\n除了阻止外部用户，你还想限制特定用户在 Kubernetes 集群内部可以执行的操作。例如，在预生产集群中，你可能希望确保开发者只能列出\
  \ Kubernetes 对象而不能更改它们，而 CI/CD 引擎是唯一允许创建或更改对象的实体。你可能还希望确保只有特定用户或系统可以创建和读取 `Secrets`。\n\
  \n此类限制可以使用 `RBAC` 来定义。你可以将用户（或服务账户）链接到 Kubernetes API 的特定权限。\n\n在配置 `RBAC` 之前，你必须确保你的集群已启用\
  \ `RBAC`。由于启用 `RBAC` 功能是在创建集群时做出的选择，你可能没有关于是否启用的信息。如果集群启用了 `RBAC`，你可以使用以下命令：\n\n\
  ```bash\nkubectl describe pod -n kube-system\n``` ...\n```\n\n如果 `RBAC` 已启用，你应该在授权模式中看到\
  \ `RBAC` 的提及：\n\nmedia/file91jpg\n\n正如许多授权系统一样，`RBAC` 不直接将用户链接到权限。相反，它将权限链接到 `Roles`，然后将用户分配给\
  \ `Roles`。这允许随着团队的变化轻松添加和删除用户，并为组重新配置权限。简而言之：`Roles` 是用户组。\n\n角色有两种类型：\n\n- `Role`：定义限制在命名空间的授权；\n\
  - `ClusterRole`：定义跨集群有效的授权。\n\nmedia/file92jpg\n`RoleBinding` 将一个用户（或服务账户）链接到 `Role`。同样地，`ClusterRoleBinding`\
  \ 将一个用户（或服务账户）链接到 `ClusterRole`。\n\n为了让启用了 RBAC 的集群正常运行，已经定义了一些 `ClusterRoles`，并绑定到你用于连接的用户。这里是一些\
  \ `ClusterRoles`：\n\n```bash\nkubectl get clusterroles\nNAME                   \
  \                 \nadmin                                   8d\ncluster-admin  \
  \                         8d\nedit                                    8d\nsystem:coredns\
  \                          8d\nsystem:persistent-volume-provisioner\nview      \
  \                              8d\n```\n\n列表经过简化。你可以看到三个常用的 `ClusterRoles`，如果你不想花时间创建自己的角色，可以将它们分配给新用户。`admin`\
  \ 和 `cluster-admin` 角色具有扩展权限，应该谨慎授予。你可以使用以下命令检查分配给角色的授权：\n\n```bash\nkubectl describe\
  \ clusterrole view\n```\n\n该列表再次经过简化。我们可以看到 `view` `ClusterRole` 具有列出 pod 的能力，因此该角色获得了\
  \ `kubectl get logs` 命令。\n\n## 18. Helm\n\n### 18.1 使用 Helm\n\nHelm 被称为“Kubernetes\
  \ 的包管理器”：\n\nmedia/file93jpg\n\n来自 Helm 网站的截图\n\n\n\n我不会将 Helm 与 `NPM` 或 `NuGet`\
  \ 这种同样管理包依赖关系的包管理器相提并，但当你想要向 Kubernetes 部署复杂应用时，它确实意味着了一条简便的路径。\n\n从实践上讲，它主要允许为\
  \ `kubectl apply` 命令添加额外的功能：它允许在 YAML 文件中使用变量甚至是脚本，然后将这些文件打包在一起。Helm 包被称为 `Charts`（（图表）。\n\
  \n## 使用 Helm Charts\n\nHelm 中最简单的部分是使用现有的 `Chart`，即使用 Helm 图表在 Kubernetes 集群中安装应用程序。这通过两个步骤完成：\n\
  \n1. 添加 Helm 存储库（chart 的来源，类似于 Docker 镜像的 `Registry`）；\n2. 使用以下命令安装 chart：\n\n`helm\
  \ install <name>--set version=1.0,key=value,... chart`\n\n`--set` 选项允许你重写 chart\
  \ 中的默认值。当有许多值时，你可以在一个 YAML 文件中提供它们。\n\n让我们举一个例子来说明这一点。假设我想安装 Redis。Redis 是一个分布式缓存，这意味着值存储在不同的机器上：这是一个可以轻松分发到多个\
  \ `Nodes` 上的 `Pods` 的绝佳示例。\n\n从 Redis chart 的描述中可以看到创建的从节点数量由 `cluster.slaveCount`\
  \ 变量设置。它的默认值为 1，我想将其重写为 3，以便我有 4 个 `Pods` 运行我的 Redis 集群（1 个主节点，3 个从）。\n\n```bash\n\
  helm repo add stable https://kubernetes-charts.storage.googleapis.com/\n“stable”\
  \ has been added to your repositories\n\nhelm install mycache stable/redis --set\
  \ cluster.slaveCount=3\n\nNAME: mycache\nLAST DEPLOYED: Thu Jan 30 14:07:47 2020\n\
  NAMESPACE: default\nSTATUS: deployed\nREVISION: 1\nTEST SUITE: None\nNOTES:\n  Please\
  \ be patient while the chart is being deployed\n```\n\n在集群内部，可以通过以下 DNS 名称通过端口 6379\
  \ 访问 Redis：\n- `mycache-redis-master.default.svc.cluster.local` 用于读写操作\n- `mycache-redis-slave.default.svc.cluster.local`\
  \ 用于只读操作\n\n要获取密码请运行：\n`...`\n\n输出为了简洁已经缩短，但正如你所看到的，在安装时 chart 会根据你提供的参数提供一些文档。\n\
  \n让我们列出我的集群中运行的 `Pods`：\n\n```bash\nkubectl get pods\nNAME                     READY\
  \  STATUS    AGE\nmycache-redis-master-0   1/1     Running   3m20s\nmycache-redis-slave-0\
  \    1/1     Running   3m20s\nmycache-redis-slave-1    1/1     Running   2m34s\n\
  mycache-redis-slave-2    1/1     Running   2m17s\n```\n\n好了，我确实有 4 个 `Pods` 在运行\
  \ Redis。就这么简单。\n\n### 18.2 创建 Helm 包 (charts)\n\n我们刚刚看到一个制作良好的 chart 如何简化复杂应用程序的部署。一旦你创建了适用于\
  \ Kubernetes 的应用程序，你可能想将其封装成一个 chart 以于分发。请注意，这是一个非常简单的过程。\n\n一个 chart 实际上是 `*.tar.gz`\
  \ 包中的文件集合：\n\n![](img/file94.jpg)\n\n这些文件有：\n- 描述 Kubernetes 对象的 YAML 文件，就像我们目前看到的那些一样，但增加了添加脚本的可能性；\n\
  - 一个 `values.yaml` 文件，定义了脚本中使用变量的默认值；\n- 一个 `NOTES.txt` 文件，在安装 chart 时将渲染帮助文本。\n\
  \n如前提到的，在 YAML 文件中可以使用 YAML 语法，并可以添加脚本块：就此而言，使用了 Go 模板：\n\n```yaml\napiVersion:\
  \ apps/v1beta1\nkind: Deployment\nmetadata:\n  name: back-{{ .Values.config }}\n\
  ```\n\n上述文件定义了一个 `Deployment`，该部署名称将通过在 `back-` 前缀后附加配置项来生成。配置项的实际值设置在 `values.yaml`\
  \ 文件中，但在安装时可以使用 `--set` 选项或 YAML 文件进行重写。\n\n与其从空文件夹开始，不如使用以下命令脚手架 chart 模板：\n\n\
  `helm create <name>`\n\n这简单地创建一个包含足够启动文件的文件夹，以形成真正的 chart。然后你根据需要编辑这些文件。放置在 `templates`\
  \ 目录中的任何 YAML 文件将成为 chart 的一部分。\n\n然后你使用以下命令创建 chart 包（lint 仅用于验证目的）：\n\n```bash\n\
  helm lint <name>\nhelm package <name>--debug\n```\n\n这会在一个名为 `<name>-0.1.0.tgz`\
  \ 的文件中创建一个可安装的 chart（版本号来自 `Chart.yaml` 文件）。在你分发 chart 之前，你可能想检查它实际上做了什么。可以通过以下命令完成，它将输出原本会被发送到\
  \ Kubernetes 集群的 YAML：\n\n```bash\nhelm install --dry-run --debug <name>-0.1.0.tgz\n\
  ```\n\n你现在可以通过两种方式分发你的 chart：\n- 分发 `*.tar.gz` 文件；\n- 将 `*.tar.gz` 文件放置在 Helm 存储库上（托管\
  \ `*.tar.gz` 文件的简单 HTTP 文件服务器）。\n\n作为文件分发时，可以使用文件名安装 chart：\n\n`helm install <name>\
  \ <name>-0.1.0.tgz`\n\n当使用存储库分发时，用户只需使用 `helm repo add` 命令添加你的存储库即可。\n\n## 作者的话\n\
