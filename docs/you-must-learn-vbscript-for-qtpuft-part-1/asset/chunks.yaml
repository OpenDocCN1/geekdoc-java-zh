    | True | True | True |

    | True | False | True |

    | False | True | True |

    | False | False | False |


    ### 逻辑异或 (Xor)

    逻辑异或运算符 (Xor) 当仅有一个有一个表达式为 `True` 时返回 `True`，否则返回 `False`。以下是逻辑异或运算符的示例：


    ### 语法

    ```

    Result = Expression1 Xor Expression2

    ```


    ### 强制声明

    ```vb

    Dim x, y, z

    x = 100

    y = 10

    z = x = 200 Xor y > 400

    MsgBox z

    ```

    答案是“False.”。


    图 3.30

    ![](img/00178.jpg)


    以下是逻辑异或运算符 (Xor) 的真值表：


