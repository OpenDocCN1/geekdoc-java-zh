    | :--- | :--- | :--- |

    | True | True | False |

    | True | False | True |

    | False | True | True |

    | False | False | False |


    ### 逻辑等价 (Eqv)

    逻辑等价运算符 (Eqv) 当两个表达式求值为相同的值（`True` 或 `False`）时，返回 `True`。以下是逻辑等价运算符的示例：


    ### 语法

    ```

    Result = Expression1 Eqv Expression2

    ```


    ### 强制声明

    ```vb

    Dim x, y, z

    x = 100

    y = 10

    z = x > 200 Eqv y > 400

    MsgBox z

    ```

    答案是“True.”。


    图 3.32

    ![](img/00183.jpg)


