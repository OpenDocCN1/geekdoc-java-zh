    Variables


    Variables are storage locations in memory (see [Variables and Data Types in Chapter
    2](#index_split_010.html_filepos39305).) Scripts use variables to store data for
    later use. The data stored in a variable can be anything—a small number, a large
    number, a word, or a combination of numbers and letters (alphanumeric characters).
    A variable must have a good name that clearly defines its goal. Each variable
    must serve one purpose and not be used throughout the script for multiple purposes.


