- fmt: "\nObjects can be accessed using properties and methods. A property is a placeholder\
    \ for a value associated with a specific object. Properties can hold any kind\
    \ of data, including a reference to another object. A method is comparable to\
    \ a procedure that is attached to an object. Methods carry out a specific action\
    \ for an object in the same manner as a procedure.\n\n## Multiple References\n\
    \nThe value of an object’s variable is a reference and not the object itself.\
    \ This concept is important when programmers are dealing with multiple references\
    \ to the same object. There are times when understanding an object’s variable\
    \ referencing an object can be confusing. In a brief form, an object’s variable\
    \ and object is similar to a person with a house. The person has a house wherefore\
    \ the address identifies where the person dwells. An object’s variable holds information\
    \ that shows where the object dwells in a computer’s memory. Regarding this section,\
    \ multiple references to the same object is similar to one person having multiple\
    \ houses. The following is an example of multiple object variables referencing\
    \ the same object:\n\nFigure 7.4\n\n![](images/00002.jpg)\n\n```vbscript\nOption\
    \ Explicit\nDim objGreet, objName\nDim strGreet, strName\nSet objGreet = CreateObject(\"\
    Scripting.Dictionary\")\nSet objName = objGreet\n'Add and Display the item for\
    \ objGreet \nobjGreet.Add \"1\", \"James\"\nstrGreet = objGreet.Item(\"1\")\n\
    MsgBox \"(objGreet) = \" & strGreet\n'Update and Display the item for objName\n\
    objName.Item(\"1\") = \"Joe\"\nstrName = objName.Item(\"1\")\nMsgBox \"(objName)\
    \ = \" & strName\n'Display the item for objGreet after updating objName\nstrGreet\
    \ = objGreet.Item(\"1\")\nMsgBox \"(objGreet) = \" & strGreet\n```\n\nThe first\
    \ output displays “(objGreet) = James,” the second output displays “(objName)\
    \ = Joe,” and the third output displays “(objGreet) = Joe.”\n\nFigure 7.5\n\n\
    ![](images/00149.jpg)![](images/00041.jpg)[](images/00172.jpg)\n\nThere are two\
    \ object variables: `objGreet` and `objName` that are created by separate statements.\
    \ Object variable `objGreet` was created by the `Set` command and the `CreateObject`\
    \ function, but object variable `objName` was only created by the `Set` command.\
    \ The line `Set objName = objGreet` means both variables are referencing the same\
    \ object. Either object variable can update the object even though there is one\
    \ `Add` method: `objGreet.Add \"1\", \"James\"` on `objGreet`. In this situation,\
    \ `objName` updates the object with line `objName.Item(\"1\") = \"Joe\"` which\
    \ is reflected in both variables. Notice how `MsgBox \"(objName) = \" & strName`\
    \ and `MsgBox \"(objGreet) = \" & strGreet` both display Joe.\n\n## With Construct\n\
    \nThe `With` Construct is a shortcut that saves typing when referring to the same\
    \ object more than once. The `With` Construct makes the programmer’s code look\
    \ clean when there are several lines of code. The `With` Construct requires statements\
    \ to be enclosed within the `With…End With` block. The following is an example\
    \ of the `With` Construct:\n\nFigure 7.6\n\n![](images/00040.jpg)\n\n```vbscript\n\
    Option Explicit\nDim objGreet\nDim strGreet\nSet objGreet = CreateObject(\"Scripting.Dictionary\"\
    )\nWith objGreet\n    .Add 1, \"James\"        \n    MsgBox \"The count is \"\
    \ & .Count\n    strGreet = .Item(1)\n    MsgBox \"Hello \" & strGreet        \n\
    End With\n```\n\nThe first output displays “The count is 1” and the second output\
    \ displays “Hello James.”\n\nFigure 7.7\n\n![](images/00132.jpg)![](images/00199.jpg)\n\
    \nIn the `With…End With` block of code object variable `objGreet` contains the\
    \ `Add` method: `.Add 1, \"James\"`, the `Count` property: `.Count`, and the `Item`\
    \ property: `.Item(1)`, without typing the object variable each time.\n\n## Destroy\
    \ Objects\n\nObjects consume a large amount of resources. It is important to create\
    \ objects before they are put to use and to also destroy objects when they are\
    \ not needed. The key to understanding objects is recognizing their lifetime.\
    \ An object remains in memory as long as a variable refers to the object. The\
    \ object can lose its reference in one of two ways: First, the object variable\
    \ can go out of scope and second, the object can be cleared out by using the keyword\
    \ `Nothing`. `Nothing` is a special value that is only used with objects to empty\
    \ the reference. The following is an example using the keyword `Nothing`:\n\n\
    Figure 7.8\n\n![](images/00074.jpg)\n\n```vbscript\nOption Explicit\nDim objGreet\n\
    Set objGreet = CreateObject(\"Scripting.Dictionary\")\nobjGreet.Add \"Greet\"\
    , \"Hello\"\nMsgBox \"How many objects are in objGreet: \" & objGreet.Count\n\
    Set objGreet = Nothing \n```\n\nIn this example, the object `objGreet` is cleared\
    \ from memory by using the keyword `Nothing`.\n\n## Conclusion\n\nVBScript is\
    \ the scripting language that supports QTP/UFT scripts. An understanding of VBScript\
    \ helps to create and maintain test scripts in QTP/UFT. This book: “Part 1—You\
    \ Must Learn VBScript for QTP/UFT” focused on providing automation engineers a\
    \ good foundation of the scripting language. Some of the take-away topics are:\n\
    \n- **Coding Standards**: Automation engineers must implement good programming\
    \ habits, such as comments and the Hungarian Naming Convention for variables.\n\
    - **Flow Control**: Branching constructs and looping statements are two forms\
    \ of flow control.\n"
