    \nFigure 6.30\n![](images/00057.jpg)\n\n## Argument Declaration (ByRef or ByVal)\n\
    \nAn argument is represented by reference (`ByRef`) or by value (`ByVal`), according\
    \ to how it is declared in the procedure. `ByRef` is the default if there is not\
    \ a declaration. A change to the value in a procedure is permanent and reflected\
    \ in the calling code when using `ByRef`. On the contrary, designating an argument\
    \ as `ByVal` means that the code within a procedure can change the value of a\
    \ variable, but they are not permanent. The changes are eliminated as soon as\
    \ the procedure terminates. The following is an example of not declaring the arguments\
    \ using `ByRef` and `ByVal`:\n\nFigure 6.31\n![](images/00047.jpg)\n\n```vb\n\
    Option Explicit\n\nDim intFirst, intSecond\n\nintFirst = 100\n\nintSecond = 100\n\
    \nCall No_ByRef_ByVal (intFirst, intSecond)\n\nMsgBox \"intFirst = \" & intFirst\
    \ & vbNewLine & \"intSecond = \" & intSecond \n\nSub No_ByRef_ByVal (intFirstNumber,\
    \ intSecondNumber)\n    intFirstNumber = intFirstNumber + 10\n    intSecondNumber\
    \ = intSecondNumber + 10\n    MsgBox \"intFirstNumber = \" & intFirstNumber &\
    \ vbNewLine & _\n        \"intSecondNumber = \" & intSecondNumber\nEnd Sub\n```\n\
    \nThe first output displays “intFirstNumber = 110” and “intSecondNumber = 110”\
    \ while the second output displays “intFirst = 110” and “intSecond = 110.”\n\n\
    Figure 6.32\n![](images/00075.jpg)![](images/00167.jpg)\n\nThe following is an\
    \ example of declaring the arguments using `ByRef` and `ByVal`:\n\nFigure 6.33\n\
    ![](images/00151.jpg)\n\n```vb\nOption Explicit\n\nDim intFirst, intSecond\n\n\
    intFirst = 100\n\nintSecond = 100\n\nCall ByRef_ByVal (intFirst, intSecond)\n\n\
    MsgBox \"intFirst = \" & intFirst & vbNewLine & \"intSecond = \" & intSecond \n\
    \nSub ByRef_ByVal (ByRef intFirstNumber, ByVal intSecondNumber)\n    intFirstNumber\
    \ = intFirstNumber + 10\n    intSecondNumber = intSecondNumber + 10\n    MsgBox\
    \ \"intFirstNumber = \" & intFirstNumber & vbNewLine & _\n        \"intSecondNumber\
    \ = \" & intSecondNumber\nEnd Sub\n```\n\nThe first output displays “intFirstNumber\
    \ = 110” and “intSecondNumber = 110,” while the second output displays “intFirst\
    \ = 110” and “intSecond = 100.”\n\nFigure 6.34\n![](images/00100.jpg)![](images/00048.jpg)\n\
    \nThe variables `intFirst` and `intSecond` are declared at the script level and\
    \ initialized to 100. Argument `intFirstNumber` is declared as `ByRef` and argument\
    \ `intSecondNumber` as `ByVal`. Both arguments are increased by ten within the\
    \ procedure `ByRef_ByVal`, which outputs “110”. Observe how `intFirst` has a value\
    \ of 110. Only `intFirst` was changed outside of the procedure because it was\
    \ passed by reference. Variable `intSecond` was passed by value and displays 100.\
    \ `ByRef` value changes are not reflected outside of the procedure.\n\n## Built-In\
    \ Functions\n\nVBScript automatically provides a library of functions called Built-In\
    \ Functions. The Built-In Functions allow programmers to be more efficient and\
    \ not waste time creating a function that already exists. `MsgBox` is a Built-In\
    \ Function with several parameters that have been used throughout this book. The\
    \ first parameter displays a message in a dialog box while the other parameters,\
    \ such as the button parameter(second parameter) and title parameter(third parameter),\
    \ are optional. The following is a `MsgBox` example using the button and title\
    \ parameters:\n\n```vb\nMsgBox \"Do you want to join Rex Jones for Free Live Training?\
    \ \", VYesNo, \"FREE LIVE TRAINING\"\n```\n\nThe output displays “Do you want\
    \ to join Rex Jones for Free Live Training?”\n\nFigure 6.35\n![](images/00121.jpg)\n\
    \nNormally, the dialog displays a message and an OK button. This example shows\
    \ a title “FREE LIVE TRAINING,” a message “Do you want to join Rex Jones for Free\
    \ Live Training,” and two buttons Yes and No. In most cases, programmers only\
    \ use the `MsgBox` function for debugging purposes. Therefore, the optional parameters\
    \ are not necessary. The following is a list of some useful Built-In Functions\
    \ divided by the following sections:\n\n*   [Array Functions]\n*   [Conversion\
    \ Functions]\n*   [Date/Time Functions]\n*   [Format Functions]\n*   [Math Functions]\n\
    *   [Miscellaneous Functions]\n*   [String Functions]\n\n## Array Functions\n\n\
    Figure 6.36\n\n| Function | Description |\n| :--- | :--- |\n| Array | Returns\
    \ a variant containing an array |\n| Filter | Returns a zero-based array that\
    \ contains a subset of a string array based on a filter criteria |\n| IsArray\
    \ | Returns a Boolean value that indicates whether a specified variable is an\
    \ array |\n| Join | Returns a string that consists of a number of substrings in\
    \ an array |\n| LBound | Returns the smallest subscript for the indicated dimension\
    \ of an array |\n| Split | Returns a zero-based, one-dimensional array that contains\
    \ a specified number of substrings |\n| UBound | Returns the largest subscript\
    \ for the indicated dimension of an array |\n\n## Conversion Functions\n\nFigure\
    \ 6.37\n\n| Function | Description |\n| :--- | :--- |\n| Asc | Converts the first\
    \ letter in a string to American National Standards Institute (ANSI) code |\n\
    | CBool | Converts an expression to a variant of subtype Boolean |\n| CByte |\
    \ Converts an expression to a variant of subtype Byte |\n| CCur | Converts an\
