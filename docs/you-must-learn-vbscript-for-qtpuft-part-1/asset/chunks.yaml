    Preface


    * * *


    I must admit, it was a challenge writing this VBScript for QTP/UFT book. The challenge
    stems from an unlimited access to information on the internet. All of the information
    in this book can be found scattered throughout search engines, blogs, etc. However,
    if you are searching for one consolidated resource, then this is the book for
    you.


    Target Audience


    The target audience is beginners and mid-level automation engineers. Beginners
    are people new to QTP/UFT who need to learn more than the basics of VBScript.
    Mid-level automation engineers are people with knowledge of VBScript, but want
    to refresh their programming skills. No prior knowledge of VBScript or programming
    concepts is required. However, a common myth regarding QTP/UFT is that development
    skills are not necessary. The truth is development skills are very necessary.


    Why learn VBScript?


    Can you imagine traveling to a foreign country and trying to communicate with
    the native people without learning their language? That is similar to communicating
    with QTP/UFT without learning VBScript. The purpose of this book is to help automation
    engineers understand that QTP/UFT cannot be fully optimized without a strong foundation
    of VBScript. A mistake most QTP/UFT books and training courses make is not providing
    solid information on the VBScript programming language. These books and training
    courses focus solely on QTP/UFT, which leads to automation engineers struggling
    with automation projects. Automation is the future of testing applications. Take
    this opportunity to learn VBScript.


