    Access Arrays


    Subscripts must be used to read from or write to an array element. A One-Dimensional
    Array is described as [one element per one value](#index_split_012.html_filepos115019).
    A subscript resembles the column letter and row number syntax from a spreadsheet
    or x and y axis. The x axis is a horizontal line and the y axis is a vertical
    line. Let us view examples of reading from an element and writing to an element:


    Read From an Array Element


    Figure 4.38


    ![](images/00123.jpg)


    Option Explicit


    Dim arrName(1, 2)


    ''First Row


    arrName(0,0) = "James"


    arrName(1,0) = "Jones"


    ''Second Row


    arrName(0,1) = "Janice"


    arrName(1,1) = "Smith"


    ''Third Row


    arrName(0,2) = "Jane"


    arrName(1,2) = "Doe"


    MsgBox arrName(0, 0)


    The output returns “James.”


    Figure 4.39


    ![](images/00105.jpg)


    Write To an Array Element


    Figure 4.40


    ![](images/00045.jpg)


    Option Explicit


    Dim arrName()


    ''First Row


    ReDim Preserve arrName(1,0)


    arrName(0,0) = "James"


    arrName(1,0) = "Jones"


    ''Second Row


    ReDim Preserve arrName(1,1)


    arrName(0,1) = "Janice"


    arrName(1,1) = "Smith"


    ''Third Row


    ReDim Preserve arrName(1,2)


    arrName(0,2) = "Jane"


    arrName(1,2) = "Doe"


    ''Add 4th row 


    ReDim Preserve arrName(1,3)


    arrName(0, 3) = "Rex"


    arrName(1, 3) = "Allen"


    MsgBox arrName (0,3)


    The output returns “Rex.” The array type changed to dynamic, while “ReDim Preserve”
    is added to populate the array.


    Figure 4.42


    ![](images/00108.jpg)


    Loop-Through Arrays


    The upper-bound is known when dealing with Static Arrays. It is easy to move through
    a Static Array because the Programmer knows how many times to iterate all of the
    indexes. Imagine someone wanting to view all of the items in [Figure 4.43](#index_split_012.html_filepos144070).
    They will not have to write the following code:


    Figure 4.43


    | James |


    | Janice |


    | Jane |


    Figure 4.44


    ![](images/00025.jpg)


    Option Explicit


    Dim arrName(2)


    arrName(0) = "James"


    arrName(1) = "Janice"


    arrName(2) = "Jane"


    MsgBox arrName(0) = "James"


    MsgBox arrName(1) = "Janice"


    MsgBox arrName(2) = "Jane"


    The first output displays “James”, second output displays “Janice”, and third
    output displays “Jane”


    Figure 4.45


    ![](images/00169.jpg)![](images/00115.jpg)![](images/00118.jpg)


    All of the items are displayed, but there is a better way to display all of the
    items. We can use the “[For Loop](#index_split_013.html_filepos172334),” which
    will be explained in [Chapter 5](#index_split_013.html_filepos149668). The For
    Loop runs a line or group of lines of code a specific number of times. The following
    is an example of the For Loop to view all of the items:


    Figure 4.46


    ![](images/00092.jpg)


    Option Explicit


    Dim i


    Dim arrName(2) 


    arrName(0) = "James"


    arrName(1) = "Janice"


    arrName(2) = "Jane"


    For i = 0 to 2


         MsgBox arrName(i)


    Next


    The first output displays “James”, second output displays “Janice”, and third
    output displays “Jane”


    Figure 4.47


    ![](images/00169.jpg)![](images/00115.jpg)![](images/00118.jpg)


    The letter “i” is a variable used to keep track of the row inside of the loop.
    It is represented in the “MsgBox” for each iteration. As a result, i represents
    the zero in the first iteration, one in the second iteration, and two in the third
    iteration.


    In addition, LBound and UBound functions are more efficient for traversing through
    an array by eliminating hard-coding values. The previous example will work as
    follows:


    Figure 4.48


    ![](images/00021.jpg)


    Option Explicit


    Dim i


    Dim arrName(2) 


    arrName(0) = "James"


    arrName(1) = "Janice"


    arrName(2) = "Jane"


    For i = LBound(arrName) to UBound(arrName)


         MsgBox arrName(i)


    Next


    The first output displays “James”, second output displays “Janice”, and third
    output displays “Jane”


    Figure 4.49'
