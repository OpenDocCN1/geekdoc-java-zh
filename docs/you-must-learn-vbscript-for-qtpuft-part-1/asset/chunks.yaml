    对象等效运算符 (Is) 当 `Object1` 和 `Object2` 引用相同的内存位置时，返回 `True`。以下是对象等效运算符 (Is) 的示例：


    ### 语法

    ```

    Result = Object1 Is Object2

    ```


    ### 强制声明

    ```vb

    Dim x, y, z

    Dim intSameNumber

    x = 11

    y = 21

    z = "1 on another level"

    Set x = CreateObject("Scripting.Dictionary")

    Set y = CreateObject("Scripting.Dictionary")

    Set z = CreateObject("Scripting.Dictionary")

    Set x = z

    Set y = z

    intSameNumber = x Is y

    MsgBox intSameNumber

    ```

    答案是“True.”。


    图 3.23

    ![](img/00164.jpg)


    注意：对象等效运算符 (Is) 不比较值，也不比较一个对象与另一个对象。相反，它检查同一个表达式中的两个对象（`x` 和 `y`）是否引用了同一个对象（`z`），即同一个内存位置。


    ## 逻辑运算符

    逻辑运算符用于对表达式执行逻辑操作。通常在控制语句中找到逻辑运算符，以控制程序的流程。每个操作数被视为一个决策，允许程序做出判断。以下是各种逻辑运算符的类型，按优先级排序如下：


    * 逻辑非 (Not)

    * 逻辑与 (And)

    * 逻辑或 (Or)

    * 逻辑异或 (Xor)

    * 逻辑等价 (Eqv)

    * 逻辑蕴含 (Imp)


    ### 逻辑非 (Not)

    逻辑非运算符 (Not) 返回表达式的逻辑取反。如果表达式为 `False`，结果为 `True`；如果表达式为 `True`，结果为 `False`。如果表达式为
    `Null`，则返回 `Null`。以下是逻辑非运算符的示例：


    ### 语法

    ```

    Result = Not Expression

    ```


    ### 强制声明

    ```vb

    Dim x, y

    x = 10

    y = Not (x < 20)

    MsgBox y

    ```

    答案是“False.”。


    图 3.24

    ![](img/00168.jpg)


    以下是逻辑非运算符 (Not) 的真值表：


    图 3.25

    | 表达式 | 结果 |

    | :--- | :--- |

    | True | False |

    | False | True |

    | Null | Null |


    ### 逻辑与 (And)

    逻辑与运算符 (And) 当两个表达式都为 `True` 时返回 `True`，否则返回 `False`。以下是逻辑与运算符的示例：


    ### 语法

    ```

    Result = Expression1 And Expression2

    ```


    ### 强制声明

    ```vb

    Dim x, y, z

    x = 10

    y = 15

    z = x > 4 And y <= 20

    MsgBox z

    ```

    答案是“True.”。


    图 3.26

    ![](img/00171.jpg)


    以下是逻辑与运算符 (And) 的真值表：


