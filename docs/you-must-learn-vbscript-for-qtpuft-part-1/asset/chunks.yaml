    # Chapter 7 Create and Destroy Objects


    Objects are different from other Sub Data Types because they need to be created
    explicitly with a separate command. Like variables, objects have a location in
    memory, but the object’s variable hold a reference to the object.


    Chapter seven will cover the following principles of objects:


    *   `Create Objects`

    *   `Properties and Methods`

    *   `Multiple References`

    *   `With Construct`

    *   `Destroy Objects`


    Note: All of the examples in this chapter use a Dictionary Object (see Dictionary
    Objects in Chapter 2 “Part 2 - You Must Learn VBScript for QTP – UFT”.)

