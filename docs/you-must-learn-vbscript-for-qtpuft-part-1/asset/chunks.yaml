  trans: "\n\n![](img/00159.jpg)\n\n### 显式声明\n\n```vbba\nOption Explicit\nDim arrAge\n\
    arrAge = Array(7, 14, 21, 28, 34)\nMsgBox arrAge(4)\n```\n输出返回“34。”\n\n图 4.25\n\
    \n![](img/00080.jpg)\n\n图 4.26\n\n![](img/00008.jpg)\n\n```vbba\nOption Explicit\n\
    Dim arrAge\narrAge = Array(7, 14, 21, 28, 34)\nReDim arrAge (8)\nMsgBox arrAge\
    \ (4)\n```\n输出返回一个空值。\n\n图 4.27\n\n![](img/00058.jpg)\n\n消息框将显示一个空值。有时丢失数据是好事，但有时并不好。在不宜丢失数据时，请使用\
    \ `Preserve` 关键字。`Preserve` 确保之前存储在数组中的数据在调整大小时保留。以下是使用 `Preserve` 关键字的示例：\n\n\
    图 4.28\n\n![](img/00142.jpg)\n\n```vbba\nOption Explicit\nDim arrAge\narrAge =\
    \ Array(7, 14, 21, 28, 34)\nMsgBox arrAge(4)\n```\n输出返回“34。”\n\n图 4.29\n\n![](img/00080.jpg)\n\
    \n图 4.30\n\n![](img/00015.jpg)\n\n```vbba\nOption Explicit\nDim arrAge\narrAge\
    \ = Array(7, 14, 21, 28, 34)\nReDim Preserve arrAge(8)\nMsgBox arrAge(4)\n```\n\
    输出仍然返回“34。”\n\n图 4.31\n\n![](img/00080.jpg)\n\n### 清除数组\n\n使用 `Erase` 语句可以清空数组。它对静态数组和动态数组有不同的影响。对于静态数组，`Erase`\
    \ 语句仅删除项目的内容，而数组的下界和上界不变。对于动态数组，`Erase` 语句会完全删除数组分配的内存。元素被销毁，数据被删除。变量仍然存在，但边界不再存在。程序员必须再次对变量使用\
    \ `ReDim` 语句，边界才会返回。以下是 `Erase` 语句的示例：\n\n```vbba\nErase arrAge\n```\n\n### 拆分数组\n\
    \n`Split` 函数允许拆分静态或动态数组中的索引值。它使用一个分隔符将字符串拆分为子字符串，然后将子字符串分配给数组索引。程序员指定字符串和分隔符作为\
    \ `Split` 函数的参数。`Split` 函数返回一个从零开始的一维数组，包含指定数量的子字符串。以下是 `Split` 函数的示例：\n\n####\
    \ 语法\n\n```vbba\nSplit (Expression[, Delimiter[, Count[, Compare]]])\n```\n\n\
    图 4.32\n\n| 参数 | 说明 |\n| :--- | :--- |\n| Expression | 表达式是一个包含子字符串和分隔符的字符串，在\
    \ `Split` 函数中必须的 |\n| Delimiter | 分隔符是用于识别子字符串边界的字符，在 `Split` 函数中可选。默认值为空格 |\n\
    | Count | 计数是 `Split` 函数中返回的子字符串数量，可选的。-1 表示返回所有子字符串 |\n| Compare | Compare 是可选的，指定用于比较的以下值之一：0\
    \ = vbBinaryCompare：执行二进制比较 1 = vbTextCompare：执行文本比较 |\n\n图 4.33\n\n![](img/00035.jpg)\n\
    \n```vbba\nOption Explicit\nDim arrColors\narrColors = Split(\"Black, White, Red\"\
    , \",\")\nMsgBox arrColors(0)\n```\n由于索引为 0，输出返回“Black,”。索引 1 是“White”，索引 2 是“Red。”\n\
    \n图 4.34\n\n![](img/00097.jpg)\n\n### 合并数组\n\n`Join` 函数将每个数组索引包含的子字符串合并为一个字符串，并将该字符串分配给变量。该变量将不是数组而是字符串类型（String\
    \ Subtype）。此函数执行 `Split` 函数相反的任务。以下是 `Join` 函数的示例：\n\n#### 语法\n\n```vbba\nJoin\
    \ (List[, Delimiter])\n```\n\n图 4.35\n\n| 参数 | 说明 |\n| :--- | :--- |\n| List |\
    \ 列表是一个包含要合并子字符串的一维数组，是必须的 |\n| Delimiter | 分隔符是用于在 `Join` 函数返回的字符串中分隔子字符串的字符，是的。默认为空格\
    \ |\n\n图 4.36\n\n![](img/00070.jpg)\n\n```vbba\nOption Explicit\nDim strColors\n\
    Dim arrColors(2)\narrColors(0) = \"Black\"\narrColors(1) = \"White\"\narrColors(2)\
    \ = \"Red\"\nstrColors = Join(arrColors)\nMsgBox strColors\n```\n在合并 `arrColors`\
    \ 索引中的子字符串后，输出返回“Black White Red”，并将结果分配给 `strColors`。\n\n图 4.37\n\n![](img/00101.jpg)\n\
    \n### 访问数组\n\n必须使用下标从数组元素中读取或写入数据。一维数组被描述为每个值一个元素。下标类似于电子表格中的列和行号，或 x 和 y 轴。x\
    \ 轴是水平线，y 轴是垂直线。让我们查看从元素读取和写入元素的示例：\n\n#### 从数组读取\n\n图 4.38\n\n![](img/00123.jpg)\n\
    \n```vbba\nOption Explicit\nDim arrName(1,2)\narrName(0,0) = \"James\"\narrName(1,0)\
    \ = \"Jones\"\narrName(0,1) = \"Janice\"\narrName(1,1) = \"Smith\"\narrName(0,2)\
    \ = \"Jane\"\narrName(1,2) = \"Doe\"\nMsgBox arrName(0,0)\n```\n输出返回“James。”\n\
    \n图 4.39\n\n![](img/00105.jpg)\n\n#### 写入元素\n\n图 4.40\n\n![](img/00045.jpg)\n\n\
    ```vbba\nOption Explicit\nDim arrName()\nReDim Preserve arrName(1,0)\narrName(0,0)\
    \ = \"James\"\narrName(1,0) = \"Jones\"\nReDim Preserve arrName(1,1)\narrName(0,1)\
    \ = \"Janice\"\narrName(1,1) = \"Smith\"\nReDim Preserve arrName(1,2)\narrName(0,2)\
    \ = \"Jane\"\narrName(1,2) = \"Doe\"\nReDim Preserve arrName(1,3)\narrName(0,3)\
    \ = \"Rex\"\narrName(1,3) = \"Allen\"\nMsgBox arrName(0,3)\n```\n输出返回“Rex。”数组类型变为动态，添加了\
    \ `Preserve`。\n\n图 4.42\n\n![](img/00108.jpg)\n\n### 遍历数组\n\n在处理静态数组时，上界是已知的，可以遍历静态数组。想象你想查看图\
    \ 4.43 中的所有项。编写以下代码：\n\n图 4.43\n\n| James |\n| Janice |\n| Jane |\n\n图 4.44\n\n\
    ![](img/00025.jpg)\n\n```vbba\nOption Explicit\nDim arrName(2)\narrName(0) = \"\
    James\"\narrName(1) = \"Janice\"\narrName(2) = \"Jane\"\nMsgBox arrName(0)\nMsgBox\
    \ arrName(1)\nMsgBox arrName(2)\n```\n第一个输出返回“James”，第二个输出返回“Janice”，第三个输出返回“Jane”。\n\
    \n图 4.45\n\n### 4.46 遍历数组\n\n所有项都显示了，但有更好的方法显示所有项。我们可以使用 `For` 循环，它将在第 5 章解释。`For`\
    \ 循环按指定的次数运行一行或一组代码。以下是查看所有项的 `For` 循环示例：\n\n图 4.46\n\n![](img/00092.jpg)\n\n\
    ```vbba\nOption Explicit\nDim i\nDim arrName(2)\narrName(0) = \"James\"\narrName(1)\
    \ = \"Janice\"\narrName(2) = \"Jane\"\nFor i = 0 to 2\n    MsgBox arrName(i)\n\
    Next\n```\n第一个输出返回“James”，第二个输出返回“Janice”，第三个输出返回“Jane”。\n\n图 4.47\n\n### 4.48\n\
    \n字母 `i` 是用于跟踪循环内部行数的变量。它在每次迭代中都体现在 `MsgBox` 中。作为结果，`i` 在第一次迭代中代表 0，第二次迭代中代表 1，第三次迭代中代表\
    \ 2。\n\n此外，`LBound` 和 `UBound` 函数通过消除硬编码值，在遍历数组时更有效。之前的示例工作如下：\n\n图 4.48\n\n![](img/00021.jpg)\n\
    \n```vbba\nOption Explicit\nDim i\nDim arrName(2)\narrName(0) = \"James\"\narrName(1)\
    \ = \"Janice\"\narrName(2) = \"Jane\"\nFor i = LBound(arrName) to UBound(arrName)\n\
    \    MsgBox arrName(i)\nNext\n```\n"
- fmt: "\n![](images/00169.jpg)[](images/00115.jpg)[](images/00118.jpg)\n\nAnother\
    \ method for looping through arrays is the “For Each…Next Statement.” The For\
    \ Each…Next Statement is a loop, which repeats a group of statements for each\
    \ item in an array without using `LBound` and `UBound` functions. The For Each…Next\
    \ Statement will be explained in [Chapter 5](#index_split_013.html_filepos149668).\
    \ The following is an example of the For Each…Next Loop:\n\nFigure 4.50\n\n![](images/00023.jpg)\n\
    \n```vbscript\nOption Explicit\n\nDim strName\nDim arrName(2) \n\narrName(0) =\
    \ \"James\"\narrName(1) = \"Janice\"\narrName(2) = \"Jane\"\n\nFor Each strName\
    \ In arrName\n    MsgBox strName\nNext\n```\n\nThe first output displays “James”,\
    \ second output displays “Janice”, and third output displays “Jane”\n\nFigure\
    \ 4.51\n\n![](images/00169.jpg)[](images/00115.jpg)[](images/00118.jpg)\n\nChapter\
    \ 4 went into detail regarding Arrays. Arrays can be Static or Dynamic while being\
    \ read from or written to an element. [Chapter 5](#index_split_013.html_filepos149668)\
    \ will explain the Flow Control’s Branching Construct and Looping Statement.\n\
    \n# Chapter 5 Flow Control\n\nVBScript executes from a top–down concept. It starts\
    \ at the top of a script then processes one line at a time until reaching the\
    \ end of the script. Logic forces some lines to be skipped due to branching, while\
    \ other lines are executed more than once because of looping.\n\nThis chapter\
    \ covers:\n\n*   [Branching Constructs](#index_split_013.html_filepos150405)\n\
    *   [Looping Statements](#index_split_013.html_filepos171044)\n\n## Branching\
    \ Constructs\n\nBranching is the process of making a decision and executing one\
    \ block of code based on that decision. The two constructs for branching are “If…End\
    \ If” (If statement) and “Select…End Select” (Select statement). Both of the constructs\
    \ are used to define a code block secured by beginning and ending statements.\
    \ The If block requires a beginning statement of `If` and an ending statement\
    \ of `End If`. The Select block follows a similar pattern which requires a beginning\
    \ statement of `Select` and an ending statement of `End Select`. A syntax error\
    \ occurs at runtime if the required statements are not entered.\n\n### “If” Block\
    \ Branch\n\nThe `If` statement executes a set of code when a condition is True.\
    \ The If statement is one of the most common structures programmers use when writing\
    \ code. The following is the syntax for an If block:\n\n#### Syntax\n\n```vbscript\n\
    If <condition> Then\n    <statement>\nEnd If\n```\n\n----------------------------------\n\
    \nAnything that results in True or False can be used in place of `<condition>.\
    \ True or False answers are called Boolean expressions. The following is a few\
    \ If construct examples:\n\nFigure 5.1\n\n![](images/00014.jpg)\n\n```vbscript\n\
    Option Explicit\n\nIf 10 + 5 = 15 Then\n    MsgBox \"The answer is correct\"\n\
    End If\n```\n\nThe output displays “The answer is correct”\n\nFigure 5.2\n\n![](images/00122.jpg)\n\
    \nFigure 5.3\n\n![](images/00050.jpg)\n\n```vbscript\nOption Explicit\n\nDim strFirstName\n\
    strFirstName = \"Rex\"\n\nIf strFirstName = \"Rex\"\n    MsgBox \"First Name \"\
    \ & strFirstName & \" is correct\"\nEnd If\n```\n\nThe output displays “First\
    \ Name Rex is correct”\n\nFigure 5.4\n\n![](images/00126.jpg)\n\nFigure 5.5\n\n\
    ![](images/00093.jpg)\n\n```vbscript\nOption Explicit\n\nDim strFirstName, strLastName\n\
    strFirstName = \"Joe\"\nstrLastName = \"Doe\"\n\nIf strFirstName = \"Joe\" and\
    \ (strLastName = \"Doe\" or strLastName = \"Blow\") Then\n    MsgBox \"First Name\
    \ is \" & strFirstName & \"and Last Name is \" & strLastName \nEnd If\n```\n\n\
    The output displays “First Name is Joe and Last Name is Doe”\n\nFigure 5.6\n\n\
    ![](images/00130.jpg)\n\n### Else Block Branch\n\nThe “Else” block can be added\
    \ as another dimension to the If construct. It will be executed if the result\
    \ of the If condition is False. The following is an example of the Else block:\n\
    \n#### Syntax\n\n```vbscript\nIf <condition> Then\n    <statement>\nElse\n   \
    \ <statement>\nEnd If\n```\n\n----------------------------------\n\nFigure 5.7\n\
    \n![](images/00063.jpg)\n\n```vbscript\nOption Explicit\n\nDim strFirstName, strLastName\n\
    strFirstName = \"James\"\nstrLastName = \"Doe\"\n\nIf strFirstName = \"Joe\" Then\n\
    \    MsgBox \"First Name is \" & strFirstName \nElse\n    MsgBox \"First Name\
    \ is not Joe but \" & strFirstName \nEnd If \n```\n\nThe output displays “First\
    \ Name is not Joe but James”\n\nFigure 5.8\n\n![](images/00136.jpg)\n\n### Else-If\
    \ Block Branch\n\nThere are times when decisions require more than an either/or\
    \ evaluation. In this case, the programmer can add several Else-If blocks. The\
    \ following is an example of the Else-If block:\n\n#### Syntax\n\n```vbscript\n\
    If <condition> Then \n    <statement>\nElseIf <condition> Then         \n    <\
    \ statement>\nElseIf <condition> Then\n    <statement>\nElse\n    <statement>\n\
    End If\n```\n\n----------------------------------\n\nFigure 5.9\n\n![](images/00001.jpg)\n\
    \n```vbscript\nOption Explicit\n\nDim strColor\nstrColor = \"Purple\"\n\nIf strColor\
    \ = \"Black\" Then\n    MsgBox \"Black is a dark color\"\nElseIf strColor = \"\
    Green\" Then\n    MsgBox \"Green is a nice color\"\nElseIf strColor = \"Purple\"\
    \ Then\n    MsgBox \"Purple is a pretty color\"\nElse\n    MsgBox \"The color\
    \ is not Black, or Purple\"\nEnd If\n```\n\nThe output displays “Purple is a pretty\
    \ color”\n\nFigure 5.10\n\nimages/0079.jpg)\n\nThe execution moves to the first\
    \ Else-If if the first condition returns False. If the first Else-If evaluation\
    \ returns False, the execution moves to the second Else-If. Finally, the execution\
    \ moves to the Else block if the second Else-If evaluation returns False. Each\
    \ Else-If line must end with Then, just like the If statement. The Else block\
    \ is optional and always executes last. Else-If constructs are flexible because\
    \ each Else-If line can evaluate a different expression. The following is an example\
    \ of the Else- block evaluating a unique condition without the Else block:\n\n\
    ```vbscript\nIf <condition> Then\n    <statement>\nElseIf <condition> Then\n \
    \   <statement>\nElseIf <condition> Then\n    <statement>\nEnd If\n```\n\n----------------------------------\n\
    \nFigure 5.11\n\nimages/0144.jpg)\n\n```vbscript\nOption Explicit\n\nDim intNumber\n\
    intNumber = 0\n\nIf IsNull(intNumber) Then\n    MsgBox \"The variable IsNull\"\
    \nElseIf IsEmpty(intNumber) Then\n    MsgBox \"The variable IsEmpty\"\nElseIf\
    \ IsNumeric(intNumber) Then\n    MsgBox \"The variable IsNumeric\"\nEnd If\n```\n\
    \nThe output displays “The variable IsNumeric”\n\nFigure 5.12\n\nimages/0104.jpg)\n\
    \n### Nested If Branch\n\nProgrammers can add If…End blocks within each other.\
    \ The following is an example of a nested If statement:\n\n#### Syntax\n\n```vbscript\n\
    If <condition> Then\n    If <condition> Then\n        <statement>\n    ElseIf\
    \ <condition> Then\n        <statement>\n    ElseIf <condition> Then\n       \
    \ <statement>\n    Else\n        <statement>\n    End If\nElse\n    <statement>\n\
    End If\n```\n\n----------------------------------\n\nFigure 5.13\n\nimages/0078.jpg)\n\
    \n```vbscript\nOption Explicit\n\nDim intNumber\nintNumber = 1000\n\nIf IsNumeric(intNumber)\
    \ Then\n    If intNumber > 0 and intNumber < 100 Then\n        MsgBox \"The number\
    \ is greater than zero and less than 100\"\n    ElseIf intNumber > 100 and intNumber\
    \ < 1000 Then\n        MsgBox \"The number is a greater than 100 and less than\
    \ 1000\"\n    ElseIf intNumber >= 1000 Then\n        MsgBox \"The number is greater\
    \ than or equal to 1000\"\n    Else\n        MsgBox \"The number is a negative\
    \ number\"\n    End If\nElse\n    MsgBox \"The variable is NOT Numeric\"\nEnd\
    \ If\n```\n\nThe output displays “The number is greater than or equal to 1000”\n\
    \nFigure 5.14\n\n![](images/0125.jpg)\n\n### Select Case Block Branch\n"
