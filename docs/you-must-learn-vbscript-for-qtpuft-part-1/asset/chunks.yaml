    \ + intSecondNumber + intThirdNumber\nEnd Function\n```\nThe output displays “6.”\n\
    \nFigure 6.24\n![](images/00181.jpg)\n### Syntax\n```vbba\nvariable = NameOfFunctionProcedure\
