    only the remainder. The following is an example of the Modulus Arithmetic Operator:


    Syntax


    Result = Number1 Mod Number2


    ----------------------------------


    Option Explicit


    Dim x


    x = 12 Mod 10


    MsgBox x


    The answer is 2.


    Figure 3.8


    ![](images/00109.jpg)


    Note: Numbers are rounded to integers if they are floating point numbers. Empty
    expressions are treated as a zero (0). The result is Null if one or both expressions
    are Null.


    Addition


    The Addition Operator (+) is used to add numbers and join strings. The following
    is an example of the Addition Operator:


    Syntax


    Result = Number1 + Number2


    ----------------------------------


    Option Explicit


    Dim x


    x = 3 + 4 


    MsgBox x


    The answer is 7.


    Figure 3.9


    ![](images/00113.jpg)


    Note:  The result is an integer if both expressions are Empty. However, if one
    expression is Empty, then the other expression is unchanged. The result is Null
    if one or both expressions are Null. Expressions determine the Addition Operator’s
    (+) behavior. If strings are involved, then the Addition Operator will combine
    the strings like the [Concatenation Operator](#index_split_011.html_filepos82711)
    (&). The following is an example of the Addition Operator combining strings together:


    Option Explicit


    Dim strFirstName, strLastName


    strFirstName = "John"


    strLastName = "Doe"


    MsgBox "A common fake name is " + strFirstName + " " + strLastName


    The output displays “A common fake name is John Doe.”


    Figure 3.10


    ![](images/00116.jpg)


    The following is a Success Table that shows different types of expressions:


    Figure 3.11


    | If | Then |


    | Both expressions are numeric | Add |


    | Both expressions are strings | Concatenate |


    | One expression is numeric and the other is a string | Error: Type Mismatch |


    Subtraction


    The Subtraction Operator (-) is used to find the difference between two numbers.
    The following is an example of the Subtraction Operator:


    Syntax


    Result = Number1 – Number2


    ----------------------------------


    Option Explicit


    Dim x


    x = 37 - 3


    MsgBox x


    The answer is 34.


    Figure 3.12


    ![](images/00119.jpg)


    Note: Empty expressions are treated as a zero (0). The result is Null if one or
    both expressions are Null.


    Concatenation


    The Concatenation Operator (&) is used to force a concatenation of expressions.
    The following is an example of the Concatenation Operator:


    Syntax


    Result = Expression1 & Expression2


    ----------------------------------


    Option Explicit


    Dim strFirstName, strLastName


    strFirstName = "Rex"


    strLastName = "Jones II"


    MsgBox "The author of this eBook is " & strFirstName & " " & strLastName & "."


    The answer is “The author of this eBook is Rex Jones II.”


    Figure 3.13


    ![](images/00124.jpg)


    Note: Non-String expressions are converted to strings. If both expressions are
    Null, then the result is also Null. However, if only one expression is Null, then
    that expression is treated as a zero-length string (" ") when concatenated with
    the other expression. A zero-length string is given a blank value—no value. Any
    expression that is Empty is also treated as a zero-length string.


    Comparison Operators


    Comparison operators allow the programmer to compare two expressions. Comparison
    Operators test whether two expressions are True or False. Therefore, the data
    type of a Comparison Operator is Boolean. The following is a Success Table, which
    is a guideline for comparing expressions:


    Figure 3.14


    | If | Then |


    | Both expressions are numeric | Perform a numeric comparison |


    | Both expressions are strings | Perform a string comparison |


    | One expression is numeric and the other is a string | The numeric expression
    is less than the string expression |


    | One expression is Empty and the other is numeric | Perform a numeric comparison,
    using zero (0) as the Empty expression |


    | One expression is Empty and the other is a string | Perform a string comparison,
    using a zero-length string ("") as the Empty expression |


    | Both expressions are Empty | The expressions are equal |


    The following is a list of each Comparison Operator in order of precedence:


    *   [Equality](#index_split_011.html_filepos87048)


    *   [Inequality](#index_split_011.html_filepos88007)


    *   [Less Than](#index_split_011.html_filepos89026)


    *   [Greater Than](#index_split_011.html_filepos90000)


    *   [Less Than or Equal To](#index_split_011.html_filepos90992)


    *   [Greater Than or Equal To](#index_split_011.html_filepos92603)


    *   [Object Equivalence (Is)](#index_split_011.html_filepos94217)


    Equality


    The Equality Operator (=) returns True if Expression1 equals Expression2, and
    returns False otherwise. The following is an example of the Equality Operator:


    Syntax


    Expression1 = Expression2


    ----------------------------------


    Option Explicit


    Dim x, y x = 34


    y = 34


    If x = y Then


        MsgBox x & "equals " & y


    End If


    The expression is a true statement that displays 34 equals 34.


    Figure 3.15


    ![](images/00128.jpg)


    Inequality


    The Inequality Operator (<>) returns True if Expression1 does not equal Expression2,
    and returns False otherwise. The following is an example of the Inequality Operator:


    Syntax


    Expression1 <> Expression2


    ----------------------------------


    Option Explicit


    Dim x, y


    x = 34


    y = 38


    If x <> y Then


        MsgBox x & "does not equal" & y


    End If


    The expression is a true statement that displays 34 does not equal 38.


    Figure 3.16


    ![](images/00133.jpg)


    Less Than


    The Less Than Operator (<) returns True if Expression1 is less than Expression2,
    and returns False otherwise. The following is an example of the Less Than Operator:


    Syntax


    Expression1 < Expression2


    ----------------------------------


    Option Explicit


    Dim x, y


    x = 34


    y = 38


    If x < y Then


        MsgBox x & "is less than" & y


    End If


    The expression is a true statement that displays 34 is less than 38.


    Figure 3.17


    ![](images/00138.jpg)


    Greater Than


    The Greater Than Operator (>) returns True if Expression1 is greater than Expression2,
    and returns False otherwise. The following is an example of the Greater Than Operator:


    Syntax


    Expression1 > Expression2


    ----------------------------------


    Option Explicit


    Dim x, y


    x = 38


    y = 34


    If x > y Then


        MsgBox x & "is greater than" & y


    End If


    The expression is a true statement that displays 38 is greater than 34.


    Figure 3.18


    ![](images/00143.jpg)


    Less Than or Equal To


    The Less Than or Equal To Operator (<=) returns True if Expression1 is less than
    or equal to Expression2, and returns False otherwise. The following is an example
    of the Less Than or Equal To Operator:


    Syntax


    Expression1 <= Expression2


    ----------------------------------


    Option Explicit


    Dim x, y


    x = 34


    y = 34


    If x <= y Then


        MsgBox x & "is less than or equal to" & y


    End If


    The expression is a true statement that displays 34 is less than or equal to 34.


    Figure 3.19


    ![](images/00148.jpg)


    Option Explicit


    Dim x, y


    x = 34


    y = 38


    If x <= y Then


        MsgBox x & "is less than or equal to" & y


    End If


    The expression is a true statement that displays 34 is less than or equal to 38.


    Figure 3.20


    ![](images/00153.jpg)


    Greater Than or Equal To


    The Greater Than or Equal To Operator (>=) returns True if Expression1 is greater
    than or equal to Expression2, and returns False otherwise. The following is an
    example of the Greater Than or Equal To Operator:


    Syntax


    Expression1 >= Expression2


    ----------------------------------


    Option Explicit


    Dim x, y


    x = 34


    y = 34


    If x >= y Then


        MsgBox x & "is greater than or equal to" & y


    End If


    The expression is a true statement that displays 34 is greater than or equal to
    34.


    Figure 3.21


    ![](images/00156.jpg)


    Option Explicit


    Dim x, y


    x = 38


    y = 34


    If x >= y Then


        MsgBox x & "is greater than or equal to" & y


    End If


    The output displays “38 is greater than or equal to 34”


    Figure 3.22


    ![](images/00160.jpg)


