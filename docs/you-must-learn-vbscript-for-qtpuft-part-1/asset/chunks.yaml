    # Chapter 1 Introduction to VBScript


    ## Overview


    VBScript’s full name is Microsoft Visual Basic Scripting Edition language. It
    is a simplified version of the Visual Basic (VB) and Visual Basic for Applications
    (VBA) family of programming languages. VBScript’s syntax is based on Visual Basic’s
    syntax. Syntax is a set of rules that determine how the language will be written
    and interpreted by the browser or server. Most of VBScript’s features are taken
    from Visual Basic. Features, such as the control flows, operators, and procedures,
    are acceptable in the family of Visual Basic.


    Visual Basic is the full-blown programming language, while VBScript is the scaled
    down version that supports scripts. Processing is the main difference between
    a full-blown programming language and a scripting language. A scripting language
    has to reprocess every time it is run, but a full-blown programming language runs
    faster because it is only processed one time.


    VBScript is written for a runtime environment that can interpret and automate
    tasks. It uses the Component Object Model to access elements of the environment
    within which it is running. Software applications, web pages within a browser,
    the shells of an operating system (OS), and embedded systems are example environments
    that can be automated. VBScript can be used in the following instances:


    *   Windows administrative tasks

    *   HTML pages, as a client-side scripting language

    *   Server-side scripting language, in native Application Service Provider (ASP)
    pages with Internet Information Services (IIS) web server

    *   Embedded applications

    *   Scripting language in Quick Test Professional (QTP)/Unified Functional Testing
    (UFT) for automation testing


    QTP/UFT uses VBScript as the scripting language for developing test scripts. An
    understanding of VBScript will help create and maintain test scripts in QTP/UFT.


    This chapter provides general principles rather than details about the building
    blocks of VBScript for QTP/UFT, and will explain the following:


    *   Variables

    *   Flow Control

    *   Coding Standards


    ## Variables


    Variables are storage locations in memory (see [Variables and Data Types in Chapter
    2](#index_split_010.html_filepos39305).). Scripts use variables to store data
    for later use.


    ## Flow Control

