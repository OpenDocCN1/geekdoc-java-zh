    \ day (between 0 and 23, inclusive) |\n| IsDate | Returns a Boolean value that\
    \ indicates if the evaluated expression can be converted to a date |\n| Minute\
    \ | Returns a number that represents the minute of the hour (between 0 and 59,\
    \ inclusive) |\n| Month | Returns a number that represents the month of the year\
    \ (between 1 and 12, inclusive) |\n| MonthName | Returns the name of a specified\
    \ month |\n| Now | Returns the current system date and time |\n| Second | Returns\
    \ a number that represents the second of the minute (between 0 and 59, inclusive)\
    \ |\n| Time | Returns the current system time |\n| Timer | Returns the number\
    \ of seconds since 12:00 AM |\n| TimeSerial | Returns the time for a specific\
    \ hour, minute, and second |\n| TimeValue | Returns a time |\n| Weekday | Returns\
    \ a number that represents the day of the week (between 1 and 7, inclusive) |\n\
    | WeekdayName | Returns the weekday name of a specified day of the week |\n| Year\
    \ | Returns a number that represents the year |\n\n## Format Functions\n\nFigure\
    \ 6.39\n"
