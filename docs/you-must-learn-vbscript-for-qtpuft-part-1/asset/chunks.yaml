    Code Modularization


    As more code is added to scripts, it becomes harder to read in one chunk. At some
    point, decisions will redirect the code by way of branching or loops. Consequently,
    the code gets more complex, making the introduction of errors easy. Poor layout
    of the code (also known as spaghetti code) makes things harder to find and fix.


    Modularization is a technique programmers use to manage the code’s complexity.
    It is the process of organizing code into modules, which can be considered building
    blocks. Procedures are used to achieve modularity. There are two types of procedures:
    Sub Procedure and Function Procedure.


    Sub Procedure


    Sub Procedure is a series of statements surrounded by the Sub and End Sub statements
    (see [Sub Procedure](#index_split_014.html_filepos202464) in Chapter 6 Procedures-Functions.)
    It can perform an action and take arguments (also known as parameters), but does
    not return a value. Actions carry out a task, such as adding numbers. Arguments
    are special variables used for procedures to provide data as input. The following
    is the syntax for a Sub Procedure:


    Syntax


    Sub NameOfSubProcedure()


        code  


    End Sub


    Sub NameOfSubProcedure ([Argument1], [ArgumentN])


        code


    End Sub


    Function Procedure


    Function Procedure is a series of statements surrounded by the Function and End
    Function Statements (see [Function Procedure](#index_split_014.html_filepos209589)
    in Chapter 6 Procedures-Functions.) It can perform an action, take arguments,
    and return a value. The value is returned by assigning a value to its name. The
    following is the syntax for a Function Procedure:


    Syntax


    Function NameOfFunctionProcedure()


        code      


        NameOfFunctionProcedure = some value


    End Function


    Function NameOfFunctionProcedure ([Argument1], [ArgumentN])


            code         


            NameOfFunctionProcedure = some value


    End Function


    Chapter 1 outlines the foundational principles of variables, flow control, and
    coding standards. [Chapter 2](#index_split_010.html_filepos39305) will explore
    variables and the Hungarian Naming Convention, as well the variable data types.


    Chapter 2 Variables and Data Types


    Variables are extremely important in VBScript. Variables hold data for the scripts.
    Every input, output, and process within the scripts use variables. Data within
    variables can be held for later use, while some variables are discarded as soon
    as they are used. Placing values into variables is called initializing. Values
    are placed into variables by default or from the application. The database is
    also used to store values within variables. The database could be a text file,
    an excel file, etc.


    This chapter will explain the following:


    *   [Variable Rules](#index_split_010.html_filepos40945)


    *   [Variable Types](#index_split_010.html_filepos41816)


    *   [Variable Lifetime/Scope](#index_split_010.html_filepos44914)


    *   [Declare Variables](#index_split_010.html_filepos53623)


    *   [Option Explicit](#index_split_010.html_filepos56958)


    *   [Data Types](#index_split_010.html_filepos39464)


    *   [Hungarian Naming Convention](#index_split_009.html_filepos33523)


    Variable Rules


    Variables can be used to hold values (x=3) or expressions (x = y + z). Make sure
    that the variable name is on the left and values are on the right when assigning
    values to variables. A variable can have a short name like “z” or a descriptive
    name like “strTestPage.” The following are some rules for variables:


    1.  Cannot exceed 255 characters


    2.  Underscore “_” is the only valid non-alphanumeric character


    3.  Must start with a letter (uppercase or lowercase)


    Variable Types


    There are three types of variables. The following is a list of each variable type:


    1.  [Scalar](#index_split_010.html_filepos42408)


    2.  [Array](#index_split_010.html_filepos42777)


    3.  [Constant](#index_split_010.html_filepos43270)


    Scalar


    Scalar variables contain only one value that can change before or during execution.
    The following example has a variable called “x,” with a value of “34.”


    Dim x


    x = 34


    Array


    Array variables contain multiple values (see [Arrays](#index_split_012.html_filepos110975)
    in Chapter 4.) The following example has a variable called “y” with a size of
    three, which stores four values.


    Dim y(3)


    y(0) = 4


    y(1) = 2


    y(2) = 6


    y(3) = 8


    Constant


    Constant variables contain values that cannot change before or during execution.
    The following example has a variable called “NUMBER,” with a value of “3” that
    will not change during execution.


    Const NUMBER = 3


    Generally, due to an accepted convention, the name of a constant is in all capital
    letters. Programmers can also declare multiple constants on one line, as follows:


    Const NUMBER = 3, NUMBER = 4


    Literals


    A literal is static (fixed) data that contains text, numbers, dates, or Boolean
    values. Boolean values hold values that can be True or False. Values such as True
    or False are literals that is not stored in a variable. However, a literal can
    also be stored in a variable. The following is an example of a literal:


    Option Explicit


    Dim datBirthday


    datBirthday = #05/09/12#


    MsgBox "Test For Success birthday is " & datBirthday


    The output displays “Test For Success birthday is 5/9/2012”


    Figure 2.1


    ![](images/00069.jpg)


    Variable Lifetime/Scope


    The lifetime of a variable depends on its existence. It can exist locally or globally.
    Local variables are declared within a procedure, while global variables are declared
    outside of a procedure. A procedure is a group of code lines in a script file
    that perform a specific task. When a Programmer declares a variable within a procedure,
    then the variable can only be accessed within that procedure. The variable is
    destroyed after the procedure exit. Exiting a procedure occurs when the procedure
    terminates or returns a value to the calling code. Local variables can have the
    same name in different procedures, because each variable is only recognized by
    that specific procedure. The following is an example of two procedures (Sub and
    Function) possessing a local variable with the same name:


    Figure 2.2


    ![](images/00054.jpg)


    Option Explicit


    Call DisplayOldCarColor


    MsgBox "My new car is" & ReturnNewCarColor


    Sub DisplayOldCarColor


             Dim strCarColor


             strCarColor = "blue"     


             MsgBox "My old car was" & strCarColor


    End Sub


    Function ReturnNewCarColor 


             Dim strCarColor


             strCarColor = "black"     


             ReturnNewCarColor = strCarColor


    End Function


    Figure 2.3


    ![](images/00186.jpg)![](images/00190.jpg)


    The first output displays “My old car was blue,” using local variable “strCarColor,”
    while second output displays “My new car is black,” using a local variable “strCarColor”
    with the same name.


    Global variables are variables declared outside of a procedure. All procedures
    can access global variables. As a result, they cannot have duplicate names. The
    lifetime of these variables begins when they are declared and ends when the program
    is closed. Variable lifetime and scope are interrelated. The following are three
    types/levels of variable scope:


    1.  [Script Level Scope](#index_split_010.html_filepos48005)


    2.  [Procedure Level Scope](#index_split_010.html_filepos49668)


    3.  [Class Level Scope](#index_split_010.html_filepos50952)


    Script Level Scope


    Script Level Scope (interrelated with global variable) is when the variable is
    available to all of the scripts in a script file. These variables are not declared
    in a procedure or class. The following is an example of a variable with script
    level scope:


    Figure 2.4


    ![](images/00031.jpg)


    Option Explicit


    Dim strFirstName


    strFirstName = "Rex"


    Call DisplayFirstName(strFirstName)


    Call Greet(strFirstName)'
