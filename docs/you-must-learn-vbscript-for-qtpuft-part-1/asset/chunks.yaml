  raw: 'The Until keyword repeats a block of statements as long as the condition is
    False. In other words, the statements are repeated until a condition becomes True.
    The following is the syntax for the Do Until…Loop and Do…Loop Until:


    Syntax


    Do Until condition


            <statement>         


            (Exit Do)


            <statement>


    Loop


    ----------------------------------


    Figure 5.42


    | Arguments | Description |


    | Do | A required argument that starts the Do Loop |


    | Until | A required argument that indicates the loop continues until the condition
    becomes True |


    | Condition | An expression that is True or False. Null conditions are treated
    as False |


    | Statement | A statement is repeated until a condition becomes True |


    | Exit Do | Forces a break out of the loop |


    | Loop | A required argument that ends the Do Loop definition |


    Figure 5.43


    ![](images/00064.jpg)


    Option Explicit


    Dim i


    i = 1


    Do Until i < 3 


            MsgBox "Iterator = " & i      


            i = i + 1


    Loop 


    MsgBox "Iterator is less than 3"


    The output displays “Iterator is less than 3”


    Figure 5.44


    ![](images/00055.jpg)


    The loop has a condition with the Do Statement. Therefore, a decision must be
    made for the statement to be executed. In this case, i is set to one with the
    statement “i = 1.” The condition “Do Until i < 3” will not execute because i,
    which equals one, is already less than three. The statement (MsgBox ”Iterator
    = “ & i) does not warrant an execution since the condition is True.The following
    is an example of the Do Until…Loop flowchart:


    Figure 5.45


    ![](images/00071.jpg)


    Syntax


    Do


            <statement>         


            (Exit Do)


            <statement>


    Loop Until condition


    ----------------------------------


    Figure 5.46


    ![](images/00102.jpg)


    Option Explicit


    Dim i


    i = 1


    Do


            MsgBox "Iterator = " & i       


            i = i + 1


    Loop Until i < 3 


    MsgBox "Iterator is less than 3"


    The first output displays “Iterator = 1” and the second output displays “Iterator
    is less than 3”


    Figure 5.47


    ![](images/00091.jpg)![](images/00114.jpg)


    The statement is executed at least one time because there is not a condition on
    the Do Statement. The iterator equals one by setting “i = 1,” producing the first
    output (Iterator = 1) by way of the statement ”MsgBox "Iterator = " & i.” The
    iterator increases to two with the statement “i = i + 1.” The condition “Loop Until i < 3”
    causes the loop to stop because two is less than three, which displays the second
    output “Iterator is less than 3.” On the other hand, the statement “MsgBox (Iterator
    = " & i)” would have been repeated if the condition “Loop Until i < 3” is false.
    The following is an example of the Do…Loop Until flowchart:


    Figure 5.48


    ![](images/00140.jpg)


    The advantage of the Do Loop is the versatility of using keywords While or Until
    and placing the keywords at the beginning or end of the loop. Generally, people
    choose one of the keywords for coding. An important question is whether the code
    should be executed at least once. If so, the condition will be placed at the end
    of the loop. If not, the condition will be placed at the beginning of the loop.


    Chapter 5 explained the Flow Control by covering the Branching Constructs and
    Looping Statements. [Chapter 6](#index_split_014.html_filepos199184) will go into
    detail regarding Procedures and Functions.


    Chapter 6 Procedures—Functions


    There are times when the terms procedures and functions are used interchangeably.
    For the sake of this chapter procedure will be the preferred term for sub and
    function, while function will be employed to reference Built-In Functions. Procedures
    allow programmers to modularize their code into named blocks of code that perform
    a specific task. Modularization describes complex code organized into modules,
    which increases the readability and clarity of the code. Modularization also creates
    an opportunity to reuse the same code. VBScript provides Built-In Functions for
    programmers, as well as permits programmers to write their own procedure (Sub
    and Function). Sub Procedure and Function Procedure involve three concepts:


    1.  Named Block of Code: Lines of code that are related in a logical manner and
    are used to perform a task. Procedures are called named blocks of code because
    they have a name with boundaries surrounding the code.


    2.  Calling Code: Code that calls a procedure. The main purpose of a procedure
    is to have a code call another block of code using a specific name.


    3.  Values: Some named blocks of code can return values to the calling code, while
    others cannot return values to the calling code. [Sub Procedures](#index_split_014.html_filepos202464)
    do not return values but [Function Procedures](#index_split_014.html_filepos209589)
    return values.


    It is best for procedures to carry out a single action. The code can possibly
    become difficult to write and read if it has more than one task. The following
    are some good and bad task examples:


    Good Examples


    *   Code that saves a file


    *   Code that adds numbers


    *   Code that processes a string


    Bad Examples


    *   Code that processes a string, add numbers and saves a file


    *   Code that handles file access and database access


    *   Code that reads a file and writes to a file


    Chapter six will cover:


    *   [Sub Procedure](#index_split_014.html_filepos202464)


    *   [Function Procedure](#index_split_014.html_filepos209589)


    *   [Built-In Functions](#index_split_014.html_filepos226645)


    Sub Procedure


    A Sub Procedure is a named block of code enclosed by the code phrases Sub and
    End Sub, which perform an action, but do not return a value. Sub Procedures can
    optionally receive arguments such as constants, variables, or expressions from
    a calling code. In addition, programmers optionally precede the Sub keyword with
    keywords Public or Private to determine if the procedure is visible or not. The
    code keywords Public and Private are relevant only when dealing with classes.
    Public is the default, if Public or Private is not specified. The following is
    the syntax for a Sub Procedure:


    Syntax


    [Public | Private] Sub NameOfSubProcedure ([Argument1], [ArgumentN])


            code


    End Sub


    ----------------------------------


    Figure 6.1


    ![](images/00147.jpg)


    Option Explicit


    Call GreetRex


    Sub GreetRex


            MsgBox "Hi, Rex. Do you really offer a Reading Plan and Free Live Training?"


    End Sub


    The output displays “Hi, Rex. Do you really offer a Reading Plan and Free Live
    Training?”


    Figure 6.2


    ![](images/00165.jpg)


    The first line “Call GreetRex” is the calling code that petitions the procedure.
    A procedure has no worth unless it is called by a code. Evaluate how keywords
    Public and Private, along with an argument after the procedure name, have been
    excluded. Adding an argument will make this procedure reusable. The following
    is an example of a procedure using one argument:


    Figure 6.3


    ![](images/00005.jpg)


    Option Explicit


    Call GreetName("Rex")


    Sub GreetName(strUserName)


            MsgBox "Hi, " & strUserName & "." & " Do you really offer a Reading Plan
    and Free Live Training?"


    End Sub


    The output displays “Hi, Rex. Do you really offer a Reading Plan and Free Live
    Training?”


    Figure 6.4


    ![](images/00165.jpg)


    Imagine that a programmer wants to find the total of two numbers without using
    a procedure. The code would look like this:


    Figure 6.5


    ![](images/00043.jpg)


    Option Explicit


    Dim intFirst, intSecond, intTotal


    intFirst = 20


    intSecond = 17


    intTotal = intFirst + intSecond


    MsgBox intTotal


    The output displays “37” after adding “intFirst = 20” and “intSecond = 17.”


    Figure 6.6


    ![](images/00189.jpg)


    Suppose two more numbers are set to be added to the procedure for a new total.
    In this case, the previous code has to be repeated to show the output. The following
    is how the complete code looks with two additional numbers:


    Figure 6.7


    ![](images/00076.jpg)


    Option Explicit


    Dim intFirst, intSecond, intThird, intFourth, intTotal


    intFirst = 20


    intSecond = 17


    intTotal = intFirst + intSecond'
