  trans: "\n\n[content]\n\n# 下一步\n\n第一次输出显示“Iterator Value: 0”，第二次输出显示“Iterator Value:\
    \ 1”，第三次输出显示“Iterator Value: 2”。\n\n图 5.25\n\n![](img/00087.jpg)![](img/00110.jpg)![](img/00134.jpg)\n\
    \n循环条件 `intNumber = 0 To 2` 循环将从 0 开始执行三次，移动到 1，最后以 2 结束。循环在循环第三次后停止。注意之前的示例所示，循环变量可以从任何数字开始（0,\
    \ 1, 和 6）。循环也可以包含一个负值。以下是一个循环变量从负数开始的示例：\n\n图 5.26\n\n![](img/00184.jpg)\n\n##\
    \ 选项\n\n```vb\nOption Explicit\n\nDim intNumber\n\nFor intNumber = -34 To -100\
    \ Step -25 \n\n    MsgBox \"Iterator Value: \" & intNumber        \nNext\n```\n\
    \n输出显示“Iterator Value: -34, Iterator Value: -59, and Iterator Value: -84。”\n\n\
    图 5.27\n\n![](img/00162.jpg)![](img/00185.jpg)![](img/00006.jpg)\n\n## Exit For\
    \ 语句\n\n`Exit For` 将控制权移出 `For` 循环并跳转到 `Next` 语句之后的下一行。以下是 `Exit For` 语句的示例：\n\
    \n图 5.28\n\n![](img/00094.jpg)\n\n```vb\nOption Explicit\n\nDim intNumber\n\n\
    For intNumber = -34 To -100 Step -25 \n\n    MsgBox \"Iterator Value: \" & intNumber\
    \    \n\n    Exit For        \n\nNext\n\nMsgBox \"The Exit For statement jumped\
    \ out of the For Loop and did not display -59 and -84.\"\n```\n\n第一次输出显示“Iterator\
    \ Value: -34”，第二次输出显示“The Exit For statement jumped out of the For Loop and did\
    \ not display -59 and -84.”\n\n图 5.29\n\n![](img/00009.jpg)\n\n![](img/00024.jpg)\n\
    \n## For Each…Next 语句\n\n`For Each…Next` 语句是一种用于遍历集合（collections）的特殊循环。集合是数据的累积。集合可以是任何类型的数据，但通常由相同类型的对象组成。循环执行组中的每个元素。`For\
    \ Each…Next` 语句不使用迭代器。因此，程序员无法控制循环运行的次数。循环取决于集合中对象的数量。`For Each…Next` 语句主要用于数组或\
    \ `FileSystemObject` (`FSO`)。\n\n数组在第 4 章 中已经介绍过（请参见第 3 章“第二部分 - You Must Learn\
    \ VBScript for QTP – UFT”中的 FSO）。以下是 `For Each…Next` 语句的语法：\n\n### 语法\n\n```\n\
    For Each object In Group\n    <statement>         \n    (Exit For)\n    <statement>\n\
    Next\n```\n\n----------------------------------\n\n图 5.30\n\n| 参数 | 说明 |\n| :---\
    \ | :--- |\n| Object | 遍历集合或数组中所有对象的变量。 |\n| Group | 集合或数组的名称 |\n| Statement |\
    \ 在指定组中执行每个对象的语句或多个语句 |\n| Exit For | 强制跳出循环 |\n\n图 5.31\n\n![](img/00137.jpg)\n\
    \n```vb\nOption Explicit\n\nDim arrNames, strName\narrNames = Array(\"James\"\
    , \"John\", \"Joe\")\n\nFor Each strName In arrNames\n    MsgBox \"Name is \"\
    \ & strName\nNext\n```\n\n第一次输出显示“Name is James”，第二次输出显示“Name is John”，第三次输出显示“Name\
    \ is Joe。”\n\n图 5.32\n\n![](img/00038.jpg)![](img/00051.jpg)![](img/00065.jpg)\n\
    \n`arrNames` 组是 `strName` 对象的集合。因此，代码表示查看 `arrNames` 组中的每个 `strName` 对象。变量 `strName`\
    \ 持有 `arrNames` 组中每个名称的引用。如果 `arrNames` 组为空，则循环将不会执行。`Exit For` 是可选的，但对于终止循环过程非常有用。以下是使用\
    \ `Exit For` 的 `For Each…Next` 语句示例：\n\n图 5.33\n\n![](img/0182.jpg)\n\n```vb\n\
    Option Explicit\n\nDim arrNames, strName\narrNames = Array(\"James\", \"John\"\
    , \"Joe\")\n\nFor Each strName In arrNames\n    MsgBox \"Name is \" & strName\n\
    \    If strName = \"John\" Then\n        MsgBox \"Loop exits when \" & strName\n\
    \        Exit For\n    End If\nNext\nMsgBox \"Found the name we were looking for\"\
    \n```\n\n第一次输出显示“Name is James”，第二次输出显示“Name is John”，第三次输出显示“Loop exits when\
    \ John”，第四次输出显示“Found the name we were looking for。” `Exit For` 语句在找到特定名称“John”时终止\
    \ For 循环并跳转到 `Next` 之后的行。名称“Joe”没有显示。\n\n图 5.34\n\n![](img/0082.jpg)![](img/017.jpg)[](images/029.jpg)\n\
    \n## Do…Loop 语句\n\n`Do…Loop` 语句由于 `While` 或 `Until` 关键字，具有多种用法。`Do…Loop` 根据 `While`\
    \ 或 `Until` 条件执行语句。在 `Do` 语句的开头或结尾放置条件可以控制循环次数。在 `Do` 语句开头放置条件可以决定是否执行语句。类似于 `Exit\
    \ For` 语句，`Exit Do` 语句可以将控制权移出循环并跳转到 `Loop` 之后的行。`Exit Do` 是可选的。\n\n### Do While\n\
    \n`While` 关键字在条件为真时重复语句块。以下是 `Do While` 和 `Do While…Loop` 的语法：\n\n```\nDo While\
    \ condition\n    <statement>         \n    (Exit Do)\n    <statement>\nLoop\n\
    ```\n\n------------------\n\n图 5.35\n\n| 参数 | 说明 |\n| :--- | :--- |\n| Do | 开始\
    \ Do Loop 的必要参数 |\n| While | 条件为真时继续循环的必要参数 |\n| Condition | 真值表达式。空条件被视为假 |\n\
    | Statement | 在条件为真时重复的语句 |\n| Exit Do | 强制跳出循环 |\n| Loop | 结束 Do Loop 的必要参数 |\n\
    \n```vb\nOption Explicit\n\nDim i\ni = 3\nDo While i < 3 \n    MsgBox \"Iterator\
    \ Value: \" & i    \n    i = i + 1\nLoop\nMsgBox \"Iterator is 3\"\n```\n\n输出显示“Iterator\
    \ is 3”\n\n图 5.36\n\n![](img/0012.jpg)\n\n循环带有 `Do` 语句的条件，因此如果判定返回真值，则执行语句。在这种情况下，通过语句将\
    \ `i` 设置为 3 后返回假值。`Do While i < 3` 不执行，因为 `i` 等于 3，并不小于 3。以下是 `Do While…Loop`\
    \ 循环的流程图：\n\n图 5.37\n\n![](img/0179.jpg)\n\n```\nDo\n    <statement>         \n\
    \    (Exit Do)\n    <statement>\nLoop While condition\n```\n\n------------------\n\
    \n图 5.38\n\n![](img/0089.jpg)\n\n```vb\nOption Explicit\n\nDim i\ni = 3\nDo \n\
    \    MsgBox \"Iterator Value: \" & i    \n    i = i + 1\nLoop While i < 3 \n\n\
    MsgBox \"Iterator is 3 or more\"\n```\n\n输出显示“Iterator Value: 3”和“Iterator is\
    \ 3 or more”\n\n图 5.39\n\n![](img/0013.jpg)![](img/0028.jpg)\n\n循环带有 `Loop` 语句的条件，因此如果判定返回真值，则语句至少执行一次。`Do…Loop`\
    \ 由于 `Exit Do` 语句可以将控制权移出循环并跳转到 `Loop` 之后的行。\n\n[/content]\n"
- fmt: "\nThe `Until` keyword repeats a block of statements as long as the condition\
    \ is `False`. In other words, the statements are repeated until a condition becomes\
    \ `True`. The following is the syntax for the `Do Until…Loop` and `Do…Loop Until`:\n\
    \n### Syntax\n\n```\nDo Until condition\n    <statement>\n    (Exit Do)\n    <statement>\n\
    Loop\n```\n\n----------------------------------\n\nFigure 5.42\n\n| Arguments\
    \ | Description |\n| :--- | :--- |\n| `Do` | A required argument that starts the\
    \ `Do Loop` |\n| `Until` | A required argument that indicates the loop continues\
    \ until the condition becomes `True` |\n| `Condition` | An expression that is\
    \ `True` or `False`. Null conditions are treated as `False` |\n| `Statement` |\
    \ A statement is repeated until a condition becomes `True` |\n| `Exit Do` | Forces\
    \ a break out of the loop |\n| `Loop` | A required argument that ends the `Do\
    \ Loop` definition |\n\nFigure 5.43\n\n![](images/00064.jpg)\n\n```vb\nOption\
    \ Explicit\nDim i\ni = 1\nDo Until i < 3 \n    MsgBox \"Iterator = \" & i\n  \
    \  i = i + 1\nLoop \nMsgBox \"Iterator is less than 3\"\n```\n\nThe output displays\
    \ “Iterator is less than 3”\n\nFigure 5.44\n\n![](images/00055.jpg)\n\nThe loop\
    \ has a condition with the `Do` Statement. Therefore, a decision must be made\
    \ for the statement to be executed. In this case, `i` is set to one with the statement\
    \ `i = 1`. The condition `Do Until i < 3` will not execute because `i`, which\
    \ equals one, is already less than three. The statement (`MsgBox \"Iterator =\
    \ \" & i`) does not warrant an execution since the condition is `True`. The following\
    \ is an example of the `Do Until…Loop` flowchart:\n\nFigure 5.45\n\n![](images/00071.jpg)\n\
    \n### Syntax\n\n```\nDo\n    <statement>\n    (Exit Do)\n    <statement>\nLoop\
    \ Until condition\n```\n\n----------------------------------\n\nFigure 5.46\n\n\
    ![](images/00102.jpg)\n\n```vb\nOption Explicit\nDim i\ni = 1\nDo\n    MsgBox\
    \ \"Iterator = \" & i\n    i = i + 1\nLoop Until i < 3 \nMsgBox \"Iterator is\
    \ less than 3\"\n```\n\nThe first output displays “Iterator = 1” and the second\
    \ output displays “Iterator is less than 3”\n\nFigure 5.47\n\n![](images/00091.jpg)![](images/00114.jpg)\n\
    \nThe statement is executed at least one time because there is not a condition\
    \ on the `Do` Statement. The iterator equals one by setting `i = 1`, producing\
    \ the first output (Iterator = 1) by way of the statement `MsgBox \"Iterator =\
    \ \" & i`. The iterator increases to two with the statement `i = i + 1`. The condition\
    \ `Loop Until i < 3` causes the loop to stop because two is less than three, which\
    \ displays the second output “Iterator is less than 3.” On the other hand, the\
    \ statement `MsgBox (Iterator = \" & i)` would have been repeated if the condition\
    \ `Loop Until i < 3` is false. The following is an example of the `Do…Loop Until`\
    \ flowchart:\n\nFigure 5.48\n\n![](images/00140.jpg)\n\nThe advantage of the `Do\
    \ Loop` is the versatility of using keywords `While` or `Until` and placing the\
    \ keywords at the beginning or end of the loop. Generally, people choose one of\
    \ the keywords for coding. An important question is whether the code should be\
    \ executed at least once. If so, the condition will be placed at the end of the\
    \ loop. If not, the condition will be placed at the beginning of the loop.\n\n\
    Chapter 5 explained the Flow Control by covering the Branching Constructs and\
    \ Looping Statements. [Chapter 6](#index_split_014.html_filepos199184) will go\
    \ into detail regarding Procedures and Functions.\n\n# Chapter 6 Procedures—Functions\n\
    \nThere are times when the terms procedures and functions are used interchangeably.\
    \ For the sake of this chapter procedure will be the preferred term for sub and\
    \ function, while function will be employed to reference Built-In Functions. Procedures\
    \ allow programmers to modularize their code into named blocks of code that perform\
    \ a specific task. Modularization describes complex code into named blocks of\
