    of objects in the collection. The For Each…Next Statement is mainly used with
    arrays or FileSystemObject (FSO).


    Arrays were covered in [Chapter 4](#index_split_012.html_filepos110975) (see FSO
    in Chapter 3 “Part 2 - You Must Learn VBScript for QTP – UFT”.) The following
    is the For Each…Next” Statement syntax:


    Syntax


    For Each object In Group


            <statement>         


            (Exit For)


            <statement>


    Next


    ----------------------------------


    Figure 5.30


    | Arguments | Description |


    | Object | A variable that iterates through all of the objects in a collection
    or array. |


    | Group | The name of a collection or array |


    | Statement | A statement or statements that executes every object in a specified
    group |


    | Exit For | Forces a break out of the loop |


    Figure 5.31


    ![](images/00137.jpg)


    Option Explicit


    Dim arrNames, strName


    arrNames = Array("James", "John", "Joe")


    For Each strName In arrNames


            MsgBox "Name is " & strName


    Next


    The first output displays “Name is James,” the second output displays “Name is
    John,” and the third output displays “Name is Joe.”


    Figure 5.32


    ![](images/00038.jpg)![](images/00051.jpg)![](images/00065.jpg)


    The arrNames group is a collection of strName objects. Therefore, the code is
    stating view each strName object in the arrNames group. The variable strName holds
    a reference to each name in the arrNames group. If the arrNames group is empty,
    then the loop will not execute. Exit For is optional, but can be useful for terminating
    the looping process. The following is an example of the For Each…Next statement
    using the Exit For part:


    Figure 5.33


    ![](images/00182.jpg)


    Option Explicit


    Dim arrNames, strName


    arrNames = Array("James", "John", "Joe")


    For Each strName In arrNames


            MsgBox "Name is " & strName


            If strName = "John" Then


                    MsgBox "Loop exits when Name equals " & strName


                    Exit For


            End If


    Next


    MsgBox "Found the name we were looking for"


    The first output displays “Name is James,” the second output displays “Name is
    John,” the third output displays “Loop exits when Name equals John,” and the fourth
    output displays “Found the name we were looking for.” The Exit For Statement terminates
    the For Loop and jumps to the line after the Next Statement when locating a specific
    name “John.” The name “Joe” is not displayed like the previous example when Exit
    For was not used.


    Figure 5.34


    ![](images/00082.jpg)![](images/00107.jpg)![](images/00129.jpg)![](images/00157.jpg)


    Do…Loop Statement


    The Do…Loop Statement is capable of many uses due to its keywords “While” or “Until.”
    The Do…Loop executes based on any criteria using keywords While or Until. The
    block of statements are repeated while a condition is True or until a condition
    becomes True. The keywords can be used at the beginning or end of the loop to
    control the number of loops executed.


    There is a Do Statement that sets the beginning of a block and a Loop Statement
    that specifies the end of a block. Placing a condition on the Do statement with
    a keyword allows the script to decide whether or not to execute a statement. However,
    placing a condition on the Loop Statement guarantees the statement will be executed
    at least one time.


    The Do Loop has an optional “Exit Do” Statement. Like the Exit For Statement,
    the Exit Do Statement transfers control out of a loop. The code breaks out of
    the loop to the line after the Do Loop block.


    Do While


    The While keyword repeats a block of statements while a condition is True. The
    following is the syntax for the Do While…Loop and Do… Loop While:


    Syntax


    Do While condition


            <statement>         


            (Exit Do)


            <statement>


    Loop


    ----------------------------------


    Figure 5.35


    | Arguments | Description |


    | Do | A required argument that starts the Do Loop |


    | While | A required argument that indicates the loop continues while the condition
    is True |


    | Condition | An expression that is True or False. Null conditions are treated
    as False |


    | Statement | A statement is repeated while a condition is True |


    | Exit Do | Forces a break out of the loop |


    | Loop | A required argument that ends the Do Loop definition |


    Figure 5.36


    ![](images/00012.jpg)


    Option Explicit


    Dim i


    i = 3


    Do While i < 3 


            MsgBox "Iterator = " & i     


            i = i + 1


    Loop


    MsgBox "Iterator is 3 or more"


    The output displays “Iterator is 3 or more”


    Figure 5.37


    ![](images/00179.jpg)


    The loop has a condition with the Do Statement. For this reason, the statement
    is executed if the decision returns True. In this case, it returns False after
    setting i to three with the statement “i = 3.” The condition “Do While i < 3”
    will not execute because i which equals three, is not less than three. The following
    is an example of the Do While…Loop flowchart:


    Figure 5.38


    ![](images/00208.jpg)


    Syntax


    Do


            <statement>         


            (Exit Do)


            <statement>


    Loop While condition


    ----------------------------------


    Figure 5.39


    ![](images/00089.jpg)


    Option Explicit


    Dim i


    i = 3


    Do 


            MsgBox "Iterator = " & i       


            i = i + 1


    Loop While i < 3 


    MsgBox "Iterator is 3 or more"


    The output displays “Iterator = 3” and “Iterator is 3 or more”


    Figure 5.40


    ![](images/00013.jpg)![](images/00028.jpg)


    The statement is executed automatically at least one time because there is a condition
    on the Loop Statement. The iterator equals three by setting i to 3 (i = 3) that
    produces the first output (Iterator = 3) by way of statement (MsgBox "Iterator
    = " & i). The iterator increases to four with statement “i = i + 1.” Condition
    “Loop While i < 3” causes the loop to stop because four is not less than three,
    which displays the second output: “Iterator is 3 or more.” The following is an
    example of the Do…Loop While flowchart:


    Figure 5.41


    ![](images/00044.jpg)


    Do Until'
