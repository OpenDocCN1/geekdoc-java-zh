    Chapter 5 Flow Control


    VBScript executes from a top–down concept. It starts at the top of a script then
    processes one line at a time until reaching the end of the script. Logic forces
    some lines to be skipped due to branching, while other lines are executed more
    than once because of looping.


    This chapter covers:


    *   [Branching Constructs](#index_split_013.html_filepos150405)


    *   [Looping Statements](#index_split_013.html_filepos171044)


    Branching Constructs


    Branching is the process of making a decision and executing one block of code
    based on that decision. The two constructs for branching are “If…End If” (If statement)
    and “Select…End Select” (Select statement). Both of the constructs are used to
    define a code block secured by beginning and ending statements. The If block requires
    a beginning statement of If and an ending statement of End If. The Select block
    follows a similar pattern which requires a beginning statement of Select and an
    ending statement of End Select. A syntax error occurs at runtime if the required
    statements are not entered.


    “If” Block Branch


    The If statement executes a set of code when a condition is True. The If statement
    is one of the most common structures programmers use when writing code. The following
    is the syntax for an If block:


    Syntax


    If <condition> Then


            <statement>


    End If


    ----------------------------------


    Anything that results in True or False can be used in place of <condition>. True
    or False answers are called Boolean expressions. The following is a few If construct
    examples:


    Figure 5.1


    ![](images/00014.jpg)


    Option Explicit


    If 10 + 5 = 15 Then


            MsgBox "The answer is correct"


    End If


    The output displays “The answer is correct”


    Figure 5.2


    ![](images/00122.jpg)


    Figure 5.3


    ![](images/00050.jpg)


    Option Explicit


    Dim strFirstName strFirstName = "Rex"


    If strFirstName = "Rex"


             MsgBox "First Name " & strFirstName & " is correct"


    End If


    The output displays “First Name Rex is correct”


    Figure 5.4


    ![](images/00126.jpg)


    Figure 5.5


    ![](images/00093.jpg)


    Option Explicit


    Dim strFirstName, strLastName


    strFirstName = "Joe"


    strLastName = "Doe"


    If strFirstName = "Joe" and (strLastName = "Doe" or strLastName = "Blow") Then


            MsgBox "First Name is " & strFirstName & "and Last Name is " & strLastName 


    End If


    The output displays “First Name is Joe and Last Name is Doe”


    Figure 5.6


    ![](images/00130.jpg)


    Else Block Branch


    The “Else” block can be added as another dimension to the If construct. It will
    be executed if the result of the If condition is False. The following is an example
    of the Else block:


    Syntax


    If <condition> Then


            <statement>


    Else


            <statement>


    End If


    ----------------------------------


    Figure 5.7


    ![](images/00063.jpg)


    Option Explicit


    Dim strFirstName, strLastName


    strFirstName = "James"


    strLastName = "Doe"


    If strFirstName = "Joe" Then


            MsgBox "First Name is " & strFirstName 


    Else


            MsgBox "First Name is not Joe but " & strFirstName 


    End If 


    The output displays “First Name is not Joe but James”


    Figure 5.8


    ![](images/00136.jpg)


    Else-If Block Branch


    There are times when decisions require more than an either/or evaluation. In this
    case, the programmer can add several Else-If blocks. The following is an example
    of the Else-If block:


    Syntax


    If <condition> Then 


            <statement>


    ElseIf <condition> Then         


            < statement>


    ElseIf <condition> Then


            <statement>


    Else


            <statement>


    End If


    ----------------------------------


    Figure 5.9


    ![](images/00001.jpg)


    Option Explicit


    Dim strColor


    strColor = "Purple"


    If strColor = "Black" Then 


            MsgBox "Black is a dark color"


    ElseIf strColor = "Green" Then         


            MsgBox "Green is a nice color"


    ElseIf strColor = "Purple" Then


            MsgBox "Purple is a pretty color"


    Else


            MsgBox "The color is not Black, Green, or Purple"


    End If


    The output displays “Purple is a pretty color”


    Figure 5.10


    ![](images/00079.jpg)


    The execution moves to the first Else-If evaluation if the first condition returns
    False. If the first Else-If evaluation returns False, then the execution moves
    to the second Else-If evaluation. Finally, the execution moves to the Else block
    if the second Else-If evaluation returns False. Each Else-If line must end with
    Then, just like the If statement. The Else block is optional and always executes
    last. Else-If constructs are flexible because each separate Else-If line can evaluate
    a different expression. The following is an example of the Else-If block evaluating
    a unique condition without using the Else block:


    Syntax


    If <condition> Then 


            <statement>


    ElseIf <condition> Then 


            <statement>


    ElseIf <condition> Then


            <statement>


    End If


    ----------------------------------


    Figure 5.11


    ![](images/00144.jpg)


    Option Explicit


    Dim intNumber


    intNumber = 100


    If IsNull(intNumber) Then 


            MsgBox "The variable IsNull" 


    ElseIf IsEmpty(intNumber) Then 


            MsgBox "The variable IsEmpty"


    ElseIf IsNumeric(intNumber) Then


            MsgBox "The variable IsNumeric"


    End If


    The output displays “The variable IsNumeric”


    Figure 5.12


    ![](images/00104.jpg)


    Nested If Block Branch


    Programmers can add If…End If blocks within each other. The following is an example
    of a nested If statement:


    Syntax


    If <condition> Then


            If <condition> Then


                    <statement>         


            ElseIf <condition> Then


                    <statement>          


            ElseIf <condition> Then


                    <statement>         


           Else


                     <statement>         


           End If


    Else


            <statement>


    End If


    ----------------------------------


    Figure 5.13


    ![](images/00078.jpg)


    Option Explicit


    Dim intNumber


    intNumber = 1000


    If IsNumeric(intNumber) Then


            If intNumber > 0 and intNumber < 100 Then


                    MsgBox "The number is greater than zero and less than 100"


            ElseIf intNumber > 100 and intNumber < 1000 Then


                    MsgBox "The number is a greater than 100 and less than 1000"


            ElseIf intNumber >= 1000 Then


                    MsgBox "The number is greater than or equal to 1000"                    


            Else


                    MsgBox "The number is a negative number"


            End If


    Else


            MsgBox "The variable is NOT Numeric"


    End If


    The output displays “The number is greater than or equal to 1000”


    Figure 5.14


    ![](images/00125.jpg)


    If constructs can be nested as deep as the programmer wants to nest the construct.
    However, the logic can become unmanageable and difficult to read if nested too
    deep. The concept of nesting to deep is subjective and based upon what the individual
    programmer or programming team deems as too deep for their specific project.


