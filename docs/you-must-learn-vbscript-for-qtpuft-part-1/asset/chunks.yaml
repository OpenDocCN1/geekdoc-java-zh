- fmt: "\nThe Modulus Arithmetic Operator (`Mod`) is used to divide two numbers and\
    \ return only the remainder. The following is an example of the Modulus Arithmetic\
    \ Operator:\n\n### Syntax\n```\nResult = Number1 Mod Number2\n```\n\n### Option\
    \ Explicit\n```vba\nDim x\nx = 12 Mod 10\nMsgBox x\n```\nThe answer is 2.\n\n\
    Figure 3.8\n![](images/00109.jpg)\n\n**Note:** Numbers are rounded to integers\
    \ if they are floating point numbers. Empty expressions are treated as a zero\
    \ (0). The result is Null if one or both expressions are Null.\n\n# Addition\n\
    The Addition Operator (`+`) is used to add numbers and join strings. The following\
    \ is an example of the Addition Operator:\n\n### Syntax\n```vba\nResult = Number1\
    \ + Number2\n```\n\n### Option Explicit\n```vba\nDim x\nx = 3 + 4\nMsgBox x\n\
    ```\nThe answer is 7.\n\nFigure 3.9\n![](images/00113.jpg)\n\n**Note:** The result\
    \ is an integer if both expressions are Empty. However, if one expression is Empty,\
    \ then the other expression is unchanged. The result is Null if one or both expressions\
    \ are Null. Expressions determine the Addition Operator’s (`+`) behavior. If strings\
    \ are involved, then the Addition Operator will combine the strings like the [Concatenation\
    \ Operator](#index_split_011.html_filepos82711) (`&`). The following is an example\
    \ of the Addition Operator combining strings together:\n\n### Option Explicit\n\
    ```vba\nDim strFirstName, strLastName\nstrFirstName = \"John\"\nstrLastName =\
    \ \"Doe\"\nMsgBox \"A common fake name is \" + strFirstName + \" \" + strLastName\n\
    ```\nThe output displays “A common fake name is John Doe.”\n\nFigure 3.10\n![](images/00116.jpg)\n\
    \nThe following is a Success Table that shows different types of expressions:\n\
    \nFigure 3.11\n\n| If | Then |\n| :--- | :--- |\n| Both expressions are numeric\
    \ | Add |\n| Both expressions are strings | Concatenate |\n| One expression is\
    \ numeric and the other is a string | Error: Type Mismatch |\n\n# Subtraction\n\
    The Subtraction Operator (`-`) is used to find the difference between two numbers.\
    \ The following is an example of the Subtraction Operator:\n\n### Syntax\n```vba\n\
    Result = Number1 – Number2\n```\n\n### Option Explicit\n```vba\nDim x\nx = 37\
    \ - 3\nMsgBox x\n```\nThe answer is 34.\n\nFigure 3.12\n![](images/00119.jpg)\n\
    \n**Note:** Empty expressions are treated as a zero (0). The result is Null if\
    \ one or both expressions are Null.\n\n# Concatenation\nThe Concatenation Operator\
    \ (`&`) is used to force a concatenation of expressions. The following is an example\
    \ of the Concatenation Operator:\n\n### Syntax\n```vba\nResult = Expression1 &\
    \ Expression2\n```\n\n### Option Explicit\n```vba\nDim strFirstName, strLastName\n\
    strFirstName = \"Rex\"\nstrLastName = \"Jones II\"\nMsgBox \"The author of this\
    \ eBook is \" & strFirstName & \" \" & strLastName & \".\"\n```\nThe answer is\
    \ “The author of this eBook is Rex Jones II.”\n\nFigure 3.13\n![](images/00124.jpg)\n\
    \n**Note:** Non-String expressions are converted to strings. If both expressions\
    \ are Null, then the result is also Null. However, if only one expression is Null,\
    \ then that expression is treated as a zero-length string (\" \") when concatenated\
    \ with the other expression. A zero-length string is given a blank value—no value.\
    \ Any expression that is Empty is also treated as a zero-length string.\n\n# Comparison\
    \ Operators\nComparison operators allow the programmer to compare two expressions.\
    \ Comparison Operators test whether two expressions are True or False. Therefore,\
    \ the data type of a Comparison Operator is Boolean. The following is a Success\
    \ Table, which is a guideline for comparing expressions:\n\nFigure 3.14\n\n| If\
    \ | Then |\n| :--- | :--- |\n| Both expressions are numeric | Perform a numeric\
    \ comparison |\n| Both expressions are strings | Perform a string comparison |\n\
    | One expression is numeric and the other is a string | The numeric expression\
    \ is less than the string expression |\n| One expression is Empty and the other\
    \ is numeric | Perform a numeric comparison, using zero (0) as the Empty expression\
    \ |\n| One expression is Empty and the other is a string | Perform a string comparison,\
    \ using a zero-length string (\"\") as the Empty expression |\n| Both expressions\
    \ are Empty | The expressions are equal |\n\nThe following is a list of each Comparison\
    \ Operator in order of precedence:\n* [Equality](#index_split_011.html_filepos87048)\n\
    * [Inequality](#index_split_011.html_filepos88007)\n* [Less Than](#index_split_011.html_filepos89026)\n\
    * [Greater Than](#index_split_011.html_filepos90000)\n* [Less Than or Equal To](#index_split_011.html_filepos90992)\n\
    * [Greater Than or Equal To](#index_split_011.html_filepos92603)\n* [Object Equivalence\
    \ (Is)](index_split_011.html_filepos94217)\n\n### Equality\nThe Equality Operator\
    \ (`=`) returns True if `Expression1` equals `Expression2`, and returns False\
    \ otherwise. The following is an example of the Equality Operator:\n\n### Syntax\n\
    ```vba\nExpression1 = Expression2\n```\n\n### Option Explicit\n```vba\nDim x,\
    \ y\nx = 34\ny = 34\nIf x = y Then\n    MsgBox x & \"equals \" & y\nEnd If\n```\n\
    The expression is a true statement that displays 34 equals 34.\n\nFigure 3.15\n\
    ![](images/00128.jpg)\n\n### Inequality\nThe Inequality Operator (`<>`) returns\
    \ True if `Expression1` does not equal `Expression2`, and returns False otherwise.\
    \ The following is an example of the Inequality Operator:\n\n### Syntax\n```vba\n\
    Expression1 <> Expression2\n```\n\n### Option Explicit\n```vba\nDim x, y\nx =\
    \ 34\ny = 38\nIf x <> y Then\n    MsgBox x & \"does not equal\"\nEnd If\n```\n\
    The expression is a true statement that displays 34 does not equal 38.\n\nFigure\
    \ 3.16\n![](images/00133.jpg)\n\n### Less Than\nThe Less Than Operator (`<`) returns\
    \ True if `Expression1` is less than `Expression2`, and returns False otherwise.\
    \ The following is an example of the Less Than Operator:\n\n### Syntax\n```vba\n\
    Expression1 < Expression2\n```\n\n### Option Explicit\n```vba\nDim x, y\nx = 34\n\
    y = 38\nIf x < y Then\n    MsgBox x & \"is less than\"\nEnd If\n```\nThe expression\
    \ is a true statement that displays 34 is less than 38.\n\nFigure 3.17\n![](images/00138.jpg)\n\
    \n### Greater Than\nThe Greater Than Operator (`>`) returns True if `Expression1`\
    \ is greater than `Expression2`, and returns False otherwise. The following is\
    \ an example of the Greater Than Operator:\n\n### Syntax\n```vba\nExpression1\
    \ > Expression2\n```\n\n### Option Explicit\n```vba\nDim x, y\nx = 38\ny = 34\n\
    If x > y Then\n    MsgBox x & \"is greater than\"\nEnd If\n```\nThe expression\
    \ is a true statement that displays 38 is greater than 34.\n\nFigure 3.18\n![](images/00143.jpg)\n\
    \n### Less Than or Equal To\nThe Less Than or Equal To Operator (`<=`) returns\
    \ True if `Expression1` is less than or equal to `Expression2`, and returns False\
    \ otherwise. The following is an example of the Less Than or Equal To Operator:\n\
    \n### Syntax\n```vba\nExpression1 <= Expression2\n```\n\n### Option Explicit\n\
    ```vba\nDim x, y\nx = 34\ny = 34\nIf x <= y Then\n    MsgBox x & \"is less than\
    \ or equal to\"\nEnd If\n```\nThe expression is a true statement that displays\
    \ 34 is less than or equal to 34.\n\nFigure 3.19\n![](images/00148.jpg)\n\n###\
    \ Option Explicit\n```vba\nDim x, y\nx = 34\ny = 38\nIf x <= y Then\n    MsgBox\
    \ x & \"is less than or equal to\"\nEnd If\n```\nThe expression is a true statement\
    \ that displays 34 is less than or equal to 38.\n\nFigure 3.20\n![](images/00153.jpg)\n\
    \n### Greater Than or Equal To\nThe Greater Than or Equal To Operator (`>=`) returns\
    \ True if `Expression1` is greater than or equal to `Expression2`, and returns\
    \ False otherwise. The following is an example of the Greater Than or Equal To\
    \ Operator:\n\n### Syntax\n```vba\nExpression1 >= Expression2\n```\n\n### Option\
    \ Explicit\n```vba\nDim x, y\nx = 34\ny = 34\nIf x >= y Then\n    MsgBox x & \"\
    is greater than or equal to\"\nEnd If\n```\nThe expression is a true statement\
    \ that displays 34 is greater than or equal to 34.\n\nFigure 3.21\n![](images/00156.jpg)\n\
    \n### Option Explicit\n```vba\nDim x, y\nx = 38\ny = 34\nIf x >= y Then\n    MsgBox\
    \ x & \"is greater than or equal to\"\nEnd If\n```\nThe output displays “38 is\
    \ greater than or equal to 34”\n\nFigure 3.22\n![](images/00160.jpg)\n\n### Object\
    \ Equivalence (Is)\n"
