    | :--- | :--- | :--- |

    | True | True | True |

    | True | False | False |

    | False | True | False |

    | False | False | False |


    ### 逻辑或 (Or)

    逻辑或运算符 (Or) 当一个或两个表达式为 `True` 时返回 `True`，否则返回 `False`。以下是逻辑或运算符的示例：


    ### 语法

    ```

    Result = Expression1 Or Expression2

    ```


    ### 强制声明

    ```vb

    Dim x, y, z

    x = 10

    y = 15

    z = x > 4 Or y >= 20

    MsgBox z

    ```

    答案是“True.”。


    图 3.28

    ![](img/00175.jpg)


