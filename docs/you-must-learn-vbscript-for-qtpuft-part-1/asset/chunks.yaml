    # Preface


    I must admit, it was a challenge writing this VBScript for QTP/UFT book. The challenge
    stems from an unlimited access to information on the internet. All of the information
    in this book can be found scattered throughout search engines, blogs, etc. However,
    if you are searching for one consolidated resource, then this is the book for
    you.


    ## Target Audience


    The target audience is beginners and mid-level automation engineers. Beginners
    are people new to QTP/UFT who need to learn more than the basics of VBScript.
    Mid-level automation engineers are people with knowledge of `VBScript`, but want
    to refresh their programming skills. No prior knowledge of `VBScript` or programming
    concepts is required. However, a common myth regarding QTP/UFT is that development
    skills are not necessary. The truth is development skills are very necessary.


    ## Why learn VBScript?


    Can you imagine traveling to a foreign country and trying to communicate with
    the native people without learning their language? That is similar to communicating
    with QTP/UFT without learning `VBScript`. The purpose of this book is to help
    automation engineers understand that QTP/UFT cannot be fully optimized without
    a strong foundation of `VBScript`. A mistake most QTP/UFT books and training courses
    make is not providing solid information on the `VBScript` programming language.
    These books and training courses focus solely on QTP/UFT, which leads to automation
    engineers struggling with automation projects. Automation is the future of testing
    applications. Take this opportunity to learn `VBScript`.


    # About the Author


    ![](images/00096.jpg)


    Rex Allen Jones II is a QA/Software Tester with a passion for sharing knowledge
    about testing software. He has been watching webinars, attending seminars, and
    testing applications since February 2005. Mr. Jones graduated from DeVry University
    in June 1999 with a Bachelor’s of Science degree in Computer Information Systems
    (CIS).


    Currently, Rex is a Consultant and on the Board of Directors for User Group: Dallas
    / Fort Worth Mercury User Group (DFWMUG) and an active member of User Group: Dallas
    / Fort Worth Quality Assurance Association (DFWQAA). In addition to his User Group
    memberships, he is a Certified Software Tester Engineer (CSTE) and has a Test
    Management Approach (TMap) certification.


    Mr. Jones’ advice for people interested in Functional Automation Testing is to
    learn the programming language. This advice led him to write two books “(Part
    1 & Part 2) You Must Learn VBScript for QTP/UFT” geared towards `VBScript` which
    is the programming language for Unified Functional Testing (UFT) formerly known
    as Quick Test Professional (QTP). In addition, two upcoming books geared toward
    Java which is one of the programming languages for Selenium.


    # About the Editor


    ![](images/00111.jpg)


    When Samantha Mann is not improving the contents of a document through constructive
    editing marks and remarks, she is enjoying life as a professional in Dallas, Texas.
    Samantha is a User Experience guru in the realms of research and design, and works
    as an Information Technology consultant. Outside of work her hobbies include the
    typical nerd-type fun of freelance editing, reading, writing, and binge watching
    Netflix with her pitbull.


