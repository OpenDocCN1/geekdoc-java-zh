  trans: "\n\n![](img/00169.jpg)[](images/00115.jpg)[](images/00118.jpg)\n\n遍历数组的另一种方法是“For\
    \ Each…Next 语句”。For Each…Next 语句是一种循环，它会为数组中的每个项目重复执行一组语句，而无需使用 `LBound` 和 `UBound`\
    \ 函数。For Each…Next 语句将在第 5 章中进行解释。以下是 For Each…Next 循环的示例：\n\n图 4.50\n\n![](img/00023.jpg)\n\
    \n```vbscript\nOption Explicit\n\nDim strName\nDim arrName(2) \n\narrName(0) =\
    \ \"James\"\narrName(1) = \"Janice\"\narrName(2) = \"Jane\"\n\nFor Each strName\
    \ In arrName\n    MsgBox strName\nNext\n```\n\n第一次输出显示“James”，第二次输出显示“Janice”，第三次输出显示“Jane”\n\
    \n图 4.51\n\n![](img/00169.jpg)[](images/00115.jpg)[](images/00118.jpg)\n\n第 4\
    \ 章详细介绍了数组。数组在读取或写入元素时可以是静态的也可以是动态的。第 5 章将解释流程控制的分支结构和循环语句。\n\n# 第 5 章 流程控制\n\n\
    VBScript 按照从上到下的概念执行。它从脚本的顶部开始，然后逐行处理，直到到达脚本结束。逻辑会由于分支而导致某些行被跳过，而其他行则因为循环而执行多次一次。\n\
    \n本章涵盖了：\n\n*   分支结构\n*   循环语句\n\n## 分支结构\n\n分支是做出决策并根据该决策执行一个代码块的过程。分支的两种结构是“If…End\
    \ If”（If 语句）和“Select…End Select”（Select 语句）。这两种结构都用于定义由起始和结束语句保护的代码块。If 块需要 `If`\
    \ 作为起始语句，`End If` 作为结束语句。Select 块遵循类似的模式，需要 `Select` 作为起始语句，`End Select` 作为结束语句。如果未输入所需的语句，则会在运行时发生语法错误。\n\
    \n### “If”块分支\n\n`If` 语句在条件为 True（真）时执行一组代码。If 语句是程序员在编写代码时使用的最常用结构之一。以下是 If 块的语法：\n\
    \n#### 语法\n\n```vbscript\nIf <condition> Then\n    <statement>\nEnd If\n```\n\n\
    ----------------------------------\n\n任何导致 True 或 False 的结果都可以代替 `<condition>`。True\
    \ 或 False 的回答被称为布尔表达式。以下是几个 If 构造示例：\n\n图 5.1\n\n![](img/00014.jpg)\n\n```vbscript\n\
    Option Explicit\n\nIf 10 + 5 = 15 Then\n    MsgBox \"The answer is correct\"\n\
    End If\n```\n\n输出显示“The answer is correct”\n\n图 5.2\n\n![](img/00122.jpg)\n\n\
    图 5.3\n\n![](img/00050.jpg)\n\n```vbscript\nOption Explicit\n\nDim strFirstName\n\
    strFirstName = \"Rex\"\n\nIf strFirstName = \"Rex\"\n    MsgBox \"First Name \"\
    \ & strFirstName & \" is correct\"\nEnd If\n```\n\n输出显示“First Name Rex is correct”\n\
    \n图 5.4\n\n![](img/00126.jpg)\n\n图 5.5\n\n![](img/00093.jpg)\n\n```vbscript\n\
    Option Explicit\n\nDim strFirstName, strLastName\nstrFirstName = \"Joe\"\nstrLastName\
    \ = \"Doe\"\n\nIf strFirstName = \"Joe\" and (strLastName = \"Doe\" or strLastName\
    \ = \"Blow\") Then\n    MsgBox \"First Name is \" & strFirstName & \"and Last\
    \ Name is \" & strLastName \nEnd If\n```\n\n输出显示“First Name is Joe and Last Name\
    \ is Doe”\n\n图 5.6\n\n![](img/00130.jpg)\n\n### Else 块分支\n\n“Else”块可以作为 If 构造的另一个维度添加。如果\
    \ If 条件的结果为 False（假），则将执行它。以下是 Else 块的示例：\n\n#### 语法\n\n```vbscript\nIf <condition>\
    \ Then\n    <statement>\nElse\n    <statement>\nEnd If\n```\n\n----------------------------------\n\
    \n图 5.7\n\n![](img/00063.jpg)\n\n```vbscript\nOption Explicit\n\nDim strFirstName,\
    \ strLastName\nstrFirstName = \"James\"\nstrLastName = \"Doe\"\n\nIf strFirstName\
    \ = \"Joe\" Then\n    MsgBox \"First Name is \" & strFirstName \nElse\n    MsgBox\
    \ \"First Name is not Joe but \" & strFirstName \nEnd If \n```\n\n输出显示“First Name\
    \ is not Joe but James”\n\n图 5.8\n\n![](img/00136.jpg)\n\n### Else-If 块分支\n\n\
    有时决策需要是二选一的评估。在这种情况下，程序员可以添加多个 Else-If 块。以下是 Else-If 块的示例：\n\n#### 语法\n\n```vbscript\n\
    If <condition> Then \n    <statement>\nElseIf <condition> Then         \n    <\
    \ statement>\nElseIf <condition> Then\n    <statement>\nElse\n    <statement>\n\
    End If\n```\n\n----------------------------------\n\n图 5.9\n\n![](img/00001.jpg)\n\
    \n```vbscript\nOption Explicit\n\nDim strColor\nstrColor = \"Purple\"\n\nIf strColor\
    \ = \"Black\" Then\n    MsgBox \"Black is a dark color\"\nElseIf strColor = \"\
    Green\" Then\n    MsgBox \"Green is a nice color\"\nElseIf strColor = \"Purple\"\
    \ Then\n    MsgBox \"Purple is a pretty color\"\nElse\n    MsgBox \"The color\
    \ is not Black, or Purple\"\nEnd If\n```\n\n输出显示“Purple is a pretty color”\n\n\
    图 5.10\n\nimages/0079.jpg)\n\n如果第一个条件返回 False，执行将移动到第一个 Else-If。如果第一个 Else-If\
    \ 评估返回 False，执行移动到第二个 Else-If。最后，如果第二个 Else-If 评估返回 False，执行移动到 Else 块。每个 Else-If\
    \ 行必须以 `Then` 结尾。Else-If 构造是灵活的，因为每行 Else-If 都可以评估不同的表达式。以下是在没有 Else 块的情况下评估唯一条件的\
    \ Else-If 示例：\n\n```vbscript\nIf <condition> Then\n    <statement>\nElseIf <condition>\
    \ Then\n    <statement>\nElseIf <condition> Then\n    <statement>\nEnd If\n```\n\
    \n----------------------------------\n\n图 5.11\n\nimages/044.jpg)\n\n```vbscript\n\
    Option Explicit\n\nDim intNumber\nintNumber = 0\n\nIf IsNull(intNumber) Then\n\
    \    MsgBox \"The variable IsNull\"\nElseIf IsEmpty(intNumber) Then\n    MsgBox\
    \ \"The variable IsEmpty\"\nElseIf IsNumeric(intNumber) Then\n    MsgBox \"The\
    \ variable IsNumeric\"\nEnd If\n```\n\n输出显示“The variable IsNumeric”\n\n图 5.12\n\
    \nimages/0104.jpg)\n\n### 嵌套 If 分支\n\n程序员可以将 If…End 块相互嵌套。以下是嵌套 If 语句的示例：\n\n\
    #### 语法\n\n```vbscript\nIf <condition> Then\n    If <condition> Then\n       \
    \ <statement>\n    ElseIf <condition> Then\n        <statement>\n    ElseIf <condition>\
    \ Then\n        <statement>\n    Else\n        <statement>\n    End If\nElse\n\
    \    <statement>\nEnd If\n```\n\n----------------------------------\n\n图 5.13\n\
    \nimages/0078.jpg)\n\n```vbscript\nOption Explicit\n\nDim intNumber\nintNumber\
    \ = 1000\n\nIf IsNumeric(intNumber) Then\n    If intNumber > 0 and intNumber <\
    \ 100 Then\n        MsgBox \"The number is greater than zero and less than 100\"\
    \n    ElseIf intNumber > 100 and intNumber < 1000 Then\n        MsgBox \"The number\
    \ is a greater than 100 and less than 1000\"\n    ElseIf intNumber >= 1000 Then\n\
    \        MsgBox \"The number is greater than or equal to 1000\"\n    Else\n  \
    \      MsgBox \"The number is a negative number\"\n    End If\nElse\n    MsgBox\
    \ \"The variable is NOT Numeric\"\nEnd If\n```\n\n输出显示“The number is greater than\
    \ or equal to 1000”\n\nSelect Case 块分支\n\n"
- fmt: "\nThe `Select…End Select` construct is helpful when evaluating different possible\
    \ outcomes for the same condition. As a result, the `Select` statement is an alternative\
    \ to the `If…End If` block with several `Else-If` evaluations. Implementing the\
    \ `Select` statement is more efficient than the `Else-If` statement in certain\
    \ cases because every expression for `Else-If` is evaluated, whereas the `Select\
    \ …End Select` is evaluated only one time. `Select` blocks can only be used when\
    \ evaluating different variations of the same expressions. The following is the\
    \ syntax for a `Select Case` statement:\n\n### Syntax\n\n```vb\nSelect Case <condition>\n\
    \    Case <1st possibility>\n        <statement>\n    Case <2nd possibility>\n\
    \        <statement>\n    Case <3rd possibility>\n        <statement>\n    Case\
    \ <n possibility>\n        <statement>\n    Case Else\n        <statement>\nEnd\
    \ Select\n```\n\nFigure 5.15\n![](images/00139.jpg)\n\n```vb\nOption Explicit\n\
    \nDim strColor\nstrColor = \"Purple\"\n\nSelect Case strColor\n    Case \"Black\"\
    \n        MsgBox \"Black is a dark color\"\n    Case \"Green\"\n        MsgBox\
    \ \"Green is a nice color\"\n    Case \"Purple\"\n        MsgBox \"Purple is a\
    \ pretty color\"\n    Case Else\n        MsgBox \"The color is not Black, Green,\
    \ or Purple\"\nEnd Select\n```\n\nThe output displays “Purple is a pretty color”\n\
    \nFigure 5.16\n![](images/00154.jpg)\n\nThe first line evaluates the condition\
    \ `strColor`. Then the `Case` statements check for possibilities. Finally, always\
    \ consider the `Case Else` block, even though it is optional. It will be executed\
    \ if none of the possibilities return True. There are two reasons for adding the\
    \ optional `Case Else` block:\n\n1. To add documentation to the code explaining\
    \ why it should not be executed, or\n2. To catch unexpected changes to the programmer’s\
    \ code or input data\n\n## “Nested Select Case” Block Branch\n\nThe `Select…End\
    \ Select` blocks can be nested within one another. In addition, programmers can\
    \ nest `If…End If` blocks inside the `Select …End Select` block. The following\
    \ is a nested `Select Case` block:\n\n### Syntax\n\n```vb\nSelect Case <condition>\n\
    \    Case <1st possibility>\n        Select Case <condition>\n            Case\
    \ <1st possibility>\n                If <condition> Then\n                   \
    \ <statement>\n                Else\n                    <statement>\n       \
    \         End If\n            Case <2nd possibility>\n                <statement>\n\
    \            Case <3rd possibility>\n                <statement>\n           \
    \ Case Else\n                <statement>\n        End Select\n    Case <2nd possibility>\n\
    \        <statement>\n    Case <3rd possibility>\n        <statement>\n    Case\
    \ Else\n        <statement>\nEnd Select\n```\n\nFigure 5.17\n![](images/00204.jpg)\n\
    \n```vb\nOption Explicit\n\nDim strColor, strBlack\nstrColor = \"Black\"\nstrBlack\
    \ = \"Light Black\"\n\nSelect Case strColor\n    Case \"Black\"\n        Select\
    \ Case strBlack\n            Case \"Light Black\"\n                If strBlack\
    \ = \"Light Black\" Then\n                    MsgBox \"The color is Light Black\
    \ and looks gray / grey\"\n                Else\n                    MsgBox \"\
    The color is not Light Black\"\n                End If\n        Case \"Medium\
    \ Black\"\n            MsgBox \"The color is between Light and Dark Black\"\n\
    \        Case \"Dark Black\"\n            MsgBox \"The color is Dark Black\"\n\
    \        Case Else\n            MsgBox \"The color is not Black\"\n    Case \"\
    Green\"\n        MsgBox \"Green is a nice color\"\n    Case \"Purple\"\n     \
    \   MsgBox \"Purple is a pretty color\"\n    Case Else\n        MsgBox \"The color\
    \ is not Black, Green, or Purple\"\nEnd Select\n```\n\nThe output displays “The\
    \ color is Light Black and looks gray / grey”\n\nFigure 5.18\n![](images/00158.jpg)\n\
    \n## Looping Statements\n\nLooping is the process of repeating the same block\
    \ of code. VBScript has four looping statements that are used in different circumstances.\
    \ The four looping statements are:\n\n1. `For…Next` Statement\n2. `For Each…Next`\
    \ Statement\n3. `Do…Loop` Statement\n4. `While…Wend` Statement\n\nAlthough there\
    \ are four looping statements, the `While…Wend` statement has descended from popularity.\
    \ The `While…Wend` statement works without a problem, but has been replaced by\
    \ the `Do…Loop` statement. `Do…Loop` statements perform the same function as the\
    \ `While…Wend` statement. However, the `Do…Loop` statement is more versatile because\
    \ it has keywords `While` and `Until` and can break out of the loop using an `Exit\
    \ Do` statement. This section will focus on three of the four looping statements.\n\
    \n### For…Next Statement\n\nThe `For…Next` loop repeats a group of statements\
    \ a finite number of times. The following is an example of the `For…Next` syntax:\n\
    \n### Syntax\n\n```vb\nFor Iterator = StartValue To EndValue (StepExpression)\n\
    \    <statement>\n    (Exit For)\nNext\n```\n\nFigure 5.19\n\n| Arguments | Description\
    \ |\n| :--- | :--- |\n| Iterator | A variable that is used as a loop iterator\
    \ |\n| StartValue | The starting value of the iterator |\n| EndValue | The ending\
    \ value of the iterator |\n| StepExpression | The iterator changes after every\
    \ loop according to the step expression value. Default value is one. |\n| Statement\
    \ | A statement or statements that are executed |\n| Exit For | Forces a break\
    \ out of the loop |\n\nFigure 5.20\n![](images/0033.jpg)\n\n```vb\nOption Explicit\n\
    \nDim intNumber\nFor intNumber = 1 To 6 Step 2\n    MsgBox \"Iterator Value: \"\
    \ & intNumber\nNext\n```\n\nThe first output displays “Iterator Value: 1,” the\
    \ second output displays “Iterator Value: 3,” and the third output displays “Iterator\
    \ Value: 5.”\n\nFigure 5.21\n![](images/00163.jpg)(images/00166.jpg)(images/00026.jpg)\n\
    \nThe `For` block specifies the iterator loop variable `intNumber`, a start value\
    \ of one, an end value of six, and a numeric step expression. Consequently, the\
    \ `Next` block is increased by the step expression, which is “2” in the example.\
    \ The step expression allows VBScript to skip numbers two, four, and six while\
    \ selecting one, three, and five. The step expression also allows VBScript to\
    \ decrease the iterator value by using a negative number, causing the loop to\
    \ go backwards. It is important to make the end value less than the start value\
    \ when using a negative number. The following is an example of a negative step\
    \ expression:\n\nFigure 5.22\n![](images/0068.jpg)\n\n```vb\nOption Explicit\n\
    \nDim intNumber\nFor intNumber = 6 To 1 Step -2\n    MsgBox \"Iterator Value:\
    \ \" & intNumber\nNext\n```\n\nThe first output displays “Iterator Value: 6,”\
    \ the second output displays “Iterator Value: 4,” and the third output displays\
    \ “Iterator Value: 2.”\n\nFigure 5.23\n![](images/00042.jpg)(images/00177.jpg)(images/00180.jpg)\n\
    \nThe step expression is optional, but defaults to one if it is omitted. The following\
    \ is an example of the For Loop without the step expression:\n\nFigure 5.24\n\
    ![](images/00120.jpg)\n\n```vb\nOption Explicit\n\nDim intNumber\nFor intNumber\
    \ = 0 To 2\n    MsgBox \"Iterator Value: \" & intNumber\nNext\n```\n"
