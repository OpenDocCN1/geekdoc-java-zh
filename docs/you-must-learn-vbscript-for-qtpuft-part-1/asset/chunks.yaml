  trans: "\n运行脚本时，代码按照特定的层级顺序执行。代码的执行顺序称为流（参见第 5 章流程控制）。简单的脚本从上到下执行，也称为自上而下的程序。脚本引擎从第一条语句开始执行，然后移动到下一条语句，继续向下执行直到到达最后一条语句。在不包含分支或循环的情况下，执行按这种方式进行。\n\
    \n## 分支\n\n分支是一种根据某些条件执行特定语句的技术（参见第 5 章流程控制中的分支结构）。VBScript 有两种分支结构：“If”分支和“Select\
    \ Case”分支。\n\n### If 分支\n\n*   `If 语句：当条件为真时执行一组代码\n\n图 1.1\n![](img/0002.jpg)\n\
    \n```vb\nOption Explicit\nDim strTest4Success\nstrTest4Success = \"Test 4 Success\
    \ has Free Live Training and Free Valuable Videos\"\nIf strTest4Success <> Empty\
    \ Then\n    MsgBox strTest4Success\nEnd If\n```\n输出显示“Test 4 Success has Free\
    \ Live Training and Free Valuable Videos.”\n\n图 1.2\n![](img/00007.jpg)\n\n* \
    \  `If-Then-Else 语句：选择两组代码中的一组执行\n\n图 1.3\n![](img/00073.jpg)\n\n```vb\nOption\
    \ Explicit\nDim strTest4Success\nstrTest4Success = \"Test 4 Success has Free Live\
    \ Training and Free Valuable Videos\"\nIf strTest4Success = Empty Then\n     \
    \   MsgBox strTest4Success\nElse\n        MsgBox \"Test 4 Success is empty\" \n\
    End If\n```\n输出显示“Test 4 Success is empty.”\n\n图 1.4\n![](img/00022.jpg)\n\n*\
    \   `If-Then-ElseIf 语句：选择多组代码中的一组执行\n\n图 1.5\n![](img/00194.jpg)\n\n```vb\nOption\
    \ Explicit\nDim strMsg\nstrMsg = \"VBScript and QTP / UFT\"\nIf strMsg = \"VBScript\"\
    \ Then\n    MsgBox \"You can master VBScript\"\nElseIf strMsg = \"QTP / UFT\"\
    \ Then\n    MsgBox \"You can master QTP / UFT\"\nElseIf strMsg = \"VBScript and\
    \ QTP / UFT\" Then\n    MsgBox \"You can master VBScript and QTP / UFT\"\nElse\n\
    \    MsgBox \"Every master was once a disaster\"\nEnd If\n```\n输出显示“You can master\
    \ VBScript and QTP / UFT.”\n\n图 1.6\n![](img/00036.jpg)\n\n### Select Case 分支\n\
    \n*   `Select Case 语句：根据实际值而非真或假来做决策。Select Case 语句为同一个表达式选择多组代码中的一组执行\n\n图 1.7\n\
    ![](img/00011.jpg)\n\n```vb\nOption Explicit\nDim strMsg\nstrMsg = \"VBScript\
    \ and QTP / UFT\"\nSelect Case strMsg\n    Case \"VBScript\"\n        MsgBox \"\
    You can master VBScript\"\n    Case \"QTP / UFT\"\n        MsgBox \"You can master\
    \ QTP / UFT\"\n    Case \"VBScript and QTP / UFT\"\n        MsgBox \"You can master\
    \ VBScript and QTP / UFT\"\n    Case Else\n        MsgBox \"Every master was once\
    \ a disaster\"\nEnd Select\n```\n输出显示“You can master VBScript and QTP / UFT.”\n\
    \n图 1.8\n![](img/00049.jpg)\n\n## 循环\n\n循环反复执行代码行（参见第 5 章中的循环）。当需要重复执行代码块直到条件为真，或者重复执行代码块固定次数时，循环非常有用。大多数程序员使用以下结构：`For\
    \ Next`和`Do Loop`。\n\n*   `For Next 语句：按指定的次数运行代码\n\n图 1.9\n![](img/00039.jpg)\n\
    \n```vb\nOption Explicit\nDim i\nFor i = 1 to 3\n    MsgBox \"Number \" & i\n\
    Next\n```\n输出显示“Number 1”，第二次输出显示“Number 2”，第三次输出显示“Number 3”。\n\n图 1.10\n![](img/00062.jpg)!(images/00141.jpg)!(images/00145.jpg)\n\
    \n*   `For Each-Next 语句：对集合（存储一组数据）或数组（数据的矩阵）中的每个项目运行代码\n\n图 1.11\n![](img/00016.jpg)\n\
    \n```vb\nOption Explicit\nDim i\nDim intAge\nintAge = Array(34, 36, 38)\nFor Each\
    \ i In intAge\n    MsgBox \"Age: \" & i\nNext\n```\n输出显示“Age: 34”，第二次输出显示“Age:\
    \ 36”，第三次输出显示“Age: 38”。\n\n图 1.12\n![](img/00150.jpg)!(images/00155.jpg)!(images/00176.jpg)\n\
    \n*   `Do Loop 语句：在条件为真时或直到条件为真时循环执行代码\n\n图 1.13\n![](img/00202.jpg)\n\n```vb\n\
    Option Explicit\nDim i\ni = 1\nDo While i < 3\n    MsgBox \"Number \" & i & \"\
    \ is less than 3\"\n    i = i + 1\nLoop\n```\n输出显示“Number 1 is less than 3”，第二次输出显示“Number\
    \ 2 is less than 3。”\n\n图 1.14\n![](img/00205.jpg)!(images/00010.jpg)\n\n图 1.15\n\
    ![](img/00084.jpg)\n\n```vb\nOption Explicit\nDim i = 1\nDo\n    MsgBox i & \"\
    \ is less than or equal to 3\"\n    i = i + 1\nLoop Until i > 3\n```\n第一次输出显示“1\
    \ is less than or equal to 3”，第二次输出显示“2 is less than or equal to 3”，第三次输出显示“3\
    \ is less than or equal to 3”。\n\n图 1.16\n![](img/0170.jpg)!(images/0173.jpg)!(images/0053.jpg)\n\
    \n## 编码规范\n\n养成良好的习惯是非常重要的，因为良好的习惯确保了代码更容易阅读、理解，并包含更少的错误。从长远来看这是有利的。良好的布局提高了了你和其他程序员的可读性。代码缩进显示了行之间的从属关系。因此，相关的代码应该保持在一起。\n\
    \n### 匈牙利命名法\n\n匈牙利命名法涉及为变量名添加前缀（参见第 2 章变量与数据类型中的匈牙利命名法）。结果在前缀中指示变量范围和类型。这使得程序更容易编写和阅读。例如，`strName`\
    \ 就是匈牙利命名法。前缀 `str` 定义该变量为字符串。\n"
- fmt: "\n'(Bad Comment) String \"strName\" combines the First Name and Last Name\n\
    \n`strName = strFirstName & \" \" & strLastName`\n\n'(Good Comment) Purpose of\
    \ \"strName\" is to place the name in the Customer table not Employee table\n\n\
    `strName = strFirstName & \" \" & strLastName`\n\n# Code Modularization\n\nAs\
    \ more code is added to scripts, it becomes harder to read in one chunk. At some\
    \ point, decisions will redirect the code by way of branching or loops. Consequently,\
    \ the code gets more complex, making the introduction of errors easy. Poor layout\
    \ of the code (also known as spaghetti code) makes things harder to find and fix.\n\
    \nModularization is a technique programmers use to manage the code’s complexity.\
    \ It is the process of organizing code into modules, which can be considered building\
    \ blocks. Procedures are used to achieve modularity. There are two types of procedures:\
    \ `Sub Procedure` and `Function Procedure`.\n\n## Sub Procedure\n\n`Sub Procedure`\
    \ is a series of statements surrounded by the `Sub` and `End Sub` statements (see\
    \ [Sub Procedure](#index_split_014.html_filepos202464) in Chapter 6 Procedures-Functions.)\
    \ It can perform an action and take arguments (also known as parameters), but\
    \ does not return a value. Actions carry out a task, such as adding numbers. Arguments\
    \ are special variables used for procedures to provide data as input. The following\
    \ is the syntax for a `Sub Procedure`:\n\n### Syntax\n\n```\nSub NameOfSubProcedure()\n\
    \    code  \nEnd Sub\n\nSub NameOfSubProcedure ([Argument1], [ArgumentN])\n  \
    \  code\nEnd Sub\n```\n\n## Function Procedure\n\n`Function Procedure` is a series\
    \ of statements surrounded by the `Function` and `End Function` Statements (see\
    \ [Function Procedure](#index_split_014.html_filepos209589) in Chapter 6 Procedures-Functions.)\
    \ It can perform an action, take arguments, and return a value. The value is returned\
    \ by assigning a value to its name. The following is the syntax for a `Function\
    \ Procedure`:\n\n### Syntax\n\n```\nFunction NameOfFunctionProcedure()\n    code\
    \     \n    NameOfFunctionProcedure = some value\nEnd Function\n\nFunction NameOfFunctionProcedure\
    \ ([Argument1], [ArgumentN])\n    code         \n    NameOfFunctionProcedure =\
    \ some value\nEnd Function\n```\n\nChapter 1 outlines the foundational principles\
    \ of variables, flow control, and coding standards. [Chapter 2](#index_split_010.html_filepos39305)\
    \ will explore variables and the Hungarian Naming Convention, as well the variable\
    \ data types.\n\n# Chapter 2 Variables and Data Types\n\nVariables are extremely\
    \ important in VBScript. Variables hold data for the scripts. Every input, output,\
    \ and process within the scripts use variables. Data within variables can be held\
    \ for later use, while some variables are discarded as soon as they are used.\
    \ Placing values into variables is called initializing. Values are placed into\
    \ variables by default or from the application. The database is also used to store\
    \ values within variables. The database could be a text file, an excel file, etc.\n\
    \nThis chapter will explain the following:\n\n*   [Variable Rules](#index_split_010.html_filepos40945)\n\
    *   [Variable Types](#index_split_010.html_filepos41816)\n*   [Variable Lifetime/Scope](#index_split_010.html_filepos44914)\n\
    *   [Declare Variables](#index_split_010.html_filepos53623)\n*   [Option Explicit](#index_split_010.html_filepos56958)\n\
    *   [Data Types](#index_split_010.html_filepos39464)\n*   [Hungarian Naming Convention](#index_split_009.html_filepos33523)\n\
    \n## Variable Rules\n\nVariables can be used to hold values (`x=3`) or expressions\
    \ (`x = y + z`). Make sure that the variable name is on the left and values are\
    \ on the right when assigning values to variables. A variable can have a short\
    \ name like “z” or a descriptive name like “strTestPage.” The following are some\
    \ rules for variables:\n\n1.  Cannot exceed 255 characters\n2.  Underscore “_”\
    \ is the only valid non-alphanumeric character\n3.  Must start with a letter (uppercase\
    \ or lowercase)\n\n## Variable Types\n\nThere are three types of variables. The\
    \ following is a list of each variable type:\n\n1.  [Scalar](#index_split_010.html_filepos42408)\n\
    2.  [Array](#index_split_010.html_filepos42777)\n3.  [Constant](#index_split_010.html_filepos43270)\n\
    \n### Scalar\n\nScalar variables contain only one value that can change before\
    \ or during execution. The following example has a variable called “x,” with a\
    \ value of “34.”\n\n```\nDim x\nx = 34\n```\n\n### Array\n\nArray variables contain\
    \ multiple values (see [Arrays](#index_split_012.html_filepos110975) in Chapter\
    \ 6).\n\n```\nDim y(3)\ny(0) = 4\ny(1) = 5\ny(2) = 6\ny(3) = 7\n```\n\n### Constant\n\
    \nConstant variables contain values that cannot change before or during execution.\
    \ Generally, the convention, the name of a constant is in all capital letters.\n\
    \n```\nConst NUMBER = 3\n```\n\n### Literals\n\nA literal is static (fixed) data\
    \ that contains text, numbers, or Boolean values. Values such as `True` or `False`\
    \ are literals. The following is an example of a literal:\n\n```\nOption Explicit\n\
    Dim datBirthday\ndatBirthday = #05/09/12#\nMsgBox \"Test For success \" & datBirthday\n\
    ```\n\n## Variable Lifetime/Scope\n\nThe lifetime of a variable depends on its\
    \ existence. It can exist locally or globally. Local variables are declared within\
    \ a procedure, while global variables are declared outside. A variable is destroyed\
    \ after the procedure exit if it is local. The following is an example of two\
    \ procedures possessing local variables with the same name:\n\n```\nOption Explicit\n\
    Call DisplayOldColor\nCall ReturnNewColor\n\nSub DisplayOldColor()\n    Dim strCarColor\n\
    \    strCarColor = \"blue\"\n    MsgBox \"My old car was \" & strCarColor\nEnd\
    \ Sub\n\nFunction ReturnNewColor()\n    Dim strCarColor\n    strCarColor = \"\
    black\"\n    ReturnNewColor = strCarColor\nEnd Function\n```\n\nThe first output\
    \ displays “My old car was blue,” using local variable `strCarColor`, while second\
    \ output displays “My new car is black,” using a local variable `strCarColor`\
    \ with the same name.\n\nGlobal variables are variables declared outside a procedure.\
    \ All procedures can access global variables. As a result, they cannot have duplicate\
    \ names. The lifetime of these variables begins when they are declared and ends\
    \ when the program is closed. Variable lifetime and scope are interrelated. The\
    \ following are three types/levels of variable scope:\n\n*   [Script Level Scope](#index_split_010.html_filepos48005)\n\
    *   [Procedure Level Scope](#index_split_010.html_filepos49668)\n*   [Class Level\
    \ Scope](#index_split_010.html_filepos50952)\n\n### Script Level Scope\n\nScript\
    \ Level Scope (interrelated with global variable) is when the variable is available\
    \ to all of the scripts in a script file. These variables are not declared in\
    \ a procedure or class. The following is an example of a variable with script\
    \ level scope:\n\n```\nOption Explicit\nDim strFirstName\nstrFirstName = \"Rex\"\
    \nCall DisplayFirstName(strFirstName)\nCall Greet(strFirstName)\n```\n"
