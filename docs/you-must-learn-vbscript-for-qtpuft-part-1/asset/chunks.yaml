  trans: "\n\n```vb\nFunction AddNumbers (intFirstNumber, intSecondNumber, intThirdNumber)\n\
    \    AddNumbers = intFirstNumber + intSecondNumber + intThirdNumber\nEnd Function\n\
    ```\n\n运行错误显示“由于语法错误，测试运行无法继续。”\n\n图 6.30\n![](img/00057.jpg)\n\n## 参数声明（ByRef\
    \ 或 ByVal）\n\n根据在过程中的声明方式，参数可以按引用传递（`ByRef`）或按值传递（`ByVal`）表示。如果没有声明，则默认为 `ByRef`。使用\
    \ `ByRef` 时，在过程中对值的更改是永久的，并会反映在调用它的代码中。相反，将参数指定为 `ByVal` 意味着过程中的代码可以更改变量的值，但这些更改不是永久的。一旦过程结束，更改就会消失。以下是一个不使用\
    \ `ByRef` 和 `ByVal` 声明参数的示例：\n\n图 6.31\n![](img/00047.jpg)\n\n```vb\nOption Explicit\n\
    \nDim intFirst, intSecond\n\nintFirst = 100\n\nintSecond = 100\n\nCall No_ByRef_ByVal\
    \ (intFirst, intSecond)\n\nMsgBox \"intFirst = \" & intFirst & vbNewLine & \"\
    intSecond = \" & intSecond \n\nSub No_ByRef_ByVal (intFirstNumber, intSecondNumber)\n\
    \    intFirstNumber = intFirstNumber + 10\n    intSecondNumber = intSecondNumber\
    \ + 10\n    MsgBox \"intFirstNumber = \" & intFirstNumber & vbNewLine & _\n  \
    \      \"intSecondNumber = \" & intSecondNumber\nEnd Sub\n```\n\n第一个输出显示“intFirstNumber\
    \ = 110”和“intSecondNumber = 110”，而第二个输出显示“intFirst = 110”和“intSecond = 110”。\n\
    \n图 6.32\n![](img/00075.jpg)![](img/00167.jpg)\n\n以下是一个使用 `ByRef` 和 `ByVal` 声明参数的示例：\n\
    \n图 6.33\n![](img/00151.jpg)\n\n```vb\nOption Explicit\n\nDim intFirst, intSecond\n\
    \nintFirst = 100\n\nintSecond = 100\n\nCall ByRef_ByVal (intFirst, intSecond)\n\
    \nMsgBox \"intFirst = \" & intFirst & vbNewLine & \"intSecond = \" & intSecond\
    \ \n\nSub ByRef_ByVal (ByRef intFirstNumber, ByVal intSecondNumber)\n    intFirstNumber\
    \ = intFirstNumber + 10\n    intSecondNumber = intSecondNumber + 10\n    MsgBox\
    \ \"intFirstNumber = \" & intFirstNumber & vbNewLine & _\n        \"intSecondNumber\
    \ = \" & intSecondNumber\nEnd Sub\n```\n\n第一个输出显示“intFirstNumber = 110”和“intSecondNumber\
    \ = 110”，而第二个输出显示“intFirst = 110”和“intSecond = 100”。\n\n图 6.34\n![](img/00100.jpg)![](img/00048.jpg)\n\
    \n变量 `intFirst` 和 `intSecond` 在脚本级别声明并初始化为 100。参数 `intFirstNumber` 声明为 `ByRef`，参数\
    \ `intSecondNumber` 声明为 `ByVal`。两个参数在过程 `ByRef_ByVal` 中都增加了十，输出为“110”。观察 `intFirst`\
    \ 的值为 110。只有 `intFirst` 在过程之外发生了变化，因为它按引用传递。变量 `intSecond` 按值传递，显示为 100。`ByRef`\
    \ 值的更改不会反映在过程之外。\n\n## 内置函数\n\nVBScript 自动提供了一个名为内置函数（Built-In Functions）的函数库。内置函数允许程序员更高效，而不浪费时间创建已经存在的函数。`MsgBox`\
    \ 是一个内置函数，具有多个在书中一直用过的参数。第一个参数在对话框中显示消息，而其他参数（如按钮参数（第二个参数）和标题参数（第三个参数））是可选的。以下是一个使用按钮和标题参数的\
    \ `MsgBox` 示例：\n\n```vb\nMsgBox \"Do you want to join Rex Jones for Free Live\
    \ Training? \", VYesNo, \"FREE LIVE TRAINING\"\n```\n\n输出显示“Do you want to join\
    \ Rex Jones for Free Live Training?”\n\n图 6.35\n![](img/00121.jpg)\n\n通常，对话框显示一条消息和一个\
    \ OK 按钮。此示例显示了一个标题“FREE LIVE TRAINING”、一条消息“Do you want to join Rex Jones for\
    \ Free Live Training”以及两个按钮 Yes 和 No。在大多数情况下，程序员仅出于调试目的使用 `MsgBox` 函数。因此，可选参数并不是必须的。以下是一些实用的内置函数列表，分为以下几个部分：\n\
    \n*   [数组函数]\n*   [转换函数]\n*   [日期/时间函数]\n*   [格式化函数]\n*   [数学函数]\n*   [杂函数]\n\
    *   [字符串函数]\n\n## 数组函数\n\n图 6.36\n\n| 函数 | 描述 |\n| :--- | :--- |\n| Array | 返回一个包含数组的变体\
    \ |\n| Filter | 返回一个零基数组，根据过滤标准包含字符串数组的子集 |\n| IsArray | 返回一个布尔值，指示指定的变量是否为数组\
    \ |\n| Join | 返回一个由数组元素组成的字符串 |\n| LBound | 返回维的最小下标 |\n| Split | 返回一个包含指定数量字符串的数组\
    \ |\n| UBound | 返回维的最大下标 |\n\n## 转换函数\n\n图 6.37\n\n| 函数 | 描述 |\n| :--- | :---\
    \ |\n| Asc | 将字符串转换为 ANSI 代码 |\n| CBool | 将表达式转换为布尔变体 |\n| CByte | 将表达式转换为字节变体\
    \ |\n| CCur | 将表达式转换为货币变体 |\n| CDate | 将有效的日期时间转换为日期变体 |\n| CDbl | 将表达式转换为双精度浮点变体\
    \ |\n| Chr | 将指定的 ANSI 代码转换为字符 |\n| CInt | 将表达式转换为整数变体 |\n| CLng | 将表达式转换为长变体\
    \ |\n| CSng | 将表达式转换为单精度浮点变体 |\n| CStr | 将表达式转换为字符串变体 |\n\n## 日期/时间函数\n\n图 6.38\n\
    \n| 函数 | 描述 |\n| :--- | :--- |\n| Date | 返回当前系统日期 |\n| DateAdd | 返回增加时间间隔后的日期\
    \ |\n| DateDiff | 返回两个日期之间的间隔数 |\n| DatePart | 返回日期的指定部分 |\n| DateSerial | 返回指定年、月、日的日期\
    \ |\n| DateValue | 返回日期 |\n| Day | 返回月份中的数字（1 到 31 之间） |\n| FormatDateTime | 返回格式化为日期或时间的表达式\
    \ |\n| Hour | 返回小时的数字（0 到 23 之间） |\n| IsDate | 返回一个布尔值，指示评估的表达式是否可以转换为日期 |\n|\
    \ Minute | 返回分钟的数字（0 到 59 之间） |\n| Month | 返回月份的数字（1 到 12 之间） |\n| MonthName |\
    \ 返回指定月份的名称 |\n| Now | 返回当前系统日期和时间 |\n| Second | 返回秒的数字（0 到 59 之间） |\n| Time |\
    \ 返回当前系统时间 |\n| Timer | 返回自午夜 12:00 以来的秒数 |\n| TimeSerial | 返回指定时、分、秒的时间 |\n|\
    \ TimeValue | 返回时间 |\n| Weekday | 返回星期几（1 到 7 之间） |\n| WeekdayName | 返回指定星期几的名称\
    \ |\n| Year | 返回年份的数字 |\n\n## 格式化函数\n\n图 6.39\n\n"
