    Option Explicit


    VBScript is a loosely-typed language, which does not require programmers to declare
    the data type of a variable. Programming languages are classified as loosely-typed
    when the data type can hold any kind of data. Therefore, variables are not required
    to be explicitly declared. However, this convenience can be risky to utilize.
    Variables can be misspelled when automatically declared, which is a problem that
    VBScript will not catch. VBScript assumes that the Programmer is creating a new
    variable, then allocates memory and provides an “Empty” Sub-Data Type.


    The accident of misspelling variables can be prevented by using an “Option Explicit”
    Statement. Option Explicit is placed at the top of each script file and applies
    to the entire script file. This informs VBScript that all variables should be
    explicitly declared before they can be used. When Option Explicit is implemented
    in the file, then an error occurs when there is a typing error with a variable.
    The following is an example of an Option Explicit Statement:


    Figure 2.9


    ![](images/00127.jpg)


    Option Explicit


    Dim strMessage


    strMessage = "Option Explicit is very important in VBScript"


    MsgBox strMessage


    The output displays “Option Explicit is very important in VBScript”


    Figure 2.10


    ![](images/00077.jpg)


    Data Types


    All variables have a variant data type. Variant is a special data type that contains
    different kinds of information according to how it is used. The information will
    be in numeric or string form. There are distinctions with numeric information
    ranging in size from Boolean Values to Floating Point Numbers. Several categories
    of string and numeric Variant information are called Sub-Data Types. The following
    are Sub-Data Types:


    Figure 2.11


    | Sub-Data Type | Description |


    | Empty | Value is “0” or an empty value. The variable is uninitialized when it
    is created and no value is assigned to it when the variable is set to empty |


    | Null | Variable with invalid data |


    | Boolean | Contains either True or False |


    | Byte | Contains numeric values ranging from 0 to 255 |


    | Integer | Contains numeric values ranging from -32,768 to 32,767 |


    | Currency | Contains a currency value ranging from -922,337,203,685,477.5808
    to 922,337,203,685, 477.5807 |


    | Long | Contains numeric values ranging from -2,147,483,648 to 2,147,483,647
    |


    | Single | Contains a single-precision, floating-point number |


    | Double | Contains a double-precision, floating-point number |


    | Date (Time) | Contains a date and time |


    | String | Contains alphanumeric character(s) stored in double quotes |


    | Object | Contains an object |


    | Error | Contains an error number |


    Hungarian Naming Convention'
