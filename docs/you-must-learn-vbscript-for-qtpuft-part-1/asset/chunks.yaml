    Chapter 6 discussed procedures and functions. The two procedures are Sub Procedure
    and Function Procedure. Function Procedures return values while Sub Procedures
    do not return values. There are several functions called Built-In Functions that
    allow programmers to be efficient with their code. [Chapter 7](#index_split_015.html_filepos253360)
    describes the concept of creating and destroying objects.


    Chapter 7 Create and Destroy Objects


    Objects are different from other Sub Data Types because they need to be created
    explicitly with a separate command. Like variables, objects have a location in
    the computer’s memory, but the object’s variable only holds a reference to the
    object. In other words, the object’s variable contain information (also known
    as an address) for locating the object in memory.


    Chapter seven will cover the following principles of objects:


    *   [Create Objects](#index_split_015.html_filepos254722)


    *   [Properties and Methods](#index_split_015.html_filepos257542)


    *   [Multiple References](#index_split_015.html_filepos258051)


    *   [With Construct](#index_split_015.html_filepos261205)


    *   [Destroy Objects](#index_split_015.html_filepos263012)


    Note: All of the examples in this chapter use a Dictionary Object (see Dictionary
    Objects in Chapter 2 “Part 2 - You Must Learn VBScript for QTP – UFT”.)


    Create Objects


    Before using objects, an instance of the object must be created with its reference
    stored in a variable. The creation of an object is also known as instantiating
    an object. A copy of the object is assigned to the code that created the object.
    The following is the syntax for creating an object using a Dictionary Object:


    Syntax


    CreateObject(Servername.Typename[, Location])


    ----------------------------------


    Figure 7.1


    | Parameter | Description |


    | Servername | Required. The name of the application that provides the object
    |


    | Typename | Required. The type/class of the object |


    | Location | Optional. Where to create the object |


    Figure 7.2


    ![](images/00131.jpg)


    Option Explicit


    Dim objGreet


    Set objGreet = CreateObject("Scripting.Dictionary")


    objGreet.Add 1, "James"


    MsgBox "How many objects are in objGreet: " & objGreet.Count


    The output displays “How many objects are in objGreet: 1.”


    Figure 7.3


    ![](images/00152.jpg)


    The code declares a variable to reserve the object: “objGreet,” then uses the
    Set command and CreateObject function to create the object. Set commands are used
    when an object variable must be initialized. At the same time, the CreateObject
    function has the assignment of creating the object once the object name “Scripting.Dictionary”
    is passed. After the Add method: “objGreet.Add” adds an item pair, the MsgBox
    displays “1” because it is the value of the object’s Count property: “objGreet.Count.”


