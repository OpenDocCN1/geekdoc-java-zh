    Argument Declaration (ByRef or ByVal)


    An argument is represented by reference (ByRef) or by value (ByVal), according
    to how it is declared in the procedure. ByRef is the default if there is not a
    declaration. A change to the value in a procedure is permanent and reflected in
    the calling code when using ByRef. On the contrary, designating an argument as
    ByVal means that the code within a procedure can change the value of a variable,
    but they are not permanent. The changes are eliminated as soon as the procedure
    terminates. The following is an example of not declaring the arguments using ByRef
    and ByVal:


    Figure 6.31


    ![](images/00047.jpg)


    Option Explicit


    Dim intFirst, intSecond


    intFirst = 100


    intSecond = 100


    Call No_ByRef_ByVal (intFirst, intSecond)


    MsgBox "intFirst = " & intFirst & vbNewLine & "intSecond = " & intSecond 


    Sub No_ByRef_ByVal (intFirstNumber, intSecondNumber)          


            intFirstNumber = intFirstNumber + 10         


            intSecondNumber = intSecondNumber + 10                 


            MsgBox "intFirstNumber = " & intFirstNumber & vbNewLine & _


            "intSecondNumber = " & intSecondNumber


    End Sub


    The first output displays “intFirstNumber = 110” and “intSecondNumber = 110” while
    the second output displays “intFirst = 110” and “intSecond = 110.”


    Figure 6.32


    ![](images/00075.jpg)![](images/00167.jpg)


    The following is an example of declaring the arguments using ByRef and ByVal:


    Figure 6.33


    ![](images/00151.jpg)


    Option Explicit


    Dim intFirst, intSecond


    intFirst = 100


    intSecond = 100


    Call ByRef_ByVal (intFirst, intSecond)


    MsgBox "intFirst = " & intFirst & vbNewLine & "intSecond = " & intSecond 


    Sub ByRef_ByVal (ByRef intFirstNumber, ByVal intSecondNumber)         


            intFirstNumber = intFirstNumber + 10         


            intSecondNumber = intSecondNumber + 10


            MsgBox "intFirstNumber = " & intFirstNumber & vbNewLine & _


            "intSecondNumber = " & intSecondNumber


    End Sub


    The first output displays “intFirstNumber = 110” and “intSecondNumber = 110,”
    while the second output displays “intFirst = 110” and “intSecond = 100.”


    Figure 6.34


    ![](images/00100.jpg)![](images/00048.jpg)


    The variables intFirst and intSecond are declared at the script level and initialized
    to 100\. Argument intFirstNumber is declared as ByRef and argument intSecondNumber
    as ByVal. Both arguments are increased by ten within the procedure “ByRef_ByVal,”
    which outputs “110” ([Figure 6.32 “1st dialog”](#index_split_014.html_filepos225706)).
    Observe how intFirst has a value of 110 ([Figure 6.32 “2nd dialog”](#index_split_014.html_filepos225706)).
    Only intFirst was changed outside of the procedure because it was passed by reference.
    Variable intSecond was passed by value and displays 100 ([Figure 6.32 “2nd dialog”](#index_split_014.html_filepos225706)).
    ByRef value changes are not reflected outside of the procedure.


    Built-In Functions


    VBScript automatically provides a library of functions called Built-In Functions.
    The Built-In Functions allow programmers to be more efficient and not waste time
    creating a function that already exists. MsgBox is a Built-In Function with several
    parameters that have been used throughout this book. The first parameter displays
    a message in a dialog box while the other parameters, such as the button parameter(second
    parameter) and title parameter(third parameter), are optional. The following is
    a MsgBox example using the button and title parameters:


    Option Explicit


    MsgBox "Do you want to join Rex Jones for Free Live Training? ", VbYesNo, "FREE
    LIVE TRAINING"


    The output displays “Do you want to join Rex Jones for Free Live Training?”


    Figure 6.35


    ![](images/00121.jpg)


    Normally, the dialog displays a message and an OK button. This example shows a
    title “FREE LIVE TRAINING,” a message “Do you want to join Rex Jones for Free
    Live Training,” and two buttons Yes and No. In most cases, programmers only use
    the MsgBox function for debugging purposes. Therefore, the optional parameters
    are not necessary. The following is a list of some useful Built-In Functions divided
    by the following sections:


