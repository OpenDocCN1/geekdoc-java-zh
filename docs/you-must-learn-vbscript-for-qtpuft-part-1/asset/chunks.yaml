    Figure 5.16


    ![](images/00154.jpg)


    The first line evaluates the condition “strColor.” Then the Case statements check
    for possibilities. Finally, always consider the “Case Else” block, even though
    it is optional. It will be executed if none of the possibilities return True.
    There are two reasons for adding the optional Case Else block:


    1.  To add documentation to the code explaining why it should not be executed,
    or


    2.  To catch unexpected changes to the programmer’s code or input data


    “Nested Select Case” Block Branch


    The Select…End Select blocks can be nested within one another. In addition, programmers
    can nest If…End If blocks inside the Select …End Select block. The following is
    a nested Select Case block:


    Syntax


    Select Case <condition>


            Case <1st possibility>


                    Select Case <condition>


                            Case <1st possibility>


                                    If <condition> Then


                                            <statement>                                 


                                    Else


                                            <statement>                                 


                                   End If


                            Case <2nd possibility>


                                    <statement>                         


                            Case <3rd possibility>


                                    <statement>                                                       


                            Case Else


                                    <statement>                 


                    End Select


            Case <2nd possibility>


                    <statement>         


            Case <3rd possibility>


                    <statement>         


            Case Else


                    <statement>


    End Select


    ----------------------------------


    Figure 5.17


    ![](images/00204.jpg)


    Option Explicit


    Dim strColor, strBlack


    strColor = "Black"


    strBlack = "Light Black"


    Select Case strColor


            Case "Black"


                    Select Case strBlack


                            Case "Light Black"


                                    If strBlack = "Light Black" Then


                                            MsgBox "The color is Light Black and looks
    gray / grey"


                                    Else


                                            MsgBox "The color is not Light Black"


                                    End If


                            Case "Medium Black"


                                    MsgBox "The color is in between Light and Dark
    Black"


                            Case "Dark Black"


                                    MsgBox "The color is Dark Black"                            


                            Case Else


                                    MsgBox "The color is not Black" 


                    End Select


            Case "Green"


                    MsgBox "Green is a nice color"


            Case "Purple"


                    MsgBox "Purple is a pretty color"


            Case Else


                    MsgBox "The color is not Black, Green, or Purple"


    End Select


    The output displays “The color is Light Black and looks gray / grey”


    Figure 5.18


    ![](images/00158.jpg)


    Looping Statements


    Looping is the process of repeating the same block of code. VBScript has four
    looping statements that are used in different circumstances. The four looping
    statements are:


    1.  [For…Next Statement](#index_split_013.html_filepos172334)


    2.  [For Each…Next Statement](#index_split_013.html_filepos180601)


    3.  [Do…Loop Statement](#index_split_013.html_filepos186238)


    4.  While…Wend Statement


    Although there are four looping statements, the While…Wend Statement has descended
    from popularity. The While…Wend Statement works without a problem, but has been
    replaced by the Do…Loop Statement. Do…Loop Statements perform the same function
    as the While…Wend Statement. However, the Do…Loop Statement is more versatile
    because it has keywords ([While](#index_split_013.html_filepos187395) and [Until](#index_split_013.html_filepos192774))
    and can break out of the loop by using an “Exit Do” statement. This section will
    focus on three of the four looping statements.


    For…Next Statement


    The For…Next loop repeats a group of statements a finite number of times. The
    following is an example of the For…Next syntax:


    Syntax


    For Iterator = StartValue To EndValue (Step StepExpression)


            <statement>         


            (Exit For)


    Next


    ----------------------------------


    Figure 5.19


    | Arguments | Description |


    | Iterator | A variable that is used as a loop iterator |


    | StartValue | The starting value of the iterator |


    | EndValue | The ending value of the iterator |


    | StepExpression | The iterator changes after every loop according to the step
    expression value. Default value is one. |


    | Statement | A statement or statements that are executed |


    | Exit For | Forces a break out of the loop |


    Figure 5.20


    ![](images/00033.jpg)


    Option Explicit


    Dim intNumber


    For intNumber = 1 To 6 Step 2 


            MsgBox "Iterator Value: " & intNumber


    Next


    The first output displays “Iterator Value: 1,” the second output displays “Iterator
    Value: 3,” and the third output displays “Iterator Value: 5.”


    Figure 5.21


    ![](images/00163.jpg)![](images/00166.jpg)![](images/00026.jpg)


    The For block specifies the iterator loop variable “intNumber,” a start value
    of one, an end value of six, and a numeric step expression. “. Consequently, the
    Next block is increased by the step expression, which is “2” in the example. The
    step expression allows VBScript to skip numbers two, four, and six while selecting
    one, three, and five. The step expression also allows VBScript to decrease the
    iterator value by using a negative number, causing the loop to go backwards. It
    is important to make the end value less than the start value when using a negative
    number. The following is an example of a negative step expression:


    Figure 5.22


    ![](images/00068.jpg)


    Option Explicit


    Dim intNumber


    For intNumber = 6 To 1 Step -2 


            MsgBox "Iterator Value: " & intNumber


    Next


    The first output displays “Iterator Value: 6,” the second output displays “Iterator
    Value: 4,” and the third output displays “Iterator Value: 2.”


    Figure 5.23


    ![](images/00042.jpg)![](images/00177.jpg)![](images/00180.jpg)


    The step expression is optional, but defaults to one if it is omitted. The following
    is an example of the For Loop without the step expression:


    Figure 5.24


    ![](images/00120.jpg)


    Option Explicit


    Dim intNumber


    For intNumber = 0 To 2


            MsgBox "Iterator Value: " & intNumber'
