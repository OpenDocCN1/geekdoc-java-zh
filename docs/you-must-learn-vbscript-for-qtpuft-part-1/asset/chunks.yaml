    ### Math Functions


    Figure 6.40


    | Function | Description |

    | :--- | :--- |

    | `Abs` | Returns the absolute value of a specified number |

    | `Atn` | Returns the arctangent of a specified number. The `Atn` function takes
    the ratio of two sides of a right triangle and returns the corresponding angle
    in radians. The ratio is the length of the side opposite the angle divided by
    the length of the side adjacent to the angle. |

    | `Cos` | Returns the cosine of a specified number (angle). The `Cos` function
    takes an angle and returns the ratio of two sides of a right triangle. The ratio
    is the length of the side adjacent to the angle divided by the length of the hypotenuse.
    |

    | `Exp` | Returns “e” raised to a power |

    | `Hex` | Returns the hexadecimal value of a specified number |

    | `Int` | Returns the integer part of a specified number. If a number is negative,
    the `Int` function returns the first negative integer less than or equal to the
    number |

    | `Fix` | Returns the integer part of a specified number. If a number is negative,
    then the `Fix` function returns the first negative integer greater than or equal
    to the number |

    | `Log` | Returns the natural logarithm of a specified number. The natural logarithm
    is the logarithm to the base `e`. The constant `e` is approximately 2.718282.
    |

    | `Oct` | Returns the octal value of a specified number. Octal is the base-8 number
    system which uses the digits 0 to 7 |

    | `Rnd` | Returns a random number less than 1 but greater or equal to 0 |

    | `Sgn` | Returns an integer that indicates the sign of a specified number |

    | `Sin` | Returns the sine of a specified number (angle). The `Sin` function takes
    an angle and returns the ratio of two sides of a right triangle. The ratio is
    the length of the side opposite the angle divided by the length of the hypotenuse.
    |

    | `Sqr` | Returns the square root of a specified number |

    | `Tan` | Returns the tangent of a specified number (angle). The `Tan` function
    takes an angle and returns the ratio of two sides of a right triangle. The ratio
    is the length of the side adjacent to the angle divided by the length of the side.
    |


    ### Miscellaneous Functions


    Figure 6.41


    | Function | Description |

    | :--- | :--- |

    | `CreateObject` | Creates an object of a specified type |

    | `Eval` | Evaluates an expression and returns the result |

    | `InputBox` | Displays a prompt in a dialog box, waits for the user to input
    text or click a button, and returns the contents of the text box |

    | `IsEmpty` | Returns a Boolean value that indicates whether a specified variable
    has been initialized or not |

    | `IsNothing` | Used to test if a value is an initialized object |

    | `IsNull` | Returns a Boolean value that indicates whether a specified expression
    contains no valid data (`Null`) |

    | `IsNumeric` | Returns a Boolean value that indicates whether a specified expression
    can be evaluated as a number |

    | `IsObject` | Returns a Boolean value that indicates whether the specified expression
    is an automation object |

    | `LoadPicture` | Returns a picture object |

    | `MsgBox` | Returns a message |

    | `RGB` | Returns a number that represents an RGB color value |

    | `Round` | Rounds a number |

    | `ScriptEngine` | Returns the scripting language in use |

    | `ScriptEngineBuildVersion` | Returns the build version number of the scripting
    engine in use |

    | `ScriptEngineMajorVersion` | Returns the major version number of the scripting
    engine in use |

    | `ScriptEngineMinorVersion` | Returns the minor version number of the scripting
    engine in use |

    | `TypeName` | Returns the subtype of a specified variable |

    | `VarType` | Returns a value that indicates the subtype of a specified variable
    |


    ### String Functions


    Figure 6.42


    | Function | Description |

    | :--- | :--- |

    | `InStr` | Returns the position of the first occurrence of one string within
    another. The search begins at the first character of the string |

    | `InStrRev` | Returns the position of the first occurrence of one string within
    another. The search begins at the last character of the string |

    | `LCase` | Converts a specified string to lowercase |

    | `Left` | Returns a specified number of characters from the left side of a string
    |

    | `Len` | Returns the number of characters in a string |

    | `LTrim` | Removes spaces on the left side of a string |

    | `RTrim` | Removes spaces on the right side of a string |

    | `Trim` | Removes spaces on both the left and the right side of a string |

    | `Mid` | Returns a specified number of characters from a string |

    | `Replace` | Replaces a specified part of a string with another string a specified
    number of times |

    | `Right` | Returns a specified number of characters from the right side of a
    string |

    | `Space` | Returns a string that consists of a specified number of spaces |

    | `StrComp` | Compares two strings and returns a value that represents the result
    of the comparison |

    | `String` | Returns a string that contains a repeating character of a specified
    length |

    | `StrReverse` | Reverses a string |

    | `UCase` | Converts a specified string to uppercase |


