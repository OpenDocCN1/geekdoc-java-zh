  trans: "\n\n`Select…End Select` 结构在评估相同条件的不同可能结果时非常有用。因此，`Select` 语句是带有多个 `Else-If`\
    \ 的 `If…End If` 块的替代方案。在某些情况下，实现 `Select` 语句比 `Else-If` 语句效率，因为每个 `Else-If` 表达式都会被评估，而\
    \ `Select …End Select` 只评估一次。`Select` 块只能用于评估相同表达式的不同变体。以下是 `Select Case` 语句的语法：\n\
    \n### 语法\n\n```vb\nSelect Case <condition>\n    Case <1st possibility>\n     \
    \   <statement>\n    Case <2nd possibility>\n        <statement>\n    Case <3rd\
    \ possibility>\n        <statement>\n    Case <n possibility>\n        <statement>\n\
    \    Case Else\n        <statement>\nEnd Select\n```\n\n图 5.15\n![](img/00139.jpg)\n\
    \n```vb\nOption Explicit\n\nDim strColor\nstrColor = \"Purple\"\n\nSelect Case\
    \ strColor\n    Case \"Black\"\n        MsgBox \"Black is a dark color\"\n   \
    \ Case \"Green\"\n        MsgBox \"Green is a nice color\"\n    Case \"Purple\"\
    \n        MsgBox \"Purple is a pretty color\"\n    Case Else\n        MsgBox \"\
    The color is not Black, Green, or Purple\"\nEnd Select\n```\n\n输出显示“Purple is\
    \ a pretty color”\n\n图 5.16\n![](img/00154.jpg)\n\n第一行评估条件 `strColor`。接着，`Case`\
    \ 语句检查各种可能性。最后，始终考虑 `Case Else` 块，尽管它是可选的。如果没有任何可能性返回 `True`，则将执行它。添加可选的 `Case\
    \ Else` 块有两个原因：\n\n1. 为代码添加文档，解释为什么不应该执行它，或者\n2. 捕获程序员代码或输入数据的意外变化\n\n## “嵌套 Select\
    \ Case” 块分支\n\n`Select…End Select` 块可以相互嵌套。此外，程序员还可以在 `Select …End Select` 块内部嵌套\
    \ `If…End If` 块。以下是一个嵌套的 `Select Case` 块：\n\n### 语法\n\n```vb\nSelect Case <condition>\n\
    \    Case <1st possibility>\n        Select Case <condition>\n            Case\
    \ <1st possibility>\n                If <condition> Then\n                   \
    \ <statement>\n                Else\n                    <statement>\n       \
    \         End If\n            Case <2nd possibility>\n                <statement>\n\
    \            Case <3rd possibility>\n                <statement>\n           \
    \ Case Else\n                <statement>\n        End Select\n    Case <2nd possibility>\n\
    \        <statement>\n    Case <3rd possibility>\n        <statement>\n    Case\
    \ Else\n        <statement>\nEnd Select\n```\n\n图 5.17\n![](img/00204.jpg)\n\n\
    ```vb\nOption Explicit\n\nDim strColor, strBlack\nstrColor = \"Black\"\nstrBlack\
    \ = \"Light Black\"\n\nSelect Case strColor\n    Case \"Black\"\n        Select\
    \ Case strBlack\n            Case \"Light Black\"\n                If strBlack\
    \ = \"Light Black\" Then\n                    MsgBox \"The color is Light Black\
    \ and looks gray / grey\"\n                Else\n                    MsgBox \"\
    The color is not Light Black\"\n                End If\n        Case \"Medium\
    \ Black\"\n            MsgBox \"The color is between Light and Dark Black\"\n\
    \        Case \"Dark Black\"\n            MsgBox \"The color is Dark Black\"\n\
    \        Case Else\n            MsgBox \"The color is not Black\"\n    Case \"\
    Green\"\n        MsgBox \"Green is a nice color\"\n    Case \"Purple\"\n     \
    \   MsgBox \"Purple is a pretty color\"\n    Case Else\n        MsgBox \"The color\
    \ is not Black, Green, or Purple\"\nEnd Select\n```\n\n输出显示“The color is Light\
    \ Black and looks gray / grey”\n\n图 5.18\n![](img/00158.jpg)\n\n## 循环语句\n\n循环是重复同一块代码的过程。VBScript\
    \ 有四个用于不同情况的循环语句。这四个循环语句是：\n\n1. `For…Next` 语句\n2. `For Each…Next` 语句\n3. `Do…Loop`\
    \ 语句\n4. `While…Wend` 语句\n\n虽然有四个循环语句，但 `While…Wend` 语句的流行已经下降。`While…Wend` 语句工作没有问题，但已被\
    \ `Do…Loop` 语句取代。`Do…Loop` 语句执行与 `While…Wend` 语句相同的功能。然而，`Do…Loop` 语句更多功能，因为它具有关键字\
    \ `While` 和 `Until`，并且可以使用 `Exit Do` 语句跳出循环。本节将重点关注四个循环语句中的三个。\n\n### For…Next\
    \ 语句\n\n`For…Next` 循环以有限的次数重复一组语句。以下是 `For…Next` 语法的示例：\n\n### 语法\n\n```vb\nFor\
    \ Iterator = StartValue To EndValue (StepExpression)\n    <statement>\n    (Exit\
    \ For)\nNext\n```\n\n图 5.19\n\n| 参数 | 描述 |\n| :--- | :--- |\n| Iterator | 被用作循环迭代器的变量\
    \ |\n| StartValue | 迭代器的起始值 |\n| EndValue | 迭代器的结束值 |\n| StepExpression | 迭代器在每次循环后根据步进表达式的值变化。默认值为一。\
    \ |\n| Statement | 执行的一条或多个语句 |\n| Exit For | 强制跳出循环 |\n\n图 5.20\n![](img/0033.jpg)\n\
    \n```vb\nOption Explicit\n\nDim intNumber\nFor intNumber = 1 To 6 Step 2\n   \
    \ MsgBox \"Iterator Value: \" & intNumber\nNext\n```\n\n输出显示“Iterator Value: 1”，第二个输出显示“Iterator\
    \ Value: 3”，第三个输出显示“Iterator Value: 5”。\n\n图 5.21\n![](img/0163.jpg)(images/0166.jpg)(images/0026.jpg)\n\
    \n`For` 块指定了迭代器变量 `intNumber`、起始值一、结束值六以及数值步进表达式。因此，`Next` 块增加步进表达式（示例中为 2）。步进表达式允许\
    \ VBScript 跳过二、四、六，而选择一、三、五。步进表达式还允许 VBScript 通过负数减少迭代器值，导致循环反向运行。使用负数时，确保结束值小于起始值。以下是负步进表达式的示例：\n\
    \n图 5.22\n![](img/0068.jpg)\n\n```vb\nOption Explicit\n\nDim intNumber\nFor intNumber\
    \ = 6 To 1 Step -2\n    MsgBox \"Iterator Value: \" & intNumber\nNext\n```\n\n\
    输出显示“Iterator Value: 6”，第二个输出显示“Iterator Value: 4”，第三个输出显示“Iterator Value: 2”。\n\
    \n图 5.23\n![](img/0042.jpg)(images/0177.jpg)(images/0180.jpg)\n\n步进表达式是可选的，如果省略，则默认值为一。以下是不带步进表达式的\
    \ For 示例：\n\n图 5.24\n![](img/0120.jpg)\n\n```vb\nOption Explicit\n\nDim intNumber\n\
    For intNumber = 0 To 2\n    MsgBox \"Iterator Value: \" & intNumber\nNext\n```\n\
    \n"
- fmt: "\n# Next\n\nThe first output displays “Iterator Value: 0,” the second output\
    \ displays “Iterator Value: 1,” and the third output displays “Iterator Value:\
    \ 2.”\n\nFigure 5.25\n\n![](images/00087.jpg)![](images/00110.jpg)![](images/00134.jpg)\n\
    \nThe loop condition `intNumber = 0 To 2` means that the loop will execute three\
    \ times starting from zero, moving to one, and finally ending with two. The loop\
    \ will stop after looping the third time. Note from the previous examples that\
    \ the loop variable can start at any number (0, 1, and 6). The loop can also include\
    \ a negative value. The following is an example of a loop variable starting with\
    \ a negative number:\n\nFigure 5.26\n\n![](images/00184.jpg)\n\n## Option\n\n\
    ```vb\nOption Explicit\n\nDim intNumber\n\nFor intNumber = -34 To -100 Step -25\
    \ \n\n    MsgBox \"Iterator Value: \" & intNumber        \nNext\n```\n\nThe output\
    \ displays “Iterator Value: -34, Iterator Value: -59, and Iterator Value: -84.”\n\
    \nFigure 5.27\n\n![](images/00162.jpg)![](images/00185.jpg)![](images/00006.jpg)\n\
    \n## Exit For Statement\n\n`Exit For` transfers control out of the `For` Loop\
    \ and jumps to the next line after the `Next` Statement. The following is an example\
    \ of the `Exit For` Statement:\n\nFigure 5.28\n\n![](images/00094.jpg)\n\n```vb\n\
    Option Explicit\n\nDim intNumber\n\nFor intNumber = -34 To -100 Step -25 \n\n\
    \    MsgBox \"Iterator Value: \" & intNumber    \n\n    Exit For        \n\nNext\n\
    \nMsgBox \"The Exit For statement jumped out of the For Loop and did not display\
    \ -59 and -84.\"\n```\n\nThe first output displays “Iterator Value: -34” and the\
    \ second output displays “The Exit For statement jumped out of the For Loop and\
    \ did not display -59 and -84.”\n\nFigure 5.29\n\n![](images/00009.jpg)\n\n![](images/00024.jpg)\n\
    \n## For Each…Next Statement\n\nThe `For Each…Next` Statement is a special loop\
    \ that is used for traversing collections. A collection is an accumulation of\
    \ data. Collections can be any kind of data but normally they consist of objects\
    \ of the same type. The loop executes each element in the group. An iterator is\
    \ not used in the `For Each…Next` Statement. Hence, programmers cannot control\
    \ how many times the loop will run. Looping depends upon the number of objects\
    \ in the collection. The `For Each…Next` Statement is mainly used with arrays\
    \ or `FileSystemObject` (`FSO`).\n\nArrays were covered in [Chapter 4](#index_split_012.html_filepos110975)\
    \ (see FSO in Chapter 3 “Part 2 - You Must Learn VBScript for QTP – UFT”.) The\
    \ following is the `For Each…Next` Statement syntax:\n\n### Syntax\n\n```\nFor\
    \ Each object In Group\n    <statement>         \n    (Exit For)\n    <statement>\n\
    Next\n```\n\n----------------------------------\n\nFigure 5.30\n\n| Arguments\
    \ | Description |\n| :--- | :--- |\n| Object | A variable that iterates through\
    \ all of the objects in a collection or array. |\n| Group | The name of a collection\
    \ or array |\n| Statement | A statement or statements that executes every object\
    \ in a specified group |\n| Exit For | Forces a break out of the loop |\n\nFigure\
    \ 5.31\n\n![](images/00137.jpg)\n\n```vb\nOption Explicit\n\nDim arrNames, strName\n\
    arrNames = Array(\"James\", \"John\", \"Joe\")\n\nFor Each strName In arrNames\n\
    \    MsgBox \"Name is \" & strName\nNext\n```\n\nThe first output displays “Name\
    \ is James,” the second output displays “Name is John,” and the third output displays\
    \ “Name is Joe.”\n\nFigure 5.32\n\n![](images/00038.jpg)![](images/00051.jpg)![](images/00065.jpg)\n\
    \nThe `arrNames` group is a collection of `strName` objects. Therefore, the code\
    \ is stating view each `strName` object in the `arrNames` group. The variable\
    \ `strName` holds a reference to each name in the `arrNames` group. If the `arrNames`\
    \ group is empty, then the loop will not execute. `Exit For` is optional, but\
    \ can be useful for terminating the looping process. The following is an example\
    \ of the `For Each…Next` statement using the `Exit For`:\n\nFigure 5.33\n\n![](images/0182.jpg)\n\
    \n```vb\nOption Explicit\n\nDim arrNames, strName\narrNames = Array(\"James\"\
    , \"John\", \"Joe\")\n\nFor Each strName In arrNames\n    MsgBox \"Name is \"\
    \ & strName\n    If strName = \"John\" Then\n        MsgBox \"Loop exits when\
    \ \" & strName\n        Exit For\n    End If\nNext\nMsgBox \"Found the name we\
    \ were looking for\"\n```\n\nThe first output displays “Name is James,” the second\
    \ output displays “Name is John,” the third output displays “Loop exits when John,”\
    \ and the fourth output displays “Found the name we were looking for.” The `Exit\
    \ For` Statement terminates the For Loop and jumps to the line after `Next` when\
    \ locating a specific name “John.” The name “Joe” is not displayed like the previous\
    \ example.\n\nFigure 5.34\n\n![](images/0082.jpg)![](images/0107.jpg)![](images/0129.jpg)![](images/0157.jpg)\n\
    \n## Do…Loop Statement\n\nThe `Do…Loop` Statement is capable of many uses due\
    \ to its keywords `While` or `Until`. The `Do…Loop` executes based on any criteria\
    \ using `While` or `Until`. The block of statements are repeated while a condition\
    \ is True or until a condition becomes True. The keywords can be used at the beginning\
    \ or end of the loop to control the number of loops. There is a `Do` Statement\
    \ that sets the beginning of a block and a `Loop` Statement that specifies the\
    \ end of a block. Placing a condition on the `Do` statement allows the script\
    \ to decide whether or not to execute a statement. However, placing a condition\
    \ on the `Loop` Statement guarantees the statement will be executed at least one\
    \ time. The `Do Loop` has an optional `Exit Do` Statement. Like the `Exit For`\
    \ Statement, the `Exit Do` Statement transfers control out of a loop. The code\
    \ breaks out of the loop to the line after the `Do Loop` block.\n\n### Do While\n\
    \nThe `While` keyword repeats a block of statements while a condition is True.\
    \ The following is the syntax for `Do While…Loop` and `Do… Loop While`:\n\n###\
    \ Syntax\n\n```\nDo While condition\n    <statement>         \n    (Exit Do)\n\
    \    <statement>\nLoop\n```\n\n------------------\n\nFigure 5.35\n\n| Arguments\
    \ | Description |\n| :--- | :--- |\n| Do | A required argument that starts the\
    \ Do Loop |\n| While | A required argument that indicates the loop continues while\
    \ the condition is True |\n| Condition | An expression that is True or False.\
    \ Null conditions are treated as False |\n| Statement | A statement is repeated\
    \ while a condition is True |\n| Exit Do | Forces a break out of the loop |\n\
    | Loop | A required argument that ends the Do Loop definition |\n\nFigure 5.36\n\
    \n![](images/0012.jpg)\n\n```vb\nOption Explicit\n\nDim i\ni = 3\nDo While i <\
    \ 3 \n    MsgBox \"Iterator = \" & i    \n    i = i + 1\nLoop\nMsgBox \"Iterator\
    \ is 3 or more\"\n```\n\nThe output displays “Iterator is 3 or more”\n\nFigure\
    \ 5.37\n\n![](images/0179.jpg)\n\nThe loop has a condition with the `Do` Statement.\
    \ For this reason, the statement is executed if the decision returns True. In\
    \ this case, it returns False after setting `i` to three with the statement `i\
    \ = 3`. The condition `Do While i < 3` will not execute because `i` which equals\
    \ three, is not less than three. The following is an example of the `Do While…Loop`\
    \ flowchart:\n\nFigure 5.38\n\n![](images/0208.jpg)\n\n### Syntax\n\n```\nDo\n\
    \    <statement>         \n    (Exit Do)\n    <statement>\nLoop While condition\n\
    ```\n\n------------------\n\nFigure 5.39\n\n![](images/0089.jpg)\n\n```vb\nOption\
    \ Explicit\n\nDim i\ni = 3\nDo \n    MsgBox \"Iterator = \" & i    \n    i = i\
    \ + 1\nLoop While i < 3 \n\nMsgBox \"Iterator is 3 or more\"\n```\n\nThe output\
    \ displays “Iterator = 3” and “Iterator is 3 or more”\n\nFigure 5.40\n\n![](images/0013.jpg)![](images/0028.jpg)\n\
    \nThe statement is executed automatically at least one time because there is a\
    \ condition on the `Loop` Statement. The iterator equals three by setting `i`\
    \ to three (`i = 3`) that produces the first output (Iterator = 3) by way of statement\
    \ (MsgBox \"Iterator = \" & i). The iterator increases to four with statement\
    \ (`i = i + 1`). Condition `Loop While i < 3` causes the loop to stop because\
    \ four is not less than three, which displays the second output: “Iterator is\
    \ 3 or more.”\n\n"
