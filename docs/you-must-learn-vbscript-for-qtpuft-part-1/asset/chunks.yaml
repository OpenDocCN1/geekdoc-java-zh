    Dim arrAge\narrAge = Array(7, 14, 21, 28, 34)\nMsgBox arrAge(4)\n```\nThe output\
    \ returns “34.”\n\nFigure 4.25\n\n![](images/00080.jpg)\n\nFigure 4.26\n\n![](images/00008.jpg)\n\
    \n```vbba\nOption Explicit\nDim arrAge\narrAge = Array(7, 14, 21, 28, 34)\nReDim\
    \ arrAge (8)\nMsgBox arrAge (4)\n```\nThe output returns a blank value.\n\nFigure\
    \ 4.27\n\n![](images/00058.jpg)\n\nThe message box will display an empty value.\
    \ Sometimes it is good to lose data and other times it is not good. Use the `Preserve`\
    \ keyword when it is not good to lose data. `Preserve` ensures the data that was\
    \ previously stored in the array stays when resized. The following is an example\
    \ of using the `Preserve` keyword:\n\nFigure 4.28\n\n![](images/00142.jpg)\n\n\
    ```vbba\nOption Explicit\nDim arrAge\narrAge = Array(7, 14, 21, 28, 34)\nMsgBox\
    \ arrAge(4)\n```\nThe output returns “34.”\n\nFigure 4.29\n\n![](images/00080.jpg)\n\
    \nFigure 4.30\n\n![](images/00015.jpg)\n\n```vbba\nOption Explicit\nDim arrAge\n\
    arrAge = Array(7, 14, 21, 28, 34)\nReDim Preserve arrAge(8)\nMsgBox arrAge(4)\n\
    ```\nThe output still returns “34.”\n\nFigure 4.31\n\n![](images/00080.jpg)\n\n\
    ### Erase Arrays\n\nAn array can be emptied by using the `Erase` Statement. It\
    \ has different effects for Static Arrays and Dynamic Arrays. For Static Arrays,\
    \ the `Erase` Statement erases only the item’s content while the array’s lower\
    \ and upper bounds do not change. With a Dynamic Array, the `Erase` Statement\
    \ completely erases an array’s allocated memory. Elements are destroyed and data\
    \ is deleted. The variable remains but the bounds no longer exist. Programmers\
    \ must use the `ReDim` statement on the variable again, in order for the bounds\
    \ to return. The following is an example of an `Erase` Statement:\n\n```vbba\n\
    Erase arrAge\n```\n\n### Split Arrays\n\nThe `Split` Function allows the values\
    \ of indexes in a Static or Dynamic Array to be split. It uses a delimiter to\
    \ separate a string into substrings, and then assigns the substrings to an array’s\
    \ index. The programmer specifies the string and delimiter as an argument to the\
    \ `Split` Function. The `Split` Function returns a zero-based, One-Dimensional\
    \ Array that contains a specified number of substrings. The following is an example\
    \ of the `Split` Function:\n\n#### Syntax\n\n```vbba\nSplit (Expression[, Delimiter[,\
    \ Count[, Compare]]])\n```\n\nFigure 4.32\n\n| Parameter | Description |\n| :---\
    \ | :--- |\n| Expression | An expression is a string that contains substrings\
    \ and delimiters, and is required in a `Split` Function |\n| Delimiter | A delimiter\
    \ is a string character used to identify substring limits, and is optional in\
    \ a `Split` Function. Space is the default |\n| Count | The count is the number\
    \ of substrings to be returned in a `Split` Function, and is optional. -1 indicates\
    \ that all substrings are returned |\n| Compare | Compare is optional and specifies\
    \ one of the following values to use for comparison:0 = vbBinaryCompare: Perform\
    \ binary comparison 1 = vbTextCompare: Perform the textual comparison |\n\nFigure\
    \ 4.33\n\n![](images/00035.jpg)\n\n```vbba\nOption Explicit\nDim arrColors\narrColors\
    \ = Split(\"Black, White, Red\", \",\")\nMsgBox arrColors(0)\n```\nThe output\
    \ returns “Black,” due to index zero. Index one is “White” and index two is “Red.”\n\
    \nFigure 4.34\n\n![](images/00097.jpg)\n\n### Join Arrays\n\nThe `Join` Function\
    \ combines the substrings that each array index contains into one string and assigns\
    \ that string to a variable. The variable will not be an array but a String Subtype.\
    \ This function performs the reverse task of the `Split` Function. The following\
    \ is an example of the `Join` Function:\n\n#### Syntax\n\n```vbba\nJoin (List[,\
    \ Delimiter])\n```\n\nFigure 4.35\n\n| Parameter | Description |\n| :--- | :---\
    \ |\n| List | A list is a One-Dimensional Array that contains the substrings to\
    \ be joined and is required |\n| Delimiter | A delimiter is the character(s) used\
    \ to separate the substrings in the returned string in a `Join` Function, and\
    \ is optional. Space is the default |\n\nFigure 4.36\n\n![](images/00070.jpg)\n\
    \n```vbba\nOption Explicit\nDim strColors\nDim arrColors(2)\narrColors(0) = \"\
    Black\"\narrColors(1) = \"White\"\narrColors(2) = \"Red\"\nstrColors = Join(arrColors)\n\
    MsgBox strColors\n```\nThe output returns “Black White Red” after joining the\
    \ substrings in the `arrColors` indexes and assigns the result to `strColors`.\n\
    \nFigure 4.37\n\n![](images/00101.jpg)\n\n### Access Arrays\n\nSubscripts must\
    \ be used to read from or write to an array element. A One-Dimensional Array is\
    \ described as one element per value. A subscript resembles the column letter\
    \ and row number from a spreadsheet or x and y axis. The x axis is a horizontal\
    \ line and the y axis is a vertical line. Let us view examples of reading from\
    \ an element and writing to an element:\n\n#### Read From an Array\n\nFigure 4.38\n\
    \n![](images/00123.jpg)\n\n```vbba\nOption Explicit\nDim arrName(1,2)\narrName(0,0)\
    \ = \"James\"\narrName(1,0) = \"Jones\"\narrName(0,1) = \"Janice\"\narrName(1,1)\
    \ = \"Smith\"\narrName(0,2) = \"Jane\"\narrName(1,2) = \"Doe\"\nMsgBox arrName(0,0)\n\
    ```\nThe output returns “James.”\n\nFigure 4.39\n\n![](images/00105.jpg)\n\n####\
    \ Write To an Element\n\nFigure 4.40\n\n![](images/00045.jpg)\n\n```vbba\nOption\
    \ Explicit\nDim arrName()\nReDim Preserve arrName(1,0)\narrName(0,0) = \"James\"\
    \narrName(1,0) = \"Jones\"\nReDim Preserve arrName(1,1)\narrName(0,1) = \"Janice\"\
    \narrName(1,1) = \"Smith\"\nReDim Preserve arrName(1,2)\narrName(0,2) = \"Jane\"\
    \narrName(1,2) = \"Doe\"\nReDim Preserve arrName(1,3)\narrName(0,3) = \"Rex\"\n\
    arrName(1,3) = \"Allen\"\nMsgBox arrName(0,3)\n```\nThe output returns “Rex.”\
    \ The array type changed to dynamic, while `ReDim Preserve` is added to populate\
    \ the array.\n\nFigure 4.42\n\n![](images/00108.jpg)\n\n### Loop-Through Arrays\n\
    \nThe upper-bound is known when dealing with Static Arrays. It is easy to move\
    \ through a Static Array because the Programmer knows how many times to iterate\
    \ all of the indexes. Imagine someone wanting to view all of the items in Figure\
    \ 4.43. They will not have to write the following code:\n\nFigure 4.43\n\n| James\
    \ |\n| Janice |\n| Jane |\n\nFigure 4.44\n\n![](images/00025.jpg)\n\n```vbba\n\
    Option Explicit\nDim arrName(2)\narrName(0) = \"James\"\narrName(1) = \"Janice\"\
    \narrName(2) = \"Jane\"\nMsgBox arrName(0) = \"James\"\nMsgBox arrName(1) = \"\
    Janice\"\nMsgBox arrName(2) = \"Jane\"\n```\nThe first output displays “James”,\
    \ second output displays “Janice”, and third output displays “Jane”\n\nFigure\
    \ 4.45\n\n![](images/00169.jpg)!(images/00115.jpg)!(images/00118.jpg)\n\nAll of\
    \ the items are displayed, but there is a better way to display all of the items.\
    \ We can use the `For Loop`, which will be explained in Chapter 5. The `For Loop`\
    \ runs a line or group of lines of code a specific number of times. The following\
    \ is an example of the `For Loop` to view all of the items:\n\nFigure 4.46\n\n\
    ![](images/00092.jpg)\n\n```vbba\nOption Explicit\nDim i\nDim arrName(2)\narrName(0)\
    \ = \"James\"\narrName(1) = \"Janice\"\narrName(2) = \"Jane\"\nFor i = 0 to 2\n\
    \    MsgBox arrName(i)\nNext\n```\nThe first output displays “James”, second output\
    \ displays “Janice”, and third output displays “Jane”\n\nFigure 4.47\n\n![](images/00169.jpg)!(images/00115.jpg)!(images/00118.jpg)\n\
    \nThe letter `i` is a variable used to keep track of the row inside of the loop.\
    \ It is represented in the `MsgBox` for each iteration. As a result, `i` represents\
    \ the zero in the first iteration, one in the second iteration, and two in the\
    \ third iteration.\n\nIn addition, `LBound` and `UBound` functions are more efficient\
    \ for traversing through an array by eliminating hard-coding values. The previous\
    \ example will work as follows:\n\nFigure 4.48\n\n![](images/00021.jpg)\n\n```vbba\n\
    Option Explicit\nDim i\nDim arrName(2)\narrName(0) = \"James\"\narrName(1) = \"\
    Janice\"\narrName(2) = \"Jane\"\nFor i = LBound(arrName) to UBound(arrName)\n\
    \    MsgBox arrName(i)\nNext\n```\nThe first output displays “James”, second output\
    \ displays “Janice”, and third output displays “Jane”\n\nFigure 4.49\n"
