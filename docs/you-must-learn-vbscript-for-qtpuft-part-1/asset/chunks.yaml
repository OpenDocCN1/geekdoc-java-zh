  trans: "\n\n'(错误的注释) 字符串 \"strName\" 结合了名和姓\n\n`strName = strFirstName & \" \" &\
    \ strLastName`\n\n'(良好的注释) \"strName\" 的目的是将名称放在客户表而非员工表中\n\n`strName = strFirstName\
    \ & \" \" & strLastName`\n\n# 代码模块化\n\n随着脚本中添加的代码越来越多，一次性读完一整块代码会变得越来越困难。在某些情况下，决策将通过分支或循环来重定向代码。因此，代码变得更加复杂，容易引入错误。糟糕的糟糕布局（也称为意大利面条代码）使得查找和修复问题变得更加困难。\n\
    \n模块化是程序员用来管理代码复杂性的一种技术。它是将代码组织成模块的过程，这些模块可以被视为构建块。使用过程来实现模块化。过程有两种类型的程序：`Sub\
    \ Procedure`（子过程）和 `Function Procedure`（函数过程）。\n\n## Sub Procedure\n\n`Sub Procedure`是一系列由\
    \ `Sub` 和 `End Sub` 语句包围的语句（参见第 6 章过程-函数中的 Sub Procedure）。它可以执行某些操作并接收参数（也称为形式参数），但不返回值。操作执行任务，例如数字相加。参数是过程使用的特殊变量，用于提供数据作为输入。以下是\
    \ `Sub Procedure` 的语法：\n\n### 语法\n\n```\nSub NameOfSubProcedure()\n    code  \n\
    End Sub\n\nSub NameOfSubProcedure ([Argument1], [ArgumentN])\n    code\nEnd Sub\n\
    ```\n\n## Function Procedure\n\n`Function Procedure`是一系列由 `Function` 和 `End Function`\
    \ 语句包围的语句（参见第 6 章过程-函数中的 Function Procedure）。它可以执行某些操作、接收参数并返回一个值。该值通过向其名称赋值值来返回。以下是\
    \ `Function Procedure` 的语法：\n\n### 语法\n\n```\nFunction NameOfFunctionProcedure()\n\
    \    code     \n    NameOfFunctionProcedure = some value\nEnd Function\n\nFunction\
    \ NameOfFunctionProcedure ([Argument1], [ArgumentN])\n    code         \n    NameOfFunctionProcedure\
    \ = some value\nEnd Function\n```\n\n第 1 章概述了变量、流程控制和编码标准的基础原理。第 2 章 将探索变量和匈牙命名法，以及变量数据类型。\n\
    \n# 第 2 章变量和数据类型\n\n变量在 VBScript 中极其重要。变量为脚本存储数据。脚本中的每个输入、输出和处理都使用变量。变量中的数据可以留待以后使用，而某些变量在使用后就会被丢弃。将值放入变量中被称为初始化。值默认或从应用程序放入变量中。数据库也用于存储变量中的值。数据库可以是文本文件、Excel\
    \ 文件等。\n\n本章将解释以下内容：\n\n*   变量规则\n*   变量类型\n*   变量生命周期/作用域\n*   声明变量\n*   Option\
    \ Explicit\n*   数据类型\n*   匈牙命名法\n\n## 变量规则\n\n变量可以存储值（`x=3`）或表达式（`x = y + z`）。在给变量赋值时，确保变量名在左侧，值在右侧。变量可以有一个短名称（如“z”），也可以有一个描述性名称（如“strTestPage”）。以下是变量的一些规则：\n\
    \n1. 不能超过 255 个字符\n2. 下划线 “_” 是唯一有效的非字母数字字符\n3. 必须以字母（大写或小写）开头\n\n## 变量类型\n\n\
    有类型的变量。以下是每种变量类型的列表：\n\n1.  标量\n2.  数组\n3.  常量\n\n### 标量\n\n标量变量只包含一个在执行前或执行期间可以更改的值。以下示例包含一个名为“x”的变量，值为“34”。\n\
    \n```\nDim x\nx = 34\n```\n\n### 数组\n\n数组变量包含多个值（参见第 6 章中的 数组）。\n\n```\nDim y(3)\n\
    y(0) = 4\ny(1) = 5\ny(2) = 6\ny(3) = 7\n```\n\n### 常量\n\n常量变量包含在执行前或执行期间不能更改的值。通常，常量名称使用大写字母。\n\
    \n```\nConst NUMBER = 3\n```\n\n### 字面量\n\n字面量是静态（固定的）数据，包含文本、数字或布尔值。`True` 或\
    \ `False` 等值就是字面量。以下是字面量的示例：\n\n```\nOption Explicit\nDim datBirthday\ndatBirthday\
    \ = #05/09/12#\nMsgBox \"Test For success \" & datBirthday\n```\n\n## 变量生命周期/作用域\n\
    \n变量的生命周期取决于它的存在性。它可以是局部的或全局的。局部变量在过程内部声明，而全局变量在外部声明。如果变量是局部的，它在过程结束后会被删除。以下是两个拥有同名局部变量的过程示例：\n\
    \n```\nOption Explicit\nCall DisplayOldColor\nCall ReturnNewColor\n\nSub DisplayOldColor()\n\
    \    Dim strCarColor\n    strCarColor = \"blue\"\n    MsgBox \"My old car was\
    \ \" & strCarColor\nEnd Sub\n\nFunction ReturnNewColor()\n    Dim strCarColor\n\
    \    strCarColor = \"black\"\n    ReturnNewColor = strCarColor\nEnd Function\n\
    ```\n\n第一个输出使用局部变量 `strCarColor` 显示“My old car was blue”，而第二个输出使用同名的局部变量显示“My\
    \ new car is black”。\n\n全局变量是在过程外声明的变量。所有过程都可以访问全局变量。因此，它们不能重名。这些变量的生命周期从声明开始，到程序关闭结束。变量的生命周期和作用域是相互关联的。以下是变量作用域的三类型/级别：\n\
    \n*   脚本作用域\n*   过程作用域\n*   类作用域\n\n### 脚本作用域\n\n脚本作用域（与全局变量相关）是指变量对脚本文件中的所有脚本都可用。这些变量没有在过程或类中声明。以下是具有脚本作用域变量的示例：\n\
    \n```\nOption Explicit\nDim strFirstName\nstrFirstName = \"Rex\"\nCall DisplayFirstName(strFirstName)\n\
    Call Greet(strFirstName)\n```\n\n"
- fmt: "\n```vb\nSub DisplayFirstName(strFirst)\n    MsgBox \"My first name is \"\
    \ & strFirst\nEnd Sub\n\nSub Greet(strFirst)\n    MsgBox \"Hello \" & strFirst\n\
    End Sub\n```\n\nThe first output displays “My first name is Rex” using the global\
    \ variable `strFirstName`, while second output displays “Hello Rex” using the\
    \ global variable `strFirstName`. Both procedures (`DisplayFirstName` and `Greet`)\
    \ have access to the global variable because the variable has Script Level Scope\
    \ (available to the entire file).\n\nFigure 2.5\n\n![](images/00195.jpg) ![](images/00201.jpg)\n\
    \n## Procedure Level Scope\n\nProcedure Level Scope (interrelated with local variable)\
    \ is a variable declared in a procedure. Code outside of the procedure does not\
    \ have access to the variable. The following is an example of a variable with\
    \ Procedure Level Scope:\n\nFigure 2.6\n\n![](images/00037.jpg)\n\n```vb\nOption\
    \ Explicit\n\nCall WroteQTP\n\nSub WroteQTP\n    Dim strCompany\n    strCompany\
    \ = \"Mercury Interactive\"\n    MsgBox \"Originally,\" & strCompany & \"wrote\
    \ QuickTest Professional\"\nEnd Sub\n```\n\nThe output displays “Originally, Mercury\
    \ Interactive wrote QuickTest Professional” by using variable `strCompany` which\
    \ has procedure level scope.\n\nFigure 2.7\n\n![](images/00206.jpg)\n\n## Class\
    \ Level Scope\n\nClass is a special construct containing logic grouping or properties\
    \ and methods. Variables declared using the `private` statement in a class and\
    \ outside of a procedure within the class has Class Level Scope. Code within the\
    \ class can access the variable, but code outside of the class cannot access the\
    \ variable. Variables with Class Level Scope are similar to variables with Procedure\
    \ Level Scope. The following is an example of a variable `mstrAnimal` with Class\
    \ Level Scope:\n\nFigure 2.8\n\n![](images/00072.jpg)\n\n```vb\nOption Explicit\n\
    \nClass Animals\n    Private mstrAnimal\n    Public Property Let Zebra(strAnimal)\n\
    \        mstrAnimal = strAnimal\n    End Property\n    Public Sub Zebra(strColor)\n\
    \        MsgBox mstrAnimal & \" good with a \" & DisplayCarColor(strColor) & \"\
    color.\"\n    End Sub\n    Private Function DisplayCarColor(strColor)\n      \
    \  Select Case strColor\n            Case \"Black and White\"\n              \
    \  DisplayCarColor = \"Black and White\"\n            Case \"Brown and White\"\
    \n                DisplayCarColor = \"Brown and White\"\n            Case \"Brown\
    \ and Black\"\n                DisplayCarColor = \"Brown and Black\"\n       \
    \ End Select\n    End Function\nEnd Class\n```\n\n## Declare Variables\n\nWe can\
    \ declare variables with `Dim`, `Public`, or `Private` Statements. All variables\
    \ are available regardless of the statement type. The three statements are listed\
    \ below:\n\n1. `Dim` Statement\n2. `Public` Statement\n3. `Private` Statement\n\
    \n### Dim Statement\n\nThe `Dim` statement permits one or more new variables to\
    \ be declared while allocating memory. This statement is used to declare variables\
    \ at the Script Level or Procedure Level. `Public` and `Private` Statements are\
    \ not allowed inside of a Procedure Level. `Dim` Statements are similar to a `Public`\
    \ Statement, if used within the Class Level:\n\n```vb\nDim strTestPage\n```\n\n\
    ### Public Statement\n\nThe `Public` statement permits one or more new variables\
    \ and/or arrays to be declared while allocating memory. This statement is used\
    \ at the Script Level or Class Level, but not in a procedure. It is recommended\
    \ to use a `Public` Statement within a Class. The following is the syntax for\
    \ a Public Statement:\n\n```vb\nPublic strTestPage\n```\n\n### Private Statement\n\
    \nThe `Private` statement permits one or more new variables and/or arrays to be\
    \ declared while allocating memory. This statement is used at the Script Level\
    \ or Class Level, but not in a procedure. If a `Private` Statement is declared\
    \ outside of a procedure, then the results have the same effect as a `Dim` Statement\
    \ or a `Public` Statement. Variables outside of a procedure are available to the\
    \ entire script file (known as a global variable). This forces the `Private` Statement\
    \ to operate like a `Dim` or `Public` Statement. The following is the syntax for\
    \ a Private Statement:\n\n```vb\nPrivate strTestPage\n```\n\nMore than one variable\
    \ declaration is allowed on the same line. However, there are limitations on the\
    \ number of variables within a script and procedure. 12\n\n```vb\nDim strTestPage\n\
    ```\n\n```vb\nDim strTestPage, strFirstName\n```\n\n```vb\nDim strTestPage, strUserName\n\
    ```\n\n```vb\nOption Explicit\n\nDim strMessage\nstrMessage = \"Option Explicit\
    \ is very important\"\nMsgBox strMessage\n```\n\nThe output displays “Option Explicit\
    \ is very important”\n\nFigure 2.9\n\n![](images/00127.jpg)\n\n## Data Types\n\
    \nAll variables have a variant data type. `Variant` is a special data type that\
    \ contains different kinds of information according to how it is used. The information\
    \ will be in numeric or string form. There are distinctions with numeric information\
    \ ranging in size from Boolean to Floating Point Numbers. Several categories of\
    \ string and numeric information are called Sub-Data Types. The following are\
    \ Sub-Data Types:\n\nFigure 2.11\n\n| Sub-Data Type | Description |\n| :--- |\
    \ :--- |\n| Empty | Value is “0” or an empty value. The variable is uninitialized\
    \ when it is created and no value is assigned to it when the variable is set to\
    \ empty |\n| Null | Variable with invalid data |\n| Boolean | Contains either\
    \ True or False |\n| Byte | Contains numeric values ranging from 0 to 255 |\n\
    | Integer | Contains numeric values ranging from -32,768 to 32,767 |\n| Currency\
    \ | Contains a currency value ranging from -922,337,203,685,477.5808 to 922,337,203,685,477.5807\
    \ |\n| Long | Contains numeric values ranging from -2,147,483,648 to 2,147,483,647\
    \ |\n| Single | Contains a single-precision, floating-point number |\n| Double\
    \ | Contains a double-precision, floating-point number |\n| Date (Time) | Contains\
    \ a date and time |\n| String | Contains alphanumeric character(s) stored in double\
    \ quotes |\n| Object | Contains an object |\n| Error | Contains an error number\
    \ |\n\n## Hungarian Naming Convention\n"
