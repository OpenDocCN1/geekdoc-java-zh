    # 第 1 章 VBScript 简介


    ## 概述


    VBScript 的全称是 Microsoft Visual Basic Scripting Edition 语言。它是 Visual Basic (VB)
    和 Visual Basic for Applications (VBA) 系列编程语言的简化版本。VBScript 的语法基于 Visual Basic
    的语法。语法是一组规则，决定了语言如何被浏览器或服务器编写和解释。VBScript 的大部分功能都取自 Visual Basic。控制流、操作符和过程等功能在
    Visual Basic 系列中是可以接受的。


    Visual Basic 是一种完整的编程语言，而 VBScript 是支持脚本的精简版本。处理是完整编程语言与脚本语言之间的主要区别。脚本语言在每次运行时都必须重新处理，而完整的编程语言运行速度更快，因为它只被处理一次。


    VBScript 是为一个可以解释和自动化任务的运行时环境编写的。它使用组件对象模型 (COM) 来访问其运行环境中的元素。软件应用程序、浏览器中的网页、操作系统
    (OS) 的外壳以及嵌入式系统都是可以自动化的环境示例。VBScript 可用于以下实例：


    *   Windows 管理任务

    *   HTML 页面（作为客户端脚本语言）

    *   服务端脚本语言，在带有 Internet Information Services (IIS)  服务器的原生应用程序提供程序 (ASP) 页面中

    *   嵌入式应用程序

    *   Quick Test Professional (QTP)/Unified Functional Testing (UFT) 用于自动化测试的脚本语言


    QTP/UFT 使用 VBScript 作为开发测试脚本的脚本语言。理解 VBScript 将有助于在 QTP/UFT 中创建和维护测试脚本。


    本章提供了 QTP/UFT 中 VBScript 构建模块的通用原则，而非详细细节，并将解释以下内容：


    *   变量

    *   流程控制

    *   编码标准


    ## 变量


    变量是内存中的存储位置（参见第 2 章中的变量和数据类型）。脚本使用变量存储数据以备后后使用。


    ## 流程控制


    '
- fmt: "\nCode executes in a certain hierarchal order when running a script. The order\
    \ of code execution is called a flow (see [Flow Control in Chapter 5](#index_split_013.html_filepos149668).)\
    \ Simple scripts execute from the top to bottom, also known as top-down programs.\
    \ The script engine begins execution with the first statement, then moves to the\
    \ next statement, and continues down the script until reaching the last statement.\
    \ Execution occurs in this manner when it does not include branching or looping.\n\
    \n## Branching\n\nBranching is a technique that causes specific statements to\
    \ be executed depending on certain conditions (see [Branching Constructs](#index_split_013.html_filepos150405)\
    \ in Chapter 5 Flow Control.) VBScript has two branching constructs: The [“If”\
    \ branch](#index_split_013.html_filepos151162) and the [“Select Case” branch](#index_split_013.html_filepos162423).\n\
    \n### If Branch\n\n*   [`If Statement](#index_split_013.html_filepos151162`):\
    \ Executes a set of code when a condition is true\n\nFigure 1.1\n![](images/00020.jpg)\n\
    \n```vb\nOption Explicit\nDim strTest4Success\nstrTest4Success = \"Test 4 Success\
    \ has Free Live Training and Free Valuable Videos\"\nIf strTest4Success <> Empty\
    \ Then\n    MsgBox strTest4Success\nEnd If\n```\nThe output displays “Test 4 Success\
    \ has Free Live Training and Free Valuable Videos.”\n\nFigure 1.2\n![](images/00007.jpg)\n\
    \n*   [`If-Then-Else Statement](#index_split_013.html_filepos154088`): Selects\
    \ one of two sets of lines to execute\n\nFigure 1.3\n![](images/00073.jpg)\n\n\
    ```vb\nOption Explicit\nDim strTest4Success\nstrTest4Success = \"Test 4 Success\
    \ has Free Live Training and Free Valuable Videos\"\nIf strTest4Success = Empty\
    \ Then\n        MsgBox strTest4Success\nElse\n        MsgBox \"Test 4 Success\
    \ is empty\" \nEnd If\n```\nThe output displays “Test 4 Success is empty.”\n\n\
    Figure 1.4\n![](images/00022.jpg)\n\n*   [`If-Then-ElseIf Statement](#index_split_013.html_filepos155565`):\
    \ Selects one of many sets of lines to execute\n\nFigure 1.5\n![](images/00194.jpg)\n\
    \n```vb\nOption Explicit\nDim strMsg\nstrMsg = \"VBScript and QTP / UFT\"\nIf\
    \ strMsg = \"VBScript\" Then\n    MsgBox \"You can master VBScript\"\nElseIf strMsg\
    \ = \"QTP / UFT\" Then\n    MsgBox \"You can master QTP / UFT\"\nElseIf strMsg\
    \ = \"VBScript and QTP / UFT\" Then\n    MsgBox \"You can master VBScript and\
    \ QTP / UFT\"\nElse\n    MsgBox \"Every master was once a disaster\"\nEnd If\n\
    ```\nThe output displays “You can master VBScript and QTP / UFT.”\n\nFigure 1.6\n\
    ![](images/00036.jpg)\n\n### Select Case Branch\n\n*   [`Select Case Statement](#index_split_013.html_filepos162423`):\
    \ Makes a decision based on the actual value, not True or False. The Select Case\
    \ Statement selects one of many sets of lines to execute for the same expression.\n\
    \nFigure 1.7\n![](images/00011.jpg)\n\n```vb\nOption Explicit\nDim strMsg\nstrMsg\
    \ = \"VBScript and QTP / UFT\"\nSelect Case strMsg\n    Case \"VBScript\"\n  \
    \      MsgBox \"You can master VBScript\"\n    Case \"QTP / UFT\"\n        MsgBox\
    \ \"You can master QTP / UFT\"\n    Case \"VBScript and QTP / UFT\"\n        MsgBox\
    \ \"You can master VBScript and QTP / UFT\"\n    Case Else\n        MsgBox \"\
    Every master was once a disaster\"\nEnd Select\n```\nThe output displays “You\
    \ can master VBScript and QTP / UFT.”\n\nFigure 1.8\n![](images/00049.jpg)\n\n\
    ## Looping\n\nLooping executes lines of code over and again (see [Looping](#index_split_013.html_filepos1044)\
    \ in Chapter 5.) Looping is useful when repeating a block of code until a condition\
    \ is True or when repeating a block of code a definite number of times. Most programmers\
    \ use the following constructs: [`For Next`](index_split_013.html_filepos17234)\
    \ and [`Do Loop`](index_split_013.html_filepos18638).\n\n*   [`For Next Statement](#index_split_013.html_filepos17234`):\
    \ Runs the code a specified number of times.\n\nFigure 1.9\n![](images/00039.jpg)\n\
    \n```vb\nOption Explicit\nDim i\nFor i = 1 to 3\n    MsgBox \"Number \" & i\n\
    Next\n```\nThe output displays “Number 1,” the second output displays “Number\
    \ 2,” and the third output displays “Number 3.”\n\nFigure 1.10\n![](images/00062.jpg)!(images/00141.jpg)!(images/00145.jpg)\n\
    \n*   [`For Each-Next Statement`](index_split_013.html_filepos18061`): Runs the\
    \ code for each item in a collection (which stores a group of data) or an array\
    \ (which is a matrix of data).\n\nFigure 1.11\n![](images/00016.jpg)\n\n```vb\n\
    Option Explicit\nDim i\nDim intAge\nintAge = Array(34, 36, 38)\nFor Each i In\
    \ intAge\n    MsgBox \"Age: \" & i\nNext\n```\nThe output displays “Age: 34,”\
    \ the second output displays “Age: 36,” and the third output displays “Age: 38.”\n\
    \nFigure 1.12\n![](images/00150.jpg)!(images/00155.jpg)!(images/00176.jpg)\n\n\
    *   [`Do Loop Statement`](index_split_013.html_filepos18638`): Executes the code\
    \ in a loop while or until a condition is true.\n\nFigure 1.13\n![](images/00202.jpg)\n\
    \n```vb\nOption Explicit\nDim i\ni = 1\nDo While i < 3\n    MsgBox \"Number \"\
    \ & i & \" is less than 3\"\n    i = i + 1\nLoop\n```\nThe output displays “Number\
    \ 1 is less than 3” and the second output displays “Number 2 is less than 3.”\n\
    \nFigure 1.14\n![](images/00205.jpg)!(images/00010.jpg)\n\nFigure 1.15\n![](images/00084.jpg)\n\
    \n```vb\nOption Explicit\nDim i = 1\nDo\n    MsgBox i & \" is less than or equal\
    \ to 3\"\n    i = i + 1\nLoop Until i > 3\n```\nThe first output displays “1 is\
    \ less than or equal to 3,” the second output displays “2 is less than or equal\
    \ to 3,” and the third output displays “3 is less than or equal to 3.”\n\nFigure\
    \ 1.16\n![](images/00170.jpg)!(images/00173.jpg)!(images/00053.jpg)\n\n## Coding\
    \ Standards\n\nIt is important to practice good programming habits, because good\
    \ programming habits ensures code will be easier to read, understand, and modify,\
    \ as well as contain fewer bugs. This will pay off in the long run. Properly laid\
    \ out code improves the readability for you and your fellow Programmers. Indentations\
    \ of the lines show a subordination/hierarchical relationship to other lines of\
    \ code. Accordingly, related code should be kept together on consecutive lines\
    \ while separating unrelated code with a blank line.\n\n### Hungarian Naming Convention\n\
    \nThe Hungarian Naming Convention involves giving variable names a prefix (see\
    \ [Hungarian Naming Convention](#index_split_010.html_filepos62456) in Chapter\
    \ 2 Variables and Data Types.) As a result, the prefix indicates what the scope\
    \ and data type of the variable are intended to be. It makes programs easier to\
    \ write and read. For example, `strName` is a Hungarian Naming Convention. The\
    \ prefix `str` defines the variable as a string.\n\n### Explicit Over Implicit\n\
    \nProgrammers must be wary of using too many generic variable names (i.e., `i`,\
    \ `x`, `y`, and `z`) and function names (i.e., `Function1`, `Function2`, and `Function3`).\
    \ Instead, make the variable and function names explicit so the purpose is clear.\
    \ Good function names are longer than good variable names. It is best to have\
    \ verb-noun conventions when naming a function. For example, `GetCarModel` is\
    \ a good function name. This function informs a fellow programmer reading the\
    \ code that it will get the model of a car.\n\n### Comments\n\nCode should be\
    \ as self-documenting as possible. Nevertheless, it is difficult to ensure 100%\
    \ self-documented code. The programmer uses comments to make the code clearer.\
    \ However, there is a difference between bad comments and good comments. Bad comments\
    \ clutter the overall script with excessive information that explains how the\
    \ code works. The comments are excessive because the code already tells how the\
    \ Sub Procedure works. A good comment answers two questions:\n\n1. What is the\
    \ purpose of the code?\n2. Why did the programmer write the code?\n\nThe following\
    \ is an example of a bad comment and a good comment:\n\nFigure 1.17\n![](images/00146.jpg)\n"
  raw: "Code executes in a certain hierarchal order when running a script. The order\
    \ of code execution is called a flow (see [Flow Control in Chapter 5](#index_split_013.html_filepos149668).)\
    \ Simple scripts execute from the top to bottom, also known as top-down programs.\
    \ The script engine begins execution with the first statement, then moves to the\
    \ next statement, and continues down the script until reaching the last statement.\
    \ Execution occurs in this manner when it does not include branching or looping.\n\
    \nBranching\n\nBranching is a technique that causes specific statements to be\
    \ executed depending on certain conditions (see [Branching Constructs](#index_split_013.html_filepos150405)\
    \ in Chapter 5 Flow Control.) VBScript has two branching constructs: The [“If”\
    \ branch](#index_split_013.html_filepos151162) and the [“Select Case” branch](#index_split_013.html_filepos162423).\n\
    \nIf Branch\n\n*   [If Statement](#index_split_013.html_filepos151162): Executes\
    \ a set of code when a condition is true\n\nFigure 1.1\n\n![](images/00020.jpg)\n\
    \nOption Explicit\n\nDim strTest4Success\n\nstrTest4Success = \"Test 4 Success\
    \ has Free Live Training and Free Valuable Videos\"\n\nIf strTest4Success <> Empty Then\n\
    \n    MsgBox strTest4Success\n\nEnd If\n\nThe output displays “Test 4 Success\
    \ has Free Live Training and Free Valuable Videos.”\n\nFigure 1.2\n\n![](images/00007.jpg)\n\
    \n*   [If-Then-Else Statement](#index_split_013.html_filepos154088): Selects one\
    \ of two sets of lines to execute\n\nFigure 1.3\n\n![](images/00073.jpg)\n\nOption\
    \ Explicit\n\nDim strTest4Success\n\nstrTest4Success = \"Test 4 Success has Free\
    \ Live Training and Free Valuable Videos\"\n\nIf strTest4Success = Empty Then\n\
    \n        MsgBox strTest4Success\n\nElse\n\n        MsgBox \"Test 4 Success is\
    \ empty\" \n\nEnd If\n\nThe output displays “Test 4 Success is empty.”\n\nFigure\
    \ 1.4\n\n![](images/00022.jpg)\n\n*   [If-Then-ElseIf Statement](#index_split_013.html_filepos155565):\
    \ Selects one of many sets of lines to execute    \n\n    Figure 1.5\n\n    ![](images/00194.jpg)\n\
    \n    Option Explicit\n\n    Dim strMsg\n\n> > strMsg = \"VBScript and QTP / UFT\"\
    \n\n> > \n\n> > If strMsg = \"VBScript\" Then\n\n> >     MsgBox \"You can master\
    \ VBScript\"\n\n> > ElseIf strMsg = \"QTP / UFT\" Then\n\n> >     MsgBox \"You\
    \ can master QTP / UFT\"\n\n> > ElseIf strMsg = \"VBScript and QTP / UFT\" Then\n\
    \n> >     MsgBox \"You can master VBScript and QTP / UFT\"\n\n> > Else\n\n> >\
    \     MsgBox \"Every master was once a disaster\"\n\n> > End If\n\nThe output\
    \ displays “You can master VBScript and QTP / UFT.”\n\nFigure 1.6\n\n![](images/00036.jpg)\n\
    \nSelect Case Branch\n\n*   [Select Case Statement](#index_split_013.html_filepos162423):\
    \ Makes a decision based on the actual value, not True or False. The Select Case\
    \ Statement selects one of many sets of lines to execute for the same expression.  \
    \    \n\n    Figure 1.7\n\n    ![](images/00011.jpg)\n\n    Option Explicit\n\n\
    \    Dim strMsg     strMsg = \"VBScript and QTP / UFT\"    \n\n    Select Case strMsg\n\
    \n        Case \"VBScript\" \n\n            MsgBox \"You can master VBScript\"\
    \n\n        Case \"QTP / UFT\"\n\n            MsgBox \"You can master QTP / UFT\"\
    \n\n        Case \"VBScript and QTP / UFT\"\n\n            MsgBox \"You can master\
    \ VBScript and QTP / UFT\"\n\n        Case Else\n\n            MsgBox \"Every\
    \ master was once a disaster\" \n\n    End Select\n\nThe output displays “You\
    \ can master VBScript and QTP / UFT.”\n\nFigure 1.8\n\n![](images/00049.jpg)\n\
    \nLooping\n\nLooping executes lines of code over and over again (see [Looping\
    \ Statements](#index_split_013.html_filepos171044) in Chapter 5 Flow Control.)\
    \ Looping is useful when repeating a block of code until a condition is True or\
    \ False or when repeating a block of code a definite number of times. Most programmers\
    \ use the following looping constructs:  [“For Next”](#index_split_013.html_filepos172334)\
    \ and “[Do Loop](#index_split_013.html_filepos186238).”\n\nFor Next\n\n*   [For\
    \ Next Statement](#index_split_013.html_filepos172334): Runs the code a specified\
    \ number of times   \n\n    Figure 1.9\n\n    ![](images/00039.jpg)\n\n    Option Explicit\n\
    \n    Dim i     For i = 1 to 3\n\n        MsgBox \"Number \" & i \n\n    Next\n\
    \nThe first output displays “Number 1,” the second output displays “Number 2,”\
    \ and the third output displays “Number 3.”\n\nFigure 1.10\n\n![](images/00062.jpg)![](images/00141.jpg)![](images/00145.jpg)\n\
    \n*   [For Each-Next Statement](#index_split_013.html_filepos180601): Runs the\
    \ code for each item in a collection (which stores a group of data) or an array\
    \ (which is a matrix of data)      \n\n    Figure 1.11\n\n    ![](images/00016.jpg)\n\
    \n> > Option Explicit\n\n> > Dim i\n\n> > Dim intAge\n\n> > intAge = Array(34, 36, 38)\n\
    \n> > For Each i In intAge\n\n> >     MsgBox \"Age: \" & i\n\n> > Next\n\nThe\
    \ first output displays “Age: 34,” the second output displays “Age: 36,” and the\
    \ third output displays “Age: 38.”\n\nFigure 1.12\n\n![](images/00150.jpg)![](images/00155.jpg)![](images/00176.jpg)\n\
    \nDo Loop  \n\n*   [Do Loop Statement](#index_split_013.html_filepos186238): Executes\
    \ the code in a loop while or until a condition is true    \n\n    Figure 1.13\n\
    \n    ![](images/00202.jpg)\n\n    Option Explicit\n\n    Dim i    \n\n    i = 1\
    \    \n\n    Do While i < 3\n\n        MsgBox \"Number \" & i & \" is less than\
    \ 3\"         \n\n        i = i + 1\n\n    Loop\n\nThe first output displays “Number\
    \ 1 is less than 3” and the second output displays “Number 2 is less than 3.”\n\
    \nFigure 1.14\n\n![](images/00205.jpg)![](images/00010.jpg)\n\nFigure 1.15\n\n\
    ![](images/00084.jpg)\n\n> > Option Explicit\n\n> > Dim i = 1\n\n> > Do \n\n>\
    \ >     MsgBox i & \" is less than or equal to 3\"\n\n> >     i = i + 1\n\n> >\
    \ Loop Until i > 3\n\n> > The first output displays “1 is less than or equal to\
    \ 3,” the second output displays “2 is less than or equal to 3,” and the third\
    \ output displays “3 is less than or equal to 3.”\n\nFigure 1.16\n\n![](images/00170.jpg)![](images/00173.jpg)![](images/00053.jpg)\n\
    \nCoding Standards\n\nIt is important to practice good programming habits, because\
    \ good programming habits ensures code will be easier to read, understand, and\
    \ modify, as well as contain fewer bugs. This will pay off in the long run. Properly\
    \ laid out code improves the readability for you and your fellow Programmers.\
    \ Indentations of the lines show a subordination/hierarchical relationship to\
    \ other lines of code. Accordingly, related code should be kept together on consecutive\
    \ lines while separating unrelated code with a blank line.\n\nHungarian Naming\
    \ Convention\n\nThe Hungarian Naming Convention involves giving variable names\
    \ a prefix (see [Hungarian Naming Convention](#index_split_010.html_filepos62456)\
    \ in Chapter 2 Variables and Data Types.) As a result, the prefix indicates what\
    \ the scope and data type of the variable are intended to be. It makes programs\
    \ easier to write and read. For example, “strName” is a Hungarian Naming Convention. \
    \ The prefix “str” defines the variable as a string.\n\nExplicit Over Implicit\n\
    \nProgrammers must be wary of using too many generic variable names (i.e., “i,”\
    \ “x,” “y,” and “z”) and function names (i.e., “Function1,” “Function2,” and “Function3”).\
    \ Instead, make the variable and function names explicit so the purpose is clear.\
    \ Good function names are longer than good variable names. It is best to have\
    \ verb-noun conventions when naming a function. For example, “GetCarModel” is\
    \ a good function name. This function informs a fellow programmer reading the\
    \ code that it will get the model of a car.\n\nComments\n\nCode should be as self-documenting\
    \ as possible. Nevertheless, it is difficult to ensure 100% self-documented code.\
    \ The programmer uses comments to make the code clearer. However, there is a difference\
    \ between bad comments and good comments. Bad comments clutter the overall script\
    \ with excessive information that explains how the code works. The comments are\
    \ excessive because the code already tells how the Sub Procedure works. A good\
    \ comment answers two questions:\n\n1.  What is the purpose of the code?\n\n2.\
    \  Why did the programmer write the code?\n\nThe following is an example of a\
    \ bad comment and a good comment:\n\nFigure 1.17\n\n![](images/00146.jpg)"
