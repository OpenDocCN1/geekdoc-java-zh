    Declare Array and Bounds


    An array can be declared several ways, depending on how it is created. It can
    be created with values, a Split Function, statically, or dynamically. Coincidentally,
    the two types of arrays are also Static and Dynamic.


    Static Array Type


    Static Arrays have a constant index. It is not possible to increase or decrease
    the array size. The array remains a fixed size throughout the lifetime of its
    existence. Therefore, programmers must know how many items will be in the array.
    Arrays can be as simple as a single column or complicated displaying 60 dimensions.
    Nevertheless, most arrays have one or two dimensions.


