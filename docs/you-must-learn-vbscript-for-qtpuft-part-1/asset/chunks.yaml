    the upper bounds and dimensions can be changed dynamically at runtime. The following
    is an example of a Dynamic Array:


    Dim arrName()


    The Dynamic Array uses a parentheses without placing upper bounds or dimensions.
    This informs VBScript that the programmer does not know how many elements to store
    in the array at design time. For example, it is not known how many rows are located
    in a database table. Therefore, it is not good to hardcode a specific number due
    to potential database changes.


    Resize Arrays


    Dynamic Arrays allow programmers to resize the array at runtime. The “ReDim” statement
    initially sets the size or changes the size of a Dynamic Array. New indexes must
    be filled to increase a Dynamic Array index size. In addition, the array size
    can be resized as many times as the programmer wants to resize the array. However,
    there is one caveat when using ReDim statements: All of the data previously stored
    in the array is lost after resizing the array. The following is an example of
    resizing an array:


    Figure 4.24'
