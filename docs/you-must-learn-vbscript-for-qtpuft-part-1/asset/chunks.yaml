    The Hungarian Naming Convention involves giving variable names to a prefix. As
    a result, the prefix indicates the variable’s data type and scope. The Hungarian
    Naming Convention makes programs easier to write and read. It is best to use the
    `var` prefix if the Programmer is unsure what type of data might end up in the
    variable or if the Programmer is intending to use different kinds of data at different
    times.


    Figure 2.12


    | Data Type | Prefix | Example |

    | :--- | :--- | :--- |

    | Boolean | `bln` or `bool` | `blnBusy` |

    | Byte | `byt` | `bytColor` |

    | Currency | `cur` | `curDollar` |

    | Date or Time | `dtm` | `dtmToday` |

    | Double | `dbl` | `dblAmount` |

    | Error | `err` | `errInvalid` |

    | Integer | `int` | `intTotal` |

    | Long | `lng` | `lngWeight` |

    | Object | `obj` | `objSchedule` |

    | Single | `sng` | `sngMeasure` |

    | String | `str` | `strTest` |

    | Variant | `var` | `varTeam` |


    Chapter 2 mentioned the variable rules, variable types, and variable lifetime.
    In addition, the data types, `Option Explicit`, Variable declaration, and naming
    convention for variables were explained. [Chapter 3] focuses on Operators and
    their precedence.


    # Chapter 3 Operators


    Operators are symbols that represent a specific action. They allow programmers
    to manipulate numbers and text by performing a function on one or more inputs.
    The following are the different types of operators:


    - Assignment Operator: Used for assigning a value to a property or a variable.

    - Arithmetic Operator: Used to calculate a numeric value and used with the assignment
    operator and/or comparison operator.

    - Concatenation Operator: Used to join an infinite number of expressions together.
    The Concatenation Operator is considered a stand-alone operator type, but is sometimes
    included with the Arithmetic Operator.

    - Comparison Operator: Used for comparing variables and expressions.

    - Logical Operator: Used for performing logical operations on expressions. A logical
    operation is an operation that is used to control the flow of a program. All logical
    operators can be used as Bitwise Operators.

    - Bitwise Operator: Used for computing binary values bit by bit (All bitwise operators
    can be used as logical operators).


    Operations are normally performed from left to right, unless there is more than
    one operator in an expression. If more than one operator exists within an expression,
    then they are executed in the following order: `Arithmetic Operators` are executed
    first, followed by the `Concatenation Operator`, then `Comparison Operators`,
    and finally `Logical Operators`.


    The order can be overridden by using parentheses. Operations that are placed in
    parentheses are always evaluated before operations outside of the parentheses.
    Normal precedent rules apply within the parentheses. The following are a couple
    of examples:


    ```

    y = 3 + 2 * 4 + 5

    y = (3 + 2) * (4 + 5)

    ```


    ## Option Explicit


    ```vba

    Dim y

    y = 3 + 2 * 4 + 5

    MsgBox y

    ```

    The answer is 16.


    Figure 3.1

    ![](images/00081.jpg)


    ```vba

    Dim y

    y = (3 + 2) * (4 + 5)

    MsgBox y

    ```

    The answer is 45.


    Figure 3.2

    ![](images/00085.jpg)


    The two examples above look similar, but are actually different. According to
    the guidelines of operator precedence, multiplication is evaluated prior to addition.
    Therefore, the first line has a value of 16 (`2 * 4 = 8 + 3 + 5 = 16`). By adding
    parentheses, the addition operators are evaluated before the multiplication operators,
    therefore the second line has a value of 45 (`5 * 9 = 45`).


    This chapter will cover four of the Operator Types. The Concatenation Operator
    is included within the Arithmetic Operator. The operators which will be discussed
    are as follows:


    - Arithmetic Operators

    - Comparison Operators

    - Logical Operators


    ## Arithmetic Operators


    An Arithmetic Operator is a function that takes operands and uses them to perform
    a calculation. For example, the following expression `7 + 4` uses the `+` to add
    two operands. The following is the order of precedence:


    - `Exponentiation`

    - `Multiplication`

    - `Floating Point Division`

    - `Integer Division`

    - `Modulus`

    - `Addition`

    - `Subtraction`


    - `Concatenation Operator`

    - `Comparison Operators`

    - `Assignment Operator`


    ### Exponentiation


    The Exponentiation Operator `^` is used to raise a number to the power of an exponent.
    The following is an example of the Exponentiation Operator:


    ```vba

    Dim x, y

    y = 7 ^ 2

    MsgBox y

    ```

    The answer is 49.


    Figure 3.3

    ![](images/00090.jpg)


    ### Unary Negation


    The Unary Negation Operator `-` indicates the negative value of an expression.
    The following is an example of the Unary Negation Operator:


    ```vba

    Dim x

    x = -4

    MsgBox x

    ```

    The answer is -4.


    Figure 3.4

    ![](images/00095.jpg)


    ### Multiplication


    The Multiplication Operator `*` is used to multiply numbers. The following is
    an example of the Multiplication Operator:


    ```vba

    Dim x

    x = 3 * 4

    MsgBox x

    ```

    The answer is 12.


    Figure 3.5

    ![](images/00099.jpg)


    ### Floating Point Division


    The Floating Point Division Operator `/` is used to divide two numbers and return
    a floating point number. The following is an example of the Floating Point Division
    Operator:


    ```vba

    Dim x

    x = 4 / 3

    MsgBox x

    ```

    The answer is 1.33333333333333


    Figure 3.6

    ![](images/00103.jpg)


    ### Integer Division


    The Integer Division Operator `\` is used to divide two numbers, discard the remainder,
    and return only the integer. The following is an example of the Integer Division
    Operator:


    ```vba

    Dim x

    x = 4 \ 3

    MsgBox x

    ```

    The answer is 1.


    Figure 3.7

    ![](images/00106.jpg)

