    | True | False | False |

    | False | True | False |

    | False | False | False |


    ### 逻辑蕴含 (Imp)

    逻辑蕴含运算符 (Imp) 当 `Expression1` 为 `True` 且 `Expression2` 为 `False` 时返回 `False`。以下是逻辑蕴含运算符的示例：


    ### 语法

    ```

    Result = Expression1 Imp Expression2

    ```


    ### 强制声明

    ```vb

    Dim x, y

    x = 45

    y = 50

    z = x < 200 Imp y > 40

    MsgBox z

    ```

    答案是“True.”。


