    匈牙命名法（Hungarian Naming Convention）涉及为变量名添加一个前缀。因此，该前缀指示变量的数据类型和作用域。匈牙命名法使程序更容易编写和阅读。如果程序员不确定变量中可能存储什么类型的数据，或者打算在不同时间使用不同类型的数据，最好是使用
    `var` 前缀。


    图 2.12


    | 数据类型 | 前缀 | 示例 |

    | :--- | :--- | :--- |

    | 布尔值 | `bln` 或 `bool` | `blnBusy` |

    | 字节 | `byt` | `bytColor` |

    | 货币 | `cur` | `curDollar` |

    | 日期或时间 | `dtm` | `dtmToday` |

    | 双精度浮点 | `dbl` | `dblAmount` |

    | 错误 | `err` | `errInvalid` |

    | 整数 | `int` | `intTotal` |

    | 长整型 | `lng` | `lngWeight` |

    | 对象 | `obj` | `objSchedule` |

    | 单精度浮点 | `sng` | `sngMeasure` |

    | 字符串 | `str` | `strTest` |

    | 变体 | `var` | `varTeam` |


    第 2 章提到了变量规则、变量类型和变量生命。此外，还解释了数据类型、`Option Explicit`、变量声明以及变量的命名规范。[第 3 章] 关注运算符及其优先级。


    # 第 3 章运算符


    运算符是表示特定操作的符号。它们允许程序员通过对一个或多个输入执行某个功能，来操作数字和文本。以下是不同类型的运算符：


    - 赋值运算符：用于为属性或变量分配值。

    - 算术运算符：用于计算数值，并与赋值运算符和/或比较运算符配合使用。

    - 连接运算符：用于将无限数量的表达式结合。连接运算符被视为一种独立的运算符类型，但有时会被包含在算术运算符中。

    - 比较运算符：用于比较变量和表达式。

    - 逻辑运算符：用于对表达式执行逻辑操作。逻辑操作用于控制程序流程的操作。所有逻辑运算符都可以作为位运算符使用。

    - 位运算符：用于逐位计算二进制值（所有位运算符都可以作为逻辑运算符使用）。


    操作通常从左到右执行，除非表达式中存在多个运算符。如果一个表达式中存在多个运算符，它们将按顺序执行：首先执行`算术运算符`，接着是`连接运算符`，然后是`比较运算符`，最后是`逻辑运算符`。


    可以使用括号覆盖该顺序。放在括号中的操作始终在括号外的操作之前评估。括号内适用标准的优先级规则。以下是示例：


    ```

    y = 3 + 2 * 4 + 5

    y = (3 + 2) * (4 + 5)

    ```


    ## Option Explicit


    ```vba

    Dim y

    y = 3 + 2 * 4 + 5

    MsgBox y

    ```

    答案是 16。


    图 3.1

    ![](img/00081.jpg)


    ```vba

    Dim y

    y = (3 + 2) * (4 + 5)

    MsgBox y

    ```

    答案是 45。


    图 3.2

    ![](img/00085.jpg)


    上述两个示例看起来相似，但实际上是不同的。根据运算符优先级的指南，乘法的优先级高于加法。因此，第一行的值为 16（`2 * 4 = 8 + 3 + 5 =
    16`）。通过添加括号，加法运算符在乘法运算符之前评估，因此第二行的值为 45（`5 * 9 = 45`）。


    本章将涵盖四种运算符类型。连接运算符包含在算术运算符中。将讨论的运算符如下：


    - 算术运算符

    - 比较运算符

    - 逻辑运算符


    ## 算术运算符


    算术运算符是一个接收操作数并使用它们执行计算的函数。例如，以下表达式 `7 + 4` 使用 `+` 添加两个操作数。以下是优先级顺序：


    - `幂`

    - `乘法`

    - `浮点除法`

    - `整数除法`

    - `取模`

    - `加法`

    - `减法`


    - `连接运算符`

    - `比较运算符`

    - `赋值运算符`


    ### 幂


    幂运算符 `^` 用于将数字提升为幂。以下是幂运算符的示例：


    ```vba

    Dim x, y

    y = 7 ^ 2

    MsgBox y

    ```

    答案是 49。


    图 3.3

    ![](img/00090.jpg)


    ### 一元取反


    一元取反运算符 `-` 表示表达式的负值。以下是一元取反运算符的示例：


    ```vba

    Dim x

    x = -4

    MsgBox x

    ```

    答案是 -4。


    图 3.4

    ![](img/00095.jpg)


    ### 乘法


    乘法运算符 `*` 用于数字相乘。以下是乘法运算符的示例：


    ```vba

    Dim x

    x = 3 * 4

    MsgBox x

    ```

    答案是 12。


    图 3.5

    ![](img/00099.jpg)


    ### 浮点除法


    浮点除法运算符 `/` 用于除两个数字并返回浮点数。以下是浮点除法运算符的示例：


    ```vba

    Dim x

    x = 4 / 3

    MsgBox x

    ```

    答案是 1.33333333333333


    图 3.6

    ![](img/00103.jpg)


    ### 整数除法


    整数除法运算符 `\` 用于除两个数字，丢弃余数并仅返回整数。以下是整数除法运算符的示例：


    ```vba

    Dim x

    x = 4 \ 3

    MsgBox x

    ```

    答案是 1。


    图 3.7

    ![](img/00106.jpg)


