  trans: "\n可以使用属性和方法来访问对象。属性是与特定对象关联的值的位符。属性可以包含任何类型的数据，包括对另一个对象的引用。方法可以比附加到对象上的过程。方法以过程相同的方式为对象执行特定操作。\n\
    \n## 多重引用\n\n对象变量的值是一个引用，而不是对象本身。当程序员处理对同一个对象的多个重引用时，这个概念非常重要。有时，理解对象的变量引用对象的过程可能会让人感到困惑。简而言之，对象的变量和对象类似于一个拥有房子的人。这个人拥有一栋房子，地址标识了该人的居住地。对象的变量存储着显示该对象在计算机内存中位置的信息。关于本节，对同一个对象的多个重引用类似于一个人拥有多间房子。以下是多个对象变量引用同一个对象的示例：\n\
    \n图 7.4\n\n![](img/00002.jpg)\n\n```vbscript\nOption Explicit\nDim objGreet, objName\n\
    Dim strGreet, strName\nSet objGreet = CreateObject(\"Scripting.Dictionary\")\n\
    Set objName = objGreet\n'Add and Display the item for objGreet \nobjGreet.Add\
    \ \"1\", \"James\"\nstrGreet = objGreet.Item(\"1\")\nMsgBox \"(objGreet) = \"\
    \ & strGreet\n'Update and Display the item for objName\nobjName.Item(\"1\") =\
    \ \"Joe\"\nstrName = objName.Item(\"1\")\nMsgBox \"(objName) = \" & strName\n\
    'Display the item for objGreet after updating objName\nstrGreet = objGreet.Item(\"\
    1\")\nMsgBox \"(objGreet) = \" & strGreet\n```\n\n第一个输出显示“((objGreet) = James”，第二个输出显示“((objName)\
    \ = Joe”，第三个输出显示“((objGreet) = Joe”。\n\n图 7.5\n\n![](img/00149.jpg)![](img/00041.jpg)[](images/00172.jpg)\n\
    \n有两个对象变量：`objGreet` 和 `objName`，它们通过单独语句创建。对象变量 `objGreet` 是通过 `Set` 命令和 `CreateObject`\
    \ 函数创建的，而对象变量 `objName` 仅通过 `Set` 命令创建。行 `Set objName = objGreet` 意味着两个变量都引用同一个对象。尽管在\
    \ `objGreet` 上只有一个 `Add` 方法：`objGreet.Add \"1\", \"James\"`，但任何对象变量都可以更新该对象。在这种情况下，`objName`\
    \ 通过行 `objName.Item(\"1\") = \"Joe\"` 更新对象，这会反映在两个变量中。注意 `MsgBox \"(objName) =\
    \ \" & strName` 和 `MsgBox \"(objGreet) = \" & strGreet` 都显示 Joe。\n\n## With Construct\n\
    \n`With` 结构是一种快捷方式，在多次引用同一个对象时可以节省输入。当存在多行代码时，`With` 结构可以让程序员的代码看起来更整洁。`With`\
    \ 结构要求语句包含在 `With…End With` 块中。以下是 `With` 结构的示例：\n\n图 7.6\n\n![](img/00040.jpg)\n\
    \n```vbscript\nOption Explicit\nDim objGreet\nDim strGreet\nSet objGreet = CreateObject(\"\
    Scripting.Dictionary\")\nWith objGreet\n    .Add 1, \"James\"        \n    MsgBox\
    \ \"The count is \" & .Count\n    strGreet = .Item(1)\n    MsgBox \"Hello \" &\
    \ strGreet        \nEnd With\n```\n\n第一个输出显示“The count is 1”，第二个输出显示“Hello James”。\n\
    \n图 7.7\n\n![](img/00132.jpg)![](img/00199.jpg)\n\n在 `With…End With` 代码块中，对象变量\
    \ `objGreet` 包含了 `Add` 方法：`.Add 1, \"James\"`、`Count` 属性：`.Count` 以及 `Item` 属性：`.Item(1)`，而无需每次输入对象变量。\n\
    \n## 销毁对象\n\n对象消耗大量资源。在使用之前创建对象以及在不再需要时销毁对象是非常重要的。理解对象的关键是识别它们的寿命。只要变量引用该对象，对象就会保留在内存中。对象可以通过两种方式丢失其引用：首先，对象变量可能会超出范围；其次，可以使用关键字\
    \ `Nothing` 清除对象。`Nothing` 是一个特殊值，仅用于对象以清空引用。以下是使用 `Nothing` 关键字的示例：\n\n图 7.8\n\
    \n![](img/00074.jpg)\n\n```vbscript\nOption Explicit\nDim objGreet\nSet objGreet\
    \ = CreateObject(\"Scripting.Dictionary\")\nobjGreet.Add \"Greet\", \"Hello\"\n\
    MsgBox \"How many objects are in objGreet: \" & objGreet.Count\nSet objGreet =\
    \ Nothing \n```\n\n在这个示例中，对象 `objGreet` 通过使用关键字 `Nothing` 从内存中清除。\n\n## 结论\n\n\
    VBScript 是支持 QTP/UFT 脚本的脚本语言。理解 VBScript 有助于在 QTP/UFT 中创建和维护测试脚本。本书：“第一部分——你必须为\
    \ QTP/UFT 学习 VBScript”侧重于为自动化工程师提供该脚本语言良好的基础。一些重点主题包括：\n\n- **编码标准**：自动化工程师必须养成良好的编程习惯，例如注释和变量的匈牙利命名法。\n\
    - **流程控制**：分支结构和循环语句是流程控制的两种形式。\n\n"
