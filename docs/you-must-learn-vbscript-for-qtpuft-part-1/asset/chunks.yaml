    The Object Equivalence (Is) returns `True`, if `Object1` and `Object2` refer to
    the same memory location. The following is an example of the Object Equivalence
    Operator (Is):


    ### Syntax

    ```

    Result = Object1 Is Object2

    ```


    ### Option Explicit

    ```vb

    Dim x, y, z

    Dim intSameNumber

    x = 11

    y = 21

    z = "1 on another level"

    Set x = CreateObject("Scripting.Dictionary")

    Set y = CreateObject("Scripting.Dictionary")

    Set z = CreateObject("Scripting.Dictionary")

    Set x = z

    Set y = z

    intSameNumber = x Is y

    MsgBox intSameNumber

    ```

    The answer is "True.”


    Figure 3.23

    ![](images/00164.jpg)


    Note: Object Equivalence Operator (Is) does not compare values or compare one
    object to another object. Instead, it checks if two objects (`x` and `y`) in the
    same expression refer to the same object (`z`), which is the same memory location.


    ## Logical Operators

    The Logical Operators are used for performing logical operations on expressions.
    It is customary to find logical operators in control statements to control the
    program’s flow. Each operand is considered a decision, which allows the program
    to make a decision. The following are types of each Logical Operators in order
    of precedence:


    * [Logical Negation (Not)](index_split_011.html_filepos96853)

    * [Logical Conjunction (And)](index_split_011.html_filepos98698)

    * [Logical Disjunction (Or)](index_split_011.html_filepos99171)

    * [Logical Exclusion (Xor)](index_split_011.html_filepos103448)

    * [Logical Equivalence (Eqv)](index_split_011.html_filepos105825)

    * [Logical Implication (Imp)](index_split_011.html_filepos108216)


    ### Logical Negation (Not)

    The Logical Negation Operator (Not) returns the logical negation of an expression.
    The results will be `True` if the expression is `False` and `False` if the expression
    is `True`. `Null` will be returned if the expression is `Null`. The following
    is an example of the Logical Negation Operator:


    ### Syntax

    ```

    Result = Not Expression

    ```


    ### Option Explicit

    ```vb

    Dim x, y

    x = 10

    y = Not (x < 20)

    MsgBox y

    ```

    The answer is “False.”


    Figure 3.24

    ![](images/00168.jpg)


    The following is a Success Table for the Logical Negation Operator (Not):


    Figure 3.25

    | Expression | Result |

    | :--- | :--- |

    | True | False |

    | False | True |

    | Null | Null |


    ### Logical Conjunction (And)

    The Logical Conjunction Operator (And) returns `True` if both expressions are
    `True`, and returns `False` otherwise. The following is an example of the Logical
    Conjunction Operator:


    ### Syntax

    ```

    Result = Expression1 And Expression2

    ```


    ### Option Explicit

    ```vb

    Dim x, y, z

    x = 10

    y = 15

    z = x > 4 And y <= 20

    MsgBox z

    ```

    The answer is “True.”


    Figure 3.26

    ![](images/00171.jpg)


    The following is a Success Table for the Logical Conjunction Operator (And):


    Figure 3.27

    | If Expression1 | If Expression2 | Expression1 And Expression2 |

    | :--- | :--- | :--- |

    | True | True | True |

    | True | False | False |

    | False | True | False |

    | False | False | False |


    ### Logical Disjunction (Or)

    The Logical Disjunction Operator (Or) returns `True` if one or both expressions
    are `True`, and returns `False` otherwise. The following is an example of the
    Logical Disjunction Operator:


    ### Syntax

    ```

    Result = Expression1 Or Expression2

    ```


    ### Option Explicit

    ```vb

    Dim x, y, z

    x = 10

    y = 15

    z = x > 4 Or y >= 20

    MsgBox z

    ```

    The answer is “True.”


    Figure 3.28

    ![](images/00175.jpg)


    The following is a Success Table for the Logical Disjunction Operator (Or):


    Figure 3.29

    | If Expression1 | If Expression2 | Expression1 Or Expression2 |

    | :--- | :--- | :--- |

    | True | True | True |

    | True | False | True |

    | False | True | True |

    | False | False | False |


    ### Logical Exclusion (Xor)

    The Logical Exclusion Operator (Xor) returns `True` if only one expression is
    `True`, and otherwise returns `False`. The following is an example of the Logical
    Exclusion Operator:


    ### Syntax

    ```

    Result = Expression1 Xor Expression2

    ```


    ### Option Explicit

    ```vb

    Dim x, y, z

    x = 100

    y = 10

    z = x = 200 Xor y > 400

    MsgBox z

    ```

    The answer is “False.”


    Figure 3.30

    ![](images/00178.jpg)


    The following is a Success Table for the Logical Exclusion Operator (Xor):


    Figure 3.31

    | If Expression1 | If Expression2 | Expression1 Xor Expression2 |

    | :--- | :--- | :--- |

    | True | True | False |

    | True | False | True |

    | False | True | True |

    | False | False | False |


    ### Logical Equivalence (Eqv)

    The Logical Equivalence Operator (Eqv) returns `True`, if both expressions evaluate
    to the same value (`True` or `False`). The following is an example of the Logical
    Equivalence Operator:


    ### Syntax

    ```

    Result = Expression1 Eqv Expression2

    ```


    ### Option Explicit

    ```vb

    Dim x, y, z

    x = 100

    y = 10

    z = x > 200 Eqv y > 400

    MsgBox z

    ```

    The answer is “True.”


    Figure 3.32

    ![](images/00183.jpg)


    The following is a Success Table for the Logical Equivalence Operator (Eqv):


    Figure 3.33

    | If Expression1 | If Expression2 | Expression1 Eqv Expression2 |

    | :--- | :--- | :--- |

    | True | True | True |

    | True | False | False |

    | False | True | False |

    | False | False | True |


    ### Logical Implication (Imp)

    The Logical Implication Operator (Imp) only returns `False`, if `Expression1`
    is `True` and `Expression2` is `False`. The following is an example of the Logical
    Implication Operator:


    ### Syntax

    ```

    Result = Expression1 Imp Expression2

    ```


    ### Option Explicit

    ```vb

    Dim x, y, z

    x = 45

    y = 50

    z = x < 200 Imp y > 40

    MsgBox z

    ```

    The answer is “True.”


    Figure 3.34

    ![](images/00188.jpg)


    The following is a Success Table for the Logical Implication Operator (Imp):


    Figure 3.35

    | If Expression1 | If Expression2 | Expression1 Imp Expression2 |

    | :--- | :--- | :--- |

    | True | True | True |

    | True | False | False |

    | False | True | True |

    | False | False | True |


    Chapter 3 discussed four of the six Operator types: [Arithmetic](index_split_011.html_filepos71263),
    [Concatenation](index_split_011.html_filepos82711), [Comparison](index_split_011.html_filepos84142),
    and [Logical](index_split_011.html_filepos95766). [Chapter 4](index_split_012.html_filepos110975)
    will explain Arrays, which stores values similar to a variable.


    ## Chapter 4 Arrays

    An array is a matrix of data that stores multiple values. It is allowed to accommodate
    multiple pieces of information in multiple compartments. Compartments separate
    data into divisions or sections for a specific operation. The same concept applies
    to arrays as variables, except variables can only hold one value. Arrays are declared
    with a parentheses and Hungarian prefix of `arr` or `a.`. Chapter four covers:


    * [Declaring Arrays and Bounds](index_split_012.html_filepos112030)

    * [Accessing Arrays](index_split_012.html_filepos140712)

    * [Looping Through Arrays](index_split_012.html_filepos143600)


    ### Static Array Type

    Static Arrays have a constant index. It is not possible to increase or decrease
    the array size. The array remains a fixed size throughout the lifetime of its
    existence. Therefore, programmers must know how many items will be in the array.


    ### One-Dimensional Array

    A One-Dimensional Array has a list of rows and only one column. The number in
    parenthesis specifies the maximum value of indexes. Index is an integer subscript
    that denotes an item’s relative location in a list. The following is an example
    of a One-Dimensional Array:


    ```vb

    Dim arrName(2)

    ```


    ### Fill One-Dimensional Array

    New arrays will be empty if an array function is not used. Items must be assigned
    to indexes for arrays to be filled. The following is an example of a filled One-Dimensional
    Array:


