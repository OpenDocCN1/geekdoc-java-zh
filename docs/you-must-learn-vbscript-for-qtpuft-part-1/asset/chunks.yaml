    \n### 语法\n```vba\nResult = Number1 – Number2\n```\n\n### Option Explicit\n```vba\n\
    Dim x\nx = 37 - 3\nMsgBox x\n```\n答案是 34。\n\n图 3.12\n![](img/00119.jpg)\n\n**注意：**\
    \ 空表达式被视为零 (0)。如果一个或两个表达式为 Null，则结果为 Null。\n\n# 连接\n连接运算符 (`&`) 用于强制连接各个表达式。以下是连接运算符的示例：\n\
    \n### 语法\n```vba\nResult = Expression1 & Expression2\n```\n\n### Option Explicit\n\
    ```vba\nDim strFirstName, strLastName\nstrFirstName = \"Rex\"\nstrLastName = \"\
    Jones II\"\nMsgBox \"The author of this eBook is \" & strFirstName & \" \" & strLastName\
    \ & \".\"\n```\n答案是“The author of this eBook is Rex Jones II.”\n\n图 3.13\n![](img/00124.jpg)\n\
    \n**注意：** 非字符串表达式将转换为字符串。如果两个表达式均为 Null，则结果也是 Null。然而，如果只有一个表达式为 Null，则该表达式在与其他表达式连接时被视为一个零长度字符串\
    \ (\" \")。零长度字符串被赋予一个空白值——无值。任何空表达式也会被视为零长度字符串。\n\n# 比较运算符\n比较运算符允许程序员比较两个表达式。比较运算符测试两个表达式是否为真或为假。因此，比较运算符的数据类型是布尔型（Boolean）。以下是一个成功表，作为比较表达式的指南：\n\
    \n图 3.14\n\n| 如果 | 则 |\n| :--- | :--- |\n| 两个表达式都是数值 | 执行数值比较 |\n| 两个表达式都是字符串\
    \ | 执行字符串比较 |\n| 其中一个表达式是数值，另一个是字符串 | 数值表达式小于字符串表达式 |\n| 其中一个表达式为空，另一个是数值 | 执行数值比较，使用零\
    \ (0) 作为空表达式 |\n| 其中一个表达式为空，另一个是字符串 | 执行字符串比较，使用零长度字符串 (\"\") 作为空表达式 |\n| 两个表达式都为空\
    \ | 表达式相等 |\n\n以下按优先级排序的每个比较运算符列表：\n* 相等\n* 不等于\n* 小于\n* 大于\n* 小于等于\n* 大于等于\n\
    * 对象等效性 (Is)\n\n### 等于\n相等运算符 (`=`) 如果 `Expression1` 等于 `Expression2` 则返回 True，否则返回\
    \ False。以下是相等运算符的示例：\n\n### 语法\n```vba\nExpression1 = Expression2\n```\n\n###\
    \ Option Explicit\n```vba\nDim x, y\nx = 34\ny = 34\nIf x = y Then\n    MsgBox\
    \ x & \"equals \" & y\nEnd If\n```\n该表达式是一个真语句，显示 34 等于 34。\n\n图 3.15\n![](img/00128.jpg)\n\
    \n### 不等于\n不等于运算符 (`<>`) 如果 `Expression1` 不等于 `Expression2` 则返回 True，否则返回 False。以下是不等于运算符的示例：\n\
    \n### 语法\n```vba\nExpression1 <> Expression2\n```\n\n### Option Explicit\n```vba\n\
    Dim x, y\nx = 34\ny = 38\nIf x <> y Then\n    MsgBox x & \"does not equal\"\n\
    End If\n```\n该表达式是一个真语句，显示 34 不等于 38。\n\n图 3.16\n![](img/00133.jpg)\n\n### 小于\n\
    小于运算符 (`<`) 如果 `Expression1` 小于 `Expression2` 则返回 True，否则返回 False。以下是小于运算符的示例：\n\
    \n### 语法\n```vba\nExpression1 < Expression2\n```\n\n### Option Explicit\n```vba\n\
    Dim x, y\nx = 34\ny = 38\nIf x < y Then\n    MsgBox x & \"is less than\"\nEnd\
    \ If\n```\n该表达式是一个真语句，显示 34 小于 38。\n\n图 3.17\n![](img/00138.jpg)\n\n### 大于\n大于运算符\
    \ (`>`) 如果 `Expression1` 大于 `Expression2` 则返回 True，否则返回 False。以下是大于运算符的示例：\n\n\
    ### 语法\n```vba\nExpression1 > Expression2\n```\n\n### Option Explicit\n```vba\n\
    Dim x, y\nx = 38\ny = 34\nIf x > y Then\n    MsgBox x & \"is greater than\"\n\
    End If\n```\n该表达式是一个真语句，显示 38 大于 34。\n\n图 3.18\n![](img/00143.jpg)\n\n### 小于等于\n\
    小于等于运算符 (`<=`) 如果 `Expression1` 小于或等于 `Expression2` 则返回 True，否则返回 False。以下是小于等于运算符的示例：\n\
    \n### 语法\n```vba\nExpression1 <= Expression2\n```\n\n### Option Explicit\n```vba\n\
    Dim x, y\nx = 34\ny = 34\nIf x <= y Then\n    MsgBox x & \"is less than or equal\
    \ to\"\nEnd If\n```\n该表达式是一个真语句，显示 34 小于或等于 34。\n\n图 3.19\n![](img/00148.jpg)\n\
    \n### Option Explicit\n```vba\nDim x, y\nx = 34\ny = 38\nIf x <= y Then\n    MsgBox\
    \ x & \"is less than or equal to\"\nEnd If\n```\n该表达式是一个真语句，显示 34 小于或等于 38。\n\n\
    图 3.20\n![](img/00153.jpg)\n\n### 大于等于\n大于等于运算符 (`>=`) 如果 `Expression1` 大于或等于\
    \ `Expression2` 则返回 True，否则返回 False。以下是大于等于运算符的示例：\n\n### 语法\n```vba\nExpression1\
