    \nThe above code requires high maintenance due to extra variables and more lines\
    \ of code. The following is a `Sub Procedure` example that will produce the same\
    \ results as above, but in a more efficient manner:\n\nFigure 6.9\n![](images/00135.jpg)\n\
    \n```vbba\nOption Explicit\n\nCall AddNumbers (20, 17)\n\nCall AddNumbers (5,\
    \ 15)\n\nSub AddNumbers (intFirstNumber, intSecondNumber) \n    MsgBox intFirstNumber\
    \ + intSecondNumber\nEnd Sub\n```\nThe first output displays “37” and the second\
    \ output displays “20.”\n\nFigure 6.10\n![](images/00189.jpg)![](images/00004.jpg)\n\
    \nAn error occurs if there is an attempt to return a value to the `Sub Procedure`.\
    \ The following is an example that displays a `Run Error`:\n\nFigure 6.11\n![](images/00200.jpg)\n\
    \n```vbba\nOption Explicit\n\nDim intFirst, intSecond\nintFirst = 20\nintSecond\
    \ = 17\nMsgBox \"This SubProcedure displays an error when attempting to return\
    \ a value \" & AddNumbers (intFirst, intSecond)\n\nSub AddNumbers (intFirstNumber,\
    \ intSecondNumber) \n    MsgBox \"Sub Procedure does not return values. The first\
    \ MsgBox displays a Run Error\"\nEnd Sub\n```\nA `Run Error` displays, “Type mismatch:\
    \ AddNumbers” for Line 8.\n\nFigure 6.12\n![](images/00019.jpg)\n\n# Function\
    \ Procedure\n\nA `Function Procedure` is a named block of code enclosed by `Function`\
    \ and `End Function`, which perform an action and returns a value. The principles\
    \ regarding keywords `Public` and `Private` and declaring arguments are identical\
    \ to the `Sub Procedure`. The following is the syntax for a `Function Procedure`:\n\
    \n### Syntax\n```vbba\n[Public | Private] Function NameOfFunctionProcedure ([Argument1],\
    \ [ArgumentN])\n    code         \n    NameOfFunctionProcedure = some value\n\
    End Function\n```\n\nFigure 6.13\n![](images/00032.jpg)\n\n```vbba\nOption Explicit\n\
    \nDim intFirst, intSecond\nintFirst = 25\nintSecond = 4\nMsgBox \"The total is\
    \ \" & MultiplyNumbers (intFirst, intSecond)\n\nFunction MultiplyNumbers (intFirstNumber,\
    \ intSecondNumber)\n    MultiplyNumbers = intFirstNumber * intSecondNumber\nEnd\
    \ Function\n```\nThe output displays “The total is 100.”\n\nFigure 6.14\n![](images/00034.jpg)\n\
    \nThe `Function Procedure` has two arguments `intFirstNumber` and `intSecondNumber`,\
    \ which are named differently from the variables `intFirst` and `intSecond`. Arguments\
    \ and variables can have the same name, but this may cause confusion. Therefore,\
    \ it is favorable to have unique names that are still similar enough to recognize\
    \ the relationship between variables and arguments. Each argument provides a way\
    \ for the code within the procedure to access values passed to it from the calling\
    \ code. The following is a breakdown of the calling code and code within the procedure:\n\
    \n*   Calling Code = `MsgBox \"The total is \" & MultiplyNumbers (intFirst, intSecond)`\n\
    *   Code within the Procedure = `(MultiplyNumbers = intFirstNumber * intSecondNumber)`\n\
    \nThe calling code variables pass values “25” and “4” to the procedure arguments.\
    \ Variable `intFirst` passes 25 to argument `intFirstNumber` while `intSecond`\
    \ passes 4 to argument `intSecondNumber`. Eventually the message box (`MsgBox`)\
    \ displays the returned value “100” from the procedure. Notice the code within\
    \ the procedure. The function name `MultiplyNumbers` and arguments `intFirstNumber`\
    \ and `intSecondNumber` are not explicitly declared with a `Dim` statement. An\
    \ explicit declaration is not required by virtue of statement `Function MultiplyNumbers\
    \ (intFirstNumber, intSecondNumber)`, which implicitly declares the function name\
    \ and arguments. However, the program would have encountered an error if the procedure\
    \ used an undeclared variable (i.e. `intTotal`). `Function Procedures` can only\
    \ return values if the value is stored inside the function name. As a result,\
    \ `intFirstNumber = 25` multiplied by `intSecondNumber = 4` assigns 100 to function\
    \ name `MultiplyNumbers`, which returns 100 back to the calling code.\n\n## Procedure\
    \ Techniques/Rules\n\nIt is beneficial to use meaningful procedure names that\
    \ make the purpose clear. A good technique to employ is verb-noun combinations,\
    \ such as “GetOrder.” Programmers can use as many arguments as needed, although\
    \ a sign of a procedure with too many tasks is too many arguments. The same rules\
    \ that apply to naming a procedure apply to naming variables:\n\n1.  Cannot exceed\
    \ 255 characters\n2.  Underscore `_` is the only valid non-alphanumeric character\n\
    3.  Must start with a letter (uppercase or lowercase)\n\n## Syntax for Calling\
    \ Procedures\n\nThere are several methods to invoke a `Sub Procedure` or `Function\
    \ Procedure`. This section illustrates valid and invalid ways for calling `Sub`\
    \ and `Function Procedures`.\n\n### Call Sub Procedure\n\nThe `Call` keyword requires\
    \ a parenthesis when calling a `Sub Procedure`. Conversely, the parenthesis can\
    \ be used with the `Call` keyword or without the `Call` keyword.\n\n#### Valid\n\
    ### Syntax\n```vbba\nNameOfSubProcedure “some value”\n```\n\nFigure 6.15\n![](images/00066.jpg)\n\
    \n```vbba\nOption Explicit\n\nGreetNeighbor \"Joe\"\n\nSub GreetNeighbor(strNeighbor)\n\
    \    MsgBox \"Hi \" & strNeighbor\nEnd Sub\n```\nThe output displays “Hi Joe.”\n\
    \nFigure 6.16\n![](images/00067.jpg)\n### Syntax\n```vbba\nCall NameOfSubProcedure\
    \ (\"some value\")\n```\n\nFigure 6.17\n![](images/00017.jpg)\n```vbba\nOption\
    \ Explicit\n\nCall GreetNeighbor (\"Joe\")\n\nSub GreetNeighbor(strNeighbor)\n\
    \    MsgBox \"Hi \" & strNeighbor\nEnd Sub\n```\nThe output displays “Hi Joe.”\n\
    \nFigure 6.18\n![](images/00067.jpg)\n### Syntax\n```vbba\nNameOfSubProcedure\
    \ (\"some value\")\n```\n\nFigure 6.19\n![](images/00018.jpg)\n```vbba\nOption\
    \ Explicit\n\nGreetNeighbor (\"Joe\")\n\nSub GreetNeighbor(strNeighbor)\n    MsgBox\
    \ \"Hi \" & strNeighbor\nEnd Sub\n```\nThe output displays “Hi Joe.”\n\nFigure\
    \ 6.20\n![](images/00067.jpg)\n### Invalid\n### Syntax\n```vbba\nCall NameOfSubProcedure\
    \ \"some value\"\n```\n\nFigure 6.21\n![](images/00016.jpg)\n```vbba\nOption Explicit\n\
    \nCall GreetNeighbor \"Joe\"\n\nSub GreetNeighbor(strNeighbor)\n    MsgBox \"\
    Hi \" & strNeighbor\nEnd Sub\n```\nA `Run Error` displays “The test run cannot\
    \ continue due to a syntax error.”\n\nFigure 6.22\n![](images/00046.jpg)\n\n##\
    \ Call Procedure\n\nThe rules for calling a `Function Procedure` are different.\
    \ Parenthesis must surround the argument list and the `Call` keyword has to be\
    \ omitted to receive a value from the function.\n\n#### Valid\n### Syntax\n```vbba\n\
    MsgBox NameOfFunctionProcedure (some value)\n```\n\nFigure 6.23\n![](images/00056.jpg)\n\
    \n```vbba\nOption Explicit\n\nMsgBox AddNumbers (1, 2, 3)\n\nFunction AddNumbers\
