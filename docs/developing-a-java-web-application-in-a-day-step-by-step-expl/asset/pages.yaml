    +   - MySQL Community Server (http://dev.mysql.com/downloads/mysql/): open source
    DB;

    - MySQL Workbench (http://dev.mysql.com/downloads/bench/): open source environment
    used for the creation and management of the DB (schemas, tables, etc.).


