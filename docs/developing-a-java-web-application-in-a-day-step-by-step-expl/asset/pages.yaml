  md: '# 2.2 Web Application Servlet and JSP


    A Web Application consists of a Servlet, pages html/xhtml and jsp, classes, and
    other components, which can be installed and run inside a container (Application
    Server), which presents a JVM (Java Virtual Machine). A web application is mapped
    through a hierarchy of directories on the file system and usually exported as
    jar or ear. Assuming that the root folder of our project is company_management,
    it will be deployed to the webapps directory of Tomcat. In the root may be other
    directories, including the WEB-INF directory (accessible only by the application
    server), which contains the web.xml, the compiled classes folder, and the libraries
    folder.


    We shall use Tomcat as Web Application Server: it is able to handle the latest
    versions of the Servlet (from 2.5 to 3.1) and JSP pages (also EJB, or frameworks
    as Struts and Web Services Axis).


    JSP (Java Server Page) technology allows us to easily create html/xhtml pages,
    which have both static and dynamic components (abstraction of servlets). The dynamic
    code in Java is contained in <% and precompiled before sending the response to
    the client.


    Servlets are Java classes, which run in Servlet Container (e.g. Tomcat or JBoss)
    and are exposed as web resources. These classes process data from the html form
    and handle requests and responses for one or more clients. The 3.x standard (in
    Java EE standard) is the latest version of the Servlet specifications (JSR 315).
    A servlet corresponds to the Controller in the MVC architecture, and it implements
    many complex functionality. We can use a single servlet to handle different behaviors
    or many servlet for each behavior. We shall use in the text a single Servlet,
    which presents different behaviors.


    Briefly, a client sends a request to a servlet (in a web application server),
    the Servlet gets instantiated (only the first time), starts a thread to handle
    the communication and builds the response which is forwarded to the client; if
    the Servlet has already been loaded, it will create an additional thread associated
    to the client. The Servlet has no algorithmic code inside, but it is delegated
    to other classes. Request and Response are managed by the interfaces javax.servlet.HttpServletRequest
    (which obtains information from the client environment) and javax.servlet.HttpServletResponse
    (which sends response to the client). Another component (javax.servlet.ServletContext)
    allows to find the reference to the context of an application.


    Servlets have a life-cycle characterized by the following elements and methods:


    +   - initialization of the servlet (method init()), called, only the first time,
    from the Servlet Engine;

    - response to POST requests (method doPost(HttpServletRequest req, HttpServletResponse
    response));

    - response to GET requests (method doGet(HttpServletRequest req, HttpServletResponse
    response));

    - destruction of the servlet context (method destroy()).'
  merge: -1
