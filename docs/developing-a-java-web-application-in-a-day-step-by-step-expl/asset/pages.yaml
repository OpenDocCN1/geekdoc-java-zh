  md: '# 2.1 MVC – Model View Controller


    The more used pattern in application development is the MVC (Model-View-Controller).
    This pattern was described by Xerox, for the first time, in several publications
    in the late late''. The most important aspect is the separation into three distinct
    components:


    +   - Model: it is related to the application logic and persistence of data manipulation;

    - View: it is related to the presentation, that is the interface with the end
    user;

    - Controller: it is related to the processing of requests.


    This level of separation is important both for reasons of stability and security
    of the application.'
  merge: -1
