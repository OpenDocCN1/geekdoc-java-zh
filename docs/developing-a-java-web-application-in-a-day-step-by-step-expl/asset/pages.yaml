  md: '# 7.4. Request vs Session


    It is about ten to two!


    Now we can connect the two elements, but we also need to maintain the state of
    the two analyzed bean. This is possible using request or session. The difference
    between request and session is based on the scope of the attributes. The request
    is canceled as soon as the response is committed to the client, while the session
    ends with the end of the session (for example, the browser is closed). We will
    study and use the session. In fact, the request can generate the possibility of
    losing data in the event that we work with frameworks where different layers of
    software are present.


    When we create a new session, the server allocates a memory location, which will
    contain data, which the user’s browser knows. Practically, a cookie is set in
    the browser with an identification number of the session (Session Id). In JSP
    pages, a “session” is an implicit object, which can be accessed in servlet by
    request. By the Servlet, it is invoked by method getSession() with the following
    Java code:


    ```

    HttpSession session = request.getSession();

    ```


    The request is necessary to obtain a reference to an object of HttpSession type.
    The method getSession() returns an HttpSession type. Then, the Servlet identifies
    the client (browser), if an HttpSession Object is already instantiated, it is
    used, otherwise a new session object is created. This behavior allows the maintenance
    of the state in applications pages (it is not possible for simple request!)


    The three standard methods used to work with attributes of a session object are
    the following:


    +   - public void setAttribute(String name, Object value): it sets an object in
    session with a name

    - public Object getAttribute(String name): it gets an object from session with
    a name

    - public void removeAttribute(String name): it removes an object in session with
    a name


    Now, we shall fill the beans and set them in session, before saving them in the
    DB. Proceed to walk. So, step by step, we shall manage the company bean, and set
    it in session before dispatching to the JSP page (controller and view in MVC pattern).


    The company jsp page is initially empty. Then, after submitting, the saved bean
    in session (CompanyBean.java) is returned to and processed by the JSP, which fills
    values in the form fields. We shall see the filled in form and can go to the employee
    page.


    First, change the bean CompanyBean.java, adding the list of employees'
