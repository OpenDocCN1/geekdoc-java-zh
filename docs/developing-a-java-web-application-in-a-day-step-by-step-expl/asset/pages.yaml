  md: 'Servlet 3.X represents the state of the art of the Servlet technology. The
    use of annotations is one of the most important innovation within a web application:
    it is a way of adding metadata in the servlet source code as an alternative to
    XML technology contained in web.xml.


    We shall create a single servlet, which will have different behaviors depending
    on parameters from data entry forms. The actions will be consequences of method
    calls (method doGet or doPost).


    After a preliminary analysis of the hypothetical requirements of a customer, for
    example, we suppose to develop a web application (called Company_Management) with
    the aim to save and manage a number of companies and their employees.'
