  md: '# 2 Introduction


    The study of web application plays the most important role in web programming
    and it can be considered the cornerstone of companies’ technology. In fact, all
    the modern technology both in private and government companies is based on automation
    systems, both in terms of lower costs (one application on a server costs less
    than n applications on individual PCs) and in terms of sharing information in
    internet, intranet and extranet companies’ web site.


    The aim of this text is to learn how to set up a web project in Java technology.
    We shall use Java because it is free, standard and there are many (free) libraries
    on the web. We shall create the database in MySQL, and implement all the procedures
    to develop a web application using Eclipse, analyzing many issues in a clear and
    simple way, providing the principles for developing complex applications. We first
    need to download the necessary (free) software:


    +   * Eclipse MARS;

    * MySQL;

    * Driver MySQL;

    * Tomcat 8.0.


    To follow this dissertation is only necessary to have minimum skills on algorithms,
    programming, java, html and database.'
