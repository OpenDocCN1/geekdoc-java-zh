  md: '# 9. Conclusion


    It is about seven! We have definitely finished, so please do not worry!

    It has been a good experience working with you!


    We have just created and distributed our first web application (not so far from
    real professional applications!). It consists of 4 JSP (formCompanyFull.jsp, formEmployeeFull.jsp,
    error.jsp, listCompany.jsp); 1 access class to the DB (SaveMyMySQL.java); 2 bean
    class (CompanyBean.java and EmployeeBean.java); 1 servlet (CompanyManagementServlet).


    Simple, isn''t it?

    I this dissertation has been helpful and useful...I look forward to your feedback!'
