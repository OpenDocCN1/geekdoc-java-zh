  md: '# 7.6. Examples of error handling in java Web Application


    It is about five thirty!


    In this paragraph, we shall try to manage the errors of the Servlet. First, we
    shall generate a simple "error", changing the company insert query. Change the
    name of a field: company_name in companyname The query cannot be execute, because
    a field is incorrect.


    In the next screenshot, we can see the error is caught.


    The stacktrace on console helps us to see the errors.


    ![](img/112513ff21bfadb0111c509b6257bbec_108_0.png)


