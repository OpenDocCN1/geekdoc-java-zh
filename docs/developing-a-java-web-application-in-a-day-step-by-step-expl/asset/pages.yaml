  md: '# 7.5. Connection to MySQLDataBase, Commit and Roll-Back


    It is four o''clock!


    Now we have the object company with its employees.


    Let us save to the DataBase!


    The following paragraph illustrates a very simple method of saving!


    The first thing to do is download the Java Connector to DB at the URL http://dev.mysql.com/downloads/connector/,
    which contains a list of connectors to work with different programming languages.
    Now, simply download the library for independent platform!


    This library can move from the windows environment of development in any testing
    or delivery/ operation /distribution environment (also Unix-like).


    We shall extract from the zip library the mysql-connector-java-5.1.34-bin.jar
    file and save it in the lib folder created within the project.


    We can put in one of two JSP pages (company o employee) a button “Save Company
    on DB”, which suggests the user the possibility to store and persist data on DB.


    We need to create the DAO (Data Access Objects) class, named SaveMySQL.java, to
    manage the CRUD with the database.


    Initially, we shall define final String DB_DRIVER with the DB:


    ```

    private static final String DB_DRIVER = "com.mysql.jdbc.Driver";nprivate static
    final String DB_CONNECTION = "jdbc:mysql://localhost:3306/gestione_imprese";nprivate
    static final String DB_USER = "root";nprivate static final String DB_PASSWORD
    = "root";

    ```


    The driver is related to the Java Connector. The other parameters specify the
    host credentials to access DataBase.


    Within a try considering the SQLException error in the DB, we are now connected
    to the DB:


    ```

    conn = getDBConnection();

    ```


    Then set AutoCommit to false (so, we shall set when commit!):


    ```

    conn.setAutoCommit(false);

    ```'
