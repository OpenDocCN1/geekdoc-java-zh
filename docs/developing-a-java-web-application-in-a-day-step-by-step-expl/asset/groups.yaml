    # 7.3. Request Redirect vs Dispatcher


    It is about ten past one! Five minute for a sandwich!


    We use another object to return and maintain an object (with state!) from the
    Servlet to the JSP. The server side presents two main method: redirect and dispatch.
    The first is the following code:


    ```

    response.sendRedirect("http://www.arnereetrice.it/");

    ```


    In this case, the Servlet does a redirect to a specific URL without taking memory
    of the current state of its parameters (an example is the return to the home page
    of a site).


    In the case of dispatch, it is assumed that the server does something else; in
    fact, the browser displays a particular JSP and passes some parameters (such as
    those in session or request); and the end-user does not know the content of a
    JSP page is rendered in his. In this case, the standard syntax is:


    ```

    ServletContext sc = request.getSession().getContext();

    RequestDispatcher rd = sc.getRequestDispatcher("/company.jsp");

    rd.forward(request, response);

    ```


    The servlet uses the application context and then transfers control to the JSP.
    In the following text, we shall use mainly the dispatching method.


    For example, we shall insert two links: to the home page and the other to the
    employee page. We shall link the home page with a redirect and the JSP employee
    page as a dispatcher. In the following screenshot, it is possible to see the two
    links.


    ![](img/112513ff21bfadb0111c509b6257bbec_88_0.png)


    Figure 98. JSP links — company.jsp.


    In the Servlet we shall use the doGet to manage the request, as the Servlet is
    called via a direct link (the html form GET method) and not via the submit form
    (the html POST method).'
