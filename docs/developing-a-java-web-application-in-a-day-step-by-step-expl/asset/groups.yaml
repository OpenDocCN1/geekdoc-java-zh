    \nFigure 100. JSP links – homepage.jsp.\n\n## 7.4. Request vs Session\n\nIt is\
    \ about ten to two!\n\nNow we can connect the two elements, but we also need to\
    \ maintain the state of the two. This is possible using request or session. The\
    \ difference between request and session is based on the scope of attributes.\
    \ The request is canceled as soon as the response is committed, while the session\
    \ ends with the end of the session (for example, the browser is closed). We will\
    \ study and use the session. In fact, the request can generate the possibility\
    \ of losing data in the event that we work with frameworks where different layers\
    \ are present.\n\nWhen we create a new session, the server allocates a memory\
    \ location, which will contain data, which the user’s browser knows. Practically,\
    \ a cookie is set in the browser with an identification number of the session.\
    \ In JSP pages, “session” is an implicit object, which can be accessed in servlet\
    \ by request. By the Servlet, it is invoked by method getSession():\n\n```java\n\
    HttpSession session = request.getSession();\n```\n\nThe three standard methods\
    \ used to work with attributes of a session object are the following:\n\n- `public\
    \ void setAttribute(String name, Object value)`: it sets an object in session\
    \ with a name\n- `public Object getAttribute(String name)`: it gets an object\
    \ from session with a name\n- `public void removeAttribute(String name)`: it removes\
    \ an object from session with a name\n"
