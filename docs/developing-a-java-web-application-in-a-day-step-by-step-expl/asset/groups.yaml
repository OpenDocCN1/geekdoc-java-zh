    # We can see how class leave the error management to the Servlet (throw):


    Row 58 of SaveMySQL.java:

    throw SQLException(sql.getErrorCode() + ": " + sql.getMessage());


    Console Log of SaveMySQL.class:

    ERROR:0:1054:Unknown column ''companyname'' in ''field list''


    Row 210 of CompanyManagement.java:

    System.out.println("ERROR:" + e.getErrorCode() + ":" + e.getMessage());


    ![](img/112513ff21bfadb0111c509b6257bbec_109_0.png)


    Figure 128. Servlet error management.


    The error of SQLException type is "caught" in the block of competence, and the
    DAO class operation is rolled back. In such a case it can be without an elementary
    manage of the error with a simple jsp. The servlet redirects, in case of error,
    the request on an error page. We will create a boolean variable inside the cache:
    according to this variable value, we can display the error page or continue with
    the execution of the servlet.


