    ## 4. Database Analysis, Design and Implementation for Web Application


    Now, we shall design the DB “Company_Management”, in order to save on DB and manage
    a set of companies and their employees.


    The preliminary analysis leads us to define two entities: Company and Employee:
    a company can have from 0 to n employees and an employee may be employed to only
    one company. A company has the following (simple) fields:


    - idcompany: identification number (for example number) of the company (key);

    - company_name: name of the company;

    - phone: phone number;

    - email: company email;

    - insert date.


    The employee (Employee) will instead have the following fields:


    - idemployee: identification number (for example Social Security Number (SSN))
    of the employee (key);

    - surname;

    - name;

    - badge or serial number;

    - insert date.


    Moreover, we also need to have relationships between these two tables: in fact
    an employee works for a company and a company has many employees. So, the Employee
    entity will have a foreign key linked to the attribute idcompany of the the Company
    entity.

