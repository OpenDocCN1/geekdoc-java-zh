    ```java\nresponse.sendRedirect(\"http://www.arnereetrice.it/\");\n```\n\nIn this\
    \ case, the Servlet does a redirect to a specific URL without taking memory of\
    \ the current state of its parameters (an example is the return to the home page\
    \ of a site).\n\nIn the case of dispatch, it is assumed that the server does something\
    \ else; in fact, the browser displays a particular JSP and passes some parameters\
    \ (such as those in session or request); and the end-user does not know the content\
