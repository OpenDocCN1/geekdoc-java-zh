    \n![](img/112513ff21bfadb0111c509b6257bbec_69_0.png)\n\n图 77. Eclipse，类方法。\n\n\
    ## 7.1. Servlet 的实现\n\n现在，我们将创建一个新的 Servlet！我们可以直接进入文件（File）菜单 - 新（New） - Servlet。\n\
    \n![](img/112513ff21bfadb0111c509b6257bbec_70_0.png)\n\n图 78. Eclipse，如何创建 Servlet。\n\
    \n服务器通过两个方法 doGet 和 doPost 工作，它们处理来自请求（HttpServletRequest）的消息，使用方法：request.getParameter(\"\
    employee\")。如果我们想查看 Servlet 成功处理的数据，只需使用 System.out.println 命令，这允许我们在 Eclipse\
