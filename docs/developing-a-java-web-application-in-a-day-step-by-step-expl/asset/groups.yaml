    Servlet 3.X 代表了 Servlet 技术的最高水平。注解的使用是 Web 应用中最重要的创新之一：它是在 Servlet 源码中添加元数据的方法，可以作为
    `web.xml` 中 XML 技术的替代方案。


    我们将创建一个 Servlet，它将根据数据输入表单的参数具有不同的行为。这些操作将是方法调用（method doGet` 或 `doPost`）的结果。


    在对客户的假设需求进行初步分析后，例如，假设我们要开发名为 Company_Management 的 Web 应用，目的是保存和管理许多公司及其员工。


