    ## 5. How to configure Eclipse MARS (JDK and Tomcat)


    We need to download the appropriate IDE for working in Java. The most popular
    and free IDE is Eclipse: its latest version (Mars) is available at https://www.eclipse.org.


    Now we shall download the following zipped file: eclipse-mars-win-x64.zip. After
    downloading it, we do not need to install Eclipse, but it is only necessary to
    unzip the compressed file (usually choose the directory C:/). The unzipped files
    are present in the extracted folder “eclipse”, which we can rename into “mars”
    (the name is irrelevant, but may be useful to distinguish Eclipse versions, we
    can have many versions of Eclipse on our machines). This will be our working folder
    of the IDE. Eclipse simply runs by double-clicking the eclipse.exe file.


    ![](img/112513ff21bfadb0111c509b6257bbec_41_0.png)


    Figure 42. Eclipse, files in extracted folder.


    As soon as we start the executable file, the IDE asks what is the workspace (i.e.
    the project folder): usually change the standard directory and choose the directory
    C: /.


    ![](img/112513ff21bfadb0111c509b6257bbec_41_1.png)


    Figure 43. Eclipse, workspace.


    The initial screen is the following one.


    ![](img/112513ff21bfadb0111c509b6257bbec_42_0.png)


    Figure 44. Eclipse, initial screen.


    ## 5.1. How to configure JDK in Eclipse environment


    We have to install and configure the JDK - Java Development Kit. So we can work
    with Java in Java download the latest version from: http://www.oracle.com/java/javase/downloads/index.html


    We choose to download the executable file for Windows: jdk-8u65-windows-x64.exe.
    So we shall click the download button and accept the license, and start downloading
    the chosen version of JDK.


    ![](img/112513ff21bfadb0111c509b6257bbec_43_0.png)

    ![](img/112513ff21bfadb0111c509b6257bbec_43_1.png)


    Figure 45. Eclipse, JDK Download.


    Now, install the executable file! Then we shall configure the IDE from window
    - preferences - Installed JRE and select (or search on the PC) the downloaded
    JDK.


    ![](img/112513ff21bfadb0111c509b6257bbec_44_0.png)


    Figure 46. Eclipse, JDK configuration.


    ## 5.2 How to configure Tomcat 8.0 in Eclipse


    All applications “run” on a server. In this case, we shall use Tomcat, which is
    one of the most volatile server. So download the latest version from: http://tomcat.apache.org/


    We choose to download the following zipped file for Windows: apache-tomcat-8.0.14-windows-x86.zip.
    After downloading it, we do not need to install Tomcat, but it is only necessary
    to unzip the compressed file (usually choose the directory C:/). The unzipped
    files are present in the extracted folder “apache-tomcat-8.0.14”, which will be
    the distribution/operation/delivery folder. We shall also use this folder of Tomcat
    and its instances for the development of our web application. A very business
    situation includes different environments (such as development, test and distribution/operation/delivery),
    so it is always necessary to maintain consistency between server versions to prevent
    bugs or different behaviors.


    It is necessary to configure the server in the Eclipse IDE. To go to tab “server”,
    it automatically asks for the configuration of a new server. We can click on that
    link, select the Tomcat server 8, and follow the required wizard.


    ![](img/112513ff21bfadb0111c509b6257bbec_45_0.png)


    Figure 47. Eclipse, new server configuration.


    ![](img/112513ff21bfadb0111c509b6257bbec_46_0.png)


    Figure 48. Eclipse, Tomcat selection.


    ![](img/112513ff21bfadb0111c509b6257bbec_47_0.png)


    Figure 49. Eclipse, Tomcat server and installed JRE.


    We can configure a server from File – New – Server.


    ![](img/112513ff21bfadb0111c509b6257bbec_48_0.png)


    After configuring the server, we can go to the tab “server”, the server will appear
    just configured. We shall now click the right mouse button, open the context menu
    and start the server.


    ![](img/112513ff21bfadb0111c509b6257bbec_49_0.png)


    Figure 51. Eclipse, how to start the server.


    If we go on the browser, we can see the Tomcat server that is activated by typing
    the following URL in the address bar (URL of the server followed by the name of
    the application):


    http://localhost:8080/Web_Application_name


    ## 6. How to create a Dynamic Web Project in Eclipse


    It is about ten thirty!


    Now we shall start the steps for creating a Java web application.

    Go on the File menu and select “New” then “Dynamic Web Project”.


    ![](img/112513ff21bfadb0111c509b6257bbec_50_0.png)


    Figure 52. Eclipse, how to create a web project.


    The related wizard starts. We shall enter the name of the project “company_management”
    and leave unchanged the other parameters.

