    # 7.2. JavaBean


    It is twelve o''clock!


    Once we have taken values from the form, we need to manage saving them into Database.
    Therefore, according to the MVC pattern, it is necessary to create and use an
    "object" which will be passed to a DAO (Data Access Object) class for saving data
    into Database. This object can encapsulate many objects into a single object,
    which can be serialized.


    Now, we need to create and instantiate a new object (JavaBean), which sets and
    maintains the status of its variables during the time of use. This class presents
    only the *get and set methods* of its variables (*pattern of data encapsulation*).


    We shall start with the creation of a new class.


    ![](img/112513ff21bfadb0111c509b6257bbec_81_0.png)


    Figure 91. JavaBean class creation.'
