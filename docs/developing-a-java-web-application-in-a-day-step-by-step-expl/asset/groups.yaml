    我们选择下载 Windows 的压缩包：`tomcat-8.14-windows86.zip`。下载后，我们不需要安装 Tomcat，只需要解压压缩文件（通常选择目录
    `C:/`）。解压后的文件存在提取出的“tomcat-8.14”文件夹中，这将是我们的开发环境。


