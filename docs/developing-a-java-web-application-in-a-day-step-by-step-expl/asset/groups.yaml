    Servlet 3.X represents the state of the art of the Servlet technology. The use
    of annotations is one of the most important innovation within a web application:
    it is a way of adding metadata in the servlet source code as an alternative to
    XML technology contained in web.xml.


    We shall create a single servlet, which will have different behaviors depending
    on parameters from data entry forms. The actions will be consequences of method
    calls (method doGet or doPost).


    After a preliminary analysis of the hypothetical requirements of a customer, for
    example, we suppose to develop a web application (called Company_Management) with
    the aim to save and manage a number of companies and their employees.


    ## 3. How to install and configure MySQL 5.6 Community


    Let us start! It is about nine am!

    MySQL (now Oracle MySQL) is a powerful relational database (RDBMS), which works
    on both Linux/Unix and Windows. It is very useful for the creation and the management
    of Database for web applications. It is a free software and, therefore, is used
    both as a database for simple sites and for professional applications (for example
    Literary). The following steps explain the installation and the configuration
    of MySQL on Windows OS.


    Now, we shall install MySQL!

