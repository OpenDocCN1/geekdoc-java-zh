    files are present in the extracted folder “apache-tomcat-8.0.14”, which will be
    the distribution/ operation /delivery folder. We shall also use this folder of
    Tomcat and its instances for the development of our web application. A very business
    situation includes different environments (such as development, test and distribution/operation/delivery),
    so it is always necessary to maintain consistency between the server versions
    to prevent bugs or different behaviors.


    It is necessary to configure the server in the Eclipse IDE. To go to tab “server”,
    automatically it asks the configuration of a new server. We can click on that
    link, select the Tomcat server 8, and follow the wizard required.


    ![](img/112513ff21bfadb0111c509b6257bbec_45_0.png)


    Figure 47. Eclipse, new server configuration.'
