    # 在一天内开发 Java Web 应用


    使用 Eclipse Mars、Tomcat 和 MySQL 的逐步详解


    Luciano Manelli


    ![](img/112513ff21bfadb0111c509b6257bbec_0_0.png)


    # 版权所有 – 2016 Luciano Manelli

    保留所有权利


    # 作者


    Luciano Manelli 于 1975 年出生于意大利塔兰托（Taranto）。他于 24 岁时毕业于巴里理工学院获得电子工程学位，随后在海军担任军官。2012
    年，他从巴里大学 - 阿尔多·莫罗大学信息系获得计算机科学博士学位。在博士期间，他分析了网格计算并在国际出版物上发表了结果。他目前是巴里理工学院的合同教授（课程：计算机科学基础）以及巴里大学
    - 阿尔多·莫罗大学的教授（课程：Web编程）。作者在计算机科学和信息系统领域拥有十五工作经验，并在巴里理工学院、巴里大学 – 阿尔多·莫罗大学以及专业课程方面也拥有经验。他是一名注册认证工程师，2014
    年在为 InfoCamare SCPA 工作 13 年后开始任职塔兰托港务局。他在 2014 年写了《现代信息技术基础》（意大利版 –“Fondamenti
    di Informatica Moderna” – ARACNE 出版），并在 2015 年写了《Java Web编程》（意大利版 –“Programmazione
    per il Web” – ARACNE 出版）。


    联系方式：


    moderninformatics75@gmail.com


    it.linkedin.com/in/lucianomanelli


    # 前言


    本书是《Java Web编程》（意大利版 –“Programmazione per il Web” – ARACNE 出版）中第六章（使用 Java 和 Eclipse
    开发 Web 应用）的精简版。


    本书是为学生和专业人士编写的，可以作为任何开始学习 Java Web 应用人员的起点。本文将使用 Java，因为它是免费的、标准的，且网络上有许多（免费的）库。我们将在
    MySQL 中创建数据库，并使用 Eclipse 实现开发 Web 应用的所有步骤，以清晰简单的方式分析许多问题，为开发复杂应用程序提供原则。首先，我们需要下载必要的（免费）软件：


    - Eclipse MARS；

    - MySQL；

    - MySQL 驱动；

    - Tomcat 8.0。


    跟读本论文只需要在算法、编程、Java、HTML 和数据库方面具备基础技能。


    我认为每个人都应该始终追求自己的梦想并为之奋斗


    Luciano Manelli, “Fondamenti di Informatica Moderna”, ARACNE, 2014.


    # 1. 目录


    - 目录

    2. 引言

    2.1 MVC – 模型-视图-控制器

    2.2 Web 应用、Servlet 和 JSP

    3. 如何安装和配置 MySQL 5.6 社区版

    4. Web 应用的数据库分析、设计与实现

    4.1 如何为 Web 应用创建 MySQL 数据库

    4.2 MySQL 逻辑模式和数据库逆向工程

    5 如何配置 Eclipse MARS (JDK 和 Tomcat)

    5.1 如何在 Eclipse 中配置 JDK

    5.2 如何在 Eclipse 中配置 Tomcat 8.0

    6 如何在 Eclipse 中创建动态 Web 项目

    6.1 如何在 Eclipse 中创建 Servlet 3.X 并运行项目

    6.2 如何在 Eclipse 中创建 Servlet 3.X

    6.3 如何在 Eclipse 中创建类

    7 Web 应用的 Java 项目实现

    7.1 如何编写和管理表单；Eclipse Java 项目在浏览器中运行

    7.2 JavaBean

    7.3 请求重定向 (Redirect) 与 调度器 (Dispatcher)

    7.4 请求 (Request) 与会话 (Session)

    7.5 连接 MySQL 数据库、提交与回滚

    7.6 Java Web 应用中的错误处理示例

    8 准备好在 Tomcat 上发布的 Web 应用

    9 结论

    10. 参考文献

    11. 图表索引


    # 2 引言


    Web 应用的研究在 Web 编程中起着最重要的角色，它可以被认为是公司技术的基石。事实上，私营和政府公司的所有现代技术都基于自动化系统，这既体现在降低成本（服务器上的一个应用程序的成本低于每台个人
    PC 上的 n 个应用程序），也体现在互联网、内网和外网公司网站的信息共享上。


    本文的目的是学习如何使用 Java 技术搭建 Web 项目。我们之所以使用 Java，是因为它是免费的、标准的，而且网络上有许多（免费）库。我们将在 MySQL
    中创建数据库，并使用 Eclipse 实现开发 Web 应用的所有过程，以清晰简单的方式分析许多问题，为开发复杂应用程序提供原则。首先，我们需要下载必要的（免费）软件：


    - Eclipse MARS；

    - MySQL；

    - MySQL 驱动；

    - Tomcat 8.0。


    跟读本论文只需要在算法、编程、Java、HTML 和数据库方面具备基础技能。


    # 2.1 MVC – 模型-视图-控制器


    应用程序开发中最常用的模式是 MVC（模型-视图-控制器）。该模式由施乐公司在 90 年代后期的几份出版物中首次描述。最重要的方面是将其分为三个不同的组件：


    - 模型 (Model)：与应用程序逻辑和数据操作的持久化有关；

    - 视图 (View)：与呈现有关，即与最终用户的界面；

    - 控制器 (Controller)：与请求处理有关。


    这种级别的分离对于应用程序的稳定性和安全性都是重要的。


    # 2.2 Web 应用 Servlet 和 JSP


    一个 Web 应用由 Servlet、html/xhtml 和 jsp 页面、类和其他组件组成，这些组件可以安装并运行在容器（应用程序服务器）内部，该容器提供了
    JVM（Java 虚拟机）。Web 应用通过文件系统上的分级目录进行映射，并通常导出为 jar 或 ear。假设我们的项目根文件夹为 company_management，它将部署到
    Tomcat 的 webapps 目录下。根目录下可能还有其他目录，包括 WEB-INF 目录（仅应用程序服务器可访问），它包含 web.xml、编译后的类文件夹和库文件夹。


    我们将使用 Tomcat 作为 Web 服务器：它能够处理最新版本的 Servlet（从 2.5 到 3.1）和 JSP 页面（以及 EJB 或 Struts
    和 Web Services Axis 等框架）。


    JSP（Java 页面）技术允许我们轻松创建 html/xhtml 页面，这些页面同时具有静态和动态组件（Servlet 的抽象）。Java 中的动态代码包含在
    <% %> 中，并在向客户端发送响应之前进行预编译。


    Servlet 是 Java 类，运行在 Servlet 容器（例如 Tomcat 或 JBoss）中并作为 Web 资源暴露。这些类处理来自 html 表单的数据，并处理一个或多个客户端的请求和响应。3.x
    标准（Java EE 标准）是 Servlet 规范（JSR 315）的最新版本。Servlet 对应 MVC 架构中的控制器，实现了许多复杂的功能。我们可以使用单个
    Servlet 来处理不同的行为，也可以为每个行为使用多个 Servlet。我们在文中将使用呈现不同行为的单个 Servlet。


    简而言之，客户端向 Servlet（在 Web 应用服务器中）发送请求，Servlet 被实例化（仅在第一次），启动一个线程来处理通信并构建响应发送给客户端；如果
    Servlet 已经加载，它将为该客户端创建一个额外的线程。Servlet 内部没有算法代码，而是委托给其他类。请求和响应由 javax.servlet.HttpServletRequest
    接口（从客户端环境获取信息）和 javax.servlet.HttpServletResponse 接口（向客户端发送响应）管理。另一个组件（javax.servlet.ServletContext）允许查找应用程序上下文的引用。


    Servlet 的生命周期由以下元素和方法描述：


    - 初始化 Servlet（init 方法），由 Servlet 引擎调用，仅一次；

    - 处理 POST 请求（doPost(HttpServletRequest req, HttpServletResponse response) 方法）；

    - 处理 GET 请求（doGet(HttpServletRequest req, HttpServletResponse response) 方法）；

    - 销毁 Servlet 上下文（destroy 方法）。


