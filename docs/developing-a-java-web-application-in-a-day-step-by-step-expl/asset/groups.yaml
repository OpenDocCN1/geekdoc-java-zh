    # Developing a Java Web Application in a Day


    Step by step explanations with Eclipse Mars, Tomcat and MySQL


    Luciano Manelli


    ![](img/112513ff21bfadb0111c509b6257bbec_0_0.png)


    # Copyright – 2016 Luciano Manelli

    All rights reserved


    # Author


    Luciano Manelli was born in 1975 in Taranto (Italy). He graduated in Electronic
    Engineering at the Polytechnic of Bari at 24 years of age and then he served as
    an officer in the Navy. In 2012, he received a PhD in Computer Science from the
    Department of Informatics, University of Bari - Aldo Moro. In the PhD, he analyzed
    Grid Computing and published the results in international publications. He is
    contract Professor at the Polytechnic of Bari (Course: Foundations of Computer
    Science), and at the University of Bari - Aldo Moro (Course: Programming for Web).
    The author has fifteen years'' experience, working in the field of computer science
    and information systems and he has also experiences about the subject at Polytechnic
    of Bari, at University of Bari – Aldo Moro and at professional courses. He is
    professionally certified engineer, and in 2014 he started working for the Taranto
    Port Authority, after working for 13 years for InfoCamare SCPA. He wrote the book
    “Fundamentals of Modern Information Technology” (Italian Edition – “Fondamenti
    di Informatica Moderna” – publisher ARACNE) in 2014 and the book “Web Programming
    in Java” (Italian Edition – “Programmazione per il Web” – publisher ARACNE) in
    2015.


    Contacts:


    moderninformatics75@gmail.com


    it.linkedin.com/in/lucianomanelli


    # Preface


    This is a condensed version of Chapter VI (Web Application with Java and Eclipse)
    from the book “Web Programming in Java” (Italian Edition – “Programmazione per
    il Web” – publisher ARACNE.


    This book has been written for students and for the professional, and it can serve
    as a starting point for anyone who is beginning the study of Web Application in
    Java for the first time. In the following text, Servlet, JSP, JavaBean and simple
    DAO are accurately analyzed and implemented in Java, with a clear project evolution:
    from the configuration of Eclipse Mars, JDK, MySQL and Tomcat to the execution
    and the testing on a browser and the creation of the final package for the distribution
    on other machines. Everything is integrated with explanations, java codes and
    screenshots to have a step by step evolution of the web application. Let us try
    to do this in a day!


    I think that everyone has to always follow their own dreams and fight for them


    Luciano Manelli, “Fondamenti di Informatica Moderna”, ARACNE, 2014.


    # 1. Index


    - Index

    2. Introduction

    2.1 MVC – Model View Controller

    2.2 Web Application, Servlet and JSP

    3. How to install and configure MySQL 5.6 Community

    4. Database Analysis, Design and Implementation for Web Application

    4.1 How to create a MySQL Data Base for Web Application

    4.2 MySQL Logical Schema and Reverse Engineer DataBase

    5. How to configure Eclipse MARS (JDK and Tomcat)

    5.1 How to configure JDK in Eclipse

    5.2 How to configure Tomcat 8.0 in Eclipse

    6. How to create a Dynamic Web Project in Eclipse

    6.1 How to create a Servlet 3.X and run a project in Eclipse

    6.2 How to create a Servlet 3.X in Eclipse

    6.3 How to create a Class in Eclipse

    7. Implementation of the Java Project for Web Application

    7.1 How to write and manage forms; the Eclipse Java Project runs on a browser

    7.2. JavaBean

    7.3 Request Redirect vs Dispatcher

    7.4 Request vs Session

    7.5 Connection to MySQLDataBase, Commit and Roll-Back

    7.6 Examples of error handling in java Web Application

    8. Web Application ready for the distribution on Tomcat

    9. Conclusion

    10. Bibliography

    11. Index of Figures


    # 2 Introduction


    The study of web application plays the most important role in web programming
    and it can be considered the cornerstone of companies’ technology. In fact, all
    the modern technology both in private and government companies is based on automation
    systems, both in terms of lower costs (one application on a server costs less
    than n applications on individual PCs) and in terms of sharing information in
    internet, intranet and extranet companies’ web site.


    The aim of this text is to learn how to set up a web project in Java technology.
    We shall use Java because it is free, standard and there are many (free) libraries
    on the web. We shall create the database in MySQL, and implement all the procedures
    to develop a web application using Eclipse, analyzing many issues in a clear and
    simple way, providing the principles for developing complex applications. We first
    need to download the necessary (free) software:


    - Eclipse MARS;

    - MySQL;

    - Driver MySQL;

    - Tomcat 8.0.


    To follow this dissertation is only necessary to have minimum skills on algorithms,
    programming, java, html and database.


    # 2.1 MVC – Model View Controller


    The more used pattern in application development is the MVC (Model-View-Controller).
    This pattern was described by Xerox, for the first time, in several publications
    in the late 90s. The most important aspect is the separation into three distinct
    components:


    - Model: it is related to the application logic and persistence of data manipulation;

    - View: it is related to the presentation, that is the interface with the end
    user;

    - Controller: it is related to the processing of requests.


    This level of separation is important both for reasons of stability and security
    of the application.


    # 2.2 Web Application Servlet and JSP


    A Web Application consists of a Servlet, pages html/xhtml and jsp, classes, and
    other components, which can be installed and run inside a container (Application
    Server), which presents a JVM (Java Virtual Machine). A web application is mapped
    through a hierarchy of directories on the file system and usually exported as
    jar or ear. Assuming that the root folder of our project is company_management,
    it will be deployed to the webapps directory of Tomcat. In the root may be other
    directories, including the WEB-INF directory (accessible only by the application
    server), which contains the web.xml, the compiled classes folder, and the libraries
    folder.


    We shall use Tomcat as Web Application Server: it is able to handle the latest
    versions of the Servlet (from 2.5 to 3.1) and JSP pages (also EJB, or frameworks
    as Struts and Web Services Axis).


    JSP (Java Server Page) technology allows us to easily create html/xhtml pages,
    which have both static and dynamic components (abstraction of servlets). The dynamic
    code in Java is contained in <% %> and precompiled before sending the response
    to the client.


    Servlets are Java classes, which run in Servlet Container (e.g. Tomcat or JBoss)
    and are exposed as web resources. These classes process data from the html form
    and handle requests and responses for one or more clients. The 3.x standard (in
    Java EE standard) is the latest version of the Servlet specifications (JSR 315).
    A servlet corresponds to the Controller in the MVC architecture, and it implements
    many complex functionality. We can use a single servlet to handle different behaviors
    or many servlet for each behavior. We shall use in the text a single Servlet,
    which presents different behaviors.


    Briefly, a client sends a request to a servlet (in a web application server),
    the Servlet gets instantiated (only the first time), starts a thread to handle
    the communication and builds the response which is forwarded to the client; if
    the Servlet has already been loaded, it will create an additional thread associated
    to the client. The Servlet has no algorithmic code inside, but it is delegated
    to other classes. Request and Response are managed by the interfaces javax.servlet.HttpServletRequest
    (which obtains information from the client environment) and javax.servlet.HttpServletResponse
    (which sends response to the client). Another component (javax.servlet.ServletContext)
    allows to find the reference to the context of an application.


    Servlets have a life-cycle characterized by the following elements and methods:


    - initialization of the servlet (method init()), called, only the first time,
    from the Servlet Engine;

    - response to POST requests (method doPost(HttpServletRequest req, HttpServletResponse
    response));

    - response to GET requests (method doGet(HttpServletRequest req, HttpServletResponse
    response));

    - destruction of the servlet context (method destroy()).

