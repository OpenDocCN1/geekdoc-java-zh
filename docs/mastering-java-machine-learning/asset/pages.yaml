- pgno: 400
  md: '# Business problem


    Image classification is a particularly attractive test-bed to evaluate deep learning
    networks. We have previously encountered the MNIST database, which consists of
    greyscale images of handwritten digits. This we will show how unsupervised and
    supervised deep learning techniques can be used to learn from the same dataset.
    The MNIST dataset has 28-by-28 pixel images in a single channel. These images
    are categorized into 10 labels representing the digits 0 to 9. The goal is to
    train on 60,000 data points and test our deep learning classification algorithm
    on the remaining 10,000 images.


    # Machine learning mapping


    This includes supervised and unsupervised methods applied to a classification
    problem in which there are 10 possible output classes. Some techniques use an
    initial pre-training stage, which is unsupervised in nature, as we have seen in
    the preceding sections.


    # Data sampling and transformation


    The dataset is available at: https://ann.lecun.com/exdb/mnist


    In the experiments in this case study, the MNIST dataset has been standardized
    such that pixel values in the range 0 to 255 have been normalized to values from
    0.0 to 1.0. The exception is in the experiment using stacked RBMs, where the training
    and test data have been binarized, that is set to 1 if the standardized value
    is greater than or equal to 0.3 and 0 otherwise. Each of the 10 classes is equally
    represented in both the training set and the test set. In addition, examples are
    shuffled using a random number seed supplied by the user.


    # Feature analysis


    The input data features are the greyscale values of the pixels in each image.
    This is the raw data and we will be using the deep learning algorithms to learn
    higher-level features out of the raw pixel values. The dataset has been prepared
    such that there are an equal number of examples of each class in both the training
    and the test sets.'
  merge: -1
  img_proc: true
