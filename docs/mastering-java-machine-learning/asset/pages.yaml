- pgno: 67
  md: '# Formal description and notation


    We would like to introduce some notation and formal definitions for the terms
    used in supervised learning. We will follow this notation through the rest of
    the book when not specified and extend it as appropriate when new concepts are
    encountered. The notation will provide a precise and consistent language to describe
    the terms of art and enable a more rapid and efficient comprehension of the subject.


    +   * **Instance**: Every observation is a data instance. Normally the variable
    X is used to represent the input space. Each data instance has many variables
    (also called features) and is referred to as $x$ (vector representation with dimension
    $d$ where $d$ denotes the number of variables or features or attributes in each
    instance). The features are represented as $x = (x_1, x_2, ..., x_d)$, where each
    value is a scalar when it is numeric corresponding to the feature value.


    +   **Label**: The label (also called target) is the dependent variable of interest,
    generally denoted by $y$. In **classification**, values of the label are well-defined
    categories in the problem domain; they need not be numeric or things that can
    be ordered. In **regression**, the label is real-valued.


    +   **Binary classification**, where the target takes only two values, it is mathematically
    represented as:


    $$y \in \{1,-1\\}$


    +   **Regression**, where the target can take any value in the real number domain,
    is represented as:


    $$y \in \mathbb{R}$$


    +   **Dataset**: Generally, the dataset is denoted by $D$ and consists of individual
    data instances and their labels. The instances are normally represented as set
    $\{x_1, ..., x_n\}$. The labels for each instance are represented as the set $y
    = \{y_1, y_2, ..., y_n\}$. The entire dataset is represented as paired elements
    in a set given by $D = \{(x_1, y_1), (x_2, y_2), ..., (x_n, y_n)\}$ where $x_i
    \in \mathbb{R}^d$ for real-valued features.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'Practical Approach to Real-World Supervised Learning


    # Data quality analysis


    There are limitations to what can be learned from data that suffers from poor
    quality. Problems with quality can include, among other factors, noisy data, missing
    values, and errors in labeling. Therefore, the first step is to understand the
    data before in order we may determine how to address any data quality issues.
    The outliers may noise or indicate of interesting anomalies in the population?
    Should missing data be handled same way for all features? How should sparse features
    be treated? These and other concerns themselves at the very outset.


    If we''re fortunate, we receive a cleansed, accurately labeled dataset accompanied
    by documentation describing the data elements, the data pedigree, and what if
    any transformations were already done to the data. Such a dataset would be ready
    to be split into training, validation, and test samples, using methods described
    in the section Data Sampling. However, if data is not cleansed and suitable to
    be partitioned for our purposes, we must first prepare the data in a principled
    way before sampling can begin. (The significance of partitioning the data is explained
    later in this chapter in a section dedicated to training, validation, and test
    sets).


    In the following sections, we will discuss the data quality analysis and transformation
    steps that are needed before we can analyze the features.


    # Descriptive data analysis


    The complete data sample (including training, validation, and test) should be
    analyzed and summarized for the following characteristics. In cases where the
    data is not already split into train, validate, and the task of data transformation
    needs to make sure that the samples have similar characteristics and statistics.
    This is of paramount importance to ensure that the trained model can generalize
    over unseen data, as we will learn in the section on data sampling.


    # Basic label analysis


    The first step of analysis is understanding the distribution of labels in different
    sets as well as in the data as a whole. This helps to determine whether, for example,
    there is imbalance in the distribution of the target variable, and if so, whether
    it is consistent across all the samples. Thus, the very first step is usually
    to find out how many examples in the training and test sets belong to each class.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Basic feature analysis


    The next step is to calculate the statistics for each feature, such as


    +   * Number of unique values

    * Number of missing values: May include counts grouped by different missing value
    surrogates (NA, null, ?, and so on).

    * For categorical: This counts across feature categories, counts categories by
    label category, most frequently occurring category (mode), mode by label category,
    and so on.

    * For numeric: Minimum, maximum, median, standard deviation, variance, and so
    on.


    Feature analysis gives insights that can be a useful indicator of missing values
    and noise that can affect the learning process or choice of the algorithms.


    # Visualization analysis


    Visualization of the data is a broad topic and it is a continuously evolving area
    in the field of machine learning and data mining. We will only cover some of the
    important aspects of visualization that help us analyze the data in practice.


    # Univariate feature analysis


    The goal here is to visualize one feature at a time, in relation to the label.
    The techniques used are as follows:


    # Categorical features


    Stacked bar graphs are a simple way of showing the distribution of each feature
    category among the labels, when the problem is one of classification.


    # Continuous features


    Histograms and box plots are two basic visualization techniques for continuous
    features.


    Histograms have predefined bins whose widths are either fixed intervals or based
    on some calculation to split the full range of values of the feature. The number
    of instances of data that falls within each bin is counted and the height of the
    bin is adjusted based on this count. There are variations of histograms as relative
    or frequency-based histograms, Pareto histograms, two-dimensional histograms,
    and so on; each is a slight variation of the concept and permits a different insight
    into the feature. For those interested in finding out more about these variants,
    the Wikipedia article on histograms is a great resource.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'Practical Approach to Real-World Supervised Learning


    Box plots are a key visualization technique for numeric features as they show
    distributions in percentiles and outliers.


    # Multivariate feature analysis


    The idea of multivariate feature analysis is to visualize more than one feature
    to get insights into relationships between them. Some of the well-known plots
    are explained here.


    +   - Scatter plots: An important technique for understanding the relationship
    between different features and between features and labels. Typically, two-dimensional
    scatter plots are used in practice where numeric features the dimensions. Alignment
    of data points while scattering the data points shows no correlation. It can also
    be used to identify clusters in lower dimensional space. A bubble chart is a variation
    of a scatter plot where two features form the dimensional axes and the third is
    proportional to the size of the data point, with the plot giving the appearance
    of "bubbles". Density charts help visualize even more features by introducing
    data point color, background color, and so on, to give additional insights.

    - ScatterPlot Matrix: ScatterMatrix is an extension of scatter plots where pair-wise
    scatter plots for each feature (and label) is visualized. It gives a way to compare
    and perform multivariate analysis of high dimensional data in an effective way.

    - Parallel Plots: In this visualization, each feature is linearly arranged on
    the x-axis and the ranges of values for each feature form the y axis. Each data
    element is represented as a line with values for each feature on the parallel
    axis. Class labels, if available, are used to color the lines. Parallel plots
    offer a great understanding of features that are effective in separating the data.
    Deviation charts are variations of parallel plots, where instead of showing actual
    data points, mean and standard deviations are plotted. Andrews plots are another
    variation of parallel plots where data is transformed using Fourier series and
    the function values corresponding to each is projected.


    # Data transformation and preprocessing


    In this section, we will cover the broad topic of data transformation. The main
    idea of data transformation is to take the input data and transform it in careful
    ways so as to clean it, extract the most relevant information from it, and turn
    it into a usable form for further analysis and learning. During these transformations,
    we must only use methods that are designed while keeping in mind not to add any
    bias or artifacts that would affect the integrity of the data.


    [ 34 ]'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Feature construction


    In the case of some datasets, we need to create more features from features we
    are already given. Typically, some of aggregation is done using common aggregators
    such as average, sum, minimum, or maximum to create additional features. In financial
    fraud detection, Fraud datasets usually contain transactional behaviors of accounts
    over various time periods during which the accounts were active. Performing behavioral
    synthesis such as capturing the "Sum of Amounts when a Debit transaction occurred,
    for each Account, over One Day" is an example of feature construction that adds
    a new dimension to the dataset, built from existing features. In general, designing
    new features that enhance the predictive power of the data requires domain knowledge
    and experience with data, making it as much as an art as a science.


    # Handling missing values


    In real-world datasets, many features have missing values. In some cases, they
    are missing due to errors in measurement, lapses in recording, or because they
    are not available due to various circumstances; for example, individuals choose
    not to disclose age or occupation. Why about missing values at all? One extreme
    and not uncommon way to deal with it is to ignore the records that have any missing
    features, in other words, retain only those that are "whole". This approach may
    severely reduce the size of the dataset when missing features are widespread in
    the data. As we will see later, if the system we are dealing with is complex,
    dataset size can afford us advantage. Besides, there is often predictive value
    that can be exploited in the "un-whole" records, as long as we use appropriate
    measures to deal with the problem. On the other hand, one may unwittingly be throwing
    out key information when the omission of the data itself is significant, as in
    the case of deliberate misrepresentation or obfuscation on a loan application
    by withholding information that could be used to conclusively establish bone fides.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Practical Approach to Real-World Supervised Learning


    Suffice it to say, that an important step in the learning process is to adopt
    some systematic way to handle missing values and understand the consequences of
    the decision in each case. There are algorithms such as Naive Bayes that are less
    sensitive to missing values, but in general, it is good practice to handle these
    missing values as a pre-processing step before any form of analysis is done on
    the data. Here are some of the ways to handle missing values.


    +   * **Replacing by means and modes**: When we replace the missing value of a
    continuous feature with the mean value of that feature, the new mean clearly remains.
    But if the mean is heavily influenced by outliers, a better approach is to use
    the mean after dropping the outliers from the calculation, or use the median or,
    instead. Likewise, when a feature is sparsely represented in the dataset, the
    mean value may not be meaningful. In the case of features with categorical values,
    replacing the missing value with the one that occurs with the highest frequency
    in the sample makes for a reasonable choice.

    * **Replacing by imputation**: When we imput a missing value, we are in effect
    constructing a classification or regression model of the feature and making a
    prediction on the other features in the record in order to classify or estimate
    the missing value.

    * **Nearest Neighbor imputation**: For missing values of a categorical feature,
    we consider the feature in question to be the target and train a KNN model with
    k taken to be the known number of distinct categories. This model is used to predict
    the missing values. (A KNN model is non-parametric and assigns a value to the
    "incoming" data instance based on a function of its neighbors – the algorithm
    is described later in this chapter when we talk about non-linear models).

    * **Regression-based imputation**: In the case of continuous value variables,
    we use linear models like Linear Regression to estimate the missing data – the
    principle is the same as for categorical values.

    * **User-defined imputation**: In many cases, the most suitable value for imputing
    values must come from the problem domain. For instance, a pH value of 7.0 is neutral,
    higher is basic, and lower is acidic. It may make most sense to imput a neutral
    value for pH than either mean or median, and this insight is an instance of a
    user-defined imputation. Likewise, in the case of substitution with normal body
    temperature or resting heart rate – all are examples from medicine.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Outliers


    Handling outliers requires a lot of analysis. Outliers can be noise or errors
    in the data, or they can be anomalous behavior of particular interest. The latter
    case is treated in *Chapter 3, Unsupervised Machine Learning Techniques*. Here
    we assume the former case, that the domain expert is satisfied that the values
    are indeed outliers in the first sense, that is noise, or erroneously acquired
    or recorded data that needs to be handled appropriately.


    Following are different techniques in detecting outliers in the data


    +   * **Interquartile Ranges (IQR):** Interquartile ranges are a measure of variability
    in the data or, equivalently, the statistical dispersion. Each numeric feature
    is sorted by value in the dataset and the ordered set is then divided into quartiles.
    The median value is generally used to measure central tendency. IQR is measured
    as the difference between upper and lower Q3-Q1. The outliers are generally considered
    to be data values above Q3+1.5 * IQR and below Q1-1.5 * IQR.


    +   * **Density-based methods:** Density-based methods calculate the proportion
    of data points within a given distance D, and if the proportion is less than the
    specified threshold p, it is considered an outlier. The parameter p and D are
    considered user-defined values; the challenge of selecting these values appropriately
    presents one of the main hurdles in using these methods in the preprocessing stage.


    +   * **Mathematical transformation of feature:** With non-normal data, comparing
    the mean value is highly misleading, in the case when outliers are present. Non-parametric
    statistics allows us to make meaningful observations about highly skewed data.
    Transformation of such values using the logarithm or square root function tends
    to normalize the data in many cases, or make them more amenable to statistical
    tests. These transformations alter the shape of the distribution of the feature
    drastically—the more extreme an outlier, the greater the effect of the log transformation,
    for example.'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'Practical Approach to Real-World Supervised Learning


    +   **Handling outliers using robust statistical algorithms in machine learning
    models:** Many classification algorithms which we discuss in the next section
    on modeling, implicitly or explicitly handle outliers. Bagging and Boosting variants,
    which are meta-learning frameworks, are generally resilient to outliers or noisy
    data points and may not need a preprocessing step to handle them.


    +   **Normalization:** Many algorithms—distance-based methods are a case in point—are
    very sensitive to the scale of the features. Preprocessing the numeric features
    makes sure that all of them are in a well-behaved range. The most well-known techniques
    of normalization of features are given here:


    +   **Min-Max Normalization:** In this technique, the range $[L_i, U_i]$, which
    is typically $[0,1]$, each feature with value $x$ is normalized in terms of the
    minimum and maximum values, $x_{max}$ and $x_{min}$, respectively, using the formula:


    ```

    $x'' = \frac{(x - x_{min})}{x_{max} - x_{min}} * (U - L) + L$

    ```


    +   **Z-Score Normalization:** In this technique, also known as standardization,
    the feature values get auto-transformed so that the mean is 0 and standard deviation
    is 1. The technique to transform is as follows: for each feature $f$, the mean
    value $\mu(f)$ and standard deviation $\sigma(f)$ are computed and then the feature
    with value x is transformed as as:


    ```

    $x'' = \frac{(x - \mu(f))}{\sigma(f)}$

    ```


    # Discretization


    Many algorithms can only handle categorical values or nominal values to be effective,
    for example Bayesian Networks. In such cases, it becomes imperative to discretize
    the numeric features into categories using either supervised or unsupervised methods.
    Some of the techniques discussed are:


    +   **Discretization by binning:** This technique is also referred to equal width
    discretization. The entire scale of data for each feature $f$, ranging from values
    $x_{max}$ and $x_{min}$ is divided into a predefined number, $k$, of equal intervals,
    having the width $w = \frac{(x_{max} - x_{min})}{k}$


    [ 38 ]'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'The "cut points" or discretization intervals are:


    ```

    ${x_{min} + w, x_{min} + 2w, \dots, x_{min} + (k-1)w\}$

    ```


    +   **Discretization by frequency:** This technique is also referred to as frequency
    discretization. The feature is sorted and then the data is discretized into predefined
    intervals, so that each interval contains the same proportion. Both the techniques,
    discretization by binning and discretization by frequency, suffer from loss of
    information due to the predefined value of k.

    - **Discretization by entropy:** Given the labels, the entropy is calculated over
    the split points where the value changes in an iterative way, so that the bins
    of intervals are as pure or discriminating as possible. Refer to the *Feature
    evaluation techniques* section for entropy-based (information gain) theory and
    calculations.


    # # Data sampling


    The dataset may require frequent sampling order to effectively learn from the
    data. The characteristics of the data as well as the goals of the modeling exercise
    determine sampling is needed, and if so, how to go about it. Before we begin to
    learn from this data it is crucially important to create train, validate, and
    test data samples, as explained in this section.


    # # Is sampling needed?


    When the dataset is large or noisy, or skewed towards one type, the question as
    to whether sample or not to sample becomes important. The answer depends on various
    aspects such the dataset itself, the objective and the evaluation criteria for
    selecting the models, and potentially other practical considerations. In some
    situations, algorithms have scalability issues in memory and space, but work effectively
    on samples, as measured by model performance with respect to the regression or
    classification goals they are expected to achieve. For example, SVM scales as
    $O(n)$ and $O(n^2)$ in memory and training times. In other situations, the data
    is imbalanced that many algorithms are not robust enough to handle the skew. In
    the literature, the step intended to re-balance the distribution of classes in
    the original data extract by creating new training samples is also called **resampling**.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# # Undampling and oversampling


    Datasets exhibiting a marked imbalance in the distribution of classes can be said
    to contain a distinct minority class. Often, this minority class is the set of
    instances that we are especially interested in precisely because its members occur
    in such rare cases. For example, in credit fraud, less than 0.1% of the data belongs
    to fraud. This skewness is not conducive to learning after all, when we want to
    minimize the total error in classification, we give equal weight to all classes
    regardless of whether one class is underrepresented compared to another. In binary
    classification problems, we call the minority class positive class and the majority
    class as the negative class, a convention that we will follow in the following
    discussion.


    Undampling of the majority class is a technique that is commonly used to address
    skewness in data. Taking credit-fraud case as an example, we can create different
    training samples from the original dataset where each sample has all the fraud
    cases from the original dataset, whereas the non-fraud instances are distributed
    across all the training samples in some fixed ratios. Thus, in a training set
    created by this method, the majority class is now underrepresented compared to
    the skewed dataset, effectively balancing out the distribution of classes. Training
    samples with labeled positive and negative instances in ratios of, say, 1:2 to
    1:50 can be created in this way, but care must be taken that the sample of negative
    instances used have similar characteristics to the data statistics and distributions
    of the main datasets. The reason for using multiple training samples, and in different
    proportions of positive and negative instances, is so that any sampling bias may
    become present evident.


    Alternatively, we may choose to oversample the minority class. As before, we create
    multiple samples wherein instances from the minority class have been selected
    by either sampling with replacement or without replacement from the original dataset.
    When sampling without replacement, there are no replicated instances across samples.
    With replacement, some instances may be found in more than one sample. After this
    initial seeding of samples, we can produce more balanced distributions of classes
    by random sampling with replacement from within the minority class in each sample
    until we have the desired ratios of positive to negative instances. Oversampling
    can be prone to over-fitting as classification decision boundaries tend to become
    more specific due to replicated values. SMOTE (**Synthetic Minority Oversampling
    Technique**) is a technique that alleviates this problem by creating synthetic
    data points in the interstices of the feature space by interpolating between neighboring
    instances of the positive class (References [20]).'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# Stratified sampling


    Creating samples so that data with similar characteristics is drawn in the same
    proportion as they appear in the population is known as stratified sampling. In
    multi-class classification, if there are N classes in a certain proportion, then
    samples are created so that they represent each class in the same proportion as
    the original dataset. Generally, it is good practice to create multiple samples
    to train and test the models to validate biases of sampling.


    # Training, validation, and test set


    The Holy Grail of creating good classification models is to train on a set of
    good quality, representative, (training data), tune the parameters and find effective
    models (validation data), estimate the model''s performance by its behavior on
    unseen data (test data).


    The central idea behind the logical grouping is to make sure models are validated
    or tested on data that has not been seen during training. Otherwise, a simple
    “rote learner” can outperform the algorithm. The generalization capability of
    the learning must be evaluated on a dataset that is different from the training
    dataset, but comes from the same population (References [11]). The balance between
    removing too much data from training to increase the budget of validation and
    testing can result in models which suffer from “underfitting”, that is, not having
    enough examples to build patterns that can help in generalization. On the other
    hand, the extreme choice of allocating all the labeled data for training and not
    performing any validation or testing can lead to “overfitting”, that is, models
    that fit the examples faithfully and do not generalize well enough.


    Typically, in most machine learning challenges and real world problems, one is
    given a training set and test set for evaluating the performance of the models.
    In these engagements, the only question is how to validate and find the most effective
    parameters given the training set. In some cases, only the labeled dataset is
    given and you need to consider the training, validation, and testing sets to make
    sure your models do not overfit or underfit the data.'
  merge: -1
