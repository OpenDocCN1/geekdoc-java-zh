- pgno: 171
  md: '# Unsupervised evaluation


    The general technique used in evaluating outliers when the ground truth is not
    known:


    +   - Histogram of outlier scores: A visualization-based method, where outlier
    scores are grouped into predefined bins and users can select thresholds based
    on outlier counts, scores, and thresholds.

    - Score normalization and distance functions: In this technique, some form of
    normalization is done to make sure outlier algorithms that produce scores have
    the same ranges. Some form of distance or similarity or correlation method is
    used to find commonality of outliers across different algorithms. The general
    intuition here is: the more algorithms that weigh the data point as outlier, the
    higher the probability of that point actually being an outlier.


    # Real-world case study


    Here we present a case study that illustrates how to apply clustering and outlier
    techniques described in this chapter in the real world, using open-source Java
    frameworks and a well-known image dataset.


    # Tools and software


    We now introduce two new tools that were used in the experiments for this chapter:
    SMILE and Elki. SMILE features a Java API that was used to illustrate feature
    reduction using PCA, Random Projection, and IsoMap. Subsequently, the graphical
    interface of Elki was used to perform unsupervised learning—specifically, clustering
    and outlier detection. Elki comes with a rich set of algorithms for cluster analysis
    and outlier detection including a number of model evaluators to choose.


    > Find out more about SMILE at: http://haifengl.github.io/ smile/ and to learn
    more about Elki, visit http://elki.dbs.ifi.lmu.de.


