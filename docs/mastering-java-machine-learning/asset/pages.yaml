  md: "# Chapter 7\n\nAsAs we saw in the activation function description, the sigmoid\
    \ function squashes the output between the range 0 and 1. The derivative of the\
    \ sigmoid function $g'(a) = g(a)(1 - g(a))$ has a range between 0 and 0.25. The\
    \ goal of learning is to minimize the output, that is, $\\frac{\\delta f(x,y)}{\\\
    delta x} \rightarrow 0$. In general, the output error does not go to 0, so maximum\
    \ iterations; a user-specified parameter determines the quality of learning and\
    \ backpropagation of the errors.\n\nSimplifying to illustrate the effect of output\
    \ error on the input weight layer:\n\n```\n$\\frac{\\delta f(x,y)}{\\delta w1}\
    \ \\frac{\\delta f(x,y)}{\\delta output} \\frac{\\delta output}{\\delta hidden2}\
    \ \\frac{\\delta hidden2}{\\delta hidden1}$\n```\n\nEach of the transformations,\
    \ for instance, from output to hidden, involves multiplication of two terms, both\
    \ less than:\n\n```\n$\\frac{\\delta output}{\\delta hidden2} = w3 * g'(a)$\n\
    ```\n\nThus, the value becomes so small when it reaches the input layer that the\
    \ propagation of the gradient has almost vanished. This is known as the vanishing\
    \ gradient problem.\n\nA paradoxical situation arises when you need to add more\
    \ layers to make features more interesting in the hidden layers. But adding more\
    \ layers increases the errors. As you add more layers, the input layers become\
    \ 'slow to train,' which causes the output layers to be more inaccurate as they\
    \ are dependent on the input layers; further, and for the same number of iterations,\
    \ the errors increase with the number of layers.\n\nWith a fixed number of maximum\
    \ iterations, more layers and slow propagation of errors can lead to a 'local\
    \ optimum.'\n\nAnother issue with deep neural networks is the number of parameters.\
    \ Finding effective size and weights for each hidden layer and bias becomes more\
    \ challenging with the increase in the number of layers. If we increase the number\
    \ of layers, the parameters increase in polynomials. Fitting the parameters for\
    \ the data requires a large number of data samples. This can result in the problem\
    \ discussed before, that is,.\n\nIn the next few sections, we will start learning\
    \ about the building blocks of deep learning that help overcome these issues.\n\
    \n[ 325 ]"
