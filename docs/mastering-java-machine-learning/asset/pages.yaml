  md: '# Text Mining and Natural Language Processing


    The idea of training these sentences or n-grams is not only to learn the correct
    structure of the phrases, but also the right parameters for W and R. The word
    embeddings can also be projected on a lower dimensional space, such as a 2D space,
    using various linear and non linear feature reduction/visualization techniques
    introduced in Chapter 3, Unsupervised Machine Learning Techniques, which humans
    can easily visualize. This visualization of word embeddings in two dimensions
    using techniques as t-SNE discovers important information about the closeness
    of words based on semantic mapping and even clustering of words in the area, as
    shown in the following figure:


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_458_0.png)


    Figure 20: t-SNE representation of a small section of the entity mappings. Roman
    numerals and words are clustered together on the left, while semantically close
    words are clustered together on the right.


    Further extending the concepts, but Collibert and Mikolov show that the side effects
    of learning the word embeddings can be very useful in a variety of NLP tasks,
    such as similar phrase mapping (for example, W"the color is red" ≅ W"the color
    is yellow"), finding synonyms (for example, W"nailed" ≅ W"smashed"), analogy mapping
    (for example, W"man"→W"woman"→W"king"→W"queen"), and even complex relationship
    mapping (for example, W"Paris"→W"France"→W"Tokyo"→W"Japan") (References [21] and
    [22]).


    The extension of word embedding concepts towards a generalized representation
    that helps reuse the representation with various NLP problems (minor extensions)
    has been the main reason for recent successes of Deep Learning in NLP. Socher
    in his research extended the word embeddings concept to produce bilingual word
    embeddings, which is words from two different languages into a shared space (References
    [23]). By learning two language word embeddings independently of each other and
    projecting them into a same space, his work gives us interesting insights into
    word similarities across languages that can be extended for Machine Translation.
    Socher also did interesting work on projecting the images learned from CNNs with
    the word embedding in the same space for associating words with images as a basic
    classification problem (References [24]). Google, at the same time, has also been
    working on similar concepts, but at a larger scale for word-image matching and
    learning (References [26]).


