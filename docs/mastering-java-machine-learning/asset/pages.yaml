- pgno: 282
  md: '# # Analysis of stream learning results


    Based on the evaluation of the learned models from the classification, clustering,
    and outlier detection experiments, analysis reveals several interesting observations.


    Classification experiments:


    +   - Performance improves from linear to non-linear algorithms in quite a significant
    way as shown in Table 3. Linear SGD has the best performance using an accuracy
    metric of 67%, while KNN and Hoeffding Tree 82.4 to 93%. This clearly shows that
    the problem is non-linear and using a non-linear algorithm will give better performance.

    - KNN-s give good performance but come at the cost of evaluation time, as shown
    in Table 3. Evaluation time as memory are significantly higher–about two orders
    of magnitude–than the linear methods. When the model has to perform in tighter
    evaluation cycles, extreme caution in choosing algorithms such KNNs must be observed.

    - Hoeffding Trees gives the best classification rate and Kappa statistic. The
    evaluation time is also not as high as KNNs but is still in the order of seconds,
    which may or not be acceptable in any real-time stream-based applications.

    - The evaluation of naive Bayes is the lowest–though not different from SGD– and
    with the right choice of window width can give performance second to Hoeffding
    Trees. For example, at width 100, we have a classification rate of 86 with Naïve
    Bayes, which is next to 93 of Hoeffding Trees but compared to over 13 seconds,
    Naïve Bayes takes only 0.76 seconds, as shown in Table 3.

    - Keeping the window width constant, there is a clear pattern of improvement from
    linear (SGD, Naïve Bayes) to non-linear (Hoeffding Trees) to ensemble (OzaBag,
    Adwin, Hoeffding Tree) shown in Table 4. This clearly shows that in theory, the
    choice of ensembles can help reduce the errors but comes at the cost of foregoing
    interpretability in the models.

    - Table 5, when compared to Table 3 and Table 4, shows why drift protection and
    learning with automated drift detection increases robustness. Ensemble-based learning
    of OzaBag-NaïveBayes, OzaBag-HoeffdingTrees, and OzaBag-HoeffdingAdaptiveTree
    all show improvements over the non-drift protected runs as an example.'
  merge: -1
  img_proc: true
