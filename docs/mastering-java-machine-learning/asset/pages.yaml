  md: '# Restricted Boltzmann Machines


    Restricted Boltzmann Machines (RBM) is an unsupervised learning neural network
    (References [11]). The idea of RBM is to extract "more meaningful features" from
    labeled or unlabeled data. It is also meant to "learn" from the large quantity
    of unlabeled data in many domains when getting access to labeled data is costly
    or difficult.


    # Definition and mathematical notation


    In its basic form RBM assumes inputs to binary values 0 or 1 in each dimension.
    RBMs are undirected graphical models having two layers, a visible layer represented
    as $x$ and a hidden layer $h$, and connections $W$.


    RBM defines a distribution over the visible layer that involves the latent variables
    from the hidden layer. First an energy function is defined to capture the relationship
    between the visible and the hidden layers in vector form:


    ```

    $E(x,h) = -h^TWx - c^Tx - b^Th$

    ```


    In scalar form the energy function can be defined as:


    ```

    $E(x,h) = -\sum_j\sum_k W_{jk}h_jx_k - \sum_k c_kx_k - \sum_j b_j$

    ```


    The probability of the distribution is given by $p(x,h) = \exp(-E(x,h))/Z$ where
    $Z$ is called the "partitioning function", which is an enumeration over all the
    values of $x$ and $h$, which are binary, resulting in exponential terms and thus
    making it intractable!


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_363_0.png)'
