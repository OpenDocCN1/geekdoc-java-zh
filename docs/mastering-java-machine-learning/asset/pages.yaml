  img_proc: true
- pgno: 413
  md: '# Chapter 7


    Deep Autoencoders are good at learning complex latent structures in data and are
    used in unsupervised learning by employing pre-training and fine-tuning with Autoencoder
    building blocks. Deep Belief Networks (DBN) are generative models that can be
    used to create more samples. It is constructed using a directed Bayesian network
    with an undirected RBM layer on top. Overfitting in deep learning networks can
    be addressed by learning with dropouts, where some nodes in the network are randomly
    "turned off".


    Convolutional Neural Networks (CNNs) have a number of applications in computer
    vision. CNNs can learn patterns in the data translation-invariant and robust to
    linear scaling. They reduce the dimensionality of the data using convolution filters
    and pooling layers and can achieve very effective results in classification tasks.
    A case involving the classification of digital images is presented.


    When data arrives as sequences and there are temporal relationships among data,
    Recurrent Neural Networks (RNN) are used for modeling. RNNs use feedback from
    previous layers and output continuously. The problem of vanishing and exploding
    gradients in RNNs, and are addressed by several modifications to the architecture,
    such as Long Short Term Memory (LSTM) and Gated Recurrent Networks (GRU).


    In this chapter''s case study, we present the experiments done with various deep
    learning networks to learn from MNIST handwritten digit image datasets. Results
    using MLP, ConvNet, Variational Autoencoder, and Stacked RBM are presented.


    We think that deep neural networks are able to approximate a significant and representative
    sub-set of key structures that the underlying data is based on. In addition, the
    hierarchic structures of the data can be easily captured with the help of different
    hidden layers. Finally, the invariance against rotation, translation, and scale
    of images, for instance, are the key elements of the performance of deep neural
    networks. The invariance allows us to reduce the number of possible states to
    be captured by the neural network (References [19]).


