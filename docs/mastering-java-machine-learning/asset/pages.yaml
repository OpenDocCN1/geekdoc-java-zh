  md: '6. Message Passing between nodes/cliques in Junction Tree: A node in the junction
    tree, represented by clique $C_i$ multiplies all incoming messages from its neighbors
    with its own clique potential, resulting in a factor $\phi$ whose scope is the
    clique. It then thins out all except the ones onIPSET or separators $S_{ij}$ between
    $C_i$ and $C_j$, and then sends the resulting factor as a message to $C_j$.


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_307_0.png)


    Thus, the message passing reaches the tree root, the joint probability distribution
    is completed.


    # Advantages and limitations


    The advantages and limitations are as follows:


    +   - The algorithm is a theoretical upper bound on the computations that are
    related to the tree width in the junction tree.

    - Multiplication of each potential in the cliques can result in numeric overflow
    and underflow.


