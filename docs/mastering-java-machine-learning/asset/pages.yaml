  md: '# Clustering validation and evaluation


    Clustering validation and evaluation is one of the most important mechanisms to
    determine the usefulness of the algorithms (References [18]). These topics are
    broadly classified into two categories:


    +   - Internal evaluation measures: In this measures uses some form of clustering
    quality from the data employs, without any access to the ground truth.

    - External evaluation measures: In this measures uses some external information
    such as known ground truth or class labels.


    # Internal evaluation measures


    Internal evaluation uses only the clusters and data information to gather metrics
    about how good the clustering results. The applications may have influence over
    the choice of the metrics. So care must be taken in choosing the right metrics,
    algorithms, and parameters based on these considerations. Internal evaluation
    measures are based on different qualities, as mentioned here:


    +   - Compactness: Variance in the clusters measured using different strategies
    is used to give compactness values; the lower the variance, the more compact the
    cluster.

    - Separation: How well are the clusters separated from each other?


    # Notation


    Here''s a compact explanation of the notation used in what follows: dataset with
    all elements=D, number of elements=n, dimensions or features of each data element=d,
    center of entire data D=c, number of clusters=NC, i^th cluster=C_i number of data
    in the i^th cluster=n_i, center of i^th cluster=c_i variance in the i^th cluster=o(C),
    distance between two points x and y=d (x,y).'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# R-Squared


    The goal is to measure the degree of difference between clusters using the ratio
    of the sum of squares between clusters to the total sum of squares on the whole
    data. The formula is given as follows:


    ```

    $$\sum_{x\in D}\|x-c\|^2-\sum_{x\in C_i}\|x-c\|^2 / \sum_{x\in D}\|x-c\|^2$$

    ```


    # Dunn''s Indices


    The goal is to identify dense and well-separated clusters. The measure is given
    by maximal values obtained from the following formula:


    ```

    $$\min_{i} \min_{x\in C_i,y\in C_j} \frac{\min d(x,y)}{\max_{x\in C_i,y\in C_j}
    d(x,y)}$

    ```


    # Davies-Bouldin index


    The goal is to identify clusters with low intra-cluster distances and high inter-cluster
    distances:


    ```

    $$\frac{1}{NC} \sum_{i,j\neq i} \max \frac{\frac{1}{n_i}\sum_{x\in C_i} d(x,c_i)+\frac{1}{n_j}\sum_{x\in
    C_j} d(x,c_j)}{d(c_i,c_j)}$

    ```


    # Silhouette''s index


    The goal is to measure the pairwise difference of between-cluster and within-cluster
    distances. It is also used to find optimal cluster number by maximizing the index.
    The formula is given by:


    ```

    $$\frac{1}{NC} \sum_{i} \frac{1}{n_i}\sum_{x\in C_i} \frac{b(x)-a(x)}{\max[b(x)-a(x)]}$

    ```'
