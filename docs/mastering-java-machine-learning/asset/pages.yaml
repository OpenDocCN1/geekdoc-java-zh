- pgno: 350
  md: '# Multi-layer feed-forward neural network


    Historically, artificial neural networks have been largely identified by multi-layer
    feed-forward perceptrons, and so we will begin with a discussion of the primitive
    elements of the structure of such networks, how to train them, the problem of
    overfitting, and techniques to address it.


    # Inputs, neurons, activation function, and mathematical notation


    A single neuron or perceptron is the same as the unit described in the Linear
    Regression topic in Chapter 2, Practical Approach to Real-World Supervised Learning.
    In this chapter, the data instance vector will be represented by $x$ and has $d$
    dimensions, and each dimension can be represented as $x_1, x_2, \dots x_d$. The
    weights associated with each dimension are represented as a weight vector $w$
    that has $d$ dimensions, and each dimension can be represented as $w_1, w_2, \dots
    w_d$. Neuron has an extra input $b$, known as the bias, associated with it.


    Neuron pre-activation performs the linear transformation of inputs given by:


    ```

    $a(x)=b+\sum w_ix=b+w^Tx$

    ```


    The activation function is given by $g()$, which transforms the neuron input $a(x)$
    as follows:


    ```

    $h(x)=g(a(x))=g(b+\sum w_ix_i)$

    ```


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_350_0.png)'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# Multi-layered neural network


    Multi-layered neural networks are the first step to understanding deep learning
    as the fundamental concepts and primitives of multi-layered nets form the basis
    of all deep neural nets.


    # Structure and mathematical notations


    We introduce the generic structure of neural networks in this section. Most neural
    nets are variants of the structure outlined here. We also present the relevant
    notation that we will use in the rest of the chapter.


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_351_0.png)


    Figure 2. Multilayer neural network showing an input layer, two hidden layers,
    and an output layer.


    The most common supervised learning algorithms pertaining to neural networks use
    multi-layered perceptrons. The Input Layer consists of several neurons, each connected
    independently to the input, with its own set of weights and biases. In addition
    to the Input Layer, there are one or more layers of neurons known as Hidden Layers.
    The input layer neurons are connected to every neuron in the first hidden layer,
    that layer is similarly connected to the next hidden layer, and so on, resulting
    in a fully connected network. The layer of neurons connected to the last hidden
    layer is called the Output Layer.'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'Deep Learning


    Each hidden layer is represented by $h^k(x)$ where $k$ is the layer. The pre-activation
    for layer $0 < k < 1$ is given by:


    ```

    $$\mathbf{a}^k(x) = \mathbf{b}^k(x) + \mathbf{W}^k h^{k-1}(x)$

    ```


    The hidden layer activation for $1 < k \leq L$ :


    ```

    $$\mathbf{h}^k(x) = \mathbf{g}(\mathbf{a}^k(x))$

    ```


    The final output layer activation is:


    ```

    $$\mathbf{h}^{l+1}(x) = \mathbf{o}(\mathbf{a}^{l+1}(x))$

    ```


    The output is generally class per neuron and it is tuned in such a way that only
    one neuron activates and all others have 0 as the output. A softmax function with
    $\mathbf{o}(\mathbf{a}) = \text{softmax}(\mathbf{a})$ is used for giving the result.


    # # Activation functions in NN


    Some the most well-known activation functions that are used in neural networks
    are given in the following sections and they are used because the derivatives
    needed in learning can be expressed in terms of the function itself.


    # # Sigmoid function


    Sigmoid activation functions are given by the following equation:


    ```

    $g(a) = \frac{1}{1 + \exp(-a)}$

    ```


    It can be seen as a bounded, strictly increasing and positive transformation function
    that squashes the values between 0 and 1.


    # # Hyperbolic tangent ("tanh") function


    The Tanh function is given by the following equation:


    ```

    $g(a) = \tanh(a) = \frac{\exp(a) - \exp(-a)}{\exp(a) + \exp(-a)}$

    ```'
