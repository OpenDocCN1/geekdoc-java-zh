    # Deep learning with dropouts


    Another technique used to overcome the "overfitting" issues mentioned in deep
    neural networks is using the dropout technique to learn the parameters. In the
    next sections, we will define, illustrate, and explain how deep learning with
    dropouts works.


    # Definition and mathematical notation


    The idea behind dropout is to "cripple" the deep neural network structure by stochastically
    removing some of the hidden units as shown in the following figure after the parameters
    are learned. The units are set to 0 with the dropout probability generally as
    p=0.5


    The idea is similar to adding noise to the input, but done in all the hidden layers.
    When certain features (or a combination of features) are removed stochastically,
    the neural network has to learn latent features in a more robust way, without
    the interdependence of some features.


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_378_0.png)


    [ 342 ]'
  merge: -1
  img_proc: true
- pgno: 379
  md: 'Each hidden layer is represented by $h^k(x)$ where $k$ is the layer. The pre-activation
    of layer $0<k<l$ is given by:


    ```

    $$\mathbf{a}^k(x) = \mathbf{b}^k(x) + \mathbf{W}^k h^{k-1}(x)$

    ```


    The hidden layer activation for $I < k < l$. Binary masks are represented by $\mathbf{m}^l$
    at each hidden layer:


    ```

    $$\mathbf{h}^k(x) = \mathbf{g}(\mathbf{a}^k(x)) \odot \mathbf{m}^k$$

    ```


    The final output layer activation is:


    ```

    $$\mathbf{h}^{l+1}(x) = \mathbf{o}(\mathbf{a}^{l+1}(x))$

    ```


    # Inputs and outputs


    For training with dropouts, inputs are:


    +   * Network architecture

    * Training dataset

    * Dropout probability $p$ (typically 0.5)


    The output is a trained deep neural net that can be applied for predictive use.


    # How does it work?


    We will now describe the different parts of how deep learning with dropouts.


    # Learning Training and testing with dropouts


    The backward propagation learning of weights and biases from the output function
    using gradients is very similar to traditional neural network learning. The only
    difference is that masks are applied appropriately as follows:


    Compute the output gradient before activation:


    ```

    $$\nabla_{\theta^{l+1}(x)}} \log(\mathbf{f}(x)) = -(\mathbf{e}(\mathbf{y})-\mathbf{f}(x))$$

    ```'
  merge: -1
  img_proc: true
- pgno: 380
  md: 'Deep Learning


    For hidden layers k=l+1 to 1:


    Compute the gradient of hidden layer parameters:


    ```

    $$\nabla_{W_y^k} -\log(f(\mathbf{x})))_y = (\nabla_{a_y''(x)}(\log(f(\mathbf{x})))h^{k-1}(\mathbf{x}))^T$

    ```


    ```

    $$\nabla_{\mu_y} -\log(f(\mathbf{x}))_y = \nabla_{a_y''(x)}(-\log(f(\mathbf{x})))_y$

    ```


    $h^{k-1}$ computation has taken into account the binary mask $\mathbf{m}^{k-1}$
    applied.


    Compute the gradient of the hidden layer below the current:


    ```

    $$\nabla_{h^{k-1}(x)} -\log(f(\mathbf{x}))_y = \mathbf{W}^k (\nabla_{a_y''(x)}(-\log(f(\mathbf{x})))_y)^T$

    ```


    Compute the gradient of the layer below activation:


    ```

    $$\nabla_{h^{k-1}(x)} -\log(f(\mathbf{x}))_y \nabla_{a_y''(x)}h^k(\mathbf{x})$$\n=
    [\nabla_{h^{k-1}(x)}(-\log(f(\mathbf{x})))_y)] \odot [\dots, g''(a^{k-1}''\mathbf{x}_j),
    \dots] \ \odot \mathbf{m}^{k-1}$

    ```


    When testing the model, we cannot use the binary mask as it is stochastic; the
    "expectation" value of the mask is used. If the dropout probability is $p=0.5$,
    the same value 0.5 is used as the expectation for the unit at test or model application.


    # Sparse coding


    Sparse coding is another neural network used for unsupervised learning and feature
    generation (References [22]). It works on the principle of finding latent structures
    in high dimensions that capture the patterns, thus performing feature extraction
    in addition to unsupervised learning.


    [ 344 ]'
  merge: -1
  img_proc: true
- pgno: 381
  md: 'Formally, for every input $x^{(0)}$ a latent representation $h^{(0)}$ is learned,
    which has a sparse representation (most values are 0 in the vector). This is done
    by optimization using the following objective function:


    ```

    $$\min_{D} \sum_{t=1}^{T} \min \left( \frac{1}{2}|x^{(t)}\|_2^2 - D h^{(t)}\|_2^2
    + \lambda |h^{(t)}\|_0 \right)\right)$

    ```


    Where the first term $\frac{1}{2}\|x^{(t)}\|_2^2$ is to control the reconstruction
    error and the second term, which uses a regularizer $\lambda$ for sparsity control.
    The matrix **D** is also known as a Dictionary as it has equivalence to words
    in a dictionary and $h^{(0)}$ is similar to word frequency; together they capture
    the impact of words in extracting patterns when performing text mining.


    # Convolutional Neural Network


    Convolutional Neural Networks or CNNs have become prominent and are widely used
    in the computer vision domain. Computer vision involves processing images/videos
    for capturing knowledge and patterns. Annotating images, classifying/videos, correcting
    them, story-telling or describing images, and so on, are some of the broad applications
    in computer vision [16].


    Computer vision problems most generally have to deal with unstructured data that
    can be described:


    Inputs are 2D images with single or multiple color channels or 3D videos that
    are high-dimensional vectors.


    The features in these 2D or 3D representations have a well-known spatial topology,
    a hierarchical structure, and some repetitive elements that can be exploited.


    The images/videos have a large number of transformations or variants based on
    factors such as illumination, noise, and so on. The same person or car can look
    different based on several factors.'
