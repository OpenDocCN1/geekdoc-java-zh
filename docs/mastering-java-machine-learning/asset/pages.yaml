- pgno: 293
  md: "# Graph structure and properties\n\nA graph is defined as a data structure\
    \ containing nodes and edges connecting these nodes. In the context of this chapter,\
    \ the random variables are represented as nodes, and edges show connections between\
    \ the random variables.\n\nFormally, if $X = \\{X_1, X_2, \\dots, X_J\\}$ are\
    \ random variables representing the nodes, then there can be a directed edge belonging\
    \ to the set $\\varepsilon$, for example, between nodes given by $X_i \to X_j$\
    \ or an undirected edge $X_i \\leftrightarrow X_j$, and the graph is defined as\
    \ a data structure $k = (X, \\varepsilon)$. A graph is said to be a **directed\
    \ graph** when every edge in the set $\\varepsilon$ between nodes from set $X$\
    \ is directed and similarly an **undirected graph** is one where every edge between\
    \ the nodes is undirected as shown in Figure 1. Also, if there is a graph that\
    \ has both directed and undirected edges, the notation of $X_i \\leftrightarrow\
    \ X_j$ represents an edge that may be directed or undirected.\n\n![](img/2b4ec1705c1d24bfee7a5f8594a281b5_293_0.png)\n\
    \nFigure 1. $X_i$, directed, undirected, and partially-directed graphs\n\nIf a\
    \ directed edge $X_i \to X_j \\in \\varepsilon$ exists in the graph, the node\
    \ $X_i$ is called the *parent* node and the node $X_j$ is called the *child* node.\n\
    \nIn the case of an undirected graph, if there is an edge $X_i - X_j$, the nodes\
    \ $X_i$ and $X_j$ are said to be neighbors.\n\nThe set of pairs of node X in a\
    \ directed graph is the boundary of the node X and similarly, adjacent nodes in\
    \ an undirected graph form each other's boundary. The degree of the node X is\
    \ the number of edges it participates in. The indegree of the node X is the number\
    \ of edges in the directed graph that have a relationship to node X such that\
    \ the edge is between node Y and node X and $X \to Y$. The degree of the graph\
    \ is the maximal degree of the node in that graph."
  merge: -1
  img_proc: true
- pgno: 294
  md: "# # Subgraphs and cliques\n\nA subgraph is part of the graph that represents\
    \ some of the nodes from the entire set. A **clique** is a subset of vertices\
    \ in an undirected graph such that every two distinct vertices are adjacent.\n\
    \n# # Path, trail, and cycles\n\nIf there are variables $X_{i}, X_{j} \\dots X_{k}$\
    \ in the graph $K = (X, E)$, it forms a *path* if, for every $i=1, 2 \\dots k-1$,\
    \ we have $X_i \to X_j$ or $X_i - X_j$ that is, there is either a directed edge\
    \ or an undirected edge between the variables— recall this can be depicted as\
    \ $X_i \\simeq X_j$. A directed path has at least one directed edge: $X_i \to\
    \ X_{i+1}$.\n\nIf there are variables $X_{i}, X_{j} \\dots X_{k}$ in the graph\
    \ $K = (X, E)$ it forms a *trail* for every $i=1, 2 \\dots k-1$, we have $X_i\
    \ \\leftrightarrow X_j$.\n\nA graph is called **connected**, if for every $X_i\
    \ \\simeq X_j$ there is a trail between $X_i$ and $X_j$.\n\nIn a graph $K=(X,\
    \ e)$, if there is a directed path between nodes $X$ and $Y$, $X$ is called the\
    \ *ancestor* of $Y$ and $Y$ is called the *descendant* of $X$.\n\nIf a graph has\
    \ a directed path $X_{i}, X_{j} \\dots X_{k}$, where $X_i \\simeq X_k$, the path\
    \ is called a **cycle**. Conversely, a graph with no cycles is called an **acyclic**\
    \ graph.\n\n# # Bayesian networks\n\nGenerally, all Probabilistic Graphical Models\
    \ have three basic elements that form the important sections:\n\n+   - **Representation**:\
    \ This answers the question of what does the model mean or represent. The idea\
    \ is to represent and store the probability distribution $P(X_1, X_2 \\dots X_n)$.\n\
    - **Inference**: This answers the question: given the model, how do we perform\
    \ queries and estimates This gives us the ability to infer the values of the unknown\
    \ from the known evidence given the structure of the models. Motivating the main\
    \ discussion points are various forms of inferences involving trade-offs between\
    \ computational and correctness concerns.\n- **Learning**: This answers the question\
    \ of what is right the data. Learning is divided into two main parts:\n    - Learning\
    \ the parameters given the structure and data\n    - Learning the structure with\
    \ parameters given the data"
  merge: -1
  img_proc: true
