    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_142_0.png)


    Figure 2: KPCA on Circle Dataset and Inverse Transform.


    # Advantages and limitations


    +   * KPCA overcomes the nonlinear mapping presented by PCA.

    * KPCA has similar issues with outlier, noisy, and missing values to standard
    PCA. There are robust methods and variations to overcome this.

    * KPCA has scalability issues in space due to an increase in the kernel matrix,
    which can become a bottleneck in large datasets with high dimensions. SVD can
    be used in these situations, as an alternative.


    # Manifold learning


    When high dimensional data is embedded in lower dimensions that are nonlinear,
    but have complex structure, manifold learning is very effective.'
