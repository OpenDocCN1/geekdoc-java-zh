- pgno: 274
  md: '# Real-Time Stream Machine Learning


    After the task has completed running, model evaluation results can be exported
    to a CSV file.


    # Business problem


    The problem for this case study is to continuously learn from a stream of electricity
    market data and predict the direction of movement of the market price. We compare
    the accuracy and average cost of different classification methods including concept
    drift as well as the performance of clustering and outlier detection.


    # Machine learning mapping


    The dataset used in this case study can be used to illustrate classical batch-based
    supervised and unsupervised learning techniques. However, we treat it as a stream-based
    data source to show how we can employ the techniques described in this chapter
    to perform classification, clustering, and outlier detection tasks using the MOA
    framework. Within this context, we demonstrate how incremental learning can be
    achieved under assumptions of a stationary mas as an evolving data stream exhibiting
    drift.


    # Data collection


    The dataset is known as the Electricity or ELEC dataset, which was collected by
    the New South Wales Electricity Market. The prices in this market are variable,
    and are adjusted every 5 minutes based on supply and demand. This dataset consists
    of 45,312 such data points obtained every half-hour between May 1996 and December
    1998. The target is an indication of the movement of the price, whether up or
    down, relative to the 24-hour average.


    > The data file is a publicly available file in ARRF format at http://downloads.sourceforge.net/project/moa-datastream/Datasets/Classification/electNorm.arff.
    zip?r=http%3A%2F%2Fmoa.cms.waikato.ac.nz%2Fdatasets%2Fts=1483128450&use_mirror=cyranet.


    # Data sampling and transformation


    In the experiments conducted here, no data sampling is done; each example in the
    dataset is processed individually and no example is excluded. All numeric data
    elements have been normalized to a value between 0 and 1.'
