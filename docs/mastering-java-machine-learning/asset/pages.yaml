  md: '# # Support vector machines (SVM)


    SVMs, in simple terms, can be viewed as linear classifiers that maximize the margin
    between the separating hyperplane and the data by solving a constrained optimization
    problem. SVMs can even deal with data that is not linearly separable by invoking
    transformation to a higher dimensional space using kernels described later.


    # ## Algorithm inputs and outputs\SVM is effective with numeric features only,
    though most implementations handle categorical features with transformation to
    numeric or binary. Normalization is often a choice as it helps the optimization
    of the training. Outputs of SVM are class predictions. There are implementations
    that give probability estimates as confidences, but this requires considerable
    training time as they use k-fold cross-validation to build the estimates.


    # ## How does it work?


    In its linear form, SVM works similar to Linear Regression classifier, where a
    linear decision boundary is drawn between the two classes. The difference between
    the two is that with SVM, the boundary is drawn in a way that the “margin” or
    the distance between the points near the boundary is maximized. The points on
    the boundaries are known as “support vectors” (References [13 and 8]).


    Thus SVM tries to find the weight vector in linear models similar to Linear Regression
    model as given by the following:


    ```

    $G(\mathbf{x}) = b + \sum_{j} w_j x_j$$

    ```


    The weight $w_o$ is represented by $b$. SVM for a binary class $y \in [1,-1]$
    tries to find a hyperplane:


    ```

    $b + \sum_{j=1}^{d} w_j x_j = 0$$

    ```'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Practical Approach to Real-World Supervised Learning


    The hyperplane tries to separate the data points such that all points with the
    class lie on the side of the hyperplane as:


    ```

    $b + \sum_{j=1}^{d} w_j x_j \geq 0 \forall i : y = 1$

    ```


    ```

    $b + \sum_{j=1}^{d} w_j x_j \leq 0 \forall i : y = -1$

    ```


    The models are subjected to maximize the margin using constraint-based optimization
    with a penalty function denoted by C for overcoming the errors denoted by $\xi_i$:


    ```

    $\min \left( \frac{1}{2} ||\mathbf{w}||^2 + C \sum \xi_i \right)$

    ```


    Such that $y_i(\mathbf{w}, \mathbf{x} + b) \geq 1 - \xi_i \nabla\mathbf{x}$, and
    $\xi_i \geq 0$.


    They are also known as large margin classifiers for the preceding reason. The
    kernel-based SVM transforms the input data into a hypothetical feature space where
    SV machinery works in a linear way and the boundaries are drawn in the feature
    spaces.


    A kernel function on the transformed representation is given by:


    ```

    $k(\mathbf{x}_i, \mathbf{x}_j) = \Phi(\mathbf{x}_i) \cdot \Phi(\mathbf{x}_j)$

    ```


    Here $\Phi$ is a transformation on the input space. It can see that the optimization
    and solution of SVM remains the same with the only exception that the dot-product
    $\mathbf{x} \cdot \mathbf{x}$ is replaced by the kernel function $k(\mathbf{x},
    \mathbf{x})$, which is a function involving the two vectors in a different space
    without actually transforming to that space. This is known as the **kernel trick.**'
  merge: -1
  img_proc: true
