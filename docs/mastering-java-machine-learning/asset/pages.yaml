  md: '# Pooling or subsampling


    Pooling or subsampling works on the stack of filtered images to further shrink
    the image or compress it, while keeping the pattern as-is. The main steps carried
    out in pooling are:


    +   1. Pick a window size (for example, 2 X 2) and a stride size (for example,
    2).

    2. Move the window over all the filtered images at stride.

    3. At each window, pick the "maximum" value.


