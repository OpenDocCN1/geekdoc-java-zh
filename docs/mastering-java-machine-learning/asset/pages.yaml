    # # Topics in text mining


    As we saw in the first section, the area of text mining and performing Machine
    Learning on texts spans a wide range of topics. Each topic discussed has some
    customizations to the mainstream algorithms, or there are specific algorithms
    that have been developed to perform the task called for in that area. We have
    chosen four broad topics, namely, text categorization, topic modeling, text clustering,
    and named entity recognition, and will discuss each in detail.


    # ## Text categorization/classification


    The text classification problem manifests itself in different applications, such
    as document filtering and organization, information retrieval, opinion and sentiment
    mining, e-mail spam filtering, and so on. Similar to the classification problem
    discussed in Chapter 2, Practical Approach to Real-World Supervised Learning,
    the general idea is to train on the training data with labels and to predict the
    labels of unseen documents.


    [ 403 ]'
  merge: -1
  img_proc: true
- pgno: 440
  md: '# Text Mining and Natural Language Processing


    As discussed in the previous section, the preprocessing steps help to transform
    the unstructured document collection into well-known numeric or categorical/binary
    structured data arranged in terms of a document-term matrix. The choice of performing
    some preprocessing steps, such as stemming or customizing stop words, depends
    on the data and applications. The feature choice is generally basic lexical features,
    n-grams of words, and only in certain cases do we use the entire text as a string
    without breaking it into terms or tokens. It is common to use binary representation
    or frequency-based representation for document-term structured data. Once this
    transformation is complete, we do feature selection using univariate analysis,
    such as information or g-square, to choose discriminating features above certain
    thresholds of scores. One may also perform transformation and dimensionality reduction
    such as LDA in many applications.


    There is a wide range in the choice of classifiers that we get structured data
    from the preceding process. In the research as well as in commercial applications,
    we use the most of the common modeling techniques, including linear (linear regression,
    logistic regression, and so on), non-linear (SVM, neural networks, KNN, generative
    (naive bytes, bayesian networks), interpretable (decision trees, rules), and ensemble-based
    (bag, boosting, random forest). Many algorithms use similarity or distance metrics,
    where cosine distance is the most popular choice. In certain classifiers, such
    as SVM, the string representation of the document can be used as, with the right
    choice of string kernels and similarity-based metrics on strings to compute the
    dot products.


    Validation and evaluation methods are similar to supervised classification methodologies–splitting
    the data into train/validation/test, training on training data, tuning parameters
    of algorithm(s) on validation data, and estimating the performance of the models
    on hold-out or test data.


    Since most of text classification involves a large number of documents, and the
    target classes are rare, the metrics used for evaluation, tuning, or choosing
    algorithms are in most cases precision, recall, and F-score measure, as follows:


    ```

    precision(p) = \frac{Count(\{\text{relevant} \cap \ \text{retrieved}\})}{Count(\{\text{retrieved}\})}\nrecall(r)
    = \frac{Count(\{\text{relevant} \cap \ \text{retrieved}\})}{Count(\{\text{relevant}\})}\nF-score
    = \frac{2}{precision+1/ recall}

    ```'
  merge: -1
  img_proc: true
- pgno: 441
  md: '# Topic modeling


    A topic is a distribution over a fixed vocabulary. Topic modeling can be defined
    as an ability to capture different core ideas or themes in various documents.
    This has a wide range of applications, such as the summarization of documents,
    understanding reasons for sentiments, trends, the news, and many others. The following
    figure shows how topic modeling can discern a user-specified number k of topics
    from a corpus and then, for every document, assign proportions representing how
    much of each topic is found in the document:


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_441_0.png)


    There are quite a few techniques for performing topic modeling using supervised
    and unsupervised learning in the literature (References [13]). We will discuss
    the most common technique known as probabilistic latent semantic index (PLSI).


    # Probabilistic latent semantic analysis (PLSA)


    The idea of PLSA, as in the LSA for feature reduction, is to find latent concepts
    hidden in the corpus by discovering the association between co-occurring terms
    and treating the documents as mixtures of these concepts. This is an unsupervised
    technique, similar to dimensionality reduction, but the idea is to use it to model
    the mixture of topics or latent concepts in the document (References [12]).'
  merge: -1
  img_proc: true
- pgno: 442
  md: 'Text Mining and Natural Language Processing


    As shown in the following figure, the model may associate terms occurring together
    often in the corpus with a latent concept, and each document can then be said
    to exhibit that to a smaller or larger extent:


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_442_0.png)


    Figure 14: Latent concept of Baseball capturing the association between documents
    and related terms


    # Input and output


    The inputs are:


    +   A collection of documents following a certain format and structure. We will
    give the notation:


    ```

    c = \{d_1, d_2, \dots d_n\}$

    ```


    +   The number of topics that need to be modeled or discovered as $k$.


    The output is:


    +   $k$ topics identified T = $[T_1, T_2 \dots T_k]$.

    For each document, coverage of the topic given in the document $d$ can be written
    as $[\pi_{d1}, \pi_{d2} \dots \pi_{dn}]$, where $\pi_{di}$ is the probability
    of the document $d_i$ covering the topic $T_j$.


    # How does it work?


    Implementations of PLSA generally follow the steps described previously, such
    as tokenization, stop words removal, stemming, dictionary of words formation,
    feature extraction (unigrams or n-grams, and so on), and feature selection (unsupervised
    techniques) are carried out, if necessary.


    +   1. Basic preprocessing steps as discussed previously, such as tokenization,
    stop words removal, stemming, dictionary of words formation, feature extraction
    (unigrams or n-grams, and so on), and feature selection (unsupervised techniques)
    are carried out, if necessary.'
  merge: -1
  img_proc: true
- pgno: 443
  md: "2. The problem can be reduced to estimating the distribution of terms in a\
    \ document, and, given the distribution, choosing the topic based on the maximum\
    \ terms corresponding to the topic.\n\n3. Introducing a \"latent variable\" $z$\
    \ helps us to select whether the term belongs to a topic. Note that $z$ is not\
    \ \"observed\", but we assume that it is related to picking the term from the\
    \ topic. Thus, the probability of the term $t$ given the document $d$ can be expressed\
    \ in terms of this latent variable:\n\n```\n$$p(t|d) = \\sum_{z} p(t|z)p(z|d)$$\n\
    ```\n\n4. By using two sets of variables $(\theta, n)$, the equation can be written\
    \ as:\n\n```\n$$p(t|d) = \\sum_{z} p(t|z;theta)p(d;\\pi)$$\n```\n\nHere, $p(t|z;theta)$\
    \ is the probability of latent concepts in concepts and $p(z|d;n)$ is the probability\
    \ of latent concepts in document-specific mixtures.\n\n5. Using log-likelihood\
    \ to estimate the parameters to maximize:\n\n```\n$$l(\\theta,\\pi;N) = \\sum_{d,t}count(d,t)log\\\
    sum_{z} p(t|z;theta)p(z|d;\\pi)$$\n```\n\n6. Since this equation involves nonconvex\
    \ optimization, the EM algorithm is often used to find the parameters iteratively\
    \ iteratively until convergence is reached or the total number of iterations are\
    \ completed (References [6]):\n\n+   1. The E-step of the EM algorithm is used\
