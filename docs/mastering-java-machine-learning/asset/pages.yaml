    # Methods for learning structures


    We will discuss a few algorithms that are used for learning structures in this
    section;

    details can be found here (References [15]).


    # Constraint-based techniques


    Constraint-based algorithms use independence tests of various variables, trying
    to\find different structural dependencies that we discussed in previous sections
    such

    as the d-separation, v-structure, and so on, by following the step-by-step process

    discovered here.


    # Inputs and outputs


    The input is the dataset D with all variables $\{X,Y,...\}$ known for every instance

    $[1,..,m]$, and no missing values. The output is a Bayesian network graph G with
    all

    edges, directions in E and the CPT table.


    # How does it work?


    +   1. Create an empty set of undirected edge.

    2. Test for conditional independence between two variables independent of

    edges to have an edge.


    +   1. If all subset $S = U - \{X, Y\}$, if $X$ is independent of $Y$, then add
    it to

    the set of undirected edge $E''$.


    +   3. Once all potential undirected edges are identified, directionality of the
    edge

    inferred from the set $E''$.


    +   1. Considering a triplet $\{X, Y, Z\}$, if there is an edge $X - Z$ and $Y
    - Z$, but

    no edge between $X - Y$ using all variables in the set, and if,

    X is not independent of $Y$ given all the edges $S = U - \{X, Y, Z\}$, this

    implies the direction of $X \rightarrow Y$ and $Y \rightarrow Z$.


    +   2. Add the edges $X \rightarrow Y$ and $Y \rightarrow Z$ to set $E$.


    +   3. Update the CPT table using local calculations.


    +   4. Return the Bayes network G, edges E, and the CPT table.


    [— 285 ]'
