  md: 'The neighborhood size is defined in the way that it it decreases with time
    using some well-known decay functions such as an exponential, function defined
    as follows:


    ```

    $\sigma(t) = \sigma_0 \exp\left(-\frac{t}{\tau_0}\right)$

    ```


    +   **Adaptive phase:** In this phase, the weights of the winning neuron and its
    neighborhood neurons are updated. The update to weights is generally done using:


    $\Delta w_{ji} = \eta(t) \cdot T_{j(i)}(t) \cdot (x_i - w_{ji})$


    Here, the learning rate $n(t)$ is again defined as exponential decay like the
    neighborhood size.


    SOM Visualization using Unified Distance Matrix (U-Matrix) creates a single metric
    of average distance between the weights of the neuron and its neighbors, then
    can be visualized in different color intensities. This helps to identify similar
    neurons in the neighborhood.


    # ### Advantages and limitations


    +   - The biggest advantage of SOM is that it is easy to understand and clustering
    of the data in two dimensions with U-matrix visualization enables understanding
    the patterns very effectively.

    - Choice of similarity/distance function makes vast difference in clusters and
    must be carefully chosen by the user.

    - SOM''s computational complexity makes it impossible to use on datasets greater
    than a few thousands in size.


    # ## Spectral clustering


    Spectral clustering is a partition-based clustering technique using graph theory
    as its basis (References [15]). It converts the dataset into a connected graph
    and does graph partitioning to find the clusters. This is a popular method in
    image processing, motion detection, and some unstructured data-domains.'
