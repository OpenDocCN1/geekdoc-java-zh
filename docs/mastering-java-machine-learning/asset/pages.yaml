- pgno: 449
  md: '# Distance-based text clustering


    Most distance-based clustering algorithms rely on the similarity or the distance
    measure used to determine how apart instances are from each other in feature space.
    Normally in datasets with numeric values, Euclidean distance or its variations
    work very well. In text mining, even after converting unstructured text to structured
    features of numeric values, it has been found that the cosine and Jaccard similarity
    perform better.


    Agglomerative or Hierarchical clustering, discussed in Chapter 3, Unsupervised
    Machine Learning, are used, which can merge documents based on similarity, as
    discussed previously. Merging the documents or groups is often done using single
    link, average linkage, and complete linkage techniques. Agglomerative clustering
    also results in a structure that can be used for information retrieval and the
    searching of documents.


    The partition-based clustering techniques k-means and k-medoids accompanied by
    h suitable similarity or distance method are also employed. The issue with k-means,
    as indicated in the discussion on clustering techniques, is the sensitivity to
    starting conditions along computation space and time. k-medoids are sensitive
    to the sparse data structure and also have computation space and time constraints.


    # Non-negative matrix factorization (NMF)


    Non-negative matrix factorization is another technique used to factorize a large
    data-feature matrix into two non-negative matrices, which not only perform the
    dimensionality reduction, but are also easier to inspect. NMF has gained popularity
    for document clustering, and many variants of NMF with different optimization
    functions have now been shown to be very effective in clustering text (References
    [15]).


    # Input and output


    The inputs are:


    +   - A collection of documents following a certain format and structure given
    by the notation: $d_n$


    ```

    D = [d_1, d_2 ... d_n]

    ```


    +   - Number of clusters that need to be modeled or discovered as k.


    The output is:


    +   - k clusters identified c = [c_1, c_2 ... c_k] with documents assigned to
    the clusters.'
  merge: -1
  img_proc: true
- pgno: 450
  md: '# How does it work?


    The mathematical details and interpretation of NMF are given in the following:


    +   1. The basic idea behind NMF is to factorize the input matrix using low-rank
    approximation, as follows:


    ```

    $\mathbf{A} \approx \mathbf{W}\mathbf{H}_k$

    ```


    +   2. A non-linear optimization function is used as:


    ```

    $\min ||\mathbf{A} - \mathbf{WH}||; \mathbf{W}, \mathbf{H} \ge \mathbf{0}$

    ```


    This is convex in W or H, but not in, resulting in no guarantees of a global minimum.
    Various algorithms that use constrained squares, such as mean-square error and
    gradient descent, are used to solve the optimization function.


    +   3. The interpretation of NMF, especially in understanding the latent topics
    based on terms, it makes it very useful. The input $A_{v,n}$ of terms and documents,
    can be represented in low rank approximation as $W_{v,k}H_{k,n}$ matrices, where
    $W_{v,k}$ is the term-topic representation whose columns are basis vectors. The
    non zero elements of column 1 of W, given by $W_i$, correspond to particular terms.
    Thus, the $w$, can be interpreted as a basis vector $W$, about the terms $j$.
    The $H_j$ can be interpreted as how much the document given by doc 1 has affinity
    towards the direction of the topic vector $W_i$,


    +   4. From the paper [References [18]] it was clearly shown how the basis vectors
    obtained for the medical abstracts, known as the Medlars dataset, creates highly
    interpretable basis vectors. The highest weighted terms in these basis vectors
    directly correspond to the concept, for example, W₁ corresponds to the topic related
    to “heart” and W_i is related to “developmental disability”.'
  merge: -1
  img_proc: true
