    # Analysis of results


    Naive Bayes with supervised discretization shows relatively better performance
    than kernel estimation. This gives a useful hint that discretization, which is
    needed in most Bayes networks, will play an important role.


    The results in the table show continuous improvement when Bayes network complexity
    increases. For example, Naive Bayes with discretization assumes independence from
    all features and shows a TP rate of 84.3, the TAN algorithm where there can be
    more parents shows a TP rate of 85.9, and BN with three parents show the best
    TP rate of 86.2. This clearly indicates that a complex BN with some nodes having
    no more than three parents can capture the domain knowledge and encode it well
    to predict on unseen test data.


    Bayes network where structure is learned using search and score (with K2 with
    three parents and scoring using Bayes score) and estimation is done using simple
    estimation, performs the best in almost all the metrics of the evaluation, as
    shown in the highlighted values.'
