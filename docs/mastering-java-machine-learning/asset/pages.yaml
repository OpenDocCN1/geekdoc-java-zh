    ```

    $H(C|K) = -\sum_{k=1}^{|K|} \sum_{c=1}^{|C|} \log \frac{a_{c,k}}{N\sum_{c''=1}^{|C|}
    a_{c'',k}}$

    ```


    ```

    $H(C) = -\sum_{c=1}^{|C|} \sum_{k=1}^{|K|} \log \frac{a_{c,k}}{n\sum_{k''=1}^{|K|}
    a_{c,k''}}$

    ```


    Homogeneity is defined as:


    ```

    $h = \begin{cases} 1 & \text{if } H(C|K) = 0 \ \frac{H(C|K)}{H(C)} & \text{otherwise}
    \end{cases}$

    ```


    A higher value of homogeneity is more desirable.


    **Completeness:** Completeness is defined as the mirror property of Homogeneity,
    that is, having all instances of a single class belong to the same cluster.


    Similar to Homogeneity, conditional entropies and cluster entropy are defined
    as:


    ```

    $H(K|C) = -\sum_{c=1}^{|C|} \sum_{k=1}^{|K|} \log \frac{a_{c,k}}{N\sum_{k''=1}^{|K|}
    a_{c,k''}}$

