    It is beyond the scope of this chapter to discuss each of these in detail. We
    will explain a few of the algorithms in some detail accompanied by references
    to give the reader a better understanding.


    # ## Elimination-based inference


    Here we describe two techniques, the variable elimination algorithm and the clique-tree
    or junction-tree algorithm.


    # ### Variable elimination algorithm


    The basics of the Variable elimination (VE) algorithm lie in the distributive
    property as shown:


    ```

    $$(ab+ac+ad) = a(b+c+d)$

    ```


    In other words, five arithmetic operations of three multiplications and two additions
    can be reduced to four arithmetic operations of one multiplication and three additions
    by taking a common factor a out.'
  merge: -1
