  md: '# Observations on feature analysis and dimensionality reduction


    We can make the following observations from the results shown in the plots:


    +   * The PCA variance and number of dimensions plot clearly shows that around
    100 linearly combined features have a similar representation or variance in the
    data (> 95%) as that of the 78 original features. This is the key first step in
    unsupervised feature reduction analysis.

    * Even PCA with two dimensions and not 100 as described previously shows some
    really good insights in the scatterplot visualization. Clearly, digits 2, 8, and
    4 are very well separated from each other and makes sense as they are written
    quite distinctly from each other. Digits such as [1,7], [3,0,5], and [1,9] in
    the low dimensional space are either overlapping or tightly clustered. This shows
    that with just features it is not possible to discriminate effectively. It also
    shows that there is overlap in the characteristics or features amongst these.

    * The next plot comparing PCA with Random Projections, both done in lower dimension
    of 2, shows that there is common between the outputs. Both have similar separation
    for distinct classes as described in PCA previously. It is interesting to note
    that PCA does much better in separating digits [8,9], for example, than Random
    Projections.

    * Isomap, the next plot, shows good discrimination, similar to PCA. Subjectively,
    it seems to be separating the data better than Random Projections. Visually, for
    instance, (3,0,5) is better separated out in Isomap than PCA.


