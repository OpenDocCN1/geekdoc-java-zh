- pgno: 238
  md: '# Explicit adaptation


    In explicit adaptation, an additional technique from among the following is used:


    +   - Retrain the model from scratch with new data so the previous model or data
    does not impact the new model

    - Update the model with the changes or new data such that the transition is smooth
    – assumes changes are gradual and not drastic

    - Create a sequence or ensemble of models that are learned over time — when a
    collaborative approach is better than any single model


    # Implicit adaptation


    In implicit adaptation, we generally use ensemble algorithms/models to adapt to
    the concept change. This can mean using different combinations ranging from a
    single classifier, to predicting in the ensemble, to using ADWIN for adaptive
    window-based with the classifier — all fall within the choices for implicit adaptation.


    # Incremental supervised learning


    This section introduces several techniques used to learn from stream data when
    the true label for each instance is available. In particular, we present linear,
    non-linear, and ensemble-based algorithms adapted to incremental learning, as
    well as methods required in the evaluation and validation of these models, keeping
    in mind that learning is constrained by limits on memory and CPU time.


    # Modeling techniques


    The modeling techniques are divided into linear algorithms, non-linear algorithms,
    and ensemble methods.


    # Linear algorithms


    The linear methods described here require little to no adaptation to handle stream
    data.


    # Online linear models with loss functions


    Different loss functions such as hinge, logistic, and squared error can be used
    in this algorithm.'
  merge: -1
  img_proc: true
- pgno: 239
  md: "# Inputs and outputs\n\nOnly numeric features are used in these methods. The\
    \ choice of loss function $l$ and learning rate $\\lambda$ at which to apply the\
    \ weight updates are taken as input parameters. The output is typically updatable\
    \ models that give predictions accompanied by confidence values.\n\n# How does\
    \ it work?\n\nThe basic algorithm assumes linear weight combinations similar to\
    \ linear/logistic regression explained in Chapter 2, Practical Approach to Real-World\
    \ Supervised Learning. The stream or online learning algorithm can be summed up\
    \ as:\n\n+   1. for(t=1,2,...T) do\n   1. $x_t = receive(); // receive the data\n\
    \   2. $\\hat{y}_t = sgn(f(x_t, w_t)); // predict the label\n   3. $y_t = obtainTrueLabel();$\
    \ // get the true label\n   4. $loss = l(w_t, x_t); // calculate the loss\n  \
    \ 5. if(l(w_t, x_t) > 0) then\n   6. $w_{t+1} = w_t + \\lambda * \\Delta(w_t,\
    \ x_t)); // update the weights\n   7. end\n\nDifferent loss functions can be plugged\
    \ in based on types of problems; some of the well-known types are shown here:\n\
    \n+   * Classification:\n  * Hinge loss: $l(w_t, x_t) = max(0, 1 - yf(x_t, w_t))$n\
    \  * Logistic loss: $l(w_t, x_t) = \\frac{1}{2} \\ln(1 + e^{-yf(x_t, w_t)})$\n\
    \n+   * Regression:\n  * Squared loss: $l(w_t, x_t) = (1 - yf(x_t, w_t))^2$"
  merge: -1
  img_proc: true
- pgno: 240
  md: '# Real-Time Stream Machine Learning


    Stochastic Gradient Descent (SGD) can be thought of as changing the weights in
    the preceding loss functions to minimize the squared loss functions but going
    in the direction of the gradient with each example. The update of weights can
    be described as:


    ```

    $$\mathbf{w}_{t+1} = \mathbf{w}_t - \lambda * \Delta J / \mathbf{x}_t$$

    ```


    ```

    $$\Delta J = -(y_i - \hat{y}_i) \hat{y}_i (1 - \hat{y}_i)$$$

    ```


    # Advantages and limitations


    Online linear models have similar advantages and disadvantages as the linear models
    described in Chapter 2, Practical Approach to Real-World Supervised Learning:


    +   - Interpretable to some level as the weights of each feature gives insights
    on the impact of each feature

    - Assumes linear relationship, additive and uncorrelated features, and hence does
    not model complex non-linear real-world data

    - Very susceptible to outliers in the data

    - Very fast and normally one of the first algorithms to try or baseline


    # Online Naïve Bayes


    Bayes theorem is applied to get predictions as the posterior probability, given
    for an $m$ dimensional input:


    ```

    $$P(y|x) = \frac{P(y) * \prod_{i=1}^{m} P(x_i|y)}{P(x)}$$$

    ```


    # Inputs and outputs


    Online Naïve Bayes can accept both categorical and continuous inputs. The categorical
    features are easier, as the algorithm must maintain counts for each class computing
    the $P(X|y)$ probability for each feature given the class. For continuous features,
    we must assume a distribution, such as Gaussian, or to compute online Kernel Density
    estimates in an incremental way or discretize the numeric features incrementally.
    The outputs are updatable models and can predict the class accompanied by confidence
    value. Being probabilistic models, they have better confidence scores distributed
    between 0 and 1.'
  merge: -1
  img_proc: true
