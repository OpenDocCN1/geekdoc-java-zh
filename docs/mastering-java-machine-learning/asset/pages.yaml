  md: '# # Experiments, results, and analysis


    The results of experiments using SAMOA as a stream-based learning platform for
    Big Data are given in Table 5.


    | Algorithm | Best Accuracy | Final Accuracy | Final Kappa Statistic | Final Kappa
    Temporal Statistic |

    |---|---|---|---|--|

    | Bagging | 79.16 | 64.09 | 37.52 | -69.51 |

    | Boosting | 78.05 | 47.82 | 0 | -1215.1 |

    | VerticalHoeffdingTree | 83.23 | 67.51 | 44.35 | -719.51 |

    | AdaptiveBagging | 81.03 | 64.64 | 38.99 | -67.37 |


    Table 5: Experimental results with Big Data real-time learning using SAMOA


    # # Analysis of results


    From an analysis of results, the following observations can be made:


    +   - Table 5 shows that the popular non-linear decision tree-based VHDT SAMOA
    is the best performing algorithm according to almost the metrics.

    - The adaptive bagging algorithm performs better than bagging because it employs
    Hoeffding Trees in the implementation, which are more robust than basic online
    bagging.

    - The online boosting algorithm with its dependency on the weak learners and no
    adaptability ranked the lowest as expected.

    - The bagging plot in Figure 25 shows a nice trend of stability achieved as the
    number of examples increased, validating the general consensus that if the patterns
    are stationary, more examples lead to robust models.


