  md: '# Clustering experiments:


    +   From the first two models in Table 6, we see that k-Means, with a horizon
    of 5,000 instances and k of 2, exhibits higher purity, higher CMM, and lower SSQ
    compared to the model with a smaller horizon and k of 5. In the complete set of
    results (available on this book''s website, see link below), one can see that
    the effect of the larger horizon is the predominant factor responsible for the
    difference.


    +   In the clustering models using micro-clustering, the SSQ is typically smaller
    than when no micro-clustering is used. This is understandable, as there are far
    more clusters and fewer instances per cluster, and SSQ is measured with respect
    to the cluster center.


    +   DBSCAN was found to be sensitive to micro-clustering, and size of the horizon.
    Compared to all other models, it ranks high on both intrinsic (Silhouette coefficient)
    as well as extrinsic measures (Completeness, Purity).


    +   The two Cluster models have the best CMM and Purity scores, with low SSQ due
    to micro-clusters.


    +   The final two outlier-based clustering algorithms have perfect CMM and Purity
    scores. The metrics are not significantly affected by the window size (although
    this impacts the evaluation time), or the value of k, the neighbor count threshold.


    # Outlier detection experiments:


    +   All the techniques in this set of experiments performed equally well, with
    the exception of ApproxSTORM, which is to be expected considering the reduced
    window used in this method compared to the exact version.


    +   The ratio of instances, always inlier versus always outlier, is close to 140
    for the majority of the models. Whether this implies adequateatory power for a
    given dataset depends on the goals of the real-time learning problem.


