- pgno: 153
  md: '# Inputs and outputs


    Only numeric features are used in spectral clustering. Model parameters such as
    the choice of kernel, the kernel parameters, the number of eigenvalues to select,
    and partitioning algorithms such as k-Means must be correctly defined for optimum
    performance.


    # How does it work?


    The following steps describe how the technique is used in practice:


    +   1. Given the data points, an affinity (or adjacency) matrix is computed using
    a smooth kernel function such as the Gaussian kernel:


    $A_{ij} \approx \exp(-\alpha ||\mathbf{x}_i - \mathbf{x}_j||^2)$


    For the points that are closer, $A_{ij} \rightarrow 0$ and for points further
    away, $A_{ij} \rightarrow 1$


    +   2. The next step is to compute the graph Laplacian matrix using various methods
    of normalizations. All Laplacian matrix methods use the diagonal matrix $D$, which
    measures degree at each node in the graph:


    $D_{ij} = \sum_j a_{ij}$


    A simple Laplacian matrix is $L = D$ (degree matrix) - $A$ (affinity matrix).


    +   3. Compute the first k eigenvalues from the eigenvalue problem or the generalized
    eigenvalue problem.


    +   4. Use a partition algorithm such as k-Means to further separate clusters
    in the k-dimensional subspace.


    # Advantages and limitations


    +   * Spectral clustering works well when the cluster shape or size is irregular
    and non-convex. Spectral clustering has too many parameter choices and tuning
    to get good results is quite an involved task.


    +   * Spectral clustering has been shown, theoretically, to be more stable in
    the presence of noisy data. Spectral clustering has good performance when the
    clusters are not well separated'
