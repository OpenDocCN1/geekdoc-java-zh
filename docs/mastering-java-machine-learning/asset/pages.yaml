    The ever-growing availability of data and the promise of systems that can enrich
    our lives by learning from that data placing a demand on the skills of the limited
    workforce of professionals in the field of data science. This demand is particularly
    acute for well-trained experts who know their way around the landscape of machine
    learning techniques in the more popular languages, such as Java, Python, R, and
