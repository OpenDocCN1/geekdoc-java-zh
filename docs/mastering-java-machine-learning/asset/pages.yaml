    \ algorithms\n\nOne of the most popular non-linear stream classifiers in use is\
    \ the Hoeffding Tree. In the following subsections, the notion of the Hoeffding\
    \ bound is introduced, followed by the algorithm itself.\n\n# Hoeffding trees\
    \ or very fast decision trees (VFDT)\n\nThe key idea behind Hoeffding Trees (HT)\
    \ is the concept of the Hoeffding bound. Given a real-valued random variable x\
    \ whose range of values has size R, suppose we have n independent observations\
    \ of x and compute the mean as \bar{x}.\n\nThe Hoeffding bound states that, with\
    \ a probability of 1 - \\delta, the actual mean of variable x is at least \\bar{x}\
    \ - \\epsilon = \\sqrt{\\frac{RR2 \\ln 1/\\delta}{2n}}\n\nThe Hoeffding bound\
    \ is independent of the probability distribution generating the samples and gives\
    \ a good approximation with just n examples.\n\nThe idea of the Hoeffding bound\
    \ is used in the leaf expansion. If x, is the most informative feature and x_j\
    \ ranks second, then split using a user-defined function G(i) in such a way that:\n\
    \n```\nG(x_i) - G(x_j) > \\epsilon = \\sqrt{\\frac{RR2 \\ln 1/\\delta}{2n}}\n\
    ```"
