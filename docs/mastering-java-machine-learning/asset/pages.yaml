    Now, consider the independence from I-Maps:


    +   - Variables I and D are non-descendants and not conditional on parents

    P(I|D) = P(I)

    - Variable S is independent of its non-descendants D and G, given its parent I.

    P(S|D,I,G)=P(S|I)

    - Variable L is independent of its non-descendants D, I, and S, given its parent
    G.

    G(L|D,I,G,S)=P(D)P(I)P(G|D,I)P(S|I)P(L|G)


    Thus, we have shown that I-Map helps in factorization given just the graph network!


    # Inference


    The biggest advantage of probabilistic graph models is their ability to answer

    probability queries in the form of conditional or MAP or marginal MAP, given some

    evidence.


    Formally, the probability of evidence E = e is given by:


    ```

    P(E = e) = \sum_{i=1}^{n} P(X_i|parent(X_i))|E=e

    ```


    But the problem has been shown to be NP-Hard (Reference [3]) or specifically,

    #P-complete. This means that it is intractable when there is a large number of

    tor variables. Even for a tree-width(number of variables in the largest clique)
    of 25,

    t problem seems to be intractable–most real-world models have tree-widths

    larger than this.


    So if the exact inference discussed before is intractable, some approximations
    be

    used so that within some bounds of the error, we can make the problem tractable?

    It has been shown that even an approximate algorithm to compute inferences

    with an error ε < 0.5, so we find a number p such that |P(E = e) - p| < ε,

    is also NP-Hard.'
