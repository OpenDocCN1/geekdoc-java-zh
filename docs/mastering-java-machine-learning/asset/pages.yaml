- pgno: 209
  md: '# Representation $D$


    The dataset $D$, which represents all the data instances and their labels, is
    given by

    D = \{(\mathbf{x}_1, y_1), (\mathbf{x}_2, y_2), \dots, (\mathbf{x}_n, y_n)\}$
    where $\mathbf{x}_i \in \mathbb{R}^d$ are the individual instances of data and

    $\{y_1, y_2, \dots y_n\}$ is the set of associated labels. $D$ is composed of
    two sets $U$, labeled data

    and $L$, unlabeled data. $x$ is the set $\{\mathbf{x}_1, \mathbf{x}_2, \dots \mathbf{x}_n\}$
    of data instances without labels.


    The dataset $\mathcal{L} = \{\mathbf{x}_i, y_i\}_{i=1}^n$ consists of all labeled
    data with known outcomes

    $\{y_1, y_2 \dots y_n\}$ where $\mathcal{U} = \{\mathbf{x}_i\}_{i=1}^n$ is the
    dataset where the outcomes are not

    known.


    # Active learning scenarios


    Active learning scenarios can be broadly classified as:


    +   - Stream-based active learning: In this approach, an instance or example is
    picked from the unlabeled dataset and a decision is made whether to ignore the
    data or pass it to the oracle to get its label [References [10,11]].

    - Pool-based active learning: In this approach, the instances are queried from
    the unlabeled dataset and then ranked on the basis of informativeness and a set
    from these is sent to the Oracle to get the labels [References [12]].

    - Query synthesis: In this method, the learner has only information about input
    space (features) and synthesizes queries from the unlabeled set for the membership.
    This is not used in practical applications, as often it doesn''t consider the
    data generating distribution and hence often the queries are arbitrary or meaningless.


    # Active learning approaches


    Regardless of the scenario involved, every active learning approach includes selecting
    a query strategy or sampling method that establishes the mechanism for picking
    the queries in each iteration. Each method reveals a distinct way of seeking out
    unlabeled examples with the best information content for improving the learning
    process. In the following subsections we describe the major query strategy frameworks,
    how they work, their merits and limitations, and the different strategies within
    each framework.'
  merge: -1
  img_proc: true
- pgno: 210
  md: "# Uncertainty sampling\n\nThe key idea behind this form of sampling is to select\
    \ instances from the unlabeled pool that the current model is most uncertain about.\
    \ The learner can then avoid the instances the model is more certain or confident\
    \ in classifying (References [8]).\n\nProbabilistic models (Naïve Bayes, Logistic\
    \ Regression, and so on) are the most natural choices for such methods as give\
    \ confidence measures on the given model, say $\theta$ for the data $\\mathbf{x}$,\
    \ for a class $y_i$, $i$ classes, and the probability $P_{\theta}(\tilde{y}|\\\
    mathbf{x})$ as the posterior probability.\n\n# How does it work?\n\nThe general\
    \ process for all uncertainty-based algorithms is outlined as follows:\n\n+  \
    \ 1. Initialize the data as labeled, $\\mathcal{L} = \\{\\mathbf{x}_i, y_i\\}_i$\
    \ and unlabeled, $\\mathcal{U} = \\{\\mathbf{x}_j\\}_j$\n2. While there is unlabeled\
    \ data:\n   1. Train the classifier $f : \\mathbf{x} \rightarrow y$ with the labeled\
    \ data $\\mathcal{L}$.\n   2. Apply the classifier $model$ on the unlabeled data\
    \ $\\mathcal{U}$ to assess informativeness $f$ using one of the sampling mechanisms\
    \ (see next section)\n   3. Choose $k$ most informative data from $\\mathcal{U}$\
    \ as $\\mathcal{L}_u$ to get labels from the oracle.\n   4. Augment the labeled\
    \ data with the $k$ new labeled data points obtained in the previous step: $L\
    \ = \\mathcal{L} \\cup \\mathcal{L}_u$.\n3. Repeat the steps under 2.\n\nSome\
    \ of the common query algorithms to sample the informative instances from the\
    \ data are given next.\n\n# Least confident sampling\n\nIn this technique, the\
    \ data instances are sorted based on their confidence in reverse, and the instances\
    \ most likely to be queried or selects the ones the model is least confident about.\
    \ The idea behind this is the least confident ones are the ones near the margin\
    \ or separating hyperplane and getting their labels will be the best way to learn\
    \ the boundaries effectively.\n\nThis can be formulated as $Q\\{\\mathbf{x}_u\\\
    } = \text{argmin } P_{\theta}(\tilde{y}|\\mathbf{x})$.\n\nThe disadvantage of\
    \ this method is that it effectively considers information of the best; information\
    \ on the rest of the posterior distribution is not used."
  merge: -1
  img_proc: true
- pgno: 211
  md: "# Smallest margin sampling\n\nThis is margin-based sampling, where the instances\
    \ with smaller margins have more ambiguity than instances with larger margins.\n\
    \nThis can be formulated as $Q[\\mathbf{x}_i] = \\argmin[P_\theta(\\hat{y}_1|\\\
    mathbf{x}) - P_\theta(\\hat{y}_2|\\mathbf{x})]$ where $\\hat{y}_1$ and $\\hat{y}_2$\
    \ are labels for the instance $x$.\n\n# Label entropy sampling\n\nEntropy, is\
    \ the measure of average information content in the data and is its impurity,\
    \ can be used to sample the instances. This can be formulated as:\n\n```\n$Q[\\\
    mathbf{x}_s] = \\argmax - \\sum_{y \\in classes} P_\\theta(y|\\mathbf{x})log(P_\\\
    theta(y|\\mathbf{x}))$\n```\n\n# Advantages and limitations\n\nThe advantages\
    \ and limitations are:\n\n+   Label entropy sampling is the simplest approach\
    \ and can work with any probabilistic classifiers—this is the biggest advantage\n\
    \n+   Presence of outliers or wrong feedback can go unnoticed and models can degrade\n\
    \n# Version space sampling\n\nHypothesis $H$ is the set of all the particular\
    \ models that generalize or explain the training data; for example, all possible\
    \ sets of weights that separate two linearly separable classes. Version spaces\
    \ $V$ are subsets of hypothesis $H_i$, which are consistent with the training\
    \ data as defined by Tom Mitchell (References [15]) such that $V \\subseteq \\\
    mathcal{H}$.\n\nThe idea behind this sampling is to query instances from the unlabeled\
    \ dataset that reduce the size of the version space or minimize $|V|$.\n\n# Query\
    \ by disagreement (QBD)\n\nQBD is one of the earliest algorithms which works on\
    \ maintaining a version space $V$—when two hypotheses disagree on the label of\
    \ new incoming data, that instance is selected for getting labels from the oracle\
    \ or expert."
  merge: -1
  img_proc: true
- pgno: 212
  md: "Semi-Supervised and Active Learning\n\n# # How does it work?\n\nThe entire\
    \ algorithm can be summarized as follows:\n\n+   1. Initialize $V \\subseteq \\\
    mathcal{H}$ as the set of all legal hypotheses.\n2. Initialize the data as $\\\
    mathcal{L} = \\{\\mathbf{x}_i, y_i\\}_{i=1}^n$ labeled and $\\mathcal{U} = \\\
    {\\mathbf{x}_j, y_j\\}_{j=n+1}^m$ unlabeled.\n3. While data $x'$ is in $U$:\n\
    \   1. If $h_i(x') \neq h_j(x')$ for any $h_s \\in V$:\n      1. Query the label\
    \ of $x'$ and get $y'$.\n      2. $V = \\{h: h(x') = y'\\}$ for all points.\n\
    \   2. Otherwise:\n      1. Ignore $x'$.\n\n# # Query by Committee (QBC)\n\nQuery\
    \ by Committee overcomes the limitation of Query by Disagreement related to maintaining\
    \ all possible version spaces by creating a committee of classifiers and using\
    \ their votes as the mechanism to capture the disagreement (References [7]).\n\
    \n# # How does it work?\n\nFor this algorithm:\n\n+   1. Initialize the data as\
    \ $\\mathcal{L} = \\{\\mathbf{x}_i, y_i\\}_{i=1}^n$ labeled and $\\mathcal{U}\
    \ = \\{\\mathbf{x}_j, y_j\\}_{j=n+1}^m$ unlabeled.\n2. Train the committee of\
    \ models $C = \\{\theta^1, \\dots, \theta^k\\}$ on the labeled data $w$ (see the\
    \ following).\n3. For all $x'$ in the $U$:\n   1. Vote for predictions on $x'$\
    \ as $\\{y_{\theta^1}', y_{\theta^2}', \\dots, y_{\theta^k}'\\}$.\n   2. Rank\
    \ the instances based on maximum disagreement (see the following).\n   3. Choose\
    \ $k$ most informative data from $U$ as set $L_u$ to get labels from the oracle.\n\
    4. Augment the labeled data with the $k$ new labeled data points $L = L \\cup\
    \ L_u$.n5. Retrain the models $\\{\theta^1, \theta^2, \\dots, \theta^k\\}$ with\
    \ new $L$."
  merge: -1
  img_proc: true
- pgno: 213
  md: 'With the two tasks of training the committee of learners and choosing the disagreement
    methods, each has various choices.


    Training different models can either be done using different samples from L or
    they can be trained using ensemble methods such as boosting and bagging.


    Vote entropy is one of the methods chosen as the disagreement metric to rank.
    The mathematical way of representing it is:


    ```

    $Q\{\mathbf{x}_w\} = \text{argmax} \sum_{i} \frac{V(y_i)}{|C|} \log \frac{V(y_i)}{|C|}$

    ```


    Here, $V(y)$ is the number of votes given to the label $y$, from all possible
    labels and $|C|$ is the size of the committee.


    Kullback-Leibler (KL) divergence is an information theoretic measure of divergence
    between two probability distributions. The disagreement is quantified as the average
    divergence of each committee''s prediction from the consensus of the committee
    C:


    ```

    $Q\{\mathbf{x}_w\} = \text{argmax} \frac{1}{|C|} \sum_{\theta \in C} KL(P_\theta(y|\mathbf{x})
    || P_C(y|\mathbf{x}))$

    ```


    # # Advantages and limitations


    The advantages and limitations are the following:


    +   - Simplicity and the fact that it can work with any supervised algorithm gives
    it a great advantage.


    +   - There are theoretical guarantees of minimizing errors and generalizing in
    some conditions.


    +   - Query by Disagreement suffers from maintaining a large number of valid hypotheses.


    +   - These methods still suffer from the issue of wrong feedback going unnoticed
    and models potentially degrading.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Data distribution sampling


    The previous methods selected the best instances from the unlabeled set based
    either on the uncertainty posed by the samples on the models or by reducing the
    hypothesis space size. Neither of these methods worked on was best for the model
    itself. The idea behind data distribution sampling is adding samples that help
    reduce the errors to the model serves to improve predictions on unseen instances
    using expected values (_References_ [13 and 14]).


    # How does it work?


    There are different ways to find what is the best sample for the given model and
    we will describe each one in some detail.


    # Expected model change


    The idea behind this is to select examples from the unlabeled set that will bring
    maximum change in the model:


    ```

    $Q\x_{\_u}\} = \text{argmin} \sum_{\_y} P_{\_o}(y|x) \sum_{\_x'' \in \_u} H_{\theta_{\o}}(y|x'')$

    ```


    Here, $P_{\_o}(y|x)$ = expectation over labels of $x$, $\sum_{\_x'' \in \_u} H_{\theta_{\o}}(y|x'')$
    is the sum over unlabeled instances of the entropy of including $x''$ after retraining
    with $x$.


    # Expected error reduction


    Here, the approach is to select examples from the unlabeled set that reduce the
    model''s generalized error most. The generalized error is measured using the unlabeled
    set with expected labels:


    ```

    $Q\x_{\_u}\} = \text{argmin} \sum_{\_y} P_{\_o}(y|x) \sum_{\_x'' \in \_u} 1 -
    p_{\_o} + (y|x'')$

    ```


    Here, $P_{\_o}(y|x)$ = expectation over labels of $x$, $\sum_{\_x'' \in \_u} H_{\theta_{\o}}(y|x'')$
    is the sum over unlabeled instances of the entropy of including $x''$ after retraining
    with $x$.


    # Variance reduction


    The general equation of estimation on an out-of-sample error in terms of noise-bias-variance
    is given by the following:


    ```

    $E((G(x)-y)^2; x) = \text{noise} + bias + \text{variance}$

    ```'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'Here, $\mathbf{G(x)}$ is the model''s prediction given the label $y$. In variance
    reduction, we select examples from the unlabeled set that most reduce the variance
    in the model:


    ```

    $Q\{\mathbf{x}_u\} = \text{argmin}_{\mathbf{x}} \sum_{\mathbf{x}''} VAR_{\theta}
    ((\mathbf{y}''|\mathbf{x}'')$

    ```


    Here, $\theta+$ represents the model after it has been retrained with the new
    point $\mathbf{x}''$ and its label $y''$.


    # Density weighted methods


    In this approach, we select examples from the unlabeled set that have average
    similarity to the labeled set.


    This can be represented as follows:


    ```

    $Q\{\mathbfmathbf{x}_u\} = \text{argmax}_{\mathbf{x}} \sum_{\mathbf{x}''} sim(\mathbf{x}'',\mathbf{x})
    \times H_{\theta}(\mathbf{y}|\mathbf{x})$

    ```


    Here, $sim(\mathbf{x}, \mathbf{x}'')$ is the density term or the similarity term
    where $H_l(y|\mathbf{x})$ is the base utility measure.


    # Advantages and limitations


    The advantages and limitations are as follows:


    +   - The largest advantage is that they work directly on the model as an optimization
    objective rather than implicit or indirect methods described before


    +   - These methods can work on pool- or stream-based scenarios


    +   - These methods have some theoretical guarantees on the bounds and generalizations


    +   - The biggest disadvantage of these methods is computational cost and difficulty
    in implementation'
  merge: -1
  img_proc: true
