  md: "# Inputs and outputs\n\nThe constraint on the chosen types of inputs (categorical\
    \ only, continuous only, or mixed) depends on the base classifiers. The base classifier\
    \ algorithm with parameter choices corresponding to the algorithm are also the\
    \ inputs. The output is the learned model that can predict the class/confidence\
    \ based on the classifier.\n\n# How does it work?\n\nThe basic bagging algorithm\
    \ requires the entire data to be available to create different samples and provide\
    \ these samples to different classifiers. Oza's Online Bagging changes this constraint\
    \ and makes it possible to learn from unbounded data streams. On sampling, each\
    \ training instance in the original algorithm gets replicated many times and each\
    \ base model is trained with k copies of the original instances:\n\n```\nP(k)\
    \ = exp(-k)/k!\n```\n\nThis is equivalent to taking one example and choosing for\
    \ each classifier k~Poisson(1) and updating the base classifier k times. Thus,\
    \ the dependency on the number of examples is removed and the algorithm can run\
    \ on an infinite stream:\nOnlineBagging(x: inputstream, h_m: m learner models)\n\
    \n+   1. initialize base h_m for all m in [1,2..M]\n2. for(i=1..T) Do\n   1. x_i=receive();\n\
    \   2. foreach model m={1,2..M}\n      w = Poisson(1)\n      updateModel(h_m,\
    \ w, x_i)\n   3. end\n4. return\n\n```\nh_{final} = argmax_{y\\in Y} \\sum_{t=1}^{T}\
    \ I(h(x)) = y\n```\n\n# Advantages and limitations\n\nThe advantages and limitations\
    \ are as follows:\n\n+   - It has been empirically shown to be one of the most\
    \ successful online or stream algorithms.\n- The weight must be given to the data\
    \ instance without looking at the other instances; this reduces the choices of\
    \ different weighting schemes which are available in batch and are good in model\
    \ performance."
