    # Long Short Term Memory


    One of the neural network architectures or modifications to RNNs that addresses
    the issue of vanishing gradient is known as long term memory or LSTM. We will
    explain some building blocks of LSTM and then put it together for our readers.


    The first modification to RNN is to change the feedback learning matrix to 1,
    that is, $W_{ii} = 1$, as shown in the following figure:


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_395_1.png)


    Figure 36: Building blocks of LSTM where the feedback matrix is set to 1.


    This will ensure the inputs from older cell or memory units are passed as-is to
    the next unit. Hence some modifications are needed.


    [ 359 ]'
