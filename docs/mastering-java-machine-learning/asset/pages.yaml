  md: 'Deep Learning


    The new memory generation unit uses the current input $x_t$, and the old state
    $h_{t-1}$ through an activation function and generates a new memory $C_t$. The
    input gate combines the input and the old state and determines whether the new
    memory should be preserved.


    Thus, the update equation looks like this:


    $C_{t+1} = f_t \odot C_t + i_t \odot \tilde{C}_t$$


