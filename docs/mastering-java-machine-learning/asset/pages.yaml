  md: '# Deep Learning


    # Parameter search using Arbiter


    DeepLearning4j provides a framework for fine-tuning hyper-parameters by taking
    the burden of hand-tuning away from the modeler; instead, allows the specification
    of the parameter space to search. In the example code snippet, the configuration
    is specified using a MultiLayerSpace instead of a MultiLayerConfiguration object,
    in which the ranges for the hyper-parameters are specified by means of ParameterSpace
    in the Arbiter DL4j package for the parameters to be tuned:


    ```

    ParameterSpace<Double> learningRateHyperparameter = new

    ContinuousParameterSpace(0.0001, 0.1); //Values will be generated

    uniformly, at random between 0.0001 and 0.1 (inclusive)

    ParameterSpace<Integer> layerSizeHyperparameter = new

    IntegerParameterSpace(16, 256); //Integer values will be

    generated uniformly at random between 16 and 256 (inclusive)

    MultiLayerSpace hyperparameter = new MultiLayerSpace.Builder()

    //these next options: fixed values for all models

    optimizationAlgo(Optimizationalgorithm.STOCHASTIC_GRADIENT_DESCENT)

    iterations(1)

    regularization(true)

    l2(0.01)

    //Learning rate: this is what we want to test different values

    for

    learningRate(learningRateHyperparameter)

