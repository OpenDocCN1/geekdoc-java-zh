    # Advantages and limitations


    NMF has been shown to be almost equal in performance with top algorithms, as LSI,
    for information retrieval and queries:


    # Evaluation of text clustering


    In the case of labeled datasets, all the external measures discussed as F-measure
    and Rand Index are useful in evaluating the clustering techniques. When the dataset
    doesn''t have labels, some of the techniques described as the internal measures,
    such as the Davies-Bould Index, R-Squared, and Silhouette Index, can be used.


    The general good practice is to adapt and make sure similarity between the documents,
    as discussed in this section, is used for measuring closeness, remoteness, and
    spread of the cluster when applied to text mining data. Similarly depends on the
    algorithm and some relevance to the problem too. In distance-based partition algorithms,
    the similarity of the document can be computed with the mean vector or the centroid.
    In hierarchical algorithms, similarity can be computed with most similar or dissimilar
    documents in the group.'
