- pgno: 328
  md: '# Probabilistic Graph Modeling


    Structure learning in the MNs is similar or even harder than parameter learning
    and has been shown to be NP-hard. In the constraint-based approach, for a given
    dataset, conditional independence between the variables is tested. In MNs, each
    pair of variables is tested for conditional independence using mutual information
    between the pair. Based on a threshold, an edge is considered to be between the
    pair or not. One disadvantage of this is that it requires extremely large numbers
    of samples to refute any noise in the data. Complexity of the network due to pairwise
    edges is another limitation.


    In search and score-based learning, the goal is similar to BNs, where search is
    for structures and scoring—based on various techniques—is computed to help and
    adjust the search. In the case of MNs, we use features described in the log-linear
    models rather than during. The weighting of the features is considered during
    optimization and scoring.


    # Conditional random fields


    Conditional random fields (CRFs) are a specialized form of Markov network where
    the hidden and observables are mostly modeled for labeled sequence prediction
    problems (References [16]). Sequence prediction problems manifest in many text
    mining areas such as next word/letter predictions, Part of speech (POS) tagging,
    and so on, and in bioinformatics domain for DNA or protein sequence predictions.


    The idea behind CRFs is the conditional distribution of sequence is modeled as
    feature functions and the labeled data is used to learn using optimization the
    empirical distribution, as shown in the following figure.


    The conditional distribution is expressed as follows where Z(x) is the normalizing
    constant. Maximum likelihood is used for parameter estimation for $\lambda$ and
    is generally a convex function in log-linear obtained through iterative optimization
    methods such as gradient descent.


    ```

    $P(\mathbf{y} |\mathbf{x}, \lambda) = \frac{1}{Z(\mathbf{x})} \exp \sum_{i=1}^{n}
    \sum_{j} \lambda_{i,j} f(y_{i-1}, y_i, \mathbf{x}, \mathbf{i})$ $

    ```'
