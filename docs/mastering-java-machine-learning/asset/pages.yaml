- pgno: 452
  md: '# Named entity recognition


    Named entity recognition (NER) is one of the most important topics in information
    retrieval for text mining. Many complex mining tasks, such as the identification
    of relations, annotations of events, and correlation between entities, use NER
    as the initial component or basic preprocessing step.


    Historically, manual rules-based and regular expression-based techniques were
    used for entity recognition. These manual rules relied on basic preprocessing,
    using POS tags as features, along with hand-engineered features, such as the presence
    of capital words, usage of punctuations prior to words, and so on.


    Statistical learning-based techniques are now used more for NER and its variants.
    BIO notation, when used to sequence labeling and prediction problems in Machine
    Learning, where each entity T has two labels B-T and I-T corresponding to beginning
    and intermediate, respectively, is labeled, and learning involves finding the
    pattern and predicting in unseen data. The O represents an outside or unrelated
    entity in the sequence of text. The entity type T is further classified into Person,
    Organization, Data, and location in the most basic form.


    In this section, we will discuss the two most algorithms used: generative-based
    hidden Markov models and discriminative-based maximum entropy models.


    Though we are discussing these algorithms in the context of Named Entity Recognition,
    the same algorithms and processes can be used for other NLP tasks such as POS
    Tagging, where tags are associated with a sequence rather than associating the
    NER classes.


    # Hidden Markov models for NER


    Hidden Markov models, as explained in Chapter 6, Probabilistic Graph Modeling,
    are the sequence-based generative models that assume an underlying distribution
    that generates the sequences. The training data obtained by labeling sequences
    with the right NER classes can be used to learn the distribution and parameters,
    so that for unseen future sequences, effective predictions can be performed.


    # Input and output


    The training data consists of text sequences x=[x₁, x², ... xn] where each xᵢ,
    is a word in the text sequence and labels for each word are y=[y₁, y², ... yn].
    The algorithm generates a model so that for testing on unseen data, the labels
    for new sequences can be generated.'
  merge: -1
  img_proc: true
- pgno: 453
  md: '# How does it work?


    +   1. In the simplest form, a Markov assumption is made, which is that the hidden
    states and labels of the sequences are only dependent on the previous state. An
    adaptation to the sequence of words with labels is shown in the following figure:


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_453_0.png)


    +   2. The HMM formulation of the sequence classification helps in estimating
    the joint probability maximized in training data:


    ```

    $p(\mathbf{x, y}) = \prod_{i} p(x_i | y_i) p(y_i | y_{i-1})$$

    ```


    +   3. Each $y_i$ is assumed to be generated based on $y_{i-1}$ and $x_i$. The
    first word in the entity is generated conditioning on current and previous labels,
    that is, $y_i$ and $y_{i-1}$. If the instance is already a Named entity, then
    conditioning is only on previous instances, that is, $x_i$. Outside words such
    as "visited" and "in" are considered "not a name".


    +   4. The HMM formulation with the forward-backward algorithm can be used to
    determine the likelihood of a sequence of observations with parameters learned
    from the training data.


    # Advantages and limitations


    The advantages and limitations are as follows:


    +   - HMMs are good for short sequences, as shown, with one word or term independence
    assumption. For sequences with entities that have a longer span, the results will
    violate these assumptions.


    +   - The HMM needs a large set of training data to estimate the parameters.'
  merge: -1
  img_proc: true
