    \ data with a few labeled and a large number of unlabeled instances. A clustering\
    \ algorithm and its parameters along with a classification algorithm that its\
    \ parameters constitute additional inputs. The technique generates a classification\
    \ model that can help predict the classes of unseen data.\n\n# # How does it work?\n\
    \nThe abstract algorithm can be given as:\n\n+   1. Initialize data as $\\mathcal{L}\
