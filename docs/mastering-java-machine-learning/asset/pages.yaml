  md: '# Chapter 2


    With a number of different models collaborating, ensemble methods can leverage
    the best of all. Bagging and boosting are techniques that generalize better in
    the ensemble compared to the learner they use and are popular in many applications.


    Finally, what are the strategies and methods that can be used in evaluating model
    performance and comparing models to each other? The role of validation sets or
    cross-validation is essential to the ability to generalize over unseen data. Performance
    evaluation metrics derived from the confusion matrix are used universally to evaluate
    classifiers; some are used more commonly in certain domains and disciplines. ROC,
    Gain, and Lift curves are great visual representations of the range of model performance
    as the classification threshold is varied. When comparing models in pairs, several
    methods based on statistical hypothesis testing are used. Wilcoxon and McNemar''s
    are two non-parametric tests; Paired-test is an example of a parametric method.
    Likewise, when comparing multiple algorithms, a common non-parametric test that
    does not make assumptions about the data distribution is ANOVA, which are parametric
    tests, assume normal distribution of the metrics and variances.


    The final sections of the chapter present the process undertaken using the RapidMiner
    to develop and evaluate models generated to classify data from the UCI Horse-horse
