    Compute the gradient of the hidden layer before the current:


    ```

    $$\nabla_{B^{k-1}(s)}(-\log(f(x))) = \mathbf{W}^k (\nabla_{a^k(s)}(-\log(f(x)))$

    ```


    Compute the gradient of the layer before activation:


    ```

    $$\nabla_{B^{k-1}(s)}(-\log(f(x)))^T \nabla_{a^k(s)}^T \mathbf{h}^k(x)$$\n$$$
    = \left(\nabla_{B^{k-1}(s)}(-\log(f(x)))\right) \circ [\dots, \mathbf{g}''(\alpha^{k-1}x),
    \dots]$$

    ```


    # Regularization


    In the empirical risk minimization objective defined previously, regularization
    is used to address the over-fitting problem in machine learning as introduced
    in Chapter 2, Practical Approach to Real-World Supervised Learning. The well-known
    regularization functions are given as follows.


    # L2 regularization


    This is applied only to the weights and not to the biases and is given for layers
    connecting $(i,j)$ components as:


    ```

    $$\Omega(\theta) = \sum_k \sum_i \sum_j (W_{i,j}^k)^2$$\$\n$$ = \sum_k ||\mathbf{W}^k||_F^2$$

    ```'
