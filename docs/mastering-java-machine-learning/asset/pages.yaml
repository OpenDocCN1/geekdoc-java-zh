  md: '# Semi-supervised learning


    The idea behind semi-supervised learning is to learn from labeled and unlabeled
    data to improve the predictive power of the models. The notion is explained with
    a simple illustration, Figure 1, which shows that a large amount of unlabeled
    data is available, for example, HTML documents on the web, the expert can classify
    a few of them into known categories as sports, news, entertainment, and so on.
    This small set of labeled data together with the large unlabeled dataset can be
    used by semi-supervised learning techniques to learn models. Thus, using the knowledge
    of both labeled and unlabeled data, the model can classify unseen documents in
    the future. In contrast, supervised learning uses labeled data only:


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_191_0.png)


    Figure 1. Semi-supervised Learning process (bottom) contrasted with Supervised
    Learning (top) using classification of web documents as an example. The main difference
    is the amount of labeled data available for learning, highlighted by the qualifier
    ''small'' in the semi-supervised case.'
  merge: -1
  img_proc: true
- pgno: 192
  md: "# Representation, notation, and assumptions\n\nAs before, we will introduce\
    \ the notation we use in this chapter. The dataset $D$ consists of individual\
    \ data instances represented as $\\mathbf{x}$, which is also represented as a\
    \ set $\\{\\mathbf{x}_1, \\mathbf{x}_2, \\dots, \\mathbf{x}_n\\}$, the set of\
    \ data instances without labels. The labels associated with these instances are\
    \ $\\{y_1, y_2, \\dots, y_n\\}$. The entire labeled dataset can be represented\
    \ as paired elements in a set, as given by $D = \\{(\\mathbf{x}_i, y_i)\\}_{i=1}^n,\
    \ \\dots, (\\mathbf{x}_n, y_n)\\}$ where $\\mathbf{x} \\in \\mathbb{R}^d$. In\
    \ semi-supervised learning, we divide the dataset $D$ into two sets $U$ and $L$\
    \ for unlabeled and labeled data respectively.\n\nThe labeled data $\\mathcal{L}\
    \ = \\{(\\mathbf{x}_i, y_i)\\}_{i=1}^n$ consists of all labeled data with known\
    \ outcomes $\\{y_1, y_2, \\dots, y_n\\}$. The unlabeled data $\\mathcal{U} = \\\
    {\\mathbf{x}_j\\}_{j=1}^m$ is the dataset where the outcomes are not known. $|U|\
    \ > |L|$.\n\nInductive semi-supervised learning consists of a set of techniques,\
    \ which, given the training set $D_l$, learns a model $f: \\mathbf{x} \to \\mathbf{y}$\
    \ and unlabeled data $\\mathcal{U} = \\{\\mathbf{x}_j\\}_{j=1}^m$ learns a model\
    \ that can be a good predictor on unseen data beyond the training data $U$. $U$\
    \ \"induces\" a model that can be used just like semi-supervised learning algorithms\
    \ to predict on unseen instances.\n\nTransductive semi-supervised learning consists\
    \ of a set of techniques, which, given the training set $D_l$, learns a model\
    \ $f: \\mathbf{x}_{u_i} \to \\mathbf{y}_{u_i}$ that makes predictions on unlabeled\
    \ data alone. It is not required to perform on unseen future instances and hence\
    \ a simpler form of SSL than inductive based learning.\n\nSome of the assumptions\
    \ made in the semi-supervised learning algorithms that should hold true for these\
    \ types of learning to be successful are noted in the following list. For SSL\
    \ to work, one or more of these assumptions must be true:\n\n+   **Semi-supervised\
    \ smoothness**: In simple terms, if two points are \"close\" in terms of density\
    \ or distance, then their labels agree. Conversely, if two points are separated\
    \ and in different density regions, then their labels will not agree.\n\n+   **Cluster\
    \ togetherness**: If the data instances class to form a cluster, then the unlabeled\
    \ data can aid the clustering algorithm to find better clusters.\n\n+   **Manifold\
    \ togetherness**: In many real-world datasets, the high-dimensional data lies\
    \ in a low-dimensional manifold, enabling learning algorithms to overcome the\
    \ curse of dimensionality. If this is true in the dataset, the unlabeled data\
    \ also maps to the manifold and can improve the learning."
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Semi-supervised learning techniques


    In this section


    # Self-training SSL


    Self-training is the simplest form of SSL, where we perform a simple iterative
    process of imputing the data from the unlabeled set by applying the model learned
    from the labeled set (References [1]):


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_193_0.png)


    # Inputs and outputs


    The input is training data with a small amount of labeled and a large amount of
    unlabeled data. A base classifier, either linear or non-linear, such as Naïve
    Bayes, KNN, Decision Tree, or other, is provided along with the hyper-parameters
    needed for each of the algorithms. The constraints on data types will be similar
    to the base learner. Stopping conditions such as maximum iterations reached or
    unlabeled data exhausted are choices that must be made as well. Often, we use
    base learners which give probabilities or ranks to the outputs. As output, this
    technique generates models that can be used for performing predictions on unseen
    datasets other than the unlabeled data provided.'
  merge: -1
  img_proc: true
- pgno: 194
  md: "# How does it work?\n\nThe entire algorithm can be summarized as follows:\n\
    \n+   1. While stopping criteria not reached:\n   1. Train the classifier model\
    \ $f:x \rightarrow y$ with labeled data $L$\n   2. Apply the classifier model\
    \ $f$ on unlabeled data $U$\n   3. Choose $k$ most confident predictions from\
    \ $U$ as $L_u$\n   4. Augment the labeled data with the $k$ data points $L = L\
    \ \\cup L_u$\n2. Repeat all the steps under 2.\n\nIn the abstract, self-training\
    \ can be seen as an expectation maximization process applied to a semi-supervised\
    \ setting. The process of training the classifier model is finding the parameter\
    \ $\theta$ using MLE or MAP. Computing the learned model is similar to the EXPECTATION\
    \ step where $E[y_i]$ is estimating the label from $U$ given the parameter $\t\
    heta$. The iterative step of learning the model with augmented labels is akin\
    \ to the MAXIMIZATION step where the new parameter is tuned to $\theta'$.\n\n\
    # Advantages and limitations\n\nThe advantages and limitations are as follows:\n\
    \n+   * Simple, works with most supervised learning techniques.\n* Outliers and\
    \ noise can cause mistakes in predictions to be reinforced and the technique to\
    \ degrade.\n\n# Co-training SSL or multi-view SSL\n\nCo-training SSL involves\
    \ learning from two \"views\" of the same data. It is a special case of multi-view\
    \ SSL (References [2]). Each view can be considered as a feature set of the point\
    \ capturing some domain knowledge and is orthogonal to the other view. For example,\
    \ a web-documents dataset can be considered to have two views: one view represents\
    \ the text and the other view is features representing hyperlinks to other documents.\
    \ The assumption is that there is enough data for each view and learning from\
    \ each view improves the overall labeling process. In datasets where such partitions\
    \ of features are not possible, splitting features randomly into disjoint sets\
    \ forms the views."
  merge: -1
  img_proc: true
- pgno: 195
  md: "# Inputs and outputs\n\nInput is training data with a few labeled and a large\
    \ number of unlabeled data. In addition to providing the data points, there are\
    \ feature sets corresponding to each view and the assumption is that these feature\
    \ sets are not overlapping and solve different classification problems. A base\
    \ classifier, linear or non-linear, as Na Bayes, KNN, Decision Tree, or other,\
    \ is selected with the hyper-parameters needed for each of the algorithms. This\
    \ method generates models that can be used for performing detections on unseen\
    \ datasets other than the unlabeled data provided.\n\n# How does it work?\n\n\
    We will demonstrate the algorithm using two views of the data:\n\n+   1. Initialize\
    \ the data as $\\mathcal{L} = \\{x_i, y_i\\}_{i=1}^n$ labeled and $\\mathcal{U}\
    \ = \\{x_j, y_j\\}_{j=1}^m$ unlabeled. Each data point has two views $x = [x^1,\
    \ x^2]$ and $L = [L^1, L^2]$.\n2. While stopping criteria not reached:\n    1.\
    \ Train the classifier models $f^1: x \rightarrow y$ and $f^2: x \rightarrow y$\
    \ with labeled data $L^1$ and $L^2$ respectively.\n    2. Apply the classifier\
    \ models $f^1$ and $f^2$ on unlabeled data $\\mathcal{U}$ using their features.\n\
    \    3. Choose the most confident predictions from $\\mathcal{U}$, applying $f^1$\
    \ and $f^2$ as $L_u^1$ and $L_u^2$ respectively.\n    4. Augment the labeled data\
    \ with the $k$ data points $L^1 = L^1 \\cup L_u^1$ and $L^2 = L^2 \\cup L_u^2$.\n\
    3. Repeat all steps under 2.\n\n# Advantages and limitations\n\nThe advantages\
    \ and limitations are:\n\n+   * When the features have different aspects or a\
    \ mix of different domains, co-training becomes more beneficial than simple self-training\n\
    * The necessary and sufficient condition of having orthogonal views and ability\
    \ to learn from them poses challenges for the generality of the technique\n\n\
    # Cluster and label SSL\n\nThis technique, like self-training, is quite generic\
    \ and applicable to domains and datasets where the clustering supposition mentioned\
    \ in the sections holds true (References [3])."
  merge: -1
  img_proc: true
