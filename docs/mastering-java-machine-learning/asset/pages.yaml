- pgno: 150
  md: '# Input and output


    Hierarchical clustering generally works on similarity-based transformations and
    both categorical and continuous data are accepted. Hierarchical clustering only
    needs the similarity or distance metric to compute similarity and does not need
    the number of clusters like in k-means or GMM.


    # How does it work?


    There are many variants of hierarchical clustering, but we will discuss agglomerative
    clustering. Agglomerative clustering works by first putting all the data elements
    in their own groups. It then iteratively merges the groups based on the similarity
    metric used until there is a single group. Each level of the tree or groupings
    provides unique segmentation of the data and it is up to the analyst to choose
    the right level that fits the problem domain. Agglomerative clustering is normally
    visualized using dendrogram plot, which shows merging of data points at similarity.
    The popular choices of similarity methods used are:


    +   * Single linkage: Similarity is the minimum distance between the groups of
    points:


    ```

    $d_{SL}(A,B) = \min d_{ij} \quad i\in A, j\in B$$

    ```


    +   * Complete linkage: Similarity is the maximum distance between the groups
    of points:


    ```

    $d_{CL}(A,B) = \max d_{ij} \quad i\in A, j\in B$$

    ```


    +   * Average linkage: Average similarity between the groups of points:


    ```

    $d_{AL}(A,B) = \frac{1}{N_A N_B} \sum_{i\in A} \sum_{j\in B} d_{ij}$$

    ```


    # Advantages and limitations


    +   * Hierarchical clustering imposes a hierarchical structure on the data when
    there may not be such a structure present.


    +   * The choice of similarity metrics can result in a vastly different set of
    merges and dendrogram plots, so it has a large dependency on user input.


    +   * Hierarchical clustering suffers from scalability with increased data points.
    Based on the distance metrics used, it can be sensitive to noise and outliers.'
  merge: -1
  img_proc: true
