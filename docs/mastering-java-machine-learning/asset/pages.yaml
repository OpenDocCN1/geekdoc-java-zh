- pgno: 325
  md: 'Note that interaction between variables are captured by factors $\phi(D_i),
    \phi(D_j), \dots \phi(D_m)$ and are not the marginal probabilities, but contribute
    to the joint probability. The factors that parameterize a Markov network are called
    clique potentials. By choosing factors over maximal cliques in the graph, the
    number of parameters are reduced substantially.


    # # Factor graphs


    Graph structure of Markov network does not reveal properties such as whether the
    factors involve maximal cliques or their subsets when using Gibbs parameterization.
    Factor graphs are discussed in the section of inferencing in Bayesian networks
    have a step to recognize maximal cliques and thus can capture these parameterizations.
    Please refer to the section on factor graphs in BN.


    # # Log-linear models


    Another form of parameterization is to use the energy model representation from
    statistical physics.


    The potential is represented as a set of features and a potential table is generally
    represented by features with weights associated with them.


    If $D$ is a set of variables, $\phi(D)$ is a factor then:


    ```

    $$\phi(D) = -ln\phi(D)$

    ```


    Thus, as the energy increases, the probability decreases and vice versa. The logarithmic
    cell frequencies captured in $\phi(D)$ are known as log-linear in statistical
    physics. The joint probability can be represented as:


    ```

    $P(X_1, X_2, \dots, X_k : \theta) = \frac{1}{Z(\theta)} \exp\left[ \sum_{i=1}^k
    \theta_i f_i(D_i) \right]$

    ```


    $\mathcal{F} = \{(\phi(D_i))\,}^*$ is the feature defined over the variables in
    $D_r$


    # # Independencies


    Like Bayesian networks, Markov networks also encode a set of independence assumptions
    governing the flow of influence in undirected graphs.'
