    \ an older element in the reservoir. The detailed algorithm is shown here:\n\n\
    ```\nReservoirSampling(x:inputstream, k:sizeOfReservoir)\n//add first $k$ elements\
    \ to reservoir\nfor(i = 0; i < k; i++)\n  addToReservoir(x)\nwhile(x) {\n  for(i\
    \ = 0; i < k; i++)\n```"
