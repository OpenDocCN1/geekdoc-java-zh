- pgno: 165
  md: '# Clustering-based methods


    Some believe that clustering techniques, the goal is to find groups of data points
    located together, in some sense antithetical to the problem of anomaly or outlier
    detection. However, as an advanced unsupervised learning technique, clustering
    analysis offers several methods to find interesting groups of clusters that are
    either located far from others clusters or do not lie in clusters at all.


    # Inputs and outputs


    As seen before, clustering techniques work well with real-valued data, although
    some categorical translated to numeric values are tolerated. In the case of k-Means
    and k-Medoids, input values include the number of clusters $k$ and the variants
    may require a threshold score to identify outlier groups. For Gaussian Mixture
    Models using EM, the number of mixture components must be supplied by the user.
    When using CBLOF, two user-defined parameters are expected: the size of small
    clusters and the size of large clusters. Depending on the algorithm used, individual
    or groups of objects are output as outliers.


    # How does it work?


    As we discussed in the section on clustering, there are various types of clustering
    methods and we will give a few examples of how clustering algorithms have been
    extended for outlier detection.


    k-Means or k-Medoids and their variants generically cluster data elements together
    and are affected by outliers or noise. Instead of preprocessing these data points
    by removal or transformation, such points that weaken the "tightness" of the clusters
    are considered outliers. Typically, outliers are revealed by a two-step process
    of first running clustering algorithms and then evaluating some form of outlier
    score that measures distance from point to centroid. Also, many variants treat
    clusters of size smaller than a threshold as outlier.


    Gaussian mixture modeling (GMM) using Expectation maximization (EM) is another
    well-known clustering-based, outlier detection technique, where a data point that
    has low probability of belonging to a cluster becomes an outlier and the outlier
    score becomes the inverse of the EM probabilistic output score.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'Unsupervised Machine Learning Techniques


    # Cluster-based Local Outlier Factor (CBLOF) uses a two-stage process to find
    outliers. First, a clustering algorithm performs partitioning of data into clusters
    of various sizes. Using two user-defined parameters, size of large clusters, and
    size of small clusters, two sets of clusters are formed:


    ```

    $LC = \text{Set of Large Clusters} \{C_1, C_2, \dots, C_n\}\nSC = \text{Set of
    Small Clusters} \{C_{n+1}, C_{n+2}, \dots, C_m\}\nCBLOF(p) = \left\ \begin{aligned}
    |C|\min p(d,C) & \text{if } p \in C_i, SC \in LC \ |C|d(p,C) & \text{if } p \in
    C_i, C_i \in LC \end{aligned} \right.$

    ```


    # Advantages and limitations


    +   - Given that clustering-based techniques are well-understood, results are
    more interpretable and there are more tools available for these techniques.

    - Many clustering-based techniques only detect clusters, and are less effective
    in unsupervised techniques compared to outlier algorithms that give scores or
    ranks to otherwise identify outliers.


    # High-dimensional-based methods


    One of the keys with distance-, density-, or even clustering-based methods, is
    the curse of dimensionality. As dimensions increase, the contrast between distances
    diminishes and the concept of neighborhood becomes less meaningful. The normal
    points in this case look like outliers and false positives increase by large volume.
    We will discuss some of the latest approaches taken in addressing this problem.


    # Inputs and outputs


    Algorithms that project data to lower-dimensional subspaces can handle missing
    data well. In these techniques, such as SOD, the number of ranges in each dimension
    becomes an input [References [25]]. When using an evolutionary algorithm, the
    number of cells with the lowest sparsity coefficients is another parameter to
    the algorithm.


    # How does it work?


    The broad idea to solve the high dimensional outlier is to:


    +   - Either have a robust distance metric coupled with all of the previous techniques,
    so that outliers can be identified in full dimensions

    - Or project data on smaller subspaces and find outliers in the smaller subspaces


    [ 130 ]'
