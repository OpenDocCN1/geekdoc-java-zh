- pgno: 111
  md: 'The statistic $T_{wilcoxon} = \min(R^*, R^*)$ is then compared to threshold
    value at alpha, $T_{wilcoxon} \le V_\alpha$ to reject the hypothesis.


    # Comparing multiple algorithms


    We will now discuss the two most common techniques used when there are more than
    two algorithms involved and we need to perform comparison across many algorithms
    for evaluation metrics.


    # ANOVA test


    These are parametric tests that assume normal distribution of the samples, that
    is, metrics we are calculating for evaluations. ANOVA test follows the same process
    as others, train the models/algorithms on similar training sets and run it on
    different validation or test sets. The main quantities computed in ANOVA are the
    metrics for each algorithm performance and then compute the overall metric means
    across all algorithms.


    Let $p_j$ be the performance metric for $i=1,2...k$ and $j=1,2...l$ for $k$ trials
    and $l$ classifiers. The mean performance of classifier $j$ on all trials and
    overall mean performance is:


    ```

    $m_j = \frac{\sum_{i=1}^k p_{ij}}{k} \quad m = \frac{\sum_{j=1}^l m_j}{l}$

    ```


    Two types of variation are evaluated. The first is within-group variation, that
    is, total deviation of each algorithm from the overall metric mean, and the second
    is between-group variation, that is, deviation of each algorithm metric mean.
    Within-group variation and between-group variation are used to compute the respective
    within- and between- sum of squares as:


    ```

    $SS_b = k \sum_j (m_j - m)^2, SS_w = \sum_j \sum_i (X_{ij} - m_j)^2$

    ```'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'Practical Approach to Real-World Supervised Learning


    Using the two sum of squares and a computation such as F-statistic, which is the
    ratio of the two, the significance test can be done at alpha values to accept
    or reject the null hypothesis:


    ```

    $f = \frac{SS_b/(l-1)}{SS_w/k(l-1)}$

    ```


    ANOVA tests have the same limitations as paired-t tests on the lines of assumptions
    of normal distribution of metrics and assuming the variances being equal.


    # Friedman''s test


    Friedman''s test is a non-parametric test for multiple algorithm comparisons and
    it has no assumption on the data distribution or variances of metrics for ANOVA.
    It uses ranks instead of the performance metrics directly for its computation.
    On each dataset or trial, the algorithms are sorted and the one is ranked 1 and
    so on for all classifiers. The average rank of an algorithm over $n$ datasets
    is computed, $R_i$. The Friedman''s statistic over $l$ classifiers is computed
    as follows and compared to alpha values to accept or reject the null hypothesis:


    ```

    $$\chi^2 = \frac{12}{nx(l+1)} \times \sum_{j=1}^{l} R_j^2 - 3 \times n \times
    (l+1)$

    ```


