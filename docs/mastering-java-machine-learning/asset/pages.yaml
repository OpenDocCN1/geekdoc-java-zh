- pgno: 5
  md: '# Foreword


    Dr. Uday Kamath is a volcano of ideas. Every time he walked into my office, we
    had fruitful and animated discussions. I have been a professor of computer science
    at George Mason Mason University (GMU) for 15 years, specializing in machine learning
    and data mining. I have known Uday for five years, first as a student in my data
    mining class, as a colleague and co-author of papers and projects on large-scale
    machine learning. While a chief data scientist at BAB Systems Applied Intelligence,
    Having earned his PhD in evolution machine learning. As having two high-demand
    jobs was not enough, Uday was manually prolific, publishing extensively with four
    different people in the computer science faculty during his tenure at less than
    four years since Uday''s graduation with a PhD, I am writing the foreword for
    his book on mastering advanced machine learning techniques with Java. Uday''s
    thirst for new stimulating challenges has struck again, resulting in this terrific
    book you now have in your hands.


    This book is of his deep interest and knowledge in sound and well-grounded theory,
    and at the same time he has grasp of the practical feasibility of proposed methodologies.
    Several books on machine learning and data analytics exist, but Uday''s book closes
    a substantial gap—the one between theory and practice. It offers a comprehensive
    and systematic analysis of classic and advanced learning techniques, with a focus
    on their advantages and limitations, practical use and implementations. This book
    is a precious resource for practitioners of data science and analytics, as well
    as for undergraduate and graduate students to master practical and efficient implementations
    of machine learning techniques.'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'The book covers the classic techniques of machine learning, such as classification,
    clustering, dimensionality, anomaly detection, semi-supervised learning, and active
    learning. It also covers advanced and recent topics, including learning with stream
    data, deep learning, and the challenges of learning with big data. Each chapter
    is dedicated to a topic and includes an illustrative case study, which covers
    state-of-the-art Java-based tools and software, and the entire knowledge discovery
    cycle: data collection, experimental design, modeling, results, and evaluation.
    Each chapter is self-contained, providing great flexibility of usage. The accompanying
    website provides the source code and data. This is truly a gem for both students
    and data analytics practitioners, who can experiment first-hand with the methods
    learned or deepen their understanding of the methods by applying them to real-world
    scenarios.


    As I was reading the various chapters of the book, I was reminded of the enthusiasm
    Uday for learning and knowledge. He communicates the concepts described in the
    book with clarity and with the same passion. I am positive that you, as a reader,
    will feel the same. I will certainly keep this book as a personal resource for
    the courses I teach, and strongly recommend it to my students.


    Dr. Carlotta Domeniconi

    Associate Professor of Computer Science, George Mason University'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# About the Authors


    Dr. Uday Kamath is the chief data scientist at BAE Systems Applied Intelligence.
    He specializes in scalable machine learning and has spent 20 years in the domain
    of AML, fraud detection in financial crime, cyber security, and bioinformatics,
    to name a few. Dr. Kamath is responsible for key products in areas focusing on
    the behavioral, social networking and big data machine learning aspects of analytics
    at BAE AI. He received his PhD at George Mason University, under the able guidance
    of Dr. Kenneth De Jong, whose dissertation research focused on machine learning
    for big data and automated sequence mining.


    I would like to thank my friend, Krishna Choppella, for accepting the offer to
    co-author this book and being an able partner on this long but satisfying journey.


    Heartfelt thanks to our reviewers, especially Dr. Samir Sahli for his valuable
    comments, suggestions, and in-depth review of the chapters. I would like to thank
    Professor Carlotta Domeniconi for her suggestions and comments that helped us
    shape various chapters in the book. I would also like to thank all the Packt staff,
    especially Divya Poojaari, Mayur Pawanikar, and Vivek Arora, for helping us complete
    the tasks in time. This book required a lot of sacrifices on the personal front
    and I would like to thank my wife, Pratitha, and my nanny, Evelyn, for their unconditional
    support. Finally, thanks to all my lovely teachers and professors for not only
    teaching the subjects, but also instilling the joy of learning.


    Krishna Choppella builds tools and client solutions in his role as architect for
    analytics at BAE Systems Applied Intelligence. He has been programming in Java
    for 20 years. His interests are data science, functional programming, and distributed
    computing.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# About the Reviewers


    Samir Sahli was awarded a BSc degree in applied mathematics and information sciences
    from the University of Nice Sophia-Antipolis, France, in 2004. He received MSc
    and PhD degrees in physics (specializing in optics/photonics/image science) from
    University Laval, Quebec, Canada, in 2008 and 2013, respectively. During his graduate
    studies, he worked with Defence Research and Development Canada (DRDC) on the
    automatic detection and recognition of targets in aerial imagery, especially in
    the context of uncontrolled environment and sub-optimal acquisition conditions.
    He has worked since 2009 as a consultant for several companies based in Europe
    and North America specializing in the area of Intelligence, Surveillance, and
    Reconnaissance (ISR) and in remote sensing.


    Dr. Sahli joined McMaster Biotonics in 2013 as a postdoctoral fellow. His research
    was in the field of optics, image processing, and machine learning. He was involved
    in several projects, such as the development of a novel generation of gastrointestinal
    tract imaging device, hyperspectral imaging of skin erythema for individualized
    radiotherapy treatment, and automatic detection of the precancerous Barrett''s
    esophageal cell using fluorescence lifetime imaging microscopy and multiphoton
    microscopy.


    Dr. Sahli joined BAE Systems Applied Intelligence in 2015. Since he has worked
    as a data scientist to develop analytics models to detect complex fraud patterns
    and money laundering schemes for insurance, banking, and governmental clients
    using machine learning, statistics, and social network analysis tools.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '**Prashant Verma** started his IT career in 2011 as a Java developer in Ericsson
    working in the telecom domain. After a couple of years of Java EE experience,
