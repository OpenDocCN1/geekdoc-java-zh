  md: '# Probabilistic Graph Modeling


    Let $N_{ij}$ be the number of times we observe variable or node $i$ in the state
    $k$, given the parent node configuration $j$:


    ```

    $N_{ij} = \sum_{k} N_{ijk}$\n\n\hat{\theta}_{ij} = \frac{N_{ijk}}{N_{ij}}$

    ```


    For example, we can have a single entry corresponding to $X_i = a$ and $parent_{X_i}
    = b$ by estimating the likelihood function from the training data:


    ```

    $L_i(\theta_{X_i=a, parent_{X_i}=b} : \mathcal{D}) = \frac{Count(X_i=a, parent_{X_i}=b)}{Count(parent_{X_i}=b)}$

    ```


    Consider two cases, as an example. In the first, $X_i=a, parent_{X_i}=b$ is satisfied
    by 10 instances with $parent_{X_i}=b=100$. In the second, $X_i=a, parent_{X_i}=b$
    is satisfied by 100 instances with $parent_{X_i}=b=1000$. Notice both probabilities
    come to the same value, whereas the second has 10 times more data and is the "more
    likely" estimate! Similarly, familiarity with domain or prior knowledge, or lack
    of it due to uncertainty, is not captured by MLE. Thus, when the number of samples
    are limited or when the domain experts are aware of the priors, then this method
    suffers from serious issues.


    # Bayesian parameter estimation for Bayesian network


    This technique overcomes the issue of prior knowledge about the parameter $\theta$
    by encoding prior distribution with a probability distribution. Thus, we can encode
    our beliefs or prior knowledge about the parameter space as a probability distribution
    and then the joint distribution of variables and parameters are used in estimation.'
