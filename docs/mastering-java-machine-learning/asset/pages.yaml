  md: '![](img/2b4ec1705c1d24bfee7a5f8594a281b5_47_0.png)


    +   - **Semi-supervised learning**: When the dataset has only some labeled data
    and a large amount of data that is not labeled, learning from such a dataset is
    called *semi-supervised learning*. When dealing with financial data with the goal
    of detecting fraud, for example, there may be a large amount of of unlabeled data
    and only a small number of known fraud and non-fraud transactions. In such cases,
    semi-supervised learning may be applied.

    - **Graph mining**: Data represented as graph structures is known as *graph mining*.
    It is the basis of social network analysis and structure analysis in different
    bioinformatics, web mining, and community mining applications.

    - **Probabilistic graph modeling and inferencing**: Learning and exploiting conditional
    dependence structures between features expressed as a graph-based model comes
    under the branch of *probabilistic graph modeling*. Bayesian networks and Markov
    random fields are two classes of models.

    - **Time-series forecasting**: This refers to a form of learning where data has
    distinct temporal behavior and the relationship with time is modeled. A common
    example is in financial forecasting, where the performance of stocks in a certain
    sector may be the target of the predictive model.

    - **Association analysis**: This is a form of learning where data is in the form
    of an item set or market basket, and association rules are modeled to explore
    and predict the relationships between the items. A common example in association
    analysis is to learn the relationships between the most common items bought by
    customers when they visit the grocery store.'
  merge: -1
  img_proc: true
