    $N(\mathbf{x}) = \frac{1}{(2\pi)^{\frac{d}{2}}\|Sigma\|} e^{-\frac{1}{2}(\mathbf{x}-\mu)^T\Sigma^{-1}(\mathbf{x}-\mu)}$

    ```


    with the mean $\mu$ and covariance $\Sigma$


    The Mahalanobis distance can be the estimate of the data point from the distribution
    given by the equation $(\mathbf{x}-\mu)^T\Sigma^{-1}(\mathbf{x}-\mu)$. Some variants
    such as **Minimum Covariant Determinant (MCD)** are also used when Mahalanobis
    distance is affected by


    A non-parametric method involves techniques such as constructing histograms for
    every feature using frequency or width-based methods. When the rate of the data
    in a bin to that of the average over the histogram is below a user defined threshold,
    such a bin is termed sparse. A lower probability of feature results in a higher
    outlier score. The total outlier score can be computed as:


    ```

    $OutlierScore = \sum_{f \in F} W_f \frac{(1-p_f)}{|F|}$

    ```


    Here, $w_f$ is the weight given to feature $f$, $p_f$ is the probability of the
    value of the feature in the test data point, and $F$ is the sum of weights of
    the feature set. Kernel Density Estimations are also used in non-parametric methods
    using user-defined kernels and bandwidth.


    # ## Advantages and limitations


    +   - When the model fits or distribution of the data is known, these methods
    are very efficient as you don''t have to store entire data, just the key statistics
    for doing tests.


    +   - Assumptions of distribution, however, can pose a big issue in parametric
    methods. Most non-parametric methods using kernel density estimates doesn''t scale
    well with large datasets.


    # ## Distance-based methods


    Distance-based algorithms work under the general assumption that normal data has
    other data points closer to it while anomalous data is well isolated from its
    neighbors (References [20]).'
