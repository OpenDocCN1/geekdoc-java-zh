  md: '# Maximum entropy Markov models for NER


    Maximum entropy Markov model (MEMM) is a popular NER technique that uses the concept
    of Markov chains and maximum entropy models to learn and predict the named entities
    (References [16] and [17]).


    # Input and output


    The training data consists of text sequences x = {x₁, x₂, ..., x_ⱼ} where each
    x is a word in the text sequence and labels for each word are available as y =
    {y₁, y₂, ..., y_ⱼ}. The algorithm generates models so that, on testing on unseen
    data, the labels for new sequences can be generated.


    # How does it work?


    The following illustrate how the MEMM method is used for learning entities.


    +   1. The featuresCapitalized, and so on, which is it bit a more context and
    improves performance compared to HMM, where it is word-based.

    2. Next, let us look at a maximum entropy model known as a MaxEnt model, which
    is an exponential probabilistic model, but which can also be seen as a multinomial
    logistic regression model. In basic MaxEnt models, given the features [f₁, f₂,
    ..., fⱼ] and classes c₁, c₂, ..., cⱼ, weights for these features are learned {w₁,
    w₂, ..., wⱼ} per class using optimization methods from the training data, the
    probability of a particular class can be estimated as:


    ```

    $p(c|x) = \frac{\exp(\sum_{i=0}^N w_{ci}f_i)}{\sum_{c'' \in c} \exp(\sum_{i=0}^N
    w_{c''i}f_i)}$

    ```


    +   3. The feature f, is formally written as (f, x), which means the feature f
    for class c and observation x. The f(c, x) is generally binary with values 1/0
    in most NER models. Thus, it can be written as:


    ```

    $p(c|x) = \frac{\exp(\sum_{i=0}^N w_{ci}f_i(c,x))}{\sum_{c'' \in c} \exp(\sum_{i=0}^N
    w_{c''i}f_i(c,x))}$

    ```'
