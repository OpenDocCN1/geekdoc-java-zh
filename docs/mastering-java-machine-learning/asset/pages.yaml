    LSA has been shown to be a very effective way of reducing the dimensions and also
    of improving the predictive performance in models. The disadvantage of LSA is
    that storage of both vectors U and V is needed for performing retrievals or queries.
    Determining the lower dimension k is hard and needs some heuristics similar to
