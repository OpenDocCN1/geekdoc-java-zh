  md: '# Factors


    Factors are the basic building blocks for defining the probability distributions
    in high-dimensional (large number of variables) spaces. They give basic operations
    that help in manipulating the probability distributions.


    A "factor" is defined as a function that takes as input the random variables known
    as "scope" and gives a real-valued output.


    Formally, a factor is represented as $\phi(X_1, X_2, ... X_k) : Val(X_1, X_2,
    ... X_k) \to \mathbb{R}$ where scope is $(X_s, X_w \dots X_k)$.


    # Factor types


    Different types of factors are as follows:


    +   - **Joint distribution**: For every combination of variables, you get a real-valued
    output.

    - **Unnormalized measure**: When, in a joint distribution, one of the variables
    is constant, the output is also real-valued, but it is unnormalized as it doesn''t
    sum to one. However, it is still a factor.

    - **Conditional probability distribution**: A probability distribution of the
    form $P(G|I)$ is also a factor.


    +   - **Factor product**: If two factors $\phi_1(X_i, X_r)$ and $\phi_2(X_r, X_j)$
    are multiplied, it gives rise to $\phi(X_i, X_r, X_j)$. In effect, it is taking
    tables corresponding to $\phi_1$ and multiplying with $\phi_2$.

    - **Factor marginalization**: This is the same as marginalization, where $\phi_1(X_i,
    X_r)$ can be marginalized over a variable, say $X_r$, to give $\phi_2(X_i, X_j)$.

    - **Factor reduction**: This is only taking the values of other variables when
    one of variables is constant.


    Various operations are performed on factors, such as:


    # Distribution queries


    Given the probability over random variables, many queries can be performed to
    answer certain questions. Some common types of queries are explained in the subsequent
    sections.'
