- pgno: 204
  md: '# Machine learning mapping


    To illustrate the techniques learned in this chapter so far, we will use SSL to
    classify. Whereas the dataset contains labels for all the examples, in order to
    treat this as a problem where we can apply SSL, we will consider a fraction of
    the data to be unlabeled. In fact, we run multiple experiments using different
    fractions of unlabeled data for comparison. The different base learners used are
    classification algorithms familiar to us from previous chapters.


    # Data collection


    This dataset was collected by the University of Wisconsin Hospitals, Madison.
    The dataset is available in Weka AARF format. The data is not partitioned into
    training, validation and test.


    # Data quality analysis


    The examples in the data contain no unique identifier. There are 16 examples for
    the Bare Nuclei attribute has missing values. The target Class is the only categorical
    attribute and has two values. All other attributes are continuous and in the range
    [1, 10].


    # Data sampling and transformation


    In the experiments, we present results for 10-fold cross-validation. For comparison,
    four runs were performed each using a different fraction of labeled data — 10%,
    20%, 30%, and 40%.


    A numeric sample code number was added to each example as a unique identifier.
    The categorical values Malignant and Benign, for the class attribute, were replaced
    by the numeric values 4 and 2 respectively.


    # Datasets and analysis


    The Cancer Dataset Wisconsin (Original) is available from the UCI Machine Learning
    Repository at https://archive.ics.uci.edu/ml/datasets/Breast+Cancer+Wisconsin+Original.


    This database was originally obtained from the University of Wisconsin Hospitals,
    Madison from Dr. William H. Wolberg. The dataset was created by Dr. Wolberg for
    the diagnosis and prognosis of breast tumors. The data is based exclusively on
    measurements involving the Fine Needle Aspirate (FNA) test. In this test, fluid
    from a breast mass is extracted using a small-gauge needle and then visually examined
    under a microscope.'
