- pgno: 101
  md: '# Ensemble learning and meta learners


    Combining multiple algorithms or models to classify instead of relying on just
    one is known as ensemble learning. It helps to combine various models as each
    model can be considered – at a high level – as an expert in detecting specific
    patterns in the whole dataset. Each base learner can be made to learn on slightly
    different datasets too. Finally, the results from all models are combined to perform
    prediction. Based on how similar the algorithms used in combination are, how the
    training dataset is presented to each algorithm, and how the algorithms combine
    the results to finally classify the unseen dataset, there are many branches of
    ensemble learning.


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_101_0.png)


    Some common types of ensemble learning are:


    +   - Different learning algorithms

    - Same learning algorithms, but with different parameter choices

    - Different learning algorithms on different feature sets

    - Different learning algorithms with different training data'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Bootstrap aggregating and bagging


    It is one of the most commonly used ensemble methods for dividing the data in
    different samples and building classifiers on each sample.


    # Algorithm inputs and outputs


    The input is constrained by the choice of the base learner – if using Decision
    Trees there are basically no restrictions. The method outputs class membership
    with the probability distribution for classes.


    # How does it work?


    The core idea of bagging is to apply the bootstrapping estimation to different
    learners that have high variance, such as Decision Trees. Bagging is any statistical
    measure that depends on random sampling with replacement. The entire data is split
    into different samples using bootstrapping and for each sample, a model is built
    using the base learner. Finally, while predicting, the average prediction is arrived
    at using a majority vote – this is one technique to combine all learners.


    # Random Forest


    Random Forest is an improvement over basic Decision Trees. Even with bagging,
    the basic Decision Tree has a choice of all the features at every split point
    in creating a tree. Because of this, even with different samples, many trees can
    form highly correlated submodels, which causes the performance of bagging to deteriorate.
    By giving random features to models in addition to a random dataset, the correlation
    between the submodels reduces and Random Forest shows much better performance
    compared to basic trees. Each tree in Random Forest grows its structure on the
    random features, thereby minimizing the bias; combining many such trees reduces
    the variance [References]. Random Forest is also used to measure feature relevance
    by averaging the impurity decrease in the trees and ranking across all the features
    to give the relative importance of each.


    # Advantages and limitations


    +   - Better generalization than the single base learner. Overcomes the issue
    of overfitting of base learners.


    +   - Interpretability of bagging is very low as it works as meta learner combining
    even the interpretable learners.


    +   - Like most other ensemble learners, Bagging is resilient to noise and outliers.


    +   - Random Forest generally does not tend to overfit the training data isid.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Boosting


    # Algorithm inputs and outputs


    The input is constrained by the choice of the base learner used — if Decision
    Trees are basically no restrictions. Output class membership along with probability
    distribution for classes.


    # How does it work?


    The basic idea behind boosting is iterative reweighting of input samples to create
    new distribution of the data for learning a model from a simple base learner in
    every iteration.


    Initially, all the instances are uniformly weighted with weights $D_0 = \frac{1}{n}$
    and at every iteration $t$, the population is resampled or reweighted as


    $D_{t+1} = \frac{D_t(i)}{z_t}(\exp(-\alpha_t h_t y_i(x_i))) \text{ where } \alpha_t
    = \ln \frac{1-errD_t(h_t)}{errD_t(h_t)} \text{ and } Z_t \text{ is the} normalization
    constant.


    The final model works as a linear combination of all the models learned in the
    iteration:


    $G(\mathbf{x}) = sign\left(\sum_{t=1}^T \alpha_t h_t(\mathbf{x})\right)$


    The reweighting and resampling of the data in each iteration is based on "errors";
    the data points that result in errors are sampled more or have larger weights.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'Practical Approach to Real-World Supervised Learning


    # # Advantages and limitations


    +   - Better generalization than the base learner and overcomes the issue of overfitting
    very effectively.

    - Some boosting algorithms such as AdaBoost can be susceptible to uniform noise.
    There are variants of boosting such as ''GentleBoost'' and ''BrownBoost'' that
    decrease the effect of outliers.

    - Boosting has a theoretical bounds and guarantee on the error estimation making
    it a statistically robust algorithm.


    # # Model assessment, evaluation, and comparisons


    The key ideas discussed here:


    +   - How to assess or estimate the performance of the classifier on unseen datasets
    that will be predicting on future unseen datasets.

    - What are the metrics that we should use to assess the performance of the model?

    - How do we compare algorithms if we have to choose between them?


    # # Model assessment


    In order to train the model(s), tune the model parameters, select the models,
    and finally estimate the predictive behavior of models on unseen data, we need
    many datasets. We cannot train the model on one set of data and estimate its behavior
    on the same set of data, as it will have a clear optimistic bias and estimations
    will be unlikely to match the behavior in the unseen data. So at a minimum, there
    is a need to partition data available into training sets and testing sets. Also,
    we need to tune the parameters of the model and test the effect of the tuning
    on a separate dataset before we perform testing on the test set. The same argument
    of optimistic bias and wrong estimation applies if we use the same dataset for
    training, parameter tuning, and testing. Thus there is a theoretical and practical
    need to have three datasets, that is, training, validation, and testing.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'The models are trained on the training set, the effect of different parameters
    on the training set are validated on the validation set, and the finalized model
    with the selected parameters is run on the test set to gauge the performance of
    the model on future unseen data. When the dataset is not large enough, or is large
    but the imbalance between classes is wide, that is, one class is present only
    in a small fraction of the total population, we cannot create too many samples.
    Recall that one of the steps in our methodology is to create different data samples
    and datasets. If the training data is large and has a good proportion of data
    and class ratios, creating these three sets using random stratified partitioning
    is the most common option. In certain datasets, that seasonality and time-dependent
    behaviors, creating time bounds is a common practice. In many cases, when the
    dataset is not large enough, only two partitions are created, and training and
    testing is used for testing. The training dataset ranges roughly from 66% to 80%
    while the rest is used for testing. The validation set is created from the training
    dataset using the k-fold cross-validation technique. The training dataset is split
    k times, each time producing k/k random I/testing data samples, and the average
    metrics of performance needed is generated. This way the limited training data
    is partitioned k times and average performance across different split of training/testing
    is used for gauging the effect of the parameters. Using 10-fold cross-validation
    is the most common practice employed in cross-validation.


    # # Model evaluation metrics


    The next important decision when tuning parameters or selecting models is to base
    your decision on certain performance metrics. In classification learning, there
    are different metrics on which you can base your decision, depending on the business
    requirement. For example, in certain domains, not missing a single true positive
    is the most important concern, while in other domains where humans are involved
    in adjudicating results of models, having too many false positives is the greater
    concern. In cases, overall accuracy is considered more vital. In highly imbalanced
    datasets such as fraud or cyber attacks, there are just a handful of instances
    of one class and millions of the other classes. In such cases accuracy gives a
    wrong indication of model performance and some other metrics such as precision,
    true positive ratio, or area under the curve are used as metrics.'
