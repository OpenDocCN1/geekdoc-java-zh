  md: '![](img/2b4ec1705c1d24bfee7a5f8594a281b5_481_0.png)


    # # Data acquisition


    In the Big Data framework, the acquisition component plays an important role in
    collecting the data from disparate source systems and storing it in Big Data storage.
    Based on types of volume, velocity, functional, and performance-based requirements,
    there are a variety of acquisition frameworks and tools. We describe a few of
    the most well-known frameworks and tools used to give readers some insight.


    # # Publish-subscribe frameworks


    In publish-subscribe based frameworks, the publishing pushes the data in different
    formats to the broker, which has different subscribers waiting to consume them.
    The publisher and subscriber are unaware of each other, with the broker mediating
    between them.


    **Apache Kafka** (References [9]) and **Amazon Kinesis** are two well-known implementations
    that are built on this model. Apache Kafka defines the concepts of publishers,
    consumers, and topics – on which things get published and consumed – and a broker
    to manage the topics. Amazon Kinesis is built on similar concepts with producers
    and consumers connected through Kinesis streams, which are similar to topics in
    Kafka.'
  merge: -1
  img_proc: true
- pgno: 482
  md: 'Big Data Machine Learning – The Final Frontier


    # Source-sink frameworks


    In-sink models, sources push the data into the framework and the framework pushes
    the system to the sinks. Apache Flume (References [7]) is a well-known implementation
    of this kind of framework with a variety of sources, channels to buffer the data,
    and a number of sinks to store the data in the Big Data world.


    # SQL frameworks


    Since many traditional data stores are in the form of SQL-based RDBMS, SQL-based
    frameworks provide a generic way to import the data from RDBMS and store it in
    Big Data, mainly in the HDFS format. Apache Sqoop (References [10]) is a well-known
    implementation that can import data from any JDBC-based RDBMS and store it in
    HDFS-based systems.


    # Message queuing frameworks


    Message queuing frameworks are push-pull frameworks similar to publisher-subscriber
    systems. Message queues separate the producers and consumers and store the data
    in the queue, in an asynchronous communication pattern. Many protocols have been
    developed on this such as Advanced Message Queuing Protocol (AMQP) and ZeroMQ
    Message Transfer Protocol (ZMTP). RabbitMQ, ZeroMQ, Amazon SQS, and so on, are
    well-known implementations of this framework.


    # Custom frameworks


    Specialized connectors for different sources such as IoT, HTTP, WebSockets, and
    so on, have resulted in many specific connectors such as Amazon IoT Hub, REST-connectors,
    WebSocket, and so on.


    # Data storage


    The data storage component plays a key part in connecting the acquisition and
    the rest of the components together. Performance, impact on data processing, cost,
    high-availability, ease of management, and so, should be taken into consideration
    while deciding on data storage. For pure real-time or near real-time systems there
    are in-memory based for storage, but for batch-based systems there are mainly
    distributed File Systems such as HDFS or NoSQL.


    # HDFS


    HDFS can run on a large cluster of nodes and provide all the important features
    as as high-throughput, replications, fail-over, and so, on.'
  merge: -1
  img_proc: true
- pgno: 483
  md: '# Chapter 9


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_483_0.png)


    The basic architecture of HDFS has the following components:


    +   * **NameNode**: The HDFS client always sends the request to the NameNode,
    which keeps the metadata of the file while the real data is distributed in blocks
    on DataNodes. NameNodes are only responsible for handling opening and closing
    a file while the remaining interactions of reading, writing, and appending between
    clients and the data nodes. The NameNode stores the metadata in two files: `fsimage`
    and edit files. The fsimage contains the filesystem metadata as a snapshot, while
    edit files contain the incremental changes to the metadata.

    * **Secondary NameNode**: Secondary NameNode provides redundancy to the metadata
    in the NameNode by keeping a copy of the fsimage and edit files at every predefined
    checkpoint.

    * **DataNode**: DataNodes manage the actual blocks of data and facilitate read-write
    operation on these datablocks. DataNodes keep communicating with the NameNodes
    via heartbeat signals indicating they are alive. The data stored in DataNodes
    are also replicated for redundancy. Replication of the data blocks in the DataNodes
    is governed by the rack-awareness policy.


    # NoSQL


    Non-relational databases, also referred to as NoSQL databases, are gaining enormous
    popularity in the Big Data world. High throughput, better horizontal scaling,
    improved performance on retrieval, and storage at the cost of weaker consistency
    models are notable characteristics of most NoSQL databases. We will discuss some
    important forms of NoSQL database in this section along with implementations.'
  merge: -1
  img_proc: true
- pgno: 484
  md: 'Big Data Machine Learning – The Final Frontier


    # Key-value databases


    Key-value databases are the most prominent NoSQL databases used mostly for semi-structured
    or unstructured data. As the name suggests, the structure of storage is quite
    basic, with unique keys associating the data values that can be of any type including
    string, integer, double, precision and so on – HBase. Hashing the keys for quick
    lookup and retrieval of the values together with partitioning the data across
    nodes gives high throughput and scalability. The query capabilities are very limited.
    Amazon DynamoDB, Oracle NoSQL, MemcacheDB, and so on, are examples of key-value
    databases.


    # Document databases


    Document databases store semi-structured data in the form of XML, JSON, or YAML
    documents, to name some of the most popular formats. Though it is possible to
    store documents in key-value stores, the query capabilities offered by document
    stores are greater than the primitives making up the structure of the document—which
    include names or attributes—can also be used for retrieval. When the data is ever-changing
    and has variable numbers or lengths of fields, document databases are often a
    good choice. Document databases offer join capabilities and hence all information
    needs to be captured in the document values. MongoDB, ElasticSearch, Apache Solr,
    and so on, are well-known implementations of document databases.


    # Columnar databases


    The use of columns as the basic unit of storage with name, value, and often timestamp,
    differentiates columnar databases from traditional relational databases. Columns
    are further combined to form column families. A row is indexed by the key and
    has multiple column families associated with the row. Rows can use only column
    families that are populated, giving it a good storage representation in sparse
    data. Columnar databases do not have fixed schema-like databases; new columns
    and families can be added at any time, giving them a significant advantage. HBase,
    Cassandra, and Parquet are some well-known implementations of columnar databases.


    # Graph databases


    In many applications, the data has an inherent graph structure with nodes and
    links. Storing such data in graph databases makes it more efficient for storage,
    retrieval, and queries. The nodes have a set of attributes and generally represent
    entities, while links represent relationships between the nodes that can be directed
    or undirected. Neo4J, OrientDB, and ArangoDB are some well-known implementations
    of graph databases.


    — 448 —'
  merge: -1
  img_proc: true
- pgno: 485
  md: '# Data processing and preparation


    The data preparation step involves various preprocessing steps before the data
    is ready to be consumed by analytics and machine learning algorithms. Some of
    the key tasks involved are:


    +   - Data cleansing: Involves everything from correcting errors, type matching,
    normalization of elements, and so on, on the raw data.

    - Data scraping and curating: Converting data elements and normalizing the data
    from one to another.

    - Data transformation: Many analytical algorithms need features that are aggregates
    built on raw or historical data. Transforming and computing those extra features
    are done in this step.


    # Hive and HQL


    Apache Hive [References [11]] is a powerful tool for performing various preparation
    activities in HDFS systems. Hive organizes the underlying HDFS data structure
    similar to relational databases. HQL is like SQL and helps in performing various
    aggregates, transformations, cleanup, and normalization, and the data is then
    serialized back to HDFS. The logical tables in Hive are partitioned across and
    sub-divided into buckets for speed-up. Complex joins and aggregate queries in
    Hive are automatically converted into MapReduce jobs for throughput and speed-up.


    # Spark SQL


    Spark SQL, which is a major component of Apache Spark [References [1] and [2]],
    provides SQL-like functionality—similar to what HQL provides—for performing changes
    to the Big Data. Spark SQL can work with underlying data storage systems such
    as Hive or NoSQL databases such as Parquet. We will touch upon some aspects of
    Spark SQL in the section Spark later.


    # Amazon Redshift


    Amazon Redshift provides several warehousing capabilities especially on Amazon
    EMR setups. It can process petabytes of data using its massively parallel processing
    (MPP) data warehouse architecture.'
  merge: -1
  img_proc: true
- pgno: 486
  md: 'Big Data Machine Learning – The Final Frontier


    # Real-time stream processing


    In many Big Data deployments, processing and performing the transformations specified
    previously must be done on the stream of real time rather than from stored data.
    There are various Stream Processing Engines (SPE) such as Apache Storm [References
    [12]] and Apache Samza, and in-memory processing engines such as Spark-Streaming
    that are used for stream processing.


    # Machine Learning


    Machine learning helps to perform descriptive, predictive, and prescriptive analysis
    on Big Data. There are two broad extremes that will be covered in this chapter:


    +   - Machine learning can be done on batch historical data and then the learning/models
    can be applied to new batch/real-time data

    - Machine learning can be done on real-time data and applied simultaneously to
    the real-time data


    Both topics are covered at length in the remainder of this chapter.


    # Visualization and analysis


    With batch learning done at modeling time and real-time learning done at runtime,
    predictions–the output of applying the models to new data–must be stored in some
    data structure and then analyzed by the users. Visualization tools and other reporting
    tools are frequently used to extract and present information to the users. Based
    on the domain and the requirements of the users, the analysis and visualization
    can be static, dynamic, or interactive.


    Lightning is a framework for performing interactive visualizations on the Web
    with different binding APIs using REST for Python, R, Scala, and JavaScript languages.


    Pygal and Seaborn are Python-based libraries that help in plotting all possible
    charts and graphs in Python for analysis, reporting, and visualizations.'
  merge: -1
  img_proc: true
