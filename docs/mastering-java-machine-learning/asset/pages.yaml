- pgno: 445
  md: '# Text clustering


    The goal of clustering, as seen in Chapter 3, Unsupervised Machine Learning Techniques,
    is to find groups of data, text, or documents that are similar to one another
    within the group. The granularity of unstructured data can vary from small phrases
    or sentences, paragraphs, and passages of text to a collection of documents. Text
    clustering finds its application in many domains, such as information retrieval,
    summarization, topic modeling, and document classification in unsupervised situations,
    to name a few. Traditional techniques in clustering can be employed once the unstructured
    text is transformed into structured data via preprocessing. The difficulty with
    traditional clustering techniques is the high-dimensional and sparse nature of
    the dataset obtained using the transformed document-term matrix representation.
    Many traditional clustering algorithms work only on numeric values of features.
    Because of this constraint, categorical or binary representation of terms cannot
    be used and often TF or TF-IDF are used for representation of the document-term
    matrix.


    In this section, we will discuss some of the basic processes and techniques in
    clustering. We will start with pre-processing and transformations and then discuss
    some techniques that are widely used and the modifications made to them.


    # Feature transformation, selection, and reduction


    Most of the pre-processing steps discussed in this section are normally used to
    get either unigram or n-gram representation of terms in documents. Dimensionality
    reduction techniques, such as LSA, are often employed to transform the features
    into smaller latent space.


    # Clustering techniques


    The techniques for clustering in text include probabilistic models, as well as
    those that use distance-based methods, which are familiar to us from when we learned
    structured data. We will also discuss Non-negative Matrix Factorization (NMF)
    as an effective technique with good performance and interpretability.'
  merge: -1
  img_proc: true
- pgno: 446
  md: '# Generative probabilistic models


    There is commonality between topic modeling and text clustering in generative
    methods. As shown in the following figure, clustering associates a document with
    a single cluster (generally), compared to topic modeling where each document can
    have a probability of coverage in multiple topics. Every word in topic modeling
    can be generated by multiple topics in an independent manner, whereas the words
    are generated from the same cluster:


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_446_0.png)


    Mathematically, this can be explained using two topics T = {T_1, T_2} and two
    clusters c = {c_1, c_2}.


    In clustering, the likelihood of the document can be given as:


    $p(d) = p(c_1)p(d|c_1) + p(c_2)p(d|c_2)$


    If the document has l, terms, then it can be expanded as:


    $p(d) = p(t_1, t_2, ..., t_l) = p(c_1)\prod_{i=1}^{l}p(t_i|c_1) + p(c_2)\prod_{i=1}^{l}p(t_i|c_2)$


    Thus, once you "assume" a cluster, all words come from that cluster. The product
    of all terms is computed, followed by the summation across all clusters.'
  merge: -1
  img_proc: true
- pgno: 447
  md: 'In topic modeling, the likelihood of the document can be given as:


    ```

    p(d) = p(t_1, t_2, ..., t_l) = \prod_{i=1}^{l} p(T_i) p(t_i|T_1) + p(T_2) p(t_i|T_2)

    ```


    Thus, each term, can be picked independently from topics and hence summation is
    done inside and the product is done outside.


    # Input and output


    The inputs are:


    +   - A collection of documents following a certain format and structure expressed
    with the following notation:


    D = [d_r1, d_r2 ... d_rn]]

    - The number of clusters that need to be modeled or discovered as k.


    The output is:


    +   - k clusters identified c = [c_r1, c_r2 ... c_rk]

    - For each document, p(d) is mapped to one of the clusters k.


    # How does it work?


    Here are the steps:


    +   1. Basic preprocessing steps as discussed previously, such as tokenization,
    stop words removal, stemming, dictionary of words formation, feature extraction
    (unigrams or n-grams, and so on) of terms, feature transformations (LSA), and
    even feature selection. Let the l in the final set; they correspond to the dictionary
    or vocabulary V.

    2. Similar to PLSA, we introduce a "latent variable", z, which helps us to select
    whether the document belonging to the cluster falls in the range of z=[1, 2, ...
    k] corresponding to the clusters. Let the theta be the parameter we estimate for
    each latent variable such that p(theta) corresponds to the probability of cluster
    z = i.'
