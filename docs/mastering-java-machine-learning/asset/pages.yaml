- pgno: 247
  md: '# Advantages and limitations


    The advantages and limitations are as follows:


    +   - Again, the performance is determined by the choice of the multiple learners,
    their types and the particular domain of the problem. The different methods described
    in the section on model validation techniques help us in choosing the learners.

    - Oza''s Online Boosting has been shown theoretically and empirically not to be
    "lossless"; that is, the model is different compared to its batch version. Thus,
    suffers from performance issues and different extensions have been studied in
    recent years to improve performance.


    # Validation, evaluation, and comparisons in online setting


    In contrast to the modes of machine learning we saw in the previous chapters,
    stream learning presents unique challenges to performing the core steps of validation
    and evaluation. The fact that we are no longer dealing with batch data means the
    standard techniques for validation evaluation and model comparison must be adapted
    for incremental learning.


    # Model validation techniques


    In the off-line or the batch setting, we discussed various methods of tuning the
    parameters of the algorithm or testing the generalization capability of the algorithms
    as a counter-measure against overfitting. Some of the techniques in the batch
    labeled data, as cross-validation, are not directly applicable in the online or
    stream settings. The most common techniques used in online or stream settings
    are given next.


    # Prequential evaluation


    The presequential evaluation method is a method where instances are provided to
    the algorithm and the output prediction of the algorithm is then measured in comparison
    with the actual label using a loss function. Thus, the algorithm is always tested
    on the unseen data and needs no "holdout" data to estimate the generalization.
    The presequential error is computed based on the sum of the accumulated loss function
    between actual values and predicted values, given by:


    ```

    P = \sum_{i=1}^{N} l(y_i, \hat{y}_i)

    ```'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Real-Time Stream Machine Learning


    Three variations of basic preential evaluation are done for better estimation
    on changing data, which are:


    +   * Using Landmark Window (basic)

    * Using Sliding Window

    * Using forgetting mechanism


    The last two methods are extensions of previously described techniques where you
    put weights or fading factors on the predictions that reduce over time.


    # Holdout evaluation


    This is the extension of the holdout mechanism or "independent test set" methodology
    of the batch learning. Here the total labeled or stream data is separated into
    training and testing sets, either based on some fixed intervals or the number
    of examples/instances the algorithm seen. Imagine a continuous stream of data
    and we well-known intervals at $t=t_{start+trainingIntervalEnd}$ and $t=t_{trainingIntervalEnd+testingIntervalEnd}$
    to compare the metrics, as discussed in next section, for performance.


    # Controlled permutations


    The issue with the aforementioned mechanisms is that they provide "average" behavior
    over time and can mask some basic issues such as the algorithm doing well at the
    start and very poorly at the end due to drift, for example. The advantage of the
    preceding methods is that they can be applied to real streams to get estimates.
    One way to overcome the disadvantage is to create different random sets of data
    where the order is shuffled a bit while maintaining the proximity in time and
    the evaluation is done over a number of these random sets.


    # Evaluation criteria


    Most of the evaluation criteria are the same as described in the chapter on supervised
    learning and should be chosen based on the business problem, the mapping of the
    business problem to the machine learning techniques, and on the benefits derived.
    In this section, the most commonly used online supervised learning evaluation
    criteria are summarized for the reader:


    +   * Accuracy: A measure of getting the true positives and true negatives correctly
    classified by the learning algorithm:


    ```

    Accuracy = \frac{\sum True Positive + \sum True Negative}{\sum Total Data}

    ```


    [ 212 ]'
  merge: -1
  img_proc: true
- pgno: 249
  md: '+   **Balanced accuracy:** When the classes are imbalanced, balanced accuracy
    is often used as a measure. Balanced accuracy is an arithmetic mean of specificity
    and sensitivity. It can also be thought of as accuracy when positive and negative
    instances are drawn from the same probability in a binary classification problem.


    +   **Area under the ROC curve (AUC):** Area under the ROC curve gives a good
    measure of generalization of the algorithm. Closer to 1.0 means the algorithm
    has good generalization capability while 0.5 means it is closer to a random guess.


    +   **Kappa statistic (K):** The Kappa statistic is used to measure the observed
    accuracy with the expected accuracy of random guessing in the classification.
    In online learning, the Kappa statistic is used by computing the preential accuracy
    ($p_t$) and the random classifier accuracy ($p$) and is given by:


    ```

    $K = \frac{p_o - p_e}{1 - p_e}$$

    ```


    +   **Kappa Plus statistic:** The Kappa Plus is a modification to the Kappa statistic
    obtained by replacing the random classifier by the persistent classifier. The
    persistent classifier is a classifier which predicts the next instance based on
    the label or outcome of the previous instance.


    When considering "drift" or change in the concept as discussed earlier, in addition
    to these standard measures, some well-known measures are given to give a quantitative
    measure:


    +   **Probability of true change detection:** Usually, measured with synthetic
    data or data where the changes are known. It gives the ability of the learning
    algorithm to detect the change.


    +   **Probability of false alarm:** Instead of using the False Positive Rate in
    the off-line setting, the online setting uses the inverse of *time to detection*
    or the *average run length* which is computed using the expected time between
    false positive detections.


    +   **Delay of detection:** This is measured as the time required, terms of instances,
    to identify the drift.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Comparing algorithms and metrics


    When comparing classifiers or learners in online settings, the usual mechanism
    is the method of taking a performance metric, such as the error rate, and using
    a statistical test adapted to online learning. Two widely used methods are described
    next:


    +   - **McNem test**: McNemar''s test is a non-parametric statistical test normally
    employed to compare two classifiers'' evaluation metrics, as "error rate", by
    storing simple statistics about the two classifiers. By computing statistic $a$,
    the number of correctly classified points by one algorithm that are incorrectly
    classified by the other, and statistic $b$, which is the inverse, we obtain the
    McNemar''s test as:


    ```

    $$\chi^2$$

    ```


    The test follows a $\chi^2$ distribution and the p-value can be used to check
    for statistical significance.


    +   - **Nemenyi test**: When there are multiple algorithms and multiple datasets,
    we use the Nemenyi test for statistical significance, which is based on average
    ranks across all. Two algorithms are considered to be performing differently in
    a statistically significant way if the ranks differ by a critical difference given
    by:


    > $CriticalDifference = q_{\alpha} \sqrt{k(k+1)/6N}$


    Here, $K$=number of algorithms, $N$=number of datasets.


    The critical difference values are assumed to follow a Student-T distribution.


    # Incremental unsupervised learning using clustering


    The concept behind clustering in a data stream remains the same as in batch or
    offline modes; finding clusters or patterns which group together in the data while
    keeping the limits on finite memory and time required to process constraints.
    Doing single-pass modifications to existing algorithms or keeping a small memory
    buffer to do mini-batch versions of existing algorithms, constitute the basic
    changes done in all the algorithms to make them suitable for stream or real-time
    unsupervised learning.'
  merge: -1
  img_proc: true
- pgno: 251
  md: "# Modeling techniques\n\nThe Clustering modeling techniques for online learning\
    \ are divided into partition-based, hierarchical-based, density-based, and grid-based,\
    \ similar to the case of batch-clustering.\n\n# Partition based\n\nThe concept\
    \ of partition-based algorithms is similar to batch-based clustering where k clusters\
    \ are formed to optimize certain objective functions such as minimizing the intra-cluster\
    \ distance, maximizing the intra-cluster cluster, and so on.\n\n# Online k-Means\n\
    \nk-Means is the most popular clustering algorithm, which partitions the data\
    \ into user-specified k clusters, to minimize the squared error or distance between\
    \ centroids and cluster assigned points. We will illustrate a very basic adaptation\
    \ of k-Means, of which several variants exist.\n\n# Inputs and outputs\n\nMainly,\
    \ numeric features are considered as inputs; a few tools take categorical features\
    \ and convert them into some form of numeric representation. The algorithm itself\
    \ takes the parameters' number of clusters k and number of max iterations n as\
    \ inputs.\n\n# How does it work?\n\n+   1. The input data stream is considered\
    \ to be infinite but of constant block size.\n2. A memory buffer of the block\
    \ size is kept reserved to store the data or a compressed representation of the\
    \ data.\n3. Initially, the first stream of data of block size is used to find\
    \ the k centroids of the clusters, the centroid information is stored and the\
    \ buffer is cleared.\n4. For the next data after it reaches the block size:\n\
    \   1. For each max number of iterations or until there is no change in the centroids;\n\
    \   2. Execute k-Means with buffer data and the present centroids.\n   3. Minimize\
    \ sum error between centroids and data assigned to the cluster.\n   4. After the\
    \ iterations, the buffer is cleared and new centroids are obtained.\n5. Repeat\
    \ step 4 until the data is no longer available."
  merge: -1
  img_proc: true
- pgno: 252
  md: '# Advantages and limitations


    The advantages and limitations are as follows:


    +   - Similar to batch-based, the shape of the detected cluster depends on the
    distance measure and is not appropriate in problem domains with irregular shapes.

    - The choice of parameter **k**, as in batch-based, can limit the performance
    in datasets with distinct patterns or clusters.

    - Outliers and missing data can pose lots of irregularities in clustering behavior
    of k-Means.

    - If the selected buffer size or the block size of the stream on which iterative
    k-Means runs is small, it will not find the right clusters. It can result in slowdown
    or missed changes in the data. Extensions such as **Very Fast k-Means Algorithm
    (VFKM)**, which uses the Hoeffding bound to determine the buffer size, overcome
    this limitation to a large extent.


    # Hierarchical based and micro clustering


    Hierarchical methods are normally based on **Clustering Features (CF)** and **Clustering
    Trees (CT)**. We will describe the basics and elements of hierarchical clustering
    and the BIRCH algorithm, the extension of which the CluStream algorithm is based
    on.


    The Clustering Feature is to compute and preserve a summarization statistic about
    the cluster in a compressed way rather than holding on the whole data belonging
    to the cluster. In a **d** dimensional dataset, with **N** points in the cluster,
    two aggregates in the form of total sum **LS** for each dimension and total squared
    sum of **SS** for each dimension, are computed and the vector representing this
    triplet for the Clustering Feature:


    ```

    $$CF = < N, LS, SS >$

    ```


    These statistics are useful in summarizing the entire cluster information. The
    centroid of the cluster can be easily computed using:


    ```

    $$centroid = LS/N$

    ```


    The radius of the cluster can be estimated using:


    ```

