- pgno: 510
  md: '# SAMOA as a real-time Big Data Machine Learning framework


    For a single machine, in Chapter 5, Real-Time Stream Machine Learning, we discussed
    the MOA framework at length. SAMOA is the distributed framework for performing
    Machine Learning on streams.


    At the time of writing, SAMOA is an incubator-level open source project with Apache
    2.0 license and good integration with different stream processing engines such
    as Apache Storm, Samza, and S4.


    # SAMOA architecture


    The SAMOA framework offers several key streaming services to an extendable set
    of stream processing engines, with existing implementations for the most popular
    engines of today.


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_510_0.png)


    Figure 23: SAMOA high level architecture


    TopologyBuilder is the interface that acts as a factory to create different components
    and connect them together in SAMOA. The core of SAMOA is in building processing
    elements for data streams. The basic unit for processing consists of ProcessingItem
    and Processor interface, as shown in Figure 24. ProcessingItem is an encapsulated
    hidden element, while Processor is the core implementation where the logic for
    handling streams is coded.'
  merge: -1
  img_proc: true
- pgno: 511
  md: '![](img/2b4ec1705c1d24bfee7a5f8594a281b5_511_0.png)


    Stream is another interface that connects various Processors together as the source
    and destination created by TopologyBuilder. A Stream can have one source and multiple
    destinations. Stream supports three forms of communication between source and
    destinations:


    +   - All: In this communication, messages from source are sent to all the destinations

    - Key: In this communication, messages with the same keys are sent to the same
    processors

    - Shuffle: In this communication, messages are randomly sent to the processors


    All the messages or events in SAMOA are implementations of the interface ContentEvent,
    encapsulating the most data in the streams as a interface and having some form
    of key for uniqueness.


    Each stream processing engine has an implementation for all the key interfaces
    as a plugin and integrates with SAMOA. The Apache Storm implementations StormTopology,
    StormStream, and StormProcessingItem, and so are shown in the API in Figure 25.


    Task is another unit of work in SAMOA, having the responsibility of execution.
    All the classification or clustering evaluation and validation techniques such
    as preential, holdout, and so on, are implemented as Tasks.


    Learner is the interface for implementing all Supervised and Unsupervised Learning
    capability in SAMOA. Learners can be local or distributed and have different extensions
    such as ClassificationLearner and RegressionLearner.'
  merge: -1
  img_proc: true
