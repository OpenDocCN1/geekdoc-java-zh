- pgno: 301
  md: 'Let us understand the reduction of the computations by taking a simple example
    in

    t student network. If we have to compute a probability query such as the difficulty

    of the exam given the letter was good, that is, $P(D|L=good)=$.


    Using Bayes theorem:


    ```

    $P(D|L=good) = \frac{P(D,L=good)}{P(L=good)}$

    ```


    To compute $P(D|L=good)=$ we can use the chain rule and joint probability:


    ```

    $P(D,L=good) = \sum_{G,I,S} P(S|I)P(I)P(G|I,D)P(L=good|G)$

    ```


    If we rearrange the terms on the right-hand side:


    ```

    $P(D,L=good) = \sum_{G,I} P(I)P(G|I,D)P(L=good|G)\sum_{S} P(S|I)$

    ```


    If we now replace $\sum_{S} P(S|I) = \phi(S)$ since the factor is independent
    of the variable

    I that is conditioned on, we get:


    ```

    $P(D,L=good) = \sum_{G,I} P(I)P(G|I,D)P(L=good|G)\phi_I(S)$

    ```


    Thus, if we proceed carefully, eliminating one variable at a time, we have effectively

    converted $O(2^n)$ factors to $O(nk)$ factors where $n$ is the number of variables
    and $k$ is

    t the observed values for each.


    Thus, the main idea of the VE algorithm is to impose an order on the variables

    at the query variable comes last. A list of factors is maintained over the ordered
    list

    of variables and summation is performed. Generally, we use dynamic programming

    in the implementation of the VE algorithm (References [14]).


    # Input and output


    Inputs:


    +   - List of Condition Probability Distribution/Table F

    - List of query variables E and the observed value e

    - List of observed variables E and the observed value e'
