- pgno: 330
  md: '# Input and output


    Inputs are the training dataset $D$ with all the features as variables $[X, Y]$.
    The features are discrete outcomes, if they don''t need to be discretized as a
    pre-processing step.


    Outputs are TAN as Bayesian network with CPTs.


    # How does it work?


    +   1. Compute mutual information between every pair of variables from the training
    dataset.


    +   2. Build an undirected graph with each node being the variable and edge being
    the mutual information between them.


    +   3. Create a maximum spanning tree.


    +   4. Transform the spanning tree to a directed graph by selecting the outcome
    or the target variable as the root and having all the edges flowing in the outwards
    direction.


    +   5. If there is no directed edge between the class variable and other features,
    add it.


    +   6. Compute the CPTs based on the DAG or TAN constructed previously.


    # Advantages and limitations


    +   - It is more accurate than Naive Bayes in many practical models. It is less
    complex and faster to build and compute than complete Bayes networks.


    # Markov chains


    Markov chains are specialized probabilistic graph models, with directed graphs
    containing loops. Markov chains can be seen as extensions of automata where the
    weights are probabilities of transition. Markov chains are useful to model temporal
    or sequence of changes that are directly observable. See (References [12]) for
    further study.


    Figure 17 represents a Markov chain (first order) and the general definition can
    be given as a stochastic process consisting of


    Nodes as states, $Q=\{q_1, q_2, \dots, q_L\}$ and $|Q| = N$.'
