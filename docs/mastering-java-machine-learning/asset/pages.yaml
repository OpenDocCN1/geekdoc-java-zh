    \ unlabeled.\n2. Cluster the data, both labeled and unlabeled using the clustering\
    \ algorithm.\n3. For each cluster $S$ the set of labeled instances drawn from\
    \ $\\mathcal{L}$.\n   1. Learn a supervised model from $S_c, f_c = L_c$.\n   2.\
    \ Apply the model $f$ and classify unlabeled instances for each cluster using\
    \ the preceding model.\n\n4. Since all the unlabeled instances $\\mathcal{U} =\
    \ \\{x_j, y_j\\}_{j=1}^n$ get assigned a label by the preceding process, a supervised\
    \ classification model is run on the entire set.\n\n![](img/2b4ec1705c1d24bfee7a5f8594a281b5_196_0.png)\n\
    \n— 160 —"
