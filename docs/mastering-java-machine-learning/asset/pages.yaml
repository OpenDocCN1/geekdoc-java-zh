- pgno: 364
  md: '# Deep Learning


    The Markov network view of the same in scalar form can be represented using all
    the pairwise factors, as shown in the following figure. This also makes it clear
    why it is called a "restricted" Boltzmann machine as there is no connection among
    units within a hidden layer or in the visible layers:


    ```

    $$p(\mathbf{x}, \mathbf{h}) = \frac{1}{Z} \prod_{i} \prod_{j} \exp(W_{ji}h_j,x_i)
    \prod_{i} \exp(c_ix_i) \prod_{j} \exp(b_jh_j)$$$

    ```


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_364_0.png)


    We have seen that the whole probability distribution function $p(\mathbf{x}, \mathbf{h})
    = \exp(-E(\mathbf{x}, \mathbf{h})) / Z$ is intractable. We will now derive the
    basic conditional probability distributions for $x, h$.


    # Conditional distribution


    Although computing the $p(x, h)$ is intractable, the conditional distribution
    of $p(x|h)$ or $p(h|x)$ can be easily defined and shown to be a Bernoulli distribution
    and tractable:


    ```

    $$p(h|\mathbf{x}) = \prod_{j} p(h|\mathbf{x})$$$

    ```


    ```

    $$p(h=1|\mathbf{x}) = \text{sigmoid}(b_j + \mathbf{W}_jx)$$$

    ```


    ```

    $$ = \frac{1}{1 + \exp(-(b_j + \mathbf{W}_jx))}$$$

    ```'
