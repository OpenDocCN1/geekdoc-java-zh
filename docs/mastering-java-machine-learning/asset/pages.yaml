  md: 'Probabilistic Graph Modeling


    Marginal distribution of one random variable can be computed from the joint distribution
    by summing up the values over all of the other variables. The marginal distribution
    over grade can be obtained by summing all the rows as shown in Table 1 and that
    the intelligence can be obtained by summation over the columns.


    | | low | high | $P(G) = \sum_{I} G,I$ |

    |---|---|---||}{

    | Grade or G | A | 0.07 | 0.18 | $=0.25$ |

