- pgno: 227
  md: '# Real-Time Stream Machine Learning


    In Chapter 2, Practical Approach to Real-World Supervised Learning, Chapter 3,
    Unsupervised Machine Learning Techniques, and Chapter 4, Semi-Supervised and Active
    Learning, we discussed techniques of classification, clustering, outlier detection,
    semi-supervised, and active learning. The form of learning from existing or historic
    data is traditionally known as batch learning.


    All of these algorithms or techniques assume three things, namely:


    +   - Finite training data is available to build different models.

    - The learned model will be static; that is, patterns won''t change.

    - The data distribution will also remain the same.


    In many real-world data scenarios, there is either no data available a priori
    or the data is dynamic in nature; that is, changes continuously with time. Many
    real-world applications may also have data which has a transient nature to comes
    in high velocity or volume such as IoT sensor information, network monitoring,
    and Twitter feeds. The requirement here is to learn from the instance immediately
    and update the learning.


    The nature of dynamic data and potentially changing distribution renders existing
    generally unsuitable for such tasks. This gave rise to adaptable or upgradable
    or incremental learning algorithms in machine learning. These techniques can be
    applied to continuously learn from the data streams. In many cases, the disadvantage
    of learning from Big Data due to size and the need to fit the entire data into
    memory can also be overcome by converting the Big Data learning problem into an
    incremental learning problem and inspecting one example at a time.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'Real-Time Stream Machine Learning


    In this chapter, we will discuss the assumptions and discuss different techniques
    in supervised and unsupervised learning that facilitate real-time or stream machine
    learning. We will use the open source library Massive Online Analysis (MOA) for
    performing a real-world case study.


    The major sections of this chapter are:


    +   - Assumptions and mathematical notation.

    - Basic stream processing and computational techniques. sliding windows including
    the ADWIN algorithm, and sampling.

    - Concept drift and drift detection: Introduces evolving systems and data management,
    detection methods, and implicit and explicit adaptation.

    - Incremental supervised learning: A discussion of learning from labeled stream
    data, modeling techniques including linear, non-linear, and ensemble algorithms.
    This is followed by validation, evaluation, and model comparison methods.

    - Incremental unsupervised learning: Clustering techniques similar to those discussed
    in Chapter 3, Unsupervised Machine Learning Techniques, including validation and
    evaluation techniques.

    - Unsupervised learning using outlier detection: Partition-based and distance-based,
    and the validation and evaluation techniques used.

    - Case study for stream-based learning: Introduces MOA framework, presents the
    business problem, feature analysis, mapping to machine learning blueprint; describes
    the experiments, and concludes with the presentation and analysis of the results.


    # Assumptions and mathematical notations


    There are some key assumptions made by many stream machine learning techniques
    and we will state them explicitly here:


    +   - The number of features in the data is fixed.

    - Data has small to medium dimensions, or number of features, typically in the
    hundreds.

    - The number of examples or training data can be infinite or very large, typically
    in the millions or billions.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '+   - The number of class labels in supervised learning or clusters are small
    and finite, typically less than 10.


    +   - Normally, there is an upper bound on memory; that is, we cannot fit all
    the data in memory, so learning from data must take this into account, especially
    lazy learners such as K-Nearest-Neighbors.


    +   - Normally, there is an upper bound on the time taken to process the event
    or the data, typically a few milliseconds.


    +   - The patterns or the distributions in the data can be evolving over time.


    +   - Learning algorithms must converge to a solution in finite time.


    Let $D_t = \{x_i, y_i : f(x_i)\}$ be the given data available at time $t \in [1,
    2, \dots i]$.


    An incremental learning algorithm produces sequences of models/hypotheses $[\dots,
    G_{t-1}, G_t, \dots ]$ for the sequence of data $[\dots, D_{t-1}, D_t, \dots ]$
    and model/hypothesis $G_t$ depends only on the previous hypothesis $G_{t-1}$ and
    current data $D_t$.


    # # Basic stream processing and computational techniques


    We will now describe some basic computations that can be performed on the stream
    of data. If we run summary operations such as aggregations or histograms with
    limits on memory and speed, we can be sure that some kind of trade-off will be
    needed. Two well-known types of approximations in these situations are:


    +   - $\epsilon$ Approximation: The computation is close to the exact value within
    the fraction $\epsilon$ of error.


    +   - $(\epsilon, \delta)$ Approximation: The computation is close to the exact
    value within $1 \pm \epsilon$ with probability within $1 - \delta$.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# Stream computations


    We will illustrate some basic computations and aggregations to highlight the difference
    between batch and stream-based calculations when we must compute basic operations
    with constraints on memory and yet consider the entire data:


    +   **Frequency count or point queries**: The generic technique of Count-Min Sketch
    has been successfully applied to perform various summaries on the data streams.
    The primary technique is creating a window of size $w \times d$. Then, given a
    desired probability ($\delta$) and admissible error ($\epsilon$), size of data
    can be created using $w = 2/\epsilon$ and $d = \left[\log(\frac{1}{\delta})\right]$.

    Associated with each row is a hash function: $h(x)$. This uniformly transforms
    a value $x$ to a value in the interval $[1, 2 \dots, w]$. This method of lookup
    and updates can be used for performing point queries of values or dot products
    or frequency counts.


    +   **Distinct count**: The generic technique of Hash-Sketch can be used to perform
    "distinct values" queries or counts. Given the domain of incoming stream values
    $x \in [0, 1, \dots, 2^{N-1}]$, the hash function $h(x)$ maps the values uniformly
    across $[0, 1, \dots, L-1]$, where $L=O(\log n)$.


    +   **Mean**: Computing the mean without the need for storing all the values is
    very useful and normally employed using a recursive method where only the number
    of observations ($n$) and sum of values seen so far ($\Sigma x_n$) is:


    > $x_n = \frac{\Sigma x_n+(n-1) \times x_{n-1}}{n}$


    +   **Standard deviation**: Like the mean, standard deviation can be computed
    using the memoryless option with only the number of observations ($n$), and sum
    of squares of the values seen so far ($\Sigma x_n^2$):


    > $$\sigma_n = \sqrt{\frac{\Sigma x_n^2-(\frac{(\Sigma x_n)^2}{n})}{n-1}}$'
  merge: -1
  img_proc: true
- pgno: 231
  md: "+   * Correlation coefficient: Given a stream of two different values, many\
    \ algorithms need to compute the correlation coefficient between the two which\
    \ can be done by maintaining the running sum of each stream ($\\sum x_n$, and\
    \ $\\sum y_n$), the sum of squared values ($\\sum x_n^2$, and $\\sum y_n^2$),\
    \ and the cross-product ($\\sum x_n \times y_n$). The correlation is given by\n\
    \n```\n$$\\frac{\\sum x_n \\times y_n}{n}$$\\n\n$$corr(x,y) = \\frac{\\frac{\\\
    sum x_n \\times y_n}{n}}{\\sqrt{\\frac{\\sum x_n^2}{2m}} \\sqrt{\\frac{\\sum y_n^2}{2m}}}$$$\n\
    ```\n\n# # Sliding windows\n\nOften, you don't need the entire data for computing\
    \ statistics or summarizations but only the \"recent past\". In such cases, sliding\
    \ window techniques are used to calculate summary statistics by keeping the window\
    \ size either fixed or adaptable and moving it over the past.\n\nAdaptive sliding\
    \ window ADWIN is one well-known technique used to detect change as estimating\
    \ values in the computation. The idea behind ADWIN is to keep a variable-length\
    \ window of last seen values with the characteristic that the window has a maximum\
    \ length statistically consistent with the fact that there has been no change\
    \ in the average value within the window. In other words, the older values are\
    \ dropped if and only if a new incoming value would change the average. This has\
    \ the two-fold advantage of recording change and maintaining the dynamic value,\
    \ such as aggregate, over the recent streams. The determination of the subjective\
    \ notion \"large enough\" for dropping items can be determined using the well-known\
    \ Hoeffding bound as:\n\n```\n$$\\varepsilon_{cut} = \\sqrt{\\frac{1}{2m} \\ln\\\
    frac{|W|}{\\delta}}$$$\n```\n\nHere $m = \\frac{2}{|W_0| + |W_1|}$ is the harmonic\
    \ mean between two windows $W_0$ and $W_1$ of size $|W_0|$ and $|W_1|$, respectively,\
    \ with $W$ containing the more recent elements.\n\nFurther, let $\\hat{\\mu}_0$\
    \ and $\\hat{\\mu}_1$ be the respective calculated averages."
