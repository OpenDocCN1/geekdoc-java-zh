- pgno: 489
  md: 'Most Machine Learning algorithms, optimization algorithms, and utilities use
    the concept of fork-join or MapReduce. As shown in Figure 8, the entire dataset
    is considered as a Data Frame in H2O and comprises vectors, which are features
    or columns in the data. The rows are made up of one element from each Vector arranged
    side-by-side. The rows are grouped together to form a processing unit known as
    a Chunk. Several chunks are combined in one JVM. Any algorithmic or optimization
    work begins by sending the information from the topmost JVM to fork on the next
    JVM, then on to the next, and so on, similar to the map operation in MapReduce.
    Each JVM works on the rows in the chunks to establish the task and finally results
    flow back in the reduction optimization:


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_489_0.png)


    Figure 8: H2O distributed processing using chunking'
  merge: -1
