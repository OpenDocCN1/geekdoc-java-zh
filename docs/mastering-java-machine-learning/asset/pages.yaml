- pgno: 168
  md: '# Unsupervised Machine Learning Techniques


    Another method that has been very useful in high dimensional data is using the
    Subspace Outlier Detection (SOD) approach (References [23]). The idea is to partition
    the high dimensional space such that there are an equal number of ranges, say
    $\phi$, in each of the $d$ dimensions. Then the Sparsity Coefficient for a cell
    C formed by picking a range in each of the $d$ dimensions is measured as follows:


    ```

    $N(C) = n * \prod_{i=1}^{d} \left( 1 - n * \frac{1}{\phi_i} \right)$

    ```


    Here, $n$ is the total number of data points and $N(C)$ is the number of data
    points in cell C. Generally, the data points lying in cell C with negative sparsity
    coefficient are considered outliers.


    # Advantages and limitations


    +   - The ABOD method is $O(n^2)$ with the number of data points and becomes impractical
    with larger datasets.

    - The sparsity coefficient method in subspaces requires efficient search in lower
    dimension and the problem becomes NP-Hard and some form of evolutionary or heuristic
    search is employed.

    - The sparsity coefficient methods being NP-Hard can result in local optima.


    # One-class SVM


    In many domains there is a particular class or category of interest and the "rest"
    do not matter. Finding a boundary around this class of interest is the basic idea
    behind one-class SVM (References [26]). The basic assumption is that all the points
    of the positive class (class of interest) cluster together while the other class
    elements are spread around and we can find a tighter hyper-sphere around the clustered
    instances. SVM, which has great theoretical foundations and applications in binary
    classifications is reformulated to solve one-class SVM. The following figure illustrates
    how a nonlinear boundary is simplified by using one-class SVM with slack so as
    to not overfit complex functions:'
