- pgno: 140
  md: '# Advantages and limitations


    +   * It scales to very large values of dataset size and dimensionalities. In
    text and image learning problems, with large dimensions, this technique has been
    successfully used as the preprocessing technique.

    * Sometimes a large information loss can occur while using RP.


    # Multidimensional Scaling (MDS)


    There are many forms of MDS—classical, metric, and non-metric. The main idea of
    MDS is to preserve the pairwise similarity/distance values. It generally involves
    transforming the high dimensional data into two or three dimensions (References
    [5]).


    # Inputs and outputs


    MDS can work with both numeric and categorical data on the user-selected distance
    function. The number of dimensions to transform to, $k$, is a user-defined input.


    # How does it work?


    Given $n \times n$ affinity or distance matrix is computed. There are choices
    of using distances such as Euclidean, Mahalanobis, or similarity concepts such
    as cosine similarity, Jaccard coefficients, and so on. MDS in its very basic form
    tries to find a mapping of the distance matrix in a lower dimensional space where
    the Euclidean distance between the transformed points is similar to the affinity
    matrix.


    Mathematically:


    ```

    $$\min_{y} \sum_{i} \sum_{j} (d_{ij}^x - d_{ij}^y)^2$

    ```


    Here $d_{ij}^x = ||x_i - x_j\|$ input space and $d_{ij}^y = ||y_i - y_j\|$ mapped
    space.


    If the affinity space is transformed using kernels then the MDS becomes a non-linear
    method for dimensionality reduction. Classical MDS is equivalent to PCA when the
    distances between the points in input space is Euclidean distance.


    # Advantages and limitations


    +   * The key disadvantage is the subjective choice of the lower dimension needed
    to interpret the high dimensional data, normally restricted to two or three for
    humans. Some data may not map effectively in this lower dimensional space.'
  merge: -1
  img_proc: true
