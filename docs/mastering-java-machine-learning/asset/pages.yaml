    # What are the characteristics of Big Data?


    There are many characteristics of Big Data that are different from normal data.
    Here we highlight them as four Vs that characterize Big Data. Each of these makes
    it necessary to use specialized tools, frameworks, and algorithms for data acquisition,
    storage, processing, and analytics:


    +   - Volume: One of the characteristics of Big Data is the size of the content,
    structured or unstructured, which doesn''t fit the storage capacity or processing
    power available on a single machine and therefore needs multiple machines.


    +   - Velocity: Another characteristic of Big Data is the rate at which the content
    is generated, which contributes to volume but needs to be handled in a time sensitive
    manner. Social media content and IoT sensor information are the best examples
    of high velocity Big Data.'
  merge: -1
  img_proc: true
- pgno: 476
  md: 'Big Data Machine Learning – The Final Frontier


    +   - Variety: This generally refers to multiple formats in which data exists,
    that is structured, semi-structured, and unstructured and furthermore, each of
    them has different forms. Social media content with images, video, audio, text,
    and structured information about activities, background, networks, and so on,
    the best example of where data from various sources must be analyzed.


    +   - Veracity: This refers to a wide variety of factors such as noise, uncertainty,
    biases, and abnormality in the data that must be addressed, especially given the
    volume, velocity, and variety of data. One of the key steps, as we will discuss
    in the context of Big Data Machine Learning, is processing and cleaning "unclean"
    data.


    Many have added other characteristics such as value, validity, and volatility
    to the preceding list, but we believe they are largely derived from the previous
    four.


