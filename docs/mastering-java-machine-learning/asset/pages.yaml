  md: '# OpenMarkov


    OpenMarkov is a Java-based tool for PGMs and here is the description from www.openmarkov.org.


    OpenMarkov is a software tool for probabilistic graphical models (PGMs) developed
    by the Research Centre for Intelligent Decision-Support Systems of the UNED in
    Madrid, Spain.

    It has been designed for: editing and evaluating several types of PGMs, such as
    Bayesian Hill Climbing, influence diagrams, factored Markov models, and so on,
    learning Bayesian networks from data interactively, and cost-effectiveness analysis.


    OpenMarkov is very good in performing interactive and automated learning from
    the data. It has capabilities to preprocess the data (discretization using frequency
    and value) and perform structure and parameter learning using a few search algorithms
    such as search-based Hill Climbing and score-based PC. OpenMarkov stores the models
    in a format known as pgmx. To apply the models in most traditional packages there
    may be a need to convert the pgm models to XMLBIF format. Various open source
    tools provide these conversions.


