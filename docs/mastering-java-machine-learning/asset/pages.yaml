- pgno: 473
  md: '# Big Data Machine Learning – The Final Frontier


    In recent years, we have seen an exponential growth in data generated by humans
    and machines. Varied sources, including home sensors, healthcare-related monitoring
    devices, news feeds, conversations on social media, images, and worldwide commerce
    transactions – an endless list – contribute to the vast volumes of data generated
    every day.


    Facebook had 1.28 billion daily active users in March 2017 sharing close to four
    million pieces of unstructured information such as text, images, URLs, news, and
    videos (Source: Facebook). 1.3 billion Twitter users share approximately 500 million
    tweets a day (Source: Twitter). **Internet of Things** (IoT) sensors in lights,
    thermostats, sensor in cars, watches, smart devices, and so on, will grow from
    50 billion to 200 billion by 2020 (Source: IDC estimates). YouTube users upload
    300 hours of video every five minutes. Netflix has 30 million viewers who stream
    77,000 hours of video daily. Amazon has sold approximately 480 million products
    and approximately 244 million customers. In the financial sector, the volume of
    transactional data generated by even a single large institution is enormous –
    approximately 25 million households in the US have Bank of America, a major financial
    institution, as their primary bank, and together produce petabytes of data annually.
    Overall, it is estimated that the global Big Data industry will be worth 43 billion
    dollars in 2017.


    Each of the aforementioned companies and many more like them face the real problem
