- pgno: 309
  md: '# Messaging in factor graph


    There are two distinct messages that flow in these factor graphs that form the
    bulk of all computations through communication.


    +   Message from factor nodes to variable nodes: The message that is sent from
    a factor node to the variable node can be mathematically represented as follows:


    ```

    $P(X) = \prod_{S \in Nb(x)} F_s(x, X_s)$

    ```


    $X_s$ = set of variables connected in subtree to x via factor $f_s$

    $F_s(x, X_s)$ = product of all factors in group associated with $f_s$

    $S \in Nb(x)$ = set of nodes (factors) that are neighbors of $x$


    ```

    $P(X) = \prod_{S \in Nb(x)} \mu_{f_s \to x}(x) \text{ where } \mu_{f_s \to x}(x)
    = \sum_{X_s} F_s(x, X_s)$

    ```


    Thus, $\mu_{f_s \to x}(x)$ is the message from factor node $f_s$ to $x$ and the
    product of all such messages from neighbors of $x$ to $x$ gives the combined probability
    to $x$:


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_309_0.png)


    Figure 10. Message-passing from factor node to variable node'
