- pgno: 468
  md: '# Analysis of text processing results


    The analysis of results obtained from our experiments on the Reuters dataset is
    presented here with some key observations:


    +   As seen in the first table, with the binary representation of terms, Naive
    Bayes scores around 0.7, which indicates that the features generated have good
    discriminating power. AdaBoost on the same configuration of Naive Bayes improves
    all the metrics, such as precision, recall, F1-measure, and accuracy, by about
    2%, indicating the advantage of boosting and meta-learning.


    +   As seen in the first table, non-linear classifiers, such as Decision Tree,
    do only marginally better than linear Naive Bayes in most metrics. SVM with a
    linear classifier increases accuracy by 17% over linear Naive Bayes and has better
    metrics in almost all measures. SVM and kernels, which have no issues with high
    dimensional data, the curse of text classification, are thus one of the better
    algorithms for modeling, and the results confirm this.


    +   Changing the representation from binary to TF improves many measures, such
    as accuracy, for linear Naive Bayes (from 0.70 to 0.72) and SVM (0.82 to 0.84).
    This indeed confirms that TF-based representation in many numeric-based algorithms,
    such as SVM. AdaBoost performance with Naive Bayes drops in most metrics when
    the underlying classifier Bayes gets stronger in performance across theoretical
    and empirical results.


    +   Finally, reducing features using threshold TF > 0.01, as used here, we get
    almost similar or somewhat reduced performance in most classifiers, indicating
    that although certain terms seem rare, they have discriminating power, and reducing
    them has a negative impact.


    # Summary


    A large proportion of information in the digital world is textual. Text mining
    and NLP are areas concerned with extracting information from this unstructured
    form of data. Several important sub areas in the field are active topics of research
    today and an understanding of these areas is essential for data scientists.'
  merge: -1
  img_proc: true
- pgno: 469
  md: '# Chapter 8


    Text categorization is concerned with classifying documents into pre-determined
    categories. Text may be enriched by annotating words, with POS tagging, in order
    to give it more structure for subsequent processing tasks to act on. Unsupervised
    techniques such as clustering can be applied to documents as well. Information
    extraction and named entity recognition help identify-rich specifics such as location,
    person or organization name, and so on. Summarization is another important application
    for producing concise abstracts of larger documents or sets of documents. Various
    ambiguities of language and semantics such as context, word sense, and making
    the tasks of the NLP challenging.


    Transformations of the text include tokenization, word removal, and word stemming,
    all of which prepare the corpus by standardizing the content so Machine Learning
    techniques can be applied productively. Next, lexical, semantic, and syntactic
    features are extracted as numerical values represent the document structure more
    conventionally with a vector space model. Similarity and distance measures can
    then be applied effectively for compare samples. Dimensionality reduction is key
    to the large number of features that are typically present. The details of the
    techniques for topic modeling, PLSA and text clustering, and named entity recognition
    are described in this chapter. Finally, the recent techniques employing deep learning
    in various fields of NLP are introduced


    Mallet and KNIME are open source Java-based tools that provide powerful NLP and
    Machine Learning capabilities. The case study examines performance of different
    classifiers on the Reuters corpus using KNIME.


