    # # Case study


    In this case study, we use the CoverType dataset to demonstrate classification
    and clustering algorithms from H2O, Apache Spark MLlib, and SAMOA Machine Learning
    libraries in Java.


    # # Business problem


    The CoverType dataset available from the UCI machine learning repository (https://archive.ics.uci.edu/datasets/Covertype)
    contains unscaled cartographic data for 58,012 cells of forest land 30 x 30 m²
    in dimension, accompanied by actual forest cover labels. In the experiments conducted
    here, we used the normalized version of the data. Including one-hot encoding of
    two categorical types, there are a total of 54 attributes in each row.'
  merge: -1
  img_proc: true
- pgno: 496
  md: '# Machine Learning mapping


    First, we treat the problem as one of classification using the labels included
    in the dataset and perform several supervised learning experiments. With the models
    generated, we make predictions over the forest cover type of an unseen test dataset.
    For the clustering experiments that follow, we ignore the data labels, determine
    the number of clusters to use, and then report the corresponding cost using various
    algorithms implemented in H2O and Spark MLLib.


    # Data collection


    This dataset was collected using cartographic measurements only and remote sensing.
    It was derived from data originally collected by the US Forest Service (USFS)
    and the US Geological Survey (USGS).


    # Data sampling and transformation


    Train and test data – The dataset was split into two sets in the ratio 20% for
    testing and 80% for training.


    The categorical Soil Type designation was represented by 40 binary variable attributes.
    A value of 1 indicates the presence of a soil type in the observation; a 0 indicates
    its absence.


    The area designation is likewise a categorical attribute with four binary columns,
    with 1 indicating presence and 0 absence.


    All continuous value attributes have been normalized prior to use.


    # Experiments, results, and analysis


    In the first set of experiments in this case study, we used the H2O framework.


    # Feature relevance and analysis


    Though H2O does not explain feature selection algorithms, many learners such as
    GLM, random forest, own, and so on, give importance metrics based on training/validation
    of the models. In our analysis, we have used GLM for feature selection, as shown
    in Figure 16. It is interesting that the feature Elevation emerges as the most
    discriminating feature among some categorical features that are converted into
    numeric/binary such as Soil_Type2, Soil_Type4, and so on. Many of the soil type
    categorical features have no relevance and can be dropped from the modeling perspective.'
  merge: -1
  img_proc: true
