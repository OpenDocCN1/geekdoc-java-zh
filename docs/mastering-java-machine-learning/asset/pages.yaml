    \ random sampling (*Chapter 2, Practical Approach to Real-World Supervised Learning*)\
    \ is one of the most well-known techniques employed to reduce the data in the\
    \ batch data world. The reservoir sampling technique is considered to be a very\
    \ effective way of reducing the data given the memory constraints.\n\nThe basic\
    \ idea of reservoir sampling is to keep a reservoir or sample of fixed size, $k$,\
