- pgno: 287
  md: '# Probabilistic Graph Modeling


    Probabilistic graph models (PGMs), also known as graph models, capture the relationship
    between different variables and represent the probability distributions. PGMs
    capture joint probability distributions and can be used to answer different queries
    and make inferences that allow us to make predictions on unseen data. PGMs have
    the great advantage of capturing domain knowledge of experts and the causal relationship
    between variables to model systems. PGMs represent the structure and they can
    capture knowledge in a representational framework that makes it easier to share
    and understand the domain and models. PGMs capture the uncertainty or the probabilistic
    nature very well and are very useful in applications that use scoring or uncertainty-based
    approaches. PGMs are used in a wide variety of applications that use machine learning
    such as applications to domains of language processing, text mining and information
    extraction, computer vision, disease diagnosis, and DNA structure predictions.


    Judea Pearl is the pioneer in the area of PGMs and was the first to introduce
    the topic of Bayesian Networks (References [2] and [7]). Although covering all
    there is to know about PGMs is beyond the scope of this chapter, our goal is to
    cover the most important aspects of PGMs – Bayesian network and directed PGMs
    – in some detail. We will divide the subject into the areas of representation,
    inference, and learning and will discuss specific algorithms and subtopics in
    each of these areas. We will cover Markov Networks and undirected PGMs, summarizing
    some differences and similarities with PGMs, and addressing related areas such
    as inference and learning. Finally, we will discuss specialized networks such
    as tree augmented networks (TAN). Markov chains and hidden Markov models (HMM).
    For an in-depth treatment of the subject, see Probabilistic Graphical Models,
    by Koller and Friedman (References [1]).'
  merge: -1
  img_proc: true
- pgno: 288
  md: "# Probability revisited\n\nMany basic concepts of probability are detailed\
    \ in Appendix B, Probability. Some of the key ideas in probability theory form\
    \ the building blocks of probabilistic graph models. A good grasp of the relevant\
    \ theory can help a great deal in understanding PGMs and how they are used to\
    \ make inferences from data.\n\n# Concepts in probability\n\nIn this section,\
    \ we will discuss important concepts related to probability theory that will be\
    \ used in the discussion later in this chapter.\n\n# Conditional probability\n\
    \nThe essence of conditional probability, given two related events $\\alpha$ and\
    \ $\beta$, is to capture how we assign a value for one of the events when the\
    \ other is known to have occurred. The conditional probability, or the conditional\
    \ distribution, is represented by $P(\\alpha \\mid \beta)$, that is, the probability\
    \ of an event happening given that the event $\beta$ has occurred (equivalently,\
    \ given that $\beta$ is true) and is formally defined as:\n\n```\n$P(\\alpha \\\
    mid \\beta) = \\frac{P(\\alpha \\cap \\beta)}{P(\\alpha)}$\n```\n\n$P(\\alpha\
    \ \\cap \\beta)$ captures the events where both $\\alpha$ and $\\beta$ occur.\n\
    \n# Chain rule and Bayes' theorem\n\nThe conditional probability definition gives\
    \ rise to the chain rule of conditional probabilities that says that when there\
    \ are multiple events $\\alpha_{1},\\alpha_{2},\\dots-\\alpha_{n}$ then:\n\n```\n\
    $P(\\alpha_{1}\\cap\\alpha_{2}\\cap\\dots\\cap\\alpha_{n}) = P(\\alpha_1)P(\\\
    alpha_2 \\mid\\alpha_1)P(\\alpha_3 \\mid\\alpha_1\\cap\\alpha_2)...P(\\alpha_n\
    \ \\mid\\dots\\cap\\alpha_{n-1})$\n```\n\nThe probability of several events can\
    \ be expressed as the probability of the first times the probability of the second\
    \ given the first, and so on. Thus, the probability of $\\alpha_n$ depends on\
    \ everything $\\alpha_i$ to $\\alpha_n$ and is independent of the order of the\
    \ events."
  merge: -1
  img_proc: true
- pgno: 289
  md: "Bayes rule also follows from the conditional probability rule and can be given\n\
    formally as:\n\n$P(\\alpha|\beta) = \\frac{P(\beta|alpha)P(\\alpha)}{P(\\alpha\\\
    beta)}$\n\n# Random variables, joint, and marginal distributions\n\nIt is natural\
    \ to map the events and outcomes by considering them as attributes\nand values.\
    \ Random variables are defined as attributes with different known specific\nvalues.\
    \ For example, if *Grade* is an attribute associated with *Student*, and has values\n\
    $[A, B, C]$, then $Grade = A$ represents a random variable with an outcome.\n\n\
    Random variables are generally denoted by capital letters, as $X, Y,$ and Z\n\
    values taken by them are denoted by $Val(X)=x$. In this chapter, we will primarily\n\
    discuss variables that are categorical in nature, that take a fixed number of\n\
    dcrete values. In the real world, the variables can have continuous representations\n\
    too. The distribution of a variable with categories $[x', x', ...x^*]$ can be\
    \ represented as:\n\n$$\\sum_{i=1}^n P(X=x^i)=1$\n\nSuch a distribution over many\
    \ categories is called a multinomial distribution. In\nt special case when there\
    \ are only two categories, the distribution is said to be the\noulli distribution.\n\
    \nGiven a random variable, a probability distribution over all the events described\n\
    by that variable is known as the marginal distribution. For example, if $(Grade\
    \ = A) = 0.25,\n$P(Grade = b) = 0.37$ and $P(Grade = C) = 0.38$.\n\nIn real-world\
    \ models, there are more than one random variables and\nthe distribution that\
    \ considers all of these is called the joint\ndistribution. For example, if *Intelligence*\
    \ of student is considered as another variable\ndenoted by $P(Intelligence)$ or\
    \ $P(I)$ and has binary outcomes $[low, high]$, then the\ndistribution considering\
    \ *Intelligence* and *Grade* represented as $P(Intelligence, Grade)$ or\nP(I,\
    \ G), is the joint distribution."
  merge: -1
