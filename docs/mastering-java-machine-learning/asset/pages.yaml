- pgno: 292
  md: '# Probabilistic queries


    This is one the most common types of query and it has two parts:


    +   * **Evidence**: A subset of variables with a well-known outcome or category.
    For example, a random variable **E = e**.

    * **Query**: A random variable from the rest of the variables. For example, a
    random variable X.


    $$P(X | E = e)$$


    Examples of probabilistic queries are posterior marginal such as $P(I = high |
    L = bad, S = low) = ?$ and evidentiary probability such as $P(L = bad, S = low)
    = ?.


    # MAP queries and marginal MAP queries


    MAP queries are used to find the probability assignment to the subset of variables
    that are most likely and hence also called **most probable explanation (MPE)**.
    The difference between these and probabilistic queries is that, instead of getting
    the probability, we get the most likely values for all the variables.


    Formally, if we have variables $W, E$, where we have $E = e$ as the evidence and
    are interested in finding the most likely assignment to the variables in $W$,


    $$MAP(W | e) = argmax_W P(W, e)$$


    A much more general form of marginal query is when we have a subset of variables,
    given by Y that forms our query and with evidence of $E = e$, we are interested
    in finding most likely assignments to the variables in Y. Using the MAP definition,


    $$MAP(Y | e) = argmax_Y P(Y | e)$$


    Let''s say, $Z = X - Y - E$, then the MAP query is:


    $$MAP(Y | e) = argmax_Z P(Y, Z | e)$$


    # Graph concepts


    Next, we will briefly revisit the concepts from graph theory and some of the definitions
    that we will use in this chapter.'
