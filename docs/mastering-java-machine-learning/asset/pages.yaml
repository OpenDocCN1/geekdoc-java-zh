- pgno: 82
  md: '# Feature relevance analysis and dimensionality reduction


    The goal of feature relevance and selection is to find the features that are discriminating
    with respect to the target variable and help reduce the dimensions of the data
    [1,2,3]. This improves the model performance by ameliorating the effects of dimensionality
    and by removing noise due to irrelevant features. By evaluating models on the
    validation set with and without features removed, we can see the impact of feature
    relevance. Since exhaustive search for k features 2^k-1 sets (consider all combinations
    of k features where each feature is either retained or removed, disregarding the
    degenerate case where none is present) the corresponding number of models that
    have to be evaluated can become prohibitive, some form of heuristic search techniques
    are needed. The most common of these techniques are described next.


    # Feature search techniques


    Some of the very common search techniques employed to find feature sets are:


    +   - **Forward or hill climbing**: In this search, one feature is added at a
    time until the evaluation model outputs no further change in performance.

    - **Backward search**: Starting from the whole set, one feature at a time is removed
    until performance improvement occurs. Some applications interleave both forward
    and backward techniques to search for features.

    - **Evolutionary search**: Various evolutionary techniques such as genetic algorithms
    can be used as a search mechanism and the evaluation metrics from either filter-
    or wrapper-based methods can be used as fitness criterion to guide the process.


    # Feature evaluation techniques


    At a high level, there are three basic methods to evaluate features.


    # Filter approach


    This approach refers to the use of techniques without using machine learning algorithms
    for evaluation. The basic idea of the filter approach is to use a search technique
    to select a feature (or subset of features) and measure its importance using some
    statistical measure until a stopping criterion is reached.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Univariate feature selection


    This search is as simple as ranking each feature based on the statistical measure
    employed.


    # Information theoretic approach


    All information theoretic approaches use the concept of entropy mechanism at their
    core. The idea is that if the feature is randomly present in the dataset, there
    is maximum entropy, or equivalently, the ability to compress or encode is low,
    and the feature may be irrelevant. On the other hand, if the distribution of the
    feature value is some range of values are more prevalent in one class relative
    to the others, then the entropy is minimized and the feature is discriminating.
    Casting the problem in terms of entropy requires some form of discretization to
    convert the numeric features into categories to compute the probabilities.


    Consider a binary classification problem with training data $D_s$. If $X$ is the
    $i^{th}$ feature with $v$ distinct categorical values such that $D_x = \{D_1,
    D_2 \dots D_v\}$, then information or the entropy in feature $X_i$ is:


    ```

    $Info(D_x) = \sum_{j=1}^{v} \frac{|D_j|}{|D|} Info(D_j)$

    ```


    Here, $Info(D)$ is the entropy of the partition and is calculated as:


    ```

    $Info(D) = -p_{+}(D)\log_2 p_{+}(D) - p_{-}(D)\log_2 p_{-}(D)$

    ```


    Here, $p_{+}(D)$ is the probability that the data in $D$ is in the positive class
    and $p_{-}(D)$ is the probability that it is in the negative class, in that sample.
    Information gain for the feature is calculated in terms of the overall information
    and information of the feature as


    ```

    $InfoGain(X) = Info(D) - Info(D_x)$

    ```


    For numeric features, the values are sorted in ascending order and split points
    between neighboring values are considered as distinct values.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Practical Approach to Real-World Supervised Learning


    The greater the decrease in entropy, the higher the relevance of the feature.
    Information gain has problems when the feature has a large number of values; that
    is Gain Ratio comes in handy. Gain Ratio corrects the information gain over splits
    by introducing Split Information. Split Information for feature X, and GainRatio
    is given by:


    ```

    $$SplitInfo(D_X) = \sum_{j=1}^k \frac{|D_j|}{|D|} \log_2 \left( \frac{|D_j|}{|D|}
    \right)$$$

    ```


    ```

    $$GainRatio(X_i) = \frac{InfoGain(X_i)}{SplitInfo(D_X)}$$$

    ```


    There are other impurity measures such as Gini Impurity Index (as described in
    the section on the Decision Tree algorithm) and Uncertainty-based measures to
    compute feature relevance.


    # Statistical approach


    Chi-Squared feature selection is one of the most common feature selection methods
    that has statistical testing as its base. The null hypothesis is that the feature
    and the class variable are independent of each other. The numeric features are
    discretized so that all features have categorical values. The contingency table
    is calculated as follows:


    | Feature Values | Class=P | Class=N | Sum over classes niP + niN |

    |---|---|---|---|

    | $X_1$ | $(n_{1P} | n_{12})$ | $(n_{1N} | n_{1N})$ | $n_1$ |

    | ... | ... | ... | ... |

    | $X_m$ | $(n_{mP} | n_{mP})$ | $(n_{mN} | n_{mN})$ | $n_m$ |

    | $n_{*p}$ | | | $n_*$ |


    > Contingency Table 1: Showing feature values and class distribution for binary
    class.


    In the preceding table, $n_i$ is a count of the number of features with value
    — after discretization—equal to $x_i$ and class value of $j$.


    The value summations are:


    ```

    $$n_{*p} = \sum_{j=1}^m n_j$$

    ```'
  merge: -1
