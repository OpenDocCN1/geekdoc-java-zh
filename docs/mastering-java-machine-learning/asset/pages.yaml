  md: '# Feed forward and backpropagation


    The aim of neural network training is to adjust the weights and biases at each
    layer so that, based on the feedback from the output layer and the loss function
    that estimates the difference between the predicted output and the actual output,
    that difference is minimized.


    The neural network algorithm based on initial weights and biases can be seen as
    forwarding the computations layer by layer as shown in the acyclic flow graph
    with one hidden layer to demonstrate the flow:


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_357_0.png)'
