- pgno: 29
  md: 'Preface


    # What this book covers


    Chapter 1, Machine Learning Review, is a refresher of basic concepts and techniques
    that the reader would have learned from Pack’s Learning Machine Learning in Java
    or a similar text. This chapter is a review of concepts such as data, transformation,
    sampling and bias, features and their importance, supervised learning, unsupervised
    learning, big data learning, stream and real-time learning, probabilistic graphic
    models, and semi-supervised learning.


    Chapter 2, Practical Approach to Real-World Supervised Learning, cobwebs dusted,
    dives straight into the vast field of supervised learning and the full spectrum
    of associated techniques. We cover the topics of feature selection and reduction,
    linear modeling, logistic models, non-linear models, SVM and kernels, ensemble
    learning techniques techniques and evaluation metrics, and model selection. Using
    WEKA and RapidMiner, we carry out a detailed case study, going through all the
    steps from data analysis to analysis of model performance. In each of the other
    chapters techniques are presented as an example to help the reader understand
    how the techniques introduced in the chapter are applied in real life. The dataset
    used in the case study is UCI HorseColic.


    Chapter 3, Unsupervised Machine Learning Techniques, presents many advanced methods
    in clustering and outlier techniques, with applications. Topics covered are feature
    selection and reduction in unsupervised data, clustering algorithms, evaluation
    methods in clustering, and anomaly detection using statistical, distance, and
    distribution techniques. At the end of the chapter, we perform a case study for
    both clustering and outlier detection using a real-world image dataset, MNIST.
    We use the Smile API to do feature reduction and ELKI for learning.


    Chapter 4, Semi-Supervised Learning and Active Learning, gives details of algorithms
    and techniques for learning when only a small amount labeled data is present.
    Topics covered are self-training, generative models, transductive SVMs, co-training,
    active learning, and multi-view learning. The case study involves learning systems
    and is performed on the real-world UCI Breast Cancer Wisconsin dataset. The tools
    introduced are KernelMachines, KEEL, and JCLAL.


    Chapter 5, Real-Time Stream Machine Learning, covers data streams in real-time
    present unique circumstances for the problem of learning from data. This chapter
    broadly covers the need for stream machine learning and applications, supervised
    stream learning, unsupervised cluster stream learning, unsupervised outlier learning,
    evaluation techniques in stream learning, and metrics used for evaluation. A detailed
    case study is given at end of the chapter to illustrate the use of the MOA framework.
    The dataset used is Electricity (ELEC).


    [ xv ]'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Preface


    Chapter 6, Probabilistic Graph Modeling, shows that many real-world problems can
    be effectively represented by encoding complex joint probability distributions
    over multi-dimensional spaces. Probabilistic graph models provide a framework
    to represent, draw inferences, and learn effectively in such situations. The chapter
    covers probability concepts, PGMs, Bayesian networks, Markov networks, Graph Structure
    Learning, Hidden Markov Models, and Inferencing. A detailed case study on a real-world
    dataset is performed at the end of the chapter. The tools used in this case study
    are OpenMarkov and WEKA''s Bayes network. The dataset is UCI Adult (Census income).


    Chapter 7, Deep Learning, if there is one super-star of the machine learning imagination
    today it is deep learning, which has taken a dominance over techniques used to
    solve the most complex AI problems. Topics broadly covered are neural networks,
    deep belief networks, convolutional networks, long short-term memory units, denoising
    autoencoders, recurrent networks, and others. We present a detailed case study
    showing how to implement deep learning networks, tuning the parameters and learning.
    We use DeepLearning4j with the MNIST image dataset.


    Chapter 8, Text Mining and Natural Language Processing, details the techniques,
    algorithms, and tools for various analyses in the field of text mining. Topics
    broadly covered are text mining, components needed for text mining, representation
    of text data, dimensionality reduction techniques, topic modeling, text clustering,
    named entity recognition, and deep learning. The case study real-world unstructured
    text data (the Reuters-21578 dataset) highlighting topic modeling and text classification;
    the tools used were MALLET and KNIME.


    Chapter 9, Big Data Machine Learning - The Final Frontier, discusses some of the
    most important challenges of today. What learning options are available when data
    is either big or at a very high velocity? How is scalability handled? Topics covered
    are big data deployment frameworks, big data storage options, batch data processing,
    batch data machine learning, real-time machine learning and real-time stream learning.
    In the detailed case study we use the UCI Covertype dataset and the machine learning
    libraries H2O, Spark MLlib and SAMOA.


    Appendix A, Linear Algebra, covers linear algebra, and is meant as a brief refresher.
    It is no complete in its coverage, but it contains a whirlwind tour of some important
    concepts relevant to the machine learning techniques featured in the book. It
    includes vectors, matrices and basic matrix operations and properties, linear
    transformations, matrix inverse, eigen decomposition, positive definite matrix,
    and singular value decomposition.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Preface


    Appendix B. Probability, provides a brief primer on probability. It includes the
    axioms of probability, Bayes'' theorem, density estimation, mean, variance, standard
    deviation, Gaussian standard deviation, covariance, correlation coefficient, binomial
    distribution, Poisson distribution, Gaussian distribution, central limit theorem,
    and error propagation.


    # What you need for this book


    This book assumes you have some experience of programming in Java and a basic
    understanding of machine learning concepts. If that doesn''t apply to you, but
    you are curious nonetheless and self-motivated, fret not, and read on! For those
    who have background, it matters that you are familiar with simple statistical
    analysis of data concepts involved in supervised and unsupervised learning. Those
    who may not have the requisite math or must poke the far reaches of their memory
    to shake loose the old formula or symbol, do not be discouraged. The sort that
    the apprentices may be all you need to kick-start your engines — a bit of tenacity
    will see you through the rest! For those who have never been introduced to machine
    learning, the first chapter was easily written for you those needing a refresher
    — it is your starter-kit to jump in feet first and find out what it all. You can
    again your basics with any number of online resources. Finally, for those innocent
    of Java, here''s a secret: many of the tools featured in the book have powerful
    GUI-like interfaces, making them quite easy to use, and do not require any knowledge
    of Java. So if you are new to Java, just skip the examples that need coding and
    learn to use the GUI-based tools instead!


    # Who this book is for


    The primary audience of this book is professionals who works with data and whose
    responsibilities include data analysis, data visualization or transformation,
    the training, validation, testing and evaluation of machine learning models —
    presumably to perform predictive, descriptive or prescriptive analytics using
    Java or Java-based tools and therefore some prior experience programming in Java.
    On the other hand, perhaps circumstances in the work environment or company policies
    limit the use of third-party tools to only those written in Java and a few others.
    In the second case, the prospective reader may have no programming experience
    in Java. This book is aimed at this reader just as squarely as it is at their
    colleague, the Java expert (who came up with the policy in the first place).


