    # # Concept drift and drift detection


    As discussed in the introduction of the chapter, the dynamic nature of infinite
    streams stands in direct opposition to the basic principles of stationary learning;
    that is, that the distribution of the data or patterns remain constant. Although
    there can be changes that are swift or abrupt, the discussion here is around slow,
    gradual changes. These slow, gradual changes are firstly hard to detect and separating
    the changes from the noise becomes tougher still:


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_233_0.png)


    Figure J Concept drift illustrated by the gradual change in color from yellow
    to blue in the bottom panel. Sampled data reflects underlying change in data distribution,
    which must be detected and a new model learned.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Data management


    There have been several techniques described in studies in the last two decades
    that can be categorized as shown in the following figure:


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_234_0.png)


    Figure 2 Categories of drift detection techniques


    The main idea is to manage a model in memory that is consistent with the dynamic
    nature of the data.


    # Partial memory


    These techniques use the most recently used data in a memory buffer to learn or
    derive summary information. The key question as discussed previously is: what
    is the right window size based techniques to be effective in detecting the change
    and learning effectively? In Fixed Window Size based techniques, we use the idea
    of a queue where a new instance with a recent timestamp comes in the one with
    the oldest is evicted. The window thus contains all recent examples and the size
    is generally chosen based on physical availability of memory and size of data
    elements in the queue. In Adaptive Window Size, the queue is used in conjunction
    with a detection algorithm. When the detection algorithm indicates signs of drifts
    based on performance evaluation, the window size can be reduced to effectively
    remove old examples which no longer help the model.'
  merge: -1
  img_proc: true
- pgno: 235
  md: "# Full memory\n\nThe idea is to store sufficient statistics over all the examples\
    \ or data seen. One way to do this is to put weights on the data and weights decay\
    \ over time. Exponential weighting using the rate factor given by $\\lambda$ can\
    \ be very effective:\n\n$w_i(x) = \\exp(-\\lambda i)$\n\n# Detection methods\n\
    \nGiven the probability $P(X)$ that the given data is observed, the probability\
    \ of patterns/class $P(C)$, and the probability of data class $P(X|C)$ — which\
    \ is the model— the detection method can be divided into two categories, at a\
    \ high level:\n\n+   - Monitoring evolution or performance of the model, classifier\n\
    \ Monitoring distributions from the environment or observing $P(X), P(C)$, and\
    \ $P(X|C)$\n\n# Monitoring model evolution\n\nAlthough this method is based on\
    \ the assumption that the learning of models is stationary and data is coming\
    \ from **independent, identical distributions (i.i.d.)**, which doesn't hold true\
    \ in many applications, it has nevertheless been shown to be effective. Some of\
    \ the well-known techniques are next.\n\n# Widner and Kubat\n\nThis is one of\
    \ the earliest methods which observed the error rates or misclassification rates\
    \ and the changes to the model as tree structures due to new branches, for instance.\
    \ Using these and known thresholds, the learning window size is increased or decreased.\n\
    \n# Drift Detection Method or DDM\n\nThis method assumes that the parameter being\
    \ observed, such as the classifier labeling things correctly or incorrectly, is\
    \ a binary random variable which follows a binomial distribution. It assumes probability\
    \ of misclassification at probability $p$ with standard deviation $s_i = \\sqrt{p_i(1-p_i)/i}$\
    \ where the values are computed at $i^{th}$ point in the sequence. The method\
    \ then uses two levels:\n\n+   - Warning level: When $p_i + s_i \\geq p_{min}\
    \ + 2*s_{min}$\n- Detection level: When $p_i + s_i \\geq p_{min} + 3*s_{min}$"
  merge: -1
  img_proc: true
- pgno: 236
  md: "All the examples between the \"warning\" and \"detection\" levels are used\
    \ to train a new classifier that will replace the \"non-performing\" classifier\
    \ when the \"detection\" level is reached.\n\n# Early Drift Detection Method or\
    \ EDDM\n\nEDDM uses the same technique as DDM with a slight modification. It uses\
    \ classification rate rather than error rate (that is, recall) after $1 - accuracy$\
    \ and uses the distance between the number of right predictions and wrong predictions\
    \ to change the levels.\n\nEDDM computes the mean distance between the two errors\
    \ $p_i'$ and standard deviation between the two $s_i'$. The levels are then:\n\
    \n+   - Warning level: $(p'_{min} + 2s'_{max}) / p'_{max} < a$\n- Detection level:\
    \ $(p'_{prime} + 2s'_{max}) / p'_{max} < \\beta$\n\nThe parameters $a$ and $\b\
    eta$ are normally tuned by the user to something around 90% and 95% respectively.\n\
    \n# Monitoring distribution changes\n\nWhen there are no models or classifiers\
    \ to detect changes, we apply techniques that use some form of statistical tests\
    \ for monitoring distribution changes. These tests are used to identify the distribution\
    \ changes. Owing to assumptions, whether parametric or non-parametric, and different\
    \ biases, it is difficult to say concretely which works best. Here we provide\
    \ some of the well-known statistical tests.\n\n# Welch's t test\n\nThis is an\
    \ adaptation of the Student $t$ test with two samples. The test is adapted to\
    \ take two windows of size $N_1$ and $N_2$ with means $\bar{X}_1$ and $\bar{X}_2$,\
    \ and variances $s_1^2$ and $s_2^2$ to compute the $p$ value and use that to reject\
    \ or accept the null hypothesis:\n\n```\n$pvalue=\\left(\\frac{\\bar{X}_1-\\bar{X}_2}{\\\
    sqrt{s_1^2/N_1+s_2^2/N_2}}\\right)$\n```"
  merge: -1
  img_proc: true
- pgno: 237
  md: '# Kolmogorov-Smirnov''s test


    This statistical test is normally used to compare distances between two distributions
    and validate if they are below certain thresholds or not. This can be adapted
    for change detection by using windows of different sample sizes, $N_i$ and $N_j$,
    with different cumulative distribution functions, $F_i(x)$ and $F_j(x)$, KS distance:


    ```

    ksDistance = \max|F_i(x) - F_j(x)|

    ```


    The null hypothesis, which assumes that the distributions are similar, is rejected
    with confidence of $a$ if and only if $ksDistance^* * [N_i, N_j/(N_i + N_j)] >
    K_\alpha$, which is obtained by a lookup in the Kolmogorov-Smirnov''s table.


    # CUSUM and Page-Hinkley test


    The cumulative sum (CUSUM) is designed to indicate when the mean of the input
    is significantly different from zero:


    $g_0 = 0, g_i = \max(0, g_{i-1} + \epsilon_i - v)$


    We raise detection when $g_i > h$, where $(h, v)$ are user-defined parameters.
    Note that the CUSUM test is memoryless and is one-sided or asymmetric, detecting
    only the increase.


    The Page Hinkley test is similar to CUSUM with a small variation as shown here:


    $g_0 = 0, g_i = g_{i-1} + \epsilon_i - v$


    For increasing and decreasing the values, we use $G_i = \min(g_i, G_{i-1})$ or
    $G_i = \max(g_i, G_{i-1})$, and $G_t - g_t > h$ for change detection.


    # Adaptation methods


    Explicit and implicit adaptation are the two well-known techniques for adapting
    to environment changes when a change is detected.'
  merge: -1
