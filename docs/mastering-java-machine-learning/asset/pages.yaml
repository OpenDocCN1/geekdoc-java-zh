  md: '# Chapter 1


    For the rest of this chapter, we will review the following:


    +   * History and definitions

    * What is not machine learning?

    * Concepts and terminology

    * Important branches of machine learning

    * Different data types in machine learning

    * Applications of faced machine learning

    * Issues faced in machine learning

    * The meta-process used in most machine learning

    * Information on some well-known tools, APIs, and resources that we will employ
    in this book


    # Machine learning – history and definition


    It is difficult to give an exact history, but the definition of machine learning
    we use today finds its usage as early as the 1860s. In Rene Descartes'' Discourse
    of the Method, he refers to Automata and says:


    > For can easily understand a machine''s being constituted so that it can utter
    words, and even emit some responses to action on it of a corporeal kind, which
    brings about a change in its organs; for instance, if touched in a particular
    part it may ask what we wish to say to it; if in another part it may reclaim that
    it is being hurt, and so on.


    ```

    http://www.moderntexts.com/assets/pdfs/descartes1637.pdf

    https://www.marxists.org/reference/archive/descartes/1635/discourse-method.htm

    ```


    Alan Turing, in his famous publication Computing Machinery and Intelligence gives
    basic insights into the goals of machine learning by asking the question ''Can
    machines think?''


    ```

    http://csmt.uchicago.edu/annotations/turing.htm

    https://www.csee.umbc.edu/courses/471/papers/turing.pdf

    ```


    [3]'
