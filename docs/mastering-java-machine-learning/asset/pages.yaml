  md: 'Another disadvantage of LOF is that when clusters are in varying densities
    and not separated, LOF will generate counter-intuitive scores. One way to overcome
    this is to use the **influence space (IS)** of the points using KNNs and its reverse
    KNNs or RNNs. RNNs have the given point as one of their K nearest neighbors. Outlierness
    of the point is known as Influenced Outliers or INFLO and is given by:


    ```

    $$INFLO(p)_k = \frac{den_{any}(IS_k(p))}{den(p)}$$

    ```


    Here, $den(p)$ is the local density of $p:


