  md: 'Unsupervised Machine Learning Techniques


    # Affinity propagation


    Affinity propagation can be viewed as an extension of K-medoids method for its
    similarity with picking exemplars from the data (References [16]). Affinity propagation
    uses graphs with distance or the similarity matrix and picks all examples in the
    training data as exemplars. Iterative message passing as affinities between data
    points automatically detects clusters, the exemplars, and even the number of clusters.


    # Inputs and outputs


    Typically, other than maximum number of iterations, which is common to most algorithms,
    no input parameters are required.


    # How does it work?


    Two kinds of messages are exchanged between the data points that we will explain
    first:


    +   Responsibility $r(i,k)$: This is a message from the data point to the candidate
    exemplar. This gives a metric of how well the exemplar is suited for that data
    point compared to other exemplars. The rules for updating the responsibility as
    follows:


    $$r(i,k) \leftarrow s(i,k) - \max_{k''} (a(i,k'') + s(i,k''))$$


    $s(i, k)$ = similarity between two data points $i$ and $k$.

    $a(i, k)$ = availability of exemplar $k$ for $i$.

    - Availability $a(i,k)$: This is a message from the candidate exemplar to a data
    point. This gives a metric indicating how good of a support the exemplar can be
    to the data point, considering other data points in the calculations. This can
    be viewed as cluster assignment. The rule for updating the availability as follows:


    $$a(i,k) \leftarrow \min\{0, r(k,k) + \sum_{i'' \neq i(i,k)} \max(0, r(i'',k))\}$$


    $$a(i,k) \leftarrow \sum_{i''} \max(0, r(i'',k))$$'
