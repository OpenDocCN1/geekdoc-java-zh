  md: '# # 4 Semi-Supervised and Active Learning


    In Chapter 2, Practical Approach to Real-World Supervised Learning and Chapter
    3, Unsupervised Machine Learning Techniques, we discussed two major groups of
    machine learning techniques which apply to opposite situations when it comes to
    the availability of labeled data— one where all target values are known and the
    other where none are. In contrast, the techniques in this chapter address the
    situation when we must analyze and learn from data that is a mix of a small portion
    with labels and a large number of unlabeled instances.


    In speech and image recognition, a vast quantity of data is available, and in
    various forms. However, the cost of labeling all data is costly and therefore,
    in practice, the proportion of speech or images that are classified to those that
    are not classified is very small. Similarly, in web text or document classification,
    if classifying them based on either topics or contexts requires domain experts—that
    makes the process complex and expensive. In this chapter, we will discuss two
    broad topics that cover the area of “learning from unlabeled data”, namely Semi-Supervised
    Learning (SSL) and Active Learning. We will introduce each of the topics and discuss
    the taxonomy and algorithms associated with each as we did in previous chapters.
    Since the ‘book emphasizes the practical approach, we will discuss tools and libraries
    available for each type of learning. We will then consider real-world case studies
    and demonstrate the techniques that are useful when applying the tools in practical
    situations.'
  merge: -1
  img_proc: true
