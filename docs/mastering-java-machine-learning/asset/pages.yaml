    # # Summary


    PGMs capture domain knowledge as relationships between variables and represent
    joint probabilities. They are used in a range of applications.


    Probability maps an event to a real value between 0 and 1 and can be interpreted
    as a measure of the frequency of occurrence (frequentist view) or as a degree
    of belief in that (Bayesian view). Concepts of random variables, conditional probabilities,
    Bayes'' theorem, chain rule, marginal and conditional independence and factors
    form the foundation of networks that help capture, Representation, Inference,
    and Learning the core elements of Bayesian networks. MAP and Marginal Map queries
    are vital to ask questions about the variables and relationships in the graph.


    The structure of graphs and their properties such as paths, trails, cycles, sub-graphs,
    and cliques are vital to the understanding of Bayesian networks. Representation,
    extract, and make predictions using these methods. From the representation of
    graphs, we can reason about the flow of influence and detect independences that
    reduce the computational complexity when querying the model. Junction trees, variable
    elimination, and belief propagation likewise make inference from queries more
    tractable by reductive steps. Learning from Bayesian networks involves generating
    the structure and model parameters from the data. We discussed several methods
    of learning parameters and structure.


    Markov networks (MN), which have undirected edges, also contain interactions that
    can be captured using parameterization techniques such as Gibbs parameterization,
    Factor Graphs, and Log-Linear Models. Independencies in MN govern flows of influence,
    as in Bayesian networks. Inference techniques are also similar. Learning of parameters
    and structure in MN is hard, and approximate methods are used. Specialized networks
    as Tree augmented networks (TAN) make assumptions of independence amongst nodes
    and are very useful in some applications. Markov Chains and hidden Markov models
    are other specialty networks that also find application in a range of fields.'
  merge: -1
