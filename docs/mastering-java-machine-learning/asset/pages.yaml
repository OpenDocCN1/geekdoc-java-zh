  md: '# How does it work?


    +   1. Each instance arriving at time $t$ has a density coefficient that decreases
    exponentially over time:


    ```

    $$D(x'', t) = \lambda^{t-t''}$$

    ```


    +   2. Density of the grid cell $g$ at any given time $t$ is given by $D(g, t)$
    and it is the sum of the adjusted density of all instances given by $E(g, t)$
    that are mapped to grid cell g:


    ```

    $$D(g, t) = \sum_{x \in E(g, t)} D(x, t)$$

    ```


    +   3. Each cell in the grid captures the statistics as a characterization vector
    by:


    +   * CV(g) = <t_{f}, t_{w}, label, status> where:

    * $t_{f}$ = last time grid cell was updated

    * $t_{w}$ = last time grid cell was removed due to sparseness

    * $D$ = density of the grid cell when last updated

    * label = class of the grid cell

    * status = [NORMAL or SPORADIC]


    +   4. When the new instance arrives, it gets mapped to a grid cell $g$ and the
    characteristic vector is updated. If $g$ is not available, it is created and the
    list of grids is updated.


    +   5. Grid cells with empty instances are removed. Also, cells that have not
    been updated over a long time become sparse, and conversely, when many instances
    are mapped, they become dense.


    +   6. At a regular interval known as a gap, the grid cells are inspected for
    status and the cells with fewer instances than a number - determined by a density
    threshold function - are treated as outliers and removed.


    # Advantages and limitations


    The advantages and limitations are as follows:


    +   * D-Streams have theoretically and empirically been shown to find sporadic
    and normal clusters with very high efficiency in space and time.


    +   * It can find clusters of any shape or size effectively.'
