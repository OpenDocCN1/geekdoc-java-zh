    | $P(I) = \sum_{G} (I,G)$ | | $=0.7$ | $=0.3$ |


    Table 1. Marginal distributions over I and G


    # Marginal independence and conditional independence


    Marginal independence is defined as follows. Consider two random variables $X$
    and $Y$; then $P(X|Y) = P(X)$ means random variable $X$ is independent of $Y$.
    It is formally represented as $P = (X \perp Y)$ ($P$ satisfies $X$ is independent
    of $Y$).


    This means the joint distribution can be given as:


    $P(X, Y) = P(X)P(Y)$


    If the difficulty level of the exam $(D)$ and the intelligence of the student
    $(I)$ determine the grade $(G_i)$, we know that the difficulty level of the exam
    is independent of the intelligence of the student and $(D \perp I)$ also implies
    $P(D, I) = P(D)P(I)$.


    When two random variables are independent given a third variable, the independence
    is called conditional independence. Given a set of three random variables $X$,
    $Y$, and $Z$, we can say that $P=(X \perp Y|Z)$; that is, variable $X$ is independent
    of $Y$ given $Z$. The necessary condition for conditional independence is


    $P(X \perp Y|Z) = P(X|Z)P(Y|Z)$


