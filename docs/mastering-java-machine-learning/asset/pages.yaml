    # Business problem


    The Reuters corpus labels each document with one of 10 categories. The aim of
    the experiments in this case study is to employ the techniques of text processing
    learned in this chapter to give structure to these documents using vector space
    modeling. This is done in three different ways, and four classification algorithms
    are used to train and make predictions using the transformed dataset in each of
    the three cases. And learning.


    # Machine Learning mapping


    Among the learning techniques for unstructured data, such as text or images, classification
    of the data into different categories given a training set with labels is a supervised
    learning problem. However, since the data is unstructured, some statistical or
    information theoretic means are necessary to extract learnable features from the
    data. In design of this study, we performed feature representation and selection
    on the documents before linear, non-linear, and ensemble methods for classification.'
  merge: -1
  img_proc: true
- pgno: 464
  md: '# Data collection


    The dataset used in the experiments is a version of the Reuters-21578 Distribution
    1.0 Text Categorization Dataset available from the UCI Machine Learning Repository:


    > Reuters-21578 dataset: https://archive.ics.uci.edu/ml/datasets/Reuters-21578+Text+Categorization+Collection


    This dataset is a Modified-Apte split containing 9,981 documents, each with a
    class label indicating the category of the document. There are 10 distinct categories
    in the dataset.


    # Data sampling and transformation


    After importing the data file, we performed a series of pre-processing steps in
    order to enrich and transform the data before training any models on the documents.
    These steps can be seen in the screenshot of the workflow created in KNIME. They
    include:


    +   * Punctuation erasure

    * N char filtering (removes tokens less than four characters in length)

    * Number filtering

    * Case conversion – convert all to lower case

    * Stop word filtering

    * Stemming'
