- pgno: 65
  md: '# 2 Practical Approach to Real-World Supervised Learning


    The ability to learn from observations accompanied by marked targets or labels,
    usually in order to make predictions about unseen data, is known as supervised
    machine learning. If the targets are categories, the problem is one of classification
    and if they are numeric values, it is called regression. In effect, what is attempted
    is to infer the function that maps the data to the target. Supervised machine
    learning is used extensively in a wide variety of machine learning applications,
    whenever labeled data is available or the labels can be added manually.


    The core assumption of supervised learning is that the patterns that are learned
    from the data in training will manifest themselves in yet unseen data.


    In this chapter, we will discuss the steps to explore, analyze, and pre-process
    the data before proceeding to training models. We will then introduce different
    modeling techniques ranging from simple linear models to complex ensemble models.
    We will present different evaluation metrics and validation criteria that allow
    us to compare model performance. Some of the discussions are accompanied by brief
    mathematical explanations that should help express the concepts more precisely
    and whe the appetite of the more mathematically inclined readers. In this chapter,
    we will focus on classification as a method of supervised learning, but the principles
    apply to both classification and regression, the two broad applications of supervised
    learning.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Practical Approach to Real-World Supervised Learning


    Beginning with this chapter, we will introduce tools to help illustrate how the
    concepts presented in this chapter are used to solve machine learning problems.
    Nothing reinforces the understanding of newly learned material better than the
    opportunity to apply that material to a real-world problem directly. In the process,
    we often gain a clearer and more relatable understanding of the subject than what
    is possible with passive absorption of the theory alone. If the opportunity to
    learn tools is part of the learning, so much the better! To meet this goal, we
    will introduce a classification dataset familiar to most data science practitioners
    and use it to solve a classification problem while highlighting the process and
    methodologies that guide the solution.


    In this chapter, we will use RapidMiner and Weka for building the process by which
    we learn from a single well-known dataset. The workflows and code are available
    on the website for readers to download, execute, and modify.


    RapidMiner is a GUI-based Java framework that makes it very easy to conduct a
    data science project, end-to-end, from within the tool. It has a simple drag-and-drop
    interface to build process workflows and clean data, explore and transform features,
    perform training using a wide selection of machine learning algorithms, do validation
    and model evaluation, apply your best models to data, and more. It is an excellent
    tool to learn how to make the various parts of the process work together and produce
    rapid results. Weka is another GUI-based framework and it has a Java API that
    we will use to illustrate more of the coding required for performing analysis.


    The major topics that we will cover in this chapter are:


    +   - Data quality analysis

    - Descriptive data analysis

    - Visualization analysis

    - Data transformation and preprocessing

    - Data sampling

    - Feature relevance analysis and dimensionality reduction

    - Model building

    - Model assessment, evaluation, and comparison

    - Detailed case study—Horse Colic Classification'
