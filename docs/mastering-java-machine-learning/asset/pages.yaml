  md: "Given the known Bayesian network structure of graph G and training data $D\
    \ = \\xi[1], \\xi[2]...dots\\xi[M]$, we want to learn the parameters or CPDs—or\
    \ CPTs to be precise. This can be formulated as:\n\n```\n$L(\\mathbf{\theta}:\\\
    mathcal{D}) = \\prod_m P_o(\\xi[m];\\mathbf{\theta})$\n```\n\nNow each example\
    \ or instance $\\xi$ can be written in terms of variables. If there are $i$ variables\
    \ represented by $x$, and the parents of each is given by $parent_{x_i}$,\n\n\
    ```\n$L(\\mathbf{\theta}:\\mathcal{D}) = \\prod_m \\prod_i P(x_i,[m]|parent_{x_i}[m]:\\\
    mathbf{\theta})$\n```\n\nInterchanging the variables and instances:\n\n```\n$L(\\\
    mathbf{\theta}:\\mathcal{D}) = \\prod_i [\\prod_m P(x_i,[m]|parent_{x_i}[m]:\\\
    mathbf{\theta})\n```\n\nThe term is:\n\n```\n$L_i(\\mathbf{\theta}:\\mathcal{D})\
    \ = \\prod_m P(x_i,[m]|parent_{x_i}[m]:\\mathbf{\theta})$\n```\n\nThis is the\
    \ conditional likelihood of a particular variable $x$, given its parents $parent_{x_i}$.\
    \ Thus, parameters for these likelihoods are given by $\\theta_{X_i|parent_{x_i}}$.\
    \ Thus:\n\n```\n$L(\\mathbf{\theta}:\\mathcal{D}) = \\prod_m L_i(\\theta_{X_i|parent_{x_i}}:\\\
    mathcal{D})$\n```\n\nHere, $L(\\theta_{X_i|parent_{x_i}}:\\mathcal{D}) = \\prod_m\
    \ P(x_i,[m]|parent_{x_i}[m]:\\theta_{X_i|parent_{x_i}})$ is called the local likelihood\
    \ function. This becomes very important as the total likelihood decomposes into\
    \ independent terms of local likelihood and is known as the global decomposition\
    \ property of the likelihood function. The idea is that these local likelihood\
    \ functions can be further decomposed for a tabular CPD by simply using the count\
    \ of different outcomes from the training data."
