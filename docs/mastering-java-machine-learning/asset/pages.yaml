- pgno: 40
  md: 'Machine Learning Review


    Arthur Samuel in 1959 wrote, "Machine Learning is the field of study that gives
    computers the ability to learn without being explicitly programmed."


    Tom Mitchell in recent times gave a more exact definition of machine learning:

    A computer program is said to learn from experience E with respect to some task
    T and some performance P, if its performance on T, as measured by P, improves
    with experience E."


    Machine learning has a relationship with several areas:


    +   * Statistics: It uses the elements of data sampling, estimation, hypothesis
    testing, learning theory, and statistical-based modeling, to name a few

    * Algorithms and computation: It uses the basic concepts of search, traversal,
    parallelization, distributed computing, and so on from basic computer science

    * Database and knowledge discovery: For its ability to store, retrieve, and access
    information in various formats

    * Pattern recognition: For its ability to find interesting patterns from the data
    to explore, visualize, and predict

    * Artificial intelligence: Though it is considered a branch of artificial intelligence,
    it also has relationships with other branches, such as heuristics, optimization,
    evolutionary computing, and so on


    # What is not machine learning?


    It is important to recognize areas that share a connection with machine learning
    but cannot be considered part of machine learning. Some disciplines may overlap
    to a smaller or larger extent, yet the principles underlying machine learning
    are quite distinct:


    +   * Business intelligence (BI) and reporting: Reporting key performance indicators
    (KPIs), querying OLAP for slicing, dicing, and drilling into the data, dashboards,
    and so on that the central components of BI are not machine learning.

    * Storage and ETL: Data storage and ETL are key elements in any machine learning
    process, but by themselves, they don''t qualify as machine learning.

    * Information retrieval, search, and queries: The ability to retrieve data or
    documents based on search criteria or indexes, which form the basis of information
    retrieval, are not really machine learning. Many forms of machine learning, such
    as semi-supervised learning, can rely on the searching of similar data for modeling,
    but that doesn''t qualify searching as machine learning.'
  merge: -1
  img_proc: true
- pgno: 41
  md: "# Machine learning – concepts and terminology\n\n+   - Knowledge representation\
    \ and reasoning: Representing knowledge for performing complex tasks, such as\
    \ ontology, expert systems, and semantic webs, does not qualify as machine learning.\n\
    \nIn this section, we will describe the different concepts and terms normally\
    \ used in machine learning:\n\n+   - Data dataset: The basics of machine learning\
    \ rely on understanding the data. The data or dataset normally refers to content\
    \ available in structured or unstructured formats, and an unstructured dataset\
    \ is normally in machine learning. Structured datasets have specific formats,\
    \ and unstructured datasets of some free-flowing text. Data can be available in\
    \ various storage types or formats. In structured data, every element known as\
    \ an instance or an example follows a predefined structure. Data can also be categorized\
    \ by size: small or medium data has a few hundreds to thousands of instances,\
    \ whereas big data refers to a large volume, mostly in millions or billions, that\
    \ cannot be stored or accessed using common devices or in the memory of such devices.\n\
    - Features, attributes, variables, or dimensions: In structured datasets, as mentioned\
    \ before, there are predefined elements with their own semantics and data type,\
    \ which are known variously as features, attributes, metrics, indicators, variables,\
    \ and dimensions.\n- Data types: The features defined need some form of typing\
    \ in many machine learning algorithms or techniques. The most commonly used data\
    \ types are:\n    - Categorical or nominal: This indicates well-defined categories\
    \ or values in the dataset. For example, eye color–black, blue, green, grey; document\
    \ content type–text, image, video.\n    - Continuous or numeric: This indicates\
    \ a numeric nature of the data field. For example, a person's weight measured\
    \ by a bathroom scale, the temperature reading from a sensor, or the monthly balance\
    \ in dollars on a credit account.\n    - Ordinal: This denotes data that can be\
    \ ordered in some way. For example, garment size–small, medium, large, boxing\
    \ weight classes: heavyweight, light heavyweight, middleweight, lightweight, and\
    \ bantamweight."
  merge: -1
  img_proc: true
- pgno: 42
  md: '+   **Target or label:** A feature or set of features in the dataset, which
    is used for learning from training data and predicting in an unseen dataset, is
    known as a target or a label. The term “ground truth” is also used in some domains.
    A label can have any form as specified before, that is, categorical, continuous,
    or ordinal.


    +   **Machine learning model:** Each machine learning algorithm, based on what
    it learned from the dataset, maintains the state of its learning for predicting
    or giving insights into future or unseen data. This is referred to as the machine
    learning model.


    +   **Sampling:** Data sampling is an essential step in machine learning. Sampling
    means choosing a subset of examples from a population with the intent of treating
    the behavior of the (smaller) sample as being representative of the behavior of
    the (larger) population. In order for the sample to be representative of the population,
    care must be taken in the way the sample is chosen. Generally, a population consists
    of every object showing the properties of the problem domain, for example, all
    people eligible to vote in the general election, or all potential owners in the
    next four years. Since it is impossible to collect data for all the objects in
    a population, a well-chosen subset is selected for the purpose of analysis. A
    critical consideration in the sampling process is that the sample is unbiased
    with respect to the population. The following are types of probability-based sampling:


    +   **Uniform random sampling:** This refers to sampling that is done over a uniformly
    distributed population, that is, each object has an equal probability of being
    chosen.


    +   **Stratified random sampling:** This refers to the sampling method used when
    the data can be categorized into multiple classes. In such cases, in order to
    ensure all categories are represented in the sample, the population is divided
    into distinct strata based on these classifications, and each stratum is sampled
    in proportion to the fraction of its in the overall population. Stratified sampling
    is common when the population density varies across categories, and it is important
    to compare these categories with the same statistical power. Political polling
    involves stratified sampling when it is known that different demographic groups
    vote in significantly different ways. Disproportional representation of each group
    in a random sample can lead to large errors in the outcomes of the polls. When
    we control for demographics, we can avoid oversampling the majority over other
    groups.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '+   Cluster sampling: Sometimes are natural groups among the population being
    studied, and each group is representative of the whole population. An example
    is data that spans many geographical regions. In cluster sampling, you take a
    random subset of the groups followed by a random sample from each of those groups
    to construct the full data sample. This kind of sampling can reduce the cost of
    data collection without compromising the fidelity of distribution in the population.


    +   Systematic sampling: Systematic or interval sampling is used when there is
    a set of objects treated as the population and taken to be the source of data
    for sampling, for example, the corpus of Wikipedia articles, arranged lexicographically
    by title. If the sample is then selected starting at a random object and skipping
    a constant k number of objects before selecting the next one, that is called systematic
    sampling. The value of k is calculated as the ratio of the population to the sample
    size.


    +   Model evaluation metrics: Evaluating models for performance is generally based
