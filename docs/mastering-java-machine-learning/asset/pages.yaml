    # Free energy in RBM


    The distribution of input or the observed variable is:


    $p(\mathbf{x}) = \sum_{h} p(\mathbf{x},\mathbf{h})$$

    \npp(\mathbf{x}) = \sum_{h} \exp(-E(\mathbf{x},\mathbf{h}))/Z$$

    \npp(\mathbf{x}) = \frac{\exp(c''^T\mathbf{x}+\sum_{h}''''\log(1+\exp(b_h+\mathbf{W}_h\mathbf{x})))}{Z}$$

    \npp(\mathbf{x}) = \frac{\exp(-\mathcal{F}(\mathbf{x}))}{Z}$


    The function $F(x)$ is called free energy.


