- pgno: 86
  md: '# Minimal redundancy maximal relevance (mRMR)


    In this technique, numeric features are often discretized—as done in univariate
    pre-processing — to get categories of values.


    For each subset S, the redundancy between two features $X_i$ and $X_j$ can be
    measured as:


    ```

    $V_i(S) = \frac{1}{|S|} \sum_{X_j \in S} MI(X_i, X_j)$

    ```


    Here, $MI(X_i, X_j)$ = measure of mutual information between two features $X_i$
    and $X_j$.

    Relevance between feature $X_i$ and class C can be measured as:


    ```

    $V_i(S) = \frac{1}{|S|} \sum_{X_j \in S} MI(X_i, C)$

    ```


    Also, the two goals can be combined to find the best feature selection subset:


    ```

    $S^2 = argmax_{S \subseteq U} (V_i(S) - W_i(S))$

    ```


    # Correlation-based feature selection (CFS)


    The basic idea is similar to the previous example; the overall merit of subset
    S is measured as:


    ```

    $Merit(S) = \frac{kr_{cf}}{\sqrt{k+(k-1)r_{ff}}}$

    ```


    Here, $k$ is the total number of features, $r_{cf}$ is the average feature class
    correlation and $r_{ff}$ is the average feature-feature correlation. The numerator
    gives the relevance factor while the denominator gives the redundancy factor and
    hence the goal of the search is to maximize the overall ratio or the Merit(S).


    There are other techniques such as Fast-Correlation-based feature selection that
    is based on the same principles, but with variations in computing the metrics.
    Readers can experiment with this and other techniques in Weka.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'The advantage of the Filter approach is that its methods are independent of
    learning algorithms and hence one is freed from choosing the algorithms and parameters.
    They are also faster than wrapper-based approaches.


    # Wrapper approach


    The search technique remains the same as discussed in the feature search approach;
    only the evaluation method changes. In the wrapper approach, a machine learning
    algorithm is used to evaluate the subset of features that are found to be discriminating
    based on various metrics. The machine learning algorithm used as the wrapper approach
    may be the same or different from the one used for modeling.


    Most commonly, cross-validation is used in the learning algorithm.

    Performance metrics such as under curve or F-score, obtained as an average on
    cross-validation, guide the search process. Since the cost of training and evaluating
    models is high, we choose algorithms that have fast training speed, such as Linear
    Regression, linear SVM, or ones that are Decision Tree-based.


    Some wrapper approaches have been very successful using specific algorithms as
    Random Forest to measure feature relevance.


    # Embedded approach


    This approach does not require feature search techniques. Instead of performing
    feature selection as preprocessing, it is done in the machine learning algorithm
    itself. Rule Induction, Decision Trees, Random Forest, and so on, perform feature
    selection as part of the training algorithm. Some algorithms such as regression
    or SVM-based methods, known as shrinking methods, can add a regularization term
    in the model to overcome the impact of noisy features in the dataset. Ridge and
    lasso-based regularization are well-known techniques available in regressions
    to provide feature selection implicitly.


    There are other techniques using unsupervised algorithms that will be discussed
    in Chapter 3, Unsupervised Machine Learning Techniques, that can be used effectively
    in a supervised setting too, for example, Principal Component Analysis (PCA).'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Model building


    In real-world problems, there are many constraints on learning and many ways to
    assess model performance on unseen data. Each modeling algorithm has its strengths
    and weaknesses when applied to a given problem or to a class of problems in a
    particular domain. This is articulated in the No Free Lunch Theorem (NFLT), which
    says—for the case of supervised learning—averaged over all distributions of data,
    every classification algorithm performs as well as any other, including one that
    always picks the same class Application of NFLT to supervised learning and optimization
    can be found at http://www.free-lunch.org/


    In this section, we will discuss the most commonly used algorithms, giving the
    necessary details to answer questions such as what are the algorithm''s inputs
    and outputs? What are the advantages and limitations to consider while choosing
    the algorithm? For each model, we will include sample code and outputs from testing
    the model on the chosen dataset. This should provide the reader with insights
    into the process. Some algorithms such as neural networks and deep learning, Bayesian
    networks, stream-based earning, and so on, will be covered separately in their
    own chapters.


    # Linear models


    Linear model works well when the data is linearly separable. This should always
    be the first thing to establish.


    # Linear Regression


    Linear Regression can be used for both classification and estimation problems.
    It is one of the most widely used methods in practice. It consists of finding
    the best-fitting hyperplane through the data points.


    # Algorithm input and output


    Features must be numeric. Categorical features are transformed using various processing
    techniques, when a categorical value becomes a feature with 1 and 0 values. Linear
    Regression models output a categorical class in classification or numeric values
    in regression. Many implementations also give confidence values.


    # How does it work?


    The model tries to learn a "hyperplane" in the input space that minimizes the
    error between the data points of each class (References [4]).'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'A hyperplane in d-dimensional inputs that linear model learns is given by:


    $G(\mathbf{x}) = w_0 + \sum_{j=1}^d w_j x_j$


    The two regions (binary classification) the model divides the input space into
    are $w_0 + \sum_{j=1}^d w_j x_j > 0$ and $w_0 + \sum_{j=1}^d w_j x_j < 0$. Associating
    a value of 1 to the coordinate of feature 0, that is, $x_0=1$, the vector representation
    of hypothesis space or the model:


    $G(\mathbf{x}) = sign(\mathbf{w}^T \mathbf{x})$


    The weight matrix can be derived using various methods such as ordinary least
    squares or iterative methods using matrix notation as follows:


    Here X is the input matrix and y is the label. If the matrix least squares problem
    is not of full rank or if encountering numerical stability issues, the solution
    is modified as:


    $\mathbf{W} = \mathbf{X}(\mathbf{X}^T\mathbf{X} + \lambda\mathbf{I}_n)^{-1} \mathbf{X}^T
    \mathbf{y}$


    Here, $\lambda \in \mathbb{R}$ is added to the diagonal of an identity matrix
    $\mathbf{I}$ of size $(n+1, n+1)$ with the rest of the values being set to 0.
    This solution is called **ridge regression** and parameter $\lambda$ theoretically
    controls the trade-off between the square loss and low norm of the solution. The
    constant $\lambda$ is also known as regularization constant and helps in preventing
    "overfitting".


    # Advantages and limitations


    +   - It is an appropriate method to try and get insights when there are less
    than 100 features and a few thousand data points.

    - Interpretable to some level as the weights give insights on the impact of each
    feature.

    - Assumes linear relationship, additive and uncorrelated features, hence it doesn''t
    model complex non-linear real-world data. Some implementations of Linear Regression
    allow collinear features to overcome this issue.'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'Practical Approach to Real-World Supervised Learning


    +   - Very susceptible to outliers in the data, if there are huge outliers, they
    have to be treated prior to performing Linear Regression.


    +   - Heteroskedasticity, that is is, unequal training point variances, can affect
    the simple least squares regression models. Techniques such as weighted least
    squares are employed to overcome this situation.


    # Naïve Bayes


    Based on the rule, the Naive Bayes classifier assumes the features of the data
    are independent of each other (References [9]). It is especially suited for large
    datasets and frequently performs better than other, more elaborate techniques,
    despite its naive assumption of feature independence.


    # Algorithm input and output


    The Naïve Bayes model can take features that are both categorical and continuous.
    Generally, the performance of Naïve Bayes models improves if the continuous features
    are discretized in the right format. Naïve Bayes outputs the class and the probability
    score for all class values, making it a good classifier for scoring models.


    # How does it work?


    It is a probability-based modeling algorithm. The basic idea is using Bayes''
    rule and measuring the probabilities of different terms, as given here. Measuring
    probabilities can be done either using pre-processing such as discretization,
    assuming a certain distribution, or given enough data, mapping the distribution
    for numeric features.


    Bayes'' rule is applied to get the posterior probability as predictions and $k$
    represents $k^{th}$ class.


    ```

    $P(y=y^k|x) = \frac{P(y=y^k) * \prod_{j=1}^{d} P(x_j|y=y^k)}{P(x)}$

    ```


    ```

    $P(y=y^k|x) \propto P(y=y^k) * \prod_{j=1}^{d} P(x_j|y=y^k)$

    ```


    # Advantages and limitations


    +   - It is robust against isolated noisy data points because these points are
    averaged when estimating the probabilities of input data.


    +   - Probabilistic scores as confidence values from Bayes classification can
    be used as scoring models.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '+   - Can handle missing values very well as they are not used in estimating
    probabilities."


    +   - Also, it is robust against irrelevant attributes. If the features are not
    useful the probability distribution for the classes will be uniform and will cancel
    itself out.


    +   - Very good in training speed and memory, it can be parallelized as each computation
    of probability in the equation is independent of the other.


    +   - Correlated features can be a big issue when using Naive Bayes because the
    conditional independence assumption is no longer valid.


    +   - Normal distribution of errors is an assumption in most optimization algorithms.


    # Logistic Regression


    If we employ Linear Regression model, say, the least squares regression method,
    the outputs have to be converted to classes, say 0 and 1. Many Linear Regression
    algorithms output class and confidence as probability. As a rule of thumb, if
    we see that the probability of Linear Regression are mostly beyond the ranges
    of 0.2 to 0.8, logistic regression algorithm may be a better choice.


    # Algorithm input and output


    Similar to Linear Regression, all features must be numeric. Categorical features
    have to be transformed to numeric. In Naive Bayes, this algorithm outputs class
    and probability for each class and can be used as a scoring model.


    # How does it work?


    Logistic regression models the posterior probabilities of classes using linear
    functions in the input features.


    The logistic regression model for a binary classification is given as:


    ```

    log \frac{P(y=0|x)}{P(y=1|x)} = w_0 + \sum_{j=1}^{d} w_j x_j

    ```


    The model is a log-odds or logit transformation of linear models (References [6]).
    The weight vector is generally computed using various optimization methods such
    as iterative reweighted least squares (IRLS) by the Broyden-Fletcher-Goldfar-Shanno
    (BFGS) method, or variants of these methods.'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'Practical Approach to Real-World Supervised Learning


    # Advantages and limitations


    +   * Overcomes the issue of heteroskedasticity and some non-linearity between
    inputs and outputs.

    * No need of normal distribution assumptions in the error estimates.

    * It is interpretable, but less than Linear Regression models as some understanding
    of statistics is required. It gives information such as odds ratio, p values,
    and so on, which are useful in understanding the effects of features on the classes
    as well as doing implicit feature relevance based on significance of p values.

    * L1 or L2 regularization has to be employed in practice to overcome overfitting
    in the logistic regression models.

    * Many optimization algorithms are available for improving speed of training and
    robustness.


    # Non-linear models


    Next, we will discuss some of the well-known, practical, and most commonly used
    non-linear models.


    # Decision Trees


    Decision Trees are also known as Classification and Regression Trees (CART) (References
    [5]). Their representation is a binary tree constructed by evaluating an inequality
    in a single attribute at each internal node, with each leaf-node corresponding
    to the output value or class resulting from the decisions in the path leading
    to it. When a new input is provided, the output is predicted by traversing the
    tree at the root.


    # Algorithm inputs and outputs


    Features can be both categorical and numeric. It generates class as an output
    and most implementations give a score or probability using frequency-based estimation.
    Decision Trees probabilities are not smooth functions like Naive Bayes and Logistic
    Regression, though there are extensions that are.


    [ 56 ]'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# How does it work?


    Generally, a single tree is created, starting with single features at the root
    decisions split into branches based on the values of the features while at the
    leaf there is either a class or more features. There are many choices to be made,
    such as how many trees, how to choose level at the root or at subsequent level,
    and how to split the feature values when not categorical. This has resulted in
    many algorithms or modifications to the basic Decision Tree. Many techniques to
    split the feature values are similar to what was discussed in the section on discretization.
    Some form of pruning is applied to reduce the size of the tree, which helps in
    addressing overfitting.


    Gini index is another popular technique to split the features. Gini index of data
    in set $S$ of $G(S) = 1 - \sum_{i} p_i^2$ where $p_1, p_2 \dots p_s$ are probability
    distribution for each class.


    If $p$ is the fraction or probability of data in set $S$ of all the data points
    belonging to say class positive, then $1-p$ is the fraction for the other class
    or the error rate in binary classification. The dataset $S$ is split in $r$ ways
    $S_1, S_2 \dots S_r$, the error rate of each set can be quantified as Gini index
    for an $r$ way split is as follows:


    ```

    $GiniSplit(S \Rightarrow S_1, S_2 \dots S_r) = \sum_{i=1}^{r} \frac{|S_i|}{|S|}
    G(S_i)$

    ```


    The split with the lowest Gini index is used for selection. The CART algorithm,
    a popular Decision Tree algorithm, uses Gini index for split criteria.


    The entropy of the set of data points can similarly be computed as:


    ```

    $E(S) = \sum_{j=1}^{k} p_j \log_2 p_j$

    ```


    Similarly, entropy-based split is computed as:


    ```

    $EntropySplit(S \Rightarrow S_1, S_2 \dots S_r) = \sum_{i=1}^{r} \frac{|S_i|}{|S|}
    E(S_i)$

    ```


    The lower the value of the entropy split, the better the feature, and this is
    used in ID3 and C4.5 Decision Tree algorithms [References [12]].'
  merge: -1
