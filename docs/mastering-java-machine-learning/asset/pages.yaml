  md: '# Topic modeling with mallet


    We will illustrate the usage of API and Java code to implement Topic Modeling
    to give the user an illustration on how to build a text learning pipeline for
    a problem in Java:


    ```

    //createPipeline

    ArrayList<Pipe> pipe = new ArrayList<Pipe>();

    // Pipes: lowercase, tokenize, remove stopwords, map to features

    pipe.add(new CharSequenceLowerCase());

    pipe.add(new CharSequenceTokenSequence(Pattern.compile("\\p(L)\\\\p(N)|\\p(P)")));

    pipe.add(new TokenSequenceRemovesStopwords(new File("stopReuters/en.txt"), "UTF-8",
    false, false, false));

    //add all

    pipe.add(new TokenSequenceFeatureSequence());

    InstanceList instances = new InstanceList(new SerialPipes(pipe));

    //read the file

    Reader fileReader = new InputStreamReader(new FileInputStream(new File(fileusers)),
    "UTF-8");

    instances.addThruPipe(new CVCivator(fileReader, Pattern.compile("\\S*(\\S*,\\S*,\\S*,\\.\S*)\\S*"),
    3, 2, 1)); // name fields, data, label

    ```


    ParallelTopicModel in Mallet has an API with parameters such as the number of
    topics, alpha, and beta that control the underlying parameter for tuning the LDA
    distribution. Parallelization is very well supported, as seen by the increased
    number of threads available in the system:


    ```

    ParallelTopicModel model = new ParallelTopicModel(10, 1.0, 0.01);//10

    topics using LDA method

    model.addInstances(instances);//add instances

    model.setNumThreads(3);//parallelize with threading

    model.setNumIterations(10000);//gibbs sampling iterations

    model.estimate();//perform estimation of probability

    ```'
