  md: "Deep Learning\n\n# # Input and outputs\n\nGiven an architecture for the deep\
    \ feed-forward neural net, these are the inputs for training the network:\n\n\
    +   * Number of layers $L$\n* Dataset without labels $D$\n* Dataset with labels\
    \ $D$\n* Number of training iterations $n$\n\n# # How does it work?\n\nThe generalized\
    \ learning/training algorithm for all three is given as follows:\n\n+   1. For\
    \ layers $l=1$ to $L$ (Pre-Training):\n    1. Dataset without Labels $\\mathcal{D}\
    \ = \\{\\mathbf{h}^{l-1}(\\mathbf{x}^{(j)})\\\\}_{j=1}^T$\n    2. Perform Step-wise\
    \ Layer Unsupervised Learning (RBM, Autoencoders, or Denoising Autoencoders) $\\\
    mathbf{b}'$\n    3. Finalize the parameters $\\mathbf{W}'$ from the preceding\
    \ step\n2. For the output layer $(L+1)$ perform random initialization of parameters\
    \ $\\mathbf{W}^{l+1}$, $\\mathbf{b}^{l+1}$\n3. For layers $l=1$ to $L+1$ (Fine-Tuning):\n\
    \    1. Dataset with Labels $\\mathcal{D} = \\{\\{\\mathbf{h}^{l-1}(\\mathbf{x}^{(j)}),\
    \ y^{(j)}\\}_{j=1}^T\n    2. Use the pre-initialized weights from 1. $(\\mathbf{W}',\
    \ \\mathbf{b}')$\n    3. Perform forward-backpropagation for $n$ iterations.\n\
    \n[ 338 ]"
