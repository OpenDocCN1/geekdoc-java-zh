- pgno: 267
  md: '# Inputs and outputs


    Most algorithms take the following parameters as inputs:


    +   - Window size w, corresponding to the fixed size on which the algorithm looks
    for outlier patterns

    - Sliding size s, corresponds to the number of new instances that will be added
    to the window, and old ones removed

    - The count threshold k of instances when using nearest neighbor computation

    - The distance R used to find the outlier threshold in distances


    Outliers as labels or scores (based on neighbors and distance) are outputs.


    # How does it work?


    We present different variants of distance-stream outlier algorithms, giving insights
    into what they do differently or uniquely. The unique elements in each algorithm
    define what happens when the slide expires, how a new slide is processed, and
    how outliers are reported.


    # Exact Storm


    Exact Storm stores the data in the current window w in a well-known index structure,
    so that the range query search or to find neighbors within the distance R for
    a given point is done efficiently. It also stores k preceding and succeeding neighbors
    of all data points:


    +   - Expired Slide: Instances in expired slides are removed from the structure
    that range queries are preserved in the preceding list of neighbors.

    - New Slide: For each data point in the new slide, range query R is executed,
    results are used to update the preceding and succeeding list for the instance,
    and the instance is stored in the index structure.

    - Outlier Reporting: In any window, after the processing of expired and new slide
    elements is complete, any instance with at least k elements from the succeeding
    list and non-expired preceding list is reported as an outlier.'
  merge: -1
  img_proc: true
