- pgno: 124
  md: '# Practical Approach to Real-World Supervised Learning


    # # Model process flow


    In RapidMiner you can define a pipeline of computations using operators with inputs
    and outputs that can be chained together. The following process represents the
    flow used to perform the entire set of operations starting with loading the training
    and test data, handling missing values, weighting features by relevance, filtering
    out low scoring features, training an ensemble model that uses Bagging with Random
    Forest, and finally applying the learned model to the test data and outputting
    the performance metrics. Note that all the preprocessing steps that are applied
    to the training dataset must also be applied, in the same order, to the test set
    by means of the Group Models:


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_124_0.png)


    Figure 18: RapidMiner process diagram


    Following the top of the process, the training set is ingested in the left-most
    operator, followed by the exclusion of non-predictors (Hospital Number, CP data)
    and self-predictors (Lesion 1). This is followed by the operator that replaces
    missing values with the mean and continue for categorical and geographical attributes,
    respectively. Next, the Feature Weights operator evaluates weights for each feature
    based on the Chi-squared statistic, which is followed by a filter that ignores
    low-weighted features. This pre-processed dataset is used to train a model using
    Bagging with a Random Forest classifier.


    The preprocessing steps used on the training data are grouped together in the
    appropriate order via the Group Models operator and applied to the test data in
    the penultimate step. Finally, the predictions of the target variable on the test
    examples accompanied by the confusion matrix and other performance metrics are
    evaluated and presented in the last step.'
  merge: -1
  img_proc: true
