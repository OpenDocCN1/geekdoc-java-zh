  md: '# Real-Time Stream Machine Learning


    Cluster $C_i$ is mapped using:


    ```

    $map(C_i) = \begin{cases} \arg min \{\Delta(C_i, Cl_j^*)\} & \text{if } \forall
    Cl_j, \Delta(C_i, Cl_j^*) > 0 \ 0 & \text{if } C_i = C_0 \ \arg max \{|C_i \cap
    Cl_j^*|}\} \end{cases}$

    ```


    **Penalty phase:** The penalty for every instance that is mapped incorrectly is
    calculated in this step computations of fault objects; objects which are not noise
    and yet correctly placed, using:


    ```

    $pen(o, C_i) = con(o, Cl(o)) * (1 - con(o, map(C_i)))$

    ```


    The overall penalty of point $o$ with respect to all clusters found is given by:


    ```

    $pen(o, C) = max \pen(o, C)\}$

    ```


    **CMM calculation:** Using all the penalties weighted over the lifespan is given
    by:


    ```

    $CMM(C, Cl) = 1 - \frac{\sum_{o \in F} w(o) * pen(o, C)}{\sum_{o \in F} w(o) *
    conn(o, Cl(o))}$

    ```


    Here, $C$ is found clusters, $Cl$, $F$ is the fault objects and $w(o)$ is the
    weight of instance.


    # **V-Measure**


    Validity or V-Measure is an external measure which is computed based on two properties
    that are of interest in stream clustering, namely, **Homogeneity and Completeness.**
    If there are $n$ clusters as set $C = \{c_1, c_2, ..., c_n\}$ and $k$ clusters
    $K = \{k_1, k_2, ..., k_k\}$, contingency tables are created such that $A = [a_{ij}]$
    corresponds to the count of instances in class $c_i$, and cluster $k_j$.


    **Homogeneity:** Homogeneity is defined as a property of a cluster that reflects
    the extent to which all the data in the cluster belongs to the same class.'
