  md: '![](img/2b4ec1705c1d24bfee7a5f8594a281b5_128_0.png)


    # # Results, observations, and analysis


    The impact of handling missing values is significant. Of the seven classifiers,
    with the exception of Naive Bayes and Logistic Regression, all show remarkable
    improvement when missing values are handled as indicated by various metrics, including
    AUC, precision, accuracy, and specificity. This tells us that handling missing
    values that can be "noisy" is an important aspect of data transformation. Naive
    Bayes has its own internal way of managing missing values and the results from
    our experiments show that it does a better job of null-handling than our external
    transformations. But in general, the idea of transforming missing values seems
    beneficial when you consider all of the classifiers.


    As discussed in section, some of the algorithms require the right handling of
    missing values and feature selection to get optimum performance. From the results,
    we can see that the performance of Decision Trees, for example, improved incrementally
    from 0.699 with missing data, 0.812 with managed missing data, and for the best
    performance of 0.824 with missing data handled together with feature selection.
    Six of seven classifiers improve the performance in AUC (and in others metrics)
    when both the steps are performed, comparing Table 5 and Table 6 for AUC gives
    us these quick insights. This demonstrates the importance of doing preprocessing
    such as missing value handling along with feature selection before modeling.'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'A major conclusion from the results is that the problem is highly non-linear
    and therefore most non-linear classifiers from the simplest Decision Trees to
    Random Forest perform very well. The best performance comes from the meta-learning
    algorithm Random Forest, with missing values properly handled and the most relevant
    features used in training. The best linear model measured by AUC was 0.856 for
    Logistic Regression with data-as-it (that is, with missing values), where Random
    Forest achieved AUC performance of 0.915 with proper handling of data accompanied
    by feature selection. Generally, as evident from Table 3, the non-linear classifiers
    or meta-learners perform better than linear classifiers by most performance measures.


    Handling missing values, which can be thought of as ''noise'', in the appropriate
    manner improves the performance of AdaBoost by a significant amount. The AUC improves
    from 0.613 to 0.895 and FPR reduces from 48.15 to 7.41%. This indeed conforms
    to the expected theoretical behavior for this technique.


    Meta-learning techniques, which use concepts of boosting and gaining, are relatively
    more effective when dealing with real-world data, when compared to other techniques.
    This is justified by the results since AdaBoost with Naive Bayes as base trained
    on data that has proper handling of noise outperforms Naive Bayes in most of the
    metrics, as shown in Table 5 and Table 6. Random Forest and GBTs also show the
    best performance along with AdaBoost compared to base classifiers in Table 6,
    again confirming that the right process and ensemble learning can produce the
    optimum results in real-world noisy datasets.


    > All data, models, and results for both WEKA and RapidMiner process files from
    this chapter are available at https://github.com/mjmlbook/mastering-java-machine-learning/tree/master/Chapter2.


    # # Summary


    Supervised learning is the predominant technique in machine learning applications.
    The methodology consists of a series of steps beginning with data exploration,
    data transformation, and data sampling, through feature reduction, model building,
    and model assessment and comparison. Each step of the process involves decision
    making which must answer key How should we imput missing values? What data sampling
    strategy should we use? What is the most appropriate algorithm given the amount
    of noise in the dataset and the prescribed goal of interpretability? This chapter
    demonstrated the application of these processes and techniques to a real-world
    problem—the classification problem using the UCI Horse dataset.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Practical Approach to Real-World Supervised Learning


    Whether the problem is one of classification, when the target is a categorical
    value, or Regression, when it is a real-valued continuous variable, the methodology
    used for supervised learning is similar. In this chapter, we have used classification
    for illustration.


    The first step is data quality analysis, which includes descriptive statistics
    of the features, visualization analysis using univariate, and multivariate feature
    analysis. With the help of various plot types, we can uncover different trends
    in the data and examine how certain features may or may not correlate with the
    label values and with each other. Data analysis is followed by data pre-processing,
    where the techniques used to address data noise, as in the case of missing data,
    outliers, as well as preparing the data for modeling techniques through normalization
    and discretization.


    Following pre-processing, we must split the data into train, validation, and test
    samples. Different sampling strategies may be used depending on the characteristics
    of the data and the problem at hand, for example, when the data is skewed or we
    have a multi-class classification problem. Depending on data size, cross-validation
    is a common alternative to creating a separate validation set.


    The next step is the curing of irrelevant features. In the filter approach, techniques
    that use univariate analysis are entropy-based (Information Gain, Gains Ratio)
    or based on statistical hypothesis testing (Chi-Squared). With the multivariate
    methods, the main aim is reduction of redundant features when considered together,
    or using the ones that correlate most closely with the target label. In the wrapper
    approach, we use machine learning algorithms to tell us about the discriminating
    features. Finally, some learning techniques have feature selection embedded in
    the algorithm in the form of a regularization term, typically using ridge or lasso
    techniques. These represent the embedded approach.


    Modeling techniques are broadly classified into linear, non-linear, and ensemble
    methods. Among linear algorithms, the type of features can determine the algorithms
    to use—Linear Regression (numeric features only), Naive Bayes (numeric or categorical),
    and logistic regression (numeric features only, or categorical transformed to
    numeric) are the workhorses. The outlined advantages and disadvantages of each
    method must be understood when choosing between them or interpreting the results
    of using these models.


    Decision Tree, k-NN, and SVM are non-linear techniques, each with their own strengths
    and limitations. For example, interpretability is the main advantage of Decision
    Tree. k-NN is robust in the face of noisy data, but it does poorly with high-dimensional
    data. SVM suffers from poor interpretability, but it shines even when the dataset
    is limited, and the number of features is large.'
  merge: -1
  img_proc: true
