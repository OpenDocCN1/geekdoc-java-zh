  md: '# Linear Algebra


    Linear algebra is of primary importance in machine learning and it gives us an
    array of tools that are especially handy for the purpose of manipulating data
    and extracting patterns from it. Moreover, when data must be processed in batches
    as in much machine learning, great runtime efficiencies are gained using the "vectorized"
    form as an alternative to traditional looping constructs when implementing software
    solutions in optimization or data pre-processing or any number of operations in
    analytics.


    We will consider only the domain of real numbers in what follows. Thus, a vector
    $\vec{v} \in \mathbb{R}^n$ represents an array of $n$ real-valued numbers. A matrix
    $A \in \mathbb{R}^{m \times n}$ is a two-dimensional array of $m$ rows and $n$
    columns of real-valued numbers.


    Some key concepts from the foundation of linear algebra are presented here.


    # Vector


    The vector x (lowercase, bold, by convention; equivalently, $\vec{x}$) can be
    thought of as a point in $n$-dimensional space. Conventionally, we mean column-vector
    when we say vector. The *transpose* of a column vector is a *row vector* with
    the same number of elements, arranged in a single row.


    ```

    $x = \begin{bmatrix} x_1 \ x_2 \ \vdots \ x_n \end{bmatrix} \Rightarrow x^T =
    [x_1 \ x_2 \ \dots \ x_n]$

    ```'
  merge: -1
  img_proc: true
- pgno: 520
  md: '# Scalar product of vectors


    Also known as the dot product, the scalar product is defined for two vectors of
    equal length. The result of the operation is a scalar value and is obtained by
    summing over the products of the corresponding elements of the vectors. Thus,
    given vectors **x** and **y**:


    ```

    x = \begin{bmatrix} x_1 \ x_2 \end{bmatrix} y = \begin{bmatrix} y_1 \ y_2 \end{bmatrix}

    ```


    The dot product **x,y** is given as as:


    ```

    **x**^T **y** = [x_1, x_2][y_1; y_2] = x_1y_1 + x_2y_2

    ```


    # Matrix


    A matrix is a two-dimensional array of numbers. Each element can be indexed by
    its row and column position. Thus, a 3 x 2 matrix:


    ```

    **A** = \begin{bmatrix} a_{11} & a_{12} \ a_{21} & a_{22} \ a_{31} & a_{32} \end{bmatrix}

    ```


    # Transpose of a matrix


    Swapping columns for rows in a matrix produces the transpose. Thus, the transpose
    of **A** is a 2 x 3 matrix:


    ```

    **A**^T = \begin{bmatrix} a_{11} & a_{21} & a_{31} \ a_{12} & a_{22} & a_{32}
    \end{bmatrix}

    ```'
  merge: -1
  img_proc: true
- pgno: 521
  md: '# Matrix addition


    Matrix addition is defined as element-wise summation of two matrices with the
    shape. Let A and B be two m x n matrices. Their sum C can be written as follows:


    ```

    C_{ij} = A_{ij} + B_{ij}

    ```


    # Scalar multiplication


    Multiplication with a scalar produces a matrix where each element is scaled by
    the scalar value. Here A is multiplied by the scalar value d:


    ```

    D_{ij} = dA_{ij}

    ```


    # Matrix multiplication


    Two matrices A and B can be multiplied if the number of columns of A equals the
    number of rows of B. If A has dimensions m x n and B has dimensions n x p, then
    the product AB has dimensions m x p:


    ```

    C_{ij} = AB = \sum A_{ik}B_{kj}

    ```


    # Properties of matrix product


    Distributivity over addition: A(B + C) = AB + AC


    Associativity: A(BC) = (AB)C


    Non-commutativity: AB ≠ BA


    Vector dot-product is commutative: xᵀy = yᵀx


    Transpose of product is product of transposes: (AB)ᵀ = AᵀBᵀ'
  merge: -1
