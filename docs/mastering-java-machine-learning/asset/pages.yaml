  md: '# Validation and evaluation techniques


    Many of the static clustering evaluation measures discussed in Chapter 3, Unsupervised
    Learning Techniques, have an assumption of static and non-evolving patterns. Some
    of these internal and external measures are used even in streaming based cluster
    detection. Our goal in this section is to first highlight problems inherent to
    cluster evaluation in stream learning, then describe internal and external measures
    that address these, and finally, present some existing measures— both internal
    and external—that are still valid.


    # Key issues in stream cluster evaluation


    It is important to understand some of the important issues that are specific to
    streaming and clustering, as the measures needs to address them:


    +   - Aging: The property of points not being relevant to the clustering measure
    after a given time.


    +   - Missed points: The property of a point not only being missed as belonging
    to the cluster but the amount by which it was missed in the cluster.


    +   - Misplaced points: Changes in clusters caused by evolving new clusters. Merging
    or deleting clusters results in ever-misplaced points with time. The impact of
    these changes with respect to time must be taken into account.


    +   - Cluster noise: Choosing data that should not belong to the cluster or forming
    clusters around noise and its impact over time must be taken into account.


    # Evaluation measures


    Evaluation measures for clustering in the context of streaming data may provide
    a useful index of the quality of clustering, taking into consideration the effect
    of evolving and noisy data streams, overlapping and merging clusters, and so on.
    Here we present some external measures used in stream clustering. Many internal
    measures encountered in Chapter 3, Unsupervised Machine Learning Techniques, such
    as the Silhouette coefficient, Dunn''s Index, and R-Squared, are also used and
    not repeated here.


    # Cluster Mapping Measures (CMM)


    The idea behind CMM is to quantify the connectivity of the points to clusters
    given the ground truth. It works in three phases:


    Mapping phase: In this phase, clusters assigned by the stream learning algorithm
    are mapped to the ground truth clusters. Based on these, various statistics of
    distance and point connectivity are measured using the concepts of k-Nearest Neighbors.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'The average distance of point $p$ to its closest $k$ neighbors in cluster $C_i$
    is given by:


    ```

    $KnnhDistance(p, C_i) = \frac{1}{k} \sum_{o \in knnh(p, C_i)} dist(o, p)$

    ```


    The average distance for a cluster $C_i$ is given by:


    ```

    $kmnhDistance(C_i) = \frac{1}{|C_i|} \sum_{p \in C_i} KnnhhDistance(p, C_i)$

    ```


    The point connectivity of a point $p$ in $C_i$ is given by:


    ```

    $conn(p, C_i) = \begin{cases} 1 & \text{if } KnnhDistance(p, C_i) < KnnhDistance(C_j)
    \ 0 & \text{if } C_i = 0 \ \frac{knnhDistance(C_j)}{KnnhDistance(p, C_i)} & \text{otherwise}
    \end{cases}$

    ```


    Class frequencies are counted for each cluster and the mapping of the cluster
    to the ground truth is performed by calculating the histograms and similarity
    in the clustering.


    Specifically, a cluster $C_i$ is mapped to the ground truth class, and $C_l$ is
    mapped to a ground truth cluster $C_l^g$, which covers the majority of class frequencies
    of $C_g$. The surplus is defined as the number of instances from class $C_l$ not
    covered by the ground truth cluster $C_l^g$, and total surplus for instances in
    classes $C_{l_1}, C_{l_2}, C_{l_s} ... C_l$ in cluster $C$, compared to $C_l^g$
    is given by:


    ```

    $\Delta(C_i, C_l^g) = \sum_{a=1} \max \{0, \rho(C_i)_a - \rho(C_l^g)_a\}$

    ```'
