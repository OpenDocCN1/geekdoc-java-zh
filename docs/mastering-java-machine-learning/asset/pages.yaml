- pgno: 144
  md: '# Advantages and limitations


    +   - Isomap is non-parametric; it preserves the global structure, and has no
    local optimum, but is hampered by speed.

    - LLE and Laplacian Eigenmaps are non-parametric, have no local optima, fast,
    but do not preserve global structure.


    # Clustering


    Clustering algorithms can be categorized in different ways based on the techniques,
    the outputs, the process, and other considerations. In this topic, we will present
    some of the most widely used clustering algorithms.


    # Clustering algorithms


    There is a rich set of clustering techniques in use today for a wide variety of
    applications. This section presents some of them, explaining how they work, what
    kind of data they can be used with, and what their advantages and drawbacks are.
    These algorithms that are prototype-based, density-based, probabilistic partition-based,
    hierarchy-based, graph-theory-based, and those based on neural networks.


    # k-Means


    k-means is a centroid- or prototype-based iterative algorithm that employs partitioning
    and relocation methods (References [101]). k-means finds clusters of spherical
    shape depending on the distance metric used, as in the case of Euclidean distance.


    # Inputs and outputs


    k-means can handle mostly numeric features. Many tools provide categorical to
    numeric transformations, but having a large number of categoricals in the computation
    can lead to non-optimal clusters. User-defined k, the number of clusters to be
    found, and the distance metric to use for computing closeness are two basic inputs.
    k-means generates clusters, association of data to each cluster, and centroids
    of clusters as the output.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# How does it work?


    The most common variant known as Lloyd''s algorithm initializes $k$ centroids
    for the given data by picking elements randomly from the set. It assigns each
    data element to the centroid it is closest to, using some distance metric such
    as Euclidean distance. It then computes the mean of the points for each cluster
    to form the new centroid and the process is repeated until either the maximum
    number of iterations is reached or there is no change in the centroids.


    Mathematically, each step of the clustering can be seen as an optimization step
    where the equation to optimize is given by:


    ```

    $arg\min_{i=1}^{k} \sum_{x \in c_i} (x - \mu_i) = arg\min_{i=1}^{k} \sum_{x \in
    c_i} ||x - \mu_i||^2$

    ```


    Here, $c$ is all points below cluster $i$. The problem of minimizing is classified
    as NP-hard and k-Means has a tendency to get stuck in local optimum.


    # Advantages and limitations


    +   - The number of clusters, $k$, is difficult to pick, but normally search techniques
    such as varying $k$ for different values and measuring metrics such as sum of
    squares errors can be used to find a good threshold. For smaller datasets, hierarchical
    k-Means can be tried.

    - k-means can converge faster than most algorithms for smaller values of $k$ and
    can find effective global clusters.

    - k-means convergence can be affected by initialization of the centroids and hence
    there are many variants to perform random restarts with different seeds and so
    on.

    - k-means can perform badly when there are outliers and noisy data points. Using
    robust techniques such as medians instead of means, k-Medoids, overcomes this
    to a certain extent.

    - k-means does not find effective clusters when they are of arbitrary shapes or
    have different densities.


    # DBSCAN


    Density-based clustering of applications with noise (DBSCAN) is a density-based
    partitioning algorithm. It separates dense region in the space from sparse regions
    (References [14]).'
