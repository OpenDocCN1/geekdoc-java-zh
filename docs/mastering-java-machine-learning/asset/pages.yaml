  md: '# Summary


    The final chapter of this book deals with Machine Learning shifts adapted to what
    is arguably one of the most significant paradigm shifts in information management
    and analytics to have emerged in the last few decades– Big Data. Much as many
    other areas of computer science and engineering have seen, AI–and Machine Learning
    in particular–has benefited from innovative solutions and dedicated communities
    adapting to face the many challenges posed by Big Data.


    One way to characterize Big Data is by volume, velocity, variety, and veracity.
    This demands a new set of tools and frameworks to conduct the tasks of effective
    analytics at large.


    Several open source deployment frameworks are available including Hortonworks
    Data Platform, Cloudera CDH, Amazon Elastic MapReduce, and Microsoft Azure HDInsight.
    Each provides a platform with components supporting data acquisition, data preparation,
    Machine Learning, evaluation, and visualization of results.


    Among these data acquisition components, publish-subscribe is a model offered
    by Apache Kafka (References [8]) and Amazon Kinesis, which involves a broker mediating
    between subscribers and publishers. Alternatives include source-sink, SQL, message
    queuing, and other custom frameworks.


    With regard to storage, several factors contribute to the proper choice for whatever
    your needs may be. HDFS offers a distributed File System with robust fault tolerance
    and high throughput. NoSQL databases also offer high throughput, generally well
    with guarantees on consistency. They include key-value, document, columnar, and
    graph databases.


    Data processing and preparation come next in the flow, which includes data cleaning,
    scaling, and transformation. Hive and Map provide these functions in HDFS systems.
    SparkSQL and Amazon Redshift offer similar capabilities. Real-time stream processing
    is available from products such as Storm and Samza.


    The learning stage in Big Data analytics can include batch or real-time data.


    A variety of rich visualization and analysis frameworks exist that are accessible
    from multiple programming environments.'
