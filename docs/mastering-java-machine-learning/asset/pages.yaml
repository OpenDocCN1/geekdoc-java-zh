    # # Practical issues in machine learning


    It is necessary to appreciate the nature of the constraints and potentially sub-optimal
    conditions may one face when dealing with problems requiring machine learning.
    An understanding of the nature of these issues, the impact of their presence,
    and the methods to deal with them will be addressed throughout the discussions
    in the coming chapters. Here, we present a brief introduction to the practical
    issues that confront us:


    +   **Data quality and noise:** Missing values, duplicate values, incorrect values
    due to human or instrument recording error, and incorrect formatting are some
    of the important issues to be considered while building machine models. In not
    addressing data quality can result in incorrect or incomplete models. In the next
    chapter, we will highlight some of these issues and strategies to overcome them
    through data cleaning.


    +   **Imbalanced datasets:** In many real-world datasets, there is an imbalance
    among labels in the training data. This imbalance in a dataset affects the choice
    of learning, the process of selecting algorithms, model evaluation and verification.
    If the right techniques are not employed, the models can suffer large biases,
    and the learning is not effective. Detailed in the next few chapters are various
    techniques that use meta-learning processes, such as cost-sensitive learning,
    ensemble learning, outlier detection, and so on, which can be employed in these
    situations.


    [ 16 ]'
  merge: -1
  img_proc: true
- pgno: 53
  md: '+   **Data volume, velocity, and scalability:** Often, a large volume of data
    exists in raw form or as real-time streaming data at high speed. Learning from
    the entire data becomes infeasible either due to constraints on the algorithms
    or hardware limitations, or combinations thereof. In order to reduce the size
    of the dataset to fit the resources available, data sampling must be done. Sampling
    can be done in many ways, and each form of sampling introduces a bias. Validating
    the models against sample bias must be performed by employing various techniques,
    such as stratified sampling, varying sample sizes, and increasing the size of
    experiments on different sets. Using big data machine learning can also overcome
    the volume and sampling bias.


    +   **Overfitting:** One of the core problems in predictive models is that the
    model is not generalized enough and is made to fit the given training data too
    well. This results in poor performance of the model when applied to unseen data.
    There are various techniques discussed in later chapters to overcome these issues.


    +   **Curse of dimensionality:** When dealing with high-dimensional data, that
    datasets with a large number of features, scalability of machine learning algorithms
    becomes a serious concern. One of the issues with adding more features is that
    it introduces sparsity, that is, there are now fewer data points on average per
    unit of feature space unless an increase in the number of features is accompanied
    by an exponential increase in the number of training examples. This can hamper
    performance in many methods, such as distance-based algorithms. Adding more features
    can also deteriorate the predictive power of learners, as illustrated in the following
    figure. In such cases, a more suitable algorithm is needed, or the dimensionality
    of the data must be reduced.


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_53_0.png)


    Curse of dimensionality illustrated in classification learning, where adding more
    features deteriorates classifier performance.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Machine learning – roles and process


    Any effort to apply machine learning to a large-sized problem requires the collaborative
    effort of a number of roles, each abiding by a set of systematic processes designed
    for rigor, efficiency, and robustness. The following roles and processes ensure
    that the goals of the endeavor are clearly defined at the outset and the correct
    methodologies are employed in data analysis, data sampling, model selection, deployment,
    and performance evaluation—all as part of a comprehensive framework for conducting
    analytics consistently and with repeatability.


    # Roles


    Participants play specific parts in each step. These responsibilities are captured
    in the following roles:


    +   - **Business domain expert**: A subject matter expert with knowledge of the
    problem domain

    - **Data engineer**: Involved in the collecting, transformation, and cleaning
    of the data

    - **Project manager**: Overseer of the smooth running of the process

    - **Data scientist or machine learning expert**: Responsible for applying descriptive
    or predictive analytic techniques


    # Process


    CRISP (Cross Industry Standard Process) is a well-known high-level process model
    for data mining that defines the analytics process. In this section, we have added
    some of our own extensions to the CRISP process that make it more comprehensive
    and better suited for analytics using machine learning. The entire iterative process
    is demonstrated in the following schematic figure. We will discuss each step of
    the process in detail in this section.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '![](img/2b4ec1705c1d24bfee7a5f8594a281b5_55_0.png)


    +   **Identifying the business problem:** Understanding the objectives and the
    end goals of the project or process is the first step. This is normally carried
    out by a business domain expert in conjunction with the project manager and machine
    learning expert. What are the end goals in terms of data availability, formats,
    specification, collection, ROI, business value, deliverables? All these questions
    are discussed in this phase of the process. Identifying the goals clearly, and
    in quantifiable terms where possible, as dollar amount saved, finding a pre-defined
    number of anomalies or clusters, or predicting more than a certain number of false
    positives, and so, is an important objective of this phase.


    +   **Machine learning:** The next step is mapping the business problem to one
    or more machine learning types discussed in the preceding section. This step is
    generally carried out by the machine learning expert. In it, determine whether
    we should use just one form of learning (for example, supervised, unsupervised,
    semi-supervised) or if a hybrid of forms is more suitable for the project.


    +   **Data collection:** Obtaining the raw data in the agreed format and specification
    for processing follows next. This step is normally carried out by data engineers
    and may require handling some basic ETL steps.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '+   **Data quality analysis:** In this step, we perform analysis on the data
    for missing values, duplicates, and so on, conduct statistical analysis on the
    categorical and continuous types, and similar tasks to evaluate the quality of
    data. Data engineers and data scientists can perform the tasks together.


    +   **Data sampling and transformation:** Determining whether data needs to be
    divided into many tasks and performing data sampling of various sizes for training,
    validation, or testing – these are the tasks performed in this step. It consists
    of employing different sampling techniques, such as oversampling and random sampling
    of the training datasets for effective learning by the algorithms, especially
    when the data is highly imbalanced in the labels. The data scientist is involved
    in this task.


    +   **Feature analysis and selection:** This is an iterative process combined
    with modeling in many tasks to make sure the features are analyzed for either
    their discriminating values or their effectiveness. It can involve finding new
    features, transforming existing features, handling the data quality issues mentioned
    earlier, selecting a subset of features, and so on ahead of the modeling process.
    The data scientist is normally assigned this task.


    +   **Machine learning modeling:** This is an iterative process working on different
    algorithms based on characteristics and learning types. It involves different
    steps, such as generating hypotheses, selecting algorithms, tuning parameters,
    and getting results from evaluation to find models that meet the criteria. The
    data scientist carries out this task.


    +   **Model evaluation:** While this step is related to all the preceding steps
    to some degree, it is more closely linked to the business understanding phase
    and machine learning mapping phase. The evaluation criteria must map in some way
    to the business problem or the goal. Each problem/project has its own goal, whether
    that be improving true positives, reducing false positives, finding anomalous
    clusters or behaviors, or analyzing data for different clusters. Different techniques
    that implicitly or explicitly measure these targets are used based on learning
    techniques. Data scientists and business domain experts normally take part in
    this step.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Chapter 1


    +   - Model selection and deployment: Based on the evaluation criteria, one or
    more models—independent or as an ensemble—are selected. The deployment of models
    normally needs to address several issues: runtime scalability, execution specifications
    of the environment, and audit information, to name a few. Audit information that
    captures the parameters based on learning is an essential part of the process.
    It ensures that model performance can be tracked and compared for the deterioration
    and aging of the models. Saving key information, such as training volumes, dates,
    quality analysis, and so on, is independent of learning types. Supervised learning
    might involve saving the confusion matrix, true positive ratio, area under the
    ROC curve, precision, recall, error valuation results, and so on. Unsupervised
    learning might involve clustering or outlier evaluation results, cluster statistics,
    and so on. This is the domain of the data scientist, as well as the project manager.

    - Model performance monitoring: This task involves periodically tracking the model
    performance in terms of the criteria it was evaluated against, as the true positive
    rate, false positive rate, performance speed, memory allocation, and so on. It
    is imperative to measure the deviations in the metrics with respect to the metrics
    between successive evaluations of the trained model’s performance. The deviations
    and tolerance in the deviation will give insights into repeating the process or
    returning the models as time progresses. The data scientist is responsible for
    this stage.


    As may be observed from the preceding diagram, the entire process is an iterative
    one. After a model or set of models has been deployed, business and environmental
    factors may change in ways that affect the performance of the issues, requiring
    re-evaluation of business goals and success criteria. This takes us back through
    the cycle again.'
  merge: -1
  img_proc: true
