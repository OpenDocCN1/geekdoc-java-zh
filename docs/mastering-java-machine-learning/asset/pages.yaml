  md: 'For hidden layers $k=l+1$ to $I$:


    Compute the gradient of hidden layer parameters:


    ```

    $$\nabla_{W^k}(-\log(f(x))) = \left(\nabla_{a^k(s)}(\log(f(x)))\right)^T \mathbf{h}^{k-1}(x)$

    ```


    ```

    $$\nabla_{a^k}(-\log(f(x))) = \nabla_{a^k(s)}(-\log(f(x)))$

