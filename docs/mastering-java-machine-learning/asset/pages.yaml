- pgno: 296
  md: '# Representation


    A graph compactly represents the complex relationships between random variables,
    allowing fast algorithms to make queries where a full enumeration would be prohibitive.
    In the concepts defined here, we show how directed acyclic graph structures and
    conditional independence make problems involving large numbers of variables tractable.


    # Definition


    A Bayesian network is defined as a model of a system with:


    +   * A number of random variables $\{X_i, X_j ... X_k\}$

    * A Directed Acyclic Graph (DAG) with nodes representing random variables.

    * A local conditional probability distribution (CPD) for each node with dependence
    to its parent nodes $P(X_i \mid parent(X_i))$.

    * A joint probability distribution obtained using the chain rule of distribution
    is a factor given as:


    ```

    $P(X_1, X_2, ... X_k) = \prod_{i=1}^{k} P(X_i \mid parent(X_i))$$

    ```


    +   * For the student network defined, the joint distribution capturing all nodes
    can be represented as:

    $P(D,I,G,S,L) = P(D)P(I)P(G \mid D,I)P(S \mid I)P(L \mid G)$


    # Reasoning patterns


    The Bayesian networks help in answering various queries given some data and facts,
    and these reasoning patterns are discussed here.


    # Causal or predictive reasoning


    If evidence is given as, for example, "low intelligence", then what would be the
    chances of getting a "good letter" as shown in Figure 3, in the top right quadrant?
    This is addressed by causal reasoning. As shown in the first quadrant, causal
    reasoning flows from the top down.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# Evidential or diagnostic reasoning


    If evidence such as a "bad letter" is given, what would be the chances that the
    student got a "good grade"? This question, as shown in Figure 3 in the top left
    quadrant, addressed by evidential reasoning. As shown in the second quadrant,
    evidential reasoning from the bottom up.


    # Intercausal reasoning


    Obtaining patterns from finding a "related cause" is the objective of intercausal
    reasoning. If evidence of "grade C" and "high intelligence" is given, then what
    would be the cause of course being "high"? This type of reasoning is also called
    "explaining away" as one cause explains the reason for another cause and this
    is illustrated in the bottom-left of Figure 3.


    # Combined reasoning


    If a student takes an "easy" course and has a "bad letter", what would be the
    chances of getting a "grade C"? This is explained by queries with combined reasoning
    patterns. Note that it has mixed information and does not a flow in a single fixed
    direction as in the case of other reasoning patterns and is shown in the bottom-right
    of the figure, in quadrant 4:


