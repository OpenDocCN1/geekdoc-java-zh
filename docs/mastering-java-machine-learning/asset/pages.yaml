    # Advantages and limitations


    +   * The key advantage of using one-class SVM—as is true of binary SVM—is the
    many theoretical guarantees in error and generalization bounds.

    * High-dimensional data can be easily mapped to one-class SVM.

    * Non-linear SVM with kernels can even find non-spherical shapes to bound the
    clusters of data.

    * The training cost in space and memory increases as the size of the data increases.

    * Parameter tuning, especially the kernel parameters and the cost parameter tuning
    with unlabeled data is a big challenge.


    # Outlier evaluation techniques


    Measuring outliers in terms of labels, ranks, and scores is an area of active
    research. When the labels or the ground truth is known, the idea of evaluation
    becomes much easier as the outlier class is known and standard metrics can be
    employed. But when the ground truth is not known, the evaluation and validation
    methods are very subjective and there is no well-defined, rigorous statistical
    process.


    # Supervised evaluation


    In cases where the ground truth is known, the evaluation of outlier algorithms
    is basically the task of finding the best thresholds for outlier scores (scoring-based
    outliers).


    The balance between reducing the false positives and improving true positives
    is the key and Precision-Recall calls (described in Chapter 2, Practical Approach
    to Real-World Supervised Learning) are used to find the best optimum. Confidence
    score, predictions, and actual labels are used in supervised learning to plot
    PRCurves, and instead of confidence scores, outlier scores are ranked and used
    here. ROC curves and area under curves are also used in many applications to evaluate
    thresholds. Comparing two or more algorithms and selection of the best can also
    be done using area under curve metrics when the ground truth is known.'
