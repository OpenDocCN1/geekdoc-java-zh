- pgno: 162
  md: '# Inputs and outputs


    Distance-based techniques require natively numeric or categorical features to
    be transformed into numeric values. Inputs to distance-based methods are the distance
    metric used, the distance threshold ε, the threshold fraction n, which together
    determine if a point is an outlier. For KNN methods, the choice k is an input.


    # How does it work?


    There are many variants of distance-based outliers and we will discuss how each
    of them work at a high level:


    +   DB (ε, n) Algorithms: Given a radius of ε and threshold of n, a data point
    is considered as an outlier if n percentage of points have distance to the point
    less than ε. There are further variants using nested loop structures, gridbased
    structures, and index-based structures on how the computation is done.


    +   KNN-based methods are also very common where the outlier score is computed
    by taking the KNN distance to the point or the average distance to point [INN,3NN...KNN].


    # Advantages and limitations


    +   The main advantage of distance-based algorithms is that they are nonparametric
    and make no assumptions on distributions and how to fit them models.


    +   The distance calculations are straightforward and computed in parallel, helping
    the algorithms to scale on large datasets.


    +   The major issues with distance-based methods is the curse of dimensionality
    discussed in the first chapter; for large dimensional data, sparsity can lead
    to noisy outliers.


    # Density-based methods


    Density-based methods extend the distance-based methods by not only measuring
    the local density of the given point, but also the local densities of its neighborhood
    points. Thus, the relative factor gave it the edge in finding more complex outliers
    that are local or global in nature, but at the added cost of computation.


    # Inputs and outputs


    Density-based algorithm must be supplied the minimum number of points MinPts in
    a neighborhood of input radius ε centered on an object that determines it is a
    core object in a cluster.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# How does it work?


    We will first discuss the Local Outlier Factor (LOF) method and then discuss some
    variants of LOF [21].


    Given the MinPts as the parameter, LOF of a data point is:


    ```

    $LOF_{MinPts}(p) = \frac{\sum_{o \in MinPts(p)} lrd_{MinPts}(o)}{lrd_{MinPts}(p)}
    |N_{MinPts}(p)|$

    ```


    $|N_{MinPts}(p)|$ is the number of data points in the neighborhood of point $p$,
    and $lrd_{MinPts}$ is the local reachability density of the point and is defined
    as:


    ```

    $lrd_{MinPts}(p) = \frac{1}{\sum_{o \in MinPts(p)} reachDist_{MinPts}(o, p)}}
    |N_{MinPts}(p)|$

    ```


    $reachDist_{MinPts}(o, p)$ is the reachability of the point and is defined as:


    ```

    $reachDist_{MinPts}(o, p) = \max(MinPtsDistance(o, p), distance(o, p))$

    ```


    One of the disadvantages of LOF is that it may miss outliers whose neighborhood
    density is close to that of its neighborhood. **Connectivity-based outliers (COF)**
    using set-based nearest path and set-based nearest trail originating from the
    data point are used to improve on LOF. COF treats the low-density region بمعنى
    to the isolated region and overcomes the disadvantage of LOF:


    ```

    $COF(p)_k = \frac{\frac{|N(p)_k|}{\sum_{o \in N(p)_k} averageChainDist_{N(p)_k}(o)}}{averageChainDist_{N(p)_k}(p)}$

    ```'
  merge: -1
