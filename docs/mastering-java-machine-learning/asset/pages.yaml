  md: "Real-Time Stream Machine Learning\n\n# # How does it work?\n\n+   1. This algorithm\
    \ works by using the k-Means algorithm in two modes, an offline mode and an online\
    \ mode, both working in parallel.\n2. For the online mode:\n   1. Apply k-Means\
    \ on the given window $w$ and find clusters and partitions of the data with clusters.\n\
    \   2. Rank the clusters based on the cluster distance and cluster size. The clusters\
    \ which are farthest apart and small in size are considered outliers.\n   3. Store\
    \ the clusters in memory for the window as $O_w = [x_1, x_2, \\dots, x_n]$\n \
    \  4. The window is cleared and the process is repeated.\n3. For the offline mode:\n\
    \   1. Get outliers from $n$, previous windows, and create a set: $S = \\{O_1^*,\
    \ O_2^*, \\dots, O_n^*\\}$\n   2. Cluster this window with set $S$ using k-Means\
    \ and find clusters which are farthest away and small in size.\n   3. These clusters\
    \ are global outliers.\n   4. The window is cleared and the process is repeated.\n\
    \n# # Advantages and limitations\n\nThe advantages and limitations are as follows:\n\
    \n+   - It is very sensitive to the two parameters $k$ and $n$ and can generate\
    \ lots of noise.\n- Only spherical clusters/outliers are found and outliers with\
    \ different shapes get missed.\n\n# # Distance-based clustering for outlier detection\n\
    \nDistance-based outlier detection is the most studied, researched, and implemented\
    \ in the area of stream learning. There are many variants of the distance-based\
    \ methods, based on sliding windows, the number of nearest neighbors, radius and\
    \ thresholds, and other measures for considering outliers in the data. We will\
    \ try to give a sampling of the most important algorithms in this section."
