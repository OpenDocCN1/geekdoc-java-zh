- pgno: 146
  md: '# Inputs and outputs


    Only numeric features are used in DBSCAN. The user-defined parameters are MinPts
    and the neighborhood radius given by $\epsilon$.


    # How does it work?


    The algorithm finds the $\epsilon$-neighborhood of every point $p$, given by $N_p:\{q|d(p,q)
    \le \epsilon\}$. A high density region is identified as a region where the number
    of points in a $\epsilon$-neighborhood is greater than equal to the given MinPts;
    the point such a $\epsilon$-neighborhood is said to be *directly reachable*. All
    core points are *directly reachable*. Points within the $\epsilon$-neighborhood
    of a *core point* can be in effect reached by hopping from one directly reachable
    point to another *directly reachable* from the second point, and so on, are considered
    to be the same cluster. Any point that has fewer than MinPts in its $\epsilon$-neighborhood,
    but belongs to the same cluster as the core point. These points are called *border
    points*. A *noise point* is any point that is neither a core point nor a border
    point.


    # Advantages and limitations


    +   * The DBSCAN algorithm does not require the number of clusters to be specified
    and can find it automatically from the data.

    * DBSCAN can find clusters of various shapes and sizes.

    * DBSCAN is not completely deterministic in its identification of the points and
    its categorization into border or core depends on the order of data processed.

    * Distance metrics such as Euclidean distance can often affect performance due
    to the curse of dimensionality.

    * When there are clusters with large variations in the densities, the static choice
    of $[MinPts, \epsilon]$ can pose a big limitation.


    # Mean shift


    Mean shift is a very effective clustering algorithm in many image, video, and
    motion detection based datasets (References [11]).'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# Inputs and outputs


    Only numeric features are accepted as data input in the mean shift algorithm.
    The choice of kernel and the bandwidth of the kernel are user-driven choices that
    affect the performance. Mean shift generates modes of data points and clusters
    data around the modes.


    # How does it work?


    Mean shift is based on the statistical concept of kernel density estimation (KDE),
    which is a probabilistic method to estimate the underlying data distribution from
    the sample.


    A kernel density estimate for kernel K (x) of bandwidth h takes the form by:


    ```

    $f(\mathbf{x}) = \frac{1}{nh^d} \sum_{i=1}^{n} K\left(\frac{\mathbf{x}-\mathbf{x}_i}{h}\right)$

    ```


    For $n$ points with dimensionality $d$. The mean shift works by moving each data
    point in the direction of local increasing density. To estimate this direction,
    the gradient is applied to the KDE and the gradient takes the form of:


    ```

    $\nabla f(\mathbf{x}) = \frac{2}{nh^{d+2}} \left[ \sum_{i=1}^{n} g\left(\frac{\mathbf{x}-\mathbf{x}_i}{h}\right)
    \right] m(\mathbf{x})$

    ```


    Here $g(\mathbf{x}) = -K''(\mathbf{x})$ is the derivative of the kernel. The vector,
    $m(\mathbf{x})$, is called the mean shift vector and is used to move the points
    in the direction


    ```

    $\mathbf{x}^{(t+1)} = \mathbf{x}^t + m(\mathbf{x})$

    ```


    Also, it is guaranteed to converge when the gradient of the density function is
    zero. Points that end up in a similar location are marked as clusters belonging
    to the same region.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Advantages and limitations


    +   - Mean shift is non-parametric and makes no underlying assumption on the data
    distribution.

    - It can find non-complex clusters of varying shapes and sizes.

    - There is no need to explicitly give the number of clusters; the choice of the
    bandwidth parameter, which is used in estimation, implicitly controls the clusters.

    - Mean shift has no local optima for a given bandwidth bandwidth parameter and
    hence it is deterministic.

    - Mean shift is robust to outliers and noisy points of KDE.

    - The mean shift algorithm is computationally slow and does not scale well with
    large datasets.

    - Bandwidth selection should be done judiciously; otherwise it can result in merged
    modes, or the appearance of extra, shallow modes.


    # Expectation maximization (EM) or Gaussian mixture modeling (GMM)


    GMM or EM is a probabilistic partition-based method that partitions data into
    k clusters using probability distribution-based techniques (References [13]).


    # Input and output


    Only numeric features are allowed in EM/GMM. The model parameter is the number
    of mixture components, given by k.


    # How does it work?


    GMM is a generative method that assumes there are k Gaussian components, each
    Gaussian component has a mean $\mu$, and covariance $\Sigma$. The following expression
    represents the probability of the dataset given the k Gaussian components:


    ```

    $p(data|\mu_1, \mu_2, \dots, \mu_k)$$


    $= \prod_{i=1}^n p(x_i|\mu_1, \mu_2, \dots, \mu_k)$

    ```'
  merge: -1
  img_proc: true
- pgno: 149
  md: '$=\prod_{j=1}^{k} P(x_j | \mu_1, \mu_2, \dots \mu_k) P(w_j)$


    The two-step task of finding the means $[\mu_r, \mu_r \dots \mu_k]$ for each of
    the $k$ Gaussian components such that the data points assigned to each maximizes
    the probability of that component is done using the *Expectation Maximization*
    (EM) process.


    The iterative process can be defined into an E-step, that computes the *expected*
    cluster for all data points for the cluster, in an iteration $i$:


    ```

    $P(w_i | x_i, \lambda_j) = \frac{p(x_i | w_i, \lambda_j) P(w_i | \lambda_j)}{p(x_i
    | \lambda_j)}$

    ```


    The M-step maximizes to compute $\mu_{i+1}$ the data points belonging to the cluster:


    ```

    $\mu_{i+1} = \frac{\sum_i P(w_i | x_i, \lambda_j) x_i}{\sum_i P(w_i | x_i, \lambda_j)}$

    ```


    The EM process can result in GMM convergence into local optimum.


    # # Advantages and limitations


    +   - Works very well with any features; for categorical data, discrete probability
    is calculated, while for numeric a continuous probability function is estimated.

    - It has computational scalability problems. It can result in local optimum.

    - The value of $k$ Gaussians has to be given *apriori*, similar to k-Means.


    # # Hierarchical clustering


    Hierarchical clustering is a connectivity-based method of clustering that is widely
    used to analyze and explore the data more than it is used as a clustering technique
    (*References* [12]). The idea is to iteratively build binary trees either from
    top or bottom, such that similar points are grouped together. Each level of the
    tree provides interesting summarization of the data.'
  merge: -1
