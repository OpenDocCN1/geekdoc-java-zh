  md: 'Real-Time Stream Machine Learning


    # Abstract-C


    Abstract-C keeps the index structure similar to Exact Storm but instead of preceding
    succeding lists for every object it maintains a list of counts of neighbors for
    the windows the instance is participating in:


    +   - Expired Slide: Instances in expired slides are removed from the index structure
    that affects range queries and the first element from the list of counts removed
    corresponding to the last window.

    - New Slide: For each data point in the new slide, range query R is executed and
    results are used to update the list count. For existing instances, the count gets
    updated with new neighbors and instances are added to the index structure.

    - Outlier Reporting: In any window, after the processing of expired and new slide
    elements is complete, all instances with a neighbors count less than k in the
    current window are considered outliers.


    # Direct Update of Events (DUE)


    DUE keeps the index structure for efficient range queries exactly like the other
    algorithms but has a different assumption, that when an expired slide occurs,
    not every instance is affected in the same way. It maintains two priority queues:
    the unsafe inlier queue and the outlier list. The unsafe inlier queue has sorted
    instances based on the increasing order of smallest expiration time of their preceding
    neighbors. The outlier list has all the outliers in the current window:


    +   - Expired Slide: Instances in expired slides are removed from the index structure
    that affects range queries and the unsafe inlier queue is updated for expired
    neighbors. Those unsafe inliers which become outliers are removed from the priority
    queue and moved to the outlier list.

    - New Slide: For each data point in the new slide, range query R is executed,
    results are used to update the succeeding neighbors of the point, and only the
    most recent preceding points are updated for the instance. Based on the updates,
    the point is added to the unsafe inlier priority queue or removed from the queue
    and added to the outlier list.

    - Outlier Reporting: In any window, after the processing of expired and new slide
    elements is complete, all instances in the outlier list are reported as outliers.


    [ 232 ]'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Micro Clustering based Algorithm (MCOCD)


    Micro-clustering based outlier detection overcomes the computational issues of
    performing range queries for every data point. The micro-cluster data structure
    is used instead of range queries in these algorithms. A micro-cluster is centered
    around an instance and has a radius of R. All the points belonging to the micro-clusters
    become inliers. The points that are outside be outliers or inliers and stored
    in a separate list. It also has a data structure similar to DUE for a priority
    queue of unsafe inliers:


    +   - **Expired Slide:** For each data point in the new slide, the instance either
    becomes a center of a micro-cluster, or part of a micro-cluster or added to the
    event queue R, it gets assigned to an existing micro-cluster; otherwise, if there
    are k points within R, it becomes the center of the new micro-cluster; if not,
    it goes into the two structures of the event queue and possible outliers.

    - **Outlier Reporting:** In any window, after the processing of expired and new
    slide elements is complete, any instance in the outlier structure with less than
    k neighboring instances is reported as an outlier.


    # Approx Storm


    Approx Storm, as the name suggests, is an approximation of Exact Storm. The two
    approximations are:


    +   - Reducing the number of data points in the window by adding a factor ρ and
    changing the window to ρW.

    - Storing the number instead of the data structure of preceding neighbors using
    the fraction of the number of neighbors which are safe inliers in the preceding
    list to the number in the current window.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# Real-Time Stream Machine Learning


    The processing of expired and new slides and how outliers are determined based
    on these steps follows:


    +   - **Expired Slide:** Same as Exact Storm – instances in expired slides are
    removed from the index structure that affects range queries preserved in the preceding
    list of neighbors.


    +   - **New Slide:** For each data point in the new slide, range query $R$ is
    executed, results are used to compute the fraction discussed previously, and the
    index structure is updated. The number of safe inliers are constrained to $pW$
    by removing random inliers if the size exceeds that value. The assumption is that
    most of points in safe inliers are safe.


    +   - **Outlier Reporting:** In any window, after the processing of expired and
    new slides has been completed, an approximation (see *References [17]*) of the
    number of neighbors of an instance based on the fraction, window size, and preceding
    list is a value less than $k$, it is considered an outlier.


    # Advantages and limitations


    The advantages and limitations are as follows:


    +   - Exact Storm is demanding in storage and CPU for storing lists and retrieving
    neighbors. Also, it introduces delays; even though they are implemented in efficient
    data structures, range queries can be slow.


    +   - Abstract-C has a small advantage over Exact Storm, as no time is spent on
    finding active neighbors for each instance in the window. The storage and time
    spent is still very much dependent on the window and slide chosen.


    +   - DUE has some advantage over Exact Storm and Abstract-C as it can efficiently
    re-evaluate the "inliness" of points (that is, whether unsafe inliers remain inliers
    or become outliers) by sorting the structure impacts both CPU and memory.


    +   - MCOD has distinct advantages in memory and CPU using the use of the micro-cluster
    structure and removing the pair-wise distance computation. Storing the neighborhood
    information in micro-clusters helps memory too.


    +   - Approx Storm has an advantage of time over the others as it doesn''t process
    the expired data points over the previous window.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# Validation and evaluation techniques


    Validation and evaluation of stream-based outliers is still an open research area.
    In many research comparisons, we see various metrics being used, such as:


    +   - Time to evaluate in terms of CPU times per object

    - Number of outliers detected in the streams

    - Number of outliers that correlate to existing labels, TP/Precision/Recall/Area
    under PRC curve, and so on


    By varying parameters such as window-size, neighbors within radius, and so on,
    we determine the sensitivity to the performance metrics mentioned previously and
    determine the robustness.


    # Case study in stream learning


    The study in this chapter contains several experiments that illustrate different
    methods of stream-based machine learning. A well-studied dataset was chosen as
    the stream data source and supervised tree based methods such as Naive Bayes,
    Hoeffding Tree, as well as ensemble methods. Among unsupervised methods, clustering
    algorithms used include K-Means, DBSCAN, ClStream and ClTree. Outlier detection
    techniques include MCOD and SimpleCOD, among others. We also show results from
    classification experiments that demonstrate handling concept drift. The ADWIN
    algorithm for calculating statistics in a sliding window, as described earlier
    in this chapter, is employed in several algorithms used in the classification
    experiments.


    # Tools and software


    One of the most popular and arguably the most comprehensive Java-based frameworks
    for stream data mining is the open source Massive Online Analysis (MOA) software
    created by the University of Waikato. The framework is a collection of stream
    classification, clustering, and outlier detection algorithms and has support for
    change detection and concept drift. It also includes data generators and evaluation
    tools. The framework can be extended this case study, we employ several stream
    data learning methods using a file-based data stream.'
  merge: -1
  img_proc: true
