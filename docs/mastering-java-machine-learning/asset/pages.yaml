- pgno: 167
  md: "The Angle-based Outlier Degree (ABOD) method uses the basic assumption that\
    \ if a data point in high dimension is an outlier, all the vectors originating\
    \ from it towards data points nearest to it will be in more or less the same direction.\n\
    \n![](img/2b4ec1705c1d24bfee7a5f8594a281b5_167_0.png)\n\nGiven a point $p$, and\
    \ any two points $x$ and $y$, the angle between the two points and $p$ is given\
    \ by:\n\n```\n$$\\overline{px}, \\overline{py}$\n```\n\nMeasure of variance used\
    \ as the ABOD score is given by:\n\n```\n$$ABOD(p) = \text{VAR}_{x,y} \\left[\
    \ \\frac{\\overline{px}, \\overline{py}}{\\|\\overline{px}\\| \\|\\overline{py}\\\
    |} \\right]$$\n```\n\nThe smaller the ABOD value, the smaller the measure of variance\
    \ in the angle spectrum, and the larger chance of the point being the outlier."
