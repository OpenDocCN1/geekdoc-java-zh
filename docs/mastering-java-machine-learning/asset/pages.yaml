- pgno: 143
  md: '# Inputs and outputs


    Manifold learning algorithms require two user-provided parameters: $k$, representing
    the number of neighbors for the initial search, and $n$, the number of manifold
    coordinates.


    # How does it work?


    As seen in the following, the three-dimensional S-Curve, plotted using the scikit-learn
    utility (References [27]), is represented in 2D PCA and 2D manifold LLE. It is
    interesting to observe how the blue, green, and red dots are mixed up in the PCA
    representation while the manifold learning representation using LLE cleanly separates
    the colors. It can also be observed that the rank ordering of Euclidean distances
    is not maintained in the manifold representation:


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_143_0.png)


    Figure 3: Data representation after PCA and manifold learning


    To preserve the structure, the geodesic distance is preserved instead of the Euclidean
    distance. The general approach is to build a graph structure such as an adjacency
    matrix, and then compute geodesic distance using different assumptions. In the
    Isomap Algorithm, the global pairwise distances are preserved (References [7]).
    In the Local Linear Embedding (LLE) Algorithm, the mapping is done to take care
    of local neighborhood, that is, nearby points map to nearby points in the transformation
    (References [9]). Laplacian Eigenmaps is similar to LLE, except it tries to maintain
    the "locality" instead of "local linearity"a in LLE by using graph Laplacian (References
    [8]).'
