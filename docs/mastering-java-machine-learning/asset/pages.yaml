- pgno: 460
  md: '# Text Mining and Natural Language Processing


    The concept of recursive neural networks is now extended using the building blocks
    of encoders and decoders to learn reversible sentence representation – that is,
    reconstructing the original sentence with roughly the same meaning from the input
    sentence (References [27]). This has become the central theme behind Neural Machine
    Translation. Modeling conversations using the encoder-decoder framework of RNNs
    has also made huge breakthroughs (References [28]).


    # Tools and usage


    We will now discuss some of the well-known tools and libraries in Java that are
    used in various NLP and text applications.


    # Mallet


    Mallet is a Machine Learning toolkit for text written in Java, which comes with
    several natural language processing libraries, including those some for document
    classification, sequence tagging, and topic modeling, as well as Machine Learning
    algorithms. It is open source, released under CPL. Mallet exposes an extensive
    API (see the following screenshots) to create and configure sequences of "pipes"
    for pre-processing, vectorizing, feature selection and clustering algorithms,
    and so on, as well as to extend implementations of classification and clustering
    other text Mining capabilities.


    | Preprocessing API | Feature Generation, Selection API | Text Classification
    API | Text Clustering API |

    |---|---|---|--|

    | > xml-page | > words | > text | > text |

    | > tokenize | > stopwords | > mallet | > classify |

    | > filter | > regex | > classifier | > clustering |

    | > lowercase | > stemmer | > evaluate | > examples |

    | > remove-punctuation | > AlphabetFeatureExtractor | > label | > handler |

    | | > POSFeatureExtractor | | > neighbor_evaluator |

    | ApachePipe.java | > WordFeatureExtractor | | > url |

    | OpenPipe.java | > CharNGFeatureExtractor | | > Cluster java |

    | StanfordPipe.java | > TFIDFFeatureExtractor | > AggressiveGenerative | > Clustering
    |

    | DictionaryFeatureExtractor.java | > HashingFeatureExtractor | > DensityClassifier
    | > AggressiveGenerativeDensity |

    | NgramFeatureExtractor.java | > SequenceFeatureExtractor | > KClusterClassifier
    | > KMeans |

    | WordCountExtractor.java | > VectorFeatureExtractor | | package.html |

    | StopwordFeatureExtractor.java | > ClassifierTrainer | | Record.java |'
