    \ Each node in the decision tree keeps sufficient statistics; based on the Hoeffding\
    \ test, an alternate subtree is grown and swapped when the accuracy is better.\n\
    \n# Advantages and limitations\n\nThe advantages and limitations are as follows:\n\
    \n+   * The basic HT has issues with attributes being close to the chosen $\\\
