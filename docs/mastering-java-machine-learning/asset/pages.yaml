  md: '# Recurrent Neural Networks


    Normal deep networks are used when you have finite inputs and there is no interdependence
    between the input examples or instances. When there are variable length inputs
    and there are temporal dependencies between them, that is, sequence related data,
    recurrent neural networks (RNN) are examples of neural networks that are widely
    used to solve such problems, and we will discuss them in the following sections.
    RNNs are used in many sequence-related problems such as text mining, language
    modeling, bioinformatics data modeling, and so on, to name a few areas that fit
    this meta-level description (References [18 and 21]).


    # Structure of Recurrent Neural Networks


    We will describe the simplest unit of the RNN first and then show how it is combined
    to understand functionally and mathematically and illustrate how different components
    interact and work.


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_392_0.png)


    Figure 32: Difference between an artificial neuron and a neuron with feedback.


    Let''s consider the basic input, a neuron with activation, and its output at a
    given time t:


    ```

    $h^{(t)} = g_h(W_h x^{(t)} + b_h)$$n$$y^{(t)} = g_y(W_y h^{(t)} + b_y)$

    ```'
