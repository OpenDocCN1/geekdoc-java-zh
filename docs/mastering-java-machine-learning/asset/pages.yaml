  md: "# Independencies, flow of influence, D-Separation, I-Map\n\nThe conditional\
    \ independencies between the nodes can be exploited to reduce the computations\
    \ when performing queries. In this section, we will discuss some of the important\
    \ concepts that are associated with independencies.\n\n# Flow of influence\n\n\
    **Influence** is the effect of the condition or outcome of one variable changes\
    \ the value or the belief associated with another variable. We have seen this\
    \ from the reasoning patterns that influence flows in direct relationships (parent/child),\
    \ causal/evidential (parent and child with intermediates) and in combined structures.\n\
    \nThe only case where the influence doesn't flow is when there is a \"v-structure\"\
    . That is, given edges between three variables $X_{i-1} \rightarrow X_i \\leftarrow\
    \ X_{i+1}$ there is a v-structure and no influence flows between $X_{i-1}$ and\
    \ $X_{i+1}$, no influence flows between the Difficulty and the Intelligence of\
    \ the student.\n\n# D-Separation\n\nRandom variables X and Y are said to be d-separated\
    \ in the graph **G**, given there is no active trail between **X** and **Y** in\
    \ **G** given **Z**. It is formally denoted by:\n\n```\n$dsep_c(X,Y|Z)$\n```\n\
    \nThe point of d-separation is that it maps perfectly to the conditional independence\
    \ between the points. This gives to an interesting property that in a Bayesian\
    \ network any variable is independent of its non-descendants given the parents\
    \ of the node.\n\nIn the Student network example, the node/variable Letter is\
