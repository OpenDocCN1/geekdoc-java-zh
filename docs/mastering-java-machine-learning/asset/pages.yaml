  md: '# # K-Nearest Neighbors (KNN)


    K-Nearest Neighbors falls under the branch of non-parametric and lazy algorithms.
    K-Nearest neighbors don''t make any assumptions on the underlying data and doesn''t
    build and generalize models from training data (References [10]).


    # ## Algorithm inputs and outputs


    Though KNN''s can work with categorical and numeric features, the distance computation,
    which is the core of finding the neighbors, works better with numeric features.
    Normalization of numeric features to be in the same ranges is one of the mandatory
    steps required. KNN''s outputs are generally the classes based on the neighbors''
    distance calculation.


    KNN uses the entire training data to make predictions on unseen test data. When
    unseen test data is distance computation and based on the neighbors and the metric
    of deciding the category it classifies the new point. If we consider two vectors
    represented by x, and x2 corresponding to two data points the distance is calculated
    as:


    +   - Euclidean Distance:


    ```

    $d_{EUC}(\mathbf{x}_1, \mathbf{x}_2) = [(\mathbf{x}_1 - \mathbf{x}_2)(\mathbf{x}_1
    - \mathbf{x}_2)]^{\frac{1}{2}}$

    ```


    +   - Cosine Distance or similarity:


    ```

    $S_{cos}(\mathbf{x}_1, \mathbf{x}_2) = \frac{\mathbf{x}_1 \cdot \mathbf{x}_2}{\|\mathbf{x}_1\|
    \|\mathbf{x}_2\|}$

    ```


    The metric used to classify an unseen may simply be the majority class among the
    K neighbors.'
  merge: -1
  img_proc: true
