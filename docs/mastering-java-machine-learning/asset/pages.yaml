  md: 'Chapter 9


    Many extensions have been written for Spark, including Spark MLlib, and the user
    community continues to contribute more packages. You can download third-party
    packages or register your own at https://spark-packages.org.


    # # Tools and usage


    Spark MLlib provides APIs for other languages in Java, Scala, Python, and R. When
    a SparkContext is created, it launches a monitoring and instrumentation web console
    at port 4040, which lets us see key information about the runtime, including scheduled
    tasks and their progress, RDD sizes and memory, and so on. There are also external
    profiling tools available for use.


    # # Experiments, results, and analysis


    experiments using H2O five learning algorithms from MLlib, in all. The first K-means
    with all features using a k value determined by computing the cost—specifically,
    the Sum of Squared Error (SSE)—over a large number of k and selecting the "elbow"
    of the curve. Determining the optimal value of k is typically not an easy task;
    even though we know the number of classes in the dataset in order to pick the
    best k, it is interesting to see where experiments this might lead if we pretend
    we did not have labeled data. The optimal k found using the elbow method was 27.
    In the real world, business decisions may often guide the selection of k.


    In the following listings, we show how to use different models from the MLlib
    suite to cluster analysis and classification. The code is based on examples in
    the MLlib API Guide (https://spark.apache.org/html). We used the normalized UCI
    CoverType dataset in CSV format. Note that it is more natural to use spark.sql.Dataset
    with the newer spark.ml package, whereas the spark.mllib package works more closely
    with JavaRDD. This provides an abstraction over RDDs and allows for optimization
    of the transformations beneath the covers. In the case of unsupervised learning
    algorithms, the data must be transformed such that the dataset to be used for
    training and testing should have a column called features by default that contains
    all the features of an observation as a vector. A VectorAssembler object can be
    used for this transformation. A glimpse into the use of ML pipelines, which is
    a way to chain tasks together, is given in the source code for training a Random
    Forest classifier.


