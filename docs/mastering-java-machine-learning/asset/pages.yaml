  md: "# How does it work?\n\nThe complete training pseudo-code CD with the free energy\
    \ function and partial derivatives are can be given as:\n\n+   1. For each instance\
    \ in training $\\mathbf{x}$:\n\n+   1. Generate a negative particle $\tilde{\\\
    mathbf{x}}$ using $k$ steps of Gibbs Sampling.\n2. Update the parameters:\n\n\
    ```\n$W \\leftarrow W + \\alpha(h(\\mathbf{x}')\\mathbf{x}'^T - h(\\tilde{\\mathbf{x}}))$$\n\
    \\n$b \\leftarrow b + \\alpha(h(\\mathbf{x}') - h(\\tilde{\\mathbf{x}}))$$\n\\\
    n$c \\leftarrow c + \\alpha(\\mathbf{x}' - \\tilde{\\mathbf{x}})$\n```\n\n# Persistent\
    \ contrastive divergence\n\nPersistent contrastive divergence is another trick\
    \ used to compute the joint probability $p(x,h)$. In this method, there is a single\
    \ chain that does not reinitialize after every observed sample to find the negative\
    \ particle $\tilde{\\mathbf{x}}$. It persists its state and parameters are updated\
    \ just through running these $k$ states by using the particle from the previous\
    \ step.\n\n# Autoencoders\n\nAn autoencoder is another form of unsupervised learning\
    \ technique in neural networks. It is very similar to the feed-forward neural\
    \ network described at the start with the only difference being it doesn't generate\
    \ a class at output, but tries to replicate the input at the output layer (*References*\
    \ [12 and 23]). The goal is to have hidden layer(s) capture the latent or hidden\
    \ information of the input as features that can be useful in unsupervised or supervised\
    \ learning."
  merge: -1
  img_proc: true
- pgno: 369
  md: '# # Definition and mathematical notations


    A single hidden layer example of an Autoencoder is shown in the following figure:


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_369_0.png)


    The input layer and the output layer have the same number of neurons similar as
    feed-forward, corresponding to the input vector, x. Each hidden layer can have
    greater, equal, or fewer neurons than the input or output layer and an activation
    function that does a non-linear transformation of the signal. It can be seen as
    using the unsupervised or latent hidden structure to "compress" the data effectively.


    The encoder or input transformation of the data by the hidden layer is given by:


    > $$\mathbf{h}(\mathbf{x})=g(\mathbf{x}))$$


    And the decoder or output transformation of the data by the output layer is given
    by:


    > $$\hat{\mathbf{x}}=o(\hat{\mathbf{h}})$$


    Generally, a sigmoid function with linear transformation of signals as described
    in the neural network section is popularly used in the layers:


    > $$\mathbf{h}(\mathbf{x})=sigma(\mathbf{b}+\mathbf{W}\mathbf{x}) \text{ and }
    \tilde{\mathbf{x}}=sigma(c+\mathbf{W}*\mathbf{h}(\mathbf{x}))$$'
  merge: -1
  img_proc: true
- pgno: 370
  md: '# Loss function


    The job of the loss function is to reduce the training error as before so that
    an optimization process such as a stochastic gradient function can be used.


    In the case of binary valued input, the loss function is generally the average
    cross-entropy given by:


    ```

    $l(f(x)) = \sum_i (x_i \log x_i + (1-x_i) \log(1-\hat{x}_i))$ where $k = dimension$$

    ```


    It can be easily verified that, when the input and output signal match either
    0 or 1, the error is 0. for real-valued input, a squared error is used:


    ```

    $l(f(x)) = \frac{1}{2} \sum_i (x_i - \hat{x}_i)^2$

    ```


    The gradient of the loss function that is needed for the stochastic gradient procedure
    is similar to the feed-forward neural network and can be shown through derivation
    for both real-valued and binary as follows:


    ```

    $\frac{\partial}{\partial \hat{x}^{(t)}}l(f(x)) = \hat{x}^{(t)} - x^{(t)}$

    ```


    Parameter gradients are obtained by back-propagating the $\frac{\partial}{\partial
    \hat{x}^{(t)}}l(f(x))$ exactly as in the neural network.


    # Limitations of Autoencoders


    Autoencoders have some known drawbacks that have been addressed by specialized
    architectures that we will discuss in the sections to follow. These limitations
    are:


    When the size of the Autoencoder is equal to the number of neurons in the input,
    there is a chance that the weights learned by the Autoencoders are just the identity
    vectors and that the whole representation simply passes on the inputs exactly
    with zero loss. Thus, they emulate "rote learning" or "memorization" without any
    generalization.


    When the size of the Autoencoder is greater than the number of neurons in the
    input, the configuration is called an "overcomplete" hidden layer and can have
    similar problems to the ones mentioned previously. Some of the units can be turned
    off and others can become identity making it just the copy unit.'
  merge: -1
  img_proc: true
- pgno: 371
  md: 'When the size of the Autoencoder is less than the number of neurons in the
    input, known as “undercomplete”, the latent structure in the data or important
    hidden components can be discovered.


    # Denoising Autoencoder


    As previously mentioned, when the Autoencoder has a hidden layer size greater
    than or equal to the input, it is not guaranteed to learn the weights and can
    become a simple unit switch to copy input to output. This issue is addressed by
    the Denoising Autoencoder. There is another layer added between input and the
    hidden layer. This layer adds some noise to the input using either a well-known
    distribution $p(\tilde{x}|x)$ or using stochastic noise such as turning a bit
    to 0 in binary input. This noisy input then goes learning from the hidden layer
    to the output layer exactly. The loss function of the Denoising Autoencoder compares
    the output with the actual input. Thus, the added noise and the larger hidden
    layer enable learning latent structures or adding/removing redundancy to produce
    the exact signal at the output. This architecture—where nonzero features at the
    noisy layer generate features at the hidden layer that are themselves transformed
    by the activation layer as the signal advances lends robustness and implicit structure
    to the learning process (References [15]).


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_371_0.png)'
  merge: -1
  img_proc: true
- pgno: 372
  md: '# # Unsupervised pre-training and supervised fine-tuning


    As discussed in the issues section on neural networks, the issue with over-training
    arises in deep learning as the number of layers, and hence parameters, is large.
    One way to account for over-fitting is to use data-specific regularization. In
    this section, we will describe the "unsupervised pre-training" method in the hidden
    layers to overcome the issue of over-fitting. Note that this is generally the
    "initialization process" used in deep learning algorithms.


    The algorithm of unsupervised pre-training works in a layer-wise greedy fashion.
    As shown in the following figure, one layer of the visible and hidden structure
    is considered at a given time. The weights of these layers are learned for a few
    iterations using unsupervised techniques such as RBM, described previously. The
    output of the hidden layer is then used as a "visible" or "input" layer and the
    training proceeds to next, and so on.


    Each layer of layers can be thought of as a "feature extraction or feature generation"
    process. The real data inputs when transformed form higher-level features at a
    given layer and then are further combined to form much higher-level features,
    and so on.


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_372_0.png)


    [ 336 ]'
  merge: -1
  img_proc: true
- pgno: 373
  md: 'Once all the hidden layer parameters are learned in pre-training using unsupervised
    techniques as described previously, a supervised fine-tuning process follows.
    In the supervised fine-tuning process, a final output layer is added, and just
    like a neural network, training is done with forward and backward propagation.
    The idea is that most weights or parameters are almost fully tuned and only need
    a small change for producing a discriminative class mapping at the output.


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_373_0.png)


    Figure 12: Final tuning or supervised learning.


    # Deep feed-forward NN


    A deep feed-forward neural network involves using the stages pre-training, and
    fine-tuning.


    Depending on the unsupervised learning technique used – RBM, Autoencoders, or
    Denoising Autoencoders– different algorithms are formed: Stacked RBM, Stacked
    Autoencoders, and Stacked Denoising Autoencoders, respectively.'
  merge: -1
  img_proc: true
