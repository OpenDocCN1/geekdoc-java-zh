  md: '# Deep Learning


    In Chapter 2, Practical Approach to Real-World Supervised Learning, we discussed
    different supervised classification techniques that are general and can be used
    in a wide range of applications. Non-linear techniques, especially in computer-vision,
    deep learning and its variants are having a remarkable impact. We find that deep
    learning and associated methodologies can be applied to image-recognition, image
    annotation, movie descriptions, and even areas such as text classification, language
    modeling, translations, and so on. (References [1, 2, 3, 4, and 5])


    To set the stage for deep learning, we will start with describing what neurons
    are and how they can be arranged to build multi-layer neural networks, present
    the core elements of these networks, and explain how they work. We will then discuss
    the issues and problems associated with neural networks that give rise to advances
    and structural changes in deep learning. We will learn about building blocks of
    deep learning such as Restricted Boltzmann Machines and Autoencoders. We will
    then explore deep learning through different variations in supervised and unsupervised
    learning. Next, we will take a tour of Convolutional Neural Networks (CNN) and
    by means of use case, illustrate how they work by deconstructing an application
    of CNNs in the area of computer-vision. We will introduce Recurrent Neural Networks
    (RNN) and its variants and how they are used in the text/sequence mining fields.
    We will finally present a case study using real-life data of MNIST images and
    use it to compare/contrast different techniques. We will use DeepLearning4j as
    our Java toolkit for performing these experiments.'
