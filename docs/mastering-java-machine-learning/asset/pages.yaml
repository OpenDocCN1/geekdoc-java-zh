    # Summary


    The history of Deep Learning is intimately tied to the limitations of earlier
    attempts at using neural networks in machine learning and AI, and how these limitations
    were overcome with newer techniques, technological improvements, and the availability
    of amounts of data.


    The perceptron is the basic network. Multi-layer networks are used in supervised
    learning and by building connecting hidden layers of neurons to propagate activations
    forward and using backpropagation to reduce the training error. Several activation
    functions are used, most commonly, the sigmoid and tanh functions.


    The problems of neural networks are vanishing or exploding gradients, slow training,
    and the trap of local minima.


    Deep learning successfully addresses these problems with the help of several effective
    techniques that can be used for unsupervised as well as supervised learning.


    Among the building blocks of deep networks are Restricted Boltzmann Machines (RBM),
    Autoencoders, and Denoising Autoencoders. RBMs are two-layered networks that are
    able to extract high-level features from their input. Contrastive divergence is
    used to speed up the training. Autoencoders are also deep learning networks used
    in unsupervised learning – they attempt to replicate the input by first encoded
    features in the encoding layer and then reconstructing the input via a set of
    decoding layers. Denoising Autoencoders address some limitations of Autoencoders,
    which can sometimes cause them to trivially learn the identity function.


    Deep learning networks are often pretrained in an unsupervised fashion and then
    their parameters are fine-tuned via supervised fine-tuning. Stacked RBMs or Autoencoders
    are used in the pretraining phase and the fine-tuning is typically accomplished
    with a softmax activation in the output layer in the case of classification.


    [ 376 ]'
