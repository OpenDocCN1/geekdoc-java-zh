  md: '# Probabilistic Graph Modeling


    # Advantages and limitations


    +   - Lack of robustness is one of the biggest drawbacks of this method. A small
    error in data can cause a big impact on the structure due to the assumptions of
    independence that will creep into the individual independence tests.


    +   - Scalability and computation time is a major concern as every subset of variables
    are tested and is approximately 2*. As the number of variables increase to the
    100s, this method fails due to computation time.


    # Search and score-based techniques


    The search and score method can be seen as a heuristic optimization method where
    iteratively, structure is changed through small perturbations, and measures such
    as BIC or MLE are used to give the structures to find the optimal score and structure.
    Hill climbing, depth-first search, genetic algorithms, and so on, have all been
    used to search and score.


