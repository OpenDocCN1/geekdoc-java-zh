- pgno: 160
  md: 'Unsupervised Machine Learning Techniques


    +   * **Density-based**: This is more isolated from its neighbors that they are
    in turn from their neighbors

    * **Clustering-based**: This is in isolated clusters relative to other clusters
    or not a member of any cluster

    * **High-dimension-based**: This is an outlier by usual techniques after data
    is projected to lower dimensions, or by choosing an appropriate metric for high
    dimensions


    # # Statistical-based


    Statistical-based techniques use parametric methods for outlier detection assume
    some knowledge of the distribution of the data (References [19]). From the observations,
    the model parameters are estimated. Data points that have probabilities lower
    than a threshold value in the model are considered outliers. When the distribution
    is not known or none is suitable to assume, non-parametric methods are used.


    # # Inputs and outputs


    Statistical methods for outlier detection work with real-valued datasets. The
    choice of distance metric may a user-selected input in the case of parametric
    methods assuming multivariate distributions. In the case of non-parametric methods
    using frequency-based histograms, a user-defined threshold frequency is used.
    Selection of kernel method and bandwidth are also user-determined in Kernel Density
    Estimation techniques. The output from statistical-based methods is a score indicating
    outliers.


    # # How does it work?


    Most of the statistical-based outlier detections either assume a distribution
    or fit a distribution to the data to detect probabilistically the least likely
    data generated from the distribution. These have two distinct steps:


    +   1. **Training step**: Here, an estimate of the model to fit the data is performed

    2. **Testing step**: On each instance a goodness of fit is performed based on
    the model and the particular instance, yielding a score and the outlierness


    Parametric-based methods assume a distribution model such as multivariate Gaussians
    and the training normally involves estimating the mean and variance using techniques
    such as Maximum Likelihood Estimates (MLE). The testing typically includes techniques
    as mean-variance or box-plot tests, accompanied by assumptions as "if outside
    three standard deviations, then outlier".


    [ 124 ]'
