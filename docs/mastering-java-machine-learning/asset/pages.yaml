- pgno: 501
  md: "The Spark core has the following components:\n\n+   * Resilient Distributed\
    \ Datasets (RDD): RDDs are the basic immutable collection of objects that Spark\
    \ Core knows how to partition and distribute across the cluster for performing\
    \ tasks. RDDs are composed of \"partitions\", dependent on parent RDDs and metadata\
    \ about data placement.\n* Two distinct operations are performed on RDDs:\n  \
    \  * Transformations: Operations that are lazily evaluated and transform one RDD\
    \ into another. Lazy evaluation defers evaluation as long as possible, which makes\
    \ some resource optimizations possible.\n    * Action: The actual operation that\
    \ triggers transformations and returns output values\n\n+   * Lineage graph: The\
    \ pipeline or flow of data describing the computation for a particular task, including\
    \ different RDDs created in transformations and actions is known as the lineage\
    \ graph of the task. The lineage graph plays a key role in fault tolerance.\n\n\
    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_501_0.png)\n\nFigure 18: Apache Spark\
    \ lineage graph"
  merge: -1
  img_proc: true
