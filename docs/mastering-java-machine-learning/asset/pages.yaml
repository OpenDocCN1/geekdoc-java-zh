  md: '# Self-organizing maps (SOM)


    SOM is a neural network based method that can be viewed as dimensionality reduction,
    manifold learning, or clustering technique (References {17}). Neurobiological
    studies show that our brains map functions to different areas, as topographic
    maps, which form the basis of this technique.


    # Inputs and outputs


    Only numeric features are used in SOM. Model parameters consists of distance function,
    (generally Euclidean distance is used) and the lattice parameters in terms of
    width and number of cells in the lattice.


    # How does it work?


    SOM, also known as Kohonen networks, can be thought of as a two-layer neural network
    where each output layer is a two-dimensional lattice, arranged in rows and columns
    and each neuron is fully connected to the input layer.


    Like neural networks, the weights are initially generated using random values.
    The process has three distinct training phases:


    +   **Competitive phase:** Neurons in this phase compete based on the discriminant
    values, generally based on distance between neuron weight and input vector; such
    that the minimum distance between the two decides which neuron gets assigned to.
    Using Euclidean distance, the distance between an input $x$, and neuron in the
    lattice position $(j, i)$ is given by $w_j$;


    ```

    $d_j(\mathbf{x}) = \sum_{i}(x_i - w_{ji})^2$

    ```


    +   **Cooperation phase:** In this phase, the winning neurons find the best spatial
    location in the topological neighborhood. The topological neighborhood for the
    winning neuron $f(\mathbf{x})$ for a given neuron $(j, i)$, at a distance $S_{ij}$
    neighborhood of size $o$, is defined by:


    ```

    $T_{j,i}(\mathbf{x}) = \exp\left(\frac{-S_{ij}^2}{2\sigma(t)^2}\right)$

    ```'
