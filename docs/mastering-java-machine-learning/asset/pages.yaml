    # # Advantages and limitations


    The advantages and limitations are as follows:


    +   - Though widely used, PLSA has some drawbacks that have been overcome by more
    recent techniques.


    +   - The unsupervised nature of the algorithm and its general applicability allows
    it to be used in a wide variety of similar text mining applications, such as clustering
    documents, associating topics related to authors/time, and so on.


    +   - PLSA with EM algorithms, as discussed in previous chapters, face the problem
    of getting "stuck in local optima", unlike other global algorithms, such as evolutionary
    algorithms.


    +   - PLSA algorithms can only do topic identification in known documents, cannot
    do any predictive modeling. PLSA has been generalized and is known as latent dirichlet
    allocation (LDA) to overcome this (References [14]).'
