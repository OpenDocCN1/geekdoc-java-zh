    # # Active learning


    Although active learning has many similarities with semi-supervised learning,
    it has its own distinctive approach to modeling datasets containing labeled and
    unlabeled data. It roots in the basic human psychology that asking more questions
    often to solve problems.


    The main idea behind active learning is that if the learner gets to pick the instances
    to learn from rather than labeled data, it can learn more effectively with less
    data (References [6]). With very small amount of unlabeled data, it can carefully
    pick instances from unlabeled data to get label information and use that to iteratively
    improve learning. This basic approach of querying unlabeled data to get labels
    from a so-called oracle – an expert in the domain – distinguishes active learning
    from semi-supervised or passive learning. The following figure illustrates the
    difference and the iterative process involved:


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_208_0.png)


    Figure 7. Active Machine Learning process contrasted with Supervised and 5Semi-Supervised
    learning process.'
