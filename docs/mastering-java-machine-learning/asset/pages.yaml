  md: "Independent Component Analysis (ICA) assumes that there are mixtures of non-Gaussians\
    \ from the source, and using the generative technique, tries to find the decompositions\
    \ of original data in the smaller mixtures or components (References [2]). The\
    \ key difference between PCA and ICA is that PCA creates components that are uncorrelated,\
    \ while ICA creates components that are independent.\n\nMathematically, it assumes\
    \ $X \\in \\mathbb{R}^{kn}$ as a mixture of independent sources $S \\in \\mathbb{R}^{kn}$,\
    \ such that each data element $y = [y_1, y_2, ..., y_n]^T$ and independence is\
    \ implied by $p(y) = \\prod_{i=1}^n p(y_i)$.\n\nProbabilistic Principal Component\
    \ Analysis (PPCA) is based on finding the components using mixture models and\
    \ maximum likelihood formulations using Expectation Maximization (EM) (References\
    \ [3]). It overcomes the issues of missing data and outlier impacts that PCA faces.\n\
    \n# Random projections (RP)\n\nWhen data is separable by a large margin—even if\
    \ it is high-dimensional data—one can randomly project the data down to a low-dimensional\
    \ space without impacting stability and achieve good generalization with a relatively\
    \ small amount of data. Random Projections use this technique and the details\
    \ are described here (References [4]).\n\n# Inputs and outputs\n\nRandom projections\
    \ work with both numeric and categorical features, but categorical features are\
    \ transformed into binary. Outliers are lower dimensional representations of the\
    \ input data elements. The number of dimensions to project, $k$, is part of userdefined\
    \ input.\n\n# How does it work?\n\nThis technique uses random projection matrices\
    \ to project the input data into a lower dimensional space. The original data\
    \ $X \\in \\mathbb{R}^n$ is transformed to the lower dimension space $S \\in \\\
    mathbb{R}^k$ where $k < p$ using:\n\n```\nS = RX\n```\n\nHere columns in the $k\
    \ \times d$ matrix $R$ are i.i.d zero mean normal variables and are scaled to\
    \ unit length. There are variants of how the random matrix $R$ is constructed\
    \ using probabilistic sampling. Computational complexity of RP is $O(knd)$, which\
    \ scales much better than PCA. In many practical datasets, it has been shown that\
    \ RP gives results comparable to PCA and can scale to large dimensions and datasets."
