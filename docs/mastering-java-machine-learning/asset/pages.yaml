  md: '# Global


    A set of nodes Z separates sets of nodes X and Y, if there is no active path between
    any node in X ∈X and Y ∈Y given Z. Independence in graph G is:


    ```

    $\mathcal{J}(G) = \{(X \perp Y | Z): \text{sep}_G(X;Y|Z)\}$

    ```


    # Pairwise Markov


    Two nodes, X and Y, are independent given all other nodes if there is no direct
    edge between them. This property is of local independence and is weakest of all:


    ```

    $\mathcal{J}_p(G) = \{(X \perp Y | x-\{X,Y\}): X-Y \notin x\\}$

    ```


    # Markov blanket


    A node is independent of all other nodes in the graph, given its Markov blanket,
    which is an important concept in Markov networks:

    children''s parents:


    ```

    $\mathcal{J}_b(G) = \{(X \perp x-\{X''\}-U | U\): X \notin x\\}$

    ```


    Here U = markov blanket of X.


    Figure 15 shows a Markov blanket for variable X as its parents, children, and
    children''s parents:


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_326_0.png)


    Figure 15. Markov blanket for Node X - its Parents, Children, and Children''s
    Parents.'
