  md: 'Probabilistic Graph Modeling


    # # Markov networks and conditional random fields


    So far, we have covered directed acyclic graphs in the area of probabilistic graph
    models, including every aspect of representation, inference, and learning. When
    the graphs are undirected, they are known as Markov networks (MN) or Markov random
    field (MRF). We will discuss some aspects of Markov networks in this section covering
    areas of representation, inference, and learning, as before. Markov networks or
    MRF are very popular in various areas of computer vision such as segmentation,
    de-noising, stereo, recognition, and so on. For further reading, [References [10]].


    # # Representation


    Even though a Markov network, like Bayesian networks, has undirected edges, it
    still has local interactions and distributions. We will first discuss the concept
    of parameterization, which is a way to capture these interactions, and then the
    dependencies in MN.


    # # Parameterization


    The affinities between the variables in MN are captured through three alternative
    parameterization techniques discussed in the following sections.


    # # Gibbs parameterization


    The probability distribution function is said to be in Gibb''s distribution or
    parameterized by Gibbs''s distribution if


    ```

    $P_{\delta}(X_1, X_2, \dots, X_k) = \frac{1}{Z} \left(\phi_1(D_1), \phi_2(D_2)
    \dots \phi_m(D_m)\right)$

    ```


    Z is the partitioning function defined as:


    ```

    $Z = \sum_{X_1, X_2, \dots, X_k} \phi_1(D_1), \phi_2(D_2) \dots \phi_m(D_m)$

    ```


    [ 288 ]'
