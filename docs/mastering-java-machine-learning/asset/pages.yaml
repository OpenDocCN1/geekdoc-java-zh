  md: 'Unsupervised Machine Learning Techniques


    # Business problem


    Character-recognition is a problem that occurs in many business areas, for example,
    the translation of medical reports and hospital charts, postal code recognition
    in the postal service, check deposit service in retail banking, and others. Human
    handwriting can vary widely among individuals. Here, we are looking exclusively
    at handwritten digits, 0 to 9. The problem is interesting due to the versisimilitude
    within certain sets of digits, such as 1/7 and 6/9/0. In our experiments this
    chapter we use clustering and outlier analysis using several different algorithms
    to illustrate the relative strengths and weaknesses of the methods. Given the
    widespread use of these techniques in data mining applications, our main focus
    is to gain insights into the data and the algorithms and evaluation measures;
    we do not apply the models for prediction on test data.


    # Machine learning mapping


    As suggested by the title of the chapter, our experiments aim to demonstrate Unsupervised
    Learning by ignoring the labels identifying the digits in the dataset. Having
    learned from the data, clustering and outlier analyses can yield invaluable information
    for describing patterns in the data, and are often used to explore these patterns
    and inter-relationships in the data, and not just to predict the class of unseen
