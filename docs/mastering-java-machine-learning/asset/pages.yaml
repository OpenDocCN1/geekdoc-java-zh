  md: "The matrix inverse, if it exists, can be used to solve a system of simultaneous\
    \ equations represented by the preceding vector-matrix product. Consider a system\
    \ of equations:\n\n```\n$x_1 + 2x_2 = 3\\n3x_1 + 9x_2 = 21$$\n```\n\nThis can\
    \ be expressed as an equation involving the matrix-vector product:\n\n```\n$$\\\
    begin{bmatrix} 1 & 2 \\ 3 & 9 \\end{bmatrix} \\begin{bmatrix} x_1 \\ x_2 \\end{bmatrix}\
    \ = \begin{bmatrix} 3 \\ 21 \\end{bmatrix}$$\n```\n\nWe can solve for the variables\
    \ $x_1$ and $x_2$ by both sides by the matrix inverse:\n\n```\n$$\\begin{bmatrix}\
    \ x_1 \\ x_2 \\end{bmatrix} = \\begin{bmatrix} 3 & -2/3 \\ -1 & 1/3 \\end{bmatrix}\
    \ \\begin{bmatrix} 5 \\ 21 \\end{bmatrix}$$\n```\n\nThe matrix inverse can be\
    \ calculated by different methods. The reader is advised to view Prof. Strang's\
    \ MIT lecture: .bit.ly/10vmKcLL.\n\n# # Eigendecomposition\n\nMatrices can be\
    \ decomposed to factors that give us valuable insight into the transformation\
    \ that the matrix represents. Eigenvalues and eigenvectors are obtained as the\
    \ result of eigendecomposition. For a square matrix $A$, an eigenvector is a non-zero\
    \ vector that is transformed into a scaled version of itself when multiplied by\
    \ the matrix. The scalar multiplier is the eigenvalue. All scalar multiples of\
    \ an eigenvector are also eigenvectors:\n\n```\n$Av = \\lambda v$$\n```\n\nIn\
    \ the preceding example, $v$ is an eigenvector and $\\lambda$ is the eigenvalue.\n\
    \nThe eigenvalue equation of matrix $A$ is given by:\n\n```\n$$(A - \\lambda I)v\
    \ = 0$$\n```"
  merge: -1
  img_proc: true
- pgno: 524
  md: 'The non-zero solution for the eigenvalues is given by the roots of the characteristic
    polynomial equation of degree $n$ represented by the determinant:


    ```

    $\mathbf{A} - \lambda\mathbf{I} = (\lambda_1 - \lambda)(\lambda_2 - \lambda)\dots(\lambda_n
    - \lambda)$

    ```


    The eigenvectors can be found by solving for $v$ in $\mathbf{Av} = \lambda v$.

    Some matrices, called diagonalizable matrices, can be built entirely from their
    eigenvectors and eigenvalues. If $\mathbf{A}$ is the diagonal matrix with the
    eigenvalues of matrix $\mathbf{A}$ on its principal diagonal, and $\mathbf{Q}$
    is the matrix whose columns are the eigenvectors of $\mathbf{A}$:


    ```

    $\mathbf{\Lambda} = \begin{bmatrix} \lambda_1 & & \dots & 0 \ & \ddots & & \ \vdots
    & & \ddots & \ 0 & & & \lambda_n \end{bmatrix}, \mathbf{Q} = \begin{bmatrix} v^{(1)}
    & v^{(2)} & \dots & v^{(n)} \end{bmatrix}$

    ```


    Then $\mathbf{A} = Q \Lambda Q^T$.


    # Positive definite matrix


    If a matrix has only positive eigenvalues, it is called a **positive definite
    matrix**. If the eigenvalues are positive or zero, the matrix is called a **positive
    semi-definite matrix**. With positive definite matrices, it is true that:


    ```

    $x^T \mathbf{A} \mathbf{x} \geq 0$

    ```


    # Singular value decomposition (SVD)


    SVD is a decomposition of any rectangular matrix $\mathbf{A}$ of dimensions $n
    \times p$ and is written as the product of three matrices:


    ```

    $\mathbf{A}_{nxp} = \mathbf{U}_{nxn} \mathbf{S}_{nxp} \mathbf{V}^T_{pxp}$

    ```


    $\mathbf{U}$ is defined to be $n \times n$, $\mathbf{S}$ is a diagonal $n \times
    p$ matrix, and $\mathbf{V}$ is $p \times p$. $\mathbf{U}$ and $\mathbf{V}$ are
    orthogonal matrices; that is:


    ```

    $\mathbf{U}^T \mathbf{U} = \mathbf{I}_{nxn}$ and $\mathbf{V}^T \mathbf{V} = \mathbf{I}_{pxp}$

    ```'
  merge: -1
  img_proc: true
- pgno: 525
  md: '# Appendix A


    The diagonal values of S are called the singular values of A. Columns of U are
    called left singular vectors of A and those of V are called right singular vectors
    of A. The left singular vectors are orthonormal eigenvectors of A^TA and the right
    singular vectors are orthonormal eigenvectors of AA^T.


    The SVD representation expands the original data into a coordinate system such
    that the covariance matrix is a diagonal matrix.'
  merge: -1
