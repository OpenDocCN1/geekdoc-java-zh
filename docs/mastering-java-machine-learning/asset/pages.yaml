- pgno: 107
  md: 'The confusion matrix is central to the definition of a model performance metrics.
    The proliferation of metrics and synonymous terms is a result of the utility of
    different quantities derived from the elements of the matrix in various disciplines,
    each emphasizing a different aspect of the model''s behavior.


    The four elements of the matrix are counts of False Positives, False Negatives,
    True Positives, and True Negatives. Often more interesting are the different ratios
    of these quantities, the True Positive Rate (Sensitivity, or Recall), and the
    False Positive Rate (FPR, or 1 – Specificity, or Fallout). Accuracy reflects the
    percentage of correct predictions, whereas Class 1 or Class 0. When skewed datasets,
    accuracy is not particularly useful, even a constant prediction can appear to
    perform well.


    # ROC and PRC curves


    The previously mentioned metrics such as accuracy, precision, recall, sensitivity,
    and specificity are aggregates, that they describe the behavior of the entire
    dataset. In many complex problems it is often valuable to see the trade-off between
    metrics such as TPs and FPs.


    Many classifiers, most probability-based classifiers, give confidence or probability
    of the prediction, in order to give classification. The process to obtain the
    ROC or PRC curves is to run the unseen validation or test set on the learned models,
    and then the prediction and the probability of prediction. Sort the predictions
    based on the confidences in decreasing order. For every probability or confidence
    level two metrics, the fraction of FP (FP rate) and the fraction of TP (TP rate).


    Plotting the TP rate on the y axis and FP rate on the x axis gives the ROC curves.
    ROC curves of random classifiers lie close to the diagonal while the ROC curves
    of good classifiers tend towards the upper left of the plot. The area under the
    curve (AUC) is the area measured under the ROC curve by using the trapezoidal
    rule from 0 to 1 of ROC curves. By running cross-validation for instance there
    can be many ROC curves. There are two ways to get "average" ROC curves: first;
    using vertical alignment, and second horizontal alignment, which is, FPR average
    is plotted at different FP rate or second. The classifiers that have area under
    curves greater than 0.8, as a rule-of-thumb are considered good for prediction
    for unseen data.


    Precision Recall or PRC curves are similar to ROC curves, but instead of TPR versus
    FPR, metrics Precision and Recall are plotted on the y and x axis, respectively.
    When the data is highly imbalanced, that is, FPR average doesn''t really show
    the impact while PRC curves are more reliable in judging performance.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Gain charts and lift curves


    Lift and Gain charts are more biased towards sensitivity or true positives. The
    whole purpose of these two charts is to show how instead of random selection,
    the models prediction and confidence can detect better quality or true positives
    in the sample of unseen data.


    This is usually very appealing for detection engines that are used in detecting
    fraud in financial crime or threats in cyber security. The gain charts and lift
    curves give exact estimates of real true positives that will be detected at different
    quartiles or intervals of total data. This will give insight to the business decision
    makers on how many investigators would be needed or how many hours would be spent
    detecting fraudulent actors or cyber attacks and what can give ROI of the models.


    The process for generating gain charts or lift curves has a similar process of
    running unseen validation or test data through the models and getting the predictions
    along the conditions or probabilities. It involves ranking the probabilities in
    decreasing order and keeping count of TPs per quartile of the dataset. Finally,
    the histogram of counts per quartile gives the lift curve, while the cumulative
    count of TPs added over quartile gives the gains. In many tools such as RapidMiner,
    instead of coarse intervals such as quartiles, fixed larger intervals using binning
    is employed for obtaining the counts and cumulative counts.


    # Model comparisons


    When it comes to choosing algorithms, or the right parameters for a given algorithm,
    we make the comparison either on different datasets, or, as in the case of cross-validation,
    on different splits of the same dataset. Measures of statistical testing are employed
    in decisions involved in these comparisons. The basic idea of using hypothesis
    testing from classical statistics is to compare the two metrics from the algorithms.
    The null hypothesis is that there is no difference between the algorithms based
    on the measured metrics and so the test is done to validate or reject the null
    hypothesis based on the measured metrics (References [16]). The main question
    answered by statistical tests is the results or metrics obtained by the algorithm
    real characteristics, or is it by chance?


    In this section, we will discuss the most common methods for comparing classification
    algorithms used in practical scenarios.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Comparing two algorithms


    The general process is to train the algorithms on the same training set and run
    the models on either multiple validation sets, different test sets, or cross-validation,
    gauge the metrics of interest discussed previously, such as error rate or area
    under curve, and then get the statistics of the metrics for each of the algorithms
    to decide which worked better. Each method has its advantages and disadvantages.


    # McNemar''s Test


    This is a non-parametric test and it makes no assumptions on data and distribution.
    McNemar''s test builds a contingency table of a performance metric such as "misclassification
    or errors":


    Count of misclassification by both algorithms ($c_{00}$)


    +   - Count of misclassification by algorithm G1, correctly classified by algorithm
    G2($c_{01}$)

    - Count of misclassification by algorithm G2, correctly classified by algorithm
    G1 ($c_{10}$)

    - Count of correctly classified by both G1 and G2($c_{11}$)


    ```

    $$\chi^2 = \frac{(c_{01}-c_{10})^2}{c_{01}+c_{10}}$

    ```


    If $\chi^2$ exceeds $\chi^2_{1, \alpha}$ statistic then we can reject the null
    hypothesis that the two performance metrics on algorithms G1 and G2 were equal
    under the confidence value of $1-\alpha$.


    # Paired-t test


    This is a parametric test and an assumption of normally distributed computed metrics
    valid. Normally it is coupled with cross-validation processes and results of metrics
    such as area under curve or error rate is computed for each and then the mean
    and standard deviations are measured. Apart from normal distribution assumption,
    the additional assumption that two metrics come from a population of equal variance
    can be a big disadvantage for this method.


    ```

    $d = pm(G1) - pm(G2)$

    ```'
  merge: -1
  img_proc: true
- pgno: 110
  md: "$\bar{d}$ is difference of means in performance metrics of two algorithms G1\
    \ and G2.\n\n```\n$$\\sigma_d = \\sqrt{\\frac{\\sum_{i=1}^{n}(d_i-d)^2}{n-1}}$\n\
    ```\n\nHere, $d$ is the difference between the performance metrics of two algorithms\
    \ G1 and G2 in the trial and there are $n$ trials.\n\nThe $t$-statistic is computed\
    \ using the mean differences and the standard errors from the standard deviation\
    \ as follows and is compared to the table for the right alpha value to check for\
    \ significance:\n\n```\n$t = \\frac{\bar{d}}{\\sigma_d\\sqrt{n}}$\n```\n\n# Wilcox\
    \ signed-rank test\n\nThe most popular non-parametric method of testing two metrics\
    \ over datasets is to use the Wilcox signed-rank test. The algorithms are trained\
    \ on the same training data and metrics such as error rate or area under accuracy\
    \ are calculated over different validation or test sets. Let $d$ be the difference\
    \ between the performance metrics of two classifiers in the $i$th trial for $N$\
    \ datasets. Differences are then ranked according to their absolute values, and\
    \ mean ranks associated for ties. Let $R^*$ be the sum of ranks when the second\
    \ algorithm outperformed the first and $R^-$ be the sum of ranks when the first\
    \ outperformed the second:\n\n```\n$R^* = \\sum_{d_i>0}rank(d_i) + \\frac{1}{2}\\\
    sum_{d_i<0}rank(d_i)$\n```\n\n```\n$R^- = \\sum_{d_i<0}rank(d_i) + \\frac{1}{2}\\\
    sum_{d_i=0}rank(d_i)$\n```"
  merge: -1
