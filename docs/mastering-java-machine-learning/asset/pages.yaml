- pgno: 332
  md: '# Hidden Markov models


    In many real-world situations, the events we are interested in are not directly
    observable. For example, the words in sentences are observable, but the part-of-speech
    that generated the sentence is not. Hidden Markov models (HMM) help us in modeling
    states where there are observable events and hidden states (references [13]).
    HMM are widely used in various modeling applications for speech recognition, language
    modeling, time series analysis, and bioinformatics applications such as DNA/protein
    sequence predictions, to name a few.


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_332_0.png)


    Figure 19. Hidden Markov model showing hidden variables and the observables.


    Hidden Markov models can be defined again as a triple $\mathcal{H}=(\Sigma, Q,
    \Theta)$, where:


    +   - $\Sigma$ is a set of finite states or symbols that are observed. $\Sigma=\{x_1,
    x_2, \dots x_l\}$

    - $Q$ is a set of finite states that are not observed $|Q|=\mathcal{N}$.

    - $\Theta$ are the parameters.


    The state transition matrix, given as $\mathbf{A}=(\mathbf{a}_{ij})_{k,l \in Q}$
    captures the probability of transition from state $q_i$ to $q_j$.


    Emission probabilities capturing relationships between the hidden and observed
    state, given as $e_i(b), k \in Q$ and $b \in \Sigma$. $e_i(b)=P(b|q_i=k)$.


    Initial state distribution $\pi=[\pi_1, \dots, \pi_l]$.


    Thus, a path in HMM consisting of a sequence of hidden states $Q=\{q_1 \dots,
    q_l\}$ is a first order Markov chain $M=(Q, A, \pi)$. This path in HMM emits a
    sequence of symbols, $x_1, \dots, x_l$ referred to as the observables. Thus, knowing
    both the observations and hidden states the joint probability is:


    ```

    $P(x,q) = \pi_{q_1} e_{q_1}(x_1) \prod_{i=2}^{l} \mathbf{a}_{q_{i-1}q_i} e_{q_i}(x_i)$

    ```'
  merge: -1
  img_proc: true
- pgno: 333
  md: 'In real-world situations, we only know the observations $x$ and do not know
    the hidden states $q$. HMM helps us to answer the following questions:


    +   - What is the most likely path that could have generated the observation $x$?

    - What is the probability of $x$?

    - What is the probability of being in state $q_i = k$ given the observation ?


    # # Most probable path in HMM


    Let us assume the observations $x = x_1, x_2$, and we want to find the path $q^*$
    that generated the observations. This can be given as:


    ```

    $q^* = \text{argmax} P(x,q)$

    ```


    The path $q^*$ need not be unique, but for computation and explanation the assumption
    of the unique path is often made. In a naive way, we compute all possible paths
    of length $L$ of $q$ and choose the one(s) with the highest probability giving
    exponential computing terms or speed. More efficient is using Viterbi''s algorithm
    which works on the simple principle of dynamic programming and recursion. It works
    on the simple principle of breaking the equation into simpler terms as:


    ```

    $V_k(i) = \text{highest probability of path } q_1, q_2, \dots q_i \text{ emitting
    observables } x_1, x_2, \dots x_i$

    ```


    ```

    $P(x,q^*) = \max [V_k(L) | k \in Q^*]$

    ```


    ```

    $V_k(i) = e_k(x_i) \max V_j(i-1) a_{jk}$

    ```


    Here, $e_k(x_i) = \text{probability of state k emitting } x_i$, and

    V_k(i-1)a_{jk} = \text{probability of best path that ends in and transitions to
    } k$. Given the initial condition $e_k(x_i)\pi_i$ and using dynamic programming
    with keeping pointer to the path, we can efficiently compute the answer.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# # Posterior decoding in HMM


    The probability of being in a state $q_i = k$ given the observation $x$ can be
    written using Bayes theorem as:


    $$P(q_i = k | x) = \frac{P(q_i = k, x)}{P(x)}$$


    The numerator can be rewritten as:


    $$P(q_i = k | x) = P(q_i = k, x_1, x_2 \dots x_{i+1}, x_{i+2} \dots x_L)$$$


    $$P(q_i = k, x) = P(x_1, x_2 \dots x_i, q_i = k) P(x_{i+1}, x_{i+2} \dots x_L
    \mid x_1, x_2 \dots x_i, q_i = k)$$$


    $$P(q_i = k, x) = F_k(i)B_k(i)$$$


    $$P(q_i = k | x) = \frac{F_k(i)B_k(i)}{P(x)}$$$


    Where $F_k(i) = P(x_1, x_2 \dots x_i, q_i = k)$ is called a Forward variable and
    $B_k(i) = P(x_{i+1}, x_{i+2} \dots x_L \mid x_1, x_2 \dots x_i, q_i = k)$ is called
    a Backward variable.


    The computation of the forward variable is similar to Viterbi''s algorithm using
    dynamic programming and recursion where summation is done instead:


    $$F_k(i) = P(x_1, x_2 \dots x_i, q_i = k)$$$


    $$F_k(i) = e_k(x_i) \sum_{l \in inQ} P(x_1, x_2 \dots x_{i-1}, q_{i-1} = l)a_{lk}$$$


    $$F_k(i) = e_k(x_i) \sum_{l \in inQ} F_l(i-1)a_{lk}$$$'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'The probability of observing x can be, then


    ```

    $P(x) = \sum_{k \in Q} F_k(L)$

    ```


    The forward variable is the joint probability and the backward variable is a conditional
    probability:


    ```

    $B_t(i) = P(x_{i+1}, x_{i+2} \dots x_l | x_i, x_{i+2} \dots x_l, q_i = k)$

    ```


    ```

    $B_k(i) = \sum_{l} a_k e_l(x_{i+1}) P(x_{i+2} \dots x_l | q_{i+1} = l)$

    ```


    ```

    $B_k(i) = \sum_{l} a_k e_l(x_{i+1}) B_l(i+1)$

    ```


    It is called a backward variable as the dynamic programming table is filled starting
    with the $L^{th}$ column to the first in a backward manner. The backward probabilities
    can also be used to compute the probability of observing x as:


    ```

    $P(x) = \sum_{k \in Q} B_k(1) e_k(x_i) \pi_k$

    ```


