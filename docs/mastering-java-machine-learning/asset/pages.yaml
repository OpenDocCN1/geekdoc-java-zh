- pgno: 197
  md: '# Advantages and limitations


    The advantages and limitations are:


    +   - Works very well when the cluster assumption holds true and the choice of
    clustering algorithm and parameters are correct

    - Large number of parameters and choices make this an unwieldy technique in many
    real-world problems


    # Transductive graph label propagation


    The key idea behind graph-based methods is to represent every instance in the
    dataset, labeled and unlabeled, and compute the edges as some form of ''similarity''
    between them. Known labels are used to propagate labels in the unlabeled data
    using basic concepts of label smoothness as discussed in the assumptions section,
    that is, similar data points will lie ''close'' to each other graphically (References
    [4]).


    Figure 4 shows how the similarity by the thickness of the arrow from the first
    data point to the last varies when the handwritten digit pattern changes. Knowing
    the first label, the label propagation can effectively label the next three digits
    due to the similarity in features while the last digit, though labeled the same,
    has a lower similarity compared to the first three.


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_197_0.png)'
  merge: -1
  img_proc: true
- pgno: 198
  md: "# Inputs and outputs\n\nInput is training with a few labeled and a large number\
    \ of unlabeled data. The graph weighting or similarity computing method, such\
    \ as k-nearest weighting, Caussian decaying distance, or e-radius method is chosen.\
    \ Output is the labeled set for the entire data; it generally doesn't build inductive\
    \ models like the algorithms seen previously.\n\n# How does it work?\n\nThe general\
    \ label propagation method follows:\n\n+   1. Build a graph $g = (V, E)$:\n  \
    \  * Vertices $V = \\{1, ..., n\\}$ correspond to data belonging to both labeled\
    \ set $L$ and unlabeled set $U$.\n    * Edges $E$ are weighted matrices $W$, such\
    \ that $W_{ij}$ represents similarity in some form between two data points $x_i,\
    \ x_j$.\n2. Compute the diagonal degree matrix $D$ by $D_{i,i} \\leftarrow \\\
    sum_j W_{ij}$.\n3. Assume the labeled set is binary and $y_i \\in \\{-1, 1\\}$.\
    \ Initialize labels of all unlabeled data to be 0. $\\hat{y}^{(0)} = \\{y_1, y_2,\
    \ ..., y_i, 0, 0, ...\\}$\n4. Iterate at $t = 0$:\n    1. $\\hat{y}^{(t+1)} \\\
    leftarrow D^{-1}\\hat{y}^{(t)}$\n    2. $\\hat{y}_i^{(t+1)} \\leftarrow Y_i$ (reset\
    \ the labels of labeled instances back to the original)\n    3. Go back to step\
    \ 4, until convergence $\\hat{y}^{(*)}$\n5. Label the unlabeled points $\\mathcal{U}\
    \ = \\{x_i, y_i\\}_{i=d+1}^n$ using the convergence\nLabels $\\hat{y}^{(*)}$\n\
    \nThere are many variations based on similarity, optimization selected in iterations,\
    \ and so on."
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Advantages and limitations


    The advantages and limitations are:


    +   - The graph-based semi-supervised learning methods are costly in terms of
    computations — $O(n'')$ where $n$ is the number of instances. Though speeding
    and caching techniques help, the computational cost over large data makes it infeasible
    in real-world data situations.

    - The transductive nature makes it difficult for practical purposes where models
    need to be induced for unseen data. There are extensions such as Harmonic Mixtures
    and so on, which address these concerns.


    # Transductive SVM (TSVM)


    Transductive SVM is one of the oldest and most popular transductive semi-supervised
    learning methods, introduced by Vapnik [References [5]]. The key principle is
    that unlabeled data along labeled data can help find the decision boundary using
    concepts of large margins. The underlying principle is that the decision boundaries
    don''t lie in high density regions!


    # Inputs and outputs


    Input training with few data and a large number of unlabeled data. Input has to
    be numeric features for TSVM computations. The choice of kernels, kernel parameters,
    and cost factors, which are all SVM-based parameters, are also input variables.
    The output is labels for the unlabeled dataset.


    # How does it work?


    Generally, SVM works as an optimization problem in the labeled hard boundary SVM
    formulated in terms of weight vector $\mathbf{w}$ and the bias $b$ $\min \{f(\mathbf{w},
    b)\} = \frac{1}{2}\mathbf{w} \cdot \mathbf{w}$ subject to $\prod_{i=1}^n y_i |\mathbf{w}
    \cdot \mathbf{x}_i + b| \geq 1$


    +   - Initialize the data as $\mathcal{L} = \{\mathbf{x}_i, y_i\}_{i=1}^n$ labeled
    and $\mathcal{U} = \{\mathbf{x}_j, y_j\}_{j=n+1}^m$ unlabeled.

    - In TSVM, the condition is modified as follows:


    ```

    $\min(f(y_{i+1}, y_{i+2} \dots y_n, \mathbf{w}, b)) = \frac{1}{2}\mathbf{w} \cdot
    \mathbf{w}$

    ```'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'Semi-Supervised and Active Learning


    This is subject to the following condition:


    $$\nabla_{j=1}^u : y_j \ |\mathbf{w} \cdot \mathbf{x}_j + b| \geq 1$


    $$\nabla_{j=1}^l : y_j \ |\mathbf{w} \cdot \mathbf{x}_j + b| \geq 1$


    $$\nabla_{j=1}^u : y_j \in (+1,-1)$


    This is exactly like inductive SVM using only labeled data. When we constrain
    the unlabeled data to conform to the side of the hyperplane of labeled data in
    order to maximize the margin, it results in unlabeled data being labeled with
    maximum margin separation! By adding the penalty factor to the constraints or
    replacing the dot product in the input space with kernels as in inductive SVM,
    noisy datasets can be labeled from unlabeled data.


    Figure 5 illustrates the concept of TSVM in comparison with inductive SVM on labeled
    data only and why TSVM can find better decision boundaries using the unlabeled
    datasets. The unlabeled datasets on either side of hyperplane are closer to their
    respective classes, thus finding better margin separators.


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_200_0.png)


    # Advantages and limitations


    The advantages and limitations:


    +   - TSVMs can work very well in linear or non-linear datasets given noiseless
    labeled data.


    +   - TSVMs have the same issues in finding hyper-parameters and tuning them to
    get the best results as inductive SVMs.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# Case study in semi-supervised learning


    For this case, we use another well-studied dataset from the UCI Repository, the
    Wisconsin Breast Cancer dataset. In the first part of the experiment, we demonstrate
    how to apply the Transductive SVM technique of semi-supervised learning using
    the open-source library called KernelMachines. We choose the SVMLight algorithm
    and a Gaussian kernel for this technique.


    In the second part, we use KEEL, a GUI-based framework and compare results from
    several evolutionary learning algorithms using the UCI Breast Cancer dataset.
    The tools, methodology, and evaluation measures are described in the following
    subsections.


    # Tools and software


    The two source Java tools used in the semi-supervised learning case study are
    KernelMachines, a Transductive SVM, and KEEL, a GUI-based tool that uses evolutionary
    algorithms.


    > KernelMachines (Transductive SVM)

    KernelMachines is a pure Java library that provides an efficient framework for
    rapidly and developing specialized kernels. Kernels are similarity functions used
    in SVMs. KernelMachines provides kernel definitions based on structured data in
    addition to standard kernels on vector data as Linear and Gaussian. In particular,
    it offers a collection of kernels, defined over lists, and kernels with various
    caching strategies. The library also contains SVM optimization algorithm implementations
    including LaSVM and One-Class SVM using SMO. The creators of the library report
    that the results of KernelMachines on some common UCI repository datasets are
    comparable to or better than


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_201_0.png)


    The example of loading data and running Transductive SVM using

    KernelMachines is given here:


    ```

    try {

    // load the labeled training data

    List<TrainingSample<double[]>> labeledTraining = ArffImporter.

    importFromFile("/resources/breast-labeled.arff");

    // load the unlabeled data

    List<TrainingSample<double[]>> unlabeledData = ArffImporter.

    importFromFile("/resources/breast-unlabeled.arff");

    // create a kernel with Gaussian and gamma set to 1.0

    DoubleGaussL2 k = new DoubleGaussL2(1.0);

    ```'
