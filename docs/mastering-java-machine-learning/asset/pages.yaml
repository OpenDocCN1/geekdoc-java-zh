- pgno: 246
  md: "# Real-Time Stream Machine Learning\n\nThe performance is entirely determined\
    \ by the choice of the M learners — the type of learner used for the problem domain.\
    \ We can only decide on this choice by adopting different validation techniques\
    \ described in the section on model validation techniques.\n\n# Online Boosting\
    \ algorithm\n\nThe supervised boosting algorithm takes many weak learners whose\
    \ accuracy is slightly greater than random and combines them to produce a strong\
    \ learner by iteratively sampling the misclassified examples. The concept is identical\
    \ in Oza's Online Boosting algorithm with modification done for a continuous data\
    \ stream.\n\n# Inputs and outputs\n\nThe constraint on types of inputs (categorical\
    \ only, continuous only, or mixed) depends on the chosen base classifiers. The\
    \ base classifier algorithms and their respective parameters are inputs. The output\
    \ is the learned model that can predict the class/confidence based on the chosen\
    \ classifier.\n\n# How does it work?\n\nThe modification of batch boosting to\
    \ online boosting is done as follows:\n\n+   - Keep two sets of weights for M\
    \ base models, $\\lambda$ is a vector of dimension M which carries the sum of\
    \ weights of correctly classified instances, and $\\lambda^*$ is a vector of dimension\
    \ $M$, which carries the sum of weights of incorrectly classified instances.\n\
    - The weights are initialized to 1.\\n- Given a new instance $(x_t, y_t)$, the\
    \ algorithm goes through the iterations of updating the base models.\n- For each\
    \ base model, the following steps are repeated:\n    - For the first iteration,\
    \ $k \\sim \\text{Poisson}(\\lambda)$ is set and the learning classifier $h_t$\
    \ updates the algorithm $k$ times using $(x_t, y_t)$;\n    - If $h_t$ incorrectly\
    \ classifies the instance, $\\lambda^{t+1}$ is incremented, $\\epsilon_t$, the\
    \ weighted fraction, incorrectly classified by $h_t$, is computed and the weight\
    \ of the example is multiplied by $1/2 \\epsilon_t$."
