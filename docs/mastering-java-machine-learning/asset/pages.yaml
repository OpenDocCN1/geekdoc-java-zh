  md: 'Deep Learning


    # Deep learning


    Deep learning includes architectures and techniques for supervised and unsupervised
    learning with the capacity to internalize the abstract structure of high-dimensional
    data using networks composed of building blocks to create discriminative or generative
    models. These techniques have proved successful in recent years and any more interested
    in mastering them must become familiar with the basic building blocks of deep
    learning first and understand the various types of networks used by practitioners.
    Hands-on experience building and tuning deep neural networks is invaluable if
    you intend to get a deeper understanding of the subject.. Deep learning, in various
    domains such as image classification and text learning, incorporates feature generation
    in its structures making the task of mining the features redundant in many applications.
    The following sections provide a guide to the concepts, building blocks, techniques
    for composing architectures, and training deep networks.


    # Building blocks for deep learning


    In the following sections, we introduce the most important components used in
    deep learning, including Restricted Boltzmann machines, Autoencoders, and Denoising
    Autoencoders, how they work, and their advantages and limitations.


    # Rectified linear activation function


    The Reclin function is given by the equation:


    $g(a) = reclin(a) = max(0,a)$


    It can be seen as having a lower bound of 0 and no upper bound, strictly increasing,
    and a positive transformation function that just does linear transformation of
    positives.


    It is easy to see that the rectified linear unit or ReLU has a derivative of 1
    or identity for values greater than 0. This acts as a significant benefit as the
    derivatives are not squashed and do have diminishing values when chained. One
    of the issues with ReLU is that the value is 0 for negative inputs and the corresponding
    neurons act as ''dead'', especially when a large negative value is learned for
    the bias term. ReLU cannot recover from this and derivative are both 0. This is
    generally solved by having a "leaky ReLU". These functions have a small value
    for negative inputs and are given by $g(a) = reclin(a) = max(\epsilon a, a)$ where
    $\epsilon = 0.01$, typically.


    [ 326 ]'
