  md: "It can be seen as bounded, strictly increasing, but as a positive or negative\
    \ transformation function that squashes the values between -1 and 1.\n\n# Training\
    \ neural network\n\nIn this section\n\n# Empirical risk minimization\n\nEmpirical\
    \ risk minimization is a general machine learning concept that is used in many\
    \ classifications or supervised learning. The main idea behind this technique\
    \ is to convert a training or learning problem into an optimization problem (References\
    \ [13]).\n\nGiven the parameters for a neural network as $\theta = (\\{\\mathbf{W}^1,\
    \ \\mathbf{W}^2, \\dots \\mathbf{W}^l\\}, [\\mathbf{b}^1, \\mathbf{b}^2, \\dots\
    \ \\mathbf{b}^l\\})$ the training problem can be seen as finding the best parameters\
    \ $(\theta)$ such that\n\n```\n$\\arg \\min_{\\theta} \\frac{1}{n} \\sum_{i=1}^n\
    \ l(f(\\mathbf{x}^i; \\theta), y^i) + \\lambda \\Omega(\\theta)$\n```\n\nWhere\
    \ $\\sum_{i=1}^n l(f(\\mathbf{x}^i; \\theta), y^i)=$ Average Loss function and\
    \ $\\Omega(\\theta)$ is penalty function or Regularizer Stochastic gradient descent\
    \ (SGD) discussed in Chapter 2, Practical Approach to Real-World Supervised Learning\
    \ and Chapter 5, Real-Time Stream Learning, is commonly used as the optimization\
    \ procedure. The SGD applied to training neural networks is:\n\n+   1. initialize\
    \ $\\theta = (\\{\\mathbf{W}^1, \\mathbf{W}^2, \\dots \\mathbf{W}^l\\}, [\\mathbf{b}^1,\
    \ \\mathbf{b}^2, \\dots \\mathbf{b}^l])$\n2. for $i=1$ to $N$ epochs\n   1. for\
    \ each training sample $(\\mathbf{x}, y)$\n      1 $\\Delta = -\\nabla_{\\theta}(l(f(\\\
    mathbf{x}; \\theta), y)) // - \\lambda \\nabla_{\\theta} \\Omega(\\theta))$ //\
    \ find the gradient of function\n      2 $\\theta = \\theta + \\alpha \\Delta$\
    \ // move in direction"
