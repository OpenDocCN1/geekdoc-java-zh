    In the way as we evaluated different clustering methods, we used several observations
    to compare a number of outlier algorithms. Once again, the right methodology to
    judge an algorithm based on ranking across all the metrics and then getting a
    sense of how it does the board as compared to other algorithms. The outlier metrics
    used are all standard external measures used to compare outliers.


    +   - It is interesting to see with the right parameters, that is, k=2, EM can
    find the right distribution and find outliers more efficiently than most. It ranks
    high and is among the most important metrics that include Maximum F1, R-Precision,
    and Avg. Precision.

    - 1-Class SVM with non-linear RBF Kernel does consistently well across most measures,
    that is, ranks second in ROC area, R-Precision and Avg. Precision, and Maximum
    F1. The difference between Linear SVM, which ranks about fifth in most rankings
    and 1-Class SVM, which ranks second shows that the problem is indeed nonlinear
    in nature. Generally, when the dimensions are high (784), and outliers are nonlinear
    and, 1-Class SVM with kernels do really well.

    - Local outlier-based techniques (LOF and its variants) are consistently ranked
    lower in almost all the measures. This gives the insight that outlier problem
    may not be local, but rather global. Distance-based algorithms (KNN and Local
    Isolation) perform the best in ROC area under the curve and better than local
    outlier-based, even though using distance-based metrics gives the insight that
    the problem is indeed global and suited for distance-based measures.'
