- pgno: 448
  md: 'Text Mining and Natural Language Processing


    +   3. The probability of a document belonging to a cluster is given by $p(\theta)$,
    and every term in the document generated from that cluster is given by $p(t|\theta)$.
    The likelihood equation can be written as:


    ```

    $p(d|\Lambda)=\sum_{i}p(\theta_i)\prod p(t|\theta_i)^{count(t,d_i)};\Lambda=\{\theta_i|i=1..k\}$

    ```


    Note that instead of going through the documents, it is rewritten with terms $t$
    in the vocabulary $\mathbb{V}$ raised to the number of times that term appears
    in the document.


    +   4. Perform the EM algorithm in a similar way to the method used previously
    to estimate the parameters as follows:


    +   1. The E-step of the EM algorithm is used to infer the cluster from which
    the document was generated:


    ```

    $p(z_j=i|d) \propto p(\theta)\prod_{t\in\mathbb{V}}p(t|\theta)^{count(t,d_j)};;\sum_{i=1}^k
    p(z_j=i|d)=1$

    ```


    +   2. The M-step of the EM algorithm is used to re-estimate the parameters using
    the result of the E-step, as shown here:


    ```

    $p(\theta)\alpha \propto \sum_{j\in\mathbb{V}}^N p(z_j=i|d_j);\sum_{i=1}^k p(\theta)=1$.

    ```


    ```

    $p(t|\theta) \propto \sum_{j\in\mathbb{V}}^N count(t,d_j)p(z_j=i|d_j);\sum_{t\in\mathbb{V}}p(t|\theta)=1$

    ```


    +   5. The final probability estimate for each document can be done using the
    maximum likelihood or by using a Bayesian algorithm with prior probabilities,
    as shown here:


    ```

    $c_d=argmax(p(d|\theta)) \text{ or } c_d=argmax(p(d|\theta)p(\theta))$

    ```


    # Advantages and limitations


    +   Generative-models have similar advantages to LSA and PLSA, where we get a
    probabilistic score for documents in clusters. By applying domain knowledge or
    priors using cluster size, the assignments can be further fine-tuned.


    +   The disadvantages of the EM algorithm having to do with getting stuck in local
    optima and being sensitive to the starting point are still true here.


