  md: "The optimization is carried out by using stochastic gradient descent:\n\n```\n\
    $$\\frac{\\partial-\\log p(\\mathbf{x})}{\\partial\\theta} = E_{\\mathbf{h}}\\\
    left[\\frac{\\partial E(\\mathbf{x}',\\mathbf{h})}{\\partial\\theta} \\mathbf{x}'\\\
    right] - E_{\\mathbf{x,h}}\\left[\\frac{\\partial E(\\mathbf{x},\\mathbf{h})}{\\\
    partial\\theta}}\\right]$\n```\n\nThe term $E_{\\mathbf{h}}\\left[\\frac{\\partial\
    \ E(\\mathbf{x}',\\mathbf{h})}{\\partial\\theta} \\mathbf{x}'\\right]$ is called\
    \ the \"positive phase\" and the term\n\n```\n$E_{\\mathbf{x,h}}\\left[\\frac{\\\
    partial E(\\mathbf{x},\\mathbf{h})}{\\partial\\theta}}\\right]$ is called the\
    \ \"negative phase\" because of how they affect the\n```\n\nprobability distributions\
    \ – the positive phase, because it increases the probability of\ntraining data\
    \ by reducing the free energy, and the negative phase, as it decreases the\nprobability\
    \ of samples generated by the model.\n\nIt has been shown that the overall gradient\
    \ is difficult to compute analytically\nas it is because the \"negative phase\"\
    , as it is computing the expectation over all possible\nconfigurations of the\
    \ input data under the distribution formed by the model and\nmaking it intractable!\n\
    \nTo make the computation tractable, estimation is carried out using a fixed number\
    \ of\nmodel samples and they are referred to as \"negative particles\" denoted\
    \ by N.\n\nThe gradient can be now written as the approximation:\n\n```\n$$\\\
    frac{\\partial-\\log p(\\mathbf{x}')}{\\partial\\theta} \\approx \\frac{\\partial\
    \ F(\\mathbf{x})}{\\partial\\theta} - \\frac{1}{N}\\sum_{\\kappa\\in N}}\\frac{\\\
    partial F(\\tilde{\\mathbf{x}})}{\\partial\\theta}}$\n```\n\nWhere $\tilde{x}$\
    \ are sampled using some sampling techniques such as the Monte\nCarlo method.\n\
    \n# Sampling in RBM\n\nGibbs sampling is the technique used to generate samples\
