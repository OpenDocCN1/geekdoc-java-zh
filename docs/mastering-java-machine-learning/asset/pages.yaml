- pgno: 327
  md: '# Inference


    Inference in MNs is similarly #P-complete problem and hence similar approximations
    or heuristics get applied. Most exact and approximate inferencing techniques,
    such as variable elimination method, junction tree method, belief propagation
    method, and so on, which were discussed in Bayes network, directly applicable
    to Markov networks. The marginals and conditionals remain similar and computed
    over the potential functions over the cliques as


    ```

    $P(X) = \frac{1}{Z} \prod_{c} \Phi_{c}(X)_{c}$


    $Z = \sum_{x} \sum_{c} \Phi_{c}(X)_{c}$

    ```


    Markov blankets simplify some of the computations.


    # Learning


    Learning the parameters in Markov networks is complex and computationally expensive
    due to the entanglement of all the parameters in the partitioning function. The
    advantageous step of decomposing the computations into local distributions cannot
    be done because of the partitioning function needing the factor coupling of all
    the variables in the network.


    Maximum likelihood estimation in MN does not have a closed-form solution and hence
    incremental techniques such as gradient descent are used for optimizing over the
    entire parameter space. The optimization function can be shown to be a concave
    function, ensuring a global optimum, but each step of the iterations in gradient
    descent requires infer over the entire network, making it computationally expensive
    and sometimes intractable.


    Bayesian parameter estimation requires integration over the entire space of parameters,
    which again has no closed-form solution and is even harder. Thus, most often,
    approximate learning methods such as Markov Chain Monte Carlo (MCMC) are used
    for MNs.'
