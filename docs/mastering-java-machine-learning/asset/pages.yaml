- pgno: 133
  md: '# # 3 Unsupervised Machine Learning Techniques


    In the last chapter, we focused on supervised learning, that is, learning from
    a training dataset that was labeled. In the real world, obtaining data with labels
    is often difficult. In many domains, it is virtually impossible to label data
    either due to the cost of labeling or difficulty in labeling due to the sheer
    volume or velocity at which data is generated. In those situations, unsupervised
    learning, in its various forms, offers the right approaches to explore, visualize,
    and perform descriptive and predictive modeling. In many applications, unsupervised
    learning is often coupled with supervised learning as a first step to isolate
    interesting elements for labeling.


    In this chapter, we will focus on various methodologies, techniques, and algorithms
    that are practical and well-suited for unsupervised learning. We begin by noting
    the issues that are common between supervised and unsupervised learning when it
    comes to handling data and transformations. We will then briefly introduce the
    particular challenges faced in unsupervised learning owing to the lack of “ground
    truth” and the nature of learning under these conditions.


    We will discuss the techniques of feature analysis and dimensionality reduction
    applied to unlabeled datasets. This is followed by an introduction to the broad
    spectrum of clustering methods and discussions on the various algorithms in practical
    use, just as we did with supervised learning *Chapter 2, Practical Approach to
    Real-World Supervised Learning*, showing how each algorithm works, when to use
    it, and its advantages and limitations. We will conclude the section on clustering
    by presenting the different cluster evaluation techniques.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'Unsupervised Machine Learning Techniques


    Following the treatment of clustering, we will approach the subject of outlier
    detection. We will contrast various techniques and algorithms that illustrate
    what makes some objects outliers— also called anomalies— within a given dataset.


    The chapter will include clustering and outlier detection experiments, conducted
    with a real-world dataset and an analysis of the results obtained. In this case
    study, we will be using ELKI and SMILE Java libraries for the machine learning
    tasks and will present code and results from the experiments. We hope that this
    will provide the reader with a sense of the power and ease of use these tools.


    # Issues in common with supervised learning


    Many of the issues that we discussed related to supervised learning are also common
    with unsupervised learning. Some of them are listed here:


    +   * Types of features handled by the algorithm: Most clustering and outlier
    algorithms need numeric representation to work effectively. Transforming categorical
    or ordinal data has to be done carefully


    +   * Curse of dimensionality: Having a large number of features results in sparse
    spaces and affects the performance of clustering algorithms. Some option must
    be chosen to suitably reduce dimensionality—either feature selection where only
    the most relevant features are retained, or feature extraction, which transforms
    the feature space into a new set of principal variables of a lower dimensional
    space


    +   * Scalability in memory and training time: Many unsupervised learning algorithms
    cannot scale up to more than a few thousands of instances either due to memory
    or training time constraints


    +   * Outliers and noise in data: Many algorithms are affected by noise in the
    features, the presence of anomalous data, or missing values. They need to be transformed
    and handled appropriately


    [ 98 ]'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Issues specific to unsupervised learning


    The following are some issues that pertain to unsupervised learning techniques:


    +   - **Parameter setting**: Deciding on number of features, usefulness of features,
    number of clusters, shapes of clusters, and so on, pose enormous challenges to
    certain unsupervised methods

    - **Evaluation methods**: Since unsupervised learning methods are ill-posed due
    to lack of ground-truth, evaluation of algorithms becomes very subjective.

    - **Hard or soft**: Many unsupervised learning problems require giving labels
    to the data in an exclusive or probabilistic manner. This poses a problem for
    many algorithms

    - **Interpretability of results and models**: Unlike unsupervised learning, the
    lack of ground truth and the nature of some algorithms make interpreting the results
    from both model and labeling even more difficult


    # Feature analysis and dimensionality reduction


    Among the first tools to master are the different feature analysis and dimensionality
    reduction techniques. As in supervised learning, the need for reducing dimensionality
    arises from numerous reasons similar to those discussed earlier for feature selection
    and reduction.


    A smaller number of discriminating dimensions makes visualization of data and
    clusters much easier. In many applications, unsupervised dimensionality reduction
    techniques are used for compression, which can then be used for transmission or
    storage of data. This is particularly useful when the larger data has an overhead.
    Moreover, applying dimensionality reduction techniques can improve the scalability
    in terms of memory and computation speeds of many algorithms.


    # Notation


    We will use similar notation to what was used in the chapter on supervised learning.
    The examples are in $d$ dimensions and are represented as vector:


    ```

    x = (X_1, X_2, ..., X_d)^T

    ```'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'The entire dataset containing n examples can be represented as an observation
    matrix:


    ```

    $X = \{x_{ij} : 1 \leq i \leq d, 1 \leq j \leq n\}$

    ```


    The idea of dimensionality reduction is to reduce k ≤ d features by transformation
    of the input features, projecting or combining them such that the lower dimension
    k captures or preserves interesting properties of the original dataset.


    # Linear methods


    Linear dimensionality methods are some of the oldest statistical techniques to
    reduce features or transform the data into lower dimensions, preserving interesting
    discriminating properties.


    Mathematically, with linear methods we are performing a transformation, that a
    new data element is created using a linear transformation of the original data
    element:


    ```

    $s_i = w_{i1}x_1 + w_{i2}x_2 + \dots \cdot w_{ik}x_k$ for $i = 1, 2, \dots, k$

    ```


    ```

    **s = Wx**

    ```


    Here, $W_{s \times d}$ is the linear transformation matrix. The variables **s**
    are also referred to as latent or hidden variables.


    In this topic, we will discuss the two most practical and often-used methodologies.
    We will list some variants of these techniques so that the reader can use the
    tools to experiment with them. The main assumption here – which often forms the
    limitation – is the linear relationships between the transformations.


    # Principal component analysis (PCA)


    PCA is a widely-used technique for dimensionality reduction (References [1]).
    The original coordinate system is rotated to a new coordinate system that exploits
    the directions of maximum variance in the data, resulting in uncorrelated variables
    in a lower-dimensional subspace that were correlated in the original feature space.
    PCA is sensitive to the scaling of the features.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# Inputs and outputs


    PCA is generally effective on numeric datasets. Many tools provide the categorical-to-continuous
    transformations for the nominal features, but this affects the performance. The
    number of principal components, or $k$, is also an input provided by the user.


    # How does it work?


    PCA, in its most basic form, tries to find projections of data onto new axes,
    which are known as principal components. Principal components are projections
    that capture maximum variance directions from the original space. In simple words,
    PCA finds the first principal component through rotation of the original axes
    of the data in the direction of maximum variance. The technique finds the next
    principal component by again determining the next axis, orthogonal to the first
    axis, by seeking the second largest variance and so until most variances are captured.
    Generally, most tools give either a choice of number of principal components or
    the option to keep components until some percentage, for example, 99%, of variance
    in the original dataset is captured.


    Mathematically, the objective of finding maximum variance can be written as


    ```

    $= \max_{||w||=1} ||w^T X||^2$

    ```


    = largest eigenvalue of $X^T X$ (covariance matrix)


    $\lambda v = Cv$ is the eigendecomposition


    This is equivalent to:


    ```

    $X_{d:n} = W_{d:d} \times S_{d:n}$

    ```'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'Unsupervised Machine Learning Techniques


    Here, **W** is the principal components and **S** is the new transformation of
    the input data. Generally, eigenvalue decomposition or singular value decomposition
    is used in the computation part.


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_138_0.png)


    Figure 1: Principal Component Analysis


    # Advantages and limitations


    +   * One of the advantages of PCA is that it is optimal in that it minimizes
    the reconstruction error of the data.

    * PCA assumes normal distribution.

    * The computation of variance-covariance matrix can become intensive for large
    datasets with high-dimensions. Alternatively, *Singular Value Decomposition (SVD)*
    can be used iteratively and there is no need for an explicit covariance matrix.

    * PCA fails when there is noise in the data.

    * PCA fails when the data lies in the complex manifold, a topic that we will discuss
    in the non-linearity reduction section.

    * PCA assumes a correlation between the features and in the absence of those correlations,
    it is unable to do any transformations; instead, simply rank them.

    * By transforming the original feature space into a new set of variables, PCA
    causes a loss in interpretability of the data.

    * There are many other variants of PCA that are popular and overcome some of the
    biases and assumptions of PCA.'
  merge: -1
  img_proc: true
