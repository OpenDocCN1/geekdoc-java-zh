  md: 'In simple terms, one can read the Bayesian network graph G, all the independencies

    hold in the distribution P regardless of any parameters!


    Consider the student network – its whole distribution can be shown as:


    ```

    P(D,I,G,S,L) = P(D)P(I|D)P(G|D,I)P(S|D,I,G)P(L|D,I,G)

