    # # Inputs and outputs


    Data inputs are generally numeric features. Many SVMs can take nominal features
    and apply binary transformations to them. Also needed are: marking the class of
    interest, SVM hyper-parameters such as kernel choice, kernel parameters and cost
    parameter, among others. Output is a SVM model that can predict whether instances
    belong to the class of interest or not. This is different from scoring models,
    which we have seen previously.


    # # How does it work?


    The input is training instances $[x_1, x_2, .. x_l]$ with certain instances marked
    to be in class +1 and rest in -1.


    The input to SVM also needs a kernel that does the transformation $\phi$ from
    input space to features as $x \rightarrow \phi(x)_{\mathcal{H}}$


    ```

    $k(x, x'') = (\phi(x), \phi(x''))_{\mathcal{H}}$

    ```


    Create a hyper-sphere that bounds the classes using SVM formulation as:


    ```

    $$\min_{R, c} R^2 + \frac{1}{c} \sum_{i} \xi_i^2$$

    ```


