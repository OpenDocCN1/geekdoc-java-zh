- pgno: 393
  md: '# Chapter 7


    A neuron with feedback keeps a matrix $W_R$ to incorporate previous output at
    time $t-1$ and the equations:


    ```

    $h^{(t)} = g_h(W_x x^{(t)} + W_R h^{(t-1)} + b_h)$$

    $$y^{(t)} = g_y(W_y h^{(t)} + b_y)$$

    ```


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_393_0.png)


    Figure 33: Chain of neurons with feedbacks connected together.


    The basic RNN stacks the structure of hidden units as shown with feedback connected
    from the previous layer. Activation at time $t$, it depends not only on $x^{(t)}$
    as input, but also on the previous unit given by $W_h h^{(t-1)}$. The weights
    in the feedback connection of RNN are generally the same across the units, $W_g$.
    Also, instead of emitting output at the very end of the feed-forward neural network,
    each unit continuously emits an output that can be used in the loss function calculation.


    # Learning and associated problems in RNNs


    Working with RNNs presents some challenges that are specific to them but there
    are common problems that are also encountered in other types of neural net.


    +   1. The gradient from the output loss function at any time $t$ of the unit
    has dependency going back to the first unit or $t=0$, as shown in the following
    figure. This is because the partial derivative of the unit is dependent on the
    previous unit, since:


    ```

    $h^{(t)} = g_h(W_i x^{(t)} + W_R h^{(t-1)} + b_h)$

    ```


    [— 357 ]'
  merge: -1
  img_proc: true
- pgno: 394
  md: 'Backpropagation through time (BPTT) is the term used to illustrate the process.


    | Loss Functions | $l_0$ | $l_1$ | $l_2$ |\n|---|---|---|---|\n| | $y^{(t-1)}$
    | $y^{(t)}$ | $y^{(t+1)}$ |\n| $W_y$ | $\frac{\partial l_0}{\partial h^{(t)}}$
    | $W_y$ | $\frac{\partial l_1}{\partial h^{(t+1)}}$ | $W_y$ | $\frac{\partial
    l_2}{\partial h^{(t+2)}}$ |\n| $W_h$ | | $h^{(t-1)}$ | $h^{(t)}$ | $h^{(t+1)}$
    | $h^{(t+2)}$ |\n| | $W_h$ | | $x^{(t-1)}$ | $x^{(t)}$ | $x^{(t+2)}$ |


    Figure 34: Backpropagation through time.


    +   1. Similar to what we see in the section on feed-forward neural networks,
    the cases of exploding and vanishing gradient become more pronounced in RNNs due
    to the connectivity of units as discussed previously.


    +   2. Some of the solutions for exploding gradients are:


    +   1. Truncated BPTT is a small change to the BPTT process. Instead of propagating
    the learning back to time $t=0$, it is truncated to a fixed time backward to $t=k$.


    +   2. Gradient Clipping to cut the gradient above a threshold when it shoots
    up.


    +   3. Adaptive Learning Rate. The learning rate adjusts itself based on the feedback
    and values.


    +   4. Some of the solutions for vanishing gradients are:


    +   1. Using ReLU as the activation function; hence the gradient will be 1.


    +   2. Adaptive Learning Rate. The learning rate adjusts itself based on the feedback
    and values.


    +   3. Using extensions as Long Short Term Memory (LSTM) and Gated Recurrent Units
    (GRUs), which we will describe next.


    There are many applications of RNNs, for example, in next layer predictions, next
    word predictions, language translation, and so on.'
