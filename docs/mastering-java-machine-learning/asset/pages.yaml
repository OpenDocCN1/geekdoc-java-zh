- pgno: 308
  md: '# Factor graph


    We know from basic probability theory that the entire joint distribution can be
    represented as a factor over a subset of variables as


    ```

    $p(X) = \prod_{i} f_i(X_i)$

    ```


    DAG or Bayesian networks $f(X)$ is a conditional distribution. Thus, there is
    a great advantage in expressing the joint distribution over factors over the subset
    of variables.


    Factor graph is a representation of the network where the variables and the factors
    involving the variables are made into explicit nodes (References [11]). In a simplified
    student network from the previous section, the factor graph is shown in Figure
    9.


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_308_0.png)


    A factor graph is a bipartite graph, that is, it has two types of nodes, variables
    and factors.


    The edges flow between two opposite types, that is, from variables to factors
    and vice versa.


    Converting the Bayesian network to a factor graph is a straightforward procedure
    as shown previously where you start adding nodes and conditional probability distributions
    as factor nodes. The relationship between the Bayesian network and factor graphs
    is one-to-many, that is, the same Bayesian network can be represented in many
    factor graphs and is not unique.'
  merge: -1
