    # # Deep learning and NLP


    In the last few years, Deep Learning and its application to various areas of NLP
    has shown huge success and is considered the cutting edge of technology these
    days. The main advantage of using Deep Learning lies in a small subset of tools
    and methods, which are useful in a wide variety of NLP problems. It solves the
    basic issue of feature engineering and carefully created manual representations
    by automatically learning, and thus solves the issue of having a large number
    of language experts dealing with a wide range of problems, such as text classification,
    sentiment analysis, POS tagging, and machine translation, to name a few. In this
    section, we will cover important concepts and research in the area of Deep Learning
    and NLP.


    In his seminal paper, Bengio introduced one of the most important building blocks
    for deep learning known as word embedding or word vector (References [20]). Word
    embedding can be defined as a parameterized function that maps words to a high
    dimensional vector (usually 25 to 500 dimensions based on the application).'
