  md: '# Unsupervised Machine Learning Techniques


    Instead of linear covariance matrix, a nonlinear transformation is applied to
    the input space using kernel methods by constructing the N x N matrix, in place
    of doing the actual transformations using $\Phi(x)$.


    $k(x,y) = (langle\Phi(x),\Phi(y)\rangle) = \Phi(x)^T \Phi(y)$


    Since the kernel transformation doesn''t actually transform the features into
    explicit feature space, the principal components can be found as interpreted projections
