- pgno: 375
  md: '# Deep Autoencoders


    Deep Autoencoders have many layers of hidden units, which shrink to a very small
    dimension and then symmetrically grow to the input size.


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_375_0.png)


    The idea behind Deep Autoencoders is to create features that capture latent complex
    structures of input using deep networks and at the same time overcome the issue
    of gradients and underfitting due to the deep structure. It was shown that this
    methodology generated better features and performed better than PCA on many datasets
    (References [13]).


    Deep Autoencoders use the concept of pre-training, encoders/decoders, and fine-tuning
    to perform unsupervised learning.'
  merge: -1
  img_proc: true
- pgno: 376
  md: 'In the pre-training phase, the RBM methodology is used to learn greedy stepwise
    parameters of the encoders, as shown in the following figure, for initialization:


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_376_0.png)


    In the unfolding phase the same parameters are symmetrically applied to the decoder
    network for initialization.


    Finally, fine-tuning backpropagation is used to adjust the parameters across the
    entire network.


    # Deep Belief Networks


    Deep Belief Networks (DBNs) are the origin of the concept of unsupervised pre-training
    (References [9]). Unsupervised pre-training originated from DBNs and then was
    found to be equally useful and effective in the feed-forward supervised deep networks.


    Deep belief networks are not supervised feed-forward networks, but a generative
    model to generate data samples.


    # Inputs and outputs


    The input layer is the instance of data, represented by one neuron for each input
    feature. The output of a DBN is a reconstruction of the input from a hierarchy
    of learned features of increasingly greater abstraction.'
  merge: -1
  img_proc: true
- pgno: 377
  md: '# How does it work?


    How a DBN learns the joint distribution of the input data is explained here using
    a three-layer DBN architecture as an example.


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_377_0.png)


    Figure 15: Deep belief network


    The three-hidden-layered DBN as shown has a first layer of undirected RBM connected
    to a two-layered Bayesian network. The Bayesian network with a sigmoid activation
    function is called a sigmoid Bayesian network (SBN).


    The goal of a generative model is to learn the joint distribution as given by
    $p(x,h^{(1)},h^{(2)},h^{(3)})$


    > $p(x,h^{(1)},h^{(2)},h^{(3)}) = p(x|h^{(1)})p(h^{(1)}|h^{(2)})p(h^{(2)}|h^{(3)})$


    RBM computation as seen from before gives:


    > $p(h^{(2)}|h^{(1)}) = \exp(h^{(2)T}W^{(2)}h^{(1)} + b^{(2)T} + b^{(2)})/Z$


    The Bayesian Network in the next two layers is:


    ```

    $p(h^{(1)}|h^{(2)}) = \prod_{i} p(h_i^{(1)}|h^{(2)})$

    ```


    ```

    $p(x|h^{(1)}) = \prod_{i} p(x_i|h^{(1)})$

    ```'
  merge: -1
