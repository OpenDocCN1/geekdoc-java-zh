    # Spark MLib as Big Data Machine Learning platform


    Apache Spark, started in 2009 at AMPLab at UC Berkeley, was donated to Apache
    Software Foundation in 2013 under Apache License 2.0. The core idea of Spark was
    to build a cluster computing framework that would overcome the issues of Hadoop,
    especially for iterative and in-memory computations.


    # Spark architecture


    The Spark stack as shown in Figure 17 can use any kind of data stores as HDFS,
    SQL, NoSQL, or local filesystems. It can be deployed on Hadoop, Mesos, or even
    standalone.


    The most important component of Spark is the Spark Core, which provides a framework
    to handle and manipulate the data in a high-throughput, fault-tolerant, and scalable
    manager.


    Built on top of Spark core are various libraries each for various functionalities
    needed in processing data and analytics in the Big Data world. Spark SQL gives
    us a language for performing data manipulation in Big Data stores using a querying
    language very like SQL, the lingua franca of databases. Spark GraphX provides
    APIs to perform graph-related manipulations and graph-based algorithms on Big
    Data. Spark Streaming provides APIs to handle real-time operations needed in stream
    processing ranging from data manipulations to queries on the streams.'
