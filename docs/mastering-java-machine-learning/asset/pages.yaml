  md: '# Chapter 9


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_509_0.png)


    Figure 21: Use case for real-time Big Data Machine Learning


    We consider a case where labeled data is available for a short duration, and we
    perform the appropriate modeling techniques on the data and then apply the most
    suitable evaluation methods on the resulting models. Next, we select the best
    model and use it for predictions on unseen data at runtime. We then observe, with
    some dismay, model performance drops significantly over time. Repeating the exercise
    with new data shows a similar degradation in performance! What are we to do now?
    This quandary, combined with large volumes of data motivates the need for a different
    approach: real-time Big Data Machine Learning.


    Like the batch framework, the real-time framework in big data may have similar
    components until the data preparation stage. When the computations involved in
    data preparation must take place on streams or combined stream and batch data,
    we require specialized computation engines as Spark Streaming. Like stream computations,
    Machine Learning must work across the cluster and perform different Machine Learning
    tasks on the stream. This adds an additional layer of complexity to the implementations
    of single machine multi-threaded streaming algorithms.


    ![](img/2b4ec1705c1d24bfee7a5f8594a281b5_509_1.png)


    Figure 22: Real-time big data components and providers


    [ 473 ]'
