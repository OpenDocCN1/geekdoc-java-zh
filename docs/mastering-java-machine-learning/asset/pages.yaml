  md: "The learning rate used here ($\\alpha$) will impact the algorithm convergence\
    \ by reducing the oscillation near the optimum; choosing the right value of $\\\
    alpha$ is often a hyper parameter search that needs the validation techniques\
    \ described in Chapter 2, Practical Approach to Real-World Supervised Learning.\n\
    \nThus, to learn the parameters of a neural network, we need to choose a way to\
    \ do parameter initialization, select a loss function $l(f(\\mathbf{x};\boldsymbol{\t\
    heta}))$, compute the parameter gradients $\nabla_{\boldsymbol{\theta}}l(f(\\\
    mathbf{x};\boldsymbol{\theta}))$, propagate the loss back, select the regularization/penalty\
    \ function $\\Omega(\boldsymbol{\theta})$, and compute the gradient of regularization\
    \ $\nabla_{\boldsymbol{\theta}}\\Omega(\boldsymbol{\theta})$. In the next few\
    \ sections, we will describe this step by step.\n\n# Parameter initialization\n\
    \nThe parameters of neural networks are the weights and biases of each layer from\
    \ the input layer, through hidden layers, to the output layer. There has much\
    \ research in this area as the optimization depends on the start or initialization.\
    \ Biases are generally set to value 0. The weight initialization depends on the\
    \ activation functions as, such as tanh, value 0, cannot be used. Generally, the\
    \ way to initialize the weights of each layer is by random initialization using\
    \ a symmetric function with a user-defined boundary.\n\n# Loss function\n\nThe\
    \ loss function's main role is to maximize how well the predicted output label\
    \ matches the class of the input data vector.\n\nThus, maximization $f(\\mathbf{x})\
    \ = p(y=c|\\mathbf{x})$ is equivalent to minimizing the negative of the log-likelihood\
    \ or cross-entropy:\n\n> $l(f(\\mathbf{x}), y) = -\\log(f(\\mathbf{x}),$\n\n#\
    \ Gradients\n\nWe will describe gradients at the output layer and the hidden layer\
    \ without going into the derivation as it is beyond the scope of this book. Interested\
    \ readers can see the derivation in the text by Rumelhart, Hinton and Williams\
    \ (References [6])."
