  md: 'Semi-Supervised and Active Learning


    # # Case study in active learning


    This case study uses another well-known publicly available dataset to demonstrate
    active learning techniques using open source Java libraries. As before, we begin
    defining the business problem, what tools and frameworks are used, how the principles
    of machine learning are realized in the solution, and what the data analysis steps
    reveal. Next, we describe the experiments that were conducted, evaluate the performance
    of the various models, and provide an analysis of the results.


    # # Tools and software


    For the experiments in Active Learning, JCLAL was the tool used. JCLAL is a Java
    framework for Active Learning, supporting single-label and multi-label learning.


    > > JCLAL is open source and is distributed under the general public license:
    https://sourceforge.net/p/jclcal/git/ci/master/tree/


    # # Business problem


    The abalone dataset, which is used in these experiments, contains data on various
    physical and anatomical characteristics of abalone—commonly known sea snails.
    The goal is to predict the number of rings in the shell, which is indicative of
    the age of the specimen.


    # # Machine learning mapping


    As we have seen, active learning is characterized by starting with a small set
    of labeled data accompanied by techniques of querying the unlabeled data such
    that we incrementally instances over multiple iterations, a batch at a time. The
    number of iterations and batch size are hyper-parameters for these techniques.
    The querying strategy and the choice of supervised learning method used to train
    on the growing number of labeled instances are additional inputs.


    # # Data Collection


    As before, we will use an existing dataset available from the UCI repository (https://archive.ics.uci.edu/ml/datasets/Abalone).
    The original owners of the database are the Department of Primary Industry and
    Fisheries in Tasmania, Australia.'
