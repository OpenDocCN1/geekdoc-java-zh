    \ coordinates of Mount Everest (on the Nepal-China border).\n- We assert the coordinates\
    \ are visible on the page.\n\n# Web Authentication\n\nThe Web Authentication API\
    \ (also known as WebAuthn) is a W3C specification that allows servers to register\
    \ and authenticate users using public key cryptography instead of passwords. Major\
    \ browsers (Chrome, Firefox, Edge, and Safari) have supported WebAuthn since January\
    \ 2019. These browsers allow credential creation and assertion using U2F (Universal\
    \ 2 Factor) tokens, which are Universal Serial Bus (USB) or Near-Field Communication\
    \ (NFC) secure devices."
