  md: 'REST follows a client-server architecture. The server handles a set of resources,
    listening for incoming requests made by clients. These resources are the building
    blocks of REST services and define the type of information transferred. Each resource
    is uniquely identified. In HTTP, we use URLs (also known as endpoints) for accessing
    resources. Each resource has a representation, a machine-readable explanation
    of the current state of a resource. We use a data-interchange format for defining
    representations, such as JSON, YAML, or XML. REST services expose a set of actions
    on the resources, such as CRUD (create, retrieve, update, and delete). We can
    use the HTTP methods used to create REST services. Table 10-3 summarizes the HTTP
    methods. Finally, we use the HTTP status codes to identify the response associated
    with REST actions. Table 10-4 summarizes the typical HTTP status codes used in
    REST. Figure 10-5 shows a sequence of requests and responses of an example REST
    service that uses different HTTP methods and responses.


    # Table 10-3. HTTP methods for creating REST services


    | Method | Description |

    | --- | --- |

    | GET | Read a resource |

    | POST | Send a new resource to the server |

    | PUT | Update a resource |

    | DELETE | Eliminate a resource |

    | PATCH | Partially update a resource without returning any |

    | HEAD | Ask if a given resource exists any of its representations |

    | OPTIONS | Retrieve the available verbs for a given resource |


    # Table 10-4. HTTP status codes for creating REST services


    | Code | Description |

    | --- | --- |

    | 200 OK | The request was successful, and the content requested was returned
    (e.g., in a GET request). |

    | 201 Created | The resource was created (e.g., in a POST or PUT request). |

    | 204 No content | The action was successful, but no content was returned. This
    status code is useful in actions that do not return a response body (e.g., in
    a DELETE request). |

    | 301 Moved permanently | The resource moved to another location. |

    | 400 Bad request | The request has some problems (e.g., missing parameters).
    |

    | 401 Unauthorized | The resource is not accessible for the user that made the
    request. |

    | 403 Forbidden | The resource is not accessible, unlike 401, authentication will
    not affect the response. |

    | 404 Not found | The endpoint does not identify any resource. |

    | 405 Method not allowed | The used verb is not allowed (e.g., when using PUT
    in a read-only resource). |

    | 500 Internal server error | Generic unexpected condition in the server side.
    |


    ![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_354_0.png)'
  merge: -1
