  md: "Example 8-33. Parallel test execution using JUnit 5\n\n```\njunit.jupiter.execution.parallel.enabled\
    \ = true\njunit.jupiter.execution.parallel.mode.default = same_thread\njunit.jupiter.execution.parallel.classes.default\
    \ = same_thread\n```\n\nIn addition, the JUnit programming model provides the\
    \ annotation @Execution to change the parallelization for test classes or methods.\
    \ This annotation can be used at the class level or method level and accepts two\
    \ values: ExecutionMode.CONCURRENT (for parallel execution) and ExecutionMode.SAME_THREAD\
    \ (for single-threaded execution). Example 8-34 shows the structure of a test\
    \ class contained in the example repository. Suppose that the parallel test is\
    \ enabled (in Example 8-33), this class will be executed in parallel with other\
    \ tests that allow parallelization.\n\nExample 8-34. Parallel test execution using\
    \ JUnit 5\n\n```\n@Execution(ExecutionMode.CONCURRENT)\nclass ParallelJupiterTest\
    \ {\n    // Test logic\n}\n```\n\n# Test Listeners\n\nA common need in the testing\
    \ process is to keep track of the different stages of test execution. Unit testing\
    \ frameworks provide a feature known as a test listener. Test listeners can be\
    \ seen as utilities that modify the default test behavior by performing custom\
    \ actions at multiple stages of the test execution cycle. As usual, each unit\
    \ testing framework provides its own implementation for these test listeners.\n\
    \n# JUnit 4\n\nIn JUnit 4, test listeners include custom operations when tests\
    \ are started, passed, finished, failed, or ignored. The first step for implementing\
    \ a JUnit 4 listener is to create a class that extends the RunListener. In this\
    \ class, you can override several methods (e.g., testRunStarted, testIgnored,\
    \ testFailure) for including additional logic in the different steps of the test\
    \ lifecycle. Example 8-35 shows basic implementation of a JUnit 4 test listener.\
    \ This listener simply displays a message in the standard output about the test\
    \ stage."
