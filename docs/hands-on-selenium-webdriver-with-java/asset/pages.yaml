    \ 1\n\nWebDriver wdm = DriverManager.chromedriver().browserInDocker()\n    .browserVersion(\"\
    beta\"); 2\n\nWebDriver wdm = DriverManager.chromedriver().browserInDocker()\n\
    \    .enableVnc(); 3\n\nWebDriver wdm = DriverManager.chromedriver().browserInDocker()\n\
    \    .enableRecording(); 4\n```\n\n+   We select a given manager to use the dockerized\
    \ browser (Firefox in this case). In addition to Chrome and Firefox, the other\
