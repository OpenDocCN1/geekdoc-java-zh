  md: '# Selenium IDE


    Selenium IDE is introduced in “Selenium IDE” on page 8. Some of the new features
    available as of Selenium 4 are:


    Backup element selectors


    Selenium IDE records multiple locators (e.g., by id, XPath, or CSS selector) for
    each element. This way, if the test execution does not locate an element using
    the first locator, it will fall back to the following until it is found.


    Control flows


    Selenium IDE enhances script execution using conditionals (i.e., if, else, if,
    and end) and loops (do, while, and forEach).


    Code export


    Selenium IDE allows exporting the recording to several Selenium WebDriver bindings
    (i.e., C#, Java, JavaScript, Python, and Ruby) and unit testing frameworks (i.e.,
    NUnit, xUnit, JUnit, Mocha, pytest, and RSpec).


    Plug-ins


    We can extend the Selenium IDE (e.g., introducing new commands or third-party
    integration) using custom add-ons.


    # Other Novelties


    The official Selenium documentation has been significantly improved with Selenium
    4. The new site is available on https://www.selenium.dev, and it covers the Selenium
    subprojects (WebDriver, IDE, and Grid), user guide, blog, support, and other project
    information.


    Last but not, Simon Stewart, the cocreator of Selenium WebDriver and Selenium
    project lead since 2009, stepped down as leader of the Selenium project on October
    27, 2021. You can find the current project structure (composed of the project
    leader-ship committee, technical leadership committee, and Selenium committers
    and triggers) and governance (i.e., model, philosophy, project roles, decision-making
    process, etc.) on the Selenium website.'
