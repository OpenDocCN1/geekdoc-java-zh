  md: "Example 8-35. Test listener using JUnit 4\n\n```\npublic class MyTestListener\
    \ extends RunListener {\n    static final Logger log = getLogger(lookup().lookupClass());\n\
    \n    @Override\n    public void testStarted(Description description) throws Exception\
    \ {\n        super.testStarted(description);\n        log.debug(\"testStarted\
    \ {}\", description.getDisplayName());\n    }\n\n    @Override\n    public void\
    \ testFailure(Failure failure) throws Exception {\n        super.testFailure(failure);\n\
    \        log.debug(\"testFailure {}\", failure.getException(),\n            failure.getMessage());\n\
    \    }\n\n    // Other listeners\n}\n```\n\nA common way to register a listener\
    \ in JUnit 4 is to create a custom runner and use that runner in test classes.\
    \ Example 8-36 shows a custom test runner registering the previous listener. Example\
    \ 8-37 shows a test skeleton using this runner.\n\nExample 8-36. Test listeners\
    \ using JUnit 4\n\n```\npublic class MyTestRunner extends BlockJUnit4ClassRunner\
    \ { ①\n    public MyTestRunner(Class<?> clazz) throws InitializationError {\n\
    \        super(clazz);\n    }\n\n    @Override\n    public void run(RunNotifier\
    \ notifier) {\n        notifier.addListener(new MyTestListener()); ② ③\n     \
    \   super.run(notifier);\n    }\n}\n```\n\n+   ① We extend Blockjunit4classrunner,\
    \ the default test runner in JUnit 4.\n② We register our custom test listener.\n\
    ③ We call the parent to continue using the default test runner."
