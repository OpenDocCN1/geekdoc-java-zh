  md: "# WebDriverManager builder\n\nAnother possibility to create WebDriver objects\
    \ using WebDriverManager. In addition to resolving drivers, as of version 5, WebDriverManager\
    \ provides a WebDriver builder utility. Example 3-2 shows a test skeleton using\
    \ this builder.\n\nExample 3-2. Test skeleton using the WebDriverManager builder\n\
    \n```\nclass WdmBuilderJupiterTest {\n\n    WebDriver driver;\n\n    @BeforeEach\n\
    \    void setup() {\n        driver = WebDriverManager.chromedriver().create();\n\
    \    }\n\n    @AfterEach\n    void teardown() {\n        driver.quit();\n    }\n\
    \n    @Test\n    void test() {\n        // TODO: use \"driver\" to call the Selenium\
    \ WebDriver API\n    }\n}\n```\n\n> WebDriverManager resolves the required driver\
    \ (chromedriver) and creates an instance of the proper WebDriver type (ChromeDriver\
    \ in this case) in a single line.\n\nThis approach has different benefits. First,\
    \ it enables less verbose tests since the driver resolution and WebDriver instantiation\
    \ are simultaneous. Second, it allows specifying the browser type (i.e., Chrome,\
    \ Firefox, etc.) simply by selecting a specific manager (i.e., chromedriver, firefoxdriver,\
    \ etc.). Moreover, we can easily parameterize the selection of a manager to create\
    \ cross-browser tests (see Chapter 8). Finally, the WebDriverManager allows you\
    \ to specify browser-specific capabilities (see Chapter 5) and effortlessly use\
    \ browsers in a Docker container (see Chapter 6)."
