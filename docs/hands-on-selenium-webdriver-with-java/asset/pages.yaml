  md: "6 We confirm the selected is unchecked.\n\n# Locating by XPath\n\nXPath (XML\
    \ Path Language) is a powerful way of navigating to the DOM of XMLlike documents,\
    \ such as HTML pages. It includes over two hundred built-in functions to create\
    \ advanced queries to select nodes. There are two types of XPath queries. First,\
    \ absolute queries use the symbol slash (/) to traverse the DOM from the root\
    \ node. For example, considering the basic HTML page in Example 3-5, to select\
    \ the link element present in this page using this approach, we need the following\
    \ XPath query:\n\n```\n/html/body/a\n```\n\nAbsolute XPath queries are easy to\
    \ create, but have a relevant inconvenience: any minimal change in the page layout\
    \ would make a locator built this strategy fail. For this reason, as a general\
    \ rule, the use of absolute XPaths is discouraged. Instead, relative queries are\
    \ more convenient.\n\nThe general syntax for relative XPath queries is as follows:\n\
    \n```\n//tagname[@attribute='value']\n```\n\nExample 3-11 shows a test with an\
    \ XPath locator to select the hidden field in the practice web.\n\nExample 3-11.\
    \ Using a basic locator with XPath\n\n```\n@Test\nvoid testByXPathBasic() {\n\
    \    driver.get(\n        \"https://bongarcia.dev/selenium-webdriver-java/web-form.html\"\
    ;\n    \n    WebElement hidden = driver.findElement(By.xpath(\"//input[@type='hidden']\"\
    ));\n    assertThat(hidden.isDisplayed()).isFalse();n}\n```\n\n+   1 We locate\
    \ the hidden field in the practice web.\n\n+   2 We verify this is not visible\
    \ to the user.\n\nThe real power of XPath comes from its built-in functions. Table\
    \ 3-7 contains some of the most relevant XPath functions. You can find the complete\
    \ XPath reference in the W3C XPath Recommendations."
