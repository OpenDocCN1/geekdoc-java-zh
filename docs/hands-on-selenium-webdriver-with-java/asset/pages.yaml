  md: 'We reuse the same browser for all the repetitions.


    # Parallel Test Execution


    The time required to execute a Selenium WebDriver test suite (especially if the
    number of tests is high) can be considerable. The reason for this sluggishness
    is that regular Selenium WebDriver starts a new browser each time, and as a result,
    the overall execution time rises. A possible solution to this problem is to execute
    tests in parallel. There are different ways to achieve this parallelization. First,
    we can use the built-in capabilities for parallel execution provided by the build
    tools (Maven or Gradle). Second, we can use the features provided by the unit
    testing frameworks (JUnit 4 or 5, and TestNG) to aim at. The following subsections
    explain all these options.


    # Maven


    Maven offers different mechanisms for parallel execution. Maven allows building
    modules of multimodule projects in parallel. For that, we need to invoke the Maven
    command from the command line using the option -T. This option accepts two types
    of arguments for parallelization: using a fixed number of threads or using a factor
    multiplied by the number of available CPU cores in your system. The following
    snippet shows an example of each type:


    ```

    mvn -T 4

    mvn -T 1C

    ```


    +   It executes the test of a multimodule project (e.g., the examples repository)
    in parallel using four threads.


    +   It executes the test of a multimodule project using the same number of threads
    as the CPU cores (for example, four threads in a quad-core system).


    In addition, the plug-in used to execute unit tests in Maven (called Surefire)
    provides two ways to run tests in parallel. The first is multithreading inside
    a single JVM process. To enable this, we need to specify different configuration
    parameters, such as:


    parallel


    To configure the level of granularity of parallelism. The possible values for
    this parameter are methods (to execute test methods in separate threads), classes
    (for test classes), suites (for test suites), suitesAndClasses (for test suites
    and classes), and all (to execute every test in separate threads).


    threadCount


    To define the maximum number of threads for parallelism.'
