  md: "# Web Frameworks\n\nWeb frameworks are software frameworks designed to support\
    \ the development of web applications and services. One of the most popular frameworks\
    \ for the Java language is the Spring Framework. Spring is an open source framework\
    \ for building Java applications, including enterprise web applications and services.\
    \ The core technology of Spring is known as Inversion of Control (IoC), which\
    \ is a procedure to create instances outside the class in which these objects\
    \ are used. These objects, beans or components in the Spring jargon, are later\
    \ injected as dependencies by the Spring IoC container.\n\nThe following examples\
    \ show basic tests that verify a web application created with Spring-Boot, a subproject\
    \ of the Spring portfolio that simplifies the development of Spring-based applications\
    \ to convention over configuration and autodiscovery features. In addition, Spring-Boot\
    \ provides an embedded web server to ease the development of web applications.\
    \ The integration with Selenium WebDriver in this kind of project facilitates\
    \ the testing of Spring-based applications by deploying automatically in the embedded\
    \ web server per test case.\n\nThe code to integrate Spring-Boot with Selenium\
    \ WebDriver and the unit testing frameworks used in this book is different. Example\
    \ 9-18 shows a test integrating Spring-Boot and JUnit 4. Example 9-19 shows the\
    \ differences when using TestNG, Example 9-20 illustrates how to use JUnit 5,\
    \ and finally, Example 9-21 shows a Spring test based on JUnit 5 with Selenium\
    \ Jupiter.\n\nExample 9-18. Test using Spring-Boot and JUnit 4\n\n```\n@RunWith(SpringRunner.class)\n\
    @SpringBootTest(classes = SpringBootDemoApp.class,\n    webEnvironment = SpringBootTest.WebEnvironment.RANDOM_PORT)\n\
    public class SpringJUnit4Test {\n\n    private WebDriver driver;\n\n    @LocalServerPort\n\
    \    protected int serverPort;\n\n    @Before\n    public void setup() {\n   \
    \     driver = WebDriverManager.chromedriver().create();\n    }\n\n    @After\n\
    \    public void teardown() {\n        driver.quit();\n    }\n```"
