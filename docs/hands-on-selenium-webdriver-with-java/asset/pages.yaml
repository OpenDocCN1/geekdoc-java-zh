  md: '# WebDriverIO


    WebDriverIO is an automated testing framework for web and mobile applications.
    It is entirely open source (MIT license) and based on web standards such as the
    W3C WebDriver protocol. Figure 10-9 illustrates its architecture. WebDriverIO
    is written in JavaScript and runs on Node.js. It uses several services to support
    automation: chromedriver (for local browsers), Selenium Server (for other browsers),
    Appium Server (for mobile devices), Chrome DevTools CDP, and cloud providers (such
    as Sauce Labs, BrowserStack, or TestingBot). These services manipulate the corresponding
    browsers and mobile devices. Table 10-6 summarizes some of the pros and cons of
    WebDriverIO.


    ![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_360_0.png)


    Figure 10-9. WebDriverIO architecture


    Table 10-6. WebDriverIO pros and cons


    | Pros | Cons |

    | --- | --- |

    | Support for multiple browsers and mobile devices | Only available using JavaScript
    |

    | Works with different testing and reporting frameworks | |

    | Based on web standards | |


    The following npm command installs WebDriverIO locally. This installer displays
    a command-line wizard that asks for several options, such as the services (chromedriver,
    Selenium Server, Appium Server, CDP, or cloud providers), testing framework (Mocha,
    Jasmine, or Cucumber), or reporter tool (JUnit or Allure, among others):


    ```

    npm init wdio

    ```


    When the previous command finishes, we can create our custom tests. For instance,
    Example 10-5 shows a basic WebDriverIO using Mocha. We locate this test under
    the folder test of the project scaffolding and run it through the following command:


    ```

    npx wdio run /wdio.conf.js

    ```'
