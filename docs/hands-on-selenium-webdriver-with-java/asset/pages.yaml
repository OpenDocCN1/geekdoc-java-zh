  md: '![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_355_0.png)


    REST APIs are ubiquitous. As usual, it is highly recommended to implement automated
    tests for verifying these services, for instance, by using REST Assured. REST
    Assured is a popular open source (Apache 2.0 license) Java library for testing
    REST services. REST Assured provides a free API for testing and validating REST
    services. A convenient way to create readable assertions with REST Assured is
    to generate POJOs (Plain Old Java Objects) to map the REST responses (e.g., in
    JSON format) as Java classes. Then, we can use a library like AssertJ to verify
    the expected conditions using the accessors (the getter methods) of these POJOs.
    Example 10-2 shows a test case using this approach. Example 10-3 contains the
    POJO used in this test.


