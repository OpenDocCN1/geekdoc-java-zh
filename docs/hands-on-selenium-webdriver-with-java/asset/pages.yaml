    that assess the quality attributes of a software system (i.e., its nonfunctional
    requirements). Common methods of nonfunctional testing include, but are not limited
    to:


    # Performance testing


    Assesses metrics of software systems, such as response time, stability, reliability,
    or scalability. The objective of performance testing is not finding bugs but finding
    system bottlenecks. There are two common subtypes of performance testing:


    # Load testing


    Increases the usage on the system by simulating multiple concurrent users to verify
    if it can operate in the defined boundaries.


    # Stress testing


    Exercises a system beyond its operational capacity to identify the actual limits
    at which the system breaks.


    # Security testing


    Tries to evaluate security concerns, such as confidentiality (disclosure of information
    protection), authentication (ensuring the user identity), or authorization (determining
    user rights and privileges), among others.


    # Usability testing


    Evaluates how user-friendly a software application is. This assessment is also
    called UserExperience (UX) testing. A subtype of usability testing is:'
