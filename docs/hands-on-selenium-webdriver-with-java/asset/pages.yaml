    # Using an HTTP Client


    An alternative mechanism to download files with Selenium WebDriver is to use an
    HTTP client library. I propose using Apache HttpClient, since WebDriverManager
    internally uses this library, and therefore you can use it as a transitive dependency
    in your project. Example 9-3 shows a complete test case that downloads several
    files with Apache HttpClient from the practice site. Notice that in this case,
    it is not necessary to wait until the download finishes since Apache HttpClient
    handles the HTTP responses synchronously.'
