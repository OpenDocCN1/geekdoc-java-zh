    \ same as the input text locator before.\n\n# Locating by link text\n\nThe last\
    \ locator is by link text. This strategy is twofold: locate by exact and partial\
    \ occurrence. We use a link in the practice web to illustrate this locator in\
    \ the following HTML markup. Then, Example 3-8 shows a test using these locators.\n\
    \n```\n<a href=\"index.html\">Return to index</a>\n```\n\nExample 3-8. Test using\
    \ locators by link text\n\n```\n@Test\nvoid testByLinkText() {\n  driver.get(\n\
    \    \"https://bonigarcia.dev/selenium-webdriver-java/web-form.html\");\n\n  WebElement\
    \ linkByText = driver\n    .findElement(By.linkText(\"Return to index\"));\n \
    \ assertThat(linkByText.TagName()).isEqualTo(\"a\");\n  assertThat(linkByText.getCssValue(\"\
    cursor\")).isEqualTo(\"pointer\\n\n  WebElement linkByPartialText = driver\n \
    \   .findElement(By.partialLinkText(\"index\"));\n  assertThat(linkByPartialText.getLocation())\n\
    \    .isEqualTo(linkByText.getLocation());\n  assertThat(linkByPartialText.getRect()).isEqualTo(linkByText.getRect());\n\
    }\n```\n\n+   We locate an element by its full text.\n\n+   We check its tag name\
    \ is a.\n\n+   We check its CSS property cursor is pointer (i.e., the style typically\
    \ used for clickable elements).\n\n+   We find an element by partial link text.\
    \ This link will be the same as in step 1.\n\n+   We verify both elements the\
