  md: "# Simple Logging Facade for Java (SLF4J)\n\nThis is a popular utility based\
    \ on the facade design pattern that decouples the underlying layer. It supports\
    \ the main logging frameworks (e.g., Logback, Log4j, or SimpleLogger, among others).\
    \ As summarized in Table C-5, SLF4J defines five logging levels depending on the\
    \ severity of the message.\n\n# Table C-5. Log levels in SLF4J\n\n| Log level\
    \ | Description |\n| --- | --- |\n| ERROR | Used to report flaws in our application.\
    \ |\n| WARN | Something unexpected happened, but it does not affect the expected\
    \ application behavior. |\n| INFO | Informative messages, as the application enters\
    \ a given state, etc. |\n| DEBUG | For diagnosis and troubleshooting. |\n| TRACE\
    \ | Finest-grained information. We use this level only in exceptional cases where\
    \ we need a complete understanding of what is happening in our application.\n\n\
    As usual, to use these libraries, we need to resolve the corresponding dependencies\
    \ (see next section for details in Maven and Gradle). Then we need to configure\
    \ Logback properly. For that, we need to include an XML configuration file in\
    \ our project classpath. If we are configuring the logging for the whole project\
    \ (i.e., application test logic), the name of this file should be logback.xml.\
    \ In this case, it should be available within the application resources, typically\
    \ under the src/main/resources folder (see next for further information about\
    \ the project layout). If we are logging only for tests, the name of the configuration\
    \ file is logback-test.xml and is stored within the tests resources (e.g., in\
    \ src/test/resources folder).\n\nThe syntax in both (logback.xml and logback-test.xml)\
    \ is the same. Example C-4 shows an example of a configuration file. This XML\
    \ file sets the pattern for each logging line, composed by the timestamp, the\
    \ thread name, the trace level, the source (package, class name, and code line),\
    \ and the message. In this example, INFO is the default logging level. This, every\
    \ trace of level or more severe ones (i.e., WARN, ERROR, FATAL) is displayed,\
    \ but not the following (i.e., DEBUG and TRACE). In addition, the traces from\
    \ the package io.github.bonigarcia (used in the tests, WebDriverManager and Selenium-jupyter)\
    \ is DEBUG.\n\n# Example C-4. Logback configuration file\n\n```\n<?xml version=\"\
    1.0\" encoding=\"UTF-8?>\n<configuration>\n  <appender name=\"STDOUT\" class=\"\
    ch.qos.logback.core.ConsoleAppender\">\n    <encoder>\n      <pattern>%d{yyyy-MM-dd\
    \ HH:mm:ss} [%thread] %5level %logger{36}.%M(%line)\n%msg%n</pattern>\n    </encoder>\n\
    \  </appender>\n</configuration>\n```"
  merge: -1
  pgno: 394
- img_proc: true
  md: "```\n</appender>\n\n<logger name=\"io.github.bonigarcia\" level=\"DEBUG\" />\n\
    ```\n\n```\n<root level=\"INFO\">\n  <appender-ref ref=\"STDOUT\" />\n</root>\n\
    ```\n\n```\n</configuration>\n```\n\nThe final step is using a variable for logging\
    \ in our Java classes. To that aim, we can use the code of Example C-5. This snippet\
    \ provides a handy way to get the current class using reflection through the method\
    \ lookup(). Then, we declare the variable for logging (called log in this example)\
    \ and using the SLF4J's method getLogger(). Finally, we can use the variable in\
    \ any method of this to class messages of different levels.\n\nExample C-5. Example\
    \ of logging messages\n\n```\nstatic final Logger log = getLogger(lookup()).lookupClass();\n\
    \nlog.info(\"This is an informative message\");\nlog.debug(\"This is a debugging\
    \ message\");\n```\n\n# GitHub Actions\n\nI use GitHub Actions as the CI server\
    \ for the examples repository. Each time I commit a new change to the repo, GitHub\
    \ Actions builds the project and executes all the tests. Example C-6 shows the\
    \ configuration to carry out this process.\n\nExample C-6. GitHub Actions workflow\
    \ configuration\n\n```\nname: build\n\\on:\n  push:\n    branches: [ master ]\n\
    \  pull_request:\n    branches: [ master ]\nenv:\n  DISPLAY: :99\n  WDM_GITHUBTOKEN:\
    \ ${{ secrets.WDM_GITHUBTOKEN }}\njobs:\n  tests:\n    runs-on: ${{ matrix.os\
    \ }}\n  strategy:\n```"
