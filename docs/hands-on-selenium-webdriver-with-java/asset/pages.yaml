    we first need to install this driver on the local machine. Second, we need to
    manage chromedriver. To avoid the potential problems related to manual driver
    management (Chapter 1), I recommend carrying out the whole driver management process
    (download, setup, and maintenance) in an automated manner. Concerning Java, the
    reference implementation is WebDriverManager, Selenium WebDriver helper library
    that allows automated driver management. This section explains how to use WebDriverManager
    as a Java dependency.


    Once the WebDriverManager dependency is resolved in our project (Appendix C for
    the configuration details), we can use the WebDriverManager API to manage drivers.
    This API provides a set of singletons (called managers) to download, set up, and
    maintain drivers. These singletons are accessible through the WebDriverManager
    class. For instance, we need to invoke the method chromedriver() to manage the
    driver required by Chrome, i.e., chromedriver, as follows:


    ```

    WebDriverManager.chromedriver().setup();nWebDriver driver = new ChromeDriver();

    ```'
