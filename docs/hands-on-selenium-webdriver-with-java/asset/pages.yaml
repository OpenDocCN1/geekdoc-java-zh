  md: '# Selenium Grid


    As introduced in Chapter 1, Selenium Grid is a subproject of the Selenium suite
    that allows creating a networked infrastructure for remote browsers accessible
    with the W3C WebDriver protocol. Selenium Grid parallel tests across browsers
    running different machines and different browsers. Thus, to aim, Selenium Grid
    provides a Selenium Server that you can control using an instance of RemoteWebDriver.
    There are three ways to run Selenium Grid:


    # Standalone


    A single host acts as Selenium Server and supplies the browsers in this mode.
    It provides a simple way to run Selenium WebDriver tests in remote browsers.


    # Hub-nodes


    A potential problem of the standalone mode is the scalability (since the Selenium
    Server and the browsers are executed in the same home). Thus, the hub-nodes architecture
    defines two types of components to solve this issue. First, one host acts as hub
    (or Selenium Server). Then, one or most hosts are registered as nodes in the hub,
    providing browsers to be controlled by Selenium WebDriver. This architecture was
    introduced in Chapter 1 (see Figure 1-2).


    # Fully distributed


    The standalone and the hub-nodes approaches are centralized architectures that
    can degrade performance when the number of incoming requests increases. As of
    Selenium 4, Selenium Grid provides a fully distributed mode that implements load
    balancing mechanisms to solve this bottleneck.


    The following subsections provide more details about these modes and explain how
    to set up each approach.


    # Standalone


    The standalone is the simplest approach for a Selenium Grid infrastructure. We
    can execute this mode using the shell and Java code.


    # From the shell


    First, we can use the shell and the Selenium binary distribution to launch it.
    Selenium Grid is developed in Java, and each release is distributed as a self-contained
    JAR file with all its dependencies (also known as uber-JAR or fat-JAR). You can
    download-this fat-JAR from the Selenium download page.


    The Selenium Server automatically detects the drivers (e.g., chromedriver, geckriver,
    etc.) available in the system in the standalone mode. To that aim, it looks for
    these drivers in the PATH environment variable. As usual, we can manage these
    driver managers manually. Nevertheless, it is recommended to use WebDriverManager'
