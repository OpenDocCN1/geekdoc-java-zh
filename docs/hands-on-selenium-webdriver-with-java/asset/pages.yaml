  md: "The first wrapper class built on top of CDP is called NetworkInterceptor. This\
    \ class allows stubbing the backend requests, intercepting network traffic, and\
    \ returning pre-responses. This feature might help to simplify complex end-to-end\
    \ tests by mocking external calls with fast, straightforward responses. To instantiate\
    \ Network Interceptor, we need to specify parameters in its constructor (see Example\
