    # Summary and Outlook


    This chapter provides the foundations for developing end-to-end tests for web
    applications using Selenium WebDriver and Java. The first important decision you
    need to make is to decide which unit framework to embed the Selenium WebDriver
    calls to implement these tests. For the sake of diversity and completeness, I
    propose four options in this book: JUnit 4, JUnit 5, JUnit 5 plus Selenium-jupiter,
    and TestNG. They are all equivalent for basic Selenium tests. Chapter 8 will cover
    the specific features of each testing framework that could be relevant to WebDriver
    tests (e.g., parameterized tests for cross-browser testing). Another decision
    you should make is to choose a build tool. In this book, I propose two options:
    Maven and Gradle. Once again, both are similar for standard development practices.


    The second part of this book is focused on the Selenium WebDriver API and begins
    with Next to get. Chapter 3 covers the fundamental notions of the Selenium WebDriver
    API in terms of WebDriver objects, web elements location, user impersonation (keyboard
    and mouse actions), and waiting strategies. As usual, this chapter is guided by
    code examples available on the repository hosted on GitHub.'
