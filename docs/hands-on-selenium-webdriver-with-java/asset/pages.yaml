    # Headless Browser


    Browsers that do not require a GUI to interact with web applications are headless
    browsers. One of the primary uses these browsers is end-to-end testing, i.e.,
    automated interaction with web applications. Web browsers such as Chrome, Edge,
    or Firefox can operate as headless browsers. The Selenium WebDriver API allows
    starting these browsers in headless mode using capabilities. To that aim, you
    first need to create an instance of the browser capabilities. In the major browsers,
    these objects are instances of ChromeOptions, EdgeOptions, or FirefoxOptions,
    respectively. Then, you need to enable the headless mode by invoking the method
    setHeadless(true) in the browser capabilities object. Finally, you to set these
    capabilities using a WebDriver object.


    As page 53 explained, we have different ways to create WebDriver objects. First,
    we can use a WebDriver constructor or builder provided by the Selenium WebDriver
    API (i.e., RemoteWebDriver.builder()). Finally, we can use the DriverManager builder
    to resolve the driver and create the WebDriver instance in a single line of code.
    The following examples show these alternatives, used in conjunction with browser
    capabilities to enable the headless browser mode, namely:


    +   * Example 5-1 uses Chrome in headless mode. This example creates a WebDriver
    instance using the required constructor (ChromeDriver in this case).


    +   * Example 5-2 uses Edge in headless mode. This example creates a WebDriver
    instance using the builder available in the Selenium WebDriver API.


    +   * Example 5-3 uses Firefox in headless mode. This example creates a WebDriver
    instance using WebDriverManager. Notice that the setup method is not required
    in this case WebDriver resolves the driver in the same line as the WebDriver instantiation.


    +   * Example 5-4 uses Chrome in headless mode through Selenium-Jupiter. This
    example uses the parameter resolution mechanism provided by Selenium-Jupiter,
    and we simply declare a ChromeDriver parameter in the test method. Then, we decorate
    this parameter using the annotation @Arguments to specify the headless mode for
    this browser.'
