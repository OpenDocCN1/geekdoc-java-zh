    \n}\n```\n\n```\nrepositories {\n  maven {\n    url \"https://plugins.gradle.org/m2/\"\
    \n  }\n}\n```\n\n# Logging\n\nI use two logging libraries in the examples repository:\n\
    \nLogback\n\nThis is the actual logging framework (also called logger). Logback\
    \ is used by many relevant Java projects, such as Spring Framework and Groovy,\
