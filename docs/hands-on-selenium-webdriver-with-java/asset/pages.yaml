  md: '# Reporting


    A test report is a document that summarizes the results after executing a test
    suite. This document typically contains the number of tests executed their verdicts
    (pass, fail) and execution time. There are different ways to obtain a test report
    in our Java project. For example, when using Maven, we can create a basic test
    report using the following commands:


    ```

    mvn test

    mvn surefire-report:report-only

    mvn site -DGenerateReports=false

    ```


    +   We execute the test with Maven. The Maven Surefire plug-in generated a set
    of XML files in the target folder. These files contain the results of the test
    execution.


    +   We convert the XML reports into an HTML report. You can find this HTML report
    in your project folder target/site.


    +   We force a copy of the CSS and images required in the HTML report. Figure
    9-7 shows a screenshot of the report.


    ![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_333_0.png)


    Figure 9-7. Test report generated with Maven


    We can also generate an equivalent report using Gradle. After executing a test
    suite with this tool, Gradle automatically generates an HTML report in the folder'
