  md: '# Session Queue


    Node that stores the new session requests. These incoming sessions wait to be
    read by the Distributor.


    # Distributor


    Node aware of all nodes and their capabilities. It asks for new session requests
    to the Session Queue in regular intervals.


    # Event Bus


    Component that provides a message-oriented communication channel among several
    members of the Grid architecture. This communication is represented with dotted
    lines in Figures 6-4 and 6-5.


    # Session Map


    It keeps the relation of the WebDriver sessions and the nodes where the sessions
    are being executed.


    # Node(s)


    Hosts that provide web browsers (and their corresponding drivers) for automation
    based on Selenium WebDriver.


    > In a hub-nodes architecture, the hub aggregates the responsibilities of the
    Router, Session Queue, Distributor, Event Bus, and Session Map of the fully distributed
    mode.


    ![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_230_0.png)


    The following subsections provide details about the most relevant processes in
    a fully distributed Selenium Grid: node registration, new session, and other WebDriver
    commands.


    # Node registration


    The first process required to operate a distributed Selenium Grid is registering
    one or more nodes. To that aim, nodes need to register their capabilities in the
    Distributor. Figure 6-4 illustrates this process, composed of three steps:


    +   1. A node sends a message through the Event Bus to announce its capabilities.

    2. This message reaches the Distributor, which stores the relationship between
    nodes and capabilities.

    3. The Distributor double-checks that the node exists by exchanging HTTP messages
    (solid line) with the source node.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_231_0.png)


    # New session


    At some point, a script (typically a test case) will try to start a new session
    to drive a browser automatically. Figure 6-5 describes the communication required
    to carry out this process in a fully distributed Selenium Grid, namely:


    +   1. A script/test using the Selenium WebDriver API sends a request to the Router
    to create a new session (i.e., to draw a browser programmatically).

    2. The Distributor creates a new entry in the Session Queue to store this new
    session request.

    3. The Distributor asks the Session Queue for incoming new session requests in
    intervals.

    4. Once the Distributor discovers a new session request, it checks if a node can
    support this session. If the session is possible (i.e., a node previously registered
    in the Distributor offers the required capabilities), the Distributor creates
    a new session with the node.

    5. The Distributor sends an HTTP message to the Session Map to store the new session.
    The Session Map stores a unique session identifier (session id) that universally
    associates the node executing the browser session.'
