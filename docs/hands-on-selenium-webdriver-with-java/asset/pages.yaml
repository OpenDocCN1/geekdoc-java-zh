    \ tests are injected in the test methods. For this reason, we need to create the\
    \ driver instance in the test logic.\n\n# Selenium-Jupiter\n\nSelenium-Jupiter\
    \ provides a complementary feature for creating cross-browser tests, called test\
    \ templates. Templates are a special kind of parameterized test supported by Jupiter\
    \ in an extension collects the parameters. Selenium-Jupiter uses this feature\
    \ to provide a comprehensive way to specify different browser aspects (such as\
    \ type, version, arguments, and capabilities) using a custom JSON notation called\
    \ a browser scenario in Selenium-Jupiter jargon. You can find more details about\
    \ this feature in the Selenium-Jupiter documentation.\n\nExample 8-8 shows a sample\
    \ browser scenario. This JSON is stored in a file called browsers.json, the default\
    \ name used by a template test. Example 8-9 shows a template using this browser\
    \ scenario.\n\nExample 8-8. Browser scenario for a test template in Selenium-Jupiter\n\
    \n```\n{\n  \"browsers\": [\n    {\n      \"type\": \"chrome\"\n    },\n    [\n\
    \      {\n        \"type\": \"edge\"\n        \"arguments\" : [\n          \"\
    --headless\"\n        ]\n    ]\n  }]\n```"
