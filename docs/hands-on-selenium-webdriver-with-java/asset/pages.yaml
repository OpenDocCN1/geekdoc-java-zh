    # Event Listeners


    Selenium WebDriver API allows creating listeners that notify events happening
    in WebDriver and derived objects. In former versions of Selenium WebDriver, this
    feature was accessible through the class EventFiringWebDriver. This class is deprecated
    as Selenium WebDriver 4, and instead, we should use the following:


    EventFiringDecorator Wrapper for WebDriver and derived objects (e.g., WebElement,
    TargetLocation, etc.). It allows registering one or more listeners (i.e., WebDriverListener
    instances).


    WebDriverListener Interface that should implement the listeners registered in
    the decorator. It supports three types of events:


    +   Before events

    - Logic inserted before some event starts

    After events

    - Logic inserted just after some event terminates

    Error events

    - Logic inserted before an exception is thrown


    To implement an event listener, first, we should create a listener class. In other
    words, we need to create a class that implements the WebDriverListener. This interface
    defines all its methods using the default keyword, and therefore, it is optional
    to override their methods. To thanks that the feature (available as Java 8), our
    class should only implement the method we need. There are plenty of listener methods
    available, for instance, afterGet() (executed after calling the get() method in
    a WebDriver instance), or beforeQuit() (executed before calling the quit() method
    in a WebDriver instance), to name a few. My recommendation for checking all these
    listeners is to use your favorite IDE to discover the possible methods to override/implemented.
    Figure 4-12 shows'
