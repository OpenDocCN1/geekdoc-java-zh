  md: '# WebElement Methods


    Table 3-3 contains a summary of the available methods in the WebElement class.
    You will find examples of each method in the following parts of this section.


    Table 3-3. WebElement methods


    | Method | Return | Description |

    | --- | --- | --- |

    | click() | void | Perform a mouse click (i.e., a left-click) in the current element.
    |

    | submit() | void | Send a web form (when the current element is a form). |

    | sendKeys(CharSequence... keys) | void | Simulate typing with the keyboard (e.g.,
    in input text elements). |

    | clear() | void | Reset the value of an input text element. |

    | getTagName() | String | Get the tag name of the element. |

    | getDomProperty(String name) | String | Get the value of a DOM property. |

    | getDomAttribute(String name) | String | Get the value of the element attribute
    as declared in its HTML markup. |

    | getAttribute(String name) | String | Get the value of the HTML attribute (e.g.,
    class) as a String. More precisely, this method attempts to get a meaningful value
    of the DOM property with the name if it exists. For instance, for attributes (e.g.,
    readonly), it returns true if it exists or null if not. |

    | getAriaRole() | String | Get element role as defined on the W3C WAI-ARIA specification.
    |

    | getAccessibleName() | String | Get accessible name as defined by WAI-ARIA. |

    | isSelected() | boolean | Determine if a checkbox, in one select, or radio button
    is selected. |

    | isEnabled() | boolean | Determine if an element is enabled or not (e.g., a form
    field). |

    | isDisplayed() | boolean | Determine if an element is visible or not. |

    | getText() | String | Get the visible text of the element, including its (if
    any). |

    | getLocation() | Point | Get the position (x and y coordinates) from the top-left
    corner of the rendered element. |

    | getSize() | Dimension | Get the width and height of the rendered element. |

    | getRect() | Rectangle | Get the location and size of the rendered element. |

    | getCssValue(String propName) | String | Get the value of a CSS property of the
    element. |

    | getShadowRoot() | SearchContext | Get the shadow root to search in a shadow
    tree (see "The Shadow DOM" on page 118). |'
