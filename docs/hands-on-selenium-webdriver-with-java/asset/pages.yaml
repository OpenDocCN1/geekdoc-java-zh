  md: 'getInstance(DriverManagerType driverManagerType)

    Where driverManagerType is an enumeration provided by DriverManager to identify
    the available managers. The possible values of this enumeration are CHROME, FIREFOX,
    EDGE, OPERA, CHROMIUM, IEXPLORER, and SAFARI.


    getInstance(String browserName)

    Where browserName is the browser name as case-insensitive string. The possible
    values are Chrome, Firefox, Edge, Opera, Chromium, IExplorer, and Safari.


    getInstance()

    When no parameter is specified, the configuration wdm.defaultBrowser is used to
    select the manager (Chrome by default).


    # Advanced Configuration


    DriverManager provides different ways of configuration. First, you can use its
    Java API through each manager. This API allows concatenating several methods to
    specify custom options or preferences. You can find the complete description of
    the DriverManager API in its documentation. For example, the following command
    shows how to set up a proxy for the network connection:


    ```

    WebDriverManager.chromedriver().proxy("server:port").setup();

    ```


    The second way to configure DriverManager is using Java system properties. Each
    DriverManager API method cachePath() (used to specify the driver cache folder)
    works the same way as the configuration key wdm.cachePath. These types of configuration
    keys can be passed, for example, using the command line:


    ```

    mvn test -Dwm.cachePath=/custom/path/to/driver/cache

    ```


    Finally, you can use environment variables to configure DriverManager. The variable
    names derive from each configuration key (e.g., wdm.cachePath), converting them
    to uppercase and replacing the symbol . with _ (e., WDM_CACHEPATH). This mechanism
    can be convenient for configuring global parameters at the operating system level.'
