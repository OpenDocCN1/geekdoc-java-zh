    # Security


    A relevant organization in the software domain is OWASP (Open Web Application
    Project), a nonprofit foundation that promotes open solutions to improve software
    security. One of the most popular OWASP projects is the Zed Attack Project (ZAP).
    OWASP ZAP is an open web application scanner used to implement vulnerability assessment
    (i.e., look for security issues) or penetration testing (i.e., a simulated cyberattack)
    to find exploitable vulnerabilities.


    We can use OWASP ZAP as a standalone desktop application. Figure 9-4 shows a screenshot
    of it.


    ![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_324_0.png)


