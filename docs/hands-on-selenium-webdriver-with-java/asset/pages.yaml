  md: '# Device Emulation


    Major web browsers use development tools (i.e., DevTools in Chromium-based browsers
    and Developer Tools in Firefox) to simulate mobile devices in these ways:


    Simulating a mobile viewport


    To reduce visible area of a web page using the width and height of a given mobile
    device


    Throttling the network


    To slow the connectivity speed to simulate mobile networks (e.g., 3G)


    Throttling the CPU


    To slow processing performance


    Simulating geolocation


    To set custom Global Positioning System (GPS) coordinates


    Setting orientation


    To rotate the screen


    Figure 5-2 shows a screenshot of Chrome using mobile emulation through DevTools.


    ![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_174_0.png)


    Figure 5-2. Mobile emulation in Chrome using DevTools'
