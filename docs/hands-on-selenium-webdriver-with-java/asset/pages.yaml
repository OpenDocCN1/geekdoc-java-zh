  md: 'page can be displayed. An iframe is another HTML element that allows embedding
    an HTML page into the current one.


    Using frames is not encouraged since these elements have many drawbacks, such
    as performance and accessibility problems. I explain how to use them through Selenium
    WebDriver for compatibility reasons. Nevertheless, I strongly recommend avoiding
    frames on new-brand web applications.


    The Selenium WebDriver API provides the interface TargetLocator to deal with the
    previously mentioned targets (i.e., tabs, windows, and iframes). This interface
    allows changing the focus of the future commands of a webdriver object (to a new
    tab, windows, etc.). This interface is accessible by invoking the method switchTo()
    in a WebDriver object. Table 4-8 describes its public methods.


    Table 4-8. TargetLocator methods


    | Method | Return | Description |

    |---|---|---|

    | frame(int index) | WebDriver | Change focus to a frame (or iframe) by index
    number. |

    | frame(String nameId) | WebDriver | Change focus to a frame (or iframe) by name
    or id. |

    | frame(WebElement frameElement) | WebDriver | Change focus to a frame (or iframe)
    previously located as a WebElement. |

    | parentFrame() | WebDriver | Change focus to the parent context. |

    | window(String nameHandle) | WebDriver | Switch the focus to another window,
    by name or handle. A handle is a hexadecimal string that uniquely identifies a
    window or tab. |

    | newWindow(WindowType type) | WebDriver | Creates a new browser window (using
    WindowType.WINDOW) or tab (WindowType.TAB) and switches the focus to it. |

    | defaultContent() | WebDriver | Select the main document (when using iframes)
    or the first frame on the page (when using frames). |

    | activeElement() | WebElement | Get the current element selected. |

    | alert() | Alert | Change focus to a window alert (see Dialog Boxes on page 133
    for further details). |


