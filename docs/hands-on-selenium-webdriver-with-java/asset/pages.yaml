  md: 'Object... args Optional arguments script must be one of the following types:
    number, boolean, string, WebElement, or a List of these types (otherwise, WebDriver
    throws an exception). These arguments are available in the injected script using
    the arguments built-in JavaScript variable.


    When the script returns some value (i.e., the code contains a return statement),
    the Selenium WebDriver executeScript() method also returns a value in Java (otherwise,
    executeScript() returns null). The possible returned types are:


    +   - WebElement When returning an HTML element

    - Double For decimals

    - Long For nondecimall

    - Boolean For boolean values

    - List<Object> For arrays

    - Map<String, Object> For key-value collections

    - String For all other cases


    The situations that require executing JavaScript with Selenium WebDriver are very
    heterogeneous. The following subsections review two cases where the Selenium WebDriver
    does not provide built-in features, and instead, we need to use JavaScript to
    automate them: scrolling a web page and handling a color picker in a web form.


    As explained in Chapter 3, Selenium WebDriver allows impersonating different mouse
    actions, including click, right-click, or double-click, among others. Nevertheless,
    scrolling down or a web page is not possible using the Selenium WebDriver API.
    Instead, we can achieve this automation easily by executing a simple JavaScript
    line. Example 4-1 shows a basic example using a practice web page (see the URL
    of this page in the first line of the test method).'
