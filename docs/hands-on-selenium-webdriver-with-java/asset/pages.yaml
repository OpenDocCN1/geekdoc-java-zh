  md: '# Table 3-11. Actions methods


    | Method | Description |

    | --- | --- |

    | keyDown(CharSequence key) keyDown(WebElement target, CharSequence key) | Send
    a single key (it could be a special character using the class Keys) in the current
    position (or a given element). The key remains pressed until calling keyUp().
    |

    | keyUp(CharSequence key) keyUp(WebElement target, CharSequence key) | Release
    a previously pressed with keyDown(). |

    | sendKeys(CharSequence... keys) sendKeys(WebElement target, CharSequence... keys)
    | Send a key sequence in the current position (or a given element). This method
    is different from WebElement#sendKeys(CharSequence... in two ways: 1) Modifier
    keys (e.g., KEYS. CONTROL, KEYS. SHIFT) are not released explicitly. 2) There
    is no focus on the element, so TAB should work. |

    | clickAndHold() clickAndHold(WebElement target) | Click without releasing the
    current position (or the middle of a given element). |

    | release() release(WebElement target) | Release the left mouse button previously
    pressed with clickAndHold(). |

    | click() click(WebElement target) | Click on the current position (or a given
    element). |

    | doubleClick() doubleClick(WebElement target) | Double-click on the current position
    (or element). |

    | contextClick() contextClick(WebElement target) | Right-click on the current
    position (or element). |

    | moveToElement(WebElement target) moveToElement(WebElement target, int xoffset,
    int yoffset) | Move mouse cursor to the middle (shifted to a given offset) of
    a given element. |

    | moveToOffset(int xoffset, int yoffset) | Move the mouse from its current position
    (0, 0 by default) by given offset. |

    | dragAndDrop(WebElement source, WebElement target) dragAndDrop(WebElement source,
    int xoffset, int yoffset) dragAndDrop(WebElement source, int xoffset, int yoffset)
    | This action consists of three steps: 1) Click and hold at the middle (shifted
    by a given offset) of the source element location. 2) Move the mouse to the target
    element location. 3) Release the mouse click. |

    | pause(long pause) pause(Duration duration) | Perform a pause in the actions
    chain (in milliseconds or using a Java Duration). |

    | build() | Generate a composite action containing all previous actions. |

    | perform() | Execute the composite action. |'
