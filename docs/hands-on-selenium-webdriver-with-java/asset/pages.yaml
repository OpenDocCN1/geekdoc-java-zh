    \ locator matches a <form> element plus four <div class=\"row\"> available on\
    \ the page.\n\n#  Relative Locators\n\n WebDriver version 4 incorporates a new\
    \ way to find elements in a web page: relative locators. These new locators aim\
    \ to find web elements relative to another known element. This feature is based\
    \ on the CSS box model. The model determines that each element of a web document\
    \ is rendered using a rectangular box.\nFigure 3-6 shows an example of this box\
    \ model for a given web element in the practice.\n\n![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_97_0.png)\n\
    \nFigure 3-6 showing the box model of a web element\n\nUsing this model, the relative\
    \ locators available in the Selenium WebDriver API allowing elements to relate\
    \ to the position of another web element. To this aim, we need to locate that\
    \ web element using the standard locator strategies (e.g., by id, name, attribute,\
    \ etc.). Then, we need to specify the locator type obtained by proximity to the\
    \ original web element using the static method with the class RelativeLocator.\
    \ As a result, we get a RelativeBy object, which extends the abstract class By,\
    \ using in the standard locator strategies. RelativeBy object provides the following\
    \ methods to carry out relative location:\n\n76 | Chapter 3: WebDriver Fundamentals"
