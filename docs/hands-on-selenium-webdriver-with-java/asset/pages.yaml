    # **Using browsers to generate the load**


    Tools like JMeter is convenient for many performance testing scenarios for web
    applications. Nevertheless, this approach is unsuitable when you need actual browsers
    to recreate the complete workflow (e.g., in videoconferencing web apps). In that
    case, a possible solution is to use WebDriver in conjunction with Docker. Example
    9-6 demonstrates this. As you can see in this test, DriverManager allows creating
    a list of WebDriver instances simply by specifying the size as a parameter in
    the create() method. Then, for example, we can use standard Java to exercise the
    web application under test in parallel using a thread pool.


    Nonfunctional Testing | 301'
