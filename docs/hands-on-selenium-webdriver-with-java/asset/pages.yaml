  md: 'Utilizing design pattern like POM can help reduce code duplication and enhance
    maintainability issues. Moreover, we can use POM for including reusable robust
    locating and waiting strategies. The following section describes how to carry
    out the POM design pattern.


    The POM design pattern itself is not strictly a solution for test flakiness. However,
    as explained in the following sections, it enables the encapsulation of reusable
    code that prevents test unreliability.


    ![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_253_0.png)


    # The POM Design Pattern


    The principle of the POM design pattern is to separate the logic for handling
    UI elements in separate classes (page classes) from the test logic. In our words,
    we model the appearance and behavior of our SUT following an object-oriented paradigm,
    i.e., as page objects. These page objects are used by Selenium WebDriver tests.


    Let''s look at a simple example to illustrate POM. Consider Figure 7-1, which
    contains a login form. As usual, this page is contained on the practice site.
    Example 7-1 shows a test case using vanilla Selenium WebDriver. In programming,
    we use the term "vanilla" to refer to technology without customization from the
    original form. In this case, we use the standard Selenium WebDriver API, explained
    in Part II of this book.


    ![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_253_1.png)


    Figure 7-1. Practice web page with a login form'
