    \ transitively in the composed of Maven/Gradle project).\n\n+   * We implement\
    \ the actions chain composed of the following steps:\n  1. Send the char sequence\
    \ hello to the input text.\n  2. Press the key modifier (Ctrl or Cmd, depending\
    \ on the operating system). Remember that this remains pressed until we explicitly\
    \ release it.\n  3. Send the key a to the input text. Since the modifier is active,\
    \ the resulting combination is Ctrl + A (or Cmd + A), and as a result, the text\
    \ present in the input is selected.\n  4. Send the key c to the input text. Again,\
    \ since the modifier is active, the combination is Ctrl + C (or Cmd + C), and\
    \ the input text is copied to the clipboard.\n  5. Send the key v to the text\
    \ area. This means sending Ctrl + V (or Cmd + V), and the clipboard content is\
    \ pasted to the text area.\n\n+   * We assert the content of both elements (input\
    \ text and text area) is the same at the end of the text."
