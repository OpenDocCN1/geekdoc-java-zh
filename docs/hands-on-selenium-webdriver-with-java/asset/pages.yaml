    # Screenshots


    Selenium WebDriver is used mainly to carry out end-to-end functional testing of
    web applications. In other words, we use it to verify that web applications behave
    as expected by interacting with their user interface (i.e., using a web browser).
    This approach is very convenient to automate high-level user scenarios, but it
    also presents different difficulties. One of the main challenges in end-to-end
    testing is to diagnose the underlying cause of a failed test. Supposing the failure
    is legitimate (i.e., not induced by a proxy implemented test), the root cause
    might be diverse: the client side (e.g., incorrect JavaScript logic), the server
    side (e.g., internal exception), or the integration with other components (e.g.,
    inadequate access to the database), or other reasons. One of the most pervasive
    mechanisms used in Selenium WebDriver for failure analysis is making browser screenshots.
    This section presents the mechanisms provided by the Selenium WebDriver API.


    ![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_133_0.png)


    > on page 265 reviews the framework-specific techniques to determine when a test
    has failed to carry out failure analysis techniques, as screenshots, records,
    and log gathering.


    Selenium WebDriver provides the interface TakeScreenshot for making browser screenshots.
    Any driver inheriting from RemoteWebDriver (see Figure 2-2) also implements this
    interface. Thus, we can use a WebDriver object that instantiates one of the major
    browsers (e.g., ChromeDriver, FirefoxDriver, etc.) as follows:


    ```

    WebDriver driver = new ChromeDriver();

    TakeScreenshot ts = (TakeScreenshot) driver;

    ```'
