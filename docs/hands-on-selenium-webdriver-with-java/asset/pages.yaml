  md: '# Selenium IDE


    Selenium IDE is the last core component of the Selenium suite. Shinya Kasatani
    created this in 2006. Selenium IDE is a tool that implements the so-called Record
    and Playback (R&P) automation technique. As the name suggests, this technique
    has two steps. First, in Selenium IDE, the *record* part captures user interactions
    with a browser. Second, we use the generated Selenium script to execute browser
    session automatically (playback).


    This early version of Selenium IDE was a Firefox plugin that had embedded Selenium
    Core to record, edit, and play back Selenium scripts. These early versions were
    XPI modules (in, 2017), a technology used to create extensions. As of version
    55 (released in 2017), Firefox migrated support for add-ons to the W3C Browser
    Extension specification. As result, Selenium IDE was discontinued, and for some
    time, it has not been possible to use it. The Selenium team rewrote Selenium IDE
    following the Browser Extensions recommendation to solve this problem. Thanks
    to this, we can now use Selenium IDE in multiple browsers, such as Chrome, Edge,
    and Firefox.


    Figure 1-3 shows the new Selenium IDE GUI (Graphical User Interface).


    Using this GUI, users can record interactions with a browser and edit and execute
    the generated script. Selenium IDE encodes each interaction in different parts:
    a command (i.e., the action executed in the browser), a target (i.e., the locator
    of the web element), and a value (i.e., the data handled). Optionally, we can
    include a description of the command. Figure 1-3 shows a recorded example of these
    steps:


    +   1. Open website (https://bonigarcia.dev/selenium-webdriver-java). We will
    use this website as the practice site in the rest of the book.


    +   2. Click on the link with the text "GitHub". As a result, the navigation moves
    to the examples repository source code.


    +   3. Assert that the book title *(Hands-On WebDriver with Java)* is present
    on the web page.


    +   4. Close the browser.'
