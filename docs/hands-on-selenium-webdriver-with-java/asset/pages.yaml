    # # Cookies


    HTTP 1.x is a stateless protocol, meaning that the server does not track the user
    state. In other words, web servers do not remember users across different requests.
    The cookies mechanism is an extension to HTTP that allows tracking users by sending
    small pieces of text cookies from server to client. These cookies must be sent
    back by clients, and this way, servers remember their clients. Cookies allow you
    to maintain web sessions or personalize the user experience on the website, among
    other functions.


    Web browsers allow managing the browser cookies manually. Selenium WebDriver enables
    an equivalent manipulation, but programmatically. The Selenium WebDriver API provides
    the methods shown in Table 4-5 to accomplish this. They are accessible through
    the manage() function of the WebDriver object.'
