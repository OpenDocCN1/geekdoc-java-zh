  md: '# CHAPTER 7


    # The Page Object Model (POM)


    A design pattern is a reusable solution to a recurring problem in software engineering.
    This chapter presents the Page Object Model (POM), a popular design pattern used
    to develop Selenium WebDriver tests. The use of POM has different benefits, such
    as improving reusability and avoiding code duplication. POM is based on creating
    page classes for modeling the SUT in a single repository, which is later used
    from the test logic.


    # Motivation


    Some of the biggest challenges of developing end-to-end tests with Selenium-Driver
    are maintainability and flakiness. Regarding the former, the problem might happen
    during the development or evolution of the SUT. The changes made in the UI can
    cause existing end-to-end tests to break. The maintenance costs for fixing these
    tests can be relevant when having a large test suite in which code duplication
    exists in several tests cases (e.g., when the same locators are used repeatedly
    in different tests).


    Concerning flakiness (i.e., lack of reliability), a test is flaky when it has
    inconsistent behavior, i.e. it passes and fails periodically under the same conditions
    (test logic, input data, setup, etc.). First, the root of the problem might be
    the SUT. For instance, a bug in the server-side logic (e.g., a race condition)
    can cause erratic behavior in end-to-end tests. In this case, developers and testers
    should work together to detect and solve the problem, typically fixing server-side
    bugs. This is an undesirable situation that testers should avoid. There are different
    strategies to prevent flakiness in Selenium WebDriver tests, such as implementing
    a robust locator strategy (to avoid brittle tests due to responsiveness or viewport
    changes) or using a waiting strategy (to handle the distributed and asynchronous
    nature of web applications, as explained in "Waiting Strategies" on page 94).'
