  md: '# Appium


    Appium is an open source test automation framework for mobile apps. Appium provides
    a cross-platform API that allows testing native, hybrid, and mobile web apps for
    iOS and Android on virtual or real devices. Furthermore, Appium enables automated
    testing for desktop applications on Windows and macOS.


    The story of Appium started in 2011 when Dan Cuellar created an automation tool
    for iOS applications developed in C# called SeleniumAuto. The new team Jason Higgins
    (the co-creator of Selenium) joined the SeleniumConf 2012 in London. Jason contributed
    to the project by adding a web server and using the WebDriver protocol over HTTP,
    making iOSAuto compatible with any Selenium WebDriver client. They changed the
    project name to Appium In January 2013, Sauce Labs began to support Appium and
    provide more developer power. The new team rewrote Appium using Node.js since
    it is a well-known, efficient framework for the server side.


    As depicted in Figure 10-1, Appium follows a client-server architecture. Appium
    is a web server that exposes a REST API that carries an automated session on mobile
    or desktop apps. To that, the Appium server receives requests from clients, executes
    those on target devices/apps, and responds with an HTTP response representing
    the command execution result. Appium client libraries communicate with the Appium
    server using the Mobile JSON Wire Protocol (an official draft extension to the
    Original WebDriver protocol). The Appium server and its client also use the W3C
    WebDriver specification. There are different Appium client libraries. Table 10-1
    summarizes these libraries, both officially maintained by the Appium project and
    community.


    ![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_348_0.png)


    Figure 10-1. Appium architecture'
