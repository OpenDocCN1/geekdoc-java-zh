    # Compound Locators


    The Selenium WebDriver API has several support classes that enable the composition
    of the different locator types we have seen. These classes are:


    +   **ByIdOrName(String idOrName)**

    It seeks by id, and if that is not available, it seeks by name.


    +   **ByChained(By...)**

    It seeks elements in a sequence (i.e., the second one should appear inside the
    first one, and so on).


    +   **ByAll(By...)**

    It seeks elements that match a number of location strategies (following an and
    logic condition for these locators).


    Example 3-13 shows a test usingByIdOrName. This test looks for the following-select
    field available in the practice web form. Notice that this field specifies the
    attribute name (but not id).


    ```

    <input class="form-control" type="file" name="my-file">

    ```'
