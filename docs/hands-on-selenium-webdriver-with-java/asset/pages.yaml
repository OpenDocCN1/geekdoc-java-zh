  md: 'There are different flavors of functional testing. Example:


    UI testing (known GUI testing when the UI is graphical)


    Evaluates if the visual elements of an application meet the expected functionality.
    Note that UI testing is different from the system and end-to-end testing levels
    since the former tests the interface itself, and the latter evaluates the whole
