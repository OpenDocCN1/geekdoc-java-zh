  md: "In this case, Selenium WebDriver API sends W3C WebDriver messages to a server-side\
    \ component usually called Selenium Server. This server acts as a proxy of the\
    \ client requests to other hosts that provide web browsers where the automation\
    \ happens. This remote architecture eases cross-browser testing (i.e., verifying\
    \ web applications in multiple browser types, or operating systems) and parallel\
    \ test execution.\n\n# ## Creation of RemoteWebDriver Objects\n\nThe Selenium\
    \ WebDriver API provides the class RemoteWebDriver to control remote browsers.\
    \ As shown in Figure-2-2, this class is the parent of the WebDriver classes that\
    \ drive local browsers (i.e., ChromeDriver, FirefoxDriver, etc.). This way, you\
    \ can use RemoteWebDriver objects in the same way we have previously studied in\
    \ this book.\n\n# ## RemoteWebDriver Constructor\n\nThere are different ways to\
    \ instantiate a RemoteWebDriver object. The most common way is to invoke its constructor\
    \ by passing two arguments: the URL of the Selenium Server and the required capabilities.\
    \ As shown in Figure 5-1, these capabilities object inherit from the Capabilities\
    \ interface (e.g., ChromeOptions, Firefox Options, etc.). Example 6-1 shows a\
    \ test setup. You can find the complete text in this book’s code repository.\n\
