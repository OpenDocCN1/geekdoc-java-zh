  md: '# Nonfunctional Testing


    As explained in Chapter 1, Selenium WebDriver is primarily used to assess the
    functional requirements of web applications. In other words, testers use the Selenium
    WebDriver API to verify that a web application under test behaves as expected.
    Nevertheless, we can leverage this API to test nonfunctional requirements, i.e.,
    attributes such as performance, security, accessibility, etc. A common strategy
    to accomplish this goal is to integrate with specific third-party utilities. The
    following subsections explain different integrations with Selenium WebDriver for
    nonfunctional testing.


    # Performance


    Performance testing evaluates the responsiveness and stability of a S under a
    particular workload. Instead of Selenium WebDriver, testers usually adopt specific
    tools like Apache JMeter for performance testing. Apache JMeter is an open source
    tool that allows sending multiple HTTP requests to a given URL endpoint while
    measuring the response time and other metrics. Although the direct integration
    between Selenium WebDriver and Apache JMeter is not trivial, we can leverage an
    existing Selenium WebDriver test as a JMeter test plan (i.e., the steps that JMeter
    executes). The benefit of this approach is that the JMeter test plan will mimic
    the same user workflow in the Selenium WebDriver test, reusing the same HTTP traffic
    browser caches (e.g., for JavaScript libraries, CSS, etc.). To that aim, I propose
    the following procedure:


    +   1. Use BrowserMob proxy (in the previous section) to capture the exchanged
    network traffic in Selenium WebDriver as a HAR file.

    2. Convert the resulting HAR file to a JMeter test plan. Test plans in JMeter
    are stored as XML-based files with the extension JMX.

    3. Load the JMX test plan in JMeter and tune it for simulating concurrent users
    and including result listeners

    4. Run the test plan and evaluate the results.


    Example 9-5 shows a complete test case that implements the first step. As you
    can see, the required login to start and create the HAR file is done before and
    after each test. You can use this approach to leverage existing functional tests
    (i.e., the logic in the @Test methods) as performance tests (to be executed in
    JMeter).'
