  md: '# Verification and Validation


    The down levels of the test stack we have seen (unit, integration, and end-to-end
    testing) belong to development testing. Development testing is a process carried
    out by the team that produces the software system (i.e., developers, testers,
    etc.) during the construction phase of the software development lifecycle. Development
    testing is a type of verification since we assess that the software meets its
    functional and nonfunctional requirements (i.e., its specification). Using the
    classical definition by Barry Boehm in 1984, validation answering the question:
    "Are we building the right product?


    The top level of the test stack represented in Figure 1-5 (i.e., acceptance testing)
    belongs to user expectation since it involves the final user in the testing process.
    Acceptance testing is a type of validation whose objective is to prove the software
    system meets end-user expectations. Validation is a more general process than
    verification since the system specification does not always reflect the user''s
    real wishes or needs. Thus, according to Boehm, validation answering the question
    "Are we building the right product?


    # Types of Testing


    Depending on the strategy for designing test cases, we can implement different
    types of tests. The two principal types of tests are:


    Functional testing (also known as behavioral or closed-box testing)


    Evaluates the compliance of a piece of software with the expected behavior (i.e.,
    its functional requirements).


    Structural testing (also known as clear-box testing)


    Determines if the program-code structure is faulty. To that aim, testers should
    know the internal logic of a piece of software.


    The difference between these testing types is that functional tests are responsibility-based,
    while structural tests are implementation-based. Both types can be performed at
    any test level (unit, integration, system, end-to-end, or acceptance). Nevertheless,
    structural tests are commonly done at the unit or integration level since these
    levels enable more direct control of the code execution flow.


    ![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_40_0.png)


    Black-box and white-box testing are also names for functional and structural testing,
    respectively. Nevertheless, these designations are not recommended since the tech
    industry is trying to adopt more inclusive terms and use neutral terminology instead
    of potentially harmful language.'
