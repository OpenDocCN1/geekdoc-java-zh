    \n# Asynchronous Scripts\n\nThe method executeAsyncScript() of the JavaScriptExecutor\
    \ interface allows executing JavaScript scripts in the context of a web page using\
    \ Selenium WebDriver. In the way that executeScript() explained previously, executeAsyncScript()\
    \ executes an anonymous function with the provided JavaScript code in the body\
    \ of the current page. The execution of this function blocks the Selenium WebDriver\
    \ control flow. The difference is in executeAsyncScript(), we must explicitly\
    \ signal the script termination by invoking a done callback. This callback is\
    \ injected into the executed script as the last argument (i.e., arguments[arguments.length\
    \ - 1]) in the corresponding anonymous function. Example 4-6 shows a test using\
    \ this mechanism.\n\nExample 4-6. Testing asynchronous JavaScript\n\n```\n@Test\n\
    void testAsyncScript() {\n    driver.get(\"https://bonigararcia.dev/selenium-webdriver-driver/\"\
    );\n    JavascriptExecutor js = (JavascriptExecutor) driver;\n\n    Duration pause\
    \ = Duration.ofSeconds(2);\n    String script = \"const callback = \" + arguments[arguments.length\
    \ - 1] + \\ \n    \" + \"setTimeout(callback, \" + pause.toMillis() + \");\";\n\
    \n    long initMillis = System.currentTimeMillis();\n    js.executeAsyncScript(script);\n\
    \    Duration elapsed = Duration.ofMillis(System.currentTimeMillis() - initMillis);\n\
    }\n```"
