    provide collaborative code repository hosting services for developing, sharing,
    and maintaining software.


    Developers synchronize a local repository (or simply, repo) copy in their local
    environments. Then, they do the coding using that local copy, committing changes
    to the remote repository (typically daily). The basic idea of CI is that every
    commit triggers the build and test of the software with the new changes. The test
    suite executed to ensure that a patch does not break the build is called a regression
    test. A regression suite can contain tests of different types, including unit,
    integration, end-to-end, and etc.


    When the number of tests is too large for regression testing, we typically choose
    only part of the relevant tests from the whole suite. There are different strategies
    to select these tests, for smoke testing (i.e., tests that ensure the critical
    functionality) or sanity testing (i.e., tests that evaluate the basic functionality).
    Lastly, we can execute the complete suite as a scheduled task (typically nightly).


