  md: '# Behavior Driven Development


    As introduced in Chapter 1, Behavior Driven Development (BDD) is a software methodology
    that promotes the development and testing of software systems using high-level
    user scenarios. Different tools implement the BDD methodology. One of the most
    popular is Cucumber. Cucumber executes tests based on user stories in Gherkin,
    a human-readable notation based on natural languages (e.g., English and others).
    Gherkin was designed to be used by nonprogrammers (e.g., customers or end users),
    and its main keywords are listed next (see the Gherkin user manual for further
    information):


    Feature


    High-level description of the software feature tested.


    Scenario


    Concrete test that illustrates a business rule. Scenarios describe different pieces
    of information (called steps in the Gherkin jargon), such as:


    Given


    Preconditions and initial state


    When


    User actions


    And


    Additional user actions


    Then


    Expected outcome


    Example 9-13 shows a Gherkin feature containing two scenarios for a test login
    (successful and failed).


    Example 9-13. Gherkin scenarios for login into the practice site


    Feature: Login in practice site ①


    ```

    Scenario: Successful login ②

    Given I use "Chrome" ③

    When I navigate to

    "https://bonigarcia.dev/selenium-webdriver-java/login-form.html" ④

    And I log in with username "user" and password "user" ⑤

    And I click Submit

    Then I should show the message "Login successful" ⑥


    Scenario: Failure login ⑦

    Given I use "Chrome"

    When I navigate to

    ```'
