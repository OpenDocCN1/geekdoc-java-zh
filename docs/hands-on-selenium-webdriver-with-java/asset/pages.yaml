    \ JUnit 4 rule for retrying failed tests\n\n```\npublic class RetryRule implements\
    \ TestRule {\n    static final Logger log = getLogger(lookup().lookupClass());\n\
    \    int maxRetries;\n    public RetryRule(int maxRetries) {\n        this.maxRetries\
    \ = maxRetries;\n    }\n    @Override\n    public Statement apply(Statement base,\
