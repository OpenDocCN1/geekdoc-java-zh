    \ explain the alternatives for executing browsers in Docker containers.\n\n# Docker\
    \ Images for Selenium Grid\n\nAn official subproject of the Selenium suite is\
    \ docker-selenium. This project includes Docker Images for the Selenium Grid components\
    \ (i.e., standalone, hub, nodes, router, distributor, session queue, etc.) and\
    \ web browsers (Chrome, Firefox, and Edge). These Docker Images are open source\
    \ and released on Docker Hub. A simple way to use these images is to start them\
    \ with the shell (with the docker command) and use an instance of RemoteWebDriver\
    \ to drive docker browsers. The following subsections explain how.\n\nThe commands\
    \ and tests presented in this section support Docker is available in your system.\
    \ In other words, you need to have installed a Docker image in your machine to\
    \ execute these examples properly.\n\n![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_241_0.png)\n\
    \n# Standalone\n\nWe can find Selenium images for standalone browsers (Chrome,\
    \ Firefox, and Edge) in Docker Hub. The following command shows how to start Chrome\
    \ in Docker using the shell.\n\n```\ndocker run -d -p 4444:4444 --shm-size=\"\
    2g selenium/standalone-chrome:latest\n```\n\nThis command starts the Docker image\
    \ selenium/standalone-chrome:latest, i.e., the latest version of Chrome available\
    \ in Docker Hub. Alternatively, we can use a fixed Chrome version (e.g., selenium/standalone-chrome:94.0).\
    \ The Docker container is started in detached mode (using the -d flag) using a\
    \ shared memory of 2 GB (--shm-size=\"2g\"). This figure is value to work well,\
    \ although you can change it depending on your resources or specific needs. Finally,\
    \ the internal container port 4444 is mapped to the port of the host where the\
    \ command is executed (-p 4444:4444). We can then use the following Java command\
    \ to instantiate a WebDriver object that uses this dockerized Chrome:\n\n```\n\
    WebDriver driver = new RemoteWebDriver(\"http://localhost:4444\",\n    new ChromeOptions());\n\
