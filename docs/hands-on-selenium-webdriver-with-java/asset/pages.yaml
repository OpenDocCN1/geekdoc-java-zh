  md: "At first glance, we can use the filtering mechanisms provided by the build\
    \ tools. For instance, Maven and Gradle allow including or excluding tests based\
    \ on the test classes and methods names. The basic syntax for these commands is\
    \ introduced in Appendix C. Table 8-2 shows several common examples using these\
    \ commands. Notice that the wildcard * is used in these examples to match any\
    \ character in the test class name.\n\n# Table 8-2. Examples of Maven and Gradle\
    \ commands for including and excluding tests\n\n| Description | Maven | Gradle\
    \ |\n| --- | --- | --- |\n| Run starts with the word Hello | mvn test -Dtest=Hello*\
    \ | gradle test --tests Hello |\n| Run tests that contain Basic or Timeout | mvn\
    \ test -Dtest=*Basic*,*Timeout* | gradle test --tests *Basic --tests *Timeout\
    \ |\n| Run tests except those starting with Firefox | mvn test -Dtest=*Firefox*\
    \ | gradle test --ExcludeTests=/*Firefox |\n| Run tests except those starting\
    \ with Docker or containing Remote | mvn test -Dtest=*Docker,**Remote* | gradle\
    \ test --ExcludeTests=/*Docker,/*Remote |\n\nIn addition to the tool, we can use\
    \ built-in features provided by the unit testing frameworks for categorizing (also\
    \ known as grouping or tagging) and filtering tests based on those categories.\
    \ The following subsections explain how.\n\n# JUnit 4\n\nJUnit 4 provides the\
    \ annotation @Category to group tests. We need to specify one or more Java classes\
    \ as attributes in this annotation. We can use these classes to select and exclude\
    \ the tests belonging to one or more categories. Example 8-10 shows a basic class\
    \ using this feature.\n\nExample 8-10. Test using categories and JUnit 4\n\n```\n\
    public class CategoriesJUnit4Test {\n    WebDriver driver;\n\n    @Before\n  \
    \  public void setup() {\n        driver = DriverManager.chromedriver().create();\n\
    \    }\n\n    @After\n    public void teardown() {\n        driver.quit();\n \
    \   }\n}\n```"
