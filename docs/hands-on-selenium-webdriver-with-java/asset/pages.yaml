  md: "Class used to initialize all the previously declared web elements with @FindBy\n\
    (and @FindAll).\n\n# CacheLookup\n\nOne downside of using the @FindBy annotation\
    \ to locate web elements is that\neach locator used, the driver will try to find\
    \ on the current page. This feature\nis helpful in dynamic web applications. However,\
    \ it would be desirable to cache\nthe web elements in static web applications.\
    \ For this reason, the annotation\n@CacheLookup allows caching the web elements\
