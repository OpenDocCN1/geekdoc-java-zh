  md: 'After running the previous test, we get a HAR file called login.har. Now we
    need to convert it to a JMeter test plan. There are different alternatives to
    do that. You can find several programs (e.g., in Ruby or Java) that make this
    job freely available on the web. Also, you can use online converters, such as
    the BlazeMeter JMX Converter. In this example, I use this online service and open
    the resulting JMX test plan in JMeter. At this point, you can tune the JMeter
    configuration at your convenience (you can find further information about JMeter
    in its official user manual). For instance, Figure 9-2 shows the JMeter GUI after
    loading the JMX test plan following the following changes:


