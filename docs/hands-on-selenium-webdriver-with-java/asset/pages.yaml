    # What Strategy Should You Use?


    In this section, we review the different alternatives Selenium WebDriver API allows
    for locating elements in a web page. This topic is one of the most fundamental
    routines for browser automation with Selenium WebDriver. Maybe you are asking
    yourself: *What is the best strategy I should use?* As Dr. Alfred Lansing (character
    in the novel and movie I, Robot) would say: "That is the right question." In my
    opinion, that is a difficult question, and it has no simple answer. In other words,
    the answer to this question could be "it depends." This section presents several
    hints for identifying a suitable locator strategy for common cases. First, Table
    3-8 compares the different locating strategies.'
