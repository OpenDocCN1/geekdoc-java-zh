  md: "# JUnit 5\n\nThe Jupiter programming model provides a way to group tests based\
    \ on custom labels called tags. We use the annotation @Tag for that purpose. Example\
    \ 8-12 illustrates this feature.\n\nExample 8-12. Using tags and JUnit 5\n\n```\n\
    class CategoriesJupiterTest {\n\n    WebDriver driver;\n\n    @BeforeEach\n  \
