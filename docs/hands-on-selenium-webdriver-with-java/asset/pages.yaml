  md: '# APPENDIX B


    # Driver Management


    As discussed in Chapter 1, driver management involves three steps: download, setup,
    and maintenance. Manual driver management is costly in terms of effort and potentially
    problematic regarding maintainability. For this reason, I use WebDriverManager
    to carry out this process in an automated and automained manner in all the examples
    of this book. For completeness, this appendix also describes the involved steps
    (download, setup and maintenance) in manual driver management.


    # WebDriverManager: Automated Driver Management


    WebDriverManager is an open source Java library that manages the drivers required
    by Selenium WebDriver (e.g., chromediver, geckodriver, msedgedriver, etc.) in
    an automated manner. WebDriverManager provides a set of managers for different
    browsers, namely Chrome, Firefox, Edge, Opera, Chromium and Internet Explorer.


    WebDriver internally executes a resolution algorithm to manage the drivers required
    by each browser. This algorithm aims to automatically discover, download, set,
    and maintain these drivers.


    Figure B-1 represents this algorithm in the context of the methodology implemented
    by WebDriverManager. For each manager (e.g., chromedriver(), firefoxdriver()),
    etc.), the resolution algorithm works as follows:


    +   - WebDriverManager tries to find the browser version (e.g., Chrome) installed
    in the local machine. For that, it uses an internal knowledge database called
    commands database. This database contains a list of shell commands (in different
    operating systems) that allow discovering the browser versions (e.g., google-chrome
    --version in Linux).'
  merge: -1
  pgno: 372
- img_proc: true
  md: '+   2. Using the found browser version (e.g., Chrome 89), DriverManager determines
    the correct driver version (e.g., chromedriver 89.0.4389.23). I call this process
    resolution. To ease this process, several driver maintainers (i.e., chromedriver
    and msedgedriver) publish the specific driver version in their online repositories
    using simple text files (e.g., https://LATEST_RELEASE_89). Unfortunately, this
    information is not available for other drivers, such as geckodriver or operable.
    For this reason, DriverManager uses another internal knowledge database (called
    versions database) to keep the association between the versions of browsers and
    drivers. Both versions and commands synchronize their values using an online master
    reference stored on GitHub.


    +   3. DriverManager downloads the specific driver for the local operating system
    (Windows, Linux, or macOS) and stores it in the local file system as the driver
    cache (by default, in the path ~/.cache/selenium).


    +   4. Finally


    For the sake of performance and maintainability, DriverManager internally uses
    a resolution cache. This cache (by default stored in the driver cache as a properties
    file) keeps the relationship between the resolved driver versions. This relationship
    is valid following a time-to-live (TTL) approach. The default value of this TTL
    is one day for drivers (e.g., chromedriver 89.0.4389.23) and one hour for browsers
    (e.g., Chrome 89). The resolution algorithm resolves drivers using the cached
    files in the subsequent invocations (this usually happens in a Selenium WebDriver
    test suite). Then, when a TTL expires, the resolution algorithm tries to resolve
    a new driver release. Finally, when a different browser version is detected, DriverManager
    downloads the new driver (if required). Thanks to this process, the version compliance
    of browser and driver is guaranteed even for evergreen browsers.'
  merge: -1
  pgno: 373
