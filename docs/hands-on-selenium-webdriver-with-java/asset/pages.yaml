    # ## Summary and Outlook


    This chapter provided a comprehensive review of those WebDriver API features interoperable
    in different browsers. Among them, you discovered how to execute JavaScript with
    Selenium WebDriver, with synchronous, pinned (i.e., attached to a WebDriver session),
    and asynchronous scripts. Then, you learned about timeouts, you to specify a time
    limit for page loading and script execution. You also saw how to manage several
    browser aspects, such as size and position, navigation history, the shadow DOM,
    and cookies. Next, you discovered how to interact with specific web elements,
    such as dropdown lists (select and data lists), navigation targets (windows, tabs,
    frames, and iframes), and dialog boxes (alerts, prompts, confirms, and modals).
    Finally, we reviewed the mechanism for implementing web storage and event listeners
    Selenium WebDriver 4 and the most relevant WebDriver exceptions (and their common
    causes).


    The next chapter continues to expose the features of the Selenium WebDriver API.
    The chapter explains those aspects specific to a given browser (e.g., Chrome,
    Firefox, etc.), including browser capabilities (e.g., ChromeOptions, FirefoxOptions,
    etc.), the Chrome DevTools Protocol (CDP), network interception, mocking geolocation
    coordinates, the WebDriver BiDirectional (BiDi) protocol, authentication mechanisms,
    or printing web pages to PDF, among other features.'
