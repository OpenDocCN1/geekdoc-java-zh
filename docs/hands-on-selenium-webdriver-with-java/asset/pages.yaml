    \ arena is to reuse the same browser session (i.e., use the same WebDriver instance)\
    \ by different tests, interacting with the SUT in a given order. The following\
    \ examples demonstrate this use case for JUnit 4, TestNG, JUnit 5, and JUnit 5\
    \ Selenium-Jupiter.\n\n# # JUnit 4\n\nJUnit 4 provides the annotation @FixMethodOrder\
    \ to establish the test execution. This annotation accepts an enumeration called\
    \ MethodSorters, which is composed of the following values:\n\n+   - NAME_ASCENDING\n\
    Sorts the test methods by the method name in lexicographic order\n\n+   - JVM\n\
    Leaves the test methods in the order returned by the JVM\n\n+   - DEFAULT\nSorts\
