    # # Driver Managers


    Drivers are mandatory components to control web browsers with Selenium WebDriver
    (see Figure 1-1). For this reason, we manage these drivers. *Driver management*
    is the process of downloading, setting up, and maintaining the proper driver for
    a given browser. The usual steps in the driver management procedure:


    +   1. Download

    Each browser has its own driver. For example, we use chromedriver for controlling
    Chrome or gedriver for Firefox (see Table 1-1). The driver is a platform-specific
    binary. Therefore, we need to download the proper driver for a given operating
    system (typically Windows, macOS, or Linux). In addition, we need to consider
    the driver version since a release is compatible with a given browser version
    (or range). For example, to use Chrome 91.x, we need to download chromedriver
    91.0.4472.19. We usually find the browser-component driver in the driver documentation
    or release notes.


    +   2. Setup

    Once we have the proper driver, we need to make it available in our Selenium WebDriver
    script.


    +   3. Maintenance

    Modern browsers (e.g., Chrome, Firefox, or Edge) upgrade themselves automatically
    and silently, without prompting the user. For this reason, and concerning Selenium
    WebDriver, we need to maintain the browser-driver version compatibility in these
    so-called *evergreen* browsers.


    As you can see, the driver maintenance process can be time-consuming. Furthermore,
    it can cause problems for Selenium WebDriver users (e.g., failed tests due to
    an automatic browser upgrade). For this reason, the so-called *driver managers*
    aim to carry out the driver management process in an automated fashion to some
    extent. Table 1-3 summarizes the available driver managers for different language
    bindings.'
