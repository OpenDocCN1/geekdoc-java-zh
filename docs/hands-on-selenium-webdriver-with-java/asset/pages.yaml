    An important common characteristic of the xUnit family is the test structure,
    composed of four phases (see Figure 1-9):


    # Setup


    The test case initializes the SUT to exhibit the expected behavior.


    # Exercise


    The test case interacts with NUnit. As a result, the test gets an outcome from
    the SUT.


    # Verify


    The test case decides if the obtained outcome from the SUT is expected. To that,
    the test contains one or more assertions. An assertion (or predicate) is a boolean-value
    function that checks if an expected condition is true. The execution of the assertions
    varies (typically, pass or fail).


    # Teardown


    The test case puts the SUT back into the initial state.'
