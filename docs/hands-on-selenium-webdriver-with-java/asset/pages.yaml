  md: 'We can use the shell to invoke Maven, using the command mvn. For instance,
    the following command invokes the clean lifecycle (i.e., clean the target folder
    and all its content) and then invokes it in cascade all the phases of the default
    lifecycle until package (i.e., validate, compile, test, and finally, package):


    ```

    mvn clean package

    ```


    Another core element in Maven is the concept of plug-ins. A plug-in is a built-in
    article that executes the phases mentioned above. In this book, we are particularly
    interested in testing. Therefore, we focus on the phases test and verify the corresponding
    plug-ins: maven-surefire-plugin and maven-failsafe-plugin, respectively. Table
    C-1 summarizes the main differences between these two plug-ins.


    Table C-1. Differences between the Surefire and Failsafe Maven plug-ins


    | maven-surefire-plugin | maven-failsafe-plugin |

    |---|---|n| Description | Maven plug-in to execute tests before packaging | Maven
    plug-in to execute tests after packaging |

    | Classic unit | mvn test | Integration (and other high-level) tests |

    | Basic command | | mvn verify |

    | Type | Default plug-in (i.e., we can use it without declaring in the pom.xml)
    | Not default plug-in (i.e., we need to declare it in the pom.xml to use it) |

    | Used version | Defined initially in Maven | Latest available version |

    | Test pattern | **Test*.java | **/*.java |

    | | **Test.java | **IT.java |

    | | **Tests.java | **ITCase.java |

    | | **TestCase.java |


    For simplicity, we use only maven-surefire-plugin for executing tests in the examples
    repository. Although these tests are not a unit (in fact, they are end-to-end),
    it is not a problem to run them with maven-surefire-plugin (i.e., after compilation
    and before packaging). Table C-2 summarizes the basic commands to run tests from
    the shell using this plug-in.


    Table C-2. Basic commands for running tests with maven-surefire-plugin


    | Command | Description |

    |---|---|n| mvn test | Run all tests in the project |

    | mvn test -Dtest=MyClass | Run all tests in a single class |

    | mvn test -Dtest=MyClass#myMethod | Run a single test in a single class


    Nevertheless, if you want to use maven-failsafe-plugin to execute tests, you need
    to use the setup shown in Example C-1 in your pom, xml file. Finally, you can
    run the tests using the command mvn verify (i.e., run tests after packaging).'
