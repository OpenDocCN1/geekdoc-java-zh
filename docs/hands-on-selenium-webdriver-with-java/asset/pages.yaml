- img_proc: true
  md: '![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_232_0.png)


    # WebDriver commands


    Once the session is established, the Selenium WebDriver script will continue sending
    W3C WebDriver commands to control the web browser in the remote node. Figure 6-6
    shows how this communication occurs in a distributed Selenium Grid infrastructure
    following these steps:


    +   1. The script/test exchanges W3C WebDriver commands to drive the browser (e.g.,
    open a web page, interact with web elements, etc.) in the current session.

    2. Further requests to the same browser session use the same session id. The Router
    recognizes that a browser session is active by reading the Session Map.

    3. The Router forwards the subsequent commands of the same session directly to
    the assigned node.'
