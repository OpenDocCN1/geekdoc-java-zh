  md: "At the time of this writing, this mobile device emulation can be automated\
    \ through Selenium WebDriver API in Chromium-based browsers (Chrome and Edge)\
    \ but not Firefox (which is not implemented in geckriver). For that, we need to\
    \ set the experimental option mobileEmulation in chromeOptions or EdgeOptions.\n\
    \nThen, there are two alternatives to specify the mobile device to be emulated.\
    \ First, we can specify a particular mobile device (e.g., Pixel 2, iPad Pro, or\
    \ Galaxy Fold, to make a few). This list is updated in Chrome release, the best\
    \ way to check the possibilities is to inspect the available devices in DevTools\
    \ (e.g., iPhone X is selected in Figure 5-2). Example 5-6 shows a test setup in\
    \ which we specify a mobile device using the label iPhone 6/7/8.\n\nExample 5-6\
    \ Test setup using mobile emulation by specifying a device\n\n```\n@BeforeEach\n\
    void setup() {\n    ChromeOptions options = new ChromeOptions();\n    Map<String,\
    \ Object> mobileEmulation = new HashMap<>(); ①\n    mobileEmulation.put(\"deviceName\"\
    , \"iPhone 6/7/8\"); ②\n    options.setExperimentalOption(\"mobileEmulation\"\
    , mobileEmulation); ③\n\n    driver = DriverManager.chromedriver().capabilities(options).create();\
    \  ④\n}\n```\n\n+   ① We need to create a HashMap object to specify the mobile\
    \ emulation options.\n\n+   ② Then, we only need to select the device name (iPhone\
    \ 6/7/8 in this case).\n\n+   ③ We set up device emulation using experimental\
    \ options.\n\n+   ④ As usual, we create a WebDriver object specifying these options.\n\
    \nThe second alternative to set up mobile emulation is to specify the individual\
    \ attributes of the emulated device. These attributes are:\n\nwidth\nDevice screen\
    \ width (in pixels)\n\nheight\nDevice screen height (in pixels)\n\npixelRatio\n\
    Ratio between physical pixels and logical pixels\n\ntouch\nWhether to emulate\
    \ touch events; the default value is true"
