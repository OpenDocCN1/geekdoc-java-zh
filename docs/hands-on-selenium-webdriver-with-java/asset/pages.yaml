  md: '![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_374_0.png)


    # Generic Manager


    In addition to the browser-specific managers (e.g., chromedriver(), firefox driver(),
    etc.), DriverManager provides a generic manager, i.e., a manager that can be parameterized
    to a specific manager (for Chrome, Firefox, etc.). This feature is available using
    the method getgetInstance() of the DriverManager API. There are different options
    to invoke this method:


    ```

    getInstance(Class<? extends WebDriver> webdriverDriverClass)

    ```


    Where webdriverClass is a class of the WebDriver hierarchy, such as Chrome Driver.class,
    FirefoxDriver.class, etc.'
