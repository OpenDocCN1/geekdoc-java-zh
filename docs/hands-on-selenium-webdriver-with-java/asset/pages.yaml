    \ Disposal\n\nAs you can see in Table 3-2, there are two methods to dispose of\
    \ the WebDriver objects, called close() and quit(). As a general rule, I use quit()\
    \ in the examples this method closes the browser and every associated window.\
    \ On the other, the method close()terminates only the current window. Therefore,\
    \ I only close() in the case of handling different windows (or tabs) in the same\
    \ browser, and I want to finish some of the windows (or tabs) and still use the\
    \ rest.\n\n# Locating WebElements\n\nOne of the most relevant aspects of the Selenium\
    \ WebDriver API is the ability to interact with the different elements of a web\
    \ page. These elements are handled by Selenium WebDriver using the interface WebElement,\
    \ an abstraction for HTML elements. As introduced in Table 3-2, there are two\
    \ methods to locate WebElement in a given web page. First, the findElement() returns\
    \ the first occurrence (if) of a given node in the Document Object Model (DOM).\
    \ Second, the method findElements() returns a list of DOM nodes. Both methods\
    \ accept a parameter By, which specifies the location strategy.\n\n# The Document\
    \ Object Model (DOM)\n\nThe DOM is a cross-platform interface that allows representing\
