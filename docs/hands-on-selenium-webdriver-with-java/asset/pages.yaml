    # Testing Methodologies


    The software development lifecycle is the set of activities, actions, and tasks
    required to create software systems in software engineering. The moment at software
    engineers design and implement test cases in the overall development lifecycle
    depends on the specific development process (such as iterative, waterfall, or
    agile, to name to a few).


    # Test Driven Development (TDD)


    TDD is a methodology in which we design and implement tests before the actual
    software design and implementation. At the beginning of the 21st century, TDD
    became popular with the rise of agile development methodologies, such as Extreme
    Programming (XP). In TDD, a developer first writes an (initially failing) automated
    test for a given feature. Then, the developer creates a piece of code to pass
    that test. Finally, the developer refactors the code to achieve or improve reliability
    and maintainability.


    # Test Last Development (TLD)


    TLD is a methodology in which we design and implement tests after implementing
    the SUT. This practice is typical in traditional software development processes,
    such as waterfall (sequential), incremental (multi-waterfall), spiral (risk-oriented
    waterfall), or Rational Unified Process (RUP).


    Another relevant testing methodology is Behavior-Driven Development (BDD). BDD
    is a testing practice derived from TDD, and consequently, we design tests at the
    early stages of the software development lifecycle in BDD. To aim that, conversations
    between the final user and the development team (typically with the project leader,
    manager, or analysts) are formalize a common understanding of the desired behavior
    and the software system. As a result, we create acceptance tests in terms of one
    or more scenarios following a Given-When-Then structure:'
