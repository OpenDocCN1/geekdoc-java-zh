  md: '# Web-based apps


    Web applications rendered into a mobile browser (e.g., Chrome, Safari, or Firefox
    Mobile). These apps are typically designed to be responsive (i.e., adaptable to
    different screen sizes and viewports).


    # Hybrid apps


    Mobile applications developed using client-side web standards (i.e., HTML, CSS,
    and JavaScript) and deployed to mobile devices using a native container calledwebview.
    Examples of frameworks that enable the development of hybrid apps are Ionic, React
    Native, Flutter.


    # Progressive web apps (PWAs)


    Web applications built with modern standard APIs (for installability, responsiveness,
    etc.) intended to work on multiple platforms, including desktop and mobile devices.


    # Mobile Testing


    Testing is an essential process in the development of mobile apps. Mobile testing
    involves different challenges such as hardware compatibility, network connectivity,
    or operating system specifics. Different approaches to carry out mobile testing
    include:


    Using desktop browsers with mobile emulation


    We use Selenium WebDriver for this type of mobile testing. To that aim, you can
    use browser-specific features (as explained in "Device Emulation" on page 153)
    or use the CDP with Chromium-based browsers (as explained in "Device emulation"
    on page 187).


    Using virtual devices


    There are two types of virtual mobile devices:


    Emulators


    Desktop applications that virtualize all aspects of mobile devices, including
    the hardware and the operating system.


    Simulators


    Desktop apps that mimic certain features of a mobile operating system. They are
    primarily intended for iOS so Android devices are emulated easily.


    Using real devices


    Using actual devices and their native Android or iOS APIs in real conditions.'
