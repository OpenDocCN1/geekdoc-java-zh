  md: '# Java Virtual Machine


    Next, you need a Java Virtual Machine (JVM) installed on your computer. There
    are two types of distributions for the JVM. The first option is the Java Runtime
    Environment (JRE), which includes the JVM and the Java standard API. The second
    option is the Java Development Kit (JDK), which is the JRE plus a Software Development
    Kit (SDK) for Java (such as the jav compiler and other tools). Since we are developing
    in Java, I recommend using JDK (although some IDEs also incorporate an SDK for
    Java). For the Java version, I recommend using at least JDK 8 since it is the
    long-term support version commonly supported in many Java projects at the time
    of this writing.


    # Text Editor or IDE


    To code our Java tests, we need a text editor or IDE. IDEs provide an excellent
    experience for development because they have a full-fledged environment (for coding,
    running, debugging, autocompletion, etc.). Nevertheless, you can get similar practice
    using any text editor you, in conjunction with command-line tools (for running,
    debugging, etc.). Overall, it depends on your preferences to choose one or other.
    Some popular alternatives for text editors are Sublime Text, Atom, Notepad++,
    or Vim, among others. IDEs include Eclipse, IntelliJ IDEA, NetBeans, or Visual
    Studio Code.


