    * We confirm the current URL is still the same.\n* We check that the source HTML\
    \ of the page contains a given tag.\n\n> ### Convention for Test Names and Classes\
    \ in the Examples Repository\nFor locating tests in the examples repository, I\
    \ follow a naming convention. The name of each presented test starts with the\
    \ word test followed by a descriptive label. Then, I use this as the prefix of\
