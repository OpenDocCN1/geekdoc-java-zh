  md: '# CHAPTER 1


    # A Primer on Selenium


    Selenium is an open suite composed of a set of libraries and tools that enable
    the automation of web browsers. We can see Selenium as an umbrella project with
    three core components: WebDriver, Grid, and IDE (Integrated Development Environment).
    Selenium WebDriver is a library that allows the driving of browsers programmatically.
    Thus, we can use Selenium WebDriver to navigate websites and interact with web
    pages (e.g., clicking on links, filling in forms), as as a real user would do,
    in an automated fashion. The primary use of Selenium WebDriver is the automated
    testing of web applications. Other Selenium uses include the automation of web-based
    administration tasks or scraping (automated web data extraction).


    This chapter provides a comprehensive overview of the Selenium core components:
    WebDriver, Grid, and IDE. Then, it reviews the Selenium ecosystem, i.e., other
    tools and technologies around it. Finally, it analyzes the foundations of software
    testing related to Selenium.


    # Selenium Core Components


    Jason Huggins and Paul Hamm created Selenium in 2004 while working in Thoughtworks.
    They chose the name “Selenium” as a counterpart to Mercury, an existing testing
    framework developed by Hewlett-Packard. The name is significant because the chemical
    selenium is known for reducing the toxicity of mercury.


    That initial version of Selenium (known today as *Selenium Core*) is a JavaScript
    library that impersonates user actions in web applications. Selenium Core interprets
    the so-called Selenese commands to achieve this task. These commands are encoded
    as an HTML table composed of three parts: command (action executed in a web browser,
    such as opening a URL or clicking a link), target (locator that identifies a'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'web element, such as the attribute of a given component), and value (optional
    data, such as the text typed into a web-form field).


    Huggins and Hammant added a scripting layer to Selenium Core in a new project
    Selenium Remote Control (RC). Selenium RC follows a client-server architecture.
    Clients using a binding language (such as Java or JavaScript) to send commands
    over HTTP to an intermediate proxy called the Selenium RC Server. This launches
    browsers on demand, injecting the Selenium Core library into a website and proxying
    requests from clients to Selenium Core. In addition, the Selenium RC masks the
    target website to the same local URL of the injected Selenium Core library to
    avoid same-origin policy changes. This approach was a gamechanger for browser
    automation at that time, but it had significant limitations. First, because JavaScript
    is the underlying technology to support automation, some actions are not permitted
    since JavaScript does not allow them—for instance, uploading and downloading files
    or handling pop-ups and dialogues, to name a few. Besides, Selenium RC introduces
    a relevant overhead that impacts its performance.


    In parallel, Simon Stewart created the project WebDriver in 2007. WebDriver and
    Selenium RC were equivalent from a functional perspective, i.,e., both allow programmers
    to impersonate web users using a programming language. Nevertheless, WebDriver
    uses the native support of each browser to carry out the automation, and therefore,
    its capabilities and performance are far superior to RC. In 2009, after a meeting
    between Jason Huggins and Simon Stewart at the Google Test Automation Conference,
    they decided to merge Selenium and WebDriver in a single project. The new project
    was Selenium WebDriver or Selenium 2. This new project uses a communication protocol
    based on HTTP combined with the native automation support on the browser. That
    approach is still the basis of Selenium 3 (released in 2016) and Selenium 4 (released
    in 2021). Now we refer to Selenium RC and Core as "Selenium 1," and its use is
    discouraged in favor of Selenium WebDriver. This book focuses on the latest version
    of Selenium WebDriver to date, i., version 4.


    Appendix A summarizes the novelties shipped with Selenium 4.

    This appendix also contains a migration guide for bumping Selenium 3 to 4.


    ![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_25_0.png)


    Today, Selenium is a well-known automation suite composed of three subprojects:
    WebDriver, Grid, and IDE. The following subsections present the main characteristics
    of each one.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Selenium WebDriver


    Selenium WebDriver is a library that allows the controlling of script browsers
    automatically. To that aim, it provides a cross-platform API in different language
    bindings. The official programming languages supported by Selenium WebDriver are
    Java, JavaScript, Python, Ruby, and C#. Internally, Selenium WebDriver uses the
    native support implemented by each browser to carry out the automation process.
    For reason, we need to place a called driver between the script using the Selenium
    WebDriver API and the browser. Table 1-1 summarizes the browsers and drivers supported
    by Selenium WebDriver.


    ![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_26_0.png)


    The name Selenium is widely used to refer to the library for browser automation.
    Since this term is also the name of the umbrella project, I use Selenium in this
    book to identify the browser automation suite, which is composed of three components:
    Selenium WebDriver (library), Selenium Grid (infrastructure), and Selenium IDE
    (tool).


    Table 1-1. Browsers and drivers supported by Selenium WebDriver


    | Browser | Driver | Operating system | Maintainer | Download |

    |---|---|---|---|--|

    | Chrome/Chromium | chromedriver | Windows/macOS/Linux | Google | [https://chromedriver.microsoft.org](https://chromedriver.microsoft.org)
    |

    | Edge | msedgedriver | Windows/macOS/Linux | Microsoft | [https://developer.microsoft.com/en-us/microsoft-edge-tools/webdriver/](https://developer.microsoft.com/en-us/microsoft-edge-tools/webdriver/)
    |

    | Firefox | geckodriver | Windows/macOS/Linux | Mozilla | [https://github.com/mozilla/geckodriver](https://github.com/mozilla/geckodriver)
    |

    | Opera | operadapter | Windows/macOS/Linux | Opera Software AS | [https://github.com/operasoft/operachrom](https://github.com/operasoft/operachrom)
    |

    | Internet Explorer | IDWebDriver | Windows | Selenium project | [https://www.selenium.dev/downloads](https://www.selenium.dev/downloads)
    |

    | Safari | safaridriver | macOS | Apple | Built-in |


    Drivers (e.g., chromedriver, geckodriver, etc.) are platform-dependent binary
    files that receive commands from a WebDriver script and translate them into browser-specific
    language. In the first releases of Selenium WebDriver (i.e., Selenium 2), these
    commands (also known as the Selenium protocol) are JSON messages over HTTP (the
    so-called Wire Protocol). Nowadays, this communication (still JSON over HTTP)
    follows a standard specification named W3C WebDriver. This specification is the
    preferred Selenium protocol as Selenium 4.


    Selenium Core Components | 5'
