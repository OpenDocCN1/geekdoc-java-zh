  md: "In the classic authentication approach, users send their username and password\
    \ to the server using a web form. In WebAuthn, the web server uses the Web Authentication\
    \ API to prompt the user to create a private-public key pair (known as a credential).\
    \ The private key is stored securely on the user's device, and the public key\
    \ is sent to the server. Then, the server can use that public key to validate\
    \ identity.\n\nAs of version 4, Selenium WebDriver supports WebAuthn out of the\
    \ box. To that aim, the Selenium WebDriver API provides HasVirtualAuthenticator.\
    \ Instead of using secure credentials, this interface allows you to use virtual\
    \ authenticators. At the time of this writing, this mechanism is supported only\
    \ in Chromium-based browsers, i.e., Chrome and Edge. Example 5-46 shows a test\
    \ using the Web Authentication API.\n\nExample 5-46. Test using WebAuthn\n\n```\n\
    @Test\nvoid testWebAuthn() {\n  driver.get(\"https://webauthn.io/\");\n  HasVirtualAuthenticator\
    \ virtualAuth = (HasVirtualAuthenticator) driver;\n  VirtualAuthenticator authenticator\
    \ = virtualAuth;\n  driver.addVirtualAuthenticator(new VirtualAuthenticatorOptions());\n\
    \  String randomId = UUID.randomUUID().toString();\n  driver.findElement(By.Id(\"\
    input-email\")).sendKeys(randomId);\n  WebDriverWait wait = new WebDriverWait(driver,\
    \ Duration.ofSeconds(20));\n  driver.findElement(By.Id(\"register-button\")).click();\n\
