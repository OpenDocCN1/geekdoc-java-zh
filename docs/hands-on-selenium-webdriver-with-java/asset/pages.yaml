  md: "# WebDriverManager\n\nAs of version 5, WebDriverManager allows the effortless\
    \ use of web browsers in Docker containers. To that aim, each manager (e.g., chromedriver(),\
    \ firefox driver(), etc.) provides the method browserInDocker(). WebDriverManager\
    \ pulls the Docker images and runs the container, creating a RemoteWebDriver instance\
    \ when invoking the method create(). WebDriverManager uses the Docker images maintained\
    \ by the Selenium team. This way, you can use Chrome (desktop and mobile), Firefox,\
    \ Edge, Opera, and Safari as Docker containers out of the box through WebDriverManager.\
    \ Example 6-11 illustrates a basic test using this feature.\n\nExample 6-11. Complete\
    \ test using WebDriverManager and Chrome in Docker\n\n```\nclass DockerChromeDriverTest\
    \ {\n\n    WebDriver driver;\n\n    WebDriver wdm = WebDriverManager.chromedriver().browserInDocker();\n\
    \n    @BeforeEach\n    void setUp() {\n        assertThat(isDockerAvailable()).isTrue();\n\
    \        driver = wdm.create();\n    }\n\n    @AfterEach\n    void tearDown()\
    \ {\n        wdm.quit();\n    }\n\n    @Test\n    void testDockerChrome() {\n\
    \        driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\");\n  \
    \      assertThat(driver.getTitle()).contains(\"Selenium WebDriver\");\n    }\n\
    }\n```\n\n+   We get an instance of the manager for Chrome (chromedriver()). Then,\
    \ using the WebDriverManager fluent API, I specify that the future WebDriver objects\
    \ created with this instance (called wdm) will use Docker to execute the corresponding\
    \ browser (Chrome, in this case).\n\n+   We assume a Docker engine is in the machine\
    \ running this test. For that, we create an AssertJ assumption by invoking the\
    \ static method isDockerAvailable on WebDriverManager. This way, when Docker is\
    \ not available, the test is skipped."
  merge: -1
  pgno: 245
- img_proc: true
  md: "+   In the test setup, we create the WebDriver instance. Internally, DriverManager\
    \ will connect to Docker Hub to discover the latest version of Chrome available\
    \ as a Docker image. This image is pulled to the local machine, the Docker container\
    \ is executed, and the corresponding RemoteWebDriver instance is returned to the\
    \ test logic.\n\n+   WebDriver allows quitting the previously created WebDriver\
    \ instances through the method quit(). This method has the same effect of directly\
    \ quitting the instance (driver.quit() in this case), and the used Docker containers\
    \ are gracefully terminated.\n\nWebDriver provides a fluent API to configure different\
