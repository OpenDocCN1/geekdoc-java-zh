    # Maven


    A core concept in Maven is the build lifecycle, the name given to the process
    of building and distributing a particular project. There are standard build lifecycles
    in Maven: default (for project deployment), clean (for project cleaning), and
    site (for documentation). These build lifecycles have a list of build phases,
    wherein each phase represents a stage in the lifecycle. The primary phases of
    the default lifecycle are:


    validate


    Assess the project is correct and all necessary information is valuable.


    compile


    Compile the source code.


    test


    Execute test using a unit testing framework.


    package


    Bundle the compiled code into a distributable format, such as a Java ARArchive
    (JAR) file.


    verify


    Execute further tests (typically integration or other high-level tests).


    install


    Install the package into the local repository.


    deploy


    Install the package into a remote repository or server.'
