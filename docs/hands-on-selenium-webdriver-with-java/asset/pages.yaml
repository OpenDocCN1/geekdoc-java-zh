- img_proc: true
  md: 'Figure 1-1 summarizes the basic architecture of Selenium WebDriver we have
    seen so far. As you can see, this architecture has three tiers. First, we find
    a script using the Selenium WebDriver API (Java, JavaScript, Python, Ruby, or
    C#). This script sends W3C WebDriver commands to the second layer, in which we
    find the drivers. This figure shows the specific case using chromedriver (to control
    Chrome) and geckriver (to control Firefox). Finally, the third layer contains
    the web browsers. In the case of Chrome, the native browser follows the Blink
    rendering, such as Chrome, Chromium, Edge, or Opera. The DevTools Protocol is
    based on JSON-RPC messages and allows inspecting, debugging, and profiling these
    browsers. In Firefox, the native automation support uses the Marionette protocol.
    Marionette is a remote protocol based on JSON, allowing instrumenting and controlling
    web browsers based on the Gecko engine (such as Firefox).


    ![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_27_0.png)


    Overall, Selenium WebDriver allows controlling web browsers as a user, but programmatically.
    To that aim, the Selenium WebDriver API provides a wide variety of features to
    navigate web pages, interact with web elements, or impersonate user actions, among
    many other capabilities. The target application is web-based, such as static websites,
    dynamic web applications, Single Page Applications (SPA), complex enterprise systems
    with a web interface, etc.


    # Selenium Grid


    The second project of the Selenium family is Selenium Grid. Philippe Hanrigou
    started the development of this project in 2008. Selenium Grid is a group of networked
    hosts that provide browser infrastructure for Selenium WebDriver. This infrastructure
    enables the (parallel) execution of Selenium scripts with remote browsers of a
    different nature (types and versions) in multiple operating systems.'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'Figure 1-2 shows the basic architecture of Selenium Grid. As you can see, a
    group of nodes provides browsers used by Selenium scripts. These nodes can use
    different operating systems (as we see in Table 1-1) with installed browsers.
    The central point to this Grid is the Hub (also known as Selenium Server). This
    server-side component keeps track of the nodes and proxies requests from the Selenium
    scripts. Like in Selenium WebDriver, the W3C WebDriver specification is the standard
    protocol for the communication between these scripts and the Hub.


    ![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_28_0.png)


    Figure 1-2. Selenium Grid hub-nodes architecture


    The hub-nodes architecture in Grid has been available since Selenium 2. This architecture
    is also present in Selenium 3 and 4. Nevertheless, this centralized architecture
    can lead to performance bottlenecks if the number of requests to the Hub is high.
    Selenium 4 provides a fully distributed flavor of Selenium Grid to avoid this
    problem. This architecture implements advanced load balancing mechanisms to avoid
    overloading any component.


    Chapter 6 describes how to set up Selenium Grid following the classical approach
    (based on a hub and set of nodes). This chapter also covers standalone mode (i.e.,
    hub and node(s) hosted in the same machine) and the fully distributed architecture.


    ![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_28_1.png)'
  merge: -1
