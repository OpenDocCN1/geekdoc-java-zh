  md: '# Selenium Ecosystem


    Software ecosystems are collections of elements interacting with a shared market
    underpinned by a common technological background. In the case of Selenium, its
    ecosystem involves the official core projects and other related projects, libraries,
    and actors. This section reviews the Selenium ecosystem, divided into the following
    categories: language bindings, driver managers, frameworks, browser infrastructure,
    and community.


    # Language Bindings


    As we know, the Selenium project maintains various language bindings for Selenium
    WebDriver: Java, JavaScript, Python, Ruby, and C#. Nevertheless, other languages
    are also utilized. Table 1-2 summarizes these language bindings for Selenium WebDriver
    maintained by the community.


