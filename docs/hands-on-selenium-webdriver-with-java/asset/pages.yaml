  md: "# Creating a Domain Specific Language (DSL)\n\nWe can push things a little\
    \ more in our journey of modeling classes SUT and create a complete Domain Specific\
    \ Language (DSL) using the page classes. In computing, a DSL is a specialized\
    \ language for a particular domain. When using the POM and Selenium WebDriver,\
    \ we can see the encapsulation of all the SUT operations and services in the methods\
    \ provided by the page classes. This way, test cases use a simple, readable API\
    \ provided by the page classes. These classes encapsulate all the calls to the\
    \ Selenium WebDriver API to interact with the SUT.\n\nContinuing with the example\
    \ shown in the previous sections, Example 7-9 shows a base page for the page factor\
    \ following a DSL approach. This base class is quite similar to Example 7-6, but\
    \ in this, this class also encapsulates the required logic to create a WebDriver\
    \ instance.\n\nExample 7-9. Example of base class following a DSL approach\n\n\
    ```\nstatic final Logger log = get(lookup().lookupClass());\n\nWebDriver driver;\n\
    WebDriver wait;\nint timeoutSec = 5; // timeout (5 seconds by default)\n\npublic\
    \ ExtendedBasePage(String browser) { ①\n    driver = WebDriverManager.getInstance(browser).create();\
    \ ②\n    wait = new WebDriverWait(driver, Duration.ofSeconds(timeoutSec));\n}\n\
    \npublic void timeoutSec(int timeoutSec) {\n    this.timeoutSec = timeoutSec;\n\
    }\n\npublic void quit() { ③\n    if (driver != null) {\n        driver.quit();\n\
    \    }\n\n// Rest of common methods: quit(), visit(URL url), find(By element),\
    \ etc.\n```\n\n+   ① We declare a String parameter in the base constructor. This\
    \ string will be the browser name (specified in the tests)."
