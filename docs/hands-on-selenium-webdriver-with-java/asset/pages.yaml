    \ testBasicMethods) in the classes BasicMethodsJUnit4 (using JUnit 4), BasicMethodsJupiterTest\
    \ (using JUnit 5), BasicMethodsSelTest (using JUnit 5 Selenium-jupiter), and BasicMethodsNGTest\
    \ (using TestNG).\n\n# Session Identifier\n\nEach time we instantiate a WebDriver\
    \ object, the underlying driver (e.g., chromedriver, geckodriver, etc.) creates\
    \ a unique identifier called sessionId to track the browser session. For that,\
    \ we use this value to univocally identify a browser session. Notice that this\
    \ method is not available in Table 3-2, because it belongs to the RemoteWebDriver\
    \ class. In this practice, the types we use to control browsers (e.g., ChromeDriver,\
    \ FirefoxDriver, etc.) inherit from that class. Therefore, we simply need to cast\
    \ the WebDriver to RemoteWebDriver to invoke the getSessionId method. Example\
    \ 3-4 shows a basic test using it."
