  md: '# Waiting Strategies


    Web applications are client-server distributed services in which the clients are
    the web browsers and the web servers are usually remote hosts. The intermediate
    latency could affect the reliability of a WebDriver test. In instance, in the
    case of high-latency networks or overloaded servers, a slow response might negatively
    affect the expected conditions of WebDriver tests. In addition, modern applications
    tend to be dynamic and asynchronous. Nowadays, JavaScript allows executing nonblocking
    (i.e., asynchronous) operations using different mechanisms, such as callbacks,
    promises, or async/await. In addition, we can retrieve data from other servers
    asynchronously, for example, using AJAX (Asynchronous JavaScript and XML) or REST
    (REpresentational State Transfer) services.


    All in all, it is of paramount importance to have mechanisms wait and wait for
    conditions in our WebDriver tests. For this reason, the Selenium WebDriver API
    provides different waiting assets. The three principal waiting strategies are
    implicit, explicit, and fluent waits. The following subsections explain and show
    examples.


    ![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_115_0.png)


    For waiting in Java, you might think about including Thread.sleep() commands in
    your code. On the one hand, it is a simple solution, but on the other hand, it
    is considered a bad smell (i.e., a weak sign) that could lead to unreliable tests
    (since the delay conditions can change). As a general rule, I strongly discourage
    you from using it. Instead, consider using the aforementioned wait strategies.


    # Implicit Wait


    The first waiting strategy provided by Selenium WebDriver is called implicit.
    This mechanism allows specifying an amount of time before throwing an exception
    when finding an element. By default, this has a value of zero seconds (i.e., it
    does not wait at all). When we define an implicit wait value, Selenium WebDriver
    polls the DOM during the implicit wait value when trying to find element. The
    poll time is specific to the driver implementation and is less than five hundred
    ms. If the element is present then the script continues. Otherwise, it throws
    an exception.


    Example 3-27 illustrates this strategy. This test uses a practice page (see Figure
    3-12) that dynamically loads several images into the DOM. Since these images are
    not available just before the page is loaded, we need to wait for these images
    to be available.'
