  md: '![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_39_0.png)


    Figure 1-6. Component-based representation of the different levels of testing


    Acceptance testing is the top tier of the presented stack. At this level, the
    final user participates in the testing process. The objective of acceptance testing
    is to decide whether the software system meets end-user expectations. As you can
    see in Figure 1-6, like end-to-end testing, acceptance testing validates the whole
    system and its dependencies. Therefore, acceptance tests also use the UI to carry
    out the SUT validation.


    The primary purpose of Selenium WebDriver is to implement end-to-end tests. Nevertheless,
    we can use WebDriver to carry out system testing when mocking the backend calls
    made by the website under test. Moreover, we can use Selenium WebDriver in conjunction
    with a Behavior-Driven Development (BDD) tool to implement acceptance tests (see
    Chapter 9).'
