    # # Migration Guide


    This section summarizes the changes you need to make to migrate an existing codebase
    using Selenium WebDriver 3 to version 4.


    # # Locators


    The utility methods to find elements (FindByBy interfaces) have been removed in
    Selenium WebDriver 4. Table A-2 compares the old and new API for Finding Elements
    in Selenium WebDriver. You can find more details about this feature in [Locating
    Elements] on page 59.


    Table A-2. Migration of web element location in Selenium WebDriver 4


    | Selenium WebDriver 3 | Selenium WebDriver 4 |

    | --- | --- |

    | driver.findElementTagName("tagName") | driver.findElement(By.tagName("tagName


    # # User gestures


    The class Actions allows controlling user gestures (such as drag and drop, hovering,
    mouse movements, etc.). As illustrated in Table A-3, the API exposed by this class
    has been simplified in Selenium WebDriver 4. "User Gestures" on page 86 contains
    further information and examples about this class.'
