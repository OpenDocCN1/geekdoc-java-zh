  md: '# Finding Locators on a Web Page


    As introduced in Table 1-4 in Chapter 1, there are different tools we can use
    to help generate locators for our WebDriver tests. This section shows how to use
    the main features of the built-in developer tools in major browsers, i.e., Chrome
    DevTools for Chromium-based browsers (e.g., Chrome and Edge) Firefox Developer
    Tools (Firefox).


    You can open both of these developer tools by right-clicking on the portion of
    the web page UI that you want to test and selecting the option menu Inspect. Figure
    3-3 shows a screenshot of Chrome DevTools placed at the bottom of the browser
    (if you move it).


    Developer tools provide different ways to locate elements in a web page. First,
    we use the element selector by clicking on the icon (an arrow over a box) in the
    upper left corner of the developer tools pane. Then, we can move the mouse over
    the page to highlight each element and inspect the elements panel to check their
    markup, attributes.


    ![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_93_0.png)


    Figure 3-3. Use of Chrome DevTools while navigating the site page


