  md: "We use the same capabilities syntax to specify the binary path for Chrome,\
    \ Edge, and Firefox. Example 5-17 shows a test setup using Chrome beta.\n\nExample\
    \ 5-17. Test setup setting a custom binary path for Chrome\n\n```\n@BeforeEach\n\
    void setup() {\n    Path browserBinary = Paths.get(\"/usr/bin/google-chrome-beta\"\
    );\n    assumeThat(browserBinary.exists());\n\n    ChromeOptions options = new\
    \ ChromeOptions();\n    options.setBinary(browserBinary.toFile());\n    driver\
    \ = new ChromeDriver(options.capabilities()).create();\n}\n```\n\n+   We use a\
    \ Java Path to get the browser binary path (in this case, Chrome beta in Linux).\n\
    \n+   We use assumptions to conditionally skip this test when the previous path\
    \ does not exist (e.g., in the CI server).\n\n+   We use the setBinary of the\
    \ Chrome options to set the binary path (as a Java File).\n\n# Web Proxies\n\n\
    In computer networking, a proxy is a server that acts as an intermediary between\
    \ a client and a server. A web proxy is a proxy between a browser and a web server,\
    \ and it can serve multiple purposes, as:\n\nAccess region-specific information\n\
    \n+   The proxy is typically located in a different region than the client, and\
    \ the server consecutively replies to that region.\n\nAvoiding restrictions\n\n\
    +   A proxy can help access blocked websites, for example, by an intermediate\
    \ firewall.\n\nCapture network traffic\n\n+   A proxy can gather HTTP requests\
    \ and responses.\n\nCaching\n\n+   A proxy can allow faster website retrieval.\n\
    \nFigure 5-9 represents the location of a web proxy in the Selenium WebDriver\
    \ architecture compared to the typical scenario in which a web proxy is not used.\
    \ As you can see, the web proxy is placed in the middle of the browser and the\
    \ web application"
  merge: -1
