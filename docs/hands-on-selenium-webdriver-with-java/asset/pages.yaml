  md: '# Foreword


    In 1999, Kent Beck wrote Extreme Programming Explained. This introduced the world
    to Extreme Programming (XP). For many people this was the way they first heard
    about Agile software development. Over the next 20 years, many of the ideas behind
    the book faded away, but there was one idea stuck: we should be writing automated
    tests that verify our code is working as it does. XP expected these tests to be
    written before the app logic, leading to Test Driven Development (TDD).


    Today, while strict TDD is seldom practice, the idea of writing tests is prevalent
    (though not always popular!). Most companies now acknowledge the kind of automated
    testing. Many of us actually write tests! Even “regular” QA roles frequently require
    people to write code.


    In 2004, Jason Huggins started Selenium at a software development consultancy
    Thoughtworks, which specialized in Agile development. Employees were steered in
    XP and were key proponents of TDD. From the beginning, Selenium has been closely
    associated with testing.


    Back then testing websites in a browser was relatively simple. These were the
    older days, when there were dozens of browsers to choose from and JS was still
    spilled “JavaScript.” Sites were small, functionality limited, and the interactions
    the user could have with the browser were limited to: just filling out a form
    and clicking a “submit” button. This was the world that Selenium was born into,
    and the APIs and functionality it offered were as focused as the platform tested.


    Then the world discovered XMLHttpRequest in Internet Explorer, it was implemented
    in Firefox, and suddenly “Web 2.0” became the new buzzword. Google Maps showed
    what browsers could do, and the world loved it! offering more functionality, driven
    by carefully handcrafted JS. Selenium adapted and evolved. I wrote the WebDriver
    APIs, and these came to the fore. Although they aimed to lead people in a certain
    direction, the underlying complexity of what Selenium was trying to automate meant
    that it became a more complicated tool.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'As I write this, browsers are more capable, powerful, and flexible than ever
    before. We don''t write "websites" any more. We write "web apps", the current
    ultimate expression of that being the "Single Page App" or SPA. These push browsers
    harder than ever, they''re a natural evolution. Unfortunately, once Selenium has
    evolved and grown to allow these kinds of apps to be automated, adding a range
    of new features in Selenium 4 to help cope with the new testing needs. Adding
    this functionality makes Selenium even more complicated tool.


    Despite having grown more complicated over the years, Selenium is a tool used
    by people of all levels of programming comfort and ability. There''s more to writing
    a successful Selenium test than "just learning the APIs. There''s a wealth of
    technology that surrounds it, from the test frameworks you can use, to the Design
    Patterns you can (and!) follow when writing the tests, how to manage the binary
    dependencies required by our tests. If we want our tests to run in a reasonable
    amount of time, we need to have access to infrastructure that supports this.


    There''s so much to learn, and there''s surprisingly little guidance for how all
    the pieces fit together.


    That''s why I''m glad Boni has written this book. It starts by explaining what
    Selenium is, and the various components within it, and then each chapter builds
    on the previous ones, gradually introducing more ideas and concepts in a way that
    feels natural and obvious.


    Better yet, Boni goes beyond just discussing how to use the raw APIs. He also
    describes the ecosystem of services, tools, and test runners that people need
    to understand from the most tool. His experience using Selenium and providing
    some of these supporting tools shines: you''re in the hands of a master here.


    The way this book is structured allows anyone using Selenium to dive in the point
    that feels right to them. Just getting started? Then start at the beginning of
    the book, Boni lays out the basics for you in an engaging and approachable way.
    Maybe you''re familiar with Selenium but want to know what''s new in Selenium
    4, or some of the less well-known features it offers? Just jump into the middle
    of the book; there''s so much there, even I learned a few things!


    One thing that I hope people take away from this book is that Selenium is only
    part of the puzzle that is automated testing. Boni covers this too, introducing
    readers (you!) how to integrate into your test frameworks, to the unit testing
    libraries you might want to use, and to Design Patterns that can keep your tests
    maintainable and fresh. After all, although it may take time to write an automated
    test in the first place, it can live for years, and being able to work on it with
    ease is important.'
  merge: -1
