    # Print Page


    Selenium WebDriver allows printing web pages to PDF documents. To do that, the
    Selenium WebDriver API provides the interface PrintsPage. This interface is inherited
    by the class RemoteWebDriver, and therefore, is available for all browsers supported
    by Selenium WebDriver. Nevertheless, there are slight differences when using one
    or another browser. For instance, printing pages is possible when using Chrome
    and Edge if the browser is started in headless mode. For Firefox, this restriction
    is not required, and we can use Firefox as usual. Example 5-47 shows the test
    logic for printing a web page to PDF. You can find the complete tests for Firefox
    and headless Chrome/Edge in the examples repository.


    Example 5-47. Test printing a web page to PDF


    ```

    @Test

    void print() throws Exception {

    driver.get("https://bonargcia.dev/selenium-webdriver-java/");

    PrintsPage pg = (PrintsPage) driver;

    PrintOptions printOptions = new PrintOptions();

    Pdf pdf = pg.print(printOptions);


    String pdfBase64 = pdf.getContent();

    assertThat(pdfBase64).contains("JVBER");


    byte[] decoded = Base64.Decoder().decode(pdf.getBytes(StandardCharsets.UTF_8));

    Path destinationfile = Paths.get("my-pdf.pdf");

    Files.write(destinationfile, decoded);

    }

    ```


    +   We cast the driver object to PrintsPage.


    +   We print the current web page to PDF using the default configuration.


    +   We get the content of the PDF in Base64.


    +   We verify this content contains the file signature (the "magic word") JVBER).


    +   We convert the Base64 to raw byte array.


    +   We write the PDF content (byte array) to a local file.'
