  md: "# Page Objects\n\nPage object classes enable the separation of the code devoted\
    \ to the UI, such as locators and page layout, from the test logic. We can see\
    \ page classes as a single repository that encapsulates the operations or services\
    \ provided by an application under test. These classes are instantiated as page\
    \ objects in different test cases. We can implement end-to-end tests using the\
    \ method exposed in these objects while avoiding code repetition.\n\nHere is a\
    \ basic example using page objects. In the following example, we refactor the\
    \ test explained in the previous section (i.e., using the login form) using a\
    \ page object instead of vanilla Selenium WebDriver. The first step is to create\
    \ a Java class that models the login page. Example 7-3 shows a very basic implementation\
    \ of this page class.\n\nExample 7-3. Basic page class to model the practice login\
    \ form\n\n```\npublic class BasicLoginPage {\\n    WebDriver driver;\n\n    By\
    \ usernameInput = By.id(\"username\");\n    By passwordInput = By.id(\"password\"\
    );\n    By submitButton = By.cssSelector(\"button\");\n    By successBox = By.id(\"\
    success\");\n\n    public BasicLoginPage(WebDriver driver) {\n        this.driver\
    \ = driver;\n    }\n\n    public void get() {\n        driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/login-form.html\"\
    );\n    }\n\n    public void with(String username, String password) {\n      \
    \  driver.findElement(usernameInput).sendKeys(username);\n        driver.findElement(passwordInput).sendKeys(password);\n\
    \        driver.findElement(submitButton).click();\n    }\n\n    public boolean\
    \ successBoxPresent() {\n        return driver.findElement(successBox).isDisplayed();\n\
    \    }\n}\n```\n\nWe declare a WebDriver class attribute. This variable is used\
    \ in the page object to implement the interaction with the web page."
