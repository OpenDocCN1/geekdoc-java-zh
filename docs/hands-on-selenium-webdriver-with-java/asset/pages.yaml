    happen (while collecting these exceptions) | @Rule

    public ErrorCollector collector = new ErrorCollector();

    <br>@Test

    public void test() {

    collector.checkThat("a", equalTo("b"));

    collector.checkThat(1, equalTo("2\));

    } |'
