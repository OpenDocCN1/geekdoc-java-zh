    \ using the Page Factory provided by Selenium WebDriver\n\n```\npublic class FactoryLoginPage\
    \ extends ExtendedBasePage {\n\n  @FindBy(id = \"username\")\n  @CacheLookup\n\
    \  WebElement username;\n\n  @FindBy(id = \"password\")\n  @CacheLookup\n  WebElement\
