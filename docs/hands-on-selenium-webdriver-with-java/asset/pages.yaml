    \nFigure 5-9. Selenium WebDriver architecture with and without a web proxy\n\n\
    The Selenium WebDriver API provides a Proxy class to configure a web proxy. This\
    \ class is configured into a WebDriver object using capabilities. Example 5-18\
    \ illustrates how.\n\nExample 5-18. Test setup to configure a web proxy\n\n```\n\
    @BeforeEach\nvoid setup() {\n    Proxy proxy = new Proxy(); ❶\n    String proxyStr\
    \ = \"proxy:port\"; ❷\n    proxy.setHTTPProxy(proxyStr); ❸\n    proxy.setSSLProxy(proxyStr);\
    \ ❹\n\n    ChromeOptions options = new ChromeOptions();\n    options.setAcceptInsecureCerts(true);\
    \ ❺\n    options.setProxy(proxy); ❻\n\n    driver = WebDriverManager.chromedriver().capabilities(options).create();\n\
    }\n```\n\n+   ❶ We create an instance of the class Proxy.\n② The syntax required\
    \ to specify a proxy is host:port."
