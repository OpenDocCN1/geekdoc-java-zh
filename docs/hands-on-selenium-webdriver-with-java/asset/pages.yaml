  md: '# About the Author


    Boni García (https://bonigarcia.dev) is a visiting professor at Universidad Carlos
    III de Madrid (UC3M) in Spain. He is passionate about software engineering with
    an emphasis on automated testing. He is the author of more than 45 publications,
    including international conferences, journals, book chapters, and the book Mastering
    Software Testing with JUnit 5 (Packt). He is the creator and maintainer of different
    open source projects related to Selenium, including DriverManager (a well-known
    library for Selenium WebDriver in Java) and Selenium-Jupiter (a JUnit 5 extension
    for Selenium WebDriver).


    He presented his PhD dissertation, focused on automated web navigation and testing,
    in 2011. The reference implementation of this work used Selenium IDE and Remote
    Control as foundational tools. He continued researching testing from 2013 to 2020,
    participating in the open source projects Kuretto, OpenVidu, and ElastTest. In
    this period, he adopted Selenium WebDriver as the fundamental framework to assess
    WebRTC applications and Quality of Experience. Currently, he continues actively
    with Selenium. His latest publications focus on the Selenium ecosystem and automated
    driver management in Selenium WebDriver. He started to collaborate with Sauce
    Labs as an open source engineer in 2022.


    # Colophon


    The animal on the cover of Hands-On Selenium WebDriver with Java is a crested
    shriketit (Falculunculus frontatus). Endemic to mainland Australia, these striking
    birds can be found in eucalyptus forests and woodlands, forested gullies, and
    along rivers in drier areas. This species can sometimes be located by listening
    for its plaintive whistle, as it often mimics other birds, identification can
    be difficult.


    The crested shriketit is a medium-sized bird with a black-and-white striped head,
    a small crest, and a short bill with a hooked tip. It has fine, rounded wings
    and a square, slightly forked tail. The males are larger than females, and can
    also be distinguished by their black throats (females have olive green throats).
    The shriketit feeds on insects, but sometimes also consumes fruit and seeds. The
    birds afford by using its strong beak to tear at or probe bark for insects. Shriketits
    usually forage alone, but can be found in pairs, groups of up to five individuals
    (usually a family group), or in mixed flocks with other insect-eating birds.


    The breeding season of a crested shriketit usually lasts from August to January.
    The male shriketit selects a nest site in a high fork of a eucalyptus tree, attracting
    the female to him with quivering and waving wings. The female builds a deep cone-shaped
    nest from dry grass and bark strips, covering the outside with spider webs, moss,
    and lichen. The male helps collect materials, and both sexate the eggs'
  merge: -1
  pgno: 419
- img_proc: true
  md: 'and feed the young. The incubation period lasts about 20 days. Two broods may
    be raised in a season, and the young birds often remain with their parents until
    the beginning of the next breeding season. The nests are often parasitized by
    various cuckoo species.


    Among all the species of the crested shriket, the northern subspecies, *whitei*,
    is the one most at threat of extinction. It is endangered in Western Australia,
    occurring in such low densities in some areas that populations may not be able
    to renew themselves and are isolated from each other. More importantly, the hot
    and widespread fires in the dry season decrease the ability of insects to establish
    themselves under the bark, hence reducing the shriket''s main source of food.
    The western subspecies, *leucogaster*, is also near-threatened and is affected
    by land clearing in the wheat belt. The eastern subspecies, *frontatus*, is adversely
    threatened by urban development. Many of the animals on O''Reilly covers are endangered;
    all of them are important to the world.


    The cover illustration is by Karen Montgomery, based on an antique line engraving
    from *Lydekker''s Royal Natural History*. The cover fonts are Gilroy Semibold
    and Guardian Sans. The text font is Adobe Minion Pro; the heading font is Adobe
    Myriad Condensed; and the code font is Dalton Maag Ubuntu Mono.'
