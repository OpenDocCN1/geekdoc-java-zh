  md: 'matrix:

    nos: [ ubuntu-latest, windows-latest, macos-latest ]njava: [ 8 ]


    +   steps: 4

    - name: Checkout GitHub repo

    - uses: actions/checkout@v2

    - name: Set up Java

    - uses: actions/setup-java@v2

    - with:

    - distribution: `temurin`n- java-version: ${{matrix.java}}

    - name: Start Xvfb

    - run: Xvfb :99 &\n- name: Test with Maven

    - run: mvn -8 test

    - name: Test with Gradle

    - run: ./gradlelew test


    The events that trigger the workflow are push (new commits in the repository)
    and pull_request (commits proposed by other developers).


    Two environment variables are:


    DISPLAY


    The browsers controlled by Selenium WebDriver, by default, need to be executed
    in an operating system with a graphical user interface. On the other side, the
    Linux distributions available in GitHub Actions are headless (i.e., without a
    graphical user interface). Thus, we use Xvfb (X virtual framebuffer) to run WebDriver
    tests on these Linux distributions. Xvfb is an in-memory display server for Unix-like
    systems that requires the declaration of the environment variable DISPLAY with
    the screen number for the graphical system in Linux (X11).


    WDM_GITHUBTOKEN


    GitHub hosts some of the drivers required by Selenium WebDriver (e.g., geckriver
    or operadir). When external clients (like DriverManager) make consecutive requests
    to GitHub, it eventually returns an HTTP error response (403, forbidden) due to
    its rate limit. DriverManager can make authenticated requests using a *personal
    access token* to avoid this problem. Figure C-2 shows the permissions granted
    to this token in the examples repository. All in all, this environment exports
    the value of this token. I keep the actual value of this token as a GitHub repository
    secret.


    For the sake of completeness, I execute the workflow in three different operating
    systems: Ubuntu (i.e., Linux), Windows, and macOS, using Java 8 in all of them.'
  merge: -1
  pgno: 396
- img_proc: true
  md: 'The workflow has five steps:


    +   1. Check out the repository.

    2. Set up Java 8 using Eclipse Adoptium.

    3. Start X virtual framebuffer.

    4. Run all tests with Maven.

    5. Run all tests with Gradle.


    ![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_397_0.png)


    Figure C-2. Permissions of the GitHub personal access token used in the examples
    repository


    # Dependabot


    To configure Dependabot, we need to include a file called dependabot.yml in the
    folder .github of our repository. Example C-7 shows this content in the examples
    repository.'
