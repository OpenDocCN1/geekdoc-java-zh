    \n# Navigation Targets\n\nWhen navigating web pages using a browser, by default,\
    \ we use a single page corresponding to the URL in the navigation bar. Then, we\
    \ can open another page in a browser tab. This second tab can be explicitly opened\
    \ when a link defines the target attribute, or the user can force navigation to\
    \ a new tab, typically by using the modifier key Ctrl (or Cmd in macOS) together\
    \ with the mouse click into a web link. Another possibility is opening pages in\
    \ windows. For instance, web pages typically use the JavaScript command window.open(url).\
    \ Another way of displaying different pages at the same time is using frames and\
    \ iframes. A frame is an HTML element type that defines a particular area (into\
    \ a set called frameset) where a web"
