    , \"640\");\n    deviceMetrics.put(\"pixelRatio\", 3.0);\n    deviceMetrics.put(\"\
    touch\", true);\n    mobileEmulation.put(\"deviceMetrics\", deviceMetrics);\n\
    \    mobileEmulation.put(\"userAgent\", \"Mozilla/5.0 (Linux; Android 4.2.1);\
    \ en-us; Nexus 5 Build/JOP40D) \\n        + \"WebKit/535.19 (KHTML, like Gecko)\\\
    \ \\n        + \"Chrome/18.0.1825.139 Mobile Safari/535.139\");\n    options.setExperimentalOption(\"\
    mobileEmulation\", mobileEmulation);\n    driver = DriverManager.edgedriver(options).capabilities(options).create();\n\
    }\n```\n\n+   We create a hashmap to store the individual attributes of an emulated\
    \ mobile, namely, width, height, pixelRatio, and touch.\n\n+   We set these attributes\
    \ by setting the label deviceMetrics in the mobile emulation map.\n\n+   We set\
    \ a custom user agent for a Chrome Mobile 18 in a Nexus 5 device.\n\n# Web Extensions\n\
    \nWeb extensions (also called add-ons or plug-ins) are programs that can modify\
    \ or enhance the default operation of a web browser. Users typically install web\
    \ extensions using web stores. These stores are web applications supported by\
    \ browser maintainers for hosting web extensions. Table 5-3 summarizes the web\
    \ stores for Chrome, Edge, and Firefox."
