  md: '# Exceptions in Java


    In Java, an exception is an event that disrupts the execution of a program. A
    class hierarchy is used to model different exception types in the standard Java
    API. The root of this hierarchy is the Throwable class. It has two subtypes:


    Error


    Irrecoverable problems. As a general rule, applications crash rather than handle
    these severe errors. Some examples are OutMemoryError or StackOverflow Error.


    Exception


    Recoverable problems. Applications can handle these exceptions using try-catch
    blocks. There are two types of Exception classes:


    Checked exceptions


    Classes that directly inherit the Throwable class (except RuntimeException and
    Error). These exceptions are validated at compile time, and therefore we must
    handle them with try-catch blocks or rethrowing throws. Examples of check exceptions
    are IoException or MalformedURLEException.


    Unchecked exceptions


    Classes that inherit from the RuntimeException class, is a subtype of Exception.
    These exceptions do not require being handled with try-catch or rethrowing with
    throws. Some examples of unchecked exceptions are NullPointerException or ArrayIndexOutOfBoundsException.


    Table 4-10. Usual WebDriver exceptions and common causes


    | Exception | Description | Common causes |

    |---|---|--|

    | NoSuchElementException | Web element not available | - Invalid locator strategy<br>-
    The element has not been rendered (maybe you need to wait for it) |

    | NoAlertPresentException | Dialog (alert, prompt, or confirm) not available |
    Trying to perform an action (e.g., accept() or dismiss()) on an unavailable dialog
    |

    | NoSuchWindowException | Window or tab not available | Trying to switch into
    an unavailable window or tab |

    | NoSuchFrameException | Frame or iframe not available | Trying to switch into
    an unavailable frame or iframe |

    | InvalidArgumentException | Incorrect argument when calling method of the Selenium
    WebDriver API | - Bad URL in navigation methods<br>- Nonexistent path when uploading
    files<br>- Bad argument type in a JavaScript script |'
