  md: "Although DriverManager quits the WebDriver objects automatically, I recommend\
    \ you do it explicitly in each test. Otherwise, in the typical case of executing\
    \ a test suite, all browsers remain open until the end of the test execution.\n\
    \n# WebDriver Methods\n\nThe WebDriver interface provides a group of methods that\
    \ are the basis of the Selenium WebDriver API. Table 3-2 presents a summary of\
    \ these methods. Example 3-3 shows a basic test using several of these methods.\n\
    \nTable 3-2. WebDriver methods\n\n| Method | Return | Description |\n|---|---|---|n|\
    \ get(String url) | void | Load a page in the current browser. |\n getCurrentURL()\
    \ | String | Get the URL currently loaded in the browser. |\n getTitle() | String\
    \ | Get the title (<HTML tag>) of the current web page. |\n findElement(By by)\
    \ | WebElement | Find the first WebElement using a locator in the current web\
    \ page. In other words, if several elements match the locator, the first one (in\
    \ the Document Object Model [DOM]) is returned (see *Locating Elements on page\
    \ 59 for details). |\n findElements(By by) | List<WebElement> | Find every WebElement\
    \ using a locator in the current web page (also see *Locating Elements on page\
    \ 59*). |\n getPageSource() | String | Get the HTML source code of the current\
    \ web page. |\n navigate() | Navigation | Access the browser handle and navigate\
    \ to a URL (see *Chapter 4*). |\n getWindowTitle() | String | Get the window handle,\
    \ i.e., a unique identifier for the window in the current browser (see *Chapter\
    \ 4*). |\n getHandles() | Set<String> | Get the set of window handles open in\
    \ the current browser (see *Chapter 4*). |\n switchTo() | TargetLocator | Select\
    \ a frame or window in the current browser (see *Chapter 4*). |\n manage() | Options\
    \ | Generic utility for managing aspects of the browser (e.g., browser size and\
    \ position, cookies, timeouts, or.). |\n close() | void | Close the current window,\
    \ quitting the browser if there are no more windows opened. |\n quit() | void\
    \ | Close all windows and quit the browser.|\n\n![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_78_0.png)\n\
    \nFrom now on, I illustrate the examples using only the test logic. These tests\
    \ use a WebDriver object created before the test (in the setup method) and closed\
    \ after the test (in the teardown method). As a convention, I show JUnit 5 tests\
    \ in the book (although you can find them also for JUnit 4, Selenium-Jupiter,\
    \ and TestNG in the examples repository)."
