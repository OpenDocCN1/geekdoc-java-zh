    \nHTTP provides two built-in mechanisms for recognizing a user's identity, called\
    \ basic and digest authentication. Both methods allow the user's credential using\
    \ a pair of values: username and password. The difference between them is how\
    \ they communicate the credentials. On the one hand, the digest authentication\
    \ method sends encrypted credentials by applying a hash function to username and\
    \ password. On the other hand, basic authentication uses Base64 to encode (not\
    \ encrypt) the credentials.\n\nSelenium WebDriver provides the interface HasAuthentication\
    \ to seamlessly implement basic and digest authentication. Example 5-30 shows\
    \ a test using Chrome and digest authentication. You can use the exact mechanism\
    \ with Edge and digest authentication(see the complete test in the example repository).\n\
    \nExample 5-30. Test using basic authentication with Chrome\n\n```\n@Test\nvoid\
    \ testBasicAuth() {\n    ((HasAuthentication) driver)\n        .register((UsernameAndPassword(\"\
    guest\", \"guest\")));\n\n    driver.get(\"https://www.w3.org/HTTP/Basic/\");\n\
    \n    WebElement body = driver.findElement(By.tagName(\"body\"));\n    assert(body.getText().contains(\"\
    Your browser made it!\"));\n}\n```\n\n+   * We cast the driver object to HasAuthentication\
    \ and register the credentials (username and password).\n* We open a website posted\
    \ with basic authentication.\n* We verify the page content is available.\nWhen\
    \ using other browsers (such as Firefox), we cannot cast the driver object to\
    \ HasAuthentication. Nevertheless, there is a general way to set the credentials\
    \ in the URL using the syntax protocol:://username:password@domain. Example 5-30\
    \ demonstrates this use."
