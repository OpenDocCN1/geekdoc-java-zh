    \ driver) {\n    // Same test logic as examples before\n}\n```\n\n+   When using\
    \ different parameter resolvers in a JUnit test, convention, we must first declare\
    \ the parameters injected due to @ParameterizedTest, and then the parameter injected\
    \ by extensions (Selenium-jupiter in this case, for Web Driver objects).\n\n#\
    \ Cross-Browser Testing\n\nCross-browser testing is a kind of functional testing\
    \ in which we verify that a web application works as expected using different\
    \ types of browsers. A possible way to implement cross-browser tests is through\
    \ parameterized tests using the browser type (i.e., Chrome, Firefox, Edge, etc.)\
    \ as the test parameter. The following sections describe how to use the unit testing\
    \ framework capabilities for parameterized testing applied to cross-browser testing.\
    \ We will use local browsers (Chrome, Firefox, and Edge) in these examples. An\
    \ alternative way to carry out cross-browser testing is to use remote browsers\
    \ (from a Selenium Server, cloud provider, or Docker), as explained in Chapter\
    \ 6.\n\n# JUnit 4\n\nExample 8-5 shows a cross-browser test implemented with JUnit\
    \ 4. We use WebDriverManager to manage the parameterization. As explained in “Generic\
    \ Manager on page 353, WebDriverManager can use one or another manager depending\
    \ on the value of a parameter. This parameter can be a WebDriver class, an enumeration,\
    \ or the browser name. We use the latter in the following examples (although you\
    \ can find the alternative methods in the examples repository)."
