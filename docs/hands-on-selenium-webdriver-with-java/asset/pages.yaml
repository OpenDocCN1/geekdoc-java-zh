    \ DriverManager uses the latest version available in Docker Hub for the dockerized\
    \ browser. Nevertheless, we can force the use of a given version (e.g., 94.0).\
    \ Moreover, different wildcards are valid for specifying the following versions:\n\
    \nlatest\nTo use the latest version (default option).\n\nlatest-N\nTo use a previous\
