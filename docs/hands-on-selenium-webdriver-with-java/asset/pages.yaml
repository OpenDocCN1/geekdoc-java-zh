    , 6));\n  }\n} | | |\n| @NullSource | A single null argument | @ParameterizedTest\n\
    @ValueSource(strings = { \"one\", \"two\" })\n@NullSource\nvoid test(String argument)\
    \ {\n  log.debug(\"{}\", argument);\n} | arg: one\narg: two\narg: null |\n| @EmptySource\
