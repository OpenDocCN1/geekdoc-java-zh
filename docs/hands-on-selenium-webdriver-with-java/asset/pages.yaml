    # Selenium Grid


    Selenium Grid 4 has been completely rewritten from scratch. The new codebase has
    been created with all the learning from Selenium Grid 3, improving its source
    code maintainability. Selenium Grid 4 supports the classical mode implemented
    in version 3, i.e., the standalone and the hub-nodes architecture. In addition,
    Selenium Grid provides a fully distributed architecture to improve its performance
    and scalability. Finally, Selenium Grid 4 uses modern infrastructure technologies
    such as Docker, Kubernetes, or distributed tracing using OpenTelemetry.


    > "Selenium Grid" on page 6 provides an introduction to Selenium Grid. Then, "Selenium
    Grid" on page 203 explains the details of the different modes of Selenium Grid
    (i.e., standalone, hub-nodes, and fully distributed), and how to use it from Selenium
    WebDriver tests.


