  md: "useUnlimitedThreads\nTo allow an unlimited number of threads.\n\nThere are\
    \ two ways to specify these configuration parameters. First, we can configure\
    \ them directly from the Maven configuration file (i.e., the pom.xml file). Example\
    \ 8-30 demonstrates forking. In addition, we can specify these parameters as system\
    \ properties when using the command line, for example:\n\n```\nmvn test -Dparallel=classesAndMethods\
    \ -DthreadCount=4\n```\n\n# Example 8-30. Maven Surefire configuration sample\
    \ for parallel execution\n\n```\n<build>\n  <plugins>\n    <plugin>\n      <groupId>org.apache.maven.plugins</groupId>\n\
    \      <artifactId>maven-surefire-plugin</artifactId>\n      <version>${maven-surefire-plugin.version}</version>\n\
    \      <configuration>\n        <parallel>classesAndMethods</parallel>\n     \
    \   <threadCount>4</threadCount>\n      </configuration>\n    </plugin>\n  </plugins>\n\
    </build>\n```\n\nThe second way to implement parallelism with Maven Surefire is\
    \ forking, i.e., creating multiple JVM processes. This option can be helpful if\
    \ we want to prevent thread-level concurrency issues since different processes\
    \ do not share memory, as happens in multithreading. As a drawback, forking consumes\
    \ more memory and has lower performance. To enable forking, we need to use the\
    \ forkCount configuration property (again, in the pom.xml or as a system property)\
    \ to a value higher than one (i.e., the number of JVM process to be created).\
    \ For example, the following command executes the tests of a Maven project using\
    \ four JVM processes:\n\n```\nmvn test -DforkCount=4\n```\n\n# Gradle\n\nGradle\
    \ also provides several ways to execute tests in parallel. First, it allows executing\
    \ tasks in parallel in a multimodule project. There are two ways to enable this\
    \ mode. First, by setting the property org.gradle.parallel=true in the configuration\
    \ file gradle.properties. Second, using the option --parallel in the command,\
    \ for example:\n\n```\ngradle test --parallel\n```"
