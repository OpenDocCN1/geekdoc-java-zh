    /\"\n  schedule:\n    interval: daily\n    time: '06:00'\n  open-pull-requests-limit:\
    \ 99\n  package-ecosystem: github-actions 3\n  directory: \"/\"\n  schedule:\n\
    \    interval: daily\n    time: '06:00'\n  open-pull-requests-limit: 99\n```\n\
    \n① We check daily the updates for the Maven dependencies.\n\n② We check daily\
    \ the updates for the Gradle dependencies.\n\n③ We check daily the updates for\
    \ the GitHub Actions setup.\n\n# Summary\n\nAll the examples presented in this\
    \ book are available in a public GitHub repository. This appendix showed the fine-grained\
    \ configuration details for the build tools (Maven and Gradle), dependencies (Selenium\
    \ WebDriver, JUnit, TestNG, Selenium-Jupiter, DriverManager, etc.), logging (Logback\
    \ and SLF4J), and other services (GitHub Actions, GitHub Pages, and Dependabot)."
