    # JUnit 5


    In JUnit 5, the Jupiter extension model replaced and improved the former lifecycle
    management of JUnit 4 based on rules. As introduced in Chapter 2, the extension
    model provided by Jupiter allows new features on the top of the Jupiter programming
    model. This way, a Jupiter extension is a Java class that implements one or more
    extension points, which are interfaces that allow different types of operations
    in the Jupiter programming model. Table 8-4 summarizes the extension points provided
    by Jupiter.


    Table 8-4. Jupiter extension points


    | Category | Description | Extension point(s) |

    | --- | --- | --- |

    | Test lifecycle | To include custom logic during the test lifecycle | BeforeAllCallback<br>BeforeEachCallback<br>BeforeTestExecutionCallback<br>AfterTestExecutionCallback<br>AfterEachCallback<br>AfterAllCallback
    |

    | Parameter resolution | To inject parameters into test methods or constructors
    | ParameterResolver |

    | Test templates | To implement tests using @Template | TestContextProvider |

    | Conditional execution | To enable or disable tests depending on custom conditions
    | ExecutionCondition |

    | Exception handling | To handle exceptions during the test and its lifecycle
    | TestExecutionExceptionHandler<br>LifecycleMethodExceptionHandler |

    | Test instance | To create and process test instances | TestInstanceFactory<br>TestInstancePostProcessor<br>TestInstancePreDestroyCallback
    |

    | Intercepting invocations | To intercept calls to test code (and decide whether
    or not calls proceed) | InvocationInterceptor |


    A convenient point for implementing failure analysis is AfterTestExecutionCallback,
    since it allows including custom logic immediately after an individual test has
    been executed. Example 8-21 provides a Jupiter test using a custom annotation
    (Example 8-22) implementing this extension point.'
