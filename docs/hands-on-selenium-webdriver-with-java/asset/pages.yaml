    # Waits and timeouts


    The parameters to specify timeouts have switched from TimeUnit to Duration. Table
    A-4 details this change. You can see more detail in "Waiting Strategies" on page
    94 and page 110.


    # Table A-4. Migration of waits and timeouts in Selenium WebDriver 4


    | Selenium WebDriver 3 | Selenium WebDriver 4 |

    | --- | --- |

    | `new WebDriverWait(driver, 3).until(ExpectedConditions.elementToBeClickable(By.id("id")));`
    | `new WebDriverWait(driver, Duration.ofSeconds(3)).until(ExpectedConditions.elementToBeClickable(By.id("id")));`
    |

    | `Wait-WebDriver wait = new FluentWait<WebDriver>(driver).withTimeout(30, TimeUnit.SECONDS).polling(5,
    TimeUnit.SECONDS).ignoring(NoSuchElementException.class);` | `Wait-WebDriver wait
    = new FluentWait<WebDriver>(driver).withTimeout(Duration.ofSeconds(30)).polling(Duration.ofSeconds(5)).ignoring(NoSuchElementException.class);`
    |

    | `driver.manager().timeout().implicitlyWait(10, TimeUnit.SECONDS);driver.manager().timeout().setScriptTimeout(30,
    TimeUnit.MINUTES);driver.manager().timeout().pageLoadTimeout(30, TimeUnit.SECONDS);`
    | `driver.manager().timeout().implicitlyWait(Duration.ofSeconds(10));driver.manager().timeout().setScriptTimeout(Duration.ofSeconds(3));driver.manager().timeout().pageLoadTimeout(Duration.ofSeconds(30));`
    |


    # Event listeners


    In Selenium WebDriver 3, we used the EventEventListener to create event listeners.
    This class is deprecated in Selenium WebDriver 4, and instead, the EventFiringDecorator
    is recommended. Table A-5 summarizes this change. "Event Listeners" on page 138
    contains a complete example of this feature.


    # Table A-5. Migration of event listeners in Selenium WebDriver 4


    | Selenium WebDriver 3 | Selenium WebDriver 4 |

    | --- | --- |

    | `new EventFiringWebDriver driver = new EventFiringWebDriver(originalDriver);
    wrapper.register(myListener);` | `new EventFiringWebDriver driver = new EventFiringDecorator(myListener).decorate(originalDriver);`
    |'
