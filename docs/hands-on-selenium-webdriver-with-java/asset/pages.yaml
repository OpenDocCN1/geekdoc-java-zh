    ```

    gradle test -Dwebdriver.chrome.driver=/path/to/drivers/chromedriver

    gradle test -Dwebdriver.edge.driver=/path/to/drivers/msedgedriver

    gradle test -Dwebdriver.geckodriver.driver=/path/to/drivers/geckodriver

    ```


    # Example B-2. Java commands to configure system properties


    ```

    System.setProperty("webdriver.chrome.driver", "/path/to/drivers/chromedriver");

    System.setProperty("webdriver.edge.driver", "/path/to/drivers/msedgedriver");

    System.setProperty("webdriver.geckodriver.driver", "/path/to/drivers/geckodriver");

    ```


    # Maintenance


    Last not best, the final step of driver management is to maintain these drivers.
    This maintenance is necessary because evergreen browsers (such as Chrome, Edge,
    or Firefox) upgrade themselves automatically. Although appealing from a user perspective,
    this updated upgrade is problematic for Selenium WebDriver scripts where the driver
    management is manual. In this case, driver and browser compatibility is not guaranteed
    in the long run.


    A specific driver (e.g., chromedriver version 84.0.4147.30) is typically compatible
    with a given browser version (e.g., Chrome 84). Eventually, this compatibility
    is not guaranteed because of the automatic upgrade. As a result, a Selenium WebDriver
    script based on this driver stops working (i.e., the test is said to be broken).
    In practice, Selenium WebDriver developers experience this problem when tests
    fail due to driver and browser incompatibility. For instance, when using Chrome
    as a browser, a broken test due to incompatibility reports the following error
    message: "this version of chromedriver only supports Chrome N" (where N is the
    latest version of Chrome supported by a particular version of chromedriver). To
    illustrate this Figure B-2 shows the worldwide search interest that error message
    on Google during 2019 and 2020, together with the release date of the different
    Chrome versions in this period. As you can see, the interest over concerning this
    error message is related to some Chrome releases.'
