    # # Summary


    Selenium WebDriver is a library that allows you to control web browsers programmatically.
    The automation is based on the native capabilities of each browser. Therefore,
    we need to place a platform-dependent binary file called driver between the script/test
    using Selenium WebDriver API and the browser. Some examples of drivers are chromedriver
    (for Chrome), geckodriver (for Firefox), and msedgedriver (for Edge). This appendix
    appended the driver management process. This process has three steps (download,
    setup, and maintenance), and it can be done either manually or automatically.
    By default, I recommend using an automated driver management approach. To aim
    for that, the reference tool in Java is WebDriver.'
