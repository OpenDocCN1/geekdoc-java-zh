    # The Chrome DevTools Protocol


    Chrome DevTools is a set of developer tools for Chromium-based web browsers, such
    as Chrome and Edge. These tools allow inspecting, debugging, or profiling these
    browsers, among other functions. The Chrome DevTools Protocol (CDP) is a communication
    protocol that allows the manipulation of the DevTools by external clients. Firefox
    implements a subset of the CDP to support automation tools like Selenium WebDriver.


    There are two ways to use CDP in Selenium WebDriver. Selenium WebDriver provides
    the interface HasDevTools for sending CDP commands to the browser. This interface
    is implemented by ChromeDriver (used for Chrome and Edge) and FirefoxDriver (for
    Firefox). This mechanism is quite powerful since it provides direct access to
    the CDP with Selenium WebDriver. Nevertheless, it has a relevant limitation since
    it is tied to both the browser type and version.


    For this reason, the Selenium WebDriver API provides a second way to use the CDP,
    based on a set of wrapper classes built on top of CDP for advanced manipulation
    of the browsers. These wrappers allow different operations, such as network traffic
    interception or basic digest authentication. The following subsection explains
    these wrappers. After that, I present several examples for using the CDP commands


    # CDP Selenium Wrappers


    The Selenium WebDriver API contains a group of helper classes that wraps some
    of the CDP commands. These classes aim to provide a friendly API enabling advanced
    features for Selenium WebDriver tests.'
