  md: '# Locating CSS selectors


    The strategies we have seen so far are easy to apply but also have some limitations.
    First, locating by tag name can be tricky since it is likely the same tag will
    occur many times on a web page. Finding elements by HTML attributes (name, id,
    or class) is a limited approach since these attributes are not always available.
    In addition, ids are generated and volatile between different sessions. Lastly,
    the location by link text is limited to only links. To overcome these limitations,
    Selenium WebDriver provides two powerful location strategies: CSS selector and
    XPath.


    There are many possibilities for creating CSS selectors. Table 3-5 shows a comprehensive
    summary with the basic CSS selectors.


    Table 3-5. Basic CSS selectors

    | Category Syntax | Description | Example | Example explanation |

    | --- | --- | --- | --- |

    | Universal * | Select all elements | * | Match all elements |

    | Type element | Select elements with a given tag name | Input | Match all <input>
    elements |

    | Class .classname | Select elements with a given class attribute | .form-control
    | Match all elements with class of form-control |

    | ID #id | Select elements with a given id | #my-text-id | Match all elements
    with id my-text-id |

    | Attribute [attr] | Select elements with a given attribute | [target] | Match
    all elements with a target attribute |

    | [attr=value] | Select elements with a given attribute and value | [target=_blank]
    | Match all elements with a target=_blank attribute |

    | [attr~value] | Select elements with a given attribute containing some text value
    | [title~hands] | Match all elements with a title attribute containing the word
    hands |

    | [attr|=value] | Select elements with a given attribute equal or starting with
    some value | [lang|en] | Match all elements equal or starting with en |

    | [attr^=value] | Select elements with given attribute starting by some value
    | a[href^="https"] | Match all links whose href starts with https |

    | [attr$=value] | Select elements with given attribute ending by some value |
    a[href$="pdf"] | Match all links whose href ends with .pdf |

    | [attr*=value] | Select elements with a given attribute containing some string
    | a[href*="github"] | Match all links whose href attribute contains github |


