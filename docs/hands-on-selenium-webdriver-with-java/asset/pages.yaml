    | Category | Syntax | Description | Example | Example explanation |

    |---|---|---|---|---|

    | Attributes | contains(@attr, ''string'') | Check if an attribute contains a
    string | //a[contains(@href, ''github'')] | Match links with href containing github
    |

    | | starts-with(@attr, ''string'') | Check if an attribute starts with a string
    | //a[starts-with(@href, ''https://'')] | Match all links using HTTPS |

    | | ends-with(@attr, ''string'') | Check if an attribute ends with a string |
    //a[ends-with(@href, https)]] | Match all links to PDF documents |

    | Text | text()=''string'' | Locate elements based on text content | //*[text()=click]
    | Match all elements with the text click |

    | Child nodes | [index] | Locate elements | //div/*[0] | First child of a <div>
    |

    | | or | Logic operator | //[@type=''submit'' or @type=''reset''] | Match buttons
    to submit and clear forms |

    | | and | Logic operator | //[@type=''submit'' and @id=''my-button''] | Match
    buttons with a given id |

    | | not() | Logic operator | //[@type=''submit'' and not @id=''my-button''] |
    Match buttons different to an id |

    | Axes (used to locate relative nodes) | following::item | Nodes that come after
    the current one | Match all fields after the first text input |

    | | descendant::item | Select descendant elements (child, etc.) of current node
    | //*[@id=''my-id'']//descendant::a | Match all descendant links from a given
    parent node |

    | | ancestor::item | Select ancestor elements (parent, etc.) of current node |
    //input[@id=''my-id'']//ancestor::label | Match all antecedent labels from a given
    input text |

    | | child::item | Select children elements of current node | //*[@id=''my-id'']//child::id
    | Match all list element under a given node |

    | | preceding::item | Select all nodes that come before the current one | //*[@id=''my-id'']//preceding::input
    | Match all input before a given node |

    | | following-sibling::item | Select following nodes that come before the current
    one | //*[@id=''my-id'']//following-sibling::input | Match the next input before
    a given node |

    | | parent::item | Select parent of the current node | //*[@id=''my-id'']//parent::div
    | Match the parent div element of a given node |


