    on the element and selecting the option menu "Copy". This mechanism allows getting
    the full CSS or XPath selector. This can be the first approach to generate a locator
    quickly, although I do not recommend using these locators directly since they
    tend to be brittle (i.e., linked to the current page layout) and are hard to


