    # Timeouts


    Selenium WebDriver allows specifying three types of timeouts. We can use them
    by invoking the method manage().timeouts() in the Selenium WebDriver API. The
    first timeout is the implicit wait, already explained in "Implicit Wait" on page
    94 (as part of waiting strategies). The other options are page loading and script
    loading timeouts, explained next.


    # Page Loading Timeout


    The page loading timeout provides a time limit to interrupt a navigation attempt.
    In other words, this timeout limits the time in which a web page is loaded. When
    this timeout (with a default value of 30 seconds) is exceeded, an exception is
    thrown. Example 4-7 shows an example of this timeout. As you can see, this piece
    of code is a dummy implementation of a negative test. In other words, it checks
    unexpected conditions in the SUT.'
