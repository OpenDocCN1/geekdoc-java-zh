    # Fluent Wait


    The last strategy is a fluent wait. This mechanism is a generalization of explicit
    waits. In other words, we use fluent waits for pausing the test until certain
    conditions, but in addition, fluent waits provide fine-grained configuration capabilities.
    Table 3-12 summarizes the methods available in FluentWait. As its name suggests,
    this class provides a fluent API, and therefore, we can chain several invocations
    in the same line. Example 3-30 shows a test using fluent wait.


    | Method | Description |

    | --- | --- |

    | withTimeout(Duration timeout) | Timeout Java Duration |

    | pollingEvery(Duration interval) | How the condition is evaluated (five hundred
    ms by default) |

    | withMessage(String message) withMessage(Supplier<String> messageSupplier) |
    Custom error message |

    | ignoring(Class<? extends Throwable> exceptionType) | Ignore specific exceptions
    waiting for a condition |

    | ignoring(Class<? extends Throwable> firstType, Class<? extends Throwable> secondType)
    ignoreAll(Collection<Class<? extends Throwable>> types) | |


