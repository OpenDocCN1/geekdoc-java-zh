- img_proc: true
  md: 'Table 3-8. Pros, cons, and typical use cases of the different locating strategies


    | Locator | Pros | Cons | Typical use case |

    |---|---|---|--|

    | By attribute (id, name, class) | Easy to use | These attributes are not always
    available | Elements that define these attributes immutably (i.e., it does not
    change dynamically) |

    | By link text (total or partial) | Easy to use | Only available for links | For
    links |

    | By tag name | Easy to use | Hard to select one element when the tag repeatedly
    appears on the page | When the tag is unique, or the resulting DOM node has a
    fixed position |


    | CSS selector or XPath | Very powerful | It is not easy to write robust selectors
    | For complex locators |

    | Compound locators | Easy way to compose existing locators | Limited to specific
    situations |


    | Relative locators | Human language approach | It needs to be combined with other
    locators | Find element based on the relative position (above, below, near, etc.)
    of a known element |


    As you can see in this table, CSS selectors and XPath share the same pros, cons,
    and use cases. Does it mean these strategies are the same? The answer is no. Both
    are very powerful and allow the creation of complex locators. Nevertheless, there
    are relevant distinctions between them. Table 3-9 summarizes these differences.


    Table 3-9. Some differences between XPath and CSS selector


    | XPath | CSS selector |

    |---|--|

    | XPath allows bidirectional location, i.e., the traversal is from parent to child
    and vice versa | CSS allows one-directional locators, i.e., the traversal is from
    parent to child |

    | XPath is slower in terms of performance | CSS has faster performance than XPath
    |

    | XPath allows the identification of visible text on the screen using the text()
    function | CSS does not allow locating elements by their text content


    To better illustrate the difference between XPath and CSS selectors, Table 3-10
    compares specific locators using both strategies.


    Table 3-10. Examples comparing XPath and CSS selector


    | XPath | CSS selector |

    |---|--|

    | All elements | //* |

    | All div elements | //div | div |

    | Element by id | ////*[@id=''my-id''] | #my-id |

    | Element by class | //*[contains(@class=''my-class'')] | .my-class |

    | Element with attribute | ////*[@attr] | *[attr]'
