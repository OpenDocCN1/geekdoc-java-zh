    Compares different variations of the same application to determine which one is
    more effective for its end users.


    # Accessibility testing


    Evaluates if a system is usable by people with disabilities.


    We use Selenium WebDriver primarily to implement functional tests (i.e., interacting
    with a web application to assess the behavior). It is unlikely to use WebDriver
    to implement structural tests. In addition, although it is not its principal usage,
    and agile, we can use WebDriver to implement nonfunctional tests, e.g., for security,
