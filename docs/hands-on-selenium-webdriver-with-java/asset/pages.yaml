    \ univocally identifies the type of web browser. The context development code\
    \ name, version, platform, and other information. Example 5-7 shows a test setup\
    \ illustrating the use of this feature.\n\nExample 5-7. Test setup using device\
    \ emulation by specifying individual attributes\n\n```\n@BeforeEach\nvoid setup()\
    \ {\n    EdgeOptions options = new EdgeOptions();\n    Map<String, Object> mobileEmulation\
    \ = new HashMap<>();\n    Map<String, Object> deviceMetrics = new HashMap<>();\n\
