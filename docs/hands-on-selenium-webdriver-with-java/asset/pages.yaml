  md: "This page uses an open source JavaScript library called Signature Pad to draw\
    \ signatures in HTML canvas using the mouse. Example 3-25 shows a test using it.\n\
    \nExample 3-25. Test drawing a circumference on a canvas\n\n```\n@Test\nvoid testClickAndHold()\
    \ {\n  driver.get(\n    \"https://www.bongarcia.dev/selenium-webdriver-java/draw-in-canvas.html\"\
    );\n  actions = new Actions(driver);\n\n  WebElement canvas = driver.findElement(By.TagName(\"\
    canvas\"));\n  actions.moveToElement(canvas).clickAndHold();\n\n  int numPoints\
    \ = 30;\n  for (int i = 0; i < numPoints; i++) {\n    double angle = Math.toRadians(360\
    \ * i / numPoints);\n    double x = Math.sin(angle) * radius;\n    double y =\
    \ Math.cos(angle) * radius;\n    actions.moveByOffset((int)x, (int)y);\n  }\n\
    \  actions.release(canvas).build().perform();\n}\n```\n\n+   1 We locate the canvas\
    \ by tag name.\n\n+   2 We move the mouse to this element with moveToElement()\
    \ and add the action clickAndHold() (for drawing to the canvas) to the actions\
    \ pipeline.\n\n+   3 We iterate a fixed number of points, using the equation to\
    \ find the points in a circumference.\n\n+   4 We use the circumference points\
    \ (x and y) to move the mouse by offset (moveOffsetY). Since the click is held\
    \ from the previous step, the resulting compound action will move the mouse while\
    \ the click button is pressed.\n\n+   5 We release the click, build the action,\
    \ and carry out the whole chain. As a result, a circumference should appear on\
    \ the canvas.\n\n# Copy and Paste\n\nThis last example for user gestures automates\
    \ a pervasive user action: copy and paste using the keyboard. Here, we use the\
    \ web form available on the practice website. Example 3-26 shows a test impersonating\
