  md: '# Alternatives to Selenium


    Selenium is currently the leading technology for implementing end-to-end tests.
    Nevertheless, it is not the only alternative available. This section provides
    an overview of other frameworks and libraries that also allow implementing end-to-end
    tests for web applications. In addition, the following subsections also review
    the main pros and cons of each of these alternatives. In my opinion, Selenium
    is still the reference solution for end-to-end testing since it is built to promote
    web standards (i.e., the W3C WebDriver and WebDriver BiDi) to support the automation
    process and, therefore, it guarantees cross-browser compatibility.


    # Cypress


    Cypress is a JavaScript end-to-end automated testing framework. As illustrated
    in Figure 10-6, the Cypress architecture consists of a Node.js process plus a
    tool called Test Runner executed in a browser.


    ![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_357_0.png)


    The Test Runner is an interactive web application that embeds a test based on
    Mocha (a JavaScript testing framework) plus the web application under test as
    two iframes. The Cypress code run in the same browser tab (i.e., in the JavaScript
    loop). The Node.js process communicates with the Test Runner using a WebSocket.
    Finally, the Node.js process is a proxy for the HTTP traffic between the Test
    Runner and the web application under test.


    The Cypress Test Runner is open source, licensed under the terms of the MIT license.
    The Cypress team also provides commercial support for advanced features. One of
    them is the Cypress Dashboard, a cloud-managed web application that allows tracking
    the tests executed in Test Runner. Table 10-5 summarizes some of the most relevant
    pros and cons of Cypress.'
  merge: -1
  pgno: 357
- img_proc: true
  md: '# Table 10-5. Cypress pros and cons


    | Pros | Cons |

    | --- | --- |

    | Automatic waiting and fast execution, since the test and the application run
    in the same browser | Only some browsers supported: Firefox and Chromium-based
    (including Chrome, Edge, and Electron), but not other browsers like Safari or
    Opera

    | Live reload (The Test Runner automatically keeps track of changes in the tests)
    | Since the application is executed in a browser iframe, certain operations are
    not allowed (e.g., drive different browsers or multiple tabs)


