    A picture of the web application UI after a test failure might help determine
    the failure cause. "Screenshots" on page 112 explains how to use the Selenium
    Web-Driver API to make screenshots.


    # Browser log


    The JavaScript console can be another potential source of information when an
    error occurs. "Log Gathering" on page 168 explains how to carry out this log gathering.


    # Session recordings


    We can easily record the browser session when using browsers in Docker containers.
    "Browsers in Docker Containers" on page 219 explains how to do this with DriverManager
    and Selenium-Jupiter.


    The following subsections provide basic examples for making browser screenshots
    of failed tests. To that aim, we need to relay in the unit testing specific features
    to detect failed tests.


