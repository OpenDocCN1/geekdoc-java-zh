  md: '# Software Testing Fundamentals


    Software testing (or simply *testing*) consists of the dynamic evaluation of a
    piece of software, called System Under Test (SUT), through a finite set of test
    cases (or simply *tests*), giving a verdict about it. Testing implies the evaluation
    of SUT using specific input values to assess the outcome or expected behavior.


    At first glance, we distinguish separate categories of software testing: manual
    and automated. On the one hand, in *manual testing*, a person (typically a software
    engineer or the final user) evaluates the SUT. On the other hand, in *automated
    testing*, we use specific software tools to develop and control their execution
    against the SUT. Automated tests allow the early detection of defects (usually
    called *bugs*) in the SUT while providing a large number of additional benefits
    (e.g., cost savings, fast feedback, test coverage, or reusability, to name a few).
    Manual testing can also be a valuable approach in some cases, for example, in
    *exploratory testing* (i.e., human testers investigate and evaluate the SUT).


    > There is no classification for the numerous forms of testing presented in this
    space. These concepts are subject to continuous evolution and debate, just like
    software engineering. Consider it proposal that can fit into a large number of
    projects.


    ![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_37_0.png)


    # Levels of Testing


    Depending on the size of the SUT, we can define different *levels of testing*.
    These levels define several categories in which software teams divide their testing
    efforts. In this book, I propose a stacked layout to represent the different levels
    (see Figure 1-5). The lower levels of this structure represent the tests aimed
    at verifying small pieces of software (called units). As we ascend in the stack,
    we find other tiers (e.g., integration, system, etc.) which the SUT integrates
    more and more components.


    | Acceptance | User testing (validation) |

    |---|---|

    | End-to-end | |

    | System | Development testing (verification) |

    | Integration | |

    | Unit | |


    Figure 1-5. Stack representation of the different levels of testing'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'The lowest of this stack is *unit testing*. At this level, we assess individual
    units of software. A unit is a particular observable element of behavior. For
    instance, units are typically methods or classes in object-oriented programming
    and functions in functional programming. Unit testing aims to verify that each
    unit behaves as expected. Automated unit tests usually run fast since each test
    executes a small amount of code. To achieve this isolation, we can use *doubles*,
    pieces of software that replace the dependent components of a unit. For example,
    a popular type of test in object-oriented programming is the *mock object*. A
    mock object mimics an actual object using some programmed behavior.


    The next level in **Figure 1-5** is **integration testing**. At this level, different
    units are composed to create composite components. Integration testing aims to
    assess the interaction between the involved units and expose defects in their
    interfaces.


    Then, at the *system testing* and *end-to-end* (E2E) levels, we test the software
    system as a whole. We verify these high-level features. The difference between
    system/end-to-end and integration testing is that the former involves all system
    components and the final user (typically impersonated). In other words, system
    and end-to-end testing assess the SUT through the User Interface (UI). This UI
    can be graphical (GUI) or nongographical (e.g., text-based or other types).


    # # The Test Pyramid


    The test pyramid is a classical representation of the levels of testing. Mike
    Cohn first coined this concept in 2009. In his original conception, Cohn recommended
    a large number of unit tests as the basis of testing efforts. The following levels
    (e.g., integration tests) are less numerous in each stage but typically more expensive
    (in terms of development and maintenance effort) and slow (in terms of execution
    time). This proposal might be impractical for many projects because unit tests
    are not always from a comprehensive testing suite. For, others define different
    shapes for the levels of testing, such as the *testing trophy* (in which the intermediate
    layer, the integration test, is the largest). Since the relevance of the different
    test can vary from one project to another, I use a basic structure to represent
    the different levels of testing.


    **Figure 1-6** illustrates the difference between system and end-to-end testing.
    As you can see, on the one hand, end-to-end testing involves the software system
    and its dependent subsystems (e.g., database or external services). On the other
    hand, system testing comprises only the software system, and these external dependencies
    are typically mocked.'
