    # # Summary and Outlook


    Selenium WebDriver allows controlling remote web browsers. This feature is feasible
    because the underlying communication protocol (W3C WebDriver) is based on JSON
    messages over HTTP. This way, the components of the Selenium architecture (Selenium
    Server, nodes, or client script) can be distributed (i.e., executed in different
    hosts). To use this feature in Java, we need to create an instance of WebDriver,
    typically passing two arguments: the Selenium Server URL and the required capabilities.
    We can start a Selenium Server infrastructure using Selenium Grid (standalone,
    hub-nodes, or fully distributed mode). Alternatively, we can use the managed services
    provided by a cloud provider (such as Sauce Labs, BrowserStack, LambdaTest, or
    CrossBrowserTesting, among others). Finally, we can use Docker to support a containerized
