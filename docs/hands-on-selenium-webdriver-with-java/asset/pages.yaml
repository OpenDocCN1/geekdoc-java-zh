  md: '# O''REILLY


    # Hands-On Selenium WebDriver with Java


    Get started with Selenium WebDriver, the open source library for automating tests
    to ensure your web application performs as expected. In this practical hands-on
    book, author Boni García takes Java developers through the main features of Selenium
    4 for automating web navigation, browser manipulation, element interaction, and
    more, with ready-to-be-executed tests.


    Discover why Selenium WebDriver is the de facto library for developing end-to-end
    tests on your web application. You''ll start by learning the core features of
    Selenium WebDriver, Grid, and IDE and its ecosystem. You''ll explore ways to use
    advanced Selenium WebDriver features, including using web browsers in Docker containers
    or the Chrome DevTools protocol. The Selenium WebDriver examples in this book
    are available on GitHub.


    With this book, you''ll learn to:


    +   - Set up a Java project containing end-to-end tests that use Selenium WebDriver

    - Use strategies for managing browser-specific capabilities and cross-browser
    testing

    - Interact with web forms, manage pop-up messages, or execute JavaScript

    - Control remote browsers and use advanced infrastructure for Selenium WebDriver
    tests in the cloud

    - Manage web pages using object-oriented classes to ease test maintenance and
    reduce code duplication


    > “If you dream about leveraging the power of Selenium WebDriver for automating
    end-to-end web testing, this book is for you.”


    Antonia Bertolino

    Research Director,

    Research Council of Italy


    > “This book paves the road to mastering Selenium and using it effectively.”


    Simon Mavi Stewart

    Creator of WebDriver and

    Selenium Project Lead, 2009-2021


    Boni García is a visiting professor at University Carlos III de Madrid (UC3M)
    and open source engineer at Sauce Labs. He''s the creator and maintainer of open
    source projects related to Selenium, using WebDriverManager and SeleniumJupiter.
    Boni is the author of more than 45 publications, including *Mastering Software
    Testing with JUnit 5* (Packt).


