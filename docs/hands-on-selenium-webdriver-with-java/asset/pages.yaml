  md: '# CHAPTER 3


    #  WebDriver Fundamentals


    This chapter presents the elementary aspects of Selenium WebDriver API. To that
    aim, we review first the different ways to create instances of the WebDriver hierarchy
    (e.g., ChromeDriver, EdgeDriver, FirefoxDriver, etc.). Also, we explore the main
    methods available in them. Among them, locating the different elements in a web
    page is essential. Thus, you will discover the possible locators, i.e., strategies
    to find the elements within a web page (called WebElement in Selenium WebDriver
    API), such as by tag name, link text, HTML attribute (identifier, name, or class),
    CSS selector, or XPath. Another critical aspect of the Selenium WebDriver API
    covered in this chapter is the impersonation of user actions (i.e., automated
    interactions with web pages using the keyboard and mouse). The last part of this
    chapter presents the ability to wait for web elements. This feature is critical
    due to the dynamic and asynchronous nature of web applications.


    # Basic WebDriver Usage


    This section covers three fundamental aspects related to WebDriver objects. First,
    we review the different ways to create them. Second, we study their basic operations.
    Finally, we analyze the different ways to dispose of these objects (typically
    at the end of a test, for closing the browser).


    # WebDriver Creation


    As introduced in Chapter 2, to control browsers with Selenium WebDriver in Java,
    the first step is to create WebDriver instances. Thus, we need to create a Chrome
    Driver object when using Chrome, EdgeDriver for Edge, FirefoxDriver for Firefox,
    and so on. The basic way to create instances of these types is to use the new
    operator in Java. For example, we create a ChromeDriver object as follows:'
  merge: -1
  pgno: 74
- img_proc: true
  md: '```

    WebDriver driver = new ChromeDriver();

    ```


    The use of the operator for creating WebDriver instances is perfectly correct,
    and you can use it in your tests. Nevertheless, it is worth reviewing other possibilities
    that can provide additional benefits depending on specific use cases for creating
    these objects. These alternatives are the WebDriver and the DriverManager builders.


    # WebDriver builder


    The Selenium WebDriver API provides a built-in method for the builder pattern
    to create WebDriver instances. This feature is accessible through the static method
    builder() of the RemoteDriver class and provides a fluent API for creating WebDriver
    objects. Table 3-1 shows the available methods for this builder. Example 3-1 shows
    a test skeleton using the WebDriver builder.


    # Table 3-1. WebDriver builder methods


    | Method | Description |

    | --- | --- |

    | oneOf(Capabilities options)

    addAlternative(Capabilities options) | Alternative browser-specific capabilities
    (see Chapter 5) |

    | addMetadata(String key, Object value) | Add custom metadata, typically used
    for requesting additional features in cloud providers (see Chapter 6) |

    | setCapability(String capabilityName, Object value) | Individual browser-specific
    capabilities (see Chapter 5) |

    | address(String uri)

    address(URL uri) | Set the address of the remote server (see Chapter 6) |

    | config(ClientConfig config) | Specific configuration when using a remote server,
    such as the connection time or proxy settings |

    | withDriverService(DriverService service) | Specific configuration for the local
    driver (e.g., chromedriver), such as its file location, used port, timeout, or
    arguments |

    | build() | Last method in the builder pattern, devoted to creating a web Driver
    instance |


    ![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_75_0.png)


    Chapter 5 explains the details about browser-specific capabilities (such as ChromeOptions).
    At this point, we use these classes just to select a browser type (e.g., ChromeOptions
    for Chrome, Edge Options for Edge, or FirefoxOptions for Firefox).'
