    \ a Selenium WebDriver test that uses OWASP ZAP as a proxy (like Example 9-7).\n\
    4. Execute the Selenium WebDriver test. At this point, you should see the generated\
    \ vulnerability in the ZAP GUI.\n\nExample 9-7. Using OWASP ZAP as security scanner\n\
