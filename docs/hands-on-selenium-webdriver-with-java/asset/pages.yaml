  md: '# Other Uses


    In addition to serving as a Java dependency, WebDriverManager can be used in other
    ways, namely:


    As a command-line interface (CLI) tool


    This mode allows you to resolve drivers (e.g., chromedriver, geckodriver). In
    addition, this mode allows you to execute browsers in Docker containers and interact
    with them through a remote desktop session.


    As a server


    The WebDriverManager Server is based on HTTP and offers two types of services.
    First, it exposes a simple RESTLike API to resolve drivers. Second, it acts as
    a regular Selenium Server, and therefore, you can use it with different language
    bindings by Java.


    As a Java agent


    In this case, and using the JVM instrumentation API, WebDriverManager uses the
    JVM instrumentation API to check the objects being created in the JVM. When WebDriver
    objects are instantiated (ChromeDriver, FirefoxDriver, etc.), the required manager
    is used to resolve its driver (chromedriver, geckodriver, etc.). Thanks to this
    approach, you can get rid of the WebDriverManager call from your tests.


    # Manual Driver Management


    This section describes how to manually implement the driver management process
    (download, setup, and maintenance).


    Download


    The first step for driver management is to download the proper driver. Table B-1
    shows the websites to obtain the drivers for the main browsers. You need to find
    the correct driver version and platform (Windows, Linux, macOS) for the browser
    you plan to use. Regarding the version, the Chrome and Edge (although not Firefox,
    unfortunately) maintainers follow the same versioning schema for drivers and browsers
    to ease this process. So, for instance, if you use Chrome or Edge 91.x, you also
    need to use chromedriver and msedgedriver 91.x. You will find the specific driver
    version in the documentation provided on the websites. For instance, to use Chrome
    91, you need to download ChromeDriver 91.0.4472.19.'
  merge: -1
  pgno: 376
- img_proc: true
  md: '# Table B-1. Java system properties to set up drivers


    | Browser | Driver | Download website |

    | --- | --- | --- |

    | Chrome/Chromium | chromedriver | https://chromedriver.chromium.org/downloads
    |

    | Edge | msgedriver | https://developer.microsoft.com/en-us/microsoft-edge/tools/webdriver
    |

    | Firefox | geckodriver | https://github.com/mozilla/geckodriver/releases |


    # Setup


    Once you have the required driver for your WebDriver, you need to set it up correctly.
    The first process is adding the driver location (the full path or the parent folder
    that contains the driver) to your PATH environmental variable (env). The PATH
    env is standard in Unix-like (e.g., Linux and macOS) and Windows operating systems.
    This environmental variable allows setting a set of folders where the operating
    system locates programs. The way we configure PATH (and other environmental variables)
    depends on the specific operating system. For example, in Windows, we can do it
    using its GUI (Control Panel -> System -> Advanced -> Environment Variables).
    In a Unix-like system, we can use the command line to carry out this process,
    instance, using the following command (or equivalent):


    ```

    export PATH-PATH:$PATH:/path/to/drivers >> ~/.profile

    ```


    The second way to set up the driver is using Java system properties, which are
    configuration attributes (in the form of name=value) passed to the JVM. Table
    B-2 summarizes the names for the main drivers in Selenium WebDriver. The value
    for these properties is the full path of a given driver (e.g., /path/to/drivers/chromedriver).


    # Table B-2. Java system properties to set up drivers


    | Browser | Driver | Java system property name |

    | --- | --- | --- |

    | Chrome/Chromium | chromedriver | webdriver.chrome.driver |

    | Edge | msgedriver | webdriver.edge.driver |

    | Firefox | geckodriver | webdriver.gecko.driver |


    There are two ways to configure these properties: the command line (passing the
    system using the -Dname=value syntax) or Java code. For example, Example B-1 shows
    the Maven and Gradle commands to execute all the tests of a given project while
    passing the properties to set the drivers for Chrome, Edge, and Firefox. Then,
    Example B-2 shows how to make the same configuration, but this time using Java.'
  merge: -1
