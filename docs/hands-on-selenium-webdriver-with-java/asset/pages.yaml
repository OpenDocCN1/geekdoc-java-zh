  md: '# Preface


    Selenium is an open source umbrella project that enables the automation of web
    browsers. The core component of the Selenium project is Selenium WebDriver, a
    library for controlling browsers (e.g., Chrome, Firefox, Edge, Safari, or Opera)
    programmatically. Selenium WebDriver provides a cross-browser Application Programming
    Interface (API) in several programming languages (officially supported in Java,
    JavaScript, Python, C#, or Ruby).


    Although we can use Selenium WebDriver for multiple purposes related to browser
    automation, its primary use is end-to-end tests for web application verification.
    Thousands of organizations and testers now use Selenium worldwide, and it is one
    of the leading solutions for end-to-end testing, supporting a multi-million-dollar
    industry.


    # Who Should Read This Book


    This book provides a comprehensive summary of the main features of Selenium WebDriver
    version 4, using Java as language binding. It reviews the main aspects of automated
    web navigation, browser manipulation, web element interaction, user impersonation,
    automated driver management, the Page Object Model (POM) design pattern, use of
    remote and cloud infrastructure, integration with Docker and third-party tools,
    and much more.


    The primary audience of this book includes Java coders of different levels (from
    beginner to advanced), such as developers, testers, QA engineers, etc. Thus you
    need a basic knowledge of the Java language and object-oriented programming. The
    final goal is to have a comprehensive understanding of the main aspects of Selenium
    WebDriver to create end-to-end tests in Java using different testing frameworks
    of your choice (e.g., JUnit or TestNG).'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Why I Wrote This Book


    Test automation is a software testing technique that leverages automation tools
    to control test execution. It allows increased efficiency and effectiveness while
    ensuring the overall quality of a software system. In this arena, Selenium WebDriver
    is the facto standard library to develop end-to-end tests for web applications.
    This book provides the first complete review of Selenium 4 to date.


    The book follows a learn-by-doing approach. To that aim, we review the main features
    of Selenium WebDriver through ready-to-executed test examples. These examples
    are publicly available in a GitHub open source repository (https://github.com/bonigarcia/selenium-webdriver-java).
    For the sake of completeness, the repository contains each test example in different
    flavors of the embedding testing framework: JUnit 4, JUnit 5 (alone or with Selenium-Jupiter),
    and TestNG.


    # Navigating This Book


    The content of this book is divided into 3 parts and 10 chapters:


    # Part I, Introduction


    Part I provides technological background on Selenium, test automation, and project
    setup. This part, more theoretical than practical, is composed of two chapters:


    +   - Chapter 1, ''A Primer on Selenium'', presents the core components of the
    Selenium project (WebDriver, Grid, and IDE) and its ecosystem (i.e., the tools
    and technologies around Selenium). In addition, this chapter reviews the principles
    of end-to-end testing related to Selenium.


    +   - Chapter 2, ''Preparing for Testing'', explains how to set up a Java project
    (Maven and Gradle) containing end-to-end tests that use the Selenium WebDriver
    API. Then, you will learn how to develop your first WebDriver tests using different
    testing frameworks: JUnit 4, JUnit 5 (alone or in conjunction with Selenium-Jupiter),
    and TestNG.


    # Part II, The Selenium WebDriver API


    Part II provides practical insight into the Selenium WebDriver API. This part
    is guided by test examples available in the examples repository and includes the
    following chapters:


    +   - Chapter 3, "WebDriver Fundamentals", describes the primary aspects of the
    Selenium WebDriver API for carrying out automated interaction with web applications.
    Thus, this chapter reviews several strategies for locating and waiting for web
    elements. In addition, you will discover how to impersonate user actions (i.e.,
    automated interactions using the keyboard and mouse) in a browser.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '+   Chapter 4, “Browser-Agnostic Features”, reviews aspects of the Selenium
    WebDriver API that is interoperable in different browsers. Hence, this chapter
    shows how to execute JavaScript, create event listeners, manages windows, screenshots,
    handle the shadow DOM, manipulate cookies, access the browser history or storage,
    interact with windows, tabs, and iframes, among other elements.


    +   Chapter 5, “Browser-Specific Manipulation”, explains those aspects of the
    Selenium WebDriver API particular to specific browsers. This group of features
    browser capabilities (options, arguments, preferences, etc.), the Chrome DevTools
    Protocol (CDP), geolocation functions, and basic web authentication, printing
    pages to PDF, or the WebDriver BiDi API.


    +   Chapter 6, “Remote WebDriver”, describes how to use the Selenium WebDriver
    API to control remote browsers. Then, you will learn how to set up and Selenium
    grid version 4. Finally, you will discover how to use advanced infrastructure
    for Selenium elements in cloud providers (e.g., Sauce Labs, BrowserStack, or CrossBrowserTesting,
    among others) and browsers in Docker containers.


    #  Part III, Advanced Concepts


    Part III focuses on leveraging the Selenium WebDriver API in different ambits
    and use cases. This part includes the following chapters:


    +   Chapter 7, “The Page Object Model (POM)”, introduces POM, a popular design
    pattern used in conjunction with Selenium WebDriver. This pattern allows users
    to model web pages using object-oriented classes to ease test maintenance and
    reduce code duplication.


    +   Chapter 8, “Testing Frameworks”, reviews several particular features of the
    unit testing framework together with Selenium WebDriver that allow improvements
    to different aspects of the overall process. To that aim, this chapter first explains
    how to carry out cross-browser testing (i.e., reusing the same test for verifying
    web applications using different browsers) using parameterized tests and test
    templates. Then, you will learn how to split tests into different categories for
    execution filtering, ordering tests, failure analysis (i.e., collecting and analyzing
    data to determine the cause of a failure), retrying tests, parallel test execution,
    test listeners, or disabling tests.


    +   Chapter 9, “Third-Party Integrations”, reviews different technologies you
    can use to enhance your Selenium WebDriver tests, such as reporting tools, test
    data generation, and other frameworks (e.g., Cucumber or Spring). Moreover, this
    chapter describes how to use external libraries with Selenium to implement specific
    use cases, such as file downloading or nonfunctional tests (such as load, security,
    or accessibility).'
  merge: -1
  pgno: 18
- img_proc: true
  md: '+   Chapter 10, "Beyond Selenium", presents a couple of automation frameworks
    related to Selenium: Appium (for mobile testing) and REST Assured (for testing
    web services). To conclude, we review some of the most relevant current alternatives
    to Selenium WebDriver, such as Cypress, WebDriverIO, TestCafe, Puppeteer, or Playwright.


