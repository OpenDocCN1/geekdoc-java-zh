  md: '# Using TOML files


    TOML (Tom''s Obvious Minimal Language) is a configuration format designed to be
    human-readable. Like the CLI options, these files allow configuring the Selenium
    Grid parameters using TOML notation.


    # Cloud Providers


    As introduced in Chapter 1, a cloud provider in the Selenium ecosystem is a company
    that provides managed services (usually commercial) for automated web and mobile
    testing. Common services offered by cloud providers include:


    # Browsers as a service


    To request on-demand web browsers hosted by the providers. These browsers are
    usually of different types, versions, and operating systems. This feature is typically
    used for cross-browser automated or live testing.


    # Analysis capabilities


    To monitor and debug automated tests. To that aim, cloud providers typically support
    session recordings or rich error-reporting features.


    # Mobile testing


    To request emulated (and real) mobile devices on different platforms, such as
    Android and iOS.


    # Visual testing


    Automatically inspect the UI and ensure that end users have a correct visual experience.


    Examples of current cloud providers for Selenium are Sauce Labs, BrowserStack,
    LambdaTest, CrossBrowserTesting, Moon Cloud, TestingBot, Perfecto, or Testium.
    All these companies offer specific services with different pricing plans. Their
    common aspect is that each cloud provider maintains a Selenium endpoint that we
    can use in RemoteWebDriver. Example 6-9 illustrates how to use one of them (concretely,
    Sauce Labs) to create a webdriver object. You find equivalent tests for other
    cloud providers (BrowserStack, LambdaTest, CrossBrowserTesting, Perfecto, and
    Testium) in the examples repository. These tests allow using remote browsers managed
    by the cloud providers.'
