  md: '# A basic Appium test


    This section presents a basic test test case using Appium server 2 and the Appium
    Java client. For simplicity, I use the UiAutomator2 Driver and an emulated Android
    device. The SUT will be a web application, concretely, the practice site throughout
    this book. The calls to the Appium Java clients are embedded in the different
    testing frameworks used in the rest of the examples (i.e., JUnit 4 and 5, TestNG,
    and Selenium-Jupiter). As usual, you can find the complete source code in the
    examples repository. The requisites for running this test are:


    +   1. Install Appium server 2.


    +   2. Install UiAutomator2 Driver.


    +   3. Install Android SDK (i.e., the official software development kit for Android).
    You can easily install the SDK by installing Android Studio for your computer.


    +   4. Create an Android Virtual Device (AVD) using the AVD Manager in Android
    Studio. Figure 10-2 shows the menu option to turn this tool, and Figure 10-3 shows
    the virtual device used in the test (a Nexus 5 mobile phone using the Android
    API level 30).


    +   5. Start the virtual device and Appium server.


    ![](img/3ba03fff1f092dc33ff7df9e9f1f4e2b_350_0.png)


    Figure 10-2. Android Studio'
