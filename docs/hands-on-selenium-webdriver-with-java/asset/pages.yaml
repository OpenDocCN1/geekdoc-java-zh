  md: "# Locating HTML attributes (name, id, class)\n\nAnother straightforward location\
    \ strategy is to find elements by an HTML attribute, i.e., name, id, or class.\
    \ Consider the following input text available in the practice web. Notice that\
    \ it includes the standard attribute class, name, id, and thestandard myprop (included\
    \ to illustrate the difference between several WebDriver methods). Example 3-7\
    \ shows a test using this strategy.\n\n```\n<input type=\"text\" class=\"form-control\"\
    \ name=\"my-text\" id=\"my-text-id\"\nmyprop=\"myvalue\"\n```\n\nExample 3-7.\
    \ Testing locations by HTML attributes (name, id, and class)\n\n```\n@Test\nvoid\
    \ testByHtmlAttributes() {\n  driver.get(\n    \"https://bonarcia.dev/selenium-webdriver-java/web-form.html\"\
    );\n\n  // By name\n  WebElement textByName = driver.findElement(By.name(\"my-text\"\
    ));\n  assert(textByName.isEnabled()).isTrue();\n\n  // By id\n  WebElement textById\
    \ = driver.findElement(By.id(\"my-text-id\"));\n  assert(textById.getAttribute(\"\
    type\")).isEqualTo(\"text\");\n  assert(textById.getDomAttribute(\"type\")).isEqualTo(\"\
    text\");\n  assert(textById.getDomProperty(\"type\")).isEqualTo(\"text\");\n\n\
    \  assert(textById.getAttribute(\"myprop\")).isEqualTo(\"myvalue\");\n  assert(textById.getDomAttribute(\"\
    myprop\")).isEqualTo(\"myvalue\");\n  assert(textById.getDomProperty(\"myprop\"\
    )).isNull();\n\n  // By class name\n  List<WebElement> className = driver\n  \
    \  .findElements(By.className(\"form-control\"));\n  assert(className.size()).isPositive();\n\
    \  assert(className.get(0).getAttribute(\"name\")).isEqualTo(\"my-text\");\n}\n\
    ```\n\n+   1. We locate the text input by name.\n2. We assert that the element\
    \ is enabled (i.e., the user can type in it).\n3. We find the same text input\
    \ by id.\n4. This assertion (and the next one) returns the same value since the\
    \ attribute type is standard, and as previously explained, it becomes a property\
    \ in the DOM."
