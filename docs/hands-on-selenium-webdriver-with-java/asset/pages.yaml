    # # Location Strategies


    Selenium WebDriver provides eight basic location strategies, summarized in Table
    3-4. In addition, as explained in the next sections, there are other advanced
    location strategies, namely, compound and relative locators.


    We specify the basic locators using the class By in the Selenium WebDriver API.
    The following subsections show examples of all these strategies. We use the practice
    web form to that atain. Figure 3-2 shows a screenshot of this form.


    | Locator | Finds elements based on |

    | --- | --- |

    | Tag name | The name of HTML tag (e.g., a, p, div, img, etc.). |

    | Link text | The exact text value displayed by a link (i.e., a HTML tag). |

    | Partial link text | The text contained in a link (i.e., a HTML tag). |

    | Name | The value of the attribute name. |

    | Id | The value of the attribute id. |

    | Class name | The value of the attribute cClass. |

    | CSS selector | Patterns that follow the W3C Selectors recommendation. The original
    aim of CSS patterns is to select element(s) in a web page to apply CSS styles.
    Selenium WebDriver allows reusing these CSS selectors to find elements and interact
    with them. |

    | XPath | Queries that follow the XPath (XML Path Language) language. XPath is
    a W3C standard query language for selecting nodes from an XML-like document (e.g.,
    web pages). |'
