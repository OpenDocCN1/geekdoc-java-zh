  md: "# WebDriver BiDi\n\nThe WebDriver BiDi is a W3C draft that defines the bidirectional\
    \ WebDriver protocol. Instead of the WebSocket command/response format of the\
    \ WebDriver protocol, BiDi introduces a WebSocket connection between driver and\
    \ browser to enable bidirectional communication. This way, WebDriver BiDi will\
    \ allow different operations using a fast bidirectional transport (i.e., without\
    \ polling the browser to get responses).\n\nIn Selenium WebDriver, the aim is\
    \ that BiDi is a standardized replacement in the long run for advanced operations\
    \ supported by CDP. For example, the Selenium WebDriver API supports implementing\
    \ event listeners through the HasLog Events interface. This interface works on\
    \ top of CDP at the time of this writing. Nevertheless, it will use BiDi internally\
    \ within Selenium releases, providing more robust cross-browser compatibility.\
    \ HasLogEvents implementing listeners for the following events:\n\ndomMutation\n\
    \nTo capture events about changes in the DOM. Example 5-48 shows a test implementing\
    \ a listener for these events.\n\nconsoleEvent\n\nTo capture events about changes\
    \ in the browser console, such as JavaScript traces. Example 5-49 shows a new\
    \ test implementing this type of listener.\n\nExample 5-48. Test implementing\
    \ a listener for DOM mutation events\n\n```\n@Test\nvoid testDomMutation() throws\
    \ InterruptedException {\n  driver.get(\"https://bonigarcia.dev/selenium-webdriver-java/\"\
    );\n\n  HasLogEvents logger = (HasLogEvents) driver; // ①\n  JavascriptExecutor\
    \ js = (JavascriptExecutor) driver;\n\n  AtomicReference<DomMutationEvent> seen\
    \ = new AtomicReference<>();\n  CountDownLatch latch = new CountDownLatch(1);\n\
    \  logger.onLog(CdpEventType.DomMutation(mutation) -> {\n    seen.set(mutation);\n\
    \    latch.countDown();\n  }); // ②\n\n  WebElement element = driver.findElement(By.TagName(\"\
    img\"));\n  String newSrc = \"img/png\";\n  String script = String.format(\"arguments[0].src\
    \ = '%s\", newSrc);\n  js.executeScript(script); // ③\n\n  assert(latch.await(10,\
    \ TimeUnit.SECONDS)).isTrue(); // ④\n  assert(seen.get().getElement().getAttribute(\"\
    src\"));\n}\n```"
