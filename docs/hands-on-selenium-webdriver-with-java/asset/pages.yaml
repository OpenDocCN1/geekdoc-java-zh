    # ## 6-7. Jaeger UI showing the data from Selenium Grid


    # ### GraphQL queries


    GraphQL is an open source data query and manipulation language for APIs. GraphQL
    defines a syntax to query data, from an online service. Selenium Grid 4 provides
    a GraphQL endpoint (http://localhost:4444/graphql). A simple way to make GraphQL
    queries to this endpoint is using curl from the shell. For example, and supposing
    we have a Selenium Grid running in the localhost, we can send the following command
    to the GraphQL endpoint to get the maximum and the current number of sessions
    in the grid:


    ```

    curl -X POST -H "Content-Type: application/json" --data \

    {"query": "{ grid { maxSession, sessionCount } }"} - \

    http://localhost:4444/graphql

    ```


    # ### Configuration


    You can find more details about Selenium Grid in its official documentation. For
    advanced configuration, there are two ways to custom setup for Selenium Grid:


    Using CLI options for the different aspects of Selenium Grid


    Some examples of these options are --port to change the default port through which
    the Selenium Grid server listens (4444 by default), or --session-timeout, which
    is the timeout in which nodes are terminated when there is no activity (three
    hundred seconds by default).'
