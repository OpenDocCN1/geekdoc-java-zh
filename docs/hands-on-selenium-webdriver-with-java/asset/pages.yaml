  md: '# CHAPTER 4

    Browser-Agnostic Features


    This chapter reviews those features of Selenium WebDriver that are interoperable
    with different web browsers. In this group, a relevant multipurpose characteristic
    is executing JavaScript. Also, the Selenium WebDriver API allows configuring timeouts
    for page and script loading. Another convenient feature is making screenshots
    of the browser screen, or only the portion corresponding to a given element. Then,
    we can manage different aspects of the controlled browser using WebDriver, such
    as browser size and position, history, or cookies. Then, WebDriver provides various
    assets for controlling specific web elements, such as dropdown lists (i.e., HTML
    select fields and data lists), navigation targets (i.e., windows, tabs, frames,
    and iframes) or dialog boxes (i.e., alerts, prompts, confirmations, and modal
    dialogs). Finally, we discover how to handle local and session data using web
    storage, implement event listeners, and use the exceptions provided by the Selenium
    WebDriver API.


    # Executing JavaScript


    JavaScript is a high-level programming language supported by all major browsers.
    We can use JavaScript in the client side of web applications for a wide variety
    of operations, such as DOM manipulation, user interaction, handling requests-responses
    from remote servers, or working with regular expressions, many other functions.
    Luckily for test automation, Selenium WebDriver allows injecting and executing
    arbitrary pieces of JavaScript. To that aim, Selenium WebDriver API provides the
    interface JavaScriptExecutor. Table 4-1 introduces the available public methods
    in this interface grouped into three categories: synchronous, pinned, and asynchronous
    scripts. The subsections following provide more details and illustrate their use
    through different examples.'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# Table 4-1. JavascriptExecutor methods


    | Category | Method | Return | Description |

    | --- | --- | --- | --- |

    | Synchronous scripts | executeScript(String script, Object... args) | Object
    | Execute JavaScript code on the current page. |

    | Pinned scripts | pin(String script) | ScriptKey | Attach a piece of JavaScript
    to a WebDriver driver. The pinned scripts can be used multiple times while the
    WebDriver session is active. |

    | | unpin(ScriptKey key) | void | Detach a previously pinned script to the WebDriver
    session. |

    | | getPinnedScripts() | Set-ScriptKey | Collect all pinned scripts (each one
    identified by a unique ScriptKey). |

    | | executeAsyncSyncScript(String script, Object... args) | Object | Execute JavaScript
    code (typically an asynchronous operation) on the current page. The difference
    with executeScript() is that scripts executed with executeAsyncScript() must explicitly
    signal their termination by invoking a callback function. By convention, this
    callback is injected into the script as its last argument. |


    Any driver object that inherits from the RemoteWebDriver also implements the JavaScriptExecutor
    interface. Therefore, when using a major browser (e.g., Chrome Driver, FirefoxDriver,
    etc.) using the generic WebDriver interface, we can cast it to JavaScriptExecutor
    as shown in the following snippet. Then, we can use the executor (using variable
    js in the example) to invoke the methods presented in Table 4-1.


    ```

    WebDriver driver = new ChromeDriver();

    JavascriptExecutor js = (JavascriptExecutor) driver;

    ```


    # Synchronous Scripts


    The method executeScript() of a JavaScriptExecutor object allows executing a piece
    of JavaScript in the current web page in a WebDriver session. The invocation of
    this method (in Java) blocks the control flow until the script terminates. Therefore,
    we typically use this method for executing synchronous scripts in a web page under
    test. The method executeScript() allows two arguments:


    String script


    Mandatory JavaScript fragment to be executed. This code is executed in the body
    of the current page as an anonymous function (i.e., a JavaScript function without
    a name).'
