  md: "An inconvenience of Extent Reports is that we need to add each test explicitly\
    \ to the reporter. A possible solution to this problem is using custom test listeners\
    \ (as explained in “Test Listeners” on page 282) to group the common logic for\
    \ reporting.\n\nAnother possible library for generating test reports is Allure,\
    \ an open source reporting framework for generating test reports for different\
    \ programming languages, including Java, Python, and JavaScript, among others.\
    \ A noticeable difference between Allure and Extent Reports is that Allure uses\
    \ a test listener configured in the build tool Maven or Gradle (see Appendix C\
    \ for further details about this configuration). Thus, we did not need to change\
    \ our test suite for generating Allure reports. Table 9-1 summarizes the necessary\
    \ commands to create Allure reports with Maven and Gradle.\n\nTable 9-1. Maven\
    \ and Gradle commands to generate test reports with Allure\n\n| Maven | Description\
