- img_proc: true
  md: 'determining the root cause of any issue. To that aim, the three pillars of
    observability are:


    # Metrics


    Measures of system performance over time, such as response time, transactions
    per second, or memory usage, to name a few


    # Logs


    Lines of text (typically timestamped) that a system produces when running a piece
    of code


    # Traces


    Representation of causally related distributed events (such as selected logs)
    that characterize the request flow of a given operation in a software system


    Selenium Grid 4 provides different features for measuring observability. First,
    Selenium Grid allows tracing using the OpenTelemetry API. Second, Selenium Grid
    provides a GraphQL endpoint to run queries against the grid.


    # Tracing with OpenTelemetry


    Tracing is an essential way of measuring observability based on the logs and metrics
    of a software system. Selenium Grid exposes tracing in two ways. First, we can
    check the log traces when executing a grid from the shell. By default, the logs
    at the INFO level are displayed. We can change the level using --log-level in
    the shell command, for instance:


    ```

    java -jar selenium-server-4.0.0.jar standalone --log-level FINE

    ```


    Furthermore, Selenium Grid supports distributed tracing via OpenTelemetry APIs.
    This feature allows tracing the commands flowing through a Selenium infrastructure.
    Distributed tracing requires two activities in this order:


    +   1. Code instrumentation


    Selenium Grid allows exporting tracing information using the OpenTelemetry API.


    +   2. Data collection


    For example, we can use Jaeger, an open source distributed tracing platform that
    provides seamless integration with OpenTelemetry. It allows querying, visualizing,
    and collecting tracing data.'
  merge: -1
