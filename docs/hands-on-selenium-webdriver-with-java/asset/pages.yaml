  md: '# Summary and Outlook


    This chapter presented the foundations of the Selenium WebDriver API. First, you
    learned how to create and shut down WebDriver instances. These objects represent
    a browser controlled with Selenium WebDriver. This way, we use an instance of
    Driver for Chrome, FirefoxDriver for Firefox. Second, you looked at Web Element,
    a class representing different web elements (e.g., links, images, fields, etc.).
    Selenium WebDriver provides several strategies to locate web elements: by HTML
    attribute (id, name, or class), tag name, link text (complete or partial), CSS
    selector, and XPath. We also explored a brand-new strategy of Selenium WebDriver
    4 relative locators. Then, we covered users actions'' impersonation, using the
    keyboard and the mouse. You can use these actions from simple actions (e.g., clicking
    a link, filling a text input, etc.) to complex user gestures (e.g., drag and drop,
    click and hover). Finally, we examined the ability to wait in Selenium WebDriver
    tests. This feature is critical due to the current distributed, dynamic, and asynchronous
    nature of web applications. There are three main wait strategies in Selenium WebDriver:
    implicit (specify a timeout to wait for elements), explicit (pause wait) and fluent
    (extension of an explicit wait with some fine-grained setup).


    The next chapter continues digging into the Selenium WebDriver API. In particular,
    Chapter 4 reviews those interoperable features in different browsers (Chrome,
    Edge, Firefox, etc.). Among these features, you will discover how to execute JavaScript,
    specify event listeners, configure timeouts for page and script loading, manage
    the browser history, make screenshots, manipulate cookies, manipulate dropdown
    lists (i.e., selects and data lists), handle window targets (i.e., tabs, frames,
    and iframes) and dialog boxes (i.e., alerts, prompts, confirmation, and modal
    pop-ups), use web storage, and understand the WebDriver exceptions.'
  merge: -1
  pgno: 121
