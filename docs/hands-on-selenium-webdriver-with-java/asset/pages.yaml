    # # Browser Infrastructure


    We can use Selenium WebDriver to control browsers installed in the machine running
    WebDriver script. Also, Selenium WebDriver can drive remote browsers (i.e., executed
    on other hosts). In this case, we can use Selenium Grid to support the remote
    browser infrastructure. Nevertheless, this infrastructure is challenging to create
    and maintain.


    Alternatively, we can use a cloud provider to outsource the responsibility for
    supporting the browser infrastructure. In the Selenium ecosystem, a cloud provider
    is a company or product that supplies managed services for automated testing.
    These companies typically offer commercial solutions for web and mobile testing.
    The users of a cloud provider request on-demand browsers of different types, versions,
    and operating systems. Also, these providers offer additional services for easing
    the testing and monitoring activities, such as session records or analysis capabilities,
    to name a few. Some of the most relevant cloud providers for Selenium nowadays
    are Sauce Labs, BrowserStack, LambdaTest, CrossBrowserTesting, Moon Cloud, TestingBot,
    Perfecto, and Testium.


    Another solution we can use to support the browser infrastructure for Selenium
    is Docker. an open source software technology that allows users to pack and run
    applications as lightweight, portable containers. The Docker platform has two
    main components: the Docker Engine, a tool for creating and running containers,
    and the Docker Hub, a cloud service for distributing Docker images. In the Selenium
    domain, we can use Docker to pack and execute containerized browsers. Table 1-6
    presents a summary of relevant projects using Docker in the Selenium ecosystem.'
  merge: -1
