  md: "# Page Loading Strategies\n\nSelenium WebDriver allows configuring different\
    \ approaches for loading web pages. For that, the Selenium WebDriver API provides\
    \ the PageLoadStrategy enumeration. Table 5-2 describes the possible values of\
    \ this enumeration and their purposes. Selenium WebDriver internally uses the\
    \ property document.readyState of the DOM API to check the web page loading state.\n\
    \nTable 5-2. PageLoadStrategy values\n\n| Loading strategy | Description | Readiness\
    \ state |\n| --- | --- | --- |\n| PageLoadStrategy.NORMAL | Default method. Selenium\
    \ WebDriver waits until the entire page is loaded (i.e., the HTML content and\
    \ resources, such as stylesheets, images, JavaScript files, etc.) | \"complete\"\
    \ |\n| PageLoadStrategy.EAGER | Selenium WebDriver waits until the HTML document\
    \ has finished loading and parsing, subprocesses (scripts, images, stylesheets,\
    \ etc.) are still loading. | \"Interactive\" |\n| PageLoadStrategy.NONE | Selenium\
    \ WebDriver waits until the HTML document is downloaded. | \"loading\" |\n\nWe\
    \ invoke the method setPageLoadStrategy() of the browser capabilities (e.g., ChromeOptions,\
    \ FirefoxOptions, etc.) to set up these strategies (NORMAL, EAGER, or NONE). Example\
    \ 5-5 shows a test using Chrome and the NORMAL strategy. In the examples repository,\
    \ you can find equivalent examples for Edge and Firefox using the other strategies\
    \ (EAGER and NONE). In addition, to specifying a loading strategy in the test\
    \ setup, the test calculates the required time to load the page, displaying this\
    \ value in the standard output.\n\nExample 5-5. Using a normal page loading strategy\
    \ in Chrome\n\n```\nclass PageLoadChromeJupiterTest {\n    static final Logger\
    \ log = getLogger(lookup().lookupClass());\n\n    WebDriver driver;\n\n    PageLoadStrategy\
    \ pageLoadStrategy;\n\n    @BeforeEach\n    void setup() {\n        ChromeOptions\
    \ options = new ChromeOptions();\n        pageLoadStrategy = PageLoadStrategy.NORMAL;\n\
    \        options.setPageLoadStrategy(pageLoadStrategy);\n\n        driver = WebDriverManager.chromedriver().capabilities(options).create();\n\
    \    }\n```"
