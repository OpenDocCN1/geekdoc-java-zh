    - extern\n- internal\n- new\n- const\n- override\n- protected\n- private\n- public\n\
    - sealed\n- readonly\n- static\n- virtual\n- void\n\n2) Keywords for type conversions\n\
    - explicit\n- implicit\n- as\n- is\n- operator\n- sizeof\n- typeof\n\n3) Keywords\
