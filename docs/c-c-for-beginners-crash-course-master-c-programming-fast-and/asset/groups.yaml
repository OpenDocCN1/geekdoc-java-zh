    or a user defined type. The variable_list contains one or more identifiers.


    Examples of variables


    ```

    int a,b,c;

    char x,y;

    float price, totolcost;

    double area;

    ```


    # Initializing Variables


    The variables are initialized using an equal sign and followed by an expression.
    The syntax for initializing variable is:'
  - '[PAGE 26]


    ```

    variable_name = value;

    ```


    The variables can be initialized in the declaration. The general form for initializing
    the variable is:


    ```

    <data_type><variable_name> = value;

    ```


    Examples of variable initialization:


    +   int a = 4;

    char z = ''z'';

    double y = 12.145;


