    \ [4] = 14\n\n## 9.5 foreach 循环\n\n此循环专门设计用于遍历数组的所有元素。它非常适合高效地检索数组元素。\n\n语法：\n\
    \n```\nforeach(type identifier in expression)\n    statement – block\n```\n\n\
    示例：\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_86_0.png)\n\n代码被编译并执行后，输出为：\n\n\
    \n\nElement[0] = 10\nElement[1] = 11\nElement[2] = 12\nElement [3] = 13\nElement\
    \ [4] = 14\n\n## 9.6 不同的 C# 数组\n\n以下是用于代码开发的各种 C# 数组类型。\n\n### 多维数组\n\n多维数组在多个行维度上存储数据。它也被称为矩形数组。用户可以这样声明一个整型二维数组：\n\
    \n```\nint [ , ] no;\n```\n\n二维数组可以被视为表格。它有 x 行 y 列。二维数组包含 2 行 4 列。\n\n| | Column\
