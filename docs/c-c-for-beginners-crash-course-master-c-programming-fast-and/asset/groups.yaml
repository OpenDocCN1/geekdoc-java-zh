    \ compilation is displayed in the window. The View -> Output Window option is\
    \ used to open the window.\n\nThe following figure shows the output window in\
    \ Visual Studio application.\n\n# Error List\n\nThe list of errors present in\
    \ the application is displayed in the error list. The user can locate errors as\
    \ soon as the code is compiled. View, Error List option to open the window.\n\n\
    The following figure shows the error list.\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_15_0.png)\n\
    \n# Class View\n\nThe class view window is useful for displaying classes, properties\
