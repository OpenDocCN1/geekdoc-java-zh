    \n+ 11.2 Access specifier in C#\n\n+ 11.3 Polymorphism\n\n+ 11.4 Static Polymorphism\n\
    \n+ 11.5 Dynamic Polymorphism\n\n# Chapter 12 Inheritance and Interfaces\n\n+\
    \ 12.1 Introduction to Inheritance\n\n+ 12.2 Base and derived classes\n\n+ 12.3\
    \ Base class initialization\n\n+ 12.4 Interfaces in C#\n\n+ 12.5 Multiple inheritance\
    \ in C#\n\n# Chapter 13 Operator overloading and exception handling\n\n+ 13.1\
    \ Introduction to Operator overloading\n\n+ 13.2 Different operators\n\n+ 13.3\
    \ Introduction to exception handling\n\n+ 13.4 Exception classes in C#\n\n+ 13.5\
    \ Exception handling\n\n+ 13.6 User defined exceptions\n\n# Chapter 14 Multithreading\n\
    \n+ 14.1 Thread in C#\n\n+ 14.2 Life cycle of a thread\n\n+ 14.3 Main thread\n\
    \n+ 14.4 Properties and methods of Thread class\n\n+ 14.5 Creating and managing\
    \ threads\n\n+ 14.6 Destroying threads\n\n+ 14.7 Reference links on C#\n\n+ 14.8\
    \ Thread in C#\n\n+ 14.9 Conclusion\n\n# Chapter 1 Introduction to C#\n\n# 1.1\
    \ Overview of C#\n\nC# is an object oriented, type safe high level language. It\
    \ has been developed by Microsoft during the development of .NET framework. C#\
    \ was developed for the Common Language Infrastructure (CLI), this infrastructure\
    \ was created to allow programs from various languages to work together. The CLI\
    \ contains a various executable programs referred simply as executables and are\
    \ housed in a system called the runtime environment. All the programs created\
    \ in .Net execute in an environment.\n\n# 1.2 Programming features of C#\n\n-\
    \ It is simple, advanced, object oriented language\n- It contains data types and\
    \ classes common for all the .NET languages\n- The Common Language Runtime (CLR)\
    \ is similar to the Java Virtual Machine (JVM)\n- C# provides support for encapsulation,\
    \ inheritance, polymorphism, interfaces\n- Visual Studio provides support to C++,\
    \ VB, Script, JavaScript\n- .NET consists of class library and common execution\
    \ engine\n- Garbage collection, automatic memory management, interoperability\
    \ are inbuilt in C#\n- User can develop console, windows and web applications\
    \ using C#\n\n# 1.3 C# Environment\n\nC# is a part of .NET framework. It is used\
    \ for creating .NET applications. Using .NET framework, user can design, deploy\
    \ and develop the applications. Robust applications can be easily built using\
    \ the simple programming model.\n\n# Components of .NET framework\n\nThe .NET\
    \ framework diagram containing several components is as shown:\n\n| Windows Forms\
    \ | Console Application | Web and Windows Services |\n|---|---|---|\n| Common\
    \ Language Specification | | Visual Studio .NET |\n| .NET framework Base class\
    \ library | | |\n| Common Language Runtime | | |\n\n# Common Language Runtime\
    \ (CLR)\n\nThe core component of the .NET framework is the CLR. It is an environment\
    \ where the programs are executed. The code in CLR is translated into Intermediate\
    \ Language (IL). This IL code is then used across different platforms.\n\nThe\
    \ IL code is converted into machine language by the Just in Time (JIT) compiler.\
    \ The compiler checks for the type safety. This ensures objects are accessed in\
    \ a compatible way.\n"
