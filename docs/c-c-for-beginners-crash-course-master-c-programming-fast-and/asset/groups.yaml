    \ the output is:\n\nMinimum value is: 3\nMinimum value is: 1.2\n\n## 11.5 Dynamic\
    \ Polymorphism\n\nC# has two approaches for implementing dynamic polymorphism.\
    \ They are:\n\n- **Abstract classes**: They are unique type of base classes containing\
    \ abstract class members. The class members derived from the abstract class must\
    \ implement abstract functions and properties.\n- **Virtual functions**: They\
    \ do not really exist. They appear to be present in some parts.\n\n### Abstract\
    \ class\n\nAn abstract class provides partial implementation of the class. When\
    \ the derived class inherits it, the implementation is completed. There are abstract\
    \ methods which are implemented using derived class.\n\n### Rules for abstract\
    \ class creation\n\n- User cannot declare an abstract method outside the abstract\
    \ class\n- The instance of the abstract class cannot be created\n- A class derived\
    \ from an abstract class must override all the methods of the class\n- The abstract\
    \ class cannot be declared as **sealed**\n\n### Example:\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_112_0.png)\n\
    \n```csharp\nabstract class Data\n{\n    int x, y;\n    public Data(int x, int\
    \ y)\n    {\n        this.x = x;\n        this.y = y;\n    }\n    public abstract\
    \ int average();\n}\n\nclass DerivedData : Data\n{\n    public override int average()\n\
    \    {\n        Console.WriteLine(\"The average is:\");\n        return (x + y\
    \ / 2);\n    }\n}\n\nclass Program\n{\n    static void Main(string[] args)\n \
    \   {\n        DerivedData d = new DerivedData(30, 70);\n        int a = d.average();\n\
    \        Console.WriteLine(\"Average:{0}\",a);\n        Console.Read();\n    }\n\
    }\n```\n\nWhen the code is compiled and executed, the output is:\n\nThe average\
    \ is:\nAverage: 50\n\n## Virtual Functions\n\nIf you need a function that is defined\
    \ in a class and needs to be implemented by an inherited class, the virtual function\
    \ is used. The inherited class modifies the functionality of the inherited class.\
    \ The virtual keyword is used before the function.\n\nExample:\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_112_0.png)\n\
    \n```csharp\nclass Base\n{\n    public virtual void show()\n    {\n        Console.WriteLine(\"\
    Base method\");\n    }\n}\n\nclass Derived : Base\n{\n    public override void\
    \ show()\n    {\n        Console.WriteLine(\"Derived method\");\n    }\n}\n\n\
    class Program\n{\n    static void Main(string[] args)\n    {\n        Base b =\
