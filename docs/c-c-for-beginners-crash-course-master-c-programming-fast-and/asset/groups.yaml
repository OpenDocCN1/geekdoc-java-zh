    \ |\n\n### 初始化二维数组\n\n以下数组有 3 行 3 列。\n\n```csharp\nint [ , ] x = int [ 3, 3 ]\
    \ = {\n  {1, 2, 3},\n  {4, 5, 6},\n  {7, 8, 9}\n};\n```\n\n### 访问多维数组的元素\n\n可以使用下标访问多维数组中的元素。下标是数组的行索引列索引。\n\
    \n### 示例：\n\n```csharp\nint output = a [1, 2];\n```\n\n在上述语句中，访问了第二行第三列的元素。\n\n\
    ### 示例：\n\n> 示例 30：\n```csharp\nusing System;\nnamespace twimensional{\nclass\
    \ multiarray{\n    static void Main(string[] args) {\n        int [ , ] x = new\
    \ int[3,2]{{1,1},{2,2},{3,3}};\n        int a,b;\n        for(a=0;a<3;a++) {\n\
    \            for(b=0;b<2;b++) {\n                Console.Write(\"x[{0}],{1}={2}\"\
    ,a,b,x[a,b]);\n            }\n            Console.ReadLine();\n        }\n   \
    \ }\n}\n}\n```\n\n代码被编译并执行后，输出为：\n\nx[0,0] = 1\nx[0,1] = 1\nx[1,0] = 2\nx[1,1]\
    \ = 2\nx[2,0] = 3\nx[2,1] = 3\n\n### 交错数组 (Jagged Array)\n\n交错数组是数组的数组。整型交错数组声明如下：\n\
    \n```\nint [ ][ ] marks;\n```\n\n数组可以初始化为：\n\n```csharp\nint [ ] [ ] marks = new\
    \ int [ ] [] new int [ ] {45,57,78}, new int [ ] {60, 75, 86,45,35};\n```\n\n\
    marks 数组包含两个整型数组，marks[0] 包含 3 个整数，marks[1] 包含 5 个整数。\n\n### 示例：\n\n> 示例 31：\n\
    ```csharp\nusing System;\nnamespace Jaggedarray\n{\n    class jagged\n    {\n\
    \        static void Main(string[] args)\n        {\n            int[][] x = new\
    \ int[][] {\n                new int[]{0,0},\n                new int[]{2,2},\n\
    \                new int[]{3,4},\n                new int[]{4,2},\n          \
    \      new int[]{1,3};\n            int a,b;\n            for(a=0;a<5;a++)\n \
    \           {\n                for(b=0;b<2;b++)\n                {\n         \
    \           Console.WriteLine(\"x[{0}][{1}]={2}\",a,b,x[a][b]);\n            \
    \    }\n            }\n            Console.ReadLine();\n        }\n    }\n}\n\
    ```\n\n代码被编译并执行后，输出为：\n\nx[0,0] = 0\nx[0,1] = 0\nx[1,0] = 2\nx[1,1] = 2\nx[2,0]\
    \ = 3\nx[2,1] = 4\nx[3,0] = 4\nx[3,1] = 2\nx[4,0] = 1\nx[4,1] = 3\n\n### 参数数组\
    \ (Param Arrays)\n\n在声明方法时，作为参数传递的参数数量是不确定的。可以使用 **Param** 数组。\n\n### 示例：\n\n\
    > 示例 32：\n```csharp\nusing System;\nnamespace ParamArray\n{\n    class ParamArray\n\
    \    {\n        public void AddValues(params int[] data)\n        {\n        \
    \    int total = 0;\n            foreach (int a in data)\n            {\n    \
    \            total += a;\n            }\n            Console.WriteLine(\"The sum\
    \ is {0}\", total);\n        }\n\n        static void Main(string[] args)\n  \
    \      {\n            ParamArray pa = new ParamArray();\n            pa.AddValues(1,\
    \ 2, 3, 4, 5, 6);\n        }\n    }\n}\n```\n\n## 第10 章 C# 中的字符串\n\n### 10.1 字符串的创建\n\
    \nC# 中的字符串是字符数组。使用 string 关键字来声明变量。该关键字是 `System.String` 类的别名。\n\n### 字符串对象的创建\n\
    \n有多种用于创建字符串的方法：\n\n- 获取属性或调用返回字符串的方法\n- 使用字符串类的构造函数\n- 使用字符串拼接运算符 (+)\n- 调用格式化方法将值或对象转换为字符串表示\n\
    - 将字符串字面量赋值给字符串变量\n\n示例：\n\n> 示例 34：\n```csharp\nusing System;\nnamespace StringType\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            //字符串字面量和拼接\n            string name=\"Location\";\n        \
    \    name = \"Harry\";\n            string value = name +location;\n         \
    \   Console.WriteLine(\"The value is:{0}\",value);\n\n            //字符串构造函数\n\
    \            char[] vowels = {'a',''e',''i',''o',''u'};\n            string item\
    \ = new string(vowels);\n            Console.WriteLine(\"The item contains values:{0}\"\
    ,item);\n\n            //值转换的格式化方法\n            DateTime dt = new DateTime(2014,12,10,15,34,1);\n\
