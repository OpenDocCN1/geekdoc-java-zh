    \n# 第 8 章 C# 中的类与方法\n\n# 8.1 类声明\n\n在 C# 中，类是该语言的主要构建模块。它提供了一组预定义的变量和方法。对象被定义为类的实例，因此类内部的方法决定了在对象上可以执行的操作。\n\
    \n# 类定义\n\n类定义以关键字 `class` 开头，后面跟着类名。\n\n语法：\n\n```csharp\nclass ClassName\n{\n\
