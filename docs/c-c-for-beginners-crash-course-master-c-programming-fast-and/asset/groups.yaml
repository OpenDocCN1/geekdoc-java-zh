    \ The constructor has to have the same name as the class itself.\n\n# Example\
    \ of Constructor\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_69_0.png)\n\nWhen\
    \ compiled the result of this class will be:\nThe total is:60\n\nIn the example\
    \ above every time the class is instantiated, the constructor manually assigns\
    \ a fixed value to number1 and number2. However what if you wanted to make the\
