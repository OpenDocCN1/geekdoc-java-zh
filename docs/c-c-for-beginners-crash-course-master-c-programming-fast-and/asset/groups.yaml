- md: "\n## 10.2 Properties and methods of string class\n\nProperties of string class\n\
    \n- Chars: Gets the Char object at specific position in the String object\n- Length:\
    \ Gets the number of characters in the String object\n\nMethods of string class\n\
    \n- public bool Equals(string value)\nChecks whether the current String object\
    \ and the specified object have same value\n- public string Insert(int startIndex,\
    \ string value)\nReturns a new string in which the specified is inserted at a\
    \ specific index position\n- public string Replace(char oldchar, string newValue)\n\
    All the occurrences of a specific character in the string object are replaced\
    \ with Unicode character and a new string is returned\n- public int LastIndexOf(string\
    \ value)\nThe zero based index position of the last occurrence of the Unicode\
    \ character in the string object is returned\n- public string Trim()\nAll leading\
    \ and trailing white space characters from the object are returned.\n- public\
    \ static int Compare(string str1, string str2, bool IgnoreCase)\nCompares the\
    \ two strings and an integer value stating the relative position in sort order\n\
    - public static String Concat(string str1, string str2)\nConcatenates the two\
    \ string objects\n- public string[] Split(char[] separator, int count)\nA array\
    \ containing the substrings in the current string object is returned. It is delimited\
    \ by the elements of a specific Unicode character array. The number of substrings\
    \ is returned by the int parameter.\n- public bool Contains(string value)\nReturns\
    \ value stating the specified string object occurs in the string\n- public static\
    \ string Copy(string str)\nCreates a new String object with the same value as\
    \ the specified string\n- public string ToUpper()\nCopy of the string converted\
    \ into uppercase is returned\n- public int IndexOf(string value)\nReturns the\
    \ zero – based index of the first occurrence of the specified string in the instance\n\
    - public string Remove(int startIndex)\nIt removes the characters in the current\
    \ instance, beginning at the specified position and moving to the last one. It\
    \ returns a string.\n- public char[] ToCharArray()\nA Unicode character array\
    \ with all the characters in the current object is returned\n- public string ToLower()\n\
    Copy of the string converted into lowercase is returned\n\n## 10.3 Examples demonstrating\
    \ the string functionality\n\n### String Comparison\n\n```csharp\nExample 35:\n\
    using System;\nnamespace string1\n{\n    class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n            string string1 = \"A string\
    \ named as string1\";\n            string string2 = \"A string named as string2\"\
    ;\n            if (String.Compare(string1,string2) == 0)\n            {\n    \
    \            Console.WriteLine(string1+\"and\"+string2+\"equal\");\n         \
    \   }\n            else\n            {\n                Console.WriteLine(string1+\"\
    and\"+string2+\"not equal\");\n            }\n            Console.Read();\n  \
    \      }\n    }\n}\n```\n\nWhen the code is compiled and executed, the output\
    \ is:\n\nA string named as string1 and A string named as string2 are not equal\n\
    \n### Joining strings\n\n```csharp\nExample 36:\nusing System;\nnamespace string1\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            string[] str1 = new string[]{\"Set your aims high\",\n      \
    \      \"Rome was not built in a day\",\n            \"Save Time\"};\n       \
    \     string str = String.Join(\"\\n\",str1);\n            Console.WriteLine(str);\n\
    \            Console.Read();\n        }\n    }\n}\n```\n\nWhen the code is compiled\
    \ and executed, the output is:\n\nSet your aims high\nRome was not built in a\
    \ day\nSave Time\n\n### String containing value\n\n```csharp\nusing System;\n\
    namespace string1\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            string str = \"A new user\";\n            if(str.Contains(\"\
    user\"))\n            {\n                Console.WriteLine(\"The value 'user'\
    \ is present\");\n            }\n            Console.Read();\n        }\n    }\n\
    }\n```\n\nWhen the code is compiled and executed, the output is:\n\nThe value\
    \ 'user' is present\n\n## Chapter 11 Encapsulation and Polymorphism\n\n## 11.1\
    \ Introduction to encapsulation\n\n**Encapsulation** is the process of enclosing\
    \ data and function within a physical or logical package. It helps the developers\
    \ to prevent the access to the essential details of an application. It binds the\
    \ code and data together.\n\n**Abstraction** states that all the information is\
    \ present, but only **relevant information** is provided to the user.\n\nAbstraction\
    \ and encapsulation are related features. Encapsulation assists abstraction by\
    \ providing means of hiding the non-essential details. Using encapsulation some\
    \ information is visible and others are hidden.\n\n## 11.2 Access specifier in\
    \ C#\n\nAn access specifier defines the scope of a class member. The member is\
    \ used for referring the functions and variables of a class. A program consists\
    \ of one or more classes. Some member of the class needs to be accessed by other\
    \ classes.\n\n### Types of Access Specifier\n\nThe following access specifiers\
    \ are supported by C#.\n\n- public\n- private\n- protected\n- internal\n\n###\
    \ public\n\nPublic specifier allows the class to expose its variables and functions.\
    \ The member declared as public can be accessed from outside the class.\n\n```csharp\n\
    Example 38:\nusing System;\nnamespace string1\n{\n    class User\n    {\n    \
    \    public string name;\n        public int age;\n        public void AddValue()\n\
    \        {\n            Console.WriteLine(\"Enter the user name:\");\n       \
    \     name = Console.ReadLine();\n        }\n        public void Show()\n    \
    \    {\n            Console.WriteLine(\"User name is:{0}\",name);\n        }\n\
    \    }\n    class Program\n    {\n        static void Main(string[] args)\n  \
    \      {\n            User u = new User();\n            u.AddValue();\n      \
    \      u.Show();\n            Console.Read();\n        }\n    }\n}\n```\n\n###\
    \ private\n\nThe private specifier allows the class to hide its variables and\
    \ functions from other classes. Only the class itself can access the private members.\n\
    \n```csharp\nExample 39:\nusing System;\nnamespace string1\n{\n    class Student\n\
    \    {\n        private string name;\n        private int age;\n        public\
    \ void AddValue()\n        {\n            Console.WriteLine(\"Enter the student\
    \ name:\");\n            name = Console.ReadLine();\n        }\n        public\
    \ void Show()\n        {\n            Console.WriteLine(\"Student name is:{0}\"\
    ,name);\n        }\n    }\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            Student s = new Student();\n            s.AddValue();\n\
    \            s.Show();\n            Console.Read();\n        }\n    }\n}\n```\n\
    \n### protected\n\nProtected access specifier allows the class to hide the member\
    \ variables and functions from other class objects and functions, except from\
    \ child classes. The specifier is useful during the implementation of inheritance.\n\
    \n```csharp\nExample 40:\nusing System;\nnamespace string1\n{\n    class Employee\n\
    \    {\n        protected string name;\n        public void AddValue()\n     \
    \   {\n            Console.WriteLine(\"Enter the employee name:\");\n        \
    \    name = Console.ReadLine();\n        }\n        public void Show()\n     \
    \   {\n            Console.WriteLine(\"Employee name is:{0}\",name);\n       \
    \ }\n    }\n    class Program\n    {\n        static void Main(string[] args)\n\
    \        {\n            Employee e = new Employee();\n            e.AddValue();\n\
    \            e.Show();\n            Console.Read();\n        }\n    }\n}\n```\n\
    \n### internal\n\nInternal access specifier allows a class to expose its member\
    \ functions and variables to the containing child classes or classes within the\
    \ same application.\n"
  mdcn: "\n\n## 10.2 字符串类的属性和方法\n\n字符串类的属性\n\n- Chars: 获取 String 对象中特定位置的 Char 对象\n\
    - Length: 获取 String 对象中字符的数量\n\n字符串类的方法\n\n- public bool Equals(string value)\n\
    检查当前 String 对象与指定的对象是否具有相同的值\n- public string Insert(int startIndex, string value)\n\
    返回一个新字符串，其中指定的字符串插入到特定的索引位置\n- public string Replace(char oldchar, string newValue)\n\
    将字符串对象中所有特定字符出现的位置替换为 Unicode 字符，并返回新字符串\n- public int LastIndexOf(string value)\n\
    返回字符串对象中最后一次出现 Unicode 字符的索引位置（从 0 开始）\n- public string Trim()\n返回对象中所有开头和结尾的空白字符\n\
