    # # 9.1 Introduction to arrays


    An array is a collection of values of similar data type. The variables in the
    array are known as the elements of the array. The array elements are accessed
    using a single name and an index number representing the position of the element
    within the array.


    An array has a rank that determines the number of indices associated with every
    array element. The rank of the array is also referred to as the dimensions of
    the array. The following figure shows the array structure in the system.


    ![](img/c133ae999967b1fbceab3bccc1cb1d4f_82_0.png)'
  - '[PAGE 83]


    # 9.2 Arrays declaration


    An array is declared before it is used in any program. The following syntax is
    used to declare an array.


    ```

    datatype[] ArrayName;

    ```


    The syntax of an array involves the components mentioned below:


    +   - datatype: Used for specifying the data type for elements. It will be stored
    in an array.

    - [] : Specify the size of the array and is referred to as rank.

    - ArrayName: States the name of the array.'
  - '[PAGE 84]


    # 9.3 Initializing and adding values


    The **new** keyword is used to create an instance of the array. The size of array
    is specified when it is initialized. The following code snippet is used to initialize
    the array.


    ```

    int [ ] x;

    x = new int [15];

    ```


    The array can be initialized by combining the two statements and is written as:
    int [ ] x = new int [15];


    # Assigning values to an array


    The values can be assigned to each element of the array using the **index number**.
    It is also known as subscript of the element. The following code snippet is used
    for assigning the values to an array.


    ```

    int [ ] amount = new int [5];

    int [0] = 50;

    ```


    The array can be created and initialized using the following code:


    ```

    int [ ] amount = { 40,60,70,80};

    ```


    The size of an array can be removed.


    ```

    int [ ] age = new int[ ] { 21,31,40 };

    ```


    When a user copies the data from one array into another, the source and target
    array refer to same location. The following code snippet shows the copying of
    one array to another.


    ```

    int [ ] age = new int[ ] { 12,14,15,16};

    int [ ] amount = age;

    ```


    The two arrays as **age** and **amount** are created. They point to same memory
    location.'
