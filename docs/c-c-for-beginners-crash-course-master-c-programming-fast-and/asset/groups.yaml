    # 11.5 Dynamic Polymorphism


    C# has two approaches for implementing dynamic polymorphism. They are:


    +   - **Abstract classes**: They are unique type of base classes containing abstract
    class members. The class members derived from the abstract class must implement
    abstract functions and properties.

    - **Virtual functions**: They do not really exist. They appear to be present in
    some parts.


    # Abstract class


    An abstract class provides partial implementation of the class. When the derived
    class inherits it, the implementation is completed. There are abstract methods
    which are implemented using derived class.


    # Rules for abstract class creation


    +   - User cannot declare an abstract method outside the abstract class

    - The instance of the abstract class cannot be created

    - A class derived from an abstract class must override all the methods of the
    class

    - The abstract class cannot be declared as **sealed**


