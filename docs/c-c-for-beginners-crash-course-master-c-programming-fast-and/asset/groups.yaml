    decimal is used without prefix.


    Some of the examples of integer literals are 15, 0321, 0x5b, 30l.


    # Floating point literals


    Floating point literal consist of integer part, fraction part, decimal part, and
    an exponent part. The floating point literals can be represented in exponent or
    decimal form.


    Floating point literals can be mentioned as 3.1415, 1423E-6L.


    # Character Literals


    Character literals represent a single character. They are enclosed in single quotes.
    Characters that are preceded by a backslash are called escape characters and some
    of these escape characters have special meanings when used in a string to designate
    a special function such as creating a tab or a carriage return. Below is a list
    of some of these special escape characters:


    +   * \'' single quote

    * " Double quote

    * \ Backslash

    * \0 null

    * \a Alert

    * \b Backspace

    * \f feed

    * \t Horizontal tab

    * \v Vertical tab

    * \r Carriage return


    # String Literals


    There are two string literals types supported by C#: regular string literals and
    verbatim string literals. Regular string literals contain zero or more characters
    enclosed in double quotes.


    A verbatim string literals contains @ character followed by a double quote character,
    zero or more character. A verbatim string literal can span multiple lines.


    Examples showing string literals.'
