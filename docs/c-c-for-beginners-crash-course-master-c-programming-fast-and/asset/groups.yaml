    The function is used for accepting input from the user and stored into variable.


    Example:


    ```

    int no;

    no=Convert.ToInt32(Console.ReadLine());

    ```


    The `Convert.ToInt32()` function converts the data entered by the user to integer
    data type. The function accepts the data in string format.


    # Lvalue and RValue Expressions


    The two types of expressions in C# are:


    +   - **lvalue**: The expression is an lvalue appears on the left side of the
    assignment.

    - **rvalue**: The expression is an rvalue that appears on the right side but not
    on the left side of the assignment.


    The variables are lvalues and hence appear on the left side of the assignment.
    The numeric values are rvalues and hence appear on the right side.


    ```

    int a=50;

    ```'
