    \ and the control moves out of the loop.\n\n# 7.5 Continue statement\n\nThe continue\
    \ statement is similar to the break statement, but instead of breaking out of\
    \ the loop the **continue** forces the next iteration of the loop, skipping any\
    \ code in between.\n\nSyntax:\n\n```csharp\ncontinue;\n```\n\nFlow Chart\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_64_0.png)\n\
    \nExample of Continue statement\n\n### Example 17:\n```csharp\nusing System;\n\
    namespace continue\n{\n    class Program\n    {\n        int i=45;\n        do\n\
    \        {\n          if(i<=50) {\n            i=i+1;\n            continue;\n\
    \          }\n          Console.WriteLine(\"Value of i:{0}\",i);\n          i++;\n\
    \        } while(i<60) {\n          Console.ReadLine();\n        }\n    }\n}\n\
    ```\n\nSo in the code example above we can see a combination of the do-while loop\
    \ and continue in action. We can see that i is initially set as a 45 when it enters\
