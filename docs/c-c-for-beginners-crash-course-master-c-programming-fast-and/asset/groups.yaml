    - public char[] ToCharArray()\n返回一个包含当前对象中所有字符的 Unicode 字符数组\n- public string\
    \ ToLower()\n返回一个转换为小写的字符串副本\n\n## 10.3 演示字符串功能的示例\n\n### 字符串比较\n\n```csharp\n\
    Example 35:\nusing System;\nnamespace string1\n{\n    class Program\n    {\n \
