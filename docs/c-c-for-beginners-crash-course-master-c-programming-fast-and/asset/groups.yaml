    \           if(i>13)\n                {\n                    break;\n        \
    \        }\n            }\n            Console.ReadLine();\n        }\n    }\n\
    }\n```\n\nIn the code example, value of variable i is assigned to 11. The while\
    \ loop checks the condition of i. If the condition is true, the statements in\
    \ the while loop are executed. The value for i is incremented.\n\nIf loop checks\
