  - "[PAGE 130]\n\n# # 13.3 Introduction to exception handling\n\nAn **exception**\
    \ is an error that occurs during the execution of a program. The exception occurs\
    \ when an operation is not completed normally, thus the system throws an error\
    \ when an exception occurs.\n\nC #exception handling is based on four keywords:\
    \ **try, catch, finally and throw.**\n\n+   - **try**: Try block checks the block\
    \ of code for a particular exception when activated. One or more catch blocks\
    \ are present.\n- **catch**: The catch keyword is used to catch the exceptions.\
    \ A program catches an exception at a place in the program where user wants to\
    \ handle the issue.\n- **finally**: The finally block is used to execute statements\
    \ even if the exception is thrown or not.\n- **throw**: The throw keyword is used\
    \ to throw an exception.\n\nSyntax:\n\n```\ntry\n{\n    //statements causing exception\n\
    }\ncatch( ExceptionName e1 )\n{\n    //error handling code\n}\ncatch( ExceptionName\
    \ e2 )\n{\n    //error handling code\n}\ncatch( ExceptionName eN )\n{\n    //error\
    \ handling code\n}\nfinally\n{\n    //statements to be executed\n}\n```"
- md: "\n## 13.4 Exception classes in C#\n\nThere are several exception classes which\
    \ are directly or indirectly derived from the System.Exception class. Some of\
    \ the classes that are derived from the System.Exception class are System.ApplicationException\
    \ and System.Exception classes.\n\nFor a user-defined application having its own\
    \ exception, the exception must be inherited from the ApplicationException class.\n\
    \nThe System.Exception class is the base class for all exceptions.\n\n| Exception\
    \ class | Description |\n|---|---|\n| System.IO.IOException | It handles the I/O\
    \ Errors |\n| System.NullReferenceException | Errors generated during the process\
    \ of dereferencing a null object |\n| System.IndexOutOfRangeException | Errors\
    \ generated when a method refers an array element out of bound |\n| System.DivideByZeroException\
    \ | Errors generated during the process of dividing the dividend by zero |\n|\
    \ System.OutOfMemoryException | Memory allocation to the application errors |\n\
    | System.InvalidCastException | Errors due to type casting |\n| System.StackOverflowException\
    \ | The errors generated due to stack overflow |\n\n## 13.5 Exception handling\n\
    \nThe structured solution in the form of try and catch block is provided by C#.\
    \ The core program statements are divided from the error handling statements.\
    \ The finally block is used to handle errors.\n\nExample:\n\n```\nExample 51:\n\
    using System;\nnamespace DivNumbers\n{\n    class Divide\n    {\n        int output;\n\
    \        Divide()\n        {\n            output = 0;\n        }\n\n        public\
    \ void division(int no1, int no2)\n        {\n            try\n            {\n\
    \                output = no1 / no2;\n            }\n            catch(DivideByZeroException\
    \ e)\n            {\n                Console.WriteLine(\"Exception handled:{0}\"\
    ,e);\n            }\n            finally\n            {\n                Console.WriteLine(\"\
    Output is:{0}\",output);\n            }\n        }\n        public static void\
    \ Main(string[] args)\n        {\n            Divide d = new Divide();\n     \
    \       d.division(5,0);\n            Console.Read();\n        }\n    }\n}\n```\n\
    \nWhen the code is compiled and executed, the output is:\n\nException handled:\
    \ System.DivideByZeroException: Attempted to divide by zero\n\nOutput is: 0\n\n\
    ## 13.6 User defined exceptions\n\nUsers can create their own exception classes\
    \ when the situation arises where the user needs to handle an exception in a special\
    \ way using custom code. These exceptions are known as user defined exceptions.\n\
    \nThe user defined exceptions classes are derived from the ApplicationException\
    \ class.\n\n```\n### Example 52:\nusing System;\nnamespace userdefined\n{\n  \
    \  class Average\n    {\n        static void Main(string[] args)\n        {\n\
    \            Perform p = new Perform();\n            try\n            {\n    \
    \            p.CalAverage();\n            }\n            catch (CountZeroException\
    \ e)\n            {\n                Console.WriteLine(\"CountZeroException: {0}\"\
    ,e.Message);\n            }\n            Console.Read();\n        }\n    }\n}\n\
    public class CountZeroException:ApplicationException\n{\n    public CountZeroException(string\
    \ message):base(message)\n    {\n    }\n}\npublic class Perform\n{\n    int n1\
    \ = 0;\n    int count = 0;\n    float average;\n    public void CalAverage()\n\
    \    {\n        if(count == 0)\n        {\n            throw(new CountZeroException(\"\
    Count is zero in calculation\"));\n        }\n    }\nelse\n{\n    average = no1\
    \ / count;\n}\n}\n}\n```\n\nWhen the code is compiled and executed, the output\
    \ is:\n\nCountZeroException: Count is zero in calculation\n\n## Chapter 14 Multithreading\n\
    \n## 14.1 Thread in C#\n\nA thread defines a control flow. Thread is a basic unit\
    \ to which the operating system allocates a thread. The execution of a thread\
    \ is independent within a program.\n\nA single process is executed using one thread.\
    \ Such process is known as single-threaded process. Only one task can be performed\
    \ at a time. The user has to wait for the task to complete before executing new\
    \ task.\n\nFor executing more than one thread at a time, multiple threads are\
    \ created. The process creating two or more threads is known as multithreading.\n\
    \n## 14.2 Life cycle of a thread\n\nThe life cycle of a thread starts when the\
    \ object of System.Threading.Thread class is created. The life ends as soon as\
    \ the task is completed. There are various states in the life cycle of a thread.\n\
    \n- Unstarted State: When the instance of the Thread class is created, the thread\
    \ enters in unstarted state.\n- Ready State: The thread is in this state till\
    \ the program calls the Start() method.\n- Not Runnable State: A thread is not\
    \ in the runnable state if:\n  1. Waiting: The Wait() method is called to make\
    \ the thread for a specified condition\n  2. Blocked: The thread is blocked by\
    \ an I/O operation\n  3. Sleeping: The Sleep() method is called to put the thread\
    \ in sleeping mode.\n- Dead State: Once the thread completes its execution or\
    \ aborted, it is placed in a dead state\n\n## 14.3 Main thread\n\nThe System.Threading.Thread\
    \ class is used for working with threads. The main thread is created soon as program\
    \ starts execution. The Thread class is used for creating threads. They are known\
    \ as child threads. The user can access the main thread by using the CurrentThread\
    \ property.\n\nExample:\n\n```\nusing System;\nnamespace thread\n{\n    static\
    \ void Main(string[] args)\n    {\n        Thread t1 = new Thread();\n       \
    \ t1.Name=\"Thread1\";\n        Console.WriteLine(\"Thread is:{0}\",t1.Name);\n\
    \        Console.Read();\n    }\n}\n```\n\nWhen the code is compiled and executed,\
    \ the output is:\n\nThread is: Thread1\n\n## 14.4 Properties and methods of Thread\
    \ class\n\nProperties:\n\n- **IsAlive**: The value showing the execution status\
    \ of the current thread\n- **CurrentThread**: The current running thread is retrieved\n\
    - **CurrentContext**: The current context in which the thread is executing\n-\
    \ **ExecutionContext**: The ExecutionContext object contains information about\
    \ different contexts\n- **Name**: Gets or sets name of the thread\n- **ThreadState**:\
    \ The value containing states of the current thread\n- **Priority**: It gets or\
    \ sets the value showing the scheduling priority of a thread\n\nMethods:\n\n-\
    \ **public static void BeginThreadAffinity():**: The host is to about execute\
    \ instructions depending on the current operating system thread.\n- **public void\
    \ Abort():**: The ThreadAbortException is raised in thread on which it is invoked.\n\
    - **public void interrupt():**: The thread present in the WaitSleepJoin state\
    \ is interrupted\n- **public static AppDomain GetDomain():**: A unique domain\
    \ identifier is returned\n- **public static void MemoryBarrier():**: The processor\
    \ executes the current thread. The instructions cannot be reordered.\n- **public\
    \ void Start():**: It starts the thread\n- **public static bool Yield():**: The\
    \ calling thread to yield execution to another thread which is ready to run\n\n\
    ## 14.5 Creating and managing threads\n\nThe extended thread class creates a thread.\
    \ The extended thread class calls the Start method to start the child thread execution.\n\
    \nExample:\n\n```\nExample 54:\nusing System;\nusing System.Threading;\n\nnamespace\
    \ ThreadProgram\n{\n    class ThreadChild\n    {\n        public static void CallChild()\n\
    \        {\n            Console.WriteLine(\"Start child thread\");\n        }\n\
    \        public static void Main(string[] args)\n        {\n            Thread\
    \ child1 = new ThreadStart(CallChild);\n            Console.WriteLine(\"Creating\
    \ child thread\");\n            Thread child2 = new Thread(child1);\n        \
    \    child2.Start();\n            Console.Read();\n        }\n    }\n}\n```\n\n\
    When the code is compiled and executed, the output is:\n\nStart child thread\n\
    Creating child thread\n\n# Managing Threads\n\nWhen there is a need to pause a\
    \ thread for a period of time so that another thread can execute, the Thread.Sleep()\
    \ method is used. The method takes a single argument stating time in milliseconds.\n"
