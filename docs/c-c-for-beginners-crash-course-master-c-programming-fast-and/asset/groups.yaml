    }\n```\n\n当代码被编译并执行时，输出为：\n\nThe value 'user' is present\n\n## 第 11 章 封装与多态\n\n\
    ## 11.1 封装简介\n\n**封装**是将数据和函数封装在物理或逻辑包中的过程。它帮助开发者防止对应用程序核心细节的访问。它将代码和数据结合在一起。\n\
    \n**抽象**是指所有信息都是存在的，但只向用户提供**相关信息**。\n\n抽象和封装是相关的特性。封装通过提供隐藏非要细节的方法来辅助抽象。使用封装，某些信息是可见，而另一些信息是隐藏的。\n\
    \n## 11.2 C# 中的访问修饰符\n\n访问修饰符定义了类成员的范围。该成员用于引用类的函数和变量。一个程序由一个或多个类组成。类的某些成员需要被其他类访问。\n\
    \n### 访问修饰符类型\n\nC# 支持以下访问修饰符：\n\n- public\n- private\n- protected\n- internal\n\
    \n### public\n\npublic 修饰符允许类暴露其变量和函数。声明为 public 的成员可以从类外部访问。\n\n```csharp\nExample\
    \ 38:\nusing System;\nnamespace string1\n{\n    class User\n    {\n        public\
    \ string name;\n        public int age;\n        public void AddValue()\n    \
    \    {\n            Console.WriteLine(\"Enter the user name:\");\n           \
    \ name = Console.ReadLine();\n        }\n        public void Show()\n        {\n\
    \            Console.WriteLine(\"User name is:{0}\",name);\n        }\n    }\n\
    \    class Program\n    {\n        static void Main(string[] args)\n        {\n\
    \            User u = new User();\n            u.AddValue();\n            u.Show();\n\
    \            Console.Read();\n        }\n    }\n}\n```\n\n### private\n\nprivate\
    \ 修饰符允许类向其他类隐藏其变量和函数。只有类本身可以访问私成员。\n\n```csharp\nExample 39:\nusing System;\n\
    namespace string1\n{\n    class Student\n    {\n        private string name;\n\
    \        private int age;\n        public void AddValue()\n        {\n       \
    \     Console.WriteLine(\"Enter the student name:\");\n            name = Console.ReadLine();\n\
    \        }\n        public void Show()\n        {\n            Console.WriteLine(\"\
    Student name is:{0}\",name);\n        }\n    }\n    class Program\n    {\n   \
    \     static void Main(string[] args)\n        {\n            Student s = new\
    \ Student();\n            s.AddValue();\n            s.Show();\n            Console.Read();\n\
    \        }\n    }\n}\n```\n\n### protected\n\nprotected 访问修饰符允许类向其他类对象和函数隐藏成员变量和函数，子类除外。该饰符在实现继承时有用。\n\
    \n```csharp\nExample 40:\nusing System;\nnamespace string1\n{\n    class Employee\n\
    \    {\n        protected string name;\n        public void AddValue()\n     \
    \   {\n            Console.WriteLine(\"Enter the employee name:\");\n        \
    \    name = Console.ReadLine();\n        }\n        public void Show()\n     \
    \   {\n            Console.WriteLine(\"Employee name is:{0}\",name);\n       \
    \ }\n    }\n    class Program\n    {\n        static void Main(string[] args)\n\
    \        {\n            Employee e = new Employee();\n            e.AddValue();\n\
    \            e.Show();\n            Console.Read();\n        }\n    }\n}\n```\n\
    \n### internal\n\ninternal 访问修饰符允许类向包含的子类或同一应用程序中的类暴露其成员函数和变量。\n\n"
