    # 14.1 Thread in C#


    A thread defines a control flow. Thread is a basic unit to which the operating
    system allocates a thread. The execution of a thread is independent within a program.


    A single process is executed using one thread. Such process is known as single-threaded
    process. Only one task can be performed at a time. The user has to wait for the
    task to complete before executing new task.


    For executing more than one thread at a time, multiple threads are created. The
    process creating two or more threads is known as multithreading.'
