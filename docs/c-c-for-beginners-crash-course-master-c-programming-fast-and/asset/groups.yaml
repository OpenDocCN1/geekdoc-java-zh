    \n用户自定义异常类派自 ApplicationException 类。\n\n```\n### Example 52:\nusing System;\n\
    namespace userdefined\n{\n    class Average\n    {\n        static void Main(string[]\
    \ args)\n        {\n            Perform p = new Perform();\n            try\n\
    \            {\n                p.CalAverage();\n            }\n            catch\
    \ (CountZeroException e)\n            {\n                Console.WriteLine(\"\
    CountZeroException: {0}\",e.Message);\n            }\n            Console.Read();\n\
    \        }\n    }\n}\npublic class CountZeroException:ApplicationException\n{\n\
    \    public CountZeroException(string message):base(message)\n    {\n    }\n}\n\
    public class Perform\n{\n    int n1 = 0;\n    int count = 0;\n    float average;\n\
    \    public void CalAverage()\n    {\n        if(count == 0)\n        {\n    \
    \        throw(new CountZeroException(\"Count is zero in calculation\"));\n  \
    \      }\n    }\nelse\n{\n    average = no1 / count;\n}\n}\n}\n```\n\n当代码被编译并执行时，输出为：\n\
    \nCountZeroException: Count is zero in calculation\n\n## 第 14 章 多线程\n\n## 14.1\
    \ C# 中的线程\n\n线程定义了一个控制流。线程是操作系统分配线程的基单元。线程的执行在程序内部是独立的。\n\n单个进程使用一个线程执行。这种进程被称为单线程进程。一次只能执行一个任务。用户必须等待任务完成后才能执行新任务。\n\
    \n为了同时执行多个一个线程，会创建多个线程。创建两个或更多线程的过程被称为多线程处理。\n\n## 14.2 线程的生命周期\n\n线程的生命周期从创建\
    \ System.Threading.Thread 类对象时开始。任务一完成，生命周期结束。线程的生命周期中有多种状态。\n\n- 未启动状态（Unstarted\
    \ State）：当创建 Thread 类的实例时，线程进入未启动状态。\n- 就绪状态（Ready State）：在程序调用 `Start()` 方法之前，线程一直处于此状态。\n\
    - 不可运行状态（Not Runnable State）：如果满足以下情况，线程不处于运行状态：\n  1. 等待（Waiting）：调用 `Wait()`\
    \ 方法使线程等待特定条件。\n  2. 阻塞（Blocked）：线程被 I/O 操作阻塞。\n  3. 睡眠（Sleeping）：调用 `Sleep()`\
    \ 方法将线程置于睡眠模式。\n- 死亡状态（Dead State）：一旦线程完成执行或被中止，它就会被置于死亡状态。\n\n## 14.3 主线程\n\n\
    System.Threading.Thread 类用于处理线程。主线程在程序开始执行时就会被创建。Thread 类用于创建线程，它们被称为子线程。用户可以通过\
    \ `CurrentThread` 属性访问主线程。\n\n示例：\n\n```\nusing System;\nnamespace thread\n{\n\
    \    static void Main(string[] args)\n    {\n        Thread t1 = new Thread();\n\
    \        t1.Name=\"Thread1\";\n        Console.WriteLine(\"Thread is:{0}\",t1.Name);\n\
    \        Console.Read();\n    }\n}\n```\n\n当代码被编译并执行时，输出为：\n\nThread is: Thread1\n\
    \n## 14.4 Thread 类的属性和方法\n\n属性：\n\n- **IsAlive**：显示线程执行状态的值。\n- **CurrentThread**：检索当前运行的线程。\n\
    - **CurrentContext**：线程执行的当前上下文。\n- **ExecutionContext**：包含不同上下文的 ExecutionContext\
    \ 对象。\n- **Name**：获取或设置线程名称。\n- **ThreadState**：包含线程状态的值。\n- **Priority**：获取或设置线程调度优先级。\n\
    \n方法：\n\n- `public static void BeginThreadAffinity()`：关于当前操作系统线程。\n- `public void\
    \ Abort()`：在调用的线程上抛出 ThreadAbortException。\n- `public void interrupt()`：中断处于 WaitSleepJoin\
    \ 状态的线程。\n- `public static AppDomain GetDomain()`：返回唯一的域标识符。\n- `public static\
    \ void MemoryBarrier()`：处理器执行当前线程。指令不能重排序。\n- `public void Start()`：启动线程。\n- `public\
    \ static bool Yield()`：让调用线程让其他就绪的线程执行。\n\n## 14.5 创建和管理线程\n\n扩展线程类创建一个线程。扩展线程类调用\
    \ Start 方法启动子线程执行。\n\n示例：\n\n```\nExample 54:\nusing System;\nusing System.Threading;\n\
    \nnamespace ThreadProgram\n{\n    class ThreadChild\n    {\n        public static\
    \ void CallChild()\n        {\n            Console.WriteLine(\"Start child thread\"\
    );\n        }\n        public static void Main(string[] args)\n        {\n   \
    \         Thread child1 = new ThreadStart(CallChild);\n            Console.WriteLine(\"\
    Creating child thread\");\n            Thread child2 = new Thread(child1);\n \
    \           child2.Start();\n            Console.Read();\n        }\n    }\n}\n\
    ```\n\n当代码被编译并执行时，输出为：\n\nStart child thread\nCreating child thread\n\n# 管理线程\n\
    \n当需要暂停线程一段时间以便另一个线程执行时，使用 `Thread.Sleep()` 方法。该方法接受一个参数，表示单位为毫秒的时间。\n\n"
