    # # 11.1 Introduction to encapsulation


    **Encapsulation** is the process of enclosing data and function within a physical
    or logical package. It helps the developers to prevent the access to the essential
    details of an application. It binds the code and data together.


    **Abstraction** states that all the information is present, but only **relevant
    information** is provided to the user.


    Abstraction and encapsulation are related features. Encapsulation assists abstraction
    by providing means of hiding the non-essential details. Using encapsulation some
    information is visible and others are hidden.'
