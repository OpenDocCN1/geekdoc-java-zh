  md: "# 14.2 Life cycle of a thread\n\nThe life cycle of a thread starts when the\
    \ object of System.Threading.Thread class is created. The life ends as soon as\
    \ the task is completed. There are various states in the life cycle of a thread.\n\
    \n+   * Unstarted State: When the instance of the Thread class is created, the\
    \ thread enters in unstarted state.\n* Ready State: The thread is in this state\
    \ till the program calls the Start() method.\n* Not Runnable State: A thread is\
    \ not in the runnable state if:\n  1. Waiting: The Wait() method is called to\
    \ make the thread for a specified condition\n  2. Blocked: The thread is blocked\
    \ by an I/O operation\n  3. Sleeping: The Sleep() method is called to put the\
    \ thread in sleeping mode.\n* Dead State: Once the thread completes its execution\
    \ or aborted, it is placed in a dead state"
