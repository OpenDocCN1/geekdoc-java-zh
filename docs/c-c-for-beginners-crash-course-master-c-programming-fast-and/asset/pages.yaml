  md: "# Chapter 1 Introduction to C#\n\n# 1.1 Overview of C#\n\nC# is an object oriented,\
    \ type safe high level programming language. It has been\ndeveloped by Microsoft\
    \ during the development of the .NET framework. C# was\ndeveloped for the Common\
    \ Language Infrastructure (CLI), this infrastructure was\ncreated to allow programs\
    \ from various other high level languages to work together\n the need to rewrite\
    \ those programs entirely. The CLI contains a various\nexecutable programs referred\
    \ simply as executables and are housed and ran in a system\ncalled the runtime\
    \ environment.\n\nAll the programs created in .Net framework execute in an environment\
    \ that handles the\nruntime requirements. The Common Language Runtime (CLR) provides\
    \ the virtual\nmachine, which helps the programmers not to consider the CPU specifications.\
    \ The\nclass library and CLR make the .NET framework."
  merge: -1
