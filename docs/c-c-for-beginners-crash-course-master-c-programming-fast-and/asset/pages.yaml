    ```

    int [ ] amount = { 40,60,70,80};

    ```


    The size of an array can be removed.


    ```

    int [ ] age = new int[ ] { 21,31,40 };

    ```


    When a user copies the data from one array into another, the source and target
    array refer to same location. The following code snippet shows the copying of
    one array to another.


    ```

    int [ ] age = new int[ ] { 12,14,15,16};

    int [ ] amount = age;

