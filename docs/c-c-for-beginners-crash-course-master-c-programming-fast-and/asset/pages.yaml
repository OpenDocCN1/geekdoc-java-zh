  md: '# Chapter 4 Variables and Constants


    # 4.1 Exploring variables in C#


    A variable is name assigned to the memory location used by the programs. Every
    variable has a data type associated with it. The data type determines the size
    of the variable’s memory used for storing within the memory.


    The data types provided by C# are distinguished as:


    +   1. Integral types: int, unit, short, byte, sbyte, long, ulong, and char

    2. Floating point types: double, float

    3. Decimal types: decimal

    4. Boolean type: true or false values

    5. Nullable type: nullable data type

    6. Reference type: class


    Defining Variables


    The syntax for declaring the variables is:


    ```

    <data_type> <variable_list>;

    ```


    Where, data_type is a valid C# data type. It can be int, char, float, double,
    or a user defined type. The variable_list contains one or more identifiers.


    Examples of variables


    ```

    int a,b,c;

    char x,y;

    float price, totolcost;

    double area;

    ```


    # Initializing Variables


    The variables are initialized using an equal sign and followed by an expression.
    The syntax for initializing variable is:'
