  md: "# # 13.3 Introduction to exception handling\n\nAn **exception** is an error\
    \ that occurs during the execution of a program. The exception occurs when an\
    \ operation is not completed normally, thus the system throws an error when an\
    \ exception occurs.\n\nC #exception handling is based on four keywords: **try,\
    \ catch, finally and throw.**\n\n+   - **try**: Try block checks the block of\
    \ code for a particular exception when activated. One or more catch blocks are\
    \ present.\n- **catch**: The catch keyword is used to catch the exceptions. A\
    \ program catches an exception at a place in the program where user wants to handle\
    \ the issue.\n- **finally**: The finally block is used to execute statements even\
    \ if the exception is thrown or not.\n- **throw**: The throw keyword is used to\
    \ throw an exception.\n\nSyntax:\n\n```\ntry\n{\n    //statements causing exception\n\
    }\ncatch( ExceptionName e1 )\n{\n    //error handling code\n}\ncatch( ExceptionName\
    \ e2 )\n{\n    //error handling code\n}\ncatch( ExceptionName eN )\n{\n    //error\
    \ handling code\n}\nfinally\n{\n    //statements to be executed\n}\n```"
