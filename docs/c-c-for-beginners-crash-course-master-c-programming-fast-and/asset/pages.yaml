  md: '# 14.4 Properties and methods of the Thread class


    Properties:


    +   - **IsAlive**: The value showing the execution status of the current thread

    - **CurrentThread**: The current running thread is retrieved

    - **CurrentContext**: The current context in which the thread is executing retrieved

    - **ExecutionContext**: The ExecutionContext object contains information about
    different contexts

    - **Name**: Gets or sets name of the thread

    - **ThreadState**: The value containing states of the current thread

    - **Priority**: It gets or sets the value showing the scheduling priority of a
    thread


    Methods:


    +   - **public static void BeginThreadAffinity():**: The host is to about to execute
    instructions depending on the current physical operating system thread.

    - **public void Abort():**: The ThreadAbortException is raised in thread on which
    it is invoked.

    - **public void interrupt():**: The thread present in the WaitSleepJoin state
    is interrupted

    - **public static AppDomain GetDomain():**: A unique domain identifier is returned

    - **public static void MemoryBarrier():**: The processor executes the current
    thread. The instructions cannot be reordered.

    - **public void Start():**: It starts the thread

    - **public static bool Yield():**: The calling thread to yield execution to another
    thread which is ready to run on the processor'
