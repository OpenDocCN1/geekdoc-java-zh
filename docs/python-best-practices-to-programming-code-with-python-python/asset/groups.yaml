    \n# Legal Notice:\n\nThis book is copyright protected. This is only for personal\
    \ use. You cannot amend, distribute, sell, use, quote or paraphrase any part or\
    \ the content within this book without the consent of the author.\n\n# Disclaimer\
    \ Notice:\n\nPlease note the information contained within this document is for\
    \ educational and entertainment purposes only. Every attempt has been made to\
    \ provide accurate, up to date and reliable complete information. No warranties\
    \ of any kind are expressed or implied. Readers acknowledge that the author is\
    \ not engaging in the rendering of legal, financial, medical or professional advice.\
    \ The content of this book has been derived from various sources. Please consult\
    \ a licensed professional before attempting any techniques outlined in this book.\n\
    \nBy reading this document, the reader agrees that under no circumstances is the\
    \ author responsible for any losses, direct or indirect, which are incurred as\
    \ a result of the use of information contained within this document, including,\
    \ but not limited to, errors, omissions, or inaccuracies.\n\n# Introduction\n\n\
    I want to thank you and congratulate you for reading the book, “Python: Best Practices\
    \ for Programming Code with Python”. This book contains proven steps and strategies\
    \ on how to program in Python more effectively. When you first learn Python, you\
    \ will be taught how to write code, but in many cases, you will not be taught\
    \ how to write that code neatly.\n\nIf you speak to any Python programmer, ask\
    \ them what it is like about Python. I guarantee they will tell you that one of\
    \ the main reasons is because it is easily readable. In fact, this is the absolute\
    \ heart of the Python language, simply because computer code is read far more\
    \ than it is written. Much of this is down to the fact that Python code follows\
    \ a set of guidelines and “Pythonic” idioms – if you hear a programmer refer to\
    \ a part of the code as not being “Pythonic”, it means that it doesn’t follow\
    \ those guidelines and it doesn’t express intent in any readable manner.\n\nCode\
    \ style and layout is incredibly important, as is consistency in the style that\
    \ you use. With that said, there are times when consistency isn’t the right thing\
    \ and the guidelines are simply not applicable – you have to know when that time\
    \ is and that is when best judgment comes into programming with Python.\n\nWith\
    \ this guide, I am going to show you the absolute best way to write your code,\
    \ tidying up your program and making it all more effective and efficient. I won’t\
    \ just give you the basic. I will delve deep into everything you need to know,\
    \ from the layout of the code to how to write functions, idioms, and names.\n\n\
    I will talk about whitespaces and tabs, strings, and methods. I will also be giving\
    \ you some general recommendations for Python programming along with the general\
    \ concepts. In short, by the time you have read my Best Practice guide, you will\
    \ be the best Python programmer you can possibly be.\n\nMy book does assume some\
    \ prior knowledge of Python programming, so if you are a complete newbie to the\
    \ programming scene, please familiarize yourself with Python code before you read\
    \ this book. My aim is to help you to produce Python code that is free from, or\
    \ at least has very few, complications or obvious problems, as well as making\
    \ it more readable for others.\n\nThanks again for reading this book, I hope you\
    \ enjoy it!\n\n# Chapter 1: General Concepts of Python Coding\n\nBefore we get\
    \ properly into the book, these are the general concepts of coding that you should\
    \ be aware of; concepts that will make life easier for you.\n\n# Explicit Code\n\
    \nWhile you can do all sorts of weird wonderful things with Python, it is best\
    \ to keep it straightforward and explicit.\n\n# A Bad Example:\n\n```python\n\
    def make_complex(*args):\n    x, y = args\n    return dict(**locals())\n```\n\n\
    # A Good Example:\n\n```python\ndef make_complex(x, y):\n    return {'x': x, 'y':\
    \ y}\n```\n\nCompare these examples; in the latter example of code, we explicitly\
    \ received x and y from the caller and the return is an explicit dictionary.\n\
    \nThe developer who wrote this knows what to do just by looking at the first line\
    \ and the last line; this is not the case with the bad example.\n\n# One Line,\
    \ One Statement\n\nWhile there are compound statements, like the list comprehensions,\
    \ that are allowed and, in many cases, appreciated, it is not good practice to\
    \ have 2 statements that are disjointed on one code line.\n\n# A Bad Example:\n\
    \n```python\nprint 'one'; print 'two'\nif x == 1: print 'one'\n\nif <complex comparison>\
    \ and <other\ncomplex comparison>:\n  # do something\n```\n\n# A Good Example:\n\
    \n```python\nprint 'one'\nprint 'two'\n\nif x == 1:\n  print 'one'\n\ncond1 =\
    \ <complex comparison>\ncond2 = <other complex comparison>\nif cond1 and cond2:\n\
    \  # do something\n```\n\n# Returning Values\n\nWhen you get a function that is\
    \ ever-growing in complexity, it isn’t unheard of to use several return statements\
    \ in the body of the function. However, if you want to maintain clear intent and\
    \ a good level of readability, you should try not to return values from several\
    \ points in the function body.\n\nWhen it comes to returning values within a function,\
    \ there are 2 cases for doing so: the result that comes from a normally processed\
    \ function return, and the errors that are indicative of incorrect input parameters\
    \ or for any reason that the function cannot complete the computation.\n\nIf you\
    \ don't want exceptions raised for the latter case, then it might be necessary\
    \ for values, such as False or None to be returned, as an indication that the\
    \ function cannot complete the computation. In cases such as this, it is best\
    \ practice to return as soon as the condition has been met.\n\nThat said, if a\
    \ function contains several courses it can go, it can be unwieldy to debug the\
    \ result so it is preferable to maintain just one exit. This also helps in working\
    \ out code paths and, if you have several courses, it could be an indication that\
    \ you need to re-look your code and tidy it up.\n\n# For Example:\n\n```python\n\
    def complexfunction(c, b, a):\n    if not c:\n        return None # Raising an\n\
    \        exception might be better\n    if not b:\n        return None # Raising\
    \ an\n        exception might be better\n    # Some elaborate code that is trying\n\
    \    to make x from c, b and a\n    # Try not to return x if successful\n    if\
    \ not x:\n        # A Plan-B calculation of x\n        return x # One exit point\
    \ for the\n        value x will be helpful\n```\n\n# Chapter 2: Programming Recommendations\n\
    \nThese are the basic recommendations for writing Python code, recommendations\
    \ that you should follow if your code is going to be more effective and efficient\
    \ as well as being readable.\n\n- Your code must be written so that it’t disadvantage\
    \ other Python implementations, such as IronPython, Jython, PyPy, Psyco and Cython.\n\
    \nFor example, you should never rely on the efficient string concatenation of\
    \ CPython that takes the form of a=a+b or a+=b. This is a somewhat fragile optimization,\
    \ even though it super-efficient in CPython, because it won’t work on all type\
    \ and it won’t be present in any Python implementation that does not use refcounting.\n\
    \nInstead, where you use a part of the library that is performance-sensitive,\
    \ you should use the .join() form instead. This will make sure that the concatenation\
    \ is linear across all the different Python implementations.\n\n- Never use an\
    \ equality operator to make comparisons to a singleton such as None. Instead,\
    \ use is or not.\n\nYou should also be wary of using if x when really you should\
    \ be using if is not None.\n"
  mdcn: "\n\n# Python\n\n# Python 编程代码最佳实践\n\n学习编写高效的 Python 编程代码！\n\n![](img/734beba5cf91916b50cacd6baed55049_0_0.png)\n\
    \n# CHARLIE MASTERSON\n\n# Python:\n# 编程代码最佳实践\n\nCharlie Masterson\n\n# 目录\n\n\
    - 引言\n- 第 1 章：Python 编码通用概念\n- 第 2 章：编程建议\n- 第 3 章：代码布局\n- 第 4 章：惯用法\n- 第 5 章：注释\n\
    - 第 6 章：规范\n- 第 7 章：方法与函数参数\n- 第 8 章：命名规范\n- 第 9 章：在语句和表达式中使用空格\n- 结论\n- 关于作者\n\
    \n© Copyright 2017 by Charlie Masterson - 版权所有。\n\n未经作者直接书面许可，本书中的内容不得被复制、复制或传输。\n\
    \n在任何情况下，出版者对因书中包含的信息而直接或间接导致的任何赔偿、损害或金损失不承担任何法律责任。\n\n# 法律声明：\n\n本书受版权保护。此书仅供个人使用。未经作者同意，您不得修改、分发、销售、使用、引用或转述本书的任何部分或内容。\n\
    \n# 免责声明：\n\n请注意，本文包含的信息仅供教育和娱乐目的。我们已尽力提供准确、最新且可靠的完整信息。不提供任何形式的明示或隐含保证。读者承认作者并未提供法律、财务、医疗或专业建议。本书的内容源自各种来源。在尝试尝试书中概述的任何技术之前，请咨询执业的专业人士。\n\
    \n通过阅读本文，读者同意在任何情况下，作者对因使用本文中所包含的信息而导致的任何直接或间接的损失不负责，包括但不限于错误、遗漏或不准确之处。\n\n# 引言\n\
    \n我想感谢你并祝贺你阅读了《Python：编程代码最佳实践》一书。这本书包含了关于如何更有效地进行 Python 编程的成熟步骤和策略。当你初学 Python\
    \ 时，会被教你如何编写代码，但在很多情况下，他们并不会教你如何编写得整洁的代码。\n\n如果你和任何 Python 程序员聊天，问问他们 Python 的感受如何。我保证他们会告诉你，其中一个主要原因是它易于阅读。事实上，这是\
    \ Python 语言绝对的核心，因为计算机代码被阅读的次数远大于编写的次数。这很大程度上归于 Python 代码遵循了一系列指南和“Pythonic”（Python\
    \ 风格）惯用法——如果你听到程序员提到某部分代码不“Pythonic”，意味着它没有遵循这些指南，并且没有以任何可读的方式表达意图。\n\n代码风格和布局极其重要，你所使用的风格的一致性也是如此。尽管如此，有时一致性并不是正确的选择，而且指南简单来说并不适用——你必须知道什么时候是这种时候，这正是进行\
    \ Python 编程时做出最佳判断的时候。\n\n通过本指南，我将向你展示编写代码的绝对最佳，整理你的程序并使其变得更加有效、高效。我不会只给你基础知识。我将深入探讨你需要知道的一切，从代码布局到如何编写函数、惯用法和命名。\n\
    \n我将谈论空格和制表符、字符串和方法。我还会为你提供一些关于 Python 编程的通用建议以及通用概念。简而言之，当你读完我的最佳实践指南时，你将成为你能成为的最优秀的\
    \ Python 程序员。\n\n我的书假设你对 Python 编程有一定的先验知识，所以如果你是编程领域的完全新手，请在阅读此书之前熟悉 Python 代码。我的目标是帮助你产生没有复杂性或至少极少复杂或明显问题的\
    \ Python 代码，并让它对他人更具可读性。\n\n再次感谢阅读本书，希望你喜欢！\n\n# 第 1 章：Python 编码通用概念\n\n在我们正式进入书籍之前，这些是你应该意识到的编码通用概念；这些概念将让你的生活变得更轻松。\n\
    \n# 显式代码\n\n虽然你可以用 Python 许多许多奇奇妙妙的事情，但最好保持其简单直观和显式。\n\n# 坏例子：\n\n```python\n\
    def make_complex(*args):\n    x, y = args\n    return dict(**locals())\n```\n\n\
    # 好例子：\n\n```python\ndef make_complex(x, y):\n    return {'x': x, 'y': y}\n```\n\
    \n比较这些示例；在后者的代码示例中，我们显式地从调用者那里接收 x 和 y，返回是一个显式的字典。\n\n编写这段代码的开发者只需看第一行和最后一行就能知道要做什么；坏例子并非如此。\n\
    \n# 一行一个语句\n\n虽然允许并且在很多情况下受到推崇像复合语句（如列表推导式）这样的语句，但在同一行代码上拥有两个互不关联的语句并不是一种好的做法。\n\
    \n# 坏例子：\n\n```python\nprint 'one'; print 'two'\nif x == 1: print 'one'\n\nif\
    \ <complex comparison> and <other\ncomplex comparison>:\n  # do something\n```\n\
    \n# 好例子：\n\n```python\nprint 'one'\nprint 'two'\n\nif x == 1:\n  print 'one'\n\
    \ncond1 = <complex comparison>\ncond2 = <other complex comparison>\nif cond1 and\
    \ cond2:\n  # do something\n```\n\n# 返回值\n\n当你得到一个复杂性不断增长的函数时，在函数体中使用多个 `return`\
    \ 语句并非罕见。然而，如果你想保持清晰的意图和良好的可读性，你应该尝试不要从函数体中的多个点返回值。\n\n当涉及到函数内部返回值时，有两种情况：来自正常处理函数返回的结果，以及由于输入参数错误或任何导致函数无法完成计算的原因而产生的错误。\n\
    \n如果你不想在后的情况下抛出异常，那么可能需要返回诸如 `False` 或 `None` 的值，作为函数无法完成计算的指示。在这种情况下，最佳实践是尽快返回。\n\
    \n尽管如此，如果一个函数包含多个可能的出口，调试结果可能会变得非常困难，因此最好只保持一个出口。这有助于理清代码路径，而且如果你有多个出口，可能意味着你需要重新审视代码并进行整理。\n\
    \n# 示例：\n\n```python\ndef complexfunction(c, b, a):\n    if not c:\n        return\
    \ None # 抛出异常可能\n        会更好\n    if not b:\n        return None # 抛出异常可能\n  \
    \      会更好\n    # 尝试从 c, b 和 a 生成 x\n    # 如果成功则不要返回 x\n    if not x:\n      \
    \  # 对 x 的方案 B 计算\n        return x # 单一出口对于\n        值 x 将有帮助\n```\n\n# 第 2 章：编程建议\n\
    \n这些是编写 Python 代码的基本建议，如果你希望你的代码更有效、高效且具有可读性，就应该遵循这些建议。\n\n- 你的代码编写方式不能损害其他 Python\
    \ 实现，例如 IronPython、Jython、PyPy、Psyco 和 Cython。\n\n例如，你永远不要依赖 CPython 中高效的字符串拼接（形式为\
    \ `a=a+b` 或 `a+=b`）。这是一种相当脆弱的优化，尽管它在 CPython 中非常高效，因为它并不适用于所有类型，也不会出现在任何不使用引用计数的\
    \ Python 实现中。\n\n相反，当你使用对性能敏感的库部分时，你应该使用 `.join()` 形式。这将确保在所有不同的 Python 实现中连接都是线性的。\n\
    \n- 永远不要使用等值运算符对 `None` 等单例进行比较。相反，请使用 `is` 或 `not`。\n\n你还应该警惕使用 `if x` 而实际上你应该使用\
    \ `if x is not None`。\n\n"
