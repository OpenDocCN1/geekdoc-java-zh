    ```


    # A Bad Example:


    ```

    ham( spam[ 1 ], { eggs: 2 } )

    ```


    +   - Immediately in front of a colon, semicolon or a comma:


    # A Good Example:


    ```

    if x == 4: print x, y; x, y = y, x

    ```


    # A Bad Example:


    ```

    if x == 4: print x, y; x, y = y, x

    ```


    However, where you have a slice, the colon is similar to a binary operator and
    it should contain an equal amount on each side. Where you have an extended slice,
    both of the colons must contain the exact same level of spacing. The exception
    to this is a slice parameter that has been omitted, along with the space.


    # A Good Example:


    ```

    spam[1:8], spam[1:8:2], spam[:8:2], spam[1:2], spam[1:8:]

    ```'
