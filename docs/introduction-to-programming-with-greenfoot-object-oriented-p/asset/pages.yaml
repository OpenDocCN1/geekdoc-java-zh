    If you have access to a web server, you can now publish this page on the web.
    If you do not have access to a web server, the next option may be for you.


    # I1.4 Publishing on the Greenfoot Gallery


    The last export option you have is to publish your scenario to the Greenfoot Gallery.
    The Greenfoot Gallery is a public web site (at the address http://greenfootgallery.org)
    that allows Greenfoot users to upload their Greenfoot scenarios for the world
    to see and play.


