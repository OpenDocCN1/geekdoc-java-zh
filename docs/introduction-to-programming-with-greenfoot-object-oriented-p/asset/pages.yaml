  md: '# 54 Chapter 4 Finishing the crab game


    To make this happen, we shall need a number of additions to our crab code. We
    need


    +   - an instance variable to store the current count of worms eaten;

    - an assignment that initializes this variable to 0 at the beginning;

    - code to increment our count each time we eat a worm; and

    - code that checks whether we have eaten eight worms, and stops the game and plays
    the game if we have.


    Let us do the tasks in this order in which we listed them here.


    We can define a new instance variable by following the pattern introduced in Section
    4.5. Below our two existing instance variable definitions, we add the line


    ```

    private int wormsEaten;

    ```


    The word private is used at the beginning of all our instance variable definitions.
    The following two words are the type and the name of our variable. The type int
    indicates that we want to store integers (numbers) in this variable, and the name
    wormsEaten indicates what we intend to use for it.


    Next, we add the following line to the end of our constructor:


    ```

    wormsEaten = 0;

    ```


    This initializes the wormsEaten variable to 0 when the crab is created. Strictly
    speaking, this is redundant, since instance variables of type int are initialized
    to 0 automatically. However, sometimes we want the initial value to be something
    other than 0, so writing out our initialization statement is a good practice.


    The last bit is to check the worms and check whether we have reached eight. We
    need to do this every time we eat a worm, so we use our lookForWorm method, where
    we have our code that defines the eating of worms. We add a line of code to increment
    our count:


    ```

    wormsEaten = wormsEaten + 1;

    ```


    In this assignment, the right-hand side of the assignment is evaluated first (wormsEaten+1).
    Thus, we read the current value of wormsEaten and add 1 to it. Then we assign
    the result back to the wormsEaten variable. As a result, the variable will be
    incremented by 1.


    Following this, if we need an statement that checks whether we have eaten eight
    worms, and plays the sound and stops execution if we have.


    Code 4.5 shows the complete lookForWorm method with this code. The sound file
    (fanfare.wav) is included in the sounds folder in your scenario, so it can just
    be played.


    Exercise 4.16 Add the code discussed above into your own scenario. Test it, and
    make sure that it works.'
