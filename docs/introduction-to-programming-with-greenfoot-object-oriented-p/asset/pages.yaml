  md: '# INTERLUUDE

    2


    # The Greeps competition


    We will take a little time out to go on a second interlude—a break in the chapter
    sequence to do something a little different. This time, we will look at “Greeps”—a
    programming competition.


    The Greeps are alien creatures. And they’ve come to Earth! One of the important
    things to know about Greeps is that they like tomatoes. They have landed with
    their spaceship and are swarming to find and collect tomatoes (Figure I2.1).


    Figure I2.1

    Two Greeps hunting for tomatoes


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_139_0.png)


    The challenge in this programming competition will be to program your Greeps so
    that they find and collect tomatoes as quickly as possible. You will have limited
    time, and every tomato you manage to bring back to the spaceship scores a point.


    You can do this project as a contest against a friend who programs your own Greeps,
    or you can do it as a contest for a whole group of programmers, a school class.
    If you''re on your own, you could post your entry to the Greenfoot Gallery and
    see how you compare to other people.¹ Or you could do it on your own just for
    the fun of it—it should be an interesting challenge.


    > ¹ If you submit the Greeps scenario to the Greenfoot Gallery, please do not
    include source code. We want to keep this project as a challenge to future programmers
    and don''t want to make it too easy to find solutions of others.'
  merge: -1
