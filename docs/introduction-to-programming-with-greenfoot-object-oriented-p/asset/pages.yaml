  md: "# The if/else statement\n\nBefore moving on, let us investigate the if statement\
    \ again in some more detail. As we have just seen, an if statement can be written\
    \ in the form\n\n```\nif ( condition ) {\n    statements;\n} else {\n    statements;\n\
    }\n```\n\nThis statement contains two blocks (of curly brackets) surrounding a\
    \ list of statements): the if-clause and the else-clause (in this order).\n\n\
    When this statement is executed, the first condition is evaluated. If the condition\
    \ is true, the if-clause is executed, and then continues until the else-clause.\
    \ If the condition is false, the if-clause is not executed, instead we execute\
    \ the else-clause. Thus, one of the two statement blocks is always executed, but\
    \ never both.\n\nThe part with the second block is optional—leaving it off to\
    \ the shorter version of if statement we have seen earlier.\n\nWe have now everything\
    \ we need to finalize this task. It is time to get hands on the keyboard to try\
