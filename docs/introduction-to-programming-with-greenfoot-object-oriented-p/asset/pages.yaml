    # 89


    # Concept:


    Private methods

    are only visible from within the class they are declared in. They are used to
    improve the structure of the code.


    Note: Private methods

    The method we created in Code 6.4 has the keyword private at the beginning of
    its signature, not public as we have previously seen.


    Methods can be public or private. When methods are intended to be called from
    outside the class (either interactively by a user or from another class), they
    must be public. When methods are intended to be called only from other methods
    within the same class (as is the case here), they should be declared private.


    Private methods are not visible or accessible from outside the class itself. It
    is good practice to make methods private that are only intended for internal use.
    This helps preventing errors and documents the purpose of the method more clearly.


    Next, we have to work out how we get access to all other objects in our world.

    The World class in Greenfoot has methods that give us access to objects within
    it.


    > **Exercise 6.18** Look up Greenfoot''s World class in the Greenfoot class documentation.
    Find all methods that give us access to objects within the world. Write them down.


    The most interesting of those methods for us is this one:

    java.util.List getObjects(java.lang.Class cls)


    This method gives us a list of all objects in the world of a particular class.
    The parameter to this method is of type java.lang.Class (i.e., the class name
    “Class” from the java.lang package). We have seen parameters of this type before,
    in Chapter 4, where we can see See and eat methods in the Crab class to eat the
    worms. We can use this call to get, an instance of all Body objects in our world:


    ```

    getObjects(Body.class)

    ```


    We can also provide null as a parameter to receive a list of all objects of any
    class in the world:

    getObjects(null)


    The keyword null is a special expression that means nothing, or no object. By
    using it in a parameter list, we pass no object as the parameter. The value null
    could also be assigned to variables.


