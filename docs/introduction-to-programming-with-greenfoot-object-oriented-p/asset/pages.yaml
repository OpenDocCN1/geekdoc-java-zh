  md: '# Summary of programming techniques


    **Exercise 4.18** The crab image changes fairly quickly while the crab runs, which
    makes our crab look a little hyperactive. Maybe it would look nicer if the crab
    image changed only every second or third act cycle. Try to implement this. To
    do this, you could add a counter that gets incremented in the **act** method.
    Every time it reaches 2 (or 3), the image changes, and the counter is reset to
    0.


    In this chapter, we have seen a number of new programming concepts. We have seen
    how constructors can be used to initialize objects—constructors are always executed
    when a new object is created. We have seen how to use variables—also called *fields*—and
    assignment statements to store information, and how to access that information.
    We have used the new statement to programmatically create new objects, and finally,
    we have seen the full version of the if statement, which includes an *else* that
    is executed when the condition is not true.


    With all these techniques together, we can now write quite a good amount of code
    already.


    # Concept summary


    +   - A **constructor** of a class is a special kind of method that is executed
    automatically whenever a new instance is created.

    - Java objects can be created programmatically (from within your code) by using
    the **new** keyword.

    - Greenfoots maintain their visible image by holding an object of type *Greenfoot*.
    These are stored in an instance variable inherited from class Actor.

    - **Instance variables** (also called **fields**) can be used to store information
    (objects or values) for later use.

    - An **assignment statement** assigns an object or a value to a variable.

    - When an object is assigned to a variable, the variable contains a **reference**
    to that object.

    - We can test whether two things are **equal** by using a double equals symbol:
    ==.

    - The **if/else statement** executes a segment of code when a given condition
    is true, and a different segment of code when it is false.'
