  md: '# How to get started


    To start, open the greeps scenario from the book-scenarios folder. Run this scenario.


    You will see that a spaceship lands in an area with sand and water. The Greeps
    will leave the spaceship and start searching for tomato piles (which happen to
    be found in various places in this area). Greeps are land animals—they cannot
    and will walk into the water. (In fact, they are sensitive to water that they
    dissolve very quickly in it, so don''t try).


    When you try out the scenario, you will quickly see that the Greeps do not behave
    very intelligently. They head out in a random direction from the ship, but when
    they reach the edge of the water, they will just stay there, because they cannot
    go forward.


    Your task will be to program the Greeps to use some more intelligent strategy,
    so that they find the tomatoes and bring them back to the ship.


    There are some facts about the Greeps that will be good to know:


    +   - There are 20 Greeps in the spaceship. They will come out after landing to
    start their work. You cannot get any more of them.


    +   - Greeps can carry a tomato on their back, but they cannot load tomatoes onto
    their own back. They can only load a tomato onto another Greep''s back! This means,
    that two of them have to be at the tomato pile at the same time to pick up a tomato.


    Figure 12.2

    A tribe of Greeps using paint drops


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_140_0.png)'
