  md: '# 42 Chapter 3 Improving the Crab—more sophisticated programming


    # About sound recording


    You can make your own sounds. Both the sounds included are recorded by simply
    speaking into the computer''s microphone. Use one of the many free sound recording
    programs¹, record your sound, and save (export) it as a sound file, in WAV, AIFF,
    or AU format. Making your own sounds is further discussed in Chapter 8.


    Exercise 3.25 If you have a microphone on your computer, make your own sounds
    to use when the worms or the crab get eaten. Record the sounds with any sound
    recording program, store them in the scenario''s *sounds* folder, and use them
    in your code.


    # 3.9 Summary of programming techniques


    In this chapter we have seen many examples of using an if-statement—this time
    for turning at random times and reacting to keys. We have also seen how to call
    methods from another class, namely the `getRandomNumber`, `isKeyDown`, and `playSound`
    methods from the Greenfoot class. We did this by dot notation, with the class
    name in front of.


    Altogether, we have now seen examples of calling methods from three places. We
    can call methods that are defined in the current class itself (*local methods*),
    method that were defined in a super (*inherited methods*), and static methods
    from other classes. The last of these uses dot notation. (There is one additional
    version of a method call: calling methods on other objects—we will encounter that
    later.)


    Another important aspect we explored was how to read the API documentation of
    an existing class to find out what it has and how to call them.


    # Concept summary


    +   - When we wish to call is not in our own class or inherited, we need to specify
    the class or object that we have the before the method name, followed by a dot.
    This is called **dot notation**.

    - Methods that belong to classes (as opposed to objects) are marked with the keyword
    **static** in their signature. They are also called **class methods**.

    - A **method definition** defines a new action for objects of this. The action
    is not immediately executed, but the method can be called with a method call to
    execute.

    - **Comments** are written into the source code as explanations for human readers.
    They are ignored by the computer.

    - The **API Documentation** lists all classes and methods available in Greenfoot.
    We often need to look up methods here.


    ¹ Using an Internet search, you should be able to find several free programs that
    can record and save sounds. One good program is *Audacity* (http://audacity.sourceforge.net),
    but there are many others.'
