    \ a class, we\nclass-name.method-name(parameters);\nto call the method. When a\
    \ method belongs to an object, we write\nobject.method-name(parameters)\nto call\
    \ it.\n\nBoth kinds of methods are defined in a class. The method signature tells\
    \ us whether a method belongs to objects of that, or to the class itself.\n\n\
    Methods that belong to the class itself are marked with the keyword static at\
    \ the beginning of the method signature. For example the signature of Greenfoot's\
    \ getRandomNumber\nstatic getRandomNumber(int limit);\n\nThis tells us we must\
