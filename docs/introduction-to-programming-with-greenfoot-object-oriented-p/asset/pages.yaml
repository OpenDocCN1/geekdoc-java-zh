  md: '# CHAPTER 10

    Additional scenario ideas


    **topics:** ideas for more scenarios

    **concepts:** (no new concepts introduced)


    This is the last chapter of this book. It is different from the other chapters
    in that it does not try to teach you any new concepts or techniques of programming.
    Instead it briefly presents a number of additional scenarios to give you some
    ideas for things you might like to investigate and work on.


    All scenarios presented here are also available as Greenfoot projects with source
    code in the book scenarios. However, most of them are not complete implementations
    of the idea they represent.


    Some scenarios are almost complete, and you might study them to learn further
    techniques and see how certain effects were achieved. Others are beginnings, partial
    implementations of an idea which you could use as a starting point for your project.
    Yet other ones are illustrations of a single concept or idea that might provide
    inspiration for something you could incorporate into one of your scenarios.


    In short, view these as a collection of ideas for future projects, and study them
    for a small glimpse into what else is possible for a competent programmer to achieve.


    # 10.1 Marbles


    The *marbles* scenario (Figure 10.1) implements a game in which you roll a golden
    ball over the board with the aim of clearing the board of all silver balls within
    a limited number of moves. The game is reasonably complete.


    Several things are worth observing about this scenario. The first thing that stands
    out is that it looks quite nice. This has very little to do with Java or Greenfoot
    programming and is mostly due to the use of graphics. Using nicely designed graphics
    and sounds can make a big difference in the attractiveness of a game.


    *Marbles* uses a nice looking background image (the game board and scroll for
    the text display) and actors with semi-transparent drop shadows (the marbles and
    the obstacles).'
