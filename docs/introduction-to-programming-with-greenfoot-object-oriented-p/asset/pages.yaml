  md: "It is very common to link if-else statements together by placing a second if-else\
    \ in the else part of the first. This can be continued any number of times. It\
    \ is a good idea to include a final else part.\n\n```\nif (n < 0)\n{\n    handleNegative();\n\
    }else if (number == 0)\n{\n    handleZero();\n}else\n{\n    handlePositive();\n\
    }\n```\n\n# D.3.1.2 switch\n\nThe switch statement switches on a single value\
    \ to one of an arbitrary number of cases. Two possible use patterns are:\n\n```\n\
    switch (expression)\n{\n    case value: statements;\n    break;\n    case value:\
    \ statements;\n    break;\n    further cases omitted\n    default: statements;\n\
    \    break;\n}\n```\n\n```\nswitch (expression)\n{\n    case value1:\n    case\
    \ value2:\n    case value3:\n        statements;\n        break;\n    case value4:\n\
    \    case value5:\n        statements;\n        break;\n    further cases omitted\n\
    \    default:\n        statements;\n        break;\n}\n```\n\nNotes:\n\n+   -\
    \ A switch statement can have any number of case labels.\n- The break instruction\
    \ after every case is needed, otherwise the execution 'falls through' into the\
    \ next label's statements. The second form above makes use of this. In this case,\
    \ all three of"
  merge: -1
