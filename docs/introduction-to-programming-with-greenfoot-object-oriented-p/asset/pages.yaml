  md: '# 1.11 Summary


    We shall come back to the asteroids game in Chapter 7, where we will discuss how
    to write this game.


    In this chapter, we have seen what Greenfoot scenarios can look like and how to
    interact with them. We have seen how to create objects and how to communicate
    with these objects by invoking their methods. Some methods were commands to the
    object, while other methods returned information about the object. Parameters
    are used to provide additional information to methods, while return values pass
    information back to the caller.


    Objects were created from their classes, and source code controls the definition
    of the class (and with this, the behavior and characteristics of all the class''s
    objects).


    We have seen that we can change the source code using an editor. After editing
    the source, classes need to be recompiled.


    We will spend most of the rest of the book discussing how to write Java source
    code to create scenarios that do interesting things.


    # Concept summary


    +   - Greenfoot scenarios consist of a set of classes.

    - Many objects can be created from a class.

    - Objects have methods. Invoking these performs the action.

    - The return type of a method specifies what a method call will return.

    - A method with a void return type does not return a value.

    - Methods with void return types represent commands, methods with non-void return
    types represent questions.

    - A parameter is a mechanism to pass in additional data to a method.

    - Parameters and return values have types. Examples of these are int for numbers,
    and boolean for true/false values.

    - The specification of a method, which shows its return type, name, and parameters,
    is called its signature.

    - Objects can be placed into the world are known as actors.

    - A subclass is a class that represents a specialization of another. In Greenfoot,
    this is shown with an arrow in the class diagram.

    - Every class is defined by source code. This code defines what objects of this
    class can do. We can look at the source code by opening the class''s editor.

    - Computers do not understand source code. It needs to be translated to machine
    code before it can be executed. This is called compilation.'
