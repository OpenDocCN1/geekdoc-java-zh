    ```


    will call the constructor, resulting in an entirely different vector.


    You will quickly see that it is very hard to configure the parameters so that
    the system remains stable for a long time. The combination of mass and gravity
    will often result in objects crashing into each other, or escaping from orbit.
    (Since we have not implemented a "crashing into each other", our objects can easily
    fly through each other. When they get very close, their forces become very large
    and they often catapult each other onto strange trajectories.)


    Some of these effects are similar to nature, although our simulation is a little
    inaccurate due to some simplifications we have made. The fact, that all objects
    act in sequence, rather than simultaneously, will have an effect on the behavior
    and is not a realistic representation. To make the simulation more accurate, we
    would have to calculate all first (without moving) and then execute all moves
    according to the previous calculations. Our simulation does not model the forces
    when two bodies get very close to each other, making all unrealistic.


    We can also ask the stability question about our solar system. The orbits of the
    planets in our solar system are quite stable, details about their movement are
    hard to predict accurately for a long time into the future. We are quite certain
    that none of the planets will crash into the Sun in the next few billion years,
    but small variations may occur. Simulations such as ours (just much more accurate
    and detailed, but similar in principle) have been used to predict the future orbits.
    We have seen, however, that this is very hard to simulate accurately. Simulations
    can show that minute differences in the initial conditions can make differences
    after a few billion years.


    > 3 If you are interested to read more, Wikipedia is a good starting point: http://en.wikipedia.org/wiki/Stability_of_the_solar_system'
