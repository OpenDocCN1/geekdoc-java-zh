  md: '# I2.2 Programming your Greeps


    +   Greeps cannot talk, or communicate verbally in any way. They can, however,
    spit onto the ground. And they can spin in three different colors! There are rumors
    that there is a tribe of Greeps who use this to convey information to each other.


    +   Greeps are very short sighted. They can only see the ground at their immediate
    location, and cannot look further.


    +   Greeps have a good memory—they never forget what they know. However—unfortunate—their
    memory is very limited. They can only remember a few things at a time.


    Armed with this extensive background knowledge, we can now get ready to program
    our Greeps.


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_141_0.png)


    # Programming your Greeps


    To program your Greeps to collect as many tomatoes as possible, you should improve
    their behavior. The Greep class, which is included in the scenario, already includes
    some behavior (albeit not very clever) that you can look at to get started.


    We can see that Greep is a subclass of Creature. Class Creature provides a number
    of very useful methods that we can use.


    There are, however, a number of rules that you must follow:


    Rule 1: Only change the class "Greep". memory. No other classes may be modified
    or created.


    Rule 2: You cannot extend the Greeps'' memory. That is, you are not allowed to
    add fields (other than final fields) to the class. Some general purpose memory
    (one int and two booleans) is provided.


    Rule 3: You cannot move more than once per "act" round.


    Rule 4: Greeps do not communicate directly. They do not call each other''s methods
    or access each other''s fields.


    Rule 5: No long vision. You are allowed to look at the world only at the immediate
    location of the Greep. Greeps are almost blind, and cannot look any further.


    Rule 6: No creation of objects. You are not allowed to create any scenario objects
    (instances of user-defined classes, such as Greep or Paint). Greeps have no powers—they
    cannot create things out of nothing.


    Rule 7: No teleporting. Methods from Actor that cheat normal movement (such asLocation)
    may not be used.


    It is important to follow these rules. It is technically easy to break them, but
    that is considered cheating.


    To program your Greeps, you work mainly in the Greeps'' act method (and any other
    private methods you choose to create).


    Some to get started:


    +   Read the documentation of class Creature. (The best way to do this is to open
    the class in the editor and switch to Documentation view.) These are some of the
    most useful methods for your work Know what is there.'
  merge: -1
