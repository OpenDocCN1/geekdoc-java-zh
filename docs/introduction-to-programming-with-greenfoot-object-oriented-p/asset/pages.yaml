    is assigned to our variable names. We can see from the diagram that, when an array
    is assigned to a variable, the variable then contains a pointer to that object.


    Once we have our array variable in place, we can access individual elements of
    the array using an index—a number in the array object. In Figure 5.3, the index
    of each String is shown above each element. Note that counting starts at 0, so
    the String "a" is at position 0, "b" is at position 1, and so on.


    In Java, we access array elements by attaching the index in square brackets to
    the array name.


