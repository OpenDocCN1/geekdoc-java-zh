    # 10.6 Breakout


    "Breakout" (10.6) is a classic computer game in which the player controls a paddle
    at the bottom of the screen to bounce a ball upwards to remove some blocks. If
    you do not know the game, do a search and you will quickly find out.


    The breakout scenario is a partial implementation of this game. It uses the ball
    with the smoke effect that we discussed in Chapter 8 and adds a paddle for the
    player to control the ball. It has, however, no blocks to aim for, so in its current
    form it is not very interesting.


    Many variations of breakout have been created over time. Many use different patterns
    of layout for the blocks at different levels. Most also have "power-ups”—goodies
    hidden behind some blocks that float when the block is removed. Catching them
    typically makes something interesting happen in the game (extra balls, increased
    speed, larger or smaller paddles, etc.).


    Completing this game in an interesting way can make a good project. It could also
    be modified to have two paddles, one on each side, essentially turning it into
    the classic "Pong" game.'
