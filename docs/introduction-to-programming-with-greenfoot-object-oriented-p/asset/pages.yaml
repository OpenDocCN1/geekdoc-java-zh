  md: '# 2.5 Summary of programming techniques


    Exercise 2.12 Try it out! Type in the code discussed above and see if you can
    make your crabs turn at the edge of the screen. Pay close attention to the opening
    and closing brackets—it is easy to miss one or have too many.


    In the Greenfoot editor, when you place the cursor behind a closing bracket, Greenfoot
    will mark the matching opening closing bracket. This can be used to check whether
    your brackets match as they should.


    Exercise 2.13 Experiment with different values for the parameter to the turn method.
    Find one that looks good.


    Exercise 2.14 Place the move() statement in the if-statement, rather than after
    it. Find out what is the effect and explain the behavior you observe. (Then, fix
    it by moving it back where it was)


    # Indentation


    In all the examples you have seen so far (for instance, Code 2.3), you may have
    noticed careful indentation being used. Every time a curly bracket opens, the
    lines are indented one level more than the previous ones. When a curly bracket
    closes, the indentation goes back one level, so that the closing curly bracket
    is directly below the opening bracket. This makes it easy to find the matching
    bracket.


    We use four spaces for one level of indentation. The Tab key will insert spaces
    in your editor for one level of indentation.


    Taking care with indentation in your own code is very important. If you do not
    indent care, some errors (particularly misplaced or mismatched curly brackets)
    are very hard to spot. Proper indentation makes code much easier to read, and
    helps avoid potential errors.


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_41_0.png)


    In this book, we are discussing from a very example-driven perspective. We introduce
    general programming techniques as we need to implement them for our scenarios.
    We shall summarize the important programming techniques at the end of each chapter
    to make clear what you need to take away from the discussion in order to progress
    well.


    In this chapter, we have seen how to call methods (such as move()), and without
    parameters. This will form the basis for all further Java programming. We have
    also learned to identify the body of the act method—this is what we start writing
    our instructions.


    You have encountered some error messages. This will continue throughout all your
    programming endeavors. We all make mistakes, and we will encounter error messages.
    This is not a sign of a bad programmer—it is a normal part of programming.


    We have encountered a first glimpse of inheritance: Classes inherit the methods
    from their superclasses. The Documentation of a class gives us a summary of the
    methods available.


    And, very importantly, we have seen how to make decisions: We have used an if-statement
    for conditional execution. This went hand in hand with the appearance of the type
    boolean, a value that can be true or false.'
