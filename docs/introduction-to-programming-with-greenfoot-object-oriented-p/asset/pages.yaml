  md: '# Chapter 1 Getting to know Greenfoot


    Tip:


    You can open an editor for a class by double-clicking the class in the class diagram.


    We have seen before that the default initial firing speed of the rocket was fairly
    slow. We could change this for every rocket individually by invoking a method
    on each new rocket, but we would have to do this over and over again, every time
    we starting. Instead, we can change the code of the rocket so that its initial
    firing speed is changed (say, to 5), so that all rockets in the future start with
    this improved behavior.


    Open the editor for the Rocket class. After 25 lines from the top, you should
    find a line that reads


    ```

    gunReloadTime = 20;

    ```


    This is where the initial reload time gets set. Change this line so that it reads


    ```

    gunReloadTime = 5;

    ```


    Be sure not change anything. You will notice that soon programming systems are
    very picky. A single incorrect or missing character can lead to errors. For example,
    if you remove the semicolon at the end of the line, you would run into an error
    fairly soon.


    Concept:


    Computers do not understand source code. It needs to be translated into machine
    code before it can be executed. This is called compilation.


    Close the window (our change is complete) and look at the class diagram again.
    It has now changed: Several classes no longer appear (Figure 1.10). The striped
    indicates that a class has been edited and must be compiled. Compilation is a
    translation process: the class''s source code is translated into a machine code
    that you can execute.


    Classes must always be compiled after their source code has been changed, before
    new objects of the class can be created. (You will also have noticed that several
    classes need recompilation even though we have changed only a single class. This
    is often the case because classes depend on each other. When one changes, another
    need to be translated again.)


    Figure 1.10


    Classes after editing


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_30_0.png)


    We can compile the classes by clicking the Compile All button in the bottom-right
    corner of Greenfoot''s main window. Once the classes have been compiled, the stripes
    disappear, and we can create objects again.


    > Exercise 1.15 Make the change to the Rocket class source code as described above.
    Close the editor and compile the classes. Try it out: rockets should now be able
    to fire quickly right from the start.'
