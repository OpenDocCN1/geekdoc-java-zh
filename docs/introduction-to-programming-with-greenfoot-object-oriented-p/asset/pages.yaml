  md: 'There is rarely a need to use BMP, TIFF, or GIF images. BMP does not compress
    well as other formats and does not support transparent pixels. TIFF images preserve
    quality very well, but create larger file sizes. GIF is a proprietary format that
    has effectively been replaced by the better—and free—PNG format.


