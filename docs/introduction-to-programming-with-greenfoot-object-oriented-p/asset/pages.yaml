  md: '# # Improving the Crab—more sophisticated programming


    +   **topics:** random behavior, keyboard control, sound

    **concepts:** dot notation, random numbers, defining methods, comments


    In the previous chapter, we looked at the basics of starting to program our first
    game. There were many things that we had to look at. Now, we will add more behavior.
    Adding code will get a little easier from now on, since we have seen many of the
    fundamental concepts.

    The first thing we will look at is adding random behavior.


    # 3.1 Adding random behavior


    In our current implementation, the crab can walk across the screen, and it can
    turn at the edge of our world. When it walks, it always walks exactly straight.
    That is what we want to change now. Crabs don''t always go in an exact straight
    line, so us add a little random behavior: The crab should go roughly straight,
    but every now and then it should turn a little off course.


    We can achieve this in Greenfoot by using random numbers. The Greenfoot environment
    itself has a method to use a random number. This method, getRandomNumber, expects
    a parameter that specifies the limit of it. It will return a random number between
    0 (zero) and its limit.


    Greenfoot.getRandomNumber(20) will return a random number between 0 and 20. The
    limit—20—is excluded, so the number is actually in the range 0–19.


    The notation used here is dot notation. When we called methods that were defined
    in our class or inherited, it was enough to write the method name and parameter
    list. The method is defined in another class, we need to specify the class or
    object that has the method, followed by a period (dot), followed by the method
    name and parameter. Since getRandomNumber method is not in the Crab or Animal
    class, but in a class called Greenfoot, we have to write “Greenfoot.” in front
    of the method call.'
