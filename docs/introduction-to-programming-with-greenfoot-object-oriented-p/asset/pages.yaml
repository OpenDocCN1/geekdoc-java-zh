  md: '# Chapter 8 Creating images and sound


    # 8.3 Sound recording and editing


    There are various options for obtaining sound files. We can copy copies from other
    Greenfoot projects, or download them from free sound libraries on the Internet.
    If you copy copies form the Internet, pay attention to copyright notices: Nothing
    that is on the Internet is free—respect other people''s copyright! The easiest
    option to obtain sound files is to record them themselves.


    To do this, we need a microphone (many laptops have microphones built in, and
    often computer headsets have microphones attached) and sound recording software.
    If you do not have a microphone available right now, you may want to skip this
    section.


    Many sound recording programs are available, several of them are free. We will
    use Audacity here for the screenshots. Audacity is a good choice because it is
    powerful, runs on different operating systems, and is free and fairly easy to
    use. There are many other sound recording programs, however, so free to use any
    one of your choice.


    Figure 8.1 shows a typical interface of a sound recording program. You typically
    have controls for playback, payback, and a wave form of the recorded sound (the
    blue graph).


    **Figure 8.1**nA sound recording and editing program (Audacity)


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_146_0.png)


    > ¹ Audacity is available from http://audacity.sourceforge.net'
  merge: -1
  pgno: 146
