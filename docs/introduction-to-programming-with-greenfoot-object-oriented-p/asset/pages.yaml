  md: '# Summary of programming techniques


    In this chapter, we worked on completing an asteroid game that was initially half-written.
    In doing this, we have encountered several important constructs again that we
    had seen before, including loops, lists, and collision detection.


    We have seen one new style of loop—the `for` loop—and we have used it to paint
    the stars, and to generate the proton waves. We have also revised the for-each
    loop when we implemented the proton wave functionality.


    Two different detection methods were used: `getIntersectingObject` and `getInRange`.
    Both have their advantages in certain situations. The second one of them returned
    a list of actors to us, so we had to deal with lists again.


    Understanding lists and loops is initially quite difficult, but very important
    in programming, so you should carefully review these aspects of your code if you
    are not yet comfortable in using them. The more practice you get, the easier it
    becomes. After using them for a while, you will be surprised that you found them
    so difficult at first.


    # Concept summary


    +   - **for loop** is one of Java''s loop constructs. It is especially good for
    iterating a fixed number of times.

    - **Greenfoot** provides several methods for **collision detection**. They are
    in the Actor class.

    - The **bounding box** of an image is the enclosing rectangle of that image.

    - Objects can be of **more than one type**: the type of their class, and the type
    of the class''s superclass.

    - **Casting** is the technique of specifying a more precise type for our object
    than the one the compiler knows about.'
  merge: -1
