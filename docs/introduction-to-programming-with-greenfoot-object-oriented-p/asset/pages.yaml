  md: '# 50 Chapter 4 Finishing the crab game


    On the left of the equals symbol is the name of the variable we want to store
    into, on the right is the thing that we want to store. Since the equals symbol
    stands for assignment, it is called the assignment symbol. We usually read it
    as “becomes”, like this: “variable becomes expression".


    Concept:

    An assignment statement assigns an object or a value to a variable.


