  md: '# Figure 10.3

    Boids: A simulation of flocking behavior


    10.4 Circles


    157


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_173_0.png)


    +   - Separation: steer away from other birds if getting too close.


    +   - Alignment: steer toward the average heading of other birds in the vicinity.


    +   - Cohesion: steer to move the average position of other birds in the vicinity.


    With this algorithm, the boids develop movement that is quite nice to look at.
    Included in this scenario is also obstacle avoidance: trying not to fly into trees.


    A version of this algorithm was used, for example, in Tim Burton’s 1992 film “Batman
    Returns” to create animation for computer-generated swarms of bats and penguin
    flocks, and in the “Lord of the Rings” films to create the movement of the Orc
    armies.


    The version for this book was written by Paul Henriksen.


    You can find out much more about this by searching the web for “boids”. And while
    this scenario currently does nothing other than show the movement, one feels that
