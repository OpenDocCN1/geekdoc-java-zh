    # 8.2 Working with sound


    As we have seen earlier, the Greenfoot class has a playSound method that we can
    use to play a sound file. To be playable, the sound file must be located in the
    sounds folder inside the scenario folder.


    As a start, let us play an existing sound file.


    # Exercise 8.12 Select a sound file from one of your other Greenfoot scenarios
    and copy it into the sounds folder of your current scenario. Then modify your
    actor so that it plays the sound (instead of moving) when you click on it.


    # Pitfall


    Some operating systems are configured so that file name suffixes (extensions)
    are not displayed. A file that is fully named mysound.wav would then be displayed
    as mysound. This is a problem, because we need to use the full name, including
    the suffix, from your Java code. Writing


    ```

    Greenfoot.playSound(\mysound");

    ```


    would fail, because the file would not be found. However, without seeing the suffix,
    we have no idea what it is.

    The solution is to change the operating system''s settings so that suffixes are
    always displayed. Windows, for example, has a checkbox Hide extensions for known
    file types, and you should make sure that is not checked. In Windows Vista, you
    can find this by looking at your folder''s contents and going through the menu
    Organize/Folder and Search Options/View. In other Windows systems, the menu names
    may vary, but the checkbox will be there as well.


    We can easily play an existing sound file. The more interesting task now is to
    make sound file ourselves.'
