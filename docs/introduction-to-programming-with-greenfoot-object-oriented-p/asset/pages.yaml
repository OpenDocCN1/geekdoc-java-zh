    \t\teat(Worm.class);\n}\n}\n```\n\n# Concept:\n\nComments are written into the\
    \ source code as explanations for human readers. They are ignored by the computer.\n\
    \nThe first four lines are a comment. A comment is ignored by the computer—it\
