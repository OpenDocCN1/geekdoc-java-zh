  md: '# 10.2 Lifts


    # 155


    Figure 10.1

    nThe Marbles


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_171_0.png)


    The other interesting aspect to examine the collision detection. The marbles do
    not use any of the built-in Greenfoot collision detection methods, since these
    all work on the rectangular actor images. The marbles, on the other hand, are
    round, and we need precise collision for this.


    Luckily, when the actors are round, this is not very difficult. Two marbles collide
    if their distance (measured from their center points) is less than their diameter.
    We know the diameter, and the distance is easy to compute (using the Pythagoras
    theorem).

    The next interesting thing is the new movement direction of a colliding marble
    is computed. There is a little trigonometry involved here, but it is not too hard.


    Collisions with the fixed obstacles are easier, since they are always horizontally
    or vertically rectangular. Therefore, a marble hitting one of these obstacles
    simply reverses its direction along one of the axes (x or y).


    You could use the marble collision logic for all sorts of games that involve collision
    of round objects.


    # 10.2 Lifts


    The lifts scenario (Figure 10.2) shows a simple lift (or elevator) simulation.
    It shows several floors of a multistory building and three lifts moving up and
    down. People appear on the floors and press the call buttons and enter the lifts
    when they come.'
