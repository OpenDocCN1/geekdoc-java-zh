  md: 'The purpose of these convenience methods is just to simplify code: Often, we
    are only interested in a single intersecting actor. In those cases, the convenience
    method allows us to handle the actor without having to use a list.


    # C.3 Low versus high resolution


    As we have seen throughout this book, the resolution (cell size) of Greenfoot
    worlds can vary. This is relevant for collision detection, as we will often use
    different methods, depending on the resolution.


    We distinguish two cases: low-resolution worlds, where the entire actor image
    is completely contained within a single cell (Figure C.1 a) and high-resolution
    worlds, where the image of an actor spans multiple cells (Figure C.1 b).


    Figure C.1

    Examples of low and high resolution in Greenfoot worlds


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_186_0.png)


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_186_1.png)


    a) a low-resolution world


    b) a high-resolution world


    # C.4 Intersecting objects


    List getIntersectingObjects(Class cls)\Return all the objects that intersect this
    object.


    Actor getOneIntersectingObject(Class cls)

    Return an actor that intersects this object.


    These methods return other actors whose image intersects with the calling actor''s
    image. Images intersect when any part of one image touches any part of another
    image. These methods are most useful in high-resolution scenarios.


    Intersection is computed using bounding boxes, so overlap of fully transparent
    parts of the images is also treated as intersection (Figure C.2).'
