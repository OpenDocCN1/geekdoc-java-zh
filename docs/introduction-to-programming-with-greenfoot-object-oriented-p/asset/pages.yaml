  md: '# # CHAPTER 4

    Finishing the crab game


    **topics:** world initialization, setting images, animating images

    **concepts:** constructors, state, instance variables (fields), assignment, new
    (creating objects programmatically)


    In this chapter, we will finish the crab game. "Finish" means this is where we
    stop discussing this project in this book. Of course, a game is never finished—you
    can always think of more improvements that you can add. We will suggest some ideas
    at the end of this chapter.

    First, however, we will discuss a number of improvements in detail.


    #  4.1 Adding objects automatically


    We are now getting close to having a playable little game. However, a few things
    need to be done. The first problem that should be addressed is the fact that we
    always have to place the actors (the crab, lobsters, and worms) manually into
    the world. It would be better if we had that automatically.


    There is one thing that happens automatically every time we successfully complete:
    The world is created. We see it on screen (the sand-colored square area), is an
    instance of the CrabWorld class. World instances are treated in a special way
    in Greenland: While we have to create instances of our actors ourselves, the Greenland
    system always automatically creates one instance of our world class and displays
    that on screen.


    Let us look at the CrabWorld''s source code (Code 4.1). (If you do not own your
    crab game at this stage, use little-crab-4 for this chapter.)


    In this class, we use the usual import statement in the first line. (We will discuss
    this statement in detail—for now it is enough to know that this line will always
    appear at the top of our Greenland classes.)


    Then follows the class header, and a comment (the block of lines in a blue-ish
    color starting with asterisks—we have encountered them already in the last chapter).
    Comments usually start with /** symbol and end with */.*'
