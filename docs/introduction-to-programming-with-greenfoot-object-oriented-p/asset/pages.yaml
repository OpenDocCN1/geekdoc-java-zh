- img_proc: true
  md: "the first values will execute the first statements section, whereas values\
    \ four and five will execute the second statements section.\n\n+   The default\
    \ case is optional. If no default is given, it may happen that no case is executed.\n\
    \n+   The break instruction after the default (or the last case, if there is no\
    \ default) is not needed, but is considered good style.\n\nExamples:\n\n```\n\
    switch (day)\n{\n    case 1: dayString = \"Monday\";\n    break;\n    case 2:\
    \ dayString = \"Tuesday\";\n    break;\n    case 3: dayString = \"Wednesday\"\
    ;\n    break;\n    case 4: dayString = \"Thursday\";\n    break;\n    case 5:\
    \ dayString = \"Friday\";\n    break;\n    case 6: dayString = \"Saturday\";\n\
    \    break;\n    case 7: dayString = \"Sunday\";\n    break;\n    default:dayString\
    \ = \"invalid day\";\n    break;\n}\nwitch(month)\n{\n    case 1:\n    case 3:\n\
    \    case 5:\n    case 7:\n    case 8:\n    case 10:\n    case 12:\n        numberOfDays\
    \ = 31;\n        break;\n    case 4:\n    case 6:\n    case 9:\n    case 11:\n\
    \        numberOfDays = 30;\n        break;\n    case 2:\n        if(isLeapYear())\n\
    \            numberOfDays = 29;\n        else\n            numberOfDays = 28;\n\
    \        break;\n}\n```"
