  md: '# Interlude 2 ■ The Greeps competition


    +   - Work in small steps. Start making small improvements and see how it goes.

    - Some first improvements could be as follows: turn around when you are at water;
    wait if you turn a tomato pile (and to load tomatoes); turn you are at the edge
    of the world; . . .


    You will soon figure out how many more improvements you can do. It especially
    interesting once you start using the paint drops on the ground to make marks for
    other Greeps to find.


    # I2.3 Running the competition


    It helps to have a judge who runs the competition. In a school, this might be
    your teacher. If you run this with friends, it could be a selected person (who
    cannot take part as a normal contestant in the competition himself)


    To make the competition interesting, there should be two versions of the Greeps
    scenario. One gets handed out to all contestants. (This is the one included in
    the book scenarios.) This scenario includes three different maps. The Greeps land
    and forage on each of the three maps in turn. (The challenge for contestants is
    to develop movement algorithms that are flexible enough to work on different maps,
    not just a known one)


    The judge should have a different scenario that allows more maps. We recommend
    running the competition with 10 different maps. Contestants do not get access
    to the last seven maps—they can only test on the first three. Then they hand in
    their Greeps for scoring, and the judge runs the contestants'' Greeps on all 10
    maps (maybe on a large display screen) to see the official score.


    The competition is best run over several days (or maybe a week or two), with repeated
    chances for contestants to submit their work for scoring, so that they can slowly
    improve.


    # I2.4 Technicalities


    For submission of an entry to the judge, the easiest mechanism is that contestants
    submit only the Greeps.java file. The judge copies that file into his full (10-map)
    scenario, reiles, and runs it. It ensures that no other classes are modified in
    the process.


    Artwork (to make flyers or posters for the competition) is available at


    ```

    http://www.greenfoot.org/competition/greeps/

    ```


    Instructors can also find instructions there for obtaining a version of the Greeps
    scenario with 10 maps. Alternatively, instructors can make more maps themselves
    fairly easily. An image of an empty map is provided in the images folder of the
    Greeps scenario. Water can just be painted onto the map, and map data (location
    of tomato piles, etc.) can be specified in the Earth class.'
