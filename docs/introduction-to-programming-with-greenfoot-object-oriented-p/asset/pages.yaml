  md: '# # APPENDIX A

    Installing Greenfoot


    This appendix will tell you where to find the Greenfoot software and the scenarios
    used in this book, and how to install them.


    To work with the example projects in this book, you will need to install three
    things: A Java system, the Greenfoot software, and the book scenarios.


    # ## A.1 Installing Java


    Download Java from http://java.sun.com/javase/downloads. You should install the
    latest version of the Java SE Development Kit (JDK).


    On Mac OS X, Java does not need to be installed—it is included in the standard
    Mac OS installation.


    # ## A.2 Installing Greenfoot


    Download Greenfoot from http://www.greenfoot.org, and follow the installation
    instructions.


    # ## A.3 Installing the book scenarios


    Download the book scenarios from http://www.greenfoot.org/book. You will receive
    a file named book-scenarios.zip. This is a compressed file that must be extracted.
    On Windows systems, this usually can be achieved by right-clicking and selecting
    Extract All from the menu. On Mac OS and Linux systems, you can double-click to
    extract it.


    After extracting this file, you will have a folder named book-scenarios stored
    in your file system. Remember where you saved it—you will need to open the projects
    from this folder while you work through the book.'
