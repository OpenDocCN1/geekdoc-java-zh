  md: "# Chapter 4 Finishing the crab game\n\nFor our purpose, it is better to separate\
    \ the creation of the image object and the setting of the image. The reason for\
    \ this is that we want to switch the image back and forth many times the crab\
    \ is walking. That means, we want to set the image many times, but we still need\
    \ to create each of our images only once.\n\nThus, we shall first create the images\
    \ and store them, and later we will use the stored images (without creating them\
    \ again) over and to alternate our displayed image.\n\nTo store the two images\
    \ in our crab object, we need a new construct that we have not used before: a\
    \ variable.\n\n# 4.5 Instance variables (fields)\n\nOften, our actors need to\
    \ remember some information. In programming languages, this is achieved by storing\
    \ the information in a variable.\n\nJava supports different kinds of variables.\
    \ The first one we shall look at here is called an instance variable, or field.\
    \ (These two terms are synonymous.) We will see other kinds of variables later.\n\
    \nAn instance variable is a bit of memory that belongs to the object (the instance\
    \ of the class, hence the name). Anything stored in will be remembered as long\
    \ as the object exists and can be accessed.\n\nAn instance variable is declared\
    \ in a class by writing the keyword private followed by the type of the variable\
    \ and its name:\n\n```\nprivate variable-type variable-name;\n```\n\nThe type\
    \ of the variable defines what we want to store in it. In our case, we want to\
    \ store objects of type GreenfootImage in our variable, the type should be GreenfootImage.\
    \ The variable name gives us a name to the variable that we can use later to refer\
    \ to it. It should describe what this variable is for.\n\nLet us look at Crab\
    \ class as an example (Code 4.2).\n\n```\nimport GreenfootImage.*; // (Actor,\
    \ World, Greenfoot, GreenfootImage)\n\n// comment omitted\n\npublic class Crab\
    \ extends Animal {\n    private GreenfootImage image1;\n    private GreenfootImage\
    \ image2;\n\n    // methods omitted\n}\n```"
