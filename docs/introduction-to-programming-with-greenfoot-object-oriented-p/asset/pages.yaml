  md: '# CHAPTER 9 Simulations


    | **topics:** simulations |

    | **concepts:** emergent behavior, experimentation |


    In this chapter, we shall discuss one type of software application in a little
    more detail: simulations.

    Simulations are fascinating examples of computing, because they are highly experimental,
    and potentially allow us to predict the future. Many types of simulations can
    be (and have been) developed for computers: traffic simulations, weather forecasting
    systems, economics simulations (simulations of stock markets), simulations of
    chemical reactions, nuclear explosions, environmental simulations, and many more.


    > **Concept:**

    A simulation is a computer program that simulates some interesting phenomena from
    the real world. If simulations are accurate enough, we can learn things about
    the real world from observing them.


    We have seen one simulation in Chapter 6, in which we simulated part of a solar
    system. That simulation was a little too simplistic to accurately forecast trajectories
    of real planets, but there are some aspects of astrophysics that simulation may
    help us understand.


    In general, simulations may serve two purposes: they can be used to study and
    understand the system they are simulating, or they can be used for forecasting.


    In the first case, the modeling of a system (such as the modeling of stock and
    planets) may help us understand some aspects of how it behaves. If we have an
    accurate simulation, we can play through "what if" scenarios. For example, we
    we have a traffic simulation for a city, and we observe that every morning a traffic
    jam develops at a certain section in the city. How can we improve the simulation?
    Should we build a new roundabout? Or change the traffic light signals? Or should
    we build a bypass?


    The effects of any of these interventions are hard to predict. We cannot try out
    all those options in real life to see what is best, since that would be too disruptive
    and expensive. But we can simulate them in our traffic simulation, and then see
    how it improves traffic.


    If the simulation is accurate, then the result we observe in the simulation will
    also be true in real life. But that is a big "if":; Developing a simulation that
    is accurate enough is not easy, and it is a lot of work. For many systems, it
    is possible to a useful degree.


    Weather forecasting simulations are now accurate enough that a one-day forecast
    is fairly reliable. A seven-day forecast, however, is about as good as rolling
    dice: The simulations are not just good.'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# Chapter 9 Simulations


    When we use simulations, it is important to be aware of the limitations: Firstly,
    actors always have a degree of inaccuracy because we are not modeling the behaviors
    of actors completely realistically and because we may not know the exact state
    of the system.


    In addition, simulations necessarily model only part of reality, and we must be
    aware that parts outside of our simulation might actually be relevant.


    In the example of our traffic jam, for instance, maybe the best solution is neither
    of the options mentioned above, but to provide better public transport or bicycle
    lanes to get some off the road. If our simulation does not include that aspect,
    we would never find out by using the simulation, no matter how accurate it is.


    Despite these limitations, good simulations are incredibly useful, and even very
    simple simulations are fascinating to play with. They are so useful, in fact,
    almost all of the world''s fastest computers run simulations most of the time,
    or at least a substantial part of them.


    > Side note: Supercomputers

    A list of the fastest supercomputers in the world is regularly published on the
    Internet at http://www.top500.org. Most of these are described there in some detail,
    and for many of them, the list includes links to web sites that describe their
    purpose and the kind of work they are used for.

    Reading this material, you can see that many run by large research institutions
    or the military and that almost all are used to run simulations, often physics
    simulations. The military use them, for example, to test nuclear explosions in
    simulations, and research institutions conduct many different science experiments
    this way.


    Simulations also have a special place in the history of object-oriented programming:
    Object orientation was invented to run simulations.


    The first object-oriented programming language, named Simula, was introduced in
    the 1960s by Kristen Nygaard and Ole-Johan Dahl at the Norwegian Computer Center
    in Oslo. As the name suggests, its purpose was to build simulations. All object-oriented
    programming languages today can be traced back to that language. Dahl and Nygaard
    received the 2001 Turing Award—computer science''s equivalent of the Nobel prize—for
    this work.


    Enough introduction—let''s get our hands on the keyboard and try some things.


    In this chapter, we shall look at one simulation briefly and then work on writing
    another in more detail.


    # Foxes and rabbits


    The first simulation we investigate is called foxes-and-rabbits. It is a typical
    example of a class of simulations called predator-prey-simulations—a type of simulation
    in which we create chases (and eats) In our case, the predator is a fox and a
    rabbit.


    The idea here is as follows: The scenario shows a field that contains populations
    of foxes and rabbits. Foxes are represented by blue squares, and rabbits are shown
    as yellow squares.'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# Figure 9.1

    The foxes-and-rabbits


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_159_0.png)


    Both species have fairly simple behavior: Rabbits move around—if they are old
    enough—may produce offspring. There is a seat probability at each step for rabbits
    to reproduce. There are two ways in which rabbits may die: They may die of old
    age, or they may be eaten by a fox.


    Foxes move and breed in a manner similar to rabbits (although they breed less
    frequently and have fewer young). One additional thing, however, that they hunt.
    If they are hungry, they see a rabbit sitting next to them, they will move to
    eat the rabbit.


    Foxes can also die in two different ways: They can die of old age, and they can
    starve. If they do not find a rabbit to eat for some time, they will die. (Rabbits
    are assumed to always sufficient amounts of food.)


    > **Exercise 9.1** Open the *foxes-and-rabbits* scenario. Run it. Explain the
    patterns of populations and movement you see emerging in the field.


    > **Exercise 9.2** You will notice that this scenario shows a connect small window
    with a population graph. One curve shows the number of foxes, the other number
    of rabbits. Explain the shape of these graphs.


    As we can see, the simulation is highly simplistic in many ways: Animals do not
    have to meet to reproduce (they can do all on their own), food sources for rabbits
    are not included in the simulation, other factors of death (such as diseases)
    are ignored, and many factors are left out. However, the parameters that we simulate
    are already fairly interesting, and we can do some experiments with them.'
  merge: -1
