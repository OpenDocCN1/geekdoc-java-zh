  md: '# Chapter 8 Creating images and sound


    One of the important questions is what formats to use when saving images. As sounds,
    there is a trade-off to be made between quality and file size. Image files have
    the potential to be very large (much larger than the code files in our scenarios),
    which can easily dominate the overall size of our project. Again, this is particularly
    important if we want to export our scenario to a web server, such as the Greenfoot
    Gallery. Image formats can lead to different sizes by a factor of 10 or more,
    meaning that the scenario will download 10 times faster (as it is only a tenth
    of the size) if we choose formats like


    Greenfoot can read images in JPEG, PNG, GIF, BMP, and TIFF formats. Of these,
    JPEG and PNG are the two best formats for most uses.


    JPEG images have the advantage that they compress very well. This means they can
    be saved with very small file sizes. This is particularly true for color images,
    such as photos and backgrounds (which many digital cameras use this format). When
    saving images, many graphics programs allow us to choose how much we want to compress
    the file. The more we compress, the smaller the file, but quality is also reduced.
    Gimp, for example, presents a "Quality" slider when we save an image in JPEG format.
    Reducing the quality makes smaller.


    > **Exercise 8.22** Create an image in your graphics program and save it as a
    JPEG file. Save it with at least four quality settings. Open the different files
    and view them by side. Also compare the file sizes. Which quality setting is a
    good compromise between picture quality and file size for your image?


    > **Exercise 8.23** In your graphics program, make a new background for your scenario
    that you created for the earlier sections of this chapter. Save it as a JPEG file.
    Use it in your scenario. Which size (height and width) should the image be? What
    happens if it is too big?


    > **Exercise 8.24** How do you think the JPEG algorithm manages to make images
    smaller? How would this work? Try to come up with a few theories and guesses as
    to how this could be done.


    > **Exercise 8.25** How does JPEG actually compress files? Do some research on
    the Internet to find out answer in writing.


    The second image format that is very useful to use is PNG.


    PNG images have the advantage that they can handle transparency well. Any individual
    pixel can be partly or completely transparent. This allows us to create non-rectangular
    images. (As discussed in Chapter 7, all images are rectangular, but having transparency
    parts creates the appearance of transparency.)


    This ability to handle transparency, combined with good compression, makes PNG
    an ideal for actor images. (JPEG images cannot have transparent pixels, so they
    cannot be used, unless the actor happens to be rectangular. For backgrounds, this
    is generally not a problem, because we do not usually use transparency in backgrounds.)'
  merge: -1
