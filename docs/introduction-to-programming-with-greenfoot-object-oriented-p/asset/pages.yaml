    \ statements are executed, the variable body (declared in the loop header) will\
    \ be assigned one of the list elements. Thus, the sequence of action will be\n\
    \n```\nbody = first element from 'bodies'\nexecute loop statements;\nbody = second\
    \ element from 'bodies'\nexecute loop statements;\nbody = third element from 'bodies'\n\
    execute loop statements;\n...\n```\n\nThe variable body is available to be used\
    \ in the loop statements to access the current element from the list. We could\
    \ then, for example, call a method on object, as in the example shown above, pass\
    \ the object to another method for further processing.\n\nWe can use this loop\
    \ to apply gravity from all other bodies to this one:\n\n```\nfor (Body : bodies)\
    \ {\n    applyGravity(body);\n}\n```\n\nIn this code, we just take each element\
    \ (stored in the variable body) and pass it to another method named applyGravity,\
    \ which we will have to write in a moment.\n\nWe should add one more thing: Since\
    \ bodies is a list of all bodies in space, it includes the current object (the\
    \ one we want to apply gravity to) as well. We do not need to apply gravity of\
    \ an object to itself, so we can add an if statement that calls applyGravity only\
    \ if the element from the list is not the current object itself."
