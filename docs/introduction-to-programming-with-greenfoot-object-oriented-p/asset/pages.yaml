  md: '# Appendices


    Another actor is considered to be at offset if any part of that actor''s image
    intersects with the center point of the specified cell. The cls parameter provides
    the option to filter the objects to be considered (see above).


    These methods are often used to check an area in front of an actor (to test whether
    it can move forward) or below an actor (to check whether it is standing on something).


    # C.6 Neighbors


    Method:


    ```

    List getNeighbours(int distance, boolean diagonal, Class cls)

    Return the neighbours to this object within a given distance.

    ```


    This method is used to retrieve objects from cells surrounding the current actor.
    It is useful mainly in low-resolution scenarios.


    Note the spelling of the method name: It is really getNeighbours (with British
    spelling)—Greenfoot specify not an American system.


    The parameters specify the distance from the calling actor that should be considered
    and whether or diagonally positioned cells should be included. Figure C.4 illustrates
    the neighboring cells at distance I, with and without diagonals included.


    A distance of N is defined as all cells that can be reached in N steps from the
    actor''s position. The diagonal parameter determines whether diagonal steps are
    allowed in this algorithm.


    As with the previous methods, the cls parameter provides the option to consider
    only objects of a given class.


