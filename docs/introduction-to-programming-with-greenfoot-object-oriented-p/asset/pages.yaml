  md: '# # CHAPTER 8

    Creating images and sound


    | topics: | creating sounds, creating images, dynamic image changes, handling
    mouse input |

    | concepts: | sound formats, sound quality parameters, image file formats, RGBA
    model, transparency |


    Many of the scenarios we have encountered previously were interesting not only
    because of the program code that defined their behavior, but also because they
    made effective use of sound and images. So far, have not discussed the production
    of these media files much, and have mostly relied on existing pictures and sounds.


    In this chapter, we shall discuss some aspects of creating and managing these
    media files. We will first discuss some background about sound in computer programs,
    followed by various techniques to create and handle images.


    As a side effect, we also encounter dealing with mouse input.


    # ## 8.1 Preparation


    In contrast to previous chapters, we will not build a complete scenario in this
    chapter but work through various exercises that illustrate separate techniques
    that can be incorporated into a wide variety of different scenarios. The first
    sequence of exercises guides us through creating a scenario which plays a sound—we
    create ourselves—when the user clicks on an actor.


    For these exercises, we shall not use a prepared, partly implemented starting
    scenario this time but create a new one from scratch.


    **Exercise 8.1** As a preparation for the exercises in this chapter, create a
    new scenario. You can call it anything you like.'
  merge: -1
  pgno: 143
