    # Concept:


    A constant is a named value that can be used in similar ways as a variable, but
    can never change.


    This is what we call a constant. A constant has similarities to a field, in that
    we can use the name in our code to refer to its value, but the value can never
    change (it is constant). It is the final keyword that makes these declaration
    constants.


    The effect of the static keyword is that this constant is shared between all actors
    of class, and we don''t need separate copies of it in every object. We encountered
    the static keyword before (in Chapter 3), in the context of class methods. Just
    as static methods belong to the class (but can be called from objects of class),
    static fields belong to the class and can be accessed from its instances.


    In this case, the constants are declared a for gravity''(to be used later), and
    a default color for the bodies. It is an object of type Color, which we will discuss
    in more detail.


    It is good practice to declare fields constant that should not change in a program.
