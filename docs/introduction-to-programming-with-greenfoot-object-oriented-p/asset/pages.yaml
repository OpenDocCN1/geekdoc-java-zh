  md: '# Concept summary


    +   - Overloading is the use of the same method name for two different methods
    or constructors.

    - The keyword this is used to call one constructor from another, or to refer to
    the current object.

    - A constant is a named value that can be used in similar ways as a variable,
    but can never change.

    - The Java class library is a large collection of ready-made classes, provided
    with the Java system. We can use these classes by using an import statement.

    - Private methods are only visible from within the class they are declared in.
    They are used to improve the structure of the code.

    - The keyword null stands for "nothing" or "no object".

    - A collection is a kind of object that can hold many other objects.

    - A List is an example of a collection. Some methods from the Greenfoot API return
    List objects to us.

    - A generic type is a type that receives a second type name as a parameter.

    - The for-each loop is another kind of loop. It is well suited to process all
    elements of a collection.

    - The Greenfoot API contains methods for collision detection. These make it possible
    to detect when one actor touches another. (More about this in the next chapter.)'
