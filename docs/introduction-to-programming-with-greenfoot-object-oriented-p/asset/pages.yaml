  md: "# Chapter 5 Making music: An on-screen piano\n\nA local variable is declared\
    \ by writing the type of a variable, followed by its name:\n\n```\nint i;\n```\n\
    \nAfter declaring the variable, we can assign a value. Here are these two statements\
    \ together:\n\n```\nint i;\ni = 0;\n```\n\nJava allows a shortcut to write these\
    \ two statements in one line, declaring the variable and assigning a value:\n\n\
    ```\nint i = 0;\n```\n\nThis line has exactly the same effect as the two-line\
    \ version. This is the variant we have used in the code pattern for the while\
    \ loop above.\n\nLook at the pattern for the loop again—we should now be able\
    \ to understand what it does. We use a variable i and initialize it to 0. Then\
    \ we execute the body of the while loop, counting up i every time we do. We continue\
    \ as long as i is less than 100. When we reach 100, we stop the loop. Execution\
    \ will continue with the code following the loop body.\n\nThere are two further\
    \ details worth pointing out:\n\n+   We use the statement i = i + 1; at the end\
    \ of the loop to increment our loop variable by 1 every time we execute the loop.\
    \ This is important. It is a common error to forget to increment the loop counter.\
    \ The variable would then never change, the condition would always remain true,\
    \ and the loop would continue looping forever. This is called an infinite loop,\
    \ and it is the cause of many errors in programs.\n\n+   Our condition that we\
    \ execute the while loop is less than (< 100), not less or equal (=). The loop\
    \ will not be executed when i is equal to 100. At first, one might think that\
    \ this means the loop executes only 99 times, not 100 times. But this is not so.\
    \ Because we started counting at 0, not at 1, we execute 100 times (counting from\
    \ 0 to 99). It is common to start counting from 0 in computer programs—we will\
    \ see some advantages of doing so.\n\nNow that we know about a while loop, we\
    \ can use this construct to create all our piano keys.\n\nOur piano will have\
    \ 12 keys. We can create 12 keys by placing our statement in the inside body of\
    \ a loop that executes 12 times:\n\n```\nint i;\nwhile (i < 12)\n{\n    addObject(new\
    \ Key (\"g\", \"3a.wav\", 300, 140);\n    i = i + 1;\n}\n```\n\n**Exercise 5.15**\
    \ Replace the code in your own makeKeys method with the loop here. Try it out.\
    \ What do you observe?"
