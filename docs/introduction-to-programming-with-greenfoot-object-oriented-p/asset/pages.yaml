  md: "# 7.8 Growing the wave 117\n\nThe images field and the initializeImages method\
    \ are static (they use the static keyword in their definition). As we briefly\
    \ mentioned in Chapter 7, this means the images field is stored in the ProtonWave\
    \ class, not in the individual instances. As a result, all objects we create of\
    \ this class can share this set of images, and we do not need to create a separate\
    \ set of images for each object. This is much more efficient than using a separate\
    \ set each time.\n\nCopying and scaling these images takes a long time (between\
    \ a tenth of a second and a second on a average computer). This does not seem\
    \ very much, but it is long enough to introduce a visible, annoying delay when\
    \ we do it in the middle of playing a game. To solve this, the code of this method\
    \ is enclosed in an if statement:\n\n```\nif (images == null)\n  ..\n```\n\nThis\
    \ statement ensures that the main part of this method (the body of the statement)\
    \ is executed only once. The first time, images will be null, and the method executes\
    \ fully. This will initialize the images field to something other than null. From\
    \ then, the test of the statement is all that will be executed, and the body will\
    \ be skipped. The initializeImages method is actually called every time a proton\
    \ wave is created (from the constructor), but only the first time it is, substantial\
    \ work will be done.\n\nNow that we have a fair idea of the code and the fields\
    \ that already exist, we can finally get to work and make something happen.\n\n\
    What we want to do is the following:\n\n+   - We want to start the wave off with\
    \ the smallest image.\n- At every step, we want to grow the wave (show the next\
    \ larger image).\n- After we have shown the largest image, the wave should disappear\
