  md: "# D.3.2 Loops\n\nJava has three loops: while, do-while, and for. The for loop\
    \ has two forms. Except for the for-each loop, repetition is controlled in each\
    \ with a boolean expression.\n\n# D.3.2.1 while\n\nThe while loop executes a block\
    \ of statements as long as a given expression evaluates to true. The expression\
    \ is tested before execution of the loop body, so the body may be executed zero\
    \ times (i.e., not at all). This capability is an important feature of the while\
    \ loop.\n\n```\nwhile (expression)\n{\n    statements;\n}\n```\n\nExamples:\n\n\
    ```\nSystem.out.print(\"Please enter a filename: \");\ninput = readInput();\n\
    while (input == null)\n{\n    System.out.print(\"Please try again: \");\n    input\
    \ = readInput();\n}\n```\n\n```\nint index = 0;\nboolean found = false;\nwhile\
    \ (!found && index < list.size())\n{\n    if(list.get(index).equals(item))\n \
    \   {\n        found = true;\n    }\n    else\n    {\n        index++;\n    }\n\
    }\n```\n\n# D.3.2.2 do-while\n\nThe do-while loop executes a block of statements\
    \ as long as a given expression evaluates to true. The expression is tested after\
    \ execution of the loop body, so the body always executes at least once. This\
    \ is an important difference from the while loop.\n\n```\ndo\n{\n    statements;\n\
    } while (expression);\n```"
  merge: -1
  pgno: 198
- img_proc: true
  md: "Example:\n\n```\ndo {\n  System.out.print(\"Please enter a filename: \");\n\
    \  input = readInput();\n} while (input == null);\n```\n\n# D.3.2.3 for\n\nThe\
    \ for loop has two different forms. The first form is also known as a for-each\
    \ loop, and is used exclusively to iterate elements of a collection. The loop\
    \ variable is assigned the value of successive elements of the collection on each\
    \ iteration of the loop.\n\n```\nfor (variable-declaration : collection) {\n \
    \ statements;\n}\n```\n\nExample:\n\n```\nfor (String note : list) {\n  System.out.println(note);\n\
    }\n```\n\nThe second form of for loop executes as long as a condition evaluates\
    \ to true. Before the loop starts, an initialization statement is executed exactly\
    \ once. The condition is evaluated before every execution of the loop body (the\
    \ loop may execute zero times). An increment statement is executed after each\
    \ execution of the loop body.\n\n```\nfor (initialization; condition; increment)\
    \ {\n  statements;\n}\n```\n\nExample:\n\n```\nfor (int i = 0; i < text.size();\
    \ i++) {\n  System.out.println(text.get(i));\n}\n```\n\nBoth types of for loop\
    \ are commonly used to execute the body of the loop a definite number of times—instance,\
    \ once for each element in a collection. A for-each loop cannot be used if the\
    \ collection is to be modified while it is being iterated over."
