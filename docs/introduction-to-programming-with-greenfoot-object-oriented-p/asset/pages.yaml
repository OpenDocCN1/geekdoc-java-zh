  md: "# # APPENDIX C\nCollision detection\n\nIn this book, various collision detection\
    \ methods are used in different situations. Following is a summary of the collision\
    \ detection methods available for Greenfoot actors, and a short explanation of\
    \ their purpose and when to use them.\n\n# ## C.1 Method summary\n\nGreenfoot's\
    \ collision detection methods can be found in the Actor class. There are six relevant\
    \ methods. They are as follows:\n\n+   * getIntersectingObjects(Class cls)\n \
    \ Return all the objects that intersect this object.\n\n+   * getOneIntersectingObject(Class\
    \ cls)\n  Return an object that intersects this object.\n\n+   * getObjectsAtOffset(int\
    \ dx, int dy, Class cls)\n  Return all the objects that intersect the given location\
    \ (relative to this object's location).\n\n+   * getOneObjectAtOffset(int dx,\
    \ int dy, Class cls)\n  Return one object that is located at the specified cell\
    \ (relative to this object's location).\n\n+   * getNeighbours(int distance, boolean\
    \ diagonal, Class cls)\n  Return the neighbours to this object within a given\
    \ distance.\n\n+   * getObjectsInRange(int r, Class cls)\n  Return all objects\
    \ within range 'r' around this object.\n\n# ## C.2 Convenience methods\n\nTwo\
    \ of the methods, getIntersectingObjects and getObjectsAtOffset, have associated\
    \ convenience methods, starting with getOne....\n\nThese convenience methods work\
    \ in very similar ways as the method they are based, but they return a single\
    \ actor instead of a list of actors. In cases where multiple actors could be found\
    \ (e.g., other actors intersect with ours at the same time), the variant returning\
    \ a list returns all the relevant actors. The variant returning a single actor\
    \ randomly picks one of the intersecting"
