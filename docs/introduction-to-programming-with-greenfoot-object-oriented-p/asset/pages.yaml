  md: '# Terminology: Overloading


    It is perfectly legal in Java to have two methods that have the same name, as
    long as their parameter lists are different. This is called overloading. (The
    name of the method is overloaded—it refers to more than one method.)


    When we call an overloaded method, the runtime system figures out which of the
    two methods we mean by examining the parameters we supply.


    We also say that the two methods have different signatures.


    The second helper class, Vector, implements the vector itself, and is used by
    the SmoothMover class. Note that Vector is not listed in the Actor group of classes.
    It is not an actor—it will never appear in the world on its own. Objects of this
    class are only created and used by other actor objects.


    Vectors can be represented in two different ways: as a pair of distances in the
    x and y coordinates (dx, dy) or as a pair of values specifying the direction and
    its length (direction, length). The direction is usually specified as the angle
    from the horizontal.


    Figure 6.5 shows the same vector with both possible specifications. We say that
    either the (dx, dy) or the (direction, length) can describe the same vector.


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_98_0.png)


    The first representation, using the x and y offsets, is called a Cartesian representation.
    The second, using the direction and length, is a polar representation. You will
    see these two names used in the source code of the Vector class.


    For our purposes, sometimes the Cartesian representation is easier to use, and
    sometimes the polar representation is easier. Therefore, our vector class is written
    in a way that it can deal with both. It will do the conversions internally automatically.


