  md: '# APPENDIX D Some Java details


    # D.1 Java data types


    Java knows two kinds of types: primitive types and object types. Primitive types
    are stored in variables directly, and they have value semantics (values are copied
    when assigned to another variable). Object types are stored by storing references
    to the object (not the object itself). When assigned to another variable, only
    the reference is copied, not the object.


    # D.1.1 Primitive types


    The following table lists all the primitive types of the Java language:


    | Type name | Description | Example literals |

    | --- | --- | --- |

    | Integer numbers | | |

    | byte | byte-sized integer (8 bit) | 24 -2 |

    | short | short integer (16 bit) | 137 -119 |

    | int | integer (32 bit) | 5409 -2003 |

    | long | long integer (64 bit) | 423266353L 55L |

    | Real numbers | | |

    | float | single-precision floating point | 43.889F |

    | double | double-precision floating point | 45.632.4e5 |

    | Other types | | |

    | char | a single character (16 bit) | ''m'' ''\u00F6'' |

    | boolean | a boolean value (true or false) | true false |


    Notes:


    +   - A number without a decimal point is generally interpreted as an int, but
    automatically converted to byte, short, or long types when assigned (if the value
    fits). You can declare a literal as long by putting an L after the number. (1—lower-case
    L—works as well but should be avoided because it can be mistaken for a one).'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'A number with a decimal point is of type double. You can specify a float literal
    by putting an F or r after the number.


    A character can be written as a single Unicode character in single quotes or as
    a four-digit Unicode value, preceded by \u.


    The boolean literals are true and false.


    Because variables of the primitive types do not refer to objects, there are no
    methods associated with the primitive types. However, when used in a context requiring
    an object type, autoboxing might be used to convert a primitive value to a corresponding
    object.


    The following table details minimum and maximum values available in the numerical
    types.


    | Type | Minimum | Maximum |

    | --- | --- | --- |

    | byte | -128 | 127 |

    | short | -32768 | 32767 |

    | int | -2147483648 | 2147483647 |

    | long | -922337203685475808 | 922337203685475807 |


    | Positive minimum | Positive maximum |

    | --- | --- |

    | float | 1.4e-45 | 3.4028235e38 |

    | double | 4.9e-324 | 1.7976931348623157e308


    # D.1.2 Object types


    All types not listed in the Primitive types are object types. These include class
    and interface types from the standard Java library (such as String) and user-defined
    types.


    A variable of an object type holds a reference (or ''pointer'') to an object.
    Assignment and parameter passing have reference semantics (i.e., the reference
    is copied, not the object). After assigning one variable to another, both variables
    refer to the same object. The two variables are said to be aliases for the same
    object.


    The classes are for objects, defining the fields and methods that each instance
    possesses. Arrays behave like object types—they also have reference semantics.


    # D.2 Java operators


    # D.2.1 Arithmetic expressions


    Java has a considerable number of operators available for both arithmetic and
    logical expressions. Table D.1 shows everything that is classified as an operator,
    including things such as type casting and parameter passing. Most of the operators
    are either binary operators (taking a left'
