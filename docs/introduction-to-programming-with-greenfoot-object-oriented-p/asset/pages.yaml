  md: "involves a decision between two different sets of statements, whereas a switch\
    \ statement allows the selection of a single option from among several.\n\nLoops\
    \ offer the option to repeat statements, either a definite or an infinite number\
    \ of times. The former is typified by the for-each loop and for loop, while the\
    \ latter is typified by the while loop and do loop.\n\nIn practice, it should\
    \ be borne in mind that exceptions to the above characteristics are quite common.\
    \ For instance, an if-else statement can be used to select from several alternative\
    \ sets of statements if the else part contains a nested if-else statement; and\
    \ a for loop can be used to loop an indefinite number of times.\n\n# D.3.1 Selection\
    \ statements\n\n# D.3.1.1 if-else\n\nThe if-else statement has two main forms,\
    \ both of which are controlled by the evaluation of a boolean expression:\n\n\
    ```\nif (expression)\n{\n  statements\n}\n```\n\n```\nif (expression)\n{\n  statements\n\
    }else\n{\n  statements\n}\n```\n\nIn the first form, the value of the boolean\
    \ expression is used to decide whether to execute the statements or not. In the\
    \ second form, the expression is used to choose between two alternative sets of\
    \ statements, only one of which will be executed.\n\nExamples:\n\n```\nif (field.size()\
    \ == 0)\n{\n  System.out.println(\"The field is empty.\");\n}\n```\n\n```\nif\
    \ (number < 0)\n{\n  reportError();\n}else\n{\n  processNumber(number);\n}\n```"
