    # D.2.2 Boolean expressions


    In expressions, operators are used to combine operands to produce a value of either
    true or false. Such expressions are usually found in the test expressions of if-else
    statements and loops.


    The relational operators usually combine a pair of arithmetic operators, although
    the tests for equality and inequality are also used with object references. Java''s
    relational operators are:


    ```

    == equal-to      != not-equal-to

    < less-than      <= less-than-or-equal-to

    > greater-than >= greater-than-or-equal-to

    ```


    The binary logical operators combine two boolean expressions to produce another
    boolean value. The operators are


    ```

    && and

    || or

    exclusive-or

    ```


    In addition,


    ```

    ! not

    ```


    Both && and || are slightly unusual in the way they are applied. If the left operand
    of && is false then the value of the right operand is irrelevant and will not
    be evaluated. Similarly, if the left operand of || is true then the right operand
    is not evaluated. They, are known as short-circuit operators.


    # D.3 Java control structures


    Control structures affect the order in which statements are executed within the
    body of a method or constructor. There are two main categories: selection statements
    and loops.


    A selection statement provides a decision point at which a choice is made to follow
    one route through the body of a method or constructor rather than another route.
