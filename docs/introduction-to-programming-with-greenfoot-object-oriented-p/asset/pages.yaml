    # Working with images


    As discussed briefly in previous chapters (e.g., when we produced the asteroids
    background in

    Chapter 7), managing images for actors and world backgrounds can be achieved in
    two different

    ways: We can use prepared images from files, or we can draw an image on the fly
    in our program.


    We shall discuss both methods in a little more detail here.


    # Image files and file formats


    There are various ways to acquire images for our scenarios. The easiest is, of
    course, to use images

    from the Greenfoot image library. These are presented automatically when we create
    new classes.

    There are also several libraries of free icons and images available on the Internet.
    A few

    minutes of searching through some of them. (Make sure, that the images you want

    to use are meant for free public use—not everything is free or in the public domain
    just

    because it is on the Internet. Respect other people''s copyright and license terms.)


    The most interesting alternative, however, if we want to make our scenarios unique
    and give

    them their own atmosphere, is to make images ourselves.


    There are several graphics programs that we can use to produce images. *Photoshop
    is

    the best known commercial program, and is certainly a very good one to use if
    you want

    to have it. However, there are also free and open source programs that provide
    significant functionality.

    *Gimp*² is an excellent free program with many sophisticated features, and it
    is worth installing.

    There are also many simpler paint programs that could be used.


    Producing looking graphics takes some time to learn, and cannot be discussed in
    detail

    this book. Play and practice, and you will figure out many techniques and tricks.
    Here, we shall

    oconcentrate on the technicalities of using the images.


    > ² http://www.gimp.org'
