  md: '# Chapter 8 ■ Creating images and sound


    # Concept:


    Sounds can be saved in a variety of different formats and encodings. Not all programs
    can play all sound. For Greenfoot, we usually use WAV format.


    and Greenfoot can read only some of them. As a result, Greenfoot cannot, for example,
    play all WAV files.


    When you save your recorded sounds, you should save them as a “signed 16 bit PCM
    WAV” file. This is the safest format to ensure playback. In many sound recording
    programs, it is achieved by using an “Export” function, rather than the standard
    “Save” function. Make sure to save in this format.


    When you come across sound files that Greenfoot cannot play (maybe downloaded
    from the Internet), you can easily open them in your sound editing program and
    convert them to this format.


    +   Exercise 8.17 Save your recorded sound in an appropriate format for Greenfoot.
    Modify the code of your actor class so that it plays your sound when it is clicked.


    +   Exercise 8.18 Modify your code so that it plays one sound effect when clicked
    with the left mouse button, and another sound effect when clicked with the right
    mouse button. To do this, you need to get information about the mouse click that
    tells you which button was pressed. Greenfoot has methods to achieve this—see
    the Greenfoot classification for how this can be done.


    +   Exercise 8.19 Modify the code so that the actor, when it is clicked, plays
    a sound effect and moves to a new random location.


    # Concept:


    The sample format, rate, and mono/stereo setting of a sound recording file determine
    size and quality.


    Sound files can become very large. This is not a major problem as long as the
    scenario is only used locally, but if the scenario is exported, for instance to
    the Greenfoot Gallery, the size can make a big difference. Sound and image files
    are often the largest parts of a Greenfoot scenario, and the sound file sizes
    can make the difference between a scenario loading quickly and users waiting for
    a scenario to download.


    To avoid large sound files, you should pay attention to encoding. When we record
    and save sounds, we can make trade-offs between sound quality and file size. We
    can record and save the sound either in high quality, leading to large files,
    or in lower quality, leading to smaller files. The sizes we vary mainly


    +   The sample format (usually 16-bit, 24-bit, or 32-bit).


    +   The sample rate, measured in Hertz (Hz), usually ranging from 8,000 Hz to
    96,000 Hz.


    +   Stereo versus mono recording. Stereo records two separate tracks, and produces
    twice the amount of data.


    If you look carefully at Figure 8.1, you can see that the sound in that screenshot
    was recorded in 32 bit, 44,100 Hz, stereo.


    This is a typical default for sound recording programs, but actually much higher
    quality than is needed for simple sound effects. (We might want this quality for
    listening to music like that, but we don''t need it for a short Bang! sound effect.)'
