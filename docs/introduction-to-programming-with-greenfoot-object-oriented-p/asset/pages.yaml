  md: '# Chapter 1 Getting to know Greenfoot


    Once you have a class in Greenfoot, you can create as many objects from it as
    you so like.


    Concept: Many objects can be created from a class.


    Exercise 1.1 Create some more wombats in the world. Create some leaves.


    Currently, only the Wombat and Leaf classes are of interest to us. We shall discuss
    the other classes later.


    # 1.3 Interacting with objects


    Once we have placed objects into the world, we can interact with these objects
    by right-clicking them. This will pop up the object menu (Figure 1.4). The object
    menu shows all the operations this specific object can perform. For example, a
    wombat''s object shows us what this wombat can do (plus two additional functions,
    Inspect and Remove), which we shall discuss later.


    Concept: Objects have methods. Invoking these performs an action.


    In Java, these operations are called methods. It cannot hurt to get used to standard
    terminology, so we shall also call them methods from now on. We can invoke a method
    by selecting it from the menu.


    Exercise 1.2 Invoke the move() method on a wombat. What does it do? Try it several
    times. Invoke the turnLeft() method. Place two wombats into your world and make
    them face each other.


    Figure 1.4 The wombat''s object menu


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_22_0.png)'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'In short, we can start to make things happen by creating objects from one of
    the classes provided, and we can give commands to the objects by invoking their
    methods.


    Let us have a closer look at the object method. The move and turnLeft methods
    are listed as:


    ```

    void move()

    void turnLeft()

    ```


    We can see that the method names are not the only things shown. There is also
    the word void at the beginning and a pair of parentheses at the end. Two cryptic
    bits of information tell us what data goes into the method call and what data
    comes back from it.


    # Return types


    The binding is called the return type. It tells us what the method returns to
    us when we invoke it. The void means "nothing" in this context: Methods with a
    void return type do not return any information. They just carry out their action,
    and stop.


    Any word other than void tells us that the method returns something when invoked,
    and of what type that information is. In the wombat''s method (Figure 1.4) we
    can also see the int and boolean. The word int is for "integer" and refers to
    whole numbers (numbers without a decimal point). Examples of integer numbers are
    3, 42,-3, and 120000.


    The type boolean has only two possible values: true and false. A method that returns
    a boolean will return either the true value or false to us.


    Methods with void return types are like commands for our wombat. If we invoke
    the turnLeft method, the wombat obeys and turns left. Methods with non-void return
    types are like questions. Consider the canMove method:


    ```

    boolean canMove()

    ```


    When we invoke this, we see a result similar to that shown in Figure 1.5, displayed
    in a dialog box. The important information is here the word true, which was returned
    by it


    Figure 1.5

    A method result


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_23_0.png)'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'method call. In effect, we have just asked the wombat “Can you move?” and the
    wombat has answered “Yes!” (true).


    > Exercise 1.3 Invoke the canMove() method on your wombat. Does it always return
    true? Or can you find situations in which it returns false?


    Try another method with a return value:


    ```

    int getLeavesEaten()

    ```


    Using this method, we can get information how many leaves this wombat has eaten.


    > Exercise 1.4 Using a newly created wombat, the getLeavesEaten() method will
    always return zero. You can create a situation in which the result of this method
    is not zero? (In other words: can you make your wombat eat some leaves?)


    Methods with non-void return types usually tell us something about the object
    (Can it move? How many leaves has it eaten?), but do not change the object. The
    wombat is as it was before we asked it about the leaves. Methods with void return
    types are usually commands to the objects that it do something.


    # 1.5 Parameters


    The other bit in the method menu that we have not yet discussed are the parentheses
    in the method name.


    ```

    int getLeavesEaten()

    void setDirection(int direction)

    ```


    The parentheses after the method name hold the parameter list. This tells us what
    the method requires any additional information to run, and if so, what kind of
    information.


    If we see a pair without anything else it (as we have in all methods far, the
    method has an empty parameter list). In other words, if there are no parameters—we
    invoke the method with just run. If there is anything within the parentheses,
    the method expects one or more parameters—additional information that we need
    to provide.


    Let us try the setDirection method. We can see that it has the words direction
    within its parameter list. When we invoke it, we see a dialog box similar to the
    one we saw in Figure 1.6.


    The words direction tell us that the method expects one parameter of type int,
    which specifies a direction. A parameter is an additional bit of data we must
    provide for this method to run. Every parameter is defined by two words: first
    the parameter type (here: int) and then a name, which gives us a hint what this
    parameter is used for. If a method has a parameter, then we need to provide this
    additional information when we invoke the method.'
