  md: "# Using loops: The while loop\n\nProgramming loops offer you a specific construct\
    \ to do a similar task repeatedly: a loop.\n\nA loop is a programming language\
    \ construct that allows us to express commands such as \"Do this statement 20\
    \ times\" or \"Call these two methods 3 million times\" easily and concisely (without\
    \ writing 3 million lines of code). Java has several different kinds of loop.\
    \ The one we shall investigate is now called a while loop.\n\nA while loop has\
    \ the following form:\n\n```\nwhile ( condition )\n{\n    statement;\n    statement;\n\
    \    ..\n```\n\nThe Java keyword is followed by a condition in parentheses and\
    \ a block (a of curly brackets) containing one or more statements. These statements\
    \ will be executed over and over, as long as the condition is true.\n\nA common\
    \ pattern is a loop that executes some statements given a number of times. To\
    \ do this, we use a loop variable as a counter. It is common practice to name\
    \ a loop variable i, so we do this as here. Here is an example that executes the\
    \ body of the while loop 100 times:\n\n```\nint i = 0;\nwhile (i < 100)\n{\n \
    \   statement;\n    statement;\n    ..\n    i = i + 1;\n}\n```\n\nThere are several\
    \ things worth noting in this code. First, it uses a concept that we have not\
    \ encountered before: a local variable.\n\nA local variable is a variable similar\
    \ to a field. We can use it to store values in, such as an integer number, or\
    \ object references.\n\nIt differs from fields in several respects:\n\n+   - A\
    \ local variable is declared inside a method, not at the beginning of the class;\n\
    - It has no visibility modifier (private or public) in front of it; and\n- It\
    \ exists only until the current method finishes running, then it will be erased.\n\
    \n> ¹ Strictly speaking, this is not exactly correct. Local variables can also\
    \ be declared inside blocks, such as inside if statements or the body of the loop.\
    \ They exist only until execution exits the block they were declared in. The statement\
    \ above is, however, correct if the local variable was declared at the beginning\
    \ of a method."
  merge: -1
