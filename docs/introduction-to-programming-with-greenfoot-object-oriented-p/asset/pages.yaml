  md: '# 8.4 Sound file formats and file sizes


    131


    Recording the sound is pretty straight forward—you can usually figure this out
    by playing with the program for a little while.


    **Exercise 8.13** Open a sound recording program and record a sound. Play it back.
    Does it come out as you expected? If not, delete it and try again.


    When we record sounds, we often have a few seconds at the beginning and the end
    of our recording that we do not want. Most recording programs allow us to edit
    the sound before saving, so we can cut off those that we don''t need.


    In Figure 8.1, for example we can see a fairly long time of silence at the beginning
    and the end of the file (the straight horizontal lines on the left and right of
    the graph). If we save the sound file as it is, the effect would be the sounds
    delayed when we play it (since the first part of the sound that gets played is
    a second of silence).


    We can edit the sound by selecting parts of it and using cut, copy and paste to
    remove any selected parts.


    **Exercise 8.14** Edit your sound file so that it includes the exact sound you
    want. Remove any noise or silence at the beginning or end, or any parts in the
    middle that are not needed.


    Many sound editing programs also offer filters to modify the sound or generate
    entirely new sound elements. Using filters, many different sounds can be generated.
    By applying effects, such as amplification, echoes, reverting, speed changes,
    and others, to simple sounds (such as clapping, whistling, shouting, etc.), we
    can create a wide variety of effects.


    **Exercise 8.15** If your sound program supports filters, apply some filters to
    your recorded sound. Select three of your favorite filters and describe, in what
    they do. Describe an example where you might use this effect.


    **Exercise 8.16** Produce the following sounds: a rabbit chewing a carrot; an
    explosion; a sound of hard objects colliding; a "game over" sound where the player
    has lost the game; a robot voice; and a "jumping" sound (used when a game character
    jumps).


    When editing the sound is complete, we are ready to save it to a file.


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_147_0.png)


    # Sound file formats and file sizes


    Sound files can be saved in many different formats and in different encodings,
    and this can get quite confusing very quickly.


    Greenfoot can play sounds in WAV, AIFF, and AU formats. (No MP3 files, I''m afraid.)
    These formats, however, are what is known as "envelope formats"—they can contain
    different encodings,'
