  md: '# 4.4 Greenfoot images


    The effect of this (switching back and forth between these images) will be that
    the crab looks as if it is moving its legs.


    In order to do this, we have to introduce two new concepts: variables and Greenfoot
    images.


    # 4.4 Greenfoot images


    Greenfoot provides a class GreenfootImage that helps in manipulating images. We
    can obtain an image by constructing a new GreenfootImage object—using Java''s
    new keyword—with the name of the image file as a parameter to the constructor.
    For example, to get access to the crab2.png, we can write


    ```

    new GreenfootImage(`crab2.png`);

    ```


    The file name must exist in the scenario *images* folder.

    All actors get an image from their class. We assign an image to the class when
    we create it, and upon creation, a copy of that same image. That does not mean,
    however, that all objects of the class must always keep the same image. Every
    individual actor can decide to change its image at any time.


    > **Exercise 4.6** Check the documentation of the *Actor* class. There are two
    methods that allow us to change an actor''s image. What are they called, and what
    are their parameters? What do they return?


    If you did the exercise, you will have seen that one method to set an actor''s
    image expects a parameter of type GreenfootImage. This is the method we shall
    use. We can create a GreenfootImage object from image file as described above,
    and use the setImage method to use it for the actor. Here is a code snippet to
    this:


    ```

    setImage(new GreenfootImage(`crab2.png`));

    ```


    Note that we do two things in this line: we call the setImage method, which expects
    an image as a parameter:


    ```

    setImage( some-Image );

    ```


    And in the place of the image to use, we write


    ```

    new GreenfootImage(`crab2.png`);

    ```


    This creates the image object from the named image file (*crab2.png*). When the
    line is executed, the inner part of the code—the creation of the GreenfootImage
    object—is executed first. Following that, the setImage method call is executed,
    and the image object we just created is passed as a parameter.'
