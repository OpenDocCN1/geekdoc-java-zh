  md: "# 148 Chapter 9 Simulations\n\n# Side note: Random distributions\n\nIf we need\
    \ random behavior in our programs, it is sometimes important to think about what\
    \ kind of random distribution we need. Many random functions, such as the Greenfoot.getRandomnumber\
    \ method, produce a uniform distribution. In this, the chance of every possible\
    \ result occurring is same. The Gaussian random number gives us a normal distribution.\
    \ This is in which the average results are more likely to occur, and more extreme\
    \ cases are rarer.\n\nIf we, for example, program a dice game, we need a uniform\
    \ distribution. Each side of the die is evenly likely to come up. On the other\
    \ hand, if we model the speed of cars in a traffic simulation, a normal distribution\
    \ would be better. Most cars are driving somewhere close to the average speed,\
    \ and few cars are very slow or very fast.\n\nNext, we need to add functionality\
    \ to remove some crumbs from the food pile, so that ants can take some food.\n\
    \n> Exercise 9.18 Add a public method to class Food that removes a few crumbs\
    \ from the pile. Make sure that the image is redrawn with the correct number of\
    \ crumbs. When the crumbs are all gone, the Food object should remove itself from\
    \ the world. Test this method interactively.\n\nNow that we have a pile of food\
    \ available in our scenario, we shall make our ants collect it. Ants will switch\
    \ between two different behaviors:\n\n+   * If they are not carrying food, they\
    \ search for food.\n* If they are currently carrying food, they walk towards home.\n\
    \nAnts switch between these two behaviors when they reach a food pile or the ant\
    \ hill. If they are searching for food, and they run into a food pile, they pick\
    \ up the food and switch from the first to the second behavior. If they reach\
    \ the ant hill, they drop the food and switch back to the first behavior pattern.\n\
    \nWe shall implement this in our Ant class. Written in pseudo code, the act method\
    \ might look like this:\n\n```\n (carrying food) {\n    walk towards home;\n \
    \   check whether we are home;\n}\nelse {\n    search for food;\n}\n```\n\nWe\
    \ implement this now one step at a time."
