    \ class\n\n```\nimport greenfoot.*; // (Actor, World, Greenfoot, GreenfootImage)\n\
    \npublic class CrabWorld extends World\n{\n    /**\n     * Create the crab world\
    \ (the beach). Our world has a size\n     * of 50560 cells, where every cell is\
    \ just 1 pixel.\n     */\n    public CrabWorld()\n    {\n        super(560, 560,\
    \ 1);\n    }\n}\n```\n\nNext comes the interesting part:\n```java\npublic CrabWorld()\n\
    {\n    super(560, 560, 1);\n}\n```\n\nThis is called the constructor of this class.\
    \ A constructor looks quite similar to a method, but there are some differences:\n\
    \n- A constructor has no return type specified between the keyword \"public\"\
    \ and the name.\n- The name of a constructor is always the same as the name of\
    \ the class.\n\nA constructor is a special kind of method that is always executed\
    \ whenever an instance of this class is created. It can then do what it wants\
    \ to set up this new instance into a starting state.\n\nIn our case, the constructor\
    \ sets the world to the size we want (560 by 560 cells) and a resolution (1 pixel\
    \ per cell). We will discuss world resolution in detail later in this book.\n\n\
    Since this constructor is executed every time the world is created, we can use\
    \ it to automatically create our actors. If we insert code into the constructor\
    \ to create an actor, that code will be executed as we use. For example:\n\n```java\n\
    public CrabWorld()\n{\n    super(560, 560, 1);\n    addObject(new Crab(), 150,\
    \ 100);\n}\n```\n\nThis code will automatically create a new crab, and place it\
    \ at location x=150, y=100 into the world. The 150,100 is 150 cells from the left\
    \ edge of the world, and 100 cells from the top. The origin—the 0,0 point—of our\
    \ coordinate system is at the top left of the world (Figure 4.1).\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_60_0.png)\n\
    \n# Figure 4.1\n\nThe coordinate system of the world\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_61_0.png)\n\
    \nWe are using two new things here: the addObject method, and the new statement\
    \ to create the new crab.\n\nThe addObject method is a method of the World class.\
    \ We can look it up by looking at the class classification for class World. There,\
    \ we see that it has the following signature:\n\n```\nvoid addObject(Actor object,\
    \ int x, int y)\n```\n\nReading the signature from start to finish, this tells\
    \ us the following:\n\n- The method does not return a result (void return type).\n\
    - The name of the method is addObject.\n- The method has three parameters, named\
    \ object, x, and y.\n- The type of the first parameter is Actor, the type of the\
    \ other two is int.\n\nThis can be used to add a new actor into the world. Since\
    \ the method belongs to the World class and CrabWorld is a World (it inherits\
    \ from the World class), this method is available in our CrabWorld class, and\
    \ we can just call it.\n\n## 4.2 Creating new objects\n\nThe addObject method\
    \ allows us to add an actor to the world. However, in order to add an object,\
    \ we must first have an object to add.\n\nThe Java keyword allows us to create\
    \ new objects of any of the existing classes. For example, the expression\n\n\
    ```java\nnew Crab()\n```\n\ncreates new instance of class Crab. The expression\
    \ to create new objects always starts with the new keyword, followed by the name\
    \ of the class we wish to create and a parameter list (which is empty in example).\
    \ The parameter list allows us to pass parameters to the constructor. Since we\
