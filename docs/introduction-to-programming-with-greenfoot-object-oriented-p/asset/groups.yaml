    **练习 1.9** 点击 `Run` 按钮。它做了什么？


    `act` 方法是 Greenfoot 对象的一个非常基础的方法。我们将在后续所有章节中经常遇到。Greenfoot 世界中的所有对象都有这个方法。调用 `act`
    本质上是给对象指令“去做任何你想做的事”。如果你尝试了我们的袋鼠，你会看到袋鼠的 `act` 执行了类似以下的操作：


