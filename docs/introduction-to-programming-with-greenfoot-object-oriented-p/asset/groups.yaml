    # Chapter 5 ■ Making music: An on-screen piano


    All we need to do now is play the sound when the keyboard key is pressed.


    To play the sound programmatically (from your code), we can just call our own
    play method, like this:


    ```

    play();

    ```


    Exercise 5.7 Add code to your Key class so that the key''s note is played when
    the associated keyboard key is pressed. To do this, you need to figure out where
    the call to the play method should be added. Test.


    Exercise 5.8 What happens when you create two keys, run the scenario and press
    the “g” key? Do you have any ideas what we need to do to make them react to different
    keyboard keys?


    All the changes described for this are are available in the book scenarios piano-2.
    If you had problems that you could not solve, or if just want to compare your
    solution with ours, we have a look at this version.


    # 5.3 Abstraction: Creating multiple keys


    We have reached a stage where we can create a piano key that reacts to one key
    of our computer keyboard and plays a simple piano note. The problem now is: When
    we create multiple keys, they all react to the keyboard key, and all produce the
    same note. We need to change that.


    The current limitation comes from the fact that we hard-coded the keyboard name
    (“g”) and the sound file (“3.wav”) into that class. That means, we used these
    names directly, without a chance to change the source code and recompiling.


    When writing computer programs, writing code that can solve one specific task—such
    as finding the square root of 1,764 or playing a middle-a piano sound—is well
    and good, but not incredibly useful. Generally, we would like to write code that
    can solve a class of problem (such finding the square root of any number, or playing
    a range of piano keys). If we do this, our program becomes much more useful.


    To achieve this, we use a technique called abstraction. Abstraction occurs in
    computing in many different forms and contexts–this is one of them.


    We shall use abstraction to turn our Key class from a that can create objects
    that play a middle-a when the “g” key is pressed on the keyboard into one that
    can create objects that play a range of notes when different keyboard keys are
    pressed.


    The main idea of achieving this is to use a variable for the name of the keyboard
    key we react to, and another variable for the name of the sound file then we want
    to play.


    # Concept:

    Abstraction

    occurs in many ndifferent forms in programming. One of them is the technique to
    write code that can solve a whole class of problems, rather than a single specific
    problem.'
