    # 6.5 Using Java library classes


    While reading the code above, in the Body and Space classes, we have come across
    the Color class. The second constructor of the Body class expects a parameter
    of type Color, and the code in the Space class creates Color objects with expressions
    as


    ```

    new Color(248, 160, 86)

    ```


    The three parameters of the Color constructor are the red, green, and blue components
    of this particular color. Every color on a computer screen can be described as
    a composite of these base colors. (We will discuss a little more in Chapter 8.
    There, on page 136, you can also find a table of RGB color values. You can use
    any graphics program to experiment with yours.)


    For the most pressing question is, does this class come from? And how can we know
    what parameters its constructors expect?


    A clue to the answer is found near the top of our class, where we can find the
    line


    ```

    import java.awt.Color;

    ```


    The Color class is one of the many classes from the Java Standard Class Library.
    The Java system comes with a large collection of useful classes which we can just
    use. Over time, we will need to know many


    We can see documentation for all classes in the class library by selecting Java
    Library Documentation from Greenfoot''s Help menu. This will open the documentation
    for the Java classes in a web browser (Figure 6.6).


    The bottom left pane in this window shows a list of all classes in the Java library.
    (There are many of them!) We can look at the documentation for any particular
    class by finding it in this list and selecting it. When selected, the main part
    of the window will display the documentation for this class.


    > Exercise 6.16 Find the class Color in the class list. Select it. Look at the
    documentation of this class. How many constructors does it have?


    > Exercise 6.17 Find the description of the constructor we have used (the one
    with three integers as parameters). What is the legal range for these integer
    numbers?


    You can see that there are thousands of classes in the Java library. To get some
    sort of order into this long list, classes are grouped into packages. A package
    is a group of related classes. At the top of the documentation of any class, we
    can see what package the class is in. The Color class, for instance, is in a package
    called java.awt.


    When we want to use any of the classes from the Java library in our own scenario,
    we need to import an import statement as we have seen above. The import statement
    names the package and what we want to use, with a dot between. Thus, to use the
    Color class from java.awt package, we write


    ```

    import java.awt.Color;

    ```


