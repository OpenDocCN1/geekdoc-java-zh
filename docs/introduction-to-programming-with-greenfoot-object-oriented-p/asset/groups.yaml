    \n其中两个方法 getIntersectingObjects 和 getObjectsAtOffset 具有相关的方便方法，均以 `getOne....`\
    \ 开头。\n\n这些方便方法的工作原理与其基于的方法非常相似，但它们返回的是单个 actor 而不是 actor 列表。在可能找到多个 actor 的情况下（例如，其他\
    \ actor 同时与我们交叉），返回列表的变体会返回所有相关的 actor。返回单个 actor 的变体则从交叉的对象中随机选择一个。\n\n这些方便方法的目的仅仅是为了简化代码：通常，我们只对单个交叉\
