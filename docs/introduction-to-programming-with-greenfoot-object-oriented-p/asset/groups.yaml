    # Chapter 8 Creating images and sound


    ## Concept:


    Sounds can be saved in a variety of different formats and encodings. Not all programs
    can play all sound. For Greenfoot, we usually use WAV format, and Greenfoot can
    read only some of them. As a result, Greenfoot cannot, for example, play all WAV
    files.


    When you save your recorded sounds, you should save them as a “signed 16 bit PCM
    WAV” file. This is the safest format to ensure playback. In many sound recording
    programs, it is achieved by using an “Export” function, rather than the standard
    “Save” function. Make sure to save in this format.


    When you come across sound files that Greenfoot cannot play (maybe downloaded
    from the Internet), you can easily open them in your sound editing program and
    convert them to this format.


    - Exercise 8.17 Save your recorded sound in an appropriate format for Greenfoot.
    Modify the code of your actor class so that it plays your sound when it is clicked.

    - Exercise 8.18 Modify your code so that it plays one sound effect when clicked
    with the left mouse button, and another sound effect when clicked with the right
    mouse button. To do this, you need to get information about the mouse click that
    tells you which button was pressed. Greenfoot has methods to achieve this—see
    the Greenfoot classification for how this can be done.

    - Exercise 8.19 Modify the code so that the actor, when it is clicked, plays a
    sound effect and moves to a new random location.


    ## Concept:


    The sample format, rate, and mono/stereo setting of a sound recording file determine
    size and quality.


    Sound files can become very large. This is not a major problem as long as the
    scenario is only used locally, but if the scenario is exported, for instance to
    the Greenfoot Gallery, the size can make a big difference. Sound and image files
    are often the largest parts of a Greenfoot scenario, and the sound file sizes
    can make the difference between a scenario loading quickly and users waiting for
    a scenario to download.


    To avoid large sound files, you should pay attention to encoding. When we record
    and save sounds, we can make trade-offs between sound quality and file size. We
    can record and save the sound either in high quality, leading to large files,
    or in lower quality, leading to smaller files. The sizes we vary mainly


    - The sample format (usually 16-bit, 24-bit, or 32-bit).

    - The sample rate, measured in Hertz (Hz), usually ranging from 8,000 Hz to 96,000
    Hz.

    - Stereo versus mono recording. Stereo records two separate tracks, and produces
    twice the amount of data.


    If you look carefully at Figure 8.1, you can see that the sound in that screenshot
    was recorded in 32 bit, 44,100 Hz, stereo. This is a typical default for sound
    recording programs, but actually much higher quality than is needed for simple
    sound effects. (We might want this quality for listening to music like that, but
    we don''t need it for a short Bang! sound effect.)


    In general, you should consider saving your sounds in lower quality, unless you
    feel really need more quality.


    **Exercise 8.20** Search your sound recording program for settings for sample
    format, sample rate, and stereo/mono recording. In some programs, you can convert
    sounds. In other programs, you can specify these settings only for new recordings.
    Make a sound recording with different sample formats, with different sample rates,
    and in stereo mono. Save these as different files and compare the file sizes.
    Change which has the largest benefit for the file size?


    **Exercise 8.21** Listen to the sounds produced in the previous exercise. Can
    you hear a difference? How much can you reduce the quality (and the file size)
    while still achieving acceptable quality?


    ## Working with images


    As discussed briefly in previous chapters (e.g., when we produced the asteroids
    background in Chapter 7), managing images for actors and world backgrounds can
    be achieved in two different ways: We can use prepared images from files, or we
    can draw an image on the fly in our program.


    We shall discuss both methods in a little more detail here.


    ## Image files and file formats


    There are various ways to acquire images for our scenarios. The easiest is, of
    course, to use images from the Greenfoot image library. These are presented automatically
    when we create new classes. There are also several libraries of free icons and
    images available on the Internet. A few minutes of searching through some of them.
    (Make sure, that the images you want to use are meant for free public use—not
    everything is free or in the public domain just because it is on the Internet.
    Respect other people''s copyright and license terms.)


    The most interesting alternative, however, if we want to make our scenarios unique
    and give them their own atmosphere, is to make images ourselves.


    There are several graphics programs that we can use to produce images. *Photoshop*
    is the best known commercial program, and is certainly a very good one to use
    if you want to have it. However, there are also free and open source programs
    that provide significant functionality. *Gimp*² is an excellent free program with
    many sophisticated features, and it is worth installing. There are also many simpler
    paint programs that could be used.


    Producing looking graphics takes some time to learn, and cannot be discussed in
    detail this book. Play and practice, and you will figure out many techniques and
    tricks. Here, we shall concentrate on the technicalities of using the images.


    > ² http://www.gimp.org


    # One of the important questions is what formats to use when saving images. As
    sounds, there is a trade-off to be made between quality and file size. Image files
    have the potential to be very large (much larger than the code files in our scenarios),
    which can easily dominate the overall size of our project. Again, this is particularly
    important if we want to export our scenario to a web server, such as the Greenfoot
    Gallery. Image formats can lead to different sizes by a factor of 10 or more,
    meaning that the scenario will download 10 times faster (as it is only a tenth
    of the size) if we choose formats like


    Greenfoot can read images in JPEG, PNG, GIF, BMP, and TIFF formats. Of these,
    JPEG and PNG are the two best formats for most uses.


    JPEG images have the advantage that they compress very well. This means they can
    be saved with very small file sizes. This is particularly true for color images,
    such as photos and backgrounds (which many digital cameras use this format). When
    saving images, many graphics programs allow us to choose how much we want to compress
    the file. The more we compress, the smaller the file, but quality is also reduced.
    Gimp, for example, presents a "Quality" slider when we save an image in JPEG format.
    Reducing the quality makes smaller.


    **Exercise 8.22** Create an image in your graphics program and save it as a JPEG
    file. Save it with at least four quality settings. Open the different files and
    view them by. Also compare the file sizes. Which quality setting is a good compromise
    between picture quality and file size for your image?


    **Exercise 8.23** In your graphics program, make a new background for your scenario
    that you created for the earlier sections of this chapter. Save it as a JPEG file.
    Use it in your scenario. Which size (height and width) should the image be? What
    happens if it is too big?


    **Exercise 8.24** How do you think the JPEG algorithm manages to make images smaller?
    How would this work? Try to come up with a few theories and guesses as to how
    this could be done.


    **Exercise 8.25** How does JPEG actually compress files? Do some research on the
    Internet to find out answer in writing.


    The second image format that is very useful to use is PNG. PNG images have the
    advantage that they can handle transparency well. Any individual pixel can be
    partly or completely transparent. This allows us to create non-rectangular images.
    (As discussed in Chapter 7, all images are rectangular, but having transparency
    parts creates the appearance of transparency.) JPEG images cannot have transparent
    pixels, so they cannot be used, unless the actor happens to be rectangular. For
    backgrounds, this is generally not a problem, because we do not usually use transparency
    in backgrounds.

