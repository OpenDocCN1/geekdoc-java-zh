    not achieve much by itself. It causes the rocket to move according to its movement
    vector, but since we have not initiated any movement, this vector currently has
    length 0, so no movement takes place.


    To change this, let us first introduce a small amount of automatic drift, so that
    the rocket starts off with some initial movement. This makes it more interesting
    to play, because it stops players from being able to remain stationary for a long
