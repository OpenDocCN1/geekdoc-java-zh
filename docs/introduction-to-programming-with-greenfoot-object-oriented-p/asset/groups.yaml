    The second option is to export your scenario to a web page (Figure I11.2). The
    options in the export dialog are as before, but this function creates a web page
    (in HTML format) and converts your scenario to an applet that will run in that
    web page.


    You can execute your scenario by opening the generated web page in a web browser.


