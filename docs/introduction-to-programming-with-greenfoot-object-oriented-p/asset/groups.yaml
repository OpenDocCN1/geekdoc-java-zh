    # 2.4 Dealing with screen edges


    If we look at the method summary, we can see all the methods that the Animal class
    provides. Among them are three methods that are especially interesting to us at
    the moment. They are:


    ```

    boolean atWorldEdge()

    Test if we are close to one of the edges of the world.


    void move()

    Move forward in the current direction.


    void turn(int angle)

    Turn "angle" degrees toward the right (clockwise).

    ```


    Here we see the signatures for three methods, as we first encountered them in
    Chapter 1. Each method signature starts with a return type and is followed by
    the method name and parameter list. Below it, we have a comment describing what
    the method does. We can see that the three method names are atWorldEdge, move,
    and turn.


    The move and turn methods are the ones used in the previous sections. If we look
    at our parameter lists, we can see what we before: move has no parameters (the
    parentheses are empty), and turn expects one parameter of type int (a whole) for
    the angle. (Read Section 1.5 if you are unsure about parameter lists).


    We can also see that the move and turn methods have void as return type. This
    means that neither method returns a value. We are commanding or instructing the
    object to move or turn to. The animal will obey the command but not respond with
    an answer to us.


    The signature for atWorldEdge is a little different. It is


    ```

    boolean atWorldEdge()

    ```


    This method has no parameters (there is nothing in the parentheses), but it specifies
    a return value: boolean. We briefly explained the boolean type in Section 1.4—is
    a type that can hold two possible values: true or false.


    Calling methods that return values (where the return type is not void) is not
    like issuing a command, but asking a question. If we use the atWorldEdge() method,
    the method will respond with either true (Yes!) or false (No!). We can use this
    method to check where we are at the edge of the world.


    +   Concept:

    Calling a method with a void return command.

    Calling a method with a non-void return type asks a question.


