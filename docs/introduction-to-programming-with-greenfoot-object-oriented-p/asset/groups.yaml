    \n我们将在第 7 章回到小行星游戏，到时我们将讨论如何编写这个游戏。\n\n在本章中，我们看到了 Greenfoot 场景可能是什么样的，以及如何与它们交互。我们看到了如何创建对象，以及如何通过调用这些方法与这些对象通信。某些方法是给对象的命令，而另一些方法返回关于对象的信息。参数用于为方法提供额外信息，而返回值则将信息传回给调用者。\n\
    \n对象是从类中创建的，源代码控制着类的定义（并由此控制该类所有对象的行为和特征）。\n\n我们看到可以使用编辑器更改源代码。编辑源代码后，类需要重新编译。\n\
    \n我们将花费书籍的大部分时间讨论如何编写 Java 源代码来创建实现有趣功能的场景。\n\n## 概念总结\n\n- Greenfoot 场景由一组类组成。\n\
