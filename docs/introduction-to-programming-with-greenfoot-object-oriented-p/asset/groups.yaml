    The line looks almost like a method call, except that it uses the keyword instead
    of a method name. Using this call, the constructor executes the other constructor
    (the one with the four parameters), and provides default parameters for all the
    four values. Using this keyword in this way (like a method name) is only possible
    within constructors to call another constructor as part of the initialization.


    There is a second use for this keyword:


    ```

    this.mass = mass;

    ```


    Here we have another example of overloading: The same name is used for two variables
    (parameter and an instance field). When we assign these values, we need to specify
    which of these two variables mass mean on each side of the assignment.


    When we write mass without any qualification, the closest definition of a variable
    with that name is—in this case, the parameter. When we write this.mass, we specify
    that we mean the mass field of the current object. This, line of code assigns
    the parameter named to the field mass.


