- md: "\n## 3.4 Creating new methods\n\n### Code 3.2\n\nFirst version of eating a\
    \ worm\n\n```java\npublic void act() {\n    if ( atWorldEdge()) {\n        turn(17);\n\
    \    }\n\n    if ( Greenfoot.getRandomNumber(100) < 10 ) {\n        turn(Greenfoot.getRandomNumber(90)-45);\n\
    \    }\n    move();\n\n    if ( canSee(Worm.class) ) {\n        eat(Worm.class);\n\
    \    }\n}\n```\n\n### Advanced note: Packages\n\n(The notes labeled \"Advanced\
    \ note\" are inserted for deeper information for readers really interested in\
    \ the details. They are not crucial to understand at this stage, and could safely\
    \ be skipped.)\n\nIn the definition of the canSee and eat methods, we have seen\
    \ a parameter type with the java.lang.Class. What is going on here?\n\nMany types\
    \ are defined by classes. Many of those classes are in the Standard class library.\
    \ You can see the documentation of the Java class library by choosing Java Library\
    \ Documentation from Greenfoot's Help menu.\n\nThe Java class library contains\
    \ thousands of classes. To make these easier to work with, they have been grouped\
    \ into packages (logically related groups of classes). When a class names dots,\
    \ as java.lang.Class, only the last part is the name of the class itself, and\
    \ the former parts form the name of the package. So here we are looking at the\
    \ class named \"Class\" from the package \"java.lang\".\n\nTry to find that class\
    \ in the Java library documentation.\n\n## Creating new methods\n\nIn the few\
    \ sections, we have added new behavior to the crab—turning at the edge of the\
    \ world, occasional random turns, and eating worms. If we continue to do this\
    \ in the way we have done so far, the act will become longer and longer, and eventually\
    \ really hard to understand. We can improve this by chopping it up into smaller\
    \ pieces.\n\n## Chapter 3 Improving the Crab—more sophisticated programming\n\n\
    ### Concept:\n\nA method definition defines a new action for objects of this class.\
    \ The action is not immediately executed, but the method can be called with a\
    \ method name to execute it.\n\nWe can create our additional methods in the Crab\
    \ class for our purposes. For example, instead of just writing code that looks\
    \ for a worm and eats it into the act method, we can add a new method for this\
    \ purpose. To do this, we first have to decide on a name for this method. Let\
    \ us say we call lookForWorm. We can then create a new method by adding the following\
    \ code:\n\n```java\n/*\n * Check whether we have stumbled upon a worm.\n * If\
    \ we have, eat it. If not, do nothing.\n */\npublic void lookForWorm() {\n\tif\
    \ (canSee(Worm.class)) {\n\t\teat(Worm.class);\n\t}\n}\n```\n\n### Concept:\n\n\
    Comments are written into the source code as explanations for human readers. They\
    \ are ignored by the computer.\n\nThe first four lines are a comment. A comment\
    \ is ignored by the computer—it is written for human readers. We need a comment\
    \ to explain to other human readers what the purpose of this method is.\n\nWhen\
    \ we define this method, the code does not immediately execute. In fact by just\
    \ defining this method, it does not get executed at all. We are just defining\
    \ a new possible action (“looking for a worm”) that can be carried out later.\
    \ It will only be carried out when this method is called. We can add a call to\
    \ this method inside the act method:\n\n```java\nlookForWorm();\n```\n\nNote that\
    \ the call has the parentheses for the (empty) parameter list. The complete source\
    \ code after this restructuring is in Code 3.3.\n\n### Code 3.3\n\nSplitting code\
    \ into separate methods\n\n```java\npublic void act() {\n\tif (atWorldEdge())\
    \ {\n\t\tturn(17);\n\t}\n\tif (Greenfoot.getRandomNumber(100) < 10 ) {\n\t\tturn(5);\n\
    \t}\n\tmove();\n\tlookForWorm();\n}\n```\n\n## 3.4 Creating new methods\n\n###\
    \ Code 3.3 continued\n\nSplitting code into separate methods\n\n```java\n/**\n\
    \ * Check whether we have stumbled upon a worm.\n * If we have, eat it. If not,\
    \ do nothing.\n */\npublic void lookForWorm() {\n    if (canSee(Worm.class)) {\n\
    \        eat(Worm.class);\n    }\n}\n```\n\nNote that this code change does not\
    \ change the behavior of our crab at all. It just makes the code easier to read\
    \ in the long run. As we add more code to the class, methods tend to become longer\
    \ and longer. Longer methods are harder to understand. By separating our code\
    \ into a number of shorter methods, we make the code easier to read.\n\n**Exercise\
    \ 3.8** Create another new method named randomTurn (this method has no parameters\
    \ and returns nothing). Select the code that does the random turning, and move\
    \ it from the act method to the randomTurn method. Then call it from your act\
    \ method. Make sure to write a comment for this method.\n\n**Exercise 3.9** Create\
    \ another method named turnEdge (it also has no parameters and returns nothing).\
    \ Move the code that checks whether we are at the edge of the world into the turnEdge\
    \ method. Call turnEdge method from your act method. Your act method should now\
    \ look like Code 3.4.\n\n### Code 3.4\n\nThe new act method after creating methods\
    \ for subtasks\n\n```java\npublic void act() {\n    turnEdge();\n    randomTurn();\n\
    \    move();\n    lookForWorm();\n}\n```\n\nBy convention, method names in Java\
    \ always start with a lowercase letter. Method names cannot contain spaces (or\
    \ other punctuation characters). If the method name consists of multiple words,\
    \ we use capitals in the middle of the name to mark the start of each word.\n\n\
    ## Adding a Lobster\n\nWe are now at a stage where we have a crab that walks more\
    \ or less randomly through our world and eats if it happens to run into them.\
    \ To make it a little more interesting, let us add another creature: a lobster.\
    \ Lobsters in our scenario chase crabs.\n\n- **Exercise 3.10** Add a new class\
    \ to your scenario. The class should be a subclass of Animal (with a capital 'L'),\
    \ and it should use the prepared image lobster.png.\n- **Exercise 3.11** What\
    \ do you expect lobsters to do when you place them into the world? Compile your\
    \ scenario and try it out. We want to program our new lobsters to eat crabs. This\
    \ is quite easy to do since the behavior is similar to crabs. The only difference\
    \ is that lobsters look for crabs while crabs look for lobsters.\n- **Exercise\
    \ 3.12** Copy the complete act method from the Crab class into the Lobster class.\
    \ Also copy the complete lookForWorm, turnEdge, and randomTurn methods.\n- **Exercise\
    \ 3.13** Change the Lobster code so that it looks for crabs rather than worms.\
    \ You can do that by changing every occurrence of \"Worm\" in the scenario to\
    \ \"Crab\". For instance, where Worm.class is mentioned, change to Crab.class.\
    \ Also change the name lookForWorm to lookForCrab. Make sure to update your comments.\n\
    - **Exercise 3.14** Place a crab, three lobsters, and many worms into the world.\
    \ Run the scenario. Does the crab manage to eat all worms before it is caught\
    \ by a lobster? You should now have a version of your scenario where both crabs\
    \ and lobsters walk randomly, looking for worms and crabs, respectively. Now let\
    \ us turn this program into a game.\n\n## Keyboard control\n\nTo get game-like\
    \ behavior we need to get a player involved. The player (you!) should be able\
    \ to control the crab with the keyboard, while the lobsters continue to run randomly\
    \ by themselves, as they already do.\n\nThe world environment has a method that\
    \ lets us check whether a key on the keyboard has been pressed. It is called isKeyDown,\
    \ and like the getRandomNumber method that we encountered in section 3.1, it is\
    \ in the Greenfoot class. The method signature is:\n\n```java\nstatic boolean\
    \ isKeyDown(String key)\n```\n\nWe can see that the method is static (it is a\
    \ class method) and the return type is boolean. This means that the method returns\
    \ either true or false and can be used as a condition in an if-statement.\n\n\
    ## 3.6 Keyboard control\n\nWe also see that the method expects a parameter of\
    \ type String. A String is a piece of text (such as a word or a sentence), written\
    \ in double quotes. The following are examples of Strings:\n\n- \"This is a String\"\
    \n- \"name\"\n- \"A\"\n\nIn this case, the String expected is the name of the\
    \ key that we want to test. For those keys that produce visible characters, their\
    \ character is their name; for example the A-key is called \"A\". Other keys have\
    \ names too. For instance the left cursor is called \"left\". Thus, if we want\
    \ to test whether the left cursor is pressed, we can write:\n\n```java\nif (Greenfoot.getKey(\"\
    left\")) {\n    // do something\n}\n```\n\nNote we need to write \"Greenfoot.\"\
    \ in front of the call keyDown, since this method is defined in the Greenfoot\
    \ class.\n\nIf we want our crab to turn left by 4 degrees whenever the left cursor\
    \ is being pressed, we can write:\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_53_0.png)\n\
    \n```java\nif (Greenfoot.getKey(\"left\")) {\n    turn(-4);\n}\n```\n\nThe idea\
    \ now is to remove the code from the crab that does the random turning and also\
    \ the code that turns automatically at the world edge and replace it with the\
    \ code that lets us control the crab's turn with our keyboard.\n\n| Exercise 3.15\
    \ | Remove the random turning code from the crab. |\n| Exercise 3.16 | Remove\
    \ the code from the crab that does the turn at the edge of the world. |\n| Exercise\
    \ 3.17 | Add code into the crab's act method that makes the crab left whenever\
    \ the left cursor is pressed. |\n| Exercise 3.18 | Add another bit of code to\
    \ the crab's act method that makes the crab turn right whenever the right cursor\
    \ is pressed. |\n| Exercise 3.19 | If you have not done so in the first place,\
    \ make sure that the code checks the key-presses and the turning is not directly\
    \ in the act method, but is instead in a separate method, called checkKeyPress.\
    \ This method should be called from the act method. |\n\nTry solving the tasks\
    \ by yourself. If you get stuck, have a look on the next page. Code 3.5 shows\
    \ the crab's complete act and checkKeyPress methods after this change. This version\
    \ includes all the changes we have discussed so far.\n"
