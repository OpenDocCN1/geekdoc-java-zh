    # 调查：里面有什么？


    功能中的重要部分仍然缺失，在本章中我们的任务就是实现它们。


    我们将通过这个例子来回顾移动和碰撞检测。在 Java 编程概念方面，我们将借此更多地练习循环和集合。


    我们应该通过检查现有的代码库开始这个项目。在书籍场景的 `chapter07` 文件夹中，我们有一个部分实现的解决方案，名为 `asteroids-1`。（请确保使用
    chapter07 的版本，而不是来自 chapter01 的副本。）


    - **练习 7.1** 打开书籍项目 `chapter0` 文件夹下的 `asteroids-7` 场景。实验它以找出它能做什么，以及不能做什么。

    - **练习 7.2** 写出一份应该添加到此项目中的事项列表。

    - **练习 7.3** 使用哪个键盘按键发射子弹？

    - **练习 7.4** 在运行的场景中放置一个爆炸效果（通过交互式地创建 `Explosion` 类的对象）。它有效吗？它是做什么的？

    - **练习 7.5** 在场景中放置一个质子波。这有效吗？它是做什么的？


    在实验当前场景时，你可能会注意到一些基础功能是缺失的：


    - 火箭不会移动。它不能转向，也不能向前移动。

    - 当小行星与火箭碰撞时，什么都没有发生。它会穿过火箭，而不是损坏火箭。

    - 结果是，你无法失败。游戏永远不会结束，也不会显示最终得分。

    - 我们在图中看到的 `ScoreBoard`、`Explosion` 和 `ProtonWave` 类似乎没有出现在场景中。


    我们可以做的是向小行星发射子弹。（如果你还没有发现如何做，请试一试。）小行星被子弹击中时会破碎，或者如果它们足够小，就会消失。


    这个游戏的目标显然是清除屏幕上的小行星，同时我们的火箭不被击中。为了让游戏更有趣，我们还想添加另一种武器——质子波。我们希望在游戏期间保持高分。为了做到，我们有大量工作要做。


    - 我们必须实现火箭的移动。目前，它可以发射子弹，但其他不能。我们需要能够向前移动和转向。

    - 我们必须确保在击中小行星时火箭会爆炸。


    # 7.2 绘制星星


    - 当火箭爆炸时，我们希望放出一个显示最终得分的计分板。


    - 我们希望能够释放质子波。质子波将从火箭周围很小开始逐渐扩大，在击中小行星时将其摧毁。


    在进入这些函数之前，我们先从另一个微小的外观改进开始：在我们的宇宙中绘制星星。


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_119_0.png)


    # 绘制星星


    在所有之前的场景中，我们使用固定图像作为世界的背景。该图像存储在文件系统中的图像文件中。


    在这个场景中，我们想引入一种不同的技术来制作背景图像：动态绘制。


    小行星场景没有使用图像文件作为背景。没有背景图像的世界将默认创建一个填充了白色漆的背景图像。


