    # 50 Chapter 4 Finishing the crab game


    On the left of the equals symbol is the name of the variable we want to store
    into, on the right is the thing that we want to store. Since the equals symbol
    stands for assignment, it is called the assignment symbol. We usually read it
    as “becomes”, like this: “variable becomes expression".


    Concept:

    An assignment statement assigns an object or a value to a variable.


    In our example, we write


    ```

    image1 = new GreenfootImage("crab.png");

    image2 = new GreenfootImage("crab2.png");

    ```


    These two lines of code will create the two images we wish to use and store into
    our two variables image1 and image2. Following these statements, we have three
    objects (one crab and two images), and the crab’s variables contain references
    to the images. This is shown in Figure 4.4.


    Figure 4.4

    A crab object with two variables, point-ing to image objects


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_66_0.png)


    Concept:

    When an object is assigned to a variable, the variable contains a reference to
    that object.


    The next question regarding the creation of these images is where to put the code
    that creates the images and stores them into the variables. Since this should
    be done once when the crab object is created, and not every time we act, we cannot
    put it into the act method. Instead, we put this code into a constructor.


    # Using actor constructors


    At the beginning of this chapter, we have seen how to use the constructor of the
    world class to initialize the actor. In a similar manner, we can use the constructor
    of an actor to initialize the actor. The code in the constructor is executed once
    when the actor is created. Code 4.3 shows a constructor for the Crab class that
    initializes the two instance variables by creating images and assigning them to
    the variables.'
