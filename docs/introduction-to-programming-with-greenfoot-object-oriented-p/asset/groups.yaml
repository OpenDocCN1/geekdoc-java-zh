    # Platform jumper


    A demo of a partial implementation of an ever-popular genre of games: platform
    jumpers.


    # Wave


    This scenario is a simple demonstration of a physical effect: the propagation
    of a wave on a string.


    # Preface


    Greenfoot is a programming environment that can be used by individuals, in schools
    or in introductory university courses to learn and teach the principles of programming.
    It is flexible enough to be suitable for teenagers as well as older students.


    Greenfoot supports the Java Programming Language, so students learn standard object-oriented
    programming in Java. The environment is designed to convey object-oriented concepts
    and principles in a clean, easily accessible manner.


    The Greenfoot environment makes creation of graphics and interaction easy. Students
    can concentrate on modifying the animation logic, and engage and interact with
    objects. Developing simulations and interactive games becomes easy, and feedback
    is immediate.


    The environment is designed to quickly engage students who may have no prior interest
    or experience in programming. Achieving simple animation results is quick, sophisticated,
    professional looking scenarios are possible.


    # Accessing Supplementary Materials


    The learning aids and supplementary materials that are noted in the book can be
    accessed through the Greenfoot Web site or through the publisher''s Web site:


    **Companion Website:** http://www.greenfoot.org/book/

    **Publisher''s Website:** http://www.prenhall.com/kolling


    # Supplementary Materials Available for Students


    The following supplements are available for students:


    - The Greenfoot software

    - The scenarios discussed in this book

    - The Greenfoot Gallery—a scenario showcase

    - Tutorial videos

    - A discussion forum

    - Technical support


    # Supplementary Materials Available for Instructors


    The following supplements are available for instructors:


    - A teacher discussion forum

    - Additional exercises related to the book

    - The “Green Room” containing worksheets and other teaching resources


    For more details about Greenfoot and this book, please see the Introduction following
    the Acknowledgments.


    # Acknowledgments


    This book is the result of more than five years of work by a group of people.
    First and foremost involved are the people who contributed to the development
    of the Greenfoot environment, which makes this entire educational approach possible.
    Poul Henriksen started the implementation of Greenfoot with his Masters project
    and built the first prototype. He also worked the development of this prototype
    into a production system. For the first year or so, we were a two-man project,
    and Poul''s work led to the quality and robustness of the current system.


    Bruce Craig and Davin McCall were the next developers to join the project, and
    Poul, Bruce, and Davin jointly built most of Greenfoot as it is today. All three
    were exceptional software developers, and their contribution to the project cannot
    be overstated. It is a joy working with


    Eventually, the "Blue Group" got involved in the Greenfoot project, including
    John Rosenberg and Ian Utting, and this book builds on contributions and joint
    work of all members.


    Colleagues in the Laboratory at the University of Kent also helped me a great
    deal, especially our Head of Department, Simon Thompson, who saw the value of
    Greenfoot early on and supported and encouraged its further development.


    Another important contribution, which without the development of Greenfoot (ultimately,
    this book) would not have been possible, is the generous support of Sun Microsystems.
    El Sarpa, Katherine Hartley, Jessica Orquina, Sarah Hammond, and many others within
    Sun believed in the value of our system and provided important support.


    Everyone at Pearson Education worked hard to get this book published, with a very
    tight schedule, and in sometimes difficult circumstances. Tracy Dunkberger worked
    with us from the beginning. She managed well to stay positive and encouraged me
    to continue writing, putting up with my repeated deadlines, and Melinda Henrietta
    did a lot of different things, managing the reviews.


    A special thank you to the reviewers of this book, who have provided very detailed,
    thoughtful, and useful feedback. They are Carolyn Oates, Danielle Persson, Detlef
    Rik, Gunnar Johnannesmeyer, Josh Fishburn, Mark Hayes, Marla Parker, Matt Jadudd,
    Todd O''Brien, Lael Grant, Jason Green, Mark Lewis, Rodney Hoffman, Michael Kadri,
    Michael Casper.


    # Introduction


    Welcome to Greenfoot! In this book, we will discuss how to program computers,
    such as simulations and games, using the Java Programming Language and the Greenfoot
    environment.


    There are several goals in doing this: One is to learn programming, another is
    to have fun along the way. While the examples we discuss in this book are specific
    to the Greenfoot environment, the concepts are general: working through this book
    will teach you general principles.


    This book is very practically oriented. Chapters and exercises are structured
    around real, hands-on development tasks. First, there is a problem that we need
    to solve, then we look at language constructs and strategies that help us solve
    the problem. This is quite different from many programming textbooks which are
    often structured around language constructs.


    A more practical approach does not mean that the book does cover the necessary
    theory and principles as well. It''s just that the order is changed. Instead of
    introducing a concept theoretically, and then doing some exercises with it at
    hand, we jump right in and use a construct, then come back to the theoretical
    background later. We typically follow a spiral approach: We introduce aspects
    of a concept when we encounter it, then revisit it in another context, and gradually
    deepen our understanding.


    The emphasis throughout is to make the work interesting, relevant, and enjoyable.
    There is no reason why computer programming has to be dry, formal, or boring.
    Having fun along the way is okay. With this we can make the experience interesting
    and pedagogically sound at the same time. This is an approach that has been called
    serious fun—we do so making interesting, and learn something useful along the
    way.


    This book can be used both as a self-study book and as a textbook in a programming
    course. Exercises are worked throughout the book—if you do them all, you will
    come out of this a fairly competent programmer.

