    \ do not behave very intelligently. They head out in a random direction from the\
    \ ship, but when they reach the edge of the water, they will just stay there,\
    \ because they cannot go forward.\n\nYour task will be to program the Greeps to\
    \ use some more intelligent strategy, so that they find the tomatoes and bring\
