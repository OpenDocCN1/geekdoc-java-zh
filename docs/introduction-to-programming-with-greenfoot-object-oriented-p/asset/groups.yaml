    ## 9.2 蚂蚁


    蚂蚁场景模拟了蚂蚁群采集食物的行为。或者更准确地说，我们希望它能模拟这种行为，但它目前并没有这样做。我们将开发它来实现这一功能。在目前状态下，该场景已经在某种程度上准备就绪：图形已经存在，部分实现已经完成。然而，主要功能仍然缺失，我们将着手完成它的工作。


    - **练习 9.8** 从书中书中场景的第 09 文件夹中打开名为 *ants* 的场景。在世界中创建一个蚁穴并运行场景。你观察到了什么？


    - **练习 9.9** 检查 **Ant** 类的源代码。它目前在做什么？


    - **练习 9.10** *Ant* 是 *Creature* 类的子类。该生物具有哪些功能？


    **图 9.2**

    蚂蚁模拟


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_161_0.png)


    练习 9.11 检查 AntHill 类的源代码。这个类是做什么的？一个蚁穴里有多少只蚂蚁？


    我们首先注意到的是蚂蚁不会移动。它们在蚁穴的中间被创建，由于它们不会移动，过了一会儿它们都会堆叠在那里。我们的首要任务是让蚂蚁移动起来。


    练习 9.12 在蚂蚁的 `act` 方法中，添加一行代码让蚂蚁移动。查阅 `Creature` 类的文档以找到可以使用的方法。


    现在，我们将逐步对该场景进行一系列改进。我们将采取的步骤如下：


    - 我们将在场景中引入食物，以便蚂蚁有东西可以收集采集。

    - 我们将改进蚂蚁，让它们能够找到食物并带回巢。

    - 接下来，我们将添加一个信息素（Pheromone）类。信息素是某些动物产生的化学物质，用于向同种的其他动物留下信息。

    - 我们将改进蚂蚁以利用信息素：当它们找到食物时，会在地面上留下信息素滴，其他蚂蚁随后就可以闻到信息素并调整它们的去向。


    这些步骤共同模拟了蚂蚁群采集食物的行为。完成后，我们可以对该模拟进行一些实验。


    ## 采集食物


    我们的第一个任务是在场景中创建食物，并让蚂蚁收集它们并带回蚁穴。


    练习 9.13 创建一个名为 `Food` 的新类。该类不需要固定的图像。我们将从类内部绘制图像。


    `Food` 类的每个对象代表一堆食物屑。我们的计划是为 `Food` 对象创建一个新的、动态绘制的图像，并为堆中的每一粒屑画一个小圆点。一堆屑可能从（例如）100
    粒屑开始，当每只蚂蚁找到这堆屑时，它就会带走几粒。这意味着每当有蚂蚁拿走一些食物时，必须重新绘制碎屑更少的图像。


    练习 9.14 在 `Food` 类中，创建一个字段用于存储堆中目前的碎屑数量。将其初始化为 100。


    ### 练习 9.15 创建一个名为 `updateImage` 的新私有方法，它创建一个固定大小的图像，并为目前堆中的每一粒屑在随机位置画一个点。为堆选择一个你认为好看的大小。在构造函数中调用此方法。


    如果你完成了上面的练习，并在 `Food` 图像内的随机位置放置了食物屑（使用 `Greenfoot.getRandomNumber` 获取坐标），你会发现碎屑堆呈正方形（图
    9.3a）。这是因为图像本身是正方形的，而且碎屑均匀地分布在图像上。


    如果我们想让它看起来更像一堆（大部分屑集中在中间，其他屑在周围呈粗略的圆形，图 9.3b），我们随后可以使用另一个数字方法以不同的方式放置碎屑。我们将在练习
    9.16 和 9.17 中完成。注意，这些是更高级的练习，且纯属视觉效果：它们仅仅改变了食物堆的外观，而不是任何功能，可以安全地跳过。


    ### 练习 9.16 查阅标准 Java 类库的 API 文档。找到 java.util 包中 `Random` 类的文档。该类的对象是随机数生成器，比
    Greenfoot 的 `getRandomNumber` 方法更灵活。我们感兴趣的方法是返回高斯分布（也称为“正态分布”）数字的方法。该方法的名字是什么？它是做什么的？


    ### 练习 9.17 在你的 `Food` 类中，更改在图像中放置食物屑的方式，以利用随机数的高斯分布。为了实现这一点，你需要使用 `java.util.Random`
    对象来创建随机数，而不是 `Greenfoot.getRandomNumber`。


    图 9.3

    使用不同随机化算法放置食物屑的情况


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_163_0.png)

    ![](img/9d90a1ac20b9439aba2e593bea21f58a_163_1.png)


    # 148 第9章 模拟


    ### 旁注：随机分布


    如果在程序中需要随机行为，有时考虑我们需要哪种随机分布是很重要的。许多随机函数，例如 `Greenfoot.getRandomNumber` 方法，产生的是均匀分布（在这种情况下，每个可能的结果概率是相同的）。高斯随机数提供了正态分布（在这种情况下，平均结果更容易出现，极端情况较少）。如果我们例如编写一个骰子游戏，我们需要均匀分布（每个骰面出现的概率相等）。相反，如果我们模拟交通中的车辆，正态分布会更好（大多数车辆行驶在平均速度附近，极少数车辆非常慢或非常快）。


    接下来，我们需要添加从堆中移除屑的功能，以便蚂蚁可以获取食物。


    > 练习 9.18 在 `Food` 类中添加一个公共方法来移除堆中的屑。确保根据碎屑数量重新绘制图像。当屑用光时，`Food` 对象应从世界中移除。交互式测试此方法。


    ## 9.5 添加信息素


    练习 9.19 在 *Ant* 类中实现 `searchFood` 方法。该方法最初执行随机行走并检查我们是否遇到了食物堆。如果我们发现了食物堆，停止执行。（这只是为了测试我们是否检测到了食物。）


    练习 9.20 在发现食物堆时添加拿起食物的功能（而不是停止执行）。我们需要从食物堆中移除一些屑（我们已经有了这个方法），标记我们现在带有食物（我们可能需要一个字段），并更改蚂蚁的图像。场景中已经准备好了一个名为
    `ant-with-food.png` 的图像可以使用。


    练习 9.21 确保蚂蚁在携带食物时向家移动。


    练习 9.22 实现一个检查蚂蚁是否到达家的方法。如果它到达了家，放下食物。放下食物包括标记它不再携带食物（包括改回图像），并调用 *Ant* 的 `countFood`
    方法来记录它收集了这粒食物屑。


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_165_0.png)


    注意代码质量：使用具有明确目的短方法，并确保良好地注释方法。不要把太多代码写在一个方法中。


    ## 设置世界


    在我们向场景添加信息素之前，让我们先添加一些初始化代码，自动我们创建一些蚁穴和食物，这样我们就不需要每次都手动操作。


    练习 9.23 在 `AntWorld` 类中添加代码，使其自动在世界中创建两只蚂蚁和几堆食物。


    ## 添加信息素


    现在我们有了良好的准备，准备好为我们的场景添加信息素。每个信息素对象都是蚂蚁留在地面上的化学物质小滴。这种滴会挥发得很快，然后消失。


    '
