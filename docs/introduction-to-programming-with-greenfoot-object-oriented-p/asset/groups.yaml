    Remember that you also have to add an import statement for the List type.


    These give us a list of all asteroids in the range of the proton wave. We now
    want to do some damage to each asteroid in range.


    The Asteroid class has a method hit that we can use to do this. This method is
    already being used to damage the asteroid when it is hit by a bullet, and we can
