- md: '

    # Introduction


    The projects discussed in this book are easy enough that they can be managed by
    high school students, but they are also open and extendable enough that even seasoned
    programmers find interesting and challenging aspects to do. While Greenfoot is
    an educational environment, Java is not a toy language. Since Java is our language
    of choice for this book, the projects discussed here (and others you may want
    to create in Greenfoot) can be made as complex and challenging as you like.


    While it is possible to create games quickly and easily in Greenfoot, it is equally
    possible to build highly sophisticated simulations of complex systems, possibly
    using artificial intelligence algorithms, agent technology, database connectivity,
    or anything else you can think of. Java is a very rich language that opens the
    whole world of programming, and Greenfoot imposes no restrictions as to which
    aspects of the language you can use.


    In other words, Greenfoot scales well. It allows easy entry for young beginners,
    but experienced programmers can also implement interesting, sophisticated scenarios.


    You are limited only by your imagination.


    # CHAPTER 1

    Getting to know Greenfoot


    | topics: | the Greenfoot interface, interacting with objects, invoking methods,
    running a scenario |

    | concepts: | object, class, method call, parameter, return value |


    This book will show you how to develop computer games and simulations with Greenfoot,
    a development environment. In this chapter, we shall take a look at Greenfoot
    itself, see what it can do and how to use it. We do this by trying out some existing
    programs.


    Once we are comfortable with using Greenfoot, we shall jump right into writing
    a game of ourselves.


    The best way to read this chapter (and indeed the whole book) is by sitting at
    your computer with Greenfoot open on your screen and the book open on your desk.
    We will regularly ask you to do things in Greenfoot while you read. Some of the
    tasks you can skip; you will have to do some in order to progress in the chapter.
    In any case, you will learn most if you follow along and do them.


    At this stage, we assume that you have already installed the Greenfoot software
    and the book scenarios (described in Appendix A). If not, read through that appendix
    first.


    ## 1.1 Getting started


    Start Greenfoot and open the scenario leaves-and-wombats from the Greenfoot book
    folder.


    > Note: If you are starting Greenfoot for the first time, you will see a dialog
    asking what you want to do. Click Choose a scenario. Otherwise, use Scenario–Open
    from the menu.


    ^1 We use this notation to tell you to select functions from the menu. Scenario–Open
    refers to the Open item in the Scenario menu.


    # Chapter 1 Getting to know Greenfoot


    # Figure 1.1


    The Greenfoot main window


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_20_0.png)


    Execution controls


    Make sure to open the leaves-and-wombats scenario that you find in the book-scenarios
    folder, not the somewhat similar wombats scenario from the standard Greenfoot
    installation.


    You will now see the Greenfoot main window, with the scenario open, looking similar
    to Figure 1.1. The main window consists of three main areas and a couple of extra
    buttons. The main areas are:


    - The world. The largest area covering most of the screen (a sand-colored grid
    in this case) is called the world. This is where the program will run and we will
    see things.

    - The class diagram. The area on the right with the beige-colored boxes and arrows
    is the class diagram. We will discuss this in more detail shortly.

    - The execution controls. The Act, Run, and Reset buttons and the speed slider
    at the bottom are the execution controls. We''ll come back to them in a little
    while, too.


    ## 1.2 Objects and classes


    We shall discuss the class diagram first. The class diagram shows us classes involved
    in this scenario. In this case, they are World, WombatWorld, Actor, Leaf, and
    Wombat.


    We will be using the Java programming language for our projects. Java is an object-oriented
    language. The concepts of classes and objects are fundamental in object orientation.


    Let us start by looking at the Wombat class. The Wombat stands for the general
    concept of a wombat—it describes all wombats. Once we have a class in Greenfoot,
    we can create objects with from it. (Objects are also referred to as *instances*
    in programming—the two terms are synonyms.)


    A Wombat, by the way, is an Australian marsupial (Figure 1.2). If you want to
    find out more about them, do a Web search—it should give you plenty of results.


    Right-click² on the Wombat class, and you will see the *class menu* pop up (Figure
    1.3a). The first option in that menu, new Wombat (), lets us create new wombat
    objects. Try it out.


    You will see that this gives you a small picture of a Wombat* object, which you
    can move on screen with your mouse (Figure 1.3b). Place the *wombat* into the
    world by clicking anywhere in the world (Figure 1.3c).


    # Figure 1.2


    A wombat in Narwwntapu National Park, Tasmania³


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_21_0.png)


    # Figure 1.3


    - a) The class menu.

    - b) Dragging the object.

    - c) Placing the object (img/9d90a1ac20b9439aba2e593bea21f58a_21_1)


    ² On Mac, use ctrl instead of right.

    ³ Image source: Wikipedia


    # Chapter 1 Getting to know Greenfoot


