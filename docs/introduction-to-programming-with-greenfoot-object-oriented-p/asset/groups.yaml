    # Introduction


    The projects discussed in this book are easy enough that they can be managed by
    high school students, but they are also open and extendable enough that even seasoned
    programmers find interesting and challenging aspects to do. While Greenfoot is
    an educational environment, Java is not a toy language. Since Java is our language
    of choice for this book, the projects discussed here (and others you may want
    to create in Greenfoot) can be made as complex and challenging as you like.


    While it is possible to create games quickly and easily in Greenfoot, it is equally
    possible to build highly sophisticated simulations of complex systems, possibly
    using artificial intelligence algorithms, agent technology, database connectivity,
    or anything else you can think of. Java is a very rich language that opens the
    whole world of programming, and Greenfoot imposes no restrictions as to which
    aspects of the language you can use.


    In other words, Greenfoot scales well. It allows easy entry for young beginners,
    but experienced programmers can also implement interesting, sophisticated scenarios.


    You are limited only by your imagination.'
