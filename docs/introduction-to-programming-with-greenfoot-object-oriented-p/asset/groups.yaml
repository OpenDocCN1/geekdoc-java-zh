    # 第7章 碰撞检测：小行星游戏


    **主题：**更多关于移动、键盘控制和碰撞检测

    **概念：** 集合（再次）、for 循环、for-each 循环（再次）、类型转换


    在本章中，我们不会引入许多新概念，而是将回顾并加深对过去几个章节中接触过的某些主题的理解。我们将回到一个之前在本书非常开头（非常早的时候）就遇到过的场景：小行星游戏（图
    7.1）。

    我们在这里使用的的小行星游戏版本与我们之前看过的略有不同。它增加了一些功能（例如质子波和计分计数器），但它尚未完全实现。


