    \nFigure 12.2\nA tribe of Greeps using paint drops\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_140_0.png)\n\
    \n## I2.2 Programming your Greeps\n\n- Greeps cannot talk, or communicate verbally\
    \ in any way. They can, however, spit onto the ground. And they can spin in three\
