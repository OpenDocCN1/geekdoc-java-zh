    # Adding a Lobster


    We are now at a stage where we have a crab that walks more or less randomly through
    our world, and eats if it happens to run into them.


    To make it a little more interesting, let us add another creature: a lobster.


    Lobsters, in our scenario, let to chase crabs.


    +   **Exercise 3.10** Add a new class to your scenario. The class should be a
    subclass of **Animal** (with a capital ''L''), and it should use the prepared
    image *lobster.png*.


    +   **Exercise 3.11** What do you expect lobsters to do when you place them into
    the world as they are? Compile your scenario and try it out.


    We want to program our new lobsters to eat crabs. This is quite easy to do, since
    the behavior is similar to the behavior of crabs. The only difference is that
    lobsters look for crabs, while crabs look for lobsters.


    +   **Exercise 3.12** Copy the complete *act* method from the *Crab* class into
    the *Lobster* class. Also copy the complete *lookForWorm*, *turnEdge*, and *randomTurn*
    methods.


    +   **Exercise 3.13** Change the *Lobster* code so that it looks for crabs, rather
    than worms. You can do that by changing every occurrence of “Worm” in the scenario
    to code "Crab”. For instance, where *Worm* **class** is mentioned, change to *Crab.class*.
    Also change the name **lookForWorm** to **lookForCrab**. Make sure to update your
    comments.


    +   **Exercise 3.14** Place a crab, three lobsters, and many worms into the world.
    Run the scenario. Does the crab manage to eat all worms before it is caught by
    a lobster?


    You should now have a version of your scenario where both crabs and lobsters walk
    randomly, looking for worms and crabs, respectively.


    Now, let us turn this program into a game.


    # Keyboard control


    To get game-like behavior, we need to get a player involved. The player (you!)
    should be able to control the crab with the keyboard, while the lobsters continue
    to run randomly by themselves, as they already do.


    Thefield environment has a method that lets us check whether a key on the keyboard
    has been pressed. It is called *isKeyDown*, and, like the *getRandomNumber* method
    that we encountered in section 3.1, it is in the *Greenfoot* class. The method
    signature is


    ```

    static boolean isKeyDown(String key)

    ```


    We can see that the method is static (it is a class method) and the return type
    is boolean. This means that the method returns either true or false, and can be
    used as a condition in an if-statement.'
