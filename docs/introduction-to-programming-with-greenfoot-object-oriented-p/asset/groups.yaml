    Method:


    ```

    List getObjectsInRange(int r, Class cls)

    Return all objects within range ''r'' around this object.

    ```


    This method returns all objects within a given range. An object is in range if
    its location is a cell whose center point is at distance r or less from the calling
    actor (Figure C.5). The range r is measured in cells.


