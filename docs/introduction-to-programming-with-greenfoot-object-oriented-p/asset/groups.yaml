    ## 结合图像与动态绘制


    一些最有趣的视觉效果是通过将静态图像与程序进行的动态更改相结合的。例如，我们可以从一个静态图像开始，然后在上面绘制不同的颜色，或者将其放大或缩小，或者通过改变其透明度让它逐渐消失。


    为了尝试这一点，我们将创建一个烟雾效果。在下一个场景中，我们让一个球穿过屏幕，留下一道烟雾（见图 8.3）。


    - 33 创建名为 smoke 的新场景。为它制作一个好看且中性的背景。


    - 34 创建一个以恒定速度穿过屏幕的球。当它撞击屏幕边缘时，它会弹回来。（屏幕实际上是一个盒子，球在里面弹跳。）


    # 图 8.3 烟雾尾效果


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_154_0.png)


    现在我们将处理烟雾效果。首先，创建一个显示烟雾团的图像（图 8.4）。


    # 图 8.4 一团烟雾的图像


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_154_1.png)


    注意，棋格背景不是图像的一部分——它仅用于演示烟雾图像是透明的（我们可以看到它后面的背景）。


    你的烟雾不需要是绿色——你可以让它是任何颜色——但它应该是透明的。你可以通过图形程序来实现这一点。如果你在制作图像时遇到困难，可以使用 chapter08
    中的准备好的 smoke.png。


    - 练习 35 按照上述描述创建烟雾图像。


    - 练习 36 在你的场景中创建一个 Smoke 类。当插入世界时，Smoke 演员应该很快消失。也就是说，在每个动作周期中，演员的图像应该变得更小更透明。当它们完全透明或非常透明时，应该将它们从世界移除。


    - 练习 37 修改你的球，使其在移动时留下烟雾。每次移动都产生烟雾可能太多了：在球移动的每秒创建一个烟雾。测试。


    - 练习 38 修改你的烟雾，使其不再总是以完全相同的速率消失。让消失速率具有随机性，使得某些烟雾消失得比其他的快。


    如果你完成了所有的练习，那么你现在应该有一个好看的烟雾效果。如果你在这些练习中遇到困难，或者如果你想将你的解决方案与我们的进行比较，可以查看项目中的 smoke
    场景。它实现了这里描述的任务。


    # 总结


    制作声音和图像是制作良好的游戏、模拟和其他图形应用程序的一种非常有价值的技能。了解声音和图像格式对于在尺寸和质量之间做出良好的选择非常重要。


    声音可以使用各种录音程序录制和编辑，各种参数决定了音质和文件大小。对于 Green 场景，我们通常使用质量较低的 WAV 格式。


    图像也可以以各种不同的格式保存。不同格式在压缩文件方面、保持图像质量方面以及处理透明度方面有所不同。JPEG 和 PNG 是 Greenfoot 最常用的格式。


    通过将文件图像与动态图像操作（如缩放和透明度更改）相结合，我们可以在场景中实现吸引人的视觉效果。


    # 概念总结


    + - 声音可以用各种格式和编码保存。并不是所有程序都播放所有声音格式。

    - 采样格式、采样率和立体/单声道设置决定了录音的大小。


