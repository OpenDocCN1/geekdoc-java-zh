    Declaration of constants


    ```

    private static final double GRAVITY = 5.8; private static final Color defaultColor
    = new Color(255, 216, 0);

    ```


    These two declarations look similar to field declarations, except that they have
    the two keywords static final inserted after the keyword private.'
