    # 9.6 Path forming


    One aspect of this scenario is that there is no code anywhere in the project that
    takes about forming paths. The behavior of the individual ants is simple (“if
    you have food, if you smell pheromones, otherwise go anywhere”). However, the
    ants display some fairly sophisticated behavior: They form stable paths, refreshing
    the pheromones as they evaporate, and efficiently transport food back to their
    ant.


    This is known as emergent behavior. It is behavior that is not programmed into
    any individual actor, but system behavior emerges from the interactions of many
    ( fairly similar) actors.


    Most complex systems display some of emergent system behavior, whether they are
    traffic systems in cities, networks of computers, or crowds of people. Predicting
    these effects can be difficult, and simulations can help in understanding such
    systems.


    +   Exercise 9.32 How realistic is our simulation of the use of pheromones by
    ants? Do some research into the actual use of pheromones by ant colonies and write
    down which aspects of our simulation are realistic, and where we have made simplifications.


    +   Exercise 9.33 Assume pollution has introduced a toxic substance in the ants''
    environment. The effect is that their production of pheromones is reduced to a
    quarter of the previous amount. (The time between drops of pheromones is four
    times as long.) Will they still be able to form paths? Test.


    +   Exercise 9.34 Assume another pollutant has decreased the ants'' ability to
    remember that they recently smelled a pheromone to a thread. Instead of 30 steps,
    they can only remember the pheromone for 10 steps. What is the effect of this
    on their behavior?


    There are many more experiments you can do. The most obvious is to try different
    placements of ant hills and food sources, and different values for the attributes
    that determine the ants'' behavior.


