    background.setColor(Color.BLACK);

    background.fill();

    ```


    > 提示：如果你想临时移除某些代码，“注释掉”它们比删除它们更容易。Greenfoot 编辑器有一个功能可以做到此。只需选择相关行，然后从“编辑”菜单中按“注释”（F8）或“取消注释”（F7）。


