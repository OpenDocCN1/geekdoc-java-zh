    # 6.10 Trying it out


    **Exercise 6.21** Look up the class **Math** in the Java documentation. How many
    parameters does the **sqrt** method have? What types are they? What type does
    this method return?


    **Exercise 6.22** in the *Math* class, find the method that can be used to find
    the maximum of two integers. What is it called?


    The next line in our code calculates the strength of the force using Newton''s
    formula of gravitation given above.


    The final thing is to calculate the acceleration, the actual movement change to
    our object is not only determined by the force of gravity, but also the mass of
    our object: the heavier the object, the slower it will accelerate. Acceleration
    is computed using the following formula:


    ```

    acceleration = \frac{force}{mass}

    ```


    Once we have calculated the acceleration, we can set our force vector to the correct
    length and add this vector to the movement of our body. Doing this is easy, using
    the `addForce` method that is provided by the `SmoothMover` class.


    **Exercise 6.23** Map the variables in Code 6.7 to Newton''s formula, the Pythagoras
    theorem, and the acceleration formula given above. Which variable corresponds
    to which part of which formula?


    With this, our task is completed. (An implementation of the code so far is available
    in the book scenarios as *Newtons-Lab-2*.)

    This task clearly involved more background knowledge in math and physics than
    the others we have seen. If this is not your favorite area, don''t worry, we shall
    return to less mathematical projects shortly. Remember: programming can do anything
    you like. You can make it very mathematical, and you can also make it very creative
    and artistic.


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_111_0.png)


