    # 本书中讨论的场景列表


    叶子与袋鼠（第 1 章）

    这是一个简单的示例，展示了袋鼠在屏幕上移动并偶尔吃叶子。该场景除了说明一些面向对象的概念和 Greenfoot 交互之外没有其他目的。


