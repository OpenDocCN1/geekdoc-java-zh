    \ these exercises, we shall not use partly implemented scenario but create a new\
    \ one from scratch.\n\n**Exercise 8.1** As a preparation for the exercises, create\
    \ a new scenario. You can call it anything. You will see that the new scenario\
    \ automatically includes World and Actor subclasses.\n\n**Exercise 8.2** Create\
    \ a subclass of World. Call it MyWorld. You can give it any background image you\
