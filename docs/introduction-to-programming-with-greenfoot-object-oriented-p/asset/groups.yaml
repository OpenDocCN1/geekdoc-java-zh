    ### 高级笔记：包\n\n（标记为“高级笔记”的注释是为了对细节真正感兴趣的读者提供更深入的信息。这些内容对于理解当前阶段的内容并不重要，可以安全地跳过。）\n\
    \n在 `canSee` 和 `eat` 方法的定义中，我们看到了一个类型为 `java.lang.Class` 的参数类型。这里发生了什么呢？\n\n许多类型都是通过类定义的。其中许多类位于标准类库中。你可以通过\
    \ Greenfoot 的 Help（帮助）菜单选择 Java Library Documentation（Java 类库文档）来查看 Java 类库的文档。\n\
