    # 引言


    本书中讨论的项目足够简单，足以让高中生进行管理，但它们也足够开放和可扩展，使得即使是经验丰富的程序员也能发现其中有趣且具有挑战性的方面。虽然 Greenfoot
    是一个教育环境，但 Java 并不是一种玩具语言。由于 Java 是我们本书选择的语言，这里讨论的项目（以及你可能想在 Greenfoot 中创建的其他项目）可以根据你的意愿变得复杂且具有挑战性。


    虽然在 Greenfoot 中可以快速简单地创建游戏，但同样也可以构建复杂系统的高级仿真，可能还会使用人工智能算法、代理技术、数据库连接或你所想到的任何东西。Java
    是一门非常丰富的语言，它开启了整个编程世界，而 Greenfoot 对你可以使用该语言的哪些方面没有任何限制。


