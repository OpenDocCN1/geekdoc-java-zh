  mdcn: "\n\n# 第 7 章 碰撞检测：小行星\n\n附录 C 总结了不同的碰撞检测方法及其功能。现在是一个快速浏览一遍的内容的好时机。在某个阶段，你应该熟悉所有的碰撞检测方法。\n\
    \n对于我们的目的，`getIntersectingObjects` 似乎是一个很好的选择。如果两个对象的图像中任何像素发生相交，则认为它们是相交的。这正是我们需要的。\n\
    \n这里有一个小问题：执行者（actor）图像中的透明像素。\n\nGreenfoot 中的图像始终是矩形。当我们看到非矩形的图像时（例如火箭），是因为图像中的某些像素是透明的（不可见的）；它们不包含任何颜色。对于我们的程序来说，它们仍然是图像的一部分。\n\
    \n图 7.2 显示了带有边界框（bounding boxes）的火箭和小行星。边界框是实际图像的边缘。（火箭的图像比使其尺寸与第二张火箭图像 `rocketWithThrust`\
    \ 相同的稍微大一点，后者在空白区域显示了火焰）\n\n在图 7.2 中，尽管它们的可见部分没有接触，但图像是相交的。碰撞检测方法会报告此为相交。它们作用于边界框，而忽略图像的非透明部分。\n\
    \n结果是，我们的火箭与小行星发生了“接触”，尽管在屏幕上，它们之间似乎还有一小段距离。\n\n对于我们的小行星，我们选择忽略这一点。首先，这个距离很小，所以玩家通常不会注意到。其次，很容易编出一个故事来解释这种效果（“飞近小行星会因为引力而摧毁你的飞船”）。\n\
    \n有时候，如果能检查图像的实际可见（非透明）部分是否相交会很好。这是可能的，但要困难得多。我们不会讨论这一点。\n\n既然我们已经决定了检查对象相交，就可以再次查看\
    \ Actor 方法了。有两种方法可以检查对象相交。它们的签名如下：\n\n- `ListIntersectingObjects(Class cls)`\n\
    - `Actor getIntersectingObject(Class cls)`\n\n这两个方法都接受一个 `Class` 类型的参数（这意味着如果我们需要，可以检查与特定类对象的相交情况）。区别在于，一个方法将返回我们目前正相交的所有对象的列表，而另一个方法只返回单个对象。如果我们与多个一个对象相交，第二个方法会随机选择其中一个并返回它。\n\
    \n![](img/9d90a1ac20b9439aba2e593bea21f58a_126_0.png)\n\n## 7.5 碰撞的小行星\n\n对于我们的目的，第二个方法已经足够了。实际上，撞上一个小行星还是同时撞上两个小行星，对游戏来说并没有区别。火箭同样会爆炸。我们唯一的问题是，我们是否与任何小行星相交了？\n\
    \n因此，我们将使用第二个方法。因为它返回的是 `Actor` 而不是 `List`，所以处理起来稍微简单。如果我们相交，它将返回一个执行；如果我们目前没有与任何小行星相交，它将返回\
    \ `null`。我们可以检查空返回值来判断我们是否撞到了东西：\n\n```java\nActor a = getIntersectingObject(Asteroid.class);\n\
    if (a != null)\n{\n    // ...\n}\n```\n\n- **练习 7.30** 在你自己的 `checkCollision`\
