- md: "\n[content]\n# Summary of programming techniques\n\nIn this chapter, we worked\
    \ on completing an asteroid game that was initially half-written. In doing this,\
    \ we have encountered several important constructs again that we had seen before,\
    \ including loops, lists, and collision detection.\n\nWe have seen one new style\
    \ of loop—the `for` loop—and we have used it to paint the stars, and to generate\
    \ the proton waves. We have also revised the for-each loop when we implemented\
    \ the proton wave functionality.\n\nTwo different detection methods were used:\
    \ `getIntersectingObject` and `getInRange`. Both have their advantages in certain\
    \ situations. The second one of them returned a list of actors to us, so we had\
    \ to deal with lists again.\n\nUnderstanding lists and loops is initially quite\
    \ difficult, but very important in programming, so you should carefully review\
    \ these aspects of your code if you are not yet comfortable in using them. The\
    \ more practice you get, the easier it becomes. After using them for a while,\
    \ you will be surprised that you found them so difficult at first.\n\n## Concept\
    \ summary\n\n- **for loop** is one of Java's loop constructs. It is especially\
    \ good for iterating a fixed number of times.\n- **Greenfoot** provides several\
    \ methods for **collision detection**. They are in the Actor class.\n- The **bounding\
    \ box** of an image is the enclosing rectangle of that image.\n- Objects can be\
    \ of **more than one type**: the type of their class, and the type of the class's\
    \ superclass.\n- **Casting** is the technique of specifying a more precise type\
    \ for our object than the one the compiler knows about.\n\n## INTERLUDE 2\n\n\
    ## The Greeps competition\n\nWe will take a little time out to go on a second\
    \ interlude—a break in the chapter sequence to do something a little different.\
    \ This time, we will look at “Greeps”—a programming competition.\n\nThe Greeps\
    \ are alien creatures. And they’ve come to Earth! One of the important things\
    \ to know about Greeps is that they like tomatoes. They have landed with their\
    \ spaceship and are swarming to find and collect tomatoes (Figure I2.1).\n\nFigure\
    \ I2.1\nTwo Greeps hunting for tomatoes\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_139_0.png)\n\
    \nThe challenge in this programming competition will be to program your Greeps\
    \ so that they find and collect tomatoes as quickly as possible. You will have\
    \ limited time, and every tomato you manage to bring back to the spaceship scores\
    \ a point.\n\nYou can do this project as a contest against a friend who programs\
    \ your own Greeps, or you can do it as a contest for a whole group of programmers,\
    \ a school class. If you're on your own, you could post your entry to the Greenfoot\
    \ Gallery and see how you compare to other people.¹ Or you could do it on your\
    \ own just for the fun of it—it should be an interesting challenge.\n\n> ¹ If\
    \ you submit the Greeps scenario to the Greenfoot Gallery, please do not include\
    \ source code. We want to keep this project as a challenge to future programmers\
    \ and don't want to make it too easy to find solutions of others.\n\n\n\n## How\
    \ to get started\n\nTo start, open the greeps scenario from the book-scenarios\
    \ folder. Run this scenario.\n\nYou will see that a spaceship lands in an area\
    \ with sand and water. The Greeps will leave the spaceship and start searching\
    \ for tomato piles (which happen to be found in various places in this area).\
    \ Greeps are land animals—they cannot and will walk into the water. (In fact,\
    \ they are sensitive to water that they dissolve very quickly in it, so don't\
