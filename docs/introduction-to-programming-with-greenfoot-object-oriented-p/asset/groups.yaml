    ### Exercise 29 What do pixels look like which have a color/alpha value of (255,
    0, 255)? What about (0, 0, 255, 128)? And what is (255, 0, 255, 230)?


    In Greenfoot, colors are represented by objects of the Color class from java.awt.
    After importing that, we can create color objects either with RGB values:


    Color mycol = new Color (255, 12, 34); or with RGB values and an alpha value:


    Color mycol = new Color (255, 12, 34, 128); If we do not specify an alpha value,
    the color will be fully opaque.


    - Exercise 30 Create a new Greenfoot scenario-test. In it, create a world with
    a background that displays a pattern. Create an Actor subclass ColorPatch. Program
    the ColorPatch class so that it generates a BufferedImage of fixed size, filled
    with a fixed color. Use this as the actor''s image. Experiment with different
    color and alpha values.


    - Exercise 31 Modify your code so that the patch, when clicked, gets an image
    of a random size, filled with a random color, and random transparency.


    - Exercise 32 Modify your code again that the image is not filled, but instead
    has 100 small colored dots painted into it, at random locations within the actor''s
    image.


    ## Combining images and dynamic drawing


    Some of the most interesting visual effects are achieved when we combine static
    images from files with dynamic changes made by program. We can, for example, start
    with a static image, and then paint onto it with different colors, or scale it
    up or down, or let it fade by changing its transparency.


    To try this, we shall create a smoke effect. In our next scenario, we make a ball
    move across the screen, leaving a trail of smoke (see Figure 8.3).


    - 33 Create a new scenario called smoke. Make a nice looking, fairly neutral background
    for it.


    - 34 Create a ball that moves across the screen at constant speed. When it hits
    the edge of the screen, it bounces off. (The screen is, in effect, a box, and
    the ball bounces within it.)


    # Figure 8.3 The smoke trail effect


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_154_0.png)


    Now we shall work on the smoke effect. First, create an image showing a puff of
    smoke (Figure 8.4).


    # Figure 8.4 An image of a puff of smoke


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_154_1.png)


    Note that the checkered background is not part of the image—it is shown only to
    demonstrate that the smoke puff image is semi-transparent (we can see the background
    behind it).


    Your smoke does not have to be green—you can make it any color you like—but it
    should be transparent. You can achieve this in a graphics program by drawing a
    dot with a large, soft, semi-transparent paint brush. If you have trouble producing
    this image, you can use the prepared file smoke.png from the chapter08 folder
    in the book.


    - Exercise 35 Create the smoke image as described above.


    - Exercise 36 Create a Smoke actor class in your scenario. When inserted into
    the world, a Smoke actor should fairly quickly fade away. That is, in every act
    cycle, the image of the actor should become smaller and more transparent. The
    Green class has methods to adjust the size and transparency) When they are fully
    transparent or very, they should remove them from the world.


    - Exercise 37 Modify your ball so that it leaves puffs of smoke behind. Producing
    a puff of smoke every time the ball moves may be a little too much: Creating a
    new smoke puff in every second beat of the ball. Test.


    - Exercise 38 Modify your smoke so that it does not always fade at exactly the
    same rate. Make the rate of fading somewhat random, so that some puffs of smoke
    fade away quickly than others.


    If you completed all the exercises, then you should now have a good looking smoke
    behind your wall. If you had trouble with these exercises, or if you want to compare
    your solution to ours, you can look at the smoke scenario in the book projects.
    This implements the task described here.


    # Summary


    Being able to produce sounds and images is a very valuable skill for producing
    good looking games, simulations, and other graphical applications. Knowing about
    sound and image file formats is important to make good choices about trade-offs
    between size and quality.


    Sounds can be recorded and edited with a variety of sound recording programs,
    and various parameters determine the sound quality and file size. For Green scenarios,
    we usually use WAV format with fairly low quality.


    Images can also be saved in a variety of different formats. Different formats
    vary in how well they compress files, how well they preserve image quality, and
    how they handle transparency. JPEG and PNG are the formats most used for Greenfoot.


    By combining images from a file with dynamic image operations, such as scaling
    and transparency changes, we can achieve attractive visual effects in our scenarios.


    # Concept summary


    + - Sounds can be saved in a variety of different formats and encodings. Not all
    programs play all sound formats. For Greenfoot, we usually use WAV format.

    - The sample format, sample rate, and stereo/mono setting of a sound recording
    determine file size and sound quality.

