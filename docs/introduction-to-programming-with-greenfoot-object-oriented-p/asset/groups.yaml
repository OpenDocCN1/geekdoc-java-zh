    \n```\n/*\n * Check whether we have stumbled upon a worm.\n * If we have, eat\
    \ it. If not, do nothing.\n */\npublic void lookForWorm() {\n\tif (canSee(Worm.class))\
    \ {\n\t\teat(Worm.class);\n}\n}\n```\n\n# Concept:\n\nComments are written into\
    \ the source code as explanations for human readers. They are ignored by the computer.\n\
