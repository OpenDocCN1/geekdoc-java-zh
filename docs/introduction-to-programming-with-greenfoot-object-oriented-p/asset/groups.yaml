    \ actor 是否撞到了另一种类型的 actor。使用边界框（而不是图像的可见部分）产生的不准确性通常可以忽略。\n\n参数可以作为过滤器。如果指定了类，则只返回该类的对象。\n\
    \n## C.5 偏移对象\n\n方法：\n\n```\nList getAtOffset(int dx, int dy, Class cls)\n返回所有与给定位置交叉的对象。\n\
    ```\n\n```\nActor getOneObjectAtOffset(int dx, int dy, Class cls)\n返回一个位于指定单元格的对象。\n\
    ```\n\n这些方法可以用于检查距离 actor 当前位置给定偏移的对象。它们适用于低分辨率和高分辨率场景。\n\ndx 和 dy 参数指定以单元格为数的偏移。图\
