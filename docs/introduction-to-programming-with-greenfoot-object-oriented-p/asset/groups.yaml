  mdcn: "\n\n# 58 间歇 1 ■ 分享你的场景\n\n图 I1.1\n将场景导出到应用程序\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_74_0.png)\n\
    \n“锁定场景”（Lock scenario）选项会在启动应用程序之前禁用世界中角色的移动，并移除 Act 按钮和执行速度滑块。如果你有一个游戏，通常想要锁定场景，而对于模拟或更具实验性的场景，你可能希望保持未锁定状态以允许用户进行更多实验。\n\
    \n# I1.3 导出到网页\n\n图 I1.2\n导出到网页\n\n第二种选项是将你的场景导出到网页（图 I11.2）。导出对话框中的选项与之前相同，但此功能会创建一个网页（HTML\
    \ 格式），并将你的场景转换为在 във网页中运行的小型程序（applet）。\n\n你可以通过在网络浏览器中打开生成的网页来执行你的场景。\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_74_1.png)\n\
    \n# I1.4 发布在 Greenfoot Gallery 上\n\n如果你可以访问 Web 服务器，现在可以将此页面发布到网络上。如果你没有访问 Web\
    \ 服务器的权限，下一个选项可能适合你。\n\n# I1.4 发布在 Greenfoot Gallery 上\n\n你拥有的最后一个导出选项是将你的场景发布到\
    \ Greenfoot Gallery。Greenfoot Gallery 是一个公共网站（地址为 http://greenfootgallery.org），允许\
    \ Greenfoot 用户上传他们的 Greenfoot 场景供世界查看和玩。\n\n导出对话框（图 I1.3）在顶部显示地址。点击此处打开网站并查看它是什么。最好先浏览一下该网站。\n\
    \n图 I1.3\n发布到 Greenfoot Gallery\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_75_0.png)\n\
    \n# 概念：\n\nApplet（小程序）是 Java 程序的一种版本，可以在网络浏览器内部的网页上运行。\n\n在 Gallery 中，每个人都可以查看和执行场景，但如果你想对它们进行评分、发表评论或上传自己的场景，你需要在网站上创建一个账户。这既快速又简单。\n\
    \n创建账户后，你可以使用图 I1.3 显示的对话框轻松地将场景上传到 Greenfoot Gallery。对话框允许你添加图标、描述和标识你场景的标签。\n\
    \n如果你选择发布源代码（使用“发布代码”复选框），你的完整源代码将被复制到 Gallery 网站，其他人在那里可以下载、阅读它并创建你场景的自己的版本。\n\
    \n你发布的场景稍后可以通过相同的标题再次导出来更改和改进。\n\n将场景发布到 Gallery 是获取其他用户反馈的好方法：关于哪些有效和无效的评论，以及你可以添加到程序中的建议。Gallery\
    \ 也是获取进一步功能想法或学习如何操作的好地方。只需寻找带有源代码的场景，下载源码，并检查其他程序员是如何实现类的。\n\n# 概念总结\n\n- jar\
    \ 文件是一个带有 .jar 后缀的单个文件，包含了属于应用程序的所有 Java 类。\n- Applet 是 Java 程序的一种版本，可以在网络浏览器内部的网页上运行。\n\
    \n# # 第 5 章\n制作音乐：一个屏幕钢琴\n\n**主题：** 声音\n**概念：** 抽象、循环、数组、面向对象结构\n\n在本章中，我们将开始一个新场景：一个我们可以用电脑键盘弹的钢琴。图\
    \ 5.1 显示了我们完成后它可能的样子。\n\n我们从书籍场景中打开一个场景开始：*piano-1*。这是我们场景的一个版本，包含了我们所需的资源（图像和声音），但没有其他太多内容。我们将以此此作为基础场景，开始编写构建钢琴的代码。\n\
    \n**图 5.1**\n本章的目标：一个屏幕钢琴\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_77_0.png)\n\
    \n**练习 5.1** 打开场景 *piano-1* 并检查两个现有类 **Piano** 和 **Key** 的代码。确保你了解存在哪些代码以及它们的作用。\n\
    \n62 第 5 章 | 制作音乐：一个屏幕钢琴\n\n> **练习 5.2** 创建 Key 类的对象并将其放入世界中。创建几个对象并将它们放在一起。\n\
    \n# 5.1 钢琴键的动画\n\n当你检查代码时，你会发现目前内容不多：Piano 类仅指定了世界的尺寸和分辨率，而 Key 类只包含构造函数和 act\
    \ 方法的少数方法（空方法）（如代码5.1所示）。\n\n**代码 5.1**\n初始的 Key\n\n```\nimport greenfoot.*; //\
    \ (World, Actor, GreenfootImage, and Greenfoot)\npublic class Key extends Actor\n\
    {\n    /**\n     * 创建一个新的按键。\n     */\n    public Key()\n    {\n    }\n    /**\n\
    \     * 执行动作。\n     */\n    public void act()\n    {\n    }\n}\n```\n\n（注：原文中存在大量重复的段落和代码，已根据指令“不要重复输出原文”的原则进行去重处理，保留核心逻辑和翻译内容。）\n\
    \n"
