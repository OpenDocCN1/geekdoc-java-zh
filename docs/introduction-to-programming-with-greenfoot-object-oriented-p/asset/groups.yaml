    **练习 7.55** 添加一些声音。场景包含一个名为 `proton.wav` 的音频文件——你可以播放它。你可以将播放的语句放在质子波的构造函数中。


    现在我们已经有一个可以工作的质子波了，我们应该配备我们的火箭来释放它。


    **练习 7.56** 在 `Rocket` 类中，创建一个名为 `startProtonWave` 带有输出参数的方法存根。它需要返回什么吗？


    **练习 7.57** 实现这个方法：它应该将一个新的质子波对象放在世界中，位于火箭坐标处。


    **练习 7.58** 在按下“z”键时，从 `checkKeys` 方法中调用这个新方法。


    **练习 7.59** 你很快发现质子波释放得太频繁了。对于发射子弹，`Rocket` 类内置了一个延迟（使用 `gunReloadTime` 常量和 `reloadDelayCount`
    字段）。研究这段代码并为质子波实现类似的机制。尝试不同的延迟值，直到找到一个合理的值。


    # 与范围内的对象进行交互


    我们有一个可以通过按键释放的质子波。剩下的问题是：这个质子波实际上对小行星并没有产生任何影响。


    现在我们想要添加代码，当小行星被质子波击中时，对它们造成伤害。


    - **练习 7.60** 为这项新功能做好准备：在 **ProtonWave** 类中，添加一个名为 `checkCollision` 的方法存根。该方法没有参数也没有返回值。在你的
    **act** 方法中调用此方法。


    - **练习 7.61** 这个新方法的目的是检查波是否触碰了小行星，如果触碰了则对其造成伤害。编写该方法的注释。


    我们不想使用 `getIntersectingObjects` 方法，因为质子波图像角落的不可见图像区域（包含在边界框内，但不是蓝色圆形的一部分）相当大，小行星在波看起来触及它们之前很早就会被摧毁了。


    相反，我们将使用另一种碰撞检测方法，称为 `getObjectsInRange`。


    `getObjectsInRange` 方法返回调用对象周围给定半径内的所有对象列表（见图 7.4）。它的签名如下：


    ```

    getObjectsInRange(int radius, Class cls)

    ```


    调用时，我们可以指定我们感兴趣的对象类（像以前一样），还可以指定一个半径（以单元格为单位）。该方法将返回在调用对象周围此半径内找到的所有请求类的对象列表。


    要确定哪些对象在范围内，使用了对象的中心点。例如，如果一个小行星的中心点到火箭中心点的距离小于 20 个单元宽度，


    **图 7.4**

    给定半径的演员周围的范围


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_135_0.png)


    那么该小行星就在半径 20 内。图像的大小对该方法没有影响。


    使用此方法，我们可以实现 `checkCollision` 方法。


    我们的质子波将具有逐渐增的图像。在每个周期中，我们可以使用当前图像的大小来确定碰撞检查的范围。我们可以使用以下方法获取当前图像大小：


    ```

    getImage().getWidth()

    ```


    然后我们可以使用该大小的一半作为我们的范围（因为范围指定为半径，而不是直径）。


    - **练习 7.62** 在 `checkCollision` 中，声明一个名为 `range` 的局部变量并将当前图像宽度的一半赋值给它。


    - **练习 7.63** 添加对 `getObjectsInRange` 的调用，返回计算范围内的所有小行星。将结果赋值给类型为 `List<Asteroid>`
    的变量。记住你还需要为 `List` 类型添加导入语句。


    这为我们提供了质子波范围内所有小行星的列表。现在我们想对范围内的每个小行星造成一些伤害。


    `Asteroid` 类有一个 `hit` 方法，我们可以用它来实现。该方法已经用于在小行星被子弹击中时对其造成伤害，我们可以再次使用它。


    我们可以使用 `for` 循环来遍历从 `getObjectsInRange` 调用收到的列表中所有小行星。（如果你不确定如何编写 `for` 循环，请回看第
    6.8 节。）


    - **练习 7.64** 在 `Asteroid` 类中找到 `hit` 方法。它的参数是什么？它返回什么？


    - **练习 7.65** `ProtonWave` 类在顶部定义了一个常量 `DAMAGE`，它指定了应该造成的伤害值。找到该常量的声明。它的值是多少？


    - **练习 7.66** 在 `checkCollision` 中，编写一个 `for` 循环遍历从 `getObjectsInRange` 获取的小行星列表。在循环体内，使用
    `DAMAGE` 常量对每个小行星调用 `hit`。


    一旦你完成了这个练习，你现在应该拥有一个可玩的游戏版本，它能让你一次性击中并摧毁小行星。你会发现，如果你可以太频繁地使用波，游戏就会变得太简单了。


    137


    这个包含了最后几个章节所有更改的游戏版本可以在书中找到。你可以用它与你自己的版本进行比较，或者在某个练习中遇到困难时查看解决方案。


    # 7.10 进一步开发


    我们已经完成了本章对场景开发的详细讨论。然而，这个游戏有很多改进空间。有些是显而易见的，其他的你可能想要发明


    以下是以练习形式提供的后续建议，其中许多是相互独立的——不需要按照特定的顺序执行。选择你感兴趣的，并提出自己的想法。


    - **练习 7.67** 修复分数计数。你已经看到了分数计数器，但还没有被使用。计数器定义在 `Counter` 中，并在 `Space` 类中创建。你需要为
    `Space` 类添加一个名为 `countScore` 的方法——它应该向计数器添加分数；并在小行星被击中时调用这个新方法（你可能想对分裂小行星和移除小碎片设置不同的分数）。


    - **练习 7.68** 当所有小行星都被清理后添加新的小行星。也许游戏应该从两个小行星开始，每当它们被清理时，就会出现新的，每次一个。第二回合有三个小行星，第三回合以此此类推。


    - **练习 7.69** 添加关计数器。每当小行星被清理时，你就升级。也许在后面的关卡中获得更高的分数。


    - **练习 7.70** 添加关卡结束音。每当完成一个关卡时应该播放它。


    - **练习 7.71** 添加一个显示质子波加载状态的指示器，以便玩家知道何时可以再次使用。这可以是一个计数器，或者是某种图形表示。


    - **练习 7.72** 添加护盾。当护盾部署时，它会保持很短的固定时间。当护盾开启，可以在屏幕上看到它，碰撞的小行星不会造成伤害。


    当然，还有无数可能的扩展。发明一些你自己的，并将你的结果提交到 Greenfoot 画廊。


