    \ the application, as well as removing the Act button and the execution speed\
    \ slider. If you have a game, you typically want to lock the scenario, whereas\
    \ for a simulation or more experimental scenarios you may want to leave it unlocked\
    \ to allow users to experiment more.\n\n# I1.3 Export to a web page\n\nFigure\
    \ I1.2\nExport to a web page\n\nThe second option is to export your scenario to\
    \ a web page (Figure I11.2). The options in the export dialog are as before, but\
    \ this function creates a web page (in HTML format) and converts your scenario\
    \ to an applet that will run in that web page.\n\nYou can execute your scenario\
    \ by opening the generated web page in a web browser.\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_74_1.png)\n\
    \n# I1.4 Publishing on the Greenfoot Gallery\n\nIf you have access to a web server,\
    \ you can now publish this page on the web. If you do not have access to a web\
    \ server, the next option may be for you.\n\n# I1.4 Publishing on the Greenfoot\
    \ Gallery\n\nThe last export option you have is to publish your scenario to the\
    \ Greenfoot Gallery. The Greenfoot Gallery is a public web site (at the address\
    \ http://greenfootgallery.org) that allows Greenfoot users to upload their Greenfoot\
    \ scenarios for the world to see and play.\n\nThe export dialog (Figure I1.3)\
    \ shows the address at the top. Click here to open the web site and see what it\
    \ is. It is probably best if you have a look through the site first.\n\nFigure\
    \ I1.3\nPublish to the Greenfoot Gallery\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_75_0.png)\n\
    \n# Concept:\n\nAn applet is a version of a Java program that can run on a web\
    \ page inside a web browser.\n\nIn the Gallery, everyone can view and execute\
    \ scenarios, but if you want to rate them, leave comments, or upload your own\
    \ scenarios, you need to create an account on the site. This is quick and easy.\n\
    \nAfter creating an account, you can easily upload your scenario to the Greenfoot\
    \ Gallery, using the dialog shown in Figure I1.3. The dialog allows you to add\
    \ an icon, a description, and tags that identify your scenario.\n\nIf you choose\
    \ to publish the source code (using the Publish code checkbox), your full source\
    \ code will be copied to the Gallery site, where everybody else can then download\
    \ it, read it, and make their own versions of your scenario.\n\nYour published\
    \ scenarios can be changed and improved later by exporting again with the same\
    \ title.\n\nPublishing your scenarios to the Gallery can be a good way to get\
    \ feedback from other users: comments on what works and what doesn't, and suggestions\
    \ you could add to the program. The Gallery is also a good place to get ideas\
    \ for further functionality, or to learn how to do things. Just look for scenarios\
    \ with source code, download the source, and check how other programmers have\
    \ implemented their classes.\n\n# Concept summary\n\n- A jar file is a single\
    \ file with the suffix jar that contains all Java classes that belong to an application.\n\
    - An applet is a version of a Java program that can run on a web page inside a\
    \ web browser.\n\n# # CHAPTER 5\nMaking music: An on-screen piano\n\n**topics:**\
    \ sound\n**concepts:** abstraction, loops, arrays, OO structure\n\nIn this chapter\
    \ we will start on a new scenario: a piano that we can play with our computer\
    \ keyboard. Figure 5.1 shows what it could look like once we're finished.\n\n\
    We start with opening a scenario from the book scenarios: *piano-1*. This is a\
