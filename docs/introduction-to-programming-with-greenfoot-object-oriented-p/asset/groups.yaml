    ## 5.7 Summary of programming techniques


    Within the loop, we often use the loop counter to perform calculations or to generate
    different values in every loop iteration.


    The other major concept we used was an array. An array can provide many variables
    (all of the same type) in a single object. Often, loops are used to process an
    array if we need to do something to each of its elements. Elements are accessed
    using square brackets.


    Another very fundamental technique we encountered was abstraction. In this case,
    it appeared through the use of constructor parameters to create code that could
    handle a whole class of problems instead of a single specific problem.


    We also encountered a few new operators: We have seen the AND and NOT operators
    for boolean expressions (&& and !), and we have seen that the plus operator (+)
    performs string concatenation when applied to Strings. The String class is documented
    in the Java API documentation and has many useful methods.


    ## Concept summary


    - Logic operators, such as && (AND) and ! (NOT), can be used to combine multiple
    boolean expressions into one boolean expression.

    - Abstraction occurs in many forms in programming. One of them is the technique
    to write code that can solve a whole class of problems, rather than a single specific
    problem.

    - A loop is a statement in programming languages that can execute a section of
    code multiple times.

    - A local variable is a variable that is declared inside a method body. It is
    used for temporary storage.

    - An array is an object that holds multiple variables. These can be accessed using
    index.

    - Individual elements in an array are accessed using square brackets ([]) and
    an index to specify the array element.

    - The plus symbol (+), when used with Strings, stands for String concatenation.
    It merges two Strings together into one.

    - The type String is defined by a normal class. It has many useful methods, which
    we can look up in the Java library documentation.


