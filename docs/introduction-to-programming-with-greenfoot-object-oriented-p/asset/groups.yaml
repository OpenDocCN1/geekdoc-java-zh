    # 附录 D Java 细节


    ## D.1 Java 数据类型


    Java 包含两种类型：基本类型和对象类型。基本类型直接存储在变量中，它们具有值值语义（当赋值给另一个变量时，会复制其值）。对象类型通过存储对象的引用（而不是对象本身）来存储。当被赋值给另一个变量时，只复制引用，而不复制对象本身。


    ### D.1.1 基本类型


    下表列出了 Java 语言中所有的基本类型：


    | 类型名称 | 描述 | 示例字面量 |

    | --- | --- | --- |

    | 整数类型 | | |

    | byte | 字节大小的整数 (8 位) | 24 -2 |

    | short | 短型整数 (16 位) | 137 -119 |

    | int | 整数 (32 位) | 5409 -2003 |

    | long | 长型整数 (64 位) | 423266353L 55L |

    | 实数 | | |

    | float | 单精度浮点数 | 43.889F |

    | double | 双精度浮点数 | 45.632.4e5 |

    | 其他类型 | | |

    | char | 单个字符 (16 位) | ''m'' ''\u00F6'' |

    | boolean | 布尔值（真或假） | true false |


    注意说明：


    - 不带小数点的数字通常被解释为 `int`，但在赋值时会自动转换为 `byte`、`short` 或 `long` 类型（如果值在范围内）。你可以在数字后加一个
    L 来将字面量声明为 `long`。（1—小写 L—也可以用，但应避免使用，因为它可能被误认为是数字 1）。


    带有小数点的数字是 `double` 类型。你可以通过在数字后加 F 或 r 来指定 `float` 字面量。


    字符可以用单引号括起来写成单个 Unicode 字符，也可以写成以 \u 开头的四位 Unicode 值。


    布尔字面量为 `true` 和 `false`。


    由于基本类型的变量不引用对象，因此基本类型没有与之关联的方法。然而，在需要对象类型的上下文中，可能会使用自动装箱（autoboxing）将基本值转换为对应的对象。


    下表详细列出了数值类型支持可用最小值和最大值。


    | 类型 | 最小值 | 最大值 |

    | --- | --- | --- |

    | byte | -128 | 127 |

    | short | -32768 | 32767 |

    | int | -2147483648 | 2147483647 |

    | long | -922337203685475808 | 922337203685475807 |


    | 正极值 | 正最大值 |

    | --- | --- |

    | float | 1.4e-45 | 3.4028235e38 |

    | double | 4.9e-324 | 1.7976931348623157e308 |


    ### D.1.2 对象类型


    所有未列在基本类型中的类型都是对象类型。这些包含了标准 Java 库中的类和接口类型（如 `String`）以及用户定义的类型。


    对象类型的变量持有指向对象的引用（或“指针”）。赋值和参数传递具有引用语义（即复制的是引用，而不是对象）。在将一个变量赋值给另一个变量后，两个变量引用同一个对象。这两个变量被视为同一个对象的别名。


    类是用于对象的，定义了每个实例所拥有的字段和方法。数组的行为类似于对象类型——它们也具有引用语义。


    ## D.2 运算符


    ### D.2.1 算术运算符


    Java 提供了许多用于算术表达式的运算符，包括：


    - 加法

    - 减法

    - 乘法

    - 除法

    - 取模


    带有小数点的数字是 `double` 类型。你可以通过在数字后加 F 或 r 来指定 `float` 字面量。


    字符可以用单引号括起来写成单个 Unicode 字符，也可以写成以 \u 开头的四位 Unicode 值。


    布尔字面量为 `true` 和 `false`。


    由于基本类型的变量不引用对象，因此基本类型没有与之关联的方法。然而，在需要对象类型的上下文中，可能会使用自动装箱（autoboxing）将基本值转换为对应的对象。


    ### D.2.2 逻辑运算符


    逻辑运算符用于组合布尔表达式以产生另一个布尔值。它们包括：


    - 与 (&&)

    - 或 (||)

    - 非 (!)


    `&&` 和 `||` 在应用上略有不同。如果 `&&` 的左操作数为假，则右操作数不会被计算；同样，如果 `||` 的左操作数为真，则右操作数不会。它们被称为短路运算符。


    ### D.2.3 关系运算符


    关系运算符用于比较两个值并返回一个布尔结果：


    - 等于

    - 不等于

    - 小于

    - 大于

    - 小于等于

    - 大于等于


    ### D.2.4 赋值运算符


    赋值运算符用于将值赋给变量，包括：


    - =

    - +=

    - -=

    - *=

    - /=

    - %=


    ### D.2.5 递和递减运算符


    这些运算符将变量的值增加 1 或减少 1：


    - ++

    - --


    ### D.2.6 三元运算符


    Java 只有一个三元运算符，即条件运算符：


    ```

    表达式 ? 表达式1 : 表达式2

    ```


    ### D.2.7 类型运算符


    类型运算符用于检查对象的类型：


    - instanceof


