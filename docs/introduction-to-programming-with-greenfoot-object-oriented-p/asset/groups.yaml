    ## 第8章

    ## 创建图像与声音


    | 主题： | 创建声音、创建图像、动态图像变化、处理鼠标输入 |

    | 概念： | 音频格式、音质参数、图像文件格式、RGBA模型、透明度 |


    我们之前遇到的许多场景之所以有趣，不仅是因为定义了它们行为的程序代码，还因为它们有效地利用了声音和图像。到目前为止，我们还没有深入讨论过媒体文件，而且很大程度上依赖于现有的图片。


    在本章中，我们将讨论创建和管理媒体文件的某些方面。我们首先将讨论计算机程序中的声音，然后是创建和处理图像的各种技术。作为副作用，我们还会遇到处理鼠标输入的情况。


    ### 8.1 准备工作


    与之前的章节不同，我们在本章中不会构建一个完整的场景，而是通过完成各种练习来演示可以整合到各种不同场景中的技术。第一系列练习将引导我们创建一个场景：当用户点击演员（actor）时，播放一个声音（声音由我们自己创建）。对于这些练习，我们不使用已经部分实现的场景，而是从头开始创建一个新的。


    **练习 8.1** 作为练习的准备，创建一个新场景。你可以给它起任何名字。你会发现新场景自动包含了 World 和 Actor 的子类。


    **练习 8.2** 创建一个 World 的子类。将其命名为 MyWorld。你可以给它任何喜欢的背景图像。


    **练习 8.3** 修改世界的尺寸和分辨率，使其宽度为 400 像素，高度为 300 像素。在这一阶段，这并不重要。


    **练习 8.4** 在你的场景中创建一个演员子类。你可能想查看可用的库图像并选择一个。为你的类恰恰命名（记住：类名应以大写字母开头）。


    **练习 8.5** 在你的 MyWorld 类中添加代码，自动将你的演员实例放置到世界中。


    **练习 8.6** 在你的演员的 `act` 方法中编写代码，使其每次执行时都向右移动 10 像素。然而，移动并不是我们的主要目标。准备工作的下一步将是让演员对鼠标点击做出反应。在
    Greenfoot 中，有几种方法可以处理鼠标输入。它们是什么？在 Greenfoot 文档中查找并记录下来。


    **练习 8.7** `mouseClicked` 和 `mousePressed` 之间有什么区别？当我们对鼠标点击做出反应时，可以使用 Greenfoot
    类中的 `mouseClicked` 方法。该方法返回一个布尔值，可以作为 `if` 语句中的条件。`mouseClicked` 的参数可以指定被点击的对象——如果鼠标点击了任何地方，该方法将返回
    `true`。


    **练习 8.8** 修改你演员类中的代码，使其在响应鼠标点击时向右移动。


    **练习 8.9** 现在修改你的代码，使演员仅在用户点击它时才移动。为了做到这一点，你需要将演员本身（而不是 `null`）作为参数传递给 `mouseClicked`
    方法。


    **练习 8.10** 在世界中放置多个你的演员实例，并确保只有你点击的那个会移动。你现在应该拥有一个可以对鼠标点击做出反应的演员场景了。这是我们后续对声音和图像进行实验的良好起点。（如果你在创建这个时遇到困难，书中本章有一个名为
    `soundtest` 的场景实现了这一功能。）


    ### 8.2 使用声音


    正如我们之前看到的，Greenfoot 类有一个 `playSound` 方法，我们可以用它来播放声音文件。为了能够播放，声音文件必须位于场景内的 `sounds`
    文件夹中。首先，让我们播放一个现有的声音文件。


    **练习 8.12** 从你的其他 Greenfoot 场景中选择一个声音文件并复制到当前场景的 `sounds` 文件夹中。然后修改你的演员，使其在你点击它时播放声音（而不是移动）。


    #### 陷阱


    某些操作系统的配置为不显示文件扩展名。一个全名为 `mysound.wav` 的文件将显示为 `mysound`。这是一个问题，因为我们需要在 Java 代码中使用包含后缀名在内的全名。编写：


    ```java

    Greenfoot.playSound("mysound");

    ```


    将会失败，因为找不到该文件。然而，在看不到后缀的情况下，我们不知道它是什么。解决方案是更改操作系统的设置，使其始终显示后缀。例如，Windows 有一个“隐藏已知文件类型的扩展名”的复选框，你应该确保没有被勾选。在
    Windows Vista 中，你可以通过查看文件夹内容并进入“组织/搜索选项/查看”菜单找到它。在其他 Windows 系统中，菜单名称可能有所不同，但复选框也会在那里。


    我们可以轻松地播放现有的声音文件。现在更有趣的任务是自己制作一个声音文件。


    ### 8.3 录音与编辑


    获取声音文件有多种选择。我们可以从其他 Greenfoot 项目复制文件，或从互联网上的免费声音库下载。如果你从互联网下载，请注意版权声明：互联网上的任何都不是免费的——尊重他人的版权！获取声音文件最简单的方法是自己录制。为了做到这一点，我们需要麦克风（许多笔记本电脑内置了麦克风，且电脑耳机通常带有麦克风）和录音软件。如果你现在没有麦克风，可以跳过本节。


    有很多录音程序可用，其中几个是免费的。我们在这里使用 Audacity 进行截图。Audacity 是一个很好的选择，因为它功能强大、支持不同的操作系统，并且免费且易用。然而，还有许多其他录音程序，你可以使用你喜欢的任何一个。


    图 8.1 显示了录音程序的典型界面。通常会有播放、录制的控件以及录制声音的波形（蓝色图表）。


    **图 8.1** 录音与编辑程序 (Audacity)


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_146_0.png)


    > ¹ Audacity 可从 http://audacityteam.org 获取


    ### 8.4 格式与大小


    录音非常简单——通常可以通过尝试几次来学会。


    **练习 8.13** 打开录音程序并录制一段声音。结果符合你的预想吗？如果不是，删除它并重试。当我们录制声音时，开头和结尾通常会有几秒静音，这是我们不需要的。例如在图
    8.1 中，我们可以看到很长时间的静音（图表左右的直线）。如果我们按原样保存声音文件，效果将是播放时声音产生延迟（因为声音的前部分是静音）。


    我们可以通过选择声音的片段并使用“剪切”和“粘贴”来编辑声音。


    **练习 8.14** 编辑你的声音文件，使其包含你所需的精确声音。删除开头或结尾任何噪音或静音。


    许多音频编辑程序提供过滤器来修改声音或生成全新的声音元素。通过将过滤器（如放大、回声、速度变化等）应用于简单的声音（如拍掌、口哨、尖叫等），我们可以创造出各种效果。


    **练习 8.15** 如果你的声音程序支持过滤器，为你的录制声音应用一些过滤器。选择你最喜欢的三个过滤器并描述它们的作用。描述一个你可能会使用这种效果的例子。


    **练习 8.16** 制作以下声音：兔子吃胡萝卜的声音；爆炸声；硬物碰撞声；玩家失败时的“游戏结束”声音；机器人声音；跳跃声（游戏角色跳跃时使用）。


    '
