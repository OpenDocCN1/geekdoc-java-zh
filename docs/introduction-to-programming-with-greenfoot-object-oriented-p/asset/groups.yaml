    (it is in the inherited from Animal submenu, since the crab inherited this method
    from the Animal class). Call this method. What does it return?


    Exercise 2.11 Let the crab run to the edge of the screen (or move it there manually),
    and then call the atWorldEdge() method again. What does it return now?'
  - "[PAGE 40]\n\n# Chapter 2 The first program: Little Crab\n\nWe can now combine\
    \ this method with an if-statement to write the code shown in Code 2.3.\n\n# Code\
    \ 2.3\n\nTurning around the edge of the world\n\n```\nimport greenfoot.*; // (World,\
    \ Actor, GreenfootImage, and Greenfoot)\n/**\n * This class defines a crab. Crabs\
    \ live on the beach.\n */\npublic class Crab extends Animal {\n    public void\
    \ act() {\n        if ( atWorldEdge() ) {\n            turn(17);\n        }\n\
    \        move();\n    }\nn\n```\n\n# Concept:\n\nAn if-statement can be used to\
    \ write instructions that are executed only when a certain condition is true.\n\
    \nThe if-statement is a part of the Java language that makes it possible to execute\
    \ commands only if some condition is true. For example, we want to turn off only\
    \ if we are near the edge of the world. The code we have written:\n\n```\nif (\
    \ atWorldEdge() ) {\n    turn(17);\n}\nmove();\n```\n\nThe general form of an\
    \ if-statement is this:\n\n```\nif ( condition ) {\n    instruction;\n    instruction;\n\
    }\n```\n\nIn place of the condition can be any expression that is either true\
    \ or false (such as our atWorldEdge() method call), and the instructions will\
    \ be executed only if the condition is true. There can be one or more instructions.\n\
    \nIf the condition is false, the instructions are just skipped, and execution\
    \ continues under the curly bracket of the if-statement.\n\nNote that our move()\
    \ method is outside the if-statement, so it will be executed in any case. In other\
    \ words: if we are at the edge of the world, we turn and then move; if we are\
    \ not at the edge of the world, we just move."
