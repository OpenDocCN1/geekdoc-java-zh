    Windows 系统上，通常可以通过右键点击并选择菜单中的“提取所有”来实现。在 Mac OS 和 Linux 系统上，你可以双击进行解压。


    解压此文件后，你的文件系统中将有一个名为 `book-scenarios` 的文件夹。记住你把它保存在哪里了——在阅读本书时，你需要从该文件夹中打开项目。


