    # Chapter 7 ■ Collision detection: Asteroids


    Appendix C presents a summary of the different collision detection methods and
    their functionality. This might be a good time to a quick look through it. At
    some stage, you should become familiar with all the collision detection methods.


    For our purpose getIntersectingObjects seems like a good fit. Two objects intersect
    if any of the pixels in their images intersect. This is pretty much what we need.


    There is one small problem: transparent pixels in the actor images.


    Images in Green are always rectangles. When we see non-rectangular images, such
    as the rocket, because some pixels in the image are transparent (invisible); they
    contain no color. For the purpose of our program, they are still part of the image.


    Figure 7.2 shows the rocket and asteroids with their bounding boxes. The bounding
    box is the edge of the actual image. (The image of the rocket is a little bigger
    than what seems necessary to make it the same size as the second rocket image,
    rocketWithThrust, which shows the flame in the empty area)


    In 7.2, the images intersect, even though their visible parts do not touch. The
    collision detection methods will report this as an intersection. They work with
    the bounding boxes, and pay no attention to the non-transparent parts of the image.


    As a result, our rocket will make “contact” with an asteroid even though, onscreen,
    there seems to be still a little distance between them


    For our asteroids, we choose to ignore this. Firstly, the distance, so often players
    will not notice. Secondly, it is easy enough to come up with a story to explain
    this effect (“flying close to an asteroid destroys your ship because of the gravitational
    pull”)


    Sometimes it would be nice to check whether the actual visible (non-transparent)
    parts of an image intersect. This is possible, but much more difficult. We will
    not discuss this


    Now that we have decided to checking object intersection, we can look at the Actor
    methods again. There are two methods for checking object intersection. Their signatures
    are


    +   ListIntersectingObjects(Class cls)

    Actor getIntersectingObject(Class cls)


    Both methods accept a parameter of type Class (which means we can check for intersections
    with a specific class of object if we want to). The difference is that one method
    will return a list of all objects we currently intersect with, while the other
    returns only a single object. In case we intersect more than one other object,
    the second method randomly chooses one of them and returns it.


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_126_0.png)'
