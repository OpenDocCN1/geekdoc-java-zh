    Methods with non-void return types usually tell us something about the object
    (Can it move? How many leaves has it eaten?), but do not change the object. The
    wombat is as it was before we asked it about the leaves. Methods with void return
    types are usually commands to the objects that it do something.


    # 1.5 Parameters


    The other bit in the method menu that we have not yet discussed are the parentheses
    in the method name.


    ```

    int getLeavesEaten()

    void setDirection(int direction)

    ```


    The parentheses after the method name hold the parameter list. This tells us what
    the method requires any additional information to run, and if so, what kind of
    information.


    If we see a pair without anything else it (as we have in all methods far, the
    method has an empty parameter list). In other words, if there are no parameters—we
    invoke the method with just run. If there is anything within the parentheses,
    the method expects one or more parameters—additional information that we need
    to provide.


    Let us try the setDirection method. We can see that it has the words direction
    within its parameter list. When we invoke it, we see a dialog box similar to the
    one we saw in Figure 1.6.


    The words direction tell us that the method expects one parameter of type int,
    which specifies a direction. A parameter is an additional bit of data we must
    provide for this method to run. Every parameter is defined by two words: first
    the parameter type (here: int) and then a name, which gives us a hint what this
    parameter is used for. If a method has a parameter, then we need to provide this
    additional information when we invoke the method.'
