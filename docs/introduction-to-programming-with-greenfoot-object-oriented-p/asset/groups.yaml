    Exercise 2.12 Try it out! Type in the code discussed above and see if you can
    make your crabs turn at the edge of the screen. Pay close attention to the opening
    and closing brackets—it is easy to miss one or have too many.


    In the Greenfoot editor, when you place the cursor behind a closing bracket, Greenfoot
    will mark the matching opening closing bracket. This can be used to check whether
    your brackets match as they should.


    Exercise 2.13 Experiment with different values for the parameter to the turn method.
