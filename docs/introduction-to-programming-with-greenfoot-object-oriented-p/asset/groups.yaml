    # Concept:


    A subclass inherits the methods from its superclass. It means that it can call
    all methods that its superclass defines.


    Above, we have used the move and turn methods, so there might also be a method
    that helps us with our new goal. (In fact, there is.) But how do we find out methods
    we have got available?


    The move and turn methods we used so far come from the Animal class. A crab is
    an animal (signed by the arrow that goes from Crab to Animal in the class diagram),
    therefore it can do whatever an animal can. Our Animal class knows how to move
    and turn—that is why our crab can do it. This is called inheritance: The Crab
    inherits all the abilities (methods) from the Animal class.


    The question is, can we create our animals?


