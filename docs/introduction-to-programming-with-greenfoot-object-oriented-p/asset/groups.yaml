    ## 1.5 Parameters


    The other bit in the method menu that we have not yet discussed are the parentheses
    in the method name.


    ```

    int getLeavesEaten()

    void setDirection(int direction)

    ```


    The parentheses after the method name hold the parameter list. This tells us what
    the method requires any additional information to run, and if so, what kind of
    information.


    If we see a pair without anything else it (as we have in all methods far, the
    method has an empty parameter list). In other words, if there are no parameters—we
    invoke the method with just run. If there is anything within the parentheses,
    the method expects one or more parameters—additional information that we need
    to provide.


    Let us try the setDirection method. We can see that it has the words direction
    within its parameter list. When we invoke it, we see a dialog box similar to the
    one we saw in Figure 1.6.


    The words direction tell us that the method expects one parameter of type int,
    which specifies a direction. A parameter is an additional bit of data we must
    provide for this method to run. Every parameter is defined by two words: first
    the parameter type (here: int) and then a name, which gives us a hint what this
    parameter is used for. If a method has a parameter, then we need to provide this
    additional information when we invoke the method.


    ## 1.6 Greenfoot execution


    Figure 1.6

    A method call dialog


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_25_0.png)


    In this case, the type int tells us that we now should provide a whole number,
    and the name suggests that this number somehow specifies the direction to turn
    to.


    At the top of the dialog is a comment that tells us a little more: the direction
    parameter should be between 0 and 3.


    - **Exercise 1.5** invoke the setDirection(int direction) method. Provide a parameter
    value and see what happens. Which number corresponds to which direction? Write
    them down. What happens when you type in a number greater than 3? What happens
    if you provide input that is not a whole number, such as a decimal number (2,5)
    or a word (three)?


    > **Concept:**

    The specification of a method, which shows its return type, name, and parameters
    is called its signature.


    The setDirection method executes only a single parameter. Later, we shall see
    cases where methods execute more than one parameter. In that case, the method
    will list all the parameters within the parentheses.


    The description of each method shown in the object menu, including the return
    type, method name, and parameter list, is called the method signature.


    We have now reached a point where you can do many interactions with Greenfoot
    objects. You can create objects from classes, interpret the method signatures,
    and invoke methods (with and without parameters).


