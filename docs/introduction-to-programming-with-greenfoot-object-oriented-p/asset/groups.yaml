    # Figure 9.1

    The foxes-and-rabbits


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_159_0.png)


    Both species have fairly simple behavior: Rabbits move around—if they are old
    enough—may produce offspring. There is a seat probability at each step for rabbits
    to reproduce. There are two ways in which rabbits may die: They may die of old
    age, or they may be eaten by a fox.


    Foxes move and breed in a manner similar to rabbits (although they breed less
    frequently and have fewer young). One additional thing, however, that they hunt.
    If they are hungry, they see a rabbit sitting next to them, they will move to
    eat the rabbit.


    Foxes can also die in two different ways: They can die of old age, and they can
    starve. If they do not find a rabbit to eat for some time, they will die. (Rabbits
    are assumed to always sufficient amounts of food.)


    > **Exercise 9.1** Open the *foxes-and-rabbits* scenario. Run it. Explain the
    patterns of populations and movement you see emerging in the field.


    > **Exercise 9.2** You will notice that this scenario shows a connect small window
