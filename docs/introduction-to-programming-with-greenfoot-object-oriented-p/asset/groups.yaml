    \ to one of an arbitrary number of cases. Two possible use patterns are:\n\n```\n\
    switch (expression)\n{\n    case value: statements;\n    break;\n    case value:\
    \ statements;\n    break;\n    further cases omitted\n    default: statements;\n\
    \    break;\n}\n```\n\n```\nswitch (expression)\n{\n    case value1:\n    case\
    \ value2:\n    case value3:\n        statements;\n        break;\n    case value4:\n\
    \    case value5:\n        statements;\n        break;\n    further cases omitted\n\
    \    default:\n        statements;\n        break;\n}\n```\n\nNotes:\n\n- A switch\
    \ statement can have any number of case labels.\n- The break instruction after\
    \ every case is needed, otherwise the execution 'falls through' into the next\
    \ label's statements. The second form above makes use of this. In this case, all\
    \ three of the first values will execute the first statements section, whereas\
    \ values four and five will execute the second statements section.\n- The default\
    \ case is optional. If no default is given, it may happen that no case is executed.\n\
    - The break instruction after the default (or the last case, if there is no default)\
    \ is not needed, but is considered good style.\n\nExamples:\n\n```\nswitch (day)\n\
    {\n    case 1: dayString = \"Monday\";\n    break;\n    case 2: dayString = \"\
    Tuesday\";\n    break;\n    case 3: dayString = \"Wednesday\";\n    break;\n \
    \   case 4: dayString = \"Thursday\";\n    break;\n    case 5: dayString = \"\
    Friday\";\n    break;\n    case 6: dayString = \"Saturday\";\n    break;\n   \
    \ case 7: dayString = \"Sunday\";\n    break;\n    default:dayString = \"invalid\
    \ day\";\n    break;\n}\nswitch(month)\n{\n    case 1:\n    case 3:\n    case\
    \ 5:\n    case 7:\n    case 8:\n    case 10:\n    case 12:\n        numberOfDays\
    \ = 31;\n        break;\n    case 4:\n    case 6:\n    case 9:\n    case 11:\n\
    \        numberOfDays = 30;\n        break;\n    case 2:\n        if(isLeapYear())\n\
    \            numberOfDays = 29;\n        else\n            numberOfDays = 28;\n\
    \        break;\n}\n```\n\n## D.3.2 Loops\n\nJava has three loops: while, do-while,\
    \ and for. The for loop has two forms. Except for the for-each loop, repetition\
    \ is controlled in each with a boolean expression.\n\n### D.3.2.1 while\n\nThe\
    \ while loop executes a block of statements as long as a given expression evaluates\
    \ to true. The expression is tested before execution of the loop body, so the\
    \ body may be executed zero times (i.e., not at all). This capability is an important\
    \ feature of the while loop.\n\n```\nwhile (expression)\n{\n    statements;\n\
    }\n```\n\nExamples:\n\n```\nSystem.out.print(\"Please enter a filename: \");\n\
    input = readInput();\nwhile (input == null)\n{\n    System.out.print(\"Please\
    \ try again: \");\n    input = readInput();\n}\n```\n\n```\nint index = 0;\nboolean\
    \ found = false;\nwhile (!found && index < list.size())\n{\n    if(list.get(index).equals(item))\n\
    \    {\n        found = true;\n    }\n    else\n    {\n        index++;\n    }\n\
    }\n```\n\n### D.3.2.2 do-while\n\nThe do-while loop executes a block of statements\
    \ as long as a given expression evaluates to true. The expression is tested after\
    \ execution of the loop body, so the body always at least once. This is an important\
    \ difference from the while loop.\n\n```\ndo\n{\n    statements;\n} while (expression);\n\
    ```\n\nExample:\n\n```\ndo {\n  System.out.print(\"Please enter a filename: \"\
    );\n  input = readInput();\n} while (input == null);\n```\n\n### D.3.2.3 for\n\
    \nThe for loop has two forms. The first form is also known as a for-each loop,\
    \ and is used exclusively to iterate elements of a collection. The loop variable\
    \ is assigned the value of successive elements of the collection on each iteration\
    \ of the loop.\n\n```\nfor (variable : collection) {\n  statements;\n}\n```\n\n\
    Example:\n\n```\nfor (String note : list) {\n  System.out.println(note);\n}\n\
    ```\n\nThe second form of for loop executes as long as a condition evaluates to\
    \ true. Before the loop starts, an initialization statement is executed exactly\
    \ once. The condition is evaluated before every execution of the loop body (the\
    \ loop may execute zero times). An increment statement is executed after each\
    \ execution of the loop body.\n\n```\nfor (initialization; condition; increment)\
    \ {\n  statements;\n}\n```\n\nExample:\n\n```\nfor (int i = 0; i < text.size();\
    \ i++) {\n  System.out.println(text.get(i));\n}\n```\n\nBoth types of for loop\
    \ are commonly used to execute the body of the loop a definite number of times—once\
    \ for each element in a collection. A for-each loop cannot be used if the collection\
    \ is to be modified while it is being iterated over.\n"
  mdcn: "\n\n将第一个 if-else 语句的 else 部分放置第二个 if-else 语句，从而将它们连接起来是非常常见的。这种操作可以无限进行。包含一个最后的\
    \ `else` 部分是一个好习惯。\n\n```\nif (n < 0)\n{\n    handleNegative();\n}else if (number\
    \ == 0)\n{\n    handleZero();\n}else\n{\n    handlePositive();\n}\n```\n\n## D.3.1.2\
    \ switch\n\n`switch` 语句根据单个值切换到任意数量的情况（case）。两种可能的用法模式如下：\n\n```\nswitch (expression)\n\
    {\n    case value: statements;\n    break;\n    case value: statements;\n    break;\n\
    \    further cases omitted\n    default: statements;\n    break;\n}\n```\n\n```\n\
    switch (expression)\n{\n    case value1:\n    case value2:\n    case value3:\n\
    \        statements;\n        break;\n    case value4:\n    case value5:\n   \
    \     statements;\n        break;\n    further cases omitted\n    default:\n \
    \       statements;\n        break;\n}\n```\n\n注意事项：\n\n- `switch` 语句可以有任意数量的\
    \ case 标签。\n- 每个 case 后面都需要一个 `break` 指令，否则执行流将“穿透”（falls through）到下一个标签的语句。上面的第二种形式就利用了这一点。在这种情况下，前三个值都将执行第一个语句部分，而值四和五将执行第二个语句部分。\n\
    - `default` 情况是可选的。如果没有给出 `default`，可能会出现没有 case 代码被执行的情况。\n- `default`（或如果没有\
    \ `default` 则为最后一个 case）之后的 `break` 指令不是必须的，但被认为是一种良好的风格。\n\n示例：\n\n```\nswitch\
    \ (day)\n{\n    case 1: dayString = \"Monday\";\n    break;\n    case 2: dayString\
    \ = \"Tuesday\";\n    break;\n    case 3: dayString = \"Wednesday\";\n    break;\n\
    \    case 4: dayString = \"Thursday\";\n    break;\n    case 5: dayString = \"\
    Friday\";\n    break;\n    case 6: dayString = \"Saturday\";\n    break;\n   \
    \ case 7: dayString = \"Sunday\";\n    break;\n    default:dayString = \"invalid\
    \ day\";\n    break;\n}\nswitch(month)\n{\n    case 1:\n    case 3:\n    case\
    \ 5:\n    case 7:\n    case 8:\n    case 10:\n    case 12:\n        numberOfDays\
    \ = 31;\n        break;\n    case 4:\n    case 6:\n    case 9:\n    case 11:\n\
    \        numberOfDays = 30;\n        break;\n    case 2:\n        if(isLeapYear())\n\
    \            numberOfDays = 29;\n        else\n            numberOfDays = 28;\n\
    \        break;\n}\n```\n\n## D.3.2 循环\n\nJava 有三种循环：while、do-while 和 for。`for`\
    \ 循环有两种形式。除了 `for-each` 循环外，每种循环都通过一个布尔表达式来控制重复。\n\n### D.3.2.1 while\n\n`while`\
    \ 循环只要给定的表达式求值为 true，就会执行一个语句块。表达式在执行循环体之前进行测试，因此循环体可能会执行零次（即完全不执行）。这种能力是 `while`\
    \ 循环的重要特性。\n\n```\nwhile (expression)\n{\n    statements;\n}\n```\n\n示例：\n\n```\n\
    System.out.print(\"Please enter a filename: \");\ninput = readInput();\nwhile\
    \ (input == null)\n{\n    System.out.print(\"Please try again: \");\n    input\
    \ = readInput();\n}\n```\n\n```\nint index = 0;\nboolean found = false;\nwhile\
    \ (!found && index < list.size())\n{\n    if(list.get(index).equals(item))\n \
    \   {\n        found = true;\n    }\n    else\n    {\n        index++;\n    }\n\
    }\n```\n\n### D.3.2.2 do-while\n\n`do-while` 循环只要给定的表达式求值为 true，就会执行一个语句块。表达式在执行循环体之后进行测试，因此循环体至少执行一次。这是与\
    \ `while` 循环的一个重要区别。\n\n```\ndo\n{\n    statements;\n} while (expression);\n```\n\
    \n示例：\n\n```\ndo {\n  System.out.print(\"Please enter a filename: \");\n  input\
    \ = readInput();\n} while (input == null);\n```\n\n### D.3.2.3 for\n\n`for` 循环有两种形式。第一种形式称为\
    \ `for-each` 循环，专门用于迭代集合中的元素。循环变量在循环的每次迭代中被赋值为集合中连续元素的值。\n\n```\nfor (variable\
    \ : collection) {\n  statements;\n}\n```\n\n示例：\n\n```\nfor (String note : list)\
    \ {\n  System.out.println(note);\n}\n```\n\n第二种形式的 `for` 循环只要条件值为 true 就会执行。在循环开始之前，初始化语句精确执行一次。条件在每次执行循环体之前进行评估（循环可能会执行零次）。增量语句在每次执行循环体后执行。\n\
    \n```\nfor (initialization; condition; increment) {\n  statements;\n}\n```\n\n\
    示例：\n\n```\nfor (int i = 0; i < text.size(); i++) {\n  System.out.println(text.get(i));\n\
    }\n```\n\n两种类型的 `for` 循环通常用于执行固定次数的循环体——对于集合中的每个元素执行一次。如果要在迭代集合修改修改集合，则不能使用 `for-each`\
    \ 循环。\n\n"
