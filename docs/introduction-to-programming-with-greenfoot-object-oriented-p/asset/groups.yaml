    # 5.5 Using loops: The while loop


    Trying out this code, it first looks as if only one key was created. This is deceptive,
    however. We do indeed get 12 keys, but since they have all been inserted at exactly
    the same coordinates, we are all lying on top of each other, and we cannot see
    them very well. Moving the keys in the piano world with your mouse pointer and
    you will see that they are all there.


    Exercise 5.16 How can you change your code so that the keys do not all appear
    at exactly the same place? Can you change your code so that they get placed exactly
    next to each other?


    The reason the keys all appeared on top of each other is that we inserted them
    at the fixed location 300,140 into the world. We now want to insert every key
    at a different location. This is now actually quite easy to do: We can make use
    of our loop variable i to achieve this.


    Exercise 5.17 How many times does our loop execute? What are the values of i during
    each of the executions?


    We can now replace the fixed x-coordinate 300 with an extension that includes
    the i:

    addobject(new Key("3.wav"), i*63, 140);


    (The asterisk "*" is the operator for multiplication. Appendix D lists other operators
    that you can use with integers.)


    We have chosen i63, because we know that the image of each key is 63 pixels. The
    values for i, as the loop executes, are 0, 1, 2, 3, and so on. The keys will be
    placed at x-coordinates 0, 63, 126, 189, and so on.


    When we try we notice that the left-most key is not placed very well. Since object
    placement in Greenfoot returns the center to the center point of an object, the
    first key is placed at x-coordinate 0, which places the key half off the screen.
    To fix this, we add a fixed offset to each key coordinate. The offset is 0 so
    that the keys are a whole appear in the middle of our piano:


    ```

    addobject(new Key("3.wav"), i*63 + 140);

    ```


    The y-coordinate can remain constant, since we use all keys at the same height.


    Exercise 5.18 Challenge exercise. (Do this exercise only if you are fairly confident
    about your programming. If you are just beginning, you may like to skip this exercise.)


    Using fixed numbers in your code, as the 140 or 63 in the statement above, is
    usually not the best solution, since it makes your code vulnerable to breaking
    things change. For example, if we replace the key images with nicer images that
    have a different size, our code would not place them correctly.'
