    # Concept summary


    +   - A **method call** is an instruction that tells an object to perform an action.
    The action is defined by a method of the object.

    - Additional information can be passed to some methods within parentheses. The
    value passed is called a **parameter**.

    - Multiple instructions are executed **in sequence**, one after the other, in
    the order in which they are written.

    - When a class is compiled, the compiler checks to see whether there are errors.
    If an error is found, an **error message** is displayed.

    - A subclass **inherits** all the methods from its superclass. That means that
    it has, and can use, all methods that its subclass defines.

    - Calling a method with a **void return type** issues a command. Calling a method
    with a **non-void return type** asks a question.

    - An **if-statement** can be used to write instructions that are executed only
    when a certain condition is true.'
