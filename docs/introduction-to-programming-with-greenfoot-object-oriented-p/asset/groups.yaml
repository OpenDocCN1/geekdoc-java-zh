    # Summary of programming techniques


    In this chapter, we have touched on a number of new concepts. We have seen a new
    scenario—Newton’s Lab—that simulates planets and space. Simulations in general
    are a very interesting topic, and we will come back to them in Chapter 9.


    We have seen two helper classes, SmoothMoover and Vector, both of which help us
    to create more sophisticated movement.


    One of the most important new in this chapter was the use of additional classes
    from the standard Java class library. We have used Color, Math, and List from
    the library. We will come back to this with the use of more classes in the remaining
    chapters.


    Another addition to our tool set was the use of a new loop: the *for-each* loop.
    This loop is used to something to every element of a Java collection, as a list.
    This is another bit of code that we will need to use later.


    For-each loops are especially useful when processing objects from a collection.
    However, they cannot be used without a collection, and they do not provide an
    index while processing the elements. If we need an index, or a loop independent
    of a collection, then we must use a for loop or a while loop instead.


    And finally, we have seen some more useful methods from the Greenfoot API, as
    the getObjects method from the World class and the getIntersectingObject method
    from the Actor class. The last one leads us into the more general area of collision
    detection, we shall discuss in more detail in the next chapter, where we pick
    up the *Asteroids* game again.'
