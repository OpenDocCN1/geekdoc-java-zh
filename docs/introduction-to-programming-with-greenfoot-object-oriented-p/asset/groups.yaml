    # 162


    ## Chapter 10 Additional scenario ideas


    ## Figure 10.8

    Simulation of wave propagation on a string of beads


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_178_0.png)


    ## 10.9 Summary


    In including this chapter of our book, we have tried to show that there are many
    more directions you can follow, beyond the few examples that we have discussed
    in detail throughout this book.


    As you become more experienced, you will become more confident and more able to
    turn your ideas into reality as you develop your programs. As a programmer, an
    infinite world of creative endeavor lies in front of you, within Greenfoot and
    without, using other development environments.


    When you program in other environments, outside of Greenfoot, you will have to
    learn new skills and techniques, but everything you have learned using Greenfoot
    will be useful and applicable.


    If you have followed this book all the way to this point, you will have learned
    a great deal about programming in Java, and indeed programming in an object-oriented
    language in general. In learning to program, the beginning is always the hardest
    part, and you have been beyond it.


    If you would like support and ideas for further Greenfoot programming, make use
    of the Greenfoot website site.¹ Use the Greenfoot Gallery to publish your scenarios,
    look at other people''s work, and get some ideas. Look at the video tutorials
    for tips and tricks. And join the discussion group to chat with other Greenfoot
    programmers, get help, and discuss new ideas.


    We hope that you have come to enjoying programming as much as we do. If you have,
    a whole world lies before you. Program, enjoy, and be creative!


    ¹ www.greenfoot.org


    ## APPENDIX A

    Installing Greenfoot


    This appendix will tell you where to find the Greenfoot software and the scenarios
    used in this book, and how to install them.


    To work with the example projects in this book, you will need to install three
    things: A Java system, the Greenfoot software, and the book scenarios.


    ### A.1 Installing Java


    Download Java from http://java.sun.com/javase/downloads. You should install the
    latest version of the Java SE Development Kit (JDK).


    On Mac OS X, Java does not need to be installed—it is included in the standard
    Mac OS installation.


    ### A.2 Installing Greenfoot


    Download Greenfoot from http://www.greenfoot.org, and follow the installation
    instructions.


    ### A.3 Installing the book scenarios


    Download the book scenarios from http://www.greenfoot.org/book. You will receive
    a file named book-scenarios.zip. This is a compressed file that must be extracted.
    On Windows systems, this usually can be achieved by right-clicking and selecting
    Extract All from the menu. On Mac OS and Linux systems, you can double-click to
    extract it.


    After extracting this file, you will have a folder named book-scenarios stored
    in your file system. Remember where you saved it—you will need to open the projects
    from this folder while you work through the book.


    ## Greenfoot API


    The Greenfoot API consists of five classes:


    | Class | Method | Description |

    | :--- | :--- | :--- |

    | Actor | Actor methods | available to all actor subclasses. |

    | MouseInfo | | provides information about the last mouse event. |

    | GreenfootImage | | for image presentation and manipulation. |

    | World | World methods | available to the world. |

    | Greenfoot | | used to communicate with the Greenfoot environment itself. |


