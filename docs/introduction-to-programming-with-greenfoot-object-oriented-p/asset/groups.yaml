    \ `Actor` 类中。\n- 图像的**边界框 (bounding box)** 是包围该图像的矩形。\n- 对象可以是** hơn一种类型**：它们所属类的类型，以及该类父类的类型。\n\
    - **类型转换 (Casting)** 是一种为我们的对象指定比编译器已知的类型更精确类型的技术。\n\n## 间插 2\n\n## Greeps 竞赛\n\
    \n我们将花一点时间进入第二个间插——这是章节顺序中的一个休息，用来做一些不同的事情。这一次，我们将看看“Greeps”——一场编程竞赛。\n\nGreeps\
    \ 是外星生物。它们来到地球了！关于 Greeps 的重要信息之一是它们喜欢番茄。它们乘坐飞船登陆，并成群地寻找和收集番茄（图 I2.1）。\n\n图 I2.1\n\
