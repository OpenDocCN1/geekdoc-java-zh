    be able to create objects. This means usually that you should have a “populate”
    method, like the one we created for the crab game.


    > Concept:

    A **jar file** is a single file with the suffix *.jar* that contains all Java
    classes that belong to an application.


    Using this function will create an *executable jar file*. This is a file with
    a “jar” suffix (short for *Java Archive*), which can be executed on many different
    operating systems (as long as Java has been installed on that machine). Double-click
    the jar file to execute it.


    When the application runs, the scenario will look just like it did in Greenfoot,
    except that the *Compile* button are not present. The user can run the scenario,
    but not edit or compile.'
