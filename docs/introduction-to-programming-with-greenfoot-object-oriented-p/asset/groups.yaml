    # Chapter 5 ■ Making music: On-screen piano


    > We can avoid using those numbers directly by calling the getWidth() and getHeight()
    methods of the key''s image. To do this, first assign the key to a local variable
    of type Key when you create it, and then use key.getImage().getWidth() in place
    of the 63. Do a similar thing with the height.


    Replacing the 54 requires you to also use the getWidth() method of the piano''s
    image.


    After doing this, our code will always place the keys nicely, even if their size
    changes.


    Our code now places our white keys nicely—that''s a good forward. The most obvious
    problem is now that all piano keys react to the same keyboard and play the same
    note. Fixing this again requires a new programming construct: an array.


    # 5.6 Using arrays


    Currently, our 12 keys are created, and placed at appropriate locations on the
    screen, but they all react to the “g”, and they all play the same note. This is
    despite the fact that we have prepared keys to create different keyboard keys
    and sound files in the constructor. Since all our keys are created by the same
    line of source code (executed in a loop), they are all created with “g” and “3.wav”
    as parameters.


    The solution is to change what we make in regards to the x-coordinate: We should
    use variables for the keyboard key and the sound file name, and assign different
    values to each time the loop executes.


    This is more problematic than the case with the x-coordinate, though. The correct
    keys and sound file names cannot be computed easily. So where do we get the values
    from?


    Our answer is: We will store them in an array.


    An array is an object that can hold many variables, and thus can store many values.
    We can show this in a diagram. Assume we have a variable “name” of String. To
    this variable, we assign the String “Fred":


    ```

    String name;

    name = "Fred";

    ```


    Figure 5.2 illustrates this example.


    This is very simple. The variable is a container that can hold a value. The value
    is stored in the variable.


    In case of an array, we get a separate object—the array object—that holds many
    variables. We can then store a reference to that array in our own variable (Figure
    5.3).


    Figure 5.2

    A simple String variable


