    第一行从世界中获取当前的背景图像。这是一个自动生成的（白色）图像。然后我们有一个存储在 `background` 变量中的世界背景的引用。


    我们在这里存储的背景对象是 `GreenImage` 类——我们之前见过这个类。


    > 练习 7.8 查找 `GreenImage` 类的文档。用于绘制矩形的方法名称是什么？`drawOval` 和 `fillOval` 有什么区别？


    # 第 7 章 ■ 碰撞检测：小行星游戏


    上述代码片段中的第二行将画笔颜色设置为黑色。这样做没有立即生效（它没有改变图像的颜色）。相反，它决定了所有后续绘制操作将使用的颜色。参数是 `Color`
    类中的一个常量，我们在上一个章节遇到过它。


    **练习 7.9** 再次查找 `Color` 类的文档。（你记得它在哪个包中吗？）该类定义了多少种颜色常量字段？


    代码片段的第三行现在用我们选择的颜色填充图像。注意，我们不需要将此图像设置为世界的背景。当我们获取图像（使用 `getBackground()`）时，我们获取了背景图像的引用，同一个图像仍然是世界的背景。仅仅因为我们现在有了引用，它并没有从世界中移除。


    当我们在这个图像上绘图时，我们直接是在背景上绘图。


