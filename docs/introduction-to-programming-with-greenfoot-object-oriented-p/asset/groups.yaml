    # Summary of programming techniques


    In this chapter, we have seen two fundamental and important concepts for more
    sophisticated programming: loops and arrays. Loops allow us to write code that
    executes a sequence of statements many times over. The loop we have discussed
    is called a while loop. Java has other loops as well, which we will encounter
    shortly. We will use loops in many of our programs, so it is essential to understand
    them.'
