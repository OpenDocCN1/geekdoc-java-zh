    # 7.5 Colliding asteroids 111


    For our purpose, the second method is good enough. It actually makes no difference
    to the game whether we crash into one asteroid, or into two of them simultaneously.
    The rocket will explode just the same. The only question for us is, do we intersect
    with any asteroid at all?


    Thus, we shall use the second method. Since it returns an Actor rather than a
    List, it is slightly simpler to work with. It will return an actor if we have
    an intersection, or null if we currently do not intersect with any asteroid. We
    can check for a null return value to see whether we crashed into anything:


    ```

    Actor a = getIntersectingObject(Asteroid.class);

    if (a != null)

    {

    ..\}

    ```


    +   **Exercise 7.30** Add a check for intersecting with an asteroid, similar to
    the one shown here, to your own checkCollision method.


    +   **Exercise 7.31** Add code to the body of the if statement that adds an explosion
    to the world at the current position of the rocket, and removes the rocket from
    the world. (To do this, you need to use the getWorld() to access its methods for
    adding and removing objects from the world.)


    For the last exercise above, we can use our getX() and getY() methods to retrieve
    the current position. We can use this as the coordinates for the explosion.


    An attempt at solving this might look like:


    ```

    world = getWorld();

    world.removeObject(this); // remove rocket from world

    world.addObject(new Explosion(), getX(), getY());

    ```


    This code looks reasonable at first glance, but will not work.


    +   **Exercise 7.32** Try out the code as shown above. Does it compile? Does it
    run? At what point does something go wrong, and what is the error message?


    The reason this does not work is that we are calling the getX() and getY() methods
    after removing the rocket from the world. When an actor is removed from the world,
    it does not have any coordinates—it has coordinates only while being in the world.
    Thus, the getX() and getY() method calls fail in this example.


    This can easily be fixed by switching the last two lines of code: Insert the explosion
    first, and then remove the rocket from the world.'
