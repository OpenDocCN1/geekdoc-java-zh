    ## 10.9 总结


    在本书的这一章节中，我们试图向你展示，除了书中详细讨论的几个示例外，你还有许多其他可以遵循的方向。


    随着你经验的增加，在开发程序时你将变得更加自信，并更有能力将你的想法变为现实。作为一名程序员，在 Greenfoot 内部以及使用其他开发环境中，一个无限的创意尝试世界正向你展开。


    当你在 Greenfoot 之外的其他环境中进行编程时，你将需要学习新的技能和技术，但你使用 Greenfoot 学到的所有知识将是有用且适用的。


    如果你一直跟着这本书直到这里，你已经学习了大量的 Java 编程，实际上也学习了通用的面向对象语言编程。在学习编程的过程中，开始总是是最困难的，而你已经渡过了这一关。


    如果你想获得更多 Greenfoot 编程的支持和创意，请利用 Greenfoot 网站¹。使用 Greenfoot Gallery 发布你的场景，查看他人的作品，并获取一些灵感。查看视频教程以获取提示和技巧。加入讨论组，与其他
    Greenfoot 程序员聊天、寻求帮助并讨论新想法。


    我们希望你已经像我们一样喜欢编程。如果你是这样的话，整个世界就在你面前。去编程吧，享受其中，并发挥创意吧！


    ¹ www.greenfoot.org


