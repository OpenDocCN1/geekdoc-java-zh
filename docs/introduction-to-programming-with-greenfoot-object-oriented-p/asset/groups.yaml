    # 114 Chapter 7 Collision detection: Asteroids


    The problem lies in the fact that the compiler is not quite as smart as we would
    like. The getWorld() method is defined in class Actor, and its signature is this:


    ```

    World getWorld()

    ```


    We see that it will return an object of type World. The actual world that it returns
    in our case is of type Space.


    This is not a contradiction: Our world object be of type World and of type Space
    at the same time, because Space is a subclass of World (Space is as World; and
    we say that the type is a subtype of type World).


    The error comes from the difference between the two: gameOver is defined in class
    Space, while getWorld gives us a result of type World. The compiler only looks
    the return type of the method we are calling (getWorld). Because of this, the
    compiler searches for gameOver method only there and does not find it. That''s
    why we get the error message.


    To solve this problem, we need to tell the compiler explicitly that the type we''re
    getting is actually of Space. We can do this by using a cast.


    ```

    Space space = (Space) getWorld();

    ```


    Casting is the technique of telling the compiler a more precise for our object
    than it can work out itself. In our case, the compiler can work out the object
    returned from getWorld is of type World, and we are now telling it it is actually
    of Space. We do this by writing the name (Space) in parentheses before the method
    call. Once we have done this, we can call methods in Space:


    ```

    space.gameOver();

    ```


    It is worth noting that casting does not change the type of the object. Our actual
    is of type Space all. The problem is that the compiler does not know this. With
    the cast, we are just adding additional information to the compiler.


    Back to our checkCollision method. Once we have our world to Space and stored
    it in a variable of type Space, we can call all methods on it; those defined in
    Space and defined in World. Thus, our calls to addObject and removeObject should
    still work, and the gameOver call should work well


