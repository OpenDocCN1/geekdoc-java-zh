    \nFigure 1.9\n\nThe editor window of class **Rocket**\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_29_0.png)\n\
    \n## Chapter 1 Getting to know Greenfoot\n\nTip:\n\nYou can open an editor for\
    \ a class by double-clicking the class in the class diagram.\n\nWe have seen before\
    \ that the default initial firing speed of the rocket was fairly slow. We could\
    \ change this for every rocket individually by invoking a method on each new rocket,\
    \ but we would have to do this over and over again, every time we starting. Instead,\
