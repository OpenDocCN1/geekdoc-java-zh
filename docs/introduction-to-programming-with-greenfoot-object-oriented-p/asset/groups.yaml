- md: "\nIn this pattern, ElementType stands for the type of each element in the collection,\
    \ variable is a variable that is being declared here, so we can give it any name\
    \ we like, collection is the name of the collection we wish to process, and statements\
    \ is a sequence of statements we wish to carry out. This will become clearer with\
    \ an example.\n\nUsing our list named bodies, we can write\n\n```java\nfor (body\
    \ : bodies) {\n    body.move();\n}\n```\n\n(Remember that Java is case sensitive:\
    \ Body with an uppercase “B” is different from body with a lowercase “b”. The\
    \ uppercase name refers to the class, the lowercase name refers to a variable\
    \ holding index. The plural version—bodies—is another variable that holds the\
    \ whole list.\n\nWe can read the for-each loop a little more easily if we read\
    \ the keyword “for as”, the colon as “in”, and the opening curly bracket as “do”.\
    \ Then this becomes\n\n```java\nfor each body in bodies:...\n```\n\nThis reading\
    \ gives us a hint as to what this loop does: It will execute the statements in\
    \ the curly brackets for each element in the list bodies. If, there are three\
    \ elements in that list, the statements will be executed three times. Every time,\
    \ before the statements are executed, the variable body (declared in the loop\
    \ header) will be assigned one of the list elements. Thus, the sequence of action\
    \ will be\n\n```\nbody = first element from 'bodies'\nexecute loop statements;\n\
    body = second element from 'bodies'\nexecute loop statements;\nbody = third element\
    \ from 'bodies'\nexecute loop statements;\n...\n```\n\nThe variable body is available\
    \ to be used in the loop statements to access the current element from the list.\
    \ We could then, for example, call a method on object, as in the example shown\
    \ above, pass the object to another method for further processing.\n\nWe can use\
    \ this loop to apply gravity from all other bodies to this one:\n\n```java\nfor\
    \ (Body : bodies) {\n    applyGravity(body);\n}\n```\n\nIn this code, we just\
    \ take each element (stored in the variable body) and pass it to another method\
    \ named applyGravity, which we will have to write in a moment.\n\nWe should add\
    \ one more thing: Since bodies is a list of all bodies in space, it includes the\
    \ current object (the one we want to apply gravity to) as well. We do not need\
    \ to apply gravity of an object to itself, so we can add an if statement that\
    \ calls applyGravity only if the element from the list is not the current object\
    \ itself.\n\n## 6.9 Applying gravity\n\nThe result is shown in Code 6.6. Note\
    \ how the keyword this is used here to refer to the current\n\n### Code 6.6\n\
    ### Applying gravity from all other bodies in space\n\n```java\nprivate void applyForces()\
    \ {\n  List<Body> bodies = getWorld().getObjects(Body.class);\n  for (Body body\
    \ : bodies) {\n    if (body != this) {\n      applyGravity(body);\n    }\n  }\n\
    }\n/**\n * Apply the gravity force of a given body to this one.\n */\nprivate\
    \ void applyGravity(Body other) {\n  // work to do here\n}\n```\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_109_0.png)\n\
    \n### Applying gravity\n\nIn 6.6, we have solved the task of accessing each object\
    \ in space, but we have deferred the task of actually applying the gravitational\
    \ force. The method applyGravity (another example of a private method) still needs\
    \ to be written.\n\nThis is no little easier than before, though this method now\
    \ only needs to deal with two objects at a time: the current object, and one other\
    \ object specified in its parameter. We now want to apply the gravitational force\
    \ from the other object to this. This is where Newton's Law comes into play.\n\
    \nNewton's formula for gravitation looks like this:\n\n> $force = \\frac{mass1\
    \ \\times mass2}{distance^{2}} G$\n\nIn other words, to calculate the force to\
    \ apply to the current object, we need to multiply the mass of this object with\
    \ the mass of the other object, and divide by the square of the distance between\
    \ the two objects. Finally, the value multiplied by the constant G—the Gravitational\
    \ Constant.(You may remember that we have already defined a constant for this\
    \ value in our class, named GRAVITY.)\n\nIf you are very confident or adventurous,\
    \ you may like to try to implement the applyGravity method. You need to create\
    \ a vector in the direction from the current body to the other body, with a length\
    \ specified by this formula. For the rest of us, we now look at the finished implementation\
    \ of that method (Code 6.7).\n\n### Code 6.7\n### Calculating and applying gravity\
    \ from another body\n\n```java\n/**\n * Apply the gravity force of a given body\
    \ to this one.\n */\nprivate void applyGravity(Body other) {\n    double dx =\
    \ other.getExactX() - this.getExactX();\n    double dy = other.getYY() - this.getYY();\n\
    \    Vector force = new Vector(dx, dy);\n    double distance = Math.sqrt(dx *\
    \ dx + dy * dy);\n    double strength = GRAVITY * this.mass * other.mass / \n\
    \        (distance * distance);\n    double acceleration = strength / this.mass;\n\
    \    force.setLength(acceleration);\n    addForce(force);\n}\n```\n\nThis method\
    \ is not as complicated as it looks. First, we calculate the distances between\
    \ our object and the other object in the x and y coordinates (dx and dy). Then\
    \ we create new vector using these values. This vector now has the right direction,\
    \ but not for the correct length.\n\nNext, we calculate the distance between the\
    \ two objects using the Pythagoras theorem (a² + b² = c²) in right-angled triangles,\
    \ see Figure 6.7.\n\n### Figure 6.7\n### The distance in relation to dx and dy\n\
    \n![](img/9d90a1ac20b9439aba2e593bea21f58a_110_0.png)\n\nThis tells us that the\
    \ distance is the square root of dx squared plus dy squared. In our code (Code\
    \ 6.7), we use a method called sqrt from the Math class to calculate the square\
    \ root. (Math is a class in java.lang, and thus automatically imported.)\n\n##\
    \ 6.10 Trying it out\n\n**Exercise 6.21** Look up the class **Math** in the Java\
    \ documentation. How many parameters does the **sqrt** method have? What types\
    \ are they? What type does this method return?\n\n**Exercise 6.22** in the *Math*\
    \ class, find the method that can be used to find the maximum of two integers.\
    \ What is it called?\n\nThe next line in our code calculates the strength of the\
    \ force using Newton's formula of gravitation given above.\n\nThe final thing\
    \ is to calculate the acceleration, the actual movement change to our object is\
    \ not only determined by the force of gravity, but also the mass of our object:\
    \ the heavier the object, the slower it will accelerate. Acceleration is computed\
    \ using the following formula:\n\n```\nacceleration = \\frac{force}{mass}\n```\n\
    \nOnce we have calculated the acceleration, we can set our force vector to the\
    \ correct length and add this vector to the movement of our body. Doing this is\
    \ easy, using the `addForce` method that is provided by the `SmoothMover` class.\n\
    \n**Exercise 6.23** Map the variables in Code 6.7 to Newton's formula, the Pythagoras\
    \ theorem, and the acceleration formula given above. Which variable corresponds\
    \ to which part of which formula?\n\nWith this, our task is completed. (An implementation\
    \ of the code so far is available in the book scenarios as *Newtons-Lab-2*.)\n\
    This task clearly involved more background knowledge in math and physics than\
    \ the others we have seen. If this is not your favorite area, don't worry, we\
    \ shall return to it shortly. We have seen, however, that this is very hard to\
    \ simulate. Simulations can show that minute differences in the initial conditions\
    \ can make differences after a few billion years.\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_111_0.png)\n\
    \n### Trying it out\n\nNow we have completed our implementation of gravity, it\
    \ is time to try it out. We can start by using the ready-made scenarios in **Space**.\n\
    \n**Exercise 6.24** With your completed code, try out the three initialization\
    \ methods (`sunPlanet()`, `sunAndPlanets()`, `sunMoon()`). What do you observe?\n\
    \n**Exercise 6.25** Experiment with changes in gravity (the GRAVITY constant at\
    \ the top of **Body** class).\n\n**Exercise 6.26** Create some new set-ups of\
    \ stars and planets and see how they interact. Can you come up with a system that\
    \ is stable?\n\n##  Interacting objects: Newton's Lab\n\n**Pitfall** Be careful\
    \ when using the constructor of **Vector**. The constructor is overloaded: one-version\
    \ expects an **int** and a **double** as parameters, the other expects two **doubles**:\
    \ Thus\n\n```java\nnew Vector(32, 12.0)\n```\n\nwill call the constructor, while\n\
    \n```java\nnew Vector(32, 12.0)\n```\n\nresulting in an entirely different vector.\n\
    \nYou will quickly see that it is very hard to configure the parameters so that\
    \ the system remains stable for a long time. The combination of mass and gravity\
    \ will often result in objects crashing into other, or escaping from orbit. (Since\
    \ we have not implemented \"crashing into each other\", our objects can easily\
    \ fly through each other. When they get close, their forces become very large\
    \ and they often catapult each other onto strange trajectories.)\n\nSome of these\
    \ effects are similar to nature, although our simulation is a little inaccurate\
    \ due to some simplifications we have made. The fact that all objects act in sequence\
    \ rather than simultaneously will have an effect on the behavior and is not a\
    \ realistic representation. To make the simulation more accurate, we would have\
    \ to calculate all first (without moving) and then execute all moves according\
    \ to the previous calculations.\n\nWe can also ask the stability question about\
    \ our solar system. The orbits of the planets in our solar system are quite stable,\
    \ details about their movement are hard to predict accurately for a long time\
    \ into the future. We are quite certain that none of the planets will crash into\
    \ the Sun in the next few billion years, but small variations may occur. Simulations\
    \ such as ours (just much more accurate and detailed, but similar in principle)\
    \ have been used to predict the future orbits.\n\n> 3 If you are interested to\
    \ read more, Wikipedia is a good starting point: http://en.wikipedia.org/wiki/Stability_of_the_solar_system\n"
  mdcn: "\n在这种模式中，`ElementType` 代表集合中每个元素的类型，`variable` 是这里正在声明的变量，因此我们可以给它起任何名字，`collection`\
    \ 是我们想要处理的集合名称，而 `statements` 是我们想要执行的一系列语句。通过一个示例，这将变得更加清晰。\n\n使用我们名为 `bodies`\
    \ 的列表，我们可以这样写：\n\n```java\nfor (body : bodies) {\n    body.move();\n}\n```\n\n\
    （记住 Java 是区分大小写的：大写字母“B”的 `Body` 和小写“b”的 `body` 是不同的。大写名称指的是类，小写名称指的是持有索引的变量。复数形式——`bodies`\
    \ 是另一个持有整个列表的变量。）\n\n如果我们把关键字 `for` 读作“对于”，将冒号 `:` 读作“在”，将左大括号读作“执行”，那么这个 for-each\
    \ 循环就会更容易理解。这时它变成了：\n\n```java\nfor each body in bodies:...\n```\n\n这种读法为我们提供了关于这个循环作用的提示：它将对\
    \ `bodies` 列表中的每个元素执行大括号中的语句。如果该列表中有三个元素，这些语句将被执行三次。每次在执行语句之前，变量 `body`（在循环头中声明）都会被赋值列表中的一个元素。因此，动作序列将是：\n\
    \n```\nbody = first element from 'bodies'\nexecute loop statements;\nbody = second\
    \ element from 'bodies'\nexecute loop statements;\nbody = third element from 'bodies'\n\
    execute loop statements;\n...\n```\n\n变量 `body` 可以在循环语句中使用，以访问列表中的当前元素。例如，我们可以像上面的示例中那样调用对象上的某个方法，或者将对象传递给另一个方法进行进一步处理。\n\
    \n我们可以使用这个循环将所有其他天体的引力作用于当前的天体：\n\n```java\nfor (Body : bodies) {\n    applyGravity(body);\n\
    }\n```\n\n在代码代码中，我们获取每个元素（存储在变量 `body` 中）并将其传递给另一个名为 `applyGravity` 的方法，我们稍后将编写这个方法。\n\
    \n我们应该添加一点：由于 `bodies` 是空间中所有天体的列表，它也包含了当前对象（我们想要施加引力的对象）。我们不需要将一个对象的引力施加给它自己，因此我们可以添加一个\
    \ if 语句，只有当列表元素不是当前对象本身时才调用 `applyGravity`。\n\n## 6.9 应用引力\n\n结果显示在代码 6.6 中。注意关键字\
    \ `this`在这里被用来引用当前\n\n### 代码 6.6\n### 应用来自空间中所有其他天体的引力\n\n```java\nprivate void\
    \ applyForces() {\n  List<Body> bodies = getWorld().getObjects(Body.class);\n\
    \  for (Body body : bodies) {\n    if (body != this) {\n      applyGravity(body);\n\
    \    }\n  }\n}\n/**\n * 将给定天体的引力施加到当前对象。\n */\nprivate void applyGravity(Body\
    \ other) {\n  // work to do here\n}\n```\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_109_0.png)\n\
    \n### 应用引力\n\n在 6.6 中，我们解决了访问空间中每个对象的任务，但我们推迟了实际施加引力的任务。`applyGravity` 方法（另一个私有方法示例）仍然需要编写。\n\
    \n尽管这并不比以前容易多少，但此方法现在只需要同时处理两个对象：当前对象以及其参数中指定的另一个对象。我们现在想要将另一个对象的引力施加到当前对象上。这正是牛顿定律派上用场的地方。\n\
    \n牛顿万有引公式如下：\n\n> $force = \\frac{mass1 \\times mass2}{distance^{2}} G$\n\n换句话说，为了计算施加当前对象的力，我们需要将对象的质量与另一个对象的质量相乘，除以它们之间距离的平方，最后乘以常量\
    \ $G$。（你可能记得我们在类中已经定义了这个常量，名为 `GRAVITY`。）\n\n如果你非常有信心或喜欢冒险，你可能想尝试实现 `applyGravity`\
    \ 方法。你需要创建一个从当前天体指向另一个天体的向量，长度由该公式指定。对于剩下的部分，我们来看该方法的实现（代码 6.7）。\n\n### 代码 6.7\n\
    ### 计算并应用另一个天体的引力\n\n```java\n/**\n * 将给定天体的引力施加到当前对象。\n */\nprivate void applyGravity(Body\
    \ other) {\n    double dx = other.getX() - this.getX();\n    double dy = other.getY()\
    \ - this.getY();\n    Vector force = new Vector(dx, dy);\n    double distance\
    \ = Math.sqrt(dx * dx + dy * dy);\n    double strength = GRAVITY * this.mass *\
    \ other.mass / \n        (distance * distance);\n    double acceleration = strength\
    \ / this.mass;\n    force.setLength(acceleration);\n    addForce(force);\n}\n\
    ```\n\n这个方法看起来并不复杂。首先，我们计算对象与其他对象在 x 和 y 坐标上的距离（dx 和 dy）。然后使用这些值创建一个新向量。这个向量有了正确的方向，但还没有正确的长度。接下来，我们使用勾股定理（a²\
    \ + b² = c²）计算两个对象之间的距离，见图 6.7。\n\n### 图 6.7\n### 对应 dx 和 dy 的距离\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_110_0.png)\n\
    \n这告诉我们距离是 dx 的平方加上 dy 的平方的平方根。在我们的代码（代码 6.7）中，我们使用 Math 类中的一个 `sqrt` 方法来计算平方根。（Math\
    \ 是 java.lang 中的一个类，因此被自动导入。）\n\n## 6.10 尝试\n\n**练习 21** 查找 Java 文档中的 **Math**\
    \ 类**sqrt** 方法有多少个参数？它们是什么类型？该方法返回什么类型？\n\n**练习 22** 在 *Math* 类中，找到寻找两个整数最大值的方法。它叫什么名字？\n\
    \n我们代码中的下一行使用上述牛顿万有引公式计算力的强度。\n\n最后一步是计算加速度，对象的实际运动不仅取决于引力，还取决于对象的质量：对象越重，加速度越慢。加速度使用以下公式计算：\n\
    \n```\nacceleration = \\frac{force}{mass}\n```\n\n一旦我们计算出加速度，就可以将力向量设置为正确的长度，并将此向量添加到天体的运动中。这很容易，使用\
    \ `SmoothMover` 类提供的 `addForce` 方法。\n\n**练习 23** 将代码 6.7 中的变量映射到牛顿公式、勾股定理以及上述加速度公式。哪个变量对应哪个公式的哪个部分？\n\
    \n到此，我们的任务完成了。（到目前为止的代码实现可以在书中的场景 *Newtons-Lab-2* 中找到。）这个任务显然比我们看到的其他任务更多数学和物理背景知识。如果这不是你喜欢的领域，不要担心，我们很快会回到这里。然而，我们已经看到这很难模拟。仿真可以显示，初始条件的微小差异在几年后可能会产生巨大的差异。\n\
    \n![](img/9d90a1ac20b9439aba2e593bea21f58a_111_0.png)\n\n### 尝试\n\n现在我们完成了引力的实现，是时候尝试一下了。我们可以从使用\
    \ **Space** 中的现成场景开始。\n\n**练习 24** 使用你完成的代码，尝试三种初始化方法（`sunPlanet()`、`sunAndPlanets()`、`sunMoon()`）。你观察到了什么？\n\
    \n**练习 25** 实验引力的变化（**Body** 类顶部的 `GRAVITY` 常量）。\n\n**练习 26** 创建一些新的恒星和行星组合，看看它们是如何相互作用的。你能设计出一个稳定的系统吗？\n\
    \n## 交互对象：牛顿实验室\n\n**陷阱** 使用 **Vector** 的构造函数时要小心。构造函数是重载的：一个版本接受一个 **int** 和一个\
    \ **double** 作为参数，另一个接受两个 **double**：因此：\n\n```java\nnew Vector(32, 12.0)\n```\n\
    \n将调用构造函数，而\n\n```java\nnew Vector(32, 12.0)\n```\n\n会导致一个完全不同的向量。\n\n你会很快发现，要配置参数使系统长时间保持稳定是非常的。质量和引力的结合通常会导致对象相互碰撞或逃离轨道。（由于我们还没有实现“相互碰撞”，我们的对象可以很容易地穿过彼此。当它们靠近时，产生的力会变得非常大，它们经常会将彼此弹射到奇异的轨道上。）\n\
    \n这些效应与自然相似，尽管由于我们做了一些简化，我们的仿真并不完全准确。所有对象按顺序而非同时行动的事实会对行为产生影响，而且这不是真实的表示。为了让仿真更准确，我们必须先计算所有位置（而不移动），然后根据之前的计算执行所有移动。\n\
    \n我们还可以提出关于太阳系的稳定性问题。我们太阳系行星的轨道是非常稳定的，关于它们的运动细节在未来很长时间很难准确预测。我们非常确定在未来几十亿内没有行星会撞击太阳，但可能会出现微小变化。类似的仿真（只是更精确详细，但原理相似）已被用于预测未来的轨道。\n\
    \n> 3 如果你想了解更多，维基是一个很好的起点：http://en.wikipedia.org/wiki/Stability_of_the_solar_system\n\
    \n"
