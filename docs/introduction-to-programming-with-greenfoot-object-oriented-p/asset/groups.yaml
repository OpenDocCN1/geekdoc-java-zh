    # INTERLUDE 1


    # Sharing your scenarios


    In this section, we will not introduce new programming techniques, but rather
    go on a quick detour to discuss how you can share what you have created with others.
    The “others” may be your friend sitting next to you, or another Greenfoot programmer
    on the other side of the world. In times of the global Internet this does not
    make much difference anymore.


    # I1.1 Exporting your scenarios


    When you have finished writing a scenario—maybe a game or a simulation—you may
    want to enable others to use it. Those users have the opportunity to start (restart)
    the game, but they do not need access to the class diagram or the source code.
    They should not modify the game, instead they just use it.


    In Greenfoot, this is by exporting the scenario. You can export your scenario
    by selecting *Export* from the *Scenario* menu. This will show a dialog that lets
    you choose from three export options: *Application, Webpage,* and *Publish*.


    # I1.2 Export to application


    The first option is to export an application. An application is a stand-alone
    program that users can execute locally on their computer.


    Do to this, choose *Application* in the export dialog. You can then choose a location
    and a name for the executable scenario that you are about to create (Figure 11.1).


    For a scenario to work well exported, it is important that it creates all the
