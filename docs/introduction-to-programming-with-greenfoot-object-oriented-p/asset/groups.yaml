    from the Java library |

    | concepts: | collection, list, for-each loop, standard class library |


    In this chapter, we shall investigate more sophisticated interactions between
    objects in a world. As a start, we shall investigate one of the most universal
    interactions between objects anywhere: Gravity.


    In this scenario, we are dealing with celestial bodies (such as stars and planets).
    We shall simulate the motion of these bodies through space, using Newton''s law
    of universal gravitation. We now know that Newton''s formulas are not quite accurate,
    and Einstein''s theory of general relativity describes the motions of planets
    more precisely, but Newton is still good enough for our simulation. Both are shown
    in Figure 6.1.


    If you are worried dealing with physics and formulas, don''t worry. We do not
    need to go very deep into it, and the formula we shall use is really quite simple.
    At the end, we shall turn this scenario into an artistic experiment with sound
    and visual effects. If you are more technically interested, you can work more
    on the physics.


