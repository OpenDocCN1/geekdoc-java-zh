  - '[PAGE 160]


    # **Exercise 9.3** Are the current populations stable? That is, does it always
    continue to run without one of the species dying out? If species become extinct,
    what is the average time they survive?


    Does the size of the field matter? For example, imagine we have a national park
    with an end-angered species. And someone wants to build a freeway through the
    middle of it the animals cannot cross, essentially dividing the park into two
    parts of half the size. The proponents of the freeway might argue that this does
    not matter because the total size of park is the same as before. The park authority
    might argue that this is bad because it halves the size of each park. Who is right?
    Does the size of a park matter? Do some experiments.


    # **Exercise 9.4** The *Field* class has definitions of constants up to the top
    of its source code for its width and height. Modify these constants to change
    the size of the field. Does the size of the field affect the stability of the
    populations? Do species die out easily if the field is smaller or larger? Or does
    it make difference?


    Other parameters with which we can experiment are defined in constants at the
    top of the Rabbit and Fox classes. Rabbits have definitions for their maximum
    age, the age from which they breed, the frequency of breeding (as a probability
    for each step), and the maximum size of their litter when they breed. Foxes have
    the same parameters and an additional one: the nutritional value of a rabbit when
    it is eaten (expressed as the number of steps that the fox can survive eating
    the rabbit). The food level of a fox decreases by one in every step and increases
    when eating a rabbit. If it reaches zero, the fox dies.


    # **Exercise 9.5** Choose a field size in which the populations are almost stable
    but occasionally die out. Then make changes to the *Rabbit* parameters to increase
    the chances of the populations'' survival. Can you find settings that make the
    populations more stable? Do some settings make them less stable? Are the observed
    effects as you expected, or do some differ from your expectations?


    # **Exercise 9.6** If the fox population is in danger of becoming extinct occasionally,
    we could speculate that we could improve the chances of *foxes''* survival by
    increasing the food value of rabbits. If foxes can live longer on eating a single
    rabbit, they should starve less often. Investigate this hypothesis. Double the
    amount of *RABBIT_FOOD_VALUE* constant and test. Does the fox population survive
    longer? Explain the result.


    # **Exercise 9.7** Make other changes to the *Fox* parameters. Can you make the
    populations more stable?


    The exercises show that we can experiment with this simulation by changing some
