    # # The List type


    Dealing with collections of objects is important both in Greenfoot programming
    and in pro-

    gming in general. Several of the Greenfoot methods return collections of objects
    as their

    result, usually in the form of a list. The type of the returned object then is
    the List type from the

    java. package.


    > Concept:

    A Collection is a

    kind of object that

    can hold many

    other objects.


    > Concept:

    A List is an exam-\ple of collection.

    Some methods

    from the Greenfoot

    API return List

    objects.


    **Side Note: Interfaces**


    The **List** is a different from other object types we have seen: It is not a
    class, but an

    **Interface**. Interfaces are a Java construct that provides an abstraction over
    possible

    implement classes. The details are not important to us right now—it is sufficient
    to know

    t we can deal with the **List** in similar ways as other types: We can look it
    up in the

