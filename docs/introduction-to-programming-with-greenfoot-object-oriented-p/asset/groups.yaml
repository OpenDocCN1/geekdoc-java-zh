    我们使用了两种不同的检测方法：`getIntersectingObject` 和 `getInRange`。它们在某些情况下各有优劣。后者向我们返回一个参与者（actors）列表，因此我们必须再次处理列表。\n\
    \n理解列表和循环起初相当困难，但在编程中非常重要，所以如果你还不熟练使用它们，应该仔细检查你代码中的这些部分。练习得越多，就越容易。在使用一段时间后，你将会惊讶于起初竟然觉得它们那么难。\n\
