    # 2.4 Dealing with screen edges


    21


    # Side note: Errors


    Concept:


    When we write source code, we have to be very careful—every single character counts.
    Getting one thing wrong will result in our program not working. Usually, it will
    not compile.


    When a class is compiled, the compiler checks to see whether there are any errors.
    If an error is found, an error message is displayed.


    This will happen to us regularly: When we write programs, we inevitably make mistakes,
    and then we have to correct them. Let us try that out.


    If, for example, we forget to write the semicolon after the move () instruction,
    we will be told about it when we try to compile.


    +   Exercise 2.7 Open your editor to show the crab''s source code, and remove
    the colon after move(). Then compile. Experiment with other errors, such as misspelling
    move or making other random changes to the code. Make sure to check it back after
    this exercise.


    +   Exercise 2.8 Make various changes to cause different error messages. Find
    at least five different error messages. Write down each error message and what
    you introduced to prove this error.


    # Tip:


    When an error message appears at the bottom of the editor window, a question mark
    button appears to the right of it. Clicking this button displays some additional
    information about the error message.


    As we can see with this exercise, if we get one small detail wrong, Greenfoot
    will open the editor, highlight a line, and display a message at the bottom of
    the editor window. The message attempts to explain the error. The messages, however,
    vary considerably in accuracy and usefulness. Sometimes they tell us fairly accurately
    what the problem is, but sometimes they are cryptic and hard to understand. The
    line that is highlighted is often the line where the problem is, but sometimes
    it is the line after the problem. When you see, for example, *expected* message,
    it is possible that the semicolon is in fact missing on the line above the highlighted
    line.


    We will learn to read these a little better over time. Now, if you get a message
    and you are unsure what it means, look very carefully at your code and check that
    you have typed everything correctly.


    # Dealing with screen edges


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_37_0.png)


    When we make the crabs and turn in the previous sections, they got stuck when
    they reached the edge of the screen. (Greenfoot is designed so that actors cannot
    leave the world and fall off it.)


    Now, we will improve this behavior so that the crab notices that it has reached
    the world edge and turns around. The question is, How can we do that?'
