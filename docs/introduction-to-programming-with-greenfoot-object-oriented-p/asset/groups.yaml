    The act method is a very fundamental method of Greenfoot objects. We shall encounter
    regularly in all the following chapters. All objects in a Greenfoot world have
    this method. Invoking act is essentially giving the object instruction “Do whatever
    you want to do”. If you tried out for our wombat, you will see that the wombat’s
    act does something like the following:


    - If we''re sitting on a leaf, eat the leaf.

    - Otherwise, if we can move forward, move forward.


