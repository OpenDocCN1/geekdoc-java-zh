    ![](img/9d90a1ac20b9439aba2e593bea21f58a_151_0.png)


    # 第 8 章 创建图像和声音


    为我们的演员和背景获取图像的第二种方法是通过程序绘制它们。我们在早期章节的某些场景中见过这种方法的示例，例如，当我们在小行星程序中绘制星空时。


    图像中的每个像素由两个值定义：它的颜色值和它的透明度值（也称为 *alpha 值*）。


    颜色值再次被分为三个部分：红色、绿色分量和蓝色分量。以这种方式表示的颜色通常被称为 RGB 颜色。


    这意味着我们可以用四个数字来表示一个像素（带有颜色和透明度）。通常的顺序如下：


    - ( R, G, B, A )


    即也就是说，前三个值定义了红色、绿色和蓝色分量（按此顺序），最后一个是 alpha 值。


    在 Java 中，所有这些值都在 [0...255] 范围内（包含 0 到 255）。颜色值 0 表示该分量没有颜色，而 255 是全强度。alpha 值为
    0 是完全透明的（不可见的），而 255 是不透明的（实心的）。


    图 8.2 显示了一些可能的颜色对照表，没有透明度（alpha = 255）。图 8.2 中的表格是使用 Greenfoot 场景颜色表生成的，该表位于书中的
    chapter08 文件夹中。


    > ³ 这只是表示颜色的一种可能模型。在计算机图形和打印领域还有其他模型。然而，这是 Java 编程中最常用的，因此我们在这里将重点关注这种模型。


