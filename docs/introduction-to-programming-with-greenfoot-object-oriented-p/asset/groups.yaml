    is facing, it can also fire in all directions.


    The next challenge is to make it forward.


    ## 7.4 Flying forward


    Our Rocket is a subclass of the SmoothMover class, which we have already seen
    in the previous chapter. This means that it holds a movement vector that determines
    its movement, and that it has a move() method that makes it move according to
    this vector.


    Our first step is make use of this move() method.


