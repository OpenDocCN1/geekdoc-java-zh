    ## 12 第 1 章 认识 Greenfoot


    在下方，我们看到另一组六个类，由箭头连接。从底部向上读，我们有火箭（rockets）、子弹（bullets）和小行星（asteroids），它们都是“移动者”（movers），而移动者和爆炸（explosions）是执行者（actors）。


    同样，我们有子类关系：例如，`Rocket` 是 `Mover` 的子类，而 `Mover` 是 `Actor`。子类关系可以跨越多个级别：例如，`Rocket`
    是 `Mover` 的子类，而 `Mover` 又是 `Actor`。


    `Vector` 类位于图表底部“Other classes”（其他类）标题下，是一个被其他类使用的辅助类。我们无法放置它的对象 ![](img/9d90a1ac20b9439aba2e593bea21f58a_28_0.png)


