    # Figure 4.1


    The coordinate system of the world


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_61_0.png)


    We are using two new things here: the addObject method, and the new statement
    to create the new crab.


    The addObject method is a method of the World class. We can look it up by looking
    at the class classification for class World. There, we see that it has the following
    signature:


    ```

    void addObject(Actor object, int x, int y)

    ```


    Reading the signature from start to finish, this tells us the following:


    +   - The method does not return a result (void return type).

    - The name of the method is addObject.

    - The method has three parameters, named object, x, and y.

    - The type of the first parameter is Actor, the type of the other two is int.


    This can be used to add a new actor into the world. Since the method belongs to
    the World class and CrabWorld is a World (it inherits from the World class), this
    method is available in our CrabWorld class, and we can just call it.


    # 4.2 Creating new objects


    The addObject method allows us to add an actor to the world. However, in order
    to add an object, we must first have an object to add.


    The Java keyword allows us to create new objects of any of the existing classes.
    For example, the expression


    ```

    new Crab()

    ```


    creates new instance of class Crab. The expression to create new objects always
    starts with the new keyword, followed by the name of the class we wish to create
    and a parameter list (which is empty in example). The parameter list allows us
    to pass parameters to the constructor. Since we did not specify a constructor
    for our Crab class, the default parameter list is empty.


    > Concept:

    Java objects can be created programmatically (from within your code) using the
    new keyword.'
