    eating leaves. The scenario has no purpose other than illustrating some object-oriented
    concepts and Greenfoot interactions.


    Asteroids 1 (Chapter 1)

    This is a simple version of a classic arcade game. You fly a spaceship through
    space and try to avoid hit by asteroids. At this stage, we only use the scenario
    to make small changes and illustrate some basic concepts.


    Little Crab (Chapter 2)

    This is our first full development. Starting from almost nothing, we develop a
    simple game slowly, adding many things such as movement, keyboard control, sound,
    and many other elements of typical games.


    Piano (Chapter 5)

    An on-screen piano that you can really play.


    Newton''s Lab (Chapter 6)

    Newton''s Lab is a simulation of the motion of stars and planets in space. Gravity
    plays a central role here. We also make a variant of this that combines gravity
    with making, ending with output triggered by objects under gravitational movement.


    Asteroids 2 (Chapter 7)

    We come back to the asteroids example from Chapter 2. This time, we investigate
    more fully how to implement it.


    Ants (Chapter 9)

    A simulation of ant colonies searching for food, communicating via drops of pheromones
    left on the ground.


    The following scenarios are presented in Chapter 10 and selected aspects of them
    briefly discussed. They are intended as inspiration for further projects.


    Marbles

    A simulation of a marble board game. Marbles have to be cleared of the board within
    a limited number of moves. Contains simple physics.'
