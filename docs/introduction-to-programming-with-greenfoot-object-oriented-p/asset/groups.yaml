    \ of this image. |\n\n## APPENDIX C\nCollision detection\n\nIn this book, various\
    \ collision detection methods are used in different situations. Following is a\
    \ summary of the collision detection methods available for Greenfoot actors, and\
    \ a short explanation of their purpose and when to use them.\n\n## C.1 Method\
    \ summary\n\nGreenfoot's collision detection methods can be found in the Actor\
    \ class. There are six relevant methods. They are as follows:\n\n- *getIntersectingObjects(Class\
    \ cls)*\n  Return all the objects that intersect this object.\n\n- *getOneIntersectingObject(Class\
    \ cls)*\n  Return an object that intersects this object.\n\n- *getObjectsAtOffset(int\
    \ dx, int dy, Class cls)*\n  Return all the objects that intersect the given location\
    \ (relative to this object's location).\n\n- *getOneObjectAtOffset(int dx, int\
    \ dy, Class cls)*\n  Return one object that is located at the specified cell (relative\
    \ to this object's location).\n\n- *getNeighbours(int distance, boolean diagonal,\
    \ Class cls)*\n  Return the neighbours to this object within a given distance.\n\
    \n- *getObjectsInRange(int r, Class cls)*\n  Return all objects within range 'r'\
    \ around this object.\n\n## C.2 Convenience methods\n\nTwo of the methods, getIntersectingObjects\
    \ and getObjectsAtOffset, have associated convenience methods, starting with getOne....\n\
    \nThese convenience methods work in very similar ways as the method they are based,\
    \ but they return a single actor instead of a list of actors. In cases where multiple\
    \ actors could be found (e.g., other actors intersect with ours at the same time),\
    \ the variant returning a list returns all the relevant actors. The variant returning\
    \ a single actor randomly picks one of the intersecting\n\nThe purpose of these\
    \ convenience methods is just to simplify code: Often, we are only interested\
    \ in a single intersecting actor. In those cases, the convenience method allows\
    \ us to handle the actor without having to use a list.\n\n## C.3 Low versus high\
    \ resolution\n\nAs we have seen throughout this book, the resolution (cell size)\
    \ of Greenfoot worlds can vary. This is relevant for collision detection, as we\
    \ will often use different methods, depending on the resolution.\n\nWe distinguish\
    \ two cases: low-resolution worlds, where the entire actor image is completely\
    \ contained within a single cell (Figure C.1 a) and high-resolution worlds, where\
    \ the image of an actor spans multiple cells (Figure C.1 b).\n\nFigure C.1\nExamples\
    \ of low and high resolution in Greenfoot worlds\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_186_0.png)\n\
    \n![](img/9d90a1ac20b9439aba2e593bea21f58a_186_1.png)\n\na) a low-resolution world\n\
    \nb) a high-resolution world\n\n## C.4 Intersecting objects\n\nList getIntersectingObjects(Class\
    \ cls)\nReturn all the objects that intersect this object.\n\nActor getOneIntersectingObject(Class\
    \ cls)\nReturn an actor that intersects this object.\n\nThese methods return other\
    \ actors whose image intersects with the calling actor's image. Images intersect\
    \ when any part of one image touches any part of another image. These methods\
    \ are most useful in high-resolution scenarios.\n\nIntersection is computed using\
    \ bounding boxes, so overlap of fully transparent parts of the images is also\
    \ treated as intersection (Figure C.2).\n\n## C: Collision detection\n\nFigure\
    \ C.2\nIntersection of actors using their bounding boxes\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_187_0.png)\n\
    \nThese methods are often used to check whether one actor has run into another\
    \ kind of actor. The inaccuracy resulting from using bounding boxes (rather than\
    \ the visible part of the image) can often be neglected.\n\nThe parameter can\
    \ be used as a filter. If a class is specified as a parameter to these methods,\
    \ only objects of that class are considered and all other objects are ignored.\
    \ If null is used as a parameter, any intersecting object is returned.\n\n## C.5\
    \ Objects at offset\n\nMethods:\n\n```\nListObjectsAtOffset(int dx, int dy, Class\
    \ cls)\nReturn all objects that intersect the given location (relative to this\
    \ object's location).\n```\n\n```\nActor getOneObjectATOffset(int dx, int dy,\
    \ Class cls)\nReturn one object that is located at the specified cell (relative\
    \ to this objects' location).\n```\n\nThese methods can be used to check for objects\
    \ at a given offset from an actor’s current location. They are useful for both\
    \ low- and high-resolution scenarios.\n\nThe dx and dy parameters specify the\
    \ offset in number of cells. Figure C.3 illustrates the location at offset (2,0)\
    \ from the wombat (2 cells offset along the x-axis).\n\nFigure C.3\nChecking a\
    \ given offset from a location\n(example here:\noffset 2,0)\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_187_1.png)\n\
    \n## Appendices\n\nAnother actor is considered to be at offset if any part of\
    \ its image intersects with the center point of the specified cell. The cls parameter\
    \ provides the option to filter the objects to be considered (see above).\n\n\
    These methods are often used to check an area in front of an actor (to test whether\
    \ it can move) or below an actor (to check whether it is standing on something).\n\
    \n## C.6 Neighbors\n\nMethod:\n\n```\nList getNeighbours(int distance, boolean\
    \ diagonal, Class cls)\nReturn the neighbours to this object within a given distance.\n\
    ```\n\nThis method is used to retrieve objects from cells surrounding the current\
    \ actor. It is useful mainly in low-resolution scenarios.\n\nNote the spelling\
    \ of the method name: It is really getNeighbours (with British spelling)—Greenfoot\
    \ specify not an American system.\n\nThe parameters specify the distance from\
    \ the actor that should be considered and whether diagonally cells should be included.\
    \ Figure C.4 illustrates the neighboring cells at distance I, with without diagonals\
    \ included.\n\nA distance of N is defined as all cells that can be reached in\
    \ N steps from the actor's position. The diagonal parameter determines whether\
    \ diagonal steps are allowed in this algorithm.\n\nAs with the previous methods,\
    \ the cls parameter provides the option to consider objects of a given class.\n\
    \nFigure C.4\nExample of the getNeighbours method\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_188_0.png)\n\
    \n![](img/9d90a1ac20b9439aba2e593bea21f58a_188_1.png)\n\n## C.7 Objects in range\n\
    \nMethod:\n\n```\nList getObjectsInRange(int r, Class cls)\nReturn all objects\
    \ within range 'r' around this object.\n```\n\nThis method returns all objects\
