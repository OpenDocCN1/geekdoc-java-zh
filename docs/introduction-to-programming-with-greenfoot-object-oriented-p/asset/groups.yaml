    # 电梯


    电梯模拟的开始。在现阶段尚不完整——可以作为一个项目的起点。


    # 鸟群 (Boids)


    一个展示群集行为的演示：一群鸟在屏幕上飞过，目标是在避开障碍的同时聚在一起。


    # 圆形


    用移动的圆形在屏幕上绘制不同颜色的图案。


    # 爆炸


    一个更复杂的爆炸效果演示。


    # 打砖块 (Breakout)


    这是经典游戏“打砖块”实现的开端。非常不完整，但具有有趣的视觉效果。


    # 平台跳跃游戏


    一个非常受欢迎的游戏类型——平台跳跃游戏——的部分实现演示。


    # 波


    该场景是一个物理效果的简单演示：波在弦上的传播。


    # 前言


    Greenfoot 是一个编程环境，可以用于个人、学校或大学入门课程的教学学习，用于学习和教授编程原理。它足够灵活，不仅适用于青少年，也适用于年长的学生。


    Greenfoot 支持 Java 编程语言，因此学生可以在 Java 中学习标准的面向对象编程。该环境的设计旨在以简洁、易于获取的方式传递面向对象的概念和原理。


    Greenfoot 环境使得图形创建和交互变得简单。学生可以专注于修改动画逻辑，并与对象进行参与和交互。开发模拟和交互式游戏变得容易了，且反馈是实时的。


    该环境的设计旨在快速吸引那些可能对编程没有先验兴趣或经验的学生。获得简单的动画结果非常快，而且可以实现复杂的、看起来专业的场景。


    # 访问补充材料


    书中提到的学习辅助和补充材料可以通过 Greenfoot 网站或出版商网站访问：


    **伴侣网站：** http://www.greenfoot.org/book/

    **出版社网站：** http://www.prenhall.com/kolling


    # 为学生提供的补充材料


    以下补充材料可供学生使用：


    - Greenfoot 软件

    - 本书中讨论的场景

    - Greenfoot 画廊——一个场景展示平台

    - 教程视频

    - 讨论论坛

    - 技术支持


    # 为教师提供的补充材料


    以下补充材料可供教师使用：


    - 教师讨论论坛

    - 与书籍相关的额外练习题

    - 包含工作单和其他教学资源的“绿室”(Green Room)


    有关关于 Greenfoot 和此书的更多信息，请参阅致谢后的引言。


    # 致谢


    这本书是一组人多达五年工作的成果。首先最重要的是那些对 Greenfoot 环境开发做出贡献的人们，这使得整个教学方法成为可能。Poul Henriksen
    从他的硕士项目开始启动 Greenfoot 的实现，并构建了第一个原型。他还将该原型开发成了一个生产系统。在第一年左右的时间，我们是一个双人项目，Poul
    的工作确保了当前系统的质量和健壮性。


    Bruce Craig 和 Davin McCall 是接下来加入项目的开发人员，Poul、Bruce 和 Davin 共同构建了今天 Greenfoot
    的大部分内容。这三位都是卓越的软件开发者，他们对项目的贡献不言而喻。与他们一起工作是一件乐事。


    最终，“蓝组”参与了 Greenfoot 项目，包括 John Rosenberg 和 Ian Utting，这本书建立在所有成员的贡献和共同工作基础之上。


    肯特大学实验室的同事们也给了我很大帮助，特别是我们的系主任 Simon Thompson，他很早就看到了 Greenfoot 的价值，并支持且鼓励其进一步开发。


    另一个重要的贡献——如果没有 Greenfoot 的开发（最终，以及这本书）将无法实现——是太阳微系统公司（Sun Microsystems）的慷慨支持。El
    Sarpa、Katherine Hartley、Jessica Orquina、Sarah Hammond 以及太阳公司的许多其他人相信我们系统的价值，并提供了重要的支持。


    培尔逊教育（Pearson Education）的每个人都努力让这本书出版，进度表非常紧，而且有时是在困难的情况下完成的。Tracy Dunkberger
    从一开始就和我们一起工作。她很好地保持了乐观态度并鼓励我继续写下去，Melinda Henrietta 则处理了许多不同的事务。


    特别感谢这本书的评审员，他们提供了非常详尽、周全且有效的反馈。他们是：Carolyn Oates, Danielle Persson, Detlef Rik,
    Gunnar Johnannesmeyer, Josh Fishburn, Mark Hayes, Marla Parker, Matt Judd。


    # 引言


    欢迎来到 Greenfoot！在书中，我们将使用 Java 编程语言和 Greenfoot 环境讨论如何编程，例如模拟和游戏。


    这样做有几个目标：一个是学习编程，另一个是在过程中获得乐趣。虽然我们在书中讨论的示例特定于 Greenfoot 环境，但这些概念是通用的：学习这本书将学到通用的原理。


    这本书非常注重实践。章节和练习是围绕真实的开发任务构建的。首先，有一个我们需要解决的问题，然后我们查看帮助解决该问题的语言构造和策略。这与许多围绕语言构造构建的编程教材非常不同。


    更具实践性并不意味着这本书没有涵盖必要的理论和原理。只是顺序改变了。我们不是先从理论上介绍一个概念，然后对其进行练习，而是直接投入并使用一个构造，稍后再回到理论背景。我们通常遵循螺旋式方法：我们在遇到一个概念时引入它的某些方面，然后在另一个语境下再次访问，并逐渐加深理解。


    贯穿其中的重点是让工作变得有趣、相关且愉快。没有理由计算机编程必须是枯燥、正式或无味的。在过程中获得乐趣是可以的。通过这种方式，我们可以让体验既有趣在教学上也是合理的。这种方法被称为“严肃的乐趣”——我们在变得有趣的同时也学到了有用的东西。


    这本书既可以作为自学书，也可以作为编程课程的教材。书中贯穿练习——如果你完成了所有的练习，你将成为一名相当称的程序员。


    '
