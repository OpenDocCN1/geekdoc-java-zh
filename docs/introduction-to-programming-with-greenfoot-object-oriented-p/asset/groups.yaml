- md: "\n## 6.11 Gravity and music\n\nSeeing how difficult it is to come up with parameters\
    \ to create a system that is stable for a limited time, we might be surprised\
    \ that our solar system is as stable as it is. But there is an explanation: When\
    \ the solar system formed, material from a gas cloud surrounding the Sun formed\
    \ into lumps that slowly grew by colliding with other lumps of matter and combining\
    \ to form ever-growing objects. Initially, there were countless of the lumps in\
    \ orbit. Over time some fell into the Sun, escaped into deep space. This process\
    \ ends when the only chunks are left separated from one another and generally\
    \ have stable orbits.\n\nIt would be possible to create a simulation that models\
    \ this effect. If we correctly model the growth of planets out of billions of\
    \ small, random lumps of matter, we would observe the effect: Some large planets\
    \ that are left in stable orbits. But for this, we would need a much more detailed\
    \ and complicated simulation and a lot of time: Simulating this effect would take\
    \ a very, long time, even on very fast computers.\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_113_0.png)\n\
    \n## Gravity and music\n\nBefore we leave our Newton's Lab scenario behind, we\
    \ have one more thing to play with: adding music. Well, noise, in any case.⁴\n\
    \nThe idea is as follows: We add a number of Obstacles into our world. When obstacles\
    \ are touched by our planets, they make a sound. Then we create new planets or\
    \ stars, let them fly around, and see what happens.\n\nWe will not discuss this\
    \ implementation in detail. Instead, leave you to it yourself, and just point\
    \ out some of the most interesting features. You can find an implementation of\
    \ this idea in the book scenarios Newton-Lab-3.\n\nExercise 6.28 Open the scenario\
    \ named Newton-Lab-3 and run it. Have a look at the source code. Try to understand\
    \ how it works.\n\nHere is a summary of the most interesting changes we have made\
    \ from the previous version to create this:\n\n- We added a new class Obstacle.\
    \ You can easily see objects of this class on screen. Obstacles have two images:\
    \ the orange rectangle you see most of the time, and a lighter version of the\
    \ rectangle to show when they are touched. This is used to create the \"lighting\
    \ up\" effect. Obstacles are also associated with a sound file, just as the piano\
    \ keys were in our piano scenario. In fact, we are reusing the sound files from\
    \ the piano scenario, so they do the same sound.\n- We modified the Body class\
    \ so that bodies bounce off the edges of the screen. This gives a better effect\
    \ for this kind of scenario. We have also increased a gravity to get faster movement\
    \ and modified the code so that bodies automatically slow down once they get too\
    \ fast. They might speed up each other more and more indefinitely.\n> ⁴ The idea\
    \ to add sound to gravity project was inspired by Kepler’s Orrery (see https://keplers-orrery.dev.java.net/\
    \ or search for “Kepler’s Orrery” on YouTube).\n\n- Finally, we have added code\
    \ in the Space class to create a fixed row of obstacles, and to create five random\
    \ planets (random size, mass, and color).\n\nThe implementation of these three\
    \ changes includes a few interesting snippets of code that are worth pointing\
    \ out.\n\n- In the Obstacle class, we use a method named getIntersectingObject\
    \ to check whether the obstacle is being hit by a planet. The code pattern is:\n\
    \n```\nObject body = getIntersectingObject(Body.class);\nif (body != null)\n{\n\
    \  }\n```\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_114_0.png)\n\nThe getIntersectingObject\
    \ method is defined in class Actor, and is available to all actors. It will return\
    \ an actor that one intersects if there is such an actor, or null if no other\
    \ actor intersects with this. The following statement checks whether body is null\
    \ to check whether any other object intersects this one.\n\nThis is an example\
    \ of collision detection, and we will discuss more of it in the next chapter.\n\
    \n- In the Space class, we have added two methods, createObstacles and randomBodies.\
    \ The first creates the obstacles with their associated sound file names, quite\
    \ similar to the initialization code in the piano example. The second uses a while\
    \ loop to create a number of Body objects. The bodies are initialized with random\
    \ values. The while loop counts down from a given number to 0, to create the right\
    \ number of objects. It is worth studying as another example of a loop.\n\nExercise\
    \ 6.29 Change the number of bodies that are created by default in this scenario.\n\
    \nExercise 6.30 Play with the movement parameters to see whether you can create\
    \ movement for the planets. The parameters are: the value for GRAVITY; the acceleration\
    \ used when bouncing off an edge (currently 0.9); the speed threshold (currently\
    \ 7) and acceleration (0.9) using the applyForces method to slow down fast objects;\
    \ and the initial mass used for the planets (in the Space class).\n\nExercise\
    \ 6.31 Create a different arrangement of obstacles in your scenario.\n\nExercise\
    \ 6.32 Use different sounds (different sound files) for your obstacles.\n\n##\
    \ 6.12 Summary of programming techniques\n\n**Exercise 6.33** Use different images\
    \ for your obstacles.\n\n**Exercise 6.34** Make planets change color every time\
    \ they bounce off the edge of the universe.\n\n**Exercise 6.35** Make planets\
    \ change color every time they hit an obstacle.\n\n**Exercise 6.36** Make a different\
    \ kind of obstacle that switches on and off by being hit. When, on, it continuously\
    \ blinks and controls a sound at fixed intervals.\n\n**Exercise 6.37** Add some\
    \ keyboard control. For example, pressing the right arrow could add a small force\
    \ to the right to all **Body** objects.\n\n**Exercise 6.38** Allowing more planets.\
    \ A mouse click into the universe while it is running should create a new planet\
    \ at that location.\n\nThere are countless possible ways to make this scenario\
    \ more interesting and nice to look at. Invent some of your own and implement\
    \ them!\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_115_0.png)\n\n## Summary of\
    \ programming techniques\n\nIn this chapter, we have touched on a number of new\
    \ concepts. We have seen a new scenario—Newton’s Lab—that simulates planets and\
    \ space. Simulations in general are a very interesting topic, and we will come\
    \ back to them in Chapter 9.\n\nWe have seen two helper classes, Smoothover and\
    \ Vector, both of which help us create more movement.\n\nOne of the most important\
    \ new this chapter was the use of additional classes from the standard library.\
    \ We have used Color, Math, and List.\n\nAnother addition to our tool set was\
    \ the use of a new loop: the *for-each* loop. This loop is used to process every\
    \ element of a collection.\n\nFor-each loops are especially useful when processing\
    \ objects from a collection. However, they cannot be used without a collection,\
    \ and they do not provide an index while processing the elements. If we need an\
    \ index, then we must use a for loop or a while loop instead.\n\nAnd finally,\
    \ we have seen some more useful methods from the Greenfoot API, as the getObjects\
    \ method from the World class and the getIntersectObject method from the Actor\
    \ class. The last one leads us into the more general area of collision detection,\
    \ we shall discuss in more detail in the next chapter, where we pick up the *Asteroids*\
    \ game again.\n\n## Concept summary\n\n- Overloading is the use of the same method\
    \ name for different methods or constructors.\n- The keyword this is used to call\
    \ one constructor from another, or to refer to the current object.\n- A constant\
    \ is a named value that can be used in similar ways as a variable, but can never\
    \ change.\n- The Java class library is a large collection of ready-made classes,\
    \ provided with the Java system. We can use these classes by using an import statement.\n\
    - Private methods are only visible from within the class they are declared in.\
    \ They are used to improve the structure of the code.\n- The keyword null stands\
    \ for \"nothing\" or \"no object\".\n- A collection is a kind of object that can\
    \ hold many other objects.\n- A List is an example of a collection. Some methods\
    \ from the Greenfoot API return List objects to us.\n- A generic type is a type\
    \ that receives a second type name as a parameter.\n- The for-each loop is another\
    \ kind of loop. It is well suited to process all elements of a collection.\n-\
    \ The Greenfoot API contains methods for collision detection. These make it possible\
    \ to detect when one actor touches another.\n"
  mdcn: "\n\n## 6.11 引力与音乐\n\n看到要设计出参数来创建一个在有限时间内稳定的系统是何等困难，我们可能会对太阳系竟然如此稳定感到惊讶。但对此有一个解释：当太阳系形成时，环绕在太阳的气云中的物质形成了团块，这些团块通过与其他物质团块碰撞并合并，逐渐生长成巨大的物体。最初，轨道上有无数个这样的团块。随着时间的推移，有些团块落入太阳，有些则逃逸到深空。当只剩下碎块相互分离且通常具有稳定轨道时，这个过程就结束了。\n\
    \n我们可以创建一个模拟这种效果的程序。如果我们能正确模拟行星从数十亿个微小的随机物质团块生长的过程，我们就能观察到这种效果：一些留在稳定轨道上的大型行星。但为了实现这一点，我们需要更详细、更复杂的模拟以及大量的时间：模拟这种效果需要非常长的时间，即使在速度很快的计算机上也是。\n\
    \n![](img/9d90a1ac20b9439aba2e593bea21f58a_113_0.png)\n\n## 引力与音乐\n\n在我们离开“牛顿实验室”场景之前，我们还有一件事可以玩：添加音乐。嗯，无论如何，是噪声。⁴\n\
    \n这个想法是这样的：我们在我们的世界中添加一些障碍物（Obstacles）。当行星碰到障碍物时，它们会发出声音。然后我们创建新的行星或恒星，让它们到处飞舞，看看会发生什么。\n\
    \n我们不会详细讨论这个实现，而是留给你们自己尝试，并指出一些最有趣的特征。你可以在《Newton-Lab-3》场景的书中找到这个想法的实现。\n\n练习\
    \ 6.28 打开名为 `Newton-Lab-3` 的场景并运行它。查看源代码。尝试理解它是如何工作的。\n\n以下是我们从上一个版本到创建此版本所做的的一些有趣更改总结：\n\
    \n- 我们添加了一个新类 `Obstacle`。你可以很容易地在屏幕上看到该类的对象。障碍物有两个图像：你大多数时候看到的橙色矩形，以及一个较浅版本的矩形，用于显示它们被碰到时。这被用于创建“点亮”效果。障碍物还关联了一个音频文件，就像我们在钢琴场景中的琴键一样。事实上，我们复用了钢琴场景中的音频文件，所以它们发出的声音相同。\n\
    - 我们修改了 `Body` 类，使物体会在屏幕边缘反弹。这为这类场景提供了更好的效果。我们还增加了引力以获得更快的移动，并修改了代码，使物体在速度过快时会自动减速。它们可能会无限地互相加速。\n\
    > ⁴ 为引力项目添加声音的想法灵感源于开普勒的行星仪（Kepler’s Orrery）（参见 https://keplers-orrery.dev.java.net/\
    \ 或在 YouTube 上搜索“Kepler’s Orrery”）。\n\n- 最后，我们在 `Space` 类中添加了代码来创建一排固定的障碍物，并创建五个随机行星（随机的大小、质量和颜色）。\n\
    \n这三个更改的实现包含了值得关注的趣味片段。\n\n- 在 `Obstacle` 类中，我们使用名为 `getIntersectingObject` 的方法来检查障碍物是否被行星碰到。代码模式为：\n\
    \n```\nObject body = getIntersectingObject(Body.class);\nif (body != null)\n{\n\
    \  }\n```\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_114_0.png)\n\n`getIntersectingObject`\
    \ 方法定义在 `Actor` 类中，对所有 actor 可用。如果存在交叉的 actor，它将返回该 actor；如果没有其他 actor 交叉，则返回\
    \ `null`。以下语句通过检查 `body` 是否为 `null` 来检查是否有其他对象与此相交叉。\n\n这是一个碰撞检测的示例，我们将在下一章讨论更多。\n\
    \n- 在 `Space` 类中，我们添加了两个方法：`createObstacles` 和 `randomBodies`。第一个创建带有其关联音频文件名的障碍物，与钢琴示例中的初始化代码非常相似。第二个使用\
    \ `while` 循环创建多个 `Body` 对象。物体使用随机值初始化。`while` 循环从给定的数字倒数到 0，以创建正确数量的对象。它作为循环的另一个示例非常值得学习。\n\
    \n练习 6.29 修改此场景中默认创建的物体数量。\n\n练习 6.30 玩玩移动参数，看看你是否能为行星创建运动。参数是：`GRAVITY` 的值；从边缘反弹时使用的加速度（当前为\
    \ 0.9）；速度阈值（当前为 7）以及使用 `applyForces` 方法减慢快速物体的加速度（0.9）；以及用于行星的初始质量（在 `Space` 类中）。\n\
    \n练习 6.31 在你的场景中创建一种不同的障碍物布局。\n\n练习 6.32 为你的障碍物使用不同的声音（不同的音频文件）。\n\n## 6.12 编程技术总结\n\
    \n**练习 6.33** 为你的障碍物使用不同的图像。\n\n**练习 6.34** 让行星在每次从宇宙边缘反弹时改变颜色。\n\n**练习 6.35**\
    \ 让行星在每次撞击障碍物时改变颜色。\n\n**练习 6.36** 创建一种不同的障碍物，通过被击中开启和关闭。当开启时，它会持续闪烁并以固定间隔控制声音。\n\
    \n**练习 6.37** 添加一些键盘控制。\n\n**练习 6.38** 允许更多的 **Body** 对象。\n\n有无数种方法让这个场景变得有趣，自己发明它们吧！\n\
