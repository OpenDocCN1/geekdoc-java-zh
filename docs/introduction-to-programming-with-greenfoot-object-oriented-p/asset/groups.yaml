    # Building the piano


    We would like to write some code in the Piano class that creates and places the
    piano keys for us. Adding a single key (or a few keys) is quite straightforward:
    By adding the following line to the Piano’s constructor, a key is created and
    placed into the world each time we re-initialize the scenario.


    ```

    addobject (new Key ("g", "3a.wav"), 300, 180);

    ```


    Remember the expression


    ```

    new Key ("g", "3a.wav")

    ```


    creates a new object (with a specified key and sound file), while the statement


    ```

    addobject (some-object, 300, 180);

    ```


    inserts the object into the world at the specified x and y coordinates. The exact
    coordinates 300 and 180 are picked somewhat arbitrarily at this stage.


    +   **Exercise 5.11** Add code to your Piano class so that it automatically creates
    a piano key and places in the world.


    **Exercise 5.12** Change the y-coordinate at which the key is placed, so that
    the piano key appears exactly at the top of the piano (i.e., the top of the piano
    key should line up with the top of the piano itself). Hint: The key image is 280
    pixels high and 63 pixels wide.


    **Exercise 5.13** Write code to create a second piano key that plays a middle-g
    (sound file name 3g.wav) when the "f” is pressed on the keyboard. Place this key
    exactly to the left of the first key (without any gap or overlap).


    Earlier in this book, we have discussed the value of using separate methods for
    separate tasks. Creating all the keys is a logically distinct task, so let us
    use the code for it in separate method. It will do exactly the same thing, but
    is clearer to read.


    +   **Exercise 5.14** In the Piano class, create a new method makeKeys(). Move
    your code that creates your keys into this method. Call this method from the Piano’s
    constructor. Make sure to write a comment for your new method.


    We now go ahead and insert a whole list of addobject statements to create all
    the keys we need for our keyboard. That is, however, not the best way of achieving
    what we want to do.'
- md: "\n## Using loops: The while loop\n\nProgramming loops offer you a specific\
    \ construct to do a similar task repeatedly: a loop.\n\nA loop is a programming\
    \ language construct that allows us to express commands such as \"Do this statement\
    \ 20 times\" or \"Call these two methods 3 million times\" easily and concisely\
    \ (without writing 3 million lines of code). Java has several different kinds\
    \ of loops. The one we shall investigate is now called a while loop.\n\nA while\
    \ loop has the following form:\n\n```java\nwhile ( condition )\n{\n    statement;\n\
    \    statement;\n    ..\n}\n```\n\nThe Java keyword is followed by a condition\
    \ in parentheses and a block (a set of curly brackets) containing one or more\
    \ statements. These statements will be executed over and over, as long as the\
    \ condition is true.\n\nA common pattern is a loop that executes some statements\
    \ given a number of times. To do this, we use a loop variable as a counter. It\
    \ is common practice to name a loop variable i, so we do this as here. Here is\
    \ an example that executes the body of the while loop 100 times:\n\n```java\n\
    int i = 0;\nwhile (i < 100)\n{\n    statement;\n    statement;\n    ..\n    i\
    \ = i + 1;\n}\n```\n\nThere are several things worth noting in this code. First,\
    \ it uses a concept that we have not encountered before: a local variable.\n\n\
    A local variable is a variable similar to a field. We can use it to store values\
    \ in, such as an integer number, or object references.\n\nIt differs from fields\
    \ in several respects:\n\n- A local variable is declared inside a method, not\
    \ at the beginning of the class;\n- It has no visibility modifier (private or\
    \ public) in front of it; and\n- It exists only until the current method finishes\
    \ running, then it will be erased.\n\n> ¹ Strictly speaking, this is not exactly\
    \ correct. Local variables can also be declared inside blocks, such as inside\
    \ if statements or the body of the loop. They exist only until execution exits\
    \ the block they were declared in. The statement above is, however, correct if\
    \ the local variable was declared at the beginning of a method.\n\n## Chapter\
    \ 5 Making music: An on-screen piano\n\nA local variable is declared by writing\
    \ the type of a variable, followed by its name:\n\n```java\nint i;\n```\n\nAfter\
    \ declaring the variable, we can assign a value. Here are these two statements\
    \ together:\n\n```java\nint i;\ni = 0;\n```\n\nJava allows a shortcut to write\
    \ these two statements in one line, declaring the variable and assigning a value:\n\
    \n```java\nint i = 0;\n```\n\nThis line has exactly the same effect as the two-line\
    \ version. This is the variant we have used in the code pattern for the while\
    \ loop above.\n\nLook at the pattern for the loop again—we should now be able\
    \ to understand what it does. We use a variable i and initialize it to 0. Then\
    \ we execute the body of the while loop, counting up i every time we do. We continue\
    \ as long as i is less than 100. When we reach 100, we stop the loop. Execution\
    \ will continue with the code following the loop body.\n\nThere are two further\
    \ details worth pointing out:\n\n- We use the statement i = i + 1; at the end\
    \ of the loop to increment our loop variable by 1 every time we execute the loop.\
    \ This is important. It is a common error to forget to increment the loop counter.\
    \ The variable would then never change, the condition would always remain true,\
    \ and the loop would continue looping forever. This is called an infinite loop,\
    \ and it is the cause of many errors in programs.\n\n- Our condition that we execute\
    \ the while loop is less than (< 100), not less or equal (=). The loop will not\
    \ be executed when i is equal to 100. At first, one might think that this means\
    \ the loop executes only 99 times, not 100 times. But this is not so. Because\
    \ we started counting at 0, not at 1, we execute 100 times (counting from 0 to\
    \ 99). It is common to start counting from 0 in computer programs—we will see\
    \ some advantages of doing so.\n\nNow that we know about a while loop, we can\
    \ use this construct to create all our piano keys.\n\nOur piano will have 12 keys.\
    \ We can create 12 keys by placing our statement in the inside body of a loop\
    \ that executes 12 times:\n\n```java\nint i;\nwhile (i < 12)\n{\n    addObject(new\
    \ Key (\"g\", \"3a.wav\", 300, 140));\n    i = i + 1;\n}\n```\n\n**Exercise 5.15**\
    \ Replace the code in your own makeKeys method with the loop here. Try it out.\
    \ What do you observe?\n\n## 5.5 Using loops: The while loop\n\nTrying out this\
    \ code, it first looks as if only one key was created. This is deceptive, however.\
    \ We do indeed get 12 keys, but since they have all been inserted at exactly the\
    \ same coordinates, we are all lying on top of each other, and we cannot see them\
    \ very well. Moving the keys in the piano world with your mouse pointer and you\
    \ will see that they are all there.\n\n**Exercise 5.16** How can you change your\
    \ code so that the keys do not all appear at exactly the same place? Can you change\
    \ your code so that they get placed exactly next to each other?\n\nThe reason\
    \ the keys all appeared on top of each other is that we inserted them at the fixed\
    \ location 300,140 into the world. We now want to place them at different locations.\
    \ The solution is to use the loop variable i to change the x-coordinate.\n\n**Exercise\
    \ 5.17** How many times does our loop execute?\n\n**Exercise 5.18** Challenge:\
    \ If we use an array to store the keyboard keys and sound files, how would we\
    \ change the loop?\n\n## Chapter 5 Making music: On-screen piano\n\n> We can avoid\
    \ using those numbers directly by calling getWidth() and getHeight() methods of\
    \ the key. To do this, first assign the key to a local variable when you create\
    \ it, and then use getWidth(). After doing this, our code will always place the\
    \ keys nicely, even if their size changes.\n\n## 5.6 Using arrays\n\nCurrently,\
    \ our keys are created, and placed at appropriate locations on the screen, but\
    \ they all react to the “g”, and they all play the same note. This is despite\
    \ the fact that we have prepared keys to create different keys and sound files\
    \ in the constructor. Since all our keys are created by the same line of source\
    \ code (executed in a loop), they are all created with “g” and “3.wav” as parameters.\n\
    \nThe solution is to change what we make in regards to the x-coordinate: We should\
    \ use variables for the keyboard key and the sound file name, and assign different\
    \ values to each time the loop executes.\n\nThis is more problematic than the\
    \ case with the x-coordinate, though. The correct keys and sound file names cannot\
    \ be computed easily. So where do we get the values from?\n\nOur answer is: We\
    \ will store them in an array.\n\nAn array is an object that can hold many variables,\
    \ and thus can store many values. We can show this in a diagram. Assume we have\
    \ a variable “name” of String. To this variable, we assign the String “Fred”:\n\
    \n```java\nString name;\nname = \"Fred\";\n```\n\nFigure 5.2 illustrates this\
    \ example.\n\nThis is very simple. The variable is a container that can hold a\
    \ value. The value is stored in the variable.\n\nIn case of an array, we get a\
    \ separate object—the array object—that holds many variables. We can then store\
    \ a reference to that array in our own variable (Figure 5.3).\n\nFigure 5.2\n\
    A simple String variable\n"
  mdcn: "\n\n## 使用循环：while 循环\n\n编程循环为你提供了一种特定的结构，用于重复执行某些任务：循环。\n\n循环是一种编程语言结构，允许我们轻松、简洁地表达诸如“执行此语句\
    \ 20 次”或“调用这两种方法 300 万次”之类的命令（而无需编写 300 万行代码）。Java 有若干种不同的循环。我们现在研究的是被称为 while\
    \ 循环的一种。\n\nwhile 循环具有如下形式：\n\n```java\nwhile ( condition )\n{\n    statement;\n\
    \    statement;\n    ..\n}\n```\n\nJava 关键字后面跟着一个在圆括号内的条件，以及一个包含一个或多个语句的块（一组大括号）。只要条件为真（true），这些语句就会不断反复执行。\n\
    \n一种常见的模式是执行指定次数的某些语句的循环。为了实现这一点，我们使用一个循环变量作为计数器。通常的做法是将循环变量命名为 `i`，所以我们在这里也这么做。以下是一个执行\
    \ while 循环体 100 次的示例：\n\n```java\nint i = 0;\nwhile (i < 100)\n{\n    statement;\n\
    \    statement;\n    ..\n    i = i + 1;\n}\n```\n\n这段代码中有几点值得注意。首先，它使用了一个我们之前没有遇到过的概念：局部变量。\n\
    \n局部变量是一个与字段（field）相似的变量。我们可以使用它来存储值，例如整数或对象引用。\n\n它在几个方面与字段不同：\n\n- 局部变量声明在方法内部，而不是在类的开头；\n\
    - 它前面没有可见性修饰符（private 或 public）；\n- 它只存在到当前方法运行结束为止，然后就会被擦除。\n\n> ¹ 严格来说，这并不完全准确。局部变量也可以声明在块内部，例如在\
    \ if 语句内部或循环体内部。它们只存在到执行退出它们被声明所在的块为止。然而，如果局部变量是在方法开头声明的，那么上面的语句就是正确的。\n\n## 第\
    \ 5 章 制作音乐：屏幕钢琴\n\n局部变量的声明是通过编写变量的类型，紧接着写名称来实现的：\n\n```java\nint i;\n```\n\n声明变量后，我们可以为其赋值。以下是这两个语句结合的形式：\n\
    \n```java\nint i;\ni = 0;\n```\n\nJava 允许使用快捷方式在一行中写这两个语句，同时声明变量并赋值：\n\n```java\n\
    int i = 0;\n```\n\n这一行的效果与两行的版本完全相同。这就是我们在上面 while 循环代码模式中使用的变体。\n\n再次观察循环的模式——现在我们应该能理解它的作用了。我们使用变量\
    \ `i` 并将其初始化为 0。然后执行 while 循环体，每次执行时都让 `i` 加 1。只要 `i` 小于 100，我们就继续。当 `i` 达到 100\
    \ 时，我们停止循环。执行将继续循环体之后代码。\n\n还有两个值得指出的细节：\n\n- 我们在循环末尾使用语句 `i = i + 1;`，以便每次执行循环时将我们的循环变量加\
    \ 1。这是非常重要的。忘记增加循环计数器是一个常见的错误。那么变量将永远不会改变，条件将始终为真，循环将无限循环下去。这被称为无限循环，它是程序中许多错误的原因。\n\
    \n- 我们的执行 while 循环的条件是小于（< 100），而不是小于等于（=）。当 `i` 等于 100 时，循环不会执行。起初，人们可能会认为这意味着循环只执行了\
    \ 99 次而不是 100 次。但事实并非如此。因为我们从 0 开始计数而不是从 1，所以我们执行了 100 次（从 0 数到 99）。在计算机程序中从 0\
    \ 开始计数很常见——我们将看到这样做的一些优点。\n\n现在我们已经了解了 while 循环，可以使用这种结构创建我们所有的钢琴键。\n\n我们的钢琴将有\
    \ 12 个键。我们可以通过将语句放置在一个执行 12 次的循环体内部，来创建 12 个键：\n\n```java\nint i;\nwhile (i <\
    \ 12)\n{\n    addObject(new Key (\"g\", \"3a.wav\", 300, 140));\n    i = i + 1;\n\
    }\n```\n\n**练习 5.15** 用此处的循环替换掉你自己的 `makeKeys` 方法中的代码。尝试一下。你观察到了什么？\n\n## 5.5\
    \ 使用循环：while 循环\n\n尝试这段代码，起初看起来只创建了一个键。然而，这是欺骗性的。我们确实得到了 12 个键，但由于它们都被插入在完全相同的坐标上，它们全部重叠在一起了，我们无法很好看到它们。在钢琴世界中用鼠标指针移动键，你会发现它们都在那里。\n\
    \n**练习 5.16** 你如何修改你的代码，使键不会全部出现在完全相同的地方？你能否修改代码，让它们恰好相邻放置吗？\n\n键之所以全部重叠在一起，是因为我们将它们在固定位置\
    \ 300,140 插入到世界中。我们现在想将它们放在不同的位置。解决方案是使用循环变量 `i` 来改变 x 坐标。\n\n**练习 5.17** 我们的循环执行了多少次？\n\
    \n**练习 5.18** 挑战：如果我们使用数组来存储键盘键和声音文件，我们该如何更改循环？\n\n## 第 5 章 制作音乐：屏幕钢琴\n\n> 我们可以通过调用键的\
    \ `getWidth()` 和 `getHeight()` 方法来避免直接使用那些数字。为了这样做，首先在创建键时将键赋值给一个局部变量，然后使用 `getWidth()`。这样做之后，即使它们的大小发生变化，我们的代码也将始终很好地放置这些键。\n\
    \n## 5.6 使用数组\n\n目前，我们的键被创建并放置在屏幕上适当的位置，但它们都对“g”有反应，并且都播放相同的音符。尽管如此，我们在构造函数中已经准备了创建不同键和声音文件的键。由于我们所有的键都是通过同一行源代码（在循环中执行）创建的，它们都是以“g”和“3.wav”作为参数创建的。\n\
    \n解决方案是改变我们在 x 坐标方面制作的内容：我们应该为键盘键和声音文件名使用变量，并在每次循环执行时分配不同的值。\n\n然而，这比 x 坐标的情况更棘手。正确的键和声音文件名无法轻松计算。那么我们从哪里获取这些值呢？\n\
    \n我们的答案是：我们将它们存储在数组中。\n\n数组是一个可以包含许多变量的对象，因此可以存储许多值。我们可以通过图表展示这一点。假设我们有一个 String\
    \ 类型的变量“name”。给这个变量赋值字符串“Fred”：\n\n```java\nString name;\nname = \"Fred\";\n```\n\
    \n图 5.2 阐释了这个例子。\n\n这非常简单。变量是一个可以容值的容器。值存储在变量中。\n\n在数组的情况下，我们得到一个独立的对象——数组对象，它包含许多变量。然后我们可以将该数组的引用存储在我们自己的变量中（图\
    \ 5.3）。\n\n图 5.2\n简单的 String 变量\n\n"
