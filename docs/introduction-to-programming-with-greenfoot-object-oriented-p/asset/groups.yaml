    \ *Pause*（暂停）。\n\n## 术语\n\n**move()** 指令被称为**方法调用**（method call）。**方法**（method）是一个对象知道如何执行的动作（在这里，该对象是螃），而**方法调用**是告诉螃去执行该动作的指令。括号是方法调用的一部分。此类指令以分号结束。\n\
