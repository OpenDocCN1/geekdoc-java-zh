    碰撞检测\n\n在本书中，不同的情况下使用了不同的碰撞检测方法。以下是 Greenfoot actor 可用的碰撞检测方法总结，以及它们用途和使用场景的简短说明。\n\
    \n## C.1 方法总结\n\nGreenfoot 的碰撞检测方法可以在 Actor 类中找到。共有六个相关方法，如下：\n\n- *getIntersectingObjects(Class\
    \ cls)*\n  返回所有与此对象交叉的对象。\n\n- *getOneIntersectingObject(Class cls)*\n  返回一个与此对象交叉的对象。\n\
