    **练习 7.18** 实现你之前创建的 **createStars** 方法的体。该方法应该包含以下内容：


    - 获取世界的背景图像。

    - 使用与 **addAsteroids** 中相似的 **for** 循环。循环的限制由方法参数给出。

    - 在循环体中，生成随机的 **x** 和 **y** 坐标。将颜色设置为白色，然后画一个宽度和高度均为 2 像素的椭圆。


    测试！你在你的世界中看到星星了吗？如果一切顺利，你应该是能看到的。


    **练习 7.19** 创建亮度随机的星星。你可以通过创建一个 0 到 255 之间的随机数（颜色 RGB 值的范围），并使用相同的随机值为所有颜色分量创建一个新的
    **Color** 对象，以确保生成的颜色是中性灰调。使用这种新的随机颜色来绘制星星。确保为每颗新星星生成一个新颜色。


    这些练习非常具有挑战性。如果你遇到困难，可以查看解决方案。该场景的 *asteroids-2* 版本中提供了此类实现。或者，你现在可以忽略这一部分，先继续后续任务，稍后再回到这里。


    ## 7.3 转向


    在上一节中，我们花费了大量精力在外观上。我们使用 **for** 循环来创建背景中的星星。那是事倍功少的工作。然而，了解 **for** 循环在以后非常有帮助。


    现在，我们想要实现一些真实的功能：我们想让火箭移动。第一步是让它在按下键盘上的左键或右键时能够转向。


    **练习 7.20** 检查 **Rocket** 类。找到处理键盘输入的代码。处理这段代码的方法名称是什么？


    **练习 7.21** 添加一条语句，在按下“左”键时让火箭向左旋转。在每个 act 循环中，火箭应该旋转 5 度。你可以使用 **Actor** 类中的
    `getRotation` 和 `setRotation` 方法来实现这一目标。


    **练习 7.22** 添加一条语句，在按下“右”键时让火箭向右旋转。测试！


    如果你成功完成了这些练习，你的火箭现在应该可以在你按下箭头键时转向。由于它是朝向所面对的方向发射的，因此它也可以向所有方向发射。


    下一个挑战是让它向前飞行。


    ## 7.4 向前飞行


    我们的 Rocket 是 SmoothMover 类的子类，我们在上一章中已经见过它。这意味着它包含一个决定其移动的移动向量，并且有一个 `move()`
    方法让它根据该向量移动。


    我们的第一步是利用这个 `move()` 方法。


    **练习 7.23** 在 Rocket 的 act 方法中，添加对 `move()` 方法（继承自 SmoothMover）的调用。测试。你观察到了什么？


    在 act 方法中添加 `move()` 调用是重要的第一步，但它本身并不能实现什么。它导致火箭根据其移动向量移动，但由于我们还没有启动任何移动，该向量目前的长度为
    0，因此没有发生移动。


    为了改变这一点，让我们首先引入少量的自动漂移，让火箭从开始就具有一些初始移动。这使得游戏更有趣，因为它阻止了玩家长时间保持不动。


    **练习 7.24** 在火箭的构造函数中为火箭添加少量的初始移动。为了做到，创建一个具有任意方向和较小长度的新向量（我自己的版本使用了 0.3），然后使用
    SmoothMover 的 `addForce` 方法并将该向量作为参数，将此力添加到火箭上（确保在 Vector 的构造函数中使用 int 作为第一个参数，以便使用正确的构造函数）。


    测试。如果一切顺利，火箭在启动时应该会自动漂移。


    接下来，我们想要添加一些功能……

    '
