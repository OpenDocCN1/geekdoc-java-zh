    \ is empty.\n\n> **Concept:\n> Java objects can be created programmatically (from\
    \ within your code) using the new keyword.\n\nWhen we create a new object, we\
    \ have to do something with it. We can now use it in place of the actor parameter\
    \ of the addObject method to add this object to the world.\n\n```java\naddObject(new\
