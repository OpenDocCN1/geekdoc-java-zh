    ## 10.2 Lifts


    Figure 10.1

    The Marbles


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_171_0.png)


    The other interesting aspect to examine the collision detection. The marbles do
    not use any of the built-in Greenfoot collision detection methods, since these
    all work on the rectangular actor images. The marbles, on the other hand, are
    round, and we need precise collision for this.


    Luckily, when the actors are round, this is not very difficult. Two marbles collide
    if their distance (measured from their center points) is less than their diameter.
    We know the diameter, and the distance is easy to compute (using the Pythagoras
    theorem).


    The next interesting thing is the new movement direction of a colliding marble
    is computed. There is a little trigonometry involved here, but it is not too hard.


    Collisions with the fixed obstacles are easier, since they are always horizontally
    or vertically rectangular. Therefore, a marble hitting one of these obstacles
    simply reverses its direction along one of the axes (x or y).


    You could use the marble collision logic for all sorts of games that involve collision
    of round objects.


    ## 10.2 Lifts


    The lifts scenario (Figure 10.2) shows a simple lift (or elevator) simulation.
    It shows several floors of a multistory building and three lifts moving up and
    down. People appear on the floors and press the call buttons and enter the lifts
    when they come.


    ### Figure 10.2

    A (partial) lift simulation


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_172_0.png)


    This is actually a very rudimentary, unfinished implementation. Much of what we
    see on the screen is fake: It does not properly simulate what is going on, and
    is just written for show effect.


    For example, the people do not properly enter the lifts (they are erased when
    a lift reaches a floor). The number of people shown in a lift is just a random
    number. Lifts also do not to call buttons—they just move up and down randomly.
    There is no control algorithm implemented for the lifts.


    So this is a quick demo that presents the idea and the graphics. To finish the
    project, the movement of people would have to be properly modeled (in and out
    of the elevators). And then we could experiment with implementing and testing
    different lift control algorithms.


    ## 10.3 Boids


    The boids example (Figure 10.3) shows a simulation of flocking behavior of birds.


    The term “boids” comes from a program developed in 1986 by Craig Reynolds that
    first implemented this flocking algorithm. In it, each bird flies according to
    three rules:


    ### Figure 10.3

    Boids: A simulation of flocking behavior


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_173_0.png)


    - Separation: steer away from other birds if getting too close.

    - Alignment: steer toward the average heading of other birds in the vicinity.

    - Cohesion: steer to move the average position of other birds in the vicinity.


    With this algorithm, the boids develop movement that is quite nice to look at.
    Included in this scenario is also obstacle avoidance: trying not to fly into trees.


    A version of this algorithm was used, for example, in Tim Burton’s 1992 film “Batman
    Returns” to create animation for computer-generated swarms of bats and penguin
    flocks, and in the “Lord of the Rings” films to create the movement of the Orc
    armies.


    The version for this book was written by Paul Henriksen.


    You can find out much more about this by searching the web for “boids”. And while
    this scenario currently does nothing other than show the movement, one feels that
    there has to be a game in it somewhere . . .


    ## Circles


    Circles (Figure 10.4) is a project that does not seem to have much of a purpose
    but is interesting to play with and nice to look at.


    ### Figure 10.4

    "Circles" is a mixture of physics and art


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_174_0.png)


    It uses some physical simulation, such as gravity and bouncing off edges, and
    some randomness to create beautiful moving images. Is it physics? Is it art? Or
    maybe a bit of both?


    Whatever it is, I am sure there are many other ways to produce interesting or
    beautiful images, patterns, or color animations. (One idea might be to combine
    the circles with the collision detection algorithm from the Marbles game.)


    Circles was written by Joe Lenton.


    ## 10.5 Explosion


    The explosion scenario (Figure 10.5) demonstrates how we can implement a more
    spectacular looking explosion effect. The object that explodes is, in this case,
    a simple rock that we have encountered in other scenarios before. (It played,
    for example, the role of the asteroid in the asteroids scenario.) But we could
    really explode anything like


    To achieve this, we have a Debris class that represents a part of the rock. When
    the rock explodes, we remove it from the world and place 40 pieces of debris in
    its place.


    Each piece of debris is randomly stretched and rotated to make it somewhat unique,
    and initially has a movement vector in a random direction. At every step, we add
    a bit of downward movement to simulate gravity, and the result is the explosion
    you see when you run this scenario.


    ### Figure 10.5

    An explosion effect


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_175_0.png)


    A tutorial video explaining this scenario in more detail is available on the Greenfoot
    web site at http://www.greenfoot.org/doc/videos.html.


    ## 10.6 Breakout


    "Breakout" (10.6) is a classic computer game in which the player controls a paddle
    at the bottom of the screen to bounce a ball upwards to remove some blocks. If
    you do not know the game, do a search and you will quickly find out.


    The breakout scenario is a partial implementation of this game. It uses the ball
    with the smoke effect that we discussed in Chapter 8 and adds a paddle for the
    player to control the ball. It has, however, no blocks to aim for, so in its current
    form it is not very interesting.


    Many variations of breakout have been created over time. Many use different patterns
    of layout for the blocks. Most also have "power-ups”—goodies hidden behind some
    blocks that float when the block is removed. Catching them typically makes something
    interesting in the game (extra balls, increased speed, larger or smaller paddles).


    Completing this game in an interesting way can make a good project. It could also
    be modified to have two paddles, one on each side, turning it into the "Pong"
    game.


    ### Figure 10.6

    The beginning of "breakout"


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_176_0.png)


    ## 10.7 Platform jumper


    A very common style of game is a “platform” game. The player typically controls
    a game character that has to move from one area on the screen to another, overcoming
    various obstacles. One obstacle may be a gap in the ground the character is walking
    on, with some means of getting across.


    The penguin scenario (Figure 10.7) implements a small segment of such a game.
    There are two pieces of ground on either side of the screen, and the penguin can
    jump onto them by a moving cloud.


    ### Figure 10.7

    A start of a simple platform jumper game


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_177_0.png)


    A tutorial video discussing this in more detail is available on the Greenfoot
    web site at http://www.greenfoot.org/doc/videos.html, under the name “Running,
    jumping and falling”.


    ## Wave


    The last scenario presented here is called wave (Figure 10.8). It is a simple
    simulation of propagation of a wave on a piece of string. Play around with it
    for a little while, and you will discover what it does.


    One of the fascinating aspects of this example is how a fairly simple implementation—in
    each round, each bead simply moves toward the middle of its two neighbors—achieves
    a quite sophisticated simulation of various aspects of wave propagation.


    This example is included here to illustrate that, with a bit of thought and preparation,
    various behaviors from other disciplines could be simulated. In this case, it
    is a simple physical effect. Equality, we could simulate chemical reactions, biological
    interactions, interactions of subatomic particles, and much more. With some careful
    planning, we can learn something about other applications, as well as learning
    about programming.


    This scenario also implements slider and switch controls, which may be useful
    in other projects.

    '
