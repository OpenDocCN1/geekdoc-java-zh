- md: "\n[content]\n# 114 Chapter 7 Collision detection: Asteroids\n\nThe problem\
    \ lies in the fact that the compiler is not quite as smart as we would like. The\
    \ getWorld() method is defined in class Actor, and its signature is this:\n\n\
    ```\nWorld getWorld()\n```\n\nWe see that it will return an object of type World.\
    \ The actual world that it returns in our case is of type Space.\n\nThis is not\
    \ a contradiction: Our world object can be of type World and of type Space at\
    \ the same time, because Space is a subclass of World (Space is a World; and we\
    \ say that the type is a subtype of type World).\n\nThe error comes from the difference\
    \ between the two: gameOver is defined in class Space, while getWorld gives us\
    \ a result of type World. The compiler only looks the return type of the method\
    \ we are calling (getWorld). Because of this, the compiler searches for gameOver\
    \ method only there and does not find it. That's why we get the error message.\n\
    \nTo solve this problem, we need to tell the compiler explicitly that the type\
    \ we're getting is actually of Space. We can do this by using a cast.\n\n```\n\
    Space space = (Space) getWorld();\n```\n\nCasting is the technique of telling\
    \ the compiler a more precise for our object than it can work out itself. In our\
    \ case, the compiler can work out the object returned from getWorld is of type\
    \ World, and we are now telling it it is actually of Space. We do this by writing\
    \ the name (Space) in parentheses before the method call. Once we have done this,\
    \ we can call methods in Space:\n\n```\nspace.gameOver();\n```\n\nIt is worth\
    \ noting that casting does not change the type of the object. Our actual object\
    \ is of type Space all. The problem is that the compiler does not know this. With\
    \ the cast, we are just adding additional information to the compiler.\n\nBack\
    \ to our checkCollision method. Once we have our world to Space and stored it\
    \ in a variable of type Space, we can call all methods on it; those defined in\
    \ Space and defined in World. Thus, our calls to addObject and removeObject should\
    \ still work, and the gameOver call should work well.\n\n**Exercise 7.42** Implement\
    \ the call to the gameOver, using the cast of the World object to Space, as discussed\
    \ here. Test this should come when the rocket explodes.\n\n**Exercise 7.43** What\
    \ happens when you use a cast incorrectly? Try casting the world object to say,\
    \ **Asteroid** instead of Space. What does this work observe?\n\nThis work so\
    \ far has achieved the display of our \"Game Over\" sign (still with an incorrect\
    \ score). We will leave the scoring as an exercise at the end of this chapter.\
    \ If you really want to fix now, you may like to jump ahead to the end-of-chapter\
    \ exercises and look into this first. Here, we will look at proton waves next.\n\
    \n![](img/9d90a1ac20b9439aba2e593bea21f58a_130_0.png)\n\n# 7.7 Adding fire power:\
    \ The proton wave\n\nOur game is getting pretty good. The final thing we shall\
    \ detail in this chapter is the addition of a second weapon: the proton wave.\
    \ This should give the game a little variety. The idea is this: Our proton wave,\
    \ once released, radiates outward from our ship, damaging or destroying every\
    \ asteroid in path. Since it works in all directions simultaneously, it is a much\
    \ more powerful weapon than bullets. For the game, we should probably restrict\
    \ how often or frequently you can use it, so that the game does not become too\
    \ easy to play.\n\n- **Exercise 7.44** Run your scenario. Place a proton wave\
    \ into the scenario—what do you observe?\n\nThe exercise shows that we have a\
    \ proton wave actor, which shows the wave at full size. However, this wave does\
    \ not move, does not disappear, and does not cause any damage to asteroids. Our\
    \ first task will be to make the wave we grow. We will start with it, and then\
    \ grow until it reaches the full size that we have just seen.\n\n- **Exercise\
    \ 7.45** Examine the source code of class ProtonWave. What are the methods that\
    \ already exist?\n- **Exercise 7.46** What is the purpose of each method? Review\
    \ the comments of each method and expand them to add a more detailed explanation.\n\
    - **Exercise 7.47** Try to explain what the initializeImages method does and how\
    \ it works. Explain in writing, using diagrams if you like.\n\n# 7.8 Growing the\
    \ wave\n\nWe have seen that the ProtonWave class has a method—initializeImages—that\
    \ creates 30 images of different sizes and stores them in an array (Code 7.2).\
    \ This array, named images, holds the smallest image at index 0, and the largest\
    \ at index 29 (see Figure 7.3). The images are created by loading a base image\
    \ (wave.png) and then, in loop, creating copies of this image and scaling them\
    \ to different sizes.\n\nCode 7.2\nInitializing the images for the proton wave\n\
    \n```\n/**\n * Create the images for expanding the wave.\n */\npublic static void\
    \ initializeImages() {\n    if(images == null) {\n        GreenfootImage baseImage\
    \ = new GreenfootImage(\"wave.png\");\n        images = new GreenfootImage[NUMBER_IMAGES];\n\
    ```\n\n# Code 7.2 continued\n\nInitializing the images for the proton wave\n\n\
    ```java\nint i = 0;\nwhile (i < NUMBER_IMAGES) {\n    int size = (i+1) * (baseImage.getWidth()\
    \ / NUMBER_IMAGES);\n    images[i] = new GreenfootImage(baseImage);\n    images[i].scale(size,\
    \ size);\n    i++;\n}\n```\n\n# Figure 7.3\n\nAn array of images (some left out\
    \ for space reasons)\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_132_0.png)\n\n\
    This method uses the scale method from the GreenfootImage class to do the scaling.\
    \ It also uses a while loop for the iteration. However, this is an example where\
    \ a for loop, which we encountered at the beginning of this chapter, might be\
    \ appropriate.\n\n> **Exercise 7.48** Rewrite the initializeImages method to use\
    \ a for loop instead of a while loop.\n\nIn practice, it is not very important\
    \ which loop to use in this case. (We changed it here mainly to gain additional\
    \ practice in writing for loops.) This is, however, a case where a for loop is\
    \ a good choice, because we have a known number of iterations (the number of images)\
    \ and we can make good use of the loop counter in calculating the image sizes.\
    \ The advantage of the while loop is that the for loop brings all elements of\
    \ the loop (initialization, condition, and increment) together in the header,\
    \ so that we run less danger forgetting one of parts.\n\n# 7.8 Growing the wave\n\
    \nThe images field and initializeImages method are static (they use the static\
    \ keyword in their definition). As we briefly mentioned in Chapter 7, this means\
    \ the images field is stored in the ProtonWave class, not in the individual instances.\
    \ As a result, all objects we create of this class can share this images, and\
    \ we do not need to create a separate set each time.\n\nCopying and scaling these\
    \ images takes a long time (between a tenth of a second and a second on average\
    \ computer). This does not seem very much, but it is long enough to introduce\
    \ a visual, annoying delay when we do it in the middle of playing. To solve this,\
    \ the code of this method is enclosed in an if statement:\n\n```java\nif (images\
    \ == null)\n    ..\n```\n\nThis statement ensures that the main part of this method\
    \ (the body of the statement) is executed only once. The first time, images will\
    \ be null, and the method executes fully. This will initialize the images field\
    \ to something other than null. From then, the test of the statement is all that\
    \ will be executed, and the body will be skipped. The initializeImages method\
    \ is actually called every time a proton wave is created (from the constructor),\
    \ but only the first time it is, substantial work will be done. The call is included\
    \ in the proton wave constructor only as a safety feature: If this class is used\
    \ in another project, and this method is not called in advance, all will still\
    \ work.\n\nNow that we have a fair idea of the code and the fields that already\
    \ exist, we can finally get to work and make something happen.\n\nWhat we want\
    \ to do is the following:\n\n- We want to start the wave off with the smallest\
    \ image.\n- At every step, we want to grow the wave (show the next larger image).\n\
    - After we have shown the largest image, the wave should disappear (removed from\
    \ the world).\n\nThe following exercises will achieve this.\n\n- **Exercise 7.49**\
    \ In the constructor of class ProtonWave, set the image to the smallest image.\
    \ (You can use images[0] as the parameter to the setImage method.)\n- **Exercise\
    \ 7.50** Create an instance field named imageCount of type int, and initialize\
    \ it to 0. We will use this field to count through the images. The current value\
    \ is the index of the currently displayed image.\n\n> The method is actually called\
    \ for the first time from the Space constructor, so it executes even before the\
    \ first proton wave is created. This avoids a delay for the first proton wave\
    \ as well.\n[/content]\n"
  mdcn: "\n# 114 第 7 章 碰撞检测：小行星\n\n问题在于编译器并不像我们想象的那么智能。`getWorld()` 方法定义在 `Actor`\
    \ 类中，其签名如下：\n\n```\nWorld getWorld()\n```\n\n我们看到它将返回一个 `World` 类型的对象。在我们的案例中，它返回的实际世界类型是\
    \ `Space`。\n\n这并不是矛盾：我们的世界对象可以同时是 `World` 类型又是 `Space` 类型，因为 `Space` 是 `World`\
    \ 的子类（我们说该类型是 `World` 类型的子类型）。\n\n错误源于两者之间的差异：`gameOver` 定义在 `Space` 类中，而 `getWorld`\
    \ 给的是 `World` 类型的结果。编译器只查看我们正在调用的方法（getWorld）的返回类型。因此，编译器只在该处搜索 `gameOver` 方法但没有找到。这就是我们得到错误信息的原因。\n\
    \n为了解决这个问题，我们需要显式地告诉编译器我们获得的类型实际上是 `Space`。我们可以通过使用类型转换来实现。\n\n```\nSpace space\
    \ = (Space) getWorld();\n```\n\n类型转换是一种技术，告诉编译器比它自己能推断出的更精确的对象类型。在我们的案例中，编译器可以推断从\
    \ `getWorld` 返回的对象是 `World` 类型，而我们现在告诉它实际上是 `Space`。我们通过在方法调用之前的括号中编写名称 (Space)\
    \ 来实现。一旦完成，我们就可以调用 `Space` 中的方法了：\n\n```\nspace.gameOver();\n```\n\n注意的是，类型转换不会改变对象的类型。我们的实际对象始终是\
    \ `Space` 类型。问题是编译器不知道这一点。通过类型转换，我们只是给编译器添加了额外信息。\n\n回到我们的 `checkCollision` 方法。一旦我们将世界转换为\
    \ `Space` 并将其存储在 `Space` 类型的变量中，我们就可以调用它的所有方法；包括在 `Space` 中定义和在 `World` 中定义的方法。因此，我们对\
    \ `addObject` 和 `removeObject` 的调用应该仍然有效，`gameOver` 的调用也能正常工作。\n\n**练习 7.42**\
