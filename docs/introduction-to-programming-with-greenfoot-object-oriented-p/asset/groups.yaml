    \ in the collection, variable is a variable that is being declared here, so we\
    \ can give it any name we like, collection is the name of the collection we wish\
    \ to process, and statements is a sequence of statements we wish to carry out.\
    \ This will become clearer with an example.\n\nUsing our list named bodies, we\
    \ can write\n\n```\nfor (body : bodies) {\n    body.move();\n}\n```\n\n(Remember\
    \ that Java is case sensitive: Body with an uppercase “B” is different from body\
    \ with a lowercase “b”. The uppercase name refers to the class, the lowercase\
    \ name refers to a variable holding index. The plural version—bodies—is another\
    \ variable that holds the whole list.\n\nWe can read the for-each loop a little\
    \ more easily if we read the keyword “for as”, the colon as “in”, and the opening\
    \ curly bracket as “do”. Then this becomes\n\n```\nfor each body in bodies:...\n\
    ```\n\nThis reading gives us a hint as to what this loop does: It will execute\
    \ the statements in the curly brackets for each element in the list bodies. If,\
    \ there are three elements in that list, the statements will be executed three\
    \ times. Every time, before the statements are executed, the variable body (declared\
    \ in the loop header) will be assigned one of the list elements. Thus, the sequence\
    \ of action will be\n\n```\nbody = first element from 'bodies'\nexecute loop statements;\n\
    body = second element from 'bodies'\nexecute loop statements;\nbody = third element\
    \ from 'bodies'\nexecute loop statements;\n...\n```\n\nThe variable body is available\
    \ to be used in the loop statements to access the current element from the list.\
    \ We could then, for example, call a method on object, as in the example shown\
    \ above, pass the object to another method for further processing.\n\nWe can use\
    \ this loop to apply gravity from all other bodies to this one:\n\n```\nfor (Body\
    \ : bodies) {\n    applyGravity(body);\n}\n```\n\nIn this code, we just take each\
    \ element (stored in the variable body) and pass it to another method named applyGravity,\
    \ which we will have to write in a moment.\n\nWe should add one more thing: Since\
    \ bodies is a list of all bodies in space, it includes the current object (the\
    \ one we want to apply gravity to) as well. We do not need to apply gravity of\
    \ an object to itself, so we can add an if statement that calls applyGravity only\
    \ if the element from the list is not the current object itself."
  - "[PAGE 109]\n\n# 6.9 Applying gravity\n\nThe result is shown in Code 6.6. Note\
    \ how the keyword this is used here to refer to the current\n\n# Code 6.6\n\n\
    Applying gravity from all other bodies in space\n\n```\nprivate void applyForces()\
    \ {\n  List<Body> bodies = getWorld().getObjects(Body.class);\n  for (Body body\
    \ : bodies) {\n    if (body != this) {\n      applyGravity(body);\n    }\n  }\n\
    }\n/**\n * Apply the gravity force of a given body to this one.\n */\nprivate\
    \ void applyGravity(Body other) {\n  // work to do here\n}\n```\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_109_0.png)\n\
    \n# Applying gravity\n\nIn 6.6, we have solved the task of accessing each object\
    \ in space, but we have deferred the task of actually applying the gravitational\
    \ force. The method applyGravity (another example of a private method) still needs\
    \ to be written.\n\nThis is no little easier than before, though this method now\
    \ only needs to deal with two objects at a time: the current object, and one other\
    \ object specified in its parameter. We now want to apply the gravitational force\
    \ from the other object to this. This is where Newton's Law comes into play.\n\
    \nNewton's formula for gravitation looks like this:\n\n> $force = \\frac{mass1\
    \ \\times mass2}{distance^{2}} G$\n\nIn other words, to calculate the force to\
    \ apply to the current object, we need to multiply the mass of this object with\
    \ the mass of the other object, and divide by the square of the distance between\
    \ the two objects. Finally, the value multiplied by the constant G—the Gravitational\
    \ Constant.(You may remember that we have already defined a constant for this\
    \ value in our class, named GRAVITY.)"
  - "[PAGE 110]\n\nIf you are very confident or adventurous, you may like to try to\
    \ implement the applyGravity method. You need to create a vector in the direction\
    \ from the current body to the other body, with a length specified by this formula.\
    \ For the rest of us, we now look at the finished implementation of that method\
    \ (Code 6.7).\n\n# Code 6.7\n\nCalculating and applying gravity from another body\n\
    \n```\n/**\n * Apply the gravity force of a given body to this one.\n */\nprivate\
    \ void applyGravity(Body other) {\n    double dx = other.getExactX() - this.getExactX();\n\
    \    double dy = other.getYY() - this.getYY();\n    Vector force = new Vector(dx,\
    \ dy);\n    double distance = Math.sqrt(dx * dx + dy * dy);\n    double strength\
    \ = GRAVITY * this.mass * other.mass / \n        (distance * distance);\n    double\
    \ acceleration = strength / this.mass;\n    force.setLength(acceleration);\n \
    \   addForce(force);\n}\n```\n\nThis method is not as complicated as it looks.\
    \ First, we calculate the distances between our object and the other object in\
    \ the x and y coordinates (dx and dy). Then we create new vector using these values.\
    \ This vector now has the right direction, but not for the correct length.\n\n\
    Next, we calculate the distance between the two objects using the Pythagoras theorem\
    \ (a² + b² = c²) in right-angled triangles, see Figure 6.7.\n\n# Figure 6.7\n\n\
    The distance in relation to dx and dy\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_110_0.png)\n\
    \nThis tells us that the distance is the square root of dx squared plus dy squared.\
    \ In our code (Code 6.7), we use a method called sqrt from the Math class to calculate\
    \ the square root. (Math is a class in java.lang, and thus automatically imported.)"
