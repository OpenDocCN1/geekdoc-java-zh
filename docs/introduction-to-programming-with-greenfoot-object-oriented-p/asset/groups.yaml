  - "[PAGE 85]\n\n# Using loops: The while loop\n\nProgramming loops offer you a specific\
    \ construct to do a similar task repeatedly: a loop.\n\nA loop is a programming\
    \ language construct that allows us to express commands such as \"Do this statement\
    \ 20 times\" or \"Call these two methods 3 million times\" easily and concisely\
    \ (without writing 3 million lines of code). Java has several different kinds\
    \ of loop. The one we shall investigate is now called a while loop.\n\nA while\
    \ loop has the following form:\n\n```\nwhile ( condition )\n{\n    statement;\n\
    \    statement;\n    ..\n```\n\nThe Java keyword is followed by a condition in\
    \ parentheses and a block (a of curly brackets) containing one or more statements.\
    \ These statements will be executed over and over, as long as the condition is\
    \ true.\n\nA common pattern is a loop that executes some statements given a number\
    \ of times. To do this, we use a loop variable as a counter. It is common practice\
    \ to name a loop variable i, so we do this as here. Here is an example that executes\
    \ the body of the while loop 100 times:\n\n```\nint i = 0;\nwhile (i < 100)\n\
    {\n    statement;\n    statement;\n    ..\n    i = i + 1;\n}\n```\n\nThere are\
    \ several things worth noting in this code. First, it uses a concept that we have\
    \ not encountered before: a local variable.\n\nA local variable is a variable\
    \ similar to a field. We can use it to store values in, such as an integer number,\
    \ or object references.\n\nIt differs from fields in several respects:\n\n+  \
    \ - A local variable is declared inside a method, not at the beginning of the\
    \ class;\n- It has no visibility modifier (private or public) in front of it;\
    \ and\n- It exists only until the current method finishes running, then it will\
    \ be erased.\n\n> ¹ Strictly speaking, this is not exactly correct. Local variables\
    \ can also be declared inside blocks, such as inside if statements or the body\
    \ of the loop. They exist only until execution exits the block they were declared\
    \ in. The statement above is, however, correct if the local variable was declared\
    \ at the beginning of a method."
  - "[PAGE 86]\n\n# Chapter 5 Making music: An on-screen piano\n\nA local variable\
    \ is declared by writing the type of a variable, followed by its name:\n\n```\n\
    int i;\n```\n\nAfter declaring the variable, we can assign a value. Here are these\
    \ two statements together:\n\n```\nint i;\ni = 0;\n```\n\nJava allows a shortcut\
    \ to write these two statements in one line, declaring the variable and assigning\
    \ a value:\n\n```\nint i = 0;\n```\n\nThis line has exactly the same effect as\
    \ the two-line version. This is the variant we have used in the code pattern for\
    \ the while loop above.\n\nLook at the pattern for the loop again—we should now\
    \ be able to understand what it does. We use a variable i and initialize it to\
    \ 0. Then we execute the body of the while loop, counting up i every time we do.\
    \ We continue as long as i is less than 100. When we reach 100, we stop the loop.\
    \ Execution will continue with the code following the loop body.\n\nThere are\
    \ two further details worth pointing out:\n\n+   We use the statement i = i +\
    \ 1; at the end of the loop to increment our loop variable by 1 every time we\
    \ execute the loop. This is important. It is a common error to forget to increment\
    \ the loop counter. The variable would then never change, the condition would\
    \ always remain true, and the loop would continue looping forever. This is called\
    \ an infinite loop, and it is the cause of many errors in programs.\n\n+   Our\
    \ condition that we execute the while loop is less than (< 100), not less or equal\
    \ (=). The loop will not be executed when i is equal to 100. At first, one might\
    \ think that this means the loop executes only 99 times, not 100 times. But this\
    \ is not so. Because we started counting at 0, not at 1, we execute 100 times\
    \ (counting from 0 to 99). It is common to start counting from 0 in computer programs—we\
    \ will see some advantages of doing so.\n\nNow that we know about a while loop,\
    \ we can use this construct to create all our piano keys.\n\nOur piano will have\
    \ 12 keys. We can create 12 keys by placing our statement in the inside body of\
    \ a loop that executes 12 times:\n\n```\nint i;\nwhile (i < 12)\n{\n    addObject(new\
    \ Key (\"g\", \"3a.wav\", 300, 140);\n    i = i + 1;\n}\n```\n\n**Exercise 5.15**\
    \ Replace the code in your own makeKeys method with the loop here. Try it out.\
    \ What do you observe?"
