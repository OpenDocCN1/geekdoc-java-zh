    # Interacting with objects in range


    We have a proton wave that we can release at a press of a button. The remaining
    problem is: This proton wave does not actually do anything to the asteroids.


    We now wish to add code that causes damage to the asteroids when they hit by the
    proton wave.


    - **Exercise 7.60** Prepare for this new functionality: In class **ProtonWave**,
    add a method stub for a method called `checkCollision`. The method has no parameters
    and does not return a value. Call this method from your **act** method.


    - **Exercise 7.61** The purpose of this new method is to check whether the wave
    touches an asteroid, and cause damage to it if it does. Write the method comment.


    We do not want to use the getIntersectingObjects method, since the invisible image
    areas at the corners of the proton wave image (included in the bounding box, but
    not part of the blue-ish circle) are fairly large, and asteroids would be destroyed
    long before the wave seems to reach them.


    Instead, we will use another collision detection method, called getObjectsInRange.


    The getObjectsInRange method returns a list of all objects within a given radius
    of the calling-object (see Figure 7.4). Its signature is


    ```

    getObjectsInRange(int radius, Class cls)

    ```


    When called, we can specify the class of objects we are interested in (as before),
    and we also specify a radius (in cells). The method will return a list of all
    objects of the requested class that are found within this radius around the calling
    object.


    To determine which objects are within the range, the center points of objects
    are used. For example, an asteroid would be within radius 20 of a rocket if the
    distance of its center point


