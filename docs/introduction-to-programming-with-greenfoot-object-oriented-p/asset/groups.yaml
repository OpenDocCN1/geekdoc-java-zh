    # CHAPTER 7

    Collision detection: Asteroids


    **topics:** more about movement, keyboard control and collision detection

    **concepts:** collections (again), for loop, for-each loop (again), casting


    In this chapter, we shall not introduce many new concepts, but instead revisit
    and deepen our understanding of some topics we have touched on in the last couple
    of chapters. We shall revisit a scenario that we have encountered before, very
    early in this: Asteroids (Figure 7.1).

    The version of Asteroids that we use here is slightly different than the one we
    looked at earlier. It has some added features (such as a proton wave and a score
    counter), but it is not fully implemented.


    **Figure 7.1**

    The new Asteroids scenario (with proton wave)


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_117_0.png)


    # Investigation: What is there?


    Important parts of the functionality are still missing, and it will be our job
    in this chapter to implement them.


    We shall use this example to revisit movement and collision detection. In terms
    of Java programming concepts, we will use this to gain more practice with loops
    and collections.


    We should start this project by examining the existing code base. We have a partially
    implemented solution, named asteroids-1, in the chapter07 fold of the book scenarios.
    (Make sure to use the chapter07 version, not the copy from chapter01.)


    - **Exercise 7.1** Open the asteroids-7 scenario from the chapter0 fold of the
    book projects. Experiment with it to find out what it does, and what it does not
    do.

    - **Exercise 7.2** Write down a list of things that should be added to this project.

    - **Exercise 7.3** Which keyboard key is used to fire a bullet?

    - **Exercise 7.4** Place an explosion into a running scenario (by interactively
    creating an object of class Explosion). Does it work? What does it do?

    - **Exercise 7.5** Place a proton wave into a scenario. Does this work? What does
    it do?


    When experimenting with the current scenario, you will have noticed that some
    fundamental functionality is missing:


    - The rocket does not move. It cannot be turned, nor it can be moved forward.

    - Nothing happens when an asteroid collides with the rocket. It flies through
    it, instead of damaging the rocket.

    - As a result of this, you cannot lose. The game never ends, and a final score
    is never displayed.

    - The ScoreBoard, Explosion, and ProtonWave classes, which we can see in the diagram,
    do not seem to feature in the scenario.


    One that we can do, is fire bullets at asteroids. (If you have not found out how,
    try it out.) Asteroids break up when hit by a bullet, or if they are fairly small,
    disappear.


    The goal of this game would obviously be to clear the screen of asteroids without
    our rocket ship being hit itself. To make it a little more interesting, we also
    want to add another weapon—the proton wave. And we want to keep a high score while
    we''re playing. To do this, we have a good amount of work to do.


    - We must implement movement for the rocket. Currently, it can fire bullets, but
    nothing else. We need to be able to move forward and turn.

    - We must ensure that the rocket explodes when we hit an asteroid.


    # 7.2 Painting stars


    - When the rocket explodes, we want to put up a scoreboard that displays our final
    score.


    - We want to be able to release a proton wave. The proton wave would start small
    around the rocket ship and then gradually out, destroying asteroids when it hits.


    Before we get into these functions, we start with one more minor cosmetic thing:
    Painting stars into our universe.


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_119_0.png)


    # Painting stars


    In all previous scenarios, we used a fixed image as the background for the world.
    The image was stored in an image file in our file system.


    In this scenario, we''d like to introduce a different technique to make background
    images: painting them on the fly.


    The Asteroid scenario does not use an image file for the background. A world that
    does not have a background image will, by default, an automatically created background
    image that is filled with white paint.


    > Exercise 7.6 Investigate the constructor of the Space class in your scenario.
    Find the lines of code that create the background.


    Looking at the asteroids-1 scenario, we can see that the background is plain white.
    When we investigate the constructor of the Space class, we can find these three
    lines of code:


    ```

    GreenImage background = getBackground();

    background.setColor(Color.BLACK);

    background.fill();

    ```


    > Tip: If you want to remove some code temporarily, it is easier to "comment out"
    rather than deleting it. The Greenfoot editor has a function to do this. Just
    select the lines in question, and press ''Comment'' (F8) or ''Uncomment'' (F7)
    from the Edit menu.


    > Exercise 7.7 Remove these three lines from your class. You can do this by commenting
    them out. What do you observe? (Once done, put them back in.)


    The first lines retrieve the current background image from the world. This is
    automatically generated (white) image. We then have a reference to the world background
    stored in the background variable.


    The background object that we have stored here is of class GreenImage—we have
    seen this class before.


    > Exercise 7.8 Look up the documentation for the class GreenImage. What is the
    name of the method used to draw a rectangle? What is the difference between drawOval
    and fillOval?


    # Chapter 7 ■ Collision detection: Asteroids


    The second line in the code fragment above sets the paint color to black. Doing
    has no immediate effect (it does not change the color of the image). Instead,
    it determines the color that is used by all following drawing operations. The
    parameter is a constant from the Color class, which we encountered in the previous
    chapter.


    **Exercise 7.9** Look up the documentation of class Color again. (Do you remember
    which package it is in?) For how many colors does this class define constant fields?


    The third line of the code fragment now fills our image with the color chose.
    Note that we do not need to set this image as background of the world. When we
    get the image (using getBackground()), we got a reference to the background image,
    and the same image remains the world background. It is not removed from the world
    just because we now have a reference to it.


    When we paint onto this image, we are painting directly onto the background.


    - **Exercise 7.10** In Space, create a new method.

