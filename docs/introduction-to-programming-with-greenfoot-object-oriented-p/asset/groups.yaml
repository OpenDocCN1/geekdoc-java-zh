    # Chapter 8 Creating images and sound


    The second method to obtain images for our actors and backgrounds is to draw them
    programmatically. We have seen examples of this in some of the scenarios in early
    chapters, for example, when we painted the stars in the asteroids program.


    Every pixel in an image is defined by two values: its color value and its transparency
    value (also called the *alpha value*).


    The color value is again split into three components: the red, green, and blue
    component. Colors represented this way are usually referred to as RGB colors.


    This means we can represent a pixel (with color and transparency) in four numbers.
    The order usually is as follows:


    - ( R, G, B, A )


    That is, the first three values define the red, green, and blue components (in
    this order), and the last is the alpha value.


    In Java, all of these values are in the range [0...255] (zero to 255 inclusive).
    A color value of 0 indicates no color in this component, while 255 is full strength.
    An alpha value of 0 is fully transparent (invisible), while 255 is opaque (solid).


    Figure 8.2 shows a table of some of the possible colors, with no transparency
    (alpha = 255). The table in Figure 8.2 was produced with the Greenfoot scenario
    color-chart, which is in the chapter08 folder in the book.


    > ³ This is just one possible model to represent color. There are others in use
    in computer graphics and in print. However, this is the most commonly used in
    Java programming, so we shall concentrate on this model here.


