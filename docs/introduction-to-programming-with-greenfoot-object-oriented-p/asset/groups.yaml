    \ (say, to 5), so that all rockets in the future start with this improved behavior.\n\
    \nOpen the editor for the Rocket class. After 25 lines from the top, you should\
    \ find a line that reads\n\n```\ngunReloadTime = 20;\n```\n\nThis is where the\
    \ initial reload time gets set. Change this line so that it reads\n\n```\ngunReloadTime\
