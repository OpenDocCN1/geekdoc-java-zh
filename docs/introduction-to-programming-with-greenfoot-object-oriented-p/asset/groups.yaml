    Our proton wave will have images of increasing size. At each cycle, we can use
    the size of the current image to determine the range of our collision check. We
    can find out the current image size using the following method:


    ```

    getImage().getWidth()

    ```


    We can then use half of this size as our range (since the range is specified as
    a radius, not as a diameter).


