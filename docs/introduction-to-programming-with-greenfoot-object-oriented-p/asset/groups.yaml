    ## 处理图像


    正如在前面的章节中简要讨论过的（例如当我们在第 7 章中制作小行星背景时），管理 actor 和世界背景的图像可以通过两种不同的方式实现：我们可以使用来自文件的预制图像，也可以在程序中即时绘制图像。


    我们将在这里更详细地讨论这两种方法。


    ## 图像文件和文件格式


    有多种方法为我们的场景获取图像。简单的方法当然是使用 Greenfoot 图像库中的图像。当我们创建新类时，这些图像会自动显示。互联网上还有几个免费图标和图像库可供选择。花几分钟搜索其中一些即可。（确保你想要使用的图像是用于免费公开使用的——并不是所有在互联网上的东西都是免费的或属于公有领域的。请尊重他人的版权和许可条款。）


    然而，如果我们想让自己的场景独一无二并赋予它们独特的氛围，最有趣的替代方案是自己制作图像。


    有几种图形程序可以用来制作图像。*Photoshop* 是最著名的商业程序，如果你想用它，它无疑是一个非常好的选择。然而，也有提供强大功能的免费开源程序。*Gimp*²
    是一款出色的免费程序，具有许多复杂功能，值得安装。还有许多更简单的画图程序可以使用。


    制作看起来良好的图形需要一些时间来学习，本书中无法详细讨论。多玩多练习，你就会发现许多技巧和窍门。在这里，我们将关注使用图像的性细节。


    > ² http://www.gimp.org


    # 重要的问题之一是保存图像时使用什么格式。像声音一样，质量和文件大小之间需要进行权衡。图像文件可能会变得非常大（远大于我们场景中的代码文件），这很容易占据我们项目的总体大小。再次，如果我们想将场景导出到网络服务器，例如
    Greenfoot Gallery，这尤为重要。图像格式可以导致大小产生 10 倍或更多的差异，如果我们选择格式，场景下载将快 10 倍（因为大小只有十分分之一）。


    Greenfoot 可以读取 JPEG、PNG、GIF、BMP 和 TIFF 格式的图像。在这些格式中，JPEG 和 PNG 是两种最好的格式。JPEG 图像具有良好的压缩优点。这意味着它们可以以很小的文件大小保存。对于彩色图像（如照片和背景，许多数码相机使用这种格式）尤其如此。在保存图像时，许多图形程序允许我们选择压缩程度。压缩得越多，文件越小，但质量也会降低。例如，Gimp
    在以 JPEG 格式保存图像时会显示“质量”滑块。降低质量会变小。


    **练习 8.22** 在你的图形程序中创建一个图像并将其保存为 JPEG 文件。使用至少四种质量设置保存。打开不同的文件并比较文件大小。对于你的图像，哪种质量设置是质量和文件大小之间的良好折中？


    **练习 8.23** 在你的图形程序中为你之前章节中的场景创建一个新背景。将其保存为 JPEG 文件。在场景中使用。图像的大小应该是？如果太大会怎样？


    **练习 8.24** 你认为 JPEG 算法是如何让图像变小的？它是如何运作的？尝试对这种实现的可能方式提出一些理论和假设。


    **练习 8.25** JPEG 实际上是如何压缩文件的？在互联网上进行研究并以书面形式回答。


    另一个非常有用的图像格式是 PNG。PNG 图像具有可以很好处理透明度的优点。任何单个像素都可以部分或完全透明的。这允许我们创建非矩形的图像。（正如第 7
    章所述，所有图像都是矩形的，但具有透明部分可以创造出透明效果。）JPEG 图像不能具有透明像素，因此不能使用，除非 actor 恰好是矩形的。对于背景，这通常不是问题，因为我们通常不在背景中使用透明度。


