    In this scenario, we are using two purpose helper classes: SmoothMover and Vector.
    These classes add functionality to a given scenario, and can be used in different
    scenarios for similar purposes. (These two classes are fact used in a number of
    different existing projects.)


    The SmoothMover class provides smoother movement for actors by storing the actor''s
    coordinates as decimal numbers (of type double), rather than integers. Fields
    of double type can store numbers with decimal fractions (such as 2.4567), and
    are more precise than integers.


    For displaying the actor on the screen, the coordinates will still be rounded
    to integers, since the location for painting on screen must always be a whole
    pixel. Internally, however, the location is held as a decimal number.


