    \ `java.lang` 包的名为 \"Class\" 的类。\n\n尝试在 Java 库文档中找到该类。\n\n## 创建新方法\n\n在过去的几个章节中，我们为螃蟹添加了新行为——在世界边缘转弯、偶尔随机转弯以及吃虫子。如果我们继续按照目前的方式这样做，`act`\
    \ 方法将变得越来越长，最终变得非常难以理解。我们可以通过将其拆分为更更小的部分来改进。\n\n## 第 3 章 改进螃蟹——更复杂的编程\n\n### 概念：\n\
    \n方法定义为该类的对象定义了一个新动作。该动作不会被立即执行，但可以通过方法名调用该方法来执行它。\n\n我们可以根据自己的需求在 `Crab` 类中创建额外的方法。例如，我们不再直接在\
    \ `act` 方法中编写寻找并吃掉虫子的代码，而是为此目的添加一个新方法。为此，我们首先要为这个方法确定一个名字。假设我们叫它 `lookForWorm`。然后通过添加以下代码来创建一个新方法：\n\
    \n```java\n/*\n * 检查我们是否撞到了一条虫子。\n * 如果发现了，吃掉它。如果没有，什么都不做。\n */\npublic void lookForWorm()\
    \ {\n\tif(canSee(Worm.class)) {\n\t\teat(Worm.class);\n\t}\n}\n```\n\n### 概念：\n\
    \n注释被写在源代码中，作为给人类读者的解释。计算机会忽略这些注释。\n\n前四行是注释。注释会被计算机忽略——它是为了给人类读者阅读的。我们需要一个注释来向其他人类读者解释这个方法的用途。\n\
    \n当我们定义这个方法时，代码并不会立即执行。事实上，仅仅通过定义这个方法，它根本不会被执行。我们只是定义了一个以后可以执行的新可能动作（“寻找虫子”）。只有在方法被**调用（called）**时，它才会被执行。我们可以在\
    \ `act` 方法内部添加对该方法的调用：\n\n```java\nlookForWorm();\n```\n\n注意调用处带有（空的）参数列表的括号。此重构后的完整源代码见代码\
    \ 3.3。\n\n### 代码 3.3\n\n将代码拆分为独立的方法\n\n```java\npublic void act() {\n\tif (atWorldEdge())\
    \ {\n\t\tturn(17);\n\t}\n\tif (Greenfoot.getRandomNumber(100) < 10 ) {\n\t\tturn(5);\n\
    \t}\n\tmove();\n\tlookForWorm();\n}\n```\n\n## 3.4 创建新方法\n\n### 代码 3.3 继续\n\n\
