  - "[PAGE 121]\n\n# Exercise 7.14 Examine the addAsteroids method in class Space.\
    \ What does it do?\n\nExercise 7.15 Look at the for loop in that method. From\
    \ the loop header, write down the initialization part, the loop-condition, and\
    \ the increment. (See the definition of the for loop above.)\n\nThe initialization\
    \ part of a for loop is executed exactly once before the loop starts. The loop\
    \ condition is checked: If it is true, the loop body is executed. Finally, after\
    \ the loop body has been completely executed, the increment section from the loop\
    \ header is executed. After this, the loop starts over and, if true, it runs again\
    \ until the condition returns false. The initialization is never executed.\n\n\
    A for loop could be easily replaced by a while loop. A while loop equivalent of\
    \ the for structure shown above this is:\n\n```\ninitialization;\nwhile (loop-condition)\n\
    {\n    loop-body;\n    increment;\n}\n```\n\nThe loop structure shown here and\
    \ the for loop structure shown above do exactly the same thing. The main difference\
    \ is, that, in the for loop, the initialization and the increment have been moved\
    \ into the loop header. This places all elements that define the loop behavior\
    \ in one place, and can make loops easier to read.\n\nThe for loop is especially\
    \ practical if we know at the beginning of the loop already often we want to execute\
    \ the loop.\n\nThe for example found in the addAsteroids method reads\n\n```\n\
    for (int i = 0; i < count; i++)\n{\n    int x = Greenfoot.getRandomNumber(getWidth()/2);\n\
    \    int y = Greenfoot.getRandomNumber(getHeight()/2);\n    addObject(new Asteroid(i),\
    \ x, y);\n}\n```\n\nThis shows a typical example of a for loop:\n\n+   - The initialization\
    \ part declares and initializes a loop variable. This variable is often called\
    \ i, and often initialized to 0.\n\n+   - The condition checks whether our loop\
    \ variable is still less than a given limit (here: count). If it is, the loop\
    \ will continue.\n\n+   - The increment section simply increments the loop variable.\n\
    \nDifferent variations of the for loop are possible, but this example shows a\
    \ very typical format."
