    - **Exercise 7.66** In checkCollision, write a for-loop that iterates over the
    asteroid list retrieved from the getObjectsInRange call. In the loop body, call
    hit on each asteroid using the DAMAGE constant.


    Once you have completed this exercise, you should now have a playable version
