    让我们仔细观察类图（图 1.8）。在顶部，你有两个类 `World` 和 `Space`，它们由箭头连接。


    `World` 类在所有 Greenfoot 场景中都存在——它是内置在 Greenfoot 中的。在它下方的类 `Space` 代表了该特定场景的特定世界。它的名称在每个场景中可能不同，但每个场景在这里都会有一个特定的世界。


    箭头显示了“是（is）”的关系：`Space` 是一个 `World`（从 Greenfoot 世界的角度来说：我们常说 `Space` 是 `World`
    的子类）。


    ![](img/9d90a1ac20b9439aba2e593bea21f263.png)


    我们不需要创建世界类的对象——Greenfoot 会替我们这样做。当我们打开一个场景时，Greenfoot 会自动创建一个世界子类的对象。该对象随后显示在屏幕的主部分。（巨大的空间图像是...的对象）


    ## 图 1.7


    `asteroids1` 场景


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_27_0.png)


