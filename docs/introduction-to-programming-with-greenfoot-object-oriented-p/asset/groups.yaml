    # How to get started


    To start, open the greeps scenario from the book-scenarios folder. Run this scenario.


    You will see that a spaceship lands in an area with sand and water. The Greeps
    will leave the spaceship and start searching for tomato piles (which happen to
    be found in various places in this area). Greeps are land animals—they cannot
    and will walk into the water. (In fact, they are sensitive to water that they
