    # Concept:


    An applet is a version of a Java program that can run on a web page inside a web
    browser.


    In the Gallery, everyone can view and execute scenarios, but if you want to rate
    them, leave comments, or upload your own scenarios, you need to create an account
    on the site. This is quick and easy.


    After creating an account, you can easily upload your scenario to the Greenfoot
    Gallery, using the dialog shown in Figure I1.3. The dialog allows you to add an
    icon, a description, and tags that identify your scenario.


    If you choose to publish the source code (using the Publish code checkbox), your
    full source code will be copied to the Gallery site, where everybody else can
    then download it, read it, and make their own versions of your scenario.


    Your published scenarios can be changed and improved later by exporting again
    with the same title.


    Publishing your scenarios to the Gallery can be a good way to get feedback from
    other users: comments on what works and what doesn''t, and suggestions you could
    add to the program. The Gallery is also a good place to get ideas for further
    functionality, or to learn how to do things. Just look for scenarios with source
    code, download the source, and check how other programmers have implemented their
    classes.


    # Concept summary


    +   - A jar file is a single file with the suffix jar that contains all Java classes
    that belong to an application.

    - An applet is a version of a Java program that can run on a web page inside a
    web browser.'
