    world object to say, **Asteroid** instead of Space. What does this work observe?


    This work so far has achieved the display of our "Game Over" sign (still with
    an incorrect score). We will leave the scoring as an exercise at the end of this
    chapter. If you really want to fix now, you may like to jump ahead to the end-of-chapter
    exercises and look into this first. Here, we will look at proton waves next.


