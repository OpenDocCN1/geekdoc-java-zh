    # 6.11 Gravity and music 97


    Seeing how difficult it is to come up with parameters to create a system that
    is stable for a limited time, we might be surprised that our solar system is as
    stable as it is. But there is an explanation: When the solar system formed, material
    from a gas cloud surrounding the Sun formed into lumps that slowly grew by colliding
    with other lumps of matter and combining to form ever-growing objects. Initially,
    there were countless of the lumps in orbit. Over time some fell into the Sun,
    escaped into deep space. This process ends when the only chunks are left separated
    from one another and generally have stable orbits.


    It would be possible to create a simulation that models this effect. If we correctly
    model the growth of planets out of billions of small, random lumps of matter,
    we would observe the effect: Some large planets that are left in stable orbits.
    But for this, we would need a much more detailed and complicated simulation and
    a lot of time: Simulating this effect would take a very, long time, even on very
    fast computers.


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_113_0.png)


