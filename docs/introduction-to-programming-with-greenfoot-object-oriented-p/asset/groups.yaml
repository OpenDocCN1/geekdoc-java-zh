    ### A.1 安装 Java


    从 http://java.sun.com/javase/downloads 下载 Java。你应该安装最新版本的 Java SE 开发工具包 (JDK)。


    在 Mac OS X 上，不需要安装 Java——它已经包含在标准的 Mac OS 安装程序中。


    ### A.2 安装 Greenfoot


