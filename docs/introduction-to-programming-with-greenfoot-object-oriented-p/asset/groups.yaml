    ## 10.2 电梯


    图 10.1

    大弹球


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_171_0.png)


    另一个检查碰撞检测的有趣方面。弹球没有使用任何 Greenfoot 内置的碰撞检测方法，因为这些方法都是针对矩形 actor 图像的。相反，弹球是圆形的，而我们对这需要精确的碰撞。


    幸运的是，当 actor 是圆形的时，这并不困难。如果两个弹球之间的距离（从它们的中心点测量）小于它们的直径，它们就会发生碰撞。我们知道直径，而且距离很容易计算（使用勾哥拉斯定理）。


    下一个有趣点是计算碰撞大弹球的新运动方向。这里涉及了一点三角学，但并不太难。


    与固定障碍物的碰撞更容易一些，因为它们始终是水平或垂直的矩形。因此，撞击这些障碍物之一的弹球只需反沿一个轴（x 或 y）的方向即可。


    你可以将大弹球的碰撞逻辑用于所有涉及圆形物体碰撞的游戏。


    ## 10.2 电梯


    电梯场景（图 10.2）展示了一个简单的电梯（或升梯）模拟。它展示了多层建筑的几层楼和三部上下移动的电梯。人们出现在楼层，按下召唤按钮并在电梯到达时进入电梯。


    ### 图 10.2

    一个（部分的）电梯模拟


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_172_0.png)


    这实际上是一个非常初级的、未完成的实现。我们在屏幕上看到的很多都是虚假的：它没有正确模拟正在发生的事情，只是为了视觉效果而编写。


    例如，人们没有正确地进入电梯（当电梯到达某层时，他们被删除了）。电梯中显示的人数只是一个随机数。电梯也没有响应按钮——它们只是随机上下移动。电梯没有实现控制算法。


    所以，这是一个展示了思想和画面的快速演示。要完成这个项目，必须对人的移动进行适当的建模（进入和离开电梯）。然后我们就可以尝试实现和测试不同的电梯控制算法。


    ## 10.3 Boids（群体算法）


    Boids 示例（图 10.3）展示了鸟类集群行为的模拟。


    “boids”一词源于 Craig Reynolds 在 1986 年开发的程序，该程序首次实现了这种集群算法。在程序中，每只鸟都根据三个规则飞行：


    ### 图 10.3

    Boids：集群行为的模拟


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_173_0.png)


    - 分离：如果离得太近，则远离其他鸟。

    - 队列：向邻近区域其他鸟的平均方向转向。

    - 凝聚：向附近其他鸟的平均位置移动。


    通过这种算法，boids 发展出了看起来非常优美的运动。该场景中还包含了避障功能：尽量不要飞进树里。


    这种算法的一个版本被用于蒂姆·伯顿 1992 年的电影《蝙蝠侠回归》，用于为计算机生成的蝙蝠群和企鹅群创建动画，并在《魔环》电影中创建兽人军队的运动。


    本书中的版本由 Paul Henriksen 编写。


    你可以通过在网络上搜索“boids”了解更多信息。虽然这个场景目前除了显示运动外无所事事，但人们觉得某个地方一定有一个游戏 . . .


    ## 圆 (Circles)


    圆形（图 10.4）是一个似乎没有太大目的的项目，但玩起来很有趣而且很好看。


    ### 图 10.4

    “圆形”是物理与艺术的结合


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_174_0.png)


    它使用了一些物理模拟（如重力和边缘反弹）以及一些随机性来创建美丽的动态图像。这是物理吗？是艺术吗？或者两者兼有之？


    无论它是什么，我相信还有许多其他方法可以产生有趣或美丽的图像、图案或颜色动画。（一个想法可能是将圆形与大弹球游戏中的碰撞检测算法相结合。）


    圆形项目由 Joe Lenton 编写。


    ## 10.5 爆炸


    爆炸场景（图 10.5）演示了我们如何实现更壮观的爆炸效果。在这种情况下，爆炸的对象是一个简单的石头，我们在之前的其他场景中遇到过这种物体。（例如，它在小行星场景中扮演了小行星的角色。）但我们真的可以爆炸任何东西，如


    为了实现这一点，我们有一个 `Debris`（碎片）类，代表石头的一部分。当石头爆炸时，我们将其从世界移除并在其位置放置 40 块碎片。


    每块碎片都会随机拉伸和旋转，使其具有某种独特性，并且初始具有随机方向的运动向量。在每一步中，我们都会添加一点向下移动来模拟重力，结果就是当你运行此场景时看到的爆炸。


    ### 图 10.5

    一个爆炸效果


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_175)


    一个详细解释该场景的教程视频可以在 Greenfoot 网站获取：http://www.greenfoot.org/doc/videos。


    ## 10.6 打砖 (Breakout)


    “打砖”（10.6）是一个经典游戏，玩家控制屏幕底部的 paddle 向上弹球以消除一些方块。如果你不知道这个游戏，搜索一下很快就能发现。


    打砖场景是该游戏的局部实现。它使用了我们在第8章中讨论过的球体效果，并增加了一个供玩家控制的 paddle。然而，它没有目标方块，所以目前的形式并不有趣。


    随着时间的推移，打砖出现了许多变体。许多变体使用了不同的布局。很多还有隐藏在方块后的道具——捕捉它们通常会让游戏变得有趣（额外的球、增加的速度）。


    以有趣的方式完成这个游戏可以作为一个很好的项目。它还可以修改为每侧一个 paddle，将其变成乒乓球（Pong）游戏。


    ### 图 10.6

    打砖开始


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_176)


    ## 10.7 跳跃平台 (Platform jumper)


    一种非常常见的游戏类型是“平台”游戏。玩家通常控制一个游戏角色从屏幕的一个区域移动到另一个区域，克服各种障碍。一种障碍可能是角色行走的地面空隙，通过某种跨越的方法。


    企鹅场景（图 10.7）实现了此类游戏的一个小片段。屏幕两侧有两块地面，企鹅可以通过移动的云朵跳到它们上面。


    ### 图 10.7

    一个简单的跳跃平台游戏的开始


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_177)


    详细讨论该场景的教程视频可以在 Greenfoot 网站获取：http://www.greenfoot.org/doc/videos.html，名为“跑步、跳跃和掉落”。


    ## 波 (Wave)


    这里的最后一个场景被称为波（图 10.8）。它是对弦上波传播的简单模拟。尝试一下，你就会发现它是做什么的。


    这个示例的迷人之处之一在于，相当简单的实现——在每一轮中，每个小球只是向向它的两个邻居的中间移动——实现了对波传播各个方面相当复杂的模拟。


    这个示例包含在这里是为了说明，通过一些思考和准备，可以模拟其他学科的各种行为。在这种情况下，它是一个简单的物理效果。同样，我们可以模拟化学反应、生物相互作用、亚原子粒子的相互作用等等。通过一些周密的规划，我们可以学习关于其他应用的知识，同时也学习编程。


    此场景还实现了滑块（slider）和开关（switch）控制，这些在其他项目中可能有用。


    '
