- md: "\n# Chapter 7 Collision detection: Asteroids\n\nAppendix C presents a summary\
    \ of the different collision detection methods and their functionality. This might\
    \ be a good time to take a quick look through it. At some stage, you should become\
    \ familiar with all the collision detection methods.\n\nFor our purpose getIntersectingObjects\
    \ seems like a good fit. Two objects intersect if any of the pixels in their images\
    \ intersect. This is pretty much what we need.\n\nThere is one small problem:\
    \ transparent pixels in the actor images.\n\nImages in Greenfoot are always rectangles.\
    \ When we see non-rectangular images, such as the rocket, because some pixels\
    \ in the image are transparent (invisible); they contain no color. For the purpose\
    \ of our program, they are still part of the image.\n\nFigure 7.2 shows the rocket\
    \ and asteroids with their bounding boxes. The bounding box is the edge of the\
    \ actual image. (The image of the rocket is a little bigger than what seems necessary\
    \ to make it the same size as the second rocket image, rocketWithThrust, which\
    \ shows the flame in the empty area)\n\nIn 7.2, the images intersect, even though\
    \ their visible parts do not touch. The collision detection methods will report\
    \ this as an intersection. They work with the bounding boxes, and pay no attention\
    \ to the non-transparent parts of the image.\n\nAs a result, our rocket will make\
    \ “contact” with an asteroid even though, onscreen, there seems to be still a\
    \ little distance between them.\n\nFor our asteroids, we choose to ignore this.\
    \ Firstly, the distance, so often players will not notice. Secondly, it is easy\
    \ enough to come up with a story to explain this effect (“flying close to an asteroid\
    \ destroys your ship because of the gravitational pull”).\n\nSometimes it would\
    \ be nice to check whether the actual visible (non-transparent) parts of an image\
    \ intersect. This is possible, but much more difficult. We will not discuss this\n\
    \nNow that we have decided to check object intersection, we can look at the Actor\
    \ methods again. There are two methods for checking object intersection. Their\
    \ signatures are\n\n- ListIntersectingObjects(Class cls)\n- Actor getIntersectingObject(Class\
    \ cls)\n\nBoth methods accept a parameter of type Class (which means we can check\
    \ for intersections with a specific class of object if we want to). The difference\
    \ is that one method will return a list of all objects we currently intersect\
    \ with, while the other returns only a single object. In case we intersect more\
    \ than one other object, the second method randomly chooses one of them and returns\
    \ it.\n\n![](img/9d90a1ac20b9439aba2e593bea21f58a_126_0.png)\n\n## 7.5 Colliding\
    \ asteroids\n\nFor our purpose, the second method is good enough. It actually\
    \ makes no difference to the game whether we crash into one asteroid, or into\
    \ two of them simultaneously. The rocket will explode just the same. The only\
    \ question for us is, do we intersect with any asteroid at all?\n\nThus, we shall\
    \ use the second method. Since it returns an Actor rather than a List, it is slightly\
    \ simpler to work with. It will return an actor if we have an intersection, or\
    \ null if we currently do not intersect with any asteroid. We can check for a\
    \ null return value to see whether we crashed into anything:\n\n```java\nActor\
    \ a = getIntersectingObject(Asteroid.class);\nif (a != null)\n{\n    // ...\n\
    }\n```\n\n- **Exercise 7.30** Add a check for intersecting with an asteroid, similar\
    \ to the one shown here, to your own checkCollision method.\n\n- **Exercise 7.31**\
    \ Add code to the body of the if statement that adds an explosion to the world\
    \ at the current position of the rocket, and removes the rocket from the world.\
    \ (To do this, you need to use the getWorld() to access its methods for adding\
    \ and removing objects from the world.)\n\nFor the last exercise above, we can\
    \ use our getX() and getY() methods to retrieve the current position. We can use\
    \ this as the coordinates for the explosion.\n\nAn attempt at solving this might\
    \ look like:\n\n```java\nworld = getWorld();\nworld.removeObject(this); // remove\
    \ rocket from world\nworld.addObject(new Explosion(), getX(), getY());\n```\n\n\
    This code looks reasonable at first glance, but will not work.\n\n- **Exercise\
    \ 7.32** Try out the code as shown above. Does it compile? Does it run? At what\
    \ point does something go wrong, and what is the error message?\n\nThe reason\
    \ this does not work is that we are calling the getX() and getY() methods after\
