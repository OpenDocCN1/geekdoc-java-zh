    ## 9.2 Ants


    The ants scenario simulates the food collecting behavior of ant colonies. Or,
    to be precise, we would like it to simulate this behavior, but it does not do
    it. We shall develop it to do so. In its current state, the scenario has been
    prepared to some extent: The graphics exist and some of the implementation has
    been completed. The main functionality, however, is missing, and we shall work
    on completing it.


    - **Exercise 9.8** Open the scenario called *ants* from the chapter 09 folder
    of the book scenarios. Create an ant hill in the world and run the scenario. What
    do you observe?


    - **Exercise 9.9** Examine the source code of the **Ant** class. What does it
    currently do?


    - **Exercise 9.10** *Ant* is a subclass of class *Creature*. What functionality
    does the creature have?


    **Figure 9.2**

    The ants simulation


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_161_0.png)


    Exercise 9.11 Examine the source code of class AntHill. What does this class do?
    How many ants are in an ant hill?


    The first thing we notice is that the ants do not move. They are created in the
    middle of the ant hill, since they do not move, after a short while they will
    all sit there on top of each other. The first thing for us is to make ants move.


    Exercise 9.12 In the Ant''s act method, add a line of code to make the ant move.
    Consult the documentation of class Creature to find out about the methods to use.


    We will now go by step through a series of improvements to this scenario. The
    steps we shall take are as follows:


    - We will introduce food to the scenario, so that the ants have something to collect.

    - We will improve the ants, so that they can find the food and carry it home home.

    - Next, we will add a Pheromone class. Pheromones are chemical substances that
    some animals produce to leave messages for other animals of their species.

    - We will improve the ants to make use of pheromones: They will leave drops of
    pheromones on the ground when they have found food, and other ants can then smell
    pheromones and adjust where they are going.


    These steps together simulate the food collecting behavior of ant colonies. When
    complete, we can do some experiments with the simulation.


    ## Collecting food


    Our first task is to create food in our scenario and let ants collect it and carry
    it back to the ant hill.


    Exercise 9.13 Create a new class called Food. The class does not need a fixed
    image. We will draw the image from within the class.


    Each object of class Food represents a pile of food crumbs. Our plan is to create
    a new, dynamically drawn image for the Food object and draw a small dot it for
    every crumb in the pile. A pile may start with say, 100 crumbs, and when every
    ant finds the pile, it takes a few crumbs away. That means that the image must
    be redrawn with fewer crumbs every ant takes some food.


    Exercise 9.14 In class Food, create a field for the number of crumbs currently
    in the pile. Initialize it to 100.


    ### Exercise 9.15 Create a new private method called updateImage, which creates
    an image of a fixed size and draws a dot on it at a random location for each crumb
    currently in the pile. Choose a size for the pile that you looks good. Call this
    method from the constructor.


    If you completed the exercise above, and you placed food crumbs at a random location
    within the Food image (using Greenfoot.getRandomNumber to obtain the coordinates),
    you will notice that the pile of crumbs has a square-ish shape (Figure 9.3a).
    This is because the image itself is square, and the crumbs are evenly distributed
    over the image.


    If we want to change this to look more like a pile (with most crumbs towards the
    middle, and other crumbs in a rough circle-shape around it, Figure 9.3b), we can
    then use another number method to place the crumbs differently. We shall do this
    with exercises 9.16 and 9.17. Note that these are more advanced exercises and
    are purely cosmetic: They merely change the look of the food pile, and none of
    its functionality, they could safely be skipped.


    ### Exercise 9.16 Consult the API documentation for the standard Java class library.
    Find the documentation for class Random from the java.util package. Objects of
    this class are random number generators that are more flexible than Greenfoot''s
    getRandomNumber method. The method of interest to us is the one that returns numbers
    in a Gaussian distribution (also called a "normal distribution"). What is the
    method''s name, and what does it do?


    ### Exercise 9.17 In your Food class, change your placement of food crumbs in
    the image to make use of the Gaussian distribution of random numbers. For this,
    you have to use a java.util.Random object to create random numbers, instead of
    Greenfoot.getRandomNumber.


    Figure 9.3

    Placement of food crumbs with different randomizer algorithms


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_163_0.png)

    ![](img/9d90a1ac20b9439aba2e593bea21f58a_163_1.png)


    # 148 Chapter 9 Simulations


    ### Side note: Random distributions


    If we need random behavior in our programs, it is sometimes important to think
    about what kind of random distribution we need. Many random functions, such as
    the Greenfoot.getRandomnumber method, produce a uniform distribution. In this,
    the chance of every possible result occurring is same. The Gaussian random number
    gives us a normal distribution. This is in which the average results are more
    likely to occur, and more extreme cases are rarer.


    If we, for example, program a dice game, we need a uniform distribution. Each
    side of the die is evenly likely to come up. On the other hand, if we model the
    speed of cars in a traffic simulation, a normal distribution would be better.
    Most cars are driving somewhere close to the average speed, and few cars are very
    slow or very fast.


    Next, we need to add functionality to remove some crumbs from the food pile, so
    that ants can take some food.


    > Exercise 9.18 Add a public method to class Food that removes a few crumbs from
    the pile. Make sure that the image is redrawn with the correct number of crumbs.
    When the crumbs are all gone, the Food object should remove itself from the world.
    Test this method interactively.


    ## 9.5 Adding pheromones


    **Exercise 9.19** In the *Ant* class, implement a searchFood method. This method
    should initially do a random walk and check whether we have run into food pile.
    If we find a food pile, stop execution. (This is just to test whether we have
    detected the food.)


    **Exercise 9.20** Add functionality to pick up food when we find a food pile (instead
    of stopping execution). We need to remove some crumbs from the food pile (we should
    already have a method for this), note that we are now carrying food (we probably
    need a field for this), and change the ant''s image. There is already an image
    prepared in the scenario, named ant-with-food.png, that you can use.


    **Exercise 9.21** Ensure the ants toward home when carrying food.


    **Exercise 9.22** Implement a method that checks whether an ant has reached home.
    If it has reached home, drop its food. Dropping the food consists of noting that
    it is carrying food anymore (including changing the image back) and calling the
    *Ant*''s countFood method to record that it has collected this food crumb.


    ![](img/9d90a1ac20b9439aba2e593bea21f58a_165_0.png)


    Pay attention to the quality of your code: Use short methods with distinct purposes
    and make sure to comment your methods well. Do not write too code into a single
    method.


    ## Setting up the world


    Before we go on add pheromones to our scenario, let us first add some initialization
    code that creates some ant hills and food for us automatically, so that we do
    not have to repeat this manually every time we wish.


    **Exercise 9.23** Add code to class AntWorld, so that it automatically creates
    two ants and few piles of food in the world.


    ## Adding pheromones


    Now we have a good setup, we are ready to add pheromones. Each pheromone object
    is a small drop of a chemical substance that the ants leave on the ground. This
    drop will evaporate fairly quickly and then disappear.

