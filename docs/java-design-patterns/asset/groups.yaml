    # PROTOTYPE PATTERN


    Prototype pattern is one of the Creational Design patterns, so it provides a mechanism
    of object creation. Prototype pattern is used when the Object creation is a costly
    affair and requires a lot of time and resources and you have a similar object
    already existing. This pattern provides a mechanism to copy the original object
    to a new object and then modify it according to our needs. This pattern uses java
    cloning to copy the object.


    It would be easy to understand this pattern with an example, suppose we have an
    Object that loads data from database. Now we need to modify this data in our program
    multiple times, so it''s not a good idea to create the Object using new keyword
    and load all the data again from database. So the better approach is to clone
    the existing object into a new object and then do the data manipulation.


    Prototype design pattern mandates the Object which you are copying should provide
    the copying feature. It should not be done by any other class. However whether
    to use shallow or deep copy of the Object properties depends on the requirements
    and it''s a design decision.


    One example of how this can be useful is if an original object is created with
    a resource such as a data stream that may not be available at the time that a
    clone of the object is needed. Another example is if the original object creation
    involves a significant time commitment, such as reading data from a database or
    over a network.


    Normally in Java, if you''d like to use cloning (i.e., the prototype pattern),
    you can utilize the clone () method and the Cloneable interface. By default, clone
    () performs a shallow copy. Serializable can be used to simplify deep copying.


    However, we can implement our own prototype pattern. To do so, we''ll create a
    Prototype interface that features a doClone () method.


    Below example describes how to design an advanced bike by cloning the basic bike
    object.'
