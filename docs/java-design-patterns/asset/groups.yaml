    \nIn javax.faces.context, ExternalContext internally uses ServletContext, HttpSession,\
    \ HttpServletRequest, HttpServletResponse, etc. It allows the Faces API to be\
    \ unaware of the nature of its containing application environment.\n\n## BRIDGE\
    \ PATTERN\n\nWhen we have interface hierarchies in both interfaces as well as\
    \ implementations, then builder design pattern is used to decouple the interfaces\
    \ from implementation and hiding the implementation details from the client programs.\n\
    \nAccording to GoF bridge design pattern: Decouple an abstraction from its implementation\
    \ so that the two can vary independently.\n\nIn the bridge pattern, we separate\
    \ an abstraction and its implementation and develop separate inheritance structures\
    \ for both the abstraction and the implementer. The abstraction contains a reference\
    \ to the implementer. Children of the abstract class are likewise concrete implementer.\
    \ Children of the abstraction are referred to as refined abstractions, and children\
    \ of the implementer are concrete implementers. Since we can change the reference\
    \ to the implementer in the abstraction, we are able to change the abstraction's\
    \ implementer at run-time. Changes to the implementer do not affect client code.\n\
    \nThe Bridge Pattern's intent is to decouple an abstraction from its implementation\
    \ so that the two can vary independently. It puts the abstraction and implementation\
    \ into two different class hierarchies so that both can extend independently.\n\
    \n## BEFORE BRIDGE DESIGN PATTERN\n\n![](img/0b4795df4cc66a3db522e95431dd21bb_48_0.png)\n\
    \n## AFTER BRIDGE DESIGN PATTERN\n\n![](img/0b4795df4cc66a3db522e95431dd21bb_49_0.png)\n\
    ![](img/0b4795df4cc66a3db522e95431dd21bb_49_1.png)\n\nThe adapter design pattern\
    \ helps in making two incompatible classes to work together. But, bridge design\
    \ pattern decouples the abstraction and implementation by creating different hierarchies.\n\
    \n```java\npackage com.dev.dp.structural.bridge;\n\n/**\n * abstraction in bridge\
    \ pattern\n */\npublic abstract class Vehicle {\n    protected VehicleType type1;\n\
    \    protected VehicleType type2;\n\n    public Vehicle(VehicleType type1, VehicleType\
    \ type2) {\n        this.type1 = type1;\n        this.type2 = type2;\n    }\n\n\
    \    abstract public void purchase();\n}\n```\n\n```java\npackage com.dev.dp.structural.bridge;\n\
    /**\n * Implementor for bridge pattern\n */\npublic interface VehicleType {\n\
    \    abstract public void book();\n}\n```\n\n```java\npackage com.dev.dp.structural.bridge;\n\
    /**\n * Refine abstraction 1 in bridge pattern\n */\npublic class Car extends\
    \ Vehicle {\n    public Car(VehicleType type1, VehicleType type2) {\n        super(type1,type2);\n\
    \    }\n    @Override\n    public void purchase() {\n        System.out.print(\"\
    Car\\n\");\n        type1.book();\n        type2.book();\n    }\n}\n```\n\n```java\n\
    package com.dev.dp.structural.bridge;\n/**\n * Refine abstraction 2 in bridge\
    \ pattern\n */\npublic class Bike extends Vehicle {\n    public Bike(VehicleType\
    \ type1, VehicleType type2) {\n        super(type1, type2);\n    }\n    @Override\n\
    \    public void purchase() {\n        System.out.print(\"Bike\\n\");\n      \
    \  type1.book();\n        type2.book();\n    }\n}\n```\n\n```java\npackage com.dev.dp.structural.bridge;\n\
    /**\n * Concrete implementation 1 for bridge pattern\n */\npublic class NewVehicle\
    \ implements VehicleType {\n    @Override\n    public void book() {\n        System.out.print(\"\
    \ New Vehicle\");\n    }\n}\n```\n\n```java\npackage com.dev.dp.structural.bridge;\n\
    \n/**\n * Concrete implementation 2 for bridge pattern\n */\npublic class OldVehicle\
    \ implements VehicleType {\n\n    @Override\n    public void book() {\n      \
    \  System.out.println(\" Old Vehicle\");\n    }\n}\n```\n\n```java\npackage com.dev.dp.structural.bridge;\n\
    public class BridgePatternTest {\n    public static void main(String[] args) {\n\
    \n        Vehicle vehicle1 = new Car(new NewVehicle(),new OldVehicle());\n   \
    \     vehicle1.purchase();\n\n        Vehicle vehicle2 = new Bike(new NewVehicle(),new\
    \ OldVehicle());\n        vehicle2.purchase();\n    }\n}\n```\n\nCar New Vehicle\
    \ Old Vehicle\nBike New Vehicle Old Vehicle\n\n## Summary of Bridge Design Pattern:\n\
    \n- Creates two different hierarchies. One for abstraction and another for implementation.\n\
    - Avoids permanent binding by removing the dependency between abstraction and\
    \ implementation.\n- We create a bridge that coordinates between abstraction and\
    \ implementation.\n- Abstraction and implementation can be extended separately.\n\
    - Should be used when we have needed to switch implementation at runtime.\n- Client\
    \ should not be impacted if there is modification in implementation of abstraction.\n\
    - Best used when you have multiple implementations.\n\n## Usage in JDK:\n\n- AWT\
    \ (It provides an abstraction layer which maps onto onto the native OS the windowing\
    \ support.)\n- JDBC\n\n## DECORATOR PATTERN\n\nThe intent of the Decorator Design\
    \ Pattern is to attach additional responsibilities to an object dynamically. Decorators\
    \ provide a flexible alternative to sub-classing for extending functionality.\n\
    \nThe Decorator Pattern is used to extend the functionality of an object dynamically\
    \ without having to change the original class source or inheritance. This is accomplished\
    \ by creating an object wrapper referred to as a Decorator around the actual object.\n\
    \nThe Decorator object is designed to have the same interface as the underlying\
    \ object. This allows a client to interact with the Decorator object in exactly\
    \ the same manner as it would with the underlying actual object. The Decorator\
    \ object contains a reference to the actual object. The Decorator object receives\
    \ all requests (calls) from a client. In turn, it forwards requests to the underlying\
    \ object. The Decorator adds some functionality before or after forwarding requests\
    \ to the underlying object. This ensures that additional functionality can be\
    \ added to a given object without modifying its structure.\n\nComponent Interface\
    \ – The interface or abstract class defining the methods that will be implemented.\
    \ In our case Icecream will be the component interface.\n\n```java\npackage com.dp.structural.decorators;\n\
    public interface Icecream {\n    public String makecream();\n}\n```\n\nComponent\
    \ Implementation – The basic implementation of the component interface. We can\
    \ have SimpleIcecream as our component implementation.\n\n```java\npackage com.dp.structural.decorator;\n\
    public class SimpleIcecream implements Icecream {\n    @Override\n    public String\
    \ makecream() {\n        return \"Base-Icecream\";\n    }\n}\n```\n\nDecorator\
    \ – Decorator class implements the component interface and it has HAS-A relationship\
    \ with the component interface. The component variable should be accessible to\
    \ the child decorator classes, so we will make this variable protected.\n\n```java\n\
    package com.dev.dp.structural.decorator;\npublic class IcecreamDecorator implements\
    \ IceCream {\n    protected IceCream specialIceCream;\n\n    public IcecreamDecorator(IceCream\
    \ specialIceCream) {\n        this.specialIceCream = specialIceCream;\n    }\n\
    \n    @Override\n    public String makeCream() {\n        return specialIceCream.makeCream();\n\
    \    }\n}\n```\n\nConcrete Decorators – Extending the base decorator functionality\
    \ and modifying the component behavior accordingly. We can have concrete decorator\
    \ classes as NuttyIcecreamDecorator & HoneyIcecreamDecorator.\n\n```java\npackage\
    \ com.dev.dp.structural.decorator;\npublic class NuttyDecorator extends IcecreamDecorator\
    \ {\n    public NuttyDecorator(IceCream specialIceCream) {\n        super(specialIceCream);\n\
    \    }\n\n    public String makeCream() {\n        return specialIceCream.makeCream()\
    \ + addNuts();\n    }\n\n    private String addNuts() {\n        return \"Crunchy\
    \ Nuts\";\n    }\n}\n```\n\n```java\npackage com.dev.dp.structural.decorator;\n\
    public class HoneyDecorator extends IcecreamDecorator {\n    public HoneyDecorator(IceCream\
    \ specialIceCream) {\n        super(specialIceCream);\n    }\n\n    public String\
    \ makeCream() {\n        return specialIceCream.makeCream() + addHoney();\n  \
    \  }\n\n    private String addHoney() {\n        return \"Sweet Honey\";\n   \
    \ }\n}\n```\n"
  mdcn: "\n来自客户端的接口。是否使用 Facade（外观模式）完全取决于客户端代码。\n\n- 边界模式可以应用于开发过程的任何阶段，通常在接口数量增加且系统变得复杂时使用。\n\
    - 子系统接口感知不到外观的存在，并且不应该包含任何对外观接口的引用。\n- 边界模式应该适用于相似类型的接口；其目的是提供一个单一接口，而不是多个执行相似任务的接口。\n\
    - 子系统之间可能相互依赖。在这种情况下，外观可以作为协调者，解耦子系统之间的依赖关系。\n- 我们可以将工厂模式与外观模式结合，为客户端系统提供更好的接口。\n\
    \n## 在 Java 中的用法：\n\n在 `javax.faces.context` 中，`ExternalContext` 内部使用了 `ServletContext`、`HttpSession`、`HttpServletRequest`、`HttpServletResponse`\
    \ 等。它允许 Faces API 无需感知其所处应用环境的性质。\n\n## 桥接模式 (BRIDGE PATTERN)\n\n当接口和实现都存在接口层次结构时，使用桥接设计模式将接口与实现解耦，并向客户端程序隐藏实现细节。\n\
    \n根据 GoF 桥接设计模式：将抽象与其实现解耦，以便两者可以独立地变化。\n\n在桥接模式中，我们将抽象和实现分离，并为抽象类和实现者分别开发独立的继承结构。抽象类包含一个指向实现者的引用。抽象类的子类同样是具体的实现者。抽象的子类被称为扩展抽象，实现者的子类被称为具体实现。由于我们可以更改抽象中对实现者的引用，因此可以在运行时更改抽象的实现。对实现者的更改不会影响客户端代码。\n\
    \n桥接模式的意图是将抽象与其实现解耦，以便两者可以独立变化。它将抽象和实现放在两个不同的类层次结构中，以便两者都能独立扩展。\n\n## 桥接模式之前\n\
    \n![](img/0b4795df4cc66a3db522e95431dd21bb_48_0.png)\n\n## 桥接模式之后\n\n![](img/0b4795df4cc66a3db522e95431dd21bb_49_0.png)\n\
    ![](img/0b4795df4cc66a3db522e95431dd21bb_49_1.png)\n\n适配器设计模式帮助两个不兼容的类协同工作。但桥接模式通过创建不同的层次结构来解耦抽象和实现。\n\
    \n```java\npackage com.dev.dp.structural.bridge;\n\n/**\n * 桥接模式中的抽象\n */\npublic\
    \ abstract class Vehicle {\n    protected VehicleType type1;\n    protected VehicleType\
    \ type2;\n\n    public Vehicle(VehicleType type1, VehicleType type2) {\n     \
    \   this.type1 = type1;\n        this.type2 = type2;\n    }\n\n    abstract public\
    \ void purchase();\n}\n```\n\n```java\npackage com.dev.dp.structural.bridge;\n\
    /**\n * 桥接模式的实现者\n */\npublic interface VehicleType {\n    abstract public void\
    \ book();\n}\n```\n\n```java\npackage com.dev.dp.structural.bridge;\n/**\n * 桥接模式中的扩展抽象\
    \ 1\n */\npublic class Car extends Vehicle {\n    public Car(VehicleType type1,\
    \ VehicleType type2) {\n        super(type1,type2);\n    }\n    @Override\n  \
    \  public void purchase() {\n        System.out.print(\"Car\\n\");\n        type1.book();\n\
    \        type2.book();\n    }\n}\n```\n\n```java\npackage com.dev.dp.structural.bridge;\n\
    /**\n * 桥接模式中的扩展抽象 2\n */\npublic class Bike extends Vehicle {\n    public Bike(VehicleType\
    \ type1, VehicleType type2) {\n        super(type1, type2);\n    }\n    @Override\n\
    \    public void purchase() {\n        System.out.print(\"Bike\\n\");\n      \
    \  type1.book();\n        type2.book();\n    }\n}\n```\n\n```java\npackage com.dev.dp.structural.bridge;\n\
    /**\n * 桥接模式中的具体实现 1\n */\npublic class NewVehicle implements VehicleType {\n\
    \    @Override\n    public void book() {\n        System.out.print(\" New Vehicle\"\
    );\n    }\n}\n```\n\n```java\npackage com.dev.dp.structural.bridge;\n\n/**\n *\
    \ 桥接模式中的具体实现 2\n */\npublic class OldVehicle implements VehicleType {\n\n    @Override\n\
    \    public void book() {\n        System.out.println(\" Old Vehicle\");\n   \
    \ }\n}\n```\n\n```java\npackage com.dev.dp.structural.bridge;\npublic class BridgePatternTest\
    \ {\n    public static void main(String[] args) {\n\n        Vehicle vehicle1\
    \ = new Car(new NewVehicle(),new OldVehicle());\n        vehicle1.purchase();\n\
    \n        Vehicle vehicle2 = new Bike(new NewVehicle(),new OldVehicle());\n  \
    \      vehicle2.purchase();\n    }\n}\n```\n\nCar New Vehicle Old Vehicle\nBike\
    \ New Vehicle Old Vehicle\n\n## 桥接模式总结：\n\n- 创建两个不同的层次结构：一个用于抽象，另一个用于实现。\n- 通过移除抽象与实现之间的依赖关系，避免了永久绑定。\n\
    - 我们创建了一个桥接，在抽象和实现之间进行协调。\n- 抽象和实现可以分别扩展。\n- 当我们需要运行时切换实现时，应该使用此模式。\n- 如果抽象的实现发生修改，客户端不应受到影响。\n\
    \n## 在 JDK 中的用法：\n\n- AWT（它提供了一个窗口的抽象层）\n- JDBC\n\n## 装饰器模式 (DECORATOR PATTERN)\n\
    \n装饰器模式的意图是动态地给对象附加责任。装饰器提供了比子类化更灵活的扩展功能的方法。\n\n装饰器模式用于在不修改原有结构的情况下动态扩展对象的功能。装饰器模式通过创建包装类来替代子类化。装饰器对象通过包装实际对象来实现扩展功能。\n\
    \n装饰器对象与实际对象具有相同的接口，这允许客户端以完全相同的方式与装饰器对象交互。装饰器对象包含实际对象的引用。装饰器对象接收客户端的所有请求，并在将请求转发给实际对象之前或之后添加某些功能。这确保了可以在不修改原有类的情况下添加新功能。\n\
    \n组件接口 - 定义要实现的方法的接口或抽象类。在本例中，`Icecream` 是组件接口。\n\n```java\npackage com.dp.structural.decorators;\n\
    public interface Icecream {\n    public String makecream();\n}\n```\n\n组件实现 -\
    \ 组件接口的基本实现。在本例中，`SimpleIcecream` 是我们的组件实现。\n\n```java\npackage com.dp.structural.decorator;\n\
    public class SimpleIcecream implements Icecream {\n    @Override\n    public String\
    \ makecream() {\n        return \"Base-Icecream\";\n    }\n}\n```\n\n装饰器 - 装饰器类实现组件接口，并与组件接口建立\
    \ HAS-A 关系。为了让子装饰器类访问组件变量，我们将该变量设为 `protected`。\n\n```java\npackage com.dev.dp.structural.decorator;\n\
    public class IcecreamDecorator implements IceCream {\n    protected IceCream specialIceCream;\n\
    \n    public IcecreamDecorator(IceCream specialIceCream) {\n        this.specialIceCream\
    \ = specialIceCream;\n    }\n\n    @Override\n    public String makeCream() {\n\
    \        return specialIceCream.makeCream();\n    }\n}\n```\n\n具体装饰器 - 扩展基础装饰功能并相应地修改组件行为。我们可以拥有具体的装饰器类，如\
    \ `NuttyIcecreamDecorator` 和 `HoneyIcecreamDecorator`。\n\n```java\npackage com.dev.dp.structural.decorator;\n\
    public class NuttyDecorator extends IcecreamDecorator {\n    public NuttyDecorator(IceCream\
    \ specialIceCream) {\n        super(specialIceCream);\n    }\n\n    public String\
    \ makeCream() {\n        return specialIceCream.makeCream() + addNuts();\n   \
    \ }\n\n    private String addNuts() {\n        return \"Crunchy Nuts\";\n    }\n\
    }\n```\n\n```java\npackage com.dev.dp.structural.decorator;\npublic class HoneyDecorator\
    \ extends IcecreamDecorator {\n    public HoneyDecorator(IceCream specialIceCream)\
    \ {\n        super(specialIceCream);\n    }\n\n    public String makeCream() {\n\
    \        return specialIceCream.makeCream() + addHoney();\n    }\n\n    private\
    \ String addHoney() {\n        return \"Sweet Honey\";\n    }\n}\n```\n"
