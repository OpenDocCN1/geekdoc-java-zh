- md: "\n# MEDIATOR PATTERN\n\nMediator promotes loose coupling by keeping objects\
    \ from referring to each other explicitly, and it lets you vary their interaction\
    \ independently.\n\nMediator design pattern is used to provide a centralized communication\
    \ medium between different objects in a system.\n\nRather than interacting directly\
    \ with each other, objects ask the Mediator to interact on their behalf which\
    \ ensures reusability and loose coupling. It encapsulates the interaction between\
    \ the objects and makes them independent from each other. This allows them to\
    \ vary their interaction with other objects in a totally different way by implementing\
    \ a different mediator. The Mediator helps to reduce the complexity of the classes.\
    \ Each object no longer has to know in detail about how to interact with the other\
    \ objects. The coupling between objects goes from brittle to loose and agile.\n\
    \nMediator design pattern is very helpful in an enterprise application where multiple\
    \ objects are interacting with each other. If the objects interact with each other,\
    \ the system components are tightly-coupled with each other that make maintainability\
    \ cost higher and not flexible to extend easily. Mediator pattern focuses on a\
    \ mediator between objects for communication and help in implementing loose-coupling\
    \ objects.\n\nAir traffic controller is a great example of mediator pattern where\
    \ the airport control room works as a mediator for communication between different\
    \ flights. Mediator works as a router between objects and it can have its own\
    \ logic to provide way of communication.\n\nThe major participants of the Mediator\
    \ pattern are:\n\n- *Mediator*: Defines an interface for communicating with Colleague\
    \ objects.\n- *ConcreteMediator*: Implements cooperative behavior by coordinating\
    \ Colleague objects. It also knows and maintains its colleagues.\n- *Colleague\
    \ Classes*: Each Colleague class knows its Mediator objects. Each colleague communicates\
    \ with its mediator whenever it would have otherwise communicated with another\
    \ colleague.\n\n```java\n/**\n * Colleague A wants to talk, and Colleague B wants\
    \ to fight with mediator.\n * when they do some action(i.e., something),\n * they\
    \ invoke mediator to do that.\n */\npublic interface Mediator {\n    public void\
    \ talk();\n    public void fight();\n    public void registerA(Colleague a);\n\
    \    public void registerB(Colleague b);\n}\n```\n\n```java\npublic class ConcreteMediator\
    \ implements IMediator {\n    ColleagueA talk;\n    ColleagueB fight;\n\n    @Override\n\
    \    public void talk() {\n        System.out.println(\"Mediator is talking\"\
    );\n        // let the talk colleague do some stuff\n    }\n\n    @Override\n\
    \    public void fight() {\n        System.out.println(\"Mediator is fighting\"\
    );\n        // let the fight colleague do some stuff\n    }\n\n    @Override\n\
    \    public void registerA(ColleagueA a) {\n        this.talk=a;\n    }\n\n  \
    \  @Override\n    public void registerB(ColleagueB b) {\n        this.fight=b;\n\
    \    }\n}\n```\n\n```java\npackage com.dev.dp.behavioral.mediator;\npublic abstract\
    \ class Colleague {\n    IMediator mediator;\n    public abstract void doSomething();\n\
    }\n```\n\n```java\npackage com.dev.dp.behavioral.mediator;\npublic class ColleagueA\
    \ extends Colleague {\n    public ColleagueA(IMediator mediator) {\n        this.mediator=mediator;\n\
    \        this.mediator.registerA(this);\n    }\n\n    @Override\n    public void\
    \ doSomething() {\n        this.mediator.talk();\n    }\n}\n```\n\n```java\npackage\
    \ com.dev.behavioral.mediator;\npublic class ColleagueB extends Colleague {\n\
    \    public ColleagueB(Mediator mediator) {\n        this.mediator=mediator;\n\
    \        this.mediator.registerB(this);\n    }\n    @Override\n    public void\
    \ doSomething() {\n        this.mediator.fight();\n    }\n}\n```\n\n```java\n\
    package com.dev.dp.behavioralPatternTest\npublic class MediatorTest {\n    public\
    \ static void main(String[] args) {\n        Mediator mediator = new ConcreteMediator();\n\
    \n        ColleagueA talkColleague = new ColleagueA(mediator);\n        talkColleague.doSomething();\n\
    \n        ColleagueB fightColleague = new ColleagueB(mediator);\n        fightColleague.doSomething();\n\
    \    }\n}\n```\n\nOutput:\nMediator is talking\nMediator is fighting\n\n# When\
    \ to use the Mediator Pattern:\n\n- A set of objects communicate in well-defined\
    \ but complex ways. The resulting interdependencies are unstructured and difficult\
    \ to understand.\n- Reusing an object is difficult because it refers to and communicates\
    \ with many other objects.\n- A behavior that's distributed between several classes\
    \ should be customizable without lot of sub-classing.\n\n# Mediator Pattern in\
    \ JDK:\n\n- *java.util.Timer* class scheduleXXX () methods.\n- *java Concurrency\
    \ Executor* execute () method.\n- *java.lang.reflect.Method invoke () method.*\n\
    \n# CHAIN OF RESPONSIBILITY\n\nChain of responsibility pattern is used to achieve\
    \ loose coupling in software design where a request from client is passed to a\
    \ chain of objects to process them. Then the object in the chain will themselves\
    \ decide who will be processing the request and whether the request is required\
    \ to be sent to the next object in the chain or not.\n\nWhen there is more than\
    \ one objects that can handle or fulfill a client request, the pattern recommends\
    \ giving each of these objects a chance to process the request in some sequential\
    \ order. Applying the pattern in such a case, each of these potential handlers\
    \ can be arranged in the form of a chain, with each object having a reference\
    \ to the next object in the chain.\n"
  mdcn: "\n\n# 中介者模式\n\n中介者通过防止对象之间显式的相互引用来实现松耦合，并允许你独立地改变它们的交互方式。\n\n中介者模式用于在系统的不同对象之间提供一个集中的通信媒介。\n\
    \n对象不再直接相互相互交互，而是请求中介者代表它们进行交互，这确保了可重用性和松耦合。它封装了对象之间的交互，使它们相互独立。这允许它们通过实现不同的中介者，以完全不同的方式改变与其他对象的交互。中介者有助于降低类的复杂性。每个对象都不再需要详细了解如何与其他对象进行交互。对象之间的耦合从脆弱变为松散且敏捷。\n\
    \n中介者模式在多个对象相互交互的企业级应用中非常有帮助。如果对象之间相互交互，系统组件之间就是紧密耦合的，这导致维护成本更高，且不利于扩展。中介者模式关注于对象之间用于通信的中介者，并有助于实现松耦合的对象。\n\
    \n空中管制员是中介者模式的一个极佳例子，机场控制室充当不同航班之间通信的中介者。中介者充当对象之间的路由器，它可以有自己的逻辑来提供通信方式。\n\n中介者模式的主要参与者有：\n\
    \n- *Mediator（中介者)*：定义与 Colleague（同事）对象通信的接口。\n- *ConcreteMediator（具体中介者)*：通过协调同事对象来实现协作行为。它还知道并维护它的同事。\n\
    - *Colleague Classes（同事类)*：每个同事类都知道它的中介者对象。每当同事本该与另一个同事通信时，都会与其中介者通信。\n\n```java\n\
    /**\n * Colleague A 想说话，而 Colleague B 想和 mediator 吵架。\n * 当他们执行某些动作（i.e., something）时，\n\
    \ * 他们调用 mediator 句执行该操作。\n */\npublic interface Mediator {\n    public void talk();\n\
    \    public void fight();\n    public void registerA(Colleague a);\n    public\
    \ void registerB(Colleague b);\n}\n```\n\n```java\npublic class ConcreteMediator\
    \ implements IMediator {\n    ColleagueA talk;\n    ColleagueB fight;\n\n    @Override\n\
    \    public void talk() {\n        System.out.println(\"Mediator is talking\"\
    );\n        // let the talk colleague do some stuff\n    }\n\n    @Override\n\
    \    public void fight() {\n        System.out.println(\"Mediator is fighting\"\
    );\n        // let the fight colleague do some stuff\n    }\n\n    @Override\n\
    \    public void registerA(ColleagueA a) {\n        this.talk=a;\n    }\n\n  \
    \  @Override\n    public void registerB(ColleagueB b) {\n        this.fight=b;\n\
    \    }\n}\n```\n\n```java\npackage com.dev.dp.behavioral.mediator;\npublic abstract\
    \ class Colleague {\n    IMediator mediator;\n    public abstract void doSomething();\n\
    }\n```\n\n```java\npackage com.dev.dp.behavioral.mediator;\npublic class ColleagueA\
    \ extends Colleague {\n    public ColleagueA(IMediator mediator) {\n        this.mediator=mediator;\n\
    \        this.mediator.registerA(this);\n    }\n\n    @Override\n    public void\
    \ doSomething() {\n        this.mediator.talk();\n    }\n}\n```\n\n```java\npackage\
    \ com.dev.behavioral.mediator;\npublic class ColleagueB extends Colleague {\n\
    \    public ColleagueB(Mediator mediator) {\n        this.mediator=mediator;\n\
    \        this.mediator.registerB(this);\n    }\n    @Override\n    public void\
    \ doSomething() {\n        this.mediator.fight();\n    }\n}\n```\n\n```java\n\
    package com.dev.dp.behavioralPatternTest\npublic class MediatorTest {\n    public\
    \ static void main(String[] args) {\n        Mediator mediator = new ConcreteMediator();\n\
    \n        ColleagueA talkColleague = new ColleagueA(mediator);\n        talkColleague.doSomething();\n\
    \n        ColleagueB fightColleague = new ColleagueB(mediator);\n        fightColleague.doSomething();\n\
    \    }\n}\n```\n\n输出:\nMediator is talking\nMediator is fighting\n\n# 责任链模式\n\n\
    责任链模式用于在软件设计中实现松耦合，客户端的请求被传递给对象链进行处理。然后链中的对象将自己决定由谁来处理请求，以及是否需要将请求发送到链中的下一个对象。\n\
    \n"
