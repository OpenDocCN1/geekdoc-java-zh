    # VISITOR PATTERN


    Visitor pattern is used when we have to perform an operation on a group of similar
    kind of Objects. With the help of visitor pattern, we can move the operational
    logic from the objects to another class. For example, think of a Shopping cart
    where we can add different type of items (Elements), and when we click on checkout
    button, it calculates the total amount to be paid. Now we can have the calculation
    logic in item classes or we can move out this logic to another class using visitor
    pattern. So using visitor pattern we can move out logics to another class.


    The Visitor pattern allows the operation to be defined without changing the class
    of any of the objects in the collection. To accomplish this, the Visitor pattern
    suggests defining the operation in a separate class class. This separates the
    operation from the object collection that it operates on. For every new operation
    to be defined, a new visitor class is created. Since the operation is to be performed
    across a set of objects, the visitor needs a way of accessing the public members
    of these objects.


    Following components are involved in visitor pattern.


    **Visitor:** Declares a Visit operation for each class of ConcreteElement in the
    object structure. The operation''s name and signature identifies the class that
    sends the Visit request to the visitor. That lets the visitor determine the concrete
    class of the element being visited. Then the visitor can access the element directly
    through its particular interface.


    **ConcreteVisitor:** Implements each operation declared by Visitor. Each operation
    implements a fragment of the algorithm defined for the corresponding class of
    object in the structure. ConcreteVisitor provides the context for the algorithm
    and stores its local state. This state often accumulates results during the traversal
    of the structure.


    **Element:** Defines an Accept operation that takes a visitor as an argument.


    **ConcreteElement:** Implements an Accept operation that takes a visitor as an
    argument.

    **ObjectStructure:**


    +   * Can enumerate its elements.

    * May provide a high-level interface to allow the visitor to visit its elements.

    * May either be a composite or a collection such as a list or a set.


    To implement visitor pattern, first of all we will create different type of items
    (Elements) to be used in shopping cart.'
