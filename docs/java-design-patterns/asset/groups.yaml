    ```\n\n```java\n// Cake is ready to eat:\nSystem.out.println(cake);\n}\n```\n\n\
    Output: Cake[sugar=1.0, butter=0.5, milk=0.5, cherry=0]\n\nIn static setting property,\
    \ we can use setter method as another option.\n\nAs you can clearly see, now a\
    \ client only needs to provide the mandatory fields and the fields which are important\
    \ to him. To create the form object now\n\n## When to use Builder:\n\n- When the\
    \ construction of an object must be independent of its representation.\n- When\
    \ the construction process should allow the same construction process to create\
    \ different representations of the object.\n- When the object must be constructed\
    \ in many steps.\n- When the data used in constructing the object should be accessible\
    \ only during the construction.\n\n## Builder Pattern:\n\n- When the cost of creating\
    \ a complex object is high.\n- When the construction process should be independent\
    \ of its representation.\n- When the object must be constructed in many steps.\n\
    - When the data used in constructing the object should be accessible only during\
    \ the construction.\n\n## Prototype in Java:\n\n- When the classes to instantiate\
    \ are specified at run-time, for example, by dynamic loading.\n- To avoid building\
    \ a class hierarchy of factories that parallels the class hierarchy of products.\n\
    - When instances of a class can have one of only a few combinations of state.\
    \ It may be more convenient to install a corresponding number of prototypes and\
    \ clone them.\n\n## PROTOTYPE PATTERN\n\nPrototype pattern is a creational design\
    \ pattern that allows you to copy objects without specifying their class. The\
    \ pattern is used to create new objects by copying an existing object.\n\nOne\
    \ example of how this can be useful is when creation is expensive or complex,\
    \ such as reading data from a database or over a network. In Java, if you'd like\
    \ to use cloning (i.e., prototype pattern), you can utilize the `clone()` method.\
    \ By default, `clone()` performs a shallow copy. However, we can implement our\
    \ own deep copy if needed.\n\nBelow example describes how to design an advanced\
    \ bike by cloning the basic object.\n\n```java\npublic class Bike implements Cloneable\
