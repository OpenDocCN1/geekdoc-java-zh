  - "[PAGE 70]\n\n# OBSERVER PATTERN\n\nIn observer design pattern multiple observer\
    \ objects registers with a subject for change notification. When the state of\
    \ subject changes, it notifies the observers. Objects that listen or watch for\
    \ change are called observers and the object that is being watched for is called\
    \ subject.\n\nPattern involved is also called as publish-subscribe pattern.\n\n\
    +   * Subject provides interface for observers to register and unregister themselves\
    \ by the subject.\n* Subject knows who its subscribers.\n* Multiple observers\
    \ can subscribe for notifications.\n* Subject publishes the notifications.\n*\
    \ Subject just sends the notification saying the state has changed. It does not\
    \ pass any state information.\n\nOnce the notification is received from subject,\
    \ observers call the subject and get data that is changed.\nThe above last two\
    \ points are not strictly followed in observer design pattern implementation.\
    \ Along with the notification, state is also passed in some implementation so\
    \ that the observer need not query back to the status. It is better not to do\
    \ this way.\n\nThere are four participants in the Observer pattern:\n\n+   * Subject,\
    \ which is used to register observers. Objects use this interface to register\
    \ as observers and also remove themselves from being observers.\n* Observer defines\
    \ an updating interface for objects that should be notified of changes in a subject.\
    \ All observers need to implement the Observer interface. This interface has a\
    \ method update(), which gets called when the Subject's state changes.\n* ConcreteSubject,\
    \ stores the state of implementing to ConcreteObserver objects. It sends a notification\
    \ to its observers when its state changes. A concrete subject always implements\
    \ the Subject interface. The notifyObservers() method is used to update all the\
    \ current observers whenever the state changes.\n* ConcreteObserver maintains\
    \ a reference to a ConcreteSubject object and implements the Observer interface.\
    \ Each observer registers with a concrete subject to receive updates.\n\nJava\
    \ provides inbuilt platform for implementing Observer pattern\n java.util.Observable\
    \ class and java.util.Observer interface. However it's not widely used because\
    \ the implementation is really simple and most of the times we don't want to end\
    \ extending a class for implementing Observer pattern as java doesn't provide\
    \ multiple inheritances in classes."
