  - "[PAGE 67]\n\n# CHAIN OF RESPONSIBILITY\n\nChain of responsibility pattern is\
    \ used to achieve lose coupling in software design where a request from client\
    \ is passed to a chain of objects to process them. Then the object in the chain\
    \ will themselves decide who will be processing the request and whether the request\
    \ is required to be sent to the next object in the chain or not.\n\nWhen there\
    \ is more than one objects that can handle or fulfill a client request, the pattern\
    \ recommends giving each of these objects a chance to process the request in some\
    \ sequential order. Applying the pattern in such a case, each of these potential\
    \ handlers can be arranged in the form of a chain, with each object having a reference\
    \ to the next object in the chain. The first object in the chain receives the\
    \ request and decides whether to handle the request or pass it on to the next\
    \ object in the chain. The request flows through all objects in the chain one\
    \ after the other until the request is handled by one of the handlers in the chain\
    \ or reaches the end of the chain without getting processed.\n\nLet's see the\
    \ example of chain of responsibility pattern in JDK and we will proceed to implement\
    \ a real example of this pattern. We know that we can have multiple blocks in\
    \ a try-catch block code. Here every catch block is kind of a processor to process\
    \ that particular exception. So when any exception occurs in the try block send\
    \ it to the first catch block to process. If the catch block is not able to process\
    \ it, it forwards the request to next object in chain i.e. next catch block. If\
    \ even the last catch block is not able to process it, the exception is thrown\
    \ outside of the chain to the calling program.\n\nOther examples are ATM money\
    \ dispenser, Servlet Filter and finally java's Exception Handling mechanism. We\
    \ know exception handling better than anybody else and we are daily living with\
    \ it. This qualifies as the best example for chain of responsibility.\n\nIn ATM\
    \ Dispense machine, the user enters the amount to be dispensed and the machine\
    \ dispense amount in terms of defined currency bills as $50, $20, $10 etc. If\
    \ the user enters an amount that is not multiples of 10, it throws error.\n\n\
    ```\n//This class is the request object.\npublic class Number {\n\n    private\
    \ int number;\n\n    public int getNumber() {\n        return number;\n    }\n\
    \n    public Number(int num){\n        number=num;\n    }\n}\n```"
  - "[PAGE 68]\n\n```\n// This is the interface that acts as a chain link.\npublic\
    \ interface Chain {\n    public void setNext(Chain nextChain);\n    public void\
    \ process(Number request);\n}\n```\n\n```\npackage com.dev.dp.behavior.chainOfResponsibility;\n\
    public class PositiveNumberProcessor implements Chain {\n    private Chain nextChain;\n\
    \n    @Override\n    public void setNext(Chain c) {\n        nextChain = c;\n\
    \    }\n\n    @Override\n    public void process(Number request) {\n        if\
    \ (request.getNumber() > 0) {\n            System.out.println(\"PositiveNumberProcessor\
    \ : \" + request.getNumber());\n        } else {\n            nextChain.process(request);\n\
    \        }\n    }\n}\n```\n\n```\npackage com.dev.dp.behavior.chainOfResponsibility;\n\
    public class NegativeNumberProcessor implements Chain {\n    private Chain nextChain;\n\
    \n    @Override\n    public void setNext(Chain c) {\n        nextChain = c;\n\
    \    }\n\n    @Override\n    public void process(Number request) {\n        if\
    \ (request.getNumber() < 0) {\n            System.out.println(\"NegativeNumberProcessor\
    \ : \" + request.getNumber());\n        } else {\n            nextChain.process(request);\n\
    \        }\n    }\n}\n```\n\n```\npackage com.dev.dp.behavior.chainOfResponsibility;\n\
    public class ZeroProcessor implements Chain {\n    private Chain nextChain;\n\n\
    \    @Override\n    public void setNext(Chain c) {\n        nextChain = c;\n \
    \   }\n\n    @Override\n    public void process(Number request) {\n        if\
    \ (request.getNumber() == 0) {\n            System.out.println(\"ZeroProcessor\
    \ : \" + request.getNumber());\n        } else {\n            nextChain.process(request);\n\
    \        }\n    }\n}\n```"
- md: "\n[content]\n\n```java\npackage com.dev.dp.behavioral.chainOfResponsibility;\n\
    public class CORPatternTest {\n\n    public static void main(String[] args) {\n\
    \n        //Configure Chain of Responsibility\n        Chain c1 = new NegativeNumberProcessor();\n\
    \        Chain c2 = new ZeroProcessor();\n        Chain c3 = new PositiveNumberProcessor();\n\
    \        c1.setNext(c2);\n        c2.setNext(c3);\n\n        //chain of responsibility\n\
    \        c1.process(new Number(99));\n        c1.process(new Number(-30));\n \
    \       c1.process(new Number(0));\n        c1.process(new Number(100));\n\n \
    \   }\n}\n```\n\n# Output:\n\n![](img/0b4795df4cc66a3db522e95431dd21bb_69_0.png)\n\
    \n# When to use the Chain of Responsibility Pattern:\n\nUse Chain of Responsibility\
    \ when\n\n# Chain of Responsibility Pattern Examples in JDK:\n\n- * java.util.logging.Logger#log\
    \ ()\n- * javax.servlet.Filter#doFilter ()\n\n# OBSERVER PATTERN\n\nIn observer\
    \ design pattern multiple observer objects registers with a subject for change\
    \ notification. When the state of subject changes, it notifies the observers.\
    \ Objects that listen or watch for change are called observers and the object\
    \ that is being watched for is called subject.\n\nPattern involved is also called\
    \ as publish-subscribe pattern.\n\n- * Subject provides interface for observers\
    \ to register and unregister themselves by the subject.\n- Subject knows who its\
    \ subscribers.\n- Multiple observers can subscribe for notifications.\n- Subject\
    \ publishes the notifications.\n- Subject just sends the notification saying the\
    \ state has changed. It does not pass any state information.\n\nOnce the notification\
    \ is received from subject, observers call the subject and get data that is changed.\n\
    The above last two points are not strictly followed in observer design pattern\
    \ implementation. Along with the notification, state is also passed in some implementation\
    \ so that the observer need not query back to the status. It is better not to\
    \ do this way.\n\nThere are four participants in the Observer pattern:\n\n- *\
    \ Subject, which is used to register observers. Objects use this interface to\
    \ register as observers and also remove themselves from being observers.\n- Observer\
    \ defines an updating interface for objects that should be notified of changes\
    \ in a subject. All observers need to implement the Observer interface. This interface\
    \ has a method update(), which gets called when the Subject's state changes.\n\
    - ConcreteSubject, stores the state of implementing to ConcreteObserver objects.\
    \ It sends a notification to its observers when its state changes. A concrete\
    \ subject always implements the Subject interface. The notifyObservers() method\
    \ is used to update all the current observers whenever the state changes.\n- ConcreteObserver\
    \ maintains a reference to a ConcreteSubject object and implements the Observer\
    \ interface. Each observer registers with a concrete subject to receive updates.\n\
    \nJava provides inbuilt platform for implementing Observer pattern\njava.util.Observable\
    \ class and java.util.Observer interface. However it's not widely used because\
    \ the implementation is really simple and most of the times we don't want to end\
    \ extending a class for implementing Observer pattern as java doesn't provide\
    \ multiple inheritances in classes.\n\nLet us take a blog and subscriber example\
    \ for observer design pattern implementation. Assume that there is a blog and\
