    \ {\n            mob = new SamsungMobileFactory();\n        }\n        return\
    \ mob;\n    }\n}\n\npublic class LenovoMobileFactory extends MobileFactory {\n\
    \    public Lenovo createLenovoMobile() {\n        return new Lenovo();\n    }\n\
    }\n\npublic class SamsungMobileFactory extends MobileFactory {\n    public Samsung\
    \ createSamsungMobile() {\n        return new Samsung();\n    }\n}\n\npublic class\
    \ AbstractFactoryTest {\n    public static void main(String[] args) {\n      \
    \  MobileFactory factory = new MobileFactory();\n        MobileFactory info =\
    \ factory.createMobile(\"lenf\");\n        Lenovo len = (Lenovo)info.createLenovoMobile();\n\
    \        len.pictureCapacity();\n    }\n}\n```\n\n# Output:\n\nLenovo camera capacity\
    \ starts from 10 MP\n\nOther Example:\n\nHonda Factory: Brio, Civic,\nHyundai\
    \ Factory: Santro, EON etc.\n\n# BUILDER PATTERN\n\nIn general, the details of\
    \ object construction, such as instantiating and initializing the components that\
    \ make up the object, are kept within the object, often as part of the constructor.\
    \ This type of design closely ties the object construction process with the components\
    \ that make up the object. This approach is suitable as long as the object construction\
    \ is simple and the object construction process is definite and always produces\
    \ the same representation of the object.\n\nHowever, this design may not be effective\
    \ when the object being created is complex and the series of steps constituting\
    \ the object creation process can be implemented in different ways, producing\
    \ different representations of the object. Because the different implementations\
    \ of the construction process are all kept within the object, the object can become\
    \ bulky (construction bloat) and less modular. Subsequently, adding a new implementation\
    \ or making changes to an existing implementation requires changes to the existing\
