    # BRIDGE PATTERN


    When we have interface hierarchies in both interfaces as well as implementations,
    then builder design pattern is used to decouple the interfaces from implementation
    and hiding the implementation details from the client programs.


    According to GoF bridge design pattern: Decouple an abstraction from its implementation
    so that the two can vary independently.


    In the bridge pattern, we separate an abstraction and its implementation and develop
    separate inheritance structures for both the abstraction and the implementer.
    The abstraction contains a reference to the implementer. Children of the abstract
    class are likewise concrete implementer. Children of the abstraction are referred
    to as refined abstractions, and children of the implementer are concrete implementers.
    Since we can change the reference to the implementer in the abstraction, we are
    able to change the abstraction''s implementer at run-time. Changes to the implementer
    do not affect client code.


    The Bridge Pattern''s intent is to decouple an abstraction from its implementation
    so that the two can vary independently. It puts the abstraction and implementation
    into two different class hierarchies so that both can extend independently.


