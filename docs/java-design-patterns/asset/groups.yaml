    \ fields.\n\nThe question is, what sort of constructor should we write for such\
    \ class? Writing a constructor with long list of parameters is not a good choice,\
    \ this could frustrate the client especially if the important fields are only\
    \ a few. This could increase the scope of error; the client may provide a value\
    \ accidentally to a wrong field. Long sequences of identically typed parameters\
    \ can cause subtle bugs. If the client accidentally reverses two parameters, the\
    \ compiler will not complain, but the program will misbehave at runtime.\n\nInstead\
    \ of making the desired object directly, the client calls a constructor with all\
    \ of the required parameters and gets a builder object. Then the client calls\
    \ setter-like methods on the builder to set each optional parameter of interest.\
    \ Finally, the client calls a parameterless method to generate the object.\n\n\
    - First of all you need to create a static nested and copy all the arguments to\
    \ the outer class to the Builder class. We should follow the naming convention\
    \ and if the class name is Cake then builder class should be named CakeBuilder.\n\
    - The Builder class should have a public constructor with all the required attributes\
    \ as parameters.\n\n- Builder should have methods to set the optional parameters\
    \ and it should return the same Builder object after setting the optional attribute.\n\
    \n- The final step is to provide a `build()` method in the builder class that\
