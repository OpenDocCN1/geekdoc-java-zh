    +   * Subsystem interfaces are not aware of Facade and they shouldn’t have any
    reference of the Facade interface.


    +   * Facade pattern should be applied for similar kind of interfaces; its purpose
    is to provide a single interface rather than multiple interfaces that does the
    similar kind of jobs.


    +   * Subsystem may be dependent with one another. In such case, facade can act
    as a coordinator and decouple the dependencies between the subsystems.


    +   * We can use factory design pattern with Facade to provide better interface
    to client systems.


    # Usage in Java:


    In javax.faces.context, ExternalContext internally uses ServletContext, HttpSession,
    HttpServletRequest, HttpServletResponse, etc. It allows the Faces API to be unaware
    of the nature of its containing application environment.'
