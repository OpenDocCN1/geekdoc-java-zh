    # COMMAND PATTERN


    The command pattern is a behavioral design pattern. In the command pattern, a
    Command interface declares a method for executing a particular action. Concrete
    Class implements the execute () method of the Command interface, and this execute
    () method invokes the appropriate action method of a Receiver class that the Concrete
    Command class contains. The Receiver performs a particular action. A Client class
    is responsible for creating a Concrete Command and setting the Receiver of the
    Concrete Command. An Invoker class contains a reference to a Command and has a
    method to execute the Command.


    In the command pattern, the invoker is decoupled from the action performed by
    the receiver. The invoker has no knowledge of the receiver. The invoker invokes
    a command, and the command executes the appropriate action of the receiver. Thus,
    the invoker can invoke commands without knowing the details of the action to be
    performed. In addition, this decoupling means that changes to the receiver''s
    action do not directly affect the invocation of the action.


    The command pattern can be used to perform ''undo'' functionality. In this case,
    the Command interface should include an unexecuted () method.


    In other words, it''s used to implement loose coupling in a request-response model.
    In command pattern, the request is sent to the invoker and invoker passes it to
    the encapsulated command object. Command object passes the request to the appropriate
    method of Receiver to perform the specific action. The client program creates
    the receiver object and attaches it to the Command object to perform an action.
    Now when client executes the action, it''s processed based on the command and
    receiver object.


    To understand command design pattern we should understand the associated key terms
    like client, command, command implementation, invoker, and receiver.


    +   * Command is an interface with execute method. It is the core of contract.


    +   * A client creates an instance of a command implementation and associates
    it with a receiver.


    +   * An invoker instructs the command to perform an action.


    +   * A Command implementation''s instance creates a binding between the receiver
    and the action.


    +   * Receiver is the object that knows the actual steps to perform the action.
    Any class may serve as a Receiver .'
