- md: "\n## Design Patterns in JAVA\n\nDevendra Singh\n\n## JAVA DESIGN PATTERNS\n\
    \nBy\nDevendra Singh\n\n@Copyright 2016 Dev S\n\n## PREFACE\n\nThis technical\
    \ e-book provides information about design patterns in java in the simplest way\
    \ to understand. It consists of detailed descriptions of each Java design patterns\
    \ with the simplest real world examples. All examples given in this e-book have\
    \ been compiled & run by me in my development environment. I tried best to have\
    \ the simplest example available in this book.\n\nThis book is intended for java\
    \ developers as a beginner or experienced. Any java developer can get benefits\
    \ if/she go through the full content & provided examples. I have written this\
    \ book keeping in mind that every level of developer can get benefits from this.\n\
    \nMotivation for writing this e-book comes from the time I was learning java design\
    \ patterns. It was not very easy to understand each and every pattern in one or\
    \ two readings. I went through the various books & materials on the same and tried\
    \ to extract relevant facts about the different patterns to make them understand\
    \ easily & quickly. I have included all those relevant & crucial points in this\
    \ book.\n\nBefore getting started I would like to introduce myself. I am a java\
    \ developer having more than 10 years' experience in Java/J2EE technologies. Currently\
    \ I am working with a multinational software company. One of my hobbies is to\
    \ write technical contents. I spared some time to write this book & feeling very\
    \ happy to share my experience and knowledge with other developers. In case you\
    \ have any suggestion, correction or queries going through this e-book please\
    \ don't hesitate to connect me at erdsingh24@gmail.com\n\n## Table of Contents\n\
    \n- PREFACE\n- ABOUT DESIGN PATTERNS\n- SINGLETON PATTERN\n- FACTORY PATTERN\n\
    - ABSTRACT FACTORY PATTERN\n- BUILDER PATTERN\n- PROTOTYPE PATTERN\n- ADAPTER\
    \ PATTERN\n- COMPOSITE PATTERN\n- PROXY PATTERN\n- FAÇADE PATTERN\n- DECORATOR\
    \ PATTERN\n- FLYWEIGHT PATTERN\n- TEMPLATE METHOD PATTERN\n- MEDIATOR PATTERN\n\
    - CHAIN OF RESPONSIBILITY\n- OBSERVER PATTERN\n- STRATEGY PATTERN\n- VISITOR PATTERN\n\
    - STATE PATTERN\n- ITERATOR PATTERN\n- INTERPRETER PATTERN\n- MEMENTO PATTERN\n\
    \n## ABOUT DESIGN PATTERNS\n\nIf a problem occurs over and over again, a solution\
    \ to that problem has been used effectively. That solution is described as a pattern.\
    \ The design patterns are language-independent strategies for solving common object-oriented\
    \ design problems. When you make a design, you should know the names of some common\
    \ solutions. Learning design patterns is good for people to communicate each other\
    \ effectively. In fact, you may have been familiar with some design patterns;\
    \ you may not use well-known names to describe them. SUN suggests GOF (Gang of\
    \ Four—four pioneer guys who wrote a book named “Design Patterns”- Elements of\
    \ Reusable Object-Oriented Software), so we use that book as our guide to describe\
    \ solutions. Please make you to be familiar with these patterns and learn how\
    \ other people solve the coding problems.\n\nIf you want to be a professional\
    \ Java developer, you should know at least some popular solutions to coding problems.\
    \ These solutions have been proved efficient and effective by the experienced\
    \ developers. Learning design patterns speeds up your experience accumulation\
    \ in OAA/OOD. Once you grasped them, you would be benefited from them for all\
    \ your life and jump up your-yourselves to be a master of designing and developing.\
    \ Furthermore, you will be able to use these terms to communicate with your fellows\
    \ or assessors more effectively.\n\nMany programmers with many years' experience\
    \ don't know design patterns, but as an Object-Oriented programmer, you have to\
    \ know them, especially for new Java programmers. You may not use a popular name\
    \ to describe it or it may not choose an effective way to better intellig control\
    \ over what you built. Learning how the experienced developers to solve the coding\
    \ problems and trying to use them in your project are a best way to earn your\
    \ experience and certification.\n\nRemember that learning the design patterns\
    \ will really change how you design your code; not only will you be smarter but\
    \ you will sound a lot smarter, too. The 23 design patterns of GOF are well known,\
    \ and more are to be discovered on the way.\n\nThere are three well-known types\
    \ of design patterns.\n\n**Creational Design Patterns:** Creational design patterns\
    \ provide solution to instantiate the object in the best possible way for specific\
    \ situations. Following design patterns come under this category.\n\n- Singleton\
    \ Pattern\n- Factory Pattern\n- Abstract Factory Pattern\n- Builder Pattern\n\
    - Prototype Pattern\n\n**Structural Design Patterns:** Structural patterns provide\
    \ ways to assemble classes and objects to form larger structures while keeping\
    \ these structures flexible and efficient to handle changes.\n\n- Adapter Pattern\n\
    - Composite Pattern\n- Proxy Pattern\n- Facade Pattern\n- Flyweight Pattern\n\
    - Decorator Pattern\n\n**Behavioral Design Patterns:** Behavioral patterns are\
    \ patterns that concern communication between objects, allowing objects to interact\
    \ and distribute responsibility flexibly.\n\n- Template Method Pattern\n- Mediator\
    \ Pattern\n- Chain of Responsibility\n- Observer Pattern\n- Strategy Pattern\n\
    - Visitor Pattern\n- State Pattern\n- Iterator Pattern\n- Interpreter Pattern\n\
    - Memento Pattern\n\n## SINGLETON PATTERN\n\nSometimes it's important for classes\
    \ to have exactly one instance and provide a global point of access to it. There\
    \ are many examples where Singleton pattern is needed, like database connection\
    \ pools, thread pools, configuration settings, and logging objects in an application.\n\
    \n### Reflection: Using reflection we can set the private constructor to become\
    \ accessible as shown in the example below.\n\n```java\npackage com.dev.dp.creational.singleton;\n\
    \nimport java.lang.reflect.Constructor;\n\npublic class SingletonR {\n    private\
    \ static SingletonR instance = new SingletonR();\n\n    private SingletonR() {\n\
    \        System.out.println(\"Creating...\");\n    }\n\n    public static SingletonR\
    \ getInstance() {\n        return instance;\n    }\n\n    public static void main(String[]\
    \ args) throws Exception {\n        SingletonR s1 = SingletonR.getInstance();\n\
    \        SingletonR s2 = SingletonR.getInstance();\n\n        print(\"s1\", s1);\n\
    \        print(\"s2\", s2);\n\n        Class<?> cls = Class.forName(\"com.dev.dp.creational.singleton.SingletonR\"\
    );\n        Constructor<?> ctor = cls.getDeclaredConstructor();\n        ctor.setAccessible(true);\n\
    \        SingletonR s3 = ctor.newInstance();\n\n        print(\"s3\", s3);\n \
    \   }\n\n    static void print(String name, SingletonR obj) {\n        System.out.println(String.format(\"\
    Object : %s, Hashcode: %d\", name, obj.hashCode()));\n    }\n}\n```\n\n# Output:\n\
    \n```text\nCreating...\nObject : s1, Hashcode: 123456789\nObject : s2, Hashcode:\
    \ 123456789\nCreating...\nObject : s3, Hashcode: 987654321\n```\n\nIn the output\
    \ above, the hashcode of s1 and s2 are the same, meaning they are the same instance.\
    \ However, s3 has a different hashcode, meaning the Singleton pattern was violated.\n\
    \nHow to fix: Runtime Exception if someone tries to make instance in case instance\
    \ already exists. This code will go into the private constructor of the Singleton\
    \ class.\n\n```java\nprivate SingletonR() {\n    System.out.println(\"Creating...\"\
    );\n    if(instance != null) {\n        throw new RuntimeException(\"can't create\
    \ instance. Please use getInstance()\");\n    }\n}\n```\n"
  mdcn: "\n\n## JAVA 中的设计模式\n\nDevendra Singh\n\n## JAVA 设计模式\n\n作者：Devendra Singh\n\
    \n@Copyright 2016 Dev S\n\n## 前言\n\n本技术电子书旨在以最易于理解的方式提供 Java 中设计模式的信息。它包含了对每个\
    \ Java 设计模式的详细描述，并配有最简单的真实世界示例。书中给出的所有示例都已由我在自己的开发环境中编译并运行过。我已尽力在书中提供最简单的示例。\n\
    \n本书面向初级或有经验的 Java 开发者。只要他/她通读了完整的内容和提供的示例，任何 Java 开发者都能从中获益。我在编写本书时，考虑到了每个水平的开发者都能从中获益。\n\
    \n编写本电子书的动力源于我学习 Java 设计模式的时期。在一次或两次阅读中理解每一种模式并不是容易的。我查阅了大量的书籍和材料，并尝试提取关于不同模式的相关事实，以便更容易、更快速地理解它们。我将所有这些相关且关键的点都包含了书中。\n\
    \n在开始之前，我想介绍一下自己。我是一名 Java 开发者，在 Java/J2EE 技术领域拥有超过 10 年的经验。目前，我在一家跨国软件公司工作。我的爱好之一是编写技术内容。我花了一些时间写这本书，并非常高兴能与其他开发者分享我的经验和知识。如果你在阅读本电子书期间有任何建议、修正或疑问，请随时通过\
    \ erdsingh24@gmail.com 与我联系。\n\n## 目录\n\n- 前言\n- 关于设计模式\n- 单例模式\n- 工厂模式\n- 抽象工厂模式\n\
    - 建造者模式\n- 原型模式\n- 适配器模式\n- 组合模式\n- 代理模式\n- 外外观模式\n- 装饰器模式\n- 权重模式\n- 模板方法模式\n\
    - 中介者模式\n- 责任链\n- 观察者模式\n- 策略模式\n- 访问者模式\n- 状态模式\n- 迭代器模式\n- 解释器模式\n- 备忘模式\n\n\
    ## 关于设计模式\n\n如果一个问题反复出现，那么该问题的解决方案已经被有效地使用了。这种解决方案就被描述为“模式”。设计模式是解决常见面向对象设计问题的语言无关的策略。当你进行设计时，你应该知道一些常用解决方案的名称。学习设计模式有助于人们有效地相互交流。事实上，你可能已经熟悉某些设计模式，但你可能没有使用为人知的名称来描述它们。Sun\
    \ 推荐 GOF（四人之组——四位写过《设计模式：可复用面向对象软件的基础》书的四位先驱），因此我们以那本书作为指南来描述解决方案。请确保你熟悉这些模式，并学习他人如何解决编码问题。\n\
    \n如果你想成为一名专业的 Java 开发者，你应该至少知道一些解决问题的流行解决方案。这些解决方案已被经验丰富的开发者证明是高效且有效的。学习设计模式可以加速你在面向对象分析（OAA）/面向对象设计（OOD）方面的经验积累。一旦你掌握了它们，你将终身受益，并让你飞跃，成为设计和开发的大师。此外，你将能够使用这些术语与同事或评估者进行更有效的交流。\n\
    \n许多多年经验的程序员并不知道设计模式，但作为一名面向对象的程序员，你必须了解它们，特别是对于新的 Java 开发者来说。你可能没有使用流行的名称来描述它，或者可能没有选择一种有效的方法来更好地控制你所构建的内容。学习经验丰富的开发者如何解决编码问题并尝试将它们应用到你的项目中，是获得经验和认证的最佳方法。\n\
    \n记住，学习设计模式将真正改变你设计代码的方式；你不仅会变得更聪明，听起来也会明智得多。GOF 的 23 种设计模式是众所周知的，在途中还会发现更多。\n\
    \n有三种著名的设计模式类型。\n\n**创建型设计模式（Creational Design Patterns）：** 创建型设计模式为特定情况提供了以最可能的方式实例化对象的解决方案。遵循的设计模式都属于这一类。\n\
    \n- 单例模式\n- 工厂模式\n- 抽象工厂模式\n- 建造者模式\n- 原型模式\n\n**结构型设计模式（Structural Design Patterns）：**\
    \ 结构型模式提供了组合类和对象以形成更大结构，同时保持这些结构灵活且高效地处理变化。\n\n- 适配器模式\n- 组合模式\n- 代理模式\n- 外观模式\n\
    - 权重模式\n- 装饰器模式\n\n**行为型设计模式（Behavioral Design Patterns）：** 行为模式是涉及对象之间通信的模式，允许对象灵活地交互和分配责任。\n\
    \n- 模板方法模式\n- 中介者模式\n- 责任链\n- 观察者模式\n- 策略模式\n- 访问者模式\n- 状态模式\n- 迭代器模式\n- 解释器模式\n\
    - 备忘模式\n\n## 单例模式\n\n有时，类恰好只有一个实例并为其提供一个全局访问点是非常重要的。有很多需要单例模式的例子，例如数据库连接池、线程池、配置设置以及应用程序中的日志对象。\n\
    \n### 反射：使用反射，我们可以设置私有构造函数变为可访问，如下例所示。\n\n```java\npackage com.dev.dp.creational.singleton;\n\
    \nimport java.lang.reflect.Constructor;\n\npublic class SingletonR {\n    private\
    \ static SingletonR instance = new SingletonR();\n\n    private SingletonR() {\n\
    \        System.out.println(\"Creating...\");\n    }\n\n    public static SingletonR\
    \ getInstance() {\n        return instance;\n    }\n\n    public static void main(String[]\
    \ args) throws Exception {\n        SingletonR s1 = SingletonR.getInstance();\n\
    \        SingletonR s2 = SingletonR.getInstance();\n\n        print(\"s1\", s1);\n\
    \        print(\"s2\", s2);\n\n        Class<?> cls = Class.forName(\"com.dev.dp.creational.singleton.SingletonR\"\
    );\n        Constructor<?> ctor = cls.getDeclaredConstructor();\n        ctor.setAccessible(true);\n\
    \        SingletonR s3 = ctor.newInstance();\n\n        print(\"s3\", s3);\n \
    \   }\n\n    static void print(String name, SingletonR obj) {\n        System.out.println(String.format(\"\
    Object : %s, Hashcode: %d\", name, obj.hashCode()));\n    }\n}\n```\n\n# 输出：\n\
    \n```text\nCreating...\nObject : s1, Hashcode: 123456789\nObject : s2, Hashcode:\
    \ 123456789\nCreating...\nObject : s3, Hashcode: 987654321\n```\n\n在上面的输出中，s1\
    \ 和 s2 的哈希值相同，这意味着它们是同一个实例。然而，s3 有不同的哈希值，这意味着单例模式被违反了。\n\n修复方法：如果在实例已存在的情况下尝试实例化，则抛出运行时异常。这段代码将放入单例类的私有构造函数中。\n\
    \n```java\nprivate SingletonR() {\n    System.out.println(\"Creating...\");\n\
    \    if(instance != null) {\n        throw new RuntimeException(\"can't create\
    \ instance. Please use getInstance()\");\n    }\n}\n```\n\n"
