    \ strategy\n\n# When to use the Strategy Design Pattern\n\nUse the Strategy pattern\
    \ when:\n\n- Many related classes differ only in their behavior. Strategies provide\
    \ a way to configure a class with one of many behaviors.\n- You need different\
    \ variants of an algorithm. For example, you might define algorithms reflecting\
    \ different space/time trade-offs. Strategies can be used when these variants\
    \ are implemented as a class hierarchy of algorithms.\n- An algorithm uses data\
    \ that clients shouldn't know about. Use the Strategy pattern to avoid exposing\
    \ complex, algorithm-specific data structures.\n- A class defines many behaviors,\
    \ and these appear as multiple conditional statements in its operations. Instead\
    \ of many conditionals, move related conditional branches into its own Strategy\
    \ class.\n\n# Strategy Pattern in JDK:\n\n- java.util.Comparator#compare()\n-\
    \ javax.servlet.http.HttpServlet\n- javax.servlet.Filter#doFilter()\n\n# COMMAND\
    \ PATTERN\n\nThe command pattern is a behavioral design pattern. In the command\
    \ pattern, a Command interface declares a method for executing a particular action.\
    \ Concrete Class implements the execute() method of the Command interface, and\
    \ this execute() method invokes the appropriate action method of a Receiver class\
    \ that the Concrete Command class contains. The Receiver performs a particular\
    \ action. A Client class is responsible for creating a Concrete Command and setting\
    \ the Receiver of the Concrete Command. An Invoker class contains a reference\
    \ to a Command and has a method to execute the Command.\n\nIn the command pattern,\
    \ the invoker is decoupled from the action performed by the receiver. The invoker\
    \ has no knowledge of the receiver. The invoker invokes a command, and the command\
    \ executes the appropriate action of the receiver. Thus, the invoker can invoke\
    \ commands without knowing the details of the action to be performed. In addition,\
    \ this decoupling means that changes to the receiver's action do not directly\
    \ affect the invocation of the action.\n\nThe command pattern can be used to perform\
    \ 'undo' functionality. In this case, the Command interface should include an\
    \ undo() method.\n\nIn other words, it's used to implement loose coupling in a\
    \ request-response model. In command pattern, the request is sent to the invoker\
    \ and invoker passes it to the encapsulated command object. Command object passes\
    \ the request to the appropriate method of Receiver to perform the specific action.\
    \ The client program creates the receiver object and attaches it to the Command\
    \ object to perform an action. Now when client executes the action, it's processed\
    \ based on the command and receiver object.\n\nTo understand command design pattern\
    \ we should understand the associated key terms like client, command, command\
    \ implementation, invoker, and receiver.\n\n- Command is an interface with execute\
    \ method. It is the core of contract.\n- A client creates an instance of a command\
    \ implementation and associates it with a receiver.\n- An invoker instructs the\
    \ command to perform an action.\n- A Command implementation's instance creates\
    \ a binding between the receiver and the action.\n- Receiver is the object that\
    \ knows the actual steps to perform the action. Any class may serve as a Receiver.\n\
    \n```java\n/**\n * Command interface with execute() method.\n */\npublic interface\
    \ Command {\n    void execute();\n}\n```\n\n```java\n/**\n * Lunch is a receiver.\n\
    \ */\npublic class Lunch {\n    public void makeLunch() {\n        System.out.println(\"\
    Lunch is made\");\n    }\n}\n```\n\n```java\n/**\n * Lunch implements Command.\
    \ It contains a reference to lunch, receiver.\n * Its execute() method invokes\
    \ the appropriate action on the receiver.\n */\npublic class LunchCommand implements\
    \ Command {\n    private Lunch lunch;\n\n    public LunchCommand(Lunch lunch)\
    \ {\n        this.lunch = lunch;\n    }\n\n    @Override\n    public void execute()\
    \ {\n        lunch.makeLunch();\n    }\n}\n```\n\n```java\n/**\n * Dinner is also\
