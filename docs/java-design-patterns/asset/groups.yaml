    \ Example: Animal: Dog, Cat, Fox etc.\n\n# ABSTRACT FACTORY PATTERN\n\nAlmost\
    \ similar to except the fact that it's more like factory of factories. If you\
    \ are familiar with factory design pattern in java, you will notice that we have\
    \ a single Factory class that returns the sub-classes based on the input provided\
    \ and factory class uses if-else switch statement to achieve this. In Abstract\
    \ Factory pattern, we get rid of if-else block and have a factory class for each\
    \ sub-class and then an Abstract Factory that will return the sub-class based\
    \ on the input factory class.\n\nAn abstract factory is a factory that returns\
    \ factories. Why is this layer of abstraction useful? A normal factory can be\
    \ used to create sets of related objects. An abstract factory returns factories.\
    \ Thus, an abstract factory is used to return factories that can be used to create\
    \ sets of related objects.\n\nAs an example, you could have a Honda factory that\
