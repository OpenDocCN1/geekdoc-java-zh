    \ + \"]\";\n    }\n}\n```\n\n```java\npublic class PrototypeTest {\n\n    public\
    \ Bike makeJaguar(Bike basicBike) {\n        basicBike.makeAdvanced();\n     \
    \   return basicBike;\n    }\n\n    public static void main(String[] args) {\n\
    \        Bike bike = new Bike();\n        Bike bikeClone = bike.clone();\n   \
    \     PrototypeTest prototypeTest = new PrototypeTest();\n        Bike advancedBike\
    \ = prototypeTest.makeJaguar(bikeClone);\n        System.out.println(\"Prototype\
    \ Design Pattern: \" + advancedBike.getModel());\n        System.out.println(\"\
    Prototype Design Pattern: \" + advancedBike.toString());\n    }\n}\n```\n"
  mdcn: "\n\n## ConcreteBuilder（具体构建器）\n\n- 通过实现 Builder 接口来构造组装产品的部分。\n- 定义并跟踪它所创建的表示形式。\n\
    - 提供一个获取产品的接口。\n\n## Director（总监）\n\n- 使用 Builder 接口构造对象。\n\n## Product（产品）\n\n\
    - 表示正在构造的复杂对象。ConcreteBuilder 负责构建产品的内部表示，并定义了其组装过程。\n- 包含定义组成部分的类，包括将这些部分组装成最终结果的接口。\n\
    \n示例：\n\n```\ncom.dev.dp.creational.builder2\n  BuilderTest.java\n  IndianMealBuilder.java\n\
    \  JapaneseMealBuilder.java\n  Meal.java\n  MealBuilder.java\n  MealDirector.java\n\
    ```\n\n## 构建器模式的另一种形式：\n\n有时存在一个包含属性列表的对象，而其中大多数属性都是可选的。考虑一个为了成为网站成员而需要的在线表单。你需要填写所有必填字段，可以跳过可选字段，或者有时填写某些可选字段看起来很有价值。\n\
    \n问题是，对于此类类我们应该写一个什么样的构造函数？编写一个带有长参数列表的构造函数不是一个好的选择，这会让客户端感到沮丧，特别是当重要字段只有几个时。这可能会错误的范围；客户端可能会无意中为错误的字段提供值。相同类型参数的长序列会导致细微的错误。如果客户端不小心反了两个参数，编译器不会报错，但程序会在运行时表现异常。\n\
    \n客户端不是直接创建所需的对象，而是调用一个带有所有必需参数的构造函数并获取一个构建器对象。然后客户端调用构建器上的类似 setter的方法来设置每个感兴趣的可选参数。最后，客户端调用一个无参数的方法来生成对象。\n\
    \n- 首先，你需要创建一个静态嵌套类，并将所有参数从外部类拷贝到 Builder 类中。我们应该遵循命名规范，如果类名为 Cake，那么构建器类应该命名为\
    \ CakeBuilder。\n- Builder 类应该有一个公共构造函数，并将所有必需属性作为参数传入。\n\n- Builder 应该拥有方法来设置可选参数，并且在设置可选属性后应该返回同一个\
    \ Builder 对象。\n\n- 最后一步是在构建器类中提供一个 `build()` 方法，它将返回客户端程序所需的对象。为了实现这一点，我们需要在类中有一个私有构造函数，并将\
    \ Builder 类作为参数。\n\n```java\nclass Cake {\n    private double sugar; //cup\n \
    \   private double butter; //cup\n    private double milk; //cup\n    private\
    \ int cherry; //cup\n\n    public static class CakeBuilder {\n        private\
    \ double sugar;\n        private double butter;\n        private int cherry;\n\
    \n        public CakeBuilder settingSugar(double sugar) {\n            this.sugar\
    \ = sugar;\n            return this;\n        }\n        public CakeBuilder settingButter(double\
    \ butter) {\n            this.butter = butter;\n            return this;\n   \
    \     }\n        public CakeBuilder settingCherry(int cherry) {\n            this.cherry\
    \ = cherry;\n            return this;\n        }\n\n        public Cake build()\
    \ {\n            return new Cake(sugar, butter, cherry);\n        }\n    }\n\n\
    \    private Cake(double sugar, double butter, int cherry) {\n        this.sugar\
    \ = sugar;\n        this.butter = butter;\n        this.cherry = cherry;\n   \
    \ }\n}\n```\n\n```java\n// 通过 builder 强制创建对象的构造函数\nprivate Cake(CakeBuilder builder)\
    \ {\n    this.sugar = builder.sugar;\n    this.butter = builder.butter;\n    this.cherry\
    \ = builder.cherry;\n}\n```\n\n```java\n@Override\npublic String toString() {\n\
    \    return \"Cake[\" + sugar + \"]\";\n}\n```\n\n```java\npublic class BuilderPattern\
    \ {\n    public static void main(String[] args) {\n```\n\n```java\n// 使用 CakeBuilder\
    \ 创建对象\nCake cake = new Cake.CakeBuilder().sugar(0);\n```\n\n```java\n// Cake\
    \ 准备好了：\nSystem.out.println(cake);\n}\n```\n\n输出：Cake[sugar=0.0]\n\n在静态设置中，我们可以使用\
    \ setter 方法来设置可选字段。清楚地看到，现在通过链式调用来创建对象。\n\n这种的好处：\n\n- 客户端只需要提供必填字段。\n- 构造过程可以与表示形式解耦。\n\
    - 构造过程可以分多个步骤。\n- 构造期间的数据仅在构造期间是可见的。\n\n## Builder：\n\n何时使用 Builder：\n\n- 构造复杂对象的成本很高。\n\
    - 构造过程可以与表示形式解耦。\n- 构造过程可以分多个步骤。\n- 构造期间的数据仅在构造期间是可见的。\n\n## Java 中的 Prototype：\n\
    \n- 实例化类是在运行时指定的，例如通过动态加载。\n- 避免构建与类层次结构平行的工厂层次结构。\n- 类的实例只有几种组合。可以安装相应数量的原型并克隆它们。\n\
    \n## 原型模式\n\n原型模式是一种创建模式，它允许在不指定类的情况下复制对象。当创建非常昂贵或复杂时，这种模式非常有用，例如从数据库或网络读取数据。在\
    \ Java 中，如果你想使用克隆（即原型模式），可以使用 `clone()` 方法。默认情况下，`clone()` 执行浅拷贝。然而，我们需要时实现自己的深拷贝。\n\
    \n下面的示例描述了如何通过克隆基础对象来设计一辆高级自行车。\n\n```java\npublic class Bike implements Cloneable\
    \ {\n\n    private int gears;\n    private String bikeType;\n    private String\
    \ model;\n\n    public Bike() {\n        bikeType = \"Standard\";\n        model\
    \ = \"leopard\";\n        gears = 4;\n    }\n\n    public Bike clone() {\n   \
    \     try {\n            return (Bike) super.clone();\n        } catch (CloneNotSupportedException\
    \ e) {\n            return null;\n        }\n    }\n\n    public void makeAdvanced()\
    \ {\n        bikeType = \"Advanced\";\n        model = \"Jaguar\";\n        gears\
    \ = 6;\n    }\n\n    public String getModel() {\n        return model;\n    }\n\
    \n    @Override\n    public String toString() {\n        return \"Bike[gears=\"\
    \ + gears + \", bikeType=\" +\n               + bikeType + \", model=\" + model\
    \ + \"]\";\n    }\n}\n```\n\n```java\npublic class PrototypeTest {\n\n    public\
    \ Bike makeJaguar(Bike basicBike) {\n        basicBike.makeAdvanced();\n     \
    \   return basicBike;\n    }\n\n    public static void main(String[] args) {\n\
    \        Bike bike = new Bike();\n        Bike bikeClone = bike.clone();\n   \
    \     PrototypeTest prototypeTest = new PrototypeTest();\n        Bike advancedBike\
    \ = prototypeTest.makeJaguar(bikeClone);\n        System.out.println(\"Prototype\
    \ Design Pattern: \" + advancedBike.getModel());\n        System.out.println(\"\
    Prototype Design Pattern: \" + advancedBike.toString());\n    }\n}\n```\n\n"
