    \n# 抽象工厂模式 (ABSTRACT FACTORY PATTERN)\n\n与工厂模式几乎相似，不同在于它更像是“工厂的工厂”。如果你熟悉 Java\
    \ 中的工厂设计模式，你会注意到我们有一个单一的工厂类，根据提供的输入返回子类，工厂类使用 `if-else switch` 语句来实现。在抽象工厂模式中，我们消除了\
    \ `if-else` 块，为每个子类准备一个工厂类，然后有一个抽象工厂，它将根据输入的工厂类返回相应的子类。\n\n抽象工厂是一个返回工厂的工厂。为什么这种抽象层很有用？普通工厂可以用于创建一组相关对象。而抽象工厂返回工厂。因此，抽象工厂用于返回可以创建一组相关对象的工厂。\n\
    \n例如，你可以有一个本田工厂（Honda factory），它返回与本田工厂关联的汽车对象（Brio, Civic 等）。你也可以有一个现代工厂（Hyundai\
    \ factory），它返回与现代工厂关联的汽车对象（Santro, EON）。我们可以创建一个抽象工厂，根据我们感兴趣的汽车返回这些不同类型的汽车工厂。然后我们可以从这些汽车工厂中获取汽车对象。通过多态，我们可以使用共同接口来获取不同的工厂，然后再次使用共同接口来获取不同的汽车。\n\
    \n优点：\n\n- * 抽象工厂模式提供了面向接口而非实现的编码方法。\n- * 抽象工厂模式是“工厂的工厂”，可以很容易扩展以容纳更多产品，例如，我们可以添加另一个子类\
    \ Celerio 和一个工厂 MarutiFactory。\n- * 抽象工厂模式是健壮的，并且避免了工厂模式的条件逻辑。\n\n在 JDK 中的用法：\n\
    \n- * `javax.xml.parsers.DocumentBuilderFactory#newInstance()`\n- * `javax.xml.transform.TransformerFactory#newInstance()`\n\
    - * `javax.xml.xpath.XPathFactory#newInstance()`\n\n何时使用：当一组相关的产品对象被设计为一起使用，且我们需要强制执行这一约束时。\n\
    \n```java\npackage com.dev.dp.creational.abstractFactory;\n\npublic interface\
    \ IMobileFactory {\n    IMobileFactory createMobile(String type);\n}\n\npublic\
    \ class MobileFactory implements IMobileFactory {\n    @Override\n    public IMobileFactory\
    \ createMobile(String type) {\n        IMobileFactory mob = null;\n        if\
    \ (\"len\".equalsIgnoreCase(type)) {\n            mob = new LenovoFactory();\n\
    \        } else if (\"sam\".equalsIgnoreCase(type)) {\n            mob = new SamsungFactory();\n\
    \        }\n        return mob;\n    }\n}\n\npublic class LenovoFactory implements\
    \ IMobileFactory {\n    @Override\n    public IMobile createMobile(String type)\
    \ {\n        return new Lenovo();\n    }\n}\n\npublic class SamsungFactory implements\
    \ IMobileFactory {\n    @Override\n    public IMobile createMobile(String type)\
    \ {\n        return new Samsung();\n    }\n}\n\npublic class AbstractFactoryTest\
    \ {\n    public static void main(String[] args) {\n        MobileFactory factory\
    \ = new MobileFactory();\n        IMobileFactory info = factory.createMobile(\"\
    len\");\n        Lenovo len = (Lenovo)info.createMobile(\"len\");\n        len.pictureCapacity();\n\
    \    }\n}\n```\n\n# 输出：\n\nLenovo camera capacity starts from 10 MP\n\n其他示例：本田工厂：Brio,\
    \ Civic，\n现代工厂：Santro, EON 等。\n\n# 构建者模式 (BUILDER PATTERN)\n\n通常，对象的构建细节（如实例化初始化组成对象的组件）被保留在对象内部，通常作为构造函数的一部分。这种设计将对象构建过程与组成组件紧密结合。只要对象构建是简单的且构建过程始终产生相同的表示，这种方法就是合适的。\n\
    \n然而，当创建的对象复杂，且构成创建对象的系列步骤可以以不同的方式实现以产生不同的表示时，这种设计可能不再有效。因为构建过程的不同实现都保留在对象内部，对象可能会变得臃肿（构建膨胀）且模块化降低。随后，添加新的实现或修改现有实现需要修改代码。\n\
    \n使用构建者模式，可以更有效地设计此类对象的构建。构建者模式建议将构建逻辑从对象类移动到独立的构建器类中。可以有多个构建器类，每个类对构建对象的步骤有不同的实现。每个构建器的实现都会产生不同的表示。\n\
    \n> 构建者模式的意图是将对象的构建与其表示分离，以便通过相同的构建过程创建不同的表示。这种分离减少了对象的大小。由于每个实现包含在构建器对象中，设计变得更加模块化。添加新的实现（即添加新的构建者）变得更容易。对象的构建过程独立于组成对象的组件。\n\
    \n```java\npackage com.dev.dp.creational.builder;\n\npublic class Computer {\n\
    \    private String cpu;\n    private String ram;\n    private String storage;\n\
    \n    public void setCPU(String cpu) { this.cpu = cpu; }\n    public void setRAM(String\
    \ ram) { this.ram = ram; }\n    public void setStorage(String storage) { this.storage\
    \ = storage; }\n\n    @Override\n    public String toString() {\n        return\
    \ \"Computer [CPU=\" + cpu + \", RAM=\" + ram + \", Storage=\" + storage + \"\
    ]\";\n    }\n}\n\npublic interface ComputerBuilder {\n    void buildCPU();\n \
    \   void buildRAM();\n    void buildStorage();\n    Computer getResult();\n}\n\
    \npublic class GamingComputerBuilder implements ComputerBuilder {\n    private\
    \ Computer computer = new Computer();\n\n    @Override\n    public void buildCPU()\
    \ {\n        computer.setCPU(\"Intel i9\");\n    }\n\n    @Override\n    public\
    \ void buildRAM() {\n        computer.setRAM(\"32GB\");\n    }\n\n    @Override\n\
    \    public void buildStorage() {\n        computer.setStorage(\"2TB SSD\");\n\
    \    }\n\n    @Override\n    public Computer getResult() {\n        return computer;\n\
    \    }\n}\n\npublic class OfficeComputerBuilder implements ComputerBuilder {\n\
    \    private Computer computer = new Computer();\n\n    @Override\n    public\
    \ void buildCPU() {\n        computer.setCPU(\"Intel i5\");\n    }\n\n    @Override\n\
    \    public void buildRAM() {\n        computer.setRAM(\"8GB\");\n    }\n\n  \
    \  @Override\n    public void buildStorage() {\n        computer.setStorage(\"\
    512GB SSD\");\n    }\n\n    @Override\n    public Computer getResult() {\n   \
    \     return computer;\n    }\n}\n\npublic class Director {\n    private ComputerBuilder\
    \ builder;\n\n    public void setBuilder(ComputerBuilder builder) {\n        this.builder\
    \ = builder;\n    }\n\n    public void constructComputer() {\n        builder.buildCPU();\n\
    \        builder.buildRAM();\n        builder.buildStorage();\n    }\n}\n\npublic\
    \ class BuilderTest {\n    public static void main(String[] args) {\n        Director\
    \ director = new Director();\n        ComputerBuilder gamingBuilder = new GamingComputerBuilder();\n\
    \        director.setBuilder(gamingBuilder);\n        director.constructComputer();\n\
    \        System.out.println(gamingBuilder.getResult());\n\n        ComputerBuilder\
    \ officeBuilder = new OfficeComputerBuilder();\n        director.setBuilder(officeBuilder);\n\
    \        director.constructComputer();\n        System.out.println(officeBuilder.getResult());\n\
    \    }\n}\n```\n\n# 输出：\n\nComputer [CPU=Intel i9, RAM=32GB, Storage=2TB SSD]\n\
    Computer [CPU=Intel i5, RAM=8GB, Storage=512GB SSD]\n\n# Builder\n\n- * 指定创建产品对象组件的抽象接口。\n\
    \n"
