    # When to use the Visitor Design Pattern:


    Use the Visitor pattern when:


    +   * An object structure contains many classes of objects with differing interfaces,
    and you want to perform operations on these objects that depend on their concrete
    classes.

    * Many distinct and unrelated operations need to be performed on objects in an
    object structure, and you want to avoid “polluting” their classes with these operations.
    Visitor lets you keep related operations together by defining them in one class.
    When the object structure is shared by many applications, Visitor to put operations
    in just those applications that need them.

    * The classes defining the object structure rarely change, but you often want
    to define new operations over the structure. Changing the object structure classes
    requires redefining the interface to all visitors, which is potentially costly.
    If the object structure classes change often, then it’s probably better to define
    the operations in those classes.'
