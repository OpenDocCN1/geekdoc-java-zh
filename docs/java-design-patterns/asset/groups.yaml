    class Cake {\n    private double sugar; //cup\n    private double butter; //cup\n\
    \    private double milk; //cup\n    private int cherry; //cup\n\n    public static\
    \ class CakeBuilder {\n        private double sugar;\n        private double butter;\n\
    \        private int cherry;\n\n        public CakeBuilder settingSugar(double\
    \ sugar) {\n            this.sugar = sugar;\n            return this;\n      \
    \  }\n        public CakeBuilder settingButter(double butter) {\n            this.butter\
    \ = butter;\n            return this;\n        }\n        public CakeBuilder settingCherry(int\
    \ cherry) {\n            this.cherry = cherry;\n            return this;\n   \
    \     }\n\n        public Cake build() {\n            return new Cake(sugar, butter,\
    \ cherry);\n        }\n    }\n\n    private Cake(double sugar, double butter,\
    \ int cherry) {\n        this.sugar = sugar;\n        this.butter = butter;\n\
    \        this.cherry = cherry;\n    }\n}\n```\n\n```java\n// constructor to enforce\
    \ object creation through builder\nprivate Cake(CakeBuilder builder) {\n    this.sugar\
    \ = builder.sugar;\n    this.butter = builder.butter;\n    this.cherry = builder.cherry;\n\
    }\n```\n\n```java\n@Override\npublic String toString() {\n    return \"Cake[\"\
