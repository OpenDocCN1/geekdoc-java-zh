    # When to use the Template Design Pattern:\n\n+   * To implement the invariant\
    \ parts of an algorithm once and leave it up to subclasses to implement the behavior\
    \ that can vary.\n* When common behavior among subclasses should be factored and\
    \ localized in a common class to avoid code duplication. You first identify the\
