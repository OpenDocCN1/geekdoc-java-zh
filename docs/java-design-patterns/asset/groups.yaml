    Dinner is made\n\n# When to use the Command Design Pattern:\n\nUse the Command\
    \ objects by an action to perform.\n\n- Support undo. The Command's Execute operation\
    \ can store state for reversing its effects in the command itself. The Command\
    \ interface must have an undo() operation that reverses the effects of a previous\
    \ call to Execute. Executed commands are stored in a history list. Unlimited-level\
    \ undo and redo is achieved by traversing this list backwards and forwards calling\
    \ undo and Execute, respectively.\n- Structure a system around high-level operations\
    \ built on primitives. Such a structure is common in information systems that\
    \ support transactions. The Command pattern offers a way to model transactions.\
    \ Commands have a common interface, letting you invoke all transactions the same\
    \ way. The pattern also makes it easy to extend the system with new transactions.\n\
    \n# Command Pattern JDK Example:\n\n- Runnable Interface (java.lang.Runnable)\
    \ and Swing Action (javax.swing.Action) uses command pattern.\n\n# VISITOR PATTERN\n\
    \nVisitor pattern is used when we have to perform an operation on a group of similar\
    \ kind of Objects. With the help of visitor pattern, we can move the operational\
    \ logic from the objects to another class. For example, think of a Shopping cart\
    \ where we can add different type of items (Elements), and when we click on checkout\
    \ button, it calculates the total amount to be paid. Now we can have the calculation\
    \ logic in item classes or we can move out this logic to another class using visitor\
    \ pattern. So using visitor pattern we can move out logics to another class.\n\
    \nThe Visitor pattern allows the operation to be defined without changing the\
    \ class of any of the objects in the collection. To accomplish this, the Visitor\
    \ pattern suggests defining the operation in a separate class. This separates\
    \ the operation from the object collection that it operates on. For every new\
    \ operation to be defined, a new visitor class is created. Since the operation\
    \ is to be performed across a set of objects, the visitor needs a way of accessing\
    \ the public members of these objects.\n\nFollowing components are involved in\
    \ visitor pattern.\n\n**Visitor:** Declares a Visit operation for each class of\
    \ ConcreteElement in the object structure. The operation's name and signature\
    \ identifies the class that sends the Visit request to the visitor. That lets\
    \ the visitor determine the concrete class of the element being visited. Then\
    \ the visitor can access the element directly through its particular interface.\n\
    \n**ConcreteVisitor:** Implements each operation declared by Visitor. Each operation\
    \ implements a fragment of the algorithm defined for the corresponding class of\
    \ object in the structure. ConcreteVisitor provides the context for the algorithm\
    \ and stores its local state. This state often accumulates results during the\
    \ traversal of the structure.\n\n**Element:** Defines an Accept operation that\
    \ takes a visitor as an argument.\n\n**ConcreteElement:** Implements an Accept\
    \ operation that takes a visitor as an argument.\n\n**ObjectStructure:**\n\n-\
    \ Can enumerate its elements.\n- May provide a high-level interface to allow the\
    \ visitor to visit its elements.\n- May either be a composite or a collection\
    \ such as a list or a set.\n\nTo implement visitor pattern, first of all we will\
    \ create different type of items (Elements) to be used in shopping cart.\n"
