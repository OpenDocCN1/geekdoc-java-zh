    \ {\n\n  var arr: Array<Int> = arrayOf(2, 3, 5, 7)\n\n  for ((index, value) in\
    \ arr.withIndex()) {\n\n  println(\"index : $index, value : $value\")\n\n}\n\n\
    }\n```\n\n输出\n\n```\nindex : 0, value : 2\n\nindex : 1, value : 3\n\nindex : 2,\
    \ value : 5\n\nindex : 3, value : 7\n```\n\n## 使用 while 循环打印数组元素\n\n`ArrayUtil.kt`\n\
    \n```\nfun main(args: Array<String>) {\n\n  var arr: Array<Int> = arrayOf(2, 3,\
    \ 5, 7)\n\n  var sizeOfTheArray = arr.size;\n\n  var index : Int = 0;\n\n  while\
    \ (index < sizeOfTheArray){\n\n  println(\"index : $index, value : ${arr[index]}\"\
    )\n\n  index++\n\n}\n\n}\n```\n\n输出\n\n```\nindex : 0, value : 2\n\nindex : 1,\
    \ value : 3\n\nindex : 2, value : 5\n\nindex : 3, value : 7\n```\n\n# Kotlin：位运算符\n\
    \n下表总结了 Kotlin 支持的位运算符。\n\n| 运算符 | 描述 | Java 等价 |\n| --- | --- | --- |\n| `shl`\
    \ | 执行有符号左移 | `<<` |\n| `shr` | 执行有符号右移 | `>>` |\n| `ushr` | 执行无符号右移 | `>>>` |\n\
    | `and` | 按位与 | `&` |\n| `or` | 按位或 | `|` |\n| `xor` | 按位异或 | `^` |\n| `inv()`\
    \ | 按位取反 | `~` |\n\n除了 `inv()` 之外，所有其他运算符都以中缀形式使用。\n\n示例：\n\n```\nvar1 shl var2\n\
    \nvar1 or var2\n```\n\n## 1. `shl`：执行有符号左移\n\n左移运算符将所有位向左移动一位，即，它将值加倍。\n\n语法：\n\
    \n```\nvariable shl n\n将变量左移 'n' 次。\n```\n\n`Variable shl n` 等于 `variable = variable\
    \ * 2 的 n 次幂`\n\n```\nvar var1 : Int = 2\n\nvar1 shl 1 = 2 * 2 的 1 次幂 = 4\n\n\
    var1 shl 2 = 2 * 2 的 2 次幂 = 8\n```\n"
- fmt: " ```\nvar1 shl 9 = 2 * 2 power 9 = 1024\n```\n\n`LeftShift.kt`\n\n```kotlin\n\
    fun main (args: Array<String>) {\n  var var1: Int = 2\n  var res1 = var1 shl 1\n\
    \  var res2 = var1 shl 2\n  var res3 = var1 shl 9\n  println( \"res1 : ${res1}\"\
    \ )\n  println( \"res2 : ${res2}\" )\n  println( \"res3 : ${res3}\" )\n}\n```\n\
    \n**Output**\n\n```\nres1 : 4\nres2 : 8\nres3 : 1024\n```\n\n## 2. `shr`: Perform\
    \ signed shift right\n\nRight shift operator shifts all the bits to one bit right,\
    \ i.e, it half (divide by 2) the value\n\n**Syntax:**\n\n```\nvariable shr n\n\
    ```\n\nright shift the variable by `'n'` number of times.\n\n`Variable shr n`\
    \ is equals to `variable = variable / 2 power n`\n\n```\nvar a : Int = 128\na\
    \ shr 1 = 128 / (2 power 1) = 64\na shr 2 = 128 / (2 power 2) = 32\n```\n\n`RightShift.kt`\n\
    \n```kotlin\nfun main (args: Array<String>) {\n  var a: Int = 128\n  var res1\
    \ = a shr 1\n  var res2 = a shr 2\n  var res3 = a shr 3\n  println( \"res1 : ${res1}\"\
    \ )\n  println( \"res2 : ${res2}\" )\n  println( \"res3 : ${res3}\" )\n}\n```\n\
    \n**Output**\n\n```\nres1 : 64\nres2 : 32\nres3 : 16\n```\n\n## 3. `ushr`: Unsigned\
    \ right shift\n\nShifts all the bits to one bit right, and make the left most\
    \ bit to zero\n\n**Syntax**\n\n```\nVariable ushr n\n```\n\n`UnsignedRightShift.kt`\n\
    \n```kotlin\nfun main (args: Array<String>) {\n  var a: Int = - 128\n  var res1\
    \ = a ushr 1\n  println( \"res1 : ${res1}\" )\n}\n```\n\n**Output**\n\n```\nres1\
    \ : 2147483584\n```\n\n**Explanation**\n\n-128 in 2's complement form is\n\n```\n\
    11111111 11111111 11111111 10000000\n```\n\n`>>>` shifts the one bit right and\
    \ replace leftmost bit by zero\n\nso (`-128 ushr 1`) is like below sequence\n\n\
    ```\n01111111 11111111 11111111 11000000\n```\n\n## 4. Bit Wise `and`, `or`, `xor`\n\
