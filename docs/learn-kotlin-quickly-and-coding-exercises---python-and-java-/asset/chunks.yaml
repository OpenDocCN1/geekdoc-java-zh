    \n- `byteArrayOf()`\n- `shortArrayOf()`\n- `intArrayOf()`\n- `longArrayOf()`\n\
    - `floatArrayOf()`\n- `doubleArrayOf()`\n- `CharArray()`\n- `BooleanArray()`\n\
    \n# Kotlin：定义 null 数组\n\nKotlin 提供了 `arrayOfNulls` 库函数来定义 null 值数组。\n\n`ArrayOfNulls.kt`\n\
    \n```\nfun main(args: Array<String>) {\n\n  var a: Array<Int?> = arrayOfNulls(5)\n\
