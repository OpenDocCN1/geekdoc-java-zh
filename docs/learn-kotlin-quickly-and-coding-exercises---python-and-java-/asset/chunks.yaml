    ## Kotlin: === vs ==


    Kotlin supports two types of equality.


    *   Referential Equality


    *   Structural Equality


    Referential Equality (===)


     ‘===’ operator is used to check, whether two references point to same object
    or not.


    Ex:


    ref1 === ref2


    Above statement returns true, if references ‘ref1’ and ‘ref2’ points to same object,
    else false.


    Structural Equality(==)


    Structural equality is used to check, whether the values of both references are
    equal (checks by using equals() method of java).


    Ex:


    ref1 == ref2


    Above statement returns true, if ref1.equals(ref2) return true, else false.


