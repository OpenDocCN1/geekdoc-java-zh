    \ : ${emp1.getFirstName()}\" )\nprintln( \"lastName : ${emp1.getLastName()}\"\
    \ )\n}\n```\n\n输出\n\n```\nfirstName : Chamu\nlastName : Gurram\n```\n\n## Kotlin：成员属性必须初始化\n\
    \n在 Kotlin 中，成员属性要么初始化，要么必须声明为抽象。让我们通过一个例子来看看。\n\nEmployee.kt\n\n```kotlin\nclass\
