    \n方法 2：将属性设为抽象\n\nEmployee.kt\n\n```kotlin\nabstract class Employee {\n  abstract\
    \ var firstName: String\n  abstract var lastName: String\n}\n```\n\n## Kotlin：const：编译时常量\n\
    \n你可以使用 `const` 关键字定义编译时常量。\n\n示例\n\n```kotlin\nconst val VENDOR_NAME = \"Self\
