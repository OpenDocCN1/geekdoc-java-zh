    \n# 在 Kotlin 中定义变量\n\n变量是用于存储数据的命名内存位置。\n\n## 语法\n\n```\nvar variableName : DataType\
    \ = value\n\nval variableName : DataType = value\n```\n\n`var` 和 `val` 都是关键字。\n\
    \n## 示例\n\n```\nvar a : Int  =10;\n```\n\n`a` 是 int 类型，赋值为 10。\n\n```\nval b :\
    \ Double = 1.23\n```\n\n`b` 是 Double 类型，赋值为 1.23。关键字 `val` 用于定义常量（不可变对象）。\n\n\
    `HelloWorld.kt`\n\n```\nfun main (args: Array<String>) {\n\n  var a : Int  = 10\
    \ ;\n\n  val b : Double = 1.23\n\n    println( \"a : ${a}\" )\n\n    println(\
    \ \"b : ${b}\" )\n\n}\n```\n\n```\nC:\\>kotlinc HelloWorld.kt\n\nC:\\>kotlin HelloWorldKt\n\
    \na : 10\n\nb : 1.23\n```\n\n# Kotlin 中的数据类型\n\nJava 有 int、float、char 等原始类型，那么\
    \ Kotlin 呢？\n\n从用户的角度来看，Kotlin 将所有东西都设计为对象，但在运行时，布尔值、数字和字符都表示为原始类型。\n\n`HelloWorld.kt`\n\
    \n```\nfun main (args: Array<String>) {\n\n  var doubleVar: Double = 1.23\n\n\
    \  var floatVar: Float = 1.23f\n\n  var longVar: Long = 123\n\n  var intVar: Int\
    \ = 123\n\n  var shortVar: Short = 123\n\n  var byteVar: Byte = 123\n\n    println(\
    \ \"doubleVar : ${doubleVar}\" )\n\n    println( \"doubleVar : ${floatVar}\" )\n\
    \n    println( \"longVar : ${longVar}\" )\n\n    println( \"intVar : ${intVar}\"\
    \ )\n\n    println( \"shortVar : ${shortVar}\" )\n\n    println( \"byteVar : ${byteVar}\"\
    \ )\n\n}\n```\n\n## 输出\n\n```\ndoubleVar : 1.23\n\ndoubleVar : 1.23\n\nlongVar\
    \ : 123\n\nintVar : 123\n\nshortVar : 123\n\nbyteVar : 123\n```\n\n# Kotlin：可空类型\n\
    \n默认情况下，Kotlin 的引用类型（`Int`、`Float`、`Double`、`String` 等）不接受 null 值。Kotlin 引入此特性是为了避免空指针异常。\n\
    \n`Test.kt`\n\n```\nfun main (args: Array<String>) {\n\n  var name : String =\
    \ \"Krishna\"\n\n    name = null\n\n}\n```\n\n当你尝试编译上面的程序时，Kotlin 会抛出以下错误。\n\n\
    ```\nERROR: Null can not be a value of a non-null type String (6, 9)\n```\n\n\
    如何定义一个可以接受 null 值的变量？\n\n通过使用可空类型，你可以定义一个接受 null 值的变量。在引用类型后追加 `?` 以接受 null 值。\n\
    \n| 类型 | 可空类型 |\n|------|---------|\n| Int | Int? |\n| String | String? |\n| Double\
    \ | Double? |\n| Person | Person? |\n\n## 示例\n\n```\n  var id: Int? = 1\n\n  var\
    \ name: String? = \"Krishna\"\n\n  var salary: Double? = 123.456\n\n  var person:\
    \ Person? = Person( \"Krishna\" )\n\n    id = null\n\n    name = null\n\n    salary\
    \ = null\n\n    person = null\n```\n\n# Kotlin：数字\n\nKotlin 提供以下数据类型来支持数字。\n\n\
    | 数据类型 | 大小（位） |\n|---------|-----------|\n| Double | 64 |\n| Float | 32 |\n|\
    \ Long | 64 |\n| Int | 32 |\n| Short | 16 |\n| Byte | 8 |\n\n`Numbers.kt`\n\n\
    ```\nfun main (args: Array<String>) {\n\n  var doubleVar: Double = 1.23\n\n  var\
    \ floatVar: Float = 1.23f\n\n  var longVar: Long = 123\n\n  var intVar: Int =\
    \ 123\n\n  var shortVar: Short = 123\n\n  var byteVar: Byte = 123\n\n    println(\
    \ \"doubleVar : ${doubleVar}\" )\n\n    println( \"doubleVar : ${floatVar}\" )\n\
    \n    println( \"longVar : ${longVar}\" )\n```\n"
- fmt: " ```\nprintln(\"intVar : ${intVar}\")\n\nprintln(\"shortVar : ${shortVar}\"\
    )\n\nprintln(\"byteVar : ${byteVar}\")\n\n}\n```\n\nOutput\n\n```\ndoubleVar :\
    \ 1.23\n\ndoubleVar : 1.23\n\nlongVar : 123\n\nintVar : 123\n\nshortVar : 123\n\
    \nbyteVar : 123\n```\n\n## Hexa, octal and Binary literal notation\n\nKotlin support\
    \ Hexa and binary notation, but not support octal notation. Hexa numbers are represented\
    \ by prefixing `0x`,\n\n`Numbers.kt`\n\n```\nfun main(args: Array<String>) {\n\
    \n  var hexaNum : Int = 0x123\n\n  var binaryNum : Int = 0b10101010\n\nprintln(\"\
    hexaNum : ${hexaNum}\")\n\nprintln(\"binaryNum : ${binaryNum}\")\n\n}\n```\n\n\
    Output\n\n```\nhexaNum : 291\n\nbinaryNum : 170\n```\n\nYou can also represent\
    \ numbers using `'_'`.\n\n`Numbers.kt`\n\n```\nfun main(args: Array<String>) {\n\
    \n  var ten = 10\n\n  var hundred = 100\n\n  var thousand = 1000\n\n  var tenThousand\
    \ = 10_000\n\n  var oneLaksh = 100_000\n\n  var tenLaksh = 1_000_000\n\nprintln(\"\
    ten : ${ten}\")\n\nprintln(\"hundred : ${hundred}\")\n\nprintln(\"thousand : ${thousand}\"\
    )\n\nprintln(\"tenThousand : ${tenThousand}\")\n\nprintln(\"oneLaksh : ${oneLaksh}\"\
    )\n\nprintln(\"tenLaksh : ${tenLaksh}\")\n\n}\n```\n\nOutput\n\n```\nten : 10\n\
    \nhundred : 100\n\nthousand : 1000\n\ntenThousand : 10000\n\noneLaksh : 100000\n\
    \ntenLaksh : 1000000\n```\n\n# Kotlin: Characters\n\n`'Char'` keyword is used\
    \ to define single character. Character is enclosed in single quotes.\n\nEx\n\n\
    ```\nvar myChar : Char = 'a'\n```\n\n`HelloWorld.kt`\n\n```\nfun main(args: Array<String>)\
    \ {\n\n  var myChar : Char = 'a'\n\nprintln(\"Value of myChar is : ${myChar}\"\
    )\n\n}\n```\n\nOutput\n\n```\nValue of myChar is : a\n```\n\nAll the escape sequences\
    \ that are supported by Java are also supported by Kotlin.\n\n# Kotlin: Convert\
    \ character to Int\n\n`Char` type provides `toInt()` method to convert a character\
    \ to integer.\n\n`IntConverter.kt`\n\n```\nfun main(args: Array<String>) {\n\n\
    \  var myChar : Char = 'a'\n\nprintln(\"Value of myChar is : ${myChar}\")\n\n\
    println(\"Value of myChar in int is : ${myChar.toInt()}\")\n\n}\n```\n\nOutput\n\
    \n```\nValue of myChar is : a\n\nValue of myChar in int is : 97\n```\n\n# Kotlin:\
    \ Booleans\n\n`Boolean` type is used to represent `true`, `false` states.\n\n\
    `Booleans.kt`\n\n```\nfun main(args: Array<String>) {\n\n  var trueState : Boolean\
    \  = true\n\n  var falseState : Boolean  = false\n\nprintln(\"Value of trueState\
    \ is : ${trueState}\")\n\nprintln(\"Value of falseState is : ${falseState}\")\n\
    \n}\n```\n\nOutput\n\n```\nValue of trueState is : true\n\nValue of falseState\
    \ is : false\n```\n\n# Kotlin: Strings\n\nString is a collection of characters,\
    \ enclosed in double quotes. Strings in kotlin are defined by using the keyword\
    \ `String` and these are immutable.\n\nEx\n\n```\nvar message: String = \"Good\
    \ Morning\"\n```\n\n`StringsDemo.kt`\n\n```\nfun main(args: Array<String>) {\n\
    \n  var message: String = \"Good Morning\"\n\nprintln(message)\n\n}\n```\n\nOutput\n\
    \n```\nGood Morning\n```\n\nAll the escape sequences (`\\n`, `\\t`, `\\a` etc.,)\
    \ supported by java are also supported by kotlin.\n\nEx\n\n```\nvar message: String\
    \ = \"Good Morning\\nHow are you\\nsee you soon\"\n```\n\n`StringDemo.kt`\n\n\
    ```\nfun main(args: Array<String>) {\n\n  var message: String = \"Good Morning\\\
    nHow are you\\nsee you soon\"\n\nprintln(message)\n\n}\n```\n\nOutput\n\n```\n\
    Good Morning\n\nHow are you\n\nsee you soon\n```\n\nIf you do not want to perform\
    \ escaping, then embed the string in `\"\"\"` (triple quotes).\n\n`StringDemo.kt`\n\
    \n```\nfun main(args: Array<String>) {\n\n  var message: String = \"\"\"Good Morning\\\
    nHow are you\\nsee you soon\n\n      After two lines\\bgood bye\"\"\"\n\nprintln(message)\n\
    \n}\n```\n\nOutput\n\n```\nGood Morning\\nHow are you\\nsee you soon\n\n     \
    \                                        After two lines\\bgood bye\n```\n\n#\
    \ Kotlin: String template expressions\n\nBy using template expression, you can\
    \ evaluate the expression in a string. Template expression starts with `$` symbol\
    \ followed by a name.\n\nEx\n\n```\nvar a = 10\n\nprintln(\"Value of a is : $a\"\
    )\n```\n\nArbitrary expression are enclosed in curly braces\n\n```\nvar str =\
    \ \"Hello World\"\n\nprintln(\"$str length is ${str.length}\")\n```\n\n`Expression.kt`\n\
    \n```\nfun main(args: Array<String>) {\n\n  var a = 10\n\n  var str = \"Hello\
    \ World\"\n\nprintln(\"Value of a is : $a\")\n\nprintln(\"$str length is ${str.length}\"\
    )\n\n}\n```\n\nOutput\n\n```\nValue of a is : 10\n\nHello World length is 11\n\
    ```\n\n# Kotlin: Arrays\n\nArray represents a collection of elements of same type.\
    \ Kotlin provides `Array` class to represent arrays.\n\nBy using the library function\
    \ `arrayOf`, you can define an array.\n\nEx\n\n```\nval numbers: Array<Int> =\
    \ arrayOf(10, 20, 30, 40, 50)\n```\n\n`ArrayDemo.kt`\n\n```\nfun main(args: Array<String>)\
    \ {\n\n  val numbers: Array<Int> = arrayOf(10, 20, 30, 40, 50)\n\n  for (element\
    \ in numbers) {\n\n  println(element)\n\n}\n\n}\n```\n\nOutput\n\n```\n10\n\n\
    20\n\n30\n\n40\n\n50\n```\n\nKotlin provides below library functions to define\
    \ array of primitive types.\n\n- `byteArrayOf()`\n- `shortArrayOf()`\n- `intArrayOf()`\n\
    - `longArrayOf()`\n- `floatArrayOf()`\n- `doubleArrayOf()`\n- `CharArray()`\n\
    - `BooleanArray()`\n\n# Kotlin: Define array of nulls\n\nKotlin provides `arrayOfNulls`\
    \ library function to define array of null values.\n\n`ArrayOfNulls.kt`\n\n```\n\
    fun main(args: Array<String>) {\n\n  var a: Array<Int?> = arrayOfNulls(5)\n\n\
    \  for (element in a) {\n\n  println(element)\n\n}\n\n}\n```\n\nOutput\n\n```\n\
    null\n\nnull\n\nnull\n\nnull\n\nnull\n```\n\n# Kotlin: Define array using factory\
    \ function\n\nKotlin provides a factory function, which takes size and a function\
    \ `'f'` as arguments to define an array. The function `'f'` is used to provide\
    \ initial values to the array.\n\n```\nvar squares = Array(5, { i -> i * i })\n\
    ```\n\nAbove statement define an array `squares` of size 5 and initialize `{1,\
    \ 4, 9, 16, 25}`\n\n`ArrayFactoryFunction.kt`\n\n```\nfun main(args: Array<String>)\
    \ {\n\n  var squares = Array(5, { i -> i * i })\n\n  var cubes = Array(5, { i\
    \ -> i * i * i })\n\nprintln(\"Elements in squares array : \")\n\n  for (ele in\
    \ squares) {\n\n  println(ele)\n\n}\n\nprintln(\"\\nElements in cubes array :\
    \ \")\n\n  for (ele in cubes) {\n\n  println(ele)\n\n}\n\n}\n```\n\nOutput\n\n\
    ```\nElements in squares array :\n\n0\n\n1\n\n4\n\n9\n\n16\n\nElements in cubes\
    \ array :\n\n0\n\n1\n\n8\n\n27\n\n64\n```\n\n# Kotlin: Print array elements\n\n\
    In this post, I am going to show how to print elements of an array.\n\n## Print\
    \ elements of array using for loop\n\n`ArrayUtil.kt`\n\n```\nfun main(args: Array<String>)\
    \ {\n\n  var arr: Array<Int> = arrayOf(1, 2, 3, 4)\n\n  for (ele in arr) {\n\n\
    \  println(ele)\n\n}\n\n}\n```\n\nOutput\n\n```\n1\n\n2\n\n3\n\n4\n```\n\n## Print\
    \ array elements using `Arrays.toString` method\n\n`ArrayUtil.kt`\n\n```\nimport\
    \ java.util.Arrays\n\nfun main(args: Array<String>) {\n\n  var arr: Array<Int>\
    \ = arrayOf(1, 2, 3, 4)\n\nprintln(Arrays.toString(arr))\n\n}\n```\n\nOutput\n\
    \n```\n[1, 2, 3, 4]\n```\n\n## Print array elements using `array.indices`\n\n\
    `ArrayUtil.kt`\n\n```\nfun main(args: Array<String>) {\n\n  var arr: Array<Int>\
    \ = arrayOf(2, 3, 5, 7)\n\n  for (index in arr.indices) {\n\n  println(arr[index])\n\
    \n}\n\n}\n```\n\nOutput\n\n```\n2\n\n3\n\n5\n\n7\n```\n\n## Print array elements\
    \ using `array.withIndex`\n\n`ArrayUtil.kt`\n\n```\nfun main(args: Array<String>)\
    \ {\n\n  var arr: Array<Int> = arrayOf(2, 3, 5, 7)\n\n  for ((index, value) in\
    \ arr.withIndex()) {\n\n  println(\"index : $index, value : $value\")\n\n}\n\n\
    }\n```\n\nOutput\n\n```\nindex : 0, value : 2\n\nindex : 1, value : 3\n\nindex\
    \ : 2, value : 5\n\nindex : 3, value : 7\n```\n\n## Print array elements using\
    \ while loop\n\n`ArrayUtil.kt`\n\n```\nfun main(args: Array<String>) {\n\n  var\
    \ arr: Array<Int> = arrayOf(2, 3, 5, 7)\n\n  var sizeOfTheArray = arr.size;\n\n\
    \  var index : Int = 0;\n\n  while (index < sizeOfTheArray){\n\n  println(\"index\
    \ : $index, value : ${arr[index]}\")\n\n  index++\n\n}\n\n}\n```\n\nOutput\n\n\
    ```\nindex : 0, value : 2\n\nindex : 1, value : 3\n\nindex : 2, value : 5\n\n\
    index : 3, value : 7\n```\n\n# Kotlin: Bit wise operators\n\nBelow table summarizes\
    \ the bit wise operators supported by Kotlin.\n\n| Operator | Description | Java\
    \ Equivalant |\n| --- | --- | --- |\n| `shl` | Perform signed shift left | `<<`\
    \ |\n| `shr` | Perform signed shift right | `>>` |\n| `ushr` | Perform unsigned\
    \ shift right | `>>>` |\n| `and` | Bitwise and | `&` |\n| `or` | Bitwise or |\
    \ `|` |\n| `xor` | Bitwise X-OR | `^` |\n| `inv()` | Bitwise inversion | `~` |\n\
    \nOther than `inv()`, all other operators are used in infix form.\n\nEx:\n\n```\n\
    var1 shl var2\n\nvar1 or var2\n```\n\n## 1. `shl`: Perform signed shift left\n\
    \nLeft shift operator shifts all the bits to one bit left, i.e, it doubles the\
    \ value.\n\nSyntax:\n\n```\nvariable shl n\nleft shift the variable by 'n' number\
    \ of times.\n```\n\n`Variable shl n` is equals to `variable = variable * 2 power\
    \ n`\n\n```\nvar var1 : Int = 2\n\nvar1 shl 1 = 2 * 2 power 1 = 4\n\nvar1 shl\
    \ 2 = 2 * 2 power 2 = 8\n```"
