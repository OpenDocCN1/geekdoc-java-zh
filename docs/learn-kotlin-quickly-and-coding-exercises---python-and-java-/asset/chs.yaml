  \ = Outer()\n  var innerObj = Outer().Inner()\n  outerObj.printMsg()\n  innerObj.printMsg()\n\
  }\n```\n\n输出\n\n```\nInside Outer class\nInside Inner class\n```\n\n你可以从内部类访问外部类的成员变量。\n\
