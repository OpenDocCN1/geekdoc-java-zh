  ```python\ndef flatten_list(n_list):\n    result_list = []\n    if not n_list: return\
  \ result_list\n    stack = [list(n_list)]\n    while stack:\n        c_num = stack.pop()\n\
  \        next = c_num.pop()\n        if c_num: stack.append(c_num)\n        if isinstance(next,\
