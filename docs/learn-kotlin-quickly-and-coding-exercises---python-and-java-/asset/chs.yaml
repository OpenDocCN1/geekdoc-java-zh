  \ reference: x\n```\n\n# Kotlin：内部类\n\n内部类类似于嵌套类，唯一的区别是你可以从内部类访问外部类的成员。\n\n## 如何定义内部类？\n\
  \n内部类使用关键字 `inner` 定义。\n\n## 如何定义内部类的对象？\n\n```kotlin\nvar innerObj = Outer().Inner()\n\
  ```\n\n`InnerDemo.kt`\n\n```kotlin\nclass Outer {\n  fun printMsg() {\n    println(\"\
  Inside Outer class\")\n  }\n  inner class Inner {\n    fun printMsg() {\n      println(\"\
