  \n将下面的代码片段复制到 `HelloWorld.kt` 文件中。\n\n`HelloWorld.kt`\n\n```\nfun main (args: Array<String>)\
  \ {\n\n    println( \"Hello World\" )\n\n}\n```\n\n## 运行 HelloWorld.kt 文件\n\n右键点击\
