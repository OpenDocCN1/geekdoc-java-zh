  你可以使用 `kotlin HelloWorldKt` 命令来运行 HelloWorldkt 文件。\n\n```\nC:\\Users\\krishna\\\
  Documents\\Study\\Kotlin\\Programs>kotlin HelloWorldKt\n\nHello World\n```\n\n##\
  \ 创建并运行 jar\n\n你也可以创建一个 jar 文件，并使用 Java 启动器来运行该 jar 文件。\n\n使用命令 `kotlinc HelloWorld.kt\
  \ -include-runtime -d HelloWorld.jar` 来创建 jar 文件。\n\n`include-runtime` 选项告诉 Kotlin\
