  \n09/02/2017  11:24 AM    <DIR>          ..\n\n09/02/2017  11:24 AM           869,262\
  \ HelloWorld.jar\n\n09/02/2017  11:09 AM                57 HelloWorld.kt\n\n   \
  \            2 File(s)        869,319 bytes\n\n               2 Dir(s)  63,401,816,064\
  \ bytes free\n```\n\n一旦 jar 文件创建完成，你就可以调用该 jar 文件，就像运行其他 jar 文件一样。使用命令 `java -jar\
  \ HelloWorld.jar`\n\n```\nC:\\Users\\Krishna\\Documents\\Study\\Kotlin\\Programs>java\
  \ -jar HelloWorld.jar\n\nHello World\n```\n\n# 在 Eclipse 中设置 Kotlin\n\n打开 Eclipse。Help\
