    # If...Else 语句


    当你使用 `if` 语句时，代码能够执行的操作范围将会有一些局限性。当用户输入正确答案时，他们会得到你列出的语句或消息。但当他们给出错误答案，或者至少是根据你在代码中设置的条件被视为假（false）的答案时，会发生什么呢？


    会有某些用户输入的答案根据你的条件被认为是假的。这并不意味着用户是错了。但如果你设置了一个只允许 21 岁及以上年龄的程序，那么用户通过 `if` 语句获得响应的唯一情况就是他们超过
    21 岁时。当他们回答自己是 18 岁或其他低于 21 岁的年龄时，你会得到一个空白屏幕。


    这对于你的代码来说看起来并不很专业。用户可能会因为什么都没有显示而认为你的程序出了某种问题。这就是为什么学习 `if...else` 语句如此重要的原因。这些语句的意思是：如果满足条件则提供一个答案，如果条件不满足，则提供第二个答案。


    所以通过上面的例子，假设你的程序询问用户年龄是多少，你将其设置为只有当用户满 21 岁或以上时答案才为真。如果用户输入的年龄是 25 岁，系统将看到这是一个真答案，并显示你的第一个语句。你可以选择你想在此处显示的语句，例如“恭喜，你被允许进入该网站。”


    然后，而不是关闭程序，当用户输入一个低于 21 岁的年龄（例如 18 岁）时，程序将看到这是一个假答案。它将跳过你代码中的第一个语句，并进入你设置的第二个语句。这条消息可以是“对不起，你必须年满
    21 岁才能进入此网站。”


    你可以在代码中添加任意数量的此类 `if...else` 语句。有时，将事情分为不同的类别是有好的。例如，假设你询问用户他们最喜欢的动物是猫、狗、马还是鱼。如果某人说他们喜欢猫，你的程序将将其视为满足了条件且为真，并显示你设置在那在那的函数。但如果你声明这是他们最喜欢的答案，程序会发现上述三个答案都是假的，它将继续向下执行，直到遇到那个为真的答案。


    这是一种非常简单的方法，你将向程序中添加更多选项。用户将能够输入他们想要的答案，你可以设置程序根据用户给出的答案做出响应。虽然对于不熟悉编程的人来说，`if`
    语句是一个很好的起点，但在大多数情况下，你可能希望设置 `if...else` 语句，以确保无论用户给出什么答案，程序都能继续运行。


    # Switch 语句


    你可能选择在代码内部使用的另一种条件语句是 `switch` 语句。该语句将使你更容易测试代码内部的变量，以检查它们是否与一组已知值列表具有等性。此选项中的单个值被称为一个
    `case`（分支），而被切换的变量将对每个现有的 `case` 进行检查。一个包含 `switch` 语句的增强循环示例包括：


    ```java

    switch(expression) {

    case value:

    //Statements

    break; //可选

    case value :

    //Statements

    break; //可选

    //你可以有任意数量的 case 语句。

    default : //可选

    //Statements

    }

    ```


    # 总结


    条件语句可以帮助程序根据你设置的条件和用户的输入更容易做出决策。


    `if` 语句是最基本的条件语句类型。它们基于“真”和“假”的概念，但它们只有在用户输入为真时才起作用。


    `if...else` 语句旨在帮助解决 `if` 语句带来的某些缺点。当用户向程序输入正确答案时，你会得到一条语句，而当他们输入一个被视为假的答案时，会得到另一条语句。


    `switch` 语句将帮助你创建比较，以检查一组变量和值与语句内部的集合相等。


