    in Java and they tell your text editor what you want to happen during code execution.


    ## Statements that take more than one line


    For the most part, your statements will take up just one line because they are
    short enough. But what happens when you want to write out a large statement after
    the command? Will the Java program be able to recognize that it is still part
    of the statement or will it try to read this as a new line of commands and send
    out an error message?


    If you are writing a statement with your command that takes up more than just
    the one line, you should add a back-slash to the beginning of that statement.
    In addition, the brackets will work too. Choose one or the other of these, rather
    than both, to state where the statement is going. Once the statement is done,
    move on with a space to a new line.


    ## Comments


    Here we are going to take some time to talk about comments and how they work in
    our code. Looking through some of the codes in this book, you may notice there
    are parts that have a hashtag before them and a small sentence. These are examples
    of comments in the code and they are an important piece of the puzzle.


    Comments are not crucial to the code (and if the compiler read them it would get
    confused and result in an error), but they can help other programmers who are
    reading the code to understand what is going on inside the code. If you want to
    explain yourself in the code, or tell the other programmers what needs to be entered
    in this part of the code, a comment can be useful.


    Making comments in Java is a simple process. You will just need to add a hashtag
    before the comment, write out the statement that you want, and then skip to the
    next line to continue the code. The compiler recognizes the hashtag and will just
    skip right over this part of the code so it will never show up on the screen.
    You can use as many of these comments in your code as you would like, but keep
    it to a minimum to avoid issues with readability in your Java code.


    ## Boolean expressions


    You will find that the Boolean expressions will be helpful when we get to the
    conditional statements later on. The Boolean expressions are going to be based
    on true or false. For example, if you only want someone who enters their age to
    be above 21, you would have a true show up when the person enters any number above
    21, but a false time they enter a number that is 20 or below. If the true expression
    comes up, you will have a certain statement come up, such as “Congratulations,
    you qualify to participate.”


    Now, depending on which way you do this, there are a few things that can happen.
    In the simplest of forms, you will have the program just end if the statement
    ends up false, or the person enters an age that is 20 or below. But you can go
    through and make some changes so that instead of having the program shut down
    when a false occurs, another message comes up. For example, when the person enters
    a number that is 20 or below, you can make it that the program will show a statement
    such as “Sorry, you are not able to participate at this time.”


    Remember that you are the one who is in charge when it comes to the code that
    you are writing. There are a lot of expressions that you are able to use that
