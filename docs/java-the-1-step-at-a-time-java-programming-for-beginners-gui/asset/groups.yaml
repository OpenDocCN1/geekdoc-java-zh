    -   Assert（断言）——这通常用于检查你想要执行的语句。

    -   Pass（通过）——这将允许你创建一个空代码块。


    关于这些字符，你需要记住的一点是，当它们作为字符使用时，不能转换为变量。它们是 Java 中的保留命令，告诉你的文本编辑器你希望在代码执行期间发生什么。


    ## 跨多行的语句


    在大多数情况下，你的语句只占一行，因为它们足够短。但当你想在命令后面写一个很长的语句时会发生什么呢？Java 程序能够识别出它仍然是语句的一部分，还是会尝试将其读取为新行命令并发送错误信息？


    如果你编写的带有命令的语句占据了多一行，你应该在该语句的开头添加一个反斜杠 `\`。此外，括号也可以起作用。在这些选项中选择其一，而不是两者都用，以指定语句的结束位置。一旦语句完成，通过空格移动到新行。


    ## 注释


    在这里我们将花些时间来讨论注释以及它们在代码中是如何工作的。通过书中的某些代码，你可能会注意到有些部分前面有一个井号（#）和一句短话。这些都是代码中的注释示例，它们是拼图中重要的一部分。


    注释对代码来说至关重要（如果编译器读取它们，将会产生困惑并导致错误），但它们可以帮助阅读代码的其他程序员理解代码内部正在发生什么。如果你想在代码中解释自己的想法，或者告诉其他程序员在代码的某部分需要输入什么，注释就会非常有用。


    在 Java 中编写注释是一个简单的过程。你只需要在注释前添加一个井号，写下你想要的语句，然后跳到下一行继续编写代码。编译器会识别井号并直接跳过这部分代码，因此它永远不会显示在屏幕上。你可以在代码中使用尽可能多的此类注释，但要保持在最小范围内，以避免你的
    Java 代码可读性出现问题。


    ## 布尔表达式


    当我们稍后遇到条件语句时，你会发现布尔表达式将很有帮助。布尔表达式将基于“真”（true）或“假”（false）。例如，如果你只想让输入年龄的人员超过 21
    岁，那么当人员输入 21 以上的任何数字时，会显示为真，而当他们输入 20 岁或以下的数字时，会显示为假。如果出现了真表达式，你将会看到特定的语句，例如“恭喜，你符合参加条件”。


    现在，取决于你如何执行，可能会发生几种情况。在最简单的形式中，如果语句结果为假，或者人员输入的年龄为 20 岁或以下，程序将直接结束。但你可以进行一些更改，使得在发生假值时不是让程序关闭，而是弹出另一个消息。例如，当人员输入
    20 岁或以下的数字时，你可以让程序显示类似“抱歉，你现在无法参加”的语句。


    记住，在你编写代码时，你才是代码的负责人。你可以使用许多可以放入布尔表达式的表达式，例如 `if`、`if...else` 和 `elif` 语句，这些语句允许无论你在处理什么程序，都能创建出你所需的精确代码。你将能够确定与你编写的代码最契合的真、假语句。


    ## 整数和浮点数


    在编写 Java 代码时，你可以预见到会有时候使用整数和浮点数来存储代码中的任何数值值。它们也可以被组合在一起。Java 内部识别的数值点类型包括：


    -   Int（有符号整数）

    -   Complex（复数）

    -   Float（浮点实数值）

    -   Long（长整数；这些可以是八进制或十六进制）


    ## 运算符


    运算符是一种很有用的数据类型，可以用你代码的大部分。它们很简单，但可以为你在代码内部能做的事情开启许多可能性。在 Java 中，有很多可用的运算符，包括：


    -   算术（Arithmetic）：你可能猜算术运算符是如何工作的。它们允许你在代码中使用两个或多个数值进行数学等式计算。你可以对值进行加、减、乘、除以及其他几个选项。你还可以在同一段代码中执行多个符号，只需记住遵循运算规则以确保你正确处理了这些数字。

    -   标识（Identity）：当你想要比较两个对象的内存值时（特别是当它们位于不同的位置时），标识运算符非常有帮助。

    -   赋值（Assignment）：接下来是赋值运算符。这些用于将值分配给你正在使用的变量。如果你想给其中一个变量赋予字母、语句甚至数字，你就会使用赋值运算符之一。

    -   位运算（Bitwise）：如果你想按位处理运算符，你就需要使用位运算符。此选项将深入代码内部，使用标准的 0 和 1 来查看代码，而不是查看屏幕上实际显示的单词和数字。

    -   成员（Membership）：成员运算符将用于你的代码中，以查看是否存在某种连贯性（也称为成员关系），位于你操作的序列中。

    -   比较和关系（Comparison and relational）：比较和关系运算符一起工作，以查找它们是否相同或不同。你将能够使用它们来查看你的语句是否为真或假，这会在程序中发生。在这种情况下，它们会帮助确保在程序中提供正确的答案。


    ## 总结


    这些数据类型都是重要的，因为它们帮助你正确写出 Java 代码。


    （注：后续重复的段落已根据指令“不要重复输出原文”及翻译逻辑进行了精简去重，此处保留了核心总结性内容）


    ## 第 3 章：使用条件语句


    在编写 Java 代码时，你可能会遇到需要程序做出决策的时候。这些决策将基于你设置的条件和用户提供的输入之间的组合。取决于你所编写的条件语句，程序将确定输入是真还是假。


    变量基本上是代码内部数据的存储容器。有三种基本类型（实例或静态和局部），这会让编写工作变得更简单。除了能够处理许多类型之外，我们在本章中展示了数据类型。


