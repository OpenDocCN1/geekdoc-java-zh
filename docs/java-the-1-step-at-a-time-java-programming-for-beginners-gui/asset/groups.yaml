  mdcn: "\n在这个示例中，我们声明了数组并赋予了它一百个索引值。完成后，我们声明了想要递增的整数变量。我们告诉 `while` 循环，只要 `x` 的值小于\
    \ `intArray` 的长度，它就继续循环，而长度就是 `intArray` 拥有的索引数量。然后，我们在每次迭代中让 `x` 递增1。这段代码允许你快速编辑一百个值，然后将它们打印到控制台上。\n\
    \n示例 2：\n\n```\nint intArray[] = new int[100];\n\nint x = 0;\n\ndo {\nintArray[x]\
    \ = x;\nSystem.out.println(intArray[x]);\nx++;\n} while(x < 100);\n```\n\n对于这个示例，我们将得到与第一个示例相似的结果，只是我们设计了\
    \ `do-while` 循环而不是使用 `while` 循环。输出将相同的，但你将确保循环至少执行一次。\n\n示例 3\n\n```java\nint\
    \ intArray[] = new int[100];\nfor (int x = 0; x < 100; x++) {\nintArray[x] = x;\n\
    System.out.println(x);\n}\n```\n\n对于这个示例，我们正在执行与其它选项相似的操作，但计数器变量将构建在你的循环中。这意味着你不需要去遍历并声明另一个变量，也不需要告诉系统手动为你递增。这是一种处理数组和循环更高效的方法，不需要编写那么多的代码。\n\
    \n示例 4：\n\n```java\nint[][] intArray = new int [100][100];\nfor(int x = 0; x <\
    \ 100; x++){\n  for(int y = 0; y < 100; y++){\n    intArray[x][y] = y;\n    System.out.println(intArray[x][y]);\n\
    \  }\n}\n```\n\n这个示例是展示如何遍历多维数组循环的最佳方法之一。你将有两个嵌套的循环，每个循环都负责数组中的一个特定维度。对于这一个，第一次进入循环时，它将处理\
    \ `x = 0` 部分，然后它将遍历所有以零开头的数组索引。一旦所有这些索引都被调用，它将把 `x` 递增1。它会完成这个过程，直到所有索引都被调用。\n\
    \n处理数组和循环可以帮助简化你想要编写的一些复杂代码。例如，与其编写一百条语句，你可以设置一个从 1 直到 100 递增1 的循环。数组可以帮助将某些变量存储在一起，而不是让它们分开列出导致代码变得复杂。你甚至可以将数组和循环结合起来，创建一个可以在程序内部运行你所需的各种组合的复杂代码。\n\
    \n# 总结\n\n有时，你需要将某些变量存储在一起。与其在代码中逐个编写它们，你可以将它们放在一个数组中。\n\n数组可以只有一个层级，你也可以添加多个层级来将内容组织在一起。我们只看了两个维度，但你可以根据需要添加任意数量的维度。\n\
    \n数组本身在代码中是强大的，你还可以将它们与循环结合，让程序按照你的意愿重复。\n\n# 第 6 章：Java 内部的函数和方法\n\n当你想要在 Java\
    \ 中创建一个新程序时，函数和方法是非常重要的。方法是你与代码中的对象通信的方式。当你调用一个方法时，我们是在请求对象执行这项任务。我们基本上可以说，方法实现了你对象的行为。\n\
    \n你的每一个每个方法都需要给出一个名称，并且你需要定义输入参数以及返回类型以便其正常工作。设置方法的可见性（包括 `public`、`protected`\
    \ 或 `private`）也是一个好主意。当需要调用方法时，所有这些部分都会发挥作用。\n\n## 使用函数\n\n使用 Java 定义你自己的函数是可能的。在使用这种编程语言时，你会发现你所做的每件事都定义在一个类中，并且所有的类都有方法。所以，如果你想定义一个执行你自己的计算的单元，你需要定义一个类以及该类内部的方法。\n\
    \n在这里我们将查看一个运行原理的示例。请记住，你应该在文本编辑器将其保存为 `F1.java`。\n\n```java\nclass F2 {\n   \
    \ public int addon(int n) {\n        return n+1;\n    }\n}\n```\n\n```java\npublic\
    \ class F1 {\n    public static void main(String[] arg) {\n        F2 x1 = new\
    \ F2();\n        int m = x1.addon(4);\n        System.out.println(m); // prints\
    \ 5\n    }\n}\n```\n\n所以起初这段代码看起来可能有点困惑，你不知道它在发生什么。这里有关于代码中发生了什么以及这些对你意味着什么的更多信息：\n\
    \n- 你在 Java 中创建的代码都将是类的单元。\n- 每个文件都可以定义你需要的任意数量的类。许多初学者假设文件只能定义一个，从而承担了比他们需要的更多的工作。但是，文件名必须与文件中的某个类名相同；不关是哪一个，但它需要与之关联。例如，对于上面的代码，我们将文件命名为\
    \ `F1.java`，它对应我们的 `F1` 类。\n- 你文件中的主类必须有一个名为 `\"main\"` 的方法。这将是程序中开始执行代码的位置。`main`\
    \ 是在上面的示例中的主方法。\n- 你文件中的其他类需要起辅助作用。这就是为什么它们通常被称为子程序或函数。\n- 所以，通过上面的代码，我们创建了一个名为\
    \ `F1` 的主类，然后在 `F2` 内部定义了 `addon` 方法。我们将通过创建它的实例（即 `x1`）来调用这个方法。一旦这个实例被创建，我们就可以调用\
    \ `x1` 方法来为你执行代码的计算。\n\n这是你在 Java 中想要创建许多程序时都会用到的大纲。这比其中一些要复杂一点，因为同时存在两个类，但你创建的程序仍然需要正确的函数到位。\n\
    \nJava 中的这些函数将帮助你调出语言内部所需的某些代码，并确保你在最需要它们时能够获取正确的方法。每个函数的工作方式略有不同，内部包含不同的信息，但它们将遵循与上述列出相同的大纲。\n\
    \n# 总结\n\n在你的代码中创建函数可以通过一个或两个方法来完成。\n\n你需要将文件名命名为代码内部的其中一个函数的相同名称，通常是主函数。\n\n\
    代码内部可以有额外的函数，它们将是辅助函数。\n\n# 第 7 章：类与对象操作\n\n类和对象是任何编程语言工作中的一个重要部分。它们被用于整理代码内部的一些信息，这不仅让编写代码更容易，也让其他程序员阅读代码以及你的程序员执行代码变得更容易。\n\
    \n首先，让我们看看 Java 这种面向对象的编程语言。一些旧版本的编程语言不是基于 OOP（面向对象）公式的。这些语言通常让非程序员对入门感到畏惧，因为它们很难使用。\n\
    \n对于像 Java 这样的 OOP 语言，事情变得更有意义了。对象将世界中的物理对象联系起来，并在你完成工作后它们将保持在那里。\n\n# 什么是对象\n\
    \n首先，我们将花时间谈谈代码中的对象。对象是代码中可以与世界中的物理事物联系的部分。它们将拥有属性，就像世界中的真实对象一样。例如，让我们看看球在其中是如何工作的。\n\
    \n"
