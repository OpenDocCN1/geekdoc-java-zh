    # 总结


    对象（Objects）是你代码的物理部分。它们可以与现实世界中的物品相关联，以便在处理过程中让代码更容易管理。


    类（Classes）将包含各种具有共同点的对象。也许你正在处理海洋生物，但每一种生物都是不同的个体。


    由于 Java 与你的网页密切相关，因此学习编写页面（包括标题和段落）的最佳方法至关重要，这能让视觉效果变得惊艳。


    # 结


    再次感谢你购买本书！


    希望这本书能够帮助你学习更多关于 Java 编程语言的知识，以及如何使用它来编写你自己的代码。即使是初学者，你也可以学习如何在 Java 中工作，这并不困难。当你掌握了本指南中的这些概念时，你就已经准备好投入工作并为你自己的程序编写代码了。


    下一步是下载 Java 程序以及使用该软件时应使用的运行环境，然后开始工作。我们在书中提供了许多示例和练习供你尝试，请打开 Java 环境和文本编辑器并尝试其中的几个。不要害怕尝试各种组合和搭配，看看你如何将它们应用到你脑海中的代码中。实践得越多，就越容易让
    Java 按照你的意愿运行。


    最后，如果你喜欢这本书，我想请你帮个忙，你可以在 Amazon 上给这本书留个评价吗？我将不胜感激！


    感谢，祝你好运！


