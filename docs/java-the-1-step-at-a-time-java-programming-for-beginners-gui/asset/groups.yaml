    ## Integer numbers and floating points


    While working on the Java code, you can expect that there are times integer numbers
    and floating point numbers will be used to store any numerical values inside the
    code. They can also be grouped together. The types of numerical points that are
    recognized inside of Java include:


    - Int (signed integers)

    - Complex (complex numbers)

    - Float (floating real point values)

    - Long (long integers; these could be either octal or hexadecimal)


    ## Operators


    Operators are a useful type of data that will be able to use in much of your code.
    They are simple, but they can open up a lot of possibilities for what you are
    able to do inside of the code. In Java, there are a number of operators that are
    available including:


    - Arithmetic: you can probably guess how the arithmetic operators work. They allow
    you to do mathematical equations with two or more numerical values within your
    code. You are able to add, subtract, multiply and divide your values along with
    a few other options. You will also be able to do multiple signs inside the same
    code, just remember to follow the rules of operation to ensure that you are taking
    care of these numbers correctly.

    - Identity: the identity operator is helpful when you want to compare the memory
    value of two objects, especially when they are located in different places.

    - Assignment: next are the assignment operators. These are the ones that will
    assign a value to the variable you are using. If you would like to put a letter,
    statement, or even number to one of your variables, you would use one of the assignment
    operators.

    - Bitwise: if you would like to go through the operator by bit, you would want
    to use the bitwise operator. This option will go deep into the code, using the
    standard 0 and 1 to look through the code rather than looking at the words and
    numbers that are actually on the screen.

    - Membership: the membership operators are going to be used in your code to see
    there is some kind of coherence, also known as a membership, within the sequence
