    你需要一些让其他阅读代码的人能够理解的属性。


    例如，你可以给对象 `ball`（球）`round`（圆形的）属性，因为这符合逻辑。但如果你给它 `triangle`（三角形）属性，这是不被允许的。属性应该是与对象相符的、有意义的，否则它不能被视为你对象的属性之一。


    在处理对象时，会产生很多想法，虽然其中一些可能是具体的（例如上面使用的球），但另一些可能更抽象一些，正如你已经从书中写的一些代码中注意到的那样。将对象与我们世界的真实物品联系起来是设计代码更好的方法，这种方法可以确保代码保持整体并让初学者更容易学习，这也是使用这种语言的好处之一。


    ## 什么是类


    类将与对象一起工作。它们负责持有各种对象以帮助代码的组织有序。但是，你的类不仅仅是存放一些随机的对象；相反，它们负责将相互相关的对象聚集在一起。


    类中的对象并不非要完全相同。你可以创建一个包含圆球以及它所有允许内容的类，但为运动设备创建一个类同样可行。后者不仅包括圆球，还包括冰球棒、冰球、头盔、制服、跨栏、足球等其他物品。


    类中的项目需要属于同一个类别，它们不需要像上面插的那样完全一样。如果在一个类中将对象放在一起是有意义的，请确保将它们放在同一个类中。这可以帮助你在程序需要时调出正确的内容，并让代码之前更有组织性。


    ## 构建类的框架


    在你的类框架中，你应该包含一些内容。这些内容将帮助程序正常运行，并确保你能够在需要它工作时随时调用该类。你应该在框架内部包含的内容包括：


    - 程序类型。你需要使用 `UNICODE` 声明来描述程序类型。

    - 程序信息将在文中提供。你应该使用 `<HEAD>` 和 `</HEAD>` 符号来包围这些程序信息。

    - Java 程序部分将以类似的描述，但符号是 `<Java>` 和 `</Java>`。

    - 标题应该在开头，位于文本 `<TITLE>` 和 `</TITLE>` 之中。

    - 你在 `<<h1>>` 和 `</<h1>>` 之间看到的文本将是标题。如果你想显示多个标题，只需要更改标题编号，例如使用 `H2`、`H3`、`H4`
    等。

    - 程序的内容，或者你在屏幕上看到的信息将位于符号 `<BODY>` 和 `</BODY>` 之间。

    - 如果你想创建一个段落，请在 `<p>` 和 `</p>` 之间编写文本。


    ## 将这些类转换为页面


    在 Java 中创建类的最终目标是将它们转换为网站的页面。你希望能够写出想要使用的新页面，例如网站和博客的页面，以便它们在网上完全按照你需要的方式运行。下面是你如何利用你的类并让它们形成如下示例：


    ```html

    <!UNICODE Java>

    <Java>

    <body>


    <h1> Welcome to the Web!</h1>


    <p> My first page </p>


    </body>

    </Java>

    ```


    这个示例将帮助你在类中写出你想要的页面。你可以创建任何任何想要的页眉，例如“Welcome to My Page”（欢迎来到我的页面），然后根据你的意愿填充段落；某些页面可能很基础，上面包含一些关于你卖什么的信息，而另一些页面（例如当你正在制作博客页面时）可以填充得更完整。


    ## 创建标题


    在你的类内部，你需要制作一些良好的标题。这些标题有助于页面看起来更有吸引力，并确保其他人知道流程的某一部分。如果你想将类中的信息拆分而不是只有行文本，你也可以添加一些较小的子标题。


    在 Java 内部，标题范围从 `<h1>` 到 `<h6>`，所以请根据需要使用它们。将它们放入你的系统中是基础的。你只需要使用以下语法，如果你想在每个标题之间添加内容，可以将其添加到段落信息中：


    ```html

    <h1> Look at my heading </h1>

    <h2> Today is a beautiful day </h2>

    <h3> Tomorrow I have no plans </h3>

    ```


    你可以一直保持这种模式，直到第六级标题。你会发现，当你执行这些内容时，它们将以自己的页面形式显示，这样它们处于自己的区域内会更容易。你可以添加更多单词，例如段落，来展示你想展示的信息。


    看待这一点的一种好方法是参考博客文章。你会在开头设置一个标题来解释信息是关于什么的。你可以在添加新标题之前写几行字，并添加任意数量的子标题。在每个标题之间，


    ## 段落


    完成后，确保记录下关于你希望类或页面看起来像什么样的笔记，并在编写时记住这一点。


    为了保持良好的在线状态，请确保使用 `<p>` 和 `</p>` 符号创建段落。这完全取决于你想在页面上的内容。


    ## 使用类添加图像


    为了让你的页面脱颖而出，你只需要使用 `<img>` 标签包裹图片。


    ## 添加链接


    如果你想突出你的观点，`<a>` 标签是实现此点的正确方法。这是一个 Java 中使用链接的示例：`<a href="https://google.com">See
    this link</a>`


    ## 添加引用


    添加引用是丰富页面的好方法。它为你的读者增加了价值，也是展示观点的最好方法之一。当你想要添加引用时可以使用以下标签：


    - `<blockquote>`：这将告诉程序正在添加引用。

    - `<cite>`：这将归属于页面主题标题。

    - `<blockquote>`：这意味着你引用了来自外部来源。

    - `<bdo>`：声明程序应该执行文本方向。

    - `<address>`：这是联系信息。

    - `<abbr>`：显示使用了缩写或首字母词。


    你可以使用这些来写任何你想要的引用。你可以使用它们来写简短的一行引用，也可以写由于很长而占据几页的引用。只需确保链接回原始来源，以显示你写作的诚实。


    在 Java 中正确创建你的类是非常重要的，如果你想创建一个让其他人想要访问的页面。如果方向错误，漏掉了标题或类中的不同部分，将让你很难让页面看起来美观。


