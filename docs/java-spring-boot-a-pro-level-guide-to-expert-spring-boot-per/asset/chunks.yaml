    # Java Application Example


    For Java-based applications, including those developed with Spring Boot, vertical
    scaling can be achieved by modifying `JVM` settings to increase memory allocation:


    ![](image_rsrc2FT.jpg)


    This command adjusts the `JVM`’s heap settings to allow for greater memory capacity,
