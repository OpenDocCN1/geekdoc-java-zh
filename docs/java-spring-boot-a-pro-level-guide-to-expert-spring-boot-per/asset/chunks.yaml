    ## 自定义指标的最佳实践


    在部署自定义指标时，请考虑以下最佳实践，以确保它们能够提供有意义的见解，且不对应用性能产生负面影响：


    - **有目的测量**：专注于提供重要见解的指标。过量的数据可能会变得繁琐并分散重要的发现。

    - **优化标签使用**：虽然标签对详细分析很有帮助，但过度标记会导致高基数（high cardinality）问题，可能降低数据库性能。

    - **持续评估指标**：定期重新评估和完善指标，以适应不断变化的应用功能和业务目标。


