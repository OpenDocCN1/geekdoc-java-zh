  \        selectionSortObjects(objArr);\n42                 stop = System.nanoTime();\n\
  43             }\n44             else { // choice == 3, probably\n45           \
  \      testDescription = \"Integer objects using Arrays.sort()\";\n46          \
  \       start = System.nanoTime();\n47                 Arrays.sort(objArr);\n48\
  \                 stop = System.nanoTime();\n49             }\n50             elapsed\
  \ = (stop-start)/1000000;\n51 \n52             if ( elapsed < fastest ) {\n53  \
  \               fastest = elapsed;\n54             }\n55             if ( elapsed\
  \ > slowest ) {\n56                 slowest = elapsed;\n57             }\n58   \
