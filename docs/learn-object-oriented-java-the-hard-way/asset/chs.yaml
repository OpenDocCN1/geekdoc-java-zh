  \ 将此称为“包装”（wrapper）类，因为它是一个包裹在原始类型上的非常薄的层。\n\n## 练习 21：泛型与强制转换\n\n在之前的两个练习中，你`finally`\
  \ 终于学会了 Java 中原始数据类型（如 `int` 和 `double`）与引用/对象类型之间的区别。\n\n现在我可以告诉你们一个秘密：`ArrayLists`\
  \ `only` 可以持有引用。在代码中输入，然后我们来讨论细节。\n\n```\n 1 import java.util.ArrayList;\n 2 \n\
  \ 3 public class GenericsVsCasts {\n 4 \n 5     @SuppressWarnings(\"unchecked\"\
  )\n 6     public static void main(String[] args) {\n 7         ArrayList objarr\
  \ = new ArrayList();\n 8 \n 9         objarr.add(\"one\");\n10         objarr.add(\"\
  two\");\n11 \n12         Object aa = objarr.get(0);\n13         Object bb = objarr.get(1);\n\
  14 \n15         // String qq = objarr.get(0); // won't work\n16         // String\
