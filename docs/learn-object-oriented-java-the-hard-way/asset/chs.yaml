  32     }\n33 }\n```\n\nGenericsVsCasts.java\n\n第 5 行是一个被称为“annotation”（注解）。在这种情况下，它是告诉编译器不要显示关于该类\
  \ `main()` 方法中“未检查或不安全操作”的警告。如果没有这个注解，代码也可以编译，但这个警告让我很困扰。\n\n它警告我，在泛型存在的情况下用旧方法处理\
  \ `ArrayLists` 是不安全的。\n\n当你发现持有原始整数的 `ArrayList` 运行太慢时，Java 增加了“自动装箱”（autoboxing），这意味着\
  \ Java 现在会自动将 `int` 转换为 `Integer` 对象。\n\n同样，Java 现在也有“自动拆箱”（unboxing），这样像第 39 行所示的从\
  \ `Integer` 对象获取 `int` 值的方法是可行的。\n\n在第 45 和 46 行中，我们可以直接将 `int` 添加到 `ArrayList`。这很方便，但最好记住：从\
  \ `ArrayList` 中获取原始值会产生额外的工作。\n\n泛型允许你创建一个对象类型是可变的结构。\n\n我应该先解释一下 `Object` 是什么。在\
  \ Java 中，*每一个*对象都继承自一个名为 `Object` 的特殊类。\n\n\n\n我们将在稍后的练习中详细讨论继承，但基本思想是：Java 中*所有*不是基本类型的类型都是一个\
  \ Object（对象）。\n\n*   `String` 是 Object。\n*   `Scanner` 是 Object。\n*   `Integer`\
  \ 是 Object（但 `int` 不是；那些是基本类型）。\n*   *你*创建的任何类都是 Object。\n\n因此，类型为 `Object` 的变量（例如第\
  \ 12 行的 `aa`）持有一个引用，就像 Java 中其他非基本类型变量一样。但 `aa` 可以持有指向*任何*类型对象的引用。\n\n## 无泛型型\n\n\
  `main()` 中的第一行代码创建了一个名为 `objarr` 的 `ArrayList`，但它*没有*告诉程序应该持有什么种类型的引用。因此，这个 `ArrayList`\
  \ 可以持有指向对象的引用。可以是*任何* Object。\n\n在第 9 行和第 10 行，我们可以向列表添加两个 String 的引用，因为 `objarr`\
  \ 可以持有指向对象的引用，而 `String` 也是 Object。\n\n在第 12 行和第 13 行，我们获取了这两个引用，并将它们的副本存储到名为 `aa`\
  \ 和 `bb` 的两个 Object 变量中。\n\n让我们停一下来看目前的符号表和 `ArrayList`：\n\n| identifier | address\
  \ | type | initialized? |\n| --- | --- | --- | --- |\n| objarr | `@12a020b0` | 指向对象\
  \ `ArrayList` 的引用 | yes |\n| aa | `@12a020a8` | 指向 `Object` 的引用 | yes |\n| bb |\
  \ `@12a020a0` | 指向 `Object` 的引用 | yes |\n\n`ArrayList` `objarr`:\n\n| 0 | 1 |\n\
  | --- | --- |\n| @a58 | @980 |\n\n在这个虚构的示例中，String 字面量 `\"one\"` 存储在堆上的引用 `@a58`，String\
  \ 字面量 `\"two\"` 位于引用 `@980`。\n\n好了，现在看栈：\n\n| …20b0 | …20a8 | …20a0 |\n| --- | ---\
  \ | --- |\n| @f98 | @a58 | @980 |\n\n我们可以看到，变量 `aa`（类型为 `Object`）持有引用 `@a58`。Object\
  \ 变量 `bb` 持有 `@980`。\n\n`@a58` 是指向 String “one”的引用。`@980` 是指向 String “two”的引用。但第\
  \ 15 行和第 16 行的代码*无法*编译。尽管 `objarr.get(0)` 存储的引用*确实*是指向 `String` 的引用，但该信息已经丢失了。编译器只能确定\
  \ `objarr` 包含指向 `Object` 的引用，而不是所有的 Object 都是 String。\n\n因此，在 Java 有泛型之前的时代，我们必须使用“强制转换（cast）”来解决编译器信息的缺失。这在第\
  \ 18 行和第 19 行中得到了体现。\n\n从列表中出来的是一个 `Object` 引用，但我们知道它*实际上*不是任意 Object，而是一个指向 *String*\
  \ 的引用。我们知道这一点是因为我们最初把 String 放在那里的！\n\n所以 `(String)` 是一个“强制转换”（括号是有意义且是必须的）。它告诉编译器：“我知道你认为那个引用只是一个\
  \ `Object`，但我向你保证它*实际上*是一个指向 `String` 的引用。让它通过吧。”\n\n即使它们*不是*指向 String 的引用，这段代码也可以通过编译。但如果我们错误地尝试将引用强制转换为错误的类型，强制转换将在程序运行时“奔溃”。（具体来说，它会抛出\
  \ `ClassCastException`。你将在学习练习中尝试这一点。）\n\n### 有泛型\n\n在第 24 行，我们创建了第二个 `ArrayList`。但多亏泛型，我们可以指定它是指向\
  \ String 引用的 `ArrayList`。\n\n（如果你愿意，可以在第二组角括号内放入 `String`，但这是可选的。尽管*我*经常把它放在那里，因为我会忘记可以不写它。）\n\
  \n在第 25 行和第 26 行之后，符号表看起来没有太大区别：\n\n| identifier | address | type | initialized?\
  \ |\n| --- | --- | --- | --- |\n| objarr | `@12a020b0` | 指向对象 `ArrayList` 的引用 |\
  \ yes |\n| aa | `@12a020a8` | 指向 `Object` 的引用 | yes |\n| bb | `@12a020a0` | 指向 `Object`\
  \ 的引用 | yes |\n| strarr | `@12a02098` | 指向 String `ArrayList` 的引用 | yes |\n\n以及\
  \ `ArrayList` `strarr`:\n\n| 0 | 1 |\n| --- | --- |\n| @a58 | @980 |\n\n和以前一样，列表持有两个\
  \ String 字面量的引用。但这次，编译器*知道*它们是指向 String 的引用，而不仅仅是 Object。\n\n无论如何，既然编译器可以确定从 `strarr`\
  \ 中出来的是 String ，第 28 行和第 29 行运行正常，不需要强制转换。\n\n此外！由于 String 是 Object，第 33 行和第 34\
  \ 行也运行正常。变量 `a` 可以持有指向*任何* Object 的引用，包括从 `ArrayList` 中获取的 String 引用。\n\n\n\n…合并成一个大文件。我选择这些小说是因为它们很长，得益于优秀的\
  \ [古腾登堡计划](https://www.gutenberg.org/) 很容易获得，而且——最重要的是——它们现在都属于公有领域。\n\n使用不同的源材料，你可能会得到略有不同的结果。\n\
  \n我已经回到了创建对象和驱动程序，所以你仍然输入以下文件以使程序运行。\n\n```\n 1 import java.io.FileInputStream;\n\
  \ 2 \n 3 public class IBeforeEDriver {\n 4     public static void main( String[]\
  \ args ) throws Exception {\n 5         FileInputStream file = new FileInputStream(\"\
  datafiles/en-sample.txt\");\n 6         IBeforeEChecker check = new IBeforeEChecker(\
  \ file );\n 7         System.out.println( check.getWordCount() + \" ie/ei words\
  \ found.\" );\n 8         System.out.print( \"\\t\" + check.getMatches() + \" match\
  \ the rule, \" );\n 9         System.out.print( check.getExceptions() + \" do not:\
