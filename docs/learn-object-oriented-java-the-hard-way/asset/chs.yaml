  \ Graham Mitchell。\n\n## 练习 0：设置\n\n这个练习没有代码但**不要跳过**。它将帮助你安装一个良好的文本编辑器并安装 Java\
  \ 开发工具包 (JDK)。如果你没有完成这两项任务，你无法完成书中任何其他练习。你应该尽可能准确遵循这些指令。\n\n无论你使用什么类型的系统，你都要做三件事：\n\
  \n1.  安装一个用于编写代码良好的文本编辑器。\n2.  弄清楚如何打开终端窗口以便输入命令。\n3.  安装 JDK。\n\n    而且在 Windows\
  \ 上，你还需要做第四件事：\n\n4.  将 JDK 添加到系统 PATH。\n\n（JDK 命令在 Apple 电脑和 Linux 计算机会自动添加到 PATH。）\n\
  \n\n\n\n\n我在下方提供了针对 Windows 的说明，然后是 Mac OS，最后是 Linux。请直接跳转到你偏好的操作系统部分。\n\n## Windows\n\
  \n### 安装一个好用的文本编辑器 (Notepad++)\n\n1. 使用网络浏览器访问 [notepad-plus-plus.org](http://notepad-plus-plus.org/)，下载最新版本的\
  \ `Notepad++` 文本编辑器并安装。执行此操作不需要管理员权限。\n\n2. 一旦安装了 `Notepad++`，我总是会运行它并关闭“自动完成（Auto-Completion）”，因为它对初学者没有好处。（对我个人来说也很烦人）。打开“设置（Settings）”菜单并选择“首选项（Preferences）”。然后点击左侧列表中间部分的“自动完成（Auto-Completion）”。最后取消勾选“每次输入时启用自动完成（Enable\
  \ auto-completion on each input）”旁边的复框，然后点击“关闭（Close）”按钮。\n\n3. 最后在 `Notepad++`\
  \ 运行时，右键点击 Windows 任务栏上的 `Notepad++` 按钮，点击“将此程序固定到任务栏（Pin this program to taskbar）”。这将方便以后在编程时启动\
  \ `Notepad++`。\n\n### 打开终端窗口 (PowerShell)\n\n1. 点击开始按钮打开开始菜单。（在 Windows 8 及更高版本中，你可以通过按\
  \ Windows 键 + `S` 直接打开搜索框）。在搜索框中输入“powershell”。\n\n2. 从结果列表中选择“Windows PowerShell”。\n\
  \n3. 右键点击任务栏上的 `PowerShell` 按钮并选择“将此程序固定到任务栏”。\n\n4. 在 `Powershell/Terminal` 窗口中，输入\n\
  \n``````\njavac\n```````\n你可能会看到一行红色的错误信息，内容类似于“The term ‘javac’ is not recognized\
  \ as the name of a cmdlet....”\n\n这意味着 JDK 没有安装并添加到 `PATH` 中，这正是我们目前预期的结果。\n\n##\
  \ 安装 Java 开发工具包 (JDK)\n\n1. 使用网络浏览器访问 [Oracle Java SE 下载页面](http://www.oracle.com/technetwork/java/javase/downloads/index.html)。\n\
  \n2. 点击左侧顶部附近巨大的“Java”按钮来下载 Java 平台 (`JDK`) `8u102`。点击此将带你进入标题为“Java SE Development\
  \ Kit 8 Downloads”的页面。\n\n3. 在此页面上，你需要接受许可协议，然后选择列表底部附近的“Windows x86”版本。下载 `8u102`\
  \ 版本或任何更高版本的文件。\n\n   如果你确定运行的是 64 位的 Windows，那么下载 `JDK` 的“Windows x64”版本也是可以的。如果你不确定，应该下载“x86”（即\
  \ 32 位）版本，因为该版本可以同时运行在 32 位和 64 位的 Windows 上。\n\n   你*不需要*下载“Demos and Samples（演示与示例）”。\n\
  \n4. 下载完成后，运行 `jdk-8u102-windows-i586.exe` 进行安装。在你第一次点击“Next >）”后，你会看到一个显示 `Install\
  \ to: C:\\Program Files (x86)\\Java\\jdk1.8.0_102\\` 或类似内容的屏幕。请记下这个位置；你很快就会需要它。\n\
  \n5. 只需一直点击“Next（下一步）”直到全部完成。除非你*真的*知道自己在做什么，否则最好的办法可能就是让安装程序按它的意图运行。\n\n## 将 JDK\
  \ 添加到 PATH\n\n1. 现在既然已经安装了 `JDK`，你需要找到安装所在文件夹的*确切*名称。查看 `C:` 盘下的 `Program Files`\
  \ 文件夹，如果有的话查看 `C:\\Program Files (x86)` 文件夹。你正在寻找一个名为 `Java` 的文件夹。里面有一个名为 `jdk1.8.0_102`\
  \ 的文件夹，它里面还有一个名为 `bin` 的文件夹。文件夹名称*必须*包含 `jdk1.8`；`jre8` 是不一样的。确保有一个 `bin` 文件夹。\n\
  \n2. 当你进入 `bin` 文件夹后，可以左键点击上方文件夹的位置栏，它会变成类似 `C:\\Program Files (x86)\\Java\\jdk1.8.0_102\\\
  bin` 的内容。你可以把它记下来，或者选中并右键复制到剪贴板。\n\n3. 一旦 `JDK` 安装完成且你知道了该位置，打开你的终端窗口（PowerShell）。在\
  \ `PowerShell` 中，输入以下内容：\n\n``````\n<<(code/set-environ-var-8u102.txt)\n```````\n\
  \n不过请将其写在同一行。即：\n\n输入或粘贴 `[Environment]::SetEnvironmentVariable(\"Path\", \"$env:Path;`\n\
  \n先不要按回车。你可以通过右键粘贴到 `PowerShell`。\n\n然后输入或粘贴上面的文件夹位置。如果你安装的是 x86 (32 位) 版本 `JDK`\
  \ `8u102`，它应该是：\n\n`C:\\Program Files (x86)\\Java\\jdk1.8.0_102\\bin`\n\n（仍然不要按回车。）\n\
  \n然后在末尾添加 `\", \"User\")`。最后，按 `ENTER`。\n\n如果你遇到错误，说明你输入的内容不对。你可以按向上方向键找回命令，并使用左右方向键查找并修复错误，然后再次按\
  \ `ENTER`。\n\n如果 `SetEnvironmentVariable` 命令完成且没有报错，输入 `exit` 关闭 PowerShell 窗口。**如果不关闭\
  \ PowerShell 窗口，你做的更改将不会生效。**\n\n## 确保 JDK 安装正确\n\n1. 再次启动 `PowerShell`。\n\n2. 在提示符后输入\
  \ `javac -version`。\n\n你应该能看到类似 `javac 1.8.0_102` 的响应。\n\n1. 在提示符后输入 `java -version`。\n\
  \n你应该能看到类似 `java version \"1.8.0_102\"` 的响应。\n\n确保它们报告的版本号相同！如果没有，你可能安装了两个不同的（不兼容的）Java\
  \ 版本，这将导致你无法完成书中的练习。\n\n如果版本号不匹配，进入控制面板并添加/程序。移除所有与 Java 相关的程序、`JDK`、`JRE`。如果安装了\
  \ Eclipse 也将其移除。移除*所有* Java 相关内容并重新开始。\n\n*但是*，如果两个命令都正常工作、没有报错且版本号一致，那么恭喜你！\n\n\
  ### 在命令行 (PowerShell) 中导航\n\n你应该创建一个新文件夹来存放你的代码。完成这本书后，你将会有至少 100 个新文件。\n\n\n\n\n\
  \n> 如果你想操作得高级一点，就不需要使用鼠标切换回终端；你只需要在 Windows 或 Linux 上按下 `Alt + Tab`，或者在 Mac 上按下\
  \ `Command + Tab` 即可切换应用程序。\n\n> \n\n> 按住 `Alt` 键不要松开。然后按下并释放一次 `Tab` 键。在继续按住 `Alt`\
  \ 键的同时，多次按下 `Tab` 直到选中你的终端窗口，然后松开 `Alt` 键完成切换。\n\n> \n\n> 如果你只是快速按下 `Alt+Tab` 并立即松开两个键，它通常会带你回到上一个应用程序。我*经常*这样做。当我在文本编辑器中时，按下\
  \ `Alt+Tab` 返回终端，当我在终端完成工作后，我再次按下 `Alt+Tab` 回到文本编辑器。一旦习惯了，这非常快。\n\n你应该直接跳到本章的底部阅读“给初者的警告”，否则，你已经完成了设置，并准备好在\
  \ Windows 上开始练习 01 了！干得好。\n\n| � |\n\n### Mac OS X\n\n#### 安装一个好用的文本编辑器 (TextWrangler)\n\
  \n1.  使用浏览器访问 [barebones.com](http://www.barebones.com/products/textwrangler/)。下载\
  \ TextWrangler 版本 `5.0` 或更高版本的磁盘映像。\n\n2.  运行磁盘映像，然后打开“应用程序”（Applications）文件夹，并按照指示将图标拖到其中。你可能需要管理员用户名和密码进行验证。\n\
  \n3.  安装完成后，启动 TextWrangler，如果它没有自动出现在 Dock 栏中，请手动将它添加。\n\n#### 打开终端窗口 (Terminal)\n\
  \n1.  最小化 TextWrangler 并切换到 Finder。使用搜索（Spotlight）开始搜索“terminal”。这会打开一个小的 bash 终端。\n\
  \n2.  同样将你的 `Terminal` 放入 Dock 栏中。\n\n3.  在 `Terminal` 窗口中，输入\n\n```bash\njavac\n\
  ```\n\n你可能会收到一个错误提示，告诉 `javac` 是一个未知命令。（欢迎通过邮件给我发送错误信息的截图，我可以更新这一段内容。）\n\n这仅仅意味着尚未安装\
