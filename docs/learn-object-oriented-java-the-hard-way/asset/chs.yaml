  ## 练习 1：操作对象\n\n无法避免的是，Java 是一种面向对象的语言。在原版的《Java 径之路》（Learn Java the Hard Way）中，我尝试尽可能避免\
  \ Java 中面向对象的部分，但某些部分还是溜了！\n\n在本章中，我们将观察 Java 在创建和操作对象时使用的一些常用模式，我还会简要回顾如何从命令提示符或终端窗口编译并执行\
  \ Java 程序。\n\n将以下代码输入到名为 `WorkingWithObjects.java` 的单个文件中，并将其放入你可以从终端窗口访问的文件夹中。\n\
  \n如果其中某些内容让你感到陌生，不要担心。我们只是在观察模式，细节在这个作业中并不那么重要。特别是，你可能从未用过 `ArrayList` 或 `Random`，这完全没关系。\n\
  \n如果你觉得这段代码*极其*难以理解，那么你可能遇到了问题。也许你不知道什么是 `if` 语句，或者 `System.out.println`，或者你从未用过\
  \ `for` 循环。在这种情况下，这本书对你来说可能太难了。你应该回去先读一本更简单的书，等当你对 Java 基础非常熟悉后再回到这里。\n\n无论如何，输入下面的代码，然后我会提醒你如何从终端编译它。记住，对于这些练习你不应该使用任何\
  \ IDE。还要记住不要输入每行前面的行号；那些数字是为了方便以后讨论代码。\n\n```\nimport java.io.File;\nimport java.util.ArrayList;\n\
  import java.util.Random;\nimport java.util.Scanner;\n\npublic class WorkingWithObjects\
  \ {\n    public static void main( String[] args ) throws Exception {\n        File\
  \ f = new File(\"datafiles/phonetic-alphabet.txt\");\n\n        if ( f.exists()\
  \ == false ) {\n            System.out.println( f.getName() + \" not found in this\
  \ folder. :(\");\n            System.exit(1);\n        }\n\n        ArrayList<String>\
  \ words = new ArrayList<String>();\n        Scanner alpha = new Scanner(f);\n\n\
  \        System.out.print(\"Reading words from \\\"\" + f.getPath() + \"\\\"...\
  \ \");\n        while ( alpha.hasNext() ) {\n            String w = alpha.next();\n\
  \            words.add(w);\n        }\n        alpha.close();\n        System.out.print(\"\
  done.\\n\\t\");\n\n        Random rng = new Random();\n        rng.setSeed(12345);\n\
  \        // rng.setSeed(23213);\n\n        for ( int n=0; n<3; n++ ) {\n       \
  \     int i = rng.nextInt( words.size() );\n            String s = words.get(i);\n\
  \            System.out.print( s.toLowerCase() + \" \" );\n        }\n        System.out.println();\n\
  \    }\n}\n```\n\n`WorkingWithObjects.java`\n\n一旦你输入了代码，我假设你已经将 `WorkingWithObjects.java`\
  \ 文件保存到了名为 `javahard2` 的文件夹中。如果你将其保存到了不同的文件夹，请替换下面的名称。\n\n打开终端窗口并进入到 `javahard2`\
  \ 文件夹：\n\n（如果你在使用没有 PowerShell 的非常老旧的 Windows 版本，那么你必须输入 `dir`。不过其他人都可以输入 `ls`。）\n\
  \n希望你会看到一个包含内容的输出列表：\n\n这意味着你处于正确的路径。然后，你将使用 Java 编译器（称为 `javac`）来编译该文件：\n\n如果此命令给出关于\
  \ `javac` 本身的错误，那么你跳过了练习 0！回去确保 JDK 已安装并在 `PATH` 路径中，然后回来！\n\n假设你注意细节并按照我告诉你的那样操作，此命令将运行几秒钟，然后终端将再次显示提示符，而不显示其他任何内容。\n\
  \n然而，如果你犯了错误，你将看到一些错误。如果你有任何错误消息，修复它们，然后`save` 你的代码，回到终端再次编译。\n\n最终你应该能够成功，它将会在没有任何错误也没有任何消息的情况下完成编译。执行目录列表操作，你应该看到字节码文件出现在代码旁边的文件夹中：\n\
  \n现在我们已经成功创建了字节码文件，可以通过运行名为 `java` 的 Java 虚拟机（JVM）程序来运行（或“执行”）它：\n\n### 你应该看到的内容\n\
  \n好了，既然*那个*已经运行了，让我们谈谈在这个练习中看到的一些模式。\n\n第 1 行导入了一个“库”。`java.io.File` 包含了名为 `File`\
  \ 的对象/类的定义。一旦导入了它，我们就可以在代码中创建 `File` 对象并调用这些对象内部定义的方法。\n\n接三行导入了另外三个库，每个库都定义了一个对象。某些编程语言将这些导入的内容称为“模块”而不是库。\n\
  \n\n\n\n在上一章中，我们从 Java 的“标准库”中导入了一些对象：这些由语言创建者预构建的类和方法的集合。\n\n在本章中，我们将创建自己的对象，每个对象将包含一个方法。\n\
  \n请输入以下代码并使其通过编译。将其保存在你的 `javahard2` 文件夹中，命名为 `OldMacDonald.java`。\n\n```\n 1 class\
  \ Cow {\n 2     public void moo() {\n 3         System.out.println(\"Cow says moo.\"\
  );\n 4     }\n 5 }\n 6 \n 7 class Pig {\n 8     public void oink() {\n 9       \
  \  System.out.println(\"Pig says oink.\");\n10     }\n11 }\n12 \n13 class Duck {\n\
  14     public void quack() {\n15         System.out.println(\"Duck says quack.\"\
  );\n16     }\n17 }\n18 \n19 public class OldMacDonald {\n20     public static void\
  \ main( String[] args ) {\n21 \n22         Cow maudine = new Cow();\n23        \
  \ Cow pauline = new Cow();\n24         maudine.moo();\n25         pauline.moo();\n\
  26 \n27         Pig snowball = new Pig();\n28         snowball.oink();\n29     \
  \    snowball.oink();\n30 \n31         Duck ferdinand = new Duck();\n32        \
  \ ferdinand.quack();\n33     }\n34 }\n```\n\n`OldMacDonald.java`\n\n### 你应该看到什么\n\
  \n第 1-5 行定义了一个名为 `Cow` 的对象。`Cow` 类的定义包含了名为 `moo()` 的方法定义。注意第 2 行写的是 `public void\
  \ moo()`，而不是 `public static void moo()`。除了 `main()` 之外，你将不再频繁使用 `static` 关键字了。\n\
  \n第 7 到第 11 行定义了一个名为 `Pig` 的类，包含一个 `oink()` 方法。第 13 到 17 行定义了一个名为 `Duck` 的类，它包含一个\
  \ `quack()` 方法。\n\n第 19 到 34 行定义了与 Java 文件名匹配的类。注意在该文件中，`OldMacDonald` 类前面带有 `public`\
  \ 关键字，但其他任何类都没有。在 Java 中，每个文件只能有一个公共类，且该公有类的名称必须与文件名匹配。\n\n该类包含 `main()` 方法，这是 Java\
  \ 虚拟机执行文件时开始运行的地方。`OldMacDonald` 类列在文件中其他类之后，但如果类的顺序不同，运行效果也是那样的。\n\n当我们运行这个程序时，执行从\
  \ `main()` 方法的第一行开始。文件中的任何其他代码只有在从 `main()` 内部调用时才会执行。\n\n第 22 和 23 行实例化两个 `Cow`\
  \ 对象。分别调用 `moo()` 方法。这会导致执行跳转到第 3 行，运行方法内部的 `println()` 语句，然后返回下方。\n\n在第 27 行，我们创建了一个\
  \ `Pig` 对象的实例，然后调用了两次它的 `oink()` 方法。在第 31 行，我们实例化了一个 `Duck` 对象并在下一行调用了它的唯一方法。\n\n\
  然后在第 33 行，我们遇到了 `main()` 方法的右大括号，这通常意味着程序的结束。\n\n你看到了吗？定义你自己的对象并不难，一旦你实例化了一个对象，调用它们的方法也非常简单。\n\
  \n## 练习 3：在单独文件中定义对象\n\n在上一个练习中，我们定义了三个对象（如果算上包含 `main()` 的那个就是四个），但它们都实现在同一个文件中。这通常不是标准做法。通常\
  \ Java 将每个类的实现放在它自己的文件中，然后会有另一个文件只持有 `main()` 方法，用于实例化对象并让它们运行。这个类通常被称为“驱动”（driver）类，因此通常我会在文件名中加入“Driver”一词。\n\
  \n输入以下代码，并将每个类放在单独的文件中，命名所示。将它们全部保存在同一个文件夹中。\n\n```\n1 public class OldMacCow {\n\
  2     public void moo() {\n3         System.out.println(\"Cow still says moo.\"\
  );\n4     }\n5 }\n```\n\n`OldMacCow.java`\n\n在你输入并保存 `OldMacCow.java` 之后，你应该尝试编译它，以确保在继续之前没有犯任何错误。\n\
  \n```\n1 public class OldMacDuck {\n2     public void quack() {\n3         System.out.println(\"\
  Duck still says quack.\");\n4     }\n5 }\n```\n\n`OldMacDuck.java`\n\n你是否不小心尝试运行了这个文件或第一个文件？它们一个都不包含\
  \ `main()` 方法，因此单独运行它们是行不起的。\n\n```\n 1 public class OldMacDriver {\n 2     public\
  \ static void main( String[] args ) {\n 3         OldMacCow maudine = new OldMacCow();\n\
  \ 4         OldMacCow pauline = new OldMacCow();\n 5         maudine.moo();\n 6\
  \         pauline.moo();\n 7 \n 8         OldMacDuck ferdinand = new OldMacDuck();\n\
  \ 9         ferdinand.quack();\n10     }\n11 }\n```\n\n`OldMacDriver.java`\n\n\n\
  \n\n到目前为止，我们只查看了对象内部的方法。但大多数对象内部也包含变量，这些变量被称为“字段”（有时称为“实例变量”）。\n\n此程序将演示如何访问对象中的字段。\n\
  \n输入此代码并将其保存为独立文件，文件名按指示所示。\n\n```\n1 public class TVActor {\n2     String name;\n\
  3     String role;\n4 }\n```\n\n`TVActor.java`\n\n然后输入这段代码并将其保存到与第一个文件相同的文件夹中。\n\
  \n```\n 1 public class TVActorDriver {\n 2     public static void main( String[]\
  \ args ) {\n 3         TVActor a = new TVActor();\n 4         a.name = \"Thomas\
  \ Middleditch\";\n 5         a.role = \"Richard Hendricks\";\n 6 \n 7         TVActor\
  \ b = new TVActor();\n 8         b.name = \"Martin Starr\";\n 9         b.role =\
  \ \"Bertram Gilfoyle\";\n10 \n11         TVActor c = new TVActor();\n12        \
  \ c.name = \"Kumail Nanjiani\";\n13         c.role = \"Dinesh Chugtai\";\n14 \n\
  15         System.out.println( a.name + \" played \" + a.role );\n16         System.out.println(\
  \ b.name + \" played \" + b.role );\n17         System.out.println( c.name + \"\
  \ played \" + c.role );\n18     }\n19 }\n```\n\n`TVActorDriver.java`\n\n记住，你`只需要`\
  \ 编译包含 `main()` 方法的那个文件，尽管在完成每个文件后都测试编译每个文件是一个好主意，以确保在继续之前它是正确的。\n\n### 你应该看到的内容\n\
