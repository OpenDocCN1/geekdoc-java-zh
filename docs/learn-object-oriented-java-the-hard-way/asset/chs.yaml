  \n在本次练习中，我们将观察处理大量原生类型与大量对象 之间的相对速度。\n\n而且在好几个练习中的第一次，你只需要输入一个文件！\n\n\n\n\n内部第一个块是另一个循环，它从\
  \ 0 到 999 随机选取 20,000 个数字，并将副本存储到每个数组中。\n\n然后，根据所选择的选项，我们为测试设置适当的描述，启动计时器，运行指定的排序，然后停止计时器。\n\
  \n单次测试运行后（假设我们已经不再处于预热阶段），我们会检查这次运行是否比我们之前的获胜者快，或者是否比我们之前最慢的运行慢。\n\n这结束了我们的主外层循环，因此在所有测试完成后，我们只需打印出详情。\n\
  \n下面是两个函数（也称为“静态方法”）。它们几乎完全相同，区别在于一个必须使用 `.compareTo()`，而临时交换变量是一个 `Integer`。\n\n\
  ### 关于效率\n\n你可以看到，在同等的情况下，Java 处理原生 `int` 的速度比处理 `Integer` 对象快一点。在我的电脑上，基本类型的速度大约是后者的“两倍”。在编写处理**大量**值的代码时，请记住这一点。\n\
  \n但是！不要被欺骗了！真正的启示是，即使使用对象和我我自己写的一个糟糕的平方时间排序算法，我的机器也能在不到六分之一秒内排完 20,000 个值！\n\n而且！没有理由自己写排序算法，因为\
  \ Java 有一个非常完美的库排序方法，可以在不到百分之一秒内完成相同值的排序！\n\n真正更高效的是使用更好的算法，并且不需要你自己去写代码！\n\nJava\
  \ 标准库提供的内置排序方法是 O(n log n)（也称为对数线性）排序。对于基本类型 `int`，[文档说](https://docs.oracle.com/javase/8/docs/api/java/util/Arrays.html#sort-java.lang.Object:A-)它使用了一种“稳定的、自适应的、迭代归并排序，当输入数组部分有序时，它需要的比较次数远少于\
  \ n lg(n)，当输入数组随机随机排序时，它提供传统归并排序的性能……[它] 改自 Tim Peters 的 Python 列表排序（TimSort）。”\n\
  \n你知道我最喜欢使用标准库排序的哪一点吗？它只需要一行代码，而且我不需要调试！而且它使用的算法比我写的要高效得多。\n\n所以，这里是我对编写高效代码的建议：\n\
  \n#### 米切尔先生编写高效代码的技巧\n\n1. 不要担心效率。反正，你对什么是高效的判断可能是错误的。\n2. 写出代码。不要担心它是否高效。\n3.\
  \ 让代码运行起来。（调试它。）\n4. 确保代码执行了它应该执行的功能。（测试它。）\n5. 现在既然它运行正常了，这代码够快了吗？如果是，你就完成了！\n\
  6. 如果太慢了，对代码进行“性能分析（profile）”，看看哪些部分慢。\n7. 修复慢的部分。回到步骤 4。\n\n让正确的代码运行得更快，比让一个“优化过”但损坏的代码运行起来要容易得多。\n\
  \n引用一位著名计算机科学家的话：\n\n> “程序员浪费了大量的时间去思考或担心程序中非关键部分的速度，而这些对效率的尝试在考虑调试和维护时实际上会产生强烈的负面影响。我们应该忘记那些微小的效率，在大约\
  \ 97% 的情况下如此：过早优化是万恶之源。然而，我们绝不应该放弃在那 3% 的关键时刻的机会。”\n\n> – 唐纳德·克努斯（Donald Knuth）\n\
  \n这段引用来自 1974 年，当时像 PDP-11 这样流行的计算机内存不足 1 兆字节，运行时钟频率低于 15 MHz！如果为[这样的]机器编写程序……\n\
  \n## 练习 27：静态变量和方法\n\n好了，我们现在讨论了效率，现在让我们回到 `static` 的含义。Java 的特性包括：静态变量和静态方法。\n\n\
  ```java\nimport java.util.ArrayList;\n\npublic class Fish {\n    private String\
  \ name;\n    private int id;\n    private static int count = 0;\n\n    public Fish(String\
  \ name) {\n        this.name = name;\n        count++;\n    }\n\n    public String\
  \ toString() {\n        return name + \" #\" + count;\n    }\n\n    public static\
  \ int numCreated() {\n        return count;\n    }\n}\n```\n\nFishDriver.java\n\n\
  驱动程序有一个鱼的名称数组，这样我就不需要重复编写相同的代码。还有一个 `ArrayList` 用于存储对 Fish 的引用。我从遍历每个名称开始……\n\n\
  ```java\npublic class FishDriver {\n    public static void main(String[] args) {\n\
  \        String[] names = { \"Wanda\", \"Bruce\", \"Dory\", \"Qwerty\", \"Blinky\"\
  , \"Lenny\", \"Flounder\", \"Mr. Puff\", \"Moby Dick\", \"Fred\", \"di\" };\n  \
  \      ArrayList<Fish> school = new ArrayList<>();\n\n        for (String n : names)\
  \ {\n            Fish f = new Fish(n);\n            school.add(f);\n        }\n\n\
  \        for (Fish f : school) {\n            System.out.println(f);\n        }\n\
  \n        System.out.println(Fish.numCreated() + \" Fish objects were created.\"\
  );\n    }\n}\n```\n\n### 你应该看到的\n\n在我过多谈论 `static` 的影响之前，让我们先记住普通的（非静态）实例变量和方法是如何工作的。\n\
  \n在 `Fish` 类中，字符串 `name` 和整数 `id` 属于特定的 `Fish` 对象。每当实例化一个 `Fish` 对象时，该对象都会获得这两个变量的副本。\n\
  \n所以，如果你创建了一个名为 `f` 的 `Fish` 对象，那么调用 `f.toString()` 操作的是 `f` 的 `name` 变量副本以及 `f`\
  \ 的 `id` 变量副本。\n\n`static` 变量则不同。它属于类，属于整个类。无论创建了多少个 `Fish` 对象，它们都共享同一个 `count`\
  \ 变量副本。\n\n这就是为什么在 `Fish` 类的构造函数中有一个 `count++`。*count* 在第 4 行初始化为 `0`，因此每当创建一个新的\
  \ `Fish` 时，该 Fish 都会对共享计数器加 1，然后将自己的 `id` 字段设置为相同的数字。\n\n\n\n\n`numCreated()` 方法可以声明为\
  \ `static`，因为它`仅`尝试访问 `static` 变量。静态方法只能访问静态变量。这是因为即使在`没有`实例化该类的对象时，静态方法和静态变量也已经存在。\n\
  \n普通的（非静态）方法可以访问两种变量，静态或非静态的。\n\n即使在没有创建 `Fish` 对象时，静态方法 `numCreated()` 也存在，你可以像我们在驱动程序第\
  \ 21 行那样调用它：\n\n```\nint fishCount = Fish.numCreated();\n```\n\n注意你直接使用了类名。从类的实例（instance）调用静态方法也是合法的（虽然很奇怪）：\n\
  \n```\nFish omari = new Fish(\"Sticks\");\nint count = omari.numCreated();\n```\n\
  \n这运行良好。\n\n我们并不`需要`将 `numCreated()` 方法定义为 `static`。仅仅因为它只访问静态变量并不意味着它`必须`是静态的。如果我们没有把它变成静态，那么：\n\
  \n```\nint fc = Fish.numCreated();\n```\n\n将无法工作。\n\n好了，这个练习可能足够了。在下一个练习中，我们将查看\
  \ Java 中常用的一些静态方法。\n\n## 练习 28：Java 中的静态方法\n\n既然你已经知道了静态方法和静态变量，我将指出 Java 中的几个。你在之前的练习中已经用过很多它们了！\n\
  \n```java\n 1 public class StaticMethods {\n 2     public static void main( String[]\
