  19         String tt = (String)objarr.get(1);\n20 \n21         System.out.println(objarr);\n\
  22 \n23         // ---------------------------------------\n24         Integer i\
  \ = new Integer(123);\n25         objarr.add(i);\n26 \n27         System.out.println(objarr);\
