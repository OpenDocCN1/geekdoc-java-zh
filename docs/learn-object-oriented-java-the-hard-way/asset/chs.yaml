  \ words = lower.split(\" \");\n 19         String result = \"\";\n 20         for\
  \ ( String w : words )\n 21             result += w.substring(0,1).toUpperCase()\
  \ + w.substring(1);\n 22 \n 23         // display it\n 24         System.out.println(result);\n\
  \ 25     }\n 26 }\n```\n\n`StringFunMonolith.java`\n\n### 你应该看到的内容\n\n因此，第 8-9 行输入消息，第\
