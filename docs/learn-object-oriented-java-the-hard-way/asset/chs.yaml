  \ 变量的副本。我们可以如第 4 行和第 5 行所示为 `a` 的这些变量副本赋值，尽管我们在书中后面会看到这被认为是不好的风格。\n\n第 7 行创建了类的第二个实例，它拥有自己的实例变量副本。\n\
