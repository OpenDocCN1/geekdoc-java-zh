  \n### 你应该看到什么\n\n如果你是一个熟悉 `tar` 命令的资深 Unix 用户，你输入的内容看起来可能有点熟悉。但对于其他人来说……\n\n你向 `jar`\
  \ 命令传递了四个参数：`c`、`v`、`f` 和 `e`。`c` 表示“创建”（create），因为我们正尝试创建一个新的 JAR。`v` 表示“详细列表”（verbose），并在屏幕上打印正在发生的情况。你可以省掉\
  \ `v`，它将以静默模式运行。\n\n`f` 表示你想要在此命令中提供 JAR 的“文件名”（filename）；它将是空格后的第一个参数。\n\nJAR 文件中有一个特殊的文本文件，称为“清单”（manifest）。你可以自己创建清单并将其传递给\
  \ `jar` 命令，或者你也可以直接告诉 `jar` 命令哪一个 Java 类是“入口点”（entry point），让它为你创建清单。因此 `e` 表示我们只提供入口点。\n\
  \n所以，带有选项 `c`reate（创建）、`v`erbose（详细）、`f`ilename（文件名）和 `e`ntrypoint（入口点）之后是之后创建的\
