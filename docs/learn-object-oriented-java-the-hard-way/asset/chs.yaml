  \ ( int i=message.length()-1; i>=0; i-- )\n16             rev += message.substring(i,i+1);\n\
  17 \n18         message = rev;\n19     }\n20 \n21     public void camelCase() {\n\
  22         String[] words = message.toLowerCase().split(\" \");\n23         String\
  \ result = \"\";\n24         for ( String w : words )\n25             result +=\
  \ w.substring(0,1).toUpperCase() + w.substring(1);\n26 \n27         message = result;\n\
