  \n在几何学和计算机图形中，“平”（translate）意味着在不改变对象大小或形状的情况下改变对象的位置。因此，我们将创建一个保证 `translate()`\
  \ 方法的接口。\n\n```\n 1 public class Location implements Comparable<Location> {\n 2\
  \     public int row;\n 3     public int col;\n 4 \n 5     public Location() {\n\
  \ 6         row = col = 0;\n 7     }\n 8 \n 9     public Location( int r, int c\
  \ ) {\n10         row = r;\n11         col = c;\n12     }\n13 \n14     public boolean\
  \ equals( Object obj ) {\n15         Location other = (Location)obj;\n16       \
  \  return this.row == other.row && this.col == other.col;\n17     }\n18 \n19   \
  \  public int compareTo( Location other ) {\n20         if ( this.row == other.row\
  \ )\n21             return this.col - other.col;\n22         return this.row - other.row;\n\
  23     }\n24 \n25     public Location below() {\n26         return new Location(this.row+1,\
  \ this.col);\n27     }\n28 \n29     public Location above() {\n30         return\
  \ new Location(this.row-1, this.col);\n31     }\n32 \n33     public Location left()\
