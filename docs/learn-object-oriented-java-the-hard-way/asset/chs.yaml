  \ Unicode 值的数字变量。因此，字母‘A’（注意单引号）的值为 65，而‘B’是 66。\n\n然后我们获取他们想要移动的棋子的引用。我们检查那里是否有棋子，或者那里有棋子但颜色不对。如果是这样，我们就让他们重新选择。\n\
  \n如果我们还在执行中，说明有一个有效的移动。我们使用 `pick.canMove()` 来检查选项，并使用 `pick.move(colDir-2)` 执行操作。游戏循环一直持续到\
  \ `board.isOver()` 为真。最后，我们检查 `board.isWinner(\"W\")` 来确定胜者。\n\n## 练习 37：两种等价性\n\
  \n你已经见过用于基本类型的 `==`。到目前你可能已经学习对象必须使用 `equals()`。在这个练习中，我们将看到如何重写默认的 `equals()` 方法。\n\
  \n`Dude` 类继承自 `Object`。因此，在这个对象中，我们正在重写从 `Object` 类继承而的 `equals()` 和 `toString()`\
  \ 版本。\n\n```java\n 1 public class Dude {\n 2     private int age;\n 3     private\
  \ String name;\n 4 \n 5     public Dude(String name, int age) {\n 6         this.name\
  \ = name;\n 7         this.age = age;\n 8     }\n 9 \n10     @Override\n11     public\
  \ boolean equals(Object obj) {\n12         Dude other = (Dude)obj;\n13         return\
  \ ( this.age == other.age && this.name.equals(other.name) );\n14     }\n 15 \n16\
  \     @Override\n17     public String toString() {\n18         return name + \"\
  |\" + age;\n19     }\n 20 }\n```\n\n重写 `equals()` 时有一个小复杂之处。该方法期望一个 `Object` 类型的参数，而不是\
  \ `Dude` 类型。因此，假设他们传入的是一个 `Dude` 对象，我们将 `Object` 类型的引用强制转换回 `Dude` 类型，如下：\n\n```\n\
  Dude other = (Dude)obj;\n```\n\n如果他们发送的对象是其他类型的对象，程序就会崩溃，例如：\n\n```java\nDude a\
  \ = new Dude(\"Dynamite\", \"Bamford\");\nString s = \"fuse\";\nif ( a.equals(s)\
  \ ) // 爆炸\n```\n\n\n\n\n这会导致程序崩溃，而不是仅仅返回 `false`。这不太好。我们应该换一种方式编写 `equals()` 来检查这一点：\n\
  \n```java\nif ( obj == null )\n    return false; // 这个对象不等于 'null' 引用，对吧？\nDude\
  \ other = null;\ntry {\n    other = (Dude)obj;\n}\ncatch ( ClassCastException e\
  \ ) {\n    return false; // 如果它不是一个 Dude，它们就不相等\n}\nreturn ( this.age == other.age\
  \ && this.name.equals(other.name) );\n```\n\n那样会好得多。但你还在学习，所以我们现在的做法已经足够了。\n\n`equals()`\
  \ 方法的最后一行意味着“如果年龄相同且名字相等，则返回 `true`；否则返回 `false`。”你也可以这样写：\n\n```java\nif ( this.age\
  \ == other.age && this.name.equals(other.name) )\n    return true;\nelse\n    return\
  \ false;\n```\n\n这种写法的效果完全一样，但我更喜欢我这种写法。\n\n```java\n 1 public class DudeDriver\
  \ {\n 2     public static void main( String[] args ) {\n 3         Dude one = new\
  \ Dude(\"Mitch\", 39);\n 4         Dude two = new Dude(\"Mitch\", 39);\n 5     \
  \    Dude three = one;\n 6         Dude four = new Dude(\"Curly\", 71);\n 7 \n 8\
  \         if ( one.equals(two) )\n 9             System.out.println(one + \" equals\
  \ \" + two);\n10         else\n11             System.out.println(one + \" does not\
  \ equal \" + two);\n12 \n13         if ( one.equals(three) )\n14             System.out.println(one\
  \ + \" equals \" + three);\n15         else\n16             System.out.println(one\
  \ + \" does not equal \" + three);\n17 \n18         if ( one.equals(four) )\n19\
  \             System.out.println(one + \" equals \" + four);\n20         else\n\
  21             System.out.println(one + \" does not equal \" + four);\n22 \n23 \
  \        System.out.println();\n24         if ( one == two )\n25             System.out.println(one\
  \ + \" == \" + two);\n26         else\n27             System.out.println(one + \"\
  \ != \" + two);\n28 \n29         if ( one == three )\n30             System.out.println(one\
  \ + \" == \" + three);\n31         else\n32             System.out.println(one +\
  \ \" != \" + three);\n33     }\n34 }\n```\n\nDudeDriver.java\n\n驱动程序创建了一些 `Dude`\
  \ 对象并对它们进行比较。`Dude one` 和 `Dude two` 是“等效”对象：它们是具有相同字段值的两个对象。`Dude one` 和 `Dude\
  \ three` 是指向同一个对象的两个引用。\n\n### 你应该看到的\n\n所以 `one.equals(two)` 和 `one.equals(three)`\
  \ 正如预期的那样。但 `one == three` 是 true，因为引用（浅值）也是相同的。\n\n## 练习 38：实现接口\n\n我们一直在学习继承。从另一个类继承代码是重用代码的一种好方法。但在\
  \ Java（以及大多数“新”编程语言）中，你只能继承自*单个*类。\n\n如果你想从多个地方获取组合功能，你需要别的东西。在 Java 中，那个“别的东西”就是*接口*（interface）。\n\
  \n接口就像一份合同；它是对实现某些方法的承诺。让我们从一个小例子开始。注意它以 `public interface` 而不是 `public class` 开始。\n\
  \n```java\n1 public interface ArbitraryInterface {\n2     public double getNumber();\n\
  3     public void doSomething(int n);\n4 }\n```\n\nArbitraryInterface.java\n\n没有缺失的代码，就是这样！选择实现\
  \ `ArbitraryInterface` 的类承诺拥有两个公共方法：一个称为 `getNumber()`，另一个称为 `doSomething()`。第一个方法*必须*不能有参数并且必须返回一个\
  \ `double` 以履行合同。第二个方法必须有一个整数参数并且不返回任何内容。（尽管这个整数参数不一定非叫 *n*。）\n\n现在这里有一个成功*实现*了该接口的类：\n\
  \n```java\n 1 public class InterfacePleaser implements ArbitraryInterface {\n 2\
  \     public double getNumber() {\n 3         return 4;\n 4     }\n 5 \n 6     public\
  \ void doSomething(int n) {\n 7         n = Math.abs(n);\n 8         for ( int i=1;\
  \ i<=n; i++ ) {\n 9             System.out.println(i);\n10         }\n11     }\n\
  12 \n13     public int doSomethingElse(int x) {\n14         return x*x;\n15    \
  \ }\n16 }\n```\n\nInterfacePleaser.java\n\n这个类`实现`了 `ArbitraryInterface` 接口。它必须拥有这两个方法，而它确实拥有！注意接口并不关心这些方法**做什么**。它们只需要存在即可。\n\
  \n在这个例中，我决定从要求的 `getNumber()` 中始终返回 `4`。接口并不关心这些方法**做什么**。它们只需要存在即可。\n\n（注：原文中存在大量重复的段落，此处已按要求仅翻译核心逻辑内容）\n\
  \n\n\n\n在本次练习中，我将尝试展示实现接口是多么*有用*的。我保证，在练习结束时，我们一定能理解这一点！\n\nJava 中内置了一个名为 `Comparable`\
  \ 的接口。（它位于 `java.lang` 包中，所以你不需要导入任何内容即可使用。）\n\n它看起来像这样：\n\n```\npublic interface\
  \ Comparable {\n    public int compareTo(Object o);\n}\n```\n\n它非常简单。为了变得是“可比较的”，一个类只需要实现一个方法：`compareTo()`。如果该类“小于”参数，该方法*应该*返回一个负数；如果在某些意义上相等，则返回\
  \ `0`；如果它“大于”参数，则返回一个正数。\n\n当然，它所*必须*做的就是接受一个 `Object` 参数并返回任何整数，但如果你愿意配合的话，它会变得有用得多。\n\
  \n```\n 1 public class Buddy implements Comparable {\n 2     private int age;\n\
  \ 3     private String name;\n 4 \n 5     public Buddy(String name, int age) {\n\
  \ 6         this.name = name;\n 7         this.age = age;\n 8     }\n 9 \n10   \
  \  public boolean equals(Object obj) {\n 11         Buddy other = (Buddy)obj;\n\
  \ 12         return ( this.age == other.age && this.name.equals(other.name) );\n\
  \ 13     }\n 14 \n 15     public int compareTo(Object obj) {\n 16         Buddy\
  \ other = (Buddy)obj;\n 17         if ( this.name.equals(other.name) )\n 18    \
  \         return (this.age - other.age);\n 19         else\n 20             return\
  \ this.name.compareTo(other.name);\n 21     }\n 22 \n 23     public String toString()\
  \ { return name + \"-\" + age; }\n 24 }\n```\n\nBuddy.java\n\n这是一个实现了 `Comparable`\
  \ 接口的简单小类。（同时也重写了默认的 `equals()` 方法。）\n\n记住，传入的是一个 `Object`，而不是特定的 `Buddy`，所以我们必须对其进行类型转换。\n\
  \n如果名字相同，我们返回年龄之间的*差值*，如果 `this` 大于 `other`，结果将是一个正数；如果相同则为零；如果 `this` 小于 `other`，则为一个负数。\n\
  \n如果名字不同，我们就耍了弊，直接返回 `String` 类 `compareTo()` 方法提供的相同数字。\n\n```\n 1 import java.io.File;\n\
  \ 2 import java.util.Scanner;\n 3 \n 4 public class BuddyTester {\n 5     public\
  \ static void main( String[] args ) throws Exception {\n 6 \n 7         int correct\
  \ = 0;\n 8         int total   = 0;\n 9         Scanner in = new Scanner(new File(\"\
  datafiles/buddytests.txt\"));\n10         while ( in.hasNext() ) {\n 11        \
  \     String name1  = in.next();\n 12             int    age1   = in.nextInt();\n\
  \ 13             String name2  = in.next();\n 14             int    age2   = in.nextInt();\n\
  \ 15             int    wanted = in.nextInt();\n 16 \n 17             total++;\n\
  \ 18             int got = test(name1,age1 , name2,age2);\n 19             if (\
  \ got == wanted )\n 20                 correct++;\n 21             else {\n 22 \
  \                System.out.print(\"\\t\" + name1 + \"-\" + age1 + \" compared with\
  \ \");\n 23                 System.out.print(name2 + \"-\" + age2 + \" should have\
  \ given \");\n 24                 System.out.println(wanted + \", but I got \" +\
  \ got + \" instead.\");\n 25             }\n 26         }\n 27         in.close();\n\
  \ 28         System.out.println(correct + \" out of \" + total + \" tests passed.\"\
  );\n 29 \n 30     }\n 31 \n 32     public static int test( String n1,int a1, String\
  \ n2,int a2 ) {\n 33         Buddy one = new Buddy(n1, a1);\n 34         Buddy two\
  \ = new Buddy(n2, a2);\n 35         int num = one.compareTo(two);\n 36         if\
  \ ( num == 0 )\n 37             return 0;\n 38         return (num / Math.abs(num));\n\
  \ 39     }\n 40 }\n```\n\nBuddyTester.java\n\n该类通过一系列测试用例测试了我们对 `compareTo()` 的实现。'buddytests.txt'`\
  \ 文件包含许多名字和年龄的组合*以及*比较的预期输出。\n\n例如，文件的前两行看起来如下：\n\n```\nBob     30    Bob     30\
  \   0\nAlice   25    Bob     30  -1\n```\n\n所以，如果我们将一个名为“Bob”、年龄为 30 的 `Buddy` 与*另一个*名字和年龄都相同的\
  \ `Buddy` 进行比较，我们期望 `compareTo()` 告诉我们 `0`。\n\n如果我们把一个名为“Alice”、年龄为 25 的 `Buddy`\
  \ 与一个名为“Bob”、年龄为 30 的对象进行比较，我们期望返回一个负数，因为“Alice”在“Bob”之前。\n\n静态方法 `test()` 为我们完成了这项工作。它创建了两个\
  \ `Buddy` 对象并调用了 `compareTo()`。\n\n### 你所看到的\n\n`Guy` 类与 `Buddy` 类几乎完全相同，不同在于它 `implements\
  \ Comparable<Guy>`。这意味着编译器将确保我们只尝试用一个 `Guy` 对象与另一个进行 `compareTo()`。\n\n```\npublic\
  \ interface Comparable<T> {\n    public int compareTo(T o);\n}\n```\n\n现在，`Comparable`\
  \ 有了泛型参数，这使得写起来变得*稍微*容易了一点。\n\n```\n 1 public class Guy implements Comparable<Guy>\
  \ {\n 2     private int age;\n 3     private String name;\n 4 \n 5     public Guy(String\
  \ name, int age) {\n 6         this.name = name;\n 7         this.age = age;\n 8\
  \     }\n 9 \n10     public boolean equals(Object obj) {\n 11         Guy other\
  \ = (Guy)obj;\n 12         return ( this.age == other.age && this.name.equals(other.name)\
  \ );\n 13     }\n 14 \n 15     public int compareTo(Guy obj) {\n 16         if (\
  \ this.name.equals(other.name) )\n 17             return (this.age - other.age);\n\
  \ 18         else\n 19             return this.name.compareTo(other.name);\n 20\
  \     }\n 21 \n 22     public String toString() { return name + \"-\" + age; }\n\
  \ 23 }\n```\n\nGuy.java\n\n无论如何，我答应过给你*有用*的东西。\n\nJava 中有一个名为 `Collections` 的工具类。它有很多静态方法，其中一个方法可以对\
  \ ArrayList 中的值进行排序。这非常方便。编写排序很麻烦，你可能还记得。\n\n然而，只有一个问题。ArrayList 只持有对象的引用，而 Java\
  \ 中并不是所有对象都可以比较。一个 `Scanner` 对象“小于”另一个 `Scanner` 对象有意义吗？`Math` 类呢？一个 `Math` 对象可以“大于”另一个吗？\n\
  \n所以 `Collections.sort()` 的定义大致如下：\n\n```\npublic static void sort( List<Comparable>\
  \ list )\n```\n\n（它实际上*不是*是这样定义的，如果你勇敢且好奇，可以去查查。）\n\n这意味着 `Collections.sort()` 可以对任何持有*可比较*对象引用的\
  \ ArrayList 进行排序。所以如果 ArrayList 只持有实现了 `Comparable` 接口对象的引用，那么它就可以使用对象的 `compareTo()`\
  \ 方法对该 ArrayList 进行排序。很酷对吧？\n\n\n\n\n```\n 1 import java.util.Scanner;\n 2 import\
  \ java.util.ArrayList;\n 3 import java.util.Collections;\n 4 \n 5 public class GuyDriver\
  \ {\n 6     public static void main( String[] args ) {\n 7 \n 8         ArrayList<Guy>\
  \ list = getListFromFile(\"datafiles/buddytests.txt\");\n 9         System.out.println(list+\"\
  \\n\");\n10 \n11         Collections.sort(list);\n12         for ( Guy g : list\
  \ )\n13             System.out.println(g);\n14     }\n15 \n16     public static\
  \ ArrayList<Guy> getListFromFile( String filename ) {\n17         ArrayList<Guy>\
  \ list = new ArrayList<>();\n18         Scanner in = null;\n19 \n20         try\
  \ {\n21             in = new Scanner(new java.io.File(filename));\n22         }\n\
  23         catch ( java.io.FileNotFoundException e ) {\n24             System.err.println(\"\
  Couldn't open 'buddytests.txt': \" + e);\n25             System.exit(1);\n26   \
  \      }\n27 \n28         while ( in.hasNext() ) {\n29             Guy g = new Guy(in.next(),\
  \ in.nextInt());\n30             if ( ! list.contains(g) )\n31                 list.add(g);\n\
  32             in.next(); // read these from the file but just throw them away\n\
  33             in.nextInt();\n34             in.nextInt();\n35         }\n36   \
  \      in.close();\n37         return list;\n38     }\n39 \n40 }\n```\n\n## GuyDriver.java\n\
  \n该程序根据数据文件中每行的第一部分创建 `Guy` 对象，并将所有唯一的对象对象添加到包含 `Guy` 对象的 `ArrayList` 中。\n\n然后，它使用\
  \ `Collections.sort()` 对它们进行排序，并显示结果。\n\n### 你应该看到的内容\n\n思考一下刚才发生了什么。在 `getListFromFile()`\
  \ 方法内部，Java 创造者编写的 `ArrayList` 代码能够使用 `contains()` 方法来判断列表中已经存在一个相同的 `Guy` 对象。\n\
  \n几年前就有人写了 `contains()` 方法。他们无法预料我在 2016 年会创建一个名为 `Guy` 的对象并希望他们与之协作。但是，仅仅因为我为新类定义了自定义的\
  \ `equals()` 方法，他们的代码就可以与我的代码一起工作。\n\n而且 `Collections.sort()` 能够对 Java 创造者们从未梦过的对象\
  \ `ArrayList` 进行排序，而我所做的只是在我的类中 `implement Comparable`。\n\n新代码运行旧代码非常常见：任何编程语言都可以做到。但当旧代码可以运行我的新代码时，这就很有用了。\n\
  \nJava 有相当多的内置接口。当你编写实现了这些其中一个接口的代码时，你就允许许多其他内置的 Java 代码能够免费地与你的代码工作。这非常酷。\n\n我们将在下一次练习中查看另一个流行的\
  \ Java 接口。\n\n## 练习 40：List 和 Map\n\n在本次练习中，我们将查看两个非常常见的标准 Java 接口。其中一个你在整本书中一直在使用！\n\
  \n这两个接口的方法都太多了，无法在这里全部列出，但你可以查看官方的 javadocs：\n\n*   [java.util.List](http://docs.oracle.com/javase/8/docs/api/java/util/List.html)\n\
