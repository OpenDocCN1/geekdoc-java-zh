  \ + Integer.SIZE + \" bits.\");\n30         System.out.println(\"\\tSmallest possible\
  \ int: \" + Integer.MIN_VALUE);\n31         System.out.println(\"\\t Largest possible\
  \ int: \" + Integer.MAX_VALUE);\n32         int model = Integer.parseInt(\"1070\"\
  );\n33         model += 10;\n34         System.out.println( String.valueOf(model)\
  \ );\n35         System.out.println( \"\"+model );\n36     }\n37 }\n```\n\n`PopularStaticMethods.java`\n\
  \nJava 有一个名为 `Math` 的内置类。它位于 `java.lang` 包中，这意味着你不需要 `import` 任何就可以使用它；`java.lang`\
  \ 中的所有内容都是总是导入的。\n\n`Math` 类中的每一个方法都是静态的，因此永远不需要实例化 `Math` 对象。\n\n`Math` 类还包含两个\
  \ `public` 静态变量，但这两个变量都被定义为 `final`，这意味着它们的值不能被改变。（所以别动歪主意。）\n\n我一直喜欢 Java 文档解释它的方式：\n\
  \n`public static final double PI`\n\n这个 `double` 值比任何其他值都接近 `pi`，即圆周与直径的比率。\n\n\
  “比任何其他值都接近。”不错。\n\n你现在终于掌握了足够的知识来理解该定义中的所有内容：\n\n变量名为 `PI`。它是一个 `double`，因为它是一个数字并且需要小数。它是\
  \ `final` 的，所以它已经有一个值且不能被改变。该变量是 `public` 的，这意味着可以从 `Math` 类外部直接访问。它是 `static` 的，这意味着它有一个属于整个类的副本，`并且`你不需要创建一个\
  \ `Math` 对象的实例就可以访问它。\n\n呼。\n\n这就是为什么阅读 Java 文档对初学者来说非常困难。单行代码中就包含了`极多`信息，而且每个词都有重要意义并且\n\
  \n### 你应该看到的\n\n`Math` 类中的每一个方法都是静态的，因此永远不需要实例化 `Math` 对象。\n\n`Math` 类还包含两个 `public`\
  \ 静态变量，但这两个变量都被定义为 `final`，这意味着它们的值不能被改变。（所以别动歪主意。）\n\n`Integer` 类还包含几个实用的方法。`Integer.MAX_VALUE`\
  \ 是溢出发生前 `int` 能够存储的最大值。再大 1 就会溢出。\n\n`图形` 程序往往`仅`能够接收 `String` 类型的输入。如果你要求用户输入年龄，当他们输入时，它以\
  \ `String` 形式进来。`Integer` 是溢出发生前 `int` 能够存储的最大值。再大 1 就会溢出。\n\n另一个非常有用的方法是 `parseInt()`，它是\
  \ `valueOf()` 的反操作。如果你给它一个只包含数字的 `String`，它将返回一个具有相同值的 `int`。\n\n`Integer` 类还有几个实用的方法。`String.valueOf()`\
  \ 将……转换为 `String`。\n\n`String` 类也有几个静态方法。`substring()` 不是静态的，因为它需要有一个值来生成子字符串。\n\
  \n\n\n\n```\nimport static java.lang.Math.*;\nimport static java.lang.System.out;\n\
  \npublic class ImportingStatic {\n    public static void main( String[] args ) {\n\
  \        double a = random();\n        double b = random();\n\n        out.println(\
  \ PI );\n        out.println( abs(-9) );\n        out.println( sqrt(2) );\n    \
  \    out.println( min(a, b) + \" is smaller.\" );\n        out.println( max(a, b)\
  \ + \" is larger.\" );\n        out.println( pow(a, b) ); // a raised to the power\
  \ of b\n        out.println( Math.sin(PI) );\n        out.println( Math.cos(PI)\
  \ );\n        out.println( Math.tan(PI) );\n    }\n}\n```\n\n`ImportingStatic.java`\n\
  \n在某些编程语言中，你不能将某个命名为 `sqrt`。这是因为已经有一个内置的平方根函数且它一直存在。\n\n你可以说 `sqrt` 的标识符位于默认的全局“命名空间”中。如果你还记得之前练习中的符号表，那么命名空间基本上就是你在写第一行自己的代码之前，就已经在符号表中的变量列表。\n\
  \n在其他语言中，一旦你导入了 `Math` 库，**那么** `sqrt` 就会进入命名空间中。但如果你没有导入 `Math` 库，你仍然可以在程序中使用该名称。（不确定你为什么要这么做，但是……）\n\
  \nJava 采用了一种我喜欢的折中方案。`Math` 库始终是“被导入”的，但函数名不会弄乱全局命名空间。我不需要担心是否可以创建一个名为 `min` 的变量，因为尽管\
  \ `Math` 库是可用的，但所有静态方法都安全地封装在内部。如果我需要它们，必须写成 `Math.min()`。\n\n但如果我正在创建一个真正的数学密集型程序呢？我真的必须写成：\n\
  \n```\na = Math.sqrt( Math.pow(b, 2) + Math.pow(c, 2) - 2*b*c * Math.cos(A) );\n\
  ```\n\n天哪，不用！Java 允许你写一行代码，意思是“将所有静态方法和变量导入到当前命名空间”。\n\n```\nimport static java.lang.Math.*;\n\
  ```\n\n（在处理计算机时，`*` 往往是一个“通配符”字符，意味着“匹配任何内容”，在这里就是这样使用的。）\n\n在导入这些静态项后，你现在可以直接写：\n\
  \n```\na = sqrt( pow(b, 2) + pow(c, 2) - 2*b*c * cos(A) );\n```\n\n这看起来好多了！\n\n\
  ### 你应该看到的内容\n\n看，它真的有效！\n\n`System` 类包含一个名为“out”的静态成员，它是一个带有我们常用的 `println` 方法的\
  \ `PrintStream` 对象！\n\n所以你可以如所示*仅*导入这一个对象，允许我们写：\n\n```\nout.println( \"No System\
  \ needed!\" );\n```\n\n向命名空间中导入大量的静态项被认为是不良风格，所以请谨慎使用。\n\n在学习练习之前还有一件事。你注意到程序末尾不寻常的输出了吗？也许没有注意到，但*我*预期\
  \ ![\\pi](img/leanpub_equation_5.png) 的 `sin` 和 `tan` 应该是 0，而不是 1.2246 x 10![^{-16}](img/leanpub_equation_6.png)!\n\
  \n这是在计算机上处理浮点数时的常见问题。不仅 Java 如此；即使是专业的数值计算环境 `MATLAB` 给出的答案也是 `1.2246E-16`！我不知道你对高中数学记得如何，但\
  \ `1.22E-16` 是一个非常接近零的极小数：\n\n`0.0000000000000001224646799`\n\n但因为这种情况非常常见，所以在使用浮点数时不应该进行相等判断，因为舍入误差会导致它们产生细微差异。\n\
  \n也就是说，不要写：\n\n```\ndouble a = 0;\ndouble b = sin(PI);\nif ( a == b ) {\n    //\
  \ do something\n}\n```\n\n……因为 `if` 语句几乎永远为真。相反，请检查两个值是否“足够接近”：\n\n```\ndouble a\
  \ = 0;\ndouble b = sin(PI);\ndouble error = 1.0E14;\nif ( abs(a-b) < error ) {\n\
  \    // close enough!\n}\n```\n\n这安全得多。\n\n好了，这个练习就够了。我们在下一个练习中查看参数传递！\n\n## 练习\
  \ 30：作为参数的引用\n\n在本次练习中，我们将回顾引用，并观察将引用变量作为参数传递给方法时产生。\n\n在输入代码之前，提醒自己数组变量包含指向堆中内存位置的引用。记住，将一个数组赋值给另一个拷贝的是*引用*，而不是数组内部的值。\n\
  \n```java\nimport java.util.Arrays;\n\npublic class ReferenceParameters {\n    public\
