  \ \n\n### 你应该看到什么\n\n第 4 到第 6 行定义了你已经过的过的变量类型。整数只存储整数，但每个数字都被精确存储；整数永远不会有舍入问题。\n\
  \n`Doubles` 可以包含小数（分数部分），但在内部以科学计数法存储，并且只有特定数量的有效数字。\n\n`Boolean` 变量只能存储 `true`\
  \ 值或 `false` 值。\n\n稍后我会详细讨论这三种变量类型。但首先，文件中接下来的四行代码定义了我之前没有提到过的四种变量类型！\n\n#### 原始数据类型\n\
  \n`byte`、`short` 和 `long` 都是不同类型的整数。它们都只存储正或负整数，但它们的大小不同。`float` 就像 `double` 但大小只有它的一半。\n\
  \n让我解释一下我的意思。Java 中的 `int` 存储为 32 位二进制数。因此，二进制中的数字 5 *可以* 被简单写为 `101`，但一个包含 5 的\
  \ Java `int` 实际上存储方式如下：\n\n`00000000000000000000000000000101`\n\n而存储在 `byte` 类型变量中的相同\
  \ 5 存储方式如下：\n\n`00000101`\n\n`short` 占用 16 位，而 `long` 有比 `int` 更大的空间；它使用 64 位。\n\
  \nJava 中所有这些数值类型类型都是“带符号”的，这意味着第一位（“最高位”）决定符号。`0` 表示正，`1` 表示负。然后剩余的位决定数字的绝对值或“幅度”。\n\
  \n(算是有吧。整数存储在一种名为“补码”的特殊格式中，这意味着负数的表示方式和我描述的略有不同。如果你想了解更多细节，可以查一下。)\n\n这意味着由于剩余\
  \ 31 位用于数值，Java 中的整数可以存储从 `00000000000000000000000000000000` (0) 到 `01111111111111111111111111111111`\
  \ (2147483647) 之间的任何正数，以及从 `11111111111111111111111111111111` (-1) 到 `10000000000000000000000000000000`\
  \ (-2147483648) 之间的任何负数。\n\n以下是 Java 中其他整数类型的细节。\n\n| type | bits | 最小值 | 最大值 |\n\
  \n| --- | --- | --- | --- |\n| `byte` | 8 bits | -128 | 127 |\n| `short` | 16 bits\
  \ | -32768 | 32767 |\n| `int` | 32 bits | -2147483648 | 2147483647 |\n| `long` |\
  \ 64 bits | -9223372036854775808 | 9223372036854775807 |\n\n#### 引用类型\n\n在第 17 行，我们创建了一个名为\
  \ `name` 的 `String` 变量并将值 `\"Gosling\"` 放入其中。其实我们并没有。\n\nJava 中的字符串不是原始数据类型，所以值\
  \ `\"Gosling\"` 并没有直接存储在变量中。字符串值实际上存储在内存的另一个地方（称为“堆”），然后将其内存地址存储在变量中。\n\n## 练习 19：内存中的引用变量\n\
  \n原始变量类型直接将变量的值存储在变量的内存位置中。引用变量将值存储在其他地方，而引用变量的内存位置则持有那个“其他地方”的位置。\n\n\n\n\n\n```\n\
