  \ 类继承自 `Application`，为游戏提供了图形界面。它使用 `Canvas` 来绘制游戏板，并使用 `AnimationTimer` 来处理渲染循环。\n\
  \n### 你应该看到的\n\n![DropGame](img/DropGame.png)\n\n`start` 方法初始化了场景、画布和鼠标事件监听器。如果游戏结束，它会重置；如果游戏尚未开始，它就会开始。否则，它计算点击的列并告诉\
  \ `DropGameHelper` 执行移动。\n\n`drawEverything` 方法清除屏幕并绘制状态。如果游戏没有开始，它显示“点击开始”的消息。否则，它调用\
  \ `drawBoard()` 并判断胜利者或平局。\n\n`drawBoard` 方法遍历 `locs` 二维数组。它为空单元格绘制矩形，并为不同的玩家绘制颜色的圆圈。\n\
  \n为了追踪轮到谁，我使用了：\n\n```java\nplayer = (player%2) + 1;\n```\n\n`%` 运算符是模运算；它找到 *player*\
  \ 除以 2 的余数。如果 *player* 是 1，余数为 1……加 1 是 2。如果 *player* 是 2，余数是 0……加 1 是 1。我本可以使用三元运算符，但我想趁着这个练习还不晚向你们展示一个新技巧！\n\
  \n为了从数组中提取 `Location` 对象，我们使用：\n\n```java\ngame.playerAt( locs[r][c] )\n```\n\n\
  我本可以写成：\n\n```java\ngame.playerAt( new Location(r,c) )\n```\n\n然而，这每每次调用 `drawBoard()`\
  \ 都会*创建* 42 个新的 `Location` 对象，而该方法每秒大约调用 60 次。Java 运行时可能会处理并采取正确的操作，但我并不喜欢每秒创建并丢弃\
  \ 2500 个对象。\n\n我也可以直接回到 `DropGameHelper` 的代码中，添加一个接受行和列而不是 `Location` 对象的第二个 `playerAt()`\
  \ 方法。这可能也不是个坏主意。\n\n总之，这个游戏板上没有网格线。我决定为空白区域显示轮廓圆，为不同的玩家显示彩色圆，这样看起来足够漂亮，也让 `drawBoard()`\
  \ 的代码看起来很不错。\n\n## 下一步\n\n你做到了！\n\n\n\n\n如果你完成了所有的练习，通过了学习训练（Study Drills）并理解了自己在做什么，那么恭喜你！Java\
  \ 对于初学者来说并不是一门容易的语言，所以给自己鼓鼓掌吧。\n\n你现在已经掌握了 Java 面向对象编程的基础，更重要的是，你有了大量阅读代码、理解代码和修复\
  \ Bug 的经验。这些都是程序员重要的工具。凭借了这些技能，你应该能够拿起几乎任何编程书籍并游刃有余。\n\n然而，你的旅程还没有结束。输入他人的程序已经很难，但从零开始编写自己的程序要困难得多。\n\
  \n我的大多数真实学生在完成作业后，通常又练习和学习了四五，才在行业内获得工作。目前，你在两个主要方面存在短板：\n\n* 你需要更多的练习，尤其是编写自己的程序。\n\
  * 你不熟悉标准库。\n\n### 你还不标准库\n\n专业的 Java 程序员花费大量时间编写少量的代码，将他人编写的模块“粘合”在一起。其中许多内容包含在\
  \ Java 中，并可以通过 `import` 使用。\n\n### 你需要更多的练习\n\n我在公立学校教的学生确实使用书中的练习来开始学习，但并不是我要求他们做的全部。他们还必须从零开始编写大量的程序。如果你还没有完成\n\
  \n> *Programming by Doing*\n\n中的作业，我强烈建议你去完成它们。（不过，这些作业并不很面向对象。）\n\n* `CodingBat`\
  \ (`java`) - 短小且有针对性的练习题。这些对于准备计算机科学高级位分（AP）考试的学生来说是极佳的练习。\n* `Project Euler` -\
  \ 一系列具有挑战性的数学/计算机编程问题，解决这些问题不仅需要数学洞察力。虽然数学会帮助你找到优雅且高效的方法，但解决大多数问题仍然需要计算机和编程技能。\n\
  \n非常感谢你使用我的书开启你的编程之旅。请在推特上关注 @grahammitchell 并使用标签 #LJtHW 让我知道！\n\n编码愉快！\n\n– Graham\
  \ Mitchell\n\n## 笔记\n\n1 某些编程语言拥有 `pointers`（指针），它们是字面量存储内存地址的变量类型。（通常这些语言还允许进行\
  \ `pointer arithmetic`（指针算术），你可以通过数学计算到达不同的内存位置。）Java 在技术上拥有 `references`（引用），而不是\
  \ `pointers`。`pointers` 始终持有内存地址。而 `references` 可以持有内存地址，但有时也持有其他值来引用内存中的某个特定位置。有些人对这种差异非常纠结，但在本书书中，我将忽略这种区别。\n"
