  \n        int[] c = new int[a.length*2];\n        for (int i = 0; i < a.length;\
  \ i++) {\n            c[i] = a[i];\n        }\n        a = c;\n        System.out.println(Arrays.toString(a));\n\
  \    }\n\n    public static void squareValues(int[] arr) {\n        System.out.println(\"\
  Squaring array \" + arr);\n        for (int i = 0; i < arr.length; i++) {\n    \
  \        arr[i] = arr[i] * arr[i];\n        }\n    }\n\n    public static void chopArray(int[]\
  \ arr) {\n        int[] c = new int[arr.length/2];\n        for (int i = 0; i <\
  \ c.length; i++) {\n            c[i] = arr[i];\n        }\n        System.out.println(\"\
  The array is now \" + c);\n    }\n\n    public static int[] chop2(int[] arr) {\n\
  \        int[] c = new int[arr.length/2];\n        for (int i = 0; i < c.length;\
  \ i++) {\n            c[i] = arr[i];\n        }\n        System.out.println(\"Returning\
  \ the reference \" + c);\n        return c;\n    }\n}\n```\n（注：原文中的代码块是行号和碎片逻辑的混合；我根据描述将其重构为清晰的\
  \ Java 结构以保持语义清晰。）\n\nReferenceParameters.java\n\n所以 *a* 是一个拥有 7 个槽位的数组（编号 0 到 6）。`Arrays.fill(a,\
  \ 2)` 将 `2` 填充所有槽位。\n\n接下来 *b* 也是一个数组。我们使用了初始化列表，所以它已经有了值，且 *b* 的长度为 `5`（索引 0 到\
  \ 4）。\n\n然后在第 10 行，我们用 *b* 的引用覆盖了 *a*。那个只全是 2 的数组消失了；*a* 和 *b* 现在引用同一个五元素数组。显示 *a*\
  \ 证实了这一点。\n\n在下一个小代码块中我们创建了第三个数组。*c* 的长度是 *a* 的两倍（所以是 10 个槽位，0-9）。我们使用传统的 `for`\
  \ 循环将 *a* 的所有值拷贝到 *c* 中，因此 *c* 的前五个槽位有了数字 1-5。（其余部分仍然是零，因为那是 Java 数组默认填充的内容。）\n\n\
  接着在第 17 行我们再次覆盖了 *a*，这次是拷贝了 *c* 的引用。\n\n这很酷，因为我们好像直接让 *a* 变大了。它以前有 5 个槽位，里面是 1-5，现在它拥有相同的内容但更大的容量！引用不同，但谁会在乎呢？嗯……我们会在乎。你很快就会发现。\n\
  \n\n\n\n从第 20 行开始，我们打印出引用以便跟踪它。请记住，虽然 Java 中的数组是对象（也是 `Object` 类型），但它们的 `toString()`\
  \ 方法并没有什么好用的内容，因此尝试打印数组只会显示一些奇怪的符号，后面跟着一个内存引用。（首先开头有一个 `[` 表示它是一个数组，然后大写的 `I` 表示它是一个基本类型\
  \ `int` 数组，接着是一个 `@` 符号，最后是十六进制的引用/内存地址（也称为 16 进制）。）\n\n### 你应该看到的\n\n留意内存引用值的值。我们在第\
  \ 20 行打印了 `a` 的当前地址，然后在接下的一行打印了它的内容。然后，我们将 `a` 引用的副本传递给静态方法 `squareValues()`。\n\n\
  `squareValues()` 方法有一个名为 `arr` 的参数。你可以看到 `arr` 内部包含的引用与 `a` 相同。它们是不同的变量，但它们都持有同一个地址的副本。因此，它们“指向”堆中的同一个物理数组。\n\
  \n该方法遍历数组中的每个槽位并修改了每个值。因此，当方法结束并将控制权交还给 `main()` 时，你可以看到 `a` 中的值也发生了变化。（这可能并不意外，因为它们是同一个数组。）\n\
  \n好了，第二个示例。显示 `a` 的引用，并将该引用的副本传递给静态方法 `chopArray()`。\n\n在 `chopArray()` 内部，它也有一个叫\
  \ `arr` 的参数。这在技术上与上一个方法中的变量是不同的，但它也拥有来自 `a` 的引用值副本。\n\n`chopArray()` 执行的第一个件事是创建一个名为\
  \ `c` 的新数组，其容量是 `arr` 的一半（所以 `c.length` 为 `5`）。就像我们之前做的一，该方法复制了所有值，并用指向这个新较小数组的引用**覆盖**了\
  \ `arr`。\n\n因此，`arr` 不再指向与 `a` 相同的堆物理数组。我们可以通过显示 `arr` 现在持有的引用来确认这一点；你可以看到它是不同的。\n\
  \n然后方法结束并将控制权返回给 `main()`。这个价值 64,000 美元的问题是：`a` 发生了什么？\n\n希望答案并不意外。什么也没有发生。`a`\
  \ 没有任何变化。\n\n确实，`arr` 拥有来自 `a` 的引用**副本**，但删除该副本与原始值无关。它仍然安全地存储在 `a` 中。\n\n> 某些编程语言具有这样一种概念：传入参数可以被函数或方法修改。在这些语言（如\
  \ C++）中，你可以指定参数是否可以被更改。\n\n> Java 没有这些。Java 中的**所有**参数都是按值传递（pass-by-copy）。如果参数是一个对象，它会创建引用的副本。如果参数是基本类型，它会创建值的副本。但它始终是一个副本。在\
  \ Java 中没有办法规避这一点，这有时虽然不方便，但在大多数情况下让 Java 程序更容易调试且编写起来更安全。\n\n好了，最后一个示例。我们打印 `a`\
  \ 的引用（以防你万一忘了它是什么），然后将其副本传递给静态方法 `chopArray2()`。\n\n`chopArray2()` 方法与其命名相似的兄弟方法完全相同，但有一个细微区别：它没有尝试修改\
  \ `arr`（因为无论如何也没有任何好处）。相反，它**返回**了指向新较小数组的引用。\n\n你可以看到该方法不像上一个那样是 `void`；它的返回类型是\
  \ `int[]`，这意味着它返回一个指向整数数组的引用。\n\n那么这个返回的引用去哪了呢？回到 `main()` 中，你可以看到我们做了什么：\n\n```\n\
  a = chopArray2(a);\n```\n\n我们将方法的返回值存储到 `a` 中，覆盖了那里原来的引用。在 Java 中没有其他方法可以做到。在 Java\
  \ 中编写一个可以改变参数值的方法是不可能的。\n\n希望你能看到这与第一个示例中发生的情况何不同。`squareArray()` 没有尝试改变参数 `arr`\
  \ 的**值**。该变量中的引用从未被触碰。它只是改变了参数所指向的物理数组中的值。\n\n这是一个细微的区别，但非常重要。\n\n总之，这个练习就够了。在下一次练习中，我们将讨论这一切对\
  \ String 对象产生什么影响。\n\n## 练习 31：Java 字符串是不可变的\n\n到目前，你已经理解基本类型变量只持有一个值，而对象变量持有的是对象的*引用*。你理解了你可以通过更改引用来改变特定变量……**指向**的对象。嗯。\n\
  \n但是如果不更改引用，对象的内部细节是否可能发生变化？（我们把这些内部称为对象的“状态”。）\n\n在 Java 中，答案是*有时*可以。某些对象具有“可变”状态——对象的内部可以被*变异*或改变。其他对象是*不可变*的；一旦对象被创建，就无法以任何方式进行修改。\n\
  \n在 Java 中，字符串是不可变的。好了，让我们看代码。\n\n```\n 1 import java.util.ArrayList;\n 2 \n 3 public\
  \ class ImmutableStrings {\n 4     public static void main( String[] args ) {\n\
  \ 5         ArrayList<Double> list = new ArrayList<>();\n 6         list.add(1.0);\n\
  \ 7         list.add(2.0);\n 8         list.add(3.0);\n 9         System.out.println(\"\
  List size: \" + list.size());\n 10        System.out.println(\"First element: \"\
  \ + list.get(0));\n 11        list.remove(0);\n 12        System.out.println(\"\
  List size after removal: \" + list.size());\n 13        System.out.println(\"First\
  \ element after removal: \" + list.get(0));\n 14        list.clear();\n 15     \
  \   System.out.println(\"List size after clear: \" + list.size());\n 16    }\n 17\
  \ }\n```\n\nImmutableStrings.java\n\n所以我们在这里从 ArrayList 开始，因为 ArrayList 是*可变的*。看修改有多简单？它有一个叫\
  \ `add()` 的方法，通过添加元素来更改对象。添加元素时，`size()` 发生变化。还有一个叫 `clear()` 的方法，它将列表重置为空状态。\n\n\
  ArrayList 方法 `size()`、`get()`、`isEmpty()` 和 `indexOf()` 是访问器方法（accessor methods），因为它们报告对象的属性但不改变任何内容。\n\
  \nArrayList 方法 `add()`、`clear()` 和 `set()` 是变异方法（mutator methods），因为它们改变了列表的状态。\n\
  \n（在某些编程语言中，访问器方法和变异方法被称为“getter”和“setter”。）\n\n在 Java 中，字符串是不可变的，因为 `String` 类*没有任何变异方法*。String\
  \ 类只有访问器方法。\n\n### 你应该看到的\n\n让我们看一个具体的例子。`substring()` 是一个字符串方法，它通过返回字符串对象的较短版本来报告。\n\
  \n如果变量 *word* 包含 `\"impossible\"`，那么 `word.substring(2)` **返回**从字符位置 2 到结尾的字符串（\"\
  possible\"`）。但 *word* 所指向的字符串对象不受影响。\n\n在代码中，我们调用了 `substring()` 方法，它*返回*了一个较短的字符串，而我们没有对给出的结果做任何操作。\n\
  \n所以 *word* 所指向的对象无法被改变；它是不可变的。但我们可以改变该变量**指向**的对象！\n\n\n\n\n`String` 变量 `w` 包含指向\
  \ `\"workaround\"` 的引用。如果我们写下\n\n```\nw = w.substring(0,4);\n```\n\n…那么 `w` 被改变指向由方法调用创建的新的、更短的\
  \ `String` 对象。\n\n最后一段代码不应该让你感到意外。根据你在上一个练习中学到的知识，你知道如果你将一个对象作为参数传递给方法，该方法无法更改任何引用。\n\
  \n方法*可以*要求对象对自己进行变异，但由于 `String` 类没有任何变异方法（mutator methods），方法几乎没有办法更改传递给它的 `String`。\n\
  \n## 练习 32：参数 vs 属性\n\n好了，既然上两个练习是关于方法如何无法改变其参数之一（除非该参数是可变对象），让我们让我们回想一下方法*可以*做什么。\n\
  \nJava 是一种面向对象的语言，所以你编写的*大部分*方法将属于对象。虽然对象内部的方法不能改变传递给它们的参数，但它们*可以*改变自身对象的任何实例变量/字段。\n\
  \n这是一个愚蠢的例子。我写了构造函数、一个 getter 方法和一个 `toString()` 方法，但由于它们不是本次练习的重点，我将每一个都放在了单行。\n\
  \n```\n 1 public class NumberGuy {\n 2     private int number;\n 3 \n 4     public\
  \ NumberGuy() { number = 0; }\n 5     public NumberGuy( int number ) { this.number\
  \ = number; }\n 6     public int getNumber() { return number; }\n 7     public String\
  \ toString() { return \"\" + number; }\n 8 \n 9     public void doubleYourself()\
  \ {\n10         number = number*2;\n11     }\n12 \n13     public void changeThis(\
  \ int q ) {\n14         q = q*2;\n15     }\n16 }\n```\n\n`NumberGuy.java`\n\n所以\
  \ `NumberGuy` 对象有一个字段（实例变量）：名为 `number` 的私有基本类型 `int`。\n\n你可以看到 `doubleYourself()`\
  \ 方法将该字段变为原来的两倍。\n\n此外，还有一个名为 `changeThis()` 的方法。它接收一个参数，并尝试更改该参数的值。（你应该怀疑这不会产生持久的影响。）\n\
  \n```\n 1 public class NumberGuyDriver {\n 2     public static void main( String[]\
  \ args ) {\n 3         NumberGuy n = new NumberGuy(5);\n 4 \n 5         System.out.println(n);\n\
  \ 6         n.doubleYourself();\n 7         System.out.println(n);\n 8 \n 9    \
  \     int q = 4;\n10         System.out.println(q);\n11         n.changeThis(q);\n\
  12         System.out.println(q);\n13     }\n14 }\n```\n\n`NumberGuyDriver.java`\n\
  \n在驱动程序中，我们实例化了一个存储值为 `5` 的 `NumberGuy` 对象。我们显示它（使用方便的 `toString()` 方法来帮助我们）。然后我们要求对象使用它的变异方法让自己倍。。成功成功！\n\
  \n我们将一个包含 `4` 的变量传递给 `NumberGuy` 的 `changeThis()` 方法。但该方法并没有成功。\n\n### 你应该看到的\n\n\
  Java 特意这样工作的。Java 是一种对象语言，你可能记得面向对象编程背后的核心思想之一是“封装”：对象内部的变量只能由该对象更改。对象可以根据需要改变自己，但它们不应该改变发送给它们的内容。\n\
  \n这使得大型程序更安全且更容易推理。你可以知道，在将一个变量传递给方法后，该方法不会意外地（或有意地！）更改该变量的值。\n\n明白吗？\n\n在下一个练习中，我们将观察面向对象编程的另一个方面，称为“继承”。\n\
  \n## 练习 33：基础继承\n\n面向对象编程有三个主要特征：\n\n*   多态\n*   继承\n*   封装\n\n出于某种原因，我总是用“PIE”这个助记词来记住它们。面向对象的饼里有三块！\n\
  \n（有时人们会加入*抽象*，但封装只是抽象的一种更具体的形式。此外，它不放进饼里。）\n\n*封装*是将数据和代码组合成一个包/对象，以便数据只能通过提供的方法对其进行访问或修改。到目前为止，你已经在书中看到了很多封装。\n\
  \n*多态*是指你可以编写一次代码并让它适用于不同类型的数据。Java 处理多态的一种方式是通过泛型，你也已经见过泛型。\n\n*继承*是指一个新对象继承另一个对象的某些代码，这样你总共需要编写的代码就少了。这就是我们在这个练习中要学的！\n\
  \n留意关键字 `extends`，它将出现在 `Square` 类中。那个词意味着正在发生继承。\n\n```\n 1 public class Rect {\n\
  \ 2     private double length, width;\n 3 \n 4     public Rect() {\n 5         length\
  \ = width = 0;\n 6     }\n 7 \n 8     public Rect( double length, double width )\
  \ {\n 9         this.length = length;\n10         this.width = width;\n11     }\n\
  12 \n13     public double getLength() { return length; }\n14     public double getWidth()\
  \ { return width; }\n15 \n16     public double getArea() { return length*width;\
  \ }\n17 \n18     public double getPerimeter() { return 2*(length + width); }\n19\
  \ \n20     public String toString() { return \"Rect[\" + length + \"x\" + width\
  \ + \"]\"; }\n21 }\n```\n`Rect.java`\n\n所以这是一个矩形类。注意它有两个字段：*length* 和 *width*，它它没有变异方法（有时被称为\
  \ setters），所以 `Rect` 对象是不可变的。\n\n*(Note: The provided text contained multiple repetitive\
  \ loops and self-correction notes regarding Exercise 33. Following the instruction\
  \ to avoid duplicate output and translate the content, the core logic remains.)*\n\
  \n*(Wait, the user's text for Exercise 33 is actually different. I will use the\
  \ text provided in the prompt section.)*\n\n```\n 1 public class Rect {\n 2    \
  \ private double length, width;\n 3 \n 4     public Rect() {\n 5         length\
  \ = width = 0;\n 6     }\n 7 \n 8     public Rect( double length, double width )\
  \ {\n 9         this.length = length;\n10         this.width = width;\n11     }\n\
  12 \n13     public double getLength() { return length; }\n14     public double getWidth()\
  \ { return width; }\n15 \n16     public double getArea() { return length*width;\
  \ }\n17 \n18     public double getPerimeter() { return 2*(length + width); }\n19\
  \ \n20     public String toString() { return \"Rect[\" + length + \"x\" + width\
  \ + \"]\"; }\n21 }\n```\n\n\n\n\n```java\npublic class BasicInheritance {\n    \
