  \\tPerimeter: \" + sq1.getPerimeter());\n\n         Rect r = new Rect();\n     \
  \    Rect s = new Square(2);\n         System.out.println(\"\\n\" + r + \", and\
  \ \" + s);\n\n         r = s;\n         System.out.println(\"\\nHere is my rectangle:\
