  \ 42：DropGame 和断言\n\n在这个练习中，我们将编写一个类似于 Milton Bradley 的四连棋游戏代码。\n\n两个玩家交替向网格中投入棋子。获胜者是第一个让一个棋子与其三个邻居匹配的人。（与四连棋不同，我们的游戏不检查四连。）\n\
  \n就像我们之前处理 NoughtsAndCrosses 一样，我们将创建一个包含游戏大部分规则的对象。\n\n在在这里寻找 `assert` 关键字；它是新的！\n\
  \n\n\n\n\n```java\npublic class DropGameHelper {\n    private DropGamePiece[][]\
  \ board;\n    private int numRows, numCols;\n\n    public DropGameHelper( int numRows,\
  \ int numCols ) {\n        board = new DropGamePiece[numRows][numCols];\n      \
  \  this.numRows = numRows;\n        this.numCols = numCols;\n\n        for ( int\
  \ r=0; r<numRows; r++ )\n            for ( int c=0; c<numCols; c++ )\n         \
  \       board[r][c] = null;\n    }\n\n    public int numRows() { return numRows;\
  \ }\n    public int numCols() { return numCols; }\n\n    public boolean isWinner(\
  \ String p ) {\n        for ( int r=0; r<numRows; r++ )\n            for ( int c=0;\
  \ c<numCols; c++ )\n                if ( winCheck(p, board[r][c]) )\n          \
  \          return true;\n        return false;\n    }\n\n    private boolean winCheck(\
  \ String p, DropGamePiece piece ) {\n        if ( piece == null )\n            return\
  \ false;\n        if ( ! p.equals(piece.getSymbol()) )\n            return false;\n\
  \        Location loc = piece.getLocation();\n        if ( ! isValid(loc) )\n  \
  \          return false;\n\n        Location left, right, below, above;\n      \
  \  int adjacentCount = 0;\n        left = loc.left();\n        right = loc.right();\n\
  \        below = loc.below();\n        above = loc.above();\n        if ( isValid(left)\
  \ && p.equals(this.playerAt(left)) )\n            adjacentCount++;\n        if (\
  \ isValid(right) && p.equals(this.playerAt(right)) )\n            adjacentCount++;\n\
  \        if ( isValid(below) && p.equals(this.playerAt(below)) )\n            adjacentCount++;\n\
  \        if ( isValid(above) && p.equals(this.playerAt(above)) )\n            adjacentCount++;\n\
  \n        return adjacentCount >= 3;\n    }\n\n    public boolean isFull() {\n \
  \       int usedCount = 0;\n        for ( int r=0; r<numRows; r++ )\n          \
  \  for ( int c=0; c<numCols; c++ )\n                if ( board[r][c] != null )\n\
  \                    usedCount++;\n\n        return usedCount == numRows*numCols;\n\
  \    }\n\n    public boolean isFull(int col) {\n        assert isValid(col);\n \
  \       int nullCount = 0;\n        for ( int r=0; r<numRows; r++ )\n          \
  \  if ( board[r][col] == null )\n                nullCount++;\n\n        return\
  \ nullCount == 0;\n    }\n\n    public boolean isValid( Location loc ) {\n     \
  \   return ( 0 <= loc.row && loc.row < numRows\n              && 0 <= loc.col &&\
  \ loc.col < numCols\n        );\n    }\n\n    public boolean isValid( int col )\
  \ {\n        return ( 0 <= col && col < this.numCols );\n    }\n\n    public String\
  \ playerAt( Location loc ) {\n        if ( isValid(loc) && board[loc.row][loc.col]\
  \ != null )\n            return board[loc.row][loc.col].getSymbol();\n        else\
  \ if ( isValid(loc) && board[loc.row][loc.col] == null )\n            return \"\
  \ \";\n        else\n            return \"ERROR:\" + loc;\n    }\n\n    public String\
  \ toString() {\n        String out = \"\", line;\n        for ( int r=0; r<numRows;\
  \ r++ ) {\n            line = \"|\";\n            for ( int c=0; c<numCols; c++\
  \ ) {\n                DropGamePiece piece = board[r][c];\n                if (\
  \ piece == null )\n                    line += \"_|\";\n                else\n \
  \                   line += piece.getSymbol() + \"|\";\n            }\n        \
  \    out += line + \"\\n\";\n        }\n        // 在每列下绘制数字\n        line = \"|\"\
  ;\n        for ( int c=0; c<numCols; c++ )\n            line += c + \"|\";\n   \
  \     out += line + \"\\n\";\n        return out;\n    }\n\n    private int findLowestEmptyRow(\
  \ int col ) {\n        assert isValid(col);\n        assert ! isFull(col);\n   \
  \     int row = numRows-1;\n        while ( board[row][col] != null )\n        \
  \    row--;\n        return row;\n    }\n\n    public void playMove( String p, int\
  \ col ) {\n        assert isValid(col);\n        assert ! isFull(col);\n       \
  \ int row = findLowestEmptyRow(col);\n        board[row][col] = new DropGamePiece(row,\
  \ col, p);\n    }\n}\n```\n\n```java\nimport java.util.Scanner;\n\npublic class\
  \ DropGameConsole {\n    public static void main( String[] args ) {\n        Scanner\
