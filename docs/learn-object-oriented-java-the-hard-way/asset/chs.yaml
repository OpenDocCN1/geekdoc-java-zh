  \ \"\\tFastest time: \" + fastest + \" milliseconds.\" );\n62         System.out.println(\
  \ \"\\tSlowest time: \" + slowest + \" milliseconds.\" );\n63     }\n64     static\
  \ void selectionSortPrimitives(int[] arr) {\n65         for ( int i=0; i<arr.length-1;\
  \ i++ ) {\n66             int min = i;\n67             for ( int j=i+1; j<arr.length;\
