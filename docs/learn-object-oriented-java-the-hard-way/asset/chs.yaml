  到目前为止，我对变量的描述还比较笼统。变量是你储存值的地方。它们有一个名称（标识符）、一个类型（`int` 或 `double`）以及——最终有一个值。\n\n\
  我认为你已经写了足够久的代码，准备好面对更多细节了。输入代码，然后我们再讨论。\n\n```java\n 1 public class PrimitivesInMemory\
