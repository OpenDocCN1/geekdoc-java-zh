  ### StringFunOODriver.java\n\n#### 你应该看到的（提醒）\n\n（这里再次提供了输出，这样你就不需要向上滚动了。）\n\n这是非常典型的面向对象代码。第\
  \ 11 行声明并实例化了一个对象。第 12 行调用该对象的 `setMessage()` 方法，并将消息作为参数传递进去。然后接下来的几次变化发生在对象*内部*：消息被反转，然后消息被转换为驼峰命名法。\n\
  \n最后在驱动程序的第 17 行，我们调用该对象的 `getMessage()` 方法，它向我们返回修改后的 String 用于打印。\n\n也许你不喜欢面向对象的风格。也许你认为单体版本更好，或者也许认为函数式版本更好。\n\
  \n你知道吗？我同意你的观点。面向对象编程并不非常适合这种微型程序。当程序规模很大且复杂时（例如 10,000 行代码或更多），OOP 的效果最好。\n\n每当*我*\
  \ 写一个程序来帮助自己自动化某些烦人的事情时，如果代码只有 500 行或更少，我几乎不会用面向对象的风格编写。\n\n如果代码只有 10-50 行，我会用单体风格编写。如果在\
  \ 50-500 行，我会使用函数；如果比这大得多，我将开始使用面向对象风格。\n\n遗憾的是，这本书的其余部分将会有点奇怪。即使是只有 20 行的微型程序，我也将使用面向对象的风格。这会很糟糕。你可能不喜欢它。你可能会想：“如果他只是……，这个程序就会*简单得多*。”\n\
  \n但我不能只通过编写巨大的、完美的 1,000 行代码来教你面向对象编程。\n\n## 练习 6：访问字段\n\n在这个练习中，我们将更深入地观察拥有字段的对象。这里是对象的源码：\n\
  \n```java\n 1 public class Repeater {\n 2 \n3     String phrase;\n 4     int repeats;\n\
  \ 5 \n6     public void setValues( String p, int r ) {\n 7         phrase = p;\n\
  \ 8         repeats = r;\n 9     }\n10 \n11     public String getRepeatedPhrase()\
  \ {\n12         String result = \"\";\n13         for ( int i=0; i<repeats; i++\
  \ )\n14             result += phrase;\n15         return result;\n16     }\n17 }\n\
  ```\n\nRepeater.java\n\n这个类有两个字段，一个名为 `phrase` 的 String 和一个名为 `repeats` 的 int。记住，如果我们在驱动中实例化多个版本，每个实例将拥有自己的。\n\
  \n> “实例变量”是定义在类中但在方法之外的变量。“字段”只是类成员的通用名称。它们的意思几乎相同，所以我交替使用。\n\n以防你没从上一个练习中记得，这些属于整个类。\n\
  \n第 6-9 行实现了一个名为 `setValues()` 的方法。它从外部世界接收两个值：一个称为 `p` 的 String 和一个称为 `r` 的整数。\n\
  \n在第 7 行，我们将 `p` 的值拷贝存储到实例变量 `phrase` 中，在下一行我们将 `r` 的值存储到 `repeats` 中。在第 9 行之后，参数变量\
  \ `p` 和 `r` 就消失了；这些名字在方法之外没有任何意义。这个方法是 `void`，所以它不向外部世界返回任何值。\n\n第 11 到 16 行包含了名为\
  \ `getRepeatedPhrase()` 方法的实现，它构建并返回一个 String 值的拷贝。\n\n在第 12 行，我们从一个新 String `result`\
  \ 开始，它被初始化为“空字符串”（我们称之为一个没有字符的 String 值）。\n\n第 13 行设置了一个 `for` 循环，它将执行循环体 `repeats`\
  \ 次。也就是说，如果 `repeats` 的值是 `4`，循环将运行四次。循环中没有大括号，所以循环的主体只有单行：`result += phrase;`，这会将\
  \ `phrase` 值的拷贝添加到 `result` 中现有内容的末尾。\n\n当循环结束，`result` 现在包含了多个 `phrase` 的拷贝。\n\n\
  \n\n\n最后，在第 15 行，本地变量 `result` 中的 `String` 副本被返回到外部世界。该方法返回一个 `String`，这就是为什么方法的第一行写的是\
  \ `public String getRepeatedPhrase()` 而不是 `public void getRepeatedPhrase()`。\n\n\
  （注意，该方法并没有*返回变量 `result` 本身；它仅仅返回了该变量中 `value` 的副本。）\n\n好了，这里是驱动代码：\n\n```\n 1 import\
  \ java.util.Scanner;\n 2 \n 3 public class PhraseRepeaterDriver {\n 4     public\
  \ static void main( String[] args ) {\n 5         Scanner keyboard = new Scanner(System.in);\n\
  \ 6 \n 7         System.out.print(\"Enter a message: \");\n 8         String msg\
  \ = keyboard.nextLine();\n 9         System.out.print(\"Number of times: \");\n\
  10         int n = keyboard.nextInt();\n11 \n12         PhraseRepeater pr = new\
  \ PhraseRepeater();\n 13         pr.setValues(msg, n);\n 14         System.out.println(\
  \ pr.getRepeatedPhrase() );\n 15     }\n 16 }\n```\n\n`PhraseRepeaterDriver.java`\n\
  \n### 你应该看到的内容\n\n如果你已经学了一段时间 Java，那么驱动程序的前十行非常直观：它们允许人类输入一些值，这些值被存储在本地变量 `msg`\
  \ 和 `n` 中。\n\n然后在第 12 行，我们实例化 `PhraseRepeater` 对象的副本，并将其引用存储在变量 `pr` 中。\n\n接着在第\
  \ 13 行，我们调用该对象的 `setValues()` 方法，传入我们本地变量的副本。驱动程序并不知道对象内部的实例变量命名为 `phrase` 和 `repeats`。驱动程序不在乎它们叫什么。\n\
  \n驱动程序不知道 `setValues()` 方法的参数会被命名为 `p` 和 `r`。这对驱动程序来说没有区别。只有对象本身关心这些变量被称为什么。\n\n\
  这种“不在乎”的态度是面向对象编程使得编写和调试非常大型复杂程序变得更容易的原因之一。\n\n无论如何，驱动程序最后一行有用的代码是第 14 行，它调用了 `getRepeatedPhrase()`\
  \ 方法。该方法返回一个 `String`，而返回的 `String` 被交给 `println()` 用于……打印。\n\n注意 `setValues()`\
  \ 方法*改变*了对象内部的某些内容。在调用方法后，对象中的字段发生了变化。因此，以某种方式改变对象内部状态的方法通常被称为“修改方法”（modifier methods）或“变器方法”（mutator\
  \ methods）。\n\n另一方面，`getRepeatedPhrase()` 方法*没有改变*对象内部的任何内容；两个实例变量都被使用了，但没有被修改。不过该方法确实返回了一个值，让你了解对象的内部状态。这样的方法通常被称为“访问方法”（accessor\
  \ methods），因为它们允许驱动程序以某种方式访问字段。\n\n## 练习 7：封装与自动化测试\n\n这个练习的 OOP 部分并不比上一个练习更难。有两个字段被变器方法改变，并被访问器方法访问（但不改变）。\n\
  \n但在驱动程序中……哦，你将会看到的。\n\n```\n 1 public class SquareRootFinder {\n 2 \n 3     double\
  \ n;\n 4     int iterations;\n 5 \n 6     public void setNumber( double number )\
  \ {\n 7         n = number;\n 8         iterations = 7;\n 9         if ( n < 10\
  \ )\n10             iterations++;\n 11     }\n 12 \n13     public double getRoot()\
  \ {\n 14         double x = n/4;\n 15         for ( int i=0; i<iterations; i++ )\
  \ {\n 16             x = (x+(n/x))/2.0;\n 17         }\n 18         return x;\n\
  \ 19     }\n 20 }\n```\n\n`SquareRootFinder.java`\n\n所以，这里没什么新奇。`SquareRootFinder`\
  \ 类有两个实例变量 `n` 和 `iterations`。`setNumber()` 方法允许类的用户传入一个值，该值会被复制到字段 `n` 中。\n\n然后\
  \ `getRoot()` 方法进行了一些复杂的计算，以计算该数字平方根的估计值。它有效吗？有效。*是如何*工作的？这就是编程的奇妙之处。有时你并不知道。\n\n\
  继续输入驱动代码，然后我们继续这个思路。\n\n```\n 1 import java.util.Scanner;\n 2 \n 3 public class\
  \ SquareRootDriver {\n 4     public static void main( String[] args ) {\n 5    \
  \     Scanner keyboard = new Scanner(System.in);\n 6         double n;\n 7 \n 8\
  \         SquareRootFinder sqrt = new SquareRootFinder();\n 9 \n10         do {\n\
  \ 11             System.out.print(\"Enter a number (or <=0 to quit): \");\n 12 \
  \            n = keyboard.nextDouble();\n 13 \n 14             if ( n > 0 ) {\n\
  \ 15                 sqrt.setNumber(n);\n 16                 System.out.println(\
  \ sqrt.getRoot() );\n 17             }\n 18         } while ( n > 0 );\n 19    \
  \ }\n 20 }\n```\n\n`SquareRootDriver.java`\n\n### 你应该看到的内容\n\n`SquareRootFinder`\
  \ 类有两个实例变量 `n` 和 `iterations`。`setNumber()` 方法允许类的用户传入一个值，该值会被复制到字段 `n` 中。\n\n然后\
  \ `getRoot()` 方法进行了一些复杂的计算来计算该数字平方根的估计值。它有效吗？有效。*是如何*工作的？这就是编程的奇妙之处。有时你并不知道。\n\n\
  那么，创建类的人是如何知道 `iterations` 是正确的？我测试过。测试了很多。不是只了几个数字，而是：\n\n```\n 1 public class\
  \ SquareRootTester {\n 2     public static void main( String[] args ) {\n 3    \
  \     SquareRootFinder sqrt = new SquareRootFinder();\n 4 \n 5         double max\
  \ = 0, maxN = 0;\n 6         double fakeroot, realroot, diff;\n 7 \n 8         System.out.print(\"\
  Testing algorithm... \");\n 9         for ( double n = 0; n<=2000; n += 0.01 ) {\n\
  \ 10             sqrt.setNumber(n);\n 11             fakeroot = sqrt.getRoot();\n\
  \ 12             realroot = Math.sqrt(n);\n 13             diff = Math.abs( fakeroot\
  \ - realroot );\n 14             if ( diff > max ) {\n 15                 max =\
  \ diff;\n 16                 maxN = n;\n 17             }\n 18         }\n 19 \n\
  \ 20         if ( max > 0.000001 ) {\n 21             System.out.println(\"FAIL\"\
  );\n 22             System.out.println(\"Worst difference was \" + max + \" for\
  \ \" + maxN );\n 23         }\n 24         else\n 25             System.out.println(\"\
  PASS\");\n 26     }\n 27 }\n  28 }\n```\n\n`SquareRootTester.java`\n\n### 如果运行测试程序你会看到什么\n\
  \n在我的测试程序中，我将 `getRoot()` 方法的输出与 Java 内置的 `Math.sqrt()` 计算的真实平方根进行比较。我测试了从 0 到 2000\
  \ 的每一个数字，步长为 0.01。对于每个数字，我找到“我的”平方根与真实平方根之间的绝对差，如果最大差异大于 0.000001，那么我会抛出一个错误。\n\n\
  \n\n\n反复运行此程序允许我测试不同的内容。变量 `x` 是我对平方根的初始估计；我最初将 `x` 设置为 `n`，但随着 `n` 变大，这开始变得不准确。将\
  \ `x` 起于 `n/2` 更好，但这样对于非常小的 `n` 值就会不准确。\n\n我发现的最佳折中方案是从 `n/4` 开始猜测，这使得我在范围内的每个数字在七次迭代内都能得到足够接近的结果。*除了*\
  \ 0 到 1 之间的 `n` 值（此时 ![\\sqrt{n} > n](img/leanpub_equation_0.png)）。我最终放弃了，并决定给小数字多增加一次迭代，以补偿我在这些情况下糟糕的初始估计。\n\
  \n通常情况下（至少对于设计良好/管理良好的软件而言），创建该类的人或团队中的其他成员会为该类设计一个“测试套件”。例如，`SQLite`（可以嵌入到其他软件中的数据库）以测试非常充分而闻名。引用自《SQLite\
  \ 如何进行测试》：\n\n> SQLite 的可靠性和健壮性部分通过详尽且仔细的测试得以。\n\n> 截至 3.8.10 版本，SQLite 库包含约 94.2\
  \ KSLOC 的 C 代码。（KSLOC 意味着数行“源代码”，换句话说，就是排除空行和注释的代码行。）相比之下，项目的测试代码和测试脚本是其 971 倍——91515.5\
  \ KSLOC。\n\n每当 `SQLite` 的维护者修复漏洞或进行改进时，他们都会运行完整的测试套件，以确保他们没有意外破坏其他内容！这是一个好主意，而且\
  \ OOP 强制你使用的模块化设计使得这种测试成为可能。\n\n## 练习 8：未能进行封装\n\n在上一个练习中，我们查看了极端测试以及封装如何使这一切成为可能。在这一次，我们将看到在字段和方法上可以进行的一些权衡。\n\
