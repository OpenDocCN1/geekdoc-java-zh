  \n### 你应该看到的\n\n这个练习从创建一个 `String` 对象的 `ArrayList` 开始。列表初始是空的，但然后我们迅速添加了五个值。\n\n\
  很容易假装在那些代码行之后，`ArrayList` 包含了如下值：\n\n| 0 | 1 | 2 | 3 | 4 |\n| --- | --- | --- |\
  \ --- | --- |\n| `fez` | `bowler` | `beanie` | `western` | `fedora` |\n\n事实上，`ArrayList`\
  \ 类的 `toString()` 方法也让它看起来像那样。\n\n但实际上，`ArrayLists` 只持有 `references`（引用）。所以真实的情况更像这样：\n\
  \n| 0 | 1 | 2 | 3 | 4 |\n| --- | --- | --- | --- | --- |\n| @d70 | @a60 | @868 |\
  \ @db0 | @338 |\n\n`ArrayList` 对象中的每个槽位都包含一个 `reference`（引用），而不是字符串字面量。字符串 `values`\
  \ 实际上存储在引用的内存位置上。\n\nJava 花了很大努力来隐藏 `Strings` 有时是引用的事实，这样你就可以在了解它们的情况下编写许多运行正常的代码。\n\
  \n当你想要创建一个持有原始整数的 `ArrayList` 时，问题就出现了。第 21 行被注释掉的代码显示了我们 `want`（想要）写的内容。但我们必须写的是第\
  \ 22 行……因为 `ArrayLists` 只能持有引用。\n\n`int` 是一个原始类型。`Integer` 是一个包含单个 `int` 的对象。Java\
  \ 将此称为“包装”（wrapper）类，因为它是一个包裹在原始类型上的非常薄的层。\n\n我们想向 `ArrayList` 中添加四个 `int`。但我们必须\
