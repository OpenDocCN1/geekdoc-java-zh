  \ Math.E ); // valueOf() 是静态的\n24         int num = Math.min(17, digits.length());\n\
  25         String mitchell = digits.substring(0,num); // substring() 不是静态的\n26 \
  \        System.out.println(\"Mr. Mitchell has \" + mitchell + \" memorized.\");\n\
