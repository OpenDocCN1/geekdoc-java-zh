  \ 对象（每个 `TVActor` 两个）。\n\n## 练习 5：编程范式\n\n在我深入研究面向对象编程 (OOP) 细节之前，查看 OOP 风格代码与其它编程范式中实现相同程序之间的区别可能会很有用。\n\
  \n我创建了一个执行四件事的小程序：\n\n1. 允许人类输入消息。\n2. 反转消息中字符的顺序。\n3. 对每个单词进行“驼峰命名”（Camel-case）。也就是说，将“Hello\
  \ how are you” 转换为“HelloHowAreYou”。\n4. 显示结果。\n\n首先，这是一个使用 Java 尽可能允许的简单单体风格的程序。除非你真的想写，否则不需要输入这个程序。\n\
  \n```\n 1 import java.util.Scanner;\n 2 \n3 public class StringFunMonolith {\n 4\
  \     public static void main( String[] args ) {\n 5         Scanner keyboard =\
  \ new Scanner(System.in);\n 6 \n 7         // input it\n 8         System.out.print(\"\
  Enter a message: \");\n 9         String msg = keyboard.nextLine();\n10 \n 11  \
  \       // reverse it\n 12         String rev = \"\";\n 13         for ( int i=msg.length()-1;\
