  \  \nc.radius = 0.1;    // <-- 明明写这个要**容易得多**？\n```\n\n这样效率更高，对吧？既然你可以直接给变量赋值，谁又想去调用一个方法呢？！我这哥们才不想！\n\
  \n不管如何，希望这说明了那个“问题”。至于解决方案，你需要在下一个练习中再回来。\n\n## 练习 9：私有字段和构造函数\n\n假设你已经完成了上一个练习，你已经看到，如果直接修改类的字段而不是通过它们的方法，某些类将无法正常工作。在本次练习中，你将学习如何停止这种行为。\n\
  \n你还将学习一些能让别人更容易`use` 你的类并且让它更安全的东西。\n\n```\n 1 public class SphereCalc3 {\n 2 \
  \    private double radius, area, volume;\n 3 \n 4     public void setRadius( double\
  \ r ) {\n 5         radius = r;\n 6         area = 4*Math.PI*r*r;\n 7         volume\
  \ = 4*Math.PI*Math.pow(r,3) / 3.0;\n 8     }\n 9 \n10     public double getRadius()\
  \      { return radius; }\n11     public double getSurfaceArea() { return area;\
  \   }\n12     public double getVolume()      { return volume; }\n13 }\n```\n\n`SphereCalc3.java`\n\
  \n这基本上是 `SphereCalc2` 的缩减版。当你在方法中所做的只是返回单个变量的值时，Java 程序员通常会将所有的“getter”方法写在同一行，就像我在第\
  \ 10-12 行写的那样。\n\n所以，唯一`有趣`的变化是在第 2 行的开头：关键字 `private`。\n\n从你写第一个 Java 程序开始，多亏于\
  \ `public static void main`，一直在把东西设为 `public`，所以也许你已经怀疑了。\n\n实例变量通常被设为 `private`。事实上，几乎总是如此。（你也可以将方法指定为私有而不是公共，但我们一段时间内不会看到那例子。）\n\
  \n私有意味着“别碰！”。任何私有变量都无法在定义它的类之外的任何地方被访问。\n\n在`Inside`类内部，私有变量的工作方式与我们一直使用的字段完全一样；类内部任何方法都可以自由地更改或访问私有变量。\n\
  \n> “public”和“private”在 Java 中被称为“访问级别修饰符”。当你漏掉它们时（就像我们从第 4 练习以来对字段所做的那样），默认访问权限被称为“包级私有”（package-private），这意味着它们对于同一个“包”内的任何内容都是可访问的。我们到为止编写的所有类都在同一个包中，但在接近书末之前，我们不会对此做任何处理。\n\
  \n> 所以对于我们的目的，“public”变量和没有`no`包修饰符的变量是等价的：它们可以从类的`outside`被访问或更改。这是一件坏事。\n\nJava\
  \ 程序员对将字段设为私有通常非常严格。事实上，在大学高级计算机科学（Advanced Placement Computer Science）考试中，未能将实例变量标记为私有是一个非常严重的错误，以至于即使你的解决方案其他所有部分都是完美的，它也会让你丢失该题目超过\
  \ 10% 的分值！\n\n总之，回到主点。现在字段是私有的，使用 `SphereCalc3` 类的代码没有选择；它们`only`能通过 `setRadius()`\
  \ 方法更改半径。尝试直接这样做甚至无法编译。\n\n```\nSphereCalc3 sph = new SphereCalc3();  \nsph.radius\
  \ = 7;   // <-- 这甚至无法编译。  \nsph.setRadius(7); // 这当然工作得很好。  \nSystem.out.println(\
  \ sph.radius ); // 仍然无法编译\n```\n\n如你所见，即使你没有尝试`change` 实例变量，这种情况也适用。`private` 不仅仅防止修改字段，还防止访问它。这就是为什么你必须为每个你想要可访问的变量编写公共的“getter”方法。\n\
  \n某些编程语言（如 C#）处理这个问题的方法略有不同；你可以将变量标记为只读，这样它们就无法从类外部被`changed`（只能通过方法），但仍然可以被读取。其他语言有一种方法可以让`look`\
  \ 像你正在直接访问变量，但它们实际上在秘密运行一个方法来设置或读取变量。\n\n在 Java 中，带有 setter 和 getter 的私有字段是唯一的良好解决方案。\n\
  \n现在，在我们继续之前，还有一个潜在的问题。必须总是记住在做任何其他事情之前调用 setter 方法有一点烦人。看一看过去几次练习中的例子：\n\n```\n\
  SphereCalc sph = new SphereCalc();  \nsph.setRadius(5);  \n// 现在可以安全地使用 SphereCalc\
  \ 中的其他方法了  \n//\nSquareRootFinder srf = new SquareRootFinder();  \nsrf.setNumber(n);\
  \  \n// 现在可以安全使用 SquareRootFinder 中的其他方法了  \n//\nPhraseRepeater pr = new PhraseRepeater();\
  \  \npr.setValues(msg, n);  \n// 现在可以安全使用 PhraseRepeater 中的其他方法了  \n//\nStringFunObject\
  \ sfo = new StringFunObject();  \nsfo.setMessage(msg);\n```\n\n这不仅很烦人，而且不`safe`，但忘记调用\
  \ `setNumber()` 或 `setValues()` 将无法工作。幸运的是，有一个解决方案！一种特殊的“构造函数”。这是一个例子：\n\n```\n\
  \ 1 public class SphereCalc4 {\n 2     private double radius, area, volume;\n 3\
  \ \n 4     public SphereCalc4( double r ) {\n 5         radius = r;\n 6        \
  \ area = 4*Math.PI*r*r;\n 7         volume = 4*Math.PI*Math.pow(r,3) / 3.0;\n 8\
  \     }\n 9 \n10     public void setRadius( double r ) {\n 11         radius = r;\n\
  \ 12         area = 4*Math.PI*r*r;\n 13         volume = 4*Math.PI*Math.pow(r,3)\
  \ / 3.0;\n 14     }\n 15 \n16     public double getRadius()      { return radius;\
  \ }\n17     public double getSurfaceArea() { return area;   }\n18     public double\
  \ getVolume()      { return volume; }\n19 }\n```\n\n`SphereCalc4.java`\n\n第 4-8\
  \ 行是构造函数的实现。注意第 4 行与 `setRadius()` setter 变器方法不同，构造函数不是`void`。\n\n此外注意构造函数的名称与类本身相同。这是要求的。如果你做到这两点，那么与其需要记住调用某个特殊方法为实例变量传递初始值，你可以在实例化对象时传递它们。你本来也必须这样做！例如：\n\
  \n```\nSphereCalc4 sc = new SphereCalc4( 5 );  \n// 立即安全地使用 SphereCalc 中的其他方法了 \
  \ \nSquareRootFinder srf = new SquareRootFinder(n);  \n// 同上  \nPhraseRepeater pr\
  \ = new PhraseRepeater(msg, n);  \nStringFunObject sfo = new StringFunObject(msg);\n\
  ```\n\n这在实现类时增加了一些工作量，因为你通常需要写一个构造函数并`also`编写你的 setter 方法。但它让操作对象变得更容易且更安全。\n\n\
  好了，现在就到此为止。在接下来的章节中我们将看到更多的构造函数。\n\n## 练习 10：使用数组进行自动化测试\n\n两个练习前，`SphereCalcTester`\
  \ 对我们的对象测试得还不错，但每个测试都需要花费大量的代码，并且有很多重复代码。让测试代码尽可能易于编写和自动运行是非常重要的。否则，你可能会被诱不去测试你的代码，而这不会导致任何好的结果。\n\
  \n所以这里有一个针对 `SphereCalc4` 的测试器示例，它使得在不增加任何额外代码的情况下添加额外的测试变得容易得多！\n\n\n\n\n这段代码使用双精度浮数数组来存储预期的输入和输出，且每个数组中的顺序相同，因此\
  \ `areas[0]` 存储半径 `inputs[0]` 的预期面积输出，而 `volumes[0]` 存储对应的预期体积。这样使用的数组被称为“并行”数组。\n\
  \n这不是实现此功能的**绝对**最佳方法，但目前已经足够了。我们将在书的后面部分看到更好的测试技术。\n\n```\n 1 public class BetterTesting\
  \ {\n 2     public static void main( String[] args ) {\n 3 \n 4         double[]\
  \ inputs = {\n 5             5,\n 6             0.1,\n 7             3.3,\n 8  \
  \           20000,\n 9             8\n10         };\n 11         double[] areas\
  \  = {\n 12             314.159265359,\n 13             0.125663706,\n 14      \
  \       136.84777599,\n 15             5026548245.743669104,\n 16             804.247719319\n\
  \ 17         };\n 18         double[] volumes = {\n 19             523.598775598,\n\
  \ 20             4.18879E-3,\n 21             150.532553589,\n 22             3.3510321638291125E13,\n\
  \ 23             2144.660584851\n 24         };\n 25         int passed = 0;\n 26\
  \         double r, a, v, A, V;\n 27 \n 28         SphereCalc4 c = new SphereCalc4(0);\n\
  \ 29         for ( int i=0; i<inputs.length; i++ ) {\n 30             r = inputs[i];\n\
  \ 31             a = areas[i];\n 32             v = volumes[i];\n 33 \n 34     \
  \        c.setRadius(r);\n 35             A = c.getSurfaceArea();\n 36         \
  \    V = c.getVolume();\n 37             if ( isNear(A, a) )\n 38              \
  \   passed++;\n 39             else {\n 40                 System.out.print(\"FAIL:\
  \ surfaceArea for radius \" + r );\n 41                 System.out.println(\"--\
  \ Expected \" + a + \", got \" + A);\n 42             }\n 43             if ( isNear(V,\
  \ v) )\n 44                 passed++;\n 45             else {\n 46             \
  \    System.out.print(\"FAIL: volume for radius \" + r );\n 47                 System.out.println(\"\
  -- Expected \" + v + \", got \" + V);\n 48             }\n 49         }\n 51 \n\
  \ 51         if ( passed == 2*inputs.length )\n 52             System.out.println(\"\
  PASS: All tests passed.\");\n 53     }\n 54 \n 55     public static boolean isNear(\
  \ double a, double b ) {\n 56         return Math.abs(a-b) < 1E-9;\n 57     }\n\
  \ 58 }\n```\n\nBetterTesting.java\n\n### 你应该看到的内容\n\n第 4 到 24 行仅包含输入和输出的值。我喜欢这样每行列出它们，但\
  \ Java 并不在乎你把它们都放在同一行。如果你 `确实` 把它们都放在同一行，为了你的心理健康，最好添加额外的空格使得对应的条目对齐，如下所示：\n\n```\n\
  double[] inputs  = {   5,           0.1,           3.3,         // 等\ndouble[] areas\
  \   = { 314.159265359, 0.125663706, 136.84777599,  // 等\ndouble[] volumes = { 523.598775598,\
  \ 4.18879E-3,  150.532553589, // 等\n```\n\n在第 28 行，我们只创建了一个单一的 `SphereCalc4` 对象，每次都会被重用。然后遍历数组中的每个值进行循环。注意：如果你不小心让数组的长度不同，那么这段代码可能会崩溃。这就是并行数组的问题之一。\n\
  \n在第 30 到 36 行中，我们提取出预期的半径、面积和体积，并将它们放入命名良好但易于输入的变量中，然后告诉对象 `使用` 那个半径并从对象中获取计算出的面积和体积。因此，`a`\
  \ 是预期的面积，而 `A` 是根据我们的对象得到的实际面积。\n\n然后我们可以直接使用之前的 `isNear()` 函数配合 `if` 语句，检查我们得到的结果是否符合预期。每通过一次“PASS”，我们就增加变量的值，但懒得打印任何内容。如果发生失败，我们会打印一条错误消息。\n\
  \n循环结束后，“通过”的次数应该是输入数量的两倍，所以我们检查这一点，如果一切正常，就打印一条总结消息。\n\n还不错，对吧？增加更多的测试用就像添加更多用例一样简单。\n\
  \n\n\n\n这个（无聊的）`Rectangle` 类有两个私有字段。（在将来，我可能不会费心去写“私有字段”这些字；称它们为“字段”基本上就意味着它们是私有的。这是\
  \ Java 程序员通常的办事方式。我本应该为它们编写 getter 和 setter，但这个练习侧重于构造函数，所以我把它们省略了。）\n\n有两个构造函数。关于构造函数，有三点你需要记住：\n\
  \n1. 它们的名称与类相同（在本例中为 `Rectangle`）。\n2. 它们没有返回类型——甚至连“void”都没有。\n3. 它们的“工作”是确保所有必要的设置都已完成。这意味着初始化所有的实例变量，但有时也会发生其他事情。\n\
  \n我本想加上“构造函数必须是公共的”，但事实并非如此。它们`通常`是公共的，但有时你想要一个构造函数却不想让别人调用它，所以你会把其中一个构造函数设为私有之类的。\n\
  \n```\n 1 public class RectangleDriver {\n 2     public static void main( String[]\
  \ args ) {\n 3         // Rectangle r = new Rectangle();\n 4         // r.length\
  \ = 10;\n 5         // r.width = 5;\n 6 \n 7         Rectangle r = new Rectangle(10,\
  \ 5);\n 8         System.out.println(\"The area is \" + r.getArea());\n 9     }\n\
  10 }\n```\n\n`RectangleDriver.java`\n\n驱动程序中的第 3-5 行被注释掉了，但它们展示了几个练习前你为了实例化对象所会的操作。你必须构造对象本身（第\
  \ 3 行），然后将值放入所有字段中。\n\n现在我们的字段是私有的，而且我们现在有了构造函数，我们可以在驱动程序中仅用一行代码就完成这一切。这在第 7 行所示。\n\
  \n第 7 行发生的第一件事是等号的左侧。编译器创建一个 `Rectangle` 对象并将其命名为 `r`。起初，它里面没有任何对象。\n\n然后执行等号的右侧：它调用了参数构造函数，并将\
  \ `10` 和 `5` 作为参数传入。由于 `10` 在前，一个副本会被放入第一个参数（`int` 类型 `l`）中。然后，`5` 的副本被传递给第二个参数（名为\
  \ `w` 的 `int`）。\n\n在第 9 行之前的后台秘密时刻，我们的 `Rectangle` 对象实际上在内存中被实例化了。然后通过第 9 行和第 10\
  \ 行，构造函数将参数中的值复制到实例变量中。\n\n一旦构造函数在第 11 行结束，后台还会发生另一件事，这在普通方法中`不会发生`：一个 `Rectangle`\
  \ 对象的引用被返回给驱动程序。（我们将在稍后的练习中学习更多内容。）\n\n这让我们回到了驱动程序的第 7 行，此时右侧刚刚完成。所以最后执行了该行的“等号”部分；从构造函数返回的（（对象的）引用被存储在左侧的变量（`r`）中。\n\
  \n所以到此时，第 7 行已完全完成，对象已经实例化，字段也有了值。\n\n这一行代码就做了这么多工作，对吧？这就是为什么构造函数很棒的原因。虽然它比手动做所有事情稍微复杂一点点，但对于使用我们类的人来说更好，而且更安全，因为它`确保`了在对象被使用之前所有设置都已完成。\n\
  \n### 你应该看到的内容\n\n酷吧？\n\n## 练习 13：字段的默认值\n\n在使用变量之前确保它们有值是一个好主意。事实上，在驱动程序代码中，如果你尝试在初始化变量之前使用它，Java\
  \ 甚至无法编译该文件。\n\n但在类内部，Java 在后台执行了一些隐藏魔法来让这变得稍微容易。字段有`默认`值，即使你从未给它们设置过任何值，这些值也会被使用。\n\
  \n```\n 1 public class Dog\n 2 {\n 3     private String name, breed;\n 4     private\
  \ int age;\n 5     private double weight;\n 6 \n 7     public Dog() {}\n 8 \n 9\
  \     public Dog( String n, String b, int a, double w ) {\n10         name = n;\n\
  11         breed = b;\n12         age = a;\n13         weight = w;\n14     }\n15\
  \ \n16     public String getName()   { return name;   }\n17     public String getBreed()\
  \  { return breed;  }\n18     public int getAge()       { return age;    }\n19 \
  \    public double getWeight() { return weight; }\n20 \n21     public String getEverything()\
  \ {\n22         return name + \" is a \" + breed + \", \" + age + \" years old,\
  \ \"\n23             + weight + \" kg.\";\n24     }\n25 }\n```\n\n`Dog.java`\n\n\
  这个对象希望非常直观。几个字段，两个构造函数（一个默认构造函数和一个带参数的构造函数），大量的 getter，以及一个返回适合打印的漂亮 `String` 的“get\
  \ everything”方法。\n\n唯一“奇怪”的地方在第 7 行：默认构造函数存在但是空的。在那些大括号之间没有代码！\n\n不过它是可以编译的。现在我们看驱动程序，它应该也相当无聊。尝试预测输出将是什么。\n\
  \n```\n 1 public class DogDriver {\n 2     public static void main( String[] args\
  \ ) {\n 3         Dog a = new Dog();\n 4         Dog pal = new Dog(\"Lassie\", \"\
  Rough Collie\", 3, 26.0);\n 5         Dog spike = new Dog(\"Yeller\", \"Mastador\"\
  , 5, 43.0);\n 6 \n 7         System.out.println(a.getEverything());\n 8        \
  \ System.out.println(pal.getName() + \" is a \" + pal.getBreed() + \".\");\n 9 \
  \        System.out.println(spike.getName() + \" is a \" + spike.getBreed() + \"\
  .\");\n 10 \n 11         System.out.println(pal.getEverything());\n 12         System.out.println(spike.getEverything());\n\
  \ 13     }\n14 }\n```\n\n`DogDriver.java`\n\n驱动程序在 5 和 6 行创建了两个 `Dog` 对象并在 8 到 11\
  \ 行调用了各种方法。\n\n我认为，有趣的行是 3 和 12。\n\n第 3 行使用默认构造函数实例化了一个 `Dog` 对象。然后第 12 行调用了一个返回所有字段值的方法。这可以编译，但这些字段是什么时候初始化的呢？！\n\
  \n那么使用了什么值呢？\n\n答案是 Java 字段有默认值。（而且`只有`字段如此。Java 中其他类型的变量`没有`默认值，这就是为什么如果你在初始化变量之前使用它，编译器会报错。）\n\
  \n`int` 类型的字段默认值为 `0`。`double` 默认值为 `0.0`。`boolean` 的默认值为 `false`。任何对象都认为 `null`，这个引用意味着“此对象尚未指向任何内容”。`String`\
  \ 是对象，所以在这种情况下，*name* 和 *breed* 字段都被设置为 `null`。\n\n始终显式地为所有字段赋值是一个好主意，但知道如果你忘记了，Java\
  \ 会填充合理的默认值是很好的。\n\n## 练习 14：toString 和 this\n\n今天的练习希望有点趣。没有多少新概念，希望它们不要太复杂。\n\n\
  我们将查看对象拥有的名为 `this` 的内置引用变量，以及所有对象继承的名为 `toString()` 的内置方法。在编写这些代码之前，你可能想回顾一下上练习（`Dog.java`）中的\
  \ `getEverything()` 方法，并查看练习 4 中 `TVActorDriver.java` 中的字段。\n\n\n\n\n```java\npublic\
  \ class Tweet {\n    private String created_at;\n    private int favorite_count;\n\
  \    private boolean favorited;\n    private long id;\n    private int retweet_count;\n\
  \    private boolean retweeted;\n    private String text;\n\n    public Tweet( String\
  \ created_at, int favorite_count, boolean favorited,\n        long id, int retweet_count,\
  \ boolean retweeted, String text )\n    {\n        this.created_at = created_at;\n\
  \        this.favorite_count = favorite_count;\n        this.favorited = favorited;\n\
  \        this.id = id;\n        this.retweet_count = retweet_count;\n        this.retweeted\
  \ = retweeted;\n        this.text = text;\n    }\n\n    public String toString()\
  \ {\n        String out = \"\";\n        out += text + \"\\n\";\n        if ( retweet_count\
  \ > 0 ) {\n            out += \"Retweets: \" + retweet_count + \"  \";\n       \
  \ }\n        if ( this.favorite_count > 0 ) {\n            out += \"Favorites: \"\
  \ + this.favorite_count + \"\\n\";\n        }\n        else {\n            out +=\
  \ \"\\n\";\n        }\n        out += created_at + \"\\n\";\n        if ( this.retweeted\
  \ ) {\n            out += \"[^v]\";\n        }\n        else {\n            out\
  \ += \"[  ]\";\n        }\n        if ( favorited ) {\n            out += \"[*]\"\
  ;\n        }\n        else {\n            out += \"[ ]\";\n        }\n        return\
  \ out;\n    }\n}\n```\n\n`Tweet.java`\n\nTwitter 是一家允许人们在网上发布非常短的消息以供他人阅读的公司。这些短消息被称为“推文”（tweets），并限制在\
  \ 140 个字符以内。然而，让 Twitter 运行的代码复杂得多！在上面的代码中，我定义了一个 Java 版本的 `Tweet` 对象，它包含了 Twitter\
  \ 定义的实际“推文”中存在的`部分`字段。（如果你想查看其余字段，需要浏览 [Twitter API 概览](https://dev.twitter.com/overview/api/tweets)。请注意\
  \ Twitter 是用 Ruby 和 Scala 编写的，而不是 Java，因此某些变量类型并不完全相同。）\n\n这个对象中无聊的新点是，返回一个适合打印的直观字符串的方法被称为\
  \ `toString()` 而不是 `getEverything()`。这样做是有原因的，我们很快就会看到。\n\n不过，你会在第 13 行发现一些奇怪的地方。\n\
  \n从第 10 行开始的参数构造函数接收了`七个`传入参数。在之前的对象中，我只是给参数取了短名称——通常只是一个字母。但在这个对象中，有两个以‘f’开头的参数，另外两个以‘r’开头的参数。我担心尝试缩短它们会引起困惑。\n\
  \n因为参数的名称与字段的名称相同，它们“遮蔽”（shadow）了这些字段。这意味着参数的名称隐藏了字段的名称，因为它们定义在更靠近第 13 行的位置。\n\n\
  但 Java 给了我们一种访问被遮蔽字段的方法，即使用 `this` 关键字。在 Java 中，`this` 始终包含指向你所处对象的引用。（如果这让你有点困惑也没关系。我们稍会讨论更多关于引用的内容。）\n\
  \n所以，`this.created_at` 指属于整个当前对象的名为 `created_at` 的变量。而在该范围内——第 12 行到第 19 行——变量 `created_at`\
  \ 指的是参数而不是字段。\n\n```java\nthis.created_at = created_at;\n```\n\n…意味着将参数中的值存储到实例变量中。\n\
  \n第 14 行到第 19 行做了相同的事情。它们将参数值的拷贝存储到同名的字段中。\n\n注意，在 `toString()` 方法中没有任何参数。因此，在此范围内唯一名为\
  \ `retweet_count` 的变量是字段。所以在第 25 行，我可以像在之前的练习中做的那样，直接通过名称访问它。\n\n然而，使用 `this.` 访问字段（如第\
  \ 28 行所示）是`总是`合法的。有些程序员总是这样做。我通常只在需要时才这样做。\n\n`toString()` 方法从第 23 行的一个名为 `out`\
  \ 的空字符串开始，然后使用 `if` 语句逐部分构建它。到方法的结束时，我们得到了一个四行长的字符串，并它被返回给 `main()` 进行打印。\n\n```java\n\
  public class TweetDriver {\n    public static void main( String[] args ) {\n   \
  \     Tweet t = new Tweet(\"Thu Feb 19 20:19:00 UTC 2009\", 8, true,\n         \
  \   568507566182344L, 2, false,\n            \"You can now buy 'Java the Hard Way'\
  \ using bitcoin!\");\n\n        System.out.println(t.toString());\n        System.out.println(\"\
  \\n--------\");\n        System.out.println(t);\n    }\n}\n```\n\n`TweetDriver.java`\n\
  \n### 你应该看到的内容\n\n最后让我们谈谈为什么这个方法被称为 `toString()` 而不是其他名字。正如你在驱动程序的第 9 行所看到的，当你打印\
  \ `toString()` 方法返回的字符串时，一切运行得非常完美。\n\n然而，在第 11 行，我们正尝试打印整个对象本身！通常这会显示一串杂乱的字母，但由于我们的对象定义了一个名为\
  \ `toString()` 的公共方法，Java 编译器将打印 `toString()` 返回的内容，而不是对象本身。\n\n这非常有用！\n\n好了，这个练习就到此为止！\n\
  \n## 练习 15：井井井战（Noughts and Crosses）/ 极端测试\n\n这个练习的代码相当长！这是因为你现在已经掌握了足够编写有趣事情的知识。我们要编写的第一个是一个用于玩儿童游戏“井井井”（Noughts\
  \ and Crosses）的对象，它也被称为“井字棋”（Tic Tac Toe）。\n\n\n\n\n\n```java\npublic class NoughtsCrossesObject\n\
  {\n    // 实例变量\n    private String[][] board;\n    private int turns;\n\n    //\
  \ 构造函数\n    public NoughtsCrossesObject()\n    {\n        board = new String[3][3];\n\
  \        turns = 0;\n\n        for ( int r=0; r<3; r++ )\n            for ( int\
  \ c=0; c<3; c++ )\n                board[r][c] = \" \";\n    }\n\n    // 访问方法\n\
  \    public boolean isWinner( String p ) {\n        // 第一行\n        if ( winCheck(p,\
  \ 0,0, 0,1, 0,2) ) return true;\n        // 中行\n        if ( winCheck(p, 1,0, 1,1,\
  \ 1,2) ) return true;\n        // 下行\n        if ( winCheck(p, 2,0, 2,1, 2,2) )\
  \ return true;\n        // 左列\n        if ( winCheck(p, 0,0, 1,0, 2,0) ) return\
  \ true;\n        // 中列\n        if ( winCheck(p, 0,1, 1,1, 2,1) ) return true;\n\
  \        // 右列\n        if ( winCheck(p, 0,2, 1,2, 2,2) ) return true;\n       \
  \ // 左上到右下对角线\n        if ( winCheck(p, 0,0, 1,1, 2,2) ) return true;\n        //\
  \ 左下到右上对角线\n        if ( winCheck(p, 2,0, 1,1, 0,2) ) return true;\n\n        return\
  \ false;\n    }\n\n    private boolean winCheck(String p, int a,int b, int c,int\
  \ d, int e,int f) {\n        return board[a][b].equals(board[c][d])\n          \
  \  && board[a][b].equals(board[e][f]);\n    }\n\n    public boolean isFull() {\n\
  \        if ( turns == 9 )\n            return true;\n        else\n           \
  \ return false;\n        // return turns == 9;\n    }\n\n    public boolean isCat()\
  \ {\n        return isFull() && !isWinner(\"X\") && !isWinner(\"O\");\n    }\n\n\
  \    public boolean isValid( int r, int c ) {\n        if ( 0 <= r && r <= 2 &&\
  \ 0 <= c && c <= 2 )\n            return true;\n        else\n            return\
  \ false;\n    }\n\n    public int numTurns() {\n        return turns;\n    }\n\n\
  \    public String playerAt( int r, int c ) {\n        if ( isValid(r,c) )\n   \
  \         return board[r][c];\n        else\n            return \"@\";\n    }\n\n\
  \    public boolean isTaken(int r, int c) {\n        String p = playerAt(r,c);\n\
  \        if ( p.equals(\" \") )\n            return false;\n        else\n     \
  \       return true;\n    }\n\n    public String toString() {\n        String out\
  \ = \"\";\n        out += \"  0  \" + board[0][0] +\"|\"+ board[0][1] +\"|\"+ board[0][2\
  \ +\"\\\"\\n\";\n        out += \"    --+-+--\" + \"\\n\";\n        out += \"  1\
  \  \" + board[1][0] +\"|\"+ board[1][1] +\"|\"+ board[1][2] +\"\"\\n\";\n      \
  \  out += \"    --+-+--\" + \"\\n\";\n        out += \"  2  \" + board[2][0] +\"\
  |\"+ board[2][1] +\"|\"+ board[2][2] +\"\"\\n\";\n        out += \"     0 1 2 \"\
  \ + \"\\n\";\n        return out;\n    }\n\n    // 修改/变器方法\n    public void playMove(\
  \ String p, int r, int c ) {\n        board[r][c] = p;\n        turns++;\n    }\n\
  }\n```\n\n### NoughtsCrossesObject.java\n\n第一个实例变量（称为 `board` 的那个）是一个 `String` 类型的二维数组。这意味着数组中包含许多按行和列排列的字符串。\n\
  \n有一个构造函数，用于实例化一个三行三列的二维数组，将 `turns` 设置为零，然后使用嵌套循环在每个位置放入一个空白格。\n\n`isWinner()`\
  \ 方法在 `p` 获胜时返回 `true`，在玩家未获胜时返回 `false`。它通过一个名为 `winCheck()` 的“辅助方法”来完成任务。注意 `winCheck()`\
  \ 是一个 `private` 方法，这意味着我们可以在对象内部调用它，但不能在驱动程序的其他地方调用它。\n\n`winCheck()` 检查行 `a` 和列\
  \ `b` 是否包含与行 `c` 和列 `d` 相同的字母。然后它确认 `[a,b]` 中的字母也与 `[e,f]` 中的字母相同。如果所有条件都成立，则该方法返回一个\
  \ `true` 值。\n\n`isFull()` 在棋盘上所有格子都被使用时返回 `true`。你可以像所示那样使用 `if` 语句和 `else` 语句来实现，也可以使用被注释掉的那单行代码来实现。\n\
  \n`isCat()` 在棋盘填满但任何玩家都没有获胜时返回 `true`。\n\n`isValid()` 在行值和列值都在范围内时返回 `true`。\n\n\
  `numTurns()` 返回回合数。\n\n`playerAt()` 返回指定行 `r` 和列 `c` 处的玩家，否则返回 `@`。\n\n`isTaken()`\
  \ 如果指定位置已被占用则返回 `false`，否则返回 `true`。\n\n`toString()` 返回棋盘的格式化输出字符串。\n\n// 修改/变器方法\n\
  `playMove()` 将玩家 `p` 放在 `[r][c]` 处，并将回合数加 1。\n\n### NoughtsCrossesGame.java\n\n\
  你可以看到在第 8 行实例化了我们的对象，然后可以使用提供的所有方法来游戏。\n\n第 12 行打印 `ttt` 对象，这会调用 `toString()` 方法。该方法会返回棋盘的状态。\n\
  \n第 14 行和第 15 行允许人类输入行和列。你可以通过在提示处输入两个数字来实现。\n\n第 17 行到第 26 行进行错误检查，确保玩家在合法位置上操作。\n\
  \n第 27 行实际执行玩家的操作，第 29 行到第 32 行将玩家从“X”切换到“O”或反之。而第 37 行到第 42 行宣布获胜者。\n\n现在让我们输入驱动程序：\n\
  \n```java\nimport java.util.Scanner;\n\npublic class NoughtsCrossGame {\n    public\
  \ static void main( String[] args ) {\n        Scanner keyboard = new Scanner(System.in);\n\
  \n        String p = \"X\";\n        NoughtsCrossesObject ttt = new NoughtsCrossesObject();\n\
  \        int r, c;\n\n        while ( !ttt.isWinner(\"X\") && !ttt.isWinner(\"O\"\
  ) && !ttt.isFull() ) {\n            System.out.println(ttt);\n            System.out.print(\"\
  '\" + p + \"', choose your location (row column): \");\n            r = keyboard.nextInt();\n\
  \            c = keyboard.nextInt();\n\n            while ( !ttt.isValid(r,c) ||\
  \ ttt.isTaken(r,c) ) {\n                if ( ttt.isValid(r,c) == false )\n     \
  \               System.out.println(\"Not a valid location. Try again.\");\n    \
  \            else if ( ttt.isTaken(r,c) )\n                    System.out.println(\"\
  Location already full. Try again.\");\n\n                System.out.print(\"'\"\
  \ + p + \"', choose your location (row column): \");\n                r = keyboard.nextInt();\n\
  \                c = keyboard.nextInt();\n            }\n            ttt.playMove(\
  \ p, r, c );\n\n            if ( p.equals(\"X\") )\n                p = \"O\";\n\
  \            else\n                p = \"X\";\n        }\n\n        System.out.println(ttt);\n\
  \n        if ( ttt.isWinner(\"X\") )\n            System.out.println(\"X is the\
  \ winner!\");\n        else if ( ttt.isWinner(\"O\") )\n            System.out.println(\"\
  O is the winner!\");\n        else if ( ttt.isCat() )\n            System.out.println(\"\
  The game is a tie.\");\n    }\n}\n```\n\n### 你应该看到的\n\n噢，额，什么？\n\n\n\n\n所以，我犯了一个错误。在对象的某个地方。如果所有代码都在\
