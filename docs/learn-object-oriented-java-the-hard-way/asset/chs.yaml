  15         // 不能移动出边界。\n 16         if ( ! board.canAdd(newRow, newCol) )\n 17 \
  \            return false;\n 18 \n19         // \"棋子可以向前或斜向移动移动格，\n 20//    如果目标位置是空的。\"\
  \n 21         if ( board.get(newRow, newCol) == null )\n 22             return true;\n\
  \ 23 \n 24         BreakthroughBoard bb = (BreakthroughBoard)board;\n 25       \
  \  // 只能斜向向前捕捉对方棋子。\n 26         if ( colDir != 0 && bb.get(newRow, newCol).rowDir\
  \ != this.rowDir )\n 27             return true;\n 28 \n 29         return false;\n\
  \ 30     }\n 31 \n 32     public void move( int colDir ) {\n 33         if ( ! canMove(colDir)\
  \ )\n 34             return;\n 35         ((BreakthroughBoard)board).movePiece(r,\
  \ c, r+rowDir, c+colDir);\n 36         r += rowDir;\n 37         c += colDir;\n\
  \ 38     }\n 39 }\n```\n\n`BreakthroughPiece.java` 类 `extends` 了上一个练习中的 `GamePiece`\
  \ 对象，因此它继承了所有的字段和方法（构造函数除外）。\n\n`rowDir` 字段告诉我们棋子是向棋盘顶部的“北方”移动还是向“南方”。值 `-1` 表示每当棋子移动时，其行值都会加上\
  \ `-1` —— 这使其更靠近网格的顶部。\n\n因此在构造函数中，如果参数 `isWhite` 为 `true`，则我们将符号 `\"W\"` 传递给父类构造函数，然后将\
  \ `rowDir` 设置为 `-1`，因为白棋子从底部开始并向上移动。\n\n`canMove()` 方法判断该棋子在给定方向上移动是否合法。参数 `colDir`\
  \ 的作用与 `rowDir` 类似；它的值可能是 `-1`、`0` 或 `1`，表示它是在尝试向左上移动、直向上移动还是向右上移动。\n\n由于该棋子目前位于第\
  \ `r` 行第 `c` 列，它尝试移动到的位置就是 `r + rowDir` 和 `c + colDir`。\n\n如果该位置目前没有任何棋子，那么移动到那里是可以的。\n\
  \n假设那里*确实有*一个棋子（否则我们已经返回了 `true`，不会执行到方法的这么深了），那么如果我们正在进行斜向移动（`colDir` 不为 `0`）*且*那里的棋子颜色与我们不同（它的\
  \ `rowDir` 与我们的的 `rowDir` 不同），那么移动到那里也是可以的。\n\n呼。\n\n如果你坚持过了这里，可能对类型转换感到好奇：\n\n\
  ```\nBreakthroughBoard bb = (BreakthroughBoard)board;\n```\n\n`board` 字段继承自 `GamePiece`。它是对\
  \ `GameBoard` 对象的引用。如果你在 `BreakthroughGame.java` 中向下看，可以看到实际创建的对象是一个 `BreakthroughBoard`\
  \ 对象。由于 `BreakthroughBoard` 对象 `extends GameBoard`，所以它*是一个* `GameBoard` 对象。因此字段\
  \ `board` 也可以持有它的引用。\n\n问题在于，尽管该对象*确实是*一个 `BreakthroughBoard`，但引用它的变量*可能*只是持有一个无聊的\
  \ `GameBoard` 对象的引用。\n\n因此，如果我们想调用 `BreakthroughBoard` 版本的 `get()` 方法而不是 `GameBoard`\
  \ 版本的 `get()` 方法，我们必须对其进行类型转换。转换后，变量 `bb` 持有的与 `board` **完全相同**的内存地址，但编译器现在确定知道它可以调用所有\
  \ `BreakthroughBoard` 类特有的方法。\n\n`move()` 方法中也有一个类型转换，以便我们调用 `movePiece()`。\n\n\
  好了，现在让我们来看看 `BreakthroughBoard` 的差异！\n\n```\n 1 public class BreakthroughBoard extends\
