  \n我们在驱动程序（driver）中做的第一件事是实例化一个 `Rect` 对象。我们打印它并调用了它的一些方法。\n\n然后我们实例化一个 `Square`\
  \ 对象。你会注意到，我们可以代表 `Square` 对象调用 `getArea()` 方法，尽管这些方法只在父类中定义！这就是继承的魔力！\n\n这是因为每个\
  \ `Square` 对象*也是*一个 `Rect` 对象，只是多了一些额外的内容。\n\n接下，我们又实例化了另外两个对象并显示了它们。这证明了当调用 `toString()`\
  \ 方法时，它使用的是该对象类型对应的正确版本。\n\n在驱动程序的最后两行，我做了一些不寻常。变量 `r` 能够持有一个 `Rect` 类型对象的引用。变量\
  \ `s` 当前持有一个 `Square` 类型对象的引用。所以，\n\n```java\nr = s;\n```\n\n…将引用从 `s` 复制到 `r` 中。这样可以吗？当然可以，因为\
  \ `r` 能够持有一个 `Rect` 的引用，而 `s` 持有一个 `Square` 的引用，而且*每一个 Square 都是一个 Rect*。类型为 `Square`\
  \ 的对象*也是*一个类型为 `Rect` 的对象，只是多了一些额外的内容。\n\n你可以看到 Java 甚至足够智能到调用合适的 `toString()` 方法。尽管\
  \ `r` 指向矩形，但它调用的是方形版本的 `toString()` 方法，因为引用另一端的对象实际上是一个正方形。\n\n很酷，对吧？因此在接下来的练习中，我们将更深入地观察继承是如何应用于字段的。\n\
  \n## 练习 34: 字段是如何继承的\n\n在上一章中，我把问题简化得太过了。我说子类“会自动获得[父类的]字段的副本”。这种说法是正确的！但子类可能无法*访问*那些继承来的字段！\n\
  \n实际上，可能无法访问。在这个练习中还有一个新关键字：`protected`。\n\n```java\npublic class FieldInheritance\
  \ {\n\n    private String first;\n    protected String last;\n\n    public FieldInheritance()\
  \ {\n        first = last = \"\";\n    }\n\n    public FieldInheritance( String\
  \ first, String last ) {\n        this.first = first;\n        this.last = last;\n\
  \    }\n\n    public void setFirst( String s ) {\n        first = s;\n    }\n\n\
  \    public void setLast( String s ) {\n        last = s;\n    }\n\n    public String\
  \ getFirst() { return first; }\n    public String getLast()  { return last; }\n\n\
  \    public String toString() {\n        return first + \" \" + last;\n    }\n}\n\
  ```\n\n`FieldInheritance.java`\n\n所以这个对象有两个字段：`first` 和 `last`。`String` 类型 `first`\
  \ 是私有的（private），这通常是你想要的。\n\n`String` 类型 `last` 是受保护的（protected），这与私有相似。不过，有一点点细微的区别。我们很快就会看到。\n\
  \n这个文件中没有其他有趣的内容，只有在定义 Java 类时通常需要编写的构造函数以及 getter 和 setter 方法。\n\n```java\npublic\
  \ class FieldInheritanceSub extends FieldInheritance {\n\n    public FieldInheritanceSub()\
  \ {\n        super();\n    }\n\n    public FieldInheritanceSub( String first, String\
  \ last ) {\n        super(first, last);\n    }\n\n    public void test() {\n   \
  \     // first = \"GOOD\";\n        last = \"COFFEE\";\n    }\n}\n```\n\n`FieldInheritanceSub.java`\n\
  \n这个子类 `extends`（继承）之前的类，这意味着它继承了所有字段和方法的副本（但没有继承构造函数）。因此 `FieldInheritanceSub`*确实*拥有\
  \ `first` 和 `last` 的副本。\n\n但看看那个 `test()` 方法。注意到代码中有一行被注释掉了吗？那是故意为之。\n\n子类*确实有*字段\
  \ `first` 的副本。但它无法直接访问它。为什么？因为该字段是 `private` 的。私有字段*只能*在同一个类中访问。此。。\n\n其他任何类无法触碰私有数据成员，*包括*子类。\n\
  \n然而，字段 `last` **可以**被访问，因为它是 `protected` 的。当一个字段具有受保护的可见性时，意味着它除了子类*以外*都是私有的。子类可以访问受保护的字段；其他任何类不能。\n\
  \n```java\npublic class FieldInheritanceDriver {\n    public static void main( String[]\
  \ args ) {\n        FieldInheritance f = new FieldInheritance(\"Bill\", \"Brask\"\
  );\n        System.out.println(f);\n\n        FieldInheritanceSub g = new FieldInheritanceSub(\"\
  Turkish\", \"Delight\");\n        System.out.println(g);\n        g.test();\n  \
  \      System.out.println(g);\n    }\n}\n```\n\n`FieldInheritance.java`\n\n驱动程序证实了一切都符合预期。子类的\
  \ `test()` 方法能够修改父类的保护字段，但不能修改私有字段。\n\n### 你应该看到的\n\n如果你正在编写一个可能会被继承的类，那么将字段设置为\
  \ `protected` 而不是 `private` 是一个好主意。如果你在类中有一个知道应该对其他类限制的字段，将其设置为 `private`。\n\n##\
  \ 练习 35: “实用”继承 - 棋盘\n\n我们在过去的几个练习中学习了继承，但我们写的程序并不实用，也不清楚要在它们中使用继承是为了。\n\n所以在接下来的几个练习中，我们将构建一个涉及二维网格的游戏框架。\n\
  \n这个练习比大多数的都要长，因为我需要大量的代码让继承产生意义（在现实世界中也是如此）。\n\n```java\npublic class GamePiece\
  \ {\n    protected int r, c;\n    protected GameBoard board;\n    protected String\
  \ symbol;\n\n    public GamePiece() {\n        r = c = 0;\n        board = null;\n\
  \        symbol = \"@\";\n    }\n\n    public GamePiece(int r, int c, String symbol)\
  \ {\n        this.r = r;\n        this.c = c;\n        this.board = null;\n    \
  \    this.symbol = symbol;\n    }\n\n    public boolean addSelfToBoard( GameBoard\
  \ board ) {\n        if ( board.canAdd(r,c) && ! isOnBoard() && board.get(r,c) ==\
  \ null ) {\n            this.board = board;\n            board.add(this,r,c);\n\
  \            return true;\n        }\n        return false;\n    }\n\n    public\
  \ boolean isOnBoard() {\n        return board != null && board.get(r,c) == this;\n\
  \    }\n\n    public void removeSelfFromBoard() {\n        if ( isOnBoard() ) {\n\
  \            board.remove(r,c);\n            board = null;\n        }\n    }\n\n\
  \    public int getRow() { return r; }\n    public int getCol() { return c; }\n\
  \    public String getSymbol() { return symbol; }\n\n    public String toString()\
  \ {\n        return \"GamePiece at (\" + r + \", \" + c + \")\";\n    }\n}\n```\n\
  \n\n\n\n\n这是放置在游戏棋盘上的部分的所谓“基类”。所有字段都设置为 `protected`，因为我们预期其他类会继承自这个类！\n\n每个棋子都有一个指向所在棋盘的引用，并跟踪其在网格中的行和列。由于我们只是在终端屏幕上绘图，每个棋子都存储一个符号。有一些方法允许棋子将其添加到棋盘或从棋盘中移除。这些代码在我们稍后使用后就会意义。\n\
  \n```java\nimport java.util.ArrayList;\n\npublic class GameBoard {\n    protected\
  \ GamePiece[][] g;\n\n    public GameBoard( int rows, int columns ) {\n        g\
  \ = new GamePiece[rows][columns];\n    }\n\n    public void add( GamePiece a, int\
  \ r, int c ) {\n        if ( !canAdd(r,c) )\n            return;\n        g[r][c]\
  \ = a;\n    }\n\n    public boolean canAdd( int r, int c ) {\n        return ( 0\
  \ <= r && r < g.length && 0 <= c && c < g[0].length );\n    }\n\n    public GamePiece\
  \ get( int r, int c ) {\n        return g[r][c];\n    }\n\n    public void remove(int\
  \ r, int c ) {\n        g[r][c] = null;\n    }\n\n    public String toString() {\n\
  \        String out = \"\";\n        for ( int r=0; r<g.length; r++ ) {\n      \
  \      for ( int c=0; c<g[0].length; c++ ) {\n                if ( g[r][c] == null\
  \ )\n                    out += \".\";\n                else\n                 \
  \   out += g[r][c].getSymbol();\n            }\n            out += \"\\n\";\n  \
  \      }\n        return out;\n    }\n}\n```\n\nGameBoard.java\n\n这是游戏棋盘！它包含一个 `GamePiece`\
  \ 对象的二维数组（严格来说，它包含的是一个指向对象数组的引用）。它有将棋子添加到棋盘、移除它们等方法。注意，如果他们想用一个棋子覆盖另一个棋子，我们是允许的；这在某些游戏中是可以接受的！我们只需要检查他们是否因为将棋子放在边界之外而导致程序崩溃。\n\
