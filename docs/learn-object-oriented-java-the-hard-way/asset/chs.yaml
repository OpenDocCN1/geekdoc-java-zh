  ;\n34                 start = System.nanoTime();\n35                 selectionSortPrimitives(intArr);\n\
  36                 stop = System.nanoTime();\n37             }\n38             else\
  \ if ( choice == 2 ) {\n39                 testDescription = \"Integer objects using\
