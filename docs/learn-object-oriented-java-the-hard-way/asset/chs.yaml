  ## 练习 46：简单的窗口\n\n在 Java 中制作 GUI 程序比其他语言要简单得多，但它仍然需要良好的面向对象编程理解，所以我之前无法解释它。\n\n\
  但现在是时候了！\n\n```\nimport javafx.application.Application;\nimport javafx.scene.Group;\n\
  import javafx.scene.Scene;\nimport javafx.stage.Stage;\n\npublic class SimpleWindow\
  \ extends Application {\n    @Override\n    public void start(Stage stage) {\n \
  \       Group root = new Group();\n        Scene scene = new Scene(root, 600, 400);\n\
  \n        stage.setTitle(\"Simple Window\");\n        stage.setScene(scene);\n \
  \       stage.show();\n    }\n\n    public static void main( String[] args ) {\n\
  \        launch(args);\n    }\n}\n```\n\nSimpleWindow.java\n\n假设你安装了 1.8  JDK，此程序应该可以正常编译和运行。如果你使用的是较旧版本的\
  \ Java，你必须研究如何安装 JavaFX。\n\n如果你像我一样在 Linux 上使用 OpenJDK 版本的 Java，你需要单独安装 JavaFX：\n\
  \n不过，如果你使用的是 Oracle 发布的 JDK，这应该可以直接工作。\n\n### 你应该看到什么\n\n![Windows 10 SimpleWindow\
  \ 截图](img/SimpleWindow-win10.png)\n\nWindows 10 SimpleWindow 截图\n\n如果你使用的是 Windows\
  \ 10，你的（无聊的）窗口可能很像上面的截图。我通常在运行 Ubuntu Linux 的 PC 上工作，所以当我在我的机器上运行时，它看起来像这样：\n\n\
  ![Linux SimpleWindow 截图](img/SimpleWindow-linux.png)\n\nLinux SimpleWindow 截图\n\n\
  自 1995 年 Java 的第一个版本以来就有 GUI 库。最初他们使用 AWT（抽象窗口工具包）。它比没有要好，但存在一些问题。\n\n\n\n\n随后，在\
  \ 1998 年 Java 1.2 版本发布时，引入了一个名为“Swing”的新型 GUI 库。这比 AWT 好得多，但仍然不够完美。\n\nOracle 提供的最新、最强大的\
  \ GUI 库是 JavaFX，它首次出现在 2011 年底的 Java 1.7 版本中。不过，它曾经是一个独立的下载包。\n\n现在 JavaFX 是 Java\
  \ 程序中进行图形处理的推荐方式，并且从 2014 年的 Java 1.8 版本开始默认安装。JavaFX 非常不错，所以这就是我要向你们展示的内容。\n\n\
  不过，我要提个醒。我几乎完全不做 GUI 编程，而且 JavaFX 对我来说仍然很新。因此我会尽力向你们展示基本思想，你可以自己学习剩下的细节。如果你非常熟悉\
  \ OOP，Oracle 的 [JavaFX 教程](http://docs.oracle.com/javase/8/javafx/get-started-tutorial/jfx-overview.htm)\
  \ 非常棒！\n\n好了，让我们聊聊你刚刚写的代码！\n\n每个 JavaFX 应用程序都从 `javafx.application.Application`\
  \ 的子类开始。名为 `start()` 的方法是程序开始的地方，并且是必须的。JavaFX 会创建一个名为“Stage”（阶段）的基本窗口，并将它的引用传递给\
  \ `start()` 方法。\n\n在 `Stage` 对象内部有一个 `Scene`场景）对象。`Scene` 是窗口中所有其他内容的容器。在场景内部是一个复杂得多的链式（树或图）结构，被称为“scene\
  \ graph（场景图）”。这个程序有一个极其简单的场景图：只有一个名为“root”（根）的节点。\n\n每个场景图都必须有一个根节点。在这次练习中，我只是使用了一个名为\
  \ `Group` 的容器节点，但组内部什么都没有。\n\n场景图的根节点是一个持有所有剩余用户界面 (UI) 元素的容器。\n\n在我们的代码中，我们得到了\
  \ `Stage` 窗口的引用。我们实例化了一个新的 `Group` 对象。然后我们实例化了一个 `Scene` 对象，并告诉它我们创建的 `Group` 对象将作为场景图的根。我们还告诉它让窗口默认大小为\
  \ 600 像素宽、400 像素高。\n\n然后，我们应该设置窗口/阶段的标题。我们需要给 `Stage` 对象一个其 `Scene` 的引用。最后，我们要求窗口显示自己。（否则窗口将存在但是不可见的。）\n\
  \nJavaFX 程序并不非要有 `main()` 方法。你可以使用名为“JavaFX Packager tool”的工具来创建它们。但如果你打算像这样从终端运行它们，你需要一个\
  \ `main()` 方法，而它需要做的就是调用 `launch()`，这是一个继承自 `Application` 的静态方法。\n\n这个窗口非常简单，但它有标题也有大小。你可以移动窗口、改变它的\
  \ own、最小化它等。\n\n更重要的是，这是所有 JavaFX 应用程序都将拥的基础“外壳”。如果你不真正理解所有这些代码的作用或它是如何运行的，也没关系，因为在每一个程序中它几乎都是一样的。\n\
  \n（唯一的真实区别在于我们为场景图的根节点选择了了种种容器。）\n\n## 练习 47：交互式窗口\n\n在这次练习中，我们将观察一个实际上能*执行某些操作*的更复杂的\
  \ GUI 窗口。它将有一个可以输入文本的文本框和一个按钮。当你点击按钮时，它将在终端中显示该文本。\n\n提前对开头所有的 import 语句表示歉意。我们的学习终于到了一个阶段，此时可能开始使用一个真正的集成开发环境\
  \ (IDE) 来为你自动完成某些 import 会更有意义。（如果你打算走那条路，我建议只用 Netbeans IDE 的 Java SE 包。）\n\n或者，你也可以使用一些通配符来导入整个包，以节省你的输入时间：\n\
  \n```\nimport javafx.application.Application;\nimport javafx.event.*;\nimport javafx.geometry.*;\n\
  import javafx.scene.*;\nimport javafx.scene.control.*;\nimport javafx.scene.layout.*;\n\
  ```\n\n无论如何，当你有很多 import 语句时，大多数机构希望它们按字母顺序排列，我已经在这些 GUI 练习中尝试这样做了。\n\n```java\n\
  \ 1 import javafx.application.Application;\n 2 import javafx.event.ActionEvent;\n\
  \ 3 import javafx.event.EventHandler;\n 4 import javafx.geometry.HPos;\n 5 import\
  \ javafx.geometry.Pos;\n 6 import javafx.scene.Scene;\n 7 import javafx.scene.control.Button;\n\
  \ 8 import javafx.scene.control.TextField;\n 9 import javafx.scene.layout.GridPane;\n\
  10 import javafx.stage.Stage;\n11 \n12 public class MessengerWindow extends Application\
  \ {\n13     @Override\n14     public void start(Stage stage) {\n15         GridPane\
  \ root = new GridPane();\n16         Scene scene = new Scene(root, 300, 200);\n\
  17 \n18         TextField tf = new TextField(\"Graphics the Hard Way!\");\n19  \
  \       Button btn = new Button(\"Print Message\");\n20 \n21         btn.setOnAction(new\
  \ EventHandler<ActionEvent>() {\n22             @Override\n23             public\
  \ void handle(ActionEvent event) {\n24                 System.out.println( tf.getText()\
  \ );\n25             }\n26         });\n27 \n28         root.setAlignment(Pos.CENTER);\n\
  29         root.setVgap(20);\n30 \n31         root.add(tf, 0, 0);\n32         root.add(btn,\
  \ 0, 1);\n33 \n34         stage.setTitle(\"Messenger Window\");\n35         stage.setScene(scene);\n\
  36         stage.show();\n37     }\n38 \n39     public static void main(String[]\
  \ args) {\n40         launch(args);\n41     }\n42 }\n```\n`MessengerWindow.java`\n\
  \n就像上一次一样，这个应用程序有一个阶段、一个场景，以及至少一个作为场景图根节点的节点。在这种情况下，根节点将是 `GridPane`，这使得按行和列排列组件变得简单。\n\
  \n### 你应该看到的\n\n![Linux screenshot](img/MessengerWindow.png)\n\nLinux 截图\n\n在设置好\
  \ `GridPane` 和场景之后，我们创建了两个“控件”：一个 `TextField` 和一个 `Button`。然后我们为按钮设置了一个所谓的事件处理器。JavaFX\
  \ 有许多内置控件，但那些弹出一个整个新窗口的在技术上是独立的阶段，因此——例如 `FileChooser`。\n\n我使用了一个匿名类来设置事件处理器，因为大多数\
  \ Java 程序员都是这样做的。你之前还没有见过这种形式。\n\n> JavaFX 有许多内置控件，包括复选框、日期选择器、进度条和对话框。它们中的大多数位于\
  \ `javafx.scene.control`，但那些弹出整个新“窗口”的在技术上是独立的阶段，因此——例如 `FileChooser` 位于 `javafx.stage`\
  \ 而不是这里。\n\n\n\n\n编译后如果你查看代码文件夹，你会发现除了 `MessengerWindow.class` 之外，还有一个名为 `MessengerWindow$1.class`\
  \ 的字节码文件。那就是匿名类的字节码！\n\n不管如何，`EventHandler` 接口只有一个我们需要实现的单一方法。它被称为 `handle()`。在这种情况下，我们只需要调用\
  \ `TextField` 对象的 `getText()` 方法，并打印出它给我们的 `String` 即可。\n\n`start()` 方法中的其余代码是让\
  \ `GridPane` 看起来像我们所想要的那样。我们希望面板面板内的控件在水平和垂直方向上都居中，因此我们在 `GridPane` 对象上调用了 `setAlignment()`。我们还希望控件之间有\
  \ 20 像素的垂直间距。\n\n然后，我们将 `TextField` 对象添加到网格的第 0 列第 0 行，并将 `Button` 添加到网格的第 0 列第\
  \ 1 行。\n\n最后，我们要求根节点将按钮对象的水平对齐方式设置为居中。（否则，按钮将左对齐。）\n\n然后，就像之前一样，我们设置了窗口的标题，将包含我们场景图的场景（scene）附加到舞台（stage）上，并让它可见。\n\
  \n图形程序很快就会变得复杂，这就是为什么我不带初学者做这些的。在下一个练习中，我将向你展示另一种在 JavaFX 中设置用户界面的方法。\n\n## 练习 48：使用\
  \ (F)XML 定义你的界面\n\n通常情况下，编写 Java 代码来定义界面的外观并没有意义。我真的需要为了让按钮居中而不是左对齐就重新编译吗？\n\n所以，和大多数图形库一样，JavaFX\
  \ 包含了一种在独立的文本文件中描述用户界面布局的方法，该文件可以手动创建或使用工具创建。当应用程序运行时，它会加载该文件来设置它的界面。\n\nJava 使用\
  \ XML 标记语言为此，并将其变体称为 FXML。这里有一个与之前的练习非常的程序，但使用 FXML 而不是 Java 代码来设置界面。\n\n```java\n\
  \ 1 import javafx.application.Application;\n 2 import javafx.fxml.FXMLLoader;\n\
  \ 3 import javafx.scene.Parent;\n 4 import javafx.scene.Scene;\n 5 import javafx.stage.Stage;\n\
  \ 6 \n 7 public class MessengerFXML extends Application {\n 8     @Override\n 9\
  \     public void start(Stage stage) throws Exception {\n10         Parent root\
  \ = FXMLLoader.load(getClass().getResource(\"messenger.fxml\"));\n 11         Scene\
  \ scene = new Scene(root, 300, 200);\n 12 \n 13         stage.setTitle(\"Messenger\
  \ FXML\");\n 14         stage.setScene(scene);\n 15         stage.show();\n 16 \
  \    }\n 17 \n 18     public static void main( String[] args ) {\n 19         launch(args);\n\
  \ 20     }\n 21 }\n```\n\n主类比以前简单得多，因为整个场景图是从一个 FXML 文件加载的！老实说，这段代码没什么内容。\n\n```java\n\
  \ 1 import javafx.event.ActionEvent;\n 2 import javafx.fxml.FXML;\n 3 import javafx.scene.control.Alert;\n\
  \ 4 import javafx.scene.control.TextField;\n 5 \n 6 public class MessengerFXMLController\
  \ {\n 7     @FXML private TextField tf;\n 8 \n 9     @FXML protected void handleButtonClickOrWhatever(ActionEvent\
  \ event) {\n10         Alert alert = new Alert(Alert.AlertType.INFORMATION, tf.getText());\n\
  \ 11         alert.showAndWait();\n 12     }\n 13 }\n```\n\n嗯，我们不能再使用匿名类了，所以这里有一个持有在点击\
  \ `Button` 时运行的方法类。`@FXML` 注解标记了你想要在 FXML 文件引用的变量或方法。\n\n注意，这个类可以是任何类；它*并不需要*实现\
  \ `EventHandler` 接口。而且由于我们没有为接口实现特定的方法，所以我们的处理器方法可以命名为任何我们。\n\n如果我们有十个按钮，我们可以把所有十个处理器方法都放在同一个类中。我们甚至可以把它们放在原始类中，但稍微分开一点会更整洁。\n\
  \n```xml\n 1 <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n 2 \n 3 <?import javafx.scene.layout.GridPane?>\n\
  \ 4 <?import javafx.scene.control.TextField?>\n 5 <?import javafx.scene.control.Button?>\n\
  \ 6 \n 7 <GridPane fx:controller=\"MessengerFXMLController\"\n 8     xmlns:fx=\"\
  http://javafx.com/fxml\" alignment=\"center\" vgap=\"20\">\n 9 \n10     <TextField\
  \ fx:id=\"tf\"\n 11         text=\"Graphics the FXML Way!\"\n 12         GridPane.columnIndex=\"\
  0\" GridPane.rowIndex=\"0\"/>\n 13 \n 14     <Button text=\"Print Message\"\n 15\
  \         GridPane.columnIndex=\"0\" GridPane.rowIndex=\"1\"\n 16         GridPane.halignment=\"\
  CENTER\"\n 17         onAction=\"#handleButtonClickOrWhatever\"/>\n 18 </GridPane>\n\
  ```\n\n这是我们的 FXML 文件。我把它命名为 `messenger.fxml`，但你可以称它为任何名字，只要名称与我们在 `start()` 方法开头加载的名称匹配即可。\n\
  \n\n\n\n你 `can` 使用 Java 来制作视频游戏。事实上，Minecraft（史上最畅销的独立视频游戏之一）就是用 Java 编写的。游戏通常需要对屏幕上绘制的内容及其绘制时机有非常详尽的控制，因此它们倾向于直接使用一个“画布（canvas）”并手动完成所有操作。\n\
  \n因此，接下来的几个练习将介绍如何在 JavaFX 程序中画布上进行绘制。\n\n```java\n 1 import javafx.application.Application;\n\
  \ 2 import javafx.scene.Group;\n 3 import javafx.scene.Scene;\n 4 import javafx.scene.canvas.Canvas;\n\
  \ 5 import javafx.scene.canvas.GraphicsContext;\n 6 import javafx.scene.paint.Color;\n\
  \ 7 import javafx.stage.Stage;\n 8 \n 9 public class CanvasBasics extends Application\
  \ {\n10     @Override\n11     public void start(Stage stage) {\n12         Group\
  \ root = new Group();\n13         Scene scene = new Scene(root);\n14 \n15      \
  \   Canvas canvas = new Canvas(800,600);\n16         GraphicsContext gc = canvas.getGraphicsContext2D();\n\
  17 \n18         gc.setStroke(Color.GREEN);\n19         gc.setFill(Color.GREEN);\n\
  20         gc.strokeRect(50, 20, 100, 200);\n21         gc.fillOval(160, 20, 100,\
  \ 200);\n22         gc.setFill(Color.BLUE);\n23         gc.fillRect(200, 400, 200,\
  \ 20);\n24         gc.strokeOval(200, 430, 200, 100);\n25 \n26         gc.setFill(Color.BLACK);\n\
  27         gc.fillText(\"Graphics are pretty neat.\", 500, 100);\n28 \n29      \
  \   double x = canvas.getWidth() / 2;\n30         double y = canvas.getHeight()\
  \ / 2;\n31         gc.fillText(\"This message is at (\" + x + \",\" + y + \")\"\
  , x, y);\n33 \n33         root.getChildren().add(canvas);\n34 \n35         stage.setTitle(\"\
  Canvas Basics\");\n36         stage.setScene(scene);\n37         stage.show();\n\
  38     }\n39 \n40     public static void main( String[] args ) {\n41         launch(args);\n\
  42     }\n43 }\n```\n\nCanvasBasics.java\n\n在 `start()` 方法的最开始处，我们做了一点 `little`不同的事情。我们没有告诉\
  \ `Scene` 窗口有多大，而是告诉 `Canvas` 对象应该是多大，然后让 `Scene` 自动调整大小以适应 `Canvas`。\n\n此外，我们没有使用\
  \ `GridPane`，而是回到了仅使用一个无聊的 `Group` 作为场景图的根。事实上，场景图中除了根节点和 `canvas` 之外，什么内容都没有。\n\
  \n### 你应该看到的\n\n![Linux screenshot of CanvasBasics](img/CanvasBasics-linux.png)\n\
  \nCanvasBasics 的 Linux 截图\n\n`Canvas` 是我们进行绘制的，但 `GraphicsContext` 对象包含了其中所有的方法。（这与其它编程语言的处理方式类似。）\n\
  \n所以我们告诉 `GraphicsContext`，每当它在画布上绘制线条描边时，都使用绿色（`setStroke()`）。同样，每当它在画布上填充形状时，它\
  \ `也` `also` 使用绿色（`setFill()`）。\n\n我们首先在画布上绘制一个仅有轮廓（描边）的矩形：距离左侧 50 像素，距离顶部 20 像素，宽度为\
  \ 100 像素，高度为 200 像素。\n\n> 几乎每一个 2D 图形库都将点 (0,0) 定义为屏幕的左上角。向右移动时 X 值增大，向底部移动时 Y 值增大。而且没有负值。\n\
  \n接下来我们绘制一个填充的椭圆。该椭圆将贴住左上角位于点 (160, 20) 的矩形侧边，而该矩形（以及椭圆）的大小为 100x200 像素。你可以看到椭圆和我们之前绘制的矩形大小相同，且椭圆从矩形右侧\
  \ 110 像素处开始。\n\n我们将填充颜色改为蓝色，并绘制一个左上角位于点 (200, 400) 的 200x20 填充矩形。然后，我们在矩形正下方绘制一个仅有轮廓的椭圆。我们从未更改过\
  \ `GraphicsContext` 的 `stroke` 属性，所以轮廓椭圆仍然是绿色的。\n\n然后我们将填充颜色改为黑色，并在画布上显示“Graphics\
  \ are pretty neat”字样。这条消息将从点 (500, 100) 开始。\n\n最后，我们计算画布的中心点，并从那里开始绘制另一条不同的消息。\n\
  \n现在，除非将 `Canvas` 对象添加到场景图中，否则这些内容都不会显示。我们仍然需要告诉 `Stage` 这个场景属于它，并让窗口/阶段变为可见。\n\n\
  这可能不是世界上最有趣的图形程序，但你将理解 `GraphicsContext` 对象是如何绘制到 `Canvas` 上的。\n\n\n\n\n然后我们创建第二个匿名类来创建一个匿名的\
  \ `AnimationTimer` 对象，并对其调用 `start()` 方法。`AnimationTimer` 每秒大约会调用其 `handle()` 方法\
  \ 60 次。（参数 `now` 包含一个不断递增的纳秒数，这有助于确定`精确`距离上一次调用 `handle()` 已经过去了多久。这对于复杂程序中的平滑动画是必要的。）\n\
  \n处理器用当前颜色绘制一个矩形，并在屏幕上显示当前消息。然而，在多次调用 `handle()` 方法之间，画布`并没有`被清除，因此我们必须通过用白色矩形覆盖它来手动“擦除”之前的消息。否则，当消息变化时，它将覆盖之前的消息并导致无法阅读。\n\
  \n### 你应该看到的\n\n![Linux screenshot of MouseDemo](img/MouseDemo-linux.png)\n\nMouseDemo\
  \ 的 Linux 截图\n\n对于程序来说，这种设计很奇怪，但它展示了编写游戏的一种非常常见的方式：使用一个每秒运行多次的主游戏循环。\n\n在下一个练习中，我们将绕个路，看看当你`不`（不）使用\
  \ `Canvas` 时，场景图的变化是如何自动重绘的。但之后我们将回到使用画布进行更多动画制作。\n\n## 练习 51：更复杂的鼠标交互\n\n在本次练习中，我们重新回到场景图，而不是在\
  \ `Canvas` 上手动绘制所有内容，因此不需要 `AnimationTimer`。我们还将使用 Java 内置的 `Circle` 对象。\n\n```java\n\
  \ 1 import javafx.application.Application;\n 2 import javafx.event.EventHandler;\n\
  \ 3 import javafx.scene.Group;\n 4 import javafx.scene.Scene;\n 5 import javafx.scene.control.Label;\n\
  \ 6 import javafx.scene.input.MouseEvent;\n 7 import javafx.scene.paint.Color;\n\
  \ 8 import javafx.scene.shape.Circle;\n 9 import javafx.stage.Stage;\n10 \n11 public\
  \ class TrafficLight extends Application {\n12     @Override\n 13     public void\
  \ start(Stage stage) {\n14         Group root = new Group();\n 15         Scene\
  \ scene = new Scene(root, 300, 600);\n16 \n17         Label label = new Label(\"\
  Click on one of the circles!\");\n18         label.relocate(20, 10);\n19 \n20  \
  \       Circle circle1 = new Circle(150, 140, 75);\n 21         circle1.setFill(Color.RED);\n\
  \ 22         Circle circle2 = new Circle(150, 310, 75);\n 23         circle2.setFill(Color.YELLOW);\n\
  \ 24         Circle circle3 = new Circle(150, 480, 75);\n 25         circle3.setFill(Color.web(\"\
  #008000\"));\n26 \n27         scene.addEventHandler(MouseEvent.MOUSE_CLICKED,\n\
  28                 new EventHandler<MouseEvent>() {\n29             @Override\n\
  30             public void handle(MouseEvent t) {\n31                 if ( circle1.contains(t.getX(),\
  \ t.getY()) )\n33                     label.setText(\"You clicked on the red circle!\"\
  );\n34                 else if ( circle2.contains(t.getX(), t.getY()) )\n34    \
  \                 label.setText(\"You clicked on the yellow circle!\");\n35    \
  \             else if ( circle3.contains(t.getX(), t.getY()) )\n36             \
  \        label.setText(\"You clicked on the green circle!\");\n37              \
  \   else\n38                     label.setText(\"Click at \" + t.getX() + \", \"\
  \ + t.getY());\n39             }\n40         });\n41 \n42         root.getChildren().addAll(label,\
  \ circle1, circle2, circle3);\n43 \n44         stage.setTitle(\"Traffic Light\"\
  );\n45         stage.setScene(scene);\n46         stage.show();\n47     }\n48 \n\
  49     public static void main( String[] args ) { launch(args); }\n50 }\n```\n\n\
  `TrafficLight.java`\n\n在之前的练习中，我们使用 `GridPanel` 作为场景图的根节点。我们只需要告诉它将控件放在哪一行、哪一列，它就会管理所有东西的位置。\n\
  \n这次我们只使用通用的 `Group` 节点作为根节点，因此我们将手动指定该组内所有元素的位置。\n\n`Label` 对象只显示文本。与 `TextField`\
  \ 不同，文本不能由用户编辑，但我们仍然可以更改。标签默认将自己放置在 `(0, 0)` 点处，因此我们手动将其移动到从 `(10,20)` 开始。\n\n然后我们创建三个\
  \ `Circle` 对象，指定每个圆的中心点和半径，然后告诉每个 `Circle` 对象用什么颜色填充自己。\n\n对于第三个圆，我们本可以直接使用 `Color.GREEN`，但我想演示一下\
  \ JavaFX 也允许你使用类似 Web 的十六进制值设置颜色。\n\n然后，我们向 `Scene` 对象添加了一个匿名类来处理鼠标点击。与之前的练习不同，我们实际上是想知道他们点击了`哪里`，因此我们将调用\
  \ `MouseEvent` 参数的 `getX()` 和 `getY()` 方法。\n\nJavaFX `Circle` 对象非常方便，因为你只需要使用内置的\
  \ `contains()` 方法询问它们某个点是否在内部即可。所以，如果点击在第一个圆内，我们会更新标签文本以说明。如果点击没有在`任何`圆内，我们只需更改标签显示他们点击的位置。\n\
  \n最后，我们使用方便的 `addAll()` 方法将标签和我们的三个圆添加到场景图中。（我们也可以调用四次 `add()`。）\n\n## 练习 52：动画\n\
  \n在本次练习中，我们仍然使用场景图在事物发生变化时自动重绘的能力，但我们现在回到使用 `AnimationTimer` 来让物体在没有用户输入的情况下移动起来。\n\
  \n我们将让一个 Logo 在屏幕上“弹跳”。\n\n\n\n\n\n```java\nimport javafx.animation.AnimationTimer;\n\
  import javafx.application.Application;\nimport javafx.event.EventHandler;\nimport\
  \ javafx.scene.Group;\nimport javafx.scene.Scene;\nimport javafx.scene.image.Image;\n\
  import javafx.scene.image.ImageView;\nimport javafx.scene.input.KeyCode;\nimport\
  \ javafx.scene.input.KeyEvent;\nimport javafx.scene.paint.Color;\nimport javafx.scene.shape.Rectangle;\n\
  import javafx.stage.Stage;\n\npublic class BouncingLogo extends Application {\n\
  \    private boolean flashing = false;\n    private double x, y, dx, dy;\n\n   \
  \ @Override\n    public void start(Stage stage) {\n        Group root = new Group();\n\
  \        Scene scene = new Scene(root, 900, 700);\n\n        x = 500;\n        y\
  \ = 350;\n        dx = 5;\n        dy = 5;\n\n        Image img = new Image(\"file:datafiles/ljthw-logo-32px.png\"\
  );\n        ImageView logo = new ImageView(img);\n        logo.relocate(x,y);\n\n\
  \        Rectangle rect = new Rectangle(x, y, img.getWidth(), img.getHeight());\n\
  \        rect.setFill(Color.WHITE);\n\n        scene.addEventHandler(KeyEvent.KEY_PRESSED,\n\
  \                new EventHandler<KeyEvent>() {\n            @Override\n       \
  \     public void handle(KeyEvent t) {\n                if ( t.getCode() == KeyCode.SPACE\
  \ )\n                    flashing = ! flashing;\n            }\n        });\n\n\
  \        root.getChildren().add(rect);\n        root.getChildren().add(logo);\n\n\
  \        stage.setTitle(\"Bouncing Logo\");\n        stage.setScene(scene);\n  \
  \      stage.show();\n\n        new AnimationTimer() {\n            @Override\n\
  \            public void handle(long now) {\n                x += dx;\n        \
  \        y += dy;\n\n                if ( x < 0 || x+img.getWidth() > scene.getWidth()\
  \ )\n                    dx = -dx;\n                if ( y < 0 || y+img.getHeight()\
  \ > scene.getHeight() )\n                    dy = -dy;\n\n                if ( flashing\
  \ ) {\n                    double red = Math.random();\n                    double\
  \ green = Math.random();\n                    double blue = Math.random();\n   \
  \                 rect.setFill(Color.color(red,green,blue));\n                }\n\
  \                logo.relocate(x,y);\n                rect.relocate(x,y);\n    \
  \        }\n        }.start();\n    }\n\n    public static void main( String[] args\
  \ ) { launch(args); }\n}\n```\n\n`BouncingLogo.java`\n\n我们使用两个变量 `x` 和 `y` 来跟踪图像的位置。变量\
  \ `dx` (delta-x) 将用于跟踪图像 x 值在每一帧中的变化量，`dy` 也是如此，但针对的是 y 值。虽然可以使用角度和速度来代替，但那样你就得接触三角函数了，这对我的高中生们来说很麻烦。\n\
  \n由于这些变量将由我们的匿名内部类修改，因此我们必须将它们变为实例变量，而不仅仅是 `start()` 方法内部的局部变量。\n\n我们从 `datafiles`\
  \ 文件夹中的文件加载一张图像，并创建一个 `Image` 对象。然后，我们将 `Image` 封装在 `ImageView` 对象中，这是一个可以添加到场景图中的节点。（你可以使用\
  \ `GraphicsContext` 的 `drawImage()` 方法直接在 `Canvas` 上绘制 `Image` 对象，但除非它们在 `ImageView`\
  \ 中，否则你不能直接将 `Image` 对象添加到场景图中。）我们还创建了一个同样大小的 `Rectangle` 对象，绘制在图像下方。\n\n因此，图像（以及下方的矩形）从屏幕中心稍右的位置开始，每帧向右移动\
  \ 5 像素 (`dx`) 向移动 5 像素 (`dy`)。\n\n我们在 `Scene` 中添加了一个 `KeyEvent` 处理器来手动处理按键按下。当按下按键时，如果按键是空格键，我们就切换\
  \ `flashing` 变量的值。（稍后我们会看到这个变量的作用。）\n\n然后，我们将 `Rectangle` 添加到场景图中，*然后*添加 `ImageView`\
  \ 节点。按照这个顺序添加会将 `Rectangle` 画在底部，并将 `Image` 画在 `Rectangle` 之上。接着我们显示窗口。\n\n`AnimationTimer`\
  \ 的匿名类稍微复杂一些。在每一帧中，我们将 `dx` 和 `dy` 加到图像的位置上。\n\n然后，如果 `x` 的新值小于 0，或者比图像宽度更靠近墙壁，说明我们“撞”到了左墙或右墙。因此，我们改变\
  \ `dx` 的符号（也就是说，如果它原来是 `5`，现在就是 `-5`，反之亦然）。这将使图像在帧向另一个方向移动。\n\n同样，如果 `y` 的新值超出边界，我们就改变\
  \ `dy` 来垂直反弹。\n\n如果 `flashing` 变量为 `true`，我们为新色的红、绿、蓝分量选取 0 到 1 之间的随机值，然后告诉矩形使用该新颜色进行填充。这每帧都会发生，所以图像下方的矩形会烦人地闪烁，直到再次按下空格键。\n\
  \n最后，我们 `relocate()` `ImageView` 和 `Rectangle` 对象到这个新位置，这会修改场景图并触发屏幕的重绘。\n\n###\
  \ 你应该看到的\n\n![Bouncing Logo Linux 截图](img/BouncingLogo-linux.png)\n\nBouncing Logo\
  \ Linux 截图\n\n（动起来更酷。）\n\n## 练习 53：处理按键事件\n\n在游戏中错误地处理按键是非常常见的。假设你想让角色在按下右箭头键时向右移动。你可能会考虑这样的代码：\n\
  \n```\nif ( t.getCode() == KeyCode.RIGHT )\n    x += 5;\n```\n\n这种方法*确实*有效。但结果会很卡顿，而且他们无法一直按住键！所以让我们来看看效果更好的方法。\n\
  \n\n\n\n\n```java\nimport javafx.animation.AnimationTimer;\nimport javafx.application.Application;\n\
  import javafx.event.EventHandler;\nimport javafx.scene.Group;\nimport javafx.scene.Scene;\n\
  import javafx.scene.canvas.Canvas;\nimport javafx.scene.canvas.GraphicsContext;\n\
  import javafx.scene.input.KeyCode;\nimport javafx.scene.input.KeyEvent;\nimport\
  \ javafx.scene.paint.Color;\nimport javafx.stage.Stage;\n\npublic class Plotter\
  \ extends Application {\n    private double x, y;\n    private boolean up, down,\
  \ left, right;\n\n    @Override\n    public void start(Stage stage) {\n        Group\
  \ root = new Group();\n        Scene scene = new Scene(root);\n\n        Canvas\
  \ canvas = new Canvas(900,700);\n        GraphicsContext gc = canvas.getGraphicsContext2D();\n\
  \n        x = 450;\n        y = 350;\n        int speed = 7;\n\n        scene.addEventHandler(KeyEvent.KEY_PRESSED,\n\
  \                new EventHandler<KeyEvent>() {\n                    @Override\n\
  \                    public void handle(KeyEvent t) {\n                        if\
  \ ( t.getCode() == KeyCode.UP || t.getCode() == KeyCode.W )\n                  \
  \          up = true;\n                        if ( t.getCode() == KeyCode.DOWN\
  \ || t.getCode() == KeyCode.S )\n                            down = true;\n    \
  \                    if ( t.getCode() == KeyCode.LEFT || t.getCode() == KeyCode.A\
  \ )\n                            left = true;\n                        if ( t.getCode()\
  \ == KeyCode.RIGHT || t.getCode() == KeyCode.D )\n                            right\
  \ = true;\n\n                        if ( t.getCode() == KeyCode.DIGIT1 )\n    \
  \                        gc.setFill(Color.BLACK);\n                        else\
  \ if ( t.getCode() == KeyCode.DIGIT2 )\n                            gc.setFill(Color.RED);\n\
  \                        else if ( t.getCode() == KeyCode.DIGIT3 )\n           \
  \                 gc.setFill(Color.GREEN);\n                        else if ( t.getCode()\
  \ == KeyCode.DIGIT4 )\n                            gc.setFill(Color.BLUE);\n   \
  \                 }\n                });\n\n        scene.addEventHandler(KeyEvent.KEY_RELEASED,\n\
  \                new EventHandler<KeyEvent>() {\n                    @Override\n\
  \                    public void handle(KeyEvent t) {\n                        if\
  \ ( t.getCode() == KeyCode.UP || t.getCode() == KeyCode.W )\n                  \
  \          up = false;\n                        if ( t.getCode() == KeyCode.DOWN\
  \ || t.getCode() == KeyCode.S )\n                            down = false;\n   \
  \                     if ( t.getCode() == KeyCode.LEFT || t.getCode() == KeyCode.A\
  \ )\n                            left = false;\n                        if ( t.getCode()\
  \ == KeyCode.RIGHT || t.getCode() == KeyCode.D )\n                            right\
  \ = false;\n                    }\n                });\n\n        root.getChildren().add(canvas);\n\
  \n        stage.setTitle(\"Plotter\");\n        stage.setScene(scene);\n       \
  \ stage.show();\n\n        new AnimationTimer() {\n            @Override\n     \
  \       public void handle(long now) {\n                if ( up )\n            \
  \        y -= speed;\n                else if ( down )\n                    y +=\
  \ speed;\n                if ( left )\n                    x -= speed;\n       \
  \             else if ( right )\n                    x += speed;\n\n           \
  \         gc.fillRect(x, y, 20, 20);\n            }\n        }.start();\n    }\n\
  \n    public static void main( String[] args ) { launch(args); }\n}\n```\n\n###\
  \ Plotter.java\n\n我们正在使用四个布尔值来跟踪用户的意图移动。如果他们想向上，那么 `up` 就为 `true`。如果他们不想向上，那么 `up`\
  \ 应该为 `false`。\n\n你应该知道，如果你在文字处理文档中输入字母“q”，会发生三个独立的按键事件：\n\n*   对于字母“Q”，由于会发生一个\
  \ `KEY_PRESSED` 事件。\n*   对于字母“q”，会发生一个 `KEY_TYPED` 事件。\n*   当他们松开“Q”键时，会发生一次 `KEY_RELEASED`\
  \ 事件。\n\n`KEY_PRESSED` 和 `KEY_RELEASED` 是非常底层的事件，适用于任何按键，包括像 `SHIFT` 和 `F1` 这样的修饰键。`KEY_TYPED`\
  \ 是高层事件，只有在输入实际字符时才会触发。例如，当我想要输入大写的“Q”时，会生成五个 `KeyEvents`：\n\n1.  `SHIFT` 的 `KEY_PRESSED`\n\
  2.  `Q` 的 `KEY_PRESSED`\n3.  “Q” 的 `KEY_TYPED`\n4.  `Q` 的 `KEY_RELEASED`\n5.  `SHIFT`\
  \ 的 `KEY_RELEASED`\n\n注意，在 `KEY_PRESSED` 或 `KEY_RELEASED` 事件中，大写的“Q”和小写的“q”之间没有区别。它们都只是“Q”。\n\
  \n此外，如果你长按按键，操作系统的按键重复功能会在一秒后启动，你将获得多个 `KEY_TYPED` 事件。\n\n所以我们是这样处理的：如果向上箭头被 `PRESSEDSED`，我们将相应的布尔变量设为\
  \ `true`。然后，当向上箭头稍后被 `RELEASED` 时，我们将变量改回 `false`。\n\n这样一来，我们就不必处理键盘重复的问题了，而且他们可以同时按住多个键，且一切都能正常运行。\n\
  \n然后，`AnimationTimer` 处理器完全不需要关心按键。如果 `up` 的布尔变量为 `true`，就向上移动。\n\n我使用了一些 `else\
  \ if` 语句来确保 `up` 优先于 `down`，`left` 优先于 `right`，但你可以移除它们，直接将这四个都变成 `if` 语句，它们仍然可以工作。如果他们同时按住\
  \ UP 和 DOWN，它们会互相抵消。\n\n### 你应该看到的\n\n![Linux screenshot of Plotter](img/Plotter-linux.png)\n\
  \nPlotter Linux 截图\n\n我想我应该补充一下，你只在 PRESSED 和 RELEASED 事件中使用 `getCode()`。如果你实际上想检查\
  \ `KEY_TYPED` 事件，你将需要调用 `getCharacter()` 来获取他们实际输入的字符串。\n\n关于图形的新内容就到这里了。在接下来的两个练习中，我们将所有内容整合在一起，为你在之前的练习中制作的两个游戏制作图形界面！\n\
  \n## 练习 54：图形化井字游戏\n\n在早期的练习 15 中，我们创建了 `NoughtsCrossesObject`，这是一个包含井字游戏所有有趣部分方法的对象。这个练习需要那些代码，所以如果你还没有输入它们（并修复它们！），现在应该去做了。\n\
