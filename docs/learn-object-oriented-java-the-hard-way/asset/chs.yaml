  \ `main()` 方法的类。\n\n我们可以自己创建一个清单文件。清单文件通常称为 `manifest.mf`，但如果将其命名为 `manifest.txt`，创建和编辑会稍微简单一些。对于这个\
  \ JAR，清单看起来像这样：\n\n```\nMain-Class: ZooDriver\n```\n\nmanifest.txt\n\n（它只有一行，但最后必须有一个换行符，所以在在保存之前至少按一次回车键。）\n\
