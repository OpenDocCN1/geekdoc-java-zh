  \n    public final String toString() {\n        return \"门是 \" + (isOpen ? \"打开的。\"\
  \ : \"关闭的.\");\n    }\n}\n```\n\n### DropGameConsole.java\n这是一个非常简单的终端版本游戏。所有有趣的代码都位于\
  \ `DropGameHelper` 中。\n\n#### 你应该\n我们在学习图形后会回顾 `DropGameHelper`。那时我们将制作它的图形化版本！\n\
  \n### 练习 3：抽象类和最终方法\n面向对象编程中我们还没有过的两个主要概念：抽象类和包。\n\n抽象类是继承类和实现接口之间的折中方案，结合了后者的特征。\n\
  \n#### AbstractDoor.java\n*AbstractDoor* 是一个抽象类。如果一个类是 `abstract`，它就不能被实例化。你必须继承它并实例化子类。\n\
  \n\n\n\n`soundProofing()` 方法是抽象的，因此没有实现，只有一个方法定义。这类似于接口中的方法：子类被要求提供具体的实现。\n\n我还决定将\
  \ `toString()` 方法设为 `final`。（这与抽象类或抽象方法无关；我只是想在这一章提到它。）\n\n`final` 方法在某种程度上是抽象方法的相反。抽象方法*必须*在扩展此类的类中实现；而\
  \ `final` 方法*不能*在子类中被重写。\n\n这里是一个没有正确处理的子类示例。\n\n```\n1 // 无法编译\n2 public class\
  \ BadDoor extends AbstractDoor {\n3     public BadDoor(boolean b) { super(b); }\n\
  4 \n5     @Override\n6     public String toString() {\n7         return \"The bad\
  \ door is \" + (isOpen ? \"open.\" : \"closed.\");\n8     }\n9 }\n```\n\n`BadDoor.java`\n\
  \n`BadDoor` 类有两个问题。首先：它扩展了一个抽象类，但*未能*为抽象方法 `soundProofing()` 提供实现。编译器会报错。\n\n其次，它尝试重写\
  \ `toString()` 方法，尽管该方法在父类中被标记为 `final`。编译器也会报错。\n\n现在让我们来看一个正确处理的类。\n\n```\n 1\
  \ public class GoodDoor extends AbstractDoor {\n 2 \n3     public GoodDoor(boolean\
  \ b) { super(b); }\n 4 \n5     public double soundProofing() {\n 6         if (\
  \ isOpen )\n 7             return 0;\n 8         else\n9             return 8.5;\n\
  10     }\n11 }\n```\n\n`GoodDoor.java`\n\n`GoodDoor` 类一切做得都是正确的。它实现了抽象方法，并且尝试重写任何\
  \ final 方法。这是一个很好的门。\n\n```\n 1 public class DoorDriver {\n 2     public static\
  \ void main(String[] args) {\n 3         // AbstractDoor d1 = new AbstractDoor(true);\
  \ // 无法实例化\n 4         // BadDoor d2 = new BadDoor(true);  // 无法编译\n 5 \n6     \
  \    GoodDoor d3 = new GoodDoor(false);\n 7         System.out.println(d3);\n 8\
  \         System.out.println(\"\\tSound-proofing level: \" + d3.soundProofing());\n\
  \ 9         d3.open();\n10         System.out.println(d3);\n11         System.out.println(\"\
  \\tSound-proofing level: \" + d3.soundProofing());\n 12 \n13         AbstractDoor\
  \ d4 = new GoodDoor(true);\n 14         System.out.println(d4);\n 15         System.out.println(\"\
  \\tSound-proofing level: \" + d4.soundProofing());\n 16     }\n17 }\n```\n\n`DoorDriver.java`\n\
  \n与接口类似，抽象类不能被实例化。然而，正如我们看到的，使用引用变量是合法的：\n\n```\nAbstractDoor d4 = new GoodDoor(true);\n\
  ```\n\n变量 `d4` 保存任意 `AbstractDoor` 对象的引用。由于 `GoodDoor` 类 `extends` `AbstractDoor`，因此任何\
  \ `GoodDoor` 对象*也是*一个 `AbstractDoor` 对象。因此 `d4` 可以持有它的引用，就像对待普通的非抽象父类一样。\n\n###\
  \ 你应该看到的\n\nJava 拥有接口，因此抽象方法和抽象类并没有被频繁使用。一些旧语言（如 C++）没有类似接口的东西，因此所有内容都通过抽象类来处理。它们会创建一个所谓的“纯”抽象类，其中*所有*方法都是抽象的，而\
  \ Java 程序员可能会在这里使用接口。\n\nOracle 的[关于抽象方法的 Java 教程](https://docs.oracle.com/javase/tutorial/java/IandI/abstract.html)\
  \ 提供了更多细节，但通常如果你“想在几个密切相关的类之间共享代码”，你会使用抽象类；而当你“预计互不相关的类会实现你的接口”时，你会使用接口。\n\n## 练习\
  \ 44：包 (Packages)\n\n当我们探索此书中的最后一个主要的面向对象概念时，让我们回顾面向对象编程。\n\n面向对象编程是为了为你提供工具，使得*大型*程序没有\
  \ bug 并且容易以复杂的方式组合在一起。我们不会只把 100,000 行代码放在一个函数里，而是将代码拆分成方法。\n\n我们不会仅仅将*所有*变量堆在一起以便让每行代码都能访问它们；我们会显式地将它们作为参数传递给方法。并不是每个值都会从方法中*出来*——只有我们返回的值。\n\
  \n我们将相关的方法分组为较大的块，称为 `class`（类），并带有一些共享变量（字段）。\n\n最后，我们将相关的*类*分组为更大的块，称为 `package`（包）。\n\
  \n你从一开始就在*使用*包了，只是还没有编写过自己的。考虑这个导入语句：\n\n```\nimport java.util.ArrayList;\n```\n\
  \n`ArrayList` 类包含在一个名为“util”的 `package` 中。这就是它的含义。Java 中的包是可选的，但几乎所有大型项目都会使用它们。\n\
