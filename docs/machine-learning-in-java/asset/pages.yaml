    # Advanced modeling with ensembles


    In the previous section, we implemented an orientation baseline, so let''s focus
    on heavy machinery. We will follow the approach taken by the KDD Cup 2009 winning
    solution developed by the IBM Research team (Nicolaescu-Mizil and others, 2009).


    Their strategy to address the challenge was using the Ensemble Selection algorithm
    (Caruana and Niculescu-Mizil, 2004). This is an ensemble method, which means it
    constructs a series of models and combines their output in a specific way to provide
    the final classification. It has several desirable properties as shown in the
    following list that makes it fit for this challenge:


    +   * It is proven to be robust, yielding excellent performance

    * It can be optimized for a specific performance metric, including AUC

    * It allows different classifiers to be added to the library

    * It is an anytime method, meaning that, if we run out of time, we have a solution
    available


    In this section, we will loosely follow the steps as described in their report.
    Note, this is not an exact implementation of their approach, but rather a solution
    overview that will include the necessary steps to dive deeper.


    The general overview of steps is as follows:


    +   1. First, we will preprocess the data by removing attributes that clearly
    do not bring any value, for example the missing or constant values; fixing missing
    values in order to help machine learning algorithms, which cannot deal with them;
    and converting categorical attributes to numerical.

    2. Next, we will run attributes selection algorithm to select only a subset of
    attribute that can help in prediction of tasks.

    3. In the third step, we will instantiate the Ensemble Selection algorithms with
    a wide variety of models, and, finally, evaluate the performance.


    { 77 }'
