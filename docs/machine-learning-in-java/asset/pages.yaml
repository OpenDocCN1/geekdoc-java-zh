  md: '# Predictive Model Markup Language


    Predictive Model Markup Language (PMML) is an XML-based interchange format that
    allows machine learning models to be easily shared between applications and systems.
    Supported models include logistic regression, neural networks, decision trees,
    naive Bayes, regression models, and many others. A typical PMML file consists
    of the following sections:


    +   * Header containing general information

    * Data dictionary, describing data types

    * Data transformations, specifying steps for normalization, discretization, aggregations,
    or custom functions

    * Model definition, including parameters

    * Mining schema attributes used by the model

    * Targets allowing post-processing of the predicted results

    * Output fields to be outputted and other post-processing steps


    The generated PMML files can be imported to any PMML-consuming application, as
    Zementis Adaptive Decision and Predictive Analytics (ADAPA) and Universal PMML
    Plug-in (UPPI) scoring engines; Weka, which has built-in support for regression,
    general regression, neural network, TreeModel, RuleSetModel, and Support Vector
    Machine (SVM) model; Spark, which can export k-means clustering, linear regression,
    ridge regression, lasso model, binary logistic model, and SVM; and cascading,
    which can transform PMML files into an application on Apache Hadoop.


    The next generation of PMML is an emerging format called Portable Format for Analytics
    (PFA), providing a common interface to deploy the complete workflows across environments.


    # Machine learning in the cloud


    Setting up a complete learning stack that is able to scale with the increasing
    amount of data could be challenging. Recent wave of Software as a Service (SaaS)
    and Infrastructure as a Service (IaaS) paradigm has spilled over to machine learning
    domain as well. The trend today is to move the actual data preprocessing, modeling,
    and prediction to cloud environments and focus on modeling task only.


    In this section, we will review some of the promising services offering algorithms,
    predictive models already train in specific domain, and environments empowering
    collaborative workflows in data science teams.'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# Machine learning as a service


    The first category is algorithms as a service, where you are provided with an
    API or even graphical user interface to connect pre-programmed components of data
    science pipeline:


    +   - Google Prediction API was one of the first companies that introduced prediction
    services through its web API. The service is integrated with Google Cloud Storage
    serving as data storage. The user can build a model and call an API to get predictions.

    - BigML implements a user-friendly graphical interface, supports many storage
    providers (for instance, Amazon S3) and offers a wide variety of data processing
    tools, algorithms, and powerful visualizations.

    - Microsoft Machine Learning provides a large library of learning algorithms and
    data processing functions, as well as graphical user interface, to connect these
    components to an application. Additionally, it offers a fully-managed service
    that you can use to deploy your models as ready-to-consume web services.

    - Amazon Machine Learning entered the market quite late. It''s seamless integration
    with other Amazon services, while the number of algorithms and user interface
    needs further improvements.

    - IBM Watson Analytics focuses on providing models that are already hand-crafted
    to a particular domain such as speech recognition, machine translations, and anomaly
    detection. It targets a wide range of industries by using specific cases.

    - Prediction.IO is a self-hosted open source platform, providing the full stack
    from data storage to modeling to serving the predictions. Predicton IO talk to
    Apache Spark to leverage its learning algorithms. In addition, it is shipped with
    a wide variety of models targeting specific domains, for instance, recommender
    system, churn prediction, and others.


    Predictive API is an emerging new field, so these are some of the well-known examples;
    KDNuggets compiled a list of 50 machine learning APIs at http://www.kdnuggets.com/2015/12/machine-learning-data-science-apis.html.


    > To learn more about it, you can visit PAPI, the International Conference on
    Predictive APIs and Apps at http://www.papi.io or take a look at a book by Louis
    Dorard, Bootstrapping Machine Learning (L. Dorard, 2014).'
  merge: -1
  pgno: 238
