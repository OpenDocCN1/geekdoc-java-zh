  md: 'By looking at the keywords, we can recognize the news articles were concerned
    with sports, business, upcoming election, and so on. Later in this chapter, we
    will learn how to implement text modeling using the news article example.


    # Text classification


    In text classification, or text categorization, the goal is to assign a text document
    according to its content to one or more classes or categories, which tend to be
    a more general subject area such as vehicles or pets. Such general classes are
    referred to as topics, and the classification task is then called text classification,
    text categorization, topic classification, or topic spotting. While documents
    can be categorized according to other attributes such as document type, author,
    printing year, and so on, the focus in this chapter will include the following
    components: Examples of text classification


    +   - Spam detection in e-mail messages, user comments, webpages, and so on

    - Detection of sexually-explicit content

    - Sentiment detection, which automatically classifies a product/service review
    as positive or negative

    - E-mail sorting according to e-mail content

    - Topic-specific search, where search engines restrict searches to a particular
    topic or genre, thus providing more accurate results


    These examples show how important text classification is in information retrieval
    systems, hence most modern information retrieval systems use some kind of text
    classifier. The classification task that we will use as an example in this book
    is text classification for detecting e-mail spam.


    We continue this chapter with an introduction to Mallet, a Java-based package
    for statistical natural language processing, document classification, clustering,
    topic modeling, information extraction, and other machine learning applications
    to text. We will then cover two-analytics applications, namely, topics modeling
    and spam detection as text classification.'
