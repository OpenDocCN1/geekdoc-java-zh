  md: '# The need for Java


    New machine learning algorithms are often first scripted at university labs, gluing
    together several languages as shell scripting, Python, R, MATLAB Java, Scala,
    or C++ to provide a new concept and theoretically analyze its properties. An algorithm
    might take a long path of refactoring before it lands in a library with standardized
    input/outputs. While Python, R, and MATLAB are quite popular, they are mainly
    used for prototyping, research and experimenting. Java, on the other hand, is
    the de-facto enterprise language, which could be attributed to static typing,
    good maintainability, as well as decent threading model, and high-performance
    concurrent data structure libraries. Moreover, there are already many Java libraries
    available for machine learning, which make it really convenient to interface them
    in existing Java applications and leverage powerful machine learning capabilities.


    # Machine learning libraries


    There are over 70 Java-based open source machine learning projects listed on the
    MLOSS website and many others live at university servers, GitHub and Bitbucket.
    In this section, we will review the major libraries and platforms, the kind of
    problems they can solve, the algorithms they support, and the kind of data they
    can work with.


    # Weka


    Weka, which is short for Waikato Environment for Knowledge Analysis, is a machine
    learning library developed at the University of Waikato, New Zealand, and is probably
    the most well-known Java library. It is a general-purpose library that is able
    to solve a wide variety of machine learning tasks, such as classification, regression,
    and clustering. It features a rich graphical user interface, command-line interface,
    and Java API. You can check out Weka at http://www.cs.waikato.ac.nz/ml/weka/.'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'At the time of writing this book, Weka contains 267 algorithms in total: data
    processing (82), attribute selection (33), classification and regression (133),
    clustering (12), and association rules mining (7). Graphical interfaces are well-suited
    for exploring your data, while Java API allows you to develop new machine learning
    schemes and use the algorithms in your applications.


    ![](img/19ac99d70883ac011b12e9f3fe27f16b_53_0.png)


    Weka is distributed under GNU General Public License (GNU GPL), which means that
    you can copy, distribute, and modify it as you track changes in source files and
    keep it under GNU GPL. You can even distribute it commercially, but you must disclose
    the source code or obtain a commercial license.


    In addition to several supported file formats, Weka features its own default format,
    ARFF, to describe data by attribute-data pairs. It consists of two parts. The
    first part contains header, which specifies all the attributes (that is, features)
    and their type; for instance, nominal, numeric, and string. The second part contains
    data, where each line corresponds to an instance. The last attribute in the header
    is implicitly considered the target variable, missing data are marked with a question
    mark. For example, returning to the example from Chapter 1, Applied Machine Learning
    Quick Start, the Bob instance written in an ARFF file format would be as follows:


    ```

    @RELATION person_dataset


    @ATTRIBUTE ''Name'' STRING

    @ATTRIBUTE ''Height'' NUMERIC

    @ATTRIBUTE ''Eye color'' [blue, brown, green]

    @ATTRIBUTE ''Hobbies'' STRING


    @DATA

    ''Bob'', 185.0, blue, ''climbing, sky diving''

    ''Anna'', 163.0, brown, ''reading''

    ''Jane'', 168.0, ?, ?

    ```'
