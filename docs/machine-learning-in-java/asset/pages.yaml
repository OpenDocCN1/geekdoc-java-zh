    Now let''s take a look at how to use this model.


    # # Reusing a model


    As we are not building models on the fly, it often makes sense to train a model
    once and use it repeatedly to classify new data.


    Note that if you''d like to classify new documents, they need to go through the
    same pipeline as other documents—the pipe needs to be the same for both training
    and classification. During training, the pipe''s data alphabet is updated with
    each training instance. If you create a new pipeline with the same steps, you
    don''t produce the same pipeline as its data alphabet is empty. Therefore, to
    use the model on new data, save/load the pipe along with the model and use this
    pipe to add new instances.


    # # Saving a model


    Mallet supports a standard method for saving and restoring objects based on serialization.
    We simply create a new instance of ObjectOutputStream class and write the object
    into the file as follows:


    ```

    String modelPath = "myTopicModel";


    //Save model

    ObjectOutputStream oos = new ObjectOutputStream(

    new FileOutputStream(new File(modelPath+".model")));\oos.writeObject(model);

    oos.close();


    //Save pipeline

    oos = new ObjectOutputStream(

    new FileOutputStream(new File(modelPath+".pipeline")));

    oos.writeObject(pipeline);

    oos.close();

    ```


