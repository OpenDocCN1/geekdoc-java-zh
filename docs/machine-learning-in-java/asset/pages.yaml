  md: '# Web resources and competitions


    In this section, we''ll review where to find additional resources for learning,
    discussing, presenting, or sharpening our data science skills.


    # Datasets


    One of the most well-known repositories of machine learning datasets is hosted
    by the University of California, Irvine. The UCI repository contains over 300
    datasets covering a wide variety of challenges, including poker, movies, wine,
    activity recognition, stocks, taxi service trajectories, advertisements, and many
    others. Each dataset is equally equipped with a research paper where the dataset
    was used, which can give you a hint on how to start and what is the prediction
    baseline.


    The UCI machine learning repository can be accessed at https://archive.ics.uci.edu,
