  md: '# Feature selection


    As introduced in Chapter 1, Applied Machine Learning Quick Start, one of the pre-processing
    steps is focused on feature selection, also known as attribute selection. The
    goal is to select a subset of relevant attributes that will be used in a learned
    model. Why is feature selection important? A smaller set of attributes simplifies
    the models and makes them easier to interpret by users, this usually requires
    shorter training and avoids overfitting.


    Attribute selection can take into account the class value or not. In the first
    case, an attribute selection algorithm evaluates the different subsets of features
    and calculates a score that indicates the quality of selected attributes. We can
    use different searching algorithms as exhaustive search, first search, and different
    quality scores such as information gain, Gini index, and so on.


    Weka supports this by an AttributeSelection object, which requires two additional
    parameters: evaluator, which computes how informative an attribute is and a ranker,
    which sorts the attributes according to the score assigned by the evaluator.


    In this example, we will use information gain as an evaluator and rank the features
    by their information gain score:


    ```

    InfoGainAttribute eval = new InfoGainAttributeEval();

    Ranker search = new Ranker();

    ```


    Next, we initialize an AttributeSelection object and set the evaluator, ranker,
    and data:


    ```

    AttributeSelection attSelect = new AttributeSelection();

    attSelect.setEvaluator(eval);

    attSelect.search(search);

    attSelect.selectAttributes(data);

    ```


    Finally, we can print an order of list indices, as follows:


    ```

    int[] indices = attSelect.selectedAttributes();

    System.out.println(Utils.toString(indices));

    ```


    The method outputs the following result:


    12, 3, 7, 2, 0, 1, 8, 9, 13, 4, 11, 5, 10, 6, 14, 16


    The top three most informative attributes are 12 (fins), 3 (eggs), 7 (aquatic),
    2 (hair), and so on. Based on this, we can remove additional, non-informative
    features in order to help learning algorithms more accurate and faster learning
    models.'
