  md: '# Text Mining with Mallet - Topic Modeling and Spam Detection


    Such vectors finally become instances for further learning.


    Another very powerful presentation based on the BoW model is word2vec. Word2vec
    was introduced in 2013 by a team of researchers led by Tomas Mikolov at Google.
    Word2vec is a neural network that learns distributed representations for words.
    An interesting property of this presentation is that words appear in clusters,
    such that some word relationships, such as analogies, can be reproduced using
    vector math. A famous example shows that king - man + woman returns queen. Further
    details and implementation are available at the following link: https://code.google.com/archive/p/word2vec/


    # Importing data


    In this chapter, we will not look into how to scrape a set of documents from a
    website or extract them from database. Instead, we will assume that we already
    collected them as set of documents and store them in the .txt file. Now let''s
    look at two options on how to load them. The first option addresses the situation
    where each document is stored in its own .txt file. The second option addresses
    the situation where all the documents are stored in a single file, one per line.


    # Importing from directory


    Mallet supports reading from directory with the cc.mallet.pipe.iterator.FileIterator
    class. Each iterator is constructed with the following three parameters:


    +   - A list of File directories with text files

    - File filter that specifies which files to select within a directory

    - A pattern that is applied to a filename to produce a class label


    Consider the data structured into folders as shown in the following image. We
    have documents organized into five topics by folders (tech, entertainment, politics,
    sport, business). Each folder contains documents on particular topics, as shown
    in the following image:'
