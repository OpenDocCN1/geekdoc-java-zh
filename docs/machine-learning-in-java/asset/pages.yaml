    # # Apache Spark


    Apache Spark, or simply Spark, is a platform for large-scale data processing builds
    atop Hadoop, it is not tied to the MapReduce paradigm. Instead, it uses in-memory
    caches to reach a working set of data, process it, and repeat the query. This
    is reported to be up to ten times as fast as a Mahout implementation that works
    directly with disk-stored data. It can be grabbed from https://spark.apache.org.


    ![](img/19ac99d70883ac011b12e9f3fe27f16b_58_0.png)


    There are many modules built atop Spark, for instance, GraphX for graph processing,
    Spark Streaming for processing real-time data streams, and MLlib for machine learning
    library featuring classification, regression, collaborative filtering, clustering,
    dimensionality reduction, and optimization.


