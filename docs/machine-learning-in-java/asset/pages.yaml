  md: '# # Activity recognition pipeline


    Classifying multidimensional time-series sensor data is inherently more complex
    compared to classifying traditional, nominal data as we saw in the previous chapters.
    First, each observation is temporally connected to the previous and following
    observations, making it very difficult to apply a straightforward classification
    of a single set of observations only. Second, the data obtained by sensors at
    different times stochastic, is unpredictable due to influence of sensor noise,
    environmental disturbances, and many other reasons. Moreover, an activity can
    comprise various sub-activities executed in different manner and each person performs
    the activity a bit differently, which results in high intraclass differences.
    Finally, all these reasons make an activity recognition model imprecise, resulting
    in new data being misclassified. One of the highly desirable properties of an
    activity recognition classifier is to ensure continuity and consistency in the
    recognized activity


    To deal with these challenges, activity recognition is applied to a pipeline as
    shown in the following:


    | Noise removal | Feature vector | Activity recognition model | Spurious activity
    transition removal |

    |---|---|---|---|


    In the first step, we attenuate as much noise as we can, for example, by reducing
    sensor sampling rate, removing outliers, applying high/low-pass filters, and so
    on. In the next phase, we construct a feature vector, for instance, we convert
    sensor data from time domain to frequency domain by applying Discrete Fourier
    Transform (DFT). DFT is a method that takes a list of samples as an input and
    returns a list of sinusoid coefficients ordered by their frequencies. They represent
    a combination of frequencies that are present in the original list of samples.


    > An gentle introduction of Fourier transform is written by Pete Belacqua at http://www.thefouriertransform.com/.
    If you want to get more technical and theoretical background on the Fourier transform,
    take a look at the eighth and ninth lectures in the class by Robert Gallanger
    and Lizhong Zheng at MIT open: http://theopentacacademy.com/content/principles-digital-communication'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'Next, based on the feature vector and set of training data, we can build an
    activity recognition model that assigns an atomic action to each observation.
    Therefore, for each new sensor reading, the model will output the most probable
    activity label. However, models make mistakes, the last phase smooths the transitions
    between activities by removing transitions that cannot occur in reality, for example,
    it is not physically feasible that the transition between activities lying-lying
    occurs in less than half a second, hence such transition between activities is
    smoothed by lying-lying-lying.


    The activity recognition model is constructed with a supervised learning approach,
    which consists of training and classification steps. In the training step, a set
    of labeled data is used to train the model. The second step is used to assign
    a label to the unseen data by the trained model. The data in both phases must
    be processed with the same set of tools, such as filtering and feature-vector
    computation.


    The post-processing phase, that is, spurious activity removal, can also be a model
    itself, also requires a learning step. In this case, the pre-processing phase
    also includes activity recognition, which makes such arrangement of classifiers
    a meta-learning problem. To avoid overfitting, it is important that the dataset
    used for training the post-processing phase is not the same as that used for training
    the activity recognition model.


    We will roughly follow a lecture on smartphone programming by professor Andrew
    T. Campbell from Dartmouth University and leverage data collection mobile app
    that they developed in the class (Campbell, 2011).


    # The plan


    The plan consists of training phase and deployment phase. Training phase shown
    in the following steps:


    +   1. Install Android Studio and import MyRunsDataCollector.zip.

    2. Load the application in your Android phone.

    3. Collect your data, for example, standing, walking, and running, and transform
    the data to a feature vector comprising of FFT transforms. Don''t panic, low-level
    signal processing functions as FFT will not be written from scratch as we will
    use existing code to do that. The data will be saved on your phone in a file called
    features.aff.

    4. Create and evaluate an activity recognition classifier using exported data
    and implement filter for spurious activity transitions removal.

    5. Plug the classifier back into the mobile application.'
