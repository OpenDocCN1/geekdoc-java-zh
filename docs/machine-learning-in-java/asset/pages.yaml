  md: '# Linear regression


    The most basic regression model assumes linear dependency between features and
    target variable. The model is often fitted using least squares approach, that
    is, the best model minimizes the squares of the errors. In many cases, linear
    regression is not able to model complex relations, for example, the next figure
    shows four different sets of points having the same regression line: the upper-left
    model captures the general trend and the bottom-left model fits points much better,
    except an outlier—this should be carefully checked—and the upper and lower-right
    side linear models completely miss the underlying structure of the data and cannot
    be considered proper models.


    ![](img/19ac99d70883ac011b12e9f3fe27f16b_44_0.png)


    # Evaluating regression


    In regression, we predict numbers Y from inputs X and the predictions are usually
    wrong and not exact. The main question that we ask is by how much? In other words,
    we want to measure the distance between the predicted and true values.'
  merge: -1
