  md: 'Applied Machine Learning Quick Start


    To get the data from the Internet, there are multiple options, as shown in the
    following:


    +   * Bulk downloads from websites such as Wikipedia, IMDb, and Million Song database.

    * Accessing the data through API (NY Times, Twitter, Facebook, Foursquare).

    * Web scraping – It is OK to scrape public, non-sensitive, and anonymized data.
    be to check terms of conditions and to fully reference information.


    The drawbacks of found data are that it takes time and space to accumulate the
    data; they cover only what happened, for instance, intentions, motivations, or
    internal motivations are not collected. Finally, such data might be noisy, incomplete,
    inconsistent, and may change over time.


    Another option is to collect measurements from sensors such as inertial and location
    sensors in mobile devices, environmental sensors, and software agents monitoring
    key performance indicators.


    # Generate data


    An alternative approach is to generate the data by yourself, for example, with
    a survey. In survey design, we have to pay attention to data sampling, that is,
    who are the respondents answering the survey. We only get data from the respondents
    who are accessible and willing to respond. Also, respondents can provide answers
    that are in line with their self-image and researcher''s expectations.


    Next, the data can be collected with simulations, where a domain expert specifies
    behavior model of users at a micro level. For instance, crowd simulation requires
    specifying how different types of users will behave in crowd, for example, following
    the crowd, looking for an escape, and so on. The simulation can be run under different
    conditions to see what happens (Tai et al. 2011). Simulations are appropriate
    for studying crowd phenomena and emergent behavior; they are typically hard to
    validate empirically.


    Furthermore, you can design experiments to thoroughly cover all the possible outcomes,
    where you keep all the variables constant and only manipulate one variable at
    a time. This is the most costly approach, but usually provides the best quality
    of data.'
