  md: 'Fraud and Anomaly Detection


    In the following section, we''ll learn how to transform time series data to attribute
    presentation that allows us to apply machine learning algorithms.


    # Anomaly detection in time series data


    Detecting anomalies in raw, streaming time series data requires some transformations.
    The most obvious way is to select a time window and sample time series with fixed
    length. In the next step, we want to compare a new time series to our previously
    collected set to detect if something is out of the ordinary.


    The comparison can be done with various techniques, as follows:


    +   - Forecasting the most probable following value, as well as confidence intervals
    (for example, Holt-Winters exponential smoothing). If a new value is out of confidence
    interval, it is considered anomalous.


    +   - Cross correlation compares new sample to library of positive samples, it
    looks for exact match. If the match is not found, it is marked as anomalous.


    +   - Dynamic time warping is similar to cross correlation, but allows distortion
    in correlation.


    +   - Discretizing signal to bands, where each band corresponds to a letter. For
    example, A=[min, mean/3], B=[mean, mean*2/3], and C=[mean*2/3, max] transforms
    the signal to a sequence of letters such as AAABACABA.... This approach reduces
    the storage and allows us to apply text-mining algorithms that we will discuss
    in Chapter 10, Text Mining with Mallet – Topic Modeling and Spam Detection.


    +   - Distribution-based approach estimates distribution of values in a specific
    time window. When we observe a new sample, we can compare whether distribution
    matches to the previously observed one.


    This list is, by means, exhaustive. Different approaches are focused on detecting
    different anomalies (for example, in value, frequency, and distribution). We will
    focus on a version of distribution-based approaches.


    # Histogram-based anomaly detection


    In histogram-based anomaly detection, we split signals by some selected window
    as shown in the following image.


    For each window, we calculate the histogram, that is, for a selected number of
    buckets, we count how many values fall into each bucket. The histogram captures
    basic distribution of values in a selected window as shown at the center of the
    diagram.'
