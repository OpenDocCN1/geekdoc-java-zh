    # # Apache Mahout


    The Apache Mahout project aims to build a scalable machine learning library. It
    is built atop scalable, distributed architectures such as Hadoop, using the MapReduce
    paradigm, which is an approach for processing and generating large datasets with
    a parallel, distributed algorithm using a cluster of servers.


    ![](img/19ac99d70883ac011b12e9f3fe27f16b_57_0.png)


    Mahout features console interface and Java API for scalable algorithms for clustering,
    classification, and collaborative filtering. It is able to solve three business
    problems: item recommendation, for example, recommending items such as people
    who liked this movie also liked...; clustering, for example, of text documents
    into groups of topologically-related documents; and classification, for example,
    learning which topic to assign to an unlabeled document.


    Mahout is distributed under a commercially-friendly Apache License, which means
    that you can use it as long as you keep the Apache license included and display
    it in your program''s copyright notice.'
