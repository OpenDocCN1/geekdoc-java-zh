  md: '# Data pre-processing


    First, we will utilize weka.filters.unsupervised.attribute.RemoveUseless filter,
    which works exactly as its name suggests. It removes attributes that do not vary
    too much, for instance, constant attributes are removed, and attributes that vary
    too much, at random. The maximum variance, which is applied only to nominal attributes,
    specified with the -M parameter. The default parameter is 99%, which means if
    more than 99% of all instances have unique attribute values, the attribute is
    removed as follows:


    ```

    RemoveUseless = new RemoveUseless();

    removeUseless.setOptions(new String[] {\ {"-M", "99 %"}); // threshold

    removeUseless.setInputFormat(data);

    data = Filter.useFilter(data, removeUseless);

    ```


    Next, we will replace all missing values in the dataset with the modes (nominal
    attributes) and means (numeric attributes) from the training data by using the
    weka.filters.unsupervised.attribute.ReplaceMissingValues filter. In general, missing
    values replacement should proceed with caution while taking into consideration
    the meaning and context of the attributes:


    ```

    ReplaceMissingValues = new ReplaceMissingValues();

    fixMissingValues.setInputFormat(data);

    data = Filter.useFilter(data, fixMissingValues);

    ```


    Finally, we will discretize numeric attributes, that is, we transform numeric
    attributes into intervals using the weka.filters.unsupervised.attribute.Discretize
    filter. With the -B option, we set to split numeric attributes into four intervals,
    and the -R option specify the range of attributes (only numeric attributes will
    be discretized)


    ```

    DiscretizeNumeric = new Discretize();

    discretizeNumeric.setOptions(new String[] {

    "-B", "4", // no of bins

    "-R", "first-last"}); //range of attributes

    fixMissing.setInputFormat(data);

    data = Filter.useFilter(data, fixMissing);

    ```'
