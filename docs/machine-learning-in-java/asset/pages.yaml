    Our task is to learn a model that can predict the animal attribute in the future
    examples for which we know the other attributes but do not know the animal label.
    Hence, we remove the animal attribute from the training set. We accomplish this
    by filtering out the animal attribute using the Remove filter.


    First, we set a string table of parameters, specifying that the first attribute
    must be removed. The remaining attributes are used as our dataset for training
    a classifier:


    ```

    Remove remove = new Remove();

    String[] opts = new String[] {"-R", "1"};

    ```


    Finally, we call the Filter.useFilter(Instances, Filter) static method to apply
    the filter on the selected dataset:


