  md: '2. Data collection: Once you have a problem to tackle, you will need the data.
    Ask yourself what kind of data will help you answer the question. Can you get
    the data from the available sources? Will you have to combine multiple sources?
    Do you have to generate the data? Are there any sampling biases? How much data
    will be required?


    3. Data preprocessing: The first data preprocessing task is data cleaning. For
    example, missing values, smoothing noisy data, removing outliers, and resolving
    inconsistencies. This is usually followed by integration of multiple data sources
    and data transformation to a specific range (normalization), to value bins (discretized
    intervals), and to reduce the number of dimensions.


    4. Data analysis and modeling with unsupervised and supervised learning: Data
    analysis and modeling includes unsupervised and supervised machine learning, statistical
    inference, and prediction. A wide variety of machine learning algorithms are available,
    including k-nearest neighbors, naïve Bayes, decision trees, support vector machines,
    logistic regression, and so on. The choice of method to be deployed depends on
    problem definition discussed in the first step and the type of collected data.
    The final product of this step is a model.


    5. Evaluation: The last step is devoted to model assessment. The main issue built
    with machine learning face is how well they model the underlying data - if a model
    is too specific, that it overfits the data used for training, it is possible that
    it will not perform well on a new data. The model can be too generic, meaning
    that it underfits the training data. For example, when asked how the weather is
    in California, it always answers sunny, which is not really useful for making
    valid predictions. The goal of this step is to critically evaluate the model and
    make sure it works well on new data as well. Evaluation methods include test and
    train set, cross-validation, and one-leave-out validation.


    In the following sections, we will take a closer look at each of the steps. We
    will try to understand the type of questions we must answer during the applied
    machine learning workflow and also look at the accompanying concepts of data analysis
    and evaluation.


