  md: 'Let''s see how it is implemented in MyRunsDataCollector. When the application
    is started, a method called onSensorChanged() gets a triple of accelerometer sensor
    readings (x, y, z) with a specific time stamp and calculates the magnitude from
    the sensor readings. The methods buffers up to 4 consecutive magnitudes marked
    before computing the FFT coefficients (Campbell, 2015):


    > "As shown in the upper left of the diagram, FFT transforms a time series of
    magnitude over time (representation of amplitude) across frequency; the example
    shows oscillating system where the dominant frequency is between 4-8 cycles/second
    called Hertz (Hz) - imagine a ball attached to an elastic band that this stretched
    and oscillates for a short period of time, or your gait walking, running - one
    could look at these systems in the time and frequency domains. We transform these
    accelerometer readings and the magnitude are time domain variables because the
    can represent the distribution in a nice compact manner that the classifier will
    use to build a decision tree model. For example, the rate of the amplitude transposed
    to the frequency domain may look something like the figure bottom plot - the top
    plot is time domain and the bottom plot a transformation of the time to the frequency
    domain.


    The training phase also stores the maximum (MAX) magnitude of the (m0..m63) and
    the user supplied label (e.g., walking) using the collector. The individual features
    are computed as magnitudes (f0,f63), the MAX magnitude and the class label.


    Now let''s move on to the actual data collection.


