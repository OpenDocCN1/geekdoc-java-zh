  md: '# Loading the data


    There are two approaches for loading the data according to where the data is stored:
    file or database. First, we will take a detailed look at how to load the data
    from the file, including how to deal with custom formats. At the end, we quickly
    take a look at how to load the data from a database.


    # Loading data from file


    Loading data from file can be achieved with the FileDataObject class, where each
    line contains a userID,itemID,optional preference value, and optional timestamp
    in the same order, as follows:


    ```

    userID[,preference, timestamp]

    ```


    Optional preference accommodates applications with binary preference values, that
    is, user expresses a preference for an item or not, without degree of preference,
    for example, with like/dislike.


    A line that begins with hash, or any entry will be ignored. It is also acceptable
    for the lines to contain additional fields, which will be ignored.


    The DataModel assumes the following types:


    +   * userID,itemID can be parsed as long

    * preference value can be parsed as double

    * timestamp can be parsed as long


    If you are able to provide the dataset in the preceding format, you can simply
    use the following line to load the data:


    ```

    DataModel = new FileDataObject(new File(path));

    ```


    This class is not intended to be used for very large amounts of data, for example,
    tens of millions. For that, a JDBC-backed DataModel and a database are more appropriate.


    In real world, however, we cannot always ensure that the input data supplied to
    us contain only integer values for userID and itemID. For example, in our case,
    itemID correspond to ISBN book numbers uniquely identifying items, but these are
    not integers and the FileDataObject default won''t be suitable to process our
    data.'
