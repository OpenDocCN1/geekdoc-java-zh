    # Customer relationship database


    The most practical way to build knowledge on customer behavior is to produce scores
    that explain a target variable such as churn, appetency, or upselling. The score
    is computed by a model using input variables describing customers, for example,
    current subscription, purchased devices, consumed minutes, and so on. The scores
    are then used by the information system, for example, to provide relevant personalized
    marketing actions.


    In 2009, the KDD organized a machine learning challenge on customer-relationship
    prediction (KDD Cup, 2009).


    # Challenge


    Given a large set of customer attributes, the task was to estimate the following
    three target variables (KDD Cup, 2009):


    +   Churn probability, in our context, is the likelihood a customer will switch
    providers:


    Churn rate is sometimes called attrition rate. It is one of two primary factors
    that determine the steady-state level of customers a business will support. In
    its broadest sense, churn rate is a measure of the number of individuals or items
    moving into or out of a collection over a specific period of time. The term is
    used in many contexts, but is most widely applied in business with respect to
    a contractual customer base. For instance, it is an important factor for any business
    with a subscriber-based service model, including mobile telephone networks and
    pay TV operators. The term is also used to refer to participant turnover in peer-to-peer
    networks.'
