  md: '# Building a machine learning application


    Machine learning applications, especially those focused on classification, usually
    follow the same high-level workflow as shown in the following diagram. The workflow
    comprises two phases: training the classifier and classification of new instances.
    Both phases share common steps as you can see in the following diagram:


    ![](img/19ac99d70883ac011b12e9f3fe27f16b_64_0.png)


    We use a set of Training data, select a representative subset of the training
    set, preprocess data, and extract features. A supervised learning algorithm is
    used to train a model, which is deployed in the second phase. The second phase
    puts a new data instance through the same Pre-processing and Feature extraction
    procedure and applies the learned model to obtain the instance label. If you are
    able to collect new labeled data, periodically rerun the learning phase to retrain
    the model, and replace the old one with the trained one in the classification
    phase.


    # Traditional machine learning architecture


    Structured data, such as transactional, customer, analytical, and market data,
    usually resides within a local relational database. Given a query language, such
    as SQL, we can query the data used for processing, as shown in the workflow in
    the previous diagram. Usually, all the data can be stored in the memory and further
    processed with a machine learning library such as Weka, Java-ML, or MALLET.


    A common practice in the architecture design is to create data pipelines, where
    different steps in the workflow are split. For instance, in order to create a
    client data record, we might have to scrap the data from different data sources.
    The record can be saved in an intermediate database for further processing.


    To understand how the high-level aspects of big data architecture differ, let''s
    first clarify when is the data considered big?'
  merge: -1
