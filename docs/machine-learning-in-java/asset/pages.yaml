  md: '# Suspicious and anomalous behavior detection


    The problem of learning patterns from sensor data arises in many applications,
    including e-commerce, smart environments, video surveillance, network analysis,
    human-robot interaction, ambient assisted living, and so on. We focus on detecting
    patterns that deviate from regular behaviors and may represent a security risk,
    health problem, or any abnormal behavior contingency.


    In words, deviant behavior is a data pattern that either does not conform to the
    expected behavior (anomalous behavior) or matches a previously undefined unwanted
    behavior (suspicious behavior). Deviant behavior patterns are also referred to
    as outliers, exceptions, peculiarities, surprise, misuse, and so on. Such patterns
    can relatively occur infrequently; however, when they occur, their consequences
    can be quite dramatic and often negatively so. Typical examples include credit
    card fraud, cyber-intrusions, and industrial damage. In e-commerce, fraud is estimated
    to cost merchants more than $200 billion a year; in healthcare, fraud is estimated
    to cost taxpayers $600 billion a year; for banks, the cost is over $12 billion.


    # Unknown-unknowns


    When Donald Rumsfeld, US Secretary of Defense, had a briefing on February 12,
    2002, the lack of evidence linking the government of Iraq to the supply of weapons
    of mass destruction to terrorist groups, it immediately became a subject of much
    commentary. Rumsfeld stated (DoD News, 2012).


    > "Reports that say something hasn''t happened are interesting to me, because
    as we know, there are known knows; there are things we we know. We also know there
    are known unknowns; that is to say we know some things we do not know. But there
    are also unknowns - the ones we don''t know we do know. If one looks throughout
    the history of our country and other countries, it is the latter category that
    tend to be the difficult ones."


    The statement might seem confusing at first, the idea of unknown unknowns was
    well studied among scholars dealing with risk, NASA, and other intelligence agencies.
    What the statement basically is the following:


    +   - Known-knowns: These are well-known problems or issues we know how to recognize
    them and how to deal with them

    - Known-unknowns: These are expected and unfore problems, which can be reasonably
    anticipated, but have not occurred before'
  merge: -1
  pgno: 148
- img_proc: true
  md: '+   - Unknown-unknowns: These are unexpected and unforeseen problems, which
    pose significant risk as they cannot be anticipated, based on previous experience


    In the following sections, we will look into two fundamental approaches dealing
    with the first two types of knows and unknowns: suspicious pattern detection dealing
    with known-unknowns and anomalous pattern detection targeting known-unknowns.


    # # Suspicious pattern detection


    The first approach assumes a behavior library that encodes negative patterns shown
    as red minus signs in the following image, and thus recognizing that observed
    behavior corresponds to identifying a match in the library. If a new pattern (blue
    circle) can be matched against negative patterns, then it is considered suspicious:


    ![](img/19ac99d70883ac011b12e9f3fe27f16b_149_0.png)


    For example, when you visit a doctor, she inspects various health symptoms (body
    temperature, pain levels, affected areas, and so on) and matches the symptoms
    to a known disease. In machine learning terms, the doctor collects attributes
    and performs classifications.


    An advantage of this approach is that we immediately know what is wrong; for example,
    assuming we know the disease, we can select appropriate treatment procedure.


    A major disadvantage of this approach is that it can detect only suspicious patterns
    that are known in advance. If a pattern is not inserted into a negative pattern
    library, then we will not be able to recognize it. This approach is, therefore,
    appropriate for modeling known-knowns.'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# Anomalous pattern detection


    The second approach uses the pattern library in an inverse fashion, meaning that
    the library encodes only positive patterns marked with green plus signs in the
    following image. When an observed behavior (blue circle) cannot be matched against
    the library, it is considered anomalous:


    ![](img/19ac99d70883ac011b12e9f3fe27f16b_150_0.png)


    This approach requires us to model only what we have seen in the past, that is,
    normal patterns. The main reason we visited the doctor in the first place was
    because we did not feel fine. Our perceived state of feelings (for example, headache,
    sore skin) did not match our usual feelings, therefore, we decided to seek doctor.
    We don''t know which disease caused this state nor do we know the treatment, but
    we were able to observe that it doesn''t match the usual state.


    A major advantage of this approach is that it does not require us to say anything
    about non-normal patterns; hence, it is appropriate for modeling known-unknowns
    and unknown-unknowns. On the other hand, it does not tell us what is wrong.


    # Analysis types


    Several approaches have been proposed to tackle the problem either way. We broadly
    classify anomalous and suspicious behavior detection in the following three categories:
    pattern analysis, transaction analysis, and plan recognition. In the following
    sections, we will quickly look into some real-life applications.


    # Pattern analysis


    An active area of anomalous and suspicious behavior detection from patterns is
    based on visual modalities such as camera. Zhang et al. (2007) proposed a system
    for a visual human motion analysis from a video sequence, which recognizes unusual
    behavior based on walking trajectories; Lin et al. (2009) described a video surveillance
    system based on color features, distance features, and a count feature, where
    evolutionary techniques are used to measure observation similarity. The system
    tracks each person and classifies their behavior by analyzing their trajectory
    patterns. The system extracts a set of visual low-level features in different
    parts of the image, and performs a classification with SVMs to detect aggressive,
    cheerful, intoxicated, nervous, neutral, and tired behavior.'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# Transaction analysis


    Transaction analysis assumes discrete states/transactions in contrast to continuous
    observations. A major research area is Intrusion Detection (ID) that aims at detecting
    attacks against information systems in general. There are two types of ID systems,
    signature-based and anomaly-based, that broadly follow the suspicious and anomalous
    pattern detection described in the previous sections. A comprehensive review of
    ID approaches was published by Ghyanchandani et al (2012).


    Furthermore, approaches in ambient-living that are ever based on wearable sensors
    also fit to transaction analysis as sensing is typically ever. Lymberopoulos et
    al (2008) proposed a system for automatic extraction of the users'' spatio-temporal
    patterns encoded as sensor activations from the sensor network deployed. The proposed
    method, based on location, time, and duration, was able to extract patterns using
    the Apriot algorithm and encode the most frequent patterns in the form of a Markov
    chain. Another area of related work includes Hidden Markov Models (HMs) (Rabiner,
    1989) that are widely used in traditional activity recognition for modeling a
    sequence of actions, but these topics are already out of scope of this book.


    # Plan recognition


    Plan recognition focuses on a mechanism for recognizing the unobservable state
    of an agent, given observations of its interaction with its environment (Avrahami-
    Zilberbrand, 2009). Most existing investigations assume discrete observations
    in the form of activities. To perform anomalous and suspicious behavior detection,
    plan recognition algorithms may use a hybrid approach, a symbolic plan recognizer
    is used to filter consistent hypotheses, passing them to an evaluation engine,
    which focuses on ranking.


    These were advanced approaches applicable to real-life scenarios targeted at discovering
    anomalies. In the following sections, we''ll dive into more basic approaches for
    suspicious and anomalous pattern detection.


    # Fraud detection of insurance claims


    First, we''ll take a look at suspicious behavior detection, where the goal is
    to learn known patterns of frauds, which correspond to modeling knowing-networks.'
