    # Learning algorithms


    We have loaded our data, the best features, and are ready to learn some classification
    models. Let''s begin with the basic decision trees.


    Decision tree in Weka is implemented within which is a re-implementation of Quinlan''s
    famous C45 decision learner [Quinlan, 1993].


    First, we initialize a J48 decision tree. We can pass additional parameters with
    a string table, for instance, tree pruning that controls the model complexity
    (refer to Chapter 1, Applied Machine Learning Quick Start). In our case, we will
    build an unpruned tree, then will pass a single U parameter:


    ```

    J48 tree = new J48();

    String[] options = new String[1];

    options[0] = "U";

    ```


    ```

    tree.setOptions(options);

    ```


    Next, we call the buildClassifier(Instances) method to initialize the learning
    process:


    ```

    tree.buildClassifier(data);

    ```


    The built model is now stored in a tree object. We can output the entire J48 unpruned
    tree calling the toString() method:


    ```

    System.out.println(tree);

    ```


    The output is as follows:


    J48 unpruned tree


    ```

    feathers = false

    | milk = false

    |   | backbone = false

    |   |    airborne = false

    |   |   | predator = false

    ```'
