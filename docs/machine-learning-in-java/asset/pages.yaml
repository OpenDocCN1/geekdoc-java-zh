    Now, let''s look at some more concrete pre-processing steps.


    # Fill missing values


    Machine learning algorithms generally do not work well with missing values. Exceptions
    include decision trees, naive Bayes classifier, and rule-based learners. It is
    very important to understand why a value is missing. It can be missing to many
    reasons such as random error, systematic error, and sensor noise. Once identified
    the reason, there are multiple ways to deal with the missing values, as shown
    in the following list:


    +   - Remove the instance: If there is enough data, and only a couple of non-relevant
    instances have some missing values, then it is safe to remove these instances.

    - Remove the attribute: Removing an attribute makes sense when most of the values
    are missing, values are constant, or attribute is strongly correlated with another
    attribute.

    - Assign a special value N/A: Sometimes a value is missing due to valid reasons
    such as the value is out of scope discrete attribute value is not defined, or
    it is not possible to obtain or measure the value, which can be an indicator as
    well. For example, a person never rates a movie, so his rating on this movie is
    nonexistent.

    - Take the average attribute value: In case we have a limited number of instances,
    we might not be able to afford removing instances or attributes. In that case,
    we can estimate the missing values, for example, by assigning the average attribute
    value or the average value over similar instances.

    - Predict the value from other attributes: Predict the value from the previous
    entries if the attribute possesses time dependencies.


    As we have seen, the value can be missing for many reasons, and hence, it is important
    to understand why the value is missing, absent, or corrupted.


    [ 10 ]'
