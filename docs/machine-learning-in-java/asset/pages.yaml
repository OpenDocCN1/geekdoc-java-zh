    \ | Value: 1.0\n\nItem: Dirty Work (Stone Barrington Novels (Paperback)) | Item\
    \ id: 0451210158 | Value: 1.0\n\nThe resulting list returns a set of items similar\
    \ to particular item that we have selected.\n\n# Adding custom rules to recommendations\n\
    \nIt often happens that business rules require us to boost the score of the selected\
    \ items. In the book dataset, for example, if a book is recent, we want to get\
    \ it a higher score. That's possible using the IDRescorer interface implementing,\
    \ as follows:\n\n+   - rescore(long, double) that takes itemId and original score\
    \ as an argument and returns a modified score\n\n+   - isFiltered(long) that may\
    \ return true to exclude a specific item from recommendation or false otherwise\n\
    \nOur example can be implemented as follows:\n\n```\nclass MyRescorer implements\
    \ IDRescorer {\n    public double doubleScore(long itemId, double originalScore)\
    \ {\n        double newScore = originalScore;\n        if (bookIsNew(itemId))\
    \ {\n            originalScore *= 1.3;\n        }\n        return newScore;\n\
    \    }\n\n    public boolean isFiltered(long arg0) {\n        return false;\n\
    \    }\n}\n```\n\nAn instance of IDRescorer is provided when invoking recommender.recommend.\n\
    \n```\nIDRescorer rescorer = new MyRescorer();\nList<RecommendedItem> recommendations\
    \ =\nrecommender.recommend(userID, noItems, rescorer);\n```"
