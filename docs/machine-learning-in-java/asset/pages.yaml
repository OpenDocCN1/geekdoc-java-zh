  md: '# # 1 Applied Machine Learning

    Quick Start


    This chapter introduces the basics of machine learning, laying down the common
    themes and concepts and making it easy to follow the logic and familiarize yourself
    with the topic. The goal is to quickly learn the step-by-step process of applied
    machine learning and grasp the main machine learning principles. In this chapter,
    we will cover the following topics:


    +   - Introducing machine learning and its relation to data science

    - Discussing the basic steps in applied machine learning

    - Discussing the kind of data we are dealing with and its importance

    - Discussing approaches of collecting and preprocessing the data

    -Making sense of data using machine learning

    - Using machine learning to extract insights from data and build predictors


    If you are already familiar with machine learning and are eager to start coding,
    then quickly jump to the following chapters. However, if you need to refresh your
    memory or clarify some concepts, then it is strongly recommend to revisit the
    topics presented in this chapter.


    # ## Machine learning and data science


    Nowadays, everyone talks about machine learning and data science. So, what exactly
    is machine learning anyway? How does it relate to data science? These two terms
    are commonly confused, as they often employ the same methods and overlap significantly.
    Therefore, let''s clarify what they are.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'An example of supervised learning is credit card detection, where the learning

    alg is presented with credit card transactions (matrix X) marked as normal or

    suspicious. (vector Y). The learning algorithm produces a decision model that
    marks

    unseen transactions as normal or suspicious (that is the f function).'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'In contrast, unsupervised learning algorithms do not assume given outcome labels,
    Y they focus on learning the structure of the data, such as grouping similar inputs
    into clusters. Unsupervised learning can, hence, discover hidden patterns in the
    data. An example of unsupervised learning is an item-based recommendation system,
    where the learning algorithm discovers similar items bought together, for example,
    people who bought A also bought book B.


    Reinforcement learning addresses the learning process from a completely different
    angle. It assumes that an agent, which can be a robot, bot, or computer program,
    interacts with a dynamic environment to achieve a specific goal. The environment
    is described with a set of states and the agent can take different actions to
    move from one state to another. Some states are marked as goal states and if the
    agent achieves this, it receives a large reward. In other states, the reward is
    smaller, non-existing, or even negative. The goal of reinforcement learning is
    to find an optimal policy, that specifies the action to take in each of the states
    without a teacher explicitly telling whether this leads to the goal state or not.
    An example of reinforcement learning is a program for driving a vehicle, where
    the states correspond to the driving conditions—for example, current speed, road
    segment information, surrounding obstacles on the road—and the actions can be
    driven by maneuvers such as turn left or right, stop, accelerate, and continue.
    The learning algorithm produces a policy that specifies the action that is be
    taken in specific configuration of driving conditions.


    In this book, we will focus on supervised and unsupervised learning only, as they
    share many concepts. If reinforcement learning sparked your interest, a good book
    to start with is Reinforcement Learning: An Introduction by Richard S. Sutton
    and Andrew Barto.


    # Applied machine learning workflow


    This book''s emphasis is on applied machine learning. We want to provide you with
    the practical skills to get learning algorithms to work in different settings.
    Instead of math and theory of machine learning, we will spend more time on the
    practical, hands-on skills (and dirty tricks) to get them to work well on an application.
    We will focus on supervised and unsupervised machine learning and cover the essential
    steps from data science to build the machine learning workflow.


    A typical workflow in applied machine learning applications consists of answering
    a series of questions that can be summarized in the following five steps:


    +   1. Data and problem definition: The first step is to ask interesting questions.
    What is the problem you are trying to solve? Why is it important? Which format
    of result answers your question? Is this a simple yes/no answer? Do you need to
    pick one of the available questions?'
