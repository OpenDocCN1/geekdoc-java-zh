  md: "# Recommendation Engine with Apache Mahout\n\nNow, let's consider how to deal\
    \ with the case where our itemID is a string. We will define our custom data model\
    \ by extending FileDataModel and overriding the long itemIDFromString(String)\
    \ method in order to read itemID as a string and convert it into a long unique\
    \ value. To convert string to long, we'll extend Mahout AbstractIDMigrator helper\
    \ class, which is designed exactly for this task.\n\nNow, let's first look at\
    \ how FileDataModel is extended:\n\n```\nclass StringItemIDDataModel extends FileDataModel\
    \ {\n\n    //initialize migrator to convert String to long\n    public ItemMemIDMigrator\
    \ memIDMigtr;\n\n    public StringItemIDDataModel(File dataFile, String regex)\
    \ {\n        throws IOException {\n            super(dataFile, regex);\n     \
    \   }\n\n    @Override\n    protected long readItemIDFromString(String value)\
    \ {\n\n        if (memIDMigtr == null) {\n            memIDMigtr = new ItemMemIDMigrator();\n\
    \        }\n\n        // convert to long\n        long retValue = memIDMigtr.toLongID(value);\n\
    \        //store it to cache\n        if (null == memIDMigtr.toString(retValue))\
    \ {\n            try {\n                memIDMigtr.singleInit(value);\n      \
    \      } catch (TasteException e) {\n                e.printStackTrace();\n  \
    \          }\n        }\n        return retValue;\n    }\n\n    // convert long\
    \ back to String\n    String getItemIDAsString(long itemID) {\n        return\
    \ memIDMigtr.toStringID(itemID);\n    }\n}\n```"
