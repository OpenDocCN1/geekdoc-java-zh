    # ## Exercise 6: Naive Bayes


    In this exercise, you will use Naive Bayes to classify email messages into spam
    and nonspam groups. Your dataset is based on 960 real email messages from a preprocessed
    subset of the Ling-Spam Dataset, provided by Androuopoulos.


    There are two ways to complete this exercise. The first option is to use Matlab/Octave-formatted
    features which were generated for you. This requires using Matlab/Octave to prepare
    data and writing your own implementation of Naive Bayes. To choose this option,
    download the file features.mat.


    The second option is to generate the features from the emails and then implement
    Naive Bayes on top of those features. You may choose this option if you want more
    practice with features and a more open-ended exercise. To choose this option,
    download the pack ex6emails.zip.


    # ## The ZIP contains four folders (Ng, 2015):


    +   - The **spam-train** and **ham-train** folders contain the pre-processed e-mails
