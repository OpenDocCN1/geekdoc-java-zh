  md: '# Customer Relationship

    Prediction with Ensembles


    Any type of company offering a service, product, or experience needs a solid understanding
    of relationship with their customers; therefore, Customer Relationship Management
    (CRM) is a key element of modern marketing strategies. One of the biggest challenges
    that businesses face is the to understand exactly what causes a customer to buy
    new products.


    In this chapter, we will work on a real-world marketing database provided by the
    French telecom company, Orange. The task will be to estimate the following likelihoods
    for customer actions:


    +   * Switch provider (churn)

    * Buy new products or services (appetency)

    * Buy upgrades or add-ons proposed to them to make the sale more profitable (upselling)


    We will tackle the Knowledge Discovery and Data Mining (KDD) Cup 2009 challenge
    (KDD Cup, 2009) and show the steps to process the data using Weka. First, we will
    parse and load the data and implement the basic baseline models. Later, we will
    address advanced modeling techniques, including data pre-processing, attribute
    selection, model selection, and evaluation.'
