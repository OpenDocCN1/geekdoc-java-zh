  md: '# Text Mining with Mallet - Topic Modeling and Spam Detection


    Consider a text document in the following format, specifying document name, category
    and content:

    AP88128 local-news A 16-year-old student at a private Baptist...

    AP880224 business The Bechtel Group Inc. offered in 1985 to...

    AP880107 local-news A guman took a 74-year-old woman hostage...

    AP900117 entertainment Cupid has a new message for lovers this...

    AP880405 politics The Reagan administration is weighing w...


    To parse a line into three groups, we can use the following regular expression:

    ^(\\s*)*(\\s*)*(\s,*)(.*)$


    There are three groups that appear in parenthesis, (), where the third group contains
    the data, the second group contains the target class, and the first group contains
    the document ID. The iterator is initialized as follows:


    ```

    CsvIterator iterator = new CsvIterator (

    fileReader,

    Pattern.compile("*(\\S*)*(\\s,)*(\\S*)**(.*)*$\n3, 2, 1);

    ```


    Here the regular expression extracts the three groups separated by an empty space
    and their order is 3, 2, 1.


    Now let''s move to pre-processing pipeline.


    # Pre-processing text data


    Once we initialized an iterator that will go through the data, we need to pass
    the data through a sequence of transformations as described at the beginning of
    this section. Mallet supports this process through a pipeline and a wide variety
    of steps that could be included in a pipeline, which are collected in the cc.mallet.pipe
    package. Some examples are:


    +   - InputCharSequence: This is a pipe that can read from various kinds of text
    sources (either URI, File, or Reader) to CharSequence

    - CharSequenceRemoveHTML: This pipe removes HTML from CharSequence

    - MakeAmpersandXMLFriendly: This converts to &amp in tokens of a token sequence

    - TokenSequenceLowercase: This converts the text in each token in the token sequence
    in the data field to lower case'
