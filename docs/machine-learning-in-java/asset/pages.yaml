- img_proc: true
  md: '# Chapter 9


    The next image shows a couple of examples what kind of interactions the sensors
    are able to detect:


    ![](img/19ac99d70883ac011b12e9f3fe27f16b_189_0.png)


    Mobile phone sensors can be classified into the following three broad categories:


    +   - **Motion sensors** measure acceleration and rotational forces along the
    three perpendicular axes. Examples of sensors in this category include accelerometers,
    gravity sensors, and gyroscopes.

    - **Environmental sensors** measure a variety of environmental parameters, such
    as illumination, air temperature, pressure, and humidity. This category includes
    barometers, photometers, and thermometers.

    - **Position sensors** measure the physical position of a device. This category
    includes orientation sensors and magnetometers.


    > More detailed descriptions for different mobile platforms are at the following
    links:

    - Android sensors framework: http://developer.android.com/guide/topics/sensors/sensors_overview/

    - iOS Core Motion framework: https://developer.apple.com/library/documentation/CoreMotion/Reference/CoreMotion_Reference/

    - Windows Phone: https://msdn.microsoft.com/en-us/library/windows/apps/hh202968(v=vs.105).aspx


    In this chapter, we will work only with Android''s sensors framework.


