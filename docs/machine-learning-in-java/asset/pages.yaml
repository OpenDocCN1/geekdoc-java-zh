    # Tips to avoid common regression problems


    First, use prior studies and domain knowledge to figure out which features to
    include in regression. Check literature, reports, and previous studies on what
    kind of features works and variable for modeling your problem. Suppose you have
    a large set of features with random data, it is highly likely that several features
    will be correlated to the target variable (even though the data is random).


    Keep the model simple to avoid overfitting. The Occam’ razor principle states
    that you should select a model that best explains your data with the fewest assumptions.
    In practice, the model can be as simple as 2-4 predictor features.


    # Clustering


    Compared to a supervised classifier, the goal of clustering is to identify intrinsic
    groups in a set of unlabeled data. It could be in identifying representative examples
    of homogenous groups, finding useful and suitable groupings, or finding unusual
    examples, such as outliers.


    We''ll demonstrate how to implement clustering by analyzing the Bank dataset.
    The dataset consist of 11 attributes, describing 600 instances with age, sex,
    region, income, marriage status, children, car ownership status, saving activity,
    current activity, mortgage status, and PEP. In our analysis, we will try to identify
    the common groups of clients by applying the Expectation Maximization (EM) clustering.'
