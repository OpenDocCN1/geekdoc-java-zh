  md: '# Chapter 1


    The second problem in data reduction is related to too many instances; for example,
    they can be duplicates or coming from a very frequent data stream. The main idea
    is to select a subset of instances in such a way that distribution of the selected
    data still resembles the original data distribution, and more importantly, the
