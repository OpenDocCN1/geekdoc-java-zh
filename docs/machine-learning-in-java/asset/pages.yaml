  md: '# Getting models into production


    The path from building an accurate model in a lab to deploying it in a product
    involves collaboration of data science and engineering, as shown in the following
    three steps and diagram:


    +   1. Data research and hypothesis building involves modeling the problem and
    executing initial evaluation.

    2. Solution building and implementation is where your model finds its way into
    the product flow by rewriting it into more efficient, stable, and scalable code.

    3. Online evaluation is the last stage where the model is evaluated with live
    data using A/B testing on business objectives.


    ![](img/19ac99d70883ac011b12e9f3fe27f16b_234_0.png)


    # Model maintenance


    Another aspect that we need to address is how the model will be maintained. Is
    this a model that will not change over time? Is it modeling a dynamic phenomenon
    requiring the model to adjust its prediction over time?


    The model is usually built in of an offline batch training and then used on live
    data to serve predictions as shown in the following figure. If we are able to
    receive feedback on model predictions; for instance, whether the stock went up
    as model predicted, whether the candidate responded to campaign, and so on, the
    feedback should be used to improve the initial model.'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'The feedback could be really useful to improve the initial model, but make
    sure to pay attention to the data you are sampling. For instance, if you have
    a model that predicts who will respond to a campaign, you will initially use a
    set of randomly contacted clients with specific responded/not responded feature
    and properties. The model will focus only on a subset of clients that will likely
    respond and your feedback will return a subset of clients who responded. By including
    this data, the model is more accurate in a specific subgroup, but might completely
    miss some other group. We call this problem exploration versus exploitation. Some
    approaches to address this problem can be found in Osugi et al (2005) and Bondu
    et al (2010).


    # # Standards and markup languages


    As predictive models become more pervasive, the need for sharing the models and
    completing the modeling process leads to formalization of development process
    and interchangeable formats. In this section, we''ll review de facto standards,
    one covering data science processes and the other specifying an interchangeable
    format for sharing models between applications.


    # # CRISP-DM


    Cross Industry Standard Process for Data Mining (CRISP-DM) describing a data mining
    process commonly used by data scientists in industry. CRISP-DM breaks the data
    mining process into the following six major phases:


    +   * Business understanding

    * Data understanding'
  merge: -1
  pgno: 235
- img_proc: true
  md: 'What is Next?


    +   - Data preparation

    - Modeling

    - Evaluation

    - Deployment


    In the following diagram, the arrows indicate the process flow, which can move
    back and forth through the phases. Also, the process doesn''t stop with model
    deployment. The outer arrow indicates the cyclic nature of data science. Lessons
    learned during the process can trigger new questions and repeat the process while
    improving previous results:


    ![](img/19ac99d70883ac011b12e9f3fe27f16b_236_0.png)


    # SEMMA methodology


    Another methodology is Sample, Explore, Modify, Model, and Assess (SEMMA). SEMMA
    describes the main modeling tasks in data science, while leaving aside business
    aspects such as data understanding and deployment. SEMMA was developed by SAS
    institute, which is one of the largest vendors of statistical software, aiming
    to help the users of their software to carry out core tasks of data mining.


    [214]'
