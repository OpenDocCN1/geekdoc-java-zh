  md: 'Spark''s MLLib uses a Hadoop-based data source, for example, Hadoop Distributed
    File System (HDFS) or HBase, as well as local files. The supported data types
    include the following:


    +   - Local vector is stored on a single machine. Vectors are presented as an
    array of double-typed values, for example, (2.0, 0.0, 1.0, 0.0); while sparse
    vector is presented by the size of the vector, an array of indices, and an array
    of values, for example, [4, (0, 2), (2.0, 0.0)].


    +   - Labeled point is used for supervised learning algorithms and consists of
    a local vector labeled with a double-typed class value. Label can be class index,
    binary outcome, or a list of multiple class indices (multiclass classification).
    For example, a labeled dense vector is presented as [1.0, 2.0, 0.0, 1.0, 0.0].


    +   - Local matrix stores a dense matrix on a single machine. It is defined by
    matrix dimensions and a double-array arranged in a column-major order.


    +   - Distributed matrix operates on data stored in Spark''s Resilient Distributed
    Dataset (RDD), which represents a collection of elements that can be operated
