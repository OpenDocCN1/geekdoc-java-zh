  md: '# Preface


    Machine learning is a subfield of artificial intelligence. It helps computers
    to learn and act like human beings with the help of algorithms and data. With
    a given set of data, used, an ML algorithm learns different properties of the
    data and infers the properties of the data that it may encounter in future.


    This book will teach the readers how to create and implement machine learning
    algorithms in Java by providing fundamental concepts as well as practical examples.
    In this process, it will also talk about some machine learning libraries that
    are frequently used, such as Weka, Apache Mahout, Mallet, and so on. This book
    will help the user to select appropriate approaches for particular problems and
    compare and evaluate the results of different techniques. This book will cover
    performance improvement techniques, including input preprocessing and combining
    output from different methods.


    Without shying away from the technical details, you will explore machine learning
    with Java libraries using clear and practical examples. You will also explore
    how to prepare data for analysis, choose a machine learning method, and measure
    the success of the process.


    # What this book covers


    Chapter 1, Applied Machine Learning Quick Start, introduces the basics of machine
    learning, laying down the common concepts, machine learning principles, and applied
    learning workflow.


    Chapter 2, Java Libraries and Platforms for Machine Learning, reviews the various
    Java libraries and platforms dedicated to machine learning, what each library
    brings to the table, and what kind of problems it is able to solve. The review
    includes Weka, Java-ML, Apache Mahout, Apache Spark, deeplearning4j, and Mallet.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Preface


    Chapter 3, Basic Algorithms – Classification, Regression, and Clustering, starts
    with basic machine learning tasks, introducing the key algorithms for classification,
    regression, using small, easy-to-understand datasets.


    Chapter 4, Customer Relationship Prediction with Ensembles, dives into a real-world
    marketing database, where the task is to predict the customer that will churn,
    upsell, and cross-sell. The problem is attacked with ensemble methods, following
    the steps of KDD Cup-winning solution.


    Chapter 5, Affinity Analysis, discusses how to analyze co-occurrence relationships
    using association rule mining. We will look into market basket analysis to understand
    the purchasing behavior of customers and discuss applications of the approach
    to other domains.


    Chapter 6, Recommendation Engine with Apache Mahout, explains the basic concepts
    required to understand recommendation engine principles, followed by two applications
    leveraging Apache Mahout to build content-based filtering and collaborative recommend.


    Chapter 7, Fraud and Anomaly Detection, introduces the background to anomalous
    and suspicious pattern detection, followed by two practical applications on detecting
    frauds in insurance claims and detecting anomalies in website traffic.


    Chapter 8, Image Recognition with Deeplearning4j, introduces image recognition
    and reviews fundamental neural network architectures. We will then discuss how
    to implement various deep learning architectures with deeplearning4j library to
    recognize handwritten digits.


    Chapter 9, Activity Recognition with Mobile Phone Sensors, tackles the problem
    of recognizing patterns from sensor data. This chapter introduces the activity
    recognition process, explains how to collect data with an Android device, and
    provides a classification model to recognize activities of daily living.


    Chapter 10, Text Mining with Mallet – Topic Modeling and Spam Detection, explains
    the basics of text mining, introducing the text processing pipeline, and shows
    how to apply this to two real-world problems: topic modeling and document classification.


    Chapter 11, What is Next?, concludes the book with practical advice about how
    to deploy models and gives you further pointers about where to find additional
    resources, materials, venues, and technologies to dive deeper into machine learning.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# What you need for this book


    To follow the examples throughout the book, you''ll need a personal computer with
    the JDK installed. All the examples and source code that you can download Eclipse
    IDE with support for Maven, a dependency management and build automation tool;
    and Git, a version control system. In the chapters rely on various libraries,
    including Weka, deeplearning4, Mallet, and Apache Mahout. Instructions on how
    to get and install the libraries are provided in the chapter where the library
    will be first used.


    # Who this book is for


    The book is intended for those who want to learn how to use Java''s machine learning
    libraries from your data. Perhaps you already know a bit about machine learning,
    but have never used Java; or perhaps you know a little, but are new to machine
    learning. In this case, this book will get you up and running quickly, providing
    you with the skills you need to successfully create, customize, and deploy machine
    learning applications in real life. It would be helpful to be a little familiar
    with basic programming and data mining concepts, but no prior experience with
    data mining packages is necessary.


    # Supporting materials


    The book has a dedicated web site, http://machine-learning-in-java.com, where
    you can find all the example code, errata, and additional materials that will
    help you to get started.


    # Conventions


    In this book, you will find a number of text styles that distinguish between different
    kinds of information. Here are some examples of these styles and an explanation
    of their meaning.


    Code words in text, database table names, folder names, filenames, file extensions,
    pathnames, dummy URLs, user input, and Twitter handles are shown as follows: "For
    example, Bob has attributes named height, eye color, and hobbies with values 185cm,
    blue, climbing, and sky diving, respectively."'
