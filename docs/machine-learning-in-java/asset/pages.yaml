    # Data transformation


    Data transformation techniques take the dataset to a format that a machine learning
    algorithm expects as an input, and may even help the algorithm to learn faster
    and achieve better performance. Standardization, for instance, assumes that data
    follows Gaussian distribution and transforms the values in such a way that the
    mean value is zero and the deviation is 1,


    ```

    $X = \frac{X - mean(X)}{st.dev}$

    ```


    Normalization, on the other hand, scales the values of attributes to a small,
    range, usually between 0 and 1:


    ```

    $X = \frac{X - min}{max - min}$

    ```


    Many machine learning toolboxes automatically normalize and standardize the data
    for you.'
