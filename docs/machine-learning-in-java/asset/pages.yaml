  md: '# Feature extraction


    Finding an appropriate representation of the person''s activities is probably
    the most challenging part of activity recognition. The behavior needs to be represented
    with simple and general features so that the model will also be general and work
    well on behaviors different from those in the learning set.


    In fact, it is not difficult to design features specific to the captured observations
    in a training set; such features would work well on them. However, as the training
    set captures only a part of the whole range of human behavior, overly specific
    features would likely fail on general behavior:


    ![](img/19ac99d70883ac011b12e9f3fe27f16b_196_0.png)'
