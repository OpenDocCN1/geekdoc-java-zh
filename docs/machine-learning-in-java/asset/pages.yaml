  md: '# Support


    Support, for an itemset, is defined as the proportion of transactions that contain
    the itemset. The [potatoes, burger] itemset in the previous table has the following
    support as it occurs in 50% of transactions (2 out of 4 transactions) supp([potatoes,
    burger]) = 2/4 = 0.5.


    Intuitively, it indicates the share of transactions that support the pattern.


    # Confidence


    Confidence of a rule indicates its accuracy. It is defined as

    Conf(X->Y)=supp(X Y)/supp(X).


    For example, the [onions, burger] rule has the confidence 0.5/0.5 = 1.0 in the
    previous table, which means 100% of the times when onions and burger bought together,
    beer is bought as well.


    # Apriori algorithm


    Apriori algorithm is a classic algorithm used for frequent pattern mining and
    association rule learning over transactional. By identifying the individual items
    in a database and extending them to larger itemsets, Apriori can determine the
    association rules, highlight general trends about a database.


    Apriori algorithm constructs a set of itemsets, for example, itemset={Item A,
    Item B], and calculates support, which counts the number of occurrences in the
    database. Apriori uses a bottom-up approach, where frequent itemsets are extended,
    one item at a time, and it works by eliminating the largest sets as candidates
    by first looking at the smaller sets and recognizing that a large set cannot be
    frequent unless all its subsets are. The algorithm terminates when no further
    successful extensions are found.


    Although, Apriori algorithm is an important milestone in machine learning, it
    suffers from a number of inefficiencies and tradeoffs. In the following section,
    we''ll look into a more recent FP-growth technique.'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# FP-growth algorithm


    FP-growth, **frequent pattern (FP)**, represents the transaction database as a
    prefix tree. First, the algorithm counts the occurrence of items in the dataset.
    In the second pass, it builds a prefix tree, an ordered tree structure commonly
    used to store a string. An example of prefix tree based on the previous example
    is shown in the following diagram:


    ![](img/19ac99d70883ac011b12e9f3fe27f16b_115_0.png)


    If many transactions share most frequent items, prefix tree provides high compression
    close to the tree root. Large itemsets are grown directly, instead of generating
    candidate items and testing them against the entire database. Growth starts at
    the bottom of the tree, by finding all the itemsets matching minimal support and
    confidence. Once the recursive process has completed, all large itemsets with
    minimum coverage have been found and association rule creation begins.


    FP-growth algorithms have several advantages. First, it constructs an FP-tree,
    which encodes the original dataset in a substantially compact representation.
    Second, it efficiently builds frequent itemsets, leveraging the **FP-tree structure**
    and **divide-and-conquer** strategy.'
  merge: -1
  pgno: 115
