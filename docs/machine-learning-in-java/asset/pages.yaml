- img_proc: true
  md: '+   - TokenSequence2FeatureSequence: This converts the token sequence in the
    data field of each instance to a feature sequence


    +   - TokenSequenceNGrams: This converts the token sequence in the data field
    to a token sequence of ngrams, that is, combination of two or more words


    > > The full list of processing steps is available in the following Mallet documentation:

    > http://mallet.cs.umass.edu/api/index.html?cc/mallet/pipe/iterator/package-tree.html


    Now we are ready to build a class that will import our data.


    First, let''s build a pipeline, where each processing step is denoted as a pipeline
    in Mallet. Pipelines are wired together in a single fashion with a list of ArrayList<Pipe>
    objects:


    ```

    ArrayList<Pipe> pipeList = new ArrayList<Pipe>();

    ```


    By reading data from a file object and converting all the characters into lower
    case:


    ```

    pipeList.add(new InputCharSequence("UTF-8"));

    pipeList.add(new CharSequenceLowercase());

    ```


    Next, tokenize raw strings with a regular expression. The following pattern includes
    Unicode letters and numbers and the underscore character:


    ```

    Pattern tokenPattern =

    Pattern.compile("^\\p[L]\\p[N]_+\");"

    ```


    ```

    pipeList.add(new CharSequence2Token(tokenPattern));

    ```


    Remove stop words, that are frequent with no predictive power, using a standard
    English stop list. Two additional parameters indicate whether word removal should
    be case-sensitive and deletions instead of just deleting the words. We''ll set
    both of them to false:


    ```

    pipeList.add(new TokenSequenceRemoveStopwords(false, false));

    ```


    Instead of storing the actual words, we can convert them into integers, indicating
    a word index in the bag of words:


    ```

    pipeList.add(new TokenSequence2FeatureSequence());

    ```'
