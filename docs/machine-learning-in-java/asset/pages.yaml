    # # Evaluation


    A clustering algorithm''s quality can be estimated using the log likelihood measure,
    which measures how consistent the identified clusters are. The dataset is split
    into multiple folds and clustering is run with each fold. The motivation here
    is that if the clustering algorithm assigns high probability to similar data that
    wasn''t used to fit parameters, then it has probably done a good job of capturing
    the data structure. Weka offers the ClusterEvaluation class to estimate it, as
    follows:


