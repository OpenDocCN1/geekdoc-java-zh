  md: 'Chapter 1


    # # Sampling traps


    Data collection may involve many traps. To demonstrate one, let me share a story.
    There is supposed to be a global, unwritten rule for sending regular mail between
    students for free. If you write *student* to *student* to the place where the
    stamp should be, the mail is delivered to the recipient for free. Now, suppose
    Jacob sends a set of postcards to Emma, and given that Emma indeed receives some
    of the postcards, concludes that all the postcards are delivered and that the
    rule holds true. Emma reasons that as she received the postcards, all are delivered.
    However, she does not possess the information about the postcards that were sent
    by Jacob, but were undelivered; hence she is unable to account for this into her
    inference. What Emma experienced is *survivorship bias*, that is, she drew the
    conclusion based on the survived data. For your information, the postcards that
    are being sent with student stamp get a circled black letter T on them, which
    mean *posting is due* and receiver should pay it, including a small fine. However,
    services often have higher costs on using such fee and hence do not it (Magalhães,
    2010).


    Another example is a study, which found that the profession with the lowest average
    age of death was student. A student does not cause you to die at an early age,
    being a student means you are young. This is what makes the average of those that
    die so low (Gelman and Nolan, 2002).


    Furthermore, a study that found only 1.5% of drivers in accidents reported they
    were using a cell phone, 10.9% reported another occupant in the car were distracted
    them. We can conclude that using a cell phone is safer than speaking with another
    occupant (Uts, 2003)? To answer this question, we need to know the prevalence
    of the cell phone use. It is likely that a higher number of people talked to another
    occupant in the car while driving and talking on the cell during the period when
    the data was collected.


    # # Data pre-processing


    The goal of data pre-processing tasks is to prepare the data for a machine learning
    algorithm in the best possible way as not all algorithms are capable of addressing
    issues with missing data, extra attributes, or denormalized values.


    # # Data cleaning


    Data cleaning, also known as data cleaning or data scrubbing, is the process of
    the following:


    +   * Identifying inaccurate, incomplete, irrelevant, or corrupted data to remove
    it from further processing


