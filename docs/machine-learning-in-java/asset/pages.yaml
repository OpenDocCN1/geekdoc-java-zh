- img_proc: true
  md: '# Dealing with big data


    Big data existed long before the phrase was invented, for instance, banks and
    stock exchanges have been processing billions of transactions daily for years,
    and airlines companies have worldwide real-time infrastructure for operational
    management of passenger booking, and so on. What is big data really? Doug Laney
    (2001) suggested that big data is defined by three: volume, velocity, and variety.
    Therefore, to answer the question whether your data is big, we can translate this
    into the following three subquestions:


    +   - Volume: Can you store your data in memory?

    - Velocity: Can you process new incoming data with a single machine?

    - Variety: Is your data from a single source?


    If you answered all the questions with yes, then your data is probably not big,
    do not worry, you have just justified your application architecture.

    If your answer to all the questions was no, then you have mixed answers, it''s
    complicated. Some might argue that a V is important, other might say the V is.
    From the machine learning point of view, there is a fundamental difference in
    algorithm implementation to process the data in memory or from distributed storage.
    Therefore, a rule of thumb is as follows: if you cannot store your data in the
    memory, then you should look into a big data learning library.


    The exact answer depends on the problem that you are trying to solve. If you''re
    starting a new project, I''d suggest you start off with a single-machine library
    and prototype your algorithm, possibly with a subset of your data if the entire
    data does not fit into the memory. Once you''ve established good initial results,
    consider moving to something heavy duty such as Mahout or Spark.


    # Big data application architecture


    Big data, as documents, webs, social networks, sensor data, and others, are stored
    in a NoSQL database, such as MongoDB, or a distributed filesystem, such as HDFS.
    In case we deal with structured data, we can deploy database capabilities using
    systems such as Cassandra or HBase atop Hadoop. Data processing follows the MapReduce
    paradigm, which breaks data processing into smaller subproblems and distributes
    tasks across processing nodes. Machine learning models are finally trained with
    machine learning libraries such as Mahout and Spark.'
  merge: -1
