    Java machine learning library, or Java-ML, is a collection of machine learning
    algorithms with a common interface for algorithms of the same type. It only features
    Java API, it is primarily aimed at software engineers and programmers. Java-ML
    contains algorithms for data preprocessing, feature selection, classification,
