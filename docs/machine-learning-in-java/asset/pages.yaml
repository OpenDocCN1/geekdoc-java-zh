    The most common way to represent the data is using a set of attribute-value pairs.
    Consider the following example:


    ```

    Bob = {

    height: 185cm,

    eye: blue,

    hobbies: climbing, sky diving

    }

    ```


    For example, Bob has attributes named height, eye color, and hobbies with values
    185cm, blue, climbing, sky diving, respectively.


    A set of data can be simply presented as a table, where columns correspond to
    attributes or features and rows correspond to particular data examples or instances.
    In supervised machine learning, the attribute whose value we want to predict the
    outcome, from the values of the other attributes, X, is denoted as class or the
    target variable, as:


    | Name | Height [cm] | Eye color | Hobbies |

    |---|---|---|---|n| Bob | 185.0 | Blue | Climbing, sky diving |

    | Anna | 163.0 | Brown | Reading |

    | ... | ... | ... | ... |


    The first thing we notice is how varying the values are. For instance, height
    is a number, eye color is text, and hobbies are a list. To get a better understanding
    of the value types, let''s take a closer look at the different types of data or
    measurement scales. Stevens (1946) defined the four scales with increasingly more
    expressive properties:


    +   - Nominal data are mutually exclusive, but not ordered. Their examples include
    eye color, martial status, type of car owned, and so on.

    - Ordinal data correspond to categories where order matters, but not the difference
    between the values, such as pain level, student letter grade, service quality
    rating, IMDb movie rating, and so on.

    - Interval data where the difference between two values is meaningful, but there
    is no concept of zero. For instance, standardized exam score, temperature in Fahrenheit,
    and so on.'
