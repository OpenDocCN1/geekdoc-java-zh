    # # Unsupervised learning


    Unsupervised learning is about analyzing the data and discovering hidden structures
    in unlabeled data. As no notion of the right labels is given, there is no error
    measure to evaluate a learned model; however, unsupervised learning is an extremely
    powerful tool. Have you ever wondered Amazon can predict what books you''ll like?
    Netflix knows what you want to watch before you do? The answer can be found in
    unsupervised learning. The following is one such example.


    # # Find similar items


    Many problems can be formulated as finding similar sets of elements, for example,
    customers who purchased similar products, web pages with similar content, images
    with similar objects, users who visited similar websites, and so on.


    Two items are considered similar if they are a small distance apart. The main
    questions are how each item is represented and how is the distance between the
    items defined. There are two main classes of distance measures: Euclidean distances
    and non-Euclidean distances.


    # # Euclidean distances


    In the Euclidean space, the $n$ dimension, the distance between two elements is
    based on the locations of the elements in such space, which is expressed as $p$-norm
    distance. Two commonly used distance measures are $L2$ and $L1$ norm distances.


    $L2$ norm, also known as Euclidean distance, is the most frequently applied distance
    measure that measures how far apart two items in a two-dimensional space are.
    It is calculated as a square root of the sum of the squares of the differences
    between elements $a$ and $b$ in each dimension, as:


    ```

    $L_n,norm(a,b) = \sqrt{\sum_{i=1}^{n}(a_i-b_i)^2}$

    ```


    [ 13 ]'
