  md: '# Competitions


    The best way to sharpen your knowledge is to work on real problems; and if you
    want to build a proven portfolio of your projects, machine learning competitions
    are a viable place to start:


    +   - **Kaggle**: This is the number competition platform, hosting a wide variety
    of challenges with large prizes, strong data science community, and lots of helpful
    resources. You can check it out at https://www.kaggle.com/.

    - **CrowdANALYTIX**: This is a crowdsourced data analytics service that is focused
    on the life sciences and financial services industries at https://www.crowdanalytix.com.

    - **DrivenData**: This hosts data science competitions for social good at http://www.drivendata.org.


    # Websites and blogs


    In addition to online courses and competitions, there are numerous websites and
    blogs publishing the latest developments in the data science community, their
    experience in attending different problems, or just best practices. Some good
    starting points are as:


    +   - **KDnuggets**: This is the de facto portal for data mining, analytics, big
    data, and data science, covering the latest news, stories, events, and other relevant
    issues at http://www.kdnuggets.com.

    - **Machine learning mastery**: This is an introductory-level blog with practical
    advice and pointers where to start. Check it out at http://machinelearningmastery.com.

    - **Data Science Central**: This consists of practical community articles on a
    variety of topics, algorithms, and business cases at http://www.datasciencecentral.com.

    - **Data Mining Research**: by Sandro Saaita at http://www.dataminingblog.com/.

    - **Data Mining**: Visualization by Matthew Hurst, covering interesting text and
    web mining topics, frequently with applications to Bing and Microsoft at http://datamining.typicode.com/

    - **Geeking with Greg** by Greg Linden, inventor of Amazon recommendation engine
    and Internet entrepreneur. You can check it out at http://glinden.blogspot.si.

    - **DSGuide**: This is a collection of over 150 data science blogs at http://dsguide.biz/reader/sources.'
  merge: -1
  pgno: 241
