  md: '# Association rule learning


    Association rule learning is a popular approach to discover interesting relations
    hips between items in large databases. It is most commonly applied in retail to
    reveal regulations between products.


    Association rule learning finds patterns as strong rules in the database using
    different measures of interestingness. For example, the following rule would indicate
    that if a customer buys onions and potatoes together, they are likely to also
    buy burger: {onions, potatoes} -> {burger}


    Another classic story proved truly in every machine learning class is the beer
    and diaper story. An analysis of supermarket shoppers'' behavior showed that customers,
    presumably young men, who buys diapers also to buy beer. It immediately became
    a popular example of how an unexpected association rule might be found from everyday
    data; there are varying opinions as to how much of the story is true. Daniel Powers
    (DSS News, 2002):


    > "In 1992, Thomas Bischlok, manager of a retail consulting group at Teradata,
    and his staff prepared an analysis of 1.2 million market baskets from 25 Osc Drug
    stores. Database queries were developed to identify affinities. The analysis did
    discover that between 5:00 and 7:00 p.m., consumers bought beer and diapers".
    Osc managers did not exploit the beer and diapers relationship by moving the products
    closer together on the shelves."


    In addition to the preceding example from MBA, association rules are today employed
    in many application areas, including web usage mining, intrusion detection, continuous
    production, and bioinformatics. We''ll take a closer look at these areas later
    in this chapter.


    # Basic concepts


    Before we dive into algorithms, let''s first review the basic concepts.


    # Database of transactions


