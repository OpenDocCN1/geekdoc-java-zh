    # # Choosing a classification algorithm


    Naive Bayes is one of the most simple, efficient, and effective inductive algorithms
    in machine learning. When features are independent, this is rarely true in real
    world, it is theoretically optimal, and even with dependent features, its performance
    is amazingly competitive (Zhang, 2004). The main disadvantage is that it cannot
    learn how features interact with each other, for example, despite the fact that
    you like your tea with lemon or milk, you have a tea having both of them at the
    same time.


    Decision tree''s main advantage is a model, that is, a tree, which is easy to
    interpret and explain as we studied in our example. It can handle both nominal
    and numeric features and you don''t have to worry whether the data is linearly
    separable.


    Some other of classification algorithms are as follows:


    +   * weka.classifiers.rules.Zero: This predicts the majority class and is considered
    as a baseline, that is, if your classifier''s performance is worse than the average
    value predictor, it is not worth considering it.

    * weka.classifiers.trees.RandomTree: This constructs a tree that considers K randomly
    chosen attributes at each node.'
