    # Collaborative filtering


    Recommendation engines in Mahout can be built with the org.apache.mahout.cf.taste
    package, which was formerly a separate project called Taste and has continued
    development in Mahout.


    A Mahout-based collaborative filtering takes the users'' preferences for items
    (tastes) and returns the estimated preferences for other items. For example, a
    site that sells books or CDs use Mahout to figure out the CDs that a customer
    might be interested in listening to with the help of the previous purchase data.


    Top-level packages define the Mahout interfaces to the following key abstractions:


    +   - **DataModel**: This represents a repository of information about users and
    their preferences for items

    - **Similarity**: This defines a notion of similarity between two users

    - **ItemSimilarity**: This defines a notion of similarity between two items

    - **UserNeighborhood**: This computes neighborhood users for a given user

    - **Recommender**: This recommends items for user'
