  md: '+   * weka.classifiers.trees.RandomForest: This constructs a set (that is,
    forest) of random trees and uses majority voting to classify a new instance.

    * weka.classifiers.lazy.IBK: This is the k-nearest neighbor''s classifier that
    is able to select an appropriate value of neighbors besides cross-validation.

    * weka.classifiers.functions.MultilayerPerceptron: This is a classifier based
    on neural networks that use back-propagation to classify instances. The network
    can be built by hand, or created by an algorithm, or both.

    * weka.classifiers.bayes.NaiveBayes: This is a naive Bayes classifier that uses
    estimator class, where numeric precision values are chosen based on the analysis
    of the training data.

    * weka.classifiers.meta.AdaBoostM1: This is the class for boosting a nominal classifier
    using the AdaM1 method. Only nominal class problems can be tackled. This dramatically
    improves the performance, but sometimes it overfits.

    * weka.classifiers.meta.Bagging: This is the class for a classifier to reduce
    the variance. This can perform classification and regression, depending on the
    base learner.


