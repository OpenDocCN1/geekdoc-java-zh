    # # Data reduction


    Data reduction with abundant attributes and instances. The number of attributes
    corresponds to the number of dimensions in our dataset. Dimensions with low prediction
    power do not contribute very little to the overall model, but also cause a lot
    of harm. For instance, an attribute with random values can introduce some random
    patterns that will be picked up by a machine learning algorithm.


    To deal with this problem, the first set of techniques removes such attributes,
    or in other words, selects the most promising ones. This process is known as feature
    selection or attribute selection and includes methods such as Relief, information
    gain, and Gini index. These methods are mainly focused on discrete attributes.


    Another set of tools, focused on continuous attributes, transforms the dataset
    from the original dimensions into a lower-dimensional space. For example, if we
    have a set of points in three-dimensional space, we can make a projection into
    a two-dimensional space. Information is lost, but in case much as the data structure
    and relationships are almost perfectly preserved. This don''t lose as much. This
    can be performed by the following methods:


    +   - **Singular value decomposition (SVD)**


    +   - **Principal Component Analysis (PCA)**


    +   - **Neural nets auto encoders'
