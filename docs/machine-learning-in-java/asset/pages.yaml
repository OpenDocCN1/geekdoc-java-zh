  md: '# Evaluation


    The submissions were evaluated according to the arithmetic mean of the area under
    the ROC curve (AUC) for the three tasks, that is, churn, appetency, and upselling.
    ROC curve shows the performance of model as a curve by plotting sensitivity for
    specificity for any threshold values used to determine the classification result
    (refer to Chapter 1, Applied Machine Learning Quick Start, section ROC curves).
    Now, the AUC is related to the area under this curve, meaning larger the area,
    better the classifier. Most toolboxes, including Weka, provide an API to calculate
    AUC score.


    # Basic naive Bayes classifier baseline


    As per the rules of the challenge, the participants had to outperform the basic
    naive Bayes classifier to qualify which makes an assumption that features are
    independent (refer to Chapter 1, Applied Machine Learning Quick Start).


    The KDD Cup organizers run the vanilla naive Bayes classifier, without any feature
    selection or hyperparameter adjustments. For the large dataset, the overall scores
    of the naive Bayes on the test set were follows:


    +   - Churn problem: AUC = 0.6468

    - Appetency problem: AUC = 0.6453

    - Upselling problem: AUC=0.7211


    Note that the baseline results are reported for large dataset only. Moreover,
    while both training and test datasets are provided at the KDD Cup site, the actual
    true labels for the test set are not provided. Therefore, we process the data
    with our models, there is no way to know how well the models will perform on the
    test set. What we will do is use only the training data and evaluate our models
    with cross validation. The results will not be directly comparable, but nevertheless,
    we have an idea for what a reasonable magnitude of the AUC score is.'
