  md: '# Chapter 10


    The class is instantiated with parameters alpha and beta, which can be broadly
    interpreted, as follows:


    +   - High alpha value means that each document is likely to contain a mixture
    of most of the topics, and not any single topic specifically. A low alpha value
    puts less of such constraints on documents, and this means that it is more likely
    that a document may contain mixture of just a few, or even only one, of the topics.

    - A high beta value means that each topic is likely to contain a mixture of most
    of the words, and not any word specifically; a low beta value means that a topic
    may contain a mixture of just a few of the words.


    In our case, we initially keep both parameters low (alpha_t = 0.01, beta_w = 0.01)
    as we assume topics are not mixed and there are many words for each of the topics:


    ```

    int numTopics = 5;

    ParallelTopicModel model =

    new ParallelTopicModel(numTopics, 0.01, 0.01);

    ```


    Next, add instances to the model, and as we are using parallel implementation,
    specify the number of threads that will run in parallel, as follows:


    ```

    model.addInstances(instances);

    model.setNumThreads(4);

    ```


    Run the model for a selected number of iterations. Each iteration is used for
    better estimation of internal LDA parameters. For testing, we can use a small
    number of iterations, for example, 50; while in real applications, use 1000 or
    2000 iterations. Finally, call the void estimate() method that will actually build
    an LDA model:


    ```

    model.setNumIterations(1000);

    model.estimate();

    ```


