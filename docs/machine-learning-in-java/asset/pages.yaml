    # # Working with text data


    One of the main challenges in text mining is transforming unstructured written
    natural language into structured attribute-based instances. The process involves
    many steps as shown in the following image:


    ![](img/19ac99d70883ac011b12e9f3fe27f16b_212_1.png)'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# Chapter 10


    First, extract some text from the Internet, existing documents, or databases.
    At the end of the first step, the text could be presented in the XML format or
    some other proprietary format. The next step is to, therefore, extract the actual
    text only and segment it into parts of the document, for example, title, headline,
    body, and so on. The third step is involved with normalizing encoding to ensure
    the characters are presented the same way, for example, documents encoded in formats
    as ASCII, ISO 8859-1, and Windows-1250 are transformed into Unicode encoding.
    The next, tokenization splits the document into particular words, while the following
    step removes frequent that have low predictive power, for example, the a, I, and
    so on.


    The part-of-speech (POS) tagging and lemmatization step could be included to transform
    each token (that is, word) to its basic form, which is known as lemma, by removing
    endings and modifiers. For example, running becomes run, better becomes, and so
    on. A simplified approach is stemming, which operates on a single word without
    any context of how the particular word is used, and therefore, cannot distinguish
    between words having different meaning, depending on the part of speech, for example,
    as axial of plural as well axis.


    The last step transforms tokens into a feature space. Most often feature space
    is a bag-of-words (BoW) presentation. In this presentation, a set of all words
    appearing in the dataset is created, that is, a bag of words. Each document is
    then presented as a vector that counts how many times a particular word appears
    in the document.


    Consider the following example with two sentences:


    +   * Jacob likes tennis.

    * Jacob also likes basketball.


    The bag of words in this case consists of {Jacob, likes, table, tennis, Emma,
    too, also, basketball}, which has eight distinct words. The two sentences could
    be now presented using the indices of the list, indicating how many times a word
    at a particular index appears in the document, as follows:


    +   * [1, 2, 2, 2, 1, 0, 0, 0]

    * [1, 1, 0, 0, 0, 0, 1, 1]


    — 191 —'
