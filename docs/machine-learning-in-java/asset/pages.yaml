  md: 'To understand the LOF values, we need some background on the LOF algorithm.
    It compares the density of an instance to the density of its nearest neighbors.
    The two scores are divided, producing the LOF score. The LOF score around 1 indicates
    that the density is approximately equal, while higher LOF values indicate that
    the density of the instance is substantially lower than the density of its neighbors.
    In such cases, the instance can be marked as anomalous.


