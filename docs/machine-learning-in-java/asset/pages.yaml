  md: '# # 11 What is Next?


    This chapter brings us to the end of our journey of reviewing machine learning
    Java libraries and discussing how to leverage them to solve real-life problems.
    However, this should not be the end of your journey by all means. This chapter
    will give you some practical advice on how to start deploying your models in the
    real world, what are the catches, and where to go deepen your knowledge. It also
    gives you further pointers about where to find additional resources, materials,
    venues, and technologies to dive deeper into machine learning.


    This chapter will cover the following topics:


    +   - Important aspects of machine learning in real life

    - Standards and markup languages

    - Machine learning in the cloud

    - Web resources and competitions


    # ## Machine learning in real life


    Papers, conference presentations, and talks often don''t discuss how the models
    actually deployed and maintained in production environment. In this section, we''ll
    look into some aspects that should be taken into consideration.'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# Noisy data


    In practice, data typically contains errors and imperfections due to various reasons
    such as measurement errors, human mistakes, errors of expert judgment in classifying
    training examples, and so on. We refer to all of these as noise. Noise can also
    come from the treatment of missing values when an example with unknown attribute
    value is replaced by a set of weighted examples corresponding to the probability
    distribution of the missing value. The typical cases of noise in learning are
    low prediction accuracy of learned model in new data and complex models that are
    hard to interpret and understand by the user.


    # Class unbalance


    Class unbalance is a problem we come across in Chapter 7, Fraud and Anomaly Detection,
    the goal was to detect fraudulent insurance claims. The challenge is that a very
    large part of the dataset, usually more than 90%, describes activities and only
    a small fraction of the dataset contains fraudulent examples. In such a case,
    if the model predicts normal, then it corrects 90% of the time. This problem is
    extremely common in practice and can be observed in various applications, including
    fraud detection, anomaly detection, medical diagnosis, oil spillage detection,
    fault recognition, and so on.


    Now knowing how the class unbalance problem is and why it is a problem, let''s
    take a look at how to deal with this problem. The first approach is to focus on
    measures other than classification accuracy, such as recall, precision, and f-measure.
    Such measures focus on how accurate a model is at predicting minority class (recall)
    and what is the share of false alarms (precision). The other approach is based
    on resampling, where the main idea is to reduce the number of overrepresented
    examples in which way the new sets contain a balanced ratio of both the classes.


    # Feature selection is hard


    Feature selection is arguably the most challenging part of modeling that requires
    domain knowledge and good insights into the problem at hand. Nevertheless, properties
    of well-behaved features are as follows:


    +   - Reusability: Features should be available for reuse in different models,
    applications, and teams


    +   - Transformability: You should be able to transform a feature with an operation,
    for example, log(), max(), or combine multiple features together with a custom
    calculation'
  merge: -1
  pgno: 232
- img_proc: true
  md: 'Chapter 11


    +   - **Reliability**: Features should be easy to monitor and appropriate unit
    tests should exist to minimize bugs/issues

    - **Interpretability**: In order to perform any of the previous actions, you need
    to be able to understand the meaning of features and interpret their values


    The better you are able to capture the features, the more accurate your results
    will be.


    # Model chaining


    Some models might produce an output, which is used as the feature in another model.
    Moreover, we can use multiple models--ensembles-- turning any model into a feature.
    This is a great way to get better results, but this can lead to problems too.
    Care be taken that the output of your model is ready to accept dependencies. Also,
    try to avoid feedback loops, which they can create dependencies and bottlenecks
    in pipeline.


    # Importance of evaluation


    Another important aspect is model evaluation. Unless you apply your models to
    actual new data and measure a business objective, you''re not doing predictive
    analytics. Evaluation techniques, such as cross-validation and separated train/test,
    split your test data, which can give you an estimate of how your model will perform.
    Life often doesn''t hand you a train dataset with all the cases defined, so there
    is a lot of creativity in defining these two sets in a real-world dataset.


    At the end of the day, we want to improve clicks on recommended items, such as
    improve conversion rate, get more clicks... and so on. To measure the improvement,
    execute A/B tests, measure differences in metrics across statistically identical
    populations that each experience a different algorithm. Decisions on the product
    are data-driven.


    > A/B testing is a method for a randomized experiment with two variants: A, which
    corresponds to the original version, controlling the experiment; and B, which
    corresponds to a variation. The method can be used to determine whether the variation
    outperforms the original version. It can be used to test everything from website
    changes to sales e-mails to search ads. Udacity offers a free course, covering
    design and analysis of A/B tests at https://www.udacity.com/course/ab-testing--ud257.


    ![](img/19ac99d70883ac011b12e9f3fe27f16b_233_0.png)


    [ 211 ]'
