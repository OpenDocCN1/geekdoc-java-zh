  md: "Recommendation Engine with Apache Mahout\n\n# # Evaluation\n\nYou might wonder\
    \ how to make sure that the returned recommendations make any sense? The only\
    \ way to be really sure about how effective recommendations are to use A/B testing\
    \ in a live system with real users. For example, the A group receives a random\
    \ item as recommendation, while the B group receives an item recommended by our\
    \ engine.\n\nAs this is neither always nor practical, we can get an estimate with\
    \ offline statistical evaluation. One way to proceed is to use the k-fold cross\
    \ validation introduced in Chapter 1, Applied Learning Quick Start. We partition\
    \ dataset into multiple sets, some to use our recommendation engine and the rest\
    \ to test how well it recommends to unknown users.\n\nMahout implements the RecommenderEvaluator\
    \ class that splits a dataset in two parts. The first part, 90% by default, is\
    \ used to produce recommendations, while the rest of the data is compared against\
    \ estimated preferences to test the match. The class does not accept a recommender\
    \ object directly, you need to build a class implementing the RecommenderBuilder\
    \ interface instead, which builds a recommender object for a given Data object\
    \ is then used for testing. Let's take a look at how this is implemented.\n\n\
    First, we create a class that implements the RecommenderBuilder interface. We\
    \ need to implement the buildRecommender method, which will return a recommender:\n\
    \n```\npublic class BookRecommender implements RecommenderBuilder {\n    public\
    \ Recommender buildRecommender(DataModel dataModel) {\n        UserSimilarity\
    \ similarity = =\n            new PearsonCorrelationSimilarity(model);\n     \
    \   UserNeighborhood neighborhood =\n            new ThresholdUserNeighborhood(0.1,\
