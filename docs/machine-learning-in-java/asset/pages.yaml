  md: '# Attribute selection


    In the next step, we will select only informative attributes, that is, attributes
    that more likely help with prediction. A standard approach to this problem is
    to check the information gain carried by each attribute. We will use the weka.attributeSelection.AttributeSelection
    filter, which requires two additional methods: evaluator, that is, how attribute
    usefulness is calculated, and search algorithms, that is, to select a subset of
    attributes.


    In our case, we first initialize weka.attributeSelection.InfoGainAttributeEval
    that implements calculations of information gain:


    ```

    InfoGainAttributeEval eval = new InfoGainAttributeEval();nRanker search = new
    Ranker();

    ```


    To select only attributes above some threshold, we initialize weka.attributeSelection.Ranker
    to rank the attributes with information gain above a specific threshold. We specify
    this with the -T parameter, while keeping the value of the threshold low to keep
    the attributes at least some information:


    ```

    search.setOptions(new String[] { "-T", "0.001" });

    ```


    ![](img/19ac99d70883ac011b12e9f3fe27f16b_102_0.png)


    Next, we can initialize the AttributeSelection class, set the evaluator and ranker,
    and apply the attribute selection to our dataset:


    ```

    AttributeSelection attSelect = new AttributeSelection();

    attSelect.setEvaluator(eval);

    attSelect.setSearch(search);

    ```


    ```

    // apply attribute selection

    attSelect.selectAttributes(data);

    ```'
