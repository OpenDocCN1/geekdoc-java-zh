  md: "# Basic Algorithms – Classification, Regression, and Clustering\n\nEM works\
    \ as follows: given a set of clusters, EM first assigns each instance with a probability\
    \ distribution of belonging to a particular cluster. For example, if we start\
    \ with three clusters—A, B, and C—an instance might get the probability distribution\
    \ of 0.70, 0.10, and 0.20, belonging to the A, B, and C, respectively. In the\
    \ second step, EM re-estimates the vector of the probability distribution of each\
    \ class. The algorithm iterates these two steps until the parameters converge\
    \ or the maximum number of iterations is reached.\n\nThe number of clusters to\
    \ be used in EM can be set manually or automatically by cross validation. Another\
    \ approach to determining the number of clusters in a dataset includes the elbow\
    \ method. The method looks at the percentage of variance that is explained with\
    \ a specific number of clusters. The method suggests increasing the number of\
    \ clusters until the additional cluster does not add much information, that is,\
    \ explains little additional variance.\n\n# Clustering algorithms\n\nThe process\
    \ of building a cluster model is quite similar to the process of building a classification\
    \ model, that is, load the data and build a model. Clustering algorithms are implemented\
    \ in the weka.classifiers package, as follows:\n\n```\nimport java.io.BufferedReader;\n\
    import java.io.FileReader;\n\nimport weka.core.Instances;\nimport weka.clusterers.EM;\n\
    \npublic class Clustering {\n\n    public static void main(String[] args[]) throws\
    \ Exception {\n        // load data\n        Instances data = new Instances(new\
    \ BufferedReader(args[0]));\n\n        // new instance of clusterer\n        EM\
    \ model = new EM();\n        // build the clusterer\n        model.buildCluster(data);\n\
    \        System.out.println(model);\n    }\n}\n```"
