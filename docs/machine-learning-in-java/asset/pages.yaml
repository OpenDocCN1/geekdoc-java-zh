  md: 'There is a wide variety of hybridization techniques as weighted, switching,
    mixed, feature combination, feature augmentation, cascade, meta-level, and so
    on. Recommendation systems are an active area in machine learning and data mining
    community with special tracks on data science conferences. A good overview of
    techniques is summarized in the paper Toward the next generation of recommender
    systems: a survey of the state-of-the-art and possible extensions by Adomovich
    and Tuzlin (2005), the authors discuss different approaches and algorithms and
    provide references to further papers. To get more technical and understand all
    the tiny details when a particular approach makes sense, you should look at the
    book edited by Ricci et al. (2010) Recommender Systems Handbook (1st ed.); Springer-Verlag
    New York.


    # Exploitation versus exploration


    In recommendation system, there is a tradeoff between recommending items that
    fall into the user''s sweet spot based on what we already know about the user
    (exploitation) and recommending items that do fall into user''s sweet spot with
    the aim to explore some novelties (exploration). Recommendation systems with little
    exploration will only recommend items consistent with the previous user ratings,
    preventing showing items outside their current bubble. In practice, serendipity
    of getting new items out of their sweet spot is often desirable, leading to pleasant
    surprise and discovery of new sweet spots.


    In this section, we discussed the essential concepts required to start building
    recommendation engines. Now, let''s take a look at how to actually build one with
    Apache Mahout.


    # Getting Apache Mahout


    Mahout was introduced in Chapter 2, Java Tools and Libraries for Machine Learning,
    as a scalable machine learning library. It provides a rich set of components with
    which you can construct a customized recommendation system from a selection of
    algorithms. The creators of Mahout say it is designed to be enterprise-ready;
    it''s designed for performance, scalability, and flexibility.


    Mahout can be configured to run in two ways: with or without Hadoop for a single
    machine and distributed processing, correspondingly. We will focus on configuring
    Mahout without Hadoop. For more advanced configurations and further uses of Mahout,
    I would recommend two recent books: Learning Apache Mahout (Tiwary, 2015) and
    Learning Apache Mahout Classification (Gupta, 2015).'
