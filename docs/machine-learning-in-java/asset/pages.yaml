- img_proc: true
  md: 'Edit distance makes sense when we compare two strings. The distance between
    the $a=a_1,a_2...a_n$ and $b=b_1,b_2...b_m$, strings is the smallest number of
    the insert/delete operation of single characters required to convert the string
    from $a$ to $b$. For example, $a=abcd$ and $b=abbd$. To convert $a$ to $b$, we
    have to delete the second $b$ and $c$ in its place. No smallest number of operations
    convert $a$ to $b$, thus the distance is $d(a,b)=2$.


    Hamming distance compares vectors of the same size and counts the number of dimensions
    in which they differ. In other words, it measures the number of substitutions
    required to convert one vector into another.


    There are many distance measures focusing on various properties, for instance,
    correlation measures the linear relationship between two elements: Mahalanobis
    distance measures the distance between a point and distribution of other points
    and SimRank, which is based on graph theory, measures similarity of the structure
    in which elements occur, and so. As you can already imagine selecting and designing
    the right similarity for your problem is more than half of the battle. An impressive
    overview and evaluation of similarity measures is collected in Chapter 2, Similarity
    and Dissimilarity Measures in the book Image Registration: Principles, Tools and
    Methods by A. A. Goshtaby (2012).


    # The curse of dimensionality


    The curse of dimensionality refers to a situation where we have a large number
    of features, often hundreds or thousands, which lead to an extremely large space
    with sparse data, and consequently, to distance anomalies. In instance, in high
    dimensions, almost all the pairs of points are equally distant from each other;
    in fact, almost all pairs have distance close to the average distance. Another
    manifestation of the curse is that any two vectors are nearly orthogonal, which
    means all the angles are close to 90 degrees. This practically makes any distance
    useless.


    A cure for the curse of dimensionality might be found in one of the data reduction
    techniques, where we want to reduce the number of features; for instance, we can
    run a feature selection algorithm such as ReliefF or feature extraction/reduction
    algorithm such as PCA.'
