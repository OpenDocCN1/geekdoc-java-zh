    Before we start with the analysis, we will load the data in Weka''s ARRF format
    and print the total number of loaded instances. Each data sample is held within
    an Instances object, while the complete dataset accompanied with meta-information
    is handled by the Instances object.


    To input the data, we will use the DataSource object that accepts a variety of
    file formats and converts them to Instances:


