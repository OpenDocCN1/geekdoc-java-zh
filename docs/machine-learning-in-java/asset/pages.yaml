- img_proc: true
  md: '# Introducing activity recognition


    Activity recognition is an underpinning step in behavior analysis, addressing
    healthy lifestyle, fitness tracking, remote assistance, security applications,
    elderly care, and so on. Activity recognition transforms low-level sensor from
    sensors, such as accelerometer, gyroscope, pressure sensor, and GPS location,
    to a higher-level description of behavior. In most cases, these are basic activities,
    for example, walking, sitting, lying, jumping, and so on, as shown in the following
    image, or they could be more complex behaviors, such as going to work, preparing
    breakfast, shopping, and so on:


    ![](img/19ac99d70883ac011b12e9f3fe27f16b_188_0.png)


    In this chapter, we will discuss how to add the activity recognition functionality
    into a mobile application. We will first look at what an activity recognition
    problem looks like, what kind of data do we need to collect, what are the main
    challenges, and how to address them?


    Later, we will follow an example to see how to actually implement activity recognition
    in an Android application, including data collection, data transformation, and
    building a classifier.


    Let''s start!


    # Mobile phone sensors


    Let'' first review what kind of mobile phone sensors there are and what they report.
    Most smart devices are now equipped with several built-in sensors that measure
    the motion, position, orientation, and conditions of the ambient environment.
    As sensors provide measures with high precision, frequency, and accuracy, it is
    possible to reconstruct complex user motions, gestures, and movements. Sensors
    are often incorporated in various applications; for example, gyroscope readings
    are used to steer an object in a game, GPS data is used to locate the user, and
    accelerometer data is used to infer the activity that the user is performing,
    for example, cycling, running, or walking.'
  merge: -1
