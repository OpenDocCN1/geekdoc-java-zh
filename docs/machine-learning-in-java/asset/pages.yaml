- img_proc: true
  md: '# Ensemble learning


    Ensemble methods compose of a set of diverse weaker models to obtain better predictive
    performance. The individual models are trained separately and their predictions
    are then combined in some way to make the overall prediction. Ensembles, hence,
    contain multiple ways of modeling the data, which hopefully leads to better results.
    This is a powerful class of techniques, and as such, it is very popular; for instance,
    boosting, bagging, AdaBoost, and Random Forest. The main differences among them
    are the type of weak learners that are to combined and the ways in which to combine
    them.


    # Evaluating classification


    Is our classifier doing well? Is this better than the other one? In classification,
    we count many times we classify something right and wrong. Suppose there are two
    possible classification labels – yes and no – then there are four possible outcomes,
    as shown in the next figure:


    +   - True positive: hit indicates a yes instance correctly predicted as yes


    +   - True negative: correct rejection: This indicates a no instance correctly
    predicted as no


    +   - False positive: false alarm: This indicates a no instance predicted as yes


    +   - False negative – miss: This indicates a yes instance predicted as no


    | Predicted as positive? | | |

    |---|---|---|

    | | Yes | No |

    | | TP – true positive | FN – false negative |

    | Really positive? | FP – false positive | TN –true negative |


    The basic two performance measures of a classifier are classification error and
    accuracy, as shown in the following image:


    ```

    Classification error = \frac{errors}{totals} = \frac{FP + FN}{FP + FN + TP + TN}

    ```


    ```

    Classification accuracy = 1 - error = \frac{correct}{totals} = \frac{TP + TN}{FP
    + FN + TP + FN}

    ```'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'Applied Machine Learning Quick Start


    The main problem with these two measures is that they cannot handle unbalanced
    classes. Classifying whether a credit card transaction is an abuse or not is an
    example of a problem with unbalanced classes, there are 99.99% normal transactions
    and just a tiny percentage of abuses. Classifier says that every transaction is
    a normal one is 99.99% accurate, but we are mainly interested in those few classifications
    that occur very.


    # Precision and recall


    The solution is to use measures that don''t involve TN (correct rejections). Two
    measures are as follows:


    +   Precision: This is the proportion of positive examples correctly predicted
    as positive (TP) out of all examples predicted as positive (TP + FP):


    Precision = \frac{TP}{TP + FP}


    +   Recall: This is the proportion of positive examples correctly predicted as
    positive (TP) out of all positive examples (TP + FN):


    Recall = \frac{TP}{TP + FN}


    It is common to combine the two and report the F-measure, which considers both
    precision and recall to calculate the score as a weighted average, where the score
    reaches its best value at 1 and worst at 0, as follows:


    $F - measure = \frac{2 * Precision * Recall}{Precision + Recall}$


    # Roc curves


    Most classification algorithms return a classification confidence denoted as $f(X)$,
    which is, in turn, used to calculate the prediction. Following the credit card
    abuse example, a rule might look similar to the following:


    ```

    $F(X) = \begin{cases} abuse, if f(X) > threshold \ not abuse, else \end{cases}$

    ```


    [ 20 ]'
  merge: -1
