  md: '# Applied Machine Learning Quick Start


    L1 norm, also known as Manhattan distance, city block distance, and taxicab norm,
    simply sums the absolute differences in each dimension, as follows:


    $d(a,b) = \sum_{i} |a_i - b_i|$$


    # Non-Euclidean distances


    A non-Euclidean distance is based on the properties of the elements, but not on
    their location in space. Some well-known distances are Jaccard distance, cosine
    distance, edit distance, and Hamming distance.


    Jaccard distance is used to compute the distance between two sets. First, we compute
    the Jaccard similarity of two sets as the size of their intersection divided by
    the size of their union, as follows:


    $$sim(A, B) = \frac{A \cap B}{A \cup B}$$$


    The Jaccard distance is then defined as 1 minus Jaccard similarity, as shown in
    the following:


    $$d(A, B) = 1 - sim(A, B) = 1 - \frac{A \cap B}{A \cup B}$$$


    Cosine distance between two vectors focuses on the orientation and not magnitude,
    therefore, two vectors with the same orientation have cosine similarity 1, while
    two perpendicular vectors have cosine similarity 0. Suppose we have two multidimensional
    points, think of a point as a vector from origin (0,0,...,0) to its location.
    Two vectors make an angle, whose cosine distance is a normalized dot-product of
    the vectors, as follows:


    $$d(A, B) = arccos \frac{Ax B}{||A|| ||B||}$$$


    Cosine distance is commonly used in a high-dimensional feature space; for instance,
    in text mining, where a text document represents an instance, features that correspond
    to different words, and their values corresponds to the number of times the word
    appears in the document. By computing cosine similarity, we can measure how likely
    two documents match in describing similar content.'
  merge: -1
