    Java-ML is also a general-purpose machine learning library. Compared to Weka,
    it offers more consistent interfaces and implementations of recent algorithms
    that are not present in other packages, such as an set of state-of-the-art similarity
    measures and feature-selection techniques, for example, dynamic time warping,
