  md: "Recommendation Engine with Apache Mahout\n\n# # Item-based filtering\n\nItemSimilarity\
    \ is the most important point to discuss here. Item-based recommenders are useful\
    \ as they can take advantage of something very fast: they base their computations\
    \ on item similarity, not user similarity, and item similarity is relatively static.\
    \ It can be precomputed, instead of recomputed in real time.\n\nThus, it's strongly\
    \ recommended that you use GenericItemSimilarity with precomputed similarities\
    \ if you're going to use this class. You can use PearsonCorrelationSimilarity\
    \ too, which computes similarities in real time, but you will probably find this\
    \ painfully slow for large amounts of data:\n\n```\nStringItemFileDataModel model\
    \ = new StringItemFileDataModel(\n    new File(\"datasets/chaps/BX-Book-Ratings.csv\"\
    \n```\n\n```\nItemSimilarity itemSimilarity = new\nPearsonCorrelationSimilarity(model);\n\
    ```\n\n```\nItemBasedRecommender recommender = new\nGenericItemBasedRecommender(model,\
    \ itemSimilarity);\n```\n\n```\nString itemISBN = \"03952722388\"\nlong itemID\
    \ = model.readItemIDFromISBN(itemISBN);\nint noItems = 10;\nList<Recommender>\
    \ recommendations = \nrecommender.mostSimilarItems(itemID, noItems);\n```\n\n\
    Recommendations for item: Close to the Bone\n\nMost similar items:\n\n+   - Item:\
    \ Private Screening | Item id: 0345311396 | Value: 1.0\n- Item: Heartstone Item\
    \ id: 0553569783 | Value: 1.0\n- Item: Clockers / Movie Tie In | Item id: 0380720817\
    \ | Value: 1.0\n- Item: Rules of Prey | Item id: 0425121631 | Value: 1.0\n- Item:\
    \ The Next President | Item id: 0553576666 | Value: 1.0\n- Item: Orchid Beach\
    \ (Holly Barker Novels (Paperback)) | Item id: 0061013412 | Value: 1.0"
