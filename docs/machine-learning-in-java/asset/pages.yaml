  md: '# About the Author


    Boštjan Kaluža, PhD, is a researcher in artificial intelligence and machine learning.
    Boštjan is the chief data scientist at Evolve, a leading Slovenian research analytics
    company, focusing on configuration and change management. He works with machine
    learning, predictive analytics, pattern mining, and anomaly detection to turn
    data into understandable relevant information and actionable insight.


    Prior to Evolve, Boštjan served as a senior researcher in the department of intelligent
    systems at the Jozef Stefan Institute, a leading Slovenian scientific research
    institution, ubiquitous computing, and multi-agent systems. Boštjan was also a
    visiting researcher at the University of Southern California, where he studied
    suspicious and anomalous agent behavior in the context of security applications.
    Boštjan has extensive experience in Java and Python, and he also lectures on Weka
    in the classroom.


    Focusing on machine learning and data science, Boštjan has published numerous
    articles in professional journals, delivered conference papers, and authored or
    contributed to a number of patents. In 2013, Boštjan published his first book
    on data science, Instant Weka How-to, Packt Publishing, exploring how to leverage
    machine learning using Weka. Learn more about him at http://bostjankaluza.net.'
