    # Supervised learning


    Supervised learning is the key concept behind amazing things such as voice recognition,
    e-mail spam filtering, face recognition in photos, and detecting credit card frauds.
    Formally, given a set D of learning examples described with features, X, the goal
    of supervised learning is to find a function that predicts a target variable,
    Y. The function f describes the relation between features X and class Y is called
    a model:


    $f(X'') \rightarrow Y$


    The general structure of supervised learning algorithms is defined by the following
    decisions (Hand et al., 2001):


    +   1. Define the task.

    2. Decide on the machine learning algorithm, which introduces specific inductive
    bias, that, a priori assumptions that it makes regarding the target concept.

    3. Decide on the **score** or **cost** function, for instance, information gain,
    root mean square error, and so on.

    4. Decide on the optimization/search method to optimize the score function.

    5. Find a function that describes the relation between X and Y.


    Many decisions are already made for us by the type of task and dataset that we
    have. In the following sections, we will take a closer look at the classification
    and regression methods and the corresponding score functions.


    # Classification


    Classification can be applied when we deal with a discrete class, and the goal
    is to predict one of the mutually-exclusive values in the target variable. An
    example would be credit scoring, where the final prediction is whether the person
    is credit liable or not. The most popular algorithms include decision tree, naïve
    Bayes classifier, support vector machines, neural networks, and ensemble methods.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Decision tree learning


    Decision tree learning builds a classification tree, where each node corresponds
    to one of the attributes, edges correspond to a possible value (or intervals)
    of the attribute from which the node originates, and each leaf corresponds to
    a class label.

    A decision tree can be used to visually and explicitly represent the prediction
    model, which makes it a very transparent (white box) classifier. Notable algorithms
    are ID3 and C4.5, although many alternative implementations and improvements (for
    J48 in Weka) exist.


    # Probabilistic classifiers


    Given a set of attribute values, a probabilistic classifier is able to predict
    distribution over a set of classes, rather than an exact class. This can be used
    as a degree of certainty, that is, how sure the classifier is. The most basic
    classifier is naive Bayes, which is the optimal classifier if, and only if, the
    attributes are conditionally independent. Unfortunately, this is rarely in practice.


    There is an enormous subfield denoted as probabilistic models, comprising hundreds
    of algorithms; for example, Bayesian network, dynamic Bayesian networks, hidden
    Markov models, and conditional random fields that can handle only specific relationships
    between attributes, but also temporal dependencies. Karkera (2014) wrote an excellent
    introductory book on this topic, Building Probabilistic Graphical Models with
    Python, while Koller and Friedman (2009) published a comprehensive theory book,
    Probabilistic Graphical Models.


    # Kernel methods


    Any linear model can be turned into a non-linear model by applying the kernel
    trick to the model – replacing its features (predictors) by a kernel function.
    In other words, the kernel implicitly transforms our dataset into higher dimensions.
    The kernel trick leverages the fact that it is easier to separate the instances
    in more dimensions. Algorithms capable of operating with kernels include the kernel
    perceptron, Support Vector Machines (SVM), Gaussian processes, PCA, canonical
    correlation analysis, ridge regression, spectral clustering, linear adaptive filters,
    and many others.


    # Artificial neural networks


    Artificial neural networks are inspired by the structure of biological neural
    networks and are capable of machine learning, as well as pattern recognition.
    They are commonly used for both regression and classification problems, comprising
    a wide variety of algorithms and variations for all manner of problem type. Some
    popular classification methods are perceptron, restricted Boltzmann machine (RBM),
    and deep belief networks.'
  merge: -1
