    # Model selection


    Over the years, practitioners in the field of machine learning have developed
    a wide variety of learning algorithms and improvements to the existing ones. There
    are so many unique supervised learning methods that it is challenging to keep
    track of all the cases. As characteristics of the datasets vary, no one method
    is the best in all the cases, but different algorithms are able to take advantage
    of different characteristics and relationships of a given dataset. The property
    Ensemble-Selection algorithm is to try to leverage (Jung, 2006).


    Intuitively, the goal of ensemble selection algorithm is to automatically detect
    and combine the strengths of these unique algorithms to create a sum that is greater
    than the parts. This is accomplished by creating a library that is intended to
    be as diverse as possible to capitalize on a large number of unique learning approaches.
    This paradigm of overproducing a huge number of models is very different from
    traditional ensemble approaches. Thus far, our results have been very encouraging.


    ```

    EnsembleLibrary ensembleLib = new EnsembleLibrary();

    ```


    Next, we add the models and their parameters as strings to the library as string
    values, we can add three decision tree learners with different parameters, as
    follows:


    ```

    ensembleLib.addModel("weka.classifiers.trees.J48 -S -C 0.25 -B -M 2*");

    ensembleLib.addModel("weka.classifiers.trees.J48 -S -C 0.25 -B -M 2-A*"

    ```'
