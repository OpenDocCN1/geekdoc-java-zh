  md: 'In the following sections, we will first load the data into Weka and apply
    basic modeling with the naive Bayes to obtain our own baseline AUC scores. Later,
    we will look into more advanced modeling techniques and tricks.


    # Loading the data


    We will load the data to Weka directly from the .csv format. For this purpose,
    we will write a function that accepts the path to the data file and the true labels
    file. The function will load merge both datasets and remove empty attributes:


    ```

    public static Instances loadData(String pathData, String

    pathLabels) throws Exception {

    ```


    First, we load the data using the CSVLoader() class. Additionally, we specify
    the \t as a field separator and force the last 40 attributes to be parsed as nominal:


    ```

    // Load data

    CSVLoader loader = new CSVLoader();

    loader.setFieldSeparator("t");

    loader.setNominalAttributes("191-last");

    loader.setSource(new File(pathData));

    Instances data = loader.getDataSet();

    ```


    > The class accepts many additional parameters

    specifying column separator, string enclosures,

    a header row is present or not, and so on. Complete

    documentation is available here:


    http://weka.sourceforge.net/doc/weka/weka/

    converters/CSVLoader.html


    Next, some of the attributes do not contain a single value and Weka automatically

    recognizes them as the String attributes. We do not need them, so we can

    safely remove them using the RemoveType filter. Additionally, we specify the -T

    parameters, which remove attribute of specific type and the attribute type that

    we to remove:


    ```

    // remove empty attributes identified as String attribute

    RemoveType removeString = new RemoveType();

    removeString.setOptions(new String[]{"-T", "string"});

    removeString.setInputFormat(data);

    Instances filteredData = Filter.useFilter(data, removeString);

    ```


    Alternatively, we could use the deleteStringAttributes() method

    implemented within the Instances class, which has the same effect, for example,

    data.removeStringAttributes().'
