  md: '# # Recommendation Engine with Apache Mahout


    Recommendation engines are probably one of the most applied data science approaches
    in startups today. There are two principal techniques for building a recommendation
    system: **content-based filtering** and **collaborative filtering**. The content-based
    filtering algorithms use the properties of the items to find items with similar
    properties. Collaborative filtering algorithms take user ratings or other user
    behavior and make recommendations based on what users with similar behavior liked
    or purchased.


    This chapter will first explain the basic concepts required to understand recommendation
    engine principles and then demonstrate how to utilize Apache Mahout''s implementation
    of various algorithms to quickly get a scalable recommendation engine. This chapter
    will cover the following topics:


    +   - How to build a recommendation engine

    - Getting Apache Mahout ready

    - Content-based approach

    - Collaborative filtering approach


    By the end of the chapter, you will learn the kind of recommendation engine that
    is appropriate for our problem and how to quickly implement one.


    # ## Basic concepts


    Recommendation engines aim to show user items of interest. What makes them different
    from search engines is that the relevant content usually appears on a website
    without requesting it and users don''t have to build queries as recommendation
    engines observe user''s actions and construct query for users without their knowledge.'
  merge: -1
