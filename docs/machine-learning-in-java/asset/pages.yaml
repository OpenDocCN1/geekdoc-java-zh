    - Other users who are similar to you...


    Now let''s have a closer look at how this combining works.


    # # User-based and item-based analysis


    Building a recommendation engine depends on whether the engine searches for related
    items or users when trying to recommend a particular item.


    In item-based analysis, the engine focuses on identifying items that are similar
    to a particular item; while in user-based analysis, users similar to the particular
    user are first determined. For example, users with the same profile information
    (age, gender, and so on) or actions history (bought, watched, viewed, and so on)
    are determined and then the same items are recommended to other users.


    Both approaches require us to compute a similarity matrix, depending on whether
    we''re analyzing item attributes or user actions. Let''s take a deeper look at
    how this is done.


    # # Approaches to calculate similarity


    There are three fundamental approaches to calculate similarity, as follows:


    +   - Collaborative filtering algorithms take user ratings or other user behavior
    and make recommendations based on what users with similar behavior liked or purchased

    - The content-based algorithm uses the properties of the items to find items with
    similar properties

    - A hybrid approach combining collaborative and content-based filtering


    Let''s take a look at each approach in detail.


    # # Collaborative filtering


    Collaborative filtering is based solely on user ratings or other user behavior,
    making recommendations based on what users with similar behavior liked or purchased.


    A key advantage of collaborative filtering is that it does not rely on item content,
    and therefore, it is capable of accurately recommending complex items as movies,
    without understanding the item itself. The underlying assumption is that people
    who agreed in the past will agree in the future, and that they will like similar
    kinds of items as they liked in the past.'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'A major disadvantage of this approach is the so-called cold start, meaning
    that if we want to build an accurate collaborative filtering system, the algorithm
    often needs a large amount of user ratings. This usually takes collaborative filtering
    out of the first version of the product and it is introduced later when a decent
    amount of data is collected.


    # Content-based filtering


    Content-based filtering, on the other hand, is based on a description of items
    and a profile of user''s preferences combined as follows. First, the items are
    described with attributes, and to find similar items, we measure the distance
    between items using a distance measure such as **cosine distance** or **Pearson
    coefficient** (more about distance measures is in *Chapter 1, Applied Machine
    Learning Quick Start*). Now, the user profile enters the question. Given the feedback
    about the kind of items the user likes, we can introduce weights specifying the
    importance of a specific item attribute. For instance, Pandora streaming service
    applies content-based filtering to create stations using more than 400 attributes.
    A user initially picks a song with specific attributes, and by providing feedback,
    important song attributes are emphasized.


    This approach needs very little information on user feedback, thus it effectively
    avoids the cold-start issue.


    # Hybrid approach


    Now collaborative versus content-based to choose? Collaborative filtering is able
    to learn user preferences from user''s actions regarding one content source and
    use them across other content types. Content-based filtering is limited to recommending
    content of the same type that the user is already using. This provides value to
    different use cases, for example, recommending news articles based on news browsing
    is useful, but it is much more useful if different sources such as books and movies
    can be recommended based on news browsing.


    Collaborative filtering and content-based filtering are not mutually exclusive;
    they can be combined to be more effective in some cases. For example, **Netflix**
    uses collaborative filtering to analyze searching and watching patterns of similar
    users, as well as content-based filtering to offer movies that share characteristics
    with films that the user has rated highly.'
