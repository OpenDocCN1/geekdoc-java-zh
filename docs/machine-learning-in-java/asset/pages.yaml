  md: "# Chapter 7\n\nNow the task is to create a model that will be able to identify\
    \ suspicious claims in future. The challenging thing about this task is the fact\
    \ that only 6% of claims are suspicious. If we create a dummy classifier saying\
    \ no claim is suspicious, it will be accurate in 94% cases. Therefore, in this\
    \ task, we will use different accuracy measures: precision and recall.\n\nRecall\
    \ the outcome table from Chapter 1, Applied Machine Learning Quick Start, where\
    \ there are four possible outcomes denoted as true positive, false positive, false\
    \ negative, and true negative.\n\n| | Classified as |\n|---|---|\n| Actual | No\
    \ fraud |\n| Fraud | TP – true positive | FN – false negative |\n| No fraud |\
    \ FP – false positive | TN – true negative |\n\nPrecision and recall are defined\
    \ as:\n\n+   - Precision is equal to the proportion of correctly raised alarms,\
    \ as follows:\n  $$Pr \\equiv \\frac{TP}{TP + FP}$$\n- Recall is equal to the\
    \ proportion of deviant signatures, which are correctly identified as such:\n\
    \  $$Re = \\frac{TP}{TP + FN}$$\n- With these measures, our dummy classifier scores\
    \ $Pr=0$ and $Re=0$ as it never marks any instance as fraud (TP=0). In practice,\
    \ we want to compare classifiers by both numbers, hence we use $F$-measure. This\
    \ is a de-facto measure mean between precision and recall, as follows:\n  $$F\
    \ - measure = \\frac{2 * Pr * Re}{Pr + Re}$$\n\nNow let's move on to designing\
    \ a real classifier."
