- img_proc: true
  md: '# Mean squared error


    Mean squared error is an average of the squared difference between the predicted
    and true values, as follows:


    ```

    $MSE(X,Y) = \frac{1}{n}\sum_{i=1}^{n}(f(X_i)-Y_i)^2$

    ```


    The measure is very sensitive to the outliers, for example, 99 exact predictions
    and one predict off by 10 is scored the same as all predictions wrong by 1. Moreover,
    the measure is sensitive to the mean. Therefore, relative squared error, which
    compares the MSE of our predictor to the MSE of the mean predictor (which always
    predicts the mean value) is often used instead.


    # Mean absolute error


    Mean absolute error is an average of the absolute difference between the predicted
    and true values, as follows:


    ```

    $MAS(X,Y) = \frac{1}{n}\sum_{i=1}^{n}|f(X_i)-Y_i|$

    ```


    The MAS is less sensitive to the outliers, but it is also sensitive to the mean
    and scale.


    # Correlation coefficient


    Correlation coefficient compares the average of prediction relative to the mean
    multiplied by training values relative to the mean. If the number is negative,
    it means weak correlation, positive number means strong correlation, and zero
    means no correlation. The correlation between true values X and predictions Y
    is defined as follows:


    ```

    $CC_{XY} = \frac{\sum_{i=1}^{n}(X_i-\bar{X})(Y_i-\bar{Y})}{\sqrt{\sum_{i=1}^{n}(X_i-\bar{X})^2}\sqrt{\sum_{i=1}^{n}(Y_i-\bar{Y})^2}}$

    ```


    The CC measure is completely insensitive to the mean and scale, and less sensitive
    to the outliers. It is able to capture the relative ordering, which makes it useful
    to rank the tasks such as document relevance and gene expression.'
  merge: -1
