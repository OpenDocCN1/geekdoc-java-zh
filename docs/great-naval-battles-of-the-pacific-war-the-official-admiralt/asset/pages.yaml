    # 9. Preparations at Midway


    Measures were taken to strengthen Midway to the maximum extent possible.


    The problem at Midway for the Americans was to hit the enemy before they were
    hit. The danger against which they had to guard was that their aircraft might
    be surprised on the ground and destroyed, and their runways put temporarily out
    of action by bombing the enemy was damaged. There were two essential requirements
    to prevent this: effective search and long-range striking power.


    For long-range 30 Navy patrol bombers (Catalinas) were sent to the island and
    long range strikes 17 B17s of the Seventh Air Force and Army B26s fitted with
    torpedoes were sent to Midway from Hawaii, in spite of the difficulty of protecting
    these aircraft on the ground. Major-General C. L. Tinker, US Army, Commander of
    the Air Force in Hawaii, himself came to the scene of action. To provide close-in
    air striking the marine air group was brought up to a strength of 28 fighters
    and 34 scout bombers, though only 30 pilots were available for the latter type.
    This group was augmented by six new Navy torpedo bombers. Because of overcrowding
    of the facilities at Midway were considerable interchange between island and Hawaii,
    so that the number of aircraft available from day to day. The figures given above
    were for 3 June. The radio and communication personnel at Midway were reinforced
    for the control of the additional aircraft.


    All Navy and Army aircraft were sent to Midway and B17s of the 7th Bomber Command
    whose duties involved landing on or basing aircraft at Midway, operated under
    the control of the Commanding Officer, Naval Air Station, Midway, Captain C. T.
    Simard; but there was no co-ordinating authority for the operations of the aircraft
    based at Midway and those of the US carriers respectively; moreover, the carriers
    normally operated under conditions of radio silence.


    In the belief that the Japanese planned a rendezvous around 700 miles west of
    Midway B17s flew to a distance of 800 miles on 31 June, and on the 2nd B17 without
    bombs searched 800 miles to the west without making any contacts. From May 30
    to 3 June Catalinas searched 700 miles from bearing 200 degrees to 020 degrees.
