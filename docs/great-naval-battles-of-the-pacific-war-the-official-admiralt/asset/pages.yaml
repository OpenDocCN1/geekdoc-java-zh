    enemy main body (Centre Force) which had traversed Mindoro Strait in the dark
    and was now in the Tablas Strait east of Mindoro, in position 12° N, 121° E.,
    proceeding at 18 knots on a course 015° which would eventually take them to San
    Bernardino Strait. The force was two groups of almost similar composition. The
    first was reported as battleships, three or four heavy cruisers and six destroyers;
    the second as two battleships, three or four heavy cruisers and seven destroyers.

