    # 9. Third air strike launched at Tulagi, 1310 4 May


    Before sending the third air strike to Tulagi, the Yorktown at 1300 launched four
    fighters to destroy enemy seaplanes which had attacked bombers and reconnaissance
    aircraft engaged in the second strike. Three of the fighters were encountered
    and shot down, and a destroyer Kiyokawa Maru''s fighters away from Tulagi was
    strafed. Two of the American fighters became lost and were forced to land on the
    south coast of Guadalcanal Island, while the destroyer Hammann with difficulty
    rescued the pilots that night. All attempts to set fire to the two aircraft failed
    and the Americans had to be content with destroying papers and secret equipment.


