    65. Sinking of the Suzuya, 25 October


    After abandoning the chase of the Seventh escort fleet carriers off Samar Vice-Admiral
    Kurita spent some hours in assembling his ships, appreciating the situation including
    fuel, and preparing for action in the Gulf. For the next two days he was to be
    subjected during daylight to constant air attacks by the Third and Seventh Fleets
    and Army aircraft, and to submarine attack, losing two heavy cruisers, two light
    cruisers and four destroyers, though his fleet was saved from complete destruction
    through the inability of Admiral Halsey''s fast battleships to come up with it
    after their return south, on the morning of 25th, from supporting the Third Fleet
    carriers in their attacks on the enemy Northern Force.


    Rear-Admiral Stump continued his attacks, launching his third strike at 0935.
    The Haruna, who had been ordered to attack him, was too close for risk turning
    into the wind which was now from 049°, 7 knots, but he successfully launched his
    strike, 12 torpedo aircraft, one with a torpedo, with the remainder with 500-181.
    SAP bombs each, and two fighters, without casualty, whilst holding to his course
    of 120°. The strike immediately threw its weight against the enemy and reported
    three bomb hits on the previously two-torpedo cruisers. One of these was sighted
    with destroyers attending her, by survivors of the Gambier Bay whilst in the water,
    and by an aircraft from the Kitty Bay, after being launched at 0700 landed about
    1000 on board the Manila Bay and was launched again about an hour after refueling
    and reloading. At this time, the enemy cruiser had a bad list to port and her
    main deck awash, and a destroyer was picking up survivors.


    A fourth Japanese heavy cruiser, Suzuya, was also in trouble. Her movements from
    the time she left the formation at 0745, to stand by the torpedoed Kumano, are
    unknown, but she was damaged, apparently by air attack, and sank early in the
    afternoon when the fire board out of control and exploded her torpedoes.'
