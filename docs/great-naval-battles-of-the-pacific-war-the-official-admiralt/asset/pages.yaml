    # 24. The attack opens


    At 1112–1113 the Japanese torpedo aircraft were sighted 15 miles off, approaching
    in a fast power glide from about 5,000 feet from the port beam. Some ships opened
    fire on, but many were slow in starting, and throughout the earlier part of the
    action at least, AA fire particularly the 5-inch, was extremely erratic and relatively
    ineffective. There was no arrangement for control, co-ordinated of the screen
    ships'' anti-aircraft batteries.


    The attack began out of range of any guns smaller than 5-inch, and it was reported
    that in the course of the action gunfire destroyed at least 17 of the enemy, most
    of them were apparently shot down after releasing torpedo or bomb, though American
    doctrine laid stress on the necessity of destruction before release. The American
    AA armament consisted of 20 mm and 1.1-inch guns. The former were not effective
    at ranges greater than 1,000 yards, which was insufficient against torpedo attacks
    and just barely effective against dive bombers. As regards the 1.1-inch gun, there
    was a lack of destructors, and the rate of training with the guns they fitted
    was slow, and during the early stages of the action there was a tendency to give
    insufficient lead and shoot under the target. The Americans at this date did not
    possess an automatic lead computer, in fact the problem of AA protection had not
    advanced very far. The Chester estimated that 30 per cent.'
