    While Task Force 16 was endeavour to follow the successes of 4 June, 400 miles
    to the eastward the stricken Yorktown was making little progress. Prematurely
    abandoned³ the afternoon of 4 June, she continued to float during the night of
    4th-5th whilst the Hughes stood by her. On the morning of the 5th the destroyer
    rescued two men who had been overlooked when the ship was abandoned, and also
    picked up a fighter pilot, shot down in action, who rowed up in his rubber boat.


    The minesweeper Vire and fleet tugs Seminole and Navajo had been dispatched to
    assist⁴ The Vire from Pearl Harbor Reef arrived noon on the 5th and at 1436 began
