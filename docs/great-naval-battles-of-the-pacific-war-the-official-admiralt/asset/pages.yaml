  md: '# Chapter I


    # Organization of the Allied and Enemy Forces


    1. Situation in the Autumn, 1944


    In the autumn of 1944, the advance of the Allies in the Pacific had brought

    them to a line on which they stood over against the Philippine Islands, the pivot

    on which they planned to wheel northward and attack the Japanese mainland.

    In the south-west, General MacArthur''s Allied troops and ships, fighting

    the way northward from Australian and New Caledonian bases to Morotai

    in the Moluccas gained possession of points from which amphibious forces

    could the Philippines. Further north, in the wide spaces of the Pacific,

    Admiral Nimitz''s great striding westward, storming or by-passing one

    after another enemy strongholds in the Gilberts, Marshalls, Marianas and

    Guam, reached, in September, 1944, the airfields of the West Carolines, and

    anchorage where his supporting ships could find replenishment and shelter.


    No breathing space was given to the enemy. From the support of the

    landings in the West Carolines, the fast carriers of the Third Fleet returned
    to

    the Philippines. Consequent upon the revelation of the enemy''s comparative

    weakness in the air during strikes early in September, an immediate decision

    had been made to advance by some weeks the date of the assault on

    the Philippines, and a landing on Leyte Island was planned for 20th October.


    On 21-22 September, under cover of bad weather the carriers entered the

    waters to the eastward of Luzon and attacked Manila and other targets.

    Two days later the aircraft were were in the Central Philippines, completing

    photographic coverage and reaching out as far as the Japanese anchorage at

    Koron [Coron] Bay in the Kalamian group. After a short period spent in

    replenishing at forward bases, the fast-carrier task force commenced on

    9 October the task of neutralizing as far as possible the hundred or more

    enemy aircraft within striking distance of Leyte. These aircraft were too

    umerous to be effectively neutralized, and too close to Formosa and Japan

    to be cut off. Nevertheless, the preliminary operations apparently had the

    effect of enabling the landings on Leyte to be made without difficulty by

    the American troops. On 20 October the operation for the recapture of the

    Philippines began.'
