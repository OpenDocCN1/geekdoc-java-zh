    Vice-Admiral Kurita with the Japanese Second Fleet had pursued his way to San
    Bernardino Strait undeterred by his losses during the day-long air attacks of
    the 24th by the Third Fleet fast carriers, and indeed, had come through well considering
    his total lack of air cover.


