    # ## Pursuit of the Enemy, 5 June


    **40. Movements of the U.S. force, night 4–5 June


    When the six B17s under Major Blakey landed at Midway at sunset on 4 June the
    situation was by no means clear. Information as to the strength and position of
    the Japanese forces in the bad weather area to the northward was incomplete. The
    Fortresses had encountered several Japanese fighters, and although these might
    have been been, and actually were, the protective cover left in the air by the
    *Hiryu* when she was attached, the possibility of a fifth Japanese carrier in
    the area could not be disregarded. A fifth, the light carrier *Zuibo*, did in
    fact take part in the Midway operation, but was never sighted; she was detached
    from the Aleutian screening force which had not yet rejoined the main body. There
    was every indication that the enemy was certain that the loss of air support would
    determine him from the landing on Midway which was the concern of Task Forces
    17 and 16 to prevent. Battleships had been reported with the enemy force, and
    the latter might be superior to Task Force 16 which was now operating independently
    of Task Force 17 and was the only American force remaining in the area.


    Rear-Admiral Fletcher with Task Force 17, after leaving the destroyer *Hughes*
    moved off off the abandoned Yorktown, eastward *Pensacola* and *Vincennes* to
    re-join Rear-Admiral Spruance. His intention was to transfer the survivors from
    the destroyers to the cruiser *Portland*, which would then proceed to Pearl Harbor,
    whilst the *Astoria* and destroyers would return next morning to salvage the Yorktown.
    These plans were modified by a message from Admiral Nimitz that the submarine
    tender *Fulton* had been dispatched to take the survivors. Captain Buckmaster
