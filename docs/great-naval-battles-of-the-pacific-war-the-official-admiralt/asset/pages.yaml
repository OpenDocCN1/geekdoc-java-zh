    # 28. Japanese plan abandoned


    The Battle of the Coral Sea was the first set-back suffered by the Japanese since
    the raid on Pearl Harbor. And this set-back can be attributed directly to the
    escape of the carriers which were at sea when the raid took place. The outcome
    of the battle completely disorganized the Port Moresby expedition. One carrier
    was sunk, and one was put out of action and had to withdraw to Kure for repairs,
    heavy losses had been incurred by both carrier- and land-based groups, and there
    was a shortage of fuel for aircraft on board the Zuikaku, the only remaining operational
    capable of fulfilling its function, and although the approaches to Port Moresby
    now lay open, the invasion force retired and the date of the projected operation
    was postponed until July. In June, however, the door to expansion shut by the
    Allies at the Battle of the Coral Sea, was finally'
