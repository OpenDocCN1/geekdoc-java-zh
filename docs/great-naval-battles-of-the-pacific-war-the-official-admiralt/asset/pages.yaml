  md: '# US Reinforcement of Guadalcanal, 14–18 September


    Meanwhile, the second Japanese attempt on Guadalcanal had been launched and repulsed.
    On this occasion the plan was to capture Henderson''s Field by land forces, which
    had been built up by infiltration, after which large reinforcements were to be
    landed to the Americans into the sea. A heavily escorted convoy of transports
    to sea and lay off to the northward outside bombing range, ready to land after
    the capture of the airfield. The assault on Henderson''s Field commenced on the
    day of 13/14 September, and after heavy fighting was defeated by the US Marines.
    The convoy thereupon withdrew to the northward.


    The losses suffered by the American carrier forces on the 15th September, left
    Rear-Admiral Turner''s convoy in an awkward position. The general situation on
    leaving Espiritu Santo on the 14th had been far from reassuring. There was a considerable
    enemy concentration at Faisi; almost raids by surface forces were taking place
    on Guadalcanal, and the strength of enemy air attacks had increased; another strong
    effort to recapture the island was about to take place.


    It was particularly important that the convoy should not be detected, in addition
    to the air menace, strong enemy surface forces were known to be the north-west,
    north and north-east of Guadalcanal, all within less than one day''s sailing.
    The route chosen was San Cristobal and thence through Indispensable Strait and
    Lengo Channel. In approaching San Cristobal, the force kept well to the eastward
    in spite of the submarines giving the best chance of evading enemy air reconnaissance.


    The reports which on the 14th and 15th were not encouraging, and at 1100, the
    convoy was located and shadowed for an hour by a 4-engined bomber. Since the troops
    were the only reinforcements in the South Pacific which could be available for
    some weeks, Rear-Admiral Turner considered that he was not justified in risking
    an attack by strong surface force during disembarkation and decided to withdraw
    temporarily to await a more favourable opportunity. In the hope of drawing the
    Japanese surface forces within reach of the US shore-aircraft, he held his course
    till after, and then sending one transport (the Zane) on orders to signal by wireless
    during the night a report of his change of plan, altered course to the south-eastward.


    That night (15/16) enemy cruisers and destroyers landed troops in Guadalcanal.
    On the 16th the picture was not clear to Rear-Admiral Turner, but the failure
    of the enemy to make his expected large-scale landing or other attacks on the
    island induced him to turn to the northward towards the eastern'
