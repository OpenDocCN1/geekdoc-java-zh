  md: '# Great Naval Battles of the Pacific War


    Leyte, the land-based naval aircraft in the Philippines, consisting of the First
    (Navy) Air Fleet, commanded by Vice-Admiral Onishi, had been reduced much below
    establishment as the result of American attacks; for October, 1944, alone the
    Japanese lost from air strikes approximately as many aircraft as broke the German
    Air Force during the two months of the Battle of Britain in the late summer of
    1940. Most of the (Navy) Air Fleet at Formosa, under Vice-Admiral Shigeru Fukudome,
    was in consequence moved to the Philippines on 22 October and the two air fleets
    were united to form the Combined Base Air Force. All naval air forces in the Philippines
    were placed under the command of the Commander-in-Chief South-west Area Fleet,
    Vice-Admiral Mikawa.


    During the summer, 1944, army air units had been subordinated to naval command
    in Hokkaido and in the Hainan-Formosa area, while no unified air command was established
    in the Philippines. The majority of the 450 aircraft of the Second Air Fleet flew
    from Formosa to Clark Field, near Manila, on 23 October. They apparently had orders
    to attack the American fast carriers on the way; but failed to find them on bad
    weather. In all, about 600 shore-based Japanese aircraft were available in the
    Philippines.


    The operation had a limited object, namely, to delay the American landing for
    two or three days. There appears to have no plan to exploit this delay, and indeed
    no great expectation of success; but to the Japanese with their inferiority in
    ships and aircraft it seemed to offer the best hope. In particular, it was understood
    from the beginning, before the plan was put into operation, that they had insufficient
    aircraft; and this was perhaps one of the basic causes of failure.


    The Japanese apparently received warning from their shore observers on the same
    day, 17 October, that the Americans landed on Dinagat Island, at the entrance
    to Leyte Gulf, in preparation for the main landing on Leyte Island. The Japanese
    fleet then set in motion. Vice-Admiral Kurita moved with the Second Fleet to Brunei
    Bay where he arrived on 21 October and issued his orders. After fueling, the fleet
    sailed on 22nd in two detachments, making a wide swing to the north-west of Brunei,
    to avoid suspected submarine areas. The Centre Force, under Kurita, first left
    about 0800, and proceeded over the Palawan Passage, whilst Nishimura sailed in
    the afternoon and steamed through the Balakab Strait into the Sulu Sea, where
    he made a considerable diversion to the northward, in order to avoid air search
    from Morotai, before making for the Mindanao Sea and Surigao Strait.


    > 16. It is stated that the Japanese on the 18th intercepted an American telephone
    message from which they learnt that landing was to be made of Tacloban on Leyte
    Island.'
