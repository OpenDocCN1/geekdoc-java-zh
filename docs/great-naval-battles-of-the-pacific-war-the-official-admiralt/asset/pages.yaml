    # 45. British destroyers attack, 1725


    It just about 1725 that Rear-Admiral Doorman signalled, ''British destroyers counter-attack'',
    whereupon the Electra ordered the Jupiter and the Encounter to follow. Circumstances
    were not favourable for the smoke still very thick, and visibility over the battle
    area was not more than a mile. Moreover, the three British destroyers were too
    far apart to make a divisional attack, the Electra and the Encounter attacked
    independently. The Encounter attacked through a clearing in the smoke; whether
    she fired torpedoes, or with what result, is not known. The Jupiter, finding no
    suitable target for torpedoes, remained in the vicinity of the Exeter and drove
    off by gunfire two destroyers who came out of the smoke with the intention of
    making a torpedo attack on the Exeter. When the Encounter retired from her attack,
    she was ordered stern of the Jupiter, and both destroyers remained ahead of the
    Exeter as a covering force.¹16


