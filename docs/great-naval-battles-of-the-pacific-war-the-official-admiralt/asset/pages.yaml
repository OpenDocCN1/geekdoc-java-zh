    that the (foremost) guns only could be fired and the enemy... [was] crossing the
    T, had to be accepted. Undoubtedly the Japanese could have prevented a shortening
    of [the] distance by turning off, but this would have been disadvantageous to
    their own firing. Furthermore, the battle area would have been moving towards
    the north, i.e. towards the convoy which would have been favourable to the Allies


    “In opinion, there was still another way, considering the event in the light of
    what actually happened, i.e., to split the formation into one group of heavy cruisers
    (Exeter and Houston) and a second group consisting of the three light cruisers.
    Whilst turning off to port, the heavy cruisers could have kept the Japanese cruisers
    engaged on a westerly course. Meanwhile the light cruisers could have tried to
    reach the convoy by steering northwards, staying out of the gun range of the Japanese
    cruisers. Then they would have found against only two light Japanese guns which
    were considerably inferior (22 6-in [Allied] guns against 5-5-in. [Japanese] guns).
