    # 41. The Centre Force Transits San Bernardino Strait, Night, 24–25 October


    Vice-Admiral Kurita sent six hours behind schedule. It had been arranged that
    his force should come through San Bernardino Strait at 1800 on the 24th owing
    to the delay caused by the Third Fleet air attacks in the Sibuyan Sea he was not
    out until midnight. The distance to Leyte Gulf was about 180 miles, so that unless
    he abandoned all consideration of fuel economy he was to be behind time. Vice-Admiral
    Nishimura who was up to time, reported his estimate of arrival at Leyte Gulf after
    midnight 24th/25th, whilst proceeding into Surigao Strait. However, Vice-Admiral
    Kurita sent no order to delay his advance, nor did Admiral Yoda any change in
    the plan. It was a clear night, and the Second Fleet navigated the narrow places
    in the channel in column at 20 knots. The ships were at action stations as they
    issued from the Straits, expecting to fight their way out against Admiral Halsey''s
    Force. They found no enemy, and consequently turned according to plan.


    # 42. Count with the Enemy, 0645 25 October


    In both the fast and escort task forces of the American fleet, the practice of
    conducting dawn and short range air searches had gradually fallen into으며, greater
    reliance being placed upon shore-based searches and intelligence from other sources
    to provide vital strategic information, and radar to prevent tactical surprise.
    On this particular morning, the Commander Seventh Fleet ordered Task Group 77.4
    to conduct a dawn search for enemy ships between 340° and 330'' for135 miles from
    Solomon Island. This would have disclosed the Japanese Centre Force. But although
    sunrise was at 0627 and the search aircraft had been launched by the Ommaney Bay
    (Task 7.2) which had not departed by 0645. The Leyte sub-marine patrol of two
    torpedo aircraft, and the local combat air patrols and sub-marine patrols had
    all been launched by Rear-Admiral C.A.F. Sprague''s Task Unit (77.4,3); and to
    the southward, Task Units 77.2 and 77.4 had launched similar patrols and missions.


