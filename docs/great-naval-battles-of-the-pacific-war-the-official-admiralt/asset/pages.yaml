    # 37. Sinking of the Mogami


    The surface engagement was now at an end, and out of Vice-Admiral Nishimura''s
    fleet there remained afloat only the heavy cruiser *Mogami*, and the destroyer
    *Shiguru*; the latter was making good her escape, in default of orders, having
    appeared that the remainder of the force had been destroyed.


    The *Mogami* was in a bad way. She had come unscathed the American destroyer attacks
    but had been badly hit by gunfire. About 0410 the *Shiguru*, retiring the Strait
    at 30 knots, sighted her on a westerly course, on fire and moving very slowly.
    The Fifth Fleet was now coming up the Strait towards the smoke screen, extending
    across the Strait from east to west the Allied ships. As the ships of the Fifth
    Fleet turned to after firing torpedoes, the heavy cruiser *Nachi*, Vice-Admiral
    Shima''s flagship, collided with the *Mogami*, which was not under control and
    was moving so slowly (about eight knots) that it was thought she was stopped.
    A destroyer — believed to be the *Akeono* — was detailed to escort her and she
    apparently reached a position in the Mindanao Sea, to the south of Kamigin Island;
    but at 0500 that she was hit by a bomb in the second of two air attacks directed
    at the surviving ships of the Japanese Southern Force. Damage to the ship was
    very severe and it was decided to abandon her, and she sank about an hour later.


    # 38. The Fifth Fleet. Sinking of the Abukuma, 26 October


    While these important events were occurring, Vice-Admiral Shima, commanding the
    Fifth Fleet, had been doing his best to carry out his mission, which apparently
    appeared to attack the invasion forces in Leyte Gulf during the confusion that
    it hoped would result from the attacks by Kurita''s and Nishimura''s forces. His
    orders appear to have been vague, and he was neither responsible to Vice-Admiral
    Kurita, nor was Vice-Admiral Nishimura — his junior in the service — answerable
    to both although his force and Nishimura''s were due to arrive at the same place
    at approximately the same time and on identical missions. On his way from Bako
    to Koron, north-west of Lingayen had sent an aircraft to Manila to get information
    of the movements of Kurita''s and Nishimura''s forces, but before its return he
    received information from Vice-Admiral Kurita''s fleet by radio.'
