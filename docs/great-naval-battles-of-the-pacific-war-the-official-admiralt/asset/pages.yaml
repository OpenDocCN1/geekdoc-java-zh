  md: '# Great Naval Battles of the Pacific War


    Rear-Admiral Fletcher continued to the north-westward during the night 2nd-3rd
    May and topped up his destroyers from the Neosho next day; it was his consistent
    practice to top up his light craft from tankers, cruisers or carriers whenever
    they could reach 70 tons. He intended to fuel the remainder of the ships after
    effect concentration with Task Forces 11 and 44. The latter consisted of the Australian
    Squadron reinforced by the cruiser Chicago and two US destroyers. Before this
    could take place, however, news came in which completely altered the situation.


    # 6. Japanese occupy Tulagi, 2 May


    On 30 April the Japanese occupation force with its escort of six cruisers, the
    light carrier Shobo, and a screen of destroyers and submarines, sailed from Raoul
    to the southward. Part of the expedition was sighted by aircraft of South-west
    Pacific Forces at 1700 on 2 May off the southern end of Santa Isabel Island. This
    strategically important point in the South Solomon, from which the main line of
    communications from the USA to Australia and New Zealand would be attacked, had
    been evacuated by the Australians on 1 May. Two transports were reported unloading
    troops into barges in the harbour, though no indication was given of the time
    at which the occupation commenced.


    The intelligence reached Commander Task Force 17 at 1900 on the 3rd and Rear-Admiral
    Fletcher at once headed for Tulagi (2000) and worked up to 27 knots to reach a
    position for an air strike at daylight. With his flagship, the Yorktown, were
    the heavy cruisers Astoria, Chester, Portland and Chicago and the destroyers Hammann,
    Anderson, Perkins, Morris, and Sims. To wait for the Lexington and Task Force
    11 might have jeopardized the success of the operation; he detached the Neosho,
    with the destroyer Russell as escort, with orders to proceed to the rendezvous
    in latitude 15° 00'' S., 157° 00'' E., arranged for 4 May, and inform all ships
    that a new rendezvous would be in latitude 15° 00'' S., 160° 00'' E.


