    forces. In the event, the presence of American aircraft carriers forced them to
    divide their air effort between the carriers and the airfield with disastrous
    results.


    It had not been possible to conceal from the Allies the concentration of the necessary
    forces at Rabaul, and by 17 August it was clear to them that the greater part
    of the enemy naval forces was committed to the South Pacific. This was estimated
    as two battleships (Kongo class) seven heavy cruisers, four light cruisers and
    between 20 and 30 destroyers. No intelligence had been received as to aircraft
    carriers, but it was suspected that two or three might be used in support; in
    addition, it was necessary to reckon on about 160 shore-based aircraft.


    When the scale of the threatening attack was appreciated by the Americans, the
    carrier Hornet ordered from Pearl Harbor to join Vice-Admiral Fletcher''s forces,
    and she sailed on 17 August. On the same day, a diversionary operation was carried
    out, designed to draw part of the enemy forces away from the Solomon area and
    induced the Japanese to detach a relief force. This consisted of a raid on Makin
    (Gilbert Islands).


    # 4. Movements of Task Force 61


    As the reports began to indicate that the Japanese preparations were nearing completion,
    Vice-Admiral Fletcher''s carrier forces moved to the northward. On 21 August they
    were joined by Rear-Adm. Crutchley, V.C., with the Australia and three US destroyers.
    During the next two days, Task Force 61 operated to the south and east of Guadalcanal
    within 100 miles of the island.


    On 23 August a reconnaissance aircraft reported an enemy force of two cruisers,
    three destroyers and four transports at 103 near Ontong Java (Lat. 5° S., Long.
    160° E), steering a southerly course at 17 knots. That afternoon the Saratoga
    launched a striking force of 37 torpedo and dive bombers to attack this force
    from 320 miles from Task Force 61; nine dive-bombers, escorted by fighters, were
    also sent from Guadalcanal. But the enemy, on being sighted, had made a drastic
    alteration of course to the northwest with which the reconnaissance aircraft omitted
    to report and neither of these striking forces made contact. Both landed on Henderson''s
    Field, the the Saratoga''s aircraft rejoining its next foreseen.


