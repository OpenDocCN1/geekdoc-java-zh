    supply fuel for the destroyers and the resulting shortage had an effect on the
    subsequent operation.


    # 5. Appreciation of the Enemy''s Reaction to the Leyte Landing


    The American estimate of the enemy''s strength and dispositions at the end of
    September differed somewhat from actuality and was as follows :-


    | Formosa-Japan | Singapore Area |

    |------|--- |

    | Battleships | 3 | 4 |

    | Battleship carriers | 2 | - |

    | Carriers | 6 | - |

    | Light carriers | | - |

    | Escort carriers | 3 | 1 |

    | Armoured cruisers | 4 | 11 |

    | Light cruisers | 7 | several |

    | Destroyers | about 20 | about 20 |


    It was recognized by the US Commander South-west Pacific, that the strategic result
    of capturing the Philippines would be decisive. Nevertheless, the intelligence
    appreciation upon which his forces were working, anticipated but slight possibility
    of strong Japanese naval reaction to the landings at Leyte,¹⁷ a view which was
    not, however, entirely shared by the Third Fleet, from whom reaction was expected.'
