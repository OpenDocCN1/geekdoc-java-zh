    accounted for in that area. In Guadalcanal, some 10,500 American troops held the
    area around Lunga Point on the North Coast, including the fine airfield at Kukum
    recently completed by the enemy. Lack of fighter cover had had however, the withdrawal
    of the American store ships before unloading had been completed, and the consequent
    shortage of heavy equipment prevented the American troops from dealing with the
    considerable Japanese forces still at large in the island. Heavy losses had been
    sustained by the Allied surface forces in a night action after Savo Island on
    9 August, and as a result the enemy had obtained local command of the sea, and
    the American Forces on shore in Guadalcanal, though in superior strength, were
    virtually cut off. Japanese surface forces bombarded with impunity day and night,
    but apparently no land reinforcements were immediately available. Within a fortnight,
    however, the Americans were operating dive bombers from the airfield – known as
    Henderson’s Field – and the Japanese, who had no airfields in immediate supporting
    range of Guadalcanal, suffered sufficient casualties to surface ships to restrict
    them to night operations.


    # 2. Allied Naval Forces, South Pacific


    Vice-Admiral Gormley, USN, the Commander of the South Pacific was in general charge
    of the Allied forces with his headquarters at Noumea. The effective naval forces
    at his disposal consisted of three carriers (*Saratoga, Enterprise and Wasp*),
    the battleship North Carolina, six heavy cruisers (*Minneapolis, New Orleans,
    Portland, San Francisco, Salt Lake City, Australia*), four light cruisers (*San
    Juan, Atlanta, Phoenix, Hobart*) and 20 destroyers. During the period following
    the occupation of Tulagi the *Australia* (Flag Rear-Admiral Crutchley, VC), Hobart
    and six destroyers, which had been present at the launching operations, at Noumea;
    the remainder remained as Task Force 61 under the command of Vice-Admiral Fletcher,
    USN, were cruising in the area to the west of the New Hebrides.


    Allied aircraft based on Spiritu, Efate, and New Caledonia, as well as those of
    the south-west Pacific area based in Australia and New Guinea were keeping up
    a constant reconnaissance of the Bismarck-Solomons area.


    # 3. Japanese preparations


    By 20 August 1942 – just a fortnight after the American landing – the Japanese
    were ready for their first large-scale counter-attack. A striking force of carrier
    borne aircraft was to neutralize Henderson’s Field, after which reinforcements
    were to be landed from a convoy escorted by powerful force'
