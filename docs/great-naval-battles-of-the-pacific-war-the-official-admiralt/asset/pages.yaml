    # 6. Fragmentary Sighting Reports of 21–22 October


    The only considerable information of the enemy available prior to 21 October was
    of small craft movements, from which it was inferred that reinforcement of the
    west coast of Leyte by small craft was occurring or about to occur.


    On 21 October large enemy warships were sighted to the north, west and south of
    Leyte, but all sightings were indefinite. There was no evidence of movement towards
    the Philippines; but rather the reverse, in fact.


    Sightings on 22nd provided no more satisfactory basis for an appreciation of the
    enemy''s intentions. In the Luzon Strait, south of Formosa, a southbound force
    of some half dozen ships was sighted at midnight 21st/22nd and was attacked, two
    hits reported. During the day, various other sightings occurred in the area northwest
    of Leyte which seemed to suggest that forces, including heavy cruisers, were moving
    towards Manila. But these contact reports were deprived of much of their significance
    because it was thought they were connected with the abortive sortie of the Japanese
    Fifth Fleet a few days earlier. It was difficult now to determine whether the
    ships were retiring, re-forming, or standing by.


    In the south sightings on 21st and 22nd were equally fragmentary and uncertain.¹¹


    # 7. Seventh Fleet Blocks the Approaches to Leyte Gulf, 22 October


    Indeterminate though the sightings were, Rear-Admiral Oldendorf, commanding Task
    Group 77.2, decided already on 22nd to form a battle position to defend Leyte
    Gulf. Under his orders was the force which was supplying cruiser cover for the
    landings in the gulf, namely, six battleships, three heavy and two light cruisers
    and destroyers. On Vice-Admiral Kinkaid''s instructions, his ships were remaining
    in the area of


