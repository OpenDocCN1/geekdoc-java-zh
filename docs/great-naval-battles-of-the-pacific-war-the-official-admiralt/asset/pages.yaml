    # 13. Support Group detached, 0530 7 May


    During the forenoon of 6 May the wind and sea had made it necessary to fuel Task
    Force 17 on a south-easter course; at 1130, however, course was altered to the
    north-westward in order to reach a position for a strike on the invasion fleet
    daylight on the 7th. Fuelling was discontinued and the Neosho detached to the
    south with the destroyer Sims as escort, at 1725 on the 6th.


    Task Force 17 continued north-westward at 20 knots during the night, and at 0530
    on the 7th was in latitude 13° 25.5'' S., longitude 154° 48'' E. Rear-Admiral
    Fletcher detached the support group (17.3), under Rear-Admiral Crace, reinforcing
    him with a third destroyer, the Farragut, to proceed ahead to attack the enemy
    transports and light cruisers which has been reported heading for the Jard Passage
    during the night. Rear-Admiral Crace increased speed to 25 knots and secured a
    position off the southern exit of the passage.


    # 14. Enemy occupation sighted off Misima, 0015


    While there had been information of the movements of the Japanese carriers, the
    most important target for air attack, since the previous afternoon, when two of
    them were correctly estimated by the Americans as the Zuikaku and Shokaku of the
    5th Carrier Squadron, and therefore additional to the unidentified carrier reported
    with the Operation Force, had been sighted near Bougainville Island. Morning air
    searches by the Yorktown reconnaissance aircraft planned to cover two areas, namely
    the neighbourhood of Deboyne Island and also to locate the 5th Carrier Squadron,
    which was expected to run south from Bougainville and to be in striking distance
    on the morning of the 7th.


    At 0619 the Yorktown launched a search group of 10 scout bombers to combat a single
    plane search for a distance of 250 miles over 120 degrees, on a mean bearing of
    025 degrees, limiting bearings 325 degrees and 085 degrees. One scout, having
    the sector with median 067 degrees, went out only 150 to 165 miles and returned
    on account of bad weather, and it is probable that the Zuikaku and Shokaku were
    in this searched weather area to the north-east-northward. At 0735 another scout
    made contact with two heavy cruisers in latitude 10° 40'' S, longitude 153° 15''
    E., 25 miles cast of Misima Island, in the Louisades; the enemy ships sighted
    and challenged. Two other scouts each shot down one float torpedo bomber, near
    Misima Island and in latitude 11° 35'' S., latitude 156° 43'' E.'
