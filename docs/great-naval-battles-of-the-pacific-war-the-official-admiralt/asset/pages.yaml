    four carriers and two converted battleship carriers, Ise and Hyuga, with their
    screen, termed the main body of the mobile force or Attack Group. This fleet was
    based on Japan, and it was this fleet in the battle at Leyte Gulf constituted
    the Northern Force. The majority of the remaining ships of the combined fleet
    were included in the Second Fleet (ter the First Diversion Attack Force), which
    was organized for the defence of the Philippines in two forces: the Southern Force
    of two old battleships and one heavy cruiser, one destroyer; and the Centre Force
    comprising the main surface strength of the fleet. On account of shortage of oil
    in Japan, the home islands could not support the whole of their tactical forces,
    and the Second Fleet was been based on Singapore.


    The Fifth Fleet (Second Diversion Attack Force), consisting of two cruiser squadrons
    (two heavy and two light cruisers) and a destroyer flotilla (one light cruiser
    and four destroyers), had been brought south from its station at Minato in Northern
    Honshu, at the time of the air strikes on Formosa and the Peleadores by the American
    fast carriers on 12-13 October, in which the cruisers Canberra and Houston were
    torpedoed. It appears that the Japanese, believing early reports from their airmen,
    hoped to be sink some American cripples, and to rescue some of their own downed
    aircrews; but then the Third Fleet too strong and consequently retreated to Amami
    O Shima without involved in an engagement.


    # 4. The Japanese Plan


    The defence of the Philippines was part of the plan known as Sho-Go (Sho Operations).
    It was recognized that the defence of the archipelago could not succeed with the
    participation of the Combined Fleet. If the Philippines were lost, the southern
    shipping route, through which a trickle still ran, would be cut and the fleet
    would consequently be immobilized in Japan for lack of oil, or if it remained
    in the south, cut off from its ammunition supply. It was therefore to risk the
    entire fleet in one operation.


    The plan was designed to make the best use of the Japanese strength in heavy surface
    ships at which this date predominated their light forces and naval air forces,
    both of which had been diminished through attrition. In the event of the threat
    to the Philippines it was intended that the Southern and Centre Forces should
    advance from Lingga Anchorage (about 100 miles south of Singapore) to Brunei Bay
    (Borneo) or the northern Philippines, and time their sortie from so as to reach
    the threatened beach at the same time as the Allied invasion force. Whilst endeavouring
    to avoid attack


