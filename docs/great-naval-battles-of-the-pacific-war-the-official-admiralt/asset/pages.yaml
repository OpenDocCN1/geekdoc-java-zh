    bolted by the Battle of Midway, and the plan to invade Port Moresby by sea was
    abandoned.


    The turning back of the Port Moresby expedition to the Battle of the Coral put
    an end to Japanese southward expansion by sea and Saved for the Allies a base
    on which their subsequent progress to the final recapture of New Guinea was founded.


    # 29. Lessons of the battle


    The Battle of the Coral Sea showed the aircraft to be the principal offensive
    weapon of both the US and Japanese fleets. At the same time, it was clear that
    some method must be found of increasing the capacity of aircraft carriers for
    sustained operations. The answer was found in the development of the technique
    of fueling, rearming, and storing at sea.


    The Americans gained in the battle some valuable experience, of which they took
    immediate advantage.


    On the tactical side, the outnumbering of the US fighters resulted in the complements
    of the carriers being increased from an average of 17 to 27, bringing them to
    numerical equality with the Japanese. As a protection for carriers against torpedo
    air attack a very tight disposal was in future adopted in the Pacific Fleet, the
    screening ships being stationed on a 1,500 to 2,500-yard circle. The desirability
    of close co-orordination between torpedo aircraft and dive-bombing attacks was
    considered to have been demonstrated.


    Certain faults in materiel were brought to light. Fogging of sights and windshields
    received attention; and Admiral Nimitz pressed for more effective aircraft bombs,
    and for torpedoes of a longer range, as too many hits were required at present
    to destroy an enemy carrier. Steps were taken to replace the existing torpedo
    aircraft by machines of greater speed and longer range.'
