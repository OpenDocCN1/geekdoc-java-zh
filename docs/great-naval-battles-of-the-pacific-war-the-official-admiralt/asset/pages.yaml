    Vice-Admiral Shima received no further instructions after this radio message.
    He did, however, learn of the delay to the Centre Force caused by the fast carrier
    air attacks on the 24th, and consequently, whilst passing through the Sulu Sea
    he advanced his time of arrival at the objective by one hour in order to give
    more effective support to Nishimura. Later, he heard that Kurita had reversed
    his course around 1600 in face of the continuing air attacks; and Vice-Admiral
    Shima accordingly advanced his time and increased speed to 22 knots, in order
    to make his entry at 0300 on the 25th in support of Nishimura.


    The fleet passed through on account of shortage of fuel. The fleet passed through
    the Sulu Sea and Mindanao Sea without any air attack being made on it. At midnight
    on the 25th it bore 30° from Kamigan Island and was about 30 miles astern of Nishimura''s
    force.


    The gun flashes of Nishimura''s ships repelling torpedo boat attacks were seen
    after 0100, and from the interception of inter-torpedo boat communications it
    was judged that the main Allied force was waiting off Pana Island The Japanese
    already received information as the result of air search on the 23rd, that torpedo
    boats were stationed at the entrance of Leyte Gulf. The Fifth Fleet proceeded
    however, without being attacked until 0300. The tide was rising north, and the
    ships were set too close to the island and had to alter course to the eastward.
    When the original course was resumed, battle position was assumed with the fleet
    in column, the destroyers being stationed astern.


    At 0300 manoeuvre had been completed, and the fleet had changed northerly course
    for the run up the Surigao Strait, when an attack was received from the MTBs.
    stationed off the south-east tip of Pana Island. The light cruiser Abukuma, third
