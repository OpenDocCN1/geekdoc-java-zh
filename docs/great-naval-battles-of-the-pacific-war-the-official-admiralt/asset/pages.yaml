    # 6. The Aleutian diversion


    Intimately connected with the Midway operation and acting as a diversion for Operation
    MI the Japanese planned an attack on the Aleutians, Operation AL. This was carried
    out by a small but powerful force consisting of two aircraft carriers, two heavy
    cruisers, and three destroyers, termed the Second Mobile Force or Second Task
    Force.


    On 3 June (West longitude date), the day before the carrier attack on Midway,
    an air attack was carried out on Dutch Harbor, followed by the 6th July respectively
    by the occupation of Kiska and Attu.


    The Americans appreciated the likelihood of an attack on their Aleutian bases
    concurrently with an operation against Midway. To meet the threat, a new Task
    Force 8 was formed out of the five cruisers and four destroyers which were the
    only ships within range. This was dispatched to reinforce the sea frontier being
    assembled in the Alaskan area.


    # 7. Japanese preparations for the operation


    The carriers detailed for the Midway operation returned to their home ports from
    the raid on Ceylon, on 22-23 April, and immediately set about repair and maintenance
    and urgently needed flight training.


    During the operations which had lasted for more than five months had been a considerable
    turn-over in flight personnel, and there was time for more basic training for
    most of the servicemen. Experienced flyers lost much of their skill. Only one
    carrier was available for take-off and landing drills. The Commander-in-Chief
    of the Japanese 1st Air Fleet, in his Battle Report, paints a picture of rudimentary
    conditions of training almost incredible in a power which had to challenge the
    might of the United States. Inexperienced flyers barely reached the point where
    they could make daytime landings on carriers, and only the most experienced flyers
    carried out about one dusk landing apiece. No opportunity was available for joint
    training, thus precluding co-ordinated action between contact units, illumination'
