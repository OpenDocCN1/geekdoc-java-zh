    # 15. Dawn Search and Attack Units Launched, 24 October


    Vice-Admiral Mitscher, Commander, Task Force 38, had ordered ''reinforced search
    teams'', consisting of four bombers and four fighter aircraft to be launched at
    dawn on 24th to cover the Sibuyan Sea and the area from Mindoro Strait in the
    south to the west side of Luzon, in the north.¹ Their objective was was major
    units of the Japanese fleet and they were intended as both search and attack units.
    Both the fighters and bombers carried bombs. and they were launched soon after
    0600. In addition, the Essex sent off a 20-aircraft sweep to attack enemy aircraft
    in the neighbourhood of the Manila airfields. A deck load strike was ordered on
    deck of each carrier to strike any units reported by the search. These activities
    occupied a considerable proportion of the fighter aircraft of the carriers. There
    remained a barely adequate number to escort the ready strike, and a modest number
    for combat patrol over the group.


    No search to the north or north-east of Luzon was ordered, consequently the Japanese
    carrier force coming from the north remained undetected though within aircraft
    range. The omission had a definite effect on the rest of the day''s action.


