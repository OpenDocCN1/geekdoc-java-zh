    # 47. First hit obtained by the Enemy, 0750


    In spite of the undimished intensity of the enemy''s fire, it was not until the
    action had been in progress for an hour that the first hit on any of the carriers
    was recorded. Early in the engagement the cruisers cruisers Haguro and Chokai,
    enabled no doubt to cut the carrier when the Japanese battleships turned to a
    southerly course soon after 0800, moved across to the port side of the formation
    and took the lead, from rough line, from the Tone and Chikuma, the only two cruisers
    left in the Seventh Squadron when the Kumano and Suzuya fell out. It was during
    this manoeuvre that shortly after 0800 the leading cruiser to port was seen to
    commence a turn away, only however, to continue through 360° and take station
    astern of her colleague. As the Japanese cruisers continued to go, they shifted
    to the leading ships, and from this time on, the Kitbun Bay and Fanshaw Bay were
    under heavy fire and repeatedly resettled. The Kitbun Bay received no damage,
    but at 0750 the Fanshaw Bay, Rear-Admiral C.A.F. Sprague''s flagship, was hit
    on the bow by an 8-in, shell, damaging her catapult. Only two other 8-in shell
    hits were received, neither of them serious. The failure of the Japanese to inflict
    greater damage is remarkable. At one period, around 0844 a unit of the enemy consisting
    of a cruiser and eight destroyers closed to a range of 6,900 yards from the St.
    Lo, but the latter remained unhit. The slow rate of fire, more than a minute between
    salvos, and poor pooling enabled the ship under fire to manoeuvre to avoid the
    next salvo.²³ The general employment of salvos rather than broadsides and of AP
    shells, some which apparently failed to detonate the ships, saved the latter from
    more severe damage.¹⁴


