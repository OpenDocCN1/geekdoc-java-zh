    The latter was obviously doomed, although the fires had been brought under control
    the pumps were unable to keep down the rising water, and the main deck was buckling
    and seemed likely to break in two at any time. Nevertheless, the ship remained
    afloat all night, though by the morning of the 8th she had developed a list to
    starboard of 26 degrees and the utmost endeavours could only reduce this by some
    3 degrees.


    The 8th and 9th passed with the men employed in making rafts and rigging masts
    for all available boats. At 1012 on the 9th the Neosho''s position was taken at
    latitude 15° 35'' S, 156° 55'' E. The signal codes had been destroyed, but wireless
    transmission in plain language was possible on the auxiliary transmitter.


    At 1230 on the 10th an Australian Hudson bomber appeared, inquired if the ship
    was in distress, and on receiving an affirmative flew off to the southward after
    circling the ships several times. The Neosho gave her position but received no
    reply. By the 11th it was apparent that the ship had settled appreciably during
    the night and the distortion of her plates had increased alarming. By 1130, when
    the question of abandoning ship and making for the Australian coast was being
    considered, a Navy Catalina patrol bomber from the Tangier appeared from the east
    and within an hour and a half the US destroyer Henley which had been dispatched
    from Nmea was sighted. By 1412 all survivors were safe, and at 1522, at Commander
    Phillips requested the doomed Neosho was sunk by two torpedoes and several rounds
    of 5-inch gunfire in lat. 15° 35'' S, 155° 36'' E.


    The Henley searched the area until dark finding any of the men who had abandoned
    ship, then headed for Brisbane, in order to get the wounded to the hospital. Ordered
    at 0100 on the 12th to return to the search of the bombing, she went and a wider,
    but fruitless, search.


    Meanwhile, it was discovered that the position of the Neosho at the time of attack
    had been incorrectly plotted and transmitted, and the destroyer Helm was sent
    from Nmea, on the 14th, to make a search in the corrected position. On the 17th,
    15° 16'' S, 155° 07'' 3" E, four of the Neosho''s survivors were rescued from
    a life raft: all were in a critical condition from exposure, and one man died
    after being taken aboard. They were the sole survivors of 68 men from four rafts
    lashed together, and they told a grim story of food and water becoming exhausted
    because neither was rationed, of being on the rafts. The Helm searched until sunset
    on 17th and aircraft from the Tangier maintained a search until the 2nd, but no
    further survivors were found.'
