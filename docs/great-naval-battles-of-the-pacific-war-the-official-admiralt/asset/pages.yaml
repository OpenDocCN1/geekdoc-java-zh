    # 20. The Yorktown''s group attacks


    The Yorktown''s group went first, the scouts and dive bombers going ahead of the
    torpedo aircraft at 17,000 feet, escorted by two fighters. The bombers sighted
    the enemy at about 1032, steering course 190 degrees at 20 knots. The Japanese
    force had the protection of the area of bad weather that had concealed Task Force
    17 on the previous day. The weather in the neighbourhood of the enemy was unsettled,
    intermittent rain squalls; a broken lower layer of clouds covered the area at
    2,000 to 3,000 feet. Visibility varied from 2 to 15 miles.


    At 1049 the bombers were near the enemy and circling while waiting for the slower
    torpedo aircraft to arrive and take position for attack. The enemy carrier, apparently
    the Zuikaku, now headed for a large rain squall, the Shokaku turned into the east-south-easter
    wind and began to launch her aircraft. Some of the enemy opened fire.


    Nine minutes elapsed before the torpedo aircraft were in position and a coordinated
    attack by dive bombers and torpedo aircraft began on the Shokaku. The bombers
    attacked down-wind, from 17,000 feet, altitude of release 2,500 feet, and as on
    4 May, they were hindered by the fogging of their telescopes and wind shields,
    which greatly reduced their bombing accuracy. They encountered considerable anti-aircraft
    fire and were attacked, both in the dive and the pull-out, by Zero fighters, some
    15 to 18 of which were over the Japanese formation, outnumbering the American
    fighters. The Yorktown''s scouts shot down four and the bombers seven'
