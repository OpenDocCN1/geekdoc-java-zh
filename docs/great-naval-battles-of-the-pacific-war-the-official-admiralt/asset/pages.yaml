    The Japanese attacks appeared to be directed against the two American carriers,
    though in the circumstances of the moment one or two torpedoes and a few bombs
    appeared as if aimed at the screening ships. When the enemy intended to attack
    both the US carriers simultaneously with torpedo and dive bombs, the numbers,
    both of torpedo aircraft and dive bombs, that attacked each carrier, were approximately
    equal.


    It quickly became apparent that the American makeshift anti-torpedo aircraft patrol
    would be unable to prevent the enemy''s torpedo attack from getting in. Their
    approach differed greatly from that employed in the attack on the Prince of Wales
    and Repulse a few months earlier, the only precedent on which the Americans could
    base their tactics. The approach against the British ships was made in squadron
    formation. Against Task Force 17, however, squadrons broke up into small groups
    which attacked from various directions. The standard procedure appeared to be
    a fast relatively shallow power glide from 5,000 feet to altitude of release,
    ranging from 100 to 200 or 300 feet, release being at relatively high speed. Some
    torpedo aircraft, however, delivered their torpedoes from heights of as much as
    500 feet, either designed or in consequence of being fired at.


