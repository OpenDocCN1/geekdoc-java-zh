  md: '# The Strategic Situation in April 1942 7


    15 heavy bombers, 30 fighters and four patrol aircraft were based. Patrol seaplanes
    used Salamua on Huon Gulf, and were also based at Shortland Island, south of Bougainville
    in the Solomonons, large aircraft of this type being employed by the Japanese
    for reconnaissance, relieving the carriers of this task. There were no other land-based
    naval air forces nearer than Kendari in the Celebes, where the 23rd Air Flotilla
    was established in February 1942; and no Army air forces nearer than the Philippines
    (Fifth Air Army) and Malaya-Burma (Third Air Army).


    # 4. Allied Forces


    The concentration of Japanese ships near Truk and Palau (West Caroline Is.) at
    the end of April was reported by Allied intelligence in sufficient time for the
    Americans to assemble a strong force to oppose the expected move through the Solomonons.
    Admiral C. W. Nimitz, Commander-in-Chief, US Pacific Fleet, operating under him
    in the central and south Pacific areas three American tasks, two of Nos. 11 and
    17, each containing one fleet carrier and the third, No. 16, two carriers. Task
    Force 17 (Rear-Adm. F.J. Fletcher) consisted of the carrier Yorktown (flag), the
    8-inch cruisers Astoria, Portland and Chester, and six destroyers. The ships had
    been at sea continuously leaving Pearl Harbor on 14 February, operating against
    Wake, Marcus and Mae-Salamua, and were returning to the Coral Sea after a week
    spent in replenishment and replenishment at Tongatabu in the Tonga Islands. Task
    Force 11, consisting of the carrier Lexington, the 8-inch cruisers Minneapolis
    and New Orleans, and seven destroyers, under Rear-Admiral A.W. Fitch, proceeded
    to Pearl Harbor for the raid on La-Salamua on 10 March, and sailed from 16 April
    for Christmas Island. The third carrier, Task Force 16, which included the two
    carriers Enterprise and Hornet, did not return to Pearl Harbor until 25 April
    after the air raid on Tokyo. The Australian Squadron, including the 8-inch cruiser
    Australia, which had taken part in the La-Salamua operation, and the light cruiser
    Hobart, by the British-Admiral J.G. Grace, was at Sydney, Australia.


    The aircraft complement of the US carriers was ten less than that of the Japanese,
    the difference being accounted for by the greater number of fighters, 27 against
    an average of 17, borne aboard the Japanese carriers. Both the Japanese fighters
    and torpedo aircraft were obsolete, and their low performance reduced the effectiveness
    of their attacks. The Commander-in-Chief US Pacific Fleet was not satisfied with
    the effectiveness of the US bombs and torpedoes; the speed of the latter was so
    low that the Japanese stated they could turn and run from them.'
