    It is difficult to link the reported incidents of the battle with the actual enemy
    losses as verified. In the main, the Allied ships were firing by radar rather
    than at identifiable vessels; and it was not always certain whether the target
    on the screen was one vessel, or a group. The enemy ships shifted, turned and
    scattered under the devastating fire to which they were subjected; but the movements
    definitely discernible were those of their advance upon the Strait and the subsequent
    retirement of the survivors.


    The comparative immunity of the Allied ships from loss or damage may be ascribed,
    to the low efficiency of the Japanese radar, which was not suitable for fire control,
    and the fact that the ships'' installations were ineffective for search in this
    particular engagement. The Japanese were aware of the presence of a strong Allied
    supporting force in Leyte Gulf, but they did not know when or exactly where it
    was met. Rear-Admiral Oldendorf, on the other hand, received sufficient warning
    by his patrols stationed in the approaches to the Surigao Strait. The column formation
    of the Japanese facilitated radar interception, and the majority of the American
    ships were able to plot the approaching enemy by radar from well outside gun range
    and to fire their torpedoes and guns in full radar control. It was perhaps that
    the Yamashiro and Fuso had not previously operated with the remainder of the force.


