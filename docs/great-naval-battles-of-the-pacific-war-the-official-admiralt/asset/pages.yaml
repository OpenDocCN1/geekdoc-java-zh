    **56. Contact with the Japanese Northern Force 0205, 25 October**


    Whilst the Seventh Fleet escort carriers were fighting their gallant delaying
    action, the Covering Force – the Third Fleet, under Admiral Halsey 250 miles to
    the northward was attacking the Japanese carriers.


    It had not been possible to keep contact with the enemy Northern Force throughout
    the night. About 0030 on 25th the night carrier *Independence* launched a 10 sector,
    350-mile night search, one aircraft per sector, between bearings 320° and 010°.
    Other searches to the most were launched shortly after; at 0100 between the same
    bearings by the *Lexington* and at 0135 two fighters by the *Enterprise*.


    About 0205 a radar contact was made, by one of the search aircraft in 16° 42''
    N, 125° 36'' E. Three large and three small ships were reported steering 110 knots,
    with a second group of six large ships 26 miles to the northward of the first.
    This put the closest enemy group almost due north (bearing 352°), at an estimated
    distance of 80 miles. Contact was lost again. At 0300 engine forced the night
    shadowing aircraft to return to base, the relief search aircraft had difficulties
    with radar equipment, and radar contact was never regained during darkness. When
    last the mean course of the two groups was about NNE


