    # Fourth Japanese Offensive


    # 16. Events Following the Battle of Santa Cruz


    After their repulse at the Battle of Santa Cruz, the Japanese began assembling
    ships and troops for yet another attempt at Guadalcanal. On shore in the island,
    unsuccessful assaults on the American lines had cost the enemy during the last
    days of October, and before they had time to make these losses by reinforcements,
    the Americans launched a counter-attack. Beginning at 0030, 30 October, the *Atlanta*
    and four destroyers bombarded the Japanese positions behind Point Cruz for eight
    hours. At dawn the marines, heavily supported from the air, struck across the
    Matanikui River, and by 3 November had advanced beyond Point Cruz, killing many
    of the enemy and capturing much equipment. During the night of 2-3 November, however,
    Japanese cruisers and destroyers managed to land about 1,500 troops with artillery
    at Koli Point and the American offensive to the westward was to meet this threat.
    The force of Koli was effectively bombed by the *San Francisco*, *Helena* and
    *Sterett* on 4 November, and after several days fighting, most of it was surrounded
    by Tetere, and had been annihilated by 11 November.


    Meanwhile the Americans had not so long to take advantage of the retired force
    on the Japanese surface forces by the Battle of Santa Cruz. Appreciating that
    the retention of Guadalcanal depended on getting enough troops to sustain an offensive,
    they landed additional troops at Lunga early in November. A force was also landed
    at the Aula Bay by being a supporting airfield; and arrangements were made for
    6,000 men with ammunition and supplies to arrive about the middle of the month
    in two convoys under Rear-Admiral Turner. The airfields in the Lunga area were
    being developed rapidly; and aircraft operating from them attacked an enemy force
    of one light cruiser and 10 destroyers on 7 November. One bomb and two torpedo
    hits were claimed on the cruiser, besides damage to two destroyers: in addition
    16 aircraft were shot down.


