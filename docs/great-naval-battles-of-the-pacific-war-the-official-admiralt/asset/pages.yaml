    # 18. Attacks on the support group, 7 May


    The support group of cruisers and destroyers under Rear-Admiral Crace had been
    detached at 0530 on 7 May, did not long remain undiscovered by the enemy. At 0810
    radar indicated that aircraft were shadowing the force, and one of the enemy,
    a twin-float monoplane, was sighted to the north-eastward by the Chicago, at a
    range of 20,000 yards, and remained in view for about half an hour, circling well
    out of range.


    No further aircraft approached until the afternoon. At 1345, when the force was
    approximately 12° S, 151° 30'' E, 60 miles south of the Jomard aircraft, radar
    contact was made with a group of aircraft bearing 135 degrees, range 56,000 yards,
    and 12 minutes later a formation of 12 single-engine monoplanes were coming out
    from stern on a parallel course and were taken under fire at ranges of 6,000–12,000
    yards. The enemy quickly retired.


    Half hour later there was radar contact at 150,000 yards with a group of aircraft
    closing on a bearing 250 degrees. The weather was fine, eight knots from 120 degrees,
    sea slight, bearing 318 degrees, altitude 52 degrees, when at 1432 sunlight on
    their wings revealed a group of aircraft, range 25,000 yards, approaching from
    right ahead. These were 13-14 Type 97 (Navy) Mitsubishi twin-engine torpedo aircraft,
    with fighter protection, from the 25th Air Flotilla at Rabaul.


    Task Force 17 was striking 275 degrees, speed 25 knots at the time, in V Formation,
    with the flagship Australia as guide, the Chicago and Hobart bearing 135 degrees
    and 225 degrees respectively, distance 1,600 yards, and the destroyers Fagrutt,
    Perkins, and Walke as anti-submarine screen.


    Within three minutes the enemy began their attack. Gliding down at 12 miles from
    5,000 feet to 100 feet at eight miles they started their approach from the starboard
    quarter. The ships opened fire and almost immediately two of the enemy, including
    their leader, were seen to crash about 1,000 yards ahead, whereupon the remainder
    separated into groups. The larger group continued on their bearing, whilst one
    small group swung to the come in from the starboard quarter. With the exception
    of one of the enemy, which released its torpedo at a height of 100–150 feet, all
    the aircraft made their release at 40 feet, range 1,000–2,000 yards.


    The next few minutes were crowded, torpedoes coming from all angles and enemy
    aircraft machine gun the ships. The latter put up a heavy curtain of fire and
    manoeuvre to avoid torpedoes. At least two more of the enemy were shot down by
    the ships'' fire. Only five torpedo tracks were seen, all of'
