    New Guinea had been saved for the Allies, and there were indications that the
    Japanese had, temporarily at least, renounced any designs they might have on Australia.


    This was the interpretation the Americans put on the absence from southern waters
    of Japanese warships other than occasional submarines, and a husbandingofJapanese
    air strength so marked during the weeks following the battle the shore-based aircraft
