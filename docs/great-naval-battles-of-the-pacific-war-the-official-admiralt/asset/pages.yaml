  md: '# Chapter IV


    # Allied Naval Command Leaves Java


    # 66. US Catalina report


    Meanwhile, the convoy which Rear-Admiral Doorman had been striving to reach was
    steering north. Lieut. Campbell, American pilot of a Catalina flying boat sighted
    it at 0100/28, consisting of 39 transports led by a cruiser. It was flanked on
    the port side by two destroyers and two cruisers in line ahead, and on the starboard
    by one cruiser or two destroyers, also in line ahead. Seeing gunfire and flashes
    bearing 120°, in approximate position 06° 00'' S, 111° 40'' E., the pilot flew
    in this direction and saw two cruisers and four destroyers steaming north-west.
    Thinking they were Allied ships, he gave the recognition signal, but received
    no reply; the ships then closed the convoy and circled south of it.


    # 67. Dutch Catalina report


    A Dutch Catalina was also scouting for the convoy. The pilot, at 2300 on 27 February,
    had been ordered by Rear-Admiral Koenraad to make a reconnaissance flight to locate.
    The terms in which the pilot was brief seem to indicate good of doubt as to the
    situation. At 0200 on 28 February, the Catalina sighted the enemy convoy in position
    05° 50'' S, 111° 40'' E., i.e., about 54 miles west of Bawe, and about 29 miles
    north-west of the position where the *De Ruyter* and *Java* were. The pilot''s
    report generally confirmed that of the American Catalina, though differing as
    to the strength of the escort.


    # 68. Perth and Houston reach Batavia


    On 28 February, the *Perth* and the *Houston* arrived at Batavia at 1400 to refuel,
    after a Japanese torpedo aircraft formation possibly intending to attack them
    had been broken up outside the harbour by Hurricanes. After refu, the cruisers
    proceeded westward at 2121 for Sunda Strait during darkness, en route for Tjilatjap
    on the southern coast of Java.'
