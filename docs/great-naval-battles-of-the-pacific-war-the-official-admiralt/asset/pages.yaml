    # 9. Sinking of the Atago and Maya, 0630–0700 23 October


    The submarines *Darter* and *Dace* shadowed and attacked the enemy ships as they
    proceeded through the Palawan Passage, nor were they coming into action. The *Dace*,
    in 09° 24'' N, 117° 11'' E, reported three battleships, four heavy cruisers, and
    three other vessels, and that she had obtained torpedo hits on one *Atago* class
    cruiser and damaged a second. Half an hour later, the *Dace*, in 09° 29'' N, 117°
    20'' E, reported 11 ships, including three cruisers, and a carrier, and that she
    had obtained torpedo hits on a *Kongo* class battleship.


    The enemy force encountered by the submarines by Vice-Admiral Kurita''s Centre
    Force, comprising the five most modern battleships, 10 heavy cruisers, with light
    cruiser and destroyer screen. The ships hit three of the four heavy cruisers of
    the Fourth Cruiser Squadron, of which, two of the *Atago* and the *Maya*, were
    sunk and the third, the *Takao*, was badly damaged and had to be sent back to
    Singapore via Bruni, escorted by two destroyers.


