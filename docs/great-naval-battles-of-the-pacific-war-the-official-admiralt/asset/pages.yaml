    nA final endeavour to attack the damaged carriers and other Japanese ships in
    the area was made by the 11 MTBs which left Midway about 1930 for their 200-mile
    trip. However, the squally weather and low visibility provided excellent conditions
    for attack also operated adversely on the chances of finding the target. The MTBs
    searched until dawn and then returned to Midway. A Japanese reconnaissance aircraft
    bombed and machine gunned one of the boats in the morning without causing serious
    damage.


