    The remaining survivors of the Japanese Second Fleet, many of them damaged, made
    their way to Brunei Bay. The heavy ships proceeded direct; the destroyers Isokake
    and Yukikaze were re-fueled at Dangerous Ground from the Nato and Haruna whilst
    the Hamanami, Kishimani, Akishimo, Shimazaki and Urazake fueled at Koron on route.


    About near-Admiral Sherman sent a fighter bomber over Manila to damaged ships
    reported there. Two Japanese heavy cruisers, one light cruiser and four destroyers
    were visually sighted in Manila on 26 October some of these may have been the
    damaged ships sighted in Manila Bay on 23rd and fourth; and one damaged Tone class
    heavy cruiser was seen on November 3rd in Bacuit Bay, Palawan.


    One of the three carriers which took part in the operation, that stationed at
    Koron escaped to the north-west after one hit in air attack. One of the two in
    the Sulu Sea was sunk in Balabac Strait by submarine torpedo the other, also damaged
    by submarine torpedo escaped in Paitan Bay, North Borneo (06° 45'' ''N, 117° 20''
    E.).


    # 75. Losses of the Centre Force


    Of the five battleships, 10 heavy cruisers, two light cruisers, and 15 destroyers
    which constituted the Japanese Centre Force when it sailed from Brunei Bay, only
    four battleships, heavy cruisers and 13 destroyers succeeded in escaping from
    the scene of battle, Losses included the Musashi, one of the two most modern battleships,
    possibly the two greatest and most heavily armored ships afloat whilst the five
    heavy cruisers sunk and three out of action with major damage represented more
    than half the strength in which no additional ones had been added to the fleet
    since the commencement of hostilities.


