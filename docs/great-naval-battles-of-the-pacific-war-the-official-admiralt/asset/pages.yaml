  md: '94 Naval Battles of the Pacific War


    # 69. Destroyer Evertsen lost


    The Dutch destroyer Evertsen had been directed to accompany the Perth and the
    Houston, but she did not sail with them, not until about two hours later. About
    midnight on 28 February, the Evertsen reported a sea battle in progress off St.
    Nicholas Point, at the northern entrance of Sunda Strait. Sometime later, she
    reported that she had been intercepted by two cruisers and beached herself in
    a sinking condition on Sebuku (Seboekoe) Island, off the south coast of Sumatra.


    # 70. Perth and Houston sunk


    The sea battle reported by the Evertsen was evidently the one fought by the Perth
    and the Houston. They were sunk at 0035, 1 March, in a night action lasting about
    an hour and a half, ''off Batavia''. The enemy force comprised two 7.8-in. cruisers
    and 10 destroyers.


    The only damage sustained by the enemy was to three destroyers, the Shirayaki,
    the Shikimani and the Harukaze. The Shirayaki received ''a shell hit put out the
    control station and [her] aerial communications ... put out of action. Torpedo
    being carried out relaying (for control) on an emergency bamboo sweeping tube''.
    The Shikimani''s prop propeller was damaged by a near miss. The Harukaze suffered
    damage and casualties from shell fire and consequently fired only five torpedoes
    instead of six.


    The odds were overwhelming, and during the action 42 torpedoes were fired at the
    Perth and at the Houston. Each of the Allied cruisers seemed to be hit by a total
    of four torpedoes, the *Japanese Report*.¹ This report also states that the naval
    engagement took place in an area very close to their own convoy anchorage, they
    were apprehensive of inflicting damage on their convoy and minesweepers, and subsequently
    several torpedo wakes were seen, believed to have been fired by their own cruisers.
    The convoy had just been escorted to the anchorage when the Allied ships were
    sighted, the flagship ordered, ''The enemy is to the east, attack!'' Presumably,
    because there was no time to form in any organized disposition, the attack was
    made by small sections or by individual ships.


    Nothing further had been heard from Captain Waller, but of the *Perth*''s complement,
    22 officers and 285 ratings were picked up by the Japanese. No precise details
    of survivors of the *Houston* have been received.²


    ¹ Survivors from the *Perth* state that the ship was abandoned in a sinking condition
    after the third torpedo hit.


    ² Survivors from the *Houston* ''numbered upwards of 300 officers and men'''
