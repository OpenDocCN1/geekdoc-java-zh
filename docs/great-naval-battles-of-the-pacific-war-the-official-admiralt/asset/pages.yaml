  md: '# 4 Great Naval Battles of the Pacific War


    but it entailed a tactical offensive and resulted in a situation the opposite
    of that it was intended to bring about; instead of strengthening the Japanese
    position, the attempt at expansion actually weakened it. Losses were incurred
    which could not be made and consequently hampered future operations, and the eventual
    return to the original plan found the Japanese with insufficient range remaining
    to carry it through successfully.


    The first operation in the expansionist plan was the capture of Port Moresby to
    form a southern outpost in the Japanese defensive system. The Japanese were already
    established on the north-east shore of New Guinea. Establishment on the Gulf of
    Papua would deprive the Allies of a potential base within range of the main Japanese
    base at Rabaul (New Britain) and place the Japanese in a position to dominate
    the entire island of New Guinea, if they desired, to threaten northern Australia,
    even though in their present mood of inflated morale, they apparently did not
    contemplate this later eventuality.


    Whilst en route to Port Moresby the expedition was to seize Tulagi in Florida
    Island, South Solomans, and establish a seaplane base at Tulagi, which was lightly
    held by Australian forces, and was strategically important point from which the
    main line of communications from the USA to Australia and New Zealand could be
    attacked. It had one of the best harbours in the South Solom.


    # 2. Japanese Naval Forces


    The greatest conquests already made by the Japanese found them with their naval
    military and air strength unharmed, and that of the Allies severely reduced. In
    the air and on the ground the Japanese losses were insignificant; shipping sunk
    to date amounted to less than 300,000 tons; and losses of major vessels were no
    more than five destroyers being sunk.


    On the other hand, the attempt of the Allies to withstand the Japanese advance
    in Malaya and the Netherlands East Indies had resulted in the piecemeal destruction
    of the Dutch and British forces in the south-west Pacific and the withdrawal of
    the United States Asiatic Fleet to Australian and South Pacific bases, while even
    in the more distant waters of the Indian Ocean the Eastern Fleet had been compelled
    to withdraw from the Ceylon area, thus enabling the Japanese to proceed with their
    war plan in the Pacific unhampered by a vulnerable western flank.


    A feature of the Japanese operations, which was to set the pattern for the Pacific,
    was the spearhead employment of carrier-borne aircraft with battleship and cruiser
    support. Japanese carrier-borne aircraft had caused'
