    # 24. Japanese evacuate Guadalcanal


    The last week of January,1943, saw an intensification of the enemy air activity
    in the Solomon area. There were also indications of a movement of Japanese naval
    forces towards the Southern Islands, and Vice-Admiral Halsey ordered his forces,
    including battleships and the carriers *Saratoga* and *Enterprise* to take up
    positions suitable for interception. At the same time, a force of cruisers and
    destroyers, with two auxiliary carriers — Task Force 18 — was to cover an American
    troop convoy for Guadalcanal. Task Force 18 left Efate on 27 January, and reached
    a position to the south of Guadalcanal on the evening of 29 January, when it was
    attacked by Japanese torpedo planes. Two attacks were carried out, about


