    # 8. Organization of the US forces


    The Americans were well aware that if their appreciation of a Japanese intention
    to attack Midway was correct, the situation was most serious. Midway was unable
    to defend itself without support; their carriers were far away, and perhaps only
    two would be in fit to time in fight. Task Force 17 had already been recalled
    to Pearl Harbor for replenishment and repair of the Yorktown. Task Force 16 was
    now immediately ordered; it arrived at Pearl Harbor on 26 May and sailed on the
    28th under Rear-Admiral R. A. Pruance, for a rendezvous north-east of Midway.
    Task Force 17 reached the base on 27th and excellent work by the Navy Yard, the
    Service Force, and supporting services placed the Yorktown and her aircraft in
    reasonable fighting condition in three days; and the force sailed on the 30th
    for the rendezvous, under Rear-Admiral F. J. Fletcher.


    Task Forces 16 made rendezvous at 1530 on 2nd June as arrived in 32° 04'' N, 172°
    45'' E., about 350 miles north-east of Midway, having fueled at sea route; and
    the combined force, under the command of Rear-Admiral Fletcher, operating about
    10 miles to the southward of Task Force 17.'
