    # 5. Battle of the Eastern Solomonons, 25 August 1942


    Atbreak, 24 August, Vice-Admiral Fletcher was toward 50 miles to the eastward
    of Maramasike (Malaita Island); the Wasp, some 250 miles to the southward had
    just commenced fuelling. When the reports from the dawn air reconnaissance began
    to come, they showed that a wide-spread movement was under way. Five ships in
    convoy, escorted by a cruiser, to the south of Bougainville; two cruisers and
    destroyers were reported in the New Georgia-Yabel, and later strong naval forces
    including at least one aircraft carrier was sighted steering to the southward
    toward Ontong, Java, some 300 miles north of the American carrier groups. Vice-Admiral
    Fletcher ordered steam for fuel, preparing air strikes to send against the enemy.²
    The aircraft enemy reports were confusing, and they were not amplified or kept
    to date. It was clear, however, that there was a considerable naval force, including
    at least one carrier to the northward, and that it was apparently organized in
    groups, spread roughly east and west.


    Meanwhile the American Force had been under observation by Japanese craft 1100³,
    or there could be no doubt that the Japanese Commander was receiving full and
    frequent reports of its movements. The information received by Vice-Admiral Fletcher,
    on the other hand, was so vague at 1300, August, he ordered the Enterprise to
    send out a search group, and a force of 29 bombers and torpedo-bombers was flown
    off to the northward. Half an hour later a similar force was launched from the
    Saratoga, with orders to attack the carrier reported during the forenoon. At the
    same time (1330), the Saratoga''s radar detected a large group of unidentified
    aircraft bearing 350°, distant 112 miles, flying in the direction of Guadalcanal.
