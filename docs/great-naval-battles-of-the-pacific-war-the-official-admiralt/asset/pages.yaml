    # 4. Organization of the Japanese expedition


    The Japanese force for the MI (Midway) Operation comprised the main strength of
    the Japanese Combined Fleet and was organized in groups; the Main Body, Striking
    Force, and Occupation Force, under the command of Admiral I. Yamamoto.


    # OCCUPATION FORCE


    Midway Island is very small, and no more than six transports were needed to carry
    the special naval landing force, consisting of some 1,500 marines for Sand Island
    and 1,000 Army troops for Eastern Island, with engineers and auxiliary units.
    Two seplane carriers conveyed the 11th Air Flotilla which was to establish the
    seabase at Curé Island. Close escort of this transport unit was carried out by
    the 2nd Destroyer Flotilla, consisting of the light cruiser Jintsu, flagship of
    Rear-Admiral R. Tanaka who commanded the unit and its escort, and 11 destroyers.
    A tanker was in company.


    The assault forces apparently were ill-supplied with landing boats. They carried
    many different kinds but were not sanguine as to the ability of most to cross
    the reefs, in which case rubber boats were supposed to be used. Distant cover
    for the force was provided by the 2nd Fleet, formed at this date by part of the
    3rd Battle Squadron (Kongo – flagship of Vice-Admiral Kondo, Commander-in-Chief
    of the Occupation Force – Hiei), the 4th Cruiser Squadron (Atago and Maya), 5th
    Cruiser Squadron (Myoko and Haguro) and the 4th Destroyer Flotilla (light cruiser
    Yura and seven destroyers). A supply group and tankers accompanied the 2nd Fleet.
    The four cruisers of the 7th Cruiser Squadron (Kumano, flagship of Rear-Admiral
    T. Kurita, Suzu, Mikuma and Mogami) constituted a support force which took a position
    between 75 and 100 miles ahead of the transports during the approach to Midway.
