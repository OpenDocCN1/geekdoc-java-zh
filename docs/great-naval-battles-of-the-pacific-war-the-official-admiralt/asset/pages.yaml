    # Note on Sources


    +   1. This account of the Battle for Leyte Gulf is based mainly on American Action
    Reports supplemented by the interrogation of certain Japanese officers. Only two
    British ships, HMAS Shropshire and HMAS Arunta, were engaged; both rendered reports.
    The list of American reports which can be traced as having been furnished to the
    Admiralty, is far from complete. In particular, the dispatch of Admiral Halsey,
    Commander Third Fleet, has not been seen.


    +   2. An account of the Battle for Leyte Gulf is contained in Annex A of Operations
    in the Pacific Ocean Areas during the Month of October, 1944 (Commander-in-Chief
    Pacific Fleet and Pacific Ocean Areas, 31 May, 1945). This is referred to in this
    Battle Summary as ''C-in-C, Pac., Report.'' It contains some information which
    is not available elsewhere to the compilers of this battle summary, but where
    discrepancies occur, the date of issue, 31 May, 1945, i.e., before the defeat
    of Japan rendered enemy sources available, should be born in mind.


    +   3. Extracts from some of the Action Reports which have not been received by
    the Admiralty are printed in *Secret Information Bulletin No. 22 – Battle Experience
    – Battle for Leyte Gulf, 23rd/27th October, 1944* (US Fleet, Headquarters of the
    Commander-in-Chief, 1st March, 1945); and . . under the heading ''Commander Third
    Fleet (Supporting Force)'' reports in part there are included which as are presumed
    to be extracts from Admiral Halsey’s dispatch and are quoted as in this narrative.
    The extracts stop short at 0730 on 25 October. *Secret Information Bulletin No.
    2* also contains plans, photographs and explanatory matter by the compilers by.


    +   4. In many of the original action the pages have been renumbered consecutively
    throughout hand by the photostat film. When referring to action reports in this
    Battle Summary the continuous pagination is used.


    +   5. The Japanese official account of the battle is contained in ''The Campaigns
    of the Pacific War'' (United States Strategic Bombing Survey (Pacific)), Naval
    Analysis Division (Government Press). Interrogations of officers concerned in
    the battle have been printed by the (US) Naval Analysis Division under the title
    *United States Strategy Bombing Survey [Pacific] Interrogations of Japanese Officials.'
