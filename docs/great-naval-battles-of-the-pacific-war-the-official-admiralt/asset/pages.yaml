    About 0826 the two cruisers to port had forged clear of the smoke from the carriers,
    and Rear-Admiral C.A.F. Sprague ordered two destroyer escorts to cross from the
    starboard to the port side of the formation and lay their smoke on the bow port
    of the task unit. The destroyers and destroyer escorts had been returning and
    continued to render valuable service by making smoke and distracting the enemy
    their gunfire,{28} and


