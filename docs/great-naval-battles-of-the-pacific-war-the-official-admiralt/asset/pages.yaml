    # 76. Vice-Admiral Helfrich resigns command


    Later in the day, Vice-Admiral Helfrich sent for Rear-Admirals Palliser and Glassford,
    and formally resigned the command of British and American naval forces in the
    ABDA area. These forces thereupon reverted to the respective commands of Commodore
    Collins and Rear-Admiral Glassford. The surviving Dutch vessels were to proceed
    to Colombo.


    # 77. US warships leave Java


    Rear-Admiral Glassford at once ordered all US surface ships of his command, then
    in Java waters, to proceed to Australia. At Tilatjap were two destroyers, the
    Pilibury and the Parrot; four gunboats, the Tulsa, the Asville, the Lanaka and
    the Isabel; and two minesweepers, the Whippoorwill and the Lark. The two destroyers,
    the Whipple and the Edsall, were operating out of Java. A cruiser, the Phoenix,
    was en route for Java, as a submarine tender, the Otus. Of these ships, the Edsall,
    the Pilibury and the Asville have not been heard of and are considered lost. Rear-Admiral
    Glassford, with his staff, left Bandoeng for Tilatjap by car. Then ''he proceeded
    to Australia by plane, while others followed by plane and submarine.


    # 78. British warships diverted from Tilatjap


    About 1600 on 1 March, two Australian minesweepers, the Burnie and the Bendigo
    arrived at Tilatjap, and refueled. In 1900, Commodore Collins''s staff, accompanied
    by Rear-Admiral Palliser, also arrived. A signal was immediately made, as from
    Commodore Collins, on HMAS Bendigo''s W/T, ordering all British warships to avoid
    Tilatjap, and to make for Fremantle or Colombo.


    # 79. British warships leave Tilatjap


    British officers and ratings remaining were embarked in SS Zaandam and USS Scabelle
    were already full of evacues; both ships sailed before midnight on 1 March, the
    destroyer HMS Stronghold having sailed earlier, with instructions to escort the
    Zaandam. Survivors and details continued to arrive at Tilatjap.


    At 2015 ''a party of 75 survivors of the Jupiter arrived at Tilatjap by train
    from Surabaya, and at about 2030, Commodore Collins arrived at Batavia. At 2200,
    HMAS Bendigo sailed with the Jupiter''s survivors and the majority of the Commodore''s
    staff. At 0130 on 2 March, a car convoy from Batavia'
