  md: '# Great Naval Battles of the Pacific War


    The Japanese were guilty of the fatal omission to scout to the eastward of their
    striking force prior to launching their air attack on Midway, their planning having
    been based on the assumption that they need not fear for the very thing that destroyed
    them, namely carrier air attack. There were two marked failures of co-ordination
    in the US air attacks on 4 June. The first was apparently due to lack of time
    not permitting adequate study and thought. On the morning of the 4th all four
    groups of Midway aircraft, B.26s, the Navy torpedo aircraft (TBF) and the Marine
    dive bombers, though blown off at the same time, attacked separately between 0710
    and 0720. Experience indicated that they had attacked together there would have
    been greater likelihood of damaging the enemy.


    The second instance, the failure to co-ordinate the carrier dive bombing and torpedo
    attacks between 0920 and 1025, had been so successfully done at the Battle of
    the Coral Sea a month earlier, probably had little effect on the damage caused
    to the Japanese, though it resulted in the loss of 35 out of 41 torpedo aircraft.


    The escape of the Japanese main body and survivors of the striking force, without
    being brought under attack by Force 16 bombers on 5 June, consequent to Rear-Admiral
    Spruance standing to the eastward during the first part of the previous night,
    can certainly be attributed to the orders of the Commander-in-Chief, US Fleet,
    not to risk ships unduly, and to the fact that the Americans were defending a
    fixed point, and had been warned against a probable enemy trap.


    Midway was the only defensive battle of the war in the Pacific in which American
    submarines were extensively employed. Lack of search radar for night shadowing
    was held to be a primary reason for failure; directional (SJ) radar was installed
    in most of the submarines within a few months.


    # Effects of the battle


    The Americans repulsed the attempted invasion of Midway at a cost of the Yorktown
    and Hammann sunk 307 and 150 aircraft lost. The Japanese lost the carriers Akagi,
    Kaga, Hiryu and Soryu and the heavy cruiser Mikuma; while the heavy carrier Mogami,
    the destroyer Arashio, and tanker Akebo Maru suffered major, and the destroyer
    Tanazaki, minor damage. Losses of Japanese officers and members were about 3,500
    and aircraft 253.


    The loss of four carriers, 250 naval aircraft and 100 pilots was crippling to
    the Japanese. The striking force with which they had achieved their conquests,
    and on which they relied to repulse American attempts to counter-attack, was destroyed.
    Their shipbuilding capacity and air training organization were too'
  merge: -1
  pgno: 175
- img_proc: true
  md: 'limited to enable them to make good their losses, with consequential effect
    on their future operations throughout the war.


    This great American victory completely reversed the strategic situation in the
    Pacific. It put an end to the long period of Japanese offensive action, removed
    any threat to India, stopped Japanese expansion to the east, and saved Midway
    Island as an important US outpost. It was perhaps the decisive battle of the war
    in the Pacific.'
