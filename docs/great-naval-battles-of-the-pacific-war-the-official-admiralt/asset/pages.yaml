  md: '# Chapter I


    # First Japanese Offensive


    1. Introduction


    The campaign for the capture of Guadalcanal represented the adjacent area, which
    opened with assault landings by US Marines on 7 August, 1942, and closed with
    the final withdrawal of the Japanese in the first week of February, 1943, was
    of great importance in the whole war in the Far East. Apart from the intrinsic
    value of the area to both sides, owing to its strategic importance, this was the
    first offensive operation undertaken by the Allies after the impetus of the initial
    Japanese rush to the south had been checked. Hitherto, the effects of the surprise
    attack on Pearl Harbor and the years of pre-war preparation had given the initiative
    to the Japanese: the role of the Allies had been restricted to attempts to delay
    the enemy, usually with totally inadequate forces hastily assembled to counter
    particular dangers as they occurred. The Guadalcanal campaign represented the
    first trial of strength, and as a foretaste of things to come. Would the Americans
    working from distant bases be to consolidate their position obtained by the surprise
    of 7 August? Or would the hitherto invincible Japanese army with its high standard
    of efficiency and experience of combined operations be to recover what it lost?
    It took six months to obtain the answer to these questions. During that period,
    four major attempts were made by the enemy to re-capture Guadalcanal, while minor
    operations to reinforce and supply the troops on shore were carried out continuously
    by both sides. Desperate fighting at sea, in the air and on land place, in which
    very heavy losses were suffered by both sides. At one time the enemy came within
    an ace of success.


    This battle gives some account of the salient features of the naval operations
    of the campaign. No detailed analysis of the actions has been attempted, partly
    because sufficient information is not yet available and partly because such detail
    is outside the scope of a general survey of the campaign as a whole.


    The original American landings at Tulagi and Guadalcanal took place on 7 August,
    1942. The enemy were taken completely by surprise, and by 10 August, Tulagi was
    firmly in American hands and all the Japanese'
