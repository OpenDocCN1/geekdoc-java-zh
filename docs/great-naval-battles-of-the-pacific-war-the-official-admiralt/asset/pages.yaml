  md: '# Chapter X


    # Results Of The Battle


    76. Victory – but not annihilation


    Five days of co-ordinated fighting by American naval submarines, Allied surface
    vessels and American aircraft had ended in a decisive defeat of the Japanese Fleet.
    Apart from its battleships, four carriers, 10 cruisers and eight or nine destroyers,
    almost every important unit was damaged to a greater or less degree, so that the
    fleet was crippled and heretofore strictly auxiliary. For the Japanese naval air
    force, the battle spelt disaster and the beginning of the end: it became a purely
    defensive force relying upon a weapon of despair, the suicide bomber, which had
    been tried out and achieved by surprise a single initial success in sinking the
    escort carrier St. Lo on 25 October. This, with the light carrier Princeton, a
    second escort carrier (the Gambier Bay) two destroyers, a destroyer escort, a
    motor torpedo boat and a submarine, constituted the total and comparatively insignificant
    losses in the five days fighting.


    The battle settled the fate of the Philippines. For a few weeks their land-based
    aircraft continued to give the Japanese control of the air over Leyte Gulf. Under
    this cover they ran in a number of convoys of reinforcements which enabled resistance
    to be prolonged. But any serious interruption of the Allied operations was heretofore
    out of the question.


    Nevertheless, the failure to destroy completely the Japanese fleet was to cost
    the Allies a vast effort in the months to come, and it was not until July of the
    following year that the final seal was set upon the work begun at the Battle for
    Leyte Gulf.'
