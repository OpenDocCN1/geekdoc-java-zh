    # APPENDIX G


    Last sighting of the enemy on 97 February, 942


    The last time recorded in the Captain of the Perth’s report refers to the sighting
    of two enemy cruisers on the port beam at 2230/27 and it said the time of sighting
    is of importance. Captain Waller was quite definite about it and said that the
    Houston referred to the two ‘at the same moment’. Captain Waller’s report cannot
    lightly be disregarded, for throughout the whole report the almost every important
    incident in the battle, and particularly the times of sighting the enemy, were
    carefully noted; yet after 2230, Captain Waller recorded no other time, nor any
    subsequent sighting of the enemy. It is also evident from Captain Waller’s report
    (which comprised 16 numbered paragraphs), that the two Dutch cruisers were torpedoed
    shortly after the sighting, as both incidents, i.e. the sighting and the torpedoing,
    are recorded in his paragraph numbered 14.


    No mention, however, is made by the Dutch, American, Melbourne or Commodore Collins’
    report of Captain Waller’s sighting at 2230. On the other hand, all these four
    reports mention, or if there was, a sighting of the enemy at, or around, 2315
    or 2330; thus:


    +   (a) The Dutch Account, p.16, states that 2315, Admiral Doorman signalled ‘Target
    to port 4 points’.


    +   (b) U.S.C.N. p.75, states that 2315, the De Ryter signalled Target for 4 points’.


    +   (c) The Melbourne Report, p.7, states that two enemy cruisers were sighted
    on the port beam at 2315.


    +   (d) Commodore Collins’ report, p. 3, states, ‘At 2330GH, contact was made
    with two cruisers on the port beam of the Allied force … and of this time 2330GH,
    in a message, 0123/10 March, when reporting this phase of the battle.


    None of these four reports, however, on what authority this time of sighting,
    2315 or 2330, is based. It seems based on Captain Waller’s report of having passed
    the Kortenaar’s survivors (at approximate position 06° 25’ S., 112° 08’ E at 2217)
    and on his subsequent report that the De Ryuter and the Java were ‘disabled’ in
    ‘06° S., 112° E’, i.e., 25 miles, or about one hour’s steaming, to the north.
    If so, the probability that the position 06° S., 112° E. was only an approximation.
    At the time when these reports were compiled, the Japanese Report, with the Japanese
    statement that they sank the Dutch cruisers 20 minutes after they sighted them,
    which tends to confirm Captain Waller’s report, was not available.'
