    The weather during the early part of the night was very fine. The wind was easterly,
    average seven knots, temperature 84°, the sky partly cloudy, sea smooth. In the
    bright moonlight visibility was at least 8,000 yards, but the moon set at 0007,
    before the enemy reached the Strait, local squalls then visited the area bringing
    low overcast clouds and a dark, black night with zero visibility interrupted only
    by intermittent lightning flashes.


    # 29. Contact with the Enemy, 2310 24 October. The PT Boat Attacks


    Vice-Admiral Nishimura was ahead of schedule. In the original plan, he was to
    enter the Surigao Strait about an hour before daylight on the 25th, he decided
    to advance the time by some four hours and make his approach at about 0200, this
    gain was subsequently lost through delay caused by the Enterprise''s air attack
    at 0905 on the 24th. He duly informed Vice-Admiral Kurita of his change of plan,
    but too late on the 24th for the latter to order him to conform to the original
    plan.


    During the approach Vice-Admiral Nishimura at 2100 on 24th, when south of Boho
    Island, detected the Mogami with the destroyers Michisio, Yamaguchi and Asagumo,
    to practise ahead of the battleships; they appeared as far as Pana Island, then
    returned and rejoined the flagship about 2330 on the 24th when the approach disposition
    was assumed, with two destroyers and one each of the heavy ships, being line ahead
    in the order Yamashiro, Fuso, Mogami.


    The first local contact with Vice-Admiral Nishimura''s force was made by PT 131,
