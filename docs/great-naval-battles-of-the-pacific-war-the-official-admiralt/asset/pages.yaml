    # The Battle of the Java Sea, 27 February 1942


    15. Opposing naval forces


    The Allied naval force, known as the Combined Striking Force, engaged in the Battle
    of the Java Sea, consisted of five cruisers and nine destroyers. This was composed
    of one US! and one British 8-inch cruisers and two Dutch and one Australian 6-inch
    cruiser, with four US, three British and two Dutch destroyers.


    The Japanese naval force confronting Rear-Admiral Doorman on 27 February is estimated
    to have four 7.8-in. cruisers, three 5-5-in, cruisers, and 17 destroyers.


    16. Departure from Surabaya, 1830


    Rear-Admiral Doorman having decided to make a sweep to the east along the north
    coast of Madras as far as Sapoeri Strait, and if the enemy were not sighted, to
    sweep west and search the bight of Toeban, sailed from Surabaya at 1830 on 26
    February, through the *Westerawater* (Western Channel), towards the Java Sea.
    His ships were disposed in line ahead (in succession) as follows: two Dutch destroyers,
