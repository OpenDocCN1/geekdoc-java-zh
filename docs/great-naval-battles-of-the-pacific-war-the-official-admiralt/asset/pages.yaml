    # 8. Second air strike at Tulagi, 1115 4 May


    By 1036 all aircraft were back on board the York and the serviceable machines
    had been reared and refuelled and a second group was dispatched to attack. This
    group comprised 14 bombers, 13 reconnaissance and 11 torpedo aircraft, the squadrons
    proceeding independently as before. The bombers attacked first. About five miles
    north-east of Savo Island they sighted what were taken for three gunboats but
    were probably landing barges, making the best of their way from Tulagi, for every
    ship that could steam was getting out of harbour. The 14 bombers attacked (1115)
    in three sections of 5, 5, and 4, each section taking one landing barge, two of
    which they blew to pieces with direct hits. The third escaped for the moment by
    manoeuv but was shortly afterwards to a sinking condition by strafing and later
    been breached.


    The reconnaissance covered the area to the west and north-west of Florida Island,
    sighting the semarine carrier and a destroyer steering between Tulagi and Savo
    Island, and a cargo ship standing out of Tulagi Harbour. The first of these was
    attacked (1210), two hits being claimed. The torpedo aircraft were divided tactically
    into two divisions, both of which attacked the target, at 1245. Six of them made
    their releases from ranges of 2,000 to 3,000 yards, target angle from 10 degrees
    on the starboard bow to broad on the port bow, the remainder attacking five minutes
    later, from 1,000 to 1,500 yards range, target angle abeaft the beam. The semarine
    carrier increased speed from 10 to 25 knots on being attacked and endured under
    full helm. None of the 11 torpedoes hit, the length of range at which they were
