    # 12. Japanese movements, 4–6 May


    The orders specified that the force was to operate generally in the Coral Sea
    over 700 miles south of Rabaul (i.e., outside the range of Japanese shorebased
    reconnaissance aircraft) until word received of an enemy advance, the anticipated
    date of which was given by the Commander-in-Chief, Pacific Fleet, at 7 or 8 May.
    On the 5th reports began to come from the C-in-C Pacific Fleet and the Commander
    South-west Pacific Area of the sighting of numerous ships in the New Guinea-New
    Britain Solomon Islands area. It was fairly established that three aircraft carriers
    were among them, but although almost every ship was reported, including (incorrectly)
    a battleship, the forces were scattered and there seemed to be no common direction
    of movement.


    Actually, the Japanese occupation force was engaged on the 4–5 May in effecting
    its final rendezvous in the Shortland Islands, in the north-west part of the Solomonons,
    in preparation for the advance on Port Moresby. In the morning of the 6th, it
    was sighted and attacked by a division of some five US long-range bombers (B.17s),
    about 150 miles south-west ofi, but no hits or damage. The course of the enemy
    indicated that the invasion fleet would pass through Jomard Passage, in the Louisiade
    Archipelago, the south-east prolongation of New Guinea, with Port Moresby as its
    probable objective, and establish a base in the Debye Islands in the Louisiades.


    By the morning of 6 May, however, the Japanese came to the conclusion that the
    Allied air reconnaissance had been sufficiently thorough to discover their intentions.
    When, therefore, on this morning one of their reconnaissance aircraft sighted
    the Allied task force, the Occupation Force transports were ordered to retire
    towards Rabaul and orders went out for the escorting naval units to connect with
    the support force for attack on the Allied force. The order to retire seems to
    have been rescinded during the afternoon, and the transports steered once more
    for the Jomard Passage.'
