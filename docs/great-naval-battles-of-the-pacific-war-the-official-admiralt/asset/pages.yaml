    By arrangement with the Dutch authorities, SS General Verspych was made available,
    and 41 officers, 108 ratings, HBM Consul-General at Batavia, and 27 other British
    students were embarked in her. The end was not approaching, and the remaining
    British naval officers and ratings were embarked in HMAS *Burnie*, for passage
