  md: 'Japanese on the Defensive 219


    The importance of the victory can hardly be over-estimated. Both strategically
    and tactically the enemy had been out-manoeuvred and outfought with the Southern
    Salomons firmly in American hands, the vital line of communications between America
    and Australia was safeguarded, and the first stepping stone secured on the 3,000
    mile route leading through the Bismarck Archipelago and Mandated Islands to China
    and Japan.


    # APPENDIX


    # ''Phantom'' Contacts


    As experience in night fighting, it was found that ships were liable to open ''phantoms''
    i.e, their own shadows, thrown by gun flashes from other ships or illuminants,
    on low cloud banks. Rear-Admiral Ainsworth, USN, remarked as follows on this phenomenon
    in his report on the bombardment of Munda: This matter of firing at one''s own
    shadow is so much real than can first seem possible. With everyone on their toes
    and all look-outs alerted, we are all prone to see things which do not exist,
    and these black shadows reflected on cloud masses near the horizon certainly appear
    to be enemy ships. The St. Louis, going across the range, was a ball of fire on
    the *Nashville*''s port quarter, and the *Nashville* opened fire on a phantom
    torpedo boat on her starboard. The *Fletcher* likewise almost fired a half salvo
    of torpedoes at her own silhouette. It may well be probable that several of our
    reports of enemy ships sunk in night engagements may be in error from this cause.
    Here, again, it behooves us to put our faith in SG and, if time permits, check
    the phantom before opening fire.'' Captured documents show that the Japanese have
    experienced similar troubles. For example, one of their destroyer squadrons reported
    chasing American destroyers and torpedo boats out of the area during the battleship
    bombardment of Guadalcanal on the night of 13–14 October, in point of fact no
    surface forces were present on this occasion.'
