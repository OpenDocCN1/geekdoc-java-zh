    the detachment in Sulu Sea (Southern Force) approaching Surig Strait, the main
    body (Centre Force) in the Sibuyan Sea steering for San Bernardino Strait, and
    the northern carrier were all proceeding at moderate speed. The inference was
    that there was a predetermined rendezvous of geographical location and time; a
    co-ordinated plan was being followed, with 25 October as the earliest date of
    concerted action.


