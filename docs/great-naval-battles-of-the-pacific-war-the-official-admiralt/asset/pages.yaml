  md: '# JAVA SEA


    27 FEBRUARY 1942


    # CORAL SEA


    4-8 MAY 1942


    # MIDWAY


    4-7 JUNE 1942


    # GUADALCANAL


    12-15 NOVEMBER 1942


    # LEYTE GULF


    23-26 OCTOBER 1944


    ![](img/711727cca1606768c15f04c2052d1d95_367_0.png)


    > ''Seldom in war can a situation have been more swiftly and suddenly reversed;
    within a few minutes three out of four of the carriers had been reduced to flaming
    wrecks and Japanese sea power suffered a blow from which it never recovered for
    the remainder of the war.''


    Battle of Midway, Action 4 of June


    > ''Fifty minutes after the opening of the engagement, the order “All forces attack”
    was given. An enemy ship blew up and sank, their formation fell into confusion,
    and they gradually began to reverse [their] course and retreat under cover of
    a heavy smoke screen.’ Sixty-six torpedoes were fired just 14 minutes during this
    attack.’


    Battle of the Java Sea, Japanese Report


    > The hours were pregnant with history, for the coming day was to seal the fate
    of an empire. Slowly, Admiral Halsey steamed into the night, preceded by planes
    probing relentlessly for the next antagonist hidden in the northern darkness.
    Behind him the jaws of the Japanese pincers strained to close on the defenseless
    shipping off the Leyte landings: for that midnight hour when the American Third
    Fleet completed its concentration and set course for the north Kurita, braiding
    the dangers of reef and mine and driving at 20 knots through San Bernardino Strait
    was making towards Leyte; whilst to the south of Nishimura, his eyes on the same
    objective, was approaching the Surigao Straits whose were to be his winding sheet.’


    Battle of Leyte Gulf


