    By the close of the day the disembarkation of the 7th Marines, with all its weapons,
    essential equipment, most of its motor vehicles, three units of fire and 40 days’
    rations had been completed. In addition, also 150,000 gallons of needed petrol,
    oil and stores had been landed at the three beaches from three auxiliaries which
    arrived during the day. At 2030 all ships got under, and drew through Lengo Channel,
    arriving at their bases without incident between 20 and 22 September.


