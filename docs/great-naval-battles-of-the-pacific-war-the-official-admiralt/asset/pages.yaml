    Undeterred by their defeat at the Battle of Cape Esperanza, the Japanese continued
    to press on their preparations for their third great assault on Guadalcanal. They
    still enjoyed local command of the sea by night, and two nights after the engagement
    (13/14 October), a force of two battleships, a light cruiser and eight destroyers
    bombarded Henderson’s Field for an hour and twenty minutes, destroying a large
    number of aircraft. The bombardment was repeated with less effect by cruisers
    and destroyers on the two succeeding'
