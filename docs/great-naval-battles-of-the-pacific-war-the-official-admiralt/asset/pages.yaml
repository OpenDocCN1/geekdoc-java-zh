    # 50. Enemy Destroyers Again Approach, 0830


    About 0830 the Kalinin Bay, one of the remost ships of the formation, sighted
    five destroyers on the starboard quarter, approaching head-on in column. They
    were first thought to be friendly units coming to assist, until they opened fire
    at a range of approximately 14,500 yards. At the time, the enemy cruisers attacking
    from the port quarter were obscured from view by the smoke screen laid by the
    American escorts, and the Kalinin Bay shifted the fire of her 5-in. gun to the
    destroyers, when the range down to 10,500 yards, were definitely recognized as
    of the Terutsuki class.


    The enemy cruisers continued their attack. Kalinin Bay, being between two fires
    were unable to use evasive courses and was hit by the Japanese cruisers several
    times at their period. Since, however, the five destroyers the range rapidly she
    continued to direct fire on them and never again during the action shifted back
    to the cruisers. Presently some of the American escorts closed the latter and
    apparently caused them to turn away somewhat, for the range from the Kalinin Bay
    began to open.


    The firing of the Japanese destroyers appears to have been wild, and no hits are
    recorded. The Kalinin Bay made a direct hit on one of them after 0930, causing
    the vessel to be immediately enveloped in white smoke; and about the same time,
    they made some radical maneuvers and commenced to withdraw, firing as they went.
    It was probably at this juncture that they fired the salvo of torpedoes which
    was a few minutes later.


