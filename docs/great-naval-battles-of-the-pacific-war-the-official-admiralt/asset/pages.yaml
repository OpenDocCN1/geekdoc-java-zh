  md: '28 February/1 March, and on 9 March the Netherlands East Indies formally surrendered.


    The calamitous outcome of the battle of the Java Sea was due to several factors.
    Primarily, it was due to the ability of the Japanese to concentrate greatly superior
    forces of all arms in the areas aimed at. Equally significant, however, was the
    insufficiency of Allied reconnaissance and fighter fighter planes, which left
    the enemy fleet free to make full use of its air for reconnaissance and spotting,
    which left the Allied naval forces were left without any assistance whatsoever.


    A third handicap was the constitution of the Allied striking force which was composed
    of American, British, Australian and Dutch ships, which had been assembled only
    24 to 48 hours before the battle was joined. Apart from the language difficulty,
    the striking force had never worked together as a fleet; plans had to be hastily
    made, and consequently, the efficiency of signal communications was a matter of
    much greater importance than it would normally have been in a well-organized,
    trained fleet. Unfortunately, the signalling system was inadequate, the flagship''s
    signalling apparatus rendered useless by the vibration of her gun fire, and she
    was reduced to the primitive method of hand signals.


    Last but not least, the Allied command was the outcome of a staff organization,
    perceived in haste, and never fully developed, the outstanding feature of which
    was an complete lack of co-operation between the air and the naval services. This
    led to delay in reporting vital information, to the absence of fighter planes
    which were being used for the protection of bombers carrying independent and uncoordinated
    attacks, and to the lack of any co-operation between the air command and the naval
    command, either ashore or at float. No occasion throughout this campaign for the
    defence of the Netherlands East Indies did any naval operation have the support
    of a single fighter plane.


    A brief account of the evolution of the short-lived Allied command in the South
    West Pacific, an area which came to be known as the ABDA Area, is therefore essential
    to an understanding of the battle of the Java Sea.


