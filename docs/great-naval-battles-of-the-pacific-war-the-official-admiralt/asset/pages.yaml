    Mitscher (Commander Task Force 38) and the commanders of Task Group 38.3 (Rear-Admiral
    Halsey) and 38.4, ordered at 0827, to concentrate off San Bernardino Strait on
    Task Group 38.2 (Rear-Admiral Bogan), in which his flagship, the New Jersey was
