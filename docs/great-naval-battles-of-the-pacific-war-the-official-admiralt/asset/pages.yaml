    # 25. Conclusion


    To sum up the campaign, the key to the whole position – as was recognized by both
    sides – was the possession of Henderson’s Airfield. Their original occupation
    of Tulagi, in April, 1942, the Japanese had allowed their sea and land forces
    to outstrip their air support, their nearest air base being at Rabaul – 675 miles
    away. Their carrier losses at the Battle of the Coral Sea, May, 1942, and Midway
    Island, June, 1942, accentuated this weakness, and the construction of an airfield
    on Guadalcanal was put in hand in July, 1942. The Americans, however, struck too
    quickly, and captured the well-completed airfield at the outset of their operations
    in August. After the cruiser suffered losses by the Allies at the Battle of Savo
    (8/9 August) the enemy enjoyed complete local command of the sea; but before he
    could gather his forces for a large-scale effort at re-capture, the establishment
    of American aircraft at Henderson’s Field wrestled from him command of the sea
    day. The enemy was thus faced with the alternative of operating by day within
    range of American shore-based aircraft, or of confining his operations to the
    hours of darkness. The great superiority in radar equipment enjoyed by the American
    surface rendered its operations by night as hazardous as by day; and the result
    was a steady drain on his naval and air strength, with no corresponding drain
    on that of the Americans. This eventually compelled him to acknowledge defeat.


    ¹⁸ Sunset, 1949.'
