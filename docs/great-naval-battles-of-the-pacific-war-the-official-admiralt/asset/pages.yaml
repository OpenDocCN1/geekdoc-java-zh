    the remainder with 1,000-lb bombs. The Lexington launched, nearly an hour later,
    from 0944 to 1013, a total of 25 scout bombers, 10 torpedo aircraft, and five
    escort fighters; the bombers carried 1,000-lb bombs, and the depth setting of
    the torpedoes was 10 feet. The distance to the enemy was about 160 miles.


