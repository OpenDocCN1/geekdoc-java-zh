  md: '# Chapter I


    # The Strategic Situation in April 1942


    1. Decision by Japan to expand the Defensive Perimeter


    The advance of the Japanese to the South and East after the attack on Pearl Harbor
    on 7 December 1941 was so rapid that in the space of four months they practically
    completed one of the basic plan for the greater East Asia army, namely the occupation
    of the Philippines, Guam, Hong Kong, Burma, and the rich British and Dutch lands
    in the South, possession of which was to render Japanese self-sufficient.


    By the middle of April 1942, a point had been reached at which phase two, the
    consolidation and strengthening of a defensive perimeter for the southern resources
    area and the Japanese mainland should have been put into effect. As originally
    conceived this perimeter consisted of the Kuriles, Wake Island, the Marshall Islands,
    Bismarcks, Timor, Java, Sumatra, Malaya and Burma.


    The unexpected ease with which the first part of the war plan had been carried
    out the Japanese to underestimate the present strength of the United States in
    the Pacific, just when deciding upon war, they had overestimated their own making
    capacity and under-estimated the huge Allied potential. Many of the leaders were
    persuaded that advantage should be taken of the present situation to embark on
    further expansion. The argument received reinforcement on 18 April 1942 when US
    Army bombers, flown from the aircraft carrier Hornet, raided Tokyo. No more than
    a token raid, it was used as an argument to point the need for additional bases
    to the East; and it was eventually decided that the defensive perimeter should
    be moved out to include the Aleutians, Midway, Samoa, Fiji, New Caledonia, and
    Port Moreby in south-eastern New Guinea.


    The decision proved irretrrievable mistake. The strategic sphere was already too
    late. Neither military strength, shipping, nor the Japanese military economy,
    were of calibre capable of supporting further expansion; and the attempt used
    up resources which should have been employed in consolidating the already huge
    gains.


    Vital areas were perforce left insufficiently organized for defence whilst operations
    were set in train for the capture of Port Moreby, Midway, and the Aleutians. The
    strategy that inspired these operations might be defensive,'
  merge: -1
  pgno: 10
