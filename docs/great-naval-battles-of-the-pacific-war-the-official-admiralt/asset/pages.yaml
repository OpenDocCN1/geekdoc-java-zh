    **37. Midway aircraft attempt night attack, 1900**


    After the Fortresses at Midway had been refueled and serviced, the eleven Marine
    dive bombers remaining in to fight were got ready. About 1700, when the report
    of the successful dive bombing attack on the Hiryu came in, Major B. W. Norris,
    commanding Squadron 241, was ordered to attack the enemy carrier, reported burning
    338 degrees 200 miles from Midway. In order to avoid enemy fighters, it was decided
    to make a night attack, and about 1830 to 1900 six SBDs under Captain M. A. Tyler
    and five SBD3 under Major Norris took off.

    Rain squalls were encountered, and at sunset cloud increased; and although the
    position of the Japanese had been reported with considerable accuracy and the
    striking force was still in the same general area where it had been engaged for
    some time in rescuing turning aircraft crews, the bombers searched without success.
    All aircraft returned safely except that of Major Norris, which plunged into sea
    on the return.


