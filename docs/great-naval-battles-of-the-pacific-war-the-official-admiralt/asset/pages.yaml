  md: '# Chapter II


    # The Action at Tulagi, 4 May 1942


    +   5. Allied Forces concentrate, 1–4 May


    US intelligence reports indicated that a Japanese airborne attack on Port Moresby
    might occur in the first week of May, and a concentration of the available Allied
    forces in the Coral Sea, Task Forces 17, 11, 16 and the Australian Squadron to
    oppose it, was accordingly ordered. Task Force 11 had left Pearl Harbor on 16
    April for Christmas Island; it was now diverted to the Coral Sea, where the Australian
    Squadron was to join up. Task Force 16 at Pearl Harbor was unable, in the event,
    to arrive before battle was joined.


    Task Force 17 and 11 made rendezvous as arranged at 0545 on latitude 16° 00''
    S, 16° 20'' E, some 300 miles west of the New Hebrides. Two of the three oilers
    used for servicing the fleet, the *Neos* and *Tippecano*, were in the area; Rear-Admiral
    Fletcher directed Rear-Admiral Fitch to meet the *Tippecano* with his escort the
    *Chicago* and *Perkins* in latitude 16° 00'' S., steering to re-join Task Force
    17 next morning, the intention to retain the *Neos* as a reserve and to send the
    *Tippecano* back empty to Efate (New Hebrides). Task Force 17 completed fuelling
    from the *Neos* on 2 May, Rear-Admiral Fitch reported that he did not expect to
    finish until 04th. With enemy action now reported imminent, Commander Task Force
    17 could not contemplate remaining so to the south-east; he set course to the
    northwest, directing Rear-Admiral Fitch to fuel his destroyers, if practicable,
    at night, on the same course and re-join Task Force 17 at daylight on 4 May in
    latitude 15° 00'' S, longitude 157° 00'' E, the position in which Rear-Admiral
    Crace had been directed to rendezvous with the *Australia* and *Hobart* from Australia.


    At 1515 on the 2nd, before the two tasks separated, one of the *Yorktown''s* reconnaissance
    aircraft sighted a submarine on the surface in latitude 16° 04'' S., longitude
    162° 18'' E., 32 miles to the northward, but in spite of being closely chased
    by three aircraft sent out to attack it, the enemy escaped. The Americans thought
    that they had been sighted and that wireless signals intercepted subsequently
    pointed to the probability of their position having been reported, but actually
    this was not so.'
