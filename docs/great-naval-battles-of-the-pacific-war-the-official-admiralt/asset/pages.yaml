    # 49. Sinking of the Gambier Bay, 0810 to 0911


    During all this time, the ships had been turning gradually to a south-westerly
    course, the effect of which, together with the differences of speed and the evasive
    maneuvers practised was to string out the disposition with the White Plains, the
    Kitkun Bay and the Fanshaw Bay in the lead, the St. Lo only 10,000 yards from
    the enemy forces astern at 0810, and the Kalinin Bay and the Gambier Bay on the
    exposed windward flank, for the protection of the smoke which drifted to starboard
    and aft (i.e., to the north-westward). As a result, the latter carriers became
    the principal targets. The Kalinin Bay was hit three or four times, from 0750
    once apparently, by a battleship, for fragments of a heavy shell were found on
    board but was not seriously damaged. Not so, however, the Gambier Bay. Between
    her and the enemy cruisers no screen remained to eliminate, and she had for some
    time under the 8-inch fire of three heavy cruisers and occasional salvos from
    the enemy main body. For a long she avoided one salvo after another by alterations
    of course; but at 0810 the ship received her first hit. Now onwards she was hit
    almost continuously in the flight deck and spaces above water. Few of these shells
    reached any vital part of the ship until about 0820 a hit below water in the forward
    engine room caused the abandonment of the latter seven minutes later and the ship
    slowed to 11 knots and fell astern.


    This was the beginning of the end for the Gambier Bay. By 0850 the ship, listing
    and on fire, was dead in the water, with three enemy cruisers firing at her point
    blank ranges, and her Commanding Officer, Capt. W. V. R. Vieweg, gave the order
    to abandon ship. At 0911 she sank in 11° 31'' N.,


