    # 73. Third Fleet Air Strikes, 26 October


    As instructed by the Commander Third Fleet, Vice-Admiral McCain steered during
    the night for the appointed rendezvous with Task Group 38.2, which was sighted
    at 0450 on 26th. At dawn, an hour later, launching of Combat Air Patrol, search,
    and the first strike commenced, for the triple purpose of a fighter sweep of the
    Visayas, a check of the Philippines to the west and south-west, and a composite
    strike of aircraft carrying torpedoes and bombs¹⁶ against the main body, which
    was expected to be found near the coast of Mindanao. Each carrier was instructed
    to expedite the departure of its strike, each group moving out separately as it
    had made rendezvous.


    At 0810 the strike leader reported the enemy, consisting of four battleships,
    two heavy cruisers, two light cruisers and 10 destroyers¹⁷ in Sabah Straits, 10
    miles north-west of the north of Panay Island. The second strike was launched
    immediately, and a third strike of 25 aircraft was sent out at 1245. This strike,
    composed of B.24 aircraft armed with heavy bombs made no hits nor any appreciable
    damaging near misses¹⁸


