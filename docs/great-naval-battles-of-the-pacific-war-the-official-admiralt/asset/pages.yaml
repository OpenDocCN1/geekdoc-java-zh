    the target could be located promptly and conditions favourable for recovery. The
    flight was picked up by Rear-Admiral Stump’s (CTU 77.4) radar and at 1255 was
    vectored by his flagship, the Natoma Bay, until the flight leader ‘tallyhoed’
    the enemy force at 1302. The force at this time was reported by aircraft to be
    in approximate latitude 12° N. some 15 miles off Samar Island, heading on a course
    330°, speed 25 knots, towards San Bernardino Strait.


    At 1255 Vice-Admiral McCain launched his second and last strike of the day. There
    was no still indication whether aircraft could land on Tacloban he was led to
    assume that the Japanese had control of the air overhead or that it was not operational,
    and he instructed his carriers to ring tang on all bomber and torpedo aircraft
    of this strike also and to load with bombs instead of torpedoes. The returning
    aircraft landed aboard carriers between 1530 and 1600. In all, the air groups
    of Task Group 38.1 placed 177 aircraft over the Japanese Centre Force in these
    two strikes, the only two undertaken. An aggregate of 65 tons of bombs was dropped
    and 64 rockets fired; several were rocked.⁴ The Americans lost eight aircraft
    – two bombers on take-off, one fighter missing, three bombers shot down, two torpedo
    landed in the water short of fuel; but some of the crew were saved.


