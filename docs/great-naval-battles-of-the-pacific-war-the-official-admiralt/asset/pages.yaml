    About 0415 on the 6th, as soon as there was sufficient light, the Hammann went
    alongside and transferred to the York salvage party of 29 officers and 130 men
    under Captain Buckmaster. In order to supply power for operating submersible pumps,
    and foamite and water for firefighting, it was found necessary to secure the Hammann
    alongside, as she could not lie clear and keep position accurately, and she was
    secured on the starboard side forward. The remaining four destroyers circled the
    ships at 12 to 14 knots as an A/S screen.


    By the afternoon the salvage party made considerable progress, and the Yorktown''s
    list had been reduced some 2 degrees. But that morning (6 June) the Yorktown had
    been sighted and drifting by a reconnaissance aircraft from the Chikuma, and submarine
    I-168, whose patrol line was near Midway, was ordered to attack her. She lost
    no time in doing.


    At 1335 the wakes of four torpedoes were sighted to the Yorktown. The Hammann
    went full speed alongside her starboard engine, but in the minute that elapsed
    before the torpedoes struck there was insufficient time to pull the ships clear.
    Apparently two torpedoes hit the Hammann, one of which broke her back, and two
    struck the Yorktown below the island. The hole in the carrier''s side by the resulting
    explosion apparently flooded the starboard fire rooms, for the list was reduced
    to 17 degrees and the ship settled a little.


    The Hammann sank within three or four minutes, most of the crew managed to clear,
    but a minute after she disappeared a heavy underwater explosion occurred, which
    killed and injured a great many men. As the depth charges were known to be safe
    it it was surmised that the explosion may have been caused by the Hammann''s torpedoes,
    one of which was said to have been running hot in its tube as the ship sank.


    Destroyers hunted the submarine all afternoon. At about 1845 a submarine surfaced
    on the horizon and was attacked. But I-168 escaped undamaged. The destroyers being
    so preoccupied, it was decided to defer further salvage attempts on the Yorktown
    until next day. The Vire took off the salvage party and all water-tight doors
    remaining undamaged were closed. At 0501 on the 7th, however, before the salvage
    party boarded her again, the Yorktown capsized to port and sank in 3,000 fathoms
    in 30° 36'', 176° 34'' W.'
