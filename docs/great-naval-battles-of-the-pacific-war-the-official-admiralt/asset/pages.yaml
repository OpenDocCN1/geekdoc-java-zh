    At 1130, four Australian corvettes, the *Goulburn*, the *Toowoomba*, the *Maryborough*
    and the *Ballarat*, of the 21st MSF, unexpectedly arrived. The Ballarat was short
    of fuel, and the *Maryborough* refueled. HMAS *Goulburn* and *Toowoomba* sailed
    from Tjilatjap at 1800 with orders to hug the coast to the east. The *General
    Verspych* escorted by the *Maryborough* sailed at 2230, hugging the coast to the
    westward. They were immediately followed by HMAS *Ballarat* and *Burnie*, the
    latter weathering the broad pennant of Commodore Collins. Rear Admiral Palliser
    proceeded to Australia by plane.


    Just as the last group was leaving, the auxiliary minesweeper HMAS *Gemos* arrived,
