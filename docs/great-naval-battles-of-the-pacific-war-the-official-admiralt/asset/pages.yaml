    to the Japanese Centre Force in the day-long attacks of the 24th is not known,
    but it is clear from his words, as events proved, he did not discount them sufficiently.
    He concluded that they ''indicated'', beyond a doubt, that the Center Force had
    been badly mauled with all of its battleships and most of its heavy cruisers tremendously
    reduced in fighting power and life''⁸⁸ He considered that the force was adhering
    blindly to a plan, and though he recognized that it might ''plod'' through San
    Bernardino Strait and attack the shipping off the Leyte beaches he was convinced
    that it was so heavily damaged that it could not run a decision. It was from the
