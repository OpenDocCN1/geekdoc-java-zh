    # 43. I-168 bombards Midway, 0130 5 June


    At 2030 on the 4th orders had been sent to the Japanese submarine 1-168, whose
    patrol line passed close to Midway, to shell and destroy the air base on Eastern
    Island. I-168 fired a few rounds at 0130 on the 5th, which caused no damage, and
    were answered by the batteries, which (erroneously) claimed a hit. To the defenders
    of Midway it seemed probable that this bombardment constituted a diversion to
    cover the attack of a landing plane. However, when no further developments followed,
    it was thought, in view of the Japanese losses, that the bombardment had been
    carried out by a submarine which had failed to receive the order to abandon the
    operation and retire.


    # 44. Contact with the enemy, 0545 5 June


    It was not long before American aircraft from Midway discovered the retirement
    of the Japanese forces. All long night men worked hard on the island servicing
    the remaining aircraft. The fueling system had not yet been repaired, and 45,000
    gallons of aviation spirit in 55-gallon drums were supplied by hand to the hand
    pumps from which the aircraft tanks were filled. Eighty-five hundred-10 bombs
    were loaded.


    The morning of 5 June took off before dawn, being concentrated in the sector 250
    degrees to 20 degrees, to a distance of 250 miles. Within two hours evening sighting
    reports began to come in, the most important of which were follows:


