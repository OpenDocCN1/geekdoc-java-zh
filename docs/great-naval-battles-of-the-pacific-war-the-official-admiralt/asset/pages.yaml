    20. The Japanese Southern Force Discovered, 0905 24 October


    Shortly before the first air strikes reached the enemy main body, other smaller
    detachments of the Japanese Fleet were discovered to the southward, in the Sulu
    Sea. At 0805 on 24th search-strike aircraft from the Franklin, one of the fast
    carriers of Rear-Admiral Davison''s Task Group 38.4 reported sighting and attacking
    three destroyers west of Panay Island, and at 0940 the Franklin launched a special
    strike of 11 fighters and 11 bombers to continue the attack and search for other
    targets. Only two of the destroyers were found, one of which was starved, reported
    by rockets and burning aft, the other slightly damaged. At 0905 aircraft from
    the Enterprise, another of Admiral Davison''s fast carrier intercepted and attacked
    a force of two battleships, one heavy cruiser, and four destroyers in the Sulu
    Sea in 08° 55'' N, 121° 50'' E, south-west of Negros Island. This was Vice-Admiral
    Nishimura''s command (''C'' Force), consisting of the old battleships Fuso and
    Yamashiro, and the 4th Destroyer Division (four destroyers). The search team reported,
    apparently somewhat over-optimistically, two bomb hits on each battleship, rocket
    hits on the cruiser and two of the destroyers, and heavy strafing of the other
    two. Admiral Halsey assumed that the Seventh Fleet could take care of this small
    southern force and adhered to his decision that Task Group 38.4 should concentrate
    as previously ordered and transfer its attack from this newly-discovered force
    to the Japanese main body.


