    # 17. The “Princeton” hit, 0939/4th


    After an hour and a half there was a lull in the fighting. By this time many of
    the fighters were short of ammunition and fuel and had to be landed. Thanks to
    their efficient performance and Rear-Admiral Sherman''s handling of the Task Group
    no organized group of enemy aircraft had reached the ships. 0938 Task Group 383
    emerged to the edge of a rain squall in 15° 22'' N., 123° 47'' E. to land the
    fighters who needed reserving – enemy were showing on the flagship''s screen within
    50 miles. The Princeton, to land her fighters, had put torpedo aircraft which
    were ready for deck load strike and armed with torpedoes on the hanger deck. Suddenly,
    a single enemy aircraft, apparently unnoticed by most of the ships among the returning
    friendly fighters,ived out of the low clouds over the Princeton and put a small
    bomb through her deck amidships. The AA cruiser Reno, on the Princeton''s port
    quarter fought by the Judy and possibly damaged it, and it is believed to have
    the Judy which was shot out by one of the Lexington''s fighters.


    The bomb struck a small fire on the hanger deck. Heavy black smoke came from midships
    of the Princeton and she commenced to slow, and lost position in the formation
    which was proceeding at 24 knots at the time. At 0947 she turned out of formation,
    and CTG 38.3, drawing clear with the rest of her ships, ordered the Reno and destroyers
    Gavin Young, Gatling and Irvine to stand by. It seemed to Rear-Admiral Sherman,
    however, that there was little to feel from one small bomb hitting and that a
    major air attack with only one of the enemy getting into position and only one
    small bomb hit, the Task Group had come off exceedingly well.


    About 1001 the Princeton, with her flight deck burning, asked the destroyers to
    pour water into her fire. Almost simultaneously, an explosion occurred on board
    and about four minutes later a second took place in the after part of the carrier.
    Further explosions occurred. A large fire was raging through the hanger deck and
    around the island. Smoke was so dense, black and heavy that the ship was completely
    obscured. She lost all way, took a position across the wind, drifting to leeward.
    Men could be seen abandoning ship, but the work of rescue and assistance was hampered
    by enemy aircraft who returned to the attack. The Reno quited the scene for some
    minutes, to fight the threat with the Gatling and the Combat


