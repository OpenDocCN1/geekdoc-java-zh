    # 47. Smoke screens


    Of the progress of the action between 1730 and 1830, the accounts are conflicting.
    It is particularly difficult to synchronize the varying times at which events
    were reported by different authorities. Ships on both sides were emerging from,
    or disappearing into, smoke screens; sunset at 1821, and by 1812 the light had
    begun to fail. There was undoubtedly uncertainty to the situation. Rear-Admiral
    Doorman had no aircraft which continuously reported Allied movements. and did
    not even know the positions of all the Allied ships; at least, he does not seem
    to know that the Electra was sunk or sinking; at 2000, he signalled the Electra,
