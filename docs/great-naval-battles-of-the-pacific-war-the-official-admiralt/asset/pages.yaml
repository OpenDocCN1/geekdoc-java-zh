    On 18 February, a Japanese force of four cruisers and two transports had seized
    the airfield in the south-east of Bali Island, off east Java. Thereupon, on the
    night of 19–20 February, Rear-Admiral Doorman attacked an enemy force estimated
    at four cruisers, five destroyers and three transports, the south-east of Bali.'
