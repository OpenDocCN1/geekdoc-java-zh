    of events was lost in the ensuing confusion and destruction.


    In a few minutes, the destroyer Sims was a wreck, struck by at least three bombs,
    estimated at 500 pounds, released by four enemy aircraft who pulled out of their
    dives at altitude so that survivors of the Neurosho averted that those were not
    shot down were destroyed by the blast of their own bombs. Bombs exploded in the
    forward and after engines and wrecked the Sims. The ship lost all power and stopped.
    Her topside was shambles. An effort to keep the vessel afloat made by jettisoning
    possible weight. A motor boat and two life rafts were launched, and the former
    ordered to go aft to extinguish a fire in the deck house and flood the magazine.
    But before this could be done the Sims seemed to break amidst. She went down lively,
    stern. All hands leaping into the sea and swimming clear, as the water reached
    the top of the funnel a heavy explosion occurred, followed a moment later by a
    second, causing heavy loss of life among men in the water. Only fifteen men, of
