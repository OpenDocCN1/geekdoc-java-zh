    Strait was known to the escort carriers of the Seventh Fleet operating under Rear-Admiral
    T. L. Sprague escort of Samar in support of the landings on Leyte. These forces,
    which formed Task 77.4, belonged to the Pacific Fleet and had been temporarily
    transferred to the Seventh Fleet. They consisted of 18 escort carriers organized
    in three groups of six with a screen of seven or eight destroyers or destroyer
    escorts.


