  md: '# Chapter VIII


    # Lessons and Effects of the Battle


    57. Experienced gained


    The Americans were not slow to recognize the lessons of the battle. Some of these
    concerned material, such as the inferiority of the Navy fighter aircraft to the
    Japanese speed, manoeuvrability and rate of climb; the fatal inadequacy of the
    Douglas torpedo bomb and the necessity for developing long range fighters to support
    the Grumman torpedo bomb which was unable to attack ships defended by fighters,
    whilst the aerial torpedo itself needed a larger warhead and to be designed for
    much higher release speed.


    US task forces were re-organized to provide stronger close screen of cruisers
    and destroyers in consequence of the demonstrated value of such a screen on the
    Yorktown; Admiral Nimitz considered that had the Yorktown been slowed down by
    previous bombing damage might have avoided all the torpedoes fired by the only
    four Japanese aircraft that succeeded in penetrating the screen.


    On the operational,, both Admiral Fletcher and Admiral stressed the vital importance
    of timing the first attack on enemy carriers whilst the latter had their aircraft
    on board. In so far as the Americans were able to do this, Midway was a victory
    of pre-battle intelligence resulting in a tactical situation in their favour.
    Once battle was joined, however, there was a failure to maintain continuous contact
    with the enemy, one cause of which was the unsustainability of the Navy patrol
    bombers for carrying out their important function of shadowing them due to their
    inability to fight fighter opposition. ''The lack of information on the enemy''s
    surfaces forces between 0623 and 1000 [4th June] was serious and jeopardized the
    tactical advantage we enjoyed over the enemy'', wrote Admiral Nimitz.¹ The delay
    of the Enterprise''s group attack against the enemy carriers and the carriers
    of the Hornet''s scout bombers to make contact with the enemy can be attributed
    to this lack of information. Further, the loss of aircraft from the Hornet and
    Enterprise by water landings from lack of fuel be partly attributed to the same
    cause.


    +   1. Lessons and conclusions from the action C-in-C Pacific Fleet, Secret Information
    Bulletin No.1, p. 31.'
