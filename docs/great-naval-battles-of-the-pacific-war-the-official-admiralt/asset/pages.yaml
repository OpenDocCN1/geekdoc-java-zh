    # 22. Operations in Guadalcanal; December, 1942–January, 1943


    The Battle of Lunga was the last occasion on which considerable American Naval
    Forces were engaged with enemy ships in the fight for Guadalcanal. On shore, the
    relief of the US Marines by the Army proceeded smoothly throughout December, and
    by the end of the month preparations for a major offensive were well advanced.
    This was launched in the New Year (1943), and continued vigorously throughout
    Guadalcanal, constantly confining the Japanese to a smaller portion of the island.
    Four destroyers based on Guadalcanal from 16 January onwards advanced the army
    by bombing enemy positions as required, and on 1 February forced a landing at
    Nugu Point, on the west coast of the island. The landing was unopposed, but one
    of the destroyers – the De Haven – was sunk by an air attack to the southward
    of Savo Island that evening. Two enemy submarines were destroyed during this period,
    one off Copenhagen Harbor by the Nicholas and Radford on 28 January and another
    by the New Zealanders Kiwi and Moa a mile to the westward of Cape Esperanza on
    30 January.


    During all time the enemy continued to run in small reinforcements and supplies
    in high speed craft. This traffic was known as the ‘Tokyo Express’, and was constantly
    attacked by aircraft and the motor torpedo boats based on Tulagi, casualties being
    suffered by both sides. But the ultimate outcome of the campaign was no longer
    in doubt, and in January the American Naval Forces were able to carry the offensive
    into enemy waters and attack their positions in the central Salomons.


