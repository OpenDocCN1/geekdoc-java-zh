    There were at this date the following Allied advanced bases in the area, outside
    Australia:


    +   (a) Tongatabu in the Friendly Is., a limited monarchy under British protection,
    was in process of development as an intermediate operating base. The anchorage
    could accommodate 12 deep draft and 36 medium and light draft vessels but pending
    the installation of minefields was insecure. The shore defences were not strong
    but were increased. There was an airfield.

    (b) Numea in New Caledonia (French) had an excellent anchorage for ships of any
    draft, but until the defences it was not considered a secure anchorage for carriers.

    (c) Efate in the Hebrides, an Anglo-French condominium, was being organized as
    a defended base. There was known to be a landing field, but the report on its
    condition and suitability was still awaited.

    (d) Suva and Nandi in Fiji, and Tuitulla, a US Protectorate, south-east of Samoa,
    were considered suitable for ships of any draft and their entrances were mined
    and their defences well organized. They were considered secure anchors for other
    than carriers.


    The Allied task forces operated in strategic co-ordination with aircraft of the
    South-west Pacific area, at Port Moresby and at Tulagi, Florida Island (Solomon
    Is.) after evacuation of the latter on 1 May, two days before the Japanese began
    to move into the island. At Nuemea in New Caledonia there were fleet patrol aircraft
    and army pursuit squadrons.

    These shore-based air forces obtained information of the enemy which was of much
    value and their almost daily attacks on shipping were of cumulative assistance,
    but they did not operate tactically, for this problem had not at that date been
    solved. Numbers of aircraft were inadequate, and the Australian bases were remote.
    Difficulties of communication were being overcome but there was still much to
    be done in providing for the readiness and training of shore-based aircraft to
    co-ordinate their operations tactically with fleet units to relieve carrier-based
    aircraft of long range reconnaissance did the Japanese, and to be ready to attack,
    with full groups, any targets located.'
