    On 19 February, the airport, warehouses, docks and practically every ship in Darwin
    harbour were destroyed by an attack by about 72 high-level bombers and 18 dive
    bombers. Bom sank the American destroyer Pear (which was under orders to join
    Rear-Admiral Doorman''s striking force), three troop transports, a tanker and
    two merchantmen. High-level bombers sank two ammunition ships.


