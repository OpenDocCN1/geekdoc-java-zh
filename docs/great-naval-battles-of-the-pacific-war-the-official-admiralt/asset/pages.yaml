  md: '# Allied Naval Command Leaves Java 97


    The US 58th Destroyer Division arrived at Fremantle at 1645 on 4 March without
    incident.


    # 74. British auxiliary craft


    Between 19 and 26 February, 36 merchantmen had been cleared from Tanjong Priok.
    On the 26th, the Commander-in-Chief, Eastern Fleet, represented to the Admiralty
    the danger of losing ships at this port where they were exposed to air attack
    without AA defences or fighters. On 27 February, therefore, all the remaining
    British auxiliary craft were ordered to clear from Tanjong Priok, and the Scott-Harley,
    Wo Kwang and the Seram sailed at 1600 for Tjilatjap.


    Shortly after midnight on the 27th, the Western Striking Force sailed from Batavia,
    and a sweep upwards in a vain search for an enemy convoy from Muntok (Bank Island),
    proceeded in accordance with orders, with Sunda Strait, to Trincomalee; they arrived
    at Colombo on 5–6 March. At the same time, the auxiliary minesweeper Ankara (with
    about 70 ratings), the tankers War Sirdar and British Judge, seasired by the sloops
    Jumna, Yarra and Wollong sailed for Tjilatjap. They were not, however, so fortunate;
    on 28 February, these auxiliaries and their escort were dive-bombed in Sunda Strait.
    The War Sirdar was set on fire, beached on Agenien Island (one of the Thousand
    Islands), on 05° 31'' S., 106° 36'' E., and abandoned; the British Judge was torpedoed
    after dark on 28th by a submarine (one subsequently reached Colombo under her
    own steam).


    # 75. Decision to evacuate


    At 0710 on 1 March, Commodore J.A. Collins, RAN received orders from Naval HQ
    at Bandoeng to leave Batavia. In 0930, a conference was held at Bandoeng, of Vice-Admiral
    Helfrich, Rear-Admiral Palliser and Commodore Collins'' Chief Staff Officer, to
    consider a reconnaissance report of Japanese ships and destroyers located 80 miles
    south of Tjilatjap, steering north at 0800. It was decided that the best chance
    of saving some of the shipping at Tjilatjap was to sail it all after that day;
    Dutch ships to hull to the west, and British ships to the eastward of the port,
    and then break independently for Colombo or Australian ports. Orders were passed
    to Tjilatjap to have all ships fuelled and ready to sail by nightfall.


    The only means of communication at this time with ships at sea was by an American
    W/T set at Bandoeng, and American ciphers. The fate of the Perth and the Houston
    being then unknown, these ships were ordered by signal to avoid Tjilatjap and
    to proceed to Fremantle.'
