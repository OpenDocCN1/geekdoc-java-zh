    Although he was proceeding north, Vice-Admiral Kurita was not prepared to prejudice
    his chances of retreat. One thought was clearly over-riding – that he must be
    at San Bernardino at sunset so to get to the Strait and as far west possible during
    the night. Two tankers awaited him in the Sulu Sea and a third was stationed at
    Koron in the Mindanao Strait. Now that he had abandoned the decision to enter
    Leyte Gulf with its line of retirement through Surigao Strait, the necessity for
    replenishing his fuel supply before returning to Brunei chained him to the San
    Bernardino Strait. Had he been able to attack the invasion forces the question
    of fuel would have been disregarded but matters now different.


    His situation had not improved. During his run north he had received information
    that Vice-Admiral Nishimura had with disaster. The messages were very short and
    no details; the source, apparently a destroyer, had not actually contested the
    battle but had sighted fires.


    Admiral Toyoda sent no orders.


    From some source, not from Vice-Admiral Ozawa himself, he had heard that the latter
    had become heavily engaged and the flagship was damaged, and the flag was to be
    shifted to another ship; though information of the extent of the damage to the
    Northern Force was not vouchsafed by him. He hoped as the result of this engagement
    and the calls for help from the force he had been chasing this morning he would
    find an American force in his path before he reached 13° 20'' N., the critical
    latitude from which he did not wish to stray far northward and prejudice his passage
    of the San Bernardino Strait at dank, unless he could before sunset and attack
    the enemy, when he would cease to consider his retreat.


