  md: '# Organization of the Allied and Enemy Forces 233


    The Fifth Fleet was brought from Amami O Shima to Bako, and thence to Koron Bay
    in the Kalamian group of islands on the south side of Mindoro Strait, for fuelling,
    and it sailed from here very early on the morning of the 24th by the route west
    of Negros, to carry out its mission at Leyte. One tanker was sent to Koron Bay,
