    Admiral Halsey''s decision to take his battleships south at this juncture left
    to the carriers of Task Groups 38.3 and 38.4 the task of dealing with the Japanese
    Northern Force. Brilliantly though the American aircraft performed that in encompassing
    the destruction of all four of the enemy carriers it was beyond their powers to
    sink or stop the battleship carriers, *Ise* and *Hyuga*. The difficulty of stopping
    a battleship except with another battleship is now known; but that date ''the
    practical difficulty of crippling by air strikes, a task force of heavy ships
    at sea and to manoeuvre'', was not universally recognized and was one of the lessons
    of the Battle of Ley Gulf.


    It is not known to what extent the Commander Fleet was hampered making his decision
    by the confused nature of the enemy intelligence available, which the Commander
    Fleet Battle Line represented. ''The outstanding feature of the operations of
    24-25 October'', wrote the Captain of Alabama, one of Admiral Halsey''s battles,
    was the confusing and conflicting reports regarding the location, composition,
    course and speed of the enemy groups, and of the damage inflicted upon enemy units.


    At 1055, when Admiral Halsey decided to return south the attacks on the Japanese
    Northern Force were reported to be going well; and Vice-Admiral Ozawa was in full
    flight. Already, two of the enemy carriers had been damaged and one stopped. The
    only danger to be feared from the Japanese carriers was their employment by any
    aircraft which might fly out from Luzon. One of aircraft, apparently intending
    to land on the carriers, had been reported approaching the force, but turned back
    when the American attack developed. It must have seemed that the elimination of
    the potential threat from Vice-Admiral Ozawa''s force could now be left to Vice-Admiral
    Mitscher''s fast carriers.


    It would appear that at this juncture the Commander Fleet was influenced by the
    necessity of coming to the Seventh Fleet rather than the hope of bringing Vice-Admiral
    Kurita to action these two proceedings were one and the same, unless the Japanese
    Admiral retreated on his approach. It is true that the two fleets were over 300
    miles apart, which, taking into account the necessity of fueling his destroyers,
