  md: '# Chapter I


    # Japan Enters the War


    # 1. Events in the Far East


    Japan opened the war in the Far East on 7 December 1941, with the attack on Pearl
    Harbor, followed by the commencement of attacks on Malaya and the Philippines;
    the Japanese formed separate parts of a single strategic plan that was to culminate
    in the conquest of the Netherlands East Indies.^2


    By the end of December 1941, the Japanese had compelled the Americans to abandon
    the Philippines as a naval base.^3


    On 11 January, 1942, Japan declared war on the Dutch,4 and commenced the systematic
    bombing and successful invasion of Borneo, Celebes and other Dutch islands which
    commanded the northern approaches to the Java Sea.


    Singapore dockyard was closed on 30 January, and the British forces in Malaya
    commanded to retire towards Singapore Island. By this time, the Japanese had established
    control of the sea and air routes to the Philippines; in Borneo, they seized the
    oil centres of Tarakan and Balikpapan and the ports of Miri, Pemangkat and Pontianak;
    in Celebes they had captured Menado and Kendari and were already extending their
    conquests to the south.^5


    On 3 February, Surabaya (east Java) and Malang (with its airfield) 50 miles south
    of it, were bombed. This was the first bombing of Japan, and the first indication
    of a move south of the enemy air strength. By mid-February, the Japanese had completed
    the occupation of British and Dutch Borneo, the Dutch islands of Celebes and Ceram,
    the latter with its airfield, and of the Dutch island naval base of Amboina (Ambon).
    These conquests gave them


    +   1. Japan also attacked the strategically important islands, Guam and Wake,
    in the Central Pacific, and occupied Shanghai.


    +   2. During December, the Japanese captured Guam and Wake islands, Hong Kong,
    and the islands of Makin and Tarawa in the Gilbert and Elles group. In the political
    sphere they entered into an alliance with Siam.


    +   3. The United States Army, however, held on to the Bataan peninsula until
    April, 1942.


    +   4. The Japanese had hitherto no action on the Dutch declaration of war on
    10 December, 1941, preferring to wait until their troops were well established
    in Malaya, and the fall of Singapore seemed assured.


    +   5. They captured Rabaul (New Britain) and Kavieng (New Ireland) in the Bismarck
    Archipelago, and Kieta on Bougainville Island, in the Solom.'
