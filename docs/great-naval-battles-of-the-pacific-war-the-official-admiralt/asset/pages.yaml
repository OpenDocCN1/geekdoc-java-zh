  md: '# Part Five


    # The Battle for Leyte Gulf


    # Introduction


    The great triple battle of 23–26 October, 1944, known by the Americans as the
    Battle for Leyte Gulf, and by the British sometimes as the Second Battle of the
    Philippines, involved many different forces, both surface and air, and ranged
    over a wide area. The following summary is given as a guide.


    The battle was the outcome of a Japanese attempt to throw the Americans out of
    the Philippines which they had invaded three days previously at Leyte, in a landing
    from the Gulf, between the islands of Leyte and Samar. The Japanese fleet sallied
    out in three detachments, and a series of major surface and air actions developed
    in and around the Philippine Islands, culminating on 25 October in three almost
    simultaneous naval battles: the Battle of Surigao Strait, the Battle off Samar,
    and the Battle off Cape Engano (Luzon Island). The three detachments or groups
    of the enemy fleet in these three engagements are for convenience termed the Southern,
    Centre and Northern Force respectively.


    The Southern Force,¹ maneuvering two slow old battleships, four cruisers, and
    destroyers was located in the Sulu Sea on 24 October. It approached Leyte in two
    groups, to attack the American unloading area, through Mindanao and its northern
    exit, the Surigao Strait, and was practically destroyed by the Seventh Fleet (Vice-Admiral
    Kinkaid), next day.


    The Centre Force comprised the main body of the enemy fleet – five battleships,
    10 cruisers, and destroyers,² sailed from Brunei Bay, passed up the west coast
    of Palawan, where US submarines attacked it on 23 October, sinking two heavy cruisers
    and damaging a third that it turned back to Borneo or Singapore; it passed through
    the Mindoro Strait and Sibuyan Sea, where aircraft of Admiral Halsey’s Third Fleet
    carrier groups lined up


    +   1 Secret Information Bulletin No. 22, General Recapitulation pp. 78-44 shows
    that the Southern Force carried troops, there is no confirmation of this and no
    details are forthcoming.

    2 The Centre Force is described in this account of the battle as the main body
    it comprised the greater part of the surface fighting strength of the Japanese
    Fleet. The Japanese termed the Northern (Carrier) Force the main body, as the
    principal force remaining in the striking force after most of the heavy units
    had been detached to form the Diversion Attack Forces.'
