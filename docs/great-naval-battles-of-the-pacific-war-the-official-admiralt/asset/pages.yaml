    # 10. Loss of USS Darter, 24 October


    Unfortunately, the *Darter*, whilst manoeuvring into position for a further attack
    on the Centre Force, grounded on Bombay Shoal on 09° 26′ N, 116° 56′ E., in the
    middle of the Palawan Passage, and had to be abandoned next day. The Japanese
    subsequently boarded the vessel but found that all useful gear had been destroyed
    by the crew. This was the only US submarine to fall into Japanese hands during
    the war.


    # 11. Centre Force enters Mindoro Strait, night of 23–24 October


    Vice-Admiral Kurita’s force was sighted once more on 23rd. At 2130 the American
    submarine *Angler* in the approaches to Mindoro Strait in 13° 00′ N, 119° 30′
    E., reported 15 to 20 ships, including three probable battleships, on an Easterly
    course at 18 knots. They were tracked into the Mindoro Strait, and at 2403 two
    possible carriers were (incorrectly) reported with the three battleships.


    # 12. Cruiser Force reported from the North, 0340, 23 October


    Simultaneously with these reports of enemy ships proceeding up the Palawan Passage
    there came reports of contact with a Japanese cruiser force coming down from the
    northward. At 0340 the 23rd, the submarine *Bream* reported a force of at least
    two heavy cruisers and several destroyers to the westward of Luzon, in 14° 05′
    N, 119° 43′ E., steering at a speed of 10 knots a course for the Verde Island
    Passage, the entrance to the Sibuyan Sea. This was, no doubt, the Japanese Fifth
    Fleet. The *Bream* reported (apparently incorrectly) it hit on an *Aoba* class
    cruiser. Two *Aoba* class heavy cruisers (one of them with hits) and a destroyer
    were reported 50 minutes later, at 0430 on 23rd, in the same position, steering
    a course for Manila Bay.


