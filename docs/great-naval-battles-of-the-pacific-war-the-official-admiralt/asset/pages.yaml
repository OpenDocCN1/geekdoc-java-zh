    # # Japanese on the Defensive


    **20. Events following Battle of Guadalcanal.


    After the Battle of Guadalcanal there was a lull of about for a fortnight. Thoroughly
    defeated, the Japanese naval forces temporarily abandoned their advanced base
    in the Shortlands Islands, and fell back to the Rabaul area, while the American
    Naval Forces withdrew to Espirit Santo and Noumea to reorganize and make damage,
    a striking force of cruisers and destroyers (Task Force 67) under Rear Adm. Kincaid
    being held in readiness at Espirit Santo.


    During this period the enemy pressed on with their efforts to strengthen their
    position in the Mid-Solomons, and commenced a new airfield at Munda, New Georgia
    (about 200 miles from Guadalcanal); two escorted cargo ships were damaged in this
    area by American aircraft on 28 November. On shore at Guadalcanal, the American
    Marines took the offensive and by the end of November had driven the main forces
    to the westward detachment of Point Cruz. At the same time they had dispersed
    the enemy detachment to the east of the Tenaru River. For these operations had
    been supported by naval bombardment. At this stage, American Army Units arrived
    to take over the Marines, and during the change-over, active shore operations
    were suspended. To the enemy however, the situation must have appeared very serious,
    and on 24 November marked an increase in shipping² to the Americans that an attempt
    at reinforcement was in preparation.


    The attempt took place on the night of 30 November–1 December and was frustrated
    in the night action known as the Battle of Lunga Point, at a heavy cost in American
    cruiser strength as the result of torpedo attack.


