    Nagumo''s force at intervals for over an hour, and an attack was in progress at
    the moment (see Chapter IV), but directly a lull occurred the Admiral altered
    course and headed for the enemy.


    The second wave of attack on Midway gave place to the new and more important object
    of attacking the American carrier. Owing, for the necessity of re-equipping the
    torpedo aircraft it was not immediately possible to send off a strike against
    the Yorktown The Midway attack group was expected very shortly, and it was thereafter
    decided to await their return and then to defeat the strongest possible group
    to attack the reported carrier.


    Before this could take place, however, the situation underwent a dramatic turn
    and for the Japanese, a disastrous change. The last aircraft of the Midway attack
    group was safe on board and it was confirmed that substantial results had been
    obtained; preparations were hastily going for a ''grand attack'' by 93 aircraft
    on the Yorktown. Though the striking force had been under attack since 0710, by
    American Army, Navy and Marine shore-based torpedo aircraft and bombs, followed
    at 0920 and again at 20 by carrier-borne torpedo aircraft, it had suffered no
    hits or damage whatever. Then, at 1022, antagonists of a very different calibre
    appeared—the American carrierborne dive bombers. Seldom in war can a situation
    have been more swiftly and suddenly reversed; within a few minutes out of four
    of the carriers had been reduced to flaming wrecks and Japanese sea power had
    suffered a blow from which it never recovered for the remainder of the war.


    Before describing these devastating attacks, however, it is necessary to give
    an account of how the American shore-based air attacks had fared.'
