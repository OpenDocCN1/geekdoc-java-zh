    # 2. The objective, Midway


    Midway, the westernmost one of the Hawaiian Islands, acts as a sentry for Hawaii,
    as Commander-in-Chief of the Japanese First Air Fleet succinctly stated his appreciation.
    Its importance as an American outpost was further enhanced after the seizure of
    Wake Island by the Japanese on Christmas Eve 1941. The Japanese intended to use
    it capture as a base for long-range reconnaissance aircraft and submarines.

    It consists of an atoll which are two small islands, Eastern Island and Sand Island.
    There is an anchorage for deep draught ships, and the islands could support an
    air force of about the size of a carrier group. They were defended by fixed defences.

    About 56 miles westward of Midway Islands is the atoll Curé or Ocean Island, where
    the Japanese planned to establish a seaplane base.


    # 3. Japanese plans to occupy Midway


    The occupation of Midway Islands and establishment of a base in the Aleutians
    were an integral part of the plan of expansion of the defensive perimeter of which
    the seizure of Port Moresby was to have been the first installation. Though foiled
    the latter object, the Japanese refused, even in their secret reports, to regard
    the battle of 7–8 May as other than a victory for themselves; and certainly from
    a material point of view their losses were both lighter than those of the Allies
    and proportionately far less effect on their all-important carrier strength.

    Japanese intelligence of the disposition of the American carriers was far from
    complete. They knew of the presence of the Enterprise and Hornet in the Pacific
