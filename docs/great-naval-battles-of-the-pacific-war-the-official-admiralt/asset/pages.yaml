    38.3 remained with her until the evening orders came to sink the ship. The remaining
    Task Group, 38.1, Vice-Admiral McCain''s group, had been en route to Ulithi since
    22nd and was in approximately 11° N 45'', 135° 40'' E. A strike was planned for
    the morning of 24th, but was cancelled at 0846 Admiral Halsey ordered the group
    to reverse course'' and proceed at best speed towards position in 15° N. 130°
