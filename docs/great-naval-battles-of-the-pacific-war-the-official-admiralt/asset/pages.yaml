    which were successfully avoided by every ship, and at 1442 the engagement was
    at an end. The only damage suffered was by the Chicago, which had seven men wounded
    by machine gun fire, two of whom died later.


    There was, however, no respite for Rear Admiral Grace''s ships, for almost immediately
    they came under attack by Navy Type Mitsubishi heavy bombers which approached
    from astern and were sighted at 1443 at 14,000 feet after being picked up by radar
    at 45 miles. The ships opened fire, but none of the enemy was hit. Although observers
    reported the group to number 25 aircraft only one salvo of bombs was dropped near
    the ships. This straddled the Australia with a pattern 500 yards long, but all
    bombs missed and only two of the nearer ones shook the ship slightly. At 1501
    the attack was over; the task group reduced speed to 20 knots and steered a southerly
    course until 2000 when Rear-Admiral Crace altered to the westward and proceeded
    a course parallel to the New Guinea coast.


    It was reported that a few minutes after the high level bombing attack three aircraft,
    subsequently identified as United States Army B.26 bombers, passed over and dropped
    a salvo of bombs close to one of the destroys of the task group. However, not
    all of the ships witnessed the incident. Although shadowed by enemy aircraft,
    the support group was not further molested; and the successful air battles in
    which Rear-Admiral Fletcher''s attack group engaged next day, to the westward,
    destroyed any opportunity the force might have had of engaging the Japanese in
    a surface encounter.'
