    # 22. Preparations to make Japanese air attack


    The Americans became aware that they had been sighted by the enemy almost simultaneously
    with the sighting of the Zuikaku and Shokaku by the Lexington''s scouts, and at
    0832 a Japanese plain language wireless transmission was intercepted, giving the
    position, course and speed of Task Force 17, apparently seen by a 4-engine patrol
    aircraft which was sighted and shot down by the Yorktown''s combat patrol.


    Preparations were made to make the attack which it was estimated would come about
    1100. The Yorktown had launched first combat air patrol and eight scouts as anti-torpedo
    aircraft patrol at 0724; the fighters were brought in and at 0941 second combat
    air patrol was launched. The Lexington launched its returning scouts as anti-torpedo
    aircraft patrol and additional fighters were launched by both carriers up to 1102-04,
    at which all time service aircraft were in the air, the fighters as combat air
    patrol, with scout bombers as anti-torpedo aircraft patrol. The cruisers'' aircraft,
    which had been up as an inner air patrol, were recalled when the enemy attack
    seemed imminent.


    In order to reduce signalling between carriers and to allow Commander A W. Fitch,
    USS Lexington (Rear-Admiral A. Fitch) freedom of action from his carriers and
    air groups, CT 17 at 0908 ordered him to assume tactical command of the Fleet.
    The ships were in circular disposition with the carriers as centre, axis 350 degrees,
    cruisers on 3,000-yard circle, destroyers on 4,000-yard circle. An even tighter
    formation was subsequently adopted by the US Pacific Fleet as the result of experience
    in the battle which took place on this day. Various courses were steered in launching
    and recovering aircraft, by the general course'
