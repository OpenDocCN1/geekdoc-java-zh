  md: '# Organization of the Allied and Enemy Forces 227


    The Commander-in-Chief US Pacific Fleet''s directives to the Commander Third Fleet
    are shown in the former''s Operation Plan No. S-44, briefed as follows:


    > The Joint Chiefs of Staff have directed that C. in C Pacific provides necessary
    Fleet support to operations (including Leyte and Western Samar) by forces of the
    Southwest Pacific.


    > Forces of Pacific Ocean Areas will cover and support forces of Southwest Pacific.
    Western Task Forces (Third Fleet) will destroy enemy naval and air forces in or
    threatening the Philippines Area, and protect the air and sea communications along
    the Central Pacific Area. In case opportunity for destruction of major portions
    of the enemy fleet offers or be created, such destruction becomes the primary
    task (of all POA forces). Necessary measures for detailed co-ordination of operations
    between the Western Task Forces and forces of the Southwest Pacific will be arranged
    by their respective Commanders.


    Admiral Halsey''s command was a formidable of six modern battleships, eight large
    and seven aircraft carriers with a total complement of 987 aircraft, six heavy
    and nine light cruisers, and 59 destroyers. Its internal organization varied from
    time to time, according to its duties.


    In order to ensure early detection of any approach of enemy naval forces, submarines
    were stationed to guard Brunei Bay, Balabak Strait (the southwest entrance to
    the Sulu Sea) and Mindoro Strait and Verde Island Passage (the north-western entrances),
    and to the westward of Luzon, from Manila inwards. Their duties also included
    lifeguard services and the passing of weather reports.


    Air searches from the recently captured airfield at Morotai Island (Moluccas),
    reaching from Balabak Strait to Verde Island Passage, extended to a radius of
    1,000 miles for the operation. Air searches by Central Pacific forces in Palau
    in the West Carolines and Saipan in the Marianas were depended upon supplement
    Third Fleet aircraft in giving early warning of any approach of enemy forces east
    of the Philippines.


    # 3. The Enemy Naval Forces


    The tactical forces of the Japanese Combined Fleet were re-organized shortly before
    the Allied landing on Leyte. The Third Fleet comprised the


