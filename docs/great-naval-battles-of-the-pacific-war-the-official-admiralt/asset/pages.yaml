    carriers came in. At 0815 a sighting report was received of two aircraft carriers
    and four heavy cruisers in latitude 100° 03'' S., longitude 152° 27'' E about
    40 miles north of Misima Island, steering 140 degrees, speed 18 to 20 knots.


    On receipt of this report, orders were given to launch the attack groups on the
    enemy carriers, which were estimated, not naturally, to be the Zuihaku and Shokaku.
    The Lexington began launching at about 0855 a group of 10 fighters, 22 scout bombers
