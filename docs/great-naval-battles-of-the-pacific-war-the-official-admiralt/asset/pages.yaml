  md: '# 92 Great Naval Battles of the Pacific War


    # 65. Perth and Houston withdraw


    Rear-Admiral Doorman''s verbal instructions before the battle had been that any
    disabled ship must be left ''to the mercy of the enemy''. The Perth therefore
    took the Houston under her orders, feint to the south-east, and turned direct
    to Batavia, 300 miles distant, at high speed. Captain Waller''s reasons for this
    are given in his report: ''I had now under my orders one undamaged 6-cruiser,
    one 8-in. Cruiser with very little ammunition and no guns aft. I had no destroyers.
    The force was subjected throughout the day and night operations to the most superbly
    organized air reconnaissance. I was opposed by six cruisers, one of them sunk,
    and 12 destroyers. By means of their air reconnaissance they had played cat and
    mouse with the main striking force and I had no prospect of getting at the enemy
    (their movements had not reached me since dark, and even then the several reports
    at the same time gave different courses). It was fairly certain the enemy had
    at least one submarine operating directly with him, and he had ample destroyers
    to interpose between the convoy and my approach – well advertised as I knew it
    would be. I had therefore no hesitation in withdrawing what remained of the striking
    force and ordering them to the pre-arranged rendezvous after the night action
    – Tanjong Priok.


    Captain Waller''s decision was communicated by the Perth at 0050 on 28 February,
    in the following signal, ''Striking Force, (R) C.-in-C. E.I., C.C.C.F.: Returning
    to Batavia. De Ruter and Java disabled by heavy explosions, in position 06° 00''
    S, 112° 00'' E.''


    After receiving the Perth''s signal, Rear-Admiral Koenraad at Surabaya ordered
    the hospital ship Op Ten Noort to proceed to sea; some hours later, however, this
    ship was sighted under the escort of two destroyers and had presumably been captured.'
