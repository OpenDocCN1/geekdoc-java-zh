    # 17. Attack on the Neosho and Sims, 7 May


    Unfortunately, the Monaghan''s search was vain, for the position in which the
    Sims had been sunk incorrectly worked out by the Neosho''s people.

    During the attack on the Shoho, and in fact ever the raid on Tulagi revealed to
    the Japanese presence of American carriers in the Coral Sea, land planes and seaplanes
    from Rabaul and Shortland Island had been searching without to locate the Allied
    task force. Finally, on the morning of the 7th, their reconnaissance aircraft
    sighted what they took to be the American carriers and directed to the attack
    the bombers from Zuikaku and Shokaku with the remainder of the Moresby task force
    were to the north-east of the Operation Force and still undiscovered by the Americans.

    Unfortunately for the enemy, the identification of their reconnaissance aircraft
    was wrong, this was not discovered until too late. The ships sighted were not
    the Lexington and Yorktown, the oiler Neosho and her escort Sims.

    After being detached from Task Force 17 at 1725 on 6 May these two ships had proceeded
    southward in accordance with the arrangements for fuelling and by 0730 on the
    7th reached a position in latitude 16° 01'' S, longitude 158° 01'' E., when radar
    and visual contact with aircraft began to be made. It was at first thought the
    aircraft were American, but at 0859 a bomb suddenly fell 100 yards from the Sims,
    released by an aircraft which came over at a height of 15,000 feet and was not
    seen before the bomb fell.

    Both ships increased speed and ran south-east, and after one or more radar counts
    groups of 15 and seven aircraft respectively, coming from the northward in succession,
    without molesting the ships, and disappeared to the north-east, fired on without.

    At 1003 another group of 10 aircraft approached from a bearing 140 degrees, and
    three of them, twin-engine bombers, made a horizontal run over the Neosho and
    dropped three bombs to starboard from a high altitude, two of which fell within
    25 yards of the ship. Both ships opened fire, but the enemy made off to the north-eastward.'
