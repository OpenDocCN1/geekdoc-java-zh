    ## 2.5\. Synchronized block


    In the following, the section where the arrow points is the one causing an issue:


    ![images](images/f0037-01.jpg)


    We must therefore find a way to define this part as a critical section. The following
    represents the solution to this problem:


    ![images](images/f0037-02.jpg)


    *   – We have created a new Counter class in order to create a new “counter” object
    because the syntax of “synchronized” requires it.


    *   – The keyword “synchronized” defines an instruction block which can only execute
    exclusively, even if other threads would like to execute it.


    *   – When the thread perroquetA executes this synchronized block and the thread
    perroquetB wishes to begin execution of this same block, perroquetB must wait.
    Once perroquetA has finished, perroquetB can take over.


    *   – Only one thread can execute the synchronized block at once.


    *   – The block is said to be in mutual exclusion or even to be critical section.


    *   – If the other threads wish to execute this section, they must wait for the
    critical section thread to finish.


    *   – If there is more than one thread waiting for one synchronized block when
    it becomes available, the controller will only authorize one to execute.


    *   – The sleep() call does not cause a thread to exit the critical section.


