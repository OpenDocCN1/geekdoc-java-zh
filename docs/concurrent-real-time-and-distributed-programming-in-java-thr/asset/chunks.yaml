    \ RMI application. For a color version of the figure, see [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)*\n\
    \n[Figure 4.9](#chapter04.xhtml_fig4-9) represents the stages of a call for a\
    \ distant method.\n\n#### 4.2.2.2\\. *RMI architecture*\n\n[Figure 4.10](#chapter04.xhtml_fig4-10)\
    \ represents the RMI architecture.\n\n![image](images/fig4-9.jpg)\n\n**[Figure\
    \ 4.9](#chapter04.xhtml_ifig4-9).** *Stages of a distant method call. For a color\
    \ version of the figure, see [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)*\n\
    \n![image](images/fig4-10.jpg)\n\n**[Figure 4.10](#chapter04.xhtml_ifig4-10).**\
    \ *RMI architecture. For a color version of the figure, see [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)*\n\
    \n*   – First layer: stub/skeleton.\n\n    *   - Stub: local representative of\
    \ the distributed object.\n\n        *   - Initiates a connection with the distant\
    \ JVM by transmitting the distant summon to the layer of reference objects (RRL).\n\
    \n        *   - Assembles the parameters in preparation for their transfer to\
    \ the distant JVM.\n\n        *   - Waits for the results of the remote invocation,\
    \ disassembles the value or the exception returned and returns the value by calling\
    \ it.\n\n    *   - Skeleton: used to locate the distributed object.\n\n      \
    \  *   - Disassembles the parameters for the distant method.\n\n        *   -\
    \ Calls on the requested method.\n\n        *   - Assembly of the result (returned\
    \ value or exception) destined to the caller.\n\n    *   - Remarks: The skeleton\
    \ is no longer necessary since Java 2 (1998).\n\n    *   - A similar class of\
    \ generic skeleton is shared between all distant objects.\n\n    *   - Furthermore,\
    \ up until version 5.0 of J2SE (2004), a stub compiler called RMIC (Java RMI Compiler)\
    \ was required to generate the stub/skeleton before saving on the RMI registry."
