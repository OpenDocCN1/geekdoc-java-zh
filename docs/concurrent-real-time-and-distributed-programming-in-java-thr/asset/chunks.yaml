  trans: "\n\n[content]\n\n![](img/cover.jpg)\n\n![封面](img/cover.jpg)\n\n# 引言\n\n\
    本书是实时和分布式并发计算的介绍，使用 `Java` 面向对象语言作为描述算法的辅助工具。它特别描述了 `Java` 中线程之间的同步机制（协作与竞争）以及数据共享机制（内部类、静态类型变量）。随后，我们讨论了\
    \ `Java` 在实时应用中的使用。随之，书中还介绍了 `RTSJ`（Java 实时规范）。最后，书中还包含了对分布式计算的介绍。我们特别关注使用 `TCP\
    \ Sockets` 的低级通信以及使用 `Java RMI`（远程方法调用）中间件的高级通信。书中还包含一个附录，其中包含与本书主题相关的实际应用练习。掌握\
    \ `Java` 语言知识是正确理解本书的前提。\n\n# 1 Java 线程简介\n\n## 1.1 进程与线程\n\n操作系统负责为进程分配必要的资源（内存、处理时间、输入/输出），并确保它们之间互不干扰（隔离）[TAN\
    \ 01]。\n\n这一原理在以下示例中得到了说明，在两个不同的类中定义了变量 `a`。当执行这两个类时，为该变量分配的两个内存区域完全隔离的。\n\n![image](img/fig1-1.jpg)\n\
    \n**图 1.1.** 进程间的隔离\n\n大多数操作系统提供了以下两者的区分：\n\n* 重量级进程：据推彼此之间是完全分离的。\n* 轻量级进程（线程）：共享同一个内存空间（以及其他资源）。\n\
    \n定义 1.– 线程是一段能够与其他进程并行执行的代码流。线程并非同时执行，而是使用共享时间，这就是为什么线程始终给其他线程执行的机会至关重要。\n\n\
    下面的图表显示了四个不同线程的执行时间和延迟时间。\n\n![image](img/fig1-2.jpg)\n\n**图 1.2.** 四个不同线程的执行时间和延迟时间\n\
    \n## 1.2 并发计算\n\n并发编程语言必须允许允许：\n\n* 创建线程；\n* 线程之间共享数据；\n* 线程间的同步：根据以下两个模型控制任务执行顺序：\n\
    \    * 竞争同步：当多个线程使用同一个资源时。此时，必须有一套互斥机制以避免进程相互干扰。\n    * 协作同步：当一个线程等待另一个线程执行完毕后才开始自己的执行时。\n\
    \n## 1.3 线程创建\n\n在 `Java` 中创建线程有两种方式：\n\n* 继承自 `java.lang.Thread` 的类：\n    * `java.lang.Thread`\
    \ 实现了 `Runnable` 类。\n    * `Thread` 扩展 `Object` 并实现了 `Runnable` 公共类。\n    * `Thread`\
    \ 类必须实现 `run()` 方法。\n    * 子类继承 `run()` 方法。\n* 实现 `Runnable` 接口的类：\n    * 该类必须实现\
    \ `run()` 方法。\n\n现在问题出现了：我们应该选择哪种方案？\n\n* 方法 1：子类 `Thread`：\n    * 当对一个不继承其他类的类（自治类）进行并行化时。\n\
    \    * 注意：`java` 中的简单继承。\n    * 使用 `extends Thread` 或 `implements Runnable` 均可。\n\
    * 方法 2：实现 `Runnable`：\n    * 当强制要求使用父类时。\n    * 示例，涉及 applet 的情况：\n      `public\
    \ class MyThreadApplet extends Applet implements Runnable { }`\n    * 仅实现 `Runnable`\
    \ 是有效的。\n\n让我们来看代码：\n\n* 方法 1：子类 `Thread`\n```\nclass A extends Thread {\nA (\
    \ ) {…} // 构造函数\n…\npublic void run ( ) {\n… // Thread 执行的内容\n}\n}\nA p1 = new\
    \ A( ); // 创建线程 p1\np1.start(); // 启动线程并执行 p1.run()\n```\n\n* 方法 2：实现 `Runnable`\
    \ 的类\n```\nclass B implements Runnable {\nB ( ) { …} // 构造函数\n…\npublic void run()\
    \ {\n… // Thread 执行的内容\n}\n}\nB p = new B( );\nThread p2 = new Thread(p);\n…\n\
    p2.start(); // 启动线程并执行 p.run()\n```\n\n## 1.4 线程类型\n\n存在两种类型的线程：\n\n* 用户线程：这种类型线程的活动是有时间限制的，意味着其场景是一个一定时间后结束的过程。只要有用户线程在执行，`JVM`\
    \ 就会一直运行。\n* 守护线程：只要程序运行，就在后台执行的线程。守护线程仅用于服务用户线程。如果只剩下守护线程，`JVM` 将停止。\n\n示例：编辑器中的语法高亮、垃圾回收器\
    \ (`DestroyJavaVM`) 等等。\n\n* `Thread` 类中的 `public final boolean isDaemon()` 用于确定线程类型。\n\
    * `Thread` 类的 `public final void setDaemon (boolean)` 表示该线程将是为守护线程（默认为用户线程）。\n\
    * 它必须在使用 `start()` 命令启动线程之前调用。\n* 在构造函数中使用 `setDaemon`。\n\n示例：在后台运行的时钟线程。\n```\n\
    Clock class extends Thread {\npublic () { setDaemon(true); }\npublic void run\
    \ () {\nwhile (true) {\ntry{Thread.sleep(3000);} catch (InterruptedException e)\
    \ {}\nSystem.out.println(\"time\");\n}\n}\npublic static void main(String args[]){\n\
    Clock p1 = new Clock();\np1.start();\n}\n```\n\n## 1.5 单任务与多任务\n\n为了说明多任务，让我们先从介绍单任务开始。在下面的示例中，`Parrot0.java`\
    \ 与主程序 `ChatAndParrot0.java` 以单任务对话：\n```\nclass ChatAndParrot0 {\npublic static\
    \ void main(String[]) {\nParrot0 parrot = new Parrot0(\"coco\",4);\nblabla();\n\
    parrot.run();\ntry {Thread.sleep(1000);}\n} catch (InterruptedException e) {\n\
    System.out.println(e.getMessage())); System.exit(1); }\n}\nprivate static void\
    \ blabla() {\nSystem.out.println(\"blabla\");\n}\n\nclass Parrot0 {\nprivate String\
    \ cri = null;\nprivate int fois = 0;\npublic Parrot0 (String s, int i) {\ncri\
    \ = s;\nfois = i;\n}\npublic void run () {\nfor (int n=0; n<fois; n++) {\ntry\
    \ {Thread.sleep(1000);} catch (InterruptedException e) {System.exit(1); }\nSystem.out.println(cri);\n\
    }\n}\n```\n执行上述代码的结果如下：\n* blabla\n* blabla\n* coco\n* coco\n* coco\n* blabla\n\
