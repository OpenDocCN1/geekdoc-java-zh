    \ display;\n  Socket socket;\n  public void init() {\n    try {\n      socket\
    \ = new Socket(\"localhost\",8765);\n    } catch (UnknownHostException e) {System.out.println(\"\
    Unknown\nhost\");}\n      catch (IOException e) { System.out.println(\"IO Exception\"\
    );}\n    numbField = new TextField(6);\n    add(numbField);\n    Button button\
