    \ e) {\n       System.err.println(\"Have you launched the server?\");\n       System.exit(2);\n\
        }\ntry {\n       System.out.println(hello.Hello()); // call remote method\n\
        } catch (RemoteException e) {\n       System.err.println(\"The server appears\
