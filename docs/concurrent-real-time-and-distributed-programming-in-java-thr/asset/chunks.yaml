  trans: "\n\n问题发生在 `Point` 类型对象的传输上，该对象必须是 `Serializable`（序列化的）。\n\n### 传输远程对象：RMI\
    \ 多线程服务器（聊天室）\n\n- 每个客户端都是一个线程，并有三种可能的动作：加入、说话或离开。\n- 服务器现在必须维护一个分布式对象列表（`Remote`）。\n\
    - 使用 `synchronized` 来保证数据的一致性。\n- 客户端的操作必须显示给其他客户端。\n- 使用 `Jframe` (Swing) 实现线程。\n\
    \n#### 第一个客户端：\n![images](img/f0111-01.jpg)\n\n#### 第二个客户端：\n![images](img/f0111-02.jpg)\n\
    \n#### 第三个客户端：\n![images](img/f0112-01.jpg)\n\n当第三个客户端断开连接时，第一个客户端应该看到此内容：\n![images](img/f0112-02.jpg)\n\
    \n第二个客户端如下：\n![images](img/f0113-01.jpg)\n\n```java\nimport java.rmi.*;\npublic\
    \ interface ChatInterface extends Remote {\n  public void rejoindre (Notify n)\
    \ throws RemoteException;\n  public void parler (Notify n, String s) throws RemoteException;\n\
    \  public void laisser (Notify n) throws RemoteException;\n}\nimport java.rmi.*;\n\
    public interface Notify extends Remote { // Notify 指向客户端\n  public String getName()\
    \ throws RemoteException;\n  public void setName(String s) throws RemoteException;\n\
    \  public void joinMessage (String name) throws RemoteException;\n  public void\
    \ sendMessage (String name, String message) throws RemoteException;\n  public\
    \ void exitMessage (String name) throws RemoteException;\n} // name 是客户端的名字。\n\
    ```\n\n#### 服务器端：\n\n```java\npublic class Serveur extends UnicastRemoteObject\
    \ implements ChatInterface { \nprivate Collection<Notify> threadList = new ArrayList<Notify>();\n\
    \  public Serveur() throws RemoteException {}\npublic synchronized void join (Notify\
    \ n) throws RemoteException {\nthreadList.add(n);\n// 遍历列表\nfor (Iterator i =\
    \ threadList.iterator();i.hasNext(); ) {\nNotify client = (Notify)i.next(); //\
    \ 从列表中获取元素\nclient.joinMessage(n.getName());\n               }\n  }\n…\n…\n```\n\
    \n`Collection` 是由 `ArrayList` 实现的接口。\n\n`iterator()` 是 `Collection` 的一个方法，返回表上的\
    \ `Iterator`（`Iterator` 是一个用于指定表上迭代器的接口）。`hasNext()` 和 `next()` 是 `Iterator` 的方法。\n\
    \n实现 `Notify` 的类部分：\n![images](img/f0114-01.jpg)\n\n#### 4.2.2.5 RMI 中的安全管理\n\n\
    在下载代码时，安全性非常重要（执行来自远程服务器的代码可能是危险的）。能够从远程传输可执行代码在理论上是一个安全漏洞。在本地传输代码时，没有安全问题。\n\n\
    - **解决方案：**\n  - 实现一个“安全管理器”（security manager）。\n- **Java 中的通用解决方案：**\n  - 使用\
    \ `java.lang.SecurityManager`（自 `Object`）。\n  - 这允许指定访问文件等权限。\n- **针对 RMI 的特定解决方案：**\n\
    \  - 使用 `java.rmi.RMISecurityManager`。\n  - `public class RMISecurityManager extends\
    \ SecurityManager`。\n\n使用 RMI，有两种管理安全性的方法：\n\n- 使用 `SecurityManager` 的子类代替 `RMISecurityManager`。\n\
    ```java\npublic class SecurityManagerOu extends SecurityManager{\npublic void\
    \ checkPermission(Permission perm) { }\n```\n- 将 `RMISecurityManager` 结合（从 Java\
    \ 2 开始）描述权限的文件：`java.policy`。`java.policy` 文件定义了安全策略以指定授权的操作。\n路径位于 `C:\\Program\
    \ Files (x86)\\Java\\jdk1.8.0_25\\jre\\lib\\security`。\n\n`java.policy` 的内容示例：\n\
    ```java\ngrant {\npermission java.security.AllPermission;\n};\n```\n它允许所有方法调用（无安全策略）。\n\
    \n```java\ngrant {\npermission java.net.SocketPermission \"*:1024-6535\", \"connect,accept\"\
    ;\npermission java.net.SocketPermission \"*:80\", \"connect\";\npermission java.io.FilePermission\
    \ \"C:\\\\temp\\\\m2d.txt\", \"read\";\npermission java.io.FilePermission \"C:\\\
    \\temp\\\\test.exe \", \"read, write,delete,execute\";\n};\n```\n它允许所有 RMI 客户端在\
    \ 1024 到 6535 端口建立套接连接，并连接到所有机器上的默认服务器（80 端口）。它还定义了与文件相关的权限。\n\n要安装安全管理器，执行以下代码：`System.setSecurityManager(new\
    \ SecurityManager())`。\n\n示例：\n```java\npublic static void main (String args[])\
    \ { // 服务器\nSystem.setSecurityManager (new SecurityManager ()) ;\ntry {\nLocateRegistry.createRegistry(1099);\n\
    } catch (RemoteException e) {\nSystem.err.println(\"rmiregistry is already launched\
    \ on this port\");\nSystem.exit(1);\n}\n```\n\n使用 `java.policy`：\n```bash\n$ javac\
    \ Server.java\n$ java -Djava.security.policy=java.policy Server\n```\n\n我们也可以在\
    \ TLS 下使用 RMI：\n\n- 传输层安全（`TLS`），以前称为安全套接层（`SSL`），是一种安全协议。能够远程传输可执行代码在理论上是一个安全漏洞。在本地传输代码时，没有安全问题。\n\
    **目标：**\n- 客户端身份验证。\n- 可选的身份验证。\n- 数据的机密性。\n- 数据的完整性。\n- 数据的会话。\n- 数据的授权。\n- 数据的传输层。\n\
    - TLS 传输。\n- 自 Java 5.0 以后。\n- 数据的加密版本。\n- JSSE 扩展。\n- JSSE API。\n- JSSE 类分组。\n\
    \n![image](img/fig-13)\n图 13. 带 TLS 的 RMI。\n- TLS 传输。\n- 传输层。\n\n"
- fmt: "\n# Objective: increase dynamism.\n\nIn this case, each element (client or\
    \ server) can play both roles indifferently (client and server simultaneously).\n\
    \nServer calls towards the client are called callbacks.\n\n- Since the server\
    \ does not know the way this type of method is implemented and that its execution\
    \ time can be long, the callbacks will generally be implemented as asynchronous\
    \ operations.\n- The server avoids penalizing the other clients with a synchronous\
    \ call.\n- Synchronous call → Blocked execution awaiting result.\n- The callback\
    \ is a mechanism that allows the introduction of asynchronicity in RMI, whose\
    \ invocations are naturally synchronous and blocking.\n- An asynchronous method\
    \ is always `void` (returns no result).\n- The program making the call does not\
    \ need an immediate result; if not, it will be blocked.\n- In Java methods are\
    \ synchronous except for the `start()` method of a thread.\n- `start()` does not\
    \ block the calling thread.\n- The client passes the object to callback (Remote\
    \ object) as a parameter to the server.\n- The client leaves its coordinates to\
    \ be called back subsequently.\n- First interface: `ServerInterface` (server side\
    \ implementation).\n- The server executes an asynchronous call on the object.\n\
    - A thread must perform the callback.\n- Second interface: `InterfaceCallback`\
    \ (client side implementation).\n\n![image](images/fig4-14.jpg)\n\n**Figure 4.14.**\
    \ Callback in RMI. For a color version of the figure, see [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
    \nTo perform the callback, we need six classes as follows:\n\n![image](images/fig4-15.jpg)\n\
    \n**Figure 4.15.** Necessary classes for a callback. For a color version of the\
    \ figure, see [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
    \n`InterfaceCalback.java`: interface containing the callback method. This interface\
    \ is implemented by `Callback.java`.\n\nAn example of this interface is as follows:\n\
    \n```java\nimport java.rmi.Remote ;\nimport java.rmi.RemoteException ;\npublic\
    \ interface InterfaceCallback extends Remote {\n  public void doCallback () throws\
    \ RemoteException ;\n}\n```\n\nIt is the interface of the callback method that\
    \ is implemented on the client side.\n\n`Callback.java`: the class that implements\
    \ the callback method. This class is available only on the client side to implement\
    \ the callback method.\n\n```java\nimport java.rmi.RemoteException ;\nimport java.rmi.server.UnicastRemoteObject\
    \ ;\npublic class Callback extends UnicastRemoteObject implements\nInterfaceCallback\
    \ {\npublic Callback ( ) throws RemoteException {}\npublic void doCallback ()\
    \ throws RemoteException {\n  System.out.println (\"Bonjour tous le monde\") ;\n\
    }\n}\n```\n\n`Servant.java`: the thread which launches the callback method.\n\n\
    ```java\nimport java.rmi.*;\npublic class Servant extends Thread {\nprivate InterfaceCallback\
    \ obj ;\npublic Servant (InterfaceCallback obj) {\nthis.obj = obj ;\n}\npublic\
    \ void run ( ) { // execution as a separate thread\ntry {Thread.sleep (3000) ;\
    \ } catch ( InterruptedException e ) { }\ntry {obj.doCallback () ; // executes\
    \ the callback, calls the method on the client side\n}\ncatch (RemoteException\
    \ e ) {\n  System.err.println (\"Return call failed: \" + e ) ;\n}\n}\n}\n```\n\
    \n`InterfaceServer.java`: interface containing the method used by the server in\
    \ order to call back the client, the parameter of this method is the object to\
    \ call back. This interface is implemented by `Server.java`.\n\n```java\nimport\
    \ java.rmi.Remote;\nimport java.rmi.RemoteException;\npublic interface InterfaceServeur\
    \ extends Remote {\n  public void callMeBack (InterfaceCallback obj) throws RemoteException\n\
    ;\n}\n```\n\nThe `callMeBack` method is used by the client.\n\n`Client.java`:\
    \ creates the object and passes it to the server (call the method of the `InterfaceServer`\
    \ that is implemented on the server side).\n\nMake a classic RMI to be called\
    \ back:\n\n```java\nimport java.rmi.Naming ;\npublic class Client {\npublic static\
    \ void main( String [ ] args ) throws Exception {\nCallback obj = new Callback\
    \ ( ) ; // creation of the callback object\nInterfaceServeur serv= (InterfaceServeur)\
    \ Naming.lookup (\"Server\");\nSystem.out.println (\"Starting call\");\nserv.callMeBack\
    \ (obj) ; // call request\n}\n}\n```\n\n`Server.java`: implements the method that\
    \ calls back the client passing the received object of this last thread.\n\n```java\n\
    import java.rmi.Naming;\nimport java.rmi.RemoteException;\nimport java.rmi.registry.LocateRegistry;\n\
    import java.rmi.server.UnicastRemoteObject;\npublic class Server extends UnicastRemoteObject\
    \ implements\nInterfaceServer {\npublic Server ( ) throws RemoteException { }\n\
    public void callMeBack (InterfaceCallback obj) throws RemoteException {\nServant\
    \ servant = new Servant (obj) ; // Creation of the thread\nservant.start ( ) ;\
    \ // Initialization of the thread\n}\npublic static void main( String [ ] args\
    \ ) throws Exception {\ntry {LocateRegistry.createRegistry(1099);} catch (RemoteException\
    \ e1) {\n    System.err.println(\"rmiregistry is already ready\"); }\nServer serv\
    \ = new Server ( )\nNaming.bind (\"Server\", serv) ;\n}\n```\n\nExecution:\nServer\
    \ side: ready.\nClient side: starting.\nHello.\n\n## 4.2 Garbage Collector in\
    \ RMI\n\n- Difficulty: so remote.\n- Goal: prevent referencing losses. With RMI:\
    \ mechanism managed by:\n    - *Reference counting:* number of clients counting\
    \ the object.\n        - Each transmission +1.\n        - Each end of referencing\
    \ -1.\n    - *Lease:* Memory that is “let” to an object for a limited time.\n\
    \        - By default 600000 milliseconds (10 min), changeable with the property\
    \ `java.dgc.leaseValue`.\n        - To modify it, do it upon launching the program:\
    \ `-Djava.dgc.leaseValue=20000`.\n\n### Exercise 1: lifecycle of a thread\n\n\
    Consider the following:\n\n```java\nclass Parrot4 extends Thread{\n  private String\
    \ cri = null;\n  private int fois = 0;\n  public Parrot4 (String s, int i) {\n\
    \    cri = s;\n    fois = i;\n  }\n  public void run() {\n    System.out.println(\"\
    Thread parrot:\" + Thread.currentThread().getName());\n    for (int n=0; n<fois;\
    \ n++) {\n      try { Thread.sleep(1000); }\n      catch(InterruptedException\
    \ e) { }\n      System.out.println(cri);\n    }\n  }\n}\n```\n\n```java\nclass\
    \ ChatAndLaunchParrot{\n  public static void main(String args[]) {\n    Parrot4\
    \ parrot = new Parrot4(\"coco\",5);\n    parrot.start();\n    System.out.println(\"\
    Thread chatty : \" + Thread.currentThread().getName());\n    for (int n=0; n<15;\
    \ n++) {\n      try { Thread.sleep(1000); }\n      catch(InterruptedException\
    \ e) { }\n      System.out.print(\"Thread parrot isAlive: \"+ parrot.isAlive()\
    \ + \"\\t\");\n      blabla();\n    }\n  }\n  private static void blabla() {\n\
    \    System.out.println(\"blabla\");\n  }\n}\n```\n\nQuestion: Launch the execution\
    \ of the above program.\n\nWhat is the name of the primary thread, what is the\
    \ name given by default to the other thread? What is the point of the `isAlive()`\
    \ method? *Hint*: the class method `currentThread()` returns a pointer on the\
    \ object `Thread`, which calls this method.\n\n##### Exercise 2: properties of\
    \ different threads\n\nConsider the following two classes:\n"
