  trans: "\n\n-   没有一种可以完全避免优先级反转的简单解决方案。尽管如此，可以通过某些措施来限制这些风险。特别是，可以仅允许具有相似优先级的线程访问临界区域。\n\
    \n提出了两种解决方案：\n\n-   `优先级上限` (Priority ceiling)：\n    - `优先级上限协议` (`PCP`)：这包括为每个资源关联一个优先级上限。该资源的优先级定义为可以使用该资源的任务中的优先级加\
    \ 1。调度器将此优先级传递给访问该资源的每个任务。当任务完成对资源的使用后，其优先级恢复到原始值。\n\n-   `优先级继承` (Priority inheritance)：\n\
    \    - `优先级继承协议` (`PIP`)：当任务 `T2`（高优先级）在访问资源 `R` 时被阻塞，被阻塞的任务 `T1`（低优先级）继承 `T2`\
    \ 的优先级。`T1` 使用继承来的优先级，直到 `R` 被释放，届时它将重新获得获取该资源之前的优先级。\n\n## 3.2. 实时环境中的 Java\n\
    \nJava 最初是为车载设备设计的。但 Java 很快开始被用于 Web 应用程序（Applet）。随后，Java 被用于以下应用：\n\n-   经典的\
    \ `J2SE` (`Java 2 标准版`) 用于客户端工作站（`JVM` 经典，`HotSpot`）。\n\n-   业务级 `J2EE` (`Java\
    \ 2 企业版`) 用于业务应用开发（`HotSpot`）。\n\n-   精版的 `J2ME` (`Java 2 微型版`) 用于移动系统，如个人助手平板电脑和手机（经典\
    \ `JVM`、`Kilo VM` (`KVM`)、`Card VM`（内置在打印芯片上的 `JVM`））。\n\n请注意，这里的语言并非为实时设计，原因如下：\n\
    \n-   缺乏调度方面的专业知识；\n-   Windows 在管理线程间优先级方面存在困难；\n-   对于 `notify()` 或 `notifyAll()`，对所选线程没有规定，不一定是先入先（FIFO）；\n\
    -   它是 Java 少数不具备移动性的功能之一；\n-   垃圾回收器`/GC` 存在问题；\n-   `GC` 可以在任何时间执行；\n-   `GC`\
    \ 可能持续特定的时长；\n-   `GC` 无法被抢占；\n-   `GC` 会抢占任何线程。\n\n### 3.2.1. `RTSJ (Java 实时规范)`\n\
    \n这是一个关于扩展 `JVM` 实时功能（`JVM RTSJ`）的提案 [JAV 17a]。\n\n规范由来自多家公司（Sun、`IBM`、`QNX`、`Nel`\
    \ 等）的专家小组完成。\n\n限制条件：\n\n-   与现有程序兼容：任何非实时 Java 应用程序都可以在 `JVM RTSJ` 上运行。\n-  \
    \ 无语法扩展。\n-   无硬件或电力的前提要求。\n-   可预测的执行时间。\n-   粒度：纳秒。64 位 (ms) + 32 位 (ns)。\n\
    -   `RTSJ` 在以下领域改进了 Java 实时编程：\n    -   内存管理。\n    -   时钟和时间管理。\n    -   调度和“可调度”对象。\n\
    \    -   实时线程。\n    -   异步事件和定时器的管理。\n    -   同步和资源共享。\n    -   新增的包 `javax.realtime`\
    \ [JAV 17b]。\n    -   三个接口。\n    -   47 个类。\n    -   15 个异常。\n    -   4 个错误。\n\
    -   `RTSJ`: 线程\n    -   一个接口：\n        -   `Schedulable`：可以被调度的对象，自 `java.lang.Runnable`。\n\
    \        -   `public interface Schedulable extends java.lang.Runnable`。\n    -\
    \   两个新类：\n        -   `RealtimeThread`。\n        -   `public class RealtimeThread\
    \ extends java.lang.Thread implements Schedulable`。\n        -   可以访问堆。优先级低于 `GC`\
    \ (`DestroyJavaVM`)。\n        -   `NoHeapRealtimeThread`。\n        -   `public\
    \ class NoHeapRealtimeThread extends RealtimeThread`。\n        -   它的优先级高于 `GC`。在\
    \ `ScopedMemory` 内工作，该线程内的对象被分配到该内存中。\n    -   `ScopedMemory` 具有以下特性：\n      \
    \  -   其生命周期与占用它的实时线程一致。\n        -   不由垃圾回收器管理。\n        -   对象可以在 `ScopedMemory`\
    \ 内分配（而不是在 `HeapMemory` 中）。\n        -   对象在作用域结束时释放。\n        -   `NoHeapRealtimeThread`\
    \ 无法访问堆 (`Heap`)。\n        -   因此，`NoHeapRealtimeThread` 不会被垃圾回收器阻塞。\n    -  \
    \ 优先级的组织方式如下：\n        `Thread` < `RealtimeThread` < `Garbage Collector` < `NoHeapRealtime\
    \ Thread`。\n\n### 3.2.2. 实现\n\n以下是研究的三种实现：\n\n-   `参考实现: RI`。\n    -   面向研究，旨在证明\
    \ Java 实时探索的可行性。由 `TimeSys` 公司实施 [TIM 17]。也存在于 `Linux/x86` 版本。\n\n其代码的执行如图所示：\n\
    \n![image](img/fig3-1.jpg)\n\n**图 3.1.** *参考实现*\n\n-   `开源实现: jRate`。\n\n`jRate`\
    \ 是一个由 Angelo Corsaro 运行 [UCI 17] 的大学项目（加州州尔文大学）。\n\n`jRate` 由以下部分组成：\n\n-   Java。\n\
    -   `C++` (`CNI`)。\n-   `JNI` (Java Native 接口)。\n-   `JVM` 通过 `C++`。\n-   `jRate`。\n\
    -   `C++`。\n-   `jRate`。\n-   `GC`。\n-   `GCC`。\n\n-   `私有实现: JamaicaVM`。\n\n\
    这是由 `AICAS` 公司针对航空航天、汽车和工业机器人领域的商业化解决方案。它拥有实时 `GC`。下图展示了其实现方案：\n\n![image](img/fig3-2.jpg)\n\
    \n**图 3.2.** *JamaicaVM 的实现*\n\n# 4\n\nJava 分布式编程\n\n## 4.1. 分布式应用的定义\n\n应用程序分为若干单元。\n\
    \n-   每个单元位于不同的机器上。\n-   每个单元可以在不同的系统上执行。\n-   每个单元可以使用不同的语言编写。\n\n![image](img/fig4-1.jpg)\n\
    \n**图 4.1.** *单体应用与分布式应用的对比。该图的彩色版本请参阅 [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)*\n\
    \n## 4.2. 分布式应用中的通信\n\n### 4.2.1. *底层通信：套接字 (socket)*\n\n#### 4.2.1.1. *定义*\n\n\
    网络套接字是一种允许进程在同一台机器或跨网络进行通信和同步的模型。\n\n套接字是由伯克大学于 1986 年开发的。\n\n对于 Java 而言，`java.net`\
    \ 包中的 `Socket` 类出现在 `J2SE 1.4`（2002 年 2 月 6 日），用于实现套接字。\n\n#### 4.2.1.2. *通信模式*\n\
    \n-   连接模式（类似于电话通信），使用 `TCP` 协议。在这种通信模式下，两个进程之间建立了持久的连接，因此每个数据包不再需要目的地址。\n\n"
- fmt: "\n- Non-connected mode (similar to a communication by mail), using the `UDP`\
    \ protocol. This mode requires the address of the destination for each package,\
    \ and does not require a confirmation of receipt.\n\nCommunication requires two\
    \ sockets: one for each of the two programs communicating over the network.\n\n\
    - One socket for the client.\n- One socket for the server (there is a second socket\
    \ for the connection on the server side).\n\nThe mode of IP communication used,\
    \ `UDP` or `TCP`, corresponds to the type of socket.\n\nIn the following section,\
    \ we will focus on `TCP` sockets.\n\nIn Java, each instance of the `Socket` class\
    \ is associated with an object of the `InputStream` class (to read the socket)\
    \ and an object from the `OutputStream` class (to write the socket).\n\n- The\
    \ server will use two types of sockets.\n- The first, called the connection socket,\
    \ serves to wait for a client.\n- In Java, creating a connection socket can be\
    \ done by simply instancing the object of the `ServerSocket` class from the package\
    \ `java.net`.\n\nExample: `ServerSocket conn = new ServerSocket(10080)`.\n\n-\
    \ The second, called the communication socket, is used to dialogue with the client.\n\
    - Once the connection socket is created, we will then ask it to wait for a client\
    \ and obtain the communication socket that will allow it to dialogue with the\
    \ client.\n- `Socket comm = conn.accept()`.\n- We can then communicate with the\
    \ client using the input and output streams associated with the socket.\n    -\
    \ `ServerSocket(numberPort)`: creates a `ServerSocket` object on this port number.\n\
    \    - `accept()`: waits for a connection from a slow client machine. Upon the\
    \ arrival of a connection demand from a client machine, a socket is created to\
    \ connect to the server. This will be the object returned with the blocking method\
    \ `accept()`.\n    - `ServerSocket(numberPort, int backlog)`: creates a `ServerSocket`\
    \ object on this port number with a queue for the connection of a size specified\
    \ by the `backlog`.\n- Connection demands, when the queue is full, are rejected\
    \ and cause an exception from the client’s side. By default, the size is 50.\n\
    \nA few methods:\n\n- `accept()`: waits for a connection from a client machine.\n\
    - `close()`: closes the `ServerSocket` and any ongoing sockets obtained by its\
    \ `accept` method.\n- `isClosed()`: indicates whether the socket is closed.\n\
    - `getLocalPort()`: returns the local port number.\n- `InetAddress getInetAddress()`:\
    \ returns the server address. `InetAddress` represents an IP address and potentially\
    \ the name of the machine.\n- `getHostName()`: returns the host name memorized\
    \ in the `InetAddress` type object, under the form of a chain of characters.\n\
    - `getHostAddress()`: returns the IP address memorized in the `InetAddress` type\
    \ object, under the form of a chain of characters.\n- `getByName(String host)`:\
    \ returns the IP (`InetAddress` object) depending on the name in the parameters.\n\
    \nThe aim of the following code is to find the IP address corresponding to a machine\
    \ name passed as an argument:\n\n```java\nimport java.net.*;\npublic class ResolveName{\n\
    \  public static void main(String[ ] args){\nInetAddress adresse;\ntry{\nadresse=InetAddress.getByName(\"\
    localhost\");\nSystem.out.println(adresse.getHostAddress());\nadresse=InetAddress.getByName(\"\
    www.facebook.com\");\nSystem.out.println(adresse.getHostAddress());\nSystem.out.println(adresse);\n\
    }catch(UnknownHostException e) { }\n}\n}\n```\n\nExecution:\n\n127.0.0.1\n31.13.75.36\n\
    [www.facebook.com/31.13.75.36](http://www.facebook.com/31.13.75.36)\n\nUnlike\
    \ the server, the client only uses one single socket: the communication socket.\n\
    \n- Connection to the server and obtaining the communication socket.\n- `Socket\
    \ comm = new Socket (\"localhost\", 10080)`.\n- The `Socket` constructor is a\
    \ blocking method on the client side.\n\nWe can then communicate with the server\
    \ using the input and output streams associated with the socket.\n\n- Nine constructors\
    \ of which two are said to be deprecated, so seven constructors, including:\n\
    \    - `Socket(String host, int port)`.\n    - `Socket(InetAddress address, int\
    \ port)`.\n    - Uses the IP: `InetAdress`.\n\nA few methods:\n\n- `close()`:\
    \ properly closes the socket and is likely to raise an exception `UnknownHostException`.\n\
    - `getOutputStream()`: returns an `OutputStream` for the socket.\n- `getInputStream()`:\
    \ returns an `InputStream` for the socket.\n- `getPort()`: returns the distant\
    \ port number to which the socket is connected.\n- `InetAddress getInetAddress()`:\
    \ returns the address of the distant machine.\n- `isClosed()`: indicates whether\
    \ the socket is closed.\n- `isConnected()`: returns the state of the socket connection.\n\
    - `connect(SocketAddress adresseSocket)`: connects the server to the socket.\n\
    - `connect(SocketAddress adresseSocket, int timeout)`: connects the socket to\
    \ the server with an epiration value in the order of the milliseconds.\n- Raises\
    \ a `SocketTimeoutException` if the delay has already expired.\n- `SocketAddress`\
    \ is an abstract class.\n- `InetSocketAddress` inherits `SocketAddress` and is\
    \ a class representing an `InetAddress` and a port.\n- `InetSocketAddress(InetAddress\
    \ ina, int port)`.\n- `InetSocketAddress(String hostName, int port)`.\n\nThe following\
    \ code is used to create a socket with a timeout by using `connect`:\n\n```java\n\
    Socket sock = null;\ntry {\nint port = XYZ;\nint timeOut = 3000;\nSocketAddress\
    \ sockAddr = new InetSocketAddress(\"host\", port);\nsock = new Socket(); // The\
    \ constructor creates a socket with no connection.\nsock.connect(sockAddr, timeOut);\
    \ // The delay in milliseconds so 3 seconds.\n} catch (UnknownHostException e)\
    \ {\n} catch (SocketTimeoutException e) {\n}\n```\n\nA connection request blocks\
    \ until the connection is established or the timeout expires; if the delay has\
    \ expired, a `SocketTimeoutException` is raised.\n\n### 4.2.3 Example of communication\n\
    \nIn the following, we present a very simple example of communication with the\
    \ TCP sockets:\n\n- The client sends a message to the server.\n- The server confirms\
    \ receipt and requests the next word.\n- To disconnect, the client sends the word\
    \ “no”.\n\n![image](images/fig4-2.jpg)\n\n**Figure 4.2.** *Example of communication\
    \ with Sockets. For a color version of the figure, see [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)*\n\
    \nThe server code is as follows:\n\n```java\nimport java.net.*;\nimport java.io.*;\n\
    class ServerEcho {\n  public static void main(String args[]) {\n    ServerSocket\
    \ server = null;\n    try {\n      server = new ServerSocket(7777); // connection\
    \ socket\n      while (true) {\n        Socket sock = server.accept(); // waiting\n\
    \        System.out.println(\"connected\");\n        PrintWriter sockOut = new\
    \ PrintWriter(sock.getOutputStream(), true);\n        BufferedReader sockIn =\
    \ new BufferedReader(new\n        InputStreamReader(sock.getInputStream()));\n\
    \        String recu;\n        while ((recu = sockIn.readLine()) != null) {\n\
    \          System.out.println(\"recu:\"+recu);\n          sockOut.println(\"next?\
    \ \");\n        } //end while\n        sockOut.close();\n        sock.close();\n\
    \      } //end while (true)\n    } catch (IOException e) {\n      try {server.close();}\n\
    \      catch (IOException e2) {}\n    } // end first catch\n  } // end main\n\
    } // end class\n```\n\n![image](images/fig4-3.jpg)\n\n**Figure 4.3.** *Diagram\
    \ of communication with Sockets. For a color version of the figure, see [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)*\n\
    \nThe client code is as follows:\n"
