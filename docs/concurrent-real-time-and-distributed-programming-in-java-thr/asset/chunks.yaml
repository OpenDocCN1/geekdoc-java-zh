    \n#### 4.2.2.8\\. *Distributed garbage collector in RMI*\n\n*   – Difficulty:\
    \ distributed environment so remote references.\n\n*   – Goal: prevent referencing\
    \ message losses.\n\nA distant object is made available for the DGC (distributed\
    \ garbage collector), if there are no more stubs present.\n\n*   – With RMI: double\
    \ mechanism managed by:\n\n    *   - *Reference counting:* number of clients counting\
    \ the object.\n\n        *   - Each reference transmission +1.\n\n        *  \
    \ - Each end of referencing –1.\n\n    *   - *Lease:* Memory that is “let” to\
    \ an object for a limited time.\n\n        *   - By default 600000 milliseconds\
    \ (10 min), changeable with the property java.rmi.dgc.leaseValue (starting in\
    \ version 1.1 of the JDK).\n\n        *   - To modify it, do it upon launching\
    \ the program:\n\n$ java -Djava.rmi.dgc.leaseValue=20000 Server.\n\nIf the counter\
    \ falls below 0 or if the lease expires, the object becomes a candidate for the\
    \ DGC.\n\n# Appendix\n\n##### Exercise 1: lifecycle of a thread\n\nConsider the\
    \ following class:\n\n```\nclass Parrot4 extends Thread{\n private String cri\
    \ = null;\n private int fois = 0;\n public Parrot4 (String s, int i) {\n  cri\
