- fmt: "\n![](images/cover.jpg)\n\n![Cover Page](images/cover.jpg)\n\n# Introduction\n\
    \nThis book constitutes an introduction to real-time and distributed concurrent\
    \ computing, using `Java` object-oriented language as a support tool for describing\
    \ algorithms. It describes in particular the synchronization mechanisms (in cooperation\
    \ and in competition) and data-sharing mechanisms (internal class, static type\
    \ variables) between threads in `Java`. We then discuss the use of `Java` for\
    \ real-time applications. Subsequently, a presentation of `RTSJ` (Real-Time Specification\
    \ for Java) is also introduced in this book. Finally, a presentation of distributed\
    \ computing can also be found. We focus in particular on low-level communication\
    \ using `TCP Sockets` and high-level communication using `Java RMI` (Remote Method\
    \ Invocation) middleware. The book also contains an appendix including a set of\
    \ practical application exercises in relation to the theme of the book. Knowledge\
    \ of `Java` language is a prerequisite to properly understanding this book.\n\n\
    # 1 Introduction to Threads in Java\n\n## 1.1 Processes versus threads\n\nThe\
    \ operating system is tasked with allocating the necessary resources (memory,\
    \ processing time, inputs/outputs) to the processes and ensuring they do not interfere\
    \ with one another (isolation) [TAN 01].\n\nThis principle is illustrated in the\
    \ following example in which variable `a` is defined in two different classes.\
    \ When executing both classes, the two allocated memory zones for this variable\
    \ are completely isolated.\n\n![image](images/fig1-1.jpg)\n\n**Figure 1.1.** Isolation\
    \ between processes\n\nMost operating systems offer a distinction between:\n\n\
    * Heavy-weight processes: supposedly completely separate from one another.\n*\
    \ Light-weight processes (threads): which share a memory space (as well as other\
    \ resources) in common.\n\nDEFINITION 1.– A thread is a string of code capable\
    \ of executing alongside other processes. Threads do not execute at the same time\
    \ but rather using shared time, this is why it is important that a thread always\
    \ gives others a chance to execute.\n\nThe diagram below shows the execution and\
    \ latency times for four different threads.\n\n![image](images/fig1-2.jpg)\n\n\
    **Figure 1.2.** Execution and latency times of four different threads\n\n## 1.2\
    \ Concurrent computing\n\nA concurrent programming language must allow the following:\n\
    \n* creation of threads;\n* sharing data between threads;\n* synchronization among\
    \ threads: controlling the task execution order depending on the two following\
    \ models:\n    * Competition synchronization: when more than one thread is using\
    \ the same resource. There must then be a system for mutual exclusion in order\
    \ to avoid processes interfering with each other.\n    * Cooperation synchronization:\
    \ when one thread waits for another to finish executing before starting its own\
    \ execution.\n\n## 1.3 Thread creation\n\nThere are two ways to create a thread\
    \ in `Java`:\n\n* A class derived from `java.lang.Thread`:\n    * `java.lang.Thread`\
    \ implements `Runnable` class.\n    * `Thread` extends `Object` implements `Runnable`\
    \ public class.\n    * The `Thread` class must implement the `run()` method.\n\
    \    * The daughter class inherits the `run()` method.\n* A class that implements\
    \ the `Runnable` interface:\n    * The class must implement the `run()` method.\n\
    \nNow, a question arises: which solution should we choose?\n\n* Method 1: subclassing\
    \ `Thread`:\n    * When parallelizing a class which does not inherit from another\
    \ class (autonomous class).\n    * Note: simple inheritance in `java`.\n    *\
    \ `extends Thread` or `implements Runnable`, either way.\n* Method 2: implement\
    \ `Runnable`:\n    * When a superclass is imposed.\n    * Example, case involving\
    \ applets:\n      `public class MyThreadApplet extends Applet implements Runnable\
    \ { }`\n    * Only implements `Runnable` is valid.\n\nLet us look at the code:\n\
    \n* Method 1: subclassing `Thread`\n```\nclass A extends Thread {\nA ( ) {…} //\
    \ The constructor\n…\npublic void run ( ) {\n… // What the Thread does\n}\n}\n\
    A p1 = new A( ); // Creation of thread p1\np1.start(); // Starts the thread and\
    \ executes p1.run()\n```\n\n* Method 2: class that implements `Runnable`\n```\n\
    class B implements Runnable {\nB ( ) { …} // Constructor\n…\npublic void run()\
    \ {\n… // What the Thread does\n}\n}\nB p = new B( );\nThread p2 = new Thread(p);\n\
    …\np2.start(); // Starts the thread and executes p.run()\n```\n\n## 1.4 Types\
    \ of thread\n\nTwo types of thread exist:\n\n* User threads: this type of thread’s\
    \ activity is time-restricted, meaning its scenario is a process which ends after\
    \ a certain amount of time. The `JVM` functions as long as there are user threads\
    \ being executed.\n* Daemon threads: threads that execute in the background as\
    \ long as the program is running. Daemon threads are only there to serve user\
    \ threads. The `JVM` stops if there are only daemons.\n\nExamples: syntax coloring\
    \ in editors, garbage collectors (`DestroyJavaVM`), etc.\n\n* `public final boolean\
    \ isDaemon()` in the `Thread` class to determine the thread’s type.\n* `public\
    \ final void setDaemon (boolean)` of the `Thread` class indicates whether the\
    \ thread will be a daemon or not (user thread by default).\n* It must be called\
    \ before the thread starts using the `start()` command.\n* Use `setDaemon` in\
    \ the constructor.\n\nExample: clock thread running in the background.\n```\n\
    Clock class extends Thread {\npublic () { setDaemon(true); }\npublic void run\
    \ () {\nwhile (true) {\ntry{Thread.sleep(3000);} catch (InterruptedException e)\
    \ {}\nSystem.out.println(\"time\");\n}\n}\npublic static void main(String args[]){\n\
    Clock p1 = new Clock();\np1.start();\n}\n```\n\n## 1.5 Monotask versus multitask\n\
    \nTo illustrate multitask, let us begin by presenting monotask. In the following\
    \ example, `Parrot0.java` converses in monotask with the primary program `ChatAndParrot0.java`:\n\
    ```\nclass ChatAndParrot0 {\npublic static void main(String[]) {\nParrot0 parrot\
    \ = new Parrot0(\"coco\",4);\nblabla();\nparrot.run();\ntry {Thread.sleep(1000);}\n\
    } catch (InterruptedException e) {\nSystem.out.println(e.getMessage())); System.exit(1);\
    \ }\n}\nprivate static void blabla() {\nSystem.out.println(\"blabla\");\n}\n\n\
    class Parrot0 {\nprivate String cri = null;\nprivate int fois = 0;\npublic Parrot0\
    \ (String s, int i) {\ncri = s;\nfois = i;\n}\npublic void run () {\nfor (int\
    \ n=0; n<fois; n++) {\ntry {Thread.sleep(1000);} catch (InterruptedException e)\
    \ {System.exit(1); }\nSystem.out.println(cri);\n}\n}\n```\nExecuting the previous\
    \ code results in the following:\n* blabla\n* blabla\n* coco\n* coco\n* coco\n\
    * blabla\n* blabla\n\nNothing special, the primary program talks, passes to the\
    \ parrot’s run and the execution ends with the three blabla. To perform the multitask,\
    \ a modification of the previous code is necessary. We will perform this in two\
    \ different ways.\n\n* Extending the `Thread` class:\n```\nclass ChatAndParrot2{\n\
    public static void main(String args[]) {\nParrot2 parrot = new Parrot2(\"coco\"\
    ,10);\nparrot.start();\nfor (int n=0; n<10; n++) {\ntry {Thread.sleep(1000);}\n\
    catch (InterruptedException e) { }\nblabla();\n}\n}\nprivate static void blabla()\
    \ {\nSystem.out.println(\"blabla\");\n}\n\nclass Parrot2 extends Thread{\nprivate\
    \ String cri = null;\nprivate int fois = 0;\npublic Parrot2 (String s, int i)\
    \ {\ncri = s;\nfois = i;\n}\npublic void run ( ){\nfor (int n=0; n<fois; n++)\
    \ {\ntry {Thread.sleep(1000);}\ncatch (InterruptedException e) { }\nSystem.out.println(cri);\n\
    }\n}\n}\n```\n"
