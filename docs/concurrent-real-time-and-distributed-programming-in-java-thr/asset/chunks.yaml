    \n## 2.10. Semaphore in Java\n\nDEFINITION.– A semaphore is a high-level object\
    \ that helps manage the concurrent access to a shared resource, which accepts\
    \ at most N concurrent access.\n\nExamples:\n\n- – managing entrances/exits in\
    \ a parking lot with N spaces;\n- – managing a waiting room at a doctor’s office,\
    \ hairdressing salon, insurance company, etc. with N available chairs.\n\n###\
    \ 2.10.1 Before Java 1.5\n\nA semaphore object encapsulates one whole and two\
    \ atomic operations of incrementation and decrementation. The method `P` contains\
    \ the wait and method `V` contains the notify.\n\nA possible class used to implement\
    \ the semaphore is as follows:\n\n![images](images/f0055-01.jpg)\n\nEach thread\
    \ that wishes to access the critical section must use the method `P` and, subsequently,\
    \ it will decrement the counter variable.\n\nAfter access by the first four threads,\
    \ the content of the critical section and the value of the counter will be as\
    \ follows in the case where a fifth thread should wish to access the critical\
    \ section.\n\n![images](images/f0056-01.jpg)\n\nIf T4 exits the critical section,\
    \ it has to use method `V` (increment the counter and make a notify).\n\n![images](images/f0056-02.jpg)\n\
    \nAs T5 is the only thread to have been blocked by wait, it will enter the critical\
    \ section after it receives a notify from T4.\n\n![images](images/f0057-01.jpg)\n\
    \nAfter all the threads have exited the critical section, the state of the latter\
    \ and the value of the counter will be as follows:\n\n![images](images/f0057-02.jpg)\n\
    \n### 2.10.2 After Java 1.5\n\nVersion 1.5 of Java and its package `java.util.concurrent`\
    \ (along with all of its sub-packages) provide high-level synchronization tools.\n\
    \n- – Operation `P` (`acquire()`): decrements the counter; blocks if it is negative\
    \ while waiting to be able to decrement it.\n- – Operation `V` (`release()`):\
    \ increments the counter; sends a notify if the counter is negative or null.\n\
    - – We can see the semaphore as a set of chips, with two operations:\n\n    -\
    \ - take a chip or, if necessary, wait until there is one available;\n    - -\
    \ `acquire()`, usually with wait;\n    - - put a chip back;\n    - - `release()`,\
    \ usually with notify.\n- – a semaphore has one chip and it is very similar to\
    \ a lock.\n\nThe following example is the management of a parking lot using semaphores.\
    \ The class parameter `Semaphore` indicates the size of the lot.\n\n![images](images/f0058-01.jpg)\n\
    \nExecution:\n\n```\nThread 2 is not in the parking lot\nThread 3 is not in the\
    \ parking lot\nThread 4 is not in the parking lot\nThread 0 is not in the parking\
    \ lot\nThread 1 is not in the parking lot\nThread 1 enters the parking lot\nThread\
    \ 2 enters the parking lot\nThread 3 enters the parking lot\nThread 1 exits the\
    \ parking lot\nThread 0 enters the parking lot\nThread 0 exits the parking lot\n\
    Thread 4 enters the parking lot\nThread 2 exits the parking lot\nThread 4 exits\
    \ the parking lot\nThread 3 exits the parking lot\n```\n\nBy replacing the instruction\
    \ `Semaphore sem = new Semaphore(3)` with `Semaphore sem = new Semaphore(1)` in\
    \ the previous code, we obtain the following execution:\n\n```\nThread 2 is not\
    \ in the parking lot\nThread 3 is not in the parking lot\nThread 4 is not in the\
    \ parking lot\nThread 0 is not in the parking lot\nThread 1 is not in the parking\
    \ lot\nThread 0 enters the parking lot\nThread 0 exits the parking lot\nThread\
    \ 4 enters the parking lot\nThread 4 exits the parking lot\nThread 1 enters the\
    \ parking lot\nThread 1 exits the parking lot\nThread 3 enters the parking lot\n\
    Thread 3 exits the parking lot\nThread 2 enters the parking lot\nThread 2 exits\
    \ the parking lot\n```\n\n# 3 Real-Time Systems and Real-Time Java\n\n## 3.1 Real-time\
    \ systems\n\n### 3.1.1 Definition\n\nReal-time systems are different from other\
    \ systems by virtue of the fact that they take into account time-relating restrictions\
    \ in cases where respecting time delays is as important as the accuracy of the\
    \ result; in other words, the system must not only deliver exact results, it must\
    \ deliver them within the imparted time-limits.\n\nIn real-time computing, the\
    \ correct behavior of a system depends not only on the logical processing results,\
    \ but also on the time at which the results are produced [STA 88].\n\nExamples:\n\
    \n- – An ATM cannot take 5 minutes to deliver money.\n- – A radar cannot take\
    \ 2 seconds to react.\n- – An ABS system cannot take more than 150 ms to acquire\
    \ information and 1 second to react (ABS refers to assisted braking systems using\
    \ in motor vehicles, which prevent the wheels from locking up under intense braking).\n\
    \n### 3.1.2 Examples of real-time operating systems\n\n- – Windows CE (Windows\
    \ Embedded Compact), often referred to as WinCE, is a variation of Windows for\
    \ onboard systems and other minimalist systems used, for instance, in handheld\
    \ computers.\n- – LynxOS is a real-time operating system based on the UNIX platform\
    \ developed by the company LynuxWorks for onboard applications.\n- – LynxOS is\
    \ mostly used for onboard systems such as critical aviation software, the military,\
    \ industrial manufacturing and in the communication industry.\n\n### 3.1.3 Types\
    \ of real-time\n\n- – Flexible real-time:\n\n    - The response by the system\
    \ after a certain delay progressively reduces its use.\n    - Penalties are not\
    \ catastrophic.\n    - These systems accept variations in data processing of the\
    \ order of a half-second (or 500 ms) or even a second.\nExamples: multimedia systems,\
    \ if a couple of pictures are not displayed, it does not jeopardize the operation\
    \ of the whole system.\n- – Firm real-time:\n    - Response from the system within\
    \ acceptable delays is essential.\n    - The result is of no use after the deadline.\n\
    Examples: financial trading, etc.\n- – Hard real-time:\n    - Response from the\
    \ system within delays is vital.\n    - A lack of response is catastrophic.\n\
    Examples: air traffic control, nuclear reactor control, etc.\n\n### 3.1.4 Architecture\n\
    \n- – Monotask architecture\n    - A real-time system with a single task is easy\
    \ to define. All it takes is to indefinitely repeat the following list of tasks:\n\
    \    - Wait for stimulus.\n    - Act accordingly to stimulus.\nExample: automatic\
    \ radar.\n- – Multitask architecture:\n    - Each task could be performed by a\
    \ thread. A resource could be protected by a critical section. The length of critical\
    \ sections affects the response time from the system.\nExample: intrusion detection\
    \ system (IDS) that performs various tasks in real-time, including:\n    - – Internet\
    \ traffic analysis;\n    - – identifying IPs involved in an attack;\n    - – firewall\
    \ reconfiguration;\n    - – visual notification of the alert: displaying the alert\
    \ in one or more management consoles.\n\n### 3.1.5 Task ordinance with priorities\n\
    \nPriorities help organize tasks. The higher the value of a priority, the higher\
    \ the priority for a task to access the processor. Priorities can be dynamic or\
    \ static.\n\nIn a real-time system, a task is generally never blocked by a lower\
    \ priority task.\n\n- – Consider two threads T1 and T2.\n- – T1 has a high priority\
    \ (ex: 10), T2 has a low priority (ex: 1).\n- – Upon launching the two threads,\
    \ T1 must execute before T2.\n- – At a certain point, T1 is blocked (ex: by `wait()`),\
    \ T2 runs and enters the critical section.\n- – T1 unblocks and attempts to acquire\
    \ the lock.\n- – T2 is never ordinanced and never releases the lock\n- – T2 executes\
    \ before T1.\n- – Non-management of priority inversion can have disastrous effects.\n\
    - – Indeed, as the absence of management of priority inversion implies that a\
    \ high-priority task cannot execute, it is possible for a reaction to emergency\
    \ situations not to be performed.\n\nExample: an emergency stop order for a nuclear\
    \ reactor that would be blocked by a minor-priority order.\n"
