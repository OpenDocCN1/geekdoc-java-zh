    * `MAX_PRIORITY`：最高优先级 (10)。\n* 新线程默认分配为普通优先级。\n\n## 1.9 编写任务：Timer 和 TimerTask\n\
    \n在接下来的章节中，我们希望在初始延迟后程序化任务（例如在特定时间后启动的情况），或者在一定的延迟后周期性地执行任务（软件情况）。\n\n### 1.9.1\
    \ 通过指定初始延迟\n\n以下代码在 4 秒后启动一次任务。\n\n```java\nimport java.util.Scanner;\nimport\
    \ java.util.TimerTask;\nimport java.util.Timer;\nclass InitiateTheParrot11{\n\
    public static void main(String args[]) {\n  Parrot11 parrot = new Parrot11(\"\
    coco\", 3);\n  Timer timer = new Timer();\n  timer.schedule(parrot, 4000);\n \
    \ String response=\"yes\";\n  do {\n   System.out.println(\"blabla\");\n   System.out.println(\"\
    blabla\");\n   System.out.println(\"would you like the parrot to continue? (y/n)\"\
    );\n   response =new Scanner(System.in).nextLine();\n  } while (response.equals(\"\
    y\"));\n  timer.cancel();\n }\n\nimport java.util.TimerTask;\nclass Parrot11 extends\
    \ TimerTask {\n private String cri = null;\n private int fois = 0;\n public Parrot11(String\
    \ s, int i) {\n  cri = s;\n  fois = i;\n }\n public void repeter() {\n  System.out.println(cri);\n\
    \ }\n public void run() {\n  for (int i = 0; i < fois; i++) {\n    repeter();\n\
    \  }\n}\n```\n\n### 执行：\n\nblabla\nblabla\nwould you like the parrot to continue?\
    \ (y/n)\ny\nblabla\nblabla\nwould you like the parrot to continue? (y/n)\nn\n\n\
    `TimerTask` 的定义如下：\n\n* `public abstract class TimerTask implements Runnable`。\n\
    * `TimerTask` 是一个实现了 `Runnable` 的抽象类，我们需要继承 `TimerTask` 类并重写 `run()` 方法来编写要执行的任务。\n\
    * `run()` 是 `TimerTask` 中唯一的抽象方法。\n* `Timer` 开始任务的执行。\n* `Timer` 对应一个顺序执行任务的线程。\n\
    * `schedule(task, long milliseconds)` 通过指定初始延迟来安排任务。\n* `cancel()` 方法停止 `Timer`\
    \ 的调度。\n\n### 1.9.2 带有初始延迟和周期性\n\n```java\nimport java.util.Scanner;\nimport java.util.TimerTask;\n\
    import java.util.Timer;\nclass InitializeTheParrot11{\npublic static void main(String\
    \ args[]) {\n  Parrot11 parrot = new Parrot11(\"coco\", 3);\n  Timer timer = new\
    \ Timer();\n  timer.schedule(parrot, 3000, 2000);\n  String response=\"yes\";\n\
    \  do {\n   System.out.println(\"blabla\");\n   System.out.println(\"blabla\"\
    );\n   System.out.println(\"would you like the parrot to continue? (y/n)\");\n\
    \   response =new Scanner(System.in).nextLine();\n  } while (response.equals(\"\
    y\"));\n  timer.cancel();\n }\n}\n\nimport java.util.TimerTask;\nclass Parrot11\
    \ extends TimerTask {\n private String cri = null;\n private int fois = 0;\n public\
    \ Parrot11(String s, int i) {\n  cri = s;\n  fois = i;\n }\n public void repeter()\
    \ {\n  System.out.println(cri);\n }\n public void run() {\n  for (int i = 0; i\
    \ < fois; i++) {\n    repeter();\n  }\n }\n}\n```\n\n`schedule(task, long delay,\
    \ long period)` 在延迟后安排任务进行周期性执行：时间以毫秒为单位。\n\n### 执行：\n\nblabla\nblabla\nwould\
    \ you like the parrot to continue? (y/n)\ny\ncoco\ncoco\ncoco\ncoco\ncoco\nncoco\
    \ coco\n\n任务在 3 秒后启动，每隔 2 秒周期执行一次。\n\n"
- fmt: "\nIn the following example, there are two writers (`EcrivainA` and `EcrivainB`):\
    \ one will write `ABC` 10 times and the other will write `XYZ` 10 times. Each\
    \ word (`ABC` or `XYZ`) will be written letter by letter with a return after the\
    \ last letter of each word.\n\nThe following code represents this scenario:[¹](#chapter02.xhtml_fn1)\n\
    \n![images](images/f0027-01.jpg)\n\nExecution:\n\nAXBYC\nABZ\nXC\nAYZ\nXBC\nAYBC\n\
    AZ\nXBC\nAYBC\nAZ\nXBC\nABYZ\nXC\nAYBC\nAZ\nXBC\nEcrivain de ABC a fini\nYZ\n\
    XYZ\nXYZ\nXYZ\nEcrivain de XYZ a fini\n\nThere is concurrence between both writers\
    \ and that is the reason why we obtained the above execution. Using the `join()`\
    \ method of the `Thread` class, we can synchronize the two threads. `EcrivainB`\
    \ will be launched after the termination of `EcrivainA` (class `Prog55.java` following).\n\
    \nThe code presented after `join()` will be executed after the end of the execution\
    \ of the code located before `join()`.\n\nThis type of synchronization called\
    \ upon termination.\n\n```java\npublic class Prog55 {\n  public static void main\
    \ (String argv[]) {\n  Ecrivain EcrivainA, EcrivainB;\n  EcrivainA = new Ecrivain\
    \ (\"ABC\");\n  EcrivainB = new Ecrivain (\"XYZ\");\n  EcrivainA.start();\n  try\
    \ {\n    EcrivainA.join();\n  }\n  catch(InterruptedException e) {\n    System.out.println(e.getMessage());\n\
    \    System.exit(1);\n  }\n  EcrivainB.start();\n  }\n}\n```\n\nExecution:\n\n\
    ABC\nABC\nABC\nABC\nABC\nABC\nABC\nABC\nABC\nABC\nEcrivain de ABC a fini\nXYZ\n\
    XYZ\nXYZ\nXYZ\nXYZ\nXYZ\nXYZ\nXYZ\nXYZ\nXYZ\nEcrivain de XYZ a fini\n\n## 2.2.\
    \ Resource in mutual exclusion: synchronized modifier\n\nTake the following code:\
