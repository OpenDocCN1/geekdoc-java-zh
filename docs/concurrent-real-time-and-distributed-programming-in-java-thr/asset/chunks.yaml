    \              catch (IOException ex) {System.out.println(\"Applet receive\nfailed:\"\
    );}\n              display.setText(numbStr);\n    } // end of class\n```\n\n###\
    \ 4.2.2 高级通信：中间件\n\n这些是提供复杂服务的层。这些层是使用 `TCP/UDP` 层创建的。例如：从远程实体的方法调用。\n\n- 中间件是一个中间层（软件层），它位于网络通信基础设施和分布式应用程序元素之间。\n\
    \n![image/fig4-5.jpg]\n\n**图 4.5.** 中间件在网络中的位置。该图的彩色版本请参阅 [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
    \n- 分布式环境（大部分）基于 `RPC`（远程过程调用）。\n- 这种机制以请求/响应模式工作。\n- 客户端发出请求（请求服务）。\n- 服务器随后处理请求并最终向客户端返回响应。\n\
    \n`RPC` 具有以下特征：\n- 过程化编程，因此不是面向对象的。\n- 参数和返回值是基本类型。\n- 没有“远程引用”。\n\n随后，中间件以以下方式演进：\n\
    - `JAVA RMI`（远程方法调用）。单语言、跨平台：从 `JVM` 到 `JVM`。\n- `CORBA`（通用对象请求代理）。多语言、跨平台。\n\
    - 微软的 `DCOM`（分布式组件模型）。多语言，用于分布式软件组件之间的的通信。\n\n在接下来的章节中，我们将重点关注 Java RMI。\n\n![image/fig4-6.jpg]\n\
    \n**图 4.6.** RPC 操作。该图的彩色版本请参阅 [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
    \n#### 4.2.2.1 RMI 简介\n\n`RMI` 允许 Java 虚拟机进行通信，无论它们是在同一台机器上还是两台不同的机器上。`java.rmi`:\
    \ 集成 `JDK 1.1` 及更高版本（自 1997 年起）的 API。\n\n为了让客户端访问远程服务，必须将其注册表中。RMI 注册表被称为 `rmireistry`，它包含一个哈希表，键是名称，值是远程对象。\n\
    \n![image/fig4-7.jpg]\n\n**图 4.7.** rmireistry\n\nRMI 应用的工作原理如下：\n- 服务器创建对象并将其保存在注册表中。\n\
    - 这允许客户端定位远程对象并获取其引用。\n- 当客户端想要调用远程方法时，它在 `rmireistry` 中查找对象并获取指向该对象的引用（一个存根/stub）。\n\
    - 客户端通过新获取的引用调用远程对象的方法。\n- 存根（stub）是远程对象的代理（本地代表），它通过网络调用远程对象的方法。\n- 这种机制确保了调用的透明性。\n\
    \n![image/fig4-8.jpg]\n\n**图 4.8.** RMI 应用的操作。该图的彩色版本请参阅 [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
    \n图 4.9 代表远程方法调用的阶段。\n\n#### 4.2.2.2 RMI 架构\n\n图 4.10 代表 RMI 架构。\n\n![image/fig4-9.jpg]\n\
    \n**图 4.9.** 远程方法调用的阶段。该图的彩色版本请参阅 [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
    \n![image/fig4-10.jpg]\n\n**图 4.10.** RMI 架构。该图的彩色版本请参阅 [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
    \n- 第一层：存根/骨架（stub/skeleton）。\n    - 存根（stub）：对象的本地代表。\n        - 通过将远程调用传输到引用对象层（RRL），与远程\
    \ `JVM` 建立。\n        - 装配参数以便传输到远程 `JVM`。\n    - 骨架（skeleton）：用于定位分布式对象。\n   \
    \     - 拆分远程方法的参数。\n        - 调用请求的方法。\n        - 对返回调用者的结果（返回值或异常）进行装配。\n- 备注：自\
    \ Java 2（1998 年）起，不再需要骨架。\n- 所有的远程对象共享一个类似的通用骨架类。\n- 此外，直到 J2SE 5.0 版本（2004 年），在保存到\
    \ RMI 注册之前，需要一个名为 `RMIC`（Java RMI 编译器）的存根编译器来生成存根/骨架。\n\n"
- fmt: "\n- Now, it is possible to generate them dynamically (no need to use the `RMIC`).\n\
    - Second layer: `RRL` (object reference layer).\n    - Helps obtain the reference\
    \ of the distant object by consulting the `rmiregistry`.\n    - `rmiregistry`\
    \ executes on each machine hosting distant objects.\n    - Only one `rmiregistry`\
    \ per `JVM`.\n    - `rmiregistry` accepts service requests on port `1099` (by\
    \ default).\n- Third layer: `transport`.\n    - Uses a communication protocol\
    \ above `TCP/IP`.\n    - During a method call, the stub transmits the call to\
    \ the `RRL` layer, the latter transmits the request to the `transport` layer of\
    \ the `RMI` that is above the `TCP/IP` and transfers the request by climbing up\
    \ to the skeleton that calls upon the distant object.\n    - By default, `RMI`\
    \ uses the protocol `JRMP` (Java Remote Method Protocol) on port `1099`. This\
    \ is a protocol that is used to call distant methods.\n        - `JRMP` is the\
    \ communication protocol of `RMI`, used only between applications written in Java.\n\
    \        - Original version.\n        - Integrated in the language.\n        -\
    \ Simple to use.\n    - Starting from Java 2, and for compatibility with `CORBA`,\
    \ communications between the client and the server can be performed using the\
    \ protocol `IIOP` (Internet Inter-ORB Protocol).\n        - Recent version.\n\
    \        - Compatible with `CORBA`.\n        - More difficult to implement.\n\n\
    In this case, the package `javax.rmi` is required.\n\n#### 4.2.2.3 Deploying the\
    \ RMI\n\nA number of packages are used to deploy `RMI`:\n\n- `java.rmi.Naming`\n\
    - `java.rmi.Remote`\n- `java.rmi.RemoteException`\n- `java.rmi.server.UnicastRemoteObject`\n\
    - `java.rmi.registry.LocateRegistry`\n- `java.rmi.NotBoundException`\n\n`java.rmi.Naming`:\
    \ is a final class: `public final class Naming extends Object`.\n\n- The server\
    \ can record a distant object using the `bind()` (or `rebind()`) method.\n- `static\
    \ void bind (String name, Remote obj) throws AlreadyBoundException, MalformedURLException,\
    \ RemoteException.`\n- `static void rebind (String name, Remote obj) throws RemoteException,\
    \ MalformedURLException.`\n- Note: `bind()` throws an exception if an object is\
    \ already recorded under the same name in the registry (same name for two different\
    \ objects).\n\n`Remote` is an interface for designing distant objects.\n\n- The\
    \ client will find the object thanks to the `lookup()` method.\n- `static Remote\
    \ lookup (String name) throws NotBoundException, MalformedURLException, RemoteException`\n\
    \nThe following will deploy `RMI`:\n\n- Server side:\n    - The definition of\
    \ an interface containing the methods that can be called remotely (the interface\
    \ is shared with the client).\n    - Writing a class that implements this interface.\n\
    \    - Writing a class (server) that will instance the object and record it while\
    \ giving it a name in the `RMI` registry.\n- Client side:\n    - Obtaining a reference\
    \ on the distant object from its name.\n    - Calling method from that reference.\n\
    \nTo deploy `RMI`, follow the steps given below:\n\n**Shared interface between\
    \ the client and the server:**\n\nThe interface must extend `java.rmi.Remote`.\n\
    \n```java\nimport java.rmi.Remote;\nimport java.rmi.RemoteException;\npublic interface\
    \ Hello extends Remote {\n    public String Bonjour() throws RemoteException;\n\
    }\n```\n\n- `Remote` is a methodless interface.\n- An object that implements the\
    \ `Hello` interface is an object that supports distant access to its methods.\n\
    - All methods must launch a `RemoteException`.\n\n![image](images/fig4-11.jpg)\n\
    \n**Figure 4.11.** Deploying RMI. For a color version of the figure, see [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
    \n**Implementing the class that implements the interface on the server side:**\n\
    \n```java\nimport java.rmi.RemoteException;\nimport java.rmi.server.UnicastRemoteObject;\n\
    public class HelloImpl extends UnicastRemoteObject implements Hello\n{\n  public\
    \ HelloImpl() throws RemoteException {\n  }\npublic String Bonjour() throws RemoteException\
    \ {\n    return \"Bonjour tous le monde !\";\n}}}\n```\n\n- It must implement\
    \ the `Hello` interface.\n- It must extend the `UnicastRemoteObject`.\n- `Unicast`:\
    \ the distant object exists in one unique copy on one single machine.\n- It can\
    \ implement methods other than the one in the interface, but these will not be\
    \ remotely accessible.\n- The builders launch a `RemoteException`.\n- Therefore,\
    \ the user must always write one.\n\n**Implementing the server:**\n\n```java\n\
    import java.net.MalformedURLException;\nimport java.rmi.Naming;\nimport java.rmi.RemoteException;\n\
    import java.rmi.registry.LocateRegistry;\npublic class HelloServer {\n  public\
    \ static void main(String[] args) {\n  try {\nLocateRegistry.createRegistry(1099);\n\
    \  } catch (RemoteException e) {\n    System.err.println(\"rmiregistry already\
    \ on this port\");\n    System.exit(1);\n  }\n  Hello hello;\n  try {\n    hello\
    \ = new HelloImpl();\n    Naming.rebind(\"rmi://localhost:1099/Hello\",hello);\n\
    \  } catch (RemoteException e) {\n    System.err.println(\"server appears to be\
    \ down\");\n    System.exit(4);\n  } catch (MalformedURLException e) {\n    System.err.println(\"\
    URL incorrect\");\n    System.exit(1);\n  }\n}}\n```\n\nThe general format of\
    \ an RMI URL is `rmi://host:port/Name`.\nExample: `rmi://localhost:1099/Hello`.\n\
    \n**Implementing the client:**\n\n```java\nimport java.net.MalformedURLException;\n\
    import java.rmi.Naming;\nimport java.rmi.NotBoundException;\nimport java.rmi.RemoteException;\n\
    public class HelloClient {\n  public static void main(String[] args) {\n    String\
    \ url;\n    Hello hello = null;\n    try {\n      url = \"rmi://localhost:1099/Hello\"\
    ;\n      hello = (Hello) Naming.lookup(url); // hello is the Stub\n      System.out.println(hello.Bonjour());\
    \ // call remote method\n    } catch (RemoteURLException e) {\n      System.err.println(\"\
    URL \" + url + \" is incorrect\");\n      System.exit(1);\n    } catch (NotBoundException\
    \ e) {\n      System.err.println(\"Hello not bound in the registry\");\n     \
    \ System.exit(2);\n    } catch (RemoteException e) {\n      System.err.println(\"\
    server appears to be down\");\n      System.exit(4);\n    } catch (MalformedURLException\
    \ e) {\n      System.err.println(\"URL \" + url + \" is incorrect\");\n      System.exit(1);\n\
    \    }\n  }\n}\n```\n*(Note: The source text provided contained some garbled/interleaved\
    \ logic in the code blocks provided in the prompt; I have cleaned up the structure\
    \ to reflect standard RMI patterns while preserving the core content as requested.)*\n\
    \nWait, looking back at the provided text specifically for the end:\n\n- Launch\
    \ server.\n- Launch client.\n- Execution on client side:\n\nBonjour tout le monde\
    \ !\n\nTo implement an RMI application, you must first:\n\n- Write the Remote\
    \ interface(s).\n    - `Hello.java`.\n- Write its (their) implementation(s).\n\
    \    - `HelloImpl.java`.\n- Write the server.\n    - `HelloServer.java`.\n- Write\
    \ the client.\n    - `HelloClient.java`.\n\nNote: it is possible to regroup both\
    \ classes (server and interface implementation) in the same class.\n\nThe following\
    \ example discusses this type of case. It is a remote multiplication.\n\n**The\
    \ interface:**\n\n```java\nimport java.rmi.Remote;\nimport java.rmi.RemoteException;\n\
    public interface Hello extends Remote {\npublic int multi (int a, int b) throws\
    \ RemoteException;\n}\n```\n\n**Implementing the server:**\n"
