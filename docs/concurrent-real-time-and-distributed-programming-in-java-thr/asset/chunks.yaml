  trans: "\n\n```java\nimport java.io.*;\nimport java.net.*;\nimport java.util.Scanner;\n\
    public class ClientEcho {\n  public static void main(String[] args) throws IOException\
    \ {\n  Socket sock = null;\n  PrintWriter sockOut = null;\n  BufferedReader sockIn\
    \ = null;\n  try{sock = new Socket(\"localhost\", 7777); // the communication\
    \ socket.\n    sockOut = new PrintWriter(sock.getOutputStream(), true); //force\
    \ write\n    sockIn = new BufferedReader(new InputStreamReader(sock.getInputStream()));\n\
    \  } catch (UnknownHostException e) {\n    System.err.println(\"host unreachable:\
    \ localhost\");\n    System.exit(1);\n  } catch (IOException e) {\n    System.err.println(\"\
    cannot connect to: localhost\");\n    System.exit(1);\n  }\n  System.out.println(\"\
    press any key to close\");\n  Scanner scan = new Scanner(System.in);\n  String\
    \ message = scan.next().toLowerCase();\n  while (! message.equals(\"no\")) {\n\
    \    sockOut.println(message);\n    String recu = sockIn.readLine();\n    System.out.println(\"\
    server -> client:\" + recu);\n    message = scan.next().toLowerCase();\n  }\n\
    \  sockOut.close();\n  sockIn.close();\n  sock.close();\n  }\n}\n```\n\n执行过程如下：\n\
    \n- – 在服务器端：\n  `connected`\n  `received: hello`\n  `received: bye`\n- – 客户端：\n\
    \  `press any key to close`\n  `hello`\n  `server -> client: next ?`\n  `bye`\n\
    \  `server -> client: next ?`\n  `no`\n\n注意，对于字符，Java 语言使用了基于 16 位 Unicode 编码的\
    \ `char` 类型。网络传输是基于 8 位字节（byte）的。\n\n因此，Java 的通信方法基于字节传输的。\n\n- – 将 `String` 转换为\
    \ `bytes[ ]`：\n  - `- String chaine = \"ABCD\";`\n  - `- byte[ ] message=chaine.getBytes();`\n\
    - – 将 `byte[ ]` 转换为 `String`：\n  - `- chaine = new String(message);`\n\n#### 4.2.1.4.\
    \ 直接向 socket 流写入数据\n\n以下代码允许直接向 socket 流写入数据：\n\n```java\nOutputStream sockOut\
    \ = socket.getOutputStream();\n// 获取 socket 的写入输出流。\n// 我们直接使用它写入新字节。\nbyte[ ]\
    \ buffer = new byte[1024];\nbuffer = \"ABCD\".getBytes();\ntry {\n sockOut.write(buffer);\n\
    // write(buffer) 写入缓冲区中的所有字节。\nsockOut.flush();\n // flush() 应该强制将缓冲区内容写入流中（float）。\n\
    // 不会等待缓冲区填充。\n sockOut.write(buffer, 0, 2);\n// write(buffer, pos, nbre) 从指定的位置\
    \ (pos) \n// 写入数量（nbre）的字节。\n} catch (IOException e) {}\n```\n\n`write` 和 `flush`\
    \ 可能会引发特定的 `IOException`，即尝试向已关闭的流写入数据。\n\n在接下来的段落中，我们将通过通过单个字符链传输各种数据。\n\n```java\n\
    try {\n  OutputStream sockOut = socket.getOutputStream();\n  byte[ ] buffer =\
    \ new byte[1024];\n  String envoi = \"chain String\"+\" \"+(-1234)+\" \"+12.34+\"\
    \ \"+true;\n  buffer = envoi.getBytes();\n  sockOut.write(buffer, 0, envoi.length());\n\
    \  sockOut.flush();\n} catch (IOException e) {}\n```\n\n#### 4.2.1.5. 直接读取 socket\
    \ 流\n\n以下代码允许直接读取 socket 流：\n\n```java\nInputStream sockIn = socket.getInputStream();\n\
    // 获取 socket 的读取输入流。\nbyte[ ] buffer = new byte[1024];\nint read;\ntry {\n  read\
    \ = sockIn.read(buffer);\n// 读取流并将其存入缓冲区。返回读取的字节数。\nSystem.out.write(buffer, 0,\
    \ lu);\n// 在标准输出上显示缓冲区。\n} catch (IOException e) {}\n```\n\n流的结束可能是正常的（关闭写入），也可能是意外的（写入过程结束端断开）。\n\
    \n读取操作可能会引发 `IOException`。\n\n#### 4.2.1.6. 高级读写\n\n`DataOutputStream` 使得在所有系统上写入任何\
    \ Java 原始类型成为可能。\n\n以下代码以已知格式向 socket 写入数据：\n\n```java\nDataOutputStream sockDataOut\
    \ = null;\ntry {\nsockDataOut = new DataOutputStream(socket.getOutputStream());\n\
    sockDataOut.writeByte(6); //写入数字的第一个字节。\nsockDataOut.writeChar('c'); // 写入前两个字节对应的字符。\n\
    \ sockDataOut.writeBoolean(true); // 在一个字节上写入布尔值。\nsockDataOut.writeInt(-1234);\
    \ // 在四个字节上写入数字。\n sockDataOut.writeDouble(12.34); // 在八字节上写入双精度浮数。\n sockDataOut.flush();\
    \ // 如果存在缓冲区，应该强制将缓冲区内容写入流。\n sockDataOut.writeUTF(\"chaine String\"); // 写入字符串。\n\
    } catch (IOException e) {}\n```\n\n在所有系统上读取任何 Java 原始类型需要使用 `DataInputStream`。\n\
    \n从 socket 中以已知格式读取数据：\n\n```java\nDataInputStream sockDataIn = null;\ntry {\n\
    sockDataIn = new DataInputStream(socket.getInputStream());\nbyte b = sockDataIn.readByte();\
    \ // 读取数字的第一个字节。\nchar c = sockDataIn.readChar(); // 读取前两个字节对应的字符。\nboolean bool\
    \ = sockDataIn.readBoolean(); // 从一个字节上读取布尔值。\nint i = sockDataIn.readInt(); //\
    \ 在四个字节上读取数字。\ndouble d = sockDataIn.readDouble(); // 在八字节上读取双精度浮数。\nString s\
    \ = sockDataIn.readUTF(); // 读取字符串。\n} catch (IOException e) {}\n```\n\n流的关闭可能是正常的（关闭写入），也可能是意外的。\n\
    \n向 socket 写入文本：\n\n```java\nPrintWriter sockOut = new PrintWriter(socket.getOutputStream()));\n\
    sockOut.print(\"chaine String\");\nsockOut.print(1234);\nsockOut.print(12.34);\n\
    sockOut.println(true);\n```\n\n- – 创建连接到 `OutputStream` 的 `PrintWriter`。\n- –\
    \ 我们可以使用 `print` 或 `println` 写入文本。\n- – 没有任何方法会引发 `Exceptions`。\n\n以下代码允许用户逐行读取\
    \ socket：\n\n```java\ntry{\nBufferedReader sockReader = new BufferedReader(new\
    \ InputStreamReader\n(socket.getInputStream())))\nString line;\nwhile ((line =\
    \ sockReader.readLine()) != null)\nSystem.out.println(line);\n```\n\n- – 创建连接到\
    \ `InputStream` 的 `BufferedReader`。\n- – 我们可以使用 `readLine()` 读取字符链。\n- – `readLine()`\
    \ 返回行，如果到达末尾则返回 `null`。\n\n#### 4.2.1.7. 通过 socket 传输对象\n\n在接下来的段落中，我们将讨论通过 socket\
    \ 传输对象。\n\n示例：客户端连接到服务器查询学生的专业和成绩。\n\n- 服务器端存储了一个学生表。\n- 客户端连接到服务器并想要获取学生的。\n\
    - 客户端必须将学生姓名发送给服务器。\n- 服务器读取姓名，确认接收，遍历查找学生并最后保存对象。\n- 该对象通过 socket 发送给客户端。\n-\
    \ 客户端读取对象（恢复）。\n- 客户端显示对象的特征。\n- 通过网络传输的对象必须是序列化的。\n\n```java\nimport java.io.Serializable;\n\
    public class Student implements Serializable{\nString name;\nString major;\nint\
    \ moy;\nStudent (String name, String major, int moy) {\n���this.name = name;\n\
    ```�this.major = major;\n```�this.moy = moy;\n}\nString getNom() {\n���return\
    \ name;\n}\npublic String toString() {\n���return \"Student: \"+name+\" \"+major+\"\
    \ : \"+moy;\n�}\n}\n```\n\n`Student` 类在客户端和服务器之间共享¹。\n\n![images](img/f0085-01.jpg)![images](img/f0086-01.jpg)\n\
    \n执行：\n\n服务器端：\n\nconnected\n\nreceived: A\n\n客户端：\n\nserver -> client: Student:\
    \ A GL: 13\n\n#### 4.2.1.8. Java applet 与服务器通过 socket 的通信\n\n以下执行显示了 applet 与服务器通过\
    \ socket 的通信：\n\n![image](img/fig4-4.jpg)\n\n"
