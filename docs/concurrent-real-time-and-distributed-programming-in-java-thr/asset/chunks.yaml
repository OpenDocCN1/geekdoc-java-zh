    \n*   – Launch client.\n\n*   – Execution on client side:\n\nBonjour tout le monde\
    \ !\n\nTo implement an RMI application, you must first:\n\n*   – Write the Remote\
    \ interface(s).\n\n    *   - Hello.java.\n\n*   – Write its (their) implementation(s).\n\
    \n    *   - HelloImpl.java.\n\n*   – Write the server.\n\n    *   - HelloServer.java.\n\
    \n*   **–** Write the client.\n\n    *   - HelloClient.java.\n\nNote: it is possible\
    \ to regroup both classes (server and interface implementation) in the same class.\n\
