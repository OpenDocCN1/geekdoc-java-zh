    Producer and C of type Consumer. The name of the thread P must be Prod and the
    name of the thread C must be Consu. The size of the shared buffer is 4.


    ##### Exercise 15: thread synchronization


    You are responsible for a large computer project tasked with piloting automatic
    cars. Unfortunately, they do not drive in the same direction and the road that
    these cars use has a one-way section. At any moment, more than one car (N in the
    general case) can circulate on the one-way road on condition that they are going
    the same way, if at least one car is present on the one-way segment, the cars
    on the other side will have to wait for the road to be available.


    Here is the possible operation before your intervention:


    ![images](images/f0148-01.jpg)


    Use thread synchronization to sort this problem.


    ##### Exercise 16: factorial and Fibonacci with the TCP sockets


    Consider the following function:


    ```

    Function factorial (n: int): integer

    Beginning

      If n > 1

       Return n * factorial(n - 1)

      Else

       Return 1

      End if

    End

    ```


    *   – Implement this function on the server side and create a client/server model
    using TCP sockets under Java; the client will have an integer n (>=0) to the client,
    and the latter must respond with a factorial (n).


    *   – The Fibonacci sequence is a series of integers in which each entry is the
    sum of the two integers that preceded it. It generally begins with the numbers
    0 and 1 (sometimes 1 and 1) and its first numbers are: 0, 1, 1, 2, 3, 5, 8, 13,
    21, etc. Your client must now send an integer n to the server, and the latter
    must respond with the nth number of the Fibonacci sequence. For example, if the
    client sends 8 to the server, it recovers 13 (the eighth number).


    ##### Exercise 17: mystery with the TCP sockets


    *   – What is the mystery method of the following Java class?


    ```

    //// A.java

    import java.io.*;

    public class A{

      public static void mystery (InputStream in, OutputStream out) throws

    IOException {

        byte buf[ ] = new byte[1024]; int n;

           while((n=in.read(buf))!=-1) out.write(buf,0,n);

         in.close();

         out.close();

     }

    }

    ```


    *   – Consider the following two java classes:


    ```

    /////////// Client.java

    import java.io.*;

    import java.net.*;

    public class Client{

      public static void main(String []args) throws IOException {

        Socket sock = new Socket(InetAddress.getLocalHost(),9001);

        A.mystery(new

             FileInputStream("./src/test1"),sock.getOutputStream());

        sock.close();

      }

    }


    //// Server.java

    import java.io.*;

    import java.net.*;

    public class Serveur{

      public static void main(String []args) throws IOException {

        Socket sock = new ServerSocket(9001).accept();

        A.mystery(sock.getInputStream(),new

             FileOutputStream("./src/test2"));

        sock.close();

      }

    }

    ```


    *   – What does this application do by executing the two classes (Client and Server)
    in localhost?


    *   – By using two different machines (a machine on the client side and another
    on the server side), what will be the objective of this application?


    ##### Exercise 18: managing a counter with the TCP sockets


    We have a list of bank counters. A counter is characterized by its *account* *holder*,
    its *number* and its *balance***.**


    The client connects to the server and sends an integer **M**, the server must
    respond with the list of counter account holders who have a higher balance than
    **M.**


    *   – Write the two classes ClientCounter and ServeurCounter according to the
    TCP sockets model in java.'
