    \ Naming.lookup(url); // hello is the Stub\n} catch (MalformedURLException e)\
    \ {\n       System.err.println(\"The URL \" + url + \"is incorrect\");\nSystem.exit(1);\n\
        } catch (RemoteException e) {\n       System.err.println(\"Have you launched\
