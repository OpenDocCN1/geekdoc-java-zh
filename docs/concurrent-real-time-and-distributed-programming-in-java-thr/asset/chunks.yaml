  trans: "\n\n- 现在，可以动态生成它们（不再需要使用 `RMIC`）。\n- 第二层：`RRL`（对象引用层）。\n    - 通过查询 `rmiregistry`\
    \ 获取远端对象的引用。\n    - `rmiregistry` 运行在每个托管远端对象的机器上。\n    - 每个 `JVM` 只有一个 `rmiregistry`。\n\
    \    - `rmiregistry` 默认在端口 `1099` 上接受服务请求。\n- 第三层：`transport`。\n    - 使用 `TCP/IP`\
    \ 之上的通信协议。\n    - 在方法调用期间，存根（stub）将调用传输到 `RRL` 层，后者将请求传输到 `TCP/IP` 之上 `RMI` 的\
    \ `transport` 层，并通过向上到达调用远端对象的骨架（skeleton）来传输请求。\n    - 默认，`RMI` 在端口 `1099` 上使用\
    \ `JRMP`（Java 远程方法协议）协议。这是一个用于调用远程方法的协议。\n        - `JRMP` 是 `RMI` 的通信协议，仅用于用\
    \ Java 编写的应用之间。\n        - 原始版本。\n        - 集成在语言中。\n        - 使用简单。\n    - 从\
    \ Java 2 开始，为了兼容 `CORBA`，客户端和服务器之间的通信可以使用 `IIOP`（互联网对象 ORB 协议）协议进行。\n        -\
    \ 较版本。\n        - 兼容 `CORBA`。\n        - 实现难度更大。\n\n在这种情况下，需要 `javax.rmi` 宏包。\n\
    \n#### 4.2.2.3 部署 RMI\n\n部署 `RMI` 需要使用多个包：\n\n- `java.rmi.Naming`\n- `java.rmi.Remote`\n\
    - `java.rmi.RemoteException`\n- `java.rmi.server.UnicastRemoteObject`\n- `java.rmi.registry.LocateRegistry`\n\
    - `java.rmi.NotBoundException`\n\n`java.rmi.Naming`：是一个最终类：`public final class\
    \ Naming extends Object`。\n\n- 服务器可以使用 `bind()`（或 `rebind()`）方法记录远端对象。\n- `static\
    \ void bind (String name, Remote obj) throws AlreadyBoundException, MalformedURLException,\
    \ RemoteException.`\n- `static void rebind (String name, Remote obj) throws RemoteException,\
    \ MalformedURLException.`\n- 注意：如果对象在注册表中已以相同的名称记录（两个不同对象使用相同名称），则 `bind()` 会抛出异常。\n\
    \n`Remote` 是一个用于设计远端对象的接口。\n\n- 客户端将通过 `lookup()` 方法找到该对象。\n- `static Remote lookup\
    \ (String name) throws NotBoundException, MalformedURLException, RemoteException`\n\
    \n以下步骤将部署 `RMI`：\n\n- 服务端：\n    - 定义一个包含可以远程调用的方法的接口（该接口与客户端共享）。\n    - 编写实现该接口的类。\n\
    \    - 编写一个类（服务器），该类将实例化对象，并在向 `RMI` 注册表中为其命名的同时对其进行记录。\n- 客户端：\n    - 根据名称获取其远端对象的引用。\n\
    \    - 通过该引用调用方法。\n\n要部署 `RMI`，请按照下面提供的步骤操作：\n\n**客户端和服务器之间的共享接口：**\n\n该接口必须扩展\
    \ `java.rmi.Remote`。\n\n```java\nimport java.rmi.Remote;\nimport java.rmi.RemoteException;\n\
    public interface Hello extends Remote {\n    public String Bonjour() throws RemoteException;\n\
    }\n```\n\n- `Remote` 是一个没有方法的接口。\n- 实现了 `Hello` 接口的对象是一个支持对其方法进行远程访问的对象。\n- 所有方法必须抛出\
    \ `RemoteException`。\n\n![image](img/fig4-11.jpg)\n\n**图 4.11.** 部署 RMI。需该图的彩色版本，请访问\
    \ [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
    \n**在服务端实现该接口的类：**\n\n```java\nimport java.rmi.RemoteException;\nimport java.rmi.server.UnicastRemoteObject;\n\
    public class HelloImpl extends UnicastRemoteObject implements Hello\n{\n  public\
    \ HelloImpl() throws RemoteException {\n  }\npublic String Bonjour() throws RemoteException\
    \ {\n    return \"Bonjour tous le monde !\";\n}}}\n```\n\n- 它必须实现 `Hello` 接口。\n\
    - 它必须扩展 `UnicastRemoteObject`。\n- `Unicast`：远端对象在单台机器上存在唯一的副本。\n- 它可以实现接口中之外的方法，但这些方法将无法被远程访问。\n\
    - 构造函数抛出 `RemoteException`。\n- 因此，用户必须编写一个。\n\n**实现服务器：**\n\n```java\nimport java.net.MalformedURLException;\n\
    import java.rmi.Naming;\nimport java.rmi.RemoteException;\nimport java.rmi.registry.LocateRegistry;\n\
    public class HelloServer {\n  public static void main(String[] args) {\n  try\
    \ {\nLocateRegistry.createRegistry(1099);\n  } catch (RemoteException e) {\n \
    \   System.err.println(\"rmiregistry already on this port\");\n    System.exit(1);\n\
    \  }\n  Hello hello;\n  try {\n    hello = new HelloImpl();\n    Naming.rebind(\"\
    rmi://localhost:1099/Hello\",hello);\n  } catch (RemoteException e) {\n    System.err.println(\"\
    server appears to down\");\n    System.exit(4);\n  } catch (MalformedURLException\
    \ e) {\n    System.err.println(\"URL incorrect\");\n    System.exit(1);\n  }\n\
    }\n```\n"
- fmt: "\n```java\nimport java.rmi.*;\nimport java.rmi.server.*;\nimport java.rmi.registry.*;\n\
    public class HelloServer extends UnicastRemoteObject implements\nHello {\npublic\
    \ HelloServer() throws RemoteException {}\npublic int multi(int a, int b) throws\
    \ RemoteException {\nreturn a * b; }\npublic static void main(String[] args) {\n\
    \   try {\n   LocateRegistry.createRegistry(1099);\n  } catch (RemoteException\
    \ e1) {\n    System.err.println(\"rmiregistry is already launched on this port\"\
    );\n    System.exit(1);\n  }\n   try {\nHelloServer objet = new HelloServer();\n\
    Naming.rebind(\"badr\",object);\nSystem.out.println(\"Server ready\");\n}\ncatch(Exception\
    \ e) {\nSystem.err.println(\"Error: \" + e.getMessage());\n}\n}\n}\n```\n\n###\
    \ A few notes surrounding bind and rebind:\n\nThe following code is correct:\n\
    \n```java\nHelloServer object = new HelloServer();\nNaming.rebind(\"badr\",object);\n\
    Naming.rebind(\"badr1\",object);\n```\n\nThere is the possibility to attribute\
    \ more than one name to the same object: `bind` or `rebind` regardless.\n\nThe\
    \ following code generates an exception:\n\n```java\nHelloServer object = new\
    \ HelloServer();\nHelloServer object1 = new HelloServer();\nNaming.bind(\"badr\"\
    ,object);\nNaming.bind(\"badr\",object1);\n```\n\nThe following code is correct:\n\
    \n```java\nHelloServer object = new HelloServer();\nHelloServer object1 = new\
    \ HelloServer();\nNaming.rebind(\"badr\",object);\nNaming.rebind(\"badr\",object1);\n\
    ```\n\nIt works with a `rebind` because it is a resave; `badr` only refers to\
    \ `object1`.\n\n### Implementing the client:\n\n```java\nimport java.rmi.*;\n\
    public class HelloClient {\npublic static void main(String[] args) {\ntry {\n\
    \  Hello reference = (Hello)Naming.lookup(\"badr\");\n  int resultat = reference.multi(5,12);\n\
    \  System.out.println(\"The multiplication is: \" + result); }\ncatch(Exception\
    \ e) { System.err.println(\"Error: \" + e.getMessage()); }\n}\n}\n```\n\n####\
    \ Execution:\n- Server side: Server ready.\n- Client side: The multiplication\
    \ is 60.\n\nThe following class is useful for generating the registry:\n\n- `public\
    \ final class LocateRegistry extends Object`.\n- Class used to generate the `rmiregistry`\
    \ in the package `java.rmi.registry`.\n- `createRegistry` method:\n    - `static\
    \ Registry createRegistry (int port)`: create registry.\n    - `LocateRegistry.createRegistry(1099)`:\
    \ create registry on port 1099.\n    - `createRegistry` is a static method that\
    \ returns a `Registry`.\n    - `public interface Registry extends Remote`.\n \
    \   - In the package `java.rmi.registry`.\n    - `LocateRegistry.createRegistry(1099)`:\
    \ create a distant registry (`rmiregistry`).\n- `getRegistry` method:\n    - Returns\
    \ a reference towards the distant registry.\n    - Various signatures:\n     \
    \   - `static Registry getRegistry()`.\n        - `static Registry getRegistry(int\
    \ port)`.\n        - `static Registry getRegistry(String host)`.\n        - `static\
    \ Registry getRegistry(String host, int port)`.\n        - `static Registry getRegistry(String\
    \ host, int port, RMIClientSocketFactory csf)`.\n\nExample of application:\n\n\
    ```java\nString [ ] NamesSaved = LocateRegistry.getRegistry(\"localhost\",\n1099).list();\n\
    ```\n`list()`: method of the `Registry` interface which returns the list of names\
    \ recorded in the registry.\n\n### 4.2.2.4 Parameter exchanges in RMI\n\nThe parameters\
    \ exchanged through the Java RMI must be:\n\n- Primitive types: `int`, `short`,\
    \ `double`, `boolean` …, also `String`.\n- `Serializable objects`.\n- `Remote`\
    \ objects.\n\nThe primitive types are transmitted by value (copy).\nThe `Serializable`\
    \ objects are serialized, transmitted, then deserialized (transmitted by value).\n\
    The `Remote` objects are transmitted under the form of distant references.\n\n\
    #### Primitive types:\n\nThe following code represents the implementation of the\
    \ method `multi` on the server side:\n\n```java\npublic int multi (int a, int\
    \ b) throws RemoteException {\n    return a * b;\n}\n```\n\nThe method call on\
    \ the client side is as follows:\n\n```java\ntry {\n  Hello reference = (Hello)Naming.lookup(\"\
    badr\");\n  int result = reference.multi(5,12);\n  System.out.println(\"The multiplication\
    \ is: \" + result);\n}catch(Exception e) { System.err.println(\"Error: \" + e.getMessage());\
    \ }\n```\n\nIn the previous example, the call is performed by value.\n\n#### Transmitting\
    \ a Serializable object:\n\nExample: we wish to use a data server to store a set\
    \ of 2D coordinates describing the positions of a certain number of vehicles on\
    \ a plane.\n\nThis server will have to include the following functionalities:\n\
    \n- Creating a new position and attributing it a name.\n- Read-access to the positions.\n\
    - Access to the number of positions.\n- The server must implement a `hashtable`.\n\
    - In `java`, the `Hashtable` class is the one found in `java.util`.\n\nFigure\
    \ 4.12 `rmiregistry`. For a color version of the figure, see `www.iste.co.uk/benmam/java.zip`.\n\
    \nIn our case:\n- The keys are the names given to positions.\n- The values are\
    \ 2D coordinates of vehicles.\n- The shared interface is as follows:\n\n```java\n\
    import java.rmi.*;\npublic interface Position extends Remote {\n  public void\
    \ insererTable (Point p, String nom) throws RemoteException;\n  public Point position\
    \ (String nom) throws RemoteException;\n  public int nombreles() throws RemoteException;\n\
    }\n```\n\nThe previous interface implements:\n- Creating a new position and attributing\
    \ a name.\n- Read-access to the positions.\n- Access to the number of positions.\n\
    \nThe `Point` class must implement `Serializable`.\n\n```java\nimport java.io.Serializable;\n\
    public class Point implements Serializable {\n  public float x;\n  public float\
    \ y;\n  public Point(float xx,float yy) {\n    x = xx;\n    y = yy;\n  }\n  public\
    \ String toString() {\n  return(\"+x+\", \"+y+\") ;\n  }\n}\n```\n\n#### The implementation\
    \ of the server:\n\n```java\nimport java.rmi.*;\nimport java.rmi.server.*;\nimport\
    \ java.net.*;\nimport java.util.Hashtable;\nimport java.rmi.registry.*;\npublic\
    \ class Serveur extends UnicastRemoteObject implements Position\n{\n  private\
    \ Hashtable h;\n  public Serveur() throws RemoteException {\n    h = new Hashtable()\
    \ ;\n  }\n  public void insererTable(Point p,String nom) throws RemoteException\n\
    \  {\n    h.put(nom,p);\n  }\n  public Point position(String nom) throws RemoteException\
    \ {\n  return((Point) h.get(nom));\n  }\n  public int nombreles() throws RemoteException\
    \ {\n  return(h.size());\n  }\n  public static void main(String [] args) {\n \
    \ try {\n    Serveur ib = new Serveur();\n    try {\n    LocateRegistry.createRegistry(1099);\n\
    \  } catch (RemoteException e1) {\n    System.err.println(\"rmiregistry is already\
    \ launched on this port\");\n      System.exit(1);\n  }\n    Naming.rebind(\"\
    rmi://localhost:1099/Data\",ib);\n    System.out.println(\"Ready\"); }\n  catch\
    \ (RemoteException re) {\n  System.out.println(re) }\n  catch(MalformedURLException\
    \ e) {\n  System.out.println(e) }\n  }\n}\n```\n\n#### The implementation of the\
    \ client:\n\n```java\nimport java.rmi.*;\npublic class Client {\n  public static\
    \ void main(String [] args) {\n  try {\n    Position b =(Position) Naming.lookup(\"\
    Data\");\n    System.out.println(b.nombreles()) ;\n    b.insererTable(new Point(11,5),\"\
    P0\") ;\n    b.insererTable(new Point(14,9),\"P1\");\n    System.out.println(b.nombreles());\n\
    \    System.out.println(b.position(\"P0\")) ;\n    System.out.println(b.position(\"\
    P1\")) ;\n    }\n  catch (Exception e) {\n    System.out.println(e) ; }\n  }\n\
    }\n```\n\n#### Execution:\n- Server side: Ready\n- Client side:\n    - 0\n   \
    \ - 2\n    - (11.0, 5.0)\n    - (14.0, 9.0)\n\nIgnoring `Serializable` in the\
    \ `Point` definition as follows:\n\n```java\npublic class Point {\n  public float\
    \ x ;\n  public float y ;\n  public Point(float xx,float yy) {\n    x = xx;\n\
    \    y = yy;\n  }\n  public String toString() {\n  return(\"+x+\", \"+y+\") ;\n\
    \  }\n}\n```\n\nwill give us the following execution:\n\n- Server side: Ready\
    \ // The transmission has not yet occurred.\n- Client side: 0 // primitive type\
    \ `int` does not pose a problem.\n\n`java.rmi.MarshalException: error marshalling\
    \ arguments; nested exception is:`\n\n```\njava.io.NotSerializableException: Position\n\
    ```\n"
