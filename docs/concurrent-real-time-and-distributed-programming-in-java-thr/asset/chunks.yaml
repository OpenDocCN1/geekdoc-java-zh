    ## 2.10 Java 中的信号量 (Semaphore)\n\n定义.– 信号量是一种高级对象，有助于管理对共享资源的并发访问，它最多允许 N 个并发访问。\n\
    \n示例：\n\n- – 管理一个具有 N 个车位的停车场的进出；\n- – 管理如医生诊所、美发店、保险公司等处拥有 N 张可用椅子的候诊室。\n\n###\
    \ 2.10.1 Java 1.5 之前\n\n信号量对象封装了一个完整的和两个原子操作：递增操作和递减操作。`P` 方法包含等待（wait），而 `V`\
    \ 方法包含通知（notify）。\n\n一个用于实现信号量的可能类如下：\n\n![images](img/f0055-01.jpg)\n\n每个想要访问临界区的线程都必须使用\
    \ `P` 方法，随后它将减少计数器变量的值。\n\n在前四个线程访问后，在第五个线程想要访问临界区的情况下，临界区的内容和计数器的值将如下：\n\n![images](img/f0056-01.jpg)\n\
    \n如果 T4 退出临界区，它必须使用 `V` 方法（递增计数并并通知）。\n\n![images](img/f0056-02.jpg)\n\n由于 T5\
    \ 是唯一被等待阻塞的线程，它将在收到来自 T4 的通知后进入临界区。\n\n![images](img/f0057-01.jpg)\n\n在所有线程都退出临界区后，临界区的状态和计数器的值如下：\n\
    \n![images](img/f0057-02.jpg)\n\n### 2.10.2 Java 1.5 之后\n\nJava 1.5 版本及其所在的包 `java.util.concurrent`（以及其所有的子包）提供了高级同步工具。\n\
    \n- – 操作 `P` (`acquire()`）：递减计数器；如果计数器为负，则在等待可以进行递减操作时阻塞。\n- – 操作 `V` (`release()`）：递增计数器；如果计数器为负或为空，则发送通知。\n\
    - – 我们可以将信号量视为一组芯片，具有两种操作：\n\n    - - 取走一个芯片，或者在必要时等待直到有可用的芯片；\n    - - `acquire()`，通常带有等待；\n\
    \    - - 放回一个芯片；\n    - - `release()`，通常带有通知。\n- – 一个信号量有一个芯片，它与锁非常相似。\n\n以下示例是使用信号量管理停车场。类参数\
    \ `Semaphore` 表示停车场的大小。\n\n![images](img/f0058-01.jpg)\n\n执行过程：\n\n```\nThread\
    \ 2 is not in the parking lot\nThread 3 is not in the parking lot\nThread 4 is\
    \ not in the parking lot\nThread 0 is not in the parking lot\nThread 1 is not\
    \ in the parking lot\nThread 1 enters the parking lot\nThread 2 enters the parking\
    \ lot\nThread 3 enters the parking lot\nThread 1 exits the parking lot\nThread\
    \ 0 enters the parking lot\nThread 0 exits the parking lot\nThread 4 enters the\
    \ parking lot\nThread 2 exits the parking lot\nThread 4 exits the parking lot\n\
    Thread 3 exits the parking lot\n```\n\n通过将之前代码中的指令 `Semaphore sem = new Semaphore(3)`\
    \ 替换为 `Semaphore sem = new Semaphore(1)`，我们获得了以下执行结果：\n\n```\nThread 2 is not\
    \ in the parking lot\nThread 3 is not in the parking lot\nThread 4 is not in the\
    \ parking lot\nThread 0 is not in the parking lot\nThread 1 is not in the parking\
    \ lot\nThread 0 enters the parking lot\nThread 0 exits the parking lot\nThread\
    \ 4 enters the parking lot\nThread 4 exits the parking lot\nThread 1 enters the\
    \ parking lot\nThread 1 exits the parking lot\nThread 3 enters the parking lot\n\
    Thread 3 exits the parking lot\nThread 2 enters the parking lot\nThread 2 exits\
    \ the parking lot\n```\n\n# 3 实时系统与实时 Java\n\n## 3.1 实时系统\n\n### 3.1.1 定义\n\n\
    实时系统与其他系统的区别在于，它们在某些情况下考虑了时间相关的限制，在这些情况下，遵守时间延迟与结果的准确性同样重要；换句话说，系统不仅必须交付准确的结果，还必须在给定的时间限制内交付结果。\n\
    \n在实时计算中，系统的正确行为不仅取决于逻辑处理结果，还取决于产生结果的时间 [STA 88]。\n\n示例：\n\n- – ATM 机不能花费 5 分钟来交付现金。\n\
    - – 雷达不能花费 2 秒来做出反应。\n- – ABS 系统获取信息不能超过 150 毫秒，反应不能超过 1 秒（ABS 指汽车上使用的防锁制动系统，防止车轮在剧烈制动下锁死）。\n\
    \n### 3.1.2 实时操作系统的示例\n\n- – Windows CE（Windows Embedded Compact），通常称为 WinCE，是\
    \ Windows 用于车载系统和其他极简系统（例如用于手持电脑）的变体。\n- – LynxOS 是一种基于 UNIX 平台的实时操作系统。\n- – LynxWorks\
    \ 是主要用于车载应用的实时操作系统。\n\n### 3.1.3 实时系统的类型\n\n- – 软实时（Flexible real-time）：\n\n \
    \   - 系统接受数据处理的波动。\n    - 惩罚不是灾难性的。\n    - 这些系统接受半秒（500 ms）甚至一秒的延迟。\n    示例：多媒体系统，如果几张图片没有显示，不会危及系统运行。\n\
    - – 硬实时（Firm real-time）：\n\n    - 在可接受的延迟内响应至关重要。\n    - 截止日期后的结果无用。\n    示例：金融交易，等。\n\
    - – 硬实时（Hard real-time）：\n\n    - 系统在延迟内的响应至关重要。\n    - 缺乏响应是灾难性的。\n示例：空中交通管制、核反应堆控制等。\n\
    \n### 3.1.4 架构\n\n- – 单任务架构（Monotask architecture）\n\n    - 单任务的实时系统很容易定义。它只需无限重复以下任务列表：\n\
    \    - 等待刺激。\n    - 根据刺激做出反应。\n示例：自动雷达。\n- – 多任务架构（Multitask architecture）：\n\
    \    - 每个任务都可以由一个线程执行。资源可以由临界区保护。临界区的长度影响系统的响应时间。\n示例：入侵检测系统 (IDS)，它实时执行各种任务，包括：\n\
    \    - – 互联网流量分析；\n    - – 识别参与攻击的 IP；\n    - – 防火墙重配置；\n    - – 警报的可视化通知：在一个或多个控制台上显示警报。\n\
    \n### 3.1.5 带优先级的任务调度\n\n优先级有助于组织任务。优先级值越高，任务访问处理器的优先级越高。优先级可以是动态的或静态的。\n\n在实时系统中，任务通常不会被低优先级任务阻塞。\n\
    \n- – 考虑两个线程 T1 和 T2。\n- – T1 具有高优先级（例如 10），T2 具有低优先级（例如 1）。\n- – 启动这两个线程后，T1\
    \ 必须在 T2 之前执行。\n- – 在某处，T1 被阻塞（例如通过 `wait()`），T2 运行进入临界区。\n- – T1 解阻塞并尝试获取锁。\n\
    - – T2 没有被调度且没有释放锁\n- – T2 在 T1 之前执行。\n- – 优先级反转管理会导致灾难性的影响。\n- – 事实上，由于缺乏优先级反转的管理意味着高优先级任务无法执行，可能无法对紧急情况做出反应。\n\
    \n示例：核反应堆的紧急停止指令会被低优先级的指令阻塞。\n\n"
- fmt: "\n- There is no simple solution that avoids inversions of priority. It is,\
    \ nonetheless, possible to implement measures that limit these risks. In particular,\
    \ it is possible to authorize access to critical sections only to similar-priority\
    \ threads.\n\nTwo solutions are proposed:\n\n- `Priority ceiling`:\n    - `Priority\
    \ Ceiling Protocol` (`PCP`): this consists of associating a priority cap each\
    \ resource. The priority of the resource among the tasks that can use it plus\
    \ 1\\. Ordinance transfers this priority to each task which accesses this resource.\
    \ When a task has finished using the resource, its priority returns to its original\
    \ value.\n\n- `Priority inheritance`:\n    - `Priority Inheritance Protocol` (`PIP`):\
    \ when a task `T2` (high-priority) is blocked while accessing resource `R`, the\
    \ blocking task `T1` (low-priority) inherits the priority of `T2`. `T1` uses the\
    \ priority inherited until the liberation of `R`, where it reencounters the priority\
    \ it had prior to its acquisition.\n\n## 3.2. Java in real-time\n\nOriginally,\
    \ Java was designed for onboard devices. But Java quickly started being used for\
    \ Web applications (applets). Java was then used for the following applications:\n\
    \n- Classic `J2SE` (`Java 2 Standard Edition`) for the client work station (`JVM`\
    \ classic, `HotSpot`).\n\n- Business `J2EE` (`Java 2 Enterprise Edition`) for\
    \ the development of business applications (`HotSpot`).\n\n- Reduced `J2ME` (`Java\
    \ 2 Micro Edition`) for mobile systems such as personal assistant pads and mobile\
    \ phones (classic `JVM`, `Kilo VM` (`KVM`), `Card VM` (`JVM` onboard on printed\
    \ chip)).\n\nNote that the language here is not designed for real-time, for the\
    \ following reasons:\n\n- lack of expertise in ordinancing;\n- Windows has trouble\
    \ managing priorities between threads;\n- for `notify()` or `notifyAll()` there\
    \ are no specifications on the selected thread, not necessarily FIFO;\n- it is\
    \ one of the few Java functionalities that is not mobile;\n- problems with `Garbage\
    \ Collector`/`GC`;\n- `GC` can be executed at any time;\n- `GC` can last a given\
    \ amount of time;\n- `GC` cannot be pre-empted;\n- `GC` pre-empts any thread.\n\
    \n### 3.2.1. `RTSJ (Real-Time Specification for Java)`\n\nThis is a proposition\
    \ for extending the `JVM` with real-time functionalities (`JVM RTSJ`) [JAV 17a].\n\
    \nSpecifications performed by a group of experts from a number of firms (Sun,\
    \ `IBM`, `QNX`, `Nel`, etc.).\n\nRestrictions:\n\n- Compatibility with existing:\
    \ any non-real-time Java application can run on a `JVM RTSJ`.\n- No syntaxic expansion.\n\
    - No material or power prerequisite.\n- Predictable execution time.\n- Granularity:\
    \ nanoseconds. 64 bits (ms) + 32 bits (ns).\n- `RTSJ` improves Java real-time\
    \ programming in the following fields:\n    - Memory management.\n    - Clock\
    \ and time-management.\n    - Ordinance and “schedulable” objects.\n    - Real-time\
    \ threads.\n    - Management on asynchronous events and timers.\n    - Synchronization\
    \ and resource-sharing.\n    - Addedpackage `javax.realtime` [JAV 17b].\n    -\
    \ Three interfaces.\n    - 47 classes.\n    - 15 exceptions.\n    - Four errors.\n\
    - `RTSJ`: Threads\n    - One interface:\n        - `Schedulable`: object that\
    \ can be ordinanced, extends `java.lang.Runnable`.\n        - `public interface\
    \ Schedulable extends java.lang.Runnable`.\n    - Two new classes:\n        -\
    \ `RealtimeThread`.\n        - `public class RealtimeThread extends java.lang.Thread\
    \ implements Schedulable`.\n        - Can access the heap. Of lower priority than\
    \ the `GC` (`DestroyJavaVM`).\n        - `NoHeapRealtimeThread`.\n        - `public\
    \ class NoHeapRealtimeThread extends RealtimeThread`.\n        - Its priority\
    \ is higher than the `GC`. Works within the `ScopedMemory`, the objects within\
    \ this thread are allocated to this memory.\n    - `ScopedMemory` presents the\
    \ following characteristics:\n        - Has the lifespan of the real-time thread\
    \ occupying it.\n        - Is not managed by the garbage collector.\n        -\
    \ Objects can be allocated within a `ScopedMemory` (rather than in `HeapMemory`).\n\
    \        - Objects are free at the end of the scope.\n        - A `NoHeapRealtimeThread`\
    \ cannot access the `Heap`.\n        - Therefore, a `NoHeapRealtimeThread` cannot\
    \ be blocked by the `Garbage Collector`.\n    - Priorities are organized as follows:\n\
    \        `Thread` < `RealtimeThread` < `Garbage Collector` < `NoHeapRealtime Thread`.\n\
    \n### 3.2.2. Implementations\n\nThe following three studied implementations are:\n\
    \n- `Reference implementation: RI`.\n    - Destined for research and aiming to\
    \ demonstrate the feasibility of the Java real-time adventure. Performed by the\
    \ company `TimeSys` [TIM 17]. It also exists for `Linux/x86`.\n\nThe execution\
    \ of its code is presented in the following diagram:\n\n![image](images/fig3-1.jpg)\n\
    \n**Figure 3.1.** *Reference implementation*\n\n- `OpenSource implementation:\
    \ jRate`.\n\n`jRate` is a university project (Irvine University in California)\
    \ run by Angelo Corsaro [UCI 17].\n\n`jRate` is composed of:\n\n- Java.\n- `C++`\
    \ (`CNI`).\n- `JNI` (Java Native Interface).\n- `JVM` via `C++`.\n- `jRate`.\n\
    - `C++`.\n- `jRate`.\n- `GC`.\n- `GCC`.\n- `C++`.\n\n- `Proprietary implementation:\
    \ JamaicaVM`.\n\nThis is a commercialized solution by the company `AICAS` for\
    \ aerospace, automotive and industrial robotics segments. It possesses a real-time\
    \ `GC`. The following diagram gives an idea of its implementation:\n\n![image](images/fig3-2.jpg)\n\
    \n**Figure 3.2.** *Implementation of JamaicaVM*\n\n# 4\n\nDistributed Programming\
    \ in Java\n\n## 4.1. Definition of a distributed application\n\nAn application\
    \ is divided into a number of units.\n\n- Each unit is placed on a different machine.\n\
    - Each unit can execute on a different system.\n- Each unit can be programed in\
    \ a different language.\n\n![image](images/fig4-1.jpg)\n\n**Figure 4.1.** *Monolithic\
    \ application versus distributed application. For a color version of the figure,\
    \ see [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)*\n\
    \n## 4.2. Communication in a distributed application\n\n### 4.2.1. *Low-level\
    \ communication: socket*\n\n#### 4.2.1.1. *Definition*\n\nA network socket is\
    \ a model that allows processes to communicate and synchronize with one another,\
    \ either on the same machine or over a network.\n\nSockets were developed by Berkeley\
    \ University (California) in 1986.\n\nThe original interface designed by Berkeley\
    \ was for C but since then sockets have been implemented in various languages.\n\
    \nFor Java, the `Socket` class in the package `java.net` appearing in `J2SE 1.4`\
    \ (6 Feb 2002) is used to implement sockets.\n\n#### 4.2.1.2. *Modes of communication*\n\
    \n- Connected mode (comparable to a telephone communication), using the `TCP`\
    \ protocol. In this mode of communication, a sustainable connection is established\
    \ between the two processes, in such a way that the destination address is not\
    \ required for each data package.\n"
