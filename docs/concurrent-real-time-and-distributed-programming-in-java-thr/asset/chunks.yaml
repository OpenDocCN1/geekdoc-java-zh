- fmt: "\n![images](images/f0041-01.jpg)\n\nThe resulting execution is demonstrated\
    \ in the diagram below.\n\n`Plus1` is a method that uses mutual exclusion and\
    \ increments `val` by one unit for each thread that possesses the lock of the\
    \ method.\n\n![images](images/f0042-01.jpg)\n\n*   – In Java, each object possesses\
    \ a single monitor (supervisor) which can keep critical sections. It ensures that\
    \ only one thread can execute the critical section supervised by the monitor,\n\
    *   – `synchronized (object) { instr }` monitor associated with the object.\n\
    *   – `synchronized void Method(){…}` monitor associated with the method.\n* \
    \  – The object is locked while the synchronized block is executed.\n*   – In\
    \ Java, each object also possesses a waiting queue.\n\n![images](images/f0043-01.jpg)\n\
    \n## 2.7 Shared variables: class variable\n\nIn the following section, we will\
    \ present an example of thread cooperation (teacher vs. students). We have teacher\
    \ teaching students new words.\n\nThe students must repeat each word three times,\
    \ maybe more.\n\n![image](images/fig2-3.jpg)\n\n**Figure 2.3.** Consumer/producer\
    \ example. For a color version of the figure, see [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
    \nThe naive code for this example is as follows:\n\n![images](images/f0044-01.jpg)\n\
    \nExecution:\n\nnouveau mot pour perroquet ? (sinon non)\n\nbla\n\nnouveau mot\
    \ pour perroquet? (sinon non)\n\ncoco bla\n\ncoco bla\n\ncoco bla\n\njaco bla\n\
    \njaco bla\n\njaco bla\n\nblu\n\nnouveau mot pour perroquet ? (sinon non)\n\n\
    coco blu\n\ncoco blu\n\ncoco blu\n\nblo\n\ncoco blu\n\ncoco blu\n\ncoco blu\n\n\
    coco blu\n\ncoco blu\n\ncoco blu\n\nnouveau mot pour perroquet ? (sinon non)\n\
    \njaco blo\n\njaco blo\n\njaco blo\n\njaco blo\n\njaco blo\n\n…..\n\nOne static\
    \ variable `mot` (known as a class variable) is shared between the two parrot\
    \ threads which must learn it and then repeat it. Thereafter, the main thread\
    \ enters another word (`mot`).\n\nAt first, they must wait with a loop for the\
    \ first word and if the professor provides new words too fast, the two parrots\
    \ may “skip” some!\n\nObjective: to avoid a waiting mechanism between the professor\
    \ and the parrot students: the students wait for a new word (*nouveau mot*) to\
    \ learn, the professor, when teaching a word, must wait for the students to have\
    \ had time to learn and repeat it, before teaching a new one.\n\n## 2.8 Synchronization\
    \ between threads\n\n### 2.8.1 Wait and notifyAll\n\nIn the following code, we\
    \ created an object called `attheboard` to share between producer and consumer.\
    \ This object must have two methods: the first is used by the consumer (`learn`)\
    \ and the second is used by the producer (`teach`).\n\n![images](images/f0046-01.jpg)\n\
    \nExecution:\n\nnouveau mot pour perroquet ? (sinon non)\n\nmaster\n\nnouveau\
    \ mot pour perroquet ? (sinon non)\n\ncoco master\n\ncoco master\n\ncoco master\n\
    \njaco master\n\njaco master\n\njaco master\n\nRSD\n\ncoco RSD\n\ncoco RSD\n\n\
    coco RSD\n\njaco RSD\n\njaco RSD\n\njaco RSD\n\nnouveau mot pour perroquet ? (sinon\
    \ non)\n\nno\n\n*   – The `wait` and `notifyAll` methods are defined in the class\
    \ `java.lang.Object` and are therefore inherited by the whole class (including\
    \ `notify`).\n*   – The `wait` method pauses (blocks) a thread’s execution, until\
    \ a condition is met. Meeting this condition is signaled by another thread using\
    \ `notify` or `notifyAll` methods.\n*   – When the `wait` method is invoked using\
    \ a `synchronized` method, at the same time as the execution is paused, the lock\
    \ set on the object through which the method was invoked is dropped. As soon as\
    \ the wake condition arises, the thread waits to be able to take over the lock\
    \ and continue the execution.\n*   – Note here the primary difference between\
    \ `sleep` and `wait`:\n    *   `sleep` blocks the execution but the thread maintains\
    \ hold of the lock (terminates its execution);\n    *   `wait` blocks the execution\
    \ but the thread frees the lock (a second thread can execute the critical section).\n\
    \n### 2.8.2 Wait and notify\n\nIn the following code, compared with the previous\
    \ section, we have replaced `notifyAll` with `notify`:\n\n![images](images/f0048-01.jpg)\n\
    \nExecution:\n\ncoco bonjour\n\ncoco bonjour\n\ncoco bonjour\n\nRSD\n\ncoco RSD\n\
    \ncoco RSD\n\ncoco RSD\n\nnouveau mot pour perroquet ? (sinon non)\n\nencore\n\
    \njaco encore\n\njaco encore\n\njaco encore\n\nnouveau mot pour perroquet ? (sinon\
    \ non)\n\nbizarre\n\ncoco bizarre\n\ncoco bizarre\n\ncoco bizarre\n\nnouveau mot\
    \ pour perroquet ? (sinon non)\n\nvraiment\n\njaco vraiment\n\njaco vraiment\n\
    \njaco vraiment\n\nnouveau mot pour perroquet ? (sinon non)\n\nno\n\nOne single\
    \ thread is freed from waiting by `notify`. Only one single parrot student is\
    \ learning at a time.\n\n`notify()` only wakes up one thread at a time; there\
    \ is no specification on the selected thread! It is the thread controller that\
    \ chooses (the mechanism is not on a FIFO basis).\n\nA second example of producer\
    \ consumer is shown in the following figure. It presents users arriving at a station\
    \ to wait for a bus; a bus arrives, loads the users into the bus.\n\n![images](images/f0050-01.jpg)\n\
    \n```\nclass BusSimple {\n    public static void main(String args[]) {\n     \
    \   Station BusStation = new Station();\n        Usager[] u = {new Usager(\"A\"\
    , BusStation), new Usager(\"B\", BusStation),\n                      new Usager(\"\
    C\", BusStation), new Usager(\"D\", BusStation),\n                      new Usager(\"\
    E\", BusStation)};\n        Bus b = new Bus(BusStation);\n        b.start();\n\
    \        for (int i = 0; i < u.length; i++) {\n            u[i].start();\n   \
    \     }\n    }\n}\n\nclass Station {\n    private int count = 0;\n    public synchronized\
    \ void charger(String name) {\n        while (count == 5) wait();\n        count++;\n\
    \        System.out.println(name + \" arrives\");\n        notifyAll();\n    }\n\
    \    public synchronized void attendre() {\n        while (count == 0) wait();\n\
    \        count--;\n        System.out.println(\"Bus departs\");\n        notifyAll();\n\
    \    }\n}\n\nclass Usager extends Thread {\n    private String name;\n    private\
    \ Station station;\n    public Usager(String name, Station station) {\n      \
    \  this.name = name;\n        this.station = station;\n    }\n    public void\
    \ run() {\n        for (int i = 0; i < 3; i++) {\n            station.charger(name);\n\
    \            try { sleep(1000); } catch (InterruptedException e) {}\n        }\n\
    \    }\n}\n\nclass Bus extends Thread {\n    private Station station;\n    public\
    \ Bus(Station station) {\n        this.station = station;\n    }\n    public void\
    \ run() {\n        while (true) {\n            station.attendre();\n         \
    \   try { sleep(2000); } catch (InterruptedException e) {}\n        }\n    }\n\
    }\n```\n\nThe shared object is `BusStation`; it contains two methods. One is used\
    \ by the producer (`charger`) and another is used by the consumer (`attendre`).\n\
    \nExecution:\n\nC arrives\nE arrives\nA arrives\nD arrives\nBus departs\nC arrives\n\
    E arrives\nA arrives\nD arrives\nBus departs\nC arrives\nE arrives\nA arrives\n\
    D arrives\nBus departs\nC arrives\nE arrives\nA arrives\nD arrives\nBus departs\n\
    C arrives\nE arrives\nA arrives...\n\n## 2.9 Classic Producer–Consumer pattern\n\
    \nWe will talk about classic patterns in the case of a single producer and a single\
    \ consumer.\n\nThe example used here is a professor teaching a student. The student\
    \ must repeat each word three times.\n\n![image](images/fig2-4.jpg)\n\n**Figure\
    \ 2.4.** Consumer/producer pattern. For a color version of the figure, see [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
    \nThe code for this example is as follows:\n\n![images](images/f0052-01.jpg)\n\
    \nExecution:\n\nnouveau mot pour perroquet ?\n\nSpeak\n\nnouveau mot pour perroquet\
    \ ?\n\ncoco Speak\n\ncoco Speak\n\ncoco Speak\n\nHouse\n\nnouveau mot pour perroquet\
    \ ?\n\ncoco House\n\ncoco House\n\ncoco House\n\nBonjour\n\nnouveau mot pour perroquet\
    \ ?\n\ncoco Hello\n\ncoco Hello\n\ncoco Hello\n\nChat\n\ncoco Chat\n\ncoco Chat\n\
    \ncoco Chat\n\n*   – The problem is simplified, one single teacher and one parrot,\
    \ and one waits for the other:\n    *   - The parrot waits for a new word to learn.\n\
    \    *   - The teacher waits for the parrot to read and repeat the word.\n*  \
    \ – This classic pattern is known as Producer–Consumer:\n*   – Both functions\
    \ must be synchronized so that:\n    *   - the consumer waits until there is nothing\
    \ to consume.\n    *   `while (motAuTableau == null)`\n    *   - the producer\
    \ waits while the consumer is not ready to consume.\n    *   `while (motAuTableau\
    \ != null)`\n\n![images](images/f0053-01.jpg)\n\nThere can also be models with\
    \ more than one producer and more than one consumer. One such example is as follows:\n\
    \n*   – `Producers` threads that produce data and place them into a message queue.\n\
    *   – `Consumers` threads that take the data from the queue.\n*   – The producers\
    \ and consumers must not access the queue at the same time (critical section).\n\
    \n![images](images/f0054-01.jpg)\n\nA possible implementation of this model would\
    \ realize synchronization in relation to the message queue.\n\n*   – The producers:\n\
    \    *   - when the queue is full: block;\n"
