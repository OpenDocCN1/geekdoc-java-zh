    *   – Data confidentiality (or encrypted session).\n\n*   – Integrity of exchanged\
    \ data.\n\n*   – The JSSE API (Java Secure Socket Extension) makes it possible\
    \ to manipulate secure sockets in Java responding to SSL specifications.\n\n*\
    \   – The JSSE classes and interfaces are grouped into packages javax.net and\
    \ javax.net.ssl.\n\n![image](images/fig4-13.jpg)\n\n**Figure 4.13.** *RMI with\
    \ TLS. For a color version of the figure, see [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)*\n\
    \n#### 4.2.2.6\\. *Dynamic class loading*\n\n*   – Java classes are hosted on\
    \ a Web server.\n\n*   – This avoids holding all class definitions locally.\n\n\
    *   – The same class files are shared by all clients.\n\n*   – Only classes that\
    \ are needed are loaded.\n\n*   – In this case, we can turn towards dynamic loading:\n\
    \n    *   - Place the java class (stub, for example) in a Web server that is accessible\
    \ by the client. For example: [http://monserveur.fr/test](http://monserveur.fr/test).\n\
    \n    *   - Implement a SecurityManager:\n\n        *   - Add the following line\
    \ in the client and the server: System.setSecurityManager(new SecurityManager()));\n\
    \n        *   - Execute the following on the server: java - Djava.security.policy=java.policy\
    \ Server\n\n        *   - Execute the client by supplying the dynamic class loading\
    \ URL:\n\n        *   - java -Djava.rmi.server.codebase=http://myserver.fr/test/\n\
    \n        *   - Djava.security.policy=java.policy Client\n\nThe stub on the server\
    \ side is as follows:\n\n```\nimport java.rmi.Naming;\npublic class HelloClient\
    \ {\npublic HelloClient() {\ntry {\nHello obj = (Hello)Naming.lookup(\"Hello\"\
    );\nSystem.out.println(obj.Bonjour());\n} catch (Exception e) {\nSystem.out.println(\"\
    HelloClient exception: \" + e);\n}\n}\n}\n```\n\nHelloClient.java is a class shared\
    \ between various RMI clients.\n\nThe following code represents an RMI client\
    \ using dynamic class loading:\n\n```\nimport java.rmi.server.RMIClassLoader;\n\
    import java.util.Properties;\npublic class DynamicClient {\npublic DynamicClient()\
    \ throws Exception {\n// Install a security manager (without this manager, loading\
    \ is unauthorized)\nSystem.setSecurityManager(new SecurityManager());\nProperties\
    \ p = System.getProperties();\n/Indicate the download path\nString url = p.getProperty(\"\
    java.rmi.server.codebase\");\n// Download desired class\nClass clientClass = RMIClassLoader.loadClass(url,\
    \ \"HelloClient\");\n// Create an instance of class\nclientClass.newInstance();\n\
    }\npublic static void main (String args[]) {\ntry {DynamicClient dc = new DynamicClient();\n\
    } catch (Exception e) {System.out.println(e);}\n}\n}\n```\n\n#### 4.2.2.7\\. *Asynchronicity\
    \ in RMI: callback methods*\n\nIn RMI, the client calls a method located on the\
    \ server side.\n\n*Requirement:* during execution, the server can launch processes\
    \ on the client side.\n\nPerform a call from the server towards the clients."
