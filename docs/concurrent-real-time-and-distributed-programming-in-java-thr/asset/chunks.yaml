    \ Barber(Wake, BarberChair);\nClient cl = new Client(\"Client \" + i + \":\",\
    \ FreeChairs, Wake, BarberChair);\n```\n\nIn the Semaphore class, the tryAcquire()\
    \ method attempts to acquire a chip to access the critical section (returns true\
    \ in case of success, false in case of failure).\n\nExample: while (!FreeChairs.tryAcquire())\
    \ sleep(5000); could be used in the client’s run in order to put itself into wait-mode\
    \ if there are no free chairs.\n\n##### Exercise 12: entry/exit management of\
    \ a parking lot\n\nIn this Exercise, we wish to count the entries and exits of\
