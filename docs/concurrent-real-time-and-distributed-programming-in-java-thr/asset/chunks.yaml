    - Now, your client must connect to the server by sending a counter number in order
    to recover all information on this counter (under the form of an object for a
    first version and the form of a chain of characters for a second version). Make
    the necessary modifications to your code in order to answer this question.


    ### Exercise 19: applet and TCP sockets


    Create the following client/server model:


    ![images](images/f0151-01.jpg)


    *For a color version of the figure, see [`www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)*


    Improve the HMI on the client side and the processing on the server side in order
    to perform classic banking operations:


    - Open a new `Counter`;

    - Add money to a `Counter` with a known number;

    - Withdraw from a `Counter` with a known number;

    - Display the name of the account holder and the balance of a `Counter` with a
    known number;

    - Display the `Counter` number when the name of the account holder is known;

    - Display the average sum of the balances of all the `Counters`;

    - Display the `Counter` list.


    ### Exercise 20: arithmetic operations with TCP sockets


    In this exercise, `ADD`, `MUL`, `DIV` and `SUB` correspond, respectively, to operations
    of adding, multiplying, dividing and subtracting.


    Your objective is to create a client/server application using TCP sockets.


    The client sends two operands to the server as well as the operation to perform
    (all three in the form of a single chain of characters), and the server responds
    with the result of the operation. For example, if the client were to send to the
    server:


    - `ADD 6 1`, the server would respond with `7`.

    - `MUL 10 88`, the latter would respond with `880`.

    - `SOUS 5 9`, the server would respond with `-4`.

    - `DIV 9 8`, the server would respond with `1.125`. (Real division).

    - `PARIS 6 7`, the server would respond with `hhhhh error`.


    ### Exercise 21: multiplication tables with TCP sockets


    - Create a client/server model using TCP sockets `java`; the client sends an integer
    to the server (`4` for example), and the latter responds with the multiplication
    table of the integer.


    The client would, for example, have to display: Multiplication table of 4:


    ```

    0 4 8 12 16 20 24 28 32 36 40

    ```


    - Your client must now send a table of integers, saying `{1, 6, 8, 9, 13, 10}`.

    - The server must respond with the sub-table containing only even integers (`{6,
    8, 10}`).


    ### Exercise 22: low-level manipulations of TCP sockets


    Using low-level TCP socket manipulations (`write` of `OutputStream` and `read`
    `InputStream`), write a client/server model in which the client sends the server
    a phrase containing two words (ex. `PARIS MADRID`).


    The server will spread via the same sentence but over two lines (each word on
    one line).


    In this example, the server will respond with:


    ```

    PARIS

    MADRID

    ```


    ### Exercise 23: manipulating character chains with RMI


    - Using Java RMI, write a remote method to calculate the inverse of a word. For
    this, we need to write the shared interface between the client and the server,
    the client implementation and the server implementation.

    - Add a second remote method to return the sub-string containing the four characters
    at the beginning of this word.

    - Add a third remote method to find out whether the word is a palindrome.


    ### Exercise 24: Fibonacci with RMI


    The Fibonacci sequence is a series of integers in which each number is the sum
    of the two numbers before it. It generally begins with 1 and its first numbers
    are: 1, 1, 2, 3, 5, 8, 13, 21, etc.


    Using Java RMI, write a remote method that has a parameter of number `n` and that
    returns the `n` first integers of the sequence. Sending `5`, for example, to the
    server, the latter will respond with the following chain of characters: `1, 1,
    2, 3, 5`.


    ### Exercise 25: bowtie with RMI


    Using Java RMI, write a remote method that receives a chain of characters with
    an odd number of characters (you will have to perform a test on the length of
    the word) and displays it in the shape of a bowtie. For example:


    ```

    h o

    he lo

    hello

    he lo

    h o

    ```


    ### Exercise 26: registry service with RMI


    We wish to implement a registry service that records names and phone numbers and
    allows the user to access them using a name. The registry must be accessible remotely
    via RMI. We consider that the name and number are chains of characters.


    - Define an RMI interface that responds to these specifications.

    - Develop a server object implanting this interface.

    - Develop a client that questions the aforementioned server object.


