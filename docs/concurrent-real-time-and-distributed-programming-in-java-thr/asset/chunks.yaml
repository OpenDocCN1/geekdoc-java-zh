    IO Exception\");}\n    numbField = new TextField(6);\n    add(numbField);\n  \
    \  Button button = new Button(\"Send\");\n    add(button);\n      button.addActionListener(this);\n\
    \      display = new Label(\"Pas de nombre\");\n      add(display);\n    }\n \
    \ public void actionPerformed(ActionEvent e) {\n    int numb = 0;\n      String\
    \ numbStr = null;\n      BufferedReader in = null;\n      PrintWriter out = null;\n\
    \    String actionCommand = e.getActionCommand(); // know the source of\nthe event\n\
    \    if (e.getSource() instanceof Button)\n      if (actionCommand.equals(\"Send\"\
    )){\n              try {numb = Integer.parseInt(numbField.getText());}\n     \
    \         catch (NumberFormatException ex) {System.out.println\n(\"Number Format\
    \ Exception\");}\n              try {\n              in = new BufferedReader(new\n\
    \              InputStreamReader(socket.getInputStream()));\n              out\
    \ = new PrintWriter(socket.getOutputStream(), true);\n              }\n      \
    \        catch (IOException ex) {System.out.println(\"IO\nException\");}\n   \
    \           out.println(numb);\n              try {numbStr = in.readLine();}\n\
    \              catch (IOException ex) {System.out.println(\"Applet receive\nfailed:\"\
    );}\n              display.setText(numbStr);\n    } // end of class\n```\n\n###\
    \ 4.2.2 High-level communication: middleware\n\nThese are layers offering complex\
    \ services. These layers are created using `TCP/UDP` layers. Example: call from\
    \ a method in a distant entity.\n\n- The middleware is an intermediary layer (software\
    \ layer) that fits into the communication infrastructure of a network and the\
    \ elements of the distributed application.\n\n![image/fig4-5.jpg]\n\n**Figure\
    \ 4.5.** Position of Middleware in a network. For a color version of the figure,\
    \ see [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
    \n- The distributed environments are based (for the most-part) on `RPC` (remote\
    \ procedure call).\n- This mechanism functions with a request/response mode.\n\
    - The client makes a request (asks for service).\n- The server then processes\
    \ the request and, finally, returns a response to the client.\n\nThe `RPC` possesses\
    \ the following characteristics:\n- Procedural programming, so not object-oriented.\n\
    - Parameters and return values are primitive type.\n- No “distant reference”.\n\
    \nSubsequently middleware evolved in the following ways:\n- `JAVA RMI` (Remote\
    \ Method Invocation). Mono-language, multiplatform: from `JVM` to `JVM`.\n- `CORBA`\
    \ (Common Object Request Broker). Multi-language, multiplatform.\n- `DCOM` (Distributed\
    \ Component Model) de Microsoft. Multi-language, communication between distributed\
    \ software components.\n\nIn the following section, we will focus on Java RMI.\n\
    \n![image/fig4-6.jpg]\n\n**Figure 4.6.** RPC operation. For a color version of\
    \ the figure, see [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
    \n#### 4.2.2.1 Introduction to RMI\n\n`RMI` allows virtual Java machines to communicate\
    \ whether they are on the same machine or on two distinct machines. `java.rmi`:\
    \ API integrated into the `JDK 1.1` and more (since 1997).\n\nIn order for the\
    \ clients to access distant services, they must be saved in a registry. The RMI\
    \ registry is called `rmireistry` and it possesses a hashing table where the keys\
    \ are names and the values are distant objects.\n\n![image/fig4-7.jpg]\n\n**Figure\
    \ 4.7.** rmireistry\n\nThe operating principle of an RMI application is the following:\n\
    - The server creates the objects and saves them in the `rmireistry`.\n- This allows\
    \ the clients to locate the objects and get references towards these objects.\n\
    - When a client wishes to summon an object remotely, it checks the `rmireistry`\
    \ to locate the object: it supplies the name of the object and receives a reference\
    \ towards this distant object (a `stub`).\n- With the newly obtained reference,\
    \ the client will be able to summon the methods of this object.\n\nThe methods\
    \ of the proxy `B` summon the real methods on the distant object `B` by traveling\
    \ over the network.\n- When a client obtains a reference to a distributed object,\
    \ it obtains in fact a reference to a `stub`.\n- A `stub` is a proxy (local representative\
    \ of a distant object) that is loaded into the client upon obtaining the reference.\n\
    - The client therefore summons, via its reference, the methods that reside in\
    \ the stub that summons the real methods on the distant object by travelling over\
    \ a network. \n- This is the mechanism that ensures the transparency of calls.\n\
    \n![image/fig4-8.jpg]\n\n**Figure 4.8.** Operation of an RMI application. For\
    \ a color version of the figure, see [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
    \n[Figure 4.9](#chapter04.xhtml_fig4-9) represents the stages of a call for a\
    \ distant method.\n\n#### 4.2.2.2 RMI architecture\n\n[Figure 4.10](#chapter04.xhtml_fig4-10)\
    \ represents the RMI architecture.\n\n![image/fig4-9.jpg]\n\n**[Figure 4.9](#chapter04.xhtml_ifig4-9).**\
    \ Stages of a distant method call. For a color version of the figure, see [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
    \n![image/fig4-10.jpg]\n\n**[Figure 4.10](#chapter04.xhtml_ifig4-10).** RMI architecture.\
    \ For a color version of the figure, see [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
    \n- First layer: stub/skeleton.\n    - `stub`: local representative of a distant\
    \ object.\n        - Initiates a connection with the distant `JVM` by transmitting\
    \ the distant summon to the layer of reference objects (`RRL`).\n        - Assembles\
    \ the parameters in preparation for their transfer to the distant `JVM`.\n   \
    \ - `skeleton`: used to locate the distributed object.\n        - Disassembles\
    \ the parameters for the distant method.\n        - Calls on the requested method.\n\
    \        - Assembly of the result (returned value or exception) destined to the\
    \ caller.\n- Remarks: The skeleton is no longer necessary since Java 2 (1998).\n\
    - A similar class of generic skeleton is shared between all distant objects.\n\
    - Furthermore, up until version 5.0 of J2SE (2004), a stub compiler called `RMIC`\
    \ (Java RMI Compiler) was required to generate the stub/skeleton before saving\
    \ on the RMI registry.\n"
