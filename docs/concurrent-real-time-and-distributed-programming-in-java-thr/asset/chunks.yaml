    \n### Exercise 11: Sleeping barber’s problem (producer/consumer with semaphore)\n\
    \nA barber owns a salon with one barber seat and a waiting room containing N waiting\
    \ seats.\n\n*– If he has no customers, the barber sits on the barber seat.\n*–\
    \ When a customer arrives:\n    *   - If the waiting room is full, the customer\
    \ comes back later.\n    *   - If the barber is asleep, he wakes him up, sits\
    \ on the barber seat and waits for his haircut.\n    *   - If the barber is busy\
    \ when the customer arrives, the customer sits and falls asleep on one of the\
    \ N chairs in the waiting room, he must wait for the barber seat to available.\n\
    *– When the barber is done with one haircut, he exits the customer and goes to\
    \ wake up one of the customers in the waiting room.\n*– If the waiting room is\
    \ empty, the barber goes back to sleep on his barber seat and waits for another\
    \ customer to arrive.\n\nThe point of this exercise is to associate a thread with\
    \ the barber as well as with every customer and program a sleeping barber session\
    \ in Java. The use of semaphores is required to guarantee the mutual exclusion\
    \ among the threads.\n\n*Hint*: A client is characterized by its name and three\
    \ semaphores: `FreeChairs`, `Wake`, `BarberChair`.\n\n`FreeChairs`: manages the\
    \ mutual exclusion in relation to the waiting room.\n`Wake`: use in order to allow\
    \ the client to wake the barber if the latter is asleep.\n`BarberChair`: manages\
    \ the mutual exclusion in relation to the barber chair.\n\nA barber is characterized\
    \ by two semaphores `Wake`, `BarberChair`.\n\nUpon initialization, ensure that\
    \ the two semaphores – `Wake`, `BarberChair` – are in common with barber and the\
    \ client threads.\n\nExample of initialization:\n\n```\nBarber c = new Barber(Wake,\
    \ BarberChair);\nClient cl = new Client(\"Client \" + i + \":\", FreeChairs, Wake,\
    \ BarberChair);\n```\n\nIn the `Semaphore` class, the `tryAcquire()` method attempts\
    \ to acquire a chip to access the critical section (returns true in case of success,\
    \ false in case of failure).\n\nExample: `while (!FreeChairs.tryAcquire()) sleep(5000);`\
    \ could be used in the client’s run in order to put itself into wait-mode if there\
    \ are no free chairs.\n\n### Exercise 12: entry/exit management of a parking lot\n\
    \nIn this Exercise, we wish to count the entries and exits of the vehicles in\
    \ a parking lot to display the number of available spaces in the parking lot every\
