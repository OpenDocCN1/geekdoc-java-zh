  trans: "\n\n# 目标：增加动态性。\n\n在这种情况下，每个元素（客户端或服务器）都可以不区别地胜任两种角色（同时作为客户端和服务器）。\n\n服务器对客户端的调用被称为回调（callbacks）。\n\
    \n- 由于服务器并不知道此类方法的实现方式，且由于其执行时间可能很长，因此回调通常被实现为异步操作。\n- 服务器避免了通过同步调用对其他客户端造成惩罚。\n\
    - 同步调用 → 阻塞执行以等待结果。\n- 回调是一种机制，允许在 RMI 中引入异步性，而 RMI 的调用在本质上是同步且阻塞的。\n- 异步方法始终是\
    \ `void` 类型（不返回结果）。\n- 发调用的程序不需要立即获得结果；否则，它将被阻塞。\n- 在 Java 中，方法通常都是同步的，但线程的 `start()`\
    \ 方法除外。\n- `start()` 不阻塞调用线程。\n- 客户端将回调对象（远程对象）作为参数传递给服务器。\n- 客户端留出其坐标以便后续进行回调。\n\
    - 第一个接口：`ServerInterface`（服务器端实现）。\n- 服务器在对象上执行异步调用。\n- 必须由一个线程执行回调。\n- 第二个接口：`InterfaceCallback`（客户端端实现）。\n\
    \n![image](img/fig4-14.jpg)\n\n**图 4.14.** RMI 中的回调。如需图片的彩色版本，请访问 [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
    \n为了执行回调，我们需要以下六个类：\n\n![image](img/fig4-15.jpg)\n\n**图 4.15.** 回调所需的类。如需该彩色彩色版本，请访问\
    \ [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
    \n`InterfaceCalback.java`：包含回调方法的接口。该接口由 `Callback.java` 实现。\n\n该接口的示例如下：\n\n\
    ```java\nimport java.rmi.Remote ;\nimport java.rmi.RemoteException ;\npublic interface\
    \ InterfaceCallback extends Remote {\n  public void doCallback () throws RemoteException\
    \ ;\n}\n```\n\n在客户端实现的是该回调方法的接口。\n\n`Callback.java`：实现回调方法的类。该类仅在客户端可用，用于实现回调方法。\n\
    \n```java\nimport java.rmi.RemoteException ;\nimport java.rmi.server.UnicastRemoteObject\
    \ ;\npublic class Callback extends UnicastRemoteObject implements\nInterfaceCallback\
    \ {\npublic Callback ( ) throws RemoteException {}\npublic void doCallback ()\
    \ throws RemoteException {\n  System.out.println (\"Bonjour tous le monde\") ;\n\
    }\n}\n```\n\n`Servant.java`：启动回调方法的线程。\n\n```java\nimport java.rmi.*;\npublic\
    \ class Servant extends Thread {\nprivate InterfaceCallback obj ;\npublic Servant\
    \ (InterfaceCallback obj) {\nthis.obj = obj ;\n}\npublic void run ( ) { // 在独立线程中执行\n\
    try {Thread.sleep (3000) ; } catch ( InterruptedException e ) { }\ntry {obj.doCallback\
    \ () ; // 执行回调，调用客户端的方法\n}\ncatch (RemoteException e ) {\n  System.err.println\
    \ (\"Return call failed: \" + e ) ;\n}\n}\n}\n```\n\n`InterfaceServer.java`：包含服务器用于回调客户端方法的接口，该方法的参数是需要被回调的对象。此接口由\
    \ `Server.java` 实现。\n\n```java\nimport java.rmi.Remote;\nimport java.rmi.RemoteException;\n\
    public interface InterfaceServeur extends Remote {\n  public void callMeBack (InterfaceCallback\
    \ obj) throws RemoteException\n;\n}\n```\n\n`callMeBack` 方法由客户端使用。\n\n`Client.java`：创建对象并将其传递给服务器（调用服务器端实现的\
    \ `InterfaceServer` 方法）。\n\n实现一个可被回调的经典 RMI：\n\n```java\nimport java.rmi.Naming\
    \ ;\npublic class Client {\npublic static void main( String [ ] args ) throws\
    \ Exception {\nCallback obj = new Callback ( ) ; // 创建回调对象\nInterfaceServeur serv=\
    \ (InterfaceServeur) Naming.lookup (\"Server\");\nSystem.out.println (\"Starting\
    \ call\");\nserv.callMeBack (obj) ; // 调用请求\n}\n}\n```\n\n`Server.java`：实现回调客户端的方法，通过传递上一个线程接收到的对象来实现。\n\
    \n```java\nimport java.rmi.Naming;\nimport java.rmi.RemoteException;\nimport java.rmi.registry.LocateRegistry;\n\
    import java.rmi.server.UnicastRemoteObject;\npublic class Server extends UnicastRemoteObject\
    \ implements\nInterfaceServer {\npublic Server ( ) throws RemoteException { }\n\
    public void callMeBack (InterfaceCallback obj) throws RemoteException {\nServant\
    \ servant = new Servant (obj) ; // 创建线程\nservant.start ( ) ; // 初始化线程\n}\npublic\
    \ static void main( String [ ] args ) throws Exception {\ntry {LocateRegistry.createRegistry(1099);}\
    \ catch (RemoteException e1) {\n    System.err.println(\"rmiregistry is already\
    \ ready\"); }\nServer serv = new Server ( )\nNaming.bind (\"Server\", serv) ;\n\
    }\n```\n\n执行结果：\n服务器端：就绪。\n客户端端：启动中。\nHello。\n\n## 4.2 RMI 中的垃圾回收\n\n- 困难：远程。\n\
    - 目标：防止引用丢失。在 RMI 中：通过以下机制管理：\n    - *引用计数*：对象的客户端数量。\n        - 每次传输 +1。\n  \
    \      - 每次结束 -1。\n    - *租约 (Lease)*：对对象的保留限制时间。\n        - 默认为 600000 毫秒（10\
    \ 分钟），可通过属性 `java.dgc.leaseValue` 修改。\n        - 程序时修改：`-Ddgc.leaseValue=20000`。\n\
    \n### 练习 1：线程的生命周期\n\n考虑以下代码：\n\n```java\nclass Parrot4 extends Thread{\n  private\
    \ String cri = null;\n  private int fois = 0;\n  public Parrot4 (String s, int\
    \ i) {\n    cri = s;\n    fois = i;\n  }\n  public void run() {\n    System.out.println(\"\
    Thread parrot:\" + Thread.currentThread().getName());\n    for (int n=0; n<fois;\
    \ n++) {\n      try { Thread.sleep(1000); }\n      catch(InterruptedException\
    \ e) { }\n      System.out.println(cri);\n    }\n  }\n}\n```\n\n```java\nclass\
    \ ChatAndLaunchParrot{\n  public static void main(String args[]) {\n    Parrot4\
    \ parrot = new Parrot4(\"coco\",5);\n    parrot.start();\n    System.out.println(\"\
    Thread chatty : \" + Thread.currentThread().getName());\n    for (int n=0; n<15;\
    \ n++) {\n      try { Thread.sleep(1000); }\n      catch(InterruptedException\
    \ e) { }\n      System.out.print(\"Thread parrot isAlive: \"+ parrot.isAlive()\
    \ + \"\\t\");\n      blabla();\n    }\n  }\n  private static void blabla() {\n\
    \    System.out.println(\"blabla\");\n  }\n}\n```\n\n问题：启动上述程序的执行。\n\n主线程的名称是什么？默认给另一个线程命什么名称？`isAlive()`\
    \ 方法的作用是什么？*提示*：类方法 `currentThread()` 返回 `Thread` 对象的指针并调用该方法。\n\n##### 练习 2：不同线程的属性\n\
    \n考虑以下两个类：\n\n"
