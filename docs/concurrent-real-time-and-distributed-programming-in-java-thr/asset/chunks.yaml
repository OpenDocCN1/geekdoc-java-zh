  trans: "\n\n```java\nimport java.rmi.*;\nimport java.rmi.server.*;\nimport java.rmi.registry.*;\n\
    public class HelloServer extends UnicastRemoteObject implements\nHello {\npublic\
    \ HelloServer() throws RemoteException {}\npublic int multi(int a, int b) throws\
    \ RemoteException {\nreturn a * b; }\npublic static void main(String[] args) {\n\
    \   try {\n   LocateRegistry.createRegistry(1099);\n  } catch (RemoteException\
    \ e1) {\n    System.err.println(\"rmiregistry is already launched on this port\"\
    );\n    System.exit(1);\n  }\n   try {\nHelloServer objet = new HelloServer();\n\
    Naming.rebind(\"badr\",object);\nSystem.out.println(\"Server ready\");\n}\ncatch(Exception\
    \ e) {\nSystem.err.println(\"Error: \" + e.getMessage());\n}\n}\n}\n```\n\n###\
    \ 关于 bind 和 rebind 的几点说明：\n\n以下代码是正确的：\n\n```java\nHelloServer object = new HelloServer();\n\
    Naming.rebind(\"badr\",object);\nNaming.rebind(\"badr1\",object);\n```\n\n可以为同一个对象属性多个名称：无论使用\
    \ `bind` 还是 `rebind` 均如此。\n\n以下代码产生异常：\n\n```java\nHelloServer object = new HelloServer();\n\
    HelloServer object1 = new HelloServer();\nNaming.bind(\"badr\",object);\nNaming.bind(\"\
    badr\",object1);\n```\n\n以下代码是正确的：\n\n```java\nHelloServer object = new HelloServer();\n\
    HelloServer object1 = new HelloServer();\nNaming.rebind(\"badr\",object);\nNaming.rebind(\"\
    badr\",object1);\n```\n\n它使用 `rebind` 时可以工作，因为它是重新保存；`badr` 只指向 `object1`。\n\n\
    ### 实现客户端：\n\n```java\nimport java.rmi.*;\npublic class HelloClient {\npublic\
    \ static void main(String[] args) {\ntry {\n  Hello reference = (Hello)Naming.lookup(\"\
    badr\");\n  int resultat = reference.multi(5,12);\n  System.out.println(\"The\
    \ multiplication is: \" + result); }\ncatch(Exception e) { System.err.println(\"\
    Error: \" + e.getMessage()); }\n}\n}\n```\n\n#### 执行结果：\n- 服务端：Server ready。\n\
    - 客户端：The multiplication is 60。\n\n以下类用于生成注册表：\n\n- `public final class LocateRegistry\
    \ extends Object`。\n- 用于在 `java.rmi.registry` 包中生成 `rmiregistry` 的类。\n- `createRegistry`\
    \ 方法：\n    - `static Registry createRegistry (int port)`：创建注册表。\n    - `LocateRegistry.createRegistry(1099)`：：在端口\
    \ 1099 上创建注册表。\n    - `createRegistry` 是一个返回 `Registry` 的静态方法。\n    - `public\
    \ interface Registry extends Remote`。\n    - 位于 `java.rmi.registry` 包中。\n    -\
    \ `LocateRegistry.createRegistry(1099)`：创建一个远程注册表 (`rmiregistry`)。\n- `getRegistry`\
    \ 方法：\n    - 返回一个指向远程注册表的引用。\n    - 各种签名：\n        - `static Registry getRegistry()`。\n\
    \        - `static Registry getRegistry(int port)`。\n        - `static Registry\
    \ getRegistry(String host)`。\n        - `static Registry getRegistry(String host,\
    \ int port)`。\n        - `static Registry getRegistry(String host, int port, RMIClientSocketFactory\
    \ csf)`。\n\n应用示例：\n\n```java\nString [ ] NamesSaved = LocateRegistry.getRegistry(\"\
    localhost\",\n1099).list();\n```\n`list()`：`Registry` 接口的方法，返回注册表中记录的名称列表。\n\n\
    ### 4.2.2.4 RMI 中的参数交换\n\n通过 Java RMI 交换的参数必须是：\n\n- 原生类型：`int`、`short`、`double`、`boolean`\
    \ ……， 还有 `String`。\n- `Serializable` 对象。\n- `Remote` 对象。\n\n原生类型按值（拷贝）传输。\n`Serializable`\
    \ 对象被序列化、传输，然后被反序列化（按值传输）。\n`Remote` 对象以远程引用的形式传输。\n\n#### 原生类型：\n\n以下代码代表服务端上\
    \ `multi` 方法的实现：\n\n```java\npublic int multi (int a, int b) throws RemoteException\
    \ {\n    return a * b;\n}\n```\n\n客户端上的方法调用如下：\n\n```java\ntry {\n  Hello reference\
    \ = (Hello)Naming.lookup(\"badr\");\n  int result = reference.multi(5,12);\n \
    \ System.out.println(\"The multiplication is: \" + result);\n}catch(Exception\
    \ e) { System.err.println(\"Error: \" + e.getMessage()); }\n```\n\n在前面的例中，调用是按值执行的。\n\
    \n#### 传输 Serializable 对象：\n\n示例：我们希望使用一个数据服务器来存储一组 2D 坐标，用以描述平面上某数量车辆的位置。\n\n\
    该服务器必须包含以下功能：\n\n- 创建一个新位置并为其分配一个名称。\n- 对位置的读取访问。\n- 对位置数量的访问。\n- 服务器必须实现一个 `hashtable`。\n\
    - 在 `java` 中，`Hashtable` 类是 `java.util` 中的类。\n\n图 4.12 `rmiregistry`。在我们的案例中：\n\
    - 键是位置名称。\n- 值是 2D 坐标。\n- `Serializable` 类必须实现。\n\n```java\nimport java.io.Serializable;\n\
    public class Point implements Serializable {\n  public float x;\n  public float\
    \ y;\n  public Point(float xx,float yy) {\n    x = xx;\n    y = yy;\n  }\n  public\
    \ String toString() {\n  return(\"+x+\", \"+y+\") ;\n  }\n}\n```\n\n服务端的实现：\n\n\
    ```java\nimport java.rmi.*;\nimport java.rmi.server.*;\nimport java.rmi.registry.*;\n\
    import java.util.Hashtable;\n\npublic class Serveur extends UnicastRemoteObject\
    \ implements Position {\n  private Hashtable h;\n  public Serveur() throws RemoteException\
    \ {\n    h = new Hashtable();\n  }\n  public void insererTable(Point p, String\
    \ nom) throws RemoteException {\n    h.put(nom,p);\n  }\n  public Point position(String\
    \ nom) throws RemoteException {\n    return (Point) h.get(nom);\n  }\n  public\
    \ int nombreles() throws RemoteException {\n    return h.size();\n  }\n  public\
    \ static void main(String[] args) {\n    try {\n      LocateRegistry.createRegistry(1099);\n\
    \    } catch (RemoteException e1) {\n      System.err.println(\"rmiregistry is\
    \ already launched on this port\");\n      System.exit(1);\n    }\n    try {\n\
    \      Serveur ib = new Serveur();\n      Naming.rebind(\"Data\",ib);\n      System.out.println(\"\
    Ready\");\n    } catch (Exception e) {\n      System.err.println(\"Error: \" +\
    \ e.getMessage());\n    }\n  }\n}\n```\n\n`Position` 接口：\n\n```java\nimport java.rmi.*;\n\
    public interface Position extends Remote {\n  void insererTable(Point p, String\
    \ nom) throws RemoteException;\n  Point position(String nom) throws RemoteException;\n\
    \  int nombreles() throws RemoteException;\n}\n```\n\n客户端的实现：\n\n```java\nimport\
    \ java.rmi.*;\npublic class Client {\n  public static void main(String[] args)\
    \ {\n    try {\n      Position b =(Position) Naming.lookup(\"Data\");\n      System.out.println(b.nombreles());\n\
    \      b.insererTable(new Point(11,5),\"P0\");\n      b.insererTable(new Point(14,9),\"\
    P1\");\n      System.out.println(b.nombreles());\n      System.out.println(b.position(\"\
    P0\"));\n      System.out.println(b.position(\"P1\"));\n    } catch (Exception\
    \ e) {\n      System.out.println(e) ;\n    }\n  }\n}\n```\n"
- fmt: "\nThe problem occurs for the `Point` type object transmission which must be\
    \ `Serializable`.\n\n### Transmitting Remote objects: RMI multi-thread servers\
    \ (chatrooms)\n\n- Each client is a thread and has three possible actions: join,\
    \ talk or leave.\n- The server must now maintain a list of distributed objects\
    \ (`Remote`).\n- Use `synchronized` to guarantee coherence across the data.\n\
    - The client’s actions must be displayed to other clients.\n- Thread implemented\
    \ using `Jframe` (Swing)\n\n#### First client:\n![images](images/f0111-01.jpg)\n\
    \n#### Second client:\n![images](images/f0111-02.jpg)\n\n#### Third client:\n\
    ![images](images/f0112-01.jpg)\n\nWhen the third client disconnects, the first\
    \ client should see this:\n![images](images/f0112-02.jpg)\n\nThe second client\
    \ will be as follows:\n![images](images/f0113-01.jpg)\n\n```java\nimport java.rmi.*;\n\
    public interface ChatInterface extends Remote {\n  public void rejoindre (Notify\
    \ n) throws RemoteException;\n  public void parler (Notify n, String s) throws\
    \ RemoteException;\n  public void laisser (Notify n) throws RemoteException;\n\
    }\nimport java.rmi.*;\npublic interface Notify extends Remote { // Notify refers\
    \ to a client\n  public String getName() throws RemoteException;\n  public void\
    \ setName(String s) throws RemoteException;\n  public void joinMessage (String\
    \ name) throws RemoteException;\n  public void sendMessage (String name, String\
    \ message) throws RemoteException;\n  public void exitMessage (String name) throws\
    \ RemoteException;\n} // name is the name of the client.\n```\n\n#### On the server\
    \ side:\n\n```java\npublic class Serveur extends UnicastRemoteObject implements\
    \ ChatInterface { \nprivate Collection<Notify> threadList = new ArrayList<Notify>();\n\
    \  public Serveur() throws RemoteException {}\npublic synchronized void join (Notify\
    \ n) throws RemoteException {\nthreadList.add(n);\n// browse the list\nfor (Iterator\
    \ i = threadList.iterator();i.hasNext(); ) {\nNotify client = (Notify)i.next();\
    \ // retrieve element in the list\nclient.joinMessage(n.getName());\n        \
    \       }\n  }\n…\n…\n```\n\n`Collection` is an interface implemented by `ArrayList`.\n\
    \n`iterator()` is a `Collection` method that returns an `Iterator` on the table\
    \ (`Iterator` is an interface to designate an iterator on the table). `hasNext()`\
    \ and `next()` are methods of the `Iterator`.\n\nPart of the class that implements\
    \ `Notify`:\n![images](images/f0114-01.jpg)\n\n#### 4.2.2.5 Security management\
    \ in RMI\n\nSecurity is important when code is downloaded (it can be risky to\
    \ execute code from a remote server). Being able to transmit executable code remotely\
    \ is, in theory, a security flaw. When transmitting code locally, there is no\
    \ security issue.\n\n- **Solution:**\n  - Implement a “security manager”.\n- **General\
    \ solution in Java:**\n  - Use `java.lang.SecurityManager` (extends `Object`).\n\
    \  - This allows the specification of permissions to access files, etc.\n- **Specific\
    \ solution for RMI:**\n  - Use `java.rmi.RMISecurityManager`.\n  - `public class\
    \ RMISecurityManager extends SecurityManager`.\n\nWith RMI, there are two ways\
    \ to manage security:\n\n- Use a sub-class of `SecurityManager` instead of `RMISecurityManager`.\n\
    ```java\npublic class SecurityManagerOu extends SecurityManager{\npublic void\
    \ checkPermission(Permission perm) { }\n```\n- Use `RMISecurityManager` in conjunction\
    \ with (from Java 2) a file describing permissions: `java.policy`. The file `java.policy`\
    \ defines the security policy in order to specify authorized actions.\nIn `C:\\\
    Program Files (x86)\\Java\\jdk1.8.0_25\\jre\\lib\\security`.\n\nExample of content\
    \ in `java.policy`:\n```java\ngrant {\npermission java.security.AllPermission;\n\
    };\n```\nIt allows all method calls (no security policy).\n\n```java\ngrant {\n\
    permission java.net.SocketPermission \"*:1024-6535\", \"connect,accept\";\npermission\
    \ java.net.SocketPermission \"*:80\", \"connect\";\npermission java.io.FilePermission\
    \ \"C:\\\\temp\\\\m2d.txt\", \"read\";\npermission java.io.FilePermission \"C:\\\
    \\temp\\\\test.exe \", \"read, write,delete,execute\";\n};\n```\nIt allows socket\
    \ connections on ports 1024 to 6535 for all RMI clients and connections to the\
    \ default Webserver (port 80) on all machines. It also defines access rights in\
    \ relation to files.\n\nTo install a security manager, execute the following code:\
    \ `System.setSecurityManager(new SecurityManager())`.\n\nExample:\n```java\npublic\
    \ static void main (String args[]) { // server\nSystem.setSecurityManager (new\
    \ SecurityManager ()) ;\ntry {\nLocateRegistry.createRegistry(1099);\n} catch\
    \ (RemoteException e) {\nSystem.err.println(\"rmiregistry is already launched\
    \ on this port\");\nSystem.exit(1);\n}\n```\n\nTo use `java.policy`:\n```bash\n\
    $ javac Server.java\n$ java -Djava.security.policy=java.policy Server\n```\n\n\
    We can also use RMI with TLS:\n\n- Transport Layer Security (`TLS`), previously\
    \ known as Secure Sockets Layer (`SSL`), is a security protocol for exchanges\
    \ over the Internet.\n- Since J2SE 5.0 (2004), it is possible to use `TLS` with\
    \ RMI.\n- `TLS` acts as an additional layer that ensures data-security, located\
    \ between the application layer and the transport layer.\n\n**Objective:**\n-\
    \ Server authentication.\n- Optionally, client authentication.\n- Data confidentiality\
    \ (or encrypted session).\n- Integrity of exchanged data.\n- The `JSSE` API (Java\
    \ Secure Socket Extension) makes it possible to manipulate secure sockets in Java\
    \ responding to `SSL` specifications.\n- The `JSSE` classes and interfaces are\
    \ grouped into packages `javax.net` and `javax.net.ssl`.\n\n![image](images/fig4-13.jpg)\n\
    Figure 4.13. RMI with TLS. For a color version of the figure, see www.iste.co.uk/benmammar/java.zip\n\
    \n#### 4.2.2.6 Dynamic class loading\n\n- Java classes are hosted on a Web server.\n\
    - This avoids holding all class definitions locally.\n- The same class files are\
    \ shared by all clients.\n- Only classes that are needed are loaded.\n- In this\
    \ case, we can turn towards dynamic loading:\n  - Place the java class (stub,\
    \ for example) in a Web server that is accessible by the client. For example:\
    \ `http://monserveur.fr/test`.\n  - Implement a `SecurityManager`:\n    - Add\
    \ the following line in the client and the server: `System.setSecurityManager(new\
    \ SecurityManager())`.\n    - Execute the following on the server: `java -Djava.security.policy=java.policy\
    \ Server`.\n    - Execute the client by supplying the dynamic class loading URL:\n\
    \      `java -Djava.rmi.server.codebase=http://myserver.fr/test/ -Djava.security.policy=java.policy\
    \ Client`\n\nThe stub on the server side is as follows:\n```java\nimport java.rmi.Naming;\n\
    public class HelloClient {\n  public HelloClient() {\n    try {\n      Hello obj\
    \ = (Hello)Naming.lookup(\"Hello\");\n      System.out.println(obj.Bonjour());\n\
    \    } catch (Exception e) {\n      System.out.println(\"HelloClient exception:\
    \ \" + e);\n    }\n  }\n}\n```\n`HelloClient.java` is a class shared between various\
    \ RMI clients.\n\nThe following code represents an RMI client using dynamic loading:\n\
    ```java\nimport java.rmi.server.RMIClassLoader;\nimport java.util.Properties;\n\
    public class DynamicClient {\n  public DynamicClient() throws Exception {\n  \
    \  // Install a security manager (without this manager, loading is unauthorized)\n\
    \    System.setSecurityManager(new SecurityManager());\n    Properties p = System.getProperties();\n\
    \    // Indicate the download path\n    String url = p.getProperty(\"java.rmi.server.codebase\"\
    );\n    // Download desired class\n    Class clientClass = RMIClassLoader.loadClass(url,\
    \ \"HelloClient\");\n    // Create an instance of class\n    clientClass.newInstance();\n\
    \  }\n  public static void main (String args[]) {\n    try {\n      DynamicClient\
    \ dc = new DynamicClient();\n    } catch (Exception e) {\n      System.out.println(e);\n\
    \    }\n  }\n}\n```\n\n#### 4.2.2.7 Asynchronicity in RMI: callback methods\n\n\
    In RMI, the client calls a method located on the server side.\n\n*Requirement:*\
    \ during execution, the server can launch processes on the client side.\n\nPerform\
    \ a call from the server towards the clients.\n"
