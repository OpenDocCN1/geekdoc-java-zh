    The following diagram illustrates three threads that are in mutual exclusion in
    relation to a single object.


    The third thread will execute the critical section if it is freed by the central
    thread.


    ![image](images/fig2-1.jpg)


    **Figure 2.1.** *Critical section shared between three threads. For a color version
    of the figure, see [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)*


    ![image](images/fig2-2.jpg)


    **Figure 2.2.** *Critical section shared between three threads. For a color version
    of the figure, see [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)*


    synchronized(object) means that the block is in mutual exclusion relative to a
    *monitor* of this object (*objet*): the threads that are synchronized around the
    same object are in mutual exclusion.


    The left and center threads have a critical section, the thread on the right has
    a critical section, but not with the two other threads.


    The monitor “plays” the role of supervisor, ensuring that only one thread at a
    time can execute the critical section supervised by it: it is a locking mechanism.


    The “monitor” mechanism of an object applies to all instances of Object: it is
    therefore a mechanism implemented within the heart of Java.


    The thread that executes an object’s “synchronized” becomes the owner of this
    object’s monitor.


    Thread.sleep does not remove ownership of a monitor, not even temporarily.


