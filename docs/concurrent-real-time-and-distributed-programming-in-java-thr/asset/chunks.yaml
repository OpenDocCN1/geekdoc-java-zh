    \ wants to eat\nPhilo3 wants to eat\nPhilo1 wants to eat\nPhilo1 is eating\nPhilo2\
    \ wants to eat\nPhilo4 has finished eating\nPhilo3 is eating\nPhilo4 is thinking\n\
    Philo1 has finished eating\nPhilo1 is thinking\nPhilo0 is eating\nPhilo4 wants\
    \ to eat\nPhilo1 wants to eat\nPhilo3 has finished eating\nPhilo3 is thinking\n\
    Philo2 is eating\nPhilo0 has finished eating\nPhilo0 is thinking\nPhilo4 is eating\n\
    …\n```\n\n* – 在测试期间，确保没有两个相邻的哲学家同时在吃饭，并且没有饥饿现象，当然，还要确保没有相互阻塞现象。\n\n### 练习 14：生产者/消费者\n\
    \n考虑以下三个 Java 类：`B.java`、`Producer.java` 和 `Consumer.java`。\n\n`Producer` 和 `Consumer`\
    \ 共享一个类型为 `B` 的对象 `b`。\n\n```java\nclass B {\nprivate Object [ ] buffer;\nprivate\
    \ int taille ;\nprivate int prem, der, nbObj;\npublic B (int t) {\ntaille = t;\n\
    buffer = new Object [taille];\nprem = 0;\nder = 0;\nnbObj = 0;\n}\npublic synchronized\
    \ void depose (Object obj) {\nwhile (cond1) try {wait ();}catch ( InterruptedException\
    \ e) {}\nbuffer [der] = obj;\nder = (der + 1) % size;\nnbObj = nbObj + 1;\nnotify\
    \ ();\n}\npublic synchronized Object collected () {\nwhile (cond2) try {wait ();}catch\
    \ ( InterruptedException e) {}\nObject obj = buffer [prem];\nbuffer [prem] = null;\n\
    prem = (prem + 1) % size;\nnbObj = nbObj - 1;\nnotify ();\nreturn (obj);\n}\n\
    } // end B\n\nclass Producer implements Runnable {\nprivate B b;\nprivate int\
    \ val;\npublic Producer (B b) {this.b = b;}\npublic void run () {\nwhile (true)\
    \ {\nb.putsdown (new Integer (val));\nSystem.out.println (Thread.currentThread\
    \ ().getName () +\"has put down\" +\nval);\nval ++;\ntry {Thread.sleep ((int)(\
    \ Math.random ()*100));}catch ( Interrupted\nException e) {}\n}\n}}// end run\n\
    }//endProducer\n\nclass Consumer implements Runnable {\nprivate B b;\npublic Consumer\
    \ (B b) {this.b = b;}\npublic void run () {\nInteger val;\nwhile (true) {\nval\
    \ = (Integer) b.preleve();\nSystem.out.println ( Thread.currentThread ().getName\
    \ () +\"collected\" + val );\ntry {Thread.sleep ((int)( Math.random ()*300));}catch\
    \ ( InterruptedException Exception e) {}\n}\n}// end run\n}// end Consumer\n```\n\
