  trans: "\n\n![images](img/f0041-01.jpg)\n\n执行结果如下图所示。\n\n`Plus1` 是一个使用互斥的方法，它为每个拥有该方法锁的线程将\
    \ `val` 增加一个单位。\n\n![images](img/f0042-01.jpg)\n\n*   – 在 Java 中，每个对象都拥有一个监视器（monitor），它可以保护临界区域。它确保只有一个线程线程可以执行由监视器保护的临界区域，\n\
    *   – `synchronized (object) { instr }` 与对象关联监视器。\n*   – `synchronized void Method(){…}`\
    \ 与方法关联监视器。\n*   – 在执行同步块时，该对象会被锁定。\n*   – 在 Java 中，每个对象还拥有一个等待队列。\n\n![images](img/f0043-01.jpg)\n\
    \n## 2.7 共享变量：类变量\n\n在接下来的章节中，我们将展示一个线程协作的示例（老师与学生）。我们有一位老师正在教学生新单词。\n\n学生必须重复每个单词三次，甚至更多。\n\
    \n![image](img/fig2-3.jpg)\n\n**图 2.3.** 消费者/生产者示例。该图的彩色版本，请访问 [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
    \n该示例的简单代码如下：\n\n![images](img/f0044-01.jpg)\n\n执行：\n\nnouveau mot pour perroquet\
    \ ? (sinon non)\n\nbla\n\nnouveau mot pour perroquet? (sinon non)\n\ncoco bla\n\
    \ncoco bla\n\ncoco bla\n\njaco bla\n\njaco bla\n\njaco bla\n\nblu\n\nnouveau mot\
    \ pour perroquet ? (sinon non)\n\ncoco blu\n\ncoco blu\n\ncoco blu\n\nblo\n\n\
    coco blu\n\ncoco blu\n\ncoco blu\n\ncoco blu\n\ncoco blu\n\ncoco blu\n\nnouveau\
    \ mot pour perroquet ? (sinon non)\n\njaco blo\n\njaco blo\n\njaco blo\n\njaco\
    \ blo\n\njaco blo\n\n…..\n\n一个静态变量 `mot`（称为类变量）被两个鹦鹉线程共享，它们必须学习它然后重复它。之后，主线程进入另一个单词（`mot`）。\n\
    \n起初，他们必须通过循环等待第一个单词，如果教授提供新单词太快，两只鹦鹉可能会“跳过”一些！\n\n目标：避免教授和鹦鹉学生之间存在等待机制：学生等待新单词（*nouveau\
    \ mot*）来学习，教授在教单词时，必须等待学生有时间学习并重复它，然后再教下一个新单词。\n\n## 2.8 线程间的同步\n\n### 2.8.1 Wait\
    \ 和 notifyAll\n\n在接下来的代码中，我们创建了一个名为 `attheboard` 的对象，供生产者和消费者共享。该对象必须有两个方法：第一个由消费者使用（`learn`），第二个由生产者使用（`teach`）。\n\
    \n![images](img/f0046-01.jpg)\n\n执行：\n\nnouveau mot pour perroquet ? (sinon non)\n\
    \nmaster\n\nnouveau mot pour perroquet ? (sinon non)\n\ncoco master\n\ncoco master\n\
    \ncoco master\n\njaco master\n\njaco master\n\njaco master\n\nRSD\n\ncoco RSD\n\
    \ncoco RSD\n\ncoco RSD\n\njaco RSD\n\njaco RSD\n\njaco RSD\n\nnouveau mot pour\
    \ perroquet ? (sinon non)\n\nno\n\n*   – `wait` 和 `notifyAll` 方法定义在 `java.lang.Object`\
    \ 类中，因此被所有类继承（包括 `notify`）。\n*   – `wait` 方法暂停（阻塞）线程的执行，直到满足某个条件。条件的满足通过另一个线程使用\
    \ `notify` 或 `notifyAll` 方法来信号。\n*   – 当使用 `synchronized` 方法调用 `wait` 方法时，在执行暂停的同时，调用该方法的对象的锁会被释放。一旦条件出现，线程将等待获取锁并继续执行。\n\
    *   – 注意这里 `sleep` 和 `wait` 之间的区别：\n    *   `sleep` 阻塞执行但线程保持锁（结束其执行）；\n    *\
    \   `wait` 阻塞执行但释放锁（另一个线程可以执行临界区域）。\n\n### 2.8.2 Wait 和 notify\n\n在接下来的代码中，与之前相比，我们将\
    \ `notifyAll` 替换为了 `notify`：\n\n![images](img/f0048-01.jpg)\n\n执行：\n\ncoco bonjour\n\
    \ncoco bonjour\n\ncoco bonjour\n\nRSD\n\ncoco RSD\n\ncoco RSD\n\ncoco RSD\n\n\
    nouveau mot pour perroquet ? (sinon non)\n\nencore\n\njaco encore\n\njaco encore\n\
    \nnouveau mot pour perroquet ? (sinon non)\n\nbizarre\n\ncoco bizarre\n\ncoco\
    \ bizarre\n\nnouveau mot pour perroquet ? (sinon non)\n\n`notify` 释放一个等待线程。`notify()`\
    \ 每次唤醒一个线程（不是基于 FIFO 机制）。\n\n第二个生产者消费者示例所示。它展示了用户在车站等待巴士；巴士到达并将用户装上车。\n\n![images](img/f0050-01.jpg)\n\
    \n```\nclass BusSimple {\n    public static void main(String args[]) {\n     \
    \   Station BusStation = new Station();\n        Usager[] u = {new Usager(\"A\"\
    , BusStation), new Usager(\"B\", BusStation),\n                      new Usager(\"\
    C\", BusStation), new Usager(\"D\", BusStation),\n                      new Usager(\"\
    E\", BusStation)};\n        Bus b = new Bus(BusStation);\n        b.start();\n\
    \        for (int i = 0; i < u.length; i++) {\n            u[i].start();\n   \
    \     }\n    }\n}\n\nclass Station {\n    private int count = 0;\n    public synchronized\
    \ void charger(String name) {\n        while (count == 5) wait();\n        count++;\n\
    \        System.out.println(name + \" arrives\");\n        notifyAll();\n    }\n\
    \    public synchronized void attendre() {\n        while (count == 0) wait();\n\
    \        count--;\n        System.out.println(\"Bus departs\");\n        notifyAll();\n\
    \    }\n}\n\nclass Usager extends Thread {\n    private String name;\n    private\
    \ Station station;\n    public Usager(String name, Station station) {\n      \
    \  this.name = name;\n        this.station = station;\n    }\n    public void\
    \ run() {\n        for (int i = 0; i < 3; i++) {\n            station.charger(name);\n\
    \            try { sleep(1000); } catch (InterruptedException e) {}\n        }\n\
    \    }\n}\n\nclass Bus extends Thread {\n    private Station station;\n    public\
    \ Bus(Station station) {\n        this.station = station;\n    }\n    public void\
    \ run() {\n        while (true) {\n            station.attendre();\n         \
    \   try { sleep(2000); } catch (InterruptedException e) {}\n        }\n    }\n\
    }\n```\n\n共享对象是 `BusStation`；它包含两个方法。一个由生产者使用（`charger`），另一个由消费者使用（`attendre`）。\n\
    \n执行：\n\nC arrives\nE arrives\nA arrives\nD arrives\nBus departs\nC arrives\n\
    E arrives\nA arrives\nD arrives\nBus departs\nC arrives\nE arrives\nA arrives\n\
    D arrives\nBus departs\nC arrives\nE arrives\nA arrives\nD arrives\nBus departs\n\
    C arrives\nE arrives\nA arrives...\n\n## 2.9 经典的生产者-消费者模式\n\n我们将讨论单生产者单消费者情况下的经典模式。\n\
    \n这里使用的示例是教授教学生。学生必须重复每个单词三次。\n\n![image](img/fig2-4.jpg)\n\n**图 2.4.** 消费者/生产者模式。该图的彩色版本，请访问\
    \ [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
    \n该示例的代码如下：\n\n![images](img/f0052-01.jpg)\n\n执行：\n\nnouveau mot pour perroquet\
    \ ?\n\nSpeak\n\nnouveau mot pour perroquet ?\n\ncoco Speak\n\ncoco Speak\n\ncoco\
