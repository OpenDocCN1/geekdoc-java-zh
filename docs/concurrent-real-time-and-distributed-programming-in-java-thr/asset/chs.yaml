  \n```java\nimport java.rmi.*;\npublic interface ChatInterface extends Remote {\n\
  \  public void rejoindre (Notify n) throws RemoteException;\n  public void parler\
  \ (Notify n, String s) throws RemoteException;\n  public void laisser (Notify n)\
  \ throws RemoteException;\n}\nimport java.rmi.*;\npublic interface Notify extends\
  \ Remote { // Notify 指向客户端\n  public String getName() throws RemoteException;\n\
  \  public void setName(String s) throws RemoteException;\n  public void joinMessage\
  \ (String name) throws RemoteException;\n  public void sendMessage (String name,\
  \ String message) throws RemoteException;\n  public void exitMessage (String name)\
  \ throws RemoteException;\n} // name 是客户端的名字。\n```\n\n#### 服务器端：\n\n```java\npublic\
  \ class Serveur extends UnicastRemoteObject implements ChatInterface { \nprivate\
  \ Collection<Notify> threadList = new ArrayList<Notify>();\n  public Serveur() throws\
  \ RemoteException {}\npublic synchronized void join (Notify n) throws RemoteException\
  \ {\nthreadList.add(n);\n// 遍历列表\nfor (Iterator i = threadList.iterator();i.hasNext();\
  \ ) {\nNotify client = (Notify)i.next(); // 从列表中获取元素\nclient.joinMessage(n.getName());\n\
  \               }\n  }\n…\n…\n```\n\n`Collection` 是由 `ArrayList` 实现的接口。\n\n`iterator()`\
  \ 是 `Collection` 的一个方法，返回表上的 `Iterator`（`Iterator` 是一个用于指定表上迭代器的接口）。`hasNext()`\
  \ 和 `next()` 是 `Iterator` 的方法。\n\n实现 `Notify` 的类部分：\n![images](img/f0114-01.jpg)\n\
  \n### 4.2.2.5 RMI 中的安全管理\n\n在下载代码时，安全性非常重要（执行来自远程服务器的代码可能是危险的）。能够从远程传输可执行代码在理论上是一个安全漏洞。在本地传输代码时，没有安全问题。\n\
  \n- **解决方案：**\n  - 实现一个“安全管理器”（security manager）。\n- **Java 中的通用解决方案：**\n  - 使用\
  \ `java.lang.SecurityManager`（自 `Object`）。\n  - 这允许指定访问文件等权限。\n- **针对 RMI 的特定解决方案：**\n\
  \  - 使用 `java.rmi.RMISecurityManager`。\n  - `public class RMISecurityManager extends\
  \ SecurityManager`。\n\n使用 RMI，有两种管理安全性的方法：\n\n- 使用 `SecurityManager` 的子类代替 `RMISecurityManager`。\n\
  ```java\npublic class SecurityManagerOu extends SecurityManager{\npublic void checkPermission(Permission\
  \ perm) { }\n```\n- 将 `RMISecurityManager` 结合（从 Java 2 开始）描述权限的文件：`java.policy`。`java.policy`\
  \ 文件定义了安全策略以指定授权的操作。\n路径位于 `C:\\Program Files (x86)\\Java\\jdk1.8.0_25\\jre\\lib\\\
  security`。\n\n`java.policy` 的内容示例：\n```java\ngrant {\npermission java.security.AllPermission;\n\
  };\n```\n它允许所有方法调用（无安全策略）。\n\n```java\ngrant {\npermission java.net.SocketPermission\
  \ \"*:1024-6535\", \"connect,accept\";\npermission java.net.SocketPermission \"\
  *:80\", \"connect\";\npermission java.io.FilePermission \"C:\\\\temp\\\\m2d.txt\"\
  , \"read\";\npermission java.io.FilePermission \"C:\\\\temp\\\\test.exe \", \"read,\
  \ write,delete,execute\";\n};\n```\n它允许所有 RMI 客户端在 1024 到 6535 端口建立套接连接，并连接到所有机器上的默认服务器（80\
  \ 端口）。它还定义了与文件相关的权限。\n\n要安装安全管理器，执行以下代码：`System.setSecurityManager(new SecurityManager())`。\n\
  \n示例：\n```java\npublic static void main (String args[]) { // 服务器\nSystem.setSecurityManager\
  \ (new SecurityManager ()) ;\ntry {\nLocateRegistry.createRegistry(1099);\n} catch\
  \ (RemoteException e) {\nSystem.err.println(\"rmiregistry is already launched on\
  \ this port\");\nSystem.exit(1);\n}\n```\n\n使用 `java.policy`：\n```bash\n$ javac\
  \ Server.java\n$ java -Djava.security.policy=java.policy Server\n```\n\n我们也可以在 TLS\
  \ 下使用 RMI：\n\n- 传输层安全（`TLS`），以前称为安全套接层（`SSL`），是一种安全协议。能够远程传输可执行代码在理论上是一个安全漏洞。在本地传输代码时，没有安全问题。\n\
  **目标：**\n- 客户端身份验证。\n- 可选的身份验证。\n- 数据的机密性。\n- 数据的完整性。\n- 数据的会话。\n- 数据的授权。\n- 数据的传输层。\n\
  - TLS 传输。\n- 自 Java 5.0 以后。\n- 数据的加密版本。\n- JSSE 扩展。\n- JSSE API。\n- JSSE 类分组。\n\n\
  ![image](img/fig-13)\n图 13. 带 TLS 的 RMI。\n- TLS 传输。\n- 传输层。\n\n\n\n\n\n# 目标：增加动态性。\n\
  \n在这种情况下，每个元素（客户端或服务器）都可以不区别地胜任两种角色（同时作为客户端和服务器）。\n\n服务器对客户端的调用被称为回调（callbacks）。\n\
  \n- 由于服务器并不知道此类方法的实现方式，且由于其执行时间可能很长，因此回调通常被实现为异步操作。\n- 服务器避免了通过同步调用对其他客户端造成惩罚。\n\
  - 同步调用 → 阻塞执行以等待结果。\n- 回调是一种机制，允许在 RMI 中引入异步性，而 RMI 的调用在本质上是同步且阻塞的。\n- 异步方法始终是 `void`\
  \ 类型（不返回结果）。\n- 发调用的程序不需要立即获得结果；否则，它将被阻塞。\n- 在 Java 中，方法通常都是同步的，但线程的 `start()` 方法除外。\n\
  - `start()` 不阻塞调用线程。\n- 客户端将回调对象（远程对象）作为参数传递给服务器。\n- 客户端留出其坐标以便后续进行回调。\n- 第一个接口：`ServerInterface`（服务器端实现）。\n\
  - 服务器在对象上执行异步调用。\n- 必须由一个线程执行回调。\n- 第二个接口：`InterfaceCallback`（客户端端实现）。\n\n![image](img/fig4-14.jpg)\n\
  \n**图 4.14.** RMI 中的回调。如需图片的彩色版本，请访问 [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
  \n为了执行回调，我们需要以下六个类：\n\n![image](img/fig4-15.jpg)\n\n**图 4.15.** 回调所需的类。如需该彩色彩色版本，请访问\
  \ [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
  \n`InterfaceCalback.java`：包含回调方法的接口。该接口由 `Callback.java` 实现。\n\n该接口的示例如下：\n\n```java\n\
  import java.rmi.Remote ;\nimport java.rmi.RemoteException ;\npublic interface InterfaceCallback\
  \ extends Remote {\n  public void doCallback () throws RemoteException ;\n}\n```\n\
  \n在客户端实现的是该回调方法的接口。\n\n`Callback.java`：实现回调方法的类。该类仅在客户端可用，用于实现回调方法。\n\n```java\n\
  import java.rmi.RemoteException ;\nimport java.rmi.server.UnicastRemoteObject ;\n\
  public class Callback extends UnicastRemoteObject implements\nInterfaceCallback\
  \ {\npublic Callback ( ) throws RemoteException {}\npublic void doCallback () throws\
  \ RemoteException {\n  System.out.println (\"Bonjour tous le monde\") ;\n}\n}\n\
  ```\n\n`Servant.java`：启动回调方法的线程。\n\n```java\nimport java.rmi.*;\npublic class Servant\
  \ extends Thread {\nprivate InterfaceCallback obj ;\npublic Servant (InterfaceCallback\
  \ obj) {\nthis.obj = obj ;\n}\npublic void run ( ) { // 在独立线程中执行\ntry {Thread.sleep\
  \ (3000) ; } catch ( InterruptedException e ) { }\ntry {obj.doCallback () ; // 执行回调，调用客户端的方法\n\
  }\ncatch (RemoteException e ) {\n  System.err.println (\"Return call failed: \"\
  \ + e ) ;\n}\n}\n}\n```\n\n`InterfaceServer.java`：包含服务器用于回调客户端方法的接口，该方法的参数是需要被回调的对象。此接口由\
  \ `Server.java` 实现。\n\n```java\nimport java.rmi.Remote;\nimport java.rmi.RemoteException;\n\
  public interface InterfaceServeur extends Remote {\n  public void callMeBack (InterfaceCallback\
  \ obj) throws RemoteException\n;\n}\n```\n\n`callMeBack` 方法由客户端使用。\n\n`Client.java`：创建对象并将其传递给服务器（调用服务器端实现的\
  \ `InterfaceServer` 方法）。\n\n实现一个可被回调的经典 RMI：\n\n```java\nimport java.rmi.Naming\
  \ ;\npublic class Client {\npublic static void main( String [ ] args ) throws Exception\
  \ {\nCallback obj = new Callback ( ) ; // 创建回调对象\nInterfaceServeur serv= (InterfaceServeur)\
  \ Naming.lookup (\"Server\");\nSystem.out.println (\"Starting call\");\nserv.callMeBack\
  \ (obj) ; // 调用请求\n}\n}\n```\n\n`Server.java`：实现回调客户端的方法，通过传递上一个线程接收到的对象来实现。\n\n\
  ```java\nimport java.rmi.Naming;\nimport java.rmi.RemoteException;\nimport java.rmi.registry.LocateRegistry;\n\
  import java.rmi.server.UnicastRemoteObject;\npublic class Server extends UnicastRemoteObject\
  \ implements\nInterfaceServer {\npublic Server ( ) throws RemoteException { }\n\
  public void callMeBack (InterfaceCallback obj) throws RemoteException {\nServant\
  \ servant = new Servant (obj) ; // 创建线程\nservant.start ( ) ; // 初始化线程\n}\npublic\
  \ static void main( String [ ] args ) throws Exception {\ntry {LocateRegistry.createRegistry(1099);}\
  \ catch (RemoteException e1) {\n    System.err.println(\"rmiregistry is already\
  \ ready\"); }\nServer serv = new Server ( )\nNaming.bind (\"Server\", serv) ;\n\
  }\n```\n\n执行结果：\n服务器端：就绪。\n客户端端：启动中。\nHello。\n\n## 4.2 RMI 中的垃圾回收\n\n- 困难：远程。\n\
  - 目标：防止引用丢失。在 RMI 中：通过以下机制管理：\n    - *引用计数*：对象的客户端数量。\n        - 每次传输 +1。\n    \
  \    - 每次结束 -1。\n    - *租约 (Lease)*：对对象的保留限制时间。\n        - 默认为 600000 毫秒（10 分钟），可通过属性\
  \ `java.dgc.leaseValue` 修改。\n        - 程序时修改：`-Ddgc.leaseValue=20000`。\n\n### 练习\
  \ 1：线程的生命周期\n\n考虑以下代码：\n\n```java\nclass Parrot4 extends Thread{\n  private String\
  \ cri = null;\n  private int fois = 0;\n  public Parrot4 (String s, int i) {\n \
  \   cri = s;\n    fois = i;\n  }\n  public void run() {\n    System.out.println(\"\
  Thread parrot:\" + Thread.currentThread().getName());\n    for (int n=0; n<fois;\
  \ n++) {\n      try { Thread.sleep(1000); }\n      catch(InterruptedException e)\
  \ { }\n      System.out.println(cri);\n    }\n  }\n}\n```\n\n```java\nclass ChatAndLaunchParrot{\n\
  \  public static void main(String args[]) {\n    Parrot4 parrot = new Parrot4(\"\
  coco\",5);\n    parrot.start();\n    System.out.println(\"Thread chatty : \" + Thread.currentThread().getName());\n\
  \    for (int n=0; n<15; n++) {\n      try { Thread.sleep(1000); }\n      catch(InterruptedException\
  \ e) { }\n      System.out.print(\"Thread parrot isAlive: \"+ parrot.isAlive() +\
  \ \"\\t\");\n      blabla();\n    }\n  }\n  private static void blabla() {\n   \
  \ System.out.println(\"blabla\");\n  }\n}\n```\n\n问题：启动上述程序的执行。\n\n主线程的名称是什么？默认给另一个线程命什么名称？`isAlive()`\
  \ 方法的作用是什么？*提示*：类方法 `currentThread()` 返回 `Thread` 对象的指针并调用该方法。\n\n### 练习 2：不同线程的属性\n\
  \n考虑以下两个类：\n\n\n\n\n\n```java\nclass Parrot5 extends Thread {\n  private String\
  \ cri = null;\n  private int fois = 0;\n  public Parrot5(String s, int i) {\n  \
  \  super(\"parrot\");\n    cri = s;\n    fois = i;\n  }\n  public void run(){\n\
  \    afficheThreads();\n    for (int n=0; n<fois; n++) {\n      try { Thread.sleep(1000);\
  \ }\n      catch(InterruptedException e) { }\n      System.out.println(cri) \n \
  \   }\n    afficheThreads(); }\n  private void afficheThreads() {\n    Thread[]\
  \ tabThread = new Thread[Thread.activeCount()];\n    int nbrThread = Thread.enumerate(tabThread);\n\
  \    for (int i = 0; i < nbrThread ; i++)\n      System.out.println(i + \"-ieme\
  \ Thread: \" + tabThread[i].getName());\n  }\n}\n```\n\n```java\nclass ChatAndLaunchParrot5\
  \ {\n  public static void main(String args[]) {\n    Thread.currentThread().setName(\"\
  chatty\");\n    Parrot5 parrot = new Parrot5(\"coco\",15);\n    parrot.start();\n\
  \    for (int n=0; n<5; n++) {\n      try { Thread.sleep(1000); }\n      catch(InterruptedException\
  \ e) { }\n      blabla();\n    }\n  }\n  private static void blabla() {\n    System.out.println(\"\
  blabla\");\n  }\n}\n```\n\n提示：方法 `setName(String name)` 允许为线程命名。`Thread` 构造器提供了如下方式进行命名的可能：`Thread\
