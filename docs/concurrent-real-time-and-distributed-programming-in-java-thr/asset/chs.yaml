  \ mot pour perroquet ? (sinon non)\n\nbizarre\n\ncoco bizarre\n\ncoco bizarre\n\n\
  nouveau mot pour perroquet ? (sinon non)\n\n`notify` 释放一个等待线程。`notify()` 每次唤醒一个线程（不是基于\
  \ FIFO 机制）。\n\n第二个生产者消费者示例所示。它展示了用户在车站等待巴士；巴士到达并将用户装上车。\n\n![images](img/f0050-01.jpg)\n\
  \n```\nclass BusSimple {\n    public static void main(String args[]) {\n       \
  \ Station BusStation = new Station();\n        Usager[] u = {new Usager(\"A\", BusStation),\
  \ new Usager(\"B\", BusStation),\n                      new Usager(\"C\", BusStation),\
  \ new Usager(\"D\", BusStation),\n                      new Usager(\"E\", BusStation)};\n\
  \        Bus b = new Bus(BusStation);\n        b.start();\n        for (int i =\
  \ 0; i < u.length; i++) {\n            u[i].start();\n        }\n    }\n}\n\nclass\
  \ Station {\n    private int count = 0;\n    public synchronized void charger(String\
  \ name) {\n        while (count == 5) wait();\n        count++;\n        System.out.println(name\
  \ + \" arrives\");\n        notifyAll();\n    }\n    public synchronized void attendre()\
  \ {\n        while (count == 0) wait();\n        count--;\n        System.out.println(\"\
  Bus departs\");\n        notifyAll();\n    }\n}\n\nclass Usager extends Thread {\n\
  \    private String name;\n    private Station station;\n    public Usager(String\
  \ name, Station station) {\n        this.name = name;\n        this.station = station;\n\
  \    }\n    public void run() {\n        for (int i = 0; i < 3; i++) {\n       \
  \     station.charger(name);\n            try { sleep(1000); } catch (InterruptedException\
  \ e) {}\n        }\n    }\n}\n\nclass Bus extends Thread {\n    private Station\
  \ station;\n    public Bus(Station station) {\n        this.station = station;\n\
  \    }\n    public void run() {\n        while (true) {\n            station.attendre();\n\
  \            try { sleep(2000); } catch (InterruptedException e) {}\n        }\n\
  \    }\n}\n```\n\n共享对象是 `BusStation`；它包含两个方法。一个由生产者使用（`charger`），另一个由消费者使用（`attendre`）。\n\
