  \ 高级通信：中间件\n\n这些是提供复杂服务的层。这些层是使用 `TCP/UDP` 层创建的。例如：从远程实体的方法调用。\n\n- 中间件是一个中间层（软件层），它位于网络通信基础设施和分布式应用程序元素之间。\n\
  \n![image/fig4-5.jpg]\n\n**图 4.5.** 中间件在网络中的位置。该图的彩色版本请参阅 [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
  \n- 分布式环境（大部分）基于 `RPC`（远程过程调用）。\n- 这种机制以请求/响应模式工作。\n- 客户端发出请求（请求服务）。\n- 服务器随后处理请求并最终向客户端返回响应。\n\
  \n`RPC` 具有以下特征：\n- 过程化编程，因此不是面向对象的。\n- 参数和返回值是基本类型。\n- 没有“远程引用”。\n\n随后，中间件以以下方式演进：\n\
  - `JAVA RMI`（远程方法调用）。单语言、跨平台：从 `JVM` 到 `JVM`。\n- `CORBA`（通用对象请求代理）。多语言、跨平台。\n- 微软的\
  \ `DCOM`（分布式组件模型）。多语言，用于分布式软件组件之间的的通信。\n\n在接下来的章节中，我们将重点关注 Java RMI。\n\n![image/fig4-6.jpg]\n\
  \n**图 4.6.** RPC 操作。该图的彩色版本请参阅 [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
  \n#### 4.2.2.1 RMI 简介\n\n`RMI` 允许 Java 虚拟机进行通信，无论它们是在同一台机器上还是两台不同的机器上。`java.rmi`:\
  \ 集成 `JDK 1.1` 及更高版本（自 1997 年起）的 API。\n\n为了让客户端访问远程服务，必须将其注册表中。RMI 注册表被称为 `rmireistry`，它包含一个哈希表，键是名称，值是远程对象。\n\
  \n![image/fig4-7.jpg]\n\n**图 4.7.** rmireistry\n\nRMI 应用的工作原理如下：\n- 服务器创建对象并将其保存在注册表中。\n\
  - 这允许客户端定位远程对象并获取其引用。\n- 当客户端想要调用远程方法时，它在 `rmireistry` 中查找对象并获取指向该对象的引用（一个存根/stub）。\n\
  - 客户端通过新获取的引用调用远程对象的方法。\n- 存根（stub）是远程对象的代理（本地代表），它通过网络调用远程对象的方法。\n- 这种机制确保了调用的透明性。\n\
  \n![image/fig4-8.jpg]\n\n**图 4.8.** RMI 应用的操作。该图的彩色版本请参阅 [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
  \n图 4.9 代表远程方法调用的阶段。\n\n#### 4.2.2.2 RMI 架构\n\n图 4.10 代表 RMI 架构。\n\n![image/fig4-9.jpg]\n\
  \n**图 4.9.** 远程方法调用的阶段。该图的彩色版本请参阅 [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
  \n![image/fig4-10.jpg]\n\n**图 4.10.** RMI 架构。该图的彩色版本请参阅 [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
  \n- 第一层：存根/骨架（stub/skeleton）。\n    - 存根（stub）：对象的本地代表。\n        - 通过将远程调用传输到引用对象层（RRL），与远程\
  \ `JVM` 建立。\n        - 装配参数以便传输到远程 `JVM`。\n    - 骨架（skeleton）：用于定位分布式对象。\n     \
  \   - 拆分远程方法的参数。\n        - 调用请求的方法。\n        - 对返回调用者的结果（返回值或异常）进行装配。\n- 备注：自 Java\
  \ 2（1998 年）起，不再需要骨架。\n- 所有的远程对象共享一个类似的通用骨架类。\n- 此外，直到 J2SE 5.0 版本（2004 年），在保存到 RMI\
  \ 注册之前，需要一个名为 `RMIC`（Java RMI 编译器）的存根编译器来生成存根/骨架。\n\n\n\n\n\n- 现在，可以动态生成它们（不再需要使用\
  \ `RMIC`）。\n- 第二层：`RRL`（对象引用层）。\n    - 通过查询 `rmiregistry` 获取远端对象的引用。\n    - `rmiregistry`\
  \ 运行在每个托管远端对象的机器上。\n    - 每个 `JVM` 只有一个 `rmiregistry`。\n    - `rmiregistry` 默认在端口\
  \ `1099` 上接受服务请求。\n- 第三层：`transport`。\n    - 使用 `TCP/IP` 之上的通信协议。\n    - 在方法调用期间，存根（stub）将调用传输到\
  \ `RRL` 层，后者将请求传输到 `TCP/IP` 之上 `RMI` 的 `transport` 层，并通过向上到达调用远端对象的骨架（skeleton）来传输请求。\n\
  \    - 默认，`RMI` 在端口 `1099` 上使用 `JRMP`（Java 远程方法协议）协议。这是一个用于调用远程方法的协议。\n        -\
  \ `JRMP` 是 `RMI` 的通信协议，仅用于用 Java 编写的应用之间。\n        - 原始版本。\n        - 集成在语言中。\n\
  \        - 使用简单。\n    - 从 Java 2 开始，为了兼容 `CORBA`，客户端和服务器之间的通信可以使用 `IIOP`（互联网对象 ORB\
  \ 协议）协议进行。\n        - 较版本。\n        - 兼容 `CORBA`。\n        - 实现难度更大。\n\n在这种情况下，需要\
  \ `javax.rmi` 宏包。\n\n#### 4.2.2.3 部署 RMI\n\n部署 `RMI` 需要使用多个包：\n\n- `java.rmi.Naming`\n\
  - `java.rmi.Remote`\n- `java.rmi.RemoteException`\n- `java.rmi.server.UnicastRemoteObject`\n\
  - `java.rmi.registry.LocateRegistry`\n- `java.rmi.NotBoundException`\n\n`java.rmi.Naming`：是一个最终类：`public\
  \ final class Naming extends Object`。\n\n- 服务器可以使用 `bind()`（或 `rebind()`）方法记录远端对象。\n\
  - `static void bind (String name, Remote obj) throws AlreadyBoundException, MalformedURLException,\
  \ RemoteException.`\n- `static void rebind (String name, Remote obj) throws RemoteException,\
  \ MalformedURLException.`\n- 注意：如果对象在注册表中已以相同的名称记录（两个不同对象使用相同名称），则 `bind()` 会抛出异常。\n\
  \n`Remote` 是一个用于设计远端对象的接口。\n\n- 客户端将通过 `lookup()` 方法找到该对象。\n- `static Remote lookup\
  \ (String name) throws NotBoundException, MalformedURLException, RemoteException`\n\
  \n以下步骤将部署 `RMI`：\n\n- 服务端：\n    - 定义一个包含可以远程调用的方法的接口（该接口与客户端共享）。\n    - 编写实现该接口的类。\n\
  \    - 编写一个类（服务器），该类将实例化对象，并在向 `RMI` 注册表中为其命名的同时对其进行记录。\n- 客户端：\n    - 根据名称获取其远端对象的引用。\n\
  \    - 通过该引用调用方法。\n\n要部署 `RMI`，请按照下面提供的步骤操作：\n\n**客户端和服务器之间的共享接口：**\n\n该接口必须扩展 `java.rmi.Remote`。\n\
  \n```java\nimport java.rmi.Remote;\nimport java.rmi.RemoteException;\npublic interface\
  \ Hello extends Remote {\n    public String Bonjour() throws RemoteException;\n\
  }\n```\n\n- `Remote` 是一个没有方法的接口。\n- 实现了 `Hello` 接口的对象是一个支持对其方法进行远程访问的对象。\n- 所有方法必须抛出\
  \ `RemoteException`。\n\n![image](img/fig4-11.jpg)\n\n**图 4.11.** 部署 RMI。需该图的彩色版本，请访问\
  \ [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)\n\
  \n**在服务端实现该接口的类：**\n\n```java\nimport java.rmi.RemoteException;\nimport java.rmi.server.UnicastRemoteObject;\n\
  public class HelloImpl extends UnicastRemoteObject implements Hello\n{\n  public\
  \ HelloImpl() throws RemoteException {\n  }\npublic String Bonjour() throws RemoteException\
  \ {\n    return \"Bonjour tous le monde !\";\n}}}\n```\n\n- 它必须实现 `Hello` 接口。\n\
  - 它必须扩展 `UnicastRemoteObject`。\n- `Unicast`：远端对象在单台机器上存在唯一的副本。\n- 它可以实现接口中之外的方法，但这些方法将无法被远程访问。\n\
  - 构造函数抛出 `RemoteException`。\n- 因此，用户必须编写一个。\n\n**实现服务器：**\n\n```java\nimport java.net.MalformedURLException;\n\
  import java.rmi.Naming;\nimport java.rmi.RemoteException;\nimport java.rmi.registry.LocateRegistry;\n\
  public class HelloServer {\n  public static void main(String[] args) {\n  try {\n\
  LocateRegistry.createRegistry(1099);\n  } catch (RemoteException e) {\n    System.err.println(\"\
  rmiregistry already on this port\");\n    System.exit(1);\n  }\n  Hello hello;\n\
  \  try {\n    hello = new HelloImpl();\n    Naming.rebind(\"rmi://localhost:1099/Hello\"\
  ,hello);\n  } catch (RemoteException e) {\n    System.err.println(\"server appears\
  \ to down\");\n    System.exit(4);\n  } catch (MalformedURLException e) {\n    System.err.println(\"\
  URL incorrect\");\n    System.exit(1);\n  }\n}\n```\n\n\n\n\n```java\nimport java.rmi.*;\n\
  import java.rmi.server.*;\nimport java.rmi.registry.*;\npublic class HelloServer\
  \ extends UnicastRemoteObject implements\nHello {\npublic HelloServer() throws RemoteException\
  \ {}\npublic int multi(int a, int b) throws RemoteException {\nreturn a * b; }\n\
  public static void main(String[] args) {\n   try {\n   LocateRegistry.createRegistry(1099);\n\
  \  } catch (RemoteException e1) {\n    System.err.println(\"rmiregistry is already\
  \ launched on this port\");\n    System.exit(1);\n  }\n   try {\nHelloServer objet\
  \ = new HelloServer();\nNaming.rebind(\"badr\",object);\nSystem.out.println(\"Server\
  \ ready\");\n}\ncatch(Exception e) {\nSystem.err.println(\"Error: \" + e.getMessage());\n\
  }\n}\n}\n```\n\n### 关于 bind 和 rebind 的几点说明：\n\n以下代码是正确的：\n\n```java\nHelloServer\
  \ object = new HelloServer();\nNaming.rebind(\"badr\",object);\nNaming.rebind(\"\
  badr1\",object);\n```\n\n可以为同一个对象属性多个名称：无论使用 `bind` 还是 `rebind` 均如此。\n\n以下代码产生异常：\n\
  \n```java\nHelloServer object = new HelloServer();\nHelloServer object1 = new HelloServer();\n\
  Naming.bind(\"badr\",object);\nNaming.bind(\"badr\",object1);\n```\n\n以下代码是正确的：\n\
  \n```java\nHelloServer object = new HelloServer();\nHelloServer object1 = new HelloServer();\n\
  Naming.rebind(\"badr\",object);\nNaming.rebind(\"badr\",object1);\n```\n\n它使用 `rebind`\
  \ 时可以工作，因为它是重新保存；`badr` 只指向 `object1`。\n\n### 实现客户端：\n\n```java\nimport java.rmi.*;\n\
  public class HelloClient {\npublic static void main(String[] args) {\ntry {\n  Hello\
  \ reference = (Hello)Naming.lookup(\"badr\");\n  int resultat = reference.multi(5,12);\n\
  \  System.out.println(\"The multiplication is: \" + result); }\ncatch(Exception\
  \ e) { System.err.println(\"Error: \" + e.getMessage()); }\n}\n}\n```\n\n#### 执行结果：\n\
  - 服务端：Server ready。\n- 客户端：The multiplication is 60。\n\n以下类用于生成注册表：\n\n- `public\
  \ final class LocateRegistry extends Object`。\n- 用于在 `java.rmi.registry` 包中生成 `rmiregistry`\
  \ 的类。\n- `createRegistry` 方法：\n    - `static Registry createRegistry (int port)`：创建注册表。\n\
  \    - `LocateRegistry.createRegistry(1099)`：：在端口 1099 上创建注册表。\n    - `createRegistry`\
  \ 是一个返回 `Registry` 的静态方法。\n    - `public interface Registry extends Remote`。\n \
  \   - 位于 `java.rmi.registry` 包中。\n    - `LocateRegistry.createRegistry(1099)`：创建一个远程注册表\
  \ (`rmiregistry`)。\n- `getRegistry` 方法：\n    - 返回一个指向远程注册表的引用。\n    - 各种签名：\n  \
  \      - `static Registry getRegistry()`。\n        - `static Registry getRegistry(int\
  \ port)`。\n        - `static Registry getRegistry(String host)`。\n        - `static\
  \ Registry getRegistry(String host, int port)`。\n        - `static Registry getRegistry(String\
  \ host, int port, RMIClientSocketFactory csf)`。\n\n应用示例：\n\n```java\nString [ ]\
  \ NamesSaved = LocateRegistry.getRegistry(\"localhost\",\n1099).list();\n```\n`list()`：`Registry`\
  \ 接口的方法，返回注册表中记录的名称列表。\n\n### 4.2.2.4 RMI 中的参数交换\n\n通过 Java RMI 交换的参数必须是：\n\n- 原生类型：`int`、`short`、`double`、`boolean`\
  \ ……， 还有 `String`。\n- `Serializable` 对象。\n- `Remote` 对象。\n\n原生类型按值（拷贝）传输。\n`Serializable`\
  \ 对象被序列化、传输，然后被反序列化（按值传输）。\n`Remote` 对象以远程引用的形式传输。\n\n#### 原生类型：\n\n以下代码代表服务端上 `multi`\
  \ 方法的实现：\n\n```java\npublic int multi (int a, int b) throws RemoteException {\n\
  \    return a * b;\n}\n```\n\n客户端上的方法调用如下：\n\n```java\ntry {\n  Hello reference\
  \ = (Hello)Naming.lookup(\"badr\");\n  int result = reference.multi(5,12);\n  System.out.println(\"\
  The multiplication is: \" + result);\n}catch(Exception e) { System.err.println(\"\
  Error: \" + e.getMessage()); }\n```\n\n在前面的例中，调用是按值执行的。\n\n#### 传输 Serializable\
  \ 对象：\n\n示例：我们希望使用一个数据服务器来存储一组 2D 坐标，用以描述平面上某数量车辆的位置。\n\n该服务器必须包含以下功能：\n\n- 创建一个新位置并为其分配一个名称。\n\
  - 对位置的读取访问。\n- 对位置数量的访问。\n- 服务器必须实现一个 `hashtable`。\n- 在 `java` 中，`Hashtable` 类是\
  \ `java.util` 中的类。\n\n图 4.12 `rmiregistry`。在我们的案例中：\n- 键是位置名称。\n- 值是 2D 坐标。\n- `Serializable`\
  \ 类必须实现。\n\n```java\nimport java.io.Serializable;\npublic class Point implements\
  \ Serializable {\n  public float x;\n  public float y;\n  public Point(float xx,float\
  \ yy) {\n    x = xx;\n    y = yy;\n  }\n  public String toString() {\n  return(\"\
  +x+\", \"+y+\") ;\n  }\n}\n```\n\n服务端的实现：\n\n```java\nimport java.rmi.*;\nimport\
  \ java.rmi.server.*;\nimport java.rmi.registry.*;\nimport java.util.Hashtable;\n\
  \npublic class Serveur extends UnicastRemoteObject implements Position {\n  private\
  \ Hashtable h;\n  public Serveur() throws RemoteException {\n    h = new Hashtable();\n\
  \  }\n  public void insererTable(Point p, String nom) throws RemoteException {\n\
  \    h.put(nom,p);\n  }\n  public Point position(String nom) throws RemoteException\
  \ {\n    return (Point) h.get(nom);\n  }\n  public int nombreles() throws RemoteException\
  \ {\n    return h.size();\n  }\n  public static void main(String[] args) {\n   \
  \ try {\n      LocateRegistry.createRegistry(1099);\n    } catch (RemoteException\
  \ e1) {\n      System.err.println(\"rmiregistry is already launched on this port\"\
  );\n      System.exit(1);\n    }\n    try {\n      Serveur ib = new Serveur();\n\
  \      Naming.rebind(\"Data\",ib);\n      System.out.println(\"Ready\");\n    }\
  \ catch (Exception e) {\n      System.err.println(\"Error: \" + e.getMessage());\n\
  \    }\n  }\n}\n```\n\n`Position` 接口：\n\n```java\nimport java.rmi.*;\npublic interface\
  \ Position extends Remote {\n  void insererTable(Point p, String nom) throws RemoteException;\n\
  \  Point position(String nom) throws RemoteException;\n  int nombreles() throws\
  \ RemoteException;\n}\n```\n\n客户端的实现：\n\n```java\nimport java.rmi.*;\npublic class\
  \ Client {\n  public static void main(String[] args) {\n    try {\n      Position\
  \ b =(Position) Naming.lookup(\"Data\");\n      System.out.println(b.nombreles());\n\
  \      b.insererTable(new Point(11,5),\"P0\");\n      b.insererTable(new Point(14,9),\"\
  P1\");\n      System.out.println(b.nombreles());\n      System.out.println(b.position(\"\
  P0\"));\n      System.out.println(b.position(\"P1\"));\n    } catch (Exception e)\
  \ {\n      System.out.println(e) ;\n    }\n  }\n}\n```\n\n\n\n\n问题发生在 `Point` 类型对象的传输上，该对象必须是\
  \ `Serializable`（序列化的）。\n\n### 传输远程对象：RMI 多线程服务器（聊天室）\n\n- 每个客户端都是一个线程，并有三种可能的动作：加入、说话或离开。\n\
  - 服务器现在必须维护一个分布式对象列表（`Remote`）。\n- 使用 `synchronized` 来保证数据的一致性。\n- 客户端的操作必须显示给其他客户端。\n\
  - 使用 `Jframe` (Swing) 实现线程。\n\n#### 第一个客户端：\n![images](img/f0111-01.jpg)\n\n####\
