  \ 和一个*信号量* `s`。\n\n### 练习 13：哲学家晚餐\n\n这是一个非常经典的问题 [DIJ 70]。五位哲学家重聚在一起执行两项主要活动：思考和进。每位哲学家随机花费一段时间进行思考，在可能的情况下在随机一段时间内进食，然后回到思考状态。当一个哲学家请求吃饭时，有一盘意大利面在等待。这五盘意大利面摆放在圆桌周围，如下图所示：\n\
