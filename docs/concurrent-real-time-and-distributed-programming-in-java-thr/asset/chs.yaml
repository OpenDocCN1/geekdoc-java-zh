  \ 的乘法表：\n\n```\n0 4 8 12 16 20 24 28 32 36 40\n```\n\n- 现在你的客户端必须发送一个整数表，即 `{1,\
  \ 6, 8, 9, 13, 10}`。\n- 服务器必须返回仅包含偶数的子表（`{6, 8, 10}`）。\n\n### 练习 22：TCP 套接字的低级操作\n\
