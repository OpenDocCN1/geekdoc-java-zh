- "# Java 并发、实时与分布式编程：线程、RTSJ 与 RMI（计算机科学聚焦）\n\n\n\n[content]\n\n![](img/cover.jpg)\n\
  \n![封面](img/cover.jpg)\n\n# 引言\n\n本书是实时和分布式并发计算的介绍，使用 `Java` 面向对象语言作为描述算法的辅助工具。它特别描述了\
  \ `Java` 中线程之间的同步机制（协作与竞争）以及数据共享机制（内部类、静态类型变量）。随后，我们讨论了 `Java` 在实时应用中的使用。随之，书中还介绍了\
  \ `RTSJ`（Java 实时规范）。最后，书中还包含了对分布式计算的介绍。我们特别关注使用 `TCP Sockets` 的低级通信以及使用 `Java RMI`（远程方法调用）中间件的高级通信。书中还包含一个附录，其中包含与本书主题相关的实际应用练习。掌握\
  \ `Java` 语言知识是正确理解本书的前提。\n\n# 1 Java 线程简介\n\n## 1.1 进程与线程\n\n操作系统负责为进程分配必要的资源（内存、处理时间、输入/输出），并确保它们之间互不干扰（隔离）[TAN\
  \ 01]。\n\n这一原理在以下示例中得到了说明，在两个不同的类中定义了变量 `a`。当执行这两个类时，为该变量分配的两个内存区域完全隔离的。\n\n![image](img/fig1-1.jpg)\n\
  \n**图 1.1.** 进程间的隔离\n\n大多数操作系统提供了以下两者的区分：\n\n* 重量级进程：据推彼此之间是完全分离的。\n* 轻量级进程（线程）：共享同一个内存空间（以及其他资源）。\n\
  \n定义 1.– 线程是一段能够与其他进程并行执行的代码流。线程并非同时执行，而是使用共享时间，这就是为什么线程始终给其他线程执行的机会至关重要。\n\n下面的图表显示了四个不同线程的执行时间和延迟时间。\n\
  \n![image](img/fig1-2.jpg)\n\n**图 1.2.** 四个不同线程的执行时间和延迟时间\n\n## 1.2 并发计算\n\n并发编程语言必须允许允许：\n\
  \n* 创建线程；\n* 线程之间共享数据；\n* 线程间的同步：根据以下两个模型控制任务执行顺序：\n    * 竞争同步：当多个线程使用同一个资源时。此时，必须有一套互斥机制以避免进程相互干扰。\n\
  \    * 协作同步：当一个线程等待另一个线程执行完毕后才开始自己的执行时。\n\n## 1.3 线程创建\n\n在 `Java` 中创建线程有两种方式：\n\
  \n* 继承自 `java.lang.Thread` 的类：\n    * `java.lang.Thread` 实现了 `Runnable` 类。\n   \
  \ * `Thread` 扩展 `Object` 并实现了 `Runnable` 公共类。\n    * `Thread` 类必须实现 `run()` 方法。\n\
  \    * 子类继承 `run()` 方法。\n* 实现 `Runnable` 接口的类：\n    * 该类必须实现 `run()` 方法。\n\n现在问题出现了：我们应该选择哪种方案？\n\
  \n* 方法 1：子类 `Thread`：\n    * 当对一个不继承其他类的类（自治类）进行并行化时。\n    * 注意：`java` 中的简单继承。\n\
  \    * 使用 `extends Thread` 或 `implements Runnable` 均可。\n* 方法 2：实现 `Runnable`：\n\
  \    * 当强制要求使用父类时。\n    * 示例，涉及 applet 的情况：\n      `public class MyThreadApplet\
  \ extends Applet implements Runnable { }`\n    * 仅实现 `Runnable` 是有效的。\n\n让我们来看代码：\n\
  \n* 方法 1：子类 `Thread`\n```\nclass A extends Thread {\nA ( ) {…} // 构造函数\n…\npublic\
  \ void run ( ) {\n… // Thread 执行的内容\n}\n}\nA p1 = new A( ); // 创建线程 p1\np1.start();\
  \ // 启动线程并执行 p1.run()\n```\n\n* 方法 2：实现 `Runnable` 的类\n```\nclass B implements Runnable\
  \ {\nB ( ) { …} // 构造函数\n…\npublic void run() {\n… // Thread 执行的内容\n}\n}\nB p =\
  \ new B( );\nThread p2 = new Thread(p);\n…\np2.start(); // 启动线程并执行 p.run()\n```\n\
  \n## 1.4 线程类型\n\n存在两种类型的线程：\n\n* 用户线程：这种类型线程的活动是有时间限制的，意味着其场景是一个一定时间后结束的过程。只要有用户线程在执行，`JVM`\
  \ 就会一直运行。\n* 守护线程：只要程序运行，就在后台执行的线程。守护线程仅用于服务用户线程。如果只剩下守护线程，`JVM` 将停止。\n\n示例：编辑器中的语法高亮、垃圾回收器\
  \ (`DestroyJavaVM`) 等等。\n\n* `Thread` 类中的 `public final boolean isDaemon()` 用于确定线程类型。\n\
  * `Thread` 类的 `public final void setDaemon (boolean)` 表示该线程将是为守护线程（默认为用户线程）。\n*\
  \ 它必须在使用 `start()` 命令启动线程之前调用。\n* 在构造函数中使用 `setDaemon`。\n\n示例：在后台运行的时钟线程。\n```\n\
  Clock class extends Thread {\npublic () { setDaemon(true); }\npublic void run ()\
  \ {\nwhile (true) {\ntry{Thread.sleep(3000);} catch (InterruptedException e) {}\n\
  System.out.println(\"time\");\n}\n}\npublic static void main(String args[]){\nClock\
  \ p1 = new Clock();\np1.start();\n}\n```\n\n## 1.5 单任务与多任务\n\n为了说明多任务，让我们先从介绍单任务开始。在下面的示例中，`Parrot0.java`\
  \ 与主程序 `ChatAndParrot0.java` 以单任务对话：\n```\nclass ChatAndParrot0 {\npublic static\
  \ void main(String[]) {\nParrot0 parrot = new Parrot0(\"coco\",4);\nblabla();\n\
  parrot.run();\ntry {Thread.sleep(1000);}\n} catch (InterruptedException e) {\nSystem.out.println(e.getMessage()));\
  \ System.exit(1); }\n}\nprivate static void blabla() {\nSystem.out.println(\"blabla\"\
  );\n}\n\nclass Parrot0 {\nprivate String cri = null;\nprivate int fois = 0;\npublic\
  \ Parrot0 (String s, int i) {\ncri = s;\nfois = i;\n}\npublic void run () {\nfor\
  \ (int n=0; n<fois; n++) {\ntry {Thread.sleep(1000);} catch (InterruptedException\
  \ e) {System.exit(1); }\nSystem.out.println(cri);\n}\n}\n```\n执行上述代码的结果如下：\n* blabla\n\
  * blabla\n* coco\n* coco\n* coco\n* blabla\n* blabla\n\n没什么特别的，主程序说话，传递给鹦的 run，执行以三个\
  \ blabla 结束。要执行多任务，需要对上述代码进行修改。我们将通过不同的方式来实现。\n\n* 扩展 `Thread` 类：\n```\nclass ChatAndParrot2{\n\
  public static void main(String args[]) {\nParrot2 parrot = new Parrot2(\"coco\"\
  ,10);\nparrot.start();\nfor (int n=0; n<10; n++) {\ntry {Thread.sleep(1000);}\n\
  catch (InterruptedException e) { }\nblabla();\n}\n}\nprivate static void blabla()\
  \ {\nSystem.out.println(\"blabla\");\n}\n\nclass Parrot2 extends Thread{\nprivate\
  \ String cri = null;\nprivate int fois = 0;\npublic Parrot2 (String s, int i) {\n\
  cri = s;\nfois = i;\n}\npublic void run ( ){\nfor (int n=0; n<fois; n++) {\ntry\
  \ {Thread.sleep(1000);}\ncatch (InterruptedException e) { }\nSystem.out.println(cri);\n\
  }\n}\n}\n}\n```\n\n\n\n\n执行之前的代码结果如下：\n\ncoco\n\nblabla\n\ncoco\n\nblabla\n\ncoco\n\
  \nblabla\n\ncoco\n\nblabla\n\ncoco\n\nblabla\n\ncoco\n\nblabla\n\ncoco\n\nblabla\n\
  \ncoco\n\nblabla\n\ncoco\n\nblabla\n\ncoco\n\nblabla\n\ncoco\n\nblabla\n\ncoco\n\
  \nblabla\n\ncoco\n\nblabla\n\n* – 实现 `Runnable` 接口：\n\n```java\nclass ChatAndLaunchTheParrot1{\n\
  \  public static void main(String args[]) {\nParrot1 objectParrot = new Parrot1\
  \ (\"coco\",10);\n  Thread ThreadParrot = new Thread (objectParrot);\n  ThreadParrot.start();\n\
  \  for (int n=0; n<10; n++) {\n   try {\n     Thread.sleep(1000);\n   }\n   catch(InterruptedException\
  \ e) { }\n   blabla();\n  }\n  }\n  private static void blabla() {\n  System.out.println(\"\
  blabla\");\n  }\n}\nclass Parrot1 implements Runnable {\n  private String cri =\
  \ null;\n  private int fois = 0;\n  public Parrot1 (String s, int i) {\n  cri =\
  \ s;\n  fois = i;\n  }\n  public void run (){\n  for (int n=0; n<fois; n++) {\n\
  \   try {\n     Thread.sleep(1000);\n   }\n   catch(InterruptedException e) { }\n\
  \   System.out.println (cri);\n  }\n  }\n}\n```\n\n执行之前的代码结果如下：\n\nblabla\n\ncoco\n\
  \nblabla\n\ncoco\n\nblabla\n\ncoco\n\nblabla\n\ncoco\n\nblabla\n\ncoco\n\nblabla\n\
  \ncoco\n\nblabla\n\ncoco\n\nblabla\n\ncoco\n\nblabla\n\ncoco\n\nblabla\n\ncoco\n\
  \nblabla\n\ncoco\n\nblabla\n\ncoco\n\ncoco\n\n* – `run()` 是需要重定义的方法，用以放置 `Thread`\
  \ 的功能。\n\n* – `start()` 是一个允许 `Thread` 初始化并因此执行 `run` 的方法。它做的只是初始化 `Thread` 并（不阻塞调用线程\
  \ `Thread`）不等待 `run` 执行完毕。\n\n* – 它立即返回到调用线程 `Thread` 的执行。`Thread` 的 `run` 方法与其他\
  \ `Threads` 同时执行（多任务）。\n\n* – `start()` 允许 `Thread` 开始，但并不一定立即。下面的示例模拟了使用线程的竞赛。该想法是模拟两个名为\
  \ `Jean` 和 `Paul` 的人之间的 1000 米赛。由于需要让他们并发运行，因此每一个人将由一个 `thread` 来接。\n\n以下程序创建了一个继承\
  \ `Thread` 的通用 `Runner` 类。\n\n```java\nclass Runner extends Thread {\npublic Runner\
  \ (String str) {\n super(str);\n}\npublic void run() {\n  // Value i 在通过第 n 个百米时增加\n\
  \  for (int i =1; i<=10; i++) {\nSystem.out.println(i*100 + \" m : \" + getName());\n\
  \ try {\nsleep((int)(Math.random() * 1000));\n  } catch (InterruptedException e)\
  \ {}\n  } // end for\n  System.out.println( getName()+ \" finishes ! \");\n}// end\
  \ run\n} // end class\n```\n\n测试类 `Race` 负责创建 `Runner` 实例并使用 `start()` 在比赛中启动它们。\n\
  \n```java\nclass Race {\n  public static void main (String[] args) {\n System.out.println(\"\
  Passing: \");\n Runner Jean = new Runner (\"Jean\");\n Runner Paul = new Runner\
  \ (\"Paul\");\n Jean.start();\n Paul.start();\n  }\n}\n```\n\n执行此代码结果如下：\n\nPassing:\n\
  \n100 m : Jean\n\n100 m : Paul\n\n200 m : Jean\n\n200 m : Paul\n\n300 m : Paul\n\
  \n300 m : Jean\n\n400 m : Jean\n\n500 m : Jean\n\n600 m : Jean\n\n400 m : Paul\n\
  \n700 m : Jean\n\n500 m : Paul\n\n600 m : Paul\n\n800 m : Jean\n\n900 m : Jean\n\
  \n1000 m : Jean\n\n700 m : Paul\n\nJean finishes!\n\n800 m : Paul\n\n900 m : Paul\n\
  \n1000 m : Paul\n\nPaul finishes!\n\n## 1.6 线程的不同状态\n\n线程可以处于以下四种状态之一：\n\n* – 新（New）：包括从创建（通过构造函数）一直到调用其\
  \ `start()` 方法之间的所有时刻。\n\n* – 可运行（Runnable）：在调用 `start` 方法之后立即。\n\n* – 阻塞（Blocked）：代表线程等待的时刻，例如当它被\
  \ `sleep(long)` 方法挂起时，该方法会暂停线程在指定时间内执行。\n\n* – 终止（Terminated）：当其 `run()` 方法结束时。\n\
  \n线程的状态可以通过调用其 `getState()` 方法来指定。\n\n## 1.7 线程的生命周期\n\n线程的生命周期说明它可以：\n\n* – 新（New）：包括从创建（通过构造函数）一直到调用其\
  \ `start()` 方法之间的所有时刻。\n\n* – 可运行（Runnable）：在调用 `start` 方法之后立即。\n\n* – 阻塞（Blocked）：代表线程等待的时刻，例如当它被\
  \ `sleep(long)` 方法挂起时，该方法会暂停线程在指定时间内执行。\n\n* – 终止（Terminated）：当其 `run()` 方法结束时。\n\
  \n线程的状态可以通过调用其 `getState()` 方法来指定。\n\n\n\n\n```java\npublic class InfernalRace1\
  \ {\n  public static void main(String[] args){\n  Runner A = new Runner(\"A\");\n\
  \  Runner B = new Runner(\"B\");\n  A.start();\n  B.start();\n} // end main\n} //\
  \ end class InfernalRace1\n\nclass Runner extends Thread {\n String nom;\n public\
  \ Runner(String name) {\n  super(name);\n  this.name = name;\n}\n  public void run()\
  \ {\n        long PedalStroke = 0;\n    while (PedalStroke < 5000000) {\n      PedalStroke++;\n\
  \      if ((PedalStroke % 500000) == 0) {\nSystem.out.println(\"Runner \" + name\
  \ + \" performs \" + PedalStroke + \" pedal strokes.\");\n        } // end if\n\
  \      } // end while\n}// end run\n}// end class Runner\n```\n\n### 执行：\n\nRunner\
  \ A 执行了 500000 次踏踏。\nRunner B 执行了 500000 次踏踏。\nRunner B 执行了 1000000 次踏踏。\nRunner\
  \ A 执行了 1000000 次踏踏。\nRunner B 执行了 1500000 次踏踏。\nRunner A 执行了 1500000 次踏踏。\nRunner\
  \ A 执行了 2000000 次踏踏。\nRunner B 执行了 2000000 次踏踏。\nRunner A 执行了 2500000 次踏踏。\nRunner\
  \ B 执行了 2500000 次踏踏。\nRunner A 执行了 3000000 次踏踏。\nRunner B 执行了 3000000 次踏踏。\nRunner\
  \ A 执行了 3500000 次踏踏。\nRunner B 执行了 3500000 次踏踏。\nRunner A 执行了 4000000 次踏踏。\nRunner\
  \ B 执行了 4000000 次踏踏。\nRunner A 执行了 4500000 次踏踏。\nRunner B 执行了 4500000 次踏踏。\nRunner\
  \ A 执行了 5000000 次踏踏。\nRunner B 执行了 5000000 次踏踏。\n\n**结论。** Java 并不要求系统进行“时间分片”：即给具有相同优先级的线程分配相同的时间。\n\
  \n### 1.8.3 线程之间的优先级\n\n`setPriority` 方法设置不同线程之间的优先级级别。该值必须在最小值 `MIN_PRIORITY` 和最大值\
  \ `MAX_PRIORITY` 之间。\n\n以下代码说明了线程之间优先级的的作用：\n\n```java\npublic class InfernalRace2\
  \ {\n  public static void main(String[] args) {\n  Runner A = new Runner(\"A\");\
  \ Runner B = new Runner(\"B\");\nA.setPriority(Thread.MAX_PRIORITY);\nB.setPriority(Thread.MIN_PRIORITY);\n\
  System.out.println(\"Thread Runner \" + A.name + \" has priority = \" + A.getPriority());\n\
  System.out.println(\"Thread Runner \" + B.name + \" has priority = \" + B.getPriority());\n\
  \  A.start(); B.start();\n  }\n}\nclass Runner extends Thread {\n String name\n\
  \ public Runner(String name) {\n  super(name);\n  this.name = name;\n }\n  public\
  \ void run() {\n  long PedalStroke = 0;\n  while (PedalStroke < 5000000) {\n   \
  \ PedalStroke++;\n    if ((PedalStroke % 500000) == 0) {\n      System.out.println(\"\
  Runner \" + name + \" performs \" +\nPedalStroke + \" pedal strokes.\");\n    }\n\
  }\n}\n}\n```\n\n### 执行：\n\n* Thread Runner A 的优先级 = 10\n* Thread Runner B 的优先级 =\
  \ 1\n* Runner A 执行了 500000 次踏踏。\n* Runner A 执行了 1000000 次踏踏。\n* Runner A 执行了 1500000\
  \ 次踏踏。\n* Runner A 执行了 2000000 次踏踏。\n* Runner A 执行了 2500000 次踏踏。\n* Runner A 执行了\
  \ 3000000 次踏踏。\n* Runner A 执行了 3500000 次踏踏。\n* Runner A 执行了 4000000 次踏踏。\n* Runner\
  \ A 执行了 4500000 次踏踏。\n* Runner A 执行了 5000000 次踏踏。\n* Runner B 执行了 500000 次踏踏。\n\
  * Runner B 执行了 1000000 次踏踏。\n* Runner B 执行了 1500000 次踏踏。\n* Runner B 执行了 2000000\
  \ 次踏踏。\n* Runner B 执行了 2500000 次踏踏。\n* Runner B 执行了 3000000 次踏踏。\n* Runner B 执行了\
  \ 3500000 次踏踏。\n* Runner B 执行了 4000000 次踏踏。\n* Runner B 执行了 4500000 次踏踏。\n* Runner\
  \ B 执行了 5000000 次踏踏。\n\nThread A 先访问了 CPU，因为它具有最高优先级。Thread B 在最后执行，因为它具有最低优先级。优先级允许我们定义线程之间的执行顺序。\n\
  \n* 线程之间的优先级：方法 `setPriority(int)`。\n* 线程的优先级范围在 1 到 10 之间。\n* 使用三个常量表示界限值。\n* 值越高，线程访问处理器的优先级越高。\n\
  * `MIN_PRIORITY`：最低优先级 (1)。\n* `NORM_PRIORITY`：普通优先级 (5)。\n* `MAX_PRIORITY`：最高优先级\
  \ (10)。\n* 新线程默认分配为普通优先级。\n\n## 1.9 编写任务：Timer 和 TimerTask\n\n在接下来的章节中，我们希望在初始延迟后程序化任务（例如在特定时间后启动的情况），或者在一定的延迟后周期性地执行任务（软件情况）。\n\
  \n### 1.9.1 通过指定初始延迟\n\n以下代码在 4 秒后启动一次任务。\n\n```java\nimport java.util.Scanner;\n\
  import java.util.TimerTask;\nimport java.util.Timer;\nclass InitiateTheParrot11{\n\
  public static void main(String args[]) {\n  Parrot11 parrot = new Parrot11(\"coco\"\
  , 3);\n  Timer timer = new Timer();\n  timer.schedule(parrot, 4000);\n  String response=\"\
  yes\";\n  do {\n   System.out.println(\"blabla\");\n   System.out.println(\"blabla\"\
  );\n   System.out.println(\"would you like the parrot to continue? (y/n)\");\n \
  \  response =new Scanner(System.in).nextLine();\n  } while (response.equals(\"y\"\
  ));\n  timer.cancel();\n }\n\nimport java.util.TimerTask;\nclass Parrot11 extends\
  \ TimerTask {\n private String cri = null;\n private int fois = 0;\n public Parrot11(String\
  \ s, int i) {\n  cri = s;\n  fois = i;\n }\n public void repeter() {\n  System.out.println(cri);\n\
  \ }\n public void run() {\n  for (int i = 0; i < fois; i++) {\n    repeter();\n\
  \  }\n}\n```\n\n### 执行：\n\nblabla\nblabla\nwould you like the parrot to continue?\
  \ (y/n)\ny\nblabla\nblabla\nwould you like the parrot to continue? (y/n)\nn\n\n\
  `TimerTask` 的定义如下：\n\n* `public abstract class TimerTask implements Runnable`。\n\
  * `TimerTask` 是一个实现了 `Runnable` 的抽象类，我们需要继承 `TimerTask` 类并重写 `run()` 方法来编写要执行的任务。\n\
  * `run()` 是 `TimerTask` 中唯一的抽象方法。\n* `Timer` 开始任务的执行。\n* `Timer` 对应一个顺序执行任务的线程。\n\
  * `schedule(task, long milliseconds)` 通过指定初始延迟来安排任务。\n* `cancel()` 方法停止 `Timer`\
  \ 的调度。\n\n### 1.9.2 带有初始延迟和周期性\n\n```java\nimport java.util.Scanner;\nimport java.util.TimerTask;\n\
  import java.util.Timer;\nclass InitializeTheParrot11{\npublic static void main(String\
  \ args[]) {\n  Parrot11 parrot = new Parrot11(\"coco\", 3);\n  Timer timer = new\
  \ Timer();\n  timer.schedule(parrot, 3000, 2000);\n  String response=\"yes\";\n\
  \  do {\n   System.out.println(\"blabla\");\n   System.out.println(\"blabla\");\n\
  \   System.out.println(\"would you like the parrot to continue? (y/n)\");\n   response\
  \ =new Scanner(System.in).nextLine();\n  } while (response.equals(\"y\"));\n  timer.cancel();\n\
  \ }\n}\n\nimport java.util.TimerTask;\nclass Parrot11 extends TimerTask {\n private\
  \ String cri = null;\n private int fois = 0;\n public Parrot11(String s, int i)\
  \ {\n  cri = s;\n  fois = i;\n }\n public void repeter() {\n  System.out.println(cri);\n\
  \ }\n public void run() {\n  for (int i = 0; i < fois; i++) {\n    repeter();\n\
  \  }\n }\n}\n```\n\n`schedule(task, long delay, long period)` 在延迟后安排任务进行周期性执行：时间以毫秒为单位。\n\
