  \    - 当队列中有数据时：取消阻塞。\n\n## 2.10 Java 中的信号量 (Semaphore)\n\n定义.– 信号量是一种高级对象，有助于管理对共享资源的并发访问，它最多允许\
  \ N 个并发访问。\n\n示例：\n\n- – 管理一个具有 N 个车位的停车场的进出；\n- – 管理如医生诊所、美发店、保险公司等处拥有 N 张可用椅子的候诊室。\n\
  \n### 2.10.1 Java 1.5 之前\n\n信号量对象封装了一个完整的和两个原子操作：递增操作和递减操作。`P` 方法包含等待（wait），而 `V`\
  \ 方法包含通知（notify）。\n\n一个用于实现信号量的可能类如下：\n\n![images](img/f0055-01.jpg)\n\n每个想要访问临界区的线程都必须使用\
  \ `P` 方法，随后它将减少计数器变量的值。\n\n在前四个线程访问后，在第五个线程想要访问临界区的情况下，临界区的内容和计数器的值将如下：\n\n![images](img/f0056-01.jpg)\n\
  \n如果 T4 退出临界区，它必须使用 `V` 方法（递增计数并并通知）。\n\n![images](img/f0056-02.jpg)\n\n由于 T5 是唯一被等待阻塞的线程，它将在收到来自\
  \ T4 的通知后进入临界区。\n\n![images](img/f0057-01.jpg)\n\n在所有线程都退出临界区后，临界区的状态和计数器的值如下：\n\
  \n![images](img/f0057-02.jpg)\n\n### 2.10.2 Java 1.5 之后\n\nJava 1.5 版本及其所在的包 `java.util.concurrent`（以及其所有的子包）提供了高级同步工具。\n\
  \n- – 操作 `P` (`acquire()`）：递减计数器；如果计数器为负，则在等待可以进行递减操作时阻塞。\n- – 操作 `V` (`release()`）：递增计数器；如果计数器为负或为空，则发送通知。\n\
  - – 我们可以将信号量视为一组芯片，具有两种操作：\n\n    - - 取走一个芯片，或者在必要时等待直到有可用的芯片；\n    - - `acquire()`，通常带有等待；\n\
  \    - - 放回一个芯片；\n    - - `release()`，通常带有通知。\n- – 一个信号量有一个芯片，它与锁非常相似。\n\n以下示例是使用信号量管理停车场。类参数\
  \ `Semaphore` 表示停车场的大小。\n\n![images](img/f0058-01.jpg)\n\n执行过程：\n\n```\nThread 2\
  \ is not in the parking lot\nThread 3 is not in the parking lot\nThread 4 is not\
  \ in the parking lot\nThread 0 is not in the parking lot\nThread 1 is not in the\
  \ parking lot\nThread 1 enters the parking lot\nThread 2 enters the parking lot\n\
  Thread 3 enters the parking lot\nThread 1 exits the parking lot\nThread 0 enters\
  \ the parking lot\nThread 0 exits the parking lot\nThread 4 enters the parking lot\n\
  Thread 2 exits the parking lot\nThread 4 exits the parking lot\nThread 3 exits the\
  \ parking lot\n```\n\n通过将之前代码中的指令 `Semaphore sem = new Semaphore(3)` 替换为 `Semaphore\
  \ sem = new Semaphore(1)`，我们获得了以下执行结果：\n\n```\nThread 2 is not in the parking lot\n\
  Thread 3 is not in the parking lot\nThread 4 is not in the parking lot\nThread 0\
  \ is not in the parking lot\nThread 1 is not in the parking lot\nThread 0 enters\
  \ the parking lot\nThread 0 exits the parking lot\nThread 4 enters the parking lot\n\
  Thread 4 exits the parking lot\nThread 1 enters the parking lot\nThread 1 exits\
  \ the parking lot\nThread 3 enters the parking lot\nThread 3 exits the parking lot\n\
  Thread 2 enters the parking lot\nThread 2 exits the parking lot\n```\n\n# 3 实时系统与实时\
  \ Java\n\n## 3.1 实时系统\n\n### 3.1.1 定义\n\n实时系统与其他系统的区别在于，它们在某些情况下考虑了时间相关的限制，在这些情况下，遵守时间延迟与结果的准确性同样重要；换句话说，系统不仅必须交付准确的结果，还必须在给定的时间限制内交付结果。\n\
  \n在实时计算中，系统的正确行为不仅取决于逻辑处理结果，还取决于产生结果的时间 [STA 88]。\n\n示例：\n\n- – ATM 机不能花费 5 分钟来交付现金。\n\
  - – 雷达不能花费 2 秒来做出反应。\n- – ABS 系统获取信息不能超过 150 毫秒，反应不能超过 1 秒（ABS 指汽车上使用的防锁制动系统，防止车轮在剧烈制动下锁死）。\n\
  \n### 3.1.2 实时操作系统的示例\n\n- – Windows CE（Windows Embedded Compact），通常称为 WinCE，是 Windows\
  \ 用于车载系统和其他极简系统（例如用于手持电脑）的变体。\n- – LynxOS 是一种基于 UNIX 平台的实时操作系统。\n- – LynxWorks 是主要用于车载应用的实时操作系统。\n\
  \n### 3.1.3 实时系统的类型\n\n- – 软实时（Flexible real-time）：\n\n    - 系统接受数据处理的波动。\n    -\
  \ 惩罚不是灾难性的。\n    - 这些系统接受半秒（500 ms）甚至一秒的延迟。\n    示例：多媒体系统，如果几张图片没有显示，不会危及系统运行。\n\
  - – 硬实时（Firm real-time）：\n\n    - 在可接受的延迟内响应至关重要。\n    - 截止日期后的结果无用。\n    示例：金融交易，等。\n\
  - – 硬实时（Hard real-time）：\n\n    - 系统在延迟内的响应至关重要。\n    - 缺乏响应是灾难性的。\n示例：空中交通管制、核反应堆控制等。\n\
  \n### 3.1.4 架构\n\n- – 单任务架构（Monotask architecture）\n\n    - 单任务的实时系统很容易定义。它只需无限重复以下任务列表：\n\
  \    - 等待刺激。\n    - 根据刺激做出反应。\n示例：自动雷达。\n- – 多任务架构（Multitask architecture）：\n  \
  \  - 每个任务都可以由一个线程执行。资源可以由临界区保护。临界区的长度影响系统的响应时间。\n示例：入侵检测系统 (IDS)，它实时执行各种任务，包括：\n\
  \    - – 互联网流量分析；\n    - – 识别参与攻击的 IP；\n    - – 防火墙重配置；\n    - – 警报的可视化通知：在一个或多个控制台上显示警报。\n\
  \n### 3.1.5 带优先级的任务调度\n\n优先级有助于组织任务。优先级值越高，任务访问处理器的优先级越高。优先级可以是动态的或静态的。\n\n在实时系统中，任务通常不会被低优先级任务阻塞。\n\
  \n- – 考虑两个线程 T1 和 T2。\n- – T1 具有高优先级（例如 10），T2 具有低优先级（例如 1）。\n- – 启动这两个线程后，T1 必须在\
  \ T2 之前执行。\n- – 在某处，T1 被阻塞（例如通过 `wait()`），T2 运行进入临界区。\n- – T1 解阻塞并尝试获取锁。\n- – T2\
  \ 没有被调度且没有释放锁\n- – T2 在 T1 之前执行。\n- – 优先级反转管理会导致灾难性的影响。\n- – 事实上，由于缺乏优先级反转的管理意味着高优先级任务无法执行，可能无法对紧急情况做出反应。\n\
  \n示例：核反应堆的紧急停止指令会被低优先级的指令阻塞。\n\n\n\n\n\n-   没有一种可以完全避免优先级反转的简单解决方案。尽管如此，可以通过某些措施来限制这些风险。特别是，可以仅允许具有相似优先级的线程访问临界区域。\n\
  \n提出了两种解决方案：\n\n-   `优先级上限` (Priority ceiling)：\n    - `优先级上限协议` (`PCP`)：这包括为每个资源关联一个优先级上限。该资源的优先级定义为可以使用该资源的任务中的优先级加\
  \ 1。调度器将此优先级传递给访问该资源的每个任务。当任务完成对资源的使用后，其优先级恢复到原始值。\n\n-   `优先级继承` (Priority inheritance)：\n\
  \    - `优先级继承协议` (`PIP`)：当任务 `T2`（高优先级）在访问资源 `R` 时被阻塞，被阻塞的任务 `T1`（低优先级）继承 `T2` 的优先级。`T1`\
  \ 使用继承来的优先级，直到 `R` 被释放，届时它将重新获得获取该资源之前的优先级。\n\n## 3.2. 实时环境中的 Java\n\nJava 最初是为车载设备设计的。但\
  \ Java 很快开始被用于 Web 应用程序（Applet）。随后，Java 被用于以下应用：\n\n-   经典的 `J2SE` (`Java 2 标准版`)\
  \ 用于客户端工作站（`JVM` 经典，`HotSpot`）。\n\n-   业务级 `J2EE` (`Java 2 企业版`) 用于业务应用开发（`HotSpot`）。\n\
  \n-   精版的 `J2ME` (`Java 2 微型版`) 用于移动系统，如个人助手平板电脑和手机（经典 `JVM`、`Kilo VM` (`KVM`)、`Card\
  \ VM`（内置在打印芯片上的 `JVM`））。\n\n请注意，这里的语言并非为实时设计，原因如下：\n\n-   缺乏调度方面的专业知识；\n-   Windows\
  \ 在管理线程间优先级方面存在困难；\n-   对于 `notify()` 或 `notifyAll()`，对所选线程没有规定，不一定是先入先（FIFO）；\n\
  -   它是 Java 少数不具备移动性的功能之一；\n-   垃圾回收器`/GC` 存在问题；\n-   `GC` 可以在任何时间执行；\n-   `GC`\
  \ 可能持续特定的时长；\n-   `GC` 无法被抢占；\n-   `GC` 会抢占任何线程。\n\n### 3.2.1. `RTSJ (Java 实时规范)`\n\
  \n这是一个关于扩展 `JVM` 实时功能（`JVM RTSJ`）的提案 [JAV 17a]。\n\n规范由来自多家公司（Sun、`IBM`、`QNX`、`Nel`\
  \ 等）的专家小组完成。\n\n限制条件：\n\n-   与现有程序兼容：任何非实时 Java 应用程序都可以在 `JVM RTSJ` 上运行。\n-   无语法扩展。\n\
  -   无硬件或电力的前提要求。\n-   可预测的执行时间。\n-   粒度：纳秒。64 位 (ms) + 32 位 (ns)。\n-   `RTSJ` 在以下领域改进了\
  \ Java 实时编程：\n    -   内存管理。\n    -   时钟和时间管理。\n    -   调度和“可调度”对象。\n    -   实时线程。\n\
  \    -   异步事件和定时器的管理。\n    -   同步和资源共享。\n    -   新增的包 `javax.realtime` [JAV 17b]。\n\
  \    -   三个接口。\n    -   47 个类。\n    -   15 个异常。\n    -   4 个错误。\n-   `RTSJ`: 线程\n\
  \    -   一个接口：\n        -   `Schedulable`：可以被调度的对象，自 `java.lang.Runnable`。\n   \
  \     -   `public interface Schedulable extends java.lang.Runnable`。\n    -   两个新类：\n\
  \        -   `RealtimeThread`。\n        -   `public class RealtimeThread extends\
  \ java.lang.Thread implements Schedulable`。\n        -   可以访问堆。优先级低于 `GC` (`DestroyJavaVM`)。\n\
  \        -   `NoHeapRealtimeThread`。\n        -   `public class NoHeapRealtimeThread\
  \ extends RealtimeThread`。\n        -   它的优先级高于 `GC`。在 `ScopedMemory` 内工作，该线程内的对象被分配到该内存中。\n\
  \    -   `ScopedMemory` 具有以下特性：\n        -   其生命周期与占用它的实时线程一致。\n        -   不由垃圾回收器管理。\n\
  \        -   对象可以在 `ScopedMemory` 内分配（而不是在 `HeapMemory` 中）。\n        -   对象在作用域结束时释放。\n\
  \        -   `NoHeapRealtimeThread` 无法访问堆 (`Heap`)。\n        -   因此，`NoHeapRealtimeThread`\
  \ 不会被垃圾回收器阻塞。\n    -   优先级的组织方式如下：\n        `Thread` < `RealtimeThread` < `Garbage\
  \ Collector` < `NoHeapRealtime Thread`。\n\n### 3.2.2. 实现\n\n以下是研究的三种实现：\n\n-   `参考实现:\
