  ## 4.1. 分布式应用的定义\n\n应用程序分为若干单元。\n\n-   每个单元位于不同的机器上。\n-   每个单元可以在不同的系统上执行。\n-  \
  \ 每个单元可以使用不同的语言编写。\n\n![image](img/fig4-1.jpg)\n\n**图 4.1.** *单体应用与分布式应用的对比。该图的彩色版本请参阅\
  \ [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)*\n\
  \n## 4.2. 分布式应用中的通信\n\n### 4.2.1. *底层通信：套接字 (socket)*\n\n#### 4.2.1.1. *定义*\n\n\
  网络套接字是一种允许进程在同一台机器或跨网络进行通信和同步的模型。\n\n套接字是由伯克大学于 1986 年开发的。\n\n对于 Java 而言，`java.net`\
  \ 包中的 `Socket` 类出现在 `J2SE 1.4`（2002 年 2 月 6 日），用于实现套接字。\n\n#### 4.2.1.2. *通信模式*\n\
  \n-   连接模式（类似于电话通信），使用 `TCP` 协议。在这种通信模式下，两个进程之间建立了持久的连接，因此每个数据包不再需要目的地址。\n\n\n\n\
  \n\n-   非连接模式（类似于邮件通信），使用 `UDP` 协议。这种模式需要为每个数据包指定目的地的地址，且不需要确认接收。\n\n通信需要两个套接字（socket）：为网络上通信的两个程序各提供一个。\n\
  \n-   客户端一个 socket。\n-   服务端一个 socket（服务器端有一个用于连接的第二个 socket）。\n\n所使用的 IP 通信模式（`UDP`\
  \ 或 `TCP`）对应于 socket 的类型。\n\n在下一节中，我们将重点关注 `TCP` socket。\n\n在 Java 中，每个 `Socket`\
  \ 类的实例都与一个 `InputStream` 类的对象（用于读取套接字）和一个来自 `OutputStream` 类的对象（用于写入套接字）关联。\n\n\
  - 服务器将使用两种类型的 socket。\n- 第一种称为**连接套接字**，用于等待客户端。\n- 在 Java 中，可以通过简单实例化 `java.net`\
  \ 包中的 `ServerSocket` 类的对象来创建连接套接字。\n\n示例：`ServerSocket conn = new ServerSocket(10080)`。\n\
  \n- 第二种称为**通信套接字**，用于与客户端对话。\n- 一旦创建了连接套接字，我们将让它等待客户端并获取允许其与客户端对话的通信套接字。\n- `Socket\
  \ comm = conn.accept()`。\n- 我们可以使用与该 socket 关联的输入和输出流与客户端进行通信。\n    - `ServerSocket(numberPort)`：在此端口号上创建一个\
  \ `ServerSocket` 对象。\n    - `accept()`：等待来自慢客户端机器的连接。当客户端机器到达连接请求时，会创建一个 socket\
  \ 连接到服务器。这将是阻塞方法 `accept()` 返回的对象。\n    - `ServerSocket(numberPort, int backlog)`：在此端口号上创建一个\
  \ `ServerSocket` 对象，并带有一个大小由 `backlog` 指定的连接队列。\n    - 当队列满满时，连接请求将被拒绝，并导致客户端侧抛出异常。默认情况下，该大小为\
  \ 50。\n\n常用方法：\n\n- `accept()`：等待来自客户端机器的连接。\n- `close()`：关闭 `ServerSocket` 以及通过其\
  \ `accept` 方法获取的任何正在运行的 socket。\n- `isClosed()`：指示套接字是否已关闭。\n- `getLocalPort()`：返回本地端口号。\n\
  - `InetAddress getInetAddress()`：返回服务器地址。`InetAddress` 代表一个 IP 地址以及可能的机器名称。\n- `getHostName()`：返回存储在\
  \ `InetAddress` 类型对象中的主机名，形式为字符串链。\n- `getHostAddress()`：返回存储在 `InetAddress` 类型对象中的\
  \ IP 地址，形式为字符串链。\n- `getByName(String host)`：根据参数中的名称返回 IP（`InetAddress` 对象）。\n\n\
  以下代码的目的是找到作为参数传递的机器名对应的 IP 地址：\n\n```java\nimport java.net.*;\npublic class ResolveName{\n\
  \  public static void main(String[ ] args){\nInetAddress adresse;\ntry{\nadresse=InetAddress.getByName(\"\
  localhost\");\nSystem.out.println(adresse.getHostAddress());\nadresse=InetAddress.getByName(\"\
  www.facebook.com\");\nSystem.out.println(adresse.getHostAddress());\nSystem.out.println(adresse);\n\
  }catch(UnknownHostException e) { }\n}\n}\n```\n\n执行结果：\n\n127.0.0.1\n31.13.75.36\n\
  [www.facebook.com/31.13.75.36](http://www.facebook.com/31.13.75.36)\n\n与服务器不同，客户端只使用一个单一\
  \ socket：通信套接字。\n\n- 连接到服务器并获取通信套接字。\n- `Socket comm = new Socket (\"localhost\"\
  , 10080)`。\n- `Socket` 构造函数在客户端侧是一个阻塞方法。\n\n然后可以使用与该 socket 关联的输入和输出流与服务器进行通信。\n\
  \n- 有九个构造函数，其中两个被认为已弃用，因此有七个函数，包括：\n    - `Socket(String host, int port)`。\n   \
  \ - `Socket(InetAddress address, int port)`。\n    - 使用 IP：`InetAdress`。\n\n常用方法：\n\
  \n- `close()`：正确关闭套接字，并可能抛出 `UnknownHostException` 异常。\n- `getOutputStream()`：为\
  \ socket 返回一个 `OutputStream`。\n- `getInputStream()`：为 socket 返回一个 `InputStream`。\n\
  - `getPort()`：返回 socket 连接的远程端口号。\n- `InetAddress getInetAddress()`：返回远程机器的地址。\n\
  - `isClosed()`：指示套接字是否已关闭。\n- `isConnected()`：返回 socket 连接的状态。\n- `connect(SocketAddress\
  \ adresseSocket)`：将服务器连接到 socket。\n- `connect(SocketAddress adresseSocket, int timeout)`：以毫秒为单位的超时值将\
  \ socket 连接到服务器。\n- 如果延迟过期，则抛出 `SocketTimeoutException`。\n- `SocketAddress` 是一个抽象类。\n\
  - `InetSocketAddress` 继承自 `SocketAddress`，是一个表示 `InetAddress` 和端口的类。\n- `InetSocketAddress(InetAddress\
  \ ina, int port)`。\n- `InetSocketAddress(String hostName, int port)`。\n\n以下代码通过\
  \ `connect` 创建带有超时的 socket：\n\n```java\nSocket sock = null;\ntry {\nint port = XYZ;\n\
  int timeOut = 3000;\nSocketAddress sockAddr = new InetSocketAddress(\"host\", port);\n\
  sock = new Socket(); // 构造函数不连接。\nsock.connect(sockAddr, timeOut); // 延迟为毫秒，所以 3\
  \ 秒。\n} catch (UnknownHostException e) {\n} catch (SocketTimeoutException e) {\n\
  }\n```\n\n连接请求阻塞直到连接建立或超时过期；如果延迟过期，将抛出 `SocketTimeoutException`。\n\n### 4.2.3 示例\n\
  \n在下面，我们展示了一个与 TCP socket 通信的简单示例：\n\n- 客户端向服务器发送消息。\n- 服务器确认并请求下一个单词。\n- 要断开连接，客户端发送单词“no”。\n\
  \n![image](img/fig4-2.jpg)\n\n**图 4.2.** *与 Socket 通信的示例。彩色版本请查看 [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)*\n\
  \n服务端代码如下：\n\n```java\nimport java.net.*;\nimport java.io.*;\nclass ServerEcho {\n\
  \  public static void main(String args[]) {\n    ServerSocket server = null;\n \
  \   try {\n      server = new ServerSocket(7777); // 连接套接字\n      while (true) {\n\
  \        Socket sock = server.accept(); // 等待\n        System.out.println(\"connected\"\
  );\n        PrintWriter sockOut = new PrintWriter(sock.getOutputStream(), true);\n\
  \        BufferedReader sockIn = new BufferedReader(new\n        InputStreamReader(sock.getInputStream()));\n\
  \        String recu;\n        while ((recu = sockIn.readLine()) != null) {\n  \
  \        System.out.println(\"recu:\"+recu);\n          sockOut.println(\"next?\
  \ \");\n        } //end while\n        sockOut.close();\n        sock.close();\n\
  \      } //end while (true)\n    } catch (IOException e) {\n      try {server.close();}\n\
  \      catch (IOException e2) {}\n    } // end 第一个 catch\n  } // end main\n} //\
  \ end class\n```\n\n![image](img/fig4-3.jpg)\n\n**图 4.3.** *与 Socket 通信的示意图。彩色版本请查看\
  \ [www.iste.co.uk/benmammar/java.zip](http://www.iste.co.uk/benmammar/java.zip)*\n\
  \n客户端代码如下：\n\n\n\n\n\n```java\nimport java.io.*;\nimport java.net.*;\nimport java.util.Scanner;\n\
  public class ClientEcho {\n  public static void main(String[] args) throws IOException\
  \ {\n  Socket sock = null;\n  PrintWriter sockOut = null;\n  BufferedReader sockIn\
  \ = null;\n  try{sock = new Socket(\"localhost\", 7777); // the communication socket.\n\
  \    sockOut = new PrintWriter(sock.getOutputStream(), true); //force write\n  \
  \  sockIn = new BufferedReader(new InputStreamReader(sock.getInputStream()));\n\
  \  } catch (UnknownHostException e) {\n    System.err.println(\"host unreachable:\
  \ localhost\");\n    System.exit(1);\n  } catch (IOException e) {\n    System.err.println(\"\
  cannot connect to: localhost\");\n    System.exit(1);\n  }\n  System.out.println(\"\
  press any key to close\");\n  Scanner scan = new Scanner(System.in);\n  String message\
  \ = scan.next().toLowerCase();\n  while (! message.equals(\"no\")) {\n    sockOut.println(message);\n\
  \    String recu = sockIn.readLine();\n    System.out.println(\"server -> client:\"\
  \ + recu);\n    message = scan.next().toLowerCase();\n  }\n  sockOut.close();\n\
  \  sockIn.close();\n  sock.close();\n  }\n}\n```\n\n执行过程如下：\n\n- – 在服务器端：\n  `connected`\n\
  \  `received: hello`\n  `received: bye`\n- – 客户端：\n  `press any key to close`\n\
  \  `hello`\n  `server -> client: next ?`\n  `bye`\n  `server -> client: next ?`\n\
  \  `no`\n\n注意，对于字符，Java 语言使用了基于 16 位 Unicode 编码的 `char` 类型。网络传输是基于 8 位字节（byte）的。\n\
  \n因此，Java 的通信方法基于字节传输的。\n\n- – 将 `String` 转换为 `bytes[ ]`：\n  - `- String chaine\
  \ = \"ABCD\";`\n  - `- byte[ ] message=chaine.getBytes();`\n- – 将 `byte[ ]` 转换为\
  \ `String`：\n  - `- chaine = new String(message);`\n\n#### 4.2.1.4. 直接向 socket 流写入数据\n\
  \n以下代码允许直接向 socket 流写入数据：\n\n```java\nOutputStream sockOut = socket.getOutputStream();\n\
  // 获取 socket 的写入输出流。\n// 我们直接使用它写入新字节。\nbyte[ ] buffer = new byte[1024];\nbuffer\
  \ = \"ABCD\".getBytes();\ntry {\n sockOut.write(buffer);\n// write(buffer) 写入缓冲区中的所有字节。\n\
  sockOut.flush();\n // flush() 应该强制将缓冲区内容写入流中（float）。\n// 不会等待缓冲区填充。\n sockOut.write(buffer,\
  \ 0, 2);\n// write(buffer, pos, nbre) 从指定的位置 (pos) \n// 写入数量（nbre）的字节。\n} catch\
  \ (IOException e) {}\n```\n\n`write` 和 `flush` 可能会引发特定的 `IOException`，即尝试向已关闭的流写入数据。\n\
  \n在接下来的段落中，我们将通过通过单个字符链传输各种数据。\n\n```java\ntry {\n  OutputStream sockOut = socket.getOutputStream();\n\
  \  byte[ ] buffer = new byte[1024];\n  String envoi = \"chain String\"+\" \"+(-1234)+\"\
  \ \"+12.34+\" \"+true;\n  buffer = envoi.getBytes();\n  sockOut.write(buffer, 0,\
  \ envoi.length());\n  sockOut.flush();\n} catch (IOException e) {}\n```\n\n####\
  \ 4.2.1.5. 直接读取 socket 流\n\n以下代码允许直接读取 socket 流：\n\n```java\nInputStream sockIn\
  \ = socket.getInputStream();\n// 获取 socket 的读取输入流。\nbyte[ ] buffer = new byte[1024];\n\
  int read;\ntry {\n  read = sockIn.read(buffer);\n// 读取流并将其存入缓冲区。返回读取的字节数。\nSystem.out.write(buffer,\
  \ 0, lu);\n// 在标准输出上显示缓冲区。\n} catch (IOException e) {}\n```\n\n流的结束可能是正常的（关闭写入），也可能是意外的（写入过程结束端断开）。\n\
  \n读取操作可能会引发 `IOException`。\n\n#### 4.2.1.6. 高级读写\n\n`DataOutputStream` 使得在所有系统上写入任何\
  \ Java 原始类型成为可能。\n\n以下代码以已知格式向 socket 写入数据：\n\n```java\nDataOutputStream sockDataOut\
  \ = null;\ntry {\nsockDataOut = new DataOutputStream(socket.getOutputStream());\n\
  sockDataOut.writeByte(6); //写入数字的第一个字节。\nsockDataOut.writeChar('c'); // 写入前两个字节对应的字符。\n\
  \ sockDataOut.writeBoolean(true); // 在一个字节上写入布尔值。\nsockDataOut.writeInt(-1234);\
  \ // 在四个字节上写入数字。\n sockDataOut.writeDouble(12.34); // 在八字节上写入双精度浮数。\n sockDataOut.flush();\
  \ // 如果存在缓冲区，应该强制将缓冲区内容写入流。\n sockDataOut.writeUTF(\"chaine String\"); // 写入字符串。\n\
  } catch (IOException e) {}\n```\n\n在所有系统上读取任何 Java 原始类型需要使用 `DataInputStream`。\n\
  \n从 socket 中以已知格式读取数据：\n\n```java\nDataInputStream sockDataIn = null;\ntry {\nsockDataIn\
  \ = new DataInputStream(socket.getInputStream());\nbyte b = sockDataIn.readByte();\
  \ // 读取数字的第一个字节。\nchar c = sockDataIn.readChar(); // 读取前两个字节对应的字符。\nboolean bool\
  \ = sockDataIn.readBoolean(); // 从一个字节上读取布尔值。\nint i = sockDataIn.readInt(); //\
  \ 在四个字节上读取数字。\ndouble d = sockDataIn.readDouble(); // 在八字节上读取双精度浮数。\nString s =\
  \ sockDataIn.readUTF(); // 读取字符串。\n} catch (IOException e) {}\n```\n\n流的关闭可能是正常的（关闭写入），也可能是意外的。\n\
  \n向 socket 写入文本：\n\n```java\nPrintWriter sockOut = new PrintWriter(socket.getOutputStream()));\n\
  sockOut.print(\"chaine String\");\nsockOut.print(1234);\nsockOut.print(12.34);\n\
  sockOut.println(true);\n```\n\n- – 创建连接到 `OutputStream` 的 `PrintWriter`。\n- – 我们可以使用\
  \ `print` 或 `println` 写入文本。\n- – 没有任何方法会引发 `Exceptions`。\n\n以下代码允许用户逐行读取 socket：\n\
  \n```java\ntry{\nBufferedReader sockReader = new BufferedReader(new InputStreamReader\n\
  (socket.getInputStream())))\nString line;\nwhile ((line = sockReader.readLine())\
  \ != null)\nSystem.out.println(line);\n```\n\n- – 创建连接到 `InputStream` 的 `BufferedReader`。\n\
  - – 我们可以使用 `readLine()` 读取字符链。\n- – `readLine()` 返回行，如果到达末尾则返回 `null`。\n\n#### 4.2.1.7.\
