    \ books will also be interesting for you:\n\nAmazon Echo\n\n![](img/1bfeb425e2a0f674df2bb5d88ed10690_4_0.png)\n\
    \n# C++\n\n![](img/1bfeb425e2a0f674df2bb5d88ed10690_5_0.png)\n\n# C++\n\n![](img/1bfeb425e2a0f674df2bb5d88ed10690_6_0.png)\n\
    \n# Javascript\n\n![](img/1bfeb425e2a0f674df2bb5d88ed10690_7_0.png)\n\n![](img/1bfeb425e2a0f674df2bb5d88ed10690_8_0.png)\n\
    \n![](img/1bfeb425e2a0f674df2bb5d88ed10690_9_0.png)\n\n# Introduction – Setting\
    \ Up Your Environment\n\n## Local Environment Setup\n\nYou will need to set up\
    \ an environment for Java programming language. This guide will show you where\
    \ to download and set up Java on your machine. Here is how you will set up your\
    \ Java environment:\n\nJava SE is always available for free from this link: http://www.oracle.com/technetwork/java/javase/downloads/index.jsp-138363.html.\n\
    \nThe version of Java to be downloaded will be based on the current operating\
    \ system that you are running.\n\nFollow the prompts to complete the download\
    \ of java then run the .exe, a wizard should open to assist your installation.\
    \ Once Java has been installed on the computer, next you will need to set variables\
    \ in the environment to path to create installation directories:\n\n### Setting\
    \ up the path for windows:\n\nAssuming Java has been installed in c:\\Program\
    \ Files\\java\\jdk directory:\n\n- Right-click on 'My Computer' and select 'Properties'.\n\
    - Click on the 'Environment variables' button under the 'Advanced' tab.\n- Alter\
    \ the 'Path' variable so it also contains the path to the Java executable. Example,\
    \ if the path is 'C:\\WINDOWS\\SYSTEM32', then change the path to read 'C:\\WINDOWS\\\
    SYSTEM32;c:\\Program Files\\java\\jdk\\bin'.\n\n## Popular Java Editors:\n\nA\
    \ text editor is essential for writing Java code. The following are the easiest\
    \ and most widely used:\n\n- Notepad: On Windows machine or TextPad.\n- Netbeans:\
    \ an open-source and free Java IDE\n- Eclipse: an eclipse community Java IDE\n\
    \n# Chapter 1 – Environment, Syntax, First Program\n\n## What is Java?\n\n![](img/1bfeb425e2a0f674df2bb5d88ed10690_12_0.png)\n\
    \nSun Microsystems took James Gosling's Java program and developed it into a multidimensional\
    \ platform, enhancing user experience with a myriad of web browsers. It was released\
    \ to the public in 1995 as Java 1.0. Some distinctive features of Java are that\
    \ it is:\n\n- Dynamic\n- Robust\n- Architectural neutral\n- High Performance\n\
    - Secure\n- Platform independent\n- Multi-threaded\n- Portable\n- Object Oriented\n\
    \nSetting up a Java Environment\n\nJavaSE is available for free at: http://www.oracle.com/technetwork/java/javase/downloads/index.jsp-138363.html.\
    \ It will be necessary to know what version of operating system you are running.\n\
    \n![](img/1bfeb425e2a0f674df2bb5d88ed10690_13_0.png)\n\n## Basic Syntax in Java:\n\
    \n- **Object** – An object is an instance within a class. Objects are made up\
    \ of states and behaviors. For example, horses have states such as breed, color,\
    \ and name.\n- **Class** – Something that allows objects to be classified into\
    \ few or many types.\n- **Method** – Easily, this can be explained as a behavior.\
    \ Action is executed by data that is contained in methods.\n- **Instant Variables**\
    \ – Like the example above, every object has its own individual variables. The\
    \ object's state is then manifested by unique values assigned to each.\n\n###\
    \ Starting Java Programming:\n\nLet us look at an easy piece of coding that will\
    \ print the words: 'Hello World!' To save the file, compile and then run the program.\
    \ Follow these steps:\n\n- Open notepad and add the code below.\n- Save the file\
    \ as: MyFirstProgram.java.\n- Start the command prompt and go to the directory\
    \ where you saved the class.\n- Type 'javac MyFirstProgram.java' and enter to\
    \ compile the code. If the code is error free, the command prompt will advance\
    \ to the next line.\n- Type 'java MyFirstProgram' to run your program. You will\
    \ be able to see 'Hello World!' printed on the window.\n\n```java\npublic class\
    \ MyFirstProgram {\n/* This is my first program */\n    public static void main(String\
    \ []args){\n    System.out.println(\"Hello World!\");\n}\n}\n```\n\nAlthough Java\
    \ can seem like a complicated language it is imperative to keep the following\
    \ points in mind as you work on your projects:\n\n- **Program File Name** – The\
    \ program file and the class name should be identical. Take care when saving the\
    \ file (reminder: java is case sensitive) and append '.java' to the end of the\
    \ file name. File names and class names that do not match will prevent your program\
    \ from compiling. Example: If 'MyFirstProgram' is the class name, the file should\
    \ be saved as 'MyFirstProgram.java'.\n- **Method Names** – Method names should\
    \ always start with a lowercase letter. When several words are used in the name\
    \ of the method, each interior word's beginning letter should be Upper Case. Example:\
    \ `public void myMethodName()`\n- **Case Sensitivity** - Java is case sensitive.\
    \ This means that identifiers **Happy** and **happy** have different meanings\
    \ in Java.\n- **public static void main(String args[])** - Java program with the\
    \ 'main()' method is a mandatory part of each java program.\n- **Class Names**\
    \ – The first letter of all classes should be in Upper Case. When several words\
    \ are used in a name, each inner word's first letter in Upper Case. Example `class\
    \ MyFirstProgram`\n\nThe simple program that was written on the prior page contains\
    \ all of these attributes and therefore is programming that Java can compile and\
    \ execute:\n\n```java\npublic class CreateObject {\n    public static void main(String[]\
    \ args) {\n        // create a point object and two rectangle objects\n      \
    \  Point origin_one = new Point(23, 94);\n        Rectangle rect_one = new Rectangle(origin_one,\
    \ 100, 200);\n        Rectangle rect_two = new Rectangle(90, 169);\n\n       \
    \ // display rect_one's width, height, and area\n        System.out.println(\"\
    Width of rect_one: \" + rect_one.width());\n        System.out.println(\"Height\
    \ of rect_one: \" + rect_one.height());\n        System.out.println(\"Area of\
    \ rect_one: \" + rect_one.area());\n\n        // set rect_two's position\n   \
    \     rect_two.origin = origin_one;\n\n        // display rect_two's position\n\
    \        System.out.println(\"X Position of rect_two: \" + rect_two.origin.x);\n\
    \        System.out.println(\"Y Position of rect_two: \" + rect_two.origin.y);\n\
    \n        // move rect_two and display its new position\n        rect_two.move(40,\
    \ 73);\n    }\n}\n```\n"
  mdcn: "\n\n# 安德鲁·霍夫曼\n\n![](img/1bfeb425e2a0f674df2bb5d88ed10690_0_0.png)\n\n# JAVA\n\
    快速掌握编程的最佳指南\n\n# Java\n\n快速掌握 Java 编程的最佳指南（Java 入门、小白级 Java、如何编程、Java 应用、Java\
    \ 编程）\n\n安德鲁·霍夫曼\n\n# 目录\n\n- 引言 – 设置你的环境\n- 本地环境搭建\n- 为 Windows 设置路径：\n- 流行的\
    \ Java 编辑器：\n- 第 1 章 – 环境、语法、第一个程序\n- 什么是 Java？\n- 第 2 章 – 标识符、修饰符与变量\n- Java\
