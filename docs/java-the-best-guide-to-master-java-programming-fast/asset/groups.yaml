    \ e1)\n{\n  // catch 块\n}\n```\n\n# 多 catch 块（Multiple Catch blocks）：\n\nTry 块后面可以跟随许多\
    \ catch 块。\n\n```\n多个 catch 块的语法如下所示：\ntry\n{\n  // 受保护代码\n}catch(ExceptionName\
    \ e1)\n{\n  // catch 块\n}catch(ExceptionName e2)\n{\n  // catch 块\n}catch(ExceptionName\
    \ e3)\n{\n  // catch 块\n}\n```\n\n# throws/throw 关键字：\n\n被检查的异常必须使用 `throws` 关键字声明。它出现在方法签名的末尾。\n\
    \n通过 `throw` 关键字可以抛出新实例化的异常，这可以增强对异常的理解。\n\n# finally 关键字：\n\n跟在 `try` 块后面的代码使用\
    \ `finally` 关键字。即使没有发生异常，`finally` 块也会执行。\n\n`finally` 块的执行如下所示：\n\n```java\n\
    try\n{\n  // 受保护代码\n}catch(ExceptionName e1)\n{\n  // catch 块\n}finally\n{\n \
    \ // finally 块始终执行。\n}\n```\n\n"
