    \ Java 程序中是如何运行的。\n\n# 第 6 章 – 方法、类、对象与 Finally\n\nJava 方法、类和对象：\n\n一组执行操作的语句集合，因为它们被组合在一起，所以我们称之为\
    \ Java 方法（Java Method）。例如，调用 `System.out.println` 会执行许多有序的语句将内容显示在屏幕上。\n\n通常，方法的语法如下所示：\n\
    \n```java\nmodifier returnTypeValue methodName(list of parameters) {\n// 方法体；\n\
    }\n```\n\n方法体和方法头构成了方法定义。以下所有项都是方法的一部分：\n\n-   **修饰符（Modifiers）：** 可选的修饰符指示编译器如何调用方法。方法的访问类型通过这种方式定义。\n\
    -   **返回值（Return Type）：** 某些方法会返回结果。`ReturnTypeValue` 定义为方法返回的数据类型。某些操作可以在不返回值的情况下执行。在这种情况下，`returnTypeValue`\
    \ 是关键字 `void`。\n-   **方法名：修饰符（Method Name: Modifiers）：** 修饰符是可选告诉编译器如何调用方法。这定义了方法的访问类型。\n\
    -   **返回值（Return Type）：** 方法可以返回结果。`returnTypeValue` 是方法返回的数据类型。某些方法在不返回值的情况下执行所需的操作。在这种情况下，`returnTypeValue`\
    \ 是关键字 `void`。\n-   **方法名（Method Name）：** 方法的实际名称。方法名和参数列表作为两项构成了方法签名（signature）。\n\
    \n# Java 类和对象\n\n-   **对象（Object）** - 对象是具有状态和行为的组件。例如：马有状态——品种、颜色、名字以及行为——奔跑、跳跃、觅食。对象是类的实例。\n\
    -   **类（Class）** - 类是模板或计划，描述了该类型对象所支持的行为和/或状态。\n\n类的语法在示例所示：\n\n```java\npublic\
    \ class Horse{\n  String color;\n  int age;\n  String breed;\n\n  void lame(){\n\
    }\n\n  void happy(){\n}\n\n  void lazy(){\n}\n```\n\n![](img/1bfeb425e2a0f674df2bb5d88ed10690_41_0.png)\n\
    \n类可以具有以下任何变量类型：\n\n-   **局部变量（Local variables）。** 定义在方法、块或构造函数内部的变量被称为局部变量。变量在方法内部进行初始化和声明。当引用的方法完成后，该变量将被销毁。\n\
    -   **实例变量（Instance variables）。** 这些是类内部、任何已方法之外的变量。这些实例变量在类加载时实例化。实例变量可以在定义类的任何方法、块或构造函数中访问。\n\
    -   **类变量（Class variables）。** 类变量声明在类内部、任何方法之外，并带有 `static` 关键字。\n\n# 异常处理（Exceptions\
