    # Introduction – Setting Up Your Environment


    # Local Environment Setup


    You will need to set up an environment for Java programming language. This guide
    will show you where to download and set up Java on your machine. Here is how you
    will set up your Java environment:


    Java SE is always available for free from this link: http://www.oracle.com/technetwork/java/javase/downloads/index.jsp-138363.html.


    The version of Java to be downloaded will be based on the current operating system
    that you are running.


    Follow the prompts to complete the download of java then run the .exe, a wizard
    should open to assist your installation. Once Java has been installed on the computer,
    next you will need to set variables in the environment to path to create installation
    directories:


    Setting up the path for windows:


    Assuming Java has been installed in c:\Program Files\java\jdk directory:


    +   - Right-click on ''My Computer'' and select ''Properties''.

    - Click on the ''Environment variables'' button under the ''Advanced'' tab.

    - Alter the ''Path'' variable so it also contains the path to the Java executable.
    Example, if the path is ''C:\WINDOWS\SYSTEM32'', then change the path to read
    ''C:\WINDOWS\SYSTEM32;c:\Program Files\java\jdk\bin''.


    # Popular Java Editors:


    A text editor is essential for writing Java code. The following are the easiest
    and most widely used:


    +   - Notepad: On Windows machine or TextPad.

    - Netbeans: an open-source and free Java IDE

    - Eclipse: an eclipse community Java IDE'
