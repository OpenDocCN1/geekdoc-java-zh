    - 算术运算符：\n- 关系运算符：\n- 位运算运算符：\n- 逻辑运算符：\n- 赋值运算符：\n- 第 4 章 附加运算符与循环\n- 第 5 章 If\
    \ 和 Switch 语句\n- if 语句：\n- 第 6 章 方法、类、对象与 Finally\n- 结论\n\n我认为新书可能对你感兴趣：\n\n亚马逊\
    \ Echo\n\n![](img/1bfeb425e2a0f674df2bb5d88ed10690_4_0.png)\n\n# C++\n\n![](img/1bfeb425e2a0f674df2bb5d88ed10690_5_0.png)\n\
    \n# C++\n\n![](img/1bfeb425e2a0f674df2bb5d88ed10690_6_0.png)\n\n# Javascript\n\
    \n![](img/1bfeb425e2a0f674df2bb5d88ed10690_7_0.png)\n\n![](img/1bfeb425e2a0f674df2bb5d88ed10690_8_0.png)\n\
    \n![](img/1bfeb425e2a0f674df2bb5d88ed10690_9_0.png)\n\n# 引言 – 设置你的环境\n\n## 本地环境搭建\n\
    \n你需要为 Java 编程语言设置一个环境。本指南将向你展示如何在机器上下载并设置 Java。以下是设置你的 Java 环境的方法：\n\n可以通过此链接免费获取\
    \ Java SE：http://www.oracle.com/technetwork/java/javase/downloads/index.jsp-138363.html。\n\
    \n下载的 Java 版本将取决于你当前运行的操作系统。\n\n按照提示完成 java 的下载，然后运行 .exe 文件，将弹出一个向导来协助你安装。一旦\
    \ Java 安装在计算机上，接下来你需要在环境变量中设置路径，以创建安装目录：\n\n### 为 Windows 设置路径：\n\n假设 Java 已安装在\
    \ c:\\Program Files\\java\\jdk 目录下：\n\n- 右键点击“我的电脑”并选择“属性”。\n- 点击“高级”选项卡下的“环境变量”按钮。\n\
    - 修改“Path”变量，使其也包含 Java 可执行文件的路径。例如，如果路径为 'C:\\WINDOWS\\SYSTEM32'，则将路径更改为 'C:\\\
    WINDOWS\\SYSTEM32;c:\\Program Files\\java\\jdk\\bin'。\n\n## 流行的 Java 编辑器：\n\n\
    文本编辑器对于编写 Java 代码至关重要。以下是最简单且最常用的：\n\n- 记事本：在 Windows 机器上或 TextPad。\n- Netbeans：开源免费的\
    \ Java IDE\n- Eclipse：Eclipse 社区版 Java IDE\n\n# 第 1 章 – 环境、语法、第一个程序\n\n## 什么是\
    \ Java？\n\n![](img/1bfeb425e2a0f674df2bb5d88ed10690_12_0.png)\n\nSun Microsystems\
    \ 采用了 James Gosling 的 Java 程序，并将其开发为一个多维度平台，通过无数网页浏览器增强了用户体验。它于 1995 年作为 Java\
    \ 1.0 向公众发布。Java 的一些独特特征是：\n\n- 动态性\n- 健壮\n- 架构中立\n- 高性能\n- 安全\n- 平台无关\n- 多线程\n\
    - 可移植\n- 面向对象\n\n设置 Java 环境\n\nJavaSE 可以在此处免费获取：http://www.oracle.com/technetwork/java/javase/downloads/index.jsp-138363.html。了解你运行的是什么版本的操作系统是必要的。\n\
    \n![](img/1bfeb425e2a0f674df2bb5d88ed10690_13_0.png)\n\n## Java 基础语法：\n\n- **对象\
    \ (Object)** – 对象是类中的实例。对象由状态和行为组成。例如，马有品种、颜色和名称等状态。\n- **类 (Class)** – 一种允许将对象分类为少数或许多类型的机制。\n\
    - **方法 (Method)** – 简单来说，这可以解释为一种行为。动作由方法中包含的数据执行。\n- **实例变量 (Instant Variables)**\
    \ – 如上例所示，每个对象都有自己独立的变量。对象的状态通过分配给每个变量的唯一值来体现。\n\n### 开始 Java 编程：\n\n让我们来看一段简单的代码，它将打印“Hello\
    \ World!”。要保存文件，请编译并运行程序。按照以下步骤操作：\n\n- 打开记事本并添加下面的代码。\n- 将文件保存为：MyFirstProgram.java。\n\
    - 命令提示符并进入保存该类的目录。\n- 输入 'javac MyFirstProgram.java' 并回车编译代码。如果代码没有错误，命令提示符将跳到下一行。\n\
    - 输入 'java MyFirstProgram' 运行你的程序。你将看到打印出的“Hello World!”。\n\n```java\npublic class\
    \ MyFirstProgram {\n/* 这是我的第一个程序 */\n    public static void main(String args){\n\
    \    System.out.println(\"Hello World!\");\n}\n```\n\n尽管 Java 看起来是一种复杂的语言，但在开发项目时务必记住以下几点：\n\
    \n- **文件名 (Program File Name)** – 程序文件名和类名必须相同。保存文件时注意（Java 是大小写敏感的）后缀 '.java'。文件名和类名不匹配会导致程序无法编译。例如：如果类名为\
    \ 'MyFirstProgram'，则文件应保存为 'MyFirstProgram.java'。\n- **方法名 (Method Names)** –\
    \ 方法名应以小写字母开头。方法中使用多个单词时，每个内部单词的首字母应大写。例如：`public void myMethod()`\n- **大小写敏感\
    \ (Case Sensitivity)** - Java 是大小写敏感的。这意味着标识符 **Happy** 和 **happy** 在 Java 中含义不同。\n\
    - **public static void main(String args[])** - Java 程序必须包含 'main()' 方法。\n- **类名\
    \ (Class Names)** – 所有类的首字母应大写。类名中使用多个单词时，每个内部单词的首字母应大写。例如 `class MyFirstProgram`\n\
    \n上一页编写的简单程序包含了所有属性，因此是 Java 可以编译和执行的：\n\n```java\npublic class CreateObject {\n\
    \    public static void main(String[] args) {\n        // 创建点对象和两个矩形对象\n     \
    \   Point origin_one = new Point(23, 94);\n        Rectangle rect_one = new Rectangle(origin_one,\
    \ 100, 200);\n        Rectangle rect_two = new Rectangle(90, 169);\n\n       \
    \ // 显示 rect_one 的宽度、高度和面积\n        System.out.println(\"Width of rect_one: \"\
    \ + rect_one.width());\n        System.out.println(\"Height of rect_one: \" +\
    \ rect_one.height());\n        System.out.println(\"Area of rect_one: \" + rect_one.area());\n\
    \n        // 设置 rect_two 的位置\n        rect_two.origin = origin_one;\n\n      \
    \  // 显示 rect_two 的位置\n        System.out.println(\"X Position of rect_two: \"\
    \ + rect_two.origin.x);\n        System.out.println(\"Y Position of rect_two:\
    \ \" + rect_two.origin.y);\n\n        // 移动 rect_two 并显示其新位置\n        rect_two.move(40,\
    \ 73);\n    }\n}\n```\n\n"
