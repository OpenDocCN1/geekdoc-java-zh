    \ outside of any method, with the static keyword.\n\n# Exceptions Handling:\n\n\
    Methods catching an exception that uses a combination of the **try** and **catch**\
    \ keywords. A try/catch block is arranged around code that may generate exceptions.\
    \ Protected code is found within a try/catch block.\n\nThe syntax for executing\
