  md: '# The Arithmetic Operators:


    | Operator | Description | Example |

    | --- | --- | --- |

    | + | Addition - Adds values on either side of the operator | A + B will give
    30 |

    | - | Subtraction - Subtracts right hand operand from left hand | A - B will give
    -10 |

    | * | Multiplication - Multiplies values on either side of the operator | A *
    B will give 200 |

    | / | Division - Divides left operand by right hand operand | B / A will give
    2 |

    | % | Modulus - Divides left operand by right hand operand and returns remainder
    | B % A will give 0 |

    | ++ | Increment - Increase the value of operand by 1 | B++ gives 21 |

    | -- | Decrement - Decrease the value of operand by 1 | B-- gives 19 |'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# The Relational Operators:


    | Operator | Description | Example |

    |---|---|--|

    | == | Checks if the value of two operands are equal or not, if yes then condition
    becomes true. | (A == B) is not true. |

    | != | Checks if the value of two operands are equal, if values are not equal
    then condition becomes true. | (A != B) is true. |

    | > | Checks if the value of left operand is greater than the value of right operand,
    if yes then condition becomes true. | (A > B) is not true. |

    | < | Checks if the value of left operand is less than the value of right operand,
    if yes then condition becomes true. | (A < B) is true. |

    | >= | Checks if the value of left operand is greater than equal to the value
    of right operand, if yes then condition becomes true. | (A >= B) is not true.
    |

    | <= | Checks if the value of left operand is less than or equal to the value
    of right operand, if yes then condition becomes true. | (A <= B) is true. |'
  merge: -1
  pgno: 26
