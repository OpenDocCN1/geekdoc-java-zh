    # Basic Syntax in Java:


    +   - **Object** – An object is an instance within a class. Objects are made up
    of states and behaviors. For example; horses have states, such as breed, color
    within that breed, and the name of the horse. Horses also exhibit behaviors like
    galloping, grazing, and playing.

    - **Class** – Simply, something that allows the objects to be classified. The
    class is the certain blueprint that objects of a the same states and behaviors
    fit into.

    - **Method** – Easily, this can be explained as a behavior. Generally, a class
    may contain few or many methods. Action is executed by data that has been manipulated
    by the logics that is contained in the methods.

    - **Instant Variables** – Like the horse in the example above, every object has
    its own, individual set of instant variables. The object''s state is then manifested
    by the unique values assigned to each of the instant variables.


    Starting Java Programming:'
