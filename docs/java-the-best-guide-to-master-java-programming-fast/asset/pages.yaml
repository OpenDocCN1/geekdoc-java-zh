  md: '# The Bitwise Operators:


    | Operator | Description | Example |

    | & | Binary AND Operator copies a bit to the result if it exists in both operands.
    | (A & B) will give 12 which is 0000 1100 |

    | | | Binary OR Operator copies a bit if it exists in either operand. | (A | B)
    will give 61 which is 0011 1101 |

    | ^ | Binary XOR Operator copies the bit if it is set in one operand but not both.
    | (A ^ B) will give 49 which is 0011 0001 |

    | ~ | Binary Ones Complement Operator is unary and has the effect of ''flipping''
    bits. | (~ A ) will give -61 which is 1100 0011 in 2''s complement due to a signed
    binary number. |

    | << | Binary Left Shift Operator. The left operands value moved by the number
    of bits specified by the right operand. | A << 2 will give 240 which is 1111 0000
    |

    | >> | Binary Right Shift Operator. The left operands value moved right by the
    number | A >> 2 will give 15 |'
