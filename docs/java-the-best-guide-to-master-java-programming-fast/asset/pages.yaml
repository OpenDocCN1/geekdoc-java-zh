  md: '# Conclusion


    The new J2 versions were renamed as Java SE, Java EE and Java ME respectively.
    Java is guaranteed to be Write Once, Run Anywhere.


    Java is:


    +   * Object Oriented: Java is comprised entirely of objects. Java can be extended
    with ease because of this object orientation.

    * Simple: Java is a learner and user friendly language. If Object Programming
    is familiar to you already, Java should be an easy stay for you to comprehend.

    * Secure: With public-key encrypted authentication techniques, Java has secure
    features that enable systems to be tamper and virus free.

    * Architectural-neutral: The architecturally-neutral nature of the Java compiler
    means that code that is compiled can be executed on many, varied processors with
    a congruent Java runtime

    * Platform independent: Nothing in Java is compiled to a specific platform the
    machine it is running on. Java is actually compiled as byte code that can run
    anywhere. This is a behavior that is unique to Java and not found in C or C++
    languages. The Java byte code on the web is deciphered by Virtual Machine and
    executed on the host computer.

    * Robust: Errors are common in any language coding, Java''s emphasis on error
    and compile runtime checking works to minimize if not do away with situations
    that are particularly error prone.

    * Multithreaded: Java''s multithreaded feature makes it to write programs that
    can multi-tasks simultaneously. A design feature that allows developers to construct
    smoothly running, interactive applications. As a program that features multiple
    threads it is possible in Java to write simultaneously multitasking'
