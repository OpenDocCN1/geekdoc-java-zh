  md: '# Reference Data Types:


    +   - Null is the default value of any reference variable.


    +   - Reference variables may be used to refer to any object specifically of the
    declared type, or any other compatible type.


    +   - Many types of array variables and class objects are ordered under the reference
    data type.


    +   - Reference variables are created using defined constructors classes. They
    are declared to be a specific type that is unchanging. For example, Daughter,
    Car etc.


    +   - Example: Car car = new car("Ferrari");


    ![](img/1bfeb425e2a0f674df2bb5d88ed10690_21_0.png)


    # Java Literals:


    Source code representations of single, fixed values is a literal. A literal is
    represented without any assigned to primitive type, directly in the code.


    Literals may be assigned to any primitive type. For example:


    ```

    byte a = 68;

    char a = ''A''

    ```'
