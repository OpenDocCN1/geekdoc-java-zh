  md: '# The Assignment Operators:


    | Operator | Description | Example |

    | --- | --- | --- |

    | = | Simple assignment operator, Assigns values from right side operands to left
    side | C = A + B will assign value of A + B into C |

    | += | Add AND assignment operator, adds right operand to the left operand and
    assign the result to left operand | C += A is equivalent to C = C + A |

    | -= | Subtract AND assignment operator, subtracts right operand from the left
    operand and assign the result to left operand | C -= A is equivalent to C = C
    - A |

    | *= | Multiply assignment operator, It multiplies right operand with the left
    operand and assign the result to left operand | C *= A is equivalent to C = C
    * A |

    | /= | Divide AND assignment operator, It divides left operand with the right
    operand and assign the result to left operand | C /= A is equivalent to C = C
    / A |

    | %= | Modulus assignment operator, It takes modulus using two operands and assign
    the result to left operand | C %= A is equivalent to C = C % A |

    | <<= | Left shift AND assignment operator | C <<= 2 is same as C = C << |'
