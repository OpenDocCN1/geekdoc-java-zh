    are part of a method:


    +   **Modifiers:** Optional modifiers instruct the compiler on how to call the
    method. The access type of the method is defined in this way.


    +   **Return Type:** Some methods return values. ReturnTypeValue is defined as
    the data type of the method returns. Some operations may be performed with out
    returning a value. This would be where the returnTypeValue is the keyword `void`.


    +   **Method Name: Modifiers:** The modifier, which is optional, tells the compiler
    how to call the method. This defines the access type of the method.


    +   **Return Type:** A method may return a value. returnTypeValue is the data
    type of the method returns. Some methods perform the desired operations without
    returning a value. In this case, the returnTypeValue is the keyword `void`.


    +   **Method Name:** The actual, real name of the method. Method'
