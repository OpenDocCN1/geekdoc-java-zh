  md: '# Chapter 2 – Identifiers, Modifiers & Variables


    Java Identifiers:


    Named components are part of the required Java formula. Identifiers are names
    that are used for items we have previously touched on, methods, classes and variables.


    There are a few key points that should always be remembered about identifiers:


    +   * First always: identifiers are case sensitive

    * Identifiers always begin (A to Z or a to z ), underscore (_), or currency characters
    ($)

    * Legal identifiers could be: age, $salary, _value, __6_value

    * No key words cannot be used as identifiers

    * Illegal identifiers would be exactly or similar to: 987zyx, -salary

    * After the first character, identifiers may contain any combination of characters


    Java Modifiers:


    ```

    C:\WINDOWS\system32\cmd.exe

    D:\javrogram\example>java ThisDeno.java

    D:\javrogram\example>java ThisDeno.java

    Employee Details:

    Employee Name: Biring Raka

    Employee''s Address: South Africa

    Employee''s salary: 26389

    Modified Employee Details:

    Employee Name: Biring Raka

    Employee''s Address: South Africa

    Employee''s salary: 34705

    D:\javrogram\example\>

    ```


    In Java methods, classes and other attributes may be changed or enhanced through
    utilization of modifiers. Modifiers used in Java have two categories:'
  merge: -1
