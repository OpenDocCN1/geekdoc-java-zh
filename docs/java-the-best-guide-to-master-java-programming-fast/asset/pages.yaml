  md: '+   * Non-access Modifiers: final, strictfp

    * Access Modifiers: protected, public, private, default


    Modifiers will begin to make more sense as more is learned about the Java language.


    # Java Variables:


    These variable types will often be seen in Java:


    +   * Class Variables (static variables)

    * Instance Variables (non-static variables)

    * Local Variables


    # Java Arrays:


    Any object that stores multiple variables of the same type is called an Array.
    An array is AN object. Again, as we delve further into the Java language need
    for array objects will arise for practical application.


    # Java Enums:


    Shorthand that recognizes the enumerated list of predefined values that were introduced
    with Java 5.0. The Enums restrict a variable''s values within the predefined list.


    Enums make it possible to decrease the number of bugs that appear in the code.


    By limiting the number of possible choices the number of outcomes is also being
    limited, by design. It is impossible to make a choice out of the predefined perimeters.


    If we limited order options for juicing to Small, Medium, Large as the only possible
    options for ordering juice code would look like this:


    ```

    class FreshJuice{

    enum FreshJuice{ SMALL, MEDIUM, LARGE }

    FreshJuice size;

    ```'
