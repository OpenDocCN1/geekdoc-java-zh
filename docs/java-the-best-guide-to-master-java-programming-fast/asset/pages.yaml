    to be executed more quickly and analytically.


    +   **Portable**:With no implementationally dependent aspects and total architectural
    neutrality, Java is a language that is completely portable. The Java compiler
    is programmed in ANSI C with a portability that is totally clean and a subset
    of POSIX.


    +   **High Performance**:High performance is guaranteed through the use of Just-In-Time
    compilers in Java.


    +   **Dynamic**:More dynamic than C or C++ Java has been designed to function
    in environments that are constantly evolving. Java programs often carry extensive
    amounts of runtime information which is is used to verify and resolve accesses
    to objects on run-time. Java programs are run-time heavy by design and use this
    information to resolve and verify accesses to all object that are on run-time.


    +   **Distributed**:Distribution on the internet is specifically what Java has
    been designed for. As browsers change so will Java as evidenced by the version
    revisions commonly seen.


