  \    error: function (jqXHR, textStatus, errorThrown) {\n      alert(“Error Status\
  \ Delete:”+textStatus);\n    }\n  });\n}\n```\n\n\n\n\n现在让我们转到服务开发上，它它由四个主要步骤组成：创建实体、创建数据访问层、创建业务服务层以及创建基于\
  \ JSON 的 REST。我们将从实体开始，一直构建到 REST 服务。\n\n### 开发资源（实体）层\n\n遵循测试驱动开发的方法，我们将先为实体编写测试，然后编写实体的实现。首先，创建两个带有\
  \ `Cart` 实体的 `Customer` 实例，接着进行更新和删除操作，最后测试是否还存在一个 `Customer` 实例。请注意，本质区别在于要在双向关系中以两种方式为\
  \ `Customer` 填充 `Cart`，同时也为 `Cart` 填充 `Customer`。\n\n```java\n@RunWith( SpringJUnit4ClassRunner.class\
  \ )\n\n@ContextConfiguration( locations = { “classpath:context.xml” } )\n\n@TransactionConfiguration(\
  \ defaultRollback = true )\n\n@Transactional\n\npublic class CustomerTest {\n\n\
  @Autowired\n\nprivate SessionFactory sessionFactory;\n\n@Test\npublic void testCRUD()\n\
  {\n\nCustomer customer1 = new Customer();\ncustomer1.setName(“Alex”);\n\nCart cart1\
  \ = new Cart();\ncart1.setAmount(500.0);\ncustomer1.setCart(cart1);\nsessionFactory.getCurrentSession().save(cart1);\n\
  \nCustomer customer2 = new Customer();\ncustomer2.setName(“Fred”);\n\nCart cart2\
  \ = new Cart();\ncart2.setAmount(700.0);\ncustomer2.setCart(cart2);\nsessionFactory.getCurrentSession().save(customer2);\n\
  \ncustomer1.setName(“Alex”);\ncart1 = customer1.getCart();\ncart1.setAmount(500.0);\n\
  customer1.setCart(cart1);\nsessionFactory.getCurrentSession().merge(customer1);\n\
  \nList<Customer> customers = sessionFactory.getCurrentSession()\n.createQuery(“select\
  \ customer from Customer customer order by customer.id desc”).list();\nAssert.assertEquals(2L,\
  \ customers.size());\n\nsessionFactory.getCurrentSession().delete(customer2);\n\n\
  customers = sessionFactory.getCurrentSession()\n.createQuery(“select customer from\
  \ Customer customer order by customer.id desc”).list();\nAssert.assertEquals(1L,\
  \ customers.size());\n\n}\n\n}\n```\n\n我们正在开发一个一对一双向关系，其中 `Customer` 是所有者，`Cart`\
  \ 是对应端，因此关系可以双向遍历，即从 `Customer` 可以访问 `Cart`，从 `Cart` 访问 `Customer`。首先，查看所有者（包含 `Cart`\
  \ 的 `@OneToOne` 实例的 `Customer`）。当一对一关系中的目标实体从关系中移除时，你应该将删除操作级联到目标实体。此类目标实体被视为“孤儿”，可以使用\
  \ `orphanRemoval` 属性来指定移除这些孤儿实体。\n\n```java\n@Entity\n@Table(name=”CUSTOMER”)\n\
  public class Customer {\n\nprivate Integer id ;\nprivate String name;\nprivate Cart\
  \ cart ;\n\n@Id\n@GeneratedValue(strategy=GenerationType.AUTO)\n@Column(name=”id”,length=20)\n\
  public Integer getId() {\nreturn id;\n}\n\npublic void setId(Integer id) {\nthis.id\
  \ = id;\n}\n\n@Column(name=”name”,length=50)\npublic String getName() {\nreturn\
  \ name;\n}\n\npublic void setName(String name) {\nthis.name = name;\n}\n\n@OneToOne(cascade=CascadeType.ALL,\
  \ orphanRemoval=true)\n@JoinColumn(name=”CART_ID”)\npublic Cart getCart() {\nreturn\
  \ cart;\n}\n\npublic void setCart(Cart cart) {\nthis.cart = cart;\n}\n\n}\n```\n\
  \n下一个实体是 `Cart`，它使用 `mappedBy` 属性包含对 `Customer` 的 `@OneToOne` ，该属性包含了 `Customer`\
  \ 实体中所使用的变量名。`mappedBy` 字段拥有关系，且仅指定在关联的反向端。\n\n```java\n@Entity\n@Table(name=”CART”)\n\
  public class Cart {\n\nprivate Integer id;\nprivate Double amount;\nprivate Customer\
  \ customer;\n\n@Id\n@GeneratedValue(strategy=GenerationType.AUTO)\n@Column(name=”id”,length=20)\n\
  public Integer getId() {\nreturn id;\n}\n\npublic void setId(Integer id) {\nthis.id\
  \ = id;\n}\n\n@Column(name=”amount”,length=20)\npublic Double getAmount() {\nreturn\
  \ amount;\n}\n\npublic void setAmount(Double amount) {\nthis.amount = amount;\n\
  }\n\n@OneToOne(mappedBy=”cart”)\npublic Customer getCustomer() {\nreturn customer;\n\
  }\n\npublic void setCustomer(Customer customer) {\nthis.customer = customer;\n}\n\
  \n}\n```\n\n### 表结构\n\n```sql\nCREATE TABLE Customer (\n    id INT PRIMARY KEY,\n\
  \    name VARCHAR(50),\n    cart_id INT\n);\n\nCREATE TABLE Cart (\n    id INT PRIMARY\
  \ KEY,\n    amount DOUBLE,\n    customer_id INT\n);\n```\n\n\n\n\n\n```java\nprivate\
  \ CustomerDao dao;\n\n@Test\npublic void testDelete() {\n    Customer customer1\
  \ = new Customer();\n    customer1.setName(“Alex”);\n    Cart cart1 = new Cart();\n\
  \    cart1.setAmount(300.0);\n    customer1.setCart(cart1);\n    dao.insert(customer1);\n\
  \    Customer customer2 = new Customer();\n    customer2.setName(“Fred”);\n    Cart\
  \ cart2 = new Cart();\n    cart2.setAmount(500.0);\n    customer2.setCart(cart2);\n\
  \    dao.insert(customer2);\n    Assert.assertEquals(2L, dao.getAll().size());\n\
  \    dao.delete(customer2);\n    Assert.assertEquals(1L, dao.getAll().size());\n\
  }\n```\n\n删除操作使用了下方所示 Hibernate 4 `Session.delete()` 方法。\n\n```java\npublic class\
  \ CustomerDaoImpl implements CustomerDao {\n    @Autowired\n    private SessionFactory\
  \ sessionFactory;\n\n    @Override\n    public void delete(Customer customer) {\n\
  \        sessionFactory.getCurrentSession().delete(customer);\n    }\n}\n```\n\n\
  最后，查看更新测试方法，该方法插入了一行、更新该行、获取所有记录并测试字段是否匹配。\n\n```java\npublic class CustomerDaoImplTest\
  \ {\n    @Autowired\n    private CustomerDao dao;\n\n    @Test\n    public void\
  \ testUpdate() {\n        Customer customer1 = new Customer();\n        customer1.setName(“Alex”);\n\
  \        Cart cart1 = new Cart();\n        cart1.setAmount(300.0);\n        customer1.setCart(cart1);\n\
  \        dao.insert(customer1);\n        Assert.assertEquals(1L, dao.getAll().size());\n\
  \        List<Customer> customers = dao.getAll();\n        Customer customer2 =\
  \ customers.get(0);\n        customer2.setName(“Fred”);\n        dao.update(customer2);\n\
  \        List<Customer> customers1 = dao.getAll();\n        Customer customer3 =\
  \ customers1.get(0);\n        Assert.assertEquals(“Fred”, customer3.getName());\n\
  \    }\n}\n```\n\n下方所示了更新数据访问操作，它使用了 Hibernate 4 `Session.merge()` 操作。\n\n```java\n\
  public class CustomerDaoImpl implements CustomerDao {\n    @Autowired\n    private\
  \ SessionFactory sessionFactory;\n\n    @Override\n    public void update(Customer\
  \ customer) {\n        sessionFactory.getCurrentSession().merge(customer);\n   \
  \ }\n}\n```\n\n### 开发业务服务层\n\n要开发业务服务层，首先查看获取所有记录操作的测试。\n\n```java\n@RunWith( SpringJUnit4ClassRunner.class\
  \ )\n@ContextConfiguration( locations = { “classpath:context.xml” } )\n@TransactionConfiguration(\
  \ defaultRollback = true )\n@Transactional\npublic class CustomerServiceImplTest\
  \ {\n    @Autowired\n    private CustomerService service;\n\n    @Test\n    public\
  \ void testFindAll() {\n        Assert.assertEquals(0L, service.findAll().size());\n\
  \    }\n}\n```\n\n在业务服务中，通过数据访问操作获取所有记录来编写相同的方法，并使用 mapper 将实体转换为数据传输对象（DTO）。\n\n\
  ```java\n@Service\n@Transactional\npublic class CustomerServiceImpl implements CustomerService\
  \ {\n    @Autowired\n    private CustomerDao dao;\n    @Autowired\n    private CustomerMapper\
  \ mapper;\n\n    @Override\n    public List<CustomerDto> findAll() {\n        List<CustomerDto>\
  \ customerDtos = new ArrayList<CustomerDto>();\n        List<Customer> customers\
  \ = dao.getAll();\n        for(Customer customer:customers) {\n            customerDtos.add(mapper.mapEntityToDto(customer));\n\
  \        }\n        return customerDtos;\n    }\n}\n```\n\n业务服务层使用数据访问对象，但数据访问层使用实体。Mapper\
  \ 通常包含两个重要的操作：将实体转换为数据传输对象，反之亦然。注意，每次当 `Customer` 重新构建时，`Cart` 标识符都会生成。\n\n```java\n\
  @Component\npublic class CustomerMapper {\n    public Customer mapDtoToEntity(CustomerDto\
  \ customerDto) {\n        Customer customer = new Customer();\n        Cart cart\
  \ = new Cart();\n        if(null!=customerDto.getId())customer.setId(customerDto.getId());\n\
  \        if(null!=customerDto.getName())customer.setName(customerDto.getName());\n\
  \        // ... 基于上下文的逻辑\n        return customer;\n    }\n}\n```\n（注：提供的 `CustomerMapper`\
  \ 源文本在提示词中已截截断，但其结构遵循要求的规则）。\n\n\n\n\n\n```java\ncustomerDto1.setName(\"Rose\");\n\
  \nservice.edit(customerDto1);\n\nList<CustomerDto> customerDtos = service.findAll();\n\
  \nCustomerDto customerDto2 = customerDtos.get(0);\n\nAssert.assertEquals(\"Rose\"\
  , customerDto2.getName());\n\n}\n\n```\n\n业务服务的匹配操作是 edit 操作，它在内部通过 mapper 转换后调用数据访问层的更新方法。请注意，edit\
  \ 操作不包含 `Cart` 实体的标识符，因此会生成一个新实例。\n\n```java\npublic class CustomerServiceImpl implements\
  \ CustomerService{\n\n@Autowired\n\nprivate CustomerDao dao ;\n\n@Autowired\nprivate\
  \ CustomerMapper mapper ;\n\n@Override\npublic void edit(CustomerDto customerDto)\
  \ {\n\ndao.update(mapper.mapDtoToEntity(customerDto));\n\n}\n\n}\n```\n\n### 开发表现层\n\
  \n堆栈中的最后一个层级是基于 REST 的 `Spring Controller`，我们将首先查看它的测试。测试创建了一个 `CustomerDto` 实例，随后对该同一实例进行检索和编辑。最后删除该实例。\n\
  \n```java\n@RunWith(SpringJUnit4ClassRunner.class)\n@WebAppConfiguration\n@ContextConfiguration(\
  \ locations = { \"classpath:context.xml\" )\n@TransactionConfiguration(defaultRollback\
  \ = true)\n@Transactional\npublic class CustomerControllerTest {\nprivate final\
  \ Gson gson = new GsonBuilder().setDateFormat(\"yyyy-MM-dd hh:mm:ss\").create();\n\
  @Resource\nprivate WebApplicationContext webApplicationContext;\nprivate MockMvc\
  \ mockMvc;\n@Before\npublic void setUp() {\n\nmockMvc = MockMvcBuilders.webAppContextSetup(webApplicationContext).build();\n\
  \n}\n\n@Test\npublic void testAll() throws Exception {\n\ntestCreate();\ntestUpdate();\n\
  \ntestDelete();\n\n}\n\npublic void testCreate() throws Exception {\n\nCustomerDto\
  \ customerDto1 = new CustomerDto();\ncustomerDto1.setName(\"Alex\");\ncustomerDto1.setAmount(200.0);\n\
  String json = gson.toJson(customerDto1);\nMockHttpServletRequestBuilder requestBuilderOne\
  \ = MockMvcRequestBuilders.post(\"/onetoonebidirectional/create\");\nrequestBuilderOne.contentType(MediaType.APPLICATION_JSON);\n\
  requestBuilderOne.content(json.getBytes());\n\nthis.mockMvc.perform(requestBuilderOne).andExpect(MockMvcResultMatchers.status().isOk());\n\
  \n}\n\npublic void testUpdate() throws Exception {\n\nMockHttpServletRequestBuilder\
  \ requestBuilder2 = MockMvcRequestBuilders.get(\"/onetoonebidirectional/findAll\"\
  );\nMvcResult result = this.mockMvc.perform(requestBuilder2).andReturn();\nString\
  \ response2 = result.getResponse().getContentAsString();\nType listType = new TypeToken<List<CustomerDto>>()\
  \ {}.getType();\nList<CustomerDto> customerDtos = gson.fromJson(response2, listType);\n\
  CustomerDto customerDto = customerDtos.get(0);\ncustomerDto.setAmount(400.0);\n\
  String json2 = gson.toJson(customerDto);\nMockHttpServletRequestBuilder requestBuilder3\
  \ = MockMvcRequestBuilders.post(\"/onetoonebidirectional/edit\");\nrequestBuilder3.contentType(MediaType.APPLICATION_JSON);\n\
  requestBuilder3.content(json2.getBytes());\n\nthis.mockMvc.perform(requestBuilder3).andExpect(MockMvcResultMatchers.status().isOk());\n\
  \n}\n\npublic void testDelete() throws Exception {\n\nMockHttpServletRequestBuilder\
  \ requestBuilder = MockMvcRequestBuilders.get(\"/onetoonebidirectional/findAll\"\
  );\nMvcResult result = this.mockMvc.perform(requestBuilder).andReturn();\nString\
  \ response2 = result.getResponse().getContentAsString();\nType listType = new TypeToken<List<CustomerDto>>()\
  \ {}.getType();\nList<CustomerDto> customerDtos = gson.fromJson(response2, listType);\n\
  CustomerDto customerDto = customerDtos.get(0);\nMockHttpServletRequestBuilder requestBuilder2\
  \ = MockMvcRequestBuilders.post(\"/onetoonebidirectional/remove/\"+customerDto.getId());\n\
  requestBuilder2.contentType(MediaType.APPLICATION_JSON);\n\nthis.mockMvc.perform(requestBuilder2).andExpect(MockMvcResultMatchers.status().is(204));\n\
  \n}\n\n}\n```\n\n互补的 REST `Spring Controller` 将与业务服务层进行通信，最终通过数据访问层连接数据库。代码与 mock\
  \ 服务类似，不同在于代码操作的是实际数据库，而不是内存中的目录。\n\n```java\n@Controller\n@RequestMapping(value=\"\
  /onetoonebidirectional\")\n@Transactional\npublic class CustomerController {\n@Autowired\n\
  private CustomerService service ;\n\n@RequestMapping(value=\"/findAll\", method=RequestMethod.GET)\n\
  public @ResponseBody List<CustomerDto> findAll(){\n\nreturn service.findAll();\n\
  \n}\n\n@RequestMapping(value=\"/findById/{customerid}\", method=RequestMethod.GET)\n\
  public @ResponseBody CustomerDto findById(@PathVariable(\"customerid\") Integer\
  \ customerid){\n\nreturn service.findById(customerid);\n}\n\n@RequestMapping(value=\"\
  /create\", method=RequestMethod.POST)\n@ResponseBody\npublic void creat(@RequestBody\
  \ CustomerDto customerDto){\n\nservice.create(customerDto);\n\n}\n\n@RequestMapping(value=\"\
  /remove/{customerid}\", method=RequestMethod.POST)\n@ResponseStatus(value = HttpStatus.NO_CONTENT)\n\
  public void remove(@PathVariable(\"customerid\") Integer customerid){\n\nservice.remove(customerid);\n\
  }\n\n@RequestMapping(value=\"/edit\", method=RequestMethod.POST)\n@ResponseBody\n\
  public void edit(@RequestBody CustomerDto customerDto){\n\nservice.edit(customerDto);\n\
  \n}\n\n}\n```\n\n我们将讨论如何将 REST 服务与实际用户界面集成。请注意，请求映射从 `/onetoonebidirectional/mock`\
  \ 变为 `/onetoonebidirectional`。\n\n### 总结\n\n在本章中讨论了以下内容：\n\n* 开发 mock 数据库\n* 开发\
  \ mock 用户界面\n* 开发具有一对双向关联的实体\n* 开发数据访问层\n* 开发业务服务层\n* 开发 REST 服务\n\n## 第 5 章 一一对自引用关系\n\
  \n一对一自引用关系是指指向自身实例的一对一关系。我们将展示熟悉的流程，从用户界面开始，然后是服务开发，最后将两者结合。读完本章后，你将能够从用户界面以及 REST\
  \ 服务角度完整执行一对一自引用关系。\n\n### 领域模型\n\n![Image](img/00013.jpeg)\n\n*图 5-1：一对一自引用关系*\n\
  \n我们到为止讨论了如何管理一对一单向和双向关系。让我们从观察图 5-1 所示的一一对自引用关联开始。在这里，`Student` 实体有一个标识符和一个 `String`\
  \ 类型的 `name` 字段。`Student` 可以有一个可选的 `mentor`（导师），导师也是一个 `Student`。因此，在一个 `Student`\
  \ 实例内部，可以关联另一个 `Student` 实例（导师）。我们将按照典型的脚本，首先从 mock 用户界面开始。\n\n### 开发用户界面\n\n在开发\
  \ mock 用户界面期间，我们关注的三个主要任务是数据传输对象、mock 服务和 mock 用户界面。我们将逐一查看它们。\n\n### 开发数据对象\n\n\
  数据传输对象不包含 `Student` 导师对象的标识符，因为一对一自引用关系的内部设计没有暴露给用户界面团队。在一个 Student 对象的实例中，只能有一个也是\
  \ Student 的导师对象。\n\n```java\npublic class StudentDto {\n\nprivate Integer id;\n\
  private String name;\nprivate String mentorName;\n\n // getters and setters\n\n\
  }\n\n```\n\n\n\n\n\n模拟服务将与一个内存自定义数据库交互以保存数据，该数据将被模拟用户界面消耗。我们将先从添加功能开始。我们有一个 `StudentDto`\
  \ 列表，每当有一个新条目时，就会向列表中添加一个包含 `Student` 和导师的 `StudentDto` 实例。内存数据库的实现使用了基于枚举的单例设计模式。标识符字段从\
  \ 1 开始，每计数一次递加 1。\n\n```java\npublic enum StudentInMemoryDB {\n    INSTANCE;\n\n\
  \    private static Integer lastId = 0;\n\n    private static List<StudentDto> list\
  \ = new ArrayList<StudentDto>();\n\n    public Integer getId() {return ++lastId;}\n\
  \n    public void add(StudentDto studentDto){\n        studentDto.setId(getId());\n\
  \        list.add(studentDto);\n    }\n}\n```\n\n现在让我们来看等效的模拟服务实现。`create` 方法接收来自用户界面的\
  \ `StudentDto` 实例，并通过模拟数据库增强列表。\n\n```java\n@Controller\n@RequestMapping(value=”/onetooneselfreference/mock”)\n\
  public class StudentMockController {\n    @RequestMapping(value=”/create”, method=RequestMethod.POST)\n\
  \    @ResponseBody\n    public void create(@RequestBody StudentDto student){\n \
  \       StudentInMemoryDB.INSTANCE.add(student);\n    }\n}\n```\n\n接下来，查看查找所有行和通过标识符查找的部分。\n\
  \n```java\npublic enum StudentInMemoryDB {\n    public List<StudentDto> findAll(){\
  \ return list; }\n\n    public StudentDto findById(Integer id) {\n        for(StudentDto\
  \ studentDto : list){ \n            if(studentDto.getId() == id) return studentDto;\n\
  \        }\n        return null ;\n    }\n}\n```\n\n在模拟服务中，查找所有行产生一个 `StudentDto`\
  \ 列表，通过标识符查找获取一个 `StudentDto` 实例。\n\n```java\n@Controller\n@RequestMapping(value=”/onetooneselfreference/mock”)\n\
  public class StudentMockController {\n    @RequestMapping(value=”/findAll”, method=RequestMethod.GET)\n\
  \    public @ResponseBody List<StudentDto> findAll(){\n        return StudentInMemoryDB.INSTANCE.findAll();\n\
  \    }\n\n    @RequestMapping(value=”/findById/{stuid}”, method=RequestMethod.GET)\n\
  \    public @ResponseBody StudentDto findById(@PathVariable(“stuid”) Integer stuid){\n\
  \        return StudentInMemoryDB.INSTANCE.findById(stuid);\n    }\n}\n```\n\n现在实现删除操作，该操作根据指定的标识符删除特定行。\n\
  \n```java\npublic enum StudentInMemoryDB {\n    public void remove(Integer id) {\n\
  \        StudentDto dto = null;\n        for(StudentDto studentDto : list){\n  \
  \          if(studentDto.getId() == id) {\n                dto = studentDto; \n\
  \                break;\n            }\n        }\n        if(null != dto) list.remove(dto);\n\
  \    }\n}\n```\n\n在类似的模拟服务中，消除操作根据作为 URL 响应传递的标识符删除特定行。\n\n```java\n@Controller\n\
  @RequestMapping(value=”/onetooneselfreference/mock”)\npublic class StudentMockController\
  \ {\n    @RequestMapping(value=”/remove/{stuid}”, method=RequestMethod.POST)\n \
  \   @ResponseStatus(value = HttpStatus.NO_CONTENT)\n    public void remove(@PathVariable“stuid”)\
  \ Integer stuid){\n        StudentInMemoryDB.INSTANCE.remove(stuid);\n    }\n}\n\
  ```\n\n用于更改行内容的编辑操作所示。\n\n```java\npublic enum StudentInMemoryDB {\n    public void\
  \ edit(StudentDto studentDto){\n        for(StudentDto dto : list){\n          \
  \  if(studentDto.getId() == dto.getId()){\n                dto.setName(studentDto.getName());\n\
  \                dto.setMentor(studentDto.getMentor()); \n                break;\n\
  \            }\n        }\n    }\n}\n```\n\n编辑操作接收修改后的 `StudentDto`拷贝并更新特定行。\n\n\
  ```java\n@Controller\n@RequestMapping(value=”/onetooneselfreference/mock”)\npublic\
  \ class StudentMockController {\n    @RequestMapping(value=”/edit”, method=RequestMethod.POST)\n\
  \    @ResponseBody\n    public void edit(@RequestBody StudentDto student){\n   \
  \     StudentInMemoryDB.INSTANCE.edit(student);\n    }\n}\n```# 开发用户界面\n\n我们在前面的部分看到了如何使用内存数据库开发模拟服务。现在我们将查看图\
  \ 2 所示的调用模拟服务的用户界面。该用户界面将具有添加、编辑和显示所有与 `Student` 相关记录（包括导师）的方法。\n\n![Image](img/0014.jpeg)\n\
  \n*图 5-2: 管理学生的用户界面*\n\nJSP 是加载的初始页面，之后调用 JavaScript 过程。我们将通过 JSP 概述流程。\n\n```html\n\
  <body onload=”loadObjects()”>\n<div id=”container”>\n    <div>\n        <p>\n  \
  \          <b>Student:</b>\n        </p>\n    </div>\n    <form method=”post” id=”studentForm”>\n\
  \        <table>\n            <tbody>\n                <tr>\n                  \
  \  <td>Name:</td>\n                    <td><input name=”stuid” id=”stuid” type=”hidden”>\
  \ <input\n                    name=”uname” type=”text”></td>\n                </tr>\n\
  \                <tr>\n                    <td class=”tdLabel”><label>Mentor Name:</label></td>\n\
  \                    <td><input type=”text” name=”mentor” id=”mentor” /></td>\n\
  \                </tr>\n                <tr>\n                    <td colspan=”2”><input\
  \ type=submit value=”Create”\n                    id=”subButton” onclick=”return\
  \ methodCall()”></td>\n                </tr>\n            </tbody>\n        </table>\n\
  \    </form>\n    <div id=”studentResponse”></div>\n</div>\n</body>\n```\n\n首先，我们将查看\
  \ `loadObjects` 方法，它在页面初始化时调用。\n\n```javascript\nfunction loadObjects(){\n    $.ajax({\n\
  \        url: ”/Spring-OODD/onetooneselfreference/mock/findAll”,\n        type:\
