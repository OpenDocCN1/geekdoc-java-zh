  \  });\n  return false;\n}\n```\n\n然后我们将保留 `update` Javascript 方法，它保留了一个包含标识符、`name`\
  \ 和 `parent` 的 `CategoryDto`。\n\n```javascript\nfunction update(){\n  var name =\
