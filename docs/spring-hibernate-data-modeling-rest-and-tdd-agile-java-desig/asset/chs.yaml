  \ new Student();\n    student2.setName(“Michel”);\n    Student mentor2 = new Student();\n\
  \    mentor2.setName(“Mac”);\n    student2.setMentor(mentor2);\n    sessionFactory.getCurrentSession().save(student2);\n\
