  \ Status Create:”+textStatus);\n        }\n    });\n    return false;\n}\n```\n\n\
  我们将查看 `update` JavaScript 方法。\n\n```javascript\nfunction update(){\n```\n\n\n\n\n\
  \n```javascript\nvar name = $(“#stuname”).val();\nvar id = $(“#stuid”).val();\n\
  var mentor = $(“#mentor”).val();\nvar formData={“id”:id,”name”:name,”mentorName”:mentor};\n\
  \n$.ajax({\n  url : “/Spring-OODD/onetooneselfreference/mock/edit”,\n  type: “POST”,\n\
