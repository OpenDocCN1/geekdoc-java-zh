  \    error: function (jqXHR, textStatus, errorThrown) {\n      alert(“Error Status\
  \ Delete:”+textStatus);\n    }\n  });\n}\n```\n\n### 开发服务\n\n下一步是实际的服务开发，它涉及四个主要步骤——创建实体、创建数据访问层、创建业务服务层以及创建基于\
  \ JSON 的 REST 服务。我们将从实体开始，从下而上开发到 REST 服务。\n\n### 开发资源（实体）层\n\n作为一种实践，我们遵循测试驱动开发（TDD）方法，因此我们首先为实体编写测试，然后编写实体的实现代码。首先，创建两个\
  \ `Student` 实例，并为每个学生实例挂载 `Mentor` 实例，最后检查是否有四个 `Student` 实例，如下代码所示。检查实例名称是否可以被更新以及删除。\n\
  \n```java\n@RunWith( SpringJUnit4ClassRunner.class )\n@ContextConfiguration( locations\
  \ = { “classpath:context.xml” } )\n@TransactionConfiguration( defaultRollback =\
  \ true )\n@Transactional\npublic class StudentTest {\n  @Autowired\n  private SessionFactory\
