  \ clientAccountDto) {\n        ClientAccountDto toRemove = null;\n        for (ClientAccountDto\
  \ dto:list) {\n            if (dto.getClientDto().getId() == clientAccountDto.getClientDto().getId()\
  \ \n                && dto.getAccountDto().getId() == clientAccountDto.getAccountDto().getId())\
