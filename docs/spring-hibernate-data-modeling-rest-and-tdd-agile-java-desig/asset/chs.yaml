  \ implements EmployeeService {\n    @Override\n    public void edit(EmployeeDto\
  \ employeeDto) {\n        employeeDao.update(employeeMapper.mapDtoToEntity(employeeDto));\n\
  \    } \n}\n```\n\n### 开发表示层\n\n栈中的最后一层是基于 REST 的 Spring Controller。首先，我们将查看如何编写测试，然后是相应的控制器。\n\
