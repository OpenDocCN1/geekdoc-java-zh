  \ categories.size());\n  }\n}\n```\n\n我们正在开发一对多的自引用关系。`Category` 实例可能有一个父级，根节点除外。请注意父级可以通过\
  \ `@ManyToOne` 与多个类别共享。\n\n```java\n@Entity\n@Table(name=”CATEGORY”)\npublic class\
  \ Category {\n  private Integer id;\n  private String name;\n  private Category\
  \ category ;\n\n  @Id\n  @GeneratedValue(strategy=GenerationType.AUTO)\n  @Column(name=”id”,length=20)\n\
  \  public Integer getId() {\n    return id;\n  }\n  public void setId(Integer id)\
  \ {\n    this.id = id;\n  }\n\n  @Column(name=”name”,length=20)\n  public String\
