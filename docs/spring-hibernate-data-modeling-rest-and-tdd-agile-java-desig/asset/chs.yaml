  \ 更改为 `/onetomanyselfreference/`。剩余的任务包括以 mock 用户界面为参考，编写实际的用户界面。\n\n### 总结\n\n\
  在本章中，我们讨论了以下内容：\n\n* 开发 mock 内存数据库\n* 开发 mock 用户界面\n* 开发与一对多自引用关联关联的实体\n* 开发数据访问层\n\
  * 开发业务服务层\n* 开发一个 REST 服务控制器。\n\n# 第四部分：管理多对多关系\n\n![Image](img/00005.jpeg)\n\n\
  ## 第 9 章：多对多单向关系\n\n在本章中，我们将详细介绍如何管理多对多的单向关系。按照手稿中的流程，我们最初将查看用户界面，然后是 REST 服务包。\n\
  \n### 领域模型\n\n![Image](img/00021.jpeg)\n\n*图 9-1：多对多单向关系*\n\n我们已经在之前的章节中看到了如何管理一对多的关系的不同形式。在本章中，我们将查看如图\
  \ 9-1 所示的多对多单向关联。`User` 实体有一个标识符和一个类型为 `String` 的名称字段。`Group` 实体也有一个标识符和一个 `String`\
  \ 类型的字段。每个多对多关系都有一个所有者。在这个例子中，`User` 是所有者。在 `User` 实例中，必须链接一个或多个 `Group` 实例，而这些\
  \ `Group` 实体反过来被许多 `User` 实体共享。由于关系是单向的，你可以从 `User` 遍历 `Group` 列表，但不允许进行反向遍历。我们将遵循常规通道，先编写\
  \ mock 用户界面，然后是真实的服务。\n\n### 开发用户界面\n\n在 mock 用户界面演变过程中，我们关注的三个关键任务是创建数据传输对象（DTO）、mock\
  \ 服务和 mock 用户界面。我们将按顺序逐一进行。\n\n### 开发数据传输对象\n\n`UserDto` 数据传输对象包含一个标识符和用户名。同样，`GroupDto`\
  \ 对象也有一个标识符和一个名称。连接对象 `UserGroupDto` 包含 `UserDto` 和 `GroupDto` 的实例。\n\n```java\n\
  public class UserDto {\n    private Integer id;\n    private String name;\n    //\
