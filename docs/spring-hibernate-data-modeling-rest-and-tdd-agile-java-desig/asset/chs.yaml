  \ class StudentController {\n\n    @Autowired\n    private StudentService service\
  \ ;\n\n    @RequestMapping(value=\"/findAll\", method=RequestMethod.GET)\n    @ResponseBody\
  \ List<StudentDto> findAll() {\n        return service.findAll();\n    }\n\n   \
  \ @RequestMapping(value=\"/findById/{stuid}\", method=RequestMethod.GET)\n    @ResponseBody\
  \ StudentDto findById(@PathVariable(\"stuid\") Integer stuid) {\n        return\
  \ service.findById(stuid);\n    }\n\n    @RequestMapping(value=\"/create\", method=RequestMethod.POST)\n\
  \    @ResponseBody\n    public void create(@RequestBody StudentDto student) {\n\
  \        service.create(student);\n    }\n\n    @RequestMapping(value=\"/remove/{stuid}\"\
  , method=RequestMethod.POST)\n    @ResponseStatus(value = HttpStatus.NO_CONTENT)\n\
  \    public void remove(@PathVariable(\"stuid\") Integer stuid) {\n        service.remove(stuid);\n\
  \    }\n\n    @RequestMapping(value=\"/edit\", method=RequestMethod.POST)\n    @ResponseBody\n\
  \    public void edit(@RequestBody StudentDto student) {\n        service.edit(student);\n\
  \    }\n}\n```\n\n列表的最后一步是将 REST 服务与真实的用户界面集成。注意请求映射从 `/onetooneselfreference/mock`\
  \ 变为 `/onetooneselfreference`。剩余部分是使用 mock 用户界面作为参考编写真实的用户界面。\n\n### 总结\n\n在本章中我们讨论了：\n\
  \n*   开发 mock 内存数据库\n*   开发 mock 用户界面\n*   开发与一对自关联相关的实体\n*   开发数据访问层\n*   开发业务服务层\n\
  *   开发 REST 服务控制器。\n\n# 第三部分. 管理多对多关系\n\n## 第 6 章 多对多单向关系\n\n\n\n\n\n一对多单向关系是一种具有从父对象到子对象的引用，但反则没有的一对多关系。我们将遵循习惯的流程：从用户界面开始，然后是服务开发，最后在章节末尾整合这两个模块。紧跟本章节将使你能够掌握用户界面以及与一对多单向关系相关的\
  \ REST 服务。\n\n### 领域模型\n\n![Image](img/00015.jpeg)\n\n图 6-1：一对多单向关系\n\n在之前的章节中，我们已经学习了如何管理不同形式的一对一关系。在本章节中，我们将看到如\
  \ `Figure 6-1` 所示的一对多单向关联。`Person` 实体有一个标识符和一个类型为 `String` 的名称字段。`Phone` 实体也有一个标识符和一个\
  \ `String` 类型的号码字段。在 `Person` 的一个实例中，必须关联一个或多个 `Phone` 实例。同样地，在 `Phone` 的实例中，必须链接一个\
  \ `Person` 实例。由于该关系是单向的，你可以从 `Person` 遍历 `Phones` 列表，但不允许反向遍历。我们将遵循先编写模拟用户界面，然后编写真实服务的模式。\n\
  \n### 开发用户界面\n\n在模拟用户界面增长过程中，我们关注的三个关键任务是创建数据传输对象（DTO）、模拟服务和模拟用户界面。我们将顺序逐一进行。\n\n\
  ### 开发数据传输对象\n\n`Person` 数据传输对象包含标识符、人的姓名以及一个 `String` 号码列表。`Phone` 对象的标识符对调用者是的，尽管一个\
  \ `Person` 实例可以拥有一个或多个 `Phone` 号码。这种设计理念是为了由于复杂性而不暴露数据库设计，并让调用者易于理解 API。\n\n```java\n\
  public class PersonDto {\n  private Integer id;\n  private String name;\n  private\
  \ List<String> numbers;\n\n  // getters and setters\n}\n```\n\n#### 开发模拟服务\n\n模拟服务将与内存约定数据库连接网络以保存数据，这些数据将由模拟用户界面消费。我们首先查看\
  \ `add` 功能。我们有一个 `PersonDto` 列表，每有一个新实例，就会有一个带有 `Person` 和电话号码的 `PersonDto` 实例添加到列表中。内存数据库执行遵循使用\
  \ `enum` 的单例设计模式。标识符字段从 1 开始，每有一个新条目增加 1。\n\n```java\npublic enum PersonInMemoryDB\
  \ {\n  INSTANCE;\n\n  private static Integer lastId = 0;\n  private static List<PersonDto>\
  \ list = new ArrayList<PersonDto>();\n\n  public Integer getId() {\n    return ++lastId;\n\
  \  }\n\n  public void add(PersonDto personDto) {\n    personDto.setId(getId());\n\
  \    list.add(personDto);\n  }\n}\n```\n\n现在看模拟服务的实现。`create` 方法从用户界面收集一个 `PersonDto`\
  \ 实例，并通过模拟数据库附加列表。\n\n```java\n@Controller\n@RequestMapping(value=\"/onetomanyunidirectional/mock\"\
  )\npublic class PersonMockController {\n  @RequestMapping(value=\"/create\", method=RequestMethod.POST)\n\
  \  @ResponseBody\n  public void create(@RequestBody PersonDto personDto) {\n   \
  \ PersonInMemoryDB.INSTANCE.add(personDto);\n  }\n}\n```\n\n接下来，我们将进行 `find all\
  \ rows` 和 `find with identifier` 部分。\n\n```java\npublic enum PersonInMemoryDB {\n\
  \  public List<PersonDto> findAll() {\n    return list;\n  }\n\n  public PersonDto\
  \ findById(Integer id) {\n    for(PersonDto personDto : list) {\n      if(personDto.getId()\
  \ == id) return personDto;\n    }\n    return null;\n  }\n}\n```\n\n在模拟服务中，`find\
  \ all rows` 生成一个 `PersonDto` 列表，而 `find with identifier` 契约一个 `PersonDto` 实例。`find\
  \ all rows` 返回嵌入在“内存数据库”中的列表。`find with identifier` 服务匹配内存列表中的每个 `PersonDto` 实例并返回匹配的对象。\n\
  \n```java\npublic class PersonMockController {\n  @RequestMapping(value=\"/findAll\"\
  , method=RequestMethod.GET)\n  public @ResponseBody List<PersonDto> findAll() {\n\
  \    return PersonInMemoryDB.INSTANCE.findAll();\n  }\n\n  @RequestMapping(value=\"\
  /findById/{personid}\", method=RequestMethod.GET)\n  public @ResponseBody PersonDto\
  \ findById(@PathVariable(\"personid\") Integer personid) {\n    return PersonInMemoryDB.INSTANCE.findById(personid);\n\
  \  }\n}\n```\n\n接下来，我们将实现 `remove` 操作，它根据列出的标识符删除特定行。遍历内存列表以找到与提供的标识符匹配的 `PersonDto`。当找到匹配项时，该实例从内存列表中删除。\n\
  \n```java\npublic enum PersonInMemoryDB {\n  public void remove(Integer id) {\n\
  \    PersonDto dto = null;\n    for(PersonDto personDto : list) {\n      if(personDto.getId()\
  \ == id) { dto = personDto; break; }\n    }\n    if(null != dto) { list.remove(dto);\
  \ }\n  }\n}\n```\n\n在相应的模拟服务中，`exclude` 操作根据作为 URL 参数提供的提供的定义的标识符删除特定行。该标识符被传递给内存数据库的\
  \ `remove` 操作。\n\n```java\npublic class PersonMockController {\n  @RequestMapping(value=\"\
  /remove/{personid}\", method=RequestMethod.POST)\n  @ResponseStatus(value = HttpStatus.NO_CONTENT)\n\
  \  public void remove(@PathVariable(\"personid\") Integer personid) {\n    PersonInMemoryDB.INSTANCE.remove(personid);\n\
  \  }\n}\n```\n\n接下来，看负责更新行的 `edit` 操作。名称和号码集将根据 `PersonDto` 中的标识符进行更新。\n\n```java\n\
  public enum PersonInMemoryDB {\n  public void edit(PersonDto personDto) {\n    for(PersonDto\
  \ dto : list) {\n      if(dto.getId() == personDto.getId()) {\n        dto.setName(personDto.getName());\n\
  \        dto.setNumbers(personDto.getNumbers());\n      }\n    }\n  }\n}\n```\n\n\
  `edit` 操作接受一个已更改的 `PersonDto` 副本并更新特定行。\n\n```java\npublic class PersonMockController\
  \ {\n  @RequestMapping(value=\"/edit\", method=RequestMethod.POST)\n  @ResponseBody\n\
  \  public void edit(@RequestBody PersonDto personDto) {\n    PersonInMemoryDB.INSTANCE.edit(personDto);\n\
  \  }\n```\n\n### 开发用户界面\n\n既然我们已经学习了如何使用内存数据库编写模拟服务，让我们编写使用该模拟服务的用户界面。该用户界面将具有添加、编辑、删除与\
  \ `Person` 相关记录的功能，包括电话号码。用户界面的截图见 `Figure 6-2`。\n\n![Image](img/00016.jpeg)\n\n\
  图 6-2：Person 和电话用户界面\n\nJSP body 是初始加载的页面，之后会调用 JavaScript。我们将先从 JSP 片段开始，然后是 JavaScript\
