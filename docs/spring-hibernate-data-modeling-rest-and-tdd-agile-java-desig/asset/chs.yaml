  \ mock 用户界面构建出实际的用户界面。\n\n### 总结\n\n在本章中，我们讨论了以下内容：\n\n* 开发 mock 内存数据库\n* 开发 mock\
  \ 用户界面\n* 开发与带有连接属性的多对多自引用关联的实体\n* 开发数据访问层\n* 开发业务服务层\n* 开发一个 REST 服务控制器。\n\n# 第五部分：管理继承关系\n\
  \n![Image](img/00005.jpeg)\n\n## 第 14 章：单表继承\n\n本章是关于使用单表继承关系开发的入门指南。我们将继续在开始时创建用户界面的旅程，然后编写真实的服务。最后，我们将整合这两个解决方案并得出一个合理的结论。\n\
  \n### 领域模型\n\n![Image](img/00031.jpeg)\n\n*图 14-1：单表继承关系*\n\n不同类型的对象之间可能存在共同点。面向对象的编程允许类继承共同的属性和方法，这被称为**继承**。泛化是从一组相关的类中提取共享属性和方法并形成一个通用的超类的艺术。另一方面，特化意味着形成一个具有特定于子类的属性和方法的子类。在本章中，我们将研究在对象关系建模中处理继承的第一种方法。从单表继承关系开始，如图\
  \ 14-1 所示。`Protocol` 实体有一个标识符、一个名称以及名为 `discriminator` 的字段，该字段表示 SNMP 和 TCP 之间的区别。这里泛化的超类是\
  \ `Protocol`，特化的子类是 `SNMP` 和 `TCP`。让我们先讨论如何开发用户界面。\n\n### 开发用户界面\n\n我们将用户界面的开发分为三个主要任务：数据传输对象、mock\
  \ 服务和 mock 用户界面。我们将逐一查看这些任务。\n\n### 开发数据传输对象\n\n数据传输对象包含 `ProtocolDto`，它拥有一个标识符和一个名称。`ProtocolDto`\
  \ 有两个子类型，称为 `TCPDto` 和 `SNMPDto`。`@JsonTypeInfo` 注解用于表示多态类型以及用于序列化和反序列化类型信息的元数据类型。`@JsonSubTypes`\
  \ 注解用于表示可序列化多态类型的子类型。\n\n```java\n@JsonTypeInfo(use = JsonTypeInfo.Id.NAME, include\
  \ = JsonTypeInfo.As.PROPERTY, property = \"type\")\n@JsonSubTypes({\n    @Type(value\
  \ = TCPDto.class, name = \"tcp\"),\n    @Type(value = SNMPDto.class, name = \"snmp\"\
  )\n})\npublic class ProtocolDto {\n    private Integer id;\n    private String name;\n\
  \    // getters and setters\n}\n\npublic class TCPDto extends ProtocolDto {\n}\n\
