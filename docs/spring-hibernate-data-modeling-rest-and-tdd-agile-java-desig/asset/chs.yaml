  \ 方法也显示。\n\n```javascript\nfunction processResponse(responsedata){\n    var dynamicTableRow=”<table\
  \ border=1>\n    <tr>\n        <th>Name</th>\n        <th>Mentor</th>\n        <th>Actions</th>\n\
  \    </tr>”;\n    var dataRow=””;\n    $.each(responsedata, function(itemno, itemvalue){\n\
  \        dataRow=dataRow+“<tr>\n        <td>”+itemvalue.name+”</td>\n        <td>”+itemvalue.mentorName+”</td>\n\
