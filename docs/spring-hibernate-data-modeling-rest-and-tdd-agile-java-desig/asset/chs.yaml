  \ 设施。我们将从底向上开始，从实体一直到 REST 服务。\n\n### 开发资源（实体）层\n\n首先，我们创建两个带有电话号码的 `Person` 实例，并检查这两个\
  \ `Person` 实例。接下来，我们进行更新并测试更改是否已反映。最后，我们删除其中一个并测试计数是否变为唯一。\n\n```java\n@RunWith(\
  \ SpringJUnit4ClassRunner.class )\n@ContextConfiguration( locations = { “classpath:context.xml”\
  \ } )\n@TransactionConfiguration( defaultRollback = true )\n@Transactional\npublic\
  \ class PersonTest {\n  @Autowired\n  private SessionFactory sessionFactory;\n\n\
  \  @Test\n  public void testCRUD() {\n    Person p1 = new Person();\n    p1.setName(“Alex”);\n\
  \    List<Phone> phones = new ArrayList<Phone>();\n    Phone ph1 = new Phone();\n\
  \    ph1.setNumber(“7798989138”);\n    Phone ph2 = new Phone();\n    ph2.setNumber(“7798989169”);\n\
  \    phones.add(ph1);\n    phones.add(ph2);\n    p1.setPhones(phones);\n    sessionFactory.getCurrentSession().save(p1);\n\
  \n    Person p2 = new Person();\n    p2.setName(“Fred”);\n    List<Phone> phones2\
  \ = new ArrayList<Phone>();\n    Phone phone1 = new Phone();\n    phone1.setNumber(“8836987”);\n\
