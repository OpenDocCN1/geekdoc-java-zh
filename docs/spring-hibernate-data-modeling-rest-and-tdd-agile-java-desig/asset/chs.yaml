  update();\n\n}\n\nreturn false;\n\n}\n```\n\n观察 `create` JavaScript 方法如何从姓名和电话号码获取输入，并构建一个\
  \ `PersonDto` JSON 对象作为参数传递给模拟创建服务。姓名从输入框中获取，而一组电话号码则从具有名称“phone”的元素中推送到一个数组中。\n\
  \n```javascript\nfunction create(){\n\nvar name = $(“#name\").val();\n\nvar numbers\
