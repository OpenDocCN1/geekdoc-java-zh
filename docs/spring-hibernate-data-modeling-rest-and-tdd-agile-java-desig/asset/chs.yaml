  \n### 总结\n\n在本章中，我们讨论了以下内容：\n\n*   开发 mock 内存数据库\n*   开发 mock 用户界面\n*   开发与一对多单向关联的实体\n\
  *   开发数据访问层\n*   开发业务服务层\n*   开发 REST 服务控制器。\n\n## 第 7 章\\. 一对多的双向关系\n\n**领域模型**\n\
  \n**![Image](img/00017.jpeg)**\n\n*图 7-1: 一对多的双向关系*\n\n\n\n\n在本章中，我们将演示一个一对多的双向关系，如图\
  \ 7-1 所示。`Item` 实体有一个标识符和一个类型为 `String` 的名称字段。`Feature` 实体也有一个标识符和一个 `String` 类型的数字字段。在\
  \ `Item` 的一个实例中，必须关联一个或多个 `Feature` 实例。同样，在 `Feature` 的一个实例中，必须链接一个 `Item` 实例。由于该关系是双向的，你可以从\
  \ `Item` 遍历 `Features` 列表，也可以从 `Feature` 实例跳转到对应的 `Item`。我们将首先介绍通过模拟用户界面编写的经典通道，然后是简单易懂的服务。\n\
  \n### 开发用户界面\n\n在演进模拟用户界面的过程中，我们研究的三个重要任务是：创建数据传输对象、模拟服务和模拟用户界面。\n\n### 开发数据传输对象\n\
  \n`Item` 数据传输对象包含一个标识符、`Item` 的名称以及一个 `String` 类型的 Feature 名称列表。`Feature` 对象的标识符对调用方界面界面隐藏的，因为我们希望让用户界面团队的\
  \ API 调用变得更加简单。此外，另一个设计理念是不由于复杂性而不暴露数据库设计，并且不参与子对象的标识符管理。\n\n```java\npublic class\
  \ ItemDto {\n\n    private Integer id;\n\n    private String name;\n\n    private\
  \ List<String> featureList;\n\n    // getters and setters\n\n}\n```\n\n#### 开发模拟服务\n\
  \n模拟服务将与一个内存自定义数据库交互以保存数据，该数据将被模拟用户界面消费。我们将从添加功能开始。我们有一个 `ItemDto` 列表，每当有一个新主题时，一个具有项目名称和特性名称的\
  \ `ItemDto` 实例会被添加到列表中。内存存储实现采用了使用 `enum` 的单例设计模式。标识符字段从 1 开始，每有一个新计数递增 1。\n\n```java\n\
  public enum ItemInMemoryDB {\n\n    INSTANCE;\n\n    private static List<ItemDto>\
  \ list = new ArrayList<ItemDto>();\n\n    private static Integer lastId = 0;\n\n\
  \    public Integer getId() {\n        return ++lastId;\n    }\n\n    public void\
  \ add(ItemDto itemDto) {\n        itemDto.setId(getId());\n        list.add(itemDto);\n\
  \    }\n\n}\n```\n\n现在让我们来看等效的模拟服务实现。`create` 方法从用户界面收集一个 `ItemDto` 实例并通过模拟文件增强列表。\n\
  \n```java\n@Controller\n@RequestMapping(value=\"/onetomanybidirectional/mock\")\n\
  public class ItemMockController {\n\n    @RequestMapping(value=\"/create\", method=RequestMethod.POST)\n\
  \    @ResponseBody\n    public void creat(@RequestBody ItemDto itemDto) {\n    \
  \    ItemInMemoryDB.INSTANCE.add(itemDto);\n    }\n}\n```\n\n接下来，我们将确保查找所有行和根据标识符片段查找。\n\
  \n```java\npublic enum ItemInMemoryDB {\n\n    public List<ItemDto> findAll() {\n\
  \        return list;\n    }\n\n    public ItemDto findById(Integer id) {\n    \
  \    for(ItemDto itemDto : list) {\n            if(itemDto.getId() == id)\n    \
  \            return itemDto;\n        }\n        return null;\n    }\n}\n```\n\n\
  在模拟包中，随后查找所有行获取一个 `ItemDto` 列表，而根据标识符约定查找则获取一个 `ItemDto` 实例。\n\n```java\npublic\
  \ class ItemMockController {\n\n    @RequestMapping(value=\"/findAll\", method=RequestMethod.GET)\n\
  \    public @ResponseBody List<ItemDto> findAll() {\n        return ItemInMemoryDB.INSTANCE.findAll();\n\
  \    }\n\n    @RequestMapping(value=\"/findById/{itemid}\", method=RequestMethod.GET)\n\
  \    public @ResponseBody ItemDto findById(@PathVariable(\"itemid\") Integer itemid)\
  \ {\n        return ItemInMemoryDB.INSTANCE.findById(itemid);\n    }\n}\n```\n\n\
  接下来，我们将实现删除操作，该操作根据记录的标识符删除特定行。\n\n```java\npublic enum ItemInMemoryDB {\n\n   \
  \ public void remove(Integer id) {\n        ItemDto dto = null;\n        for(ItemDto\
  \ itemDto : list) {\n            if(itemDto.getId() == id) {\n                dto\
  \ = itemDto;\n                break;\n            }\n        }\n        if(null\
  \ != dto){list.remove(dto);}\n    }\n}\n```\n\n在等效的模拟服务中，删除操作根据 URL 提供的唯一标识符移除特定行。\n\
  \n```java\npublic class ItemMockController {\n\n    @RequestMapping(value=\"/remove/{itemid}\"\
  , method=RequestMethod.POST)\n    @ResponseStatus(value = HttpStatus.NO_CONTENT)\n\
  \    public void remove(@PathVariable(\"itemid\") Integer itemid) {\n        ItemInMemoryDB.INSTANCE.remove(itemid);\n\
  \    }\n}\n```\n\n最后，我们提供编辑操作，负责更新行。\n\n```java\npublic enum ItemInMemoryDB {\n\n\
  \    public void edit(ItemDto itemDto) {\n        for(ItemDto dto : list) {\n  \
  \          if(dto.getId() == itemDto.getId()) {\n                dto.setName(itemDto.getName());\n\
  \                dto.setFeatureList(itemDto.getFeatureList());\n            }\n\
  \        }\n    }\n\n}\n```\n\n独有的编辑操作接受修改后的 `ItemDto` 副本并根据差异更新特定行。\n\n```java\n\
  public class ItemMockController {\n\n    @RequestMapping(value=\"/edit\", method=RequestMethod.POST)\n\
  \    @ResponseBody\n    public void edit(@RequestBody ItemDto itemDto) {\n     \
  \   ItemInMemoryDB.INSTANCE.edit(itemDto);\n    }\n```\n\n### 开发用户界面\n\n我们在上一个节中检查了如何通过内存存储编写模拟服务。现在我们决定如何通过内存存储编写用户界面。用户界面将包含添加、编辑和删除功能。用户界面的截图如图\
