  \ REST 服务\n\n## 第 11 章 多对多带属性的双向关系\n\n在本章中，我们将详细介绍如何处理属性的多对多关系。按照书籍的流程，我们将首先查看用户界面，然后是\
  \ REST 服务。\n\n### 领域模型\n\n![Image](img/0025.jpeg)\n\n*图 11-1：带属性的多对多关系*\n\n`Manuscript`\
  \ 实体具有标识符和名称，`Author` 实体也如此。多对多关系需要一个所有者，即 `Manuscript`。在 `Manuscript` 实例中必须有一个\
  \ `Author` 字段，这些 `Author` 实例可以被多个 `Manuscript` 共享。由于关系是双向的，你可以从 `Manuscript` 遍历\
  \ `Authors` 列表，反之亦然。`publisher` 是关系的属性，而不是 `Author` 或 `Manuscript` 的属性。\n\n### 开发用户界面\n\
  \n在开发期间，我们需要进行的三个活跃任务是创建数据传输对象、mock 服务以及 mock 用户界面。\n\n### 开发数据传输对象\n\n`ManuscriptDto`\
  \ 数据传输对象具有标识符和名称。同样，`AuthorDto` 对象也有标识符和名称。连接对象 `ManuscriptAuthorDto` 拥有 `ManuscriptDto`\
  \ 和 `AuthorDto` 实例，以及类型为 `String` 的 `publisher`。\n\n### 开发 mock 服务\n\n我们不会描述 `Manuscript`\
  \ 和 `Author` 对象的管理，因为在之前的章节中已经多次看到。我们只需要如何管理 `Manuscript` 和 `Author` 之间的链接。mock\
  \ 服务将与自定义内存数据库集成，该数据库将供 mock 用户界面使用。我们将从添加功能开始。我们有一个 `ManuscriptAuthorDto` 列表，每有一条新记录都会向列表添加一个包含\
  \ `ManuscriptDto`、`AuthorDto` 以及发布者的 `ManuscriptAuthorDto` 实例。\n\n\n\n\n```java\n\
  public enum ManuscriptAuthorInMemoryDB {\n    INSTANCE;\n\n    private static List<ManuscriptAuthorDto>\
  \ list = new ArrayList<ManuscriptAuthorDto>();\n\n    public void add(ManuscriptAuthorDto\
  \ manuscriptAuthorDto) {\n        list.add(manuscriptAuthorDto);\n    } \n}\n```\n\
  \n现在让我们来评估模拟服务的实现。`create` 方法从用户界面添加 `ManuscriptAuthorDto` 实例，并使用模拟数据库增加列表。\n\n\
  ```java\n@Controller\n@RequestMapping(value=\"/manytomanybidirectionalwithjoinattribute/manuscriptauthor/mock”)\n\
  public class ManuscriptAuthorMockController {\n    @RequestMapping(value=\"/create”,\
  \ method=RequestMethod.POST)\n    @ResponseBody\n    public void create(@RequestBody\
  \ ManuscriptAuthorDto manuscriptAuthorDto){\n        ManuscriptAuthorInMemoryDB.INSTANCE.add(manuscriptAuthorDto);\n\
  \    } \n}\n```\n\n接下来我们将进入查询所有行的部分。\n\n```java\npublic enum ManuscriptAuthorInMemoryDB\
  \ {\n    public List<ManuscriptAuthorDto> findAll() {\n        return list;\n  \
  \  }\n}\n```\n\n在模拟服务中，此阶段查询所有行会产生一个 `ManuscriptAuthorDto` 列表。\n\n```java\npublic\
  \ class ManuscriptAuthorMockController {\n    @RequestMapping(value=\"/findAll”,\
  \ method=RequestMethod.GET)\n    public @ResponseBody List<ManuscriptAuthorDto>\
  \ findAll(){\n        return ManuscriptAuthorInMemoryDB.INSTANCE.findAll();\n  \
  \  }\n}\n```\n\n接下来我们将设计删除操作，通过程序定义的标识符删除特定行。\n\n```java\npublic enum ManuscriptAuthorInMemoryDB\
  \ {\n    public void remove(ManuscriptAuthorDto manuscriptAuthorDto) {\n       \
  \ ManuscriptAuthorDto toRemove = null;\n        for (ManuscriptAuthorDto dto:list)\
  \ {\n            if (dto.getManuscriptDto().getId()==manuscriptAuthorDto.getManuscriptDto().getId()\n\
  \            && dto.getAuthorDto().getId()==manuscriptAuthorDto.getAuthorDto().getId())\
  \ {\n                toRemove = dto;\n            }\n        }\n        if (toRemove!=null)\
  \ list.remove(toRemove);\n    }\n}\n```\n\n在相关的模拟服务中，`remove` 操作通过作为 URL 附件提供的唯一标识符消除特定行。\n\
  \n```java\npublic class ManuscriptAuthorMockController {\n    @RequestMapping(value=\"\
  /remove”, method=RequestMethod.POST)\n    @ResponseStatus(value = HttpStatus.NO_CONTENT)\n\
  \    public void remove(@RequestBody ManuscriptAuthorDto manuscriptAuthorDto){\n\
  \        ManuscriptAuthorInMemoryDB.INSTANCE.remove(manuscriptAuthorDto);\n    }\n\
  }\n```\n\n我们随后创建了 `isPresent` 操作，负责检查是否存在匹配的行。\n\n```java\npublic enum ManuscriptAuthorInMemoryDB\
  \ {\n    public boolean isPresent(ManuscriptAuthorDto manuscriptAuthorDto) {\n \
  \       for (ManuscriptAuthorDto dto:list) {\n            if (dto.getManuscriptDto().getId()\
  \ == manuscriptAuthorDto.getManuscriptDto().getId() \n            && dto.getAuthorDto().getId()\
  \ == manuscriptAuthorDto.getAuthorDto().getId()) {\n                return true;\n\
  \            }\n        }\n        return false;\n    } \n}\n```\n\n`isPresent`\
  \ 操作接收 `ManuscriptAuthorDto` 的副本并检查是否存在交集实例。\n\n```javascript\npublic class ManuscriptAuthorMockController\
  \ {\n    @RequestMapping(value=\"/isPresent”, method=RequestMethod.POST)\n    public\
  \ @ResponseBody boolean isPresent(@RequestBody ManuscriptAuthorDto manuscriptAuthorDto){\n\
  \        return ManuscriptAuthorInMemoryDB.INSTANCE.isPresent(manuscriptAuthorDto);\n\
  \    } \n}\n```\n\n### 开发模拟用户界面\n\n我们在上一节中学习了如何使用内存列表演进模拟服务。现在我们选择如何开发图 11-2 所示的用户界面，该界面将消耗此模拟服务。我们将讨论与连接相关的用户界面部分，因为\
