- "# Spring, Hibernate、数据建模、REST 与 TDD：敏捷 Java 设计与开发\n\n\n\n![](img/cover.jpeg)\n\n\
  \n\n\n\n\n各章节包含了完整源代码的片段，因此我认为为读者提供完整的源代码将很有用。我强烈建议读者亲自动手，并实现此书中描述的所有代码。经验丰富的架构师和开发者可以根据自己的判断跳过。书中涵盖的整个应用程序的\
  \ Github 地址为：[`github.com/Spring-Hibernate-Book/spring-hibernate-datamodeling-tdd-rest`](http://github.com/Spring-Hibernate-Book/spring-hibernate-datamodeling-tdd-rest)。下载不需要密码。\n\
  \n`Appendix`（附录）包含了开发应用程序时使用的软件安装信息。在本书出版时，这些版本可能已经升级，因此仅提供了名称。可以下载最新的可用版本，但可能需要进行少量的调整。\n\
  \n祝您好运连，阅读愉快！\n\n# 第一部分：数据驱动开发简介\n\n![Image](img/00005.jpeg)\n\n## 第 1 章 架构\n\n\
  在本章中，我们将涵盖形成软件架构的核心要素，特别是基于 REST 的架构。我们首先将看看什么是软件架构。然后，我们将介绍如何为 RESTful Web 服务选择框架、Web\
  \ 框架、业务层技术以及持久化机制。最后，我们将回顾一些流行的模式和最佳实践，并展望书中涵盖的应用程序架构。其目的是为本章之后关于 REST 架构风格的数据驱动开发的讨论奠定背景。\n\
  \n### 什么是软件架构？\n\n软件架构表示软件系统的层次级构建块。就像现实世界中的架构一样，软件架构定义了软件组件的高级系统结构、创建组件层次结构的规范以及对该结构的文档化。它还形成了一套架构设计决策，这些决策决定了结构及其背后的原理。在产品开发初期，架构师会创建一个软件架构，该架构是根据业务需求转换而来的技术需求的设计和开发的基础。\n\
  \n当我们观察软件开发是如何开始的时，主要看到的关注点在于所需的功能和数据驱动流。然而，现代应用开发扩展了对质量属性的关注，例如扩展性、可靠性、性能、可伸性、维护性、可用性、安全性、后兼容性和易用性。这些质量属性在很大程度上驱动着软件架构，并被称为非功能性需求。随着时间的推移，功能性和非功能需求演出了许多架构模式和风格。软件架构通常基于这些经过验证的架构机制之一构建在坚实的基础之上。糟糕的架构可能会暴露风险，例如系统不稳定、无法执行即时或未来的业务需求，或者在生产环境中难以管理。\n\
  \n当架构师最初研究要开发的新系统需求时，他应该首先检查用例是否可以使用已建立的架构模式进行设计和实现。因为在项目后期更改架构的时间和金钱成本通常非常高，所以初始阶段非常重要。在创建软件架构时必须非常小心，因为它不仅成本高昂，而且难以更改，可能会让您的应用程序面临风险。\n\
  \n软件架构除了基本功能外还应该有很多目标。它应该是灵活的，并能够适应新的业务需求和挑战。例如，一个开发中的系统可能具有一年内注册用户数量翻倍的需求。架构的每个模块或组件都应该具有单一职责或内聚功能的聚合。特定组件不应该感知其他组件或模块的细节。应该避免重复，并且特定功能应在一个且仅在一个相关的模块中实现。\n\
  \n利益相关者之间的通信是良好架构的另一个关键。与软件架构计划一样，有经过验证的模式和最佳实践可以赖以获得最佳成功。减少复杂性的流行方法是引入关注点分离和视图，这些可以通过特定的利益相关者来处理。\n\
  \n现代产品开发不允许前期的、大规模的设计；它推崇使用敏捷方法将设计拆分为更易管理的部分。它还应该通过建模技术和可视化对系统进行分析来降低风险。例如，系统可以使用企业级建模工具（如\
  \ Enterprise Architect 或 Rational Rose）进行草拟。整个团队可以并行工作，使用这些工具描述设计和架构。最后，开发的架构可以通过经过验证的技术进行评估，例如软件架构分析方法\
  \ (SAAM)。SAAM 是第一个文档记录在案的软件架构分析方法，开发于 20 世纪 90 年，用于分析非功能性需求和变更灵活性。对这些技术的深入讨论超本书的范围。\n\
  \n### 什么是 REST？\n\nREST（REpresentation State Transfer，表现状态转移）是网络系统的架构风格，例如 Web 应用程序。REST\
  \ 首次由 Roy Fielding 在 2000 年的博士论文中提出，他是 HTTP 规范的编写者之一。REST 是一种简单的无状态架构，通常运行在 HTTP\
  \ 之上。一个良好的 REST 原则是：客户端和服务器之间的请求交互在本质上是无状态的。每个请求都能够通信处理该请求所需的所有信息。在服务器端，所有请求通过通用资源标识符\
  \ (URI) 识别。URI 对于 Web 应用程序来说应该是唯一的。可以使用标准的 HTTP 方法，如 `POST`、`GET`、`DELETE` 和 `PUT`。REST\
  \ 架构很好地扩展到大量的客户端请求，因为它在本质上是轻量级的并简化了客户端与服务器之间的交互。我们还将查看一些 REST 概念，如资源、表示、连接器和组件。在\
  \ HTTP 上实现 REST 时，可以使用全局标识符访问资源。表示是代表资源当前状态的文档。组件是一段软件指令，其状态可以通过暴露的接口进行修改。连接器调解组件之间的通信。\n\
  \n### RESTful Web 服务的框架\n\n有三个流行的 RESTful Web 服务框架：Jersey、Restlet 和 Spring。Jersey\
  \ RESTful Web Services 是一个用于 Java 开发 RESTful 服务的开源框架，支持 JAX-RS API（由 Oracle 的 Java\
  \ EE 7 JAX-RS 规范组成 `JSR 311` & `JSR 339`）。Jersey 是参考实现。Restlet 是一个 Java 平台的轻量级开源\
  \ REST 框架。Restlet API 直接从 REST 概念（资源、表示、连接器、组件、媒体类型、语言）派生类名称，表明人们能够以 REST 的方式思考并更容易地将解决方案转化为代码。第三个构建\
  \ RESTful Web 服务框架是 Spring 框架，REST 支持无缝地整合到 Spring MVC 中。在书中，我们将重点关注使用 Spring 框架构建\
  \ REST 服务。\n\n### Web 框架\n\n\n\n\n目前有两种主要的 Web 开发方法：服务端 MVC 和客户端 MVC。服务端 MVC 在服务器上渲染所有页面。此类框架的流行示例包括\
  \ Java Server Faces (JSF)、Oracle ADF、JBoss Seam 和 `Spring MVC`。客户端 MVC 将 Java Server\
  \ Pages (JSP) 和 `jQuery` 结合 REST API 结合在一起。可以使用 `jQuery` 的特化（专用）形式，如 `Angular` 和\
  \ `Backbone`，并可以使用 `Spring REST` 支持开发 REST API。在本书中，我们将广泛使用客户端 MVC。我们将使用 `JSP` 和\
  \ `jQuery` 构建用户界面，并使用 `Spring MVC` 来构建表示层。客户端 MVC 和服务端 MVC 的本质区别在于，客户端 MVC 由客户端处理大部分逻辑，而服务端\
  \ MVC 由服务器处理大部分逻辑。\n\n### 业务层技术\n\nJava EE 7 讨论了实现业务层的两种主要技术选择。第一种方法是使用会话豆（session\
  \ beans），企业 Java Beans (`JSR 345`)。第二种方法是使用 Java Web Services API (`JAX-WS 2.2`)。第三种方法是\
  \ `Spring` 框架提供的非 JEE 方法。`Spring` 框架提供了一个名为 `@Service` 的注解，在书中广泛用于业务服务。\n\n### 持久化机制\n\
  \n持久化是在持久性存储（如磁盘）中存储对象的能力。Java EE 7 主要为实现 Web 应用的持久化层提供了两种机制。第一种方法是使用 Java Connectivity\
  \ API (`JDBC`) 查询和更新数据。第二种方法是使用 Java Persistence API (`JPA`)，它描述了关系数据的管理。在这里，我们将使用\
  \ `Hibernate` 实现的第二种方法，即 `JPA` 规范，并刻意避免使用 `Hibernate` 特有的注解。\n\n### 原生应用 vs 移动浏览器\n\
  \n一个主要的 {决策是使用客户端 MVC。采用这种架构的一个重要原因是由于客户端 MVC 具有更好的性能、易用性和可访问性，而移动浏览器（如 Windows\
  \ 和 Blackberry）可以使用 HTML5 和 CSS3。对于 Android 和 iPhone 设备的应用开发，这应该是一个重要的决策；但最终，原生应用总是会带来更大的用户满意度和支持。\n\
  \n### 本书使用的架构\n\n在本章中，我们处理了基于 Java 的项目最常用的架构——`Spring` 和 `Hibernate` 基于。从 `Spring`\
  \ 的角度，我们将查看 `Spring Web MVC`、`Spring Core` 和 `Hibernate` 基于持久化。\n\n![Image](img/00006.jpeg)\n\
  \n*图 1-1: 架构*\n\n图 1-1 解释了本书遵循的架构。我尝试从自底部的视角解释该架构。实体使用 `Hibernate` 进行管理，它是事务性的。数据访问层由\
  \ `Spring` 管理，业务服务层也由 `Spring` 实现，用于管理子系统。表示层包含基于 REST 的 `Spring Controllers` 来暴露服务。用户界面是\
  \ Java Server Pages (`JSP`) 和基于 `jQuery` 的系统。Android、iPhone 和移动浏览器等流行的用户界面在书中未涵盖，但可以使用相同的服务进行开发。本书的理念是展示关系的管理模式，而不是深入安全等非功能性需求。\n\
  \n### 流行模式和最佳实践\n\n书中使用了许多选定的模式和最佳实践。业务对象（Business Object）模式用于使用对象模型分离业务数据和业务逻辑。业务对象表示领域模型且不包含任何业务逻辑。数据访问对象（Data\
  \ Access Object）模式用于封装对底层数据源的调用，同时也管理数据源的连接以检索和存储数据。会话外观模式（Session Façade pattern）被用作外观，以封装工作流中业务对象之间的交互复杂性。请注意，会话外观模式在单个事务中调用一个或多个数据访问对象来存储和检索数据。对会话外观的调用是使用数据传输对象完成的，它通过映射器（mapper）转换为业务对象。数据传输对象用于跨层传输数据。基于\
  \ REST 的 Web 服务模式用于发现多个用户界面调用的服务。\n\n### 测试驱动开发\n\n本书彻底涵盖了测试驱动开发，这是敏捷开发的最佳实践。在这种方法中，开发者首先编写测试，该测试起初会失败，因为所需的功能或改进不存在。然后开发者编写最少量的代码来通过测试，最后重构代码以达到接受的标准。请注意，测试用例之间不应该相互依赖，并且可以任何顺序执行。此外，测试用例不应基于对系统任何状态的假设（如硬编码的标识符）。一个常见的错误是不尊重测试代码。你的测试代码应该像生产代码一样受到尊重，并且在正例和反例情况下都能正常工作。\n\
  \n### 总结\n\nREST 架构为 Java EE 应用生成简单、高效、可扩展、可靠、安全且可扩展的设计。由于其轻量级、简单以及通过 HTTP 传输数据的能力，RESTful\
  \ Web Services 已成为基于 SOAP 的 Web 服务的绝替代方案。实现 `AJAX` 框架的 `jQuery` 与使用 `Spring MVC`\
  \ 实现的 RESTful Web Services 完美契合。在接下来的章节中，我们将从以关系数据建模为例的之旅开始，实现上述架构的不同层。\n\n## 第\
  \ 2 章。管理独立实体\n\n本章介绍了使用独立实体进行开发的整个过程。紧随本章将使你了解应用程序层的设计，以及开发和单元测试技术。首先，我们将查看模拟用户界开发，然后转向\
  \ REST 服务的开发。我们将以数据建模场景为例，并构建应用程序的所有层。在本章中，我们取了一个独立实体的例子，并将构建所有层以展示如何管理该实体。\n\n\
  ### 领域模型\n\n\n\n当用户界面团队开始工作时，他们还没有准备就绪的服务。因此，他们必须创建一个带有内存数据库的模拟服务。我们将用户界面的开发分为三个主要任务：数据传输对象、模拟服务和模拟用户界面。请记住，模拟用户界面将与真实的用户界面完全相同，只是数据库是模拟的。当服务开发团队准备好与用户界面团队集成时，我们将用真实的服务替换模拟服务。\n\
  \n### 开发数据传输对象\n\n数据传输对象（DTO）充当用户界面与数据访问对象层之间的映射器。内部的数据库设计不应对用户界面可见；因此需要使用数据传输对象进行映射。\n\
  \n```java\npublic class ProductDto implements Serializable {\n    private static\
  \ final long serialVersionUID = 1L;\n    private Integer id;\n    private String\
  \ name;\n    // getters and setters\n}\n```\n\n#### 开发模拟服务\n\n模拟服务是一个基于 Spring JSON\
  \ 的控制器，它将数据保存到内存数据库中。让我们从向数据库进行简单的添加操作开始。内存数据库的设计基于单例模式，并根据最佳实践使用 `ENUM` 来实现。标识符字段从\
  \ 1 开始，并在连续的添加中每次加 1。\n\n```java\npublic enum ProductInMemoryDB{\n    INSTANCE;\n\
  \    private static List<ProductDto> list = new ArrayList<ProductDto>();\n    private\
  \ static Integer lastId = 0;\n    public Integer getId() { return ++lastId; }\n\
  \    public void add(ProductDto productDto) {\n        productDto.setId(getId());\n\
  \        list.add(productDto);\n    }\n}\n```\n\n使用这个内存数据库，我们将查看使用 `@Controller`\
  \ 注解的 Spring 控制器。`@RequestMapping` 注解用于映射 URL，在此实例中为 `/standalone/mock`，它应用于类中的所有方法。`ProductMockController`\
  \ 类中创建的方法具有 URL `/standalone/mock/create`，接受 POST 请求。还要注意，该方法被标记了 `@ResponseBody`\
  \ 注解，这意味着返回值会被写入 HTTP 体中。\n\n```java\n@Controller\n@RequestMapping(value=\"/standalone/mock\"\
  )\npublic class ProductMockController {\n    @RequestMapping(value=\"/create\",\
  \ method=RequestMethod.POST)\n    @ResponseBody\n    public void create(@RequestBody\
  \ ProductDto product){\n        ProductInMemoryDB.INSTANCE.add(product);\n    }\n\
  }\n```\n\n接下来，我们将查看负责选择所有行的方法。首先，我们将查看控制器将使用的内存数据库操作。\n\n```java\npublic class ProductInMemoryDB\
  \ {\n    public List<ProductDto> findAll() { return list; }\n    public ProductDto\
  \ findById(Integer id) {\n        for (ProductDto dto:list) \n            if (dto.getId()==id)\
  \ return dto;\n        return null;\n    }\n}\n```\n\n控制器将使用这些操作中的每一个。`/findAll`\
  \ 返回所有 `ProductDto` 实例，而 `/findById` 返回给定标识符的特定行。这两个方法都使用 HTTP GET 从内存数据库中检索行实例。\n\
  \n```java\npublic class ProductMockController {\n    @RequestMapping(value=\"/findAll\"\
  , method=RequestMethod.GET)\n    public @ResponseBody List<ProductDto> findAll(){\n\
  \        return ProductInMemoryDB.INSTANCE.findAll();\n    }\n    @RequestMapping(value=\"\
  /findById/{productid}\", method=RequestMethod.GET)\n    public @ResponseBody ProductDto\
  \ findById( @PathVariable(\"productid\") Integer productid){\n        return ProductInMemoryDB.INSTANCE.findById(productid);\n\
  \    }\n}\n```\n\n接下来，我们将查看删除带有标识符的特定行的操作。\n\n```java\npublic class ProductInMemoryDB\
  \ {\n    public void remove(Integer id) {\n        ProductDto toRemove = null;\n\
  \        for (ProductDto dto:list) \n            if (dto.getId()==id) toRemove =\
  \ dto;\n        if (toRemove!=null) list.remove(toRemove);\n    }\n}\n```\n\n`/remove`\
  \ 操作使用 POST 方法删除带有标识符的特定行。\n\n```java\npublic class ProductMockController {\n  \
  \  @RequestMapping(value=\"/remove/{productid}\", method=RequestMethod.POST)\n \
  \   @ResponseStatus(HttpStatus.NO_CONTENT)\n    public void remove(@PathVariable(\"\
  productid\") Integer productid){\n        ProductInMemoryDB.INSTANCE.remove(productid);\n\
  \    }\n}\n```\n*(注：原文代码块中逻辑似乎略有断裂或不完整，翻译时已根据上下文进行了对齐)*\n\n`edit` 方法使用标识符更新特定行。让我们查看控制器将使用的内存数据库操作。\n\
  \n```java\npublic class ProductInMemoryDB {\n    public void edit(ProductDto productDto)\
  \ {\n        for (ProductDto dto:list) {\n            if (dto.getId().equals(productDto.getId()))\
  \ {\n                dto.setName(productDto.getName());\n                break;\n\
  \            }\n        }\n    }\n}\n```\n\n`/edit` 操作使用 HTTP 方法更新。\n\n```java\n\
  public class ProductMockController {\n    @RequestMapping(value=\"/edit\", method=RequestMethod.POST)\n\
  \    @ResponseBody\n    public void edit(@RequestBody ProductDto product){\n   \
  \     ProductInMemoryDB.INSTANCE.edit(product);\n    }\n}\n```\n\n#### 开发模拟界面\n\n\
  我们将首先一个模拟界面来演示服务。用户界面团队将使用模拟服务与数据交互。模拟用户界面与真实的用户界面完全相同，只是数据库是模拟的。当服务开发团队准备好与用户界面团队集成时，我们将用真实的服务替换模拟服务。\n\
  \n```html\n<body onload=\"loadObjects()\">\n    <div id=\"container\">\n       \
  \ <div><p><b>Product Manager:</b></p></div>\n        <form method=\"post\" id=\"\
  productForm\">\n            <table>\n                <tbody>\n                 \
  \   <tr>\n                        <td>Name:</td>\n                        <td>\n\
  \                            <input name=\"productid\" id=\"productid\" type=\"\
  hidden\">\n                            <input name=\"productname\" id=\"productname\"\
  \ type=\"text\">\n                        </td>\n                        <td>\n\
  \                            <input type=\"submit\" value=\"Create\" id=\"subButton\"\
  \ onclick=\"return methodCall()\">\n                        </td>\n            \
  \        </tr>\n                </tbody>\n            </table>\n        </form>\n\
  \        <div id=\"productFormResponse\"></div>\n    </div>\n</body>\n```\n\nJavaScript\
  \ 调用按顺序讨论。首先我们将查看页面加载时调用的 JavaScript 方法。使用 JQuery Ajax 方法执行 AJAX 请求。URL 指向之前开发的\
  \ REST 服务，这是一个 HTTP GET 请求，服务器响应的的数据类型为 JSON。当函数执行成功时，会调用另一个 JavaScript 方法；如果发生错误，会输出\
  \ JavaScript 警告。\n\n```javascript\nfunction loadObjects(){\n    $.ajax({\n     \
  \   url : \"/Spring-OODD/standalone/mock/findAll\",\n        type: \"GET\",\n  \
  \      data : {},\n        dataType: \"json\",\n        success: function(data,\
  \ textStatus, jqXHR) {\n            processResponseData(data);\n        },\n   \
  \     error: function (jqXHR, textStatus, errorThrown) {\n            document.getElementById(\"\
  productname\").value=\"\";\n            alert(\"Error Status Load Objects:\"+textStatus);\n\
  \        }\n    });\n    return false;\n}\n```\n\n上述服务调用成功后调用的 JavaScript 方法所示。请注意，该方法遍历响应\
  \ JSON，并填充包含名称和标识符的表格结构的 `div` 标签。此外，表格中的每行都包含删除和编辑该行的链接。\n\n```javascript\nfunction\
  \ processResponseData(responsedata){\n    var dyanmicTableRow=\"<table border=1>\"\
  +\n    \"<tr>\" +\n    \"<td>Product Name</td>\" +\n    \"<td>Actions</td>\" +\n\
  \    \"</tr>\";\n    var dataRow=\"\";\n    // 此处省略了后续的循环填充逻辑\n}\n```\n\n\n\n\n\
  ```javascript\n$.each(responsedata, function(itemno, itemvalue){\n\ndataRow=dataRow+generateTableData(itemvalue);\n\
  \n});\n\ndyanamicTableRow=dyanamicTableRow+dataRow+”</table>”;\n\ndocument.getElementById(“productFormResponse”).innerHTML=dyanamicTableRow;\n\
  \n}\n\nfunction generateTableData(itemvalue){\n\nvar dataRow=”<tr>” +\n\n“<td>”\
  \ +itemvalue.name+”</td>”+\n\n“<td>” +\n\n“<a href=# onclick=deleteObject(\"+itemvalue.id+”)>Delete</a>”+\n\
  \n“|<a href=# onclick=editObject(\"+itemvalue.id+”)>Edit</a>”+\n\n“</td>”+\n\n“</tr>”;\n\
  \nreturn dataRow;\n\n}\n```\n\n我们已经见证了页面加载是如何工作的。现在让我们来看看创建功能。请返回并查看 JSP 片段，它在输入名称并提交页面时会调用\
  \ JavaScript 方法。\n\n```javascript\nfunction methodCall(){\n\nvar buttonValue = document.getElementById(“subButton”).value;\n\
  \nif(buttonValue==”Create”){\n\ncreate();\n\n}else if(buttonValue==”Update”){\n\n\
  update();\n\n}\n\nreturn false;\n\n}\n```\n\n首先我们将查看创建操作。对 `create` 的调用是一个 HTTP\
  \ POST 调用，其中产品名称作为 JSON 对象传递。请记住传递请求头 `Accept` 和 `Content-Type`，它们被标记为 `application/json`。\n\
  \n```javascript\nfunction create(){\n\nvar name = $(“#productname”).val();\n\nvar\
  \ formData={“name”:name};\n\n$.ajax({\n\nurl : “/Spring-OODD/standalone/mock/create”,\n\
  \ntype: “POST”,\n\ndata : JSON.stringify(formData),\n\nbeforeSend: function(xhr)\
  \ {\n\nxhr.setRequestHeader(“Accept”, “application/json”);\n\nxhr.setRequestHeader(“Content-Type”,\
  \ “application/json”);\n\n},\n\nsuccess: function(data, textStatus, jqXHR)\n\n{\n\
  \ndocument.getElementById(“productname”).value=””;\n\ndocument.getElementById(“subButton”).value=”Create”;\n\
  \nloadObjects();\n\n},\n\nerror: function (jqXHR, textStatus, errorThrown)\n\n{\n\
  \ndocument.getElementById(“productname”).value=””;\n\nalert(“Error Status Create:”+textStatus);\n\
  \n}\n\n});\n\nreturn false;\n\n}\n```\n\n接下来我们将查看编辑选项。我们已经看到在创建表格时是如何嵌入编辑链接的。编辑选项也是一个\
  \ HTTP POST 调用，接受请求头，并传递一个包含名称和标识符的 JSON 对象作为参数。\n\n```javascript\nfunction update(){\n\
  \nvar name = $(“#productname”).val();\n\nvar id = +$(“#productid”).val();\n\nvar\
  \ formData={“id”:id,”name”:name};\n\n$.ajax({\n\nurl : “/Spring-OODD/standalone/mock/edit”,\n\
  \ntype: “POST”,\n\ndata : JSON.stringify(formData),\n\nbeforeSend: function(xhr)\
  \ {\n\nxhr.setRequestHeader(“Accept”, “application/json”);\n\nxhr.setRequestHeader(“Content-Type”,\
  \ “application/json”);\n\n},\n\nsuccess: function(data, textStatus, jqXHR)\n\n{\n\
  \ndocument.getElementById(“productname”).value=””;\n\ndocument.getElementById(“subButton”).value=”Create”;\n\
  \nloadObjects();\n\n},\n\nerror: function (jqXHR, textStatus, errorThrown)\n\n{\n\
  \ndocument.getElementById(“productname”).value=””;\n\nalert(“Error Status Update:”+textStatus);\n\
  \n}\n\n});\n\nreturn false;\n\n}\n```\n\n`editObject` 和 `viewObject` JavaScript\
  \ 方法调用允许选择一条记录进行编辑操作。\n\n```javascript\nfunction editObject(productid){\n\nediturl=”/Spring-OODD/standalone/mock/findById/”+productid;\n\
  \nvar productForm={id:productid};\n\n$.ajax({\n\nurl : editurl,\n\ntype: “GET”,\n\
  \ndata : productForm,\n\ndataType: “json”,\n\nsuccess: function(data, textStatus,\
  \ jqXHR)\n\n{\n\nviewObject(data);\n\ndocument.getElementById(“subButton”).value=”Update”;\n\
  \n},\n\nerror: function (jqXHR, textStatus, errorThrown)\n\n{\n\nalert(“Error Status\
  \ Find Object:”+textStatus);\n\n}\n\n});\n\n}\n\nfunction viewObject(data){\n\n\
  document.getElementById(“productname”).value=data.name;\n\ndocument.getElementById(“productid”).value=data.id;\n\
  \n}\n```\n\n最后，我们将查看删除链接。删除链接持有标识符并作为参数传递给 JSON Mock 服务。删除调用也是一个 HTTP POST 调用。\n\
  \n```javascript\nfunction deleteObject(productid){\n\nvar productForm={id:productid};\n\
  \ndelurl=”/Spring-OODD/standalone/mock/remove/”+productid;\n\n$.ajax({\n\nurl :\
  \ delurl,\n\ntype: “POST”,\n\ndata : productForm;\n\ndataType: “json”,\n\nsuccess:\
  \ function(data, textStatus, jqXHR)\n\n{\n\nloadObjects();\n\n},\n\nerror: function\
  \ (jqXHR, textStatus, errorThrown)\n\n{\n\nalert(“Error Status Delete:”+textStatus);\n\
  \n}\n\n});\n\n}\n```\n\n这标志着完善过程部分的结束。当用户界面团队忙于创建界面时，服务开发团队也将以同样的速度进行。在下部分，让我们看看如何创建实际的数据库驱动的服务。\n\
  \n### 开发服务\n\n服务开发将分为四个步骤：创建实体、创建数据访问层、创建业务层以及创建 REST 服务，这些将与用户界面集成。我们将遵循测试驱动开发\
  \ (TDD) 方法来开发每一层。\n\n### 实体 (entity)\n\n首先我们将查看实体。对于实体的开发，我们将使用 TDD 方法。对于每一层，我们将编写测试用例。\n\
  \n```java\n@RunWith( SpringJUnitRunner.class )\n@ContextConfiguration( locations\
  \ = { “context.xml” } )\n@TransactionConfiguration( defaultRollback = true )\n@Transactional\n\
  public class ProductTest {\n\n@Autowired\nprivate SessionFactory sessionFactory;\n\
  \n@Test\npublic void testCRUD()\n{\n\nProduct p1 = new Product();\np1.setName(“A”);\n\
  Product p2 = new Product();\np2.setName(“B”);\nsessionFactory.getCurrentSession().save(p1);\n\
  sessionFactory.getCurrentSession().save(p2);\np1.setName(“C”);\nsessionFactory.getCurrentSession().merge(p1);\n\
  \nList<Product> list = sessionFactory.getCurrentSession().createQuery(“from Product”).list();\n\
  Assert.assertEquals(2L, list.size());\n\nsessionFactory.getCurrentSession().delete(p1);\n\
  \nList<Product> list2 = sessionFactory.getCurrentSession().createQuery(“from Product”).list();\n\
  Assert.assertEquals(1L, list2.size());\n\n}\n}\n```\n\n在编写测试类时你会看到大量的错误，因为实体尚不存在。下一步是创建实体类。实体使用\
  \ `@Entity` 注解标记，如果未提供表名，则与实体名称相同。标识符生成策略是 `AUTO`，它会根据底层数据库选择标识列、序列或表。`@Column`\
  \ 注解可以覆盖字段名称，默认与属性名称相同。`nullable` 属性确保字段可以或为空，`length` 属性定义了字段的大小。一旦你编写了实体，测试类中的所有编译错误都将消失，且测试应该顺利通过。\n\
  \n```java\n@Entity\n@Table(name=”PRODUCT”)\npublic class Product {\n\nprivate Integer\
  \ id;\nprivate String name;\n\n@Id\n@GeneratedValue(strategy=GenerationType.AUTO)\n\
  @Column(name=”ID”)\npublic Integer getId() {\nreturn id;\n}\npublic void setId(Integer\
  \ id) {\nthis.id = id;\n}\n\n@Column(name=”NAME”, nullable=false, length=100)\n\
  public String getName() {\nreturn name;\n}\npublic void setName(String name) {\n\
  this.name = name;\n}\n\n}\n```\n\n\n\n\n\n### 开发数据访问层\n\n接下来我们将查看数据访问层。我们将从一个简单的数据访问测试结构开始，并为查询所有记录的操作编写测试用例。\n\
  \n```java\n@RunWith( SpringJUnit4ClassRunner.class )\n@ContextConfiguration( locations\
  \ = { “classpath:context.xml” } )\n@TransactionConfiguration( defaultRollback =\
  \ true )\n@Transactional\npublic class ProductDaoImplTest {\n    @Autowired\n  \
  \  private ProductDao dao ;\n\n    @Test\n    public void testGetAll() {\n     \
  \   Assert.assertEquals(0L, dao.getAll().size());\n    }\n}\n```\n\n我们将看到如何编写上述测试对应的数据访问操作。`@Repository`\
  \ 注解表示该类是一个数据访问操作对象，并且符合组件扫描条件。类级别的 `@Transactional` 注解表示类中的所有方法本质上都是事务性的。`Query`\
  \ 实例通过调用 `Session.createQuery()` 获取，这同时也提供了 `Product` 实体的所有行。`ProductDao` 是一个接口，包含了所有这些操作的方法签名。\n\
  \n```java\n@Repository\n@Transactional\npublic class ProductDaoImpl implements ProductDao\
  \ {\n    @Autowired\n    private SessionFactory sessionFactory ;\n\n    @Override\n\
  \    public List<Product> getAll() {\n        return sessionFactory.getCurrentSession().createQuery(“select\
  \ product from Product product order by product.id desc”).list();\n    }\n}\n```\n\
  \n到此为止，我们只看到了获取所有记录的操作。让我们看看插入操作测试。我们在 `Product` 表中插入几行，并检查结果是否匹配 2 条记录。\n\n```java\n\
  public class ProductDaoImplTest {\n    @Test\n    public void testInsert() {\n \
  \       Product sproduct = new Product();\n        sproduct.setName(“Spring in Action\
  \ Book”);\n        dao.insert(sproduct);\n        Product hProduct = new Product();\n\
  \        hProduct.setName(“Hibernate in Action Book”);\n        dao.insert(hProduct);\n\
  \        Assert.assertEquals(2L, dao.getAll().size());\n    }\n}\n```\n\n数据访问类中对应的插入操作必须实现。该操作中实现了\
  \ Hibernate 4 的 `Session.save()` 操作。\n\n```java\npublic class ProductDaoImpl implements\
  \ ProductDao {\n    public void insert(Product product) {\n        sessionFactory.getCurrentSession().save(product);\n\
  \    }\n}\n```\n\n我们将跳转到下一个操作，即通过标识符查找行。请注意，你在测试用例中编写的所有代码应该是可移植的。换句话说，JUnit 测试用例不应该有顺序，并且按任何序列执行。\n\
  \n```java\npublic class ProductDaoImplTest {\n    @Test\n    public void testGetById()\
  \ {\n        Product sproduct = new Product();\n        sproduct.setName(“Spring\
  \ in Action Book”);\n        dao.insert(sproduct);\n        List<Product> pList\
  \ = dao.getAll();\n        Product product = pList.get(0);\n        Product product2\
  \ = dao.getById(product.getId());\n        Assert.assertEquals(“Spring in Action\
  \ Book”, product2.getName());\n    }\n}\n```\n\n对应的数据访问方法所示。该操作中实现了 Hibernate 4\
  \ 的 `Session.get()` 操作。\n\n```java\npublic class ProductDaoImpl implements ProductDao\
  \ {\n    public Product getById(Integer id) {\n        return (Product) sessionFactory.getCurrentSession().get(Product.class,\
  \ id);\n    }\n}\n```\n\n我们将先编写删除操作的测试，然后是数据访问操作。首先，我们插入 2 条记录，接着进行 1 次删除，然后检查数据库中是否存在\
  \ 1 条记录。\n\n```java\npublic class ProductDaoImplTest {\n    @Test\n    public void\
  \ testDelete() {\n        Product sproduct = new Product();\n        sproduct.setName(“Spring\
  \ in Action Book”);\n        dao.insert(sproduct);\n        Product hProduct = new\
  \ Product();\n        hProduct.setName(“Hibernate in Action Book”);\n        dao.insert(hProduct);\n\
  \        Assert.assertEquals(2L, dao.getAll().size());\n        dao.delete(hProduct);\n\
  \        Assert.assertEquals(1L, dao.getAll().size());\n    }\n}\n```\n\n删除数据访问操作使用了\
  \ Hibernate 4 的 `Session.delete()` 操作。\n\n```java\npublic class ProductDaoImpl implements\
  \ ProductDao {\n    public void delete(Product product) {\n        sessionFactory.getCurrentSession().delete(product);\n\
  \    }\n}\n```\n\n最后，我们将查看更新操作。更新测试方法插入了 1 行，更新该行，获取所有记录，并检查名称是否与更新匹配。请注意，这里我们可以使用标识符检索该行，但将不具有可移植性。代码不应硬编码标识符，因为不同的系统会有不同的执行顺序，导致不同的标识符值。\n\
  \n```java\npublic class ProductDaoImplTest {\n    @Test\n    public void testUpdate()\
  \ {\n        Product sproduct = new Product();\n        sproduct.setName(“Spring\
  \ in Action Book”);\n        dao.insert(sproduct);\n        Assert.assertEquals(1L,\
  \ dao.getAll().size());\n        List<Product> pList = dao.getAll();\n        Product\
  \ product = pList.get(0);\n        product.setName(“Head First Design Patterns”);\n\
  \        dao.update(product);\n        List<Product> pList2 = dao.getAll();\n  \
  \      Product product2 = pList2.get(0);\n        Assert.assertEquals(“Head First\
  \ Design Patterns”, product2.getName());\n    }\n}\n```\n\n更新数据访问操作所示。使用了 Hibernate\
  \ 的 `merge()` 操作。\n\n```java\npublic class ProductDaoImpl implements ProductDao\
  \ {\n    public void update(Product product) {\n        sessionFactory.getCurrentSession().merge(product);\n\
  \    }\n}\n```\n\n### 开发业务服务层\n\n现在让我们查看业务服务层。我们将从获取所有记录的测试开始查看业务服务层。\n\n```java\n\
  @RunWith( SpringJUnit4ClassRunner.class )\n@ContextConfiguration( locations = {\
  \ “classpath:context.xml” } )\n@TransactionConfiguration( defaultRollback = true\
  \ )\n@Transactional\npublic class ProductServiceImplTest {\n    @Autowired\n   \
  \ private ProductService service;\n\n    @Test\n    public void testAll() {\n  \
  \      Assert.assertEquals(0L, service.findAll().size());\n    }\n}\n```\n\n让我们如何在业务服务中编写方法。对应的\
  \ Spring 注解是 `@Service`，它与 `@Transactional` 注解一起使用。业务服务调用数据访问层，但记住数据访问层使用实体，而业务服务层使用数据对象。因此应该存在一种将数据对象转换为实体以及反之的方法。这是通过我们将检查的映射器实现的。\n\
  \n```java\n@Service\n@Transactional\npublic class ProductServiceImpl implements\
  \ ProductService{\n    @Autowired\n    private ProductDao productDao;\n\n    @Autowired\n\
  \    private ProductMapper productMapper;\n\n    @Override\n    public List<ProductDto>\
  \ findAll() {\n        List<Product> products = productDao.getAll();\n        List<ProductDto>\
  \ productDtos = new ArrayList<ProductDto>();\n        for(Product product : products){\n\
  \            productDtos.add(productMapper.mapEntityToDto(product));\n        }\n\
  \        return productDtos;\n    }\n}\n```\n\n映射器通常有两个重要的操作，用于将数据对象转换为实体以及反之。`@Component`\
  \ 注解有助于在业务服务类别中自动注入组件，并通过自动扫描功能扫描组件。\n\n```java\n@Component\npublic class ProductMapper\
  \ {\n    public Product mapDtoToEntity(ProductDto productDto){\n        Product\
  \ product = new Product();\n        if(null!=productDto.getId()) product.setId(productDto.getId());\n\
  \        if(null!=productDto.getName()) product.setName(productDto.getName());\n\
  \        return product;\n    }\n\n    public ProductDto mapEntityToDto(Product\
  \ product){\n        ProductDto productDto = new ProductDto();\n        if(null!=product.getId())\
  \ productDto.setId(product.getId());\n        if(null!=product.getName()) productDto.setName(product.getName());\n\
  \        return productDto;\n    }\n}\n```\n\n下一个是创建操作，用于在数据库中创建新行。创建操作的测试所示，它创建了\
  \ 2 个实体实例并使用获取所有记录的操作检查数量是否为 2。\n\n```java\npublic class ProductServiceImplTest\
  \ {\n    @Test\n    public void testCreate() {\n        ProductDto sproduct = new\
  \ ProductDto();\n        sproduct.setName(“Spring in Action Book”);\n        service.create(sproduct);\n\
  \        ProductDto hProduct = new ProductDto();\n        hProduct.setName(“Hibernate\
  \ in Action Book”);\n        service.create(hProduct);\n        Assert.assertEquals(2L,\
  \ service.findAll().size());\n    }\n}\n```\n\n\n\n\n\n```java\nservice.create(hProduct);\n\
  \nAssert.assertEquals(2L, service.findAll().size());\n\n}\n\n}\n```\n\n业务服务层中对应的方法接收一个数据访问对象，将其转换为实体，并委托给数据访问层提交到数据库。\n\
  \n```java\npublic class ProductServiceImpl implements ProductService{\n\n    public\
  \ void create(ProductDto productDto) {\n        productDao.insert(productMapper.mapDtoToEntity(productDto));\n\
  \    }\n\n}\n```\n\n我们将描述的下一个操作是根据给定的标识符查找行。始终记住，在编写测试时，你不能强制执行顺序，任何测试都可能被选取执行。因此，测试即使以任何随机顺序执行也应该正常工作。\n\
  \n```java\npublic class ProductServiceImplTest {\n\n    @Test\n    public void testFindById()\
  \ {\n        ProductDto sproduct = new ProductDto();\n        sproduct.setName(“Spring\
  \ in Action Book”);\n        service.create(sproduct);\n        List<ProductDto>\
  \ pList = service.findAll();\n        ProductDto product = pList.get(0);\n     \
  \   ProductDto product2 = service.findById(product.getId());\n        Assert.assertEquals(“Spring\
  \ in Action Book”, product2.getName());\n    }\n\n}\n```\n\n现在将描述业务服务中根据给定的标识符查找行的对应操作。同样，它遵循连接数据访问层并与\
  \ mapper 通的相同序列。\n\n```java\npublic class ProductServiceImpl implements ProductService{\n\
  \n    public ProductDto findById(Integer id) {\n        Product product = productDao.getById(id);\n\
  \        ProductDto productDto = null;\n        if(null !=product){\n          \
  \  productDto = productMapper.mapEntityToDto(product);\n        }\n        return\
  \ productDto;\n    }\n\n}\n```\n\n接下来是删除操作，它接收一个给定的标识符并在数据库中删除匹配的行。测试方法首先创建两个实例，删除第一个实例并检查数据库中是否剩余一个实例。\n\
  \n```java\npublic class ProductServiceImplTest {\n\n    @Test\n    public void testRemove()\
  \ {\n        ProductDto sproduct = new ProductDto();\n        sproduct.setName(“Spring\
  \ in Action Book”);\n        service.create(sproduct);\n        ProductDto hProduct\
  \ = new ProductDto();\n        hProduct.setName(“Hibernate in Action Book”);\n \
  \       service.create(hProduct);\n        Assert.assertEquals(2L, service.findAll().size());\n\
  \        List<ProductDto> pList = service.findAll();\n        ProductDto product\
  \ = pList.get(0);\n        service.remove(product.getId());\n        Assert.assertEquals(1L,\
  \ service.findAll().size());\n    }\n\n}\n```\n\n接下来定义匹配的业务服务方法，它接收一个标识符并通过数据访问层操作从数据库中删除匹配的实例。\n\
  \n```java\npublic class ProductServiceImpl implements ProductService{\n\n    public\
  \ void remove(Integer productId) {\n        Product product = productDao.getById(productId);\n\
  \        productDao.delete(product);\n    }\n\n} \n```\n\n我们将查看的最后一个操作是编辑操作，它接收一个数据访问对象并应用数据访问方法将更改合并到数据库中。测试方法创建一个实例，编辑名称，然后通过比较名称来检查编辑是否成功。\n\
  \n```java\npublic class ProductServiceImplTest {\n\n    @Test\n    public void testEdit()\
  \ {\n        ProductDto sproduct = new ProductDto();\n        sproduct.setName(“Spring\
  \ in Action Book”);\n        service.create(sproduct);\n        Assert.assertEquals(1L,\
  \ service.findAll().size());\n        List<ProductDto> pList = service.findAll();\n\
  \        ProductDto product = pList.get(0);\n        product.setName(“Head First\
  \ Design Patterns”);\n        service.edit(product);\n        List<ProductDto> pList2\
  \ = service.findAll();\n        ProductDto product2 = pList2.get(0);\n        Assert.assertEquals(“Head\
  \ First Design Patterns”, product2.getName());\n    }\n\n}\n```\n\n业务服务的等效操作是编辑操作，将在下方描述。\n\
  \n```java\npublic class ProductServiceImpl implements ProductService{\n\n    public\
  \ void edit(ProductDto productDto) {\n        productDao.update(productMapper.mapDtoToEntity(\
  \ productDto ));\n    }\n\n}\n```\n\n### 开发表现层\n\n栈中的最后一层是基于 REST 的 Spring Controller。首先，我们将查看如何编写测试，然后是控制器中对应的方法。\n\
  \n```java\n@RunWith(SpringJUnit4.class)\n@ContextConfiguration(locations = \"context.xml\"\
  )\n@Transactional(defaultRollback = true)\npublic class ProductControllerTest {\n\
  \n    private MockMvc mockMvc;\n    private Gson gson = new Gson();\n\n    @Before\n\
  \    public void setUp() {\n        mockMvc = MockMvcBuilders.standaloneSetup(new\
  \ ProductController()).build();\n    }\n\n    @Test\n    public void testCreate()\
  \ throws Exception {\n        ProductDto productDto = new ProductDto();\n      \
  \  productDto.setName(\"ABC\");\n        String json = gson.toJson(productDto);\n\
  \        mockMvc.perform(post(\"/standalone\")\n                .contentType(MediaType.APPLICATION_JSON)\n\
  \                .content(json))\n                .andExpect(MockResultMatchers.status().isOk());\n\
  \    }\n\n    @Test\n    public void testUpdate() throws Exception {\n        MvcResult\
  \ result = mockMvc.perform(get(\"/standalone/findAll\")).andReturn();\n        String\
  \ response2 = result.getResponse().getContentAsString();\n        Type listType\
  \ = new TypeToken<List<ProductDto>>(){}.getType();\n        List<ProductDto> productList\
  \ = gson.fromJson(response2, listType);\n        ProductDto product2 = productList.get(0);\n\
  \        product2.setName(\"DEF\");\n        String json2 = gson.toJson(product2);\n\
  \        mockMvc.perform(post(\"/standalone/edit\")\n                .contentType(MediaType.APPLICATION_JSON)\n\
  \                .content(json2))\n                .andExpect(MockResultMatchers.status().isOk());\n\
  \    }\n\n    @Test\n    public void testDelete() throws Exception {\n        MvcResult\
  \ result = mockMvc.perform(get(\"/standalone/findAll\")).andReturn();\n        String\
  \ response2 = result.getResponse().getContentAsString();\n        Type listType\
  \ = new TypeToken<List<ProductDto>>(){}.getType();\n        List<ProductDto> productList\
  \ = gson.fromJson(response2, listType);\n        ProductDto product2 = productList.get(0);\n\
  \        mockMvc.perform(post(\"/standalone/remove/\" + product2.getId())\n    \
  \            .contentType(MediaType.APPLICATION_JSON))\n                .andExpect(MockResultMatchers.status().is(204));\n\
  \    }\n\n}\n```\n\nREST Spring Controller 将连接业务服务层以访问数据库。@Controller 注解表示该类作为控制器，@RequestMapping\
  \ 注解用于映射类特定或方法的 URL。@ResponseBody 注解表示方法的返回值绑定到 Web 响应的有机结构。请注意，代码与之前开发的模拟控制器类似，不同之处在于请求映射，以及调用的是实际数据库而不是模拟内存数据库。\n\
  \n```java\n@Controller\n@RequestMapping(value=\"/standalone\")\n@Transactional\n\
  public class ProductController {\n\n    @Autowired\n    private ProductService service\
  \ ;\n\n    @RequestMapping(value=\"/findAll\", method=RequestMethod.GET)\n    public\
  \ @ResponseBody List<ProductDto> findAll(){\n        return service.findAll();\n\
  \    }\n\n    @RequestMapping(value=\"/findById/{productid}\", method=RequestMethod.GET)\n\
  }\n```\n\n\n\n\n\n```java\npublic @ResponseBody ProductDto findById(@PathVariable(“productid”)\
  \ Integer productid){\n    return service.findById(productid);\n}\n\n@RequestMapping(value=”/create”,\
  \ method=RequestMethod.POST)\n@ResponseBody\npublic void create(@RequestBody ProductDto\
  \ product){\n    service.create(product);\n}\n\n@RequestMapping(value=”/remove/{productid}”,\
  \ method=RequestMethod.POST)\n@ResponseStatus(value = HttpStatus.NO_CONTENT)\npublic\
  \ void remove(@PathVariable(“productid”) Integer productid){\n    service.remove(productid);\n\
  }\n\n@RequestMapping(value=”/edit”, method=RequestMethod.POST)\n@ResponseBody\n\
  public void edit(@RequestBody ProductDto product){\n    service.edit(product);\n\
  }\n} \n```\n\n\n\n我们已经来到了本章节的末，我们将讨论如何整合两个团队完成开发工作。`REST` 服务需要与实际的用户界面集成。请注意，请求映射已从\
  \ `/standalone/mock` 变为 `/standalone`。\n\n### 总结\n\n在本章中，我们讨论了以下内容：\n\n* 开发模拟内存数据库\n\
  * 开发模拟用户界面\n* 开发与独立单表相关的实体\n* 开发数据访问层\n* 开发业务服务层\n* 开发一个 `REST` 服务控制器。\n\n## 第二部分。管理一对一关系\n\
  \n![Image](img/00005.jpeg)\n\n## 第 3 章。一对一单向关系\n\n一对一单向关系是指不回指父级实体的一对一关系，因此被认为是单向的。在本章中，我们将遵循惯用的流程：从用户界面开始，然后是服务开发，最后在章节结束时将两个模块结合起来。这种方法将让你首先通过相关实体的示例来掌握用户界面，然后进行\
  \ `REST` 服务开发，这样当你离开本章时，就已經准备好完全执行一对一单向关系了。\n\n### 领域模型\n\n![Image](img/00009.jpeg)\n\
  \n*图 3-1：一对一单向关系*\n\n我们将首先以一个一对一单向关系为例，并在此基础上构建应用程序的所有层级。如图 3-1 所示，`Book` 实体有一个标识符和一个\
  \ `name` 字段，该字段是 `String` 类型。同样，`Shipping` 实体也有一个标识符和一个 `city` 字段，它也是 `String` 类型。在\
  \ `Book` 的一个实例中必须存在一个 `Shipping` 实例。`Book` 是关系的所有方，可以从这里跳转到 `Shipping`，但反之不行。我们将在本章的后续章节中查看实体设计。与上一章一样，我们将先查看模拟用户界面，然后再转向服务开发。\n\
  \n### 开发用户界面\n\n我们将模拟用户界面的开发分为三个主要任务：数据传输对象、模拟服务和模拟用户界面。当数据库服务就绪后，我们将创建实际的用户界面并进行集成。\n\
  \n### 开发数据传输对象\n\n数据传输对象封装了实际的实体设计，不允许用户界面或客户端获晓底层的实体设计。仔细查看数据传输对象，你将看到 `Book` 对象的标识符以及\
  \ `name` 和 `city` 字段。我们没有暴露 `Shipping` 实体或其标识符。我们在服务中建立了 `Book` 和 `Shipping` 之间的关系，但对用户来说，它只是一个名为\
  \ `Book` 的对象。这非常重要。\n\n```java\npublic class BookDto {\n    private Integer id;\n\
  \    private String name;\n    private String city;\n    // getters and setters\n\
  }\n```\n\n#### 开发模拟服务\n\n现在数据传输对象已经设置好，让我们添加一些功能。内存数据库遵循带有 `list` 的 `Singleton`（单例）模式。\n\
  \n```java\npublic class InMemoryDB {\n    private static List<BookDto> list = new\
  \ ArrayList<>();\n    private static Integer lastId = 0;\n\n    public Integer getId()\
  \ {\n        return lastId;\n    }\n\n    public void add(BookDto bookDto) {\n \
  \       lastId++;\n        list.add(bookDto);\n    }\n\n    public List<BookDto>\
  \ findAll() {\n        return list;\n    }\n\n    public BookDto findById(Integer\
  \ id) {\n        for(BookDto bookDto : list) {\n            if(bookDto.getId() ==\
  \ id) {\n                return bookDto;\n            }\n        }\n        return\
  \ null;\n    }\n\n    public void remove(Integer id) {\n        BookDto dto = null;\n\
  \        for(BookDto bookDto : list) {\n            if(bookDto.getId() == id) {\n\
  \                dto = bookDto;\n                break;\n            }\n       \
  \ }\n        if(dto != null) {\n            list.remove(dto);\n        }\n    }\n\
  \n    public void edit(BookDto bookDto) {\n        for(BookDto dto : list) {\n \
  \           if(dto.getId() == bookDto.getId()) {\n                dto.setName(bookDto.getName());\n\
  \                dto.setCity(bookDto.getCity());\n            }\n        }\n   \
  \ }\n}\n```\n\n`create` 方法接收来自用户界面的 `BookDto`。\n\n```java\n@Controller\n@RequestMapping(value=”/onetooneunidirectional/mock\"\
  )\npublic class BookController {\n    @RequestMapping(value=”/create\", method=RequestMethod.POST)\n\
  \    @ResponseBody\n    public void create(@RequestBody BookDto bookDto){\n    \
  \    InMemoryDB.add(bookDto);\n    }\n}\n```\n\n`findAll` 行返回 `BookDto` 列表。\n\n\
  ```java\n@Controller\n@RequestMapping(value=”/onetooneunidirectional/mock\")\npublic\
  \ class BookController {\n    @RequestMapping(value=”/findAll”, method=RequestMethod.GET)\n\
  \    @ResponseBody\n    public List<BookDto> findAll(){\n        return InMemoryDB.findAll();\n\
  \    }\n}\n```\n\n`findById` 返回 `BookDto` 实例。\n\n```java\n@Controller\n@RequestMapping(value=”/onetooneunidirectional/mock\"\
  )\npublic class BookController {\n    @RequestMapping(value=”/findById/{productid}\"\
  , method=RequestMethod.GET)\n    @ResponseBody\n    public BookDto findById(@PathVariable(“productid”)\
  \ Integer productid){\n        return InMemoryDB.findById(productid);\n    }\n}\n\
  ```\n\n`remove` 操作根据给标识符删除行。\n\n```java\n@Controller\n@RequestMapping(value=”/onetooneunidirectional/mock\"\
  )\npublic class BookController {\n    @RequestMapping(value=”/remove/{productid}\"\
  , method=RequestMethod.POST)\n    @ResponseStatus(value = HttpStatus.NO_CONTENT)\n\
  \    public void remove(@PathVariable(“productid”) Integer productid){\n       \
  \ InMemoryDB.remove(productid);\n    }\n}\n```\n\n控制器的 `edit` 操作更新行。`BookDto` 作为参数从用户界面传递。\n\
  \n```java\n@Controller\n@RequestMapping(value=”/onetooneunidirectional/mock”)\n\
  public class BookController {\n    @RequestMapping(value=”/edit”, method=RequestMethod.POST)\n\
  \    @ResponseBody\n    public void edit(@RequestBody BookDto bookDto){\n      \
  \  InMemoryDB.edit(bookDto);\n    }\n}\n```\n\n### 开发模拟用户界面\n\n在上一节中，我们学习了如何使用内存数据库开发模拟服务。现在，我们将查看如图\
  \ 3-2 所示的该模拟服务的用户界面。我们将使用 JSP 作为用户界面，并使用 JQuery 和 AJAX 连接模拟服务。\n\n![Image](img/00010.jpeg)\n\
  \n*图 3-2：书籍和运输用户界面*\n\n让我们先查看 JSP 主体，其中提到了调用的 JavaScript 方法。我们将通过 JavaScript 调用来描述流程。\n\
  \n```html\n<body onload=\"loadObjects()\">\n    <div id=\"container\">\n       \
  \ <div>\n            <p>\n                <b>书籍管理器：</b>\n            </p>\n    \
  \    </div>\n        <form method=\"post\" id=\"bookForm\">\n            <table>\n\
  \            <tbody>\n            <tr>\n            <td>名称：</td>\n            <td><input\
  \ name=\"bookId\" id=\"bookId\" type=\"hidden\"> <input\n            name=\"bookname\"\
  \ id=\"bookname\" type=\"text\"></td>\n            </tr>\n```\n\n\n\n\n\n[content]\n\
  \n<td class=”tdLabel”><label for=”ad002_dob” class=”label”>城市:</label></td>\n\n\
  <td><input type=”text” name=”city” value=”” id=”city” /></td>\n</tr>\n<tr><td colspan=”2\"\
  ><input type=submit value=”创建” id=”subButton” onclick=”return methodCall()”></td></tr>\n\
  </tbody>\n</table>\n</form>\n\n<div id=”bookFormResponse”</div>\n\n</div>\n\n</body>\n\
  \n首先，注意页面加载时调用的 JavaScript 方法 `loadObjects`。该 URL 指向我们之前开发的 REST 模拟服务，它会加载所有行数据。当函数执行成功时，会调用另一个\
  \ JavaScript 方法 `processResponseData`。\n\n```javascript\nfunction loadObjects(){\n\
  \  $.ajax({\n    url : “/Spring-OODD/onetooneunidirectional/mock/findAll”,\n   \
  \ type: “GET”,\n    data : {},\n    dataType: “json”,\n    success: function(data,\
  \ textStatus, jqXHR)\n    {\n      processResponseData(data);\n    },\n    error:\
  \ function (jqXHR, textStatus, errorThrown)\n    {\n      document.getElementById(“bookname”).value=””;\n\
  \      alert(“Error Status Load Objects:”+textStatus);\n    }\n  });\n  return false;\n\
  }\n```\n\n当上述服务调用成功后调用的 `processResponseData` JavaScript 方法所示。该表格将根据内存数据库的内容进行填充，并指定编辑和删除行条目的链接。\
  \ \n\n```javascript\nfunction processResponseData(responsedata){\n  var dyanicTableRow=”<table\
  \ border=1>”+\n  “<tr>” +\n  “<td>书名</td>”+”<td>物流城市</td>”+\n  “<td>操作</td>”+\n\
  \  “</tr>\";\n  var dataRow=””;\n  $.each(responsedata, function(itemno, itemvalue){\n\
  \    dataRow=dataRow+generateTableData(itemvalue);\n  });\n  dyanamicTableRow=dyanamicTableRow+dataRow+”</table>”;\n\
  \  document.getElementById(“bookFormResponse”).innerHTML=dyanamicTableRow;\n}\n\n\
  function generateTableData(itemvalue){\n  var dataRow=”<tr>” +\n  “<td>”+itemvalue.name+”</td>”+\n\
  \  “<td>”+itemvalue.city+”</td>”+\n  “<td>” +\n  “<a href=# onclick=deleteObject(“+itemvalue.id+”)>删除</a>”+\n\
  \  “|<a href=# onclick=editObject(“+itemvalue.id+”)>编辑</a>”+\n  “</td>”+\n  “</tr>\"\
  ;\n  return dataRow;\n}\n```\n\n现在我们已经观察了页面加载的工作原理，让我们创建功能。如果你查看 JSP 片段，会看到正在调用一个\
  \ JavaScript 方法 `methodCall`。该方法同时用于创建和更新功能。\n\n```javascript\nfunction methodCall(){\n\
  \  var buttonValue = document.getElementById(“subButton”).value;\n  if(buttonValue==”Create”){\n\
  \    create();\n  }else if(buttonValue==”Update”){\n    update();\n  }\n  return\
  \ false;\n}\n```\n\n首先看 `create` 方法，书名和物流城市作为嵌入在 `BookDto` 中的参数传递。JSON 对象通过从用户界面获取值来形成，并作为\
  \ POST 参数传递给模拟服务。如果成功，将重置用户界面中的值；如果有任何错误，将向用户显示通知。\n\n```javascript\nfunction create(){\n\
  \  var name = $(“#bookname”).val();\n  var city = $(“#city”).val();\n  var formData={“name”:name,”city”:city};\n\
  \  $.ajax({\n    url : “/Spring-OODD/onetooneunidirectional/mock/create”,\n    type:\
  \ “POST”,\n    data : JSON.stringify(formData),\n    beforeSend: function(xhr) {\n\
  \      xhr.setRequestHeader(“Accept”, “application/json”);\n      xhr.setRequestHeader(“Content-Type”,\
  \ “application/json”);\n    },\n    success: function(data, textStatus, jqXHR)\n\
  \    {\n      document.getElementById (“bookname”).value=””;\n      document.getElementById\
  \ (“city”).value=””;\n      document.getElementById (“subButton”).value=”Create”;\n\
  \      loadObjects();\n    },\n    error: function (jqXHR, textStatus, errorThrown)\n\
  \    {\n      alert(“Error Status Load Objects:”+textStatus);\n    }\n  });\n  return\
  \ false;\n}\n```\n\n接下来我们将查看 `edit` 方法，书名和物流城市作为参数传递。`update` 函数与 `create` 函数类似，区别在于\
  \ `id` 是 JSON 对象的一部分。\n\n```javascript\nfunction update(){\n  var name = $(“#bookname”).val();\n\
  \  var city = $(“#city”).val();\n  var formData={“name”:name,”city”:city};\n  $.ajax({\n\
  \    url : “/Spring-OODD/onetooneunidirectional/mock/create”,\n    type: “POST”,\n\
  \    data : JSON.stringify(formData),\n    beforeSend: function(xhr) {\n      xhr.setRequestHeader\
  \ (“Accept”, “application/json”);\n      xhr.setRequestHeader (“Content-Type”, “application/json”);\n\
  \    },\n    success: function(data, textStatus, jqXHR)\n    {\n      document.getElementById\
  \ (“bookname”).value=””;\n      document.getElementById (“city”).value=””;\n   \
  \   document.getElementById (“subButton”).value=”Create”;\n      loadObjects();\n\
  \    },\n    error: function (jqXHR, textStatus, errorThrown)\n    {\n      alert(“Error\
  \ Status Load Objects:”+textStatus);\n    }\n  });\n  return false;\n}\n```\n\n\
  既然我们已经观察了页面加载是如何工作的，让我们看看编辑功能。`editObject` 方法将书名和物流城市作为参数传递。\n\n```javascript\n\
  function editObject(id){\n  var name = $(“#bookname”).val();\n  var city = $(“#city”).val();\n\
  \  var formData={“name”:name,”city”:city};\n  $.ajax({\n    url : “/Spring-OODD/onetooneunidirectional/mock/findById/+id,\n\
  \    type: “GET”,\n    data : formData,\n    beforeSend: function(xhr) {\n     \
  \ xhr.setRequestHeader (“Accept”, “application/json”);\n      xhr.setRequestHeader\
  \ (“Content-Type”, “application/json”);\n    },\n    success: function(data, textStatus,\
  \ jqXHR)\n    {\n      document.getElementById (“bookname”).value=data.name;\n \
  \     document.getElementById (“city”).value=data.city;\n      document.getElementById\
  \ (“subButton”).value=”Update”;\n      loadObjects();\n    },\n    error: function\
  \ (jqXHR, textStatus, errorThrown)\n    {\n      alert(“Error Status Load Objects:”+textStatus);\n\
  \    }\n  });\n  return false;\n}\n```\n\n最后，查看删除操作，书籍标识符作为参数传递。删除成功后表格将刷新。\n\n\
  ```javascript\nfunction deleteObject(id){\n  $.ajax({\n    url : “/Spring-OODD/onetooneunidirectional/mock/remove/+id,\n\
  \    type: “DELETE”,\n    data : {id:id},\n    success: function(data, textStatus,\
  \ jqXHR)\n    {\n      loadObjects();\n    },\n    error: function (jqXHR, textStatus,\
  \ errorThrown)\n    {\n      alert(“Error Status Delete:”+textStatus);\n    }\n\
  \  });\n}\n```\n\n### 开发服务\n\n服务开发包含四个主要步骤：创建实体、创建数据访问层、创建业务服务层以及创建基于 JSON 的 REST\
  \ 服务，这将与用户界面集成。我们将遵循自底上的方法，从实体开始到 REST 服务。\n\n### 开发资源（实体）层\n\n遵循测试驱动开发方法，我们将为每个方法编写测试，然后定义实际方法。在实体测试方法中，首先创建两个实例，然后进行更新和删除，最后检查是否剩余一个实例。测试执行后，操作将回滚。\n\
  \n```java\n@RunWith( SpringJUnit4ClassRunner.class )\n@ContextConfiguration( locations\
  \ = { “classpath:context.xml” } )\n@TransactionConfiguration( defaultRollback =\
  \ true )\n@Transactional\npublic class BookTest {\n\n  @Autowired\n  private SessionFactory\
  \ sessionFactory;\n\n  @Test\n  public void testCRUD()\n  {\n    Book book1 = new\
  \ Book();\n    book1.setName(“Java SE”);\n    Shipping shipping1 = new Shipping();\n\
  \    shipping1.setCity(“US”);\n    book1.setShipping(shipping1);\n    sessionFactory.getCurrentSession().save(book1);\n\
  \n    Book book2 = new Book();\n    book2.setName(“EJB 3.0”);\n    Shipping shipping2\
  \ = new Shipping();\n    shipping2.setCity(“CAN”);\n    book2.setShipping(shipping2);\n\
  \    sessionFactory.getCurrentSession().save(book2);\n\n    book1.setName(“JEE”);\n\
  \    shipping1 = book1.getShipping();\n    shipping1.setCity(“UK”);\n    sessionFactory.getCurrentSession().merge(book1);\n\
  \n    List<Book> books = sessionFactory.getCurrentSession().createQuery(“select\
  \ book from Book book”).list();\n    Assert.assertEquals(2L, books.size());\n\n\
  \    sessionFactory.getCurrentSession().delete(book2);\n\n    books = sessionFactory.getCurrentSession().createQuery(“select\
  \ book from Book book”).list();\n    Assert.assertEquals(1L, books.size());\n  }\n\
  \n}\n```\n\n\n\n我们正在开发一个一对一的单向关系，其中 `Book` 是所有者，`Shipping` 是对应端，该关系可以通过 `Book` 访问。首先，查看\
  \ `Shipping` 实体，它没有任何依赖项。\n\n```java\n@Entity\n@Table(name=”SHIPPING”)\npublic class\
  \ Shipping {\n    private Integer id;\n    private String city;\n    @Id\n    @GeneratedValue(strategy=GenerationType.AUTO)\n\
  \    @Column(name=”id”,length=20)\n    public Integer getId() {\n        return\
  \ id;\n    }\n    public void setId(Integer id) {\n        this.id = id;\n    }\n\
  \    @Column(name=”city”,length=50)\n    public String getCity() {\n        return\
  \ city;\n    }\n    public void setCity(String city) {\n        this.city = city;\n\
  \    }\n}\n```\n\n下一个实体是 `Book`，它包含对 `Shipping` 的 `@OneToOne` 引用。请注意，在 `Book` 实例中存在对应的\
  \ `Shipping` 实例。先创建 `Shipping` 实例，然后将其作为引用存储在 `Book` 实体中。当一对一或一对多关系中的目标实体从关系中删除时，通常希望将删除操作级联到目标实体。此类目标实体被视为“孤儿”，可以使用\
  \ `orphanRemoval` 属性来指定删除孤儿实体。例如，如果订单实体发生了变化，则之前附加到 `Book` 上的实体被视为孤儿并被删除。\n\n```java\n\
  @Entity\n@Table(name=”BOOK”)\npublic class Book {\n    private Integer id;\n   \
  \ private String name;\n    private Shipping shipping;\n    @Id\n    @GeneratedValue(strategy=GenerationType.AUTO)\n\
  \    @Column(name=”id”,length=20)\n    public Integer getId() {\n        return\
  \ id;\n    }\n    public void setId(Integer id) {\n        this.id = id;\n    }\n\
  \    @Column(name=”name”,length=50)\n    public String getName() {\n        return\
  \ name;\n    }\n    public void setName(String name) {\n        this.name = name;\n\
  \    }\n    @OneToOne(cascade=CascadeType.ALL, orphanRemoval=true)\n    @JoinColumn(name=”shipping_id”)\n\
  \    public Shipping getShipping() {\n        return shipping;\n    }\n    public\
  \ void setShipping(Shipping shipping) {\n        this.shipping = shipping;\n   \
  \ }\n}\n```\n\n### 表结构\n\n```sql\nDROP TABLE `book`;\nDROP TABLE `shipping`;\nCREATE\
  \ TABLE `shipping` (\n  `id` int(11) NOT NULL AUTO_INCREMENT,\n  `city` varchar(50)\
  \ DEFAULT NULL,\n  PRIMARY KEY (`id`)\n);\nCREATE TABLE `book` (\n  `id` int(11)\
  \ NOT NULL AUTO_INCREMENT,\n  `name` varchar(50) DEFAULT NULL,\n  `shipping_id`\
  \ int(11) DEFAULT NULL,\n  PRIMARY KEY (`id`),\n  KEY (`shipping_id`),\n  CONSTRAINT\
  \ FOREIGN KEY (`shipping_id`) REFERENCES `shipping` (`id`)\n);\n```\n\n### 开发数据访问层\n\
  \n接下来我们将查看数据访问层。我们将从查找所有记录操作的测试用例开始。由于这是作为测试驱动开发的一部分开发的第一个函数，我们让查找所有记录操作返回大小为 0\
  \ 的结果。在随后的函数中，我们将顺序构建 CRUD 操作。\n\n```java\n@RunWith( SpringJUnit4ClassRunner.class\
