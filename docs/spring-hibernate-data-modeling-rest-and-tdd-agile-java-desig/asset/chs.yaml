  ) ;\n```\n\n### 开发数据访问层\n\n我们将从查找所有记录操作的测试用例开始。\n\n```java\n@RunWith( SpringJUnit4ClassRunner.class\
  \ )\n@ContextConfiguration( locations = { “classpath:context.xml” } )\n@TransactionConfiguration(\
  \ defaultRollback = true )\n@Transactional\npublic class EmployeeDaoImplTest {\n\
  \    @Autowired\n    private EmployeeDao dao ;\n\n    @Test\n    public void testGetAll()\
  \ {\n        Assert.assertEquals(0L, dao.getAll().size());\n    }\n}\n```\n\n接接，我们将看到如何编写上述测试用例对应的数据访问操作。\n\
  \n```java\n@Repository\n@Transactional\npublic class EmployeeDaoImpl implements\
  \ EmployeeDao {\n    @Autowired\n    private SessionFactory sessionFactory ;\n\n\
  \    @SuppressWarnings(“unchecked”)\n    @Override\n    public List<Employee> getAll()\
  \ {\n        return sessionFactory.getCurrentSession().createQuery(“select employee\
  \ from Employee employee order by employee.id desc”).list();\n    } \n}\n```\n\n\
  让我们继续插入操作的测试。\n\n```java\npublic class EmployeeDaoImplTest {\n    @Autowired\n \
  \   private EmployeeDao dao ;\n\n    @Test\n    public void testInsert() {\n   \
  \     Employee temployee = new Employee();\n        temployee.setName(“Lalit Narayan\
  \ Mishra”);\n        dao.insert(temployee);\n        Employee sEmployee = new Employee();\n\
  \        sEmployee.setName(“Amritendu De”);\n        dao.insert(sEmployee);\n  \
  \      Assert.assertEquals(2L, dao.getAll().size());\n    } \n}\n```\n\n数据访问类中对应的插入操作必须使用\
  \ Hibernate 4 的 `Session.save()` 函数实现。\n\n```java\npublic class EmployeeDaoImpl\
  \ implements EmployeeDao {\n    @Autowired\n    private SessionFactory sessionFactory\
  \ ;\n\n    @Override\n    public void insert(Employee employee) {\n        sessionFactory.getCurrentSession().save(employee);\n\
  \    } \n}\n```\n\n然后我们将跳转到下一个测试操作，即根据标识符查找行。\n\n```java\npublic class EmployeeDaoImplTest\
  \ {\n    @Test\n    public void testGetById() {\n        Employee semployee = new\
  \ Employee();\n        semployee.setName(“Lalit Narayan Mishra”);\n        dao.insert(semployee);\n\
  \        List<Employee> pList = dao.getAll();\n        Employee employee = pList.get(0);\n\
  \        Employee employee2 = dao.getById(employee.getId());\n        Assert.assertEquals(“Lalit\
  \ Narayan Mishra”, employee2.getName());\n    }\n}\n```\n\n对应的数据访问方法通过 Hibernate\
  \ 4 的 `Session.get()` 操作执行。\n\n```java\npublic class EmployeeDaoImpl implements\
  \ EmployeeDao {\n    @Override\n    public Employee getById(Integer id) {\n    \
  \    return (Employee) sessionFactory.getCurrentSession().get(Employee.class, id);\n\
  \    } \n}\n```\n\n我们将首先编写删除操作的测试，然后是数据访问操作。\n\n```java\npublic class EmployeeDaoImplTest\
  \ {\n    @Test\n    public void testDelete() {\n        Employee semployee = new\
  \ Employee();\n        semployee.setName(“Lalit Narayan Mishra”);\n        dao.insert(semployee);\n\
  \        Employee tEmployee = new Employee();\n        tEmployee.setName(“Amritendu\
  \ De”);\n        dao.insert(tEmployee);\n        Assert.assertEquals(2L, dao.getAll().size());\n\
  \        dao.delete(tEmployee);\n        Assert.assertEquals(1L, dao.getAll().size());\n\
  \    }\n}\n```\n\n删除数据访问操作使用了 Hibernate 4 的 `Session.delete()` 操作。\n\n```java\n\
  public class EmployeeDaoImpl implements EmployeeDao {\n    @Override\n    public\
  \ void delete(Employee employee) {\n        sessionFactory.getCurrentSession().delete(employee);\n\
  \    }\n}\n```\n\n最后我们将查看更新测试。\n\n```java\npublic class EmployeeDaoImplTest {\n\
  \    @Test\n    public void testUpdate() {\n        Employee semployee = new Employee();\n\
  \        semployee.setName(“Lalit Narayan Mishra”);\n        dao.insert(semployee);\n\
  \        Assert.assertEquals(1L, dao.getAll().size());\n        List<Employee> pList\
  \ = dao.getAll();\n        Employee employee = pList.get(0);\n        employee.setName(“Amritendu\
