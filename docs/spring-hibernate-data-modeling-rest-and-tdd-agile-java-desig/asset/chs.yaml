  \    public void remove(@PathVariable(“bookId”) Integer bookId){\n        service.remove(bookId);\n\
  \    }\n\n    @RequestMapping(value=”/edit”, method=RequestMethod.POST)\n    @ResponseBody\n\
  \    public void edit(@RequestBody BookDto book){\n        service.edit(book);\n\
  \    }\n}\n```\n\n我们现在将讨论如何将 REST 服务与实际的用户界面集成。请注意，请求映射从“/onetooneunidirectional/mock”\
  \ 更为“/onetooneunidirectional.”。其余的工作涉及从模拟用户界面创建实际的用户界面。\n\n### 总结\n\n在本章中，我们讨论了以下内容：\n\
  \n* 开发模拟内存数据库\n* 开发模拟用户界面\n* 开发与一对一单向关联关联的实体\n* 开发数据访问层\n* 开发业务服务层\n* 开发 REST 服务控制器。\n\
  \n## 第 4 章：一对一双向关系\n\n一对一双向关系是一种一对一关系，它会从父级到子级回指，反之亦然。如果你发现现实生活中的关系是一一对一，且需要在两个方向上进行遍历，请使用一对一双向关系。我们将监控从服务开发跟踪的用户界面开始的习惯流并在并在结束时在两个模块中缝合。\n\
  \n### 领域模型\n\n![Image](img/00011.jpeg)\n\n*图 4-1：一对一双向关系*\n\n如图 4-1 所示的一对一双向关联，`Customer`\
  \ 实体有一个标识符和一个 `String` 类型的字段。`Cart` 实体也有一个标识符和一个 `Double` 金额字段。由于关系的双向性，在 `Customer`\
  \ 实例中必须存在一个 `Cart` 实例，反之亦然。我们将首先编写...\n\n\n\n\n\n```java\nfor(CustomerDto customerDto\
  \ : list){\n  if(customerDto.getId() == id){\n    dto = customerDto;\n    break;\n\
  \  }\n}\nif(null != dto){\n  list.remove(dto);\n}\n}\n```\n\n在匹配 mock 服务中，remove\
  \ 操作根据作为 URL 输入的给定标识符删除特定行。\n\n```java\n@Controller\n@RequestMapping(value=\"/onetoonebidirectional/mock”)\n\
  public class CustomerMockController {\n  @RequestMapping(value=”remove/{customerid}”,\
  \ method=RequestMethod.POST)\n  @ResponseStatus(value = HttpStatus.NO_CONTENT)\n\
  \  public void remove(@PathVariable(“customerid”) Integer customerid){\n    CustomerInMemoryDB.INSTANCE.remove(customerid);\n\
  \  }\n}\n```\n\n最后，我们处理负责更新行的 edit 操作。\n\n```java\npublic enum CustomerInMemoryDB\
  \ {\n  public void edit(CustomerDto customerDto){\n    for(CustomerDto dto : list){\n\
  \      if(dto.getId() == customerDto.getId()){\n        dto.setName(customerDto.getName());\n\
  \        dto.setAmount(customerDto.getAmount());\n      }\n    }\n  }\n}\n```\n\n\
  控制器的 edit 操作接收一个编辑过的 `CustomerDto` 副本并用更改更新特定行。\n\n```java\n@Controller\n@RequestMapping(value=\"\
  /onetoonebidirectional/mockysa\npublic class CustomerMockController {\n  @RequestMapping(value=”/edit”,\
  \ method=RequestMethod.POST)\n  @ResponseBody\n  public void edit(@RequestBody CustomerDto\
  \ customerDto){\n    CustomerInMemoryDB.INSTANCE.edit(customerDto);\n  }\n}\n```\n\
  \n#### 开发 mock 用户界面\n\n让我们从开发带有内存数据库的 mock 服务转向用户界面，该界面将如图 4-2 所示接入此 mock 服务。用户界面将能够方法添加、编辑、删除和显示所有与\
  \ `Customer` 相关的记录，包括 Cart amount 字段。\n\n![Image](img/00012.jpeg)\n\n*图 4-2：Customer\
  \ 和 Cart 用户界面的截图*\n\nJSP body 是加载的起始页面，随后会调用 JavaScript 方法。我们将通过 JavaScript 调用来定义流程。\n\
