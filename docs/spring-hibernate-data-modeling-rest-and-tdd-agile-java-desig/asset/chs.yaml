  \ Status Delete:”+textStatus);\n    }\n  });\n}\n```\n\n### 开发服务\n\n接下来的步骤是实际的服务开发，涉及四个主要步骤：创建实体、创建数据访问层、创建业务服务层以及创建基于\
  \ JSON 的 REST 能力。我们将从实体开始直到 服务。\n\n### 开发资源（实体）层\n\n首先，我们创建两个 `User` 实例，最后检查两个 User\
  \ 实例。随后，我们进行更新并测试修改是否生效。最后，我们删除一个实例并测试数量是否唯一。此外，我们添加两个 `Group` 变体并与剩余的 `User` 实例关联。\n\
  \n```java\n@RunWith( SpringJUnit4ClassRunner.class )\n@ContextConfiguration( locations\
  \ = { “classpath:context.xml” } )\n@TransactionConfiguration( defaultRollback =\
  \ true )\n@Transactional\npublic class UserTest {\n  @Autowired\n  private SessionFactory\
  \ sessionFactory;\n  @SuppressWarnings(\"unchecked”)\n  @Test\n  public void testCRUD()\n\
  \  {\n    User u1 = new User();\n    u1.setName(“A”);\n    User u2 = new User();\n\
  \    u2.setName(“B”);\n    sessionFactory.getCurrentSession().save(u1);\n    sessionFactory.getCurrentSession().save(u2);\n\
  \    u1.setName(“C”);\n    sessionFactory.getCurrentSession().merge(u1);\n    List<User>\
  \ list = sessionFactory.getCurrentSession().createQuery(“from User”).list();\n \
  \   Assert.assertEquals(2L, list.size());\n    sessionFactory.getCurrentSession().delete(u1);\n\
  \    List<User> list2 = sessionFactory.getCurrentSession().createQuery(“from User”).list();\n\
  \    Assert.assertEquals(1L, list2.size());\n    Group g1 = new Group();\n    g1.setName(“A”);\n\
  \    Group g2 = new Group();\n    g2.setName(“B”);\n    sessionFactory.getCurrentSession().save(g1);\n\
  \    sessionFactory.getCurrentSession().save(g2);\n    User u3 = list2.get(0);\n\
  \    u3.getGroups().add(g1);\n    u3.getGroups().add(g2);\n    sessionFactory.getCurrentSession().merge(u3);\n\
  \  }\n}\n```\n\n我们将查看 `Group` 实体，它包含一个标识符和名称 String 字段。由于该实体位于反向侧且是单向关联，因此没有对 User\
  \ 的引用。\n\n```java\n@Entity\n@Table(name=”GROUPS”)\n```\n\n\n\n\n\n```java\npublic\
  \ class Group {\n    private Integer id;\n    private String name;\n\n    @Id\n\
  \    @GeneratedValue(strategy=GenerationType.AUTO)\n    @Column(name=\"ID\")\n \
  \   public Integer getId() {\n        return id;\n    }\n\n    public void setId(Integer\
  \ id) {\n        this.id = id;\n    }\n\n    @Column(name=\"NAME\", nullable=false,\
  \ length=100)\n    public String getName() {\n        return name;\n    }\n\n  \
  \  public void setName(String name) {\n        this.name = name;\n    }\n}\n```\n\
  \n我们正在演进一个多对多的关联。`User` 实例可能拥有一个或多个 `Group` 实例，这些实例可以与其他 `User` 共享。由于该关系是单向的，对 `Group`\
  \ 列表的引用是在所有方指定的。`@ManyToMany` 注解定义了一个具有多对多重数性的多值关联。连接表指定在所有方上，在本例中是 `User`。`@JoinTable`\
  \ 注解通常指定连接表名称以及连接列和反向连接列。\n\n```java\n@Entity\n@Table(name=\"USER\")\npublic class\
  \ User {\n    private Integer id;\n    private String name;\n    private Set<Group>\
  \ groups = new HashSet<>();\n\n    @Id\n    @GeneratedValue(strategy=GenerationType.AUTO)\n\
  \    @Column(name=\"ID\")\n    public Integer getId() {\n        return id;\n  \
  \  }\n\n    public void setId(Integer id) {\n        this.id = id;\n    }\n\n  \
  \  @Column(name=\"NAME\", nullable=false, length=100)\n    public String getName()\
  \ {\n        return name;\n    }\n\n    public void setName(String name) {\n   \
  \     this.name = name;\n    }\n\n    @ManyToMany(cascade=CascadeType.PERSIST, fetch=FetchType.LAZY)\n\
  \    @JoinTable(\n        name=\"USER_GROUP\",\n        joinColumns = @JoinColumn(name=\"\
  USER_ID\", referencedName=\"ID\"),\n        inverseJoinColumns = @JoinColumn(name=\"\
  GROUP_ID\", referencedName=\"ID\")\n    )\n    public Set<Group> getGroups() {\n\
  \        return groups;\n    }\n\n    public void setGroups(Set<Group> groups) {\n\
  \        this.groups = groups;\n    }\n}\n```\n\n### 表结构\n\n```sql\nDROP TABLE user_group;\n\
  DROP TABLE user;\nDROP TABLE groups;\n\nCREATE TABLE user (\n    ID int(11) NOT\
  \ NULL AUTO_INCREMENT,\n    NAME varchar(100) NOT NULL,\n    PRIMARY KEY (ID)\n\
  );\n\nCREATE TABLE groups (\n    ID int(11) NOT NULL AUTO_INCREMENT,\n    NAME varchar(100)\
  \ NOT NULL,\n    PRIMARY KEY (ID)\n);\n\nCREATE TABLE user_group (\n    USER_ID\
  \ int(11) NOT NULL,\n    GROUP_ID int(11) NOT NULL,\n    PRIMARY KEY (USER_ID, GROUP_ID),\n\
  \    KEY (GROUP_ID),\n    KEY (USER_ID),\n    CONSTRAINT FOREIGN KEY (USER_ID) REFERENCES\
  \ user (ID),\n    CONSTRAINT FOREIGN KEY (GROUP_ID) REFERENCES groups (ID)\n);\n\
  ```\n\n### 开发数据访问层\n\n接下来我们将查看数据访问层。我们将跳转到获取所有记录操作的测试用例。请注意，我们将讨论数据访问层，它主要管理 `User`\
  \ 和 `Group` 的连接。User 数据访问层与 Group 数据访问实现保持与早期章节中讨论的相同。\n\n```java\n@RunWith(SpringJUnit4ClassRunner.class)\n\
  @ContextConfiguration(locations = {\"classpath:context.xml\"})\n@TransactionConfiguration(defaultRollback\
  \ = true)\n@Transactional\npublic class UserGroupDaoImplTest {\n    @Autowired\n\
  \    private UserDao userDao;\n    @Autowired\n    private GroupDao groupDao;\n\
  \    @Autowired\n    private UserGroupDao userGroupDao;\n\n    @Test\n    public\
  \ void testGetAll() {\n        Assert.assertEquals(0L, userGroupDao.getAll().size());\n\
  \    }\n}\n```\n\n我们将理解为测试编写数据访问操作。使用 Hibernate `createQuery` 方法配合 SQL 从 `User`\
  \ 实体和 `Groups` 检索所有记录。SQL 从连接表中检索 `User` 和 `Group` 的唯一组合。\n\n```java\n@Repository\n\
  @Transactional\npublic class UserGroupDaoImpl implements UserGroupDao {\n    @Autowired\n\
  \    private SessionFactory sessionFactory;\n\n    @Override\n    public List<User>\
  \ getAll() {\n        return sessionFactory.getCurrentSession().createQuery(\"select\
  \ distinct u from User u join u.groups\").list();\n    }\n}\n```\n\n现在让我们观察 `isPresent`\
  \ 操作的测试。向 `User` 实体和 `Group` 实体插入单行并将它们连接。随后，检查 `isPresent` 结果是否匹配该记录。\n\n```java\n\
  public class UserGroupDaoImpl {\n    @Autowired\n    private UserDao userDao;\n\
  \    @Autowired\n    private GroupDao groupDao;\n    @Autowired\n    private UserGroupDao\
  \ userGroupDao;\n\n    @Test\n    public void testPresent() {\n        boolean status\
  \ = false;\n        User u1 = new User();\n        u1.setName(\"User\");\n     \
  \   userDao.save(u1);\n\n        Group g1 = new Group();\n        g1.setName(\"\
  Group\");\n        groupDao.save(g1);\n\n        u1.getGroups().add(g1);\n     \
  \   userDao.update(u1);\n\n        List<User> userList = userGroupDao.isPresent(u1.getId(),\
  \ g1.getId());\n        if (userList != null && userList.size() > 0) {\n       \
  \     status = true;\n        }\n        Assert.assertTrue(status);\n    }\n}\n\
  ```\n\n`isPresent` 操作只是请求 Hibernate `Session.createQuery` 方法，传递 `User` 和 `Group`\
  \ 标识并检查连接是否存在。\n\n```java\n@Repository\n@Transactional\npublic class UserGroupDaoImpl\
  \ implements UserGroupDao {\n    @Autowired\n    private SessionFactory sessionFactory;\n\
  \n    @Override\n    public List<User> isPresent(Integer userId, Integer groupId)\
  \ {\n        String hql = \"select distinct u from User u join u.groups g where\
  \ u.id=:userId and g.id=:groupId\";\n        Query query = sessionFactory.getCurrentSession().createQuery(hql);\n\
  \        query.setParameter(\"userId\", userId);\n        query.setParameter(\"\
  groupId\", groupId);\n        return query.list();\n    }\n}\n```\n\n### 开发业务服务\n\
  \n我们将继续业务层。首先，我们将对获取所有记录操作进行测试。\n\n```java\n@RunWith(SpringJUnit4ClassRunner.class)\n\
  @ContextConfiguration(locations = {\"classpath:context.xml\"})\n@TransactionConfiguration(defaultRollback\
  \ = true)\n@Transactional\npublic class UserGroupServiceImplTest {\n    @Autowired\n\
  \    private UserService userService;\n    @Autowired\n    private GroupService\
