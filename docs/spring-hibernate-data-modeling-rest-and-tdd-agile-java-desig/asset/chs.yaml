  \ 实例，这些实例也可能与其他的 `Clients` 共享。由于关系是双向的，因此在所有方 `Client` 端指定了对 `Accounts` 列表的引用。`@ManyToMany`\
  \ 注解定义了一个具有多对多多性的多值关联。连接表指定在所有方端，在这种情况下是 `Client`。`@JoinTable` 注解通常指定连接表名称以及连接列名和反向连接列名。\n\
  \n```java\n@Entity\n@Table(name=”CLIENT”)\npublic class Client {\n    private Integer\
  \ id;\n    private String name;\n    private Set<Account> accounts = new HashSet<Account>();\n\
  \n    @Id\n    @GeneratedValue(strategy=GenerationType.AUTO)\n    @Column(name=”ID”)\n\
  \    public Integer getId() {\n        return id;\n    }\n\n    public void setId(Integer\
  \ id) {\n        this.id = id;\n    }\n\n    @Column(name=”NAME”, nullable=false,\
  \ length=100)\n    public String getName() {\n        return name;\n    }\n\n  \
  \  public void setName(String name) {\n        this.name = name;\n    }\n\n    @ManyToMany(cascade\
  \ = CascadeType.PERSIST, fetch = FetchType.LAZY)\n    @JoinTable(  name = “CLIENT_ACCOUNT”,\
  \ \n    joinColumns = @JoinColumn(name = “CLIENT_ID”, referencedColumnName=”ID”),\
  \ \n    inverseJoinColumns = @JoinColumn(name = “ACCOUNT_ID”, referencedColumnName=”ID”))\n\
  \    public Set<Account> getAccounts() {\n        return accounts;\n    }\n\n  \
  \  public void setAccounts(Set<Account> accounts) {\n        this.accounts = accounts;\n\
  \    }\n}\n```\n\n我们正在解决一个多对多的双向关系。如果关系是双向的，非所有方（在本例中是 `Account`）必须使用 `@ManyToMany`\
  \ 注解的 `mappedBy` 元素来指定所有方的字段或属性。\n\n```java\n@Entity\n@Table(name=”ACCOUNT”)\npublic\
  \ class Account {\n    private Integer id;\n    private String number;\n    private\
  \ Set<Client> clients = new HashSet<Client>();\n\n    @Id\n    @GeneratedValue(strategy=GenerationType.AUTO)\n\
  \    @Column(name=”ID”)\n    public Integer getId() {\n        return id;\n    }\n\
  \n    public void setId(Integer id) {\n        this.id = id;\n    }\n\n    @Column(name=”NUMBER”,\
  \ nullable=false, length=100)\n    public String getNumber() {\n        return number;\n\
  \    }\n\n    public void setNumber(String number) {\n        this.number = number;\n\
  \    }\n\n    @ManyToMany(fetch = FetchType.LAZY, mappedBy=”accounts”)\n    public\
  \ Set<Client> getClients() {\n        return clients;\n    }\n\n    public void\
  \ setClients(Set<Client> clients) {\n        this.clients = clients;\n    }\n}\n\
