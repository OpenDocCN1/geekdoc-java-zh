  \ JSON 的创建。\n\n#### 开发实体层\n\n作为执行方法，我们遵循测试驱动的方法，因此首先创建两个 `Category` 实例，其中一个是根节点，另一个以根节点为父级的类别。稍后，我们进行修改并测试更改。最后，我们移除一个实例并测试计数。\n\
  \n```java\n@RunWith( SpringJUnit4ClassRunner.class )\n@ContextConfiguration( locations\
