  DROP TABLE `contractor_employee`;\nDROP TABLE `employee`;\nCREATE TABLE `employee`\
  \ (\n    `ID` int(11) NOT NULL,\n    `NAME` varchar(100) NOT NULL,\n    PRIMARY\
  \ KEY (`ID`)\n) ;\n\nCREATE TABLE `permanent_employee` (\n    `LEAVES` int(11) NOT\
  \ NULL,\n    `SALARY` int(11) NOT NULL,\n    `ID` int(11) NOT NULL,\n    PRIMARY\
