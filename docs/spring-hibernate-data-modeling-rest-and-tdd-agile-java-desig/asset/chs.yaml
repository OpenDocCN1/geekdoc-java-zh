  }else if(buttonValue==”Update”){\n  update();\n}\n\nreturn false;\n\n}\n```\n\n\
  接下来我们将查看 `create` Javascript 方法，它接收来自文本框 `name` 和 `parent` 的输入，并将该对象作为不带标识符的 `CategoryDto`\
  \ 传递。\n\n```javascript\nfunction create(){\n  var name = $(“#name”).val();\n  var\
  \ parentId = document.getElementById(“parentId”).value;\n  if(parentId !=null){\n\
