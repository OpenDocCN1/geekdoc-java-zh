  在本章中，我们讨论了以下内容：\n\n* 开发 mock 内存数据库\n* 开发 mock 用户界面\n* 开发与类表继承相关的实体\n* 开发数据访问层\n\
  * 开发业务服务层\n* 开发 REST 服务控制器。\n\n## 第 16 章 类表继承\n\n在之前的两个章节中，我们查看了两种继承方法：一种是单表模式，另一种是具体表模式。在本章中，我们将查看第三种也是最后一种继承方法。本章是关于使用类表继承关系进行开发流程的概述。我们将结束创建用户界面的旅程，然后编写真正的服务。在最后，我们将结合两种解决方案并得出一个深思的结论。\n\
  \n### 领域模型\n\n![Image](img/00035.jpeg)\n\n*图 16-1：类表继承关系*\n\n我们将从图 16-1 所示的类表继承关系开始。这是一个规范化设计的示例。`Employee`\
  \ 实体有一个标识符（`identifier`）和一个 `String` 类型的名称（`name`）字段。`Permanent` 实体有一个标识符，作为指向父类的外键，并拥有\
  \ `leaves` 和 `salary` 等字段。`Contractor` 实体也有一个标识符，作为 `Employee` 标识符的外键，并拥有 `hourly\
  \ rates` 和 `overtime rate` 等字段。\n\n### 开发用户界面\n\n我们将用户界面开发分为三个主要任务：数据传输对象（DTO）、mock\
  \ 服务和 mock 用户界面。我们将一个接一个查看这些任务。\n\n### 开发数据传输对象\n\n数据传输对象包含 `EmployeeDto`，它有一个标识符和一个名称。`EmployeeDto`\
  \ 有两个子类型，称为 `PermanentEmployeeDto`（它也拥有 `salary` 和 `leaves`）和 `ContractorEmployeeDto`（它拥有\
  \ `hourly rate` 和 `overtime rate`）。\n\n```java\n@JsonTypeInfo(use = JsonTypeInfo.Id.NAME,\
  \ include = JsonTypeInfo.As.PROPERTY, property = “type”)\n@JsonSubTypes({\n @Type(value\
  \ = PermanentEmployeeDto.class, name = “permanentEmployee”),\n @Type(value = ContractorEmployeeDto.class,\
  \ name = “contractorEmployee”)\n})\npublic class EmployeeDto {\nprivate Integer\
  \ id;\nprivate String name;\n}\n```\n\n```java\npublic class PermanentEmployeeDto\
  \ extends EmployeeDto {\nprivate Integer leaves;\nprivate Integer salary;\n}\n```\n\
  \n```java\npublic class ContractorEmployeeDto extends EmployeeDto {\nprivate Integer\
  \ hourlyRate;\nprivate Integer overtimeRate;\n}\n```\n\n### 开发 mock 服务\n\n让我们从向内存数据库执行一个简单的\
  \ `add` 操作开始，该数据库是基于 `enum` 实现的 `Singleton` 模式。\n\n```java\npublic enum EmployeeInMemoryDB\
  \ {\nINSTANCE;\nprivate static List<EmployeeDto> list = new ArrayList<EmployeeDto>();\n\
  private static Integer lastId = 0;\n\npublic Integer getId() {\nreturn ++lastId;\n\
  }\n\npublic void add(EmployeeDto employeeDto) {\nemployeeDto.setId(getId());\nlist.add(employeeDto);\n\
  }\n}\n```\n\n我们将关注 mock 服务中的 `create` 功能，该功能使用上述内存目录来持久化数据。\n\n```java\n@Controller\n\
  @RequestMapping(value=”classtableinheritance/mock”)\npublic class EmployeeMockController\
  \ {\n@RequestMapping(value=”/create”, method=RequestMethod.POST)\n@ResponseBody\n\
  public void create(@RequestBody EmployeeDto employee){\nEmployeeInMemoryDB.INSTANCE.add(employee);\n\
  }\n}\n```\n\n接下来，我们将查看负责检索所有行的的方法。首先，我们将审查控制器将使用的内存数据库操作。\n\n```java\npublic enum\
  \ EmployeeInMemoryDB{\npublic List<EmployeeDto> findAll() {\nreturn list;\n}\n\n\
  public EmployeeDto findById(Integer id) {\nfor (EmployeeDto dto:list) {\nif (dto.getId()==id)\n\
  return dto;\n}\nreturn null;\n}\n}\n```\n\n`/findAll` 返回 `EmployeeDto` 子类型的所有实例，而\
  \ `/findById` 返回 `PermanentDto` 或 `ContractorDto` 的特定行。\n\n```java\npublic class\
  \ EmployeeMockController {\n@RequestMapping(value=”/findAll”, method=RequestMethod.GET)\n\
  public @ResponseBody EstateDto[] findAll(){\nList<EstateDto> list = EmployeeInMemoryDB.INSTANCE.findAll();\n\
  return list.toArray(new EstateDto[list.size()]);\n}\n\n@RequestMapping(value=”/findById/{employeeid}”,\
  \ method=RequestMethod.GET)\npublic @ResponseBody EstateDto findById(@PathVariable(“employeeid”)\
  \ Integer employeeid){\nreturn EmployeeInMemoryDB.INSTANCE.findById(employeeid);\n\
  }\n}\n```\n\n接下来我们将看到 `remove` 操作，它根据标识符删除特定的行。\n\n```java\npublic void remove(Integer\
  \ id) {\nEmployeeDto toRemove = null;\n}\n```\n\n\n\n\n\n```java\nfor (EmployeeDto\
  \ dto:list) \n    if (dto.getId()==id) toRemove = dto;\n    if (toRemove!=null)\
  \ list.remove(toRemove);\n}\n```\n\n`/remove` 操作根据给定的标识符删除特定的行。\n\n```java\npublic\
  \ class EmployeeMockController {\n    @RequestMapping(value=\"/remove/{employeeid}”,\
  \ method=RequestMethod.POST)\n    @ResponseStatus(value = HttpStatus.NO_CONTENT)\n\
  \    public void remove(@PathVariable(“employeeid”) Integer employeeid){\n     \
  \   EmployeeInMemoryDB.INSTANCE.remove(employeeid);\n    }\n}\n```\n\n`edit` 方法使用特定细节更新某行。让我们来看看控制器将要使用的内存数据库操作。\n\
  \n```java\npublic class EmployeeInMemoryDB {\n    public void edit(EmployeeDto employeeDto)\
  \ {\n        for (EmployeeDto dto:list) {\n            if (dto.getId()==employeeDto.getId())\
  \ {\n                dto.setName(employeeDto.getName());\n                if(employeeDto\
  \ instanceof PermanentEmployeeDto) {\n                    ((PermanentEmployeeDto)dto).setLeaves(((PermanentEmployeeDto)employeeDto).getLeaves());\n\
  \                    ((PermanentEmployeeDto)dto).setSalary(((PermanentEmployeeDto)employeeDto).getSalary());\n\
  \                } else if(employeeDto instanceof ContractorEmployeeDto) {\n   \
  \                 ((ContractorEmployeeDto)dto).setHourlyRate(((ContractorEmployeeDto)employeeDto).getHourlyRate());\n\
  \                    ((ContractorEmployeeDto)dto).setOvertimeRate(((ContractorEmployeeDto)employeeDto).getOvertimeRate());\n\
  \                }\n            }\n        }\n    }\n}\n```\n\n`/edit` 操作使用 HTTP\
  \ POST 方法更新详细信息的行。\n\n```java\npublic class EmployeeMockController {\n    @RequestMapping(value=”edit”,\
  \ method=RequestMethod.POST)\n    @ResponseBody\n    public void edit(@RequestBody\
  \ EmployeeDto employee){\n        EmployeeInMemoryDB.INSTANCE.edit(employee);\n\
  \    }\n}\n```\n\n### 开发模拟用户界面\n\n现在让我们如何生成图 16-2 所示的用户界面。\n\n![Image](img/00036.jpeg)\n\
