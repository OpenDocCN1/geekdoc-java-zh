  \    }\n}\n```\n\n下面的测试操作是通过标识符查找行，它使用获取所有记录操作来检索第二个学生的标识符。然后该标识符被传递给带有标识符的方法，并检查实例是否为空。注意，重要的是通过获取所有记录操作检索标识符，而不是硬编码任何标识符导致不可移植的测试代码。\n\
