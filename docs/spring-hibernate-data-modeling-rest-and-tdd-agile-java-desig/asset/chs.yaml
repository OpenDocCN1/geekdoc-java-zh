  \n`editObject` 和 `viewObject` JavaScript 方法调用允许选择一条记录进行编辑操作。\n\n```javascript\n\
  function editObject(stuid){\n  editurl=”/Spring-OODD/onetooneselfreference/mock/findById/”+stuid;\n\
  \  var studentForm={id:stuid};\n  $.ajax({\n    url : editurl,\n    type: “GET”,\n\
