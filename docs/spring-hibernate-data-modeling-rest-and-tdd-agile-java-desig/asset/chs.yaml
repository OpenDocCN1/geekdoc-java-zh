  \ this.name = name;\n  }\n\n  @ManyToOne(cascade=CascadeType.PERSIST)\n  @JoinColumn(name=”CAT_ID”,nullable=true)\n\
  \  public Category getCategory() {\n    return category;\n  }\n  public void setCategory(Category\
  \ category) {\n    this.category = category;\n  }\n}\n```\n\n### 表结构\n\n```sql\n\
