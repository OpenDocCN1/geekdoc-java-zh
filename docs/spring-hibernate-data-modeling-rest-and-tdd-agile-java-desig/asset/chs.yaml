  \n### 领域模型\n\n![Image](img/00023.jpeg)\n\n*图 10-1: 多对多的双向关系*\n\n我们将评估图 10-1 所示的多对多双向关系。`Client`\
  \ 实体有一个标识符和一个类型为 `String` 的名称字段，`Account` 实体也是如此。所有多对多关系都需要一个所有者。在这个示例中，`Client`\
  \ 是所有者。在 `Client` 的一个实例中，必须链接一个或多个 `Account` 实例，而这些 `Account` 实体反过来可以被许多 `Client`\
  \ 实体共享。由于关系是双向的，你可以从 `Client` 遍历 `Accounts` 列表，反向遍历也是允许。我们将遵循常规路线，首先编写 mock 用户界面，然后编写真实的服务。\n\
  \n### 开发用户界面\n\n在开发 mock 用户界面期间，我们关注的三个主要任务是创建数据传输对象（DTO）、mock 服务和 mock 用户界面。我们将按照顺序逐一进行。\n\
  \n### 开发数据传输对象\n\n`ClientDto` 数据传输对象包含标识符和客户端的名称。同样，`AccountDto` 对象也有标识符和名称。`ClientAccountDto`\
  \ 代表两者之间的链接。\n\n```java\npublic class ClientDto {\n    private Integer id;\n   \
  \ private String name;\n}\n\npublic class AccountDto {\n    private Integer id;\n\
  \    private String name;\n}\n\npublic class ClientAccountDto {\n    private ClientDto\
  \ clientDto;\n    private AccountDto accountDto;\n}\n```\n\n### 开发 mock 服务\n\nmock\
  \ 服务将管理 `ClientAccountDto` 对象。我们将使用 `List` 在内存中存储这些对象，并提供添加、查找和检查存在的方法。\n\n```java\n\
