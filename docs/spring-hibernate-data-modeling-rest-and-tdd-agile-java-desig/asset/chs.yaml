  ### 开发业务服务层\n\n我们将从业务服务层开始，因为数据访问层已经开发完成，并准备好与业务服务层集成。首先，让我们来看获取所有记录操作的测试。由于这是第一个被测试的功能，其他操作尚未开发，只有“查找所有记录”操作可以在表为空时返回零条记录并进行测试。\n\
  \n```java\n@RunWith( SpringJUnit4ClassRunner.class )\n@ContextConfiguration( locations\
  \ = { “classpath:context.xml” } )\n@TransactionConfiguration( defaultRollback =\
  \ true )\n@Transactional\npublic class BookServiceImplTest {\n  @Autowired\n  private\
  \ BookService service ;\n\n  @Test\n  public void testFindAll() {\n    Assert.assertEquals(0L,\
  \ service.findAll().size());\n  }\n}\n```\n\n查看如何在业务服务中编写匹配方法。数据访问层使用实体类（entities），而业务服务层使用数据访问对象（DAOs）。因此，存在一个\
  \ mapper 将数据传输对象（DTO）转换为实体，反之亦然。\n\n```java\n@Service\n@Transactional\npublic class\
  \ BookServiceImpl implements BookService {\n  @Autowired\n  private BookDao dao;\n\
  \n  @Autowired\n  private BookMapper mapper;\n\n  @Override\n  public List<BookDto>\
  \ findAll() {\n    List<Book> books = dao.getAll();\n    List<BookDto> bookDtos\
  \ = new ArrayList<BookDto>();\n    for(Book book : books){\n      bookDtos.add(mapper.mapEntityToDto(book));\n\
  \    }\n    return bookDtos;\n  }\n}\n```\n\nMapper 通常有两个重要的操作，将数据访问对象转换为等效实体，反之亦然。这里需要观察的一点是，每当更新或添加\
  \ `Book` 时，都会创建一个 `Shipping` 标识符。正如我们之前提到的，`Shipping` 实体标识符的管理将由服务内部完成。用户界面团队只需传递\
  \ `Shipping` 实体中的数据值（例如城市字段），而无需关心 `Shipping` 实体的标识符。\n\n```java\n@Component\npublic\
  \ class BookMapper {\n  public Book mapDtoToEntity(BookDto bookDto){\n    Book book\
  \ = new Book();\n    Shipping shipping = new Shipping();\n    if(null!=bookDto.getId()\
  \ book.setId(bookDto.getId());\n    if(null!=bookDto.getName()) book.setName(bookDto.getName());\n\
  \    if(null!=bookDto.getCity()){ shipping.setCity(bookDto.getCity()); book.setShipping(shipping);}\n\
  \    return book;\n  }\n\n  public BookDto mapEntityToDto(Book book){\n    BookDto\
  \ bookDto = new BookDto();\n    if(null!=book.getId()) bookDto.setId(book.getId());\n\
  \    if(null!=book.getName()) bookDto.setName(book.getName());\n    if(null!=book.getShipping()){\n\
  \      if(null !=book.getShipping().getCity()){\n        bookDto.setCity(book.getShipping().getCity());\n\
  \      }\n    }\n    return bookDto;\n  }\n}\n```\n\n接下来是创建测试操作，它创建一个实体的实例，并结合“获取所有记录”操作检查计数是否为一。\n\
  \n```java\npublic class BookServiceImplTest {\n  @Autowired\n  private BookService\
  \ service ;\n\n  @Test\n  public void testCreate() {\n    BookDto bookDto = new\
  \ BookDto();\n    bookDto.setName(“Java SE”);\n    bookDto.setCity(“IND”);\n   \
  \ service.create(bookDto);\n    Assert.assertEquals(1L, service.findAll().size());\n\
  \  }\n}\n```\n\n业务服务层中的相应方法接受一个数据访问对象，将其转换为等效实体，并委托给数据访问层保存到数据库。\n\n```java\npublic\
  \ class BookServiceImpl implements BookService {\n  @Autowired\n  private BookDao\
  \ dao;\n\n  @Autowired\n  private BookMapper mapper;\n\n  @Override\n  public void\
  \ create(BookDto bookDto) {\n    dao.insert(mapper.mapDtoToEntity(bookDto));\n \
  \ }\n}\n```\n\n接下来的测试操作将被定义为根据给定标识符查找行。\n\n```java\npublic class BookServiceImplTest\
  \ {\n  @Autowired\n  private BookService service ;\n\n  @Test\n  public void testFindById()\
  \ {\n    BookDto bookDto = new BookDto();\n    bookDto.setName(“Java SE”);\n   \
  \ bookDto.setCity(“IND”);\n    service.create(bookDto);\n    List<BookDto> bookDtos\
  \ = service.findAll();\n    BookDto bDto = bookDtos.get(0);\n    BookDto bDto2 =\
  \ service.findById(bDto.getId());\n    Assert.assertEquals(“Java SE”, bDto2.getName());\n\
  \    Assert.assertEquals(“IND”, bDto2.getCity());\n  }\n}\n```\n\n现在将描述业务服务中根据给定标识符查找行的类比操作。同样遵循相同的顺序：联系数据访问层并与\
  \ mapper 交互。\n\n```java\npublic class BookServiceImpl implements BookService {\n\
  \  @Autowired\n  private BookDao dao;\n\n  @Autowired\n  private BookMapper mapper;\n\
  \n  @Override\n  public BookDto findById(int id) {\n    Book book = dao.getById(id);\n\
  \    if(null !=book){\n      return mapper.mapEntityToDto(book);\n    }\n    return\
  \ null;\n  }\n}\n```\n\n然后是删除测试操作，它接受给定的标识符并从数据库中删除等效行。测试方法首先创建一个实例，移除同一个实例，并检查数据库中是否为零结果。\n\
  \n```java\npublic class BookServiceImplTest {\n  @Autowired\n  private BookService\
  \ service ;\n\n  @Test\n  public void testRemove() {\n    BookDto bookDto = new\
  \ BookDto();\n    bookDto.setName(“Java SE”);\n    bookDto.setCity(“IND”);\n   \
  \ service.create(bookDto);\n    Assert.assertEquals(1L, service.findAll().size());\n\
  \    List<BookDto> bookDtos = service.findAll();\n    BookDto bDto = bookDtos.get(0);\n\
  \    service.remove(bDto.getId());\n    Assert.assertEquals(0L, service.findAll().size());\n\
  \  }\n}\n```\n\n之后定义相应的业务服务方法，它接受一个标识符并通过数据访问层操作从数据库中删除匹配的实例。\n\n```java\npublic\
  \ class BookServiceImpl implements BookService {\n  @Autowired\n  private BookDao\
  \ dao;\n\n  @Autowired\n  private BookMapper mapper;\n\n  @Override\n  public void\
  \ remove(int id) {\n    Book book = dao.getById(id);\n    dao.delete(book);\n  }\n\
  }\n```\n\n最后一个测试操作是编辑，它创建一个实例，编辑城市，然后检查编辑是否有效。\n\n```java\npublic class BookServiceImplTest\
  \ {\n  @Autowired\n  private BookService service ;\n\n  @Test\n  public void testEdit()\
  \ {\n    BookDto bookDto = new BookDto();\n    bookDto.setName(“Java SE”);\n   \
  \ bookDto.setCity(“IND”);\n    service.create(bookDto);\n    Assert.assertEquals(1L,\
  \ service.findAll().size());\n    List<BookDto> bookDtos2 = service.findAll();\n\
  \    BookDto bDto2 = bookDtos2.get(0);\n    bDto2.setCity(“CAN”);\n    service.edit(bDto2);\n\
  \    List<BookDto> bookDtos = service.findAll();\n    BookDto bDto = bookDtos.get(0);\n\
  \    Assert.assertEquals(“CAN”, bDto.getCity());\n  }\n}\n```\n\n业务服务的相应操作是编辑操作，它通过\
  \ mapper 方法转换后调用数据访问的更新方法。请注意，编辑操作没有 `Shipping` 实体的标识符，因此会生成新实例。\n\n```java\npublic\
  \ class BookServiceImpl implements BookService {\n  @Autowired\n  private BookDao\
  \ dao;\n\n  @Autowired\n  private BookMapper mapper;\n\n  @Override\n  public void\
  \ edit(BookDto bookDto) {\n    dao.update(mapper.mapDtoToEntity(bookDto));\n  }\n\
  }\n```\n\n### 开发表示层\n\n栈中的最后一层是基于 REST 的 Spring Controller，我们将首先为其编写测试。测试首先创建一个\
