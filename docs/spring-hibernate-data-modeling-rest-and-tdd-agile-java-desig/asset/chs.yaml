  \ 的引用。\n\n```java\n@Entity\n@Table(name=”PHONE”)\npublic class Phone {\n  private\
  \ Integer id;\n  private String number;\n\n  @Id\n  @GeneratedValue(strategy=GenerationType.AUTO)\n\
  \  @Column(name=”ID”,length=20)\n  public Integer getId() {\n    return id;\n  }\n\
  \n  public void setId(Integer id) {\n    this.id = id;\n  }\n\n  @Column(name=”NUMBER”,length=20)\n\
  \  public String getNumber() {\n    return number;\n  }\n\n  public void setNumber(String\
  \ number) {\n    this.number = number;\n  }\n}\n```\n\n由于我们正在开发一对多的单向关联，`Person`\
  \ 实例必须有一个或多个 `Phone` 实例。由于关联是单向的，声明了 `Phone` 列表。我们还使用 `orphanRemoval=true`，因为如果重新赋值\
  \ `Phones` 集合，旧的 `Phones` 将被删除。`Person` 通过此实体使用 `@JoinColumn` 注解引用标识符。\n\n```java\n\
  @Entity\n@Table(name=”PERSON”)\npublic class Person {\n  private Integer id;\n \
  \ private String name;\n  private List<Phone> phones;\n\n  @Id\n  @GeneratedValue(strategy=GenerationType.AUTO)\n\
  \  @Column(name=”ID”,length=20)\n  public Integer getId() {\n    return id;\n  }\n\
  \n  public void setId(Integer id) {\n    this.id = id;\n  }\n\n  @Column(name=”name”,length=50)\n\
  \  public String getName() {\n    return name;\n  }\n\n  public void setName(String\
  \ name) {\n    this.name = name;\n  }\n\n  @OneToMany(cascade=CascadeType.ALL,orphanRemoval=true)\n\
  \  @JoinColumn(name=”PERSON_ID”)\n  public List<Phone> getPhones() {\n    return\
  \ phones;\n  }\n\n  public void setPhones(List<Phone> phones) {\n    this.phones\
  \ = phones;\n  }\n}\n```\n\n### 表结构\n\n```sql\nDROP TABLE `phone`;\nDROP TABLE `person`;\n\
