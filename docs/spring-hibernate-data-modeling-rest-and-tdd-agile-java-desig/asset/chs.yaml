  \ and setters\n}\n```\n\n### 开发 mock 服务\n\n我们将只看到如何管理 `User` 和 `Group` 之间的连接。正如前面的章节所讨论，针对\
  \ `User` 以及 `Group` 的常规创建、读取、删除和编辑操作保持相同的实现。为了方便参考，如果你在理解流程时遇到任何问题，附录中提供了完整源代码链接。mock\
  \ 服务将与内存数据库交互以保存数据，这些数据将被数据消耗。\n\n```java\npublic class UserGroupDB {\n    private\
