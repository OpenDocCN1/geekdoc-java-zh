  public class ProtocolServiceImpl implements ProtocolService {\n    @Autowired\n\
  \    private ProtocolDao protocolDao;\n\n    @Autowired\n    private ProtocolMapper\
  \ protocolMapper;\n\n    @Override\n    public List<ProtocolDto> findAll() {\n \
