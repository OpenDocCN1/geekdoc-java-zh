  \ protocols){\n            protocolDtos.add(protocolMapper.mapEntityToDto(protocol));\n\
  \        }\n        return protocolDtos;\n    }\n}\n```\n\n映射器通常有两个重要的操作，用于在数据访问对象和实体之间进行相互转换。\n\
  \n```java\n@Component\npublic class ProtocolMapper {\n    public Protocol mapDtoToEntity(ProtocolDto\
  \ protocolDto){\n        if(protocolDto instanceof TCPDto) {\n            TCP tcp\
  \ = new TCP();\n            if(null!=protocolDto.getId()) tcp.setId(protocolDto.getId());\n\
  \            if(null!=protocolDto.getName()) tcp.setName(protocolDto.getName());\n\
  \            return tcp;\n        } else if(protocolDto instanceof SNMPDto) {\n\
  \            SNMP snmp = new SNMP();\n            if(null!=protocolDto.getId())\
  \ snmp.setId(protocolDto.getId());\n            if(null!=protocolDto.getName())\
  \ snmp.setName(protocolDto.getName());\n            return snmp;\n        }\n  \
  \      return null;\n    }\n}\n```\n\n\n\n\n\n```java\npublic ProtocolDto mapEntityToDto(Protocol\
  \ protocol){\n    if(protocol instanceof TCP) {\n        TCPDto tcpDto = new TCPDto();\n\
  \        if(null!=protocol.getId()) tcpDto.setId(protocol.getId());\n        if(null!=protocol.getName())\
  \ tcpDto.setName(protocol.getName());\n        return tcpDto;\n    } else if(protocol\
  \ instanceof SNMP) {\n        SNMPDto snmpDto = new SNMPDto();\n        if(null!=protocol.getId())\
  \ snmpDto.setId(protocol.getId());\n        if(null!=protocol.getName()) snmpDto.setName(protocol.getName());\n\
  \        return snmpDto;\n    }\n    return null;\n}\n```\n\n接下来是创建操作，用于在数据库中创建新行。\n\
