  \n```java\npublic class CategoryDto {\n    private Integer id;\n    private String\
  \ name;\n    private Integer parentId;\n    // getters and setters\n}\n```\n\n###\
  \ 开发 mock 服务\n\nmock 服务将与一个内存自定义数据库交互，用于持久化 mock 用户界面将要使用的数据。我们将实现一个 `add` 功能。我们有一个\
  \ `CategoryDto` 列表，每当有一个新问题，就会向列表中添加一个具有名称和父级标识符的 `CategoryDto` 实例。使用使用 `enum` 实现的单例设计模式来注册内存集合操作。标识符字段从\
  \ 1 开始，每新增一次计数就增加 1。\n\n```java\npublic enum CategoryInMemoryDB {\n    INSTANCE;\n\
  \    private static List<CategoryDto> list = new ArrayList<CategoryDto>();\n   \
  \ private static Integer lastId = 0;\n\n    public Integer getId() {\n        return\
  \ ++lastId;\n    }\n\n    public void add(CategoryDto categoryDto) {\n        categoryDto.setId(getId());\n\
  \        list.add(categoryDto);\n    }\n}\n```\n\n现在让我们来看对应的 mock 服务实现。`create`\
  \ 方法从用户界面收集一个 `CategoryDto` 实例，并通过 mock 服务增加列表。\n\n```java\n@Controller\n@RequestMapping(value=\"\
  /onetomanyselfreference/mock\")\npublic class CategoryMockController {\n    @RequestMapping(value=\"\
  /create\", method=RequestMethod.POST)\n    @ResponseBody\n    public void create(@RequestBody\
  \ CategoryDto categoryDto) {\n        CategoryInMemoryDB.INSTANCE.add(categoryDto);\n\
  \    }\n}\n```\n\n接下来我们将继续处理查找所有行和根据标识符查找的部分。\n\n```java\npublic enum CategoryInMemoryDB\
  \ {\n    public List<CategoryDto> findAll(){ return list; }\n    public CategoryDto\
  \ findById(Integer id) {\n        for(CategoryDto categoryDto : list){ \n      \
  \      if(categoryDto.getId() == id) \n        }\n        return null;\n    }\n\
  }\n```\n\n在 mock 服务中，`findAll` 产生 `CategoryDto` 列表，而根据标识符查找则获取 `CategoryDto` 实例。\n\
  \n```java\npublic class CategoryMockController {\n    @RequestMapping(value=\"/findAll\"\
  , method=RequestMethod.GET)\n    public @ResponseBody List<CategoryDto> findAll(){\n\
  \        return CategoryInMemoryDB.INSTANCE.findAll();\n    }\n\n    @RequestMapping(value=\"\
  /findById/{Id}\", method=RequestMethod.GET)\n    public @ResponseBody CategoryDto\
  \ findById(@PathVariable(\"Id\") Integer Id) {\n        return CategoryInMemoryDB.INSTANCE.findById(Id);\n\
  \    }\n}\n```\n\n接下来我们将设计 `remove` 操作，根据标识符删除特定行。\n\n```java\npublic enum CategoryInMemoryDB\
  \ {\n    public void remove(Integer id) {\n        CategoryDto dto = null;\n   \
  \     for(CategoryDto categoryDto : list){\n            if(categoryDto.getId() ==\
  \ id) {\n                boolean flag = false;\n                for(CategoryDto\
  \ category2 : list){\n                    if (id==category2.getParentId()) {\n \
  \                       flag = true;\n                    }\n                }\n\
  \                if (!flag) {\n                    dto = categoryDto;\n        \
  \            break;\n                }\n            }\n        }\n        if(null\
  \ != dto) list.remove(dto);\n    }\n}\n```\n\n在对应的 mock 服务中，`remove` 操作通过提供的 URL\
  \ 标识符消除特定行。\n\n```java\npublic class CategoryMockController {\n    @RequestMapping(value=\"\
  /remove/{Id}\", method=RequestMethod.POST)\n    @ResponseStatus(value = HttpStatus.NO_CONTENT)\n\
  \    public void remove(@PathVariable(\"Id\") Integer Id) {\n        CategoryInMemoryDB.INSTANCE.remove(Id);\n\
  \    }\n}\n```\n\n最后我们查看负责更新行的 `edit` 操作。\n\n```java\npublic enum CategoryInMemoryDB\
  \ {\n    public void edit(CategoryDto categoryDto) {\n        for(CategoryDto dto\
  \ : list){\n            if(categoryDto.getId() == dto.getId()){\n              \
  \  dto.setName(categoryDto.getName());\n                dto.setParentId(categoryDto.getParentId());\n\
  \                break;\n            }\n        }\n    }\n}\n```\n\n`edit` 操作接收\
  \ `CategoryDto` 的转换副本并偏移更新特定行。\n\n```java\npublic class CategoryMockController {\n\
  \    @RequestMapping(value=\"/edit\", method=RequestMethod.POST)\n    @ResponseBody\n\
  \    public void edit(@RequestBody CategoryDto categoryDto) {\n        CategoryInMemoryDB.INSTANCE.edit(categoryDto);\n\
  \    }\n}\n```\n\n#### 开发 mock 用户界面\n\n我们测试了上一部分如何使用内存构建 mock 服务。现在来编写接收该 mock 服务的用户界面。用户界面将具有添加、编辑、删除和显示所有相关\
  \ `Category` 记录的功能。用户界面的截图如图 8-2 所示。\n\n!图片\n\n*图 8-2：分类用户界面截图*\n\nJSP body 是执行的初始页面，之后会调用\
