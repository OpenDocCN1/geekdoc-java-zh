  \ JSON 的 REST 服务。让我们一个一个来看，并采用自底上的方法，从实体开始一直到 REST 服务。\n\n### 开发资源（实体）层\n\n首先，我们将查看\
  \ `Employee` 实体的测试，该测试包含了基本的 CRUD 操作。\n\n```java\n@RunWith( SpringJUnit4ClassRunner.class\
  \ )\n@ContextConfiguration( locations = { “classpath:context.xml” } )\n@TransactionConfiguration(\
  \ defaultRollback = true )\n@Transactional\npublic class EmployeeTest {\n@Autowired\n\
  private SessionFactory sessionFactory;\n@SuppressWarnings(“unchecked”)\n@Test\n\
  public void testCRUD()\n{\nEmployee e1 = new Employee();\ne1.setName(“A”);\nEmployee\
  \ e2 = new Employee();\ne2.setName(“B”);\nsessionFactory.getCurrentSession().save(e1);\n\
  sessionFactory.getCurrentSession().save(e2);\ne1.setName(“C”);\nsessionFactory.getCurrentSession().merge(e1);\n\
  List<Employee> list = sessionFactory.getCurrentSession().createQuery(“from Employee”).list();\n\
  Assert.assertEquals(2L, list.size());\nsessionFactory.getCurrentSession().delete(e1);\n\
  list<Employee> list2 = sessionFactory.getCurrentSession().createQuery(“from Employee”).list();\n\
  Assert.assertEquals(1L, list2.size());\n}\n}\n```\n\n我们将查看 `Employee` 实体的定义。`@Inheritance`\
  \ 注解定义了继承策略，即类表继承，也称为连接策略（Joined strategy）。这种策略为层次结构中的所有类都有一个表，是一种规范化的设计。例如，`Permanent`\
  \ 实体将有一个标识符，它是指向 `Employee` 实体的外键，以及 `salary` 和 `leaves` 字段。同样，`Contractor` 实体将有一个指向\
  \ `Employee` 的外键标识符，以及 `hourlyRate` 和 `overtimeRate` 字段。\n\n```java\n@Entity\n@Table(name\
  \ = “EMPLOYEE”)\n@Inheritance(strategy = InheritanceType.JOINED)\npublic class Employee\
  \ {\nprivate Integer id;\nprivate String name;\n@Id\n@GeneratedValue(strategy =\
  \ GenerationType.TABLE)\n@Column(name = “ID”)\npublic Integer getId() {\nreturn\
  \ id;\n}\npublic void setId(Integer id) {\nthis.id = id;\n}\n@Column(name = “NAME”,\
  \ nullable = false)\npublic String getName() {\nreturn name;\n}\npublic void setName(String\
  \ name) {\nthis.name = name;\n}\n```\n\n接下来，我们将查看 `PermanentEmployee` 实体的测试。\n\n\
  ```java\n@RunWith( SpringJUnit4ClassRunner.class )\n@ContextConfiguration( locations\
  \ = { “classpath:context.xml” } )\n@TransactionConfiguration( defaultRollback =\
  \ true )\n@Transactional\npublic class PermanentEmployeeTest {\n@Autowired\nprivate\
  \ SessionFactory sessionFactory;\n@SuppressWarnings(“unchecked”)\n@Test\npublic\
  \ void testCRUD()\n{\nEmployee e1 = new Employee();\ne1.setName(“A”);\nsessionFactory.getCurrentSession().save(e1);\n\
  PermanentEmployee permanentEmployee = new PermanentEmployee();\npermanentEmployee.setName(“Lalit\
  \ Narayan Mishra”);\npermanentEmployee.setLeaves(20);\npermanentEmployee.setSalary(50000);\n\
  sessionFactory.getCurrentSession().save(permanentEmployee);\npermanentEmployee.setName(“Amritendu\
  \ De”);\nsessionFactory.getCurrentSession().merge(permanentEmployee);\nList<PermanentEmployee>\
  \ list = sessionFactory.getCurrentSession().createQuery(“from PermanentEmployee”).list();\n\
  Assert.assertEquals(1L, list.size());\nsessionFactory.getCurrentSession().delete(permanentEmployee);\n\
  List<PermanentEmployee> list2 = sessionFactory.getCurrentSession().createQuery(“from\
  \ PermanentEmployee”).list();\nAssert.assertEquals(0L, list2.size());\n}\n}\n```\n\
  \n根据上面的测试，我们审查 `PermanentEmployee` 实体的定义。\n\n```java\n@Entity\n@Table(name=”PERMANENT_EMPLOYEE”)\n\
