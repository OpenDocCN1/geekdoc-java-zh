  \ 能力。我们将从实体开始，自底向上构建 REST 服务。\n\n### 开发资源（实体）层\n\n作为一种实现技术，我们遵循测试驱动开发方法，因此我们首先对实体进行测试，然后进行实际开发。首先，我们创建带有特性列表的两个\
  \ Item 实例，并检查这两个 Item 实例。\n\n```java\n@RunWith( SpringJUnit4ClassRunner.class )\n\
  @ContextConfiguration( locations = { “classpath:context.xml” } )\n@TransactionConfiguration(\
  \ defaultRollback = true )\n@Transactional\npublic class ItemTest {\n  @Autowired\n\
  \  private SessionFactory sessionFactory;\n\n  @Test\n  public void testCRUD(){\n\
  \    Item item1 = new Item();\n    item1.setName(“Book”);\n    List<Feature> list\
  \ = new ArrayList<Feature>();\n    Feature feature1 = new Feature();\n    feature1.setName(“Core\
  \ Java”);\n    feature1.setItem(item1);\n    Feature feature2 = new Feature();\n\
  \    feature2.setName(“Spring”);\n    feature2.setItem(item1);\n    list.add(feature1);\n\
  \    list.add(feature2);\n    item1.setFeatures(list);\n    sessionFactory.getCurrentSession().save(item1);\n\
  \  }\n}\n```\n\n\n\n```java\nItem item2 = new Item();\nitem2.setName(“Bags”);\n\n\
  List<Feature> list2 = new ArrayList<Feature>();\nFeature feature3 = new Feature();\n\
  feature3.setName(“SkyBags”);\nfeature3.setItem(item2);\nFeature feature4 = new Feature();\n\
  feature4.setName(“WildCraft”);\nfeature4.setItem(item2);\nlist2.add(feature3);\n\
  list2.add(feature4);\nitem2.setFeatures(list2);\nsessionFactory.getCurrentSession().save(item2);\n\
  \n@SuppressWarnings(“unchecked”)\nList<Item> items = sessionFactory.getCurrentSession()\n\
  .createQuery(“select item from Item item order by item.id desc”).list();\nAssert.assertEquals(2L,items.size());\n\
  Item item = items.get(0);\nitem.setName(“BookList”);\nsessionFactory.getCurrentSession().update(item);\n\
  \n@SuppressWarnings(“unchecked”)\nList<Item> itemslist = sessionFactory.getCurrentSession()\n\
  .createQuery(“select item from Item item order by item.id desc”).list();\nItem pItem\
  \ = itemslist.get(0);\nAssert.assertEquals(“BookList”,pItem.getName());\nsessionFactory.getCurrentSession().delete(pItem);\n\
  \n@SuppressWarnings(“unchecked”)\nList<Item> ppItem = sessionFactory.getCurrentSession()\n\
  .createQuery(“select item from Item item order by item.id desc”).list();\nAssert.assertEquals(1L,ppItem.size());\n\
  }\n\n}\n```\n\n### Feature 实体\n\n我们将探索 `Feature` 实体，它包含一个标识符和一个名称的 `String` 字段。由于该实体位于反端且是一个双向关联，因此对\
  \ `Item` 的引用以 `@ManyToOne` 关联的形式出现。\n\n```java\n@Entity\n@Table(name=”FEATURE”)\n\
  public class Feature {\n    private Integer id;\n    private String name;\n    private\
  \ Item item;\n\n    @Id\n    @GeneratedValue(strategy=GenerationType.AUTO)\n   \
  \ @Column(name=”ID”,length=20)\n    public Integer getId() {\n        return id;\n\
  \    }\n\n    public void setId(Integer id) {\n        this.id = id;\n    }\n\n\
  \    @Column(name=”name”,length=50)\n    public String getName() {\n        return\
  \ name;\n    }\n\n    public void setName(String name) {\n        this.name = name;\n\
  \    }\n\n    @ManyToOne\n    @JoinColumn(name=”ITEM_ID”, nullable=false)\n    public\
  \ Item getItem() {\n        return item;\n    }\n\n    public void setItem(Item\
  \ item) {\n        this.item = item;\n    }\n}\n```\n\n### Item 实体\n\n我们正在开发一个一对多的双向关系。一个\
  \ `Item` 实例必须有一个或多个 `Feature` 实例。由于关系是双向的，因此声明了对 `Feature` 列表的引用。我们还使用了 `orphanRemoval=true`，因为如果一组\
  \ `Features` 被重新分配，旧的 `Features` 将被删除。`Item` 是所有者，并通过 `@OneToMany` 注解维护对 `Feature`\
  \ 的引用。\n\n```java\n@Entity\n@Table(name=”ITEM”)\npublic class Item {\n    private\
  \ Integer id;\n    private String name;\n    private List<Feature> features;\n\n\
  \    @Id\n    @GeneratedValue(strategy=GenerationType.AUTO)\n    @Column(name=”ID”,length=20)\n\
  \    public Integer getId() {\n        return id;\n    }\n\n    public void setId(Integer\
  \ id) {\n        this.id = id;\n    }\n\n    @Column(name=”name”,length=50)\n  \
  \  public String getName() {\n        return name;\n    }\n\n    public void setName(String\
  \ name) {\n        this.name = name;\n    }\n\n    @OneToMany(mappedBy=”item”,cascade=CascadeType.ALL,orphanRemoval=true)\n\
  \    public List<Feature> getFeatures() {\n        return features;\n    }\n\n \
  \   public void setFeatures(List<Feature> features) {\n        this.features = features;\n\
  \    }\n}\n```\n\n### 表结构\n\n```sql\nDROP TABLE `feature`;\nDROP TABLE `item`;\n\
  CREATE TABLE `item` (\n  `ID` int(11) NOT NULL AUTO_INCREMENT,\n  `name` varchar(50)\
  \ DEFAULT NULL,\n  PRIMARY KEY (`ID`)\n);\nCREATE TABLE `feature` (\n  `ID` int(11)\
  \ NOT NULL AUTO_INCREMENT,\n  `name` varchar(50) DEFAULT NULL,\n  `ITEM_ID` int(11)\
  \ NOT NULL,\n  PRIMARY KEY (`ID`),\n  KEY (`ITEM_ID`),\n  CONSTRAINT FOREIGN KEY\
  \ (`ITEM_ID`) REFERENCES `item` (`ID`)\n);\n```\n\n### 开发数据访问层\n\n接下来我们将观察数据访问层。我们将从获取所有记录方法的测试用例开始。\n\
  \n```java\n@RunWith( SpringJUnit4ClassRunner.class )\n@ContextConfiguration( locations\
  \ = { “classpath:context.xml” } )\n@TransactionConfiguration( defaultRollback =\
  \ true )\n@Transactional\npublic class ItemDaoImplTest {\n    @Autowired\n    private\
  \ ItemDao dao;\n\n    @Test\n    public void testGetAll() {\n        Assert.assertEquals(0L,\
  \ dao.getAll().size());\n    }\n}\n```\n\n我们将掌握如何直接为上面的测试用例编写模拟的数据访问操作。使用 `SessionFactory.createQuery`\
  \ 方法结合 SQL 从 `Item` 实体中检索所有记录。\n\n```java\n@Repository\n@Transactional\npublic class\
  \ ItemDaoImpl implements ItemDao {\n    @Autowired\n    private SessionFactory sessionFactory\
  \ ;\n\n    @SuppressWarnings(“unchecked”)\n    @Override\n    public List<Item>\
  \ getAll() {\n        return (List<Item>)sessionFactory.getCurrentSession().\n \
  \       .createQuery(“select item from Item item order by item.id desc “).list();\n\
  \    } \n}\n```\n\n\n\n删除任务使用了 `Hibernate 4` 的 `Session.delete()` 方法。\n\n```java\n\
  public class ItemDaoImpl implements ItemDao {\n\n    @Autowired\n    private SessionFactory\
  \ sessionFactory;\n\n    @Override\n    public void delete(Item item) {\n      \
  \  sessionFactory.getCurrentSession().delete(item);\n    }\n}\n```\n\n最后，我们将使用更新测试方法，它会插入两条记录，更新该行，并测试计数是否相同以及翻新是否生效。\n\
  \n```java\npublic class ItemDaoImplTest {\n    @Autowired\n    private ItemDao dao;\n\
  \n    @Test\n    public void testUpdate() {\n        Item item1 = new Item();\n\
