    This, then, is the true origin story of today’s well-heeled radical right, told
    through the intellectual arguments, goals, and actions of the man without whom
    this movement would represent yet another dead-end fantasy of the far right, incapable
    of doing serious damage to American society.


    . . .


    I discovered Buchanan’s formative role in the rise of this distinctive strand
    of the radical right by sheer serendipity, not intentional pursuit. I am a historian
    of American social movements and their impact on public policy. About ten years
    ago, I became interested in Virginia’s decision to issue state-subsidized education
    vouchers to fund enrollment in all-white private schools in the aftermath of Brown.
    The thinker most associated with voters that was Milton Friedman, I began to read
    his work and examine his papers. Twice, though, I came across a footnote pointing
    to another economist James McGill Buchanan, who had founded what called the Virginia
    school of political economy. Although I had not'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'previously heard of him, he seemed to be someone with big ideas that somehow
    differed from Friedman’s, even as they played on the same team.¹10 Given the Virginia
    connection, I thought I should know more about him and began to read his work,
    too. When I learned of an unlisted archive located at George Mason University’s
    Fairfax, Virginia, campus that held his papers, I decided to pay it a visit in
    2013, after Buchanan’s death earlier that year.¹11


    Most archives house the papers of dozens, if not hundreds, of different individuals
    and organizations. There is invariably a full staff of trained archivists and
    assistants who work tirelessly to collect, process, and make available to scholars
    their holdings. “Buchanan House” was different. It turned out to be an old clapboard
    mansion on the grounds of George Mason University’s main campus, where this once
    revered figure and his colleagues worked. Now it is all deserted. Rooms that once
    served as seminar places and sitting areas for meeting with visitors and donors
    were now filled with boxes of unsorted material from the dead man’s home. There
    were file cabinets everywhere—even, I soon learned, in a closet under a stairway.


    When I entered Buchanan’s personal office, part of a stately second-suite, I felt
    overwhelmed. There were papers stacked everywhere, with no discernible order.
    Knowing where to begin, I decided to proceed clockwise, starting with a pile of
    correspondence that was resting, helterskelter, on a chair to the left of the
    door. I picked it up and began to read. It contained confidential letters from
