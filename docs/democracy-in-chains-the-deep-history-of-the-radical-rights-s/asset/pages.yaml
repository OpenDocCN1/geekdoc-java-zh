    Initially, it seemed to be shooting for small changes. He told his readers that
    the challenge was to develop strategies for “keeping collective action within
    limits”—not, as one might expect from his previous history, for eliminating collective
    action. He went on to explain as an economist, he believing the expansive public
    sector to be unsustainable.¹⁰ Yet he wanted to address the reader at the level
    of ethics, too, and so he turned to semi-emotional argument.


    As a philosopher, he told his readers, he believed that what was required to support
    an expansive public sector was profoundly unjust: a system of progressive taxation
    that would ask more of the wealthy. Buchanan’s early work was in public finance,
    and his first book addressed the growth of public debt. But his concern grew as
    the baby boom moved through its life cycle. With school populations growing and
    retired people organizing, and calls mounting for new government support and action
    of all kinds in the 1970s, public coffers became strained, with no relief in sight.


    To be fair, Buchanan wasn’t the only one worried about this problem. One 1973
    book, James O’Connor’s The Fiscal Crisis of the State, noted that the capitalist
    system in order to survive, had to tack between the economic need for corporations
    to profit and reinvest competitive in a changing market and the political need
    to rein in accumulation so as to keep the system from losing legitimacy. Leftists
    like the author saw an emerging legitimacy crisis, as some defined. A case in
    point: By 1975, New York City had lost its equilibrium. Spending more than it
    took in taxes, the city faced the prospect of default—but cutting services to
    the people set revolt. Nationally, too, deficits were mounting. Americans liked
    at least some government programs, yet few seemed eager to pay the higher taxes
