    In an attempt to find master plan, to understand what ideas were guiding this
    militant new approach, others attempted to link what was happening to the ideas
    of the celebrity intellectuals of the so-called neoliberal right (neoliberal because
    they identify with the eighteenth- and nineteenth-century pro-market liberalism
