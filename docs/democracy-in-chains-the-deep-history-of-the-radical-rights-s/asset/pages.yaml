    Buchanan did not start out as a shill for billionaires. For one thing, there were
    no billionaires in the United States in 1956—only the oil magnate J. Paul Getty
    came close.¹⁴ In an age when even kindred economists like Milton Friedman were
    producing ever more specialized and technical scholarship, Buchanan was a throwback
    to another time. His dream was to become a political economist in the classical
    mode, like Adam Smith, a veritable social philosopher. But instead of studying
    the things others in the discipline did, Buchanan wanted to use an economic definition
    of incentives to examine government behavior, in the hope of returning America
    to “the free society” it had once been, only some of whose lineaments the Virginia
    of the 1950s had managed to preserve.'
