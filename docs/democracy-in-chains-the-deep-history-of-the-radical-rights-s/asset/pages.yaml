    vindication of his intellectual achievement. But the other Buchanan, the deeply
    political soldier of the right, experienced mounting despair. His attempts to
    win passage of radical proposals in Virginia in the late 1950s failed miserably,
    because legislators understood what at first he did not: the unpopularity of his
    political-economic vision.


    Buchanan’s hopes were lifted with the presidential run of Barry Goldwater in 1964.
    But when the candidate conveyed to voters his desire to end Social Security as
    we know it


