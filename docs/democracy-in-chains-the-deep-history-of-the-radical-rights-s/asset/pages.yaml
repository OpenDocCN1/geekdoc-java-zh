  md: 'argue against those seeking to impose an “increasing role—of government in
    economic and social life.”¹


    He could win this war, and he would do it with ideas.


    While it is hard for most of us today to imagine how Buchanan or Darden or any
    other reasonable, rational being saw the racially segregated Virginia of the 1950s
    as a society built on “the rights of the individual,” no matter how that term
    was defined, it is not hard to see why the Brown decision created a sense of grave
    risk among those who did.² Buchanan fully understood the scale of the challenge
    he was undertaking and promised no immediate results. But he made clear that he
    would devote himself passionately to this cause.


    Some may argue that Darden fulfilled his part—he found the money to establish
    this center—he never got in return. Buchanan’s team had no discernible success
    in decreasing the federal government’s pressure on the South all the way through
    the 1960s and ’70s. Take a longer view—follow the story forward to the second
    decade of the twenty-first century—and a different picture emerges, one that is
    a testament to Buchanan’s intellectual origins of the single most powerful and
    least understood threat to democracy today: the attempt by the billionaire-backed
    radical right to undo democratic governance.


    For what becomes clear as the story moves forward by decade the quest that began
    as a quiet attempt to prevent the state of Virginia from having to meet national
    democratic standards of fair treatment and equal protection under the law, some
    sixty years later, become the veritable opposite of itself: a selfish bid to re-engineer
    all of America, at both the state and the national levels, back to the political
    economy and oligarchic governance of midcentury Virginia, minus segregation.


    Alas, it wasn’t until the early 2010s that the rest of us began to sense that
    something extraordinarily troubling had somehow entered American politics. Anyone
    was really sure of that that was so often, but with growing frequency and in far-flung
    locations, an action would be taken by governmental figures on the radical right
    that went well beyond typical party politics, beyond the extreme partisanship
    that has marked the United States over the past decades. These actions seemed
    intended in'
