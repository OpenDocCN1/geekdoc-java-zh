  md: 'While Charles Koch and his younger brother were experimenting politically,
    James Buchanan wasted no time on a quixotic third party. Sequestering himself
    in the mountains of southwestern Virginia, he produced The Limits of Liberty,
    the book he would later describe as the single best statement of his intellectual
    vision. It was his magnum opus for the cause, the summation of his distinctive
    revolutionary vision for “America’s third century.\^77 More a work of political
    philosophy than economics, it searched for a balance, as the subtitle expressed
    it, “between anarchy and Leviathan."


    Because both markets and governments fail,\ the challenge was how to sort out
    what each does best, to find some middle ground in theory between pure laissez-faire
    (what he called anarchy) and dreaded socialism. Wrestling with the reality that
    a modern world required some form of state power to rule and adjudicate claims,
    Buchanan sought to limit out a political order in which no state could impinge
    upon absolutely individuals’ ‘freedom from the coercion of others.\^78


    He rued that the cause already be doomed: the “failures in political and institutional
    structure” that had so evicted liberty might be irreversible by conventional means.
    He blamed the Great Depression for the rise of unacceptable intrusions on liberty;
    it had ended what he called the “fortuitous circumstances” that had produced a
    sixty-year reign of economic freedom, the end of Reconstruction and the Great
    Depression. At no point did he address the possibility that if economic inequality
    had not so extreme in that and the stock market had been regulated, the Depression
    might not have been so devastating. (Such considerations would lead in the dangerous
    direction of Keynes.) But Buchanan did observe that the developments of the Depression
    era made it virtually impossible to change direction through the electoral process.\^79


    One has to wonder if the seeds of the final addition to his program were taking
    root in his mind at this moment—the search for unconventional means to achieve
    the desired reversal. Could a way be found to upend the normal order long enough
    to rewrite the governing rules of democracy, to separate it from the commitment
    to majority rule?'
