  md: 'So what exactly constituted “free society” where the “liberty of the individual”
    was preserved? Buchanan found it in an earlier time when government was usually
    weak. There were, consequently, few rules to constrain how a man might get wealthy,
    and great restraints on the government in asking for some part of that wealth,
    other than for the maintenance of order and military defense.


    What animated Buchanan, what became the laser focus of his deeply analytic mind,
    the seemingly unfettered ability of an increasingly powerful federal government
    to force individuals with wealth to pay for an increasing number of public goods
    and social programs they had no personal say in approving. Better schools, newer
    textbooks, and more courses for black students might help the children, for example,
    whose responsibility was it to pay for these improvements? The parents of students?
    Others who wished voluntarily to help out? Or people like himself, compelled through
    increasing taxation to contribute to projects they did not wish to support? To
    Buchanan, what others described as taxation to advance social justice or the common
    good was nothing more than a modern version of mob attempts to take by force what
    the takers had no moral right to: the fruits of another person’s efforts. In his
    mind, to protect wealth was to protect the individual against a form of legally
    sanctioned gangsterism.


    Where did this gangsterism begin? Not in the way we might have expected him to
    explain it to Darden: with-good citizens, aspiring attorneys to make a name for
    themselves in constitutional law, or even activist judges. It began before that:
    with individuals, powerless on their own, who had figured out that if they joined
    together to form social movements, they could use their strength in numbers to
    move government officials to hear their concerns and act upon them.


    The most powerful social movement back then was Buchanan proposed refer as “the
    monopoly movement,” or what most of us would today call organized labor. But other
    movements, also injurious in his mind, were on the horizon, including the increasingly
    influential civil rights movement and a resumed push by elderly citizens to organize
    as they had not since the Great Depression. From his vantage point, it did not
    matter whether the movement in question consisted of union members, civil rights
    activists, or aging women and men fearful of ending their lives in'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'poverty. Nor did the justice of the cause they advocated, the pain of their
    present condition, or the duration of the injustice they were attempting to reverse
    move him in any way. The only fact that registered in his mind was the “collective”
    source of their power—and that, once formed, such movements tended to stick around,
    keeping tabs on government officials and sometimes using their numbers to vote
    out those who stopped responding to their needs. How was this to other individuals?
    How was this American?


    Buchanan believed with every fiber of his being that if a group of people wanted
    from government could not, on its own merits, the freely given backing of each
    individual citizen, including the wealthiest among us, any attempt by that group
    to use its numbers to get what it wanted constituted no persuasion of the majority
    but coercion of the minority, a violation of the liberty of individual taxpayers.


    To end the coercion, he counse, one had to stop “government corruption.” By he
    meant the qui quo reached between government officials and organized groups that
    keeps these officials reflexively attuned and responsive to the demands of such
    groups in exchange for their votes¹⁵ At first he thought he could explain to government
    officials how wrong it was for them to accede to this arrangement; even under
    Keynesian economic theory, popular since the Great Depression, government was
    meant to spend more than it took in recessions. But he soon learned that even
    in antidemocratic 1950s Virginia, few politicians would follow his recommended
    courses of action if doing so jeopardized their reelections.


    UVA in the 1950s was not a research institution, but it was a venerable one, so
    Buchanan understood that asking Darden to fund what was in essence a political
    center at a nonprofit of higher learning was highly inappropriate. To avoid criticism
    “an organization with extreme views, or a propagandizing agency” was being established
    on campus, recommended that the center should not have the words “economic liberty”
    in its name, if this phrase captured “the real purpose of the program.”¹⁶


    He displayed the same canniness in the names he gave to various elements of his
    economic theory—the Virginia school of political economy,",'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'as it came to be known. His study of how government officials make decisions
    became “public choice economics”; his analysis of how the rules of government
    might be altered so officials could not act on the will of the majority became
    “constitutional economics.” The enemy became “the collective order,” a code phrase
    for organized social and political groups that looked to government.


    Jargon aside, Buchanan used his center to refine his research program over the
    years while also figuring out how to develop a sophisticated strategy to implement
    his vision. The intellectual and the activist in him worked side by side, one
    that had enormous success until the other did not appear to be making headway.


    Buchanan’s penetrating analyses of how incentives guide government action would
