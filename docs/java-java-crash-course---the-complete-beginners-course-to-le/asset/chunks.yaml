    ## Problem N°5


    Problem J5: Assigning Partners


    Problem Description The CEMC is organizing a workshop with an activity involving
    pairs of students. They decided to assign partners ahead of time. You need to
    determine if they did this consistently. That is, whenever A is a partner of B,
    then B is also a partner of A, and no one is a partner of themselves.


    Input Specification


    The input consists of three lines. The first line consists of an integer N (1
    < N ≤ 30), which is the number of students in the class. The second line contains
    the first names of the N students separated by single spaces. (Names contain only
    uppercase or lowercase letters, and no two students have the same first name).
    The third line contains the same N names in some order, separated by single spaces.
    The positions of the names in the last two lines indicate the assignment of partners:
    the ith name on the second line is the assigned partner of the ith name on the
    third line.


    Output Specification


    The output will be good if the two lists of names are arranged consistently, and
    bad if the arrangement of partners is not consistent.


    Sample Input 1


    4


    Ada Alan Grace


    John John Grace Alan Ada


    Output for Sample Input 1


    good


    Explanation for Output for Sample Input 1


    Ada and John are partners, and Alan and Grace are partners. This arrangement is
    consistent.


    Sample Input 2


    7


    Rich Graeme Michelle Sandy Vlado Ron Jacob


    Ron Vlado Sandy Michelle Rich Graeme Jacob


    Output for Sample Input 2


    bad


    Explanation for Output for Sample Input 2


    Graeme is partnered with Vlado, but Vlado is partnered with Rich. This is not
    consistent. It is also inconsistent because Jacob is partnered with himself.


    ## Solution N°5


    import java.util.Scanner;


    import java.util.StringTokenizer;


    public class J5


    {


    Scanner scan = new Scanner(System. in );


    byte n;


    public J5()


    {


    n = Byte. parseByte (scan.nextLine());


    String[] partner1 = new String[n];


    String[] partner2 = new String[n];


    assignPartners(partner1, partner2);


    if(checkForSelfPartner(partner1, partner2) || checkForMultiUsage(partner1, partner2)
    || checkPartnersMatch(partner1, partner2))


    {


    System. out .println("bad");


    }


    else


    {


    System. out .println("good");


    }


    }


    public void assignPartners(String[] partner1, String[] partner2)


    {


    StringTokenizer partner1Names = new StringTokenizer(scan.nextLine());


    StringTokenizer partner2Names = new StringTokenizer(scan.nextLine());


    for(byte i = 0; i < n; i++)


    {


    partner1[i] = partner1Names.nextToken();


    partner2[i] = partner2Names.nextToken();


    }


    }


    public boolean checkForSelfPartner(String[] partner1, String[] partner2)


    {


    for(byte i = 0; i < partner1.length; i++)


    {


    if(partner1[i].equals(partner2[i]))


    {


    return true;


    }


    }


    return false;


    }


    public boolean checkForMultiUsage(String[] partner1, String[] partner2)


    {


    for(byte name = 0; name < partner1.length; name++)


    {


    byte usages = 0;


    for(byte i = 0; i < partner1.length; i++)


    {


    if(partner1[name].equals(partner1[i]))


    {


    usages++;


    }


    if(usages > 1)


    {


    return true;


    }


    }


    }


    for(byte name = 0; name < partner2.length; name++)


    {


    byte usages = 0;


    for(byte i = 0; i < partner2.length; i++)


    {


    if(partner2[name].equals(partner2[i]))


    {


    usages++;


    }


    if(usages > 1)


    {


    return true;


    }


    }


    }


    return false;


    }


    public boolean checkPartnersMatch(String[] partners1, String[] partners2)


    {


    for(byte pair = 0; pair < partners1.length; pair++)


    {


    String p1 = partners1[pair];


    String p2 = partners2[pair];


    boolean foundPair = false;


    for(byte i = 0; i < partners1.length && !foundPair; i++)


    {


    if(p2.equals(partners1[i]))


    {


    if(p1.equals(partners2[i]))


    {


    foundPair = true;


    }


    else


    {


    return true;


    }


    }


    }


    }


    return false;


    }


    public static void main(String[] args)


    {


    new J5();


    }


    }


    OK, there’s a lot to do here! First, we got out of the static method by instantiating
    J5\. This is simply so that our global variables and methods do not have to be
    static. Next, we defined a global scanner and set it up, and then we defined a
    global variable n, which is the number of students. This is so we can access them
    from any part of our code inside J5\. Inside our J5 constructor, we read in the
    number of students and created two arrays, which contain the student names. Next,
    we called a method called assignPartners that uses a special class called “StringTokenizer.”
    Essentially what this class does is allow us to split a string like a scanner.
    We can call nextToken on the tokenizer to get the next section of the string,
    just as when you call next for a scanner to get the next section of an input.
    So, our method has filled the two student arrays with names, using a loop that
    runs for n times where n is the global variable that was set to the number of
    students. After we called the assignPartners method, we have done three checks.
    We checked if any two partners were the same person, we checked if any student
    was used more than once, and we checked if partners matched (if two partners work
    out if you flip it).


    So, first we have a method called checkForSelfPartners that returns a boolean;
    the method will return true if there is a case of self-partnership. The way we
    check for this is by looping through one array and checking if both arrays are
    equal at that position. If partners1[0] is the same as partners2[0], then that
    means someone is partnered with themself, which makes the whole test case “bad.”
    If they are equal, return true (this means it will ignore the rest of the for
    loop, and the method for that matter, and just give back the value). If the loop
    finishes without having returned a value of true, that means that at no point
    were the partners equal, and so there is no self-partnership, meaning you should
    return false.


    Next, we have the checkForMultiUsage method, which again returns a boolean, so
    if a student name is used more than once, it will return true. We have two main
    loops that are simply duplicates of each other, except one is for the partner1
    array and the other is for the partner2 array. These loops loop through the entire
    array. We have another loop inside that will loop through the array that is past
    our selected name. This is to decrease the number of iterations because if there
