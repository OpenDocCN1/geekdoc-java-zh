    \ sum is: \" + sum); // display sum\n    }  \n}\n```\n\n现在，让我们来看另一个 Project Euler\
    \ 问题。\n\n## 最大质因数\n\n### Problem 3\n\n`13195` 的质因数是 `5`、`7`、`13` 和 `29`。\n\n数字\
    \ `600851475143` 的最大质因数是什么？\n\n现在，为了在一分钟内高效地解决这个问题，我们必须仔细考虑我们如何处理它。由于我们被要求找到一个高位数字的最大质因数，在程序弄清楚我们的算法配置正确之前，可能会面临很长的处理时间。我们知道，如果我们取像\
    \ `100` 这样的数字并想找到最大因子，我们会执行以下操作：\n\n`100 / 2 = 50`\n`50 / 2 = 25`\n`25 / 2 = Remainder`\n\
    `25 / 3 = Remainder`\n`25 / 4 = Remainder`\n`25 / 5 = 5`\n`5 / 2 = Remainder`\n\
    `5 / 3 = Remainder`\n`5 / 4 = Remainder`\n`5 / 5 = 1`\n\n因此，`100` 的最大因子是 `5`。一旦我们的答案达到\
    \ 1，我们就知道已经达到了最大的因子。这是完成此任务的一种有效方法，这意味着我们没有不断处理想要查找的大数字，而是在除法之前不断缩小它的数值。这是合理的，因为我们所做的只是不断缩小这个数字，直到达到一个除了\
    \ 1 或自身之外无法被任何数字整除的点。\n\n那么，我们如何用编程的方法处理这个问题呢？嗯，我们必须做的第一件事再次创建一个循环，但在此之前，创建一个布尔值\
    \ `MaxPrimeFound` 并设置为 `false`。一旦完成了这个，我们就可以处理从 `1` 到数字变量的循环。在处理过程中，我们尝试将循环过程中的变量除以因子（例如\
    \ `2`），并检查它是否为整数。如果是整数，我们就继续。如果不是整数，我们就增加因子，直到达到一个可以被整除的点。如果被整除的数字是它本身，那么我们就知道确实找到了最大的质因数。\n\
    \n#### 使用他们示例的解决方案：\n\n```java\nImport java.io.*;\nImport java.lang.*;\n\nclass\
    \ MainClass {\n    public static void Main(string[] args) {\n        int number\
    \ = 13195;\n        int factor = 2;\n        int largestPrimeFactor = 0;\n   \
    \     while (true) {\n            if (number % factor == 0) {\n              \
    \  number /= factor;\n            } else {\n                factor++;\n      \
    \      }\n            if (factor == number) {\n                largestPrimeFactor\
    \ = number;\n                break;\n            }\n        }\n        System.out.println(\"\
    The largest factor is: \" + largestPrimeFactor);\n    }\n}\n```\n输出：最大因子是 `29`。\n\
    \n当我们使用 `13195` 时是：\n\n```java\nImport java.io.*;\nImport java.lang.*;\n\nclass\
    \ MainClass {\n    public static void Main(string[] args) {\n        long number\
    \ = 600851475143L;\n        long factor = 2;\n        long largestPrimeFactor\
    \ = 0;\n        while (true) {\n            if (number % factor == 0) {\n    \
    \            number /= factor;\n            } else {\n                factor++;\n\
    \            }\n            if (factor == number) {\n                largestPrimeFactor\
    \ = number;\n                break;\n            }\n        }\n        System.out.println(\"\
    The largest factor is: \" + largestPrimeFactor);\n    }  \n}\n```\n输出：最大因子是 `6857`。\n\
    \n# 结语\n\n## 今后的路\n\n这是你作为 Java 程序员旅程的开始。通过本指南，你仅仅触及了表面，学习语言的语法和约定只是开始。编程最重要的部分是逻辑部分。当然，你可能知道如何遍历购物列表之类的数组，但如果有人要求你利用编程知识处理图像，通过\
    \ API 的帮助和思考，你可以学会反转图像颜色、翻转、旋转、缩放等。\n\n真正的编程来自于思维。这类似于学习任何其他语言，比如英语。你可以从一个空白记事本开始创建一个东西，并让它运行实现你想要的功能。无论是分析和预测股市的机器人，还是视频游戏，选择权在你手中。\n\
    \n在本指南中，你学习了 `Java` 的基础知识。你并没有学习语言中可以使用的所有方法，但这并不是目的。本指南旨在引导你开启这段旅程，去发现创建你理想程序所需的对象和方法。你已经拥有了阅读\
    \ API 并理解它为你的代码增加了什么的的最优知识。\n\n我们希望在未来版本的编程语言学习书中再次与你相遇。\n\n下次见，\n\nAlphy Books\n"
