  trans: "\n\n只想在自己的机器上运行 Java 程序的普通用户只需要安装 `JRE`，因为它包含了允许执行 Java 程序的 `JVM`。然而，Java\
    \ 程序员必须下载 `JDK`。我们将在下一部分更详细地探讨这些概念。如前所述，Java 编程创建的是面向对象且平台无关的程序，因为 Java 编译器创建的是\
    \ `.class` 文件而不是 `.exe` 文件。这个 `.class` 文件是一个包含字节码的中间文件，这就是 Java 程序具有平台无关性的原因。但它也存在缺点：Java\
    \ 程序的执行需要更长的时间，因为 `.class` 文件在操作系统中之前，必须先加载到 `JVM` 中。\n\n我们可以使用 Java 开发各种应用程序，但我们需要为不同的应用开发使用不同的包。例如，如果你想开发桌面应用程序，那么你就需要使用\
    \ `JDK`；如果你想开发 Android 应用程序，你就需要使用 `Android SDK`，因为它们拥有不同的类集合。\n\n# 第 2 章\n\n\
    # Java 环境\n\n## Java 的安装\n\n为了在系统上安装 Java，你需要以下工具：\n\n*   适用于 Java 开发者的 IDE（集成开发环境）\n\
    *   Java `JDK`\n\n下载这两个工具将开启你成为 Java 程序员的道路。IDE（集成开发环境）是一个包含处理和执行代码所需工具的封装应用程序。它包含一个代码编辑器、编译器、一个调试器和一个图形用户界面（GUI）。有很多类型的\
    \ IDE，但最常用的有：\n\n*   Netbeans\n*   Eclipse\n\n我个人推荐使用 `Eclipse`，因为它的性质简单。你可以在这里下载：\n\
    \n[`eclipse.org/downloads/`](https://eclipse.org/downloads/)\n\n一旦你进入此链接，你需要找到这个内容：\n\
    \n![`lh5.googleusercontent.com/L1DhiS0lHF2Wt52-NpfmrM1VQ_f5E3Vsh6h3H123LeuAQWSLLYBowxzHwHVk-Knuma6wifwNVdut28HqFog19-10NB5ACPPLWtwgWgY-xygaV1XsQ3827mdNZEikpnLWPTwMu7g`](img/Image00000.jpg)\n\
    \n然后，根据你系统中安装的操作系统/处理器类型，选择 Windows 32 位或 64 位操作系统。\n\n一旦安装了 IDE，我们将下载并安装 `JDK`，这将允许我们与用于创建和执行\
    \ Java 代码的代码编辑器进行交互。下方链接提供的 `JDK` 包含了开发 Java 程序所需的所有包和工具。\n\n[`www.oracle.com/technetwork/java/javase/downloads/index.html`](http://www.oracle.com/technetwork/java/javase/downloads/index.html)\n\
    \n在该网站上，找到并点击此图片开始下载：\n\n![e319d84467.png](img/Image00001.jpg)\n\n下载安装 `JDK` 后，你将能够启动\
    \ `Eclipse`。\n\n从 `Eclipse` 下载包解出的文件夹将包含 `eclipse.exe` 文件。一旦启动，你将看到以下窗口：\n\n![`lh3.googleusercontent.com/juAh1PmqbJFvvl4ZXFS1u-Cp7T6aD9nWkz0TwwivjzScPKy7E97FyCrUAU-2mj6wlMgbcGrSlSm5aJwOnb5n1IvxpkyTzf_NCgjhG604yFXhZCBsy3GfC1y_wg6v4gEp4uFNT80`](img/Image00002.jpg)\n\
    \n此提示仅要求你设置输出目录，以保存你将编写的所有代码。选择完成后，点击“OK”继续。\n\n你现在应该处于主界面了。\n\n为了开始工作，你应该：\n\n\
    1. 点击 `File`（文件）\n2. 点击 `New`（新建）→ `Java Project`（Java 项目）\n\n![`lh3.googleusercontent.com/Uul4AHUr2ZURDElR9Y503X0iTSRDnAT0yK1j5R489G0kjKa8knxzkCrbXTZOkZPVBJ57VzYFAv2MCDPQ98GergtcUD9efhjBn8WoeWPLAZ9c-p1Jofiju6tB-mtiEMfP4v4Ia08`](img/Image00003.jpg)\n\
    \n3. 在“Project name:”（项目名称：）字段中输入项目名称\n4. 点击“Finish”（完成）\n5. 右键点击 `src` → `New`（新建）→\
    \ `Class`（类）\n\n![`lh3.googleusercontent.com/c1DJ75yt6_Bp0f-XdRKqu2Z7WY_Q3PbDSjkXq-iWmI-NTzRdaUrqLpIzKBx6nnvTPiwAR19HRF8giYlstqw8LeRR4uWDrdwXuXO-ZsPT9SR6but78QppV2bkSRK7N7IzPWjP-OE`](img/Image00004.jpg)\n\
    \n6. 在“Name”（名称）字段中填写任何包含字母的内容——不要使用特殊字符。例如：“ThisIsAClass”\n7. 点击“Finish”（完成）\n\
    \n你现在会看到一个显示如下：\n\n```\npublic class ThisIsAClass {\n\n}\n```\n\n恭喜，你已经成功创建了一个类！\n\
    \n# 第 3 章\n\n# Java 语言结构\n\n我们现在将以此作为示例。这现在可能还没有什么意义，但当我们学习继承和多态时，你会有更好的理解。\n\n\
    ```java\npublic class ThisIsAClass {\n    public static void main (String args[])\
    \ {\n        int x = 5;\n        System.out.println(\"The number is\" + x);\n\
    \    }\n}\n```\n\n"
- fmt: "\nAs shown in the above sample code, two curly braces are set in bold to indicate\
    \ that they communicate with each other. Whatever is written between them is the\
    \ “Section” or “Class” of name `ThisIsAClass`. The sample applies to the bold\
    \ and underlined curly braces to indicate that they are separate section dividers\
    \ for the section within the parent section. The parent section is again considered\
    \ a class, whereas the section within the parent section is considered a sub-section,\
    \ or a subclass, or the formal term, a method.\n\nA method is essentially a subclass\
    \ that also has its own special elements, similar to a class but more specific.\
    \ This contains four elements: a scope (`public/private/protected`), a return\
    \ type, a name, and parameters. The scope, return type, and parameters are things\
    \ you will understand better when we learn about Methods, along with Inheritance\
    \ and Polymorphism.\n\n- `public`—Scope.\n- `static`—Conventional keyword for\
    \ the main method.\n- `void`—Return type.\n- `main`—Name of the method (you can\
    \ call this anything, but in this case, the `main` method must always exist in\
    \ every Java program because it is the starting point of the Java program).\n\n\
    This method is a special method because it is named `main` and so it will be the\
    \ first method that is called. The compiler always looks for the method named\
    \ `main` at the process start. The `main` method must hold the following properties:\
    \ `public static void` and have `String args[]` as the argument in the parameters.\
    \ There can be only one main method in a Java project. The idea of the `main`\
    \ method is that it will be the first method to be called, and so you can think\
    \ of it as the home base for calling other methods and traveling to other classes\
    \ (you will learn what this means later). For the remainder of this guide, your\
    \ program must be written within this `main` method, as it is a special method\
    \ that the compiler will always be looking for.\n\nThe contents of this method\
    \ will also be introduced when learning about “Variables” later on in this guide.\
    \ For now, this brief explanation should be enough for you to understand what\
    \ is going on:\n\n`int x = 5;`—A variable is being declared (a container) that\
    \ is a type of integer (whole number), and it holds the value of five. The `=`\
    \ is used to assign values to variables.\n\n`System.out.println`—This is a classic\
    \ line that every beginner learns; all it does is print a line of text to the\
    \ console.\n\nExample:\n\n![https://lh5.googleusercontent.com/AA6lne5cs1OdvpUFZFUsnu9yUJnYebbfC0hh35DeePNKK5_-3AtMUbEaHxLdkGDejvOkhrpqmQonmzZlKiSL73gH0npYpXQ0yCxwD_G3tsNZycTAzCRTSL9s-CM_-khNnDU5UxY](Image00005.jpg)\n\
    \nThe console is where the program’s output is placed in order for the programmer\
    \ to test his or her program. The `System. out .println` line contains parenthesis\
    \ and a string of text within those parenthesis. The string of text must be surrounded\
    \ by quotation marks in order for the program to know that it has to print out\
    \ text instead of an actual variable like `x`. The reason the user can’t just\
    \ say: `System. out .println(\"The number is: x\");` is because the program won’t\
    \ know if x is a variable or not. The program reads anything within quotation\
    \ marks as a piece of text instead of a container holding a value. Therefore,\
    \ the `x` must be outside of the quotation marks.\n\nThen again, you can’t say\
    \ `System. out .println(\"The number is: \" x);` because the program needs a specific\
    \ keyword to know that the piece of text and the variable are two entities that\
    \ need to be joined or “concatenated” together. The `+` symbol is used to show\
    \ that the string of text and the variable `x` are to be connected together; this\
    \ will allow the program to output “The number is: 5” (without the quotation marks).\
    \ That is why the line is: `System. out .println(\"The number is: \" + x);`\n\n\
    ### Commenting\n\nCommenting is the final fundamental concept to understand in\
    \ a programming language. Although it is not necessary, it can greatly help you\
    \ and other programmers around you if you ever forget how the program works.\n\
    \nThis concept is used by programmers as an opportunity to explain their code\
    \ using common English. A compiler will always ignore comments, as they aren’t\
    \ actual code. They are simply explanations that were written to help people understand\
    \ what was programmed. In order to write a comment, you must use `//` or `/* */`.\n\
    \nThe `//` symbol is used to comment on one line. For example, if you were to\
    \ explain what a certain variable was going to be used for, you would do the following:\n\
    \n```java\nint x = 5; // this variable is going to be used to find the total money\n\
    ```\n\nThe compiler will ignore the commented line, but will process `int x =\
    \ 5`. However, you can’t use the `//` symbol with the following:\n\n```java\n\
    int x = 5; // this variable is going to be\nused to find the total money\n```\n\
    \nThis is because the `//` symbol is only used for one line, and the comment is\
    \ on two lines. You could do:\n\n```java\nint x = 5;\n// this variable is going\
    \ to be used to find the total money\n```\n\nAs long as the comment is one line,\
    \ it is fine. Anything on the line after that symbol is considered a comment.\n\
    \nThe other technique does the same thing as `//` except it supports multi-line\
    \ commenting. You must start the comment with `/*` and end it with `*/`.\n\nExample:\n\
    \n```java\nint x = 5; /* this variable is going to be\nused to find the total\
    \ money */\n```\n\n# Chapter 4\n\n# Variables\n\n## What is a Variable?\n\nA variable\
    \ is essentially a storage unit that holds a certain type of data. It is named\
    \ by the programmer and used to identify the data it stores. A variable can usually\
    \ be accessed or changed at any time. You can write information to it, take information\
    \ from it, and even copy the information to store in another variable.\n\n## Variable\
    \ Types\n\nIn Java, a variable has a specific type that determines what size it\
    \ is and the layout of its memory. The Java language defines three types of variables.\n\
    \n### Instance Variables\n\nInstance variables are declared within a class but\
    \ accessed outside of any method, constructor, or block. Instance variables are\
    \ created with the keyword `new` and are destroyed when the object is destroyed.\
    \ An instance variable is visible to all methods, constructors, and blocks within\
    \ the class where it is declared. By giving a variable the keyword `public`, it\
    \ can be accessed by subclasses within the class. However, it is recommended to\
    \ set a variable’s access modifier to `private` when possible. All instance variables\
    \ have a default value, unlike local variables, which do not have default values.\n\
    \nExample:\n\n```java\npublic class Test\n{\n    public int num; // integer named\
    \ num\n    public void dog()\n    {\n        num = 3;\n    }\n}\n```\n\nIn this\
    \ example, we declare the integer `num` outside of any method, and can easily\
    \ access it within any method that is inside of the class `Test`.\n\n### Class/Static\
    \ Variables\n\nStatic variables are declared outside of any method, constructor,\
    \ or block, and are declared with the keyword `static`. If a variable is static,\
    \ only one instance of that variable will exist, regardless of how many instances\
    \ of the object are called. Static variables are rarely used except for constant\
    \ values, which are variables that never change.\n\nExample:\n\n```java\npublic\
    \ class Test\n{\n    public static final int num = 3; // integer named num\n \
    \   public void dog()\n    {\n        System. out .println( num );\n    }\n}\n\
    ```\n\nIn this example, we declare an `int` called `num` and it set to be `public`,\
    \ `static`, and `final`. This means that it can be accessed from within subclasses,\
    \ only one instance of it can ever exist, and the value can never be changed.\n\
    \n### Local Variables\n\nLocal variables are only declared within methods, blocks,\
    \ or constructors. They are only created when the method, block, or constructor\
    \ is created, and then they are destroyed as soon as the method ends. You can\
    \ only access local variables within the method, block, or constructor where it\
    \ is called; they are not visible outside of where they are called. Local variables\
    \ do not have a default value.\n\nExample:\n\n```java\npublic void cat(){ // method\
    \ named cat\n```\n"
