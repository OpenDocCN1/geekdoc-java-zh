    \ will be “HELLOAABBCC.”\n\n* `insert()`\n\nWill convert the second arg to a string\
    \ and insert it into the current buffer beginning at the offset.\n\nExample of\
    \ `insert`:\n\n```\nStringBuffer s1=new StringBuffer(“Dwayne Johnson”);\ns1.insert(7,”\
    \ The Rock ”);\n```\n\nThis sample code will insert the second parameter’s text\
    \ to the mentioned index of the `StringBuffer` object so the final result will\
    \ be “Dwayne The Rock Johnson.”\n\n* `reverse()`\n\nWill reverse the order of\
    \ the characters in the buffer.\n\nExample of `reverse`:\n\n```\nStringBuffer\
    \ s1=new StringBuffer(“Saravanan”);\nSystem.out.println(“Reverse string is:”+s1.reverse());\n\
    ```\n\nThis example convert the string data in reverse order; the final result\
    \ will be “nanavaraS.”\n\nExample:\n\n```\nclass StringBufExample\n{\n    public\
    \ static void main(String args[])\n    {\n        StringBuffer sb = new StringBuffer(\"\
    Hello World\");\n        System.out.println(sb + \".capacity() = \" + sb.capacity());\n\
    \        System.out.println(sb + \".length() = \" + sb.length());\n        System.out.println(sb\
    \ + \".insert(5,aaa) = \" + sb.insert(5,\"aaa\"));\n        System.out.println(sb\
    \ + \".capacity() = \" + sb.capacity());\n        System.out.println(sb + \".length()\
    \ = \" + sb.length());\n        System.out.println(sb + \".append(bbbb) = \" +\
    \ sb.append(\"bbbb\"));\n        System.out.println(sb + \".reverse() = \" + sb.reverse());\n\
    \    }\n}\n```\n\n# Chapter 8\n\n# Boolean Logic\n\nJava provides us with a vast\
    \ set of operators to manipulate variables. In the following section we are going\
    \ to go over Relational Operators and Logical Operators, but first you have to\
    \ know how and where to use these operators. There are many different statements\
    \ that can be used in order to perform and test different types of logic. We will\
    \ go over some more complex statements in later sections.\n\n## Conditional Statements\n\
    \n### If Statement\n\nIn an If statement, we have a condition. If the given condition\
    \ is true, then the program will execute the true part of the If statement. If\
    \ the given condition is false, then the program will not show anything.\n\nSyntax:\n\
    \n```\nIf (condition)\n{\n    . . . . . . . . . . .\n    True Part . . . .\n \
    \   . . . . . . . . . . .\n}\n```\n\n### If Else Statement\n\nIn an If Else statement,\
    \ we have a condition just like with the previous If statement. But here we have\
    \ a false part, too: This is the major difference between an if and If Else statement.\
    \ If the given condition is true, then the program will execute the true part\
    \ of the If statement. If any given condition is false, then it will execute the\
    \ false part.\n\nSyntax:\n\n```\nIf (condition)\n{\n    . . . . . . . . . . .\
    \ .\n    True Part . . . .\n    . . . . . . . . . . .\n}\nElse\n{\n    . . . .\
    \ . . . . . . . .\n    False Part . . . .\n    . . . . . . . . . . .\n}\n```\n\
    \n### Ladder If Statement\n\nIn a Ladder If statement, we have multiple conditions.\
    \ If the first condition is false, then the program will check the next, and so\
    \ on until it reaches the Else part of the statement. If any conditions become\
    \ true, then that true part will be executed and immediately come outside the\
    \ block. If it is false, then control passes to the next statement. The Else part\
    \ will only execute once all given conditions become false.\n\nSyntax:\n\n```\n\
    If (condition)\n{\n    . . . . . . . . . . . .\n    True Part . . . .\n    . .\
    \ . . . . . . . . .\n}\nelse if (condition)\n{\n    . . . . . . . . . . . .\n\
    \    True Part . . . . . .\n    . . . . . . . . . . .\n}\nelse if (condition)\n\
    {\n    . . . . . . . . . . . .\n    True Part . . . . . .\n    . . . . . . . .\
    \ . . . .\n}\n. . . . . . .. . . . . .\n. .. . . . . . . . . . .\nelse\n{\n  \
    \  . . . . . . . . . . . .\n    false Part . . . . . .\n    . . . . . . . . .\
    \ . . .\n}\n```\n\n### Nested If Statement\n\nIn a Nested If statement, we have\
    \ multiple If conditions nested inside one another. If the first condition becomes\
    \ true, then the program will check the second condition that is defined inside\
    \ of the first condition. This process continues until the last condition becomes\
    \ false: the Else part only executes once the first condition become false.\n\n\
    Syntax:\n\n```\nIf (condition)\n{\n    If (condition)\n    {\n        if (condition)\n\
    \        {\n            . . . . . . . .\n            True Part. . .\n        \
    \    . . . . . . . .\n            . . . . . . . .\n        }\n    }\n}\nElse\n\
    {\n    . . . . . . . . . . . .\n    False Part . . . . . .\n    . . . . . . .\
    \ . . . . .\n}\n```\n\n### If Statements Examples\n"
  raw: 'StringBuffer is a peer-class string that provides much common use functionality.
    Where String represents fixed-length-character sequences, Stringbuffer represents
    varied length character sequences. StringBuffer may have characters and substrings
    inserted in the middle or appended at the end. The compiler automatically creates
    a stringbuffer to evaluate certain expressions, in particular when the overloaded
    operators + and += are used with the string objects.


    ### Constructor


    We have three different constructors to create the stringbuffer data, each listed
    here with its syntax.


    *   StringBuffer sb = new StringBuffer ();


    This is an empty constructor. It will create the StringBuffer object, but it won’t
    have anything in it. You can provide those data by simply assigning some to the
    string buffer object.


    *   StringBuffer sb = new StringBuffer(16);


    This is a parameterized constructor that has only one parameter: the size of the
    newly created StringBuffer. For example, this one will creates a new StringBuffer
    object with capacity of 16 characters.


    *   String s;


    StringBuffer sb = new StringBuffer(s);


    This is a parameterized constructor that has only one parameter: string data object.
    For, example this one will create a new StringBuffer object, then acquire the
    data of String s.


    ### StringBuffer Methods


    *   length()


    Creates a string from this StringBuffer or converts to string.


    Example of length()


    StringBuffer text = “test”;


    int amount = text.length();


    System.out.println(“The amount of characters are: “ + amount);


    The .length() function or property in a StringBuffer object returns a value for
    the amount of characters within the String object and assigns the value to the
    integer amount. The output in this sample code would be 4, since “test” is four
    characters long.


    *   capacity()


    Returns the current number of spaces allocated.


    Example of Capacity


    StringBuffer s1=new StringBuffer(16);


    int capacity=s1.capacity();


    System.out.println(“Capacity of the StringBuffer”+capacity);


    The capacity() method will return the capacity of the StringBuffer object. This
    sample code will create the new StringBuffer object s1, then once we call the
    capacity method it will return the capacity of the new StringBuffer object s1\.
    The result will be stored in an integer variable capacity. Finally, we print the
    capacity of s1 with the help of the println method.


    boolean ensureCapacity() makes the StringBuffer hold at least the desired number
    of spaces.


    *   setLength()


    Truncates or expands the previous character string, if expanding pads with nulls.


    Example of setLength


    StringBuffer s1=new StringBuffer();


    s1.setLength (25);


    This setLength method will resize the StringBuffer. In this example, we are resizing
    the data by using the setLength method.


    *   charAt(int)


    Returns the character to that location in the buffer.


    Example of charAt


    String text = “Hello World!”;


    char letter = text.charAt(0);


    The value of “letter” contains the letter “H” because the inputted index of the
    string is 0, which is the first letter of the string. The way the computer reads
    the string is from 0 to the length of the string, not 1.


    *   setCharAt(int,char)


    Modifies the value of that location.


    Example of setCharAt


    StringBuffer sb = "Hello";


    sb.setCharAt(2,''w'');              Hewlo;


    In this example we are changing the second index data by “w.”


    *   getChars()


    Copies chars into an external array. There is no getBytes() as there is in string.


    *   append()


    Converts the argument to a string and appends it at the end of the current buffer.


    Example of append


    StringBuffer s1=new StringBuffer(25);


    s1=”Hello”;


    s1.append(“AABBCC”);


    In this example, append will add the “AABBCC” text to the end of this s1 StringBuffer
    object so the final result will be “HELLOAABBCC.”


    *   insert()


    Will convert the second arg to a string and insert it into the current buffer
    beginning at the offset.


    Example of insert


    StringBuffer s1=new StringBuffer(“Dwayne Johnson”);


    s1.insert(7,” The Rock ”);


    This sample code will insert the second parameter’s text to the mentioned index
    of the StringBuffer object so the final result will be “Dwayne The Rock Johnson.”


    *   reverse ()


    Will reverse the order of the characters in the buffer.


    Example of reverse


    StringBuffer s1=new StringBuffer(“Saravanan”);


    System.out.println(“Reverse string is:”+s1.reverse());


    This example convert the string data in reverse order; the final result will be
    “nanavaraS.”


    Example:


    class StringBufExample


    {


    public static void main(String args[])


    {


    StringBuffer sb = new StringBuffer("Hello World");


    System.out.println(sb + ".capacity() = " + sb.capacity());


    System.out.println(sb + ".length() = " + sb.length());


    System.out.println(sb + ".insert(5,aaa) = " + sb.insert(5,"aaa"));


    System.out.println(sb + ".capacity() = " + sb.capacity());


    System.out.println(sb + ".length() = " + sb.length());


    System.out.println(sb + ".append(bbbb) = " + sb.append("bbbb"));


    System.out.println(sb + ".reverse() = " + sb.reverse());


    }


    }


    # Chapter 8


    # Boolean Logic


    Java provides us with a vast set of operators to manipulate variables. In the
    following section we are going to go over Relational Operators and Logical Operators,
    but first you have to know how and where to use these operators. There are many
    different statements that can be used in order to perform and test different types
    of logic. We will go over some more complex statements in later sections.


    ## Conditional Statements


    ### If Statement


    In an If statement, we have a condition. If the given condition is true, then
    the program will execute the true part of the If statement. If the given condition
    is false, then the program will not show anything.


    Syntax:


    If (condition)


    {


    . . . . . . . . . . . .


    True Part . . . .


    . . . . . . . . . . . .


    }


    ### If Else Statement


    In an If Else statement, we have a condition just like with the previous If statement.
    But here we have a false part, too: This is the major difference between an if
    and If Else statement. If the given condition is true, then the program will execute
    the true part of the If statement. If any given condition is false, then it will
    execute the false part.


    Syntax:


    If (condition)


    {


    . . . . . . . . . . . .


    True Part . . . .


    . . . . . . . . . . . .


    }


    Else


    {


    . . . . . . . . . . . .


    False Part . . . . . .


    . . . . . . . . . . . .


    }


    ### Ladder If Statement


    In a Ladder If statement, we have multiple conditions. If the first condition
    is false, then the program will check the next one, and so on until it reaches
    the Else part of the statement. If any conditions become true, then that true
    part will be executed and immediately come outside of the block. If it is false,
    then control passes to the next statement. The Else part will only execute once
    all given conditions become false.


    Syntax:


    If (condition)


    {


    . . . . . . . . . . . .


    True Part . . . .


    . . . . . . . . . . . .


    }


    else if (condition)


    {


    . . . . . . . . . . . .


    True Part . . . . . .


    . . . . . . . . . . . .


    }


    else if (condition)


    {


    . . . . . . . . . . . .


    True Part . . . . . .


    . . . . . . . . . . . .


    }


    . . . . . . .. . . . . .


    . .. . . . . . . . . . .


    else


    {


    . . . . . . . . . . . .


    false Part . . . . . .


    . . . . . . . . . . . .


    }


    ### Nested If Statement


    In a Nested If statement, we have multiple If conditions nested inside one another.
    If the first condition becomes true, then the program will check the second condition
    that is defined inside of the first condition. This process continues until the
    last condition becomes false: the Else part only executes once the first condition
    become false.


    Syntax:


    If (condition)


    {


    If (condition)


    {


    if (condition)


    {


    . . . . . . . .


    True Part. . .


    . . . . . . . .


    . . . . . . . .


    }


    }


    }


    Else


    {


    . . . . . . . . . . . .


    False Part . . . . . .


    . . . . . . . . . . . .


    }


    ### If Statements Examples'
