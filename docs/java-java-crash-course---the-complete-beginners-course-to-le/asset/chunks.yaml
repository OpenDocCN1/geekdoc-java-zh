  trans: "\n任何编程语言在你犯任何错误时都会抛出错误。在 Java 编程中，我们有两种不同类型的错误：语法错误和运行时错误。基本上，语法错误在我们违反语言规则时产生，例如缺少分号或括号、变量名不匹配等。这类错误可以很容易地修正，因为它们在你编译程序时就会被报告——因此它们也被称为“编译时错误”。另一方面，某些类型的错误只有在你开始运行程序后才会出现。这些被称为“运行时错误”，也称为“异常”。异常有两种不同类型：预定义的异常和用户自定义的异常。所有预定义的异常都是借助\
    \ `Exception` 类的帮助定义的。\n\n在编写代码时，你可能会遇到这样的情况：你的代码在尝试执行某项操作时返回了一个异常。例如，如果一个对象在构造函数中需要一个整数，但你给它的是\
    \ `null`，编译器将返回一个错误，指示该对象没有接收到相应的参数。`Exception` 类是所有类型 `Exception` 类的父类。因为每个异常都由特定的\
    \ `Exception` 类进行处理。例如，除以零异常仅由 `ArithmeticException` 类处理。在接下来的章节中，我们列出了一些预定义的异常类以及它们处理的异常。\n\
    \n## 预定义异常类\n\n- `ArithmeticException`: 处理由数学错误引起的异常，例如除以零。\n- `ArrayIndexOutOfBoundsException`:\
    \ 处理数组索引越界的异常。\n- `ArrayStoreException`: 当程序试图在异常中存储错误类型的数据时产生。\n- `FileNotFoundException`:\
    \ 当我们尝试访问不存在的文件时产生。\n- `IOException`: 产生于一般的 I/O 失败，例如无法从文件中读取。\n- `NullPointerException`:\
    \ 当我们引用空对象时产生。\n- `NumberFormatException`: 当字符串和数字之间的转换失败时产生。\n- `OutOfMemoryException`:\
    \ 当没有足够的内存分配新对象时产生。\n- `SecurityException`: 当 applet 尝试执行浏览器安全设置未允许的操作时产生。\n-\
    \ `StringIndexOutOfBoundsException`: 当程序尝试访问字符串中不存在的字符位置时产生。\n- `NegativeArraySizeException`:\
    \ 当声明数组大小为负数时产生。\n\n另一个示例是你处理文件操作时（稍后会教），并且你尝试读取一个不存在的目录中的文件。编译器会返回诸如“FileNotFoundException”之类的异常——还有其他的，但这种异常在文件处理中经常遇到。\n\
    \n为了在代码中规范异常，你可以使用 `try-catch` 语句。这些语句的作用是检查代码块是否返回了异常；如果是，它不会停止整个程序的运行，而是捕获该异常并尝试修复它或绕过它，取决于程序员编写的代码。\n\
    \n我们可以通过以下语句或块的帮助处理这种类型的异常：\n- `Try catch finally` 块\n- 嵌套 `Try` 块\n- 多个 `catch`\
    \ 块\n- `Throw` 语句\n- `Throws` 语句\n\n### 1. Try Catch Finally 块\n\n```java\ntry\n\
    {\n    // 此块下保留异常产生的语句 . . . . . . . . . .\n    // 如果产生任何异常，它们将被抛出到 catch 块\n\
    }\ncatch(Exception_class object)\n{\n    // 此块处理抛出的异常并平稳结束程序。\n}\nfinally\n{\n\
    \    // 这个 finally 块始终运行，不关心异常。\n}\n```\n\n在下面的示例中，你可以看到 `try catch finally` 块是如何处理抛出的异常的。文件“text.txt”并不。\n\
    \n```java\nimport java.io.*;\nimport java.lang.*;\n\nclass ExceptionDemo\n{\n\
    \    public static void main(String args[])\n    {\n        try {\n          \
    \  ReadFile(\"text.txt\");\n        }catch(Exception e) {\n            System.out.println(\"\
    文件不存在.\");\n        }\n        finally\n        {\n            System.out.println\
    \ (\"在读取文件之前请检查它是否存在\");\n        }\n    }\n}\n```\n\n`try` 语句不需要参数，但 `catch`\
    \ 异常需要 `Exception` 对象的参数。当异常确实发生时，类型为 `Exception` 的变量 `e` 会被赋予数据，可以对变量 `e` 进行操作以打印错误或执行各种其他事情。用于\
    \ `e` 变量的常用方法是 `e.printStackTrace()`。\n\n### 2. 嵌套 Try 块\n\n此块在另一个 `try` 块内部包含一个\
    \ `try` 块。遵循该语法有助于你理解嵌套 try 块。在嵌套 try 块中，每个 `try` 块都有自己的 `catch` 块。\n\n```java\n\
    try {\n    // 异常产生的程序语句 . . . .\n    try\n    {\n        // 异常产生的程序语句 . . . .\
    \ . .\n    }\n    catch(Exception_class object)\n    {\n        // 异常处理语句 . .\
    \ . . . .\n    }\n}\ncatch(Exception_class object)\n{\n}\n```\n\n### 3. 多个 Catch\
    \ 块\n\n在多个 catch 块中，一个 `try` 块可以包含多个 `catch` 块，这样你可以轻松地处理多个异常。如果发生了异常，它首先被发送到第一个\
    \ `catch` 块；如果在那里没有处理，该异常将发送到下一个 `catch` 块。这个过程一直持续到最后一个 `catch` 块。下面的语法有助于你理解多个\
    \ catch 块。简单来说，它的工作方式类似于 `if` 语句。\n\n```java\ntry\n{\n    // 异常产生的语句 . . . .\n\
    }\ncatch (Exception_class obj)\n{\n    // 异常处理语句 . . . . . .\n}\ncatch (Exception_class\
    \ obj) {\n    // 异常处理语句 . . . . . .\n}\n```\n\n#### 示例程序\n\n```java\nclass Exp1\n\
    {\n    public static void main(String args[])\n    {\n        int z;\n       \
    \ try\n        {\n            DataInputStream br=new DataInputStream(System.in);\n\
    \            String a[]=new String[2];\n            System.out.println(\"输入你的数据\"\
    );\n            for(int i=0;i<=2;i++)\n                a[i]=br.readLine();\n \
    \           int x = Integer.parseInt(a[0]);\n            int y = Integer.parseInt(a[1]);\n\
    \            z = x/y;\n            System.out.println(\"c = \" + c);\n       \
    \ }catch(ArithmeticException e)\n        {\n            System.out.println(\"\
    算术异常\");\n            z=0;\n        } catch(ArrayIndexOutOfBoundsException e)\n\
    \        {\n            System.out.println(\"无效参数\");\n        }\n        catch(NumberFormatException\
    \ e)\n        {\n            System.out.println(\"字符串无法转换为整数\");\n        }\n\
    \        finally\n        {\n            System.out.println(\"到达 finally 块\");\n\
    \        }\n    }\n}\n```\n"
- fmt: "\n# Throws statements\n\nThese are particularly used to apply to whole methods.\
    \ In your method, any part may send an exception, meaning you can throw those\
    \ exceptions by using this exception-handling statement.\n\n```java\npublic void\
    \ sample(int a) throws Exception\n{\n    // Statements of the method . . . . .\n\
    }\n```\n\n# Chapter 21\n\n## File Handling\n\nFile Handling is the idea of reading\
    \ and writing external files in the machine on which the program is being coded.\
    \ In Java, file handling isn’t that complicated once a few basic ideas have been\
    \ understood. In this guide, we will be going over some basic file handling fundamentals\
    \ for reading text files.\n\n### Reading Files\n\nIn order to read files, you\
    \ must use the `FileReader` class/object, which reads ordinary text files.\n\n\
    `FileReader` is a class or object that is used to read files, and should be utilized\
    \ with the `BufferedFileReader` object, which is going to help save data when\
    \ reading the text file because it will allow you to read the text file one line\
    \ at a time. If you don’t use `BufferedFileReader`, you will feel the pain of\
    \ reading each character of the text file, which is less easy to do than reading\
    \ it line by line.\n\nThe first thing you must do is import everything that has\
    \ to do with Input and Output. The import directory for this is:\n\n```java\n\
    import java.io.*;\n```\n\nWe will use the text file `test.txt` as an example.\n\
    \nThe first thing you must do is declare your file name, which you can do either\
    \ within the declaration of the object or within a string variable that can then\
    \ later be used within the constructor.\n\nExample:\n```java\nString fileName\
    \ = \"test.txt\"; // this line is the name of the file to read\n```\n\nThe next\
    \ thing you must do is declare the `FileReader` object—but remember to do all\
    \ of this within a `try-catch` statement, because if you’re trying to read a file\
    \ that does not exist, it will throw an exception.\n\nExample:\n```java\nFileReader\
    \ fileReader = new FileReader(fileName);\n```\n\nOR\n\n```java\nFileReader fileReader\
    \ = new FileReader(\"test.txt\");\n```\n\nOnce this object has been declared,\
    \ you must wrap `FileReader` within `BufferedReader` like the following:\n\n```java\n\
    BufferedReader buffRead = new BufferedReader(fileReader);\n```\n\nThe `BufferedReader`\
    \ constructor takes in the value of the `FileReader` object, so you must feed\
    \ the `FileReader` object into the constructor.\n\nThe next thing you must do\
    \ is have a `while` loop that checks whether or not the current line that the\
    \ `BufferedReader` is reading is a valid line that isn’t null (doesn’t exist).\
    \ Every time `readLine()` is called from the `BufferedReader` object, it reads\
    \ the line and moves on to the next line for the next time that `readLine()` is\
    \ called. Therefore, the line must be stored in a string to conserve the line.\
    \ While the `while` loop is going on, you can declare the line to the `buffRead.readLine()`.\n\
    \nExample:\n```java\nString line = \" \";\nwhile ((line = buffRead.readLine())\
    \ != null) {\n    System.out.println(line);\n}\n```\n\nThe above code shows a\
    \ `while` loop going through the text file `test.txt` and checking if each line\
    \ exists; if it does, it will print out accordingly. Once this has finished, close\
    \ the file like such:\n\n```java\nbuffReader.close();\n```\n\nIf any exception\
    \ is thrown from reading a file and gets dropped down to the catch, then you can\
    \ display an error.\n\n### Writing to Files\n\nWriting to a text file in Java\
    \ is similar to reading a text file, except this time you’re outputting/writing\
    \ to a text file. You must use the `FileWriter` class/object, which writes to\
    \ ordinary text files.\n\n`FileWriter` is a class or object that can be used to\
    \ write to files and should be utilized with the `BufferedOutputWriter` object,\
    \ which will help write text line by line.\n\nA lot of the steps taken to write\
    \ to a file are similar to reading a file, but we’ll go over them again. The first\
    \ thing you must do is import everything that has to do with Input and Output—the\
    \ import directory for this is:\n\n```java\nimport java.io.*;\n```\n\nWe will\
    \ use the text file `test.txt` as an example.\n\nThe first thing you must do is\
    \ declare your file name, which you can do either within the declaration of the\
    \ object or within a string variable that can later be used within the constructor.\
    \ Remember, when writing to a file, it will either overwrite a file with the same\
    \ file name OR create a file with the file name specified.\n\nExample:\n```java\n\
    String fileName = \"test.txt\"; // this line is the name of the file to write\
    \ to or create\n```\n\nThe next thing you must do is declare the `FileWriter`\
    \ object, but remember to do all of this within a `try-catch` statement for any\
    \ potential exceptions that can be thrown when trying to write to a file.\n\n\
    ```java\nFileWriter fileWriter = new FileWriter(fileName);\n```\n\nOR\n\n```java\n\
    FileWriter fileWriter = new FileWriter(\"test.txt\");\n```\n\nOnce this object\
    \ has been declared, you must wrap `FileWriter` within `BufferedOutputWriter`\
    \ like so:\n\n```java\nBufferedOutputWriter buffWrite = new BufferedOutputWriter(fileWriter);\n\
    ```\n\nThe `BufferedOutputWriter` constructor takes in the value of the `FileWriter`\
    \ object, so you must feed the `FileWriter` object as in the above sample code.\n\
    \nNow, in order to write to a file, you must do the following:\n\n```java\nbuffWrite.write(\"\
    Hi, my name is \");\nbuffWrite.write(\" Tom.\");\n```\n\nIn the above example,\
    \ we are writing to a text file, but only to the same line. In order to move on\
    \ to the next line, you must use:\n\n```java\nbuffWrite.newLine();\n```\n\nOnce\
    \ you have done this, you are able to move on to the next line by simply typing:\n\
    \n```java\nbuffWrite.write(\"This is the next line\");\n```\n\nFinally, you must\
    \ close your file by typing out the following line:\n\n```java\nbuffWrite.close();\n\
    ```\n\n# Chapter 22\n\n## Example Programs\n\nHow about we test our knowledge\
    \ by coding some example programs? For these we will be using the 2014 Canadian\
    \ Competition. The problems are linked here: [https://cemc.math.uwaterloo.ca/contests/computing/2014/stage2/juniorEn.pdf](https://cemc.math.uwaterloo.ca/contests/computing/2014/stage2/juniorEn.pdf)\n\
    \n### Problem N1: Problem J1: Triangle Times\n\n**Problem Description**\nYou have\
    \ trouble remembering which type of triangle is which. You write a program to\
    \ help. Your program reads in three angles (in degrees).\n- If all three angles\
    \ are 60, output `Equilateral`.\n- If the three angles add up to 180 and exactly\
    \ two of the angles are the same, output `Isosceles`.\n- If the three angles add\
    \ up to 180 and no two angles are the same, output `Scalene`.\n- If the three\
    \ angles do not add up to 180, output `Error`.\n\n**Input Specification**\nThe\
    \ input consists of three integers, each on a separate line. Each integer will\
    \ be greater than 0 and less than 180.\n\n**Output Specification**\nExactly one\
    \ of `Equilateral`, `Isosceles`, `Scalene` or `Error` will be printed on one line.\n\
    \n**Sample Input 1**\n```\n60\n70\n50\n```\n**Output for Sample 1**\n```\nScalene\n\
    ```\n\n**Sample Input 2**\n```\n60\n75\n55\n```\n**Output for Sample 2**\n```\n\
    Error\n```\n\n### Solution N1\n\n```java\nimport java.util.Scanner;\n\npublic\
    \ class J1 {\n    public static void main(String[] args) {\n        Scanner scan\
    \ = new Scanner(System.in);\n        int a1 = Integer.parseInt(scan.nextLine());\n\
    \        int a2 = Integer.parseInt(scan.nextLine());\n        int a3 = Integer.parseInt(scan.nextLine());\n\
    \n        if (a1 > 0 && a2 > 0 && a3 > 0 && a1 < 180 && a2 < 180 && a3 < 180)\
    \ {\n            if (a1 == 60 && a2 == 60 && a3 == 60) {\n                System.out.println(\"\
    Equilateral\");\n            } else if ((a1 + a2 + a3 == 180) && ((a1 == a2) ||\
