    \n## 问题 №\n\n### 问题 J2：票数计数\n\n#### 问题描述\n在歌手 A 和歌手 B 歌唱比赛决赛轮对决后，将进行投票。\n\n你的任务是统计票数并确定结果。\n\
    \n#### 输入规范\n输入分为两行。第一行包含 `V` (1 ≤ `V` ≤ 15)，表示总票数。第二行输入是一个包含 `V` 个字符的序列，每个字符为\
    \ `A` 或 `B`，代表对特定歌手的投票。\n\n#### 输出规范\n输出将是三种可能之一：\n- `A`，如果 `A` 的票多于 `B` 的票；\n\
    - `B`，如果 `B` 的票多于 `A` 的票；\n- `Tie`，如果 `A` 的票和 `B` 的票数相等。\n\n#### 示例输入 1\n```\n\
    6\nABBABB\n```\n#### 示例输入 1 的输出\n```\nB\n```\n\n#### 示例输入 2\n```\n6\nABBABA\n\
    ```\n#### 示例输入 2 的输出\n```\nTie\n```\n\n## 解解 №\n\n```java\nimport java.util.Scanner;\n\
    \npublic class J2\n{\n\npublic static void main(String[] args)\n{\n\nScanner scan\
    \ = new Scanner(System. in );\n\nint chars = Integer. parseInt ((scan.nextLine()));\n\
    \nString votes = scan.nextLine();\n\nif(chars > 0 && chars < 16)\n{\n\nint voteA\
    \ = 0;\n\nint voteB = 0;\n\nfor(int i = 0; i < chars; i++)\n{\n\nif(votes.charAt(i)=='A')\n\
    {\n\nvoteA++;\n}\n\nelse if(votes.charAt(i)=='B')\n{\n\nvoteB++;\n}\n\n}\n\nif(voteA\
    \ == voteB)\n{\n\nSystem. out .println(\"Tie\");\n\n}\n\nelse if(voteA > voteB)\n\
    {\n\nSystem. out .println(\"A\");\n\n}\n\nelse\n{\n\nSystem. out .println(\"B\"\
    );\n\n}\n\n}\n\n}\n\n}\n```\n\n首先，我们创建了一个 `scanner`。我们获取了第一行输入，即票数。我们获取了第二行输入，即实际投票。我们遍历了第二行的每个字母，如果字母是大写的\
