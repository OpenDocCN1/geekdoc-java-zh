- fmt: "\nEvery programming language will throw an error if you make any mistakes.\
    \ We have two different types of errors in Java programming: syntax and runtime.\
    \ Basically, syntax errors arise when we break the rules of the language, such\
    \ as missing the semicolons or brackets, mismatching variable names, and so on.\
    \ This type of error can easily be corrected, because these are all reported when\
    \ you compile your program—hence they are also called “compile time errors.” On\
    \ the other hand, some types of errors only arise after you start running your\
    \ program. These are called “runtime errors,” also known as “exceptions.” There\
    \ are two different types of exceptions: predefined and user defined. All predefined\
    \ exceptions are defined with the help of the `Exception` class.\n\nWhen coding,\
    \ you may land in situations where your code returns an exception when attempting\
    \ to do something. For example, if an object requires an integer in its constructor\
    \ but you feed it `null` instead, the compiler will return an error indicating\
    \ that the object didn’t receive the appropriate parameter. `Exception` class\
    \ is the super class for all types of `Exception` class. Because each exception\
    \ handled by specific `Exception` class. For example, a divide by zero exception\
    \ is only handled by the `ArithmaticException` class. In the following section,\
    \ we have listed some predefined exception classes and the exceptions they handle.\n\
    \n## Predefined Exception Classes\n\n- `ArithmeticException`: Handles exceptions\
    \ caused by math errors, e.g., divide by zero.\n- `ArrayIndexOutOfBoundsException`:\
    \ Handles exceptions from bad array indices.\n- `ArrayStoreException`: Arises\
    \ when a program tries to store the wrong type of data in an exception.\n- `FileNotFoundException`:\
    \ Arises when we attempt to access a nonexistent file.\n- `IOException`: Arises\
    \ with general I/O failures such as inability to read from a file.\n- `NullPointerException`:\
    \ Arises when we reference a null object.\n- `NumberFormatException`: Arises when\
    \ a conversion between strings and numbers fails.\n- `OutOfMemoryException`: Arises\
    \ when there’s not enough memory to allocate a new object.\n- `SecurityException`:\
    \ Arises when an applet tries to perform an action not allowed by the browser’s\
    \ security setting.\n- `StringIndexOutOfBoundsException`: Arises when a program\
    \ attempts to access a nonexistent character position in a string.\n- `NegativeArraySizeException`:\
    \ Arises when we declare the array size as negative.\n\nAnother example would\
    \ be when you’re working with file handling (which will be taught later) and you’re\
    \ trying to read a file in a directory that doesn’t exist. The compiler would\
    \ then return an exception such as “FileNotFoundException”—there are others, but\
    \ this type of exception is found regularly in file handling.\n\nIn order to regulate\
    \ exceptions in your code, you can use `try-catch` statements. What these statements\
    \ do is check if a block of code returns an exception; if it does, instead of\
    \ halting the whole operation of the program, it will catch the exception and\
    \ try to either fix it or work around it, depending on what the programmer has\
    \ coded.\n\nWe can handle this type of exception with help of following statements\
    \ or blocks:\n- `Try catch finally` block\n- Nested `Try` block\n- Multiple `catch`\
    \ block\n- `Throw` statements\n- `Throws` statements\n\n### 1. Try Catch Finally\
    \ Block\n\n```java\ntry\n{\n    //Exception rising statements kept under this\
    \ block . . . . . . . . . . .\n    // If any exceptions arise, they will be thrown\
    \ to the catch block\n}\ncatch(Exception_class object)\n{\n    //This block handles\
    \ the raised exceptions and smoothly terminates the program.\n}\nfinally\n{\n\
    \    // this finally block always runs and doesn’t care about the exception.\n\
    }\n```\n\nIn the following example, you can see how the `try catch finally` block\
    \ handled the raised exception. The file “text.txt” does not exist.\n\n```java\n\
    import java.io.*;\nimport java.lang.*;\n\nclass ExceptionDemo\n{\n    public static\
    \ void main(String args[])\n    {\n        try {\n            ReadFile(\"text.txt\"\
    );\n        }catch(Exception e) {\n            System.out.println(\"The file does\
    \ not exist.\");\n        }\n        finally\n        {\n            System.out.println\
    \ (\"Check before you read the file if it exists or not\");\n        }\n    }\n\
    }\n```\n\nThe `try` statement does not require parameters, but the `catch` exception\
    \ requires the parameter of an `Exception` object. When an exception does occur,\
    \ the variable `e` of type `Exception` is given data, and the `e` variable can\
    \ be manipulated to either print out the error or do various other things. A commonly\
    \ used method for the `e` variable is `e.printStackTrace()`.\n\n### 2. Nested\
    \ Try Block\n\nThis block contains one `try` block inside another one `try` block.\
    \ Following the syntax should help you to understand the nested try block. In\
    \ a nested try block, each `try` block has its own `catch` block.\n\n```java\n\
    try {\n    // exception raising program statements . . . .\n    try\n    {\n \
    \       // exception raising program statements . . . . . .\n    }\n    catch(Exception_class\
    \ object)\n    {\n        // Exception handling statements. . . . . . .\n    }\n\
    }\ncatch(Exception_class object)\n{\n}\n```\n\n### 3. Multiple Catch Block\n\n\
    In a multiple catch block, one `try` block may contain more than one `catch` block\
    \ so you can easily handle more than one exception. If an exception is raised,\
    \ it is first sent to the first `catch` block; if it is not handled there, that\
    \ exception will be sent to next `catch` block. This process continues until the\
    \ last `catch` block. The following syntax should help you to understand the multiple\
    \ catch block. Simply put, it works like a ladder `if` statement.\n\n```java\n\
    try\n{\n    // exception arising statements goes here. . . . .\n}\ncatch (exception_class\
    \ obj)\n{\n    // Exception handling statements . . . . . . .\n}\ncatch (Exception_class\
    \ obj) {\n    // Exception handling statements . . . . . . .\n}\n```\n\n#### Example\
    \ Program\n\n```java\nclass Exp1\n{\n    public static void main(String args[])\n\
    \    {\n        int z;\n        try\n        {\n            DataInputStream br=new\
    \ DataInputStream(System.in);\n            String a[]=new String[2];\n       \
    \     System.out.println(\"Enter your data\");\n            for(int i=0;i<=2;i++)\n\
    \                a[i]=br.readLine();\n            int x = Integer.parseInt(a[0]);\n\
    \            int y = Integer.parseInt(a[1]);\n            z = x/y;\n         \
    \   System.out.println(\"c = \" + c);\n        }catch(ArithmeticException e)\n\
    \        {\n            System.out.println(\"Arithmetic Exception Raised\");\n\
    \            z=0;\n        } catch(ArrayIndexOutOfBoundsException e)\n       \
    \ {\n            System.out.println(\"Invalid Arguments\");\n        }\n     \
    \   catch(NumberFormatException e)\n        {\n            System.out.println(\"\
    String cannot be changed to Integer\");\n        }\n        finally\n        {\n\
    \            System.out.println(\"Reached Finally Block\");\n        }\n    }\n\
    }\n```\n\nIn this example, we have declared a string array size of 2, so we can\
    \ store a maximum of two string data inside that string array. First of all, we\
    \ are reading two string data at runtime with the help of the `readLine()` method,\
    \ which is defined inside `DataInputStream` class. So, `br.readLine()` method\
    \ will read the string data and then store it to the string array, where we can\
    \ convert those data to integer data with the help of the Wrapper class method\
    \ `Integer.parseInt(String data)`. Inside the `try` block, we are dividing `x`\
    \ by `y`. If the `y` value is zero, it will throw an `ArithmeticException` that\
    \ can be handled by first `catch` block. If you enter only one datum, an `ArrayIndexOutOfBoundsException`\
    \ will arise. If your data are characters, they cannot be converted by the Wrapper\
    \ class method and so it will throw a `NumberFormatException`.\n\n### 4. Throw\
    \ Statement\n\nThis is used in cases of manual exceptions. It will throw an exception\
    \ when we need it to. Basically, it helps when user defined exceptions arise because\
    \ it doesn’t arise automatically, so you will need to use a `throw` statement.\
    \ Following is the syntax of a `throw` statement.\n\n```java\nthrow new Exception_class(\"\
    …….\");\n```\n\n#### Example\n\n```java\nthrow new MyException();\n```\n"
  raw: 'Every programming language will throw an error if you make any mistakes. We
    have two different types of errors in Java programming: syntax and runtime. Basically,
    syntax errors arise when we break the rules of the language, such as missing the
    semicolons or brackets, mismatching variable names, and so on. This type of error
    can easily be corrected, because these are all reported when you compile your
    program—hence they are also called “compile time errors.” On the other hand, some
    types of errors only arise after you start running your program. These are called
    “runtime errors,” also known as “exceptions.” There are two different types of
    exceptions: predefined and user defined. All predefined exceptions are defined
    with the help of the exception class.


    When coding, you may land in situations where your code returns an exception when
    attempting to do something. For example, if an object requires an integer in its
    constructor but you feed it null instead, the compiler will return an error indicating
    that the object didn’t receive the appropriate parameter. Exception class is the
    super class for all types of Exception class. Because each exception handled by
    specific Exception class. For example, a divide by zero exception is only handled
    by the ArithmaticException class. In the following section, we have listed some
    predefined exception classes and the exceptions they handle.


    ## Predefined Exception Classes


    ArithmeticException___Handles exceptions caused by math errors, e.g., divide by
    zero.


    ArrayIndexOutOfBoundsException___Handles exceptions from bad array indices.


    ArrayStoreException___Arises when a program tries to store the wrong type of data
    in an exception.


    FileNotFoundException___Arises when we attempt to access a nonexistent file.


    IOException___Arises with general I/O failures such as inability to read from
    a file.


    NullPointerException              ___Arises when we reference a null object.


    NumberFormatException___Arises when a conversion between strings and numbers fails.


    OutOfMemoryException___Arises when there’s not enough memory to allocate a new
    object.


    SecurityException___Arises when an applet tries to perform an action not allowed
    by the browser’s security setting.


    StringIndexOutOfBoundsException___Arises when a program attempts to access a nonexistent
    character position in a string.


    NegativeArraySizeException              ___Arises when we declare the array size
    as negative.


    Another example would be when you’re working with file handling (which will be
    taught later) and you’re trying to read a file in a directory that doesn’t exist.
    The compiler would then return an exception such as “FileNotFoundException”—there
    are others, but this type of exception is found regularly in file handling.


    In order to regulate exceptions in your code, you can use try-catch statements.
    What these statements do is check if a block of code returns an exception; if
    it does, instead of halting the whole operation of the program, it will catch
    the exception and try to either fix it or work around it, depending on what the
    programmer has coded.


    We can handle this type of exception with help of following statements or blocks:


    *   Try catch finally block


    *   Nested Try block


    *   Multiple catch block


    *   Throw statements


    *   Throws statements


    1.  Try Catch Finally Block


    Try


    {


    //Exception rising statements kept under this block . . . . . . . . . . . .


    // If any exceptions arise, they will be thrown to the catch block


    . . . . . . . . . . .  . . . . . . . . . . . . . . . . . . .


    . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .


    }


    catch(Exception_class object)


    {


    //This block handles the raised exceptions and smoothly terminates the program.


    }


    finally


    {


    // this finally block always runs and doesn’t care about the exception.


    }


    In the following example, you can see how the try catch finally block handled
    the raised exception.


    The file “text.txt” does not exist.


    Import java.io.*;


    Import java.lang.*;


    Class ExceptionDemo


    {


    Public static void main(String args[])


    {


    try {


    ReadFile(“text.txt”);


    }catch(Exception e) {


    System.out.println(“The file does not exist.”);


    }


    Finally


    {


    System.out.println (“Check before you read the file if it exists or not”);


    }


    }


    The try statement does not require parameters, but the catch exception requires
    the parameter of an Exception object. When an exception does occur, the variable
    “e” of type Exception is given data, and the “e” variable can be manipulated to
    either print out the error or do various other things. A commonly used method
    for the e variable is e.printStackTrace();


    2.  Nested Try Block


    This block contains a one try block inside another one try block. Following the
    syntax should help you to understand the nested try block. In a nested try block,
    each try block has its own catch block.


    try {


    // exception raising program statements . . . .


    try


    {


    // exception raising program statements . . . . .


    }


    catch(Exception_class object)


    {


    // Exception handling statements. . . . . . . .


    }


    }


    Catch(Exception_class object)


    {


    }


    3.  Multiple Catch Block


    In a multiple catch block, one try block may contain more than one catch block
    so you can easily handle more than one exception. If an exception is raised, it
    is first sent to the first catch block; if it is not handled there, that exception
    will be sent to next catch block. This process continues until the last catch
    block. The following syntax should help you to understand the multiple catch block.
    Simply put, it works like a ladder if statement.


    try


    {


    // exception arising statements goes here. . . . . .


    }


    catch (exception_class obj)


    {


    // Exception handling statements . . . . . . .


    }


    catch (Exception_class obj) {


    // Exception handling statements . . . . . . .


    }


    Example Program


    class Exp1


    {


    public static void main(String args[])


    {


    int z;


    try


    {


    DataInputStream br=new DataInputStream(System.in);


    String a[]=new String[2];


    System.out.println(“Enter your data”);


    for(int i=0;i<=2;i++)


    a[i]=br.readLine();


    int x = Integer.parseInt(a[0]);


    int y = Integer.parseInt(a[1]);


    z = x/y;


    System.out.println("c = " + c);


    }catch(ArithmeticException e)


    {


    System.out.println("Arithmetic Exception Raised");


    z=0;


    } catch(ArrayIndexOutOfBoundsException e)


    {


    System.out.println("Invalid Arguments");


    }


    catch(NumberFormatException e)


    {


    System.out.println("String cannot be changed to Integer");


    } finally


    {


    System.out.println("Reached Finally Block");


    }


    }


    }


    In this example, we have declared a string array size of 2, so we can store a
    maximum of two string data inside that string array variable. First of all, we
    are reading two string data at runtime with the help of the readLine() method,
    which is defined inside the DataInputStream class. So, the br.readLine() method
    will read the string data and then store it to the string array, where we can
    convert those data to integer data with the help of the Wrapper class method Integer.parseInt(String
    data). If you enter zero, it will be stored into the x or y. Inside the try block,
    we are dividing x by y. If the y value is zero, it will throw an ArithmaticException
    that can be handled by first catch block. If you enter only one datum, an ArrayIndexOutofBounds
    Exception will arise. If your data are characters, they cannot be converted by
    the Wrapper class method and so it will throw a NumberFormatException. If everything
    is fine, the mean dividend result will be displayed. Here we have used multiple
    catch blocks to handle more than one exception at a time; the process starts from
    the first catch block.


    4.  Throw Statement


    This is used in cases of manual exceptions. It will throw an exception when we
    need it to. Basically, it helps when user defined exceptions arise because it
    doesn’t arise automatically, so you will need to use a throw statement. Following
    is the syntax of a Throw statement.


    Throw new Exception_class(“…….”);


    Example


    Throw new MyException();'
