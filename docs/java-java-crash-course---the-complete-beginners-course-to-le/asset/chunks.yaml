    \ special type of class called an “anonymous inner class.” This means it has no\
    \ name, hence “anonymous.” It also means that it can only exist once (unless you\
    \ copy the code twice). The uses for anonymous inner classes are limited, but\
    \ if you are ever in a situation where you only need a specific class once, you\
    \ can create one rather than having to create a file and make it a class. Anonymous\
    \ inner classes are cemented in inheritance, most commonly used when dealing with\
