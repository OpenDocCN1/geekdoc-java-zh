  trans: "\n\n# Dialog 对话框\n\n`Dialog(Frame,boolean)`___ 创建一个初始为不可见的新对话框。在这个构造函数中，我们有两个参数。第一个参数\
    \ `frame` 对象指向此新创建对话框的父窗口。第二个参数 `Boolean` 类型数据表示它是模态对话框还是非模态对话框。\n\n`Dialog(Frame,String,boolean)`___\
    \ 创建一个初始为不可见的新对话框。在这个构造函数中，我们有三个参数。第一个 `frame` 对象指向此新创建对话框的父窗口。第二个 `String` 类型数据是对话框的标题文本。第三个\
    \ `Boolean` 类型数据，表示它是模态对话框还是非模态对话框。\n\n## 模态与非模态对话框\n\n`Modal` 模态对话框在关闭之前永远不会允许父窗口激活，但在\
    \ `modeless` 非模态对话框中，你可以在父窗口中进行任何操作。\n\n## Dialog 类的方法\n\n- `boolean isModal()`___\
    \ 如果对话框是模态的，返回 true。我们已经见过模态对话框的工作模式。如果对话框是非模态的，将返回 false。\n- `setResizable(boolean)`___\
    \ 设置对话框的可调整大小标志。如果你将此值设置为 true，它将允许我们调整对话框的大小。如果设置为 false，则无法调整大小。\n- `boolean\
    \ isResizable()`___ 用于检查对话框是否可以调整大小。如果返回 true，则对话框是可调整的。\n\n## 对话框示例程序\n\n```java\n\
    import java.awt.*;\nimport java.awt.event.*;\n\npublic class Dialog1 extends Dialog\
    \ implements ActionListener\n{\n    public Dialog1(Frame fm,String msg)\n    {\n\
    \        super(fm,msg,false);\n        setLayout(new GridLayout(2,1,0,0));\n \
    \       Panel p1 = new Panel();\n        Panel p2 = new Panel();\n        p1.setLayout(new\
    \ FlowLayout());\n        p1.setFont(new Font(\"Courier\",Font.BOLD,20));\n  \
    \      p2.setLayout(new FlowLayout());\n        p1.add(new Label(msg));\n    \
    \    Button b1,b2;\n        b1 = new Button(\"Ok\");\n        b2 = new Button(\"\
    Cancel\");\n        p2.add(b1);\n        p2.add(b2);\n        b1.addActionListener(this);\n\
    \        add(p1);\n        add(p2);\n        setSize(250,150);\n        setResizable(false);\n\
    \        addWindowListener(new WindowAdapter() {\n            public void windowClosing(WindowEvent\
    \ we)\n            {\n                dispose();\n            }\n        });\n\
    \    }\n\n    public void actionPerformed(ActionEvent ae)\n    {\n        dispose();\n\
    \    }\n}\n\npublic class SampleDialog extends Frame implements ActionListener\n\
    {\n    MenuBar mb;\n    Menu myMenu;\n    MenuItem mDialog,mExit;\n    public\
    \ SampleDialog(String text)\n    {\n        super(text);\n        mb = new MenuBar();\n\
    \        mMenu = new Menu(\"My Menu\");\n        mDialog = new MenuItem(\"Open\
    \ Dialog\");\n        mExit = new MenuItem(\"Exit\");\n        mMenu.add(mDialog);\n\
    \        mMenu.add(mExit);\n        mb.add(mMenu); // 注意：此处原文为 mMenu，此处已修正代码逻辑\n\
    \        setMenuBar(mb);\n        setSize(400,400);\n        setVisible(true);\n\
    \        mDialog.addActionListener(this);\n        mExit.addActionListener(this);\n\
    \        addWindowListener(new WindowAdapter() {\n            public void windowClosing(WindowEvent\
    \ we)\n            {\n                dispose();\n                System.exit(0);\n\
    \            }\n        });\n    }\n\n    public void actionPerformed(ActionEvent\
    \ ae)\n    {\n        if(ae.getSource() == mDialog)\n        {\n            Dialog1\
    \ d1 = new Dialog1(this,\"My New Dialog\");\n            mb.setVisible(true);\n\
    \        }\n        else if(ae.getSource() == mExit)\n        {\n            dispose();\n\
    \            System.exit(0);\n        }\n    }\n\n    public static void main(String\
    \ args[])\n    {\n        SampleDialog sd = new SampleDialog(\"Dialog Demo\");\n\
    \    }\n}\n```\n\n在这个程序中，我们使用了 `Dialog` 类来创建一个包含两个面板的新对话框。第一个面板被设置为 `FlowLayout`，因此所有控件都居中添加，并留有\
    \ 5 像素的水平和垂直空间。第一个面板只包含一个 `Label` 框。第二个面板同样使用 `FlowLayout`，包含两个按钮。第一个按钮标签为“ok”，第二个标签为“cancel”。如果你点击此对话框上的任何按钮，将立即产生动作事件。\n\
    \n在对话框示例程序中，我们创建了一个名为 `My Menu` 的菜单。该菜单中有两个选项。第一个选项是 `Open Dialog`，它会打开对话框。第二个选项是\
    \ `Exit`，它会关闭打开的窗口。\n\n## 文件对话框 (File Dialog)\n\n我们在之前的章节中已经提到过文件对话框。在 Java 中，有两个与文件操作相关的重要对话框：`Open\
    \ Dialog`（打开）和 `Save Dialog`（保存）。我们可以通过 `FileDialog` 构造函数来打开此对话框。`FileDialog`\
    \ 类有三个构造函数。\n\n### FileDialog 的构造函数\n\n- `FileDialog (Frame parent)`___ 创建一个用于加载文件的对话框。注意：默认对话框是打开的，所以如果你使用此构造函数创建文件对话框，它将加载一个打开对话框。\n\
    - `FileDialog (Frame parent,String title)`___ 创建一个用于加载文件的对话框。这里有两个参数：`parent`\
    \ 窗口和标题 `title`。\n- `FileDialog (Frame parent,String title,boolean modal)`___\
    \ 创建一个用于加载文件的对话框。这里有三个参数：`parent` 窗口、标题 `title` 以及 `modal`。\n\n在接下来的部分，我们将看到一个使用\
    \ `FileDialog` 来加载和保存文本的示例程序。该程序提供了像 Notepad 编辑器一样的用户界面。\n\n"
- fmt: "\nIn this Java notepad application, we have created a basic text editor with\
    \ simple functionalities such as new, open, save, and exit. This should tell you\
    \ everything you need to know about creating menus with text area components.\
    \ If you have any confusion, check out our sample program in the menu creation\
    \ section. All menu items will generate an action event, so you need to implement\
    \ the action listener interface to handle the action event generated by each option.\
    \ If you select a new option, an action event will immediately generate and call\
    \ the `action()` method. There we check what option has been selected. If you\
    \ click the “new” option, it will erase all content inside the text area. If you\
    \ select the “open” option, it will open a load dialog where you can select any\
    \ file, which will immediately load in the text area. If you select the “option”\
    \ option, it will open a save dialog box where you can save the text written in\
    \ the text area. The final option is “exit,” which will stop the execution of\
    \ our notepad application.\n\n## JFC Swing\nJava Swing is a fully featured user\
    \ interface development kit used to create interfaces in Java applications. The\
    \ toolkit includes a vast variety of widgets and tools used to help create graphical\
    \ user interfaces. It has built-in controls such as buttons, layout managers,\
    \ sliders, text fields, labels, etc. It also has some advanced controls such as\
    \ tree, table, scroll pane, and tab controls.\n\nIn this guide, you will learn\
    \ the foundations of how to develop an interface in Java Swing. This should be\
    \ enough for you to get started, but the rest is up to you. Remember, the Java\
    \ API is at your disposal.\n\nLet’s start by going over a few objects that will\
    \ be important to remember and understand.\n\nBefore we begin, it is important\
    \ to remember the following three packages in Swing:\n\n```\nimport javax.swing.*;\n\
    import java.awt.*;\nimport java.awt.event.*;\n```\n\n`javax.swing` is the package\
    \ that has all required classes of swing application development. `JApplet`, `JButton`,\
    \ `JTree`, and `JScrollpane` are some example classes of the swing package.\n\n\
    ## JFrame\nA `JFrame` object is simply an object that allows a window to appear\
    \ on the screen. You can think of a `JFrame` as a canvas, the base foundation\
    \ that is needed in order to add elements to the interface. These elements are\
    \ called “components” in Swing and will be referred to as such for the remainder\
    \ of this guide.\n\nTo declare a `JFrame` object, you can do something as simple\
    \ as:\n\n```\nJFrame frame = new JFrame(\"Title\");\nframe.setSize(250,250);\n\
    frame.setDefaultCloseOperation(frame.EXIT_ON_CLOSE);\nframe.setVisible(true);\n\
    ```\n\n![https://lh6.googleusercontent.com/_bSU5VKMJ7pFENUyn4JxxxOjIJoVINznpLeKWN1to4oewXWRWeq3X8PQHlart0u5O88I2I0mmxT60rHIkE9-wBWxLThAxqt1Ngf-NFH-1zdbfT1S_B9VfvOyGZhKQlcvJKZQpVk](Image00017.jpg)\n\
    \nLet’s analyze every line in the sample code above.\n\n```\nJFrame frame = new\
    \ JFrame(\"Title\");\n```\n\nIn this line, the `JFrame` object is being declared.\
    \ The arguments of the `JFrame` constructor take in a string, which is considered\
    \ the title of the window. Another alternate route to this is to leave the constructor\
    \ empty and then use the method:\n\n```\nframe.setTitle(\"Title\");\n```\n\nLet’s\
    \ move on to the next line:\n\n```\nframe.setSize(250,250);\n```\n\nThis line\
    \ should be self-explanatory. There is a method within the `JFrame` object that\
    \ is called `setSize` that takes in two values. The first value is the width of\
    \ the `JFrame` and the second value is the height.\n\n```\nframe.setDefaultCloseOperation(frame.EXIT_ON_CLOSE);\n\
    ```\n\nThis next line simply lets the window know that if the program is ended\
    \ through a mouse click of the x button or through the console, it should exit\
    \ the window instead of leaving it open.\n\n```\nframe.setVisible(true);\n```\n\
    \nThe most obvious line of them all, this line simply sets the visibility of the\
    \ `JFrame` to `true` so the user is able to see the window.\n\n## JPanel\nIn the\
    \ canvas of the interface (`JFrame`), we need a panel so that we can add components\
    \ to it (buttons, labels, etc.). You can think of the `JFrame` as a clipboard\
    \ and the `JPanel` as the paper, that extra layer that will allow you to draw\
    \ and add different types of components to the interface. One thing to note is\
    \ that components can be added to the raw canvas (`JFrame`). However, many complications\
    \ can arise from doing this. That is why we should add a `JPanel` to the `JFrame`.\n\
    \nTo declare a `JPanel`, you can do the following in conjunction with the previous\
    \ sample code:\n\n```\nJFrame frame = new JFrame();\nframe.setTitle(\"Title\"\
    );\nframe.setSize(250,250); \nframe.setDefaultCloseOperation(frame.EXIT_ON_CLOSE);\n\
    JPanel panel = new JPanel(); // new line of code\nframe.add(panel); // new line\
    \ of code\nframe.setVisible(true);\n```\n\nIn every object within the Swing hierarchy\
    \ of classes, there is a commonly used method called `add` that takes in any Swing\
    \ component. A `JPanel` is considered a component and is thus added to the frame.\
    \ Now the `JPanel` can add components to it by referring to the object name of\
    \ the `JPanel` and by using the `add` method. The `JFrame` object and the `JPanel`\
    \ object technically have identical methods, so you can use the same methods you\
    \ have been using with `JFrame` on `JPanel`. Adding this piece of code won’t change\
    \ anything in the program, because all a `JPanel` does is to act as a container\
    \ for GUI components to be added.\n\n## JLabel\nThe `JLabel` object is simply\
    \ a Swing component that can be added to the `JPanel`. This component simply acts\
    \ as a text element in the `JFrame` window. In order to add a `JLabel` component\
    \ to the main panel we created before, we simply do the following:\n\n```\nJFrame\
    \ frame = new JFrame();\nframe.setTitle(\"Title\");\nframe.setSize(250,250); \n\
    frame.setDefaultCloseOperation(frame.EXIT_ON_CLOSE);\nJPanel panel = new JPanel();\n\
    frame.add(panel);\nframe.setVisible(true);\nJLabel lblText = new JLabel(\"This\
    \ is Text\");\npanel.add(lblText);\n```\n\n![https://lh3.googleusercontent.com/sKT-xUZdHAYBmwlmqL92pFXU1EyHvDgRsO8K2Or-DFAI2RMvIh4y6jK52Se_bY7r4BLN7nlG_u9YQ-SVA-X5D_K1hf36p_91rg](Image00018.jpg)\n\
    \nAs shown above in the last two lines, you can see that it is simple to create\
    \ a new `JLabel` object that takes in a string as its constructor and to use that\
    \ to display the text. Another way to complete this is to leave the constructor\
    \ empty and use the `setText` method for the `JLabel`. The next line simply adds\
    \ the `JLabel` object to the panel so it can be displayed. You must be wondering\
    \ how you can have the program decide where and how to display the text. We will\
    \ talk further about this in the section on LayoutManager.\n\n## JButton\nThe\
    \ `JButton` object is also a Swing component that can be added to the `JPanel`.\
    \ This component acts as a button element in the `JFrame` window. In order to\
    \ add a `JButton` component to the panel, we simply do the following:\n\n```\n\
    JFrame frame = new JFrame();\nframe.setTitle(\"Title\");\nframe.setSize(250,250);\
    \ \nframe.setDefaultCloseOperation(frame.EXIT_ON_CLOSE);\nJPanel panel = new JPanel();\n\
    frame.add(panel);\nframe.setVisible(true);\nJLabel lblText = new JLabel(\"This\
    \ is Text\");\npanel.add(lblText);\nJButton btnTest = new JButton(\"Test\"); //\
    \ new line of code\npanel.add(btnTest); // new line of code\n```\n\n![https://lh5.googleusercontent.com/_GrlbOqJ9cP7bUeHV6mgZ1rUA1hNpEG6sFjvUPp0Xu_HRpTwAMVLM9dx9tiIbIKqFda-BTTRq7A7f-OtNZuNajb78akeDnnmpFfnbjSayzHS8kdjs2C9L5EHQ](Image00019.jpg)\n\
    \nIn the last two lines, we see how the `JButton` object takes in the value of\
    \ a string as its constructor and is then used as the name of the button. Another\
    \ way to do this is to leave the constructor empty and use the `setText` method\
    \ for the `JButton`. Then, we add the `JButton` component to the `JPanel`.\n\n\
    ## Layout Managers\n"
