    ### User Defined Packages


    These are developed by users or developers for their own usage. You may find it
    helpful to develop your own Package because all class files are grouped in single
    directory and you can easily reuse all files whenever you need to. There are important
    steps involved in creating user defined packages:


    Step 1: Create a directory in bin folder of Java Installed location.


    Step 2: Give any name for that folder; it will be the name for your package, too.


    Step 3: Define your classes and store them in your newly created package folder.


    Step 4: Import just like pre-defined packages.


    The following table explains the accessibility level of packages and their classes.


    |  | Private | Public | Protected | No Modifier |


    | Same Package Same Class              | Yes | Yes | Yes | Yes |


    | Same PackageSub Class              | No | Yes | Yes | Yes |


    | Same PackageNon Subclass              | No | Yes | No | Yes |


    | Different PackageSubclass | No | Yes | Yes | No |


    | Different PackageNon Subclass                  | No | Yes | No | No |


    Syntax for Creating Package


    package package_name;


    class class_name


    {


    Members of the class;


    . . . . . . . . . . .


    . . . . . . . . . . .


    . . . . . . . . . . .


    }


    Example Program


    Create a new package and save your package as pack1.


    Class number 1 in pack1


    package pack1;


    public class Factorial


    {


    public int getFact(int n)


    {


    int fact1=1;


    for(int i=1;i<=n;i++)


    fact = fact * i;


    return fact;


    }


    }


    Class number two in pack1


    package pack1;


    public class Fibonacci


    {


    public void fib(int n)


    {


    int f1=0,f2=1,f3,i;


    System . out. println(f1);


    System . out. println(f2);


    For(i=2;i<=n;i++)


    {


    f3=f1+f2;


    System . out. println(f3);


    f1=f2;


    f2=f3;


    }


    }


    }


    Importing package pack1 to your program


    import pack1.Factorial;


    import pack1.Fibonacci;


    class SamplePack


    {


    public static void main(String args[])


    {


    Factorial f1=new Factorial();


    f1.getFact(5);              //It will print the Factorial value of Integer 5 as
    120


    Fibonacci f2=new Fibonacci();


    f2.fib(5);              // It will generate the Fibonacci series.


    }


    }


    In this program, we have created a new package called by the name pack1 that contains
    two different classes: Factorial and Fibonacci. Both are public classes with only
    one method. These two methods are also public methods. The first method is getFact(),
    which will calculate the factorial value of the given parameter data. The second
    method will generate the Fibonacci series of the passed parameter value. In the
    SamplePack class, we have created an object for the Factorial as well as the Fibonacci
    class with the help of objects that you can invoke using the getFact and fib method
    to get the result.


    # Chapter 14


    # Debugging


    Sometimes, your code may give the wrong outputs. This is called a logic error.
    Your IDE will not tell you that anything is wrong, because technically your code
    follows the rules of Java. It’s like writing in any language. You may follow the
    rules of the language, like grammar, syntax, etc., but your paragraphs won’t necessarily
    make sense. The most common method of debugging is simply using System.out.println()
    to print out variables that will help you to find where values stop making sense.
    Then you can find the lines that are causing the error and debug them. Another
    tool for debugging is the use of breakpoints. These are points that act as “checkpoints”
    to stop the code from executing until the programmer lets it continue. In Eclipse,
    on the line where you wish to put a breakpoint, simply move your cursor to the
    left-hand side, right-click, and press Toggle Breakpoint. This way you can slow
    down your code to find out where the error is occurring (or when, if you are doing
    lots of iterations in a loop).


    One thing that may or may not be considered debugging is optimization. Once you’ve
    written your code, it may be tempting to just leave it and continue on with other
    tasks, but this may not be the best idea. If your program eventually returns the
    desired results but it takes a long time, then it is not very good. With that
    being said, there is no single strategy to optimize code. Sometimes your logic
    could simply be a longer method of doing something, and sometimes it could be
    how you have implemented that logic. Be wary of creating unused variables, as
    they can take up processing time and memory, thanks to a system called “garbage
    collection” that goes through all the variables in your code and removes any that
    are no longer valid. For example, if you make a for loop, that variable will no
    longer be valid once it completes, so it should be deleted to save memory. This
    takes up (small) amounts of processing time.


    Here is an optimization example: Say you want to find the distance from one point
    to another. Math class tells us to use the Pythagorean Theorem, but this is rather
    slow. First the computer must square both sides (which is quite expensive, performance-wise),
    then add them, and finally take their square roots. This calculates the accurate
    distance between two points. Another solution, however, could be to use “Manhattan
    distance.” This will not get you accurate distances, but it could be good in situations
    where speed is more important than the exact value. To do Manhattan distance,
    simply absolute (which means to make a value positive, so -7 becomes 7 and 8 becomes
    8) both the x and y components and then add them. This gives you an inaccurate
    distance, but it is much faster than its more accurate counterpart. This is particularly
    good when you are guessing the fastest route. Rather than constantly calculating
    the accurate distance, Manhattan distance is a cheap alternative that will get
    you near enough.


