    \ = 4`\n\n```java\nint x = 5;\n--x;\nint y = 0;\ny = --x;\n```\n\n在上面的示例中，变量 `x`\
    \ 减少了值 `1`。因此，`x` 的值现在必须是 `4`，因为 `x` 原本等于 `5`，`x - 1 = 4`。如果你打印 `x` 的值，输出将是 `4`。你可以再次执行\
    \ `--x`，该值将变为 `3`。另一方面，`y` 的值是 `3`，因为它是前置自减。这意味着 `x` 的值减少了 `1`，且 `y` 的值已经发生了改变。\n\
    \n## 赋值运算符\n\n赋值运算符是在给变量赋值时使用的运算符，最常用的运算符是 (`=`)。以下是一些示例列表：\n\n### 等号：=`\n\n```java\n\
    int x = 5;\n```\n\n在这个示例中，如果你打印 `x`，值将是 `5`，因为你将变量 `x` 赋值为 `5`。\n\n### 加赋值运算符：`+=`\n\
    \n```java\nint x = 5;\nx += 5;\n```\n\n在这个示例中，如果你打印 `x`，值将是 `10`，因为你正在 `x` 的值上加上\
    \ `5`。这条语句等同于 `x = x + 5` → `x += 5`。\n\n### 减赋值运算符：`-=`\n\n```java\nint x = 5;\n\
    x -= 5;\n```\n\n在这个示例中，如果你打印 `x`，值将是 `0`，因为你正在从 `x` 的值中减去 `5`。\n\n### 乘法赋值运算符：`*=`\n\
    \n```java\nint x = 5;\nx *= 5;\n```\n\n在这个示例中，如果你打印 `x`，值将是 `25`，因为你正在将 `x` 的值乘以\
    \ `5`。\n\n### 除法赋值运算符：`/=`\n\n```java\nint x = 5;\nx /= 5;\n```\n\n在这个示例中，如果你打印\
    \ `x`，值将是 `1`，因为你正在将 `x` 的值除以 `5`。\n\n### 取模赋值运算符：`%=`\n\n```java\nint x = 5;\n\
    x %= 2;\n```\n\n在这个示例中，如果你打印 `x`，值将是 `1`，因为你正在对 `x` 的值取模。\n\n## 第 6 章：用户输入：获取数据\n\
    \n`Scanner` 对象允许我们获取输入。了解 `Scanner` 的工作方式，如下：\n\n```java\nimport java.util.Scanner;\n\
    \npublic class Main {\n    public static void main(String[] args) {\n        Scanner\
    \ scan = new Scanner(System.in);\n        System.out.println(\"输入你的名字：\");\n \
    \       String name = scan.nextLine();\n        System.out.println(\"你好, \" +\
    \ name);\n        System.out.println(\"输入你的年龄：\");\n        int age = scan.nextInt();\n\
    \        System.out.println(\"你的年龄是 \" + age + \" 岁。\");\n    }\n}\n```\n\n这个程序具体做了什么？\n\
    \n它声明了两个整数等待用户输入。首先，它等待第一个数字，即用户输入数字并按回车。然后它等待第二个数字。最后，`sum` 变量将结果相加输出。\n\n###\
    \ 替代方案：BufferedReader 和 DataInputStream\n\n除了 `Scanner` 对象，我们还可以使用 `BufferedReader`\
    \ 和 `DataInputStream` 类方法在运行时读取不同类型的数据。在这些类中，我们有一组方法可以读取整数、字符、float、double、String\
    \ 等。\n\n`BufferedReader` 和 `DataInputStream` 类定义在 `java.io` 包中。如果你想使用这些类，你需要在程序中导入这些包。导入这些包后，你可以在任何地方使用这些类，但在调用这些方法之前你需要创建一个对象。\n\
    \n```java\nimport java.io.BufferedReader;\nimport java.io.InputStreamReader;\n\
    import java.io.IOException;\n\npublic class Main {\n    public static void main(String[]\
    \ args) throws IOException {\n        BufferedReader br = new BufferedReader(new\
    \ InputStreamReader(System.in));\n        System.out.println(\"输入你的名字：\");\n \
    \       String name = br.readLine();\n        System.out.println(\"你好, \" + name);\n\
    \        System.out.println(\"输入你的年龄：\");\n        int age = Integer.parseInt(br.readLine());\n\
    \        System.out.println(\"你的年龄是 \" + age + \" 岁。\");\n    }\n}\n```\n\n创建\
    \ `DataInputStream` 和 `BufferedReader` 的对象\n\n```java\nBufferedReader br=new BufferedReader(new\
    \ InputStreamReader(System.in));\nString name=br.readLine(); // 这将在运行时读取字符串数据。\n\
    int no=br.readLine(); /*这将抛出错误，因为你不能将字符串数据存储在整数变量中。你必须通过包装类将此数据转换为整数数据.*/\n\n\
    包装类：\n\n*   `Integer`\n*   `Float`\n*   `Double`\n*   `Byte`\n\n`Integer.parseInt(String\
    \ data)`\n\n将字符串数据转换为整数数据。\n\n`Float.parseFloat (String data)`\n\n将字符串数据转换为 float\
    \ 数据。\n"
