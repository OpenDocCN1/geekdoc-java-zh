    7\nRich Graeme Michelle Sandy Vlado Ron Jacob\nRon Vlado Sandy Michelle Rich Graeme\
    \ Jacob\n```\n\n### 示例 2 输出\n```\nbad\n```\n\n### 示例 2 输出\nGraeme 与 Vlado 是伙伴，但\
