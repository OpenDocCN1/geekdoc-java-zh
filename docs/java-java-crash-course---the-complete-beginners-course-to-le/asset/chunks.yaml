    returnType: The dataType that the method will return. Can return nothing if set
    to `void`.


    methodName: The name of the method. Same syntax as variables except it starts
    with a capital letter.


    ## Types of Methods


    We have two types of methods in Java: Static and Non-Static. Static methods start
    with the keyword `static`. You don’t need any class objects to call this type
    of method; however, all non-static methods need a class object to invoke.


    ### Syntax of Static Method


    ```java

    static return-type method_name (parameters)


    {


    …


    …


    }

    ```


    ### Syntax of Non-Static Methods


    ```java

    return_type method_name (parameters)


    {


    …


    …

    }

    ```


    ## Parameters


    Parameters are variables that you can give to the method to use when you call
    it. A method can take zero parameters as well.


    ### Example 1:


    ```java

    public static void main(String[] args){

    int x = 0;

    x = SampleMethod (x);

    }


    public static int SampleMethod (int x) {

    return x + 1;

    }

    ```


    Here we have created a method of type `int` called `SampleMethod` that takes one
    parameter of the `int` data type. We also state that the method is `public`, which
    means that this method can be accessed from subclasses. We have set it to `static`,
    which means only one instance of this method can ever run at once. In the `main`
    method, we declare an `int` `x`. Then we set the value of `x` to `SampleMethod(x)`.
    Since `sample method` has a return type of `int`, whenever the method is called,
    it will ALWAYS return an `int` value. We gave it the value of `x`, and the method
    adds one to that value and returns it. Therefore, `x` will now have a value of
    1.


    ### Example 2:


    ```java

    public static void main (String args args) {

    double a = 3;

    double b = 6;

    Average (a,b);

    }


    public static void Average(double x, double y){

    System. out .println("the average is " + (x+y)/2);

    }

    ```


    The example method above has a data type of `void`. This means that the method
    will not return any value. This is good if you just need the method to perform
    a specific function and don’t need to assign a value to it. In the above example,
    we have created a method that calculates the average of two numbers. The method
    simply performs the function of calculating an average and prints it to the console.
    It will never return any values.


    ### Example 3:


    ```java

    public static int a = 1;

    public static int b = 2;

    public static void main(String[] args) throws IOException {

    Sum ();

    }


    public static void Sum(){

    System. out .println("sum is" + ( a + b ));

    }

    ```


    In this example, we create a method called `Sum()` that takes no parameters. When
    a method takes no parameters, it is called with empty brackets, but the brackets
    must still be there no matter what. This also shows how you can use `public` variables
    from the class within any method in that class. The variable does not have to
    be an argument in the parameters for it to be useable. We have set the integers
    `a` and `b` to `static`. This is because only static variables can be used in
    a static method.


    ## Method Overloading


    Method overloading means that your program contains more than one method with
    the same name but with different parameters and return types.


    ### Example:


    ```java

    public static void main (String args[]) throws IOException

    {

    int a = 1;

    int b = 2;

    double c = 3;

    double d = 4;

    System. out .println( Sum (a,b));

    System. out .println( Sum (c,d));

    }


    public static int Sum(int x , int y){

    return x+y;

    }


    public static int Sum(double x , double y)

    {

    return (int) (x+y);

    }

    ```


    In the example above, we have created two methods with the same name that take
    two different types of arguments. Unlike variables, you can name two methods the
    same, because Java can differentiate those methods based on their parameters and
    return types. If you run the above code, you will see that both methods work.
    One takes the sum of the `double` values, while the other processes the `int`
    values.


    ## Assignment


    Create a more advanced calculator. Have three values. The first tells you which
    kind of operation to perform (for example if `a == 1`, add the values; if `a ==
    2`, subtract them). The next two values will be used for manipulation. Make the
    calculator support addition, subtraction, division, and multiplication, and give
    each its own method.


    ```java

    // The main method

    public static void main(String args[])

    {

    // Integer that chooses the action

    int action = 4;

    // The variables to manipulate

    double x = 4.5;

    double y = 3;

    /*

    * Based on the value of action we decide what to do with

    * the two variables. Each action is performed in its own method

    * if action is not valid, we print invalid operation, as we have

    * nothing to do for those values.

    */

    if (action == 1) {

    System. out .println("The sum is " + Addition (x,y));

    }

    else if (action == 2) {

    System. out .println("The difference is " + Subtraction (x,y));

    }

    else if (action == 3) {

    System. out .println("The product is " + Multiply (x,y));

    }

    else if (action == 4) {

    System. out .println("The answer is " + Divide (x,y));

    }

    else {

    System. out .println("Invalid operation");

    }


    // Addition method

    public static double Addition (double x, double y) {

    return x+y; // Returns the sum of a and b

    }


    // Subtraction method

    public static double Subtraction (double x, double y) {

    return x-y; // Returns the subtraction of a and b

    }


    // Multiply method

    public static double Multiply (double x, double y) {

    return x*y; // Returns the product of a and b

    }


    // Divide method

    public static double Divide (double x, double y) {

    return x/y; // Divide a by b

    }

    ```


