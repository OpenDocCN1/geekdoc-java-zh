    # Chapter 21


    # File Handling


    File Handling is the idea of reading and writing external files in the machine
    on which the program is being coded. In Java, file handling isn’t that complicated
    once a few basic ideas have been understood. In this guide, we will be going over
    some basic file handling fundamentals for reading text files.


    ## Reading Files


    In order to read files, you must use the “FileReader” class/object, which reads
    ordinary text files.


    FileReader is a class or object that is used to read files, and should be utilized
    with the BufferedFileReader object, which is going to help save data when reading
    the text file because it will allow you to read the text file one line at a time.
    If you don’t use BufferedFileReader, you will feel the pain of reading each character
    of the text file, which is less easy to do than reading it line by line.


    The first thing you must do is import everything that has to do with Input and
    Output. The import directory for this is:


    import java.io.*;


    We will use the text file “test.txt” as an example.


    The first thing you must do is declare your file name, which you can do either
    within the declaration of the object or within a string variable that can then
    later on be used within the constructor.


    Example:


    String fileName = “test.txt”; // this line is the name of the file to read


    The next thing you must do is declare the FileReader object—but remember to do
    all of this within a try-catch statement, because if you’re trying to read a file
    that does not exist, it will throw an exception.


    Example:


    FileReader fileReader = new FileReader(fileName);


    OR


    FileReader fileReader = new FileReader(“test.txt”);


    Once this object has been declared, you must wrap FileReader within BufferedReader
    like the following:


    BufferedReader buffRead = new BufferedReader(fileReader);


    The BufferedReader constructor takes in the value of the FileReader object, so
    you must feed the FileReader object into the constructor.


    The next thing you must do is have a while loop that checks whether or not the
    current line that the BufferedReader is reading is a valid line that isn’t null
    (doesn’t exist). Every time .readLine() is called from the BufferedReader object,
    it reads the line and moves on to the next line for the next time that .readLine()
    is called. Therefore, the line must be stored in a string to conserve the line.
    While the “while” loop is going on, you can declare the line to the buffRead.readLine().


    Example:


    String line = “ ”;


    while ((line = buffRead.readLine()) != null) {


    System.out.println(line);


    }


    The above code shows a while loop going through the text file “test.txt” and checking
    if each line exists; if it does, it will print out accordingly. Once this has
    finished, close the file like such:


    buffReader.close();


    If any exception is thrown from reading a file and gets dropped down to the catch,
    then you can display an error.


    ## Writing to Files


    Writing to a text file in Java is similar to reading a text file, except this
    time you’re outputting/writing to a text file. You must use the “FileWriter” class/object,
    which writes to ordinary text files.


    FileWriter is a class or object that can be used to write to files and should
    be utilized with the BufferedOuputWriter object, which will help write text line
    by line.


    A lot of the steps taken to write to a file are similar to reading a file, but
    we’ll go over them again. The first thing you must do is import everything that
    has to do with Input and Output—the import directory for this is:


    import java.io.*;


    We will use the text file “test.txt” as an example.


    The first thing you must do is declare your file name, which you can do either
    within the declaration of the object or within a string variable that can later
    be used within the constructor. Remember, when writing to a file, it will either
    overwrite a file with the same file name OR create a file with the file name specified.


    Example:


    String fileName = “test.txt”; // this line is the name of the file to write to
    or create


    The next thing you must do is declare the FileWriter object, but remember to do
    all of this within a try-catch statement for any potential exceptions that can
    be thrown when trying to write to a file.


    FileWriter fileWriter = new FileWriter(fileName);


    OR


    FileWriter fileWriter = new FileWriter(“test.txt”);


    Once this object has been declared, you must wrap FileWriter within BufferedOutputWriter
    like so:


    BufferedOutputWriter buffWrite = new BufferedOutputWriter (fileWriter);


    The BufferedOutputWriter constructor takes in the value of of the FileWriter object,
    so you must feed the FileWriter object as in the above sample code.


    Now, in order to write to a file, you must do the following:


    buffWrite.write(“Hi, my name is “);


    buffWrite.write(“ Tom.”);


    In the above example, we are writing to a text file, but only to the same line.
    In order to move on to the next line, you must use:


    buffWrite.newLine();


    Once you have done this, you are able to move on to the next line by simply typing:


    buffWrite.write(“This is the next line”);


    Finally, you must close your file by typing out the following line:


    buffWrite.close();


    # Chapter 22


    # Example Programs


    How about we test our knowledge by coding some example programs? For these, we
    will be using the 2014 Canadian Computing Competition. The problems are linked
    here:


    [https://cemc.math.uwaterloo.ca/contests/computing/2014/stage%201/juniorEn.pdf](https://cemc.math.uwaterloo.ca/contests/computing/2014/stage%201/juniorEn.pdf)


    ## Problem N°1


    Problem J1: Triangle Times


    Problem Description


    You have trouble remembering which type of triangle is which.


    You write a program to help.


    Your program reads in three angles (in degrees).


    • If all three angles are 60, output Equilateral.


    • If the three angles add up to 180 and exactly two of the angles are the same,
    output Isosceles.


    • If the three angles add up to 180 and no two angles are the same, output Scalene.


    • If the three angles do not add up to 180, output Error.


    Input Specification The input consists of three integers, each on a separate line.


    Each integer will be greater than 0 and less than 180.


    Output Specification Exactly one of Equilateral, Isosceles, Scalene or Error will
    be printed on one line.


    Sample Input 1


    60


    70


    50


    Output for Sample Input 1


    Scalene


    Sample Input 2


    60


    75


    55


    Output for Sample Input 2


    Error


    ## Solution N°1


    import java.util.Scanner;


    public class J1 {


    public static void main(String[] args)


    {


    Scanner scan = new Scanner(System.in);


    int a1 = Integer.parseInt(scan.nextLine());


    int a2 = Integer.parseInt(scan.nextLine());


    int a3 = Integer.parseInt(scan.nextLine());


    if(a1 > 0 && a2 > 0 && a3 > 0 && a1 < 180 && a2 < 180 && a3 < 180)


    {


    if(a1 == 60 && a2 == 60 && a3 == 60)


    {


    System.out.println("Equilateral");


    }


    else if((a1 + a2 + a3 == 180) && ((a1 == a2) || (a2 == a3) || (a3 == a1)))


    {


    System.out.println("Isosceles");


    }


    else if((a1 + a2 + a3 == 180) && ((a1 != a2) && (a2 != a3) && (a3 != a1)))


    {


    System.out.println("Scalene");


    }


    else


    {


    System.out.println("Error");


    }


    }


    }


