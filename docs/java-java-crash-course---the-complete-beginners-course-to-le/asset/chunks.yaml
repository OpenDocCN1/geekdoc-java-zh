    \nWe can then access each of these indices in the following way:\n\n```java\n\
    int[][] intArray = new int[5][5];\nintArray[0][0] = 1;\nintArray[0][1] = 1;\n\
    intArray[0][2] = 1;\nintArray[0][3] = 1;\nintArray[0][4] = 1;\n// and so forth\n\
    ```\n\nThe following code demonstrates how to assign each value within `intArray[0]`.\
    \ If you think of it as the first number, `intArray[0]` represents which inner\
    \ array we want to access, which would leave the second number `intArray[][0]`\
    \ as the actual value of each inner array. That might be an easier way we can\
    \ make sense of it all.\n\n## Combining Loops and Arrays\n\nAfter reading about\
    \ loops and arrays, you might have noticed the possible potential to combine them\
    \ to get greater use and production out of your program. Loops allow us to very\
    \ quickly assign or retrieve values for large ranges, while arrays allow us to\
    \ create really large ranges of numbers. How convenient would it be to combine\
    \ the two of them? Below are a few examples of each type of loop, how to quickly\
    \ loop through an array, and how to easily edit a multidimensional array.\n\n\
    ### Example 1:\n\n```java\nint intArray[] = new int[100];\nint x = 0;\nwhile (x\
    \ < 100) {\n    intArray[x] = x;\n    System.out.println(intArray[x]);\n    x++;\n\
    }\n```\n\nIn this example, we simply declare an array with one hundred index values.\
    \ Then we declare an `int` that we need to increment. We tell the `while` loop\
    \ to continue looping while `x` is less than the length of `intArray` (which is\
    \ the number of indices it has); then we increment `x` by one after each iteration.\
    \ This code quickly and easily edits one hundred different values and prints them\
    \ to console. All of that in just seven easy lines!\n\n### Example 2:\n\n```java\n\
    int intArray[] = new int[100];\nint x = 0;\ndo {\n    intArray[x] = x;\n    System.out.println(intArray[x]);\n\
    \    x++;\n} while(x < 100);\n```\n\nThis example is just like the first example,\
    \ except we applied the same concept to a `do while` instead of a `while`. The\
    \ output is exactly the same; however, you should be wary of `do while` loops\
    \ because they always run at least once.\n\n### Example 3:\n\n```java\nint intArray[]\
    \ = new int[100];\nfor (int x = 0; x < 100; x++) {\n    intArray[x] = x;\n   \
    \ System.out.println(x);\n}\n```\n\nThis method is probably my favorite way to\
    \ do it. The advantage of this is that the counter variable is built inside the\
    \ loop, so you don’t need to declare another variable or manually increment it.\
    \ In my opinion, it is just a lot more convenient and organized.\n\n### Example\
    \ 4:\n\n```java\nint[][] intArray = new int[100][100];\nfor(int x = 0; x < 100;\
    \ x ++){\n    for(int y = 0; y < 100; y++){\n        intArray[x][y] = y;\n   \
    \     System.out.println(intArray[x][y]);\n    }\n}\n```\n\nThis example demonstrates\
    \ the most practical way to loop through a multidimensional array. It may look\
    \ intimidating, but it is actually quite simple. We have two `for` loops inside\
    \ of each other; each of them will loop through a specific dimension of the array.\
    \ For this example, the first time it loops, it will start with `x = 0`. It will\
    \ then loop through every single array index where the first index is zero. Once\
    \ all indexes of `[0][y]` get called, it increments `x` by one. It will then repeat\
    \ the process until every single index has been called.\n\n## Assignment\n\nLoops\
    \ are very useful for editing a large number of values. One thing that can be\
    \ greatly simplified thanks to loops is image editing. An image can consist of\
    \ hundreds, maybe even thousands of pixels, each with its own color value. With\
    \ the power of loops, we can quickly edit those color values. For this assignment,\
