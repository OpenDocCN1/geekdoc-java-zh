    String text = \"Hello\";\nString text2 = \"World\";\nSystem.out.println(text.concat(\"\
    \ fun \").concat(text2));\n```\n\n### String Methods in Action\n\n#### charAt(int\
    \ index)\nThe `charAt()` method returns the character at the specified index.\n\
    \n```java\nString text = \"Hello World!\";\nchar letter = text.charAt(0); // letter\
