    \n# 第 9 章\n\n# 循环与数组\n\n## 循环\n\n在编程时，你可能会遇到需要循环大量数字的情况。如果我们使用目前所学的内容来循环一百个数字，我们需要一百个“if”语句。我认为你同意那样会变得非常混乱且令人沮丧。幸运的是，Java\
    \ 支持三种类型的循环，它们循环的方式略有不同。以下是对每种循环的简要解释。\n\n### While 循环\n\nwhile 循环是一种控制结构，允许你按照程序设置的次数重复任务。while\
    \ 循环的语法如下：\n\n```java\nwhile (expression) {\n    // 插入代码\n}\n```\n\n它的工作方式与 `if`\
    \ 语句类似，但只要 `expression` 为真，while 循环内的代码就会一直运行，直到表达式变为假（如果发生变化的话）。\n\n示例：\n\n```java\n\
    int x = 10;\nwhile (x > 0) {\n    System. out .println(x);\n    x--;\n}\n```\n\
    \n前面的代码将打印 `x` 的值，然后不断将其减 1，直到 `x` 的值不再大于零。如果你运行这段代码，你将得到从一到十每个数字的输出。一旦 `x` 的值达到零，它不再允许表达式返回真，此时\
    \ while 循环结束。注意，你应该警惕死循环。死循环是你代码中的错误，会导致循环永远不会结束，本质上使程序冻结。当你的逻辑中存在错误导致语句永远不会变为假时就会发生这种情况。\n\
    \n### Do While 循环\n\ndo while 循环的工作方式与 while 循环非常相似，但有一个主要区别：“do”——即在 while 语句为真时发生的操作——是在询问条件之前执行的。这意味着\
    \ do while 循环至少运行一次，因为它在检查条件之前执行了任务。第二次循环的执行完全取决于条件。\n\n示例：\n\n```java\nint x\
    \ = 10;\ndo {\n    System. out .println(x);\n    x--;\n}\nwhile(x > 0);\n```\n\
    \n在这个示例中，while 循环的最后逻辑直接转移到了 do while 循环中。正如你所看到的，唯一的区别是语句为真时运行的逻辑在 while 循环的上方而不是下方。对于这个特定的示例，代码的输出完全相同。但是，如果我们将代码改为如下：\n\
    \n```java\nint x = 0;\ndo {\n    System. out .println(x);\n    x--;\n}\nwhile(x\
    \ > 0);\n```\n\n输出将与 while 循环不同。如果这是一个 while 循环，循环内的代码将永远不会运行。然而在 do while 循环中，do\
    \ 发生在 while 之前，所以代码将至少运行一次。在第一次运行期间，在代码块被处理之前，它技术上从未被检查是否为真语句。这在特定情况下很有帮助，但它的使用不像普通的\
    \ while 循环那样频繁。\n\n### For 循环\n\nfor 循环允许你轻松地循环或递增特定范围的值。for 循环的语法如下：\n\n```java\n\
    for (initialization; termination; increment) {\n    // 语句\n}\n```\n\n- **初始化**：初始化计数器变量。\n\
    - **终止**：规定要判断为真的表达式。\n- **递增**：递增初始化的计数器变量。\n\n示例：\n\n```java\nfor (int x = 0;\
    \ x < 10; x++) {\n    System. out .println(x);\n}\n```\n\n在这个示例中，我们从初始化 for 循环开始。创建一个\
    \ `x` 的新 `int` 变量并将其设置为零。然后我们规定何时终止。我们只要 `x` 小于十，循环就会继续。然后我们设置递增使 `x` 的值增加一。初始化在循环开始时发生。\n\
    \n## 数组\n\n数组是存储相同类型数量变量的数据结构。与其为存储一百个不同值创建一百个不同的变量，你可以创建一个包含一百个值的整数数组。这使得管理整数变得容易得多，同时也让代码更加组织化简单。\n\
    \n### 声明数组\n\n声明数组与声明普通变量相似。语法如下：\n\n`dataType arrayName[]`\n\n上面的数组目前没有任何数据。我们声明了数组，但没有声明它的大小，也没有声明每个索引的值：\n\
