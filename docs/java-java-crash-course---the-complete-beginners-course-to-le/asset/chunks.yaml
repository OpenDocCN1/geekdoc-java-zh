    ## Data Types


    As said above, variables are used to store data. Java has multiple built-in data
    types that are used to store predefined types of data. These data types are called
    primitive data types, and are the most basic data types in the Java programming
    language. You can also create your own data types, which we will go over later.
    Java has eight primitive data types.


    ### Byte


    The `byte` data type is an 8-bit signed two’s complement integer. It has a default
    value of zero when it is declared, a maximum value of 127, and a minimum value
    of -128. A `byte` is useful when you want to save memory space, especially in
    large arrays.


    Example:


    ```java

    byte b = 1; // has a value of one

    ```


    ### Short


    The `short` data type is a 16-bit signed two’s complement integer. Its maximum
    range is 32,767 and its minimum value is -32,768. A `short` is used to save memory
    or to clarify your code.


    Example:


    ```java

    short s = 1; // has a value of one

    ```


    ### Int


    The `int` data type is a 32-bit signed two’s complement integer. Its maximum value
    is 2,147,483,647 (2^31-1) and its minimum value is -2,147,483,648 (-2^31). `int`
    is the most commonly used data type for integral numbers, unless memory is a concern.


    Example:


    ```java

    int i = 1; // has a value of one

    ```


    ### Long


    The `long` data type is a 64-bit signed two’s complement integer. Its maximum
    value is 9,223,372,036,854,775,807 (2^63-1) and its minimum value is -9,223,372,036,854,775,808
    (-2^63). This data type is used when a larger number is required than would be
    possible with an `int`.


    Example:


    ```java

    long l = 1; // has a value of one

    ```


    ### Float


    The floating point data type is a double-precision 64-bit IEEE 754 floating point.
    The min and max range is too large to discuss here. A `float` is never used when
    precision is necessary, such as when dealing with currency.


    Example:


    ```java

    float f = 1200.5f; //value of one thousand two hundred, and a half

    ```


    ### Double


    The `double` point data type is a double-precision 64-bit IEEE 754 floating point.
    It is often the data type of choice for decimal numbers. The min and max range
    is too large to discuss here. A `float` is never used when precision is necessary,
    such as when dealing with currency.


    Example:


    ```java

    double d = 1200.5d; // value of one thousand two hundred, and a half

    ```


    ### Boolean


    The `boolean` data type represents one bit of data. It can contain two values:
    true or false. It is used for simple flags to track true or false conditions.


    Example:


    ```java

    boolean b = true; // has a value of true

    ```


    ### Char


    The `char` data type is a single 16-bit Unicode character. Its minimum value is
    `\u0000` (or 0) and its maximum value is `\uffff` (or 65,535 inclusive)


    Example:


    ```java

    char c = ''w''; // returns the letter "w"

    ```


    ### String


    Another commonly used data type is called `String`. `String` is not a primitive
    data type, but it is a very commonly used data type that stores collection of
    characters or text.


    Example:


    ```java

    String cat = "meow"; // sets value of cat to "meow"

    ```


    This example gets a `String` named `cat` and sets it to the string of characters
    that spell out “meow.”


    ## Declaring a Variable


    The declaration of a variable has three parts: the data type, variable name, and
    the stored value. Note that there is a specific convention and set of rules that
    are used when naming variables. A variable name can be any length of Unicode letters
    and numbers, but it must start with a letter, the dollar sign `$` or an underscore
    `_`, or else it will return a syntax error. It is also common naming convention
    to start the name with a lowercase letter, followed by each subsequent word starting
    with a capital letter. For example, in the variable named `theName`, the first
    word `the` starts with a lowercase letter, and each following word, in this case
    `Name`, starts with a capital letter.


    Example:


    ```java

    int theName = 123; // value of 123

    ```


    In the example above, the data type is `int` and the name of the variable is `theName`.
    The value stored inside that variable is 123. You can also declare a variable
    without storing a value in it.


    Example:


    ```java

    int name; // no value

    ```


    You can do this if you choose to declare it later.


    ## Using a Variable


    After a variable is declared, then you can read its value or change it. After
    the variable has been initially declared, you can only reference it by its name;
    you only need to declare its data type when you are declaring the variable.


    Example:


    ```java

    name = 2; // sets the int "name" to a value of 2

    ```


    The example above sets the value of `name` to 2. Notice how I never restated the
    data type.


    Example:


    ```java

    System.out.println(name); // prints the value of name to the console

    ```


    This example reads the value of `name` and writes it to the console.


    Variables can also be added together for example.


    Example:


    ```java

    int a; // no value

    int b = 1; // value of one

    int c = 2; // value of two

    a = b + c; // sets a to the value of b + c

    ```


    In the example above, we set the value of `a` to equal the value of `b` and `c`
    added together. The addition sign is known as an operator, which we are going
    to learn about in the following section. It is also possible to a certain extent
    to combine values of variables that are different data types.


    Example:


    ```java

    int a; // no value

    float b = 1; // value of one

    int c = 2; // value of two

    a = (int) (b + c); // sets the int "name" to a value of b + c

    ```


    This example is just like the one before, except we have changed the data type
    of `b` from `int` to `float`.

