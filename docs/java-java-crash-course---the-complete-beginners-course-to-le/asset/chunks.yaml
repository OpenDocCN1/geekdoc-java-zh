    # Chapter 4


    # Variables


    ## What is a Variable?


    A variable is essentially a storage unit that holds a certain type of data. It
    is named by the programmer and used to identify the data it stores. A variable
    can usually be accessed or changed at any time. You can write information to it,
    take information from it, and even copy the information to store in another variable.


    ## Variable Types


    In Java, a variable has a specific type that determines what size it is and the
    layout of its memory. The Java language defines three types of variables.


    ### Instance Variables


    Instance variables are declared within a class but accessed outside of any method,
    constructor, or block. Instance variables are created with the keyword “new” and
    are destroyed when the object is destroyed. An instance variable is visible to
    all methods, constructors, and blocks within the class where it is declared. By
    giving a variable the keyword “public,” it can be accessed by subclasses within
    the class. However, it is recommended to set a variable’s access modifier to “private”
    when possible. All instance variables have a default value, unlike local variables,
    which do not have default values.


    Example:


    public class Test


    {


    public int num; // integer named num


    public void dog()


    {


    num = 3;


    }


    }


    In this example, we declare the integer “num” outside of any method, and can easily
    access it within any method that is inside of the class “Test.”


    ### Class/Static Variables


    Static variables are declared outside of any method, constructor, or block, and
    are declared with the keyword “static.” If a variable is static, only one instance
    of that variable will exist, regardless of how many instances of the object are
    called. Static variables are rarely used except for constant values, which are
    variables that never change.


    Example:


    public class Test


    {


    public static final int num = 3; // integer named num


    public void dog()


    {


    System. out .println( num );


    }


    }


    In this example, we declare an int called “ num ” and it set to be public, static,
    and final. This means that it can be accessed from within subclasses, only one
    instance of it can ever exist, and the value can never be changed.


    ### Local Variables


    Local variables are only declared within methods, blocks, or constructors. They
    are only created when the method, block, or constructor is created, and then they
    are destroyed as soon as the method ends. You can only access local variables
    within the method, block, or constructor where it is called; they are not visible
    outside of where they are called. Local variables do not have a default value.


    Example:


    public void cat(){ // method named cat'
