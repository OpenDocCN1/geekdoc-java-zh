    They are similar in definition to classes and interfaces, except they use the
    enum keyword instead. They can have constructors and variables. Enums cannot be
    instantiated or be children (but they can implement interfaces). Be careful when
    accessing variables within an enum, because if you modify an enum’s variables,
    all instances of that enum will be modified. To fill an enum, you need a list
    of all pre-sets. This list must be at the top of your enum block. If your enum
    does not have a constructor, you may simply write out the possible values as if
    they were variable names. The rest you would separate by commas and end with a
    semicolon. If your enum does have a constructor, you must write the variable name,
    then the parameters of the constructor (meaning the values) separated by commas,
    and end with a semicolon. After the semicolon, you may go on to write your variable
    declarations, constructor(s), and any methods you wish. The constructor(s) cannot
    be public, only protected or private.


    enum Number


    {


                  One , Two , Three


    }


    enum Color


    {


    Red (255, 0, 0),


    Green (0, 255, 0),


    Blue (0, 0, 255),


    Purple (255, 0, 255),


    Yellow (255, 255, 0),


    Cyan (0, 255, 255);


    public int r;


    public int g;


    public int b;


    Color(int redChannel, int greenChannel, int blueChannel)


    {


    r = redChannel;


    g = greenChannel;


    b = blueChannel;


    }


    public static void main(String[] args)


    {


    Number num = Number. Two ;


    Color red1 = Color. Red ;


    Color red2 = Color. Red ;


    red1.g = 255;


    System. out .println(red2.g); // “255”, red2 was modified because both red1 and
    red2 are the same object. That object is stored in both variables, and so is affected
    by changes in either object.


    }


