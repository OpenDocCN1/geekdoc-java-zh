  raw: 'In this section, we will learn about layout managers and how to setup Swing
    components in the window to your satisfaction. There are many different types
    of layout managers in Java. The default layout is the FlowLayout, which we have
    been using. For the other layouts, you must specify the type of layout you want
    to use. If you do not specify a specific layout, then the FlowLayout will be used
    by default. This guide is going to get too long if we go over all the layouts
    individually, so instead we’ll briefly show you some visuals of the different
    types of layouts so you can decide which ones you’d like to explore. Before we
    go over the list of layouts, let’s go over how you can set one up. There are different
    ways to set up your layout depending on which type you choose, but there is one
    constant line you must always remember:


    panel.setLayout(new GridLayout(10, 1));


    In the line above, we have used the setLayout method, which will take a specific
    Layout object. For example purposes, we will input a Grid Layout into the layout
    parameter. This is how we can set a layout for different types of panels or frames
    within Swing.


    Now let’s go over all the different types of layouts:


    ### BorderLayout


    ![https://lh3.googleusercontent.com/LTx7txGpuysBnDDsTQytrSppINRLMD0c2xBgm45DMlRGv22tVMzuE00pEDAm1NYtClE8HdfoCBtra8V9C9b0QFWmnUY3Q7jlqEinsaN5i7P8gAjWk-6p95DHxxmLSDep9UmAQro](Image00020.jpg)


    The BorderLayout gives you the option to place components at the top, bottom,
    left, right, and center of the panel.


    ### BoxLayout


    ![https://lh4.googleusercontent.com/ZkQ2PlFYCtVkhh9FiI3qq_-fYCRX7XiVZeIk91FoHKpNe9GyEy8x-RUnaWP6jw8-Vesx6bJ57xgCfhBPKMFLk4ViJfzZU7UgE4htJ0pGdOjFrwrJR4EOm8xUG17Gjv4QdcYEOBc](Image00021.jpg)


    The BoxLayout allows you to put components in a single row or column and allows
    the user to easily specify any custom maximum size. On top of that, it also allows
    you to align the components according to your needs.


    ### CardLayout


    ![https://lh5.googleusercontent.com/6xQLfwRErxIKOWmqZjc0Hh5JiyDQ-nie7lYeyxkAmOdgv7stZs0-hSsBFFVgyCcjE_o88YC3W6iaFhO0iyPaju6fUga_--hsw9nwhgLNiGcAUUY3vYbklZaqDLBqjUY2toNLO8E](Image00022.jpg)


    ![https://lh6.googleusercontent.com/BwSgX50XcVIaaFsinsm6PXA7Zb88vJtSE5qZ_OqTA0zaR1CZAC0i8e96sEfo8kPeM1C2MfLTHFgPrfEiIch_LqopKzs-ZSZ3WMJV-k72auwlg3CUhECVGYywIEAXFDiUYY0rLoo](Image00023.jpg)


    The CardLayout allows you to implement an area that contains different components
    at different times.


    ### FlowLayout


    ![https://lh5.googleusercontent.com/g20IhW_SBqTBSuE-Zi9hCU9N8tBu-9BxNoASul_m6XRjQhDIdCfBYdiIx_k2SbeOzbR8KEhAFJvwA_WptyxqzB1CqsSuGqzrto05VRQNsPJIfdRsigEfkx7uswPgoUiWyF1eA1M](Image00024.jpg)


    The FlowLayout is the default layout manager and does not need to be specified
    for use. All it does is lay out components in a single row and start a new row
    depending on the width of the window.


    ### GridBagLayout


    ![https://lh6.googleusercontent.com/vWYIgQefbmJelIBiVE4DgF3ElW8q3ch5Ssn7iCeZA3xG7edRFpugspMoppaFP8UDxqNrADeoH076YBOk5Eg7xr3yc9kkSh2vjDPvLq7HmRtGMAbVtldJQ1Dmz1ZYRniSzM2KUVU](Image00025.jpg)


    The GridBagLayout is the most flexible layout manager of all; it allows you to
    easily align and place components within a grid of cells.


    ### GridLayout


    ![https://lh5.googleusercontent.com/bFhhaheNQhxQluWNkQ_WdrrfGl7yYN03uhbigpGt0uuq--m0mqOdNAMGx4THVZTRbnUlLZntNzY-HKYeuQyB71l3ehjKJQ83G26GV7mStVW0DNpG_EtLjYlnsWZBQP6QK5UVKC8](Image00026.jpg)


    The GridLayout makes all components equal in size so they can be displayed sequentially
    within a grid, depending on the order of how the elements are being added—sort
    of like a FlowLayout except organized into rows and cells that you have specified.


    ### GroupLayout


    ![https://lh4.googleusercontent.com/RO-yzJ9SzluNhXy2SYR7MN5pca_PDA5-4bDmx1jwkh71lXnR3RRlGsReykqRf2LVPPSAQQwhSCO9PCEpP-Imk3_pXphkL88shjV26mi_XVNS50k519LpUfrYDoVl1EUX7N0IJTA](Image00027.jpg)


    The GroupLayout allows you to work with separate horizontal and vertical layouts
    that are independently defined for each dimension.


    ### SpringLayout


    ![https://lh4.googleusercontent.com/vpzh-P7ENTFLP8vEgFti0PtgZjh_trI2QAyopvAyvmTN2qvDTq8TR2spu7AFFy_g0QxNo8F_FczvXqe0ah4y68tMY0x6O7LutGy--O1gq4_AzOtPnK4Em1vqcrYZLElFv6czywQ](Image00028.jpg)


    ![https://lh4.googleusercontent.com/Yot_m-Xuw1ai5da9EFzcqbEtHO8Tn6ywk9Fc7Pv4aKld02I_czL_IZM78EqLyJaocxTedhr0Zu6Ao3957cqOeYu6Z8FTNiWyTbBJjianqJ5g5kkbTMRRLVEHCCwK73eHUhdc7jA](Image00029.jpg)


    The SpringLayout is another flexible layout manager that allows you to specify
    the distance of elements from other elements, such as defining the left edge of
    a component relative to another component’s right edge.


    # Chapter 18


    # Event Handling


    The idea of Event Handling is that GUI elements will interact with each other
    depending on what they are asked to do in certain situations. In this part, we
    will look at handling the event of a user clicking a button in a Java UI. In order
    to set up a button, as with the JButton component, we add an ActionListener. A
    “Listener” is simply a function within a GUI element that will wait (or “Listen”)
    for something before reacting accordingly. When adding an action listener to a
    GUI component, it must reference a class that implements the ActionListener interface.
    Once the interface has been implemented, you will have to implement the methods
    part of that interface accordingly. Using all of our knowledge about GUIs, we
    are able to create a basic calculator using some Event Handling to listen for
    a mouse click on a JButton.


    public class ThisIsAClass {


    public static void main (String[] args) {


    GUI g = new GUI();


    }


    }


    import javax.swing.*;


    import java.awt.*;


    import java.awt.event.*;


    public class GUI extends JFrame implements ActionListener{


    JPanel mainPanel;


    JLabel lblfNum;


    JLabel lblsNum;


    JLabel lblResult;


    JButton btnAdd;


    JButton btnSubtract;


    JButton btnMultiply;


    JButton btnDivide;


    JTextField txt_fNum;


    JTextField txt_sNum;


    public GUI() {


    setDefaultCloseOperation( EXIT_ON_CLOSE );


    setSize(300, 300);


    setTitle("Basic Calculator");


    setVisible(true);


    Initialize();


    }


    private void Initialize() {


    mainPanel = new JPanel();


    mainPanel.setLayout(new GridLayout(10, 1));


    lblfNum = new JLabel("First Number", JLabel. CENTER );


    lblsNum = new JLabel("Second Number", JLabel. CENTER );


    lblResult = new JLabel("---", JLabel. CENTER );


    txt_fNum = new JTextField();


    txt_sNum = new JTextField();


    btnAdd = new JButton("Add");


    btnSubtract = new JButton("Subtract");


    btnMultiply = new JButton("Multiply");


    btnDivide = new JButton("Divide");


    SetListeners();


    mainPanel.add(lblfNum);


    mainPanel.add(txt_fNum);


    mainPanel.add(lblsNum);


    mainPanel.add(txt_sNum);


    mainPanel.add(btnAdd);


    mainPanel.add(btnSubtract);


    mainPanel.add(btnMultiply);


    mainPanel.add(btnDivide);


    mainPanel.add(lblResult);


    add(mainPanel);


    revalidate();


    }


    private void SetListeners() {


    btnAdd.addActionListener(this);


    btnSubtract.addActionListener(this);


    btnMultiply.addActionListener(this);


    btnDivide.addActionListener(this);


    }


    public void actionPerformed(ActionEvent e) {


    String btnName = e.getActionCommand();


    try{


    int fNum = Integer. parseInt (txt_fNum.getText().trim());


    int sNum = Integer. parseInt (txt_sNum.getText().trim());


    if (btnName.equals("Add")) {


    int result = fNum + sNum;


    lblResult.setText(result + "");


    }


    else if (btnName.equals("Subtract")) {


    int result = fNum - sNum;


    lblResult.setText(result + "");


    }


    else if (btnName.equals("Multiply")) {


    int result = fNum * sNum;


    lblResult.setText(result + "");


    }


    else if (btnName.equals("Divide")) {


    int result = fNum / sNum;


    lblResult.setText(result + "");


    }


    }catch(Exception exc) {


    lblResult.setText("Invalid input!");


    }


    }


    }


