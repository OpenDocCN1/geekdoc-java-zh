  raw: 'Throughout this guide, you have been programming and expecting output from
    a console. The time has come to learn how to develop your own interface. In this
    part of the guide, you will learn Java Swing and Applet Programming. There are
    many different ways to develop an interface in Java, but we are going to be using
    the “Swing and Applet” method.


    ## Applet


    First we will explore Applet Programming. This is also one way to develop a user
    interface. Applet is a kind of container where we can place our components to
    create our user interface. Applet class is defined under the java.applet.* package
    and all other components and event handling classes are defined under the java.awt.*
    and java.awt.event.*; packages. In this part, we are going to learn how to develop
    a user interface with the help of Applet and AWT components. Applet is used to
    create an interactive dynamic program that is run in Applet Viewer or any browser.
    There are, however, some restrictions: Applet applications are easily affected
    by viruses and we cannot use file systems such as read and write.


    ## Structure of Applet Program


    import java.applet.*;


    import java.awt.*;


    public class SampleApplet extends Applet


    {


    public void init()


    {}


    public void start()


    {}


    public void paint(Graphics g)


    {}


    public void stop()


    {}


    public void destroy()


    {}


    }


    In above sample program, you can see five methods that are involved in the life
    cycle of the applet. You don’t need to call those methods, because all methods
    are called automatically. You can only call paint() method by yourself to update
    the applet window, but you have to use repaint() method to call paint() method.


    All applet programs require an applet tag because it is important to define the
    appearance of the applet window. The following syntax will help you to understand
    the applet tag and its attributes.


    ### Applet Tag


    /*<applet


    code=”Applet class file name”


    codebase=”path of the applet class file”


    width=”width of the applet window in pixels”


    height=”height of the applet window in pixels”


    vspace=”vertical space”


    hspace=”horizontal space”


    >


    </applet>*/


    In this applet tag code, width and height are the conditional attributes, so you
    have to mention them. The remaining three (vspace, hspace, codebase) are optional.


    ### Parameter Tag


    Param tag helps us to pass some parameter data to the applet program. This tag
    has two attributes: Name and Value. Name contains the name of the parameter and
    value holds the data.


    <param name=”name of the parameter name” value=”data”></param>


    Sample Program


    import java.applet.*;


    import java.awt.*;


    public class ParamTag extends Applet


    {


    int a,b;


    String a1;


    public void init()


    {


    a=Integer.parseInt(getParameter(“Data1”));


    b=Integer.parseInt(getParameter(“Data2”));


    a1=”Sum is: ”+(a+b);


    }


    public void paint(Graphics g)


    {


    g.drawString(a1,200,100);


    }


    }


    /*<applet code=”ParamTag” width=”200” height=”200”>


    <param name=”Data1” value=”15”></param>


    <param name=”Data2” value=”25”></param>


    </applet>*/


    In this example program, we have created two param tags named Data1 and Data2
    with values of 15 and 25 respectively. Then we are getting those data with the
    help of the getParameter() method. This will always return the data in String
    format, so we have to convert those data to integer data. Then we add those data
    and store them in string variable in order to print that data to the applet window.


    ![](Image00006.jpg)


    ## Classes in Applet Programming


    *   Graphics class


    *   Font class


    *   Color class


    *   Image class


    *   Graphics Class


    This class contains methods for drawing strings, lines, rectangles, and other
    shapes defined in the graphics class.


    ### Graphics Class


    *   Drawing Characters, Bytes, and Strings


    “g,” “r,” “a,” “p,” “h,” “i,” “c,” “s”—Characters


    100, 101, 108, 114, 67, 47—Bytes


    “World”—String


    void drawBytes (byte[] data , int offset , int length , int x , int y)


    This method is used to draw byte data to the Applet window.


    data -> the data to be drawn


    offset-> the start offset in the data


    length-> the number of bytes that are drawn


    x-> x coordinate


    y-> y coordinate


    void drawChars(char[] data , int offset , int length ,int x , int y)


    This method is used to draw character data into the applet window.


    abstract void drawString(String str,int x,int y)


    This method is used to draw string data into the applet window.


    *   Shape Drawing Methods


    We have plenty of methods to draw different types of shapes like rectangles, circles,
    arcs, and so on.


    | Method name | Parameters | Usage of methods |


    | drawLine(int x1,int y1,int x2,int y2) | x1, y1: starting pointx2, y2: ending
    point | This method helps us to draw a line shape to the applet window. |


    | drawRect(int x1,int y1,int width,int height) | x1, y1: starting pointwidth:
    width of the rectangleheight: height of the rectangle | This method helps us to
    draw a rectangle shape to the applet window. |


    | fillRect(int x1,int y1,int width,int height) | x1, y1: starting pointwidth:
    width of the rectangleheight: height of the rectangle | This method helps us to
    draw a rectangle shape to the applet window with its interior region filled with
    the same color as the outline. |


    | drawRoundRect(int x1,int y1,int width,int height,int angle1,int angle2) | x1,
    y1: starting pointwidth: width of the rectangleheight: height of the rectanglewidth1:
    width1 of the angle cornersheight1: height1 of the angle corners | This method
    helps us to draw a rounded rectangle shape to the applet window. |


    | fillRoundRect(int x1,int y1,int width,int height,int angle1,int angle2) | x1,
    y1: starting pointwidth: width of the rectangleheight: height of the rectanglewidth1:
    width1 of the angle cornersheight1: height1 of the angle corners | This method
    helps us to draw rounded rectangle shape to the applet window with its interior
    region filled with the same color as the outline. |


    | drawPolygon(int xs[],int ys[],int pts) | xs: an array of integers representing
    x coordinatesys: an array of integers representing y coordinatespts: an integer
    representing the total number of points | This method helps us to draw a polygon
    shape to the applet window. |


    | fillPolygon(int xs[],int ys[],int pts) | xs: an array of integers representing
    x coordinatesys: an array of integers representing y coordinatespts: an integer
    representing the total number of points | This method helps us to draw a polygon
    shape to the applet window with its interior region filled with the same color
    as the outline. |


    | drawOval(int x1,int y1,int widht,int height) | x1, y1: starting point of the
    ovalwidth, height: width and height of the oval | This method helps us to draw
    an oval shape to the applet window. |


    | fillOval(int x1,int y1,int widht,int height) | x1, y1: starting point of the
    ovalwidth, height: width and height of the oval | This method helps us to draw
    oval shape to the applet window with its interior region filled with the same
    color as the outline. |


    | drawArc(int x1,int y1,int width,int height,angle1,angle2) | angle1: degree value
    at which the arc startsangle2: degree value at which the arc ends | This method
    helps us to draw an arc shape to the applet window. |


    | fillArc(int x1,int y1,int width,int height,angle1,angle2) | angle1: degree value
    at which the arc startsangle2: degree value at which the arc ends | This method
    helps us to draw an arc shape to the applet window with its interior region filled
    with the same color as the outline. |


    Sample Program


    import java.applet.*;


    import java.awt.*;


    //<applet code=”SampleShapes” width=”300” height=”300”></applet>


    public class SampleShapes extends Applet


    {


    public void paint(Graphics g)


    {


    g.drawLine(40,30,200,30);


    g.drawRect(40,60,70,40);


    g.fillRect(140,60,70,40);


    g.drawRoundRect(240,60,70,40,10,20);


    g.fillRoundRect(40,120,70,40,10,20);


    g.drawOval(240,120,70,40);


    g.fillOval(40,180,70,40);


    g.drawArc(140,180,70,40,0,180);


    g.fillArc(240,180,70,40,0,-180);


    }


    }


