    \ `2` 的第二个变量赋值给这两个数字之和。\n\n现在，如果你仔细阅读这段话，你就会理解我们只是在按照我刚刚指定的精确算法在斐波那契数列中循环运行。现在，你可以尝试一下了！\n\
