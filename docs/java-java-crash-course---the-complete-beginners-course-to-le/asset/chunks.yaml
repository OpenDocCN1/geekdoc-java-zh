    # Chapter 12


    # Interfaces and Abstract Classes in Java


    There are also some special types of classes, specifically, interfaces and abstract
    classes.


    Abstract classes are classes that cannot be instantiated—you cannot make an object
    of an abstract class. You can, however, make objects of children of the abstract
    class. This is useful when you want a group of classes to have a common set of
    variables or methods, but do not want to have an unspecified object. Abstract
    classes require the use of upcasting and downcasting. Abstract classes are defined
    by the abstract keyword before the class keyword. On top of this, abstract classes
    can contain abstract methods. This means that you can call a method in an abstract
    type and it will run the method of the child class. Abstract methods must always
    be contained inside abstract classes, and are defined by placing the abstract
    keyword before the return type of the method. Abstract methods also do not have
    a body; they simply end in a semicolon after their parameters. When a child inherits
    from the parent abstract class, it must override or define abstract methods. Abstract
    classes can also contain normal methods in order to add common functionality,
    as in normal classes.


    abstract class Food


    {


    public abstract void saySomething();


    public static void main (String args[])


    {


    Food a = new Fruit();


    Food b = new Meat();


    a.saySomething();//”This fruit is delicious!”


    b.saySomething();//”This meat is delicious!”


    }


    }


    class Fruit extends Food


    {


    public void saySomething()


    {


    System.out.println(“This fruit is delicious!”);


    }


    }


    class Meat extends Food


    {


    public void saySomething()


    {


    System.out.println(“This meat is delicious!”);


    }


    }


    Interfaces are similar to abstract classes in that they can provide methods that
    must be overridden and they cannot be objects. Interfaces cannot have variables
    in them. Interfaces cannot be “extended” to, but are instead “implemented” to.
    The difference is that while extending can only be done onto one class—meaning
    you can only have one parent—implementing can be done onto several interfaces,
    not classes. Interfaces are used when you need a number of unrelated classes to
    share common methods. To create an interface, simply create a class, but replace
    the class keyword with the interface keyword. Inside, you may only have method
    declarations—the return type, method name, and parameters—followed by a semicolon.
    This is similar to abstract methods, except you do not use the abstract keyword.
    To implement, simply put the implements keyword after either the class name or
    (if there is a parent class) after the parent class name.


    interface Eatable


    {


    public void eatObject();


    public static void main(String[] args)


    {


    Food fruit = new Fruit();


    Eatable stapler = new Stapler();


    fruit.eatObject(); // “Mmmm...juicy”


    stapler.eatObject(); // How do you think eating a stapler will end?


    }


    }


    abstract class Food implements Eatable{}


    class Fruit extends Food


    {


    public void eatObject()


    {


    System.out.println(“Mmmmm...juicy”);


    }


    }


    class Stapler implements Eatable


    {


    public void eatObject()


    {


    System.out.println(“AAAAHHHH! THIS WAS A TERRIBLE IDEA! CALL AN AMBULANCE! WHY
    DID I EAT A STAPLER?”);


    }


    }


    Notice that since the Food class is abstract, you do not need to override Eatable’s
    method, unless you want all foods to have a default action for this method. Be
    aware that since Food implements Eatable, you can call the eatObject method from
    the type Food and it will run the Fruit eatObject (in this case).


    # Chapter 13


    # Packages


    Packages are essentially ways to organize your code, specifically for use in other
    projects. When you import things, you are using packages. java.util is a package,
    just as java.io is a package. When you type the asterisk (*) after, you say to
    import all the files in that package. To create a package, it is best to create
    one in your IDE of choice, as it will automatically setup everything for you.
    To define which package a class is in (which the package it is physically in must
    match), type package before the class you are defining and then the package path.
    As said before, having your IDE deal with this reduces headaches. Technically,
    packages are not required, but using packages for your code is good practice and
    helps to reduce clutter for you or other programmers in the future. Some programmers
    even use packages to separate different parts of their code for themselves.


    ## Types of Packages


    There are two types of packages available in Java programming:


    *   Pre-Defined Packages


    *   User-Defined Packages


    ### Pre-Defined Packages


    Pre-defined packages are already defined; they contain collections of pre-defined
    classes that help us to develop well-structured applications. There are several
    pre-defined packages in Java. In the following section, you will notice some pre-defined
    packages and their classes.


