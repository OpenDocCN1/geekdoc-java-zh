    \    Food a = new Fruit();\n        Food b = new Meat();\n        a.saySomething();\
    \ // ”This fruit is delicious!”\n        b.saySomething(); // ”This meat is delicious!”\n\
    \    }\n}\n\nclass Fruit extends Food\n{\n    public void saySomething()\n   \
