    # Chapter 6


    # User Input: Getting Data in Runtime


    The Scanner object in Java will allow us to input information to the Console so
    the program will be able to process and use it. We have some other classes to
    read the data at runtime.


    How it works:


    Input → Process → Output


    To explain how the Scanner object works, we’ll look at a real life application:
    a calculator that takes in two values through the use of the console.


    The first thing you want to do is import the object with the following line:


    import java.util.Scanner;


    The next line you have to code, assuming your class and main method are already
    set, will declare the Scanner object by doing the following:


    Scanner scan = new Scanner(System. in );


    You will learn what the “new” keyword means in the section on Inheritance and
    Polymorphism, but for now, just know that this is a conventional means of declaring
    a Scanner object. Now you must decide what you would like the user to input. A
    string? An integer? In our situation, we want the user to input an integer for
    this calculator to add two integers together.


    The Scanner object has different properties and methods (you will learn what these
    are in the sections on methods and inheritance/polymorphism). The method we’re
    looking for is scan.NextInt(), which is a method that waits for a value from the
    user. In order to create a variable that receives the value of whatever the user
    types in, you must type the following (variable names are optional):


    int firstNumber = scan.NextInt();


    int secondNumber = scan.NextInt();


    int sum = firstNumber + secondNumber;


    System.out.println(sum);


    So what exactly does this program do?


    It declares two integers that both wait for user input. First, it waits for the
    input of the first number, i.e., for the user to press enter after typing a number.
    Then it waits for the second number to be inputted. Finally, the sum variable
    adds the two variables that contain values given by the user and outputs it to
    the console. All of this takes place in the Java Eclipse/IDE console.


    Instead of the Scanner object, we can also use the BufferedReader and DataInputStream
    class methods to read different types of data at runtime. In these classes we
    have some set of methods that provide the things needed to read different types
    of data, like Integer, character, float, double, String, etc.


    The BufferedReader and DataInputStream classes are defined in the java.io package.
    If you want to use these classes, then you will have to import these packages
    to your program. After importing these packages, you can use these class methods
    wherever you want, but you will have to create an object before calling these
    methods.


    BufferedReader and DataInputStream classes contain the following methods:


    *   readInt()


    *   readLong()


    *   readFloat()


    *   readDouble()


    *   readLine()


    Creating an Object for DataInputStream and BufferedReader


    BufferedReader br=new BufferedReader (new InputStreamReader(System.in));


    String name=br.readLine (); // This will read a string data at runtime.


    int no=br.readLine (); /*This will throw an error because you can’t store string
    data in an integer variable. You will have to convert this data to integer data
    by using wrapper classes. Wrapper classes are nothing but data conversion classes
    that contain some methods to convert string data to some other equal data.*/


    Wrapper Classes:


    *   Integer


    *   Float


    *   Double


    *   Byte


    Integer.parseInt(String data)


    Will convert String data to Integer data.


    Float.parseFloat (String data)


    Will convert String data to float data.'
