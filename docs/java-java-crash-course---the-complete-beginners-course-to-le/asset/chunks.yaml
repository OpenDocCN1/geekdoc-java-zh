    *   ||


    This Operator is known as the logical OR operator. If the first operand OR the
    second operand is true, the statement will return true. This means that if the
    first operand returns false and the second is true, the statement will still return
    true, and vice versa. The statement will also return true if both the operands
    are true. Essentially, when using an OR operator, at least one operand must return
    true.


    Example:


    int a = 20;


    int b = 30;


    if (a == 20 || a == b) {


    System. out .println("a is equal to 20 or b");


    }


    else {


    System. out .println("a is not larger than b");


    }


    In this example, we check to see if “a” is equal to 20, OR if “a” is equal to
    “b.” In this case, “a” is equal to 20 and is not equal to “b.” Since only one
    of these operands needs to be true, the statement as a whole will return as true
    and the program will print “a is equal to 20 or b” in the console.


    Example 2:


    int a = 20;


    int b = 20;


    if (a == 20 || a == b) {


    System. out .println("a is equal to 20 and b ");


    }


    else {


    System. out .println("a is not equal to 20 or b ");


    }


    In this example, I have changed the value of “b” in the previous example from
    30 to 20\. This means that “a” is equal to 20 and “a” is equal to “b.” Both operands
    return true, therefore the statement returns true. This is due to the fact that
    an OR operator requires one or more of the operators to be true. This program
    will output “a is equal to 20 and b” in to the console.


    *   !


    This operator is known as the logical NOT operator. It is used to reverse the
    logical state of its operand. This operand can be used with any other operand
    to reverse its output. If an operand was returning true, the operand will return
    false after applying the logical NOT operator.


    Example:


    int a = 21;


    int b = 20;


    if ( !(a == 20) && a > b) {


    System. out .println("a is not equal to 20, and a is greater than b");


    }


    else {


    System. out .println("a is equal to 20, and a is not greater than b ");


    }


    In this example, we check to see if the value of “a” does not equal 20, and we
    check if “a” is greater than “b.” Since “a” is both not equal to 20 and is greater
    than “b,” we print to the console “a is not equal to 20, and a is greater than
    b.”


    Example 2:


    int a = 21;


    int b = 20;


    if ( !(a == 20 && a > b) ) {


    System. out .println("a is not equal to 20, and a is greater than b ");


    }


    else {


    System. out .println("a is equal to 20, and a is not greater than b ");


    }


    In this example, the position of the bracket has changed so that the NOT operator
    extends to both operands. Now for the statement to be true, “a” has to NOT equal
    20 AND “a” must NOT be greater than “b.” In this situation the statement will
    return false, because “a” is greater than “b.” Due to the operand, it needs to
    be less than “b” for the statement to return true. Therefore, this program will
    return “a is equal to 20, and a is not greater than b” to the console.


    ## Combining Operators


    In Java, it is possible to use as many operators as you require per statement.


    Example:


    int a = 21;


    int b = 20;


    if ( (a == 20 && a > b) ||  (a != 20 && a < b)) {


    System. out .println("correct");


    }


    else {


    System. out .println("wrong");


    }


    With this example, we see how we can achieve much more complicated statements.
    Here, we apply an OR operator with two operands; however, each operand also incorporates
    an AND operator. Therefore, for this statement to return true, “a” must be equal
    to 20 and must be greater than “b” OR “a” must not equal 20 AND “a” must be less
    than “b.” Note that we use brackets to make the code easier to understand, and
    to prevent the code from misreading our logic.


    Example 2:


    int a = 21;


    int b = 20;


    if ( a == 20 && (a > b ||  a != 20) && a < b) {


    System. out .println("correct");


    }


    else {


    System. out .println("wrong");


    }


    In the above example, we have significantly changed the logic of the program by
    merely switching the position of a bracket. Now you may understand that the brackets
    surround the two inner operands, instead of two pairs of brackets surrounding
    each pair of outer operands. For this statement to now return true, three different
    conditions must return true: Variable “a” must be equal to 20, AND either “a”
    must be greater than “b” OR it must not be equal to 20, AND “a” must be less than
    “b.” With this new logic, the first operand must be true in addition to EITHER
    the second or third having to return true. Also on top of that, “a” must be less
    than “b.” This statement will return false because it fails the first condition:
    “a” does not equal 20\. It will pass the second condition because it is greater
    than “b,” and it will fail the last condition because “a” is not less than “b.”
    Since this would have required three correct conditions but only had one, the
    statement returns false and prints “wrong.”


    ## Assignment


    Now we are going to go through another assignment to make sure we understand everything
    about operators. We have three friends who want to know how much money each has
    compared to the others. We will make a program that will output who is the richest
    among them. We will have three integers named bob, john, and tom. We will give
    each one of them a different value, and the program must output who is richer.
    It must also tell us if someone has the same amount of money as someone else.


    For example:


    If bob = 20, tom = 10, and john = 5, the output must be:


    “bob is richer than tom, who is richer than john”


    But if bob = 20, tom = 20, and john = 5, the output must be:


    “bob is just as rich as tom, both are richer than john”


    The program needs to work for each possible outcome. I highly encourage you to
    try this program by yourself and struggle through it as best you can before you
    look at the answer. A big part of programming is problem-solving and understanding
    code.


    ### Answer and Explanation


    Note that the program will be explained through comments in the code.


    // this method calculates who is richer than whom


    public static void main(String[] args) {


