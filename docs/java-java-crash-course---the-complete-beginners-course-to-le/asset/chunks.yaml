    \ it with a semicolon. Be careful, though, as the block cannot create constructors\
    \ and cannot create methods for use outside of the anonymous inner class.\n\n\
    ```java\nclass Food\n{\n    public void eat()\n    {\n        System.out.println(“Mmmmm”);\n\
    \    }\n\n    public static void main(String[] args)\n\n    {\n\n        Food\
