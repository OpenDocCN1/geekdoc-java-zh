    # Chapter 9


    # Loops and Arrays


    ## Loops


    When programming, you might run into a situation where you will need to loop through
    a large amount of numbers. If we used what we learned so far to loop through one
    hundred numbers, we would need one hundred “if” statements. I think you would
    agree that would get really messy and frustrating. Luckily, Java supports three
    types of loops, all of which loop through things in slightly different ways. Below
    is a quick explanation of each.


    ### While Loop


    A while loop is a control structure that will allow you to repeat a task as many
    times as you program it to. The syntax for a while loop is as follows:


    while (expression) {


    // insert code


    }


    This works in a similar way that if statements work, except WHILE the expression
    is true, the code within the while loop will run until the expression becomes
    false (if it ever does).


    Example:


    int x = 10;


    while (x > 0) {


    System. out .println(x);


    x--;


    }


    The preceding code will print out the value of “x”, and then continuously subtract
    one from it until the value of “x” is no longer greater than zero. If you were
    to run this code, you would get an output of every number from one to ten. Once
    the value of “x” reaches zero, it no longer allows the expression to return true,
    which is when the while loop finishes. Note that you should watch out for infinite
    loops. These are errors in your code that cause the loop to never end, essentially
    freezing the program. This would happen when there is an error in your logic that
    would prevent the statement from ever becoming false.


    ### Do While Loop


    A do while loop works in a very similar way as the while loop except for one major
    difference: The “do”—what happens when the while statement is true—is called before
    the condition is asked. What that means is that a do while loop will always run
    at least once, because it does the task before it checks the condition. Execution
    of the second loop completely depends on the condition.


    Example:


    int x = 10;


    do{


    System. out .println(x);


    x--;


    }


    while(x > 0);


    In this example, the last program logic from the while loop has been directly
    transferred to the do while loop. As you can see, the only difference is that
    the logic that runs while the statement is true is above the while loop instead
    of below it. For this specific example, the output of the code is exactly the
    same. However, if we change the code to the following:


    int x = 0;


    do {


    System. out .println(x);


    x--;


    }


    while(x > 0);


    The output would be different than a while loop. If this was a while loop, the
    code within the loop would never run. However, in a do while loop, the do happens
    before the while, so the code will always run at least once. During the first
    run, it never technically gets checked for a true statement until the block of
    code is processed first. This can be helpful in specific situations, but it is
    not used as often as a normal while loop.


    ### For Loops


    For loops allow you an easy way to loop or increment through a specific range
    of values. The syntax for a for loop is as follows:


    for (initialization; termination; increment) {


    //statement


    }


    Initialization: Initializes a counter variable.


    Termination: States the expression to evaluate for true.


    Increment: Increments the initialized counter variable.


    Example:


    for (int x = 0; x < 10; x++) {


    System. out .println(x);


    }


    In this example, we start by initializing the for loop. We create a new int named
    “x” and set it to zero. Then we state when it will terminate. We say that the
    loop will continue for as long as “x” is less than ten. Then we set the increment
    to increase the value of “x” by one. The initialization happens only once, when
    the for loop is first called. After the loop is initialized, it should run at
    least once (unless you initialized it outside its bounds). Once per iteration,
    when it reaches the end of the code, it will call the increment value. After it
    increments, it will check whether it should be terminated; if it does not get
    terminated, the content is called again and the process repeats until termination.
    For the example code above, the output will be every number from zero to nine.


    ## Arrays


    Arrays are data structures that store a fixed number of variables of the same
    type. Instead of having to create one hundred different integer variables to store
    one hundred different number values, you can create one integer array that holds
    one hundred different numeric values. This makes it a lot easier to manage the
    integers, as well as keeping your code a lot more organized and simple.


    ### Declaring Arrays


    Declaring an array is similar to declaring a regular variable. The syntax is as
    follows:


    dataType arrayName[];


    This is way is way to declare an array that was added to Java to accommodate programmers
    coming from a C/C++ background.


    The array above currently holds no data. We declared the array, but we have not
    declared the size of it, nor the values in each index of the array:


    Example:


    int intArray[] = new int[5];


    The example above declares an integer array with five available slots. This means
    that this intArray can hold five different integer numbers within it. Each of
    these numbers can be independently edited and accessed in the following way:


    int intArray[] = new int[5];


    intArray[0] = 2;


    intArray[1] = 3;


    // ...


    System. out .println(intArray[0]);


    The code above declares the intArray with five data slots. We can then access
    those slots by adding an int value inside the square brackets beside the array
    name. When we do “intArray[0]”, we are referencing the value at index zero of
    the int array. The moment that we declared the array with five values, we also
    created five slots numbered 0-4\. When it was first declared, they contained the
    value zero. We then can access each of them independently, just like any normal
    variable. We can even read the value of each index just like a normal variable.


    ### Multidimensional Arrays


    Arrays can also be made much more complex by adding multiple dimensions to them.
    In the above examples, the arrays consisted of only one dimension. By adding more
    dimensions, we are essentially adding arrays within the arrays. It may sound complex,
    but it’s relatively easy to understand.


