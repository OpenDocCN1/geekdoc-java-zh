  trans: "\n\n我们可以在 Applet 窗口中使用各种字体编写数据。Java 提供了许多字体，包括 `Courier`、`Times New Roman`\
    \ 等。`Font` 类帮助我们定义新的字体对象，并可以通过预定义的方法将其设置为 Applet 窗口的字体。\n\n## Font 类\n\n### 构造函数\n\
    `Font(String name,int style,int size)` — 根据指定的名称、样式和大小创建一个新字体。\n\n### 方法\n- `abstract\
    \ void setFont(f)` — 将此图形上下文的字体设置为指定的字体\n- `String getStyle()` — 返回表示当前字体样式的字符串值\n\
    - `int getSize()` — 返回表示当前字体大小的整型值\n- `String getFamily()` — 返回作为字符串形式的字体族名称\n\
    - `boolean isPlain()` — 如果字体为正体（罗马体），则返回 true\n- `boolean isBold()` — 如果字体为粗体，则返回\
    \ true\n- `boolean isItalic()` — 如果字体为斜体，则返回 true\n\n### 样式常量\n- `Font.BOLD` —\
    \ 用于粗体字体样式\n- `Font.ITALIC` — 用于斜体字体样式\n- `Font.PLAIN` — 用于正体（罗马体）字体样式\n\n###\
    \ 程序\n```java\nimport java.awt.*;\nimport java.applet.*;\n\n//<applet code=”SampleFont”\
    \ width=”600” height=”600”></applet>\n\npublic class SampleFont extends Applet\n\
    {\n    Font f1, f2;\n\n    public void init()\n    {\n        f1=new Font(“TimesRoman”,Font.BOLD,25);\n\
    \        f2=new Font(“Courier”,Font.ITALIC,40);\n    }\n\n    public void paint(Graphics\
    \ g)\n    {\n        g.setFont(f1);\n        g.drawString(“This is Times Roman\
    \ Font”,100,100);\n        g.setFont(f2);\n        g.drawString(“This is Courier\
    \ Font”,100,200);\n    }\n}\n```\n![](img/Image00008.jpg)\n\n## Color 类\n\n`Color`\
    \ 类帮助我们通过颜色类的构造函数创建不同的颜色集合。你可以使用颜色类的方法设置 Applet 窗口的背景颜色和前景颜色。我们在颜色类中有许多预定义的方法。\n\
    \n### Color 类构造函数\n`Color c1=new Color(Red,Green,Blue)`\n\n在此构造函数中，我们必须指定 RGB\
    \ 值。这些值从 0 开始到 255 结束。当你指定此范围内的 RGB 值时，将根据你的数据产生新颜色。我们也有颜色常量，它们列在这里并给出了相应的 RGB\
    \ 值。\n\n| 颜色常量 | RGB 值 |\n| :--- | :--- |\n| `Color.red` | 255, 0, 0 |\n| `Color.green`\
    \ | 0, 255, 0 |\n| `Color.blue` | 0, 0, 255 |\n| `Color.magenta` | 255, 0, 255\
    \ |\n| `Color.cyan` | 0, 255, 255 |\n| `Color.yellow` | 255, 255, 0 |\n\n### Color\
    \ 类的方法\n- `setColor()` — 此方法将为对象设置颜色。它只有一个参数，因此你可以传递任何颜色常量值或颜色类对象。\n- `setBackground()`\
    \ — 此方法将设置 applet 的背景颜色。它也只有一个参数，即颜色类对象或颜色常量值。\n- `setForeground()` — 此方法用于在绘制后更改整个\
    \ applet 的颜色。\n- `Color getBackground()` — 此方法将返回 Applet 窗口的背景颜色。\n- `Color getForeground()`\
    \ — 此方法将返回前景颜色类对象。\n\n### 程序\n```java\nimport java.applet.*;\nimport java.awt.*;\n\
    \n//<applet code=”SampleColor” width=”400” height=”400”></applet>\n\npublic class\
    \ SampleColor extends Applet\n{\n    Color c1,c2;\n\n    public void init()\n\
    \    {\n        c1=new Color(10,255,200);\n        c2=new Color(100,100,100);\n\
    \    }\n\n    public void paint(Graphics g)\n    {\n        g.setBackground(c1);\n\
    \        g.drawString(“Color Class object 1”,200,200);\n        g.setForeground(c2);\n\
    \        g.drawString(“Color Class object 2”,250,250);\n    }\n}\n```\n![](img/Image00009.jpg)\n\
    \n在这个示例程序中，我们声明了两个颜色类对象：`c1` 和 `c2`。然后，在 `init()` 方法内部使用 `Color` 类构造函数创建了 `c1`\
    \ 和 `c2`。在 `paint()` 方法内部，我们将 `c1` 设置为 Applet 窗口的背景颜色，并将 `c2` 设置为前景。\n\n## Applet\
    \ 窗口组件\n\n组件无非是 AWT 包中的控件，例如文本框、列表框、选择框、按钮、滚动条等。每个组件类都有其自己的方法和构造函数。组件构造函数帮助我们创建组件并将其添加到\
    \ Applet 窗口中。在这里，我们列出了重要的组件类及其方法和构造函数。\n\n### 组件类\n\n我们可以区分以下组件：\n\n#### 1. 标签组件\n\
    \n我们可以区分以下组件：\n\n#### 标签组件\n**构造函数**\n- `Label()` — 这是空构造函数，创建一个空的标签。\n- `Label(String\
    \ str)` — 这是带字符串的构造函数，创建一个带有指定文本的标签。\n\n**方法**\n- `getText()` — 返回标签的文本。\n- `setText(String\
    \ str)` — 设置标签的文本。\n- `setFont(Font f)` — 设置标签的字体。\n\n**程序**\n```java\nimport\
    \ java.awt.*;\nimport java.applet.*;\n\n//<applet code=”SampleLabel” width=”200”\
    \ height=”200”></applet>\n\npublic class SampleLabel extends Applet\n{\n    Label\
    \ l1,l2,l3;\n\n    public void init()\n    {\n        l1=new Label(\"First Label\"\
    );\n        l2=new Label(\"Second Label\");\n        l3=new Label(\"Third Label\"\
    );\n        add(l1);\n        add(l2);\n        add(l3);\n    }\n}\n```\n\n####\
    \ 2. 按钮组件\n`Button` 组件用于在用户按下按钮时执行任何操作或任务。按钮类具有构造函数和预定义方法。如果你按下按钮，它会产生一个事件。\n\n\
    **按钮类的构造函数**\n- `Button()` — 这是空构造函数，创建一个没有文本的按钮。\n- `Button(String str)` — 这是参数化构造函数，创建一个带有指定文本的按钮。\n\
    \n**按钮类的方法**\n- `addActionListener(ActionListener L)` — 为新创建组件添加监听器。\n- `getActionCommand()`\
    \ — 返回按下按钮后的命令文本。\n- `getLabel()` — 返回按钮的文本。\n- `setLabel(String text)` — 设置按钮的文本。\n\
    - `getSource()` — 返回被按下的按钮对象。\n\n**程序**\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\
    import java.applet.*;\n\npublic class SampleButton extends Applet implements ActionListener\n\
    {\n    String str = \" \";\n    Button b1, b2, b3;\n\n    public void init()\n\
    \    {\n        b1 = new Button ( \"First Button\");\n        b2 = new Button\
    \ (\"Second Button\");\n        b3 = new Button (\"Third Button\");\n        add(b1);\n\
    \        add(b2);\n        add(b3);\n        b1.addActionListener (this);\n  \
    \      b2.addActionListener (this);\n        b3.addActionListener(this);\n   \
    \ }\n\n    public void actionPerformed(ActionEvent ae)\n    {\n        if(ae.getSource()==b1)\
    \ {\n            str = \"You pressed Button 1.\";\n        }\n        else if(ae.getSource()==b2)\
    \ {\n            str = \"You pressed Button 2.\";\n        }else {\n         \
    \   str = \"You pressed Button 3.\";\n        }\n        repaint();\n    }\n\n\
    \    public void paint(Graphics g)\n    {\n        g.drawString(str,6,100);\n\
    \    }\n}\n\n//<applet code=\"SampleButton.class\" width = 300 height = 100></applet>\n\
    ```\n\n"
- fmt: "\nIn this example, we have created the three buttons `b1`, `b2` and `b3` with\
    \ the labels First Button, Second Button, and Third Button. If you click the First\
    \ Button, it will immediately generate the `ActionEvent` so that the `actionPerformed()`\
    \ method will be called and it will print the “You pressed Button 1” message on\
    \ the Applet window. This same functionality also applies to the second and third\
    \ buttons.\n\n### 3. Check Box Component\n\nThe check box component helps us to\
    \ choose more than one item from multiple choices. We have a predefined class\
    \ called `Checkbox` that has more than one constructor to create checkboxes and\
    \ methods to manipulate those checkboxes and retrieve the checkbox details.\n\n\
    #### Constructors of the Checkbox Component\n\n- `Checkbox()` creates a checkbox\
    \ without label text.\n- `Checkbox(String str)` creates a checkbox with label\
    \ text.\n- `Checkbox(String str, Boolean state)` creates a checkbox with label\
    \ text and you can test the checkbox with `Boolean` `state`. If you pass a `true`\
    \ value, then it will create the checkbox with a check mark; if `false`, then\
    \ it won’t have a check mark.\n- `Checkbox(String str, CheckboxGroup, Boolean\
    \ state)` used to convert a checkbox to a Radio button. If you pass the `CheckboxGroup`\
    \ object, then it will create a Radio button.\n\n#### Methods of Checkbox\n\n\
    - `getState()` returns the state of the `Checkbox`. It will return `true` if the\
    \ checkbox is selected or `false` if not selected.\n- `getItem()` returns the\
    \ item object of the particular `Checkbox`.\n- `setCheckboxGroup(CheckboxGroup\
    \ g)` sets the corresponding checkbox group to the specified one.\n- `setLabel(String\
    \ label)` sets the label of the corresponding checkbox to the value specified.\n\
    - `setState(boolean state)` sets the state of the corresponding checkbox to the\
    \ value specified.\n- `getCheckboxGroup()` this method determines the group of\
    \ the corresponding checkbox.\n- `getLabel()` returns the name of the corresponding\
    \ checkbox.\n- `getSelectedObjects()` returns an array (length `l`) containing\
    \ the checkbox label or `null` if the checkbox is not selected.\n\n#### Sample\
    \ Program\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nimport java.applet.*;\n\
    \npublic class SampleCheckbox extends Applet implements ItemListener {\n    String\
    \ str = new String();\n    Checkbox fe,lam,jag,au;\n\n    public void init() {\n\
    \        fe = new Checkbox(\"Ferrari\",null,true);\n        lam = new Checkbox(\"\
    Lamborghini\");\n        jag = new Checkbox(\"Jaguar\");\n        au = new Checkbox(\"\
    Audi\");\n        add(fe);\n        add(lam);\n        add(jag);\n        add(au);\n\
    \        fe.addItemListener(this);\n        lam.addItemListener(this);\n     \
    \   jag.addItemListener(this);\n        au.addItemListener(this);\n    }\n\n \
    \   public void itemStateChanged(ItemEvent ie) {\n        repaint();\n    }\n\n\
    \    public void paint(Graphics g) {\n        str = \"Selected Brand : \";\n \
    \       g.drawString(str,6,80);\n        str = \"  Ferrari: \" + fe.getState();\n\
    \        g.drawString(str,6,100);\n        str = \"  Lamborghini: \" + lam.getState();\n\
    \        g.drawString(str,6,120);\n        str = \"  Jaguar: \" + jag.getState();\n\
    \        g.drawString(str,6,140);\n        str = \"  Audi: \" +au.getState();\n\
    \        g.drawString(str,6,160);\n    }\n}\n//<applet code=\"SampleCheckbox.class\"\
    \ width=300 height=200></applet>\n```\n\n![](Image00011.jpg)\n\nIn this example,\
    \ we have created four checkboxes with the help of constructors. First we need\
    \ to declare the checkbox objects along with the checkbox labels. `Checkbox` generates\
    \ the `ItemEvent`, so all checkbox events are handled by the `ItemListener` Interface.\
    \ The `itemStateChanged()` method will call the `repaint()` method. There we can\
    \ get all the states of the checkbox by using the `getState()` method. Since it\
    \ is a checkbox, you can select more than one.\n\n### 4. Radio Button\n\nThis\
    \ is similar to checkbox, but you cannot select more than one item. In Java, there\
    \ is not a separate class for the Radio button. You can create a radio button\
    \ using the `Checkbox` constructor. You simply pass the checkbox group and it\
    \ will convert the `Checkbox` to a Radio button. The following program explains\
    \ everything.\n\n#### Sample Program\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\
    import java.applet.*;\n\npublic class SampleCBG extends Applet implements ItemListener\
    \ {\n    String str = new String();\n    Checkbox fe,lam,jag,au;\n    CheckboxGroup\
    \ cbg;\n\n    public void init() {\n        fe = new Checkbox(\"Ferrari\",cbg,true);\n\
    \        lam = new Checkbox(\"Lamborghini\",cbg,false);\n        jag = new Checkbox(\"\
    Jaguar\",cbg,false);\n        au = new Checkbox(\"Audi\",cbg,false);\n       \
    \ add(fe);\n        add(lam);\n        add(jag);\n        add(au);\n        fe.addItemListener(this);\n\
    \        lam.addItemListener(this);\n        jag.addItemListener(this);\n    \
    \    au.addItemListener(this);\n    }\n\n    public void itemStateChanged(ItemEvent\
    \ ie) {\n        repaint();\n    }\n\n    public void paint(Graphics g) {\n  \
    \      str = \"Selected Brand : \";\n        g.drawString(str,6,80);\n       \
    \ str = \"  Ferrari: \" + fe.getState();\n        g.drawString(str,6,100);\n \
    \       str = \"  Lamborghini: \" + lam.getState();\n        g.drawString(str,6,120);\n\
    \        str = \"  Jaguar: \" + jag.getState();\n        g.drawString(str,6,140);\n\
    \        str = \"  Audi: \" +au.getState();\n        g.drawString(str,6,160);\n\
    \    }\n}\n//<applet code=\"SampleCBG.class\" width=300 height=200></applet>\n\
    ```\n\n![](Image00012.jpg)\n\nIn this program we have created a radio button using\
    \ the `Checkbox` and `CheckboxGroup`. Again, we don’t have a separate class for\
    \ the Radio button, but we can create the Radio button with the help of `Checkbox`\
    \ constructor when we pass `CheckboxGroup` object as an argument. In this program\
    \ we have added radio buttons, each representing the brand name of a car.\n\n\
    ### 5. Choice Component\n\nA choice box is nothing but ordinary combo box control,\
    \ which is a combination of Text and List boxes. You can select any item from\
    \ the list box and it will immediately be displayed. In Java, we have `Choice`\
    \ class to create the choice box.\n\n#### Constructor of the Choice Component\n\
    \n`Choice ch=new Choice();`\n\n#### Methods of the Choice Component\n\n- `add(String\
    \ item)` adds an item to the corresponding choice box.\n- `addItem(String item)`\
    \ this method also adds an item to the corresponding choice box\n- `getItem(int\
    \ index)` returns the string at the specified index of the corresponding choice\
    \ box.\n- `getItemCount()` returns the number of items in the corresponding choice\
    \ box.\n- `getSelectedIndex()` returns the index of the currently selected item\
    \ of the corresponding choice box.\n- `getSelectedItem()` returns the current\
    \ selected item of the choice as string data.\n- `insert(String item, int index)`\
    \ inserts the item into the corresponding choice at the specified position.\n\
    - `remove(int position)` removes an item from the corresponding choice box at\
    \ the specified position.\n- `remove(String item)` similar to the previous one,\
    \ this will remove the first occurrence of an item from the corresponding choice\
    \ menu.\n- `removeAll()` removes all items from the corresponding choice menu.\n\
    - `select(int pos)` sets the selected item in the corresponding choice menu to\
    \ be at the specified position.\n- `select(String str)` sets the selected item\
