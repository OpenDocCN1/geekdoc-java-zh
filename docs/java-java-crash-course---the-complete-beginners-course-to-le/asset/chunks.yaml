    and then this inner loop will look through the rest of the array for any other
    occurrences of that element. So in this inner loop, we have simply checked to
    see if the name we have selected was equal to the element we were looking at (based
    on our “i” for loop), and if so return true, since that means a name has multiple
    usages. We have done exactly the same thing with the partner2 array. If the method
    goes through both loops without returning true, this means that at no point were
    the names used multiple times, so we return false at the end.'
