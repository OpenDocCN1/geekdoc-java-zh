  trans: "\n枚举（Enums）本质上是具有有限可能性的预设。它们在定义上与类和接口相似，但使用的是 `enum` 关键字。它们可以拥有构造函数和变量。枚举不能被实例化，也不能作为子类（但可以实现接口）。在访问\
    \ `enum` 的变量时要小心，因为如果你修改了 `enum` 的变量，该 `enum` 的所有实例都会被修改。要填充一个 `enum`，你需要所有预设值的列表。此列表必须位于你枚举块的顶部。如果你的\
    \ `enum` 没有构造函数，你可以直接写出可能的值，就像是变量名一样。其余部分用逗号分隔并以分号结束。如果你的 `enum` 有构造函数，你必须编写变量名，然后是用逗号分隔的构造参数（即值），并以分号结束。在分号之后，你可以继续编写变量声明、构造函数以及任何想要的方法。构造函数不能是公共的，只能是保护的或私有的。\n\
    \n```java\nenum Number \n{\n    One , Two , Three\n}\n```\n\n```java\nenum Color\
    \ \n{\n    Red (255, 0, 0),\n    Green (0, 255, 0),\n    Blue (0, 0, 255),\n \
    \   Purple (255, 0, 255),\n    Yellow (255, 255, 0),\n    Cyan (0, 255, 255);\n\
    \n    public int r;\n    public int g;\n    public int b;\n\n    Color(int redChannel,\
    \ int greenChannel, int blueChannel) \n    {\n        r = redChannel;\n      \
    \  g = greenChannel;\n        b = blueChannel;\n    }\n\n    public static void\
    \ main(String[] args) \n    {\n        Number num = Number.Two;\n        Color\
    \ red1 = Color.Red;\n        Color red2 = Color.Red;\n        red1.g = 255;\n\
    \        System.out.println(red2.g); // “255”, red2 被修改了，因为 red1 和 red2 是同一个对象。该对象存储在两个变量中，因此会受到任何一个对象的更改的影响。\n\
    \    }\n}\n```\n\n# 第 16 章\n\n# 泛型\n\n泛型类型允许我们创建泛型类，这意味着它们可以根据给定的类型表现出不同的行为。程序员为泛型类型提供了一个类列表，用于定义特定的对象类型。泛型通过在类名后放置尖括号（`<\
    \ >`）并跟上类型标识符列表来创建。这些标识符的作用与变量名一样，但惯例是其中一个使用大写字母，特别是 `T`（代表 type）。这些类型标识符可以代替数据类型。这允许你保持某些变量为一致的类型，从而避免强制类型转换。当使用泛型类作为数据类型创建变量时，该数据类型也必须包含与类类型列表对应的类型列表的尖括号。你创建的对象在参数之前也需要相同的尖括号集合。\n\
    \n```java\nclass Something<A, B> \n{\n    public A variableA;\n    public B variableB;\n\
    \n    public Something(A varA, B varB) \n    {\n        this.variableA = varA;\n\
    \        this.variableB = varB;\n    }\n\n    public static void main(String[]\
    \ args) \n    {\n        // Class1 将是 A，Class2 将是 B\n        Something<Class1,\
    \ Class2> somethingElse = new Something<Class1, Class2>(new Class1(), new Class2());\n\
    \        Class1 class1 = somethingElse.variableA; // 这不需要类型转换，因为 variableA 实际上是\
    \ Class1 类型\n    }\n}\n```\n\n```java\nclass Class1{}\nclass Class2{}\n```\n\n\
    泛型类型的一个常见用途是 `ArrayList`，它是 `java.util` 包中的一个类。`ArrayList` 是一个动态数组，意味着你可以在数组初始化后更改数组中元素的数量。`ArrayList`\
    \ 使用泛型类型来防止程序员添加错误类型的对象，并帮助程序员将对象转换为所需的类型。这里是一个使用 `ArrayList` 的简短示例。\n\n```java\n\
    class Food \n{\n    public String name;\n\n    public Food(String name) \n   \
    \ {\n        this.name = name;\n    }\n\n    public static void main(String[]\
    \ args) \n    {\n        ArrayList<Food> basket = new ArrayList<Food>();\n   \
    \     basket.add(new Food(“Pear”));\n        basket.add(new Food(“Apple”));\n\
    \        basket.add(new Food(“Orange”));\n        basket.add(new Food(“Apple”));\n\
    \        basket.add(new Food(“Pomegranate”));\n        System.out.println(basket.get(2).name);\
    \ // “Orange”\n        basket.remove(3);\n        System.out.println(basket.size());//\
    \ “4”\n    }\n}\n```\n\nArray Lists 的良好用法涉及“队列”。这是一种在不需要进行递归（在方法内部调用该方法）的情况下实现递归的方法。递归是相当危险的，因为使用不当会导致无限循环，并迅速导致程序崩溃。递归实际上相当慢，所以我们有使用队列的选择是一件好事。基本上，你创建一个\
    \ `ArrayList`（通常以类的形式存在），向数组添加一个起始元素，然后只要 `ArrayList` 不空（或未完成任务），它就会根据 ArrayList\
    \ 中的值继续执行代码。你的代码可以向 ArrayList 添加产生新循环的元素，就像在递归方法中，你可以再次调用方法以增加新的深度。\n\n队列并不一定“优于”递归方法。队列用于分支递归“路径”，特别是在寻找最优解决方案的情况下。这可以用于视频游戏中的路径查找，或者现实生活。逻辑上，我们可以尝试最接近目标的路径，如果该路径进入死胡同，我们可以将其从队列中移除并尝试下一个最近的路径。递归可以做到这一点，但它的工作方式像树一样。每条路径都可能从左到右，并遍历每种可能性。队列允许你从迭代树的任何部分跳转到迭代树的任何其他部分，这使得计算机可以使用最快的方法找到路线。递归和队列都可以达到相同的结果，但取决于你构建系统的方式。\n"
- fmt: "\nThreading is a way to run two “threads” of code at the same time. Threading\
    \ does not necessarily make your program run faster, but it can in select situations.\
    \ Threading shares processing power, so it does not speed up any code. Threading\
    \ works like two very nice people walking through a corridor divided by tons of\
    \ doors. The first person lets the second go through the first door, then the\
    \ second person lets the first go through the second door, and repeat. What threading\
    \ allows programmers to do is run loops that will run for a very long time while\
    \ still doing other things in the background. For example, if you want your program\
    \ to accept a connection from another computer, you could run a loop that constantly\
    \ “listens” for a connection. The problem with this is that your program will\
    \ freeze while it listens. Instead, we use a thread to listen for a connection,\
    \ and then do other things in our main thread. We would show the user something\
    \ like a GUI (next section) and give them feedback based on the listening status.\
    \ So how do we make a thread? First, we make a “Runnable.” Simply implement `Runnable`\
    \ and then override its `run` method. Next, we create a thread object with the\
    \ parameter of a `MyRunnable` object (or any class that implements `Runnable`),\
    \ and finally call `<thread object>.start()`.\n\n```java\nclass MyRunnable implements\
    \ Runnable\n{\n    public void run()\n    {\n        while(true) // This loops\
    \ runs forever!\n        {\n            System.out.println(“Groundhog Day!”);\n\
    \        }\n    }\n    public static void main(String[] args)\n    {\n       \
    \ Runnable runThis = new MyRunnable();\n        Thread aThread = new Thread(runThis);\n\
    \        aThread.start();\n        while(true)\n        {\n            System.out.println(“Bill\
    \ Murray!”);\n        }\n    }\n}\n```\nThe code above will now run two infinite,\
    \ unrelated loops, and will “randomly” print out either “Groundhog Day!” or “Bill\
    \ Murray!” Threading is not limited to infinite loops, though; they are simply\
    \ for whenever you need two concurrent lines of processing. For example, say you’re\
    \ making a loading menu for a video game. You may make one thread load the game\
    \ data, and then simply put its status into a variable (like how many files have\
    \ been loaded). Then you could have another thread modify your window or console\
    \ or whatever to tell the user the status of loading based on the variable that\
    \ the original thread is using. This is how (most) loading bars are made.\n\n\
    ## Life Cycle of Thread\nThere are four stages are involved in the life of cycle\
    \ of a thread. They are:\n* Born state\n* Runnable state\n* Blocked state\n* Dead\
    \ state\n\n### New Born State\nWhen a thread is created, it is in the new state.\
