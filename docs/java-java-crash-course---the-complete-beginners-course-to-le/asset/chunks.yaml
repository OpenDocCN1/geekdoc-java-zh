    \ the parent window to activate until this dialog closes, but in `modeless` dialog\
    \ you can do anything in the parent window.\n\n## Methods of the Dialog Class\n\
    \n- `boolean isModal()`___Returns true if the dialog is modal. We have already\
    \ seen the working style of the modal dialog box. It will return false if the\
    \ dialog is modeless.\n- `setResizable(boolean)`___Sets the resizable flag of\
