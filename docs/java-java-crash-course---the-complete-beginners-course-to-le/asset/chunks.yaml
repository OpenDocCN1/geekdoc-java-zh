  trans: "\n\n```java\npublic static void main(String[] args)\n{\n    new Fruit();\n\
    }\n}\n```\n\n这本身并没有什么用。我们创建了对象，但在将其赋值给变量之前，我们无法使用它。`Classes` 可以充当变量数据类型，而对象就是它们的值。\n\
    \n```java\nclass Fruit\n{\n    public String name;\n    public int timeSincePicked;\n\
    \n    public static void main(String[] args)\n    {\n        Fruit objectOfFruit\
    \ = new Fruit();\n    }\n}\n```\n\n现在，我们可以访问 `objectOfFruit` 对象内部的变量了。要访问这些变量，我们只需要编写对象名、一个点（`.`）以及变量名即可。方法也可以放在类中，并访问它们所属对象中的变量。记住，对象中的变量可以有不同的值。不过，请注意编写代码的位置，因为你只能在方法内部编写代码。`Classes`\
    \ 直接包含变量、`methods` 和其他 `classes`。\n\n```java\nclass Fruit\n{\n    public String\
    \ name;\n    public int timeSincePicked;\n\n    public static void main(String[]\
    \ args)\n    {\n        Fruit newPear = new Fruit();\n        newPear.name = “Pear”;\n\
    \        newPear.timeSincePicked = 24894;\n        newPear.checkIfRotten(); //\
    \ 输出：“This Pear is not rotten.”\n\n        Fruit oldPear = new Fruit();\n    \
    \    oldPear.name = “Pear”;\n        oldPear.timeSincePicked = 3659246;\n    \
    \    oldPear.checkIfRotten(); // 输出：“This Pear is rotten!”\n    }\n\n    public\
    \ void checkIfRotten()\n    {\n        if(timeSincePicked > 100000)\n        {\n\
    \            System.out.println(“This “ + name + ” is rotten!”);\n        }\n\
    \        else\n        {\n            System.out.println(“This “ + name + ” is\
    \ not rotten.”);\n        }\n    }\n}\n```\n\n`Classes` 可以获得另一个类的属性并在此基础上进行构建。这被称为\
    \ `inheritance`（继承）。“扩展”另一个 `class` 的 `Classes` 将拥有被扩展 `class` 的所有变量和 `methods`。正在扩展的\
    \ `class` 称为 `child`（子类），而被扩展的 `class` 称为 `parent`（父类）。要进行扩展，在 `class` 名称后输入 `extends`\
    \ 以及父 `class` 的名称。\n\n```java\nclass Food\n{\n    public String name;\n}\n\n//\
    \ Fruit 是子类，Food 是父类\nclass Fruit extends Food\n{\n    public boolean isRotten;\n\
    \    // 可以同时访问 name 和 isRotten\n}\n```\n\n这导致了 `polymorphism`（多态）。这意味着一个 `child\
    \ class` 可以作为 `parent class` 对象的值。这被称为 `upcasting`（向上转型）。这里是部分代码来解释这一概念：\n\n```java\n\
    class Food {\n    public String name;\n    public static void main(String[] args)\n\
    \    {\n        Food pear = new Fruit();\n        pear.name = “pear”;\n      \
    \  // pear.isRotten = true; // 这行不通，因为 pear 在技术上是 Food 类型，没有 isRotten 变量\n   \
    \ }\n}\n\nclass Fruit extends Food {\n    public boolean isRotten;\n    // 可以同时访问\
    \ name 和 isRotten\n}\n```\n\n`Casting` 或 `downcasting`（向下转型）可以将对象转换为另一种类型，以便访问该类型的变量。这有特定的规则，即对象不能被转换为它并不所属的类型。例如，如果\
    \ `Fruit` 和 `Meat` 都扩展自 `Food`，而 `Pear` 扩展自 `Fruit`，并且你有一个类型为 `Fruit` 且已向上转型为\
    \ `Food` 类型的对象，它不能被转换为 `Meat` 类型。这是因为原始对象并不是该类型。同样，该对象不能被转换为 `Pear` 类型，因为它在之前不是该类型。`Casting`\
    \ 的实现方法是，在想要转换的对象之前的括号中放入你想要转换的 `class` 即可。\n\n```java\nclass Food{}\nclass Fruit\
    \ extends Food{ public int variable; }\nclass Meat extends Food{}\nclass Pear\
    \ extends Fruit{}\nclass Main\n{\n    public static void main(String[] args)\n\
    \    {\n        Food genericFood = new Fruit();\n        Fruit fruit = (Fruit)food;\n\
    \        fruit.variable = 1; // 能够访问转换后对象的变量\n        // Meat meatIsntFruit =\
    \ (Meat)genericFood; // 不工作，因为 fruit 不是 meat\n        // Pear fruitIsntPear =\
    \ (Pear)genericFood; // 不工作，因为 fruit 不够具体，无法作为 pear\n    }\n}\n```\n\n`Access\
    \ modifiers`（访问修饰符）几乎自言自义：它们修改了谁可以访问它们。`Access modifiers` 可以放在变量、`methods` 和 `classes`\
    \ 上。它们始终位于变量的数据类型、`method` 的返回类型或 `class` 关键字之前。有三种访问修饰符：\n\n- `Public`: 任何地方都可以访问它。\n\
    - `Protected`: 只有类本身及其子类可以访问它。\n- `Private`: 只有类本身可以访问它。\n\n如果你省略了访问修饰符，它将默认为无修饰符，这与\
    \ public 基本相似。`Access modifiers` 本质上防止了其他程序员破坏你 `class` 内部的流程。放置 `access modifiers`\
    \ 的要求很少——你可以将几乎所有内容都设为 public，你的代码也能正常运行。\n\n"
