    In this sample, we have demonstrated the usage and functionality of the scrollbar.
    We have created only one scrollbar with help of scrollbar constructor. Then we
    have created the font and color object to set the new font and color of the applet
    window. After successful creation of the horizontal scrollbar (having specified
    Scrollbar.Horizontal inside the Scrollbar constructor), it will be added to the
    applet by the add() method. Then, the adjustment listener event will perform the
    adjustment event. If you adjust the scrollbar immediately the adjustment event
    has been generated, it will call the adjustment value changed method. There we
    simply call the paint method by the repaint method to update the applet window.
    Inside the paint, we have set the color and font of the applet window by using
    the corresponding setfont and setcolor methods. Finally, the drawstring method
    prints the current value of the scrollbar.


    ## Menu


    Basically all GUI applications have a menu and a menu bar. Generally, these types
    of menu items can perform any task if you click them. We have a set of methods
    to handle these menu events. If you click a menu item, it will generate an Action
    Event. We have already discussed event handling; the Action event is handled by
    the Action Listener Interface. Let’s see the classes and their constructors and
    methods.


    The MenuBar class is used to create the menu bar. This menu bar contains a menu
    and menu items.


    Frame.setMenuBar(MenuBar object);


    This method will set the menu bar on the frame. Menu class is used to create a
    new Menu. It has a constructor that is used to create a new menu that can be added
    to the menu bar using the MenuBar.add (Menu item) method. The Menu Item class
    is used to create a new menu item. It has a constructor that will create a new
    menu item that can be added to the menu by the same add(MenuItem obj) method.


    Sample Menu With Items


    MenuBar mb = new MenuBar();


    Menu mFile = new Menu("File");


    MenuItem mNew = new MenuItem("New");


    mFile.add(mNew);


    mb.add(mFile)


    f.setMenuBar(mb);


    Methods of the Menu Class


    add(Menu)___Adds the specified menu item to the menu.


    add(String)___Adds the specified string to the menu. A new menu item with the
    specified string as the label is created and added to the menu.


    addSeparator()___Adds a separator to the menu.


    getItem(int index)___Returns the item at the specified index as a string.


    remove(int index)___Deletes the item at the specified index from the menu.


    Menu Item Class Methods


    getLabel()___Returns the label of the menu item in a string format.


    setLabel(String)___Changes the label of the menu item to the specified string.


    setEnabled(boolean)___Makes the menu item selectable/deselectable depending on
    whether the parameter is true or false.


    Checkbox Menu Item


    This class will create the checkbox menu item, which will show a checkmark with
    the menu item. This menu item can also perform some tasks, just like other menu
    items.


    Checkbox Menu Item Methods


    getState()___Returns the state of the menu item as a Boolean value. A value of
    true implies that the checkbox menu item is selected.


    setState(boolean)___Sets the state of the menu item. If the value passed is true,
    the menu item is set to the selected state.


    Sample Program for Creating a Menu


    import java.awt.*;


    import java.awt.event.*;


    public class SampleMenu extends Frame implements ActionListener


    {


    MenuBar mb;


    Menu mFile,mEdit,mFormat;


    MenuItem mNew,mOpen,mSave,mExit;


    MenuItem mCut,mCopy,mPaste;


    MenuItem mWord,mFon;


    public SampleMenu(String title)


    {


    super(title);


    mb = new MenuBar();


    mFile = new Menu("File");


    mEdit = new Menu("Edit");


    mFormat=new Menu(“Format”);


    mNew = new MenuItem("New");


    mOpen = new MenuItem("Open");


    mSave = new MenuItem("Save");


    mExit = new MenuItem("Exit");


    mCut = new MenuItem("Cut");


    mCopy = new MenuItem("Copy");


    mPaste = new MenuItem("Paste");


    mWord=new MenuItem(“Word wrap’);


    mFont=new MenuItem(“Font”);


    mEdit.add(mCut);


    mEdit.add(mCopy);


    mEdit.add(mPaste);


    mFile.add(mNew);


    mFile.add(mOpen);             


    mFile.add(mSave);


    mFile.addSeparator();


    mFile.add(mExit);


    mFormat.add(mWord);


    mFormat.add(mFont);


    mb.add(mFile);


    mb.add(mEdit);


    mb.add(mFormat);


    setMenuBar(mb);


    addWindowListener(new WindowAdapter() {


    public void windowClosing(WindowEvent we)


    {


    dispose();


    System.exit(0);


    }


    });


    mExit.addActionListener(this);


    mNew.addActionListener(this);


    setSize(400,400);


    setVisible(true);


    }


    public void actionPerformed(ActionEvent ae)


    {


    if(ae.getSource() == mExit)


    {                           


    dispose();


    System.exit(0);


    }


    else if(ae.getSource() == mNew)


    {


    System.out.println(“A new menu item selected”);


    }


    }


    public static void main(String args[])


    {


    SampleMenu sm = new SampleMenu("Menu Creation");


    }


    }


    In this sample program, we have created a new menu bar with object mb, as well
    as the three menus File, Edit, and Format. The File menu has four menu items:
    new, open, save, and exit. The Edit menu has three menu items: cut, copy, and
    paste. The third and final menu is the Format menu, which has two menu items:
    Font and Word Wrap. Then we have added those options with the corresponding menus
    to our already created menu bar. setMenubar() will set the menu bar with the frame.
    Currently, the “exit” and “new” options only perform an action because we added
    actionListener(). If you select “new,” System.out.println() will print “A new
    option selected.” If you click the exit option, the program will be terminated.


    ## Dialog Box


    Dialog is also a container in Java. We can store a set of components in the dialog
    box, but the dialog box cannot move freely because it depends on another container
    such as Frame. Basically, Dialog is the window that gets data from the user to
    perform any assigned task. We have two different types of dialog box: predefined
    and user defined. In Java, we call the predefined version a File Dialog box because
    it is associated with file operations. User defined dialog boxes are created by
    the user. Dialog class will help us to create a user defined dialog box.


    Constructors of the Dialog Class'
