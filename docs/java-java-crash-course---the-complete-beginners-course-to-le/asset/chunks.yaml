    ## 7. Text Field Component


    This is a single line data editor that allows you to enter text data on a single
    line. `TextField` Component class contains a set of constructors and methods to
    handle the TextField Data. Here we have listed the constructors and methods of
    the TextField Component class. It will generate a `TextEvent`, so it is handled
    by the `TextListner` `textValueChanged()` method.


    ### Constructors of the TextField


    - `TextField()`

    - `TextField(int length)`

    - `TextField(String str)`

    - `TextField(String str, int length)`


    ### Methods of the TextField Component class


    - `getText()`___Returns the text of the corresponding `TextField`.

    - `setText(String str)`___Sets the given text to the corresponding `TextField`.

    - `getSelectedText()`___Returns the selected text part of the `TextField`.

    - `select(int startindex,int endindex)`___Used to select the text.

    - `setEditable(boolean canEdit)`___If false, the text cannot be altered.

    - `isEditable()`___Helps us to check if the text is editable.

    - `setEchoChar(char ch)`___Sets the printed character (password field).

    - `echoChar()`___Checks if the echo is set or not.

    - `getEchoChar()`___Returns the echoed character.


    ## 8. TextArea Component


    This is a multi-line data editor. Here you can enter text data on more than one
    line. It also has set of constructors and methods.


    ### TextArea Constructors


    - `TextArea()`

    - `TextArea(int numLines,int numChars)`

    - `TextArea(String str)`

    - `TextArea(String str,int numLines,int numChars)`

    - `TextArea(String str,int numLines,int numChars,int sBars)`


    ### Methods of the Component


    All Text field components are also supported by TextArea, although they have some
