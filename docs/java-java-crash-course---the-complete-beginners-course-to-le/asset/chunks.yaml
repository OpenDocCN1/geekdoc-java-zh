    # Chapter 7


    # The String Object


    Strings are quite commonly used in Java programming. A string is a sequence of
    characters or a line of text. A String in Java is not a primitive data type, but
    rather an object, which means that it has properties that can be called from it.


    A String variable is declared by doing the following:


    String thisIsText = “example”;


    Since a String is an object in Java, it is capitalized as “String,” unlike a primitive
    data type, which is simply all lowercase to indicate that it is primitive. An
    example of this is an “int,” which indicates an integer. Later on, you will learn
    about classes and objects in more detail. Considering that a String is an object,
    it can also be declared like all objects.


    String thisIsText = new String(“example”);


    Now let’s go over the fundamental properties of a String object that can be used
    to gain extra information over the piece of text or String.


    ## String Length


    One way to receive information on the number of characters in a String is by doing
    the following:


    String text = “test”;


    int amount = text.length();


    System.out.println(“The amount of characters are: ” + amount);


    The .length() function or property in a String object returns a value for the
    amount of characters within the String object and assigns the value to the integer
    amount. The output in this sample code would be 4, since “test” is four characters
    long.


    ## Concatenating Strings


    Concatenating is the joining together of two strings. There are different ways
    of joining two strings together, such as the join + operator or the concat method.
    Here are a few examples:


    Example 1:


    String text = “Hello ”;


    String text2 = “World!”;


    System.out.println(text + text2);


    Output: Hello World


    Example 2:


    String text = “Hello ”;


    String text2 = “World!”;


    System.out.println(text.concat(text2));


    Output: Hello World


    Example 3:


    String text = “Hello”;


    String text2 = “World!”;


    System.out.println(text + “ fun ” + text2 + “ of programming!”);


    Output: Hello fun world of programming!


    Example 4:


    String text = "Hello";


    String text2 = "World";


    System.out.println(text.concat(" fun ").concat(text2).concat(" of programming!"));


    Output: Hello fun world of programming!


    As shown in the examples above, you are able to use the .concat() method to join
    two strings together, or you can use the “+” operator.


    Here are various examples of the String object in action:


    Example 5: charAt(int index)


    String text = “Hello World!”;


    char letter = text.charAt(0);


    The value of “letter” contains the letter “H” because the inputted index of the
    string is 0, which is the first letter of the string. The way the computer reads
    the string is from 0 to the length of the string, not 1.


    Example 6: Equals(String anyText)


    String text = “Hello”;


    boolean doesItEqual = text.Equals(“Hello”);


    The value of doesItEqual is going to equal true in this case because the .Equals()
    method returns a boolean value (true or false) and the text does indeed equal
    Hello. Later on, you will learn about “if” statements, which can allow you to
    check whether or not something equals something else. When comparing two strings,
    you must always use the .Equals() method, but when comparing most other data types
    you will use “==.” You will learn more about this later on.


    Example 7: substring(int beginIndex)


    String text = “Hello World”;


    String justWorld = text.substring(6);


    Since the position of the letter “W” is 6, if you say substring(6) it will essentially
    divide that text starting from that position. Therefore, the “justWorld” variable
    ends up containing the value “World.”


    Example 8: trim()


    String text = “    Hello World   ”;


    String trimmedText = text.trim();


    As seen, the text variable has spaces in the beginning and the front. All the
    trim() method does is simply delete any spaces on the left or right side of the
    string of text. Therefore, the trimmedText would hold the value of “Hello World”
    instead of “    Hello World   .”


    There are many other String methods that can be referenced using the Java API
    to manipulate a String. An API is simply a directory of all the methods/functionalities
    and objects/classes of the Java platform that can be used to help the user program.
    It can be referenced here:


