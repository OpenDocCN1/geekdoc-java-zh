    \ `class` 关键字替换为 `interface` 关键字。在内部，你只能有方法声明。\n\n# 第 13 章\n\n# 包\n\n包本质上是组织代码的方式，特别是与其他项目一起。当你导入内容时，你正在使用包。`java.util`\
