    # Greetings and Welcome


    Hello and welcome to your new programming language. This book is an introduction
    to programming using Java. We’ll focus on breadth rather than depth. The goal
    is to be able to do something interesting as quickly as possible. We’ll start
    out with fairly detailed explanations because it’s important to have a thorough
    understanding of the basics, but as we go on, we’ll have to leave a lot of stuff
    out. Some of the topics could have an equally long guide themselves. You don’t
    need to understand all aspects of everything you read; what you should retain
    is knowledge that a particular capability exists and what it is called so that
    you can look it up when you need it. This is what most programmers do.


    The first few sections of the book are fairly self-contained with simple examples.
    You should certainly not read them without typing them into the interpreter; you’ll
    get even more out of the tutorial if you experiment with extending the examples
    yourself.


    The remainder of the tutorial is structured around building a program that does
    something interesting. This will allow us to touch on many aspects of programming
    that are necessary to write real world programs: reading and writing to disk;
    error handling; code organization into classes, modules, and packages; regular
    expressions; and user input. We’ll also touch on some general principles in programming,
    such as clarity and efficiency.


    Let''s get started!


    Alphy Books


    # Chapter 1


    # Let''s Start From The Beginning


    ## Short History


    We should start saying that Java is a programming language that was created by
    James Gosling from Sun Microsystems (Sun) in 1991 and first made publicly available
    in 1995, after Sun Microsystems was inherited by Oracle. The platform was originally
    designed for interactive television, but it surpassed the technology and design
    of the digital cable television industry at the time. Today, Java remains an open-source
    programming language that falls under the GPL (General Public License)


    The language derives much of its syntax from C and C++, but lacks the power of
    those languages because it asks less of the user (less customization, more simplicity).
    For example, tasks such as garbage collection (the process of reducing memory
    being used by the program) are automated in Java.


    Five principles were used in the creation of the Java programming language:


    It must be “simple, object-oriented, and familiar”


    It must be “robust and secure”


    It must be “architecture-neutral and portable”


    It must execute with “high performance”


    It must be “interpreted, threaded, and dynamic”


    An important design goal that was a key factor in Java’s sudden popularity is
    portability. In this context, “portability” means that code written in Java can
    be executed on any hardware, using any operating system.


    Java was built as an exclusively object-oriented programming language—which doesn’t
    mean much right now, but will later in this guide. For now, suffice it to say
    that object-oriented programming allows for the creation of efficient, organized,
    and powerful code. Simply put, Java is a multithreaded, object-oriented, platform-independent
    programming language. This means that Java programs can perform multiple tasks
    using object-oriented concepts that can work across all platforms and operating
    systems. It is the most important factor distinguishing Java from other languages.


    Java helps us to develop normal desktop applications, mobile applications, and
    web applications through the use of separate packages such as the J2ME package
    for mobile application development and the J2EE package for web application development.


    In this guide, we are going to learn the basics of object-oriented concepts as
    they apply to Java programming. We have two different types of application development
    concepts in Java: console-based application and GUI application development. Let’s
    see how to develop these types of applications using Java.


    ## What is Java?


    Java is a programming language that is supported by all devices, whether it is
    an Android phone, a Windows computer, or an Apple product. Java’s flexibility
    has made it one of the most popular programming languages around the globe. Java
    can be used to create web applications, games, Windows applications, database
    systems, Android apps, and much more.


    Java’s combined simplicity and power makes it different from other programming
    languages. Java is simple in that it doesn’t expect too much from the user in
    terms of memory management or dealing with a vast and complex hive of intricate
    classes extending from each other. Although this doesn’t make much sense right
    now, it will once we start learning about inheritance in Java.


    A Java program is run through a Java Virtual Machine (JVM), which is essentially
    a software implementation of an operating system that is used to execute Java
    programs. The compiler (process of converting code into readable instructions
    for the computer) analyzes the Java code and converts it into byte code, which
    then allows the computer to understand the instructions issued by the programmer
    and execute them in the appropriate manner.


    The distribution of the Java platform comes in two packages: the Java Runtime
    Environment (JRE) and the Java Development Kit (JDK). The JRE is essentially the
    Java Virtual Machine (JVM) that runs Java programs. The JDK, on the other hand,
    is a fully featured software development kit that includes the JRE, compilers,
    tools, etc.'
