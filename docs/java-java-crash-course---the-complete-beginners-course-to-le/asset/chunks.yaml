- fmt: "\nWe can write our data in various fonts inside the Applet window. Java offers\
    \ many fonts, including `Courier`, `Times New Roman`, and so on. `Font` class\
    \ helps us to define the new font object and can be set to the Applet window by\
    \ a pre-defined method.\n\n## Font Class\n\n### Constructor\n`Font(String name,int\
    \ style,int size)` — Creates a new font from the specified name, style, and size\n\
    \n### Methods\n- `abstract void setFont(f)` — Sets this graphic context font to\
    \ the specified font\n- `String getStyle()` — Returns a string value indicating\
    \ the current font style\n- `int getSize()` — Returns an integer value indicating\
    \ the current font size\n- `String getFamily()` — Returns the font family name\
    \ as a string\n- `boolean isPlain()` — Returns true if the font is plain (roman)\n\
    - `boolean isBold()` — Returns true if the font is bold\n- `boolean isItalic()`\
    \ — Returns true if the font is italic\n\n### Style Constants\n- `Font.BOLD` —\
    \ This is for bold font style\n- `Font.ITALIC` — This is for italic font style\n\
    - `Font.PLAIN` — This is for plain (roman) font style\n\n### Sample Program\n\
    ```java\nimport java.awt.*;\nimport java.applet.*;\n\n//<applet code=”SampleFont”\
    \ width=”600” height=”600”></applet>\n\npublic class SampleFont extends Applet\n\
    {\n    Font f1, f2;\n\n    public void init()\n    {\n        f1=new Font(“TimesRoman”,Font.BOLD,25);\n\
    \        f2=new Font(“Courier”,Font.ITALIC,40);\n    }\n\n    public void paint(Graphics\
    \ g)\n    {\n        g.setFont(f1);\n        g.drawString(“This is Times Roman\
    \ Font”,100,100);\n        g.setFont(f2);\n        g.drawString(“This is Courier\
    \ Font”,100,200);\n    }\n}\n```\n![](Image00008.jpg)\n\n## Color Class\n\n`Color`\
    \ class helps us to create different sets of colors with color class constructors.\
    \ You can set the background and foreground color of the Applet window by using\
    \ the color class methods. We have many pre-defined methods in color class.\n\n\
    ### Color Class Constructor\n`Color c1=new Color(Red,Green,Blue)`\n\nIn this constructor,\
    \ we have to specify the RGB values. These values start from 0 and go up to 255.\
    \ When you specify the RGB values in this range, a new color will be produced\
    \ depending on your data. We have color constants too, which are listed here with\
    \ their equal RGB values.\n\n| Color Constant | RGB Value |\n| :--- | :--- |\n\
    | `Color.red` | 255, 0, 0 |\n| `Color.green` | 0, 255, 0 |\n| `Color.blue` | 0,\
    \ 0, 255 |\n| `Color.magenta` | 255, 0, 255 |\n| `Color.cyan` | 0, 255, 255 |\n\
    | `Color.yellow` | 255, 255, 0 |\n\n### Methods of Color Class\n- `setColor()`\
    \ — This method will set color to an object. It has only one parameter, so you\
    \ can pass any color constant value or color class object.\n- `setBackground()`\
    \ — This method will set the background color of an applet. It also has only one\
    \ parameter, which is color class object or color constant value.\n- `setForeground()`\
    \ — This method is used to change the color of the whole applet after it has been\
    \ drawn.\n- `Color getBackground()` — This method will return the background color\
    \ of the Applet window.\n- `Color getForeground()` — This method will return the\
    \ foreground color class object.\n\n### Sample Program\n```java\nimport java.applet.*;\n\
    import java.awt.*;\n\n//<applet code=”SampleColor” width=”400” height=”400”></applet>\n\
    \npublic class SampleColor extends Applet\n{\n    Color c1,c2;\n\n    public void\
    \ init()\n    {\n        c1=new Color(10,255,200);\n        c2=new Color(100,100,100);\n\
    \    }\n\n    public void paint(Graphics g)\n    {\n        g.setBackground(c1);\n\
    \        g.drawString(“Color Class object 1”,200,200);\n        g.setForeground(c2);\n\
    \        g.drawString(“Color Class object 2”,250,250);\n    }\n}\n```\n![](Image00009.jpg)\n\
    \nIn this example program we have declared two color class objects: `c1` and `c2`.\
    \ Then, `c1` and `c2` have been created inside the `init()` method by using the\
    \ `Color` class constructor. Inside the `paint()` method, we have set `c1` as\
    \ the Background color of the applet window and `c2` as the foreground.\n\n##\
    \ Components of the Applet Window\n\nComponents are nothing more than controls\
    \ of the AWT package such as a text box, list box, choice box, button, scrollbar,\
    \ and so on. Each component class has its own methods and constructor. Component\
    \ constructors help us to create the component and add to the applet window. Here\
    \ we have listed the important component classes along with their methods and\
    \ constructors.\n\n### Component Class\n\nWe can distinguish the following components:\n\
    \n#### 1. Label Components\nThe `Label` component helps us to display some text\
    \ in the applet window. Of all the components, it is the only one that doesn’t\
    \ have any events. It just shows the text given inside the constructor of the\
    \ label. `Label` class has its own constructor and methods.\n\n**Constructor of\
    \ the Label Components**\n- `Label()` — Empty constructor; will just create the\
    \ label without any text information.\n- `Label(String str)` — Will create the\
    \ label with given text.\n- `Label(String str,int Alignment)` — Will create a\
    \ label that you can align wherever you want.\n\n**Methods:**\n- `getText()` —\
    \ Will return the label text from the label.\n- `setText()` — Will set the text\
    \ as a label.\n\n**Sample Program**\n```java\nimport java.awt.*;\nimport java.applet.*;\n\
    \n//<applet code=”SampleLabel” width=”200” height=”200”></applet>\n\npublic class\
    \ SampleLabel extends Applet\n{\n    Label L1,L2,L3;\n\n    public void init()\n\
    \    {\n        L1=new Label(“First Label”,Label.LEFT);\n        L2=new Label(“Second\
    \ Label”,Label.RIGHT);\n        L3=new Label(“Third Label”);\n        add(L1);\n\
    \        add(L2);\n        add(L3);\n    }\n}\n```\nIn this example we have added\
    \ label components: `L1`, `L2`, and `L3`. The first label box, `L1`, is aligned\
    \ on the left; the second label box, `L2`, is aligned to the right. The final\
    \ one, `L3`, is added to applet window.\n\n#### 2. Button Component\n`Button`\
    \ components are used to perform any action or task when the user presses that\
    \ button. We have a button class with two constructors and some predefined methods\
    \ to handle the button. If you press the button, it will generate an Action Event.\n\
    \n**Constructors of Button Class**\n- `Button()` — This is an empty constructor.\
    \ It will create a button without label text.\n- `Button(String str)` — This is\
    \ a parameterized constructor. It will create a button with label text.\n\n**Methods\
    \ of Button Class**\n- `addActionListener(ActionListener L)` — Adds an Event to\
    \ the newly created component.\n- `getActionCommand()` — Returns label text of\
    \ the button after you press the button.\n- `getLabel()` — Returns the label text\
    \ of the button.\n- `setLabel(String text)` — Sets the given text as a Button\
    \ label.\n- `getSource()` — Returns the pressed button object.\n\n**Sample Program**\n\
    ```java\nimport java.awt.*;\nimport java.awt.event.*;\nimport java.applet.*;\n\
    \npublic class SampleButton extends Applet implements ActionListener\n{\n    String\
    \ str = \" \";\n    Button b1, b2, b3;\n\n    public void init()\n    {\n    \
    \    b1 = new Button ( \"First Button\");\n        b2 = new Button (\"Second Button\"\
    );\n        b3 = new Button (\"Third Button\");\n        add(b1);\n        add(b2);\n\
    \        add(b3);\n        b1.addActionListener (this);\n        b2.addActionListener\
    \ (this);\n        b3.addActionListener(this);\n    }\n\n    public void actionPerformed(ActionEvent\
    \ ae)\n    {\n        if(ae.getSource()==b1) {\n            str = \"You pressed\
    \ Button 1.\";\n        }\n        else if(ae.getSource()==b2) {\n           \
    \ str = \"You pressed Button 2.\";\n        }else {\n            str = \"You pressed\
    \ Button 3.\";\n        }\n        repaint();\n    }\n\n    public void paint(Graphics\
    \ g)\n    {\n        g.drawString(str,6,100);\n    }\n}\n\n//<applet code=\"SampleButton.class\"\
    \ width = 300 height = 100></applet>\n```\n"
  raw: 'We can write our data in various fonts inside the Applet window. Java offers
    many fonts, including Courier, Times New Roman, and so on. Font class helps us
    to define the new font object and can be set to the Applet window by a pre-defined
    method.


    Constructor


    Font(String name,int style,int size)___Creates a new font from the specified name,
    style, and size


    Methods


    abstract void setFont(f)___Sets this graphic context font to the specified font


    String getStyle()___Returns a string value indicating the current font style


    int getSize()___Returns an integer value indicating the current font size


    String getFamily()___Returns the font family name as a string


    boolean isPlain()___Returns true if the font is plain (roman)


    boolean isBold()___Returns true if the font is bold


    boolean isItalic()___Returns true if the font is italic


    Style Constants


    Font.BOLD ___This is for bold font style


    Font.ITALIC ___This is for italic font style


    Font.PLAIN ___This is for plain (roman) font style


    Sample Program


    import java.awt.*;


    import java.applet.*;


    //<applet code=”SampleFont” width=”600” height=”600”></applet>


    public class SampleFont extends Applet


    {


    Font f1, f2;


    public void init()


    {


    f1=new Font(“TimesRoman”,Font.BOLD,25);


    f2=new Font(“Courier”,Font.ITALIC,40);


    }


    public void paint(Graphics g)


    {


    g.setFont(f1);


    g.drawString(“This is Times Roman Font”,100,100);


    g.setFont(f2);


    g.drawString(“This is Courier Font”,100,200);


    }


    }


    ![](Image00008.jpg)


    ### Color Class


    Color class helps us to create different sets of colors with color class constructors.
    You can set the background and foreground color of the Applet window by using
    the color class methods. We have many pre-defined methods in color class.


    Color Class Constructor


    Color c1=new Color(Red,Green,Blue);


    In this constructor, we have to specify the RGB values. These values start from
    0 and go up to 255\. When you specify the RGB values in this range, a new color
    will be produced depending on your data. We have color constants too, which are
    listed here with their equal RGB values.


    Color Constant ___RGB Value


    Color.red ___255, 0, 0


    Color.green ___0, 255, 0


    Color.blue ___0, 0, 255


    Color.magenta ___255, 0, 255


    Color.cyan ___0, 255, 255


    Color.yellow ___255, 255, 0


    Methods of Color Class


    setColor()___This method will set color to an object. It has only one parameter,
    so you can pass any color constant value or color class object.


    setBackground()___This method will set the background color of an applet. It also
    has only one parameter, which is color class object or color constant value.


    setForeground()___This method is used to change the color of the whole applet
    after it has been drawn.


    Color getBackground()___This method will return the background color of the Applet
    window.


    Color getForeground()___This method will return the foreground color class object.


    Sample Program


    import java.applet.*;


    import java.awt.*;


    //<applet code=”SampleColor” width=”400” height=”400”></applet>


    public class SampleColor extends Applet


    {


    Color c1,c2;


    public void init()


    {


    c1=new Color(10,255,200);


    c2=new Color(100,100,100);


    }


    public void paint(Graphics g)


    {


    g.setBackground(c1);


    g.drawString(“Color Class object 1”,200,200);


    g.setForeground(c2);


    g.drawString(“Color Class object 2”,250,250);


    }


    }


    ![](Image00009.jpg)


    In this example program we have declared two color class objects: c1 and c2\.
    Then, c1 and c2 have been created inside the init() method by using the Color
    class constructor. Inside the paint() method, we have set c1 as the Background
    color of the applet window and c2 as the foreground color.


    Components of the Applet Window


    Components are nothing more than controls of the AWT package such as a text box,
    list box, choice box, button, scrollbar, and so on. Each component class has its
    own methods and constructor. Component constructors help us to create the component
    and add to the applet window. Here we have listed the important component classes
    along with their methods and constructors.


    ### Component Class


    We can distinguish the following components:


    1.  Label Components


    The Label component helps us to display some text in the applet window. Of all
    the components, it is the only one that doesn’t have any events. It just shows
    the text given inside the constructor of the label. Label class has its own constructor
    and methods.


    Constructor of the Label Components


    Label()___Empty constructor; will just create the label without any text information.


    Label(String str)___Will create the label with given text.


    Label(String str,int Alignment)___Will create a label that you can align wherever
    you want.


    Methods:


    getText()___Will return the label text from the component.


    setText()___Will set the text as a label.


    Sample Program


    import java.awt.*;


    import java.applet.*;


    //<applet code=”SampleLabel” width=”200” height=”200”></applet>


    public class SampleLabel extends Applet


    {


    Label L1,L2,L3;


    public void init()


    {


    L1=new Label(“First Label”,Label.LEFT);


    L2=new Label(“Second Label”,Label.RIGHT);


    L3=new Label(“Third Label”);


    add(L1);


    add(L2);


    add(L3);


    }


    }


    In this example we have added three label box components: L1, L2, and L3\. The
    first label box, with the label “First Label,” is aligned on the left side; the
    second label box, with the label “Second Label,” is aligned to the right. The
    final one, with the label “Third Label.” All label boxes are added to an applet
    window. As has already been said, label boxes don’t have any events and so they
    only display the label specified in the label component constructor.


    2.  Button Component


    Button components are used to perform any action or task when the user presses
    that button. We have a button component class with two constructors and some predefined
    methods to handle the button component. If you press the button, it will generate
    an Action Event that is handled by the ActionListener Interface. It has a method
    that is executed when we press the button. Once the Action Event is generated,
    the void actionPerformed(ActionEvent e) method will be executed. In the following
    section, we will see what kind of methods are defined under the Button Component
    class.


    Constructors of Button Class


    Button() ___This is an empty constructor. It will create a button without any
    label text.


    Button (String str) ___This is a parameterized constructor. It will create a button
    with label text.


    Methods of Button Class


    addActionListener(ActionListener L)___Adds an Event to the newly created component.


    getActionCommand()              ___Returns label text of the Button after you
    press the button.


    getLabel()___Returns the label text of the button.


    setLabel(String text)___Sets the given text as a Button label.


    getSource()___Returns the pressed button object.


    Sample Program


    import java.awt.*;


    import java.awt.event.*;


    import java.applet.*;


    public class SampleButton extends Applet implements ActionListener {


    String str = " ";


    Button b1, b2, b3;


    public void init() {


    b1 = new Button ( "First Button");


    b2 = new Button ("Second Button");


    b3 = new Button ("Third Button");


    add(b1);


    add(b2);


    add(b3);


    b1.addActionListener (this);


    b2.addActionListener (this);


    b3.addActionListener(this);


    }


    public void actionPerformed(ActionEvent ae) {


    if(ae.getSource()==b1) {


    str = "You pressed Button 1.";


    }


    else if(ae.getSource()==b2) {


    str = "You pressed Button 2.";


    }else {


    str = "You pressed Button 3.";


    }


    repaint();


    }


    public void paint(Graphics g) {


    g.drawString(str,6,100);


    }


    }


    //<applet code="SampleButton.class" width = 300 height = 100></applet>


    ![](Image00010.jpg)'
