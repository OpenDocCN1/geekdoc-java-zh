  trans: "\n\n对于接下来的示例，我将使用 `if` 语句。简单来说，`if` 语句用于检查某个条件是否为真或假。要创建一个 `if` 语句，你只需要写\
    \ `if` 单词并在后面跟两个圆括号。括号内包含检查某个条件是否为真的逻辑。`if` 语句还可以包含 `else if` 语句和 `else` 语句。如果\
    \ `if` 语句返回假，则会执行 `else if` 语句。然而，它也包含一个必须返回真的自身的参数。当 `if` 语句返回假时，也会执行 `else`\
    \ 语句。`else` 语句与 `else if` 语句的区别在于，`else` 语句的执行不需要任何参数为真即可即可运行。\n\n### 示例\n```java\n\
    int a = 10;\nint b = 20;\n\nif (a == b) {\n    System. out .println(\"a is equal\
    \ to b \");\n}\nelse if (a > b) {\n    System. out .println(\"a is greater than\
    \ b \");\n}\nelse {\n    System. out .println(\"a is not equal to b or greater\
    \ than b \");\n}\n```\n\n此示例中使用的操作符（`==` 和 `>`）在下文中解释。在接后的代码中，我们首先检查 `a` 是否等于\
    \ `b`。如果为，我们就打印 `a is equal to b` 并忽略代码的剩余部分。如果 `a` 不等于 `b`，则程序调用 `else if`。执行\
    \ `else` 是由于第一个 `if` 返回了假。`else if` 的 `if` 部分检查它自身的参数，在本文情况下是检查 `a` 是否大于 `b`。如果\
    \ `a` 大于 `b`，那么程序就会打印 `a is greater than b`。然而，由于 `a` 小于 `b`，我们继续向下运行并简单地调用 `else`，它会在上述所有参数都返回假时运行时运行。它不需要要求自身的参数为真。\n\
    \n请注意，每个 `if` 语句后面可以跟无限数量的 `else if` 语句，但只能有一个 `else` 语句。同样注意，你不能在 `if` 语句和 `else`\
    \ 语句之间放置代码，因为代码将无法找到 `else`。此外，`else` 语句要求前面有一个 `if` 语句，因为为了调用 `else` 语句，紧接其前的\
    \ `if` 语句必须等于假。同样重要的一点是，可以在另一个 `if` 语句**内部**包含一个 `if` 语句。这被称为**嵌套的 if 语句**。\n\n\
    ### 示例\n```java\nint a = 20;\nint b = 30;\n\nif (a == 20) {\n    if (a < b) {\n\
    \        System. out .println(\"a is less than b and it is equal to 20\");\n \
    \   }\n}\n```\n\n在这个示例中，我们首先检查 `a` 的值是否等于 `b` 的值。如果是，我们检查 `a` 的值是否小于 `b` 的值。如果该语句也返回真，我们就可以在控制台上打印\
    \ `a is less than b and it is equal to 20`。这可以适用于任意数量的 `if` 语句。如果非常有必要单独检查参数，或者你想在每次检查之间添加额外的逻辑，这将非常有用。在在本节结束时，你将完全理解\
    \ `if` 语句的工作方式。\n\n## 关系运算符\n\nJava 支持 6 种不同的关系运算符，它们用于比较变量的值。它们如下：\n\n### `==`\n\
    该操作符检查两个整数的值是否相等。如果它们相等，操作符返回 `true`。如果不相等，它则返回 `false`。\n\n#### 示例\n```java\n\
    int a = 10;\nint b = 10;\n\nif (a == b) {\n    System. out .println(\"they are\
    \ the same\");\n}\n```\n这段代码检查 `a` 的值是否等于 `b` 的值。由于 `a` 的值等于 `b` 的值，括号内的值将为 `true`。这导致上面的代码打印出\
    \ `they are the same` 语句。\n\n### `!=`\n该操作符检查两个东西是否**不相等**。如果两个东西**不等于**相同的东西，它将返回\
    \ `true`。如果它们**等于**相同的东西，它将返回 `false`。\n\n#### 示例\n```java\nint a = 10;\nint b\
    \ = 20;\n\nif (a != b) {\n    System. out .println(\"they are not the same\");\n\
    }\n```\n这段代码将检查 `a` 是否等于 `b`。由于 `a` 不等于 `b`，程序将在控制台打印 `they are not the same`。\n\
    \n### `>`\n该操作符检查某个东西是否大于另一个东西。如果前面的变量的值大于后面变量的值，它将返回 `true`。如果前面的变量的值小于后面变量的值，它将返回\
    \ `false`。\n\n#### 示例\n```java\nint a = 10;\nint b = 20;\n\nif (a > b) {\n   \
    \ System. out .println(\"a is larger than b\");\n}\nelse {\n    System. out .println(\"\
    a is not larger than b\");\n}\n```\n（注：此处原文代码块未闭合，已按逻辑补齐）\n此示例检查 `a` 是否大于 `b`。由于\
    \ `a` 小于 `b`，执行 `else` 部分。\n\n### `<`\n该操作符检查某个东西是否小于另一个东西。如果前面的变量的值小于后面变量的值，它将返回\
    \ `true`。\n\n#### 示例\n```java\nint a = 10;\nint b = 20;\n\nif (a < b) {\n    System.\
    \ out .println(\"a is less than b\");\n}\n```\n\n### `>=`\n该操作符检查某个东西是否大于等于另一个东西。如果前面的变量的值大于等于后面变量的值，它将返回\
    \ `true`。\n\n#### 示例\n```java\nint a = 20;\nint b = 20;\n\nif (a >= b) {\n   \
    \ System. out .println(\"a is greater or equal\");\n}\n```\n\n### `<=`\n该操作符检查某个东西是否小于等于另一个东西。如果前面的变量的值小于等于后面变量的值，它将返回\
    \ `true`。\n\n#### 示例\n```java\nint a = 20;\nint b = 20;\n\nif (a <= b) {\n   \
    \ System. out .println(\"a is less or equal\");\n}\n```\n\n## 逻辑运算符\n\nJava 支持三种逻辑运算符用于你的逻辑判断，它们通常与关系运算符结合使用。\n\
    \n### `&&`\n这被称为逻辑与（AND）操作符。如果该操作符前后的操作数都返回 `true`，则条件返回 `true`。如果两个操作数都为假，或者其中一个操作数为假，条件将返回\
    \ `false`。**所有**操作数都为真时，条件才会返回真。\n\n#### 示例\n```java\nint a = 20;\nint b = 20;\n\
    \nif (a == 20 && a == b) {\n    System. out .println(\"a is equal to 20 and b\
    \ \");\n}\nelse {\n    System. out .println(\"a is not equal to 20 or a is not\
    \ equal to b\");\n}\n```\n在这个示例中，我们检查 `a` 是否等于 20 且 `a` 是否等于 `b`。这两个条件被称为操作数。由于\
    \ `a` 等于 20 且等于 `b`，该语句返回真，我们打印 `a is equal to 20 and b`。\n\n#### 示例 2\n```java\n\
    int a = 20;\nint b = 30;\n\nif (a == 20 && a == b) {\n    System. out .println(\"\
    a is equal to 20 and b\");\n}\nelse {\n    System. out .println(\"a is not equal\
    \ to 20 or a is not equal to b\");\n}\n```\n\n"
