    \              System.out.println(“Yuck! This food is rotten!”);\n           \
    \ }\n        };\n\n        specialFood.eat();// “Yuck! This food is rotten!”\n\
    \    }\n\n}\n```\n\nA common use for anonymous inner classes is dealing with input\
    \ listeners. Rather than creating classes for each type of listener—key listener,\
    \ mouse listener, mouse wheel listener, etc.—it may be easier to make anonymous\
    \ inner classes. This heavily depends on what you are using it for.\n\n# Chapter\
    \ 12\n\n# Interfaces and Abstract Classes in Java\n\nThere are also some special\
    \ types of classes, specifically, interfaces and abstract classes.\n\nAbstract\
    \ classes are classes that cannot be instantiated—you cannot make an object of\
    \ an abstract class. You can, however, make objects of children of the abstract\
    \ class. This is useful when you want a group of classes to have a common set\
    \ of variables or methods, but do not want to have an unspecified object. Abstract\
    \ classes require the use of upcasting and downcasting. Abstract classes are defined\
    \ by the `abstract` keyword before the class keyword. On top of this, abstract\
    \ classes can contain abstract methods. This means that you can call a method\
    \ in an abstract type and it will run the method of the child class. Abstract\
    \ methods must always be contained inside abstract classes, and are defined by\
    \ placing the `abstract` keyword before the return type of the method. Abstract\
    \ methods also do not have a body; they simply end in a semicolon after their\
    \ parameters. When a child inherits from the parent abstract class, it must override\
    \ or define abstract methods. Abstract classes can also contain normal methods\
    \ in order to add common functionality, as in normal classes.\n\n```java\nabstract\
    \ class Food\n{\n    public abstract void saySomething();\n\n    public static\
    \ void main (String args[])\n\n    {\n\n        Food a = new Fruit();\n      \
    \  Food b = new Meat();\n        a.saySomething();//”This fruit is delicious!”\n\
    \        b.saySomething();//”This meat is delicious!” even    }\n\n}\n\nclass\
    \ Fruit extends Food\n{\n    public void saySomething()\n    {\n        System.out.println(“This\
    \ fruit is delicious!”);\n    }\n}\n\nclass Meat extends Food\n{\n    public void\
    \ saySomething()\n    {\n        System.out.println(“This meat is delicious!”);\n\
    \    }\n}\n```\n\nInterfaces are similar to abstract classes in that they can\
    \ provide methods that must be overridden and they cannot be objects. Interfaces\
    \ cannot have variables in them. Interfaces cannot be “extended” to, but are instead\
    \ “implemented” to. The difference is that while extending can only be done onto\
    \ one class—meaning you can only have one parent—implementing can be done onto\
    \ several interfaces, not classes. Interfaces are used when you need a number\
    \ of unrelated classes to share common methods. To create an interface, simply\
    \ create a class, but replace the class keyword with the interface keyword. Inside,\
    \ you may only have method declarations—the return type, method name, and parameters—followed\
    \ by a semicolon. This is similar to abstract methods, except you do not use the\
    \ `abstract` keyword. To implement, simply put the `implements` keyword after\
    \ either the class name or (if there is a parent class) after the parent class\
    \ name.\n\n```java\ninterface Eatable\n{\n    public void eatObject();\n\n   \
    \ public static void main(String[] args)\n\n    {\n\n        Food fruit = new\
    \ Fruit();\n        Eatable stapler = new Stapler();\n        fruit.eatObject();\
    \ // “Mmmm...juicy”\n        stapler.eatObject(); // How do you think eating a\
    \ stapler will end?\n    }\n\n}\n\nabstract class Food implements Eatable{}\n\n\
    class Fruit extends Food\n{\n    public void eatObject()\n    {\n        System.out.println(“Mmmmm...juicy”);\n\
    \    }\n}\n\nclass Stapler implements Eatable\n{\n    public void eatObject()\n\
    \    {\n        System.out.println(“AAAAHHHH! THIS WAS A TERRIBLE IDEA! CALL AN\
    \ AMBULANCE! WHY DID I EAT A STAPLER?”);\n    }\n}\n```\n\nNotice that since the\
    \ `Food` class is abstract, you do not need to override `Eatable`’s method, unless\
    \ you want all foods to have a default action for this method. Be aware that since\
