  raw: 'Threading is a way to run two “threads” of code at the same time. Threading
    does not necessarily make your program run faster, but it can in select situations.
    Threading shares processing power, so it does not speed up any code. Threading
    works like two very nice people walking through a corridor divided by tons of
    doors. The first person lets the second go through the first door, then the second
    person lets the first go through the second door, and repeat. What threading allows
    programmers to do is run loops that will run for a very long time while still
    doing other things in the background. For example, if you want your program to
    accept a connection from another computer, you could run a loop that constantly
    “listens” for a connection. The problem with this is that your program will freeze
    while it listens. Instead, we use a thread to listen for a connection, and then
    do other things in our main thread. We would show the user something like a GUI
    (next section) and give them feedback based on the listening status. So how do
    we make a thread? First, we make a “Runnable.” Simply implement Runnable and then
    override its run method. Next, we create a thread object with the parameter of
    a MyRunnable object (or any class that implements Runnable), and finally call
    <thread object>.start().


    class MyRunnable implements Runnable


    {


    public void run()


    {


    while(true) // This loops runs forever!


    {


    System.out.println(“Groundhog Day!”);


    }


    }


    public static void main(String[] args)


    {


    Runnable runThis = new MyRunnable();


    Thread aThread = new Thread(runThis);


    aThread.start();


    while(true)


    {


    System.out.println(“Bill Murray!”);


    }


    }


    }


    The code above will now run two infinite, unrelated loops, and will “randomly”
    print out either “Groundhog Day!” or “Bill Murray!” Threading is not limited to
    infinite loops, though; they are simply for whenever you need two concurrent lines
    of processing. For example, say you’re making a loading menu for a video game.
    You may make one thread load the game data, and then simply put its status into
    a variable (like how many files have been loaded). Then you could have another
    thread modify your window or console or whatever to tell the user the status of
    loading based on the variable that the original thread is using. This is how (most)
    loading bars are made.


    ## Life Cycle of Thread


    There are four stages are involved in the life of cycle of a thread. They are


    *   Born state


    *   Runnable state


    *   Blocked state


    *   Dead state


    ### New Born State


    When a thread is created, it is in the new state. New implies that the thread
    object has been created but it has not started running. It requires the start
    () method to start it.


    ### Runnable State


    A thread is said to be in runnable state while it is executing a set of instructions.
    The run () method contains the set of instructions. This method is called automatically
    after the start () method.


    ### Blocked State


    The thread could be run but there is something preventing it. While a thread is
    in a blocked state, the scheduler will simply skip over it and not give it any
    CPU time. Until a thread reenters a runnable state, it will not perform any operations.


    wait () - notify()


    suspend () - resume()


    sleep(milliseconds)


    ### Dead State


    The normal way for a thread to die is by returning from its run () method. We
    can also call stop (), but this throws an exception that is a subclass of Error
    (which means we normally do not catch it).


    ## Creation of Threads


    In Java, you can create a thread in two different ways. The first one would be
    to use Runnable interface, and second one uses the Thread Class. Runnable interface
    has only one method, which is run() method and a constructor. Thread class contains
    so many methods with help of that methods you can know the basic information’s
    of the thread.


    ## Common Methods


    *   start()              


    The start() starts execution of the invoking object. It can throw an IllegalThreadStateException
    if the thread was already started.


    *   stop()


    This method terminates the invoking object.


    *   suspend()


    This method suspends the invoking object. The thread will become runnable again
    if it gets the resume () method.


    *   sleep()


    This method suspends execution of the executing thread for the specified number
    of milliseconds. It can throw an InterruptedException.


    ## Thread Class Methods


    *   activeCount()


    This method will return the current number of active Threads in this thread group.


    *   currentThread()


    This will return a reference to the currently executing thread object; it is a
    static method.


    *   isAlive()


    This method will check whether a given thread is alive.


    *   getName()


    This will get and return this Thread’s name.


    *   getPriority()


    This will get and return the Thread’s priority.


    *   setName(String)


    This method is used to set the Thread’s name.


    *   setPriority(int)


    This is the method used to set the Thread’s priority.


    *   toString()


    This will return a string representation of the Thread, including the thread’s
    name, priority, and thread group.


    Example: Thread program created with Runnable interface


    class RunnableDemo implements Runnable


    {


    Thread t;


    RunnableDemo(String name)


    {


    t = new Thread(this,name);  //new born state


    t.start();


    }


    public void run()


    {


    try


    {


    for(int i=1;i<=5;i++)


    {


    System.out.println(t.getName() + " : " + i);


    Thread.sleep(500);


    }


    }


    catch(InterruptedException e)


    {


    System.out.println("Exception : " + e);


    }


    }


    public static void main(String args[])


    {


    System.out.println("Main Thread");


    RunnableDemo d1 = new RunnableDemo("Thread No");


    try


    {


    for(int j=1;j<=5;j++)


    {


    System.out.println(“Thread Yes : " + j);


    Thread.sleep(1000);


    }


    }


    catch(InterruptedException e)


    {


    System.out.println("Exception : " + e);


    }


    }


    }


    In this example program, we have created two threads with the help of Runnable
    interface. The name of the first thread is Thread No and the second one is Thread
    Yes. First we create an object for a RunnableDemo class that will invoke the constructor
    the RunnableDemo, where we are creating a new thread called Thread No. This thread
    goes into Sleep mode every 500 milliseconds so the second thread will be executed
    and print Thread Yes 1 before it goes into sleep mode. Next, Thread No will restart
    its execution and run until the given condition becomes false.


    ## Thread Priority


    Thread Priority changes the execution order of the thread. Maximum Priority thread
    will start its execution first, and Minimum Priority starts its execution last.
    You can specify the priority level as 1 to 10; we have some constants, too: MIN_PRIORITY
    – 1, NORM_PRIORITY-5, MAX_PRIORITY-10.


    The setPriority() method helps us to specify the Priority of the thread, as in
    the following example:


    Example


    class Prio extends Thread {


    Thread t;


    Prio(String m) {


    t = new Thread(this,m);


    System.out.println("\n Thread : "+t.getName());


    System.out.println("Priority : "+t.getPriority());


    t.start();


    }


    public void run() {


    System.out.println("New Priority : "+t.getPriority());


    try {


    System.out.println("\n"+t.getName()+" is in wait stage");


    t.sleep(1000);


    }


    catch(Exception e) { }


    System.out.println(t.getName()+" completed the Process");


    }


    }


    class Priority {


    public static void main(String a[]) {


    System.out.println("\n Main Starts the Process");


    Prio x = new Prio("First Thread");


    Prio y = new Prio(“Second Thread");


    x.t.setPriority(3);


    y.t.setPriority(8);


    System.out.println("\n Main Completed the Process");


    }


    }


    In this program we are creating two threads named First Thread and Second Thread.
    In the beginning, First Thread has Normal priority, so it starts its process.
    After calling the first thread constructor, it goes to the Sleep mode and then
    the Second Thread execution starts; it also goes into Sleep mode but Second Thread
    will restart its execution because it has higher priority than First Thread.


