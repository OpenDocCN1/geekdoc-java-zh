    # Chapter 16


    # Generic Types


    Generic types allow us to make classes that are generic, which means that they
    can act differently based on what type is given. Generic types are given a list
    of classes by the programmer that will be used to define certain object types.
    Generic types are created by placing angled brackets ( < > ) after the class name,
    followed by a list of type identifiers. These work just as variable names, but
    the convention is to use capital letters, specifically T (for type), for one of
    them. These type identifiers can be used in place of data types. This allows you
    to keep certain variables a consistent type in order to prevent the need for casting.
    When creating a variable with the data type of the class using generic types,
    the data type must also have angled brackets containing a list of types corresponding
    to the class’s list of types. The object you create will also need the same set
    of angled brackets before the parameters


    class Something<A, B>


    {


    public A variableA;


    public B variableB;


    public Something(A varA, B varB)


    {


    this.variableA = varA;


    this.variableB = varB;


    }


    public static void main(String[] args)


    {


    // Class1 will be A, Class2 will be B


    Something<Class1, Class2> somethingElse = new Something<Class1, Class2>(new Class1(),
    new Class2());


    Class1 class1 = somethingElse.variableA; // This does not need to be type cast
    because variableA is actually of the Class1 type


    }


    }


    class Class1{}


    class Class2{}


    One common use of generic types is ArrayList, a class in the java.util package.
    ArrayList is a dynamic array, meaning that you can change the number of elements
    in the array after it has already been initialized. ArrayList uses generic types
    to prevent programmers from adding objects of the wrong type, and also helps programmers
    to cast objects to the desired type. Here is a small example using ArrayList.


    class Food


    {


    public String name;


    public Food(String name)


    {


    this.name = name;


    }


    public static void main(String[] args)


    {


    ArrayList<Food> basket = new ArrayList<Food>();


    basket.add(new Food(“Pear”));


    basket.add(new Food(“Apple”));


    basket.add(new Food(“Orange”));                           


    basket.add(new Food(“Apple”));                           


    basket.add(new Food(“Pomegranate”));


    System.out.println(basket.get(2).name);// “Orange”


    basket.remove(3);


    System.out.println(basket.size());// “4”


    }


    }


    A good use of Array Lists involves “queues.” This is a way to do recursion (calling
    a method from within that method) without having to do recursion. Recursion is
    rather dangerous, since improper use can cause infinite loops that can quickly
    crash your program. Recursion is actually rather slow, for a variety of reasons,
    so it’s a good thing we have the option of using queues. Essentially, you create
    an ArrayList of data (usually in the form of a class), add a starting element
    to the array, and then for as long as the ArrayList is not empty (or hasn’t completed
    your task in some way), it will continue to perform some code given the values
    in your ArrayList before it ultimately removes that element from the ArrayList.
    Your code could add elements to the ArrayList that add new cycles, just as in
    a recursive method, and you could call the method again to add a new layer of
    depth (like a cycle).


    Queues are not necessarily “better” than recursive methods. Queues are meant for
    branching recursive “paths,” specifically in the case of finding optimal solutions.
    This could be used in path finding for video games, or for real life. Logically,
    we could try a path that seems closest to the target, and if that path dead-ends,
    we can remove it from the queue and try the next closest path. Recursion could
    do this, but it would work like a tree (iteration-wise). Each path would most
    likely go from left to right and would go through each possibility. With queues,
    you can go from any part of the iteration tree to any other part of the iteration
    tree, which allows computers to potentially find a route using the fastest method.
    Both recursion and queues could reach the same end, but it depends on the way
    you have structured your system. For single-path recursion, meaning the recursive
    method only calls itself once per method call, it is usually best to use a recursive
    method. If you are doing something where you are trying to find some sort of path,
    it may be faster to use a queue. But this is all speculation. Realistically, if
    you want to properly optimize your code, you simply need to test and see which
    version is faster. Remember that you need a variety of test cases when optimizing.
    Simply testing a few similar types of test cases can cause performance increases
    in other tests. For example, your code could take an exponential amount of time,
    or a linear amount of time, and different ways of doing something could have different
    “equations” for their amount of run time, which certain test cases may not take
    advantage of.


