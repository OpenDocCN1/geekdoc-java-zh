    ## 6. List Box


    This component contains a list of items that we can select from. This component
    also generates an `Item Event`, so it is also handled by the `Item Listener` method
    `itemStateChanged()`. This component class contains three constructors to create
    the List box and a set of methods to handle the list box item.


    ### Constructors of List box


    - `List()`___Creates a scrollable list box.

    - `List(int rows)`___Create a scrollable list box that only shows the number of
    items specified in the constructor; the rest of the items will become visible
    as you scroll through the list box.

    - `List(int rows, Boolean Multiple)`___Creates a scrollable list box that only
    shows the number of items specified in the constructor; the rest of the items
    will become visible as you scroll through the list box. If you set multiple mode
    as true mean, then you can select more than one item in the list box.


    ### Methods of the List component class


    - `add(String item)`___Adds the specified item at the end of the scrolling list.

    - `add(String item, int index)`___Adds the specified item at the specified position.

    - `deselect(int index)`___Deselects the item at the specified index.

    - `getItem(int index)`___Returns the item at the specified index.

    - `getItemCount()`___Returns the number of items in the list component.

    - `getItems()`___Returns the items in the list.

    - `getRows()`___Returns the number of visible lines in the corresponding list.

    - `int[] getSelectedIndexes()`___Returns the index of the selected item in the
    list.

    - `getSelectedItem()`___Returns the selected item in the corresponding list.

    - `select(int index)`___Selects the item at the specified index in the corresponding
    list.

    - `setMultipleMode(Boolean b)`___Sets the flag that allows multiple selection
    in the corresponding list.


    ### Sample Program


    ```java

    import java.awt.*;

    import java.awt.event.*;

    import java.applet.*;


    public class SampleList extends Applet implements ItemListener {


    List country,city;


    String str = new String();


    public void init() {

    country = new List(2);

    city = new List(4);

    country.add("India");

    country.add("USA");

    country.add("England");

    country.add("Canada");

    city.add("Newyork");

    city.add("New Delhi");

    city.add("London");

    city.add("Toronto");

    add(country);

    add(city);

    country.addItemListener(this);

    city.addItemListener(this);

    }


    public void itemStateChanged(ItemEvent ie) {

    repaint();

    }


    public void paint(Graphics g) {

    str = "Selected Country : ";

    str += country.getSelectedItem();

    g.drawString(str,6,120);

    str = "Selected City : ";

    str += city.getSelectedItem();

