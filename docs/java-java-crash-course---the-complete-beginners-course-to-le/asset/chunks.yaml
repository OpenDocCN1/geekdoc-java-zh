    \       catch(Exception e) {}\n        }\n        else if(ae.getSource() == mExit)\n\
    \        {\n            dispose();\n            System.exit(0);\n        }\n \
    \   }\n\n    public static void main(String args[])\n    {\n        Java_Notepad\
    \ jn =new Java_Notepad(\"Untitled-Notepad\");\n    }\n}\n```\n"
  raw: 'Dialog(Frame,boolean)___Creates a new dialog that is initially invisible.
    In this constructor, we have two parameters. The first one, frame object, refers
    to the parent window for this newly created dialog. The second, Boolean data,
    refers to whether it is a modal or modeless dialog.


    Dialog(Frame,String,boolean)___Creates a new dialog that is initially invisible.
    In this constructor, we have three parameters. The first one, frame object, refers
    to the parent window for this newly created dialog. The second, String data, is
    the title text of the dialog box. The third, Boolean data, refers to whether it
    is a modal or modeless dialog.


    Modal and Modeless Dialog Boxes


    Modal dialog will never allow the parent window to activate until this dialog
    closes, but in modeless dialog you can do anything in the parent window.


    Methods of the Dialog Class


    boolean isModal()___Returns true if the dialog is modal. We have already seen
    the working style of the modal dialog box. It will return false if the dialog
    is modeless.


    setResizable(boolean)___Sets the resizable flag of the dialog box. If you set
    this value as true, it will allow us to resize the dialog box. If you set it as
    false, it cannot be resized.


    boolean isResizable()___Used to check if the dialog is resizable or not. If it
    returns true, the dialog is resizable.


    Sample Program for Dialog Box


    import java.awt.*;


    import java.awt.event.*;


    public class Dialog1 extends Dialog implements ActionListener


    {


    public Dialog1(Frame fm,String msg)


    {


    super(fm,msg,false);


    setLayout(new GridLayout(2,1,0,0));


    Panel p1 = new Panel();


    Panel p2 = new Panel();


    p1.setLayout(new FlowLayout());


    p1.setFont(new Font("Courier",Font.BOLD,20));


    p2.setLayout(new FlowLayout());


    p1.add(new Label(msg));


    Button b1,b2;


    b1 = new  Button("Ok");


    b2 = new Button("Cancel");


    p2.add(b1);


    p2.add(b2);


    b1.addActionListener(this);


    add(p1);


    add(p2);


    setSize(250,150);


    setResizable(false);


    addWindowListener(new WindowAdapter() {


    public void windowClosing(WindowEvent we)


    {


    dispose();


    }


    });


    }


    public void actionPerformed(ActionEvent ae)


    {


    dispose();             


    }


    }


    public class SampleDialog extends Frame implements ActionListener


    {


    MenuBar mb;


    Menu myMenu;


    MenuItem mDialog,mExit;


    public SampleDialog(String text)


    {


    super(text);


    mb = new MenuBar();


    mMenu = new Menu("My Menu");


    mDialog = new MenuItem("Open Dialog");


    mExit = new MenuItem("Exit");


    mMenu.add(mDialog);


    mMenu.add(mExit);


    mb.add(mMenu);


    setMenuBar(mb);


    setSize(400,400);


    setVisible(true);


    mDialog.addActionListener(this);


    mExit.addActionListener(this);


    addWindowListener(new WindowAdapter() {


    public void windowClosing(WindowEvent we)


    {


    dispose();


    System.exit(0);


    }


    });


    }


    public void actionPerformed(ActionEvent ae)


    {


    if(ae.getSource() == mDialog)


    {


    Dialog1 d1 = new Dialog1(this,”My New Dialog");


    mb.setVisible(true);


    }


    else if(ae.getSource() == mExit)


    {


    dispose();


    System.exit(0);


    }


    }


    public static void main(String args[])


    {


    SampleDialog sd = new SampleDialog("Dialog Demo");


    }


    }


    In this program, we have used the Dialog class to create a new dialog box with
    two panels. The first panel has been set as a FlowLayout so all the controls are
    added to the center with five pixels of horizontal and vertical space. The first
    panel contains only one Label box. The second panel, also in FlowLayout, has two
    buttons. The first button is labeled “ok” and the second one is labeled “cancel.”
    If you click any button on this dialog, the action event will immediately generate.


    In the sample Dialog program, we have created a menu with the name My Menu. Inside
    that menu we have two options. The first option is Open Dialog, which will open
    the dialog box. The second option is Exit, which will close the opened window.


    ## File Dialog


    We have already mentioned the file dialog box in previous sections. In Java, we
    have two important dialog boxes associated with file operations: Open Dialog and
    Save Dialog. We can open this dialog box by using the File Dialog constructor.
    We have three constructors in the FileDialog class.


    Constructors of the FileDialog


    FileDialog (Frame parent)___Creates a filedialog for loading a file. Note: Default
    file dialog is open, so if you use this constructor to create the file dialog,
    it will load an open Dialog.


    FileDialog (Frame parent,String title)___Creates a file dialog for loading a file.
    Here we have two parameters: parent window object and the title of the newly created
    File dialog.


    FileDialog (Frame parent, String title, int mode)___Similar to previous constructors,
    but here we have three parameters. The first two parameters are the same as previous
    constructors, but the third one is used to specify what kind of dialog you to
    want to open.


    Methods of the File Dialog Class


    getDirectory()___Reads the directory of the corresponding file dialog.


    getFile()___Reads the file of the corresponding file dialog.


    getFilenameFilter()___Specifies the file dialog’s filename filter.


    getMode()___Returns the mode of the current dialog.


    setDirectory(String)___Sets the directory of the file dialog window to the one
    specified.


    setFile(String file)___Sets the selected file for the corresponding file dialog
    window to the one specified.


    setFilenameFilter(filenamefilter filter)___Sets the file name of the filter to
    the file dialog.


    setMode(int mode)___Sets the mode of the file dialog.


    In the following section, we will see a sample program that uses the file dialog.
    This program will create a basic text editor like Notepad with minimum functionality.
    Here we will use the File dialog to load and save the file content of the text
    area. Let’s see the code behind our new Java Notepad application using the user
    interface that we have already seen in our example program for the Menu.


    Java Notepad App


    import java.awt.*;


    import java.awt.event.*;


    import java.io.*;


    public class Java_Notepad extends Frame implements ActionListener


    {


    MenuBar mb;


    Menu mFile;


    MenuItem mNew,mOpen,mSave,mExit;


    TextArea ta;


    public Java_Notepad(String text)


    {


    super(title);


    setLayout(new FlowLayout());


    mb = new MenuBar();


    mFile = new Menu("File");


    mNew = new MenuItem("New");


    mOpen = new MenuItem("Open");


    mSave = new MenuItem("Save");


    mExit = new MenuItem("Exit");


    mFile.add(mNew);


    mFile.add(mOpen);


    mFile.add(mSave);


    mFile.addSeparator();


    mFile.add(mExit);


    mb.add(mFile);


    setMenuBar(mb);


    setSize(400,400);


    setVisible(true);


    ta = new TextArea(2000);


    add(ta);


    mNew.addActionListener(this);


    mOpen.addActionListener(this);


    mSave.addActionListener(this);


    mExit.addActionListener(this);


    addWindowListener(new WindowAdapter() {


    public void windowClosing(WindowEvent we)


    {


    dispose();


    System.exit(0);


    }


    });             


    }


    public void actionPerformed(ActionEvent ae)


    {


    if(ae.getSource() == mNew)


    {


    ta.setText("");


    }


    else if(ae.getSource() == mOpen)


    {


    FileDialog fd =new FileDialog(this,"Open Dialog",FileDialog.LOAD);


    fd.show();


    String fname = fd.getDirectory() + "/" + fd.getFile();             


    try


    {


    FileInputStream fin = new FileInputStream(fname);


    byte b[] = new byte[fin.available()];


    fin.read(b);


    String data = new String(b,0,b.length);


    ta.setText(data);


    fin.close();


    }


    catch(Exception e) {}


    }


    else if(ae.getSource() == mSave)


    {


    FileDialog fd = new FileDialog(this,"Save Dialog",FileDialog.SAVE);


    fd.show();


    String fname = fd.getDirectory() + "/" + fd.getFile();


    String data = ta.getText();


    byte b[] = new byte[data.length()];


    data.getBytes(0,data.length(),b,0);


    try


    {


    FileOutputStream fo = new FileOutputStream(fname);


    fo.write(b);


    fo.close();


    }catch(Exception e) {}


    }


    else if(ae.getSource() == exit)


    {


    dispose();


    System.exit(0);


    }


    }


    public static void main(String args[])


    {


    Java_Notepad jn =new Java_Notepad("Untitled-Notepad");


    }


