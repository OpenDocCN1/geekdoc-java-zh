    ## Combining Loops and Arrays


    After reading about loops and arrays, you might have noticed the possible potential
    to combine them to get greater use and production out of your program. Loops allow
    us to very quickly assign or retrieve values for large ranges, while arrays allow
    us to create really large ranges of numbers. How convenient would it be to combine
    the two of them? Below are a few examples of each type of loop, how to quickly
    loop through an array, and how to easily edit a multidimensional array.


    Example 1:


    int intArray[] = new int[100];


    int x = 0;


    while (x < 100) {


    intArray[x] = x;


    System. out .println(intArray[x]);


    x++;


    }


    In this example, we simply declare an array with one hundred index values. Then
    we declare an int that we need to increment. We tell the while loop to continue
    looping while “x” is less than the length of intArray (which is the number of
    indices it has); then we increment “x” by one after each iteration. This code
    quickly and easily edits one hundred different values and prints them to console.
    All of that in just seven easy lines!


    Example 2:


    int intArray[] = new int[100];


    int x = 0;


    do


    {


    intArray[x] = x;


    System. out .println(intArray[x]);


    x++;


    }


    while(x < 100);


    This example is just like the first example, except we applied the same concept
    to a do while instead of a while. The output is exactly the same; however, you
    should be wary of do while loops because they always run at least once.


    Example 3:


    int intArray[] = new int[100];


    for (int x = 0; x < 100; x++) {


    intArray[x] = x;


    System. out .println(x);


    }


    This method is probably my favorite way to do it. The advantage of this is that
    the counter variable is built inside the loop, so you don’t need to declare another
    variable or manually increment it. In my opinion, it is just a lot more convenient
    and organized.


    Example 4:


    int[][] intArray = new int[100][100];


    for(int x = 0; x < 100; x ++){


    for(int y = 0; y < 100; y++){


    intArray[x][y] = y;


    System. out .println(intArray[x][y]);


    }


    }


    This example demonstrates the most practical way to loop through a multidimensional
    array. It may look intimidating, but it is actually quite simple. We have two
    for loops inside of each other; each of them will loop through a specific dimension
    of the array. For this example, the first time it loops, it will start with x
    = 0\. It will then loop through every single array index where the first index
    is zero. Once all indexes of [0][y] get called, it increments “x” by one. It will
    then repeat the process until every single index has been called.


    ## Assignment


    Loops are very useful for editing a large number of values. One thing that can
    be greatly simplified thanks to loops is image editing. An image can consist of
    hundreds, maybe even thousands of pixels, each with its own color value. With
    the power of loops, we can quickly edit those color values. For this assignment,
    we are going to invert the colors of an image of your choosing. There are some
    parts to this program that you have not learned in this book yet, so I will try
    to help you out with that. To edit an image, we first need to create a file object
    and a buffered image object. To be able to use these, we need to import them.
    First, add the following lines of code to the top of your class:


    import java.awt.image.BufferedImage;


    import java.io.File;


    import java.io.IOException;


    import javax.imageio.ImageIO;


    After that, we will need an image to edit. Get any image of your choosing and
    add it to your package by dragging it into the main package folder of your project.
    Make sure you don’t accidently add it into the src folder or any other folders.
    Next you are going to start your code with the following two lines:


    File file = new File("image1.jpg");


    BufferedImage image = ImageIO. read (file);


    You will learn more about file handling later on. Also, be sure to rename “image1.jpg”
    to the name and file type of the image you added. Adding this code will cause
    an error, so for now, add a “throws exception” to your class. What this means
    is beyond the scope of this looping lesson, but the method should look something
    like this:


    public static void main(String[] args) throws IOException {


    If done correctly, the error should have disappeared. The only hint I will give
    to complete this exercise is that you can use image.setRGB and image.getRGB to
    set RGB values and also to edit them. You can also use image.getWidth and image.getHeight
    to get pixel dimensions. After you edit the color values, call:


