    \nThis is an empty constructor. It will create the `StringBuffer` object, but\
    \ it won’t have anything in it. You can provide those data by simply assigning\
    \ some to the string buffer object.\n\n* `StringBuffer sb = new StringBuffer(16);`\n\
    \nThis is a parameterized constructor that has only one parameter: the size of\
    \ the newly created `StringBuffer`. For example, this one will creates a new `StringBuffer`\
    \ object with capacity of 16 characters.\n\n* `String s;`\n\n`StringBuffer sb\
    \ = new StringBuffer(s);`\n\nThis is a parameterized constructor that has only\
    \ one parameter: string data object. For, example this one will create a `StringBuffer`\
    \ object, then acquire the data of `String s`.\n\n## StringBuffer Methods\n\n\
    * `length()`\n\nCreates a string from this `StringBuffer` or converts to string.\n\
    \nExample of `length()`:\n\n```\nStringBuffer text = “test”;\nint amount = text.length();\n\
    System.out.println(“The amount of characters are: “ + amount);\n```\n\nThe `.length()`\
    \ function or property in a `StringBuffer` object returns a value for the amount\
    \ of characters within the `String` object and assigns the value to the integer\
    \ `amount`. The output in this sample code would be 4, since “test” is four characters\
    \ long.\n\n* `capacity()`\n\nReturns the current number of spaces allocated.\n\
    \nExample of Capacity:\n\n```\nStringBuffer s1=new StringBuffer(16);\nint capacity=s1.capacity();\n\
    System.out.println(“Capacity of the StringBuffer”+capacity);\n```\n\nThe `capacity()`\
    \ method will return the capacity of the `StringBuffer` object. This sample code\
    \ will create the new `StringBuffer` object `s1`, then once we call the `capacity`\
    \ method it will return the capacity of the new `StringBuffer` object `s1`. The\
    \ result will be stored in an integer variable `capacity`. Finally, we print the\
    \ capacity of `s1` with the help of the `println` method.\n\n`boolean ensureCapacity()`\
    \ makes the `StringBuffer` hold at least the desired number of spaces.\n\n* `setLength()`\n\
    \nTruncates or expands the previous character string, if expanding pads with nulls.\n\
    \nExample of `setLength`:\n\n```\nStringBuffer s1=new StringBuffer();\ns1.setLength\
    \ (25);\n```\n\nThis `setLength` method will resize the `StringBuffer`. In this\
    \ example, we are resizing the data by using the `setLength` method.\n\n* `charAt(int)`\n\
    \nReturns the character to that location in the buffer.\n\nExample of `charAt`:\n\
    \n```\nString text = “Hello World!”;\nchar letter = text.charAt(0);\n```\n\nThe\
    \ value of `letter` contains the letter “H” because the inputted index of the\
    \ string is 0, which is the first letter of the string. The way the computer reads\
    \ the string is from 0 to the length of the string, not 1.\n\n* `setCharAt(int,char)`\n\
    \nModifies the value of that location.\n\nExample of `setCharAt`:\n\n```\nStringBuffer\
    \ sb = \"Hello\";\nsb.setCharAt(2,'w');          Hewlo;\n```\n\nIn this example\
    \ we are changing the second index data by “w.”\n\n* `getChars()`\n\nCopies chars\
    \ into an external array. There is no `getBytes()` as there is in string.\n\n\
    * `append()`\n\nConverts the argument to a string and appends it at the end of\
    \ the current buffer.\n\nExample of `append`:\n\n```\nStringBuffer s1=new StringBuffer(25);\n\
    s1=”Hello”;\ns1.append(“AABBCC”);\n```\n\nIn this example, `append` will add the\
