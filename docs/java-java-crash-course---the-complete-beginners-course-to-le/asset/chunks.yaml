  trans: "\n线程是一种同时运行两个“线程”代码的方式。线程并不一定能让你的程序运行得更快，但在某些情况下可以。线程共享处理能力，因此它不会加快任何代码的运行速度。线程的工作就像两个非常有礼貌的人穿过一条布满门扇的走廊：第一个人让第二个人通过第一扇门，然后第二个人让第一个人通过第二扇门，如此往复。线程允许程序员运行耗时很长的循环，同时仍然在后台执行其他任务。例如，如果你想让程序接受来自另一台计算机的连接，你可以运行一个不断“监听”连接的循环。但这样做的问题是，程序在监听期间会冻结。相反，我们使用一个线程来监听连接，然后在主线程中执行其他任务。我们可以向用户显示类似\
    \ GUI（下一节介绍）的内容，并根据监听状态提供反馈。那么，我们如何创建一个线程呢？首先，我们创建一个“Runnable”。只需实现 `Runnable`\
    \ 接口并重写它的 `run` 方法。接下来，我们创建一个以 `MyRunnable` 对象（或任何实现 `Runnable` 的类）作为参数的线程对象，最后调用\
    \ `<thread object>.start()`。\n\n```java\nclass MyRunnable implements Runnable\n\
    {\n    public void run()\n    {\n        while(true) // 这个循环无限运行！\n        {\n\
    \            System.out.println(“Groundhog Day!”);\n        }\n    }\n    public\
    \ static void main(String[] args)\n    {\n        Runnable runThis = new MyRunnable();\n\
    \        Thread aThread = new Thread(runThis);\n        aThread.start();\n   \
    \     while(true)\n        {\n            System.out.println(“Bill Murray!”);\n\
    \        }\n    }\n}\n```\n上面的代码现在将运行两个无限且不相关的循环，并会“随机”打印出“Groundhog Day!”或“Bill\
    \ Murray!”不过，线程并不限于无限循环；它们适用于任何需要两条并行处理行的场景。例如，假设你正在为视频游戏制作加载菜单。你可以用一个线程加载游戏数据，然后简单地将其状态放入变量中（例如已加载了多少文件）。然后你可以让另一个线程修改你的窗口、控制台或任何内容，根据原始线程使用的变量来告诉用户加载状态。这就是（大多数）加载条的制作方式。\n\
    \n## 线程的生命周期\n线程的生命周期涉及四个阶段。它们是：\n* 新生状态（Born state）\n* 可运行状态（Runnable state）\n\
    * 阻塞状态（Blocked state）\n* 死亡状态（Dead state）\n\n### 新生状态\n当线程被创建时，它处于新状态。“新”（New）意味着线程对象已经创建，但尚未开始运行。它需要通过\
    \ `start()` 方法来启动。\n\n### 可运行状态\n当线程在执行一组指令时，说它处于可运行状态。`run()` 方法包含了这些指令。该方法在\
    \ `start()` 方法调用后会被自动调用。\n\n### 阻塞状态\n线程可以运行，但某些东西在阻止它。当线程处于阻塞状态时，调度器会直接跳过它而不给它任何\
    \ CPU 时间。在线程重新进入运行状态之前，它不会执行任何操作。\n\n* `wait()` - `notify()`\n* `suspend()` -\
    \ `resume()`\n* `sleep(milliseconds)`\n\n### 死亡状态\n线程死亡的正常方式是从其 `run()` 方法返回。我们也可以调用\
    \ `stop()`，但这会抛出一个 `Error` 类的异常（这意味着我们通常不会捕获它）。\n\n## 线程的创建\n在 Java 中，你可以通过两种方式创建线程。第一种是使用\
    \ `Runnable` 接口，第二种使用 `Thread` 类。`Runnable` 接口只有一个方法，即 `run()` 方法和一个构造函数。`Thread`\
    \ 类包含了许多方法，通过这些方法你可以获取线程的基本信息。\n\n## 常用方法\n* `start()`：`start()` 启动调用对象的执行。如果线程已经启动，它可能会抛出\
    \ `IllegalThreadStateException`。\n* `stop()`：此方法终止调用对象。\n* `suspend()`：此方法挂起调用对象。如果线程获取了\
    \ `resume()` 方法，它将再次变为可运行。\n* `sleep()`：此方法挂起执行线程指定的毫秒数执行。它可能会抛出 `InterruptedException`。\n\
    \n## Thread 类方法\n* `activeCount()`：此方法将返回当前线程组中活动线程的数量。\n* `currentThread()`：这将返回当前正在执行的线程对象的引用；这是一个静态方法。\n\
    * `isAlive()`：此方法将检查给定的线程是否存活。\n* `getName()`：这将获取并返回此线程的名称。\n* `getPriority()`：这将获取并返回线程的优先级。\n\
    * `setName(String)`：此方法用于设置线程的名称。\n* `setPriority(int)`：这是用于设置线程优先级的方法。\n* `toString()`：这将返回\
    \ `Thread` 的字符串表示，包括线程的名称、优先级和线程组。\n\n示例：使用 Runnable 接口创建的线程程序\n```java\nclass\
    \ RunnableDemo implements Runnable\n{\n    Thread t;\n    RunnableDemo(String\
    \ name)\n    {\n        t = new Thread(this,name);  //新生状态\n        t.start();\n\
    \    }\n    public void run()\n    {\n        try\n        {\n            for(int\
    \ i=1;i<=5;i++)\n            {\n                System.out.println(t.getName()\
    \ + \" + i);\n            }\n        }\n    }\n}\n```\n"
