    在本指南中，你一直在编写程序并期望从控制台获取输出。现在是时候学习如何开发你自己的界面了。在指南的这一部分，你将学习 Java Swing 和 Applet
    编程。在 Java 中开发界面有多种方法，但我们将使用“Swing 和 Applet”方法。


    ## Applet


    首先我们将探索 Applet 编程。这也是开发用户界面的方法之一。`Applet` 是一种容器，我们可以在其中放置组件来创建用户界面。`Applet` 类定义在
    `java.applet.*` 包下，而所有其他组件和事件处理类都定义在 `java.awt.*` 和 `java.awt.event.*` 包下。在这一部分，我们将学习如何借助
    `Applet` 和 `AWT` 组件来开发用户界面。`Applet` 用于创建一个在 `Applet Viewer` 或任何浏览器中运行的交互式动态程序。然而，它也有一些限制：`Applet`
    很容易受到病毒的影响，且我们无法使用读和写等文件系统。


    ## Applet 程序的结构


    ```java

    import java.applet.*;


    import java.awt.*;


    public class SampleApplet extends Applet


    {


    public void init()

    {}


    public void start()

    {}


    public void paint(Graphics g)

    {}


    public void stop()

    {}


    public void destroy()

    {}


    }

    ```


    在上面的示例程序中，你可以看到五个参与 applet 生命周期周期的方法。你不需要调用这些方法，因为所有方法都会被自动调用。你只能自己调用 `paint()`
    方法来更新 applet 窗口，但你必须使用 `repaint()` 方法来调用 `paint()` 方法。


    所有 applet 程序都需要一个 `applet` 标签，因为定义 applet 窗口的外观很重要。以下语法将帮助你理解 `applet` 标签及其属性。


    ### Applet 标签


    ```html

    /*<applet

    code=”Applet class file name”

    codebase=”path of the applet class file”

    width=”width of the applet window in pixels”

    height=”height of the applet window in pixels”

    vspace=”vertical space”

    hspace=”horizontal space”

    >

    </applet>*/

    ```


    在这个 `applet` 标签代码中，`width` 和 `height` 是条件属性，所以你必须提到它们。剩余的三个（`vspace`, `hspace`,
    `codebase`）是可选的。


    ### Parameter 标签


    `Param` 标签帮助我们将一些参数数据传递到 applet 程序中。该标签有两个属性：`Name` 和 `Value`。`Name` 参数名称，`value`
    存储数据。


    ```html

    <param name=”name of the parameter name” value=”data”></param>

    ```


    ### 示例程序


    ```java

    import java.applet.*;


    import java.awt.*;


    public class ParamTag extends Applet


    {


    int a,b;

    String a1;


    public void init()

    {


    a=Integer.parseInt(getParameter(“Data1”));

    b=Integer.parseInt(getParameter(“Data2”));

    a1=”Sum is: ”+(a+b);

    }


    public void paint(Graphics g)

    {

    g.drawString(a1,200,100);

    }


    }

    ```


    ```html

    /*<applet code=”ParamTag” width=”200” height=”200”>

    <param name=”Data1” value=”15”></param>

    <param name=”Data2” value=”25”></param>

    </applet>*/

    ```


    在这个示例程序中，我们创建了两个名为 `Data1` 和 `Data2` 的 `param` 标签，其值分别为 15 和 25。然后我们通过 `getParameter()`
    方法获取这些数据。此方法始终返回 `String` 格式的数据，因此我们必须将这些数据转换为整数数据。然后我们相加这些数据并存储在字符串变量中，以便将该数据打印到
    applet 窗口。


    ![](img/Image00006.jpg)


    ## Applet 编程中的类


    *   `Graphics` 类

    *   `Font` 类

    *   `Color` 类

    *   `Image` 类

    *   `Graphics` 类


    该类包含了用于绘制字符串、线条、矩形以及 `graphics` 类定义的其他形状的方法。


    ### Graphics 类


    #### 绘制字符、字节和字符串


    *   “g,” “r,” “a,” “p,” “h,” “i,” “c,” “s”—字符

    *   100, 101, 108, 114, 67, 47—字节

    *   “World”—字符串


    ```java

    void drawBytes (byte[] data , int offset , int length , int x , int y)

    ```


    该方法用于将字节数据绘制到 Applet 窗口。

    *   `data` -> 要绘制的数据

    *   `offset` -> 数据中的起始偏移量

    *   `length` -> 绘制的字节数

    *   `x` -> x 坐标

    *   `y` -> y 坐标


    ```java

    void drawChars(char[] data , int offset , int length ,int x , int y)

    ```


    该方法用于将字符数据绘制到 Applet 窗口。


    ```java

    abstract void drawString(String str,int x,int y)

    ```


    该方法用于将字符串数据绘制到 Applet 窗口。


    #### 形状绘制方法


    我们有很多方法来绘制不同类型的形状，如矩形、圆形、弧等。


    | 方法名 | 参数 | 方法用法 |

    | :--- | :--- | :--- |

    | `drawLine(int x1,int y1,int x2,int y2)` | `x1, y1`: 起点，`x2, y2`: 终点 | 此方法帮助我们在
    applet 窗口上绘制线条形状。 |

    | `drawRect(int x1,int y1,int width,int height)` | `x1, y1`: 起点，`width`: 宽度，`height`:
    高度 | 此方法帮助我们在 applet 窗口上绘制矩形形状。 |

    | `fillRect(int x1,int y1,int width,int height)` | `x1, y1`: 起点，`width`: 宽度，`height`:
    高度 | 此方法帮助我们在 applet 窗口上绘制填充矩形。 |

    | `drawRoundRect(int x1,int y1,int width,int height,int width,int height)` | `x1,
    y1`: 起点，`width`: 宽度，`height`: 高度，`width`: 宽度，`height`: 高度 | 此方法帮助我们在 applet 窗口上绘制圆角矩形。
    |

    | `fillRoundRect(int x1,int y1,int width,int height,int width,int height)` | `x1,
    y1`: 起点，`width`: 宽度，`height`: 高度，`width`: 宽度，`height`: 高度 | 此方法帮助我们在 applet 窗口上绘制填充圆角矩形。
    |

    | `drawOval(int x1,int y1,int width,int height,int startAngle,int arcAngle)` |
    `x1, y1`: 起点，`width`: 宽度，`height`: 高度，`startAngle`: 起始角度，`arcAngle`: 弧角 | 此方法帮助我们在
    applet 窗口上绘制椭圆。 |

    | `fillOval(int x1,int y1,int width,int height,int startAngle,int arcAngle)` |
    `x1, y1`: 起点，`width`: 宽度，`height`: 高度，`startAngle`: 起始角度，`arcAngle`: 弧角 | 此方法帮助我们在
    applet 窗口上绘制填充椭圆。 |

    | `drawArc(int x1,int y1,int width,int height,int startAngle,int arcAngle)` |
    `x1, y1`: 起点，`width`: 宽度，`height`: 高度，`startAngle`: 起始角度，`arcAngle`: 弧角 | 此方法帮助我们在
    applet 窗口上绘制弧。 |

    | `fillArc(int x1,int y1,int width,int height,int startAngle,int arcAngle)` |
    `x1, y1`: 起点，`width`: 宽度，`height`: 高度，`startAngle`: 起始角度，`arcAngle`: 弧角 | 此方法帮助我们在
    applet 窗口上绘制填充弧。 |

    | `drawPolygon(int[] x, int[] y, int n)` | `x`: x 坐标数组，`y`: y 坐标数组，`n`: 顶点数 |
    此方法帮助我们在 applet 窗口上绘制多边形。 |

    | `fillPolygon(int[] x, int[] y, int n)` | `x`: x 坐标数组，`y`: y 坐标数组，`n`: 顶点数 |
    此方法帮助我们在 applet 窗口上绘制填充多边形。 |


