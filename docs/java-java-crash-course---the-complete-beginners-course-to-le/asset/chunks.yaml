    ## JFC Swing


    Java Swing is a fully featured user interface development kit used to create interfaces
    in Java applications. The toolkit includes a vast variety of widgets and tools
    used to help create graphical user interfaces. It has built-in controls such as
    buttons, layout managers, sliders, text fields, labels, etc. It also has some
    advanced controls such as tree, table, scroll pane, and tab controls.


    In this guide, you will learn the foundations of how to develop an interface in
    Java Swing. This should be enough for you to get started, but the rest is up to
    you. Remember, the Java API is at your disposal.


    Let’s start by going over a few objects that will be important to remember and
    understand.


    Before we begin, it is important to remember the following three packages in Swing:


    import javax.swing.*;


    import java.awt.*;


    import java.awt.event.*;


    javax.swing is the package that has all required classes of swing application
    development. JApplet, JButton, JTree, and JScrollpane are some example classes
    of the swing package.


    ## JFrame


    A JFrame object is simply an object that allows a window to appear on the screen.
    You can think of a JFrame as a canvas, the base foundation that is needed in order
    to add elements to the interface. These elements are called “components” in Swing
    and will be referred to as such for the remainder of this guide.


    To declare a JFrame object, you can do something as simple as:


    JFrame frame = new JFrame("Title");


    frame.setSize(250,250);


    frame.setDefaultCloseOperation(frame. EXIT_ON_CLOSE );


    frame.setVisible(true);


    ![https://lh6.googleusercontent.com/_bSU5VKMJ7pFENUyn4JxxxOjIJoVINznpLeKWN1to4oewXWRWeq3X8PQHlart0u5O88I2I0mmxT60rHIkE9-wBWxLThAxqt1Ngf-NFH-1zdbfT1S_B9VfvOyGZhKQlcvJKZQpVk](Image00017.jpg)


    Let’s analyze every line in the sample code above.


    JFrame frame = new JFrame("Title");


    In this line, the JFrame object is being declared. The arguments of the JFrame
    constructor take in a string, which is considered the title of the window. Another
    alternate route to this is to leave the constructor empty and then use the method:


    frame.setTitle("Title");


    Let’s move on to the next line:


    frame.setSize(250,250);


    This line should be self-explanatory. There is a method within the JFrame object
    that is called “setSize” that takes in two values. The first value is the width
    of the JFrame and the second value is the height.


    frame.setDefaultCloseOperation(frame. EXIT_ON_CLOSE );


    This next line simply lets the window know that if the program is ended through
    a mouse click of the x button or through the console, it should exit the window
    instead of leaving it open.


    frame.setVisible(true);


    The most obvious line of them all, this line simply sets the visibility of the
    JFrame to true so the user is able to see the window.


    ## JPanel


    In the canvas of the interface (JFrame), we need a panel so that we can add components
    to it (buttons, labels, etc.). You can think of the JFrame as a clipboard and
    the JPanel as the paper, that extra layer that will allow you to draw and add
    different types of components to the interface. One thing to note is that components
    can be added to the raw canvas (JFrame). However, many complications can arise
    from doing this. That is why we should add a JPanel to the JFrame.


    To declare a JPanel, you can do the following in conjunction with the previous
    sample code:


    JFrame frame = new JFrame();


    frame.setTitle("Title");             


    frame.setSize(250,250); frame.setDefaultCloseOperation(frame. EXIT_ON_CLOSE );


    JPanel panel = new JPanel();// new line of code


    frame.add(panel); // new line of code


    frame.setVisible(true);


    In every object within the Swing hierarchy of classes, there is a commonly used
    method called “add” that takes in any Swing component. A JPanel is considered
    a component and is thus added to the frame. Now the JPanel can add components
    to it by referring to the object name of the JPanel and by using the add method.
    The JFrame object and the JPanel object technically have identical methods, so
    you can use the same methods you have been using with JFrame on JPanel. Adding
    this piece of code won’t change anything in the program, because all a JPanel
    does is to act as a container for GUI components to be added.


    ## JLabel


    The JLabel object is simply a Swing component that can be added to the JPanel.
    This component simply acts as a text element in the JFrame window. In order to
    add a JLabel component to the main panel we created before, we simply do the following:


    JFrame frame = new JFrame();


    frame.setTitle("Title");             


    frame.setSize(250,250); frame.setDefaultCloseOperation(frame. EXIT_ON_CLOSE );


    JPanel panel = new JPanel();


    frame.add(panel);


    frame.setVisible(true);


    JLabel lblText = new JLabel("This is Text");


    panel.add(lblText);


    ![https://lh3.googleusercontent.com/sKT-xUZdHAYBmwlmqL92pFXU1EyHvDgRsO8K2Or-DFAI2RMvIh4y6jK52Se_bY7r4BLN7nlG_u9YQ-SVA-X5D_K1hf364p_91rgSQbZLaNaQizBlgl9h_6Lk95gsEXnTnDs0DWI](Image00018.jpg)


    As shown above in the last two lines, you can see that it is simple to create
    a new JLabel object that takes in a string as its constructor and to use that
    to display the text. Another way to complete this task is to leave the constructor
    empty and use the setText method for the JLabel. The next line simply adds the
    JLabel object to the panel so it can be displayed. You must be wondering how you
    can have the program decide where and how to display the text. We will talk further
    about this in the section on LayoutManager.


    ## JButton


    The JButton object is also a Swing component that can be added to the JPanel.
    This component acts as a button element in the JFrame window. In order to add
    a JButton component to the panel, we simply do the following:


    JFrame frame = new JFrame();             


    frame.setTitle("Title");             


    frame.setSize(250,250); frame.setDefaultCloseOperation(frame. EXIT_ON_CLOSE );


    JPanel panel = new JPanel();


    frame.add(panel);


    frame.setVisible(true);


    JLabel lblText = new JLabel("This is Text");


    panel.add(lblText);


    JButton btnTest = new JButton("Test"); // new line of code


    panel.add(btnTest); // new line of code


    ![https://lh5.googleusercontent.com/_GrlbOqJ9cP7bUeHV6mgZ1rUA1hNpEG6sFjvUPp0Xu_HRpTwAMVLM9dx9tiIbIKqFda-BTTRq7A7f-OtNZuNajb78akeDnnmpFfnbjSayzHS8kdjs2C9L5EHQ4QdmoUXO3aeiag](Image00019.jpg)


    In the last two lines, we see how the JButton object takes in the value of a string
    as its constructor and is then used as the name of the button. Another way to
    do this is to leave the constructor empty and use the setText method for the JButton.
    Then, we add the JButton component to the JPanel. Are you seeing a trend here?


