    这些是由用户或开发者为了他们自己的使用而开发的。你可能会发现开发自己的包是有帮助的，因为所有类文件都分组在单个目录中，你可以在需要时轻松地重用所有文件。创建用户自定义包涉及以下重要步骤：\n\
    \n**步骤 1**：在 Java 安装位置的 `bin` 文件夹创建一个目录。\n\n**步骤 2**：为该文件夹指定任何名称；这也将你的包名。\n\n\
    **步骤 3**：定义你的类并将它们存储在你新创建的包文件夹中。\n\n**步骤 4**：像预定义包一样进行导入。\n\n下表解释了包及其类的访问权限级别。\n\
    \n| | Private | Public | Protected | 无修饰符 |\n| :--- | :--- | :--- | :--- | :---\
    \ |\n| 同一个包同一类 | 是 | 是 | 是 | 是 |\n| 同一个包子类 | 否 | 是 | 是 | 是 |\n| 同一个包非子类 | 否 |\
    \ 是 | 否 | 是 |\n| 不同包子类 | 否 | 是 | 是 | 否 |\n| 不同包非子类 | 否 | 是 | 否 | 否 |\n\n## 创建包的语法\n\
    \n```java\npackage package_name;\n\nclass class_name\n{\n    类的成员变量;\n    . .\
    \ . . . . . . . . .\n    . . . . . . . . . . .\n    . . . . . . . . . . .\n}\n\
    ```\n\n## 示例程序\n\n创建一个新包并将你的包保存为 `pack1`。\n\n### pack1 中的 1 号类\n\n```java\npackage\
    \ pack1;\n\npublic class Factorial\n{\n    public int getFact(int n)\n    {\n\
    \        int fact1=1;\n        for(int i=1;i<=n;i++)\n        fact = fact * i;\n\
    \        return fact;\n    }\n}\n```\n\n### pack1 中的 2 号类\n\n```java\npackage\
    \ pack1;\n\npublic class Fibonacci\n{\n    public void fib(int n)\n    {\n   \
    \     int f1=0,f2=1,f3,i;\n        System . out. println(f1);\n        System\
    \ . out. println(f2);\n        For(i=2;i<=n;i++)\n        {\n            f3=f1+f2;\n\
    \            System . out. println(f3);\n            f1=f2;\n            f2=f3;\n\
    \        }\n    }\n}\n```\n\n### 在你的程序中导入包 pack1\n\n```java\nimport pack1.Factorial;\n\
    import pack1.Fibonacci;\n\nclass SamplePack\n{\n    public static void main(String\
    \ args[])\n    {\n        Factorial f1=new Factorial();\n        f1.getFact(5);\
    \              //它将打印整数 5 的阶乘值为 120\n        Fibonacci f2=new Fibonacci();\n \
    \       f2.fib(5);                  // 它将生成斐波那契数列。\n    }\n}\n```\n\n在这个程序中，我们创建了一个名为\
    \ `pack1` 的新包，它包含了两个不同的类：`Factorial` 和 `Fibonacci`。\n\n"
- fmt: "\nEnums are essentially pre-sets that have a limited number of possibilities.\
    \ They are similar in definition to classes and interfaces, except they use the\
    \ `enum` keyword instead. They can have constructors and variables. Enums cannot\
    \ be instantiated or be children (but they can implement interfaces). Be careful\
    \ when accessing variables within an `enum`, because if you modify an `enum`’s\
    \ variables, all instances of that `enum` will be modified. To fill an `enum`,\
    \ you need a list of all pre-sets. This list must be at the top of your enum block.\
    \ If your `enum` does not have a constructor, you may simply write out the possible\
    \ values as if they were variable names. The rest you would separate by commas\
    \ and end with a semicolon. If your enum does have a constructor, you must write\
    \ the variable name, then the parameters of the constructor (meaning the values)\
    \ separated by commas, and end with a semicolon. After the semicolon, you may\
    \ go on to write your variable declarations, constructor(s), and any methods you\
    \ wish. The constructor(s) cannot be public, only protected or private.\n\n```java\n\
    enum Number \n{\n    One , Two , Three\n}\n\n```\n\n```java\nenum Color \n{\n\
    \    Red (255, 0, 0),\n    Green (0, 255, 0),\n    Blue (0, 0, 255),\n    Purple\
    \ (255, 0, 255),\n    Yellow (255, 255, 0),\n    Cyan (0, 255, 255);\n\n    public\
    \ int r;\n    public int g;\n    public int b;\n\n    Color(int redChannel, int\
    \ greenChannel, int blueChannel) \n    {\n        r = redChannel;\n        g =\
    \ greenChannel;\n        b = blueChannel;\n    }\n\n    public static void main(String[]\
    \ args) \n    {\n        Number num = Number.Two;\n        Color red1 = Color.Red;\n\
    \        Color red2 = Color.Red;\n        red1.g = 255;\n        System.out.println(red2.g);\
    \ // “255”, red2 was modified because both red1 and red2 are the same object.\
    \ That object is stored in both variables, and so is affected by changes in either\
    \ object.\n    }\n}\n```\n\n# Chapter 16\n\n# Generic Types\n\nGeneric types allow\
    \ us to make classes that are generic, which means that they can act differently\
    \ based on what type is given. Generic types are given a list of classes by the\
    \ programmer that will be used to define certain object types. Generic types are\
    \ created by placing angled brackets ( `< > ) after the class name, followed by\
    \ a list of type identifiers. These work just as variable names, but the convention\
    \ is to use capital letters, specifically `T` (for type), for one of them. These\
    \ type identifiers can be used in place of data types. This allows you to keep\
    \ certain variables a consistent type in order to prevent the need for casting.\
    \ When creating a variable with the data type of the class using generic types,\
    \ the data type must also have angled brackets containing a list of types corresponding\
    \ to the class’s list of types. The object you create will also need the same\
    \ set of angled brackets before the parameters.\n\n```java\nclass Something<A,\
    \ B> \n{\n    public A variableA;\n    public B variableB;\n\n    public Something(A\
    \ varA, B varB) \n    {\n        this.variableA = varA;\n        this.variableB\
    \ = varB;\n    }\n\n    public static void main(String[] args) \n    {\n     \
    \   // Class1 will be A, Class2 will be B\n        Something<Class1, Class2> somethingElse\
    \ = new Something<Class1, Class2>(new Class1(), new Class2());\n        Class1\
    \ class1 = somethingElse.variableA; // This does not need to be type cast because\
    \ variableA is actually of the Class1 type\n    }\n}\n```\n\n```java\nclass Class1{}\n\
    class Class2{}\n```\n\nOne common use of generic types is `ArrayList`, a class\
    \ in the `java.util` package. `ArrayList` is a dynamic array, meaning that you\
    \ can change the number of elements in the array after it has already been initialized.\
    \ `ArrayList` uses generic types to prevent programmers from adding objects of\
    \ the wrong type, and also helps programmers to cast objects to the desired type.\
    \ Here is a small example using `ArrayList`.\n\n```java\nclass Food \n{\n    public\
    \ String name;\n\n    public Food(String name) \n    {\n        this.name = name;\n\
    \    }\n\n    public static void main(String[] args) \n    {\n        ArrayList<Food>\
    \ basket = new ArrayList<Food>();\n        basket.add(new Food(“Pear”));\n   \
    \     basket.add(new Food(“Apple”));\n        basket.add(new Food(“Orange”));\n\
    \        basket.add(new Food(“Apple”));\n        basket.add(new Food(“Pomegranate”));\n\
    \        System.out.println(basket.get(2).name); // “Orange”\n        basket.remove(3);\n\
    \        System.out.println(basket.size());// “4”\n    }\n}\n```\n\nA good use\
    \ of Array Lists involves “queues.” This is a way to do recursion (calling a method\
    \ from within that method) without having to do recursion. Recursion is rather\
    \ dangerous, since improper use can cause infinite loops that can quickly crash\
    \ your program. Recursion is actually rather slow, so it’s a good thing we have\
    \ the option of using queues. Essentially, you create an ArrayList (usually in\
    \ the form of a class), add a starting element to the array, and then for long\
    \ as the ArrayList is not empty (or hasn’t completed your task), it will continue\
    \ to perform some code given the values in the ArrayList. Your code could add\
    \ elements to the ArrayList that add new cycles, just as in a recursive method,\
    \ and you could call the method again to add a new layer of depth.\n\nQueues are\
    \ not necessarily “better” than recursive methods. Queues are meant for branching\
    \ recursive “paths,” specifically in the case of finding optimal solutions. This\
    \ could be used in path finding for video games, or for real life. Logically,\
    \ we could try a path that seems closest to the target, and if that path dead-ends,\
    \ we can remove it from the queue and try the next closest path. Recursion could\
    \ do this, but it would work like a tree (iteration-wise). Each path would most\
    \ likely go from left to right and would go through each possibility. With queues,\
    \ you can go from any part of the iteration tree to any other part of the iteration\
    \ tree, which allows computers to potentially find a route using the fastest method.\
    \ Both recursion and queues could reach the same end, but it depends on the way\
    \ you have structured your system.\n"
