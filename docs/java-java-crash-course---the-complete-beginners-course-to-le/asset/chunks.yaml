    import java.awt.image.BufferedImage;\nimport java.io.File;\nimport java.io.IOException;\n\
    import javax.imageio.ImageIO;\n```\n\nAfter that, we will need an image to edit.\
    \ Get any image of your choosing and add it to your package by dragging it into\
