    示例 1：\n```java\nString text = \"Hello \";\nString text2 = \"World!\";\nSystem.out.println(text\
    \ + text2);\n```\n\n示例 2：\n```java\nString text = \"Hello \";\nString text2 =\
    \ \"World!\";\nSystem.out.println(text.concat(text2));\n```\n\n示例 3：\n```java\n\
    String text = \"Hello \";\nString text2 = \"World!\";\nSystem.out.println(text\
    \ + \" fun \" + text2);\n```\n\n示例 4:\n```java\nString text = \"Hello\";\nString\
    \ text2 = \"World\";\nSystem.out.println(text.concat(\" fun \").concat(text2));\n\
    ```\n\n### 字符串方法演示\n\n#### charAt(int index)\n\n`charAt()` 方法返回指定索引处的字符。\n\n```java\n\
    String text = \"Hello World!\";\nchar letter = text.charAt(0); // letter 为 H\n\
    ```\n\n#### Equals(String anyText)\n\n`equals()` 方法检查两个字符串是否相等。\n\n```java\nString\
    \ text = \"Hello\";\nboolean doesItEqual = text.equals(\"Hello\");\nSystem.out.println(doesItEqual);\
    \ // 返回 true\n```\n\n#### substring(int beginIndex)\n\n`substring()` 方法从指定的索引开始提取字符串的一部分。\n\
    \n```java\nString text = \"Hello World\";\nString justWorld = text.substring(6);\
    \ // 返回 World\n```\n\n#### trim()\n\n`trim()` 方法删除字符串左侧或右侧的空格。\n\n```java\nString\
    \ text = \"  Hello World  \";\nString trimmedText = text.trim(); // trimmedText\
    \ 为 Hello World\n```\n\n"
