    );\n}\n```\n\nWhen writing code, it is important to comment on all of your logic\
    \ so that someone who has not written it can easily understand and edit it. I\
    \ recommend that you leave as many comments as you feel you need. I also encourage\
    \ you to try to find a better way to solve this problem. Maybe there is a way\
    \ you can write this in a quarter of the length; with programming, there is never\
    \ only one answer.\n\n# Chapter 9\n\n# Loops and Arrays\n\n## Loops\n\nWhen programming,\
    \ you might run into a situation where you will need to loop through a large amount\
    \ of numbers. If we used what we learned so far to loop through one hundred numbers,\
    \ we would need one hundred “if” statements. I think you would agree that would\
    \ get really messy and frustrating. Luckily, Java supports three types of loops,\
    \ all of which loop through things in slightly different ways. Below is a quick\
    \ explanation of each.\n\n### While Loop\n\nA while loop is a control structure\
    \ that will allow you to repeat a task as many times as you program it to. The\
    \ syntax for a while loop is as follows:\n\n```java\nwhile (expression) {\n  \
    \  // insert code\n}\n```\n\nThis works in a similar way that if statements work,\
    \ except WHILE the `expression` is true, the code within the while loop will run\
    \ until the expression becomes false (if it ever does).\n\nExample:\n\n```java\n\
    int x = 10;\nwhile (x > 0) {\n    System. out .println(x);\n    x--;\n}\n```\n\
    \nThe preceding code will print out the value of `x`, and then continuously subtract\
    \ one from it until the value of `x` is no longer greater than zero. If you were\
    \ to run this code, you would get an output of every number from one to ten. Once\
    \ the value of `x` reaches zero, it longer allows the expression to return true,\
    \ which is when the while loop finishes. Note that you should watch out for infinite\
