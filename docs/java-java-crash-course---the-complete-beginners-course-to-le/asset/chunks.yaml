    }


    The first line import java.util.Scanner; it is using the special keyword i mport,
    which allows the programmer to import tools in the Java library that aren’t included
    by default when starting a new class. After the keyword i mport, the programmer
    specifies a specific directory within the Java library for the Scanner tool by
    typing out: java.util.Scanner, which first accesses the Java library in the Utilities
    directory before accessing the specific tool needed, which in this case is “Scanner.”


    By default, when starting a Java class, only the bare minimum tools and functions
    from the Java library that are needed for any basic program will be provided.
    For example, you don’t need to import packages for a simple program. If the programmer
    wants to use more than just the basic functionalities, they must use the “Import”
    keyword to give themselves more tools to work with.


    You will also start to notice that there is a semicolon “;” after each statement.
    This semicolon functions as a period does for an English sentence. When the compiler
    is going through the program to prepare it for its execution, it will check for
    semicolons, so it knows where a specific statement ends and a new one starts.


    The next thing you’ll notice in the sample code is: public class ThisIsAClass.
    There are three elements to this line that are very important to understand.


    public—Defines the scope of the class and whether or not other classes have access
    to the class. This may not make sense now, but you will gain a better understanding
    of what this means when we learn about “Inheritance and Polymorphism.”


    class—A class can be thought of as a “section” of code. For example:


    Section {everything here is the content of the section}


    Again, you will gain a better understanding of how classes can be useful when
    we learn about Inheritance and Polymorphism.


    ThisIsAClass—This third and final element of this important line is “ThisIsAClass,”
    which is simply a custom name that the user can define. You can call this anything,
    as all it does is give the “Section” or “Class” a name. You can think of it this
    way:


    Section:              Name              {


       Essay/Contents


    }


    In code, it would be presented:


    Class              ThisIsAClass              {


    Code


    }


    Another thing you may be scratching your head over are the curly braces: “{” and
    “}.” All that these characters do is tell the compiler where a specific section
    starts and ends. In English, this could be thought of as starting a sentence with
    a capital letter or indenting a new paragraph.


    One thing to note is that the spacing in code does not affect whether or not it
    works. However, it is conventional and efficient to write properly spaced code
    so that you and other programmers can read and understand it more easily. You
    will learn how to space as you read more sample code. Eventually, you will start
    to notice trends in how conventional spacing works in programming.


    p ublic class ThisIsAClass {


    public static void main (String args[]) {


    int x = 5;


    System.out.println(“The number is” + x);


    }


    }'
