    \ `partners1`，但在同一个迭代中我们将使用相同的索引来访问两个数组），并在每次迭代中，我们根据循环设置两个变量 `p1` 和 `p2`，分别设置为相应的伙伴。然后，我们创建了一个新的\
    \ `for` 循环将再次遍历整个数组。在这个循环中，我们检查是否存在反向关系，也就是说我们寻找 `p1` 是否与循环位置的 `partner2` 相同，以及\
