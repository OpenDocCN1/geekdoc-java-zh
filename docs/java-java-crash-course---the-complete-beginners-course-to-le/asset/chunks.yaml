  trans: "\n\n`StringBuffer` 是一个同类类，提供了许多常用功能。`String` 代表固定长度的字符序列，而 `StringBuffer`\
    \ 则表示长度可变的字符序列。`StringBuffer` 可以在中间插入字符和子字符串，也可以在末尾追加。编译器会自动创建一个 `StringBuffer`\
    \ 来评估某些表达式，特别是在对字符串对象使用重载运算符 `+` 和 `+=` 时。\n\n## 构造函数\n\n我们有三种不同的构造函数来创建 `StringBuffer`\
    \ 数据，每个构造函数在此处列出了其语法。\n\n* `StringBuffer sb = new StringBuffer ();`\n\n这是一个空构造函数。它将创建一个\
    \ `StringBuffer` 对象，但其中没有任何任何内容。你可以通过简单地向字符串缓冲区对象进行赋值来提供这些数据。\n\n* `StringBuffer\
    \ sb = new StringBuffer(16);`\n\n这是一个参数化构造函数，只有一个参数：新创建的 `StringBuffer` 的大小。例如，这将会创建一个容量为\
    \ 16 个字符的新的 `StringBuffer` 对象。\n\n* `String s;`\n\n`StringBuffer sb = new StringBuffer(s);`\n\
    \n这是一个参数化构造函数，只有一个参数：字符串数据对象。例如，这将会创建一个 `StringBuffer` 对象，然后获取 `String s` 的数据。\n\
    \n## StringBuffer 方法\n\n* `length()`\n\n从此 `StringBuffer` 创建一个字符串或将其转换为字符串。\n\n\
    `length()` 的示例：\n\n```\nStringBuffer text = “test”;\nint amount = text.length();\n\
    System.out.println(“The amount of characters are: “ + amount);\n```\n\n`StringBuffer`\
    \ 对象中的 `.length()` 函数或属性返回 `String` 对象中字符的数量，并将该值赋值给整数 `amount`。此示例代码的输出将为 4，因为\
    \ “test” 长度为四个字符。\n\n* `capacity()`\n\n返回当前分配的空间数。\n\n容量的示例：\n\n```\nStringBuffer\
    \ s1=new StringBuffer(16);\nint capacity=s1.capacity();\nSystem.out.println(“Capacity\
    \ of the StringBuffer”+capacity);\n```\n\n`capacity()` 方法将返回 `StringBuffer` 对象的容量。此示例代码将创建一个新的\
    \ `StringBuffer` 对象 `s1`，一旦我们调用 `capacity` 方法，它将返回新 `StringBuffer` 对象 `s1` 的容量。结果将存储在整数变量\
    \ `capacity` 中。最后，我们通过 `println` 方法打印 `s1` 的容量。\n\n`boolean ensureCapacity()`\
    \ 使 `StringBuffer` 至少持有所需的空间数。\n\n* `setLength()`\n\n截断或扩展之前的字符字符串，如果扩展，则用空值填充。\n\
    \n`setLength` 的示例：\n\n```\nStringBuffer s1=new StringBuffer();\ns1.setLength (25);\n\
    ```\n\n此 `setLength` 方法将调整 `StringBuffer` 的大小。在这个示例中，我们正在使用 `setLength` 方法调整数据大小。\n\
    \n* `charAt(int)`\n\n返回缓冲区该位置的字符。\n\n`charAt` 的示例：\n\n```\nString text = “Hello\
    \ World!”;\nchar letter = text.charAt(0);\n```\n\n`letter` 的值包含字母 “H”，因为输入的字符串索引为\
    \ 0，它是字符串的第一个字母。计算机读取字符串的方式是从 0 到字符串的长度，而不是 1。\n\n* `setCharAt(int,char)`\n\n\
    修改该位置的值。\n\n`setCharAt` 的示例：\n\n```\nStringBuffer sb = \"Hello\";\nsb.setCharAt(2,'w');\
    \          Hewlo;\n```\n\n在这个示例中，我们通过 “w” 更改第二个索引的数据。\n\n* `getChars()`\n\n将字符复制到外部数组中。没有像字符串那样的\
    \ `getBytes()`。\n\n* `append()`\n\n将参数转换为字符串并将其追加到当前缓冲区的末尾。\n\n`append` 的示例：\n\
    \n```\nStringBuffer s1=new StringBuffer(25);\ns1=”Hello”;\ns1.append(“AABBCC”);\n\
    ```\n\n在这个示例中，`append` 将 “AABBCC”文本添加到此 `s1` `StringBuffer` 对象的末，因此最终结果为 “HELLOAABBCC.”\n\
    \n* `insert()`\n\n将第二个参数转换为字符串并从偏移量开始插入到当前缓冲区。\n\n`insert` 的示例：\n\n```\nStringBuffer\
    \ s1=new StringBuffer(“Dwayne Johnson”);\ns1.insert(7,” The Rock ”);\n```\n\n\
    此示例代码将第二个参数的文本插入到 `StringBuffer` 对象的指定索引处，最终结果为 “Dwayne The Rock Johnson.”\n\n\
    * `reverse()`\n\n反转缓冲区中字符的顺序。\n\n`reverse` 的示例：\n\n```\nStringBuffer s1=new StringBuffer(“Saravanan”);\n\
    System.out.println(“Reverse string is:”+s1.reverse());\n```\n\n此示例以反转顺序转换字符串数据；最终结果为\
    \ “nanavaraS.”\n\n示例：\n\n```\nclass StringBufExample\n{\n    public static void\
    \ main(String args[])\n    {\n        StringBuffer sb = new StringBuffer(\"Hello\
    \ World\");\n        System.out.println(sb + \".capacity() = \" + sb.capacity());\n\
    \        System.out.println(sb + \".length() = \" + sb.length());\n        System.out.println(sb\
    \ + \".insert(5,aaa) = \" + sb.insert(5,\"aaa\"));\n        System.out.println(sb\
    \ + \".capacity() = \" + sb.capacity());\n        System.out.println(sb + \".length()\
    \ = \" + sb.length());\n    }\n}\n```\n\n"
- fmt: "\nFor the following examples, I will use an `if` statement. An `if` statement,\
    \ simply put, checks to see IF something is true or false. To create an `if` statement,\
    \ you simply write the word `if` followed by two rounded brackets. This will contain\
    \ the logic to check IF something is true or not. `if` statements can also include\
    \ `else if` statements, and `else` statements. An `else if` statement will run\
    \ if the `if` statement returns false. However, it also contains its own parameter\
    \ that must return true. An `else` statement also is called if the `if` statement\
    \ returns false. The difference between an `else` statement and an `else if` statement\
    \ is that no parameters need to be true for an `else` statement to run.\n\n###\
    \ Example\n```java\nint a = 10;\nint b = 20;\n\nif (a == b) {\n    System. out\
    \ .println(\"a is equal to b \");\n}\nelse if (a > b) {\n    System. out .println(\"\
    a is greater than b \");\n}\nelse {\n    System. out .println(\"a is not equal\
    \ to b or greater than b \");\n}\n```\n\nThe operands used in this example (`==`\
    \ and `>`) are explained below. In the following code, we first check to see if\
    \ `a` is equal to `b`. If that is true, we print `a is equal to b` and ignore\
    \ the rest of the code. If `a` does not equal `b,` then the program calls the\
    \ `else if`. The `else` is due to the first `if` returning false. The `if` part\
    \ of `else if` checks its own parameters, which in this case is whether `a` is\
    \ greater than `b`. If `a` is greater than `b`, then the program would have printed\
    \ `a is greater than b`. However, since `a` is less than `b`, we go further down\
    \ and simply call `else`, which runs if all the above parameters return false.\
    \ It does not require its own parameter to be true. \n\nNote that each `if` statement\
    \ can have an infinite number of `else if` statements following it, but only one\
    \ `else` statement. Also note that you cannot have code between an `if` statement\
    \ and an `else` statement, because the code would not be able to find the `else`.\
    \ Also, an `else` statement requires there to be an `if` statement before it,\
    \ since for an `else` statement to be called, an `if` statement HAS to equal false\
    \ immediately before it. It is also important to know that it is possible to have\
    \ an `if` statement INSIDE of another `if` statement. This is called a NESTED\
    \ `if` statement.\n\n### Example\n```java\nint a = 20;\nint b = 30;\n\nif (a ==\
    \ 20) {\n    if (a < b) {\n        System. out .println(\"a is less than b and\
    \ it is equal to 20\");\n    }\n}\n```\n\nIn this example, we first check if the\
    \ value of `a` is equal to the value of `b`. If it is, then we check to see if\
    \ the value of `a` is less than the value of `b`. If this statement also returns\
    \ true, we can print to the console `a is less than b and it is equal to 20`.\
    \ This can work with as many `if` statements as you like. This can be useful if\
    \ it is completely necessary to check the parameters separately, or if you want\
    \ to add additional logic between each check. You will fully understand the way\
    \ an `if` statement works by the end of this section.\n\n## Relational Operators\n\
    \nJava supports 6 different types of relational operators, which can be used to\
    \ compare the value of variables. They are the following:\n\n### `==`\nThis operator\
    \ checks to whether the value of two integers are equal to each other. If they\
    \ are equal, the operator returns `true`. If they are not, it returns `false`.\n\
    \n#### Example\n```java\nint a = 10;\nint b = 10;\n\nif (a == b) {\n    System.\
    \ out .println(\"they are the same\");\n}\n```\nThis code checks to see IF the\
    \ value of `a` is equal to the value of `b`. Since the value of `a` is equal to\
    \ the value of `b`, the value within the brackets will be `true`. This ends up\
    \ causing the above code to print out the statement `they are the same`.\n\n###\
    \ `!=`\nThis operator checks whether the value of two things ARE NOT equal. If\
    \ two things DO NOT equal the same thing, then it will return `true`. If they\
    \ DO equal the same thing, it will return `false`.\n\n#### Example\n```java\n\
    int a = 10;\nint b = 20;\n\nif (a != b) {\n    System. out .println(\"they are\
    \ not the same\");\n}\n```\nThis code will check if `a` does not equal `b`. Since\
    \ `a` does not equal `b`, the program will print `they are not the same` in the\
    \ console.\n\n### `>`\nThis operator checks if something is greater than something\
    \ else. If the value of the variable in front of it is greater than the value\
    \ of the variable after it, it will return `true`. If the value of the variable\
    \ in front of it is less than the value of the variable after it, it will return\
    \ `false`.\n\n#### Example\n```java\nint a = 10;\nint b = 20;\n\nif (a > b) {\n\
    \    System. out .println(\"a is larger than b\");\n}\nelse {\n    System. out\
    \ .println(\"a is not larger than b\");\n}\n```\nThis example checks to see if\
    \ `a` is larger than `b`. Since `a` is not larger than `b`, this `if` statement\
    \ will return `false`. Instead, it will print `a is not larger than b`, because\
    \ the code passes the failed `if` statement and thus calls the `else` statement.\n\
    \n### `<`\nThis operator checks if something is less than something else. If the\
    \ value of the variable before it is less than the variable after it, it will\
    \ return `true`.\n\n#### Example\n```java\nint a = 10;\nint b = 20;\n\nif (a <\
    \ b) {\n    System. out .println(\"a is less than b\");\n}\n```\nWait, the text\
    \ says: \"This operator checks to see if something is less than something else.\
    \ If the value of the variable before it is less than the variable after it, it\
    \ will return true. Example:\n```java\nint a = 10;\nint b = 20;\n\nif (a < b)\
    \ {\n    System. out .println(\"a is less than b\");\n}\n```\n(Note: The source\
    \ text had a logic inconsistency in the example for `<`, I have maintained the\
    \ structure based on the description).\n\n### `>=`\nThis operator checks if something\
    \ is greater than or equal to something. If the value of the variable before it\
    \ is greater than or equal to the variable after it, it will return `true`.\n\n\
    #### Example\n```java\nint a = 20;\nint b = 20;\n\nif (a >= b) {\n    System.\
    \ out .println(\"a is greater or equal\");\n}\n```\n\n### `<=`\nThis operator\
    \ checks if something is less than or equal to something. If the value of the\
    \ variable before it is less than or equal to the variable after it, it will return\
    \ `true`.\n\n#### Example\n```java\nint a = 20;\nint b = 20;\n\nif (a <= b) {\n\
    \    System. out .println(\"a is less or equal\");\n}\n```\n\n## Logical Operators\n\
    \nJava supports three Logical Operators that can be used in your logic, which\
    \ will often be used in conjunction with Relational Operators.\n\n### `&&`\nThis\
    \ is known as the logical AND operator. If the operands before and after this\
    \ operator both return `true`, then the condition returns `true`. If both of the\
    \ operands are false, or one operand is false, the condition will return `false`.\
    \ BOTH operands MUST be true for the condition to return true.\n\n#### Example\n\
    ```java\nint a = 20;\nint b = 20;\n\nif (a == 20 && a == b) {\n    System. out\
    \ .println(\"a is equal to 20 and b \");\n}\nelse {\n    System. out .println(\"\
    a is not equal to 20 or a is not equal to b\");\n}\n```\nIn this example, we check\
    \ to see if `a` is equal to 20 AND if `a` is equal to `b`. These two conditions\
    \ will be referred to as operands. Since `a` is equal to 20 and equal to `b`,\
    \ the statement returns true, and we print `a is equal to 20 and b` to the console.\n\
    \n#### Example 2\n```java\nint a = 20;\nint b = 30;\n\nif (a == 20 && a == b)\
    \ {\n    System. out .println(\"a is equal to 20 and b\");\n}\nelse {\n    System.\
    \ out .println(\"a is not equal to 20 or a is not equal to b\");\n}\n```\n"
