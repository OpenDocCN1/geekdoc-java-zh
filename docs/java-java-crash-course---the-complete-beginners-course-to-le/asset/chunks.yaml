    Checkbox () ___Creates a checkbox without label text.


    Checkbox (String str)___Creates a checkbox with label text.


    Checkbox (String str, Boolean state)___Creates a checkbox with label text and
    you can test the


    checkbox with Boolean state. If you pass a true value, then it will create the
    checkbox with a check mark; if false, then it won’t have a check mark.


    Checkbox (String str, CheckboxGroup, Boolean state)___Used to convert a checkbox
    to a Radio button. If you pass the CheckboxGroup object, then it will create a
    Radio button.


