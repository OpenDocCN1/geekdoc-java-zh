    # Chapter 19


    # JDBC Programming


    Basically all software has two “ends”: Frontend and Backend. Frontend means the
    user interface of the Application and backend means the database. Frontends are
    created through the programming language. For example, if you create a program
    with the help of Java, VB, C#, etc. that program will be considered Frontend.
    Backend is used to store data. If you want to see those data in your program,
    you will need to connect your backend to the frontend. In Java, JDBC (Java Database
    Connectivity) plays a major role in connecting frontend and backend.


    In the following section, we have described how JDBC connects with the program.


    Java Program---------JDBC-------------ODBC--------Database


    A Java program starts its connecting process with the JDBC, then it connects with
    ODBC. The ODBC reads the data from database. Finally, the data are displayed in
    the user interface.


    We have a set of classes to create the connection between frontend and backend,
    contained in the Java.sql package. In the following section, we will see the important
    classes and methods involved in connection creation. Before starting the JDBC,
    you need to know SQL concepts because it is necessary to know the SQL query to
    handle the database data. The following section will briefly explain the task.


    ## Important Queries in SQL


    ### Database Creation


    create database database_name;


    This query will create a new database.


    Create table table_name(field_name1 datatype, field_name2 datatype……);


    This query will create a new table with some fields.


    Insert into table_name values(‘data1’,data2,data3…..);


    This query will add the new record to the table.


    Alter table table_name add/drop column_name datatype;


    This query will alter the field or field data type, or will delete the field.


    Update table_name set column_name=”value” where condition;


    This query will update a particular column.


    Select * from table_name;


    This query will show all records inserted in the table.


    Sample Query


    create database db1;


    create table student(Sname varchar(25),Sno int,age int);


    insert into student values(‘Mathew’,6001,23);


    insert into student values(‘Antony’,6002,23);


    insert into student values(‘William’,6003,23);


    select * from student;


    Important Classes in java.sql


    Connection               Contains some important methods that are used to establish
    the connection.


    Statement              Contains some methods that are used to run some SQL queries.


    Resultset              Contains some methods and holds the records retrieved from
    the table.


    ### Steps Involved in Connection Creation


    Step 1: Initialize the driver file Class.forName(“sun.jdbc.odbc.JdbcOdbcDriver”);


    Step 2: Establish a connection with the database.


    Step 3: Query the database.


    ### Methods Involved in Database


    Connection createStatement()___Initializes the statement object.


    Statement executeUpdate()___Runs queries like alter, insert, create, drop, update,
    and delete.


    executeQuery()___Runs the selected statement.


