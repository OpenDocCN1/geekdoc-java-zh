  trans: "\n在这个 Java 记事本应用程序中，我们创建了一个基础文本编辑器，具有新建、打开、保存和退出等简单功能。这应该能让你了解关于如何使用文本区域组件创建菜单的所有知识。如果你有任何困惑，请查看我们在菜单创建部分中的示例程序。所有菜单项都会生成一个动作事件（action\
    \ event），因此你需要实现 `ActionListener` 接口来处理由每个选项生成的动作事件。如果你选择了一个新选项，将立即生成一个动作事件并调用\
    \ `action()` 方法。在那里，我们检查选择了哪个选项。如果你点击“新建”选项，它将擦除文本区域内的所有内容。如果你选择“打开”选项，它将打开一个加载框，你可以在其中选择任何文件，文件将立即加载到文本区域。如果你选择“保存”选项，它将打开一个保存框，你可以在其中保存文本区域中的文本。最后一个选项是“退出”，它将停止我们的记事本应用程序的运行。\n\
    \nJava Swing 是一个功能全的用户界面开发工具包，用于在 Java 应用程序中创建界面。该工具包包含了大量的各种部件和工具，用于帮助创建图形用户界面。它具有内置控件，如按钮、布局管理器、滑块、文本字段、标签等。它还具有一些高级控件，如树、表格、滚动面板和标签页控件。\n\
    \n在本指南中，你将学习如何在 Java Swing 中开发界面的基础知识。这应该足够你入门了，但剩下的取决于你自己。记住，Java API 可供你使用。\n\
    \n让我们先回顾几个需要记住和理解的重要对象。\n\n在开始之前，记住 Swing 中的以下三个包是非常重要的：\n\n```\nimport javax.swing.*;\n\
    import java.awt.*;\nimport java.awt.event.*;\n```\n\n`javax.swing` 是包含所有 Swing\
    \ 应用程序开发所需类的包。`JApplet`、`JButton`、`JTree` 和 `JScrollpane` 是 Swing 包的一些示例类。\n\n\
    ## JFrame\n`JFrame` 对象简单来说是一个允许窗口在屏幕上出现的对象。你可以将 `JFrame` 想象成一块画布，它是向界面中添加元素时所需的的基础基础。在\
    \ Swing 中，这些元素被称为“组件”（components），并在本指南的剩余部分将统称为此类。\n\n要声明一个 `JFrame` 对象，你可以执行简单的操作：\n\
    \n```\nJFrame frame = new JFrame(\"Title\");\nframe.setSize(250,250);\nframe.setDefaultCloseOperation(frame.EXIT_ON_CLOSE);\n\
    frame.setVisible(true);\n```\n\n![`lh6.googleusercontent.com/_bSU5VKMJ7pFENUyn4JxxxOjIJoVINznpLeKWN1to4oewXWRWeq3X8PQHlart0u5O88I2I0mmxT60rHIkE9-wBWxLThAxqt1Ngf-NFH-1zdbfT1S_B9VfvOyGZhKQlcvJKZQpVk`](img/Image00017.jpg)\n\
    \n让我们分析上面示例代码中的每一行。\n\n```\nJFrame frame = new JFrame(\"Title\");\n```\n\n在这一行中，正在声明\
    \ `JFrame` 对象。`JFrame` 构造函数的参数接收一个字符串，该字符串被视为窗口标题。另一种方法是让构造函数为空，然后使用方法：\n\n```\n\
    frame.setTitle(\"Title\");\n```\n\n让我们继续下一行：\n\n```\nframe.setSize(250,250);\n\
    ```\n\n这一行应该是不言易明的。`JFrame` 对象中有一个名为 `setSize` 的方法，它接收两个值。第一个值是 `JFrame` 的宽度，第二个值是高度。\n\
    \n```\nframe.setDefaultCloseOperation(frame.EXIT_ON_CLOSE);\n```\n\n下一行简单地告诉窗口，如果通过点击\
    \ x 按钮或通过控制台结束程序，它应该退出窗口而不是保持打开状态。\n\n```\nframe.setVisible(true);\n```\n\n这是所有行中最明显的一行，这一行简单地将\
    \ `JFrame` 的可见性设置为 `true`，以便用户能够看到窗口。\n\n## JPanel\n在界面的画布 (`JFrame`) 中，我们需要一个面板（panel），这样我们向其中添加组件（按钮、标签等）。你可以将\
    \ `JFrame` 想象成剪贴板，将 `JPanel` 想象成纸，这个额外的层允许你在界面上绘制并添加不同类型的组件。需要注意的是，组件可以被添加到原始画布\
    \ (`JFrame`) 上。然而，这样做可能会产生很多复杂问题。这就是为什么我们应该向 `JFrame` 添加一个 `JPanel`。\n\n要声明一个\
    \ `JPanel`，你可以结合之前的示例代码执行以下操作：\n\n```\nJFrame frame = new JFrame();\nframe.setTitle(\"\
    Title\");\nframe.setSize(250,250); \nframe.setDefaultCloseOperation(frame.EXIT_ON_CLOSE);\n\
    JPanel panel = new JPanel(); // 新行代码\nframe.add(panel); // 新行代码\nframe.setVisible(true);\n\
    ```\n\n在 Swing 类层次结构中的每个对象中，都有一个常用的方法称为 `add`，它可以接收任何 Swing 组件。`JPanel` 被认为是一个组件，因此被添加到框架中。现在，`JPanel`\
    \ 可以通过引用 `JPanel` 的对象名称并使用 `add` 方法为其添加组件。`JFrame` 和 `JPanel` 对象在技术上具有相同的方法，因此你可以像使用\
    \ `JFrame` 一样使用它们。\n\n## JLabel\n`JLabel` 对象仅仅是一个可以添加到面板的 Swing 组件。它在 `JFrame`\
    \ 窗口中充当文本元素。为了向我们创建的面板添加 `JLabel` 组件，只需执行：\n\n```\nJFrame frame = new JFrame();\n\
    frame.setTitle(\"Title\");\nframe.setSize(250,250);\nframe.setDefaultCloseOperation(frame.EXIT_ON_CLOSE);\n\
    JPanel panel = new JPanel();\nframe.add(panel);\nframe.setVisible(true);\nJLabel\
    \ lblText = new JLabel(\"This is Text\");\npanel.add(lblText);\n```\n\n![`lh3.googleusercontent.com/RC-xUZDHAYBmwqL92pFXU1EyHvDg1hNpEG6sFjvUPp0Xu_HRpTwAMVLM9dx9tiIb91rg`](img/Image00018.jpg)\n\
    \n如上面最后两行所示，你可以看到创建一个 `JLabel` 对象非常简单，它接收一个字符串作为构造函数并用其显示文本。完成此操作另一种方法是让构造函数为空并对\
    \ `JLabel` 使用 `setText` 方法。下一行简单地将 `JLabel` 对象添加到面板。你可能在想如何让程序决定在哪里显示文本。我们将在布局管理器部分进一步讨论这个问题。\n\
    \n## JButton\n`JButton` 对象也是可以添加到 `JPanel` 的 Swing 组件。该组件在 `JFrame` 窗口中充当按钮元素。为了向面板添加\
    \ `JButton` 组件，只需执行：\n\n```\nJFrame frame = new JFrame();\nframe.setTitle(\"Title\"\
    );\nframe.setSize(250,250); \nframe.setDefaultCloseOperation(frame.EXIT_ON_CLOSE);\n\
    JPanel panel = new JPanel();\nframe.add(panel);\nframe.setVisible(true);\nJLabel\
    \ lblText = new JLabel(\"This is Text\");\npanel.add(lblText);\nJButton btnTest\
    \ = new JButton(\"Test\"); // 新行代码\npanel.add(btnTest); // 新行代码\n```\n\n![`lh5.googleusercontent.com/_GrlbOqJ9cP7bUeHV6mgZ1rUA1hNpEG6sFjvUPp0Xu_HRpTwAMVLM9dx9tiIbIKqFda-BTTRq7A7f-OtNZuNajb78akeDnnmpFfnbjSayzHS8kdjs2C9L5EHQ`](img/Image00019.jpg)\n\
    \n在最后两行中，我们看到 `JButton` 对象接收字符串的值作为构造函数，并用作按钮名称。另一种方法是让构造函数为空并对 `JButton` 使用 `setText`\
    \ 方法。然后，我们将 `JButton` 组件添加到 `JPanel`。\n\n"
- fmt: "\nIn this section, we will learn about layout managers and how to setup Swing\
    \ components in the window to your satisfaction. There are many different types\
    \ of layout managers in Java. The default layout is the `FlowLayout`, which we\
    \ have been using. For the other layouts, you must specify the type of layout\
    \ you want to use. If you do not specify a specific layout, then the `FlowLayout`\
    \ will be used by default. This guide is going to get too long if we go over all\
    \ the layouts individually, so instead we’ll briefly show you some visuals of\
    \ the different types of layouts so you can decide which ones you’d like to explore.\
    \ Before we go over the list of layouts, let’s go over how you can set one up.\
    \ There are different ways to set up your layout depending on which type you choose,\
    \ but there is one constant line you must always remember:\n\n```\npanel.setLayout(new\
    \ GridLayout(10, 1));\n```\n\nIn the line above, we have used the `setLayout`\
    \ method, which will take a specific `Layout` object. For example purposes, we\
    \ will input a `GridLayout` into the layout parameter. This is how we can set\
    \ a layout for different types of panels or frames within Swing.\n\nNow let’s\
    \ go over all the different types of layouts:\n\n### BorderLayout\n\n![https://lh3.googleusercontent.com/LTx7txGpuysBnDDsTQytrSppINRLMD0c2xBgm45DMlRGv22tVMzuE00pEDAm1NYtClE8HdfoCBtra8V9C9b0QFWmnUY3Q7jlqEinsaN5i7P8gAjWk-6p95DHxxmLSDep9UmAQro](Image00020.jpg)\n\
    \nThe `BorderLayout` gives you the option to place components at the top, bottom,\
    \ left, right, and center of the panel.\n\n### BoxLayout\n\n![https://lh4.googleusercontent.com/ZkQ2PlFYCtVkhh9FiI3qq_-fYCRX7XiVZeIk91FoHKpNe9GyEy8x-RunaWP6jw8-Vesx6bJ57xgCfhBPKMFLk4ViJfzZU7UgE4htJ0pGdOjFrwrJR4EOm8xUG17Gjv4QdcYEOBc](Image00021.jpg)\n\
    \nThe `BoxLayout` allows you to put components in a single row or column and allows\
    \ the user to easily specify any custom maximum size. On top of that, it also\
    \ allows you to align the components according to your needs.\n\n### CardLayout\n\
    \n![https://lh5.googleusercontent.com/6xQLfwRErxIKOWmqZjc0Hh5JiyDQ-nie7lYeyxkAmOdgv7stZs0-hSsBFFVgyCcjE_o88YC3W6iaFhO0iyPaju6fUga_--hsw9nwhgLNiGcAUUY3vYbklZaqDLBqjUY2toNLO8E](Image00022.jpg)\n\
    \n![https://lh6.googleusercontent.com/BwSgX50XcVIaaFsinsm6PXA7Zb88vJtSE5qZ_OqTA0zaR1CZAC0i8e96sEfo8kPeM1C2MfLTHFgPrfEiIch_LqopKzs-ZSZ3WMJV-k72auwlg3CUhECVGYywIEAXFDiUYY0rLoo](Image00023.jpg)\n\
    \nThe `CardLayout` allows you to implement an area that contains different components\
    \ at different times.\n\n### FlowLayout\n\n![https://lh5.googleusercontent.com/g20IhW_SBqTBSuE-Zi9hCU9N8tBu-9BxNoASul_m6XRjQhDIdCfBYdiIx_k2SbeOzbR8KEhAFJvwA_WptyxqzB1CqsSuGqzrto05VRQNsPJIfdRsigEfkx7uswPgoUiWyF1eA1M](Image00024.jpg)\n\
    \nThe `FlowLayout` is the default layout manager and does not need to be specified\
    \ for use. All it does is lay out components in a single row and start a new row\
    \ depending on the width of the window.\n\n### GridBagLayout\n\n![https://lh6.googleusercontent.com/vWYIgQefbmJelIBiVE4DgF3ElW8q3ch5Ssn7iCeZA3xG7edRFpugspMoppaFP8UDxqNrADeoH076YBOk5Eg7xr3yc9kkSh2vjDPvLq7HmRtGMAbVtldJQ1Dmz1ZYRniSzM2KUVU](Image00025.jpg)\n\
    \nThe `GridBagLayout` is the most flexible layout manager of all; it allows you\
    \ to easily align and place components within a grid of cells.\n\n### GridLayout\n\
    \n![https://lh5.googleusercontent.com/bFhhaheNQhxQluWNkQ_WdrrfGl7yYN03uhbigpGt0uuq--m0mqOdNAMGx4THVZTRbnUlLZntNzY-HKYeuQyB71l3ehjKJQ83G26GV7mStVW0DNpG_EtLjYlnsWZBQP6QK5UVKC8](Image00026.jpg)\n\
    \nThe `GridLayout` makes all components equal in size so they can be displayed\
    \ sequentially within a grid, depending on the order of how elements are added—sort\
    \ of like `FlowLayout` organized into rows and cells.\n\n### GroupLayout\n\n![https://lh4.googleusercontent.com/RO-yzJ9XluXy2MN5pca-4bDmx1jwkh71lXnR39P-Imk3_Xphk88shj26mi_XVNS50k19pUfrDoV1EU7IJTA](Image00027.jpg)\n\
    \nThe `GroupLayout` allows you to work with separate horizontal and vertical layouts\
    \ that independently defined for each dimension.\n\n### SpringLayout\n\n![https://lh4.googleusercontent.com/vp-P8EgFti0Zjh_tr2QAyopAyvmTN2qvDT8sp7uAFF_g0QxNo_FczXqe0ah68tMYx6LutGy](Image00028.jpg)\n\
    \n![https://lh4.googleusercontent.com/Yot_m-Xuw1ai5daEFzcqbEt8HO3Tn6yw9Fc4aKld02I_czL_M78EqLyJaocTedhr0ZuAo957FTNiTbBJ](Image00029.jpg)\n\
    \nThe `SpringLayout` is another flexible layout manager that allows you to specify\
    \ distance of elements from other elements, such as defining the left edge of\
    \ a component relative to another component’s right edge.\n\n# Chapter 18: Event\
    \ Handling\n\nThe idea of Event Handling is that GUI elements interact with each\
    \ other depending on what they are asked to do in certain situations. In this\
    \ part, we will look at handling the event of a user clicking a button in Java\
    \ UI. In order to set up a `JButton` component, we add an `ActionListener`. A\
    \ `Listener` is simply a function within a GUI element that will wait before reacting\
    \ accordingly. When adding an action listener to a GUI component, it must reference\
    \ a class that implements the `ActionListener` interface. Once the interface has\
    \ been implemented, you will have to implement the methods of that interface accordingly.\
    \ Using all of our knowledge about GUIs, we are able to create a basic calculator\
    \ using some Event Handling to listen for a mouse click on `JButton`.\n\n```java\n\
    import javax.swing.*;\nimport java.awt.*;\nimport java.awt.event.*;\n\npublic\
    \ class GUI extends JFrame implements ActionListener {\n    JPanel mainPanel;\n\
    \    JLabel lblfNum;\n    JLabel lblsNum;\n    JLabel lblResult;\n    JButton\
    \ btnAdd;\n    JButton btnSubtract;\n    JButton btnMultiply;\n    JButton btnDivide;\n\
    \    JTextField txt_fNum;\n    JTextField txt_sNum;\n\n    public GUI() {\n  \
    \      setDefaultCloseOperation(EXIT_ON_CLOSE);\n        setSize(300, 300);\n\
    \        setTitle(\"Basic Calculator\");\n        setVisible(true);\n        Initialize();\n\
    \    }\n\n    private void Initialize() {\n        mainPanel = new JPanel();\n\
    \        mainPanel.setLayout(new GridLayout(10, 1));\n        lblfNum = new JLabel(\"\
    First Number\", JLabel.CENTER);\n        lblsNum = new JLabel(\"Second Number\"\
    , JLabel.CENTER);\n        lblResult = new JLabel(\"---\", JLabel.CENTER);\n \
    \       txt_fNum = new JTextField();\n        txt_sNum = new JTextField();\n \
    \       btnAdd = new JButton(\"Add\");\n        btnSubtract = new JButton(\"Subtract\"\
    );\n        btnMultiply = new JButton(\"Multiply\");\n        btnDivide = new\
    \ JButton(\"Divide\");\n        SetListeners();\n        mainPanel.add(lblfNum);\n\
    \        mainPanel.add(txt_fNum);\n        mainPanel.add(lblsNum);\n        mainPanel.add(txt_sNum);\n\
    \        mainPanel.add(btnAdd);\n        mainPanel.add(btnSubtract);\n       \
    \ mainPanel.add(btnMultiply);\n        mainPanel.add(btnDivide);\n        mainPanel.add(lblResult);\n\
    \        add(mainPanel);\n        revalidate();\n    }\n\n    private void SetListeners()\
    \ {\n        btnAdd.addActionListener(this);\n        btnSubtract.addActionListener(this);\n\
    \        btnMultiply.addActionListener(this);\n        btnDivide.addActionListener(this);\n\
    \    }\n\n    public void actionPerformed(ActionEvent e) {\n        String btnName\
