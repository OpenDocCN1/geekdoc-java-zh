  \n\n任何编程语言在你犯任何错误时都会抛出错误。在 Java 编程中，我们有两种不同类型的错误：语法错误和运行时错误。基本上，语法错误在我们违反语言规则时产生，例如缺少分号或括号、变量名不匹配等。这类错误可以很容易地修正，因为它们在你编译程序时就会被报告——因此它们也被称为“编译时错误”。另一方面，某些类型的错误只有在你开始运行程序后才会出现。这些被称为“运行时错误”，也称为“异常”。异常有两种不同类型：预定义的异常和用户自定义的异常。所有预定义的异常都是借助\
  \ `Exception` 类的帮助定义的。\n\n在编写代码时，你可能会遇到这样的情况：你的代码在尝试执行某项操作时返回了一个异常。例如，如果一个对象在构造函数中需要一个整数，但你给它的是\
  \ `null`，编译器将返回一个错误，指示该对象没有接收到相应的参数。`Exception` 类是所有类型 `Exception` 类的父类。因为每个异常都由特定的\
  \ `Exception` 类进行处理。例如，除以零异常仅由 `ArithmeticException` 类处理。在接下来的章节中，我们列出了一些预定义的异常类以及它们处理的异常。\n\
  \n## 预定义异常类\n\n- `ArithmeticException`: 处理由数学错误引起的异常，例如除以零。\n- `ArrayIndexOutOfBoundsException`:\
  \ 处理数组索引越界的异常。\n- `ArrayStoreException`: 当程序试图在异常中存储错误类型的数据时产生。\n- `FileNotFoundException`:\
  \ 当我们尝试访问不存在的文件时产生。\n- `IOException`: 产生于一般的 I/O 失败，例如无法从文件中读取。\n- `NullPointerException`:\
  \ 当我们引用空对象时产生。\n- `NumberFormatException`: 当字符串和数字之间的转换失败时产生。\n- `OutOfMemoryException`:\
  \ 当没有足够的内存分配新对象时产生。\n- `SecurityException`: 当 applet 尝试执行浏览器安全设置未允许的操作时产生。\n- `StringIndexOutOfBoundsException`:\
  \ 当程序尝试访问字符串中不存在的字符位置时产生。\n- `NegativeArraySizeException`: 当声明数组大小为负数时产生。\n\n另一个示例是你处理文件操作时（稍后会教），并且你尝试读取一个不存在的目录中的文件。编译器会返回诸如“FileNotFoundException”之类的异常——还有其他的，但这种异常在文件处理中经常遇到。\n\
  \n为了在代码中规范异常，你可以使用 `try-catch` 语句。这些语句的作用是检查代码块是否返回了异常；如果是，它不会停止整个程序的运行，而是捕获该异常并尝试修复它或绕过它，取决于程序员编写的代码。\n\
  \n我们可以通过以下语句或块的帮助处理这种类型的异常：\n- `Try catch finally` 块\n- 嵌套 `Try` 块\n- 多个 `catch`\
  \ 块\n- `Throw` 语句\n- `Throws` 语句\n\n### 1. Try Catch Finally 块\n\n```java\ntry\n\
  {\n    // 此块下保留异常产生的语句 . . . . . . . . . .\n    // 如果产生任何异常，它们将被抛出到 catch 块\n}\n\
  catch(Exception_class object)\n{\n    // 此块处理抛出的异常并平稳结束程序。\n}\nfinally\n{\n    //\
  \ 这个 finally 块始终运行，不关心异常。\n}\n```\n\n在下面的示例中，你可以看到 `try catch finally` 块是如何处理抛出的异常的。文件“text.txt”并不。\n\
  \n```java\nimport java.io.*;\nimport java.lang.*;\n\nclass ExceptionDemo\n{\n  \
  \  public static void main(String args[])\n    {\n        try {\n            ReadFile(\"\
  text.txt\");\n        }catch(Exception e) {\n            System.out.println(\"文件不存在.\"\
  );\n        }\n        finally\n        {\n            System.out.println (\"在读取文件之前请检查它是否存在\"\
  );\n        }\n    }\n}\n```\n\n`try` 语句不需要参数，但 `catch` 异常需要 `Exception` 对象的参数。当异常确实发生时，类型为\
  \ `Exception` 的变量 `e` 会被赋予数据，可以对变量 `e` 进行操作以打印错误或执行各种其他事情。用于 `e` 变量的常用方法是 `e.printStackTrace()`。\n\
  \n### 2. 嵌套 Try 块\n\n此块在另一个 `try` 块内部包含一个 `try` 块。遵循该语法有助于你理解嵌套 try 块。在嵌套 try 块中，每个\
  \ `try` 块都有自己的 `catch` 块。\n\n```java\ntry {\n    // 异常产生的程序语句 . . . .\n    try\n\
  \    {\n        // 异常产生的程序语句 . . . . . .\n    }\n    catch(Exception_class object)\n\
  \    {\n        // 异常处理语句 . . . . . .\n    }\n}\ncatch(Exception_class object)\n\
  {\n}\n```\n\n### 3. 多个 Catch 块\n\n在多个 catch 块中，一个 `try` 块可以包含多个 `catch` 块，这样你可以轻松地处理多个异常。如果发生了异常，它首先被发送到第一个\
  \ `catch` 块；如果在那里没有处理，该异常将发送到下一个 `catch` 块。这个过程一直持续到最后一个 `catch` 块。下面的语法有助于你理解多个\
  \ catch 块。简单来说，它的工作方式类似于 `if` 语句。\n\n```java\ntry\n{\n    // 异常产生的语句 . . . .\n}\n\
  catch (Exception_class obj)\n{\n    // 异常处理语句 . . . . . .\n}\ncatch (Exception_class\
  \ obj) {\n    // 异常处理语句 . . . . . .\n}\n```\n\n## 示例程序\n\n```java\nclass Exp1\n\
  {\n    public static void main(String args[])\n    {\n        int z;\n        try\n\
  \        {\n            DataInputStream br=new DataInputStream(System.in);\n   \
  \         String a[]=new String[2];\n            System.out.println(\"输入你的数据\");\n\
  \            for(int i=0;i<=2;i++)\n                a[i]=br.readLine();\n      \
  \      int x = Integer.parseInt(a[0]);\n            int y = Integer.parseInt(a[1]);\n\
  \            z = x/y;\n            System.out.println(\"c = \" + c);\n        }catch(ArithmeticException\
  \ e)\n        {\n            System.out.println(\"算术异常\");\n            z=0;\n \
  \       } catch(ArrayIndexOutOfBoundsException e)\n        {\n            System.out.println(\"\
  无效参数\");\n        }\n        catch(NumberFormatException e)\n        {\n       \
  \     System.out.println(\"字符串无法转换为整数\");\n        }\n        finally\n        {\n\
  \            System.out.println(\"到达 finally 块\");\n        }\n    }\n}\n```\n\n\
  \n\n\n## throws 语句\n\n这些语句特别用于应用于整个方法。在你的方法中，任何部分都可能发送异常，这意味着你可以使用此异常处理语句抛出这些异常。\n\
  \n```java\npublic void sample(int a) throws Exception\n{\n    // 方法语句 . . . . .\n\
  }\n```\n\n## 第 21 章\n\n## 文件处理\n\n文件处理是在编写代码的机器上读取和写入外部文件的思想。在 Java 中，一旦理解了几个基本概念，文件处理并没有那么复杂。在本指南中，我们将回顾一些用于读取文本文件的文件处理基础知识。\n\
  \n### 读取文件\n\n为了读取文件，你必须使用 `FileReader` 类/对象，它用于读取普通的文本文件。\n\n`FileReader` 是一个用于读取文件的类或对象，应该与\
  \ `BufferedReader` 对象配合使用，后者将帮助在读取文本文件时保存数据，因为它允许你一次读取一行地读取文本文件。如果你不使用 `BufferedReader`，你将体会读取文本文件中每个字符的痛苦，这比按行读取要困难得多。\n\
  \n你必须做的第一件事是导入所有与输入（Input）和输出（Output）相关的内容。相应的导入目录是：\n\n```java\nimport java.io.*;\n\
  ```\n\n我们将使用文本文件 `test.txt` 作为示例。\n\n你必须做的第一件事是声明你的文件名，你可以在对象声明中进行，也可以在一个字符串变量中进行，之后用于构造函数。\n\
  \n示例：\n```java\nString fileName = \"test.txt\"; // 这一行是要读取的文件名\n```\n\n你必须做的下一件事是声明\
  \ `FileReader` 对象——但记住要在 `try-catch` 语句中执行所有操作，因为如果你尝试读取一个不存在的文件，它将抛出异常。\n\n```java\n\
  FileReader fileReader = new FileReader(fileName);\n```\n\n或者\n\n```java\nFileReader\
  \ fileReader = new FileReader(\"test.txt\");\n```\n\n一旦声明了这个对象，你必须如下所示将 `FileReader`\
  \ 封装在 `BufferedReader` 中：\n\n```java\nBufferedReader buffRead = new BufferedReader(fileReader);\n\
  ```\n\n`BufferedReader` 构造函数接收 `FileReader` 对象的值，因此你必须将 `FileReader` 对象传递构造函数。\n\
  \n你必须做的下一件事是使用一个 `while` 循环来检查 `BufferedReader` 正在读取的当前行是否为非空（不存在）的有效行。每当从 `BufferedReader`\
  \ 对象调用 `readLine()` 时，它会读取该行并在下一次调用 `readLine()` 时移动到下一行。因此，必须将行存储在字符串中以保留它。在 `while`\
  \ 循环运行期间，你可以将行声明为 `buffRead.readLine()`。\n\n示例：\n```java\nString line = \" \";\n\
  while ((line = buffRead.readLine()) != null) {\n    System.out.println(line);\n\
  }\n```\n\n上面的代码显示了一个 `while` 循环遍历文本文件 `test.txt` 并检查每行是否存在；如果存在，它将相应的打印。一旦完成，如下所示关闭文件：\n\
  \n```java\nbuffReader.close();\n```\n\n如果从读取文件时抛出任何异常并传递到 `catch` 块，你就可以显示错误。\n\n\
  ### 写入文件\n\n在 Java 中写入文本文件与读取文本文件类似，不同的是这次你是在输出/写入文本文件。你必须使用 `FileWriter` 类/对象，它用于写入普通的文本文件。\n\
  \n`FileWriter` 是一个可以用于写入文件的类或对象，应该与 `BufferedOutputWriter` 对象配合使用，后者将帮助按行写入文本。\n\
  \n写入文件所采取许多步骤与读取文件相似，但我们将再次回顾。你必须做的第一件事是导入所有与输入（Input）和输出（Output）相关的内容——相应的导入目录是：\n\
  \n```java\nimport java.io.*;\n```\n\n我们将使用文本文件 `test.txt` 作为示例。\n\n你必须做的第一件事是声明你的文件名，你可以在对象声明中进行，也可以在一个字符串变量中进行，之后用于构造函数。记住，在写入文件时，它要么覆盖同名的文件，要么创建一个指定文件名的文件。\n\
  \n示例：\n```java\nString fileName = \"test.txt\"; // 这一行是要写入或创建的文件名\n```\n\n你必须做的下一件事是声明\
  \ `FileWriter` 对象，但记住要在 `try-catch` 语句中执行所有操作，以处理尝试写入文件时可能抛出的任何异常。\n\n```java\n\
  FileWriter fileWriter = new FileWriter(fileName);\n```\n\n或者\n\n```java\nFileWriter\
  \ fileWriter = new FileWriter(\"test.txt\");\n```\n\n一旦声明了这个对象，你必须如下所示将 `FileWriter`\
  \ 封装在 `BufferedOutputWriter` 中：\n\n```java\nBufferedOutputWriter buffWrite = new\
  \ BufferedOutputWriter(fileWriter);\n```\n\n`BufferedOutputWriter` 构造函数接收 `FileWriter`\
  \ 对象的值，因此你必须像上面的示例代码一样传递 `FileWriter` 对象。\n\n现在，为了写入文件，你必须执行以下操作：\n\n```java\nbuffWrite.write(\"\
  Hi, my name is \");\nbuffWrite.write(\" Tom.\");\n```\n\n在上面的示例中，我们正在写入文件，但只有在同一行。为了移动到下一行，你必须：\n\
  \n```java\nbuffWrite.newLine();\n```\n\n最后，你必须关闭文件：\n\n```java\nbuffWrite.close();\n\
  \n## 第 22 章\n\n## 示例程序\n\n我们要如何通过编写一些示例程序来测试知识？对于这些，我们将使用 2014 竞赛。题目链接在这里：[`cemc.math.waterloo.ca/contests/2014/stage2/juniorEn.pdf`](https://cemc.math.waterloo.ca/contests/2014/stage2/juniorEn.pdf)\n\
  \n### 问题 N1：问题 J1：三角形\n\n**问题描述**\n你难以记得是种类型的三角形。你写一个程序来帮助。你的程序读取三个角度（度）。\n- 如果三个角度都是\
  \ 60，输出 `Equilateral`。\n- 如果三个角度和为 180 且有两个角度相同，输出 `Isosceles`。\n- 如果三个角度和为 180\
  \ 且没有相同的角度，输出 `Scalene`。\n- 如果三个角度和不为 180，输出 `Error`。\n\n**输入规范**\n输入由三个整数组成，每个一行。每个整数都大于\
  \ 0 且小于 180。\n\n**输出规范**\n`Equilateral`、`Isosceles`、`Scalene` 或 `Error` 中的一个将打印一行。\n\
  \n**示例输入 1**\n```\n60\n70\n50\n```\n**示例 1 的输出**\n```\nScalene\n```\n\n**示例输入 2**\n\
  ```\n60\n75\n55\n```\n**示例 2 的输出**\n```\nError\n```\n\n### 解 Solution N1\n\n```java\n\
  import java.util.Scanner;\n\npublic class J1 {\n    public static void main(String[]\
  \ args) {\n        Scanner scan = new Scanner(System.in);\n        int a1 = Integer.parseInt(scan.nextLine());\n\
  \        int a2 = Integer.parseInt(scan.nextLine());\n        int a3 = Integer.parseInt(scan.nextLine());\n\
  \n        if (a1 > 0 && a2 > 0 && a3 > 0 && a1 < 180 && a2 < 180 && a3 < 180) {\n\
  \            if (a1 == 60 && a2 == 60 && a3 == 60) {\n                System.out.println(\"\
  Equilateral\");\n            } else if ((a1 + a2 + a3 == 180) && ((a1 == a2) ||\
  \ (a2 == a3) || (a3 == a1))) {\n                System.out.println(\"Isosceles\"\
  );\n            } else if ((a1 + a2 + a3 == 180) && ((a1 != a2) && (a2 != a3) &&\
  \ (a3 != a1))) {\n                System.out.println(\"Scalene\");\n           \
  \ } else {\n                System.out.println(\"Error\");\n            }\n    \
  \    } else {\n            System.out.println(\"Error\");\n        }\n    }\n}\n\
  ```\n\n\n\n\n那么我们做了什么呢？首先，我们创建了一个 `scanner`。然后我们获取了给定的三个角度。接着，我们检查角度是否有效。接下来，我们检查三角形的所有角是否都等于\
  \ 60 度，这意味着它是等边三角形。如果是，我们就将其打印出来。否则，我们检查角度之和是否为 180 度以判断三角形是否有效，并检查是否有任意两个角度相等。这将证明它是一个等腰三角形。如果是，我们就将其打印出来。否则，我们检查三角形是否有效且所有边都不相等，这意味着它是不等三角形。如果是，我们就将其打印出来。如果以上情况都不成立，我们就输出“Error”。\n\
  \n## 问题 №\n\n### 问题 J2：票数计数\n\n### 问题描述\n在歌手 A 和歌手 B 歌唱比赛决赛轮对决后，将进行投票。\n\n你的任务是统计票数并确定结果。\n\
  \n### 输入规范\n输入分为两行。第一行包含 `V` (1 ≤ `V` ≤ 15)，表示总票数。第二行输入是一个包含 `V` 个字符的序列，每个字符为 `A`\
  \ 或 `B`，代表对特定歌手的投票。\n\n### 输出规范\n输出将是三种可能之一：\n- `A`，如果 `A` 的票多于 `B` 的票；\n- `B`，如果\
  \ `B` 的票多于 `A` 的票；\n- `Tie`，如果 `A` 的票和 `B` 的票数相等。\n\n#### 示例输入 1\n```\n6\nABBABB\n\
  ```\n#### 示例输入 1 的输出\n```\nB\n```\n\n### 示例输入 2\n```\n6\nABBABA\n```\n#### 示例输入\
  \ 2 的输出\n```\nTie\n```\n\n## 解解 №\n\n```java\nimport java.util.Scanner;\n\npublic\
  \ class J2\n{\n\npublic static void main(String[] args)\n{\n\nScanner scan = new\
  \ Scanner(System. in );\n\nint chars = Integer. parseInt ((scan.nextLine()));\n\n\
  String votes = scan.nextLine();\n\nif(chars > 0 && chars < 16)\n{\n\nint voteA =\
  \ 0;\n\nint voteB = 0;\n\nfor(int i = 0; i < chars; i++)\n{\n\nif(votes.charAt(i)=='A')\n\
  {\n\nvoteA++;\n}\n\nelse if(votes.charAt(i)=='B')\n{\n\nvoteB++;\n}\n\n}\n\nif(voteA\
  \ == voteB)\n{\n\nSystem. out .println(\"Tie\");\n\n}\n\nelse if(voteA > voteB)\n\
  {\n\nSystem. out .println(\"A\");\n\n}\n\nelse\n{\n\nSystem. out .println(\"B\"\
  );\n\n}\n\n}\n\n}\n\n}\n```\n\n首先，我们创建了一个 `scanner`。我们获取了第一行输入，即票数。我们获取了第二行输入，即实际投票。然后我们遍历第二行的每个字母，如果字母是大写的\
  \ `A`，我们就给 `voteA` 变量加 1。如果是大写的 `B`，我们就给 `voteB` 变量加 1。最后，我们检查 `voteA` 和 `voteB`\
  \ 是否相等；如果是，就是平局。如果 `voteA` 大于 `voteB`，则 `A` 胜；否则 `B` 胜。\n\n## 问题 №3\n\n### 问题 J3：双骰子\n\
