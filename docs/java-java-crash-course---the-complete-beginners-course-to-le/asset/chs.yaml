  \n### 用户自定义包\n\n这些是由用户或开发者为了他们自己的使用而开发的。你可能会发现开发自己的包是有帮助的，因为所有类文件都分组在单个目录中，你可以在需要时轻松地重用所有文件。创建用户自定义包涉及以下重要步骤：\n\
  \n**步骤 1**：在 Java 安装位置的 `bin` 文件夹创建一个目录。\n\n**步骤 2**：为该文件夹指定任何名称；这也将你的包名。\n\n**步骤\
  \ 3**：定义你的类并将它们存储在你新创建的包文件夹中。\n\n**步骤 4**：像预定义包一样进行导入。\n\n下表解释了包及其类的访问权限级别。\n\n\
  | | Private | Public | Protected | 无修饰符 |\n| :--- | :--- | :--- | :--- | :--- |\n\
  | 同一个包同一类 | 是 | 是 | 是 | 是 |\n| 同一个包子类 | 否 | 是 | 是 | 是 |\n| 同一个包非子类 | 否 | 是 | 否 |\
  \ 是 |\n| 不同包子类 | 否 | 是 | 是 | 否 |\n| 不同包非子类 | 否 | 是 | 否 | 否 |\n\n## 创建包的语法\n\n```java\n\
  package package_name;\n\nclass class_name\n{\n    类的成员变量;\n    . . . . . . . . .\
  \ . .\n    . . . . . . . . . . .\n    . . . . . . . . . . .\n}\n```\n\n## 示例程序\n\
  \n创建一个新包并将你的包保存为 `pack1`。\n\n### pack1 中的 1 号类\n\n```java\npackage pack1;\n\npublic\
  \ class Factorial\n{\n    public int getFact(int n)\n    {\n        int fact1=1;\n\
  \        for(int i=1;i<=n;i++)\n        fact = fact * i;\n        return fact;\n\
  \    }\n}\n```\n\n### pack1 中的 2 号类\n\n```java\npackage pack1;\n\npublic class Fibonacci\n\
  {\n    public void fib(int n)\n    {\n        int f1=0,f2=1,f3,i;\n        System\
  \ . out. println(f1);\n        System . out. println(f2);\n        For(i=2;i<=n;i++)\n\
  \        {\n            f3=f1+f2;\n            System . out. println(f3);\n    \
  \        f1=f2;\n            f2=f3;\n        }\n    }\n}\n```\n\n### 在你的程序中导入包 pack1\n\
  \n```java\nimport pack1.Factorial;\nimport pack1.Fibonacci;\n\nclass SamplePack\n\
  {\n    public static void main(String args[])\n    {\n        Factorial f1=new Factorial();\n\
  \        f1.getFact(5);              //它将打印整数 5 的阶乘值为 120\n        Fibonacci f2=new\
  \ Fibonacci();\n        f2.fib(5);                  // 它将生成斐波那契数列。\n    }\n}\n```\n\
  \n在这个程序中，我们创建了一个名为 `pack1` 的新包，它包含了两个不同的类：`Factorial` 和 `Fibonacci`。\n\n\n\n\n枚举（Enums）本质上是具有有限可能性的预设。它们在定义上与类和接口相似，但使用的是\
  \ `enum` 关键字。它们可以拥有构造函数和变量。枚举不能被实例化，也不能作为子类（但可以实现接口）。在访问 `enum` 的变量时要小心，因为如果你修改了\
  \ `enum` 的变量，该 `enum` 的所有实例都会被修改。要填充一个 `enum`，你需要所有预设值的列表。此列表必须位于你枚举块的顶部。如果你的 `enum`\
  \ 没有构造函数，你可以直接写出可能的值，就像是变量名一样。其余部分用逗号分隔并以分号结束。如果你的 `enum` 有构造函数，你必须编写变量名，然后是用逗号分隔的构造参数（即值），并以分号结束。在分号之后，你可以继续编写变量声明、构造函数以及任何想要的方法。构造函数不能是公共的，只能是保护的或私有的。\n\
  \n```java\nenum Number \n{\n    One , Two , Three\n}\n```\n\n```java\nenum Color\
  \ \n{\n    Red (255, 0, 0),\n    Green (0, 255, 0),\n    Blue (0, 0, 255),\n   \
  \ Purple (255, 0, 255),\n    Yellow (255, 255, 0),\n    Cyan (0, 255, 255);\n\n\
  \    public int r;\n    public int g;\n    public int b;\n\n    Color(int redChannel,\
  \ int greenChannel, int blueChannel) \n    {\n        r = redChannel;\n        g\
  \ = greenChannel;\n        b = blueChannel;\n    }\n\n    public static void main(String[]\
  \ args) \n    {\n        Number num = Number.Two;\n        Color red1 = Color.Red;\n\
  \        Color red2 = Color.Red;\n        red1.g = 255;\n        System.out.println(red2.g);\
  \ // “255”, red2 被修改了，因为 red1 和 red2 是同一个对象。该对象存储在两个变量中，因此会受到任何一个对象的更改的影响。\n   \
  \ }\n}\n```\n\n## 第 16 章\n\n## 泛型\n\n泛型类型允许我们创建泛型类，这意味着它们可以根据给定的类型表现出不同的行为。程序员为泛型类型提供了一个类列表，用于定义特定的对象类型。泛型通过在类名后放置尖括号（`<\
  \ >`）并跟上类型标识符列表来创建。这些标识符的作用与变量名一样，但惯例是其中一个使用大写字母，特别是 `T`（代表 type）。这些类型标识符可以代替数据类型。这允许你保持某些变量为一致的类型，从而避免强制类型转换。当使用泛型类作为数据类型创建变量时，该数据类型也必须包含与类类型列表对应的类型列表的尖括号。你创建的对象在参数之前也需要相同的尖括号集合。\n\
  \n```java\nclass Something<A, B> \n{\n    public A variableA;\n    public B variableB;\n\
  \n    public Something(A varA, B varB) \n    {\n        this.variableA = varA;\n\
  \        this.variableB = varB;\n    }\n\n    public static void main(String[] args)\
  \ \n    {\n        // Class1 将是 A，Class2 将是 B\n        Something<Class1, Class2>\
  \ somethingElse = new Something<Class1, Class2>(new Class1(), new Class2());\n \
  \       Class1 class1 = somethingElse.variableA; // 这不需要类型转换，因为 variableA 实际上是 Class1\
  \ 类型\n    }\n}\n```\n\n```java\nclass Class1{}\nclass Class2{}\n```\n\n泛型类型的一个常见用途是\
  \ `ArrayList`，它是 `java.util` 包中的一个类。`ArrayList` 是一个动态数组，意味着你可以在数组初始化后更改数组中元素的数量。`ArrayList`\
  \ 使用泛型类型来防止程序员添加错误类型的对象，并帮助程序员将对象转换为所需的类型。这里是一个使用 `ArrayList` 的简短示例。\n\n```java\n\
  class Food \n{\n    public String name;\n\n    public Food(String name) \n    {\n\
  \        this.name = name;\n    }\n\n    public static void main(String[] args)\
  \ \n    {\n        ArrayList<Food> basket = new ArrayList<Food>();\n        basket.add(new\
  \ Food(“Pear”));\n        basket.add(new Food(“Apple”));\n        basket.add(new\
  \ Food(“Orange”));\n        basket.add(new Food(“Apple”));\n        basket.add(new\
  \ Food(“Pomegranate”));\n        System.out.println(basket.get(2).name); // “Orange”\n\
  \        basket.remove(3);\n        System.out.println(basket.size());// “4”\n \
  \   }\n}\n```\n\nArray Lists 的良好用法涉及“队列”。这是一种在不需要进行递归（在方法内部调用该方法）的情况下实现递归的方法。递归是相当危险的，因为使用不当会导致无限循环，并迅速导致程序崩溃。递归实际上相当慢，所以我们有使用队列的选择是一件好事。基本上，你创建一个\
  \ `ArrayList`（通常以类的形式存在），向数组添加一个起始元素，然后只要 `ArrayList` 不空（或未完成任务），它就会根据 ArrayList\
  \ 中的值继续执行代码。你的代码可以向 ArrayList 添加产生新循环的元素，就像在递归方法中，你可以再次调用方法以增加新的深度。\n\n队列并不一定“优于”递归方法。队列用于分支递归“路径”，特别是在寻找最优解决方案的情况下。这可以用于视频游戏中的路径查找，或者现实生活。逻辑上，我们可以尝试最接近目标的路径，如果该路径进入死胡同，我们可以将其从队列中移除并尝试下一个最近的路径。递归可以做到这一点，但它的工作方式像树一样。每条路径都可能从左到右，并遍历每种可能性。队列允许你从迭代树的任何部分跳转到迭代树的任何其他部分，这使得计算机可以使用最快的方法找到路线。递归和队列都可以达到相同的结果，但取决于你构建系统的方式。\n\
  \n\n\n线程是一种同时运行两个“线程”代码的方式。线程并不一定能让你的程序运行得更快，但在某些情况下可以。线程共享处理能力，因此它不会加快任何代码的运行速度。线程的工作就像两个非常有礼貌的人穿过一条布满门扇的走廊：第一个人让第二个人通过第一扇门，然后第二个人让第一个人通过第二扇门，如此往复。线程允许程序员运行耗时很长的循环，同时仍然在后台执行其他任务。例如，如果你想让程序接受来自另一台计算机的连接，你可以运行一个不断“监听”连接的循环。但这样做的问题是，程序在监听期间会冻结。相反，我们使用一个线程来监听连接，然后在主线程中执行其他任务。我们可以向用户显示类似\
  \ GUI（下一节介绍）的内容，并根据监听状态提供反馈。那么，我们如何创建一个线程呢？首先，我们创建一个“Runnable”。只需实现 `Runnable` 接口并重写它的\
  \ `run` 方法。接下来，我们创建一个以 `MyRunnable` 对象（或任何实现 `Runnable` 的类）作为参数的线程对象，最后调用 `<thread\
  \ object>.start()`。\n\n```java\nclass MyRunnable implements Runnable\n{\n    public\
  \ void run()\n    {\n        while(true) // 这个循环无限运行！\n        {\n            System.out.println(“Groundhog\
  \ Day!”);\n        }\n    }\n    public static void main(String[] args)\n    {\n\
  \        Runnable runThis = new MyRunnable();\n        Thread aThread = new Thread(runThis);\n\
  \        aThread.start();\n        while(true)\n        {\n            System.out.println(“Bill\
  \ Murray!”);\n        }\n    }\n}\n```\n上面的代码现在将运行两个无限且不相关的循环，并会“随机”打印出“Groundhog\
  \ Day!”或“Bill Murray!”不过，线程并不限于无限循环；它们适用于任何需要两条并行处理行的场景。例如，假设你正在为视频游戏制作加载菜单。你可以用一个线程加载游戏数据，然后简单地将其状态放入变量中（例如已加载了多少文件）。然后你可以让另一个线程修改你的窗口、控制台或任何内容，根据原始线程使用的变量来告诉用户加载状态。这就是（大多数）加载条的制作方式。\n\
  \n## 线程的生命周期\n线程的生命周期涉及四个阶段。它们是：\n* 新生状态（Born state）\n* 可运行状态（Runnable state）\n\
  * 阻塞状态（Blocked state）\n* 死亡状态（Dead state）\n\n### 新生状态\n当线程被创建时，它处于新状态。“新”（New）意味着线程对象已经创建，但尚未开始运行。它需要通过\
  \ `start()` 方法来启动。\n\n### 可运行状态\n当线程在执行一组指令时，说它处于可运行状态。`run()` 方法包含了这些指令。该方法在 `start()`\
  \ 方法调用后会被自动调用。\n\n### 阻塞状态\n线程可以运行，但某些东西在阻止它。当线程处于阻塞状态时，调度器会直接跳过它而不给它任何 CPU 时间。在线程重新进入运行状态之前，它不会执行任何操作。\n\
  \n* `wait()` - `notify()`\n* `suspend()` - `resume()`\n* `sleep(milliseconds)`\n\
  \n### 死亡状态\n线程死亡的正常方式是从其 `run()` 方法返回。我们也可以调用 `stop()`，但这会抛出一个 `Error` 类的异常（这意味着我们通常不会捕获它）。\n\
  \n## 线程的创建\n在 Java 中，你可以通过两种方式创建线程。第一种是使用 `Runnable` 接口，第二种使用 `Thread` 类。`Runnable`\
  \ 接口只有一个方法，即 `run()` 方法和一个构造函数。`Thread` 类包含了许多方法，通过这些方法你可以获取线程的基本信息。\n\n## 常用方法\n\
  * `start()`：`start()` 启动调用对象的执行。如果线程已经启动，它可能会抛出 `IllegalThreadStateException`。\n\
  * `stop()`：此方法终止调用对象。\n* `suspend()`：此方法挂起调用对象。如果线程获取了 `resume()` 方法，它将再次变为可运行。\n\
  * `sleep()`：此方法挂起执行线程指定的毫秒数执行。它可能会抛出 `InterruptedException`。\n\n## Thread 类方法\n\
  * `activeCount()`：此方法将返回当前线程组中活动线程的数量。\n* `currentThread()`：这将返回当前正在执行的线程对象的引用；这是一个静态方法。\n\
  * `isAlive()`：此方法将检查给定的线程是否存活。\n* `getName()`：这将获取并返回此线程的名称。\n* `getPriority()`：这将获取并返回线程的优先级。\n\
  * `setName(String)`：此方法用于设置线程的名称。\n* `setPriority(int)`：这是用于设置线程优先级的方法。\n* `toString()`：这将返回\
  \ `Thread` 的字符串表示，包括线程的名称、优先级和线程组。\n\n示例：使用 Runnable 接口创建的线程程序\n```java\nclass RunnableDemo\
  \ implements Runnable\n{\n    Thread t;\n    RunnableDemo(String name)\n    {\n\
  \        t = new Thread(this,name);  //新生状态\n        t.start();\n    }\n    public\
  \ void run()\n    {\n        try\n        {\n            for(int i=1;i<=5;i++)\n\
  \            {\n                System.out.println(t.getName() + \" + i);\n    \
  \        }\n        }\n    }\n}\n```\n\n\n\n\n在本指南中，你一直在编写程序并期望从控制台获取输出。现在是时候学习如何开发你自己的界面了。在指南的这一部分，你将学习\
  \ Java Swing 和 Applet 编程。在 Java 中开发界面有多种方法，但我们将使用“Swing 和 Applet”方法。\n\n## Applet\n\
  \n首先我们将探索 Applet 编程。这也是开发用户界面的方法之一。`Applet` 是一种容器，我们可以在其中放置组件来创建用户界面。`Applet` 类定义在\
  \ `java.applet.*` 包下，而所有其他组件和事件处理类都定义在 `java.awt.*` 和 `java.awt.event.*` 包下。在这一部分，我们将学习如何借助\
  \ `Applet` 和 `AWT` 组件来开发用户界面。`Applet` 用于创建一个在 `Applet Viewer` 或任何浏览器中运行的交互式动态程序。然而，它也有一些限制：`Applet`\
  \ 很容易受到病毒的影响，且我们无法使用读和写等文件系统。\n\n## Applet 程序的结构\n\n```java\nimport java.applet.*;\n\
  \nimport java.awt.*;\n\npublic class SampleApplet extends Applet\n\n{\n\npublic\
  \ void init()\n{}\n\npublic void start()\n{}\n\npublic void paint(Graphics g)\n\
  {}\n\npublic void stop()\n{}\n\npublic void destroy()\n{}\n\n}\n```\n\n在上面的示例程序中，你可以看到五个参与\
  \ applet 生命周期周期的方法。你不需要调用这些方法，因为所有方法都会被自动调用。你只能自己调用 `paint()` 方法来更新 applet 窗口，但你必须使用\
  \ `repaint()` 方法来调用 `paint()` 方法。\n\n所有 applet 程序都需要一个 `applet` 标签，因为定义 applet 窗口的外观很重要。以下语法将帮助你理解\
  \ `applet` 标签及其属性。\n\n### Applet 标签\n\n```html\n/*<applet\ncode=”Applet class file\
  \ name”\ncodebase=”path of the applet class file”\nwidth=”width of the applet window\
  \ in pixels”\nheight=”height of the applet window in pixels”\nvspace=”vertical space”\n\
  hspace=”horizontal space”\n>\n</applet>*/\n```\n\n在这个 `applet` 标签代码中，`width` 和 `height`\
  \ 是条件属性，所以你必须提到它们。剩余的三个（`vspace`, `hspace`, `codebase`）是可选的。\n\n### Parameter 标签\n\
  \n`Param` 标签帮助我们将一些参数数据传递到 applet 程序中。该标签有两个属性：`Name` 和 `Value`。`Name` 参数名称，`value`\
  \ 存储数据。\n\n```html\n<param name=”name of the parameter name” value=”data”></param>\n\
  ```\n\n## 示例程序\n\n```java\nimport java.applet.*;\n\nimport java.awt.*;\n\npublic\
  \ class ParamTag extends Applet\n\n{\n\nint a,b;\nString a1;\n\npublic void init()\n\
  {\n\na=Integer.parseInt(getParameter(“Data1”));\nb=Integer.parseInt(getParameter(“Data2”));\n\
  a1=”Sum is: ”+(a+b);\n}\n\npublic void paint(Graphics g)\n{\ng.drawString(a1,200,100);\n\
  }\n\n}\n```\n\n```html\n/*<applet code=”ParamTag” width=”200” height=”200”>\n<param\
  \ name=”Data1” value=”15”></param>\n<param name=”Data2” value=”25”></param>\n</applet>*/\n\
  ```\n\n在这个示例程序中，我们创建了两个名为 `Data1` 和 `Data2` 的 `param` 标签，其值分别为 15 和 25。然后我们通过 `getParameter()`\
  \ 方法获取这些数据。此方法始终返回 `String` 格式的数据，因此我们必须将这些数据转换为整数数据。然后我们相加这些数据并存储在字符串变量中，以便将该数据打印到\
  \ applet 窗口。\n\n![](img/Image00006.jpg)\n\n## Applet 编程中的类\n\n*   `Graphics` 类\n\
  *   `Font` 类\n*   `Color` 类\n*   `Image` 类\n*   `Graphics` 类\n\n该类包含了用于绘制字符串、线条、矩形以及\
  \ `graphics` 类定义的其他形状的方法。\n\n### Graphics 类\n\n### 绘制字符、字节和字符串\n\n*   “g,” “r,”\
  \ “a,” “p,” “h,” “i,” “c,” “s”—字符\n*   100, 101, 108, 114, 67, 47—字节\n*   “World”—字符串\n\
  \n```java\nvoid drawBytes (byte[] data , int offset , int length , int x , int y)\n\
  ```\n\n该方法用于将字节数据绘制到 Applet 窗口。\n*   `data` -> 要绘制的数据\n*   `offset` -> 数据中的起始偏移量\n\
  *   `length` -> 绘制的字节数\n*   `x` -> x 坐标\n*   `y` -> y 坐标\n\n```java\nvoid drawChars(char[]\
  \ data , int offset , int length ,int x , int y)\n```\n\n该方法用于将字符数据绘制到 Applet 窗口。\n\
  \n```java\nabstract void drawString(String str,int x,int y)\n```\n\n该方法用于将字符串数据绘制到\
  \ Applet 窗口。\n\n### 形状绘制方法\n\n我们有很多方法来绘制不同类型的形状，如矩形、圆形、弧等。\n\n| 方法名 | 参数 | 方法用法\
  \ |\n| :--- | :--- | :--- |\n| `drawLine(int x1,int y1,int x2,int y2)` | `x1, y1`:\
  \ 起点，`x2, y2`: 终点 | 此方法帮助我们在 applet 窗口上绘制线条形状。 |\n| `drawRect(int x1,int y1,int\
  \ width,int height)` | `x1, y1`: 起点，`width`: 宽度，`height`: 高度 | 此方法帮助我们在 applet 窗口上绘制矩形形状。\
  \ |\n| `fillRect(int x1,int y1,int width,int height)` | `x1, y1`: 起点，`width`: 宽度，`height`:\
  \ 高度 | 此方法帮助我们在 applet 窗口上绘制填充矩形。 |\n| `drawRoundRect(int x1,int y1,int width,int\
  \ height,int width,int height)` | `x1, y1`: 起点，`width`: 宽度，`height`: 高度，`width`:\
  \ 宽度，`height`: 高度 | 此方法帮助我们在 applet 窗口上绘制圆角矩形。 |\n| `fillRoundRect(int x1,int y1,int\
  \ width,int height,int width,int height)` | `x1, y1`: 起点，`width`: 宽度，`height`: 高度，`width`:\
  \ 宽度，`height`: 高度 | 此方法帮助我们在 applet 窗口上绘制填充圆角矩形。 |\n| `drawOval(int x1,int y1,int\
  \ width,int height,int startAngle,int arcAngle)` | `x1, y1`: 起点，`width`: 宽度，`height`:\
  \ 高度，`startAngle`: 起始角度，`arcAngle`: 弧角 | 此方法帮助我们在 applet 窗口上绘制椭圆。 |\n| `fillOval(int\
  \ x1,int y1,int width,int height,int startAngle,int arcAngle)` | `x1, y1`: 起点，`width`:\
  \ 宽度，`height`: 高度，`startAngle`: 起始角度，`arcAngle`: 弧角 | 此方法帮助我们在 applet 窗口上绘制填充椭圆。\
  \ |\n| `drawArc(int x1,int y1,int width,int height,int startAngle,int arcAngle)`\
  \ | `x1, y1`: 起点，`width`: 宽度，`height`: 高度，`startAngle`: 起始角度，`arcAngle`: 弧角 | 此方法帮助我们在\
  \ applet 窗口上绘制弧。 |\n| `fillArc(int x1,int y1,int width,int height,int startAngle,int\
  \ arcAngle)` | `x1, y1`: 起点，`width`: 宽度，`height`: 高度，`startAngle`: 起始角度，`arcAngle`:\
  \ 弧角 | 此方法帮助我们在 applet 窗口上绘制填充弧。 |\n| `drawPolygon(int[] x, int[] y, int n)` | `x`:\
  \ x 坐标数组，`y`: y 坐标数组，`n`: 顶点数 | 此方法帮助我们在 applet 窗口上绘制多边形。 |\n| `fillPolygon(int[]\
  \ x, int[] y, int n)` | `x`: x 坐标数组，`y`: y 坐标数组，`n`: 顶点数 | 此方法帮助我们在 applet 窗口上绘制填充多边形。\
  \ |\n\n\n\n\n\n我们可以在 Applet 窗口中使用各种字体编写数据。Java 提供了许多字体，包括 `Courier`、`Times New Roman`\
  \ 等。`Font` 类帮助我们定义新的字体对象，并可以通过预定义的方法将其设置为 Applet 窗口的字体。\n\n## Font 类\n\n### 构造函数\n\
  `Font(String name,int style,int size)` — 根据指定的名称、样式和大小创建一个新字体。\n\n### 方法\n- `abstract\
  \ void setFont(f)` — 将此图形上下文的字体设置为指定的字体\n- `String getStyle()` — 返回表示当前字体样式的字符串值\n\
  - `int getSize()` — 返回表示当前字体大小的整型值\n- `String getFamily()` — 返回作为字符串形式的字体族名称\n-\
  \ `boolean isPlain()` — 如果字体为正体（罗马体），则返回 true\n- `boolean isBold()` — 如果字体为粗体，则返回\
  \ true\n- `boolean isItalic()` — 如果字体为斜体，则返回 true\n\n### 样式常量\n- `Font.BOLD` — 用于粗体字体样式\n\
  - `Font.ITALIC` — 用于斜体字体样式\n- `Font.PLAIN` — 用于正体（罗马体）字体样式\n\n### 程序\n```java\n\
  import java.awt.*;\nimport java.applet.*;\n\n//<applet code=”SampleFont” width=”600”\
  \ height=”600”></applet>\n\npublic class SampleFont extends Applet\n{\n    Font\
  \ f1, f2;\n\n    public void init()\n    {\n        f1=new Font(“TimesRoman”,Font.BOLD,25);\n\
  \        f2=new Font(“Courier”,Font.ITALIC,40);\n    }\n\n    public void paint(Graphics\
  \ g)\n    {\n        g.setFont(f1);\n        g.drawString(“This is Times Roman Font”,100,100);\n\
  \        g.setFont(f2);\n        g.drawString(“This is Courier Font”,100,200);\n\
  \    }\n}\n```\n![](img/Image00008.jpg)\n\n## Color 类\n\n`Color` 类帮助我们通过颜色类的构造函数创建不同的颜色集合。你可以使用颜色类的方法设置\
  \ Applet 窗口的背景颜色和前景颜色。我们在颜色类中有许多预定义的方法。\n\n### Color 类构造函数\n`Color c1=new Color(Red,Green,Blue)`\n\
  \n在此构造函数中，我们必须指定 RGB 值。这些值从 0 开始到 255 结束。当你指定此范围内的 RGB 值时，将根据你的数据产生新颜色。我们也有颜色常量，它们列在这里并给出了相应的\
  \ RGB 值。\n\n| 颜色常量 | RGB 值 |\n| :--- | :--- |\n| `Color.red` | 255, 0, 0 |\n| `Color.green`\
  \ | 0, 255, 0 |\n| `Color.blue` | 0, 0, 255 |\n| `Color.magenta` | 255, 0, 255 |\n\
  | `Color.cyan` | 0, 255, 255 |\n| `Color.yellow` | 255, 255, 0 |\n\n### Color 类的方法\n\
  - `setColor()` — 此方法将为对象设置颜色。它只有一个参数，因此你可以传递任何颜色常量值或颜色类对象。\n- `setBackground()`\
  \ — 此方法将设置 applet 的背景颜色。它也只有一个参数，即颜色类对象或颜色常量值。\n- `setForeground()` — 此方法用于在绘制后更改整个\
  \ applet 的颜色。\n- `Color getBackground()` — 此方法将返回 Applet 窗口的背景颜色。\n- `Color getForeground()`\
  \ — 此方法将返回前景颜色类对象。\n\n### 程序\n```java\nimport java.applet.*;\nimport java.awt.*;\n\
  \n//<applet code=”SampleColor” width=”400” height=”400”></applet>\n\npublic class\
  \ SampleColor extends Applet\n{\n    Color c1,c2;\n\n    public void init()\n  \
  \  {\n        c1=new Color(10,255,200);\n        c2=new Color(100,100,100);\n  \
  \  }\n\n    public void paint(Graphics g)\n    {\n        g.setBackground(c1);\n\
  \        g.drawString(“Color Class object 1”,200,200);\n        g.setForeground(c2);\n\
  \        g.drawString(“Color Class object 2”,250,250);\n    }\n}\n```\n![](img/Image00009.jpg)\n\
  \n在这个示例程序中，我们声明了两个颜色类对象：`c1` 和 `c2`。然后，在 `init()` 方法内部使用 `Color` 类构造函数创建了 `c1` 和\
  \ `c2`。在 `paint()` 方法内部，我们将 `c1` 设置为 Applet 窗口的背景颜色，并将 `c2` 设置为前景。\n\n## Applet\
  \ 窗口组件\n\n组件无非是 AWT 包中的控件，例如文本框、列表框、选择框、按钮、滚动条等。每个组件类都有其自己的方法和构造函数。组件构造函数帮助我们创建组件并将其添加到\
  \ Applet 窗口中。在这里，我们列出了重要的组件类及其方法和构造函数。\n\n### 组件类\n\n我们可以区分以下组件：\n\n### 1. 标签组件\n\
  \n我们可以区分以下组件：\n\n### 标签组件\n**构造函数**\n- `Label()` — 这是空构造函数，创建一个空的标签。\n- `Label(String\
  \ str)` — 这是带字符串的构造函数，创建一个带有指定文本的标签。\n\n**方法**\n- `getText()` — 返回标签的文本。\n- `setText(String\
  \ str)` — 设置标签的文本。\n- `setFont(Font f)` — 设置标签的字体。\n\n**程序**\n```java\nimport java.awt.*;\n\
  import java.applet.*;\n\n//<applet code=”SampleLabel” width=”200” height=”200”></applet>\n\
  \npublic class SampleLabel extends Applet\n{\n    Label l1,l2,l3;\n\n    public\
  \ void init()\n    {\n        l1=new Label(\"First Label\");\n        l2=new Label(\"\
  Second Label\");\n        l3=new Label(\"Third Label\");\n        add(l1);\n   \
  \     add(l2);\n        add(l3);\n    }\n}\n```\n\n### 2. 按钮组件\n`Button` 组件用于在用户按下按钮时执行任何操作或任务。按钮类具有构造函数和预定义方法。如果你按下按钮，它会产生一个事件。\n\
  \n**按钮类的构造函数**\n- `Button()` — 这是空构造函数，创建一个没有文本的按钮。\n- `Button(String str)` — 这是参数化构造函数，创建一个带有指定文本的按钮。\n\
  \n**按钮类的方法**\n- `addActionListener(ActionListener L)` — 为新创建组件添加监听器。\n- `getActionCommand()`\
  \ — 返回按下按钮后的命令文本。\n- `getLabel()` — 返回按钮的文本。\n- `setLabel(String text)` — 设置按钮的文本。\n\
  - `getSource()` — 返回被按下的按钮对象。\n\n**程序**\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\
  import java.applet.*;\n\npublic class SampleButton extends Applet implements ActionListener\n\
  {\n    String str = \" \";\n    Button b1, b2, b3;\n\n    public void init()\n \
  \   {\n        b1 = new Button ( \"First Button\");\n        b2 = new Button (\"\
  Second Button\");\n        b3 = new Button (\"Third Button\");\n        add(b1);\n\
  \        add(b2);\n        add(b3);\n        b1.addActionListener (this);\n    \
  \    b2.addActionListener (this);\n        b3.addActionListener(this);\n    }\n\n\
  \    public void actionPerformed(ActionEvent ae)\n    {\n        if(ae.getSource()==b1)\
  \ {\n            str = \"You pressed Button 1.\";\n        }\n        else if(ae.getSource()==b2)\
  \ {\n            str = \"You pressed Button 2.\";\n        }else {\n           \
  \ str = \"You pressed Button 3.\";\n        }\n        repaint();\n    }\n\n   \
  \ public void paint(Graphics g)\n    {\n        g.drawString(str,6,100);\n    }\n\
  }\n\n//<applet code=\"SampleButton.class\" width = 300 height = 100></applet>\n\
  ```\n\n\n\n\n\n在本示例中，我们创建了三个按钮 `b1`、`b2` 和 `b3`，标签分别为“第一个按钮”（First Button）、“第二个按钮”（Second\
  \ Button）和“第三个按钮”（Third Button）。如果你点击“第一个按钮”，它将立即生成 `ActionEvent`，从而调用 `actionPerformed()`\
  \ 方法，并在 Applet 窗口上打印“You pressed Button 1”的消息。同样的功能也适用于第二个和第三个按钮。\n\n### 3. 复选框组件\
  \ (Checkbox Component)\n\n复选框组件帮助我们从多个选项中选择多个项目。我们定义了一个名为 `Checkbox` 的类，它有多个构造函数来创建复选框，以及用于操作这些复选框并获取其详情的方法。\n\
  \n### Checkbox 组件的构造函数\n\n- `Checkbox()` 创建一个没有标签文本的复选框。\n- `Checkbox(String str)`\
  \ 创建带有标签文本的复选框。\n- `Checkbox(String str, Boolean state)` 创建带有标签文本的复选框，你可以使用 `Boolean`\
  \ `state` 来测试复选框。如果你传递 `true` 值，它将创建一个带有勾选标记的复选框；如果为 `false`，则没有勾选标记。\n- `Checkbox(String\
  \ str, CheckboxGroup, Boolean state)` 用于将复选框转换为单选按钮（Radio button）。如果你传递 `CheckboxGroup`\
  \ 对象，它将创建一个单选按钮。\n\n### Checkbox 方法\n\n- `getState()` 返回 `Checkbox` 的状态。如果复选框被选中则返回\
  \ `true`，如果未选中则返回 `false`。\n- `getItem()` 返回特定 `Checkbox` 的项目对象。\n- `setCheckboxGroup(CheckboxGroup\
  \ g)` 将相应的复选框组设置为指定的组。\n- `setLabel(String label)` 将对应复选框的标签设置为指定值。\n- `setState(boolean\
  \ state)` 将对应复选框的状态设置为指定值。\n- `getCheckboxGroup()` 此方法确定对应复选框的组。\n- `getLabel()`\
  \ 返回对应复选框的名称。\n- `getSelectedObjects()` 返回一个长度为 `l` 的数组，包含复选框标签，如果复选框未被选中则返回 `null`。\n\
  \n## 示例程序\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nimport java.applet.*;\n\
  \npublic class SampleCheckbox extends Applet implements ItemListener {\n    String\
  \ str = new String();\n    Checkbox fe,lam,jag,au;\n\n    public void init() {\n\
  \        fe = new Checkbox(\"Ferrari\",null,true);\n        lam = new Checkbox(\"\
  Lamborghini\");\n        jag = new Checkbox(\"Jaguar\");\n        au = new Checkbox(\"\
  Audi\");\n        add(fe);\n        add(lam);\n        add(jag);\n        add(au);\n\
  \        fe.addItemListener(this);\n        lam.addItemListener(this);\n       \
  \ jag.addItemListener(this);\n        au.addItemListener(this);\n    }\n\n    public\
  \ void itemStateChanged(ItemEvent ie) {\n        repaint();\n    }\n\n    public\
  \ void paint(Graphics g) {\n        str = \"Selected Brand : \";\n        g.drawString(str,6,80);\n\
  \        str = \"  Ferrari: \" + fe.getState();\n        g.drawString(str,6,100);\n\
  \        str = \"  Lamborghini: \" + lam.getState();\n        g.drawString(str,6,120);\n\
  \        str = \"  Jaguar: \" + jag.getState();\n        g.drawString(str,6,140);\n\
  \        str = \"  Audi: \" +au.getState();\n        g.drawString(str,6,160);\n\
  \    }\n}\n//<applet code=\"SampleCheckbox.class\" width=300 height=200></applet>\n\
  ```\n\n![](img/Image00011.jpg)\n\n在本示例中，我们借助构造函数创建了四个复选框。首先，我们需要声明复选框对象以及复选框标签。`Checkbox`\
  \ 生成 `ItemEvent`，因此所有复选框事件都由 `ItemListener` 接口处理。`itemStateChanged()` 方法会调用 `repaint()`\
  \ 方法。在那里我们可以使用 `getState()` 方法获取复选框的所有状态。由于它是复选框，你可以选择多个。\n\n### 4. 单选按钮 (Radio\
  \ Button)\n\n这与复选框类似，但你不能选择多个项目。在 Java 中，没有单独的单选按钮类。你可以使用 `Checkbox` 构造函数来创建单选按钮。你只需传递复选框组，它就会将\
  \ `Checkbox` 转换为单选按钮。以下程序解释了一切。\n\n## 示例程序\n\n```java\nimport java.awt.*;\nimport\
  \ java.awt.event.*;\nimport java.applet.*;\n\npublic class SampleCBG extends Applet\
  \ implements ItemListener {\n    String str = new String();\n    Checkbox fe,lam,jag,au;\n\
  \    CheckboxGroup cbg;\n\n    public void init() {\n        fe = new Checkbox(\"\
  Ferrari\",cbg,true);\n        lam = new Checkbox(\"Lamborghini\",cbg,false);\n \
  \       jag = new Checkbox(\"Jaguar\",cbg,false);\n        au = new Checkbox(\"\
  Audi\",cbg,false);\n        add(fe);\n        add(lam);\n        add(jag);\n   \
  \     add(au);\n        fe.addItemListener(this);\n        lam.addItemListener(this);\n\
  \        jag.addItemListener(this);\n        au.addItemListener(this);\n    }\n\n\
  \    public void itemStateChanged(ItemEvent ie) {\n        repaint();\n    }\n\n\
  \    public void paint(Graphics g) {\n        str = \"Selected Brand : \";\n   \
  \     g.drawString(str,6,80);\n        str = \"  Ferrari: \" + fe.getState();\n\
  \        g.drawString(str,6,100);\n        str = \"  Lamborghini: \" + lam.getState();\n\
  \        g.drawString(str,6,120);\n        str = \"  Jaguar: \" + jag.getState();\n\
  \        g.drawString(str,6,140);\n        str = \"  Audi: \" +au.getState();\n\
  \        g.drawString(str,6,160);\n    }\n}\n//<applet code=\"SampleCBG.class\"\
  \ width=300 height=200></applet>\n```\n\n![](img/Image00012.jpg)\n\n在这个程序中，我们使用\
  \ `Checkbox` 和 `CheckboxGroup` 创建了单选按钮。同样，我们没有单独的单选按钮类，但当我们把 `CheckboxGroup` 对象作为参数时，可以通过\
  \ `Checkbox` 构造函数创建单选按钮。在这个程序中，我们添加了单选按钮，每个按钮代表一个汽车品牌。\n\n### 5. 选择组件 (Choice Component)\n\
  \n选择框就是一个普通的组合框控件，它是文本和列表框的结合。你可以从列表框选择任何项目，它会立即显示。在 Java 中，我们有 `Choice` 类来创建选择框。\n\
  \n### Choice 组件的构造函数\n\n`Choice ch=new Choice();`\n\n### Choice 方法\n\n- `add(String\
  \ item)` 向相应的选择框添加一个项目。\n- `addItem(String item)` 此方法也向相应的选择框添加项目。\n- `getItem(int\
  \ index)` 返回对应选择框中指定索引的字符串。\n- `getItemCount()` 返回选择框中的项目数量。\n- `getSelectedIndex()`\
  \ 返回选择框中当前选中项目的索引。\n- `getSelectedItem()` 返回作为字符串数据的当前选中项目。\n- `insert(String item,\
  \ int index)` 在指定位置向对应选择框插入项目。\n- `remove(int position)` 从对应选择框的指定位置移除项目。\n- `remove(String\
  \ item)` 与上一个类似，这将从相应的选择菜单中移除第一个项目。\n- `removeAll()` 从相应的选择菜单中移除所有项目。\n- `select(int\
  \ pos)` 将对应选择菜单的选中项目设置为指定位置。\n- `select(String str)` 将对应选择菜单的选中项目设置为与指定字符串相等的项目。\n\
  \n### Choice 组件的示例程序\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\
  import java.applet.*;\n\npublic class SampleChoice extends Applet implements ItemListener\
  \ {\n    Choice country,city;\n    String str = new String();\n\n    public void\
  \ init() {\n        country = new Choice();\n        city = new Choice();\n    \
  \    country.add(\"India\");\n        country.add(\"USA\");\n        country.add(\"\
  England\");\n        country.add(\"Canada\");\n        city.add(\"Newyork\");\n\
  \        city.add(\"New Delhi\");\n        city.add(\"London\");\n        city.add(\"\
  Toronto\");\n        add(country);\n        add(city);\n        country.addItemListener(this);\n\
  \        city.addItemListener(this);\n    }\n\n    public void itemStateChanged(ItemEvent\
  \ ie) {\n        repaint();\n    }\n\n    public void paint(Graphics g) {\n    \
  \    str = \"Selected Country : \";\n        str += country.getSelectedItem();\n\
  \        g.drawString(str,6,80);\n    }\n}\n```\n\n\n\n\n\n```java\ng.drawString(str,6,120);\n\
  \nstr = \"Selected City : \";\n\nstr += city.getSelectedItem();\n\ng.drawString(str,6,140);\n\
  \n}\n\n}\n\n//<applet code=\"SampleChoice.class\" width=500 height=500></applet>\n\
  ```\n\n![](img/Image00013.jpg)\n\n在此程序中，有两个通过 `Choice()` 组件构造函数辅助添加的选择框（choice boxes）。我们随后使用\
  \ `add()` 方法在选择框中添加了一个项目列表。两个选择框都有四个项目。选择框会生成 `Item Event`（项目事件），因此该事件由 `Item Listener`\
  \ 接口方法 `itemStateChanged()` 处理。每当您从列表中选择任何项目时，`itemStateChanged()` 方法就会被调用；在这里我们调用了\
  \ `repaint()` 方法。在 `repaint()` 方法内部，将使用 `drawString()` 方法在 applet 窗口中打印两个选择框选中的项目。\n\
  \n## 6. 列表框 (List Box)\n\n该组件包含一个允许我们从中选择的项列表。该组件也会生成 `Item Event`，因此它也由 `Item Listener`\
  \ 方法 `itemStateChanged()` 处理。此组件类包含三个构造函数来创建列表框，以及一组处理列表框项的方法。\n\n### 列表框的构造函数\n\
  \n- `List()`___ 创建一个可滚动的列表框。\n- `List(int rows)`___ 创建一个可滚动的列表框，该框仅显示构造函数中指定的项目数量；其余项目将在您滚动列表框时变得可见。\n\
  - `List(int rows, Boolean Multiple)`___ 创建一个可滚动的列表框，该框仅显示构造函数中指定的项目数量；其余项目将在您滚动列表框时变得可见。如果您将多选模式（multiple\
  \ mode）设置为 true，则您可以在列表框中选择多个一个项目。\n\n### List 组件类的方法\n\n- `add(String item)`___\
  \ 在滚动列表的末尾添加指定的项。\n- `add(String item, int index)`___ 在指定位置添加指定的项。\n- `deselect(int\
  \ index)`___ 取消选择指定索引处的项。\n- `getItem(int index)`___ 返回指定索引处的项。\n- `getItemCount()`___\
  \ 返回列表组件中的项目数量。\n- `getItems()`___ 返回列表中的项。\n- `getRows()`___ 返回对应列表中可见的行数。\n- `int[]\
  \ getSelectedIndexes()`___ 返回列表中被选中项目的索引。\n- `getSelectedItem()`___ 返回对应列表中选中的项。\n\
  - `select(int index)`___ 选择对应列表中指定索引处的项。\n- `setMultipleMode(Boolean b)`___ 设置允许对应列表多项选择的标志。\n\
  \n## 示例程序\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nimport java.applet.*;\n\
  \npublic class SampleList extends Applet implements ItemListener {\n\nList country,city;\n\
  \nString str = new String();\n\npublic void init() {\ncountry = new List(2);\ncity\
  \ = new List(4);\ncountry.add(\"India\");\ncountry.add(\"USA\");\ncountry.add(\"\
  England\");\ncountry.add(\"Canada\");\ncity.add(\"Newyork\");\ncity.add(\"New Delhi\"\
  );\ncity.add(\"London\");\ncity.add(\"Toronto\");\nadd(country);\nadd(city);\ncountry.addItemListener(this);\n\
  city.addItemListener(this);\n}\n\npublic void itemStateChanged(ItemEvent ie) {\n\
  repaint();\n}\n\npublic void paint(Graphics g) {\nstr = \"Selected Country : \"\
  ;\nstr += country.getSelectedItem();\ng.drawString(str,6,120);\nstr = \"Selected\
  \ City : \";\nstr += city.getSelectedItem();\ng.drawString(str,6,140);\n}\n\n}\n\
  ```\n\n```java\n//<applet code=\"SampleList.class\" width=500 height=500></applet>\n\
  ```\n\n![](img/Image00014.jpg)\n\n在此示例中，有两个使用 `List()` 组件构造函数添加的列表框。然后，我们使用 `add()`\
  \ 方法在我们的选择框中添加了项目列表。两个列表框都有四个项目。列表框生成 `Item Event`，因此该事件由 `Item Listener` 接口使用 `itemStateChanged()`\
  \ 方法处理。每当您从列表中选择任何项目时，`itemStateChanged()` 方法就会被调用；在这里我们调用了 `repaint()` 方法。在 `repaint()`\
  \ 方法内部，将通过 `drawString()` 方法在 applet 窗口中打印两个列表框选中的项目。\n\n## 7. 文本字段组件 (Text Field\
  \ Component)\n\n这是一个单行数据编辑器，允许您在单行上输入文本数据。`TextField` 组件类包含一组构造函数和方法来处理 TextField\
  \ 数据。在这里，我们列出了 TextField 组件类的构造函数和方法。它会生成 `TextEvent`（文本事件），因此它由 `TextListener`\
  \ 的 `textValueChanged()` 方法处理。\n\n### TextField 的构造函数\n\n- `TextField()`\n- `TextField(int\
  \ length)`\n- `TextField(String str)`\n- `TextField(String str, int length)`\n\n\
  ### TextField 组件类的方法\n\n- `getText()`___ 返回对应 `TextField` 的文本。\n- `setText(String\
  \ str)`___ 将给定文本设置到对应 `TextField`。\n- `getSelectedText()`___ 返回 `TextField` 中选中的文本部分。\n\
  - `select(int startindex,int endindex)`___ 用于选择从起始索引到结束索引的内容。\n- `setEditable(boolean\
  \ b)`___ 如果为 false，文本不可修改。\n- `isEditable()`___ 检查文本是否可编辑。\n- `setEchoChar(char\
  \ ch)`___ 设置回显字符（密码字段）。\n- `echoChar()`___ 检查是否设置了回显。\n\n## 8. 文本区域组件 (TextArea\
  \ Component)\n\n这是一个多行数据编辑器。在这里您可以在多行输入数据。它也有一组构造函数和方法。\n\n### TextArea 的构造函数\n\n\
  - `TextArea()`\n- `TextArea(int numLines,int numChars)`\n- `TextArea(String str)`\n\
  - `TextArea(String str,int numLines,int numChars)`\n- `TextArea(String str,int numLines,int\
  \ numChars,int rows)`\n\n### 组件的方法\n\n所有文本组件都支持 TextArea，尽管它们有一些独特的方法。\n\n- `append(String\
  \ str)`___ 在行末追加文本。\n- `insert(String str,int index)`___ 在指定索引插入字符串。\n- `replaceRange(String\
  \ str,int startIndex,int endIndex)`___ 使用起始和结束索引替换字符串。\n\n### 使用文本字段和文本区域的示例程序\n\
  \n```java\nimport java.awt.*;\nimport java.applet.*;\n\n//<applet code=”SampleText”\
  \ width=”200” height=”200></applet>\n\npublic class SampleText extends Applet\n\
  {\n\nTextField t1;\nTextArea ta1;\n\npublic void init()\n{\nt1=new TextField(25);\n\
  ta1=new TextArea(“Hello this is Text area”,20,25);\nadd(t1);\nadd(ta1);\n}\n\n}\n\
  ```\n\n![](img/Image00015.jpg)\n\n## 9. 滚动条组件 (Scrollbar Component)\n\n`Scrollbar`\
  \ 是 `java.awt` 包下的预定义类。此组件帮助开发者向 applet 窗口添加新的滚动条。该类有多种构造函数，我们可以使用它们创建控件。我们可以通过此组件创建两种类型的滚动条：水平和垂直。您需要指定想要创建的哪种滚动条，因为水平和垂直滚动条有单独的常量。\n\
  \n### Scrollbar 组件的构造函数\n\n- `Scrollbar()`___ 此构造函数创建一个水平滚动条。如果您没有在构造函数中没有样式或使用此空构造函数创建滚动条，默认创建一个水平滚动条。\n\
  - `Scrollbar(int style)`___ 此构造同样创建一个滚动条，但允许您通过发送样式参数来指定想要创建的哪种滚动条。\n\n样式：\n- `Scrollbar.VERTICAL`___\
  \ 创建垂直滚动条。\n- `Scrollbar.HORIZONTAL`___ 创建水平滚动条。\n\n- `Scrollbar(int style, int\
  \ initial value, int thumbsize, int min, int max)`___ 此构造函数将创建一个带有额外信息的滚动条，例如样式、初始值、块大小以及滚动条的最小值和最大值。\n\
  \n### Scrollbar 组件的方法\n\n- `setValues(int initialvalue, int thumbsize, int min,\
  \ int max)`___ 帮助开发者访问已创建滚动条的额外信息。\n\n\n\n\n\n`int getMinimum()`___ 返回特定滚动条的最小值。\n\
  \n`int getMaximum()`___ 返回特定滚动条的最大值。\n\n`int getValue()`___ 返回特定滚动条的当前值。\n\n`void\
  \ setUnitIncrement(int newincr)`___ 按指定的值递增或移动滑块。默认情况下，如果点击滚动条的最大值，当前值将递增 1。\n\n\
  `void setBlockIncrement(int newIncr)`___ 用于设置块增量。块增量的默认值为 10。\n\n如果你在滚动条上进行了任何更改，它将产生一个\
  \ `Adjustment` 事件，该事件由 `AdjustmentListener` 接口进行处理。该接口有一个名为“`getAdjustmentValueChanged\
  \ (AdjustmentEvent aje)`”的方法。此方法将在滚动条上执行任何操作。接下来的示例将帮助你理解调整值改变方法的签名。\n\n```\nvoid\
  \ adjustmentValueChanged(AdjustmentEvent obj)\n```\n\nimport java.applet.*;\n\n\
  import java.awt.*;\nimport java.awt.event.*;\n\npublic class SampleScrollbar extends\
  \ Applet implements AdjustmentListener\n\n{\n\nScrollbar hs1;\n\nFont f1;\n\nColor\
  \ c1;\n\npublic void init()\n\n{\n\nf1=new Font(\"Courier\",Font.BOLD,15);\nc1=new\
  \ Color(200,100,50);\nhs1=new Scrollbar(Scrollbar.HORIZONTAL,5,1,0,255);\nadd(hs1);\n\
  hs1.addAdjustmentListener(this);\n\n}\n\npublic void adjustmentValueChanged(AdjustmentEvent\
  \ ae)\n\n{\n\nrepaint();\n}\n\npublic void paint(Graphics g)\n\n{\n\ng.setColor(c1);\n\
  g.setFont(f1);\ntext=\"Current value is :\"+hs1.getValue();\ng.drawString(text,50,50);\n\
  }\n\n}\n\n//<applet code=\"SampleScrollbar\" height=\"200\" width=\"300\"></applet>\n\
  \n![](img/Image00016.jpg)\n\n在这个示例中，我们演示了滚动条的使用和功能。我们通过滚动条构造函数只创建了一个滚动条。然后，我们创建了字体和颜色对象来设置\
  \ applet 窗口的新字体和颜色。成功创建水平滚动条（在 `Scrollbar` 构造函数内部指定了 `Scrollbar.Horizontal`）后，它将通过\
  \ `add()` 方法添加到 applet 中。然后，调整监听器将执行调整事件。如果你在调整事件产生立即调整滚动条，它将调用调整值改变方法。在那里我们简单地通过\
  \ `repaint` 方法调用 `paint` 方法来更新 applet 窗口。在 `paint` 内部，我们使用相应的 `setfont` 和 `setcolor`\
  \ 方法设置 applet 窗口的颜色和字体。最后，`drawString` 方法打印滚动条的当前值。\n\n## 菜单\n\n基本上所有的 GUI 应用程序都有菜单和菜单栏。通常，这些类型的菜单项在点击时可以执行任何任务。我们有一组方法来处理这些菜单事件。如果你点击菜单项，它将产生一个\
  \ `Action` 事件。我们已经讨论过事件处理；`Action` 事件由 `ActionListener` 接口处理。让我们来看看这些类及其构造函数和方法。\n\
  \n`MenuBar` 类用于创建菜单栏。该菜单栏包含一个菜单和菜单项。\n\n`Frame.setMenuBar(MenuBar object);`\n\n\
  此方法将在框架上设置菜单栏。`Menu` 类用于创建一个新的 `Menu`。它有一个构造函数，用于创建一个新的菜单，该菜单可以通过 `MenuBar.add (Menu\
  \ item)` 方法添加到菜单栏。`MenuItem` 类用于创建一个新的菜单项。它有一个构造函数，将创建一个新的菜单项，可以通过相同的 `add(MenuItem\
  \ obj)` 方法添加到菜单。\n\n### 带有项的示例菜单\n\n```\nMenuBar mb = new MenuBar();\nMenu mFile\
  \ = new Menu(\"File\");\nMenuItem mNew = new MenuItem(\"New\");\nmFile.add(mNew);\n\
  mb.add(mFile)\nf.setMenuBar(mb);\n```\n\n### Menu 类的方法\n\n`add(Menu)`___ 将指定的菜单项添加到菜单。\n\
  \n`add(String)`___ 将指定的字符串添加到菜单。将创建一个以指定字符串为标签的新菜单项并添加到菜单。\n\n`addSeparator()`___\
  \ 在菜单中添加一个分隔符。\n\n`getItem(int index)`___ 以字符串形式返回指定索引处的项。\n\n`remove(int index)`___\
  \ 从菜单中删除指定索引处的项。\n\n### MenuItem 类的方法\n\n`getLabel()`___ 以字符串格式返回菜单项的标签。\n\n`setLabel(String)`___\
  \ 将菜单项的标签更改为指定的字符串。\n\n`setEnabled(boolean)`___ 根据参数是 true 还是 false，使菜单项变为可选/取消选择状态。\n\
  \n### 复选框菜单项\n\n此类将创建复选框菜单项，会在菜单项旁边显示一个勾选。此菜单项也可以像菜单菜单一样执行某些任务。\n\n### 复选框菜单项的方法\n\
  \n`getState()`___ 以布尔值返回菜单项的状态。值 true 表示复选框菜单项被选中。\n\n`setState(boolean)`___ 设置菜单项的状态。如果传递的值为\
  \ true，则菜单项被设置为选中状态。\n\n### 创建菜单的示例程序\n\n```\nimport java.awt.*;\nimport java.awt.event.*;\n\
  \npublic class SampleMenu extends Frame implements ActionListener\n\n{\n\nMenuBar\
  \ mb;\nMenu mFile,mEdit,mFormat;\nMenuItem mNew,mOpen,mSave,mExit;\nMenuItem mCut,mCopy,mPaste;\n\
  MenuItem mWord,mFon;\n\npublic SampleMenu(String title)\n\n{\n\nsuper(title);\n\
  mb = new MenuBar();\nmFile = new Menu(\"File\");\nmEdit = new Menu(\"Edit\");\n\
  mFormat = new Menu(\"Format\");\nmNew = new MenuItem(\"New\");\nmOpen = new MenuItem(\"\
  Open\");\nmSave = new MenuItem(\"Save\");\nmExit = new MenuItem(\"Exit\");\nmCut\
  \ = new MenuItem(\"Cut\");\nmCopy = new MenuItem(\"Copy\");\nmPaste = new MenuItem(\"\
  Paste\");\nmWord = new MenuItem(\"Word\");\nmFon=new MenuItem(\"Font\");\n\nmFile.add(mNew);\n\
  mFile.add(mOpen);\nmFile.add(mSave);\nmFile.add(mExit);\nmEdit.add(mCut);\nmEdit.add(mCopy);\n\
  mEdit.add(mPaste);\nmFormat.add(mWord);\nmFormat.add(mFon);\nmb.add(mFile);\nmb.add(mEdit);\n\
  mb.add(mFormat);\nsetMenuBar(mb);\naddWindowListener(new WindowAdapter() {\n\npublic\
  \ void windowClosing(WindowEvent we)\n\n{\n\ndispose();\nSystem.exit(0);\n\n}\n\n\
  });\nmExit.addActionListener(this);\nmNew.addActionListener(this);\nsetSize(400,400);\n\
  setVisible(true);\n}\n\npublic void actionPerformed(ActionEvent ae)\n\n{\n\nif(ae.getSource()\
  \ == mExit)\n\n{\n\ndispose();\nSystem.exit(0);\n}\n\nelse if(ae.getSource() ==\
  \ mNew)\n\n{\n\nSystem.out.println(“A new option selected”);\n}\n\n}\n\npublic static\
  \ void main(String args[])\n\n{\n\nSampleMenu sm = new SampleMenu(\"Menu Creation\"\
  );\n\n}\n\n}\n```\n\n\n\n\n\n# Dialog 对话框\n\n`Dialog(Frame,boolean)`___ 创建一个初始为不可见的新对话框。在这个构造函数中，我们有两个参数。第一个参数\
  \ `frame` 对象指向此新创建对话框的父窗口。第二个参数 `Boolean` 类型数据表示它是模态对话框还是非模态对话框。\n\n`Dialog(Frame,String,boolean)`___\
  \ 创建一个初始为不可见的新对话框。在这个构造函数中，我们有三个参数。第一个 `frame` 对象指向此新创建对话框的父窗口。第二个 `String` 类型数据是对话框的标题文本。第三个\
  \ `Boolean` 类型数据，表示它是模态对话框还是非模态对话框。\n\n### 模态与非模态对话框\n\n`Modal` 模态对话框在关闭之前永远不会允许父窗口激活，但在\
  \ `modeless` 非模态对话框中，你可以在父窗口中进行任何操作。\n\n## Dialog 类的方法\n\n- `boolean isModal()`___\
  \ 如果对话框是模态的，返回 true。我们已经见过模态对话框的工作模式。如果对话框是非模态的，将返回 false。\n- `setResizable(boolean)`___\
  \ 设置对话框的可调整大小标志。如果你将此值设置为 true，它将允许我们调整对话框的大小。如果设置为 false，则无法调整大小。\n- `boolean isResizable()`___\
  \ 用于检查对话框是否可以调整大小。如果返回 true，则对话框是可调整的。\n\n## 对话框示例程序\n\n```java\nimport java.awt.*;\n\
  import java.awt.event.*;\n\npublic class Dialog1 extends Dialog implements ActionListener\n\
  {\n    public Dialog1(Frame fm,String msg)\n    {\n        super(fm,msg,false);\n\
  \        setLayout(new GridLayout(2,1,0,0));\n        Panel p1 = new Panel();\n\
  \        Panel p2 = new Panel();\n        p1.setLayout(new FlowLayout());\n    \
  \    p1.setFont(new Font(\"Courier\",Font.BOLD,20));\n        p2.setLayout(new FlowLayout());\n\
  \        p1.add(new Label(msg));\n        Button b1,b2;\n        b1 = new Button(\"\
  Ok\");\n        b2 = new Button(\"Cancel\");\n        p2.add(b1);\n        p2.add(b2);\n\
  \        b1.addActionListener(this);\n        add(p1);\n        add(p2);\n     \
  \   setSize(250,150);\n        setResizable(false);\n        addWindowListener(new\
  \ WindowAdapter() {\n            public void windowClosing(WindowEvent we)\n   \
  \         {\n                dispose();\n            }\n        });\n    }\n\n \
  \   public void actionPerformed(ActionEvent ae)\n    {\n        dispose();\n   \
  \ }\n}\n\npublic class SampleDialog extends Frame implements ActionListener\n{\n\
  \    MenuBar mb;\n    Menu myMenu;\n    MenuItem mDialog,mExit;\n    public SampleDialog(String\
  \ text)\n    {\n        super(text);\n        mb = new MenuBar();\n        mMenu\
  \ = new Menu(\"My Menu\");\n        mDialog = new MenuItem(\"Open Dialog\");\n \
  \       mExit = new MenuItem(\"Exit\");\n        mMenu.add(mDialog);\n        mMenu.add(mExit);\n\
  \        mb.add(mMenu); // 注意：此处原文为 mMenu，此处已修正代码逻辑\n        setMenuBar(mb);\n \
  \       setSize(400,400);\n        setVisible(true);\n        mDialog.addActionListener(this);\n\
  \        mExit.addActionListener(this);\n        addWindowListener(new WindowAdapter()\
  \ {\n            public void windowClosing(WindowEvent we)\n            {\n    \
  \            dispose();\n                System.exit(0);\n            }\n      \
  \  });\n    }\n\n    public void actionPerformed(ActionEvent ae)\n    {\n      \
  \  if(ae.getSource() == mDialog)\n        {\n            Dialog1 d1 = new Dialog1(this,\"\
  My New Dialog\");\n            mb.setVisible(true);\n        }\n        else if(ae.getSource()\
  \ == mExit)\n        {\n            dispose();\n            System.exit(0);\n  \
  \      }\n    }\n\n    public static void main(String args[])\n    {\n        SampleDialog\
  \ sd = new SampleDialog(\"Dialog Demo\");\n    }\n}\n```\n\n在这个程序中，我们使用了 `Dialog`\
  \ 类来创建一个包含两个面板的新对话框。第一个面板被设置为 `FlowLayout`，因此所有控件都居中添加，并留有 5 像素的水平和垂直空间。第一个面板只包含一个\
  \ `Label` 框。第二个面板同样使用 `FlowLayout`，包含两个按钮。第一个按钮标签为“ok”，第二个标签为“cancel”。如果你点击此对话框上的任何按钮，将立即产生动作事件。\n\
  \n在对话框示例程序中，我们创建了一个名为 `My Menu` 的菜单。该菜单中有两个选项。第一个选项是 `Open Dialog`，它会打开对话框。第二个选项是\
  \ `Exit`，它会关闭打开的窗口。\n\n## 文件对话框 (File Dialog)\n\n我们在之前的章节中已经提到过文件对话框。在 Java 中，有两个与文件操作相关的重要对话框：`Open\
  \ Dialog`（打开）和 `Save Dialog`（保存）。我们可以通过 `FileDialog` 构造函数来打开此对话框。`FileDialog` 类有三个构造函数。\n\
  \n### FileDialog 的构造函数\n\n- `FileDialog (Frame parent)`___ 创建一个用于加载文件的对话框。注意：默认对话框是打开的，所以如果你使用此构造函数创建文件对话框，它将加载一个打开对话框。\n\
  - `FileDialog (Frame parent,String title)`___ 创建一个用于加载文件的对话框。这里有两个参数：`parent` 窗口和标题\
  \ `title`。\n- `FileDialog (Frame parent,String title,boolean modal)`___ 创建一个用于加载文件的对话框。这里有三个参数：`parent`\
  \ 窗口、标题 `title` 以及 `modal`。\n\n在接下来的部分，我们将看到一个使用 `FileDialog` 来加载和保存文本的示例程序。该程序提供了像\
  \ Notepad 编辑器一样的用户界面。\n\n\n\n\n在这个 Java 记事本应用程序中，我们创建了一个基础文本编辑器，具有新建、打开、保存和退出等简单功能。这应该能让你了解关于如何使用文本区域组件创建菜单的所有知识。如果你有任何困惑，请查看我们在菜单创建部分中的示例程序。所有菜单项都会生成一个动作事件（action\
  \ event），因此你需要实现 `ActionListener` 接口来处理由每个选项生成的动作事件。如果你选择了一个新选项，将立即生成一个动作事件并调用 `action()`\
  \ 方法。在那里，我们检查选择了哪个选项。如果你点击“新建”选项，它将擦除文本区域内的所有内容。如果你选择“打开”选项，它将打开一个加载框，你可以在其中选择任何文件，文件将立即加载到文本区域。如果你选择“保存”选项，它将打开一个保存框，你可以在其中保存文本区域中的文本。最后一个选项是“退出”，它将停止我们的记事本应用程序的运行。\n\
  \nJava Swing 是一个功能全的用户界面开发工具包，用于在 Java 应用程序中创建界面。该工具包包含了大量的各种部件和工具，用于帮助创建图形用户界面。它具有内置控件，如按钮、布局管理器、滑块、文本字段、标签等。它还具有一些高级控件，如树、表格、滚动面板和标签页控件。\n\
  \n在本指南中，你将学习如何在 Java Swing 中开发界面的基础知识。这应该足够你入门了，但剩下的取决于你自己。记住，Java API 可供你使用。\n\n\
  让我们先回顾几个需要记住和理解的重要对象。\n\n在开始之前，记住 Swing 中的以下三个包是非常重要的：\n\n```\nimport javax.swing.*;\n\
  import java.awt.*;\nimport java.awt.event.*;\n```\n\n`javax.swing` 是包含所有 Swing 应用程序开发所需类的包。`JApplet`、`JButton`、`JTree`\
  \ 和 `JScrollpane` 是 Swing 包的一些示例类。\n\n## JFrame\n`JFrame` 对象简单来说是一个允许窗口在屏幕上出现的对象。你可以将\
  \ `JFrame` 想象成一块画布，它是向界面中添加元素时所需的的基础基础。在 Swing 中，这些元素被称为“组件”（components），并在本指南的剩余部分将统称为此类。\n\
  \n要声明一个 `JFrame` 对象，你可以执行简单的操作：\n\n```\nJFrame frame = new JFrame(\"Title\");\n\
  frame.setSize(250,250);\nframe.setDefaultCloseOperation(frame.EXIT_ON_CLOSE);\n\
  frame.setVisible(true);\n```\n\n![`lh6.googleusercontent.com/_bSU5VKMJ7pFENUyn4JxxxOjIJoVINznpLeKWN1to4oewXWRWeq3X8PQHlart0u5O88I2I0mmxT60rHIkE9-wBWxLThAxqt1Ngf-NFH-1zdbfT1S_B9VfvOyGZhKQlcvJKZQpVk`](img/Image00017.jpg)\n\
  \n让我们分析上面示例代码中的每一行。\n\n```\nJFrame frame = new JFrame(\"Title\");\n```\n\n在这一行中，正在声明\
  \ `JFrame` 对象。`JFrame` 构造函数的参数接收一个字符串，该字符串被视为窗口标题。另一种方法是让构造函数为空，然后使用方法：\n\n```\n\
  frame.setTitle(\"Title\");\n```\n\n让我们继续下一行：\n\n```\nframe.setSize(250,250);\n```\n\
  \n这一行应该是不言易明的。`JFrame` 对象中有一个名为 `setSize` 的方法，它接收两个值。第一个值是 `JFrame` 的宽度，第二个值是高度。\n\
  \n```\nframe.setDefaultCloseOperation(frame.EXIT_ON_CLOSE);\n```\n\n下一行简单地告诉窗口，如果通过点击\
  \ x 按钮或通过控制台结束程序，它应该退出窗口而不是保持打开状态。\n\n```\nframe.setVisible(true);\n```\n\n这是所有行中最明显的一行，这一行简单地将\
  \ `JFrame` 的可见性设置为 `true`，以便用户能够看到窗口。\n\n## JPanel\n在界面的画布 (`JFrame`) 中，我们需要一个面板（panel），这样我们向其中添加组件（按钮、标签等）。你可以将\
  \ `JFrame` 想象成剪贴板，将 `JPanel` 想象成纸，这个额外的层允许你在界面上绘制并添加不同类型的组件。需要注意的是，组件可以被添加到原始画布\
  \ (`JFrame`) 上。然而，这样做可能会产生很多复杂问题。这就是为什么我们应该向 `JFrame` 添加一个 `JPanel`。\n\n要声明一个 `JPanel`，你可以结合之前的示例代码执行以下操作：\n\
  \n```\nJFrame frame = new JFrame();\nframe.setTitle(\"Title\");\nframe.setSize(250,250);\
  \ \nframe.setDefaultCloseOperation(frame.EXIT_ON_CLOSE);\nJPanel panel = new JPanel();\
  \ // 新行代码\nframe.add(panel); // 新行代码\nframe.setVisible(true);\n```\n\n在 Swing 类层次结构中的每个对象中，都有一个常用的方法称为\
  \ `add`，它可以接收任何 Swing 组件。`JPanel` 被认为是一个组件，因此被添加到框架中。现在，`JPanel` 可以通过引用 `JPanel`\
  \ 的对象名称并使用 `add` 方法为其添加组件。`JFrame` 和 `JPanel` 对象在技术上具有相同的方法，因此你可以像使用 `JFrame` 一样使用它们。\n\
  \n## JLabel\n`JLabel` 对象仅仅是一个可以添加到面板的 Swing 组件。它在 `JFrame` 窗口中充当文本元素。为了向我们创建的面板添加\
  \ `JLabel` 组件，只需执行：\n\n```\nJFrame frame = new JFrame();\nframe.setTitle(\"Title\"\
  );\nframe.setSize(250,250);\nframe.setDefaultCloseOperation(frame.EXIT_ON_CLOSE);\n\
  JPanel panel = new JPanel();\nframe.add(panel);\nframe.setVisible(true);\nJLabel\
  \ lblText = new JLabel(\"This is Text\");\npanel.add(lblText);\n```\n\n![`lh3.googleusercontent.com/RC-xUZDHAYBmwqL92pFXU1EyHvDg1hNpEG6sFjvUPp0Xu_HRpTwAMVLM9dx9tiIb91rg`](img/Image00018.jpg)\n\
  \n如上面最后两行所示，你可以看到创建一个 `JLabel` 对象非常简单，它接收一个字符串作为构造函数并用其显示文本。完成此操作另一种方法是让构造函数为空并对\
  \ `JLabel` 使用 `setText` 方法。下一行简单地将 `JLabel` 对象添加到面板。你可能在想如何让程序决定在哪里显示文本。我们将在布局管理器部分进一步讨论这个问题。\n\
  \n## JButton\n`JButton` 对象也是可以添加到 `JPanel` 的 Swing 组件。该组件在 `JFrame` 窗口中充当按钮元素。为了向面板添加\
  \ `JButton` 组件，只需执行：\n\n```\nJFrame frame = new JFrame();\nframe.setTitle(\"Title\"\
  );\nframe.setSize(250,250); \nframe.setDefaultCloseOperation(frame.EXIT_ON_CLOSE);\n\
  JPanel panel = new JPanel();\nframe.add(panel);\nframe.setVisible(true);\nJLabel\
  \ lblText = new JLabel(\"This is Text\");\npanel.add(lblText);\nJButton btnTest\
  \ = new JButton(\"Test\"); // 新行代码\npanel.add(btnTest); // 新行代码\n```\n\n![`lh5.googleusercontent.com/_GrlbOqJ9cP7bUeHV6mgZ1rUA1hNpEG6sFjvUPp0Xu_HRpTwAMVLM9dx9tiIbIKqFda-BTTRq7A7f-OtNZuNajb78akeDnnmpFfnbjSayzHS8kdjs2C9L5EHQ`](img/Image00019.jpg)\n\
  \n在最后两行中，我们看到 `JButton` 对象接收字符串的值作为构造函数，并用作按钮名称。另一种方法是让构造函数为空并对 `JButton` 使用 `setText`\
  \ 方法。然后，我们将 `JButton` 组件添加到 `JPanel`。\n\n\n\n\n在本节中，我们将学习布局管理器以及如何按照你的意愿在窗口中设置 Swing\
  \ 组件。Java 中有许多种布局管理器。默认布局是 `FlowLayout`，这也是我们一直在使用的布局。对于其他布局，你必须指定你想要使用的布局类型。如果你不指定特定的布局，则默认将使用\
  \ `FlowLayout`。如果我们逐一介绍所有布局，这本指南将会变得太长，因此，我们将简要地向你展示不同类型布局的视觉效果，以便你决定想要探索哪些布局。在介绍布局列表之前，让我们先看看如何设置布局。根据你选择的类型，有不同的设置布局的方法，但有一行你必须始终记住的恒定代码：\n\
  \n```\npanel.setLayout(new GridLayout(10, 1));\n```\n\n在上面的行代码中，我们使用了 `setLayout`\
  \ 方法，它将接受一个特定的 `Layout` 对象。为了演示目的，我们将在布局参数中输入一个 `GridLayout`。这就是我们如何为 Swing 中不同类型的面板或帧设置布局。\n\
  \n现在，让我们来看所有不同类型的布局：\n\n### BorderLayout（边框布局）\n\n![`lh3.googleusercontent.com/LTx7txGpuysBnDDsTQytrSppINRLMD0c2xBgm45DMlRGv22tVMzuE00pEDAm1NYtClE8HdfoCBtra8V9C9b0QFWmnUY3Q7jlqEinsaN5i7P8gAjWk-6p95DHxxmLSDep9UmAQro`](img/Image00020.jpg)\n\
  \n`BorderLayout` 让你能够将组件放置在面板的顶部、底部、左侧、右侧和中心。\n\n### BoxLayout（块布局）\n\n![`lh4.googleusercontent.com/ZkQ2PlFYCtVkhh9FiI3qq_-fYCRX7XiVZeIk91FoHKpNe9GyEy8x-RunaWP6jw8-Vesx6bJ57xgCfhBPKMFLk4ViJfzZU7UgE4htJ0pGdOjFrwrJR4EOm8xUG17Gjv4QdcYEOBc`](img/Image00021.jpg)\n\
  \n`BoxLayout` 允许你将组件放在单行或单列中，并允许用户轻松指定任何自定义的最大尺寸。此外，它还允许根据你的需求对齐组件。\n\n### CardLayout（卡片布局）\n\
  \n![`lh5.googleusercontent.com/6xQLfwRErxIKOWmqZjc0Hh5JiyDQ-nie7lYeyxkAmOdgv7stZs0-hSsBFFVgyCcjE_o88YC3W6iaFhO0iyPaju6fUga_--hsw9nwhgLNiGcAUUY3vYbklZaqDLBqjUY2toNLO8E`](img/Image00022.jpg)\n\
  \n![`lh6.googleusercontent.com/BwSgX50XcVIaaFsinsm6PXA7Zb88vJtSE5qZ_OqTA0zaR1CZAC0i8e96sEfo8kPeM1C2MfLTHFgPrfEiIch_LqopKzs-ZSZ3WMJV-k72auwlg3CUhECVGYywIEAXFDiUYY0rLoo`](img/Image00023.jpg)\n\
  \n`CardLayout` 允许你实现一个在不同时间包含不同组件的区域。\n\n### FlowLayout（流式布局）\n\n![`lh5.googleusercontent.com/g20IhW_SBqTBSuE-Zi9hCU9N8tBu-9BxNoASul_m6XRjQhDIdCfBYdiIx_k2SbeOzbR8KEhAFJvwA_WptyxqzB1CqsSuGqzrto05VRQNsPJIfdRsigEfkx7uswPgoUiWyF1eA1M`](img/Image00024.jpg)\n\
  \n`FlowLayout` 是默认布局管理器，使用时不需要指定。它所做的就是将组件排列在单行中，并根据窗口宽度开始新的一行。\n\n### GridBagLayout（网格布局布局）\n\
  \n![`lh6.googleusercontent.com/vWYIgQefbmJelIBiVE4DgF3ElW8q3ch5Ssn7iCeZA3xG7edRFpugspMoppaFP8UDxqNrADeoH076YBOk5Eg7xr3yc9kkSh2vjDPvLq7HmRtGMAbVtldJQ1Dmz1ZYRniSzM2KUVU`](img/Image00025.jpg)\n\
  \n`GridBagLayout` 是所有布局管理器中最灵活的；它允许你在单元格网格中轻松地对齐和放置组件。\n\n### GridLayout（网格布局）\n\
  \n![`lh5.googleusercontent.com/bFhhaheNQhxQluWNkQ_WdrrfGl7yYN03uhbigpGt0uuq--m0mqOdNAMGx4THVZTRbnUlLZntNzY-HKYeuQyB71l3ehjKJQ83G26GV7mStVW0DNpG_EtLjYlnsWZBQP6QK5UVKC8`](img/Image00026.jpg)\n\
  \n`GridLayout` 使所有组件的大小相等，它们可以在网格中顺序显示，取决于添加元素的顺序——类似于 `FlowLayout` 组织的行和单元。\n\n\
  ### GroupLayout（分组布局）\n\n![`lh4.googleusercontent.com/RO-yz9X5luy2MN5pca-4bDmx1jwkh71lnR39P-Im3k88shj26mi_XVNS0k19pfrDo1EUIJTA`](img/Image00027.jpg)\n\
  \n`GroupLayout` 允许你独立地为每个维度处理水平和垂直布局。\n\n### SpringLayout（弹簧布局）\n\n![`lh4.googleusercontent.com/vp-8EgFti0Zjh_tr2QAyopAyvm2qvDT8sp7uAFF_g0XNo_Fczqe0ah6tMY6LutGy`](img/Image00028.jpg)\n\
  \n`SpringLayout` 是另一个灵活的布局管理器，允许你指定元素与其他元素之间的距离，例如定义组件相对于另一个组件右侧的边缘。\n\n![`lh4.googleusercontent.com/Yot_m-uw1ai5daEF3cqEt8HO3Tn6yw9Fc4ald0I7LyJaochr0Ao95FTNiBJ`](img/Image00029.jpg)\n\
  \n## 第 18 章：事件处理\n\n事件处理的思想是让 GUI 组件根据特定情况相互交互。在本部分，我们将处理用户在 Java UI 中点击按钮的事件。为了设置一个\
  \ `JButton` 组件，我们添加一个 `ActionListener`。`ActionListener` 是一个实现 `ActionListener` 接口的类。一旦实现了接口，你就必须实现该接口的方法。通过对\
  \ GUI 的所有知识，我们可以使用事件处理来监听 `JButton` 的点击创建一个基础计算器。\n\n```java\nimport javax.swing.*;\n\
  import java.awt.*;\nimport java.awt.event.*;\n\npublic class GUI extends JFrame\
  \ implements ActionListener {\n    JPanel mainPanel;\n    JLabel lblfNum;\n    JLabel\
  \ lblsNum;\n    JLabel lblResult;\n    JButton btnAdd;\n    JButton btnSubtract;\n\
  \    JButton btnMultiply;\n    JButton btnDivide;\n    JTextField txt_fNum;\n  \
  \  JTextField txt_sNum;\n\n    public GUI() {\n        setDefaultCloseOperation(EXIT_ON_CLOSE);\n\
  \        setSize(300, 300);\n        setTitle(\"Basic Calculator\");\n        setVisible(true);\n\
  \        Initialize();\n    }\n\n    private void Initialize() {\n        mainPanel\
  \ = new JPanel();\n        mainPanel.setLayout(new GridLayout(10, 1));\n       \
  \ lblfNum = new JLabel(\"First Number\", JLabel.CENTER);\n        lblsNum = new\
  \ JLabel(\"Second Number\", JLabel.CENTER);\n        lblResult = new JLabel(\"---\"\
  , JLabel.CENTER);\n        txt_fNum = new JTextField();\n        txt_sNum = new\
  \ JTextField();\n        btnAdd = new JButton(\"Add\");\n        btnSubtract = new\
  \ JButton(\"Subtract\");\n        btnMultiply = new JButton(\"Multiply\");\n   \
  \     btnDivide = new JButton(\"Divide\");\n        SetListeners();\n        mainPanel.add(lblfNum);\n\
  \        mainPanel.add(txt_fNum);\n        mainPanel.add(lblsNum);\n        mainPanel.add(txt_sNum);\n\
  \        mainPanel.add(btnAdd);\n        mainPanel.add(btnSubtract);\n        mainPanel.add(btnMultiply);\n\
  \        mainPanel.add(btnDivide);\n        mainPanel.add(lblResult);\n        add(mainPanel);\n\
  \        revalidate();\n    }\n\n    private void SetListeners() {\n        btnAdd.addActionListener(this);\n\
  \        btnSubtract.addActionListener(this);\n        btnMultiply.addActionListener(this);\n\
  \        btnDivide.addActionListener(this);\n    }\n\n    public void actionPerformed(ActionEvent\
  \ e) {\n        String btnName = e.getActionCommand();\n        try {\n        \
  \    int fNum = Integer.parseInt(txt_fNum.getText().trim());\n            int sNum\
  \ = Integer.parseInt(txt_sNum.getText().trim());\n            if (btnName.equals(\"\
  Add\")) {\n                int result = fNum + sNum;\n                lblResult.setText(result\
  \ + \"\");\n            } else if (btnName.equals(\"Subtract\")) {\n           \
  \     int result = fNum - sNum;\n                lblResult.setText(result + \"\"\
  );\n            } else if (btnName.equals(\"Multiply\")) {\n                int\
  \ result = fNum * sNum;\n                lblResult.setText(result + \"\");\n   \
  \         } else if (btnName.equals(\"Divide\")) {\n                int result =\
  \ fNum / sNum;\n                lblResult.setText(result + \"\");\n            }\n\
  \        } catch (Exception exc) {\n            lblResult.setText(\"Invalid input!\"\
  );\n        }\n    }\n}\n\npublic class ThisIsAClass {\n    public static void main(String[]\
  \ args) {\n        GUI g = new GUI();\n    }\n}\n```\n\n![`lh6.googleusercontent.com/7v8tmYQspVYhfhaeboKA8mxPugYlvM45TEl1mE-PFWJ0eVLqpoh9jgE7qJj_h8u_iK1yygkxo3PKhgM9XmlGPp-T5Fkkvejvhrx4A5GOLQfvvHkqArWYx1vv-nbgHKXbibWzUG4`](img/Image00030.jpg)\n\
  \n\n\n\n在主类中，我们声明了 `GUI` 对象，该对象在构造函数中会自动初始化 UI。`GUI` 类继承了 `JFrame`，因此在引用其方法时，我们不需要引用\
  \ `JFrame` 对象。我们可以直接引用这些方法，这就是为什么 `GUI` 类采用这种组织方式。\n\n```java\nsetDefaultCloseOperation\
  \ ( EXIT_ON_CLOSE );\nsetSize(300, 300);\nsetTitle(\"Basic Calculator\");\nsetVisible(true);\n\
  Initialize();\n```\n\n构造函数调用了 `Initialize` 方法，该方法包含以下内容：\n\n```java\nmainPanel =\
  \ new JPanel();\nmainPanel.setLayout(new GridLayout(10, 1));\nlblfNum = new JLabel(\"\
  First Number\", JLabel.CENTER);\nlblsNum = new JLabel(\"Second Number\", JLabel.CENTER);\n\
  lblResult = new JLabel(\"---\", JLabel.CENTER);\ntxt_fNum = new JTextField();\n\
  txt_sNum = new JTextField();\nbtnAdd = new JButton(\"Add\");\nbtnSubtract = new\
  \ JButton(\"Subtract\");\nbtnMultiply = new JButton(\"Multiply\");\nbtnDivide =\
  \ new JButton(\"Divide\");\nSetListeners();\nmainPanel.add(lblfNum);\nmainPanel.add(txt_fNum);\n\
  mainPanel.add(lblsNum);\nmainPanel.add(txt_sNum);\nmainPanel.add(btnAdd);\nmainPanel.add(btnSubtract);\n\
  mainPanel.add(btnMultiply);\nmainPanel.add(btnDivide);\nmainPanel.add(lblResult);\n\
  add(mainPanel);\nrevalidate();\n```\n\n在第一行中：\n\n```java\nmainPanel = new JPanel();\n\
  ```\n\n我们声明了一个 `JPanel` 对象，然后将其布局设置为 `GridLayout`。\n\n```java\nmainPanel.setLayout(new\
  \ GridLayout(10, 1));\n```\n\n这两个参数是行和列。程序中共有九行，但为了安全起见，我们输入了十行。计算器只有一列，因此第二个参数只输入了数字一。\n\
  \n```java\nlblfNum = new JLabel(\"First Number\", JLabel.CENTER);\nlblsNum = new\
  \ JLabel(\"Second Number\", JLabel.CENTER);\nlblResult = new JLabel(\"---\", JLabel.CENTER);\n\
  txt_fNum = new JTextField();\ntxt_sNum = new JTextField();\nbtnAdd = new JButton(\"\
  Add\");\nbtnSubtract = new JButton(\"Subtract\");\nbtnMultiply = new JButton(\"\
  Multiply\");\nbtnDivide = new JButton(\"Divide\");\n```\n\n这是一种常规设置，用于初始化要添加到面板中的\
  \ Swing 组件，而面板随后会被添加到 `JFrame` 中。\n\n接的一行调用了一个方法：\n\n```java\nSetListeners();\n\
  ```\n\n该方法包含以下内容：\n\n```java\nbtnAdd.addActionListener(this);\nbtnSubtract.addActionListener(this);\n\
  btnMultiply.addActionListener(this);\nbtnDivide.addActionListener(this);\n```\n\n\
  在该方法中，为每个 `JButton` 都添加了一个 `ActionListener`。参数中的参数是指要引用的哪一个 `ActionListener` 的位置。由于当前类（`GUI`）实现了\
  \ `ActionListener` 接口，因此它可以使用关键字 `this` 来引用当前类。`ActionListener` 接口实现了 `actionPerformed`\
  \ 方法，并对其进行了具体实现。该方法包含以下内容：\n\n```java\npublic void actionPerformed(ActionEvent e)\
  \ {\n    String btnName = e.getActionCommand();\n    try{\n        int fNum = Integer.\
  \ parseInt (txt_fNum.getText().trim());\n        int sNum = Integer.parseInt(txt_sNum.getText().trim());\n\
  \        if (btnName.equals(\"Add\")) {\n            int result = fNum + sNum;\n\
  \            lblResult.setText(\"Result: \" + result + \"\");\n        }else if\
  \ (btnName.equals(\"Subtract\")) {\n            int result = fNum - sNum;\n    \
  \        lblResult.setText(\"Result: \" + result + \"\");\n        }else if (btnName.equals(\"\
  Multiply\")) {\n            int result = fNum * sNum;\n            lblResult.setText(\"\
  Result: \" + result + \"\");\n        }else if (btnName.equals(\"Divide\")) {\n\
  \            int result = fNum / sNum;\n            lblResult.setText(\"Result:\
  \ \" + result + \"\");\n        }\n    }catch(Exception exc) {\n        lblResult.setText(\"\
  Invalid input!\");\n    }\n}\n```\n\n在此方法中，使用了 `try-catch` 语句来检测文本框是否包含字符串，以便 Java\
  \ 应用程序不会尝试计算文本。上面的代码应该是显而易懂的。当与 Swing 组件交互时，变量 `ActionEvent e` 会提供信息；一旦发生交互，该方法就会被调用并且\
  \ `e` 会获得信息。`getActionCommand()` 方法返回被交互按钮的名称。接下来，创建一系列 `if-else` 语句来确定是哪个按钮，并执行相应的操作。\n\
  \n在 `SetListeners()` 方法之后，所有初始化的 Swing 组件都按顺序添加了：\n\n```java\nmainPanel.add(lblfNum);\n\
  mainPanel.add(txt_fNum);\nmainPanel.add(lblsNum);\nmainPanel.add(txt_sNum);\nmainPanel.add(btnAdd);\n\
  mainPanel.add(btnSubtract);\nmainPanel.add(btnMultiply);\nmainPanel.add(btnDivide);\n\
  mainPanel.add(lblResult);\nadd(mainPanel);\nrevalidate();\n```\n\n这里的所有内容除最后一行外都是显而易懂的，最后一行仅仅是重新验证（revalidate）。\n\
  \n\n\n\n```java\nConnection con = DriverManager.getConnection(\"jdbc:odbc:dsn1\"\
  ,\"\",\"\");\n\nString qry = \"Create Table Student(sno int,sname varchar(20))\"\
  ;\n\nStatement st = con.createStatement();\n\nst.executeUpdate(qry);\n\nSystem.out.println(\"\
  Table has been created\");\n\n}\n\ncatch(Exception e)\n\n{\n\nSystem.out.println(\"\
  Exception : \" + e);\n\n}\n\n}\n\n}\n```\n\n在这个程序中，我们创建了一个新表。首先，我们使用 `getConnection()`\
  \ 方法创建了一个连接对象。有三个不同的可用参数。第一个是 `jdbc` 和 `odbc` 驱动以及数据源名称。第二个是数据库应用程序的用户名，第三个是数据库应用程序的密码。在下一行中，我们将创建表的查询语句存储在一个字符串变量中。然后，我们创建了一个\
  \ `statement` 对象来运行 SQL 查询。最后，我们把字符串 `query` 作为参数传递进去。它将执行查询并创建表。一旦表创建完成，`statement`\
  \ 就会确认表的创建。你可以在所选的数据库中检查创建的表。\n\n### 插入数据\n\n```java\nimport java.io.*;\n\nimport\
  \ java.sql.*;\n\nclass InsertionSample\n\n{\n\npublic static void main(String args[])\n\
  \n{\n\nint sno;\n\nString sname;\nString wish=\"y\";\n\ntry {\n\nClass.forName(\"\
  sun.jdbc.odbc.JdbcOdbcDriver\");\nConnection con = DriverManager.getConnection(\"\
  jdbc:odbc:dsn1\",\"\",\"\");\n\nBufferedReader br = new BufferedReader(new InputStreamReader(System.in));\n\
  \ndo{\n\nSystem.out.print(\"Enter sno and sname : \");\n\nsno = Integer.parseInt(br.readLine());\n\
  \nsname = br.readLine();\n\nString qry = \"Insert into Student values(\" + sno +\
  \ \",' \" + sname + \" ')\";\n\nStatement st = con.createStatement();\n\nint r =\
  \ st.executeUpdate(qry);\n\nSystem.out.println(r + \" row(s) Inserted\");\n\nSystem.out.print(\"\
  Add Another Record (y/n)?\");\n\nwish = br.readLine();\n\n} while(wish.equals(\"\
  y\"));\n\n}\n\ncatch(Exception e)\n\n{\n\nSystem.out.println(\"Exception : \" +\
  \ e);\n\n}\n\n}\n\n}\n```\n\n这个程序将数据插入到我们在上一个示例程序创建创建表中。首先，我们使用 `getConnection()`\
  \ 方法创建了一个连接对象。在下一行中，我们将创建表的查询语句存储在一个字符串变量中。然后，我们创建了一个 `statement` 对象来运行 SQL 查询。最后，我们把字符串\
  \ `query` 作为参数传递进去。它将执行查询，命令行提示系统将等待用户输入数据。首先，你需要输入学号，然后是学生姓名。最后，数据将被插入并显示消息“1 row(s)\
  \ inserted.”。这条语句确认了过程已成功完成。然后，程序会询问用户输入另一条数据还是离开。如果你输入“y”，该过程将重新开始；如果你按“n”，程序将终止。\n\
  \n### 显示表数据\n\n```java\nimport java.sql.*;\n\nclass SelectionSample\n\n{\n\npublic\
  \ static void main(String args[])\n\n{\n\ntry  \n\nClass.forName(\"sun.jdbc.odbc.JdbcOdbcDriver\"\
  );\nConnection con = DriverManager.getConnection(\"jdbc:odbc:dsn1\",\"\",\"\");\
  \              \n              Statement st = con.createStatement();\n\nString qry\
  \ = \"Select * from student\";\n\nResultSet rs = st.executeQuery(qry);\n\nwhile(rs.next())\n\
  \n{\n\nSystem.out.println(rs.getInt(1) + \" \" + rs.getString(2));\n\n}\n\n} catch(Exception\
  \ e)\n\n{\n\nSystem.out.println(\"Exception : \" + e);\n\n}\n\n}\n\n}\n```\n\n这个程序将显示我们在第一个程序中创建的表数据。首先，我们使用\
  \ `getConnection()` 方法创建了一个连接对象。在下一行中，我们将创建表的查询语句存储在一个字符串变量中。然后，我们创建了一个 `Statement`\
  \ 对象来运行 SQL 查询。现在，我们需要为 `Resultset` 创建一个对象来存储数据。最后，我们把字符串 `query` 作为参数传递进去。它将执行查询并将数据存储到结果集对象中。然后，我们可以通过结果集方法读取这些数据。`getInt()`\
  \ 方法将显示整数数据，`getString()` 方法将显示结果对象中的字符串数据。`rs.next()` 方法将记录移动到下一条。这个过程将持续，直到结果集指针到达文件末尾。\n\
