  1. 点击 `File`（文件）\n2. 点击 `New`（新建）→ `Java Project`（Java 项目）\n\n![`lh3.googleusercontent.com/Uul4AHUr2ZURDElR9Y503X0iTSRDnAT0yK1j5R489G0kjKa8knxzkCrbXTZOkZPVBJ57VzYFAv2MCDPQ98GergtcUD9efhjBn8WoeWPLAZ9c-p1Jofiju6tB-mtiEMfP4v4Ia08`](img/Image00003.jpg)\n\
  \n3. 在“Project name:”（项目名称：）字段中输入项目名称\n4. 点击“Finish”（完成）\n5. 右键点击 `src` → `New`（新建）→\
  \ `Class`（类）\n\n![`lh3.googleusercontent.com/c1DJ75yt6_Bp0f-XdRKqu2Z7WY_Q3PbDSjkXq-iWmI-NTzRdaUrqLpIzKBx6nnvTPiwAR19HRF8giYlstqw8LeRR4uWDrdwXuXO-ZsPT9SR6but78QppV2bkSRK7N7IzPWjP-OE`](img/Image00004.jpg)\n\
  \n6. 在“Name”（名称）字段中填写任何包含字母的内容——不要使用特殊字符。例如：“ThisIsAClass”\n7. 点击“Finish”（完成）\n\n\
  你现在会看到一个显示如下：\n\n```\npublic class ThisIsAClass {\n\n}\n```\n\n恭喜，你已经成功创建了一个类！\n\
  \n## 第 3 章\n\n## Java 语言结构\n\n我们现在将以此作为示例。这现在可能还没有什么意义，但当我们学习继承和多态时，你会有更好的理解。\n\n\
  ```java\npublic class ThisIsAClass {\n    public static void main (String args[])\
  \ {\n        int x = 5;\n        System.out.println(\"The number is\" + x);\n  \
  \  }\n}\n```\n\n\n\n\n如上述示例代码所示，两个大括号被加粗，表示它们之间是相互通信的。它们之间编写的任何内容都是名为 `ThisIsAClass`\
  \ 的“部分”（Section）或“类”（Class）。示例使用了加粗和下划线的大括号来表示它们是父部分内部分的独立部分分隔符。父部分再次被视为一个类，而父部分内的部分被视为子部分、子类，或者用术语来说，就是方法（method）。\n\
  \n方法本质上是一个子类，它也有它自己的特殊元素，类似于类但更具体。它包含四个元素：作用域（`public/private/protected`）、返回类型、名称和参数。作用域、返回类型和参数将在我们学习方法、继承和多态时，你会对它们有更好的理解。\n\
  \n- `public`—作用域。\n- `static`—`main`方法的约定关键字。\n- `void`—返回类型。\n- `main`—方法名称（你可以将其命名为任何名称，但在这种情况下，`main`\
  \ 方法必须存在于每个 Java 程序中，因为它是 Java 程序的起点）。\n\n这个方法是一个特殊方法，因为它被命名为 `main`，因此它将是第一个被调用的方法。编译器始终在进程启动时寻找名为\
  \ `main` 的方法。`main` 方法必须具备以下属性：`public static void` 并在参数中具有 `String args[]` 参数。一个\
  \ Java 项目中只能有一个 `main` 方法。`main` 方法的想法是它将是第一个被调用的方法，因此你可以将其认为是调用其他方法和跳转到其他类的基地（你稍后将学习这意味着什么）。在本指南的剩余部分中，你的程序必须写在这个\
  \ `main` 方法中，因为它是编译器始终在寻找的特殊方法。\n\n该方法的的内容将在本指南稍后学习“变量”部分时一并介绍。目前，这个简短的解释应该足够你理解发生了什么了：\n\
  \n`int x = 5;`—正在声明一个变量（容器），它的类型是整数（整数字），它持有值 5。`=` 用于给变量赋值。\n\n`System.out.println`—这是每位初学者都会学的经典行；它唯一的作用就是向控制台打印一行文本。\n\
  \n示例：\n\n![`lh5.googleusercontent.com/AA6lne5cs1OdvpUFZFUsnu9yUJnYebbfC0hh35DeePNKK5_-3AtMUbEaHxLdkGDejvOkhrpqmQonmzZlKiSL73gH0npYpXQ0yCxwD_G3tsNZycTAzCRTSL9s-CM_-khNnDU5UxY`](img/Image00005.jpg)\n\
  \n控制台是程序输出所在的地方，以便程序员测试其程序。`System. out .println` 这一行包含括号和括号内的一个文本字符串。文本字符串必须用引号包围，以便程序知道它必须打印文本而不是像\
  \ `x` 这样的实际变量。用户不能直接说：`System. out .println(\"The number is: x\");` 的原因是程序并不知道 `x`\
  \ 是否是一个变量。程序将引号内的任何内容都视为一段文本，而不是持有值的容器。因此，`x` 必须在引号外面。\n\n但话又回来，你不能说 `System. out\
  \ .println(\"The number is: \" x);`，因为程序需要一个特定的关键字来知道这段文本和变量是两个需要合并或“拼接”在一起的实体。`+`\
  \ 符号用于显示文本字符串和变量 `x` 将连接在一起；这将允许程序输出“The number is: 5”（不带引号）。这就是为什么那行代码是：`System.\
  \ out .println(\"The number is: \" + x);`\n\n### 注释\n\n注释是编程语言中需要理解的最后一个基本概念。虽然不是必须的，但如果你忘记了程序是如何工作的，它对你以及周围的其他程序员来说大有帮助。\n\
  \n程序员利用这个概念作为机会使用普通英语来解释他们的代码。编译器始终忽略注释，因为它们不是实际代码。它们只是为了帮助人们理解编写了什么而写的说明。要写注释，你必须使用\
  \ `//` 或 `/* */`。\n\n`//` 符号用于单行注释。例如，如果你想解释某个变量将用于什么，你可以这样做：\n\n```java\nint x\
  \ = 5; //这个变量将用于找到总金额\n```\n\n```java\n编译器将忽略被注释的行，但会处理 `int x = 5`。然而，你不能对以下内容使用\
  \ `//` 符号：\n\n```java\nint x = 5; // this variable is going to be\nused to find\
  \ the total money\n```\n\n这是因为 `//` 符号只用于一行，而注释跨越了两行。你可以这样做：\n\n```java\nint x =\
  \ 5;\n//这个变量将用于找到总金额\n```\n\n只要注释是单行的，就没有问题。该符号之后该行上的任何内容都被视为注释。\n\n另一种技术与 `//`\
  \ 的作用相同，但它支持多行注释。你必须用 `/*` 开始注释并用 `*/` 结束。\n\n示例：\n\n```java\nint x = 5; /*这个变量将用于找到总金额\
  \ */\n```\n\n## 第 4 章\n\n## 变量\n\n### 什么是变量？\n\n变量本质上是一个持有特定类型数据的存储单元。它由程序员命名并用于标识数据。变量通常可以被访问或更改。\n\
  \n### 变量类型\n\n在 Java 中，变量有一个特定的类型，决定了它的大小和内存布局。Java 语言定义了三种变量。\n\n### 实例变量\n\n实例变量在类内部声明但在方法、构造函数或块之外访问。实例变量使用\
  \ `new` 关键字创建，并在对象销毁时销毁。实例变量对于声明它的类中的所有方法、构造函数和块都是可见的。通过给变量 `public` 关键字，它可以被子类访问。然而，尽可能将变量的访问修符设置为\
  \ `private`。所有实例变量都有默认值，而局部变量没有。\n\n示例：\n\n```java\npublic class Test\n{\n    public\
  \ int num; // 名为 num\n    public void dog()\n    {\n        num = 3;\n    }\n}\n\
  ```\n\n在这个示例中，我们在方法之外声明了整数 `num`，并在类中的任何方法中轻松访问它。\n\n### 类/静态变量\n\n静态变量在方法、构造函数或块之外声明，并使用\
  \ `static` 关键字声明。如果一个变量是静态的，无论调用多少个实例，该变量都只有一个实例。静态变量很少用于常量值，即不会改变的变量。\n\n示例：\n\n\
  ```java\npublic class Test\n{\n    public static final int num = 3; // 名为 num\n\
  \    public void dog()\n    {\n        System. out .println( num );\n    }\n}\n\
  ```\n\n在这个示例中，我们声明了一个名为 `num` 的 `int`，并将其设置为 `public`、`static` 和 `final`。这意味着它可以从子类内部进行访问，只能存在一个实例，且值永远无法更改。\n\
  \n### 局部变量\n\n局部变量仅在方法、块或构造函数内部声明。它们只在方法、块或构造函数创建时被创建，并在方法结束时立即被销毁。你只能在调用它的方法、块或构造函数内部访问局部变量；它们在调用处之外是不可见的。局部变量没有默认值。\n\
  \n示例：\n\n```java\npublic void cat(){ // 方法名为 cat\n```\n\n\n\n\n```java\nint x =\
  \ 0; // 值为 0 的 int\n\n}\n```\n\n在这个示例中，在 `cat` 方法内部调用了一个名为 `x` 的变量。该变量只存在于 `cat`\
  \ 方法的作用范围内，无法在该方法之外直接调用或访问。\n\n## 数据类型\n\n如上所述，变量用于存储数据。Java 有多种内置数据类型，用于存储预定义类型的数据。这些数据类型被称为基本数据类型（primitive\
  \ data types），是 Java 编程语言中最基础的数据类型。你也可以创建自己的数据类型，我们将在稍后介绍这一点。Java 有八种基本数据类型。\n\n\
  ### Byte\n\n`byte` 数据类型是 8 位带符号补码整数。它在声明时的默认值为 0，最大值为 127，最小值为 -128。当你想要节省内存空间时（特别是在大型数组中），`byte`\
  \ 是很有用的。\n\n例示例：\n\n```java\nbyte b = 1; // 值为 1\n```\n\n### Short\n\n`short` 数据类型是\
  \ 16 位带符号补码整数。它的最大范围是 32,767，最小值为 -32,768。`short` 用于节省内存或使代码更清晰。\n\n例示例：\n\n```java\n\
  short s = 1; // 值为 1\n```\n\n### Int\n\n`int` 数据类型是 32 位带符号补码整数。它的最大值为 2,147,483,647\
  \ (2³¹-1)，最小值为 -2,147,483,648 (-2³¹)。除非考虑内存问题，`int` 是整数类型最常用的数据类型。\n\n例示例：\n\n```java\n\
  int i = 1; // 值为 1\n```\n\n### Long\n\n`long` 数据类型是 64 位带符号补码整数。它的最大值为 9,223,372,036,854,775,807\
  \ (2⁶³-1)，最小值为 -9,223,372,036,854,775,808 (-2⁶³)。当需要比 `int` 能够表示更大的数字时，使用这种数据类型。\n\
  \n例示例：\n\n```java\nlong l = 1; // 值为 1\n```\n\n### Float\n\n浮点数据类型是双精度 64 位 IEEE\
  \ 754 浮点数。其最小和最大范围太大，在此不再讨论。在需要精度的情况下（例如处理货币时），永远不要使用 `float`。\n\n例示例：\n\n```java\n\
  float f = 1200.5f; // 值为一千二百点五\n```\n\n### Double\n\n`double` 点数据类型是双精度 64 位 IEEE\
  \ 754 浮点数。它通常是小数的首选数据类型。其最小和最大范围太大，在此不再讨论。在需要精度的情况下（例如处理货币时），永远不要使用 `float`。\n\n\
  例示例：\n\n```java\ndouble d = 1200.5d; // 值为一千二百点五\n```\n\n### Boolean\n\n`boolean`\
  \ 数据类型表示位数据。它可以包含两个值：true（真）或 false（假）。它用于简单的标记位，以跟踪真假条件。\n\n例示例：\n\n```java\nboolean\
  \ b = true; // 值为 true\n```\n\n### Char\n\n`char` 数据类型是单个 16 位 Unicode 字符。它的最小值为\
  \ `\\u0000`（或 0），最大值为 `\\uffff`（或 65,535，包含）。\n\n例示例：\n\n```java\nchar c = 'w';\
  \ // 返回字母 \"w\"\n```\n\n### String\n\n另一个常用的数据类型是 `String`。`String` 不是基本数据类型，但它是一种非常常用的数据类型，用于存储字符集或文本。\n\
  \n例示例：\n\n```java\nString cat = \"meow\"; // 将 cat 的设置为 \"meow\"\n```\n\n这个示例获取了一个名为\
  \ `cat` 的 `String`，并将其设置为拼出“meow”的字符字符串。\n\n## 声明变量\n\n变量的包含三部分：数据类型、变量名和存储的值。注意，命名变量有一套特定的约定和规则。变量名可以是任意长度的\
  \ Unicode 字母和数字，但必须以字母、美元符号 `$` 或下划线 `_` 开头，否则将返回语法错误。常见的命名约定是以小写字母开头，后续每个单词大写字母开头。例如，在名为\
  \ `theName` 的变量中，第一个单词 `the` 以小写字母开头，后续每个单词（在此例中为 `Name`）以大写字母开头。\n\n例示例：\n\n```java\n\
  int theName = 123; // 值为 123\n```\n\n在上面的示例中，数据类型是 `int`，变量名是 `theName`。存储在该变量中的值为\
  \ 123。你也可以声明一个不存储值的变量。\n\n例示例：\n\n```java\nint name; // 无值\n```\n\n如果你稍后声明，可以这样做。\n\
  \n## 使用变量\n\n变量声明后，你可以读取它的值或更改它。在变量初始声明后，你只能通过名称引用它；只有在声明变量时才需要声明数据类型。\n\n例示例：\n\
  \n```java\nname = 2; // 将 int \"name\" 设置为 2\n```\n\n上面的示例将 `name` 的值设置为 2。注意我没有再次说明数据类型。\n\
  \n例示例：\n\n```java\nSystem.out.println(name); // 将 name 的值打印到控制台\n```\n\n这个示例读取 `name`\
  \ 的值并将其写入控制台。\n\n变量也可以相加，例如。\n\n例示例：\n\n```java\nint a; // 无值\nint b = 1; // 值为\
  \ 1\nint c = 2; // 值为 2\na = b + c; // 将 a 设置为 b + c 的值\n```\n\n在上面的示例中，我们将 `a`\
  \ 的值设置为 `b` 和 `c` 的值之和。加号被称为运算符，我们将在接下来的章节中学习它。在一定程度上，也可以组合不同数据类型变量的值。\n\n例示例：\n\
  \n```java\nint a; // 无值\nfloat b = 1; // 值为 1\nint c = 2; // 值为 2\na = (int) (b\
  \ + c); // 将 int \"name\" 设置为 b + c 的值\n```\n\n这个示例与之前的示例完全相同，只是我们将 `b` 的数据类型从 `int`\
  \ 改为了 `float`。\n\n\n\n\n在上面的示例中，变量 `total` 获取两个变量 `x` 和 `y` 并将它们相乘，得到一个 20 的值。\n\
  \n### 除法\n\n`20/5 = 4`\n\n```java\nint x = 20;\nint y = 5;\nint total = 0;\ntotal=\
  \ x / y;\n```\n\n在上面的示例中，变量 `total` 获取两个变量 `x` 和 `y` 并将它们相除，得到一个 20 的值（注：原文此处逻辑可能有误，应为除法结果）。\n\
  \n### 取模运算\n\n`7 % 2 = 1`\n\n```java\nint x = 7;\nint y = 2;\nint total = 0;\ntotal\
  \ = x % y;\n```\n\n在上面的示例中，变量 `total` 获取两个变量 `x` 和 `y` 的余数，并计算 `2` 能够整除 `7` 几次，直到无法整除。在该过程之后，余数就是输出结果。例如：\n\
  \n`2` 能整除 `7` 几次？\n\n3 次。\n\n`2 * 3 = 6`\n`7 - 6 = 1`\n\n因此，`7 取 2` 等于 `1`，因为这就是余数。\n\
  \n### 后置自增\n\n`5 + 1 = 6`\n\n```java\nint x = 5;\nx++;\nint y = 0;\ny = x++;\n```\n\
  \n在上面的示例中，变量 `x` 增加了值 `1`。因此，`x` 的值现在必须是 `6`，因为当 `x = 5` 时 `x + 1 = 6`。如果你打印 `x`\
  \ 的值，输出将是 `6`。你可以再次执行 `x ++`，此时该值将变为 `7`。另一方面，`y` 的值仍然是 `6`，因为它是后置自增，这意味着 `x` 的值已经增加了\
  \ `1`（变为 `7`）；但在再次调用（`y = x ++`）之前，`y` 的值还没有改变，在这种情况下 `y` 将变为 `7`。\n\n### 前置自增\n\
  \n`5 + 1 = 6`\n\n```java\nint x = 5;\n++x;\nint y = 0;\ny = ++x;\n```\n\n在上面的示例中，变量\
  \ `x` 的增加方式与其作为单独变量进行后置自增时一样。另一方面，`y` 的值直接变为 `6`，因为它是前置自增。这意味着 `x` 的值增加了 `1`，且 `y`\
  \ 的值随之发生了改变，即 `y = 7`。\n\n### 后置自减\n\n`5 - 1 = 4`\n\n```java\nint x = 5;\nx--;\n\
  int y = 0;\ny = x--;\n```\n\n在上面的示例中，变量 `x` 减少了值 `1`。因此，`x` 的值现在必须是 `4`，因为 `x` 原本等于\
  \ `5`，`x - 1 = 4`。如果你打印 `x` 的值，输出将是 `4`。你可以再次执行 `x --`，此时该值将变为 `3`。另一方面，`y` 的值仍然是\
  \ `4`，因为它是后置自减，这意味着 `x` 的值已经减少了 `1`。`y` 的值在再次调用（`y = x --`）之前还没有改变，在这种情况下 `y` 将变为\
  \ `3`。\n\n### 前置自减\n\n`5 - 1 = 4`\n\n```java\nint x = 5;\n--x;\nint y = 0;\ny =\
  \ --x;\n```\n\n在上面的示例中，变量 `x` 减少了值 `1`。因此，`x` 的值现在必须是 `4`，因为 `x` 原本等于 `5`，`x - 1\
  \ = 4`。如果你打印 `x` 的值，输出将是 `4`。你可以再次执行 `--x`，该值将变为 `3`。另一方面，`y` 的值是 `3`，因为它是前置自减。这意味着\
  \ `x` 的值减少了 `1`，且 `y` 的值已经发生了改变。\n\n## 赋值运算符\n\n赋值运算符是在给变量赋值时使用的运算符，最常用的运算符是 (`=`)。以下是一些示例列表：\n\
  \n### 等号：=`\n\n```java\nint x = 5;\n```\n\n在这个示例中，如果你打印 `x`，值将是 `5`，因为你将变量 `x` 赋值为\
  \ `5`。\n\n### 加赋值运算符：`+=`\n\n```java\nint x = 5;\nx += 5;\n```\n\n在这个示例中，如果你打印 `x`，值将是\
  \ `10`，因为你正在 `x` 的值上加上 `5`。这条语句等同于 `x = x + 5` → `x += 5`。\n\n### 减赋值运算符：`-=`\n\n\
  ```java\nint x = 5;\nx -= 5;\n```\n\n在这个示例中，如果你打印 `x`，值将是 `0`，因为你正在从 `x` 的值中减去 `5`。\n\
  \n### 乘法赋值运算符：`*=`\n\n```java\nint x = 5;\nx *= 5;\n```\n\n在这个示例中，如果你打印 `x`，值将是\
  \ `25`，因为你正在将 `x` 的值乘以 `5`。\n\n### 除法赋值运算符：`/=`\n\n```java\nint x = 5;\nx /= 5;\n\
  ```\n\n在这个示例中，如果你打印 `x`，值将是 `1`，因为你正在将 `x` 的值除以 `5`。\n\n### 取模赋值运算符：`%=`\n\n```java\n\
  int x = 5;\nx %= 2;\n```\n\n在这个示例中，如果你打印 `x`，值将是 `1`，因为你正在对 `x` 的值取模。\n\n## 第 6\
  \ 章：用户输入：获取数据\n\n`Scanner` 对象允许我们获取输入。了解 `Scanner` 的工作方式，如下：\n\n```java\nimport\
  \ java.util.Scanner;\n\npublic class Main {\n    public static void main(String[]\
  \ args) {\n        Scanner scan = new Scanner(System.in);\n        System.out.println(\"\
  输入你的名字：\");\n        String name = scan.nextLine();\n        System.out.println(\"\
  你好, \" + name);\n        System.out.println(\"输入你的年龄：\");\n        int age = scan.nextInt();\n\
  \        System.out.println(\"你的年龄是 \" + age + \" 岁。\");\n    }\n}\n```\n\n这个程序具体做了什么？\n\
  \n它声明了两个整数等待用户输入。首先，它等待第一个数字，即用户输入数字并按回车。然后它等待第二个数字。最后，`sum` 变量将结果相加输出。\n\n### 替代方案：BufferedReader\
  \ 和 DataInputStream\n\n除了 `Scanner` 对象，我们还可以使用 `BufferedReader` 和 `DataInputStream`\
  \ 类方法在运行时读取不同类型的数据。在这些类中，我们有一组方法可以读取整数、字符、float、double、String 等。\n\n`BufferedReader`\
  \ 和 `DataInputStream` 类定义在 `java.io` 包中。如果你想使用这些类，你需要在程序中导入这些包。导入这些包后，你可以在任何地方使用这些类，但在调用这些方法之前你需要创建一个对象。\n\
  \n```java\nimport java.io.BufferedReader;\nimport java.io.InputStreamReader;\nimport\
  \ java.io.IOException;\n\npublic class Main {\n    public static void main(String[]\
  \ args) throws IOException {\n        BufferedReader br = new BufferedReader(new\
  \ InputStreamReader(System.in));\n        System.out.println(\"输入你的名字：\");\n   \
  \     String name = br.readLine();\n        System.out.println(\"你好, \" + name);\n\
  \        System.out.println(\"输入你的年龄：\");\n        int age = Integer.parseInt(br.readLine());\n\
  \        System.out.println(\"你的年龄是 \" + age + \" 岁。\");\n    }\n}\n```\n\n创建 `DataInputStream`\
  \ 和 `BufferedReader` 的对象\n\n```java\nBufferedReader br=new BufferedReader(new InputStreamReader(System.in));\n\
  String name=br.readLine(); // 这将在运行时读取字符串数据。\nint no=br.readLine(); /*这将抛出错误，因为你不能将字符串数据存储在整数变量中。你必须通过包装类将此数据转换为整数数据.*/\n\
  \n包装类：\n\n*   `Integer`\n*   `Float`\n*   `Double`\n*   `Byte`\n\n`Integer.parseInt(String\
  \ data)`\n\n将字符串数据转换为整数数据。\n\n`Float.parseFloat (String data)`\n\n将字符串数据转换为 float\
  \ 数据。\n\n\n\n\n`Double.parseDouble(String data)`\n\n将 `String data` 转换为 `double`\
  \ 类型数据。\n\n`Byte.parseByte(String data)`\n\n将 `String data` 转换为 `Byte` 类型数据。\n\n\
  `DataInputStream obj=new DataInputStream (System.in);`\n\n`String data=obj.readLine();`\
  \ // 读取字符串数据并存储在字符串变量中\n\n`int no=Integer.parseInt(data);` // 将字符串数据转换为 `Integer`\
  \ 类型数据。\n\n### BufferedReader 示例程序\n\n```java\nimport java.io.*;\n\nclass students\n\
  {\n    private int sno;\n    private String sname;\n    private int mark1,mark2,total;\n\
  \n    students() throws Exception\n    {\n        BufferedReader br = new BufferedReader(new\
  \ InputStreamReader(System.in));\n        System.out.print(\"Enter Student No :\
  \ \");\n        sno = Integer.parseInt(br.readLine());\n        System.out.print(\"\
  Enter Student Name : \");\n        sname = br.readLine();\n        System.out.print(\"\
  Enter mark1 and mark2 : \");\n        mark1 = Integer.parseInt(br.readLine());\n\
  \        mark2 = Integer.parseInt(br.readLine());\n    }\n\n    students(int no,String\
  \ name,int m1,int m2)\n    {\n        sno = no;\n        sname = name;\n       \
  \ mark1 = m1;\n        mark2 = m2;\n        total = mark1 + mark2;\n    }\n\n  \
  \  void putstud()\n    {\n        System.out.println(\"Sno : \" + sno);\n      \
  \  System.out.println(\"Sname : \" + sname);\n        System.out.println(\"Mark1\
  \ : \" + mark1);\n        System.out.println(\"Mark2 : \" + mark2);\n        System.out.println(\"\
  Total   : \" + total);\n    }\n\n    public static void main(String args[]) throws\
  \ Exception\n    {\n        students s1 = new students();\n        students s2 =\
  \ new students(100,\"Kirthika\",90,80);\n        s1.putstud();\n        s2.putstud();\n\
  \    }\n}\n```\n\n此示例程序演示了如何在运行时数据读取中使用 `BufferedReader`。在这里，我们创建了一个名为 `students`\
  \ 的新类，包含两个不同的构造函数。第一个构造函数是空构造函数，不任何参数。它将通过 `readLine()` 方法在运行时读取学生的详情，例如学生姓名和编号。该方法在调用时会读取字符串数据。因此，它首先读取数据，然后将其转换为整数数据存储在名为\
  \ `sno` 的整数变量中，接着另一个字符串数据将存储在 `sname` 变量中。在第二个构造函数中，我们将输入数据作为参数传递，并存储在 `sno` 和 `sname`\
  \ 变量中。在 `main` 方法中，我们为第一个和第二个对象创建实例；它们将分别执行这些构造函数。然后将调用 `putstud` 方法，最后打印 `sname`\
  \ 和 `sno` 数据。\n\n### DataInputStream 示例程序\n\n```java\nimport java.io.*;\n\nclass\
  \ Const1\n{\n    private int sno;\n    private String sname;\n\n    Const1()\n \
  \   {\n        System.out.println(\"Constructor Called\");\n        sno = 0;\n \
  \       sname = \"\";\n    }\n\n    void getdetails() throws IOException\n    {\n\
  \        DataInputStream br = new DataInputStream (System.in);\n        String line;\n\
  \        System.out.print(\"Enter Sno : \");\n        line = br.readLine();\n  \
  \      sno = Integer.parseInt(line);\n        System.out.print(\"Enter Sname : \"\
  );\n        sname = br.readLine();\n    }\n\n    void putdetails()\n    {\n    \
  \    System.out.println(\"Sno : \" + sno);\n        System.out.println(\"Sname :\
  \ \" + sname);\n    }\n\n    public static void main(String args[]) throws IOException\n\
  \    {\n        Const1 c1 = new Const1();\n        c1.putdetails();\n        c1.getdetails();\n\
  \        c1.putdetails();\n    }\n}\n```\n\n此示例解释了 `DataInputStream` 的用法。在这个示例中，我们使用\
  \ `readLine()` 方法读取数据。\n\n## 第 7 章：String 对象\n\n字符串在 Java 中非常常用。`String` 是字符序列，它不是基本数据类型而是一个对象。计算机读取字符串的方式是从\
  \ 0 到字符串的长度。\n\n### 字符串长度\n\n`length()` 函数返回字符串中的字符数量。例如：\n\n```java\nString text\
  \ = \"test\";\nint amount = text.length();\nSystem.out.println(amount);\n```\n\n\
  ### 字符串拼接\n\n有多种方法连接两个字符串，例如 `concat()` 方法，或者你可以使用 `+` 运算符。以下是各种示例：\n\n示例 1：\n```java\n\
  String text = \"Hello \";\nString text2 = \"World!\";\nSystem.out.println(text +\
  \ text2);\n```\n\n示例 2：\n```java\nString text = \"Hello \";\nString text2 = \"World!\"\
  ;\nSystem.out.println(text.concat(text2));\n```\n\n示例 3：\n```java\nString text =\
  \ \"Hello \";\nString text2 = \"World!\";\nSystem.out.println(text + \" fun \" +\
  \ text2);\n```\n\n示例 4:\n```java\nString text = \"Hello\";\nString text2 = \"World\"\
  ;\nSystem.out.println(text.concat(\" fun \").concat(text2));\n```\n\n### 字符串方法演示\n\
  \n### charAt(int index)\n\n`charAt()` 方法返回指定索引处的字符。\n\n```java\nString text = \"\
  Hello World!\";\nchar letter = text.charAt(0); // letter 为 H\n```\n\n### Equals(String\
  \ anyText)\n\n`equals()` 方法检查两个字符串是否相等。\n\n```java\nString text = \"Hello\";\nboolean\
  \ doesItEqual = text.equals(\"Hello\");\nSystem.out.println(doesItEqual); // 返回\
  \ true\n```\n\n### substring(int beginIndex)\n\n`substring()` 方法从指定的索引开始提取字符串的一部分。\n\
  \n```java\nString text = \"Hello World\";\nString justWorld = text.substring(6);\
  \ // 返回 World\n```\n\n### trim()\n\n`trim()` 方法删除字符串左侧或右侧的空格。\n\n```java\nString\
  \ text = \"  Hello World  \";\nString trimmedText = text.trim(); // trimmedText\
  \ 为 Hello World\n```\n\n\n\n\n\n`StringBuffer` 是一个同类类，提供了许多常用功能。`String` 代表固定长度的字符序列，而\
  \ `StringBuffer` 则表示长度可变的字符序列。`StringBuffer` 可以在中间插入字符和子字符串，也可以在末尾追加。编译器会自动创建一个\
  \ `StringBuffer` 来评估某些表达式，特别是在对字符串对象使用重载运算符 `+` 和 `+=` 时。\n\n### 构造函数\n\n我们有三种不同的构造函数来创建\
  \ `StringBuffer` 数据，每个构造函数在此处列出了其语法。\n\n* `StringBuffer sb = new StringBuffer ();`\n\
  \n这是一个空构造函数。它将创建一个 `StringBuffer` 对象，但其中没有任何任何内容。你可以通过简单地向字符串缓冲区对象进行赋值来提供这些数据。\n\
  \n* `StringBuffer sb = new StringBuffer(16);`\n\n这是一个参数化构造函数，只有一个参数：新创建的 `StringBuffer`\
  \ 的大小。例如，这将会创建一个容量为 16 个字符的新的 `StringBuffer` 对象。\n\n* `String s;`\n\n`StringBuffer\
  \ sb = new StringBuffer(s);`\n\n这是一个参数化构造函数，只有一个参数：字符串数据对象。例如，这将会创建一个 `StringBuffer`\
  \ 对象，然后获取 `String s` 的数据。\n\n## StringBuffer 方法\n\n* `length()`\n\n从此 `StringBuffer`\
  \ 创建一个字符串或将其转换为字符串。\n\n`length()` 的示例：\n\n```\nStringBuffer text = “test”;\nint\
  \ amount = text.length();\nSystem.out.println(“The amount of characters are: “ +\
  \ amount);\n```\n\n`StringBuffer` 对象中的 `.length()` 函数或属性返回 `String` 对象中字符的数量，并将该值赋值给整数\
  \ `amount`。此示例代码的输出将为 4，因为 “test” 长度为四个字符。\n\n* `capacity()`\n\n返回当前分配的空间数。\n\n\
  容量的示例：\n\n```\nStringBuffer s1=new StringBuffer(16);\nint capacity=s1.capacity();\n\
  System.out.println(“Capacity of the StringBuffer”+capacity);\n```\n\n`capacity()`\
  \ 方法将返回 `StringBuffer` 对象的容量。此示例代码将创建一个新的 `StringBuffer` 对象 `s1`，一旦我们调用 `capacity`\
  \ 方法，它将返回新 `StringBuffer` 对象 `s1` 的容量。结果将存储在整数变量 `capacity` 中。最后，我们通过 `println`\
  \ 方法打印 `s1` 的容量。\n\n`boolean ensureCapacity()` 使 `StringBuffer` 至少持有所需的空间数。\n\n\
  * `setLength()`\n\n截断或扩展之前的字符字符串，如果扩展，则用空值填充。\n\n`setLength` 的示例：\n\n```\nStringBuffer\
  \ s1=new StringBuffer();\ns1.setLength (25);\n```\n\n此 `setLength` 方法将调整 `StringBuffer`\
  \ 的大小。在这个示例中，我们正在使用 `setLength` 方法调整数据大小。\n\n* `charAt(int)`\n\n返回缓冲区该位置的字符。\n\n\
  `charAt` 的示例：\n\n```\nString text = “Hello World!”;\nchar letter = text.charAt(0);\n\
  ```\n\n`letter` 的值包含字母 “H”，因为输入的字符串索引为 0，它是字符串的第一个字母。计算机读取字符串的方式是从 0 到字符串的长度，而不是\
  \ 1。\n\n* `setCharAt(int,char)`\n\n修改该位置的值。\n\n`setCharAt` 的示例：\n\n```\nStringBuffer\
  \ sb = \"Hello\";\nsb.setCharAt(2,'w');          Hewlo;\n```\n\n在这个示例中，我们通过 “w”\
  \ 更改第二个索引的数据。\n\n* `getChars()`\n\n将字符复制到外部数组中。没有像字符串那样的 `getBytes()`。\n\n* `append()`\n\
  \n将参数转换为字符串并将其追加到当前缓冲区的末尾。\n\n`append` 的示例：\n\n```\nStringBuffer s1=new StringBuffer(25);\n\
  s1=”Hello”;\ns1.append(“AABBCC”);\n```\n\n在这个示例中，`append` 将 “AABBCC”文本添加到此 `s1`\
  \ `StringBuffer` 对象的末，因此最终结果为 “HELLOAABBCC.”\n\n* `insert()`\n\n将第二个参数转换为字符串并从偏移量开始插入到当前缓冲区。\n\
  \n`insert` 的示例：\n\n```\nStringBuffer s1=new StringBuffer(“Dwayne Johnson”);\ns1.insert(7,”\
  \ The Rock ”);\n```\n\n此示例代码将第二个参数的文本插入到 `StringBuffer` 对象的指定索引处，最终结果为 “Dwayne The\
  \ Rock Johnson.”\n\n* `reverse()`\n\n反转缓冲区中字符的顺序。\n\n`reverse` 的示例：\n\n```\nStringBuffer\
  \ s1=new StringBuffer(“Saravanan”);\nSystem.out.println(“Reverse string is:”+s1.reverse());\n\
  ```\n\n此示例以反转顺序转换字符串数据；最终结果为 “nanavaraS.”\n\n示例：\n\n```\nclass StringBufExample\n\
  {\n    public static void main(String args[])\n    {\n        StringBuffer sb =\
  \ new StringBuffer(\"Hello World\");\n        System.out.println(sb + \".capacity()\
  \ = \" + sb.capacity());\n        System.out.println(sb + \".length() = \" + sb.length());\n\
  \        System.out.println(sb + \".insert(5,aaa) = \" + sb.insert(5,\"aaa\"));\n\
  \        System.out.println(sb + \".capacity() = \" + sb.capacity());\n        System.out.println(sb\
  \ + \".length() = \" + sb.length());\n    }\n}\n```\n\n\n\n\n\n对于接下来的示例，我将使用 `if`\
  \ 语句。简单来说，`if` 语句用于检查某个条件是否为真或假。要创建一个 `if` 语句，你只需要写 `if` 单词并在后面跟两个圆括号。括号内包含检查某个条件是否为真的逻辑。`if`\
  \ 语句还可以包含 `else if` 语句和 `else` 语句。如果 `if` 语句返回假，则会执行 `else if` 语句。然而，它也包含一个必须返回真的自身的参数。当\
  \ `if` 语句返回假时，也会执行 `else` 语句。`else` 语句与 `else if` 语句的区别在于，`else` 语句的执行不需要任何参数为真即可即可运行。\n\
  \n### 示例\n```java\nint a = 10;\nint b = 20;\n\nif (a == b) {\n    System. out .println(\"\
  a is equal to b \");\n}\nelse if (a > b) {\n    System. out .println(\"a is greater\
  \ than b \");\n}\nelse {\n    System. out .println(\"a is not equal to b or greater\
  \ than b \");\n}\n```\n\n此示例中使用的操作符（`==` 和 `>`）在下文中解释。在接后的代码中，我们首先检查 `a` 是否等于 `b`。如果为，我们就打印\
  \ `a is equal to b` 并忽略代码的剩余部分。如果 `a` 不等于 `b`，则程序调用 `else if`。执行 `else` 是由于第一个 `if`\
  \ 返回了假。`else if` 的 `if` 部分检查它自身的参数，在本文情况下是检查 `a` 是否大于 `b`。如果 `a` 大于 `b`，那么程序就会打印\
  \ `a is greater than b`。然而，由于 `a` 小于 `b`，我们继续向下运行并简单地调用 `else`，它会在上述所有参数都返回假时运行时运行。它不需要要求自身的参数为真。\n\
  \n请注意，每个 `if` 语句后面可以跟无限数量的 `else if` 语句，但只能有一个 `else` 语句。同样注意，你不能在 `if` 语句和 `else`\
  \ 语句之间放置代码，因为代码将无法找到 `else`。此外，`else` 语句要求前面有一个 `if` 语句，因为为了调用 `else` 语句，紧接其前的 `if`\
  \ 语句必须等于假。同样重要的一点是，可以在另一个 `if` 语句**内部**包含一个 `if` 语句。这被称为**嵌套的 if 语句**。\n\n### 示例\n\
  ```java\nint a = 20;\nint b = 30;\n\nif (a == 20) {\n    if (a < b) {\n        System.\
  \ out .println(\"a is less than b and it is equal to 20\");\n    }\n}\n```\n\n在这个示例中，我们首先检查\
  \ `a` 的值是否等于 `b` 的值。如果是，我们检查 `a` 的值是否小于 `b` 的值。如果该语句也返回真，我们就可以在控制台上打印 `a is less\
  \ than b and it is equal to 20`。这可以适用于任意数量的 `if` 语句。如果非常有必要单独检查参数，或者你想在每次检查之间添加额外的逻辑，这将非常有用。在在本节结束时，你将完全理解\
  \ `if` 语句的工作方式。\n\n## 关系运算符\n\nJava 支持 6 种不同的关系运算符，它们用于比较变量的值。它们如下：\n\n### `==`\n\
  该操作符检查两个整数的值是否相等。如果它们相等，操作符返回 `true`。如果不相等，它则返回 `false`。\n\n### 示例\n```java\nint\
  \ a = 10;\nint b = 10;\n\nif (a == b) {\n    System. out .println(\"they are the\
  \ same\");\n}\n```\n这段代码检查 `a` 的值是否等于 `b` 的值。由于 `a` 的值等于 `b` 的值，括号内的值将为 `true`。这导致上面的代码打印出\
  \ `they are the same` 语句。\n\n### `!=`\n该操作符检查两个东西是否**不相等**。如果两个东西**不等于**相同的东西，它将返回\
  \ `true`。如果它们**等于**相同的东西，它将返回 `false`。\n\n### 示例\n```java\nint a = 10;\nint b =\
  \ 20;\n\nif (a != b) {\n    System. out .println(\"they are not the same\");\n}\n\
  ```\n这段代码将检查 `a` 是否等于 `b`。由于 `a` 不等于 `b`，程序将在控制台打印 `they are not the same`。\n\n\
  ### `>`\n该操作符检查某个东西是否大于另一个东西。如果前面的变量的值大于后面变量的值，它将返回 `true`。如果前面的变量的值小于后面变量的值，它将返回\
  \ `false`。\n\n### 示例\n```java\nint a = 10;\nint b = 20;\n\nif (a > b) {\n    System.\
  \ out .println(\"a is larger than b\");\n}\nelse {\n    System. out .println(\"\
  a is not larger than b\");\n}\n```\n（注：此处原文代码块未闭合，已按逻辑补齐）\n此示例检查 `a` 是否大于 `b`。由于\
  \ `a` 小于 `b`，执行 `else` 部分。\n\n### `<`\n该操作符检查某个东西是否小于另一个东西。如果前面的变量的值小于后面变量的值，它将返回\
  \ `true`。\n\n### 示例\n```java\nint a = 10;\nint b = 20;\n\nif (a < b) {\n    System.\
  \ out .println(\"a is less than b\");\n}\n```\n\n### `>=`\n该操作符检查某个东西是否大于等于另一个东西。如果前面的变量的值大于等于后面变量的值，它将返回\
  \ `true`。\n\n### 示例\n```java\nint a = 20;\nint b = 20;\n\nif (a >= b) {\n    System.\
  \ out .println(\"a is greater or equal\");\n}\n```\n\n### `<=`\n该操作符检查某个东西是否小于等于另一个东西。如果前面的变量的值小于等于后面变量的值，它将返回\
  \ `true`。\n\n### 示例\n```java\nint a = 20;\nint b = 20;\n\nif (a <= b) {\n    System.\
  \ out .println(\"a is less or equal\");\n}\n```\n\n## 逻辑运算符\n\nJava 支持三种逻辑运算符用于你的逻辑判断，它们通常与关系运算符结合使用。\n\
  \n### `&&`\n这被称为逻辑与（AND）操作符。如果该操作符前后的操作数都返回 `true`，则条件返回 `true`。如果两个操作数都为假，或者其中一个操作数为假，条件将返回\
  \ `false`。**所有**操作数都为真时，条件才会返回真。\n\n### 示例\n```java\nint a = 20;\nint b = 20;\n\n\
  if (a == 20 && a == b) {\n    System. out .println(\"a is equal to 20 and b \");\n\
  }\nelse {\n    System. out .println(\"a is not equal to 20 or a is not equal to\
  \ b\");\n}\n```\n在这个示例中，我们检查 `a` 是否等于 20 且 `a` 是否等于 `b`。这两个条件被称为操作数。由于 `a` 等于 20\
  \ 且等于 `b`，该语句返回真，我们打印 `a is equal to 20 and b`。\n\n### 示例 2\n```java\nint a = 20;\n\
  int b = 30;\n\nif (a == 20 && a == b) {\n    System. out .println(\"a is equal to\
  \ 20 and b\");\n}\nelse {\n    System. out .println(\"a is not equal to 20 or a\
  \ is not equal to b\");\n}\n```\n\n\n\n\n\n在下一个示例中，我们检查与第一个示例完全相同的内容。然而，这次的不同在于，我们将\
  \ `b` 的值从 20 改为了 30。这意味着当我们运行这段代码时，`if` 语句将返回 false，因为尽管 `a` 等于 20，但它并不等于 `b`。因此，我们打印\
  \ `a is not equal to 20 or a is not equal to b.`。注意，顺序并不重要。如果第一个操作数是 false 而第二个，我们将得到相同的结果。\n\
  \n### `||`\n\n该运算符被称为逻辑或（OR）。如果第一个操作数或第二个操作数为 true，该语句将返回 true。这意味着如果第一个操作数返回 false\
  \ 而第二个为 true，语句仍然将返回 true，反之亦然。如果两个操作数均为 true，该语句也会返回 true。从本质上说，当使用或运算符时，至少有一个操作数必须返回\
  \ true。\n\n### 示例：\n\n```java\nint a = 20;\nint b = 30;\n\nif (a == 20 || a == b)\
  \ {\n    System.out.println(\"a is equal to 20 or b\");\n}\nelse {\n    System.out.println(\"\
  a is not larger than b\");\n}\n```\n\n在这个示例中，我们检查 `a` 是否等于 20，或者 `a` 是否等于 `b`。在这种情况下，`a`\
  \ 等于 20 且不等于 `b`。由于这些操作数中只需要一个为 true，整个语句将返回 true，程序将在控制台中打印 `a is equal to 20 or\
  \ b`。\n\n### 示例 2：\n\n```java\nint a = 20;\nint b = 20;\n\nif (a == 20 || a == b)\
  \ {\n    System.out.println(\"a is equal to 20 and b \");\n}\nelse {\n    System.out.println(\"\
  a is not equal to 20 or b \");\n}\n```\n\n在这个示例中，我将上一个一个示例中 `b` 的值从 30 改为了 20。这意味着\
  \ `a` 等于 20 且 `a` 等于 `b`。两个操作数都返回 true，因此语句返回 true。这是因为或运算符要求一个或多个运算符为 true。此程序将在控制台中输出\
  \ `a is equal to 20 and b`。\n\n### `!`\n\n该运算符被称为逻辑非（NOT）。它用于反转其操作数的逻辑状态。该操作数可以与任何其他操作数配合使用以反转其输出。如果操作数返回\
  \ true，应用逻辑非运算符后，该操作数将返回 false。\n\n### 示例：\n\n```java\nint a = 21;\nint b = 20;\n\
  \nif ( (!(a == 20) && a > b) {\n    System.out.println(\"a is not equal to 20, and\
  \ a is greater than b\");\n}\nelse {\n    System.out.println(\"a is equal to 20,\
  \ and a is not greater than b \");\n}\n```\n\n在这个示例中，我们检查 `a` 的值是否不等于 20，并检查 `a`\
  \ 是否大于 `b`。由于 `a` 既不等于 20 又大于 `b`，我们向控制台打印 `a is not equal to 20, and a is greater\
  \ than b`。\n\n### 示例 2：\n\n```java\nint a = 21;\nint b = 20;\n\nif ( !(a == 20 &&\
  \ a > b) ) {\n    System.out.println(\"a is not equal to 20, and a is greater than\
  \ b \");\n}\nelse {\n    System.out.println(\"a is equal to 20, and a is not greater\
  \ than b \");\n}\n```\n\n在这个示例中，括号的位置发生了变化，使得逻辑非运算符扩展到两个操作数。现在，要使语句为真，`a` 必须不等于\
  \ 20 且 `a` 必须不大于 `b`。在这种情况下，语句将返回 false，因为 `a` 大于 `b`。由于操作数的原因，它需要小于 `b` 语句才能返回\
  \ true。因此，此程序将在控制台中返回 `a is equal to 20, and a is not greater than b`。\n\n## 组合运算符\n\
  \n在 Java 中，每个语句可以使用你所需的任意数量运算符。\n\n### 示例：\n\n```java\nint a = 21;\nint b = 20;\n\
  \nif ( (a == 20 && a > b) || (a != 20 && a < b)) {\n    System.out.println(\"correct\"\
  );\n}\nelse {\n    System.out.println(\"wrong\");\n}\n```\n\n通过这个示例，我们看到了如何实现更复杂的语句。在这里，我们应用了一个带有两个操作数的或运算符；然而，每个操作数也包含了一个与运算符。因此，要使此语句返回\
  \ true，`a` 必须等于 20 且大于 `b`，或者 `a` 不等于 20 且 `a` 必须小于 `b`。注意，我们使用括号是为了使代码更容易理解，并防止代码误读我们的逻辑。\n\
  \n### 示例 2：\n\n```java\nint a = 21;\nint b = 20;\n\nif ( a == 20 && (a > b || a\
  \ != 20) && a < b) {\n    System.out.println(\"correct\");\n}\nelse {\n    System.out.println(\"\
  wrong\");\n}\n```\n\n在上面的示例中，我们通过切换括号显著改变了逻辑。注意，我们使用括号是为了使代码更容易理解，并防止代码误读我们的逻辑。在，由于操作数的原因，它小于\
  \ `b`，它失败了语句并打印 `wrong`。\n\n## 赋值\n\n现在我们将通过另一个作业来确保我们理解运算符。我们有三个朋友 `tom`、`bob`\
  \ 和 `john`。我们将编写一个程序来输出谁更有钱。我们将每个的赋值给……\n\n\n\n\n\n```java\nSystem. out .println(\"\
  bob is just as rich as john, both are richer than tom\");\n}\n\nelse if (bob < tom)\
  \ {\n    System. out .println(\"bob is just as rich as john, both are more poor\
  \ than tom\");\n}\n\n}\n\n/*\n* 现在我检查最后可能的组合\n* 每个人拥有的金额都不同\n* 下面的 6 条语句涵盖了所有可能的结果\n\
  */\nelse if (tom > bob && bob > john) {\n    System. out .println(\"tom is richest,\
  \ followed by bob, followed by john\");\n}\nelse if (tom > john && john > bob) {\n\
  \    System. out .println(\"tom is richest, followed by john, followed by bob\"\
  );\n}\nelse if (bob > tom && tom > john) {\n    System. out .println(\"bob is richest,\
  \ followed by tom, followed by john\");\n}\nelse if (bob > john && john > tom) {\n\
  \    System. out .println(\"bob is richest, followed by john, followed by tom\"\
  );\n}\nelse if (john > bob && bob > tom) {\n    System. out .println(\"john is richest,\
  \ followed by bob, followed by tom\");\n}\nelse if (john > tom && tom > bob) {\n\
  \    System. out .println(\"john is richest, followed by tom, followed by bob\"\
  );\n}\n```\n\n在编写代码时，对所有的逻辑进行注释是非常重要的，这样没有写过代码的人也能轻松理解并编辑它。我建议你根据需要留下尽可能多的注释。我也鼓励你尝试找到更好的解决此问题的方法。也许你可以用四分之一的长度来编写这段代码；在编程中，答案永远只有一个。\n\
  \n## 第 9 章\n\n## 循环与数组\n\n### 循环\n\n在编程时，你可能会遇到需要循环大量数字的情况。如果我们使用目前所学的内容来循环一百个数字，我们需要一百个“if”语句。我认为你同意那样会变得非常混乱且令人沮丧。幸运的是，Java\
  \ 支持三种类型的循环，它们循环的方式略有不同。以下是对每种循环的简要解释。\n\n### While 循环\n\nwhile 循环是一种控制结构，允许你按照程序设置的次数重复任务。while\
  \ 循环的语法如下：\n\n```java\nwhile (expression) {\n    // 插入代码\n}\n```\n\n它的工作方式与 `if`\
  \ 语句类似，但只要 `expression` 为真，while 循环内的代码就会一直运行，直到表达式变为假（如果发生变化的话）。\n\n示例：\n\n```java\n\
  int x = 10;\nwhile (x > 0) {\n    System. out .println(x);\n    x--;\n}\n```\n\n\
  前面的代码将打印 `x` 的值，然后不断将其减 1，直到 `x` 的值不再大于零。如果你运行这段代码，你将得到从一到十每个数字的输出。一旦 `x` 的值达到零，它不再允许表达式返回真，此时\
  \ while 循环结束。注意，你应该警惕死循环。死循环是你代码中的错误，会导致循环永远不会结束，本质上使程序冻结。当你的逻辑中存在错误导致语句永远不会变为假时就会发生这种情况。\n\
  \n### Do While 循环\n\ndo while 循环的工作方式与 while 循环非常相似，但有一个主要区别：“do”——即在 while 语句为真时发生的操作——是在询问条件之前执行的。这意味着\
  \ do while 循环至少运行一次，因为它在检查条件之前执行了任务。第二次循环的执行完全取决于条件。\n\n示例：\n\n```java\nint x =\
  \ 10;\ndo {\n    System. out .println(x);\n    x--;\n}\nwhile(x > 0);\n```\n\n在这个示例中，while\
  \ 循环的最后逻辑直接转移到了 do while 循环中。正如你所看到的，唯一的区别是语句为真时运行的逻辑在 while 循环的上方而不是下方。对于这个特定的示例，代码的输出完全相同。但是，如果我们将代码改为如下：\n\
  \n```java\nint x = 0;\ndo {\n    System. out .println(x);\n    x--;\n}\nwhile(x\
  \ > 0);\n```\n\n输出将与 while 循环不同。如果这是一个 while 循环，循环内的代码将永远不会运行。然而在 do while 循环中，do\
  \ 发生在 while 之前，所以代码将至少运行一次。在第一次运行期间，在代码块被处理之前，它技术上从未被检查是否为真语句。这在特定情况下很有帮助，但它的使用不像普通的\
  \ while 循环那样频繁。\n\n### For 循环\n\nfor 循环允许你轻松地循环或递增特定范围的值。for 循环的语法如下：\n\n```java\n\
  for (initialization; termination; increment) {\n    // 语句\n}\n```\n\n- **初始化**：初始化计数器变量。\n\
  - **终止**：规定要判断为真的表达式。\n- **递增**：递增初始化的计数器变量。\n\n示例：\n\n```java\nfor (int x = 0;\
  \ x < 10; x++) {\n    System. out .println(x);\n}\n```\n\n在这个示例中，我们从初始化 for 循环开始。创建一个\
  \ `x` 的新 `int` 变量并将其设置为零。然后我们规定何时终止。我们只要 `x` 小于十，循环就会继续。然后我们设置递增使 `x` 的值增加一。初始化在循环开始时发生。\n\
  \n## 数组\n\n数组是存储相同类型数量变量的数据结构。与其为存储一百个不同值创建一百个不同的变量，你可以创建一个包含一百个值的整数数组。这使得管理整数变得容易得多，同时也让代码更加组织化简单。\n\
  \n### 声明数组\n\n声明数组与声明普通变量相似。语法如下：\n\n`dataType arrayName[]`\n\n上面的数组目前没有任何数据。我们声明了数组，但没有声明它的大小，也没有声明每个索引的值：\n\
  \n示例：\n\n`int intArray[] = new int[5];`\n\n上面的示例声明了一个具有五个槽位的整数数组。这意味着这个 `intArray`\
  \ 内部包含五个不同的整数。这些数字中的每一个都可以通过以下方式进行独立的编辑和访问：\n\n```java\nint intArray[] = new int[5];\n\
  intArray[0] = 2;\nintArray[1] = 3;\n// ...\nSystem. out .println(intArray[0]);\n\
  ```\n\n上面的代码声明了具有五个数据槽的 `intArray`。我们可以通过在数组旁方括号内添加 `int` 值来访问这些槽位。当我们执行 `intArray[0]`\
  \ 时，我们引用的是整数数组索引处的值。当我们声明具有五个值的数组时，我们也创建了 0 到 4 的五个槽位。\n\n### 多维数组\n\n通过为数组添加多个维度，数组还可以变得复杂得多。在上面的示例中，数组只有一个维度。通过添加更多维度，我们实际上是在数组中添加数组。这听起来可能复杂，但相对容易理解。\n\
  \n示例：\n\n```java\nint intArray[][] = new int[5][5];\n```\n\n\n\n\n以下数组包含两个维度。第一个\
  \ `5` 意味着我们声明的数组包含五个索引值。第二个数组意味着对于这五个索引值中的每一个，我们都可以在其内部访问另外五个索引值。例如，对于 `intArray[0]`\
  \ 的索引，我们又添加了五个可以访问的索引。如果我们将索引 0 视为一个普通的整数，那么我们本质上可以认为 `intArray[0]` 等于 `intSecondArray[5]`。这是因为在索引\
  \ 0 处的数组包含了五个索引。因此，由于 `intArray` 的每个索引都可以被视为一个独立的数组，我们拥有五个数组，每个数组都包含五个索引，总共有二十五个索引。\n\
  \n我们可以通过以下方式访问这些索引中的每一个：\n\n```java\nint[][] intArray = new int[5][5];\nintArray[0][0]\
  \ = 1;\nintArray[0][1] = 1;\nintArray[0][2] = 1;\nintArray[0][3] = 1;\nintArray[0][4]\
  \ = 1;\n// 以此类推\n```\n\n以下代码演示了如何为 `intArray[0]` 中的每个值赋值。如果你将其视为第一个数字，`intArray[0]`\
  \ 代表我们想要访问的哪个内部数组，这留下的第二个数字 `intArray[][0]` 就是每个内部数组的实际值。这可能是我们理解这一切的一种更简单的方法。\n\
  \n## 结合循环与数组\n\n在学习了循环和数组之后，你可能已经注意到将它们结合起来可以使你的程序产生更大的用和产出潜力。循环允许我们非常快速地为大范围的值赋值或检索值，而数组允许我们创建非常大范围的数字。将两者结合起来会有多方便呢？以下是每种类型循环的示例、如何快速遍历数组，以及如何轻松编辑多维数组。\n\
  \n### 示例 1:\n\n```java\nint intArray[] = new int[100];\nint x = 0;\nwhile (x < 100)\
  \ {\n    intArray[x] = x;\n    System.out.println(intArray[x]);\n    x++;\n}\n```\n\
  \n在这个示例中，我们简单地声明了一个包含一百个索引值的数组。然后我们声明了一个需要递增的 `int` 变量。我们告诉 `while` 循环，只要 `x` 小于\
  \ `intArray` 的长度（即它拥有的索引数量），就继续循环；然后在每次迭代后将 `x` 增加一。这段代码快速且轻松地编辑了一百个不同的值，并将它们打印到控制台。这一切只需要七行简单的代码就完成了！\n\
  \n### 示例 2:\n\n```java\nint intArray[] = new int[100];\nint x = 0;\ndo {\n    intArray[x]\
  \ = x;\n    System.out.println(intArray[x]);\n    x++;\n} while(x < 100);\n```\n\
  \n这个示例与第一个示例一样，不同之处在于我们将相同的概念应用了 `do while` 而不是 `while`。输出完全相同；但是，你应该对 `do while`\
  \ 循环保持提高，因为它们至少运行一次。\n\n### 示例 3:\n\n```java\nint intArray[] = new int[100];\nfor\
  \ (int x = 0; x < 100; x++) {\n    intArray[x] = x;\n    System.out.println(x);\n\
  }\n```\n\n这种方法可能是我最喜欢的处理方式。这种方法的优点是计数器变量构建在循环内部，所以你不需要声明另一个变量或手动递增它。在我看来，这要方便得多且有组织得多。\n\
  \n### 示例 4:\n\n```java\nint[][] intArray = new int[100][100];\nfor(int x = 0; x\
  \ < 100; x ++){\n    for(int y = 0; y < 100; y++){\n        intArray[x][y] = y;\n\
  \        System.out.println(intArray[x][y]);\n    }\n}\n```\n\n这个示例演示了遍历多维数组最实用的方法。它看起来可能很吓人，但实际上非常简单。我们有两个嵌套的\
  \ `for` 循环；每个循环都会遍历数组的一个特定维度。对于这个示例，第一次循环时，它将从 `x = 0` 开始。它将遍历每一个第一个索引为零的数组索引。一旦所有的\
  \ `[0][y]` 索引都被调用，`x` 就会增加一。然后它将重复这一过程，直到每一个索引都被调用为止。\n\n## 赋值\n\n循环对于编辑大量值用。得益于循环，可以极大简化的一个方面是图像编辑。一张图像可能由数百甚至数千个像素组成，每个像素都有自己的颜色值。通过循环的力量，我们可以快速编辑那些颜色值。对于这次作业，我们将反转一张你选择的图像的颜色。这个程序中有些部分你还没有在书中学过，我会尝试在这方面提供帮助。要编辑图像，我们首先需要创建一个文件对象缓冲图像对象。为了能够使用这些对象，我们需要导入它们。首先，在你的类顶部添加以下代码行：\n\
  \n```java\nimport java.awt.image.BufferedImage;\nimport java.io.File;\nimport java.io.IOException;\n\
  import javax.imageio.ImageIO;\n```\n\n之后，我们需要一张要编辑的图像。获取任何你选择的图像，并将其拖入项目的主包文件夹以添加到包中。确保不要意外地将其添加到\
  \ `src` 文件夹或任何其他文件夹。接下来，你将使用以下两行开始代码：\n\n```java\nFile file = new File(\"image.jpg\"\
  );\nBufferedImage image = ImageIO.read(file);\n```\n\n\n\n\nreturnType: 方法将返回的数据类型。如果设置为\
  \ `void`，则不返回任何内容。\n\nmethodName: 方法名称。语法与变量相同，但它以大写字母开头。\n\n## 方法类型\n\n在 Java 中有两种类型的方法：静态方法（Static）和非静态方法（Non-Static）。静态方法以关键字\
  \ `static` 开头。调用此类方法不需要任何类对象；然而，所有的非静态方法都需要类对象来调用。\n\n### 静态方法的语法\n\n```java\nstatic\
  \ return-type method_name (parameters)\n\n{\n\n…\n\n…\n\n}\n```\n\n### 非静态方法的语法\n\
  \n```java\nreturn_type method_name (parameters)\n\n{\n\n…\n\n…\n}\n```\n\n## 参数\n\
  \n参数是可以在调用方法时传递给方法并使用的变量。方法也可以不接受参数。\n\n### 示例 1:\n\n```java\npublic static void\
  \ main(String[] args){\nint x = 0;\nx = SampleMethod (x);\n}\n\npublic static int\
  \ SampleMethod (int x) {\nreturn x + 1;\n}\n```\n\n在这里，我们创建了一个类型为 `int` 且名为 `SampleMethod`\
  \ 的方法，它接受一个 `int` 数据类型的参数。我们还声明该方法是 `public` 的，这意味着该方法可以从子类访问。我们将其设置为 `static`，这意味着该方法同时只有一个实例在运行。在\
  \ `main` 方法中，我们声明了一个 `int` 变量 `x`。然后我们将 `x` 的值设置为 `SampleMethod(x)`。由于 `sample method`\
  \ 的返回类型为 `int`，因此每当调用该方法时，它**总是**会返回一个 `int` 值。我们给了它 `x` 的值，方法在该值的基础上加 1 并返回。因此，`x`\
  \ 现在的值为 1。\n\n### 示例 2:\n\n```java\npublic static void main (String args args) {\n\
  double a = 3;\ndouble b = 6;\nAverage (a,b);\n}\n\npublic static void Average(double\
  \ x, double y){\nSystem. out .println(\"the average is \" + (x+y)/2);\n}\n```\n\n\
  上面的示例方法数据类型为 `void`。这意味着该方法不会返回任何值。如果你只需要方法执行特定的功能而不需要为它赋值，这就是很好。在上面的示例中，我们创建了一个计算两个数字平均值的方法。该方法仅执行计算平均值的函数并将其打印到控制台上。它永远不会返回任何值。\n\
  \n### 示例 3:\n\n```java\npublic static int a = 1;\npublic static int b = 2;\npublic\
  \ static void main(String[] args) throws IOException {\nSum ();\n}\n\npublic static\
  \ void Sum(){\nSystem. out .println(\"sum is\" + ( a + b ));\n}\n```\n\n在这个示例中，我们创建了一个名为\
  \ `Sum()` 的方法，它不接受任何参数。当方法不接受参数时，使用空括号进行调用，但无论如何括号都必须存在。这还展示了你如何在类中的任何方法中使用该类的 `public`\
  \ 变量。该变量不需要作为参数中的参数即可使用。我们将整数 `a` 和 `b` 设置为 `static`。这是因为只有静态变量才能在静态方法中使用。\n\n##\
  \ 方法重载\n\n方法重载意味着你的程序包含多个具有相同名称但参数和返回类型不同的方法。\n\n### 示例:\n\n```java\npublic static\
  \ void main (String args[]) throws IOException\n{\nint a = 1;\nint b = 2;\ndouble\
  \ c = 3;\ndouble d = 4;\nSystem. out .println( Sum (a,b));\nSystem. out .println(\
  \ Sum (c,d));\n}\n\npublic static int Sum(int x , int y){\nreturn x+y;\n}\n\npublic\
  \ static int Sum(double x , double y)\n{\nreturn (int) (x+y);\n}\n```\n\n在上面的示例中，我们创建了两个同名的方法，接受两个不同类型的参数。与变量不同，你可以给两个方法命名相同的名称，因为\
  \ Java 可以根据参数和返回类型区分这些方法。如果你运行上面的代码，你会发现两个方法都能正常工作。一个处理 `double` 值的和，另一个处理 `int`\
  \ 值。\n\n## 赋值\n\n创建一个更高级的计算器。包含三个值。第一个值告诉你要执行哪种操作（例如，如果 `a == 1`，则相加；如果 `a == 2`，则相减）。另外两个值将用于操作。让计算器支持加法、减法、除法和乘法，并为每个操作提供一个独立的方法。\n\
  \n```java\n// 主方法\npublic static void main(String args[])\n{\n// 选择操作的整数\nint action\
  \ = 4;\n// 需要进行操作的变量\ndouble x = 4.5;\ndouble y = 3;\n/*\n* 根据 action 的值决定我们对\n\
  * 两个变量做什么。每个 action 都在自己的方法中执行，\n* 如果 action 无效，我们打印无效操作，因为\n* 对这些值无事可做。\n*/\nif\
  \ (action == 1) {\nSystem. out .println(\"The sum is \" + Addition (x,y));\n}\n\
  else if (action == 2) {\nSystem. out .println(\"The difference is \" + Subtraction\
  \ (x,y));\n}\nelse if (action == 3) {\nSystem. out .println(\"The product is \"\
  \ + Multiply (x,y));\n}\nelse if (action == 4) {\nSystem. out .println(\"The answer\
  \ is \" + Divide (x,y));\n}\nelse {\nSystem. out .println(\"Invalid operation\"\
  );\n}\n\n// 加法方法\npublic static double Addition (double x, double y) {\nreturn x+y;\
  \ // 返回 a 和 b 之和\n}\n\n// 减法方法\npublic static double Subtraction (double x, double\
  \ y) {\nreturn x-y; // 返回 a 和 b 之差\n}\n\n// 乘法方法\npublic static double Multiply\
  \ (double x, double y) {\nreturn x*y; // 返回 a 和 b 之积\n}\n\n// 除法方法\npublic static\
  \ double Divide (double x, double y) {\nreturn x/y; // a 除以 b\n}\n```\n\n到此，上面的代码应该是是不言自明的。也许可以添加一个数组而不是两个变量来玩玩。\n\
  \n\n\n\n\n```java\npublic static void main(String[] args)\n{\n    new Fruit();\n\
  }\n}\n```\n\n这本身并没有什么用。我们创建了对象，但在将其赋值给变量之前，我们无法使用它。`Classes` 可以充当变量数据类型，而对象就是它们的值。\n\
  \n```java\nclass Fruit\n{\n    public String name;\n    public int timeSincePicked;\n\
  \n    public static void main(String[] args)\n    {\n        Fruit objectOfFruit\
  \ = new Fruit();\n    }\n}\n```\n\n现在，我们可以访问 `objectOfFruit` 对象内部的变量了。要访问这些变量，我们只需要编写对象名、一个点（`.`）以及变量名即可。方法也可以放在类中，并访问它们所属对象中的变量。记住，对象中的变量可以有不同的值。不过，请注意编写代码的位置，因为你只能在方法内部编写代码。`Classes`\
  \ 直接包含变量、`methods` 和其他 `classes`。\n\n```java\nclass Fruit\n{\n    public String\
  \ name;\n    public int timeSincePicked;\n\n    public static void main(String[]\
  \ args)\n    {\n        Fruit newPear = new Fruit();\n        newPear.name = “Pear”;\n\
  \        newPear.timeSincePicked = 24894;\n        newPear.checkIfRotten(); // 输出：“This\
  \ Pear is not rotten.”\n\n        Fruit oldPear = new Fruit();\n        oldPear.name\
  \ = “Pear”;\n        oldPear.timeSincePicked = 3659246;\n        oldPear.checkIfRotten();\
  \ // 输出：“This Pear is rotten!”\n    }\n\n    public void checkIfRotten()\n    {\n\
  \        if(timeSincePicked > 100000)\n        {\n            System.out.println(“This\
  \ “ + name + ” is rotten!”);\n        }\n        else\n        {\n            System.out.println(“This\
  \ “ + name + ” is not rotten.”);\n        }\n    }\n}\n```\n\n`Classes` 可以获得另一个类的属性并在此基础上进行构建。这被称为\
  \ `inheritance`（继承）。“扩展”另一个 `class` 的 `Classes` 将拥有被扩展 `class` 的所有变量和 `methods`。正在扩展的\
  \ `class` 称为 `child`（子类），而被扩展的 `class` 称为 `parent`（父类）。要进行扩展，在 `class` 名称后输入 `extends`\
  \ 以及父 `class` 的名称。\n\n```java\nclass Food\n{\n    public String name;\n}\n\n// Fruit\
  \ 是子类，Food 是父类\nclass Fruit extends Food\n{\n    public boolean isRotten;\n    //\
  \ 可以同时访问 name 和 isRotten\n}\n```\n\n这导致了 `polymorphism`（多态）。这意味着一个 `child class`\
  \ 可以作为 `parent class` 对象的值。这被称为 `upcasting`（向上转型）。这里是部分代码来解释这一概念：\n\n```java\nclass\
  \ Food {\n    public String name;\n    public static void main(String[] args)\n\
  \    {\n        Food pear = new Fruit();\n        pear.name = “pear”;\n        //\
  \ pear.isRotten = true; // 这行不通，因为 pear 在技术上是 Food 类型，没有 isRotten 变量\n    }\n}\n\
  \nclass Fruit extends Food {\n    public boolean isRotten;\n    // 可以同时访问 name 和\
  \ isRotten\n}\n```\n\n`Casting` 或 `downcasting`（向下转型）可以将对象转换为另一种类型，以便访问该类型的变量。这有特定的规则，即对象不能被转换为它并不所属的类型。例如，如果\
  \ `Fruit` 和 `Meat` 都扩展自 `Food`，而 `Pear` 扩展自 `Fruit`，并且你有一个类型为 `Fruit` 且已向上转型为 `Food`\
  \ 类型的对象，它不能被转换为 `Meat` 类型。这是因为原始对象并不是该类型。同样，该对象不能被转换为 `Pear` 类型，因为它在之前不是该类型。`Casting`\
  \ 的实现方法是，在想要转换的对象之前的括号中放入你想要转换的 `class` 即可。\n\n```java\nclass Food{}\nclass Fruit\
  \ extends Food{ public int variable; }\nclass Meat extends Food{}\nclass Pear extends\
  \ Fruit{}\nclass Main\n{\n    public static void main(String[] args)\n    {\n  \
  \      Food genericFood = new Fruit();\n        Fruit fruit = (Fruit)food;\n   \
  \     fruit.variable = 1; // 能够访问转换后对象的变量\n        // Meat meatIsntFruit = (Meat)genericFood;\
  \ // 不工作，因为 fruit 不是 meat\n        // Pear fruitIsntPear = (Pear)genericFood; //\
  \ 不工作，因为 fruit 不够具体，无法作为 pear\n    }\n}\n```\n\n`Access modifiers`（访问修饰符）几乎自言自义：它们修改了谁可以访问它们。`Access\
  \ modifiers` 可以放在变量、`methods` 和 `classes` 上。它们始终位于变量的数据类型、`method` 的返回类型或 `class`\
  \ 关键字之前。有三种访问修饰符：\n\n- `Public`: 任何地方都可以访问它。\n- `Protected`: 只有类本身及其子类可以访问它。\n-\
  \ `Private`: 只有类本身可以访问它。\n\n如果你省略了访问修饰符，它将默认为无修饰符，这与 public 基本相似。`Access modifiers`\
  \ 本质上防止了其他程序员破坏你 `class` 内部的流程。放置 `access modifiers` 的要求很少——你可以将几乎所有内容都设为 public，你的代码也能正常运行。\n\
  \n\n\n\n\n```java\nname = nameParam; // 我们可以设置正在实例化的类的私有变量，因为我们在类内部。\n\n}\n\npublic\
  \ void saySomething()\n\n{\n\n    System.out.println(“This is a ” + name);\n\n}\n\
  \npublic static void main(String[] args)\n\n{\n\n    Fruit f = new Fruit(“pear”);\n\
  \    f.saySomething(); // “This is a pear”\n}\n\n}\n```\n\n构造函数也可以重载，这意味着只要参数类型的顺序或数量不同，你就可以拥有多个相同的方法。\n\
  \n```java\nclass Fruit\n{\n    public String name;\n\n    public Fruit()\n    {\n\
  \        name = “Generic fruit”;\n    }\n\n    public Fruit(String nameParam)\n\
  \    {\n        name = nameParam;\n    }\n\n    public static void main(String[]\
  \ args)\n\n    {\n\n        Fruit f1 = new Fruit();//name is “Generic fruit”\n \
  \       Fruit f2 = new Fruit(“pear”);//name is “pear”\n    }\n\n}\n```\n\n`this`\
  \ 关键字在构造函数中特别有用。它允许程序员在引用类变量的同时，忽略给定方法中的局部变量。这使得为构造函数的参数与类中的变量提供相同的名称成为可能。在使用时，只需将其视为任何对象即可。\n\
  \n```java\npublic class Example\n{\n    public int aNumber;\n\n    public Example(int\
  \ aNumber)\n    {\n        this.aNumber = aNumber;\n        //this.aNumber 指的是类中的变量，而\
  \ aNumber 指的是构造函数的参数\n    }\n\n}\n```\n\n有一种特殊的类类型被称为“匿名内部类”。这意味着它没有名称，因此被称为“匿名”。它也意味着它只能存在一次（除非你复制了两次代码）。匿名内部类的用途有限，但如果你在某些情况下只需要某个特定的类一次，你可以创建一个，而不是必须创建一个文件并将其定义为类类。匿名内部类植根于继承，最常用于处理接口和抽象类时，但我们很快就会深入讨论这一点。匿名内部类类似于对象的实例化。首先输入\
  \ `new`，后面跟上你希望你的匿名内部类继承的类名，然后是你的参数，最后是一个代码块。这可以重写或创建来自父类的方法，并可以创建变量。最后，用分号结束。不过要小心，该代码块不能创建构造函数，也不能创建供匿名内部类外部使用的方法。\n\
  \n```java\nclass Food\n{\n    public void eat()\n    {\n        System.out.println(“Mmmmm”);\n\
  \    }\n\n    public static void main(String[] args)\n\n    {\n\n        Food specialFood\
  \ = new Food(){\n            public void eat()\n            {\n                System.out.println(“Yuck!\
  \ This food is rotten!”);\n            }\n        };\n\n        specialFood.eat();//\
  \ “Yuck! This food is rotten!”\n    }\n\n}\n```\n\n匿名内部类的常用用途是处理输入监听器。与其为每种类型的监听器——键盘监听器、鼠标监听器、鼠标轮监听器等创建类，创建匿名内部类可能更容易。这很大程度上取决于你如何使用。\n\
  \n## 第 12 章\n\n## Java 中的接口和抽象类\n\n还有一些特殊的类类型，特别是接口和抽象类。\n\n抽象类是不能实例化的类——你不能创建抽象类的对象。然而，你可以创建抽象类子类的对象。当你希望一组类拥有一组共同的变量或方法，但不希望有一个未指定的对象时，这非常有用。抽象类需要使用向上转型和向下转型。抽象类通过在类关键字之前使用\
  \ `abstract` 关键字来定义。在此基础上，抽象类可以包含抽象方法。这意味着你可以在抽象类型中调用方法，它将运行子类的方法。抽象方法必须包含在抽象类内部，并通过在方法的返回类型之前放置\
  \ `abstract` 关键字来定义。抽象方法也没有方法体；它们在在参数后直接以分号结束。当子类继承自父抽象类时，它必须重写或定义抽象方法。抽象类也可以包含普通方法以添加共同功能，就像普通类一样。\n\
  \n```java\nabstract class Food\n{\n    public abstract void saySomething();\n\n\
  \    public static void main (String args[])\n\n    {\n\n        Food a = new Fruit();\n\
  \        Food b = new Meat();\n        a.saySomething();//”This fruit is delicious!”\n\
  \        b.saySomething();//”This meat is delicious!” even    }\n\n}\n\nclass Fruit\
  \ extends Food\n{\n    public void saySomething()\n    {\n        System.out.println(“This\
  \ fruit is delicious!”);\n    }\n}\n\nclass Meat extends Food\n{\n    public void\
  \ saySomething()\n    {\n        System.out.println(“This meat is delicious!”);\n\
  \    }\n}\n```\n\n接口与抽象类的相似之处在于它们可以提供必须重写的方法，且它们不能是对象。接口中不能包含变量。接口不能被“扩展”（extend），而是被“实现”（implement）。区别在于，虽然扩展只能针对一个类进行——这意味着你只能有一个父类——但实现可以针对多个接口进行，而不是类。当你需要若干不相关的类共享共同方法时，可以使用接口。要创建一个接口，只需创建一个类，但将\
  \ `class` 关键字替换为 `interface` 关键字。在内部，你只能有方法声明。\n\n```java\nabstract class Food\n\
  {\n    public abstract void saySomething();\n\n    public static void main (String\
  \ args[])\n\n    {\n\n        Food a = new Fruit();\n        Food b = new Meat();\n\
  \        a.saySomething();//”This fruit is delicious!”\n        b.saySomething();//”This\
  \ meat is delicious!” even    }    }\n\n}\n\nclass Fruit extends Food\n{\n    public\
  \ void saySomething()\n    {\n        System.out.println(“This fruit is delicious!”);\n\
  \    }\n}\n\nclass Meat extends Food\n{\n    public void saySomething()\n    {\n\
  \        System.out.println(“This meat is delicious!”);\n    }\n}\n```\n*(注：由于原文文本在此处出现了重复的代码块和逻辑混乱，翻译已根据上下文逻辑进行了对齐，保持了格式一致性)*\n\
