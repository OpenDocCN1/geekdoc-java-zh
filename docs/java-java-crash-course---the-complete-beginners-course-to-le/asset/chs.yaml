  \ `ArrayList` 中剩余的朋友编号。\n\n## 第 5 题\n\n## 题目 J5：分配伙伴\n\n### 题目描述\nCEMC 正在举办一个研讨会，其中一项活动涉及学生分组。他们决定提前分配伙伴。你需要判断他们的分配方式是否具有一致性。也就是说，每当\
  \ `A` 是 `B` 的伙伴时，`B` 也必须是 `A` 的伙伴，并且没有人会成为自己的伙伴。\n\n### 输入规范\n输入包含三行。第一行是一个整数 `N`\
  \ (``1 < N ≤ 30`)，表示班级学生人数。第二行包含 `N` 个学生的名字，用单个空格分隔。（名字仅包含大写或小写字母，且没有两个学生的名字相同）。第三行包含相同的\
  \ `N` 个名字，但顺序不同，用单个空格分隔。最后两行中名字的位置指示了伙伴的分配：第二行的第 `ith` 个名字是第三行第 `ith` 个名字的分配伙伴。\n\
  \n### 输出规范\n如果两个名字列表的安排一致，则输出 `good`；如果伙伴安排不一致，则输出 `bad`。\n\n### 输入 1\n```text\n\
  4\nAda Alan Grace\nJohn John Grace Alan Ada\n```\n\n### 示例 1 输出\n```\ngood\n```\n\
  \n### 示例 1 输出\nAda 和 John 是伙伴，Alan 和 Grace 是伙伴。这种安排是一致的。\n\n### 示例输入 2\n```text\n\
  7\nRich Graeme Michelle Sandy Vlado Ron Jacob\nRon Vlado Sandy Michelle Rich Graeme\
  \ Jacob\n```\n\n### 示例 2 输出\n```\nbad\n```\n\n### 示例 2 输出\nGraeme 与 Vlado 是伙伴，但\
  \ Vlado 与 Rich 是伙伴。这不一致。此外，因为 Jacob 是了自己的伙伴，这也是不一致的。\n\n## 第 5 题解\n\n```java\nimport\
  \ java.util.Scanner;\nimport java.util.StringTokenizer;\n\npublic class J5 {\n \
  \   Scanner scan = new Scanner(System.in);\n    byte n;\n\n    public J5() {\n \
  \       n = Byte.parseByte(scan.nextLine());\n        String[] partner1 = new String[n];\n\
  \        String[] partner2 = new String[n];\n        assignPartners(partner1, partner2);\n\
  \        if (checkForSelfPartner(partner1, partner2) || checkForMultiUsage(partner1,\
  \ partner2) || checkPartnersMatch(partner1, partner2)) {\n            System.out.println(\"\
  bad\");\n        } else {\n            System.out.println(\"good\");\n        }\n\
  \    }\n\n    public void assignPartners(String[] partner1, String[] partner2) {\n\
  \        StringTokenizer partner1Names = new StringTokenizer(scan.nextLine());\n\
  \        StringTokenizer partner2Names = new StringTokenizer(scan.nextLine());\n\
  \        for (byte i = 0; i < n; i++) {\n            partner1[i] = partner1Names.nextToken();\n\
  \            partner2[i] = partner2Names.nextToken();\n        }\n    }\n\n    public\
  \ boolean checkForSelfPartner(String[] partner1, String[] partner2) {\n        for\
  \ (byte i = 0; i < partner1.length; i++) {\n            if (partner1[i].equals(partner2[i]))\
  \ {\n                return true;\n            }\n        }\n        return false;\n\
  \    }\n\n    public boolean checkForMultiUsage(String[] partner1, String[] partner2)\
  \ {\n        for (byte name = 0; name < partner1.length; name++) {\n           \
  \ byte usages = 0;\n            for (byte i = 0; i < partner1.length; i++) {\n \
  \               if (partner1[name].equals(partner1[i])) {\n                    usages++;\n\
  \                }\n                if (usages > 1) {\n                    return\
  \ true;\n                }\n            }\n        }\n        for (byte name = 0;\
  \ name < partner2.length; name++) {\n            byte usages = 0;\n            for\
  \ (byte i = 0; i < partner2.length; i++) {\n                if (partner2[name].equals(partner2[i]))\
  \ {\n                    usages++;\n                }\n                if (usages\
  \ > 1) {\n                    return true;\n                }\n            }\n \
  \       }\n        return false;\n    }\n\n    public boolean checkPartnersMatch(String[]\
  \ partners1, String[] partners2) {\n        for (byte pair = 0; pair < partners1.length;\
  \ pair++) {\n            String p1 = partners1[pair];\n            String p2 = partners2[pair];\n\
  \            boolean foundPair = false;\n            for (byte i = 0; i < partners1.length\
  \ && !foundPair; i++) {\n                if (p2.equals(partners1[i])) {\n      \
  \              if (p1.equals(partners2[i])) {\n                        foundPair\
  \ = true;\n                    } else {\n                        return true;\n\
  \                    }\n                }\n            }\n        }\n        return\
  \ false;\n    }\n\n    public static void main(String[] args) {\n        new J5();\n\
  \    }\n}\n```\n\n好的，这里有很多要做做的！首先，我们通过静态方法实例化 `J5` 让全局变量可以使用。接下来，在构造函数中，我们使用了 `Scanner`\
  \ 并设置了 `n`，即学生人数。在我们调用 `assignPartners` 方法后，我们使用 `StringTokenizer` 填充了两个数组。基本上这个类的作用是分割字符串，我们调用\
  \ `nextToken()` 获取下一个元素。所以，我们做了三次检查。首先有一个名为 `checkForSelfPartner` 的方法，它返回一个布尔值；如果有自我伙伴的情况，该方法将返回\
  \ true。我们检查这种情况的方法是通过遍历数组并检查 `partner1[i]` 是否等于 `partner2[i]`。如果是，返回 true，这意味着有人成了自己的伙伴，这使得整个测试用例为“bad”。如果循环结束没有返回\
  \ true，说明没有没有时候伙伴相等。\n\n接下来，我们有 `checkForMultiUsage` 方法，它同样返回一个布尔值，所以如果一个学生名字被使用多次，它将返回\
  \ true。我们有两个主循环，它们是彼此的副本，除了一个针对 `partner1` 数组，另一个针对 `partner2` 数组。这些循环遍历整个数组。我们在内部还有另一个循环，它遍历我们选定名字之后的数组。这样做是为了减少迭代次数，因为如果重复，我们的名字循环会找到重复项的第一次出现，然后这个内部循环会在数组的剩余部分查找该元素的任何其他出现。所以在这个内部循环中，我们简单地检查所选的名字是否等于我们正在查看的元素（基于我们的\
  \ `i` for 循环），如果是，返回 true，这意味着一个名字被多次使用。我们在 `partner2` 数组上执行了完全的操作。如果方法在通过两个循环后都没有返回\
  \ true，说明在任何时候名字都没有被多次使用，所以我们在最后返回 false。\n\n\n\n最后，我们有了 `checkIfPartnersDontMatch`\
  \ 方法，它返回一个布尔值，判断伙伴是否无效。这意味着如果学生 A 与学生 B 配对，而学生 B 又与学生 C 配对，那么伙伴关系并没有匹配，该方法应该返回 `true`。那么我们是如何做的呢？首先，我们遍历了数组（技术上我们遍历了\
  \ `partners1`，但在同一个迭代中我们将使用相同的索引来访问两个数组），并在每次迭代中，我们根据循环设置两个变量 `p1` 和 `p2`，分别设置为相应的伙伴。然后，我们创建了一个新的\
  \ `for` 循环将再次遍历整个数组。在这个循环中，我们检查是否存在反向关系，也就是说我们寻找 `p1` 是否与循环位置的 `partner2` 相同，以及\
  \ `p2` 是否与循环位置的 `partner1` 相同。如果其中一个为而另一个不是，那么我们就返回 `true`，因为伙伴不匹配。如果两个伙伴都为真，我们就跳出内层循环并处理下一组伙伴。最后，如果代码运行结束没有返回\
  \ `true`，则我们返回 `false`。回到我们的构造函数，我们检查这些方法是否有任何返回了 `true`，如果是，我们就向用户输出“bad”，因为其中任何一种情况（学生是自己的伙伴、学生与多人配对、或伙伴关系不匹配）都会导致结果为“bad”。否则，输出“good”。如果我们看我们的构造函数，它是相当简单的。它几乎就像英语！这就是为什么编写方法是一个好主意：它有助于让你的思路更清晰，让你的代码更易读和理解。\n\
