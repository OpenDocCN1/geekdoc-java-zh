  \n\n\n\n\n只想在自己的机器上运行 Java 程序的普通用户只需要安装 `JRE`，因为它包含了允许执行 Java 程序的 `JVM`。然而，Java\
  \ 程序员必须下载 `JDK`。我们将在下一部分更详细地探讨这些概念。如前所述，Java 编程创建的是面向对象且平台无关的程序，因为 Java 编译器创建的是\
  \ `.class` 文件而不是 `.exe` 文件。这个 `.class` 文件是一个包含字节码的中间文件，这就是 Java 程序具有平台无关性的原因。但它也存在缺点：Java\
  \ 程序的执行需要更长的时间，因为 `.class` 文件在操作系统中之前，必须先加载到 `JVM` 中。\n\n我们可以使用 Java 开发各种应用程序，但我们需要为不同的应用开发使用不同的包。例如，如果你想开发桌面应用程序，那么你就需要使用\
  \ `JDK`；如果你想开发 Android 应用程序，你就需要使用 `Android SDK`，因为它们拥有不同的类集合。\n\n## 第 2 章\n\n##\
  \ Java 环境\n\n### Java 的安装\n\n为了在系统上安装 Java，你需要以下工具：\n\n*   适用于 Java 开发者的 IDE（集成开发环境）\n\
  *   Java `JDK`\n\n下载这两个工具将开启你成为 Java 程序员的道路。IDE（集成开发环境）是一个包含处理和执行代码所需工具的封装应用程序。它包含一个代码编辑器、编译器、一个调试器和一个图形用户界面（GUI）。有很多类型的\
  \ IDE，但最常用的有：\n\n*   Netbeans\n*   Eclipse\n\n我个人推荐使用 `Eclipse`，因为它的性质简单。你可以在这里下载：\n\
  \n[`eclipse.org/downloads/`](https://eclipse.org/downloads/)\n\n一旦你进入此链接，你需要找到这个内容：\n\
  \n![`lh5.googleusercontent.com/L1DhiS0lHF2Wt52-NpfmrM1VQ_f5E3Vsh6h3H123LeuAQWSLLYBowxzHwHVk-Knuma6wifwNVdut28HqFog19-10NB5ACPPLWtwgWgY-xygaV1XsQ3827mdNZEikpnLWPTwMu7g`](img/Image00000.jpg)\n\
  \n然后，根据你系统中安装的操作系统/处理器类型，选择 Windows 32 位或 64 位操作系统。\n\n一旦安装了 IDE，我们将下载并安装 `JDK`，这将允许我们与用于创建和执行\
  \ Java 代码的代码编辑器进行交互。下方链接提供的 `JDK` 包含了开发 Java 程序所需的所有包和工具。\n\n[`www.oracle.com/technetwork/java/javase/downloads/index.html`](http://www.oracle.com/technetwork/java/javase/downloads/index.html)\n\
  \n在该网站上，找到并点击此图片开始下载：\n\n![e319d84467.png](img/Image00001.jpg)\n\n下载安装 `JDK` 后，你将能够启动\
  \ `Eclipse`。\n\n从 `Eclipse` 下载包解出的文件夹将包含 `eclipse.exe` 文件。一旦启动，你将看到以下窗口：\n\n![`lh3.googleusercontent.com/juAh1PmqbJFvvl4ZXFS1u-Cp7T6aD9nWkz0TwwivjzScPKy7E97FyCrUAU-2mj6wlMgbcGrSlSm5aJwOnb5n1IvxpkyTzf_NCgjhG604yFXhZCBsy3GfC1y_wg6v4gEp4uFNT80`](img/Image00002.jpg)\n\
