  md: "```\nnew BagOfCheese(\"Cheddar\", 2.43, 30, true);\n\naddDay(bag1);\n\nbag1.displayBag();\n\
    }\n\nstatic void addDay(BagOfCheese bag) {\n bag.daysAged++;\n}\n```\n\nA run\
    \ of the code in Listing 9-12 is shown in Figure 9-16. In that run, the constructor\
    \ creates a bag that is 30 days, but the addDay method successfully adds a day.\
    \ In the end, the display in Figure 9-16 shows 31 days aged.\n\n![](img/1a069ca97cef403f3540be3fe27c5eda_228_0.png)\n\
    \n**Figure 9-16:** Thirty-one days aged.\n\nUnlike the story with int values,\
    \ you can change a bag of cheese's daysAged value by passing the bag as a method\
    \ parameter. Why does it work this way?\n\nWhen you call a method, you make a\
    \ copy of each parameter's value in the call. You initialize the declaration's\
    \ parameters with the copied values. Immediately after making the addDay call\
    \ in Listing 9-12, you have two variables: the original bag1 variable in the main\
    \ method and the bag variable in the addDay method. The new bag variable has a\
    \ copy of the value from the main method, as shown in Figure 9-17. That \"value\"\
    \ from the main method is a reference to the BagOfCheese object. In other words,\
    \ bag1 and bag variables refer to the same object.\n\nThe statement in the addDay\
    \ method adds 1 to the value stored in the object's daysAged field. After one\
    \ day is added, the program's variables look like the information in Figure 9-18.\n\
    \nNotice how the bag1 and bag variables refer to an object whose daysAged value\
    \ is 31. After returning from the call to addDay, the variable goes away. All\
    \ that remains is the original main method and bag1 variable, as shown in Figure\
    \ 9-19. But bag1 still refers to an object whose daysAged value has been changed\
    \ to 31.\n\nIn Chapter 7, I show how to pass primitive values to method parameters.\
    \ Passing a primitive value to a method parameter is *pass-by value*. In this\
    \ section, I show how to pass both primitive values and objects to method parameters.\
    \ Passing an object (such as bag1) to a method parameter is called *pass-by reference*."
