  md: 'I, use Android''s shared preferences feature.


    Android provides several ways to store information from one run of an app to the
    next. In addition to using shared preferences, you can store information in the
    device''s SQLite database. (Every Android device has SQLite database software.)
    You can also store information in an ordinary Linux file or on a network of some
    kind.


    Here is how you wield a set of shared preferences:


    To create shared preferences, you call the activity getSharedPreferences method.


    In fact, the getSharedPreferences method belongs to Android''s context class,
    and the activity class is a subclass of the Context class.


    In Listing 14-3, I call getSharedPreferences in the activity''s onCreate method.
    The call''s parameter, MODE_PRIVATE, tells Android that no other app can read
    or write to its shared preferences. (I know — there is nothing "shared" about
    something that no other app can use. But that''s the way Android''s terminology
    works.)


    Aside from MODE_PRIVATE, the alternatives are described in this list:


    +   - MODE_WORLD_READABLE: Other apps can read from these preferences.

    - MODE_WORLD_WRITEABLE: Other apps can write to these preferences.

    - MODE_MULTI_PROCESS: Other apps can write to these preferences even while an
    app is in the middle of a read operation. Weird things can happen with this much
    concurrency. If you use MODE_MULTI_PROCESS, watch out!


    You can combine modes with Java''s bitwise or operator (|). A call such as


    ```

    MODE_WORLD_READABLE | MODE_WORLD_WRITEABLE);

    ```


    makes your preferences both readable and writable for all processes.


    To start adding values to a set of shared preferences, you use an instance of
    the SharedPreferences.Editor class.


    In Listing 14-3, the onCreate method creates a new editor object. In the shows
    method, I use the editor to add ("highScore", highScore) to the shared preferences.
    Together, ("highScore", highscore) is a key/value pair. The value (whatever your
    highscore variable holds) is the actual information. The key (the string "highScore")
    identifies that particular piece of information. (Every value has a key. Otherwise,
    if you''ve stored several different values in your app shared preferences, you
    have no way to retrieve any particular value.)


    In Listing 14-3, I call putInt to an int value in shared preferences. Android''s
    Editor class (an inner class of the SharedPreferences class) has methods such
    as putInt, putFloat, putString, and putStringSet.


    To finish adding values to a set of shared preferences, you call the editor''s
    commit method.


    In the shows method in Listing 14-3, the statement editor.commit() does the job.


