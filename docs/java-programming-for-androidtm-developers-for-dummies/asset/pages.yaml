  md: "```\n}\nstatic void display(String aString) {\n    if (!aString.contains(\"\
    confidential\")) {\n        System.out.println(aString);\n    }\n}\n```\n\nThe\
    \ display method prints a string of characters only if that string doesn't contain\
    \ the word confidential. The problem is that myString variable (and thus the aString\
    \ parameter) doesn't refer to a string of any kind — not even to the empty string(\"\
    \").\n\nWhen the computer reaches the call to aString.contains, the computer looks\
    \ for a contains method belonging to null. But null is nothing. The null value\
    \ has no methods. So you get a big NullPointerException, and the program comes\
    \ crashing around you.\n\nTo avoid this kind of calamity, think twice about any\
    \ method call in your code. If the expression before the dot can possibly null,\
    \ add exception-handling code to your program:\n\n```\ntry {\n    if (!aString.contains(\"\
    confidential\")) {\n        System.out.println(aString);\n    }\n} catch (NullPointerException\
    \ e) {\n    System.out.println(\"The string is null.\");\n}\n```\n\nFor the story\
    \ on handling exceptions, see Chapter 13.\n\n# Using Permissions\n\nSome apps\
    \ require explicit permissions. For example, the app in Chapter 13 talks to Twitter's\
    \ servers over the Internet. This doesn't work unless you add a <uses-permission>\
    \ element to the AndroidManifest.xml file:\n\n```\n<uses-permission android:name=\"\
    android.permission.INTERNET\"/>\n```\n\nIf you forget to add the <uses-permission>\
    \ element to your AndroidManifest.xml file, the app can't communicate with Twitter's\
    \ servers. The app fails without displaying a useful error message. Too bad!\n\
    \n# The Activity Not Found\n\nIf you create a second activity for your app, you\
    \ must add a <activity> element in the app's AndroidManifest.xml file. For example,\
    \ the app in Chapter 12 has two activities: MainActivity and MyListActivity. Eclipse\
    \ automatically creates an <activity name=\"MainActivity\"> element, but you have\
    \ to type your own element for the"
