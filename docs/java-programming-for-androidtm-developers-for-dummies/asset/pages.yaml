  md: '# More about Java’s Modifiers


    I start the conversation about Java in Chapters 6 and 9. Chapter 6 describes the
    keyword final as it applies to variables, and Chapter 9 deals with the keywords
    public and private. In this section, I add a few more fun facts about Java modifiers.


    The word final has many uses in Java programs. In addition to having final variables,
    you can have these elements:


    +   * Final class: If you declare a class to be final, no one (not even you) can
    extend it.


    +   * Final method: If you declare a method to be final, no one (not even you)
    can override it.


    Figures 10-6 and 10-7 put these rules into perspective. In Figure 10-6, I can''t
    extend the Stuff class, because the Stuff class is final. And in Figure 10-7,
    I can''t override the Stuff class''s increment method because that increment method
    is final.


    ![](img/1a069ca97cef403f3540be3fe27c5eda_255_0.png)


    **Figure 10-6:** Trying to extend a final class.'
