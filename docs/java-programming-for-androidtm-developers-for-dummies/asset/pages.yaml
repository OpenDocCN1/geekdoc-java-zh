  md: '# # Chapter 4

    Creating an Android App


    # ## This Chapter


    +   - Creating an elementary Android app

    - Troubleshooting troublesome apps

    - Testing an app on an emulator or a mobile device

    - Dissecting an app


    Chapter 3 describes the writing and running of a dirt-simple Java program. Like
    many Java programs, the one in Chapter 3 runs on a plain-old desktop or laptop
    computer. Behind the scenes, the code in Chapter 3 uses the powerful features
    of standard Oracle Java. But the two kinds of Java (standard Oracle Java for desktops
    and laptops, and Android’s Java for mobile devices) are slightly different animals,
    for these reasons:


    +   - Standard Java uses the power and speed of desktop and laptop computers.

    Android Java is streamlined to run on smaller devices with less memory.

    - Standard Java uses some features that aren''t available in Android Java.

    For example, the javax.swing.JOptionPane.showMessageDialog() call in the program
    in Chapter 3 isn''t available in Android Java.

    - Android Java uses some features that aren''t available in standard Java.

    For example, the Activity class in this chapter''s program isn''t available in
    standard Java.

    - Creating a basic Android app requires more steps than creating a basic Java
    app.


    This chapter covers the steps that are required in order to create a basic Android
    app, though the app doesn''t do much. (In fact, you might argue that it does nothing.)
    But the example shows you how to create and run a new Android project.


    # ## Creating Your First Android App


    A gadget typically comes supplied with a manual. The manual''s first sentence
    is “Read all 37 safety warnings before attempting to install this product.” Don''t
    you love it? You can''t get to the pertinent material without wading through the
    preliminaries.


    Well, nothing in this chapter can set your house on fire or even break your electronic
    device. Before you follow this chapter''s instructions, you''ll need a bunch of
    software on your development computer. To make sure you have this software, and
    that it''s properly configured, see Chapter 2. (Do not pass Go; do not collect
    $200).


    When at last you have all the software you need, you''re ready to start Eclipse
    and create a real, live App.'
  merge: -1
