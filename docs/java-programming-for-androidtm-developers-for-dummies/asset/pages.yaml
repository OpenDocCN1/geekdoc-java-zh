  md: 'developer you want to do? Does a developer provide translations of every app
    into every processor''s instruction set?


    No. Virtual machines create order from all this chaos. Dalvik bytecode is similar
    to the code in Listing 1-3, but Dalvik bytecode isn''t specific to a single kind
    of processor or to a single operating system. Instead, Dalvik bytecode instructions
    run on any processor. If you write a Java program and compile it to Dalvik bytecode,
    your Android phone can run the bytecode, your Android tablet can run it, and your
    grandmother''s supercomputer can run it. (To do this, your grandmother must install
    Android-x86, a special port of the Android operating system, on her Intel-based
    machine.)


    ![](img/1a069ca97cef403f3540be3fe27c5eda_31_0.png)


    You never have to write or decipher Dalvik bytecode. Writing bytecode is the compiler''s
    job. Deciphering bytecode is the virtual machine''s job.


    Both Java bytecode and Dalvik bytecode you created have virtual machines. With
    the Dalvik virtual machine, you can take a bytecode file that you created for
    one Android, copy the bytecode to another Android device, and then run it with
    no trouble. That''s one of the reasons why Android has become popular quickly.
    This outstanding feature, lets you run code on many different kinds of computers,
    is called portability.


    Imagine that you''re the representative to the United Nations Security Council,
    as in Figure 1-3. The ARM representative is seated to your right, and the representative
    from Texas Instruments is to your left. (Naturally, you don''t get along with
    either of these people. You''re always cordial to one another, but never sincere.
    What do you expect? Politics!) The distinguished representative from Dalvik is
    at the podium. The Dalvik representative speaks in Dalvik bytecode, and neither
    nor your fellow ambassadors (ARM and Texas Instruments) understand a word of Dalvik
    bytecode.


    ![](img/1a069ca97cef403f3540be3fe27c5eda_31_1.png)


    Figure 1-3: An imaginary meeting of the UN Security Council.


    But each of you has an interpreter. Your interpreter translates from Dalvik bytecode
    to Intel instructions as the Dalvik representative speaks. Another interpreter
    translates from bytecode to “ARM-ese.” And a third interpreter translates bytecode
    into “Texas Instruments-speak.



    Think of your interpreter as a virtual ambassador. The interpreter doesn''t really
    represent your'
