    Almost every Java class extends another Java class. I write almost because one
    (and only one) class doesn''t extend any other class. Java''s built-in object
    class doesn''t extend anything. The object class is at the top of Java''s class
    hierarchy. Any class whose header has no extends clause automatically extends
    Java''s object class. So every other Java class is, directly or indirectly, a
    descendant of the Object class, as shown in Figure 10-2.


    The notion of extending a class is one pillar of object-oriented programming.
    In the 1970s, computer scientists were noticing that programmers tended to reinvent
    the wheel. If you needed to balance an account, for example, you started writing
    code from scratch to balance account. Never mind that other people had written
    their account-balancing code. Integrating other people'' code with yours, and
    adapting other peoples'' code to your own needs, was a big headache. All things
    considered, it was easier to start from scratch.


    ![](img/1a069ca97cef403f3540be3fe27c5eda_247_0.png)


    Figure 10-2: Everything comes from Java''s object class.


    Then, in the 1980s, object-oriented programming became popular. The notion of
    classes and subclasses provided a clean way to connect existing code (such as
    Android''s Activity class code) with new code (such as your new MainActivity class
    code). By extending an existing class, you hook into the class''s functionality,
    and you reuse features that have already been programmed.'
