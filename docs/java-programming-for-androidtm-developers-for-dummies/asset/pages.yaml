  md: '# What does static mean?


    This chapter begins with a discussion of cheese and its effects on Andy''s business
    practices. Andy has a blank form that represents a class. He also has a bunch
    of filled-in-forms, each of which represents an individual bag-of-cheese object.


    One day, Andy decides to take inventory of his cheese by counting all the bags
    of cheese (see Figure 9-26).


    ![](img/1a069ca97cef403f3540be3fe27c5eda_238_0.png)


    **Figure 9-26:** Counting bags of cheese.


    Compare the various fields shown in Figure 9-27. From the object-oriented point
    of view, how is the daysAged field different from the count field?


    The answer is that a single bag can keep track of how many days it has been aged,
    but it shouldn''t count all the bags. As far as Listing 9-1, a BagOfCheese object
    has its own daysAged field. That makes sense. (Well, it makes sense to an object-oriented
    programmer.)


    But giving a particular object the responsibility of counting all objects in its
    class doesn''t seem fair. To have each BagOfCheese object speak on behalf of all
    the others violates a primitive directive of computer programming: The structure
    of the program should imitate the structure of the life-data. For example, I can
    post a picture of myself on Facebook, but I can''t count everyone else''s pictures
    on Facebook. ("All you other Facebook users, you can count your own @#!pictures!")


    A field to count all bags of cheese field belongs in one central place. That''s
    why, in Figure 9-27, we have one, and only one, count field. Each object has its
    own daysAged value, but the class itself has a count value.


    A field or method that belongs to an entire class rather than to each individual
    object is a static member of the class. To declare a static member of a class,
    you use Java''s static keyword (what a surprise!), as shown in Listing 9-19.'
