  md: '# # Chapter 6

    Java’s Building Blocks


    # ## This Chapter


    +   - Assigning values to things

    - Making things store certain types of values

    - Applying operators to get new values


    I’ve driven cars in many cities, and I’m ready to present my candid reviews:


    +   Driving in New York City is a one-sided endeavor. A New York City driver avoids
    hitting another car but doesn’t avoid being hit by another car. In the same way,
    New pedestrians do nothing to avoid being hit. Racing into the path of an oncoming
    vehicle is commonplace. Anyone who doesn’t behave this way is either a New Jersey
    driver or a tourist from the Midwest. In New York City, safety depends entirely
    on the car that’s moving towards a potential target.


    +   A driver in certain parts of California will stop on a dime for a pedestrian
    who’s about to jaywalk. Some drivers stop before the pedestrian is aware of any
    intention to jaywalk.


    +   Boston’s streets are curvy and irregular, and accurate street signs are rare.
    Road maps are outdated because of construction and other contingencies. So driving
    in Boston is highly problematic. You can’t find your way around Boston unless
    you already know your way around Boston unless you’ve already driven around Boston.
    Needless to say, I can’t drive in Boston.


    +   London is crowded, but the drivers are polite (to foreigners, at least). Several
    years ago, I caused three car accidents in one week on the streets of London.
    And after each accident, the driver of the car apologized to me!


    I was particularly touched when a London cab expressed regret that an accident
    (admittedly, myself) might stain his driving record. Apparently, the rules for
    London cabbies are quite strict.


    This brings me to the subject of the level of training required to drive a taxic
    in London. The cabs start their careers by memorizing the London street map. The
    map has over 25,000 streets, and the layout has no built-in clues. Rectangular
    grids aren’t the norm, and numbered streets are quite uncommon. Learning all the
    street names takes several years, and the cabs must pass a test in order to become
    certified drivers.


    This incredibly circuitous discussion about drivers, streets, and my tendency
    to cause accidents leads me to the major point of this section: Java’s built-in
    types are easy to learn. In contrast to London’s 25,000 streets, and the periodic
    table’s 100-some elements, Java has only eight built-in types. They’re Java’s
    *primitive types*, and this chapter describes them all.'
