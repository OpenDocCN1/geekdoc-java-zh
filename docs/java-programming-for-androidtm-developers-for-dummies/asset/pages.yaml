    For all matters related to the technical content of this book, visit www.allmycode.com/Java4Android.


    For business issues (for example, "How can I purchase 100 copies of Java Programming
    For Android Developers For Dummies?"), visit www.dummies.com/extras/javrogrammingforandroiddevelopers.


    # # The Horse’s Mouth


    Oracle''s official website for Java is www.oracle.com/technetwork/java. Consumers
    of Java technology should visit www.java.com. Programmers and developers interested
    in sharing Java can go to www.java.net. For everything an Android developer needs
    to know, visit developer.android.com.


    # # Finding News and Reviews


    For articles by the experts, visit the InfoQ site: www.infoq.com. For discussions
    by everyone (including many very smart people), visit JavaRanch at www.javagranch.com.


