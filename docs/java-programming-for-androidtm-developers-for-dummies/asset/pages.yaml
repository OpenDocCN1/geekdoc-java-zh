    +   - Possibility #5: An Android phone

    Advantages: Using a popular, open platform with lots of industry support and powerful
    market momentum; writing your own software and installing it on your own phone
    (without having to post the software on a company''s website); publishing software
    without having to face a challenging approval process.

    Disadvantages: Security concerns when using an open platform; dismay when iPhone
