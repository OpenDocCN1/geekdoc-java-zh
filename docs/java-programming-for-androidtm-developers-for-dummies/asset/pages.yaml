  md: 'or a 64-bit computer, but an operating system with 64-bit instructions can
    run on a 64-bit computer. And to make things even more compatible, each program
    that you run (a web browser, a word processor, or one of your Java programs) is
    better on a 64-bit operating system running on a 64-bit computer. Alternatively,
    you may run a 32-bit browser on a 32-bit operating system on a 64-bit computer.
    (See the figure above this sidebar).


    When choose between 32-bit and 64-bit software, the main concern is the word length
    of the operating system, not the word length of the computer''s circuitry. You
    can run a 32-bit word processor on a 64-bit operating system, but you can''t run
    a 64-bit word processor on a 32-bit operating system (no matter what word length
    the computer''s circuitry has). Choosing one provides one advantage: 64-bit software
    can access more than 3 gigabytes of a computer''s fast random access memory. And
    in my experience, more memory means faster processing.


    How does this about word lengths affect Java and Android SDK downloads? Here''s
    the story:


    +   - If you run a 32-bit operating system, you probably run 32-bit software.

    - If you run a 64-bit operating system, you probably run some 32-bit software
    and some 64-bit software. Most 32-bit software runs fine on a 64-bit operating
    system.

    - On a 64-bit operating system, you might have two versions of the same program.
    For example, on my Windows computer, I have two versions of Internet Explorer:
    a 32-bit version and a 64-bit version.


    Normally, Windows stores 32-bit programs in its Program Files (x86) directory
    and stores 64-bit programs in its Program Files directory.

    A chain of word lengths is as strong as its weakest link. For example, when I
    visit www.java.com and click the site''s Do I Have? link, the answer depends on
    the match between my computer''s Java version and the web browser that I''m running.
    With 64-bit Java installed on my computer, the Do I Have? link in my 32-bit Firefox
    browser answers, No working Java was detected on your system. But the same link
    in my 64-bit Internet Explorer answers, You have the recommended Java.


    Here''s the most important thing to remember about word lengths: When you follow
    this chapter''s instructions, you install Java and Android SDK software on the
    computer. The Java software''s word length must match the Android''s word length.
    In other words, 32-bit Android SDK runs with 32-bit Java, and 64-bit Android SDK
