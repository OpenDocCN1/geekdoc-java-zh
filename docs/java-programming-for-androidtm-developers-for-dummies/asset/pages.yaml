    # # Testing Apps on a Real Device


    You can bypass emulators and test apps on a phone, a tablet, or maybe an Android-enabled
    trash compactor. To do so, you have prepare the device, prepare the development
    computer, and then hook the two together. This section describes the process.


    To test an app on real Android device, follow these steps:


    +   1. On the Android device, turn on USB debugging.

    Various Android versions have their own ways of enabling (or disabling) USB debugging.
    You can poke around for the debugging option on your own device or visit this
    site for the procedures on some representative Android versions:


    > www.teamandroid.com/2012/06/25/how-to-enable-usb-debugging-in-android-phones


    On my device, I keep USB debugging on all. But if you''re nervous about security,
    turn off USB debugging when you aren''t using the device to develop apps.


    +   2. In your project''s branch of the Package Explorer, double-click the AndroidManifest.xml
    file.

    Eclipse offers several ways to examine and edit this file.


    +   3. At the bottom of the Eclipse editor, click the Application tab.

    Eclipse displays a form like the one Figure 4-12.


    +   4. In the Debuggable drop-down list, choose True. (Refer to Figure 4-12).

