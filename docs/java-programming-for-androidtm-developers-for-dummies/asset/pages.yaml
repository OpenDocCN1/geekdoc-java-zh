  md: 'For many apps, timing isn''t vitally important: For them, a consistently slow
    response is annoying but not disabling. But for a game like Hungry Burds, timing
    makes a big difference. Running Hungry Burds on an emulator feels more like a
    waiting game than an action game. To gain a reasonable sense of how Hungry Burds
    works, run the app on a real-life device.


    The Hungry Burds code is about 140 lines long. (Compare this with with one of
    the Android game developer’s books that I bought. In that book, the simplest example
    has 2,300 lines of Java code.) To keep the Hungry Burds code from consuming dozens
    of pages, I''ve omitted some features that you might see in a more realistically
    engineered game.


    ![](img/1a069ca97cef403f3540be3fe27c5eda_351_0.png)


    Figure 14-3: The game ends.


    +   * The Hungry Burds game doesn’t access data over a network.


    The game’s high-score display doesn’t tell you how well you did compare with your
    friends or with other players around the world. The high-score display applies
    to only one device — the one you’re using to play the game.'
