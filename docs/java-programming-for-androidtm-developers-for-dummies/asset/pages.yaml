    2 Standard Edition 1.2, which confuses everyone to this. At the time, anyone using
    the term Java Development Kit was asked to use Software Development Kit (SDK)
    instead.


    In 2004 the 1 went away from the platform version name, and in 2006 Java platform
    names lost the 2 and the .0.


    By far the most significant changes for Java developers came about 2004. With
    the release of J2SE 5.0, the overseers of Java made changes to the language by
    adding new features — features as generic types, annotations, varargs, and the
    enhanced for statement.


    ![](img/1a069ca97cef403f3540be3fe27c5eda_25_0.png)


    To see Java annotations, in action, go to Chapter 10. For examples of generic
    types, varargs, and the enhanced for statement, see Chapter 12.


    ![](img/1a069ca97cef403f3540be3fe27c5eda_25_1.png)


    If you compare Figures 1-1 and 1-2, you might notice that Android entered the
    scene when Java was in version Java SE 6. As a result, Java is frozen at version
    6 for Android developers. When you develop an Android app, you can use J2SE 5.0
    or Java SE 6. You cannot use SE 7 with strings in its switch statements or use
    SE 8 with its lambda expressions. But that''s okay: As an Android developer, you
    probably won''t miss these features.


    # XML


    If you find Source among your web browser''s options one and decide to use it,
    you''ll see a bunch of HyperText Markup Language (HTML) tags. A tag is some text,
    enclosed in brackets, that describes something about its neighboring content.


    For example, to create boldface on a web page, a web designer writes


    ```

    <b>Look at this!</b>

    ```


    The b tags in brackets boldface type on and off.


    The M in HTML stands for Markup — a general term describing any document''s content.
    When you annotate a document''s content, you embed information about the content
    into the document itself. For example, in the previous line of code, the content
    is like this! The markup consists of the tags <b> and </b>.


    The HTML standard is an outgrowth of Standard Generalized Markup Language (SGML),
    an all-to-all technology for marking up documents for use by all kinds of computers
    running all kinds of software and all kinds of vendors.


    In the mid-1990s, a working group of the Wide Web Consortium (W3C) began the Extensible
    Markup Language, commonly known as XML. The working group''s goal was to create
    a subset of SGML for use in transferring data over the Internet. Since XML'
