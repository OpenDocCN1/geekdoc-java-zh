    # Fewer method parameters


    Another story about method parameters in Listing 5-4 begs to be told. In Listing
    5-4 I call a method named countdown, and in the same class I declare my new countdown
    method.


    When you call a method that is declared in the same class, you can use the method''s
    simple name. It''s the same way in real life. No one in my family calls me Barry
    Burd at home (unless they''re really angry with me).


    You may remember how the computer counts a method''s parameters and matches this
    with the number of parameters in the method''s declaration. In Listing 5-4, the
    countdown call has no parameters (only an empty pair of parentheses) and the countdown
    method''s declaration has the same number of parameters; namely, none. So the
    call and the declaration are compatible, and the computer executes the declaration''s
    instructions.


    To declare (or to call) a method with no parameters, use an empty pair of parentheses.


    # Hello, Android


    An Android project''s src directory contains your project''s Java source code.
    Files in this directory have names such as MainActivity.java, MyService.java,
    DatabaseHelper.java, and MoreStuff.java.


    You can cram hundreds of Java files into an Android project''s src directory.
    But when you create a new project, Eclipse typically creates just one file for
    you. By default, Android creates a file named MainActivity.java. Listing 5-5 shows
