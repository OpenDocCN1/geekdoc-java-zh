    anInteger = 74;

    achar = 74;

    ```


    A line like anInteger = 74 is an assignment. An assignment changes a variable''s
    value. An assignment isn''t part of a type declaration. Instead, an assignment
    is separate from its type declaration (maybe many lines after the type declaration).


    You can initialize a variable with one value and then, in an assignment statement,
    change the variable''s value.


    ```

