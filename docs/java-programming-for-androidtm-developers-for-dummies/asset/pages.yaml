  md: "# Info Is as Info Does\n\n“Reality! To Sancho, an inn; to someone else, whatever!”\n\
    —Miguel de Cervantes, updated for “Man of La Mancha”\n\nWhen you think a computer\
    \ stores the letter j, the computer is, in reality, storing 01010110. Everything\
    \ inside the computer is a sequence of 0s and 1s. As every geek knows, a 0 or\
    \ 1 is a bit.\n\nAs it turns out, the sequence 01010110, which stands for the\
    \ letter j, can also stand for the number 74. The same sequence can also stand\
    \ for 1.0369608636003646 × 10⁻⁴³. In fact, if the bits are interpreted as screen\
    \ pixels, the same sequence can be used to represent the dots shown in Figure\
    \ 6-1. The number of 01010110 depends on the way the software interprets this\
    \ sequence of 0s and 1s.\n\n![](img/1a069ca97cef403f3540be3fe27c5eda_137_0.png)\n\
    \nFigure 6-1: An extreme close-up of eight black-and-white screen pixels.\n\n\
    So how do you tell the computer what 01010110 stands for? The answer is in the\
    \ concept of type. The type of a variable is the range of values that the variable\
    \ is permitted to store. Listing 6-1 illustrates this idea.\n\n# Listing 6-1:\
    \ Goofing Around with Java Types\n\n```\npackage com.allmycode.demos;\n\nimport\
    \ javax.swing.JJOptionPane;\n\npublic class TypeDemo01 {\n\n    public static\
    \ void main(String[] args) {\n        int anInteger = 74;\n        char aCharacter\
    \ = 74;\n        JJOptionPane.showMessageDialog(null, anInteger,\n           \
    \ \"An int variable\", JJOptionPane.PLAIN_MESSAGE);\n        JJOptionPane.showMessageDialog(null,\
    \ aCharacter,\n            \"A char variable\", JJOptionPane.PLAIN_MESSAGE);\n\
    \    }\n}\n\n```\n\nA run of the code in Listing 6-1 looks like the displays in\
    \ Figures 6-2 and 6-3."
