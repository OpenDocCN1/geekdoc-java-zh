  md: '# Introduction


    Android is everywhere. In mid-2013, Android ran on 53 percent of all smartphones
    in the United States and 80 percent of all smartphones worldwide.¹ In a study
    that spans the Americas, Europe, Asia, and the Middle East, Webindex reports Android
    tablets outperform iPads by 34 million. More than a million apps are available
    for download at the Google Play store (double the number of apps that were available
    in 2012).³ And than 9 million developers write code using Java, the language that
    powers Android devices.⁴


    If you read this book in a public place (on a commuter train, at the beach, or
    on the dance floor at the Coyote Ugly saloon, for example), you can read easily,
    with a chip on your shoulder and with your head high. Android is hot, and you''re
    cool because you''re reading about it.


    > ¹see www.kantarworldpanel.com/global/News/news-articles/Samsung-50-share-across-Europe-as-Apple-powers-back-in-the-US
    and http://www.idc.com/getdoc.jsp?containerId=prUS2425743.


    > ²see www.globalwebindex.com/android-tablets-dominate-g1-mobile-market.


    > ³see www.androidguys.com/2013/07/24/sunder-pichai-there-are-now-than-1-million-android-apps.


    > ⁴see www.java.com/en/about.


    # How to Use This Book


    You can attack this book in either of two ways: go from cover to cover or pound
    around one chapter to another. You can do both (start at the beginning, and jump
    to a section that particularly interests you). This book was designed so that
    the basic topics come first, and the more-involved topics follow them. But you
    may already be comfortable with some basics, or you may have specific goals that
    don''t require you to know about certain topics.


    In general, my advice is:


    +   - If you already know something, don''t bother reading about it.


    +   - If you''re curious, don''t be afraid to skip ahead. You can always sneak
    a peek at an earlier chapter if you need to do so.


    # Conventions Used in This Book


    Almost every technically themed book starts with a little typeface legend, and
    Java Programming For Android Developers For Dummies is no exception. What follows
    is a brief explanation of the typefaces used in this book:


    +   - New terms are set in *italics*.


    +   - If you need to type something that''s mixed in with the regular text, the
    characters you appear in bold. For example: “Type MyNewProject in the text field.”'
  merge: -1
