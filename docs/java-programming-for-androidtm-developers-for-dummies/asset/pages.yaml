    The Android Software Development Kit (SDK) includes lots of tools for pre, reusable
    Android code and a bunch of software tools for running and testing Android apps.

    The prewritten Android code is the Android Application Programming Interface (API).
    The API comes in several versions — versions 9 and 10 (both code-named Gingerbread),
    versions 11, 12, and 13 (Honeycomb), and versions 14 and 15 (Ice Cream), and so
    on.


