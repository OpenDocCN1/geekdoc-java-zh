    is false, but the condition age < 18 is true. Because one of the two conditions
    on either side of the || operator is true, the whole nonparenthesized condition
    is true —, to the theater manager''s dismay, the 16-year-old kid gets a discount
    ticket.


    Sometimes, you can take advantage of Java''s precedence rules and omit the parentheses
    in an expression. But I visit Java''s online language specifications document
    (docs.oracle.com/java/specs/j/se5.0/html/j3TOC.html), I don''t like figuring out
    how the rules apply to a particular condition.


    When I create an expression like the one in Listing 6-5, I almost always use parentheses.
