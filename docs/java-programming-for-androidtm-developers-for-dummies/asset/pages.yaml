    # # Java’s Exceptions


    Have I ever everything go wrong during the run of a program? (Hint: The answer
    is yes.) Have you ever tried to visit a website and been unable to pull up the
    page? (Indubitably, the answer is yes.) Is it possible that Java statements can
    fail when they try to access the Twitter server? (Absolutely!)


    In Java, most of the things that went wrong during the execution of a program
    are *exceptions*. When something goes wrong, your code throws an exception. If
    your code provides a way to respond to an exception, your code *catches* the exception.


    Like everything else in Java, an exception is an object. Every exception is an
    instance of Java''s Exception class. When your code tries to divide by zero (which
    is always a "no-no"), your code throws an instance of the *ArithmeticException*
    class. When your code can''t read from a stored file, your code throws an instance
    of the *IOException* class. When your code can''t access a database, your code
    throws an instance of the *SQLException* class. And when your can''t access the
    Twitter servers, your code throws an instance of the *TwitterException* class.'
