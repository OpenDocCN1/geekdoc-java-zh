  md: "# Listing 13-4\n\nSo in Listing 13-4, I add Java's try / catch to my getUserTimeline\
    \ call. Here's the translation of the try / catch statement (or statements): {\n\
    \n```\ntry to execute this statement\n    statues = twitter.getUserTimeline(username[0]);\n\
    \nIf you throw a TwitterException while you're trying,\n    display a stack trace\
    \ in Eclipse's Logcat view.\n}\n```\n\nA stack trace is the kind of output (refer\
    \ to Figure 13-12) that tells you which sequence of method calls the throwing\
    \ of the exception. A stack trace can help you diagnose your code's ills.\n\n\
    # Catch clauses\n\nA try / catch statement has only one catch clause. But a try\
    \ / catch statement can have many catch clauses, as shown in this example:\n\n\
    ```\ntry {\n    count = numberOfOfTweets / averageDay;\n    statues = twitter.getUserTimeline(username[0]);\n\
    } catch (TwitterException e) {\n    System.out.println(\"Difficulty with Twitter\"\
    );\n} catch (ArithmeticException a) {\n    a.printTrace();\n} catch (Exception\
    \ e) {\n    System.out.println(\"Something went wrong.\");\n}\n\nSystem.out.println(\"\
    No longer contacting Twitter\");\n```\n\nWhen an exception is thrown inside a\
    \ try clause, Java examines immediately after the try clause and works its way\
    \ down the list of catch clauses. Every catch clause contains a parameter list,\
    \ and every parameter list contains a type of exception.\n\nJava starts at whatever\
    \ catch clause appears immediately after the try clause and works its way down\
    \ the program's text. For each catch clause, Java asks: Is the exception that\
    \ was thrown an instance of the class in this clause's parameter list? If it isn't,\
    \ Java skips the catch clause and moves to the next catch clause in line; if it\
    \ is, Java executes the catch clause and then skips all other catch clauses that\
    \ come with this try clause. Java goes on and executes whatever statements after\
    \ the whole try / catch statement."
