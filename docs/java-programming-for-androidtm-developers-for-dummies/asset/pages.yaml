    \ modifier keywords.\n\n# Public classes and default-access classes\n\nMost of\
    \ the classes in this chapter's lists begin with the word public. When a class\
    \ is public, any program in any package can use the code (or at least some of\
    \ the code) inside that class. If a class isn't public, then for a program to\
    \ use the code inside that class, the program must be inside the same package\
    \ as the class. Listings 9-13, 9-14, 9-15 illustrate these ideas.\n\n# Listing\
