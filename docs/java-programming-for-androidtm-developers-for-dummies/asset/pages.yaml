    markers, as shown in Figure 12-2. The text looks something like this: “ArrayList
    is a raw type. References to generic type ArrayList<E> should be parameterized.”
    What does that mean?


    Starting with Java 5, the collection classes use generic types. You can recognize
    a generic type because of the angle brackets around its name. For example, the
    declaration uses a string for your generic type:


    ```

    ArrayList<String> arrayList = new ArrayList<String>();

    ```


