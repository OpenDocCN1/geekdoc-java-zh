  md: 'Certain programming languages, like C++, support multiple inheritance, in which
    a class can have more than one parent class. For example, in C++ you can create
    a Book class, a TeachingClass and a Textbook class. You can make Textbook extend
    both Book and TeachingMaterial. This feature makes hierarchies quite flexible,
    but it also makes those hierarchies extremely complicated. You need tricky rules
    to decide how to inherit the methods of both the computer''s Mouse class and the
    reader''s Mouse class.


    To avoid all complexity, Java does not support multiple inheritance. In Java,
    each class has (and only one) superclass. A class can have any number of subclasses.
    You can (and will) create many subclasses of Android''s Activity class. And other
    developers create their own subclasses of Android''s Activity class. A Java class
    can have only one parent. The Executive class (refer to Listing 10-4) cannot extend
    both the FullTimeEmployee class and the PartEmployee class.


    # Using an interface


    The relationship between a class and its subclass is one of inheritance. In many
    real-life families, a class inherits assets from a parent. That''s how it works.


    But consider the relationship between an editor and an author. The editor says,
    "By signing this contract, you agree to submit a completed manuscript by the fifteenth
    of July." Despite any excuses that the author gives before the deadline (and,
    believe me, authors make plenty of excuses), the relationship between the editor
    and the author is one of obligation. The authors agree to take on certain responsibilities;
    and, in order to continue an author, each author must fulfill those. (By the way,
    there''s no substext in this paragraph — none of all.)


    Now consider Barry Burd. Who Barry Burd — that guy writes Java For Android Developers
    For Dummies and other Dummies books (from Wiley Publishing). He''s a parent, and
    he''s also an author. To mirror this situation in a Java project, but Java doesn''t
    support multiple inheritance. You can''t make Barry extend both a Father class
    and an Author class at the same time.


    Fortunately for Barry, Java has interfaces. A class can extend only one parent
    class, but a class can implement many interfaces. A parent class is a bunch of
    stuff that a class inherits. On the other hand, an *interface* is a bunch of stuff
    that a class is obliged to provide.


    Here''s another example. Listings 10-2 through 10-5 describe what it means to
    be an employee of various kinds. Though a company might hire consultants, consultants
    who work for the company aren''t employees. Consultants are normally self-employed.
    They show up temporarily to help companies solve problems and then leave the company
    to elsewhere. In the United States, differentiating between an employee and a
    consultant is important: U.S. tax withholding laws labeling a consultant as "employee"
    of any kind would subject the company to considerable legal risk.


    To include employees in your code, you need a Consultant class that separates
    from your Employee class hierarchy. On the other hand, consultants have a lot
    in common with a company''s regular employees. For example, every consultant has
    a showPay. To represent this commonality in your code, so you create an interface.
    The interface obligates'
