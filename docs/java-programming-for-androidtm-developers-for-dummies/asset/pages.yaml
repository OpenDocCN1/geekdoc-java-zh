- img_proc: true
  md: 'For practice apps, you can cheat by using the package name that Eclipse creates.
    If you plan to publish an app, use the app its own package name, using the rules
    described in Chapter 3.


    In Android, a package name belongs to only one app. You can put the first app
    in the package org.allyourcode.firststart and the second app in the package org.allyourcode.secondapp.
    But you can''t put more than one in the org.allyourcode.mystuff package.


    For the lowdown on Java packages and package names, see Chapter 5.


    # 5. (Optional) Choose values you''re promising when you select Minimum Required
    API 8 and Target SDK API 16, see the nearby sidebar, "Using Android versions."


    To find out what you''re correctly when you select Minimum Required SDK API 8
    and Target SDK API 16, see Figure 4-1, I accept the defaults offered to me — API
    8, API 16, and API 17. You can select any values from the drop-down boxes as you''ve
    created an Android Virtual Device (AVD) that can run the target''s projects. For
    example, an Android 2.3.3 AVD can run projects targeted to earlier versions of
    Android, such as Android 2.3.1, Android 2.2, and Android 1.6. The project target
    doesn''t have to be an exact match with any Android AVD.


    # Using Android versions


    Android has a few different uses for version numbers. For example, in Figure 4-1,
    the minimum required SDK is API 8 and the target SDK is API 16. What''s the difference?


    You design an Android app to run on a range of API versions. You can think informally
    of the minimum SDK version as the lowest version in the range, and the target
    version as the highest. So if you select API 8 as the minimum SDK and API 16 as
    the target, you design an app to run on API levels 8 through 16.


    But the lowest-highest-version idea needs refining. The official documentation
    reports that "... new versions of the platform are fully backward-compatible."
    So an app that runs correctly on API 8 should run correctly on all versions higher
    than API 8. (I "should run correctly" because, in full backward compatibility
    is difficult to achieve. Anyway, if Android is willing to provide full backward
    compatibility, I''m coming to you.)


    The target version (s) is API 16 in Figure 4-1 is for the version when you test
    the app. When you run this chapter''s example, Eclipse opens an emulator with
    API 16 or higher. (For example, if you''ve created an AVD whose API level is 17
    but you have NO AVD whose API is 16, Eclipse opens the emulator with API 17.)
    To ensure that your app works, the testing runs correctly on devices that run
    API 16 (also known as Android 4.1). What differences do other versions of Android
    bring?


    This list provides an example:


    +   - The target version is API 16, but the app uses only features that are available
    in API 8 and earlier. In that case, you can put the number 8 in the Minimum Required
    SDK field.

    - The app uses some features available only in API 16 and later, but the app contains
    workarounds for API 8: (The app''s code can detect the Android version and provide
    alternative code for different versions). You can put the number 8 in the Minimum
    Required SDK field.

    - The target version is API 16. In 2019, someone installs your app on a device
    running API 99 (code-named Zucchini Bean). Because of backward compatibility,
    the app runs awkwardly on the API 99 device. Then the app''s target version API
    16 isn''t truly the upper limit.


    When you select a target version and minimum SDK version, Android stores these
    numbers in the project''s AndroidManifest.xml file. You can see the AndroidManifest.xml
    file in the project''s tree in the Package Editor in Eclipse.'
