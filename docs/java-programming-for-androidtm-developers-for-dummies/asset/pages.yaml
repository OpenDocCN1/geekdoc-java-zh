    # Android animation


    Android has two types of animation:


    +   * **View animation:** An older system in which you animate with either tweening
    or frame-by-frame animation, as described in this:

    * **Tweening:** You tell Android how an object should look initially and how the
    object should look eventually. You also tell Android how to change from the initial
    appearance to the eventual appearance. (Is the change gradual or sudden? If the
    object moves, does it move in a straight line or in a curve of some sort? Will
    it bounce a bit when it reaches the end of its path?)

    * **Frame-by-frame animation:** You provide several snapshots of the object along
    its path. Android displays these snapshots in rapid succession, one after another,
    giving the appearance of movement or another change in the object''s animation.


    With tweening, Android considers all your requirements and figures out exactly
    how the object looks between the start and the finish of the object''s animation.


    Movie cartoons are the classic example of frame-by-frame animation even though,
    in modern'
