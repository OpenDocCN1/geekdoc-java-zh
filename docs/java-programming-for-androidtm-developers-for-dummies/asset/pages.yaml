    +   - **A Java virtual machine**

    Cool people refer to this item as the JVM or simply as Java.

    - **The Java code libraries**

    These code libraries are known affectionately as the Java Runtime Environment
    (JRE) or simply as Java.

    - **An integrated development environment**

    You can create Java programs using geeky, keyboard-only tools, but eventually
    you''ll tire of'
