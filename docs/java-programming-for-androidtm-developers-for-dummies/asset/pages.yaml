  md: "# Access for fields and methods\n\nA class can have public access or nonpublic\
    \ (default) access. But a member of a class has four possibilities: public, private,\
    \ default, and protected.\n\nA class's fields and methods are the class's members.\
    \ For example, the class in Listing 9-10 has five members: the fields kind, weight,\
    \ daysAged, and isDomestic and the method displayBag.\n\nHere's how member access\
    \ works:\n\n+   - A default member of a class (a member whose declaration doesn't\
    \ contain the words public, private, or protected) can be used by any code inside\
    \ the same package as that class.\n- A private member of a class cannot be used\
    \ in any code outside the class.\n- A public member of a class can be used wherever\
    \ the class itself can be used; that is:\n  - Any program to refer to a public\
    \ member of a public class.\n  - For a program to reference a public member of\
    \ a default access class, the program must be inside the same package as the class.\n\
    \nTo see these rules in action, check out the public class in Listing 9-16.\n\n\
    | Listing 9-16: A Class with Public Access |\n\n```\npackage org.allycode.bank;\n\
    \npublic class Account {\n    public String customerName;\n    private int internalIDNumber;\n\
    \    String address;\n    String phone;\n    public int socialSecurityNumber;\n\
    \    int accountType;\n    double balance;\n\n    public static int findById(int\
    \ internalIDNumber) {\n        Account foundAccount = new Account();\n       \
    \ // Code to find the account goes here.\n        return foundAccount.internalIDNumber;\n\
    \    }\n}\n```\n\nThe code in Figures 9-21 and 9-22 uses the Account class and\
    \ its fields."
