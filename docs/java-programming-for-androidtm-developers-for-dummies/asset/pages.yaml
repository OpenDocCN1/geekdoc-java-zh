  md: '# The Twitter4J API jar file


    Android has no built-in support for communicating with Twitter. Yes, the raw materials
    are contained in Android''s libraries, to deal with all of Twitter''s requirements,
    someone has to paste those raw materials in a useful way. Fortunately, several
    developers have done all the pasting and made their libraries available for you
    to use. The library I use in this is Twitter4J. Its website is http://twitter4j.org.


    Chapter 4 describes the role of .jar file in Java program development. For this
    chapter''s example to work, your project must include a .jar file containing the
    Twitter4J libraries. If you''ve successfully imported this book''s code into Eclipse,
    the 13-01 project contains the necessary .jar file.


    If you''re creating this chapter example on your own, or if you''re having trouble
    with the project''s existing .jar files, you can add the Twitter4J libraries by
    following these steps:


    +   1. Visit http://twitter4j.org.


    +   2. Find the link to download the latest stable version of Twitter4J.


