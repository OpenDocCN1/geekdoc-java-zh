  md: "variable bag1 doesn't contain \"Cheddar\" 2.43 30 true. The variable bag1 contains\
    \ the information required to locate the \"Cheddar\" 2.43 30 true object. The\
    \ variable bag1 stores information that refers to the \"Cheddar\" 2.43 30 true\
    \ object.\n\n![](img/1a069ca97cef403f3540be3fe27c5eda_227_0.png)\n\nThe types\
    \ int, double, boolean, char, byte, short, long, and float are primitive types.\
    \ A primitive variable (int daysaged, double weight, boolean, and isDomestic,\
    \ for example) stores a value. In a contrast, a class is a reference type, as\
    \ String, which is defined in Java's API, and which you or I declare ourselves.\
    \ A reference type variable (BagOfCheese bag and String kind, for example) refers\
    \ to an object.\n\n![](img/1a069ca97cef403f3540be3fe27c5eda_227_1.png)\n\nFigure\
    \ 9-15 would be slightly more accurate (a bit more complicated) if the bottommost\
    \ box contained a picture of a hand followed by the values 2.43 30. The hand would\
    \ point outside of the box to the string \"Cheddar\".\n\n![](img/1a069ca97cef403f3540be3fe27c5eda_227_2.png)\n\
    \nIn this section, I say that the bag1 variable refers to the \"Cheddar\" 2.43\
    \ 30 true object. It's also common to say that the bag1 variable points to the\
    \ \"Cheddar\" 2.43 30 true object. Alternatively, you can say that the bag1 variable\
    \ stores the number of the memory address where the \"Cheddar\" 2.43 30 true object's\
    \ value begins. Neither the programming language nor the memory language expresses\
    \ the truth of matter, but if the rough terminology helps you understand what's\
    \ going on, there's no harm in using it.\n\n# Pass by reference\n\nIn the previous\
    \ section, I emphasize that classes are reference types. A variable whose type\
    \ is a class contains something that refers to blah, blah, blah. You might ask,\
    \ \"Why should I care?\"\n\nLook at Listing 7-4, over in Chapter 7, and notice\
    \ the result of passing a primitive type to the method:\n\nWhen the method's body\
    \ changes the parameter's value, the change has no effect on the value of the\
    \ variable in the method call.\n\nThis principle holds true for reference types\
    \ as well. But in the case of a reference type, the value that's passed is information\
    \ about where to find an object, not the object itself. When you pass a reference\
    \ type in a method's parameter list, you can change values in the object's fields.\n\
    \nSee, for example, the code in Listing 9-12.\n\n# Listing 9-12: Another Day Goes\
    \ By\n\n```\npackage com.allmycode;\n\npublic class CreateBags {\n    public static\
    \ void main(String[] args) {\n        BagOfCheese bag1 =\n```"
