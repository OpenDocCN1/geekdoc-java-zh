    According to the precedence rules, in the absence of parentheses, the computer
    evaluates && before evaluating ||. If you omit the parentheses, the computer first
    checks to find out whether 65 <= age && !!isSpecialShowing. Then the computer
    combines the result with a test of the age < 18 condition. Imagine a 16-year-old
