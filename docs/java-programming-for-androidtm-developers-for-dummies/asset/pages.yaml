  md: '# DON''T DO THIS!!


    ```

    TextView;

    view = findViewById(R.id.textView);

    ```


    Java lets a resounding, resentful roar: "How dare you assume that the object returned
    by a call to findViewById refers to an instance of the TextView class!" (Actually,
    Java quietly and mechanically displays an error message in Eclipse''s editor.
    But I like to personify Java as though it''s a stern taskmaster.)


    In Listing 11-1, you appease the Java gods by adding a casting operator to the
    code. You tell Java to convert whatever pops out of the findViewById method call
    into a TextView object.


    ```

    textView = (TextView) findViewById(R.id.textView1);

    ```


    While you''re typing the code, Java humours you and says, "Your casting means
    you''re aware of the difference between a TextView and an old View. I will do
    my best to interpret the view object that I find at runtime as a TextView object."
    (Actually, while you''re typing the code, Java says nothing. The fact that Java
    doesn''t display any error messages when you use this casting is a good sign.
    Java''s casting feature saves the day!)


    ![](img/1a069ca97cef403f3540be3fe27c5eda_289_0.png)


    Casting prevents you from seeing an error message while you develop your code.
    In that way, casting is quite a useful feature of Java. But casting can''t save
    you if your code contains runtime errors. In Step 7, you verify that the name
    represents a TextView widget. When the app runs, Java grabs the R.id.textView1
    widget from the activity_main.xml file, and everything works fine. But sometimes
    you forget to check your Java names against the widgets in the XML file. A call
    to findViewById spots out an ImageWidget when you are casting Java to expect a
    TextView widget. When this happens, Java chokes on the casting operator and your
    app crashes during its run. Back to the drawing board!


    ![](img/1a069ca97cef403f3540be3fe27c5eda_289_1.png)


    For a more complete discussion of casting, see Chapter 7.


    # Introducing Inner Classes


    Does the diagram in Figure 11-66 seem unnecessarily complicated? Look at all those
    arrows! You might expect to see a few somersaults as the caller object bounces
    from place to place! The listener (refer to Listing 11-2) devotes much of its
    code to obsessively keeping track of this object. Is there a simpler way to handle
    a simple click?


    There is. You can define a class inside another class. When you do, you''re creating
    an inner class. It''s a lot like any other class. But within an inner class''s
    code, you can refer to the enclosing fields with none of the froufrou Listing
    11-2. That''s why, at the beginning of this chapter, I sing the praises of insider
    knowledge.'
