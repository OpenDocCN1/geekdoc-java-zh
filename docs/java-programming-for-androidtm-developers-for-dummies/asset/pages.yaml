  md: 'Of course, in print, you can''t see me twisting my head. I need some other
    way to set a thought in a corner by it icons. When you see a Tip icon or a Remember
    icon, you know that I''m taking a quick detour


    Here''s a list of icons that I use in this book:


    +   - A tip is an extra piece of information — helpful advice that the other books
    may forget to tell you.


    +   - Everyone makes mistakes. Heaven knows that I''ve made a few in my time.
    Anyway, when I think people are especially prone to make a mistake, I mark the
    text with a Warning icon.


    +   - Question: What''s stronger than a tip but not as strong as a warning?


    Answer: A Remember icon.


    +   - “If you don''t remember what-and-such means, see blah-blah-blah,” or "For
    more information, read blahbity-blah-blah.\”


    +   - This icon calls attention to useful material that you can find online. (You
    don''t have to wait long to see one of these icons. I use one at the end of this
    introduction!)


    - Occasionally, I run across a technical tidbit. The tidbit may help you understand
    what the people behind the scenes (the people who created Java) were thinking.
    ...


    # Beyond the Book


    We have written a list of extra content that you won''t find in this book. Go
    online to find the following:


    +   - Dummies.com online articles: Be sure to check out [www.dummies.com/extras/javaprogrammingforandroiddevelopers](https://www.dummies.com/extras/javaprogrammingforandroiddevelopers)
    for additional online content dealing with weird Java and Android app development.
    Here''ll find examples of delightfully weird code, a disquisition on classes and
    objects, a quick look at Android Asset Studio, an additional Parts of Ten chapter,
    and more. And, if we have to post any updates to this edition of Java Programming
    for Android Developers For Dummies, here''s where you''ll find them.'
