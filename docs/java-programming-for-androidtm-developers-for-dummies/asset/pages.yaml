  md: "It's an Android Activity.\n\nA typical Android app displays one screen at a\
    \ time, as shown in Figure 10-16. A screenshot of material may present the list\
    \ of options and a Start button. The next screen (after the user clicks Start,\
    \ for example) shows some helpful information, as a map, a video, or a list of\
    \ items for sale. When the user touches on this information screen, the app's\
    \ display changes to reveal a third screen, showing detailed information about\
    \ whatever option the user selected. Eventually, the user dismisses the detail\
    \ screen by clicking the Back button.\n\nIn Android terminology, each screen of\
    \ material is an activity. As the user progresses through the sequence of screens\
    \ displayed in Figure 10-16, Android displays three activities. (It displays the\
    \ middle activity twice — once after the user clicks Start and a second time after\
    \ the user dismisses the detailed-info activity.)\n\n![](img/1a069ca97cef403f3540be3fe27c5eda_273_0.png)\n\
    \nFigure 10-16: Android displays a sequence of screens.\n\nAndroid develops all\
    \ activities at the time, so the creators of Android have created an Activity\
    \ class. The Activity class is part of Android's Application Programming Interface\
    \ (API), the enormous library of classes that's available to every Android developer.\
    \ You download the Android API when you follow the instructions in Chapter 2.\n\
    \nIn Chapter 4, you create a brand-new Android app. Eclipse creates some skeletal\
    \ code (enough to run a simple \"Hello\" program). I copied this skeletal code\
    \ in Listing 10-17.\n\n# Listing 10-17: Eclipse Creates a Main Activity\n\n```\n\
    package com.myfirstandroidapp;\n\nimport android.os.Bundle;\nimport android.app.Activity;\n\
    import android.view.Menu;\n\npublic class MainActivity extends Activity {\n\n\
    \    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n   \
    \     super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
    \    }\n```"
