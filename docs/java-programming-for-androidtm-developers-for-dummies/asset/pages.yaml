  md: '```

    DON''T DO THIS:

    ArrayList<int> arrayList = new ArrayList<int>();

    ```


    because it is a primitive type. Fortunately, each of Java''s primitive types has
    a wrapper type, which is a reference type whose purpose is to contain another
    type''s value. For example, an object of Java''s Integer type contains a single
    int value. An object of Java''s Double contains a single double value. An object
    of Java''s Character type contains a single char value. You can''t create an ArrayList
    of it, but you can create an ArrayList of Integer values.


    ```

    // THIS IS OKAY:

    ArrayList<Integer> arrayList = new ArrayList<Integer>();

    ```


    Every primitive type''s name begins with a lowercase letter. Every wrapper type''s
    name begins with an uppercase letter.


    In addition to containing primitive values, wrapper classes provide useful methods
    for working with primitive values. For example, the Integer wrapper class contains
    parseInt and other useful methods for working with int values:


    ```

    String string = "17";nint number = Integer.parseInt(string);

    ```


    On the downside, working with wrapper types can be clumsy. For example, you can''t
    use arithmetic operators with Java''s numeric wrapper types. Here''s the way I
    usually create two Integer values and add them together:


    ```

    Integer myInteger = new Integer(3);

    Integer myOtherInteger = new Integer(15);


    Integer sum =

    myInteger.intValue() + myOtherInteger.intValue();

    ```


    # Stepping through a collection


    The program in Listing 12-1 uses a loop with indices to step through a collection.
    The code does what it''s supposed to do, but it''s a bit awkward. When you''re
    piling objects into a collection, you shouldn''t have to worry about which object
    is first in the collection, which is second, and which is third, for example.


    Java has two features that make it easier to step through a collection of objects.
    One feature is the iterator. Listing 12-5 shows how an iterator works.


    # Listing 12-5: Iterating through a Collection


    ```

    package com.allcode.collections;


    import java.util.ArrayList;

    import java.util.Iterator;

    ```'
