  md: '# # The Developer Perspective


    Android is a multifaceted beast. When you develop for the Android platform, you
    use many toolsets. This section gives you a brief rundown.


    # ## Java


    James Gosling of Sun Microsystems created the Java programming language in the
    mid-1990s. (Sun Microsystems has since been bought by Oracle.) Java’s meteoric
    rise in usage stemmed from the elegance of the language and its well-conceived
    platform architecture. After a brief blaze of glory apples and the web, Java settled
    into being a solid, general-purpose language with a special strength in servers
    and middleware.


    In the meantime, Java was quietly seeping into embedded processors. Sun Microsystems
    was developing Java Mobile Edition (Java ME) for creating small apps to run on
    mobile phones. Java became a major technology in Blu-ray disc players. So the
    decision to make Java the primary development language for Android is no surprise.


    ![](img/1a069ca97cef403f3540be3fe27c5eda_24_0.png)


    An embedded processor is a computer chip that is hidden from the user as part
    of a special-purpose device. The chips in cars are now embedded processors, and
    the silicon that powers the photocopier at your workplace is an embedded processor.
    Pretty soon, the flower pots on your windowsill will probably have embedded processors.


    Figure 1-2 describes the development of Java versions over time. Like Android,
    each Java version has several names. The *product version* is an official name
    that’s used for the world in general, and the *developer version* is a number
    that identifies versions that programmers can keep track of. In casual conversations,
    developers use all kinds of names for the various Java versions. The *code name*
    is a more playful name that identifies a version while it’s being created.


    | Year | Product Version (Beta) | Developer Version | Codename | Features |

    |---|---|---|---|-|

    | 1995 | | JDK* 1.0 | | |

    | 1996 | | JDK 1.1 | | Inner classes, Java Beans, reflection |

    | 1998 | JSE* 1.2 | | Playground | Collections, Swing classes for creation of
    GUI interfaces |

    | 2000 | JSE 1.3 | | Kestrel | Java Naming and Directory Interface (JNDI) |

    | 2001 | | | | | |

    | 2002 | JSE 1.4 | | Merlin | New I/O, regular expressions, XML parsing |

    | 2004 | JSE 5.0* | 1.5 | Tiger | Generic types, annotations, enum types, enhanced
    |

    | | | | | for statement, static imports, new concurrency classes |

    | 2006 | Java SE* 6 | 1.6 | Mustang | Scripting language support, performance
    enhancements |

    | 2007 | | | | | |

    | 2008 | | | | | |

    | 2009 | | | | | |

    | 2010 | | | | | |

    | 2011 | Java SE 7 | 1.7 | Dolphin | Strings in switch statement, catching multiple
    exceptions |

    | 2012 | | | | | try statement with resources, integration with JavaFX |

    | 2013 | Java SE 8 | 1.8 | | Lambda expressions |'
