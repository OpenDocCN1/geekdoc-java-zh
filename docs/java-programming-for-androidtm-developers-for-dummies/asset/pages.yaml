    In common English usage, an insider is someone with information that’s not available
    to most people. An insider gets special information because of their position
    within an organization. American culture has many references to insiders. Author
    John Gunther became famous for writing Inside Europe and Inside Africa and other
    books in his Inside series. On TV crime shows, an inside job is a theft or a murder
    committed by someone who works in the victim’s own company. So significant is
    the power of inside information in most countries, insider stock trading is illegal.
    In the same way, a Java class can live inside another Java class. When this happens,
    the inner class has useful insider information. This explains why.


    # The First Button-Click Example


    Ever had wonderful old joke about a circus acrobat jumping over mice? Unfortunately,
    I’d get sued for copyright infringement if I included it in this book. Anyway,
    the joke is about starting small and working your way up to bigger things. That’s
    what you do when you read Java Programming For Android Developers For Dummies
    Most of the programs in this book aren’t Android apps. Instead, the programs are
    Oracle Java apps—that run on a desktop or a laptop computer, not on an Android
    device. In fact, the OptionPane.showMessageDialog method I use in many of this
    book’s examples runs only on a desktop or laptop, not on Android. Why does a book
    with the word Android featured prominently in its title contain many examples
    that don’t run on phones or tablet devices? The answer is you must always start
    practicing by jumping over small. Compare the sets of instructions in Chapters
    3 and 4, and notice how much more work is involved in learning a Hello World Android
    app. When you are creating several Android apps, you become accustomed to the
    eccentricities of Android’s emulator. When you’re learning Java, you don’t want
    an emulator’s quirks to get in the way. Java is Java, whether it’s a standard
    Java app to display the words Hello World or an Android app to send a spaceship
    to another.


    Anyway, when you reach Chapter 11, you’re ready to see some Java features running
    on a phone or on a phone emulator. This chapter’s example, simple though it is,
    is specific to'
