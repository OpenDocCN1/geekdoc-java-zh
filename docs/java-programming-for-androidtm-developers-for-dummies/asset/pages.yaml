  md: '# The restarts whenever you change the device''s orientation.


    If you tilt the device from Portrait mode to Landscape, or from Landscape mode
    to Portrait mode, Android calls the main activity''s lifecycle methods. Android
    calls the activity''s onPause, onStop, and onDestroy methods. It reconstitutes
    the activity by calling the activity''s onCreate, onStart, and onResume methods.
    As a result, whatever progress you''ve made in the game disappears and the game
    starts itself over from scratch.


    ![](img/1a069ca97cef403f3540be3fe27c5eda_352_0.png)


    For an introduction to an activity''s lifecycle methods, see Chapter 5.


    +   The game has no Restart button.


    To play the second time, you can press Android''s Back button and then touch the
    game''s launcher icon. Alternatively, you can tilt the device from Portrait mode
    to Landscape mode, or vice versa.


    +   The screen measurements that control the game are crude.


    Creating a visual app that involves drawing, custom images, or motion of any kind
    involves some math. You need math to make measurements, estimate distances, detect
    collisions, and complete other tasks. To do the math, you produce numbers by making
    Android API calls, and you use the results of your calculations in Android API
    library calls.


    To help me quickly to the chase, my Hungry Burds game does only a minimal amount
    of math, and it makes only the API calls I believe to be absolutely necessary.
    As a result, some items on the screen always look like their best. (This happens
    particularly when the device is in Landscape mode.)


    +   The game has no settings.


    The number of Burds, the average time of each Burd''s display, and the minimum
    length of time for each Burd''s display are all hard-coded in the Java file. In
    the code, these constants are NUMBER_OF_BURDS, AVERAGE_SHOW_TIME, and MINIMUM_SHOW_TIME.
    As a developer, you can change the values in the code and reinstall the game.
    But the ordinary player can change these numbers.


    +   The game is not challenging with the default NUMBER_OF_BURDS, AVERAGE_SHOW_TIME,
    and MINIMUM_SHOW_TIME values.


    I admit it: On this front, I''m at a distinct disadvantage. I''m a lousy game
    player. I remember competing in video against my kids when they were young. I
    lost every time. At first it was embarrassing; in the end it was ridiculous. I
    could never avoid being shot, eaten, or otherwise squashed by my young opponents''
    avatars.


    I don''t presume to know what values of NUMBER_OF_BURDS, AVERAGE_SHOW_TIME, and
    MINIMUM_SHOW_TIME are right for you. And if there are no values for right (and
    the game isn''t to play no matter which values you have), I''ve created Hungry
    Burds as a teaching tool, not as a replacement for Super Mario.


