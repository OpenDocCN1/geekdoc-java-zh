    Cancel button, but the program doesn''t respond. Yes, this is a great way to guarantee
    a 1-of-5 rating at Google Play (it app store).


    To fix the problem, you take advantage of somebody''s TimerCommon class, a general-purpose
    class that sleeps for a certain period on behalf of your program. While the TimerCommon
    sleeps, your program can remain awake, responding to the user''s clicks, taps,
    inputs, swipes, or whatever.


    (By the way, the TimerCommon class isn''t part of the Java API. Somebody posted
    the TimerCommon class on the web along with a note permitting any developer to
    use the code)


    When the TimerCommon object wakes up, the object calls one of your program''s
    methods. In this section''s example, your method is named alert(). Until the TimerCommon
    object calls your alert method, the method sits quietly in your program, doing
    nothing. Rather than execute the alert method, your program responds to the user''s
    requests. Slick!


