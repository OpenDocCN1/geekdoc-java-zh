  md: "# Java’s super keyword\n\nHere’s an excerpt from Listing 10-15:\n\n```\npublic\
    \ class Reminder extends Appointment\nimplements Alertable {\n\n    public Reminder(String\
    \ name, Calendar when)\n        super(name, when);\n        new TimerCommon(this,\
    \ name, when);\n}\n```\n\nIn Listing 10-15, the word super stands for the *superclass’s\
    \ constructor*. In particular, the call super (name, when) tells Java to find\
    \ the subclass of the current class, to call that subclass’s constructor, and\
    \ to feed the parameter values name and when to the constructor.\n\nMy Reminder\
    \ class extends the Appointment class (refer to Listing 10-14). So in Listing\
    \ 10-15, the call super (name, when) invokes one of the Appointment class’s constructors.\n\
    \nOf course, the Appointment class had a better constructor whose types match\
    \ the superclass’s parameter types (String for name and Calendar for when). Otherwise,\
    \ the Eclipse editor displays lots of red marks. Fortunately, the Appointment\
    \ class in Listing 10-14 has the appropriate two-parameter constructor.\n\n```\n\
    public Appointment(String name, Calendar when)\n    this.name = name;\n    this.when\
    \ = when;\n```\n\n# What Does This Have to Do with Android?\n\nEmployees and consultants\
    \ make good examples of classes and subclasses. But at this point in the book,\
    \ you might be interested in a more practical programming example. How about an\
    \ Android app? The first example is ruefully simple, but it’s one that an Android\
    \ programmer sees every day.\n\n![](img/1a069ca97cef403f3540be3fe27c5eda_272_0.png)"
