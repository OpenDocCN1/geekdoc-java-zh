  md: 'In the OAuth world, an app whose code communicates with Twitter’s servers is
    a consumer. To identify itself as a trustworthy consumer, an app must send passwords
    to Twitter’s servers. In OAuth terminology, these passwords are called the *consumer
    key* and the *consumer secret*.


    5. On that same web page, select your application''s Settings tab.


    6. Among the settings, look for a choice of access types. Change your app’s access
    from Read Only (the default) to Read, Write and Access Direct Messages.


    For this toy application, you select Read, Write and Access Direct Messages —
    the most permissive access model that’s available. This option prevents you from
    hitting brick walls because of access problems. When you develop a real-life application,
    you do the opposite — you select the least permissive option that suits your application’s
    requirements.


    First change your app’s access level, and then create the app’s access token (as
    explained in Step 9). Don’t create the access token before changing the access
    level. If you try to change the access level after you’ve created the access token,
    your app won’t work. What’s worse, the dev.twitter.com page won’t warn you about
    the problem. Believe me — I’ve wasted hours of my life on this Twitter quirk.


    7. Click the button that offers to update your application’s settings.


    Doing so changes your app’s access level to Read, Write and Access Direct Messages.


    8. Return to your application’s Details tab.


    I’m not thrilled with the way Twitter’s developer site works. A title near the
    top of the Settings tab reads *Application Details*, and there’s no title near
    the top of the Details tab. Anyway, find the Details tab and click on the button
    that offers to create your access token.


    9. Click the button to create your access token.


    After doing so, your app’s Details tab now displays your app’s access token and
    the access token secret, in addition to your app’s access level, consumer key,
    and consumer secret.


    10. Copy the four codes (Consumer Key, Consumer Secret, Access Token, and Access
    Token Secret) from your app’s Details tab to the appropriate lines in your `twitter4j.properties`
    file.


    Whew! You’re done creating your twitter4j.properties file!


