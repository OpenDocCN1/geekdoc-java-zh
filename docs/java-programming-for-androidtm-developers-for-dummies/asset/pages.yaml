    # # The Many Faces of Android


    Version numbers can be tricky. My PC''s model number is T420. When I download
    the users'' guide, I download one guide for any laptop in the T420 series (No
    guide specifically addresses the T420, let alone the T420s.) But when I have driver
    problems, knowing that I have a T420s is not enough. I need drivers that are specific
    to my laptop''s seven-digit model number. The moral of this story: What constitutes
    a “version number” depends on who''s asking for the number.


    With that in mind, you can see a history of Android versions in Figure 1-1.


    A few notes on Figure 1-1 are in order:


    +   - The platform number is of interest to the consumer and to the company that
    sells the hardware.


    If you''re buying a phone with Android 4.2.2, for example, you might want to know
    whether the vendor will upgrade your phone to Android 4.3.'
