  md: '# On creating an activity, you find out what was going on when the activity
    was last destroyed.


    The parameter savedInstanceState stores information about what was going on when
    the activity was last destroyed. If the savedInstanceState contains meaningful
    information, it''s because the activity was destroyed in the middle of a run.
    Maybe the user tilted the device sideways, causing the activity to be destroyed
    and then re-created in Landscape mode. (See Chapter 5.).


    In Listing 10-17, you feed the information in the savedInstanceState parameter
    to the code''s superclass, which is Android''s Activity class. In turn, the Activity
    class''s constructor does all kind of useful things with savedInstanceState. Among
    other things, the Activity class''s constructor restores more of your activity
    to the state it was in when your activity was last destroyed.


    The MainActivity class inherits a setContentView method from the Activity class.


    A call to the setContentView method''s parameter is a code number (as described
    in a sidebar Chapter 4). The setContentView method looks up that code number and
    finds an XML file in your project''s res\layout directory. (In this example, the
    filename is activity_main.xml). The method then inflates the XML file: That is,
    the method interprets the XML file''s text as the description of a nice-looking
    arrangement of items on the user''s screen. This arrangement becomes the overall
    look of your activity''s screen.


    The MainActivity class overrides the Activity class''s onCreateOptionsMenu method.


    At some point during the display of MainActivity on the screen, Android creates
    the activity''s Options menu. (Normally, the user opens the Options menu by touching
    an icon containing a few dots or dashes.). In Listing 10-17, the call to inflate
    once again returns the text from an XML file (res\menu\main.xml) into a bunch
    of menu items and menu actions. The onCreateOptionsMenu method returns true, which
    means, "Yes, I have done all that I have to do in setting up the activity''s Options
    menu." (A false value would indicate that other code must do for the follow-up
    work to help set up the Options menu.)


    So much for Eclipse''s autogenerated app. In the next few chapters, I introduce
    Java features, and I show you how to build more functionality on top of the autogenerated
    Android app.'
