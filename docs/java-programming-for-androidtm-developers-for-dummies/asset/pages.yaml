    later version, it''ll properly work. But I make no promises about the backward
    compatibility, forward compatibility, or sideways compatibility of the various
    Twitter4J versions. If my example doesn''t run properly for you, you can search
    the Twitter4J site for a download link to 3.0.3.


    +   3. Click the link to download the Twitter4J software.


    The file that I downloaded is twitter4j-3.0.3.zip.


