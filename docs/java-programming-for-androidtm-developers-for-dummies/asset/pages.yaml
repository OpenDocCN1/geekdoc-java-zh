    # # What if . . .


    You try to run your first Android app. If your effort stalls, don''t despair.
    This section has some troubleshooting tips.


    # ## Error message: R cannot be resolved


    Every Android app has an R.java file. The Android development tools generate this
    file automatically, so normally you don''t have to worry about R.java. Occasionally,
    the file takes longer than ever to be generated. In this case, Eclipse references
    to the R class in the rest of the project''s code and complains that the project
    has no R class. My advice is to wait.'
