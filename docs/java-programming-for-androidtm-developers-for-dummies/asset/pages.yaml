  md: 'And here''s what the [Listing 5-6]()says” to your Android device:


    **The code**''s action element indicates that the program is set forth in [Listing
    5-5](com.allcode.myfirstandroid.MainActivity class) is MAIN.


    That is, the program in [Listing 5-5]() is the starting point of an activity''s
    execution. In response to this, your Android device reaches back inside the listing
    and executes the listing''s onCreate method, on onCreateOptionsMenu method, and
    other methods that do not appear there.


    **The code**''s category element adds an icon to the device''s Application Launcher
    screen.

    On Android devices, users use the Home screen. Then, by touching one element or
    another on the Home screen, the user gets to see the Launcher screen, which contains
    several apps'' icons. By scrolling this screen, the user can find an appropriate
    app''s. When the user taps the icon, the app starts running.


    In [Listing 5-6](), the category element''s LAUNCHER value makes an icon for running
    com.allcode.myfirstandroidapp.MainActivity (the Java program in [Listing 5-5]())
    available on the device''s Launcher screen.


    So there you have it. With your proper secret (namely, the action and category
    elements in the AndroidManifest.xml file), an Android program''s onCreate and
    onCreateOptionsMenu methods become the program''s starts of execution.


    # Extending a class


    In [Listing 5-5](), the words extends and @Override tell an important story —
    a story that applies to all Java programs, not only to Android apps. The words
    extends and @Override tell the story of a class in the Android API. The API''s
    android.app.Activity class forms the basis of all Android applications.


    In Android developer lungo, an activity is one “screenful” of components. Each
    Android activity can contain many activities. For example, an app''s initial activity
    may list the films playing in your neighborhood. When you click a film''s title,
    Android covers the entire list with another activity (perhaps an activity displaying
    a relevant film review).


    When you extend the android.app.Activity class, you create a new kind of Android
    activity. In [Listing 5-5](), the extends extends tells the computer that a MainActivity
    is, in fact, an example of an Android Activity. That''s good because the folks
    at Google have already written more than 5,000 lines of Java code to describe
    what an Android Activity can do. Being an example of an Activity in Android means
    you can take advantage of all its prewritten code.


    ![](img/1a069ca97cef403f3540be3fe27c5eda_133_0.png)


    When you extend an existing Java class (such as the Activity class), you create
    a new class with the existing class''s functionality. For details of this important
    concept, see [Chapter 10]().


    # Overriding methods


    In [Listing 5-5](), a MainActivity is a kind of Android Activity. So a MainActivity
    is automatically a screenful of components with lots and lots of handy, prewritten
    code.'
