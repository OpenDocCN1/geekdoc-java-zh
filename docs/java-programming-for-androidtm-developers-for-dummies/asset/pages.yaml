  md: "4-1 and 4-2 contain XML documents. Unlike an HTML document, every XML document\
    \ consists of tags (angle-bracketed descriptions of various pieces of information).\
    \ Unlike an HTML document, an XML document does not necessarily describe a display\
    \ page.\n\nHere are some examples of text surrounded by angle brackets:\n\n+ \
    \  * A tag consists of three tags: the first tag is the `<RelativeLayout ... >`\
    \ tag, the second tag is the `<TextView ... >` tag, and the third tag is the `</RelativeLayout>`\
    \ tag.\n* For the example, in the code Listing 4-2\n* An XML document may have\
    \ three different kinds of tags: start tags, empty tags, and end tags.\n* A start\
    \ tag begins with an open bracket and a name. A start tag's last character is\
    \ a closing bracket.\nThe first tag in Listing 4-2 (`<RelativeLayout ... >` on\
    \ lines 1–6) is a start tag. Its name is Relative.\nAn empty element begins with\
    \ an open bracket followed by a name. An empty element's last two characters are\
    \ a forward slash followed by a closing bracket.\nThe second tag in Listing 4-2\
    \ (`<TextView ... />` on lines 8–13 in the listing) is an empty element. Its name\
    \ is TextView.\n* An end tag begins with an open bracket followed by a forward\
    \ slash and a name. An end tag's last character is a closing bracket.\nThe third\
    \ tag in Listing 4-2 (`</RelativeLayout>` on the last line of the listing) is\
    \ an end tag. Its name is Relative.\n* An XML element has both a start and an\
    \ end tag, or it has an empty element.\nIn Listing 4-2, the document's Relative\
    \ element has both a start and an end tag. (Both the start and end tags have the\
    \ same name, so the name of the entire element is RelativeLayout.)\nIn Listing\
    \ 4-2, the document's TextView element has only one: an empty element.\n* Elements\
    \ are either nested inside one another or have no overlap.\nFor example, in the\
