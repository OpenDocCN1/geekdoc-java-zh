    # Those pesky filename extensions


    The filenames displayed in My Computer or in a Finder window can be misleading.
    You may browse a directory and the name Mortgage. The file''s real name is Mortgage.java
    Mortgage.class, Mortgage.somethingElse, or plain old Mortgage. Filenames ending
    as .zip, .java, and .class are filename extensions.


    The truth is that, by default, Windows and Macs hide many filename extensions.
