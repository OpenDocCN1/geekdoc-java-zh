  md: 'a well-established standard for encoding information of all kinds.


    For an overview of XML, see the sidebar that describes it in Chapter 4.


    Java is good for describing step-by-step instructions, and XML is good for describing
    the way things are (or the way they should be). A Java program says, “Do this
    and then do that.” In contrast, an XML document says, “It is this way and it''s
    that way.” Android uses XML for two purposes:


    +   - To describe an app''s data


    An app’s XML documents describe the layout of the app’s screens, the translations
    of the app into one or more languages, and other kinds of data.


    +   - To describe the app itself


    Every app has an AndroidManifest.xml file, an XML document that describe features
    of the app. A device’s operating system uses the AndroidManifest.xml document’s
    contents to manage the running of the app.


    For example, an app’s AndroidManifest.xml file describes code that the app makes
    available for use by other apps. The same file describes the permissions that
    the app requests from the system. When building a new app, Android displays these
    permissions and asks for your permission to proceed with the installation. (I
    don’t know about you, but I always read this list of permissions carefully. Yeah,
    right!)


    For more information about the AndroidManifest.xml file, see Chapter 4.


    Concerning XML, I have bad news and good news. The bad news is that XML is not
    always easy to compose. At best, writing XML code is boring. At worst, writing
    XML code is downright confusing. The good news is that automated software tools
    compose the world’s XML code. As an Android programmer, the software on your development
    computer compiles of your app’s XML code. You often tweak the XML code, read part
    of the code for information from its source, make changes, and compose brief additions.
    But you hardly ever create XML documents from scratch.


    # # Linux


    An operating system is a big program that manages the overall running of a computer
    or a device. Most operating systems are built in layers. An operating system’s
    outer layers are usually in the user’s face. For example, both Windows and Macintosh
    OS have standard desktops. From the desktop, the user launches programs, manages
    windows, and does other important functions.


    An operating system’s inner layers are (for the most part) invisible to the user.
    While the user plays Solitaire, for example, the operating system juggles processes,
    manages files, keeps an eye on security, and generally does the kinds of things
    that the user shouldn’t have to micromanage.


    At the deepest level of an operating system is the system’s kernel. The kernel
    runs directly on the processor’s hardware and does the low-level work required
    to make the processor run. In a truly layered system, higher layers accomplish
    by making calls to lower layers. An app with a'
