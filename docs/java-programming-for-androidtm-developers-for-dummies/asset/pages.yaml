    \ can't give him proper credit. I guess that's my mistake.\n\n# Putting Capital\
    \ Letters Where They Belong\n\nJava is a case-sensitive language, so you really\
    \ have to mind your Ps and Qs along with every other letter of the alphabet. Here\
    \ are some concepts to keep in mind when you create Java programs:\n\n+   - Java's\
    \ keywords are completely lowercase. For instance, in a Java statement, the word\
    \ if can't be If or IF.\n- When you use names from the Java Application Programming\
    \ Interface (API), the case of the names has to match what appears in the API.\n\
    - You also need to make sure the names you make up are capitalized throughout\
    \ the entire program. If you declare a myFunction variable, you can't refer to\
    \ it as MyAccount, account, or Myaccount. If you capitalize the variable name\
    \ two ways, Java thinks you're referring to two different variables.\n\nFor more\
    \ info on Java's case-sensitivity, see Chapter 5.\n\n# Breaking Out of a switch\
    \ Statement\n\nIf you don't break out of a switch statement, you get fall-through.\
