    # Error message: Unknown virtual device name


    Android looks for AVDs in the home directory''s .android/avd subdirectory, and
    occasionally the search goes away. For example, one of my Windows computers lists
    my home directory on i drive. My AVDs are in: \Users\Barry\.android\avd. But Android
    ignores the computer''s home directory and instead looks in c:\Users\Barry. When
    Android doesn''t find any AVDs, it complains.


    You can decide fancy solutions to this problem by using either junctions or symbolic
    links. Both of this kind require special handling of their. To keep it, I copy
    the contents of my i: \Users\Barry\.android to c:\Users\Barry\ to fix the problem.


    # Error message:INSTALL_PARSE_FAILED_INCONSISTENT_CERTIFICATE


    This error message indicates that an app you previously installed conflicts with
    the app you''re trying to install. So, on the emulator screen, navigate to the
    list of installed applications (which is usually an option on the Settings screen).
    In the list of applications, delete any apps that you previously installed.


    ![](img/1a069ca97cef403f3540be3fe27c5eda_95_0.png)


    Occasionally, you might have trouble finding previously installed apps from the
    Settings=Applications menus in the emulator. If you do, visit this book''s website
    (http://allmycode.com/Java4Android) for a geeky workaround solution.


    # The app starts, but the emulator displays the Force Close or Wait dialog box


    The formal name of the Force Close or Wait dialog box is Application Not Responding
    (ANR). Android displays the ANR dialog box whenever an app takes too long to do
    whatever it''s supposed to. When the app runs on a real device (a phone or a tablet),
    it shouldn''t make Android display the ANR dialog box.


    But on a slow emulator, seeing a few Force Close or Wait messages is par for the
    course. When I see the ANR dialog box in an emulator, I usually select Wait. Within
    about ten seconds, the dialog disappears and the app continues to run.


    # Changes to your app don''t appear in the emulator


    Your app runs and you want to make a few improvements. with emulator still running,
