    # ### Unchecked runtime exceptions


    You see no compile-time errors, but when you run the program, the run ends prematurely.
    Somewhere in the middle of the run, the instructions tell Java to do something
    that can''t be done. For example, when you''re running the program in the earlier
    section "A Running a Java Program," you type "1,000,000.00" and Java doesn''t
    like commas when it listens, so the program crashes and Eclipse displays a nasty-looking
    message, as shown in the first figure.


    ![](img/1a069ca97cef403f3540be3fe27c5eda_74_0.png)


    This example shows an **unchecked runtime exception** — the equivalent of telling
    you to turn right at the intersection when the only thing is a big, brick wall.
    The Eclipse editor doesn''t warn you about an unchecked runtime exception, until
    you run the program, the computer can''t predict that the error will occur.


    # ### Logic errors: You see no error markers in Eclipse, and when you run the
    program, the code runs to completion. But the answer isn''t correct. The program
