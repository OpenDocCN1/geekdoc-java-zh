  md: 'Recently, my department hired a new person. We offered a salary of $50K, (which
    we thought) meant $50,000 per year. Little did we know the new person is expected
    to be paid $51,200 each year. Computer scientists use the letter K (the prefix
    *Kilo*) to mean 1024 because 1,024 is a power of 2 (and powers of 2 are quite
    handy in computer science). The trouble is, the formal meaning of *Kilo* in the
    metric system is 1,000, not 1,024. To help clear things up (and to have fun creating
    new words), a commission of engineers created the *Kibibyte* (KiB) meaning 1,024
    bytes, the *Mebibyte* (MiB) which is 1,048,576 bytes, the *Gibibyte* (GiB), meaning
    1,073,741,824 bytes. Most people (computer scientists included) don''t know about
    KiBs or MiBs, and they don''t worry about the difference between MiBs and ordinary
    megabytes. I''m surprised that the creators of the Android Virtual Device Manager
    thought about this issue.


    **6. Leave the other choices at their defaults (or don''t, if you don''t want
    to) and click the Create AVD button.**


    The computer returns you to the Android Virtual Device Manager window, where you
    see a brand-new AVD in the list, as shown in Figure 2-19.


    And that does it! You''re ready to run your first Android app. I don''t know about
    you, but I''m excited. (Sure, I''m not watching you read this book, but I''m excited
    on your behalf.) Chapter 3 guides you through the run of a standard Oracle Java
    program, and Chapter 4 does the same for an Android application. Go for it!'
