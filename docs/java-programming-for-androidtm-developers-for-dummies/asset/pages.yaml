  md: 'To find out why you''d choose to overrideResume, see Chapter 14.


    When your phone ends an activity''s run, the phone calls three additional methods:
    the activity''s onCreate, onStop, and onDestroy. One complete sweep of your activity,
    from birth to death, involves the run of at least six methods — onCreate, then
    onStart, and onResume, and later onPause, then onStop, and finally, onDestroy.
    As it is with all life forms, "ashes to ashes, dust to dust."


    Don''t despair. For an Android activity, reincarnation is a common phenomenon.
    For example, if you''re running several apps at a time, the phone might run low
    on memory. In this case, Android can kill some running activities. As the phone''s
    user, you have no idea that any activities have been destroyed. When you navigate
    back to a killed activity, Android re-creates the activity for you and you''re
    none the wiser.


    Here''s another surprising fact. When you turn a phone from Portrait mode to Landscape
    mode, the phone destroys the current activity (the activity that''s in Portrait
    mode) and re-creates that activity in Landscape mode. The phone calls allall six
    of the activity''s lifecycle methods (onPause, onStop, and so on) in order to
    turn the activity''s display sideways. It is similar to starting on the transporter
    deck of the Enterprise and being a different person after being beamed down to
    the planet (except that you act like yourself and think like yourself, so no one
    knows that you''re a completely different person).


    Indeed, methods like onCreate and onCreateOptionsMenu in Listing 5-5 are the workhorses
    of Android development.'
