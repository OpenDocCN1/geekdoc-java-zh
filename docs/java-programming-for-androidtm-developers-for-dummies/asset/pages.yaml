    # # Assignments and initialization


    Both type declarations in Listing 6-1 end with an initialization. As the name
    suggests, an initialization sets a variable to its initial value. In both declarations,
    I initialize the variable to the value 74.


    You can create a type declaration without an initialization. For example, I can
    change the code in Listing 6-1 so that the first four lines inside the main method
    look like this:


    ```

