    \nimport java.util.Calendar;\n\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        Calendar when = Calendar.getInstance();\n        when.add(Calendar.SECOND,\
    \ 5);\n        new Reminder(\"Take a break!\", when);\n    }\n}\n```\n\nThe call\
    \ to beep() in Listing 10-15 makes some sort noise (no big surprise). But you\
    \ might want to know a bit about the details. Java has a Toolkit class with a\
    \ static getDefaultToolkit method. A call to Toolkit.getDefaultToolkit() returns\
    \ a connection to the user's operating system. This connection (an instance of\
    \ the Toolkit) has its own beep method. There! Now you know.\n\nAs in your case,\
    \ my implement the Alertable interface and have an alert(String message) method.\
    \ In Listing 10-15, my Reminder object passes itself (this) to a new TimerCommon\
    \ object. Because the TimerObject class's code expects the first constructor parameter\
    \ to be Alertable, everything is okay. The TimerCommon sleeps until it's time\
    \ to remind the user. At the appropriate time, the TimerCommon calls my object's\
    \ alert method — again, the use of an interface adds versatility to the code by\
    \ cutting class/subclass lines, as shown in Figure 10-15."
