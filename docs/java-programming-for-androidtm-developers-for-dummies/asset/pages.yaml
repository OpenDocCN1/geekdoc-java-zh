  md: '# # Chapter 3


    # # Running Standard Java Programs


    **In This Chapter**


    +   - Compiling and running a program

    - Working with a workspace

    - Editing your own Java code


    If you’re a programming newbie, running a program probably means, for you, clicking
    the mouse. You want to run Internet Explorer, so you double-click the Internet
    Explorer icon. That’s all there is it. As far as you’re concerned, Internet Explorer
    is a black box. How the program does whatever it does is none of your concern.


    When you create your program, the situation is a bit different. You start with
    no icon to click, and possibly no well-defined notion of what the program should
    (and should not) do.


    So do you create a brand-new Java program? Where do you click? How do you save
    your work? How do you get the program to run? What do you do if, at first, the
    program doesn’t run correctly?


    This chapter tells you what you need to know.


    ![](img/1a069ca97cef403f3540be3fe27c5eda_60_0.png)


    The example in this chapter is a *standard Oracle Java program*. A standard Oracle
    Java program runs only on a desktop or laptop computer. The example cannot run
    on an Android device. For an example that runs on Android devices, Chapter 4.


    # # Running a Canned Java Program


    The best way to know Java is to “do Java,” by writing, testing, and running your
    own programs. This section prepares you by describing how to run and test a program.
    Rather than write your own, you run one that I’ve already written for you. The
    program calculates the monthly payments on a home mortgage loan, as shown in Figure
    3-1.


    ![](img/1a069ca97cef403f3540be3fe27c5eda_60_1.png)


    **Figure 3-1:** A run of the mortgage program in this chapter.


    Here’s how to run the mortgage program:


    +   1. First, follow the instructions in Chapter 2 for installing Java, installing
    and configuring'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'Eclipse, and downloading this book''s sample programs. Thank goodness! you
    don''t have to follow those instructions more than once.


    # 2. Launch Eclipse.


    The Workspace Launcher dialog box in Eclipse appears, as shown in Figure 3-2.


    ![](img/1a069ca97cef403f3540be3fe27c5eda_61_0.png)


    Figure 3-2: The Workspace Launcher in Eclipse.


    For a complete how-to on launching Eclipse, see Chapter 2.


    A workspace is a folder on the computer''s hard drive. Eclipse stores Java programs
    in one or more workspace folders. Along with these Java programs, each workspace
    folder contains some Eclipse settings. These settings store information such as
    the version of Java that you''re using, the colors for words in the editor, the
    size of the editor area when you drag the area''s edges, and other preferences.
    You can have several workspaces with different programs and different settings
    in each workspace.


    By default, the Workspace Launcher offers to open whatever workspace you opened
    the last time you ran Eclipse. In this example, you open the workspace that you
    use in Chapter 2, so don''t modify anything in the Workspace field.


    # 3. In the Workspace Launcher dialog box, click OK.


    The big Eclipse workbench stares at you from the computer screen, as shown in
    Figure 3-3.'
