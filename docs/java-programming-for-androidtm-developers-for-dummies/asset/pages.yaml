  md: "# # Chapter 10\n Saving Time and Money: Reusing Existing Code\n\n# ## In This\
    \ Chapter\n\n+   - Tweaking your code\n- Adding new life to old code\n- Making\
    \ changes without spending a fortune\n\nWouldn't it be nice if every piece of\
    \ software did just what you wanted it to do? In an ideal world, you could simply\
    \ buy a program, make it work right away, plug it seamlessly into new situations,\
    \ and update it easily whenever your needs changed. Unfortunately, software of\
    \ this kind doesn't exist.(Nothing of this exists.) The truth is that no matter\
    \ what you want to do, you can find software that does some of it, but not all\
    \ of it.\n\nThis is one reason that object-oriented programming has been successful.\
    \ For years, companies were buying prewritten code only to discover that the code\
    \ didn't what they wanted it to. So the companies messing with the code. Their\
    \ programmers dug deep into the program files, changed variable names, moved subprograms\
    \ around, reworked formulas, and generally made the code worse. The reality was\
    \ that if a program didn't already do what you wanted (even if it did something\
    \ close to it), you could never improve the situation by mucking around inside\
    \ the code. The best option was to choke the whole program (expensive as that\
    \ was) and start over. A sad state of affairs!\n\nObject-oriented programming\
    \ has brought about a big change. An object-oriented program is, at its heart,\
    \ designed to be modified. Using correctly written software, you can take advantage\
    \ of features that are already built in, add new features of your own, and override\
    \ features that don't suit your needs. The best aspect of this situation is the\
    \ changes you make are clean — no clawing and digging into other people's brittle\
    \ code. Instead, you make nice, orderly additions and modifications without touching\
    \ the existing code's internal logic. It's the ideal solution.\n\n# ## The Last\
    \ Word on Employees — Or Is It?\n\nWhen you write an object-oriented program,\
    \ you start by considering the data. You're writing about accounts. So what's\
    \ an account? You're writing code to handle button clicks. So what's a button?\
    \ You're writing a program to send payroll checks to employees. What's an employee?\n\
    \nIn this chapter's first example, an employee is someone with a name and a job\
    \ title — sure, employees have other characteristics, but for now I stick to the\
    \ basics:\n\n```\nclass Employee {\n    String name;\n```"
