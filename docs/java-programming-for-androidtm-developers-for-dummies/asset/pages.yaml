  md: "The classes ArithmeticException, IOException, SQLException, TwitterException,\
    \ and, others are subclasses of Exception class. The classes, ArithmeticException,\
    \ IOException, and SQLException are each part of Java’s standard API library.\
    \ The class TwitterException is declared separately in the Twitter4J API.\n\n\
    Java has two kinds of exceptions: unchecked exceptions and checked exceptions.\
    \ The easiest way to tell one kind of exception from the other is to wait for\
    \ Eclipse’s response when you type and run your code.\n\n+   * When you execute\
    \ a statement that can throw an unchecked exception, you don’t have to add additional\
    \ code.\n\nFor example, an ArithmeticException is an unchecked exception. You\
    \ can write and run the following (awful) Java program:\n\n```\npackage com.mycode.exceptions;\n\
    \npublic class DoNotDoThis {\n\n    public static void main(String[] args) {\n\
    \        int i = 3 / 0;\n    }\n}\n```\n\nWhen you try to run this code, the program\
    \ crashes. In Eclipse’s Console view, you will see the message shown in Figure\
    \ 13-12.\n\n![](img/1a069ca97cef403f3540be3fe27c5eda_344_0.png)\n\nFigure 13-12:\
    \ Shame on you! You divided by zero.\n\n+   * When you execute a statement that\
    \ can throw a checked exception, you must add code.\n\nA TwitterException is an\
    \ example of a checked exception, and a call to getUserTimeline can throw a TwitterException.\
    \ To find out what happens when you call getUserTimeline without adding code,\
    \ see a portion of Eclipse’s editor in Figure 13-13.\n\nIn Figure 13-13, the error\
    \ message indicates that by calling the getUserTimeline, you run the risk of throwing\
    \ a TwitterException. The word “Unhandled” means that TwitterException is one\
    \ of Java’s checked exceptions, and you haven’t provided any code to address the\
    \ possibility of the exception’s being thrown. That is, if the app can’t communicate\
    \ with the Twitter servers, and Java throws a TwitterException, your code has\
    \ no “Plan B.”"
