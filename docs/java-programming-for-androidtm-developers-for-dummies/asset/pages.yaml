  md: 'The content of Listing 1-1 is Java source code.


    The processors in computers, phones, and other devices don''t normally follow
    instructions like the instructions in Listing 1-1. That is, processors do not
    follow Java source code instructions. Instead, processors follow cyclic instructions
    like the ones in Listing 1-2.


    # Listing 1-2: Java Bytecode


    ```

    0 aload_0

    1 getfield #19 <com/allmycode/MyActivity/room

    com/allmycode/samples/Room;

    4 getfield #47 <com/allmycode/Room/numGuests I>

    7 ifne 22 (+15)

    10 aload_0

    11 getfield #41 <com/allmycode/MyActivity/label

    Android/widget/TextView;

    14 ldc #54 <Available>

    16 invokeevirtual #56

    <android/widget/TextView/setText(Ljava/lang/CharSequence;V)>

    19 goto 31 (+12)

    22 aload_0

    23 getfield #41 <com/allmycode/MyActivity/label

    Android/widget/TextView;>

    26 ldc #60 <Taken :->

    28 invokeevirtual #56

    <android/widget/TextView/setText(Ljava/lang/CharSequence;V)>

    31 return

    ```


    The instructions in Listing 1-2 aren''t Java source code instructions. They''re
    bytecode instructions. When you write a Java program, you write source code instructions
    (refer to Listing 1-1). After writing the source code, you run a program (that
    is, you use a tool) to the source code. The program you compile is a compiler:
    it translates your source code into bytecode instructions. In other words, the
    compiler translates code you can write and understand (again, refer to Listing
    1-1) into code that a computer can execute (refer to Listing 1-2).


    At this point, you might ask "What will I have to do to get the compiler running?"
    The one-word answer to your question is "Eclipse". All the translation steps described
    in this chapter come down to using Eclipse — a piece of software that you download
    for free using the instructions in Chapter 2. So when you read this chapter about
    compiling and other translation steps, don''t become intimidated. You don''t have
    to repair an alternator in order to drive a car, and you won''t have to understand
    how compilers work in order to use Eclipse.


    ![](img/1a069ca97cef403f3540be3fe27c5eda_28_0.png)


    No one (except for a few developers in isolated labs in faraway places) writes
    Java bytecode. You run software (a compiler) to create Java bytecode. The only
    reason to look at Listing 1-2 is to understand what a hard worker your computer
    is.'
