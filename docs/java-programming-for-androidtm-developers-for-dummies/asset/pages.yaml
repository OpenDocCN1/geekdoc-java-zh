    # **Property animation:** a newer system (introduced in Android 3.0, API Level
    11) in which you can modify any property of an object over a period of time.


    With property animation, you can change anything about any kind of object, whether
    the object appears on the device''s screen or not. For example, you can increase
    an earth''s average temperature from 15° Celsius to 18° Celsius over a period
    of minutes. Rather than display the earth object, you can watch the way average
    temperature affects water levels and plant life, for example.


    Unlike view, the use of property animation changes the value stored in an object''s
    field. For example, you can use property animation to change a widget from invisible
    to being visible. When the property animation finishes, the widget remains visible.


    The Hungry Birds use view animation, which includes these specialized animation
    classes:


    +   - AlphaAnimation: Fades in or fades out of view

    - RotateAnimation: Turns around

    - ScaleAnimation: Changes size

    - TranslateAnimation: Moves from one place to another


    In particular, the Hungry Birds use AlphaAnimation.


    The statement


    ```

    AlphaAnimation animation =

    new AlphaAnimation(0.0F, 1.0F);

