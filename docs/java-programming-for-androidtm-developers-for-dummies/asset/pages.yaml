    # # R.java and the legend of the two vaudevillians


    According to legend, two friends named Herkimer and Jake once together for 50
    years as a comedy team in vaudeville. Year after year, they practiced and refined
    their act, adding a new joke here and removing an old joke. After some time, they
    adopted a code of shorthand to refer to the jokes in their act.''Let''s move Joke
    Number 35 to the end of the first song,'' said Herkimer. And Jake requested, ''I''d
    do Joke Number 119 when the song ends.''


    Eventually, Herkimer and Jake retired to an old-age home. One day, they sat side
    by side in the TV room, at returns of Melton Berge''s show and The Sullivan Show.
    Occasionally, something on the screen would remind Herkimer of one of the team''s
    old jokes. ''Fifty-one,'' Herkimer would call out. And after this hearing, Jake
    would start now.


    Many elements of the code in an Android app are important. For example, an number
    0, 4, or 8. To help (the developer) knows what the numbers means, the creators
    of Android provide synonyms for number. So rather what you write in your Java
    code, you can write view.VISIBLE. An item in state is in plain sight on the user''s
    screen. On the other hand, an item in state 4 (with the synonym view.INVISIBLE)
    occupies space on the screen user does not see it, but its spooky presence might
    force other items to move one way or another. Finally, an item in state 8 (with
    the synonym view.GONE) has no presence on the screen. This item might have appeared
    once in the center of the screen, and it might appear later on the screen. But
    in this case, view.GONE has no impact on the layout of the screen.


    When dealing with state numbers, and with other code numbers, the creators of
    Java use hexadecimal notation. In Java, numbers starting with 0x are hexadecimal
    (base 16). For example, the number 0x00000004 stands for 4 × 16⁰—which (in the
    base 10 system) is plain 4. And the 0x00000024 stands for 2 × 16¹ + 4—which in
    base 10 is 36. Finally, the 0x0000001B stands for 1 × 16¹ + 11 × 16⁰—which in
    base 10) is 27. As an Android developer, I sometimes have to convert a hexadecimal
    value to its base 10 representation. So don''t worry about doing it.


    Anyway, you will see it in Figure 4-11 the text Hello World! When you create an
    Android app, you seldom put the text. You refer to the words. You give the words
    Hello world!, and you put that in the Java code. More, please consider these things:


    +   You have the line <string name="helloworld">Hello world!</string> in the strings.xml
    file, which is in the values subdirectory of your project''s directory.


    +   Eclipse associates a code number, as 0x7f000001. (Refer to Listing 4-3).


    +   You have the R.string.hello_world in the Java code. Alternatively, you have
    the text @string/hello_world in the activity_main.xml file.


    This indirect way to refer to the text Hello world! might seem needlessly. But
    the indirectness is exactly what helps you create apps that appear to people all
    over the world. Look at the discussion of localization in the earlier section
    "res." By creating a new value-fr directory, you allow your user''s device to
    automatically localize to another language, and to display Bonjour le monde! Hello
    Welt or Heil Deutsch of the Anglophone Hello! phrase.'
