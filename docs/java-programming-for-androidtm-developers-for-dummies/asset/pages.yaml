  md: '# 3-3: The Eclipse workbench.


    In Figure 3-3, the leftmost part of the workbench is the Eclipse Package Explorer,
    which contains numbers as 03-01, 04-01, and so on. Each number is the name of
    an Eclipse project, which is, formally, a collection of files and folders inside
    a workspace. Intuitively, a project is a basic work unit. For example, a self-contained
    collection of Java program files to manage a CD collection (along with the files
    containing the data) may constitute a single Eclipse project.


    Looking again at the Package Explorer in Figure 3-3, you see projects named 03-01,
    04-01 and so on. My project 03-01 holds the code in Listing 3-1. Project 04-01
    contains the Android app whose code belongs in Listing 4-1 (the first code listing
    in Chapter 4 of this book). Project 05-03 contains the code in Listing 5-3. The
    project named 03-Mortgage is a slight anomaly because the code for this chapter''s
    Mortgage example isn''t in all the listings.


    Eclipse project may include letters, digits, blanks, and other characters; for
    the names of this book''s examples, I stick with digits and dashes.


    To read more about topics such as the Eclipse Package Explorer, see the later
    section “What’s All That Stuff in the Eclipse Window?”


    When you launch Eclipse, you may see different elements than the ones shown in
    Figure 3-3. You may see the Eclipse Welcome screen with only a few icons in an
    otherwise barren window. You may also see a workbench like the one shown in Figure
    3-3, but with no list of numbers (03-01, 04-01, and so on) in the Package Explorer.
    If so, you may have missed some instructions in Chapter 2 for Eclipse. Alternatively,
    you may have modified the workspace name in the Eclipse Launcher dialog box.


    In any case, make sure that you see numbers like 03-01 and 04-01 in the Package
    Explorer. Seeing these numbers ensures that Eclipse is ready to run the sample
