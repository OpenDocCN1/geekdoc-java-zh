  md: '# Creating an Android project


    To create your first Android application, follow these steps:


    +   1. Launch Eclipse.


    ![](img/1a069ca97cef403f3540be3fe27c5eda_83_0.png)


    For details on launching Eclipse, see Chapter 2.


    +   2. From the main menu in Eclipse, choose File=New=Android Application Project.


    As a result, Eclipse fires up its New Android Application dialog box, as shown
    in Figure 4-1.


    +   3. In the Application Name field, type a name for the app.


    In Figure 4-1, I type the boring My First Android App. Ordinary folks such as
    Joe and Jane User, however, will see this name under the app''s icon on the Android
    launcher screen. If you''re planning to market your app, make the name short,
    sweet, and descriptive. You can even include blank spaces in the name.


    The next steps involve lots of clicking, but you primarily accept the default
    settings.


    +   4. (Optional) In the Project Name and Package Name fields, change the name
    of the project and the name of the Java package containing the project.


    Eclipse automatically fills the Project Name and Package Name fields (guided by
    whatever you type in the Application Name field). In Figure 4-1, Eclipse creates
    the project name MyFirstAndroidApp and the package name com.example.myfirstandroidapp.
    Eclipse uses the project name to label your app''s in the Package Explorer tree.


    ![](img/1a069ca97cef403f3540be3fe27c5eda_83_1.png)


    Figure 4-1: The first New Android Application dialog box.'
  merge: -1
