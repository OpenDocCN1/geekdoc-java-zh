    # Getting OAuth codes


    For your Android app to communicate with Twitter servers, you need your own OAuth
    codes. To get, follow this section''s steps.


    > WARNING The instructions apply to the Twitter web pages for developers at the
    time of this book''s publication. Twitter might change the design of its website
    at any time without notice. (At any rate, it won''t notify me!)


    +   1. Sign in to your Twitter user account (or register for an account if you
    don''t already have one).


    +   2. Visit https://dev.twitter.com/apps/new.

    If stars are aligned harmoniously, you will see Twitter''s Create an Application
    page.


    +   3. On the Create an Application page, fill in all required fields along with
    the (misleading optional) Callback URL field.


    When you visit the page, I see the Name field, the Description field, the Website
    field, and the Callback URL field. All but the Callback URL field are listed as
    being required.

    Typing your in the Name field is a no-brainer. But what do you use for the other
    fields? After all, you''re creating an industrial-strength Android app. You''re
    creating only a test app — an app to help you see how to use Twitter4J.


    The good news is that almost anything you type in the Description field is okay.
    The same is true for the Website and Callback URL fields, as long as you type
    things that look like real URLs.


    I''ve never tried typing a .com URL in either the Website or Callback URL fields,
    but I suspect that typing .com URL doesn''t work.

    To communicate with Twitter via an Android app, you need a callback URL. In other
    words, for this chapter''s example, the Callback URL isn''t optional. Neither
    the Website field nor the Callback URL field has to point to a real web page.
    But you must fill in those two fields.


    The Callback URL field isn''t marked as being required. Nevertheless, you must
    type a URL in the Callback URL field.


    +   4. After agreeing the terms, and doing the other stuff to prove that you''re
    a good person, click the Create Your Twitter Application button.

    Doing so brings you to a page where you see some details about your new application
    — the Details tab, in other words. On this page, you see four important things:
    your app''s access level, consumer key, and consumer secret and a button that
    offers to create your app''s access token.'
