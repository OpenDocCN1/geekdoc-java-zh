  md: "```\n@Override\npublic boolean onCreateOptionsMenu(Menu menu) {\n    getMenuInflater().inflate(R.menu.main,\
    \ menu);\n    return true;\n}\n```\n\nThe following list can help you relate elements\
    \ from Listing 10-17 to this chapter’s discussion of classes, subclasses, and\
    \ interfaces:\n\n+   * Every Android app is in a package of its own.\nThe app\
    \ in Listing 10-17 belongs to the package named com.allmycode.myfirstandroidapp.\n\
    * If the first part of a package is android, that package probably belongs to\
    \ Google’s Android operating system code.\nFor example, Android’s Activity lives\
    \ in the android.app package. When I import android.app Activity, I can refer\
    \ to the Activity class in the rest of Listing 10-17 without repeating the class’s\
    \ fully qualified name.\n\n> Java has no rule to enforce package naming conventions.\
    \ You can create your own package and name it android.app, and you use that package\
    \ in code that has nothing to do with Google Android. A good developer never looks\
    \ for trouble. If convention dictates that the word android signals a package\
    \ in the official Android API, do not use the word in your package names.\n\n\
    +   * The MainActivity class extends the android.app.Activity class.\nA MainActivity\
    \ is an Activity. Therefore, the MainActivity has all the rights and responsibilities\
    \ that any Activity instance has. For example, the MainActivity onCreate and onCreateOptionsMenu\
    \ methods, which it overrides in Listing 10-17.\nIn fact, the MainActivity class\
    \ inherits over 5,000 lines of Java code from Android’s Activity class. The inherited\
    \ methods include such as getCallingActivity, getPackage, getParent, getTitle,\
    \ getTitleColor, getWindow, onBackPressed, keyDown, onLongPress, onMemory, onItemItemSelected,\
    \ setSelected, setTitle, startActivity, finish, and many others. You inherit all\
    \ this functionality by typing two simple words: extends Activity.\n\nThe Activity\
    \ class extends another class: Android’s own ContextWrapper. Without knowing what\
    \ a ContextWrapper is (and without caring), your app’s own MainActivity class\
    \ (refer to Listing 10-17) extends Android’s Activity class, which in turn extends\
    \ Android’s ContextWrapper class. So in the terminology of family relationships,\
    \ your MainActivity class is a descendant of Android’s ContextWrapper."
