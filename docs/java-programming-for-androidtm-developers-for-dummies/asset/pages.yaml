  md: 'at that, the interpreter performs one important task that a real ambassador
    performs: The interpreter does what you would do if your native language were
    Dalvik bytecode. The interpreter, pretending to be the Intel ambassador, endures
    the boring bytecode speech, taking in every word and processing each one in some
    way or another.


    You have an interpreter — a virtual ambassador. In the same way, an processor
    runs its own bytecode-interpreting software. That software is the Dalvik virtual
    machine — a proxy, an errand boy, a go-between. The Dalvik virtual machine serves
    as an interpreter between Dalvik’s runtime and your device’s own system. As it
    runs, the virtual machine walks your device through the execution of the bytecode
    instructions. It examines your bytecode, bit by bit, and carries out the instructions
    described in the bytecode. The virtual machine interprets bytecode for your ARM
    processor, your Intel processor, your Texas Instruments chip, or whatever kind
    of processor you’re using. That’s a good thing. It’s what makes Java code and
    Dalvik code more portable than code written in any other language.


