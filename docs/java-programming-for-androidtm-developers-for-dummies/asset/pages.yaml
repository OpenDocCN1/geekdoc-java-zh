    Java thought centers around nouns and verbs. Nouns are the “stuff,” and verbs\
    \ are the stuff’s actions. Nouns are the pieces, and verbs are the glue. Nouns\
    \ are, and verbs do. When you use nouns, you say “book,” “room,” or “stuff.” When\
    \ you use verbs, you say “do this,” “do that,” “tote barge,” or “lift that bale.”\n\
    Java also has nouns and verbs. Java’s nouns include int, JJOptionPane, and String,\
    \ along with Android-specific terms such as Activity, Application, and Bundle.\
    \ Java’s verbs involve assigning values, choosing among alternatives, repeating\
