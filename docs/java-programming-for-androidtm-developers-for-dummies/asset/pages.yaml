    # # Repeating Instructions Over and Again


    In 1966, the company that brings Head & Shoulder shampoo made history. On the
    back of the bottle, the directions for using the shampoo read, "Lather, rinse,
    repeat." Never before a complete set of directions (for doing anything, let alone
    shampooing hair) been summarized so succinctly. People in the direction-writing
    business hailed it as a monumental achievement. Directions like these stood in
    stark contrast to the others. (For instance, the first sentence on a can of bug
    spray read, "Turn this can so that it points away from your face." Duh!


    Aside from their brevity, the characteristic that made the Head & Shoulder directions
    so cool was that, with three simple words, they managed to capture a notion that''s
    at the heart of all instruction-giving: repetition. That last word, repeat, turned
    an otherwise bland instructional into a sophisticated recipe for action.


