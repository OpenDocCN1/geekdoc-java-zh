  md: 'Extract the contents of the downloaded archive file to the local hard drive.

    On my Windows computer, I extract the .zip file''s contents to the new folder
    c:\Users\MyUserName\adt-bundle-windows-x86. On my Mac, I extract the .zip file''s
    contents to my existing Applications folder. (Refer to Figures 2-1 and 2-2.)


    For help archive files, see the earlier sidebar "Compressed archive files."


    In Windows, the blank space in the Program Files confuses some Java software.
    I don''t think any of this book''s software prevents this problem, but I can''t
    guarantee it. If you want, extract the .zip file''s contents to the C:\Program
    Files or C:\Program Files (x86) folder. Make a mental note about your choice (in
    case you run into any trouble).


    The .zip archive that you download from http://developer.android.com/sdk contains
    these two components:


    +   **The eclipse component:** It contains a customized version of the popular
    Eclipse integrated development environment (IDE). You can compose, run, and debug
    Java applications in the Eclipse environment. This customized version of Eclipse
    includes the Android Development Toolkit (ADT) — extra-plugins for working with
    Android apps.


    +   **The sdk component:** (Yes, only half of the large Android SDK download is
    the SDK component. If the names are misleading, don''t blame me.) The SDK component
    contains the Android software library (or one more versions of the Android API).
    This component also contains a bunch of software tools for running and testing
    Android apps.


    While you''re in the mood to follow my advice, note the location on the hard drive
    where the sdk component lands. (For example, in Figure 2-1, the SDK folder is
    c:\Users\Barry\adt-bundle-windows-x86_64\sdk). I have a name for this location:
    the ANDROID_HOME folder.


    # Running Eclipse for the First Time


    The first time you launch Eclipse, you perform a few extra steps. To get Eclipse
    running, follow these steps:


    +   **Launch Eclipse.**


    In Windows Explorer (it''s File Explorer in Windows 8) for the folder containing
    the extracted Eclipse files. Double-click the icon representing the eclipse.exe
    file. (If you use an eclipse file but no eclipse.exe file, check the sidebar "Those
    pesky filename extensions", earlier in this chapter.)


    On the Mac, go to the Spotlight and type **Eclipse** in the search. When *Eclipse*
    appears as the Top Hit in the Spotlight''s list, press Enter.


    When you launch Eclipse, you the Workspace Launcher dialog box, as shown in Figure
    2-5. The dialog box asks where, on the computer''s hard drive, you want to store
    the code that you will create using Eclipse.'
