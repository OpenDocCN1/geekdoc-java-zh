    \ and onPostExecute), you put code that updates the widgets on the device's screen.\
    \ So Android executes these methods in the UI thread, as shown in Figure 13-9.\n\
    \nAndroid also makes your life easier by coordinating the execution of an AsyncTask\
    \ class's methods. For example, onPostExecute doesn't change the value of a screen\
    \ widget until after the execution of doInBackground. (Refer to Figure 13-9.)\
    \ In this chapter's Twitter app, the onPostExecute method doesn't update the screen\
