  md: "Finally, with alertable referring to the Stopwatch instance, Listing 10-12\
    \ calls alertable.alert(message).\n\nIn other words, Listing 10-12 calls back\
    \ the original Stopwatch instance. Listing 10-12 knows how to call the original\
    \ Stopwatch instance, because the Stopwatch passed itself (the keyword) in the\
    \ TimerCommon construction call.\n\nHow do these interfaces help with all this?\
    \ Remember that the TimerCommon class is not your own. Someone else wrote the\
    \ TimerCommon class and placed it in a separate com.example.timers package (the\
    \ code in Listing 10-10). In particular, the TimerCommon class does not contain\
    \ the following code:\n\n```\npublic TimerCommon(Stopwatch yourStopwatch,\n  \
    \  String message,\n    Calendar wakeTime) {\n\nyourStopwatch.alert(message);\n\
    ```\n\nInstead, the TimerCommon class is written for a more general audience.\
    \ The TimerCommon class contains the following lines:\n\n```\npublic TimerCommon(Alertable\
    \ alertable,\n    String message,\n    Calendar wakeTime) {\n\nalertable.alert(message);\n\
    ```\n\nThe class's constructor expects its first argument to implement the Alertable\
    \ interface. And sure enough, the first argument in new TimerCommon(this, \"Stop\"\
    , when) is in this, which is your Stopwatch instance, which (Oh, joy!) implements\
    \ Alertable. Here's the best part: As long as your class implements the Alertable\
    \ interface, your class is guaranteed to have an alert method with one String\
    \ argument (refer to Listing 10-11). So the TimerCommon class can safely call\
    \ your code's alert method.\n\n# Time doesn't pass\n\nJava's calendar class has\
    \ a misleading name. An instance of the calendar class is a moment in time, not\
    \ an month or year full of them. In Listing 10-10, the line\n\n```\nwakeTime =\
    \ Calendar.getInstance()\n```\n\nmakes wakeTime refer to a particular moment.\
    \ In fact, when you call the parameterless calendar.getInstance(), you get the\
    \ current moment (the precise milliseconds in which the method is called). You\
    \ can check that moment's fields (YEAR, MONTH, DAY_OF_YEAR, HOUR, MINUTE, SECOND\
    \ and MILLISECONDS). You can also see the moment as a number of milliseconds since\
    \ January 1, 1970.\n\nA calendar object's getTimeInMillis method finds the exact\
    \ number of milliseconds since January 1, 1970 for that object. (Now it's a huge\
    \ number.) The add(calendar, seconds) method adds a number of seconds to a particular\
    \ calendar moment. The System class's static currentTimeInMillis method provides\
    \ a one-way to find out how many milliseconds have passed since that date mark\
    \ in 1970."
