  md: '# Words, words, words


    The Java uses two kinds of words: keywords and identifiers. You can tell which
    words are keywords because Java has only 50 of them. Here''s the complete list:


    | abstract | continue | for | new | switch |

    | assert | default | goto | package | synchronized |

    | boolean | do | implements | private | this |

    | break | double | protected | throw |

    | byte | else | import | public | throws |

    | case | extends | instanceof | return | transient |

    | catch | extends | short | static | void |

    | char | final | interface | volatile |

    |const | float | native | super | while |


    As a keyword, a word has meaning meaning never changes (from one Java program
    to another). For example, in English, you can''t change the meaning of the word.
    It doesn''t make sense to say, "I think that I shall never if A poem as a riff."
    The same concept holds true in a Java program: you can type if (x > 5) to mean
    "if x is greater than 5," but when you type if (x != y), the computer tells you
    the code makes no sense.


    In Listing 5-1 the words package, public, class, static, and void are every word
    that is listing an identifier, which is generally a name for something. The identifiers
    in listing the package name org.alloycode.myfirstproject, the class name MyFirstFitClass
    and a bunch of other words.


    In programming language, words such as Wednesday, Barry, and university in the
    following sentence are identifiers, and the other words (it''s, it is, and at)
    are keywords:


    > It''s Wednesday, Barry is at the university.


    (I''m undecided about the role of the word. You can worry about it if you want.)

    In English and other simple languages, the names of identifiers are reusable.
    For example, a recent web search up four people in the United States named Barry
    Burd (with the uncommon spelling). (A fellow student at Temple University had
    the name John Wayne, and in the 180s two different textbooks were named Pascalorgraphics.)
    The Android API has a class name Activity, but that doesn''t stop you from freeing
    another meaning for the name.


    Of course, having duplicate names can lead to trouble, so intentionally reusing
    a well-known name is generally a bad idea. (If you create your own name Activity,
    you''ll find it difficult to refer to the rewritten Activity class in Android.
    As for my fellow Temple student, everyone learned when the teacher called it)


    Listing 5-1 begins with the line package org.alloycode.myfirstproject. The first
    line is a package declaration. Because of this, the newly created MyFirstFitClass
    inside a package named org.alloycode.myfirstproject.MyFirstJavaClass is the fully
    qualified name.


    If you''re sitting with me in your living room, you probably call me Barry. But
    if you''ve never met me and you''re looking for me in a crowd of a thousand people,
    you probably call the name Barry Burd. In the same way, the choice between a class''s
    simple name and its fully qualified name depends on the context. For more information,
    see the later section "An import declaration."


