  md: "be wary of the rules for copying parameters or values or doing whatever they\
    \ wanted to do with parameters. As a result, some of FORTRAN implicitly passed\
    \ addresses rather than values. Thorough passing alone isn't a terrible idea,\
    \ but it becomes ugly if the language designer isn't clear.\n\nIn early FORTRAN\
    \ implementations, the computer automatically (without warning) turned the 2 into\
    \ a named variable two (In fact, the newly created variable probably wasn't two.\
    \ But in this story, the name of the variable matters). FORTRAN would substitute\
    \ the variable name two in any place the programmer typed the literal two. Then,\
    \ while using this sider's code, the computer would add the address of the variable\
    \ two to the increment method. The method would add 1 to the variable stored in\
    \ that address and then continue its work. Now the variable returned the number\
    \ 3. By the time you reached the showDialog call, the computer would add to itself\
    \ whatever was in two, getting 3+3, which is 6.\n\nIf you think parameter passing\
    \ is a no-brainer, think again. Different languages use all different kinds of\
    \ parameter passing. And in many scenarios, the minute details of the way parameters\
    \ are passed makes a big difference.\n\n# What's a developer to do?\n\nThe program\
    \ in Listing 7-4 has a big, fat bug. The program doesn't add 1000 to a player's\
    \ score. That's bad.\n\nYou can squash the bug in Listing 7-4 in several different\
    \ ways. For example, you can avoid calling the addPoints method by inserting score\
    \ += in the main method. But that's not a satisfactory solution. Methods such\
    \ as addPoints are useful for dividing work into neat, understandable chunks.\
    \ And avoiding problems by skirting around them is no fun at all.\n\nA better\
    \ way to get rid of the bug is to make the addPoints method return a value. Listing\
    \ 7-5 has the code.\n\n# Listing 7-5: A New-and-Improved Scorekeeper Program\n\
    \n```\nimport java.swing.JOptionPane;\n\npublic class Scorekeeper {\n\n    public\
    \ static void main(String[] args) {\n        int score = 50000;\n        int points\
