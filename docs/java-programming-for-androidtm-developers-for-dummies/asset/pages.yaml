    trick with the res/menu/activity_main.xml file to display items on the app''s
    Action bar.


    # An activity''s workforce methods


    Every Android activity has a lifecycle - a set of stages that the activity undergoes
    from birth to death and so on. In particular, when you launch an activity, the
    phone calls the activity''s onCreate method. The method also calls the activity''s
    onStart andonResume methods.


    In [Listing 5-5], I choose to declare my own onCreate method, but I don''t declaring
    my own onStart and onResume methods. Rather than override the onStart and onResume
    methods, I silently use the Activity class''s prewritten onStart and onResume
    methods.'
