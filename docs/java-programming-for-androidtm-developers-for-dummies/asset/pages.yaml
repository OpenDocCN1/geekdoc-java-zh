    ```

    public void Anyname

    ```


    which means that you type public void and then a name that you make up on your
    own. Words that you need to replace with your own words are set in italicized
    computerse.


    # # What You Don’t Have to Read


    Pick the first chapter or section that has the material you don’t already know
    and start reading. Of course, you may have making decisions as much as I do. If
    so, there are some guidelines you can follow:


    +   If you already know what kind of animal Java is and you don’t care what happens
    behind the scenes when an Android app runs: Skip Chapter 1 and go straight to
    Chapter 2. Believe me — I won’t.


    +   If you already know how to get an Android app running: Skip Part I and start
    with Part II.


    +   If you have experience writing computer programs in languages other than C
    and C++: Start with Part II. You’ll probably find Part II to be easy reading.
    If you get to Part III, it’ll be time to dive in.


    +   If you have experience writing computer programs in C or C++: Skim Part II
    and start reading seriously in Part III. (Java is a bit different from C++ in
    the way it handles classes and objects.)


    +   If you have experience writing Java programs: Come to my house and help me
    write Java Programming For Android Developers For Dummies, 2nd Edition.


    If you want to skip the sidebars and the paragraphs with Technical Stuff icons,
    please do. In fact, if you want to skip anything at all, feel free.


    # # Foolish Assumptions


    In this book, I make a few assumptions about the reader. If one of these assumptions
    is incorrect, you’re probably okay. If all these assumptions are incorrect ...
    well, buy the book anyway.


    +   I assume that you have access to a computer. Access to an Android device is
    helpful but absolutely necessary! All the software you need in order to test Android
    apps on a laptop or desktop computer is freely available. You simply download,
    install, and get going.


    +   I assume that you can navigate your computer’s common menus and dialog boxes.
    You don’t have to be a Windows, Linux, or Macintosh power user, but you should
    be able to start a program, find a file, put a file into a certain directory —
    that sort of thing. Much of the time,'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'when you follow the instructions in this book, you''re typing code on the keyboard,
    not pointing and clicking the mouse.


    On those occasions when you need to drag and drop, cut and paste, or plug and
    play, I guide you carefully through the steps. But your computer may be configured
    in one of several billion ways, and my instructions may not quite fit your situation.
    When you reach one of these platform-specific tasks, try following the steps in
    this book. If the steps don''t fit, you can''t find such a book, send me an e-mail.
    (My address appears later in the Introduction.)


    +   I assume that you can think logically. That''s all there is to application
    development thinking logically. If you can think logically, you''ve got it made.
    If you don''t believe that you can think logically, read on. You may be pleasantly
    surprised.


    +   I make very few assumptions about your computer programming experience (or
    your lack of such). In writing this book, I''ve tried to do the impossible: make
    the book interesting for experienced programmers yet accessible to people with
    little or no programming experience. This means that I don''t assume any particular
    programming background on your part. If you''ve never created a loop or indexed
    array, that''s okay.


    On the other hand, if you''ve done these things (maybe in Visual Basic, COBOL,
    or C++), you''ll discover some interesting plot twists in Java. The creators of
    Java took the best ideas from object-oriented programming, streamlined them, reworked
    them, and reorganized them into a sleek, powerful way of thinking about problems.
    You''ll find many new, thought-provoking features in Java. As you find out about
    these features, many of them will seem natural to you. One way or another, you''ll
    feel good about using Java.


    # # How This Book Is Organized


    This book is divided into subsections, which are grouped into sections, which
    come together to make chapters, which are lumped, finally, into five parts (like
    one of those Russian matryoshka dolls). The parts of the book are described here.


    # ## Part I: Getting Started with Java Programming for Android Developers


    Part I covers all the nuts and bolts. It introduces you to the major ideas behind
    Java and Android software development and walks you through the installation of
    the necessary software products. You also run a few Java and Android programs.


    The instructions in these chapters cover both Windows and Macintosh computers.
    They cover many computer configurations, including some not-so-new operating system
    versions, the differences between 32-bit systems and 64-bit systems, and situations
    in which you already have some form of Java on your computer. But installing is
    always tricky, and you might have a few hurdles to overcome. If you do, check
    the end of this chapter to reach me (the author) and get quick advice. (Yes, I
    answer e-mails, tweets, Facebook posts, and notes by carrier pigeons.)


    # ## Part II: Writing Your Own Java Programs'
  merge: -1
  pgno: 15
- img_proc: true
  md: '5 through 8 Java''s building blocks. Chapters describe the things you need
    to know so that can get your computer humming along.


    If you''ve written programs in Visual Basic, C++, or in any other language, some
    of the material in Part II may be familiar to you. If so, you can skip some sections
    or read this quickly. But don''t read too quickly. Java is a little different
    from other programming languages, especially in the features I describe in Chapter
    6.


    # Part III: Working with the Big Picture: Object-Oriented Programming


    Part III has some of my favorite chapters. This part covers the all-important
    topic of object-oriented programming. In these chapters, you find out how to map
    solutions to big problems. (Sure, the examples involve big ideas.) You discover,
    in bite-wothy inventions, how to design classes, reuse existing classes, and construct
    objects.


    Have you read any of those books explain object-oriented programming in vague,
    general terms? I''m very proud to say that Java Programming for Android Developers
    Dummies isn''t like that. In this book, I will illustrate each concept with a
    simple-yet-concrete program example.


    # Part IV: Powering Android with Java Code


    If you''ve tested java and want more, you can find what you need in this part
    of the book. This part''s chapters are devoted to details — the things you don''t
    see when you first glance at the material. This part includes some fully functional
    Android apps. so, after you read the earlier parts and write some programs on
    your, you can dive in a little deeper by reading Part IV.


    # Part V: The Part of Tens


    In The Part of Tens, which is a little Java candy store, you can find lists —
    lists of tips for avoiding mistakes, tracking down resources, and finding all
    kinds of interesting goodies.


    # More on the web!


    You''ve read the Java Programming For Android Developers book, seen the Java Programming
    For Android Developers movie, won the Java Programming for Android Developers
    T-shirt, and even the Java Programming for Android Developers candy. What is there
    to do?


    That''s. Just visit this book''s website: www.allmycode.com/Java4Android. You
    can find updates, comments, additional information, and answers to commonly asked
    questions from readers. You can also find a small application for sending me quick
    questions when I''m online. (When I''m not online, you can contact me in other
    ways. See the end of this chapter for more info.)


    # Icons Used in This Book


    If you could write this book, you''d see me sitting at my computer, talking to
    myself. I say each sentence in my head. Most of the sentences I mutter several
    times. When I have an extra thought, a side comment, or something else that doesn''t
    belong in the regular stream, I will write a little bit. That way, whoever''s
    listening to me (usually nobody) knows that I''m off on a momentary tangent.'
