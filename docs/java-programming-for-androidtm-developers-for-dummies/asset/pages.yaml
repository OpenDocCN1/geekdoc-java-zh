  md: "# # Chapter 12\nDealing with a Bunch of Things at a Time\n\nIn This Chapter\n\
    \n+   - Dealing with many objects at a time\n- Creating versatile classes and\
    \ methods\n- Stepping through a list of items\n\n> All the world's a class,\n\
    And all the data, merely objects.\n\n—Jimmy Shakespeare, 11-year-old common geek\n\
    \nA class is a blueprint for things, and an object is a thing made from the blueprint.\
    \ By thing, I mean a particular employee, a customer, an Android activity, or\
    \ an more ethereal element, such as an SQLiteHelper. Another quotation, this one\
    \ from a more reliable source:\n\nIn fact, some Java classes are difficult to\
    \ visualize. Android's SQLiteHelper class assists developers in the creation of\
    \ databases. SQLiteHelper doesn't look like anything in particular, and certainly\
    \ not an online form or a bag of cheese.\n\n> —Barry Burd, Java Programming for\
    \ Android Dummies For Dummies, Chapter 9\n\nThis chapter covers a concept that\
    \ you might not normally consider a class or an object — namely, a bunch of things.\
    \ I use the word bunch, by the way, to avoid the formal terminology. (There's\
    \ nothing wrong with the formal terminology, but I want to save it for this chapter's\
    \ official grand opening, in the first section.)\n\n# # Creating a Collection\
    \ Class\n\nA collection class is a class whose job is to store a bunch of objects\
    \ at a time — a bunch of String objects, a bunch of objects, or whatever. You\
    \ can create a collection class with the code in Listing 12-1.\n\n# ## Listing\
