  md: '![](img/a398e64f5a6d595324f5e906ad60a773_33_0.png)


    It is important to note here, that while Java collections are mutable, there are
    two ways to initialize a new array list object: the first approach produces a
    mutable collection and the another one produces an immutable list:


    +   - Using constructor, like List<Integer> numbers = new ArrayList<>(); this
    version creates mutable lists

    - Using the Arrays.asList() static method, which creates immutable lists


    Another option is to use the List.of() static method, which accepts arguments
    as var args. This operation is available since Java 10. It also produces an immutable
    list.


    # # Add new elements


    The first operation we will observe is an insertion of new elements. Array lists
    inherit from the root interface two methods to insert: add(E) and addAll(Collection
    c), and also provide two own list-specific methods for adding elements to the
    specified position. Observe all these methods:


    +   - add(E e) is the basic method, that inserts a new element to the end of the
    list

    - addAll(Collection c) is another method from the root java.util.Collection interface,
    that appends all elements of the collection C to the end of the list

    - add(int position, E e) this method inserts a new element E to the specified
    position. It shifts the currently element at position and any subsequent elements
    to the right. This method could throw IndexOutOfBoundsException in a case the
    position value is higher than the size of list

    - addAll(int position, Collection c) the operation which is similar to the previous
    one, but adds elements from collection c starting from position position. Can
    throw IndexOutOfBoundsException with same conditions as the add() function'
