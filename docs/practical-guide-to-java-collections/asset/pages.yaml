    # Remove elements


    Finally, we need to observe how to use an iterator to delete elements. The `java.util.Iterator`
    interface contains the `remove()` method. It deletes from the underlying collection
    the last element returned by the iterator. This method can be called only once
    per call of the `next()` function. Note, that this operation is optional.


    (Listing 8-6)


    ```

    List<Integer> numbers = new ArrayList<>();

    numbers.add(1);

    numbers.add(2);

    numbers.add(3);

    numbers.add(4);

    numbers.add(5);

    ```'
