    # Map


    The streams API has a number of mapping operations. It is a good idea to group
    them together under one section. Let start with a general map() function. It returns
    a new stream, which consists of results of an application mapper function to the
    elements of the stream.


    (Listing 2-11)


    ```

    @Test

    void mapTest(){

    Stream<String> stream = names.stream();

    int result = stream.mapToInt(n -> n.length()).sum();

    assertThat(result).isEqualTo(43);

    }

    ```


    There are specific mapping methods, that map results of previous computation to
    numeric values.


    +   * mapToInt() produces an IntStream instance, that consists of the results
    of applying the given mapper function

    * mapToDouble() produces a DoubleStream instance, that consists of the results
    of applying the given mapper function

    * mapToLong() produces a LongStream instance, that consists of the results of
    applying the given mapper function


    # Distinct


    Another commonly used intermediate operation is called distinct(). It produces
    a stream of unique elements from a source. Technically, the distinct() method
    relies on equals() implementation of the type class in order to avoid duplicates.
    For ordered streams, the selection of distinct elements is stable, for unordered
    ones, Java provides no stability guarantee.


    (Listing 2-12)'
