  md: "# ForEach\n\nWe have already encountered the forEach() method in many examples,\
    \ that illustrated intermediate operations in the previous section. From a technical\
    \ point of view, the forEach() function accepts a consumer function, which defines\
    \ an action to be performed on each element of the stream.\n\n(Listing 2-17)\n\
    \n```\n@Test\nvoid forEach(){\nStream<String> stream = names.stream();\nstream.filter(n->!n.equalsIgnoreCase(\"\
    Anna\")).map(n -> n.toUpperCase()).forEach(n -\n System.out.println(n));\n}\n\
    ```\n\nNote, that for parallel stream pipelines, this operation does not guarantee\
    \ to respect the encounter order of the stream, as doing so would sacrifice the\
    \ benefit of parallelism. For any element, the action may be performed at whatever\
    \ time and in what thread the library chooses. If the action accesses shared state,\
    \ it is responsible for providing the required synchronization.\n\n# Collectors\n\
    \nThe forEach() method has no return: it consumes data, but does not provide back\
    \ result (it is of the void return type). However, we often need to perform some\
    \ operations with stream on a collection and then get a new collection back. In\
    \ these situations we use collect() method. It performs a mutable reduction operation\
    \ on the elements of this stream using collectors.\n\n![](img/a398e64f5a6d595324f5e906ad60a773_27_0.png)"
