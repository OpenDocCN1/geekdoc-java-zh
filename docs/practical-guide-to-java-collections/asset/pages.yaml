  md: '# Peek


    This method is often misunderstood among developers. The reason for this, is that
    it acts in a similar way as map() method, but only in a small portion. Likewise,
    peek() method applies modifications on an each element of a stream, but if these
    modifications exist only inside the method execution. Unlike map(), peek() does
    not return a modified element to the stream flow. That is a reason, why peek()
    is often used for debugging. You can think about it as intermediate counterpart
    forEach().


    Let take an example to distinguish peek() and map(). Consider a list of numbers.
    We apply same modification for both cases – multiply each number on 2. However,
    when you run this snippet, you will see, that in the first case the result contains
    same values as the initial sequence:


    (Listing 2-16)


    ```

    @Test

    void peekTest() {

    List<Integer> numbers = Arrays.asList(5, 2, 12, 20, 9, 8);

    System.out.println("Peek:");

    List<Integer> peekResults = numbers.stream().peek(number -> {

    number = number * 2;

    System.out.println(number);

    }).collect(Collectors.toList());

    System.out.println("Final result:");

    peekResults.stream().forEach(System::println);

    Assertions.assertThat(peekResults).hasSameElementsAs(numbers);

    System.out.println("Map");

    List<Integer> mapResults = numbers.stream().map(number -> {

    number = number * 2;

    System.out.println(number);

    return number;

    }).collect(Collectors.toList());

    System.out.println("Final result:");

    mapResults.stream().forEach(System::println);

    Assertions.assertThat(mapResults).contains(10, 4, 24, 40, 18, 16)

    }

    ```


    The final output of running this test case is presented on the screenshot below:'
