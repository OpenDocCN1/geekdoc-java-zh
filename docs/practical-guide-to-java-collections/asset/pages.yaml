  md: '# Chapter 3. Lists


    Before we will begin with an overview of list implementations in the Java Collections
    Framework, let define what a list. In computer programming, list is finite sequence
    of elements, where each element has its own position. In computer science are
    contrasted two types of lists: array-based lists and linked lists.


    An array-based list is called this way, because behind the scenes it uses a backed
    array to store values. One of important characteristics of arrays is their fixed
    size, but array-based lists could add as many elements as we need and extend the
    size of the underlying array. Here need to introduce concepts of size and capacity.
    Take a look on the graph below, which demonstrates an array list, which has 5
    cells and 3 of it have actual values:


    ![](img/a398e64f5a6d595324f5e906ad60a773_32_0.png)


    Based on this example, we can define these concepts:


    +   * Capacity is the total number of cells for data storage

    * Size is the number of cells that actually contain data


    Technically, when size becomes equal to capacity, in order to add new elements,
    Java has to increase a capacity. It is performed with a mechanism, which is called
    dynamic memory allocation, which reserves memory cells for prospective elements
    as needed.


    All lists in Java implement java.util.List interface as well as have core collection
    methods. Array-based list implementation is defined in java.util.ArrayList class.
    The capacity of list''s array is grown automatically, and is always at least large
    than its size (number of elements).'
