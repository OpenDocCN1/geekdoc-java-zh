    # # Intermediate operations


    Intermediate operations return new stream and are lazy. Their laziness means that
    the actual computation on the source data is performed only after the terminal
    operation is invoked, and source elements are consumed only as needed. We can
    chain multiple intermediate operations, as each returns a new stream instance.


    ![](img/a398e64f5a6d595324f5e906ad60a773_21_1.png)


    # # Filter


    In the beginning of this chapter, we did an example with names. There, we filtered
    a list of names in order to find matching names. This was done using filter().
    Basically, it returns a new stream consisting of the elements, that match the
    given predicate (function, that specifies a logical condition).


    (Listing 2-10)


    ```

    @Test

    void filterTest(){

    Stream<String> stream = names.stream();

    long result = stream.filter(n -> n.startsWith("A")).count();

    assertThat(result).isEqualTo(4);"

    ```'
