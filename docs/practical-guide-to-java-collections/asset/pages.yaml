    # Terminal operations


    The other group of pipeline operations corresponds to terminal operations. Different
    from intermediate operations, there may be only one terminal operation that is
    executed on stream, because as it will be completed, the stream pipeline will
    be consumed, and can no longer be used. Terminal operations produces some result
    (can be either Java object or void), not a stream.'
