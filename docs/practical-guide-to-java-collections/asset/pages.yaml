  md: '# Chapter 5. Queues


    In computer programming, the queue stands for a linear collection of elements
    that are inserted and removed based on FIFO principle. FIFO is an abbreviation,
    which means First-in-First-out. In other words, an element, which was inserted
    first, will be removed first, unlike stacks, where the first element is removed
    last. To distinguish these two principles let have an example with a ferry. The
    first situation is a car embarkation. This is an example of a LIFO order: the
    first car, that comes into a ferry, will exit last. Another example is a queue
    in a ticket office to buy tickets for this ferry. Here governs FIFO principle:
    the person, which came first to the ticket gate, will buy and exit a queue.


    In a basic structure, queues support only two operations: enqueue and dequeue:


    +   - Enqueue means an insertion of an element into the back of the queue

    - Dequeue means a removing of an element from the front of the queue


    The first front element is also called head and elements that are positioned after
    are called tail. In Java, queues are defined in the java.util.Queue interface.
    There are two main implementations: ArrayDeque and PriorityQueue:


    ![](img/a398e64f5a6d595324f5e906ad60a773_53_0.png)


    The important difference between these implementations is an order of elements.
    The ArrayDeque holds elements on FIFO basis, so head element is the first inserted.
    The PriorityQueue in its regard holds elements based on their natural ordering
    (if they implement Comparable interface) or based on a specified comparator function.
    Therefore, head element in this case will be the least element.'
