  md: 'Basically, the iterator pattern permits all elements of the collection to be
    accessed sequentially, with some operation being performed on each element. You
    can note that iterator has two core methods:


    +   - hasNext() returns true value if the iteration has more elements and we use
    it in the while loop (it works in similar way like next() of result sets)


    +   - next() returns an element and we use it to access the current element of
    iteration


    You can also use forRemaining() method. It accepts a consumer function that is
    executed for each remaining element until all elements have been processed or
    the action throws an exception. Note, that iterator() method is not optional.


    We will discuss iterators deeper in Chapter 8.


    # Access an individual element of a collection


    I have to mention that java.util.Collection does not specify methods to access
    individual elements. This means, that each particular implementation has to provide
    its own. For example, elements of array-based lists can be accessed by their index;
    however sets do not support such functionality. In other words, there is no unified
    way to access collection''s elements, as it fully depends on an underlying implementation.


    # Other non-optional methods


    Besides mentioned operations, there are other methods, defined in the Collection
    interface and marked as non-optional. They are not big enough to have a separate
    section for each of them, however they are still important to know by developers.
    That is why, I allocate them in this subsection. Take a look on these methods:


    +   - contains(Element e) returns true if this collection contains the specified
    element. This method utilizes an implementation of element''s equals() method
    in order to check an equality


    +   - containsAll(Collection c) returns true if this collection contains all of
    the elements in the specified collection.'
