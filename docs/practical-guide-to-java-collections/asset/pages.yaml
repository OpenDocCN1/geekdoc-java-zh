    What is a difference between findFirst() and findAny()? Like it can be figured
    out from their names, findFirst() returns the first occurrence of the matching
    element. From other side, findAny() returns any element, which satisfies a predicate.
    That could be possibly the first one or could not: behavior of this operation
    is explicitly nondeterministic; in other words, it is free to select any element
    in the stream.


    # Match


    An another common scenario to validate, that elements of a sequence satisfy a
    logical condition. We may need to check that either all elements, some elements,
    either none of elements are valid according some predicate. Stream API provides
    for this purpose a group of match methods. There are three functions:


    +   - allMatch()

    - noneMatch()

    - anyMatch()


    As name imply, match operations accept a predicate (a logical condition) and return
    a boolean value, that states elements of the stream match all, do not match at
    all, or just several of them match. We see it on practical examples.


    The first candidate is the anyMatch() terminal operation. It returns true if at
    least one element matches a predicate. This method may not evaluate the predicate
    on all elements of the stream, if it is not necessary for determining the result.
    On an empty stream false result is returned. Consider a list of integers. We use
    anyMatch() to figure out if there are even numbers:


    (Listing 2 – 20)'
