  md: '+   dropWhile produces a stream consisting of the remaining elements of this
    stream after dropping the longest prefix of elements that match the given predicate.


    +   takeWhile() produces a stream consisting of the longest prefix of elements
    taken from this stream that match the given predicate.


    Note, both methods work with streams, that have elements in order. This means,
    that you have to sort elements, for example using sorted() method, which was described
    in the previous section. In the listing 2-14 I use set.


    Listing 2-14


    ```

    @Test

    void whileTest(){

    Set<Integer> numbers = Set.of(1,2,3,4,5,6,7,8);

    Stream<Integer> stream = numbers.stream();

    Set<Integer> result = stream.takeWhile(x-> x < 5).collect(Collectors.toSet());

    assertThat(result).hasSize(4);

    }

