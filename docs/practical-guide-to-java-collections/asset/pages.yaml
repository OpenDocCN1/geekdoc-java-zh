  md: '+   - isEmpty() returns true if the collection is empty

    - size() returns an integer value with a number of elements in the collection

    - toArray() creates an array Element[] from elements of the collection


    As a summary for this chapter, these methods provide unified interfaces for all
    types of collections. Of course, each particular sub class has its different underlying
    implementation of these methods, due to concrete data structure''s logic. But
    all of them inherit non-optional functionality from the root interface. This,
    as we mentioned already, ensures better learning curve for developers and promotes
    interoperability.'
