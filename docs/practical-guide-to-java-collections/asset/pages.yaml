  md: '# Remove elements from a collection


    In contrast with two insertion operations, there are more methods to delete elements
    from the collection. Let briefly observe them:


    +   - void clear() removes all of the elements from the collection

    - boolean remove(Element e) removes a single instance of the specified element
    e from the collection (if element is presented)

    - boolean removeAll(Collection c) deletes all of the collection''s elements that
    are also contained in the argument''s collection

    - boolean remove(Predicate filter) deletes all of the elements of this collection
    that satisfy a given predicate condition


    (Listing 1-2)


    ```

    @Test

    void removeTest(){

    // get mock posts

    List<Post> posts = getPosts();


    Post post = posts.get(2);

    assertThat(posts).contains(post);


    // remove object

    posts.remove(post);

    assertThat(posts).doesNotContain(post);


    // clear

    posts.clear();

    assertThat(posts).isEmpty();


    // delete with predicate

    posts = getPosts();

    // remove posts with ID 2 and 4

    posts.removeIf(p -> p.getId() % 2 == 0);

    assertThat(posts).hasSize(3);

    }

    ```'
