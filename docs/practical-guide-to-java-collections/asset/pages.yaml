  md: "# Reverse (invert) a map\n\nBy the map inversion (reversion) we understand\
    \ swapping between keys and values. We can say that a Map<K,V> pair after inverting\
    \ becomes a Map<V,K> pair. It is important to remember, that keys should be unique\
    \ in Java maps. Therefore, when swapping keys and values, you need to be sure,\
    \ that values (which becomes keys) are unique.\n\nReverse keys/values in map use\
    \ Apache Collections Commons. This library has a class MapUtils that provides\
    \ a static method invertMap(), which does the inversion operation. This method\
    \ assumes that the inverse mapping is well defined. If the input map had multiple\
    \ entries with the same value mapped to different keys, the returned map will\
    \ map one of those keys to the value, but the exact key will be mapped to undefined.\n\
    \nLet have an example with a phone book, where we will swap phone number (key)\
    \ and a name (value).\n\n(Listing 6-5)\n\n```\n@Test\nvoid invertCommonsTest()\
    \ {\n    Map<String, String> phones = new HashMap<>();\n    System.out.println(\"\
    Original map: \");\n    phones.put(\"11222333\", \"Jana Novakova\");\n    phones.put(\"\
    444555666\", \"Zuzka Dvorakova\");\n    phones.put(\"777889999\", \"Alex Vodicka\"\
    );\n\n    phones.forEach((key, value) -> System.out.println(\"Key: \" + key +\
    \ \", value: \" + + value));\n\n    Map<String, String> inverted = MapUtils.invertMap(phones);\n\
    \n    System.out.println(\"Inverted map: \");\n    inverted.forEach((key, value)\
    \ -> System.out.println(\"Key: \" + key + \", value: \" + + value));\\n}\n```"
