    that is available since Java 10. The method returns an immutable list, which contains
    the elements of the given collection (e.g. can be used with other collections
    as sources), in its iteration order. The given collection must not be null, and
    it must not contain any null elements. If the given collection is subsequently
    modified, the returned list will not reflect such modifications.


