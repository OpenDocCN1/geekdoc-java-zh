    Not all Java collections allows duplicates: sets, for example, perform a checking
    for inserted elements and therefore do not allow duplicate values. Other collections,
    like lists, do not offer this functionality. In this case, when you need to asserts
    that the collection does not have duplicate elements, it is advised to use the
    doesNotHaveDuplicates() method:


