    # Consume an element


    Since Java 8 iterators permit also to specify a consumer function, which can be
    performed on each element. This is a shortcut of what we can do while using a
    block. Let consider the first example implemented with the forRemaining() method.
    Take a look on the code snippet below:


    (Listing 8-4)


    ```

    List<Integer> numbers = List.of(1, 2, 3, 4, 5, 6);

    Iterator<Integer> iterator = numbers.iterator();

    iterator.forEachRemaining(number -> System.out.printf("This is a consumer. Value:
    %d \n", number*2));

    ```


    This program listing produces the following result:


    ![](img/a398e64f5a6d595324f5e906ad60a773_70_0.png)


    It is possible to achieve a similar result with IteratorUtils. This utility class
    has static methods:


    +   - forEach() = applies the function to each element of the provided iterator.

    - forEachButLast() = executes the defined function on each provided element but
    the last element in the iterator'
