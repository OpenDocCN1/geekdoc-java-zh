  md: '# Chapter 6. Maps


    This chapter is devoted to map implementations in Java. We already mentioned,
    that as maps do not inherit the root collection interface, they are not (in a
    narrow sense) collections. However, the book about Java data structures would
    be insufficient without maps.


    From a technical point of view, map is a data structure, which stores its elements
    in a key-value format. In other programming languages such components are called
    hashes, associative arrays or dictionaries. Maps bring a number of advantages.
    Such, they are able to maintain an arbitrary number of different objects in a
    same time and the upper limit of the size is not needed to be known ahead, compare
    to array structures. In Java maps such identifier is called key. Maps do not allow
    duplicate keys, however they allow multiple same values for unique keys. Some
    Java implementations permit a single null key (except for tree maps). Take a look
    on the graph, that represents hierarchy of Java maps:


    ![](img/a398e64f5a6d595324f5e906ad60a773_59_0.png)


    The HashMap class, comparing to the HashMap class and the TreeMap class, does
    not guarantee a sorted order of elements. To have this ordering, keys should be
    comparable (implement a Comparable interface) or a developer should provide a
    comparator function during map''s initialization. An important note about Java
    maps is that they are not synchronized.


    # Insert new elements


    An element of map is basically a key-value pair (record). As maps don''t allow
    duplicate keys, the uniqueness of the key is validated at the moment of insertion.
    When the key is already associated with a value, it is updated for a new value.
    To add a new element we can use two methods:'
