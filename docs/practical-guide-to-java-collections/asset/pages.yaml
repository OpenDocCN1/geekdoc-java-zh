  md: "# Reduction\n\nFrom a technical point of view, reduction is an operation, that\
    \ allows to produce a single result from a sequence of elements. A good example\
    \ of a reduction is sum operation: we add each element and return a final result.\
    \ In other words, reduction is an application of some function (for instance,\
    \ addition) repeatedly over all members of a sequence.\n\nJava provides its implementation\
    \ of reduction as the reduce() terminal operation. This method takes two arguments:\
    \ an identity value and a binary operator, that specifies combining function.\
    \ Identity is an initial value (for example 0 or empty string) or a default value,\
    \ in case of an empty stream. The binary operator takes two parameters: a partial\
    \ result (for instance, subtotal of total) and a next element of a stream.\n\n\
    Let see how to use the reduce() function on two examples: on a list of numbers\
    \ (we expect a sum) and on a list of strings (we expect a word):\n\n(Listing 2-23)\n\
    \n```\n@Test\nvoid reduceTest(){\n    // numbers\n    List<Integer> numbers =\
    \ Arrays.asList(10, 20, 30, 40, 50);\n    int total = numbers.stream().reduce(0,\
    \ (subtotal, number) -> subtotal + number);\n    Assertions.assertThat(total).isEqualTo(150);\n\
    ```\n\nTo sum up, the usage of a reduction operation helps to create a single\
    \ result from a sequence."
