    # Sorting


    In many situations, we need to sort elements of a collection in some way, for
    example in their natural order. The method `sorted()` returns a stream, which
    elements are sorted in the natural order.


    (Listing 2-13)


    # @Test


    ```

    void sortTest() {

    List<Integer> numbers = Arrays.asList(-9, -18, 0, 25, 4);

    Stream<Integer> stream = numbers.stream();

    List<Integer> result = stream.sorted().collect(Collectors.toList());

    assertThat(result).containsAll(numbers).containsExactly(-18, -9, 0, 4, 25);

    }

    ```


    In the 2-13 I used a stream, which elements are numbers. The Integer class implements
    `Comparable` interface, therefore provides logic to compare values. If you use
    `sorted()` with own classes, you have to implement `Comparable` and write it yourself.
    Otherwise, `ClassCastException` will be thrown, when a terminal operation will
    be executed.


