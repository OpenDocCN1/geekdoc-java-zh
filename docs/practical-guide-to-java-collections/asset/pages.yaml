  md: '# Foreword


    When we say "Java collections", we can actually mean two things. In a general
    sense, we talk about implementations of common data structures, like array-based
    lists, sets, queues, maps, vectors etc. In a more narrow understanding, we describe
    concrete abstractions and implementations, which together make Java Collections
    Framework. This is a set of most widely used data structures and corresponding
    algorithms (like sorting, searching or filtering), which inherit the the root
    java.util.Collection interface.


    These classes are provided as a part of Java Development Kit (JDK) to make our
    lives as developers easier in many ways. For example, a common base reduces a
    learning curve for novice programmers and protects us from reinventing a wheel,
    when we deal with data structures and algorithms.


    This book is for Java developers of all levels. It can be equally useful for beginners,
    who just start to study Java Collections. But it can also serve for more advanced
    software engineers as a reference manual.'
