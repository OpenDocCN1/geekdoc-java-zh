  md: 'Note, that not all of these methods are optional (which means, that it can
    be skipped in particular implementations). Such, removeIf() method is not an optional
    operation, while remove(), removeAll() and clear() are marked as optional operations.


    # Create streams from a collection


    In Java, stream stands for a sequence of elements supporting sequential and parallel
    aggregate operations. We will examine them in details in the next chapter. The
    root contract supplies two methods to initialize streams (both are not optional):


    +   - Stream<E> stream() creates a sequential stream with this collection as its
    source


    +   - Stream<E> parallelStream() creates a possibly parallel stream with this
    collection as its source.


    Let have a look on the code snippet below:


    (Listing 1-3)


    ```

    @Test

    void streamTest(){

    List<Post> posts = getPosts();

    Stream<Post> stream = posts.stream();

    assertThat(stream).isInstanceOf(Stream.class);

    }

    ```


    # Iterate over a collection


    From a technical point of view, iteration stands for a technique used to sequence
    through a block of code repeatedly until a specific condition exists or no longer
    exists. In other words, iterators traverse an abstract data structure in a predictable
    order. Java provides several approaches to iterate over a collection. Note, that
    not all collections provide us way to access an element on a base of index (for
    instance, sets do not).'
