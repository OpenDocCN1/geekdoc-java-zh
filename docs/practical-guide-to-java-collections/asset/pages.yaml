  md: "# Chapter 2. How to use streams\n\nStreams were first introduced in Java 8\
    \ and then were updated in next releases. This concept defines a sequence of elements\
    \ supporting sequential and parallel aggregate operations. Please don't confuse\
    \ the word \"stream\": before 8th version, Java had InputStream and OutputStream.\
    \ However, these classes have nothing in common with the hero of this chapter.\
    \ Streams API, that was introduced in Java 8 is an implementation of a monad pattern:\
    \ the concept, which was brought from functional languages like Haskell or Clojure.\n\
    \nThe idea of streams gains its popularity with rise of parallel computations.\
    \ It is based on principle of lazy evaluation. From a technical point of view,\
    \ this means, that actual evaluation is suspended until the result is needed.\
    \ The laziness of operations states, that the actual computation on the source\
    \ data is performed after the final operation is invoked, and source elements\
    \ are consumed only as needed.\n\nLet have a look on a simple example. Imagine,\
    \ that we create a program, which brings all occurrences of a particular name\
    \ in a console. First, let write it in a traditional (imperative) paradigm:\n\n\
    (Listing 2-1)\n\n```\nList<String> names = Arrays.asList(\"Anna\", \"Bob\", \"\
    Carolina\", \"Denis\", \"Anna\", \"Jack\", \"Marketa\", \"Simon\", \"Anna\");\n\
    \nfor (String name: names){\n  if (name.equalsIgnoreCase(\"Anna\")){n    System.out.println(name);\n\
    \  }\n}\n```\n\nWhat do we do here is that we find all occurrences of “Anna” in\
    \ the list and print them. That is a simple operation, it requires to write a\
    \ lot of code for a small task! With streams, we can rewrite the previous example\
    \ using the declarative paradigm.\n\n(Listing 2-2)"
