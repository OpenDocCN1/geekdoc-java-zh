  md: 'What is a difference and when to use one? Java recommends to stick with native
    queue methods, which means for addition use the offer(i) method. The difference
    comes when it is not possible to insert a new element:


    +   - offer() returns false boolean value

    - add() throws IllegalStateException


    Special note must be made in case of the ArrayDeque. This class also inherits
    the Deque interface. This interface defines a data structure that permits to add
    and remove elements on both ends in comparing with the classical queue. This class
    adds some methods that are specific only for this class:


    +   - offerFirst() and addFirst() insert an element to the head. A difference
    between them is the same as between offer(i) and add(i) methods

    - offerLast() and addLast() insert an element to the tail

    - push() is equivalent to the addFirst() method. In case of an insertion of a
    null element, this method will throw a NullPointerException


    # Handling dequeue operations


    Removing an element in queue is called dequeue. As with case of insertion, Java
    queues have two methods to handle a deletion of an element: one is inherited from
    the root contract’s remove() method and another is the native for queues method
    poll(). Both remove a head element (based on FIFO principle).


