    # Filter


    When we filter a list, we basically create a new list, which contains all elements
    from the original list, that satisfy a logical condition (predicate). The List
    interface does not have a standard filter() method, like in other programming
    languages (for example, in JavaScript). We can implement it manually by creating
    a stream, applying a filter() intermediate operation and then collecting results
    as a list.


