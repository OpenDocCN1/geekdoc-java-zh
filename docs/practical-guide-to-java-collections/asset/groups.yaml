    \  numbers.add(15);\n  numbers.add(20);\n  numbers.add(25);\n  numbers.add(30);\n\
    \  assertThat(numbers.add(66)).isTrue();\n}\n```\n\n```java\n//方法 2. 使用 Arrays.asList.\
