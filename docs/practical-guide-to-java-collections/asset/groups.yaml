    # 前言


    当我们谈论“Java 集合”时，我们实际上指的是两个含义。从广义上说，我们讨论的是常用数据结构的实现，例如基于数组的列表、集合、队列、映射、向量等。在更窄的理解下，我们描述的是具体的抽象和实现，它们共同构成了
    Java 集合框架（Java Collections Framework）。这是一组最广泛的数据结构和相应的算法（如排序、搜索或过滤），它们都继承自根接口
    `java.util.Collection`。


    这些类作为 Java 开发工具包（JDK）的一部分提供，在许多方面简化了我们作为开发者的工作。例如，通用的基类降低了初级程序员的学习曲线，并在我们处理数据结构和算法时避免了重复造。


    本书适用于所有水平的 Java 开发者。它对于刚开始学习 集合的初学者来说同样有用，但也可以作为高级软件工程师的参考手册。


    # 致谢


    出版这本书对我来说是一个巨大的荣幸。它给了我一个很好的机会来总结和反思我的技能。我想将这本书献给父亲 Andrei：我花了更多时间学习（我的第一个专业是国际经济，之后才转到计算机科学）。如果没有我父亲的耐心，这一切是不可能的。


    # 第 1 章：java.util.Collection 概述


    当我们谈论 Java 集合时，我们考虑两个方面。首先，是一个更广泛的概念，意味着常用数据结构的实现。另一个较窄的理解对应于 Java 集合框架包含的具体接口及其实现，它们作为
    JDK 的一部分开箱即用。从这个意义上说，我们需要记住这些集合继承自根接口 `java.util.Collection`，定义了子类应该实现的所有通用功能。


    # 哪些数据结构是集合


    本节提供了 Java 集合框架的概览视图。该库为开发者提供了一个统一的架构来表示和操作集合，使集合能够独立于实现细节进行操作。Java 编程语言将集合定义为一个表示一组对象的对象。换句话说，Java
    集合框架（下文简称 JCF）包含了许多接口和实现，用于排序、搜索或过滤等操作。


    首先，请观察下图，它总结了 JCF 的层次结构：


    ![](img/a398e4f5a6d59532f5e906a73_0.png)


    一个常见的面试问题似乎是“我们为什么要使用 JCF？”嗯：


    - JCF 减少了处理数据结构和算法的工作，因为你不需要重复造

    - JCF 提供了数据结构和算法的实现，因此提高了效率

    - JCF 建立了不同 API 之间的互操作性

    - JCF 让学习集合变得更容易


    回到图中。根类是 `java.util.Collection` 和 `java.util.Map`。需要记住，从技术角度来看，映射不是集合，虽然它们包含视图操作，可以作为集合进行操作。


    正如前面提到的，Java 集合是一组对象，这些对象被称为元素。注意，集合中的元素必须唯一（例如 Set），而其他类型允许重复（例如数组的列表）。`java.util.Collection`
    接口没有直接实现，Java 有其子接口的实现。该接口通常用于传递集合并操作它们。


    总结，`java.util.Collection` 允许我们通过以下方式插入元素：


    * boolean add(Element e) 添加新元素 E 并确保集合包含指定的元素。如果集合由于此调用而发生了变化，则返回 true 或 false。

    * boolean addAll(Collection c) 将集合 C 中的所有元素插入集合中。注意，该方法也返回布尔值，如果集合由于此调用而发生了变化，则返回
    true。


    某些实现对可能包含的元素施加了限制，结果是禁止了某些插入。例如，如果集合不允许重复，则不能添加已存在的元素。空值也是如此。


