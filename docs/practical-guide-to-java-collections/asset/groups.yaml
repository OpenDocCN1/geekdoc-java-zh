- md: "\n# Remove elements from a collection\n\nIn contrast with two insertion operations,\
    \ there are more methods to delete elements from the collection. Let briefly observe\
    \ them:\n\n- void clear() removes all of the elements from the collection\n- boolean\
    \ remove(Element e) removes a single instance of the specified element e from\
    \ the collection (if element is presented)\n- boolean removeAll(Collection c)\
    \ deletes all of the collection's elements that are also contained in the argument's\
    \ collection\n- boolean removeIf(Predicate filter) deletes all of the elements\
    \ of this collection that satisfy a given predicate condition\n\n(Listing 1-2)\n\
    \n```\n@Test\nvoid removeTest(){\n// get mock posts\nList<Post> posts = getPosts();\n\
    \nPost post = posts.get(2);\nassertThat(posts).contains(post);\n\n// remove object\n\
    posts.remove(post);\nassertThat(posts).doesNotContain(post);\n\n// clear\nposts.clear();\n\
    assertThat(posts).isEmpty();\n\n// delete with predicate\nposts = getPosts();\n\
    // remove posts with ID 2 and 4\nposts.removeIf(p -> p.getId() % 2 == 0);\nassertThat(posts).hasSize(3);\n\
    }\n```\n\nNote, that not all of these methods are optional (which means, that\
    \ it can be skipped in particular implementations). Such, removeIf() method is\
    \ not an optional operation, while remove(), removeAll() and clear() are marked\
    \ as optional operations.\n\n# Create streams from a collection\n\nIn Java, stream\
    \ stands for a sequence of elements supporting sequential and parallel aggregate\
    \ operations. We will examine them in details in the next chapter. The root contract\
    \ supplies two methods to initialize streams (both are not optional):\n\n- Stream<E>\
    \ stream() creates a sequential stream with this collection as its source\n- Stream<E>\
    \ parallelStream() creates a possibly parallel stream with this collection as\
    \ its source.\n\nLet have a look on the code snippet below:\n\n(Listing 1-3)\n\
    \n```\n@Test\nvoid streamTest(){\nList<Post> posts = getPosts();\nStream<Post>\
    \ stream = posts.stream();\nassertThat(stream).isInstanceOf(Stream.class);\n}\n\
    ```\n\n# Iterate over a collection\n\nFrom a technical point of view, iteration\
    \ stands for a technique used to sequence through a block of code repeatedly until\
    \ a specific condition exists or no longer exists. In other words, iterators traverse\
    \ an abstract data structure in a predictable order. Java provides several approaches\
    \ to iterate over a collection. Note, that not all collections provide us way\
    \ to access an element on a base of index (for instance, sets do not).\n\nTherefore\
    \ in this section we will not explore iteration approaches. Rather we will concentrate\
    \ on approaches, that can be used with any implementation. As the root collection\
    \ contract also extends the Iterable interface, let explore how it permits us\
    \ to go through elements of collection:\n\n- Using iterators\n- Using streams\n\
    - Using forEach()\n\n(Listing 1-4)\n\n```\n@Test\nvoid iterationTest(){\nList<Post>\
    \ posts = getPosts();\n```\n\n```\n// create iterator\nIterator<Post> iterator\
    \ = posts.iterator();\n\n// Option 1 with hasNext\nSystem.out.println(\"Iteration\
    \ using iterator hasNext\");\nwhile(iterator.hasNext()) {\n  Post post = iterator.next();\n\
    \  System.out.println(post);\n}\nIterator<Post> iterator2 = posts.iterator();\n\
    \n// Option 2 using forRemaining\nSystem.out.println(\"Iteration using iterator\
    \ forRemaining\");\niterator2.forEachRemaining(p -> System.out.println(p));\n\n\
    // using forEach\nSystem.out.println(\"Iteration using forEach\");\nposts.forEach(p\
    \ -> System.out::println(p));\n\n// using stream\nSystem.out.println(\"Iteration\
    \ using stream\");\nposts.stream().forEach(p -> System.out.println(p));\n}\n```\n\
    \nBasically, the iterator pattern permits all elements of the collection to be\
    \ accessed sequentially, with some operation being performed on each element.\
    \ You can note that iterator has two core methods:\n\n- hasNext() returns true\
    \ value if the iteration has more elements and we use it in the while loop (it\
    \ works in similar way like next() of result sets)\n- next() returns an element\
    \ and we use it to access the current element of iteration\n\nYou can also use\
    \ forRemaining() method. It accepts a consumer function that is executed for each\
    \ remaining element until all elements have been processed or the action throws\
    \ an exception. Note, that iterator() method is not optional.\n\nWe will discuss\
    \ iterators deeper in Chapter 8.\n\n# Access an individual element of a collection\n\
    \nI have to mention that java.util.Collection does not specify methods to access\
    \ individual elements. This means, that each particular implementation has to\
    \ provide its own. For example, elements of array-based lists can be accessed\
    \ by their index; however sets do not support such functionality. In other words,\
    \ there is no unified way to access collection's elements, as it fully depends\
    \ on an underlying implementation.\n\n# Other non-optional methods\n\nBesides\
    \ mentioned operations, there are other methods, defined in the Collection interface\
    \ and marked as non-optional. They are not big enough to have a separate section\
    \ for each of them, however they are still important to know by developers. That\
    \ is why, I allocate them in this subsection. Take a look on these methods:\n\n\
    - contains(Element e) returns true if this collection contains the specified element.\
    \ This method utilizes an implementation of element's equals() method in order\
    \ to check an equality\n- containsAll(Collection c) returns true if this collection\
    \ contains all of the elements in the specified collection.\n- isEmpty() returns\
    \ true if the collection is empty\n- size() returns an integer with number of\
    \ elements\n- toArray() creates an array from the collection\n\nAs a summary for\
    \ this chapter, these methods provide unified interfaces for all types, we mentioned\
    \ already, can be created from collections.\n\n# Chapter 2. How to use streams\n\
    \nStreams were first introduced in Java 8 and then updated in next releases. This\
    \ concept defines a sequence of elements supporting sequential and parallel operations.\
    \ Please don't confuse the word \"stream\": before 8th version, Java had InputStream\
    \ and OutputStream. The idea of streams gains its popularity with rise of functional\
    \ languages like Haskell or Clojure. It is based on principle of lazy evaluation.\n\
    \nLet have a look on a simple example. Imagine, that we create a program, which\
    \ brings all occurrences in console. First, let write it in traditional (imperative)\
    \ paradigm:\n\n(Listing 2-1)\n\n```\nList<String> names = Arrays.asList(\"Anna\"\
    , \"Bob\", \"Carolina\", \"Denis\", \"Anna\", \"Jack\", \"Marketa\", \"Simon\"\
    , \"Anna\");\n\nfor (String name: names){\n  if (name.equalsIgnoreCase(\"Anna\"\
    )){\n    System.out.println(name);\n  }\n}\n```\n\nWhat do we do here is that\
    \ we find all occurrences of “Anna” in the list and print them. That is a simple\
    \ operation, it requires to write a lot of code for a small task! With streams,\
    \ we can rewrite the previous example using the declarative paradigm.\n\n(Listing\
    \ 2-2)\n\n```java\nnames.stream().filter(name->name.equalsIgnoreCase(\"Anna\"\
    )).forEach(System.out::println);\n```\n\nThis is totally different case! This\
    \ one line code (it is sometimes called one-liner among developers) does same\
    \ thing, but in a contrasting way. Instead of loop and if-else condition, declarative\
    \ approach combines functions into pipelines. In our example we have two operations\
    \ – filter(), which looks for requested entities, and forEach(), which executes\
    \ some action on each.\n\n# Initialize a stream\n\nFrom a technical point of view,\
    \ stream is a programming abstraction, and it is not the same thing as collection,\
    \ although it can be created from collections. These concepts are often mixed\
    \ by developers, that start with functional programming in Java, and we need to\
    \ distinguish them. In this section we observe different approaches, that are\
    \ used to initialize streams.\n\n# From collections\n\nAs this book is devoted\
    \ to Java Collections Framework, it may seem logically to start with collections.\
    \ I mentioned already, that stream is not a collection, but it uses elements from\
    \ a collection as its data source. In the previous chapter we noted a built-in\
    \ method stream(), that is brought by the root interface and which creates a sequential\
    \ stream from the collection.\n\n(Listing 2-3)\n\n```\nList<String> names = Arrays.asList(\"\
    Alejandra\", \"Beatriz\", \"Carmen\", \"Dolores\", \"Juanita\")\nStream<String>\
    \ namesStream = names.stream();\nassertThat(namesStream).isInstanceOf(Stream.class);\n\
    ```\n\n# From generated data\n\nIf you don't have a collection with defined data,\
    \ you can create a stream with generated records. This may be useful for experimenting\
    \ with streams methods. In such case, you need to define a supplier\n"
  mdcn: "\n\n# 从集合中移除元素\n\n与两种插入操作相比，有更多方法可以从集合中删除元素。让我们简要观察它们：\n\n- void clear()\
    \ 移除集合中的所有元素\n- boolean remove(Element e) 从集合中移除指定元素 e 的单个实例（如果元素存在）\n- boolean\
    \ removeAll(Collection c) 删除集合中所有包含在参数集合 c 中的元素\n- boolean removeIf(Predicate\
    \ filter) 删除此集合中所有满足给定谓词条件的元素\n\n（Listing 1-2）\n\n```\n@Test\nvoid removeTest(){\n\
    // 获取模拟数据 posts\nList<Post> posts = getPosts();\n\nPost post = posts.get(2);\n\
    assertThat(posts).contains(post);\n\n// 移除对象\nposts.remove(post);\nassertThat(posts).doesNotContain(post);\n\
    \n// 清空\nposts.clear();\nassertThat(posts).isEmpty();\n\n// 使用谓词删除\nposts = getPosts();\n\
    // 移除 ID 为 2 和 4 的 posts\nposts.removeIf(p -> p.getId() % 2 == 0);\nassertThat(posts).hasSize(3);\n\
    }\n```\n\n注意，并不是所有这些方法都是可选的（这意味着在特定实现中可以跳过）。例如，`removeIf()` 方法不是可选操作，而 `remove()`、`removeAll()`\
    \ 和 `clear()` 被标记为可选操作。\n\n# 从集合创建流\n\n在 Java 中，stream（流）代表支持顺序和并行聚合操作的元素序列。我们将在下一章中详细检查它们。根接口提供了两个方法来初始化流（两者都不是可选的）：\n\
    \n- Stream<E> stream() 创建一个以此集合为源的顺序流\n- Stream<E> parallelStream() 创建一个以此集合为源的可能的并行流\n\
    \n让我们看看下面的代码片段：\n\n（Listing 1-3）\n\n```\n@Test\nvoid streamTest(){\nList<Post>\
    \ posts = getPosts();\nStream<Post> stream = posts.stream();\nassertThat(stream).isInstanceOf(Stream.class);\n\
    }\n```\n\n# 遍历集合\n\n从技术角度来看，迭代是一种技术，用于按顺序重复执行代码块，直到特定条件存在或不再存在。换句话说，迭代器按照可预测的顺序遍历抽象数据结构。Java\
    \ 提供了几种遍历集合的方法。注意，并不是所有集合都提供基于索引访问元素的方法（例如，集合不支持此功能）。\n\n因此，在本节中我们不会探索遍历方法。相反，我们将关注适用于任何实现的方法。由于根集合接口也扩展了\
    \ `Iterable` 接口，让我们看看它如何允许我们遍历集合元素：\n\n- 使用迭代器\n- 使用流\n- 使用 forEach()\n\n（Listing\
    \ 1-4）\n\n```\n@Test\nvoid iterationTest(){\nList<Post> posts = getPosts();\n\
    ```\n\n```\n// 创建迭代器\nIterator<Post> iterator = posts.iterator();\n\n// 选项 1：使用\
    \ hasNext\nSystem.out.println(\"使用 iterator hasNext 进行迭代\");\nwhile(iterator.hasNext())\
    \ {\n  Post post = iterator.next();\n  System.out.println(post);\n}\nIterator<Post>\
    \ iterator2 = posts.iterator();\n\n// 选项 2：使用 forRemaining\nSystem.out.println(\"\
    使用 iterator forRemaining 进行迭代\");\niterator2.forEachRemaining(p -> System.out.println(p));\n\
    \n// 使用 forEach\nSystem.out.println(\"使用 forEach 进行迭代\");\nposts.forEach(p ->\
    \ System.out::println(p));\n\n// 使用 stream\nSystem.out.println(\"使用 stream 进行迭代\"\
    );\nposts.stream().forEach(p -> System.out.println(p));\n}\n```\n\n基本上，迭代器模式允许顺序访问集合中的所有元素，并在每个元素上执行某些操作。你可以注意到迭代器有两个核心方法：\n\
    \n- hasNext() 如果迭代还有更多元素，且我们在 while 循环中使用它，则返回真值（其工作方式类似于结果集的 `next()`）\n- next()\
    \ 返回一个元素，我们并使用它来访问迭代的当前元素\n\n你也可以使用 `forRemaining()` 方法。它接受一个消费者函数，该函数将在每个剩余元素上执行，直到所有元素处理完毕或操作抛出异常。注意，`iterator()`\
    \ 方法不是可选的。\n\n我们将在第 8 章深入讨论迭代器。\n\n# 访问的单个元素\n\n我必须提到，`java.util.Collection` 并没有指定访问单个元素的方法。这意味着每个特定的实现都必须提供自己的方法。例如，基于数组的列表元素可以通过索引访问；但集合（sets）不支持这种功能。换句话说，没有统一的方法来访问集合元素，因为它完全取决于底层实现。\n\
    \n# 其他非可选方法\n\n除了提到的操作外，`Collection` 接口中还定义了其他被标记为非可选的方法。它们的重要性不足以为每个方法都单独分一个章节，但对开发者来说仍然非常重要。这就是为什么在这个小节中列出它们。查看这些方法：\n\
    \n- contains(Element e) 如果集合包含指定的元素 e，则返回真\n- containsAll(Collection c) 如果集合包含集合\
    \ c 中的所有元素，则返回真\n- isEmpty() 如果集合为空，则返回真\n- size() 返回元素的数量整数\n- toArray() 从集合创建数组\n\
    \n作为本章的总结，这些方法提供了统一接口，可以从集合创建。\n\n# 第 2 章 如何使用流\n\n流在 Java 8 中首次引入，并在随后的版本中进行了更新。这个概念定义了支持顺序和并行操作元素序列。请不要混淆“流”：在第\
    \ 8 版本之前，Java 有 `InputStream` 和 `OutputStream`。流基于延迟求值原则。让我们来看简单的例子。假设我们创建一个输出所有出现情况到控制台的程序。首先，用传统的命令式范式编写它：\n\
    \n（Listing 2-1）\n\n```\nList<String> names = Arrays.asList(\"Anna\", \"Bob\",\
    \ \"Carolina\", \"Denis\", \"Anna\", \"Jack\", \"Marketa\", \"Simon\", \"Anna\"\
    );\n\nfor (String name: names){\n  if (name.equalsIgnoreCase(\"Anna\")){\n   \
    \ System.out.println(name);\n  }\n}\n```\n\n我们在这里做的是在列表中找到所有的“Anna”并打印它们。这是一个简单的操作，需要编写大量代码！通过流，我们可以使用声明式范式重写之前的示例。\n\
    \n（Listing 2-2）\n\n```java\nnames.stream().filter(name->name.equalsIgnoreCase(\"\
    Anna\")).forEach(System.out::println);\n```\n\n这是一个完全不同的情况！这行代码（开发者有时称为 one-liner）做了相同的事情，但方式相反。与其循环和\
    \ if-else 条件，声明式方法将函数组合成管道。在我们的示例中，我们有两个操作——`filter()` 用于查找实体，`forEach()` 在每个元素上执行某些操作。\n\
    \n# 初始化流\n\n从技术角度来看，流是一种编程抽象，它和集合不是一个东西，尽管它可以从集合创建。这些概念经常被在 Java 中开始函数式编程的开发者混淆，我们需要区分它们。在本节中，我们观察用于初始化流的不同方法。\n\
    \n# 从集合\n\n由于本书致力于 Java 集合框架，从集合开始似乎是合理的。我已经提到过，流不是集合，但它使用集合中的元素作为数据源。在上章中，我们注意到一个内置方法\
    \ `stream()`，它是由根接口提供的，并从集合创建顺序流。\n\n（Listing 2-3）\n\n```\nList<String> names\
    \ = Arrays.asList(\"Alejandra\", \"Beatriz\", \"Carmen\", \"Dolores\", \"Juanita\"\
    )\nStream<String> namesStream = names.stream();\nassertThat(namesStream).isInstanceOf(Stream.class);\n\
    ```\n\n# 从生成的数据\n\n如果你没有定义数据的集合，可以创建一个带有生成记录的流。这对于实验流的方法可能有用。在这种情况下，你需要定义一个提供者\n\
    \n"
