    \ lists）和链表（linked lists）。\n\n基于数组的列表之所以因此，是因为在底层使用数组来存储值。数组的一个重要特性是尺寸是固定的，但基于数组的列表可以根据需要添加任意元素并扩展底层数组的大小。这里我们需要引入“大小”（size）和“容量”（capacity）的概念。看下面的图，它展示了一个数组列表，它有\
