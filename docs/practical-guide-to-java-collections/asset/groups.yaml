    # Assert that a collection contains elements in the specific order


    Another task is to validate, the collection contains not only all specified elements,
    but also keep the specific order. To do this, it is possible to use the containsExactlyElementsOf()
    method. It accepts an iterable class and verifies that actual collection contains
    exactly all the elements of the given iterable class and nothing else in the same
    order.


    (Listing 7-3)


    ```

    @Test

    void containsAllElementsInOrderTest{

    List<Integer> numbers = Lists.asList(1, 52, 12, 39, 45, 98, 100, 565, 6, 13);

    List<Integer> values = Lists.asList(numbers);

    assertThat(numbers).containsExactlyElementsOf(values);

    }

    ```


    # Assert that a collection does not contain duplicates


    Not all Java collections allows duplicates: sets, for example, perform a checking
    for inserted elements and therefore do not allow duplicate values. Other collections,
    like lists, do not offer this functionality. In this case, when you need to asserts
    that the collection does not have duplicate elements, it is advised to use the
    doesNotHaveDuplicates() method:


    (Listing 7-4)'
