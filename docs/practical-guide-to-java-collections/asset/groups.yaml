    \n# 第 8 章 迭代器 (Iterators)\n\n迭代器模式是访问集合元素的方法之一，流（streams）也是如此。从技术角度来看，迭代器按照顺序且可预测的顺序遍历元素。在\
    \ Java 中，迭代器的行为在 `java.util.Iterator` 约定中定义，它是 Java 集合框架的成员。\n\n迭代器与枚举器（enumerators）相似，但这些概念之间也存在差异。枚举器为数据结构中的每个元素提供直接且仅一次迭代访问。另一方面，迭代器执行相同的任务，但遍历顺序是可预测的。通过这种抽象，调用者可以对集合元素进行操作，而无需直接访问它们。此外，迭代器允许在迭代期间从集合中删除值。\n\
    \n## 访问集合的元素\n\n如之前提到的元素的访问顺序是可预测的，这意味着迭代器按顺序遍历元素。因此，通用的 Java 约定不允许访问特定元素（但使用\
    \ Commons Collections 是可以行的，尽管这违背了该设计理念）。要访问下一个元素，请使用 `next()` 方法。它返回一个元素，或者当迭代器不再包含更多元素时抛出\
    \ `NoSuchElementException`。\n\n为了防止这种未检查的异常，您应该在访问元素之前调用 `hasNext()` 方法。\n\n(Listing\
    \ 8-1)\n\n```java\nList<Integer> numbers = List.of(1, 2, 3, 4, 5, 6);\nIterator<Integer>\
    \ iterator = numbers.iterator();\nwhile (iterator.hasNext()) {\n  int x = iterator.next()\
    \ * 2;\n  System.out.println(x);\n}\n```\n\n这段代码段演示了如何使用迭代器顺序检索元素并打印每个元素的双倍值。\n\
    \n输出 - Test (IteratorTest)\n\n```\n2\n4\n6\n8\n10\n12\n```\n\n这里需要注意的重要点是，一旦元素被消费，迭代器就无法再次使用。这意味着在遍历后调用迭代器会导致异常：\n\
    \n(Listing 8-2)\n\n```java\nList<Integer> numbers = List.of(1, 2, 3, 4, 5, 6);\n\
    Iterator<Integer> iterator = numbers.iterator();\nwhile (iterator.hasNext()) {\n\
    \  int x = iterator.next() * 2;\n  System.out.println(x);\n}\nint value = iterator.next();\n\
    ```\n\n执行该代码段将导致以下结果：\n\n```\nOutput - Test (IteratorTest)\nIteratorTest(tech.mednov.jbook.iterators.IteratorTest)\
    \    Time elapsed: 0.015 sec <<< FAILURE! \n  java.util.NoSuchElementException\n\
    \    at java.base/java.util.ImmutableCollections$ListI\n```\n\n## 删除元素\n\n最后，我们需要观察如何使用迭代器删除元素。`java.util.Iterator`\
    \ 接口包含了 `remove()` 方法。它从底层集合中删除迭代器返回的最后一个元素。该方法每次调用 `next()` 后只能调用一次。注意，此操作是可选的。\n\
    \n(Listing 8-6)\n\n```java\nList<Integer> numbers = new ArrayList<>();\nnumbers.add(1);\n\
    numbers.add(2);\nnumbers.add(3);\nnumbers.add(4);\nnumbers.add(5);\n```\n\n```java\n\
    System.out.println(\"Initial list: \");\nnumbers.stream().forEach(System.out::println);\n\
    Iterator<Integer> iterator = numbers.iterator();\nwhile(iterator.hasNext()) {\n\
    \  iterator.next();\n  iterator.remove();\n}\nSystem.out.println(\"Modified list:\
    \ \");\nnumbers.stream().forEach(System.out::println);\n```\n\n这段代码段执行并打印删除元素前后的列表元素，如下方的截图所示。\n\
    \n"
