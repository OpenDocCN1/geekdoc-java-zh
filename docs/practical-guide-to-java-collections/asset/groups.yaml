    it is equal to the specified old value and returns a boolean result of a replacement.


    (Listing 6-4)


    ```

    @Test

    void replaceElementTest(){

    Map<String, String> words = new TreeMap<>();

    words.put("apple", "manzana");

    words.put("orange", "naranja");

    words.put("pineapple", "pina");

    words.put("lemon", "limon");


    words.replace("lemon", "limón");

    String limon = words.get("limón");


    assertThat(limon).isEqualTo("limón");


    boolean result = words.replace("lemon", "limon", "un limon");

    assertThat(result).isFalse();

    }

