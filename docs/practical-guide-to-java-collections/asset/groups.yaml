    \n# Collectors\n\n`forEach()` 方法没有返回值：它消耗数据，但不提供返回结果（其返回类型为 `void`）。然而，我们经常需要对集合上的流执行某些操作，然后获取一个新的集合。在这些情况下，我们使用\
    \ `collect()` 方法。它使用收集器（collectors）对流的元素执行可变归约操作。\n\n![](img/a398e64f5a6d595324f5e906ad60a773_27.png)\n\
    \n（列表 2-18）\n\n```java\n@Test\nvoid collectTest() {\n    Stream<String> stream\
