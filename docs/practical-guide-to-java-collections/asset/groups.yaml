    # Chapter 4. Sets


    Set is an implementation of the mathematical concept of a finite set. Generally,
    a set is defined as a collection of elements with no duplicates and no ordering.
    In practice, for some particular implementations it is true that they have ordered
    elements.


    Java includes set implementations as a part of Java Collections Framework. The
    root interface java.util.Set defines a data structure, which contains to duplicates
    and at most 1 null element. Only one null element is allowed because, from a technical
    point of view, one presented null value is unique by its nature. You may ask,
    how Java understands if an element is unique? For a unique element e1 is true,
    that there is no element e2 in set already that e1.equals(e2) = true.


