    people.offer(new Person("Beatriz", "Sanchez"));

    people.offer(new Person("Carmen", "Hidalgo"));

    ```


    ```

    Queue<Person> tail = new ArrayDeque<>(people);

    tail.poll();

    ```


    ```

    assertThat(tail).hasSize(2);

    }

    ```


