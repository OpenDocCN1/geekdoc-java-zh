    }\n```\n\n## 断言集合包含特定顺序的元素\n\n另一个任务是验证集合不仅包含所有指定的元素，还保持了特定的顺序。为了实现这一点，可以使用 `containsExactlyElementsOf()`\
    \ 方法。它接受一个可迭代类，并验证实际集合恰好包含该可迭代类中的所有元素，且不包含其他元素，顺序相同。\n\n(Listing 7-3)\n\n```java\n\
    @Test\nvoid containsAllElementsInOrderTest() {\nList<Integer> numbers = Lists.asList(1,\
    \ 52, 12, 39, 45, 98, 100, 565, 6, 13);\nList<Integer> values = Lists.asList(numbers);\n\
    assertThat(numbers).containsExactlyElementsOf(values);\n}\n```\n\n## 断言集合不包含重复元素\n\
    \n并不是所有的 Java 集合都允许重复元素：例如，集合（sets）会对插入的元素进行检查，因此不允许重复值。其他集合（如列表）不提供此功能。在这种情况下，当需要断言集合不包含重复元素时，建议使用\
    \ `doesNotHaveDuplicates()` 方法：\n\n(Listing 7-4)\n\n```java\n@Test\nvoid noDuplicatesTest()\
    \ {\nList<Integer> numbers = Lists.newArrayList(1, 52, 12, 39, 45, 98, 100, 565,\
    \ 6, 13);\nassertThat(numbers).doesNotHaveDuplicates();\n}\n```\n\n## 断言集合仅包含一次元素\n\
    \n上一种情况的扩展情况是检查元素是否仅出现一次。从技术角度来看，`contains()` 方法允许重复实体。因此，为了验证元素不重复，在这种情况下更适合使用\
