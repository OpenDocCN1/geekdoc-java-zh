    // using lastIndexOf\n  List<Integer> numbers2 = Arrays.asList(1, 52, 12, 39,\
    \ 45, 98, 100, 565, 45, 13);\n  assertThat(numbers2.lastIndexOf(45)).isEqualTo(8);\n\
    }\n```\n\nAn alternative to JCF operations is ListUtils.indexOf() method from\
    \ Apache Collections library. This static operation accepts two arguments:\n\n\
    - Original list\n- Predicate\n\nIt returns the index of the first element that\
    \ matches the given predicate. Or -1 the element is not present or a list is empty.\
    \ This allows to find not only element by value, but also the one that satisfies\
