    # Foreword


    When we say "Java collections", we can actually mean two things. In a general
    sense, we talk about implementations of common data structures, like array-based
    lists, sets, queues, maps, vectors etc. In a more narrow understanding, we describe
    concrete abstractions and implementations, which together make Java Collections
    Framework. This is a set of most widely used data structures and corresponding
    algorithms (like sorting, searching or filtering), which inherit the the root
    java.util.Collection interface.


    These classes are provided as a part of Java Development Kit (JDK) to make our
    lives as developers easier in many ways. For example, a common base reduces a
    learning curve for novice programmers and protects us from reinventing a wheel,
    when we deal with data structures and algorithms.


    This book is for Java developers of all levels. It can be equally useful for beginners,
    who just start to study Java Collections. But it can also serve for more advanced
    software engineers as a reference manual.


    # Acknowledgments


    It is a huge honor for me to publish this book. It gives me a great opportunity
    to summarize and to reflect my skills. I would like to dedicate this book to my
    father Andrei: I spent more time to study, and that it should be (I studied international
    economics as my first major, and only then then I switched to computer science).
    And without my father’s patience it would not be possible.


    # Chapter 1. Overview of java.util.Collection


    When we talk about Java collections, we consider two things. First, a more wide
    concept, means implementations of common data structures. An another, narrow understanding,
    corresponds to concrete interfaces and their implementations, that are contained
    in Java Collections Framework, and are provided out-of-the-box as part of JDK.
    In that sense, we need to remember that such collections inherit the root interface
    java.util.Collection, that defines all common functionality, that sub classes
    should implement.


    # Which data structures are collections


    This section provides a helicopter view on Java Collections Framework. This library
    offers for developers a unified architecture for representing and manipulating
    collections, enabling collections to be manipulated independently of implementation
    details. Java programming language defines a collection as an object that represents
    a group of objects. In other words, Java Collections Framework (from here JCF)
    includes a number of interfaces and implementations that facilitate data operations
    like searching, sorting, insertion, manipulation, or deletion of elements.


    First, please observe the graph below, which sums up a hierarchy of JCF:


    ![](img/a398e64f5a6d595324f5e906ad60a773_8_0.png)


    One of the common interview questions sounds like "why do we use JCF"? Well


    - JCF reduces programming efforts, because you don''t need to reinvent these data
    structures and algorithms

    - JCF offers high-performance implementations of data structures and algorithms,
    therefore it increases performance

    - JCF establishes interoperability between various unrelated APIs

    - JCF makes it easier to learn collections for developers


    Let return to the illustration. The root classes are java.util.Collection and
    java.util.Map. That is important to remember, as it is common to think Map is
    a collection. While maps contain collection-view operations, which enable them
    to be manipulated as collections, from a technical point of view maps are not
    collections.


    As it was already mentioned, Java collection is a group of objects, that are known
    as its elements. Note, that elements in collections have to be unique (for example,
    sets), while other types permit duplicates (for example, array-based lists). The
    interface java.util.Collection is not implemented directly, rather Java has implementations
    of its sub interfaces. This interface is typically used to pass collections around
    and manipulate them degree of generality.


    # Insert elements into a collection


    Generally, there are two ways to insert new elements to collection:


    - Add a single element

    - Add all elements from another collection.


    Note


    # (Listing 1-1)


    ```java

    @Test

    void insertTest() {

    // get mock posts

    List<Post> posts = getPosts();

    // Add single element

    Post post = new Post(6, "Phasellus scelerisque", "Phasellus scelerisque eros id
    lacus auctor");

    posts.add(post);

    assertThat(posts).contains(post).hasSize(6);

    // add multiple elements

    List<Post> newPosts = new ArrayList<>();

    newPosts.addAll(posts);

    assertThat(newPosts).containsAll(posts);

    }

    ```


    Note, in the code snippet, I use an array list and it implements both add() and
    addAll() methods. Array lists have two overloaded versions of add() method, although
    we will concentrate here on the Collection''s one.


    To sum up, java.util.Collection permits us to insert elements in these ways:


    * boolean add(Element e) adds a new element E and ensures collection contains
    the specified element. It returns either true or false if this collection changed
    as a result of the call.

    * boolean addAll(Collection c) inserts all elements from collection C to the collection.
    Note, that this method also returns boolean value, which stands true if this collection
    changed as a result of the call.


    Several implementations impose restrictions on elements that they may contain,
    and as the result prohibit certain insertions. For example, if collection does
    not allow duplicates, you can''t add an element that already exists. Same for
    null values.

