    \ of reduction as the reduce() terminal operation. This method takes two arguments:\
    \ an identity value and a binary operator, that specifies combining function.\
    \ Identity is an initial value (for example 0 or empty string) or a default value,\
    \ in case of an empty stream. The binary operator takes two parameters: a partial\
    \ result (for instance, subtotal of total) and a next element of a stream.\n\n\
    Let see how to use the reduce() function on two examples: on a list of numbers\
