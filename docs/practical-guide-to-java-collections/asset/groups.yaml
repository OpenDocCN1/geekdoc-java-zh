    # Consume an element


    Since Java 8 iterators permit also to specify a consumer function, which can be
    performed on each element. This is a shortcut of what we can do while using a
    block. Let consider the first example implemented with the forRemaining() method.
    Take a look on the code snippet below:


    (Listing 8-4)


    ```

    List<Integer> numbers = List.of(1, 2, 3, 4, 5, 6);

    Iterator<Integer> iterator = numbers.iterator();

    iterator.forEachRemaining(number -> System.out.printf("This is a consumer. Value:
    %d \n", number*2));

    ```


    This program listing produces the following result:


    ![](img/a398e64f5a6d595324f5e906ad60a773_70_0.png)


    It is possible to achieve a similar result with IteratorUtils. This utility class
    has static methods:


    +   - forEach() = applies the function to each element of the provided iterator.

    - forEachButLast() = executes the defined function on each provided element but
    the last element in the iterator'
  - '[PAGE 71]


    Both methods accept arguments: an iterator instance and a closure function. The
    closure is a block of code which is executed from inside some block, function
    or iteration. Technically, it is a same thing as a consumer functional interface.
    The example of using this helper method is below:


    (Listing 8-5)


    ```

    List<Integer> numbers = List.of(1, 2, 3, 4, 5, 6);

    Iterator<Integer> iterator = numbers.iterator();

    IteratorUtils.forEach(iterator, number) -> System.out.printf("This is a closure.\nValue:
    %d \n", number*2));

    ```


    The output of this snippet is:


    | Output - Test (IteratorTest) |

    | This is a closure. Value: 2 |

    | This is a closure. Value: 4 |

    | This is a closure. Value: 6 |

    | This is a closure. Value: 8 |

    | This is a closure. Value: 10 |

    | This is a closure. Value: 12 |


    # Remove elements


    Finally, we need to observe how to use an iterator to delete elements. The `java.util.Iterator`
    interface contains the `remove()` method. It deletes from the underlying collection
    the last element returned by the iterator. This method can be called only once
    per call of the `next()` function. Note, that this operation is optional.


    (Listing 8-6)


    ```

    List<Integer> numbers = new ArrayList<>();

    numbers.add(1);

    numbers.add(2);

    numbers.add(3);

    numbers.add(4);

    numbers.add(5);

    ```'
