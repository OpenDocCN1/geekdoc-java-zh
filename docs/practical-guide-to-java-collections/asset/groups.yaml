  - "[PAGE 68]\n\n# Chapter 8. Iterators\n\nThe iterator pattern is one of approaches\
    \ to access elements of a collection, alongside with streams. From a technical\
    \ point of view, the iterator traverses elements in a sequential and predictable\
    \ order. In Java, the behavior of iterators is defined in the java.util.Iterator\
    \ contract, which is a member of Java Collections Framework.\n\nIterators are\
    \ similar to enumerators, but there are differences between these concepts too.\
    \ The enumerator provides direct and iterative access to each element of a data\
    \ structure exactly once. From the other side, iterators do the same task, but\
    \ the traversal order is predictable. With this abstraction caller can work with\
    \ collection elements, without a direct access to them. Also, iterators allow\
    \ to delete values from a collection during the iteration.\n\n# Access elements\
    \ of a collection\n\nAs it was mentioned before, the order of accessing elements\
    \ is predictable, which means that the iterator traverses elements sequentially.\
    \ Therefore, the general Java contract does not allow to access the particular\
    \ element (however, that is possible using Commons Collections, even this violates\
    \ the idea). In order to access the next element, use the next() method. It returns\
    \ an element or throws NoSuchElementException, when the iterator does not contain\
    \ more elements.\n\nIn order to prevent this unchecked exception, you should call\
    \ the hasNext() method prior to accessing an element.\n\n(Listing 8-1)\n\n```\n\
    List<Integer> numbers = List.of(1, 2, 3, 4, 5, 6);\nIterator<Integer> iterator\
    \ = numbers.iterator();\nwhile (iterator.hasNext()) {\n  int x = iterator.next()\
    \ * 2;\n  System.out.println(x);\n}\n```"
