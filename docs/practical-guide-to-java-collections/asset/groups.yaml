    # Initialize a stream


    From a technical point of view, stream is a programming abstraction, and it is
    not the same thing as collection, although it can be created from collections.
    These concepts are often mixed by developers, that start with functional programming
    in Java, and we need to distinguish them. In this section we observe different
    approaches, that are used to initialize streams.


    # From collections


    As this book is devoted to Java Collections Framework, it may seem logically to
    start with collections. I mentioned already, that stream is not a collection,
    but it uses elements from a collection as its data source. In the previous chapter
    we noted a built-in method stream(), that is brought by the root interface and
    which creates a sequential stream from the collection''s entities.


    (Listing 2-3)


    ```

    List<String> names = Arrays.asList("Alejandra", "Beatriz", "Carmen", "Dolores",
    "Juanita")

    Stream<String> namesStream = names.stream();

    assertThat(namesStream).isInstanceOf(Stream.class);

    ```


    # From generated data


    If you don''t have a collection with defined data, you can create a stream with
    generated records. This may be useful for experimenting with streams methods.
    In such case, you need to define a supplier'
- md: '

    function, that will be used for generation of a random sequence. The static factory
    method generate() initializes an infinite sequential unordered stream.


    (Listing 2-4)


    ```

    IntStream rangeStream = IntStream.range(1, 10);

    assertThat(rangeStream.toArray()).hasSize(9).contains(9).doesNotContain(10);

    ```


    Another method to generate a stream is rangeClosed(). The difference between aforesaid
    methods is if the sequence contain an upper limit number or not. On the other
    side, the rangeClosed() function returns a range that includes both limits, while
    range() excludes a second value from results.


    ## From nullable


    This method was initially introduced in JDK 9. It creates a new stream from a
    single element (that is nullable: a value can be potentially null), which either
    contains that element or is empty (in the case of null value).


    (Listing 2-5)


    ```

    Record record = null;

    Stream<Record> nullableStream = Stream.ofNullable(record);

    assertThat(record).isNull();

    assertThat(record).assertInstanceOf(Stream.class);

    ```


    ## From one or more elements


    The static factory method of of() creates a stream from one or more elements (in
    the later situation, it uses varargs). There are two overloaded versions:


    - of(T element)

    - of(T... elements)


    In the first version, of() method returns a sequential stream, which contains
    a single element T. In the second variant, it creates a sequential ordered stream,
    which has elements, provided in a form of varargs.


    (Listing 2-6)


    ```

    Stream<Integer> pointsStream = Stream.of(2, 5, 12, 6, 19);

    assertThat(pointsStream).isInstanceOf(Stream.class);

    ```


    ## Iterating


    The static method iterate() was introduced in Java 9. It takes two arguments:
    an initial value (also called seed) and a unary operator function, which is used
    to produce a sequence. The method starts with the seed value and applies the given
    function to get the next element.


    (Listing 2-7)


    ```

    Stream<Integer> iterateStream = Stream.iterate(0, i -> i + 2);

    assertThat(iterateStream).isInstanceOf(Stream.class);

    ```


    ## Create an empty stream


    We have already mentioned ofNullable() method, which could possibly return an
    empty stream in case of null value. Still, is there another approach to get an
    explicitly empty stream. The static method empty() returns as it implied from
    its name an empty stream.


    (Listing 2-8)


    ```

    Stream<Integer> emptyStream = Stream.empty();

    assertThat(emptyStream.toArray()).isEmpty();

    ```


    ## Using builder


    Until now we observed static factory methods, that are used to initialize a new
    stream instance. Some programmers tend to rely on a builder pattern to create
    objects. Stream class has its builder, which can be used as an alternative to
    factory methods. The static method Stream.builder() allows the creation of streams
    by generating elements individually and adding them to builder without temporary
    collections or buffers.


    (Listing 2-9)


    ```

    // 1. create builder

    Stream.Builder<String> builder = Stream.builder();


    // 2. create stream

    Stream<String> nameStreamBuilder =

    builder.add("Alejandra").add("Beatriz").add("Carmen").add("Dolores").add("Juanita").build();


    // contains same elements as the first example

    assertThat(namesStream.collect(Collectors.toList())).containsElementsOf(nameStreamBuilder.collect(Collectors.toList()));

    ```


    In this code example, we start with a creation of a builder''s instance. Next,
    with add() method, we populate values. Finally, we transform a builder into a
    stream with build() method.


    ## A concept of a pipeline


    We took a broad introduction to the stream creation and observed ways to do it.
    Now, as we obtained a stream instance, we can assemble a pipeline in order to
    do something useful with the stream. From technical point of view, a pipeline
    consists of a source (collection, element, generated sequence etc.), followed
    by zero or more intermediate operations and one terminal operation.


    ![](img/a398e64f5a6d595324f5e906ad60a773_21_0.png)


    ## Intermediate operations


    Intermediate operations return new stream and are lazy. Their laziness means that
    the actual computation on the source data is performed only after the terminal
    operation is invoked, and source elements are consumed only as needed. We can
    chain multiple intermediate operations, as each returns a new stream instance.


    ![](img/a398e6ff5a6d595324f5e906ad60a773_21_1.png)


    ## Filter


    In the beginning of this chapter, we did an example with names. There, we filtered
    a list of names in order to find matching names. This was done using filter().
    Basically, it returns a new stream consisting of the elements, that match the
    given predicate (function, that specifies a logical condition).


    (Listing 2-10)


    ```

    @Test

    void filterTest(){

    Stream<String> stream = names.stream();

    long result = stream.filter(n -> n.startsWith("A")).count();

    assertThat(result).isEqualTo(4);

    }

    ```


    ## Map


    The streams API has a number of mapping operations. It is a good idea to group
    them together under one section. Let start with a general map() function. It returns
    a new stream, which consists of results of an application mapper function to the
    elements of the stream.


    (Listing 2-11)


    ```

    @Test

    void mapTest(){

    Stream<String> stream = names.stream();

    int result = stream.mapToInt(n -> n.length()).sum();

    assertThat(result).isEqualTo(43);

    }

    ```


    There are specific mapping methods, that map results of previous computation to
    numeric values.


    - mapToInt() produces an IntStream instance, that consists of the results of applying
    the given mapper function

    - mapToDouble() produces a DoubleStream instance, that consists of the results
    of applying the given mapper function

    - mapToLong() produces a LongStream instance, that consists of the results of
    applying the given mapper function


    ## Distinct


    Another commonly used intermediate operation is called distinct(). It produces
    a stream of unique elements from a source. Technically, the distinct() method
    relies on equals() implementation of the type class in order to avoid duplicates.
    For ordered streams, the selection of distinct elements is stable, for unordered
    ones, Java provides no stability guarantee.


    (Listing 2-12)


    ```

    @Test

    void distinctTest() {

    List<Integer> numbers = Arrays.asList(1,2,3,4,5);

    Stream<Integer> stream = numbers.stream();

    long result = stream.distinct().count();

    assertThat(result).isEqualTo(5);

    }

    ```


    ## Sorting


    In many situations, we need to sort elements of a collection in some way, for
    example in natural order. The method `sorted()` returns a stream, which elements
    are sorted in order.


    (Listing 2-13)


    ```

    @Test

    void sortTest() {

    List<Integer> numbers = Arrays.asList(-9, -18, 0, 25, 4);

    Stream<Integer> stream = numbers.stream();

    List<Integer> result = stream.sorted().collect(Collectors.toList());

    assertThat(result).containsExactly(-18, -9, 0, 4, 25);

    }

    ```


    In the 13 I used a stream, which elements numbers. The Integer class implements
    `Comparable`, therefore provides logic to compare values. If you use `sorted()`
    with own classes, you have to implement `Comparable` and write it. Otherwise,
    `ClassCastException` will be thrown, when a terminal operation will be executed.


    ## While


    These two methods were also added at Java 9 release: `dropWhile()` and `takeWhile()`.
    Each of them accepts a predicate function, which specifies the condition.


    - dropWhile produces a stream consisting of the remaining elements of this stream
    after dropping the longest prefix of elements that match the given predicate.

    - takeWhile() produces a stream consisting of the longest prefix of elements taken
    from this stream that match the given predicate.


    Note, both methods work with streams, that have elements in order. This means,
    that you have to sort elements, for example using sorted() method, which was described
    in the previous section. In the listing 2-14 I use set.


    (Listing 2-14)


    ```

    @Test

    void whileTest(){

    Set<Integer> numbers = Set.of(1,2,3,4,5,6,7,8);

    Stream<Integer> stream = numbers.stream();

    Set<Integer> result = stream.takeWhile(x-> x < 5).collect(Collectors.toSet());

    assertThat(result).hasSize(4);

    }

    ```


    ## Limit


    The method limit() produces a stream consisting of the elements, limited to be
    no longer than specified length. This method accepts one argument, which represents
    a desired length.


    (Listing 2-15)


    ```

    @Test

    void limitTest(){

    Stream<Integer> stream = getNumbers().stream();

    Set<Integer> result = stream.sorted().limit(5).collect(Collectors.toSet());

    System.out.println(result);

    assertThat(result).contains(-75, -18, -9, -5, 0);

    }

    ```

