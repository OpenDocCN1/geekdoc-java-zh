    # Chapter 7. Fluent assertions with AssertJ library


    This chapter presents most common types of assertions, that can be used in testing
    Java collections. In computer programming, an assertion is an assumption, that
    developers make about the state of a program. We already utilized AssertJ library
    in most code snippets in previous chapters. Here we will sum up common assertion
    operations. For program listings in this chapter I use an array list implementation.


    # Assert that a collection contains an element


    The basic task is to check if the collection contains or does not contain the
    specific element. AssertJ validates this using contains(), which has two overloaded
    versions:


    +   - contains(E e, int index) checks that the element presents on the specific
    position

    - contains(E... elements) accepts varargs, c.g. one or more elements and checks
    for their presence in any order


    (Listing 7-1)


    ```

    @Test

    void containsElementTest()

    List<Integer> numbers = Lists.newArrayList(1, 52, 12, 39, 45, 98, 100, 565, 6,
    13);

    assertThat(numbers).contains(12);

    assertThat(numbers).doesNotContain(50);

    }

    ```


    Besides the contains() method, AssertJ provides also the doesNotContain() method,
    which asserts for an absence of entity (s).


    # Assert that a collection contains elements in any order


    In order to verify, that collection does contain a group of elements, it is possible
    to use two approaches:


    +   - contains(E.. elements) method and pass elements as var args'
