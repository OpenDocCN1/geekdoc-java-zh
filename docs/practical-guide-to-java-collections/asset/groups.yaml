    \ {\n    Stream<String> stream = names.stream();\n    Optional<String> result\
    \ = stream.filter(n -> n.startsWith(\"A\")).findFirst();\n    Assertions.assertThat(result).isPresent();\n\
    \    Assertions.assertThat(result.get()).isEqualTo(\"Anna\");\n}\n```\n\n# Match\n\
    \n另一组流水线操作对应于匹配操作。与中间操作不同，这些操作会返回布尔值。这些操作用于检查流中的元素是否满足某些条件。常见的操作有：\n\n- allMatch()\n\
    - anyMatch()\n- noneMatch()\n\n`anyMatch()` 检查流中是否至少有一个元素满足谓词，如果是则返回 `true`。考虑一个数字列表：（列表\
    \ 2-20）\n\n```java\n@Test\nvoid anyMatchTest() {\n    List<Integer> numbers =\
    \ Arrays.asList(10, 20, 30, 40, 50);\n    boolean hasEven = numbers.stream().anyMatch(n\
    \ -> n % 2 == 0);\n    Assertions.assertThat(hasEven).isTrue();\n}\n```\n\n另一种情况是验证所有元素都满足条件，这可以通过\
    \ `allMatch()` 操作完成。考虑以下数字列表：（列表 2-21）\n\n```java\n@Test\nvoid allMatchTest()\
    \ {\n    List<Integer> numbers = Arrays.asList(10, 53, 23, 95, 30);\n    boolean\
    \ allEven = numbers.stream().allMatch(n -> n % 2 == 0);\n    Assertions.assertThat(allEven).isFalse();\n\
    }\n```\n\n最后，我们可以检查流中没有元素匹配谓词。这是通过 `noneMatch()` 方法实现的。考虑以下示例：我们需要断言列表中的整数均为负数（小于0）：（列表\
    \ 2-22）\n\n```java\n@Test\nvoid noneMatchTest() {\n    List<Integer> numbers =\
    \ Arrays.asList(-4, -54, -25, -8, -1);\n    boolean hasPositives = numbers.stream().noneMatch(n\
    \ -> n > 0);\n    Assertions.assertThat(hasPositives).isTrue();\n}\n```\n\n# Reduction\n\
    \n从技术角度来看，归约是一种从元素序列产生单个结果的操作。求和是一个很好的例子：我们累加每个元素并返回最终结果。换句话说，归约是对序列的所有成员反复应用某些函数（例如加法）。\n\
    \nJava 通过 `reduce()` 终端操作提供了归约实现。该方法接受两个参数：恒等值（identity）和一个二元运算符，后者指定了合并函数。恒等值是初始值（例如\
    \ 0 或空字符串），或者在空流情况默认值。二元运算符接受两个参数：部分结果（例如总和的小计）和流的下一个元素。\n\n让我们看看如何在两个示例上使用 `reduce()`\
    \ 函数：一个数字列表（我们期望一个和）和一个字符串列表（我们期望一个单词）：（列表 2-23）\n\n```java\n@Test\nvoid reduceTest()\
    \ {\n    // numbers\n    List<Integer> numbers = Arrays.asList(10, 20, 30, 40,\
    \ 50);\n    int total = numbers.stream().reduce(0, (subtotal, number) -> subtotal\
    \ + number);\n    Assertions.assertThat(total).isEqualTo(150);\n}\n```\n\n总结来说，归约操作的使用有助于从序列中创建一个单个结果。\n\
    \n"
