    assertThat(result).contains(numbers);

    ```


    In the Java 10 release was introduced another approach to copy elements. The static
    Set.copyOf() method returns an immutable set, which contains the elements of the
    given collection (e.g. this method can be used with any collection type). The
    given collection must not be null, and it must not contain null elements. If the
    given collection contains duplicate elements, an arbitrary element of the duplicates
    is preserved. If the given collection is subsequently modified, the returned Set
    will not reflect such modifications.


    (Listing 4-18)


    ```

    HashSet<Integer> numbers = SetUtils.hashSet(1, 2, 3, 4, 5);

    Set<Integer> result = Set.copyOf(numbers);

    assertThat(result).contains(numbers);

    ```


    Like the List.copyOf() method, this Set.copyOf() does not permit to have an immutable
    collection as a source.


    ## Chapter 5. Queues


    In computer programming, the queue stands for a linear collection of elements
    that are inserted and removed based on FIFO principle. FIFO is an abbreviation,
    which means First-in-First-out. In other words, an element, which was inserted
    first, will be removed first, unlike stacks, where the first element is removed
    last. To distinguish these two principles let have an example with a ferry. The
    first situation is a car embarkation. This is an example of a LIFO order: the
    first car, that comes into a ferry, will exit last. Another example is a queue
    in a ticket office to buy tickets for this ferry. Here governs FIFO principle:
    the person, which came first to the ticket gate, will buy and exit a queue.


    In a basic structure, queues support only two operations: enqueue and dequeue:


    - Enqueue means an insertion of an element into the back of the queue

    - Dequeue means a removing of an element from the front of the queue


    The first front element is also called head and elements that are positioned after
    are called tail. In Java, queues are defined in the java.util.Queue interface.
    There are two main implementations: ArrayDeque and PriorityQueue:


    ![](img/a398e64f5a6d595324f5e906ad60a773_53_0.png)


    The important difference between these implementations is an order of elements.
    The ArrayDeque holds elements on FIFO basis, so head element is the first inserted.
    The PriorityQueue in its regard holds elements based on their natural ordering
    (if they implement Comparable interface) or based on a specified comparator function.
    Therefore, head element in this case will be the least element.


    ## Queue declaration


    In order to use a queue you should declare it. Queues can be defined using public
    constructors that help specify capacity. No args constructors create queues with
    an initial capacity sufficient to hold 16 elements:


    (Listing 5-1)


    ```

    // initial capacity = 16

    Queue<Person> people = new ArrayDeque<>()();

    // for the ferry that can transport 50 cars

    Queue<Car> cars = new ArrayDeque<>(50);

    ```


    ## Handling enqueue operations


    There are two main ways to handle enqueue operation. As Java queues are sub classes
    of the root interface, they inherit common collection methods to insert and remove
    elements. When it comes to queues, they also provide own methods offer() and poll(),
    where the first one stands for adding elements. Both of these insertion methods
    insert an element into the tail.


    (Listing 5-2)


    ```

    @Test

    void enqueueTest(){

    Queue<Person> people = new ArrayDeque<>();


    // people are inserted in the tail, so head is same


    people.offer(new Person("Alejandra", "Morales"));

    people.offer(new Person("Beatriz", "Sanchez"));

    people.offer(new Person("Carmen", "Hidalgo"));


    // head of queue is Alejandra Morales

    assertThat(people.peek()).isEqualToTo(new Person("Alejandra", "Morales"));

    }

    ```


    What is a difference and when to use one? Java recommends to stick with native
    queue methods, which means for addition use the offer(i) method. The difference
    comes when it is not possible to insert a new element:


    - offer() returns false boolean value

    - add() throws IllegalStateException


    Special note must be made in case of the ArrayDeque. This class also inherits
    the Deque interface. This interface defines a data structure that permits to add
    and remove elements on both ends in comparing with the classical queue. This class
    adds some methods that are specific only for this class:


    - offerFirst() and addFirst() insert an element to the head. A difference between
    them is the same as between offer(i) and add(i) methods

    - offerLast() and addLast() insert an element to the tail

    - push() is equivalent to the addFirst() method. In case of an insertion of a
    null element, this method will throw a NullPointerException


    ## Handling dequeue operations


    Removing an element in queue is called dequeue. As with case of insertion, Java
    queues have two methods to handle a deletion of an element: one is inherited from
    the root contract’s remove() method and another is the native for queues method
    poll(). Both remove a head element (based on FIFO principle).


    (Listing 5-3)


    ```

    @Test

    void dequeueTest(){

    Queue<Car> cars = new ArrayDeque<>();

    Car skoda = new Car(4567, "Skoda");

    cars.offer(skoda);

    assertThat(cars.peek()).isEqualTo(skoda);

    }

    ```


    cars.offer(new Car(1234, "Mazda"));

    cars.offer(new Car(2345, "Kia Cerato"));


    ```

    // previous head -> mazda

    ```


    ```java

    cars.poll();

    assertThat(cars.getLicenseNumber()).isEqualTo(1234);

    ```


    The difference between both methods is same to use enqueue methods. We also need
    to mention here methods, which are inherited by ArrayDeque:


    - pollFirst() and removeFirst() handle a deletion of the head

    - pollLast() and removeLast() handle deletion of last element


    ## Return the head element


    Queues don''t permit you to have an access to an arbitrary element. You can get
    only the head element (with an exception array deque, which allow to retrieve
    both the first and last elements).


    (Listing 5-4)


    ```

    @Test

    void getHeadTest(){

    Queue<Person> people = new ArrayDeque<>();

    people.offer(new Person("Alejandra", "Morales"));

    people.offer(new Person("Beatriz", "Sanchez"));

    people.offer(new Person("Carmen", "Hidalgo"));

    ```


    ```

    Person element = people.element();

    Person peek = people.peek();

    assertThat(element).isEqualTo(peek);

    }

    ```


    To return the head (first) element you can use either the element() method either
    the peek() method. The difference between them is shown, when you try to use them
    on an empty queue:


    - The element() method will throw a NoSuchElementException on empty queue

    - The peek() method will return a null value if the queue is empty


    As it was mentioned already, an array deque permits to get both the first and
    last elements. Therefore it provides two custom methods to get the head element:
    getFirst() and peekFirst().


    ## Return tail elements


    Tail elements of the deque are all elements after the head element. From a technical
    point of view, this is a sequence, rather than one single element. However, Java
    does not provide a method to get a tail of queue, but you can write your own if
    you need like this:


    (Listing 5-5)


    ```

    @Test

    void getTailTest(){

    Queue<Person> people = new ArrayDeque<>();

    people.offer(new Person("Alejandra", "Morales"));

    people.offer(new Person("Beatriz", "Sanchez"));

    people.offer(new Person("Carmen", "Hidalgo"));

    ```


    ```

    Queue<Person> tail = new ArrayDeque<>(people);

    tail.poll();

    ```


    ```

    assertThat(tail).hasSize(2);

    }

    ```


