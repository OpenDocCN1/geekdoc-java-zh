    }\n```\n\n在列表 2-18 的示例代码中，我使用了一个内置收集器，它将元素收集到列表中。Java 还提供了其他收集器方法：\n\n- Collectors.toMap()\n\
    - Collectors.toSet()\n\n# Find\n\n在本节下，列出了查找元素并返回 `Optional` 容器的操作，因为请求的元素可能不存在（例如空值）：\n\
    \n- findAny()\n- findFirst()\n\n这两个方法都没有参数，所以你可能会问一个合理的问题：它们实际上是如何找到元素的？答案是显而易见的。条件在\
