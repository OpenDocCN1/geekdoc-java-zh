    \ 必须增加容量。这是通过一种称为动态内存分配的机制实现的，它根据需要为未来的元素预留内存单元格。\n\nJava 中的所有列表都实现了 `java.util.List`\
    \ 接口，并具有核心集合方法。基于数组的列表实现定义在 `java.util.ArrayList` 类中。列表数组的容量会自动增长，并且始终至少大于其大小（元素数量）。\n\
    \n![](img/a398e64f5a6d595324f5e906ad60a773_33_0.png)\n\n这里需要注意的是，虽然 Java 集合是可变的（mutable），但有两种初始化新数组列表的方法：第一种方法产生可变集合，另一种方法产生不可变（immutable）列表：\n\
    \n- 使用构造函数，例如 `List<Integer> numbers = new ArrayList<>();`，此版本创建可变列表\n- 使用 `Arrays.asList()`\
    \ 静态方法，它会创建不可变列表\n\n另一个选项是使用 `List.of()` 静态方法，它接受变长参数（var args）作为参数。该操作自 Java\
    \ 10 起可用。它也会产生一个不可变列表。\n\n## 添加新元素\n\n我们将观察的第一个操作是插入新元素。基于数组的列表从根接口继承了两个插入方法：`add(E)`\
    \ 和 `addAll(Collection c)`，还提供了两个列表特有的方法用于向指定位置添加元素。观察所有这些方法：\n\n- `add(E e)`\
    \ 是基本方法，将新元素插入到列表末尾\n- `addAll(Collection c)` 是来自根接口 `java.util.Collection` 接口的另一个方法，它将集合\
    \ `C` 的所有元素追加到列表末尾\n- `add(int position, E e)` 此方法将新元素 `E` 插入到指定的位置。它会将该位置上的当前元素以及任何后续元素向右移动。如果位置值大于列表的大小，此方法可能会抛出\
    \ `IndexOutOfBoundsException`\n- `addAll(int position, Collection c)` 该操作与上一个相似，但它从位置\
    \ `position` 开始添加集合 `c` 中的元素。在与 `add()` 函数相同的条件下可能会抛出 `IndexOutOfBoundsException`\n\
    \n(Listing 3-1)\n\n```java\n@Test\nvoid addElementsToTest() {\n  // 方案 1. 创建新列表并使用\
