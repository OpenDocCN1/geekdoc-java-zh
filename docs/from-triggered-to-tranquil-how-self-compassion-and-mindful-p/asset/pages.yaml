  md: 'Parents may find that certain behaviors in their kid remind them of things
    they don''t like about themselves, their spouse, or other family members. Parents
    might be reminded of their own parents and of dysfunctional behaviors they experienced
    growing up. Many adults, for example, had parents who did not have good self-care
    habits or who were immature or addicted. When parents see these things showing
    up in their children, this can be triggering.


    It can be especially difficult for a parent to watch a child growing up with the
    same self-defeating habits or weaknesses that they had as a younger or that they
    still have. Here is a good illustration from a family I used to know:


    One day, Steve watched the neighborhood kids getting ready for a pickup softball
    game. His ten-year-old son, Tommy, was among waiting to be picked for a team.
    As sides were being chosen by the two captains, it was obvious to Steve that neither
    side was eager to have frail, unathletic Tommy on their team. As Tommy tried to
    hold back his tears, Steve gave his son an encouragement. But deep inside, Steve''s
    own shame was triggered, since he felt a core fear of not being enough. As a kid,
    Steve felt weak, unathletic, and lacking in confidence, and this feeling continued
    into adulthood. Now, as a parent, he was doing his best to make sure Tommy did
    not follow to suffer through adolescence as he had suffered. Steve watched the
    game unfold, he did not want to feel shame about his son, but he couldn''t help
    it. Whenever he saw (as Steve himself sometimes did), Steve would get triggered.
    Whenever he saw Tommy making careless mistakes that showed he was not really paying
    attention, Steve would get triggered — even though, once again, he knew this was
    one of his weaknesses.


    If you get triggered by something in your kid reminds you of one of your own deficits,
    this can be the starting point for some useful self-inquiry and healing. It might
    even provide an opening toward deeper communication with your child, depending
    on your child''s intellectual and emotional maturity.


    If your child has a fairly good emotional vocabulary and is over the age of ten,
    I recommend that you have an open discussion with the child about your triggers
    and insecurities or about your strengths and weaknesses.'
