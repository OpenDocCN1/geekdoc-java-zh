    what hurt her most was the name-calling, the racial slurs. Through her inner work
    with me, she was able to use this as a doorway to deeper self-empathy and self-support.
    When she allowed herself to weep and feel the impact of these old hurts, with
    her inner witness, she connected with a new resource within herself. Instead of
    judging her reactive feelings, she learned to listen to these feelings, to really
    attend to them, and to embrace them with the sort of compassion she would offer
    a much-loved child.


    Before learning to do this, she would get totally overwhelmed, causing her to
    shut down and withdraw. She was now willing to feel the pain rather than hide
    from it. She gradually found herself taking on this issue as a cause among her
    community of friends and neighbors. Whenever someone used demeaning or snarling
    language toward people they disagreed with, she would speak up and share how this
    felt to her. She would say things like: “You know, I have been on the receiving
    end of a lot of insulting labels in my childhood, being Mexican in a mostly Anglo
    community, so it pains me when you talk this way. I’d rather hear something specific
    about your experience — something they actually did or said and how affected you.
    I really want to know what you think and feel. I just have trouble when I hear
    labels like ‘crazy’ or ‘ignorant,’ and I don’t know what they were referring to
    … or why this bothers you.”


    I think Rita’s story illustrates how helpful it can be to get to the bottom of
    our trigger reaction, so we can use what’s happening in the world around us as
    a doorway to deeper self-knowledge, self-compassion, and community action. Perhaps
    even more important is how, after she learned to feel her'
