    feel ________.” At the very end, encourage a few people to share their appreciations
    with others for something specific they have just witnessed.


    # Repair and Closure in Other Conflict Situations


    As the leader, if you and a group member get into a conflict, you can use this
    same process for repair and closure: you both fill out a brief repair script and
    then read your scripts to each other with the group witnessing.'
