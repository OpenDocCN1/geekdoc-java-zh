  md: '# Chapter Six


    # Repairing and Clearing the Air


    # Restoring Connection with Others


    As you come to know each other''s sensitivities, this helps you get over the tendency
    to take the other person''s reactive behavior personally.


    Repair is the final step in the Five Steps of Trigger Work program. This is where
    we come back to the other person (or persons, if the situation involves a group)
    and ask for a do-over or share our genuine sorrow for how our behavior impacted
    them. This is also where we would reveal the vulnerable fears and fear-stories
    that were at the root of our trigger reaction and get some reassurance that our
    fear-story is not true.


    Note that the repair step is not necessary if we are triggered on our own or while
    alone, such as when something we read or see in a film stimulates old wounds.
    Our work is complete once we have done the Compassionate Self-Inquiry practice
    in step four. However, most attachment triggers occur while interacting with others,
    and so the process is not over until step five is complete.'
