  md: 'Repairing is used after an interaction where one or both people went into a
    fight, flight, or freeze state and acted from that state in a way that disrupted
    feelings of safety, connection, or trust. It should also be used when one person''s
    reactivity is not obvious to the other person — where one person got triggered,
    did not reveal this, but later wants to clean. Sometimes a unilateral repair is
    necessary — which is actually somewhat of a confession, as in: "You didn''t know
