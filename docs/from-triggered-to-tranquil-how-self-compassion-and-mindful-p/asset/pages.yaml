  md: 'There is often more diversity of feelings and opinions than is apparent until
    you ask.


    **Categories Game:** In a personal growth group or some training contexts, you
    can diagnose the probable level of emotional pain members are carrying by leading
    them in the categories game. This activity also demonstrates to everyone how their
    feelings and life experiences compare with others in the group.


    The game is simple. Have everyone stand in a circle, then name various categories
    of experience — like “anyone who has ever felt social anxiety in a group of more
    than four people” or “anyone who was raised in a single-parent home.” Anyone who
    relates to or belongs in the category steps into the center of the circle. (In
    a virtual meeting, people raise their hands or use the hand-raising function.)
    Once in the center, pause for everyone to notice who includes themselves and not
    to notice how they feel. Then people in the center return to the larger circle,
    and the leader announces another category. In this game, choose topics or issues
    that you think may reveal everyone’s vulnerability to getting triggered. For example,
    you can name categories like “anyone who fears being ignored,” “anyone who fears
    being misunderstood.” At some point, you can invite members to add their own categories,
    but they can only name ones that themselves belong to. This exercise can bring
    people to a deep level of sharing very fast depending on the categories. This
    activity also gives you a picture of how much vulnerability members are ready
    to reveal.


    # The Leader’s Skill, Emotional Maturity, and Experience


    A leader is always learning and getting better at this craft. Experience counts
    for a lot. But no matter how experienced you are, things may happen that require
    a level of skill above your pay grade. When triggering incidents go unnoticed
    and unprocessed, this can create weird group dynamics — hidden agendas, covert
    competitiveness or undercutting, outlandish projections, scapegoating, people
    withdrawing or staying silent, and so on. If a group goes through a cascade of
    unacknowledged triggering events, it can foster regression and chaos.'
