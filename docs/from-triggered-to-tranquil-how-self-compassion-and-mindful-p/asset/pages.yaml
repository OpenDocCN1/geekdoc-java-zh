    would sense a tightening and clenching sensation in my chest. Through counseling,
    I learned to be with this sensation, to feel it, to be curious and see where this
    led. It led me to uncover a part of myself that felt so alone as a kid, the ten-year-old
    kid my parents didn''t have time for. They had show dogs, and the dogs got all
    their attention. By, the time I got home from school, my mom would be drunk. I
    have recently learned to love and care for this lonely, hurting part of me. I
