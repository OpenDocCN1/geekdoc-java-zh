  md: 'If blaming, shaming, or guilty thoughts arise, continue to witness these thoughts
    from the position of a compassionate observer. Come back to noticing feelings
    and body sensations. If tears come, allow these. Reassure yourself that your feelings
    are understandable, that it''s okay to feel this way.


    Allow these feelings to be witnessed and held for a while, as you continue to
    breathe fully and deeply. After a while, you will get a sense of relaxation and
    relief that you are not alone, and you can be there for yourself. Your external
    circumstances may remain unchanged, but your relationship to them will feel different.
    It’s as you have gotten a new perspective on your situation. You have taken one
    more step toward coming to terms with your present situation. Doing this self-compassion
    exercise repeatedly offers another step toward healing your fear or shame about
    being emotionally upset, in distress, or in pain.


    Self-compassion is the key to becoming a more genuinely loving parent. As you
    practice being generous and empathetic with yourself, your expectations of yourself,
    of your kid, and of life become more realistic — which means you no longer suffer
    when things are not the way you think they should be or could be. This is how
    you quell the inner voices that tell you something’s wrong, either with you or
    with your kid. This is how path of parenting becomes one version of the hero’s
    journey, the journey of awakening.


    # I’m Triggered by My Kid’s Deficits


    As parents watch their children grow up, they notice the ways their kids excel
    and the ways they don’t, what they prefer and what they avoid, their good habits
    and their less helpful traits. A child might be sedentary, preferring screen time
    to playing outdoors. They might put on weight. They may be highly sensitive and
    have their feelings easily hurt. They may have trouble cooperating with others
    and always need to get their way. Maybe a child has tantrums, or develops tics
    or stutters, or wets the bed, and parents feel these things signal underlying
    psychological issues. A child might be painfully shy, or afraid to take risks,
    or have trouble developing close friendships, and it’s not clear why.'
