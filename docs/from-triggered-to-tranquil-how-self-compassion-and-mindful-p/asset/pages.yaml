    fear of being unlovable and worthless, a feeling of anger came up. As she explored
    this angry part, allowing this part to speak out against the abuse she suffered,
    she realized that this anger represented her protector. This long-denied resource
    was the inner voice that says, “The way you are treating me is not okay, and it
