    # Deciding Whether You Are Ready to Repair


    One of the biggest problems that I see in couple relationships is how difficult
    it is for partners to tolerate their partner being unhappy with them. Many people
    find it very hard to take time to pause and self-soothe before trying to talk
    things out. So they keep talking (or reacting) when they ought to be pausing.
    One of my main goals in this book is to give people tools that help them tolerate
    the uncomfortable time between getting triggered and repairing. These tools will
    give you the confidence that the process of getting triggered and repairing, of
    disconnection and reconnection, follows a predictable, orderly sequence of events
    that you can learn. It takes inner work and a measure of self-discipline, but
    most people can learn these tools.


    When someone cannot stand the anxiety of any sort of separation, they often try
    to repair trigger reactivity before they are really ready. Maybe they''ll do a
    perfunctory pause, but they don''t really take the time to get themselves feeling
    calm and safe. They try to soothe their hurting or wounded self, but their minds
    keep going somewhere else. One sign of not being ready is noticing, during your
    pause, that you are having the same upsetting thoughts about the other person
    over and over. This does not help, for some people, it''s a habit that''s hard
    to break.


    Another clue that someone is trying to repair too soon when they don''t yet feel
    at least some measure of generosity or friendliness towards their partner. They
    may still be holding the other person to an unrealistically high standard for
    how that person should have behaved — failing to recognize that the other person
    was triggered, that this was not their best self, and that their actions or words
    didn''t reflect their true feelings.'
