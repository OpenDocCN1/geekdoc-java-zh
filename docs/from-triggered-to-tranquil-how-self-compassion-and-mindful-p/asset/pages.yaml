    One man found himself getting triggered when he saw TV news depicting brutality.
    He was able to process his grief about growing up with a sometimes violent father.
    As a child, he never felt safe, and much of his energy and focus had been on protecting
    himself from physical harm. Doing Compassionate Self-Inquiry, he learned to use
