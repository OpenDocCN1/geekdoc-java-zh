    through the nose.


    Self-regulation involves turning your attention inward and calming your nervous
    system, deep breathing or some other awareness practice. This step is your first
    aid for reactivity. It is one of life’s basic stress-management tools. I wish
    more grade schools would teach this, but it’s never too late to learn. The challenge,
