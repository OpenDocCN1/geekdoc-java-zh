    Failures and setbacks are part of any learning process. Since there is always
    the risk that efforts may not pay off, you should ask yourself: Are you willing
    to embark on this journey of mutual self-discovery with this person, not knowing
    if you will succeed or where it might lead? Are you willing to share your fears
    and insecurities, your weaknesses and deficiencies, your deepest desires, your
    wants, your secrets? This journey is not for everyone. You may not be sure yet
