  md: '# Resistance Is Part of the Process


    In doing these practices, you might notice a tendency to shut down before really
    feeling everything. For instance, you might find yourself analyzing why something
    happened rather than feeling what happened. This sort of resistance to uncomfortable
    feelings is a normal part of the process. It could be something you learned to
    do back in childhood to protect yourself. You learned to abort the process of
    experiencing feelings by going into your head instead. Just go as far as you can
    with this exercise, encouraging the hurting or upset part of yourself to feel
    and express your hurt, knowing that the adult you is witnessing this with acceptance
    and compassion. It is actually better to do these practices in small doses rather
    than trying to keep deeper in one sitting.


    In particular, the Compassionate Self-Inquiry exercise again and again — with
    the same or different triggering incidents. It takes many repetitions to unlearn
    conditioned habits for avoiding emotional discomfort. Life gives us the opportunity
    to revisit our core fears again and again, until we have fully felt in a conscious,
    self-loving way everything we have left to feel.


    Some people ask what to do if they have a judgmental or contemptuous attitude
    toward their triggered self. What if you don''t like the wounded part of yourself?
    What if you view this part as evidence that you are unlovable? What if you think
    you should be more together or should be over it by? If this happens for you,
    notice this, and notice what you feel about this. How do you feel about the fact
    that you get impatient with yourself? If a child was crying in fear or pain, and
    a parent told the child to grow up or get it over, what might you feel? Is your
    relationship to yourself similar to this impatient parent? Notice how you feel
    about how you treat yourself. If you feel sadness, this is probably a good start.
    This may be the beginning of a softer, more empathetic attitude toward the vulnerable
    or triggered parts of yourself.


    # Keep Practicing Being with Sensations and Emotions'
