    # The Payoff of Acceptance


    Gaining understanding regarding your own and others’ trigger reactions allows
    you to adopt a worldview that sees everything that shows up in your life as acceptable
    and deal-with-able. You may not like a particular unwanted event, but here it
    is, so the question becomes: How do I feel about it, how can I be with this feeling
    in a self-loving way, and how shall I deal with it in a self-respecting way? When
    you feel resistance to an event, including some ordinary irritant like someone’s
    voice tone, what inner fear or insecurity is at the root of this resistance? How
    current or realistic is this fear? If it is not current or realistic, your fear
    is probably some version of a trigger reaction. Once you accept it as a trigger
    reaction, now you’re empowered to do something constructive (rather than remain
    stuck in resistance, reaction, or denial).


    It is easier to accept your trigger reactions once you learn how to compassionately
    embrace any shame or resistance and move quickly from being triggered to centered
    again. The exercises in part 1 show you what you can do once you accept your trigger
    reaction to restore your inner sense of calmness, confidence, worthiness, and
    safety.'
