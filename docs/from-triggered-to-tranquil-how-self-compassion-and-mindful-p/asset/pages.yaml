- img_proc: true
  md: 'Adult groups often mirror some of the dynamics of our early family, school,
    or peer-group experiences. This is because we get conditioned, or “trained,” to
    behave in particular ways or to take on particular group roles in these settings.
    Once we’re adults in a group with other adults, we may unconsciously revert to
    the same group role we played in our childhood family, in school, or on the playground.
    Our role in our early family might have been the black sheep, the golden child,
    daddy’s girl, momma’s boy, the family scapegoat, mother’s helper, the rescuer,
    the sickly one, the rebel, or the parentified child. When humans are under stress,
    it is natural to revert to old habits.


    # Family Roles


    What was your role or function in your first groups — family, church, school,
    in the neighborhood, and so on? Did you seek the limelight to avoid it? Did you
    lead or follow? Conform or rebel? Give help or receive help? Were those early
    groups led by functional, trustworthy adults, that you could simply relax and
    be a child? Or did you try to make up for an adult’s failings — perhaps taking
    on the role of protector?


    Knowing which group roles you gravitate toward is useful. It’s like knowing your
    trigger signature. For instance, if you know you played a protector/rescuer role
    as a child, you can make it a point to notice if you are still doing in this adult
    groups, and whether this is your best, most authentic choice. I know one woman,
    for example, who has a habit of carefully watching the leader or facilitator of
    any group she’s in — to see if this leader is providing a safe container: Does
    the emphasize confidentiality enough? Is the leader clear about boundaries and
    expectations? Does the leader handle people’s tender emotions in a compassionate
    way? This sort of function can be truly helpful to the group. But for the person
    performing this role, it may indicate they are in a chronic semi-triggered state
    without realizing it. They may have learned to avoid their own vulnerable feelings
    by becoming the group protector.


    Keep this in mind as you read this chapter, and see if you recognize any early
    group experiences that may have influenced you, including your early relationship
    to authority.'
