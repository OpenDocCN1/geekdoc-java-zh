    # Why Repair?


    Most intimate partners recognize the need to make up after a fight. In other types
    of relationships, people may try to “get over it” without saying much. In this
    book, I encourage you to use these practices no matter what your relationship
    status. By developing these skills, we can reduce the amount of unfinished business
    with people in our life, and perhaps avoid having friendships, partnerships, or
    dating relationships abruptly without understanding why.


    The usual way most people try to repair does not work. Their attempts involve
    too many words, too much explanation, too much trying to be heard. Instead of
    repair, what occurs is more like a clash, except with calmer voices. After a typical
    long-wind repair, people end feeling as unsafe or unheard as before. One sign
    that a repair is not working is when people start repeating themselves. If this
    happens, it means they are still triggered or have gotten triggered.


    The repair practice is simple and short. It focuses on speaking from your heart
    to the other person’s emotional center, to the part of the brain where their survival
    alarm system is located. You speak directly to what feels unsafe or afraid in
    the other person. Reasonable-sounding but long-winded explanations can cause the
    brain’s emotional centers to shut down, since they send the message that someone
    is more interested in clearing their good name than in being present to the other
    person’s feelings. It takes fewer words to speak the emotional truth.


    This book’s repair practice is based on the idea that no one is to blame for anyone’s
    emotional sensitivities. Once we accept that we are not to blame for the other
    person’s reactions, we can let go of the need to defend ourselves. This opens
    the way to feel genuine sorrow and caring for the other person. During repair,
    both people reveal the (possible) early origins'
