    # Protecting One’s Parents


    Many children learn to protect or take care of their parents during childhood.
    They try not to make too many demands. They deny their own needs and hurts. They
    make excuses for a parent’s immature behavior. So as an adult, they continue this
    pattern of protecting the parent by overlooking or minimizing the parent’s weaknesses
    or poor decisions and denying that they have any unresolved childhood wounds.
    The need for such denial has many origins, which often become apparent as we explore
    our trigger reactions. But this need to protect evaporates as we strengthen our
    capacity to tolerate and “be with” the emotional pain of our neglected, abused,
    or traumatized parts.


    The pattern of protecting the good name of one’s parents might also arise from
    the need to project a positive self-image, as a compensation for some imagined
    lack or flaw in oneself. So we might expand this positivity to include our entire
