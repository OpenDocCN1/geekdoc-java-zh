  md: '# # About the Author


    Susan Campbell received her PhD in clinical psychology from University of Massachusetts
    in 1967. Since then she has been a couple therapist, relationship coach, speaker,
    workshop leader, and trainer of professional coaches. She has written eleven previous
    books on relationships. She started the couple and family therapy graduate training
    program at UMass and has been a frequent guest faculty at Harvard, Stanford, and
    UCLA.


    Susan trains coaches and therapists to integrate the tools in this book into their
    professional practices. In her own practice, she works with singles, couples,
    coworkers, and work teams, helping them communicate respectfully and responsibly
    when conflicts arise. She works from the model that all significant relationships
    can be a path for inner growth and healing. Her groundbreaking book, *The Couples
    Journey: Intimacy as a Path to Wholeness*, published in 1980, was the first popular
    book that introduced the idea of relationship as a spiritual practice into the
    mainstream.


    She is the creator and publisher of three entertaining and educational card games
    for teens, adults, couples, work teams, and singles. All of her'
