  md: '# Chapter Eight


    # I’m Triggered with My Kids


    Being a parent has certain built-in dynamics that can be a setup for recurring
    trigger reactions.


    Anyone who has ever been a parent has had moments of feeling impatient, frustrated,
    disappointed, or overwhelmed in relationship to their child. And every child has
    probably felt some of these things toward their parents. But as the parent, you’re
    the one who your child depends on. You’re the one who is expected to be the adult,
    the one who is supposed to know how to manage difficult situations competently.
    So how can you square this with the fact that sometimes you don’t feel very adultlike?
    Sometimes you don’t know what to do. Sometimes you may even feel like giving up.
    This chapter discusses how to handle triggering with children — focusing primarily
    on younger kids who still live at home and are financial dependents. That said,
    much of this can also be applied to situations involving adult children who live
    outside the family home.


    # Parenting as a Practice'
  merge: -1
  pgno: 126
- img_proc: true
  md: 'Earlier, I suggested approaching intimate relationships as a practice — a path
    to inner development and healing, a psychospiritual journey. This goes for the
    parent-child relationship as much as it does for couples. But there is one big
    difference. In parenting, your child is not your equal. It is not a give-and-take
    relationship in the usual sense. It''s more like you give and the child takes.
    That''s one reason being parent can be triggering.


    Being a parent has certain built-in dynamics that can be a setup for recurring
    trigger reactions. In working with parents and families, I have identified three
    of the most common causes of parental triggering:


    +   1. It''s not fair. What about my needs?

    2. My kid''s deficits trigger me.

    3. I don''t understand my kid.


    # What About My Needs?


    Most people have kids before they figure out how to be a good parent to their
    own child. They still have a lot of unmet needs themselves and can become easily
    frustrated when things don''t go their way. So when they have a child, whose needs
    for attention can be quite taxing, there are plenty of opportunities for triggering.
    It''s as if hidden part of the parent is saying, *What about me?* *What about
    my needs?*


    I think this issue is much more common than parents like to admit: They''re not
    doing great at meeting their needs, and they have this little person who is constantly
    demanding attention. At first, it''s the parents'' need for sleep versus the baby''s
    need to be fed or held. Then, it''s to get things done versus the toddler''s need
    to be bathed, changed, clothed, entertained, and kept safe. Most parents expect
    it to be this way, but then it never seems to end, and it can become harder to
    accept making such sacrifices.


    If you or your spouse complain a lot, this is a sign that your own needs are not
    being met and that you are frequently in a triggered state. Complaining signals
    that we want something we''re not getting. Maybe we want more help or appreciation
    from our spouse. Maybe we just want a break or a nap. Maybe we wish our child
    was more self-reliant or not as'
  merge: -1
  pgno: 127
- img_proc: true
  md: 'needy. Or maybe so much of our partner’s attention is going into parenting

    that we feel neglected or left out.


    # A Healing Exercise for Parents


    If any of these examples feel familiar to you, take a moment to reflect on

    how well your own needs are being met: your need for help, teamwork,

    cooperation; your need to feel appreciated or valued; your need to feel that

    you are doing enough or are good enough. Do any of these strike a

    resonant chord within you? If so, try this self-nurturing exercise:


    Start by focusing on a specific need or a specific memory of a time

    when, in your role as a parent, this need was not being met (such as the

    need to feel valued or appreciated). Recall a general sense of how this need

    feels, or bring back the specific memory, and notice your body sensations

    and feelings.


    As in the Compassionate Self-Inquiry practice (see pages 97–103), be

    sure you are breathing fully and deeply in order to support whatever

    feelings arise. As your breathing opens and becomes more spacious, take

    the attitude and stance of a big, open, nurturing presence space for

    tntfeelings associated with this unmet need.


    Notice the body sensations of your breathing as you also welcome any

    other sensations that arise — sensations that seem to be associated with the

    unmet need you are experiencing. Allow memories or past associations to

    come up. You might recall a childhood memory where one of your

    developal needs for protection, safety, loving attention, or support was

    not met. If this occurs, recall how you as that child felt back then; let the

    witnessing part of you embrace the child part. See if you can

    activate your own inner mother who can hold a nurturing, accepting

    space for whatever your inner child feels.


    Be with yourself like this for a while, as you offer comfort, tenderness,

    and empathy to the part of you that feels unmet or unsupported or to the

    unmet need. See if you can feel compassion or sorrow for yourself — for

    your inner child or for how busy or stressed out you feel. This is different

    from feeling sorry for yourself. This type of sorrow is a form of self-

    empathy.'
