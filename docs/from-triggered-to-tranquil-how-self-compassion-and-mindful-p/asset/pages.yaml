  md: '# I Feel / Period Cards: A device I use in the Honesty Salon is to give everyone
    an 8.5-by-11-inch card. One side of the card has the phrase “I feel …” and the
    other side has the word “Period.” The “I feel …” side of the card is used when
    a person is talking, and someone else in the group thinks the talker may have
    gone away from their present felt experience and begun intellectualizing, generalizing,
    or rehashing a familiar story. The listener then holds up the “I feel …” so the
    person talking can see it. This prompts the talker to check in themselves to notice
    feelings and body sensations before continuing to speak. In a while the talker
    will get triggered when saying the “I feel …, but in my groups, triggering is
    an opportunity for inquiry, not to avoid.


    The side of the card that says “Period.” is used if a listener thinks the talker
    is starting to go into an unconscious pattern of repeating or overexplaining.
    The listener will hold up the “Period.” sign. This prompts the talker to pause
    momentarily to notice if they have made their point, if they complete, they feel
    anxiety about ending their sharing, and so on. I think many members tend to talk
    on and because how they are being received by their listeners. They fear they
    aren’t clear or that they might be argued with, so they keep talking, trying to
    find a more clear, or unarguable, way to say what they mean. Members of my groups
    have told me that this “Period.” sign has helped them become more self-aware in
    other groups they belong to their tendency to overexplain and often find themselves
    silently saying “period” to themselves, usually with an attitude of self-acceptance
    and humor.


    Rounds: If your group seems to be stuck, or you’re not sure if members are suppressing
    difficult feelings, atypical contributions, or trigger reactions, do Rounds: Invite
    each member to speak one word into the group space that describes how they are
    feeling. In a large group video conferencing format, you might use the chat function
    — participants write one word in the chat. This is a way to take the pulse of
    the group quickly. It also gives the whole group snapshot of the group’s mood.
    Leaders are often surprised by what gets revealed. As a leader, you may assume
    people are quiet because they don’t feel safe, but after doing, you might discover
