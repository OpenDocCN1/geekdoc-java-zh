  md: '# # Conclusion


    In this book, I hope I have opened your eyes to the profound benefits of trigger
    work. I hope you have seen how you can become inwardly stronger and more resilient
    by owning that you sometimes feel small and bewildered; how denying any part of
    yourself ultimately weakens you because when you try to avoid or deny a painful
    reality, that is when you lose your power to effectively deal with it.


    I hope you have seen that a good life is not necessarily a pain-free life and
    how the pain is so much easier to bear when you attend to it rather than turning
    your back on it.


    I hope you recognize blaming someone for your upset feelings prevents you from
    taking responsibility for your wounds and deficits. These wounds are a part of
    your personal hero’s journey. They are not your fault, but since they have shown
    up in your life, they are yours to deal with. A blaming attitude will prevent
    you from learning what you need to learn to heal your wounds.


    I hope you have a better understanding of how the ego-mind operates to protect
    you from things you don’t need protection from — things like uncertainty, discomfort,
    and appearing weak, needy, or imperfect — and'
  merge: -1
  pgno: 187
- img_proc: true
  md: 'how this part of the mind tries to control things you really have little or
    no control over. I hope you are learning to step back from your automatic thinking
    habits and to remind yourself that this part of the mind comes from how you learned
    to cope with unmet needs. It is what we call the conditioned mind or your conditioning.
    The aim of the hero''s journey is to get free of your childhood conditioning so
    you can make adult choices based on what is actually happening — instead of what
    you fear will happen because it happened when you were a child.


    I hope you are convinced that pausing frequently to be aware of your inner state
    is a good practice. Mindfulness breaks like are beneficial even when you are not
    triggered, and they could help reduce triggering episodes. When you make pausing
    a part of your daily life, you give your nervous system time to become calm and
    your senses time to become open. The result is a more spacious and perceptive
    field of awareness — you can see more of current reality at once, and you can
    “see things coming.” Thus, you will experience fewer unwanted surprises.


    Pausing also strengthens your capacity for self-witnessing. As take the position
    of the witness, you become less identified with the conditioned mind that tends
    to think something is wrong with you if you feel upset. From the witness perspective,
    any feeling can be welcomed and held. The witness is that big spacious presence
    that welcomes everything that''s real. It allows you to tenderly hold your pain
    while at the same time knowing that this pain is not your essential self. The
    witness allows you to experience and hold emotional pain not being identified
    with the pain.


    We live in uncertain, complex, and often overwhelming times. To cope with the
    challenges we face, humans need to develop and use more of our potential. The
    main thing holding us back from such development is our normal, but unnecessary,
    fear of discomfort or resistance to change. Development takes effort. It is uncomfortable.
    Doing trigger work teaches us not to avoid uncomfortable feelings. We learn that
    we embrace our tender pains and fears, a natural healing process is set in motion.
    This expands the size of the world we can comfortably and competently deal with.
    We discover a new relationship with the parts of ourselves we had believed were
    the cause of our distress. As it turns out, denying them was the cause of our
    distress. These are the kinds of lessons that come from doing trigger work. We
    learn that we really do have what it takes to cope'
  merge: -1
