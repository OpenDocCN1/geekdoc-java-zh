    You can quit anytime. But even if intimate partnership as a practice is not your
    path, it is still nice to have better communication skills.


    The primary lesson in this relationship school is learning to work with your triggers
    in a cooperative way. In a partnership, it is both partners'' responsibility to
    help create an atmosphere of safety, trust, healing, honesty, fairness, and respect
    for differences.


    # Cotrigigger: We Are Wired Together


    Every couple operates as a biological “herd of two.” In the animal kingdom, members
    of a herd depend on one another for survival, so they instinctively react when
    any member of the herd seems to be in danger. In a herd, each member''s interests
    are best served when the whole herd is healthy and safe. In a herd of gazelles,
    for example, if one gazelle senses danger and is triggered to run (choosing flight
    in the fight-flight-freeze response), the whole herd will get cotrigged and start
    running in the direction.'
