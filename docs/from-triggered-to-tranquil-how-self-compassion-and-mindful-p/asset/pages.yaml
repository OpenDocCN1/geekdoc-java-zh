  md: '# Introduction


    # Triggers, Trauma, and Trigger Work


    # The Path to Self-Healing


    Our unprocessed emotional wounds and the reactions that arise from them are what
    make us go to war, blow up at our children, get hostile on the freeways, hit “send”
    on that email rant, walk out of meetings, argue with our loved ones, and make
    short-sighted decisions.


    This book is a self-help guide for anyone who has ever gotten emotionally reactive,
    defensive, shut down, or overwhelmed in an adult relationship or group. That includes
    almost everyone. The hurts and disappointments that we suffer in childhood often
    leave lasting scars with respect to our inner sense of safety and security. These
    insecurities will show up later in our adult relationships in the form of trigger
    reactions. But this is not necessarily a bad thing. In this book, you will learn
    how to work with such reactions in a way that brings healing to your childhood
    wounds, deeper connections with others, and an expanded sense of what it means
    to be human.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'You may be one of those people who have been told you’re too sensitive or too
    much, so you already suspect you need healing around this issue. Or you may not
    have big, expressive reactions to things; you may be someone who keeps upset feelings
    and disappointments to yourself. Or perhaps you''re pretty even-tempered, only
    getting flustered when someone comes at you aggressively, you might think you
    just need some tips for dealing with difficult people. But even if someone rarely
    gets triggered, there is a good chance that they still have emotional wounding
    in the shadows to become activated in a future relationship.


    This book teaches how to catch and calm trigger reactions quickly so we can get
    back to being present and resourceful. The underlying premise is that we can heal
    emotional wounds that originate in childhood, but to do so involves what I call
    trigger work. The starting point for this work is the experience of getting triggered
    into some version of fight, flight, or freeze—which may involve angry feelings,
    a tight chest, the urge to hide, and so on. Once we notice or catch such reactions,
    then we can learn how to explore our fears, hurts, and other difficulties. In
    time, this helps us view painful experiences from a wider perspective and realize
    that experiencing pain or fear does not mean there is something wrong with us.
    In fact, painful emotions can be a portal to a deeper understanding of life and
    our relationship to it.


    To reinforce key concepts, each chapter begins with an italicized one- or two-sentence
    excerpt from that chapter. Most of the exercises in this book can be done on your
    own—even if the reactions were triggered by other people. The chapters in part
    2 describe specific ways to apply these practices in your relationships with intimate
    partners, friends, children, coworkers, groups, and strangers.


    Many of the exercises ask that you recall memories of past or recent trigger reactions
    and notice the feelings, sensations, and thoughts that come up. This repetition
    is important. Ideally, you will become well-practiced at dealing with trigger
    reactions that you learn to take such reactions in stride. Practicing any new
    skill builds confidence, and so it is with the skill of working with trigger reactions.


    # The Root of Most Human Conflict'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'I got into the field of psychotherapy so I could help people live happier,
    more fulfilling lives. I have been doing this work for fifty-five years. And I
    believe I have discovered the root of most human unhappiness, conflict, and dysfunction:
    It is the fact that we do not know how to accept and work with painful emotions
    and trigger reactions, we project the cause of our reactions onto others, thus
    creating needless conflict and misguided action. If we could learn how to accept
    and work with the painful realities of our lives — instead of blaming, scapegoating,
    denying — this world would be a saner, safer, friendlier place. Our unprocessed
    emotional wounds and reactions that arise from them make us go to, blow up at
    our children, hostile on the freeways, “send” on that email rant, walk out of
    meetings, argue with our loved ones, and make short-sighted decisions. Our invisible
    or inner trigger reactions are what make us too shy to ask for a date, afraid
    to speak up for ourselves at work, walk on eggshells with our spouse, and freeze
    up when speaking to groups.


    We get triggered more often than we realize. When we are in this state, decisions
    come from the wrong part of our brain — the primitive lizard part — instead of
    the more evolved prefrontal cortex that is capable of seeing longer-term consequences
    and more than one point of view. We need to learn how to get untrigged and regain
    access to our higher brain functioning before tackling external problem we are
    facing.


    When we get triggered, our nervous system quickly releases strong neurochemicals
    (the activating hormone) and cortisol (the stress hormone) that cause us to react
    automatically, without realistic awareness of our full range of options. We are
    blind to the actual possibilities available to us. Creative problem-solving goes
    out the window. Behavior becomes automatic, rigid, patterned, and stereotyped.
    We regress to the least resourceful version of ourselves — sort of a cornered
    animal.


    But it''s not our fault. We are not bad or weak for getting triggered. And if
    another person triggers us, it''s not their fault, either. Getting triggered is
    a survival mechanism that is built into our nervous system. We all need to learn
    about getting triggered. We are born with this survival mechanism in the amygdala
    area of the brain. This alarm system originally developed to alert our animal
    ancestors to potential physical danger in the world around them. It is always
    scanning for danger. And to ensure physical'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'survival, it is wired to react quickly — act first and think later. In our
    primitive ancestry, saber-toothed tigers or other predators were a real threat,
    the brain evolved to have instantaneous reactions of fight, flight, or freeze
    to anything that remotely resembled a predator. In primitive times, it was an
    evolutionary advantage to react instinctively, without taking time to assess,
    “Is this a real danger or a false alarm?”


    # Interpersonal “Dangers” Feel Dangerous, Too


    In these modern times, we are not in danger of a tiger jumping out at us from
    the next bush. Nowadays, our survival alarm system is mostly scanning for a different
    kind of danger — the danger we feel when there is (or seems to be) a threat to
    something else that we regard as vital for our survival. These things can include:


    +   * our connection to someone special whom we depend on

    * approval or acceptance from others

    * our self-image, such as being seen as competent, strong, good, honest, smart,
    right, trustworthy, and so on

    * our financial security

    * our sense of inclusion or belonging in a group


    Of course, the world still contains threats to our physical well-being — we can
    get triggered by a reckless driver on the highway or when we wait too long for
    medical attention in the ER. This book does not focus primarily on these types
    of physical dangers — except in instances where a shock trauma, such as being
    hit by a drunk driver, restimulates an earlier developmental trauma, such as where
    the child was beaten by a drunk parent or an irresponsible older sibling. Such
    physical traumas can leave lasting emotional scars — especially if the child did
    not have to talk to or get comfort from after an incident. No matter how your
    triggers originated, the practices in this book will help you integrate unprocessed
    experiences and complete the unfinished emotional business associated with them.


    It is possible to learn to navigate trigger reactions without falling automatically
    into fight-flight-freeze. That’s the job of our higher brain'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'centers — our frontal and prefrontal cortex. Over the course of evolution,
    humans developed these higher brain centers that can modify the quick reactivity
    of the middle and lower brain centers. The higher brain has the capacity to remind
    us that our boss''s flat voice tone does not necessarily mean disapproval — even
    though our instinctive reaction is to feel protective or defensive. The cortex
    also makes self-witnessing possible — the ability to step back from being enmeshed
    with our reactivity and consciously choose a response that fits the actual situation.
    While we may always be triggered, and experience an instantaneous defensive reaction,
    when we hear a critical tone of voice, we can learn to catch and interrupt this
    reaction as soon as it begins.


    Life waits us to learn from experience, to develop, to heal, and to evolve into
    higher states of being. And it gives us everything we need to heal ourselves and
    evolve. Our job is to pay attention, to be aware, to be present to the actuality
    of each moment. We can''t learn from experience when we''re on automatic and thus
    unable to see, hear, and feel what is actually going on. If we are going to learn
    to master our trigger reactions, we have to learn to slow things down.


    # Trigger Reactions Can Foster Self-Knowledge


    My life''s work is dedicated to helping people slow down and pay attention — so
    we can catch and halt those automatic reactions and take action with awareness
    of our full range of choices. Slow down and catch that automatic tendency to hear
    disagreement as criticism. Slow down and notice that impatient people need to
    get a commitment from the person you''re dating. Slow down that impulse to walk
    out in the middle of an argument or to give up or feign agreement in order to
    keep the peace.


    Learning to recognize your trigger reactions is the starting point for this journey.
    Trigger reactions are portals into the human unconscious. They help us see and
    understand why we do many of the things we do — especially the things that, at
    first glance, appear self-defeating. For instance, when we become hostile when
    someone doesn''t want to be romantic, or we get defensive when a professor gives
    critical feedback on an assignment.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Your trigger reactions can be the doorway to understanding and embodying a
    much bigger life process that I like to call whole-making. As I see it, life itself
    is about whole-making — integrating the various parts of a system into increasingly
    interrelated wholes. Our trigger reactions help us see aspects of ourselves that
    we may be unaware of. As we explore these reactions, we discover parts of ourselves
    that have been denied, abandoned, or repressed. This is the realm of the human
    unconscious that psychologists call our shadow. As we enter through this portal,
    we encounter forgotten hurts and disappointments, unmet childhood needs, protective
    personality habits that we adopted to keep us safe, beliefs that help us make
    sense of things we don’t understand, and ideas about ourselves and others that
    feed the insecure ego’s need to be knowledgeable, good, or right. Discovering
    and learning to accept these parts helps us realize more of our unique human potential.
    As we embrace and welcome these parts, we become more whole.


    # Trauma and Trigger Reactions: Some Definitions


    Psychologists and other mental health professionals have created a fairly refined
    set of labels and definitions for different types of nervous-system dysfunction.
    They use the term *shock trauma* for events that are sudden and overwhelming to
    the person’s ability to cope. Examples of this would be witnessing a violent act
    or being in a tragic accident. These things can occur at any age. Experts use
    the term *developmental trauma* for neglectful, abusive, or chaotic situations
    that a child is developing into adulthood, usually in one’s family of origin.
    Developmental trauma generally occurs over time. It is not caused by a one-time
    event.


    Generally, the word *trauma* refers to an event or series of events that overwhelm
    a person’s ability to cope — whether this is a tragic car accident or parental
    neglect. This term can also refer to the *effect of* a traumatic event, as in
    “She suffered a head trauma,” or “She suffered an emotional trauma.” A trauma
    is something that has happened in the past. It is generally believed that the
    effects of trauma are more lasting and severe if the traumatized person does not
    have an opportunity to process the event, talk about the event, or be comforted
    by someone right after the event.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'The word trigger means a current-time cue or event that restimulates the sensations
    of a past trauma. Trigger can be both a verb and a noun. A loud voice can trigger
    (verb) a person''s fear of being controlled or overpowered. And this same loud
    voice is a trigger (noun) for the person to assume a self-protective posture.
    The original trauma behind this trigger might be early childhood experiences of
    being yelled at by a parent or the experience of being bullied at school by someone
    with a loud, scary voice. This book focuses on people''s trauma reactions, and
    these generally involve some version of fight, flight, or freeze. In this case,
    if a loud voice was the trigger, the person might react by yelling back (fight),
    leaving the room (flight), or shutting down and not responding at all (freeze).
    Reactions can range from mild, like having a judgmental thought, to severe, going
    numb. A triggering stimulus can sometimes cause a flashback. A flashback is a
    brief, vivid, often frightening memory that seems to appear out of nowhere and
    makes people feel as if they are back in the traumatic situation. Sometimes flashbacks
    occur without any apparent stimulus.


    # Attachment Trauma


    An important type of developmental trauma is called attachment trauma. This term
    refers to all-too-common forms of neglect, abuse, or disorganised behavior that
    interfere with an infant or child''s secure attachment or bonding with their caregiver.
    This disrupts a child''s sense of trust that their needs matter or that it is
    safe to express their feelings and needs. Most people suffer some degree of attachment
    trauma simply because many parents are often busy or too distracted with their
    own problems to be fully present to their child''s needs. All children have attachment
    needs like liking attention, nurturing touch, and reassurances of safety when
    they are hurt or afraid. Such reassurance of another human is called coregulation.


    The need for parent-to-child coregulation continues beyond infancy, through one''s
    childhood, and even into one''s teens. Another attachment need that continues
    into one''s teens is the need to have one''s sovereignty or unique personhood
    respected. If a parent treats a child as an instrument to'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'fulfill the parent’s selfish needs, pleasure, or status, this is a violation
    of the child’s sovereignty and can create wounding or insecure functioning.


    The basic attachment need that seems to endure throughout life is the need to
    feel that we are not all alone, that there is someone we can turn to for comfort
    and reassurance in times of distress. Research shows that if a child or adult
    suffers a traumatic incident, but then has someone supportive to talk about it,
    the effects of this trauma are much less severe.


    # Humans Are Not Machines


    When people get triggered, they often say, “That person pushed my buttons.” This
    phrase illustrates how a perceived threat to one’s emotional safety can cause
    a person to go on automatic — just as someone pushed a button on a machine. The
    button gets pushed, or the trigger pulled, and suddenly the person exhibits a
    series of preprogrammed reactions or automated routines. Humans are not machines,
    but we often behave in machinelike ways — automatically explaining ourselves if
    someone says they do not agree with us, or automatically assuming our housemate
    is angry if we hear the door slam. My aim in writing this book is to show that
    we can overcome this unfortunate programming and open up to our full range of
    options and choices in any given moment — instead of being stuck in rigid, machinelike
    patterns.


    The journey to mastering your triggers begins when you recognize reactivity in
    yourself. This reactivity can be obvious — like when you yell at the person who
    took your parking space. Or it can be hidden — like someone interrupts you, and
    you feel slighted, but you don’t make a big deal out of it. In this book, recognizing
    and working with your triggers is the focus of part 1. The chapters are organized
    around five essential adult development tasks. These are the Five Steps of Trigger
    Work: admitting to and accepting triggers, catching them early, pausing to self-calm,
    activating self-compassion, and restoring safety and connection. These chapters
    provide simple practices for accomplishing each step, and they can be done by
    yourself.


    Part 2 shows how to apply these practices in different types of relationships:
    with your mate, your children, a friend, as a group member,'
  merge: -1
  pgno: 19
- img_proc: true
  md: as a group leader, and in relationship to your social context.
