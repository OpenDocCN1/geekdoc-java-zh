    # Resistance Is Normal


    Even though the word triggered is now part of our vocabulary, most people still
    have difficulty accepting full ownership of the fact that when we get emotionally
    reactive, this arises from our own inner world. If someone else''s words trigger
    feelings of insecurity or pain, this pain was already inside waiting to be activated.
    Even if we intellectually accept this, we may still have some emotional resistance.


    Here are the three most common emotional blocks to such acceptance:


