    Triggers, or the reactive behaviors and stories that arise around triggers, are
    the biggest impediment to trust and respect that most couples will face. But when
    you know how to work with your reactivity and repair quickly, this is the best
    way to deepen trust and respect. So the sickness becomes the cure. Part 1 of this
    book outlines the basics of how to work with your triggers. This chapter covers
    some of the issues that apply specifically to couples.


    # Relationship as a Practice'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'An intimate partnership is a breeding ground for triggers. Because of this,
    it is also the best context for healing childhood wounds or trauma and for transcending
    childhood conditioning. I suggest viewing the relationship as a practice. This
    means that, as in practices like yoga or meditation, I expect to encounter discomfort.
    You know effort and self-discipline are required. Rather than respond with dismay
    or shock, you welcome unexpected challenges for what they can teach you about
    yourself. Also like yoga and meditation, you know experienced teachers can show
    you where to put your efforts so they bear the most fruit. This chapter will show
