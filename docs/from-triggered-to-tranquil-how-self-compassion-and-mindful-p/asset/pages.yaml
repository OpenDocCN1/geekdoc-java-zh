- img_proc: true
  md: 'need to have all our higher brain online. Differences tend to push buttons,
    automatically diverting us into the reptilian part of our brains. It’s too easy
    to fall into reactive patterns like blaming or projecting our disowned parts onto
    “the other.” It’s not easy to inquire deeply into our reactions and unfinished
