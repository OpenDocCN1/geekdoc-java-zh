  md: '# Relationships with Authority


    I like to remind people that we all started out little and dependent in a world
    of big people. These people were the authorities — parents, grandparents, teachers,
    clergy, coaches. Pause now to remember the big people who influenced you as a
    child. Were they fair? Did they cope well with their own emotions? Did you trust
    them? How did you feel about yourself in their presence? Did they give you guidance?
    Did you feel acknowledged and valued by them? Did any of them use or abuse you?
    Keep these things in mind as you read this section on leadership and authority.
    Remember that groups, like individuals, have both conscious and unconscious motives
    and behaviors. The way a group behaves with respect to leadership or authority
    is often confusing and difficult to see — because most people are not aware of
    what we call the "group unconscious."


    No matter what the setting of a group, whether it is a work group, a learning
    group, a social group, a support group, or a group of strangers, someone has to
    take a leadership role to keep things on track. This could be a designated group
    leader, facilitator, teacher, or boss. In less formal groups, it could be anyone
    who knows to lead or take initiative. Once a leader is identified (even an informal
    leader), this person becomes a projection screen. Members will project their unmet
    childhood needs and unfinished emotional business onto the leader. Some members
    will give away their power to this person. Others will try to wrest power away
    from this person. Members may become very vigilant about what behavior this person
    rewards and what they punish or ignore. They may hold the person to an unrealistically
    high standard. Attitudes toward a group leader (including a nonleader who takes
    initiative) will vary — depending on what that triggers in each person. This may
    have a lot more to do with each person''s triggers than with the leader''s skill
    or personality.


    # Recall a Triggering Event in a Group


