    need some reassurance that we''re okay."


    Doing the Compassionate Self-Inquiry practice just prior to any repair will help
    the repair process go smoothly. Each time you do this self-inquiry, you are helping
    yourself take in stride what I like to call “the normal pains of an adult relationship.”
    As you learn to accept and soothe your pain, this less needs to blame the other
