  md: 'Members instinctively know when a group is operating in a healthy way. When
    it is not, certain members will act out the unconscious fears of the group — sometimes
    leading to a shared sense of un or chaos. If a group you are leading seems to
    be regressing in this way, that’s a signal to take a step back and invite members
    to become group observers with you. Use your authority to bring the group’s attention
    to what is happening here and now. You might suggest that everyone pause and step
    back with you, taking the posture of an observer of this group. Report what you
    are noticing and ask if others agrees with something that is off. Once this is
    established, make a clear leadership statement “We cannot continue with our task
    until we sort this out, and I’m going to need your input. I request that we all
    consider together: What might be going here? Do people feel safe? Do you think
    people feel valued? Are there any unresolved issues, unrepaired triggers, or conflicts
    from the past that might be creating mistrust? Is there anything that anyone has
    noticed or felt that might be useful here?”


    The discussion that ensues may or not solve the problem. But whether it solves
    the problem or not, it is still worth doing. Even if your efforts fail, and the
    group chaos continues, doing this is part of your learning and the group’s learning.
    If you want to further enhance your learning, get some supervision from someone
    more experienced than yourself. Therapists get supervision when they need it.
    Group leaders need supervision, too.


    # Group Debriefing, Revising, and Repairing


    There are several good ways to end a group where triggering has occurred. These
    may need to be integrated with the group’s other closure rituals or practices,
    that is, with the things this group normally does when ending. One good way to
    assess the group’s state of mind is to do rounds. Another is to ask a few specific
    questions about the triggering episode, such as the following, and request responses
    with a few of hands:


    +   - How many are still feeling somewhat shaken by the interaction between [whoever
    was involved]?'
