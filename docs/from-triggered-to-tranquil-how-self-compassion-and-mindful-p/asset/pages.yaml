    # Triggering as a Wake-Up Call


    Sometimes what we think is a bad thing turns out to be good for us. Sometimes
    we need something unpleasant to shock us into paying attention to things we were
    not aware of. In my work with couples, I often see one or both partners recognizing
    that they needed to get whacked on the side of the head by some circumstance in
    their outer world (in this case, a difficult marriage) in order to pay attention
    to the need for inner change.


    One client, Rachel, describing this realization as she explored her frustrations
    in her marriage. She reflected: “When I first started counseling, I thought I
    was with the wrong person. Like, why would I want to be with someone who upsets
    me so much, where I often feel so unloved and unprotected? But now I see that
    blaming him was not the answer. I am seeing that so many of my personality defense
    mechanisms and fear-stories were connected to unprocessed hurtful childhood experiences.
    I was going'
