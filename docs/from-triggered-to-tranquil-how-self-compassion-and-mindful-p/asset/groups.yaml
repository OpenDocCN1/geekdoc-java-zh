    # Inner Work: Approaching Life as a Practice


    Trigger reactions help us see where our childhood unfinished business is. Underneath
    such reactions are buried fears and buried pain that need attention and tenderness.
    Sometimes there are feelings we never felt safe to feel or attachment needs we
    never felt safe to express.


    I have always liked the phrase “daily life as spiritual practice.” This phrase
    reminds me that we can approach everything that happens in life as an opportunity
    for inner work — for developing an identity to include not just our self-interest
    but “the good of the whole.” For me, personally, this inner work has taken the
    form of noticing whenever I feel resistance to what is. Resistance to what is
    almost always indicates some fear of emotional discomfort. This is a type of trigger
    reaction. When I notice my resistance, I take this as a sign that there is inside
    me some buried pain, unhealed wound, or developmental deficit that I have not
    fully owned, accepted, embraced, and loved. Like most people, I instinctively
    resist having to face and deal with feelings or fears that are uncomfortable.
    So the only thing that gets me to look into uncomfortable areas is my commitment
    to “life as a practice.”


    # Fear of Being Weak or Needy


    As children, we may have been criticized or shamed when we expressed our tears,
    fears, hurts, or needs. Maybe we were laughed at or ridiculed. Maybe we were told
    it''s wrong to be selfish or weak. Maybe someone labeled us too sensitive or too
    emotional. Our ordinary upsets or concerns may make adults uncomfortable, perhaps
    triggering their own fears if their child was unhappy or imperfect, this meant
    they were not a good enough parent. Such common parental fears and self-doubts
    can spill out their children — creating the impression in the child’s mind that
    If I am in need or in pain, no one wants to be around me or people get upset.
    Maybe I''m bad or wrong when I feel such things.


