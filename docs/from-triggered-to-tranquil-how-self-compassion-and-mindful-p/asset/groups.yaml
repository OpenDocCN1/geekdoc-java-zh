    As the leader, notice if you experience any impatience or frustration and give
    yourself a quick dose of self-soothing. You might reveal to the group instance
    where you yourself got tongue-tied or experienced performance anxiety in a group.
    You can also invite the group to pause and self-calm, after which you might invite
    member A to have a do-over if they wish, or you might ask member A if they would
    like feedback from others about the impact of their behavior. However, do not
    allow others to give feedback to this person unless they want feedback.


    ## Group or Personal Identity


    Sometimes, someone in the group may use a label or term when referring to someone’s
    gender, race, sexual orientation, or ethnicity, and one or others in the group
    may judge this to be insensitive or inappropriate. These people may get triggered
    based on a fear-story that the person who spoke is unsafe, disrespectful, or disapproving.
    As the leader, be on the lookout for finding triggering any time a member uses
    labels or terms that others might find inappropriate or offensive, whether the
    terms are commonly regarded as inappropriate or not. If you notice someone is
    triggered, you might call for a group pause; do “rounds”; share your own care,
    empathy, or other feelings for whoever is upset; and/or share your care, empathy,
    or other feelings for the person who spoke.


    ## Shame


    Say a leader expresses anger or marks a boundary with a member publicly, or perhaps
    the leader simply corrects or offers advice to this member. This may trigger the
    member’s fear of being publicly shamed. Perhaps this member has a history of shame-related
    trauma, and flooding or dissociation occurs. As the leader, be alert for signs
    of reactivity in such situations. When something you triggers someone, take ownership
    for any unskill behavior that you can own and perhaps tell the group, “If I could
    do it over, I would...” You may also want to apologize and reveal that you were
    triggered (if this is true).


    ## Conflict


    Conflict between two members, or any number of members, may trigger retraumatize
    members who grew up in families where there was a lot of fighting or where there
    was addiction, mental illness, or lifestyle instability. For such group members,
    unresolved conflict situations can trigger fears of conflict or chaos.


    As the leader, be alert for signs of reactivity whenever there is conflict in
    a group. Invite a group pause, saying something like “Sometimes there is conflict
    in a group, this can be upsetting, and not just for the people involved in the
    interaction. I suggest we all take a moment to connect with ourselves and calm
    our nervous systems. Will you join me by closing your eyes and taking four or
    five slow full breaths?” After the, you might invite sharing regarding how people
    reacted to the conflict, what this brought up for them, and/or how they are feeling
    now in their bodies. This might also be a good time to do “rounds.”


    ## Overwhelm


    When group members are giving feedback to an individual, this individual may become
    overwhelmed and be unable to mark a boundary and ask to be left alone. Other members
    may notice this but not feel empowered to speak up. If the leader does not recognize
    this, and others do, some group members may judge the leader as incompetent.


    As the leader, be alert to overwhelm in group members. If you ever realize you
    have failed to address this, do a personal inquiry involving self-compassion,
    and take responsibility for any sensitivities, fears, and blind spots you encounter
    in doing this inquiry. Publicly take ownership for any unskillful behavior that
    you can own, apologize, or make a public statement to the group, “If I could do
    it, I would...” Make note of what you have learned going through this painful
    experience, and appreciate yourself for being open to feedback and continuous
    learning.


    ## Addressing Other Triggers


    In addition to this list, group members will possess or exhibit many other sensitivities
    as well. Group members bring with them the ghosts from their past that they have
    unfinished emotional business with. It''s not just the leader who is a projection
    screen. It''s also the group itself.


    It''s impossible to anticipate every potential situation. Just remain alert for
    trigger reactions, call for a group pause when you''re in doubt, and be open to
    input and advice from group members. To be healthy, a group needs to have the
    capacity to learn and grow together. The leader does not need to have all the
    answers. The leader''s job is to facilitate group development and learning, to
    facilitate cooperation towards a common goal, and to help members find ways to
    use their unique gifts and resources to further these aims. Sometimes these aims
    are best served when leaders adopt a not-knowing posture and remain open to learning
    with and from others as everyone goes through a challenging situation together.


    If you make an error in judgment, it''s important to own up to this immediately
    and do a public repair. People tend to be pretty forgiving when leaders open up
    and admit a mistake — as long as leaders do not defend themselves while so. Defensiveness
    an otherwise sincere apology. Apologize first to those who were hurt by your actions.
    Then, when triggers have been calmed (yours especially), ask if people are willing
    to hear your explanation or perspective on the situation. Do not assume the answer
    will be. Watch everyone''s response carefully, and if people are not yet ready
    to listen to your side of the story, do not proceed. Bring the matter up again
    at a later time.


    ## Leadership Practices and Interventions


    This section describes some group leadership practices for minimizing, managing,
    and working skillfully with trigger reactions in groups.


    ## Setting Context: Purpose, Ground Rules, and the Leader''s Role


    When a group starts, or when joining an existing group as the new leader, share
    your sense of the group''s purpose, ground rules for communicating, and your perspective
    on your role. Then share some of your values about what fosters group health and
    safety and your expectations of conduct. In personal development context, this
    might include values like respect for differences, openhearted listening, honesty,
    risk taking, balanced participation, and taking responsibility for one''s. In
    work context, you might emphasize values like openness to learning, willingness
    to ask for help, sharing information, and taking initiative.


    Explain how you see your role and leadership style. Are you more directive or
    laissez-faire? Are you the person to go to if people have problems with another
    member, or do you expect them to work out among themselves? Do you call on to
    make sure everyone’s voice is heard, or do you leave that to each individual?
    If you are playing the dual role of both leader/facilitator and group member,
    how will you let everyone know when you are speaking as a member versus the boss,
    leader, trainer, or expert? For instance, some facilitators/teachers will literally
    change hats; some wear beads when they are the teacher.


    In my personal groups, members know that in my role as teacher, I will be interrupting
    them sometimes to help notice the feelings or assumptions underneath their stated
    message, or to help notice their trigger sensitivities or unconscious communication
    habits. I need get their consent on this so they will not be shocked or insulted
    when this happens. Despite this, some will still get triggered by being interrupted.
    But in my groups, this is gratis for the learning. After I interrupt, I watch
    for signs of triggering.


    Some groups start off getting group agreement to use mutually developed communication
    guidelines, which might include the following: not interrupting, making I-statements,
    keeping shares under one minute, and accepting the fact that members might get
    triggered or overwhelmed at times.


    Whether you have such guidelines or not, it is still a good idea to acknowledge
    that triggering may happen and to get agreement when it does. You might start
    this discussion by mentioning that things can get going pretty fast, resulting
    in some members'' feeling left out or left behind. Or things can get said in the
    heat of the moment that come across to some as disrespectful or insulting. Then
    introduce

