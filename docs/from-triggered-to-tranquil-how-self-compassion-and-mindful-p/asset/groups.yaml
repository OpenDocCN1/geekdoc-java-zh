    anxiety, or confusion, try to bring a compassionate attitude toward these feelings.
    As above, imagine that this upset part of you is a much-loved child or a tender
    aspect of yourself. Get to know this part and give it the love and understanding
    it has always needed. Encourage this hurting part to feel whatever arises. Allow
    feelings and sensations to move or change. If tears come, this can be helpful,
    as crying is a way the body moves stuck energy. Reassurance this tender part that
    you are here, and you are willing to be here for as long as this takes. When you
    do, you create a reassuring presence that makes space for your upset self to more
    fully feel the fears or insecurities that are beneath your triggers.


    Old memories or familiar associations might also come up. You might get a familiar
    felt-sense that this adult reaction is related to past experiences. An old memory
    might surface — from earlier in your adult life or from childhood. If a specific
    painful, scary, confusing, or upsetting childhood memory emerges, move your attention
    to that scene, and follow the Compass for Your Inner Child exercise. While practicing
    self-calming, recall the old event; track your feelings, sensations, and thoughts;
    and allow space for the vulnerable fears to emerge. Hold whatever arises with
    an attitude of acceptance and curiosity. With yourself, allowing things inside
    of you to be just as they are and to change and move as they will.


