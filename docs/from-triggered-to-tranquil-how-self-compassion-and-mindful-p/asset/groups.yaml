    ## I’m Triggered in a Group or Meeting


    Adult groups often mirror some of the dynamics of our early family, school, or
    peer-group experiences.


    This chapter provides guidance for how to deal with your own and other people’s
    trigger reactions in group settings. Groups provide a powerful context for working
    through social anxiety, authority issues, conformity issues, and issues of belonging
    — even if this is not the stated purpose of the group.


    Getting triggered in a group can be an unforgettable experience — unforgetably
    uncomfortable — because there may be a lot of people you don’t know well or people
    you don’t trust who have just witnessed you losing it! This can offer the opportunity
    to work with things like, embarrassment, conformity pressure, scapegoating, feeling
    left out, feeling judged, performance anxiety, and feeling not good enough.


    Triggering that occurs in a group setting can be especially powerful (and hard
    to manage) if our early wounding occurred in a dysfunctional family setting or
    an unfortunate grade school or high school experience.


    Adult groups often mirror some of the dynamics of our early family, school, or
    peer-group experiences. This is because we get conditioned, or “trained,” to behave
    in particular ways or to take on particular group roles in these settings. Once
    we’re adults in a group with other adults, we may unconsciously revert to the
    same group role we played in our childhood family, in school, or on the playground.
    Our role in our early family might have been the black sheep, the golden child,
    daddy’s girl, momma’s boy, the family scapegoat, mother’s helper, the rescuer,
    the sickly one, the rebel, or the parentified child. When humans are under stress,
    it is natural to revert to old habits.


    ## Family Roles


    What was your role or function in your first groups — family, church, school,
    in the neighborhood, and so on? Did you seek the limelight to avoid it? Did you
    lead or follow? Conform or rebel? Give help or receive help? Were those early
    groups led by functional, trustworthy adults, that you could simply relax and
    be a child? Or did you try to make up for an adult’s failings — perhaps taking
    on the role of protector?


