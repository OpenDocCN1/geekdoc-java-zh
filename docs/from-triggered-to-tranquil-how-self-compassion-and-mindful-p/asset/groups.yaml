    \ place, but when a core fear gets triggered in a group (like a fear of being\
    \ rejected or controlled), then we get to witness an additional layer of your\
    \ trigger signature — feeling let down, betrayed, and disappointed by the person\
    \ who was supposed to take care of of. If you recognize this as one of your triggers,\
    \ pause now to acknowledge that you carry some vulnerability around being let\
    \ down by someone in authority. See if you can feel empathy for the part of you\
    \ sometimes feels unprotected or not taken of. If you expand your breathing to\
    \ make space for this, maybe an old memory will surface. Don't work too hard to\
    \ recall a memory. A memory will arise if your system is ready for it. If an old\
    \ memory does arise, trust your own inner rhythm of zooming (to see the memory\
    \ up close) and zooming out (to view the memory from a distance) as you connect\
    \ with it. What does this memory show you about your predisposition to feeling\
    \ safe versus unsafe in groups?\n\n## When You’re Triggered by Peers\n\nIn early\
    \ school classes, as well as in families with more than one child, comparison\
    \ and competition are common. Adults unwittingly foster insecurity in their children\
    \ by making out-loud comparisons between them. A lot of trigger reactions relate\
    \ to unfortunate experiences where we were, or thought we were, being compared\
    \ to someone else. Do you recall any painful experiences where this sort of thing\
    \ occurred? Or maybe a parent did things to set you and a sibling or cousin against\
    \ each other. If this happened in your family, you might be especially sensitive\
    \ to this sort of thing in peer-group situations. Expect to get triggered. And\
    \ be ready to pause or mark a boundary at the first sign of triggering (see “Pausing\
    \ in a Group,” pages 183-85).\n\nComparing ourselves to others and being competitive\
    \ are only two signs of reactivity. There are so many ways we can get triggered\
    \ in a group. It is also possible to get triggered only in certain types of groups\
    \ — for example, groups over a certain size, groups where we are expected to verbally\
    \ share with everyone, or groups whose task involves we’re not good at, like public\
    \ speaking. It’s good to know which types of things might trigger you, so you\
    \ can enter such a group with an extra degree of mindfulness.\n\nIf you are arouse,\
    \ you may notice that you tend to get triggered during a certain stage of a group’s\
    \ life, whether that’s the beginning, middle, or final stages. Some are more anxious\
    \ about endings. Others who get triggered early on tend to have fears about trust,\
    \ belonging, and dependency: Can this group or the leader? Do I belong? Do I have\
    \ anything in common with these people? Do I feel included and significant versus\
