    \ \n\n## Marking Boundaries in a Group\n\nIn newer groups, clear norms and boundaries\
    \ have not been established. The leader may suggest some ground rules to support\
    \ safety, honesty, and responsible communication, but it can take a while before\
    \ members consistently apply these. Even with the clearest and best guidelines,\
    \ groups of people are unpredictable. Anyone might say anything at any given moment.\
    \ And we could get triggered. We cannot prevent unwanted surprises.\n\nWhat we\
