    ## Unilateral Repair: When One Person Is Triggered


    There are situations in relationships where one person gets triggered and their
    own private reactive behavior, reactive fear, and reactive story, and all the
    while the other person has no idea this is happening. In fact, the triggered person
    might not realize they were triggered until hours later. When this happens, I
    recommend doing a unilateral repair, in which the person who was triggered acknowledges
    and apologizes for their behavior. Many people are tempted to skip this. After
    all, if the other person doesn’t know and wasn’t triggered, why does the relationship
    repair? However, when two people are in an ongoing relationship that values honesty
    and intimacy, this type of vulnerable self-disclosure helps people deep trust,
    intimacy, and self-compassion.


    In addition, if someone decides not to mention that they were triggered, there
    is the danger that they may really let go of their reactive story about their
    partner. Remember, our story is the meaning we give to triggered behavior based
    on our own insecurities. In my experience, this is what tends to happen when triggers
    do not get clear. Reactive stories reside in our long-term memory as a sort of
    magnet for other similar incidents. These build and grow if they remain unaddressed.
    And if we begin to believe our fear-based stories about our partner, we may even
    adapt our behavior to fit our distorted view. Then, one day, when we get into
    bigger disagreement with our partner, and we are both triggered, all the fear-stories
    that have been stored up come pouring out in a barrage. This is the reason unilateral
    repairs are important, since they help people avoid the buildup of negative stories
    about each other.


    Here is a hypothetical example of a married couple, Molly and Barry. Molly wishes
    Barry would spend more quality time with her. On particular day, Barry informs
    her he has to attend a work-related seminar that upcoming weekend. Molly feels
    hurt and disappointed. The fear-story that plays in her mind is: “He looks for
    excuses to get away from me.” Her childhood fear of abandonment is triggered,
    and she remembers once left at home with a babysitter while her parents took her
    other siblings on a family vacation. Molly says nothing in the moment, but an
    hour later, she approaches Barry and says, “You’re always so busy. Maybe you need
    to take a time-management course.” Barry grunts something that sounds like agreement,
    and nothing more is said about this. Then, the next day, Molly notices a vague
    feeling of discomfort and recurring fearful thoughts about whether Barry is capable
    of sustaining a long-term intimate relationship. Since Molly already knows that
    “fantizing leaving” is part of her trigger signature, she now recognizes that
    she was triggered the previous day but tried to hide it and meant something about
    a time-management course. Here’s how she clears the air and repairs this feeling
    of distance and disconnection.


    First, on her own, she fills out a unilateral repair statement (see below). Then
    she lets Barry know she wants to talk, saying, “I have some feelings to clear
    from something that happened yesterday. Is this a good time?” If he says yes,
    she reads her statement.


