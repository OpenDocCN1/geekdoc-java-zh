    This could lead into a broader discussion about how everyone has things they are
    good at and not so good at, and how hard it can be to admit weaknesses. But don''t
    initiate this discussion until you have worked with the tools in this book for
    a while and accept your own deficits. The goal is to learn to become less perfectionistic
    — to accept that we all have “growth edges,” weaknesses, and things we’re not
    good at.


    ## Exercise: Identifying Your Deficits


    Whether you are a parent or not, take some time to make a list of your personal
    strengths and weaknesses. This doesn’t need to be comprehensive; just name a few
    strengths and a few weaknesses. Then, if you are a parent, make a similar list
    of your child’s strengths and weaknesses. Then compare the lists — your own and
    your child’s — and note the similarities and differences among the strengths and
    weaknesses. Make a note where you and your child share the same weakness or you
    have a strength and your child has a deficit. These are red flags. Either of these
    two circumstances can set the stage for you, the parent, to become triggered.
    If your spouse (or the other parent) is available, include them in the exercise.


    Then choose one of the attributes flagged and do the following exercise. With
    all trigger-work exercises, begin by sitting comfortably and allowing your breathing
    to deepen. Self-calm and close your eyes if this feels right.


    - 1. Recall a specific situation when your child’s behavior seemed to be an expression
    of this deficit, or when you were triggered seeing this behavior. Bring the whole
    scene to mind.


    - 2. Allow yourself to reexperience the feelings and body sensations, recalling
    your inner and outer reactions. Notice what thoughts, self-talk, assumptions,
    judgments, worries, or fear stories arise.


    - 3. Stay with these feelings, thoughts, and sensations for a while as you expand
    your inner sense of spaciousness, making space for any uncomfortable feelings,
    sensations, or thoughts to just be there. Notice if a particular feeling or thought
    comes to the foreground. Notice if anything moves, changes, gets more intense,
    less intense, or dissolves.


    - If feelings ever get too intense, back off from being with the feelings, and
    look around the room you are in. Name and describe one or two objects in the room.


    - Notice how you, the observer, are relating to the things that are arising in
    your awareness. Are you feeling relaxed and open? Or are you more resistant toward
    your inner experience? You can tell you are resistant when there is bodily tension
    or contraction, or when thoughts are critical or judgmental.


    - If resistance comes up, see if you can embrace this resistance as a part of
    you that needs to be acknowledged. Allow yourself to become conscious about this
    resistance. Is there a body sensation or a body posture associated with the resistance?
    Allow all of this to simply present as part of your experience.


    - If resistance does not come up, or if the resistance dissolves, continue to
    whatever arises. See if any memories or associations come up. If memories from
    your own past, including your childhood, arise, hold this younger version of you
    with empathy or tenderness.


    - See if you can imagine this tender part of you needs something. What does it
    need? In your imagination, think of yourself as a big nurturing presence, and
    ask it what it needs from you. You may may not get a clear answer. This is not
    as important as the fact that you are offering supportive attention to your inner
    child, or to the part of you experiencing distress, discomfort, or shame.


    - Be with yourself for a while. Breathe fully and deeply. Feel the support of
    the chair you are sitting on. When you are ready to bring this to a close, open
    your eyes and look around, stretch, move, or get up and walk around.


    ## Connecting the Dots


    After completing this reflection, consider how the triggering kid relates to your
    own deficits or to a deficit in your own parents or your spouse. Do you find any
    similarities between one of your deficits and your kid’s triggering behavior?
    Or is there an area of life where you are especially capable and your kid is not?
    When you do this exercise, does it bring you to a place of greater acceptance
    within yourself? The goal of the exercise is to give you practice bringing spacious
