    His internal reactive story is that she’s not meeting him in the way he wants
    to be met, and maybe she never will. He replies, “That’s it? Who’s the boyfriend?
    I didn’t know she had a boyfriend. Is that new?”


    Now, Mia feels pressure in her chest and tightness in her throat. She thinks to
    herself: *He’s upset with me. What does it take to satisfy this guy?*

