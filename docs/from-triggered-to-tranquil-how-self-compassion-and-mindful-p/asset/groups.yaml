    ... been muffled by her fear of speaking up to her mother. After doing this inner
    work, she experienced a change in her relationships with men. As an adult, she
    had often been drawn to abusive relationships, but now she felt empowered to express
    her current needs and boundaries effectively, instead of being a doormat. She
    found her authentic voice rather than thinking she always had to adapt to others.


    One man found himself getting triggered when he saw TV news depicting brutality.
    He was able to process his grief about growing up with a sometimes violent father.
    As a child, he never felt safe, and much of his energy and focus had been on protecting
    himself from physical harm. Doing Compassionate Self-Inquiry, he learned to use
    his reactions to seeing violence on TV as a chance to offer empathy to himself,
    reassuring his fearful part, the part he judged as weak, that fear is a normal,
    healthy reaction to threats of physical violence—especially if you are small and
    the other person is big. Accepting his fear allowed him to develop a more realistic
    assessment of events in his life were actually dangerous, which were not. Then
    he could take action as needed or let it go when there was no real threat.


    One man found himself getting triggered during the Trump administration whenever
    Republican politicians repeat or defend falsehoods being spread by the president.
    When he explored his trigger reaction, he recalled childhood incidents where his
    alcoholic father would berate and belittle him while his mother, the enabler in
    this instance, quietly watched. After he worked with these painful memories—embracing,
    owning, and integrating both his fearful part and his inner protector—he was eventually
    able to clear the air with his parents before they died.


    In all three cases, as the individuals continued the inner work that began with
    seeing themselves getting triggered by the world situation, they developed the
    ability to speak up more effectively with others to assert their needs and values,
    call out wrong behavior, or defend their beliefs.


    ## Life Wants Us to Heal and Become Whole


    As these stories show, sometimes we need to get our buttons pushed so we can see
    where we still have some inner healing to do, so we can learn to offer acceptance
    and love to our neglected parts. Emotional pain can open the door to healing and
    effective action. When we learn to be curious and open-hearted about our trigger
    reactions, allowing our attention to follow the painful or upset feelings wherever
    this takes us, we come into a new, more compassionate relationship to our lost,
    rejected, hurting parts, and our suppressed self-expression or power. By engaging
    in this self-healing practice, we feel empowered to confront painful realities
    in the world around us rather than avoiding these out of our generalized fear
    of discomfort. We learn to embody the whole-making process that is our natural
    evolutionary destiny.


    Wholeness is where a well life and consciously lived will take us. When we live
    in harmony with the laws of life — whether we call this God, the Tao, the Divine,
    Great Spirit, True Nature, Designing Intelligence, or something else — our personal
    power gets amplified by joining forces with life’s natural laws. This may be the
    paradigm shift that is nudging us toward. What appears as a cascade of unsolvable
    problems, problems that threaten to overwhelm our capacity to cope, upon further
    examination can be the gateway to hidden potentials that naturally emerge when
    we fully face and inquire into the painful reality we thought would overwhelm
    us.


    ## The Hero’s Journey


    One lesson from ancient myths about the hero’s journey is that every human life,
    your life, has a contribution to make to the whole. In this life, slings and arrows
    will come at you. How you live your life affects the whole. The hero’s job is
    to use whatever challenges life serves to refine the inner and outer seeing and
    way of being, so that eventually each of us reaches the mountaint and sees how
    our one life is inseparable from life itself — how I am part of all, and all is
    in me. The hero achieves this by going into the underworld of the unconscious
    mind and learning how to make the unconscious consciousness.


    If your outer life gets too disconnected from the inner, or from the wholeness
    that you are part of, life will do what it does to get your attention— by creating
    painful circumstances in your outer world. Any time you get out of balance, life
    will only allow this for so long before it finds a way to restore balance. If
    you get too grandiose and self-centered (as industrialized nations have gotten
    with respect to the natural world), life will bring you down to size. If, like
    Jim, you try to be too forceful and cocky, and deny your frightened, needy, vulnerable
    side, life will present you with challenges that bring you to your knees. The
    idea here is that true strength and wisdom, the kind that enable you to cope with
    the complexity of today''s world situation, require integrated input from all
    parts of the system, including the vulnerable parts. If some parts are offline,
    repressed, suppressed, or denied, the resulting action will be less effective.


    Trigger reactions are one way life has for getting us to pay attention to what
    we have denying. So, also, are world crises. It takes a crisis to get our attention.
    It is also true that today''s problems seem so vast and complex that we instinctively
    want to look the other way. This is true whether we are talking about world problems,
    the climate crisis and poverty, or inner problems, like un trauma and emotional
    stress.


    Many people are paralyzed by one degree or another by the fear of emotional pain
    — the pain of the disallowed, neglected, frightened child inside. In my life''s
    work, I have seen real transformation in people after they do the inner work of
    healing their fear of pain (which includes the fear of feeling powerless or not
    in control). When the outer world upsets us, now life has the habit of using such
    upsets to explore our inner world, embracing and therefore *accepting* whatever
    unpleasant realities we find, now we have more internal resilience. We can bounce
    back more quickly from disappointments and upsets.

