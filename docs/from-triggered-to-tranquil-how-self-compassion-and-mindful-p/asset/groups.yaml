    ## Conclusion


    In this book, I hope I have opened your eyes to the profound benefits of trigger
    work. I hope you have seen how you can become inwardly stronger and more resilient
    by owning that you sometimes feel small and bewildered; how denying any part of
    yourself ultimately weakens you because when you try to avoid or deny a painful
    reality, that is when you lose your power to effectively deal with it.


    I hope you have seen that a good life is not necessarily a pain-free life and
    how the pain is so much easier to bear when you attend to it rather than turning
    your back on it.


    I hope you recognize blaming someone for your upset feelings prevents you from
    taking responsibility for your wounds and deficits. These wounds are a part of
    your personal hero’s journey. They are not your fault, but since they have shown
    up in your life, they are yours to deal with. A blaming attitude will prevent
    you from learning what you need to learn to heal your wounds.


    I hope you have a better understanding of how the ego-mind operates to protect
    you from things you don’t need protection from — things like uncertainty, discomfort,
    and appearing weak, needy, or imperfect — and how this part of the mind tries
    to control things you really have little or no control over. I hope you are learning
    to step back from your automatic thinking habits and to remind yourself that this
    part of the mind comes from how you learned to cope with unmet needs. It is what
    we call the conditioned mind or your conditioning. The aim of the hero''s journey
    is to get free of your childhood conditioning so you can make adult choices based
    on what is actually happening — instead of what you fear will happen because it
    happened when you were a child.


    I hope you are convinced that pausing frequently to be aware of your inner state
    is a good practice. Mindfulness breaks are beneficial even when you are not triggered,
    and they could help reduce triggering episodes. When you make pausing a part of
    your daily life, you give your nervous system time to become calm and your senses
    time to become open. The result is a more spacious and perceptive field of awareness
    — you can see more of current reality at once, and you can “see things coming.”
    Thus, you will experience fewer unwanted surprises.


    Pausing also strengthens your capacity for self-witnessing. As you take the position
    of the witness, you become less identified with the conditioned mind that tends
    to think something is wrong with you if you feel upset. From the witness perspective,
    any feeling can be welcomed and held. The witness is that big spacious presence
    that welcomes everything that''s real. It allows you to tenderly hold your pain
    while at the same time knowing that this pain is not your essential self. The
    witness allows you to experience and hold emotional pain not being identified
    with the pain.


    We live in uncertain, complex, and often overwhelming times. To cope with the
    challenges we face, humans need to develop and use more of our potential. The
    main thing holding us back from such development is our normal, but unnecessary,
    fear of discomfort or resistance to change. Development takes effort. It is uncomfortable.
    Doing trigger work teaches us not to avoid uncomfortable feelings. We learn that
    we embrace our tender pains and fears, a natural healing process is set in motion.
    This expands the size of the world we can comfortably and competently deal with.
    We discover a new relationship with the parts of ourselves we had believed were
    the cause of our distress. As it turns out, denying them was the cause of our
    distress. These are the kinds of lessons that come from doing trigger work. We
    learn that we really do have what it takes to cope with inconvenient truths and
    unwanted surprises. The world needs more of us who can help lead the way.


    ## About the Author


    Susan Campbell received her PhD in clinical psychology from University of Massachusetts
    in 1967. Since then she has been a couple therapist, relationship coach, speaker,
    workshop leader, and trainer of professional coaches. She has written eleven previous
    books on relationships. She started the couple and family therapy graduate training
    program at UMass and has been a frequent guest faculty at Harvard, Stanford, and
    UCLA.


    Susan trains coaches and therapists to integrate the tools in this book into their
    professional practices. In her own practice, she works with singles, couples,
    coworkers, and work teams, helping them communicate respectfully and responsibly
    when conflicts arise. She works from the model that all significant relationships
    can be a path for inner growth and healing. Her groundbreaking book, *The Couples
    Journey: Intimacy as a Path to Wholeness*, published in 1980, was the first popular
    book that introduced the idea of relationship as a spiritual practice into the
    mainstream.


    She is the creator and publisher of three entertaining and educational card games
    for teens, adults, couples, work teams, and singles. All of her games promote
    more authentic relating among players. Susan has appeared on numerous talk shows,
    including CNN’s News Night, Good Morning America, and The Dr. Dean Edell Show,
    and she has been published widely in popular magazines. In 2003–2004, she was
    the couple therapist on the reality TV show Truth in Love, which aired on UPN,
    an ABC affiliate network.


    Her learning/discovery approach to communication, conflict, and change is the
    subject of a twenty-minute professional training film produced and distributed
    by CRM Learning. Based on her book Chaos to Confidence: Survival Strategies for
    the New Workplace, the film and accompanying workbook are widely used by Fortune
    500 companies and government agencies. As an internationally known professional
    speaker, she speaks to corporate audiences on such topics as “Surfing Chaos,”
    “Honest Feedback in the Workplace,” “Dealing with Difficult People,” and “How
    to Build a Winning Team.” She publishes a free newsletter/blog, which you can
    subscribe to by visiting her website, www.susancampbell.com.


    Susan leads public seminars throughout the United States and Europe on such topics
    as “From Triggered to Tranquil,” “Relationship Repair,” “Getting Real,” “Conscious
    Communication,” “Truth in Dating,” “Truth at Work,” “What to Do When Love Hurts,”
