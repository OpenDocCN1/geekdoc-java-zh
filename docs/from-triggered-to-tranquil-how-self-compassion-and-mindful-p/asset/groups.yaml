    or fully appreciate how hard it is to change triggered behavior. Generally, real,
    lasting change takes work on the part of both people. Of course, asking for what
    you want, in specific, noncomplaining language, is a good thing. But expecting
    to always get what you want is unwise. The other person may wish to grant your
    request, but sometimes they are not in full conscious control of their actions.


    People have voluntary control over many of their actions, but some behaviors and
    reactions are the product of habit, personality type, childhood conditioning,
    or trigger reactions. Although we all want to be able to choose our responses
    in all instances, we will perhaps never be completely free from past conditioning.


    In my counseling sessions, people often express unrealistic expectations about
    this: A wife, Sally, will say to her husband, Rick, “When I’m upset with you,
    just validate my experience and empathy. Don’t defend yourself.” To Sally, this
    seems like a reasonable request. Indeed, Rick might agree that he should and will
    this from now on, and he may sincerely try to follow through. But even with the
    best of intentions, Rick may fail more than he succeeds — because Sally gets upset,
    Rick gets cotrigged. In his triggered state (even if he doesn’t look triggered
    to Sally) he is incapable of validating and empathizing; his good intentions get
    overpowered by the strong neurochemicals that are flooding in. Rick’s nervous
    system is in “flight” mode, his instinct is to reason with Sally in an attempt
    to get her to stop being upset.


    If Rick is to have a real change at changing his behavior, Sally has to accept
    that she can’t expect Rick to do all the work on his own. If Rick is going to
    learn to pause or slow down when he catches himself getting defensive, he needs
    her help, understanding, and support. They are going to work together to create
    what therapists call a corrective emotional experience. If Rick asks for a pause,
    instead of defending, and Sally requests reassurance, instead of criticizing,
    then this corrective emotional experience will help both of them feel safe.


