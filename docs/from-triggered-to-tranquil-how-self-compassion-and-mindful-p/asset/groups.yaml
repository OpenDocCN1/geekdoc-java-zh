    Members instinctively know when a group is operating in a healthy way. When it
    is not, certain members will act out the unconscious fears of the group — sometimes
    leading to a shared sense of unrest or chaos. If a group you are leading seems
    to be regressing in this way, that’s a signal to take a step back and invite members
    to become group observers with you. Use your authority to bring the group’s attention
    to what is happening here and now. You might suggest that everyone pause and step
    back with you, taking the posture of an observer of this group. Report what you
    are noticing and ask if others agree with something that is off. Once this is
    established, make a clear leadership statement “We cannot continue with our task
    until we sort this out, and I’m going to need your input. I request that we all
    consider together: What might be going here? Do people feel safe? Do you think
    people feel valued? Are there any unresolved issues, unrepaired triggers, or conflicts
    from the past that might be creating mistrust? Is there anything that anyone has
    noticed or felt that might be useful here?”


    The discussion that ensues may or not solve the problem. But whether it solves
    the problem or not, it is still worth doing. Even if your efforts fail, and the
    group chaos continues, doing this is part of your learning and the group’s learning.
    If you want to further enhance your learning, get some supervision from someone
    more experienced than yourself. Therapists get supervision when they need it.
    Group leaders need supervision, too.


    ## Group Debriefing, Revising, and Repairing


    There are several good ways to end a group where triggering has occurred. These
    may need to be integrated with the group’s other closure rituals or practices,
    that is, with the things this group normally does when ending. One good way to
    assess the group’s state of mind is to do rounds. Another is to ask a few specific
    questions about the triggering episode, such as the following, and request responses
    with a few of hands:


    - How many are still feeling somewhat shaken by the interaction between [whoever
    was involved]?

    - How many are feeling the need to debrief today’s meeting for a little while?

    - How many are going to seek out someone here to talk to later about what happened
    in this group?

    - How many got triggered during the group today? Of those people, how many are
    still carrying some sense of agitation and anxiety?


    If two group members had a triggering conflict that everyone witnessed, you could
    guide the pair to fill out a repair statement (see chapter 6). Adjust the script
    for your purpose or situation, and perhaps simplify to only a few sentences, for
    example:


    When I [saw, heard, did, said] __________, I was [or got] triggered.

    If I could do it over, I would tell you that my fear of was triggered, and I need
    your help to feel ________.


    Invite the protagonists to read their filled-out scripts aloud to each other in
    front of the group. As the leader, you might need to help them find the right
    words to describe their experience, and they will probably help sticking to the
    script. People unfamiliar with repair statements may revert to old communication
    habits, like trying to explain or defend themselves by telling others what they
    should have done. If this happens, you need to interrupt this — perhaps reminding
    everyone to use uncomplicated, vulnerable I-statements to avoid retriggering others.


    After this, some or all of the other group members who triggered would read their
    filled-out scripts, modifying the second sentence to read: “If I could do it over,
    I would acknowledge to myself that my fear of was triggered, and that I need to
    feel ________.” At the very end, encourage a few people to share their appreciations
    with others for something specific they have just witnessed.


    ## Repair and Closure in Other Conflict Situations


    As the leader, if you and a group member get into a conflict, you can use this
    same process for repair and closure: you both fill out a brief repair script and
    then read your scripts to each other with the group witnessing.


    If the triggering incident involved one member pushing a lot of buttons in the
    room, this needs to be handled very carefully to prevent a pile-on or scapegoating.
    In this case, I suggest asking everyone to fill out a modified repair script,
    focusing on acknowledging to themselves their trigger reactions and sensitivities.
    An example might be: “When I heard you say not now, I got triggered. It was probably
    my fear of rejection coming up. I need to feel valued and appreciated.” Then end
    by acknowledging that the group has gone through a tough experience together and
    that the task now is for each person to consider what they have learned in order
    to be more resourceful and resilient in the future.


    Some group incidents will leave hearts and fears unattended — or only partially
    attended to. Closure is not always possible. If you think some group members are
    walking away upset, consider reaching out to them afterward to offer a private
    conversation. Choose the individuals you think you are hurting the most or who
    may not have good self-regulation habits.


    My personal philosophy is “we will all die with unfinished business.” Not everything
    can be resolved to the satisfaction of all concerned. Life can be messy. In my
    situation, I am only one person. I cannot prevent every unfortunate outcome or
    make everyone happy. My job is to do the best I can in each situation that life
    presents. Sometimes I will fall short of what others expect of me. If there is
    any experience in my life that has helped me through these conclusions, it is
    my experience leading groups!


    ## Groups Are a Microcosm


    I''d like to close this chapter by emphasizing the importance of helping people
    in your groups learn to be with emotional pain and interpersonal discomfort. As
    I see things, humanity’s collective developmental task is to get better and better
    at seeing and dealing with inconvenient truths (from a dysfunctional marriage
    to the climate crisis) so we can make needed changes and continue evolve. If we
    are going to make such changes cooperatively, we need to be able to communicate
    respectfully with people who see things differently from ourselves.


    # Chapter Twelve


    ## I’m Triggered by the World Situation


    > True strength and wisdom, the kind that enables us to cope with the complexity
    of today’s world situation, require integrated input from all parts of the system,
    including the vulnerable parts.


    Our world is suffering from so many intersecting crises. We are acutely aware
    of the climate crisis, the unemployment crisis, the culture wars, the mental health
    crisis, the opioid epidemic, the homeless crisis, the refugee crisis, the hunger
    crisis, and the suicide crisis. Then there is the huge wealth gap, war or the
    threat of war, racism, climate migration, and the rise of fascism in many countries.
    In the United States, we see increasing polarization between political parties
    who advocate very different policies regarding the role of government in civil
    rights, public health, healthcare, birth control, race and gender equality, corporate
    power, food safety, environmental protection, education, and poverty. Just writing
    this paragraph, trying to use language that is as objective as possible, I can
