    ## Why Repair?


    Most intimate partners recognize the need to make up after a fight. In other types
    of relationships, people may try to “get over it” without saying much. In this
    book, I encourage you to use these practices no matter what your relationship
    status. By developing these skills, we can reduce the amount of unfinished business
    with people in our life, and perhaps avoid having friendships, partnerships, or
    dating relationships abruptly without understanding why.


    The usual way most people try to repair does not work. Their attempts involve
    too many words, too much explanation, too much trying to be heard. Instead of
    repair, what occurs is more like a clash, except with calmer voices. After a typical
    long-winded repair, people end feeling as unsafe or unheard as before. One sign
    that a repair is not working is when people start repeating themselves. If this
    happens, it means they are still triggered or have gotten triggered.


