    ## If the Other Person Is Triggered and Cannot Pause


    Sometimes, or in some situations, you will recognize the other person is triggered
    before you notice it in yourself. Maybe you are wired to react less intensely,
    or more slowly. This can be a gift to your partner and others, as it means you
    notice and halt reactivity before it escalates. In this case, give the pause signal
    yourself. You might say, “You’re triggered. We need to pause.”


    If you find yourself with someone who gets triggered and cannot or will not pause,
    try to view this as another opportunity for inner work. There is something you
    are here to learn in this relationship that may have to do with accepting that
    sometimes you may need to take a pause and remove yourself.


    Remember, some people carry so much trauma, shame, or insecurity inside their
    nervous system is perpetually on high alert. Some find it impossible to initiate
    a pause or stop reacting, matter how many times you ask. Even if you have a prior
    agreement, the other person may keep reacting (talking, arguing, trying to be
    right). If this happens, you could say, “I need to pause. I’d like to calm myself
    and come back to this later.” Ideally, you will be able to say this in a warm
    or soothing tone of voice, and might add a note of reassurance such as, “I know
    we’ll get through this,” or “I promise I’m calm.”


    If you do this consistently—initiating a pause during which you do self-calming
    practices—it will influence your relationship for the better because you are taking
    care of yourself by speaking up, maintaining a healthy boundary, and affirming
    your unwillingness to participate in unproductive and damaging behavior. People
    who tend to codependent often find this pause practice especially helpful. It
    gives them practice standing firm and setting healthy boundaries, even at the
    risk of upsetting a partner.


    When we treat ourselves in a more self-respecting way, this affects how others
    relate to us. Also, pausing and exiting the situation forces the other person
    to do something different than what they have done in the past. We can’t be sure
    how the other will use this time, but a pause means the other person cannot continue
    arguing, questioning, blaming, and so on. Maybe they will discover new resources
    within themselves for dealing with their upset feelings.


    Of course, if you are in a situation where you have made a pause agreement with
    a partner and it rarely works, you may need to accept that you do not really have
    a viable agreement. Your best option is to continue asking for a pause when you
    notice yourself or the other becoming triggered, and if the other keeps reacting,
    take a pause.


    ## Practice Pausing Before You Need It


    Learning to pause takes commitment and discipline. The best way to learn this
    practice is to make an agreement with a partner, a friend, or even a group to
    say “pause” during any conversation that gets even a little bit intense, fast-paced,
    or convoluted. It may not mean that anyone is triggered; it''s really just for
    practice. When you do this, you may find that people appreciate the opportunity
    to pause and check in the state of their nervous system from time to time, and
    they may realize they were actually triggered. Often, a person will not recognize
    when they are triggered because they have gotten to living with a certain level
    of fear or anxiety.


    This type of just-for-practice pause can be especially useful if one person speaks
    and thinks a lot faster than the other person. If this is beneficial in your primary
    partnership or in a business relationship, you might want to use a different word
    than “pause,” especially if you are also using the word “pause” to halt trigger
    reactions. I suggest phrases like “Can we slow this down?” or “I’d like to stop
    the action for a moment and check in.” These phrases can work well in both business
    and intimate relationships.


    In some of the personal growth groups and meditation groups I lead, we ring a
    little chime at random intervals or when things are getting intense. The group
    agrees to pause, get silent, and look inward whenever they hear this chime. For
    some, it is an opportunity to become calm, to relax, or to feel the ground beneath
    them. Others use the pause to check in and notice feelings and thoughts. Before
    the group interaction resumes, people often like to share what they became aware
    of during their pause.


    Aside from its usefulness as a practice for halting reactivity, inserting a pause
    as a mindfulness break at various points in your daily routine can reduce your
    stress and increase your connection to yourself and others. Too many of us go
    through our lives on autopilot, speaking and acting from habit rather than from
    authentic awareness. But if we get into the habit of quickly pausing to check
    in with ourselves every time we open our mouth to speak, it allows us to bring
    more of our whole self, more awareness of layers and nuances, into our communications
    with others.

