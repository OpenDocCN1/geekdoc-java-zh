    to figure out who got triggered first.


    Ultimately, people who give this low rating (a 1 or 2) tend to recognize that
    identifying who “started” a cotrigging incident is not the most important concern.
    However, when done for the right reasons, I believe there is nothing wrong with
    attempting to discover the origin or the larger context of a cotrigiggering incident.
    Just know that the real origin may be complex and go back a very long way.


    For some people who agree with this statement the main reason they want to unravel
    who triggered first is to show that they didn’t “start it.” Believe they will
    feel better about themselves if it’s the other person’s fault. This rarely helps
    or leads to truly feeling better. Fault-finding is often used to avoid experiencing
    one’s real feelings.


    Sometimes, examining the whole context of what happened prior to a cotrigiggering
    incident can be useful, it may involve going back in time a long way. Any important
    relationship has a history of unrepaired ruptures that are going to affect our
    present-time interactions to some degree. So it may be useful to acknowledge that
    these people shared a lot of experiences where one or both parties ended up feeling
    unfinished, unsafe, or unsatisfied. A backlog of these unrepaired ruptures can
    lead both parties to be more triggering as time goes. This is why it is difficult
    to know who started a current incident.


