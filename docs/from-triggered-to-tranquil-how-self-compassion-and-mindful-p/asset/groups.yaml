    - 10. 当有人告诉我是因为我所做的某事触发了他们的情绪时，我倾向于假设是我做错了什么，即使逻辑告诉我事实并非如此。


    要找到你的总分，请将你在每个项目旁边写的数字相加。分值在 10 到 12 分之间意味着你对情绪触发持有相当务实且接纳的态度。13 到 20 分意味着你可能对触发反应感到矛盾，并且不确定在这种情况发生时不该怎么办。20
    分以上的分表明你在应对触发反应时很挣扎；你倾向于否认、抵制，并在应对被触发时遇到困难。我讨论了这些困难的原因，但这里列出最常见的：有些人拥有处理触发反应的生活经验或技能；有些人倾向于非黑即白的思维，对模糊性的容忍度很低；有些人无法接受自己和他人的缺点。最后，如果某人正处于一段导致巨大痛苦的痛苦关系中，那么可能很难保持客观。高分也意味着某人在做测验期间被触发了情绪。


    ## 探索你的答案


    现在，让我们看看问卷中的每一个具体项目，探索各种答案揭示了个人对触发反应的什么信念。


    - 1. 如果我的伴侣因为我的一句无心之过而感到不悦，我认为我应该停止说这类的话。


    根据我的经验，不同意这一陈述的人（即为此评 1 分或 2 分）对情绪触发持有相当务实的态度。此评分较高（3 分或 4 分）可能表明他们认为触发反应总是需要被避免的。这种信念可能导致一个人把过注意力放在努力不让任何人不高兴上——因此他们如履薄冰。事实是，人们可能会被任何无意的话语触发，而对此没有人能做很多预判。你的伴侣的敏感度可能与你非常不同。是的，你可以也应该学会从自己的经验出发，并学习伴侣的爱语言（以及他们的恐惧语言！），但无论你的沟通能力有多强，触发反应仍可能发生。


    与其如履薄冰以避免说任何可能触发他人的话，不如接受人们身上带着一些他人并未察觉的情绪负担，即使是无意的、善意的话语也可能被误解。最好接受触发反应会发生，并且当它发生时，学会更早地停顿并更快地修复（如后面的章节所述）。这样，触发反应本身就不会再是一个大问题了。


    ## 2. 在一次令人不快的互动之后，当我后来意识到自己把某人的话放在了心里并反应过度时，我会花大量时间在脑海中反复思考，试图为自己为什么那样反应找理由。


    如果你给这个问题给出了高分（3 分或 4 分），希望这本书能帮助你接受我们所有人都会反应过度，而且当我们这样做时，感到愚蠢、尴尬、无所措、甚至羞耻是正常的。一旦我们学会了用一种温和、宽容的态度去关注并“接住”这些感受，这些感受就不再是一个问题了。当我们允许自己拥有这些感受，同时用慈悲的见证状态去关注它们时，就为改变创造了空间。这让曾经收缩的能量有了呼吸的空间——消散、放松或找到解决（更多信息请参阅“慈悲自我探询”，第97-103页）。


    当人们无法接受自己反应过度的事实时，他们往往会纠结于这件事，并试图找某事或某人来怪自己为什么不开心。他们可能会怪自己、怪伴侣，或者怪自己累或饿。他们可能会怪童年。试图弄清楚这给人一种控制感，但这些尝试通常阻止了更深层的治愈。它们阻碍我们触及问题的根源——而这需要与我们的情绪建立更具身体和内心的关系。


    要达到接纳，第一步是注意到你的大脑何时对一个事件反复思考——也许是在想对方应该或不应该做的事，也许是在试图为自己不开心找合理的理由。当你注意到这种反刍或感到需要为自己的行为辩护时，这是一个内在工作的良好切入点。如果你能开放并好奇你的受伤或愤怒情绪源自何。内在工作意味着与你的反应性感受在一起——就像和它们坐在一起。


    ## 3. 如果触发反应事件发生的频率超过每周一次，我认为这是功能失调的。


    对这一陈述给出高分（3 分或 4 分）的人往往对情绪不适的容忍度较低。敏感并没有错。有些人由于生活经历，已经预感到会有相当程度的心烦。遗传在这里也起了作用。早期儿童研究表明，有些人天生神经系统比较敏感。


    如果你经常被某人触发（无论是伴侣还是工作），这并不意味着关系是功能失调的。它可能意味着你对此很敏感，需要注意不要被压垮。


    ## 4. 如果我收到某人对我行为的负面反馈，并且在听到它时触发了情绪，我会试图隐藏这一点。对方可能会留下我很脆弱的印象。


    一个人对这一陈述的评分倾向于反映他们对投影形象的关注程度。关注自己的自我形象并没有错；承认这一点是好的。但如果你给出了高分（3 分或 4 分），那么探索你正在试图避免什么可能是很有用的。如果你公开承认自己被触发了，你担心会有什么负面后果？在考虑这个问题时，是否出现了一个特定的个人——一个你非常想在他面前表现良好的人？如果是，思考你在那个人面前的感受，并考虑他们是否让你想起了生命早期阶段的某个重要人物。当你年轻时，是否因为表现出软弱、过度敏感或不够完美而受到过批评？


    无论你如何评分，尝试这个伸展练习：回想一次你被某人的言语或行为触发但没有透露这一点的记忆。现在问问自己，如果你透露了自己的反应，你担心会发生什么。接下来，想象你对触发你的那个人的反应。在自己的脑海中说这些话感觉如何？你感到如释、轻盈、内在的力量吗？还是更加迟疑、道歉、羞耻？言语来得顺畅吗，还是你很难该说什么？最终，看看你在这个练习过程中发现了什么，并对自己可能产生的任何恐惧保持慈悲。

