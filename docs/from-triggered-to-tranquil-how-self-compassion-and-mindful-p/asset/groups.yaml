    and asking for your partner’s help to address that fear. It’s really important
    to accept and own up to the fact, when you are triggered, you are not able to
    see the whole picture. You may be seeing things through the lens of your insecurities,
    and sometimes you need your partner’s help.


    If you tend to deny your need for reassurance or help, then during Compassionate
    Self-Inquiry, spending some time focusing on that part of yourself. Recognize
    any fears about feeling incompetent, not enough, needy, inept, weak, not perfect,
    flawed, powerless, helpless, or dependent on someone else. Start by imagining
    this part of you as needing help but being unable to ask for it or unable to believe
    that help is available. Notice the feelings and sensations that arise. Pay attention
    to any changes you notice. Breathe deeply. Feel your own spacious presence, holding
    space for memories and associations to arise. Be curious. Ask questions of this
    part, and see what this part feels and what it needs. You might try writing an
    inner dialogue in your journal between the part of you that disains weakness and
    the part of you that needs help. This is another way to strengthen self-compassion.
    It helps you have a better, more supportive relationship with yourself. The better
    your relationship is with yourself, the better your relationships with others
    will be, and the less dependent you will be.


    ## Subliminal or Nonobvious Triggers


    Long-term intimate relationships can develop unhealthy patterns that may go unnoticed
    for many years. In addition to recognizing reactive cycles, look out for these
    less obvious bad habits.


    Intimate partners become subconsciously attuned to what pleases and displeases
    their partner. Each person feels safe when their partner is happy,

