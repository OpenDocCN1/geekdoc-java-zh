    or overwhelmed. You may also come to realize that holding space for yourself like
    this leaves you feeling softer and more forgiving afterward — so you''re in a
    more generous frame of mind when you meet with your partner to do your repair.


    After every trigger, after every pause, take yourself through the Compassionate
    Self-Inquiry practice. The first twenty or so times you do it, follow all the
    steps described in chapter 5. After that, you will probably find yourself moving
    through the steps more quickly and skipping some steps. Eventually, everything
    will go much more quickly, including the pause, self-calming, and creating a compassionate
