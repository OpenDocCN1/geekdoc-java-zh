- md: '

    Earlier, I suggested approaching intimate relationships as a practice — a path
    to inner development and healing, a psychospiritual journey. This goes for the
    parent-child relationship as much as it does for couples. But there is one big
    difference. In parenting, your child is not your equal. It is not a give-and-take
    relationship in the usual sense. It''s more like you give and the child takes.
    That''s one reason being a parent can be triggering.


    Being a parent has certain built-in dynamics that can be a setup for recurring
    trigger reactions. In working with parents and families, I have identified three
    of the most common causes of parental triggering:


    - 1. It''s not fair. What about my needs?

    - 2. My kid''s deficits trigger me.

    - 3. I don''t understand my kid.


    ## What About My Needs?


    Most people have kids before they figure out how to be a good parent to their
    own child. They still have a lot of unmet needs themselves and can become easily
    frustrated when things don''t go their way. So when they have a child, whose needs
    for attention can be quite taxing, there are plenty of opportunities for triggering.
    It''s as if hidden part of the parent is saying, *What about me?* *What about
    my needs?*


    I think this issue is much more common than parents like to admit: They''re not
    doing great at meeting their needs, and they have this little person who is constantly
    demanding attention. At first, it''s the parents'' need for sleep versus the baby''s
    need to be fed or held. Then, it''s to get things done versus the toddler''s need
    to be bathed, changed, clothed, entertained, and kept safe. Most parents expect
    it to be this way, but then it never seems to end, and it can become harder to
    accept making such sacrifices.


    If you or your spouse complain a lot, this is a sign that your own needs are not
    being met and that you are frequently in a triggered state. Complaining signals
    that we want something we''re not getting. Maybe we want more help or appreciation
    from our spouse. Maybe we just want a break or a nap. Maybe we wish our child
    was more self-reliant or not as needy. Or maybe so much of our partner’s attention
    is going into parenting that we feel neglected or left out.


    ## A Healing Exercise for Parents


    If any of these examples feel familiar to you, take a moment to reflect on how
    well your own needs are being met: your need for help, teamwork, cooperation;
    your need to feel appreciated or valued; your need to feel that you are doing
    enough or are good enough. Do any of these strike a resonant chord within you?
    If so, try this self-nurturing exercise:


    Start by focusing on a specific need or a specific memory of a time when, in your
    role as a parent, this need was not being met (such as the need to feel valued
    or appreciated). Recall a general sense of how this need feels, or bring back
    the specific memory, and notice your body sensations and feelings.


    As in the Compassionate Self-Inquiry practice (see pages 97–103), be sure you
    are breathing fully and deeply in order to support whatever feelings arise. As
    your breathing opens and becomes more spacious, take the attitude and stance of
    a big, open, nurturing presence space for feelings associated with this unmet
    need.


    Notice the body sensations of your breathing as you also welcome any other sensations
    that arise — sensations that seem to be associated with the unmet need you are
    experiencing. Allow memories or past associations to come up. You might recall
    a childhood memory where one of your developmental needs for protection, safety,
    loving attention, or support was not met. If this occurs, recall how you as that
    child felt back then; let the witnessing part of you embrace the child part. See
    if you can activate your own inner mother who can hold a nurturing, accepting
    space for whatever your inner child feels.


    Be with yourself like this for a while, as you offer comfort, tenderness, and
    empathy to the part of you that feels unmet or unsupported or to the unmet need.
    See if you can feel compassion or sorrow for yourself — for your inner child or
    for how busy or stressed out you feel. This is different from feeling sorry for
    yourself. This type of sorrow is a form of self-empathy.


    If blaming, shaming, or guilty thoughts arise, continue to witness these thoughts
    from the position of a compassionate observer. Come back to noticing feelings
    and body sensations. If tears come, allow these. Reassure yourself that your feelings
    are understandable, that it''s okay to feel this way.


    Allow these feelings to be witnessed and held for a while, as you continue to
    breathe fully and deeply. After a while, you will get a sense of relaxation and
    relief that you are not alone, and you can be there for yourself. Your external
    circumstances may remain unchanged, but your relationship to them will feel different.
    It’s as you have gotten a new perspective on your situation. You have taken one
    more step toward coming to terms with your present situation. Doing this self-compassion
    exercise repeatedly offers another step toward healing your fear or shame about
    being emotionally upset, in distress, or in pain.


    Self-compassion is the key to becoming a more genuinely loving parent. As you
    practice being generous and empathetic with yourself, your expectations of yourself,
    of your kid, and of life become more realistic — which means you no longer suffer
    when things are not the way you think they should be or could be. This is how
    you quell the inner voices that tell you something’s wrong, either with you or
    with your kid. This is how path of parenting becomes one version of the hero’s
    journey, the journey of awakening.


    ## I’m Triggered by My Kid’s Deficits


    As parents watch their children grow up, they notice the ways kids excel and the
    ways they don’t, what they prefer and what they avoid. A child might be sedentary,
    preferring screen time to outdoors. They may put on weight. They may be highly
    sensitive and have feelings easily hurt. They may have trouble cooperating with
    others and always need to get their way. Maybe a child has tantrums, or develops
    tics or stutters, or wets the bed, or is shy and afraid of risks, having trouble
    developing close friendships.


    Parents may find that certain behaviors in their kid remind them of things they
    don''t like about themselves, their spouse, or other family members. Parents might
    be reminded of their own parents and of dysfunctional behaviors they experienced.
    Many adults, for example, had parents who did not have good self-care habits or
    were immature or addicted. When parents see these things showing up in their children,
    this can be triggering.


    It can be especially difficult for a parent to watch a child growing up with the
    same self-defeating habits or weaknesses that they had or still have. Here is
    a good illustration from a family I used to know:


    One day, Steve watched the neighborhood kids getting ready for a pickup softball
    game. His ten-year-old son, Tommy, was among waiting to be picked for a team.
    As sides were being chosen by the two captains, it was obvious to Steve that neither
    side was eager to have frail, unathletic Tommy on their team. As Tommy tried to
    hold back his tears, Steve gave his son an encouragement. But deep inside, Steve''s
    own shame was triggered, since he felt a core fear of not being enough. As a kid,
    Steve felt weak, unathletic, and lacking in confidence, and this feeling continued
    into adulthood. Now, as a parent, he was doing his best to make sure Tommy did
    not suffer through adolescence as he had. Steve watched the game unfold, he did
    not want to feel shame about his son, but he couldn''t help it. Whenever he saw
    (as Steve himself sometimes did), Steve would get triggered. Whenever he saw Tommy
    making careless mistakes that showed he was not really paying attention, Steve
    would get triggered — even though, once again, he knew this was one of his weaknesses.


    If you get triggered by something in your kid reminds you of one of your own deficits,
    this can be the starting point for some useful self-inquiry and healing. It might
    even provide an opening toward deeper communication with your child, depending
    on your child''s intellectual and emotional maturity.


    If your child has a fairly good emotional vocabulary and is over the age of ten,
    I recommend that you have an open discussion with the child about your triggers
    and insecurities or about your strengths and weaknesses.

