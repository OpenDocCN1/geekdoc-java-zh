    ## Chapter Four


    ## Pausing to Regulate Yourself


    ## Restoring an Inner Sense of Safety


    Pausing is important because it stops you from doing or saying things that might
    escalate a conflict, retraumatize yourself or another person, or cause some other
    kind of harm.


    A trigger reaction can be like a runaway freight train. Once it is set in motion,
    it is not easy to stop. Without the ability to put on the brakes, it can do a
    lot of damage. So we need to develop our inner braking system, which includes
    noticing one or more aspects of our trigger signature and stopping whatever we
    are doing, and even what we''re thinking, right away. This is not easy. It takes
    practice. And in the beginning you will probably fail to stop soon enough more
    often than you will succeed.


    Pausing is important because it stops you from doing or saying things that might
    escalate a conflict, retraumatize yourself or another person, or cause some other
    kind of harm. Remember, when our animal instincts take over, anything goes. We
    may react to harsh voice tones or insensitive words as if the other person were
    an enemy who was attacking us. People who go into a blind rage have been triggered,
    and no good ever comes from such a state.


    The other reason to pause is because it helps you develop voluntary control over
    your internal reactive states. You learn to insert a conscious choice into what
    otherwise would be an automatic sequence of primitive behaviors (fight, flight,
    or freeze). With practice, you can learn to interrupt your animal instincts. This
    allows you to slow everything down to consciously breathe more slowly and to quiet
    your racing thoughts.


    Stopping is difficult at first because the neurochemical reactions that get triggered
    in the nervous system have tremendous force and power. These reactions are part
    of our original physical survival mechanism. They override and overpower your
    ability to reason, to weigh options, to think things through.


    How can we learn to pause—we we slow down our runaway reactions? We learn through
    conscious effort and through believing we can. In the Five Steps of Trigger, pausing
    to self-regulate is the third step. The exercises in this chapter help you to
    practice pausing and calming, but the other exercises in this book are part of
    this work, too. The more you accept and learn to recognize triggers, the easier
    it is to pause, and after you get calm, you can discover the greater rewards in
    store (as later chapters show).


    ## What Does It Mean to Pause?


    Mastering the art of pausing involves noticing that one of your early warning
    signs is happening, and then, without thinking much about it, you stop what you
    are doing. You might silently say “pause” or create some other signal that reminds
    you to stop reacting. This “other signal” could be a different word, perhaps one
    that has always signaled safety for you, or maybe you can use a physical gesture
    for your wake-up call — like touching the body part where you notice reactive
    sensations or putting your hand over your mouth as a reminder to shut up.


    Make an agreement with yourself to use this signal at the first sign of reactivity.
    Even if you miss the first sign, and reactivity goes on for a while, pause as
    soon as you can. Late is better than never. Late is actually the best most people
    can accomplish.


    Most of the time, trigger reactions occur in the presence of another person, so
    it can also be helpful to make a pause agreement with others. Ideally, you and
    this other person would discuss the value of pausing when triggered and come to
    a mutual agreement that if either person uses a pause — whether that the word
    “pause” or something else — both people will stop what they are doing and saying.
    No explanation needed; everything stops. Of course, successfully pausing in the
    middle of an argument is it lot easier if both people have already agreed to this.


