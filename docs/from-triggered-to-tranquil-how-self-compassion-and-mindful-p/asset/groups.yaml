    physical body was violated or you experienced physical aggression (like someone
    hitting you) or when you feared for you (or someone else''s) physical safety.
    This exercise is meant to be something you can do safely without a therapist or
    coach, don''t pick something that was deeply traumatic or likely to trigger intense
    feelings.


