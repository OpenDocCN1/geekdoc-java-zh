    \n## 在修复期间寻求帮助\n\n如果你在与伴侣见面之前已经完成了之前的所有步骤并填写了修复声明，你的修复将会进展顺利。如果修复进展不顺利，可能是因为你尚未掌握一个或多个更早的步骤。通常，接受步骤是最难掌握的。如果你对接受触发源于你自己的伤害、创伤或未完成的事宜产生抵触，你仍然抱着一个指责的故事，或者一个认为伴侣应该或可以表现不同的故事。你的焦点将放在对方没有做的事情上，对话将陷入寻找错误的动态。当这种情况发生时，停下来，给自己一些温柔。意识到要感受自己的不悦并接受触发的发生（以及它让你感到受伤、愤怒或不安全）是非常困难的。人类的自我大脑似乎沉迷于寻找理由和做出判断，因此仅仅感受我们所感受到的，而不让我们的思绪介入让事情复杂化，并不容易。\n\
    \n修复声明让你练习承认某个核心恐惧被触发了，并请求伴侣的帮助来应对这种恐惧。接受并承认事实非常重要：当你被触发时，你无法看到全貌。你可能正在通过不安全感的滤镜来看问题，有时你需要伴侣的帮助。\n\
    \n如果你倾向于否认对安慰或帮助的需求，那么在慈悲自我查询期间，花些时间关注自己的这部分。承认任何关于感到无能、不足、需要、笨拙、软弱、不完美、有缺陷、无力、无助或依赖他人的恐惧。从想象你的这部分需要帮助但无法开口，或无法相信帮助是可能的开始。注意由此产生的感受和身体感觉。关注你观察到的任何变化。深呼吸。感受自己开阔的存在，为记忆和联想的出现留空间。保持好奇。向这个部分提问，看看这个部分感觉什么、需要什么。你可以尝试在日记中写下你的软弱的部分与需要帮助的部分之间的内在对话。这是加强自慈悲的另一种方式。它帮助你与自己建立更好、更有支持的关系。你与自己的关系越好，你与别人的关系就会越好，你对他人的依赖也会越少。\n\
    \n## 潜意识或不明显的触发因素\n\n长期的亲密关系可能会产生许多多年未被察觉的不健康模式。除了识别反应循环，还要留意这些不明显的坏习惯。\n\n亲密伴侣会潜意识地适应什么会让伴侣感到愉悦或不悦。当伴侣快乐时，每个人都会感到安全，\n\
    \n"
