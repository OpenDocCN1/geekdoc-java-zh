    ## Inner Work: Approaching Life as a Practice


    Trigger reactions help us see where our childhood unfinished business is. Underneath
    such reactions are buried fears and buried pain that need attention and tenderness.
    Sometimes there are feelings we never felt safe to feel or attachment needs we
    never felt safe to express.


    I have always liked the phrase “daily life as spiritual practice.” This phrase
    reminds me that we can approach everything that happens in life as an opportunity
    for inner work — for developing an identity to include not just our self-interest
    but “the good of the whole.” For me, personally, this inner work has taken the
    form of noticing whenever I feel resistance to what is. Resistance to what is
    almost always indicates some fear of emotional discomfort. This is a type of trigger
    reaction. When I notice my resistance, I take this as a sign that there is inside
    me some buried pain, unhealed wound, or developmental deficit that I have not
    fully owned, accepted, embraced, and loved. Like most people, I instinctively
    resist having to face and deal with feelings or fears that are uncomfortable.
    So the only thing that gets me to look into uncomfortable areas is my commitment
    to “life as a practice.”


    # Fear of Being Weak or Needy


    As children, we may have been criticized or shamed when we expressed our tears,
    fears, hurts, or needs. Maybe we were laughed at or ridiculed. Maybe we were told
    it''s wrong to be selfish or weak. Maybe someone labeled us too sensitive or too
    emotional. Our ordinary upsets or concerns may make adults uncomfortable, perhaps
    triggering their own fears if their child was unhappy or imperfect, this meant
    they were not a good enough parent. Such common parental fears and self-doubts
    can spill out their children — creating the impression in the child’s mind that
    If I am in need or in pain, no one wants to be around me or people get upset.
    Maybe I''m bad or wrong when I feel such things.


    Pause now as you''re reading this. Does any of this apply to you? Allow yourself
    some space to experience whatever feelings, sensations, memories, or thoughts
    may be arising in you. Personally, as I was writing these about parents being
    anxious around children’s upset feelings, I felt sadness and a slight achy sensation
    in my chest. I know that this was true of my parents, especially my father.


    Whatever you notice arising in you, see if you can welcome this and embrace it.
    By allowing yourself to feel something that was not allowed in the past, you take
    a small step toward inner healing. You begin the process of reclaiming your lost,
    rejected, or abandoned parts.


    # Childhood Attachment Needs


    In order to develop into a fully functioning, securely attached adult, certain
    childhood needs must be met. Almost everyone experiences some frustration of these
    needs.


    During infancy, children need touch, eye contact, and soothing voice tones from
    their caregivers. Children need to be picked up and lovingly held when they are
    distressed. This is called coregulation. We never outgrow this need for coregulation,
    but in infancy, we need it for our survival and for the proper development of
    our nervous systems.


    All children need to feel safe and protected from physical and emotional harm.
    Did you feel protected as a child? Or were you often left to deal with scary or
    dangerous things on your own? Was your parents’ behaviors sometimes frightening
    to you? Do you recall holding you and comforting you while you cried? Was there
    a trusted adult that you ran to for safety or comfort when you were afraid? Pause
    now reflect on these questions. Notice any body sensations, feelings, or thoughts
    that come up. Consider how you feel what you notice. For example, if you notice
    feelings of sadness about something you recall, how do you feel noticing your
    sadness? Can you accept that you felt this way, or do you judge yourself? There
    is no right or wrong answer to any of these questions. The idea is to be curious
    and to improve your ability to uncover hidden feelings.


    All children need loving attention. Children need to feel loved, cherished, and
    valued. They need quality time with a parent who gives them undivided attention,
    both notice if the child seems distressed and to listen to the child and show
    interest in what the child is interested in. Did you feel loved in this way? Did
    your parents seem to enjoy spending time with you? did they spend time with you,
    but their attention was divided, giving you the impression that they were just
    putting in their time without having a genuine interest in you? Pause now to reflect
    on these questions. Notice any body sensations, feelings, or thoughts that come
    up, and notice how you feel about what you notice.


    All children need support. Children need adults to show them how to do things,
    like throwing a ball or swimming. They need help patience, learning that sometimes
    you have to apply effort for a long time before you enjoy rewarding results. They
    need learning how to communicate and put their feelings into words. They also
    need the space to new things on their own, learning on protected, pounding a nail
    with a hammer — without the adult taking over. They need guidance, but they also
    need to be trusted to do things without undue interference. How was your childhood
