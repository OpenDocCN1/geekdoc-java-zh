    This simple sentence helps couples remember that they have been through a lot,
    and they are still together.


    For any type of pause to be successful, both partners need to have some competence
    with the entire trigger-work curriculum, all five steps described in part 1. This
    includes the following:


    - You both accept that triggering happens;

    - you can identify your own and your partner’s trigger signature and your reactive
    cycle;

    - you can notice your reactive stories, core attachment fears, and needs;

    - you have mastered one or two self-calming practices;

    - you have learned to practice Compassionate Self-Inquiry;

    - you know how to fill out and deliver a repair statement; and you know how to
    offer the kind of reassurance that addresses your partner’s core fear and core
    need. Becoming familiar with this while sequence reinforces your faith in the
    pause practice — because you know there are constructive things you can do after
    the pause to restore connection and safety.


    Further, both partners understand that the pause is never used to avoid discussing
    something. You agree that you will always check in each other at the agreed-upon
    time to see if you are ready to do your repair. After a successful repair, you
    then decide on a time when you will get back to the discussion that was underway
    when the triggering happened. Don’t ever try to do problem-solving about the issue
    at hand (whether that’s money, sex, or the kids) when triggered or while you are
    in the repair step. Partners need to feel calm, safe, and openhearted before they
    can collaborate and resolve issues. For that, you need to have your higher brain
    capacities for cooperation and empathic listening. Remember, triggering hijacks
    your higher brain capacities. No brain, no gain.


    ## During Your Individual Pause Time


    At the start of a pause, even though you may have already done deep breaths with
    your partner, you will probably need to continue with a breathing or a body-awareness
    practice to fully calm your activated nervous system. You may notice your mind
    fixing on what happened, what was done to you, what should or shouldn’t have been
    said or done, or on justifying why you are upset, angry, or disappointed. The
    goal during a pause is to discover and utilize the best practices that help you
    let go of, or step back from, such ruminating. With a little practice, you can
    learn to intentionally focus your attention to the sensations of your breathing
    or the sensations of being held by the chair you are sitting in. It might take
    a while for your mind to let go of the need to be right, validated, or agreed
    with. Even if the mind is active, you can still experience the calming effect
    of conscious breathing. Try counting your breaths, saying silently to yourself
    something like "Inhale, two, three, four, rest. Exhale, two, three, four, five,
    six, rest." Thoughts may persist in the background, but you will find your body
    becoming settled and relaxed.


    It can be useful to observe the mind’s chatter as you continue your breathing
    practice during a pause. Notice, for example, how the mind will think things:
    This is a waste of time. This is not getting any closer to resolving your issue.
    Why couldn''t you just remember to call the plumber? I can''t do this anymore.
    Watching your thoughts like this is very beneficial. The more you practice noticing
    your thoughts, the easier it will be to hold a compassionate space for yourself
    during a pause.


    As you practice watching your thoughts, you''ll probably notice various thinking
    habits, like judging, comparing, blaming, trying to be right, or divining your
    partner’s motives. These habits disconnect you from the deeper feelings and needs
    inside of you. These deeper, more vulnerable, feelings, and needs must be attended
    to if healing is to occur.


