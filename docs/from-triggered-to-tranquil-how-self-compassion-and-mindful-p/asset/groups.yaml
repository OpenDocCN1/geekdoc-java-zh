    comfortable, feel in control, or be validated? In my book Getting Real (about
    how to express your authentic self), I raise this same important question, which
    I frame slightly differently: “Is the intent of your communication to *relate*
    (to know and be known, which can be risky and leads to growth) or to *control*
    (to manage and minimize discomfort, which is the default position for most people)?


    In any situation you are triggered by a friend, you might also consider two other
    questions: Can my nervous system handle it if this trigger keeps coming up in
    this relationship? And does my friend value *relating* as a path? To answer the
    first question, reflect on your past experience: Is it retraumatizing to you when
    things like “feeling unimportant” occur? Do you take a long time to recover? To
    answer the second question, assuming your friend is someone you''d like to relate
    to more deeply, I suggest asking: Do they value using relationship upsets as opportunities
    to work with and trigger reactions, and do they have the inner resilience to do
    this? In other words, can they bounce after an upsetting conversation? Can they
    handle hearing that you are displeased with something they''ve done?


    A friendship where two people view their relationship as a growth practice can
    offer the same opportunity for healing childhood wounds that a marriage can. The
    trigger-work tools can be helpful in any type of relationship. In most friendships,
    the two people are not as interdependent as marriage partners (they don''t live
    together or have kids together), so generally, they should expect to have fewer
    conflicts. But sometimes, a friend will come along really pushes our buttons.
    Since there is less at stake, it may be less stressful to work with one’s triggers
    in this type of relationship.


    On the other hand, having less at stake means people are not as motivated to stick
    it out. It is easier to back away from a friendship than to end a marriage. If
    you try using these tools with a friend, and you find this relationship is too
    hard on your nervous system, it is really okay to back away or redefine the terms
    of the relationship. It''s okay to admit there is a limit to the amount of emotional
    intensity you want to deal with. People vary a bit in how much interpersonal intensity
    they prefer and how much they can tolerate. If you consider yourself a lightweight,
    in the ring with a heavyweight, I,'
  - '[PAGE 141]


    myself, am a bit of a lightweight in comparison to some of my friends. I think
    it''s better to admit this than to live in constant stress. It''s okay to break
    off friendships or limit them to certain lengths of time or certain activities.
    But don''t blame the other person if this is your choice. This is part of the
    inner work of acceptance, which is to grow beyond blaming mindset. Sometimes,
    you may wish to engage in the level of assertiveness that a particular relationship
    requires.


    If you want to invite a friend to treat your friendship as a process for learning,
    growth, and deeper relating, here''s how you might get the conversation started.
    Saying something like “I’ve been on a path to uncover and learn to work with my
    emotional triggers. My friendships are one place my triggers show up. You''re
    a good friend, so I want to ask you if you''d like to create some mutual agreements
    to notice and reveal when we get triggered, and maybe to even repair or clear
    the air afterwards. This way, we both learn about ourselves and grow together,
    and we don''t build up hurts or resentments. Is this something you might want,
    and do you have any questions?


    If the friend agrees, perhaps they read this book, particularly part 1, so they
    understand the repair process as well as you do. If you and your friend decide
    to move in this direction, expect a lot of trial and error at first, you might
    also want to read one of my other books that discuss triggers and relationships:
    *Getting Real (2001), Saying What’s Real* and *Five-Minute Relationship Repair
    (2015)*.


    # Avoiding Retraumatization


    When deciding how to handle friendships that are triggering, be honest and compassionate
    with yourself, and make choices that avoid retraumatization. In this book, I suggest
    approaching daily life as a practice, which includes friendships. By “practice,”
    I mean approaching what shows up in your life with an attitude of mild compassion
    so that you learn to accept and be with unpleasant feelings. The aim is to become
    inwardly stronger and calmer so you can face life’s challenges with more courage
    and equanimity. But don’t push yourself too hard as you are learning to do this.'
