    It probably originated in some earlier experience of neglect, trauma, abuse, or
    faulty learning. The person who has just triggered us did not cause our sensitivity
    to feeling hurt or slight in this way. That sensitivity was already there — as
    a result of unfortunate early learning experiences that occurred long before we
    met this person.


    Brain science explains reactivity in terms of how the brain is wired. The human
    brain has a lot in common with the brains of other animals. Our brains are equipped
    with what neuro-psychologists call the survival alarm system. Part of this system
    is a tiny pair of structures deep inside the'
