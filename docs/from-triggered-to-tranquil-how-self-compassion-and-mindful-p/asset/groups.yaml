    ## Exercise: Compassionate Self-Inquiry


    The next step toward trigger mastery is learning how to work with a trigger reaction
    immediately after it occurs (or even while it is occurring). The Compassionate
    Self-Inquiry practice involves spending a little time being with the sensations,
    feelings, and fear-stories that have just been triggered. This involves noticing
    the various elements of your reactive experience (sensations, feelings, thoughts),
    and allowing these to be seen, felt, or attended to. When you first begin practicing
    this, the whole process may take about fifteen minutes. Later on, it will take
    less time, until finally, you may be able to accomplish all the steps in less
    than one minute.


    ## The Basic Practice


    Immediately or soon after you experience a triggering event with another person,
    find a safe location in which you can be alone and uninterrupted for as long as
    you think you will need. This may not always be possible right away, but do it
    as soon as you can. If you have a pause agreement with someone, this is what you
    would do during the pause.


    Once you are in a safe space, practice self-calming. Close your eyes, and take
    ten or more slowing breaths through your nose. As you exhale, focus on relaxing
    the body and letting go of mental stories or attempts to figure out anything.
    Notice the sensations of the chair holding you. Feel where your body touches the
    chair. As you feel these sensations, continue with slow, conscious breathing.
    When you feel relaxed, note how this feels, and remember, you can always come
    back to this place whenever things get too intense — during this practice or in
    your life.


    When you feel calm and safe, while still breathing fully and deeply, recall the
    triggering event: Where were you? Who was with you? What was said, done, or not
    done? Was there a gesture or a tone of voice that you reacted to? As you do this,
    take the viewpoint of the witness. Watch this event unfold with an attitude of
    openness, acceptance, and curiosity. If your mind starts to spin stories, explanations,
    or interpretations about the event, put these aside for now. At this point, you
    are building your inner capacity for recalling and witnessing feelings and sensations.


    Next, consider your reaction in this triggering episode: What did you feel? What
    body sensations occurred? Did you say anything, or was your reaction mostly internal?
    Allow these feelings and sensations to come back. Let yourself feel these feelings,
    but this time, feel them with the support of your slow, conscious breathing, and
    with your inner witness available.


    Sit with whatever feelings and sensations arise and let them be just as they are.
    Be interested or curious about them — as if these are aspects of yourself you
    wish to become more deeply acquainted. As you observe your feelings, also notice
    this whole scene — notice your reactions to the triggering event as well as how
    it is to witness this. Is it difficult or painful? Does it feel supportive and
    nurturing to be with with yourself in this way? Continue holding a nurturing,
    curious space for as long as you want or need, but don''t be too quick to end
    the exercise. Your feelings or sensations may change quite a bit — in shape, location,
    temperature, weight — as you sit with them. Let this happen on its own. Let things
    move and change as they will. Doing this teaches you to trust your own process
    of working through difficult emotions. Every individual does this in their own
    unique way — for some, their inquiry is like a straight line, moving quickly from
    here to there. For others, the route is more circuitous, moving more slowly or
    with more side excursions; “Exploring Deeper Feelings and Memories” (pages 100–102).
    Then, when you feel ready, you can move to “Closing the Exercise” (pages 102–3).


    ## Return to Self-Calming If You Feel Overwhelmed


    If you ever start to feel overwhelmed with the intensity of a feeling or memory,
    back off from this and return to your self-calming practice. Just notice the movement
    of your chest and belly as you breathe in and out. If you still feel overwhelmed
    or afraid, open your eyes and look around the room. Focus your attention on one
    object and describe its physical attributes (for example, “I see a green leather
    chair with little wheels on each of its four legs”). Then notice how you feel.
    If you feel calm and clear-minded, continue the exercise.


    If not, take a break and do something else that feels nurturing — like listening
    to music or taking a walk. Another option is to get a blanket and wrap yourself
    in it as a way of giving comfort to yourself. Or just lie down with a blanket
    or a pillow. Putting the palm of your hand directly on top of where your body
    senses, feel the warmth of your palm radiating into your body. Rocking, patting,
    touching, and stroking yourself are all ways to show caring and nurturing toward
    yourself.


