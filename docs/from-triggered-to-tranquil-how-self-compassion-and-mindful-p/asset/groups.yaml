  - '[PAGE 149]


    reaction — one other group members could observe? Or was your reaction solely
    internal, such as silently judging the leader? Recall as much as you can, and
    go slowly through this memory. Then notice: How do you feel now as you replay
    the scene in your mind with your observing self actively witnessing Be with this
    for a while. Notice if your triggered self worried about how you were seen or
    whether you were judged. Was your triggered self worried about other group members''
    opinions or the leader''s? Did you expect the leader to do more to protect you?


    Expecting a leader to protect us (based on a fear of being unprotected) is an
    extremely common trigger. This may not even be triggered us in the first place,
    but when a core fear gets triggered in a group (like a fear of being rejected
    or controlled), then we get to witness an additional layer of your trigger signature
    — feeling let down, betrayed, and disappointed by the person who was supposed
    to take care of. If you recognize this as one of your triggers, pause now to acknowledge
    that you carry some vulnerability around being let down by someone in authority.
    See if you can feel empathy for the part of you sometimes feels unprotected or
    not taken of. If you expand your breathing to make space for this, maybe an old
    memory will surface. Don''t work too hard to recall a memory. A memory will arise
    if your system is ready for it. If an old memory does arise, trust your own inner
    rhythm of zooming (to see the memory up close) and zooming out (to view the memory
    from a distance) as you connect with it. What does this memory show you about
    your predisposition to feeling safe versus unsafe in groups?


    # When You’re Triggered by Peers


    In early school classes, as well as in families with more than one child, comparison
    and competition are common. Adults unwittingly foster insecurity in their children
    by making out-loud comparisons between them. A lot of trigger reactions relate
    to unfortunate experiences where we were, or thought we were, being compared to
    someone else. Do you recall any painful experiences where this sort of thing occurred?
    Or maybe a parent did things to set you and a sibling or cousin against each other.
    If'
  - '[PAGE 150]


    this happened in your family, you might be especially sensitive to this sort of
    thing in peer-group situations. Expect to get triggered. And be ready to pause
    or mark a boundary at the first sign of triggering (see “Pausing in a Group,”
    pages 183-85).


    Comparing ourselves to others and being competitive are only two signs of reactivity.
    There are so many ways we can get triggered in a group. It is also possible to
    get triggered only in certain types of groups — for example, groups over a certain
    size, groups where we are expected to verbally share with everyone, or groups
    whose task involves we’re not good at, like public speaking. It’s good to know
    which types of things might trigger you, so you can enter such a group with an
    extra degree of mindfulness.


    If you are arouse, you may notice that you tend to get triggered during a certain
    stage of a group’s life, whether that’s the beginning, middle, or final stages.
    Some are more anxious about endings. Others who get triggered early on tend to
    have fears about trust, belonging, and dependency: Can this group or the leader?
    Do I belong? Do I have anything in common with these people? Do I feel included
    and significant versus invisible or ignored? Will I be protected?


    People who get triggered toward the middle stages of a group often fear that their
    unique voice or way of being will not be accepted. They worry about there will
    be enough airtime for them to be heard. They may watch the clock to see if some
    members get a longer turn to talk than they get. They may notice other group dynamics,
    as if the men are doing all the talking and the women are most silent. People
    in this category often mistrust authority. They often get triggered by the designated
    leader or by any member who asserts leadership or initiative. They may fear that
    if another group takes control, this diminishes them — as it shows weakness to
    be a follower.


    People who get triggered toward the final stages of the group (in groups with
    a definite ending) tend to have triggers related to loss of connection, abandonment,
    or being alone. These are also the members who, at the final meeting of the group,
    will suggest that everyone stays in touch or perhaps have a reunion in six months.
    Having a certain type of trigger, such as abandonment, can lead someone to develop
    certain predictable personality patterns designed to manage this fear. I call
    these control patterns (which I'
  - '[PAGE 151]


    discuss extensively in my other books). A control pattern is a personality habit
    (usually unconscious, from choice) that functions to stave off the experience
    of being triggered. So if you have a fear of abandonment, you may try to organize
    a group reunion for a future date so you''ll know that the last group session
    is not a final goodbye.


    # Pausing in a Group


    Some group leaders may be sophisticated enough to introduce the idea of the pause
    agreement at the beginning of a new group. Most will not. If you have enough confidence,
    consider proposing this as a member. A pause agreement in a group is similar to
    the one used in a couple or friend relationship: If anyone notices themselves
    getting triggered, they say the word “pause,” or use some other pause signal,
    and everyone stops talking and practices some form of self-calming or grounding
    for a minute or two. After the pause, the group will resume whatever it was, including
    sharing feelings and self-talk if this is part of the group contract. After a
    pause, the person who got triggered may not be ready for the group’s attention
    right away, they will need to communicate this, asking the group to carry on while
    they continue to practice self-calming.


    In groups, reactivity goes on for a while, and most of the group members can become
    triggered without necessarily conscious of it. Witnessing two other group members
    in a heated conflict can be triggering the whole group because members become
    “wired together” similar to couples. The group has a shared reality and a shared
    destiny, and its functionality affects everyone. If two group members (or two
    subgroups) are at odds, this affects everyone’s ability to get their needs met.
    The same is true of a couple system, a family system, an organizational system,
    a governance system, and even a planetary system. Keep this in mind so you can
    become a more astute observer and a responsible participant in the systems you
    belong to.


    It’s impossible to prepare for every possible group situation, but here are a
    few more generous suggestions for what to do when you need a pause: If you’re
    just beginning to get uncomfortable, and you’re not yet triggered, you can slow
    down by saying, “I need a few minutes to think about that.”'
  - '[PAGE 152]


    you are already triggered, and you don’t want to disrupt the group, you might
    say, “I’m taking a brief break, but I’ll be back.” If you need someone to quickly
    back off, and they have no sophistication regarding the concept of triggers or
    the idea of pausing, you may need to say something stronger, like “I want to hear
    what you’re saying, but I’m getting upset. I need a break to calm myself.” In
    all these examples, because the speaker is communicating responsibly and not blaming
    anyone, these statements are likely to be met with acceptance.


    # Marking Boundaries in a Group


    In newer groups, clear norms and boundaries have not been established yet. The
    leader may suggest some ground rules to support safety, honesty, and responsible
    communication, but it can take a while before members consistently apply these
    guidelines. Even with the clearest and best guidelines, groups of people are unpredictable.
    Anyone might say anything at any given moment. And we could get triggered. We
    cannot prevent unwanted surprises.


    What we do is ask the group in advance to respect a particular boundary, one related
    to our triggers or trauma. We could ask, for example, that people refrain from
    certain behaviors or language, such as entering without knocking, shouting up
    close, making sexual jokes, using profanity, or using racial or ethnic slurs.
    We can also specify pronoun we prefer. Ideally, the leader would invite everyone
    in the group to request such things up front, but if not, we we interrupt the
    group’s activity to make our request. If you do this, make sure you have already
    done the inner work to accept your triggers and know your trigger signature.


    Making this request does not guarantee your boundaries won’t get challenged, however.
    Be prepared to speak up as soon as you can if someone says something that threatens
    to retraumatize you. If you’re already triggered, you’ll need to pause first.
    This is often handled by pausing silently by yourself calling for a group pause.
    However, if you’re not triggered yet, but know it’s likely, you could speak to
    the group and say something like “I need to mark a boundary here. I have a sensitivity
    to hearing about sexual violence, so I am going to exit for a while.”'
- md: '

    Most groups will respect requests like this, but perhaps not uniformly. In any
    group of diverse individuals, not everyone may be equally accepting of trigger
    sensitivities. I, personally, have great respect for people who take risks like
    this to ask for what they want, because this is how group cultures change for
    the better. When individuals speak about their uniquely personal needs and boundaries,
    this is how a group learns to embrace more diversity, to be more responsive to
    differing needs.


    ## Task or Work Groups


    Social groups and groups devoted to personal growth often welcome discussions
    of personal boundaries and emotional sensitivities. But in most business or community
    settings, group norms usually do not encourage this much emotional self-disclosure.
    In one of these settings, if you get triggered or start to get retraumatized,
    you may need to take a bathroom break. Taking a silent pause in your seat can
    also work, unless you feel the need to be alone.


    In general, the goal is to know and respect your own limits and be prepared to
    assert your needs and boundaries anywhere and everywhere, even if this is not
    the norm for a particular group. The more you have done the work of self-acceptance
    and self-compassion, the more effective you will be at getting your voice heard
    when you make such requests. In doing so, you become an inspiration for others
    who are less courageous, showing them the way toward self-care. Even if the norm
    in the group is “we don''t talk about feelings,” you don''t always have to conform.
    For example, in a one-person group I was facilitating, one of the participants
    asked for what she considered to be “special treatment.” She said: “I feel shy
    asking for this, but I request that during sessions and during the breaks you
    do not touch or elbow me without asking. I carry some old trauma around my physical
    boundaries being violated against my will… Thanks for listening, and I’m glad
    I felt comfortable enough here to say this.” In this instance, the request was
    related to a childhood trauma in an obvious way, and group members were happy
    to comply.


    In other instances, your own version of “special treatment” could be something
    unrelated to triggers or trauma, such as asking for more frequent bathroom breaks
    or asking that people speak more loudly so you can hear them. Even though these
    sorts of things don''t seem connected to getting triggered, if you do not ask,
    you could find yourself getting triggered later because the group is not attending
    to your needs.


    ## Self-Inquiry in Groups


    In most groups, the whole group is not going to stop what it''s doing while you
    process your personal trigger reaction. The important thing is that you recognize
    you have been triggered (because you know your trigger signature and your reaction
    patterns related to groups). When you notice some aspect of your trigger signature,
    silently begin your pause practice, followed by holding a compassionate state
    for your feelings. Support this with conscious, deep breathing. In a group, you
    might not be able to do much, if any, self-inquiry. You may need to put that on
    until you get home and are in a safe and quiet location. When you do get home
    (or a quiet place), come back to being with your tender feelings. Spend some time
    attending to the feelings that were triggered in the meeting or group. This does
    not mean you should crank up these feelings or intensify them. Simply allow them,
    and watch them change, flow, expand, contract, or get stuck somewhere. Don''t
    worry if you don''t experience resolution or closure. Just being with yourself
    like this is valuable in itself.


    ## Repair in Groups


    If “got into it” with someone after becoming triggered in a group, the whole group
    will have been affected. When this happens, it''s a good idea to do some sort
    of public repair. The best option is doing this face-to-face (either in person
    or via video conferencing), but second best is to do this via group text or email.
    After you have calmed yourself, have gotten over your fear-story or any blaming,
    and have successfully restored a sense of safety, fill out your repair statement
    (as in chapter 6). Depending on the timing, your public repair might occur during
    that same meeting or you may have to wait until the next time this group meets.
    Most often, people wait until the next meeting. In that case, tell the group ahead
    of that you''d like to put something on the agenda: You''d like to bring them
    up to date on the trigger incident they witnessed last time. Then you could address
    the person you were in conflict with, or you could address the group as a whole.
    You might not want to read your entire repair statement, so modify it to fit your
    situation.


    Here are two examples of how you might modify the repair script. The first is
    addressed to the other person involved in the incident:


    “I’d like to apologize for what I said last week to you, Viv. I realized later
    I was triggered, so I was not thinking straight. I’m sorry. I carry some old trauma
    around my physical boundaries being violated against my will… Thanks for listening,
    and I’m glad I felt comfortable enough here to say this.”


    The second is addressed to the group as a whole:


    “I noticed that I was triggered during our last session, and I want to apologize
    for how that affected the group. I''m working on processing it, but I wanted to
    be transparent with you all so we can move forward together.”


    In other instances, your own version of “special treatment” could be something
    unrelated to triggers or trauma, such as asking for more frequent bathroom breaks
    or asking that people speak more loudly so you can hear them. Even though these
    sorts of things don''t seem connected to getting triggered, if you do not ask,
    you could find yourself getting triggered later because the group is not attending
    to your needs.

