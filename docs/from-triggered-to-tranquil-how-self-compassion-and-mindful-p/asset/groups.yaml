    ## Chapter Nine

    ## I’m Triggered with My Friend


    A friendship where two people view their relationship as a growth practice can
    offer the same opportunity for healing childhood wounds that a marriage can can.


    Any close friendships have a sibling dynamic — characterized by rivalry, comparison,
    or competition. Some have the same pursuer-pursued dynamic as occurs in intimate
    couples. But even in less complicated friendships styles, when there is a difference
    in needs, values, expectations, or personality styles, triggering often happens.


    Sharon and Taylor were meeting at a cafe for lunch. As soon as they sat down,
    Taylor started complaining about some difficulties she was having with another
    friend, whom Sharon didn’t know. Sharon pretended to be interested, but she was
    really feeling disappointed that Taylor seemed more interested in this other friend
    than her. Even as their conversation moved on other topics, Sharon was not very
    present. After they said goodbye, Sharon realized she had been triggered the whole
    time. She had gone into a mini-freeze reaction, where words continued to come
    out of her mouth, and her face continued to smile at appropriate times, but she
    was clearly not all there.


    When she got home and paused to feel her feelings more fully, she realized that
    her fear of being invisible or unimportant had been triggered. When she took time
    to do the Compassionate Self-Inquiry practice, she connected with a familiar feeling
    from childhood. She remembered several occasions when she had expressed a desire
    or an opinion, hoping to get a caring response from her older brother or mother.
    But instead, they often responded with something completely unrelated to what
    Sharon said, leaving her with a sense of being invisible. This happened often
    enough that she developed a core fear of insignificant, invisible, unimportant.
    She learned to deal with this unconscious fear by shutting down and shutting up,
    becoming even more invisible — to herself as well as to others.


    ## Choosing How to Respond to a Friend


    If you were Sharon, what might you do or say about this incident with your friend?
    Would you confront Taylor about how insensitive she can be sometimes? Would you
