    it signals there is something incomplete in our development or some aspect of
    that is being denied, repressed, rejected, or disowned. In other words, even though
    we did not cause the triggering event, it is ours to deal with every time it appears.
    It is our responsibility to find a way to restore a sense of safety and equilibrium
    to our dysregulated nervous system. Intellectual acceptance of this idea is not
    so hard. But when we find ourselves behaving in a way we''re not proud of, shame
    can come up ... or the impulse to blame.


    Acceptance requires admitting our insecurities — because it is mainly our childhood
    insecurities that make us vulnerable to emotional dysregulation, to those fight,
    flight, or freeze reactions that most of us are familiar with. Childhood insecurities
    may include things like fears of not being enough or being flawed, unimportant,
    insignificant, unworthy, helpless, alone, disregarded, overwhelmed, trapped, controlled,
