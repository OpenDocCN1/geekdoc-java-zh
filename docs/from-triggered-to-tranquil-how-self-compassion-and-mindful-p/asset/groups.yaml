    ## Relationship as a Practice


    An intimate partnership is a breeding ground for triggers. Because of this, it
    is also the best context for healing childhood wounds or trauma. I suggest viewing
    the relationship as a practice. This means that, as in practices like meditation,
    I expect to encounter discomfort. You know effort and self-discipline are required.
    Rather than respond with dismay or shock, you welcome unexpected challenges for
    what they can teach you. Also like meditation, you know experienced teachers can
    show you where to put your efforts so they bear the most fruit. This chapter will
    show you how to maximize your learning and sustain your efforts.


    ## Seven


    The phenomenon of cotrigging presents a serious dilemma for couples. Just when
    your partner needs you the most, that is when you are least present. Triggers,
    or the reactive behaviors and stories that arise around triggers, are the biggest
    impediment to trust and respect. But when you know how to work with reactivity
    and repair quickly.


    Part 1 of this book outlines the basics of how to work with triggers. This chapter
    covers some of the issues that apply specifically to couples.


    ## Cotrigigger: We Are Wired Together


    Every couple operates as a biological “herd of two.” In the animal kingdom, members
    of a herd depend on one another for survival, so they instinctively react when
    any member of the herd seems to be in danger. In a herd of gazelles, for example,
    if one gazelle senses danger and is triggered to run (choosing flight in the fight-flight-freeze
    response), the whole herd will get cotrigged and start running in the direction.

