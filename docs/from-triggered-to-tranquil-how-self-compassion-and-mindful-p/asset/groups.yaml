    ## Judgmental Thoughts


    Some trigger reactions are easy to notice in ourselves and in others feelings
    like anger, resentment, and rage. Others are harder to see in others, but fairly
    easy to notice in ourselves — feelings like hurt, sadness, fear, overwhelm, hopelessness.
    And some are not obvious to ourselves — at least, we don’t normally think of these
    as signs of being triggered. In this category are things like having judgmental
    thoughts or imagining how someone could have or should have behaved. For some
    people, having judgmental thoughts seems so natural to their personality that
    they would not categorize this as evidence of being triggered. But I do. I have
    seen enough during my fifty-five years in this profession to recognize how often
    people think they are behaving rationally — that their judgments, stories, or
    interpretations are true or right — when they are actually not seeing the situation
    clearly because of their triggers. They are viewing “what is” through the lens
    of one of their core fears, and they don''t even realize they have this core fear.
    Being judgmental toward others as a characteristic stance in life is a good way
    to avoid facing one''s own insecurities.


    Treating judgmental thoughts as part of a trigger signature does not necessarily
    mean that the criticisms are wrong. For instance, in Karen''s case, her judgment
    that Tim was too permissive with Lindsay might be accurate most of the time. This
    may be one of Tim''s personality deficits. But Karen''s judgment is still connected
    to her trigger reaction. She experiences inner pain about Tim''s permissiveness
    because of the meaning she gives to his behavior. By being permissive, Tim seems
    to value Lindsay''s needs over Karen''s needs, which is why she believes “I am
    not a priority.” In other words, Karen''s judgment reflects her core fear of not
    being important and her core need to feel included in decisions, that is, to feel
    like a priority.


    In many instances, a critical or judgmental thought arises when we are not feeling
    emotionally safe in some way, when we feel that one of our core attachment needs
    is not being met. So our judgment or criticism is a reactive behavior. The other
    person''s behavior has set off this reaction in us. Often we won''t notice the
    emotional reaction underneath our judgmental thought. We may be too caught up
    in our own fear-story (“I’m not a priority.”). Our inner “noticer” doesn’t function
    when we get triggered. But if we pause and get calm, we can intentionally activate
    our noticer. Then we will see that there is a core fear that needs our compassion.


    ## Distinguishing Intuition from Fear


    Trigger reactions can be cloaked in seemingly rational garb. What if your intuition
    tells you that your romantic partner is having an affair? Say, because your partner
    comes home later than expected some evening. If you already know that part of
    your trigger signature is a core fear of abandonment, how do you process this?
    Should you trust your intuition or treat this feeling as a trigger reaction? The
    answer is: When your emotional safety is threatened, before focusing on getting
    "facts" (grilling your partner over why they were late, and so), focus first on
    any reactive feelings that may be underneath the need to know the truth. Pause
    to notice things like disappointment, hurt feelings, or feeling not valued or
    important. Notice memories of or associations to similar feelings in the past.
    Allow space for whatever feelings or memories arise. Let yourself feel soft and
    tender towards this part of yourself, fearful or hurting part.


    Once you have connected deeply with yourself in this way, then you are in a more
    openhearted frame of mind, ready to have a conversation with your partner about
    what happened. In order to openly your partner’s account, you need to first attend
    to any fears that have come into you. But for the purpose of knowing your trigger
    signature, it''s enough to name your reactive behavior, your reactive feelings
    and body sensations, your reactive story (or fear-story), your core fear, and
    your core need. This will help you recognize the possibility that what feels like
    your intuition might just be your fear-story instead.


    ## Mia and John: How to Discover One’s Trigger Signature


    Illustrate how to identify a trigger signature, here is a hypothetical example
    based on real clients I have worked with.


    Mia and John have been dating for six months. They live in different cities, some
    distance from each other, so they only see each other one week out of every month.
    In between their in-person visits, they talk daily over Zoom or Face-Time. They
    have an agreement to be sexually monogamous. One of the issues they keep bumping
    up against is that John likes to report in detail his activities during the weeks
    they are apart, and he also wants Mia to share at this level of detail. This helps
    him feel secure. John grew up with a mother who had a habit of going silent for
    days if she was unhappy with something he did or said. This felt to young John
    as if he were being abandoned. Not knowing what was going on for his mother, and
    suspecting she was holding a grudge against him, he would feel helpless and out
    of control. John’s former girlfriend also had a quiet, somewhat secretive, nature.
    She wound up having a secret affair, which led to the ending of that relationship.
    Thus, John carries a fear of abandonment into his relationship with Mia. That’s
    his core fear and primary trigger — fear of being abandoned, of someone becoming
    quiet and cutting off the connection he depends on to feel safe. If he is aware
    of his sensitivity regarding silence and secrecy, he can bring a healthy dose
    of skepticism to “Intuitions” he may have that his girlfriend is keeping secrets
    or having an affair. He knows this could be his fear talking, rather than his
    intuition.


    Mia isn’t comfortable sharing her daily activities in as much detail as John wants.
    Her communication style is more private, less verbally fluent. She learned as
    a child that the more she shared honestly about her activities, the more disapproval
    she got. Mia recalls telling her mother about her social or romantic life a few
