    ## Resistance Is Normal


    Even though the word triggered is now part of our vocabulary, most people still
    have difficulty accepting full ownership of the fact that when we get emotionally
    reactive, this arises from our own inner world. If someone else''s words trigger
    feelings of insecurity or pain, this pain was already inside waiting to be activated.
    Even if we intellectually accept this, we may still have some emotional resistance.


    Here are the three most common emotional blocks to such acceptance:


    - 1. Shame — the belief that if I get triggered, this means I am flawed, that
    there is something deeply wrong with me.

    - 2. Mistrust — the fear that if I own my reactions as “mine,” and become more
    forgiving of the person whose behavior triggered me, this gives the other person
    a free pass, and they don’t have to mend their ways.

    - 3. Protecting one’s parents — the need to view one’s childhood as happy and
    the need to view one’s parents as good.


    ## Shame


    The roots of shame could be childhood abuse or neglect, such as when a child thinks,
    If this person could treat me like this, I must be worthless. It could be a painful
    public failure experience, in which the child feels not good enough or ashamed
    because they did not. It could be the consistent childhood experience of being
    overcontrolled, so that the child assumes, I am not allowed to have a sovereign
    self. I do not matter, I have no worth. It could stem from having something horrible
    or from committing a horrible act (even accidentally). Whatever the source, shame
    makes us want to hide, not be seen, even though we may have an equally strong
    need to be seen at other times. The antidote for shame is self-compassion — the
    ability to activate the innate healing power of our “good mother archetype,” the
    part of the human unconscious that is instinctively nurturing and unconditionally
    loving. The exercise “Being with Sensations and Emotions” (page 20) will show
    you how to access your inner “good mother.”


    ## Mistrust


    In working with couples, I sometimes hear one partner protesting, “Why should
    I be the one to change? Why should I have to be the grown-up? This will just make
    it easier for my partner to keep being immature and selfish. Or maybe my partner
    will use my admission of my insecurities as ammunition against me by telling me
    later how insecure I am.” Usually, when a person says this type of thing, they
    are afraid of being hurt. They believe they have tried being “the grown-up” in
    the past, and this has not been appreciated or recognized by their partner. Or
    they believe they tried being vulnerable, and this has come back to them later
    in the form of criticism. So they are not willing to do any more inner work. They
