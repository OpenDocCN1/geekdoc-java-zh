    Whether or not other feelings or earlier memories surface, allow yourself to feel
    whatever comes up. You might even have things you wish to express out loud. Let
    yourself speak, shout, or if you are moved to imagine speaking to the other person
    involved in the triggering incident, saying out loud whatever comes to you. If
    you feel moved to, speak soothing words to your tender, vulnerable self (or your
