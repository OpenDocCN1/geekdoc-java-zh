    The other common resistance to pausing is not wanting to stop the conversation.
    Couples may believe that, even though they know they are getting triggered, they
    can still temper their reactions enough to resolve the issue. Generally, this
    is a mistake. With enough practice, your ability and willingness to pause will
    improve. It all starts with a clear and realistic agreement. Don''t expect instant
    success, and don''t abandon the practice after a few failures. There is a learning
    curve involved.


    What does a pause agreement consist of? It is relatively simple and involves four
    steps:


    - 1. Together, you pick a word or short phrase that will be your pause signal,
    such as “pause,” “whoa,” “time-out,” or “uh-oh.”

    - 2. You both agree that if either person says this phrase, you will immediately
    stop talking or doing you’re doing. Then you will both sit quietly and take about
    ten slow, conscious breaths, after which you decide whether your pause time should
    be short (ten to fifteen minutes), medium (one to three hours), or long (three
    to eight hours).

