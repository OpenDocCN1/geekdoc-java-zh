  mdcn: "\n\n起初，你可能并意识不到自己何时被触发了——尤其是当你的反应性主要发生在内心，且对他人来说是不可见的。内在的或隐形的触发反应包括：对他人产生评判性的想法、对他人的动机做出假设、大脑一片空白，或害怕发声。随着你完成书中的练习，你将逐渐提高自己承认并接纳自己有时会被触发的能力。\n\
    \n## 2. 学习你独特的触发特征\n\n你的字迹有其独特的视觉特征和触感。它可能很小而局促，也可能大而粗犷，或者介于两者之间。同样，你大多数的触发反应看起来都有些相似，并且都源于核心恐惧（如害怕被拒绝、被遗弃、自己不够好、不被听见等）。我们的触发特征是我们依恋风格的体现。如果我们具有焦虑型/焦虑型依恋风格，当我们被触发时更有可能去追逐、挑剔、质问、争论、挑战或攻击。如果我们具有更多回避型的依恋风格，在被触发时则会试图关闭、退缩、防御、沉默解释或试图解决问题。了解你独特的触发特征有助于你快速识别自己正被触发的事实。这是迈向掌握触发的大一步。\n\
    \n然而，我想澄清，我使用“焦虑型”或“回避型”等标签，我的意图是提供一个可能观察行为模式的视角。就像不存在纯粹的类型一样，没有任何人的依恋风格是纯粹的回避型、焦虑型甚至是安全的。所有的行为模式都落在连续谱的某一点。因此，例如，某人的行为可能表现出某种程度的回避风格或某种程度的安全风格。在阅读过程中，请记住，类型和风格不是绝对的，它们描述的是倾向。\n\
    \n某些回避型的人很难察觉自己的触发敏感性，因为他们只有在别人对他们生气时，他们才会被触发。他们可能认为自己是他人触发的受害者，例如：“如果他没有被触发，我就没事了。”对于这些人来说，他们的核心恐惧或无意识的不安全感可能被深埋，，以至于需要一次“爆发”（例如一个反应极激烈或令人沮丧的伴侣）才能挖掘出他们隐藏的恐惧。也许他们经历的发展性创伤/忽视发生在他获得语言之前，或在开始记忆事物之前。被轻微忽视的孩子往往会成长为非常有智慧、自力更生的人，他们对他人没有太大期待。他们可能还具有适应性强或讨好的性格。这些性格保护了他们，让他们不会像可能会那样感到同样的失望或沮丧。他们的依赖需求需要被压抑，因此他们可能无法意识到在他们活跃且平和的性格结构之下，隐藏着未被满足的需求。因此，他们可能一生都无法意识到自己的需求没有得到满足——因为很久以前他们就习惯了不对他人抱太大期待。\n\
    \n当你开始识别自己的触发反应看起来是什么样、感觉如何时，你已经具备了一些能力去注意到并承担“自己有时会被触发”这一事实。这是承认和接纳步骤的一部分。在产生反应的过程中*察觉*到触发反应并不是容易的！当你被触发时，你的察觉能力往往会“离线”。这正是你需要练习“停顿”的原因。这是下一步。\n\
    \n## 3. 停顿以自我调节\n\n停顿需要你注意到自己正在表现出触发特征的某个方面（如争论或防御自己），并停止它。你可以对自己说或大声说“暂停”。有些伴侣会达成“停顿协议”，这样当任何一方说“暂停”时，双方都会停止说话，并静静地通过鼻子进行十次意识呼吸。\n\
    \n自我调节涉及将注意力转向内在并平静你的神经系统，如深呼吸或其他意识练习。这一步是你针对反应性的急救措施。它是生活中基本的压力管理工具之一。我希望更多的小学能教这些，但学习这些永远不为晚。当然，挑战在于学会在生活中压力最大的环境之一做到这一点——被一个对我们重要的人所触发。\n\
    \n## 4. 与感官和情绪共处\n\n一旦学会了有意识地关注自己的呼吸和身体，你会发现更容易注意到自己的感觉和情绪——喉咙的紧张、内心的疼痛、悲伤、恐惧或无助感。这一步涉及站在“见证者”或“观察者”的位置——注意到呼吸的吸入和呼出；注意到感受、感觉、图像、记忆和脑中的杂念；观察这些内部印象进入和离开你的意识领域；观察它们质量或强度的变化；观察它们在你身体不同位置的移动。作为观察者，你的注意力集中在被见证的感受上——所以你既是拥有感觉或情绪的人，也是见证自己产生感觉或情绪的人。这好比你的意识同时有两个视角。这使你能够为自己留空间，安慰自己。这种双重意识也是与自己建立更亲密、友好关系的基础。当你学会如何与自己相处时，你永远不必感到孤独。\n\
    \n## 5. 修复与消除隔阂\n\n如果在与他人的互动过程中发生了触发反应（即使是细微的反应，如退缩或僵结），之后找这个人来重新建立连接、修复伤害、道歉或重新开始会有帮助。这一步并不适用于所有情况，因为通常需要他人的同意或许可。有时你可能不会使用这一步。\n\
    \n如果触发行为发生在伴侣、密友或孩子身上，那么修复是必要的。在其他情况下，修复方式取决于关系——人们有多亲近，以及关系有多重要。\n\n通常，这一步涉及设定约定的修复时间，一旦时间到达，你将会：\n\
    1) 承认被触发了；\n2) 在适当的情况下道歉；\n3) 揭示情绪根源；\n4) 请求连接或安慰。\n\n修复看起来像是：“我刚才离开时，我被触发了。我很抱歉那样做。那是我的恐惧在作祟，好像我的需求并不重要。如果可以重来，如果我能告诉你我内心的真实想法，我希望能够得到‘我们没事，你的需求很重要’的安慰。”\n\
    \n这五个步骤虽然每个都有自己的练习，但也是相互依赖的——因此，一个领域的进步将导致所有领域的进步。例如，你越擅长给予自己慈悲，就越容易接受自己会被触发。或者，你越快能执行停顿，修复步骤就越容易，因为你阻止了自己说伤人的话，从而减少了需要修复的“伤害”。\n\
    \n 第二章：承认并接纳你的不安全感\n\n超越羞耻与责备\n\n当触发发生时，谁都没有错。没有人选择让自己受自己或他人的原始大脑布线的支配。\n\n当你被触发时，你并不是处于最佳状态。你可能会感到受挫、震惊或失去控制。你看起来可能很愚蠢、冲动、防御性或不理性。你的应对能力受到了损害——所以难怪当这种情况发生时你可能难以接受这一点。正如任何治疗师或改变推动者所说，我们需要身所在，才能到达我们想去的地方。\n\
    \n"
