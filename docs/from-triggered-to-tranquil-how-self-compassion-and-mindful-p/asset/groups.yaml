    The final aspect of the agreement is to decide how long to pause before verbally
    connect again. How long will it take for everyone to become calm and openhearted
    to engage in a repair? In a dyad or two-person relationship, like an intimate
    couple, the best practice involves a two-stage process. First, when someone gives
    the pause signal, both people stop talking and take ten slow breaths. Assuming,
    the ten breaths have helped, you consider whether the pause should be short (to
    fifteen minutes), medium (one to three hours), or long (to eight hours). If the
    pause is going to be fifteen minutes or more, people will generally move to different
