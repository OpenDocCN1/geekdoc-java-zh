    The essential goal of these practices is to learn to feel painful or uncomfortable
    feelings and sensations while also compassionately witnessing them. It''s like
    the bigger you is feeling empathy for a vulnerable, tender, or younger part of
    you. In the Compassion for Your Inner Child exercise, as you review what happened
    to this tender part of you, you may have seen why the event in question was so
    upsetting or scary to the younger you. If you felt empathy, your tender self now
    has a lot more support than it once had. You are developing a new, more supportive
    relationship with yourself. You are activating your inner good parent, your good
    mother archetype, your inner protector.


    Everyone has inside of their psyche template for being a good parent. Everyone
    knows what feels good, beneficial, healthy, loving, and what does not. It''s true
    that your ability to easily access this inner good parent may have been eclipsed
    by unfortunate childhood experiences, but I assure you, the good parent or good
    mother archetype is part of every human''s potential. Sometimes, we first need
    to activate the intent to uncover this hidden resource.


    ## Resistance Is Part of the Process


    In doing these practices, you might notice a tendency to shut down before really
    feeling everything. For instance, you might find yourself analyzing why something
    happened rather than feeling what happened. This sort of resistance to uncomfortable
    feelings is a normal part of the process. It could be something you learned to
    do back in childhood to protect yourself. You learned to abort the process of
    experiencing feelings by going into your head instead. Just go as far as you can
    with this exercise, encouraging the hurting or upset part of yourself to feel
    and express your hurt, knowing that the adult you is witnessing this with acceptance
    and compassion. It is actually better to do these practices in small doses rather
    than trying to keep deeper in one sitting.


    In particular, the Compassionate Self-Inquiry exercise again and again — with
    the same or different triggering incidents. It takes many repetitions to unlearn
    conditioned habits for avoiding emotional discomfort. Life gives us the opportunity
    to revisit our core fears again and again, until we have fully felt in a conscious,
    self-loving way everything we have left to feel.


    Some people ask what to do if they have a judgmental or contemptuous attitude
    toward their triggered self. What if you don''t like the wounded part of yourself?
    What if you view this part as evidence that you are unlovable? What if you think
    you should be more together or should be over it by? If this happens for you,
    notice this, and notice what you feel about this. How do you feel about the fact
    that you get impatient with yourself? If a child was crying in fear or pain, and
    a parent told the child to grow up or get it over, what might you feel? Is your
    relationship to yourself similar to this impatient parent? Notice how you feel
    about how you treat yourself. If you feel sadness, this is probably a good start.
    This may be the beginning of a softer, more empathetic attitude toward the vulnerable
    or triggered parts of yourself.


    ## Keep Practicing Being with Sensations and Emotions


    Do not expect to get over your trigger reactions right away. Some may never go
    away completely. But if you do this practice regularly, you will not be so quick
    to become reactive. All the pausing and being with that you are doing will help
    you slow down your automatic reactions, allowing you to bring more awareness and
    insight to whatever is happening. At first, just accept that your core feelings
    and needs will be hidden from view when you experience a trigger reaction, and
    that you will have a tendency to react from fear rather than acting from conscious
    choice. Learn to pause and self-calm as soon as you notice reactivity. During
    your pause, practice Compassionate Self-Inquiry. This is preparation for the repair
    process (see chapter 6), or if repair is not indicated or appropriate, it is preparation
    for getting back to being your best, most resourceful self.


    Even if you do the Compassionate Self-Inquiry hours or even days after an incident,
    it will work. Every time you do it, you are taking a step toward healing old hurts
    and completing your past, allowing long-suppressed feelings and sensations to
    be metabolized. In the past, you may have had to shut down painful or fearful
    feelings because it wasn''t safe or you didn''t have enough support. So they never
    got to resolve themselves through the natural healing-by-feeling process. Now
    you have more inner resources to bring to the matter. You are learning to create
    a safe container for your core needs to be felt and attended to. Now your feelings
    and unmet needs for love and safety have room to move. In time, as you learn to
    be with uncomfortable feelings, you will be able to easily allow upset feelings
    to change and transform inside you.


