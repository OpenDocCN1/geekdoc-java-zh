- md: "\nthe idea of the group pause: If anyone feels stressed or triggered or thinks\
    \ someone might be — whether this seems obvious or not — they say the word “pause”\
    \ or “time-out” or some other easy-to-remember signal. Some groups have a nonverbal\
    \ hand-raising signal or a bell or chime for this purpose. If anyone gives this\
    \ signal, everyone stops talking and brings their attention inward to their body\
    \ sensations and breathing, with the aim of becoming more relaxed, grounded, and\
    \ present. If you wish, explain that the ability to self-regulate is necessary\
    \ for most group endeavors, whether the endeavor is a design problem or an intimacy\
    \ game. Also add that in groups, if one member gets triggered, other members will\
    \ sense this and they may become triggered themselves, or at least distracted.\
    \ The reason for becoming aware of triggers and pausing is that all members can\
    \ be mentally present for the task at hand. When there is unacknowledged triggering\
    \ going on, communication can become untrustworthy. \n\nThe method I use when\
    \ I lead Honesty Salons — which focus on communicating with self-awareness — is\
    \ to give everyone in the group a four-inch round toy button. I tell them, “We\
    \ have all buttons, or the potential for getting our buttons pushed.” One of my\
    \ goals is to help people accept this fact with more ease, tenderness, self-compassion,\
    \ and humor. Then I explain: “If you get your button pushed or become triggered\
    \ during the group, hold up your button so everyone can see it. We will all take\
    \ a brief pause for four or five slow, deep breaths. During this pause, each of\
    \ us should notice if we ourselves are also triggered or in need of a pause.”\
    \ Any item, such as a pen, can also be used as a signal.\n\n# How to Facilitate\
    \ a Group Pause\n\nThere are different ways to deal with trigger reactions, depending\
    \ on the setting, the leadership model you are using, the group purpose, and the\
    \ group's stage of development. But if you put in place an explicit agreement\
    \ with a group, your job will be easier. Here are two common scenarios and how\
    \ to handle them: first when someone is triggered and asks for a pause, and second\
    \ when someone is triggered but doesn't say anything.\n\nIf a member gets triggered\
    \ and says “pause,” make sure everyone is quiet for four to ten breaths. After\
    \ the silence, invite some general group sharing about how each person is feeling.\
    \ This sharing is aimed at the group, not at the person who said “pause,” and\
    \ it is not meant as an invitation to discuss what happened, but simply a quick\
    \ indication of each member’s current state. This is similar to doing rounds (see\
    \ “Other Helpful Devices”) below.\n\nThen ask the person who said “pause” if they\
    \ need anything, or if they would prefer the group move on so they can do some\
    \ inner inquiry or self-soothing on their own. In general, as a group leader,\
    \ I do not usually help the person process their trigger reaction in the group\
    \ unless the group is explicitly a person workshop where this is part of the contract.\
    \ When I choose to help the person, I guide them in the Compassionate Self-Inquiry\
    \ practice, often inviting everyone else in the group to do their own inquiry\
    \ silently. However, whether you decide to spend time helping the triggered person\
    \ get calm and clear or, at some point, you need to move the group’s attention\
    \ away from this. At an appropriate moment, ask if everyone is ready to move on,\
    \ and if they are, tell those who might have more to share that they can do so\
    \ later. Provide time at the end of the meeting for debriefing, closure, revising,\
    \ or repairing with those who want this, whatever terms are appropriate for your\
    \ aims and the group culture.\n\nIn the second common scenario, a member will\
    \ get triggered, shut down or freeze, and no one will call for a pause. The moment\
    \ you notice someone is triggered, say something to normalize or show acceptance\
    \ for their reaction, say “It is understandable that some people might be triggered\
    \ hearing this,” or “I believe there are some trigger reactions in the room.”\
    \ Then call for a group pause, and maybe guide a brief self-calming or self-compassion\
    \ practice — modified to fit your group’s needs and norms. After this, invite\
    \ general group sharing as above — using whichever tools are appropriate for your\
    \ situation.\n\n# Other Helpful Devices\n\nHere are some other helpful devices\
    \ for groups. These devices enhance everyone’s ability to be present, authentic,\
    \ or self-aware. When members are aware and present, the group will experience\
    \ less frustration and fewer triggering episodes.\n\n# I Feel / Period Cards:\
    \ A device I use in the Honesty Salon is to give everyone an 8.5-by-11-inch card.\
    \ One side of the card has the phrase “I feel …” and the other side has the word\
    \ “Period.” The “I feel …” side of the card is used when a person is talking,\
    \ and someone else in the group thinks the talker may have gone away from their\
    \ present felt experience and begun intellectualizing, generalizing, or rehashing\
    \ a familiar story. The listener then holds up the “I feel …” so the person talking\
    \ can see it. This prompts the talker to check in themselves to notice feelings\
