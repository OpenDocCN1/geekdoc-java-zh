    # Chapter Two


    # Admitting and Accepting Your Insecurities


    # Getting Beyond Shame and Blame


    When triggering happens, no one is to blame. No one chooses to feel at the mercy
    of their own or another person’s primitive brain wiring.


    When you are triggered, you are not the best version of yourself. You may feel
    hurt, shocked, or out of control. You might appear foolish, impulsive, defensive,
    or irrational. Your ability to cope is compromised — so it’s no wonder you might
    trouble accepting this when it happens. As any therapist or change agent would
    say, we need to be where we are to get where we want to go. In other words, positive
    change requires fully owning, feeling, getting to know, and taking responsibility
    for where we are right now in our growth journey. If there are parts of ourselves
    that we are denying or repressing, these parts won’t heal until we see and accept
    them. They won’t be able to find their rightful relationship with the healthier
    aspects of our being because there is no'
