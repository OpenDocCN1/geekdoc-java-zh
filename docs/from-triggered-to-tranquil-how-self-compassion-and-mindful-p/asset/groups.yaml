    system (such as a person, group, or organization) is good communication between
    the subparts of that system.


    Some people have an easier time than others accepting the fact that they get triggered.
    You will discover your own personal degree of resistance versus acceptance as
    you work through the exercises in this book. If your self-image can accommodate
    making mistakes, making amends, looking foolish or inept in the eyes of others,
    and not knowing the right thing to do, then you will probably have an easier time
    accepting your trigger reactions. If your self-image has little tolerance for
    mistakes, weaknesses, or imperfections, you''ll probably find it hard to accept
    that you get triggered. But in any case, the insecurities that give rise to self-judgment
    and perfectionism can be healed.


    Whether you place more value on learning from mistakes needing to be right and
    looking good depends on what felt safe versus unsafe you were growing up, or your
    personality was being formed. Your value stance (learning versus looking good)
    will gradually change as you work through the exercises in this book. When you
    make your primary value, life gets a lot easier ... and friendlier.


    These exercises will also help you learn to recognize the subtle signs that indicate
    you and others are triggered. People do not always get loud or argumentative when
    they are triggered. Reactivity is often mostly internal — like having suspicious
    or judgmental thoughts.


    Trigger reactions arise from feeling emotionally unsafe or unable to cope. We
    unconsciously associate what is happening now with something that happened a long
    time ago — that felt unsafe or overwhelming — with respect to our developmental
    needs, like the need to feel valued, respected, protected, cared for, attended
    to, and important. Then we react with some version of upset, ranging from exploding
    to shutting down to projecting negative motives onto others (such as, “He''s using
    me,” “She''s controlling me,” and so on). All of these reactions occur below the
    level of conscious awareness. People can feel unsafe without being aware of it.


    If you are already aware that sometimes you do not feel safe or capable, then
    you are on your way to accepting that sometimes you get triggered. Obviously,
    it''s better to feel safe than unsafe, and it helps to have personal practices
    to quickly restore your sense of emotional safety after any upsetting event. When
    we feel safe, we can see more of what''s really going on. We make decisions based
    on our authentic needs, like the need to feel respected or trusted, rather than
    on conditioned habits like defensiveness or self-protection. This is the ultimate
    goal of this inner work: making good decisions that come from the higher brain
    versus the primitive lizard brain. Let''s start this journey toward good decision-making
    by taking an honest, compassionate look at our insecurities.


    ## Admitting Insecurities


