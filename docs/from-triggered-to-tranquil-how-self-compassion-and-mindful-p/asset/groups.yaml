    \ brain, no gain）。\n\n 在个人暂停时间内\n\n在暂停开始时，尽管你可能已经和伴侣一起深呼吸，但你可能需要继续进行呼吸或身体感知练习，以完全平复你被激活的神经系统。你可能会发现自己的大脑在纠结于发生的事情、别人对你做了什么、应该或不应该说什么或做些什么，或者在为自己为何感到不悦、愤怒或失望寻找理由。暂停期间的目标是发现并利用那些帮助你放下或远离此类反思的最佳实践。通过一点练习，你可以学会有意识地将注意力集中在呼吸的感受或坐在椅子上的身体感受上。大脑要放下对“必须是对的”、“获得认可”或“被认同”的需求可能需要一段时间。即使大脑很活跃，你仍然可以体验到意识呼吸带来的冷静效果。尝试数呼吸，在心里默默说诸如“吸气，二、三、四，停。呼气，二、三、四、五、六，停。”思绪可能会在背景中持续存在，但你会发现自己的身体变得安稳和放松。\n\
