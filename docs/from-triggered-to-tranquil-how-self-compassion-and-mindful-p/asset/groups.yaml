    As you recall and observe the triggering event, your thoughts might travel beyond
    the event itself. You might think about what led up to this event, why it should
    or should not have happened, what this means about your relationship with the
    other person, other feelings about yourself, any related events, and so on. Allow
    these thoughts and observe them; stay open and curious. Do your thoughts reveal
    a particular emotional attitude — like indignation, blame, shame, disappointment?
    Are there deeper, more vulnerable emotions underneath your thoughts — such as
    fears that no one cares, that you are alone, that you are not enough, that your
    needs don’t matter, and so on? hidden under fairly reasonable-sounding thoughts.
    For example, Emily habitually said to herself, “Dad didn’t know how to love.”
    This strategy helped her avoid noticing fear about her unworthiness.


    When you notice one of your deeply protected or hidden fears coming up, if a vulnerable
    fear comes to light, embrace this with tenderness. It may help to imagine that
    this fearful part of you is a much-loved child or a vulnerable aspect of yourself.
    Be with yourself like this for a while, holding and comforting yourself, as you
    continue to breathe slowly and with awareness. Remember, a fear of something is
    a thought. A fear does not mean that the thought is true or real (like the fear
    of not being seen). Such fears point to ways in which some core developmental
    need was not adequately attended to (such as the need for loving attention).


