    the idea of the group pause: If anyone feels stressed or triggered or thinks someone
    might be — whether this seems obvious or not — they say the word “pause” or “time-out”
    or some other easy-to-remember signal. Some groups have a nonverbal hand-raising
    signal or a bell or chime for this purpose. If anyone gives this signal, everyone
    stops talking and brings their attention inward to their body sensations and breathing,
    with the aim of becoming more relaxed, grounded, and present. If you wish, explain
    that the ability to self-regulate is necessary for most group endeavors, whether
    the endeavor is a design problem or an intimacy game. Also add that in groups,
    if one member gets triggered other members will sense this and they may become
    triggered themselves, or at least distracted. The reason for becoming aware of
    triggers and pausing is that all members can be mentally present for the task
    at hand. When there is unacknowledged triggering going on, communication can become
    untrustworthy.


    The method I use when I lead Honesty Salons — which focus on communicating with
    self-awareness is to give everyone in the group a four-inch round toy button.
    I tell them, “We have all buttons, or the potential for getting our buttons pushed.”
    One of my goals is to help people accept this fact with more ease, tenderness,
    self-compassion, and humor. Then I explain: “If you get your button pushed or
    become triggered during the group, hold up your button so everyone can see it.
    We will all take a brief pause for four or five slow, deep breaths. During this
    pause, each of us should notice if we ourselves are also triggered or in need
    of a pause.” Any item, such as a pen, can also be used as a signal.


    # How to Facilitate a Group Pause


    There are different ways to deal with trigger reactions, depending on the setting,
    the leadership model you are using, the group purpose, and the group''s stage
    of development. But if you put in place an explicit agreement with a group, your
    job will be easier. Here are two common scenarios and how to handle them: first
    when someone is triggered and asks for a pause, and second when someone is triggered
    but doesn''t say anything.


    If a member gets triggered and says “pause,” make sure everyone is quiet for four
    to ten breaths. After the silence, invite some general group'
