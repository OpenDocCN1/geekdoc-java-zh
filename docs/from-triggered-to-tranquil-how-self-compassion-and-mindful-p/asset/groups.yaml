    # Civil Disobedience


    When deep structural change is needed in a society, and those in power deny basic
    human rights to certain segments of the population, civil disobedience, or taking
    it to the streets, may be the only remaining option. The type of trauma response
    that occurs when a person is without food, shelter, a sustainable future, and
    physical safety is quite different from the attachment traumas I discuss in this
    book. But a person''s ability to sort out unproductive responses to authority
    from clearheaded responses is still worth attending to.


    Rita''s story illustrates how we need to be mindful of how we can sabotage our
    own credibility when we throw around inflammatory verbiage, negative labels, and
    vague generalizations. I believe we can speak with passion without sacrificing
    critical thinking. We can make a righteous point without being self-righteous.
    We can use anger to assert that something needs to stop without becoming angry
    that we were wrongheaded or trigger others into dangerous behavior. If we do the
    inner work in this book, we will notice when we are becoming wrongheaded, inflammatory,
    self-righteous, or needlessly repetitive. If we are called to lead or organize
    any sort of civil disobedience action, then we must use the tools of any good
    leader. Much of our power is in the legitimacy of our words, the sincerity in
    our call to action, our ability to paint a clear picture with our words, our words,
    and to point out realistic options (rather than speaking from reactivity and fomenting
    chaos). We must use our voice wisely.'
