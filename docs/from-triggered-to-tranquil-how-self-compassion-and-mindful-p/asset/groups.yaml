  mdcn: '

    作为领导者，请留意自己是否经历了任何不耐烦或挫败感，并给自己进行一次快速的自我安抚。你可以向小组展示你自己在何时曾过口吃或在小组中经历过表现焦虑的实例。你也可以邀请小组暂停并自我冷静，之后，你可能邀请成员
    A 在他们愿意的情况下重来，或者你可以询问成员 A 是否希望听取他人对他们行为影响的反馈。然而，除非他们想要反馈，否则不要允许他人向此人提供反馈。


    ## 群体或个人身份


    有时，小组中的某些成员在提到某人的性别、种族、性取向或民族时可能会使用某种标签或术语，而小组中的一个或一些人可能认为这是不敏感或不恰当的。这些人可能会基于一种恐惧故事被触发，即认为说话的人是不安全的、不尊重的或不认可的。作为领导者，当成员使用他人可能认为不恰当或冒犯的标签或术语时，要留意发现任何触发反应，无论这些术语通常是否被认为是不恰当的。如果你注意到某人被触发了，你可以要求小组暂停；进行“轮流发言”；分享你对任何感到不安之人的关怀、共情或其他感受；和/分享你对说话者的关怀、共情或其他感受。


    ## 羞耻


    假设一位领导者公开向某成员表达愤怒或划定边界，或者也许领导者只是对该成员进行了纠正或提供了建议。这可能会触发该成员对被公开羞辱的恐惧。也许该成员有与羞耻相关的创伤史，并发生了情绪淹没或解离。作为领导者，要警惕此类情况下出现反应的迹象。当你的某些行为触发了某人时，要对你所承担的任何不当行为负责，并可以告诉小组：“如果我重新来过，我会……”你可能还想道歉并承认自己被触发了（如果是事实的话）。


    ## 冲突


    两个成员之间或任何数量成员之间的冲突，可能会让那些在充满争吵、或有成瘾、精神疾病或生活方式不稳定家庭中长大的成员再次创伤。对于这些小组成员来说，未解决的冲突情况可能会触发对冲突或混乱的恐惧。


    作为领导者，每当小组中出现冲突时，都要留意出现反应的迹象。邀请小组暂停，说类似的话：“有时小组中会出现冲突，这可能会让人感到不安，而不仅仅是参与互动的人。我建议我们都花一点时间与自己连接并让我们的神经系统冷静。你们愿意和我一起闭上眼睛，进行四或五次缓慢的深呼吸吗？”之后，你可能邀请大家分享他们对冲突的反应、这种冲突给他们带来了什么，以及/或他们现在身体的感受。这可能也是进行“轮流发言”的好时机。


    ## 措手不及


    当小组成员向某个人提供反馈时，该个人可能会感到措手不及，并无法划定边界和要求独自待着。其他成员可能注意到这一点，但觉得没有权利站出来。如果领导者没有认识到这一点，而其他人注意到了，某些小组成员可能会判断领导者为无能。


    作为领导者，要留意小组成员的措手不及。如果你一直意识到自己未能处理这个问题，请进行一次包含自我关怀在内的个人探究，并对你在进行这一探究时遇到的任何敏感、恐惧和盲点负责。公开承担你所能承担的任何不当行为，道歉，或向小组发表公开声明：“如果我可以重做，我会……”记录下你在经历这段痛苦经历中学到的东西，并感谢自己对反馈和持续学习的开放态度。


    ## 处理其他触发因素


    除了这个列表，小组成员还会拥有或表现出许多其他敏感性。小组成员带着他们过去的幽灵来到，那是他们尚未完成的情感纠结。不仅是领导者是投影屏幕，小组本身也是。


    预见每可能的情况是不可能的。只需对触发反应保持警觉，在产生怀疑时要求小组暂停，并对小组成员的投入和建议保持开放。为了保持健康，小组需要共同学习和成长的能力。领导者不需要拥有所有的答案。领导者的工作是促进小组的发展和学习，促进朝着共同目标合作，并帮助成员找到利用他们独特的天赋和资源来推进这些目标的方法。有时，当领导者采取“未知”的姿态，并在大家共同经历挑战性情况时保持与他人学习及从他人学习的开放，这些目标能得到最好的实现。


    如果你在判断上犯了错误，立即承认并进行公开修复很重要。当领导者敞诚并承认错误时，人们通常是非常宽容的——只要领导者在过程中不要自我辩护。防御会会让原本诚恳的道歉失去意义。先向那些被你的行为伤害的人道歉。然后，当触发因素已经平复（尤其是你的），询问人们是否愿意听取你对局势的解释或观点。不要假设答案是肯定的。仔细观察每个人的反应，如果人们还没有准备好听你的一面，请不要继续。在晚些时候再次提这件事。


    ## 领导力实践与干预


    本节描述了一些小组领导力实践，用于减少、管理并熟练地处理小组中的触发反应。


    ## 背景：目的、基本规则和领导者的角色


    当小组开始时，或者作为新领导者加入现有小组时，分享你对小组目的的感知、沟通的基本规则以及你对自己角色的看法。然后分享你一些关于促进小组健康和安全的价值观，以及你对行为的期望。在个人发展的背景下，这可能包括尊重差异、敞诚倾听、诚实、承担风险、平衡参与和承担责任等价值观。在工作背景下，你可能强调开放学习、愿意寻求帮助、分享信息和主动性等价值观。

    '
