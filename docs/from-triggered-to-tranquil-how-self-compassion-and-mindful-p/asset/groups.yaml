    Accepting the facts of your life, including your early family life, is the first
    step in healing yourself.


    # The Payoff of Acceptance


    Gaining understanding regarding your own and others’ trigger reactions allows
    you to adopt a worldview that sees everything that shows up in your life as acceptable
    and deal-with-able. You may not like a particular unwanted event, but here it
    is, so the question becomes: How do I feel about it, how can I be with this feeling
    in a self-loving way, and how shall I deal with it in a self-respecting way? When
