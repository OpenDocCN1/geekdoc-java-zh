    ## Repairing with Friends


    When triggered by friends, most people first practice a unilateral pause (see
    “If the Other Person Is Triggered and Cannot Pause,” pages 80–82). So the pause
    would be a silent, undisclosed event; you would find a way to leave the room or
    remove yourself, such as by going to the bathroom. Or you might initiate a unilateral
    pause by saying, “I’m getting overwhelmed and need to collect myself,” or even,
    “I’m starting to get triggered. I need to pause.


    Then, after you feel calm and safe again, you could come back and perhaps offer
    a brief repair statement, such as, “I’m sorry I had to interrupt us. I’m ready
    to listen now.” Or if you are not yet ready to reengage, find time to do the self-compassion
    practice, and see how you feel after that.


    Ideally, particularly with someone you trust, I suggest doing five trigger-work
    steps, including pausing, self-calming, self-soothing, and repair. This requires
    some explanation and discussion, so that both people know what the practice entails.
    The repair statement may need to be modified or simplified so that the level of
    disclosure is appropriate for this relationship. For instance, you might not include
    your core fear nor make a plea for reassurance beyond asking for a simple acknowledgment
    of understanding.


    In some friendships, you might only agree to pause and self-calm when triggered
    and leave the other trigger-work steps out. Later, you can do self-inquiry on
    your own, when you are alone. Once you have some practice with these tools, it
    is easy to customize the pause-calm-inquire-repair process to fit each unique
    situation.


    Finally, for certain friendships that are particularly close and important, friends
    may want to commit to the same process I recommend for couples in chapter 7. This
    work can work well for people who do not have a significant other, or for friendships
    that are as long-lasting and intimate as a marriage. In this case, during the
    repair step, you would reveal the core fear that got triggered, reveal how this
    relates to childhood trauma, and ask for help or reassurance to assuage this fear.
    If you have a friend who is willing to do this shared practice with you, you are
    very fortunate. I think those of us who do these practices are making a real contribution
    to healing the fears that divide our world.


