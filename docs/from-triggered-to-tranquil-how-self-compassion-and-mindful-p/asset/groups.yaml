    this highlights a slightly different misunderstanding when it comes to triggers.
    People who rate this highly (with a 3 or 4) tend to be generally suspicious of
    apologies — possibly due to painful early experiences with someone who hurt them
    and then apologized repeatedly. Their understandable suspiciousness makes it very
    difficult for a current partner to repair a mistake. Partners are not perfect.
    They will sometimes do the things that upset us. And if we cannot accept apologies,
    every triggering event is probably going to be more scary — both for us and for
    our partner. This can lead a partner to walk on eggshells in an effort to never
    trigger their partner. This isn''t usually sustainable. And it''s also not really
    healthy for one partner to adapt to the other''s every need and sensitivity.


    While there is nothing wrong wishing the things that trigger us, it is better
    to take responsibility for getting triggered, so we can address activity together
    in a way that is cooperative, rather than one-sided.


    When working with triggers, I suggest adopting a “life is a practice” mindset.
    Become curious whenever you notice a strong resistance in yourself to someone''s
    behavior. Try to recognize anything that you consistently judge or resist — any
