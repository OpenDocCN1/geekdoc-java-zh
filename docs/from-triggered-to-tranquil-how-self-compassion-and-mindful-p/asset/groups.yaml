    midbrain called the amygdala, or the amygdala in common parlance. This set of
    structures has a primary role in the processing of emotions like fear, anxiety,
    or anger/aggression. Like radar, our survival alarm is always scanning for danger.
    With other animals, this alarm system was built into the human species to quickly
    accelerate our bodies into action if a predatory animal was even suspected to
    be nearby. Whenever a potential threat is detected, neurons in this area fire
    loudly, like an alarm. Today, for humans, this threat is more often associated
    with a disturbance in our connection to others or in our sense of efficacy to
    get our needs met. The things that threaten us are primarily interpersonal.


    When our survival alarm is ringing, strong neurochemicals (like adrenaline and
    cortisol) are sent to various parts of the autonomic nervous system, causing certain
    bodily systems to go into action — like heart rate and limb strength — because
    this helps us mobilize for aggression or for running away. Our survival alarm
    chemicals signal to shut down — like digestion and sex — because these are vital
    to remind us when we don''t feel like eating or we have no interest in sex, this
    may be related to feeling unsafe, anxious, or threatened. Maybe there''s an unprocessed
    trigger reaction somewhere in our psyche that needs attention. Maybe our survival
    alarm is stuck in the On position. Remember, all of these neurochemical reactions
    are below the level of conscious awareness. We do not choose any of this. But
    if we accept that trigger reactions are due to the workings of the survival alarm
    system which has become especially sensitized to threats in human connection similar
    to those that happened in childhood— then we are on our way to accepting our trigger
    reactions.


    In addition, current research shows that things like a sharp voice tone or a disapproving
    facial expression can trigger an automatic impulse to attack, defend, or run away,
    as if a tiger has suddenly appeared. Even in the absence of any threat to our
    physical survival, our inner alarms warn about threats to our emotional safety
    and security to our social connections and intimate relationships.


    Have you ever gotten triggered by hearing a loud, booming male voice? I, personally,
    sometimes feel something akin to the fear of being dominated or overwhelmed. Some
    men have a similar reaction to a shrill or harsh female voice. My men friends
    tell me that sometimes it triggers them to think they are being criticized or
    disapproved of. Many people tell me that they often try to overlook such inner
    reactions and go on conversing as if nothing triggered them. For mild triggers,
    this may work fine. But I think it''s beneficial in the long run to recognize
    when our conversations have been taken over by the primitive part of our brain.
    Both people could be communicating while on autopilot and not know it.


    For instance, brain research has shown that when two or more people feel emotionally
    connected or interdependent, they become "wired together," meaning that if one
    gets triggered, the closest to them usually become triggered as well. This cotrigging
    is normal, and it happens below the level of conscious awareness. This makes it
    difficult to know who got triggered first, which in the end doesn''t really matter.
    What''s important to remember is that if your partner gets triggered, your nervous
    system may feel unsafe and get cotrigged, so you both will need to pause, become
    aware of this, and practice self-calming.


    Obviously, people are not at their best when their survival alarm is triggered.
    The quick, knee-jerk reactions like fight, flight, or freeze cause people to yell,
    blow up, blame, try to right, distance, shut down, avoid, build walls, get silent,
    or become defensive. And afterward, they often do not recall what they actually
    did or said or even triggered them. Sometimes people think they''re ready to talk
    it out and resolve things with the other person, but it can be too soon. They''re
    not feeling calm and safe enough. They may still be in a self-protective mode.
    To resolve things when they feel that way can make things worse.


    Sometimes it takes quite a while to feel calm and safe. At high levels of activation,
    the survival alarm can dramatically hijack the higher brain. Remember, this system
    is the part of the brain that primitive humans depended on for their actual physical
    survival. Our higher brain functions go offline because they operate too slowly
    to save us from a saber-toothed tiger! When our survival alarm is ringing, everything
    feels like an emergency, so we have to really work to get calm again. Only when
    our survival alarm is turned off, and we are feeling safe with the other person,
