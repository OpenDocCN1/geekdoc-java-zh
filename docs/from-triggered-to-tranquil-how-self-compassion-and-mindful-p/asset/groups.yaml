    ## I’m Triggered with My Kids


    Being a parent has certain built-in dynamics that can be a setup for recurring
    trigger reactions.


    Anyone who has ever been a parent has had moments of feeling impatient, frustrated,
    disappointed, or overwhelmed in relationship to their child. And every child has
    probably felt some of these things toward their parents. But as the parent, you’re
    the one who your child depends on. You’re the one who is expected to be the adult,
    the one who is supposed to know how to manage difficult situations competently.
    So how can you square this with the fact that sometimes you don’t feel very adultlike?
    Sometimes you don''t know what to do. Sometimes you may even feel like giving
    up. This chapter discusses how to handle triggering with children — focusing primarily
    on younger kids who still live at home and are financial dependents. That said,
    much of this can also be applied to situations involving adult children who live
    outside the family home.


