    sharing about how each person is feeling. This sharing is aimed at the group,
    not at the person who said “pause,” and it is not meant as an invitation to discuss
    what happened, but simply a quick indication of each member’s current state. This
    is similar to doing rounds (see “Other Helpful Devices”) below).


    Then ask the person who said “pause” if they need anything, or if they would prefer
    the group move on so they can do some inner inquiry or self-soothing on their
    own. In general, as a group leader, I do not usually help the person process their
    trigger reaction in the group unless the group is explicitly a person workshop
    where this is part of the contract. When I choose to help the person, I guide
    them in the Compassionate Self-Inquiry practice, often inviting everyone else
    in the group to do their own inquiry silently. However, whether you decide to
    spend time helping the triggered person get calm and clear or, at some point you
    need to move the group’s attention away from this. At an appropriate moment, ask
    if everyone is ready to move on, and if they are, tell those who might have more
    to share that they can do so later. Provide time at the end of the meeting for
    debriefing, closure, revising, or repairing with those who want this, whatever
    terms are appropriate for your aims and the group culture.


    In the second common scenario, a member will get triggered, shut down or freeze,
    and no one will call for a pause. The moment you notice someone is triggered,
    say something to normalize or show acceptance for their reaction, say “It is understandable
    that some people might be triggered hearing this,” or “I believe there are some
    trigger reactions in the room.” Then call for a group pause, and maybe guide a
    brief self-calming or self-compassion practice — modified to fit your group’s
    needs and norms. After this, invite general group sharing as above — using whichever
    tools are appropriate for your situation.


    # Other Helpful Devices


    Here are some other helpful devices for groups. These devices enhance everyone’s
    ability to be present, authentic, or self-aware. When members are aware and present,
    the group will experience less frustration and fewer triggering episodes.'
