    type, while realizing that everyone can grow or evolve beyond their type. Your
    type is not a life sentence. It''s the result of genetics and conditioning. People
    can learn and change as they continue along the parenting path or any other relationship
    path. Having a kid who seems different can feel confronting, and it can be frustrating.
    But it can also be a huge gift for personal growth.


    ## How to Repair with Your Kid


    Whatever the reason, if you get actively triggered by your kid, you will need
    to do your inner work and initiate a repair as soon as possible. It may help to
    remember how it was for you as a kid when one of your parents got upset with you,
    in anger, and Most people recall feeling afraid, unsafe, and even terrified at
    times. What did you need after that happened? Most kids would say that they need
    reassurance that they are loved; whatever, they want to know the parent is over
    and feeling affectionate toward them.


    In my own childhood, I was fairly lucky in this regard. Although my dad often
    popped off me in anger, and I would get frozen in fear, he would always come to
    find me fairly soon afterward and tell me he was sorry he overreacted. Sometimes
    he would tell me that his behavior had scared me because he feared I might hurt
    myself (the time I almost ran into the street in front of an oncoming car). Sometimes
    he would say he didn''t know why he reacted the way he did, but it wasn''t because
    of anything bad or wrong about me. These apologies meant so much to me. As I think
    about this now, my eyes fill with tears of gratitude. When he would get angry,
    I thought I didn''t love me anymore. But he didn''t allow me to sit for too long
    with this fear. He was adult enough to calm himself, empathize with my fears and
    needs, take responsibility for his reactive behavior, and reassure me of his love.


    When it comes to your own repair with your kid, the exact words you use for your
    repair script will depend on the child''s age and maturity. The words my dad started
    out with, "I’m sorry I lost my temper." And even at five years old, I knew what
    he meant. Nowadays, you could probably introduce this concept to a child and tie
    it in with the idea that we all need a "time-out" now and then to calm down after
    we get upset. The word upset may be a good, generic term to use. Follow this with
    the idea that once we are calm, then we should apologize or repair. After you
    have taught your kid this, after a little while, you could add the idea of the
    do-over (as, "If I could do it over..."). Course, the best way to teach this is
    to model. A brief explanation sets the expectation that this is how people love
    one another handles things anger and other riffs in connection. Here is the repair
    statement I suggest when addressing a child between the ages of five and eighteen:


    - **I’d like to apologize for __________** [insert your reactive behavior, such
    as: yelling, hitting you, calling you a name, slamming the door, ignoring you,
    and so on].

    - **I am sorry I did [or] that. I didn''t mean to.**

