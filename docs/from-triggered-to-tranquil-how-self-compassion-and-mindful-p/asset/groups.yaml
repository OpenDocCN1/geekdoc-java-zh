    if a loud voice was the trigger, the person might react by yelling back (fight),
    leaving the room (flight), or shutting down and not responding at all (freeze).
    Reactions can range from mild, like having a judgmental thought, to severe, going
    numb. A triggering stimulus can sometimes cause a flashback. A flashback is a
    brief, vivid, often frightening memory that seems to appear out of nowhere and
    makes people feel as if they are back in the traumatic situation. Sometimes flashbacks
    occur without any apparent stimulus.


    # Attachment Trauma


    An important type of developmental trauma is called attachment trauma. This term
    refers to all-too-common forms of neglect, abuse, or disorganised behavior that
    interfere with an infant or child''s secure attachment or bonding with their caregiver.
    This disrupts a child''s sense of trust that their needs matter or that it is
    safe to express their feelings and needs. Most people suffer some degree of attachment
    trauma simply because many parents are often busy or too distracted with their
    own problems to be fully present to their child''s needs. All children have attachment
    needs like liking attention, nurturing touch, and reassurances of safety when
    they are hurt or afraid. Such reassurance of another human is called coregulation.


    The need for parent-to-child coregulation continues beyond infancy, through one''s
    childhood, and even into one''s teens. Another attachment need that continues
    into one''s teens is the need to have one''s sovereignty or unique personhood
    respected. If a parent treats a child as an instrument to'
  - '[PAGE 19]


    fulfill the parent’s selfish needs, pleasure, or status, this is a violation of
    the child’s sovereignty and can create wounding or insecure functioning.


    The basic attachment need that seems to endure throughout life is the need to
    feel that we are not all alone, that there is someone we can turn to for comfort
    and reassurance in times of distress. Research shows that if a child or adult
    suffers a traumatic incident, but then has someone supportive to talk about it,
    the effects of this trauma are much less severe.


    # Humans Are Not Machines


    When people get triggered, they often say, “That person pushed my buttons.” This
    phrase illustrates how a perceived threat to one’s emotional safety can cause
    a person to go on automatic — just as someone pushed a button on a machine. The
    button gets pushed, or the trigger pulled, and suddenly the person exhibits a
    series of preprogrammed reactions or automated routines. Humans are not machines,
    but we often behave in machinelike ways — automatically explaining ourselves if
    someone says they do not agree with us, or automatically assuming our housemate
    is angry if we hear the door slam. My aim in writing this book is to show that
    we can overcome this unfortunate programming and open up to our full range of
    options and choices in any given moment — instead of being stuck in rigid, machinelike
    patterns.


    The journey to mastering your triggers begins when you recognize reactivity in
    yourself. This reactivity can be obvious — like when you yell at the person who
    took your parking space. Or it can be hidden — like someone interrupts you, and
    you feel slighted, but you don’t make a big deal out of it. In this book, recognizing
    and working with your triggers is the focus of part 1. The chapters are organized
    around five essential adult development tasks. These are the Five Steps of Trigger
    Work: admitting to and accepting triggers, catching them early, pausing to self-calm,
    activating self-compassion, and restoring safety and connection. These chapters
    provide simple practices for accomplishing each step, and they can be done by
    yourself.


    Part 2 shows how to apply these practices in different types of relationships:
    with your mate, your children, a friend, as a group member,'
  - '[PAGE 20]


    as a group leader, and in relationship to your social context.'
  - '[PAGE 21]


    # Part One


    # Practices for Transforming Reactivity'
  - '[PAGE 22]


    # Chapter One


    # Getting from Here to There


    # The Five Steps of Trigger Work


    As we do this work, we learn that having a hair-trigger reaction does not mean
    there is something shamefully wrong with us. We may come to feel some underlying
    sadness or grief that our childhood conditioning has set us up to experience such
    insecurities, but grief about such things is actually healthy.


    Most people don''t like to admit it when they get triggered. This normal, and
    quite understandable, aversion to emotional discomfort is the primary impediment
    to healing childhood wounds and showing more present in daily life. This chapter
    overviews the five developmental tasks or life skills that constitute this healing
    journey, and the rest of the chapters in part 1 describe in detail how to accomplish
    each step. Here are the Five Steps of Trigger Work:


    +   1. Admitting and accepting your insecurities

    2. Learning your unique trigger signature'
  - '[PAGE 23]


    +   3. Pausing to regulate yourself

    4. Being with sensations and emotions

    5. Repairing and clearing the air


    # 1. Admitting and Accepting Your Insecurities


    Acceptance is achieved when you are able to notice and accept that you sometimes
    get triggered, that other people also get triggered, and sometimes others get
    triggered by things that you do or say. You accept that a certain amount of emotional
    discomfort comes with the territory of relating with others. Acceptance also means
    you do not judge yourself as bad or wrong for getting triggered or triggering
    someone else. You know it is normal. You may not lie that you get triggered, but
    know that it happens to almost everyone. Acceptance generally comes more easily
    to people who trigger reactions are not debilitating. If reactions are criticized
    by others or cause painful breakups or disruptions of friendships, then people
    may carry shame about the fact that they "lose it." If watching yourself get triggered
    seems unbearably painful, you may have to go slowly with some of the practices
    in this book. Going slowly is generally better than going fast, anyway. It allows
    for deeper self-experiencing.


    The inner work of the admitting and accepting stage involves coming to terms with
    insecure brain wiring, childhood trauma, shame, or all of the above. As we do
    this work, we learn that having a hair-trigger reaction does not mean there is
    something shamefully wrong with us. We may come to feel some underlying sadness
    or grief that our childhood conditioning sets us up to experience such insecurities,
    but grief about such things is actually healthy. It is part of the work of coming
    to terms with what happened. Grief helps us accept the facts of our early history.
    We will no longer blame others for our reactions or spend much time wishing things
    were different.


    Acceptance comes when we rise above the need to blame ourselves or someone else
    for our reactions and sensitivities. "Rising above" means we can witness ourselves,
    the other person, and the whole context with some measure of objectivity. This
    takes practice. Doing the practices in this book will get you there.'
- md: '

    At first, you might be unaware of when you are getting triggered — especially
    if your reactivity happens mostly on the inside and is not visible to others.
    Inside or invisible trigger reactions are things like having judgmental thoughts
    about the other, making assumptions about the other''s motives, going blank, or
    being afraid to speak up. As you do the exercises in this book, you will grow
    in your ability to admit and accept that you sometimes get triggered.


    ## 2. Learning Your Unique Trigger Signature


    Your handwriting has a characteristic look and feel. It may be small and constricted,
    by big and bold, or somewhere in between. Similarly, most of your trigger reactions
    will look somewhat similar to one another and will arise from the core fear (like
    fear of rejection, abandonment, not being good enough, not being heard, and so
    on). Our trigger signature is an expression of our attachment style. If we have
    a preoccupied/anxious attachment style, we are more likely to pursue, prod, question,
    argue, challenge, or attack when we get triggered. If we have a more avoidant
    attachment style, try to shut down, withdraw, defend, explain silently, or try
    to fix things when we are triggered. Knowing your unique trigger signature helps
    you quickly recognize the fact that you are getting triggered. This is a big step
    toward trigger mastery.


    However, I want to clarify that I use labels as preoccupied or avoidant, my intent
    is to provide a potentially useful lens through which to view behavior patterns.
    Just as there are no pure types, no one is purely avoidant, preoccupied, or even
    secure in their attachment style. All behavior patterns fall somewhere along a
    continuum. So, for example, someone''s behavior may demonstrate a somewhat avoidant
    style or a somewhat secure style. As you read, please remember that types and
    styles are not absolute but describe tendencies.


    Some avoidant types will have difficulty noticing their trigger sensitivities
    because they only get triggered when someone is upset with them. They may think
    they are the victim of someone else''s triggers, as in: "If he didn''t get triggered,
    I would be fine." For these people, their core fears or unconscious insecurities
    may be deeply buried, so that it takes an “explosion” (like a highly reactive
    or frustrating partner) to unearth their hidden fears. Maybe the developmental
    trauma/neglect that they experienced occurred before they had language or before
    they started to remember things. Children who were mildly neglected often then
    develop into very resourceful, self-reliant little people who do not expect much
    from others. They may also have rather adaptable or pleasing personalities. They
    protect them so they don’t feel as much disappointment or frustration as might
    otherwise be the case. Their dependency needs need to be repressed, so they may
    not recognize the unmet underneath their buoyant and even-tempered personality
    structures. Thus, they could go through life never recognizing when their needs
    are not being met — because they got to not expecting much from others a long
    time ago.


    By the time you begin to recognize what your trigger reactions look like and feel
    like, you already have some ability to notice and take ownership of the fact that
    you sometimes get triggered. That’s part of the admitting and accepting step.
    *Noticing* a trigger reaction while in the midst of being reactive is not easy!
    When you are triggered, your ability to notice tends to go offline. That’s what
    you need to practice pausing. This is the next step.


    ## 3. Pausing to Regulate Yourself


    Pausing requires that you notice yourself doing some aspect of your trigger signature
    (like arguing or defending yourself), and you stop that. You can say “pause” to
    yourself or out loud. Some partners make a pause agreement, so that when either
    person says “pause,” both will stop talking and silently take ten conscious breaths
    through the nose.


    Self-regulation involves turning your attention inward and calming your nervous
    system, deep breathing or some other awareness practice. This step is your first
    aid for reactivity. It is one of life’s basic stress-management tools. I wish
    more grade schools would teach this, but it’s never too late to learn. The challenge,
    of course, is learning to do this one of life’s most stressful conditions — being
    triggered by someone who is important to us.


    ## 4. Being with Sensations and Emotions


    Once you have learned to consciously attend to your breath and body, you will
    find it easier to notice your sensations and emotions — the tension in your throat,
    the pain in your heart, sadness, fear, or helplessness. This step involves taking
    the position of the “witness” or “noticer” — noticing the breath going in and
    out; noticing feelings, sensations, images, memories, and mind chatter; watching
    these internal impressions enter and exit your awareness field; watching for changes
    in their quality or intensity; watching them move around different locations in
    your body. As the noticer, your attention is on the sensations being witnessed
    — so you are both the one sensations or feelings and the one witnessing yourself
    having sensations or feelings. It''s as if your awareness has two perspectives
    simultaneously. This enables you to hold space for yourself, to comfort yourself.
    This dual awareness is also the foundation for a more intimate and friendly relationship
    with yourself. When you learn how to be with yourself, you never have to feel
    all alone.


    ## 5. Repairing and Clearing the Air


    If a trigger reaction (even a subtle reaction like withdrawing or freezing) occurs
    during an interaction with another person, it can be helpful to approach this
    person later to reconnect, repair the damages, apologize, or have a do-over. This
    step is not appropriate for some situations because it generally requires the
    other person''s agreement or consent. Sometimes you will not use this step.


    If the triggered behavior occurs with a partner or spouse, a close friend, or
    a child, then a repair will be necessary. In other situations, what is done for
    repair depends on the relationship — how close or interdependent people are, and
    how important the relationship is.


    Typically, this step involves setting an agreed-upon time for repair, and once
    that time arrives, you will:

    1) acknowledge you were triggered;

    2) apologize, if appropriate;

    3) reveal the emotional roots of the reaction;

    4) ask for connection or reassurance.


    Repair looks something like: “When I walked out, I was triggered. I’m sorry I
    did that. It was probably my fear coming out my needs don''t matter. If I could
    do over, if I could tell you what was really in my heart, I wish I could have
    asked for reassurance that we''re okay and that my needs do."


    These five steps, while they each involve their own practices, are also interdependent
    — so a gain in one of the areas will result in a gain in all areas. For example,
    the better you get at offering compassion to yourself, the easier it will be to
    accept that you get triggered. Or the sooner you are able to execute a pause,
    the easier the repair step will go, since you stop yourself from saying hurtful
    things and will have less “damage” to repair.


    ## Chapter Two: Admitting and Accepting Your Insecurities


    Getting Beyond Shame and Blame


    When triggering happens, no one is to blame. No one chooses to feel at the mercy
    of their own or another person’s primitive brain wiring.


    When you are triggered, you are not the best version of yourself. You may feel
    hurt, shocked, or out of control. You might appear foolish, impulsive, defensive,
    or irrational. Your ability to cope is compromised — so it’s no wonder you might
    trouble accepting this when it happens. As any therapist or change agent would
    say, we need to be where we are to get where we want to go. In other words, positive
    change requires fully owning, feeling, getting to know, and taking responsibility
    for where we are right now in our growth journey. If there are parts of ourselves
    that we are denying or repressing, these parts won’t heal until we see and accept
    them. They won’t be able to find their rightful relationship with the healthier
