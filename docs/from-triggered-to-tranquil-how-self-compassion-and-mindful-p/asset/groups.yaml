    ## 5. To admit that I sometimes get triggered by my kids or by children is very
    difficult for me. I think this shows that I am immature or self-centered.


    People who agree with this statement (rating it a 3 or 4) view getting triggered
    by a child as something that should not happen, or at least should not happen
    to them. They fear how their kids or their intimate partner might view them. Or
    they might be reminded of a parent who actually is or was self-centered or immature,
    and they fear acting like this person, whom they do not want to be.


    However you rated this question, read it again very slowly, and as you read, notice
    any feelings, sensations, or memories arise in you. If you discover any emotional
    charge or body contraction, let your attention rest for a bit. Bring some heartfelt
    curiosity to the matter — as whatever you discover or don''t discover will be
    okay with you. Simply look around in any corner of your inner world. Maybe you
    won''t see anything interesting or noteworthy. Or maybe a forgotten memory will
    surface — perhaps of an adult upsetting emotions to a child in a way that scares
    the child. If that child in your memory is you, see if you can feel empathy for
    yourself as a child. Feeling empathy for a tender or hurting part of ourselves
    is an act of self-healing.


