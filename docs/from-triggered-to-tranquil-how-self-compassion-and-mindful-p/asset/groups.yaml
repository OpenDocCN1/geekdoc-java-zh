    filled out your repair statement before meeting with your partner. If your repair
    does not go well, it may be because you have not yet mastered one or more of the
    earlier steps. Usually, the acceptance step is hardest to master. If you have
    resistance to accepting that getting triggered arises from your own wounding,
    trauma, or unfinished business, you will still be holding a blaming story or a
    story that your partner should have or could behaved differently. Your focus will
    be on what the other person failed to do, and the conversation will have a fault-finding
    dynamic. When this happens, pause to give yourself some tenderness. Recognize
    that it''s really hard to feel your own upset and to accept that triggering happened,
    and it left you feeling hurt, angry, or insecure. The human ego-mind seems addicted
    to finding reasons and passing judgment, so it''s not easy to just feel what we
    feel, without our thoughts coming in to complicate things.


