    \n## 在暂停期间激活自慈悲\n\n一旦你暂停了足够久带来了冷静和安全感，你就可以准备好通过慈悲自我查询练习（见第97-103页）与自己亲密地相处。反复进行这项练习——在被触发后、在暂停期间——培养对那些感到受伤、愤怒、不安全、恐惧或不知所措的部分产生同情、温柔和慈悲的态度。你可能还会意识到，这样为自己留出空间让你在之后感到更加柔软和更容易宽容——所以当你与伴侣见面进行修复时，你会处于一种更慷慨的心境。\n\
