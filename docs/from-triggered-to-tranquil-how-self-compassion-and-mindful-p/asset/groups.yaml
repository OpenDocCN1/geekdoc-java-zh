    accept that triggering happens; you know your unique signature; you regularly
    practice pausing, self-regulating, and compassionate self-inquiry; and you repair
    as needed and can stick to a simple repair versus using repair as a time to defend
    your position, be heard, or explain your intentions. By doing all things, embody
    an accepting, openhearted, and spacious attitude toward triggers. This attitude
    will get the group culture. If you are trying to teach this stuff, but really
    think being triggered is something a leader needs to hide, then in doing so, their
    higher-level brain capacities will still be offline, so their ability to communicate,
    solve problems, and cooperate will be compromised.


    Probably the most important thing for a leader to know is their own trigger sensitivities
    — because if they get triggered and continue to react unconsciously, members are
    going to lose trust in them quickly. This doesn’t mean leaders cannot regain the
    group’s trust with skillful repair. The goal is to notice reactions before going
    too far into a reactive pattern.


    ## Exercise: Recognizing Triggers as a Leader


    Here is an exercise to help you recognize any triggers related to leadership:
    Think of a time when you were in a leadership role and got triggered by a group
    member’s behavior. What did you feel and sense? What was the reactive story you
    gave to their behavior? What was your reactive behavior? As you go back into the
    story and the fears associated with it, do you recognize a familiar theme? Does
    anything remind you of an earlier time in your life or an earlier painful experience
    having this? Do this exercise over and over as a way to get really good at spotting
    your leadership-related triggers. Once you’re good at this, you’ll be able to
    handle getting triggered as the leader in a way that is not disruptive to the
    group. That is the goal. Until you get there, you might choose to actively call
    for a pause when you get triggered while attending to your breathing and body
    sensations. At the end of the pause, might invite members to share what came up
    for them, either when asked or during the pause. Did they find the pause helpful?
    Were they able to use the time to self-regulate? Did stories, thoughts, or memories
    come up? If you''re in a business meeting, could you say something like, “Are
    we ready to get back to the agenda now?” For more on setting expectations, including
    pausing when triggered, see “Leadership Practices and Interventions” (pages 202–208).


    ## Frequent Triggers in Group Settings


    As I’ve noted, being in a group will automatically challenge many members’ sense
    of safety. For one thing, it is harder to ask for what you want from people. Some
    people have authority issues. Some people will instinctively compete with the
    leader or other members. Some will spend a lot of mental energy comparing themselves
    to others in terms of appearance, intelligence, status, or power. Personality
    types have core fears about visibility versus invisibility, some about autonomy
    versus conformity, and some about connection versus isolation. Here is a list
    of the most common issues and incidents that trigger people in groups, plus suggestions
    for what leaders can do by a courageous group member.


    ### Criticism


    As an example, let’s say member A uses critical, blaming, or judgmental language
    toward member B. B gets their “fear of being blamed” or “fear of being criticized”
    button pushed. As the leader, you can facilitate group well-being by being on
    the lookout for signs of triggering whenever one member judges or criticizes another
    and then do more of the following:

    - Call for a group pause;

    - Do “rounds” (a group awareness practice where each person says one word to describe
    their current feeling state; see “Other Helpful Devices,” pages 206–208);

    - Share your own care, empathy, or other feelings for member B;

    - And/or share your own care, empathy, or other feelings for member A.


    ### Interpretation


    Triggering can occur when member A has said something but inserts an interpretation
    or assumption about what was said that seems untrue to member B. B gets their
    “fear of being misunderstood” or “fear of not being seen” button pushed. As the
    leader, you can facilitate group well-being by being on the lookout for signs
    of triggering whenever one member makes an interpretation about another and then
    do one or more of the following:

    - Call for a group pause;

    - Share your own care, empathy, or other feelings for member B;

    - And/or share your own care, empathy, or other feelings for member A.


    ### Plop


    Member A offers what they think is a helpful comment or idea. No one responds
    to this contribution. It “flops.” The person gets their “fear of being invisible”
    or “fear my voice doesn’t matter” button pushed. If this happens, the leader asks
    member A how they are feeling; share with member A what you noticed and what you
    imagine — as in, “I noticed there was silence after you said what you want from
    the group, and I imagine you may be feeling something now. Are you?” — and/or
    share your care, empathy, or other feelings for member A.


    ### Time Scarcity


    In a group where everyone is asked to share or weigh in on an idea, the meeting
    is about to end. One member may think, *Time is running out, and my turn will
    be very short, if I even get a turn at all.* This member may get their “fear of
    not being important” or “fear of being left out” button pushed. As the leader,
    pay attention to the clock, and as time is getting short, mention this and ask
    if anyone is sitting on any feelings about this.


    ### Suggestion


    Leaders often make comments, suggestions, or teaching to individual members of
    the group. But if someone is especially sensitive to criticism and vigilant against
    whether leaders can hold a safe container, this person may get triggered by their
    reactive story that the leader is harsh, critical, or insensitive. By the way,
    being a projection screen for members’ core fears is an occupational hazard of
    a leader’s job. If you get triggered by this, then this will be your “work” for
    a while, which means getting comfortable admitting you’re triggered, initiating
    a group pause, and repairing as necessary.


    In addition, other members might get triggered just witnessing a leader giving
    suggestions to someone else. Sometimes the person the leader talks to does not
    get triggered, but others do. It’s as if some people are constantly watching the
    leader to see if they are holding a safe-enough container. A simple teaching point
    may be received by some members as a criticism, a put-down, or as taking a superior
    posture. As the leader, be alert for subtle signs of reactivity after you offer
    suggestions or advice, but remember that you cannot avoid pushing some people’s
    buttons. If you find that your behavior has triggered someone, take ownership
    for any unskillful behavior that you can own and perhaps tell the group, “If I
    could do it over, I would...”


    ## Performance Anxiety


    Say member A is invited to speak (or it’s their turn in the circle), but they
    are unable to speak coherently. They have a freeze reaction. Words come out, they
    don’t make sense. The person is triggered by being on the spot or in the position
    of having to perform in front of others. Many people get a bad case of performance
    anxiety when speaking to more than two or three people. This might be a trigger
    reaction originating from early childhood experiences in school or other groups
    where the person experienced pressure to do things right (or failed to do something
    right).

