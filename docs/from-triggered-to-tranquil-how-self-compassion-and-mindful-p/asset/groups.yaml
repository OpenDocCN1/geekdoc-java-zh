    Whatever you notice arising in you, see if you can welcome this and embrace it.
    By allowing yourself to feel something that was not allowed in the past, you take
    a small step toward inner healing. You begin the process of reclaiming your lost,
    rejected, or abandoned parts.


    # Childhood Attachment Needs


    In order to develop into a fully functioning, securely attached adult, certain
    childhood needs must be met. Almost everyone experiences some frustration of these
    needs.


    During infancy, children need touch, eye contact, and soothing voice tones from
    their caregivers. Children need to be picked up and lovingly held when they are
    distressed. This is called coregulation. We never outgrow this need for coregulation,
    but in infancy, we need it for our survival and for the proper development of
    our nervous systems.


    All children need to feel safe and protected from physical and emotional harm.
    Did you feel protected as a child? Or were you often left to deal with scary or
    dangerous things on your own? Was your parents’ behaviors sometimes frightening
    to you? Do you recall holding you and comforting you while you cried? Was there
    a trusted adult that you ran to for safety or comfort when you were afraid? Pause
    now reflect on these questions. Notice any body sensations, feelings, or thoughts
    that come up. Consider how you feel what you notice. For example, if you notice
    feelings of sadness about something you recall, how do you feel noticing your
    sadness? Can you accept that you felt this way, or do you judge yourself? There
    is no right or wrong answer to any of these questions. The idea is to be curious
    and to improve your ability to uncover hidden feelings.


    All children need loving attention. Children need to feel loved, cherished, and
    valued. They need quality time with a parent who gives them undivided'
