    events, they began to recognize their reactive cycle. Whenever Francesca complained
    or criticized, Amy would start explaining or minimizing. And the more Amy explained,
    the more Francesca expanded her criticisms. Then, the more Francesca did this,
    the more solidly and firmly Amy tried to build her case that Francesca was misreading
    the situation. How can a couple go on like this before they realize they are saying
    the same thing in different words and over and over? Partners can stay stuck in
    this sort of circular communication for years. But when you learn to spot your
    reactive cycle, while knowing how to spot your trigger signature, then you have
    more resources to work with.


