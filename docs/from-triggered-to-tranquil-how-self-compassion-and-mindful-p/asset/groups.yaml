    when you wanted guidance but didn''t get it — either you did not feel safe to
    ask or because it was clearly not available. Do you recall a interfering with
    your efforts to master a task or do something by yourself? Are your memories of
    receiving guidance mostly positive? Pause to reflect on these questions, notice
    any body sensations and feelings that come up, and notice how you feel about what
