    ## Your Reactive Cycle


    If you study your triggering episodes for a while, you will probably notice a
    pattern or cycle. As in: The one person questions, the more the other hides, and
    the more the other hides, the more the first person questions. Or the more one
    person criticizes, the more the other defends, and vice versa.


    When partners are cotrigiggered it can seem like they are caught in a vicious
    cycle. It''s not clear how they got there or who started it. They seem to be having
    the same fight as last time and the time before that. Even if the subject matter
    is different, it''s always the same fight. In a way, it is, since the same fears
    are getting triggered and the same core needs are trying to get met. This familiar
    repetitive cycle is your reactive cycle. Your reactive cycle is like the trigger
    signature for the couple. It''s good to know what it is so you can spot it when
    it begins.


    This is what the trigger signature exercise above can uncover. When Francesca
    and Amy did this, Francesca noted that she got triggered when Amy said “a lot
    of attention” to people other than herself. She then reacted by making critical
    remarks about Amy''s relational capacity or her capacity for commitment. In filling
    out her worksheet, Amy listed that her reactive behavior was to try to reason
    with Francesca — to tell she was misreading the situation and explain to Francesca
    that these other people were just friends.


