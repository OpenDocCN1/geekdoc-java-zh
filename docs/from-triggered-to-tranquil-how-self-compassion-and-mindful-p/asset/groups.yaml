    trigger signature. For instance, if you know you played a protector/rescuer role
    as a child, you can make it a point to notice if you are still doing this in these
    adult groups, and whether this is your best, most authentic choice. I know one
    woman, for example, who has a habit of carefully watching the leader or facilitator
    of any group she’s in — to see if this leader is providing a safe container: Does
    the emphasize confidentiality enough? Is the leader clear about boundaries and
    expectations? Does the leader handle people’s tender emotions in a compassionate
    way? This sort of function can be truly helpful to the group. But for the person
    performing this role, it may indicate they are in a chronic semi-triggered state
    without realizing it. They may have learned to avoid their own vulnerable feelings
    by becoming the group protector.


