    Use the following breathing exercise during a pause, but I recommend first practicing
    this when you are not triggered. Then you''ll have easier access to it when you
    get triggered. Find a safe, comfortable place to sit or lie down. Close your eyes
    if it feels natural and good. While breathing through your nose, try putting your
