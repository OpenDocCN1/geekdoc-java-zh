  ```\n\n### fstore, fstore_<n>\n\n如果操作数为 `Index` 且类型为 `float` 的存储指令是类型安全的，并产生输出类型状态\
  \ `NextStackFrame`，则操作数为 `Index` 的 `fstore` 指令也是类型安全的，且产生该输出类型状态 `NextStackFrame`。\n\
  \n点击此处查看代码图像\n\n```javascript\ninstructionIsTypeSafe(fstore(Index), Environment,\
  \ _Offset, StackFrame,\n                              NextStackFrame, ExceptionStackFrame)\
  \ :-\n    storeIsTypeSafe(Environment, Index, float, StackFrame, NextStackFrame),\n\
  \    exceptionStackFrame(StackFrame, ExceptionStackFrame).\n```\n\n对于 0 ≤ `n` ≤\
  \ 3 的指令 `fstore_<n>`，其是类型安全的当且仅当等效的 `fstore` 指令是类型安全的。\n\n点击此处查看代码图像\n\n`instructionHasEquivalentTypeRule(fstore_0,\
  \ fstore(0)).`\n`instructionHasEquivalentTypeRule(fstore_1, fstore(1)).`\n`instructionHasEquivalentTypeRule(fstore_2,\
  \ fstore(2)).`\n`instructionHasEquivalentTypeRule(fstore_3, fstore(3)).`\n\n###\
  \ fsub\n\n`fsub` 指令是类型安全的，当且仅当等效 `fadd` 指令也是类型安全的。\n\n点击此处查看代码图像\n\n`instructionHasEquivalentTypeRule(fsub,\
  \ fadd).`\n\n### getfield\n\n操作数为 `CP` 的 `getfield` 指令是类型安全的，当且仅当 `CP` 指向一个常量池项目，该项目的声明类型为\
  \ `FieldType` 且声明在类 `FieldClass` 中，并且可以从输入的操作数栈上将匹配 `FieldClass` 的类型替换为类型 `FieldType`\
  \ 以产生输出类型状态。`FieldClass` 不能是数组类型。`protected` 字段需要经过额外的检查（§4.10.1.8）。\n\n点击此处查看代码图像\n\
  \n```javascript\ninstructionIsTypeSafe(getfield(CP), Environment, _Offset, StackFrame,\n\
  \                              NextStackFrame, ExceptionStackFrame) :-\n    CP =\
  \ field(FieldClass, FieldName, FieldDescriptor),\n    parseFieldDescriptor(FieldDescriptor,\
  \ FieldType),\n    passesProtectedCheck(Environment, FieldClass, FieldName,\n  \
  \                            FieldDescriptor, StackFrame),\n    validTypeTransition(Environment,\
  \ [class(FieldClass)], FieldType,\n                              StackFrame, NextStackFrame),\n\
  \    exceptionStackFrame(StackFrame, ExceptionStackFrame).\n```\n\n操作数为 `CP` 的 `getstatic`\
  \ 指令是类型安全的，当且仅当 `CP` 指向一个常量池项目，该项目的声明类型为 `FieldType`，并且可以从输入的操作数栈上压入 `FieldType`\
  \ 以产生输出类型状态。\n\n点击此处查看代码图像\n\n```javascript\ninstructionIsTypeSafe(getstatic(CP),\
  \ Environment, _Offset, StackFrame,\n                              NextStackFrame,\
  \ ExceptionStackFrame) :-\n    CP = field(_FieldClass, _FieldName, FieldDescriptor),\n\
  \    parseFieldDescriptor(FieldDescriptor, FieldType),\n    validTypeTransition(Environment,\
  \ [], FieldType,\n                              StackFrame, NextStackFrame),\n \
  \   exceptionStackFrame(StackFrame, ExceptionStackFrame).\n```\n\n### goto, goto_w\n\
  \n`goto` 指令是类型安全的，当且仅当其目标是有效的。\n\n点击此处查看代码图像\n\n```javascript\ninstructionIsTypeSafe(goto(Target),\
  \ Environment, _Offset, StackFrame,\n                              afterGoto, ExceptionStackFrame)\
  \ :-\n    targetIsTypeSafe(Environment, StackFrame),\n    exceptionStackFrame(StackFrame,\
  \ ExceptionStackFrame).\n```\n\n`goto_w` 指令是类型安全的，当且仅当等效的 `goto` 指令是类型安全的。\n\n点击此处查看代码图像\n\
  \n`instructionHasEquivalentTypeRule(goto_w(Target), goto(Target)).`\n\n### i2b,\
  \ i2c, i2d, i2f, i2l, i2s\n\n`i2b` 指令是类型安全的，当且仅当等效 `ineg` 指令是类型安全的。\n\n点击此处查看代码图像\n\
  \n`instructionHasEquivalentTypeRule(i2b, ineg).`\n\n`i2c` 指令是类型安全的，当且仅当等效 `ineg`\
  \ 指令是类型安全的。\n\n点击此处查看代码图像\n\n`instructionHasEquivalentTypeRule(i2c, ineg).`\n\n\
  `i2d` 指令是类型安全的，如果可以从输入的操作数栈上弹出 `int` 并将其替换为 `double` 以产生输出类型状态。\n\n点击此处查看代码图像\n\n\
  ```javascript\ninstructionIsTypeSafe(i2d, Environment, _Offset, StackFrame,\n  \
  \                            NextStackFrame, ExceptionStackFrame) :-\n    validTypeTransition(Environment,\
  \ [int], double,\n                              StackFrame, NextStackFrame),\n \
  \   exceptionStackFrame(StackFrame, ExceptionStackFrame).\n```\n\n`i2f` 指令是类型安全的，如果可以从输入的操作数栈上弹出\
  \ `int` 并将其替换为 `float` 以产生输出类型状态。\n\n点击此处查看代码图像\n\n```javascript\ninstructionIsTypeSafe(i2f,\
  \ Environment, _Offset, StackFrame,\n                              NextStackFrame,\
  \ ExceptionStackFrame) :-\n    validTypeTransition(Environment, [int], float,\n\
  \                              StackFrame, NextStackFrame),\n    exceptionStackFrame(StackFrame,\
  \ ExceptionStackFrame).\n```\n\n`i2l` 指令是类型安全的，如果可以从输入的操作数栈上弹出 `int` 并将其替换为 `long`\
  \ 以产生输出类型状态。\n\n点击此处查看代码图像\n\n```javascript\ninstructionIsTypeSafe(i2l, Environment,\
  \ _Offset, StackFrame,\n                              NextStackFrame, ExceptionStackFrame)\
  \ :-\n    validTypeTransition(Environment, [int], long,\n                      \
  \        StackFrame, NextStackFrame),\n    exceptionStackFrame(StackFrame, ExceptionStackFrame).\n\
  ```\n\n`i2s` 指令是类型安全的，当且仅当等效 `ineg` 指令是类型安全的。\n\n点击此处查看代码图像\n\n`instructionHasEquivalentTypeRule(i2s,\
  \ ineg).`\n\n### iadd\n\n`iadd` 指令是类型安全的，当且仅当可以从输入的操作数栈上将匹配 `int` 和 `int` 的类型替换为\
  \ `int` 以产生输出类型状态。\n\n点击此处查看代码图像\n\n```javascript\ninstructionIsTypeSafe(iadd, Environment,\
  \ _Offset, StackFrame,\n                              NextStackFrame, ExceptionStackFrame)\
  \ :-\n    validTypeTransition(Environment, [int, int], int,\n                  \
  \            StackFrame, NextStackFrame),\n    exceptionStackFrame(StackFrame, ExceptionStackFrame).\n\
  ```\n\n### iaload\n\n\n\n\n\n一个 `iaload` 指令是类型安全的，当且仅当可以有效地将输入操作数栈上匹配 `int` 和 `int`\
  \ 数组的类型替换为 `int`，并产生输出的类型状态。\n\n点击此处代码图像\n\n```java\ninstructionIsTypeSafe(iaload,\
  \ Environment, _Offset, StackFrame, NextStackFrame, ExceptionStackFrame) :-\n  \
  \  validTypeTransition(Environment, [int, arrayOf(int)], int, StackFrame, NextStackFrame),\n\
  \    exceptionStackFrame(StackFrame, ExceptionStackFrame).\n```\n\n### iand\n\n\
  一个 `iand` 指令是类型安全的，当且仅当等效的 `iadd` 指令是类型安全的。\n\n点击查看代码图像\n\n```java\ninstructionHasEquivalentTypeRule(iand,\
  \ iadd).\n```\n\n### iastore\n\n一个 `iastore` 指令是类型安全的，当且仅当可以从输入操作数栈上有效地弹出匹配 `int`、`int`\
  \ 和 `int` 数组的类型，并产生输出的类型状态。\n\n点击查看代码图像\n\n```java\ninstructionIsTypeSafe(iastore,\
  \ _Environment, _Offset, StackFrame, NextStackFrame, ExceptionStackFrame) :-\n \
  \   canPop(StackFrame, [int, int, arrayOf(int)], NextStackFrame),\n    exceptionStackFrame(StackFrame,\
  \ ExceptionStackFrame).\n```\n\n### if_acmp<cond>\n\n一个 `if_acmpeq` 指令是类型安全的，当且仅当可以有效地从输入操作数栈上弹出匹配\
  \ `reference` 和 `reference` 的类型并产生输出的类型状态 `NextStackFrame`，且该指令的操作数 `Target` 在假设输入类型状态为\
  \ `NextStackFrame` 的情况下是一个跳转目标。\n\n点击查看代码图像\n\n```java\ninstructionIsTypeSafe(if_acmpeq(Target),\
  \ Environment, _Offset, StackFrame, NextStackFrame, ExceptionStackFrame) :-\n  \
  \  canPop(StackFrame, [reference, reference], NextStackFrame),\n    targetIsTypeSafe(Environment,\
  \ NextStackFrame, Target),\n    exceptionStackFrame(StackFrame, ExceptionStackFrame).\n\
  ```\n\n`if_acmpne` 的规则是相同的。\n\n点击查看代码图像\n\n```java\ninstructionHasEquivalentTypeRule(if_acmpne(Target),\
  \ if_acmpeq(Target)).\n```\n\n### if_icmp<cond>\n\n一个 `if_icmpeq` 指令是类型安全的，当且仅当可以有效地从输入操作数栈上弹出匹配\
  \ `int` 和 `int` 的类型并产生输出的类型状态 `NextStackFrame`，且该指令的操作数 `Target` 在假设输入类型状态为 `NextStackFrame`\
  \ 的情况下是一个跳转目标。\n\n点击查看代码图像\n\n```java\ninstructionIsTypeSafe(if_icmpeq(Target),\
  \ Environment, _Offset, StackFrame, NextStackFrame, ExceptionStackFrame) :-\n  \
  \  canPop(StackFrame, [int, int], NextStackFrame),\n    targetIsTypeSafe(Environment,\
  \ NextStackFrame, Target),\n    exceptionStackFrame(StackFrame, ExceptionStackFrame).\n\
  ```\n\n所有其他变体 `if_icmp<cond>` 指令的规则都是相同的。\n\n点击查看代码图像\n\n```java\ninstructionHasEquivalentTypeRule(if_icmpge(Target),\
  \ if_icmpeq(Target)).\ninstructionHasEquivalentTypeRule(if_icmpgt(Target), if_icmpeq(Target)).\n\
  instructionHasEquivalentTypeRule(if_icmple(Target), if_icmpeq(Target)).\ninstructionHasEquivalentTypeRule(if_icmplt(Target),\
  \ if_icmpeq(Target)).\ninstructionHasEquivalentTypeRule(if_icmpne(Target), if_icmpeq(Target)).\n\
  ```\n\n### if<cond>\n\n一个 `ifeq` 指令是类型安全的，当且仅当可以有效地从输入操作数栈上弹出匹配 `int` 的类型并产生输出的类型状态\
  \ `NextStackFrame`，且该指令的操作数 `Target` 在假设输入类型状态为 `NextStackFrame` 的情况下是一个跳转目标。\n\n\
  点击查看代码图像\n\n```java\ninstructionIsTypeSafe(ifeq(Target), Environment, _Offset, StackFrame,\
  \ NextStackFrame, ExceptionStackFrame) :-\n    canPop(StackFrame, [int], NextStackFrame),\n\
  \    targetIsTypeSafe(Environment, NextStackFrame, Target),\n    exceptionStackFrame(StackFrame,\
  \ ExceptionStackFrame).\n```\n\n所有其他 `if<cond>` 指令的规则都是相同的。\n\n点击查看代码图像\n\n```java\n\
  instructionHasEquivalentTypeRule(ifge(Target), ifeq(Target)).\ninstructionHasEquivalentTypeRule(ifgt(Target),\
  \ ifeq(Target)).\ninstructionHasEquivalentTypeRule(ifle(Target), ifeq(Target)).\n\
  instructionHasEquivalentTypeRule(iflt(Target), ifeq(Target)).\ninstructionHasEquivalentTypeRule(ifne(Target),\
  \ ifeq(Target)).\n```\n\n### ifnonnull\n\n一个 `ifnonnull` 指令是类型安全的，当且仅当可以有效地从输入操作数栈上弹出匹配\
  \ `reference` 的类型并产生输出的类型状态 `NextStackFrame`，且该指令的操作数 `Target` 在假设输入类型状态为 `NextStackFrame`\
  \ 的情况下是一个跳转目标。\n\n点击查看代码图像\n\n```java\ninstructionIsTypeSafe(ifnonnull(Target),\
  \ Environment, _Offset, StackFrame, NextStackFrame, ExceptionStackFrame) :-\n  \
  \  canPop(StackFrame, [reference], NextStackFrame),\n    targetIsTypeSafe(Environment,\
  \ NextStackFrame, Target),\n    exceptionStackFrame(StackFrame, ExceptionStackFrame).\n\
  ```\n\n### ifnull\n\n一个 `ifnull` 指令是类型安全的，当且仅当等效的 `ifnonnull` 指令是类型安全的。\n\n点击查看代码图像\n\
  \n```java\ninstructionHasEquivalentTypeRule(ifnull(Target), ifnonnull(Target)).\n\
  ```\n\n### iinc\n\n第一个操作数为 `Index` 的 `iinc` 指令是类型安全的，当且仅当 `L[Index]` 的类型为 `int`。`iinc`\
  \ 指令不会改变类型状态。\n\n点击查看代码图像\n\n```java\ninstructionIsTypeSafe(iinc(Index, _Value),\
  \ _Environment, _Offset, StackFrame, StackFrame, ExceptionStackFrame) :-\n    StackFrame\
  \ = frame(Locals, _OperandStack, _Flags),\n    nth0(Index, Locals, int),\n    exceptionStackFrame(StackFrame,\
  \ ExceptionStackFrame).\n```\n\n### iload, iload_<n>\n\n如果操作数为 `Index` 且类型为 `int`\
  \ 的加载指令是类型安全的并输出类型状态 `NextStackFrame`，则操作数为 `Index` 的 `iload` 指令也是类型安全的并产生输出类型状态\
  \ `NextStackFrame`。\n\n点击查看代码图像\n\n```java\ninstructionIsTypeSafe(iload(Index),\
  \ Environment, _Offset, StackFrame, NextStackFrame, ExceptionStackFrame) :-\n  \
  \  loadIsTypeSafe(Environment, Index, int, StackFrame, NextStackFrame),\n    exceptionStackFrame(StackFrame,\
  \ ExceptionStackFrame).\n```\n\n对于 $0 \\le n \\le 3$，指令 `iload_<n>` 是类型安全的，当且仅当等效的\
  \ `iload` 指令是类型安全的。\n\n点击此处的查看代码图像\n\n```java\ninstructionHasEquivalentTypeRule(iload_0,\
  \ iload(0)).\ninstructionHasEquivalentTypeRule(iload_1, iload(1)).\ninstructionHasEquivalentTypeRule(iload_2,\
  \ iload(2)).\ninstructionHasEquivalentTypeRule(iload_3, iload(3)).\n```\n\n### imul\n\
  \n一个 `imul` 指令是类型安全的，当且仅当等效的 `iadd` 指令是类型安全的。\n\n点击查看代码图像\n\n```java\ninstructionHasEquivalentTypeRule(imul,\
  \ iadd).\n```\n\n### ineg\n\n一个 `ineg` 指令是类型安全的，当且仅当输入操作数栈上存在匹配 `int` 的类型。`ineg`\
  \ 指令不会改变类型状态。\n\n点击查看代码图像\n\n```java\ninstructionIsTypeSafe(ineg, Environment, _Offset,\
  \ StackFrame, NextStackFrame, ExceptionStackFrame) :-\n    validTypeTransition(Environment,\
  \ [int], int, StackFrame, NextStackFrame),\n    exceptionStackFrame(StackFrame,\
  \ ExceptionStackFrame).\n```\n\n### instanceof\n\n操作数为 `CP` 的 `instanceof` 指令是类型安全的，当且仅当\
  \ `CP` 指向常量池中表示类或数组的条目，且可以有效地将输入操作数栈顶部的 `Object` 类型替换为 `int` 类型并产生输出的类型状态。\n\n\n\
  \n\n\n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(instanceof(CP), Environment,\
  \ _Offset, StackFrame,\n                      NextStackFrame, ExceptionStackFrame)\
  \ :-\n  (CP = class(_, _) ; CP = arrayOf(_)),\n  isBootstrapLoader(BL),\n  validTypeTransition(Environment,\
  \ [class('java/lang/Object'), BL], int,\n                              StackFrame,NextStackFrame),\n\
  \  exceptionStackFrame(StackFrame, ExceptionStackFrame).\n```\n\n### invokedynamic\n\
  \n`invokedynamic` 指令当且仅当满足以下所有条件时，它是类型安全的：\n\n- 它的第一个操作数 `CP` 指向一个常量池项，该项表示一个名为\
  \ `CallSiteName`、描述符为 `Descriptor` 的动态调用点。\n- `CallSiteName` 不是 `<init>`。\n- `CallSiteName`\
  \ 不是 `<clinit>`。\n- 可以有效地将输入操作数栈上匹配 `Descriptor` 中给出的参数类型的类型替换为 `Descriptor` 中给出的返回类型，从而得到输出类型状态。\n\
  \n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(invokedynamic(CP,0,0), Environment,\
  \ _Offset,\n                              StackFrame, NextStackFrame, ExceptionStackFrame)\
  \ :-\n  CP = dmethod(CallSiteName, Descriptor),\n  CallSiteName \\= '<init>',\n\
  \  CallSiteName \\= '<clinit>',\n  parseMethodDescriptor(Descriptor, OperandArgList,\
  \ ReturnType),\n  reverse(OperandArgList, StackArgList),\n  validTypeTransition(Environment,\
  \ StackArgList, ReturnType,\n                              StackFrame, NextStackFrame),\n\
  \  exceptionStackFrame(StackFrame, ExceptionStackFrame).\n```\n\n### invokeinterface\n\
  \n`invokeinterface` 指令当且仅当满足以下所有条件时，它是类型安全的：\n\n- 它的第一个操作数 `CP` 指向一个常量池项，该项表示一个名为\
  \ `MethodName`、描述符为 `Descriptor` 的接口方法，该方法是接口 `MethodIntfName` 的成员。\n- `MethodName`\
  \ 不是 `<init>`。\n- `MethodName` 不是 `<clinit>`。\n- 它的第二个操作数 `Count` 是一个有效的计数操作数（见下文）。\n\
  - 可以有效地将输入操作数栈上匹配类型 `MethodIntfName` 以及 `Descriptor` 中给出的参数类型的类型替换为 `Descriptor`\
  \ 中给出的返回类型，从而得到输出类型状态。\n\n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(invokeinterface(CP,\
  \ Count, 0), Environment, _Offset,\n                              StackFrame, NextStackFrame,\
  \ ExceptionStackFrame) :-\n  CP = imethod(MethodIntfName, MethodName, Descriptor),\n\
  \  MethodName \\= '<init>',\n  MethodName \\= '<clinit>',\n  parseMethodDescriptor(Descriptor,\
  \ OperandArgList, ReturnType),\n  currentClassLoader(Environment, L),\n  reverse([class(MethodIntfName,\
  \ L) | OperandArgList], StackArgList),\n  canPop(StackFrame, StackArgList, TempFrame),\n\
  \  validTypeTransition(Environment, [], ReturnType, TempFrame, NextStackFrame),\n\
  \  countIsValid(Count, StackFrame, TempFrame),\n  exceptionStackFrame(StackFrame,\
  \ ExceptionStackFrame).\n```\n\n`invokeinterface` 指令的 `Count` 操作数当它等于该指令参数的大小时是有效的。这等于\
  \ `InputFrame` 的大小与 `OutputFrame` 大小之间的差。\n\n点击此处查看代码图像\n\n```prolog\ncountIsValid(Count,\
  \ InputFrame, OutputFrame) :-\n  InputFrame = frame(_Locals1, OperandStack1, _Flags1),\n\
  \  OutputFrame = frame(_Locals2, OperandStack2, _Flags2),\n  length(OperandStack1,\
  \ Length1),\n  length(OperandStack2, Length2),\n  Count := Length1 - Length2.\n\
  ```\n\n### invokespecial\n\n`invokespecial` 指令当且仅当满足以下所有条件时，它是类型安全的：\n\n- 它的第一个操作数\
  \ `CP` 指向一个常量池项，该项表示一个名为 `MethodName`、描述符为 `Descriptor` 的方法，该方法是类 `MethodClassName`\
  \ 的成员。\n- 满足以下之一：\n    - `MethodName` 不是 `<init>`。\n    - `MethodName` 不是 `<clinit>`。\n\
  \    - 可以有效地将输入操作数栈上匹配当前类以及 `Descriptor` 中给出的参数类型的类型替换为 `Descriptor` 中给出的返回类型。\n\
  - 可以有效地将输入操作数栈上匹配 `MethodClassName` 以及 `Descriptor` 中给出的参数类型的类型替换为 `Descriptor`\
  \ 中给出的返回类型。\n\n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(invokespecial(CP),\
  \ Environment, _Offset, StackFrame,\n                      NextStackFrame, ExceptionStackFrame)\
  \ :-\n  CP = method(MethodClassName, MethodName, Descriptor),\n  MethodName \\=\
  \ '<init>',\n  MethodName \\= '<clinit>',\n  parseMethodDescriptor(Descriptor, OperandArgList,\
  \ ReturnType),\n  thisClass(Environment, class(CurrentClassName, L)),\n  reverse([class(MethodClassName,\
  \ L) | OperandArgList], StackArgList),\n  validTypeTransition(Environment, StackArgList,\
  \ ReturnType,\n                              StackFrame, NextStackFrame),\n  reverse([class(MethodClassName,\
  \ L) | StackArgList], StackArg2),\n  validTypeTransition(Environment, StackArg2,\
  \ ReturnType,\n                              StackFrame, _ResultFrame),\n  isAssignable(class(CurrentClassName,\
  \ L), class(MethodClassName, L)),\n  exceptionStackFrame(StackFrame, ExceptionStackFrame).\n\
  - 或者：\n    - `MethodName` 是 `<init>`。\n    - `Descriptor` 指定了 `void` 返回类型。\n   \
  \ - 可以有效地从输入操作数栈上弹出匹配 `Descriptor` 中给出的参数类型以及一个未初始化的类型 `UninitializedArg`，得到 `OperandStack`。\n\
  \    - 输出类型状态通过从输入类型状态推导得出，方法是先将输入操作数栈替换为 `OperandStack`，然后将所有 `UninitializedArg`\
  \ 实例替换为正在初始化的实例的类型。\n\n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(invokespecial(CP),\
  \ Environment, _Offset, StackFrame,\n                      NextStackFrame, ExceptionStackFrame)\
  \ :-\n  CP = method(MethodClassName, '<init>', Descriptor),\n  parseMethodDescriptor(Descriptor,\
  \ OperandArgList, void),\n  reverse(OperandArgList, StackArgList),\n  canPop(StackFrame,\
  \ StackArgList, TempFrame),\n  TempFrame = frame(Locals, FullOperandStack),\n  FullOperandStack\
  \ = [UninitializedArg | OperandStack],\n  currentClassLoader(Environment, CurrentLoader),\n\
  \  rewrittenUninitializedType(UninitializedArg, Environment,\n                 \
  \                class(MethodClassName, CurrentLoader), This),\n  rewrittenInitializationFlags(UninitializedArg,\
  \ Flags, NextFlags),\n  substitute(UninitializedArg, This, OperandStack, NextOperandStack),\n\
  \  substitute(UninitializedArg, This, Locals, NextLocals),\n  NextStackFrame = frame(NextLocals,\
  \ NextOperandStack, NextFlags),\n  ExceptionStackFrame = frame(NextLocals, [], Flags),\n\
  \  passesProtectedCheck(Environment, MethodClassName, '<init>',\n              \
  \                Descriptor, NextStackFrame).\n```\n\n为了计算未初始化参数类型需要重写为什么类型，有两种情况：\n\
  \n- 如果我们正在构造函数内部初始化对象，其初始类型为 `uninitializedThis`。该类型将被重写为 `<init>` 方法的类型。\n- 第二种情况来自由\
  \ `new` 创建的对象初始化。未初始化参数类型被重写为 `MethodClass`，即 `<init>` 方法持有者的类型。我们检查 `Address` 处是否存在\
  \ `new` 指令。\n\n点击此处查看代码图像\n\n```prolog\nrewrittenUninitializedType(uninitializedThis,\
  \ Environment,\n                                 MethodClass, MethodClass) :-\n\
  \  MethodClass = class(MethodClassName, CurrentLoader),\n  thisClass(Environment,\
  \ MethodClass).\nrewrittenUninitializedType(uninitializedThis, Environment,\n  \
  \                               MethodClass, MethodClass) :-\n  MethodClass = class(MethodClassName,\
  \ CurrentLoader),\n  thisClass(Environment, class(thisClassName, thisLoader)).\n\
  ```\n\n\n\n\n\n```prolog\nsuperclassChain(thisClassName, thisLoader, [MethodClass\
  \ | Rest]).\n\nrewrittenUninitializedType(uninitialized(Address), Environment, MethodClass,\
  \ MethodClass) :-\n    allInstructions(Environment, Instructions),\n    member(instruction(Address,\
  \ new(MethodClass)), Instructions).\n\nrewrittenInitializationFlags(uninitializedThis,\
  \ _Flags, []).\nrewrittenInitializationFlags(uninitialized(_), Flags, Flags).\n\n\
  substitute(_Old, _New, [], []).\nsubstitute(Old, New, [Old | FromRest], [New | ToRest])\
  \ :-\n    substitute(Old, New, FromRest, ToRest).\nsubstitute(Old, New, [From1 |\
  \ FromRest], [From1 | ToRest]) :-\n    From1 \\= Old,\n    substitute(Old, New,\
  \ FromRest, ToRest).\n```\n\n`<init>` 方法的 `invokespecial` 规则是返回不同异常栈帧的唯一动机。担心在于，当在其构造函数初始化对象时，`invokespecial`\
  \ 可能会调用父类的 `<init>` 方法，而该调用可能会失败，导致 `this` 处于未初始化状态。这种情况无法使用 Java 编程语言的源码创建，但通过直接编写字节码可以创建。\n\
  \n在这种情况下，原始帧在局部变量 0 中持有一个未初始化的对象，并带有 `flagThisUninit` 标记。`invokespecial` 的正常终止会初始化未初始化的对象并关闭\
  \ `flagThisUninit` 标记。但如果 `<init>` 方法的调用抛出异常，未初始化的对象可能会处于部分初始化状态，并且需要被设置为永久不可用。这由一个包含损坏对象（局部变量的新值）和\
  \ `flagThisUninit` 标记（旧标记）的异常帧来表示。无法从一个带有 `flagThisUninit` 标记的看似已初始的对象变为正确初始化的对象，因此该对象是永久不可用的。\n\
  \n如果不是这种情况，异常栈帧的标记将始终与输入栈帧的标记相同。\n\n### invokestatic\n\n`invokestatic` 指令是类型安全的，当仅当满足所有条件时：\n\
  \n- 它的第一个操作数 `CP` 指向常量池项，该项表示一个名为 `MethodName` 且描述符为 `Descriptor` 的方法。\n- `MethodName`\
  \ 不为 `<init>`。\n- `MethodName` 不为 `<clinit>`。\n- 人可以有效地将输入操作栈上匹配 `Descriptor` 中给出的参数类型的类型替换为\
  \ `Descriptor` 中给出的返回类型，从而产生输出类型状态。\n\n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(invokestatic(CP),\
  \ Environment, _Offset, StackFrame, NextStackFrame, ExceptionStackFrame) :-\n  \
  \  CP = method(_MethodClassName, MethodName, Descriptor),\n    MethodName \\= '<init>',\n\
  \    MethodName \\= '<clinit>',\n    parseMethodDescriptor(Descriptor, OperandArgList,\
  \ ReturnType),\n    reverse(OperandArgList, StackArgList),\n    validTypeTransition(Environment,\
  \ StackArgList, ReturnType, StackFrame, NextStackFrame),\n    exceptionStackFrame(StackFrame,\
  \ ExceptionStackFrame).\n```\n\n### invokevirtual\n\n`invokevirtual` 指令是类型安全的，当仅当满足所有条件时：\n\
  \n- 它的第一个操作数 `CP` 指向常量池项，该项表示一个名为 `MethodName` 且描述符为 `Descriptor` 的方法，该方法是类 `MethodClassName`\
  \ 的成员。\n- `MethodName` 不为 `<init>`。\n- `MethodName` 不为 `<clinit>`。\n- 人可以有效地将输入操作栈上匹配类\
  \ `MethodClassName` 和 `Descriptor` 中给出的参数类型的类型替换为 `Descriptor` 中给出的返回类型，从而产生输出类型状态。\n\
  - 如果方法是 `protected`，则该用法符合访问 `protected` 成员的特殊规则（§4.10.1.8）。\n\n点击此处查看代码图像\n\n```prolog\n\
  instructionIsTypeSafe(invokevirtual(CP), Environment, _Offset, StackFrame, NextStackFrame,\
  \ ExceptionStackFrame) :-\n    CP = method(MethodClassName, MethodName, Descriptor),\n\
  \    MethodName \\= '<init>',\n    MethodName \\= '<clinit>',\n    parseMethodDescriptor(Descriptor,\
  \ OperandArgList, ReturnType),\n    reverse(OperandArgList, ArgList),\n    currentClassLoader(Environment,\
  \ L),\n    reverse([class(MethodClassName, L) | OperandArgList], StackArgList),\n\
  \    validTypeTransition(Environment, StackArgList, ReturnType, StackFrame, NextStackFrame),\n\
  \    canPop(StackFrame, ArgList, PoppedFrame),\n    passesCheck(Environment, MethodClassName,\
  \ MethodName, Descriptor, PoppedFrame),\n    exceptionStackFrame(StackFrame, ExceptionStackFrame).\n\
  ```\n\n### ior\n\n`ior` 指令是类型安全的，仅当等效的 `iadd` 指令是类型安全的时。\n\n点击此处查看代码图像\n\n```prolog\n\
  instructionHasEquivalentTypeRule(ior, iadd).\n```\n\n### irem\n\n`irem` 指令是类型安全的，仅当等效的\
  \ `iadd` 指令是类型安全的时。\n\n点击此处查看代码图像\n\n```prolog\ninstructionHasEquivalentTypeRule(irem,\
  \ iadd).\n```\n\n### ireturn\n\n`ireturn` 指令是类型安全的，如果封装方法的返回类型为 `int`，并且可以有效地从输入操作栈中弹出匹配\
  \ `int` 的类型。\n\n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(ireturn, _Offset,\
  \ StackFrame, ExceptionStackFrame) :-\n    thisReturnType(int),\n    canPop(StackFrame,\
  \ [int], _),\n    exceptionStackFrame(StackFrame, ExceptionStackFrame).\n```\n\n\
  ### ishl, ishr, iushr\n\n`ishl` 指令是类型安全的，仅当等效的 `iadd` 指令是类型安全的时。\n\n点击此处查看代码图像\n\
  \n```prolog\ninstructionHasEquivalentTypeRule(ishl, iadd).\n```\n\n`ishr` 指令是类型安全的，仅当等效的\
  \ `iadd` 指令是类型安全的时。\n\n点击此处查看代码图像\n\n```prolog\ninstructionHasEquivalentTypeRule(ishr,\
  \ iadd).\n```\n\n`iushr` 指令是类型安全的，仅当等效的 `iadd` 指令是类型安全的时。\n\n点击此处查看代码图像\n\n```prolog\n\
  instructionHasEquivalentTypeRule(iushr, iadd).\n```\n\n### istore, istore_<n>\n\n\
  操作数为 `Index` 的 `istore` 指令是类型安全的并产生输出类型状态 `NextStackFrame`，如果操作数为 `Index` 且类型为 `int`\
  \ 的存储指令是类型安全的并产生输出类型状态 `NextStackFrame`。\n\n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(istore(Index),\
  \ Environment, _Offset, StackFrame, NextStackFrame, ExceptionStackFrame) :-\n  \
  \  storeIsTypeSafe(Environment, Index, int, StackFrame, NextStackFrame),\n    exceptionStackFrame(StackFrame,\
  \ ExceptionStackFrame).\n```\n\n对于 0 ≤ `n` ≤ 3，指令 `istore_<n>`*，是类型安全的，仅当等效的 `istore`\
  \ 指令是类型安全的时。\n\n点击此处查看代码图像\n\n```prolog\ninstructionHasEquivalentTypeRule(istore_0,\
  \ istore(0)).\ninstructionHasEquivalentTypeRule(istore_1, istore(1)).\ninstructionHasEquivalentTypeRule(istore_2,\
  \ istore(2)).\ninstructionHasEquivalentTypeRule(istore_3, istore(3)).\n```\n\n###\
  \ isub\n\n`isub` 指令是类型安全的，仅当等效的 `iadd` 指令是类型安全的时。\n\n点击此处查看代码图像\n\n```prolog\ninstructionHasEquivalentTypeRule(isub,\
  \ iadd).\n```\n\n### ixor\n\n`ixor` 指令是类型安全的，仅当等效的 `iadd` 指令是类型安全的时。\n\n点击此处查看代码图像\n\
  \n```prolog\ninstructionHasEquivalentTypeRule(ixor, iadd).\n```\n\n### l2d, l2f,\
  \ l2i\n\n`l2d` 指令是类型安全的，如果人可以有效地从输入操作栈中弹出 `long` 并将其替换为 `double`，从而产生输出类型状态。\n\n\
  点击此处查看代码图像\n\n\n\n\n\n```prolog\ninstructionIsTypeSafe(l2d, Environment, _Offset,\
  \ StackFrame, NextStackFrame, ExceptionStackFrame) :-\n    validTypeTransition(Environment,\
  \ [long], double, StackFrame, NextStackFrame),\n    exceptionStackFrame(StackFrame,\
  \ ExceptionStackFrame).\n```\n\n如果 `l2f` 指令是类型安全的，当意味着可以从输入的操作数栈中有效弹出 `long` 并将其替换为\
  \ `float`，从而产生输出的类型状态。\n\n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(l2f, Environment,\
  \ _Offset, StackFrame, NextStackFrame, ExceptionStackFrame) :-\n    validTypeTransition(Environment,\
  \ [long], float, StackFrame, NextStackFrame),\n    exceptionStackFrame(StackFrame,\
  \ ExceptionStackFrame).\n```\n\n如果 `l2i` 指令是类型安全的，当且仅可以从输入的操作数栈中有效弹出 `long` 并将其替换为\
  \ `int`，从而产生输出的类型状态。\n\n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(l2i, Environment,\
  \ _Offset, StackFrame, NextStackFrame, ExceptionStackFrame) :-\n    validTypeTransition(Environment,\
  \ [long], int, StackFrame, NextStackFrame),\n    exceptionStackFrame(StackFrame,\
  \ ExceptionStackFrame).\n```\n\n### ladd\n\n如果 `ladd` 指令是类型安全的，当且仅当可以将输入的操作数栈上匹配\
  \ `long` 和 `long` 的类型有效替换为 `long`，从而产生输出的类型状态。\n\n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(ladd,\
  \ Environment, _Offset, StackFrame, NextStackFrame, ExceptionStackFrame) :-\n  \
  \  validTypeTransition(Environment, [long, long], long, StackFrame, NextStackFrame),\n\
  \    exceptionStackFrame(StackFrame, ExceptionStackFrame).\n```\n\n### laload\n\n\
  如果 `laload` 指令是类型安全的，当且仅当可以将输入的操作数栈上匹配 `int` 和 `long` 数组的类型有效替换为 `long`，从而产生输出的类型状态。\n\
  \n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(laload, Environment, _Offset, StackFrame,\
  \ NextStackFrame, ExceptionStackFrame) :-\n    validTypeTransition(Environment,\
  \ [int, arrayOf(long)], long, StackFrame, NextStackFrame),\n    exceptionStackFrame(StackFrame,\
  \ ExceptionStackFrame).\n```\n\n### land\n\n如果 `land` 指令是类型安全的，当且仅当等效的 `ladd` 指令是类型安全的。\n\
  \n点击此处查看代码图像\n\n```prolog\ninstructionHasEquivalentTypeRule(land, ladd).\n```\n\n\
  ### lastore\n\n如果 `lastore` 指令是类型安全的，当且仅当可以从输入的操作数栈中有效弹出匹配 `long`、`int` 和 `long`\
  \ 数组的类型，从而产生输出的类型状态。\n\n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(lastore,\
  \ Environment, _Offset, StackFrame, NextStackFrame, ExceptionStackFrame) :-\n  \
  \  canPop(StackFrame, [long, int, arrayOf(long)], NextStackFrame),\n    exceptionStackFrame(StackFrame,\
  \ ExceptionStackFrame).\n```\n\n### lcmp\n\n如果 `lcmp` 指令是类型安全的，当且仅当可以将输入的操作数栈上匹配\
  \ `long` 和 `long` 的类型有效替换为 `int`，从而产生输出的类型状态。\n\n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(lcmp,\
  \ Environment, _Offset, StackFrame, NextStackFrame, ExceptionStackFrame) :-\n  \
  \  validTypeTransition(Environment, [long, long], int, StackFrame, NextStackFrame),\n\
  \    exceptionStackFrame(StackFrame, ExceptionStackFrame).\n```\n\n### lconst_<n>\n\
  \n如果 `lconst_0` 指令是类型安全的，当可以向输入的操作数栈上有效推入类型 `long`，从而产生输出的类型状态。\n\n点击此处查看代码图像\n\n\
  ```prolog\ninstructionIsTypeSafe(lconst_0, Environment, _Offset, StackFrame, NextStackFrame,\
  \ ExceptionStackFrame) :-\n    validTypeTransition(Environment, [], long, StackFrame,\
  \ NextStackFrame),\n    exceptionStackFrame(StackFrame, ExceptionStackFrame).\n\
  ```\n\n如果 `lconst_1` 指令是类型安全的，当且仅当等效的 `lconst_0` 指令是类型安全的。\n\n点击此处查看代码图像\n\n```prolog\n\
  instructionHasEquivalentTypeRule(lconst_1, lconst_0).\n```\n\n### ldc, ldc_w, ldc2_w\n\
  \n操作数为 `CP` 的 `ldc` 指令是类型安全的，当且仅当 `CP` 指向一个表示 `Type` 类型实体的常量池项，其中 `Type` 是 `int`、`float`、`Class`、`java.lang.invoke.MethodType`\
  \ 或 `java.lang.invoke.MethodHandle`，且可以向输入的操作数栈上有效推入 `Type` 以产生输出的类型状态。\n\n点击此处查看代码图像\n\
  \n```prolog\ninstructionIsTypeSafe(ldc(CP), Environment, _Offset, StackFrame, NextStackFrame,\
  \ ExceptionStackFrame) :-\n    functor(CP, Tag, _),\n    isBootstrapLoader(BL),\n\
  \    member([Tag, Type], [\n        [int, int],\n        [float, float],\n     \
  \   [string, class('java/lang/String', BL)],\n        [classConst, class('java/lang/Class',\
  \ BL)],\n        [methodTypeConst, class('java/lang/invoke/MethodType', BL)],\n\
  \        [methodHandleConst, class('java/lang/invoke/MethodHandle', BL)]\n    ]),\n\
  \    validTypeTransition(Environment, [], Type, StackFrame, NextStackFrame),\n \
  \   exceptionStackFrame(StackFrame, ExceptionStackFrame).\n```\n\n如果 `ldc_w` 指令是类型安全的，当且仅当等效的\
  \ `ldc` 指令是类型安全的。\n\n点击此处查看代码图像\n\n```prolog\ninstructionHasEquivalentTypeRule(ldc_w,\
  \ ldc).\n```\n\n操作数为 `CP` 的 `ldc2_w` 指令是类型安全的，当且仅当 `CP` 指向一个表示 `Tag` 类型实体的常量池项，其中\
  \ `Tag` 是 `long` 或 `double`，且可以向输入的操作数栈上有效推入 `Tag` 以产生输出的类型状态。\n\n点击此处查看代码图像\n\n\
  ```prolog\ninstructionIsTypeSafe(ldc2_w(CP), Environment, _Offset, StackFrame, NextStackFrame,\
  \ ExceptionStackFrame) :-\n    functor(CP, Tag, _),\n    member(Tag, [long, double]),\n\
  \    validTypeTransition(Environment, [], Tag, StackFrame, NextStackFrame),\n  \
  \  exceptionStackFrame(StackFrame, ExceptionStackFrame).\n```\n\n### ldiv\n\n如果\
  \ `ldiv` 指令是类型安全的，当且仅当等效的 `ladd` 指令是类型安全的。\n\n点击此处查看代码图像\n\n```prolog\ninstructionHasEquivalentTypeRule(ldiv,\
  \ ladd).\n```\n\n### lload, lload_<n>\n\n操作数为 `Index` 的 `lload` 指令是类型安全的并产生输出的类型状态，如果操作数为\
  \ `Index` 且类型为 `long` 的加载是类型安全的并产生输出的类型状态。\n\n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(lload(Index),\
  \ Environment, _Offset, StackFrame, NextStackFrame, ExceptionStackFrame) :-\n  \
  \  loadIsTypeSafe(Environment, Index, long, StackFrame, NextStackFrame),\n    exceptionStackFrame(StackFrame,\
  \ ExceptionStackFrame).\n```\n\n对于 $0 \\le n \\le 3$ 的 `lload_<n>` 指令是类型安全的，当且仅当等效的\
  \ `lload` 指令是类型安全的。\n\n点击此处查看代码图像\n\n```prolog\ninstructionHasEquivalentTypeRule(lload_0,\
  \ lload(0)).\ninstructionHasEquivalentTypeRule(lload_1, lload(1)).\ninstructionHasEquivalentTypeRule(lload_2,\
  \ lload(2)).\ninstructionHasEquivalentTypeRule(lload_3, lload(3)).\n```\n\n### lmul\n\
  \n如果 `lmul` 指令是类型安全的，当且仅当等效的 `ladd` 指令是类型安全的。\n\n点击此处查看代码图像\n\n```prolog\ninstructionHasEquivalentTypeRule(lmul,\
  \ ladd).\n```\n\n### lneg\n\n如果 `lneg` 指令是类型安全的，当且仅当输入的操作数栈上存在匹配 `long` 类型。`lneg`\
  \ 指令不会改变类型状态。\n\n\n\n\n\n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(lneg, Environment,\
  \ _Offset, StackFrame,\n                      NextStackFrame, ExceptionStackFrame)\
  \ :-\n    validTypeTransition(Environment, [long], long,\n                     \
  \    StackFrame, NextStackFrame),\n    exceptionStackFrame(StackFrame, ExceptionStackFrame).\n\
  ```\n\n### lookupswitch\n\n一个 `lookupswitch` 指令是类型安全的，当且仅当它的键是有排序的，可以从输入的操作数栈中有效弹出\
  \ `int` 并产生一个新的类型状态 `BranchStackFrame`，并且在假设 `BranchStackFrame` 为其输入类型状态的情况下，指令的所有目标都是有效的跳转。\n\
  \n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(lookupswitch(Targets, Keys), Environment,\
  \ _, StackFrame,\n                      afterGoto, ExceptionStackFrame) :-\n   \
  \ sort(Keys, Keys),\n    canPop(StackFrame, [int], BranchStackFrame),\n    checklist(targetIsTypeSafe(Environment,\
  \ BranchStackFrame), Targets),\n    exceptionStackFrame(StackFrame, ExceptionStackFrame).\n\
  ```\n\n### lor\n\n一个 `lor` 指令是类型安全的，当且仅当等价 `ladd` 指令是类型安全的。\n\n点击此处查看代码图像\n\n```prolog\n\
  instructionHasEquivalentTypeRule(lor, ladd).\n```\n\n### lrem\n\n一个 `lrem` 指令是类型安全的，当且仅当等价\
  \ `ladd` 指令是类型安全的。\n\n点击此处查看代码图像\n\n```prolog\ninstructionHasEquivalentTypeRule(lrem,\
  \ ladd).\n```\n\n### lreturn\n\n一个 `lreturn` 指令是类型安全的，如果其包含的方法声明的返回类型为 `long`，并且可以从输入的操作数栈中有效弹出一个匹配\
  \ `long` 的类型。\n\n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(lreturn, Environment,\
  \ _Offset, StackFrame,\n                      afterGoto, ExceptionStackFrame) :-\n\
  \    thisMethodReturnType(Environment, long),\n    canPop(StackFrame, [long], _PoppedStackFrame),\n\
  \    exceptionStackFrame(StackFrame, ExceptionStackFrame).\n```\n\n### lshl, lshr,\
  \ lushr\n\n一个 `lshl` 指令是类型安全的，如果可以有效地将输入的操作数栈上的类型 `int` 和 `long` 替换为类型 `long` 并产生输出类型状态。\n\
  \n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(lshl, Environment, _Offset, StackFrame,\n\
  \                      NextStackFrame, ExceptionStackFrame) :-\n    validTypeTransition(Environment,\
  \ [int, long], long,\n                         StackFrame, NextStackFrame),\n  \
  \  exceptionStackFrame(StackFrame, ExceptionStackFrame).\n```\n\n一个 `lshr` 指令是类型安全的，当且仅当等价\
  \ `lshl` 指令是类型安全的。\n\n点击此处查看代码图像\n\n```prolog\ninstructionHasEquivalentTypeRule(lshr,\
  \ lshl).\n```\n\n一个 `lushr` 指令是类型安全的，当且仅当等价 `lshl` 指令是类型安全的。\n\n点击此处查看代码图像\n\n```prolog\n\
  instructionHasEquivalentTypeRule(lushr, lshl).\n```\n\n### lstore, lstore_<n>\n\n\
  如果操作数为 `Index` 且类型为 `long` 的存储指令是类型安全的，并产生输出类型状态 `NextStackFrame`，则操作数为 `Index`\
  \ 的 `lstore` 指令是类型安全的并产生输出类型状态 `NextStackFrame`。\n\n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(lstore(Index),\
  \ Environment, _Offset, StackFrame,\n                      NextStackFrame, ExceptionStackFrame)\
  \ :-\n    storeIsSafe(Environment, Index, long, StackFrame, NextStackFrame),\n \
  \   exceptionStackFrame(StackFrame, ExceptionStackFrame).\n```\n\n对于 `0 ≤ n ≤ 3`\
  \ 的 `store_<n>` 指令是类型安全的，当且仅当等价的 `lstore` 指令是类型安全的。\n\n点击此处查看代码图像\n\n```prolog\n\
  instructionHasEquivalentTypeRule(lstore_0, lstore(0)).\ninstructionHasEquivalentTypeRule(lstore_1,\
  \ lstore(1)).\ninstructionHasEquivalentTypeRule(lstore_2, lstore(2)).\ninstructionHasEquivalentTypeRule(lstore_3,\
  \ lstore(3)).\n```\n\n### lsub\n\n一个 `sub` 指令是类型安全的，当且仅当等价 `ladd` 指令是类型安全的。\n\n\
  点击此处查看代码图像\n\n```prolog\ninstructionHasEquivalentTypeRule(sub, ladd).\n```\n\n###\
  \ lxor\n\n一个 `lxor` 指令是类型安全的，当且仅当等价 `ladd` 指令是类型安全的。\n\n点击此处查看代码图像\n\n```prolog\n\
  instructionHasEquivalentTypeRule(lxor, ladd).\n```\n\n### monitorenter\n\n一个 `monitorenter`\
