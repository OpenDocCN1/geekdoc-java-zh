  \ `wide` 指令（*wide*）结合使用，使用双字节无符号索引访问本地变量。\n\n### iload_<n>\n\n#### 操作\n从局部变量加载 `int`\n\
  \n#### 格式\n![Image](img/463fig01.jpg)\n\n#### 形式\n`iload_0` = 26 (0x1a)\n`iload_1`\
  \ = 27 (0x1b)\n`iload_2` = 28 (0x1c)\n`iload_3` = 29 (0x1d)\n\n### 操作数\n... →\n\n\
