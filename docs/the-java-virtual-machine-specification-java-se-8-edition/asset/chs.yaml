  \ 项的值指定哪个类型参数声明。`type_parameter_index` 值为 `0` 指定第一个类型参数声明。\n\n- `supertype_target`\
  \ 项表示注解出现在类或接口声明中 `extends` 或 `implements` 子句中的类型上。\n\n```\nsupertype_target {\n\
  \    u2 supertype_index;\n}\n```\n\n`supertype_index` 值为 65535 表示注解出现在类声明中 `extends`\
