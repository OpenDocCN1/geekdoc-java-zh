  \n（此处省略原文中大量重复的描述）\n\n\n\n\n\n-   `catch_target` 项表示注解出现在异常参数声明中的第 `i` 个类型上。\n\n\
  ```\ncatch_target {\n    u2 exception_table_index;\n}\n```\n\n`exception_table_index`\
  \ 项的值是 `Code` 属性中包含的 `RuntimeVisibleTypeAnnotations` 属性的包围的 `exception_table` 数组的索引。\n\
  \n异常参数声明中可能出现多个类型，这是由于 `try` 语句的多 `catch` 子句引起的，在这种情况下，异常参数的类型是类型的联合类型（JLS §14.20）。编译器通常为联合类型中的每个类型创建一个\
  \ `exception_table` 条目，这使得 `catch_target` 项能够区分它们。这保持了类型与其注解之间的对应关系。\n\n-   `offset_target`\
  \ 项表示注解出现在 `instanceof` 表达式中的类型、`new` 表达式中的类型，或者方法引用表达式中 `::` 之前的类型上。\n\n```\noffset_target\
  \ {\n    u2 offset;\n}\n```\n\n`offset` 项的值指定了 `code` 数组的偏移量，该偏移量对应于 `instanceof`\
  \ 表达式的 `instanceof` 字节码指令、`new` 表达式的 `new` 字节码指令，或者方法引用表达式的字节码指令。\n\n-   `type_argument_target`\
  \ 项表示注解出现在转换表达式中的第 `i` 个类型，或者出现在以下任何一项的显式类型参数列表中的第 `i` 个类型参数：`new` 表达式、显式构造函数调用语句、方法调用表达式或方法引用表达式。\n\
  \n```\ntype_argument_target {\n    u2 offset;\n    u1 type_argument_index;\n}\n\
  ```\n\n`offset` 项的值指定了 `code` 数组的偏移量，对应于转换表达式的字节码指令、`new` 表达式的 `new` 字节码指令、显式构造函数调用语句的字节码指令、方法调用表达式的字节码指令或方法引用表达式的字节码指令。\n\
  \n对于转换表达式，`type_argument_index` 项的值指定转换运算符中哪个类型被标记了注解。`type_argument_index` 的值为\
  \ `0` 指定转换运算符中的第一个（或唯一的）类型。\n\n转换表达式中可能出现多个类型，这是转换为交集类型导致的。\n\n对于显式类型参数列表，`type_argument_index`\
  \ 项的值指定哪个类型参数被标记了注解。`type_argument_index` 的值为 `0` 指定第一个类型参数。\n\n### 4.7.20.2 type_path\
  \ 结构\n\n每当在声明或表达式中使用类型时，`type_path` 结构都会标识类型的哪部分被标记了注解。注解可能出现在类型本身，但如果该类型是引用类型，则存在注解可能出现的额外位置：\n\
  \n-   如果在声明或表达式中使用数组类型 `T[]`，则注解可以出现在数组类型的任何组件类型上，包括元素类型。\n-   如果在声明或表达式中使用嵌套类型\
  \ `T1.T2`，则注解可以出现在顶层类型的名称或任何成员类型的名称上。\n\n-   如果在声明或表达式中使用泛泛类型 `T<A>` 或 `T<? extends\
  \ A>` 或 `T<? super A>`，则注解可以出现在任何类型参数上，或任何通配符类型参数的边界上。\n\n例如，考虑 `String[][]` 在以下情况下被标记的不同部分：\n\
  \n点击此处查看代码图像\n\n```\n@Foo String[][]   // 标记了类 String\nString @Foo [][]   // 标记了数组类型\
  \ String[][]\nString[] @Foo []  // 标记了数组类型 String[]\n```\n\n或者嵌套类型 `Outer.Middle.Inner`\
  \ 在以下情况下标记的不同部分：\n\n```\n@Foo Outer.Middle.Inner\nOuter.@Foo Middle.Inner\nOuter.Middle.@Foo\
  \ Inner\n```\n\n或者泛型类型 `Map<String,Object>` 和 `List<...>` 在以下情况下被标记的不同部分：\n\n```\n\
  @Foo Map<String,Object>\nMap<@Foo String,Object>\nMap<String,@Foo Object>\nList<@Foo\
  \ ? extends String>\nList<? extends @Foo String>\n```\n\n`type_path` 结构具有以下格式：\n\
  \n点击此处查看代码图像\n\n```\ntype_path {\n    u1 path_length;\n    {\n        u1 type_path_kind;\n\
  \        u1 type_argument_index;\n    } path[path_length];\n}\n```\n\n`path_length`\
  \ 项的值给出 `path` 数组中的条目数：\n\n-   如果 `path_length` 的值为 `0`，则注解直接出现在类型本身。\n-   如果 `path_length`\
  \ 的值非零，则 `path` 数组中的每个条目代表从左到右指向数组类型、嵌套类型或泛型类型中注解精确位置的迭代步骤。在数组类型中，迭代访问数组类型，然后是它的组件类型，然后是该组件类型的组件类型，依此类推，直到到达元素类型。每个条目包含以下内容：`type_path_kind`\n\
  \n`type_path_kind` 的合法值见表 4.7.20.2。\n\n| `type_path_kind` | `type_argument_index`\
  \ | 描述 |\n| :--- | :--- | :--- |\n| 0 | - | 类型本身 |\n| 1 | - | 数组类型 |\n| 2 | - |\
  \ 嵌套类型 |\n| 3 | index | 泛型类型 |\n\n如果 `type_path_kind` 的值为 `0`、`1` 或 `2`，则 `type_argument_index`\
  \ 的值为 `0`。\n\n如果 `type_path_kind` 的值为 `3`，则 `type_argument_index` 指定泛型类型的哪个参数被标记，其中\
  \ `0` 表示第一个。\n\n#### 4.7.21 RuntimeTypeAnnotations 属性\n\n`RuntimeTypeAnnotations`\
  \ 属性是 `ClassFile`、`field_info` 或 `method_info` 结构或 `Code` 属性（§4.1、§4.5、§4.6、§4.7.3）中\
  \ `attributes` 表的变变属性。`RuntimeTypeAnnotations` 属性记录类、字段或方法的相应声明或方法体中表达式使用的类型运行时不可注解。`RuntimeTypeAnnotations`\
  \ 属性还记录泛型类、接口、方法和构造函数的类型参数声明的注解。\n\n`ClassFile`、`field_info` 或 `method_info` 结构或\
  \ `Code` 属性的 `attributes` 表中最多有一个 `RuntimeTypeAnnotations` 属性。\n\n只有当类型在与 `attributes`\
  \ 表的父级结构或属性对应的声明或表达式类型中被标记时，该 `attributes` 表才包含 `RuntimeTypeAnnotations` 属性。\n\n\
  `RuntimeInvisibleTypeAnnotations` 属性具有以下格式：\n\n```\nRuntimeInvisibleTypeAnnotations_attribute\
  \ {\n    u2 attribute_name_index;\n    u4 attribute_length;\n    u2 num_annotations;\n\
  \    type_annotation annotations[num_annotations];\n}\n```\n\n\n\n\n\n`RuntimeInvisibleTypeAnnotations_attribute`\
  \ 结构体的项如下：\n\n`attribute_name_index`\n\n`attribute_name_index` 项的值必须是 `constant_pool`\
  \ 表中的一个有效索引。该索引处的 `constant_pool` 条目必须是一个 `CONSTANT_Utf8_info` 结构，表示字符串“`RuntimeInvisibleTypeAnnotations`”。\n\
  \n`attribute_length`\n\n`attribute_length` 项的值表示该属性的长度，不包括初始的六个字节。\n\n`num_annotations`\n\
  \n`num_annotations` 项的值给出了结构体所表示的运行时不可见类型注解的数量。\n\n`annotations[]`\n\n`annotations`\
  \ 表中的每个条目代表声明或表达式中所用类型上的单个运行时不可见注解。`type_annotation` 结构详见 §4.7.20。\n\n### 4.7.22\
  \ AnnotationDefault 属性\n\n`AnnotationDefault` 属性是某些 `method_info` 结构 `attributes`\
  \ 表中的一种变长属性（§4.6），即那些代表注解类型元素的结构（JLS §9.6.1）。`AnnotationDefault` 属性记录了 `method_info`\
  \ 结构所表示的元素的默认值（JLS §9.6.2）。Java 虚拟机必须提供此默认值，以便能够通过适当的反射 API 调用。\n\n在一个 `method_info`\
  \ 结构的 `attributes` 表中，最多可以有一个代表注解类型元素的 `AnnotationDefault` 属性。\n\n`AnnotationDefault`\
  \ 属性具有以下格式：\n\n点击此处查看代码图像\n\n```\nAnnotationDefault_attribute {\n    u2        \
  \      attribute_name_index;\n    u4              attribute_length;\n    element_value\
  \ default_value;\n}\n```\n\n`AnnotationDefault_attribute` 结构体的项如下：\n\n`attribute_name_index`\n\
  \n`attribute_name_index` 项的值必须是 `constant_pool` 表中的一个有效索引。该索引处的 `constant_pool`\
  \ 条目必须是一个 `CONSTANT_Utf8_info` 结构（§4.4.7），表示字符串“`AnnotationDefault`”。\n\n`attribute_length`\n\
  \n`attribute_length` 项的值表示该属性的长度，不包括初始的六个字节。\n\n`default_value`\n\n`default_value`\
  \ 项表示包含该 `AnnotationDefault` 属性的 `method_info` 结构所表示的注解类型元素的默认值。\n\n### 4.7.23 BootstrapMethods\
  \ 属性\n\n`BootstrapMethods` 属性是 `ClassFile` 结构 `attributes` 表中的一种变长属性（§4.1）。`BootstrapMethods`\
  \ 属性记录了被 `invokedynamic` 指令引用的引导方法（（*invokedynamic*）。\n\n如果 `ClassFile` 结构的 `constant_pool`\
  \ 表至少有一个 `CONSTANT_InvokeDynamic_info` 条目（§4.4.10），则在 `ClassFile` 结构的 `attributes`\
  \ 表中必须恰好有一个 `BootstrapMethods` 属性。\n\n在一个 `ClassFile` 结构的 `attributes` 表中，最多可以有一个\
  \ `BootstrapMethods` 属性。\n\n`BootstrapMethods` 属性具有以下格式：\n\n点击此处查看代码图像\n\n```\n\
  BootstrapMethods_attribute {\n    u2 attribute_name_index;\n    u4 attribute_length;\n\
  \    u2 num_bootstrap_methods;\n    {\n        u2 bootstrap_method_ref;\n      \
  \  u2 num_bootstrap_arguments;\n        u2 bootstrap_arguments[num_bootstrap_arguments];\n\
  \    } bootstrap_methods[num_bootstrap_methods];\n}\n```\n\n`BootstrapMethods_attribute`\
  \ 结构体的项如下：\n\n`attribute_name_index`\n\n`attribute_name_index` 项的值必须是 `constant_pool`\
  \ 表中的一个有效索引。该索引处的 `constant_pool` 条目必须是一个 `CONSTANT_Utf8_info` 结构（§4.4.7），表示字符串“`BootstrapMethods`”。\n\
  \n`attribute_length`\n\n`attribute_length` 项的值表示该属性的长度，不包括初始的六个字节。因此，`attribute_length`\
  \ 项的值取决于该 `ClassFile` 结构中 `invokedynamic` 指令的数量。\n\n`num_bootstrap_methods`\n\n\
  `num_bootstrap_methods` 项的值决定了 `bootstrap_methods` 数组中引导方法标识的数量。\n\n`bootstrap_methods[]`\n\
  \n`bootstrap_methods` 表中的每个条目包含一个指向 `CONSTANT_MethodHandle_info` 结构的索引（§4.4.8），该结构指定了一个引导方法以及该引导方法的一系列参数。\n\
  \n`bootstrap_method_ref`\n\n`bootstrap_method_ref` 项的值必须是 `constant_pool` 表中的一个有效索引。该索引处的\
  \ `constant_pool` 条目必须是一个 `CONSTANT_MethodHandle_info` 结构。\n\n`num_bootstrap_arguments`\n\
  \n`num_bootstrap_arguments` 项的值给出了引导方法的参数数量。\n\n`bootstrap_arguments[]`\n\n`bootstrap_arguments`\
  \ 数组中的每个条目必须是 `constant_pool` 表中的一个有效索引。该索引处的 `constant_pool` 条目必须是 `CONSTANT_String_info`、`CONSTANT_Class_info`、`CONSTANT_Integer_info`、`CONSTANT_Long_info`、`CONSTANT_Float_info`、`CONSTANT_Double_info`、`CONSTANT_MethodHandle_info`\
  \ 或 `CONSTANT_MethodType_info` 结构。\n\n### 4.7.24 MethodParameters 属性\n\n`MethodParameters`\
  \ 属性是 `method_info` 结构 `attributes` 表中的一种变长属性（§4.6）。`MethodParameters` 属性记录了方法形式参数的信息，例如它们的名称。\n\
  \n在一个 `method_info` 结构的 `attributes` 表中，最多有一个 `MethodParameters` 属性。\n\n`MethodParameters`\
  \ 属性具有以下格式：\n\n点击此处查看代码图像\n\n```\nMethodParameters_attribute {\n    u2 attribute_name_index;\n\
  \    u4 attribute_length;\n    u1 parameters_count;\n    {\n        u2 name_index;\n\
  \        u2 access_flags;\n    } parameters[parameters_count];\n}\n```\n\n`MethodParameters_attribute`\
  \ 结构体的项如下：\n\n`attribute_name_index`\n\n`attribute_name_index` 项的值必须是 `constant_pool`\
  \ 表中的一个有效索引。该索引处的 `constant_pool` 条目必须是一个 `CONSTANT_Utf8_info` 结构，表示字符串“`MethodParameters`”。\n\
  \n`attribute_length`\n\n`attribute_length` 项的值表示该属性的长度，不包括初始的六个字节。\n\n`parameters_count`\n\
  \n`parameters_count` 项的值给出了方法形式参数的数量。\n\n\n\n\n\n`parameters_count` 项的值表示由属性所属的\
  \ `method_info` 结构体中的 `descriptor_index` 所引的方法描述符（§4.3.3）中参数描述符的数量。\n\n这不是 Java\
  \ 虚拟机实现在格式格式检查期间（§4.8）必须强制执行的约束。将方法描述符中的参数描述符与下方 `parameters` 数组中的项进行匹配的任务，是由 Java\
  \ SE 平台的反射库完成的。\n\n### `parameters[]`\n\n`parameters` 数组中的每个条目包含以下两个项：\n\n#### `name_index`\n\
  `name_index` 项的值必须是 0，要么是指向 `constant_pool` 表的有效索引。\n\n如果 `name_index` 项的值为 0，则该\
  \ `parameters` 元素表示一个没有名称的形式参数。\n\n如果 `name_index` 项的值非 0，则该索引处的 `constant_pool`\
  \ 条目必须是一个 `CONSTANT_Utf8_info` 结构体，表示形式参数的有效未限定名称（§4.2.2）。\n\n#### `access_flags`\n\
  `access_flags` 项的值如下：\n\n- `0x0010 (ACC_FINAL)`：表示该形式参数被声明为 `final`。\n- `0x1000\
  \ (ACC_SYNTHETIC)`：表示根据源代码编写的语言的规范（JLS §13.1），该形式参数没有被显式或隐式声明。（该形式参数是产生此 `class`\
  \ 文件的编译器的实现产物。）\n- `0x8000 (ACC_MANDATED)`：表示根据源代码编写的语言的规范（JLS §13.1），该形式参数在源代码中被隐式声明。（该形式参数是语言规范要求的，因此该语言的所有编译器必须生成它。）\n\
  \n`parameters` 数组中的第 *i* 个条目对应于所属方法描述符中的第 *i* 个参数描述符。（`parameters_count` 项占用一个字节，因为方法描述符被限制为\
  \ 255 个参数）。实际上，这意味着 `parameters` 数组存储了该方法所有参数的信息。可以想象其他方案，让 `parameters` 数组中的条目指定其对应的参数描述符，但这会过度地增加\
  \ `MethodParameters` 属性的复杂性。\n\n`parameters` 数组中的第 *i* 个条目可能对应于所属方法 `Signature`\
  \ 属性（如果存在）中的第 *i* 个类型，也可能对应于所属方法参数注解中的第 *i* 个注解。\n\n### 4.8 格式检查\n\n当一个可能的 `class`\
  \ 文件被 Java 虚拟机加载（§5.3）时，Java 虚拟机首先确保该文件具有 `class` 文件的基本格式（§4.1）。这一过程被称为*格式检查*。检查内容如下：\n\
  \n- 前四个字节必须包含正确的魔数（magic number）。\n- 所有识别的属性必须具有正确的长度。\n- `class` 文件不能被截断，也不能在末尾有额外的字节。\n\
  - 常量池必须满足 §4.4 中记录的约束。\n\n例如，常量池中的每个 `CONSTANT_Class_info` 结构体在其 `name_index` 项中必须包含指向\
  \ `CONSTANT_Utf8_info` 结构体的有效常量池索引。\n\n- 常量池中的所有字段引用和方法引用必须具有有效的名称、有效的类和有效的描述符（§4.3）。\n\
  \n格式检查并不保证给定的字段或方法实际上存在于给定的类中，也不保证给定的描述符指向真实的类。格式检查仅确保这些项是构造良好的。更详细的检查会在字节码本身被验证期间以及在解析（resolution）期间进行。\n\
  \n这些对基本 `class` 文件完整性的检查对于任何对 `class` 文件内容的解释都是必要的。格式检查与字节码验证是不同的，尽管在历史上它们经常被混淆，因为它们都是一种完整性检查。\n\
  \n### 4.9 Java 虚拟机代码的约束\n\n方法、实例初始化方法或类或接口初始化方法（§2.9）的代码存储在`class` 文件（§4.7.3）`method_info`\
  \ 结构`Code` 属性的 `code` 数组中。本节描述了与 `Code_attribute` 结构内容相关的约束。\n\n#### 4.9.1 静态约束\n\
  \n`class` 文件的*静态约束*是定义文件良好性的约束。这些约束在之前的章节中已经给出，但 `class` 文件中代码的静态约束除外。`class` 文件代码的静态约束规定了\
  \ Java 虚拟机指令必须如何在 `code` 数组中布局，以及单个指令的的操作数必须是什么。\n\n`code` 数组中指令的静态约束如下：\n\n- 只有\
  \ §6.5 中记录的指令实例可以出现在 `code` 数组中。\n- 使用保留操作码（§2）的指令实例不能出现在 `code` 数组中。\n\n如果 `class`\
  \ 文件版本号为 51 或更高，则 `jsr` 或 `jsr_w` 操作码均不能出现在 `code` 数组。\n\n- `code` 数组中第一条指令的操作码从\
  \ `0` 开始。\n- 对于 `code` 数组中的除最后一条外的每条指令，下一条指令的操作码索引等于当前指令的操作码索引加上该指令的长度。\n\n*wide*\
  \ 指令在这些目的上被视为任何其他指令；*wide* 指令要修改的操作码被该 *wide* 指令的操作数之一。\n\n- `code` 数组中最后一条指令的最后一个字节必须是\
  \ `code_length - 1` 处的字节。\n\n`code` 数组中操作数的静态约束如下：\n\n- 每个跳转和分支指令（`jsr`, `jsr_w`,\
  \ `goto`, `goto_w`, `ifeq`, `ifne`, `ifle`, `iflt`, `ifge`, `ifgt`, `ifnull`, `ifnonnull`,\
  \ `if_icmpeq`, `if_icmpne`, `if_icmple`, `if_icmplt`, `if_icmpge`, `if_icmpgt`,\
  \ `if_acmpeq`, `if_acmpne`）的目标必须是该方法内指令的操作码。\n\n跳转指令的目标不能是 *wide* 指令要修改的操作码；跳转或分支目标可以是\
  \ *wide* 指令本身。\n\n- 每个 `tableswitch` 指令的每个目标（包括默认目标）必须是该方法内指令的操作码。\n\n每个 `tableswitch`\
  \ 指令的跳转表项数与其 `low` 和 `high` 跳转表操作数的值一致，且其 `low` 值必须小于等于其 `high` 值。\n\n`tableswitch`\
  \ 指令的任何目标都不可能是 *wide* 指令要修改的操作码；*tableswitch* 目标可以是 *wide* 指令本身。\n\n- 每个 `lookupswitch`\
  \ 指令的每个目标（包括默认目标）必须是该方法内指令的操作码。\n\n每个 `lookupswitch` 指令的 *match-offset* 句数必须与其 `npairs`\
  \ 操作数的值一致。*match-offset* 句必须根据符号匹配值按数值递增顺序排列。\n\n`lookupswitch` 指令的任何目标都不可能是 *wide*\
  \ 指令要修改的操作码；*lookupswitch* 目标可以是 *wide* 指令本身。\n\n\n\n\n\n-   每个 `ldc` 指令和每个 `ldc_w`\
  \ 指令的操作数必须是 `constant_pool` 表的有效索引。由该索引引用的常量池项类型必须为：\n    - 如果 `class` 文件版本号小于 49.0，类型为\
  \ `CONSTANT_Integer`、`CONSTANT_Float` 或 `CONSTANT_String`。\n    - 如果 `class` 文件版本号为\
  \ 49.0 或 50.0，类型为 `CONSTANT_Integer`、`CONSTANT_Float`、`CONSTANT_String` 或 `CONSTANT_Class`。\n\
  \    - 如果 `class` 文件版本号为 51.0 及以上，类型为 `CONSTANT_Integer`、`CONSTANT_Float`、`CONSTANT_String`、`CONSTANT_Class`、`CONSTANT_MethodType`\
  \ 或 `CONSTANT_MethodHandle`。\n\n-   每个 `ldc2_w` 指令的操作数必须代表 `constant_pool` 表的有效索引。该索引引用的常量池项类型必须为\
  \ `CONSTANT_Long` 或 `CONSTANT_Double`。随后的常量池索引也必须是常量池的有效索引，且该索引处的常量池项不能被使用。\n\n\
  -   每个 `getfield`、`putfield`、`getstatic` 和 `putstatic` 指令的操作数必须代表 `constant_pool`\
  \ 表的有效索引。该索引引用的常量池项类型必须为 `CONSTANT_Fieldref`。\n\n-   每个 `invokevirtual` 指令的 `indexbyte`\
  \ 操作数必须代表 `constant_pool` 表的有效索引。该索引引用的常量池项类型必须为 `CONSTANT_Methodref`。\n\n-   每个\
  \ `invokespecial` 和 `invokestatic` 指令的 `indexbyte` 操作数必须代表 `constant_pool` 表的有效索引。如果\
  \ `class` 文件版本号小于 52.0，该索引引用的常量池项类型必须为 `CONSTANT_Methodref`；如果 `class` 文件版本号为 52.0\
  \ 及以上，该索引引用的常量池项类型必须为 `CONSTANT_Methodref` 或 `CONSTANT_InterfaceMethodref`。\n\n\
  -   每个 `invokeinterface` 指令的 `indexbyte` 操作数必须代表 `constant_pool` 表的有效索引。该索引引用的常量池项类型必须为\
  \ `CONSTANT_InterfaceMethodref`。每个 `invokeinterface` 指令的 `count` 操作数的值必须反映存储传递给接口方法的参数所需的局部变量数量，这由\
  \ `CONSTANT_InterfaceMethodref` 常量项引用的 `CONSTANT_NameAndType_info` 结构的描述符决定。每个 `invokeinterface`\
  \ 指令的第四个操作字节必须为零。\n\n-   每个 `invokedynamic` 指令的 `indexbyte` 操作数必须代表 `constant_pool`\
  \ 表的有效索引。该索引引用的常量池项类型必须为 `CONSTANT_InvokeDynamic`。每个 `invokedynamic` 指令的第三和第四个操作字节必须为零。\n\
  \n-   仅允许 `invokespecial` 指令调用实例化方法。其他以字符 `<`（`\\u003c`）开头的方法均不能通过方法调用指令调用。特别是，特殊命名为\
  \ `<clinit>` 的类或接口初始化方法永远不会通过 虚拟机指令显式调用，而仅由 虚拟机本身隐式调用。\n\n-   每个 `instanceof`、`checkcast`、`new`\
  \ 和 `anewarray` 指令的操作数，以及每个 `multianewarray` 指令的 `indexbyte` 操作数，必须代表 `constant_pool`\
  \ 表的有效索引。该索引引用的常量池项类型必须为 `CONSTANT_Class`。\n\n-   任何 `new` 指令不能引用数组类型的 `CONSTANT_Class`\
  \ 类型常量池项。`new` 指令不能用于创建数组。\n\n-   任何 `anewarray` 指令不能创建超过 255 维的数组。\n\n-   `multianewarray`\
  \ 指令仅用于创建维度至少等于其 `dimensions` 操作数值的类型的数组。也就是说，虽然 `multianewarray` 指令不需要创建其 `indexbyte`\
  \ 操作数引用的数组类型的所有维度，但它不能尝试创建超过数组类型维度的维度。每个 `multianewarray` 指令的 `dimensions` 操作数不能为零。\n\
  \n-   每个 `newarray` 指令的 `atype` 操作数必须取以下值之一：`T_BOOLEAN` (4)、`T_CHAR` (5)、`T_FLOAT`\
  \ (6)、`T_DOUBLE` (7)、`T_BYTE` (8)、`T_SHORT` (9)、`T_INT` (10) 或 `T_LONG` (11)。\n\n\
  -   每个 `iload`、`fload`、`aload`、`istore`、`fstore`、`astore`、`iinc` 和 `ret` 指令的 `index`\
  \ 操作数必须是不大于 `max_locals - 1` 的非负整数。每个 `iload_<n>`、`fload_<n>`、`aload_<n>`、`istore_<n>`、`fstore_<n>`\
  \ 和 `astore_<n>` 指令的隐式索引不能大于 `max_locals -1`。\n\n-   每个 `lload`、`dload`、`lstore`\
  \ 和 `dstore` 指令的 `index` 操作数不能大于 `max_locals - 2`。每个 `lload_<n>`、`dload_<n>`、`lstore_<n>`\
  \ 和 `dstore_<n>` 指令的隐式索引不能大于 `max_locals - 2`。\n\n-   每个 `wide` 指令修改 `iload`、`fload`、`aload`、`istore`、`fstore`、`astore`、`iinc`\
  \ 或 `ret` 的 `indexbyte` 操作数必须代表一个小于 `max_locals - 1` 的非负整数。每个 `wide` 指令修改 `lload`、`dload`、`lstore`\
  \ 或 `dstore` 的 `indexbyte` 操作数必须代表一个小于 `max_locals - 2` 的非负整数。\n\n### 4.9.2 结构约束\n\
  \n`code` 数组的结构约束规定了指令之间的关系。结构约束如下：\n\n-   每个指令必须在操作栈和局部变量数组具有正确的类型和数量的情况下执行，无论执行路径如何。操作\
  \ `int` 类型值的指令也允许操作 `boolean`、`byte`、`char` 和 `short`。正如所述，虚拟机内部 `boolean`、`byte`、`short`\
  \ 和 `char` 类型转换为 `int`。\n\n-   如果一个指令可以通过不同的执行路径执行，则在执行该指令之前的操作栈深度必须相同，无论采取何种路径。\n\
  \n-   在执行过程中，操作栈的深度不能超过 `max_stack` 项所启的深度。\n\n-   在执行过程中，从操作栈弹出的值不能多于其包含的值。\n\n\
  -   在执行过程中，持有 `long` 或 `double` 类型值的局部变量对的顺序不能反转或拆分。不能对该对的局部变量进行单独操作。\n\n-   在赋值之前，不能访问任何局部变量（或局部变量对）。\n\
  \n-   每个 `invokespecial` 指令必须命名实例化方法、当前类或接口的方法、父类的方法或 `Object` 方法。调用实例化方法时，未实例化的类实例必须位于操作栈适当的位置。永远不能在已实例化的类实例上调用实例化方法。如果\
  \ `invokespecial` 指令命名的是实例化方法且操作栈上的目标引用是未实例化的类实例，则 `invokespecial` 必须命名当前类或其直接父类的实例化方法。\n\
  \n\n\n如果 `invokespecial` 指令指定的是实例化初始化方法，且操作数栈上的目标引用是由早前的 `new` 指令创建的类实例，则 `invokespecial`\
  \ 必须指定该类实例所属类的某个实例化初始化方法。\n\n如果 `invokespecial` 指令指定的方法不是实例化初始化方法，则操作数栈上目标引用的类型必须与当前类赋值兼容（JLS\
  \ §5.2）。\n\n- 每一个实例化初始化方法（除源自 `Object` 类构造函数的实例化初始化方法外）在在其实例成员被访问（`accessed`）之前，必须调用\
  \ `this` 的另一个实例化初始化方法，或者调用其直接超类 `super` 的实例化初始化方法。\n\n然而，声明在当前类中声明的 `this` 实例字段可以在调用任何实例化初始化方法之前被赋值（`assigned`）。\n\
  \n- 当调用任何实例方法或访问任何实例变量时，包含该实例方法或实例变量的类实例必须已经初始化。\n\n- 在执行 `jsr` 或 `jsr_w` 指令时，操作数栈或局部变量中绝不能存在未初始化的类实例。\n\
  \n- 每个作为方法调用指令目标的类实例的类型，必须与指令中指定的类或接口类型赋值兼容（JLS §5.2）。\n\n- 每个方法调用的参数的类型必须与方法描述符方法调用兼容（JLS\
  \ §5.3, §4.3.3）。\n\n- 每一个返回指令必须与其方法的返回类型匹配：\n    - 如果方法返回 `boolean`、`byte`、`char`、`short`\
  \ 或 `int`，则只能使用 `ireturn` 指令。\n    - 如果方法返回 `float`、`long` 或 `double`，则分别只能使用 `freturn`、`lreturn`\
  \ 或 `dreturn` 指令。\n    - 如果方法返回 `reference` 类型，只能使用 `areturn` 指令，且返回值的类型必须与方法的返回描述赋值兼容（JLS\
  \ §5.2, §4.3.3）。\n    - 所有实例化初始化方法、类或接口初始化方法以及声明返回 `void` 的方法必须使用 `return` 指令。\n\
  \n- 由 `getfield` 指令访问的或由 `putfield` 指令修改的每个类实例的类型，必须与指令中指定的类类型赋值兼容（JLS §5.2）。\n\n\
  - 由 `putfield` 或 `putstatic` 指令存储的每个值的类型必须与被存储的类实例或类的字段描述符（4.3.2）兼容：\n    - 如果描述符类型为\
  \ `boolean`、`byte`、`char`、`short` 或 `int`，则该值必须是 `int`。\n    - 如果描述符类型为 `float`、`long`\
  \ 或 `double`，则该值必须分别是 `float`、`long` 或 `double`。\n    - 如果描述符类型为 `reference` 类型，则该值必须是与描述符类型赋值兼容的类型。\n\
  \n- 由 `aastore` 指令存储到数组中的每个值必须是 `reference` 类型。被 `aastore` 指令存储的数组的组件类型也必须是 `reference`\
  \ 类型。\n\n- 每一个 `athrow` 指令只能抛出 `Throwable` 类或其子类的实例。方法的 `Code_attribute` 结构中 `exception_table`\
  \ 数组的每个 `catch_type` 项中提到的每个类必须是 `Throwable` 或其子类。\n\n- 如果使用 `getfield` 或 `putfield`\
  \ 访问声明在超类中的 `protected` 字段，且该超类属于与当前类不同的运行时包，则被访问的类实例的类型必须与当前类相同或是子类。\n\n如果使用 `invokevirtual`\
  \ 或 `invokespecial` 访问声明在超类中的 `protected` 方法，且该超类属于与当前类不同的运行时包，则被访问的类实例的类型必须与当前类相同或是子类。\n\
  \n- 执行永远不会超出 `code` 数组的底部。\n\n- 不允许从局部变量加载类型为 `returnAddress` 的值。\n\n- 每个 `jsr`\
  \ 或 `jsr_w` 指令后续指令只能由单一的 `ret` 指令返回。\n\n- 被返回的任何 `jsr` 或 `jsr_w` 指令不能用于递归调用子程序，如果该子程序已经存在于该子程序调用链中。（在\
  \ `finally` 子句内部使用 `try`-`finally` 结构时，子程序是可以嵌套的。）\n\n- 每个类型为 `returnAddress` 的实例最多只能返回一次。如果\
  \ `ret` 指令返回到子程序调用链中位于给定 `returnAddress` 类型实例对应的 `ret` 指令之上的点，则该实例将永远无法作为返回地址使用。\n\
  \n### 4.10 类文件的验证\n\n尽管 Java 编程语言的编译器必须产生满足前面节中所有静态和结构约束的 `class` 文件，但 Java 虚拟机无法保证其要求加载的任何文件都是由该编译器生成的，或者是格式正确的。像网络浏览器之类的应用程序并不下载源代码然后进行编译；这些应用程序下载的是已经编译好的\
  \ `class` 文件。浏览器需要确定该 `class` 文件是由可靠的编译器产生的。\n\n编译时检查的另一个问题是版本偏差。用户可能成功地编译了一个类（例如\
  \ `PurchaseOptions`）作为 `TradingClass` 的子类。但自该类编译以来`TradingClass` 的定义可能发生了与现有二进制不兼容的变化。方法可能被删除或更改了返回类型或修饰符。字段可能更改了类型。访问修饰符可能从\
  \ `public` 变为 `private`。关于这些问题的讨论，请参见《Java 语言规范》（Java SE 8 版）第 13 章“二进制兼容性”。\n\n\
  正由于这些潜在问题，Java 虚拟机需要自行验证其尝试合并的 `class` 文件是否了所需的约束。Java 虚拟机实现在链接时（5.4）验证每个 `class`\
  \ 文件是否满足必要的约束。\n\n链接验证提高了运行时解释器的性能。为了在运行时对每个解释指令验证约束而必须进行的昂贵检查可以消除。Java 虚拟机可以假设这些检查已经完成。例如，Java\
  \ 虚拟机已经知道：\n\n- 操作数栈没有溢出或下溢。\n- 所有局部变量的使用和存储都是有效的。\n- 所有 Java 虚拟机指令的参数都是有效的。\n\n\
  Java 虚拟机实现可以使用两种验证策略：\n\n- 必须使用类型检查来验证版本号大于等于 50.0 的 `class` 文件。\n- 符合 Java ME CLDC\
  \ 和 Java Card 规范的所有 Java 虚拟机实现，必须支持类型推导，以验证版本号小于 50.0 的 `class` 文件。\n\n\n\n\n在这两种策略中，验证主要关注将从\
  \ §4.9 规定的静态和结构性约束应用于 `Code` 属性的 `Code` 数组上（§4.7.3）。然而，在 `Code` 属性之外，还有三个额外的检查需要在验证期间执行：\n\
  \n- 确保 `final` 类没有被子化。\n- 确保 `final` 方法没有被重写（§5.4.5）。\n- 检查每个类（`Object` 除外）是否具有直接的父类。\n\
  \n## 4.10.1 通过类型检查进行验证\n\n版本号为 50.0 或以上（§4.1）的 `class` 文件必须使用本节给出的类型检查规则进行验证。\n\n\
  当且仅当 `class` 文件的版本号等于 50.0 时，如果类型检查失败，Java 虚拟机实现可以选择尝试通过类型推断执行验证（§4.10.2）。\n\n这是一项务实的调整，旨在缓解向新验证规范的过渡。许多操作\
  \ `class` 文件的工具可能会某种某种修改方法的字节码，导致需要调整方法的栈映射帧（stack map frames）。如果工具没有对栈映射帧进行必要的调整，即使字节码在原则上是有效的（并且在旧的类型推断方案下可以通过验证），类型检查也可能会失败。为了给实现者时间调整其工具，Java\
  \ 虚拟机可能会回退到旧的验证规范，但仅限有限时间。\n\n在类型检查失败但调用类型推断并成功的情况下，预计会有一定的性能损失。这种损失是不可避免的。它还应该作为一个信号，告知工具供应商其输出结果需要进行调整，并为供应商提供进行这些调整的额外激励。\n\
  \n总结来说，回退到通过类型推断验证支持 Java SE 平台逐渐添加栈映射帧（如果版本 50.0 的 `class` 文件中不存在这些帧，则允许回退），并支持从\
  \ Java SE 平台逐渐移除 `jsr` 和 `jsr_w` 指令（如果版本 50.0 的 `class` 文件中存在这些指令，则允许回退）。\n\n如果\
  \ Java 虚拟机实现尝试对版本 50.0 的类文件执行类型推断验证，则它必须在类型检查失败的所有情况下都这样做。\n\n这意味着 Java 虚拟机实现不能选择在某个案例中使用类型推断，而在另一个案例中不使用。它要么拒绝无法通过类型检查验证的\
  \ `class` 文件，要么在每次类型检查失败时一致地回退到类型推断验证器。\n\n类型检查器执行通过 Prolog 子句指定的类型规则。使用英文文本以非正式的方式描述类型规则，而\
  \ Prolog 子句则提供了正式的规范。\n\n类型检查器要求为每个具有 `Code` 属性的方法提供一个栈映射帧列表（§4.7.3）。栈映射帧的列表由 `Code`\
  \ 属性的 `StackMapTable` 属性（§4.7.4）给出。其意图是栈映射帧必须出现在方法中每个基本块的开头。栈映射帧指定了每个基本块开始时每个操作数栈和每个局部变量的验证类型。类型检查器读取每个具有\
  \ `Code` 属性方法的栈映射帧，并使用这些映射生成 `Code` 属性中指令的类型安全的证明。如果一个类所有的方法都是类型安全的，且它没有子化 `final`\
  \ 类，则该类是类型安全的。点击此处查看代码\n\n```prolog\nclassIsTypeSafe(Class) :-\n  classClassName(Class,\
  \ Name),\n  classDefiningLoader(Class, L),\n  superclass(Name, L, Chain),\n  Chain\
  \ = [],\n  classSuperClassName(Class, SuperclassName),\n  loadedClass(SuperclassName,\
  \ L, Superclass),\n  classIsNotFinal(Superclass),\n  classMethods(Class, Methods),\n\
  \  checklist(methodIsTypeSafe(Class), Methods).\nclassIsTypeSafe(Class) :-\n  classClassName(Class,\
  \ 'java/lang/Object'),\n  classDefiningLoader(Class, L),\n  isBootstrapLoader(L),\n\
  \  classMethods(Class, Methods),\n  checklist(methodIsTypeSafe(Class), Methods).\n\
  ```\n\nProlog 谓词 `classIsTypeSafe` 假设 `Class` 是一个表示已解析并加载的二进制类的 Prolog 项。此规范没有强制该项的精确结构，但要求在其基础上定义某些谓词。例如，我们假设有一个谓词\
  \ `classMethods(Class, Methods)`，它在给定上述表示类的项作为第一个参数时，将其第二个参数绑定到包含该类所有方法的列表中，这些方法在稍后以方便的形式表示。\n\
  \n如果谓词 `classIsTypeSafe` 不为真，类型检查器必须抛出 `VerifyError` 异常以指示 `class` 文件格式错误。否则，`class`\
  \ 文件通过了类型检查，字节码验证已完成。\n\n本节其余部分详细解释了类型检查的过程：\n\n- 首先，我们为核心 Java 虚拟机产物如类和方法提供了 Prolog\
  \ 谓词（4.10.1）。\n- 其次，我们指定类型检查器已知的类型系统（4.10.2）。\n- 第三，我们指定指令和栈映射帧的 Prolog 表示（4.10.3）。\n\
  - 第四，我们指定不带代码的方法如何进行类型检查（4.10.4）。\n- 第五，我们讨论了所有加载和存储指令的类型检查问题（4.10.5），以及访问 `protected`\
  \ 成员的问题（4.10.6）。\n- 最后，我们指定了检查每条指令的规则（4.10.7）。\n\n### 4.10.1.1 Java 虚拟机产物的访问器\n\n\
  我们规定了某些 Prolog 谓词（访问器），这些谓词具有某些预期行为，但其正式定义未在规范中给出\n\n`classClassName(Class, ClassName)`\n\
  提取类 `Class` 的名称 `ClassName`。\n\n`classIsInterface(Class)`\n如果 `Class` 是接口，则为真。\n\
  \n`classIsNotFinal(Class)`\n如果 `Class` 不是 `final` 类，则为真。\n\n`classSuperClassName(Class,\
  \ SuperClassName)`\n提取类 `Class` 父类的名称 `SuperClassName`。\n\n`classInterfaces(Class,\
  \ Interfaces)`\n提取类 `Class` 的直接父接口列表 `Interfaces`。\n\n`classMethods(Class, Methods)`\n\
  提取类 `Class` 中声明的方法列表 `Methods`。\n\n`classAttributes(Class, Attributes)`\n提取类 `Class`\
  \ 的属性列表 `Attributes`。每个属性表示为形式 `attribute(AttributeName, AttributeContents)` 的函数应用，其中\
  \ `AttributeName` 是属性名称。属性内容的格式未指定。\n\n`classDefiningLoader(Class, Loader)`\n提取类\
  \ `Class` 的定义加载器 `Loader`。\n\n`isBootstrapLoader(Loader)`\n如果类加载器 `Loader` 是引导加载器，则为真。\n\
  \n`loadedClass(Name, InitiatingLoader, ClassDefinition)`\n如果存在一个名为 `Name` 的类，其由类加载器\
  \ `InitiatingLoader` 加载时的表示（符合本规范）为 `ClassDefinition`，则为真。\n\n`methodName(Method,\
  \ Name)`\n提取方法 `Method` 的名称 `Name`。\n\n\n\n\n\n`methodAccessFlags(Method, AccessFlags)`\n\
  \n提取方法 `Method` 的访问标志，`AccessFlags`。\n\n`methodDescriptor(Method, Descriptor)`\n\
  \n提取方法 `Method` 的描述符，`Descriptor`。\n\n`methodAttributes(Method, Attributes)`\n\n\
  提取方法 `Method` 的属性列表，`Attributes`。\n\n`isNotFinal(Method, Class)`\n\n当类 `Class` 中的方法\
  \ `Method` 不是 `final` 时，为真。\n\n`isStatic(Method, Class)`\n\n当类 `Class` 中的方法 `Method`\
  \ 为 `static` 时，为真。\n\n`isNotStatic(Method, Class)`\n\n当类 `Class` 中的方法 `Method` 不是\
  \ `static` 时，为真。\n\n`isPrivate(Method, Class)`\n\n当类 `Class` 中的方法 `Method` 为 `private`\
  \ 时，为真。\n\n`isNotPrivate(Method, Class)`\n\n当类 `Class` 中的方法 `Method` 不是 `private`\
  \ 时，为真。\n\n`isProtected(MemberClass, MemberName, MemberDescriptor)`\n\n当类 `MemberClass`\
  \ 中存在名为 `MemberName` 且描述符为 `MemberDescriptor` 的成员，且该成员为 `protected` 时，为真。\n\n`isNotProtected(MemberClass,\
  \ MemberName, MemberDescriptor)`\n\n当类 `MemberClass` 中存在名为 `MemberName` 且描述符为 `MemberDescriptor`\
  \ 的成员，且该成员不是 `protected` 时，为真。\n\n`parseFieldDescriptor(Descriptor, Type)`\n\n将字段描述符\
  \ `Descriptor` 转换为对应的验证类型 `Type` (§4.10.1.2)）。\n\n`parseMethodDescriptor(Descriptor,\
  \ ArgTypeList, ReturnType)`\n\n将方法描述符 `Descriptor` 转换为对应方法参数类型的验证类型列表 `ArgTypeList`，以及对应返回类型的验证类型\
  \ `ReturnType`。\n\n`parseCodeAttribute(Class, Method, FrameSize, MaxStack, ParsedCode,\
  \ Handlers, StackMap)`\n\n提取类 `Class` 中方法 `Method` 的指令流 `ParsedCode`，以及最大操作数栈大小\
  \ `MaxStack`、局部变量最大数量 `FrameSize`、异常处理器 `Handlers` 以及栈映射 `StackMap`。\n\n指令流和栈映射属性的表示必须符合\
  \ §4.10.1.3 和 §4.10.1.4 的规定。\n\n`samePackageName(Class1, Class2)`\n\n当 `Class1`\
  \ 和 `Class2` 的包名相同时，为真。\n\n`differentPackageName(Class1, Class2)`\n\n当 `Class1`\
  \ 和 `Class2` 的包名不同时，为真。\n\n在检查方法体的类型时，访问有关方法的信息是非常方便的。为此，我们定义了一个环境（`environment`），它由以下六元组组成：\n\
  \n* 一个类\n* 一个方法\n* 该方法声明的返回类型\n* 方法中的指令\n* 操作数栈的最大 own\n* 异常处理器的列表\n\n我们并指定了访问器来从环境中提取信息。\n\
  \n点击此处查看代码图像\n\n```prolog\nallInstructions(Environment, Instructions) :-\n    Environment\
  \ = environment(_Class, _Method, _ReturnType,\n                               Instructions,\
  \ _, _).\n\nexceptionHandlers(Environment, Handlers) :-\n    Environment = environment(_Class,\
  \ _Method, _ReturnType,\n                               _Instructions, _, Handlers).\n\
  \nmaxOperandStackLength(Environment, MaxStack) :-\n    Environment = environment(_Class,\
  \ _Method, _ReturnType,\n                               _Instructions, MaxStack,\
  \ _Handlers).\n\nthisClass(Environment, class(ClassName, L)) :-\n    Environment\
  \ = environment(Class, _Method, _ReturnType,\n                               _Instructions,\
  \ _, _),\n    classDefiningLoader(Class, L),\n    classClassName(Class, ClassName).\n\
  \nthisMethodReturnType(Environment, ReturnType) :-\n    Environment = environment(_Class,\
  \ _Method, ReturnType,\n                               _Instructions, _, _).\n```\n\
  \n我们指定了额外的谓词来提取更高层的信息。\n\n点击此处查看代码图像\n\n```prolog\noffsetFrame(Environment, Offset,\
  \ StackFrame) :-\n    allInstructions(Environment, Instructions),\n    member(Offset,\
  \ StackFrame).\n\ncurrentClassLoader(Environment, Loader) :-\n    thisClass(Environment,\
  \ class(_, Loader)).\n```\n\n最后，我们指定了一个贯穿使用的通用谓词：\n\n```prolog\nMember(_, []).\n\
  Member(X, [A | More]) :- X \\= A, Member(X, More).\n```\n\n指导确定哪些访问器被规定且被完整指定的原则是：我们不希望过度指定\
  \ `class` 文件的表示。为 `Class` 或 `Method` 项提供访问器将迫使我们完全指定表示 `class` 文件的项的格式。\n\n### 4.1.1\
  \ 验证系统\n\n类型检查器强制执行基于验证层级的类型系统，如下所示：\n\n点击此处查看代码图像\n\n```text\n          top\n \
  \        /   \\\n      oneWord  twoWord\n     /    \\    /    \\\n  int  float reference\
  \ long  double\n      \\    /      /\n       \\  /______/\n        \\/      /\n\
  \       /          \\\n  uninitialized\n```\n\n#### 4.1.1.2 验证类型\n\n类型检查器强制执行基于验证层级的类型系统，如下所示：\n\
  \n（注：原文在此处存在重复和乱码，此处已根据文档逻辑进行了整理）\n\n\n\n\n\n```\nisAssignable(oneWord, top).\n\n\
  isAssignable(twoWord, top).\n\nisAssignable(int, X)    :- isAssignable(oneWord,\
  \ X).\n\nisAssignable(float, X)  :- isAssignable(oneWord, X).\nisAssignable(long,\
  \ X)   :- isAssignable(twoWord, X).\nisAssignable(double, X) :- isAssignable(twoWord,\
  \ X).\nisAssignable(reference, X)  :- isAssignable(oneWord, X).\nisAssignable(class(_,\
  \ _), X) :- isAssignable(reference, X).\nisAssignable(arrayOf(_), X)  :- isAssignable(reference,\
  \ X).\nisAssignable(uninitialized, X)    :- isAssignable(reference, X).\nisAssignable(uninitializedThis,\
  \ X) :- isAssignable(uninitialized, X).\nisAssignable(uninitialized(_), X)  :- isAssignable(uninitialized,\
  \ X).\nisAssignable(null, class(_, _)).\nisAssignable(null, arrayOf(_)).\nisAssignable(null,\
  \ X) :- isAssignable(class('java/lang/Object', BL), X),\n                      \
  \   isBootstrapLoader(BL).\n```\n\n这些子类型规则并不是子类型最直观的表示方式。Java 编程语言中引用类型的子类型规则与其余验证类型的规则之间存在明确划分。这种划分允许我们定义\
  \ Java 编程语言引用类型与其他验证类型之间的通用子类型关系。这些关系独立于 Java 引用类型在类型层次中的位置，并有助于防止 Java 虚拟机实现过度的类加载。例如，我们不希望在响应类似于\
  \ `class(foo, L) <: twoWord` 的查询时开始遍历 Java 超类层次结构。\n\n我们还有一条规则规定子类型是自反的，因此这些规则涵盖了\
  \ Java 编程语言中大多数非引用类型的验证类型。\n\nJava 编程语言中引用类型的子类型规则通过 `isJavaAssignable` 递归指定。\n\n\
  点击此处查看代码图像\n\n```\nisAssignable(class(X, Lx), class(Y, Ly)) :-\n    isJavaAssignable(class(X,\
  \ Lx), class(Y, Ly)).\nisAssignable(arrayOf(X), class(Y, L)) :-\n    isJavaAssignable(arrayOf(X),\
  \ class(Y, L)).\nisAssignable(arrayOf(X), arrayOf(Y)) :-\n    isJavaAssignable(arrayOf(X),\
  \ arrayOf(Y)).\n```\n\n对于赋值，接口被处理为 `Object`。\n\n点击此处查看代码图像\n\n```\nisJavaAssignable(class(_,\
  \ _), class(To, L)) :-\n    loadedClass(To, L, ToClass),\n    classIsInterface(ToClass).\n\
  isJavaAssignable(From, To) :-\n    isJavaSubclassOf(From, To).\n```\n\n数组类型是 `Object`\
  \ 的子类型。其意图是数组类型也是 `Cloneable` 和 `java.io.Serializable` 的子类型。\n\n点击此处查看代码图像\n\n```\n\
  isJavaAssignable(arrayOf(_), class('java/lang/Object', BL)) :-\n    isBootstrapLoader(BL).\n\
  isJavaAssignable(arrayOf(_), X) :-\n    isArrayInterface(X).\nisArrayInterface(class('java/lang/Cloneable',\
  \ BL)) :-\n    isBootstrapLoader(BL).\nisArrayInterface(class('java/io/Serializable',\
  \ BL)) :-\n    isBootstrapLoader(BL).\n```\n\n原始类型数组之间的子类型关系是恒等关系。\n\n点击此处查看代码图像\n\
  \n```\nisJavaAssignable(arrayOf(X), arrayOf(Y)) :-\n    atom(X),\n    atom(Y),\n\
  \    X = Y.\n```\n\n引用类型数组之间的子类型关系是协变的。\n\n点击此处查看代码图像\n\n```\nisJavaAssignable(arrayOf(X),\
  \ arrayOf(Y)) :-\n    compound(X), compound(Y), isJavaAssignable(X, Y).\n```\n\n\
  子类关系是自反的。\n\n点击此处查看代码图像\n\n```\nisJavaSubclassOf(class(SubclassName, L), class(SubclassName,\
  \ L)).\nisJavaSubclassOf(class(SubclassName, LSub), class(SuperclassName, LSuper))\
  \ :-\n    superclassChain(SubclassName, LSub, Chain),\n    member(class(SuperclassName,\
  \ L), Chain),\n    loadedClass(SuperclassName, L, ToClass).\n```\n\n##### 4.10.1.3\
  \ 指令表示\n\n单个指令在 Prolog 中表示为如下形式的项：\n\n- `field(ClassName, FieldName, FieldDescriptor)`\
  \ 用于字段，其中 `ClassName` 是 `class_index` 项引用的类名，`FieldName` 和 `FieldDescriptor` 分别对应名称和类型。\n\
  - `imethod(MethodIntfName, MethodName, MethodDescriptor)` 用于接口方法，其中 `MethodIntfName`\
  \ 是 `class_index` 项引用的接口名，`MethodName` 和 `MethodDescriptor` 分别对应名称和类型。\n- `method(MethodClassName,\
  \ MethodName, MethodDescriptor)` 用于类方法，其中 `MethodClassName` 是 `class_index` 项引用的类名，`MethodName`\
  \ 和 `MethodDescriptor` 分别对应名称和类型。\n- `dmethod(CallSiteName, MethodDescriptor)` 用于动态调用点，其中\
  \ `CallSiteName` 和 `MethodDescriptor` 分别对应名称和类型。\n\n##### 4.10.1.4 栈映射帧表示\n\n栈映射帧在\
  \ Prolog 中表示为如下形式的项的列表：\n\n`stackMap(Offset, TypeState)`\n\n其中：\n\n\n\n\n\n- `Offset`\
  \ 是一个整数，表示应用栈映射帧的字节码偏移量（§4.7.4）。\n\n此列表中字节码偏移量的顺序必须与 `class` 文件中的顺序一致。\n\n- `TypeState`\
  \ 是 `Offset` 处指令预期的输入类型状态。\n\n*类型状态*（type state）是从方法的操作数栈和局部变量中的位置到验证类型（verification\
  \ types）的映射。它的形式如下：\n\n点击此处查看代码图像\n\n```\nframe(Locals, OperandStack, Flags)\n```\n\
  \n其中：\n\n- `Locals` 是一个验证类型列表，其中列表的第 `i` 个元素（索引从 0 开始）表示局部变量 `i` 的类型。\n\n- `OperandStack`\
  \ 是一个验证类型列表，其中列表的第一个元素表示操作数栈顶部的类型，栈顶下方的栈条目类型按相应的顺序在列表中。大小为 2 的类型（`long` 和 `double`）由两个栈条目表示，第一个条目是\
  \ `top`，第二个条目是类型本身。\n\n例如，一个包含 `double` 值、一个 `int` 值和一个 `long` 值的栈，在类型状态中表示为包含五个条目的栈：对应\
  \ `double` 值的 `top` 和 `double` 条目，对应 `int` 值的 `int` 条目，以及对应 `long` 值的 `top` 和 `long`\
  \ 条目。因此，`OperandStack` 是列表 `[top, double, int, top, long]`。\n\n- `Flags` 是列表，可以为空，也可以包含单个元素\
  \ `flagThisUninit`。\n\n如果 `Locals` 中的任何局部变量类型为 `uninitializedThis`，则 `Flags` 包含单个元素\
  \ `flagThisUninit`，否则 `Flags` 为空列表。\n\n`flagThisUninit` 用于构造函数，以标记 `this` 初始化尚未完成的类型状态。在此类类型状态下，从方法返回是非合法的。\n\
  \n验证类型的子类型关系逐点扩展到类型状态。\n\n方法的局部变量数组在构造上具有固定长度（见 §4.10.1.6 中的 `methodInitialStackFrame`），而操作数栈会增长和缩小。因此，我们需要对需要赋值的操作数栈长度进行显式检查。\n\
  \n点击此处查看代码图像\n\n```\nframeIsAssignable(frame(Locals1, StackMap1, Flags1),\n    \
  \             frame(Locals2, StackMap2, Flags2)) :-\n    length(StackMap1, StackMapLength),\n\
  \    length(StackMap2, StackMapLength),\n    maplist(isAssignable, Locals1, Locals2),\n\
  \    maplist(isAssignable, StackMap1, StackMap2),\n    subset(Flags1, Flags2).\n\
  ```\n\n`<init>` 方法的异常处理器允许特殊形式的帧赋值。如果方法调用了另一个 `<init>` 方法且调用抛出了异常，则当前对象是损坏的；尽管如此，仅当处理器的输入类型状态中的所有局部变量都是\
  \ `top` 时，处理的目标才是类型安全的。这确保了处理帧不依赖于当前类型。\n\n点击此处查看代码图像\n\n```\nframeIsAssignable(frame(ExcLocals,\
  \ ExcStack, [flagThisUninit]),\n                 frame(HandlerLocals, HandlerStack,\
  \ [])) :-\n  /* 栈大小必须相同（异常类占一个位） */\n  length(ExcStack, StackLength),\n  length(HandlerStack,\
  \ StackLength),\n  StackLength =:= 1,\n  /* 局部变量数组长度必须相同 */\n  length(ExcLocals,\
  \ LocalsLength),\n  length(HandlerLocals, LocalsLength),\n  expandToLength([], LocalsLength,\
  \ Top, TopLocals),\n  maplist(:=:, HandlerLocals, TopLocals).\n```\n\n操作数栈的长度不能超过声明的最大栈长度。\n\
  \n点击此处查看代码图像\n\n```\noperandStackHasLegalLength(Environment, OperandStack) :-\n\
  \    length(OperandStack, Length),\n    maxOperandStackLength(Environment, MaxStack),\n\
  \    Length =< MaxStack.\n```\n\n某些数组指令（§*aaload*, §*arraylength*, `aaload](#ch06.html_ch06lev2sec9)*,\
  \ `aload](#ch06.html_ch06lev2sec13)*, `bastore](#ch06.html_ch06lev2sec14)*) 会查看操作数栈上值的类型。即操作数栈的第\
  \ *i* 个元素。\n\n点击此处查看代码图像\n\n```\nnth1StackFrame(_Locals, OperandStack, Element)\n\
  ```\n\n操作数栈的操作由于某些类型占用两个条目而变得复杂。下面的谓词考虑了这一点。Pop 弹出一个类型列表。\n\n点击此处查看代码图像\n\n```\n\
  canPop(frame(Locals, OperandStack, Flags), Type)\n```\n\n从栈中弹出一个单个类型。更准确地说，如果推入的类型大小为\
  \ 1，我们直接将其推入。将其推入栈。如果推入的类型大小为 2，我们先推入它，再推入 `top`。\n\n点击此处查看代码图像\n\n```\npushStack(OperandStack,\
  \ 'void', OperandStack).\npushStack(OperandStack, Type, [Type | OperandStack]).\n\
  pushStack(OperandStack, Type, [top | Type]).\n```\n\n如果有空间，则推入类型列表。\n\n点击此处查看代码图像\n\
  \n```\ncanSafelyPush(Environment, InputOperandStack, Type, OutputOperandStack) :-\n\
  \    pushStack(InputOperandStack, Type, OutputOperandStack),\n    operandStackHasLegalLength(Environment,\
  \ OutputOperandStack).\n\ncanSafelyPushList(Environment, InputOperandStack, Types,\
  \ OutputOperandStack) :-\n    canPushList(InputOperandStack, Types, OutputOperandStack),\n\
  \    operandStackHasLegalLength(Environment, OutputOperandStack).\n\n```\ncanPushList(InputOperandStack,\
  \ [], InputOperandStack).\ncanPushList(InputOperandStack, [Type | Rest], OutputOperandStack)\
  \ :-\n    pushStack(InputOperandStack, Type, InterimOperandStack),\n    canPushList(InterimOperandStack,\
  \ Rest, OutputOperandStack).\n```\n\n*dup* 指令对操作数栈的操作完全根据栈上值的*类别*（category）规定（§2.11.1）。\n\
  \n类别 1 类型占用单个栈条目。从栈中弹出一个类别 1 的逻辑类型 `Type` 的条件是：栈顶为 `Type` 且 `Type` 不是 `top`（否则它可能是类别\
  \ 2 类型的上半部分）。结果是输入栈，去除了顶部的条目。\n\n```\npopCategory1([Type | Rest], Type, Rest).\n\
  ```\n\n\n\n\n```pro\nType = top,\nsizeOf(Type, 1).\n```\n\n类别 2 的类型占用两个栈项。如果栈顶是类型\
  \ `top` 且其正下方的项是 `Type`，则可以从栈中弹出一个类别为 2 的逻辑类型 `Type`。结果是得到进入的栈（incoming stack），其中栈顶的两个栈项已被弹出。\n\
  \n点击此处查看代码图像\n\n```pro\npopCategory2([top, Type | Rest], Type, Rest) :-\n    sizeOf(Type,\
  \ 2).\n```\n\n大多数针对单个指令的类型规则（§4.10.1.9）依赖于有效*类型转换*（type transition）的概念。如果可以从输入类型状态的操作数栈中弹出一个预期的类型列表，并将其替换为一个预期的结果类型，从而产生一个新的有效的类型状态，则该类型转换是*有效*的。特别是，新有效类型状态中操作数栈的大小不能超过其声明的最大尺寸。\n\
  \n点击此处查看代码图像\n\n```pro\nvalidTypeTransition(Environment, ExpectedTypesOnStack, ResultType,\n\
  \                    frame(Locals, InputOperandStack, Flags),\n                \
  \    frame(Locals, NextOperandStack, Flags)) :-\n    popMatchingList(InputOperandStack,\
  \ ExpectedTypesOnStack,\n                     InterimOperandStack),\n    pushOperandStack(InterimOperandStack,\
  \ ResultType, NextOperandStack),\n    operandStackHasLegalLength(Environment, NextOperandStack).\n\
  ```\n\n### 4.10.1.5 抽象与原生方法的类型检查\n\n`abstract`（抽象）方法和 `native`（原生）方法如果没有重写 `final`（最终）方法，则认为是类型安全的。\n\
  \n点击此处查看代码图像\n\n```pro\nmethodIsTypeSafe(Class, Method) :-\n    doesNotOverrideFinalMethod(Class,\
  \ Method),\n    methodAccessFlags(Method, AccessFlags),\n    member(abstract, AccessFlags).\n\
  methodIsTypeSafe(Class, Method) :-\n    doesNotOverrideFinalMethod(Class, Method),\n\
  \    methodAccessFlags(Method, AccessFlags),\n    member(native, AccessFlags).\n\
  ```\n\n`private`（私有）方法和 `static`（静态）方法与动态方法派发是正交的，因此它们永远不会重写其他方法（§5.4.5）。\n\n点击此处查看代码图像\n\
  \n```pro\ndoesNotOverrideFinalMethod(class('java/lang/Object', L), Method) :-\n\
  \    isBootstrapLoader(L).\ndoesNotOverrideFinalMethod(Class, Method) :-\n    isPrivate(Method,\
  \ Class).\ndoesNotOverrideFinalMethod(Class, Method) :-\n    isStatic(Method, Class).\n\
  doesNotOverrideFinalMethod(Class, Method) :-\n    isNotPrivate(Method, Class),\n\
  \    isNotStatic(Method, Class),\n    doesNotOverrideFinalMethodOfSuperclass(Class,\
  \ Method).\ndoesNotOverrideFinalMethodOfSuperclass(Class, Method) :-\n    classSuperClassName(Class,\
  \ SuperclassName),\n    classDefiningLoader(Class, L),\n    loadedClass(SuperclassName,\
  \ L, Superclass),\n    classMethods(Superclass, SuperMethodList),\n    finalMethodNotOverridden(Method,\
  \ Superclass, SuperMethodList).\n```\n\n`private` 且/或 `static` 的 `final` 方法是不寻常的，因为本质上说\
  \ `private` 方法和 `static` 方法无法被重写。因此，如果发现 `final private` 方法或 `final static` 方法，则它在逻辑上没有被另一个方法重写。\n\
  \n点击此处查看代码图像\n\n```pro\nfinalMethodNotOverridden(Method, Superclass, SuperMethodList)\
  \ :-\n    methodName(Method, Name),\n    methodDescriptor(Method, Descriptor),\n\
  \    member(method(_, Name, Descriptor), SuperMethodList),\n    isFinal(Method,\
  \ Superclass),\n    isPrivate(Method, Superclass).\nfinalMethodNotOverridden(Method,\
  \ Superclass, SuperMethodList) :-\n    methodName(Method, Name),\n    methodDescriptor(Method,\
  \ Descriptor),\n    member(method(_, Name, Descriptor), SuperMethodList),\n    isFinal(Method,\
  \ Superclass),\n    isStatic(Method, Superclass).\n```\n\n如果发现非 `final private`\
  \ 方法或非 `final static` 方法，则跳过它，因为它们与重写是正交的。\n\n点击此处查看代码图像\n\n```pro\nfinalMethodNotOverridden(Method,\
  \ Superclass, SuperMethodList) :-\n    methodName(Method, Name),\n    methodDescriptor(Method,\
  \ Descriptor),\n    member(method(_, Name, Descriptor), SuperMethodList),\n    isNotFinal(Method,\
  \ Superclass),\n    isPrivate(Method, Superclass).\nfinalMethodOverrideFinalridden(Method,\
  \ Superclass,MethodMethod\n)\n\n    MethodName(Method,Method),\nMethodMethodMethod\n\
  \    ,MethodMethod\nMethodMethodMethodMethodMethodMethod,Method),MethodMethod\n\n\
  \n    method(MethodMethod,,),),\n    Method(MethodMethod,Method),\n        \nOverrideMethodMethodSuperclass(Superclass,\
  \ Method).\nfinalMethodNotOverridden(Method, Superclass, SuperMethodList) :-\n \
  \   methodName(Method, Name),\n    methodDescriptor(Method, Descriptor),\n    member(method(_,\
  \ Name, Descriptor), SuperMethodList),\n    isNotFinal(Method, Superclass),\n  \
  \  isPrivate(Method, Superclass),\n    isNotFinal(,classclass,,,).\n``````\n\n发现一个非\
  \ `final private` 方法或非 `final static` 方法，则它在逻辑上没有被另一个方法重写。\n\n点击此处查看代码图像\n\n```pro\n\
  finalMethodNotOverridden(Method, Superclass,\nMethodList)\n\n    methodName(Method,\
  \ Name),\n    methodDescriptor(Method,\n),\n        (method\n,,,),,Method,),\n \
  \       \nFinal(Method,,,),\n        ((Method,,,),\n        Static(Method,,class),\n\
  \    \nNotFinalMethodOfSuperclass(Class, Method).\n```\n\n### 4.10.1.6 带有代码的类型检查\n\
  \n非 `abstract` 且 `native` 方法如果具有代码，则代码是类型正确的。\n\n点击此处查看代码图像\n\n```pro\nmethodIsTypeSafe(Class,\
  \ Method) :-\n    doesNotOverrideFinalMethod(Class, Method),\n    methodAccessFlags(Method,\
  \ AccessFlags),\n    member(native, AccessFlags),\n    member(abstract, AccessFlags),\n\
  \    attribute('Code', _),\n    methodWithCodeIsSafe(Class, Method).\n```\n\n带有代码的方法是类型安全的，如果可以将代码和栈映射帧合并到一个流中，使得每个栈映射帧都在其对应的指令之前，并且合并后的流是类型正确的。该方法的异常处理器（如果有）也必须是有效的。\n\
  \n点击此处查看代码图像\n\n```pro\nmethodWithCodeIsSafe(Class, Method) :-\n    parseCodeAttribute(Class,\
  \ Method, FrameSize, MaxStack,\n                  ParsedCode, Handlers),\n    mergeStackMapAndCode(StackMap,\
  \ ParsedCode, MergedCode),\n    methodInitialStackFrame(Class, Method, FrameSize,\
  \ StackFrame, ReturnType),\n    Environment = environment(Class, Method, ReturnType,\
  \ MergedCode,\n                             MaxStack, Handlers),\n    handlersAreLegal(Environment),\n\
  \    mergedCodeIsTypeSafe(Environment, MergedCode, StackFrame).\n```\n\n让我们首先考虑异常处理器。\n\
  \n异常处理器由形式如下的函数应用表示：\n\n点击此处查看代码图像\n\n```pro\nhandler(Start, End, Target, ClassName)\n\
  ```\n\n其参数分别是处理器覆盖范围的起始和结束位置、处理器代码的第一条指令，以及该处理器设计的异常类名称。\n\n异常处理器是*有效*的，如果它的起始位置（Start）小于结束位置（End），存在偏移量等于\
  \ `Start` 的指令，存在偏移量等于 `End` 的指令，且处理器的异常类可以赋值给 `Throwable` 类。如果处理器的类项为 0，则异常类为 `Throwable`，否则它是处理器中命名的类。\n\
  \n点击此处查看代码图像\n\n```pro\nhandlersAreLegal(Environment) :-\n    exceptionHandlers(Environment,\
  \ Handlers),\n    checklist(handlerIsLegal(Environment), Handlers).\nhandlerIsLegal(Environment,\
  \ Handler) :-\n    Handler = handler(Start, End, Target, _),\n    Start < End.\n\
  ```\n\n\n\n\n\n```prolog\nallInstructions(Environment, Instructions),\n    member(instruction(Start,\
  \ _), Instructions),\n    offsetStackFrame(Environment, Target, _),\n    instructionsIncludeEnd(Instructions,\
  \ End),\n    currentClassLoader(Environment, CurrentLoader),\n    handlerExceptionClass(Handler,\
  \ ExceptionClass, CurrentLoader),\n    isBootstrapLoader(BL),\n    isAssignable(ExceptionClass,\
  \ class('java/lang/Throwable', BL)).\n\ninstructionsIncludeEnd(Instructions, End)\
  \ :-\n    member(instruction(End, _), Instructions).\n\ninstructionsIncludeEnd(Instructions,\
  \ End) :-\n    member(endOfCode(End), Instructions).\n\nhandlerExceptionClass(handler(_,\
  \ _, _, 0),\n                      class('java/lang/Throwable', BL), _) :-\n   \
  \ isBootstrapLoader(BL).\nhandlerExceptionClass(handler(_, _, _, Name),\n      \
  \                class(Name, L), L) :-\n    Name \\= 0.\n```\n\n现在让我们转向指令流和栈映射帧（stack\
  \ map frames）。将指令和栈映射帧合并为单一流中涉及四种情况：\n\n- 将一个空的 `StackMap` 和指令列表合并，得到原始指令列表。\n点击此处查看代码图像\n\
  ```prolog\nmergeStackMapAndCode([], CodeList, CodeList).\n```\n\n- 给定一个以 `Offset`\
  \ 处的指令的类型状态开头的栈映射帧列表，以及一个从 `Offset` 开始的指令列表，合并后的列表为栈映射帧列表的头部，随后是指令列表的头部，最后是两个列表尾部的合并。\n\
  点击此处查看代码图像\n```prolog\nmergeStackMapAndCode([stackMap(Offset, Map) | RestMap],\n\
  \                     [instruction(Offset, Parse) | RestCode],\n               \
  \      [stackMap(Offset, Map),\n                      instruction(Offset, Parse)\
  \ | RestMerge]) :-\n    mergeStackMapAndCode(RestMap, RestCode, RestMerge).\n```\n\
  \n- 否则，给定一个以 `OffsetM` 处的指令的类型状态开头的栈映射帧列表，以及一个从 `OffsetP` 开始的指令列表，那么如果 `OffsetP\
  \ < OffsetM`，则合并后的列表包含指令列表的头部，随后是栈映射帧列表与指令列表尾部的合并。\n点击此处查看代码图像\n```prolog\nmergeStackMapAndCode([stackMap(OffsetM,\
  \ Map) | RestMap],\n                     [instruction(OffsetP, Parse) | RestCode],\n\
  \                     [instruction(OffsetP, Parse) | RestMerge]) :-\n    OffsetP\
  \ < OffsetM,\n    mergeStackMapAndCode([stackMap(OffsetM, Map) | RestMap],\n   \
  \                      RestCode, RestMerge).\n```\n\n- 否则，两个列表的合并未定义。由于指令列表的偏移量是单调递的，除非每个栈映射帧的偏移都有对应的指令偏移，且栈映射帧按单调递增顺序排列，否则两个列表的合并是未定义的。\n\
  \n为了确定方法的合并流是否类型正确，我们首先推断方法的初始类型状态。方法的初始类型状态由一个空的操作数栈、根据 `this` 类型和参数推导出的局部变量类型组成，以及相应的标志位（取决于这是否为\
  \ `<init>` 方法）。\n点击此处查看代码图像\n```prolog\nmethodInitialStackFrame(Class, Method, FrameSize,\
  \ frame(Locals, [], Flags)) :-\n    methodDescriptor(Method, Descriptor),\n    parseMethod(Descriptor,\
  \ RawArgs, ReturnType),\n    expandTypeList(RawArgs, Args),\n    methodInitialType(Class,\
  \ Method, ThisList),\n    flags(ThisList, Flags),\n    append(ThisList, Args, ThisArgs),\n\
  \    expandToLength(ThisArgs, FrameSize, top, Locals).\n```\n\n给定一个类型列表，以下子句产生一个列表，其中每个大小为\
  \ 2 的类型都被替换两个条目：一个自身，另一个 `top` 条目。结果对应于列表在 Java 虚拟机中的 32 位字表示。\n点击此处查看代码图像\n```prolog\n\
  expandTypeList([], []).\nexpandTypeList([Item | List], [Item | Result]) :-\n   \
  \ sizeOf(Item, 1),\n    TypeList(List, Result).\nexpandTypeList([Item | List], [Item,\
  \ top | Result]) :-\n    sizeOf(Item, 2),\n    TypeList(List, Result).\nflags([uninitializedThis],\
  \ [flagUninit]).\nflags(X, []) :- X = [uninitializedThis].\nexpandToLength(List,\
  \ Size, _Filler, List) :-\n    length(List, Size).\nexpandToLength(List, Size, Filler,\
  \ Result) :-\n    length(List, ListLength),\n    ListLength < Size,\n    Delta is\
  \ Size - ListLength,\n    length(Extra, Delta),\n    checklist(Filler),\n    append(List,\
  \ Extra, Result).\n```\n\n对于实例方法的初始类型状态，我们计算 `this` 的类型并将其放入列表中。`Object` 的 `<init>`\
  \ 方法中 `this` 的类型是 `Object`；在其他 `<init>` 方法中，`this` 的类型是 `uninitializedThis`；否则，实例方法中\
  \ `this` 的类型为 `class(N, L)`，其中 `N` 是类名 `L` 是其定义加载器。对于静态方法的初始类型状态，`this` 是无关的，因此列表为空。\n\
  点击此处查看代码图像\n```prolog\nmethodInitialThisType(_Class, Method, []) :-\n    methodAccessFlags(Method,\
  \ AccessFlags),\n    member(static, AccessFlags),\n    methodName(Method, MethodName),\n\
  \    MethodName \\= '<init>'.\nmethodInitialThisType(Class, Method, [This]) :-\n\
  \    methodAccessFlags(Method, AccessFlags),\n    notMember(static, AccessFlags),\n\
  \    instanceMethodInitialThisType(Class, Method, This).\ninstanceMethodInitialThisType(Class,\
  \ Method, class('java/lang/Object', L)) :-\n    methodName(Method, '<init>'),\n\
  \    classDefiningLoader(Class, L),\n    isBootstrapLoader(L),\n    classClassName(Class,\
  \ 'java/lang/Object').\ninstanceMethodInitialThisType(Class, Method, uninitializedThis)\
  \ :-\n    methodName(Method, '<init>'),\n    classClassName(Class, ClassName),\n\
  \    classDefiningLoader(Class, CurrentLoader),\n    superclassChain(ClassName,\
  \ CurrentLoader, Chain),\n    Chain \\= [].\ninstanceMethodInitialThisType(Class,\
  \ Method, class(ClassName, L)) :-\n    methodName(Method, MethodName),\n    MethodName\
  \ \\= '<init>',\n    classDefiningLoader(Class, L),\n    classClassName(ClassName).\n\
  ```\n\n我们现在使用方法的初始类型状态计算方法的合并流是否类型正确：\n\n- 如果我们有一个栈映射帧和一个传入的类型状态，则该类型状态必须可以赋值给栈映射帧中的。然后我们可以使用栈映射帧给出的类型状态继续检查剩余流。\n\
  点击此处查看代码图像\n```prolog\nmergedCodeIsTypeSafe(Environment, [stackMap(Offset, MapFrame)\
  \ | MoreCode], frame(Locals, OperandStack, Flags)) :-\n    frameIsAssignable(frame(Locals,\
  \ OperandStack, Flags), MapFrame),\n    mergedCodeIsTypeSafe(Environment, MoreCode,\
  \ MapFrame).\n```\n\n- 合并代码流相对于传入的类型状态 `T` 是安全的，如果它以一个相对于 `T` 类型安全的指令 `I` 开头，且 `I`\
  \ *满足* 它的异常处理器（见下文），并且流的尾部在执行 `I` 之后的类型状态是安全的。`NextStackFrame` 指示后续指令。对于无条件跳转指令，它将具有特殊值\
  \ `afterGoto`。`ExceptionStackFrame` 指示传递给异常处理器的内容。\n点击此处查看代码图像\n```prolog\nmergedCodeIsTypeSafe(Environment,\
  \ [instruction(Offset, Parse) | MoreCode], frame(Locals, OperandStack, Flags)) :-\n\
  \    instructionIsTypeSafe(Parse, Environment, Offset, frame(Locals, OperandStack,\
  \ Flags), NextStackFrame, ExceptionStackFrame).\n```\n\n\n\n\n[content]\n\n```prolog\n\
  instructionSatisfiesHandlers(Environment, Offset, ExceptionStackFrame),\nmergedCodeIsTypeSafe(Environment,\
  \ MoreCode, NextStackFrame).\n```\n\n- 在无条件跳转（由传入的类型状态 `afterGoto` 表示）之后，如果我们有一个栈映射帧提供了后续指令的类型状态，我们就可以继续执行并使用栈映射帧提供的类型状态对它们进行类型检查。\n\
  \n点击此处查看代码图像\n\n```prolog\nmergedCodeIsTypeSafe(Environment, [stackMap(Offset, MapFrame)\
  \ | MoreCode], afterGoto) :-\n    mergedCodeIsTypeSafe(Environment, MoreCode, MapFrame).\n\
  ```\n\n- 在无条件跳转之后如果有代码但没有为其提供栈映射帧，这是非法的。\n\n点击此处查看代码图像\n\n```prolog\nmergedCodeIsTypeSafe(_Environment,\
  \ [instruction(_, _) | _MoreCode], afterGoto) :-\n    write_ln('No stack frame after\
  \ unconditional branch'),\n    fail.\n```\n\n- 如果代码末尾有一个无条件跳转，则停止。\n\n点击此处查看代码图像\n\
  \n```prolog\nmergedCodeIsTypeSafe(_Environment, [endOfCode(Offset)], afterGoto).\n\
  ```\n\n如果目标目标关联了一个栈帧 `Frame`，并且当前栈帧 `StackFrame` 可以赋值给 `Frame`，则跳转到该目标是类型安全的。\n\n\
  点击此处查看代码图像\n\n```prolog\ntargetIsTypeSafe(Environment, StackFrame, Target) :-\n\
  \    offsetStackFrame(Environment, Target, Frame),\n    frameIsAssignable(StackFrame,\
  \ Frame).\n```\n\n如果一个指令满足了所有适用于该指令的异常处理器，则该指令被认为*满足其异常处理器*。\n\n点击此处查看代码图像\n\n```prolog\n\
  instructionSatisfiesHandlers(Environment, Offset, ExceptionStackFrame) :-\n    exceptionHandlers(Environment,\
  \ Handlers),\n    sublist(isApplicableHandler(Offset), Handlers, ApplicableHandlers),\n\
  \    checklist(instructionSatisfiesHandler(Environment, ExceptionStackFrame), ApplicableHandlers).\n\
  ```\n\n如果指令的偏移量大于或等于处理器的范围起始位置，且小于处理器的范围结束位置，则该异常处理器对该指令*适用*。\n\n点击此处查看代码图像\n\n\
  ```prolog\nisApplicableHandler(Offset, handler(Start, End, _Target, _ClassName))\
  \ :-\n    Offset >= Start,\n    Offset < End.\n```\n\n如果指令的传出类型状态为 `ExcStackFrame`，且处理器的目标（处理器代码的起始指令）在假设传入类型状态\
  \ `T` 的情况下是类型安全的，则该指令*满足*该异常处理器。类型状态 `T` 是通过从 `ExcStackFrame` 派生出来的，具体方法是将操作栈替换为一个仅包含处理器异常类的栈，从而从\
  \ `ExcStackFrame` 推导出来。\n\n点击此处查看代码图像\n\n```prolog\ninstructionSatisfiesHandler(Environment,\
  \ ExcStackFrame, Handler) :-\n    Handler = handler(_, _, Target, _),\n    currentClassLoader(Environment,\
  \ CurrentLoader),\n    handlerExceptionClass(Handler, ExceptionClass, CurrentLoader),\n\
  \    /* 栈仅包含异常。 */\n    ExcStackFrame = frame(Locals, _, Flags),\n    TrueExcStackFrame\
  \ = frame(Locals, [ ExceptionClass ], Flags),\n    operandStackHasLegalLength(Environment,\
  \ TrueExcStackFrame),\n    targetIsTypeSafe(Environment, TrueExcStackFrame, Target).\n\
  ```\n\n#### 4.10.1.7 加载和存储指令的类型检查\n\n所有加载指令都是共同模式的变体，区别在于指令加载的值的类型。\n\n从局部变量 `Index`\
  \ 加载类型为 `Type` 的值是类型安全的，前提是该局部变量的类型为 `ActualType`、`ActualType` 可以赋值给 `Type`，且将 `ActualType`\
  \ 推入传入的操作栈是一个有效的类型转换（§4.10.1.4），并产生新的类型状态 `NextStackFrame`。在执行加载指令后，类型状态将变为 `NextStackFrame`。\n\
  \n点击此处查看代码图像\n\n```prolog\nloadIsTypeSafe(Environment, Index, Type, StackFrame,\
  \ NextStackFrame) :-\n    StackFrame = frame(Locals, _OperandStack, _Flags),\n \
  \   nth0(Index, Locals, ActualType),\n    isAssignable(ActualType, Type),\n    validType(Environment,\
  \ [], ActualType, StackFrame, NextStackFrame).\n```\n\n所有存储指令都是共同模式的变体，区别在于指令存储的值的类型。通常情况下，如果存储指令引用的局部变量类型是\
  \ `Type` 的超类型，且操作栈顶是 `Type` 的子类型，则存储是类型安全的，其中 `Type` 是指令设计用于存储的类型。更准确地说，如果可以从操作栈中弹出一个“匹配”\
  \ `Type`（即 `Type` 的子类型）的类型 `ActualType`（§4.10.1.4），然后将该类型合法赋值给局部变量 `L[Index]`，则该存储是类型安全的。\n\
  \n点击此处查看代码图像\n\n```prolog\nstoreIsTypeSafe(_Environment, Index, Type, frame(Locals,\
  \ OperandStack, Flags), frame(NextLocals, NextOperandStack, Flags)) :-\n    popMatchingType(OperandStack,\
  \ Type, NextOperandStack, ActualType),\n    modifyLocalVariable(Index, ActualType,\
  \ Locals, NextLocals).\n```\n\n给定局部变量 `Locals`，将 `Index` 修改为类型 `Type` 会导致局部变量列表变为\
  \ `NewLocals`。修改过程较为复杂，因为某些值（及其对应的类型）占据两个局部变量。因此，修改 `L[N]` 可能需要修改 `L[N+1]`（因为该类型将同时占据\
  \ `N` 和 `N+1` 槽）或修改 `L[N-1]`（因为局部 `N` 曾是从局部 `N-1` 开始的两个字宽值/类型的上半部分，所以局部 `N-1` 必须失效），或者两者都涉及。下文对此进行了描述。我们从\
  \ `L[0]` 开始计数。\n\n点击此处查看代码图像\n\n```prolog\nmodifyLocalVariable(Index, Type, Locals,\
  \ NewLocals) :-\n    modifyLocalVariable(0, Type, Locals).\n```\n\n给定 `LocalsRest`（从索引\
  \ `I` 开始的局部变量后缀），将局部变量 `Index` 修改为类型 `Type` 会导致局部变量变为 `NextLocals`。如果 `I < Index-1`，只需将输入复制到输出并继续。如果\
  \ `I = Index-1`，局部 `I` 的类型可能会发生变化。这种情况发生在 `L[I]` 类型大小为 2 时。一旦我们将 `L[I+1]` 设置为新类型（以及对应的值），局部\
  \ `I` 将失效，因为其上半部分会被销毁。然后我们继续。\n\n点击此处查看代码图像\n\n```prolog\nmodifyLocalVariable(I,\
  \ Index, Type, [Locals1 | LocalsRest], [Locals1 | NextLocalsRest]) :-\n    I < Index\
  \ - 1,\n    I1 is I + 1,\n    modifyLocalVariable(I1, Index, Type, LocalsRest, NextLocalsRest).\n\
  modifyLocalVariable(I, Index, Type, [Locals1 | LocalsRest], [NextLocals1 | NextLocalsRest])\
  \ :-\n    I =:= Index - 1,\n    modifyPreIndexVariable(Locals1, NextLocals1),\n\
  \    modifyLocalVariable(Index, Index, Type, LocalsRest, NextLocalsRest).\n```\n\
  \n当我们找到变量且它只占据一个字时，我们将其更改为 `Type` 并完成。当我们找到变量且它占据两个字时，我们将其类型更改为 `Type`并将下一个字设置为\
  \ `top`。\n\n点击此处查看代码图像\n\n```prolog\nmodifyLocalVariable(Index, Index, Type, [_\
  \ | LocalsRest], [Type | LocalsRest]) :-\n    sizeOf(Type, 1).\nmodifyLocalVariable(Index,\
  \ Index, Type, [_, _ | LocalsRest], [Type, top | LocalsRest]) :-\n    sizeOf(Type,\
  \ 2).\n```\n[/content]\n\n\n\n我们将紧邻将修改类型的局部变量的局部索引称为 `预索引变量`（pre-index variable）。类型为\
  \ `InputType` 的预索引变量的未来类型为 `Result`。如果预索引局部变量的类型 `Type` 大小为 1，则保持不变。如果预索引局部变量的类型\
  \ `Type` 为 2，我们需要通过将其类型设置为 `top`，将其两个双字值的下半部分标记为不可用。\n\n点击此处查看图像\n\n```prolog\n\
  modifyPreIndexVariable(Type, Type) :- sizeOf(Type, 1).\nmodifyPreIndexVariable(Type,\
  \ top) :- sizeOf(Type, 2).\n```\n\n#### 4.10.1.8 保护成员（protected Members）的类型检查\n\n\
  所有访问成员的指令必须遵守有关 `protected` 成员的规则。本节描述了对应 JLS §6.6.2.1 的 `protected` 检查。\n\n`protected`\
  \ 检查仅适用于当前类父类的 `protected` 成员。其他类中的 `protected` 成员将由解析阶段进行的访问检查捕（§5.4.4）。共有四种情况：\n\
  \n- 如果一个类的名不是任何父类的名，则它就不可能是父类，因此可以安全地忽略。\n\n点击此处查看图像\n\n```prolog\npassesProtectedCheck(Environment,\
  \ MemberClassName, MemberName,\n            MemberDescriptor, StackFrame) :-\n \
  \   thisClass(Environment, class(CurrentClassName, CurrentLoader)),\n    superclassChain(CurrentClassName,\
  \ CurrentLoader, Chain),\n    notMember(class(MemberClassName, _), Chain).\n```\n\
  \n- 如果 `MemberClassName` 与某个父类的名相同，则正在解析的类确实可能是一个父类。在这种情况下，如果在不同的运行时包中没有名为 `MemberClassName`\
  \ 的父类拥有具有描述符 `MemberDescriptor` 且名为 `MemberName` 的 `protected` 成员，则不应用 `protected`\
  \ 检查。\n\n这是因为实际解析的类将是这些父类之一，，在这种情况下，我们知道它位于相同的运行时包中，且访问是合法的；或者该成员不是 `protected`\
  \ 且检查不适用；或者它将是一个子类，在这种情况下检查无论如何成功；或者它将是相同运行时包中的其他类，在这种情况下访问是合法的，不需要进行检查；或者验证器不需要将此标记为问题，因为它最终会因为解析强制失败而被捕获。\n\
  \n点击此处查看图像\n\n```prolog\npassesProtectedCheck(Environment, MemberClassName, MemberName,\n\
  \            MemberDescriptor, StackFrame) :-\n    thisClass(Environment, class(CurrentClassName,\
  \ CurrentLoader)),\n    superclassChain(CurrentClassName, CurrentLoader, Chain),\n\
  \    member(class(MemberClassName, _), Chain),\n    classesInOtherPkgWithProtectedMember(\n\
  \        class(CurrentClassName, CurrentLoader),\n        MemberName, MemberDescriptor,\
  \ MemberClassName, Chain, []).\n```\n\n- 如果在不同的运行时包中确实存在一个 `protected` 父类成员，则加载\
  \ `MemberClassName`；如果目标成员不是 `protected`，则不应用检查。（使用非 `protected` 的父类成员显然是正确的。）\n\
  \n点击此处查看图像\n\n```prolog\npassesProtectedCheck(Environment, MemberClassName, MemberName,\n\
  \            MemberDescriptor,\n            frame(_Locals, [Target | Rest], _Flags))\
  \ :-\n    thisClass(Environment, class(CurrentClassName, CurrentLoader)),\n    superclassChain(CurrentClassName,\
  \ CurrentLoader, Chain),\n    member(class(MemberClassName, _), Chain),\n    classesInOtherPkgWithProtectedMember(\n\
  \        class(CurrentClassName, CurrentLoader),\n        MemberName, MemberDescriptor,\
  \ MemberClassName, Chain, List),\n    List /= [],\n    loadedClass(MemberClassName,\
  \ CurrentLoader, ReferencedClass),\n    isProtected(ReferencedClass, MemberName,\
  \ Descriptor).\n```\n\n- 其他，使用类型为 `Target` 的对象的成员需要 `Target` 能够赋值给当前类的类型。\n\n点击此处查看图像\n\
  \n```prolog\npassesProtectedCheck(Environment, MemberClassName, MemberName,\n  \
  \          MemberDescriptor,\n            frame(_Locals, [Target | Rest], _Flags))\
  \ :-\n    thisClass(Environment, class(CurrentClassName, CurrentLoader)),\n    superclassChain(CurrentClassName,\
  \ CurrentLoader, Chain),\n    member(class(MemberClassName, _), Chain),\n    classesInOtherPkgWithProtectedMember(\n\
  \        class(CurrentClassName, CurrentLoader),\n        MemberName, MemberDescriptor,\
  \ MemberClassName, Chain, List),\n    List /= [],\n    loadedClass(MemberClassName,\
  \ CurrentLoader, ReferencedClass),\n    isProtected(ReferencedClass, MemberName,\
  \ Descriptor),\n    isAssignable(Target, class(CurrentClassName, CurrentLoader)).\n\
  ```\n\n如果谓词 `classesInOtherPkgWithProtectedMember(Class, MemberName, MemberDescriptor,\
  \ MemberClassName, Chain, List)` 中的 `List` 是 `Chain` 中所有名为 `MemberClassName` 且与\
  \ `Class` 在不同运行时包中具有名为 `MemberName` 的 `protected` 成员类的集合，则该谓词为真。\n\n点击此处查看图像\n\n\
  ```prolog\nclassesInOtherPkgWithProtectedMember(_, _, _, []).\nclassesInOtherPkgWithProtectedMember(Class,\
  \ MemberName,\n            MemberDescriptor, MemberClassName,\n            [class(MemberClassName,\
  \ L) | Tail],\n            [class(MemberClassName, L) | T]) :-\n    differentRuntimePackage(Class,\
  \ class(MemberClassName, L)),\n    loadedClass(MemberClassName, L, Super),\n   \
  \ isProtected(Super, MemberName, MemberDescriptor),\n    classesInOtherPkgWithProtectedMember(\n\
  \        Class, MemberName, MemberDescriptor, MemberClassName, Tail, T).\n\nclassesInOtherPkgWithProtectedMember(Class,\
  \ MemberName,\n            MemberDescriptor, MemberClassName,\n            [class(MemberClassName,\
  \ L) | Tail],\n            T) :-\n    differentRuntimePackage(Class, class(MemberClassName,\
  \ L)),\n    loadedClass(MemberClassName, L, Super),\n    isNotProtected(Super, MemberName,\
  \ MemberDescriptor),\n    classesInOtherPkgWithProtectedMember(\n        Class,\
  \ MemberName, MemberDescriptor, MemberClassName, Tail, T).\n```\n\n#### 4.10.1.9\
  \ 类型检查指令\n\n通常，指令的类型规则相对于环境 `Environment` 给出的，该环境定义了指令发生的类和方法（4.10.1.1），以及方法中的偏移量\
  \ `Offset`。规则规定，如果输入的类型状态 `StackFrame` 满足某些要求，则：\n\n- 指令是类型安全的。\n- 可以证明指令正常完成后的类型状态具有由\
  \ `NextStackFrame` 给出的特定形式，且指令异常完成后的类型状态由 `ExceptionStackFrame` 给出。\n\n\n\n\n指令异常完成后的类型状态与进入时的类型状态相同，不同的是操作数栈为空。\n\
  \n点击此处查看代码图像\n\n```prolog\nexceptionStackFrame(StackFrame, ExceptionStackFrame)\
  \ :-\n    StackFrame = frame(Locals, _OperandStack, Flags),\n    ExceptionStackFrame\
  \ = frame(Locals, [], Flags).\n```\n\n许多指令的类型规则与其他指令的规则是完全同构的。如果指令 `b1` 与另一个指令 `b2`\
  \ 同构，那么 `b1` 的类型规则就与 `b2` 的类型规则相同。\n\n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(Instruction,\
  \ Environment, Offset, StackFrame,\n                      NextStackFrame, ExceptionStackFrame)\
  \ :-\n    instructionHasEquivalentTypeRule(Instruction, IsomorphicInstruction),\n\
  \    instructionIsTypeSafe(IsomorphicInstruction, Environment, Offset,\n       \
  \                   StackFrame, NextStackFrame,\n                          ExceptionStackFrame).\n\
  ```\n\n每个规则的英文描述旨在保持易读、直观和简洁。因此，描述避免了重复上述给的所有上下文假设。特别是：\n\n- 描述没有显式提到环境。\n- 当描述后续提到操作数栈或局部变量时，指的是类型状态中的操作数栈和局部变量部分：无论是进入的类型状态还是输出的类型。\n\
  - 指令异常完成后的类型状态几乎与进入时的类型状态相同。只有在并非如此的情况下，描述才会讨论指令异常完成后的类型状态。\n- 描述了在操作数栈上弹出和推送类型，而没有显式讨论栈下溢或溢出的问题。描述假设这些操作可以成功完成，但处理操作数栈的\
  \ Prolog 子句确保了进行了必要的检查。\n- 描述仅讨论了逻辑类型的处理。在实践中，某些类型占据超过一个字长。描述抽象了这些表示细节，但处理数据的 Prolog\
  \ 子句并没有。\n\n任何歧义都可以通过参考正式的 Prolog 子句来解决。\n\n### aaload\n\n`aaload` 指令是类型安全的，当且仅当可以合法将匹配\
  \ `int` 和组件类型为 `ComponentType` 的数组类型（其中 `ComponentType` 是 `Object` 的子类型）替换，并产生输出的类型状态。\n\
  \n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(aaload, Environment, _Offset, StackFrame,\n\
  \                      NextStackFrame, ExceptionStackFrame) :-\n    nth1OperandStackIs(2,\
  \ StackFrame, ArrayType),\n    arrayComponentType(ArrayType, ComponentType),\n \
  \   isBootstrapLoader(BL),\n    validTypeTransition(Environment,\n             \
  \            [int, arrayOf(class('java/lang/Object', BL))],\n                  \
  \       ComponentType, StackFrame, NextStackFrame),\n    exceptionStackFrame(StackFrame,\
  \ ExceptionStackFrame).\n```\n\n`X` 数组的组件类型是 `X`。我们将 `null` 的组件类型定义为 `null`。\n\n\
  点击此处查看代码图像\n\n```prolog\narrayComponentType(arrayOf(X), X).\narrayComponentType(null,\
  \ null).\n```\n\n### aastore\n\n`aastore` 指令是类型安全的，当且仅当可以从进入的操作数栈中弹出匹配 `Object`、`int`\
  \ 和 `Object` 数组的类型，并产生输出的类型状态。\n\n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(aastore,\
  \ _Environment, _Offset, StackFrame,\n                      NextStackFrame, ExceptionStackFrame)\
  \ :-\n    isBootstrapLoader(BL),\n    canPop(StackFrame, [class('java/lang/Object',\
  \ BL),\n                        int,\n                        arrayOf('java/lang/Object',\
  \ BL)]),\n           NextStackFrame),\n    exceptionStackFrame(StackFrame, ExceptionStackFrame).\n\
  ```\n\n### aconst_null\n\n`aconst_null` 指令是类型安全的，如果可以合法地将 `null` 推入进入的栈并产生输出的类型状态。\n\
  \n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(aconst_null, Environment, _Offset,\
  \ StackFrame,\n                      NextStackFrame, ExceptionStackFrame) :-\n \
  \   validTypeTransition(Environment, [], StackFrame, NextStackFrame),\n    exceptionStackFrame(StackFrame,\
  \ ExceptionStackFrame).\n```\n\n### aload, aload_<n>\n\n如果操作数为 `Index` 且类型为 `reference`\
  \ 的加载指令是类型安全的并产生输出类型状态 `NextStackFrame`，则操作数为 `Index` 的 `aload` 指令也是类型安全的，并产生相同的\
  \ `NextStackFrame`。\n\n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(aload(Index),\
  \ Environment, _Offset, StackFrame,\n                      NextStackFrame, ExceptionStackFrame)\
  \ :-\n    loadIsTypeSafe(Environment, Index, reference, StackFrame, NextStackFrame),\n\
  \    exceptionStackFrame(StackFrame, ExceptionStackFrame).\n```\n\n对于 0 ≤ `n` ≤\
  \ 3，指令 `aload_<n>` 是类型安全的，当且仅当等效的 `aload` 指令是类型安全的。\n\n点击此处查看代码图像\n\n```prolog\n\
  instructionHasEquivalentTypeRule(aload_0, aload(0)).\ninstructionHasEquivalentTypeRule(aload_1,\
  \ aload(1)).\ninstructionHasEquivalentTypeRule(aload_2, aload(2)).\ninstructionHasEquivalentTypeRule(aload_3,\
  \ aload(3)).\n```\n\n### anewarray\n\n操作数为 `CP` 的 `anewarray` 指令是类型安全的，当且仅 `CP`\
  \ 指向一个表示类类型或数组类型的常量池，且可以合法将进入的操作数栈上匹配 `int` 的类型替换为组件类型为 `CP` 的数组，并产生输出的类型状态。\n\n\
  点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(anewarray(CP), Environment, _Offset,\
  \ StackFrame,\n                      NextStackFrame, ExceptionStackFrame) :-\n \
  \   (CP = class(_, _) ; CP = arrayOf(_)),\n    validTypeTransition(Environment,\
  \ [int], arrayOf(CP),\n                         StackFrame, NextStackFrame),\n \
  \   exceptionStackFrame(StackFrame, ExceptionStackFrame).\n```\n\n### areturn\n\n\
  `areturn` 指令是类型安全的，当且仅当封装的方法有一个声明的返回类型 `ReturnType`，其为 `reference` 类型，且可以合法地从进入的操作数栈中弹出匹配\
  \ `ReturnType` 的类型。\n\n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(areturn, Environment,\
  \ _Offset, StackFrame,\n                      afterGoto, ExceptionStackFrame) :-\n\
  \    thisMethodReturnType(Environment, ReturnType),\n    isAssignable(ReturnType,\
  \ reference),\n    canPop(StackFrame, [ReturnType], _PoppedStackFrame),\n    exceptionStackFrame(StackFrame,\
  \ ExceptionStackFrame).\n```\n\n### arraylength\n\n`arraylength` 指令是类型安全的，当且仅当可以合法将进入的操作数栈上的数组类型替换为类型\
  \ `int`，并产生输出的类型状态。\n\n点击此处查看代码图像\n\n```prolog\ninstructionIsTypeSafe(arraylength,\
  \ Environment, _Offset, StackFrame,\n                      NextStackFrame, ExceptionStackFrame)\
  \ :-\n    nth1OperandStackIs(1, StackFrame, ArrayType),\n    arrayComponentType(ArrayType,\
  \ _),\n    validTypeTransition(Environment, [top], int, StackFrame, NextStackFrame),\n\
  \    exceptionStackFrame(StackFrame, ExceptionStackFrame).\n```\n\n### astore, astore_<n>\n\
