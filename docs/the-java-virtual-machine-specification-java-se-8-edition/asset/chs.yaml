  \ 被推入操作数栈。\n\n**Notes**\n`i2s` 指令执行收窄原始转换（JLS §5.1.3）。它可能会丢失 `value` 整体幅度的信息。`result`\
  \ 的符号也可能与 `value` 不相同。\n\n### iadd\n\n**Operation**\n`int` 相加\n\n**Format**\n![Image](img/448fig01.jpg)\n\
  \n**Forms**\n`iadd` = 96 (0x60)\n\n**Operand**\n..., `value1`, `value2` →\n\n**Stack**\n\
