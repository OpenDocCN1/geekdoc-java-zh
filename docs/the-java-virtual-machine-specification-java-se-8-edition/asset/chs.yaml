  \ →\n\n**栈**\n..., `result`\n\n**描述**\n操作数栈顶部的 `value` 必须是 `long` 类型。它从操作数栈中弹出并使用\
  \ IEEE 754 最近舍入模式转换为 `float` 类型 `result`。`result` 被推入操作数栈。\n\n**注意**\n`l2f` 指令执行宽原类型转换（JLS\
  \ §5.1.2），可能会丢失精度，因为 `float` 类型的值只有 24 位尾数位。\n\n### l2i\n\n**操作**\n将 `long` 转换为\
  \ `int`\n\n**格式**\n![Image](img/503fig01.jpg)\n\n**形式**\n`l2i` = 136 (0x88)\n\n\
  **操作数**\n..., `value` →\n\n**栈**\n..., `result`\n\n**描述**\n操作数栈顶部的 `value` 必须是 `long`\
  \ 类型。它从操作数栈中弹出，通过取 `long` 值的低 32 位并丢弃高 32 位来转换为 `int` 类型 `result`。`result` 被推入操作数栈。\n\
  \n**注意**\n`l2i` 指令执行窄原类型转换（JLS §5.1.3）。它可能会丢失关于 `value` 整体幅度的信息。`result` 的符号可能与\
  \ `value` 不相同。\n\n### ladd\n\n**操作**\n加 `long`\n\n**格式**\n![Image](img/504fig01.jpg)\n\
  \n**形式**\n`ladd` = 97 (0x61)\n\n**操作数**\n..., `value1`, `value2` →\n\n**栈**\n...,\
  \ `result`\n\n**描述**\n`value1` 和 `value2` 必须都是 `long` 类型。这两个值从操作数栈中弹出。`long` 类型\
  \ `result` 为 `value1` + `value2`。`result` 被推入操作数栈。\n\n### laload\n\n**操作**\n从数组加载\
  \ `long`\n\n**格式**\n![Image](img/505fig01.jpg)\n\n**形式**\n`laload` = 47 (0x2f)\n\
  \n**操作数**\n..., `arrayref`, `index` →\n\n**栈**\n..., `value`\n\n**描述**\n`arrayref`\
  \ 必须是 `reference` 类型，并且引用一个组件类型为 `long` 的数组。`index` 必须是 `int` 类型。`arrayref` 和 `index`\
  \ 都从操作数栈中弹出。获取数组在 `index` 处的 `long` 类型 `value`。\n\n### land\n\n**操作**\n布尔与运算 `long`\n\
  \n**格式**\n![Image](img/506fig01.jpg)\n\n**形式**\n`land` = 127 (0x7f)\n\n**操作数**\n\
  ..., `value1`, `value2` →\n\n**栈**\n..., `result`\n\n**描述**\n`value1` 和 `value2`\
  \ 必须都是 `long` 类型。它们从操作数栈中弹出。通过对 `value1` 和 `value2` 进行按位与运算计算 `long` 类型 `result`。\n\
  \n### lastore\n\n**操作**\n将 `long` 存储数组\n\n**格式**\n![Image](img/507fig01.jpg)\n\n\
  **形式**\n`lastore` = 80 (0x50)\n\n**操作数**\n..., `arrayref`, `index`, `value` →\n\n\
  **栈**\n\n**描述**\n`arrayref` 必须是 `reference` 类型，并且引用一个组件类型为 `long` 的数组。`index` 必须是\
  \ `int` 类型，`value` 必须是 `long` 类型。`arrayref`、`index` 和 `value` 从操作数栈中弹出。将 `long`\
  \ 类型 `value` 存储在 `index` 索引的数组中。\n\n### lcmp\n\n**操作**\n比较 `long`\n\n**格式**\n![Image](img/508fig01.jpg)\n\
  \n**形式**\n`lcmp` = 148 (0x94)\n\n**操作数**\n..., `value1`, `value2` →\n\n**栈**\n...,\
  \ `result`\n\n**描述**\n`value1` 和 `value2` 必须都是 `long` 类型。它们都从操作数栈中弹出，并执行符号整数比较。如果\
  \ `value1` 大于 `value2`，则将 `int` 类型 1 推入操作数栈。如果 `value1` 等于 `value2`，则将 0 推入操作数栈。如果\
  \ `value1` 小于 `value2`，则将 -1 推入操作数栈。\n\n### lconst_<l>\n\n**操作**\n推入 `long` 常量\n\
  \n**格式**\n![Image](img/509fig01.jpg)\n\n**形式**\n`lconst_0` = 9 (0x0x9)\n`lconst_1`\
  \ = 10 (0xa)\n\n**操作数**\n... →\n\n**栈**\n..., `<l>`\n\n**描述**\n将 `long` 常量 `<l>`（0\
  \ 或 1）推入操作数栈。\n\n### ldc\n\n**操作**\n从运行时常量池推送项\n\n**格式**\n![Image](img/510fig01.jpg)\n\
  \n**形式**\n`ldc` = 18 (0x12)\n\n**操作数**\n... →\n\n**栈**\n..., `value`\n\n**描述**\n\
  `index` 是一个无符号字节，必须是当前类运行时常量池的有效索引（§2.6）。运行时常量池中 *index* 处的条目必须是 `int` 或 `float`\
  \ 运行时常量，或者是指向字符串字面量的 `reference`，或者是指向类、方法类型或方法句柄的符号引用（§5.1）。\n\n\n\n\n\n如果运行时常量池项是类型为\
  \ `int` 或 `float` 的运行时常量，则该运行时常量的数值 `value` 将被分别作为 `int` 或 `float` 推送到操作数栈上。\n\n\
  否则，如果运行时常量池项是指向 `String` 类实例的引用，且该实例表示一个字符串字面量（§5.1），则该实例的引用 `value`（引用）被推送到操作数栈上。\n\
  \n否则，如果运行时常量池项是某个类的符号引用（§5.1），则对该命名的类进行解析（§5.4.3.1），并将代表该类的 `Class` 对象的引用 `value`（引用）推送到操作数栈上。\n\
  \n否则，运行时常量池项必须是指向方法类型或方法句柄的符号引用（§5.1）。该方法类型或方法句柄将被解析（§5.4.3.5），并将由此产生的 `java.lang.invoke.MethodType`\
  \ 或 `java.lang.invoke.MethodHandle` 实例引用 `value`（引用）推送到操作数栈上。\n\n### 连接异常\n\n在解析指向类的符号引用期间，可能会抛出任何与类解析相关的异常（§5.4.3.1）。\n\
  \n在解析指向方法类型或方法句柄的符号引用期间，可能会抛出任何与方法类型或方法句柄解析相关的异常（§5.4.3.5）。\n\n### 注意事项\n\n`ldc`\
  \ 指令只能用于推送从浮点数值集（§2.3.2）中取的类型为 `float` 的值，因为常量池（§4.4.4）中的类型为 `float` 的常量必须从浮点数值集中取出。\n\
  \n### ldc_w\n\n#### 操作\n从运行时常量池（宽索引）推入项目\n\n#### 格式\n![Image](img/512fig01.jpg)\n\
  \n#### 形式\n`ldc_w` = 19 (0x13)\n\n#### 操作数\n... →\n\n#### 栈\n..., `value`\n\n####\
  \ 描述\n无符号的 `indexbyte1` 和 `indexbyte2` 被组成为一个无符号的 16 位索引，指向当前类的运行时常量池（§2.6），其中索引值的计算方式为\
  \ (`indexbyte1` `<<` 8) | `indexbyte2`。该索引必须是当前类运行时常量池的有效索引。索引处的运行时常量池项必须是类型为 `int`\
  \ 或 `float` 的运行时常量，或者是指向字符串字面量的引用，或者是指向类、方法类型或方法句柄的符号引用（§5.1）。\n\n如果运行时常量池项是类型为\
  \ `int` 或 `float` 的运行时常量，则该运行时常量的数值 `value` 将被分别作为 `int` 或 `float` 推送到操作数栈上。\n\n\
  否则，如果运行时常量池项是指向 `String` 类实例的引用，且该实例表示一个字符串字面量（§5.1），则该实例的引用 `value`（引用）被推送到操作数栈上。\n\
  \n否则，如果运行时常量池项是某个类的符号引用（§4.4.1）。对该命名的类进行解析（§5.4.3.1），并将代表该类的 `Class` 对象的引用 `value`（引用）推送到操作数栈上。\n\
  \n否则，运行时常量池项必须是指向方法类型或方法句柄的符号引用（§5.1）。该方法类型或方法句柄将被解析（§5.4.3.5），并将由此产生的 `java.lang.invoke.MethodType`\
  \ 或 `java.lang.invoke.MethodHandle` 实例引用 `value`（引用）推送到操作数栈上。\n\n#### 连接异常\n在解析指向类的符号引用期间，可能会抛出任何与类解析相关的异常（§5.4.3.1）。\n\
  \n在解析指向方法类型或方法句柄的符号引用期间，可能会抛出任何与方法类型或方法句柄解析相关的异常（§5.4.3.5）。\n\n#### 注意事项\n`ldc_w`\
  \ 指令与 `ldc` 指令（§*ldc*）相同，仅其运行时常量池索引更宽。\n\n`ldc_w` 指令只能用于推送从浮点数值集（§2.3.2）中取的类型为 `float`\
  \ 的值，因为常量池（§4.4.4）中的类型为 `float` 的常量必须从浮点数值集中取出。\n\n### ldc2_w\n\n#### 操作\n从运行时常量池（宽索引）推入\
  \ `long` 或 `double`\n\n#### 格式\n![Image](img/514fig01.jpg)\n\n#### 形式\n`ldc2_w`\
  \ = 20 (0x14)\n\n#### 操作数\n... →\n\n#### 栈\n..., `value`\n\n#### 描述\n无符号的 `indexbyte1`\
  \ 和 `indexbyte2` 被组成为一个无符号的 16 位索引，指向当前类的运行时常量池（§2.6），其中索引值的计算方式为 (`indexbyte1`\
  \ `<<` 8) | `indexbyte2`。该索引必须是当前类运行时常量池的有效索引。索引处的运行时常量池项必须是类型为 `int` 或 `float`\
  \ 的运行时常量，或者是指向字符串字面量的引用，或者是指向类、方法类型或方法句柄的符号引用（§5.1）。\n\n`ldc2_w` 指令使用双字节无符号索引。\n\
  \n#### 注意事项\n`ldc2_w` 指令从运行时常量池推入 `long` 或 `double`。`ldc` 指令推送从浮点数值集中取的 `float`\
  \ 类型值。\n\n### ldiv\n\n#### 操作\n除法 `long`\n\n#### 格式\n![Image](img/515fig01.jpg)\n\
  \n#### 形式\n`ldiv` = 109 (0x6d)\n\n#### 操作数\n..., `value1`, `value2` →\n\n#### 栈\n\
  ..., `result`\n\n#### 描述\n`value1` 和 `value2` 必须是 `long` 类型。从操作数栈弹出值。`result` 是\
  \ Java 表达式 `value1 / value2`。\n\n`long` 除法向 0 舍入；即，产生的 `long` 商 `q` 满足 |d| · |q|\
  \ ≤ |*n|。此外，当 |n| ≥ |d| 且 *n* 与 *d* 符号相同时，*q* 为正；但当 |n| ≥ |d| 且 *n* 与 *d* 符号相反时，*q*\
  \ 为负。\n\n有一个特殊情况不符合此规则：如果被除数为 `long` 最大负整数且除数为 -1，则会发生溢出且结果等于被除数；尽管溢出，也不会抛出异常。\n\
  \n#### 运行时异常\n当 `long` 除法的除数为 0 时，`ldiv` 抛出 `ArithmeticException`。\n\n### lload\n\
  \n#### 操作\n从局部变量加载 `long`\n\n#### 格式\n![Image](img/516fig01.jpg)\n\n#### 形式\n`lload`\
  \ = 22 (0x16)\n\n#### 操作数\n... →\n\n#### 栈\n..., `value`\n\n#### 描述\n*index* 是无符号字节。*index*\
  \ 和 *index*+1 必须是当前帧局部变量数组的索引（§2.6）。*index* 处的局部变量必须包含一个 `long`。*index* 处的局部变量的值\
  \ *value* 推送到操作数栈上。\n\n#### 注意事项\n`lload` 操作码可以配合 `wide` 指令（§*wide*）使用双字节无符号索引访问局部变量。\n\
  \n#### lload_<n>\n\n#### 操作\n从局部变量加载 `long`\n\n#### 格式\n![Image](img/517fig01.jpg)\n\
  \n#### 形式\n`lload_0` = 30 (0x1e), `lload_1` = 31 (0x1f), `lload_2` = 32 (0x20),\
  \ `lload_3` = 33 (0x21)\n\n#### 操作数\n... →\n\n#### 栈\n..., `value`\n\n\n\n\n\n##\
  \ Description\n`n` 和 `n+1` 必须是当前帧局部变量数组的索引（§2.6）。位于 `n` 处的局部变量必须包含一个 `long` 类型。`n`\
  \ 处的局部变量的值被推入操作数栈。\n\n## 注意事项\n每个 `lload_<n>` 指令都与 `index` 为 `n` 的 `lload` 相同，只是操作数\
  \ `n` 是隐式的。\n\n### lmul\n\n#### 操作\n相乘 `long`\n\n#### 格式\n![Image](img/518fig01.jpg)\n\
  \n#### 形式\n`lmul` = 105 (0x69)\n\n#### 操作数\n..., `value1`, `value2` →\n\n#### 栈\n\
  ..., `result`\n\n#### Description\n`value1` 和 `value2` 必须是 `long` 类型。这两个值从操作数栈中弹出。`long`\
  \ 类型的 `result` 为 `value1` * `value2`。`result` 被推入操作数栈。\n\n结果是在足够宽的补码格式下真实数学结果的 64\
  \ 位低位，表示为 `long` 类型的值。如果发生溢出，结果的符号可能与两个值进行数学乘法后结果的符号不同。\n\n尽管可能会发生溢出，但执行 `lmul`\
  \ 指令永远不会抛出运行时异常。\n\n### lneg\n\n#### 操作\n取反 `long`\n\n#### 格式\n![Image](img/519fig01.jpg)\n\
  \n#### 形式\n`lneg` = 117 (0x75)\n\n#### 操作数\n..., `value` →\n\n#### 栈\n..., `result`\n\
  \n#### Description\n`value` 必须是 `long` 类型。它从操作数栈中弹出。`long` 类型的 `result` 是 `value`\
  \ 的算术取反，即 `-value`。`result` 被推入操作数栈。\n\n对于 `long` 值，取反等同于减零。由于 Java 虚拟机对整数使用补码表示法，且补码值的范围是非对称的，因此最大负\
  \ `long` 的取反结果仍是该最大负数。尽管发生了溢出，但不会抛出异常。\n\n对于所有 `long` 值 `x`，`-x` 等于 `(~x)+1`。\n\n\
  ### lookupswitch\n\n#### 操作\n通过键匹配访问表并跳转\n\n#### 格式\n![Image](img/520fig01.jpg)\n\
  \n#### 形式\n`lookupswitch` = 171 (0xab)\n\n#### 操作数\n..., `key` →\n\n#### 栈\n...\n\
  \n#### Description\n`lookupswitch` 是一个变长指令。在 `lookupswitch` 操作码之后，必须有 0 到 3 个字节作为填充，使得\
  \ `defaultbyte1` 开始的地址是当前方法起始位置（其第一条指令的操作码）的 4 字节倍数。紧随填充之后是一系列带符号 32 位的值：`default`、`npairs`，然后是\
  \ `npairs` 对带符号 32 位的值。`npairs` 必须大于或等于 0。`npairs` 中的每对值由一个 `int` 类型 `match` 和一个带符号的\
  \ 32 位 `offset` 组成。每个带符号的 32 位值都由四个无符号字节构造为（`byte1` `<<` 24) | (`byte2` `<<` 16)\
  \ | (`byte3` `<<` 8) | `byte4`。\n\n`lookupswitch` 指令的 `match-offset` 对必须按照 `match`\
  \ 的数值递增顺序排序。\n\n`key` 必须是 `int` 类型，并从操作数栈中弹出。`key` 与 `match` 值进行比较。如果它等于其中一个值，则通过向此\
  \ `lookupswitch` 指令的操作码地址加上相应的 `offset` 来计算目标地址。如果 `key` 不匹配任何 `match` 值，则通过向此 `lookupswitch`\
  \ 指令的操作码地址加上 `default` 来计算目标地址。然后在目标地址处继续执行。\n\n从每个 `match-offset` 对的 `offset` 计算出的目标地址，以及从\
  \ `default` 计算出的地址，必须是包含该 `lookupswitch` 指令的方法内指令的操作码地址。\n\n#### 注意事项\n`lookupswitch`\
  \ 指令对 4 字节操作数要求的对齐保证了：当且仅当包含该 `lookupswitch` 的方法位于 4 字节边界时，这些操作数才是 4 字节对齐的。\n\n\
  `match-offset` 对进行排序是为了支持比线性搜索更快的查找例程。\n\n### lor\n\n#### 操作\n逻辑或 `long`\n\n####\
  \ 格式\n![Image](img/522fig01.jpg)\n\n#### 形式\n`lor` = 129 (0x81)\n\n#### 操作数\n...,\
  \ `value1`, `value2` →\n\n#### 栈\n..., `result`\n\n#### Description\n`value1` 和\
  \ `value2` 必须是 `long` 类型。它们从操作数栈中弹出。通过对 `value1` 和 `value2` 进行按位包含或运算计算出一个 `long`\
  \ 类型的 `result`。`result` 被推入操作数栈。\n\n### lrem\n\n#### 操作\n取余 `long`\n\n#### 格式\n\
  ![Image](img/523fig01.jpg)\n\n#### 形式\n`lrem` = 113 (0x71)\n\n#### 操作数\n..., `value1`,\
  \ `value2` →\n\n#### 栈\n..., `result`\n\n#### Description\n`value1` 和 `value2` 必须是\
  \ `long` 类型。这些值从操作数栈中弹出。`long` 类型的 `result` 为 `value1` - (`value1` / `value2`) *\
  \ `value2`。`result` 被推入操作数栈。\n\n`lrem` 指令的结果使得 `(a/b)*b + (a%b)` 等于 `a`。即使在被数为该类型范围内最大的负\
  \ `long` 且除数为 -1 的特殊情况下（余数为 0），该等式也成立。根据这条规则，取余结果只有在被数为负时才为负，在被数为正时才为正；此外，结果的绝对值始终小于除数的绝对值。\n\
  \n#### 运行时异常\n如果 `long` 取余操作的除数为 0，`lrem` 将抛出 `ArithmeticException`。\n\n### lreturn\n\
  \n#### 操作\n从方法返回 `long`\n\n#### 格式\n![Image](img/524fig01.jpg)\n\n#### 形式\n`lreturn`\
  \ = 173 (0xad)\n\n#### 操作数\n..., `value` →\n\n#### 栈\n[空]\n\n#### Description\n\
  当前方法必须返回 `long` 类型。`value` 必须是 `long` 类型。如果当前方法是 `synchronized` 方法，则调用方法时进入或重新进入的锁将更新并可能像执行\
  \ `monitorexit` 指令一样退出（*monitorexit](#ch06a.html_ch06lev134)*）。如果没有异常抛出，`value`\
  \ 从当前帧的操作数栈（§2.6)）弹出调用者的操作数栈。当前方法操作数栈上的其他值将被丢弃。\n\n解释器随后将控制权交给调用者，恢复调用者的帧。\n\n####\
  \ 运行时异常\n如果 Java 虚拟机未强制 §2.11.10 中的结构化锁规则，那么当当前方法是 `synchronized` 方法且当前线程不是调用方法时进入的锁的所有者时，`lreturn`\
  \ 将抛出 `IllegalMonitorStateException`。这可能发生在，例如一个 `synchronized` 方法包含了 `monitorexit`\
  \ 指令，但未在该 `synchronized` 方法的对象上包含 `monitorenter` 指令。\n\n否则，如果 Java 虚拟机强制 §2.11.10\
  \ 中的结构化锁规则，且在调用当前方法期间违反了这些规则中的第一个，则 `lreturn` 将抛出 `IllegalMonitorStateException`。\n\
  \n### lshl\n\n#### 操作\n左移 `long`\n\n#### 格式\n![Image](img/525fig01.jpg)\n\n####\
  \ 形式\n`lshl` = 121 (0x79)\n\n#### 操作数\n..., `value1`, `value2` →\n\n#### 栈\n...,\
  \ `result`\n\n#### Description\n`value1` 必须是 `long` 类型，`value2` 必须是 `int` 类型。这些值从操作数栈中弹出。通过将\
  \ `value1` 向左移动 `s` 位计算出一个 `long` 类型的 `result`，其中 `s` 是 `value2` 的低 6 位。`result`\
  \ 被推入操作数栈。\n\n\n\n\n这等同于（即使发生溢出）乘以 2 的 `s` 次方。因此，实际使用的位移距离始终在 0 到 63 的范围内（包含），就像\
  \ `value2` 与掩码值 `0x3f` 执行了位逻辑与与操作一样。\n\n### lshr\n\n**操作**\n`long` 算术右移\n\n**格式**\n\
  ![Image](img/526fig01.jpg)\n\n**形式**\n`lshr` = 123 (0x7b)\n\n**操作数**\n..., `value1`,\
  \ `value2` →\n\n**栈**\n..., `result`\n\n**描述**\n`value1` 必须是 `long` 类型，`value2`\
  \ 必须是 `int` 类型。这两个值从操作数栈中弹出。通过将 `value1` 向右位移 `s` 个位并进行符号扩展，计算出 `long`  `result`，其中\
  \ `s` 是 `value2` 低 6 位的值。`result` 被推入操作数栈。\n\n**备注**\n结果为 `floor(value1 / 2^(s))`，其中\
  \ `s` 为 `value2 & 0x3f`。对于非负的 `value1`，这等同于将 `long` 除以 2 的 `s` 次。因此，实际使用的位移距离始终在\
  \ 0 到 63 的范围内（包含），就像 `value2` 与掩码值 `0x3f` 执行了位逻辑与与操作一样。\n\n## lstore\n\n**操作**\n\
  将 `long` 存储到局部变量\n\n**格式**\n![Image](img/527fig01.jpg)\n\n**形式**\n`lstore` = 55\
  \ (0x37)\n\n**操作数**\n..., `value` →\n\n**栈**\n...\n\n**描述**\n`index` 是一个无符号字节。`index`\
  \ 和 `index+1` 必须是当前帧局部变量数组的索引（§2.6）。操作数栈顶部的 `value` 必须是 `long` 类型。它从操作数栈中弹出，并将 `index`\
  \ 和 `index+1` 处的局部变量设置为 `value`。\n\n**备注**\n`lstore` 指令可以与 `wide` 指令（§*wide*）结合使用，使用双字节无符号索引访问局部变量。\n\
  \n## lstore_<n>\n\n**操作**\n将 `long` 存储到局部变量\n\n**格式**\n![Image](img/528fig01.jpg)\n\
  \n**形式**\n`lstore_0` = 63 (0x3f)\n`lstore_1` = 64 (0x40)\n`lstore_2` = 65 (0x41)\n\
  `lstore_3` = 66 (0x42)\n\n**操作数**\n..., `value` →\n\n**栈**\n...\n\n**描述**\n`<n>`\
  \ 和 `<n>`+1 必须是当前帧局部变量数组的索引（§2.6）。操作数栈顶部的 `value` 必须是 `long` 类型。它从操作数栈中弹出，并将 `<n>`\
  \ 和 `<n>`+1 处的局部变量设置为 `value`。\n\n**备注**\n每个 `lstore_<n>` 指令与 `index` 为 `<n>` 的\
  \ `lstore` 指令相同，只是操作数 `<n>` 是隐式的。\n\n## lsub\n\n**操作**\n相减 `long`\n\n**格式**\n![Image](img/529fig01.jpg)\n\
  \n**形式**\n`lsub` = 101 (0x65)\n\n**操作数**\n..., `value1`, `value2` →\n\n**栈**\n...,\
  \ `result`\n\n**描述**\n`value1` 和 `value2` 必须是 `long` 类型。这两个值从操作数栈中弹出。`long` `result`\
  \ 为 `value1 - value2`。`result` 被推入操作数栈。\n\n对于 `long` 减法，`a-b` 产生的结果与 `a+(-b)` 相同。对于\
  \ `long` 值，从 0 减去等同于取反。\n\n结果是在足够宽的补码格式中真实的数学结果的 64 位低位，表示为 `long` 类型的值。如果发生溢出，则结果的符号可能与两个值之间数学差的符号不同。\n\
  \n尽管可能会发生溢出，执行 `lsub` 指令永远不会抛出运行时异常。\n\n### lushr\n\n**操作**\n`long` 逻辑右移\n\n**格式**\n\
  ![Image](img/530fig01.jpg)\n\n**形式**\n`lushr` = 125 (0x7d)\n\n**操作数**\n..., `value1`,\
  \ `value2` →\n\n**栈**\n..., `result`\n\n**描述**\n`value1` 必须是 `long` 类型，`value2`\
  \ 必须是 `int` 类型。这两个值从操作数栈中弹出。通过将 `value1` 向右逻辑位移 `s` 个位并并进行零扩展，计算出 `long` `result`，其中\
  \ `s` 是 `value2` 低 6 位的值。`result` 被推入操作数栈。\n\n**备注**\n结果为 `floor(value1 / 2^(s))`，其中\
  \ `s` 为 `value2 & 0x3f`。对于非负的 `value1`，这等同于将 `long` 除以 2 的 `s` 次。因此，实际使用的位移距离始终在\
  \ 0 到 63 的范围内（包含），就像 `value2` 与掩码值 `0x3f` 执行了位逻辑与与操作一样。\n\n### lxor\n\n**操作**\n\
  `long` 位异或\n\n**格式**\n![Image](img/531fig01.jpg)\n\n**形式**\n`lxor` = 131 (0x83)\n\
  \n**操作数**\n..., `value1`, `value2` →\n\n**栈**\n..., `result`\n\n**描述**\n`value1`\
  \ 和 `value2` 必须是 `long` 类型。这两个值从操作数栈中弹出。`long` `result` 通过对 `value1` 和 `value2`\
  \ 进行位异或计算得出。`result` 被推入操作数栈。\n\n## monitorenter\n\n**操作**\n进入对象锁\n\n**格式**\n![Image](img/532fig01.jpg)\n\
  \n**形式**\n`monitoreter` = 194 (0xc2)\n\n**操作数**\n..., `objectref` →\n\n**栈**\n...\n\
  \n**描述**\n`objectref` 必须是 `reference` 类型。每个对象都关联一个锁。如果有所有者时锁才有效。执行 `monitoreter`\
  \ 的线程尝试获取 `objectref` 的锁，方式如下：\n\n- 如果 `objectref` 锁的计数为零，线程进入锁并将其设置为 1。该线程是锁的所有者。\n\
  - 如果线程已经拥有 `objectref` 锁，它将重新进入锁并增加计数。\n 如果 如果另一个线程已经拥有 `objectref` 锁，线程将阻塞，直到计数为零，然后再次尝试获取所有权。\n\
  \n**运行时异常**\n如果 `objectref` 为 `null`，`monitoreter` 将抛出 `NullPointerException`。\n\
  \n**备注**\n`monitoreter` 指令可以与一个或多个 `monitorexit` 指令（§monitorexit](#ch06a.html_ch06lev2sec134)*）配合使用，以实现\
  \ Java 语言中的 `synchronized` 语句（§3.14）。`synchronized` 方法在调用时的锁进入和返回时的锁退出由 Java 虚拟机隐式处理，就像使用了\
  \ `monitoreter` 和 `monitorexit` 一样。`synchronized` 方法的实现并不使用这些指令，但可以提供相同的语义。\n\n\
  锁与锁的关联可以通过多种方式管理，这些方法超出了本规范的范围。例如，锁可能与对象同时分配和释放。或者，在线程尝试获取对象的独占访问时动态分配，并在之后的时刻释放。\n\
  \nJava 语言的同步结构需要除了进入和退出之外的操作。这些包括等待锁（`Object.wait`）和通知等待的其他线程（`Object.notifyAll`\
  \ 和 `Object.notify`）。这些操作在 Java 虚拟机提供的标准包 `java.lang` 中得到了支持。虚拟机指令集中没有出现这些操作的显式支持。\n\
  \n## monitorexit\n\n**操作**\n退出对象锁\n\n**格式**\n![Image](img/534fig01.jpg)\n\n**形式**\n\
  `monitorexit` = 195 (0xc3)\n\n**操作数**\n..., `objectref` →\n\n**栈**\n...\n\n**描述**\n\
  `objectref` 必须是 `reference` 类型。执行 `monitorexit` 的线程必须是 `objectref` 所引实例关联锁的所有者。\n\
  \n\n\n\n该线程减少与 `objectref` 关联的监视器（monitor）的进入计数。如果结果计数值为零，则线程退出监视器并且不再是其所有者。其他阻塞等待进入监视器的线程被允许尝试进入。\n\
  \n### 运行时\n\n如果 `objectref` 为 `null`，`monitorexit` 将抛出 `NullPointerException`。\n\
  \n### 异常\n\n否则，如果执行 `monitorexit` 的线程不是由 `objectref` 所引实例关联监视器的所有者，`monitorexit`\
  \ 将抛出 `IllegalMonitorStateException`。\n\n否则，如果 Java 虚拟机实现强制执行 §2.11.10 中描述的结构化锁规则，且执行此\
  \ `monitorexit` 指令违反了这些规则中的第二条，则 `monitorexit` 将抛出 `IllegalMonitorStateException`。\n\
  \n### 注意事项\n\n一个或多个 `monitorexit` 指令可以配合 `monitorenter` 指令（§*monitorenter*）使用，以实现\
  \ Java 语言中的 `synchronized` 语句（§3.14）。`monitorenter` 和 `monitorexit` 指令未用于 `synchronized`\
  \ 方法实现，尽管它们可以用于提供等效锁定语义。\n\nJava 虚拟机对 `synchronized` 方法和 `synchronized` 语句内部抛出的异常处理方式不同：\n\
  \n* 正常完成 `synchronized` 方法时的监视器退出由 Java 虚拟机的返回指令处理。异常中止完成 `synchronized` 方法时的监视器退出由\
  \ Java 虚拟机的 `athrow` 指令隐式处理。\n* 当从 `synchronized` 语句内部抛出异常时，将使用 Java 虚拟机的异常处理机制退出在执行\
  \ `synchronized` 语句之前进入的监视器（§3.14）。\n\n### multianewarray\n\n#### 操作\n\n创建新的多维数组\n\
  \n#### 格式\n\n![Image](img/536fig01.jpg)\n\n#### 形式\n\n`multianewarray` = 197 (0xc5)\n\
  \n#### 操作数\n\n..., `count1`, [`count2`, ...] →\n\n#### 栈栈\n\n..., `arrayref`\n\n\
  #### 描述\n\n`dimensions` 操作数是一个无符号字节，必须大于或等于 1。它表示要创建的数组的维度数。操作数栈必须包含 `dimensions`\
  \ 个值。每个此类值都代表要创建的数组在某一维度上的组件数量，必须是 `int` 类型，且必须是非负数。`count1` 是第一维的预期长度，`count2`\
  \ 是第二维，以此此类推。\n\n所有的 `count` 值都会从操作数栈中弹出。无符号的 `indexbyte1` 和 `indexbyte2` 用于构建一个指向当前类运行时常量池的索引（§2.6），其中索引的值为\
  \ (`indexbyte1` `<<` 8) | `indexbyte2`。该索引处的运行时常量池项必须是指向类、数组或接口类型的符号引用。该命名的类、数组或接口类型将进行解析（§5.4.3.1）。结果项必须是维度大于或等于\
  \ `dimensions` 的数组类类型。\n\n从垃圾回收堆中分配一个该数组类型的新多维数组。如果任何 `count` 值为 0，则不分配后续的维度。数组第一维的组件被初始化为第二维类型的子数组，依此类推。数组最后一个分配维度的组件被初始化为该数组类型对应元素类型的默认初始值（§2.3,\
  \ §2.4）。一个指向新数组的引用 `reference` `arrayref` 被推入操作数栈中。\n\n#### 链接异常\n\n在解析指向类、数组或接口类型的符号引用期间，可能会抛出\
  \ §5.4.3.1 文档记录的任何异常。\n\n否则，如果当前类没有权限访问所解析数组类元素的元素类型，`multianewarray` 将抛出 `IllegalAccessError`。\n\
  \n#### 运行时异常\n\n否则，如果操作数栈上的任何 `dimensions` 值小于 0，`multianewarray` 指令将抛出 `NegativeArraySizeException`。\n\
  \n#### 注意事项\n\n在创建单维数组时，使用 `newarray` 或 `anewarray`（§*newarray*, §*anewarray*）可能更高效。\n\
  \n通过运行时常量池引用的数组类维度可能比 `multianewarray` 指令的 `dimensions` 操作数多。在这种情况下，仅创建数组的前 `dimensions`\
  \ 维维度。\n\n### new\n\n#### 操作\n\n创建新对象\n\n#### 格式\n\n![Image](img/538fig01.jpg)\n\
  \n#### 形式\n\n`new` = 187 (0xbb)\n\n#### 操作数\n\n...\n\n#### 栈栈\n\n..., `objectref`\n\
  \n#### 描述\n\n无符号的 `indexbyte1` 和 `indexbyte2` 用于构建一个指向当前类运行时常量池的索引（§2.6），其中索引的值为\
  \ (`indexbyte1` `<<` 8) | `indexbyte2`。该索引处的运行时常量池项必须是指向类或接口类型的符号引用。该命名的类或接口类型将进行解析（§5.4.3.1）并应产生类类型。从垃圾回收堆中为新实例分配内存，如果新对象的实例变量尚未初始化，则它们将被初始化为它们的默认值（§2.3,\
  \ §2.4）。一个指向该实例的引用 `reference` `objectref` 被推入操作数栈中。\n\n#### 链接异常\n\n在解析指向类、数组或接口类型的符号引用期间，可能会抛出\
  \ §5.4.3.1 文档记录的任何异常。\n\n否则，如果指向类的符号引用解析为接口或抽象类，`new` 将抛出 `InstantiationError`。\n\
  \n#### 运行时异常\n\n否则，执行此 `new` 指令导致引用类的初始化，`new` 可能会抛出 JLS §15.9 中详细的 `Error`。\n\n\
  #### 注意事项\n\n`new` 指令并未完全创建新实例；在对未初始化实例调用实例初始化方法（§2.9）之前，实例创建尚未完成。\n\n### newarray\n\
  \n#### 操作\n\n创建新数组\n\n#### 格式\n\n![Image](img/540fig01.jpg)\n\n#### 形式\n\n`newarray`\
  \ = 188 (0xbc)\n\n#### 操作数\n\n..., `count` →\n\n#### 栈栈\n\n..., `arrayref`\n\n####\
  \ 描述\n\n`count` 必须是 `int` 类型。它从操作数栈中弹出。`count` 表示要创建的数组的数量。\n\n`atype` 是指示要创建的类型的代码。它取以下值之一：\n\
  \n![Image](img/540tab01.jpg)\n\n**表 6.5.newarray-A. 数组类型代码**\n\n从垃圾回收堆中分配一个组件类型为\
  \ `atype` 且长度为 `count` 的新数组。指向此新数组对象的引用 `reference` `arrayref` 被推入操作栈。新数组的每个元素都被初始化为该数组类型元素类型的默认初始值（§2.3,\
  \ §2.4）。\n\n#### 运行时异常\n\n如果 `count` 小于 0，`newarray` 将抛出 `NegativeArraySizeException`。\n\
  \n\n\n\n\n\n在 Oracle 的 Java 虚拟机实现中，`boolean` 类型的数组（`atype` 为 `T_BOOLEAN`）被存储为 8\
  \ 位值的数组，并使用 `baload` 和 `bastore` 指令进行操作 (§*baload, §*bastore)，这些指令也访问 `byte` 类型的数组。其他实现可能会实现压缩的\
  \ `boolean` 数组；但仍必须使用 `baload` 和 `bastore` 指令来访问这些数组。\n\n## nop\n\n### Operation\n\
  什么都不做\n\n### Format\n![Image](img/542fig01.jpg)\n\n### Forms\n`nop` = 0 (0x0)\n\n\
  ### 操作数栈\n无变化\n\n### Description\n什么都不做。\n\n## pop\n\n### Operation\n弹出操作数栈顶的值\n\
  \n### Format\n![Image](img/543fig01.jpg)\n\n### Forms\n`pop` = 87 (0x57)\n\n###\
  \ 操作数\n..., `value` →\n\n### 栈\n...\n\n### Description\n从操作数栈弹出顶的值。\n\n除非 `value`\
  \ 是类别 1 计算类型的值，否则不得使用 `pop` 指令 (§2.11.1)。\n\n## pop2\n\n### Operation\n弹出操作数栈顶的一个或两个值\n\
  \n### Format\n![Image](img/544fig01.jpg)\n\n### Forms\n`pop2` = 88 (0x58)\n\n###\
  \ 操作数\n形式 1:\n\n### 栈\n..., `value2`, `value1` →\n...\n其中 `value1` 和 `value2` 的每一个都是类别\
  \ 1 计算类型的值 (§2.11.1)。\n\n形式 2:\n..., `value` →\n...\n其中 `value` 是类别 2 计算类型的值 (§2.11.1)。\n\
  \n### Description\n从操作数栈弹出顶的一个或两个值。\n\n## putfield\n\n### Operation\n设置对象中的字段\n\n\
  ### Format\n![Image](img/545fig01.jpg)\n\n### Forms\n`putfield` = 181 (0xb5)\n\n\
  ### 操作数\n..., `objectref`, `value` →\n\n### 栈\n...\n\n### Description\n无符号的 `indexbyte1`\
  \ 和 `indexbyte2` 用于构造指向当前类运行时常量池的索引 (§2.6)，其中索引的值为 (`indexbyte1` `<<` 8) | `indexbyte2`。该索引处的运行时常量池项必须是指向字段的符号引用\
  \ (§5.1)，该引用提供了字段的名称和描述符，以及指向查找该字段的类的符号引用。`objectref` 的类不能是数组。如果该字段是 `protected`\
  \ 的，且它是当前类某个父类的成员，并且该字段与当前类不在同一个运行时包 (§5.3) 中，那么 `objectref` 的类必须是当前类或当前类的子类。\n\n\
  引用的字段被解析 (§5.4.3.2)。`putfield` 指令存储的 `value` 的类型必须与所引用字段的描述符兼容 (§4.3.2)。如果字段描述符类型为\
  \ `boolean`、`byte`、`char`、`short` 或 `int`，则 `value` 必须是 `int`。如果字段描述符类型为 `float`、`long`\
  \ 或 `double`，则 `value` 分别是 `float`、`long` 或 `double`。如果字段描述符类型为引用类型，则 `value` 类型必须与字段描述符类型赋值兼容（JLS\
  \ §5.2）。如果字段是 `final` 的，它必须在当前类中声明，并且该指令必须出现在当前类的实例初始化方法 (`<init>`) 中 (§2.9)。\n\n\
  `value` 和 `objectref` 从操作数栈中弹出。`objectref` 的类型必须是 `reference`。`value` 经过值转换 (§2.8.3)，产生\
  \ `value'`，并且 `objectref` 中引用的字段被设置为 `value'`。\n\n### 链接异常\n在解析字段的符号引用过程中，可能会抛出任何与字段解析相关的异常\
  \ (§5.4.3.2)。\n\n否则，如果解析的字段是 `static` 字段，`putfield` 将抛出 `IncompatibleClassChangeError`。\n\
  \n否则，如果字段是 `final` 的，它必须在当前类中声明，并且指令必须出现在实例初始化方法 (`<init>`) 中。否则，抛出 `IllegalAccessError`。\n\
  \n### 运行时异常\n否则，如果 `objectref` 为 `null`，`putfield` 将抛出 `NullPointerException`。\n\
  \n## putstatic\n\n### Operation\n设置类中的静态字段\n\n### Format\n![Image](img/547fig01.jpg)\n\
  \n### Forms\n`putstatic` = 179 (0xb3)\n\n### 操作数\n..., `value` →\n\n### 栈\n...\n\
  \n### Description\n无符号的 `indexbyte1` 和 `indexbyte2` 用于构造指向当前类运行时常量池的索引 (§2.6)，其中索引的值为\
  \ (`indexbyte1` `<<` 8) | `indexbyte2`。该索引处的运行时常量池项必须是指向字段的符号引用 (§5.1)，该引用提供了字段的名称和描述符，以及指向查找该字段的类的符号引用。引用的字段被解析。`putstatic`\
  \ 指令存储的 `value` 的类型必须与所引用字段的描述符兼容 (§4.3.2)。如果字段描述符类型为 `boolean`、`byte`、`char`、`short`\
  \ 或 `int`，则 `value` 必须是 `int`。如果字段描述符类型为 `float`、`long` 或 `double`，则 `value` 分别是\
  \ `float`、`long` 或 `double`。如果字段描述符类型为引用类型，则 `value` 类型必须与字段描述符类型赋值兼容（JLS §5.2）。如果字段是\
  \ `final` 的，它必须在当前类中声明，并且指令必须出现在当前类的类初始化方法 (`<clinit>`) 中 (§2.9)。\n\n`value` 从操作数栈中弹出并经过值转换\
  \ (§2.8.3)，产生 `value'`，引用的字段被设置为 `value'`。\n\n### 链接异常\n在解析字段的符号引用过程中，可能会抛出任何与字段解析相关的异常\
  \ (§5.4.3.2)。\n\n否则，如果解析的字段不是 `static` 字段或接口字段，`putstatic` 将抛出 `IncompatibleClassChangeError`。\n\
  \n否则，如果字段是 `final` 的，它必须在当前类中声明，并且指令必须出现在类初始化方法 (`<clinit>`) 中。否则，抛出 `IllegalAccessError`。\n\
  \n### 运行时异常\n否则，如果执行此 `putstatic` 指令导致所引用类或接口的初始化，`putstatic` 可能会抛出 `Error`，详见 §5.5。\n\
  \n### 注意事项\n`putstatic` 指令仅用于在初始化接口字段时赋值。接口字段只能赋值一次，即在接口初始化时执行接口变量初始化表达式 (§5.5,\
  \ JLS §9.3.1)。\n\n## ret\n\n### Operation\n从子程序返回\n\n### Format\n![Image](img/549fig01.jpg)\n\
  \n### Forms\n`ret` = 169 (0xa9)\n\n### 操作数栈\n无变化\n\n### Description\n*index* 是一个\
  \ 0 到 255 之间的无符号字节。当前帧中 *index* 处的局部变量必须包含一个 `returnAddress` 类型的值 (§2.6)。局部变量的内容被写入\
  \ Java 虚拟机的 `pc` 寄存器，从那里继续执行。\n\n\n\n\n注意，`jsr` 将地址推入操作数栈，而 `ret` 则从局部变量中取出它。这种不对称性是有刻意的。\n\
  \n在 Oracle 对 Java SE 6 之前的 Java 编程语言编译实现中，`ret` 指令用于 `finally` 子句实现中的 `jsr` 和 `jsr_w`\
  \ 指令。\n\n不要混淆 `ret` 指令与 `return` 指令。`return` 指令将控制权返回给其调用者，而不向调用者传递任何值。\n\n`ret`\
  \ 操作码可以与 `wide` 指令结合使用，使用双字节无符号索引访问局部变量。\n\n### return\n\n**操作**\n从方法返回 `void`\n\
  \n**格式**\n![Image](img/550fig01.jpg)\n\n**形式**\n`return` = 177 (0xb1)\n\n**操作**\n\
  ... →\n\n**栈**\n[空]\n\n**描述**\n当前方法的返回类型必须为 `void`。如果当前方法是 `synchronized` 方法，则在调用方法时进入或重入的监视器（monitor）将被更新，并可能像在当前线程中执行\
  \ `monitorexit` 指令一样退出。如果没有抛出异常，当前帧操作数栈上的任何值都将被丢弃。\n\n解释器随后将控制权返回给方法的调用者，恢复调用者的帧帧。\n\
  \n**运行时异常**\n如果 Java 虚拟机实现没有强制结构化锁（structured locking）的规则，那么如果当前方法是 `synchronized`\
  \ 方法，且当前线程不是调用方法时进入或重入的监视器的所有者，`return` 将抛出 `IllegalMonitorStateException`。这可能会发生，例如，如果\
  \ `synchronized` 方法包含一个 `monitorexit` 指令，但在该方法所 `synchronized` 的对象上没有 `monitorenter`\
  \ 指令。\n\n否则，如果 Java 虚拟机实现强制执行结构化锁的规则，并且在调用当前方法期间违反了这些规则中的第一条，则 `return` 将抛出 `IllegalMonitorStateException`。\n\
  \n### saload\n\n**操作**\n从数组中加载 `short`\n\n**格式**\n![Image](img/551fig01.jpg)\n\n\
  **形式**\n`saload` = 53 (0x35)\n\n**操作**\n..., `arrayref`, `index` →\n\n**栈**\n...,\
  \ `value`\n\n**描述**\n`arrayref` 必须是 `reference` 类型，并且必须引用一个组件类型为 `short` 的数组。`index`\
  \ 必须是 `int` 类型。`arrayref` 和 `index` 都从操作数栈中弹出。获取数组在 `index` 处的组件并符号扩展为 `int` 类型\
  \ `value`。将该 `value` 推入操作数栈。\n\n**运行时**\n如果 `arrayref` 为 `null`，`saload` 抛出 `NullPointerException`。\n\
  \n**异常**\n否则，如果 `index` 不在 `arrayref` 所引用数组的边界范围内，`saload` 指令抛出 `ArrayIndexOutOfBoundsException`。\n\
  \n### sastore\n\n**操作**\n存储到 `short` 数组\n\n**格式**\n![Image](img/552fig01.jpg)\n\n\
  **形式**\n`sastore` = 86 (0x56)\n\n**操作**\n..., `arrayref`, `index`, `value` →\n\n\
  **栈**\n...\n\n**描述**\n`arrayref` 必须是 `reference` 类型，并且必须引用一个组件类型为 `short` 的数组。`index`\
  \ 和 `value` 必须是 `int` 类型。`arrayref`、`index` 和 `value` 都从操作数栈中弹出。`int` 类型 `value`\
  \ 被截断为 `short` 并存储为由 `index` 索引的数组组件。\n\n**运行时**\n如果 `arrayref` 为 `null`，`sastore`\
  \ 抛出 `NullPointerException`。\n\n**异常**\n否则，如果 `index` 不在 `arrayref` 所引用数组的边界范围内，`sastore`\
  \ 指令抛出 `ArrayIndexOutOfBoundsException`。\n\n### sipush\n\n**操作**\n推入 `short`\n\n\
  **格式**\n![Image](img/553fig01.jpg)\n\n**形式**\n`sipush` = 17 (0x11)\n\n**操作**\n...\
  \ →\n\n**栈**\n..., `value`\n\n**描述**\n立即无符号 `byte1` 和 `byte2` 值被组成一个中间 `short`，其中该\
  \ `short` 的值为 (`byte1` `<<` 8) | `byte2`。该中间值随后被符号扩展为 `int` 类型 `value`。将该 `value`\
  \ 推入操作数栈。\n\n### swap\n\n**操作**\n交换操作数栈顶部的两个值\n\n**格式**\n![Image](img/554fig01.jpg)\n\
  \n**形式**\n`swap` = 95 (0x5f)\n\n**操作**\n..., `value2`, `value1` →\n\n**栈**\n...,\
  \ `value1`, `value2`\n\n**描述**\n交换操作数栈上的两个值。除非 `value1` 和 `value2` 都是第 1 类计算类型的值，否则不能使用\
  \ `swap` 指令。\n\n**注意**\nJava 虚拟机没有提供实现第 2 类计算类型操作数交换的指令。\n\n### tableswitch\n\n\
  **操作**\n通过索引访问跳转表并跳转\n\n**格式**\n![Image](img/555fig01.jpg)\n\n**形式**\n`tableswitch`\
  \ = 170 (0xaa)\n\n**操作**\n..., `index` →\n\n**栈**\n...\n\n**描述**\n`tableswitch`\
  \ 是一个变长指令。在 `tableswitch` 指令码之后，必须有零到三个字节的填充，以确保 `default` 开始的地址是方法开始处 4 字节的倍数。填充之后是构成三个符号\
  \ 32 位值的字节：`default`、`low` 和 `high`。紧随之后是 `high` - `low` + 1 个符号 32 位偏移量的字节。`low`\
  \ 必须小于等于 `high`。这些 `high` - `low` + 1 个符号 32 位偏移量被视为一个基于 0 的跳转表。每个这些符号 32 位值通过 (`byte1`\
  \ `<<` 24) | (`byte2` `<<` 16) | (`byte3` `<<` 8) | `byte4` 构建。\n\n`index` 必须是 `int`\
  \ 类型并从操作数栈中弹出。如果 `index` 小于 `low` 或 `index` 大于 `high`，则通过将 `default` 加到 `tableswitch`\
  \ 指令码的地址来计算目标地址。否则，提取跳转表中位于 `index` - `low` 位置的偏移。通过将该偏移量加到 `tableswitch` 指令码的地址来计算目标地址。随后在目标地址继续执行。\n\
  \n通过每个跳转表偏移量计算出的地址，以及通过 `default` 计算出的地址，必须是包含该 `tableswitch` 指令的方法中某个指令的地址。\n\n\
  **注意**\n`tableswitch` 指令 4 字节操作数的对齐要求，当且仅当包含 `tableswitch` 的方法在 4 字节边界开始时，才能保证这些操作数的\
  \ 4 字节对齐。\n\n### wide\n\n**操作**\n通过额外的字节扩展局部变量索引\n\n**格式 1**\n![Image](img/557fig01.jpg)\n\
  其中 `<opcode>` 是 `iload`, `fload`, `aload`, `lload`, `dload`, `istore`, `fstore`,\
  \ `astore`, `lstore`, `dstore` 或 `ret` 。\n\n**格式 2**\n![Image](img/557fig02.jpg)\n\
  \n**形式**\n`wide` = 196 (0xc4)\n\n**操作数栈**\n与修改的指令相同\n\n**描述**\n\n\n\n\n\n`wide`\
  \ 指令会修改另一个指令的行为。它有两种格式，取决于被修改的指令。`wide` 指令的第一种形式修改 `iload`、`fload`、`aload`、`lload`、`dload`、`istore`、`fstore`、`astore`、`lstore`、`dstore`\
  \ 或 `ret` 之一（§iload, §fload, §aload, §lload, §dload, §istore, §fstore, §astore,\
  \ §lstore, §dstore, §ret)）。第二形式仅适用于 `iinc` 指令（§iinc）。\n\n在任何情况下，编译代码中的 `wide` 操作码后面都跟着\
  \ `wide` 修改的指令的操作码。在这两种格式中，两个无符号字节 `indexbyte1` 和 `indexbyte2` 都跟在被修改的操作码之后，并组合成指向当前帧中局部变量的\
  \ 16 位无符号索引（§2.6)），索引值为 `(indexbyte1 << 8) | indexbyte2`。计算出的索引必须是当前帧局部变量数组的索引。当\
  \ `wide` 指令修改 `lload`、`dload`、`lstore` 或 `dstore` 指令时，计算索引之后的索引 `(index + 1)` 也必须是局部变量数组的索引。在第二形式中，两个立即无符号字节\
  \ `constbyte1` 和 `constbyte2` 在代码流中跟在 `indexbyte1` 和 `indexbyte2` 之后。这些字节也组合成一个有符号\
  \ 16 位常量，该常量为 `(constbyte1 << 8) | constbyte2`。\n\n扩展后的字节码像往一样运行，只是使用了更宽的索引，在第二形式的情况下使用了更大的增量范围。\n\
  \n### 注意事项\n\n尽管我们说 `wide` “修改另一个指令的行为”，但 `wide` 指令实际上将构成被修改指令的字节视为操作数，在此过程中使嵌入的指令失去了原有的指令特性。在被修改的\
  \ `iinc` 指令的情况下，`iinc` 的逻辑操作数之一甚至不在操作码的正常偏移处。嵌入的指令绝不能直接执行；其操作码绝不能作为任何控制转移指令的目标。\n\
