  \ 处的局部变量的 `value` 被推入操作数栈中。\n\n### 注意事项\n每个 `iload_<n>` 指令都与 `index` 为 `<n>` 的 `iload`\
  \ ，除了操作数 `<n>` 是隐式的。\n\n### imul\n\n#### 操作\n相乘 `int`\n\n#### 格式\n![Image](img/464fig01.jpg)\n\
  \n#### 形式\n`imul` = 104 (0x68)\n\n### 操作数\n..., `value1`, `value2` →\n\n### 栈\n\
  ..., `result`\n\n### 说明\n`value1` 和 `value2` 必须都是 `int` 类型。这两个值从操作数栈中弹出。`int` 类型\
  \ `result` 是 `value1` * `value2`。`result` 被推入操作数栈中。\n\n结果是足够宽的补码格式中真实数学结果的低 32 位，表示为类型为\
  \ `int`的值。如果发生溢出，则结果的符号可能与两个值的数学乘法结果符号不同。\n\n尽管可能会发生溢出，执行 `imul` 指令永远不会抛出运行时异常。\n\
  \n### ineg\n\n#### 操作\n取反 `int`\n\n#### 格式\n![Image](img/465fig01.jpg)\n\n#### 形式\n\
  `ineg` = 116 (0x74)\n\n### 操作数\n..., `value` →\n\n### 栈\n..., `result`\n\n### 说明\n\
  `value` 必须是 `int` 类型。它从操作数栈中弹出。`int` 类型 `result` 是 `value` 的算术取反，`-value`。`result`\
  \ 被推入操作数栈中。\n\n对于 `int` 值，取反等同于减零。由于 Java 虚拟机使用补码表示整数，且补码值的范围是非对称的，因此最大负 `int` 的取反结果仍然是该最大负数。尽管发生了溢出，但不会抛出异常。\n\
  \n对于所有 `int` 值 `x`，`-x` 等于 `(~x)+1`。\n\n### instanceof\n\n#### 操作\n确定对象是否为给定类型\n\
  \n#### 格式\n![Image](img/466fig01.jpg)\n\n#### 形式\n`instanceof` = 193 (0xc1)\n\n\
  ### 操作数\n..., `objectref` →\n\n### 栈\n..., `result`\n\n### 说明\n从操作数栈中弹出 `objectref`，它必须是\
  \ `reference` 类型。使用无符号 `indexbyte1` 和 `indexbyte2` 构造指向当前类运行时常量池的索引（2.6），其中索引的值为\
  \ (`indexbyte1` `<<` 8) | `indexbyte2`。该索引处的运行时常量池项必须是指向类、数组或接口类型的符号引用。\n\n如果 `objectref`\
  \ 为 `null`，`instanceof` 指令会将 `int` 类型 `result` 0 作为 `int` 推入操作数栈。\n\n否则，指定的命名的类、数组或接口类型将进行解析（5.4.3.1）。如果\
  \ `objectref` 是解析后的类或数组的实例，或者实现了解析后的接口，`instanceof` 指令会将 `int` 类型 `result` 1 作为\
  \ `int` 推入操作数栈；否则，它推入 `int` 类型 `result` 0。\n\n使用以下规则来确定非 `null` 的 `objectref` 是否为解析后类型的实例：如果\
  \ S 是 `objectref` 所引的对象的类，而 T 是解析后的类、数组或接口类型，`instanceof` 按照如下方式确定 `objectref` 是否为\
  \ T 的实例：\n\n- 如果 S 是普通（非数组）类，那么：\n    - 如果 T 是一个类，则 S 必须是 T 的子类；\n    - 如果 T 是接口，则\
  \ S 必须实现 T。\n- 如果 S 是接口类型，那么：\n    - 如果 T 是类，则 T 必须是 `Object`。\n    - 如果 T 是接口，则\
  \ T 必须与 S 相同。\n    - 如果 S 是数组类型，那么：\n        - 如果 T 是类，则 T 必须是 `Object`。\n     \
  \   - 如果 T 是接口，则 T 必须与 S 相同。\n        - 如果 T 是数组类型，则 T 必须与 S 相同。\n\n#### \n在解析类、数组或接口类型时，可能会抛出\
  \ 5.4 中记录的任何异常。\n\n### 注意事项\n`instanceof` 指令与 `checkcast` 指令（*checkcast*）非常相似，不同在于对\
  \ `null` 的处理、失败时的行为以及对操作数栈的影响。\n\n### invokedynamic\n\n#### 操作\n动态方法\n\n#### 格式\n\
  ![Image](img/468fig01.jpg)\n\n#### 形式\n`invokedynamic` = 186 (0xba)\n\n### 操作数\n\
  ..., `arg1`, `arg2` →\n\n### 栈\n...\n\n### 说明\n每个 `invokedynamic` 指令出现称为称为动态站点。首先，使用无符号\
  \ `indexbyte1` 和 `indexbyte2` 构造指向当前类运行时常量池的索引（2.6），其中索引的值为 (`indexbyte1` `<<` 8)\
  \ | `indexbyte2`。该索引处的常量池项必须是指向调用站点规范的符号引用。第三和第四操作字节的值必须始终为零。\n\n调用站点规范将进行解析（5.4.3），*对于特定的动态站点*以获取\
  \ `java.lang.invoke.MethodHandle` 实例的引用作为引导方法、`java.lang.invoke.MethodType` 实例的引用以及静态参数的引用。\n\
  \n接下来，作为调用站点规范继续解析的一部分，引导方法的调用方式就像通过执行 `invokevirtual` 指令（*invokevirtual*），该指令包含一个指向运行时常量池索引的符号引用\
  \ R，其中：\n\n- R 是方法所在类的符号引用（（5.1））\n- 对于方法名，R 指定为 `java.lang.invoke.MethodHandle`；\n\
  - 对于方法的描述符，R 指定返回类型为 `java.lang.invoke.CallSite` 以及源自操作数栈项的参数类型。\n\n前三个参数类型是 `java.lang.invoke.MethodHandles.Lookup`、`String`\
  \ 和 `java.lang.invoke.MethodType`，顺序如下。如果调用站点规范有静态参数，则每个参数的参数类型将按照参数推入操作数栈的顺序附加到方法描述符的参数之后。这些参数类型可以是\
  \ `Class`、`java.lang.invoke.MethodHandle`、`java.lang.invoke.MethodType`、`String`、`int`、`long`、`float`\
  \ 或 `double`。\n\n并且仿佛按顺序推入操作数栈：\n\n\n\n\n\n-   指向引导方法（bootstrap method）的 `java.lang.invoke.MethodHandle`\
  \ 对象的 `reference`（引用）；\n-   指向发生此动态调用点的类的的 `java.lang.invoke.MethodHandles.Lookup`\
  \ 对象的 `reference`；\n-   指向调用点指定符中方法名的 `String` 的 `reference`；\n-   为调用点指定符中的方法描述符获取的\
  \ `java.lang.invoke.MethodType` 对象的 `reference`；\n-   调用点指定符中标识为静态参数的类、方法类型、方法句柄和字符串字面量的\
  \ `references`，以及在调用点指定符中标识为静态参数的数值值（§2.3.1, §2.3.2)），均按照它们在调用点指定符中出现的顺序排列。（即，原始值不会发生装箱。）\n\
  \n符号引用 `R` 描述了一个具有签名多态的方法（§2.9）。由于对被调用的 `invoke` 签名多态方法执行了 `invokevirtual` 操作，接收端方法句柄（代表引导方法）的类型描述符在语义上不需要与\
  \ `R` 指定的方法描述符相等。例如，`R` 指定的第一个参数类型可以是 `Object` 而不是 `java.lang.invoke.MethodHandles.Lookup`，且\
  \ `R` 指定的返回类型可以是 `Object` 而不是 `java.lang.invoke.CallSite`。只要引导方法可以被 `invoke` 方法调用而不会抛出\
  \ `java.lang.invoke.WrongMethodTypeException`，那么代表引导方法的方法句柄的类型描述符就是任意的。\n\n如果引导方法是一个变长参数个数的方法（variable\
  \ arity method），则上述操作数栈上的部分或所有参数可能被收集到一个尾部数组参数中。\n\n引导方法的调用发生在尝试解析指向此动态调用点指定符 `of\
  \ this dynamic call site` 的符号引用的线程中。如果存在多个这样的线程，引导方法可能会在多个线程中并发地调用。因此，访问全局应用程序数据的引导方法必须采取防止竞态条件的通常预防措施。\n\
  \n引导方法返回的结果必须是一个指向类为 `java.lang.invoke.CallSite` 或其 `java.lang.invoke.CallSite`\
  \ 子类的对象的 `reference`。该对象被称为 `call site object`（调用点对象）。该 `reference` 从操作数栈中弹出，就像执行\
  \ `invokevirtual` 指令一样。\n\n如果多个线程同时为同一个动态调用点执行引导方法，Java 虚拟机必须选择一个返回的调用点对象并将其可见地安装到所有线程。允许为该动态调用点执行的其他引导方法完成，但其结果将被忽略，线程将使用所选的调用点对象继续执行动态调用点。\n\
  \n调用点对象具有一个类型描述符（`java.lang.invoke.MethodType` 的实例），它在语义上必须与为调用点指定符中的方法描述符获取的 `java.lang.invoke.MethodType`\
  \ 对象相等。\n\n调用点指定符解析成功的结果是一个永久绑定到动态调用点的调用点对象。\n\n由绑定的调用点对象的目标所代表的方法句柄被调用。该调用的发生如同执行了一个\
  \ `invokevirtual` 指令（§*invokevirtual），该指令指示一个指向方法符号引用的运行时常量池索引（§5.1），并具有以下属性：\n\n\
  -   方法名为 `invokeExact`；\n-   方法的描述符是调用点指定符中的方法描述符；且\n-   该方法指向其要查找方法的类的符号引用指向了 `java.lang.invoke.MethodHandle`\
  \ 类。\n\n操作数栈将被解释为包含一个指向调用点对象目标的 `reference`，随后是 *nargs* 个参数值，其中这些值的数量、类型和顺序必须与调用点指定符中的方法描述符一致。\n\
  \n## 链接异常（Linking Exceptions）\n\n如果对调用点指定符的符号引用解析抛出异常 `E`，则 `invokedynamic` 指令将抛出一个封装了\
  \ `E` 的 `BootstrapMethodError`。\n\n否则，在继续解析调用点指定符的期间，如果引导方法的调用由于抛出异常 `E` 而异常终止（§2.6.5），则\
  \ `invokedynamic` 指令将抛出一个封装了 `E` 的 `BootstrapMethodError`。（这可能发生在引导方法具有错误的个数、参数类型或返回类型，导致\
  \ `java.lang.invoke.MethodHandle.invoke` 抛出 `java.lang.invoke.WrongMethodTypeException`。）\n\
  \n否则，在继续解析调用点指定符的期间，如果引导方法的调用结果不是指向 `java.lang.invoke.CallSite` 实例的 `reference`，则\
  \ `invokedynamic` 指令将抛出 `BootstrapMethodError`。\n\n否则，在继续解析调用点指定符的期间，如果调用点对象目标的类型描述符在语义上与调用点指定符中的方法描述符不等，则\
  \ `invokedynamic` 指令将抛出 `BootstrapMethodError`。\n\n## 运行时异常（Run-time Exceptions）\n\
  \n如果此特定的动态调用点完成了其调用点指定符的解析，意味着一个非 `null` 的 `java.lang.invoke.CallSite` 已绑定到该动态调用点。因此，代表调用点的操作数项不为\
  \ `null`。同样，这意味着调用点指定符中的方法描述符在语义上等于执行 `invokevirtual` 指令时的方法句柄类型描述符。\n\n### invokeinterface\n\
  \n#### 操作\n调用接口方法\n\n#### 格式\n![Image](img/473fig01.jpg)\n\n#### 形式\n`invokeinterface`\
  \ = 185 (0xb9)\n\n#### 操作数\n..., *objectref*, [*arg1*, [*arg2*]] →\n\n#### 栈\n...\n\
  \n#### 描述\n无符号 *indexbyte1* 和 *indexbyte2* 用于构造当前类的运行时常量池索引（§2.6），其中索引值为 (*indexbyte1\
  \ << 8) | indexbyte2。该索引处的运行时常量池项必须是指向接口方法的符号引用（§5.1），它提供了接口方法的名称和描述符（4.3.3)）以及要查找接口方法的接口符号引用。命名的接口方法将被解析（§5.4.3.4）。\n\
  \n解析出的接口方法不能是实例初始化方法、类初始化或接口初始化方法（§2.9）。\n\n*count* 操作数是一个非零的无符号字节。*objectref* 必须是\
  \ `reference` 类型，并且在操作数栈上后跟 *nargs* 个参数值，其中这些值的数量、类型和顺序必须与解析接口方法的描述符一致。第四个操作字节的值始终为零。\n\
  \n令 C 为 *objectref* 的类。实际要调用的方法通过以下查找程序选择：\n\n**1.** 如果 C 包含一个与解析方法名称和描述符相同的实例方法声明，则该方法为要调用的方法。\n\
  \n\n\n\n\n2. 否则，如果 `C` 有父类，则将开始查找与已解析方法具有相同名称和描述符的实例方法的声明。搜索从 `C` 的直接父类开始，并继续到该类的直接父类，依此类推，直到找到匹配项或不存在进一步的父类。如果找到了匹配项，则该方法为要调用的方法。\n\
  \n3. 否则，如果 `C` 的超接口中恰好有一个极大特定的方法（§5.4.3.3)）匹配已解析方法的名称和描述符且不是 `abstract`（抽象的），则该方法为要调用的方法。\n\
  \n如果该方法是 `synchronized`，则与 `objectref` 关联的监器将被进入或重入，仿佛在当前线程中执行了 `monitorenter` 指令（§monitorenter).\n\
  \n如果该方法不是 `native`，`nargs` 参数值和 `objectref` 将从操作数栈中弹出。在 Java 虚拟机栈上为正在调用的方法创建一个新帧。`objectref`\
  \ 和参数值连续地成为新帧局部变量的值，其中 `objectref` 在局部变量 0 中，`arg1` 在局部变量 1 中（如果 `arg1` 类型为 `long`\
  \ 或 `double`，则在局部变量 1 和 2 中），此类推。任何浮点类型的参数值在存储到局部变量之前都会经过值集转换（§2.8.3). 然后将新帧设为当前帧，并将\
  \ Java 虚拟机的 `pc` 设置为要调用方法的第一条指令的操作码。执行从方法的第一条指令继续。\n\n如果该方法是 `native` 且实现它的平台相关代码尚未绑定（§5.6)）到\
  \ Java 虚拟机，则进行绑定。`nargs` 参数值和 `objectref` 从操作数栈中弹出，并作为参数传递给实现方法的代码。任何浮点类型的参数值在作为参数传递之前都会经过值集转换（§2.8.3).\
  \ 参数以取决于实现的方式进行传递并调用代码。当平台相关代码返回时：\n\n* 如果 `native` 方法是 `synchronized`，则与 `objectref`\
  \ 关联的监器将被更新并可能退出，仿佛在当前线程中执行了 `monitorexit` 指令（§monitorexit).\n* 如果 `native` 方法返回一个值，则平台相关代码的返回值将以一种取决于实现的方式转换为\
  \ `native` 方法的返回类型，并推送到操作数栈上。\n\n### 链接阶段的异常 (Linking Exceptions)\n\n在对接口方法的符号引用进行解析期间，\
  \ 可能会抛出任何与接口方法解析相关的异常（§5.4.3.4).\n\n否则，如果已解析的方法是 `static` 或 `private`，`invokeinterface`\
  \ 指令将抛出 `IncompatibleClassChangeError`。\n\n### 运行时异常 (Run-time Exceptions)\n\n否则，如果\
  \ `objectref` 为 `null`，`invokeinterface` 指令将抛出 `NullPointerException`。\n\n否则，如果\
  \ `objectref` 的类没有实现已解析的接口，`invokeinterface` 将抛出 `IncompatibleClassChangeError`。\n\
  \n否则，如果查找过程的步骤 2 选取了一个非 `public` 方法，`invokeinterface` 将抛出 `IllegalAccessError`。\n\
  \n否则，如果查找过程的步骤 2 选取了一个 `abstract` 方法，`invokeinterface` 将抛出 `AbstractMethodError`。\n\
  \n否则，如果查找过程的步骤 2 选取了一个 `native` 方法且实现方法的代码无法绑定，`invokeinterface` 将抛出 `UnsatisfiedLinkError`。\n\
  \n否则，如果查找过程的步骤 3 确定 `C` 的超接口中存在多个匹配已解析方法的名称和描述符且不是 `abstract` 的极大特定方法，`invokeinterface`\
  \ 将抛出 `IncompatibleClassChangeError`。\n\n否则，如果查找过程的步骤 3 确定 `C` 的超接口中不存在任何匹配已解析方法的名称和描述符且不是\
  \ `abstract` 的极大特定方法，`invokeinterface` 将抛出 `AbstractMethodError`。\n\n### 注意事项 (Notes)\n\
  \n`invokeinterface` 指令的操作数 `count` 记录了参数值数量的测量，其中类型为 `long` 或 `double` 的参数值对 `count`\
  \ 值贡献两个单位，而任何其他类型的参数贡献一个单位。此信息也可以从所选方法的描述符中得出。这种冗余是历史遗留。\n\n第四个操作字节的存在是为了为 Oracle\
  \ 的某些 Java 虚拟机实现中使用的额外操作数留出空间，这些实现在运行时通过特殊的伪指令替换 `invokeinterface` 指令。为了向后兼容，必须保留它。\n\
  \n`nargs` 参数值和 `objectref` 与前 `nargs`+1 个局部变量并非一一一对应。`long` 和 `double` 类型的参数值必须存储在两个连续的局部变量中，因此可能需要比\
  \ `nargs` 更多的局部变量来将 `nargs` 参数值传递给调用的方法。\n\n选择逻辑允许选取超接口中的非 `abstract` 方法。只有在类层次结构中没有匹配方法时，才会考虑接口。如果超接口中存在两个非\
  \ `abstract` 方法且互不比对方更具体，则发生错误；不会尝试消除歧义（例如，其中一个是引用的方法，另一个可能无关）。另一方面，如果存在许多 `abstract`\
  \ 方法但只有一个非 `abstract` 方法，则选取该非 `abstract` 方法（除非 `abstract` 方法更具体）。\n\n### invokespecial\n\
  \n#### 操作\n\n调用实例方法；针对父类、私有和实例初始化方法的特殊处理\n\n#### 格式\n\n![Image](img/477fig01.jpg)\n\
  \n#### 形式\n\n`invokespecial` = 183 (07)\n\n#### 操作数\n\n`..., objectref, [arg1, [arg2\
  \ ...]] -> ->\n\n#### 栈\n\n`...`\n\n#### 描述\n\n无符号 `indexbyte1` 和 `indexbyte2` 用于构造当前类常量池的索引（§2.6)），索引值为\
  \ (`indexbyte1` << 8) | `indexbyte2`。该索引常量池项必须是方法或接口方法的符号引用（§5.1)），它提供了方法的名称和描述符（§4.3.3)）以及要查找方法的类或接口的符号引用。命名方法将被解析（§5.4.3.3,\
  \ 5.4.3.4).\n\n如果已解析的方法是 `protected`，且它是当前类父类的成员，并且该方法与当前类不在同一个运行时包（§5.3)），则 `objectref`\
  \ 的类必须是当前类或当前类的子类。\n\n如果满足以下所有条件，则令 `C` 为当前类的直接父类：\n\n• 解析的方法不是实例初始化方法（§2.9).\n\
  • 如果符号引用命名了一个类（而不是接口），则该类是当前类的父类。\n• `class` 文件设置了 `ACC_SUPER` 标记（§4.1).\n\n否则，令\
  \ `C` 为符号引用命名的类或接口。\n\n实际调用的方法通过以下查找过程进行选取：\n\n\n\n\n\n1. 如果 `C` 包含一个与解析出的方法名称和描述符均相同的实例方法声明，则该方法为被调用的方法。\n\
  \n2. 否则，如果 `C` 是一个类且具有父类，则开始查找与解析出的方法名称和描述符均相同的实例方法声明，查找从 `C` 的直接父类开始，并继续到该类的直接父类，依此类推，直到找到匹配项或不存在更高级的父类。如果找到了匹配项，则该方法为被调用的方法。\n\
  \n3. 否则，如果 `C` 是一个接口且类 `Object` 包含一个与解析出的方法名称和描述符均相同的 `public` 实例方法声明，则该方法为被调用的方法。\n\
  \n4. 否则，如果 `C` 的超接口中恰好有一个极大特定的方法（§5.4.3.3）与解析出的方法的名称和描述符匹配且不是 `abstract`（抽象的），则该方法为被调用的方法。\n\
  \n`objectref` 必须是 `reference` 类型，并且操作数栈上后续必须有 `nargs` 个参数值，这些值的数量、类型和顺序必须与所选实例方法的描述符一致。\n\
  \n如果该方法是 `synchronized`（同步的），则与 `objectref` 关联的监控器将被进入或重入，仿佛由当前线程执行了 `monitorenter`\
  \ 指令（§*monitorenter）。\n\n如果该方法不是 `native`（本地的），`nargs` 参数值和 `objectref` 从操作数栈中弹出。Java\
  \ 虚拟机栈上为被调用的方法创建一个新帧。`objectref` 和参数值连续地成为新帧局部变量的值，其中 `objectref` 位于局部变量 0，`arg1`\
  \ 位于局部变量 1（或者，如果 `arg1` 的类型为 `long` 或 `double`，则位于局部变量 1 和 2），依此类推。任何浮点类型的参数值在存储到局部变量之前，都将经过值位集转换（§2.8.3）。然后将新帧设为当前帧，并将\
  \ Java 虚拟机 `pc` 设置为被调用方法的第一条指令的操作码。执行从方法的第一个指令继续。\n\n如果该方法是 `native` 的且实现它的依赖平台代码尚未绑定（§5.6）到\
  \ Java 虚拟机，则执行该绑定。`nargs` 参数值和 `objectref` 从操作数栈中弹出，并作为参数传递给实现方法的代码。任何浮点类型的参数值在作为参数传递之前，都将经过值位集转换（§2.8.3）。参数以依赖实现的方式传递并调用代码。当依赖平台代码返回时，将发生以下情况：\n\
  \n- 如果 `native` 方法是 `synchronized` 的，则与 `objectref` 关联的监控器将被更新并可能退出，仿佛由当前线程执行了 `monitorexit`\
  \ 指令（§*monitorexit）。\n\n- 如果 `native` 方法返回一个值，则平台代码的返回值将以依赖实现的方式转换为 `native` 方法的返回类型，并推入操作数栈。\n\
  \n### 链接异常 (Linking Exceptions)\n\n在解析方法的符号引用期间，可能会抛任何与方法解析相关的异常（§5.4.3.3）。\n\n\
  否则，如果解析出的方法是实例初始化方法，且声明它的类不是指令所符号引用的类，则抛出 `NoSuchMethodError`。\n\n否则，如果解析出的方法是类（`static`）方法，`invokespecial`\
  \ 指令将抛出 `IncompatibleClassChangeError`。\n\n### 运行时异常 (Run-time Exceptions)\n\n否则，如果\
  \ `objectref` 为 `null`，`invokespecial` 指令将抛出 `NullPointerException`。\n\n否则，如果解析出的方法是当前类父类的在不同运行时包定义的\
  \ `protected` 方法，且 `objectref` 的类不是当前类或当前类的子类，则 `invokespecial` 抛出 `IllegalAccessError`。\n\
  \n否则，如果查找过程的第 2 步选择了一个 `abstract` 方法，`invokespecial` 抛出 `AbstractMethodError`。\n\
  \n否则，如果查找过程的第 2 步选择了一个 `native` 方法且实现方法的代码无法绑定，`invokespecial` 抛出 `UnsatisfiedLinkError`。\n\
  \n否则，如果查找过程的第 4 步确定在 `C` 的超接口中存在多个与解析出的方法的名称和描述符匹配且不是 `abstract` 的极大特定方法，`invokespecial`\
  \ 抛出 `IncompatibleClassChangeError`。\n\n否则，如果查找过程的第 4 步确定在 `C` 的超接口中不存在任何与解析出的方法的名称和描述符匹配且不是\
  \ `abstract` 的极大特定方法，`invokespecial` 抛出 `AbstractMethodError`。\n\n### 注意事项 (Notes)\n\
  \n`invokespecial` 指令与 `invokevirtual` 指令（§*invokevirtual*））的区别在于，*invokevirtual*\
  \ 根据对象的类型调用方法。`invokespecial` 指令用于调用实例初始化方法（§2.9））、`private` 方法以及父类的方法。\n\n`invokespecial`\
  \ 指令在 JDK 1.0 之前名为 `invokenvirtual`。\n\n`nargs` 参数值和 `objectref` 与前 *nargs*+1 个局部变量一一对应。`long`\
  \ 和 `double` 类型的参数值必须存储两个局部变量，因此可能需要比 *nargs* 更多的局部变量来向被调用方法传递参数值。\n\n`invokespecial`\
  \ 指令处理 `private` 方法、通过直接超接口引用的非抽象接口方法、以及通过父类引用的非抽象接口方法的调用。在这些情况下，选择规则与 `invokeinterface`\
  \ 基本相同（只是从不同的类开始）。\n\n#### invokatic\n\n**操作**\n\n调用类（`static`）方法\n\n**格式**\n\n\
  ![Image](img/481fig01.jpg)\n\n**形式**\n\n*invokestatic* = 184 (0xb8)\n\n**操作数**\n\
  \n..., [*arg1*, [*arg2 ...]] →\n\n**栈**\n\n...\n\n**描述**\n\n无符号 *indexbyte1* 和 *indexbyte2*\
  \ 用于构造当前类运行时常量池的索引（§2.6），其中索引值为 (*indexbyte1 `<<` 8) | *indexbyte2*。该索引处的运行时常量池项必须是指向方法或接口方法的符号引用（§5.1），它给方法的名称和描述符（§4.3.3](#ch04.html_ch04lev2sec5))）以及查找方法的类或接口的符号引用。命名的方法被解析（§5.4.3.3）。\n\
  \n解析出的方法不能是实例初始化方法，且必须是 `static` 的，因此不能是抽象的。\n\n成功解析方法后，如果声明该方法的类或接口尚未初始化，则对其进行初始化（§5.5）。\n\
  \n操作数栈必须包含 *nargs* 个参数值，这些值的数量、类型和顺序必须与解析出的方法的描述符一致。\n\n\n\n\n\n如果该方法是 `synchronized`，则与解析出的\
  \ `Class` 对象相关的监器将被进入或重新进入，就像当前线程中执行了 `monitorenter` 指令一样 (§*monitorenter*)。\n\n\
  如果该方法不是 `native`，则 `nargs` 参数值从操作数栈中弹出。在 Java 虚拟机栈上为被调用的方法创建一个新帧。`nargs` 参数值连续地成为新帧局部变量的值，其中\
  \ `arg1` 位于局部变量 0（或者，如果 `arg1` 的类型为 `long` 或 `double`，则位于局部变量 0 和 1 中），依此类推。任何浮点类型的参数值在存储到局部变量之前，都会经过值\
  \ set 转换 (§2.8.3)）。然后将新帧设为当前帧，并将 Java 虚拟机的 `pc` 设置为被调用方法的第一条指令的操作码。执行从该方法的第一条指令继续。\n\
  \n如果该方法是 `native` 且实现它的平台相关代码尚未绑定到 Java 虚拟机中 (§5.6)，则进行绑定。`nargs` 参数值从操作数栈中弹出，并作为参数传递给实现方法的代码。任何浮点类型的参数值在作为参数传递之前，都会经过值\
  \ set 转换 (§2.8.3)。参数被传递并以取决于实现的方式调用代码。当平台相关代码返回时，将发生以下情况：\n\n- 如果 `native` 方法是 `synchronized`，则与解析出的\
  \ `Class` 对象相关的监器将被更新并可能退出，就像当前线程中执行了 `monitorexit` 指令一样 (§*monitorexit*)。\n- 如果\
  \ `native` 方法返回一个值，则平台相关代码的返回值以取决于实现的方式转换为 `native` 方法的返回类型，并推入操作数栈。\n\n### 异常\n\
  \n在解析指向方法的符号引用期间，可能会抛出任何与方法解析相关的异常 (§5.4.3.3)。\n\n否则，如果解析的方法是实例方法，则 `invokestatic`\
  \ 指令抛出 `IncompatibleClassChangeError`。\n\n### 运行时异常\n\n否则，如果执行此 `invokestatic` 指令导致引用的类或接口的初始化，`invokestatic`\
  \ 可能会抛出 `Error`，详见 §5.5。\n\n否则，如果解析的方法是 `native` 且实现方法的代码无法绑定，`invokestatic` 抛出\
  \ `UnsatisfiedLinkError`。\n\n### 注意事项\n\n`nargs` 参数值与前 `nargs` 个局部变量并非一一对应。`long`\
  \ 和 `double` 参数值必须存储在两个连续的局部变量中，因此可能需要比 `nargs` 更多的局部变量来将 `nargs` 参数值传递给被调用方法。\n\
  \n### invokevirtual\n\n#### 操作\n调用实例方法；基于类进行分发\n\n#### 格式\n![Image](img/484fig01.jpg)\n\
  \n#### 形式\n`invokevirtual` = 182 (0xb6)\n\n#### 操作数\n`..., objectref, [arg1, [arg2\
  \ ...]] ->`\n\n#### 栈\n`...`\n\n#### 描述\n无符号 `indexbyte1` 和 `indexbyte2` 用于构建指向当前类运行时常量池的索引\
  \ (§2.6)，其中索引的值为 (`indexbyte1` `<<` 8) `|` indexbyte2。该索引处的运行时常量池项必须是指向一个方法的符号引用\
  \ (§5.1)，它提供了该方法的名称和描述符 (§4.3.3) 以及在要查找该方法的类的符号引用。该命名方法被解析 (§5.4.3.3)。\n\n解析的方法不能是实例初始化方法，或类或接口的初始化方法\
  \ (§2.9)。\n\n如果解析的方法是 `protected` 且它是当前类父类的成员，且该方法未在与当前类相同的运行时包 (§5.3) 中声明，则 `objectref`\
  \ 的类必须是当前类或当前类的子类。\n\n*如果解析的方法不是签名多 (§2.9)，则 `invokevirtual` 指令按如下方式进行。*\n\n令 `C`\
  \ 为 `objectref` 的类。实际要调用的方法通过以下查找程序选择：\n\n1. 如果 `C` 包含实例方法 `m` 的声明且该方法覆盖了解析方法 (§5.4.5](#ch05.html_ch05lev2sec1))则\
  \ `m` 为被调用的方法。\n2. 否则，如果 `C` 有父类，则对覆盖解析的方法进行搜索，从 `C` 的直接父类开始，一直到其直接父类，直到找到覆盖方法或没有更多父类。如果找到了覆盖方法，它就是被调用的方法。\n\
  3. 否则，如果 `C` 的超接口中存在一个最特有的方法 (§5.4.3.3](#ch05.html_ch05lev3sec3)) 匹配解析方法的名称和描述符且不是\
  \ `abstract`，则它就是被调用的方法。\n\n`objectref` 在操作数栈上必须跟随 `nargs` 参数值，其中值的数量、类型必须与所选方法的描述符一致。\n\
  \n如果该方法是 `synchronized`，则与解析出的 `Class` 对象相关的监器将被进入或重新进入，就像当前线程中执行了 `monitorenter`\
  \ 指令一样。\n\n如果该方法不是 `native`，则 `nargs` 参数值和 `objectref` 从操作数栈中弹出。在 Java 虚拟机栈上为被调用的方法创建一个新帧。`objectref`\
  \ 和参数值连续地成为新帧局部变量的值，其中 `objectref` 位于局部变量 0，`arg1` 位于局部变量 1（或者，如果 `arg1` 的类型为 `long`\
  \ 或 `double`，则位于局部变量 1 和 2），依此类推。任何浮点类型的参数值在存储到局部变量之前，都会经过值 set 转换。然后将新帧设为当前帧，并将\
  \ Java 虚拟机的 `pc` 设置为被调用方法的第一条指令的操作码。执行从该方法的第一条指令继续。\n\n如果该方法是 `native` 且实现方法的代码尚未绑定到\
  \ Java 虚拟机中，则进行绑定。`nargs` 参数值和 `objectref` 从操作数栈中弹出，并作为参数传递给实现方法的代码。任何浮点类型的参数值在作为参数传递之前，都会经过值\
  \ set 转换。参数被传递并以取决于实现的方式调用代码。\n\n\n\n\n\n首先，获取一个 `java.lang.invoke.MethodType` 实例的\
  \ `reference`，这类似于解析一个方法类型的符号引用（§5.4.3.5），该方法的参数类型和返回类型与 `invokevirtual` 指令所引用的方法的描述符相同。\n\
  \n- 如果命名方法为 `invokeExact`，则 `java.lang.invoke.MethodType` 实例在语义上必须等于接收方法句柄 `objectref`\
  \ 的类型描述符。`待调用的方法句柄`为 `objectref`。\n\n- 如果命名方法为 `invoke`，且 `java.lang.invoke.MethodType`\
  \ 实例在语义上等于接收方法句柄 `objectref` 的类型描述符，则 `待调用的方法句柄`为 `objectref`。\n\n- 如果命名方法为 `invoke`，且\
  \ `java.lang.invoke.MethodType` 实例在语义上不等于接收方法句柄 `objectref` 的类型描述符，则 Java 虚拟机尝试调整接收方法句柄的类型描述符，类似于调用\
  \ `java.lang.invoke.MethodHandle.asType` 以获取一个完全可调方法句柄 `m`。`待调用的方法句柄`为 `m`。\n\n\
  `objectref` 之后在操作数栈上跟着 `nargs` 个参数值，这些值的数量、类型和顺序必须与待调用方法句柄的类型描述符一致。（该类型描述符将对应于待调用方法句柄类型相应的方法描述符，如\
  \ §5.4.3.5 所示。）\n\n然后，如果待调用方法句柄具有字节码行为，Java 虚拟机将调用该方法句柄，类似于执行与该方法句柄类型相关的字节码行为。如果类型为\
  \ 5 (`REF_invokeVirtual`)、6 (`REF_invokeStatic`)、7 (`REF_invokeSpecial`)、8 (`REF_newInvokeSpecial`)\
  \ 或 9 (`REF_invokeInterface`)，则将创建一个帧并在*执行字节码行为的过程中*将其设置为当前帧；当由字节码行为调用的方法完成（正常或异常）时，其`调用者的帧`被视为包含此\
  \ `invokevirtual` 指令方法的帧。\n\n字节码行为本身执行的帧是不可见的。\n\n否则，如果待调用方法句柄没有字节码行为，Java 虚拟机将以依赖于实现的方式调用它。\n\
  \n### 链接异常 (Linking Exceptions)\n\n在解析方法的符号引用期间，可能会抛出任何与方法解析相关的异常（§5.4.3.3）。\n\n\
  否则，如果解析的方法是类（`static`）方法，`invokevirtual` 指令将抛出 `IncompatibleClassChangeError`。\n\
  \n否则，如果解析的方法是签名多态（signature polymorphic），则在解析由方法符号引用描述符派出的方法类型期间，可能会抛出任何与方法类型解析相关的异常（§5.4.3.5）。\n\
  \n### 运行时异常 (Run-time Exceptions)\n\n否则，如果 `objectref` 为 `null`，`invokevirtual`\
  \ 指令将抛出 `NullPointerException`。\n\n否则，如果解析的方法是当前类父类的 `protected` 方法，且声明在不同的运行时包中，并且\
  \ `objectref` 的类不是当前类或其子类，则 `invokevirtual` 抛出 `IllegalAccessError`。\n\n否则，如果解析的方法不是签名多态的：\n\
  \n- 如果查找程序的第 2 步选择了一个 `abstract` 方法，`invokevirtual` 抛出 `AbstractMethodError`。\n\n\
  - 否则，如果查找程序的第 2 步选择了一个 `native` 方法且实现方法的代码无法绑定，`invokevirtual` 抛出 `UnsatisfiedLinkError`。\n\
  \n- 否则，如果查找程序的第 3 步确定 C 的超接口中存在多个匹配解析方法名称和描述符且非 `abstract` 的最大特定方法（maximally-specific\
  \ methods），`invokevirtual` 抛出 `IncompatibleClassChangeError`。\n\n- 否则，如果查找程序的第 3\
  \ 步确定 C 的超接口中不存在匹配解析方法名称和描述符且非 `abstract` 的最大特定方法，`invokevirtual` 抛出 `AbstractMethodError`。\n\
  \n否则，如果解析的方法是签名多态的，则：\n\n- 如果方法名称为 `invokeExact`，且获取的 `java.lang.invoke.MethodType`\
  \ 实例在语义上不等于接收方法句柄的类型描述符，`invokevirtual` 指令抛出 `java.lang.invoke.WrongMethodTypeException`。\n\
  \n- 如果方法名称为 `invoke`，且获取的 `java.lang.invoke.MethodType` 实例不是接收方法句柄上调用的 `java.lang.invoke.MethodHandle.asType`\
  \ 方法的有效参数，`invokevirtual` 指令抛出 `java.lang.invoke.WrongMethodTypeException`。\n\n\
  ### 注意 (Notes)\n\n`nargs` 参数值和 `objectref` 与前 `nargs`+1 个局部变量并非一一对应。`long` 和 `double`\
  \ 参数值必须存储在两个连续的局部变量中，因此可能需要比 `nargs` 更多的局部变量来将 `nargs` 个参数传递给调用方法。\n\n`invokevirtual`\
  \ 指令可能解析到一个接口方法。在这种情况下，类层次结构中可能重写方法，但一个非 `abstract` 接口方法匹配解析方法的描述符。选择逻辑与 `invokeinterface`\
  \ 相同。\n\n### ior\n\n**操作**\n逻辑或 `int`\n\n**格式**\n![Image](img/489fig01.jpg)\n\n\
  **形式**\n`ior` = 128 (0x80)\n\n**操作数**\n..., `value1`, `value2` →\n\n**栈**\n...,\
  \ `result`\n\n**描述**\n`value1` 和 `value2` 必须是 `int` 类型。它们从操作数栈中弹出。`int` `result`\
  \ 通过对 `value1` 和 `value2` 进行按位包含或计算。`result` 被推入操作数栈。\n\n### irem\n\n**操作**\n取模\
  \ `int`\n\n**格式**\n![Image](img/490fig01.jpg)\n\n**形式**\n`irem` = 112 (0x70)\n\n\
  **操作数**\n..., `value1`, `value2` →\n\n**栈**\n..., `result`\n\n**描述**\n`value1` 和\
  \ `value2` 必须是 `int` 类型。它们从操作数栈中弹出。`int` `result` 为 `value1` - (`value1` / `value2`)\
  \ * `value2`。`result` 被推入操作数栈。\n\n*irem* 指令的结果使得 `(a/b)*b + (a%b)` 等于 `a`。该等式即使在被数为该类型最大幅的负\
  \ `int` 且除数为 -1 的特殊情况下成立（余数为 0）。根据此规则可以推导出，取模操作的结果只有在被数为负时为负，只有在被数为正时才为正。此外，结果的模始终小于除数的模。\n\
  \n**运行时异常**\n如果 `int` 取模运算符的操作值为 0，`irem` 抛出 `ArithmeticException`。\n\n### ireturn\n\
  \n**操作**\n从方法返回 `int`\n\n**格式**\n![Image](img/491fig01.jpg)\n\n**形式**\n`ireturn`\
  \ = 172 (0xac)\n\n**操作数**\n..., `value` →\n\n**栈**\n[空]\n\n**描述**\n\n\n\n\n当前方法的返回类型必须是\
  \ `boolean`、`byte`、`short`、`char` 或 `int`。`value` 必须是 `int` 类型。如果当前方法是 `synchronized`\
  \ 方法，则调用方法时进入或重入的监视器将得到更新，并可能像在当前线程中执行 `monitorexit` 指令（§*monitorexit*）一样退出。如果没有抛出异常，`value`\
  \ 将从当前帧的操作数栈中弹出（§2.6）并推入调用者帧的操作数栈中。当前方法操作数栈上的任何其他值被丢弃。\n\n解释器随后将控制权返回给方法的调用者，恢复调用者的栈帧。\n\
  \n## 运行时异常\n\n如果 Java 虚拟机实现没有强制 §2.11.10 中描述的结构化锁规则，那么如果当前方法是 `synchronized` 方法且当前线程不是调用方法时进入或重入的监视器的所有者，则\
  \ `ireturn` 将抛出 `IllegalMonitorStateException`。这种情况可能会发生，例如一个 `synchronized` 方法包含一个\
  \ `monitorexit` 指令，但在该方法同步的对象上没有 `monitorenter` 指令。\n\n否则，如果 Java 虚拟机实现强制执行 §2.11.10\
  \ 中描述的结构化锁规则，并且在调用当前方法期间违反了这些规则之一，则 `ireturn` 将抛出 `IllegalMonitorStateException`。\n\
  \n### ishl\n\n### 操作\n左移 `int`\n\n### 格式\n![Image](img/492fig01.jpg)\n\n### 形式\n\
  `ishl` = 120 (0x78)\n\n### 操作数\n..., `value1`, `value2` →\n\n### 栈\n..., `result`\n\
  \n### 描述\n`value1` 和 `value2` 必须是 `int` 类型。这两个值从操作数栈中弹出。通过将 `value1` 左移 `s` 个位置计算出一个\
  \ `int` 类型的 `result`，其中 `s` 是 `value2` 的低 5 位的值。`result` 被推入操作数栈。\n\n### 注意事项\n\
  这等同于（即使发生溢出）乘以 2 的 `s` 次方。实际使用的位移距离始终在 0 到 31 之间（包含边界），仿佛 `value2` 对与掩码值 0x1f 进行了位逻辑与运算。\n\
  \n### ishr\n\n### 操作\n算术右移 `int`\n\n### 格式\n![Image](img/493fig01.jpg)\n\n### 形式\n\
  `ishr` = 122 (0x7a)\n\n### 操作数\n..., `value1`, `value2` →\n\n### 栈 \n..., `result`\n\
  \n### 描述\n`value1` 和 `value2` 必须是 `int` 类型。这两个值从操作数栈中弹出。通过将 `value1` 右移 `s` 个位置并进行符号扩展，计算出一个\
  \ `int` 类型的 `result`，其中 `s` 是 `value2` 的低 5 位的值。`result` 被推入操作数栈。\n\n### 注意事项\n\
  结果的值是 `floor(`value1` / 2^(`s`))`，其中 `s` 是 `value2` & 0x1f。对于非负的 `value1`，这等同于将\
  \ `int` 除以 2 的 `s` 次方。实际使用的位移距离始终在 0 到 31 之间（包含边界），仿佛 `value2` 对与掩码值 0x1f 进行了位逻辑与运算。\n\
  \n### istore\n\n### 操作\n将 `int` 存储局部变量\n\n### 格式\n![Image](img/494fig01.jpg)\n\n\
  ### 形式\n`istore` = 54 (0x36)\n\n### 操作数\n..., `value` →\n\n### 栈\n...\n\n### 描述\n\
  `index` 是一个无符号字节，必须是当前帧局部变量数组的索引（§2.6）。操作数栈顶部的 `value` 必须是 `int` 类型。它从操作数栈中弹出，并将\
  \ `index` 处的局部变量值设置为 `value`。\n\n### 注意事项\n`istore` 码可以与 `wide` 指令（§*wide*）结合使用，使用双字节无符号索引访问局部变量。\n\
  \n## istore_<n>\n\n### 操作\n将 `int` 存储局部变量\n\n### 格式\n![Image](img/495fig01.jpg)\n\
  \n### 形式\n`istore_0` = 59 (0x3b)\n`istore_1` = 60 (0x3c)\n`istore_2` = 61 (0x3d)\n\
  `istore_3` = 62 (0x3e)\n\n### 操作数\n..., `value` →\n\n### 栈\n...\n\n### 描述\n`<n*>`\
  \ 是一个无符号字节，必须是当前帧局部变量数组的索引（§2.6）。操作数栈顶部的 `value` 必须是 `int` 类型。它从操作数栈中弹出，并将 `index`\
  \ 处的局部变量值设置为 `value`。\n\n### 注意事项\n每个 `istore_<n>` 与 `istore` 相同，只是 `index` 是隐式的。\n\
  \n### isub\n\n### 操作\n相减 `int`\n\n### 格式\n![Image](img/496fig01.jpg)\n\n### 形式\n\
  `isub` = 100 (0x64)\n\n### 操作数\n..., `value1`, `value2` →\n\n### 栈 \n..., `result`\n\
  \n### 描述\n`value1` 和 `value2` 必须是 `int` 类型。这两个值从操作数栈中弹出。通过 `value1` - `value2` 计算出一个\
  \ `int` 类型的 `result`。`result` 被推入操作数栈。\n\n尽管可能会发生溢出，结果的符号与 `value1` 的。\n\n### iushr\n\
  \n### 操作\n逻辑右移 `int`\n\n### 格式\n![Image](img/497fig01.jpg)\n\n### 形式\n`iushr` =\
  \ 124 (0x7c)\n\n### 操作数\n..., `value1`, `value2` →\n\n### 栈 \n..., `result`\n\n\
  ### 描述\n`value1` 和 `value2` 必须是 `int` 类型。这两个值从操作数栈中弹出。通过将 `value1` 右移 `s` 个位置并进行零扩展，计算出一个\
  \ `int` 类型的 `result`，其中 `s` 是 `value2` 的低 5 位的值。`result` 被推入操作数栈。\n\n### 注意事项\n\
  如果 `value1` 为正且 `s` 是 `value2` & 0x1f，则结果与 `value1` >> `s` 相同；如果 `value1` 为负，则结果等于表达式\
  \ (`value1` >> `s`) + (2 `<<` *s*)。实际使用的位移距离始终在 0 到 31 之间。\n\n### ixor\n\n### 操作\n\
  异或 `int`\n\n### 格式\n![Image](img/498fig01.jpg)\n\n### 形式\n`ixor` = 130 (0x82)\n\n\
  ### 操作数\n..., `value1`, `value2` →\n\n### 栈 \n..., `result`\n\n### 描述\n`value1`\
  \ 和 `value2` 必须是 `int` 类型。这两个值从操作数栈中弹出。通过对 `value1` 和 `value2` 进行位异或运算计算出一个 `int`\
  \ 类型的 `result`。`result` 被推入操作数栈。\n\n## jsr\n\n### 操作\n跳转子程序\n\n### 格式\n![Image](img/499fig01.jpg)\n\
  \n### 形式\n`jsr` = 168 (0xa8)\n\n### 操作数\n... →\n\n### 栈\n..., `address`\n\n### 描述\n\
  紧随此 `jsr` 指令的指令码地址 `address` 作为 `returnAddress` 类型推入操作数栈。无符号 `branchbyte1` 和 `branchbyte2`\
  \ 用于构造一个有符号 16 位偏移量，其中偏移量为 (`branchbyte1` `<<` 8) | `branchbyte2`。执行从 `jsr` 指令地址开始该偏移量开始。目标地址必须是包含此\
  \ `jsr` 指令的方法内部某个指令码的地址。\n\n### 注意事项\n注意 `jsr` 将地址推入操作数栈，而 `ret` (§*ret*) 从局部变量中获取它。这种不对称性是有意设计的。\n\
  \n\n\n\n在 Oracle 对 Java SE 6 之前的 Java 语言编译器实现中，`jsr` 指令在 `finally` 句的实现中配合 `ret`\
  \ 指令使用（§3.13, §4.10.2.5）。\n\n### jsr_w\n\n**操作**\n跳转子程序（宽索引）\n\n**格式**\n![Image](img/500fig01.jpg)\n\
  \n**形式**\n`jsr_w` = 201 (0xc9)\n\n**操作数**\n... →\n\n**栈**\n..., `address`\n\n**描述**\n\
  随此 `jsr_w` 指令之后的指令的操作码的 `address` 被作为 `returnAddress` 类型的值推入操作数栈。无符号的 `branchbyte1`、`branchbyte2`、`branchbyte3`\
  \ 和 `branchbyte4` 用于构造一个有符号的 32 位偏移量，其中偏移量为 (`branchbyte1` `<<` 24) | (`branchbyte2`\
  \ `<<` 16) | (`branchbyte3` `<<` 8) | `branchbyte4`。从此 `jsr_w` 指令的地址按照该偏移量执行。目标地址必须是此\
  \ `jsr_w` 指令所在方法的指令指令地址。\n\n**注意**\n注意 `jsr_w` 将地址推入操作数栈，而 `ret` (§*ret) 从局部变量中取出它。这种不对称性是有故意的。\n\
  \n在 Oracle 对 Java SE 6 之前的 Java 语言编译器实现中，`jsr_w` 指令在 `finally` 句的实现中配合 `ret` 指令使用（§3.13,\
  \ §4.10.2.5）。\n\n尽管 `jsr_w` 指令采用 4 字节的分支偏移，但其他因素将方法的大小限制为 65535 字节 (§4.11)。此限制在\
  \ Java 虚拟未来版本中可能会提高。\n\n### l2d\n\n**操作**\n将 `long` 转换为 `double`\n\n**格式**\n![Image](img/501fig01.jpg)\n\
