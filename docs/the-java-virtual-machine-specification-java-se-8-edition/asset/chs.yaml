  `value1` 和 `value2` 必须是 `double` 类型。这两个值从操作数栈中弹出并经过值集转换 (§2.8.3)，得到 `value1`’ 和\
  \ `value2`’。`double` 类型 `result` 为 `value1`’ / `value2`’。`result` 被推入操作数栈。\n\n`ddiv`\
  \ 指令的结果受 IEEE 算术规则限制：\n\n- 如果 `value1`’ 或 `value2`’ 中有一个为 NaN，结果为 NaN。\n- 如果 `value1`’\
  \ 和 `value2`’ 都不是 NaN，则如果两个值的符号相同，结果符号为正；如果符号不同，结果符号为负。\n- 无无穷除以无穷大得到 NaN。\n- 无极大除以有限值得到有符号的无穷，遵循上述符号产生规则。\n\
  - 有限值除以无穷大得到有符号的零，遵循上述符号产生规则。\n- 零除以零得到 NaN；\n- 零除以有限值得到有符号的无穷，遵循上述符号产生规则。\n（此处省略原文中重复的逻辑行...）\n\
  \n### dload\n\n**操作**\n从局部变量加载 `double`\n\n**格式**\n![Image](img/395fig01.jpg)\n\n\
