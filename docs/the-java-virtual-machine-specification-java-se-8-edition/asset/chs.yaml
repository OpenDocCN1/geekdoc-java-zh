  \n**操作数**\n..., `value1`, `value2` →\n\n**栈**\n..., `result`\n\n**描述**\n`value1`\
  \ 和 `value2` 必须是 `double` 类型。这两个值从操作数栈中弹出并经过值集转换 (§2.8.3)，得到 `value1`’ 和 `value2`’。`double`\
  \ 类型 `result` 为 `value1`’ * `value2`’。`result` 被推入操作数栈。\n\n`dmul` 指令的结果受 IEEE 算术规则限制：\n\
  \n- 如果 `value1`’ 或 `value2`’ 中有一个为 NaN，结果为 NaN。\n- 如果 `value1`’ 和 `value2`’ 都不是\
  \ NaN，则如果两个值的符号相同，结果符号为正；如果符号不同，结果符号为负。\n- 无穷大乘以零得到 NaN。\n- 无穷大乘以有限值得到有符号的无穷，遵循上述符号产生规则。\n\
  （此处省略原文中重复的逻辑行...）\n\n\n\n\n\nJava 虚拟机要求支持 IEEE 754 定义的渐进下溢（gradual underflow）。尽管可能会发生溢出、下溢或精度丢失，执行\
  \ `dmul` 指令永远不会抛运行时异常。\n\n### dneg\n\n### 操作\n取反 `double`\n\n### 格式\n![Image](img/399fig01.jpg)\n\
  \n### 形式\n`dneg` = 119 (0x77)\n\n### 操作数\n..., `value` →\n\n### 栈\n..., `result`\n\
  \n### 描述\n该值必须是 `double` 类型。它从操作数栈中弹出并经过值集转换 (§2.8.3)），得到 `value`’。`double` 类型 `result`\
  \ 是 `value`’ 的算术取反。`result` 被推入操作数栈。\n\n对于 `double` 值，取反并不同于减去零。如果 `x` 是 `+0.0`，则\
  \ `0.0-x` 等于 `+0.0`，但 `-x` 等于 `-0.0`。一元负号仅仅反转 `double` 的符号。\n\n感兴趣的特殊情况：\n* 如果操作数是\
  \ NaN，则结果为 NaN（回 NaN 没有符号）。\n* 如果操作数是无穷大，则结果为相反符号的无穷大。\n* 如果操作数是零，则结果为相反符号的零。\n\n\
  ### drem\n\n### 操作\n`double` 余数\n\n### 格式\n![Image](img/400fig01.jpg)\n\n### 形式\n\
  `drem` = 115 (0x73)\n\n### 操作数\n..., `value1`, `value2` →\n\n### 栈\n..., `result`\n\
  \n### 描述\n`value1` 和 `value2` 必须是 `double` 类型。这两个值从操作数栈中弹出并经过值集转换 (§2.8.3)，得到 `value1`’\
  \ 和 `value2`’。计算 `result` 并作为 `double` 类型推入操作数栈。\n\n`drem` 指令的结果与 IEEE 754 定义的所谓余数操作不同。IEEE\
  \ 754 的“remainder”操作计算的是基于舍入除法的余数，而不是截断除法的余数，因此其行为与通常的整数取模运算符不同。相反，Java 虚拟机定义 `drem`\
  \ 的行为类似于 Java 虚拟机的整数取模指令（`irem` 和 `lrem`）；这可以与 C 库函数 `fmod` 进行比较。\n\n`drem` 指令的结果遵循以下规则：\n\
  * 如果 `value1`’ 或 `value2`’ 中任意一个是 NaN，则结果为 NaN。\n* 如果 `value1`’ 和 `value2`’ 都不是\
  \ NaN，则结果的符号等于被除数的符号。\n* 如果被除数是无穷大或除数为零（或两者都是），则结果为 NaN。\n* 如果被除数有限的且除数为无穷大，则结果等于被除数。\n\
  * 如果被除数为零且除数有限的，则结果等于被除数。\n* 在其余情况中（即两个操作数都不是无穷大、零或 NaN），被除数 `value1`’ 和除数 `value2`’\
  \ 的浮点余数 `result` 由数学关系 `result` = `value1`’ - (`value2`’ * `q`) 定义，其中 `q` 是一个整数，它仅当\
  \ `value1`’ / `value2`’ 为负时为负，仅当 `value1`’ / `value2`’ 为正时为正，且其绝对值在不超过 `value1`’\
  \ 和 `value2`’ 的真实数学商绝对值的情况下尽可能大。\n\n尽管可能会发生除零操作，求值 `drem` 指令永远不会抛运行时异常。也不会发生溢出、下溢或精度丢失。\n\
  \n### 注意事项\nIEEE 754 remainder 操作可以通过库例程 `Math.IEEEremainder` 计算。\n\n### dreturn\n\
  \n### 操作\n从方法返回 `double`\n\n### 格式\n![Image](img/402fig01.jpg)\n\n### 形式\n`dreturn`\
  \ = 175 (0xaf)\n\n### 操作数\n..., `value` →\n\n### 栈\n[空]\n\n### 描述\n当前方法必须具有返回类型\
  \ `double`。`value` 必须是 `double` 类型。如果当前方法是 `synchronized` 方法，则在调用方法时进入或重入的监视器将被更新并可能退出，就像在当前线程中执行了\
  \ `monitorexit` 指令一样 (§*monitorexit)。如果没有抛出异常，`value` 从当前帧的操作数栈弹出 (§2.6) 并经过值集转换\
  \ (§2.8.3)，得到 `value`’。`value`’ 被推调用者帧的操作数栈。当前方法操作数栈上的任何其他值都会被丢弃。\n\n解释器随后将控制权交回方法的调用者，恢复调用者的帧。\n\
  \n### 运行时异常\nJava 虚拟机实现并不强制执行 §2.1 中描述的规则，如果当前方法是 `synchronized` 方法且在调用时进入或重入了监视器，则\
  \ `dreturn` 抛出 `IllegalMonitorStateException`。\n\n### dstore\n\n### 操作\n将 `double`\
  \ 存储局部变量\n\n### 格式\n![Image](img/403fig01.jpg)\n\n### 形式\n`dstore` = 57 (0x39)\n\
  \n### 操作数\n..., `value` →\n\n### 栈\n...\n\n### 描述\n`index` 是一个无符号字节。`index` 和 `index`+1\
  \ 必须是当前帧局部变量数组的索引 (§2.6)。操作数栈顶部的 `value` 必须是 `double` 类型。它从操作数栈弹出并经过值集转换 (§2.8.3)，得到\
  \ `value`’。`index` 处的局部变量被设置为 `value`’。\n\n### 注意事项\n`dstore` 码可以与 `wide` 指令结合使用，使用双字节索引访问局部变量。\n\
