  \ 表示字符串“`SourceDebugExtension`”。\n\n`attribute_length`\n\n`attribute_length` 项的值表示属性的长度，不包括初始的六字节。\n\
  \n`debug_extension[]`\n\n`debug_extension` 数组持有扩展调试信息，这些信息对 Java 虚拟机没有语义影响。信息使用修改后的\
  \ UTF-8 字符串表示 4.4.7)，且没有终止零字节。\n\n注意 `debug_extension` 数组可能表示一个比 `String` 实例所能表示的更长的字符串。\n\
  \n#### 4.7.12 LineNumberTable 属性\n\n\n\n\n`LineNumberTable` 属性是 `Code` 属性 `attributes`\
  \ 表中的一个可选的可变长度属性（§4.7.3）。它可能被调试器用于确定 `code` 数组的某部分对应源文件中的特定行号。\n\n如果 `Code` 属性的\
  \ `attributes` 表中存在多个 `LineNumberTable` 属性，则它们可以以任何顺序出现。\n\n在 `Code` 属性的 `attributes`\
  \ 表中，*每行源文件*可能有多个一个 `LineNumberTable` 属性。也就是说，`LineNumberTable` 属性可以共同表示源文件的某行，而不需要与源行一一一对应。\n\
