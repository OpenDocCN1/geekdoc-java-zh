  ```\n\n`local_variable_type_table` 数组中的每个条目都表示 `code` 数组偏移量的一个范围，在此范围内局部变量具有值。它还表示当前栈帧（frame）中局部变量数组的索引，通过该索引可以找到该局部变量。每个条目必须包含以下五项：\n\
