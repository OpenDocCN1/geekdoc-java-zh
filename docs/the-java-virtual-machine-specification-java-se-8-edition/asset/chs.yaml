  \ 项的值必须是 `constant_pool` 表的有效索引。该索引处的 `constant_pool` 条目必须包含 `CONSTANT_Utf8_info`\
  \ 结构，表示指示局部变量的有效未限定名。\n\n`signature_index`\n\n`signature_index` 项的值必须是 `constant_pool`\
  \ 表的有效索引。该索引处的 `constant_pool` 条目必须包含 `CONSTANT_Utf8_info` 结构，表示编码源程序中局部变量类型的字段签名（signature）。\n\
  \n`index`\n\n给定的局部变量必须位于当前栈帧局部变量数组的 `index` 处。\n\n如果 `index` 处的局部变量类型为 `double`\
  \ 或 `long`，则它同时占据 `index` 和 `index + 1` 的位置。\n\n### 4.7.15 弃用属性 (The Deprecated\
  \ Attribute)\n\n`Deprecated` 属性是 `ClassFile`、`field_info` 或 `method_info` 结构 `attributes`\
  \ 表中的可选固定长度属性。类、接口、方法或字段可以使用 `Deprecated` 属性进行标记，表示该类、接口、方法或字段已被取代。\n\n读取 `class`\
  \ 文件格式的运行时解释器或工具（如编译器）可以使用此标记提示用户正在引用被取代的类、接口、方法或字段。`Deprecated` 属性的存在不会改变类或接口的语义。\n\
  \n`Deprecated` 属性格式如下：\n\n```\nDeprecated_attribute {\n    u2 attribute_name_index;\n\
  \    u4 attribute_length;\n}\n```\n\n`Deprecated_attribute` 结构的各项项如下：\n\n`attribute_name_index`\n\
  \n`attribute_name_index` 项的值必须是 `constant_pool` 表的有效索引。该索引处的 `constant_pool` 条目必须是\
  \ `CONSTANT_Utf8_info` 结构，表示字符串 `Deprecated`。\n\n`attribute_length`\n\n`attribute_length`\
  \ 项的值必须为零。\n\n### 4.7.16 运行时可见注解属性 (The RuntimeVisibleAnnotations Attribute)\n\n\
  `RuntimeVisibleAnnotations` 属性是 `ClassFile`、`field_info` 或 `method_info` 结构 `attributes`\
  \ 表中的变长属性。`RuntimeVisibleAnnotations` 属性记录对应类、字段或方法声明上的运行时可见注解。Java 虚拟机必须使这些注解可用，以便它们可以通过相应的反射\
  \ API 返回。\n\n`ClassFile`、`field_info` 或 `method_info` 结构的 `attributes` 表中最多有一个 `RuntimeVisibleAnnotations`\
  \ 属性。\n\n`RuntimeVisibleAnnotations` 属性格式如下：\n\n```\nRuntimeVisibleAnnotations_attribute\
  \ {\n    u2 attribute_name_index;\n    u4 attribute_length;\n    u2 num_annotations;\n\
  \    annotation annotations[num_annotations];\n}\n```\n\n`RuntimeVisibleAnnotations_attribute`\
  \ 结构的各项项如下：\n\n`attribute_name_index`\n\n`attribute_name_index` 项的值必须是 `constant_pool`\
  \ 表的有效索引。该索引处的 `constant_pool` 条目必须是 `CONSTANT_Utf8_info` 结构，表示字符串 `RuntimeVisibleAnnotations`。\n\
  \n`attribute_length`\n\n`attribute_length` 项的值表示属性的长度，不包括初始字节。\n\n`num_annotations`\n\
  \n`num_annotations` 项的值给出运行时可见注解的数量。\n\n`annotations`\n\n`annotations` 表中的每个条目代表单个运行时注解。`annotation`\
  \ 结构格式如下：\n\n```\nannotation {\n    u2 type_index;\n    u2 num_element_pairs;\n\
  \    {\n        u2 element_name_index;\n        element_value value;\n    } element_value_pairs[num_element_pairs];\n\
  }\n```\n\n`annotation` 结构的各项项如下：\n\n`type_index`\n\n`type_index` 项的值必须是 `constant_pool`\
  \ 表的有效索引。该索引处的 `constant_pool` 条目必须是 `CONSTANT_Utf8_info` 结构，表示字段描述符（field descriptor）。字段描述符表示此\
  \ `annotation` 结构所代表的注解类型。\n\n`num_element_pairs`\n\n`num_element_pairs` 项的值给出 `annotation`\
  \ 结构表示的键值对数量。\n\n`element_value_pairs`\n\n`element_value_pairs` 表中的每个值代表 `annotation`\
  \ 结构中的单个键值对。每个 `element_value_pairs` 条目包含以下两项：\n\n`element_name_index`\n\n`element_name_index`\
  \ 项的值必须是 `constant_pool` 表的有效索引。该索引处的 `constant_pool` 条目必须是 `CONSTANT_Utf8_info`\
  \ 结构。该条目表示此 `element_value_pairs` 条目代表的元素名。换句话说，该条目表示由 `type_index` 指定注解类型的元素。\n\
  \n`value`\n\n`value` 项的值表示此 `element_value_pairs` 条目代表的键值对的值。\n\n#### 4.7.16.1 element_value\
  \ 结构\n\n`element_value` 结构是一个表示键值对值的区分联合。它具有以下格式：\n\n```\nelement_value {\n    u1\
  \ tag;\n    union {\n        u2 const_value_index;\n        {\n            u2 type_name_index;\n\
  \            u2 const_name_index;\n        } enum_const_value;\n        u2 class_info_index;\n\
  \        annotation annotation_value;\n        {\n            u2 num_values;\n \
  \           element_value values[num_values];\n        } array_value;\n    } value;\n\
  }\n```\n\n`tag` 项使用单个 ASCII 字符来指示键值对值的类型。这决定了 `value` 联合中使用哪一个项。表格显示 `tag` 项的有效字符、每个字符指示的类型，以及每个字符在\
  \ `value` 联合中使用的项。表格的第四列用于下方对 `value` 联合某一项的描述。\n\n\n\n\n\n# 表 4.7.16.1-A. 将 `tag`\
  \ 的值解释为类型\n\n`value` 项代表元素-值对的值。该项是一个联合体（union），其子项如下：\n\n### `const_value_index`\n\
  \n`const_value_index` 项表示该元素-值对的值为原始类型常量值或 `String` 字面量。\n\n`const_value_index`\
  \ 项的值必须是 `constant_pool` 表中的有效索引。该索引处的 `constant_pool` 条目必须是与 `tag` 项匹配的类型，具体如表\
  \ 4.7.16.1-A 第四列所示。\n\n### `enum_const_value`\n\n`enum_const_value` 项表示该元素-值对的值为一个枚举常量（enum\
  \ constant）。\n\n`enum_const_value` 项由以下两个项组成：\n\n#### `type_name_index`\n\n`type_name_index`\
  \ 项的值必须是 `constant_pool` 表中的有效索引。该索引处的 `constant_pool` 条目必须是一个 `CONSTANT_Utf8_info`\
  \ 结构 (§4.4.7)，表示一个字段描述符 (§4.3.2)。`constant_pool` 条目提供了由该 `element_value` 结构表示的枚举常量类型二进制命名的内部形式\
  \ (§4.2.1)。\n\n#### `const_name_index`\n\n`const_name_index` 项的值必须是 `constant_pool`\
  \ 表中的有效索引。该索引处的 `constant_pool` 条目必须是一个 `CONSTANT_Utf8_info` 结构 (§4.4.7)。`constant_pool`\
  \ 条目提供了由该 `element_value` 结构表示的枚举常量的简单名。\n\n#### `class_info_index`\n\n`class_info_index`\
  \ 项表示该元素-值对的值为一个类字面量（class literal）。\n\n`class_info_index` 项必须是 `constant_pool`\
  \ 表中的有效索引。该索引处的 `constant_pool` 条目必须是一个 `CONSTANT_Utf8_info` 结构 (§4.4.7)，表示一个返回描述符\
  \ (§4.3.3)。返回描述符提供了与该 `element_value` 结构表示的类字面量相对应的类型。类型与类字面量的对应关系如下：\n\n* 对于类字面量\
  \ `C.class`，其中 `C` 是类、接口或数组类型的名称，其对应的类型为 `C`。`constant_pool` 中的返回描述符将是一个 `ObjectType`\
  \ 或 `ArrayType`。\n* 对于类字面量 `p.class`，其中 `p` 是原始类型的名称，其对应的类型为 `p`。`constant_pool`\
  \ 中的返回描述符将是一个 `BaseType` 字符。\n* 对于类字面量 `void.class`，对应的类型为 `void`。`constant_pool`\
  \ 中的返回描述符将为 `V`。\n\n例如，类字面量 `Object.class` 对应类型 `Object`，因此 `constant_pool` 条目为\
  \ `Ljava/lang/Object;`；而类字面量 `int.class` 对应类型 `int`，因此 `constant_pool` 条目为 `I`。\n\
  \n类字面量 `void.class` 对应 `void`，因此 `constant_pool` 条目为 `V`；而类字面量 `Void.class` 对应类型\
  \ `Void`，因此 `constant_pool` 条目为 `Ljava/lang/Void;`。\n\n### `annotation_value`\n\n\
  `annotation_value` 项表示该元素-值对的值为一个“嵌套”注解。\n\n`annotation_value` 项的值是一个 `annotation`\
  \ 结构 (§4.7.16)，它提供了该 `element_value` 结构表示的注解。\n\n### `array_value`\n\n`array_value`\
  \ 项表示该元素-值对的值为一个数组。\n\n`array_value` 项由以下两个项组成：\n\n#### `num_values`\n\n`num_values`\
  \ 项的值提供了由该 `element_value` 结构表示的数组的元素个数。\n\n#### `values[]`\n\n`values` 表中的每个值提供了该\
  \ `element_value` 结构表示的数组的对应元素。\n\n## 4.7.17 RuntimeInvisibleAnnotations 属性\n\n\
  `RuntimeInvisibleAnnotations` 属性是 `ClassFile`、`field_info` 或 `method_info` 结构中 `attributes`\
  \ 表中的变长属性 (§4.1, §4.5, §4.6)。`RuntimeInvisibleAnnotations` 属性记录相应类、方法或字段声明上的运行时不可见注解。\n\
  \n在 `ClassFile`、`field_info` 或 `method_info` 结构的 `attributes` 表中最多可以有一个 `RuntimeInvisibleAnnotations`\
  \ 属性。`RuntimeInvisibleAnnotations` 属性与 `VisibleAnnotations` 属性类似，但其表示的注解不会通过反射 API\
  \ 可用，除非虚拟机通过特定机制保留了这些注解。\n\n`RuntimeInvisibleAnnotations` 属性具有以下格式：\n\n```\nRuntimeInvisibleAnnotations_attribute\
  \ {\n    u2 attribute_name_index;\n    u4 attribute_length;\n    u2 num_annotations;\n\
  \    annotation annotations[num_annotations];\n}\n```\n\n`RuntimeInvisibleAnnotations_attribute`\
  \ 的项如下：\n\n### `attribute_name_index`\n\n`attribute_name_index` 项的值必须是 `constant_pool`\
  \ 表中的有效索引。该索引处的 `constant_pool` 条目必须是一个 `CONSTANT_Utf8_info` 结构 (§4.4.7)，表示字符串 \"\
  `RuntimeInvisibleAnnotations`”。\n\n### `attribute_length`\n\n`attribute_length`\
  \ 项的值表示属性的长度，不包括前 6 个字节。\n\n### `num_annotations`\n\n`num_annotations` 项的值提供了该结构表示的运行时不可见注解的数量。\n\
  \n### `annotations[]`\n\n`annotations` 表中的每个条目表示一个运行时不可见注解。`annotation` 结构在 §4.7.16\
  \ 中定义。\n\n## 4.7.18 RuntimeVisibleParameterAnnotations 属性\n\n`RuntimeVisibleParameterAnnotations`\
  \ 属性是 `method_info` 结构中 `attributes` 表中的变长属性 (§4.6)。`RuntimeVisibleParameterAnnotations`\
  \ 属性记录方法参数声明上的运行时可见注解。虚拟机必须使这些注解可用，以便通过反射 API 返回。\n\n`method_info` 结构的 `attributes`\
  \ 表中最多有一个 `RuntimeVisibleParameterAnnotations` 属性。\n\n`RuntimeVisibleParameterAnnotations`\
  \ 属性具有以下格式：\n\n```\nRuntimeVisibleParameterAnnotations_attribute {\n    u2 attribute_name_index;\n\
  \    u4 attribute_length;\n    u1 num_parameters;\n    {\n        u2 num_annotations;\n\
  \        annotation annotations[num_annotations];\n    } parameter_annotations[num_parameters];\n\
  }\n```\n\n`RuntimeVisibleParameterAnnotations_attribute` 结构的项如下：\n\n### `attribute_name_index`\n\
  \n`attribute_name_index` 项的值必须是 `constant_pool` 表中的有效索引。该索引处的 `constant_pool` 条目必须是一个\
  \ `CONSTANT_Utf8_info` 结构 (§4.4.7)，表示字符串 \"`RuntimeVisibleParameterAnnotations`”。\n\
  \n### `attribute_length`\n\n`attribute_length` 项的值表示属性的长度，不包括前 6 个字节。\n\n### `num_parameters`\n\
  \n`num_parameters` 项的值提供了由 `method_info` 结构表示的方法上出现注解的形式形参数个数。\n\n\n\n\n\n这重复了可以从方法描述符（method\
  \ descriptor）中提取的信息。\n\n### `parameter_annotations[]`\n\n`parameter_annotations`\
  \ 表中的每个条目代表了单个形式参数声明上的所有运行时可见的注解。表中的第 `i` 个条目对应方法描述符中的第 `i` 个形式参数（§4.3.3）。每个 `parameter_annotations`\
  \ 条目包含以下两个项：\n\n#### `num_annotations`\n`num_annotations` 项的值表示与 `parameter_annotations`\
  \ 条目对应的形式参数声明上，运行时可见的注解数量。\n\n#### `annotations[]`\n`annotations` 表中的每个条目代表与 `parameter_annotations`\
  \ 条目对应的形式参数声明上的单个运行时可见的注解。`annotation` 结构在 §4.7.16 中规定。\n\n### 4.7.19 属性：RuntimeInvisibleParameterAnnotations\n\
  \n`RuntimeInvisibleParameterAnnotations` 属性是 `method_info` 结构 `attributes` 表中的一个变长属性（§4.6）。`RuntimeInvisibleParameterAnnotations`\
  \ 属性记录了相应方法形式参数声明上的运行时不可见的注解。\n\n`method_info` 结构的 `attributes` 表中最多有一个 `RuntimeInvisibleParameterAnnotations`\
  \ 属性。\n\n`RuntimeInvisibleParameterAnnotations` 属性与 `RuntimeVisibleParameterAnnotations`\
  \ 属性（§4.7.18）相似，区别在于：`RuntimeInvisibleParameterAnnotations` 属性所表示的注解不能通过反射 API 返回，除非\
  \ Java 虚拟机通过某些特定于实现的机制（例如命令行标记）被特别指示保留这些注解。在没有此类指令的情况下，Java 虚拟机会忽略此属性。\n\n`RuntimeInvisibleParameterAnnotations`\
  \ 属性具有以下格式：\n\n点击此处查看代码图像\n\n```\nRuntimeInvisibleParameterAnnotations_attribute\
  \ {\n    u2 attribute_name_index;\n    u4 attribute_length;\n    u1 num_parameters;\n\
  \    {\n        u2 num_annotations;\n        annotation annotations[num_annotations];\n\
  \    } parameter_annotations[num_parameters];\n}\n```\n\n`RuntimeInvisibleParameterAnnotations_attribute`\
  \ 结构的各个项如下：\n\n#### `attribute_name_index`\n`attribute_name_index` 项的值必须是 `constant_pool`\
  \ 表的有效索引。该索引处的 `constant_pool` 条目必须是一个 `CONSTANT_Utf8_info` 结构（§4.4.7），代表字符串“RuntimeInvisibleParameterAnnotations`。\n\
  \n#### `attribute_length`\n`attribute_length` 项的值表示属性的长度，不包括初始的六字节。\n\n#### `num_parameters`\n\
  `num_parameters` 项的值表示发生该注解的 `method_info` 结构所代表的方法的形式参数数量。\n\n这重复了可以从方法描述符中提取的信息。\n\
  \n#### `parameter_annotations[]`\n`parameter_annotations` 表中的每个条目代表了单个形式参数声明上的所有运行时不可见的注解。表中的第\
  \ `i` 个条目对应方法描述符中的第 `i` 个形式参数（§4.3.3）。每个 `parameter_annotations` 条目包含以下两个项：\n\n\
  #### `num_annotations`\n`num_annotations` 项的值表示与 `parameter_annotations` 条目对应的形式参数声明上，运行时不可见的注解数量。\n\
  \n#### `annotations[]`\n`annotations` 表中的每个条目代表与 `parameter_annotations` 条目对应的形式参数声明上的单个运行时不可见的注解。`annotation`\
  \ 结构在 §4.7.16 中规定。\n\n### 4.7.20 属性：RuntimeVisibleTypeAnnotations\n\n`RuntimeVisibleTypeAnnotations`\
  \ 属性是 `ClassFile`、`field_info` 或 `method_info` 结构，或 `Code` 属性 `attributes` 表中的一个变长属性（§4.1,\
  \ §4.5, §4.6, §4.7.3）。`RuntimeVisibleTypeAnnotations` 属性记录了相应类、字段或方法声明中使用、或在相应方法体表达式中用到的类型的运行时可见注解。`RuntimeVisibleTypeAnnotations`\
  \ 属性还记录了泛型类、接口、方法和构造函数的类型参数声明上的运行时可见注解。Java 虚拟机必须提供这些注解，以便它们可以通过反射 API 返回。`ClassFile`、`field_info`\
  \ 或 `method_info` 结构或 `Code` 的 `attributes` 表中最多有一个 `RuntimeVisibleTypeAnnotations`\
  \ 属性。只有当类型标记了注解时，`attributes` 表才会包含 `RuntimeVisibleTypeAnnotations` 属性。例如，`implements`\
  \ 子句上的所有注解都记录在 `ClassFile` 结构的 `RuntimeVisibleTypeAnnotations` 属性中。同时，字段声明上的注解记录在\
  \ `field_info` 结构的 `RuntimeVisibleTypeAnnotations` 属性中。\n\n`RuntimeVisibleTypeAnnotations`\
  \ 属性具有以下格式：\n\n点击此处查看代码图像\n\n```\nRuntimeVisibleTypeAnnotations_attribute {\n  \
  \  u2 attribute_name_index;\n    u4 attribute_length;\n    u2 num_annotations;\n\
  \    type_annotation annotations[num_annotations];\n}\n```\n\n`RuntimeVisibleTypeAnnotations_attribute`\
  \ 的各个项如下：\n\n#### `attribute_name_index`\n`attribute_name_index` 项的值必须是 `constant_pool`\
  \ 表的有效索引。该索引处的 `constant_pool` 条目必须是一个 `CONSTANT_Utf8_info` 结构，代表字符串“RuntimeVisibleTypeAnnotations`。\n\
  \n#### `attribute_length`\n`attribute_length` 项的值表示属性的长度，不包括初始的六字节。\n\n#### `num_annotations`\n\
  `num_annotations` 项的值给出该结构表示的运行时可见注解数量。\n\n#### `annotations[]`\n`annotations` 表中的每个条目代表声明或表达式中使用的单个运行时可见注解。`type_annotation`\
  \ 结构具有以下格式：\n\n点击此处查看代码图像\n\n```\ntype_annotation {\n    u1 target_type;\n    union\
  \ {\n        type_parameter_target;\n        supertype_target;\n        type_parameter_bound_target;\n\
  \        empty_target;\n        method_formal_parameter_target;\n        throws_target;\n\
  \        localvar_target;\n        catch_target;\n        offset_target;\n     \
  \   type_argument_target;\n    } target_info;\n    type_path target_path;\n    u2\
  \ type_index;\n    u2 num_element_value_pairs;\n    {\n        u2 element_name_index;\n\
  \        element_value value;\n    } element_value_pairs[num_element_value_pairs];\n\
  }\n```\n\n前三项 `target_type`、`target_info` 和 `target_path` 指定了被注解类型的精确定位置。后三项 `type_index`、`num_element_value_pairs`\
  \ 和 `element_value_pairs[]` 指定了注解自身的类型和元素-值对。\n\n`type_annotation` 结构的各个项如下：\n\n\
  `target_type`\n\n\n\n\n\n`target_type` 项的值表示注解出现的类型类型。各种类型的目标对应于 Java 编程语言中的*类型上下文*（type\
  \ contexts），其中类型在声明和表达式中使用（见 JLS §4.11）。\n\n`target_type` 的合法值在表 4.7.20-A 和表 4.7.20-B\
  \ 中指定。每个值都是单字节标记，指示 `target_info` 联合体的哪一项跟在 `target_type` 项之后，以提供关于目标的更多信息。\n\n\
  ![Image](img/142tab01.jpg)\n\n**表 4.7.20-A. `target_type` 值的解释（第 1 部分）**\n\n![Image](img/143tab01.jpg)\n\
  \n**表 4.7.20-B. `target_type` 值的解释（第 2 部分）**\n\n表 4.7.20-A 和表 4.7.20-B 中的目标类型对应于\
  \ JLS §4.11 中的类型上下文。具体来说，`target_type` 值 0x10-0x17 和 0x40-0x42 对应类型上下文 1-10，而 `target_type`\
  \ 值 0x43-0x4B 对应类型上下文 11-16。\n\n`target_type` 项的值决定了 `type_annotation` 结构出现在 `ClassFile`\
  \ 结构中的 `RuntimeVisibleTypeAnnotations` 属性、`field_info` 结构、`method_info` 结构或 `Code`\
  \ 属性中。表 4.7.20-C 给出了具有每个合法 `target_type` 值的 `type_annotation` 结构的 `RuntimeVisibleTypeAnnotations`\
  \ 属性的位置。\n\n![Image](img/144tab01.jpg)\n\n**表 4.7.20-C. `target_type` 值的包含属性的位置**\n\
  \n### target_info\n\n`target_info` 项的值精确表示声明或表达式中的哪种类型被了注解。\n\n`target_info` 联合体的项指定在\
  \ §4.7.20.1 中。\n\n### target_path\n\n`target_path` 项的值精确表示由 `target_info` 指出的类型的哪部分被了注解。\n\
  \n`type_path` 结构的格式指定在 §4.7.20.2 中。\n\n### type_index, num_element_value_pairs,\
