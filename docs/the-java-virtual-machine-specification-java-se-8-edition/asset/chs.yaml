  \ = 134 (0x86)\n\n**Operand**\n..., `value` →\n\n**Stack**\n..., `result`\n\n**Description**\n\
  操作数栈顶的 `value` 必须是 `int` 类型。它从栈中弹出，并使用 IEEE 754 舍入最近模式转换为 `float` 类型 `result`。该\
