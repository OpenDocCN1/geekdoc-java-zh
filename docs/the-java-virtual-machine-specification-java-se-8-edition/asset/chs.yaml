  \ 结构简体 4.4.7) 表示一个字符串。\n\n`sourcefile_index` 引用的字符串将被解释为编译此 `class` 文件的文件名。它不会被解释为文件的目录或绝对路径；此类特定的附加信息在实际使用时由运行时解释器或开发工具提供。\n\
  \n#### 4.7.11 SourceDebugExtension 属性\n\n`SourceDebugExtension` 属性是 `ClassFile`\
  \ 结构属性表中的一个可选属性 (§4.1)。\n\n`ClassFile` 结构属性表中最多有一个 `SourceDebugExtension` 属性。\n\n\
  `SourceDebugExtension` 属性具有以下格式：\n\n```\nSourceDebugExtension_attribute {\n  u2\
