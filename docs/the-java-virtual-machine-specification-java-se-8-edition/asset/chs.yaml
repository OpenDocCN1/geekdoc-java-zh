  \ start_pc;\n        u2 length;\n        u2 name_index;\n        u2 descriptor_index;\n\
  \        u2 index;\n    } local_variable_table[local_variable_table_length];\n}\n\
  ```\n\n`LocalVariableTable_attribute` 结构的各项如下：\n\n`attribute_name_index`\n`attribute_name_index`\
  \ 项的值必须是指向 `constant_pool` 表的有效索引。该索引处的 `constant_pool` 条目必须是一个 `CONSTANT_Utf8_info`\
