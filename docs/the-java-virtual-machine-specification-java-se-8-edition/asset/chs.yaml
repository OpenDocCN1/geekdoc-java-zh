  \ 类型的值只有 24 位尾数位。\n\n### i2l\n\n**Operation**\n将 `int` 转换为 `long`\n\n**Format**\n\
  ![Image](img/446fig01.jpg)\n\n**Forms**\n`i2l` = 133 (0x85)\n\n**Operand**\n...,\
  \ `value` →\n\n**Stack**\n..., `result`\n\n**Description**\n操作数栈顶的 `value` 必须是 `int`\
  \ 类型。它从栈中弹出并符号扩展为 `long` 类型 `result`。该 `result` 被推入操作数栈。\n\n**Notes**\n`i2l` 指令执行扩展原始转换（JLS\
  \ §5.1.2）。由于所有 `int` 类型的值都可以被 `long` 类型精确表示，因此转换是精确的。\n\n### i2s\n\n**Operation**\n\
