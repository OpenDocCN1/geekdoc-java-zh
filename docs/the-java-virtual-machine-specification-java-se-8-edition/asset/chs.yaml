  \n### 4.7.20.1 target_info 联合体\n\n`target_info` 联合体的项（第一项外）精确指定声明或表达式中的哪种类型被了注解。第一项指定的不是哪种类型，而是哪种类型参数声明被了注解。项如下：\n\
  \n- `type_parameter_target` 项表示注解出现在泛型类、泛型接口、泛型方法或泛型构造函数的第 *i* 个类型参数的声明上。\n\n```\n\
