  \ 指令将抛出 `ArrayIndexOutOfBoundsException`。\n\n## dload_<n>\n\n**操作**\n从局部变量加载 `double`\n\
  \n**格式**\n![Image](img/396fig01.jpg)\n\n**形式**\n`dload_0` = 38 (0x26)\n`dload_1`\
  \ = 39 (0x27)\n`dload_2` = 40 (0x28)\n`dload_3` = 41 (0x29)\n\n**操作数**\n... →\n\n\
  **栈**\n..., `value`\n\n**描述**\n每个 `dload_<n>` 指令与带有 `<n>` 的 *dload* 相同，只是 `<n>`\
  \ 是隐式的。局部变量必须包含一个 `double`。位于 `<n>` 的 `value` 被推入操作数栈。\n\n### dmul\n\n**操作**\n乘法\
