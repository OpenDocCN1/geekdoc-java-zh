  \ `result`\n\n**Description**\n操作数栈顶的 `value` 必须是 `int` 类型。它从栈中弹出，截断为 `byte`，然后符号扩展为\
  \ `int` 类型 `result`。该 `result` 被推入操作数栈。\n\n**Notes**\n`i2b` 指令执行收窄原始转换（JLS §5.1.3）。它可能会丢失\
  \ `value` 整体幅度的信息。`result` 的符号也可能与 `value` 不相同。\n\n### i2c\n\n**Operation**\n将 `int`\
  \ 转换为 `char`\n\n**Format**\n![Image](img/443fig01.jpg)\n\n**Forms**\n`i2c` = 146\
  \ (0x92)\n\n**Operand**\n..., `value` →\n\n**Stack**\n..., `result`\n\n**Description**\n\
  操作数栈顶的 `value` 必须是 `int` 类型。它从栈中弹出，截断为 `char`，然后零扩展为 `int` 类型 `result`。该 `result`\
  \ 被推入操作数栈。\n\n**Notes**\n`i2c` 指令执行收窄原始转换（JLS §5.1.3）。它可能会丢失 `value` 整体幅度的信息。`result`（始终为正）的符号也可能与\
  \ `value` 不相同。\n\n### i2d\n\n**Operation**\n将 `int` 转换为 `double`\n\n**Format**\n\
  ![Image](img/444fig01.jpg)\n\n**Forms**\n`i2d` = 135 (0x87)\n\n**Operand**\n...,\
  \ `value` →\n\n**Stack**\n..., `result`\n\n**Description**\n操作数栈顶的 `value` 必须是 `int`\
  \ 类型。它从栈中弹出并转换为 `double` 类型 `result`。该 `result` 被推入操作数栈。\n\n**Notes**\n`i2d` 指令执行扩展原始转换（JLS\
  \ §5.1.2）。由于所有 `int` 类型的值都可以被 `double` 类型精确表示，因此转换是精确的。\n\n### i2f\n\n**Operation**\n\
