  \ BranchStackFrame), Targets),\n    exceptionStackFrame(StackFrame, ExceptionStackFrame).\n\
  ```\n\n### wide\n\n`wide` 指令遵循与其所扩展的指令相同的规则。\n\n点击此此处查看代码图像\n\n```\ninstructionHasEquivalentTypeRule(wide(WidenedInstruction),\n\
  \                                  WidenedInstruction).\n```\n\n#### 4.10.2 通过类型推断进行验证\n\
  \n不包含 `StackMapTable` 属性的 `class` 文件（该属性版本号必然为 49.0 或更低）必须通过类型推断进行验证。\n\n##### 4.10.2.1\
  \ 通过类型推断进行验证的过程\n\n在链接期间，验证器会通过对 `class` 文件中的每个方法执行数据流分析，来检查其 `Code` 属性中的 `code`\
  \ 数组。验证器确保在程序的任何给定点上，无论通过何种代码路径到达该点，以下所有条件均成立：\n\n• 操作数栈的大小始终相同，且包含相同类型的值。\n• 除非已知局部变量包含适当类型的值，否则不访问该局部变量。\n\
  • 调用方法时使用了适当的参数。\n• 字段仅使用适当类型的值进行赋值。\n• 所有操作码（opcodes）在操作数栈和局部变量数组中都具有相应类型的参数。\n\
  \n出于效率考虑，验证器原则上可以执行的某些测试会被推迟到方法代码实际被调用第一次。通过这样做，验证器避免了在非必要的情况下加载 `class` 文件。\n\n\
  例如，如果一个方法调用了另一个返回类 A 实例的方法，且该实例仅被赋值给相同类型的字段，则验证器将不检查类 A 是否实际存在。然而，如果它被赋值给类型 B 的字段，则必须加载\
  \ A 和 B 的定义，以确保 A 是 B 的子类。\n\n##### 4.10.2.2 字节码验证器\n\n每个方法的代码都是独立进行验证的。首先，将组成代码的字节拆分为一系列指令，并将每条指令起始在\
  \ `code` 数组中的索引存于数组中。然后，验证器再次遍历代码并解析指令。在此过程中，会构建一个数据结构来存储该方法中每个 Java 虚拟机指令的信息。每条指令的操作数（如果有）都会被检查，以确保它们是有效的。例如：\n\
  \n• 分支必须在方法 `code` 数组的边界范围内。\n• 所有控制流指令的目标必须是每条指令的起始位置。在 `wide` 指令的情况下，`wide` 操作码被视为指令的起始位置，而由该\
  \ `wide` 指令修改的操作的操作码不被视为指令的起始。不允许跳转到指令中间。\n• 任何指令不能访问或修改索引大于或等于其方法指示分配的局部变量数量的局部变量。\n\
  • 对常量池的所有引用必须指向具有适当类型的条目。（例如，`getfield` 指令必须引用一个字段。）\n• 代码不会在指令中间结束。\n• 执行不能从代码末尾落下。\n\
  • 对于每个异常处理程序，被处理程序保护的代码的起点和终点必须在指令的开头，或者（在结束点的情况下）紧邻代码的结束之后。起始点必须在结束点之前。异常处理程序代码必须从有效的指令开始，且不能从被\
  \ `wide` 指令修改的操作码开始。\n\n对于方法的每条指令，验证器都会记录执行该指令之前的操作数栈的内容和局部变量数组的内容。对于操作数栈，它需要知道栈的高度以及栈上每个值的类型。对于每个局部变量，它需要知道该局部变量内容的类型，或者知道该局部变量包含一个不可用或未知的值。\n\
  \n接下来，初始化数据流分析器。对于方法的的第一条指令，代表参数的局部变量初始包含方法所示所示类型的值；操作数栈为空。所有其他局部变量都包含一个非法值。对于尚未检查的其他指令，没有可用信息。\n\
  \n最后，验证器（等等，我注意到原文中重复了“the definitions of both A and B must be loaded in to ensure\
  \ that A is a subclass of B”以及某些逻辑流。我将严格按照提供的文本内容进行格式化）。\n\n*（自我纠正：提供的源文本包含一些重复部分或合并的逻辑。我将按照要求完整地格式化。）*\n\
  \n\n\n\n\n- 如果是第一次访问后继指令，则记录步骤 2 和 3 中计算出的操作数栈和局部变量的值即为执行后继指令之前的操作数栈状态和局部变量数组状态。为后继指令设置\
  \ `changed` 位。\n- 如果之前见过该后继指令，则将步骤 2 和 3 中计算出的操作数栈和局部变量的值合并到已有的值中。如果值发生任何修改，则设置\
  \ `changed` 位。\n\n**5.** 回到步骤 1 继续。\n\n要合并两个操作数栈，每个栈上的值数量必须相同。然后，比较两个栈上对应的值，并计算合并后栈上的值，如下如下所示：\n\
  \n- 如果其中一个值是基本类型，则对应值也必须是相同的基本类型。合并后的值是该基本类型。\n- 如果其中一个值是非数组引用类型，则对应值必须是引用类型（数组或非数组）。合并后的值是引用这两个引用类型的第一个公共超类实例的引用。（这种引用类型始终存在，因为\
  \ `Object` 类型是所有类、接口和数组类型的超类。）\n\n例如，`Object` 和 `String` 可以合并；结果是 `Object`。同样，`Object`\
  \ 和 `String[]` 可以合并；结果仍是 `Object`。即使 `Object` 和 `int[]` 可以合并，或者 `String` 和 `int[]`\
  \ 可以合并；结果都是 `Object`。\n\n- 如果对应的值都是数组引用类型，则检查它们的维度。如果数组类型具有相同的维度，则合并后的值是作为两个数组类型的第一个公共超类的数组类型实例的\
  \ `reference`。（如果其中一个或两个数组类型具有基本元素类型，则用 `Object` 代替元素类型。）如果数组类型的维度不同，则合并后的值是维度为两者较小者维度的数组类型实例的\
  \ `reference`；如果较小的数组类型是 `Cloneable` 或 `java.io.Serializable`，则元素类型为 `Cloneable`\
  \ 或 `java.io.Serializable`，否则为 `Object`。\n\n例如，`Object[]` 和 `String[]` 可以合并；结果是\
  \ `Object[]`。`Cloneable[]` 和 `String[]` 可以合并，或者 `java.io.Serializable[]` 和 `String[]`\
  \ 可以合并；结果分别为 `Cloneable[]` 和 `java.io.Serializable[]`。即使 `int[]` 和 `String[]` 可以合并；结果是\
  \ `Object[]`，因为在计算第一个公共超类时用 `Object` 代替了 `int`。\n\n由于数组类型可能有不同的维度，`Object[]` 和 `String[][]`\
  \ 可以合并，或者 `Object[][]` 和 `String[]` 可以合并；两种情况的结果都是 `Object[]`。`Cloneable[]` 和 `String[][]`\
  \ 可以合并；结果是 `Cloneable[]`。最后，`Cloneable[][]` 和 `String[]` 可以合并；结果是 `Object[]`。\n\n\
  如果无法合并操作数栈，则方法验证失败。\n\n要合并两个局部变量数组状态，比较成对的局部变量。合并后的局部变量的值使用上述规则计算，但允许对应的值是不同的基本类型。在这种情况下，验证器会记录合并后的局部变量包含一个不可用的值。\n\
  \n如果数据流分析器在方法上运行且没有报告验证失败，则该方法已通过 `class` 文件验证器的成功验证。\n\n某些指令和数据类型增加了数据流分析器的复杂性。我们现在更详细地检查这些每一项。\n\
  \n### 4.10.2.3 long 和 double 类型的值\n\n`long` 和 `double` 类型的值在验证过程中被特殊处理。\n\n每当类型为\
  \ `long` 或 `double` 的值移动到索引为 `n` 的局部变量时，索引 `n+1` 会被特殊标记，表示它已被索引 `n` 处的值保留，不能作为局部变量索引使用。之前索引\
  \ `n+1` 处的任何值都变为不可用。\n\n每当一个值移动到索引为 `n` 的局部变量时，会检查索引 `n-1` 是否为 `long` 或 `double`\
  \ 类型值的索引。如果是，则索引 `n-1` 处的局部变量将被更改，以指示它现在包含一个不可用的值。由于索引 `n` 处的局部变量已被覆盖，索引 `n-1` 处的局部变量无法表示\
  \ `long` 或 `double` 类型的值。\n\n处理操作数栈上的 `long` 或 `double` 类型的值更为简单；验证器将它们视为栈上的单个值。例如，`dadd`\
  \ 码（加两个 `double` 值）的验证代码检查栈顶部的两个项目是否都是 `double` 类型。在计算操作数栈长度时，`long` 和 `double`\
  \ 类型的值长度为二。\n\n操作操作数栈的无类型指令必须将 `long` 和 `double` 类型的值视为原子的（不可拆分的）。例如，如果栈顶的值是 `double`\
  \ 且遇到 `pop` 或 `dup` 等指令，验证器将报告失败。此时必须使用 `pop2` 或 `dup2` 指令。\n\n### 4.10.2.4 实例化方法和新创建的对象\n\
  \n创建一个新类实例是一个多步过程。语句：\n\n```\n...\nnew myClass(i, j, k);\n...\n```\n\n可以通过以下方式实现：\n\
  \n```\nnew #1             // 为 myClass 分配初始化空间\ndup                 // 复制对象\niload_1\
  \             // 加载 i\niload_2             // 加载 j\niload_3             // 加载 k\n\
  invokespecial #5    // 调用 myClass.<init>\n```\n\n该指令序列将新创建并初始化的对象留在操作数栈顶部。（更多示例见\
  \ §3。）\n\n`myClass` 类的实例化方法将新的未初始化对象作为其 `this` 参数位于局部变量 0 中。在该方法对 `this` 调用 `myClass`\
  \ 或其直接父类的另一个实例化初始化方法之前，该方法对 `this` 可以执行的操作仅限于 `myClass` 中定义的字段。\n\n在对实例方法进行数据流分析时，验证器将局部变量\
  \ 0 初始化为包含当前类的对象；或者对于实例化方法，局部变量 0 包含一个指示未初始化对象的特殊类型。在对该对象调用（从当前类或其直接父类）相应的实例化方法后，验证器操作数栈模型和局部变量数组中的所有特殊类型出现将被替换为当前类类型。验证器拒绝在初始化之前使用新对象或多次初始化该对象的代码。此外，它确保方法的每个正常返回都调用了方法所在类或其直接父类的实例化方法。\n\
  \n\n\n\n\n指令数需要作为特殊类型的一部分进行存储，因为操作数栈上可能同时存在多个尚未初始化的类实例。例如，实现以下代码的 Java 虚拟机指令序列：\n\
  \n点击此处查看代码图像\n\n```\nnew InputStream(new Foo(), new InputStream(\"foo\"))\n```\n\
  \n操作数栈上可能同时存在两个未初始化的 `InputStream` 实例。当在某个类实例上调用实例初始化方法时，只有操作数栈或局部变量数组中与该类实例为相同对象的特殊类型出现情况会被替换。\n\
  \n### 4.10.2.5 异常与 finally\n\n为了实现 `try`-`finally` 结构，生成版本号为 50.0 或以下 `class` 文件的\
  \ Java 编程语言编译器可以使用异常处理机制结合两个特殊指令：`jsr`（“跳转到子程序”）和 `ret`（“从子程序返回”）。`finally` 子句被编译为该方法\
  \ Java 虚拟机代码中的一个子程序，这类似于异常处理程序的代码。当执行调用该子程序的 `jsr` 指令时，它会将返回地址（即正在执行的 `jsr` 指令之后的指令的地址）作为\
  \ `returnAddress` 类型的值推入操作数栈。子程序的代码将返回地址存储在局部变量中。在子程序结束时，`ret` 指令从局部变量中获取返回地址，并将控制转移到返回地址处的指令。\n\
  \n控制权可以通过几种不同的方式转移到 `finally` 子句（调用 `finally` 子程序）。如果 `try` 子句正常完成，则在评估下一个表达式之前，通过\
  \ `jsr` 指令调用 `finally` 子程序。如果 `try` 子句内部的 `break` 或 `continue` 将控制权转移到 `try` 子句外部，则先执行\
  \ `jsr` 到 `finally` 子句的代码。如果 `try` 子句执行了 `return`，编译后的代码将执行以下操作：\n\n1. 将返回值（如果有）保存在局部变量中。\n\
  2. 执行 `jsr` 到 `finally` 子句的代码。\n3. 从 `finally` 子句返回后，返回局部变量中保存的值。\n\n编译器设置了一个特殊的异常处理器，用于捕获\
  \ `try` 子句抛出的任何异常。如果 `try` 子句中抛出异常，该异常处理器将执行以下操作：\n\n1. 将异常保存在局部变量中。\n2. 执行 `jsr`\
  \ 到 `finally` 子句。\n3. 从 `finally` 子句返回后，重新抛出异常。\n\n有关 `try`-`finally` 结构实现的更多信息，请参阅\
  \ §3.13。\n\n`finally` 子句的代码给验证器带来了一个特殊问题。通常，如果可以通过多路径到达特定的指令，并且特定的局部变量通过这些多路径包含不兼容的值，则该局部变量将不可用。然而，`finally`\
  \ 子句可能从多个不同的地方调用，产生几种不同的情况：\n\n- 来自异常处理器的调用可能包含包含异常的某个局部变量。\n- 实现 `return` 的调用可能包含包含返回值的局部变量。\n\
  - 来自 `try` 子句底部的调用可能在该局部变量中包含一个不确定值。\n\n`finally` 子句的代码本身可以通过验证，但在完成对 `ret` 指令的所有后继指令的更新后，验证器会注意到异常处理器期望持有异常的局部变量，或返回代码期望持有返回值的局部变量，现在包含了一个不确定值。\n\
  \n验证包含 `finally` 子句的代码是复杂的。其基本思想如下：\n\n- 每条指令都会跟踪到达该指令所需的 `jsr` 目标列表。对于大多数代码，此列表是空的。对于\
  \ `finally` 子句代码内部的指令，其长度为 1。对于多层嵌套的 `finally` 代码（极罕见！），长度可能大于 1。\n- 对于每条指令以及到达该指令所需的每个\
  \ `jsr`，都会维护一个自执行 `jsr` 指令以来已访问或修改的所有局部变量的位向量。\n- 在执行实现子程序返回的 `ret` 指令时，必须只有一个可能的指令返回的子程序。两个不同的子程序不能将其执行“合并”到单一的\
  \ `ret` 指令。\n- 对 `ret` 指令进行数据流分析时，使用一种特殊过程。由于验证器知道指令必须返回的子程序，它可以找到所有调用该子程序的 `jsr`\
  \ 指令，并将 `ret` 指令执行时的操作数栈和局部变量数组的状态合并到 `jsr` 指令后续指令的操作数栈和局部变量数组中。合并时对局部变量使用一组特殊值：\n\
  \    - 对于位向量（上述构建）指示子程序已访问或修改的任何局部变量，使用 `ret` 执行时局部变量的类型。\n    - 对于其他局部变量，使用 `jsr`\
  \ 指令之前的局部变量类型。\n\n### 4.11 Java 虚拟机的局限性\n\nJava 虚拟机的以下限制隐含在 `class` 文件格式中：\n\n-\
  \ 每个类或每个接口的常量池受 `ClassFile` 的 16 位 `constant_pool_count` 字段限制为 65535 个条目。这相当于单个类总复杂性的内部限制。\n\
  - 类或接口可以声明的字段数量受 `ClassFile` 中 `fields_count` 项的大小限制为 65535 个（§4.1）。注意，`ClassFile`\
  \ 结构中 `fields_count` 项的值不包括继承自超类或超接口的字段。\n- 类或接口可以声明的方法数量受 `ClassFile` 中 `methods_count`\
  \ 项的大小限制为 65535 个（§4.1）。注意，`ClassFile` 结构中 `methods_count` 项的值不包括继承自超类或超接口的方法。\n\
  - 类或接口的直接超接口数量受 `ClassFile` 中 `interfaces_count` 项的大小限制为 65535 个（§4.1）。\n- 方法调用时创建的帧中局部变量数组的最大局部变量数量（§2.6）受提供方法代码的\
  \ `Code` 属性中 `max_locals` 项的大小（§4.7.3）以及 Java 虚拟机指令集中 16 位局部变量索引的限制为 65535。注意 `long`\
  \ 和 `double` 类型的值各被视为保留两个局部变量，并对 `max_locals` 值贡献两个单位，因此使用这些类型的局部变量会进一步减少这一限制。\n\
  - 帧中操作数栈的大小（§2.6）受 `Code` 属性中 `max_stack` 字段（§4.7.3）限制为 65535 个值。注意 `long` 和 `double`\
  \ 类型的值各被视为对 `max_stack` 值贡献两个单位，因此在操作数栈上使用这些类型的值会进一步减少这一限制。\n\n\n\n\n\n-   根据方法描述符的定义（§4.3.3)），方法参数的数量限制为\
  \ 255 个。对于实例方法或接口方法调用，该限制包含一个 `this` 单位。\n\n请注意，方法描述符是基于方法参数长度的概念定义的，其中 `long` 或\
  \ `double` 类型的参数对长度贡献两个单位，因此这些类型的参数会进一步减少限制额。\n\n-   字段名和方法名、字段和方法描述符，以及其他常量字符串值（包括由\
  \ `ConstantValue` 属性引用的值（§4.7.2)））长度受 `CONSTANT_Utf8_info` 结构中 16 位无符号 `length`\
  \ 项限制为 65535 个字符（§4.4.7)）。\n\n请注意，限制的是编码中的字节数而不是编码后的字符数。UTF-8 使用两个或三个字节编码某些字符。因此，包含多字节字符的字符串会受到进一步限制。\n\
  \n-   数组的维度受 `multianewarray` 指令中 `dimensions` 操作码的大小限制为 255 个，并受到 `multianewarray`、`anewarray`\
  \ 和 `newarray` 指令的约束（§4.9.1, §4.9.2)）。\n\n## 第 5 章加载、链接和初始化\n\nJava 虚拟机动态地加载、链接并初始化类和接口。加载是找到具有特定名称的类或接口类型的二进制表示，并根据该二进制表示创建类或接口的过程。链接是取一个类或接口并将其结合\
  \ Java 虚拟机的运行时状态中以便执行的过程。类或接口的初始化包括执行类或接口初始化方法 `<clinit>`（§2.9)）。\n\n在本章中，§5.1 描述了\
  \ Java 虚拟机如何从类或接口的二进制表示推导出符号引用。§5.2 解释了 Java 虚拟机如何启动加载、链接和初始化过程。§5.3 规定了类加载器如何加载类和接口的二进制表示，以及类和接口是如何创建的。链接在\
  \ §5.4 中描述。§5.5 详细说明了类和接口是如何初始化的。§5.6 引入了绑定本地方法的概念。最后，§5.7 描述了 Java 虚拟机退出的情况。\n\n\
  ### 5.1 运行时常量池\n\nJava 虚拟机维护一个每个类型对应的常量池（§2.5.5)），这是一个运行时数据结构，充当传统编程语言实现中符号表的许多功能。\n\
  \n类或接口的二进制表示中的 `constant_pool` 表（§4.4)用于在创建类或接口时构建运行时常量池（§5.3)）。运行时常量池中的所有引用最初都是符号的。运行时常量池中的符号引用如下所示从类或接口二进制表示中的结构推导出来：\n\
  \n-   对类或接口的符号引用推导自类或接口二进制表示中的 `CONSTANT_Class_info` 结构（§4.4.1)）。此类引用以 `Class.getName`\
  \ 方法返回的形式给出类或接口的名称，即：\n\n    -   对于非数组类或接口，名称是该类或接口的二进制名（§4.2.1)）。\n\n    -   对于\
  \ *n* 维数组类，名称以 *n* 个 ASCII 字符 `` 开头，随后是元素类型的表示：\n\n        -   如果元素类型是原始类型，则由相应的字段描述符表示（§[4.3.2)）。\n\
  \        -   否则，如果元素类型是引用类型，则用 ASCII 字符 `L` 跟上元素类型的二进制名（§4.2.1)），最后跟上 ASCII 字符 `;`。\n\
  \n每当本章提到类或接口的名称时，应理解为 `Class.getName` 方法返回的形式。\n\n-   对类或接口字段的符号引用推导自类或接口二进制表示中的\
  \ `CONSTANT_Fieldref_info` 结构（§4.4.2)）。此类引用给出字段的名称和描述符，以及该字段所在类或接口的符号引用。\n\n-  \
  \ 对类方法的符号引用推导自类二进制表示中的 `CONSTANT_Methodref_info` 结构（§4.4.2)）。此类引用给出方法的名称和描述符，以及该方法所在类的符号引用。\n\
  \n-   对接口方法的符号引用推导自接口二进制表示中的 `CONSTANT_InterfaceMethodref_info` 结构（§4.4.2)）。此类引用给出接口方法的名称和描述符，以及该方法所在接口的符号引用。\n\
  \n-   对方法句柄的符号引用推导自类或接口二进制表示中的 `CONSTANT_MethodHandle_info` 结构（§4.4.8)）。此类引用给出字段、类方法或接口方法的符号引用，取决于方法句柄的。\n\
  \n-   对方法类型的符号引用推导自类二进制表示中的 `CONSTANT_MethodType_info` 结构（§4.4.9)）。此类引用给出方法描述符（§4.3.3)）。\n\
  \n-   对*调用点说明符*的符号引用推导自类或接口二进制表示中的 `CONSTANT_InvokeDynamic_info` 结构（§4.4.10)）。此类引用给出：\n\
  \n    -   方法句柄的符号引用，将作为 `invokedynamic` 指令的引导方法（§06a.html_ch06lev2sec8));\n    -\
  \   一组符号引用（指向类、方法类型和方法句柄）、字符串字面量以及运行时常量，将作为方法的*静态参数*；\n    -   方法名称和描述符。\n\n此外，某些不是符号引用的运行时值推导自\
  \ `constant_pool` 表中的项：\n\n-   字符串字面量是 `String` 类实例的引用，推导自类或接口二进制表示中的 `CONSTANT_String_info`\
  \ 结构（§4.4.3)）。`CONSTANT_String_info` 结构给出构成字面量的 Unicode 代码点序列。\n\nJava 编程语言要求相同的字符串字面量（即包含相同代码点的字面量）必须引用同一个\
  \ `String` 类实例（JLS §3.10.5）。此外，如果对任何字符串调用 `String.intern` 方法，结果将是该字符串作为字面量出现时返回的同一个类实例。因此，以下表达式的值必须为\
  \ `true`：\n\n```java\n(\"a\" + \"b\" + \"c\").intern() == \"abc\"\n```\n\n\n\n\n\
  要推导出字符串字面量，Java 虚拟机会检查由 `CONSTANT_String_info` 结构提供的 Unicode 代码点序列。\n\n- 如果之前在某个\
  \ `String` 类实例上调用过 `String.intern` 方法，且该实例包含的 Unicode 代码点序列与 `由 `CONSTANT_String_info`\
  \ 结构提供的序列完全相同，则字符串字面量推导的结果是指向该相同 `String` 类实例的引用（`reference`）。\n\n- 否则，将创建一个新的 `String`\
  \ 类实例，其中包含由 `CONSTANT_String_info` 结构提供的 Unicode 代码点序列；该类实例的引用（`reference`）即为字符串字面量推导的结果。最后，调用新\
  \ `String` 实例的 `intern` 方法。\n\n- 运行时常量值是从类或接口的二进制表示中的 `CONSTANT_Integer_info`、`CONSTANT_Float_info`、`CONSTANT_Long_info`\
  \ 或 `CONSTANT_Double_info` 结构推导出的（§4.4.4, §4.4.5）。\n\n注意，`CONSTANT_Float_info` 结构表示\
  \ IEEE 754 单精度格式的值，`CONSTANT_Double_info` 结构表示 IEEE 754 双精度格式的值（§4.4.4, §4.4.5）。因此，从这些结构推导出的运行时常量值必须是用\
  \ IEEE 754 单、双精度格式表示的值。\n\n类或接口二进制表示中 `constant_pool` 表中的剩余结构——`CONSTANT_NameAndType_info`\
  \ 和 `CONSTANT_Utf8_info` 结构（§4.4.6, §4.4.7）仅在推导指向类、接口、方法、字段、方法类型和方法句柄的符号引用，以及推导字符串字面量和调用点指定符时才被间接使用。\n\
  \n### 5.2 Java 虚拟机启动\n\nJava 虚拟机通过创建一个初始类来启动，该类以依赖实现的方式指定，并使用启动类加载器（§5.3.1）。随后，Java\
  \ 虚拟机链接初始类、对其进行初始化，并调用 `public` 类方法 `void main(String[])`。该方法的调用驱动了所有后续执行。执行构成 `main`\
  \ 方法的 Java 虚拟机指令可能会导致链接（并因此创建）额外的类和接口，以及调用额外的方法。\n\n在 Java 虚拟机的实现中，初始类可以作为命令行参数提供。或者，实现可以提供一个初始类，该类设置一个类加载器，再由该加载器加载应用程序。只要与上段给出的规范一致，存在其他初始类的选择。\n\
  \n### 5.3 创建与加载\n\n由名称 N 表示的类或接口 C 的创建，包括在 Java 虚拟机的方法区域中（§2.5.4）构建 C 的特定实现的内部表示。类或接口的创建由另一个类或接口\
  \ D 触发，D 通过其运行时常量池引用 C。\n\n类或接口的创建也可能由 D 调用某些 Java SE 平台类库（§2.12）（如反射）而触发。\n\n如果\
  \ C 不是数组类，则通过使用类加载器加载 C 的二进制表示（§4（`class File Format`](#ch04.html_ch04)））来创建。数组类没有外部二进制表示；它们是由\
  \ Java 虚拟机而非类加载器创建的。\n\n类加载器有两种：由 Java 虚拟机提供的启动类加载器和用户自定义类加载器。每个用户自定义类加载器都是抽象类 `ClassLoader`\
  \ 的子类的实例。应用程序使用用户自定义类加载器是为了扩展 Java 虚拟机动态加载并创建类的方式。用户自定义类加载器可以用于创建源自用户定义的类。例如，类可以跨网络下载、动态生成，或从加密文件中提取。\n\
  \n类加载器 L 可以通过直接定义 C 或委托给另一个类加载器来创建 C。如果 L 直接创建 C，我们说 L *定义*（defines） C，或者等价地说 L\
  \ 是 C 的 *定义加载器*（defining loader）。\n\n当一个类加载器委托给另一个类加载器时，启动加载的加载器不一定是完成加载并定义类的加载器。如果\
  \ L 通过直接定义或委托创建了 C，我们说 L 启动了 C 的加载，或者等价地说 L 是 C 的 *启动加载器*（initiating loader）。\n\n\
  在运行时，类或接口的确定不仅取决于其名称，还取决于一对组合：其二进制名称（§4.2.1）和其定义类加载器。每一个这样的类或接口都属于一个唯一的*运行时包*（run-time\
  \ package）。类或接口的运行时包由其包名和定义类加载器决定。\n\nJava 虚拟机使用三种程序之一来创建表示为 N 的类或接口：\n\n- 如果 N\
  \ 表示非数组类或接口，则使用以下方法之一加载并创建 C：\n    - 如果 D 是启动类加载器定义的，则由启动类加载器加载 C (§5.3.1)。\n  \
  \  - 如果 D 是用户自定义类加载器定义的，则由该用户自定义类加载器加载 C (§5.3.2)。\n- 否则 N 表示数组类。数组类是由 Java 虚拟机直接创建的\
  \ (§5.3.3)，而非类加载器。然而，创建数组 C 的过程中使用了 D 的定义加载器。\n\n如果在类加载期间发生错误，必须在直接或间接使用该类的程序点抛出\
  \ `LinkageError` 子类的实例。\n\n如果 Java 虚拟机在验证（§5.4.1）或解析（§5.4.3）期间（但不包括初始化 (§5.5)）尝试启动\
  \ C 加载的类加载器抛出了 `ClassNotFoundException` 实例，则 Java 虚拟机必须抛出一个以该 `ClassNotFoundException`\
  \ 实例为原因的 `NoClassFoundError` 实例。\n\n（这里的微妙之处在于，加载父类的递归类加载是在解析（§5.3.5）步骤 3 中执行的）。因此，由于类加载器无法加载父类而导致的\
  \ `ClassNotFoundException` 必须封装在 `NoClassFoundError` 中。）\n\n良好的类加载器应维持三个属性：\n\n\
  给 给相同的名称，良好的类加载器始终返回相同的 `Class` 对象。\n- 如果类加载器 L[1] 将加载委托给另一个加载器 L[2]，那么对于任何作为 C\
  \ 的直接父类或直接父接口，或作为 C 的字段类型，或作为 C 中方法或构造函数的形式参数类型，或作为 C 中方法的返回类型的 T，L[1] 和 L[2] 应该返回相同的\
  \ `Class` 对象。\n- 如果用户自定义类加载器预取了类和接口的二进制表示，或一起加载一组相关的类，那么它必须在程序中如果没有预取或分组加载本可能出现加载错误的地方反映加载错误。\n\
  \n\n\n\n我们有时会使用符号 `<N, L[d]>` 来表示类或接口，其中 `N` 表示类或接口名称，而 `L[d]` 表示该类或接口的定义加载器。\n\n\
  我们还会使用符号 `N^Li` 来表示类或接口，其中 `N` 表示类或接口名称，而 `L[i]` 表示该类或接口的启动加载器。\n\n### 5.3.1 使用启动类加载器进行加载\n\
  \n使用以下步骤用于使用启动类加载器来加载并从而创建由 `N` 表示的非数组类或接口 `C`。\n\n首先，Java 虚拟机确定启动类加载器是否已记录为由 `N`\
  \ 表示的类或接口的启动加载器。如果是，则该类或接口即为 `C`，无需创建类。\n\n否则，Java 虚拟机将参数 `N` 传递给启动类加载器上的某个方法调用，以依赖于平台的方式搜索\
  \ `C` 的假设表示。通常，类或接口将使用分层文件系统中的一个文件来表示，类或接口的名称将编码在文件的路径中。\n\n注意，无法保证找到的假设表示是有效的，或者它是\
  \ `C` 的表示。加载的此阶段必须检测到以下错误：\n\n• 如果没有找到 `C` 的假设表示，加载将抛出一个 `ClassNotFoundException`\
  \ 。\n\n然后，Java 虚拟机尝试使用 §5.3.5 中的算法，通过启动类加载器从假设表示推导出由 `N` 表示的类。该类即为 `C`。\n\n### 5.3.2\
  \ 使用自定义类加载器进行加载\n\n使用以下步骤用于使用自定义类加载器 `L` 来加载并从而创建由 `N` 表示的非数组类或接口 `C`。\n\n首先，Java\
  \ 虚拟机确定 `L` 是否已记录为由 `N` 表示的类或接口的启动加载器。如果是，则该类或接口即为 `C`，无需创建类。\n\n否则，Java 虚拟机在 `L`\
  \ 上调用 `loadClass(N)`。调用的返回值是创建的类或接口 `C`。然后，Java 虚拟机记录 `L` 是 `C` 的启动加载器（§5.3.4）。本节的其余部分详细描述了这一过程。\n\
  \n当类加载器 `L` 的 `loadClass` 方法传入待加载类 `C` 的名称 `N` 时，`L` 必须执行以下两个操作之一来加载 `C`：\n\n1.\
  \ 加载器 `L` 可以创建一个表示 `C` 的字节数组，其作为 `ClassFile` 结构的字节（§4.1）；然后它必须调用 `ClassLoader` 类的\
  \ `defineClass` 方法。调用 `defineClass` 会导致 Java 虚拟机使用 §5.3.5 中的算法，通过 `L` 从字节数组推导出由\
  \ `N` 表示的类或接口。\n\n2. 加载器 `L`可以将 `C` 的加载委托给其他类加载器 `L’`。这通过直接或间接地将参数 `N` 传递给 `L’`\
  \ 的方法调用（通常是 `loadClass` 方法）来实现。调用的结果是 `C`。\n\n在 (1) 或 (2) 任何情况下，如果加载器 `L` 因任何原因无法加载由\
  \ `N` 表示的类或接口，它必须抛出一个 `ClassNotFoundException` 。\n\n自 JDK 1.1 版本发布以来，Oracle 的 Java\
  \ 虚拟机实现通过调用类加载器的 `loadClass` 方法来促使其加载类或接口。`loadClass` 的参数是待加载的类或接口的名称。`loadClass`\
  \ 方法还有一个双参数的版本，其中第二个参数是一个 `boolean` 类型，用于指示该类或接口是否需要链接。JDK 1.0.2 版本中仅提供了双参数版本的 `loadClass`\
  \ 方法，Oracle 的 Java 虚拟机实现依赖它来链接已加载的类或接口。从 JDK 1.1 版本开始，Oracle 的 Java 虚拟机实现直接链接类或接口，不再依赖于类加载器。\n\
  \n### 5.3.3 创建数组类\n\n使用以下步骤使用类加载器 `L` 创建由 `N` 表示的数组类 `C`。类加载器 `L` 可以是启动类加载器，也可以是自定义类加载器。\n\
  \n如果 `L` 已记录为与 `N` 具有相同组件类型的数组类的启动加载器，则该类即为 `C`，无需创建数组类。\n\n否则，执行以下步骤创建 `C`：\n\n\
  1. 如果组件类型是 `reference` 类型，则递归地使用本节的算法（§5.3）通过加载器 `L` 来加载并从而创建 `C` 的组件类型。\n\n2. Java\
  \ 虚拟机创建一个具有指定组件类型和维度数量的新数组类。\n\n如果组件类型是 `reference` 类型，则将 `C` 标记为由组件类型的定义加载器定义。否则，将\
  \ `C` 标记为由启动类加载器定义。\n\n在任何情况下，Java 虚拟机随后记录 `L` 是 `C` 的启动加载器（§5.3.4）。\n\n如果组件类型是\
  \ `reference` 类型，则数组类的可访问性由其组件类型的可访问性决定。否则，数组类的可访问性为 `public`。\n\n### 5.3.4 加载约束\n\
  \n在存在类加载器的情况下确保类型安全的链接需要特殊的 care。当不同的类加载器启动对某个类的加载时，名称 `N` 在每个情况下可能表示不同的类。\n\n当类或接口\
  \ `C = <N[1], L[1]>` 对另一个类或接口 `D = <N[2], L[2]>` 的字段或方法发出符号引用时，该符号引用包含一个指定字段或方法返回类型的描述符。在字段或方法描述符中提到的任何类型名称在被\
  \ L1 和 L2 加载时必须表示相同的类或接口，这一点是至关重要的。\n\n为了确保这一点，Java 虚拟机在准备阶段（§5.4.2）和解析阶段（§5.4.3）实施形式为\
  \ `N^(L[1]) = N^(L[2])` 的 *加载约束*。\n\n\n\n\n\n- 存在一个加载器 `L'`，使得 `L'` 被 Java 虚拟机记录为名为\
  \ `N` 的类 `C'` 的初始化加载器。\n- 由所施加约束集（其传递闭包）定义的等价关系意味着 `N^L = N^(L')`。\n- `C ≠ C'`。\n\
  \n关于类加载器和类型安全的充分讨论超出了本规范的范围。若需进行更全面的讨论，请读者参考 Sheng Liang 和 Gilad Bracha 编写的 *Dynamic\
  \ Class Loading in the Java Virtual Machine*（*Proceedings of the 1998 ACM SIGPLAN\
  \ Conference on Object-Oriented Programming Systems, Languages and Applications*）。\n\
  \n### 5.3.5 从类文件表示派生类\n\n以下步骤用于从 `class` 文件格式的假设表示中，使用加载器 `L` 为表示为 `N` 的非数组类或接口\
  \ `C` 导出 `Class` 对象。\n\n**1.** 首先，Java 虚拟机确定是否已经记录 `L` 是表示为 `N` 的类或接口的初始化加载器。如果是，则此创建尝试是无效的，加载将抛出\
  \ `LinkageError`。\n\n**2.** 否则，Java 虚拟机尝试解析该假设表示。然而，该假设表示实际上可能并不是 `C` 的有效表示。\n\n\
  加载的此阶段必须检测以下错误：\n\n- 如果假设表示不是 `ClassFile` 结构（§4.1, §4.8），加载将抛出一个 `ClassFormatError`\
  \ 实例。\n- 否则，如果假设表示不是不支持的主版本或次版本（§4.1），加载将抛出一个 `UnsupportedClassVersionError` 实例。\n\
  \n`UnsupportedClassVersionError` 是 `ClassFormatError` 的子类，其引入是为了能够轻松识别由于尝试加载表示使用不支持的\
  \ `class` 文件格式版本的类而导致的 `ClassFormatError`。在 JDK 1.1 及更早版本中，当遇到不支持的版本时，取决于该类是由系统类加载器还是用户定义的类加载器加载的，会抛出\
  \ `NoClassDefFoundError` 或 `ClassFormatError` 实例。\n\n- 否则，如果假设表示实际上没有表示名为 `N` 的类，加载将抛出一个\
  \ `NoClassDefFoundError` 实例或其子类之一的实例。\n\n**3.** 如果 `C` 有直接父类，从 `C` 到其直接父类的符号引用将使用\
  \ §5.4.3.1 中的算法进行解析。注意，如果 `C` 是一个接口，它必须以 `Object` 作为其直接父类，且该类必须已经加载。只有 `Object`\
  \ 没有直接父类。\n\n由于类或接口解析而可能抛出的任何异常都可以作为加载此阶段的结果抛出。此外，加载的此阶段必须检测以下错误：\n\n- 如果命名为 `C`\
  \ 直接父类的类或接口实际上是一个接口，加载将抛出 `IncompatibleClassChangeError`。\n- 否则，如果 `C` 的任何父类是 `C`\
  \ 本身，加载将抛出 `ClassCircularityError`。\n\n**4.** 如果 `C` 有任何直接超接口，则从 `C` 到其直接超接口的符号引用将使用\
  \ §5.4.3.1 中的算法进行解析。\n\n由于类或接口解析而可能抛出的任何异常都可以作为加载此阶段的结果抛出。此外，加载的此阶段必须检测以下错误：\n\n\
  - 如果命名为 `C` 直接超接口的任何类或接口实际上不是接口，加载将抛出 `IncompatibleClassChangeError`。\n- 否则，如果 `C`\
  \ 的任何超接口是 `C` 本身，加载将抛出 `ClassCircularityError`。\n\n**5.** Java 虚拟机标记 `C` 的定义类加载器为\
  \ `L`，并记录 `L` 是 `C` 的初始化加载器（§5.3.4）。\n\n### 5.4 链接\n\n类或接口的链接涉及验证并准备该类或接口、其直接父类、其直接超接口以及元素类型（如果是数组类型，则需要）。类或接口中符号引用的解析是链接的可选部分。\n\
  \n本规范允许在链接活动（由于递归原因包括加载）发生的时间上具有实现灵活性，只要维护了以下所有属性：\n\n- 类或接口在链接之前已完全加载。\n- 类或接口在初始化之前已完全验证并准备就。\n\
  - 链接期间检测到的错误将在程序的某个点抛出，该点程序采取的某些操作可能直接或间接地需要对涉及错误的错误的类或接口进行链接。\n\n例如，Java 虚拟机实现可能会选择在每个类或接口被使用时单独解析其中的每个符号引用（“懒性”或“延迟”解析），或者在验证该类时一次性解析所有引用（“激进的”或“静态”解析）。这意味着在某些实现中，在类或接口初始化后解析过程可能继续。无论遵循哪种策略，在解析期间检测到的任何错误都必须在程序使用（直接或间接）指向该类或接口的符号引用时抛出。\n\
  \n由于链接涉及新数据结构的分配，它可能会因 `OutOfMemoryError` 失败。\n\n#### 5.4.1 验证\n\n*验证*（§4）确保类或接口的二进制表示在结构上是正确的（§4.1）。验证可能会导致额外的类和接口被加载（§5.3），但不需要导致它们被验证或准备。\n\
  \n如果类或接口的二进制表示不满足 §4.9 中的静态约束，则在导致该类或接口被验证的地方抛出 `VerifyError`。\n\n如果 Java 虚拟机验证类或接口的尝试因为抛出了\
  \ `LinkageError` 的子类而失败，则后续对该类或接口的验证尝试始终以相同的错误失败。\n\n#### 5.4.2 准备\n\n*准备*涉及为类或接口创建静态字段并将其初始化为默认值（§2.3,\
  \ §2.4）。这不需要执行任何虚拟机代码；静态字段的显式初始化器是在初始化（§5.5](#ch05.html_ch05lev1sec5)）部分执行的。\n\n\
  在准备类或接口 `C` 期间，Java 虚拟机还会施加加载约束（§5.3.4）。令 `L[1]` 为 `C` 的定义加载器。对于 `C` 中声明的每个重写（overrides，§5.4.5）父类或超接口\
  \ `<D, L[2]>` 中声明的方法，Java 虚拟机施加以下加载约束：\n\n假设方法 `m` 的返回类型为 `T[r]`，其形式参数类型为 `T[f1]`,\
  \ ..., `T[fn]`，那么：\n\n如果 `T[r]` 不是数组类型，令 `T[0]` 为 `T[r]`；否则，令 `T[0]` 为 `T[r]` 的元素类型（§2.4）。\n\
  \n对于 *i* = 1 到 *n*：如果 `T[fi]` 不是数组类型，令 `T[i]` 为 `T[fi]`；否则，令 `T[i]` 为 `T[fi]` 的元素类型（§2.4）。\n\
  \n则对于 *i* = 0 到 *n*，`T[i]^(L[1]) = T[i]^(L[2])`。\n\n此外，如果 `C` 实现其超接口 `<I, L[3]>`\
  \ 中声明的方法 `m`，但 `C` 本身没有声明该方法 `m`，则令 `<D, L[2]>` 为 `C` 继承的声明方法 `m` 实现的父类。Java 虚拟机施加以下约束：\n\
  \n\n\n\n假设 `m` 的返回类型为 `T[r]`，且 `m` 的形式参数类型为 `T[f1]`, ..., `T[fn]`，则：\n\n如果 `T[r]`\
  \ 不是数组类型，令 `T[0]` 为 `T[r]`；否则，令 `T[0]` 为 `T[r]` 的元素类型 (§2.4)。\n\n对于 `i` = 1 到 `n`：如果\
  \ `T[fi]` 不是数组类型，令 `T[i]` 为 `T[fi]`；否则，令 `T[i]` 为 `T[fi]` 的元素类型 (§2.4)。\n\n那么对于\
  \ `i` = 0 到 `n`，有 `T[i]^(L[2]) = T[i]^(L[3])`。\n\n准备工作可以在创建后的任何时间发生，但必须在初始化之前完成。\n\
  \n### 5.4.3 解析 (Resolution)\n\nJava 虚拟机指令 `anewarray`、`checkcast`、`getfield`、`getstatic`、`instanceof`、`invokedynamic`、`invokeinterface`、`invokespecial`、`invokestatic`、`invokevirtual`、`ldc`、`ldc_w`、`multianewarray`、`new`、`putfield`\
  \ 和 `putstatic` 对运行时常量池进行符号引用。执行这些任何一个指令都需要对其符号引用进行解析。\n\n`解析`是从运行时常量池中的符号引用中动态确定具体值的过程。\n\
  \n某一次 `invokedynamic` 指令的符号引用解析*并不*意味着任何其他 `invokedynamic` 指令的相同符号引用也被视为已解析。\n\n\
  对于上述所有其他指令，某一次指令的符号引用解析*确实*意味着任何其他非*invokedynamic* 指令的相同符号引用都被视为已解析。\n\n（上述文本意味着，为特定\
  \ `invokedynamic` 指令通过解析确的具体值是一个绑定到该特定 `invokedynamic` 指令的调用点对象（call site object）。）\n\
  \n可以对已经解析过的符号引用尝试解析。对一个已经成功解析的符号引用尝试解析总是轻而易举地成功，并且始终与该引用初始解析产生相同的实体。\n\n如果在解析符号引用过程中发生错误，则必须在程序（直接或间接）使用该符号引用的点抛出\
  \ `IncompatibleClassChangeError`（或其子类）实例。\n\n如果 Java 虚拟机解析符号引用的尝试因为抛出了 `LinkageError`（或其子类）实例的错误而失败，则后续解析该引用的尝试总是失败，并返回与初始解析尝试抛出的相同错误。\n\
  \n特定 `invokedynamic` 指令对调用点指定符（call site specifier）的符号引用在执行该指令之前不得进行解析。\n\n在 `invokedynamic`\
  \ 指令解析失败的情况下，在后续的解析尝试中不会重新执行引导方法（bootstrap method）。\n\n上述某些指令在解析符号引用时需要额外的链接检查。例如，为了让\
  \ `getfield` 指令成功解析到其所操作的字段的符号引用，它不仅必须完成 §5.4.3.2 中给出的字段解析步骤，还要检查该字段不是 `static`\
  \ 的。如果它是 `static` 字段，则抛出链接异常。\n\n值得注意的是，为了让 `invokedynamic` 指令成功解析到调用点指定符的符号引用，其中指定的引导方法必须正常完成并返回一个合适的调用点对象。如果引导方法异常完成或返回了不合适的调用点对象，则抛出链接异常。\n\
  \n由针对特定 Java 虚拟机指令执行的特定检查所生成的链接异常在该指令的描述中给出，而不包含在本关于解析的通用讨论中。请注意，此类异常虽然被描述为 Java\
  \ 虚拟机指令执行而非解析，但仍被正确视为解析失败。\n\n以下章节描述了在类或接口 `D` 的运行时常量池 (§5.1) 中解析符号引用的过程。解析的细节取决于要解析的符号引用类型。\n\
  \n#### 5.4.3.1 类和接口解析\n\n要解析从 `D` 到由 `N` 表示的类或接口 `C` 的未解析符号引用，执行以下步骤：\n\n**1.**\
  \ 使用 `D` 的定义类加载器创建一个由 `N` 表示的类或接口。该类或接口即为 `C`。过程的细节见 §5.3。\n\n因此，任何由于类或接口创建失败而可能抛出的异常，都可以由于类和接口解析失败而抛出。\n\
  \n**2.** 如果 `C` 是数组类且其元素类型为 `reference` 类型，则通过递归调用 §5.4.3.1 中的算法来解析指向代表元素类型的类或接口的符号引用。\n\
  \n**3.** 最后，检查对 `C` 的访问权限。\n\n- 如果 `C` 对 `D` 不可访问的 (§5.4.4)，则类或接口解析将抛出 `IllegalAccessError`。这种情况可能会发生，例如\
  \ `C` 原本声明为 `public` 但在编译后改为非 `public`。\n\n如果步骤 1 和 2 成功但步骤 3 失败，`C` 仍然有效且可用。然而，解析失败，禁止\
  \ `D` 访问 `C`。\n\n#### 5.4.3.2 字段解析\n\n要解析从 `D` 到类或接口 `C` 中字段的未解析符号引用，必须首先解析由字段引用给\
  \ `C` 的符号引用 (§5.4.3.1)。因此，由于类解析失败而可能抛出的异常都可以由于字段解析失败而抛出。如果 `C` 的引用解析成功，则抛出与字段引用解析失败相关的异常。\n\
  \n在解析字段引用时，字段解析首先在 `C` 及其父类中查找引用字段：\n\n**1.** 如果 `C` 声明了字段引用指定的名称和描述符，则字段查找成功。该字段为查找的结果。\n\
  \n**2.** 否则，递归地应用于 `C` 的直接超接口。\n\n**3.** 否则，如果 `C` 有父类 `S`，则递归地应用于 `S`。\n\n**4.**\
  \ 否则，字段查找失败。\n\n那么：\n\n- 如果字段查找失败，字段解析抛出 `NoSuchFieldError`。\n- 否则，如果字段查找成功但引用字段对\
  \ `D` 不可访问的 (§5.4.4)，字段解析抛出 `IllegalAccessError`。\n- 否则，令 `<`E, L[1]>` 为实际声明引用字段的类或接口，令\
  \ `L[2]` 为 `D` 的定义加载器。\n\n给定引用字段的类型为 `T[f]`，如果 `T[f]` 不是数组类型，令 `T` 为 `T[f]`；否则，令\
  \ `T` 为 `T[f]` 的元素类型 (§2.4)。\n\nJava 虚拟机必须实施加载约束 `T^L1 = T^L2` (§5.3.4)。\n\n####\
  \ 5.4.3.3 方法解析\n\n要解析从 `D` 到类 `C` 中方法的未解析符号引用，必须首先解析由方法引用给 `C` 的符号引用 (§5.4.3.1)。因此，任何由于类解析失败而可能抛出的异常都可以由于方法解析失败而抛出。如果\
  \ `C` 的引用解析成功，则抛出与方法引用解析失败相关的异常。\n\n在解析方法引用时：\n\n\n\n\n1. 如果 `C` 是一个接口，则方法解析将抛出\
  \ `IncompatibleClassChangeError`。\n\n2. 否则，方法解析尝试在 `C` 及其超类中定位被引用的方法：\n\n- 如果 `C`\
  \ 恰好声明了一个与方法引用指定的名称相同的方法，且该声明是一个签名多态方法（§2.9)），则方法查找成功。描述符中提到的所有类名都将被解析（§5.4.3.1)）。\n\
  解析出的方法为该签名多态方法的声明。`C` 不需要声明一个与方法引用指定的描述符相同的方法。\n\n- 否则，如果 `C` 声明了一个与方法引用指定的名称和描述符相同的方法，则方法查找成功。\n\
  \n- 否则，如果 `C` 有超类，则在 `C` 的直接超类上递归调用方法解析的第 2 。\n\n3. 否则，方法解析尝试在指定类 `C` 的超接口中定位被引用的方法：\n\
  \n- 如果 `C` 对于方法引用指定的名称和描述符的 `最特定超接口方法` 恰好包含一个没有设置 `ACC_ABSTRACT` 标记的方法，则选择该方法并方法查找成功。\n\
  \n- 否则，如果 `C` 的任何超接口都声明了一个与方法引用指定的名称和描述符相同的方法，且该方法既没有设置 `ACC_PRIVATE` 标记，也没有设置 `ACC_STATIC`\
  \ 标记，则从这些任意选择一个并方法查找成功。\n\n- 否则，方法查找失败。\n\n类或接口 `C` 对于特定方法名和描述符的 `最特定超接口方法` 是指任何满足以下所有条件的方法：\n\
  \n- 该方法声明在 `C` 的超接口（直接或间接）中。\n- 该方法使用指定的名称和描述符进行声明。\n- 该方法既没有设置 `ACC_PRIVATE` 标记，也没有设置\
  \ `ACC_STATIC` 标记。\n- 在当该方法声明在接口 `I` 中时，不存在另一个在 `I` 的子接口中声明的、具有相同指定名称和描述符的 `C` 的最特定超接口方法。\n\
  \n方法解析的结果取决于方法查找成功还是失败：\n\n- 如果方法查找失败，方法解析将抛出 `NoSuchMethodError`。\n- 否则，如果方法查找成功且引用的方法对\
  \ `D` 不可访问 (§5.4.4)），方法解析将抛出 `IllegalAccessError`。\n- 否则，让 `<E, L[1]>` 为实际声明引用方法\
  \ `m` 的类或接口，让 `L[2]` 为 `D` 的定义加载器。\n\n假设 `m` 的返回类型为 `T[r]`，且 `m` 的形式参数类型为 `T[f1]`,\
  \ ..., `T[fn]`，那么：\n\n如果 `T[r]` 不是数组类型，让 `T[0]` 为 `T[r]```；否则，让 `T[0]` 为 `T[r]`\
  \ 的元素类型 (§2.4)）。\n\n对于 `i` = 1 到 `n`：如果 `T[fi]` 不是数组类型，让 `T[i]` 为 `T[fi]`；否则，让 `T[i]`\
  \ 为 `T[fi]` 的元素类型 (§2.4)。\n\nJava 虚拟机必须对 `i` = 0 到 `n` 实施加载约束 `T[i]^(L[1]) = T[i]^(L[2])`\
  \ (§5.3.4)。\n\n当解析在类的超接口中搜索方法时，最好的结果是识别出一个最特定的非 `abstract` 方法。该方法可能会被方法选择选中，因此为它添加类加载器约束是理想的。\n\
  \n否则，结果是非确定的。这并不是新现象：*Java^® 虚拟机规范* 过去从未明确指出过究竟选择了哪种方法，以及应该如何打破“平局”。在 Java SE 8\
  \ 之前，这在很大程度上是一个不可观察的区别。然而，从 Java SE 8 开始，接口方法集更具异质性，因此必须注意避免非确定性行为产生的问题。因此：\n\n\
  - `private` 且 `static` 的超接口方法会被解析忽略。这与 Java 语言是一致的，在 Java 语言中，此类接口方法是不继承的。\n- 由解析方法控制的任何行为都不应取决于方法是否为\
  \ `abstract`。\n\n注意，如果解析结果是一个 `abstract` 方法，引用的类 `C` 可以不是 `abstract` 的。要求 `C` 为\
  \ `abstract` 将与超接口方法的非确定选择产生冲突。相反，解析假设被调用对象的运行时具有该方法的具体实现。\n\n##### 5.4.3.4 接口方法解析\n\
  \n要解析从 `D` 到接口 `C` 中接口方法的未解析符号引用，首先要解析接口方法引用给出的 `C` 的符号引用 (§5.4.3.1)。因此，任何由于接口引用解析失败而可能抛出的异常也可以由于接口方法解析失败而抛出。如果\
  \ `C` 的引用可以成功解析，则可以抛出与接口方法引用本身解析相关的异常。\n\n当解析接口方法引用时：\n\n1. 如果 `C` 不是接口，则接口方法解析将抛出\
  \ `IncompatibleClassChangeError`。\n2. 否则，如果 `C` 声明了一个与接口方法引用指定的名称和描述符相同的方法，则方法查找成功。\n\
  3. 否则，如果类 `Object` 声明了一个与接口方法引用指定的名称和描述符相同的方法，且该方法设置了 `ACC_PUBLIC` 标记且没有设置 `ACC_STATIC`\
  \ 标记，则方法查找成功。\n4. 否则，如果 `C` 对于方法引用指定的名称和描述符的最特定超接口方法 (§5.4.3.3) 恰好包含一个没有设置 `ACC_ABSTRACT`\
  \ 标记的方法，则选择该方法并方法查找成功。\n5. 否则，如果 `C` 的任何超接口都声明了一个与方法引用指定的名称和描述符相同的方法，且该方法既没有设置 `ACC_PRIVATE`\
  \ 标记也没有设置 `ACC_STATIC` 标记，则从这些中任意选择一个并方法查找成功。\n6. 否则，方法查找失败。\n\n接口方法的结果取决于方法查找成功还是失败：\n\
  \n- 如果方法查找失败，接口方法解析将抛出 `NoSuchMethodError`。\n- 否则，如果方法查找成功且引用的方法对 `D` 不可访问 (§5.4.4)，接口方法解析将抛出\
  \ `IllegalAccessError`。\n- 否则，让 `<E, L[1]>` 为实际声明接口方法 `m` 的类或接口，让 `L[2]` 为 `D` 的定义加载器。\n\
  \n假设 `m` 的返回类型为 `T[r]`，且 `m` 的形式参数类型为 `T[f1]`, ..., `T[fn]`，那么：\n\n如果 `T[r]` 不是数组类型，让\
  \ `T[0]` 为 `T[r]```；否则，让 `T[0]` 为 `T[r]` 的元素类型 (§2.4)。\n\n对于 `i` = 1 到 `n`：如果 `T[fi]`\
  \ 不是数组类型，让 `T[i]` 为 `T[fi]`；否则，让 `T[i]` 为 `T[fi]` 的元素类型 (§2.4)。\n\nJava 虚拟机必须对 `i`\
  \ = 0 到 `n` 实施加载约束 `T[i]^(L[1]) = T[i]^(L[2])` (§5.3.4)。\n\n关于可访问性的条款是必要的，因为接口方法解析可能会选取接口\
  \ `C` 的 `private` 方法。（在 Java SE 8 之前，接口方法解析的结果可能是类 `Object` 的非 `public` 方法或类 `Object`\
  \ 的 `static` 方法；此类结果与 Java 语言的继承模型不一致，在 Java SE 8 及以上版本中被禁止。）\n\n##### 5.4.3.5 方法类型和方法句柄解析\n\
  \n\n\n\n要解析一个未解析的方法类型符号引用，其过程就相当于对类和接口的未解析符号引用进行解析（§5.4.3.1)），这些引用的名称与方法描述符中给出的类型对应（§4.3.3）。\n\
  \n因此，任何由于类引用解析失败而可能抛出的异常，都可以由于方法类型解析失败而抛出。\n\n方法类型解析成功的结果是一个指向 `java.lang.invoke.MethodType`\
  \ 实例的`reference`（引用），该实例代表了方法描述符。\n\n方法类型解析的发生，取决于运行时常量池是否实际包含方法描述符中指示的类和接口的符号引用。\n\
  \n此外，解析被认为是在`unresolved`（未解析）符号引用上进行的，因此解析一个方法类型的失败并不一定会导致后续解析另一个具有相同文本方法描述符的方法类型失败，只要在之后可以加载合适的类和接口。\n\
  \n对方法句柄（method handle）的未解析符号引用的解析更为复杂。Java 虚拟机解析的每个方法句柄都有一个相应的指令序列，称为其`bytecode\
  \ behavior`（字节码行为），由方法句柄的`kind`指示。九种方法句柄类型的整数值和描述见表 5.4.3.5-A。\n\n![Image](img/348tab01.jpg)\n\
  \n**表 5.4.3.5-A. 方法句柄的字节码行为**\n\n通过指令序列对字段或方法的符号引用由`C.x:T`表示，其中`x`和`T`是字段或方法的名称和描述符（§4.3.2,\
  \ §4.3.3），而`C`是要查找该字段或方法的类或接口。\n\n令`MH`为正在解析的方法句柄的符号引用（§5.1）。那么：\n\n* 令`R`为`MH`中包含的字段或方法的符号引用。（`R`衍生自由`MH`的`CONSTANT_MethodHandle`中的`reference_index`项引用的`CONSTANT_Fieldref`、`CONSTANT_Methodref`或`CONSTANT_InterfaceMethodref`结构。）\n\
  * 令`T`为`R`所引字段的类型，或`R`所引方法的返回类型。令`A*`为`R`所引方法的参数类型序列（可能为空）。（`T`和`A*`衍生自由`R`的`CONSTANT_Fieldref`、`CONSTANT_Methodref`或`CONSTANT_InterfaceMethodref`结构中的`name_and_type_index`项引用的`CONSTANT_NameAndType`结构。）\n\
  \n为了解析`MH`，使用以下三个步骤解析`MH`字节码行为中所有对类、接口、字段和方法的符号引用：\n\n* 第一，解析`R`。\n* 第二，解析过程相当于依次对名称与`A*`中每个类型对应的类和接口，以及与类型`T`对应的未解析符号引用进行解析。\n\
  * 第三，获取一个指向`java.lang.invoke.MethodType`实例的引用，其过程相当于解析一个方法类型的未解析符号引用，该类型包含了`MH`的类型对应的表\
  \ 5.4.3.5-B 所示的方法描述符。\n\n![Image](img/349tab01.jpg)\n\n**表 5.4.3.5-B. 方法句柄的方法描述符**\n\
  \n方法句柄的符号引用相当于包含了解析后的方法句柄最终将拥有的类型符号引用。方法的类型详细结构通过检查表 5.4.3.5-B 来获得。\n\n在每一步中，任何由于类或接口或字段或方法引用解析失败而可能抛出的异常，都可以由于方法句柄解析失败而抛出。\n\
  \n其意图是，解析方法句柄可以在 Java 虚拟机成功解析字节码行为中符号引用的完全相同的情况下完成。特别是对于`private`和`protected`成员的方法句柄可以在相应的普通访问合法的类类中创建。\n\
  \n方法句柄解析成功的结果是一个指向`java.lang.invoke.MethodHandle`实例的`reference`（引用），该实例代表方法句柄`MH`。\n\
  \n该`java.lang.invoke.MethodHandle`实例的类型描述符是上述方法句柄解析第三步产生的`java.lang.invoke.MethodType`实例。\n\
  \n方法句柄的类型描述符确保了在`java.lang.invoke.MethodHandle`上对该句柄进行`invokeExact`的有效调用与字节码行为具有完全相同的栈影响。在有效参数集上调用此方法句柄具有与相应的字节码行为相同的效果，并返回相同的结果（如果有）。\n\
  \n如果`R`所引的方法设置了`ACC_VARARGS`标记（§4.6），则通过`invoke`（JLS §15.12）的`java.lang.invoke.MethodHandle`实例是变长方法句柄；否则它是固定长度方法句柄。\n\
  \n如果`R`所引的方法设置了`ACC_VARARGS`标记，且`A*`为空序列或`A*`中的最后一个参数类型不是数组类型，则方法句柄解析将抛出`IncompatibleClassError`。即变长方法句柄的创建失败。\n\
  \nJava 虚拟机实现不需要对方法类型或方法句柄进行池化。即两个不同的方法类型或方法句柄符号引用可能指向相同的 java.lang.invoke.MethodType`或`java.lang.invoke.MethodHandle`实例。\n\
  \nJava 平台中的`java.lang.invoke.MethodHandles`类允许创建没有字节码行为的方法句柄。它们的行为由创建它们的`java.lang.invoke.MethodHandles`方法定义。例如，一个方法句柄可以对其值进行转换，然后将转换后的值传递给另一个方法句柄的调用，然后对其返回的值进行转换。\n\
  \n##### 5.4.3.6 调用规格符解析\n\n解析未解析的调用点符号引用涉及三个步骤：\n\n* 调用规格符给出一个方法句柄的符号引用，作为动态调用点的*引导方法*（§4.7.23](#ch04.html_ch04lev2sec38)）。解析该方法句柄以获取`java.lang.invoke.MethodHandle`实例的`reference`（§5.4.3.5）。\n\
  * 调用规格符给出一个方法描述符*TD*。通过解析一个与*TD*具有相同参数和返回类型的方法类型符号引用，获取`java.lang.invoke.MethodType`实例的引用（§5.4.3.5）。\n\
  * 调用规格符给出零或多个*静态参数*，用于向引导方法传递应用程序特定的元数据。任何作为类、方法句柄或方法类型的静态参数将被解析，相当于调用*ldc*指令（§*ldc*），以获取`Class`对象、`java.lang.invoke.MethodHandle`对象和`java.lang.invoke.MethodType`对象的引用。任何作为字符串字面量的静态参数都将用于获取`String`对象的引用。\n\
  \n调用规格符解析的结果是一个由以下内容组成的元组：\n\n* `java.lang.invoke.MethodHandle`实例的`reference`（引用），\n\
  \n\n\n\n\n- 对 `java.lang.invoke.MethodType` 实例的 `reference`，\n- 对 `Class`、`java.lang.invoke.MethodHandle`、`java.lang.invoke.MethodType`\
  \ 和 `String` 实例的 `references`。\n\n在解析调用点指定符中方法句柄的符号引用，或在解析调用点指定符中方法描述符的方法类型的符号引用，或解析任何静态参数的符号引用时，可能会抛出任何与方法类型或方法句柄解析相关的异常\
  \ (§5.4.3.5）。\n\n## 5.4.4 访问控制\n\n类或接口 `C` 对类或接口 `D` 是可访问的，当且仅当以下任一条件成立：\n\n- `C`\
  \ 是 `public`。\n- `C` 和 `D` 是同一个运行时包的成员（§5.3）。\n\n字段或方法 `R` 对类或接口 `D` 是可访问的，当且仅当以下任一条件成立：\n\
  \n- `R` 是 `public`。\n- `R` 是 `protected` 且声明在类 `C` 中，并且 `D` 是 `C` 的子类或 `C` 本身。此外，如果\
  \ `R` 不是 `static`，则对 `R` 的符号引用必须包含对类 `T` 的符号引用，其中 `T` 是 `D` 的子类、`D` 的超类或 `D` 本身。\n\
  - `R` 是 `protected` 或具有默认访问权限（即既不是 `public` 也不是 `protected` 或 `private`），并且由与 `D`\
  \ 相同运行时包的类声明。\n- `R` 是 `private` 且声明在 `D` 中。\n\n对访问控制的讨论省略了对 `protected` 字段访问或方法调用的目标的相关限制（目标必须是类\
  \ `D` 或 `D` 的子类型）。该要求是在验证过程的一部分中检查（§4.10.1.8）；它不是链接时访问控制的一部分。\n\n## 5.4.5 重写\n\n\
  在类 `C` 中声明的实例方法 `m[C]` 重写类 `A` 中声明的另一个实例方法 `m[A]`，当且仅当 `m[C]` 与 `m[A]` 相同，或者以下所有条件均成立：\n\
  \n- `C` 是 `A` 的子类。\n- `m[C]` 与 `m[A]` 有相同的名称和描述符。\n- `m[C]` 未标记为 `ACC_PRIVATE`。\n\
  - 以下任一条件成立：\n    - `m[A]` 被标记为 `ACC_PUBLIC`；或被标记为 `ACC_PROTECTED`；或既未标记为 `ACC_PUBLIC`\
  \ 也非 `ACC_PROTECTED` 或 `ACC_PRIVATE`，且 `A` 属于与 `C` 相同的运行时包。\n    - `m[C]` 重写了方法\
  \ `m’（m’ 不同于 `m[C]` 和 `m[A]`），使得 `m’ 重写了 `m[A]`。\n\n## 5.5 初始化\n\n类或接口的*初始化*由执行其类或接口初始化方法组成（§2.9）。\n\
  \n类或接口仅可能作为结果被初始化：\n\n- 执行引用该类或接口的任何 Java 虚拟机指令 `new`、`getstatic`、`putstatic` 或\
  \ `invokestatic`（§**new*，§*getstatic*，§*putstatic*，§*invokestatic*）。所有这些指令都通过字段引用或方法引用直接或间接引引用了该类或接口。\n\
  \n在执行 `new` 指令时，如果引用的类或接口尚未初始化，则对其进行初始化。\n\n在执行 `getstatic`、`putstatic` 或 `invokestatic`\
  \ 指令时，声明解析后的字段或方法的类或接口尚未初始化，则对其进行初始化。\n\n- 第一次调用由 Java 虚拟机解析方法句柄得到的 `java.lang.invoke.MethodHandle`\
  \ 实例（§5.4.3.5），且其种类为 2 (`REF_getStatic`)、4 (`REF_putStatic`)、6 (`REF_invokeStatic`)\
  \ 或 8 (`REF_newInvokeSpecial`)。\n- 调用类库中的某些反射方法（§2.12），例如，在 `Class` 类中或在 `java.lang.reflect`\
  \ 包中。\n- 它的任一子类的初始化。\n- 它在 Java 虚拟机启动时被指定为初始类（§5.2）。\n\n在初始化之前，类或接口必须经过链接，即经过验证、准备，以及可选的解析。\n\
  \n由于 Java 虚拟机是多线程的，类或接口的初始化需要仔细的同步，因为可能其他线程可能试图同时初始化同一个类或接口。还可能作为该类或接口初始化的一部分，递归地请求该类或接口的初始化。Java\
  \ 虚拟机的实现负责通过以下程序处理同步和递归初始化。它假设 `Class` 对象已经经过验证和准备，并且 `Class` 对象包含一个指示四种情况之一的状态：\n\
  \n- 此 `Class` 对象已验证并准备就，但未初始化。\n- 此 `Class` 对象正在被某个特定线程初始化。\n- 此 `Class` 对象已完全初始化并准备好使用。\n\
  - 此 `Class` 对象处于错误状态，可能是因为尝试初始化但失败了。\n\n对于每个类或接口 `C`，有一个唯一的初始化锁 `LC`。从 `C` 到 `LC`\
  \ 的映射由 Java 虚拟机实现决定。例如，`LC` 可以是 `C` 的 `Class` 对象，或者是与该 `Class` 对象相关的监视器。初始化 `C`\
  \ 的程序如下：\n\n**1.** 对 `C` 的初始化锁 `LC` 进行同步。这涉及等待当前线程能够获取 `LC`。\n\n**2.** 如果 `C` 的\
  \ `Class` 对象表示其他线程正在初始化 `C`，则释放 `LC` 并阻塞当前线程，直到通知正在进行的初始化已完成，此时重复此程序。\n\n线程中断状态不受执行初始化程序的影响。\n\
  \n**3.** 如果 `C` 的 `Class` 对象表示当前线程正在初始化 `C`，则这必须是一个递归初始化请求。释放 `LC` 并正常完成。\n\n**4.**\
  \ 如果 `C` 的 `Class` 对象表示 `C` 已初始化，则不需要执行进一步操作。释放 `LC` 并正常完成。\n\n**5.** 如果 `C` 的 `Class`\
  \ 对象处于错误状态，则无法初始化。释放 `LC` 并抛出 `NoClassFoundError`。\n\n**6.** 否则，记录当前线程正在初始化 `C`\
  \ 的 `Class` 对象的实，并释放 `LC`。然后，按照字段在 `ClassFile` 结构中出现的顺序，用其 `ConstantValue` 属性中的常量值（§4.7.2）初始化\
  \ `C` 的每个 `final static` 字段。\n\n**7.** 下，如果 `C` 是类而不是接口，且其超类 `SC` 尚未初始化，则对 `SC`\
  \ 递归执行执行整个程序。如有必要，先验证并准备 `SC`。\n\n如果 `SC` 的初始化因为抛出异常而异常终止，则获取 `LC`，将 `C` 的 `Class`\
  \ 对象标记为错误，通知所有等待线程，释放 `LC` 并异常终止，抛出导致初始化 `SC` 的相同异常。\n\n**8.** 下，通过查询其定义类加载器确定 `C`\
  \ 是否启用了断言。\n\n**9.** 下，执行 `C` 的类或接口初始化方法。\n\n**10.** 如果类或接口初始化方法的执行正常完成，则获取 `LC`，将\
  \ `C` 的 `Class` 对象标记为完全初始化，通知所有等待线程，释放 `LC` 并正常完成此程序。\n\n\n\n\n\n## 11. 否则，类或接口初始化方法必须通过抛出某些异常\
  \ `E` 异常终止。如果 `E` 的类不是 `Error` 或其子类之一，则创建一个 `ExceptionInInitializerError` 类的新实例，并以\
  \ `E` 作为参数，在后续步骤中使用该对象代替 `E`。\n\n如果由于发生 `OutOfMemoryError` 无法创建 `ExceptionInInitializerError`\
  \ 的新实例，则在后续步骤中使用 `OutOfMemoryError` 对象代替 `E`。\n\n## 12. 获取类锁（LC），将类 `C` 的 `Class`\
  \ 对象标记为错误，通知所有等待线程，释放 LC，并根据上一步确定的原因 `E` 或其替换对象异常终止此过程。\n\nJava 虚拟机（JVM）的实现可以优化此过程：当它能够确定类的初始化已经完成时，可以省略第\
  \ 1 步中的锁获取（以及第 4/5 步中的锁释放），前提是：从 Java 内存模型的角度来看，如果获取了锁将会存在的所有 `happens-before` 排序（见\
  \ JLS §17.4.5），在执行优化时仍然存在。\n\n### 5.6 绑定原生方法实现\n\n*绑定*（Binding）是将用非 Java 编程语言编写并实现\
  \ `native` 方法的集成到 Java 虚拟机中以便其执行的过程。尽管这一过程传统上被称为“链接”（linking），但规范中使用“绑定”一词是为了避免与\
  \ Java 虚拟机对类或接口的链接相混淆。\n\n### 5.7 Java 虚拟机退出\n\n当某个线程调用 `Runtime` 类或 `System` 类的\
  \ `exit` 方法，或者调用 `Runtime` 类的 `halt` 方法，且安全管理器允许 `exit` 或 `halt` 操作时，Java 虚拟机退出。\n\
  \n此外，JNI（Java 原生接口）规范描述了当使用 JNI 调度 API 加载和卸载 Java 虚拟机时 Java 虚拟机的终止。\n\n## 第 6 章\
  \ Java 虚拟机指令集\n\nJava 虚拟机指令由一个指定要执行的操作的操作码（opcode）组成，随后是零或多个表示要操作的值的操作数组成。本章详细介绍了每个\
  \ Java 虚拟机指令的格式及其执行的操作。\n\n### 6.1 假设：“必须”的含义\n\n每条指令的描述始终是在满足 §[4]（`class` 文件格式）静态和结构约束的\
  \ Java 虚拟机代码范围内给出的。在单个 Java 虚拟机指令的描述中，我们经常规定某些情况“必须”或“不能”发生：“`value2` 必须是 `int`\
  \ 类型。” §[4]（`class` 文件格式）的约束保证了所有此类预期实际上将得到满足。如果指令描述中的某些约束（一个“必须”或“不能”）在运行时没有被满足，则\
  \ Java 虚拟机的行为是未定义的。\n\nJava 虚拟机在链接时使用 `class` 文件验证器（§4.10）检查 Java 虚拟机代码是否满足静态和结构约束。因此，Java\
  \ 虚拟机将只会尝试执行来自有效 `class` 文件的代码。在链接时进行验证是很有吸引力的，因为检查只需执行一次，大幅减少了运行时必须完成的工作量。其他实现策略也是可行的，只要它们符合《Java\
  \ 语言规范，Java SE 8 版》和《Java 虚拟机规范，Java SE 8 版》。\n\n### 6.2 预留操作码\n\n除了本章后文指定的指令操作码（用于\
  \ `class` 文件 §[4]（`class` 文件格式））外，还有三个操作码预留给 Java 虚拟机实现的内部使用。如果未来扩展 Java 虚拟机指令集，这些预留操作码保证不被使用。\n\
  \n两个预留操作码数字 254 (0xfe) 和 255 (0xff) 分别具有助符 `impdep1` 和 `impdep2`。这些指令旨在为在软件和硬件中分别实现的特定实现功能提供“后门”或陷阱。第三个预留操作码数字\
  \ 202 (0xca) 的助符为 `breakpoint`，用于调试器实现断点。\n\n尽管这些操作码已被预留，但它们只能在 Java 虚拟机实现内部使用。它们不能出现在有效的\
  \ `class` 文件中。调试器或 JIT 代码生成器（§[2.13]）等可能与已加载并执行的 Java 虚拟机代码直接交互的工具可能会遇到这些操作码。此类工具遇到这些预留指令时应尝试优雅处理。\n\
  \n### 6.3 虚拟机错误\n\n当内部错误或资源限制导致 Java 虚拟机无法实现本章描述的语义时，Java 虚拟机实现会抛出一个 `VirtualMachineError`\
  \ 类子类的实例对象。本规范无法预测在何时会遇到内部错误或资源限制，也没有规定具体的何时可以报告。因此，在 Java 虚拟机运行期间，下面定义的任何 `VirtualMachineError`\
  \ 子类都可能在随时被抛出：\n\n- `InternalError`: Java 虚拟机实现内部发生了内部错误，这是因为实现机器的软件故障、底层主机软件故障或硬件故障。此错误在检测到时异步（§[2.10]）传递，并可能发生在程序的任何点。\n\
  - `OutOfMemoryError`: Java 虚拟机实现耗尽虚拟或物理内存，且自动存储管理器无法回收足够的内存来满足对象创建请求。\n- `StackOverflowError`:\
  \ Java 虚拟机实现耗尽线程栈空间，通常是因为执行程序的故障导致了无限数量的递归调用。\n- `UnknownError`: 发生了异常或错误，但 Java\
  \ 虚拟机无法报告实际的异常或错误。\n\n### 6.4 指令描述的格式\n\n本章中的 Java 虚拟机指令以如下所示形式的条目表示，按字母顺序排列，每个条目单独起一页。\n\
  \n#### mnemonic\n\n**Operation**\n\n指令的简短描述\n\n**Format**\n\n![Image](img/360fig01.jpg)\n\
  \n**Forms**\n\n*mnemonic* = opcode\n\n**Operand**\n\n..., *value1*, *value2* →\n\
  \n**Stack**\n\n..., *value3*\n\n**Description**\n\n关于操作数栈内容或常量池项的约束、执行的操作、结果类型等的详细描述。\n\
  \n**Linking Exceptions**\n\n如果执行此指令时可能抛出任何链接异常，它们将按必须抛出的顺序逐行列出。\n\n**Run-time Exceptions**\n\
  \n如果执行指令可以抛出任何运行时异常，它们将按必须抛出的顺序逐行列出。\n\n除了指令列出的链接异常和运行时异常外，该指令不得抛出除 `VirtualMachineError`\
  \ 或其子类实例以外的运行时异常。\n\n**Notes**\n\n不严格属于指令规范的注释将作为描述末尾注释单独列出。\n\n\n\n\n\n指令格式图中的每个单元格代表一个的\
  \ 8 位字节。指令的 `mnemonic`（助记符）是它的名称。它的 `opcode`（操作码）是它的数值表示，以十进制和十六进制形式给出。在 `class`\
  \ 文件的 Java 虚拟机代码中，实际存在的是数值表示。\n\n请记住，编译时会生成并嵌入 Java 虚拟机指令中的“操作数”，同时也存在在运行时计算并提供在操作数栈上的“操作数”。尽管这些操作数源于几个不同的区域，但所有这些操作数都代表相同的内容：即由正在执行的\
  \ Java 虚拟机指令进行操作的值。Java 虚拟机通过隐式地从其操作数栈获取许多操作数，而不是在编译后的代码中将其显式地表示为额外的操作数字节、寄存器编号等，从而保持虚拟机代码的紧凑性。\n\
  \n某些指令作为相关指令簇的成员呈现，这些指令共享单一的描述、格式和操作数栈图。因此，一个族包含多个 `opcodes` 和 `opcode mnemonics`；只有该族的助记符出现在指令格式图中，而单独的\
  \ Forms（形式）行列出了所有成员的助记符和操作码。例如，`lconst_<l>` 族指令的 Forms 行提供了该族中两条指令（`lconst_0` 和\
  \ `lconst_1`）的助记符和操作码信息：\n\n```\nlconst_0 = 9 (0x9)\nlconst_1 = 10 (0xa)\n```\n\n\
  在 Java 虚拟机指令的描述中，指令执行对当前帧（§2.6)）的操作数栈（§2.6.2)的影响以文本表示，栈从左到右增长，每个值单独表示。因此，\n\n```\n\
  ..., value1, value2 ->\n..., result\n```\n\n显示了一种操作，其起始是 `value2` 位于操作数栈顶部，`value1`\
  \ 紧随其后。指令执行后，`value1` 和 `value2` 从操作数栈弹出，并被指令计算出的 `result` 值替换。操作数栈的剩余部分由省略号 (...)\
  \ 表示，不受指令执行的影响。\n\n类型 `long` 和 `double` 的值由操作数栈上的单个条目表示。\n\n在第一版 *The Java® Virtual\
  \ Machine Specification* 中，操作数栈上 `long` 和 `double` 类型的值在栈图中各由两个条目表示的。\n\n## 6.5\
  \ 指令\n\n### aaload\n\n**操作**\n从数组加载 `reference` \n\n**格式**\n![Image](img/363fig01.jpg)\n\
  \n**形式**\n`aaload` = 50 (0x32)\n\n**操作数**\n```\n..., arrayref, index ->\n```\n\n\
  **栈**\n```\n..., value\n```\n\n**描述**\n`arrayref` 必须是 `reference` 类型，且必须引用一个组件类型为\
  \ `reference` 的数组。`index` 必须是 `int` 类型。`arrayref` 和 `index` 均从操作数栈中弹出。获取 `index`\
  \ 处数组组件的 `reference` 值 `value` 并将其推入操作数栈。\n\n**运行时**\n如果 `arrayref` 为 `null`，`aaload`\
  \ 将抛出 `NullPointerException`。\n\n**异常**\n否则，如果 `index` 不在 `arrayref` 引用的数组范围内，`aaload`\
  \ 指令将抛出 `ArrayIndexOutOfBoundsException`。\n\n### aastore\n\n**操作**\n存储到 `reference`\
  \ 数组中\n\n**格式**\n![Image](img/364fig01.jpg)\n\n**形式**\n`aastore` = 83 (0x53)\n\n\
  **操作数**\n```\n..., arrayref, index, value ->\n```\n\n**栈**\n```\n...\n```\n\n**描述**\n\
  `arrayref` 必须是 `reference` 类型，且必须引用一个组件类型为 `reference` 的数组。`index` 必须是 `int` 类型，`value`\
  \ 必须是 `reference` 类型。`arrayref`、`index` 和 `value` 均从操作数栈中弹出。`reference` 值 `value`\
  \ 被存储为 `index` 处的数组组件。\n\n运行时，`value` 的类型必须与 `arrayref` 引用的数组组件类型兼容。具体而言，将引用类型 `S`（源）的值赋值给引用类型\
  \ `T`（目标）的数组组件仅当满足以下条件时：\n\n- 如果 `S` 是类类型，则：\n    - 如果 `T` 是类类型，则 `S` 必须与 `T` 为同一类，或\
  \ `S` 必须是 `T` 的子类；\n    - 如果 `T` 是接口类型，则 `S` 必须实现接口 `T`。\n- 如果 `S` 是接口类型，则：\n  \
  \  - 如果 `T` 是类类型，则 `T` 必须是 `Object`。\n    - 如果 `T` 是接口类型，则 `T` 必须是 `S` 相同的接口或 `S`\
  \ 的超接口。\n- 如果 `S` 是数组类型，即类型 `SC[]`（即类型为 `SC` 组件的数组）：\n    - 如果 `T` 是类类型，则 `T` 必须是\
  \ `Object`。\n    - 如果 `T` 是接口类型，则 `T` 必须是其中接口之一。\n\n### aconst_null\n\n**操作**\n\
  推入 `null`\n\n**格式**\n![Image](img/365fig01.jpg)\n\n**形式**\n`aconst_null` = 1 (0x1)\n\
  \n**操作数**\n```\n... ->\n```\n\n**栈**\n```\n..., null\n```\n\n**描述**\n将 `null` `reference`\
  \ 推入操作数栈。\n\n**注意**\nJava 虚拟机不强制 `null` 的具体值。\n\n### aload\n\n**操作**\n从局部变量加载 `reference`\n\
  \n**格式**\n![Image](img/367fig01.jpg)\n\n**形式**\n`aload` = 25 (0x19)\n\n**操作数**\n\
  ```\n... ->\n```\n\n**栈**\n```\n..., objectref\n```\n\n**描述**\n`index` 是当前帧（§2.6)）局部变量数组的索引。`index`\
  \ 处的局部变量必须包含 `reference`。`index` 处的局部变量 `objectref` 被推入操作数栈。\n\n**注意**\n`aload`\
  \ 指令无法从局部变量加载 `returnAddress` 类型的值到操作数栈。这与 `astore` 指令是不对称的。`aload` 指令可以结合 `wide`\
  \ 指令（wide)）使用双字节索引访问局部变量。\n\n### aload_<n>\n\n**操作**\n从局部变量加载 `reference`\n\n**格式**\n\
  ![Image](img/368fig01.jpg)\n\n**形式**\n`aload_0` = 42 (0x2a)\n`aload_1` = 43 (0x2b)\n\
  `aload_2` = 44 (0x2c)\n`aload_3` = 45 (0x2d)\n\n**操作数**\n```\n... ->\n```\n\n**栈**\n\
  ```\n..., objectref\n```\n\n**描述**\n`<n>` 是当前帧（§2.6)）局部变量数组的索引。`<n>` 处的局部变量必须包含\
  \ `reference`。`<n>` 处的局部变量 `objectref` 被推入操作数栈。\n\n**注意**\n每个 `aload_<n>` 指令等同于索引为\
  \ `<n>` 的 `aload`，只是操作数 `<n>` 是隐式的。\n\n### anewarray\n\n**操作**\n创建 `reference` 数组\n\
  \n**格式**\n![Image](img/369fig01.jpg)\n\n**形式**\n`anewarray` = 189 (0xbd)\n\n**操作数**\n\
  ```\n..., count ->\n```\n\n**栈**\n```\n..., arrayref\n```\n\n**描述**\n\n\n\n\n\n\
  `count` 必须是 `int` 类型。它从操作数栈中弹出。`count` 表示要创建的数组的组件数量。无符号字节 `indexbyte1` 和 `indexbyte2`\
  \ 用于构造指向当前类运行时常量池的索引（见 §2.6)），其中索引的值为 `(indexbyte1 << 8) | indexbyte2`。该索引处的运行时常量池项必须是指向类、数组或接口类型的符号引用。该命名的类、数组或接口类型将进行解析（见\
  \ §5.4.3.1)）。从垃圾回收堆中分配一个长度为 `count` 且组件为该类型的新数组，并将指向此新数组对象的 `reference` 引用 `arrayref`\
  \ 压入操作数栈上。新数组的所有组件都将初始化为 `null`，这是 `reference` 类型的默认值（见 §2.4)）。\n\n## 链接异常 (Linking\
  \ Exceptions)\n\n在解析指向类、数组或接口类型的符号引用期间，可能会抛出 §5.4.3.1 档记录的任何异常。\n\n## 运行时异常 (Run-time\
  \ Exceptions)\n\n否则，如果 `count` 小于 0，`anewarray` 指令将抛出 `NegativeArraySizeException`。\n\
  \n## 注意事项 (Notes)\n\n`anewarray` 指令用于创建一个单维的对象引用数组，或作为多维数组的一部分。\n\n### areturn\n\
  \n### 操作 (Operation)\n从方法返回 `reference`\n\n### 格式 (Format)\n![Image](img/370fig01.jpg)\n\
  \n### 形式 (Forms)\n`areturn` = 176 (0xb0)\n\n### 操作数 (Operand)\n..., `objectref`\
  \ →\n\n### 栈 (Stack)\n[empty]\n\n### 描述 (Description)\n`objectref` 必须是 `reference`\
  \ 类型，并且必须指向一个类型与当前方法的返回描述符（见 §4.3.3)）赋值兼容的对象（JLS §5.2）。如果当前方法是 `synchronized` 方法，则在调用该方法时进入或重新进入的监视器将被更新，并可能像当前线程执行了\
  \ `monitorexit` 指令（monitorexit）一样退出。如果没有抛出异常，`objectref` 从当前帧的操作数栈（见 §2.6)）弹出并压入调用者帧的操作数栈中。当前方法操作数栈上的任何其他值都会被丢弃。\n\
  \n解释器随后恢复调用者的帧，并将控制权交回调用者。\n\n### 运行时异常 (Run-time Exceptions)\n如果 Java 虚拟机实现没有强制\
  \ §2.11.10 中描述的结构化锁规则，那么如果当前方法是 `synchronized` 方法且当前线程不是调用该方法时进入或重新进入的监视器的所有者，则\
  \ `areturn` 抛出 `IllegalMonitorStateException`。这种情况可能会发生，例如当一个 `synchronized` 方法包含\
  \ `monitorexit` 指令，但在该方法进行同步的对象上没有 `monitorenter` 指令。\n\n否则，如果 Java 虚拟机实现强制执行 §2.11.10\
  \ 中描述的结构化锁规则，且在调用当前方法期间违反了这些规则中的第一条，则 `areturn` 抛出 `IllegalMonitorStateException`。\n\
  \n### arraylength\n\n### 操作 (Operation)\n获取数组长度\n\n### 格式 (Format)\n![Image](img/371fig01.jpg)\n\
  \n### 形式 (Forms)\n`arraylength` = 190 (0xbe)\n\n### 操作数 (Operand)\n..., `arrayref`\
  \ →\n\n### 栈 (Stack)\n..., `length`\n\n### 描述 (Description)\n`arrayref` 必须是 `reference`\
  \ 类型并且指向一个数组。它从操作数栈中弹出。确定其所引数组的 `length`。该 `length` 作为 `int` 压入操作数栈。\n\n### 运行时异常\
  \ (Run-time Exceptions)\n如果 `arrayref` 为 `null`，`arraylength` 指令抛出 `NullPointerException`。\n\
  \n### astore\n\n### 操作 (Operation)\n将 `reference` 存储局部变量\n\n### 格式 (Format)\n![Image](img/372fig01.jpg)\n\
  \n### 形式 (Forms)\n`astore` = 58 (0x3a)\n\n### 操作数 (Operand)\n..., `objectref` →\n\
  \n### 栈 (Stack)\n...\n\n### 描述 (Description)\n`index` 是一个无符号字节，必须是当前帧局部变量数组的索引（见\
  \ §2.6)）。操作数栈顶部的 `objectref` 必须是 `returnAddress` 类型或 `reference` 类型。它从操作数栈中弹出，并将\
  \ `index` 处的局部变量的值设置为 `objectref`。\n\n### 注意事项 (Notes)\n在实现 Java 编程语言的 `finally`\
  \ 子句时（见 §3.13)），`astore` 指令与 `returnAddress` 类型的 `objectref` 使用。\n\n`aload` 指令（aload)）不能从局部变量加载\
  \ `returnAddress` 类型的值到操作数栈。这种与 `astore` 指令的不对称性是有故意的。\n\n`astore` 操作码可以配合 `wide`\
  \ 指令（wide)）使用双字节索引访问局部变量。\n\n## astore_<n>\n\n### 操作 (Operation)\n将 `reference`\
  \ 存储到局部变量\n\n### 格式 (Format)\n![Image](img/373fig01.jpg)\n\n### 形式 (Forms)\n`astore_0`\
  \ = 75 (0x4b)\n`astore_1` = 76 (0x4c)\n`astore_2` = 77 (0x4d)\n`astore_3` = 78 (0x4e)\n\
  \n### 操作数 (Operand)\n..., `objectref` →\n\n### 栈 (Stack)\n...\n\n### 描述 (Description)\n\
  `<n*>` 必须是局部变量数组的索引（见 §2.6)）。操作数栈顶部的 `objectref` 必须是 `returnAddress` 类型或 `reference`\
  \ 类型。它从操作数栈中弹出，并将 `<n*>` 处的局部变量的值设置为 `objectref`。\n\n### 注意事项 (Notes)\n在实现 Java\
  \ 编程语言的 `finally` 子句时（见 §3.13)），`astore_<n>` 指令与 `returnAddress` 类型的 `objectref`\
  \ 使用。\n\n`aload_<n>` 指令（aload<n`)）不能从局部变量加载值到操作数栈。这种与 `astore` 指令的不对称性是有故意的。\n\n\
  每个 `astore_<n>` 指令与 `astore` 指令相同，只是操作 `<n*>` 是隐式的。\n\n### athrow\n\n### 操作 (Operation)\n\
  抛出异常或错误\n\n### 格式 (Format)\n![Image](img/374fig01.jpg)\n\n### 形式 (Forms)\n`athrow`\
  \ = 191 (0xbf)\n\n### 操作数 (Operand)\n..., `objectref` →\n\n### 栈 (Stack)\n`objectref`\n\
  \n### 描述 (Description)\n`objectref` 必须是 `reference` 类型，并且指向一个 `Throwable` 类或其子类的实例。它从操作数栈中弹出。然后，通过搜索当前方法（见\
  \ §2.6)）寻找匹配 `objectref` 类的第一个异常处理器来抛出该异常，见 §2.10 中的算法。\n\n如果找到了匹配 `objectref` 的异常处理器，它包含了旨在处理此异常的代码位置。`pc`\
  \ 寄存器重置为该位置，清除当前帧的操作数栈，并将 `objectref` 压回操作数栈，继续执行。\n\n如果在当前帧中未找到匹配的异常处理器，该帧被弹出。如果当前帧代表对\
  \ `synchronized` 方法的调用，则调用该方法时进入或重新进入的监视器将被退出，就好像执行了 `monitorexit` 指令一样。最后，如果存在调用者的帧，则恢复它并重新抛出\
  \ `objectref`。如果不存在此类帧，则当前线程退出。\n\n### 运行时异常 (Run-time Exceptions)\n如果 `objectref`\
  \ 为 `null`，`athrow` 将抛出 `NullPointerException` 而不是 `objectref`。\n\n\n\n\n否则，如果 Java\
  \ 虚拟机实现没有强制执行 §2.11.10 中描述的结构化锁规则，那么如果当前帧的方法是 `synchronized` 方法，且当前线程不是调用该方法时进入或重入的监视器所有者，则\
  \ `athrow` 将抛出 `IllegalMonitorStateException`，而不是之前抛出的对象。这种情况可能会发生，例如，一个异常完成的 `synchronized`\
  \ 方法包含一个 `monitorexit` 指令，但在该方法所同步的对象上没有 `monitorenter` 指令。\n\n否则，如果 Java 虚拟机实现强制执行\
  \ §2.11.10 中描述的结构化锁规则，并且在调用当前方法期间违反了这些规则中的第一条，则 `athrow` 将抛出 `IllegalMonitorStateException`，而不是之前抛出的对象。\n\
  \n## Notes\n\n`athrow` 指令的操作数栈图可能具有误导性：如果在当前方法中匹配到该异常的处理器，`athrow` 指令会丢弃操作数栈上的所有值，然后将抛出的对象推入操作数栈。然而，如果当前方法中没有匹配到处理器且异常在方法调用链的更上抛出，则处理该异常的方法（如果有）的操作数栈将被清空，并且\
  \ `objectref` 被推入该空操作数栈中。从抛出异常的方法到处理该异常的方法（但不包括该方法）之间的所有中间帧都会被丢弃。\n\n### baload\n\
  \n### Operation\n从数组加载 `byte` 或 `boolean`\n\n### Format\n![Image](img/376fig01.jpg)\n\
  \n### Forms\n`baload` = 51 (0x33)\n\n### Operand\n..., `arrayref`, `index` →\n\n\
  ### Stack\n..., `value`\n\n### Description\n`arrayref` 必须是 `reference` 类型，且必须引用一个分元素类型为\
  \ `byte` 类型或 `boolean` 类型的数组。`index` 必须是 `int` 类型。`arrayref` 和 `index` 都会从操作数栈中弹出。获取数组中\
  \ `index` 处分元素的 `byte` `value`，将其符号位扩展为 `int` `value`，然后推入操作数栈顶部。\n\n### Run-time\n\
  如果 `arrayref` 为 `null`，`baload` 将抛出 `NullPointerException`。\n\n### Exceptions\n\
  否则，如果 `index` 不在 `arrayref` 所用的数组范围内，`baload` 指令将抛出 `ArrayIndexOutOfBoundsException`。\n\
  \n### Notes\n`baload` 指令用于从 `byte` 和 `boolean` 数组加载值。在 Oracle Java 虚拟机实现中，`boolean`\
  \ 数组——即类型为 `T_BOOLEAN` 的数组（§2.2, §`newarray`）——被实现为 8 位值的数组。其他实现可能实现压缩的 `boolean`\
  \ 数组；必须使用此类实现的 `baload` 指令来访问这些数组。\n\n### bastore\n\n### Operation\n存储到 `byte` 或\
  \ `boolean` 数组\n\n### Format\n![Image](img/377fig01.jpg)\n\n### Forms\n`bastore`\
  \ = 84 (0x54)\n\n### Operand\n..., `arrayref`, `index`, `value` →\n\n### Stack\n\
  ...\n\n### Description\n`arrayref` 必须是 `reference` 类型，且必须引用一个分元素类型为 `byte` 类型或 `boolean`\
  \ 类型的数组。`index` 和 `value` 必须都是 `int` 类型。`arrayref`、`index` 和 `value` 都会从操作数栈中弹出。`int`\
  \ `value` 被截断为 `byte` 并存储为由 `index` 索引的数组元素。\n\n### Run-time\n如果 `arrayref` 为 `null`，`bastore`\
  \ 将抛出 `NullPointerException`。\n\n### Exceptions\n否则，如果 `index` 不在 `arrayref` 所用的数组范围内，`bastore`\
  \ 指令将抛出 `ArrayIndexOutOfBoundsException`。\n\n### Notes\n`bastore` 指令用于将值存储到 `byte`\
  \ 和 `boolean` 数组中。在 Oracle Java 虚拟机实现中，`boolean` 数组——即类型为 `T_BOOLEAN` 的数组（§2.2,\
  \ §`newarray`）——被实现为 8 位值的数组。`bastore` 指令必须能够将 `boolean` 值存储到 `byte` 数组中。\n\n###\
  \ bipush\n\n### Operation\n推送 `byte`\n\n### Format\n![Image](img/378fig01.jpg)\n\
  \n### Forms\n`bipush` = 16 (0x10)\n\n### Operand\n...\n\n### Stack\n..., `value`\n\
  \n### Description\n立即数 `byte` 被符号位扩展为 `int` `value`。将该 `value` 推入操作数栈。\n\n### caload\n\
  \n### Operation\n从数组加载 `char`\n\n### Format\n![Image](img/379fig01.jpg)\n\n### Forms\n\
  `caload` = 52 (0x34)\n\n### Operand\n..., `arrayref`, `index` →\n\n### Stack\n...,\
  \ `value`\n\n### Description\n`arrayref` 必须是 `reference` 类型，且必须引用一个分元素类型为 `char`\
  \ 的数组。`index` 必须是 `int` 类型。`arrayref` 和 `index` 都会从操作数栈中弹出。获取数组中 `index` 处分元素的 `char`，将其符号扩展为\
  \ `int` `value`，然后推入操作数栈。\n\n### Run-time\n如果 `arrayref` 为 `null`，`caload` 将抛出 `NullPointerException`。\n\
  \n### Exceptions\n否则，如果 `index` 不在 `arrayref` 所用的数组范围内，`caload` 指令将抛出 `ArrayIndexOutOfBoundsException`。\n\
  \n### castore\n\n### Operation\n存储到 `char` 数组\n\n### Format\n![Image](img/380fig01.jpg)\n\
  \n### Forms\n`castore` = 85 (0x55)\n\n### Operand\n..., `arrayref`, `index`, `value`\
  \ →\n\n### Stack\n...\n\n### Description\n`arrayref` 必须是 `reference` 类型，且必须引用一个分元素类型为\
  \ `char` 的数组。`index` 和 `value` 必须都是 `int` 类型。`arrayref`、`index` 和 `value` 都会从操作数栈中弹出。`int`\
  \ `value` 被截断为 `char` 并存储为由 `index` 索引的数组元素。\n\n### Run-time\n如果 `arrayref` 为 `null`，`castore`\
  \ 将抛出 `NullPointerException`。\n\n### Exceptions\n否则，如果 `index` 不在 `arrayref` 所用的数组范围内，`castore`\
  \ 指令将抛出 `ArrayIndexOutOfBoundsException`。\n\n### checkcast\n\n### Operation\n检查对象是否为给定类型\n\
  \n### Format\n![Image](img/381fig01.jpg)\n\n### Forms\n`checkcast` = 192 (0xc0)\n\
  \n### Operand\n..., `objectref` →\n\n### Stack\n..., `objectref`\n\n### Description\n\
  `objectref` 必须是 `reference` 类型。符号 `indexbyte1` 和 `indexbyte2` 用于构造当前类（2.6）常量池的索引，其值为\
  \ (*indexbyte1* << 8) | *indexbyte2*。该索引对应的常量池项必须是类、数组或接口的符号引用。\n\n如果 *objectref*\
  \ 为 `null`，则操作数栈保持不变。\n\n否则，解析命名的类、数组或接口（5.4.3.1）。如果 *objectref* 可以转换为解析出的类、数组或接口，操作数栈保持不变；否则，*checkcast*\
  \ 指令抛出 `ClassCastException`。\n\n以下规则用于确定非 `null` 的 *objectref* 是否可以转换为解析类型：如果 S\
  \ 是 *objectref* 所引用对象的类，而 T 是解析出的类、数组或接口类型，*checkcast* 如下确定 *objectref* 是否可以转换为类型\
  \ T：\n\n- 如果 S 是普通（非数组）类，那么：\n- 如果 T 是类类型，则 S 必须是 T 相同的类，或者 S 是是 T 的子类；\n- 如果 T\
  \ 是接口类型，则 S 必须实现接口 T。\n\n- 如果 S 是接口类型，那么：\n- 如果 T 是类类型，则 T 必须是 `Object`。\n- 如果 T\
  \ 是接口类型，则 T 必须是 S 相同的接口或 S 的超接口。\n\n\n\n\n- 如果 `S` 是一个表示数组类型 `SC[]` 的类，即一个类型为 `SC`\
  \ 的组件数组，那么：\n  - 如果 `T` 是一个类类型，则 `T` 必须是 `Object`。\n  - 如果 `T` 是一个接口类型，则 `T` 必须是数组所实现的接口之一（JLS\
  \ §4.10.3）。\n  - 如果 `T` 是一个数组类型 `TC[]`，即一个类型为 `TC` 的组件数组，那么必须满足以下条件之一：\n    - `TC`\
  \ 和 `SC` 是相同的原始类型类型。\n    - `TC` 和 `SC` 是引用类型，且通过递归应用这些规则，类型 `SC` 可以强制转换为 `TC`。\n\
  \n### 链接异常（Linking Exceptions）\n在解析指向类、数组或接口类型的符号引用期间，可能会抛出节 §5.4.3.1 中记录的任何异常。\n\
  \n### 运行时异常\n否则，如果 `objectref` 无法强制转换为已解析的类、数组或接口类型，则 `checkcast` 指令抛出 `ClassCastException`。\n\
  \n### 备注\n`checkcast` 指令与 `instanceof` 指令非常相似（节*instanceof）。它们的区别在于对 `null` 的处理、测试失败时的行为（`checkcast`\
  \ 抛出异常，`instanceof` 推入结果码）以及对操作数栈的影响。\n\n### d2f\n#### 操作\n将 `double` 转换为 `float`\n\
  \n#### 格式\n![Image](img/383fig01.jpg)\n\n#### 形式\n`d2f` = 144 (0x90)\n\n#### 操作数\n\
  ..., `value` →\n\n#### 栈\n..., `result`\n\n#### 描述\n操作数栈顶的 `value` 必须是 `double`\
  \ 类型。它从栈弹出并经过值集转换 (§2.8.3) 得到 `value’`。然后，使用 IEEE 754 最近舍入模式将 `value’` 转换为 `float`\
  \ 结果。`result` 被推入操作数栈。\n\n当 `d2f` 指令是 FP 严格的（§2.8.2）时，转换结果始终舍入到 float 值集中最接近的可表示值（§2.3.2）。\n\
  \n当 `d2f` 指令不是 FP 严格的时，转换结果可能取自 float 扩展指数值集（§2.3.2）；它不一定会被舍入到 float 值集中最接近的可表示值。\n\
  \n太小而无法表示为 `float` 的有限 `value’` 被转换为相同符号的零；太大而无法表示为 `float` 的有限 `value’` 被转换为相同符号的无穷大。`double`\
  \  NaN 被转换为 `float` NaN。\n\n#### 备注\n`d2f` 指令执行收窄原始转换（JLS §5.1.3）。它可能会丢失 `value’`\
  \ 的整体幅值信息，并可能丢失精度。\n\n### d2i\n#### 操作\n将 `double` 转换为 `int`\n\n#### 格式\n![Image](img/384fig01.jpg)\n\
  \n#### 形式\n`d2i` = 142 (0x8e)\n\n#### 操作数\n..., `value` →\n\n#### 栈\n..., `result`\n\
  \n#### 描述\n操作数栈顶的 `value` 必须是 `double` 类型。它从栈弹出并经过值集转换 (§2.8.3) 得到 `value’`。然后将\
  \ `value’` 转换为 `int`。结果被推入操作数栈：\n- 如果 `value’` 是 NaN，转换结果 `result` 为 `int` 0。\n\
  - 否则，如果 `value’` 不是无穷大，它使用 IEEE 754 向零舍入模式转换为整数值 `V`。如果该整数值 `V` 可以表示为 `int`，则结果为\
  \ `int` 值 `V`。\n- 否则，要么 `value’` 太小（大幅值的负值或负无穷大），`result` 为 `int` 类型的最小表示值；要么 `value’`\
  \ 太大（大幅值的正值或正无穷大），`result` 为 `int` 类型的最大可表示值。\n\n#### 备注\n`d2i` 指令执行收窄原始转换（JLS §5.1.3）。它可能会丢失\
  \ `value’` 的整体幅值信息，并可能丢失精度。\n\n### d2l\n#### 操作\n将 `double` 转换为 `long`\n\n#### 格式\n\
  ![Image](img/385fig01.jpg)\n\n#### 形式\n`d2l` = 143 (0x8f)\n\n#### 操作数\n..., `value`\
  \ →\n\n#### 栈\n..., `result`\n\n#### 描述\n操作数栈顶的 `value` 必须是 `double` 类型。它从栈弹出并经过值集转换\
  \ (§2.8.3) 得到 `value’`。然后将 `value’` 转换为 `long`。结果被推入操作数栈：\n- 如果 `value’` 是 NaN，转换结果为\
  \ `long` 0。\n- 否则，如果 `value’` 不是无穷大，它使用 IEEE 754 向零舍入模式转换为整数值 `V`。如果该整数值 `V` 可以表示为\
  \ `long`，则结果为 `long` 值 `V`。\n- 否则，要么 `value’` 太小（大幅值的负值或负无穷大），`result` 为 `long`\
  \ 类型的最小表示值；要么 `value’` 太大（大幅值的正值或正无穷大），`result` 为 `long` 类型的最大可表示值。\n\n#### 备注\n\
  `d2l` 指令执行收窄原始转换（JLS §5.1.3）。它可能会丢失 `value’` 的整体幅值信息，并可能丢失精度。\n\n### dadd\n####\
  \ 操作\n加两个 `double`\n\n#### 格式\n![Image](img/386fig01.jpg)\n\n#### 形式\n`dadd` = 99\
  \ (0x63)\n\n#### 操作数\n..., `value1`, `value2` →\n\n#### 栈\n..., `result`\n\n####\
  \ 描述\n`value1` 和 `value2` 必须是 `double` 类型。它们从栈弹出并经过值集转换 (§2.8.3) 得到 `value’` 和 `value2’`。`double`\
  \  `result` 为 `value’ + value2’`。`result` 被推入操作数栈。\n\n`dadd` 指令的结果遵循 IEEE 算术规则：\n\
  - 如果 `value’` 或 `value2’` 是 NaN，结果为 NaN。\n- 符号相反的两个无穷之值为 NaN。\n- 符号相同的两个无穷值为该符号的无穷大。\n\
  - 无穷大与有限值的和等于无穷大。\n- 符号相反的两个零为正零。\n- 符号相同的两个零为该符号的零。\n- 零与非零值的和等于非零值。\n- 幅值相同符号相反的两个非零有限值为正零。\n\
  - 在剩余情况下（即两个操作数都不是无穷大、零或 NaN，且符号相同或幅值不同），计算和并使用 IEEE 754 最近舍入模式舍入到最近的可表示值。如果幅值太大无法表示为\
  \ `double`，则认为操作溢出；结果为相应符号的无穷大。如果幅值太小无法表示为 `double`，则认为操作下溢；结果为相应符号的零。\n\nJava 虚拟机支持\
  \ IEEE 754 定义的渐进下溢。尽管可能会溢出、下溢或精度丢失，`dadd` 指令的执行从不会抛出运行时异常。\n\n### daload\n#### 操作\n\
  从数组加载 `double`\n\n#### 格式\n![Image](img/388fig01.jpg)\n\n#### 形式\n`daload` = 49\
  \ (0x31)\n\n#### 操作数\n..., `arrayref`, `index` →\n\n#### 栈\n..., `value`\n\n####\
  \ 描述\n`arrayref` 必须是 `reference` 类型并指向一个组件类型为 `double` 的数组。`index` 必须是 `int` 类型。`arrayref`\
  \ 和 `index` 从栈弹出。数组中 `index` 处的组件的 `double` 值被获取并推入操作数栈。\n\n#### 运行时\n如果 `arrayref`\
  \ 为 `null`，`daload` 抛出 `NullPointerException`。\n\n#### 异常\n\n\n\n\n否则，如果 `index`\
  \ 不在 `arrayref` 所引数组的范围内，`daload` 指令将抛出 `ArrayIndexOutOfBoundsException`。\n\n###\
  \ dastore\n\n**操作**\n存储到 `double` 数组\n\n**格式**\n![Image](img/389fig01.jpg)\n\n**形式**\n\
  `dastore` = 82 (0x52)\n\n**操作数**\n..., `arrayref`, `index`, `value` →\n\n**栈**\n\
  ...\n\n**描述**\n`arrayref` 必须是 `reference` 类型，并且必须指向一个组件类型为 `double` 的数组。`index`\
  \ 必须是 `int` 类型，value 必须是 `double` 类型。`arrayref`、`index` 和 `value` 从操作数栈中弹出。`double`\
  \ 类型 `value` 经过值集转换 (§2.8.3)），得到 `value`’，其被存储为由 `index` 索引的数组组件。\n\n**运行时**\n如果\
  \ `arrayref` 为 `null`，`dastore` 将抛出 `NullPointerException`。\n\n**异常**\n否则，如果 `index`\
  \ 不在 `arrayref` 所引数组的范围内，`dastore` 指令将抛出 `ArrayIndexOutOfBoundsException`。\n\n##\
  \ dcmp<op>\n\n**操作**\n比较 `double`\n\n**格式**\n![Image](img/390fig01.jpg)\n\n**形式**\n\
  `dcmpg` = 152 (0x98)\n`dcmpl` = 151 (0x97)\n\n**操作数**\n..., `value1`, `value2` →\n\
  \n**栈**\n..., `result`\n\n**描述**\n`value1` 和 `value2` 必须是 `double` 类型。这两个值从操作数栈中弹出并经过值集转换\
  \ (§2.8.3)，得到 `value1`’ 和 `value2`’。执行浮点数比较：\n\n- 如果 `value1`’ 大于 `value2`’，则将 `int`\
  \ 值 1 推入操作数栈。\n- 否则，如果 `value1`’ 等于 `value2`’，则将 `int` 值 0 推入操作数栈。\n- 否则，如果 `value1`’\
  \ 小于 `value2`’，则将 `int` 值 -1 推入操作数栈。\n- 否则，`value1`’ 或 `value2`’ 中至少有一个为 NaN。`dcmpg`\
  \ 指令将 `int` 值 1 推入操作数栈，而 `dcmpl` 指令将 `int` 值 -1 推入操作数栈。\n\n浮点数比较根据 IEEE 754 标准进行。除\
  \ NaN 以外的所有所有值都是有序的，负无穷小于所有有限值，正无穷大于所有有限值。正零和负零被视为相等。\n\n**注释**\n`dcmpg` 和 `dcmpl`\
  \ 指令的区别仅在于对涉及 NaN 比较的处理。NaN 是无序的，因此如果一个或两个操作数为 NaN，任何 `double` 比较都会失败。由于同时存在 `dcmpg`\
  \ 和 `dcmpl`，任何 `double` 比较都可以被编译为将相同的 `result` 推入操作数栈，无论比较是在非 NaN 值上失败，还是因为遇到 NaN\
  \ 而失败。更多信息，请参阅 §3.5。\n\n## dconst_<d>\n\n**操作**\n推入 `double`\n\n**格式**\n![Image](img/392fig01.jpg)\n\
  \n**形式**\n`dconst_0` = 14 (0xe)\n`dconst_1` = 15 (0xf)\n\n**操作数**\n... →\n\n**栈**\n\
  ..., `<d*>`\n\n**描述**\n将 `double` 常量 `<d*>` (0.0 或 1.0) 推入操作数栈。\n\n### ddiv\n\n\
  **操作**\n除法 `double`\n\n**格式**\n![Image](img/393fig01.jpg)\n\n**形式**\n`ddiv` = 111\
