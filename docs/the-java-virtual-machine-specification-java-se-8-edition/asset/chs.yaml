  复制操作数栈顶部的值并向下插入两个值\n\n**格式**\n![Image](img/407fig01.jpg)\n\n**形式**\n`dup_x1` = 90\
  \ (0x5a)\n\n**操作数**\n..., `value2`, `value1` →\n\n**栈**\n..., `value1`, `value2`,\
  \ `value1`\n\n**描述**\n复制操作数栈顶部的值，并将复制的值插入到操作数栈向下两个值的位置。\n\n除非 `value1` 和 `value2`\
  \ 都是第 1 类计算类型的值（§2.11.1)），否则不能使用 `dup_x1` 指令。\n\n## dup_x2\n\n**操作**\n复制操作数栈顶部的值并向下插入两个或三个值\n\
  \n**格式**\n![Image](img/408fig01.jpg)\n\n**形式**\n`dup_x2` = 91 (0x5b)\n\n**操作数**\n\
  形式 1：\n**栈**\n..., `value3`, `value2`, `value1` →\n..., `value1`, `value3`, `value2`,\
  \ `value1`\n其中 `value1`、`value2` 和 `value3` 都是第 1 类计算类型的值（§2.11.1)）。\n\n形式 2：\n\
  ..., `value2`, `value1` →\n..., `value1`, `value2`, `value1`\n其中 `value1` 是第 1 类计算类型的值，而\
  \ `value2` 是第 2 类计算类型的值（§2.11.1)）。\n\n**描述**\n复制操作数栈顶部的值，并将复制的值插入到操作数栈向下两个或三个值的位置。\n\
  \n## dup2\n\n**操作**\n复制操作数栈顶部的的一个或两个值\n\n**格式**\n![Image](img/409fig01.jpg)\n\n\
  **形式**\n`dup2` = 92 (0x5c)\n\n**操作数**\n形式 1：\n**栈**\n..., `value2`, `value1` →\n\
  ..., `value2`, `value1`, `value2`, `value1`\n其中 `value1` 和 `value2` 都是第 1 类计算类型的值（§2.11.1)）。\n\
  \n形式 2：\n..., `value` →\n..., `value`, `value`\n其中 `value` 是第 2 类计算类型的值（§2.11.1)）。\n\
  \n**描述**\n复制操作数栈顶部的的一个或两个值，并将复制的值或多个值按原始顺序推回操作数栈。\n\n## dup2_x1\n\n**操作**\n复制操作数栈顶部的的一个或两个值并向下插入两个或三个值\n\
  \n**格式**\n![Image](img/410fig01.jpg)\n\n**形式**\n`dup2_x1` = 93 (0x5d)\n\n**操作数**\n\
  形式 1：\n**栈**\n..., `value3`, `value2`, `value1` →\n..., `value2`, `value1`, `value3`,\
  \ `value2`, `value1`\n其中 `value1`、`value2` 和 `value3` 都是第 1 类计算类型的值（§2.11.1)）。\n\
  \n形式 2：\n..., `value2`, `value1` →\n..., `value1`, `value2`, `value1`\n其中 `value1`\
  \ 是第 2 类计算类型的值，而 `value2` 是第 1 类计算类型的值（§2.11.1)）。\n\n**描述**\n复制操作数栈顶部的的一个或两个值，并将复制的值按原始顺序插入到操作数栈中原始值或值下方的一个值的位置。\n\
  \n## dup2_x2\n\n**操作**\n复制操作数栈顶部的的一个或两个值并向下插入两个、三个或四个值\n\n**格式**\n![Image](img/411fig01.jpg)\n\
  \n**形式**\n`dup2_x2` = 94 (0x5e)\n\n**操作数**\n形式 1：\n**栈**\n..., `value4`, `value3`,\
  \ `value2`, `value1` →\n..., `value2`, `value1`, `value4`, `value3`, `value2`, `value1`\n\
  其中 `value1`、`value2`、`value3` 和 `value4` 都是第 1 类计算类型的值（§2.11.1)）。\n\n形式 2：\n...,\
  \ `value3`, `value2`, `value1` →\n..., `value1`, `value3`, `value2`, `value1`\n\
  其中 `value1` 是第 2 类计算类型的值，而 `value2` 和 `value3` 都是第 1 类计算类型的值（§2.11.1)）。\n\n形式 3：\n\
  ..., `value3`, `value2`, `value1` →\n..., `value2`, `value1`, `value3`, `value2`,\
  \ `value1`\n其中 `value1` 和 `value2` 都是第 1 类计算类型的值，且 `value3` 是第 2 类计算类型的值（§2.11.1)）。\n\
  \n形式 4：\n..., `value2`, `value1` →\n..., `value1`, `value2`, `value1`\n其中 `value1`\
  \ 和 `value2` 都是第 1 类计算类型的值，且是第 2 类计算类型的值（§2.11.1)）。\n\n**描述**\n复制操作数栈顶部的的一个或两个值，并将复制的值插入到操作数栈中原始值或值下方的位置。\n\
  \n### f2d\n\n**操作**\n将 `float` 转换为 `double`\n\n**格式**\n![Image](img/413fig01.jpg)\n\
  \n**形式**\n`f2d` = 141 (0x8d)\n\n**操作数**\n..., `value` →\n\n**栈**\n..., `result`\n\
  \n**描述**\n操作数栈上的 `value` 从操作数栈中弹出并进行值转换（§2.8.3](#ch02.html_ch02lev2sec18))）。然后将\
  \ `value’` 转换为双精度 `result`。\n\n**注意**\n如果 `f2d` 指令是严格的，它执行宽转换（JLS §5.1.2）。由于 float\
  \ 设置（§2.3.2](#ch02.html_ch02lev2sec2))）的值都可以由双精度表示，这种转换是精确的。如果 `f2d` 指令不是严格的，转换结果可能取自双指数集合；它不一定是最近的可表示值。\n\
  \n### f2i\n\n**操作**\n将 `float` 转换为 `int`\n\n**格式**\n![Image](img/414fig01.jpg)\n\
  \n**形式**\n`f2i` = 139 (0x8b)\n\n**操作数**\n..., `value` →\n\n**栈**\n..., `result`\n\
  \n**描述**\n操作数栈上的 `value` 类型必须是 `float`。它从操作数栈中弹出并进行值转换（§2.8.3](#ch02.html_ch02lev2sec18))）。然后将\
  \ `value’` 转换为整数 `result`。该 `result` 推入操作数栈：\n- 如果 `value’` 是 NaN，则转换结果为整数 `int`\
  \ 0。\n- 否则，如果 `value’` 不是无穷大，则根据 IEEE 754 向零舍入模式将其舍入为整数值 V。如果该整数值 V 可以表示为 `int`，则\
  \ `result` 就是整数 V。\n- 否则，要么 `value’` 太小（负的大幅值或负无穷），此时 `result` 是 `int` 类型的最小可表示值；要么\
  \ `value’` 太大（正的大幅值或正无穷），此时 `result` 是 `int` 类型的最大可表示值。\n\n**注意**\n`f2i` 指令执行窄原始转换（JLS\
  \ §5.1.3）。它可能会丢失 `value’` 的整体数量级信息，并可能丢失精度。\n\n### f2l\n\n**操作**\n将 `float` 转换为\
  \ `long`\n\n**格式**\n![Image](img/415fig01.jpg)\n\n**形式**\n`f2l` = 140 (0x8c)\n\n\
  **操作数**\n..., `value` →\n\n**栈**\n..., `result`\n\n**描述**\n\n\n\n\n操作数栈顶部的 `value`\
  \ 必须是 `float` 类型。它从操作数栈中弹出并经过值集转换（§2.8.3），得到 `value’`。然后将 `value’` 转换为 `long` 类型\
  \ `result`。该 `result` 被推入操作数栈：\n\n- 如果 `value’` 是 NaN，则转换结果为 `long` 类型 0。\n- 否则，如果\
  \ `value’` 不是无穷大，则使用 IEEE 754 向零舍入模式将其舍入为整数值 `V`。如果该整数值 `V` 可以表示为 `long`，则 `result`\
  \ 为 `long` 类型的值 `V`。\n- 否则，要么 `value’` 太小（大绝对值的负值或负无穷），此时 `result` 为 `long` 类型可表示的最小值；要么\
  \ `value’` 太大（大绝对值的正值或正无穷），此时 `result` 为 `long` 类型可表示的最大值。\n\n### Notes\n`f2l` 指令执行窄化原始转换（JLS\
  \ §5.1.3）。它可能会丢失 `value’` 的整体量级信息，并可能丢失精度。\n\n### fadd\n\n**Operation**\n加 `float`\n\
  \n**Format**\n![Image](img/416fig01.jpg)\n\n**Forms**\n`fadd` = 98 (0x62)\n\n**Operand**\n\
  ..., `value1`, `value2` →\n\n**Stack**\n..., `result`\n\n**Description**\n`value1`\
  \ 和 `value2` 必须是 `float` 类型。这两个值从操作数栈中弹出并经过值集转换（§2.8.3），得到 `value1’` 和 `value2’`。`float`\
  \ 类型 `result` 为 `value1’ + value2’`。该 `result` 被推入操作数栈。\n\n`fadd` 指令的结果受 IEEE 算术规则的约束：\n\
  \n- 如果 `value1’` 或 `value2’` 中任一个为 NaN，则结果为 NaN。\n- 符号相反的两个无穷大之和为 NaN。\n- 符号相同的两个无穷大之和为该符号的无穷大。\n\
  - 一个无穷大与任何有限值的和等于该无穷大。\n- 符号相反的两个零之和为正零。\n- 符号相同的两个零之和为该符号的零。\n- 零与非零有限值的和等于该非零值。\n\
  - 量级相同且符号相反的两个非零有限值之和为正零。\n- 在其余情况下（即两个操作数均非无穷大、零或 NaN，且值符号相同或量级不同），计算总和并使用 IEEE\
  \ 754 最近邻舍入模式将其舍入到最近的可表示的值。如果量级大到无法表示为 `float`，我们称该操作溢出；结果为具有相应符号的无穷大。如果量级小到无法表示为\
  \ `float`，我们称该操作下溢；结果为具有相应符号的零。\n\nJava 虚拟机支持 IEEE 754 定义的渐进下溢。尽管可能会发生溢出、下溢或精度丢失，但\
  \ `fadd` 指令的执行永远不会抛出运行时异常。\n\n### faload\n\n**Operation**\n从数组加载 `float`\n\n**Format**\n\
  ![Image](img/418fig01.jpg)\n\n**Forms**\n`faload` = 48 (0x30)\n\n**Operand**\n...,\
  \ `arrayref`, `index` →\n\n**Stack**\n..., `value`\n\n**Description**\n`arrayref`\
  \ 必须是 `reference` 类型，并且引用一个组件类型为 `float` 的数组。`index` 必须是 `int` 类型。`arrayref` 和 `index`\
  \ 均从操作数栈中弹出。获取数组 `index` 处组件的 `float` 值并推入操作数栈。\n\n**Run-time**\n如果 `arrayref` 为\
  \ `null`，`faload` 抛出 `NullPointerException`。\n\n**Exceptions**\n否则，如果 `index` 不在\
  \ `arrayref` 所引用数组的范围内，`faload` 指令抛出 `ArrayIndexOutOfBoundsException`。\n\n### fastore\n\
  \n**Operation**\n存储到 `float` 数组\n\n**Format**\n![Image](img/419fig01.jpg)\n\n**Forms**\n\
  `fastore` = 81 (0x51)\n\n**Operand**\n..., `arrayref`, `index`, `value` →\n\n**Stack**\n\
  ...\n\n**Description**\n`arrayref` 必须是 `reference` 类型，并且引用一个组件类型为 `float` 的数组。`index`\
  \ 必须是 `int` 类型，且 `value` 必须是 `float` 类型。`arrayref`、`index` 和 `value` 从操作数栈中弹出。`float`\
  \ 类型的 `value` 经过值集转换（§2.8.3），得到 `value’`，并将 `value’` 存储为由 `index` 的数组组件。\n\n**Run-time**\n\
  如果 `arrayref` 为 `null`，`fastore` 抛出 `NullPointerException`。\n\n**Exceptions**\n\
  否则，如果 `index` 不在 `arrayref` 所引用数组的范围内，`fastore` 指令抛出 `ArrayIndexOutOfBoundsException`。\n\
  \n### fcmp<op>\n\n**Operation**\n比较 `float`\n\n**Format**\n![Image](img/420fig01.jpg)\n\
  \n**Forms**\n`fcmpg` = 150 (0x96)\n`fcmpl` = 149 (0x95)\n\n**Operand**\n..., `value1`,\
  \ `value2` →\n\n**Stack**\n..., `result`\n\n**Description**\n`value1` 和 `value2`\
  \ 必须是 `float` 类型。这两个值从操作数栈中弹出并经过值集转换（§2.8.3），得到 `value1’` 和 `value2’`。执行浮点比较：\n\n\
  - 如果 `value1’` 大于 `value2’`，将 `int` 类型的值 1 推入操作数栈。\n- 否则，如果 `value1’` 等于 `value2’`，将\
  \ `int` 类型的值 0 推入操作数栈。\n- 否则，如果 `value1’` 小于 `value2’`，将 `int` 类型的值 -1 推入操作数栈。\n\
  -  ，至少有一个操作数为 NaN。此时 `fcmpg` 指令将 `int` 类型的值 1 推入操作数栈，`fcmpl` 指令将 `int` 类型的值 -1 推入操作数栈。\n\
  \n浮点比较按照 IEEE 754 执行。除 NaN 外的所有值都是有序的，负无穷小于所有有限值，正无穷大于所有有限值。正零和负零视为相等。\n\n**Notes**\n\
  `fcmpg` 和 `fcmpl` 指令的区别仅在于对 NaN 的处理。如果操作数包含 NaN，则任何浮点比较都会失败。更多信息请参见 §3.5。\n\n###\
  \ fconst_<f>\n\n**Operation**\n推入 `float`\n\n**Format**\n![Image](img/422fig01.jpg)\n\
  \n**Forms**\n`fconst_0` = 11 (0xb)\n`fconst_1` = 12 (0xc)\n`fconst_2` = 13 (0xd)\n\
  \n**Operand**\n... →\n\n**Stack**\n..., `<f>`\n\n**Description**\n将 `float` 常量 `<f>`（0.0、1.0\
  \ 或 2.0）推入操作数栈。\n\n### fdiv\n\n**Operation**\n除法 `float`\n\n**Format**\n![Image](img/423fig01.jpg)\n\
  \n**Forms**\n`fdiv` = 110 (0x6e)\n\n**Operand**\n..., `value1`, `value2` →\n\n**Stack**\n\
  ..., `result`\n\n**Description**\n`value1` 和 `value2` 必须是 `float` 类型。这两个值从操作数栈中弹出并经过值集转换（§2.8.3），得到\
  \ `value1’` 和 `value2’`。`float` 类型 `result` 为 `value1’ / value2’`。该 `result` 被推入操作数栈。\n\
  \n`fdiv` 指令的结果受 IEEE 算术规则的约束：\n\n- 如果 `value1’` 或 `value2’` 中任一个为 NaN，则结果为 NaN。\n\
  - 如果 `value1’` 和 `value2’` 均非 NaN，则结果的符号：如果两个值符号相同则为正，符号不同则为负。\n- 无穷大除以无穷大结果为 NaN。\n\
  - 无穷大除以有限值结果为具有相应符号的无穷大，符号遵循上述产生规则。\n- 有限值除以无穷大结果为具有相应符号的零，符号遵循上述产生规则。\n\n\n\n\n\
  \n-   零除以零的结果为 `NaN`；零除以任何其他有限值的结果为带符号的零，其符号产生规则如上文所示。\n-   非零有限值除以零的结果为带符号的无穷大，其符号产生规则如上文所示。\n\
  -   在其余情况下，即当两个操作数均既不是无穷大、零或 `NaN` 时，将计算商并使用 IEEE 754 的“舍入最近最近值”模式将其舍入到最近的 `float`。如果值过大无法表示为\
  \ `float`，则称该操作为溢出；结果为具有相应符号的无穷大。如果值过小无法表示为 `float`，则称该操作为下溢；结果为具有相应符号的零。\n\nJava\
  \ 虚拟机要求支持 IEEE 754 定义的渐进式下溢。尽管可能会发生溢出、下溢、除以零或精度丢失，`fdiv` 指令的执行永远不会抛出运行时异常。\n\n###\
  \ fload\n\n**操作**\n从局部变量加载 `float`\n\n**格式**\n![Image](img/425fig01.jpg)\n\n**形式**\n\
  `fload` = 23 (0x17)\n\n**操作数**\n... →\n\n**栈**\n..., `value`\n\n**描述**\n`index`\
  \ 是一个无符号字节，必须是当前栈帧局部变量数组的索引（2.6）。`index` 处的局部变量必须包含一个 `float`。`index` 处局部变量的 `value`\
  \ 将被推入操作数栈。\n\n**备注**\n`fload` 字节码可以与 `wide` 指令（*wide）结合使用，以便使用双字节无符号索引访问局部变量。\n\
  \n### fload_<n>\n\n**操作**\n从局部变量加载 `float`\n\n**格式**\n![Image](img/426fig01.jpg)\n\
  \n**形式**\n`fload_0` = 34 (0x22)\n`fload_1` = 35 (0x23)\n`fload_2` = 36 (0x24)\n\
  `fload_3` = 37 (0x25)\n\n**操作数**\n... →\n\n**栈**\n..., `value`\n\n**描述**\n`<n>`\
  \ 必须是当前栈帧局部变量数组的索引（2.6）。`<n>` 处的局部变量必须包含一个 `float`。`<n>` 处局部变量的 `value` 将被推入操作数栈。\n\
  \n**备注**\n每个 `fload_<n>` 指令都与 `index` 为 `<n>` 的 `fload` 指令相同，只是操作数 `<n>` 是隐式的。\n\
  \n### fmul\n\n**操作**\n相乘 `float`\n\n**格式**\n![Image](img/427fig01.jpg)\n\n**形式**\n\
  `fmul` = 106 (0x6a)\n\n**操作数**\n..., `value1`, `value2` →\n\n**栈**\n..., `result`\n\
  \n**描述**\n`value1` 和 `value2` 必须都是 `float` 类型。这两个值从操作数栈弹出并经过值集转换（2.8.3），产生 `value1'`\
  \ 和 `value2’`。`float` 类型 `result` 为 `value1'` * `value2’`。结果被推入操作数栈。\n\n`fmul` 指令的结果受\
  \ IEEE 算术规则支配：\n- 如果 `value1'` 或 `value2’` 其中之一为 `NaN`，结果为 `NaN`。\n- 如果 `value1'`\
  \ 和 `value2’` 都不是 `NaN`，如果两个值的符号相同则结果为正；如果符号不同，则结果为负。\n- 无穷大乘以零的结果为 `NaN`。\n- 无穷大乘以有限值的结果为带符号的无穷大，其符号产生规则如上所示。\n\
  - 在其余情况下，即当不涉及无穷大或 `NaN` 时，计算乘积并使用 IEEE 754 的“舍入最近最近值”模式将其舍入到最近的可表示值。如果值过大无法表示为\
  \ `float`，则称该操作为溢出；结果为具有相应符号的无穷大。如果值过小无法表示为 `float`，则称该操作为下溢；结果为具有相应符号的零。\n\nJava\
  \ 虚拟机要求支持 IEEE 754 定义的渐进式下溢。尽管可能会发生溢出、下溢或精度丢失，`fmul` 指令的执行永远不会抛出运行时异常。\n\n### fneg\n\
  \n**操作**\n取反 `float`\n\n**格式**\n![Image](img/429fig01.jpg)\n\n**形式**\n`fneg` = 118\
  \ (0x76)\n\n**操作数**\n..., `value` →\n\n**栈**\n..., `result`\n\n**描述**\n`value` 必须是\
  \ `float` 类型。它从操作数栈弹出并经过值集转换（2.8.3），产生 `value’`。`float` 类型 `result` 为 `value’`。结果被推入操作数栈。\n\
  \n### frem\n\n**操作**\n取余 `float`\n\n**格式**\n![Image](img/430fig01.jpg)\n\n**形式**\n\
  `frem` = 114 (0x72)\n\n**操作数**\n..., `value1`, `value2` →\n\n**栈**\n..., `result`\n\
  \n**描述**\n`value1` 和 `value2` 必须都是 `float` 类型。这两个值从操作数栈弹出并经过值集转换（2.8.3），产生 `value1'`\
  \ 和 `value2’`。计算 `result` 并推入操作数栈。\n\nIEEE 754 的取余操作不同于除法。Java 虚拟机定义 `frem` 的行为类似于整数取余指令（*irem*\
  \ 和 *lrem*）；它可以与 C 库函数 `fmod` 进行比较。\n\n来自 `value1’` 和 和 `value2’` 的浮点取余 `result`\
  \ 由数学关系 `result = value1’ - (value2’ * q)` 定义，其中 `q` 是一个整数，仅当 `value1’ / value2’`\
  \ 为负时为负，仅当 `value1’ / value2’` 为正时为正，且其绝对值尽可能大但不超过 `value1’ / value2’` 的真实数学商。\n\
  \n`frem` 指令的结果受以下规则支配：\n- 如果 `value1'` 或 `value2’` 其中之一为 `NaN`，结果为 `NaN`。\n- 如果\
  \ `value1'` 和 `value2’` 都不是 `NaN`，结果的符号与被除数的符号相同。\n- 如果被除数为无穷大或除数为零（或两者都是），结果为 `NaN`。\n\
  - 如果被除数为有限值且除数为无穷大，结果为被除数。\n- 如果被除数为零且除数为有限值，结果为被除数。\n- 在其余情况下，即当两个操作数均既不是无穷大、零或\
  \ `NaN` 时，结果如定义。\n\n尽管可能会发生除以零，`frem` 指令的求永远不会抛出运行时异常。不会发生溢出、下溢或精度丢失。\n\n**备注**\n\
  IEEE 754 取余操作可以通过库例程 `Math.IEEEremainder` 计算。\n\n\n\n\n当前方法必须具有返回类型 `float`。`value`\
  \ 必须是 `float` 类型。如果当前方法是 `synchronized` 方法，则在调用方法时进入或重入的监视器（monitor）将得到更新，并可能像由当前线程执行\
  \ `monitorexit` 指令（§*monitorexit)）一样退出。如果没有抛出异常，`value` 将从当前帧的操作数栈中弹出（§2.6)）并经过值转换（§2.8.3)），得到\
  \ `value’`。`value’` 被推入调用者帧的操作数栈中。当前方法操作数栈上的任何其他值都会被丢弃。\n\n解释器随后将控制权返回方法的调用者，恢复调用者的帧。\n\
  \n### 运行时异常\n\n如果 Java 虚拟机实现没有强制执行 §2.11.10 中描述的结构化锁规则，那么如果当前方法是 `synchronized`\
  \ 方法且当前线程不是调用方法时进入或重入的监视器的所有者，`freturn` 将抛出 `IllegalMonitorStateException`。这种情况可能会发生，例如，一个\
  \ `synchronized` 方法包含一个 `monitorexit` 指令，但在该方法同步的对象上没有 `monitorenter` 指令。\n\n否则，如果\
  \ Java 虚拟机实现强制执行 §2.11.10 中描述的结构化锁规则，并且在调用当前方法期间违反了这些规则之一，则 `freturn` 将抛出 `IllegalMonitorStateException`。\n\
  \n### fstore\n\n#### 操作\n将 `float` 存储到局部变量\n\n#### 格式\n![Image](img/433fig01.jpg)\n\
  \n#### 形式\n`fstore` = 56 (0x38)\n\n#### 操作数\n..., `value` →\n\n#### 栈\n...\n\n####\
  \ 描述\n`index` 是一个无符号字节，必须是当前帧局部变量数组的索引（§2.6)）。操作数栈顶部的 `value` 必须是 `float` 类型。它从操作数栈中弹出并经过值转换（§2.8.3)），得到\
  \ `value’`。位于 `index` 处的局部变量的值设置为 `value’`。\n\n#### 注意事项\n`fstore` 字节码可以与 `wide`\
  \ 指令（§*wide)结合使用，使用双字节无符号索引访问局部变量。\n\n### fstore_<n>\n\n#### 操作\n将 `float` 存储到局部变量\n\
  \n#### 格式\n![Image](img/434fig01.jpg)\n\n#### 形式\n`fstore_0` = 67 (0x43)\n`fstore_1`\
  \ = 68 (0x44)\n`fstore_2` = 69 (0x45)\n`fstore_3` = 70 (0x46)\n\n#### 操作数\n...,\
  \ `value` →\n\n#### 栈\n...\n\n#### 描述\n`<n>` 必须是当前帧局部变量数组的索引（§2.6)）。操作数栈顶部的 `value`\
  \ 必须是 `float` 类型。它从操作数栈中弹出并经过值转换（§2.8.3)），得到 `value’`。位于 `<n>` 处的局部变量的值设置为 `value’`。\n\
  \n#### 注意事项\n每个 `fstore_<n>` 指令都与 `index` 为 `<n>` 的 `fstore` 相同，区别在于操作数 `<n>` 是隐式的。\n\
  \n### fsub\n\n#### 操作\n减 `float`\n\n#### 格式\n![Image](img/435fig01.jpg)\n\n####\
  \ 形式\n`fsub` = 102 (0x66)\n\n#### 操作数\n..., `value1`, `value2` →\n\n#### 栈\n...,\
  \ `result`\n\n#### 描述\n`value1` 和 `value2` 必须都是 `float` 类型。这两个值从操作数栈中弹出并经过值转换（§2.8.3)），得到\
  \ `value1’` 和 `value2’`。`float` 类型 `result` 为 `value1’ - value2’`。`result` 被推入操作数栈。对于\
  \ `float` 减法，`a-b` 生成的结果与 `a+(-b)` 相同。但对于 `fsub` 指令，从零减并不同于取反，因为如果 `x` 是 `+0.0`，那么\
  \ `0.0-x` 等于 `+0.0`，而 `-x` 等于 `-0.0`。\n\nJava 虚拟机要求支持 IEEE 754 定义的渐进式下溢。尽管可能会发生溢出、下溢或精度丢失失，但执行\
  \ `fsub` 永远不会抛出运行时异常。\n\n### getfield\n\n#### 操作\n从对象获取字段\n\n#### 格式\n![Image](img/436fig01.jpg)\n\
  \n#### 形式\n`getfield` = 180 (0xb4)\n\n#### 操作数\n..., `objectref` →\n\n#### 栈 \n\
  ..., `value`\n\n#### 描述\n从操作数栈中弹出类型为 `reference` 的 `objectref`。无符号的 `indexbyte1`\
  \ 和 `indexbyte2` 用于构造指向当前类常量池的索引（§2.6)），其中索引的值为 `(indexbyte1 << 8) | indexbyte2`。该处的运行时常量池项必须是指向字段的符号引用（§5.1)），它提供了字段的名称和描述符，以及查找该字段的类或接口的符号引用。引用的字段将被解析（§5.4.2)）。`objectref`\
  \ 不能是数组。如果该字段是 `protected` 且它是当前类父类的成员，则 `objectref` 必须是当前类或其子类。\n\n#### 链接异常\n\
  在解析指向字段的符号引用期间，可以抛出任何与字段解析相关的异常（§5.4.2)）。\n\n否则，如果解析出的字段是 `static` 字段，`getfield`\
  \ 将抛出 `IncompatibleClassError`。\n\n#### 运行时异常\n否则，如果 `objectref` 为 `null`，`getfield`\
  \ 将抛出 `NullPointerException`。\n\n#### 注意事项\n`getfield` 指令不能用于访问数组的 `length` 字段。应使用\
  \ `arraylength` 指令（§arraylength](#ch06a.html_ch06lev2sec9)）。\n\n### getstatic\n\n\
  #### 操作\n从类获取 `static` 字段\n\n#### 格式\n![Image](img/438fig01.jpg)\n\n#### 形式\n`getstatic`\
  \ = 178 (0xb2)\n\n#### 操作数\n..., →\n\n#### 栈 \n..., `value`\n\n#### 描述\n无符号的 `indexbyte1`\
  \ 和 `indexbyte2` 用于构造指向当前类常量池的索引（§2.6)），其中索引的值为 `(indexbyte1 << 8) | indexbyte2`。该处的运行时常量池项必须是指向字段的符号引用（§5.1)），它提供了字段的名称和描述符，以及查找该字段的类或接口的符号引用。引用的字段将被解析（§5.4.2)）。\n\
  \n成功解析字段后，如果声明字段的类或接口尚未初始化，则对其初始化（§5.5)）。类或接口字段的值被获取并推入操作数栈。\n\n#### 链接异常\n在解析指向类或接口字段的符号引用期间，可以抛出任何与字段解析相关的异常（§5.4.2)）。\n\
  \n否则，如果解析出的字段不是 `static`（类）字段或接口字段，`getstatic` 将抛出 `IncompatibleClassChangeError`。\n\
  \n#### 运行时异常\n否则，如果执行此 `getstatic` 指令导致引用的类或接口初始化，`getstatic` 抛出 `Error`，详见 §5.5。\n\
  \n### goto\n\n#### 操作\n总是跳转\n\n#### 格式\n![Image](img/440fig01.jpg)\n\n#### 形式\n\
  `goto` = 167 (0xa7)\n\n#### 操作数栈\n无变化\n\n#### 描述\n\n\n\n无符号字节 `branchbyte1` 和 `branchbyte2`\
  \ 用于构造一个有符号的 16 位 `branchoffset`，其中 `branchoffset` 为 (`branchbyte1` `<<` 8) | `branchbyte2`。执行将从此\
  \ `goto` 指令的操作码地址开始该偏移量处。目标地址必须是包含该 `goto` 指令的方法内某条指令的操作码地址。\n\n### goto_w\n\n**Operation**\n\
  总是跳转（宽索引）\n\n**Format**\n![Image](img/441fig01.jpg)\n\n**Forms**\n`goto_w` = 200\
  \ (0xc8)\n\n**操作数栈**\n无变化\n\n**Description**\n无符号字节 `branchbyte1`、`branchbyte2`、`branchbyte3`\
  \ 和 `branchbyte4` 用于构造一个有符号的 32 位 `branchoffset`，其中 `branchoffset` 为 (`branchbyte1`\
  \ `<<` 24) | (`branchbyte2` `<<` 16) | (`branchbyte3` `<<` 8) | `branchbyte4`。执行将从此\
  \ `goto_w` 指令的操作码地址开始该偏移量处。目标地址必须是包含该 `goto_w` 指令的方法内某条指令的操作码地址。\n\n**Notes**\n\
  尽管 `goto_w` 指令采用 4 字节跳转偏移量，但其他因素限制方法的大小为 65535 字节 (§4.11)。此限制可以在 Java 虚拟机的未来版本中提高。\n\
  \n### i2b\n\n**Operation**\n将 `int` 转换为 `byte`\n\n**Format**\n![Image](img/442fig01.jpg)\n\
