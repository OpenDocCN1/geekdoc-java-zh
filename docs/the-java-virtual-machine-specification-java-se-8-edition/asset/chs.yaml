  \n### **备注**\n\n此系列指令中的每条指令对于相应的 `<i*>` 取值都等同于 `bipush` `<i*>`，只是操作数 `<i*>` 是隐式的。\n\
  \n### idiv\n\n### **操作**\n\n除以 `int`\n\n### **格式**\n\n![Image](img/453fig01.jpg)\n\
  \n### **形式**\n\n`idiv` = 108 (0x6c)\n\n### **操作数**\n\n..., *value1*, *value2* →\n\
  \n### **操作栈**\n\n..., *result*\n\n### **描述**\n\n*value1* 和 *value2* 必须都为 `int` 类型。这两个值从操作数栈中弹出。`int`\
  \ 类型 *result* 是 Java 语言表达式 `value1 / value2` 的值。该 *result* 被推入操作数栈。\n\n`int` 除法向\
  \ 0 舍入；即对于 *n*/*d* 中的 `int` 值产生的商是一个 `int` 值 *q*，其幅度在满足 `|d · q| ≤ |n|` 的情况下尽可能大。此外，当\
  \ `|n| ≥ |d|` 且 *n* 和 *d* 符号相同时，*q* 为正；但当 `|n| ≥ |d|` 且 *n* 和 *d* 符号相反时，*q* 为负。\n\
  \n有一个不符合此规则的特殊情况：如果被除数为 int 类型范围内最大的负整数，且除数为 -1，则发生溢出，结果等于被除数。尽管发生了溢出，在这种情况下也不会抛出异常。\n\
  \n### **运行时异常**\n\n如果 `int` 除法中的除数值为 0，`idiv` 将抛出 `ArithmeticException`。\n\n###\
  \ if_acmp<cond>\n\n### **操作**\n\n如果 `reference` 比较成功则跳转\n\n### **格式**\n\n![Image](img/454fig01.jpg)\n\
  \n### **形式**\n\n`if_acmpeq` = 165 (0xa5)\n\n`if_acmpne` = 166 (0xa6)\n\n### **操作数**\n\
  \n..., *value1*, *value2* →\n\n### **操作栈**\n\n...\n\n### **描述**\n\n*value1* 和 *value2*\
  \ 必须都为 `reference` 类型。它们都从操作数栈中弹出并进行比较。比较结果如下：\n\n• `if_acmpeq` 成功当且仅当 *value1*\
  \ = *value2*\n\n• `if_acmpne` 成功当且仅当 *value1* ≠ *value2*\n\n如果比较成功，则使用无符号 *branchbyte1*\
  \ 和 *branchbyte2* 构建一个符号符号 16 位偏移量，偏移量的计算方法为 `(branchbyte1 << 8) | branchbyte2`。执行将从此\
  \ `if_acmp<cond>` 指令的操作码地址按该偏移量继续。目标地址必须是包含此 `if_acmp<cond>` 指令的方法内某条指令的操作码地址。\n\
  \n否则，如果比较失败，执行将从此 `if_acmp<cond>` 指令后的指令地址继续。\n\n### if_icmp<cond>\n\n### **操作**\n\
  \n如果 `int` 比较成功则跳转\n\n### **格式**\n\n![Image](img/455fig01.jpg)\n\n### **形式**\n\n\
  `if_icmpeq` = 159 (0x9f)\n\n`if_icmpne` = 160 (0xa0)\n\n`if_icmplt` = 161 (0xa1)\n\
  \n`if_icmpge` = 162 (0xa2)\n\n`if_icmpgt` = 163 (0xa3)\n\n`if_icmple` = 164 (0xa4)\n\
  \n### **操作数**\n\n..., *value1*, *value2* →\n\n### **操作栈**\n\n...\n\n### **描述**\n\
  \n*value1* 和 *value2* 必须都为 `int` 类型。它们都从操作数栈中弹出并进行比较。所有比较均为带符号的。比较结果如下：\n\n• `if_icmpeq`\
  \ 成功当且仅当 *value1* = *value2*\n\n• `if_icmpne` 成功当且仅当 *value1* ≠ *value2*\n\n• `if_icmplt`\
  \ 成功当且仅当 *value1* < *value2*\n\n• `if_icmple` 成功当且仅当 *value1* ≤ *value2*\n\n• `if_icmpgt`\
  \ 成功当且仅当 *value1* > *value2*\n\n• `if_icmpge` 成功当且仅当 *value1* ≥ *value2*\n\n如果比较成功，则使用无符号\
  \ *branchbyte1* 和 *branchbyte2* 构建一个符号符号 16 位偏移量，偏移量的计算方法为 `(branchbyte1 << 8) |\
  \ branchbyte2`。执行将从此 `if_icmp<cond>` 指令的操作码地址按该偏移量继续。目标地址必须是包含此 `if_icmp<cond>`\
  \ 指令的方法内某条指令的操作码地址。\n\n否则，如果比较失败，执行将从此 `if_icmp<cond>` 指令后的指令地址继续。\n\n### if_icmp<cond>\n\
  \n### **操作**\n\n如果 `int` 比较成功则跳转\n\n### **格式**\n\n![Image](img/457fig01.jpg)\n\n\
  ### **形式**\n\n`ifeq` = 153 (0x99)\n\n`ifne` = 154 (0x9a)\n\n`iflt` = 155 (0x9b)\n\
