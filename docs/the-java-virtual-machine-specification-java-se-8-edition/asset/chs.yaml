  ### 4.10.14 成员验证](#ch04.html_ch04lev2sec16)\n\n\n\n\n\n\n\n\n\n\nJava SE 8 的一个主题是\
  \ Java SE 平台库与 Java 虚拟机共同演进。一个虽小但实用的例子是支持运行时的方法参数名称：在 `class` 文件结构中存储此类名称，与提供用于检索这些名称的标准\
  \ API（`java.lang.reflect.Parameter`）是相辅相成的。这说明了 `class` 文件结构多年来的一个有趣发展：该规范的第一版定义了六个属性，其中三个被认为对\
  \ Java 虚拟机至关重要；而 Java SE 8 版定义了 23 个属性，其中五个被认为对 Java 虚拟机至关重要；也就是说，属性现在主要为了支持库和工具，而不是\
  \ Java 虚拟机本身。为了帮助读者理解 `class` 文件结构，本规范更清晰地记录了每个属性的作用以及对其施加的约束。\n\n Java 平台组的许多同事为本规范提供了宝贵支持：Mandy\
  \ Chung, Joe Darcy, Joel Franck, Staffan Friberg, Yuri Gaevsky, Jon Gibbons, Jeannette\
  \ Hung, Eric McCorkle, Matherey Nunez, Mark Reinhold, John Rose, Georges Saab, Steve\
  \ Sides, Bernard Traversat, Michel Trudeau 和 Mikael Vidstedt。特别感谢 Dan Heidinga (IBM),\
  \ Karen Kinnear, Keith McGuigan 和 Harold Seigel，他们流行的 Java 虚拟机实现对兼容性和安全性的坚定承诺。\n\
  \nAlex Buckley\n\n加利福尼亚州，圣塔克拉\n\n2014 年 3 月\n\n# 第 1 章 引言\n\n## 1.1 背景\n\nJava^®\
  \ 编程语言是一种通用的、并发的面向对象的语言。它的语法与 C 和 C++ 相似，但省略了许多让 C 和 C++ 变得复杂、困惑且不安全的特性。Java 平台最初是为了解决为网络化消费设备构建软件的问题。它的设计旨在支持多个主机架构，并允许软件组件的安全交付。为了满足这些需求，编译代码必须在跨网络传输中生存，能够在任何客户端上运行，并向客户端保证运行是安全的。\n\
  \n万维网的普及使得这些属性变得更加有趣。网页浏览器让数百万能够能够简单的方式上网并访问丰富的媒体内容。终于有一种媒介，无论你使用何种机器，无论它是连接到快速网络还是慢速调制调器，你看到和听到的内容基本上是相同的。\n\
  \nWeb 爱好者很快发现，Web 的 HTML 文档格式支持的内容太太限了。HTML 扩展（如表单）仅凸显了这些局限性，同时也表明没有任何浏览器能包含用户想要的所有功能。可扩展性就是答案。\n\
  \nHotJava 浏览器通过将程序嵌入 HTML 页面中，首次展示了 Java 编程语言和平台的有趣特性。程序会与其所在的 HTML 页面一起透明地下载到浏览器中。在被浏览器接受之前，程序会经过仔细检查以确保它们是安全的。与\
  \ HTML 页面一样，编译后的程序独立于网络和主机。无论程序来自何处，无论被加载并运行在何种机器上，它们的行为都是相同的。\n\n结合 Java 平台的 Web\
  \ 浏览器不再限于一组预定义的能力。包含动态内容的网页的访问者可以确保，他们的机器不会被这些内容损坏。程序员可以编写一次程序，它将在任何提供 Java 运行环境的机器上运行。\n\
  \n 1.2 Java 虚拟机\n\nJava 虚拟机是 Java 平台的基石。它是该技术中负责硬件和操作系统无关性、编译代码小体积以及保护用户免受恶意程序侵害的组件。\n\
  \nJava 虚拟机是一个抽象的计算机。与真实的计算机一样，它有一套指令集并在运行时操纵各种内存区域。使用虚拟机实现编程语言是非常常见的；最为人知的虚拟机可能是\
  \ UCSD Pascal 的 P-Code 机器。\n\nJava 虚拟机的第一个原型实现在 Sun Microsystems, Inc. 完成的，它在一种类似于当时个人数字助理（PDA）的手持设备上托管的软件中模拟了\
  \ Java 虚拟机指令集。Oracle 目前的实现在移动、桌面和服务器设备上模拟 Java 虚拟机，但 Java 虚拟机不假设任何特定的实现技术、主机硬件或主机操作系统。它本质上不是解释执行的，也可以通过将其指令集编译为硅基\
  \ CPU 的指令集来实现。它也可以在微码或直接在硅片中实现。\n\nJava 虚拟机对 Java 编程语言一无所知，只知道特定的二进制格式，即 `class`\
  \ 文件格式。`class` 文件包含 Java 虚拟机指令（或字节码）、符号表以及其他辅助信息。\n\n为了安全起见，Java 虚拟机对 `class` 文件中的代码施加了严格的语法和结构约束。然而，任何可以用有效的\
  \ `class` 文件表达其的语言都可以由 Java 虚拟机托管。受通用的、机器无关的平台的吸引，其他语言的实现者可以将 Java 虚拟机作为其语言的交付媒介。\n\
  \n此处指定的 Java 虚拟机与 Java SE 8 平台兼容，并支持《Java 语言规范，Java SE 8 版》中指定的 Java 编程语言。\n\n##\
  \ 1.3 规范结构\n\n第 2 章 概述了 Java 虚拟机架构。\n\n第 3 章 介绍了将 Java 编程语言编写的代码编译为 Java 虚拟机指令集。\n\
  \n第 4 章 规定了 `class` 文件格式，即用于表示编译后的类和接口的独立硬件和操作系统的二进制格式。\n\n第 5 章 规定了 Java 虚拟机的启动以及类和接口的加载、链接和初始化。\n\
  \n第 6 章 规定了 Java 虚拟机的指令集，按操作码助记符的字母顺序给出指令。\n\n第 7 章 给出了按操作码值索引的 Java 虚拟机操作码助记符表。\n\
  \n在《Java^® 虚拟机规范》第二版中，第 2 章提供了 Java 编程语言的概述，旨在支持 Java 虚拟机的规范，但其本身并不是规范的一部分。在《Java\
  \ 虚拟机规范，Java SE 8 版》中，读者应参考《Java 语言规范，Java SE 8 版》以获取有关 Java 编程语言的信息。形如 (JLS §x.y)\
  \ 的引用表示此处是必要的。\n\n在《Java^® 虚拟机规范》第二版中，第 8 章详细说明了解释 Java 虚拟机线程与共享主内存交互的低级操作。在《Java\
  \ 虚拟机规范，Java SE 8 版》中，读者应参考《Java 语言规范，Java SE 8 版》的第 17 章以获取有关线程和锁的信息。第 17 章反映了由\
  \ JSR 133 专家小组产生的《Java 内存模型和线程规范》。\n\n 1.4 符号表示\n\n\n\n\n\n在本规范中，我们指的是源自 Java SE\
  \ 平台 API 的类和接口。当我们使用单个标识符 `N` 引用类或接口时（示例中声明的类或接口除外），预期的引用是指 `java.lang` 包中名为 `N`\
  \ 的类或接口。对于来自 `java.lang` 以外其他包的类或接口，我们使用全限定名。\n\n每当我们引用声明在 `java` 包或其任何子包中的类或接口时，预期的引用是指由启动类加载器加载的该类或接口（见节\
  \ §5.3.1）。\n\n每当我们引用名为 `java` 的包的子包时，预期的引用是指由启动类加载器确定的该子包。\n\n本规范中字体的使用如下：\n\n•\
  \ `fixed width`（等宽宽）字体用于 Java 虚拟机数据类型、异常、错误、`class` 文件结构、Prolog 代码和 Java 代码片段。\n\
  \n• *斜体*（Italic）用于 Java 虚拟机“汇编语言”、其操作码和操作数，以及 Java 虚拟机运行时数据区域中的项目。它也用于引入新术语或仅用于强调。\n\
  \n旨在澄清规范的非规范性信息以较小的、缩进的文本给出。\n\n这是非规范性信息。它提供了直觉、原理、建议、示例等。\n\n## 1.5 反馈\n\n读者可以将关于本规范错误、遗漏和歧义的反馈发送至\
  \ `jvms-comments_ww@oracle.com`。\n\n关于 `javac`（Java 编程语言的引用编译器）对 `class` 文件的生成和处理的问题可以发送至\
  \ `compilerdev@openjdk.java.net`。\n\n## 第 2 章 Java 虚拟机的结构\n\n本文规定了一种抽象机器。它没有描述 Java\
  \ 虚拟机的任何特定实现。\n\n要正确实现 Java 虚拟机，你只需要能够读取 `class` 文件格式并正确执行其中指定的操作。不属于 Java 虚拟机规范的实现细节将不必要地限制实现者的创造力。例如，运行时数据区域的内存布局、使用的垃圾回收算法以及\
  \ Java 虚拟机指令的任何内部优化（例如将其翻译为机器码）均由实现者自行决定。\n\n本规范中对 Unicode 的所有引用均相对于*Unicode 标准第\
  \ 6.0.0 版*，该标准可通过 [`http://www.unicode.org/`](http://www.unicode.org/) 获取。\n\n###\
  \ 2.1 class 文件格式\n\n供 Java 虚拟机执行的编译代码使用一种与硬件和操作系统的二进制格式表示，该格式通常（但并非）存储在文件中，被称为 `class`\
  \ 文件格式。`class` 文件格式精确地定义了类或接口的表示，包括字节序等细节，这些细节在特定平台的对象文件格式中可能是被所当然的。\n\n第 4 章、“`class`\
  \ 文件格式”详细涵盖了 `class` 文件格式。\n\n## 2.2 数据类型\n\n与 Java 编程语言一样，Java 虚拟机对两种类型操作：`primitive\
  \ types`（原始类型）和 `reference types`（引用类型）。相应地，有两种可以存储在变量中、作为参数传递、由方法返回并进行操作的值：`primitive\
  \ values`（原始值）和 `reference values`（引用值）。\n\nJava 虚拟机期望几乎所有的类型检查都在运行时之前完成（通常由编译器完成），而不由\
  \ Java 虚拟机本身完成。原始类型的值不需要标记或通过其他方式检查以便在运行时确定其类型，或将其与引用类型的值区分开。相反，Java 虚拟机的指令集使用用于操作特定类型值的指令来区分其操作数类型。例如，`iadd`、`ladd`、`fadd`\
  \ 和 `dadd` 都是添加两个数值并产生数值结果的 Java 虚拟机指令，但每个指令都针对其操作数类型专门化：分别为 `int`、`long`、`float`\
  \ 和 `double`。关于 Java 虚拟机指令集中类型支持的摘要，见 §2.11.1。\n\nJava 虚拟机对对象提供了显式支持。对象可以是动态分配的类实例或数组。对象的引用被认为具有\
  \ Java 虚拟机类型 `reference`。`reference` 类型的值可以被视为指向对象的指针。一个对象可能存在多个引用。对象始终通过 `reference`\
  \ 类型的值进行操作、传递和测试。\n\n### 2.3 原始类型和值\n\nJava 虚拟机支持的原始数据类型是 `numeric types`（数值类型）、`boolean`\
  \ 类型（§2.3.4）以及 `returnAddress` 类型（§2.3.3）。\n\n数值类型包括 `integral types`（整数类型）（§2.3.1）和\
  \ `floating-point types`（浮点类型）（§2.3.2）。\n\n整数类型为：\n\n• `byte`，其值为 8 位带符号位补码整数。\n\
  \n• `short`，其值为 16 位带符号位补码整数。\n\n• `int`，其值为 32 位带符号位补码整数。\n\n• `long`，其值为 64 位带符号位补码整数。\n\
  \n• `char`，其值为 16 位无符号整数，表示多语言平面中的 Unicode 代码点。\n\n浮点类型为：\n\n• `float`，其值为 float\
  \ 值集合的元素，或者在支持的情况下，为 float 扩展值集合的元素。\n\n• `double`，其值为 double 值集合的元素，或者在支持的情况下，为\
  \ double 扩展值集合的元素。\n\n`boolean` 类型编码真值 `true` 和 `false`，默认值为 `false`。\n\n`returnAddress`\
  \ 类型的值是 Java 虚拟机指令操作码的指针。\n\n\n\n\nIEEE 754 标准不仅包含正、负符号位数值，还包括正、负零，正、负 `infinities`（无穷大）以及一个特殊的非数字值（以下简写为“NaN”）。`NaN`\
  \ 值用于表示某些无效操作的结果，例如零除以零。\n\n每个 Java 虚拟机的实现都要求支持两组标准的浮点数值集，称为 `float value set` 和\
  \ `double value set`。此外，Java 虚拟机的实现可以根据其选择，支持两个扩展指数浮点数值集中的一个或两个，分别称为 `float-extended-exponent\
  \ value set` 和 `double-extended-exponent value set`。在某些情况下，这些扩展指数数值集可以用来替代标准数值集来表示\
  \ `float` 或 `double` 类型的值。\n\n任何浮点数值集中的有限非零值均可以表示为形式 `s` · `m` · `2^((e` − `N` +\
  \ 1))`，其中 `s` 等于 `+1`` 或 `−1`，`m` 是小于 `2*N` 的正整数，`e` 是介于 `E[min]` = `−(2^(K−1)−2)`\
  \ 和 `E[max]` = `2^(K−1)−1` 之间的整数（包含边界），其中 `N` 和 `K` 是取决于该数值集的参数。某些值可以用多种方式以这种形式表示；例如，假设数值集中的某个值\
  \ `v` 可以使用某些 `s`、`m` 和 `e` 值以这种形式表示，那么如果恰好 `m` 为偶数且 `e` 小于 `2^(K-1)`，则可以将 `m` 减半并将\
  \ `e` 加 `1`，从而为相同的值 `v` 产生第二种表示。如果 `m` ≥ `2^(N-1)`，则这种形式表示被称为 `normalized`（规格化的）；否则，该表示被称为\
  \ `denormalized`（非规格化的）。如果数值集中的某个值无法以满足 `m` ≥ `2^(N-1)` 的方式表示，则该值被称为 `denormalized\
  \ value`（非规格化值），因为它没有规格化的表示。\n\n对于两个必需和两个可选的浮点数值集，参数 `N` 和 `K`（以及派生的参数 `E[min]`\
  \ 和 `E[max]`）的约束总结在表 2.3.2-A 中。\n\n\n**表 2.3.2-A. 浮点数值集参数**\n\n如果实现支持一个或两个扩展指数数值集，则对于每个支持的扩展指数数值集，都有一个特定于实现的常量\
  \ `K`，其值受表 2.3.2-A 的约束；该值 `K` 反过来决定了 `E[min]` 和 `E[max]` 的值。\n\n四个数值集中的每一个不仅包含上述分配给它的有限非零值，还包含了五个值：正零、负零、正无穷、负无穷和\
  \ `NaN`。\n\n请注意，表 2.3.2-A 中的约束旨在确保 `float value set` 的每一个元素必然也是 `float-extended-exponent\
  \ value set`、`double value set` 以及 `double-extended-exponent value set` 的元素。同样，`double\
  \ value set` 的每一个元素必然也是 `double-extended-exponent value set` 的元素。每个扩展指数数值集的指数范围都比相应的标准数值集大，但精度并不更高。\n\
  \n`float value set` 的元素完全是使用 IEEE 754 标准中定义的单精度浮点格式可以表示的值，但其中只有一个 `NaN` 值（IEEE 754\
  \ 规定了 `2²⁴-2` 个不同的 `NaN` 值）。`double value set` 的元素完全是使用 IEEE 754 标准中定义的双精度浮点格式可以表示的值，但其中只有一个\
  \ `NaN` 值（IEEE 754 规定了 `2⁵³-2` 个不同的 `NaN` 值）。然而，注意，此处定义的 `float-extended-exponent`\
  \ 和 `double-extended-exponent` 数值集的元素*并不*对应于使用 IEEE 754 单精度扩展和双精度扩展格式可以表示的值。本规范未强制浮点数值集的值具有特定的表示方法，除非浮点值必须以\
  \ `class` 文件格式表示（§4.4.4，§4.4.5）。\n\n`float`、`float-extended-exponent`、`double` 和\
  \ `double-extended-exponent` 数值集并不是类型。Java 虚拟机的实现使用 `float value set` 中的元素来表示 `float`\
  \ 类型的值始终是正确的；但在某些语境下，实现使用 `float-extended-exponent value set` 中的元素可能是允许的。同样，实现使用\
  \ `double value set` 中的元素来表示 `double` 类型的值始终是正确的；但在某些语境下，实现使用 `double-extended-exponent\
  \ value set` 中的元素可能是允许的。\n\n#### 2.3.3 returnAddress 类型和值\n\n`returnAddress` 类型被\
  \ Java 虚拟机的 *jsr*、*ret* 和 *jsr_w* 指令使用（§*jsr*、§*ret*、§*jsr_w*）。`returnAddress` 类型的值是\
  \ Java 虚拟机指令的操作码的指针。该类型不对应于任何 Java 语言类型，且无法由运行程序修改。\n\n#### 2.3.4 boolean 类型\n\n\
  尽管 Java 虚拟机定义了 `boolean` 类型，但对其支持有限。没有专门用于操作 `boolean` 的 Java 虚拟机指令。相反，Java 语言中操作\
  \ `boolean` 值的表达式被编译为使用 Java 虚拟机 `int` 数据类型。\n\nJava 虚拟机直接支持 `boolean` 数组。其 *newarray*\
  \ 指令（§*newarray*）允许创建 `boolean` 数组。`boolean` 数组通过 `byte` 数组指令 *baload* 和 *bastore*\
  \ 进行访问。\n\n在 Oracle 的 Java 虚拟机实现中，Java 语言中的 `boolean` 数组被编码为 Java 虚拟机 `byte` 数组，每个\
  \ `boolean` 元素占用 8 位。\n\nJava 虚拟机使用 `1` 表示 `true`，使用 `0` 表示 `false` 来编码 `boolean`\
  \ 数组组件。当 Java 语言 `boolean` 值被编译器映射为 Java 虚拟机 `int` 值时，编译器必须使用相同的编码。\n\n### 2.4 引用类型和值\n\
  \n有三种 `reference` 类型：类类型、数组类型和接口类型。它们的值是对动态创建的类实例、数组或实现接口的类实例或数组的引用。\n\n\n\n\n数组类型由一个单维的\
  \ `component type` 组成（其长度不由类型给出）。数组类型的组件类型本身也可以是数组类型。如果从任何数组类型开始，考虑它的组件类型，然后（如果该类型也是数组类型）再考虑该类型的组件类型，依此类推，最终将将到达一个不是数组类型的组件类型；这被称为数组类型的\
  \ `element type`（元素类型）。数组类型的元素类型必然是基本类型、类类型或接口类型。\n\n`reference`（引用）值也可以特殊的空引用，即不指向任何对象的引用，在此处用\
  \ `null` 表示。`null` 引用最初没有运行时类型，但可以被强制转换为任何类型。`reference` 类型的默认值是 `null`。\n\n本规范并不强制要求\
  \ `null` 的具体值编码。\n\n## 2.5 运行时数据区域\n\nJava 虚拟机定义了在程序执行期间使用的各种运行时数据区域。这些数据区域中的某些在\
  \ Java 虚拟机启动时创建，并且仅在 Java 虚拟机退出时才销毁。其他数据区域是每个线程的。每个线程的数据区域在线程创建时创建，在线程退出时销毁。\n\n\
  ### 2.5.1 pc 寄存器\n\nJava 虚拟机可以同时支持许多执行线程（JLS §17）。每个 Java 虚拟机线程都有自己的 `pc`（程序计数器）寄存器。在任何时刻，每个\
  \ Java 虚拟机线程都在执行单个方法的代码，即该线程当前的方法（§2.6）。如果该方法不是 `native`，`pc` 寄存器包含正在执行的 Java 虚拟机指令的地址。如果线程当前执行的方法是\
  \ `native`，则 Java 虚拟机 `pc` 寄存器的值是未定义的。Java 虚拟机的 `pc` 寄存器的宽度足够容纳特定平台上的 `returnAddress`\
  \ 或原生指针。\n\n### 2.5.2 Java 虚拟机栈\n\n每个 Java 虚拟机线程都有一个私有的 `Java Virtual Machine stack`（Java\
  \ 虚拟机栈），它与线程同时创建。Java 虚拟机栈存储帧（§2.6）。Java 虚拟机栈类似于传统语言（如 C）的栈：它保存局部变量和部分结果，并在方法调用和返回中起作用。因为\
  \ Java 虚拟机栈除了推送和弹出帧外从不被直接操作，因此帧可以在堆上分配。Java 虚拟机栈的内存不需要是连续的。\n\n在 *The Java^® Virtual\
  \ Machine Specification* 的第一版中，Java 虚拟机栈被称为 `Java stack`。\n\n本规范允许 Java 虚拟机栈是固定大小的，也可以根据计算需要动态扩展和收缩。如果\
  \ Java 虚拟机栈是固定大小的，则在创建该栈时可以独立选择每个 Java 虚拟机栈的大小。\n\nJava 虚拟机实现可以为程序员或用户提供对 Java 虚拟机栈初始大小的控制，在动态扩展或收缩\
  \ Java 虚拟机栈的情况下，提供最大和最小大小的控制。\n\n以下异常情况与 Java 虚拟机栈相关：\n\n- 如果线程中的计算需要比允许的更大的 Java\
  \ 虚拟机栈，则 Java 虚拟机将抛出 `StackOverflowError`。\n- 如果 Java 虚拟机栈可以动态扩展，并且尝试扩展但无法提供足够的内存来执行扩展，或者无法提供足够的内存为新线程创建初始\
  \ Java 虚拟机栈，则 Java 虚拟机将抛出 `OutOfMemoryError`。\n\n### 2.5.3 堆\n\nJava 虚拟机有一个供所有 Java\
  \ 虚拟机线程共享的 `heap`（堆）。堆是分配所有类实例和数组内存的运行时数据区域。\n\n堆在虚拟机启动时创建。对象的堆存储由自动存储管理系统（称为 `garbage\
  \ collector`，垃圾回收器）回收；对象永远不会被显式释放。Java 虚拟机不假设特定类型的自动存储管理系统，存储管理技术可以根据实现者的系统需求进行选择。堆可以是固定大小的，也可以根据计算需要进行扩展，并在较大的堆不再需要时进行收缩。堆的内存不需要是连续的。\n\
  \nJava 虚拟机实现可以为程序员或用户提供对堆初始大小的控制，在堆可以动态扩展或收缩的情况下，提供最大和最小堆大小的控制。\n\n以下异常情况与堆相关：\n\
  \n- 如果计算需要的堆比自动存储管理系统能提供的多，则 Java 虚拟机将抛出 `OutOfMemoryError`。\n\n### 2.5.4 方法区域\n\
  \nJava 虚拟机有一个供所有 Java 虚拟机线程共享的 `method area`（方法区域）。方法区域类似于传统语言编译代码的存储区域，或类似于操作系统进程中的“text”（文本）段。它存储每个类的结构，如运行时常量池、字段和方法数据，以及方法和构造函数的代码，包括用于类、实例初始化以及接口初始化的特殊方法（§2.9）。\n\
  \n方法区域在虚拟机启动时创建。虽然方法区域在逻辑上是堆的一部分，但简单的实现可以选择不对其进行垃圾回收或压缩。本规范并不强制方法区域的位置或用于管理编译代码的策略。方法区域可以是固定大小的，也可以根据计算需要进行扩展，并在较大的方法区域不再需要时进行收缩。方法区域的内存不需要是连续的。\n\
  \nJava 虚拟机实现可以为程序员或用户提供对方法区域初始大小的控制，在方法区域大小变化的情况下，提供最大和最小方法区域大小的控制。\n\n以下异常情况与方法区域相关：\n\
  \n- 如果无法提供内存以满足分配请求，Java 虚拟机将抛出 `OutOfMemoryError`。\n\n### 2.5.5 运行时常量池\n\n`run-time\
  \ constant pool`（运行时常量池）是每个类或接口的 `class` 文件中 `constant_pool` 表（§4.4）的运行时表示。它包含了多种常量，从编译时已知的数字字面量到运行时必须解析的方法和字段引用。运行时常量池的功能类似于传统编程语言的符号表，尽管它包含的数据范围比典型的符号表广。\n\
  \n每个运行时常量池从 Java 虚拟机的方法区域分配（§2.5.4）。类或接口的运行时常量池在 Java 虚拟机创建该类或接口时构建（§5.3）。\n\n以下异常情况与类或接口运行时常量池的构建相关：\n\
  \n- 在创建类或接口时，如果构建运行时常量池需要的内存比 Java 虚拟机方法区域提供的多，则 Java 虚拟机将抛出 `OutOfMemoryError`。\n\
  \n\n\n\n\n有关运行时常量池构建的信息，请参阅 §[5 (加载、链接和初始化)。\n\n## 2.5.6 原生方法栈 (Native Method Stacks)\n\
  \nJava 虚拟机的实现可以使用传统的栈（通俗称为“C 栈”）来支持 `native` 方法（用 Java 编程语言以外的语言编写的方法）。原生方法栈也可能由使用\
  \ C 等语言实现的 Java 虚拟机指令集解释器使用。对于无法加载 `native` 方法且本身不依赖于传统栈的 Java 虚拟机实现，不需要提供原生方法栈。如果提供了，原生方法栈通常在每个线程创建时按线程进行分配。\n\
  \n本规范允许原生方法栈的大小是固定的，也可以根据计算需要动态扩展和收缩。如果原生方法栈是固定大小的，则可以在创建该栈时独立地选择每个原生方法栈的大小。\n\n\
  Java 虚拟机实现可以允许程序员或用户对原生方法栈的初始大小进行控制，并且在变长原生方法栈的情况下，可以对最大和最小方法栈大小进行控制。\n\n以下异常情况与原生方法栈相关：\n\
  \n- 如果线程中的计算所需的原生方法栈大于允许的大小，Java 虚拟机将抛出 `StackOverflowError`。\n- 如果原生方法栈可以动态扩展，但在尝试扩展原生方法栈时无法提供足够的内存，或者为新线程创建初始原生方法栈时无法提供足够的内存，Java\
  \ 虚拟机将抛出 `OutOfMemoryError`。\n\n## 2.6 帧 (Frames)\n\n`frame` 用于存储数据和部分结果，并用于执行动态链接、方法返回值以及分发异常。\n\
  \n每次调用方法时，都会创建一个新帧。当方法调用完成时，帧会被销毁，无论该完成是正常的还是异常的（即抛出了未捕获的异常）。帧从创建该帧的线程的 Java 虚拟机栈\
  \ (§2.5.2) 中分配。每个帧都有自己的局部变量数组 (§2.6.1)、自己的操作数栈 (§2.6.2) 以及指向当前方法类的运行时常量池 (§2.5.5)\
  \ 的引用。\n\n帧可以使用额外的特定于实现的信息进行扩展，例如调试信息。\n\n局部变量数组和操作数栈的大小在编译时确定，并与与帧关联的方法代码一起提供 (§4.7.3)。因此，帧数据结构的大小仅取决于\
  \ Java 虚拟机的实现，而这些结构所需的内存可以在方法调用时同时分配。\n\n在给定的控制线程中，任何时刻只有一个帧（即正在执行方法的帧）是激活的。此帧被称为\
  \ `当前帧` (current frame)，其对应的方法被称为 `当前方法` (current method)。定义当前方法的类是 `当前类` (current\
  \ class)。对局部变量和操作数栈的操作通常相对于当前帧。\n\n如果帧的方法调用了另一个方法或其方法完成，该帧将不再是当前帧。当调用方法时，会创建一个新帧，并在控制转移到新方法时成为当前帧。在方法返回时，当前帧将其方法调用的结果（如果有）传回上一个帧。随后，由于上一个帧变为当前帧，当前帧被丢弃。\n\
  \n注意，由线程创建的帧局部于该线程，不能被任何其他线程引用。\n\n### 2.6.1 局部变量 (Local Variables)\n\n每个帧 (§2.6)\
  \ 包含一个名为 `局部变量` (local variables) 的变量数组。帧的局部变量数组的长度在编译时确定，并与帧关联的方法代码一起在类或接口的二进制表示中提供\
  \ (§4.7.3)。\n\n单个局部变量可以持有 `boolean`、`byte`、`char`、`short`、`int`、`float`reference\
  \ 或 return 类型的值。一对局部变量可以持有 `long` 或 `double` 类型的值。\n\n局部变量通过索引进行寻址。第一个局部变量的索引为零。当且仅当一个整数在零到局部变量数组大小减一的范围内时，该整数才被视为局部变量数组的索引。\n\
  \n`long` 类型或 `double` 类型的值占用两个连续的局部变量。此类值只能使用较小的索引进行寻址。例如，存储在局部变量数组索引 `n` 处的 `double`\
  \ 类型的值实际上占用索引为 `n` 和 `n+1` 的局部变量；然而，无法从索引 `n+1` 处的局部变量加载。但可以将其存储其中。不过，这样做会导致局部变量\
  \ `n` 的内容失效。\n\nJava 虚拟机并不要求 `n` 为偶数。从直观上讲，`long` 和 `double` 类型的值在局部变量数组中不需要进行 64\
  \ 位对齐。实现者可以决定使用两个预留给该值的局部变量来表示此类值的适当方法。\n\nJava 虚拟机使用局部变量在方法调用时传递参数。在类方法调用时，任何参数从局部变量\
  \ `0` 开始的连续局部变量传递。在实例方法调用时，局部变量 `0` 始终用于传递调用实例方法的对象的引用（Java 语言中的 `this`）。后续参数从局部变量\
  \ `1` 开始的连续局部变量传递。\n\n### 2.6.2 操作数栈 (Operand Stacks)\n\n每个帧 (§2.6) 包含一个被称为 `操作数栈`\
  \ (operand stack) 的后进先出（LIFO）栈。帧的操作栈的最大深度在编译时确定，并与帧关联的方法代码一起提供 (§4.7.3)。\n\n在上下文明确的情况下，我们会将当前帧的操作栈简称为操作数栈。\n\
  \n当包含它的帧创建时，操作数栈是空的。Java 虚拟机提供了将常量或局部变量、字段的值加载到操作数栈的指令。其他 Java 虚拟机指令从操作数栈获取操作数，对其进行操作并将结果推回操作数栈。操作数栈还用于准备传递给方法的参数以及接收方法结果。\n\
  \n例如，`iadd` 指令 (§*iadd) 将两个 `int` 值相加。它要求相加的 `int` 值是操作数栈顶两个值，由之前的指令推入。两个 `int`\
  \ 值都会从操作数栈中弹出。它们被相加，其和被推回操作数栈。子计算可以嵌套在操作数栈上，产生可供封装计算使用的值。\n\n操作数栈上的每个条目都可以持有任何 Java\
  \ 虚拟机类型的值，包括 `long` 类型或 `double` 类型的值。\n\n\n\n\n\n操作数栈中的值必须以与其类型相符的方式进行操作。例如，无法推入两个\
  \ `int` 值后将它们视为 `long`，或者推入两个 `float` 值后随后使用 `iadd` 指令对它们进行加法。极少数 Java 虚拟机指令（`dup`\
  \ 指令（dup) 和 `swap`（swap)））以原始值的形式操作运行时数据区域，而不考虑它们的特定类型；这些指令的定义方式使得它们不能被用于修改或拆分单个值。对操作数栈操作的这些限制通过\
  \ `class` 文件验证 (4.10) 来强制。\n\n在任何时刻，操作数栈都有一个关联的深度，其中 `long` 或 `double` 类型的值对深度贡献两个单位，而其他任何类型的值贡献一个单位。\n\
  \n### 2.6.3 动态链接\n\n每个帧 (2.6) 都包含一个指向当前方法运行时常量池 (2.5.5) 的引用，以支持方法代码的*动态链接*。方法的 `class`\
  \ 文件代码通过符号引用引用要调用的方法和要访问的变量。动态链接将这些符号方法引用转换为具体的的方法引用，在需要时加载类以解析尚未定义的符号，并将变量访问转换为与这些变量运行时位置相关的存储结构中的适当偏移量。\n\
  \n这种对方法和变量的晚期绑定使得方法所使用的其他类发生变化时，破坏该代码的概率降低。\n\n### 2.6.4 方法调用的正常完成\n\n如果方法调用没有导致异常异常\
  \ (2.10)（无论是直接由 Java 虚拟机抛出，还是作为执行显式 `throw` 语句的结果），则该方法调用*正常完成*。如果当前方法的调用正常完成，则可能向调用方法返回一个值。这发生在被调用的方法执行了返回指令之一\
  \ (2.11.8) 时，这些指令的选择必须与返回值的类型（如果有）匹配。\n\n在这种情况下，当前帧 (2.6) 被用于恢复调用者的状态，包括其局部变量和操作数栈，同时调用者的程序计数器被适当增加，以跳过方法调用指令。执行随后在调用方法的帧中正常继续，并将返回的值（如果有）推入该帧的操作数栈中。\n\
  \n### 2.6.5 方法调用的异常完成\n\n如果在方法内执行 Java 虚拟机指令导致 Java 虚拟机抛出异常 (2.10)，且该异常未在方法内被处理，则该方法调用的执行方式为*异常完成*。执行\
  \ `athrow` 指令 (athrow) 也会导致显式抛出异常，如果该异常未被当前方法捕获，将导致方法调用的异常完成。异常完成的方法调用永远不会向调用者返回值。\n\
  \n### 2.7 对象的表示\n\nJava 虚拟机并不规定对象的任何特定内部结构。\n\n在 Oracle 的某些 Java 虚拟机实现中，类实例的引用是指向*句柄*的指针，句柄本身是一对指针：一个指向包含对象方法的查找表，以及一个指向表示对象类型的\
  \ `Class` 对象的指针；另一个指向从堆中分配给对象数据的内存。\n\n### 2.8 浮点数算术\n\nJava 虚拟机包含了《二进制浮点数算术 IEEE\
  \ 标准》(ANSI/IEEE Std. 754-1985, New York) 中指定的浮点算术的子集。\n\n#### 2.8.1 Java 虚拟机浮点数算术与\
  \ IEEE 754\n\nJava 虚拟机支持的浮点算术与 IEEE 754 标准之间的主要区别是：\n\n- Java 虚拟机的浮点操作不会抛出异常、陷获或其他通过方式信号\
  \ IEEE 754 的无效操作、除零、溢出、欠溢或不精确等异常情况。Java 虚拟机没有信号 NaN 值。\n- Java 虚拟机不支持 IEEE 754 信号浮点数比较。\n\
  - Java 虚拟机的舍入操作始终使用 IEEE 754 舍入最近模式。不精确的结果被舍入到最近的可表示值，平分时向最低位为零的值舍入。这是 IEEE 754\
  \ 的默认模式。但将浮点类型值转换为整型类型值的 Java 虚拟机指令会向零舍入。Java 虚拟机没有提供任何更改浮点舍入模式的手段。\n- Java 虚拟机不支持\
  \ IEEE 754 单精度扩展或双精度扩展格式，除非双精度和双扩展指数值集可以被认为支持单精度扩展格式。可选支持的浮点扩展指数值集和双精度扩展指数值集并不对应于\
  \ IEEE 754 扩展格式：IEEE 754 扩展格式需要扩展精度。\n\n#### 2.8.2 浮点模式\n\n每个方法都有一个*浮点模式*，该模式要么是严格的，要么是非严格的。方法的浮点模式由定义方法的\
  \ `method_info` (4.6) 中 `access_flags` 项的 `ACC_STRICT` 标志决定。设置了该标志的方法是严格的；否则是非严格的。注意，`ACC_STRICT`\
  \ 标志的映射意味着由 JDK 1.1 或更早版本编译的方法实际上是非严格的。\n\n当创建操作数栈帧的方法具有特定浮点模式时，我们将该操作数栈视为该浮点模式。同样，当包含该指令的方法具有特定浮点模式时，我们将该\
  \ Java 虚拟机指令视为该浮点模式。\n\n如果支持单精度扩展指数值集 (2.3.2)，则非严格的操作数栈中的 `float` 类型值可以在该值集范围内变化，除非受到值集转换\
  \ (2.8.3) 的限制。如果支持双精度指数值集 (2.3.2)，则非严格的操作数栈中的 `double` 类型值可以在该值集范围内范围内，除非受到值集转换的限制。\n\
  \n在所有其他上下文中，无论是在操作数栈还是其他地方，无论浮点模式如何，类型为 `float` 和 `double` 的浮点值只能分别在 `float` 值集和\
  \ `double` 值集范围内变化。特别是，类和实例字段、数组元素、局部变量和方法参数只能包含从标准值集提取的值。\n\n#### 2.8.3 值集转换\n\n\
  支持扩展浮点值集的 Java 虚拟机实现允许或要求在特定情况下，将关联浮点类型的值在扩展值集和标准值集之间进行映射。这种*值集转换*不是类型转换，而是相同类型相关值集之间的映射。\n\
  \n\n\n\n\n在指示需要值集转换时，实现允许对一个值执行以下操作之一：\n\n- 如果该值类型为`float`且不是浮点数值集中的元素，则将该值映射到浮点数值集中最近的元素。\n\
  - 如果该值类型为`double`且不是双精度数值集中的元素，则将该值映射到双精度数值集中最近的元素。\n\n此外，在指示需要值集转换时，需要执行某些操作：\n\
  \n- 假设执行非 FP-strict 的 Java 虚拟机指令导致类型为`float` 的值被推入 FP-strict 的操作数栈中、作为参数传递、或存储到局部变量、字段或数组元素中。如果该值不是浮点数值集中的元素，则将该值映射到浮点数值集中最近的元素。\n\
  - 假设执行非 FP-strict 的 Java 虚拟机指令导致类型为`double` 的值被推入 FP-strict 的操作数栈中、作为参数传递、或存储到局部变量、字段或数组元素中。如果该值不是双精度数值集中的元素，则将该值映射到双精度数值集中最近的元素。\n\
  \n此类强制的值集转换可能由于在方法调用期间传递浮点类型的参数而发生，包括`native` 方法调用；从非 FP-strict 的方法向 FP-strict 方法返回浮点类型的值；或者在非\
  \ FP-strict 的方法中将浮点类型的值存储到局部变量、字段或数组中。\n\n并不是所有来自扩展指数值集的值都能精确映射到对应标准值集中的某个值。如果被映射的值太大而无法精确表示（其指数超过了标准值集允许的范围），则将其转换为对应类型的（正或负的）无穷大。如果被映射的值太小而无法精确表示（其指数小于标准值集允许的范围），则将其舍入到相同符号的可表示的正规化值或零中最近的数值。\n\
  \n值集转换保留无穷大和 NaN，且不能改变被转换值的符号位。值集转换对非浮点类型的值没有影响。\n\n### 2.9 特殊方法\n\n在 Java 虚拟机层面，用\
  \ Java 语言编写的每个构造方法（JLS §8.8）都表现为一个具有特殊名称 `<init>` 的*实例初始化方法*。该名称由编译器提供。由于名称 `<init>`\
  \ 不是有效的标识符，因此在用 Java 语言编写的程序中无法直接使用。实例初始化方法只能在 Java 虚拟机通过 `invokespecial` 指令调用，且只能在未初始化的类实例上调用。实例初始化方法继承其派生自构造方法的访问权限（JLS\
  \ §6.6）。\n\n一个类或接口最多有一个*类或接口初始化方法*，并通过调用该方法进行初始化。类或接口的初始化方法具有特殊名称 `<clinit>`，不接受参数，且返回类型为\
  \ `void`。\n\n`class` 文件中其他名为 `<clinit>` 的方法没有意义。它们不是类或接口初始化方法。它们不能被任何 Java 虚拟机指令调用，也永远不会被\
  \ Java 虚拟机本身调用。\n\n在版本号为 51.0 或以上的 `class` 文件中，该方法必须额外设置其 `ACC_STATIC` 标志才能作为类或接口初始化方法。\n\
  \n这一要求是在 Java SE 7 中引入的。在版本号为 50.0 或以下的 `class` 文件中，名为 `<clinit>`、返回类型为 `void` 且不接受参数的方法被视为类或接口初始化方法，无论其\
  \ `ACC_STATIC` 标志如何设置。\n\n名称 `<clinit>` 由编译器提供。由于名称 `<clinit>` 不是有效的标识符，因此在用 Java\
  \ 语言编写的程序中无法直接使用。类和接口初始化方法由 Java 虚拟机隐式调用；它们永远不会从任何 Java 虚拟机指令直接调用，而是作为类初始化过程的一部分间接被调用。\n\
  \n如果满足以下所有条件，则该方法是*签名多态的*（signature polymorphic）：\n\n- 它声明于 `java.lang.invoke.MethodHandle`\
  \ 类。\n- 它有一个类型为 `Object[]` 的单一形式参数。\n- 它的返回类型为 `Object`。\n- 它设置了 `ACC_VARARGS` 和\
  \ `ACC_NATIVE` 标志。\n\n在 Java SE 8 中，唯一的签名多态方法是 `java.lang.invoke.MethodHandle` 类的\
  \ `invoke` 和 `invokeExact` 方法。\n\nJava 虚拟机在 `invokevirtual` 指令中对签名多态方法进行特殊处理，以实现*方法句*（method\
  \ handle）的调用。方法句是一个指向底层方法、构造方法、字段或类似的低级操作的强类型、直接执行的引用。这些转换是非常通用的，包含了转换、插入和替换等模式。更多信息请参见\
  \ Java SE 平台 API 中的 `java.lang.invoke` 包。\n\n### 2.10 异常\n\nJava 虚拟机中的异常由 `Throwable`\
  \ 类的实例或其子类之一表示。抛出异常会导致控制从抛出异常点立即发生非局部转移。\n\n大多数异常是同步发生的，其由于其发生所在线程的操作导致的。相比之下，异步异常可能在程序执行的任何点发生。Java\
  \ 虚拟机出于三个原因之一抛出异常：\n\n- 执行了 `athrow` 指令。\n- Java 虚拟机同步检测到异常执行状态。这些异常不会在程序的任意点抛出，而是在执行以下指令后同步抛出的：\n\
  \    - 指令将异常指定为可能的结果，例如：\n        - 指令包含了违反 Java 语言语义的操作，例如访问数组边界之外。\n        -\
  \ 在加载或链接程序部分时发生错误。\n    - 导致某些资源限制被超出，例如使用内存过多。\n- 发生异步异常是由于：\n    - 调用了 `Thread`\
  \ 类或 `ThreadGroup` 类的 `stop` 方法，或\n    - Java 虚拟机实现内部发生了错误。\n\nJava 虚拟机可能会在抛出异步异常之前允许少量的但有界的执行发生。允许这种延迟是为了优化后的代码能够在符合\
  \ Java 语言语义的实际点检测并抛出这些异常。\n\n\n\n\n\n一种简单的实现可以在每个控制转移指令点对异步异常进行轮询。由于程序的大小是有限的，这为检测异步异常的总延迟提供了一个边界。由于在控制转移之间不会发生异步异常，代码生成器具有一定的灵活性，可以重新排列控制转移之间的计算顺序以提高性能。建议进一步阅读\
  \ Marc Feeley 写的论文 *Polling Efficiently on Stock Hardware*，发表于 *Proc. 1993 Conference\
  \ on Functional Programming and Computer Architecture*，丹麦哥本哈根，第 179-187 页。\n\nJava\
  \ 虚拟机（Java Virtual Machine）抛出的异常是精确的：当控制转移发生时，抛出异常点之前执行的所有指令的影响必须表现为已经发生。异常抛出点之后的任何指令都不应该表现为已经评估。如果优化后的代码推测执行执行了异常发生点之后的某些指令，则此类代码必须准备好将这种推测执行从程序的用户可见状态中隐藏。。\n\
  \nJava 虚拟机中的每个方法都可能关联零个或多个*异常处理器*（exception handlers）。异常处理器指定了实现该方法的 Java 虚拟机代码中异常处理器的偏移量范围，描述了异常处理器能够处理的异常类型，并指定了用于处理该异常的代码位置。如果导致异常的指令偏移量在异常处理器的偏移量范围内，且异常类型与异常处理器处理的异常类相同或为其子类，则异常与异常处理器匹配。当抛出异常时，Java\
  \ 虚拟机会在当前方法中搜索匹配的异常处理器。如果找到匹配的异常处理器，系统将跳转到由匹配处理器指定的异常处理代码。\n\n如果在当前方法中没有找到此类异常处理器，则当前方法的调用将异常终止（§2.6.5）。在异常终止时，当前方法调用的操作数栈和局部变量被丢弃，其栈帧被弹出，恢复调用者方法的栈帧。随后，异常将在调用者栈帧的范围内重新抛出，依此类推，沿着方法调用链继续向上。如果在到达方法调用链顶端之前没有找到合适的异常处理器，则抛出异常的线程的执行将终止。\n\
  \n搜索方法异常处理器以匹配的顺序是非常重要的。在`class`文件中，每个方法的异常处理器存储在一个表表中（§4.7.3）。运行时，当抛出异常时，Java 虚拟机按照它们在`class`文件对应的异常处理器表中出现的顺序搜索当前方法的异常处理器，从该表的开始处。\n\
  \n注意，Java 虚拟机并不强制方法异常表条目的嵌套或任何排序。Java 编程语言的异常处理语义仅通过与编译器的协作来实现（§3.12）。当通过其他手段生成`class`文件时，定义的搜索程序确保了所有\
  \ Java 虚拟机实现的行为是一致的。\n\n### 2.11 指令集摘要\n\nJava 虚拟机指令由一个字节的`opcode`（操作码）组成，用于指定要执行的操作，随后是零或多个`operands`（操作数），用于提供操作操作所需的参数或数据。许多指令没有操作数，仅由一个`opcode`组成。\n\
  \n忽略异常，Java 虚拟机解释器的内部循环实际上是：\n\n点击此处查看代码图像\n\n```\ndo {\n    atomically calculate\
  \ pc and fetch opcode at pc;\n    if (operands) fetch operands;\n    execute the\
  \ action for the opcode;\n} while (there is more to do);\n```\n\n操作数的数量和大小由`opcode`决定。如果操作数的大小大于一个字节，则它以*大端*（big-endian）顺序存储——高位字节在前。例如，指向局部变量的无符号\
  \ 16 位索引存储两个无符号字节`byte1`和`byte2`，其值为（`byte1` << 8) | `byte2`）。\n\n字节码指令流仅按字节对齐。两种异常是`lookupswitch`和`tableswitch`指令（§*lookupswitch*、§*tableswitch*），这些指令经过填充，以强制其某些操作数在\
  \ 4 字节边界上进行内部对齐。\n\n将 Java 虚拟机的操作码限制为一个字节，并放弃编译后代码中的数据对齐的决定，反映了对紧凑性的意识偏好，这可能是以牺牲某些实现中的性能为代价的。单字节操作码也限制了指令集的大小。不假设数据对齐意味着在许多机器上，大于一个字节的立即数据必须在运行时从字节构造出来。\n\
  \n#### 2.11.1 类型与 Java 虚拟机\n\nJava 虚拟机指令集中的大多数指令都编码了关于其执行的操作类型信息。例如，`iload`指令（§*iload*）将局部变量的内容（必须是`int`）加载到操作数栈上。`fload`指令（§*fload*）对`float`值执行相同的操作。这两条指令可能具有相同的实现，但具有不同的操作码。\n\
  \n对于大多数类型化指令，指令类型通过操作码中的字母明确表示：`i`表示`int`操作，`l`表示`long`，`s`表示`short`，`b`表示`byte`，`c`表示`char`，`f`表示`float`，`d`表示`double`，`a`表示引用。某些类型明确的指令，其助记符中不包含类型字母。例如，`arraylength`始终操作一个数组对象。某些指令（如无条件转移的`goto`）不操作类型操作数。\n\
  \n由于 Java 虚拟机单字节操作码的大小，将类型编码进操作码对其指令集的设计带来了压力。如果每个类型化指令都支持 Java 虚拟机的所有运行时数据类型，那么指令数量将超过字节表示表示范围。相反，Java\
  \ 虚拟机的指令集对某些操作提供了较低水平的类型支持。换句话说，指令集故意不是正交的。必要时，可以使用单独的指令在不支持的支持的数据类型之间进行转换。\n\n\
  表 2.11.1-A 总结了 Java 虚拟机指令集中的类型支持。特定的带有类型信息的指令通过将操作码列中指令模板中的*T*替换为类型列中的字母来构建。如果某些指令模板和类型的类型列为空，则不存在支持该类型操作的指令。例如，有一个类型`int`的加载指令`iload`，但没有类型`byte`的加载指令。\n\
  \n\n\n\n\n注意，表 2.11.1-A 中的大多数指令没有为 `byte`、`char` 和 `short` 整数类型提供形式。没有指令为 `boolean`\
  \ 类型提供形式。编译器在对 `byte` 和 `short` 类型字面值进行加载时，使用 Java 虚拟机指令，这些指令在编译时或运行时将这些值符号扩展为 `int`\
  \ 类型的值。对 `boolean` 和 `char` 类型字面值的加载是使用某些指令进行编码的，这些指令在编译时或运行时将字面值零扩展为 `int` 类型的值。同样，从\
  \ `boolean`、`byte`、`short` 和 `char` 类型值的数组加载是使用 Java 虚拟机指令进行编码的，这些指令将值符号扩展或零扩展为\
  \ `int` 类型的值。因此，对实际类型 `boolean`、`byte`、`char` 和 `short` 值的大多数操作都是通过操作计算类型 `int`\
  \ 值的指令正确完成的。\n\n\n**表 2.11.1-A. Java 虚拟机指令集中的类型支持**\n\nJava 虚拟机实际类型与 Java 虚拟机计算类型之间的映射总结在表\
  \ 2.11.1-B 中。\n\n\n**表 2.11.1-B. Java 虚拟机中的实际类型和计算类型**\n\n某些 Java 虚拟机指令如 `pop` 和\
  \ `swap` 在操作数栈上操作时不考虑类型；然而，这些指令被限制仅用于某些特定计算类型的值，这些类型在表 2.11.1-B 中给出。\n\n### 2.11.2\
  \ 加载和存储指令\n\n加载和存储指令在 Java 虚拟机帧（§2.6）的局部变量（§2.6.1）和操作数栈（§2.6.2）之间传输值：\n\n- 将局部变量加载到操作数栈：`iload`,\
  \ `iload_<n>`, `lload`, `lload_<n>`, `fload`, `fload_<n>`, `dload`, `dload_<n>`,\
  \ `aload`, `aload_<n>`。\n- 将操作数栈中的值存储到局部变量：`istore`, `istore_<n>`, `lstore`, `lstore_<n>`,\
  \ `fstore`, `fstore_<n>`, `dstore`, `dstore_<n>`, `astore`, `astore_<n>`。\n- 将常量加载到操作数栈：`bipush`,\
  \ `sipush`, `ldc`, `ldc_w`, `ldc2_w`, `aconst_null`, `iconst_m1`, `iconst_<i>`,\
  \ `lconst_<l>`, `fconst_<f>`, `dconst_<d>`。\n- 使用更宽的索引或更大的立即数访问更多的局部变量：`wide`。\n\
  \n访问对象字段和数组元素（§2.11.5）的指令也与操作数栈之间传输数据。上述所示带有角括号间后缀字母的指令助记符（例如，`iload_<n>`）表示一族指令（对于\
  \ `iload_<n>`，成员为 `iload_0`、`iload_1`、`iload_2` 和 `iload_3`）。此类族是接受一个操作数的额外通用指令（`iload`）的特化。对于特化指令，操作数是隐式的，不需要存储或获取。角括号之间的字母指定了该族隐式操作数的类型：对于`<n>`，是非负整数；对于`<i>`，是\
  \ `int`；对于`<l>`，是 `long`；对于`<f>`，是 `float`；对于`<d>`，是 `double`。许多情况下，类型 `int` 的形式被用于对\
  \ `byte`、`char` 和 `short` 值执行操作（§2.11.1）。这种指令族的表示法贯穿始终。\n\n### 2.11.3 算术指令\n\n算术指令计算一个结果，该结果通常是操作数栈上两个值的函数，并将结果推回操作数栈。算术指令主要分为两类：操作整数值的指令和操作浮点数值的指令。在每种类型中，算术指令都针对\
  \ Java 虚拟机的数值类型进行了特化。对于 `byte`、`short` 和 `char` 类型的值没有直接的整数算术支持（§2.11.1），对于 `boolean`\
  \ 类型的值也没有直接支持；这些操作由操作类型 `int` 值的指令处理。整数和浮点指令在溢出和除以零的行为上也不同。算术指令如下：\n\n- 加法：`iadd`,\
  \ `ladd`, `fadd`, `dadd`。\n- 减法：`isub`, `lsub`, `fsub`, `dsub`。\n- 乘法：`imul`, `lmul`,\
  \ `fmul`, `dmul`。\n- 除法：`idiv`, `ldiv`, `fdiv`, `ddiv`。\n- 余数：`irem`, `lrem`, `frem`,\
  \ `drem`。\n- 取负：`ineg`, `lneg`, `fneg`, `dneg`。\n- 移位：`ishl`, `ishr`, `ushl`, `lshr`,\
  \ `lushr`。\n- 位或：`ior`, `lor`。\n- 位与：`iand`, `land`。\n- 位异或：`ixor`, `lxor`。\n- 局部变量自增自减：`iinc`。\n\
  - 比较：`dcmpg`, `dcmpl`, `fcmpg`, `fcmpl`, `lcmp`。\n\nJava 语言运算符对浮点值的操作语义（JLS §4.2.4）由\
  \ Java 虚拟机指令集直接支持。Java 虚拟机在整数类型上进行算术运算时不指示溢出。唯一会抛出异常的整数操作是除法指令（`idiv` 和 `ldiv`）和余数指令（`irem`\
  \ 和 `lrem`），当除数为零时。\n\nJava 虚拟机对浮点数的操作遵循 IEEE 754 标准。溢出操作产生符号无穷，下溢操作产生规格化值或符号零，而无数学上确定结果的操作产生\
  \ NaN。所有以 NaN 为操作数的数值运算都会产生 NaN。\n\nJava 虚拟机的浮点运算符不抛出运行时异常（与 IEEE 754 浮点异常混淆）。Java\
  \ 虚拟机完全支持 IEEE 754 规格化浮点数，这使得证明特定算法的属性变得更容易。\n\nJava 虚拟机要求浮点运算的行为是将无限精确的结果舍入到结果精度。如果两个最近的可表示值相等，则选择最低位为零的那个。这是\
  \ IEEE 754 标准的默认舍入模式，被称为“舍入到最近”。\n\nJava 虚拟机在将浮点值转换为整数时使用 IEEE 754 “向零舍入”模式。这导致数字被截断；操作数值表示部分的任何位都被丢弃。向零舍入模式选择在绝对值上接近且不大于无限精确结果的类型值。\n\
  \n### 2.11.4 类型转换指令\n\n类型转换指令允许在 Java 虚拟机数值类型之间进行转换。这些指令可以用于用户代码中的显式转换，或缓解 Java\
  \ 虚拟机指令集缺乏正交性的问题。\n\nJava 虚拟机直接支持以下宽数值转换：\n\n- `int` 到 `long`、`float` 或 `double`\n\
  - `long` 到 `float` 或 `double`\n- `float` 到 `double`\n\n\n\n\n\n扩展数值转换指令有 `i2l`、`i2f`、`i2d`、`l2f`、`l2d`\
  \ 和 `f2d`。由于类型指令的命名约定以及将 2 用于表示“到”（to）的用法，这些操作码的助记符直观易懂。例如，`i2d` 指令将 `int` 值转换为\
  \ `double`。\n\n大多数扩展数值转换不会丢失关于数值整体量级的信息。事实上，从 `int` 到 `long` 以及从 `int` 到 `double`\
  \ 的扩展转换完全没有丢失任何信息；数值被精确地保留。从 `float` 到 `double` 且符合 FP 严格（FP-strict，§2.8.2) 的扩展转换也会精确保留数值；只有此类非\
  \ FP 严格的转换可能会丢失关于转换值整体量级的信息。\n\n从 `int` 到 `float`、从 `long` 到 `float`、或从 `long` 到\
  \ `double` 的转换可能会丢失`精度`，即可能会丢失数值的某些低有效位；生成的浮点值是使用 IEEE 754 舍舍入模式对整数值进行正确舍入后的版本。\n\
  \n尽管可能会发生精度的损失，但扩展数值转换永远不会导致 Java 虚拟机抛出运行时异常（不要与 IEEE 754 浮点异常混淆）。\n\n从 `int` 到\
  \ `long` 的扩展数值转换仅是将 `int` 值的补码表示进行符号扩展，以填充更宽的格式。从 `char` 到整型类型的扩展数值转换是将 `char` 值的表示进行零扩展，以填充更宽的格式。\n\
  \n注意，并不存在从整型类型 `byte`、`char` 和 `short` 到类型 `int` 的扩展数值转换。正如 §2.11.1 所述，`byte`、`char`\
  \ 和 `short` 类型的值在内部被扩展为 `int` 类型，使得这些转换是隐式的。\n\nJava 虚拟机还直接支持以下收缩数值转换：\n\n- `int`\
  \ 到 `byte`、`short` 或 `char`\n- `long` 到 `int`\n- `float` 到 `int` 或 `long`\n- `double`\
  \ 到 `int`、`long` 或 `float`\n\n收缩数值转换指令有 `i2b`、`i2c`、`i2s`、`l2i`、`f2i`、`f2l`、`d2i`、`d2l`\
  \ 和 `d2f`。收缩数值转换可能导致不同的符号、不同的数量级或两者都有；因此可能会丢失精度。\n\n从 `int` 或 `long` 到整型 `T` 的收缩数值转换简单丢弃除\
  \ *n* 个低位以外的所有位，其中 *n* 是表示类型 `T` 所使用的位数。这可能导致结果值与输入值具有不同的符号。\n\n在浮点值到整型 `T` 的收缩数值转换中（其中\
  \ `T` 为 `int` 或 `long`），浮点值的转换方式如下：\n\n- 如果浮点值为 NaN，则转换结果为 `int` 或 `long` 的 `0`。\n\
  - 否则，如果浮点值不是无穷大，则使用 IEEE 754 向零舍入模式将浮点值舍入为整数值 `V`。有两种情况：\n  - 如果 `T` 是 `long` 且该整数值可以表示为\
  \ `long`，则结果为 `long` 值 `V`。\n  - 如果 `T` 是 `int` 类型且该整数值可以表示为 `int`，则结果为 `int` 值\
  \ `V`。\n- 否则：\n  - 或者该值太小（大数量级的负值或负无穷），结果为类型 `int` 或 `long` 的最小可表示值。\n  - 或者该值太大（大数量级的正值或正无穷），结果为类型\
  \ `int` 或 `long` 的最大可表示值。\n\n从 `double` 到 `float` 的收缩数值转换遵循 IEEE 754 标准。结果使用 IEEE\
  \ 754 舍入舍入模式进行正确舍入。小到无法表示为 `float` 的值被转换为 `float` 的正零或负零；大到无法表示为 `float` 的值被转换为正无穷或负无穷。`double`\
  \ NaN 总是转换为 `float` NaN。\n\n尽管可能会发生溢出、下溢或精度损失，但数值类型之间的收缩转换永远不会导致 Java 虚拟机抛出运行时异常（不要与\
  \ IEEE 754 浮点异常混淆）。\n\n### 2.11.5 创建与操作\n\n尽管类实例和数组都是对象，但 Java 虚拟机使用不同的指令集来创建和操作类实例及数组：\n\
  \n- 创建新类实例：`new`。\n- 创建新数组：`newarray`、`anewarray`、`multianewarray`。\n- 类的字段（`static`\
  \ 字段，称为类变量）和类实例字段（非 `static` 字段，称为实例变量）：`getfield`、`putfield`、`getstatic`、`putstatic`。\n\
  - 将数组组件加载到操作栈：`baload`、`caload`、`saload`、`iaload`、`laload`、`faload`、`daload`、`aaload`。\n\
  - 将操作栈的值存储为数组组件：`bastore`、`castore`、`sastore`、`iastore`、`lastore`、`fastore`、`dastore`、`aastore`。\n\
  - 获取数组长度：`arraylength`。\n- 检查类实例或数组：`instanceof`、`checkcast`。\n\n### 2.11.6 操作栈管理指令\n\
  \n提供了若干直接操作操作栈的操作：`pop`、`pop2`、`dup`、`dup2`、`dup_x1`、`dup2_x1`、`dup_x2`、`dup2_x2`、`swap`。\n\
  \n### 2.11.7 跳转指令\n\n跳转指令条件或无条件地导致 Java 虚拟机执行跳转指令之外的指令。它们是：\n\n- 条件分支：`ifeq`、`ifne`、`iflt`、`ifle`、`ifgt`、`ifge`、`ifnull`、`ifnonnull`、`if_icmpeq`、`if_icmpne`、`if_icplt`、`if_icple`、`if_icmpgt`、`if_icmpge`、`if_acmpeq`、`if_acmp`。\n\
  - 复合条件分支：`tableswitch`、`lookupswitch`。\n- 无条件分支：`goto`、`goto_w`、`jsr`、`jsr_w`、`ret`。\n\
  \nJava 虚拟机拥有针对 `int` 和引用类型的不同条件跳转指令集。它还有用于测试空引用的条件跳转指令，因此不需要为 `null` 指定具体值（§2.4）。\n\
  \n`boolean`、`byte`、`char` 和 `short` 类型之间的条件跳转通过 `int` 比较指令执行（§2.11.1）。`long`、`float`\
  \ 或 `double` 类型之间的条件跳转通过比较数据并产生 `int` 比较结果的指令启动（§2.11.3）。随后的 `int` 比较指令测试此结果并实现条件跳转。由于强调了\
  \ `int` 比较，Java 虚拟机为 `int` 类型提供了丰富的条件跳转指令。\n\n所有 `int` 条件跳转指令均执行符号比较。\n\n### 2.11.8\
  \ 方法调用与返回指令\n\n以下五条指令调用方法：\n\n- `invokevirtual` 调用对象的实例方法，根据对象的（虚拟）类型进行分发。这是 Java\
  \ 编程语言中标准的方法分发。\n- `invokeinterface` 调用接口方法，搜索特定运行时对象实现的方法以找到合适的方法。\n- `invokespecial`\
  \ 调用需要特殊处理的实例方法，无论是实例初始化方法（§2.9）、`private` 方法或父类方法。\n- `invokestatic` 调用命名类中的类（`static`）方法。\n\
  \n\n\n\n\n`invokedynamic` 调用绑定到 `invokedynamic` 指令的调用点对象的目标方法。由于 Java 虚拟机在首次执行该指令之前运行了引导方法（bootstrap\
  \ method），虚拟机会将调用点对象绑定到 `invokedynamic` 指令的一个特定的词法出现位置。因此，与其他调用方法的指令不同，每个 `invokedynamic`\
  \ 指令的出现处都有一个唯一的链接状态。\n\n方法返回指令根据返回类型进行区分，包括 `ireturn`（用于返回类型为 `boolean`、`byte`、`char`、`short`\
  \ 或 `int` 的值）、`lreturn`、`freturn`、`dreturn` 和 `areturn`。此外，`return` 指令用于从声明为 `void`\
  \ 的方法、实例初始化方法以及类或接口初始化方法中返回。\n\n### 2.11.9 抛出异常\n\n可以使用 `athrow` 指令在程序中抛出异常。如果各种\
  \ Java 虚拟机指令检测到异常状态，它们也可以抛出异常。\n\n### 2.11.10 同步\n\nJava 虚拟机通过单一同步构造结构——`monitor`\
  \ 支持对方法以及方法内部指令序列的同步。\n\n方法级同步是作为方法调用和返回的一部分隐式执行的 (§2.11.8)）。`synchronized` 方法通过运行时常量池中的\
  \ `method_info` 结构 (§4.6) 中的 `ACC_SYNCHRONIZED` 标志来加以区分，方法调用指令会检查该标志。当调用设置了 `ACC_SYNCHRONIZED`\
  \ 方法时，执行线程进入 monitor，调用方法本身，并无论方法调用是正常完成还是异常终止都会退出 monitor。在执行线程拥有 monitor 的期间，其他线程均无法进入。如果在调用\
  \ `synchronized` 方法期间抛出异常，且该方法没有处理该异常，则在异常重新抛出 `synchronized` 方法之前，该方法的 monitor\
  \ 将被自动退出。\n\n指令序列的同步通常用于编码 Java 编程语言中的 `synchronized` 块。Java 虚拟机提供了 `monitorenter`\
  \ 和 `monitorexit` 指令来支持此类语言结构。`synchronized` 块的正确实现需要目标为 Java 虚拟机的编译器的配合 (§3.14)。\n\
  \n结构化锁是指在方法调用期间，给定 monitor 的每次退出都与该 monitor 之前的某次进入相匹配。由于无法保证所有提交到 Java 虚拟机的代码都会执行结构化锁，Java\
  \ 虚拟机的实现允许但并不要求强制执行以下两个保证结构化锁的规则。设 `T` 为线程，`M` 为 monitor。那么：\n\n1. 在方法调用期间，`T` 在\
  \ `M` 上执行的 monitor 进入次数必须等于 `T` 在该方法调用期间在 `M` 上执行的 monitor 退出次数，无论方法调用是正常完成还是异常终止。\n\
  \n2. 在方法调用期间的任何时刻，`T` 自方法调用以来在 `M` 上执行的 monitor 退出次数不得超过 `T` 自方法调用以来在 `M` 上执行的 monitor\
  \ 进入次数。\n\n注意，在调用 `synchronized` 方法时虚拟机自动执行的 monitor 进入和退出被认为发生在调用方法的执行期间。\n\n###\
  \ 2.12 类库\n\nJava 虚拟机必须为 Java SE 平台类库的实现提供足够的支持。这些类库中的某些类如果没有 Java 虚拟机的配合将无法实现。\n\
  \n可能需要 Java 虚拟机特殊支持的类包括：\n\n- 反射，例如 `java.lang.reflect` 包中的类和 `Class` 类。\n- 类或接口的加载与创建。最明显的例子是\
  \ `ClassLoader` 类。\n- 类或接口的链接与初始化。上述引用的类也属于这一类。\n- 安全性，例如 `java.security` 包中的类以及如\
  \ `SecurityManager` 等类。\n- 多线程，例如 `Thread` 类。\n- 弱引用，例如 `java.lang.ref` 包中的类。\n\n\
  上述列表仅用于说明，而非详尽列。这些类或它们提供的功能的详尽列表超出了本规范的范围。详情请参阅 Java SE 平台类库规范。\n\n### 2.13 公共设计、私有实现\n\
  \n到目前为止，本规范描绘了 Java 虚拟机的公共视图：`class` 文件格式和指令集。这些组件对于 Java 虚拟机的硬件、操作系统和实现上的无关性至关重要。实现者可能倾向于将它们视为在各个实现\
  \ Java SE 平台的宿主机之间安全通信程序片段的手段，而非必须严格遵循的蓝图。\n\n理解公共设计与私有实现之间的界限在哪里至关重要。Java 虚拟机实现必须能够读取\
  \ `class` 文件，并必须精确实现其中 Java 虚拟机代码的语义。实现此点的一种方法是将本文视为规范并从字面上地实现该规范。但实现者在规范的限制范围内对实现进行修改或优化也是完全可行且理想的。只要\
  \ `class` 文件格式可以被读取且其代码的语义得以维护，实现者可以以任何方式实现这些语义。只要仔细维护了正确的外部接口，“内部实现”如何是实现者的事务。\n\
  \n但存在一些例外：调试器、性能分析器和即时（代码）生成器每个可能都需要访问通常被认为是“内部实现”的 Java 虚拟机元素。在适当的情况下，Oracle 与其他\
  \ Java 虚拟机实现者以及工具供应商合作，开发供此类工具使用的 Java 虚拟机通用接口，并在整个行业内推广这些接口。\n\n实现者可以利用这种灵活性，针对高性能、低内存占用或可移植性来定制\
  \ Java 虚拟机实现。在给定的实现中，什么合理取决于该实现的目标。实现方案的范围包括：\n\n- 在加载时或执行期间将 Java 虚拟机代码转换为另一个虚拟机的指令集。\n\
  - 在加载时或执行期间将 Java 虚拟机代码转换为宿主机 CPU 的原生指令集（有时称为*即时*，或 *JIT*，代码生成）。\n\n精确定义的虚拟机和对象文件格式的存在，并不需要极大地限制实现者的创造力。Java\
  \ 虚拟机的设计目标是支持多种不同的实现，在提供新颖有趣的解决方案的同时，保持实现之间的兼容性。\n\n\n\n\nJava 虚拟机（Java Virtual\
  \ Machine）的设计是为了支持 Java 编程语言。Oracle 的 `JDK` 软件包含一个编译器，它可以将 Java 语言编写的源代码编译为 Java\
  \ 虚拟机指令集，以及一个实现 Java 虚拟机本身的运行时系统。理解编译器如何利用 Java 虚拟机，对于潜在的编译器编写者以及试图理解 Java 虚拟机本身的人来说，都是非常有用的。本章中的编号章节并非强制性。\n\
  \n请注意，“编译器”一词有时也用于指从 Java 虚拟机指令集到特定 CPU 指令集的翻译器。这种翻译器的一个例子是即时编译（JIT）代码生成器，它只在 Java\
  \ 虚拟机代码被加载后才生成针对特定平台的指令。本章不涉及代码生成相关的问题，仅涉及将 Java 编程语言编写的源代码编译为 Java 虚拟机指令的问题。\n\n\
  ### 3.1 示例格式\n\n本章主要由源代码示例，以及 Oracle `JDK` 版本 1.0.2 中的 `javac` 编译器为这些示例生成的 Java\
  \ 虚拟机代码列表组成。Java 虚拟机代码是用随 `JDK` 发布的 `javap` 工具输出的非正式“虚拟机汇编语言”编写的。你可以使用 `javap` 生成编译方法的额外示例。\n\
  \n示例的格式对于任何读过汇编代码的人来说都是熟悉的。每条指令的格式如下：\n\n点击此处查看代码图像\n\n```\n<index> <opcode> [ <operand1>\
  \ [ <operand2>... ]] [<comment>]\n```\n\n`<index>` 是该方法对应的 Java 虚拟机代码字节数组中，指令操作码（opcode）的索引。或者，`<index>`\
  \ 可以被看作从方法开始的字节偏移。`<opcode>` 是指令操作码的助记符，而一个或多个 `<operandN>` 是指令的操作数。可选的 `<comment>`\
  \ 采用行尾注释语法给出：\n\n点击此处查看代码图像\n\n```\n8   bipush 100     // Push int constant 100\n\
  ```\n\n注释中的部分内容由 `javap` 输出，其余部分由作者提供。置于每条指令之前的 `<index>` 可以作为控制转移指令的目标。例如，`goto\
  \ 8` 指令将控制转移到索引为 8 的指令。注意，Java 虚拟机控制转移指令的实际操作数是相对于这些指令操作码地址的偏移量；这些操作数由 `javap` 显示（在本章中显示）为更易读的方法内偏移量。\n\
  \n我们在表示运行时常量池索引的操作数前加上一个哈希符号 `#`，并在指令后跟一个注释，以标识所引用的运行时常量池项，如下所示：\n\n点击此处查看代码图像\n\
  \n```\n10  ldc #1           // Push float constant 100.0\n```\n\n或者：\n\n点击此处查看代码图像\n\
  \n```\n9   invokevirtual #4   // Method Example.addTwo(II)I\n```\n\n为了本章的目的，我们不关心指定操作数大小等细节。\n\
  \n\n\n\n\nJava 虚拟机对局部变量的某些非常频繁的操作进行了专门处理。`iinc` 指令通过一个单字节的符号整数值来增加局部变量的内容。`spin`\
  \ 示例中的 `iinc` 指令将第一个局部变量（其第一个操作数）增加 `1`（其第二个操作数）。在实现循环结构时，`iinc` 指令非常好。\n\n`spin`\
  \ 的 `for` 循环主要通过这些指令完成：\n\n点击此处查看图像\n\n```\n5   iinc 1 1        // 将局部变量 1 增加 1\
  \ (i++)\n8   iload_1        // 将局部变量 1 (i) 推入栈\n9   bipush 100      // 推入 int 常数\
  \ 100\n11  if_icmplt 5     // 如果小于则循环 (i < 100)\n```\n\n`bipush` 指令将值 `100` 作为 `int`\
  \ 推入操作数栈，然后 `if_icmplt` 指令从操作数栈弹出该值并将其与 `i` 进行比较。如果比较成功（变量 `i` 小于 `100`），控制转移到索引\
  \ `5` 并开始 `for` 循环的下次迭代。否则，控制传递到 `if_icmplt` 之后的指令。\n\n如果 `spin` 示例使用了 `int` 以外的数据类型作为循环计数器，编译后的代码将被迫更改以反映不同的数据类型。例如，如果\
  \ `spin` 示例使用 `double` 而不是 `int`，如下所示：\n\n点击此处查看图像\n\n```javavoid dspin() {\n  \
  \  double i;\n    for (i = 0.0; i < 100.0; i++) {\n        ;    // 循环体为空\n    }\n\
  }\n```\n\n编译后的代码为：\n\n点击此处查看图像\n\n```\nMethod void dspin()\n0   dconst_0       \
  \ // 推入 double 常数 0.0\n1   dstore_1        // 存储到局部变量 1 和 2\n2   goto 9        \
  \   // 第一次通过时不递增\n5   dload_1        // 推入局部变量 1 和 2\n6   dconst_1        // 推入\
  \ double 常数 1.0\n7   dadd            // 加法；没有 dinc 指令\n8   dstore_1        // 将结果存储到局部变量\
  \ 1 和 2\n9   dload_1        // 推入局部变量 1 和 2\n10  ldc2_w #4       // 推入 double 常数\
  \ 100.0\n13  dcmpg           // 没有 if_dcmplt 指令\n14  iflt 5          // 如果小于则循环\
  \ (i < 100.0)\n17  return          // 完成后返回 void\n```\n\n对类型数据操作的指令现在针对 `double`\
  \ 类型进行了专门化。（`ldc2_w` 指令将在本章稍后部分讨论。）\n\n记住，`double` 值占用两个局部变量，尽管它们仅通过这两个局部变量中索引较小的那个进行访问。`long`\
  \ 类型的值也是如此。再次举例：\n\n点击此处查看图像\n\n```java\ndouble doubleLocals(double d1, double d2)\
  \ {\n    return d1 + d2;\n}\n```\n\n变为\n\n点击此处查看图像\n\n```\nMethod double doubleLocals(double,double)\n\
  0   dload_1        // 局部变量 1 和 2 中的第一个参数\n1   dload_3        // 局部变量 3 和 4 中的第二个参数\n\
  2   dadd\n3   dreturn\n```\n\n注意，在 `doubleLocals` 中用于存储 `double` 值的局部变量对，绝不能单独操作。\n\
  \nJava 虚拟机的操作码大小为 1 字节，导致其编译后的代码非常紧凑。然而，1 字节的操作码意味着 Java 虚拟机指令集必须保持较小。作为折中，Java\
  \ 虚拟机没有为所有数据类型提供等的支持：它并不是完全正交的（表 2.11.1-A）。\n\n例如，示例 `spin` 中 `for` 语句对 `int` 类型值的比较可以使用单个\
  \ `if_icmplt` 指令实现；然而，Java 虚拟机指令集中没有单一指令可以对 `double` 类型的值执行条件分支。因此，`dspin` 必须使用\
  \ `dcmpg` 后跟 `iflt` 来实现对 `double` 的比较。\n\nJava 虚拟机为 `int` 提供了最直接的支持。这部分是因为考虑到典型程序中\
  \ `int` 数据的频率。`byte`、`char`、`short` 等类型的直接支持较少。这里是使用 `short` 的 `spin` 示例：\n\n点击此处查看图像\n\
  \n```java\nvoid spin() {\n    short i;\n    for (i = 0; i < 100; i++) {\n      \
  \  // 循环体为空\n    }\n}\n```\n\n它必须如下编译为 Java 虚拟机，使用 `int`：\n\n点击此处查看图像\n\n```\nMethod\
  \ void spin()\n0   bipush 0        // 推入常数 0\n1   istore_1        // 存储到局部变量 1\n\
  2   goto 9           // 第一次通过时不递增\n5   iload_1        // 推入局部变量 1\n6   bipush 1\
  \        // 推入常数 1\n7   i              // 加法；没有 isinc 指令\n8   istore_1        //\
  \ 将结果存储到局部变量 1\n9   iload_1        // 推入局部变量 1\n10  bipush 100      // 推入 int 常数\
  \ 100\n11  if_icmplt 5     // 如果小于则循环 (i < 100)\n12  return          // 完成后返回 void\n\
  ```\n\nJava 虚拟机对 `byte`、`char`、`short` 缺乏直接支持并不痛苦，因为这些类型在运算期间符号扩展为 `int`。\n\n###\
  \ 3.3 算术\n\nJava 虚拟机通常在其操作数栈上进行算术运算。（异常是 `iinc` 指令，它直接增加局部变量。）例如，`align2` 方法将 `int`\
  \ 值对齐到 2 的幂：\n\n点击此处查看图像\n\n```java\nint align2(int i, int grain) {\n    return\
  \ (i + grain-1) & ~(grain-1);\n}\n```\n\n算术操作数从操作数栈弹出，结果推回栈。因此，计算结果可以嵌套。例如，`~(grain-1)`\
  \ 的计算由以下指令处理：\n\n点击此处查看图像\n\n```\n5   iload_2        // 推入 grain\n6   iconst_1 \
  \       // 推入常数 1\n7   isub            // 减法；推入结果\n8   iconst_m1       // 推入 int\
  \ -1\n9   ixor            // 异或；推入结果\n```\n\n首先 `grain-1` 是使用局部变量 *2* 的内容和一个 `int`\
  \ 值 `1` 计算的。这些操作数从操作数栈弹出，其结果被推回栈。\n\n整个方法的代码如下：\n\n点击此处查看图像\n\n```\nMethod int align2(int,int)\n\
  0   iload_1\n1   iload_2\n2   iadd\n3   iconst_1\n4   isub\n5   iload_2\n6   iconst_1\n\
  7   isub\n8   iconst_m1\n9   ixor\n10  iand\n11  ireturn\n```\n\n\n\n\n\n许多数值常量，以及对象、字段和方法，都是通过当前类的运行时常量池访问的。对象的访问将在稍后讨论（§3.8）。`int`、`long`、`float`\
  \ 和 `double` 类型的数据以及对 `String` 类实例的引用，是使用 `ldc`、`ldc_w` 和 `ldc2_w` 指令管理的。\n\n`ldc`\
  \ 和 `ldc_w` 指令用于访问运行时常量池（包括 `String` 类的实例）中除 `double` 和 `long` 以外类型的值。只有当运行时常量池项非常多且需要较大的索引来访问某个项时，才使用\
  \ `ldc_w` 指令来代替 `ldc`。`ldc2_w` 指令用于访问所有 `double` 和 `long` 类型的值；该指令没有非宽格式的变体。\n\n\
  `byte`、`char` 或 `short` 类型的整数常量以及较小的 `int` 值，可以使用 `bipush`、`sipush` 或 `iconst_<i>`\
  \ 指令编译（§3.2）。某些较小的浮点常量可以使用 `fconst_<f>` 和 `dconst_<d>` 指令编译。\n\n在所有这些情况下，编译都是直接的。例如，以下常量的：\n\
  \n点击此处查看代码图像\n\n```java\nvoid useManyNumeric() {\n    int i = 100;\n    int j =\
  \ 1000000;\n    long l1 = 1;\n    long l2 = 0xffffffff;\n    double d = 2.2;\n \
  \   ...do some calculations...\n}\n```\n\n其设置如下：\n\n点击此处查看代码图像\n\n```\nMethod void\
  \ useManyNumeric()\n0   bipush 100   // 使用 bipush 推入较小的 int 类型常量\n2   istore_1\n\
  3   ldc #1        // 使用 ldc 推入大的 int 类型常量 (1000000)\n5   istore_2\n6   lconst_1\
  \      // 一个极小的 long 值使用快速的 lconst_1\n7   lstore_3\n8   ldc2_w #6     // 推入 long\
  \ 类型 0xffffffff (即 int 类型 -1)\n      // 任何 long 类型常量值都可以用 ldc2_w 推入\n11  lstore\
  \ 5\n13  ldc2_w #8     // 推入 double 类型常量 2.200000\n      // 不罕见的 double 值也使用 ldc2_w\
  \ 推入\n16  dstore 7\n...do those calculations...\n```\n\n## 3.5 更多控制示例\n\n`for` 语句的编译在前面的章节中展示过（§3.2）。Java\
  \ 编程语言的其他大多数控制结构（`if-then-else`、`do`、`while`、`break` 和 `continue`）也是以显而易见的方式编译的。`switch`\
  \ 语句的编译在单独的章节中处理（§3.10），异常的编译（§3.12）以及 `finally` 子句的编译（§3.13）也是如此。\n\n作为一个示例，`while`\
  \ 循环是以显而易见的方式编译的，尽管 Java 虚拟机提供的特定控制传输指令随数据类型而异。按照惯，对 `int` 类型的支持更多，例如：\n\n```java\n\
  void whileInt() {\n    int i = 0;\n    while (i < 100) {\n        i++;\n    }\n\
  }\n```\n\n编译为：\n\n```\nMethod void whileInt()\n0   iconst_0\n1   istore_1\n2   goto\
  \ 8\n5   iinc 1 1\n8   iload_1\n9   bipush 100\n11  if_icmplt 5\n14  return\n```\n\
  \n注意，`while` 语句的测试（使用 `if_icmplt` 指令实现）位于 Java 虚拟机循环的底部。（这在 `spin` 示例中也是如此）。测试位于循环底部强制要求使用\
  \ `goto` 指令在第一次迭代之前跳转到测试。如果该测试失败，则永远不会进入循环体，这条额外的指令就白白浪费了。然而，`while` 循环通常在预期循环体会运行多次迭代时使用。对于随后的迭代，将测试放在循环底部每次循环可以节省一条虚拟机指令：如果测试在循环顶部，则循环体末尾需要一个尾随的\
  \ `goto` 指令来返回顶部。\n\n涉及其他类型的控制结构以类似的方式编译，但必须使用适用于那些类型的指令。这导致了某种效率上的低效，因为需要更多的虚拟机指令，例如：\n\
  \n```java\nvoid whileDouble() {\n    double i = 0.0;\n    while (i < 100.1) {\n\
  \        i++;\n    }\n}\n```\n\n\n\n\n类（`static`）方法没有实例，因此对于它们来说，这种对局部变量 `0` 的使用是没有必要的。类方法从索引\
  \ `0` 开始使用局部变量。如果 `addTwo` 方法是一个类方法，它的参数传递方式将与第一个版本类似：\n\n点击此处查看代码图片\n\n```java\n\
  static int addTwoStatic(int i, int j) {\n    return i + j;\n}\n```\n\n`compcomp`\
  \ 编译为：\n\n点击此处查看代码图片\n\n```text\nMethod int addTwoStatic(int,int)\n0   iload_0\n\
  1   iload_1\n2   iadd\n3   ireturn\n```\n\n唯一的区别是方法参数从局部变量 `0` 开始出现，而不是从 `1`。\n\n\
  ## 3.7 调用方法\n\n实例方法的普通调用根据对象的运行时类型进行分发。（在 C++ 术语中，它们是虚方法。）这种调用使用 `invokevirtual`\
  \ 指令实现，该指令的参数是一个运行时常量池条目的索引，该索引给出对象类型二进制名称的内部形式、要调用的名称以及该方法的描述符（§4.3.3）。要调用之前定义为实例方法的\
  \ `addTwo` 方法，我们可以写：\n\n```java\nint add12and13() {\n    return addTwo(12, 13);\n\
  }\n```\n\n这编译为：\n\n点击此处查看代码图片\n\n```text\nMethod int add12and13()\n0   aload_0 \
  \             // 推入局部变量 0 (this)\n1   bipush 12             // 推入 int 常数 12\n3 \
  \  bipush 13             // 推入 int 常数 13\n5   invokevirtual #4     // Method Example.addtwo(II)I\n\
  8   ireturn              // 返回操作栈顶部的 int\n                      // 它是 addTwo() 的\
  \ int 结果\n```\n\n调用的设置是：首先将当前实例 `this` 的引用推入操作栈。然后推入方法调用的参数，即 `int` 值 `12` 和 `13`。当\
  \ `addTwo` 方法的帧被创建时，传递给方法的参数成为新帧局部变量的初始值。也就是说，由调用者推入操作栈的 `this` 引用和两个参数将成为被调用方法局部变量\
  \ `0`、`1` 和 `2` 的初始值。\n\n最后，调用了 `addTwo`。当它返回时，其 `int` 返回值被推入调用者帧（即 `add12and13`\
  \ 方法）的操作栈中。因此，返回值被放置好，以便立即返回给 `add12and13` 的调用者。\n\n来自 `add12and13` 的返回由 `add12and13`\
  \ 的 `ireturn` 指令处理。`ireturn` 指令获取当前帧操作栈上 `addTwo` 返回的 `int` 值，并将其推入调用者帧的操作栈。然后它将控制权给调用者，使调用者的帧成为当前帧。Java\
  \ 虚拟机为其许多数值类型和 `reference` 类型提供了不同的返回指令，还为没有返回值的方法提供了一个 `return` 指令。所有类型的方法调用都使用同一组返回指令。\n\
  \n`invokevirtual` 指令的操作数（在示例中为运行时常量池索引 `#4`）并不是方法在类实例中的偏移量。编译器不知道类实例的内部布局。相反，它生成指向实例方法的符号引用，这些引用存储在运行时常量池中。这些运行时常量池条目在运行时被解析，以确定实际的方法位置。所有其他访问类实例的\
  \ Java 虚拟机指令也是如此。\n\n调用 `addTwoStatic`（`addTwo` 的类（`static`）变体）类似的，所示：\n\n点击此处查看代码图片\n\
  \n```java\nint add12and13() {\n    return addTwoStatic(12, 13);\n}\n```\n\n尽管使用了不同的\
  \ Java 虚拟机方法调用指令：\n\n点击此处查看代码图片\n\n```text\nMethod int add12and13()\n0   bipush\
  \ 12\n2   bipush 13\n4   invokestatic #3     // Method Example.addTwoStatic(II)I\n\
  7   ireturn\n```\n\n编译类（`static`）方法的调用与编译实例方法的调用非常相似，不同在于它不是由调用者传递的。因此，方法参数将从局部变量\
  \ `0` 开始接收（§3.6）。`invokestatic` 指令始终用于调用类方法。\n\n必须使用 `invokespecial` 指令来调用实例初始化方法（§3.8）。在调用超类（`super`）方法时也会使用它。例如，给定的\
  \ `Near` 和 `Far` 类：\n\n点击此处查看代码图片\n\n```java\nclass Near {\n    int it; // 一个实例变量\n\
  \    private int getIt() {\n        return it;\n    }\n}\n\nclass Far extends Near\
  \ {\n    public int getIt() {\n        return super.getIt();\n    }\n}\n```\n\n\
  `Near.getIt`（调用私有方法）编译为：\n\n点击此处查看代码图片\n\n```text\nMethod int getIt()\n0   aload_0\n\
  1   invokespecial #5 // Method Near.getIt()\n4   ireturn\n```\n\n`Far.getIt`（调用超类方法）编译为：\n\
  \n点击此处查看代码图片\n\n```text\nMethod int getIt()\n0   aload_0\n1   invokespecial #4 //\
  \ Method Near.getIt()\n4   ireturn\n```\n\n注意使用 `invokespecial` 调用的方法总是将 `this`\
  \ 作为第一个参数。按照常例，它位于局部变量 `0`。为了调用方法句柄，编译器必须根据其自身的类型将参数推入栈。编译器不对参数进行方法转换；相反，它必须按照它们自身的类型将其推入栈。按照常例，将方法句柄的引用推入栈。编译器发射一个引用描述符的\
  \ `invokevirtual` 指令。通过特殊的运行时解析（§5.4.3），调用 `java.lang.MethodHandle` 的 `invokeExact`\
  \ 或 `invoke` 方法的 `invokevirtual` 指令将始终链接。\n\n### 3.8 处理类实例\n\nJava 虚拟机使用 `new` 指令创建类实例。回想，构造函数显示为具有编译器提供的名称\
  \ `<init>` 方法。这个特殊命名的方法被称为实例初始化方法（§2.9）。对于给定的类，可能存在多个对应多个构造器的实例初始化方法。一旦创建了类实例及其实例变量（包括所有超类的）已初始化为默认值，就可以调用类实例的实例初始化方法。例如：\n\
  \n```java\nObject create() {\n    return new Object();\n}\n```\n\n编译为：\n\n点击此处查看代码图片\n\
  \n```text\nMethod java.lang.Object create()\n0   new #1              // Class java.lang.Object\n\
  3   dup\n4   invokespecial #4 // Method java.lang.Object.<init>()V\n7   areturn```\n\
  \n类实例的传递和返回（作为 `reference` 类型）与数值值非常相似，尽管 `reference` 类型有自己的互补指令，例如：\n\n点击此处查看代码图片\n\
  \n```java\nint i; // 一个实例变量\n\nMyObj example() {\n    MyObj o = new MyObj();\n}\n\
  ```\n\n\n\n\n```java\nreturn silly(o);\n\n}\n\nMyObj silly(MyObj o) {\n    if (o\
  \ != null) {\n        return o;\n    } else {\n        return o;\n    }\n}\n```\n\
  \n变为：\n\n点击此处查看代码图像\n\nMethod `MyObj example()`\n```\n0   new #2               //\
  \ Class MyObj\n3   dup\n4   invokespecial #5    // Method MyObj.<init>()V\n7   astore_1\n\
  8   aload_0\n9   aload_1\n10  invokevirtual #4    // Method Example.silly(LMyObj;)LMyObj;\n\
  13  areturn\n```\n\nMethod `MyObj silly(MyObj)`\n```\n0   aload_1\n1   ifnull 6\n\
  4   aload_1\n5   areturn\n6   aload_1\n7   areturn\n```\n\n类实例的字段（实例变量）通过 `getfield`\
  \ 和 `putfield` 指令进行访问。如果 `i` 是类型为 `int` 的实例变量，则定义如下的 `setIt` 和 `getIt` 方法：\n\n```java\n\
  void setIt(int value) {\n    i = value;\n}\n\nint getIt() {\n    return i;\n}\n\
  ```\n\n变为：\n\n点击此处查看代码图像\n\nMethod `void setIt(int)`\n```\n0   aload_0\n1   iload_1\n\
  2   putfield #4        // Field Example.i I\n5   return\n```\n\nMethod `int getIt()`\n\
  ```\n0   aload_0\n1   getfield #4        // Field Example.i I\n4   ireturn\n```\n\
  \n与方法调用指令的操作数一样，`putfield` 和 `getfield` 指令的操作数（运行时常量池的索引 `#4`）并不是字段在类实例中的偏移量。编译器生成指向实例字段的符号引用，这些引用存储在运行时常量池中。这些运行时常量池项会在运行时被解析，以确定字段在被引用对象中的位置。\n\
  \n## 3.9 数组\n\nJava 虚拟机数组也是对象。数组使用一组特定的指令来创建和操作。`newarray` 指令用于创建数值类型类型的数组。以下代码：\n\
  \n点击此处查看代码图像\n\n```java\nvoid createBuffer() {\n    int buffer[];\n    int bufsz\
  \ = 100;\n    int value = 12;\n    buffer = new int[bufsz];\n    buffer[10] = value;\n\
  \    value = buffer[11];\n}\n```\n\n可能会被编译为：\n\n点击此处查看代码图像\n\nMethod `void createBuffer()`\n\
  ```\n0   bipush 100      // 推 int 常数 100 (bufsz)\n2   istore_2          // 将 bufsz\
  \ 存入局部变量 2\n3   bipush 12          // 推 int 常数 12 (value)\n5   istore_3        \
  \  // 将 value 存入局部变量 3\n6   iload_2           // 推 bufsz...\n7   newarray int  \
  \    // ...并根据该长度创建新的 int 数组\n9   astore_1          // 将新数组存入 buffer\n10  aload_1\
  \          // 推 buffer\n11  bipush 10          // 推 int 常数 10\n13  iload_3     \
  \     // 推 value\n14  astore            // 将 value 存入 buffer[10]\n15  aload_1  \
  \        // 推 buffer\n16  bipush 1          // 推 int 常数 1\n18  iaload          \
  \  // 推 buffer[1] 的值...\n19  istore_3          // ...将其存入 value\n20  return\n```\n\
  \n`newarray` 指令也用于创建对象的一维数组，例如：\n\n点击此处查看代码图像\n\n```java\nvoid createArray() {\n\
  \    Thread threads[];\n    int count = 10;\n    threads = new Thread[count];\n\
  \    threads[0] = new Thread();\n}\n```\n\n变为：\n\n点击此处查看代码图像\n\nMethod `void createArray()`\n\
  ```\n0   bipush 10          // 推 int 常数 10\n2   istore_2          // 初始化 count 为该值\n\
  3   iload_2           // 推 count，供 anew 使用\n4   newarray class #1 // 创建 Thread 类型的新数组\n\
  7   astore_1          // 将新数组存入 threads\n8   aload_1           // 推 threads 的值\n\
  9   iconst_0           // 推 int 常数 0\n10  new #1             // 创建 Thread 实例\n13\
  \  dup               // 创建一个的引用...\n14  invokespecial #5  // ...用于 Thread 的构造函数\n\
  \                    // 方法 java.lang.Thread.<init>()V\n17  aastore            //\
  \ 将新 Thread 存入数组 0 处\n18  return\n```\n\n`newarray` 指令也可以用于创建对象的一维数组。此外，`newarray`\
  \ 指令也可以用于创建多维数组。例如，这个三维数组：\n\n```java\nint[][][] createDArray() {\n    int[][][]\
  \ grid = new int[10][5][2];\n    return grid;\n}\n```\n\n变为：\n\n点击此处查看代码图像\n\nMethod\
  \ `int createDArray()`\n```\n0   bipush 10          // 推 int 常数 10\n2   istore_2\
  \          // 将 10 存入局部变量 2\n3   iload_2           // 推 10\n4   newarray type [][]\
  \ // 创建 int[][] 类型的新数组\n7   astore_1          // 将新数组存入 grid\n8   aload_1      \
  \     // 推 grid\n9   bipush 5           // 推 int 常数 5\n10  istore_3          //\
  \ 将 5 存入局部变量 3\n11  iload_3           // 推 5\n12  newarray type []  // 创建 int[]\
  \ 类型的新数组\n13  astore_2          // 将新数组存入局部变量 2\n14  aload_2           // 推局部变量\
  \ 2\n15  bipush 2           // 推 int 常数 2\n16  istore_4          // 将 2 存入局部变量 4\n\
  17  iload_4           // 推 2\n18  newarray type I   // 创建 int 类型的新数组\n19  astore_3\
  \          // 将新数组存入局部变量 3\n20  aload_3           // 推局部变量 3\n21  aload_2      \
  \     // 推局部变量 2\n22  dup               // 创建重复的引用\n23  aastore            // 将引用存入数组\
  \ 0 处\n24  aload_2           // 推局部变量 2\n25  dup               // 创建重复的引用\n26  aastore\
  \            // 将引用存入数组 1 处\n27  aload_2           // 推局部变量 2\n28  dup         \
  \      // 创建重复的引用\n29  aastore            // 将引用存入数组 2 处\n30  aload_1          \
  \ // 推局部变量 1\n31  areturn\n// 返回 grid\n```\n\n`newarray` 指令也可以用于创建一维数组。此外，`newarray`\
  \ 指令也可以用于创建多维数组。例如，这个三维数组：\n\n```java\nint[][][] createDArray() {\n    int[][][]\
  \ grid = new int[10][5][2];\n    return grid;\n}\n```\n\n变为：\n\n点击此处查看代码图像\n\nMethod\
  \ `int createDArray()`\n```\n0   bipush 10          // 推 int 常数 10\n2   istore_2\
  \          // 将 10 存入局部变量 2\n3   iload_2           // 推 10\n4   newarray type [][]\
  \ // 创建 int[][] 类型的新数组\n7   astore_1          // 将新数组存入 grid\n8   aload_1      \
  \     // 推 grid\n9   bipush 5           // 推 int 常数 5\n10  istore_3          //\
  \ 将 5 存入局部变量 3\n11  iload_3           // 推 5\n12  newarray type []  // 创建 int[]\
  \ 类型的新数组\n13  astore_2          // 将新数组存入局部变量 2\n14  aload_2           // 推局部变量\
  \ 2\n15  bipush 2           // 推 int 常数 2\n16  istore_4          // 将 2 存入局部变量 4\n\
  17  iload_4           // 推 2\n18  newarray type I   // 创建 int 类型的新数组\n19  astore_3\
  \          // 将新数组存入局部变量 3\n20  aload_3           // 推局部变量 3\n21  aload_2      \
  \     // 推局部变量 2\n22  dup               // 创建重复的引用\n23  aastore            // 将引用存入数组\
  \ 0 处\n24  aload_2           // 推局部变量 2\n25  dup               // 创建重复的引用\n26  aastore\
  \            // 将引用存入数组 1 处\n27  aload_2           // 推局部变量 2\n28  dup         \
  \      // 创建重复的引用\n29  aastore            // 将引用存入数组 2 处\n30  aload_1          \
  \ // 推局部变量 1\n31  areturn\n// 返回 grid\n```\n\n### 3.10 编译 Switch\n\n`switch` 语句的编译使用\
  \ `tableswitch` 和 `lookupswitch` 指令。`tableswitch` 指令用于 `switch` 的情况可以有效地表示为偏移量表。`switch`\
  \ 的 `default` 目标在 `switch` 的值超出有效范围时使用。例如：\n\n```java\nint chooseNear(int i) {\n\
  \    switch (i) {\n        case 0: return 0;\n        case 1: return 1;\n      \
  \  case 2: return 2;\n        default: return -1;\n    }\n}\n```\n\n编译为：\n\n点击此处查看代码图像\n\
  \nMethod `int chooseNear(int)`\n```\n0   iload_1           // 推局部变量 1 (参数 i)\n1\
  \   tableswitch 0 to 2: // 有效索引为 0 到 2\n    0: 28              // 如果 i 是 0，跳转到 28\n\
  \    1: 30              // 如果 i 是 1，跳转到 30\n    2: 32              // 如果 i 是 2，跳转到\
  \ 32\n    default:34         // 否则，跳转到 34\n28  iconst_0           // i 为 0，推 int\
  \ 常数 0...\n29  ireturn            // ...并\n30  iconst_1           // i 为 1，推 int\
  \ 常数 1...\n31  ireturn            // ...并\n32  iconst_2           // i 为 2，推 int\
  \ 常数 2...\n33  ireturn            // ...并\n34  iconst_m1          // 否则推 int 常数\
  \ -1...\n35  ireturn            // ...并\n```\n\nJava 虚拟机的 `tableswitch` 和 `lookupswitch`\
  \ 指令仅对 `int` 数据操作。由于对 `byte`、`char` 或 `short` 值的操作在内部会被提升为 `int`，因此表达式结果为这些类型之一的\
  \ `switch` 编译方式就像其求值为为 `int` 类型一样。如果 `chooseNear` 方法使用的是 `short` 类型编写的，生成的 Java\
  \ 虚拟机指令将与使用 `int` 类型时相同。其他数值类型必须收窄为 `int` 类型才能用于 `switch`。\n\n\n\n\n\n当 `switch`\
  \ 的情况较少时，`tableswitch` 指令的表格表示法在空间上变得低效。此时可以使用 `lookupswitch` 指令。`lookupswitch`\
  \ 指令将 `int` 键（`case` 标签的值）与表中的目标偏移量配对。当执行 `lookupswitch` 指令时，会将 `switch` 表达式的值与表中的键进行比较。如果某个键与表达式的值匹配，则执行在相关的目标偏移量处继续。如果没有匹配的键，则执行在\
  \ `default` 目标处继续。例如，以下代码的编译后代码：\n\n```java\nint chooseFar(int i) {\n    switch\
  \ (i) {\n        case -100: return -1;\n        case 0:     return  0;\n       \
  \ case 100:  return  1;\n        default:   return -1;\n    }\n}\n```\n\n看起来与 `chooseNear`\
  \ 的代码一样，区别仅于 `lookupswitch` 指令：\n\n```\nMethod int chooseFar(int)\n0   iload_1\n\
  1   lookupswitch 3:\n        -100: 36\n          0: 38\n          100: 40\n    \
  \  default: 42\n36  iconst_m1\n37  ireturn\n38  iconst_0\n39  ireturn\n40  iconst_1\n\
  41  ireturn\n42  iconst_m1\n43  ireturn\n```\n\nJava 虚拟机规定 `lookupswitch` 指令的表必须按键排序，以便实现类可以使用比线性扫描更高效的搜索。尽管如此，`lookupswitch`\
  \ 指令仍然必须搜索其键以进行匹配，而不是像 `tableswitch` 那样只需执行边界检查并索引到表。因此，在空间允许选择的情况下，`tableswitch`\
  \ 指令可能比 `lookupswitch` 更高效。\n\n### 3.11 对操作数栈上的操作\n\nJava 虚拟机有一系列指令，可以将操作数栈的内容作为无类型值进行处理。这些指令非常有用，因为\
  \ Java 虚拟机依赖于对操作数栈的精细操作。例如：\n\n```java\npublic long nextIndex() {\n    return index++;\n\
  }\n\nprivate long index = 0;\n```\n\n被编译为：\n\n```\nMethod long nextIndex()\n0  \
  \ aload_0          // Push this\n1   dup              // Make a copy of it\n2  \
  \ getfield #4      // One of the copies of this is consumed\n                  \
  \  // pushing long field index,\n                    // above the original this\n\
  5   dup2_x1         // The long on top of the operand stack is\n               \
  \     // inserted into the operand stack below the\n                    // original\
  \ this\n6   lconst_1         // Push long constant 1\n7   ladd             // The\
  \ index value is incremented...\n8   putfield #4      // ...and the result stored\
  \ in the field\n11  lreturn          // The original value of index is on top of\n\
  \                    // the operand stack, ready to be returned\n```\n\n注意，Java\
  \ 虚拟机不允许操作数栈操作指令修改或破坏操作数栈上的单个值。\n\n## 3.12 抛出和处理异常\n\n程序使用 `throw` 关键字抛出异常。其编译非常简单：\n\
  \n```java\nvoid cantBeZero(int i) throws TestExc {\n    if (i == 0) {\n        throw\
  \ new TestExc();\n    }\n}\n```\n\n 变为：\n\n```\nMethod cantBeZero(int)\n0   iload_1\
  \          // Push 1 (i)\n1   ifne 12          // If i==0, allocate instance and\
  \ throw\n4   new #1           // Create instance of TestExc\n7   dup           \
  \   // One reference goes to its constructor\n8   invokespecial #7 // Method TestExc.<init>()V\n\
  1   athrow            // Second reference is thrown\n2   return           // Never\
  \ get here we threw TestExc\n```\n\n`try-catch` 构造的编译是直接的。例如：\n\n```java\nvoid catchOne()\
  \ {\n    try {\n        tryOut();\n    } catch (TestExc e) {\n        handleExc(e);\n\
  \    }\n}\n```\n\n编译为：\n\n```\nMethod catchOne()\n0   aload_0          // Beginning\
  \ of try block\n1   invokevirtual #6  // Method Example.tryOut()V\n4   return  \
  \         // End of try block; normal return\n5   astore_1         // Store thrown\
  \ value in local 1\n6   aload_0          // Push this\n7   aload_1          // Push\
  \ thrown value\n8   invokevirtual #5 // Invoke handler method:\n               \
  \    // Example.handleExc(LTestExc;)V\n11  return           // Return after handling\
  \ TestExc\n```\n\n异常表：\n| From | To | Target | Type |\n| --- | --- | --- | --- |\n\
  | 0 | 4 | 5 | Class TestExc |\n\n仔细观察，`try` 块的编译方式就像没有 `try` 一样：\n\n```\nMethod\
  \ catchOne()\n0   aload_0          // Beginning of try block\n1   invokevirtual\
  \ #6  // Method Example.tryOut()V\n4   return           // End of try block; normal\
  \ return\n```\n\n如果在执行 `try` 块期间没有抛出异常，它的行为就好像 `try` 不存在一样：`tryOut` 被调用且 `catchOne`\
  \ 返回。\n\n`try` 块之后是实现该 `catch` 子句的 Java 虚拟机代码：\n\n```\n5   astore_1         // Store\
  \ thrown value in local 1\n6   aload_0          // Push this\n7   aload_1      \
  \    // Push thrown value\n8   invokevirtual #5 // Invoke handler method:\n    \
  \               // Example.handleExc(LTestExc;)V\n11  return           // Return\
  \ after handling TestExc\n```\n\n异常表：\n| From | To | Target | Type |\n| --- | ---\
  \ | --- | --- |\n| 0 | 4 | 5 | Class TestExc |\n\n`handleExc` 子句的内容的调用也像普通调用一样编译。然而，`catch`\
  \ 子句的存在会导致编译器生成异常条目。`catchOne` 方法的异常表有一个对应 `catch` 子句可以处理的参数（`TestExc` 实例）。如果在从\
  \ `0` 到 `4` 之间的指令执行期间抛出了 `TestExc` 实例，控制权将转移到索引 `5` 的 Java 虚拟机代码，该代码实现了 `catch`\
  \ 子句块。如果抛出的值不是 `TestExc` 实例，则 `catchOne` 的 `catch` 子句无法处理它。相反，该值将重新抛给 `catchOne`\
  \ 的调用者。\n\n一个 `try` 可以有多个 `catch` 子句：\n\n```java\nvoid catchTwo() {\n    try {\n\
  \        tryOut();\n    } catch (TestExc e) {\n        handleExc(e);\n    } catch\
  \ (TestExc e) {\n        handleExc(e);\n    }\n}\n```\n\n给定的 `try` 语句的多个 `catch`\
  \ 子句的编译方式是依次追加每个 `catch` 子句的 Java 虚拟机代码并向异常表添加条目，所示：\n\n```\nMethod catchTwo()\n\
  0   aload_0          // Begin try block\n1   invokevirtual #5  // Method Example.tryOut()V\n\
  4   return           // End of try block; normal return\n5   astore_1         //\
  \ Beginning of handler for TestExc;\n                    // Store thrown value in\
  \ local 1\n6   aload_0          // Push this\n7   aload_1          // Push thrown\
  \ value\n8   invokevirtual #7 // Invoke handler method:\n                   // Example.handleExc(LTestExc;)V\n\
  11  return           // Return after handling TestExc1\n12  astore_1         //\
  \ Beginning of handler for TestExc2;\n                    // Store thrown value\
  \ in local 1\n13  aload_0          // Push this\n14  aload_1          // Push thrown\
  \ value\n15  invokevirtual #7 // Invoke handler method:\n```\n\n\n\n\n\n```\n//\
  \ Example.handleExc(LTestExc2;)V\n\n18  return              // Return after handling\
  \ TestExc2\n\nException table:\n\nFrom    To      Target      Type\n0       4  \
  \     5           Class TestExc1\n0       4       12          Class TestExc2\n```\n\
  \n如果在执行 `try` 子句（在索引 `0` 和 `4` 之间）期间，抛出一个匹配一个或多个 `catch` 子句参数的值（该值是一个或多个参数的实例），则选择第一个（最内层的）此类\
  \ `catch` 子句。控制权将转移到该 `catch` 块对应的 Java 虚拟机代码。如果抛出的值不匹配 `catchTwo` 中任何 `catch` 子句的参数，则\
  \ Java 虚拟机将重新抛出该值，而不调用 `catchTwo` 中任何 `catch` 子句中的代码。\n\n嵌套的 `try-catch` 语句的编译方式与带有多个\
  \ `catch` 子句的 `try` 语句非常相似：\n\n点击此处查看代码图片\n\n```java\nvoid nestedCatch() {\n   \
  \ try {\n        try {\n            tryItOut();\n        } catch (TestExc1 e) {\n\
  \            handleExc1(e);\n        }\n    } catch (TestExc2 e) {\n        handleExc2(e);\n\
  \    }\n}\n```\n\n变为：\n\n点击此处查看代码图片\n\n```\nMethod void nestedCatch()\n0   aload_0\
  \             // Begin of try block\n1   invokevirtual #8   // Method Example.tryItOut()V\n\
  4   return              // End of try block; normal return\n5   astore_1       \
  \     // Beginning of handler for TestExc1;\n                    // Store thrown\
  \ value in local var 1\n6   aload_0             // Push this\n7   aload_1      \
  \       // Push thrown value\n8   invokevirtual #7   // Invoke handler method:\n\
  \                    // Example.handleExc1(LTestExc1;)V\n11  return            \
  \  // Return after handling TestExc1\n12  astore_1            // Beginning of handler\
  \ for TestExc2;\n                    // Store thrown value in local var 1\n13  aload_0\
  \             // Push this\n14  aload_1             // Push thrown value\n15  invokevirtual\
  \ #6   // Invoke handler method:\n                    // Example.handleExc2(LTestExc2;)V\n\
  18  return              // Return after handling TestExc2\n\nException table:\n\
  From    To      Target      Type\n0       4       5           Class TestExc1\n0\
  \       12      12          Class TestExc2\n```\n\n`catch` 子句的嵌套仅体现在异常表中。Java 虚拟机并不强制异常表条目的嵌套或任何顺序。然而，由于\
  \ `try-catch` 结构是结构化的，编译器始终对异常处理表的条目进行排序，使得对于该方法中的任何抛出异常和任何程序计数器值，第一个匹配抛出异常的异常处理器都对应于最内层的匹配\
  \ `catch` 子句。\n\n例如，如果 `tryItOut` 的调用（在索引 `1` 处）抛出了 `TestExc1` 实例，它将由调用 `handleExc1`\
  \ 的 `catch` 子句处理。尽管该异常发生在外层 `catch` 子句（捕 `TestExc2`）的范围内，即使该外层 `catch` 子句本可以处理抛出的值。\n\
  \n作为一个细微点，请注意 `catch` 子句的范围在“起始”端是包含的，在“结束”端是不包含的。因此，捕 `TestExc1` 的 `catch` 子句异常表条目没有覆盖偏移量\
  \ `4` 处的 `return` 指令。然而，捕 `TestExc2` 的 `catch` 子句异常表条目覆盖了偏移量 `1` 处的 `return` 指令。嵌套\
  \ `catch` 子句内的 `return` 指令包含在嵌套 `catch` 子句的范围内。\n\n### 3.13 编译 finally（本节假设编译器生成的类版本为\
  \ 5.0 或以下，可以使用 `jsr` 指令。）\n\n`try-finally` 语句的编译与 `try-catch` 类似。在将控制转移到 `try` 语句之外之前（无论这种转移是正常的还是由于异常导致的异常），必须首先执行\
  \ `finally` 子句。对于这个简单的示例：\n\n```java\nvoid tryFinally() {\n    try {\n        tryItOut();\n\
  \    } finally {\n        wrapItUp();\n    }\n}\n```\n\n编译后的代码为：\n\n```\nMethod\
  \ void tryFinally()\n0   aload_0             // Beginning of try block\n1   invokevirtual\
  \ #6   // Method Example.tryItOut()V\n4   jsr 14             // Call finally block\n\
  7   return              // End of try block\n8   astore_1            // Beginning\
  \ of handler for any throw\n9   jsr 14             // Call finally block\n12  aload_1\
  \             // Push thrown value\n13  athrow              // ...rethrow value\
  \ to the invoker\n14  astore_2            // Beginning of finally block\n15  aload_0\
  \             // Push this\n16  invokevirtual #5   // Method Example.wrapItUp()\n\
  19  ret 2               // Return from finally block\n\nException table:\nFrom \
  \   To      Target      Type\n0       4       8           any\n```\n\n控制权有四种方式离开\
  \ `try` 语句：通过执行该块的底部、通过 `return`、通过 `break` 或 `continue` 语句，或者通过抛出异常。如果 `tryItOut`\
  \ 抛出异常，控制权将通过 `jsr` 指令转移到 `finally` 块。索引 `4` 处的 `jsr` 指令执行子程序调用，进入索引 `14` 处的 `finally`\
  \ 块。当 `finally` 块完成时，`ret 2` 指令返回调用处。\n\n更详细地说，子程序调用的工作如下：`jsr` 指令在跳转之前将后续指令（索引\
  \ `7` 处的 `return`）的地址推入操作栈，并存入局部变量 `2` 中。随后执行 `finally` 块的代码（在本例中为 `aload_0` 和 `invokevirtual`\
  \ 指令）。假设该代码正常执行，`ret` 指令从局部变量 `2` 获取地址并在该处恢复执行。执行 `return` 指令，`tryFinally` 正常返回。\n\
  \n带有 `finally` 子句的 `try` 语句编译为一个特殊的异常处理器，它可以处理 `try` 语句内部抛出的任何异常。如果 `tryItOut` 抛出异常，将搜索\
  \ `tryFinally` 的异常表。找到了特殊的处理器，导致执行继续到索引 `8`。索引 `8` 处的 `astore_1` 指令将抛出的值存入局部变量 `1`。随后的\
  \ `jsr` 指令对 `finally` 块的代码执行子程序调用。假设该代码正常返回，索引 `12` 处的 `aload_1` 指令将异常值推回操作栈，随后的\
  \ `athrow` 指令重新抛出该值。\n\n同时带有 `catch` 子句和 `finally` 子句的 `try` 语句编译更为复杂：\n\n```java\n\
  void tryCatchFinally() {\n    try {\n        tryItOut();\n    } catch (TestExc e)\
  \ {\n        handleExc(e);\n    } finally {\n        wrapItUp();\n    }\n}\n```\n\
  \n变为：\n\n```\nMethod void tryCatchFinally()\n0   aload_0             // Beginning\
  \ of try block\n1   invokevirtual #4   // Method Example.tryItOut()V\n4   goto 16\
  \             // Jump to finally block\n7   astore_3            // Beginning of\
  \ handler for TestExc;\n                    // Store thrown value in local var 3\n\
  8   aload_0             // Push this\n9   aload_3             // Push thrown value\n\
  ```\n\n\n\n\n\n```\n10  invokevirtual #6    // 调用处理方法：\n                    // Example.handleExc(LTestExc;)V\n\
  13  goto 16             // 这个 goto 是不必要的，但是由\n                    // javac 在 JDK\
  \ 1.0.2 中生成的\n16  jsr 26              // 调用 finally 块\n19  return              \
  \ // 在处理 TestExc 后返回\n20  astore_1             // 除 TestExc 以外的异常处理\n          \
  \          // 开始，或者在处理 TestExc 时\n                    // 抛出的异常\n21  jsr 26     \
  \         // 调用 finally 块\n24  aload_1              // 推入抛出的值...\n25  athrow   \
  \            // ...并将值重新抛给调用者\n26  astore_2             // finally 块的开始\n27  aload_0\
  \              // 推入 this\n28  invokevirtual #5    // 调用方法 Example.wrapItUp()V\n\
  31  ret 2                // 从 finally 块返回\n```\n\n异常表：\n\nFrom    To      Target\
  \      Type\n0       4       7             Class TestExc\n0       16      20   \
  \         any\n```\n\n如果 `try` 语句正常完成，索引 `4` 处的 `goto` 指令将跳转到索引 `16` 处 finally 块的子程序调用。执行索引\
  \ `26` 处的 finally 块，控制返回索引 `19` 处的 `return` 指令，`tryCatchFinally` Normal 返回。\n\n\
  如果 `tryItOut` 抛出一个 `TestExc` 实例，将选择异常表中第一个（最内层）的异常处理器来处理该异常。该异常处理器的代码从索引 `7` 开始，将抛出的值传递给\
  \ `handleExc`，并在返回时与正常情况一样对索引 `26` 处的 finally 块进行相同的子程序调用。如果 `handleExc` 没有抛出异常，`tryCatchFinally`\
  \ Normal 返回。\n\n如果 `tryItOut` 抛出的值不是 `TestExc` 实例，或者 `handleExc` 抛出了异常，该情况将由异常表中的第二个条目处理，它处理索引\
  \ `0` 到 `16` 之间抛出的任何值。该异常处理器将控制转移到索引 `20`，在那里抛出的值首先存储在局部变量 `1` 中。作为子程序调用索引 `26`\
  \ 处 finally 块的代码。如果它返回，则从局部变量 `1` 获取抛出的值并使用 `athrow` 指令重新抛出。如果在执行 `finally` 子句期间抛出了新值，`finally`\
  \ 子句将终止，`tryCatchFinally` 异常返回并将新值抛给其调用者。\n\n## 3.14 同步\n\nJava 虚拟机的同步是通过监器（monitor）的进入和退出实现的，可以是显式的（通过使用\
  \ `monitorenter` 和 `monitorexit` 指令），也可以是隐式的（通过方法调用和返回指令）。\n\n对于用 Java 语言编写的代码，最常见的同步形式是\
  \ `synchronized` 方法。`synchronized` 方法通常不使用 `monitorenter` 和 `monitorexit` 实现。相反，它仅仅在运行时常量池中通过\
  \ `ACC_SYNCHRONIZED` 标记进行区分，该标记由方法调用指令进行检查。\n\n`monitorenter` 和 `monitorexit` 指令允许\
  \ `synchronized` 语句的编译。例如：\n\n```java\nvoid onlyMe(Foo f) {\n    synchronized(f)\
  \ {\n        doSomething();\n    }\n}\n```\n\n编译为：\n\n```\nMethod void onlyMe(Foo)\n\
  0   aload_1             // 推入 f\n1   dup                 // 在栈上复制\n2   astore_2\
  \             // 存储在局部变量 2 中\n3   monitorenter        // 进入与 f 关联监器\n4   aload_0\
  \             // 持有监器，传递 this...\n5   invokevirtual #5    // ...调用 Example.doSomething()\n\
  8   aload_2             // 推入局部变量 2 (f)\n9   monitorexit        // 退出与 f 关联监器\n\
  10  goto 18             // 正常完成方法\n13  astore_3             // 如果发生任何抛出异常\n14  aload_2\
  \             // 推入局部变量 2 (f)\n15  monitorexit        // 确保退出监器！\n16  aload_3  \
  \           // 推入抛出的值...\n17  athrow               // ...并将值重新抛给调用者\n18  return\
  \               // 正常情况下返回\n```\n\n异常表：\n\nFrom    To      Target      Type\n4 \
  \      10      13            any\n13      16      13            any\n```\n\n编译器确保在任何方法完成时，对于自方法调用以来执行的每个\
  \ `monitorenter`，都会执行一个 `monitorexit` 指令。无论方法调用是正常完成还是异常完成都是如此。为了强制在异常完成时 `monitorenter`\
  \ 和 `monitorexit` 指令正确配对，编译器生成匹配任何异常的异常处理器，其关联代码将执行必要的 `monitorexit` 指令。\n\n## 3.15\
  \ 注解\n\n`class` 文件中注解的表示在章节章节描述，这些章节说明了如何表示类、接口、字段、方法、方法参数和类型参数声明上的注解，以及这些声明中使用的类型上的注解。由于包声明上的注解需要额外的规则，在此给出。\n\
  \n当编译器遇到必须在运行时可用的带注解包声明时，它会生成一个具有以下属性的 `class` 文件：\n\n- `class` 文件表示一个接口，即 `ClassFile`\
  \ 结构的 `ACC_INTERFACE` 和 `ACC_ABSTRACT` 标志被设置。\n- 如果 `class` 文件版本小于 `50.0`，则 `ACC_SYNTHETIC`\
  \ 标记未设置；如果 `class` 文件版本为 `50.0` 或以上，则 `ACC_SYNTHETIC` 标记被设置。\n- 接口具有包权限。\n- 接口名是\
  \ `package-name.package-info` 的内部形式。\n- 接口没有超接口。\n- 接口唯一的成员是《Java 规范》Java 8 版所隐含的。\n\
  - 包声明上的注解存储在 `ClassFile` 结构 `attributes` 表的 `RuntimeVisibleAnnotations` 和 `RuntimeInvisibleAnnotations`\
  \ 属性中。\n\n## 4. class 文件格式\n\n本章描述了 Java 虚拟机的 `class` 文件格式。每个 `class` 文件包含单个类或接口的定义。虽然类或接口并不一定包含在外部文件中，但我们将类或接口的任何有效表示统称为\
  \ `class` 文件格式。\n\n`class` 文件由 8 位字节流组成。所有 16 位、32 位和 64 位量都是通过连续读取两个、四个和八个 8 位字节构建的。多字节数据项始终以大端序存储，高字节在前。在\
  \ Java SE 平台上，这种格式由 `java.io.DataInput` 和 `java.io.DataOutput` 接口以及 `java.io.DataInputStream`\
  \ 和 `java.io.DataOutputStream` 类支持。\n\n本章定义了自己的数据类型集来表示 `class` 文件数据：`u1`、`u2` 和\
  \ `u4` 分别表示无符号的一个字节、两个字节或四个字节量。在 Java SE 平台上，这些类型可以通过 `java.io.DataInput` 接口的 `readUnsignedByte`、`readUnsignedShort`\
  \ 和 `readInt` 方法读取。\n\n\n\n\n\n本章使用类 C 结构表示法编写的伪结构来介绍 `class` 文件格式。为了避免与类的字段、类实例等字段混淆，描述\
  \ `class` 文件格式的结构的内容称为 `items`（项）。连续的 `items` 顺序存储在 `class` 文件中，不进行填充或对齐。\n\n`Tables`（表）由零或多个变长度的\
  \ `items` 组成，用于多个 `class` 文件结构。尽管我们使用类 C 语言数组语法来引用表项，但由于表是不同大小结构的流，这意味着无法将表索引直接转换为进入表中的字节偏移量。\n\
  \n当我们引用一个数据结构为 `array`（数组）时，它由零或多个连续的固定大小 `items` 组成，并可以像数组一样被索引。\n\n本章对 ASCII 字符的引用应解释为对应\
  \ ASCII 字符的 Unicode 代码点。\n\n### 4.1 ClassFile Structure\n\n一个 `class` 文件由单个 `ClassFile`\
  \ 结构组成：\n\n点击此处查看代码\n\n```\nClassFile {\n    u4              magic;\n    u2    \
  \          minor_version;\n    u2              major_version;\n    u2          \
  \    constant_pool_count;\n    cp_info         constant_pool[constant_pool_count-1];\n\
  \    u2              access_flags;\n    u2              this_class;\n    u2    \
  \          super_class;\n    u2              interfaces_count;\n    u2         \
  \     interfaces[interfaces_count];\n    u2              fields_count;\n    field_info\
  \      fields[fields_count];\n    u2              methods_count;\n    method_info\
  \     methods[methods_count];\n    u2              attributes_count;\n    attribute_info\
  \ attributes[attributes_count];\n}\n```\n\n`ClassFile` 结构中的 `items` 如下：\n\n`magic`\n\
  \n`magic` 项提供了标识 `class` 文件格式的魔数；其值为 `0xCAFEBABE`。\n\n`minor_version, major_version`\n\
  \n`minor_version` 和 `major_version` 项的值是该 `class` 文件的次版本号和主版本号。主版本号和次版本号共同决定了 `class`\
  \ 文件格式的版本。如果一个 `class` 文件的主版本号为 `M`，次版本号为 `m`，我们将其 `class` 文件格式标记为 `M.m`。因此，`class`\
  \ 文件格式的版本可以字典顺序排序，例如，1.5 < 2.0 < 2.1。\n\nJava 虚拟机实现支持版本为 `v` 的 `class` 文件格式当且仅当\
  \ `v` 位于某个连续范围 `Mi.0 ≤ v ≤ Mj.m` 内。Java 虚拟机实现所遵循的 Java SE 平台发布级别决定了该范围。\n\nOracle\
  \ 在 JDK 1.0.2 版本中的 Java 虚拟机实现支持 45.0 到 45.3（包含）的 `class` 文件格式版本。JDK 1.1.* 版本支持 45.0\
  \ 到 45.65535（包含）范围内的 `class` 文件格式版本。对于 `k ≥ 2`，JDK 1.k 版本支持 45.0 到 44+k.0（包含）范围内的\
  \ `class` 文件格式版本。`constant_pool_count`\n\n`constant_pool_count` 项的值等于 `constant_pool`\
  \ 表中的条目数加一。如果 `constant_pool` 索引大于 0 且小于 `constant_pool_count`，则认为是有效的，但 `long`\
  \ 和 `double` 类型常量除外（见 §4.4.5 中的说明）。\n\n`constant_pool[]`\n\n`constant_pool` 是一个结构表（§4.4），表示各种字符串常量、类和接口名称、字段名以及在\
  \ `ClassFile` 结构及其子结构中引用的其他常量。每个 `constant_pool` 表条目的格式由其第一个“tag”（标记）字节指示。\n\n`constant_pool`\
  \ 表从 1 到 `constant_pool_count - 1` 进行索引。\n\n`access_flags`\n\n`access_flags` 项的值是一个标志位掩码，用于表示对此类或接口的访问权限和属性。每个标志位在设置时的解释见表\
  \ 4.1-A。\n\n![图像](img/04tab01.jpg)\n\n表 4.1-A. 类访问与修饰符\n\n接口通过设置 `INTERFACE` 标志来区分。如果未设置\
  \ `INTERFACE` 标志，则该 `class` 定义了一个类。\n\n`access_flags` 中在表 4.1-A 中分配的所有位均留作以后使用。它们在生成的\
  \ `class` 文件中应设置为零，并且 Java 虚拟机实现应忽略它们。\n\n`SYNTHETIC` 标志表示此类是由编译器生成的，未出现在源代码中。\n\
  \n类或接口必须设置其 `ABSTRACT`。`ENUM` 标志表示此类是一个枚举类型。\n\n`this_class`\n\n`this_class` 项的值必须是\
  \ `constant_pool` 表的有效索引。该索引处的 `constant_pool` 条目必须是 `CONSTANT_Class_info`（§4.4.1），表示由该\
  \ `class` 文件定义的类或接口。\n\n`super_class`\n\n对于类，`super_class` 项的值要么为零，要么是 `constant_pool`\
  \ 表的有效索引。如果 `super_class` 项的值不零，则该索引处的 `constant_pool` 条目必须是 `CONSTANT_Class_info`\
  \ 结构，表示该 `class` 文件定义的直接父类。直接父类及其任何父类在其 `ClassFile` 结构的 `access_flags` 项中均不能设置 `FINAL`\
  \ 标志。\n\n如果 `super_class` 项的值为零，则此 `class` 文件必须表示 `Object` 类，即唯一没有直接父类的类。\n\n对于接口，`super_class`\
  \ 项的值必须是 `constant_pool` 表的有效索引。该索引处的 `constant_pool` 条目必须是 `CONSTANT_Class_info`\
  \ 结构，表示 `Object` 类。\n\n`interfaces_count`\n\n`interfaces_count` 项的值给此类或接口类型直接父接口的数量。\n\
  \n`interfaces[]`\n\n`interfaces` 数组中的每个值必须是 `constant_pool` 表的有效索引。对于 `interfaces[`i`]`（其中\
  \ 0 ≤ *i* < `interfaces_count`），每个值对应的 `constant_pool` 条目必须是 `CONSTANT_Class_info`\
  \ 结构，表示作为此类或接口类型的直接父接口，并按照源代码中该类型从左到右的顺序排列。\n\n`fields_count`\n\n\n\n\n\n`fields_count`\
  \ 项的值表示 `fields` 表中 `field_info` 结构的数量。`field_info` 结构表示由此类或接口声明的所有字段，包括类变量和实例变量。\n\
  \n`fields[]`\n\n`fields` 表中的每个值必须是一个 `field_info` 结构 (§4.5)，用于对该类或接口中的某个字段的完整描述。`fields`\
  \ 表仅包含由此类或接口声明的字段。它不包含表示继承自超类或超接口的字段的项目。\n\n`methods_count`\n\n`methods_count` 项的值表示\
  \ `methods` 表中 `method_info` 结构的数量。\n\n`methods[]`\n\n`methods` 表中的每个值必须是一个 `method_info`\
  \ 结构 (§4.6)，用于对该类或接口中某个方法的完整描述。如果 `method_info` 结构的 `access_flags` 项中既未设置 `ACC_NATIVE`\
  \ 标记也未设置 `ACC_ABSTRACT` 标记，则还会提供实现该方法的 Java 虚拟机指令。\n\n`method_info` 结构表示由此类或接口声明的所有方法，包括实例方法、类方法、实例初始化方法\
  \ (§2.9) 以及任何类或接口初始化方法 (§2.9)。`methods` 表不包含表示继承自超类或超接口的方法的项目。\n\n`attributes_count`\n\
  \n`attributes_count` 项的值表示此类 `attributes` 表中属性的数量。\n\n`attributes[]`\n\n`attributes`\
  \ 表的每个值必须是一个 `attribute_info` 结构 (§4.7)。\n\n本规范定义的出现在 `ClassFile` 结构 `attributes`\
  \ 表中的属性列在 表 4.7-C 中。\n\n关于定义出现在 `ClassFile` 结构 `attributes` 表中的属性的规则见 §4.7。\n\n\
  关于 `ClassFile` 结构 `attributes` 表中非定义属性的规则见 §4.7.1。\n\n## 4.2 名称的内部形式\n\n### 4.2.1\
  \ 二进制类名和接口名\n\n出现在 `class` 文件结构中的类和接口名始终以完全限定的形式表示，称为*二进制名称*（binary names）（JLS §13.1）。此类名称始终表示为\
  \ `CONSTANT_Utf8_info` 结构 (§4.4.7)，因此在没有进一步限制的情况下，可以从整个 Unicode 代码空间提取。类和接口名引用自那些\
  \ `CONSTANT_NameAndType_info` 结构 (§4.4.6)，这些结构的描述符中包含此类名称 (§4.3)，并引用所有的 `CONSTANT_Class_info`\
  \ 结构 (§4.4.1)。\n\n出于历史原因，出现在 `class` 文件结构中的二进制名称语法与 JLS §13.1 中的二进制名称语法不同。在这种内部形式中，通常分隔组成二进制名称的标识符的\
  \ ASCII 点（`.`）被替换为 ASCII 正斜杠（`/`）。标识符本身必须是非限定名 (§4.2.2)。\n\n例如，类 `Thread` 的普通二进制名称是\
  \ `java.lang.Thread`。在 `class` 文件格式的描述符中使用的内部形式中，对类 `Thread` 名称的引用是通过表示字符串 `java/lang/Thread`\
  \ 的 `CONSTANT_Utf8_info` 结构来实现的。\n\n### 4.2.2 未限定名\n\n方法、字段、局部变量和形式参数的名字存储为*未限定名*（unqualified\
  \ names）。未限定名必须包含至少一个 Unicode 代码点，且不能包含任何 ASCII 字符 `.;  /`（即句号、分号、左方括号或正斜杠）。\n\n\
  方法名受到进一步限制，除了特殊方法名 `<init>` 和 `<clinit>` (§[2.9) 之外，它们不能包含 ASCII 字符 `<` 或 `>`（即左角括号或右角括号）。\n\
  \n注意，字段名或接口方法可以是 `<init>` 或 `<clinit>`，但没有方法调用指令可以引用 `<clinit>`，只有 `invokespecial`\
  \ 指令 `invokespecial](#ch06a.html_ch06lev2sec90) 可以引用 `<init>`。\n\n## 4.3 描述符\n\n\
  *描述符*（descriptor）是表示字段或方法类型的字符串。描述符在 `class` 文件格式中使用修改后的 UTF-8 字符串表示 (§4.4.7)，因此在没有进一步限制的情况下，可以从整个\
  \ Unicode 代码空间提取。\n\n### 4.3.1 语法符号\n\n描述符使用语法规范。语法是一组产生式，描述了字符序列如何形成各种类型的在语法上正确的描述符。语法的终结符号以`等宽`字体显示。非终结符号以*斜体*显示。非终结符号的定义由所定义的非终结符号名称引入，后跟冒号。随后在后续行中给出该非终结符号的一个或多个可选定义。\n\
  \n产生式右侧的语法 `{x}` 表示 *x* 零次或多次出现。\n\n当产生式的冒号后跟随“one of”一词时，意味着后续行或后续几行中的每个终结符号都是一个可选定义。\n\
  \n### 4.3.2 字段描述符\n\n*字段描述符*（field descriptor）表示类、实例或局部变量的类型。\n\n*FieldDescriptor:*\n\
  \n*FieldType*\n\n*FieldType:*\n\n*BaseType*\n\n*ObjectType*\n\n*ArrayType*\n\n*BaseType:*\
  \ one of\n\n`B C D F I J S Z`\n\n*ObjectType:*\n\n`L` *ClassName* `;`\n\n*ArrayType:*\n\
  \n`` *ComponentType*\n\n*ComponentType:*\n\n*FieldType*\n\n*BaseType* 的字符、`ObjectType`\
  \ 的 `L` 和 `;` 以及 `ArrayType` 的 `[` 都是 ASCII 字符。\n\n*ClassName* 表示以内部形式编码的二进制类名或接口名\
  \ (§[4.2.1)。\n\n字段描述符解释为类型的方法所示表 4.3-A。\n\n![Image](img/04tab03.jpg)\n\n**表 4.3-A\
  \ 字段描述符的解释**\n\n`int` 类型实例变量的字段描述符简单为 `I`。\n\n`Object` 类型实例变量的字段描述符是 `Ljava/lang/Object;`。注意使用了类\
  \ `Object` 二进制名称的内部形式。\n\n多维数组类型 `double[] [][]` 实例变量的字段描述符是 `[[D`。\n\n表示数组类型的字段描述符只有在它表示维度少于\
  \ 255 时才有效。\n\n### 4.3.3 方法描述符\n\n*方法描述符*（method descriptor）包含零或多个*参数描述符*（parameter\
  \ descriptors），表示方法接收的参数类型，以及一个*返回描述符*（return descriptor），表示方法返回的值（如果有）的类型。\n\n\
  *MethodDescriptor:*\n\n`(` *{ParameterDescriptor}` `)` *ReturnDescriptor*\n\n*ParameterDescriptor:*\n\
  \n*FieldType*\n\n*ReturnDescriptor:*\n\n*FieldType*\n\n*VoidDescriptor*\n\n*VoidDescriptor:*\n\
  \n`V`\n\n字符 `V` 表示方法不返回任何值（其结果为 `void`）。\n\n该方法的描述符：\n\n[点击此处查看图像\n\nObject m(int\
  \ i, double d, Thread t) {...}\n\n为：\n\n点击此处查看图像\n\n(IDLjava/lang/Thread;)Ljava/lang/Object;\n\
  \n注意使用了 `Thread` 和 `Object` 二进制名称的内部形式。\n\n\n\n\n\n方法描述符（method descriptor）仅当它表示的方法参数总长度小于或等于\
  \ 255 时才有效，该长度在实例方法或接口方法调用时包含了 `this` 的贡献。总长度通过累加各个参数的贡献来计算，其中，类型为 `long` 或 `double`\
  \ 的参数对长度贡献两个单位，而任何其他类型的参数贡献一个单位。\n\n无论该方法所描述的是类方法还是实例方法，其方法描述符都是相同的。虽然实例方法除了接收预期的参数外，还传递了\
  \ `this`（即正在调用该方法的对象的引用），但这一事实并没有反映在方法描述符中。对 `this` 的引用是由调用实例方法的 Java 虚拟机指令隐式传递的（见\
  \ §2.6.1 和 §4.11）。\n\n## 4.4 常量池 (Constant Pool)\n\nJava 虚拟机指令不依赖于类、接口、类实例或数组的运行时布局。相反，指令引用\
  \ `constant_pool` 表中的符号信息。\n\n所有 `constant_pool` 表项都具有以下通用格式：\n\n```\ncp_info {\n\
  \    u1 tag;\n    u1 info[];\n}\n```\n\n`constant_pool` 表中的每个项目必须以一个 1 字节的标记（tag）开头，指示\
  \ `cp_1` 项的类型。`info` 数组的内容随 `tag` 的值而变化。有效的标记及其值列在表 4.4-A](#ch04.html_ch04tab4-A)\
  \ 中。每个标记字节后必须跟随两个或多个字节，用于提供有关特定常量的信息。额外信息的格式随 `tag` 值而变化。\n\n![Image](img/04tab04.jpg)\n\
  \n**表 4.4-A. 常量池标记**\n\n### 4.4.1 CONSTANT_Class_info 结构\n\n`CONSTANT_Class_info`\
  \ 结构用于表示一个类或接口：\n\n```\nCONSTANT_Class_info {\n    u1 tag;\n    u2 name_index;\n\
  }\n```\n\n`CONSTANT_Class_info` 结构的项如下：\n\n`tag`\n`tag` 项的值为 `CONSTANT_Class` (7)。\n\
  \n`name_index`\n`name_index` 项的值必须是 `constant_pool` 表的有效索引。该索引处的 `constant_pool`\
  \ 项必须是一个 `CONSTANT_Utf8_info` 结构（见 §4.4.7），表示一个以内部形式编码的有效二进制类或接口名称（见 §4.2.1）。\n\n\
  由于数组是对象，操作码 `anewarray` 和 `multianewarray`——但不是操作码 `new`——可以通过 `constant_pool` 表中的\
  \ `CONSTANT_Class_info` 结构来引用数组“类”。对于此类数组类，类名就是数组类型的描述符（见 §4.3.2）。\n\n例如，代表二维数组类型\
  \ `int[][]` 的类名是 `[[I`，而代表类型 `Thread[]` 的类名是 `Ljava/lang/Thread;`。\n\n数组类型描述符仅当它表示\
  \ 255 个或更少维度时有效。\n\n### 4.4.2 CONSTANT_Fieldref_info, CONSTANT_Methodref_info 和\
  \ CONSTANT_InterfaceMethodref_info 结构\n\n字段、方法和接口方法由类似的结构表示：\n\n[点击此处查看代码图片\n\n\
  ```\nCONSTANT_Fieldref_info {\n    u1 tag;\n    u2 class_index;\n    u2 name_and_type_index;\n\
  }\n\nCONSTANT_Methodref_info {\n    u1 tag;\n    u2 class_index;\n    u2 name_and_type_index;\n\
  }\n\nCONSTANT_InterfaceMethodref_info {\n    u1 tag;\n    u2 class_index;\n    u2\
  \ name_and_type_index;\n}\n```\n\n这些结构的项如下：\n\n`tag`\n`CONSTANT_Fieldref_info` 结构的\
  \ `tag` 项的值为 `CONSTANT_Fieldref` (9)。\n`CONSTANT_Methodref_info` 结构的 `tag` 项的值为\
  \ `CONSTANT_Methodref` (10)。\n`CONSTANT_InterfaceMethodref_info` 结构的 `tag` 项的值为\
  \ `CONSTANT_InterfaceMethodref` (11)。\n\n`class_index`\n`class_index` 项的值必须是 `constant_pool`\
  \ 表的有效索引。该索引处的 `constant_pool` 项必须是一个 `CONSTANT_Class_info` 结构（见 §4.4.1），表示一个类或接口。`CONSTANT_Methodref_info`\
  \ 结构的 `class_index` 项必须是一个类类型。`CONSTANT_InterfaceMethodref_info` 结构的 `class_index`\
  \ 项必须是一个接口类型。`CONSTANT_Fieldref_info` 结构的 `class_index` 项可以是类类型。\n\n`name_and_type_index`\n\
  `name_and_type_index` 项的值必须是 `constant_pool` 表的有效索引。该索引处的 `constant_pool` 项必须是一个\
  \ `CONSTANT_Utf8_info` 结构（见 §4.4.7），表示名称和类型。\n\n### 4.4.3 CONSTANT_String 结构\n\n\
  `CONSTANT_String_info` 结构用于字符串常量：\n\n```\nCONSTANT_String {\n    u1 tag;\n    u2\
  \ string_index;\n}\n```\n\n`CONSTANT_String` 结构的项如下：\n\n`tag`\n`tag` 项的值为 `CONSTANT_String`\
  \ (8)。\n\n`string_index`\n`string_index` 项的值必须是 `constant_pool` 表的有效索引。该索引处的 `constant_pool`\
  \ 项必须是一个 `CONSTANT_Utf8_info` 结构（见 §4.4.7），表示要初始化 `String` 对象的序列点。\n\n### 4.4.4\
  \ CONSTANT_Integer_info 和 CONSTANT_Float_info 结构\n\n`CONSTANT_Integer_info` 和 `CONSTANT_Float_info`\
  \ 结构表示 4 字节常量：\n\n```\nCONSTANT_Integer {\n    u1 tag;\n    u4 bytes;\n}\n\nCONSTANT_Float\
  \ {\n    u1 tag;\n    u4 bytes;\n}\n```\n\n这些结构的项如下：\n\n`tag`\n`CONSTANT_Integer_info`\
  \ 结构的 `tag` 项的值为 `CONSTANT_Integer` (3)。\n`CONSTANT_Float_info` 结构的 `tag` 项的值为 `CONSTANT_Float`\
  \ (4)。\n\n`bytes`\n`CONSTANT_Integer_info` 结构的 `bytes` 项表示 `int` 常量的值。字节以大端序（高字节在前）存储。\n\
  `CONSTANT_Float_info` 结构的 `bytes` 项以 IEEE 754 浮点单精度格式表示 `float` 量。字节以大端序存储。\n\n\
  `CONSTANT_Float_info` 结构表示的值如下确定。首先将字节转换为 `int` 常量 *bits*。然后：\n\n- 如果 *bits* 为 `0x7f80000`，`float`\
  \ 值将为正无穷。\n- 如果 *bits* 为 `0xff80000`，`float` 值将为负无穷。\n- 如果 *bits* 处于 `0x7f80001`\
  \ 到 `0x7fffffff` 范围内，或者 `0xff800001` 到 `0xffffffff` 范围内，`float` 值将为 NaN。\n- 在所有其他情况下，令\
  \ `s`、`e` 和 `m` 为三个可能从 *bits* 计算出的值：\n\n```\nint s = ((bits >> 31) == 0) ? 1 : -1;\n\
  int e = ((bits >> 23) & 0xff);\nint m = (e == 0) ?\n    (bits & 0x7fffff) << 1 :\n\
  \    (bits & 0x7fffff) | 0x800000;\n```\n\n那么 `float` 值等于数学表达式 `s · m · 2`^(`e-150`)\
  \ 的结果。\n\n\n\n\n\n### 4.4.5 CONSTANT_Long_info 和 CONSTANT_Double_info 结构\n\n`CONSTANT_Long_info`\
  \ 和 `CONSTANT_Double_info` 代表 8 字节的数值（`long` 和 `double`）常量：\n\n```\nCONSTANT_Long_info\
  \ {\n    u1 tag;\n    u4 high_bytes;\n    u4 low_bytes;\n}\n\nCONSTANT_Double_info\
  \ {\n    u1 tag;\n    u4 high_bytes;\n    u4 low_bytes;\n}\n```\n\n所有 8 字节的常量都占用\
  \ `class` 文件中 `constant_pool` 表的两个条目。如果 `CONSTANT_Long_info` 或 `CONSTANT_Double_info`\
  \ 结构是 `constant_pool` 表中索引 `n` 处的项，那么池中下一个可用的项位于索引 `n+2` 处。`constant_pool` 索引 `n+1`\
  \ 必须有效，但被视为不可用。\n\n回想起来，让 8 字节的常量占用两个常量池条目是一个糟糕的选择。\n\n这些结构的组成项如下：\n\n`tag`\n\n\
  `CONSTANT_Long_info` 结构中的 `tag` 项的值为 `CONSTANT_Long` (5)。\n\n`CONSTANT_Double_info`\
  \ 结构中的 `tag` 项的值为 `CONSTANT_Double` (6)。\n\n`high_bytes, low_bytes`\n\n`CONSTANT_Long_info`\
  \ 结构中的无符号 `high_bytes` 和 `low_bytes` 项共同代表 `long` 常量的值。\n\n点击此处查看代码图像\n\n```\n((long)\
  \ high_bytes << 32) + low_bytes\n```\n\n其中 `high_bytes` 和 `low_bytes` 每个项的字节都按大端序（高字节在前）顺序存储。\n\
  \n`CONSTANT_Double_info` 结构中的 `high_bytes` 和 `low_bytes` 项共同代表 IEEE 754 浮点双精度格式中的\
  \ `double` 值（§2.3.2）。每个项的字节按大端序（高字节在前）顺序存储。\n\n`CONSTANT_Double_info` 结构表示的值按如下方式确定。`high_bytes`\
  \ 和 `low_bytes` 项转换为 `long` 常量 `bits`，其值等于：\n\n点击此处查看代码图像\n\n```\n((long) high_bytes\
  \ << 32) + low_bytes\n```\n\n然后：\n\n* 如果 `bits` 为 `0x7ff0000000000000L`，则 `double`\
  \ 值为正无穷。\n* 如果 `bits` 为 `0xfff0000000000000L`，则 `double` 值为负无穷。\n* 如果 `bits` 处于\
  \ `0x7ff0000000000001L` 到 `0x7fffffffffffffffL` 范围内，或者处于 `0xfff0000000000001L` 到\
  \ `0xffffffffffffffffL` 范围内，则 `double` 值为 NaN。\n* 在所有其他情况下，令 `s`、`e` 和 `m` 为从 `bits`\
  \ 可能计算出的三个值：\n\n点击此处查看代码图像\n\n```\nint s = ((bits >> 63) == 0) ? 1 : -1;\nint e\
  \ = (int)((bits >> 52) & 0x7ffL);\nlong m = (e == 0) ?\n          (bits & 0xfffffffffffffL)\
  \ << 1 :\n          (bits & 0xfffffffffffffL) | 0x10000000000000L;\n```\n\n那么，浮点值等于数学表达式\
  \ `s · m · 2`^(`e-1075`)` 的 `double` 值。\n\n### 4.4.6 CONSTANT_NameAndType_info 结构\n\
  \n`CONSTANT_NameAndType_info` 结构用于表示字段或方法，但不指示它属于哪个类或接口类型：\n\n```\nCONSTANT_NameAndType_info\
  \ {\n    u1 tag;\n    u2 name_index;\n    u2 descriptor_index;\n}\n```\n\n`CONSTANT_NameAndType_info`\
  \ 结构的组成项如下：\n\n`tag`\n\n`CONSTANT_NameAndType_info` 结构中的 `tag` 项的值为 `CONSTANT_NameAndType`\
  \ (12)。\n\n`name_index`\n\n`name_index` 项的值必须是 `constant_pool` 表的有效索引。该索引处的 `constant_pool`\
  \ 条目必须是一个 `CONSTANT_Utf8_info` 结构 (§4.4.7)，表示特殊方法名 `<init>` 或表示字段或方法的有效未限定名称（§4.2.2)）。\n\
  \n`descriptor_index`\n\n`descriptor_index` 项的值必须是 `constant_pool` 表的有效索引。该索引处的 `constant_pool`\
  \ 条目必须是一个 `CONSTANT_Utf8_info` 结构 (§4.4.7)，表示字段或方法的描述符。\n\n### 4.4.7 CONSTANT_Utf8_info\
  \ 结构\n\n`CONSTANT_Utf8_info` 结构用于表示字符串：\n\n```\nCONSTANT_Utf8_info {\n    u1 tag;\n\
  \    u2 length;\n    u1 bytes[];\n}\n```\n\n`CONSTANT_Utf8_info` 结构的项如下：\n\n`tag`\n\
  \n`CONSTANT_Utf8_info` 结构中的 `tag` 项的值为 `CONSTANT_Utf8` (1)。\n\n`length`\n\n`CONSTANT_Utf8_info`\
  \ 结构中的 `length` 项表示 `bytes` 数组的字节数。\n\n`bytes`\n\n`CONSTANT_Utf8_info` 结构中的 `bytes`\
  \ 数组包含字符串的内容。\n\n这种 UTF-8 格式与标准 UTF-8 格式有两不同：首先，空字符 `(char)0` 使用 2 字节编码而非 1 字节，这样修改\
  \ UTF-8 字符串就不会包含空字符。其次，只使用标准 UTF-8 的 1 字节、2 字节和 3 字节格式。虚拟机不识别标准 UTF-8 的 4 字节格式；它使用自己的两次三次字节格式。\n\
  \n\n\n\n\n- 如果 `reference_kind` 项的值为 1 (`REF_getField`)、2 (`REF_getStatic`)、3 (`REF_putField`)\
  \ 或 4 (`REF_putStatic`)，则该索引处的 `constant_pool` 条目必须是一个 `CONSTANT_Fieldref_info`\
  \ 结构（§4.4.2)），代表用于创建方法句柄（method handle）的字段。\n\n- 如果 `reference_kind` 项的值为 5 (`REF_invokeVirtual`)\
  \ 或 8 (`REF_newInvokeSpecial`)，则该索引处的 `constant_pool` 条目必须是一个 `CONSTANT_Methodref_info`\
  \ 结构（§4.4.2)），代表类的方法或构造函数（§2.9)），用于对其创建方法句柄。\n\n- 如果 `reference_kind` 项的值为 6 (`REF_invokeStatic`)\
  \ 或 7 (`REF_invokeSpecial`)，则如果 `class` 文件版本号小于 52.0，该索引处的 `constant_pool` 条目必须是一个\
  \ `CONSTANT_Methodref_info` 结构，代表用于创建方法句柄的类方法；如果 `class` 文件版本号为 52.0 或以上，则该索引处的\
  \ `constant_pool` 条目可以是 `CONSTANT_Methodref_info` 结构或 `CONSTANT_InterfaceMethodref_info`\
  \ 结构（§4.4.2)），代表用于创建方法句柄的类方法或接口方法。\n\n- 如果 `reference_kind` 项的值为 9 (`REF_invokeInterface`)，则该索引处的\
  \ `constant_pool` 条目必须是一个 `CONSTANT_InterfaceMethodref_info` 结构，代表用于创建方法句柄的接口方法。\n\
  \n如果 `reference_kind` 项的值为 5 (`REF_invokeVirtual`)、6 (`REF_invokeStatic`)、7 (`REF_invokeSpecial`)\
  \ 或 9 (`REF_invokeInterface`)，则由 `CONSTANT_Methodref_info` 结构或 `CONSTANT_InterfaceMethodref_info`\
  \ 结构所的方法名不能为 `<init>` 或 `<clinit>`。\n\n如果该值为 8 (`REF_newInvokeSpecial`)，则由 `CONSTANT_Methodref_info`\
  \ 结构所的方法名必须为 `<init>`。\n\n#### 4.4.9 CONSTANT_MethodType_info 结构\n\n`CONSTANT_MethodType_info`\
  \ 结构用于表示一种方法类型：\n\n```\nCONSTANT_MethodType_info {\n    u1 tag;\n    u2 descriptor_index;\n\
  }\n```\n\n`CONSTANT_MethodType_info` 结构的各项项如下：\n\n##### `tag`\n`CONSTANT_MethodType_info`\
  \ 结构的 `tag` 项的值为 `CONSTANT_MethodType` (16)。\n\n##### `descriptor_index`\n`descriptor_index`\
  \ 项的值必须是 `constant_pool` 表的有效索引。该索引处的 `constant_pool` 条目必须是一个 `CONSTANT_Utf8_info`\
  \ 结构（§4.4.7)），代表一个方法描述符（method descriptor）（§4.3.3）。\n\n#### 4.4.10 CONSTANT_InvokeDynamic_info\
  \ 结构\n\n`CONSTANT_InvokeDynamic_info` 结构用于 `invokedynamic` 指令（§*invokedynamic)）来指定引导方法（bootstrap\
  \ method）、动态调用名称、调用的参数和返回类型，以及可选的一组称为*静态参数*（static arguments）的额外常量序列给引导方法。\n\n点击此处查看代码图像\n\
  \n```\nCONSTANT_InvokeDynamic_info {\n    u1 tag;\n    u2 bootstrap_method_attr_index;\n\
  \    u2 name_and_type_index;\n}\n```\n\n`CONSTANT_InvokeDynamic_info` 结构的各项如下：\n\
  \n##### `tag`\n`CONSTANT_InvokeDynamic_info` 结构的 `tag` 项的值为 `CONSTANT_InvokeDynamic`\
  \ (18)。\n\n##### `bootstrap_method_attr_index`\n`bootstrap_method_attr_index` 项的值必须是该\
  \ `class` 文件引导方法表（§4.7.23）中 `bootstrap_methods` 数组的有效索引。\n\n##### `name_and_type_index`\n\
  `name_and_type_index` 项的值必须是 `constant_pool` 表的有效索引。该索引处的 `constant_pool` 条目必须是一个\
  \ `CONSTANT_NameAndType_info` 结构（§4.4.6)），代表方法名和方法描述符（§4.3.3）。\n\n## 4.5 字段 (Fields)\n\
  \n每个字段由 `field_info` 结构描述。\n\n一个 `class` 文件中不存在两个字段具有相同的名称和描述符（§4.3.2）。\n\n该结构具有以下格式：\n\
  \n点击此处查看代码图像\n\n```\nfield_info {\n    u2 access_flags;\n    u2 name_index;\n  \
  \  u2 descriptor_index;\n    u2 attributes_count;\n    attribute_info attributes[attributes_count];\n\
  }\n```\n\n`field_info` 结构的各项如下：\n\n##### `access_flags`\n`access_flags` 项的值是用于表示访问权限的标志掩码。每个标志的解释见表\
  \ 4.5。\n\n![表 4.5](img/04tab5.jpg)\n\n类字段可以设置任何 `ACC_PUBLIC`、`ACC_PRIVATE`、`ACC_PROTECTED`标志。它们可以具有\
  \ `ACC_FINAL`（JLS §8.3），但不能具有 `ACC_VOLATILE`（JLS §8.3）。\n\n接口字段必须具有 `ACC_PUBLIC`、`ACC_STATIC`标志。它们可以具有\
  \ `ACC_FINAL`（JLS §8.3）。\n\n`access_flags` 中未在表 4.5 中分配的所有位均留供未来使用。在生成的文件中应置为零。\n\
  \n##### `name_index`\n`name_index` 的值必须是 `constant_pool` 的有效索引。该索引处的 `constant_pool`\
  \ 条目必须是一个 `CONSTANT_Utf8_info` 结构（§4.4.7)），代表一个有效的名称（§4.2）。\n\n##### `descriptor_index`\n\
  `descriptor_index` 的值必须是 `constant_pool` 的有效索引。该索引处的 `constant_pool` 条目必须是一个 `CONSTANT_Utf8_info`\
  \ 结构（§4.4.7)），代表一个有效的描述符（§4.3.3）。\n\n##### `attributes_count`\n`attributes_count`\
  \ 的值指示属性的数量。\n\n##### `attributes`\n`attributes` 表的每个值必须是一个 `attribute_info` 结构。字段可以关联任意数量的可选属性。本规范定义为出现在\
  \ `field_info` 结构 `attributes` 表中的属性列于表 4.7-C。关于出现在 `field_info` 结构 `attributes`\
  \ 表中的属性的规则见§4.7。关于`field_info` 结构 `attributes` 表中的非定义属性的规则见§4.7.1。\n\n\n\n\n\n`method_info`\
  \ 结构的项如下：\n\n### `access_flags`\n\n`access_flags` 项的值是一个标志位掩码，用于表示对该方法的访问权限和属性。每个标志位在设置时的解释见表\
  \ 4.6-A。\n\n![Image](img/04tab06.jpg)\n\n**表 4.6-A. 方法访问与属性标志位**\n\n类的方法可以设置表 4.6-A\
  \ 中的任何标志位。然而，一个类（class）中的每个方法最多可以设置 `ACC_PUBLIC`、`ACC_PRIVATE` 和 `ACC_PROTECTED`\
  \ 标志中的一个（JLS §8.4.3）。\n\n接口的方法可以设置表 4.6-A 中的任何标志位，但 `ACC_PROTECTED`、`ACC_FINAL`、`ACC_SYNCHRONIZED`\
  \ 和 `ACC_NATIVE` 除外（JLS §9.4）。在版本号小于 52.0 的 `class` 文件中，接口的每个方法必须设置 `ACC_PUBLIC`\
  \ 和 `ACC_ABSTRACT` 标志；在版本号为 52.0 或以上的 `class` 文件中，接口的每个方法必须设置 `ACC_PUBLIC` 和 `ACC_PRIVATE`\
  \ 标志中的其中一个。\n\n如果类或接口的方法设置了 `ACC_ABSTRACT` 标志，则不能设置 `ACC_PRIVATE`、`ACC_STATIC`、`ACC_FINAL`、`ACC_SYNCHRONIZED`、`ACC_NATIVE`\
  \ 或 `ACC_STRICT` 中的任何一个标志。\n\n每个实例初始化方法（§2.9）最多设置 `ACC_PUBLIC`、`ACC_PRIVATE` 和 `ACC_PROTECTED`\
  \ 标志中的其中一个，也可以设置 `ACC_VARARGS`、`ACC_STRICT` 和 `ACC_SYNTHETIC` 标志，但不能设置表 4.6-A 中的任何其他标志。\n\
  \n类和接口的初始化方法由 Java 虚拟机隐式调用。它们的 `access_flags` 项的值除了设置 `ACC_STRICT` 标志外，均被忽略。\n\n\
  `ACC_BRIDGE` 标志用于指示由 Java 编程语言编译器生成的桥接方法（bridge method）。\n\n`ACC_VARARGS` 标志表示该方法在源代码级别接受可变数量参数。声明为接受可变参数的方法必须在\
  \ `ACC_VARARGS` 标志设置为 1 的情况下编译。所有其他方法必须在 `ACC_VARARGS` 标志设置为 0 的情况下编译。\n\n`ACC_SYNTHETIC`\
  \ 标志表示该方法是由编译器生成的，且未出现在源码中，除非它是 §4.7.8 中列出的方法之一。\n\n表 4.6-A 中未分配的 `access_flags`\
  \ 项的所有位均预留供以后使用。它们在生成的 `class` 文件中应被设置为 0，并被 Java 虚拟机实现所忽略。\n\n### `name_index`\n\
  \n`name_index` 项的值必须是 `constant_pool` 表的有效索引。该索引处的 `constant_pool` 必须是一个 `CONSTANT_Utf8_info`\
  \ 结构（§4.4.7），表示特殊方法名 `<init>` 或 `<clinit>`（§2.9）之一，或者是一个表示方法的有效未限定名称（§4.2.2）。\n\n\
  ### `descriptor_index`\n\n`descriptor_index` 项的值必须是 `constant_pool` 表的有效索引。该索引处的\
  \ `constant_pool` 条目必须是一个 `CONSTANT_Utf8_info` 结构，表示有效的方法描述符（§4.3.3）。\n\n本规范的未来版本可能要求，如果\
  \ `access_flags` 项中设置了 `ACC_VARARGS` 标志，则方法描述符的最后一个参数描述符必须是数组类型。\n\n### `attributes_count`\n\
  \n`attributes_count` 项的值表示该方法的额外属性的数量。\n\n### `attributes[]`\n\n`attributes` 表中的每个值都必须是一个\
  \ `attribute_info` 结构（§4.7）。\n\n方法可以关联任意数量的可选属性。\n\n本规范定义的、且出现在 `method_info` 结构\
  \ `attributes` 表中的属性，列在表 4.7-C 中。\n\n关于出现在 `method_info` 结构 `attributes` 表中的属性的规则见\
  \ §4.7。\n\n关于 `method_info` 结构 `attributes` 表中非预定义属性的规则见 §4.7。\n\n\n\n\n\n版本 `V`\
  \ 的 `class` 文件中的这些属性每一个都必须被实现类识别并正确读取——即 Java SE 平台类库的实现，前提是该实现类识别版本为 `V` 的 `class`\
  \ 文件，且 `V` 至少是该属性首次定义的版本，并且该属性出现在其定义允许出现的位置。\n\n### 3. 以下六个属性对于 Java 虚拟机或 Java SE\
  \ 平台类库正确解释 `class` 文件并非至关重要，但对于工具来说是很有用的：\n\n* `SourceFile`\n* `SourceDebugExtension`\n\
  * `LineNumberTable`\n* `LocalVariableTable`\n* `LocalVariableTypeTable`\n* `Deprecated`\n\
  \nJava 虚拟机或 Java SE 平台类库的实现类对这些属性的使用是可选的。实现类可以使用这些属性所包含的信息，否则必须静默地忽略这些属性。\n\n###\
  \ 4.7.1 定义和命名新属性\n\n编译器允许在 `class` 文件结构中的 `attributes` 表、`field_info` 结构、`method_info`\
  \ 结构以及 `Code` 属性（§4.7.3）中定义并发布包含新属性的 `class` 文件。Java 虚拟机实现允许识别并使用这些 `attributes`\
  \ 表中的新属性。然而，任何未定义为 `class` 文件规范部分的属性都不得影响 `class` 文件的语义。Java 虚拟机实现要求静默忽略其不识别的属性。\n\
  \n例如，允许定义新属性以支持特定厂商的调试。由于 Java 虚拟机实现要求忽略其不识别的属性，为该特定 Java 虚拟机实现设计的 `class` 文件可以被其他实现类使用，即使这些实现类无法利用\
  \ `class` 文件包含的额外调试信息。\n\n明确禁止 Java 虚拟机实现因为存在某些新属性而抛出异常或拒绝使用 `class` 文件。当然，操作 `class`\
  \ 文件的工具如果收到不包含其所需所有属性的 `class` 文件，可能无法正常运行。\n\n两个本应不同但恰好使用相同属性名称且长度相同的属性将在识别其中任一属性的实现类上发生冲突。除本规范之外定义的属性，其名称必须根据*Java\
  \ 语言规范，Java SE 8 版》（JLS §6.1）中描述的包命名规范进行选择。\n\n本规范的未来版本可能会定义额外的属性。\n\n### 4.7.2\
  \ ConstantValue 属性\n\n`ConstantValue` 属性是 `field_info` 结构 `attributes` 表中的固定长度属性（§4.5）。`ConstantValue`\
  \ 属性表示常量表达式的值（JLS §15.28），其使用方式如下：\n\n* 如果 `field_info` 结构 `access_flags` 项中的 `ACC_STATIC`\
  \ 标志被设置，则 `field_info` 结构表示的字段在声明该字段的类或接口的初始化过程中，被赋值为其 `ConstantValue` 属性所表示的值（§5.5）。这发生在该类或接口的类或接口初始化方法调用之前（§2.9）。\n\
  * 否则，Java 虚拟机必须静默地忽略该属性。\n\n`field_info` 结构的 `attributes` 表中最多可以有一个 `ConstantValue`\
  \ 属性。\n\n`ConstantValue` 属性具有以下格式：\n\n```\nConstantValue_attribute {\n    u2 attribute_name_index;\n\
  \    u4 attribute_length;\n    u2 constantvalue_index;\n}\n```\n\n`ConstantValue_attribute`\
  \ 结构的项如下：\n\n`attribute_name_index`\n`attribute_name_index` 项的值必须是指向 `constant_pool`\
  \ 表的有效索引。`constant_pool` 在该索引处的项必须是一个 `CONSTANT_Utf8_info` 结构（§4.4.7），表示字符串“`ConstantValue`”。\n\
  \n`attribute_length`\nConstantValue_attribute 结构中 `attribute_length` 项的值必须为 2。 \n\
  \n`constantvalue_index`\n`constantvalue_index` 项的值必须是指向 `constant_pool` 表的有效索引。`constant_pool`\
  \ 在该索引处的项给出该属性表示的常量值。`constant_pool` 项的类型必须与字段类型匹配，参见表 4.7.2-A (#ch04.html_ch04tab7_2-A)。\n\
  \n![Image](img/102tab01.jpg)\n\n**表 4.7.2-A. 常量值属性类型**\n\n### 4.7.3 Code 属性\n\n\
  `Code` 属性是 `method_info` 结构 `attributes` 表中的变长度属性（§4.6）。`Code` 属性包含方法的 Java 虚拟机指令和辅助信息，包括实例化初始化方法或类或接口初始化方法（§2.9）。\n\
  \n如果方法是 `native` 或 `abstract`，则其 `method_info` 结构不得有 `Code` 属性。否则，其 `method_info`\
  \ 结构必须有一个 `Code` 属性。\n\n`Code` 属性具有以下格式：\n\n```\nCode_attribute {\n    u2 attribute_name_index;\n\
  \    u4 attribute_length;\n    u2 max_stack;\n    u2 max_locals;\n    u4 code_length;\n\
  \    code[code_length];\n    u2 exception_table_length;\n    {\n        u2 start_pc;\n\
  \        u2 end_pc;\n        u2 handler_pc;\n        u2 catch_type;\n    }[exception_table_length];\n\
  \    u2 attributes_count;\n    attribute[attributes_count];\n}\n```\n\nCode 结构的项如下：\n\
  \n`attribute_name_index`\n`attribute_name_index` 项的值必须是指向 `constant_pool` 表的有效索引。`constant_pool`\
  \ 在该索引处的项必须是一个 `CONSTANT_Utf8_info` 结构（§4.4.7），表示字符串“`Code`”。\n\n`attribute_length`\n\
  Code_attribute 结构中 `attribute_length` 项的值表示属性的长度，但不包括初始六字节。\n\n`max_stack`\n`max_stack`\
  \ 项的值给出该方法执行期间任何时刻操作栈的最大深度（§2.6.2）。\n\n`max_locals`\n`max_locals` 项的值给出调用方法时分配的局部变量数组的数量（§2.6.1），包括用于传递参数的局部变量。\n\
  \n`long` 或 `double` 类型的最大局部变量索引为 `max_locals - 2`。任何其他类型的最大局部变量索引为 `max_locals -\
  \ 1`。\n\n`code_length`\n`code_length` 项的值给出方法 `code` 数组的字节数。`code_length` 的值必须大于\
  \ 0 小于 65536。\n\n`code[]`\n`code` 数组提供了实现方法的实际字节码。当 `code` 数组在字节寻址机器上读取到内存时，如果数组的首字节对齐在\
  \ 4 字节边界，*tableswitch* 和 *lookupswitch* 的 32 位偏移量将 4 字节对齐。（参见这些指令的描述获取更多有关 `code`\
  \ 数组对齐的影响。）\n\n`code` 数组内容的详细约束非常详尽，将在单独的章节给出（§4.9）。\n\n`exception_table_length`\n\
  \n\n\n\n\n`exception_table_length` 项的值表示 `exception_table` 表中的项数。\n\n`exception_table[]`\n\
  \n`exception_table` 数组中的每个项描述了 `code` 数组中的一个异常处理器。`exception_table` 数组中处理器的顺序具有重要意义（§2.10）。\n\
  \n每个 `exception_table` 条目包含以下四个项：\n\n### `start_pc, end_pc`\n\n`start_pc` 和 `end_pc`\
  \ 这两个项的值表示异常处理器在 `code` 数组中有效的范围。`start_pc` 的值必须是 `code` 数组中某个指令操作码的有效索引。`end_pc`\
  \ 的值必须是 `code` 数组中某个指令操作码的有效索引，或者必须等于 `code_length`（`code` 数组的长度）。`start_pc` 的值必须小于\
  \ `end_pc` 的值。\n\n`start_pc` 是包含的，而 `end_pc` 是排他的；也就是说，当程序计数器处于区间 `start_pc`, `end_pc)`\
  \ 内时，异常处理器必须处于激活状态。\n\n`end_pc` 排他的事实 Java 虚拟机设计中的一个历史错误：如果一个方法的 Java 虚拟机代码恰好为 65535\
  \ 字节长，并以一条 1 字节长的指令结束，那么该指令无法被异常处理器保护。编译器编写者可以通过限制任何方法、实例初始化方法或静态初始化器生成的 Java 虚拟机代码（即任何代码数组的尺寸）的最大尺寸为\
  \ 65534 字节来绕过这个 bug。\n\n### `handler_pc`\n\n`handler_pc` 项的值表示异常处理器的起始位置。该项的值必须是\
  \ `code` 数组的有效索引，并且必须是某个指令操作码的索引。\n\n### `catch_type`\n\n如果 `catch_type` 项的值非零，它必须是\
  \ `constant_pool` 表的有效索引。该索引处的 `constant_pool` 条目必须是一个 `CONSTANT_Class_info` 结构（§[4.4.1），表示该异常处理器指定用于捕获的异常类。只有当抛出的异常是给定类的实例或其子类的实例时，才会调用异常处理器。\n\
  \n验证器会检查该类是否为 `Throwable` 或 `Throwable` 的子类（§4.9.2）。\n\n如果 `catch_type` 项的值为零，则所有异常都会调用此异常处理器。\n\
  \n这用于实现 `finally`（§3.13）。\n\n### `attributes_count`\n\n`attributes_count` 项的值表示\
  \ `Code` 属性的属性数量。\n\n### `attributes[]`\n\n`attributes` 表中的每个值必须是一个 `attribute_info`\
  \ 结构（§4.7）。\n\n`Code` 属性可以关联任意数量的可选属性。\n\n本规范定义为出现在 `Code` 属性的 `attributes` 表中的属性列在表\
  \ 4.7-C 中。\n\n关于出现在 `Code` 属性的 `attributes` 表中的属性定义的规则见 §4.7。\n\n关于 `Code` 属性的 `attributes`\
  \ 表中非预定义属性的规则见 §4.7.1。\n\n#### 4.7.4 StackMapTable 属性\n\n`StackMapTable` 属性是 `Code`\
  \ 属性 `attributes` 表中的一个变长度属性（§4.7.3\n\n```\nStackMapTable_attribute {\n    u2  \
  \        attribute_name_index;\n    u4          length;\n    u2          number_of_entries;\n\
  \    stack_map_frame entries[number_of_entries];\n}\n```\n\n`StackMapTable_attribute`\
  \ 的项如下：\n\n### `attribute_name_index`\n\n`attribute_name_index` 项的值必须是 `constant_pool`\
  \ 表的有效索引。该索引处的 `constant_pool` 条目必须是一个 `CONSTANT_Utf_info` 结构（§4.4.1），表示字符串“StackMapTable”。\n\
  \n### `length`\n\n`length` 项的值表示属性的长度，不包括 `attribute_name_index`。\n\n### `number_of_entries`\n\
  \n`number_of_entries` 项的值给出 `entries` 表中 `stack_map_frame` 项的数。\n\n### `entries[]`\n\
  \n`entries` 表中的每个项描述一个栈映射帧（stack map frame）。`entries` 表中栈映射帧的顺序具有重要意义。\n\n在版本号为\
  \ 50.0 或以上的 `class` 文件中，如果一个方法的 `Code` 属性没有 `StackMapTable` 属性，则它有一个*隐式栈映射属性*（§4.10.1）。\n\
  \n`verification_type` 指定一个或两个位置的类型，其中*位置*（location）可以是单个局部变量或单个操作栈条目。验证类型由判析联合体\
  \ `verification_type_info` 表示，它由一个字节标签组成，用于指示联合体使用的是哪项，随后是零或多个字节，提供关于标签的更多信息。\n\n\
  ```union verification_type_info {\n    Top_variable_info;\n    Integer_variable_info;\n\
  \    Float_variable_info;\n    Long_variable_info;\n    Double_variable_info;\n\
  \    Null_variable_info;\n    UninitializedThis_variable_info;\n    Object_variable_info;\n\
  \    Uninitialized_variable_info;\n}\n```\n\n指定局部变量数组或操作栈中单个位置的验证类型由 `verification_type_info`\
  \ 联合体的以下项表示：\n\n• `Top_variable_info` 项表示该局部变量验证类型为 `top`。\n\n点击此处查看代码图\n\n```\n\
  Top_variable_info {\n    u1 tag = ITEM_Top; /* 0 */\n}\n```\n\n\n\n\n\n- `Integer_variable_info`\
  \ 项表示该位置具有验证类型 `int`。\n\n点击此处查看代码图像\n\n```c\nInteger_variable_info {\n    u1 tag\
  \ = ITEM_Integer; /* 1 */\n}\n```\n\n- `Float_variable_info` 项表示该位置具有验证类型 `float`。\n\
  \n点击此处查看代码图像\n\n```c\nFloat_variable_info {\n    u1 tag = ITEM_Float; /* 2 */\n\
  }\n```\n\n- `Null_variable_info` 类型表示该位置具有验证类型 `null`。\n\n点击此处查看代码图像\n\n```c\nNull_variable_info\
  \ {\n    u1 tag = ITEM_Null; /* 5 */\n}\n```\n\n- `UninitializedThis_variable_info`\
  \ 项表示该位置具有验证类型 `uninitializedThis`。\n\n点击此处查看代码图像\n\n```c\nUninitializedThis_variable_info\
  \ {\n    u1 tag = ITEM_UninitializedThis; /* 6 */\n}\n```\n\n- `Object_variable_info`\
  \ 项表示该位置具有验证类型，该类型是 `constant_pool` 表中由 `cpool_index` 指定的 `CONSTANT_Class_info`\
  \ 结构 (§4.4.1) 所表示的类。\n\n点击此处查看代码图像\n\n```c\nObject_variable_info {\n    u1 tag =\
  \ ITEM_Object; /* 7 */\n    u2 cpool_index;\n}\n```\n\n- `Uninitialized_variable_info`\
  \ 项表示该位置具有验证类型 `uninitialized(Offset)`。`Offset` 项表示包含此 `StackMapTable` 属性的 `Code`\
  \ 属性的 `code` 数组中创建存储在该位置的对象的 `new` 指令的偏移量§*new。\n\n点击此处查看代码图像\n\n```c\nUninitialized_variable_info\
  \ {\n    u1 tag = ITEM_Uninitialized /* 8 */\n    u2 offset;\n}\n```\n\n指定局部变量数组或操作数栈中两个位置的验证类型由\
  \ `verification_type_info` 联合体的以下项表示：\n\n- `Long_variable_info` 项表示两个位置中的第一个具有验证类型\
  \ `long`。\n\n点击此处查看代码图像\n\n```c\nLong_variable_info {\n    u1 tag = ITEM_Long; /*\
  \ 4 */\n}\n```\n\n- `Double_variable_info` 项表示两个位置中的第一个具有验证类型 `double`。\n\n点击此处查看代码图像\n\
  \n```c\nDouble_variable_info {\n    u1 tag = ITEM_Double; /* 3 */\n}\n```\n\n- `Long_variable_info`\
  \ 和 `Double_variable_info` 项按如下方式表示两个位置中的第二个的验证类型：\n    - 如果两个位置中的第一个是局部变量，则：\n\
  \        - 它不能是索引最大的局部变量。\n        - 索引较大的下一个局部变量具有验证类型 `top`。\n    - 如果两个位置中的第一个是操作数栈条目，则：\n\
  \        - 它不能是操作数栈的栈顶位置。\n        - 靠近操作数栈顶的下一个位置具有验证类型 `top`。\n\n栈帧（stack map\
  \ frame）由一个判别联合体 `stack_map_frame` 表示，它由一个字节的标签（tag）组成，表示正在使用哪个项，随后是零或多个字节，提供有关该标签的更多信息。\n\
  \n点击此处查看代码图像\n\n```c\nunion stack_map_frame {\n    same_frame;\n    same_locals_1_stack_item_frame;\n\
  \    same_locals_1_stack_item_frame_extended;\n    chop_frame;\n    same_frame_extended;\n\
  \    append_frame;\n    full_frame;\n}\n```\n\n标签指示栈映射帧的 `frame type`（帧类型）：\n\n\
  - `same_frame` 帧类型由范围 [0-63] 中的标签表示。此帧类型表示该帧与上一个帧具有完全相同的局部变量，且操作数栈为空。帧的 `offset_delta`\
  \ 值为标签项 `frame_type` 的值。\n\n点击此处查看代码图像\n\n```c\nsame_frame {\n    u1 frame_type\
  \ = SAME; /* 0-63 */\n}\n```\n\n- `same_locals_1_stack_item_frame` 帧类型由范围 [64, 127]\
  \ 中的标签表示。此帧类型表示该帧与上一个帧具有完全相同的局部变量，且操作数栈有一个条目。帧的 `offset_delta` 值由公式 `frame_type\
  \ - 64` 给出。\n\n点击此处查看代码图像\n\n```c\nsame_locals_1_stack_item_frame {\n    u1 frame_type\
  \ = SAME_LOCALS_1_STACK_ITEM; /* 64 */\n}\n```\n\n- 范围 [128-246] 的标签留供后用。\n\n- `same_locals_1_stack_item_frame_extended`\
  \ 帧类型由标签 247 表示。此帧类型表示该帧与上一个帧具有相同的局部变量，且操作数栈有一个条目。帧的 `offset_delta` 值显式给出。\n\n点击此处查看代码图像\n\
  \n```c\nsame_locals_1_stack_item_frame_extended {\n    u1 frame_type = SAME_LOCALS_1_STACK_ITEM_EXTENDED;\
  \ /* 247 */\n    u2 offset_delta;\n}\n```\n\n- `chop_frame` 帧类型由范围 [248-250] 中的标签表示。此帧类型表示该帧与上一个帧具有相同的局部变量，但缺少了\
  \ `k` 个局部变量，且操作数栈为空。`k` 的值由公式 `251 - frame_type` 给出。\n\n点击此处查看代码图像\n\n```c\nchop_frame\
  \ {\n    u1 frame_type = CHOP; /* 248-250 */\n    u2 offset_delta;\n}\n```\n\n-\
  \ `same_frame_extended` 帧类型由标签 251 表示。此帧类型表示该帧与上一个帧具有完全相同的局部变量，且操作数栈为空。帧的 `offset_delta`\
  \ 值显式给出。\n\n点击此处查看代码图像\n\n```c\nsame_frame_extended {\n    u1 frame_type = SAME_FRAME_EXTENDED;\
  \ /* 251 */\n    u2 offset_delta;\n}\n```\n\n- `append_frame` 帧类型由范围 [252-254] 中的标签表示。此帧类型表示该帧与上一个帧具有相同的局部变量，但增加了\
  \ `k` 个局部变量，且操作数栈为空。`k` 的值由公式 `frame_type - 252` 给出。\n\n点击此处查看代码图像\n\n```c\nappend_frame\
  \ {\n    u1 frame_type = APPEND; /* 252-254 */\n    u2 offset_delta;\n    verification_type_info\
  \ locals[frame_type - 252];\n}\n```\n\n`locals` 的第 0 项表示第一个局部变量的验证类型。如果 `locals[M]`\
  \ 表示局部变量 `N`，则：\n- 如果 `locals[M]` 是 `Top_variable_info`、`Integer_variable_info`、`Float_variable_info`、`Null_variable_info`、`UninitializedThis_variable_info`、`Object_variable_info`\
  \ 或 `Uninitialized_variable_info` 之一，则 `locals[M+1]` 表示局部变量 `N+1`；\n- 如果 `locals[M]`\
  \ 为 `Long_variable_info` 或 `Double_variable_info`，则 `locals[M+1]` 表示局部变量 `N+2`。\n\
  \n如果对于任何索引 `i`，`locals[i]` 表示的局部变量索引大于方法的局部变量数量，则出错。\n\n- `full_frame` 帧类型由标签 255\
  \ 表示。帧的 `offset_delta` 值显式给出。\n\n点击此处查看代码图像\n\n```c\nfull_frame {\n    u1 frame_type\
  \ = FULL_FRAME; /* 255 */\n    u2 offset_delta;\n    u2 number_of_locals;\n    verification_type_info\
  \ locals[number_of_locals];\n    u2 number_of_stack_items;\n}\n```\n\n\n\n\n\n```\n\
  verification_type_info stack[number_of_stack_items];\n\n}\n```\n\n`locals` 中的第 0\
  \ 个条目代表局部变量 0 的验证类型。如果 `locals[M]` 代表局部变量 `N`，则：\n\n- 如果 `locals[M]` 是 `Top_variable_info`、`Integer_variable_info`、`Float_variable_info`、`Null_variable_info`、`UninitializedThis_variable_info`、`Object_variable_info`\
  \ 或 `Uninitialized_variable_info` 之一，则 `locals[M+1]` 代表局部变量 `N+1`；\n- 如果 `locals[M]`\
  \ 是 `Long_variable_info` 或 `Double_variable_info` 之一，则 `locals[M+1]` 代表局部变量 `N+2`。\n\
  \n如果对于（��）任何索引 `i`，`locals[i]` 代表的局部变量索引大于了该方法局部变量的最大数量，则是一个错误。\n\n`stack` 中的第 0\
  \ 个条目代表操作栈底部的验证类型，`stack` 中的后续条目代表更靠近操作栈顶部的栈条目的验证类型。我们将操作栈底部称为栈条目 0，将操作栈的后续条称为栈条目\
  \ 1、2 等。如果 `stack[M]` 代表栈条目 `N`，则：\n\n- 如果 `stack[M]` 是 `Top_variable_info`、`Integer_variable_info`、`Float_variable_info`、`Null_variable_info`、`UninitializedThis_variable_info`、`Object_variable_info`\
  \ 或 `Uninitialized_variable_info` 之一，则 `stack[M+1]` 代表栈条目 `N+1`；\n- 如果 `stack[M]`\
  \ 是 `Long_variable_info` 或 `Double_variable_info` 之一，则 `stack[M+1]` 代表栈条目 `N+2`。\n\
  \n如果对于（〩）任何索引 `i`，`stack[i]` 代表的栈条目索引大于该方法操作栈的最大，则是一个错误。\n\n### 4.7.5 异常属性 (Exceptions)\n\
  \n`Exceptions` 属性是 `method_info` 结构中 `attributes` 表中的一个变长属性（§4.6）。`Exceptions` 属性指示该方法可能抛出的受检异常。\n\
  \n一个 `method_info` 结构的 `attributes` 表中最多有一个 `Exceptions` 属性。\n\n`Exceptions` 属性具有以下格式：\n\
  \n点击此处查看代码图像\n\n```java\nExceptions_attribute {\n    u2 attribute_name_index;\n\
  \    u4 attribute_length;\n    u2 number_of_exceptions;\n    u2 exception_index_table[number_of_exceptions];\n\
  }\n```\n\n`Exceptions_attribute` 结构的各个项如下：\n\n`attribute_name_index`\n`attribute_name_index`\
  \ 项的值必须是 `constant_pool` 表的有效索引。该索引处的 `constant_pool` 条目必须是表示字符串“Exceptions”的 `CONSTANT_Utf8_info`\
  \ 结构（§4.4.7）。\n\n`attribute_length`\n`attribute_length` 项的值表示属性的长度，不包括初始的六字节。\n\n\
  `number_of_exceptions`\n`number_of_exceptions` 项的值表示 `exception_index_table` 中的条目数量。\n\
  \n`exception_index_table[]`\n`exception_index_table` 数组中的每个值必须是 `constant_pool`\
  \ 表的有效索引。该索引处的 `constant_pool` 条目必须是一个 `CONSTANT_Class_info` 结构（§4.4.1），表示该方法声明要抛出的类类型。\n\
  \n方法只有在满足以下三个标准之一时才应该抛出异常：\n- 异常是 `RuntimeException` 或其任一子类的实例。\n- 异常是 `Error` 或其任一子类的实例。\n\
  - 异常是 `exception_index_table` 中指定的异常类之一的实例，或其子类的实例。\n\n这些要求在 Java 虚拟机中并不强制；它们仅在编译时强制。\n\
  \n### 4.7.6 内部类属性 (InnerClasses)\n\n`InnerClasses` 属性是 `ClassFile` 结构中 `attributes`\
  \ 表中的一个变长属性（§4.1）。\n\n如果类或接口 C 的常量池包含至少一个 `CONSTANT_Class_info` 条目（§4.4.1），该条目表示一个不是包成员的类或接口，那么在\
  \ C 的 `ClassFile` 结构的 `attributes` 表中必须有一个 `InnerClasses` 属性。\n\n`InnerClasses`\
  \ 属性具有以下格式：\n\n点击此处查看代码图像\n\n```java\nInnerClasses_attribute {\n    u2 attribute_name_index;\n\
  \    u4 attribute_length;\n    u2 number_of_classes;\n    {\n        u2 inner_class_index;\n\
  \        u2 outer_class_info_index;\n        u2 inner_name_index;\n        u2 inner_class_flags;\n\
  \    } classes[number_of_classes];\n}\n```\n\n`InnerClasses_attribute` 结构的各个项如下：\n\
  \n`attribute_name_index`\n`attribute_name_index` 项的值必须是 `constant_pool` 表的有效索引。该索引处的\
  \ `constant_pool` 条目必须是表示字符串“InnerClasses”的 `CONSTANT_Utf8_info` 结构。\n\n`attribute_length`\n\
  `attribute_length` 项的值表示属性的长度，不包括初始的六字节。\n\n`number_of_classes`\n`number_of_classes`\
  \ 项的值表示 `classes` 数组中的条目数量。\n\n`classes[]`\n`constant_pool` 表中每个不是包成员的类或接口的 `CONSTANT_Class_info`\
  \ 条目在 `classes` 数组中必须有一个。如果类或接口具有类或接口成员，其 `constant_pool` 表（因此其 `InnerClasses` 属性）必须引用此类成员（JLS\
  \ §13.1）。此外，每个嵌套类和接口的 `constant_pool` 表必须引用其外部类，因此每个嵌套类和嵌套接口都有 `InnerClasses` 信息。\n\
  \n`classes` 数组中的每个项包含以下内容：\n\n`inner_class_index`\n`inner_class_index` 项的值必须是 `constant_pool`\
  \ 表的有效索引。该索引处的 `constant_pool` 条目代表 C。`classes` 条目中的剩余项提供了关于 C 的信息。\n\n`outer_class_info_index`\n\
  如果 C 不是类或接口的成员（即 C 是顶层类或接口（JLS §7.6）、局部类（JLS §14.3）或匿名类（JLS §15.9.5）），则 `outer_class_info_index`\
  \ 项的值为零。否则，`outer_class_info_index` 项的值必须是 `constant_pool` 表的有效索引，该索引处的条目必须是 C 成员的类或接口的\
  \ `CONSTANT_Class_info` 结构。\n\n`inner_name_index`\n如果 C 是匿名的（JLS §15.9.5），则 `inner_name_index`\
  \ 项的值为零。否则，`inner_name_index` 项的值必须是 `constant_pool` 表的有效索引，该索引处的条目必须是 `CONSTANT_Utf8_info`\
  \ 结构，表示根据编译该 `class` 文件的源代码给 C 的原始简单名。\n\n`inner_class_access_flags`\n`inner_class_access_flags`\
  \ 项的值是一个标志掩码，用于表示编译该 `class` 文件的源代码中声明的类或接口的访问权限和属性。它被编译器用于源代码不可用时恢复原始信息。这些标志见表\
  \ 4.7.6-A。\n\n![Image](img/116tab01.jpg)\n\n**表 4.7.6-A. 嵌套类访问和属性标志**\n\n\n\n\n\n\
  `inner_class_access_flags` 项中未在 Table 4.7.6-A 中分配的所有位均预留供备后使用。它们在生成的 `class` 文件中应设置为零，并应被\
  \ Java 虚拟机实现所忽略。\n\n如果 `class` 文件的版本号为 51.0 或以上，且其 `attributes` 表中包含 `InnerClasses`\
  \ 属性，那么对于 `InnerClasses` 属性中 `classes` 数组的所有条目，如果 `inner_name_index` 项的值为 0，则 `outer_class_info_index`\
  \ 项的值必须为 0。\n\nOracle 的 Java 虚拟机实现不会检查 `InnerClasses` 属性与该属性引用的类或接口的 `class` 文件之间的一致性。\n\
  \n## 4.7.7 EnclosingMethod 属性\n\n`EnclosingMethod` 属性是 `ClassFile` 结构 `attributes`\
  \ 表中的一个固定长度属性（§4.1）。一个类当且仅当它代表一个本地类或匿名类时，必须有一个 `EnclosingMethod` 属性（JLS §14.3, JLS\
  \ §15.9.5）。\n\n`ClassFile` 结构的 `attributes` 表中最多有一个 `EnclosingMethod` 属性。\n\n`EnclosingMethod`\
  \ 属性具有以下格式：\n\n```\nEnclosingMethod_attribute {\n    u2 attribute_name_index;\n\
  \    u4 attribute_length;\n    u2 class_index;\n    u2 method_index;\n}\n```\n\n\
  `EnclosingMethod_attribute` 结构的各个项如下：\n\n`attribute_name_index`\n`attribute_name_index`\
  \ 项的值必须是指向 `constant_pool` 表的有效索引。该索引处的 `constant_pool` 条目必须是一个 `CONSTANT_Utf8_info`\
  \ 结构（§4.4.7），表示字符串“`EnclosingMethod`”。\n\n`attribute_length`\n`attribute_length`\
  \ 项的值必须为 4。\n\n`class_index`\n`class_index` 项的值必须是指向 `constant_pool` 表的有效索引。该索引处的\
  \ `constant_pool` 条目必须是一个 `CONSTANT_Class_info` 结构（§4.4.1），表示闭合当前类声明的最内层类。\n\n`method_index`\n\
  如果当前类没有直接被方法或构造方法包围，则 `method_index` 项的值必须为 0。\n\n特别是，如果当前类在源代码中被实例初始化器、静态初始化器、实例变量初始化器或类变量初始化器直接包围，则\
  \ `method_index` 必须为 0。（前者均涉及本地类和匿名类，而后两者涉及在字段赋值右侧声明的匿名类。）\n\n否则，`method_index`\
  \ 项的值必须是指向 `constant_pool` 表的有效索引。该索引处的 `constant_pool` 条目必须是一个 `CONSTANT_NameAndType_info`\
  \ 结构（§4.4.6），表示由上述 `class_index` 属性引用的类中方法的名称和类型。\n\nJava 编译器的责任是确保通过 `method_index`\
  \ 标识的方法确实是包含该 `EnclosingMethod` 属性的类的词法最近的包围方法。\n\n## 4.7.8 Synthetic 属性\n\n`Synthetic`\
  \ 属性是 `ClassFile`、`field_info` 或 `method_info` 结构 `attributes` 表中的一个固定长度属性（§4.1，§4.5，§4.6）。未出现在源代码中的类成员必须使用\
  \ `Synthetic` 属性标记，否则必须设置其 `ACC_SYNTHETIC` 标志位。该要求的唯一例外是编译器生成的、不被视为实现产物的方法，即代表 Java\
  \ 语言默认构造函数的实例初始化方法（§2.9）、类初始化方法（§2.9）以及 `Enum.values()` 和 `Enum.valueOf()` 方法。\n\
  \n`Synthetic` 属性在 JDK 1.1 中引入，以支持嵌套类和接口。\n\n`Synthetic` 属性具有以下格式：\n\n```\nSynthetic_attribute\
  \ {\n    u2 attribute_name_index;\n    u4 attribute_length;\n}\n```\n\n`Synthetic_attribute`\
  \ 结构的各个项如下：\n\n`attribute_name_index`\n`attribute_name_index` 项的值必须是指向 `constant_pool`\
  \ 表的有效索引。该索引处的 `constant_pool` 条目必须是一个 `CONSTANT_Utf8_info` 结构（§4.4.7），表示字符串“`Synthetic`”。\n\
  \n`attribute_length`\n`attribute_length` 项的值必须为 0。\n\n 4.7.9 Signature 属性\n\n`Signature`\
  \ 属性是 `ClassFile`、`field_info` 或 `method_info` 结构 `attributes` 表中的固定长度属性（§4.1，§4.5，§4.6）。`Signature`\
  \ 属性记录了在 Java 语言中使用类型变量或泛型类型的类、接口、构造方法或字段的签名。关于这些类型的细节，请参阅《Java 语言规范 Java SE 版》。\n\
  \n`Signature` 属性具有以下格式：\n\n```\nSignature_attribute {\n    u2 attribute_name_index;\n\
  \    u4 attribute_length;\n    u2 signature_index;\n}\n```\n\n`Signature_attribute`\
  \ 结构的各个项如下：\n\n`attribute_name_index`\n`attribute_name_index` 项的值必须是指向 `constant_pool`\
  \ 表的有效索引。该索引处的 `constant_pool` 条目必须是一个 `CONSTANT_Utf8_info` 结构（§4.4.7），表示字符串“`Signature`”。\n\
  \n`attribute_length`\n`Signature_attribute` 结构的 `attribute_length` 项的值必须为 2。\n\n\
  `signature_index`\n`signature_index` 项的值必须是指向 `constant_pool` 表的有效索引。该索引处的 `constant_pool`\
  \ 条目必须是一个 `CONSTANT_Utf8_info` 结构（§4.4.7），当该 `Signature` 属性是 `ClassFile` 结构的属性时，表示类签名；当该\
  \ `Signature` 属性是 `method_info` 属性时，表示方法签名；否则表示字段签名。\n\nOracle 的 Java 虚拟机实现不会在类加载或链接期间检查\
  \ `Signature` 属性的正确性。相反，`Signature` 属性由 Java 平台类库中暴露泛型签名的方法进行检查。例如 `Class` 中的 `getGenericSuperclass`\
  \ 和 `java.lang.reflect.Executable` 中的 `toGenericString`。\n\n### 4.7.9.1 签名 (Signatures)\n\
  \n*签名* 编码了在虚拟机类型系统之外使用的 Java 语言声明。它们支持反射和调试，以及在仅有 `class` 文件时的编译。\n\nJava 编译器必须为任何使用类型变量或泛型类型的类、接口、构造方法、方法或字段发射签名。具体来说，Java\
  \ 编译器必须发射：\n\n• 对于任何泛型的、或以泛型类型作为父类或父接口（或两者具有）的类或接口声明，发射类签名。\n\n• 对于任何泛型的、或以类型变量或泛型类型作为返回类型或形式参数类型、或在\
  \ `throws` 子句中使用类型变量的方法或构造方法声明，发射方法签名。\n\n如果方法或构造方法的 `throws` 子句不涉及类型变量，则编译器在发射方法签名时可以将该声明视为没有\
  \ `throws` 子句。\n\n\n\n\n\n- 任何字段、形式参数或局部变量声明的字段签名，其类型使用了类型变量或参数化类型。\n\n签名使用遵循 §4.3.1\
  \ 中表示法的语法进行指定。除了该表示法外：\n\n- 产生式右侧的语法 `[x]` 表示 `x` 出现零次或一次。也就是说，`x` 是一个`可选符号`。包含该可选符号的备选方案实际上定义了两个备选：一个是省略该可选符号的，另一个是包含该符号的。\n\
  \n- 非常长的右侧内容可以通过对第二行进行明显的缩进来延续到第二行。\n\n该语法包含终结符号 `Identifier`，用于表示类型、字段、方法、形式参数、局部变量或类型变量的名称，这些名称由\
  \ Java 编译器生成。此类名称不得包含任何任意 ASCII 字符 `. ;  / < > :`（即方法名中禁止的字符 (§[4.2.2) 以及冒号），但可以包含\
  \ Java 编程语言标识符中不能出现的字符 (JLS §3.8)。\n\n签名依赖于称为 `type signatures` 的非终结符层级结构：\n\n-\
  \ `Java 类型签名` 代表 Java 编程语言的引用类型或原始类型。\n\n`JavaTypeSignature:`\n\n  `ReferenceTypeSignature`\n\
  \n  `BaseType`\n\n以下是 §4.3.2 中的产生式，为了方便起见在此重复：\n\n`BaseType:` 如下之一：\n\n  `B C D\
  \ F I J S Z`\n\n- `引用类型签名` 代表 Java 编程语言的引用类型，即类类型或接口类型、类型变量或数组类型。\n\n`类类型签名` 代表一个（可能是参数化的）类或接口类型。类类型签名的构造必须确保其能够通过擦除任何类型参数并将每个\
  \ `.` 字符转换为 `$` 字符，可靠地映射到它所指代的类的二进制名。\n\n`类型变量签名` 代表一个类型变量。\n\n`数组类型签名` 代表数组类型的一维。\n\
  \n`ReferenceTypeSignature:`\n\n  `ClassTypeSignature`\n\n  `TypeVariableSignature`\n\
  \n  `ArrayTypeSignature`\n\n`ClassTypeSignature:`\n\n  `L` `[PackageSpecifier]`\n\
  \n    `SimpleClassTypeSignature {ClassTypeSignatureSuffix} ;`\n\n`PackageSpecifier:`\n\
  \n  `Identifier / {PackageSpecifier}`\n\n`SimpleClassTypeSignature:`\n\n  `Identifier\
  \ [TypeArguments]`\n\n`TypeArguments:`\n\n  `< TypeArgument {TypeArgument} >`\n\n\
  `TypeArgument:`\n\n  `[WildcardIndicator] ReferenceTypeSignature`\n\n  `*`\n\n`WildcardIndicator:`\n\
  \n  `+`\n\n  `-`\n\n`ClassTypeSignatureSuffix:`\n\n  `.SimpleClassTypeSignature`\n\
  \n`TypeVariableSignature:`\n\n  `T` `Identifier ;`\n\n`ArrayTypeSignature:`\n\n\
  \  `[` `JavaTypeSignature*`\n\n`类签名` 编码了关于（可能是泛型的）类声明的类型信息。它描述了类的任何类型参数，并列出了它的（可能是参数化的）直接父类和直接父接口（如果有）。类型参数通过其名称描述，并在后跟上任何类边界和接口边界。\n\
  \n`ClassSignature:`\n\n  `*[TypeParameters] SuperclassSignature {SuperinterfaceSignature}*`\n\
  \n`TypeParameters:`\n\n  `< TypeParameter {TypeParameter} >`\n\n`TypeParameter:`\n\
  \n  `Identifier ClassBound {InterfaceBound}`\n\n`ClassBound:`\n\n  `: [ReferenceTypeSignature]`\n\
  \n`InterfaceBound:`\n\n  `: ReferenceTypeSignature`\n\n`SuperclassSignature:`\n\n\
  \  `ClassTypeSignature`\n\n`SuperinterfaceSignature:`\n\n  `ClassTypeSignature`\n\
  \n`方法签名` 编码了关于（可能是泛型的）方法声明的类型信息。它描述了方法的任何类型参数；任何形式参数的（可能是参数化的）类型；（可能是参数化的）返回类型（如果有）；以及方法\
  \ `throws` 子句中声明的任何异常的类型。\n\n`MethodSignature:`\n\n  `*[TypeParameters] ( {JavaTypeSignature}\
  \ ) Result {ThrowsSignature}*`\n\n`Result:`\n\n  `JavaTypeSignature`\n\n  `VoidDescriptor`\n\
  \n`ThrowsSignature:`\n\n  `^ ClassTypeSignature`\n\n  `^ TypeVariableSignature`\n\
  \n以下是 §4.3.3 中的产生式，为了方便起见在此重复：\n\n`VoidDescriptor:`\n\n  `V`\n\n由于编译器生成的产物，方法的签名签名可能与方法的描述描述符并不完全对应\
  \ (§4.3.3)。特别是方法签名中形式参数类型的数量可能少于方法描述符中参数描述符的数量。\n\n`字段签名` 编码了字段、形式参数或局部变量声明的（可能是参数化的）类型。\n\
  \n`FieldSignature:`\n\n  `ReferenceTypeSignature`\n\n#### 4.7.10 SourceFile 属性\n\
  \n`SourceFile` 属性是 `ClassFile` 结构属性表中的一个固定长度属性 (§4.1)。\n\n`ClassFile` 结构属性表中最多有一个\
  \ `SourceFile` 属性。\n\n`SourceFile` 属性具有以下格式：\n\n```\nSourceFile_attribute {\n  u2\
  \ attribute_name_index;\n  u4 attribute_length;\n  u2 sourcefile_index;\n}\n```\n\
