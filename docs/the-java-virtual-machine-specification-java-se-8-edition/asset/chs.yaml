  \n**描述**\n操作数栈顶部的 `value` 必须是 `long` 类型。它从操作数栈中弹出并使用 IEEE 754 最近舍入模式转换为 `double`\
  \ 类型 `result`。`result` 被推入操作数栈。\n\n**注意**\n`l2d` 指令执行宽原类型转换（JLS §5.1.2），可能会丢失精度，因为\
  \ `double` 类型的值只有 53 位尾数位。\n\n### l2f\n\n**操作**\n将 `long` 转换为 `float`\n\n**格式**\n\
