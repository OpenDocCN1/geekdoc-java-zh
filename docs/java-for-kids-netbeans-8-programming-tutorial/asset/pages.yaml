  md: '# Java for Kids


    What if you want to output numeric information? It''s really quite easy.

    The println method will automatically convert a numeric value to a string for
    output purposes. For example, look at this little code segment:


    ```

    numberBananas = 45;

    System.out.println(numberBananas);

    ```


    If you run this code, a 45 will appear on the output window.


    You can also combine text information with numeric information using the concatenation
    operator. For example:


    ```

    numberBananas = 45;

    System.out.println("Number of Bananas is " + numberBananas);

    ```


    will print Number of Bananas is 45 on the output screen. The numeric data (numberOfBananas)
    is converted to a string before it is concatenated with the text data


    So, it''s pretty easy to output text and numeric information. Be aware one slight
    problem could occasionally arise. Recall the concatenation operator is identical
    to the arithmetic addition operator. Look at this little segment of code:


    ```

    numberBananas = 32;

    numberApples = 22;

    System.out.println("Pieces of fruit " + numberBananas + numberApples);

    ```


    You might think you are printing out the total number of fruit (numberBananas
    + numberApples = 54) with this statement. However, if you run this code, you will
    get Pieces of fruit 3222. What happens is that Java converts both pieces of'
  merge: -1
