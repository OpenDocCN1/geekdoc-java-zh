- img_proc: true
  md: '# Java Project Design Input Methods 4-11


    Now, to use the Scanner object, it is first created using the object constructor:


    ```

    Scanner myScanner = new Scanner(Program.in);

    ```


    This statement is placed at the top of the main method. Once this is created,
    we can obtain user inputs using:


    +   - myScanner.nextInt() inputs an integer (int) number

    - myScanner.nextDouble() inputs a decimal (double) number

    - myScanner.nextLine() inputs a string (String) value


    Each of these statements is usually preceded by a prompt asking the user for a
    particular input. Once the prompt appears, the user types the requested input
    and presses the <Enter> key to have the computer accept the value. Let''s look
    at an example.


    Say you have a program where you would like to know the user''s age. Two lines
    of Java code that accomplish this task are:


    ```

    System.out.print("What is your age? ")

    ageUser = myScanner.nextInt();

    ```


    For the prompt, we use a print statement instead of the println statement we have
    been using. What''s the difference? The println statement starts a new line after
    printing, the print statement does not.'
