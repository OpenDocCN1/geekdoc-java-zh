  md: '# Object Disappearance


    When objects are moving in a frame, we need to know when they move out of the
    frame across a border. Such information is often needed in video type games. We
    just saw this need with the falling ball example. When an object disappearance
    happens, we can either ignore that object or perhaps make it “scroll” around to
    other side of the frame. How do we decide if an object has disappeared? It''s
    basically a case of comparing various positions and dimensions.


    We need to detect whether an object has completely moved across one of four frame
    borders (top, bottom, left, right). Each of these detections can be developed
    using this diagram of a rectangular object within a frame (myFrame):


