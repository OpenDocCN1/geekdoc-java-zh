  md: '# Java Graphics, Mouse Methods 8-13


    This is actually one very long Java statement over several lines. It calls the
    addWindowListener method, and as an argument (all in parentheses), includes a
    new instance of a WindowAdapter event (the windowClosing event). It''s not really
    that hard to understand when you look at it, just very long!!


    Notice the code in the method itself is a single line:


    ```

    System.exit(0);

    ```


    This just tells Java you are done and to shut the program down. Notice too that
    the windowClosing method must have a single argument (WindowEvent e). In this
    method, we don''t use this argument. In others, we will. By adding this one (long)
    line of Java code, our application will now know what to do when a user clicks
    the “close the window” X box, causing a windowClosing event.


    After typing in this new code, recompile and rerun the Graphics Test program.
    You should now be able to stop it by clicking the X. Each of these steps for creating
    a window and adding a window closing event method must be taken for every GUI
    application you build. And, you will take similar steps to add other event methods
    (for other events we want to respond to) to your program.


    I think you''re starting to see that GUI applications are more work than console
    applications, but you will also see all the extra work is worth it. GUI applications
    are great! Before doing any drawing with Java, we need to introduce several topics:
    mouse events, class level variables, graphics coordinates, colors, and graphics
    methods. Then, we finally draw a line - yeah!'
