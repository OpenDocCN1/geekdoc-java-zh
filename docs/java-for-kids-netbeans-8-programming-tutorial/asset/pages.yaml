  md: '# Comparing Strings


    Remember we said you can’t use the “equals to” operator (==) to compare String
    type variables. A common logic error is to forget this. The reason we can''t use
    this operator is in how Java stores strings. Say we have two String type variables,
    aString and bString. Writing:


    ```

    aString == bString

    ```


    checks to see if each of these strings are stored in the same place in your computer’s
    memory. That’s not what we want to do. We want to see if each string has the same
    characters.


    To properly compare strings for equality, we use the String equals method. This
    method does just what we want - compares two strings to see if they have the same
    characters in them. The code that does this comparison for our example strings
    is:


    ```

    aString.equals(bString)

    ```


    This method returns the boolean result of true if the aString and bString are
    the same length, that is have the same number of characters, and each character
    in one string is identical to the corresponding character in the other. And, the
    comparison is case-sensitive. To ignore case in the comparison, use:


    ```

    aString.equalsIgnoreCase(bString)

    ```


    Now, we can move on to looking at combining boolean results with logical operators.'
