- img_proc: true
  md: '# Java Project Design Input Methods 4-9


    The last function we will use in this class is the exponentiation method. In exponentiation,
    a number is multiplied itself a certain number of times. If we multiply a number
    by itself 4 times, we say we raise a number to the 4th power. The Java function
    used for exponentiation is:


    ```

    Math.pow(argument1, argument2)

    ```


    Notice the pow (stands for power) function has two arguments. argument1 is the
    number we are multiplying times itself argument2 times. In other words, this function
    raises argument1 to the argument2 power. Each argument and the returned value
    are double type numbers. Some examples:


    | Example | Result |

    | --- | --- |

    | Math.pow(4.0, 2.0) | 16.0 |

    | Math.pow(-3.0, 3.0) | -27.0 |

    | Math.pow(10.0, 4.0) | 10000.0 |


    In each example here, the arguments have no decimal parts. We have done this to
    make the examples clear. You are not limited to such values. It is possible to
    use this function to compute what happens if you multiply 7.654 times itself 3.16
    times!! (The answer is 620.99, by the way.)


    For the more mathematically inclined reader, you should know that there are many
    more Java functions available for your use. You might want to look into using
    them. There are trigonometric functions and inverse trig functions, functions
    to convert from radians to degrees and vice versa, functions to find extreme values,
    functions for rounding, logarithm and inverse logarithm functions and built-in
    values for pi and e. (If none of this means anything to you, don''t worry - we
    won''t be using them in this class.)'
