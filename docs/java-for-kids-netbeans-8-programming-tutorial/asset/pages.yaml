  md: '# Collision Detection


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_339_0.png)


    Another requirement in animation is to determine if two objects have collided.
    This is needed in games to see if a ball hits a paddle, if an alien rocket hits
    its target, or if a cute little character grabs some reward. Each object is described
    by a rectangular area, so the collision detection problem is to see if two rectangles
    collide, or overlap. This check is done using each object''s position and dimensions.'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# Timers, Animation, Keyboard Methods 9-37


    Here are two objects (object1 and object2) in a frame:


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_340_0.png)


    object1 is positioned at (object1X, object1Y), is object1W wide and object1H high.
    Similarly, object2 is positioned at (object2X, object2Y), is object2W wide and
    object2H high.


    Looking at this diagram, you should see there are four requirements for the two
    rectangles to overlap:


    +   1. The right side of object1 (object1X + object1H) must be "farther right"
    than the left side of object2 (object2X)

    2. The left side of object1 (object1X) must be "farther left" than the right side
    of object2 (object2X + object2W)

    3. The bottom of object1 (object1Y + object1H) must be "farther down" than the
    top of object2 (object2Y)

    4. The top of object1 (object1Y) must be "farther up" than the bottom of object2
    (object2Y + object2H)


    All four of these requirements must be met for a collision.'
