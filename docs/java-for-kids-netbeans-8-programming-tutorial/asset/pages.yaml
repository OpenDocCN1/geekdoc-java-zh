  md: '# 10-2 Java for Kids


    # Project 1 - Computer Stopwatch


    # Project Design


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_379_0.png)


    In this project, we will build a computer stopwatch that measures elapsed time
    (to three decimal places). The steps in this program are few:


    +   - When <Enter> is pressed, start stopwatch and save starting time.

    - When <Enter> is pressed again, stop stopwatch, subtract starting time from current
    time and display elapsed time.


    The Scanner object will be used for input, with println being used for output.
    The project you are about to build is saved as Stopwatch in the project folder
    (JavaKids\JK Code).


    # New Topic - Timing


    In this project, we use a built-in Java function for timing. It is a system function
    and is referenced using:


    ```

    System.currentTimeMillis()

    ```


    This function returns the current time in milliseconds. The returned value is
    a long integer. This is a new variable type we have not seen before. It is just
    an integer variable that uses twice as much memory as the int type.'
