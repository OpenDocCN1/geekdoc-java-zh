  md: '# Your First Java Program


    # Java - The First Lesson


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_74_0.png)


    At long last, we are ready to get into the heart of a Java project - the Java
    language. In this class, we will discuss variables (name, type, declaring), assignments,
    arithmetic operations, and techniques for working with a particular type of variable
    called strings. In each subsequent class in this course, you will learn something
    new about the Java language.


    # Variables


    All computer programs work with information of one kind or another. Numbers, text,
    dates and pictures are typical types of information they work with. Computer programs
    need places to store this information while working with it. What if we need to
    know how much bananas cost if they are 25 cents each? We would need a place to
    store the number of bananas, the cost of each banana, and the result of multiplying
    these two numbers together. To store such information, we would use something
    called variables. They are called variables because the information stored there
    can change, or vary, during program execution. Variables are the primary method
    for moving information around in a Java project. And, certain rules must be followed
    in the use of variables.'
  merge: -1
