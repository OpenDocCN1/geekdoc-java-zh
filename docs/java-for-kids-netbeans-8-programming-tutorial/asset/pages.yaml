  md: '# A Brief Word on the Course:


    Though this course is entitled “Java for Kids,” it is not necessarily written
    in a kid’s vocabulary. Computer programming has a detailed vocabulary of its own
    and, since adults developed it, the terminology tends to be very adult-like. In
    developing this course, we discussed how to address this problem and decided we
    would treat our kid readers like adults, since they are learning what is essentially
    an adult topic. We learning what is essentially an adult topic. We did not want
    to “dumb-down” the course. You see this in some books. We, quite frankly, are
    offended by books who refer to readers as dummies and idiots simply because they
    are new to a particular topic. We didn’t want to do that here. Throughout the
    course, we treat the kid reader as a mature person learning a new skill. The vocabulary
    is not that difficult, but there may be times the kid reader needs a little help
    from a parent or teacher. Hopefully, the nearest adult can provide that help.'
