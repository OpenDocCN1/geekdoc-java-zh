  md: '# Arrays, More Java Looping


    # "Shuffle" Method


    Let''s use our new knowledge of arrays and for loops to write a very useful method.
    A common task in any computer program is to randomly sort a list of consecutive
    integer values. Why would you want to do this? Say you have four answers in a
    multiple choice quiz. Randomly sort the integers 1, 2, 3, and 4, so the answers
    are presented in random order. Or, you have a quiz with 30 questions. Randomly
    sort the questions for printing out as a worksheet, or, the classic application
    is shuffling a deck of standard playing cards (there are 52 cards in such a deck).
    In that case, you can randomly sort the integers from 0 to 51 to “shuffle” the
    shuffling process. Let’s build a “shuffle” routine. We call it a shuffle routine,
    recognizing it can do more than shuffle a card deck. Our routine will sort any
    number of consecutive integers.


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_218_0.png)


    Usually when we need a computer version of something we can do without a computer,
    it is fairly easy to write down the steps take and duplicate them in Java code.
    We''ve done that with the projects built far in this course. Other times, the
    computer version of a process is easy to do on a computer, but hard or tedious
    to do off the computer. When we shuffle a deck of cards, separate the deck in
    two parts, interleave the cards as we fan each part. I don’t know how you could
    write Java code to do this. There is a way, however, to write Java code to do
    a shuffle in a more tedious way (tedious to a human, easy for a computer).'
