  md: '# Your First Java Program


    # Variable Types


    We need to know the type of information stored by each variable. Does it contain
    a number? Does the number have a decimal point? Does it just contain text information?
    Let''s look at some variable types.


    The first variable type is the int type. This type of variable is used to represent
    whole, non-decimal, numbers. Examples of such numbers are:


    ```

    1 -20 4000

    ```


    Notice you write 4,000 as 4000 in Java - we can''t use commas in large numbers.
    In our banana example, numberBananas would an an int type variable.


    What if the variable you want to use will have decimal points. In this course,
    such variables will be of double type. In Techno-talk, we say such variables are
    double-precision, floating point numbers (the decimal point being the thing that
    “floats”). All you need to know about double type variables is that they are numbers
    with decimal points. Examples of such numbers:


    ```

    -1.25 3.14159 22.7

    ```


    In our banana example, the variables bananaCost and totalBananaCost would be double
    type variables.


    Another variable type used all the time in Java programming is the boolean type.
    It takes its name from a famous mathematician (Boole). It can'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'have one of two values: **true** or **false**. We will see that such variables
    are at the heart of the computer''s decision capability. If wanted to know if
    a banana was rotten, we could name a `boolean` variable `isBananaRotten`. If this
    was true, the banana is indeed rotten.


    The next variable “type” we use is not really a type at all. More correctly, it
    is a Java class - the **String** class (the fact it begins with an upper case
    letter, rather than lower case indicates it is a class). A **String** variable
    is just that - one that stores a string (list) of various characters. A String
    can be a name, a string of numbers, a sentence, a paragraph, any characters at
    all. And, many times, a string will contain no characters at all (an empty string).
    We will use lots of strings in Java, so it’s something you should become familiar
    with. Strings are always enclosed in quotes (“”). Examples of strings:


    “I am a Java programmer” “012345” “Title Author”'
