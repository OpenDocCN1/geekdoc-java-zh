- img_proc: true
  md: 'The last two operators are modifications to the “greater than” and “less than”
    operators. The “greater than equal to” operator (>=) compares two numbers. The
    result is true if the number on the left of the operator is greater than or equal
    to the number on the right. Otherwise, the result is false.

    Examples:


    | Comparison | Result |

    | 8 >= 3 | true |

    | 6 >= 7 | false |

    | 4 >= 4 | true |


    Similarly, the “less than or equal to” operator (<=) tells us if one number (left
    side of operator) is less than or equal to another (right side of operator).

    Examples:


    | Comparison | Result |

    | 8 <= 3 | false |

    | 6 <= 7 | true |

    | 4 <= 4 | true |


    Comparison operators have equal precedence among themselves, but are lower than
    the precedence of arithmetic operators. This means comparisons are done after
    any arithmetic. Comparison operators allow us to make single decisions about the
    relative size of values and variables. If we need to make multiple decisions?
    For example, what if we want to know if a particular variable is smaller than
    one number, but larger than another? We need ways to combine logical expressions
    - logical operators can do this. But, first we must look at a special case of
    comparing strings.'
