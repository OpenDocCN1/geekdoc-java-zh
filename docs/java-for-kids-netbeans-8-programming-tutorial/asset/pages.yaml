  pgno: 143
- img_proc: true
  md: '# Debugging Decisions, Random Numbers


    There is also a “not equal to” operator represented by a symbol consisting of
    an exclamation point (called the **not** operator) followed by the equal sign
    (!=). Examples of using this operator:


    | Comparison | Result |

    |---|---|

    | 6 != 7 | true |

    | 4 != 4 | false |


    There are other operators that let us compare the size of numbers. The “greater
    than” operator (>) tells us if one number (left side of operator) is greater than
    another (right side of operator). Examples of its usage:


    | Comparison | Result |

    |---|---|

    | 8 > 3 | true |

    | 6 > 7 | false |

    | 4 > 4 | false |


    The “less than” operator (<) tells us if one number (left side of operator) is
    less than another (right side of operator). Some examples are:


    | Comparison | Result |

    |---|---|

    | 8 < 3 | false |

    | 6 < 7 | true |

    | 4 < 4 | false |'
