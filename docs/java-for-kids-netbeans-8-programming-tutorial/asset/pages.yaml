  md: '# Java Project Design Input Methods 4-7


    How do you know what Java mathematical functions exist, what type of information
    they provide and what the arguments are? Check various Java references and the
    Sun Java website. As mentioned, we will look at three mathematical functions here.
    The methods that support mathematical functions are implemented in the Java class
    named Math. Hence, to refer to a particular function, you write Math, then a period,
    then the function name.


    The first function we examine is the absolute value function. In math, the absolute
    value is the positive part of a number. The Java function is:


    Math.abs (argument)


    where argument is number we want the absolute value of. The argument can be either
    an int or double type and the returned value will be the same type as the argument.
    Some examples:


    | Example | Result |

    |---|---|n| Math.abs (7) | 7 |

    | Math.abs (-11) | 11 |

    | Math.abs (-3.14) | 3.14 |

    | Math.abs (72.1) | 72.1 |'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'Have you ever needed the square root of a number? A square root is a number
    that when multiplied by itself gives you the original number. For example, the
    square root of 4 is 2, since 2 times 2 is four.


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_109_0.png)


    There''s a button on your calculator (√) that will do this for you. In Java, the
    square root function is:


    ```

    Math.sqrt(argument)

    ```


    where argument is number we want the square root of. The argument must be a non-negative
    double number and the returned value is a double. Some examples:


    | Example | Result |

    | Math.sqrt(4.0) | 2.0 |

    | Math.sqrt(36.0) | 6.0 |

    | Math.sqrt(72.1) | 8.491 |'
