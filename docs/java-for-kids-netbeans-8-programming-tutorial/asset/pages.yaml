- img_proc: true
  md: '# Java for Kids


    Before leaving this example and building another project, let''s take a quick
    look at one other useful Java concept. In the output window above, it would be
    nice if there was a blank line between each input request. This just makes your
    output appear a little cleaner, a quality of a well designed Java project. One
    way to insert a blank line in the output is to just use a println method with
    no argument:


    ```

    System.out.println();

    ```


    This can become a hassle if you need many blank lines.


    An easier approach is to use the Java escape sequence for a new line (\n). You
    simply insert this two character sequence in any string output by println. Whenever
    the character is encountered, a new line is started. For example:


    ```

    System.out.println("This is a line\n");

    ```


    will print a blank line after printing This is a line on the output screen. Conversely,


    ```

    System.out.println("\nThis is a line");

    ```


    will print a blank line before printing This is a line on the output screen. You''ll
    find the new line escape sequence (\n) will come in very handy.'
  merge: -1
