  md: '# Structure of a Java Program


    Java, like any language (computer or spoken), has a terminology all its own. Let''s
    look at the structure of a Java program and learn some of this new terminology.
    A Java program (or project) is made up of a number of files. These files are called
    **classes**. Each of these files have Java code that performs some specific task(s).
    Each class file is saved with the file extension **java**. The filename used to
    save a class must match the class name. One class in each project will contain
    something called the **main method**. Whenever you run a Java program, your computer
    will search for the **main** method to get things started. Hence, to run a program,
    you refer directly to the class containing the **main** method.


    Let''s see how this relates to **Welcome** project we saw in Class 1. Start **NetBeans**.
    The JK **Code** folder should still be the **Project Group** (if not, make it
    your project group). The Welcome project should still be the main project. If
    it isn''t, right-click the **Welcome** project folder in the file view and choose
    **Set as Main Project**. NetBeans has a special folder for all classes in a project.
    They are stored in a folder named **Source Packages/package name** (in this case
    **package name** is **welcome**). The package name is created when you create
    a project (we will learn how to do this).'
  merge: -1
