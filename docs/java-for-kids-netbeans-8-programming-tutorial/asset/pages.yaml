- img_proc: true
  md: '# Project Development


    The Balloons game is simple, in concept. To play, click the frame. The five balloons
    drop down the frame, each at a different speed. Use the left and right arrow keys
    to move the arrow. If the arrow is under a balloon when a collision occurs, the
    balloon pops and you get a point. Balloons reappear at the top after popping or
    after reaching the bottom of the screen without being popped. You pop as many
    balloons as you can in 60 seconds. At that point, the game ends.


    It looks like there are only two events to code, clicking the frame to start or
    checking for arrow key presses. But, we will also have two timers and their associated
    method events. Why two timers? One timer controls the balloon animation, updating
    the frame 10 times a second (delay will be 100). Another timer controls the overall
    time of the game. It generates an event only once - when the game is over (delay
    will be 60000 - that''s 60 seconds). So, in addition to frame clicks and key press
    events, we need code for two timer events. There is a substantial amount of Java
    code to write here, even though you will see there is a lot of repetition. We
    suggest writing the event methods in stages. Write one method or a part of a method.
    Run the project. Make sure the code you wrote works. Add more code. Run the project
    again. Make sure the added code works. Continue adding code until complete. Building
    a project this way minimizes the potential for error and makes the debugging process
    much easier. Let''s go.'
