  md: '# Contents


    # Course Description:


    Java for Kids is an interactive, self-paced tutorial providing a complete introduction
    to the Java programming language. The tutorial consists of 10 lessons explaining
    (in simple, easy-to-follow terms) how to build a Java application. Numerous examples
    are used to demonstrate every step in the building process. The tutorial also
    includes detailed computer projects for kids to build and try. Java for Kids is
    presented using a combination of course notes and many Java examples and projects.


    # Course Prerequisites:


    To use Java for Kids, you should be comfortable working within the Microsoft Windows
    Vista, or the Windows 7/8 operating environment. You will also need know how to
    find files, move windows, resize windows, etc. The course material should be understandableto
    kids aged 12 and up. No previous programming experience is needed. If your student
    has previous programming experience, you can start this as early as 10 years old
    with a parent or teacher''s assistance. You will also need the ability to view
    and print documents saved in the Acrobat PDF format.


    You also need to have the current Java Development Kit (JDK) and the current version
    of NetBeans, the Integrated Development Environment (IDE) we use with this course.
    In previous editions of this textbook we used the Xinos JCreator IDE but we recently
    switched to the Netbeans 8 IDE as Xinox no longer publishes a free shareware version
    of the IDE.


    Complete download and installation instructions for the JDK and NetBeans are found
    in the Appendix (Installing Java and NetBeans) included with these notes.'
  merge: -1
  pgno: 12
