  md: '# drawLine Method


    To do graphics (drawing) in Java, we use the built-in graphics methods.

    in this class, we will look at graphics methods that can draw colored lines and
    filled rectangles. As you progress in your programming skills, you are encouraged
    to study the many other graphics methods that can draw rectangles, ellipses, polygons
    and virtually any shape, in any color. To do drawing in a frame, we reference
    a Graphics object. This is again from the AWT and provides all the methods we
    need for drawing. To get the Graphics object (we will name it myGraphics) from
    the frame (myFrame) we are using requires a single line of code:


    ```

    Graphics myGraphics = myFrame.getGraphics();

    ```


    Once a graphics object is available, all graphics methods are applied to this
    newly formed object. Hence, to apply a graphics method named graphicsMethod to
    the myGraphics object, use:


    ```

    myGraphics.graphicsMethod(arguments);

    ```


    where arguments are any needed arguments, or information needed by the graphics
    method.'
