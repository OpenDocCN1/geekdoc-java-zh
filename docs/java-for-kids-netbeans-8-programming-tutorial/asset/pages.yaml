  md: '# Other Things to Try


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_437_0.png)


    Some things to help improve or change this game: add a scoring system to keep
    track of how many tries you took to find all the matches, make it a two player
    game game where you compete against another player or the computer, or set it
    up to match other items (colors, upper and lower case letters, numbers and objects,
    etc.). You might also add logic to let you play again (without rerunning the program),
    once a game is finished. And, the colors selected are random - what happens if
    white is selected? See if you can figure out a way to avoid choosing colors that
    don’t look good on a white background.'
