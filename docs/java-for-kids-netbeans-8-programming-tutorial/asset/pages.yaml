  md: "# Java - The Fourth Lesson\n\nIn the Guess Number project built in Class 5,\
    \ we noted it would be nice if we could continue to make guesses until we got\
    \ the correct number. To do this requires the ability to repeat segments of code.\
    \ In this Java lesson, we learn how to add this looping capability to our Java\
    \ projects. We will also learn about methods, which allow us to write better,\
    \ more compact projects.\n\n# Java Loops\n\nMany (in fact, most) Java programs\
    \ require repetition of certain code blocks. For example, as just noted, the Guess\
    \ Number game we built could really use it. Or, you may want to roll a die (simulated\
    \ die of course) until it shows a six. Or, you might generate some math results\
    \ until a value has been achieved. This idea of repeating code is called iteration\
    \ or looping.\n\n![](img/cc3acf8c58692bbfc65c30ca5a606c09_175_0.png)\n\nIn Java,\
    \ one way of looping is with the while loop:\n\n```\nwhile (expression)\n{\n \
    \   [Java code block to repeat while expression is true]\n}\n```"
  merge: -1
  pgno: 175
- img_proc: true
  md: "# Java Looping Methods 6-3\n\nIn this structure, all code between the curly\
    \ braces is repeated while the given logical expression is true. Note there is\
    \ no semicolon at the end of the while line.\n\nNotice a while structure looks\
    \ a lot like a simple if structure:\n\n```\nif (expression)\n{\n    [Java code\
    \ block to process expression is true]\n}\n```\n\nWhat's the difference? In the\
    \ if structure, the code block is processed just once if expression is true. In\
    \ the while structure, the code block is continually processed as long as expression\
    \ remains true.\n\nNote a while loop structure will not execute even if expression\
    \ is false the first time through. If we enter the loop (expression is true),\
    \ it is assumed at some point expression will become false to allow exiting. Once\
    \ this happens, code execution continues at the statement following the closing\
    \ right brace. This brings up a very important point about loops - if you get\
    \ in, make sure you get out at some point. In the while loop, if expression is\
    \ always true, you will loop forever - something called an infinite loop.\n\n\
    Let's look at a couple of examples. First, there is a loop that can be used in\
    \ a rocket countdown. It repeats as long as (while) the variable counter (starting\
    \ at 10) is greater than 0:\n\n```\ncounter = 10;\nwhile (counter > 0)\n{\n  \
    \  counter = counter - 1;\n}\n```"
  merge: -1
  pgno: 176
- img_proc: true
  md: "Another example (assuming we have a Random object named myRandom):\n\n```\n\
    rolls = 0;\ncounter = 0;\nwhile (counter < 10)\n{\n  // Roll a simulated die\n\
    \  roll = roll + 1;\n  if (myRandom.nextInt(6) + 1 == 6)\n  {\n    counter = counter\
    \ + 1;\n  }\n}\n```\n\nThis loop repeats while the counter variable remains less\
    \ than 10. The counter variable is incremented (increased by one) each time a\
    \ simulated die rolls a 6. The roll variable tells you how many rolls of the die\
    \ were needed to roll 10 sixties.\n\nAs mentioned, if the logical expression used\
    \ by a while loop is false the first time loop is encountered, the code block\
    \ in the while loop will not be executed. This may be acceptable behavior - it\
    \ may not be. There is another looping structure in Java that will always be executed\
    \ at least once.\n\nThis loop is a do/while structure:\n\n```\ndo\n{\n  Java code\
    \ block to process\n} while (expression);\n```\n\nNotice here, unlike the while\
    \ loop, there is a semicolon at the end of the while statement. The code block\
    \ in the braces repeats 'as long as' the boolean-valued"
  merge: -1
