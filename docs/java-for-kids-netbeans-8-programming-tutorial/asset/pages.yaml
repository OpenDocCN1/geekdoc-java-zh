  md: "# More Topics, More Projects\n\nNotice the hidden shapes are specified by an\
    \ array of random integers. This computation uses the integers method developed\
    \ back in Class 5. Put this method after the closing brace for the main method,\
    \ but before the closing brace for the Memory class:\n\n```\n/*\n * Shuffle Method\n\
    \ * Java for Kids\n */\npublic static int[] nIntegers(int n)\n{\n    /*\n    \
    \ * Returns n randomly sorted integers 0 -> n - 1\n     */\n    int nArray[] =\
    \ new int[n];\n    int temp, s;\n    Random myRandom = new Random();\n    // initialize\
    \ array from 0 to n - 1\n    for (int i = 0; i < n; i++) {\n        nArray[i]\
    \ = i;\n    }\n    // perform one-card shuffle\n    // i is number of items remaining\
    \ in list\n    // s is the random selection from that list\n    // swap last item\
    \ i - 1 with selection s\n    for (int i = n; i >= 1; i--) {\n        s = myRandom.nextInt(i);\n\
    \        temp = nArray[s];\n        nArray[s] = nArray[i - 1];\n        nArray[i\
    \ - 1] = temp;\n    }\n    return (nArray);\n}\n```\n\nMake sure the code compiles\
    \ successfully."
