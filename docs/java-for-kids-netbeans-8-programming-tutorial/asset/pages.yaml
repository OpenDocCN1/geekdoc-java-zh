- img_proc: true
  md: '# Debugging a Java Project


    No matter how well you plan your project and no matter how careful you are in
    implementing your ideas in Java code, you will make mistakes. Errors, or whatever
    computer programmers call bugs, do creep into your project. You may have already
    encountered a few in the projects we''ve built so far. Perhaps you spelled a keyword
    wrong, forgot a semicolon, used an upper case letter when you should have used
    a lower case, or left off a curly brace somewhere. These are all examples of program
    bugs. You, as a programmer, need to have a strategy for finding and eliminating
    those bugs. The process of eliminating bugs in a project is called debugging.
    Unfortunately, there are not a lot of hard, fast rules for fixing bugs in a program.
    Each programmer has his or her own way of attacking bugs. You will develop your
    ways. We can come up with some general strategies, though, and that''s what we''ll
    give you here.


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_133_0.png)


    Project errors, or bugs, can be divided into three types:


    +   - Syntax errors

    - Run-time errors

    - Logic errors


    Syntax errors occur when you make an error typing a line of Java code. Something
    is misselled, an improper letter case is used or something is left out that needs
    to be there. Your project won''t run if there are any syntax errors.

    nRun-time errors occur when you try to run your project. It will stop abruptly
    because something has happened beyond its control. Logic errors are the toughest
    to find. Your project will run okay, but the results it gives are not what you
    expected. Let''s examine each error type and address possible debugging methods.'
  merge: -1
  pgno: 133
