    this is a common Java task and relatively simple. At first thought, to swap

    variable aVariable with variable bVariable, you might write:


    ```

    aVariable = bVariable;

    bVariable = aVariable;

    ```


    The problem with this code is that when you replace aVariable with bVariable in

    the first statement, you have destroyed the original value of aVariable. The

    second statement just puts the newly assigned aVariable value (bVariable) back

    inVariable. Both aVariable and bVariable now have the original bVariable

    value!


    Actually, swapping two variables is a three step process. First, put

    aVariable in a temporary storage variable (make it the same type as aVariable

    and bVariable). Then, replace aVariable by bVariable. Then, replace

    bVariable by the temporary variable (which holds the original aVariable value).'
