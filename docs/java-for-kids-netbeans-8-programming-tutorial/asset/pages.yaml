  md: '# 8-28 Java for Kids


    If some reason, the selections provided by the Color class do not fit your needs,
    you can create your own color using one of over 16 million different combinations.
    The code to create a color named myColor is:


    ```

    myColor = new Color(red, green, blue);

    ```


    where red, green, and blue are integer measures of intensity of the corresponding
    primary colors. These measures can range from 0 (least intensity) to 255 (greatest
    intensity). For example, new Color(255, 255, 0) will produce yellow.


    It is easy to specify colors for graphics methods using the Color class. Any time
    you need a color, just use one of the built-in colors or create your own using
    different red, green, and blue values. These techniques can be used anywhere Java
    requires a color. For example, to change our frame''s background color, we use:


    ```

    myFrame.setBackground(Color.colorName);

    ```


    So, you get a yellow background with:


    ```

    myFrame.setBackground(Color.yellow);

    ```


    Or knowing some red, green and blue combination:


    ```

    myFrame.setBackground(new Color(red, green, blue));

    ```


