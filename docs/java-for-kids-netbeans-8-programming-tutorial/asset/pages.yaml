- img_proc: true
  md: '# Java for Kids


    Once defined, the method can be referenced in any other method in your project
    using:


    ```

    returnedValue = methodName(argumentList);

    ```


    If there is no returned value, you simply use:


    ```

    methodName(argumentList);

    ```


    In either case, you need to make sure the argumentList in the calling code matches
    the argumentList expected by the method. The list (variables or values separated
    by commas) must have the proper number of arguments, the proper type and they
    must be in the proper order.


    Let''s try to make this clearer by looking at a couple of method examples. First,
    an example that returns a value. We''ll do the dice example of rolling five dice
    and returning their sum. The method that accomplishes this task is:


    ```

    public static int rollDice()

    {

    int die1, die2, die3, die4, die5;

    die1 = myRandom.nextInt(6) + 1;

    die2 = myRandom.nextInt(6) + 1;

    die3 = myRandom.nextInt(6) + 1;

    die4 = myRandom.nextInt(6) + 1;

    die5 = myRandom.nextInt(6) + 1;

    return (die1 + die2 + die3 + die4 + die5);

    }

    ```


    This method is named rollDice and has no arguments. It returns the int value containing
    the sum of the five dice.'
