  md: '# Project - Sub Sandwich Party


    Your school class has decided to have a party. Two very long submarine sandwiches
    are being delivered and it is your job to figure out how much each student can
    eat. Sure, you could do this with a calculator, but let''s use Java!! This project
    is saved as Sandwich in the course projects folder(\JavaKids\JK Code).


    # Project Design


    Assume you know the length of each submarine sandwich. To make the cutting easy,
    we will say that each student will get a whole number of inches (or centimeters)
    of sandwich (no decimals). With this information, you can compute how many students
    can be fed from each sandwich. If the total number is more than the students you
    have in your class, everyone eats and things are good. If not, you may make adjustments.
    The program steps would be:


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_91_0.png)


    +   1. Set a value for the number of inches a student can eat.

    2. Determine length of both sandwiches.

    3. Determine how many students can eat from each sandwich.

    4. Increase or decrease the number of inches until the entire class can eat.


    Let''s translate each of these steps into Java code as we build the project. Since
    this is your first project, we''ll review many steps (creating a new project and
    adding a file) and we''ll type and discuss the code one or two lines at a time.'
