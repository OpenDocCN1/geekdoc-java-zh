  md: '# Java For Kids


    Running NetBeans


    You now have Java and the NetBeans IDE installed on your computer. All of our
    programming work will be done using NetBeans. Let''s make sure NetBeans installed
    correctly. To start using NetBeans under Microsoft Windows,


    +   - Click on the Start button on the Windows task bar.

    - Select All Programs, then NetBeans

    - Click on NetBeans IDE 8.0


    To start using NetBeans under the MAC OS,


    +   - Click on the Finder and go to the Applications Folder.

    - Open the NetBeans folder

    - Click on NetBeans IDE 8.0


    Some of the headings given here may differ slightly on your computer, but you
    should have no trouble finding the correct ones. You can also start NetBeans by
    double-clicking the desktop icon. The NetBeans program should start (several windows
    and menus will appear).


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_447_0.png)'
  merge: -1
  pgno: 447
- img_proc: true
  md: '# Installing Java and NetBeans


    We will learn more about NetBeans in the notes. For now, we want to have some
    formatting changes.


    In Java programming, indentations in the code we write are used to delineate common
    blocks. The NetBeans IDE uses four spaces for indentations as a default. This
    author (and these notes) uses two spaces. To make this change, choose the Tools
    menu item and click Options. In the window that appears, choose the Editor option
    and the Format tab:


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_448_0.png)


    As shown, choose the Tabs and Indents Category and set the Number of Spaces per
    Indent to 2.'
  merge: -1
  pgno: 448
- img_proc: true
  md: '# A-8 Java For Kids


    Before leaving this window, we make another change. Braces (curly brackets) are
    used to start and stop blocks of code. We choose to have these brackets always
    be on a separate line - it makes checking code much easier.


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_449_0.png)


    As shown, choose the Braces Category and under Braces Placement, set all choices
    to New Line. Click Apply, then OK. Stop NetBeans - you''re ready to go!'
  merge: -1
