  md: One other consideration in project design is to always build your project in
    stages. Don't try to build your entire Java program and test it all at once. This
    just compounds the possibility of errors. We suggest always building your program
    in stages. Write a little code. Compile and test that little bit of code making
    sure it works correctly. Slowly add more and more code. Compile and test each
    code addition. Continue this approach until your program is complete. You will
    find that this “go slow” approach to creating a Java project will make your programming
    task much simpler. Give it a try in projects we build.
