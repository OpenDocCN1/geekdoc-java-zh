- img_proc: true
  md: 'application name in the task bar, it will return to the screen. Go ahead and
    try it. Where did your colored rectangles go? You need to click the frame again
    to redraw them.


    This happens because, as coded, Java graphics objects have no memory. They only
    display what has been drawn on them. If you reduce your form to the task bar and
    restore it (as we just did), the graphics object cannot remember what was displayed
    previously - it will be cleared. Similarly, if you switch from an active Java
    application to some other application, your Java form may become partially or
    fully obscured. When you return to your Java application, the obscured part of
    any graphics object will be erased. Again, there is no memory. To correct this,
    we need something called persistent graphics. Such persistence is possible, but
    beyond what we discuss here.


    A consequence of the lack of persistent graphics is that nothing can be drawn
    to a frame until some event occurs. You can''t put drawing commands in the main
    method to have some initial graphics appear. That’s why in all the little graphics
    examples we have done, we require a mouse press to do drawing. We’ll need to remember
    this in the drawing project we build next to get some initial things drawn.'
