  md: '# Your First Java Program


    # Declaring Variables


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_78_0.png)


    Once we have named a variable and determined what type we want it to be, we must
    relay this information to our Java project. We need to declare our variables.
    The Java statement used to declare a variable named variableName as type is:


    ```

    type variableName;

    ```


    Don''t forget the semicolon (;) - every Java statement ends with one. We need
    a declaration statement like this for every variable in our project. This may
    seem like a lot of work, but it is worth it. Proper variable declaration makes
    programming easier, minimizes the possibility of program errors, and makes later
    program modification easier.


    So, where do we put variable declarations? In our first several projects, we will
    only be writing code within the main method of a Java project. So, variable declarations
    will be placed after the line defining the main method. This gives the variables
    local scope, meaning they are available only in the method they are defined in.
    This level of scope is fine for our first few projects.'
