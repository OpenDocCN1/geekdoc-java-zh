  md: '# Contents


    xiii


    Highly organized reference materials for student self-study!


    Materials already condense what is available from MSDN (which tends to be written
    for adults) and in a context and age-appropriate manner, so that younger students
    remember what they learn.


    The time savings for parents, teachers and students is enormous as they need not
    sift through pages and pages of on-line help to find what they need.


    How to mark the projects.


    In a classroom environment, it is possible for teachers to mark student progress
    by asking questions during the various problem design and coding stages. In the
    early grades (grades 5 to 8) teachers can make their own oral, pictorial review
    or written pop quizzes from the reference material provided as a review strategy
    from day to day. I have found the requirement of completing projects (mastery)
    sufficient for gathering information about student progress - especially in the
    later grades (grades 10 to 12).


    Lessons encourage your own programming extensions.


    Once concepts are learned, it is difficult to NOT know what to do for your own
    projects. This is true even at the Middle school level - where applications can
    be made in as short as 10 minutes (a high-low guessing game, or a temperature
    conversion program, for example), or 1 period in length - if one wished to expand
    upon any of the projects using the “Other Things to Try” suggestions.


    Using Kidware Software tutorials for the past decade, I have to say that I could
    not have achieved the level of success which is now applied in the variety of
    many programming environments which are currently of considerable interest to
    kids! I thank Kidware Software and its authors for continuing to stand for what
    is right in the teaching methodologies which work with kids - even today''s kids
    where competition for their attention is now so much an issue.


    Regards,


    Alan Payne

    Computer Science Teacher

    T.A. Blakeland High School

    Oakville, Ontario


    http://chatt.hdsb.ca/~paynea'
