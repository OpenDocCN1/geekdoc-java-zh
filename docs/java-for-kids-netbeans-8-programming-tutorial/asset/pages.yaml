  md: '# 9-62 Java for Kids


    Now, to the heart of the Balloons game - the event method associated with timerBalloons.
    We haven''t seen any dropping balloons. Here''s where we do, and more. The timerBalloons
    timer handles the animation sequence. It drops the balloons down the screen, checks
    for popping, and checks for balloons reaching the bottom of the frame. It gets
    new balloons started. There''s a lot going on. The procedure steps are identical
    for each balloon. They are:


    +   - Move the balloon.

    - Check to see if balloon has popped. If so, sound a beep, make the balloon disappear,
    increment score and make balloon reappear at the top with a new speed.

    - Check to see if balloon has reached the bottom without being popped. If so,
    start a new balloon with a new speed.


    The steps are easy to write, just a little harder to code. Moving a balloon simply
    involves erasing it at its old location and redrawing it at its new location (determined
    by the balloonY value). To check if the balloon reached the bottom, we use the
    border crossing logic discussed earlier. The trickiest step is checking if a balloon
    has popped. One way to check for a balloon pop is to check if the image rectangle
    overlaps the arrow rectangle using the collision detection logic developed earlier.
    But a balloon would pop if the arrow barely touched the balloon. In our code,
    we modify the collision logic such that we will not consider a balloon to be popped
    unless the entire width of the arrow is within the width of the balloon.


    Here''s the complete actionPerformed event method (for the timerBalloons timer)
    implementing these steps. The balloons are handled'
