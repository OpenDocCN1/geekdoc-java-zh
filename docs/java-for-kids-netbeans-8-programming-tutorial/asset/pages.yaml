  md: '# A Brief History of Programming Languages


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_24_0.png)


    We''re almost ready to get started. But, first I thought it would be interesting
    for you to see just where the Java language fits in the history of some other
    computer languages. You will see just how new Java is!


    In the early 1950''s, most computers were used for scientific and engineering
    calculations. The programming language of choice in those days was called FORTRAN(FORula
    TRANslator). FORTRAN was the first modern language and is still in use to this
    day (after going through several updates). In the late 1950''s, bankers and other
    business people got into the computer business using a language called COBOL (the
    letter B stands for business, I can''t remember what the other letters mean).
    Within a few years after its development, COBOL became the most widely used data
    processing language. And, like FORTRAN, it is still being used today.


    In the 1960''s, two professors at Dartmouth College decided that “everyday” people
    needed a language they could use to learn programming. They developed BASIC (Beginner''s
    All-Purpose Symbolic'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'Instruction Code). BASIC (and its successors, GW-BASIC, Visual Basic, Visual
    Basic .NET) is probably the most widely used programming language. Many dismiss
    it as a "toy language," but BASIC was the first product developed by a company
    you may have heard of - Microsoft! And, BASIC has been used to develop thousands
    of commercial applications.


    Java had its beginnings in 1972, when AT&T Bell Labs developed the C programming
    language. It was the first, new scientific type language since FORTRAN. If you''ve
    ever seen a C program, you will notice many similarities between Java and C. Then,
    with object-oriented capabilities added, came C++ in 1986 (also from Bell Labs).
    This was a big step.


    On May 23, 1995, Sun Microsystems released the first version of the Java programming
    language. It represented a streamlined version of C and C++ with capabilities
    for web and desktop applications on any kind of computer. No language before it
    had such capabilities. Since this introduction, just a few years ago, millions
    of programmers have added Java capabilities to their programming skills. Improvements
    are constantly being made to Java and there is a wealth of support to all programmers,
    even beginners like yourself, from the vast Java community. Let''s start your
    journey to join this young, vital community.'
  merge: -1
