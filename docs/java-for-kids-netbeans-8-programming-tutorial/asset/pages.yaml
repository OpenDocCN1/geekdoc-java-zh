  md: '# Project Design


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_103_0.png)


    You are about to start developing fairly detailed projects using Java. We will
    give you projects to build and maybe will have ideas for your own projects. Either
    way, it''s fun and exciting to see ideas end up as computer programs. Before starting
    a project, it''s a good idea to spend a little time thinking about what you are
    trying to do. This idea of proper project design will save you lots of time and
    result in a far better project.


    Proper project design is not really difficult. The main idea is to create a project
    that is easy to use, easy to understand, and free of errors. That makes sense,
    doesn''t it? Spend some time thinking about everything you want your project to
    do. What information does the program need? What information does the computer
    determine? Decide what programming steps you need to follow to accomplish desired
    tasks.


    Make the Java code in your methods readable and easy to understand. This will
    make the job of making later changes (and you will make changes) much easier.
    Follow accepted programming rules - you will learn these rules you learn more
    about Java. Make sure there are no errors in your project. This may seem like
    an obvious statement, but many programs are not error-free.'
