    the other player’s card. You then get another card and continue the comparison
    process until you run out of cards. Whoever has the most cards once the game stops
    is declared the winner. Playing this game requires steps similar to these:


    +   1. Shuffle a deck of cards.

    2. Give a card to the first player.

    3. Give a card to the second player.

    4. Determine which card is higher and declare a winner.

    5. Repeat the process of giving cards to players until you are out of cards.


