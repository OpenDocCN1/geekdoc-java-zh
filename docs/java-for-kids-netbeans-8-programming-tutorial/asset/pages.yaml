  md: '# Bonus Project - Pong!


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_438_0.png)


    In the early 1970''s, while Bill Gates and Paul Allen were still in high school,
    a man named Nolan Bushnell began the video game revolution. He invented a very
    simple game - a computer version of Ping Pong. There were two paddles, one on
    each side of the screen. Players then bounced the ball back and forth. If you
    missed the ball, the other player got a point.


    This first game was called Pong. And, and Nolan Bushnell was the founder of Atari
    - the biggest video game maker for many years. (Nolan Bushnell also founded Chucky
    Cheese''s Pizza Parlors, but that''s another story!) In this bonus project, I
    give you a version of Pong written with Java. This is a project built in KidWare''s
    Learn course. I don''t expect you to build this project, but you can if you want.
    Just load the project (named Pong) and run it. Skim through the code - you should
    be able to understand a lot of it. The idea of giving you this project is to let
    you see what can be done with Java.


    In this version of Pong, a ball moves from one end of a panel to the other, bouncing
    off side walls. Players try to deflect the ball at each end using a'
  merge: -1
  pgno: 438
