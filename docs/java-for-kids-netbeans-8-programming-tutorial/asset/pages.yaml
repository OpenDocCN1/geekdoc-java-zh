  md: '# Logical Operators


    Logical operators are used to combine logical expressions built using comparison
    operators. Using such operators allows you


    We will look at two logical operators used to combine logical expressions. The
    first is the and operator represented by two ampersands (&&). The format for using
    this operator is (using two logical expressions, x and y, each with a boolean
    result):


    ```

    x && y

    ```


    This expression is asking the question “are x and y both true?” That’s why it
    is called the and operator. The operator (&&) will return a true value only if
    both x and y are true. If either expression is false, the operator will return
    a false. The four possibilities for and (&&) are shown in this logic table:


    | x | y | x && y |

    |---|---|---|

    | true | true | true |

    | true | false | false |

    | false | true | false |

    | false | false | false |


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_147_0.png)'
