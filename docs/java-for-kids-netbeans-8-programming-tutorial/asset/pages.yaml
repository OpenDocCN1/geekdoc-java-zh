  md: '# Java for Kids


    Parentheses can be used in logical expressions to force precedence in evaluations.
    What if, in the above example, we wanted to do the or or (||) operation first?
    This is done by rewriting using parentheses:


    ```

    aInteger > 10 || bInteger > 10 && aInteger + bInteger ====

    ```


    You should be able to show this evaluates to false [do the or or (||) first].
    Before, without parentheses, it was true. The addition of parentheses has changed
    the value of this logical expression! It''s always best to clearly indicate how
    you want a logical expression to be evaluated. Parentheses are a good way to do
    this. Use parentheses even if precedence is not affected.


    If we moved the parentheses in this example and wrote:


    ```

    aInteger > 10 || (bInteger > 10 && aInteger + bInteger == 20)

    ```


    the result (true) is the same as if the parentheses were not there since the and
    and (&&) is done first anyway. The parentheses do, however, clearly indicate the
    and is performed first. Such clarity is good in programming.


    Comparison and logical operators are keys to making decisions in Java. Make sure
    you are comfortable with their meaning and use. Always double-check any logical
    expression you form to make sure it truly represents the decision logic you intend.
    Use parentheses to add clarity, if needed.'
