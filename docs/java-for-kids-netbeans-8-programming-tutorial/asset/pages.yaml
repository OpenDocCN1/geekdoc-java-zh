  md: '# 5-4 Java for Kids


    We''ve used a different case on the variable name than we did in evaluating the
    variable. Try running and this window will appear. Click No:


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_135_0.png)


    Click Run Anyway and you will see in the Output window:


    ```

    run:

    Exception in thread "main" java.lang.RuntimeException:

    Uncompilable source code - cannot find symbol

    symbol: variable MyInt

    location: class bug.Bug

    at bug.Bug.main(Bug.java:13)

    Java Result: 1

    BUILD SUCCESSFUL (total time: 1 second)

    ```


    The 13 tells you there is a problem in line 13 of your program. The message ''cannot
    find symbol'' is often seen in Java. It means Java does not recognize the name
    pointed to by symbol:. In this case, Java does not recognize the variable MyInt
    because it was declared as myInt (different case on the letter).


    Whenever you see a ''cannot find symbol'' error, it means one of just a few things.
    If involving a variable, it means you have misspelled a properly declared variable
    or you have forgotten to declare a variable. If the message involves a method
    or function, it means you have misspelled the function name or have not provided
    it to your class. It is usually straightforward to correct such errors.'
