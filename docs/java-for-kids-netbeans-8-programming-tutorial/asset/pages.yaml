  md: '# Appendix. Installing Java and NetBeans


    To write and run programs using Java, you need the Java Development Kit (JDK)
    and the NetBeans Integrated Development Environment (IDE). These are free products
    that you can download from the Internet. This simply means we will copy a file
    onto our computer to allow installation of Java.


    +   1. Start up your web browser (Internet Explorer, Chrome, Firefox, Safari or
    other browser) and go to Java web site: http://www.oracle.com/technetwork/java/jayase/downloads/index.html

    This web site has lots of useful information. As you become more proficient in
    your programming skills, you will go to this site often for answers to programming
    questions, interaction with other Java programmers, and lots of sample programs.


    +   2. On this web page, you should see a button that looks something like this


