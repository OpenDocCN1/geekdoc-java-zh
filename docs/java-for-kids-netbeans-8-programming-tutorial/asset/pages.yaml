  md: '# Java for Kids


    Actually, you''ve been using several methods (besides the main method in every
    project) already in this course and, whether you know it or not, have seen the
    big advantages of using methods. Whenever you print information using the println
    method, you are actually executing lots of code provided by the Java language.
    This code decides how to print the text you provide. You can imagine replacing
    every reference to a println statement with the actual code that prints the line?
    Other methods you''ve been using include the methods in the Scanner class that
    allow us to get keyboard input and the Math functions. It''s nice to have this
    code available for our use, rather than have to write it ourselves. Would you
    know how to write the code needed to find the square root of a number? When we
    use one of these “built-in” methods, we call it by providing information it needs
    (arguments). It then does its tasks. Some methods, for example the nextInt method
    of the Scanner class return a value for your use, while some only perform a task
    (println, for example), returning nothing to the calling program.


    Using methods in your Java projects can help divide a complex application into
    more manageable units of code. Just think of a method as a code block you can
    access from anywhere in a Java project. When you call the method, program control
    goes to that method, performs the assigned tasks and returns to the calling program.
    It''s that easy. Methods are also reusable, keeping you from having to rewrite
    code to do the same task. You can easily copy methods from one application to
    another. Reusability is a big advantage of object-oriented languages like Java.


    Let''s see how to create a method. Every method has a method declaration and the
    method body that contains the actual code (just like the main method we''ve been
    using).'
