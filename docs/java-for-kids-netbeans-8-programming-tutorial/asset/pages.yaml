  md: '# Colors


    Colors play a big part in Java graphics applications. Lines, rectangles, ovals
    can all be drawn and filled in various colors. The background color of the frame
    can be set to a particular color. These colors must be defined in Java code. How
    do we do this? There are two approaches we will take: (1) use built-in colors
    and (2) create a color.


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_268_0.png)


    The colors built into Java are specified by the Color class. Such a color is specified
    using:


    ```

    Color.colorName

    ```


    where colorName is a reserved color name. There are thirteen standard color names:


    Darker colors:


    | black | darkGray |

    | blue | gray |

    | red |


    | white | green |

    | cyan | orange |

    | lightGray | yellow |

    | magenta | pink |'
