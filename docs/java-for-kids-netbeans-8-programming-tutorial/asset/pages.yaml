  md: '# Arrays, More Java Looping


    Java provides a way to store a large number of variables under the same name -
    variable arrays. Each variable in an array, called an element, must have the same
    data type, and they are distinguished from each other by an array index. A variable
    array is declared in a very similar to other variables. To indicate the variable
    is an array, you use two square brackets ([ ]) after the type. Square brackets
    are used a lot with arrays. At the same time you declare an array, it is good
    practice to create it using the new keyword. For 352 student names and 352 student
    scores, we declare and create the needed arrays using:


    ```

    String[] student = new String[352];

    [] score = new int[352];

    ```


    The number in brackets is called the array dimension. These two lines have the
    same effect as the 704 declaration lines we might have to write! And how easy
    it would be to add 200 more variables if we needed them. You can also declare
    and create an array in two separate statements if you prefer. For the student
    name array, that code would be:


    ```

    String[] student; // the declaration;

