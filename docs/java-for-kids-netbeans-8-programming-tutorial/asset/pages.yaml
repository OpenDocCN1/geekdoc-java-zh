  md: '# Other Things to Try


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_299_0.png)


    The Blackboard Fun project offers lots of opportunity for improvement with added
    options. Add the ability to change the background color of the blackboard. Make
    it impossible to draw in the color selection area.


    See if you can figure out ways to get special effects - we''ll show you a couple.
    Here''s a way to draw “fat lines.” It uses trigonometry, but don''t be scared.
    Place this code in the mouseDragged method following the line where the drawLine
    method is executed:


    ```

    // fat lines

    int x2 = e.getX();

    int y2 = e.getY();

    double delta = 20.0;

    double slope = Math.atan2(y2 - previousY, x2 - previousX);

    myGraphics.drawLine((int)(x2 + delta * Math.cos(slope)), (int)(y2 + delta * Math.sin(slope)),
    (int)(x2 - delta * Math.cos(slope)), (int)(y2 - delta * Math.sin(slope)));

    // end fat lines

    ```


    This code draws a line (2 * delta long) perpendicular (at a right angle) to the
    drawn line. Run your project to see how it works. Try different delta values.'
