  md: '# Contents


    # Forward By Alan Payne, A Computer Science Teacher


    What is “Java for Kids” ... and how it works.


    The tutorial "Java for Kids" is a highly organized and well-indexed set of lessons
    meant for children aged 10 and above. NetBeans, a specific IDE (Integrated Development
    Environment) is used throughout the lessons.


    The tutorial provides the benefit of completed age-appropriate applications for
    children and fully documented projects from the teacher''s or parents'' point
    of view. That is, while full solutions are provided for the adults'' (and child
    learner''s) benefit, the projects are presented in an easy-to-follow set of lessons
    explaining the rational for the format layout, coding design and conventions,
    and specific code related to the problem. Child-learners may follow the tutorials
    at their own pace. Every bit of lesson is remembered as it contributes to the
    final solution of a kid-friendly application. The finished product is the reward,
    but the student is fully engaged and enriched by the process. This kind of learning
    is often the focus of teacher training. Every computer science teacher knows what
    a great deal of preparation is required for projects to work for kids. With these
    tutorials, the research behind the projects is done by an author who understands
    the classroom and parenting experience. That is extremely rare!


    Graduated Lessons for Every Project ... Lessons, examples, problems and projects.
    Graduated learning. Increasing and appropriate difficulty... Great results.


    With these projects, there are lessons providing a comprehensive, kid-friendly
    background on the programming topics to be covered. Once understood, concepts
    are easily applicable to a variety of applications. Then, specific examples are
    drawn out that a young learner can practice with the NetBeans environment. Then
    specific Java coding for the example is provided so that the student can see all
    the parts of the project come together for the finished product.


    By presenting lessons in this graduated manner, students are fully engaged and
    appropriately challenged to become independent thinkers who can come up with their
    project ideas and design their own forms and can do their own coding. Once the
    process is learned, student engagement is unlimited! I have seen literacy improve
    dramatically because students cannot get enough of what is being presented.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Java for Kids


    Indeed, lessons encourage accelerated learning - in the sense that they provide
    an enriched environment to learn computer science, but they also encourage accelerating
    learning because students cannot put the lessons away once they start! Computer
    science provides this unique opportunity to challenge students, and it is a great
    testament to the authors that they are successful in achieving such levels of
    engagement with consistency.


    # My History with Kidware Software products.


    I have used Kidware''s Programming Tutorials for over a decade to keep up my own
    learning. By using these lessons, I am able to spend time on things which will
    pay off in the classroom. I do not waste valuable time ensced in language reference
    libraries for programming environments with help screens which can never be fully
    remembered! These projects are examples of student projects should be as final
    products - thus, the pathway to learning is clear and immediate in every project.


    If I want to use or expand some of the projects for student use, then I take advantage
    of size-license options. I have found it straight forward to emphasize the fundamental
    computer science topics that form the base of these projects when using them in
    the classroom. I can list some computer science topics which everyone will recognize,
    regardless of where they teach - topics which are covered expertly by these tutorials:


    +   * Data Types and Ranges

    * Scope of Variables

    * Naming Conventions

    * Decision Making

    * Looping

    * Language Functions - String, Date, Numerical

    * Arrays

    * Writing your Own Methods (subroutines) and more... it''s all integrated into
    the tutorials.


    In many States or Provinces, the above-listed topics would not be formally introduced
    in Middle School computer studies, but would form the basis of projects undertaken
    by students. With these tutorials, you as the teacher or parent may choose where
    to put the emphasis, but be sure to cover the curricular expectations of your
    curriculum documents.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'Any further Middle school computer programming topics derive directly from
    those listed above. Nothing is forgotten. All can be integrated with the lessons
    provided.


    Quick learning curve for teachers! How teachers can use the product:


    Having projects completed ahead of time can allow the teacher to present the design
    aspect of the project FIRST, and then have students all of their learning in the
    context of what is required in the finished product. This is a much faster learning
    curve than if students designed all of their own projects from scratch. Lessons
    concentrating on a unified outcome for all makes for much more streamlined engagement
    for students (and that is what they need, in Middle school, and in grades 9 and
    10), as they complete more projects within a short period of time and there is
    a context for everything that is learned.


    With the Java for Kids tutorials, sound advice regarding generally accepted coding
    strategies ("build and test your code in stages," "learn input, output, formatting
    and data storage for different data types") encourage independent thought processes
    among learners. After mastery, it is much more likely that students can create
    their own problems and solutions from scratch. Students are ready to create their
    own summative projects for your computer science course - or just for fun, and
    they may think of projects for their other courses as well! And what could be
    wrong with asking the students'' other teachers what they would like to see as
    project extensions?


    # Meets State and Provincial Curriculum Expectations and More


    Different states and provinces have their own curriculum requirements for computer
    science. With the Kidware Software products, you have at your disposal a series
    of projects which will allow you to pick and choose from among which best suit
    your curriculum needs. Students focus on design stages and sound sound problem-solving
    techniques from a computer-science, problem-solving perspective. In doing so,
    they become independent problem-solvers, and will exceed the curricular requirements
    of Middle schools and Secondary schools everywhere.


    Useable projects - Out of the box!


    The specific projects covered in the Java for Kids tutorials are suitable for
    students aged 10 and above.'
  merge: -1
