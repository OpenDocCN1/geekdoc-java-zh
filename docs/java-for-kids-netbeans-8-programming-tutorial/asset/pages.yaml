  md: '# Mathematical Functions


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_107_0.png)


    In Class 3, we saw the Java arithmetic operators that allow us to perform the
    basics of addition, subtraction, multiplication and division. Like other computer
    programming languages, Java also has the capability of doing very power mathematical
    computations. Java’s built-in mathematical **functions** (also called **methods**)
    are often used in these computations.


    We don’t expect you to be a mathematical genius to work through these notes, so
    we will only look at three mathematical functions. First, just what is a **function**?
    A function is a routine that computes some value for you, given some information.
    The format for using a function is:


    ```

    functionValue = functionName(argumentList);

    ```


    **functionName** is the name of the function and **argumentList** is a list of
    values (arguments, separated by commas) provided to the function so it can do
    its work. In this assignment statement, **functionName** uses the values in **argumentList**
    to compute a result and assign that result to the variable we have named **functionValue**.
    We must insure the variable **functionValue** has the same type as the value computed
    by **functionName**.'
