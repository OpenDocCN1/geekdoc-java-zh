    # JAVA FOR KIDS


    JAVA FOR KIDS is a beginner programming tutorial consisting of 10 chapters explaining
    (in simple, easy-to-follow terms) how to build a Java 8 project design, object-oriented
    programming, console applications, graphics applications and many examples of
    the Java language. Numerous examples are used to demonstrate every step in the
    building process. The tutorial also includes several detailed projects for students
    to build and try. These projects include a number guessing, a card game, an allowance
    calculator, a state capitals game, Tic-Tac-Toe, a simple drawing and a simple
    video game.


    JAVA FOR KIDS is presented with the benefit of over 400 pages of color illustrations,
    notes and actual Java examples. This teacher or parent facilitated material should
    be understandable to kids aged 10 and up. No programming experience is necessary,
    but by doing common tasks using a computer operating system (simple editing, file
    management, understanding directory structures, working on the Internet) is connected.

    JAVA FOR KIDS requires a minimum Operating System of Windows Vista, 7, 8 or MacOS
    X, or Linux. You will also need free NetBeans 8 Integrated Development Environment
    and Version 8 of the Java Development Kit. The Java source code and all multimedia
    files are available for download from the publisher''s website (www.KindleSoftware.com)
    after book registration.


