  md: '# Let’s Get Started


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_26_0.png)


    Learning how to use Java to write a computer program (like learning anything new)
    involves many steps, many new terms, and many new skills. We will take it slow,
    describing each step, term, and skill in detail. Before starting, we assume you
    know how to do a few things:


    +   * You should know how to start your computer and use the mouse.

    * You should have some knowledge on working with your particular operating system
    (Windows 7 or 8, Vista or XP). In these notes, we use Windows 7. If you are using
    another operating system, your screens may appear different than those shown here.

    * You should know how to resize and move windows around on the screen.

    * You should know how to run an application on your computer by using the Start
    Menu or some other means.

    * You should know how to fill in information in dialog boxes that may pop up on
    the screen.

    * You should know about folders and files and how to create and find them on your
    computer.

    * You should know what file extensions are and how to identify them. For example,
    in a file named Example.ext, the three letters ext are called the extension.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '+   - You should know how to click on links to read documents and move from
    page to page in such documents. You do this all the time when you use the Internet.

    - You should know how to access the Internet and download files.


    You have probably used all of these skills if you''ve ever used a word processor,
    spreadsheet, or any other software on your computer. If you think you lack any
    of these skills, ask someone for help. They should be able to show you how to
    do them in just a few minutes. Actually, any time you feel stuck while trying
    to learn this material, never be afraid to ask someone for help. We were all beginners
    at one time and people really like helping you learn.


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_27_0.png)


