  md: '# Java for Kids


    And, here''s the rules:


    +   - Java code requires perfection. All keywords must be spelled correctly. If
    you type frontline instead of println, a human may know what you mean, but a computer
    won''t.

    - Java is case-sensitive, meaning upper and lower case letters are considered
    to be different characters. When typing code, make sure you use upper and lower
    case letters properly. In Java, the words Main and main are completely different.

    - Java ignores any "white space" such as blanks. will often use white space to
    make our code more readable.

    - Curly braces are used for grouping. They mark the beginning and end of programming
    sections. Make sure your Java programs have an equal number of left and right
    braces. We call the section of code between matching braces a block. It is good
    coding practice to indent code within a block. This makes code easier to follow.
    Notice in the example, each block is indented 3 spaces. If you use NetBeans, it
    automatically indents code blocks for you.

    - Every Java statement will end with a semicolon. A statement is a program expression
    that generates some action (for example, the Print statement above). Note that
    not all Java expressions are statements (for example, the line defining the main
    method has no semicolon.


    We''ll learn a lot more Java programming rules as we progress.'
