  md: '# Timers, Animation, Keyboard Methods 9-71


    Make it possible to play longer games and, as the game goes on, make the game
    more difficult using some of the ideas above (smaller arrow, faster balloons).
    You''ve seen this in other games you may have played - games usually get harder
    as time goes on.


    Players like to know how much time they have left in game. Add this capability
    to your game. Use StringVar to print on this frame. You''ll need another timer
    with a delay of 1000 (one second). Whenever this timer''s event is executed, another
    second has gone by. In this event, subtract 1 from the value displayed. You should
    be comfortable making such a change to your project.


    Another thing players like to know is the highest score on a game. Add this capability.
    Declare a new variable to keep track of the highest score. After each game is
    played, compare the current score with the highest score to see if a new high
    has been reached. Decide how to display the highest score. One problem, though.
    When you stop the program, the highest score value will be lost. A new high needs
    to be established each time you run the project. As you become a more advanced
    Java programmer, you''ll learn ways to save the highest score.


