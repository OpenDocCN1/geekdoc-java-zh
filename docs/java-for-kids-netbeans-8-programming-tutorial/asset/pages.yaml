  md: '# Project - Card Wars


    In this project, we create a simplified version of the kid''s card game - War.
    You play against the computer. You each get half a deck of cards (26 cards). Each
    player turns over one card at a time. The one with the higher card wins the other
    player''s card. The one with the most cards at the end. Obviously, the shuffle
    routine will come in handy here. We call this project Card Wars! This project
    is saved as CardWars in the projects folder (JavaKids/JK Code).


    # Project Design


    The game is conceptually simple. The steps to follow are:


    +   1. Shuffle a deck of cards.

    2. Computer gives itself a card and player a card.

    3. Computer compares cards, the player with the higher card wins both cards.

    4. Scores are computed and displayed.

    5. Process continues until all cards have been dealt from the deck.


    We can use our shuffle routine to shuffle the deck of cards (compute 52 random
    integers from 0 to 51). Describing the handed-out cards requires converting the
    integer card value to an actual card in the deck (value and suit). We will create
    a Java method to do this. Comparing the cards is relatively easy (we''ll add the
    capability to our card display method), as updating and displaying the scores
    (we will use our old friend, the println method). No input is needed from the
    user (besides pressing a key on the keyboard to see the cards) - he/she merely
    watches the results go by.'
