  md: '# Java Graphics, Mouse Methods 8-3


    in Java. In Java, event methods are implemented in code using event listeners
    - they “listen” for events to occur.


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_244_0.png)


    Here’s how it works:


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_244_1.png)


    In this “model,” the Java listener waits for an event to occur. Once an event
    is detected, program control transfers to the corresponding event method. Once
    that method is executed, program control returns to the listener. Each method
    is simply a set of Java code with instructions on what to do if the particular
    event occurs. So, in GUI programming, we spend most of our time writing event
    methods.'
