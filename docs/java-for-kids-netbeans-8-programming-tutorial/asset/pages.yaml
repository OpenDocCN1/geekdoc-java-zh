  md: "# Event Methods\n\nMany Java event listeners (primarily those for mouse and\
    \ keyboard inputs) that are implemented using something called adapters (also\
    \ available from the AWT). The adapter that implements events for the frame (window)\
    \ is called the WindowAdapter and it works with the WindowListener. There are\
    \ certain\n\n![](img/cc3acf8c58692bbfc65c30ca5a606c09_253_0.png)\n\nwindow events\
    \ that can be “listened for.” In our case, we want to listen for the windowClosing\
    \ event. The code that adds this method to our little application is (type this\
    \ carefully after the lines creating the frame):\n\n```\n// add listener for closing\
    \ frame\nmyFrame.addWindow(new WindowAdapter())\n{\n    public void windowClosing(WindowEvent\
    \ e) {\n        System.exit(0);\n    }\n});\n```"
