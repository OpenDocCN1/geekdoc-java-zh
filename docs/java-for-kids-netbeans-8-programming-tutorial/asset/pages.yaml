- img_proc: true
  md: '# What is Java?


    Java is a computer programming language developed by Sun Microsystems. A programming
    language is used to provide instructions to a computer to do specific tasks. Java
    is a new language (being created in 1995) and has been very successful for many
    reasons.


    The first reason for Java''s popularity is its cost - absolutely FREE!! Many other
    programming languages sell for hundreds and thousands of dollars, which makes
    it difficult for many people to start learning programming. A second reason for
    the popularity of Java is that a Java program can run on almost any computer.
    I''m sure you''ve seen programs that only run on Linux computers or Windows-based
    computers. With Java, there is no such thing as a Linux version or a Windows version
    of a program. We say that Java programs are platform-independent.


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_21_0.png)


    Java can be used to develop many types of applications. There are simple text-based
    programs called console applications. These programs just support text input and
    output to your computer screen. You can also build graphical'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'user interface (GUI, pronounced ''gooey'') applications. These are applications
    with menus, toolbars, scroll bars, and other controls which depend on the computer
    mouse for input. Examples of GUI applications you may have used word processors,
    spreadsheets and computer games. A last application that can be built with Java
    are applets. These are small GUI applications that can be run from within a web
    page. Such applets make web pages dynamic, changing with time. I think you can
    see the versatility of Java. In this class, we mainly use simple console applications.
    This allows us to concentrate on learning the basics of Java without getting lost
    in the world of GUI’s.


    Another popular feature of Java is that it is object-oriented. This is a fancy
    way of saying that Java programs are many basic pieces that can be used over and
    over again. What this means to you, the Java programmer, is that you can build
    and change large programs without a lot of additional complication. As you work
    through this course, you will hear the word object many, many times.


    A last advantage of Java is that it is a simple language. Compared to other languages,
    there is less to learn. This simplicity is necessary to help insure the platform-independence
    (ability to run on any computer) of Java applications. But, just because it is
    a simple language doesn''t mean it lacks capabilities. You can do anything with
    Java that you can with any of the the more complicated languages.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Why Learn Java?


    We could very well just ask the question - Why Learn a Programming Language? There
    are several reasons for doing this. First, if you know how to program, you will
    have a better understanding of just how computers work. Second, writing programs
    is good exercise for your thinking skills - you must be a very logical thinker
    to write computer programs. You must also be something of a perfectionist - computers
    are not smart and require exact, perfect instructions to do their jobs. Third,
    computer programmers are in demand and make a lot of money. And, last, writing
    computer programs is fun. It''s rewarding to see your ideas for a certain computer
    program come to life on the computer screen.


    So, why learn Java? We''ve already seen some of the advantages of using and learning
    Java - it''s free, it''s platform-independent, it can be used to write a wide
    variety of applications and it is object-oriented. And, another reason for learning
    Java is that it is one of the easiest languages to learn. Recall Java is a simple
    language with not a lot of instructions to learn. Because of its simplicity, you
    can learn to write Java programs very quickly. But, just because you can write
    your first program quickly doesn''t mean you''ll learn everything there is to
    know about Java. This course just introduces Java. There''s still a lot to learn
    - there''s always a lot to learn. So, consider this course as a first step in
    a journey of becoming a proficient Java programmer.'
  merge: -1
