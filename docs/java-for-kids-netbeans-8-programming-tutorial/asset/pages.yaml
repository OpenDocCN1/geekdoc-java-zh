  md: '# Java for Kids


    The noted problem will occur any time the nextLine method is preceded by a nextDouble
    (or any kind of numeric input). Why? When a number is typed and you press <Enter>,
    there is still a new line character hanging around in that line of input. When
    the nextLine method is invoked, it reads this new line character as a string input
    and continues. To keep this from happening, we just put an extra nextLine method
    in the code to ''strip off'' the straggling new line character. Then the subsequent
    nextLine method will get the string input you really want. Notice we only have
    to do this when a nextLine is preceded by a numeric input of some kind.


    Add the shaded line to your ''string input'' code:


    ```

    System.out.print("Type in some string ");

    scanner.nextLine();

    myString = scanner.nextLine();

    System.out.println("You entered " + myString);

    ```


    This line will read the new line character left after reading the decimal number.
    Now, run again. Enter an age and a decimal number. Now, the program is properly
    waiting for a string input:


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_119_0.png)'
