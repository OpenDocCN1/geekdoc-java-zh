  md: '# Logic Errors


    Logic errors are the most difficult to find and eliminate. These errors that don''t
    keep your project from running, but cause incorrect or unexpected results. The
    only thing you can do at this point, if you suspect logic errors exist, is to
    dive into your project and make sure everything is coded exactly as you want.
    Finding logic errors is a time-consuming art, not a science. There are no general
    rules for finding logic errors. Each programmer has his or her own particular
    way of searching for logic errors.


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_140_0.png)


    With the example we have been using, a logic error would be setting a variable
    to an incorrect value. Or, perhaps you add two numbers together when you should
    have subtracted. Logic errors are mistakes you have inadvertently introduced into
    your Java code. And, unfortunately, these errors are not pointed out to you. Hence,
    eliminating logic errors is not always easy.


    Advanced Java programmers use something called a debugger that helps in the identification
    of logic errors. Using a debugger lets you examine variable values, stop your
    code wherever and whenever you want, and run your project line-by-line. Use of
    a debugger is an advanced topic and will not be talked about in this course. If
    you want to improve your Java skills, you are encouraged to eventually learn how
    to use a debugger (NetBeans has a debugger to use). For now, you need to learn
    to eliminate logic errors by paying close attention to your code. And, the best
    approach is to be so careful that you don''t have any logic errors to worry about.'
