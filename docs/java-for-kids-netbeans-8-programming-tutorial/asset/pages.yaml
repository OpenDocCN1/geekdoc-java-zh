- img_proc: true
  md: 'We will perform what could be called a “one card shuffle.” In a one card shuffle,
    you pull a single card (at random) out of the deck and lay it aside on a pile.
    Repeat this 52 times and the cards are shuffled. Try it! I think you see this
    idea is simple, but doing a one card shuffle with a real deck of cards would be
    awfully time-consuming. We’ll use the idea of a one card shuffle here, with a
    slight twist. Rather lay the selected card on a pile, we will swap it with the
    bottom card in the stack of cards remaining to be shuffled. This takes the selected
    card out of the deck and replaces it with the remaining bottom card. The result
    is the same as if we lay it aside.


    Here’s how the shuffle works with n numbers:


    +   - Start with a list of n consecutive integers.

    - Randomly pick one item from the list. Swap that item with the last item. You
    now have one fewer items in the list to be sorted (called the remaining list),
    or n is now n - 1.

    - Randomly pick one item from the remaining list. Swap it with the bottom of the
    remaining list. Again, your remaining list now has one fewer items.

    - Repeatedly remove one item from the remaining list and swap it with the item
    on the bottom of the remaining list until you run out of items. When done, the
    list will have been replaced with the original list in random order.


    Confusing? Let’s show a simple example with n = 5 (a very small deck of cards).'
