- img_proc: true
  md: 'The form of the declaration we will use is:


    ```

    public static type methodName(argumentList)

    ```


    In this declaration, it says we are defining a method named methodName. The information
    needed by the method is provide in the argumentList (a comma-delimited list of
    variables). The method will return a value of type (if no value is returned type
    is void). We will ignore the keywords public and static.


    Information is passed to the method via the argumentList. Notice in the println
    method, we pass the string to print, in the Math.sqrt function, we pass the number
    to find the square root of, in the inInt method, we pass nothing (that''s okay
    too). The argument list is of the form:


    ```

    type1 varName1, type2 varName2, type3 varName3, ...

    ```


    You can have as many arguments as you like (or none). Information (if any) is
    returned from the method using the return statement:


    ```

    return (returnedValue);

    ```


    This returnedValue is then available to the calling program, either for assignment
    to a variable or for use in some Java expression.'
