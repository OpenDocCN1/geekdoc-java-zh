  md: '# Comments


    You should always follow proper programming rules when writing your Java code.
    One such rule is to properly comment your code. You can place non-executable statements
    (ignored by the computer) in your code that explain what you are doing. These
    **comments** can be an aid in understanding your code. They also make future changes
    to your code much easier.


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_87_0.png)


    To place a comment in your code, use the comment symbol (//). Anything written
    after the comment symbol will be ignored by the computer. You can have a comment
    take up a complete line of Java code like:


    ```

    // Set number of bananas

    numberBananas = 14;

    ```


    Or, you can place the comment on the same line as the assignment statement:


    ```

    numberBananas = 14; // Set number of bananas

    ```


    You can also have a multiple line comment. Start the comment with the symbol (/*)
    and end it with the symbol (*/):


    ```

    /*

    This is a very long comment

    Taking up two entire lines!!

    */

    ```


    You, as the programmer, should decide how much you want to comment your code.
    We will try in the projects provided in this course to provide adequate comments.'
  merge: -1
