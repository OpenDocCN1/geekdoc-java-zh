  md: '# Java - The Third Lesson


    In the Java lesson for this class, we learn about one of the more useful capabilities
    of a computer program - decision making. We will discuss expressions and operators
    used in decisions and how decisions can be made. We will also look at a new Java
    function - the random number generator. Such a function is at the heart of every
    computer game.


    # Logical Expressions


    You may think that computers are quite smart. They appear to have the ability
    to make amazing decisions and choices. Computers can beat masters at chess and
    help put men and women into space. Well, computers really aren''t that smart -
    the only decision making ability they have is to tell if something is true or
    false. But, computers have the ability to make such decisions very quickly and
    that''s why they appear smart (and because, unlike the True or False tests you
    take in school, computers always get the right answer!). To use Java for decision
    making, we write all possible decisions in the form of true or false? statements,
    called logical expressions. We give the computer a logical expression and the
    computer will tell us if that is true or false. Based on that decision, we can
    take whatever action we want in our computer program. Note the result of a logical
    expression is a boolean type value.'
