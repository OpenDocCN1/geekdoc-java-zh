  md: '# Object Erasure


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_337_0.png)


    In the little example we just did, we had to clear the frame (using the **clearRect**
    graphics method) prior to each **drawOval** method. This was done to erase the
    **object** (ball) at its previous location before drawing a new object. This "erase,
    then redraw" process is the secret behind animation. But, what if we are animating
    many objects? The **clearRect** method, as implemented, would clear all objects
    from the frame and require repositioning every object, even ones that haven''t
    moved. This would be a slow, tedious and unnecessary process.


    We will take a more precise approach to erasure. Instead of erasing the entire
    frame before moving an object, we will only erase the rectangular region previously
    occupied by the object. To do this, we will still use the **clearRect** graphics
    method, but with new arguments. We will only erase the area occupied by the object,
    or:


    ```

    myGraphics.clearRect(objectX, objectY, objectW, objectH);

    ```'
