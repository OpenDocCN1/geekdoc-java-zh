  md: '# Comparison Operators


    In the Class 3, we looked at one type of Java operator - arithmetic operators.
    In this class, we introduce the idea of a comparison operator. Comparison operators
    do exactly what they say - they compare two values, with the output of the comparison
    being a boolean value. Thus, the result of the comparison is either true or false.
    Comparison operators allow us to construct logical expressions that can be used
    in decision making. Making


    There are six comparison operators. The first is the "equal to" operator represented
    by two equal (==) signs. This operator tells us if two values are equal to each
    other. Examples are:


    | Comparison | Result |

    |---|---|

    | 6 == 7 | false |

    | 4 == 4 | true |


    A common error (a logic error) in Java is to only use one equal sign for the "equal
    to" operator. Using a single equal sign simply assigns a value to the variable
    making it always true!! Note: you cannot use this operator to compare two String
    variables - we''ll see why after looking at all the comparison operators.


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_143_0.png)'
