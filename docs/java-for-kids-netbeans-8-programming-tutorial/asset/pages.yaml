  md: '# Other Things to Try


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_373_0.png)


    I''m sure as you played the Balloons game, you thought of some changes you could
    make. Go ahead - give it a try! Here are some ideas we have.


    When a balloon pops, it just disappears from the screen. Can you think of a more
    dramatic way to show popping? Maybe flash the frame background color. Give the
    balloons a random color each time a new one appears.


    Add selectivity levels to the game. This could be used to make the game easy for
    little kids and very hard for experts. What can you do to adjust the game difficulty?
    One thing you could do is adjust the size of the popping arrow. To pop a balloon,
    the entire arrow width must fit within the width of a balloon. Hence, a smaller
    (narrower) arrow would make it easier to pop balloons before they reach the bottom
    of the picture box. A larger (wider) arrow makes popping harder. The balloon dropping
    speed also affects game difficulty. Slowly dropping balloons are easy to pop -
    fast ones are not. Play with the game to see what speeds would work for different
    difficulty levels.'
