  md: '# Other Things to Try


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_418_0.png)


    Three adaptations to this project jump out. First, can you think of a way to replay
    a game without rerunning the program? You would need to put all the initialization
    code and game play code in some kind of loop (similar to what we did for some
    projects in this course). Second, there is no logic to detect a win. The players
    must look at the grid and decide if someone has won. See if you can add logic
    to check if there is a winner after each move. The code would be added at the
    end of the existing mousePressed method. This code would see if the symbols in
    the three horizontal directions, three vertical directions or two diagonal directions
    are the same. If so, a win is declared and the game is stopped. Use of such code
    would be elements of the gridMark array - that array has values of 0 for an empty
    space, 1 for an X and 2 for an O.


    The last modification (a much tougher one) would be to program the computer to
    play the game against a human player. You could let the computer have either X''s
    or O''s and use some kind of logic (maybe just random moves for a simple minded
    computer) for the computer to use in generating moves. You would probably want
    another method to determine the computer moves. This is one of the first games
    ever programmed by little Billy Gates!'
