- img_proc: true
  md: '# Variable Names


    You must name every variable you use in your project. Rules for naming variables
    are:


    +   - Can only use letters, numbers, and the underscore (_) character (though
    the underscore character is rarely used).

    - The first character must be a letter.

    - You cannot use a word reserved by Java (for example, you can''t have a variable
    named println or one named System).


    By convention, variable names begin with a lowercase letter. If a variable name
    consists of more than one word, the words are joined together, and each word after
    the first begins with an uppercase letter.


    The most important rule is to use variable names that are meaningful. You should
    be able to identify the information stored in a variable by looking at its name.
    As an example, in your banana buying example, good names would be:


    | Quantity | Variable Name |

    |---|---|

    | Cost of each banana | bananaCost |

    | Number of bananas purchased | numberBananas |

    | Cost of all bananas | totalBananaCost |


    Notice the convention of beginning the variable name with a lower case letter
    and using upper case for each subsequent word in the name.


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_75_0.png)'
  merge: -1
