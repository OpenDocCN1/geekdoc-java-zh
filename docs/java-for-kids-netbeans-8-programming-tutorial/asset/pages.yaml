    We will use Java to draw using **graphics methods**. In this class, we will learn
    to draw lines and rectangles. Before looking at these methods, let''s look at
    how we specify the points used to draw and connect lines. All graphics methods
    use a default **coordinate system**. This means we have a specific way to refer
    to individual points in the graphics object (from *myFrame*, in our example).
