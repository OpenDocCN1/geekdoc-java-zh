  md: '# Assignment Statement


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_80_0.png)


    The simplest, and most widely used, statement in Java is the assignment statement.
    Such a statement appears as:


    ```

    variableName = variableValue;

    ```


    Note that only a single variable can be on the left side of the assignment operator
    (=). Some simple assignment examples using our “banana” variables:


