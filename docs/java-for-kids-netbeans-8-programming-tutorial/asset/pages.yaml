- img_proc: true
  md: 'numeric data to a string before the addition can be done. Then, the plus sign
    separating them acts as a concatenation operator yielding the 3222. To print the
    sum, we need to force the numeric addition by using parentheses:


    ```

    numberBananas = 32;

    numberApples = 22;

    System.out.println("Pieces of fruit " + (numberBananas +

    numberApples));

    ```


    In this case, the two numeric values are summed before being converted to a string
    and you will obtain the desired output of Pieces of fruit 54. So, we see the println
    method offers an easy-to-use way to output both text and numeric information,
    but it must be used correctly.


    Notice one thing about this example. The last line of code looks like it''s two
