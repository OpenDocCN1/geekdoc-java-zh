  md: '# Keyboard Methods


    In Class 8, we looked at ways for a user to interact with a Java GUI project using
    the mouse for input. We studied two mouse events and associated methods: mousePressed
    and mouseDragged. Another input device available for use is the computer keyboard.
    Here we look at keyboard events which give our projects the ability to detect
    user input from the keyboard. Just one keyboard event is studied: the keyPressed
    event, which we will see is very similar to the mousePressed event.


    In a GUI application, many objects can recognize keyboard events. Yet, only the
    object that has focus can receive a keyboard event. When trying to detect a keyboard
    event for a frame, we need to make sure the frame has focus. We can give the frame
    focus by clicking on it with the mouse. But, another way to assign focus with
    the requestFocus method. The format for such a statement is, assuming a frame
    named myFrame:


    ```

    myFrame.requestFocus();

    ```


    This command in Java will give the frame focus, allowing it to recognize keyboard
    events. It has the same effect as clicking on the frame. We use the requestFocus
    method with keyboard events to insure proper execution of each event.'
