    Ace.) We need to develop some type of translation rule. This is done all the time
    in Java. If the number you compute or work with the time does not directly translate
    to information you need, you need to make up rules to do the translation. For
    example, the numbers 1 to 12 are used to represent the months of the year. But,
    these numbers tell us nothing about the names of the month. We need a rule to
    translate each number to a month name.


    We need 13 of each card suit. Hence, an easy rule to decide suit is: cards numbered
    0 - 12 are hearts, cards numbered 13 - 25 are diamonds, cards numbered 26 - 38
    are clubs, and cards numbered 39 - 51 are spades. For card values, lower numbers
    should represent lower cards. A rule that does this for each number in each card
