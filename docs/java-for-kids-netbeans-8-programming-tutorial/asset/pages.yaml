  md: '# Timer Class


    In the Class 8, we saw event methods were executed in a GUI application when the
    user caused some event to happen (usually with the mouse). The Java Timer class
    and any associated Timer object has an interesting feature. It can generate events
    without any input from the user. Timer objects work in your project''s background,
    generating events at time intervals you specify. This event generation feature
    comes in handy for graphics animation where displays need to be updated at regular
    intervals.


    The Timer class is part of something called the Java Swing package. Think of Swing
    as an updated version of the AWT (Abstract Windows Toolkit) used in the previous
    class. Using a Swing timer is simple:


    +   - Import the proper Swing package (javax.swing.Timer)

    - Decide how often you want to generate events; this is the timer''s delay. The
    delay (an int value) is measured in milliseconds. There are 1000 milliseconds
    in one second.

    - Create a timer, and write code for the event method that is to be generated
    every delay milliseconds.


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_305_0.png)


    The first two listed steps are pretty straightforward. Let''s look at how to create
    a Timer and how to add the corresponding event method. It is all done in one line
    of code, similar to code used to add listeners for mouse events. We'
