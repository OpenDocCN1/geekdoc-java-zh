  md: '# Java for Kids


    The first several lines of the program are:


    ```

    /*

    * Welcome Project

    * Java for Kids

    * www.KIDwareSoftware.com

    */

    ```


    These lines are a comment. They simply provide some information about the program
    is and provides some contact information. The comment begins with the symbol /*
    and ends with symbol /*. These lines are also known as a program header. It''s
    a good idea to always put a header on your Java programs to give someone an idea
    of what your program does and who wrote it. The Java compiler ignores any comments
    - their only use is provide explanation.


    The first non-comment line is:


    ```

    package welcome;

    ```


    This is the package name assigned by NetBeans to the folder holding the class
    files. It is typical to use all lower case letters for a package name.


    The next line is:


    This line is the definition of our class named Welcome. The keyword public determines
    if other parts of the program can access this class. Keywords are part of every
    programming language - these are reserved words and cannot be used in any regular
    Java expression. The left curly brace ({) is used to start the definition of the
    class. You will see lots of curly braces are used in Java!'
