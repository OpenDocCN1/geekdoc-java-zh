  md: '# Java Looping Methods


    # Java - The Fourth Lesson (Continued)


    The interlude is over. We finish this class'' Java lesson with a look at a very
    important Java programming concept - the method.


    # Java Methods


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_184_0.png)


    In the looping discussion, we saw how code in one particular block could be repeated
    until some desired condition was met. Many times in Java projects, we might have
    a need to repeat a certain block of code at several different points in the project.
    Why would you want to do this? Say we had a game that requires us to roll 5 dice
    and add up their individual values to yield a sum. What if we needed to do this
    at 10 different places in our project? We could write the code, then copy and
    paste it to the 10 different places. I think you can see problems already. What
    if you need to change the code? You would need to change it in 10 different places.
    What if you needed to put the code in another place in your project? You would
    need to do another ‘copy and paste’ operation. There''s a better way. And that
    way is to use a Java method. A method allows you to write the code to perform
    certain tasks just once. Then, whenever you need to access the code in your project,
    you can “call it,” providing any information it might need to do its tasks. Methods
    are the building blocks of a Java program.'
