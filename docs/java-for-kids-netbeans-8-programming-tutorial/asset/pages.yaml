  md: '# Project 4 - Tic-Tac-Toe


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_406_0.png)


    # Project Design


    In this GUI project, you build a frame where you and someone else can play the
    classic Tic-Tac-Toe game against each other. You take turns marking a 3 x 3 grid
    with X''s and O''s. The computer will monitor play. The game steps:


    +   - Draw grid.

    - Alternate turns, placing X''s and O''s on the grid.

    - Mark grid until someone wins or grid is full.


    All selections on the grid will be made using the mouse. The project you are about
    to build is saved as TicTacToe in the project folder(\JavaKids\JK Code).'
  merge: -1
