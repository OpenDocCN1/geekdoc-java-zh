  md: '# Program Input Methods


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_111_0.png)


    In the example (Sub Sandwich Project) we built in the last class, we established
    variable values in code and ran the program to see the results. The results were
    printed by the Java output method println. If we want to use different values,
    we need to change the code, recompile and rerun. This is a pain! It would be nice,
    in such a program, to allow a user to type in values while the program is running
    and have the computer do the computations based on the inputs. This way no code
    changes or recompiling would be needed to get a new answer. We need such capabilities
    in our programs.


    Java has several methods for input. These methods use the Java Scanner object.
    This object is not built into the basic Java language. It is stored in something
    called a Java API Package. Don''t worry what this means - all you need to know
    is that we need to tell our program that we will be using something from the API
    Package named java.util.Scanner. To do this, we use an import statement:


    ```

    import java.util.Scanner;

    ```


    This statement goes before our program''s class definition header. The class must
    be imported before anything else is done in the program.'
