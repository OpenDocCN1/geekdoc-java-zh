  md: '# Graphic User Interfaces (GUI)


    All the Java projects built in this course have console applications. The computer
    asks you questions, you answer the questions. Because of the simplicity, using
    console applications is a good way to learn the Java programming language. But,
    let''s move on. Most programs in use feature what is called a graphic user interface.
    This is abbreviated GUI and pronounced "gooey." Yes, it is pronounced "gooey."
    In Java, you can build GUI applications that run on your desktop or laptop computer
    or GUI applications that run on the Internet, so-called applets. Console applications
    are text-based. GUI applications are built with frames using controls, such as
    menus, toolbars, buttons, text boxes, selection boxes, scroll bars and other devices
    the user interacts with to operate the program. The primary interaction with these
    controls is via the computer mouse. If you''ve used a computer, you have used
    GUI applications. Examples include video games, spreadsheet programs, word processors,
    Internet browsers, the Windows operating system itself. In each of these applications,
    you would be helpless without your mouse!


    Running (and building) a GUI application is different from a console application.
    In a console application, everything runs sequentially - you are asked a series
    of questions, you provide a series of answers. In a GUI application, the computer
    sits and waits until the user does something - clicks on a menu item, chooses
    an option, types somewhere, moves a scroll bar, etc. We say the application is
    waiting for an event to occur. For this reason, GUI applications are called event-driven.
    When a particular event occurs, the application processes a series of statements
    (Java statements, in our applications) associated with that event. That series
    of statements is called an event method. Yes, this the same kind of method we
    have already using'
  merge: -1
