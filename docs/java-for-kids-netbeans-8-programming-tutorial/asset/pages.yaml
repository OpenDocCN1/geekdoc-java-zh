  md: '# Project Design


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_192_0.png)


    You''ll sell lemonade for five days (simulated days). On each day, you will be
    told the temperature. Based on this temperature, you set a price for your lemonade.
    You will be told how many cups of lemonade you sold and how money you made. The
    steps to follow on each day:


    +   1. Computer picks a random temperature.

    2. You assign a price for each cup of lemonade.

    3. Computer analyzes the information and computes number of cups sold.

    4. Your sales are computed and displayed.


    The first step is a straightforward use of the random number object. In the second
    step, we will use the Scanner nextDouble method to get the price. Step 3 is the
    difficult one - how does the computer determine cups sold? In this project, we
    will give you the code to do this (code made up) in the form of a method you can
    use. This is something done all the time in programming - borrowing and using
    someone''s code. In this method, you provide the temperature and the price (the
    arguments) and the method returns the number of cups sold. Finally, the println
    method will be used to output the results of each day''s sales.'
