    Exception in thread "main" java.lang.ArithmeticException: / by zero

    at Bug.Bug.main(Bug.java:15)

    Java Result: 1

    BUILD SUCCESSFUL (total time: 0 seconds)


    We obtain what is called an **exception** in Java. The exception in this case
    is a divide by zero error (**/ by zero**). And, we are told the problem is in
    line **15**. Such information will help us identify and correct the error.'
