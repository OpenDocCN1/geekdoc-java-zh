  md: '# Project 3 - State Capitals


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_396_0.png)


    # Project Design


    In this project, we build a fun game for home and school. You will be given the
    name of a state in the United States and four possible choices for its capital
    city. You enter the guess of your choice to see if you are right. (We apologize
    to our foreign readers - perhaps you can modify this project to build a similar
    multiple choice type game). The program steps are:


    +   - Initialize program with states and capitals names.

    - For each question, pick a state at random and pick four possible capital cities.

    - Display state and possible choices.

    - Have user enter answer and check for correctness.

    - Answer as as many questions as desired.


    **Scanner** methods and **printin** will be used for user interaction. This project
    is saved as **StateCapitalsProject** in the project folder (\JavaKids\JK Code).'
  merge: -1
  pgno: 396
