    Each balloon will occupy a square region, 50 pixels wide by 50 pixels high. We
    need variable arrays to keep track of each balloon''s color (balloonColor), balloon''s
    location (balloonX, balloonY) and dropping speed (balloonSpeed). The arrow (arrowSize)
