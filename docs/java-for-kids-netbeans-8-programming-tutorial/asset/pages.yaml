  md: "# Examples\n\nA few examples should clarify how the timer control works. It's\
    \ very simple and powerful. To review, here's what happens. If a timer's isRunning()\
    \ property is true (the timer is on), every delay milliseconds, Java will generate\
    \ an event and execute the corresponding actionPerformed event method. No user\
    \ interaction is needed.\n\nThe delay property is the most important timer object\
    \ property. This property is set to the number of milliseconds between timer events.\
    \ A millisecond is 1/1000th of a second, or there are, 1,000 milliseconds in a\
    \ second. If you want to generate N events per second, set the delay to 1000 /\
    \ N. For example, if you want a timer event to occur 4 times per second, use a\
    \ delay of 250. About the lowest practical value for delay is 50 and values that\
    \ differ by 5, 10, or even 20 are likely to produce similar results. It all depends\
    \ on your particular computer. Now, let's try some examples.\n\nStartBeans, open\
    \ your project group and create a new project named TimerTest.java Use this code\
    \ in TimerTest.java (you should see that this code is very similar to the graphics\
    \ project from Class 8 - you might like to try your copy and paste skills:\n\n\
    ```\n/*\n * Timer Test\n * Java for Kids\n */\npackage timertest;\nimport java.awt.*;\n\
    import java.awt.event.*;\nimport javax.swing.Timer;\n\npublic class TimerTest\
    \ extends Frame\n\n```"
