  md: '# Other Things to Try


    Possible changes to the Card Wars project are obvious, but not easy. One change
    would be to have more than two players. Set up three and four player versions.
    Perhaps add another loop to allow playing another game (without restarting the
    application).


    In Card Wars, we stop the game after going through the deck one time. In the real
    card game of War, after the first round, the players pick up the cards they won,
    shuffle them, and play another round. Every time a player uses all the cards in
    their "hand," they again pick up their winnings pile, reshuffle and continue playing.
    This continues until one player has lost all of their cards. Another change to
    Card Wars would be to write code that plays the game with these rules. As we said,
    it''s not easy. You would need to add code to keep track of which cards each player
    won, when they ran out of cards to play, how to reshuffle their remaining cards,
    and new logic to see when a game was over. Such code would use more arrays, more
    for loops, and more variables. If you want a programming challenge, go for it!


    And, while you''re tackling challenges, here''s another. In the usual War game,
    when two cards have the same value - War is declared! This means each player takes
    three cards from their "hand" and lays them face down. Then another card is placed
    face up. The higher card at that time wins all 10 cards! If it''s still a tie,
    there''s another War. Try adding this logic to the game. You''ll need to check
    if a player has enough cards to wage War. Another difficult task, but give it
    a try if you feel adventurous.'
