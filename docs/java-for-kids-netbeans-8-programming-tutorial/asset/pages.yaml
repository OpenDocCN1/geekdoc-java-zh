- img_proc: true
  md: "# Java Looping Methods\n\nexpression is true. Notice, the loop is always executed\
    \ at least once. Somewhere in the loop, expression should be changed to false\
    \ to allow exiting.\n\nLet's look at examples of the do/while loop. What if we\
    \ want to keep adding three to a sum until the value exceeds 50. This loop will\
    \ do it:\n\n```\nsum = 0;\ndo{\n  sum = sum + 3;\n}\nwhile (sum <= 50);\n```\n\
    \n![](img/cc3acf8c58692bbfc65c30ca5a606c09_178_0.png)\n\nOr, another dice example:\n\
    \n```\nsum = 0;\nroll = 0;\ndo{\n  // Roll a simulated die\nsum = sum + random.nextInt(6)\
    \ + 1;\nroll = roll + 1;\n}\nwhile (sum <= 30);\n```\n\nThis loop rolls a simulated\
    \ die while the sum of the rolls does not exceed 30. It also keeps track of the\
    \ number of rolls (roll) needed to achieve this sum.\n\nYou need to decide which\
    \ of the loop structures (while,do/while) fits your project. Recall the major\
    \ difference is that a do/while loop is always executed at least once; a while\
    \ loop may never be executed. And, make sure you can always get out of a loop.\
    \ In both looping structures, this means that, at some point, the checking logical\
    \ expression must become false to allow exiting the loop. When you exit a while\
    \ loop, processing continues at the next Java"
  merge: -1
  pgno: 178
- img_proc: true
  md: "statement after the closing brace. In a do/while loop, processing continues\
    \ after the Java statement after the while statement.\n\nThere is one other way\
    \ to exit a loop. If, at some point in the code block of a loop, you decide need\
    \ to immediately leave the loop, this can be done using a Java break statement.\
    \ When a break statement is encountered, processing is immediately transferred\
    \ to the Java statement following the loop structure. As an example:\n\n```\n\
    sum = 0;\nroll = 0;\ndo{\n  // Roll a simulated die\n  die = myRandom.nextInt(6)\
    \ + 1;\n  if (die == 5) {\n    break;\n  }\n  sum = sum + die;\n  roll = roll\
    \ + 1;\n} while (sum <= 30);\n```\n\nThis is a modified version (new code is shaded)\
    \ of the dice example we just looked at. In this example, the die value is added\
    \ to the sum, unless the die rolls a 5. In that case, the loop is immediately\
    \ exited via a break statement."
  merge: -1
  pgno: 179
- img_proc: true
  md: "# Java Looping Methods 6-7\n\nOne other statement used in loops is the continue\
    \ statement. It is similar to the break statement used except instead of leaving\
    \ the loop, it just tells the computer to skip statements not yet executed in\
    \ the loop and immediately return to the beginning of the loop. In a while loop,\
    \ this means control returns to the while statement. In a do loop, control is\
    \ returned to the do statement.\nWhat if we replace the break with a continue\
    \ in the dice example (modified code is shaded):\n\n```\nsum = 0;\nroll = 0;\n\
    do{\n  // Roll a simulated die\ndie = myRandom.nextInt(6) + 1;\n  if (die == 5)\n\
    {\n    continue;\n  }\n  sum = sum + die;\n  roll = roll + 1;\n} while (sum <=\
    \ 30);\n```\n\nIn this case, if a 5 is rolled (die == 5), that value is just not\
    \ included in the sum (all lines following continue in the do loop are ignored).\
    \ Program control transfers to the do statement. The big difference is that the\
    \ loop continues - that's why it's called continue!\n\n![](img/cc3acf8c58692bbfc65c30ca5a606c09_180_0.png)"
  merge: -1
  pgno: 180
