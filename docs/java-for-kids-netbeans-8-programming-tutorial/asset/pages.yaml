    The array balloonSpeed holds the five speeds, representing the number of pixels
    a balloon will drop with each update of the viewing frame. We want each balloon
    to drop at a different rate. In code, each speed will be computed using:


    ```

    myRandom.nextInt(4) + 3

    ```


    Or, will it be a random value between 3 and 6. A new speed will be computed each
    time a balloon starts its trip down the frame. How do we know this will be a good
    speed, providing reasonable dropping rates? We didn''t before the project began.
    This expression was arrived at by ''trial and error.'' We built the game and tried
    different speeds until we found values that worked. You do this a lot in developing
    games. You may not know values for some numbers before you start. So, you go ahead
    and build the game and try all kinds of values until you find ones that work.
    Then, you build these numbers into your code.'
