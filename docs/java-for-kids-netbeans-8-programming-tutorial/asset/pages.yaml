  md: '# Project - Lemonade Stand


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_191_0.png)


    A very powerful use of computers is to do something called simulation. Before
    building an actual airplane, companies “build” the plane on a computer and simulate
    its performance. This is much cheaper and far safer than testing actual airplanes.
    Engineers simulate how a building might react to an earthquake to help them design
    better buildings. And, businesses use computers to simulate how decisions could
    affect their profits. Based on computer results, they decide how and where to
    invest their money. In this project, we will build a small business simulation.
    We will simulate the operation of a backyard lemonade stand. Based on the temperature,
    the hotter it is, the more you can charge). You will set a selling price for your
    lemonade and tell how many cups you sold and how much money you made. If you’re
    too greedy, asking too much for your product, you won’t sell as much. If you’re
    too nice, you won’t make as much money. It’s a tough world out there! This project
    is saved as Lemonade in the course projects folder (\JavaKids\JK Code).'
