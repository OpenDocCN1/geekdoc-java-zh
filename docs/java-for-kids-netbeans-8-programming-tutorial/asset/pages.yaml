    Now, we''ll see the Java code (a method) that uses one card shuffle to randomly
    sort n consecutive integer values. The method is named nintegers and has a single
    int type argument, being n, the number of integers to shuffle. When, n, the method
    returns the random list of integers in an array of dimension n. Make sure you
    have declared such an array in your calling method. One note - recall arrays in
    Java are zero-based. In the nintegers method, if you ask it to shuffle n consecutive
    integers, the indices on the returned array range from 0 to n - 1 and the randomized
    integers will also range from 0 to n - 1, not 1 to n. If you need integers from
    1 to n, just simply add 1 to each value in the returned list!


