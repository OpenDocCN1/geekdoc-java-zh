  md: '# Creating a Java Program


    Recall from Class 2 that a Java statement does something. In the Welcome example,
    we saw a statement that printed some information ("Welcome to Java for Kids!").  Each
    program we build in this class will be made up of many Java statements for the
    computer to process. Creating a computer program using Java (or any other language)
    is a straightforward process. You have a particular task you would like the computer
    to do for you. You tell the computer in a logical, procedural set of steps to
    accomplish this task.


    It’s relatively easy to write out solution steps to a problem in our language
    (English, in these notes). The difficult part is you have to talk to the computer
    in its own language. It would be nice if we could just write “Hey computer, here’s
    two numbers - add them together and tell me the sum.


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_69_0.png)


    A human might understand these instructions, but a computer won’t. Why? First,
    the computer needs to be told how to do tasks in very specific, logical steps.
    For this little addition example, the steps would be:


    +   1. Give a value to the first number.

    2. Give a value to the second number.

    3. Add the first number to the second number, resulting in the sum, a third number.

    4. Tell me the sum.'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# Your First Java Program 3-3


    Next, we need to talk to the computer in its own language. We translate each solution
    step into a statement (or statements) in the computer''s language. And, in this
    course, the computer''s language is Java. To be able to tell the computer how
    to do any task, you need to have a thorough understanding of the Java language.
    Your understanding of Java will allow you to translate your programming steps
    into a language the computer can understand.


    Another thing to remember as you write Java programs is that you need to be logical
    and exact. A computer will follow your instructions - even if they''re wrong!
    So, as you learn Java, we will emphasize the need to be exact. Once you write
    exact and logical Java code, the computer is very good and fast at doing its job.
    And, it can do some pretty amazing things. Let''s look at a couple of other examples
    of writing out a programming task as a series of steps to illustrate some things
    a computer can do.


    What if your principal asks you to average the test scores of the 352 students
    in your school? Those steps are:


    +   1. Determine the score of each student.

    2. Add up the 352 scores to get a sum.

    3. Divide the sum by 352 to get the average.

    4. Tell your principal the average.


    Not too hard, huh? Notice here that the second step can be further broken down
    into smaller steps. To add up 352 scores, you would:


    +   1. Start with the first score.

    2. Add in the second score, then the third score, then the fourth score, etc.

    3. Stop when all scores have been added.'
