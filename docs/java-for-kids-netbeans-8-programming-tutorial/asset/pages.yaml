    This is a simple project in concept. Using the mouse, you draw colored lines on
    a computer blackboard. A frame will represent the blackboard. We will use rectangles
    drawn along the edge of the frame to choose "chalk" color. Mouse events will control
    the drawing and color selection process. The basic program steps are very simple:


    +   1. Establish frame, add event methods and setup color choice rectangles.

    2. Listen for mouse press, when one is detected, either change the color or initialize
    drawing process.

    3. Listen for mouse dragging. If mouse is dragging, continue drawing line in current
    color.


    We will write code that takes care of all the the initialization steps and write
    code for each of three (windowClosing, mousePressed, mouseDragged) event methods.'
