  md: "# Java Graphics, Mouse Methods\n\n# Class Level Scope Variables\n\nNotice in\
    \ the two mouse events (mousePressed and mouseDragged) that the only information\
    \ available for us is the current mouse position, given by the MouseEvent e. For\
    \ our drawing programs, we will need more information. We will need access to\
    \ the frame object, the last point drawn to, the current drawing color and other\
    \ details. How can we get information into a method that is not available from\
    \ that method's argument list? And, what if we need more than one result (the\
    \ returned value) from a method? We use something called class level scope variables.\
    \ Such variables can be used with any Java method, not just the event methods\
    \ discussed here.\n\nUp to now, we have seen variables with two levels of scope:\
    \ method level scope and loop level scope. Variables with method level scope can\
    \ only be used within the method containing their declarations. Variables with\
    \ loop level scope can only be used in the particular loop with their declaration.\
    \ Variables with class level scope can be used and modified by any method within\
    \ a project (class). To give a variable such scope, it is defined outside the\
    \ methods of a class. Such declarations are customarily placed after the opening\
    \ left brace following the line that declares the class:\n\n```\npublic class\
    \ myClass\n  [Place class level variable declarations here]\n```\n\nVariables\
    \ with class level scope are declared with the same statements used for method\
    \ level scope, with the prefix word static. This is needed because the variables\
    \ will be accessed from static methods. Don't worry too much about needing to\
    \ know what the word static is all about."
  merge: -1
  pgno: 264
- img_proc: true
  md: 'Some examples of declaring variables with class level scope are:


    ```

    static Frame myFrame;

    static int thisInteger;

    static double thisDecimal;

