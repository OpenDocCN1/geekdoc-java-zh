  md: '# Compiling and Running a Java Program


    In the example we just did, we followed two steps to follow to create and run
    a Java program:


    +   * Write the code

    * Run the code


    We see that writing code involves following the established rules (and we''ll
    actually start writing our own code in Class 3). And, we know how to run a program,
    but what exactly is going on when we do this. We''ll look at that now.


    Remember one of the big advantages of Java is that a Java program will run on
    a variety of machines with no changes in the code. We say that Java is **platform-independent**.
    This independence is possible because a Java program does not run directly on
    your computer, but on a ''pretend'' computer installed on your computer with the
    Java Software Development Kit (SDK). This pretend computer is called the **Java
    virtual machine**. Before the Java virtual machine can understand your Java program,
    it must be converted or translated into a language it understands. This conversion
    is done when you **compile** your Java program. Compiling a Java program is done
    automatically before the program can be run. Compiling a Java program creates
    an **object code** file that the Java Virtual Machine can understand. This file
    will have a .class extension. The compile process is:


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_63_0.png)'
  merge: -1
