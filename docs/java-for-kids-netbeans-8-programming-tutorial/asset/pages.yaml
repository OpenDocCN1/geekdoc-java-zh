  md: '# Project -Balloons


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_351_0.png)


    In this class project, we will build a little video game. Colorful balloons are
    dropping from the sky. You maneuver a popping device under them to make them pop
    and get a point. You try to pop as many balloons as you can in one minute. This
    project is saved as Balloons in the projects folder(\Java Kids\JK Code).


    # Project Design


    All of the game action will go on in a frame. There will be five possible balloons,
    all drawn with fillOval methods. An arrow (drawn with the drawLine method) will
    be the “popping arrow.” This arrow will be moved using keys on the keyboard. Clicking
    the frame will control starting and stopping the game. The current score (number
    of balloons popped) will be displayed in the frame. The steps of the project will
    follow:


    +   1. Initialize score and balloon locations; give frame focus.

    2. When frame is clicked, start the timer dropping the balloons.

    3. Monitor keyPressed event for arrow movement.

    4. Monitor timer''s actionPerformed method for collisions and misses - update
    score.


    When writing the code, we will look at each of these steps in more detail.'
