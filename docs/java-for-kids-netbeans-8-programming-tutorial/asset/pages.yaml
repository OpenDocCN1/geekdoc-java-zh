  md: '# Installing the Downloadable Multimedia and Solution Files


    If you purchased this directly from our website you received an email with a special
    and individualized internet download link where you could download the compressed
    Program Solution Files. If you purchased this book through a 3rd Party Book Store
    like Amazon.com, the solutions files for this tutorial are included in a compressed
    ZIP file that is available for download directly from our website (after registration):


    ```

    http://www.kidwaresoftware.com/javakids8-registration.html

    ```


    The online web form at the webpage above with your name, shipping address, email
    address, the exact title of this book, date of purchase, online or physical store,
    and your order confirmation number from that store. After we receive all this
    information we will email you a download link for the multimedia and source code
    solution files associated with this book.


    **Warning:** If you purchased this book "used" or "second hand" you are not licensed
    or entitled to download the Program Solution Files. However, you can purchase
    the Digital Download Version of this book at a highly discounted price which allows
    you access to the digital source code solutions files required for completing
    this tutorial.


    # Installing Java for Kids:


    The code for Java for Kids are included in one or more ZIP files. Use your favorite
    "unzipping" application to write all files to your computer. The course is included
    in the folder entitled JavaKids. The JK Code folder includes all the Java projects
    developed during the course.


    # How To Take the Course:


    Java for Kids is a self-paced course. The suggested approach is to do one class
    a week for ten weeks. Each week''s class should require about 3 to 6 hours of
    your time to grasp the concepts completely. Prior to doing a particular week''s
    work, open the class notes file for that week and print it out. Then, work through
    the notes at your own pace. Try to do each example as they are encountered in
    the notes. Work through the projects in Classes 3 through 10. If you need any
    help, all completed projects are included in the JK Code folder.'
  merge: -1
