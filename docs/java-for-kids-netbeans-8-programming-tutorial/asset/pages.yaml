  md: '# NetBeans- A Java Development Environment


    The process of creating and running a Java program has three distinct steps:


    +   - Type the program

    - Compile the program (generate a file your computer can understand)

    - Run the program.


    Don''t worry too much about what goes on in each of these steps right now. One
    way to complete these three steps is to first type the program using a basic editor
    and save the resulting file. Next, the compile and run steps can be completed
    by typing separate commands to your computer.


    Very few Java programmers write programs in this manner. Nearly all programmers
    develop and run their programs using something called an Integrated Development
    Environment (IDE). There are many IDE’s available for Java development purposes,
    some very elaborate, some very simple. In these notes, we will use an IDE called
    NetBeans. It was installed when you installed Java from the Internet.'
  merge: -1
