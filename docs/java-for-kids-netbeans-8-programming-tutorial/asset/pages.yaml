  md: '# Project 5 - Memory Game


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_419_0.png)


    # Project Design


    In this Java GUI game for little kids, ten squares are used to hide five different
    pairs of shapes. The player chooses two squares on the board and the shapes behind
    them are revealed. If the shapes match, those squares are removed from the board.
    If there is no match, the shapes are recovered and the player tries again. The
    play continues until all five pairs are matched up. The program steps:


    +   * Randomly sort five pairs of shapes.

    * Draw game board.

    * Player selects one square (using mouse) - shape is displayed.

    * Player selects another square - shape is displayed.

    * If match, squares are removed.

    * If no match, squares are restored.

    * Play ends when all matches have been found.


    Selections will be made using the mouse. The game is saved as Memory in the project
    folder (\JavaKids\JK Code).'
