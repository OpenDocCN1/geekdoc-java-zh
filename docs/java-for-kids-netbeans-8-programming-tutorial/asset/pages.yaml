    The actual values assigned to variables here are called literals, since they literally
    show their values.


    You may recognize the assignment operator as the equal sign you use in arithmetic,
    but it’s not called an equal sign in computer programming. Why is that? Actually,
    the right side (variableValue in this example) of the assignment operator is not
    limited to literals. Any legal Java expression, with any number of'
