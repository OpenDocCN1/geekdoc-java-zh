  md: '# Java - The Second Lesson


    We covered a lot of Java in the last class. This was necessary to introduce you
    to many basic concepts so you could write your first project. In this briefer
    second lesson, we look at a way to initialize variables and some mathematical
    functions.


    # Variable Initialization


    In Class 3, we discussed the need to declare every variable used in a Java program.
    The general statement used to declare a variable is:


    type variableName;


    Here we say the variable variableName has been declared as type type. The types
    of variables we looked at are int (whole numbers), double (decimal numbers), boolean
    (true or false values) and String variables. Some examples of variable declarations
    are:


    ```

    int numberLightBulbsPerPack;

    int numberPacks;

    double costOfPack;

    boolean anyBurnedOut;

    String myQuestion;

    ```


    When you declare a variable, it is assigned some location in your computer''s
    memory and given whatever value happens to be at that memory location (some unpredictable
    value). Many times, this is sufficient, as long as you remember to assign a useful
    value to the variable at some point in your'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'code. There are times you may want to assign an initial value to a variable
    when you declare it. It is actually pretty good programming practice to do such
    an initialization, if you happen to know the value (many times you won''t). And,
    there will be times when Java will insist you initialize variables. In these cases,
    it is a simple extension of the declaration above to provide such initialization:


    ```

    type variableName = variableValue;

    ```


    In this declaration and initialization statement, a variable named variableName
    of type type is created and assigned an initial value of variableValue. Make sure
    the value is assigned of proper type. You cannot assign a decimal value to an
    integer variable! These statements are place along with the usual declarations
    at the top of a method to provide local scope.


    Some examples of declaring and initializing variables in a Java program:


    ```

    int numberLightBulbsPerPack = 8;

    int numberPacks = 7;

    double costOfPack = 2.45;

    boolean anyBurnedOut = false;

    String myQuestion = "How many Java programmers does it take to change a light
    bulb";

    ```


    You should see how easy it is to use such statements. You, as a programmer, will
    need to decide when you want to initialize variables and when you don’t.'
