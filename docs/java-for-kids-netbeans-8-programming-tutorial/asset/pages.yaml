  md: '# Run-Time Errors


    ![](img/cc3acf8c58692bbfc65c30ca5a606c09_138_0.png)


    Once you have written your code and eliminated all identified syntax errors, you
    try to run your project. If the project runs, great! But, many times, your project
    may stop and tell you it found an error - this is a run-time error. You need to
    figure out why it stopped and fix the problem. Again, the NetBeans environment
    and Java will usually give you enough information to eliminate run-time errors.
    Let''s look at some examples.


    Change the **anotherInt** declaration to:


    ```

    int anotherInt = 0;

    ```


    Yes, I know we''ll get a divide by zero, but that''s the point here - to illustrate
    potential errors. Try running the program and you should see:


    Output - Bug (run) - Editor

