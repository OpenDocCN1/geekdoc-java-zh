  md: '# Animation


    In an earlier example (the one with the hypnotic ovals), we saw that by using
    a timer to periodically change the display in a frame, a sense of motion, or animation,
    is obtained. We will use that here to do a specific kind of animation - moving
    objects around. This is the basis for nearly every video game made. The objects
    we will move be rectangular regions drawn with some graphics method, rectangles
    and ovals. As you advance in your Java programming, you will find that all graphics
    objects (including pictures) are rectangular, so the information here will apply
    when you learn how to add pictures to a project.


    Moving graphics objects in a frame is easy to do. It is a simple two step process:
    erase it in its previous position, then redraw it in its new position. Successive
    transfers gives the impression of motion, or animation. Where do we put the statements
    implementing this erase-then-draw process? Each object to be moved must have an
    associated timer object. If desired, several objects can use the same timer. The
    “drawing” statement is placed in the corresponding timer object actionPerformed
    event. Whenever a timer event is triggered, the object is erased at its old position
    (by putting a “blank” object in that position, using the clearRect method), a
    new object position is computed and the corresponding graphics method to redraw
    the object is executed. This periodic movement is animation. Let''s look at an
    example to see how simple it really is.'
  merge: -1
