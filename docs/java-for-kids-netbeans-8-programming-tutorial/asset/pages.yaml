  md: "# New Topic - Switch Structure\n\nAn alternative to a complex if structure\
    \ when simply checking the value of a single integer variable is the Java switch\
    \ structure. The parts of the switch structure are:\n\n+   - The switch keyword\n\
    - A controlling integer (short, int or long) variable\n- One or more case statements\
    \ followed by an integer value terminated by a colon (:). After the colon is the\
    \ code to be executed if the variable equals the corresponding value.\n- An optional\
    \ break statement to leave the structure after executing the case code.\n- An\
    \ option default block to execute if none of the preceding case statements have\
    \ been executed.\n\nThe general form for this statement is:\n\n```\nswitch (variable)\n\
    {\n  case value1:\n    [Java code to execute if variable == value1]\n    break;\n\
    \  case value2:\n    [Java code to execute if variable == value2]\n    break;\n\
    .\ndefault:\n    [Java code to execute if no other code has been executed]\n \
    \   break;\n}\n```"
  merge: -1
  pgno: 387
- img_proc: true
  md: "# More Topics, More Projects\n\nIn this example, if variable = value1, the\
    \ first code block is executed. If variable = value2, the second is executed.\
    \ If no subsequent matches between variable and values are found, the code in\
    \ the default block is executed. This code is equivalent to the following if structure:\n\
    \n```\nif (variable == value1)\n  [Java code to execute variable = value1]\nelse\
    \ if (variable == value2)\n  [Java code to execute variable = value2]\nelse\n\
    \  [Java code to execute no other code has been executed]\n```\n\nA couple of\
    \ comments about switch. The break statements, though optional, will almost always\
    \ be there. If a break statement is not seen at the end of a particular case,\
    \ the following case or cases will execute until a break is encountered. This\
    \ is different behavior than seen in if statements, where only one “case” could\
    \ be executed. Second, all the execution blocks in a switch structure are enclosed\
    \ in curly braces, the blocks within each case do not have to have braces (they\
    \ are optional). This is different from most code blocks in Java. Look at the\
    \ use of the switch structure in the dice rolling project to see an example of\
    \ its use."
