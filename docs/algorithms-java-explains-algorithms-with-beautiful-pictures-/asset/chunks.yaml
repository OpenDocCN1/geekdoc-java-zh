    they decided In a suicide method, 11 people are arranged in a circle, and the
    first person reports the number. After each number is reported to the third person,
    the person must commit suicide. Then count again from the next one until everyone
    commits suicide.But Josephus and his friends did not want to obey. Josephus asked
    his friends to pretend to obey, and he arranged the friends with himself. In the
    2th and 7st positions, they escaped this death game.Solution:As long as the array
    is treated as a ring. Fill in a count for each dataless area, until the count
    reaches 11, and then list the array from index 1, you can know that each suicide
    order in this position is the Joseph''s position. The 11-person position is as
    follows:4 10 1 7 5 2 11 9 3 6 8From the above, the last two suicide was in the
    31st and  16th position. The previous oneEveryone died, so they didn''t know that
    Joseph and his friends didn''t follow the rules of the game.![](Image00195.jpg)![](Image00196.jpg)Joseph.java


