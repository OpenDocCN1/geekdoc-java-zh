    \n## 6. 二叉搜索树删除节点\n\n二叉搜索树删除节点：\n1. 无子节点，直接删除。\n2. 如果只有一个子节点，用子节点替换当前节点。\n3. 如果有两个子节点，用右子树中的最小节点替换当前节点。\n\
