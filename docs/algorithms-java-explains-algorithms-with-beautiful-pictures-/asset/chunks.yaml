  trans: "\n\n# 斐波契契\n\n```java\nimport java.util.Scanner;\npublic class Fibonacci\
    \ {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n\
    \        System.out.println(\"Please enter the number of month :\");\n       \
    \ int number = sc.nextInt();\n        for (int i = 1; i <= number; i++) {\n  \
    \          System.out.println(i + \" month：\" + fibonacci(i));\n        }\n  \
    \  }\n    public static int fibonacci(int n) {\n        if (n == 1 || n == 2)\
    \ {\n            return 1;\n        } else {\n            return fibonacci(n -\
    \ 1) + fibonacci(n - 2);\n        }\n    }\n}\n```\n\nResult：\nPlease enter the\
    \ number of month :7\n1 month： 1\n2 month： 1\n3 month： 2\n4 month： 3\n5 month：\
    \ 5\n6 month： 8\n7 month： 13\n\n# Dijkstra\n\n三色旗帜最初是由 E.W. Dijkstra 提出的，他使用了荷兰国旗（Dijkstra\
    \ 是荷兰人）。假设有一根系着红、白、蓝旗帜的绳子。起初绳子上的所有旗帜都没有顺序。你需要将它们按照 蓝色 -> 白色 -> 红色的顺序进行排列。如何用最少的次数移动它们？你只需要在绳子上操作，且每次只交换两个旗帜。\n\
    \n![](img/Image00186.jpg)\n\n### 解决方案：\n使用字符数组存储旗帜。例如，`b`、`w` 和 `r` 分别表示蓝色、白色和红色旗帜的位置。数组\
    \ `b` 和 `w` 的开头是 0，而 `r` 位于数组末尾。\n1. 如果 `w` 的位置是蓝色旗帜，则交换 `[w]` 和 `[b]`。并将 `whiteIndex`\
    \ 和 `b` 向后移动 1 位。\n2. 如果 `w` 的位置是白色旗帜，则 `w` 向后移动 1 位。\n3. 如果 `w` 的位置是红色旗帜，则交换\
    \ `[w]` 和 `[r]`。`r` 向前移动 1 位。\n\n最后，`b` 前面的旗帜都是蓝色的，`r` 后面的旗帜都是红色的。\n\n### 图解解\n\
    ![](img/Image00187.jpg)\n![](img/Image00188.jpg)\n\n### Dijkstra.java\n```java\n\
    import java.util.Scanner;\npublic class Dijkstra {\n    public static void main(String[]\
    \ args) {\n        char [] flags = { 'R', 'B', 'W', 'B', 'R', 'W' };\n       \
    \ int b = 0, w = 0, r = flags.length - 1;\n        int count = 0;\n        while\
    \ (w <= r) {\n            if (flags[w] == 'W') {\n                w++;\n     \
    \       } else if (flags[w] == 'B') {\n                char temp = flags[w];\n\
    \                flags[w] = flags[b];\n                flags[b] = temp;\n    \
    \            w++;\n                b++;\n                count++;\n          \
    \  } else if (flags[w] == 'R') {\n                char m = flags[w];\n       \
    \         flags[w] = flags[r];\n                flags[r] = m;\n              \
    \  r--;\n                count++;\n            }\n        }\n        for (int\
    \ i = 0; i < flags.length ; i++) {\n            System.out.print(flags[i]);\n\
    \        }\n        System.out.print(\"\\nThe total exchange count : \" + count);\n\
    \    }\n}\n```\n\nResult：\nBBWWRR\nThe total exchange count : 4\n\n# 老鼠迷宫\n\n\
    老鼠迷宫是一种基础的递归解决方案。我们使用二维数组中的 `2` 表示墙，用 `1` 表示老鼠的路径，并尝试找到入口到出口的路径。\n\n### 解决方案：\n\
    老鼠向四个方向移动：上、左、下、右。如果遇到墙，则返回并选择下一个前进方向，因此测试数组中的四个方向，直到老鼠到达出口。\n\n### 图解解\n![](img/Image00189.jpg)\n\
    ![](img/Image00190.jpg)\n\n### MouseWalkingMaze.java\nResult：\n![](img/Image00191.jpg)\n\
    \n# 八硬币\n\n有八枚外观相同的硬币，其中一枚是假币，假币的重量与真币不同，但不知道假币是比真币轻还是重。请设计一种高效的算法来检测这个假币。\n\n\
    ### 解决方案：\n从八枚硬币中取出六枚 `a`、`b`、`c`、`d`、`e`、`f`，并将三枚放在天平上比较。假设 `a, b, c` 放在一边，`d,\
    \ e, f` 放在另一边。\n1. `a + b + c > d + e + f`\n2. `a + b + c = d + e + f`\n3. `a\
    \ + b + c < d + e + f`\n\n如果 `a + b + c > d + e + f`，则六枚币中有一枚假币，而 `g, h` 是真币。此时，可以从两边各移除一枚硬币。假设移除\
    \ `c` 和 `f`。同时在每边替换一个硬币。假设交换 `b` 和 `e` 然后进行第二次比较。还有三种可能性：\n1. `a + e > d + b`：假币在\
    \ `a` 或 `d` 之中，只要用真币 `h` 比较 `a` 就能找到假币。如果 `a > h`，则 `a` 是重币；如果 `a = h`，则 `d` 是轻币。\n\
    2. `a + e = d + b`：假币在 `c` 或 `f` 之中，用真币 `h` 比较 `c`。如果 `c > h`，则 `c` 是重币；如果 `c\
    \ = h`，则 `f` 是轻币。\n3. `a + e < d + b`：`b` 或 `e` 是可能是假币，同样使用真币 `h` 比较 `b`，如果 `b\
    \ > h`，则 `b` 是重币；如果 `b = h`，则 `e` 是轻币。\n\n### 图解解\n![](img/Image00192.jpg)\n![](img/Image00193.jpg)\n\
    ![](img/Image00194.jpg)\n\n### EightCoins.java\n```java\nimport java.util.Random;\n\
    import java.util.Scanner;\npublic class EightCoins {\n    public static void compare(int\
    \ coins[], int i, int j, int k) {\n        if (coins[i] > coins[j] && coins[i]\
    \ > coins[k]) {\n            System.out.println(\"\\nCounterfeit currency \" +\
    \ (i + 1) + \" is heavier \");\n        } else {\n            System.out.println(\"\
    \\nCounterfeit currency \" + (j + 1) + \" is lighter \");\n        }\n    }\n\
    \    public static void eightcoins(int coins[]) {\n        if (coins[0] + coins[1]\
    \ + coins[2] == coins[3] + coins[4] + coins[5]) {\n            if (coins[6] >\
    \ coins[7]) {\n                compare(coins, 6, 7, 0);\n            } else {\n\
    \                compare(coins, 7, 6, 0);\n            }\n        } else if (coins[0]\
    \ + coins[1] + coins[2] > coins[3] + coins[4] + coins[5]) { // 原文逻辑冗余\n      \
    \          // ... unreachable based on if\n            }\n            if (coins[0]\
    \ + coins[1] + coins[2] == coins[3] + coins[4] + coins[5]) {\n               \
    \ compare(coins, 2, 5, 0);\n            } else if (coins[0] + coins[1] + coins[2]\
    \ > coins[3] + coins[4] + coins[5]) {\n                compare(coins, 0, 4, 1);\n\
    \            }\n            // 注意：提供的原始逻辑包含矛盾的 if 语句，\n            // 我保留了文中提供的结构。\n\
    \        } else if (coins[0] + coins[1] + coins[2] < coins[3] + coins[4] + coins[5])\
    \ {\n            compare(coins, 4, 0, 1);\n        }\n    }\n    public static\
    \ void main(String[] args) {\n        int coins[] = new int [8];\n        for\
    \ (int i = 0; i < 8; i++) coins[i] = 10;\n        System.out.println(\"Enter weight\
    \ of counterfeit currency (larger or smaller than 10) :\");\n        Scanner sc\
    \ = new Scanner(System.in);\n        Random rn = new Random();\n        coins[rn.nextInt(8)]\
    \ = sc.nextInt();\n        eightcoins(coins);\n        for (int i = 0; i < 8;\
    \ i++) {\n            System.out.print(coins[i] + \" , \");\n        }\n    }\n\
    }\n```\n\nResult：\nFirst run：\nEnter weight of counterfeit currency (larger or\
    \ smaller than 10) : 2\nCounterfeit currency 2 is lighter\n10 , 2 , 10 , 10 ,\
    \ 10 , 10 , 10 , 10 ,\nRun again：\nEnter weight of counterfeit currency (larger\
    \ or smaller than 10) : 13\nCounterfeit currency 4 is heavier\n10 , 10 , 10 ,\
    \ 13 , 10 , 10 , 10 , 10 ,\n\n# 背包问题\n\n假设你有一个重量限制为 8 kg 的背包，你想装入总价值最高的商品，假设水果如下（ID、名称、价格和重量）：\n\
    \n| ID | Name | Price | Weight |\n| :--- | :--- | :--- | :--- |\n| 0 | Plum |\
    \ 4kg | 4500 |\n| 1 | Apple | 5kg | 5700 |\n| 2 | Orange | 2kg | 2250 |\n| 3 |\
    \ Strawberry | 1kg | 1100 |\n| 4 | Melon | 6kg | 6700 |\n\n### 解决方案：\n为了解决这个优化问题，可以使用动态规划。开始时有一个空集，每添加一个元素，寻找该阶段的最解，直到所有元素都添加。最后可以得到最优解。\n\
    有两个数组，`value` 和 `item`：\n`value`：当前最优解的总价格。\n`item`：背包中的最后一个水果。\n有 8 个重量从 1 到\
    \ 8 的背包，为每个背包寻找最优解。\n\n逐渐将水果放入背包寻找最优解：\n1. 放入李子：\n\n| Weight of Backpack | 1kg\
    \ | 2 kg | 3 kg | 4 kg | 5 kg | 6 kg | 7 kg | 8 kg |\n| :--- | :--- | :--- | :---\
    \ | :--- | :--- | :--- | :--- | :--- |\n| Value | 0 | 0 | 0 | 4500 | 4500 | 4500\
    \ | 4500 | 9000 |\n| Item | - | - | - | 0 | 0 | 0 | 0 | 0 , 0 |\n| Name | - |\
    \ - | - | Plum | Plum | Plum | Plum | 2* Plum |\n\n2. 放入苹果：\n\n| Weight of Backpack\
    \ | 1kg | 2 kg | 3 kg | 4 kg | 5 kg | 6 kg | 7 kg | 8 kg |\n| :--- | :--- | :---\
    \ | :--- | :--- | :--- | :--- | :--- | :--- |\n| Value | 0 | 0 | 0 | 4500 | 5700\
    \ | 5700 | 5700 | 9000 |\n| Item | - | - | - | 0 | 1 | 1 | 1 | 0 , 0 |\n\n"
