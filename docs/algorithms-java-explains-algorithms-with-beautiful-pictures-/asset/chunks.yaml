    草莓 1100\n橙子 2250\n苹果 5700\n总计 9050\n\n# 约瑟夫问题\n有 9 个犹太人和约瑟夫及其朋友躲在一个洞里。这 9 个犹太人宁愿死也不愿被敌人抓住，于是他们决定了一种自杀方法：11\
    \ 个人围成一个圈，由第一个开始数数。每当数到第三个人个人时，那个人必须自杀。然后从下一个人开始重新计数，直到所有人都自杀。\n\n但约瑟夫和他的朋友们不想服从。约瑟夫让朋友们假装服从，并他和朋友们一起进行了安排。在第\
    \ 2 和第 7 个位置，他们逃脱了这场死亡游戏。\n\n**解决方案：**\n只要将数组视为一个环形。在每个空白区域填充计数，直到计数达到 11，然后从索引\
    \ 1 开始列出数组，你就可以知道每个位置的自杀顺序就是约瑟夫的位置。11 个人的位置如下：4 10 1 7 5 2 11 9 3 6 8。\n\n根据上述，最后两次自杀发生在第\
