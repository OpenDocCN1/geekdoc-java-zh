    Item Price\nStrawberry 1100\nOrange 2250\nApple 5700\nTotal 9050\n\n# Josephus\
    \ Problem\nThere are 9 Jewish hid in a hole with Josephus and his friends . The\
    \ 9 Jews decided to die rather than be caught by the enemy, so they decided In\
    \ a suicide method, 11 people are arranged in a circle, and the first person reports\
    \ the number. After each number is reported to the third person, the person must\
    \ commit suicide. Then count again from the next one until everyone commits suicide.\n\
    \nBut Josephus and his friends did not want to obey. Josephus asked his friends\
    \ to pretend to obey, and he arranged the friends with himself. In the 2th and\
    \ 7st positions, they escaped this death game.\n\n**Solution:**\nAs long as the\
    \ array is treated as a ring. Fill in a count for each dataless area, until the\
    \ count reaches 11, and then list the array from index 1, you can know that each\
    \ suicide order in this position is the Joseph's position. The 11-person position\
    \ is as follows: 4 10 1 7 5 2 11 9 3 6 8.\n\nFrom the above, the last two suicide\
    \ was in the 31st and 16th position. The previous one Everyone died, so they didn't\
    \ know that Joseph and his friends didn't follow the rules of the game.\n\n![](Image00195.jpg)![](Image00196.jpg)\n\
    \n`Joseph.java`\n\n```java\nimport java.util.Scanner;\npublic class Joseph {\n\
    \    private static final int N = 11;\n    private static final int M = 3;\n \
