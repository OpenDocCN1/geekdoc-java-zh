- fmt: "\n![](Image00000.jpg)\n\n# Algorithms Java\n\n![](Image00002.jpg)\n\nSimple\
    \ is the beginning of wisdom. From the essence of practice, this book to briefly\
    \ explain the concept and vividly cultivate programming interest, you will learn\
    \ it easy, fast and well. [http://en.verejava.com](http://en.verejava.com)\n\n\
    Copyright © 2020 Yang Hu All rights reserved. ISBN : 9798657092882\n\n## CONTENTS\n\
    \n1. [Linear Table Definition]\n2. [Maximum Value]\n3. [Bubble Sorting Algorithm]\n\
    4. [Minimum Value]\n5. [Select Sorting Algorithm]\n6. [Linear Table Append]\n\
    7. [Linear Table Insert]\n8. [Linear Table Delete]\n9. [Insert Sorting Algorithm]\n\
    10. [Reverse Array]\n11. [Linear Table Search]\n12. [Dichotomy Binary Search]\n\
    13. [Shell Sorting]\n14. [Single Link]\n    - 14.1 [Create and Initialization]\n\
    \    - 14.2 [Add Node]\n    - 14.3 [Insert Node]\n    - 14.4 [Delete Node]\n15.\
    \ [Doubly Linked List]\n    - 15.1 [Create and Initialization]\n    - 15.2 [Add\
    \ Node]\n    - 15.3 [Insert Node]\n    - 15.4 [Delete Node]\n16. [One-way Circular\
    \ LinkedList]\n    - 16.1 [Initialization and Traversal]\n    - 16.2 [Insert Node]\n\
    \    - 16.3 [Delete Node]\n17. [Two-way Circular LinkedList]\n    - 17.1 [Initialization\
    \ and Traversal]\n    - 17.2 [Insert Node]\n    - 17.3 [Delete Node]\n18. [Queue]\n\
    19. [Stack]\n20. [Recursive Algorithm]\n21. [Quick Sorting]\n22. [Two-way Merge\
    \ Algorithm]\n23. [Binary Search Tree]\n    - 23.1 [Construct a binary search\
    \ tree]\n    - 23.2 [Binary search tree In-order traversal]\n    - 23.3 [Binary\
    \ search tree Pre-order traversal]\n    - 23.4 [Binary search tree Post-order\
    \ traversal]\n    - 23.5 [Binary search tree Maximum and minimum]\n    - 23.6\
    \ [Binary search tree Delete Node]\n24. [Binary Heap Sorting]\n25. [Hash Table]\n\
    26. [Graph]\n    - 26.1 [Directed Graph and Depth-First Search]\n    - 26.2 [Directed\
    \ Graph and Breadth-First Search]\n    - 26.3 [Directed Graph Topological Sorting]\n\
    27. [Towers of Hanoi]\n28. [Fibonacci]\n29. [Dijkstra]\n30. [Mouse Maze]\n31.\
    \ [Eight Coins]\n32. [Knapsack Problem]\n33. [Josephus Problem]\n\n---\n\n## Linear\
    \ Table Definition\n\nLinear Table: Sequence of elements, is a one-dimensional\
    \ array.\n1. Define a one-dimensional array of student scores ![](Image00003.jpg)\n\
    \n**TestOneArray.java**\n```java\npublic class OneArray {\n    public static void\
    \ main(String[] args) {\n        int [] scores = { 90, 70, 50, 80, 60, 85 };\n\
    \        for (int i = 0; i < scores.length; i++) {\n            System.out.print(scores[i]\
    \ + \",\"\n        }\n    }\n}\n```\nResult: `90,70,50,80,60,85`\n\n---\n\n##\
    \ Maximum Value\n\nMaximum Value of Integer Sequences:![](Image00004.jpg)\n1.\
    \ Algorithmic ideas: Initial value `minIndex=0`, `j=1`. Compare `arrays[minIndex]`\
    \ with `arrays[j]`. If `arrays[minIndex] > arrays[j]` then `minIndex=j`, `j++`\
    \ else `j++`. Continue until the last number, `arrays[minIndex]` is the maximum.\n\
    \n**TestMaxValue.java**\n```java\npublic class MaxValue {\n    public static void\
    \ main(String[] args) {\n        int [] scores = { 60, 50, 95, 80, 70 };\n   \
    \     int maxValue = max(scores);\n        System.out.println(\"Max Value = \"\
    \ + maxValue);\n    }\n    public static int max(int [] arrays) {\n        int\
    \ minIndex = 0; // Maximum value is 0\n        for (int i = 0; i < arrays.length\
    \ - 1; i++) {\n            if (arrays[i] > arrays[i + 1]) { // swap\n        \
    \        int temp = arrays[i];\n                arrays[i] = arrays[i + 1];\n \
    \               arrays[i + 1] = temp;\n            }\n        }\n        int maxValue\
    \ = arrays[arrays.length - 1];\n        return maxValue;\n    }\n}\n```\nResult:\
    \ `Max Value = 95`\n\n---\n\n## Bubble Sorting Algorithm\n\nBubble Sorting Algorithm:\
    \ Compare `arrays[j]` with `arrays[j+1]`, if `arrays[j] > arrays[j+1]` are exchanged.\
    \ Remaining elements repeat this process until sorting is completed. Sort the\
    \ following numbers from small to large ![](Image00006.jpg)\n\nExplanation:![](Image00007.jpg)\
    \ No sorting,![](Image00008.jpg) Already sorted.\n1. First sorting:![](Image00010.jpg)\n\
    2. Second sorting:![](Image00011.jpg)\n3. Third sorting:![](Image00012.jpg)\n\
    No swap so terminate sorting: we can get the sorting numbers from small to large\
    \ ![](Image00013.jpg)\n\n**TestBubbleSort.java**\n```java\npublic class BubbleSort\
    \ {\n    public static void main(String[] args) {\n        int [] scores = { 60,\
    \ 50, 95, 80, 70 };\n        sort(scores);\n        for (int i = 0; i < scores.length;\
    \ i++) {\n            System.out.print(scores[i] + \",\")\n        }\n    }\n\
    \    public static void sort(int [] arrays) {\n        for (int i = 0; i < arrays.length\
    \ - 1; i++) {\n            boolean isSwap = false;\n            for (int j = 0;\
    \ j < arrays.length - i - 1; j++) {\n                if (arrays[j] > arrays[j\
    \ + 1]) { //swap\n                    int temp = arrays[j];\n                \
    \    arrays[j] = arrays[j + 1];\n                    arrays[j + 1] = temp;\n \
    \                   isSwap = true;\n                }\n            }\n       \
    \     if (!isSwap) // No swap so terminate sorting\n                break;\n \
    \           }\n        }\n    }\n}\n```\nResult: `50,60,70,80,95`\n\n---\n\n##\
    \ Minimum Value\n\nSearch the Minimum of Integer Sequences:![](Image00014.jpg)\n\
    1. Algorithmic ideas: Initial value `minIndex=0`, `j=1`. Compare `arrays[minIndex]`\
    \ with `arrays[j]`. If `arrays[minIndex] > arrays[j]` then `minIndex=j`, `j++`\
    \ else `j++`. Continue until the last number, `arrays[minIndex]` is the Min Value.\n\
    \n**TestMinValue.java**\n```java\npublic class MinValue {\n    public static void\
    \ main(String[] args) {\n        int [] scores = { 60, 80, 95, 50, 70 };\n   \
    \     int minValue = min(scores);\n        System.out.println(\"Min Value = \"\
    \ + minValue);\n    }\n    public static int min(int [] arrays) {\n        int\
    \ minIndex = 0; // the index of the minimum\n        for (int j = 1; j < arrays.length;\
    \ j++) {\n            if (arrays[minIndex] > arrays[j]) {\n                minIndex\
    \ = j;\n            }\n        }\n        return arrays[minIndex];\n    }\n}\n\
    ```\nResult: `Min Value = 50`\n\n---\n\n## Select Sorting Algorithm\n\nSelect\
    \ Sorting Algorithm: Sorts an array by repeatedly finding the minimum element\
    \ from unsorted part and putting it at the beginning. Sort the following numbers\
    \ from small to large ![](Image00016.jpg)\n\nExplanation:![](Image00017.jpg) No\
    \ sorting,![](Image00018.jpg) Comparing,![](Image00019.jpg) Already sorted.\n\
    1. First sorting:![](Image00020.jpg)\n2. Second sorting:![](Image00021.jpg)\n\
    3. Third sorting:![](Image00022.jpg)\n4. Forth sorting:![](Image00023.jpg)\nwe\
    \ can get the sorting numbers from small to large ![](Image00024.jpg)\n\n**TestSelectSort.java**\n\
    ```java\npublic class TestSelectSort {\n    public static void main(String[] args)\
    \ {\n        int [] scores = { 60, 80, 95, 50, 70 };\n        sort(scores);\n\
    \        for (int score : scores) {\n            System.out.print(score + \",\"\
    )\n        }\n    }\n    public static void sort(int [] arrays) {\n        for\
    \ (int i = 0; i < arrays.length - 1; i++) {\n            int minIndex = i; //\
    \ the index of the selected minimum\n            for (int j = i + 1; j < arrays.length;\
    \ j++) {\n                if (arrays[minIndex] > arrays[j]) {\n              \
    \      minIndex = j;\n                }\n            }\n            if (i != minIndex)\
    \ // minimum arrays[i] is swaped with the arrays[minIndex]\n                int\
    \ temp = arrays[i];\n                arrays[i] = arrays[minIndex];\n         \
    \       arrays[minIndex] = temp;\n            }\n        }\n    }\n}\n```\nResult:\
    \ `50,60,70,80,95`\n\n---\n\n## Linear Table Append\n\n1. Add a score 75 to the\
    \ end of the one-dimensional array scores.![](Image00025.jpg)\n\nAnalysis:\n1.\
    \ First create a temporary array `tempArray` larger than the original scores array\
    \ length\n2. Copy each value of the scores to `tempArray`\n3. Assign 75 to the\
    \ last index position of `tempArray`\n4. Finally assign the `tempArray` pointer\
    \ reference to the original `scores`;**TestOneArrayAppend.java**\n"
