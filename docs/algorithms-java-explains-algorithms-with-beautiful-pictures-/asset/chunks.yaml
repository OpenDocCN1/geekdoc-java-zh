    \ BinaryTree {\n    private Node root;\n\n    public Node getRoot() {\n      \
    \  return root;\n    }\n\n    // Post-order traversal binary search tree\n   \
    \ public void postOrder(Node root) {\n        if (root == null) {\n          \
    \  return;\n        }\n        postOrder(root.left); // Recursive Traversing the\
    \ left subtree\n        postOrder(root.right); // Recursive Traversing the right\
    \ subtree\n        System.out.print(root.getData() + \", \");\n    }\n\n    public\
    \ void insert(Node node, int newData) {\n        if (this.root == null) {\n  \
    \          this.root = new Node(newData, null, null);\n            return;\n \
    \       }\n        int compareValue = newData - node.getData();\n        //Recursive\
    \ left subtree, continue to find the insertion position\n        if (compareValue\
    \ < 0) {\n            if (node.left == null) {\n                node.left = new\
