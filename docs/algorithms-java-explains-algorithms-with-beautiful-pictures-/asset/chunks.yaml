  trans: "\n\n![](img/Image00000.jpg)\n\n# Java 算法\n\n![](img/Image00002.jpg)\n\n\
    简单是智慧的开始。通过实践的精髓，本书将简要解释概念并生动地培养编程兴趣，你将轻松、快速且良好地学会它。[`en.verejava.com`](http://en.verejava.com)\n\
    \nCopyright © 2020 杨华 版权所有。ISBN : 9798657092882\n\n## 目录\n\n1. [线性表定义]\n2. [最大值]\n\
    3. [冒排序算法]\n4. [最小值]\n5. [选择排序算法]\n6. [线性表追加]\n7. [线性表插入]\n8. [线性表删除]\n9. [插入排序算法]\n\
    10. [数组反转]\n11. [线性表查找]\n12. [二分查找]\n13. [柯莎排序]\n14. [单链表]\n    - 14.1 [创建与初始化]\n\
    \    - 14.2 [添加节点]\n    - 14.3 [插入节点]\n    - 14.4 [删除节点]\n15. [双链表]\n    - 15.1\
    \ [创建与初始化]\n    - 15.2 [添加节点]\n    - 15.3 [插入节点]\n    - 15.4 [删除节点]\n16. [单向循环链表]\n\
    \    - 16.1 [初始化与遍历]\n    - 16.2 [插入节点]\n    - 16.3 [删除节点]\n17. [双向循环链表]\n   \
    \ - 17.1 [初始化与遍历]\n    - 17.2 [插入节点]\n    - 17.3 [删除节点]\n18. [队列]\n19. [栈]\n20.\
    \ [递归算法]\n21. [快速排序]\n22. [双向合并算法]\n23. [二叉搜索树]\n    - 23.1 [构建二叉搜索树]\n    - 23.2\
    \ [二叉搜索树中序遍历]\n    - 23.3 [二叉搜索树前序遍历]\n    - 23.4 [二叉搜索树后序遍历]\n    - 23.5 [二叉搜索树最大与最小值]\n\
    \    - 23.6 [二叉搜索树删除节点]\n24. [二叉堆排序]\n25. [哈希表]\n26. [图]\n    - 26.1 [有向图与深度搜索]\n\
    \    - 26.2 [有向图与广度搜索]\n    - 26.3 [有向图拓扑排序]\n27. [汉诺塔]\n28. [斐波那契数列]\n29. [Dijkstra\
    \ 算法]\n30. [老鼠迷宫]\n31. [八数游戏]\n32. [背包问题]\n33. [约瑟夫问题]\n\n---\n\n## 线性表定义\n\n\
    线性表：元素的序列，是一个一维数组。\n1. 定义一个学生成绩的一维数组 ![](img/Image00003.jpg)\n\n**TestOneArray.java**\n\
    ```java\npublic class OneArray {\n    public static void main(String[] args) {\n\
    \        int [] scores = { 90, 70, 50, 80, 60, 85 };\n        for (int i = 0;\
    \ i < scores.length; i++) {\n            System.out.print(scores[i] + \",\"\n\
    \        }\n    }\n}\n```\n结果：`90,70,50,80,60,85`\n\n---\n\n## 最大值\n\n整数序列的最大值：![](img/Image00004.jpg)\n\
    1. 算法思想：初始值 `minIndex=0`，`j=1`。比较 `arrays[minIndex]` 与 `arrays[j]`。如果 `arrays[minIndex]\
    \ > arrays[j]` 则 `minIndex=j`，`j++`；否则 `j++`。持续到最后一个数字，`arrays[minIndex]` 即为最大值。\n\
    \n**TestMaxValue.java**\n```java\npublic class MaxValue {\n    public static void\
    \ main(String[] args) {\n        int [] scores = { 60, 50, 95, 80, 70 };\n   \
    \     int maxValue = max(scores);\n        System.out.println(\"Max Value = \"\
    \ + maxValue);\n    }\n    public static int max(int [] arrays) {\n        int\
    \ minIndex = 0; // 最大值是 0\n        for (int i = 0; i < arrays.length - 1; i++)\
    \ {\n            if (arrays[i] > arrays[i + 1]) { // 交换\n                int temp\
    \ = arrays[i];\n                arrays[i] = arrays[i + 1];\n                arrays[i\
    \ + 1] = temp;\n            }\n        }\n        int maxValue = arrays[arrays.length\
    \ - 1];\n        return maxValue;\n    }\n}\n```\n结果：`Max Value = 95`\n\n---\n\
    \n## 冒排序算法\n\n冒排序算法：比较 `arrays[j]` 与 `arrays[j+1]`，如果 `arrays[j] > arrays[j+1]`\
    \ 则进行交换。剩余元素重复此过程直到排序完成。将数字从小到大排序 ![](img/Image00006.jpg)\n\n解释：![](img/Image00007.jpg)\
    \ 已经排序 ![](img/Image00008.jpg)\n1. 第一次排序：![](img/Image0010.jpg)\n2. 第二次排序：![](img/Image0011.jpg)\n\
    3. 第三次排序：![](img/Image0012.jpg) 未交换则停止排序：可以得到从小到大的排序 ![](img/Image0013.jpg)\n\n\
    **TestBubbleSort.java**\n```java\npublic class BubbleSort {\n    public static\
    \ void main(String[] args) {\n        int [] scores = { 60, 50, 95, 80, 70 };\n\
    \        sort(scores);\n        for (int i = 0; i < scores.length; i++) {\n  \
    \          System.out.print(scores[i] + \",\")\n        }\n    }\n    public static\
    \ void sort(int [] arrays) {\n        for (int i = 0; i < arrays.length - 1; i++)\
    \ {\n            boolean isSwap = false;\n            for (int j = 0; j < arrays.length\
    \ - i - 1; j++) {\n                if (arrays[j] > arrays[j + 1]) { // 交换\n  \
    \                  int temp = arrays[j];\n                    arrays[j] = arrays[j\
    \ + 1];\n                    arrays[j + 1] = temp;\n                    isSwap\
    \ = true;\n                }\n            }\n            if (!isSwap) // 未交换则停止排序\n\
    \                break;\n            }\n        }\n    }\n}\n```\n结果：`50,60,70,80,95`\n\
    \n---\n\n## 最小值\n\n整数序列的最小值：![](img/Image0014.jpg)\n1. 算法思想：初始值 `minIndex=0`，`j=1`。比较\
    \ `arrays[minIndex]` 与 `arrays[j]`。如果 `arrays[minIndex] > arrays[j]` 则 `minIndex=j`，`j++`；否则\
