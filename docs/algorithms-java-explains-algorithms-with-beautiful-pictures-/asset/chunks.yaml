  trans: "\n\n# 堆排序实现\n\n```java\npublic class HeapSort {\n    private int [] array;\
    \ // 初始化堆\n    public void createHeap(int [] array) {\n        this.array = array;\
    \ // 构建堆，(array.length - 1) / 2 扫描一半具有子节点的节点\n        for (int i = (array.length\
    \ - 1) / 2; i >= 0; i--) {\n            adjustHeap(i, array.length - 1);\n   \
    \     }\n    }\n\n    // 调整堆\n    public void adjustHeap(int currentIndex, int\
    \ maxLength) {\n        int noLeafValue = array[currentIndex]; // 当前非叶子节点\n  \
    \      // 2 * currentIndex + 1 当前左子树下标\n        for (int j = 2 * currentIndex\
    \ + 1; j <= maxLength; j = currentIndex * 2 + 1) {\n            if (j < maxLength\
    \ && array[j] < array[j + 1]) {\n                j++; // j 大下标\n            }\n\
    \            if (noLeafValue >= array[j]) {\n                break ;\n       \
    \     }\n            array[currentIndex] = array[j]; // 移动到父节点\n            currentIndex\
    \ = j;\n        }\n        array[currentIndex] = noLeafValue; // 放入位置\n    }\n\
    \n    public void heapSort() {\n        for (int i = array.length - 1; i > 0;\
    \ i--) {\n            int temp = array[0];\n            array[0] = array[i];\n\
    \            array[i] = temp;\n            adjustHeap(0, i - 1);\n        }\n\
    \    }\n}\n```\n\n### TestHeapSort.java\n\n```java\npublic class TestHeapSort\
    \ {\n    public static void main(String[] args) {\n        HeapSort heapSort =\
