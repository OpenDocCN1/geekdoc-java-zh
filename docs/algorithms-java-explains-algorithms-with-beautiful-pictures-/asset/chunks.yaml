- fmt: "\n# HeapSort Implementation\n\n```java\npublic class HeapSort {\n    private\
    \ int [] array; // Initialize the heap\n    public void createHeap(int [] array)\
    \ {\n        this.array = array; // Build a heap, (array.length - 1) / 2 scan\
    \ half of the nodes with child nodes\n        for (int i = (array.length - 1)\
    \ / 2; i >= 0; i--) {\n            adjustHeap(i, array.length - 1);\n        }\n\
    \    }\n\n    // Adjustment heap\n    public void adjustHeap(int currentIndex,\
    \ int maxLength) {\n        int noLeafValue = array[currentIndex]; // Current\
    \ non-leaf node\n        // 2 * currentIndex + 1 Current left subtree subscript\n\
    \        for (int j = 2 * currentIndex + 1; j <= maxLength; j = currentIndex *\
    \ 2 + 1) {\n            if (j < maxLength && array[j] < array[j + 1]) {\n    \
    \            j++; // j Large subscript\n            }\n            if (noLeafValue\
    \ >= array[j]) {\n                break ;\n            }\n            array[currentIndex]\
    \ = array[j]; // Move up to the parent node\n            currentIndex = j;\n \
    \       }\n        array[currentIndex] = noLeafValue; // To put in the position\n\
    \    }\n\n    public void heapSort() {\n        for (int i = array.length - 1;\
    \ i > 0; i--) {\n            int temp = array[0];\n            array[0] = array[i];\n\
    \            array[i] = temp;\n            adjustHeap(0, i - 1);\n        }\n\
    \    }\n}\n```\n\n### TestHeapSort.java\n\n```java\npublic class TestHeapSort\
    \ {\n    public static void main(String[] args) {\n        HeapSort heapSort =\
    \ new HeapSort();\n        int [] scores = { 10, 90, 20, 80, 30, 70, 40, 60, 50\
    \ };\n        System.out.println(\"Before building a heap : \");\n        for\
    \ (int i = 0; i < scores.length ; i++) {\n            System.out.print(scores[i]\
    \ + \", \" );\n        }\n        System.out.print(\"\\n\\n\" );\n        //////////////////////////////////////////////////////////////\n\
    \        System.out.println(\"After building a heap : \" );\n        heapSort.createHeap(scores);\n\
    \        for (int i = 0; i < scores.length ; i++) {\n            System.out.print(scores[i]\
    \ + \", \" );\n        }\n        System.out.print(\"\\n\\n\" );\n        //////////////////////////////////////////////////////////////\n\
    \        System.out.println(\"After heap sorting : \" );\n        heapSort.heapSort();\n\
    \        for (int i = 0; i < scores.length ; i++) {\n            System.out.print(scores[i]\
