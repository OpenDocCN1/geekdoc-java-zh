    \            count++;\n        }\n        System.out .println(\"\\nJoseph sequenc\
    \ e： \" );\n        for (i = 0; i < N ; i++)\n            System.out .print(man[i]\
    \ + \" , \" );\n    }\n}\n```\n\n**Result:**\nJoseph sequence ： 4 , 10 , 1 , 7\
