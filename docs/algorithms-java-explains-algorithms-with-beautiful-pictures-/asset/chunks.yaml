    ```\n\n结果：![1556801564(1)](img/Image00165.jpg)\n\n# 有向图与深度优先搜索\n\n有向图：用邻接矩阵（即二维数组）和邻接表表示该数据结构。每个节点被称为顶点，两个相邻节点被称为边。有向图具有方向性：`A\
    \ -> B` 和 `B -> A` 是不同的。\n![](img/Image00166.jpg)\n\n1. 邻接矩阵如上所述：顶点总数是二维数组的大小，如果边值为\
    \ 1，否则无边值为 0。\n![](img/Image00167.jpg)\n2. 深度优先搜索：从 `A` 寻找邻接边节点 `B`，然后从 `B` 寻找邻接节点\
    \ `C`，依此类推，直到找到所有节点 `A -> B -> C -> D -> E`。\n![](img/Image00168.jpg)\n![](img/Image00169.jpg)\n\
    ![](img/Image00170.jpg)\n\n### Vertex.java\n\n```java\npublic class Vertex {\n\
    \    private String data;\n    private boolean visited; // 是否访问过\n    public Vertex()\
    \ {\n        super ();\n    }\n    public Vertex(String data, boolean visited)\
    \ {\n        this.data = data;\n        this.visited = visited;\n    }\n    public\
    \ String getData() {\n        return data;\n    }\n    public void setData(String\
    \ data) {\n        this.data = data;\n    }\n    public boolean isVisited() {\n\
    \        return visited;\n    }\n    public void setVisited(boolean visited) {\n\
    \        this.visited = visited;\n    }\n}\n```\n\n### Graph.java\n\n```java\n\
    import java.util.Stack;\npublic class Graph {\n    private int maxVertexSize;\
    \ // 二维数组大小\n    private int size; // 当前顶点数量\n    private Vertex[] vertices; //\
    \ 顶点\n    private int[][] adjacencyMatrix; // 二维数组\n    private Stack<Integer>\
    \ stack; // 栈存储当前顶点\n\n    public Graph(int maxVertexSize) {\n        this.maxVertexSize\
    \ = maxVertexSize;\n        vertices = new Vertex[maxVertexSize];\n        adjacencyMatrix\
    \ = new int[maxVertexSize][maxVertexSize];\n        stack = new Stack<>();\n \
    \   }\n\n    public void addVertex(String data) {\n        vertices[size] = new\
    \ Vertex(data, false);\n        size++;\n    }\n\n    // 添加邻边\n    public void\
    \ addEdge(int from, int to) {\n        adjacencyMatrix[from][to] = 1;\n    }\n\
    \n    public void depthFirstSearch() {\n        // 从第一个顶点开始搜索\n        Vertex\
    \ firstVertex = vertices[0];\n        firstVertex.setVisited(true);\n        System.out.print(firstVertex.getData());\n\
    \        stack.push(0);\n\n        while (!stack.isEmpty()) {\n            int\
    \ row = stack.peek();\n            // 获取未访问的邻接顶点位置\n            int col = findAdjacencyVisited(row);\n\
    \            if (col == -1) {\n                stack.pop();\n            } else\
    \ {\n                vertices[col].setVisited(true);\n                System.out.print(\"\
    \ -> \" + vertices[col].getData());\n                stack.push(col);\n      \
    \      }\n        }\n    }\n\n    // 获取未访问的邻接顶点\n    public int findAdjacencyVisited(int\
    \ row) {\n        for (int col = 0; col < size; col++) {\n            if (adjacencyMatrix[row][col]\
    \ == 1 && !vertices[col].isVisited()) {\n                return col;\n       \
    \     }\n        }\n        return -1;\n    }\n\n    // 重置\n    public void clear()\
    \ {\n        for (int i = 0; i < size; i++) {\n            vertices[i].setVisited(false);\n\
    \        }\n    }\n\n    public int[][] getAdjacencyMatrix() {\n        return\
    \ adjacencyMatrix;\n    }\n\n    public Vertex[] getVertices() {\n        return\
    \ vertices;\n    }\n}\n```\n\n### TestGraph.java\n\n```java\npublic class TestGraph\
    \ {\n    public static void main(String[] args) {\n        Graph graph = new Graph(5);\n\
