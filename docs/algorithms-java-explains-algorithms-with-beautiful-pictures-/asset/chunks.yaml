    );\n            for (int j = 0; j < graph.getAdjacencyMatrix().length; j++) {\n\
    \                System.out.print(graph.getAdjacencyMatrix()[i][j] + \" \");\n\
    \            }\n            System.out.print(\"\\n\");\n        }\n    }\n}\n\
    ```\n\n结果：![1556849458(1)](img/Image00171.jpg)\n\n# 有向图与广度优先搜索\n\n广度优先搜索：从 A 寻找所有邻接节点\
