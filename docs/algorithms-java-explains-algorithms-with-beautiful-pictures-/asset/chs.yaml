  \n    // 添加邻边\n    public void addEdge(int from, int to) {\n        adjacencyMatrix[from][to]\
  \ = 1;\n    }\n\n    public void depthFirstSearch() {\n        // 从第一个顶点开始搜索\n \
  \       Vertex firstVertex = vertices[0];\n        firstVertex.setVisited(true);\n\
