  \n# 有向图与深度优先搜索\n\n有向图：用邻接矩阵（即二维数组）和邻接表表示该数据结构。每个节点被称为顶点，两个相邻节点被称为边。有向图具有方向性：`A ->\
  \ B` 和 `B -> A` 是不同的。\n![](img/Image00166.jpg)\n\n1. 邻接矩阵如上所述：顶点总数是二维数组的大小，如果边值为\
