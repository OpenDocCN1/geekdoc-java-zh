  整数序列的最大值：![](img/Image00004.jpg)\n1. 算法思想：初始值 `minIndex=0`，`j=1`。比较 `arrays[minIndex]`\
  \ 与 `arrays[j]`。如果 `arrays[minIndex] > arrays[j]` 则 `minIndex=j`，`j++`；否则 `j++`。持续到最后一个数字，`arrays[minIndex]`\
  \ 即为最大值。\n\n**TestMaxValue.java**\n```java\npublic class MaxValue {\n    public\
  \ static void main(String[] args) {\n        int [] scores = { 60, 50, 95, 80, 70\
  \ };\n        int maxValue = max(scores);\n        System.out.println(\"Max Value\
  \ = \" + maxValue);\n    }\n    public static int max(int [] arrays) {\n       \
  \ int minIndex = 0; // 最大值是 0\n        for (int i = 0; i < arrays.length - 1; i++)\
  \ {\n            if (arrays[i] > arrays[i + 1]) { // 交换\n                int temp\
  \ = arrays[i];\n                arrays[i] = arrays[i + 1];\n                arrays[i\
  \ + 1] = temp;\n            }\n        }\n        int maxValue = arrays[arrays.length\
  \ - 1];\n        return maxValue;\n    }\n}\n```\n结果：`Max Value = 95`\n\n---\n\n\
  ## 冒排序算法\n\n冒排序算法：比较 `arrays[j]` 与 `arrays[j+1]`，如果 `arrays[j] > arrays[j+1]` 则进行交换。剩余元素重复此过程直到排序完成。将数字从小到大排序\
  \ ![](img/Image00006.jpg)\n\n解释：![](img/Image00007.jpg) 已经排序 ![](img/Image00008.jpg)\n\
  1. 第一次排序：![](img/Image0010.jpg)\n2. 第二次排序：![](img/Image0011.jpg)\n3. 第三次排序：![](img/Image0012.jpg)\
  \ 未交换则停止排序：可以得到从小到大的排序 ![](img/Image0013.jpg)\n\n**TestBubbleSort.java**\n```java\n\
  public class BubbleSort {\n    public static void main(String[] args) {\n      \
  \  int [] scores = { 60, 50, 95, 80, 70 };\n        sort(scores);\n        for (int\
  \ i = 0; i < scores.length; i++) {\n            System.out.print(scores[i] + \"\
  ,\")\n        }\n    }\n    public static void sort(int [] arrays) {\n        for\
  \ (int i = 0; i < arrays.length - 1; i++) {\n            boolean isSwap = false;\n\
  \            for (int j = 0; j < arrays.length - i - 1; j++) {\n               \
  \ if (arrays[j] > arrays[j + 1]) { // 交换\n                    int temp = arrays[j];\n\
  \                    arrays[j] = arrays[j + 1];\n                    arrays[j +\
  \ 1] = temp;\n                    isSwap = true;\n                }\n          \
  \  }\n            if (!isSwap) // 未交换则停止排序\n                break;\n           \
  \ }\n        }\n    }\n}\n```\n结果：`50,60,70,80,95`\n\n---\n\n## 最小值\n\n整数序列的最小值：![](img/Image0014.jpg)\n\
