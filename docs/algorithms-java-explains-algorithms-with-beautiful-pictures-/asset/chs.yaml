  );\n        print(stack);\n    }\n\n    public static void print(Stack stack) {\n\
  \        System.out.print(\"Top \");\n        Node node = null;\n        while ((node\
  \ = stack.pop()) != null) {\n            System.out.print(node.data + \" -> \");\n\
  \        }\n        System.out.print(\"End\\n\");\n    }\n}\n```\n结果: Top C -> B\
  \ -> A -> End\n\n## 5. 快速排序算法\n\n快速排序算法是一种流行的排序算法，在实践中通常比其他排序算法更快。它利用分治策略，通过将一个大数组分为两个较小的数组来快速排序数据项。\n\
  1. 快速排序分数 `{90, 60, 50, 80, 70, 100}`![](img/Image00103.jpg)[][](Image00104.jpg)[][](Image00105.jpg)[][](Image00106.jpg)TestQuickSort.java\n\
  \n\n\n\n```java\npublic class TestQuickSort {\n    private static void quickSort(int\
  \ [] array, int low, int high) {\n        if (low > high) {\n            return\
  \ ;\n        }\n        int i = low;\n        int j = high;\n        int threshold\
  \ = array[low];\n        // Alternately scanned from both ends of the list\n   \
  \     while (i < j) {\n            // Find the first position less than threshold\
  \ from right to left\n            while (i < j && array[j] > threshold) {\n    \
  \            j--;\n            }\n            //Replace the low with a smaller number\
  \ than the threshold\n            if (i < j)\n                array[i++] = array[j];\n\
  \            // Find the first position greater than threshold from left to right\n\
  \            while (i < j && array[i] <= threshold) {\n                i++;\n  \
  \          }\n            //Replace the high with a number larger than the threshold\n\
  \            if (i < j)\n                array[j--] = array[i];\n        }\n   \
  \     array[i] = threshold;\n        quickSort (array, low, i - 1); // left quickSort\n\
  \        quickSort (array, i + 1, high); // right quickSort\n    }\n\n    public\
  \ static void quickSort(int [] array) {\n        if (array.length > 0) {\n     \
  \       quickSort (array, 0, array.length - 1);\n        }\n    }\n\n    public\
  \ static void main(String[] args) {\n        int [] scores = { 90, 60, 50, 80, 70,\
  \ 100 };\n        quickSort (scores);\n        for (int i = 0; i < scores.length\
  \ ; i++) {\n            System.out .print(scores[i] + \",\" );\n        }\n    }\n\
  }\n```\n结果: `50,60,70,80,90,100`\n\n# 二路归并算法\n\n二路归并算法：\n对前半部分和后半部分的数据进行排序，并将这两个有序子列表合并成一个有序列表，该过程持续递归直到末尾。\n\
  \n1. 通过归并排序对分数 `{50, 65, 99, 87, 74, 63, 76, 100}` 进行排序 ![](img/Image00107.jpg)\n\
  \nTestMergeSort.java\n\n```java\npublic class TestMergeSort {\n    public static\
  \ void main(String args[]) {\n        int scores[] = { 50, 65, 99, 87, 74, 63, 76,\
  \ 100, 92 };\n        mergeSort (scores);\n        for (int i = 0; i < scores.length\
  \ ; i++) {\n            System.out .print(scores[i] + \",\" );\n        }\n    }\n\
  \n    private static void mergeSort(int [] array) {\n        mergeSort (array, new\
  \ int [array.length ], 0, array.length - 1);\n    }\n\n    private static void mergeSort(int\
  \ [] array, int [] temp, int left, int right) {\n        if (left < right) {\n \
  \           int center = (left + right) / 2;\n            mergeSort (array, temp,\
  \ left, center); // 左归并排序\n            mergeSort (array, temp, center + 1, right);\
  \ // 右归并排序\n            merge (array, temp, left, center + 1, right); // 合并两个有序数组\n\
  \        }\n    }\n\n    /**\n    将两个有序列表合并为一个有序列表\n    temp : 临时数组\n    left :\
  \    左侧起始下标\n    right :  右侧起始下标\n    rightEndIndex : 右侧结束下标\n    */\n    private\
  \ static void merge(int [] array, int [] temp, int left, int right, int rightEndIndex)\
  \ {\n        int leftEndIndex = right - 1; // 左侧结束下标\n        int tempIndex = left;\
  \ // 从左侧开始计数\n        int elementNumber = rightEndIndex - left + 1;\n        while\
  \ (left <= leftEndIndex && right <= rightEndIndex) {\n            if (array[left]\
  \ <= array[right])\n                temp[tempIndex++] = array[left++];\n       \
  \     else\n                temp[tempIndex++] = array[right++];\n        }\n   \
  \     while (left <= leftEndIndex) { // 如果左侧还有元素\n            temp[tempIndex++]\
  \ = array[left++];\n        }\n        while (right <= rightEndIndex) { // 如果右侧还有元素\n\
  \            temp[tempIndex++] = array[right++];\n        }\n        // 将 temp 拷贝到\
  \ array\n        for (int i = 0; i < elementNumber; i++) {\n            array[rightEndIndex]\
  \ = temp[rightEndIndex];\n            rightEndIndex--;\n        }\n    }\n}\n```\n\
  结果: `50,63,65,74,76,87,99,100`\n\n# 二叉搜索树\n\n二叉搜索树：\n1. 如果任意节点的左子树不为空，则左子树所有节点的值都小于其根节点的值；\n\
