  Apple\" , 5, 5700),new Fruit(\"Orange\" , 2, 2250),new Fruit(\"Strawberry\" , 1,\
  \ 1100),new Fruit(\"Melon\" , 6, 6700) };\n        for (int i = 0; i < fruits.length\
  \ ; i++) {\n            for (int j = fruits[i].getSize(); j <= MAXSIZE ; j++) {\n\
  \                int p = j - fruits[i].getSize();\n                int newValue\
  \ = value[p] + fruits[i].getPrice();\n                if (newValue > value[j]) {\
  \ // Find the best solution\n                    value[j] = newValue;\n        \
  \            item[j] = i;\n                }\n            }\n        }\n       \
  \ System.out .println(\"Item \\t Price\" );\n        for (int i = MAXSIZE ; i >=\
  \ MINSIZE ; i = i - fruits[item[i]].getSize()) {\n            System.out .println(fruits[item[i]].getName()\
  \ + \"\\t\" + fruits[item[i]].getPrice());\n        }\n        System.out .println(\"\
