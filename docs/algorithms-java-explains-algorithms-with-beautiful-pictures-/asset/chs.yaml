  \ Queue {\n    private Node head;\n    private Node tail;\n    private int size;\n\
  \n    public void offer(String element) {\n        if (head == null) {\n       \
  \     head = new Node(element);\n            tail = head;\n        } else {\n  \
  \          Node newNode = new Node(element);\n            newNode.next = tail;\n\
  \            tail.prev = newNode;\n            tail = newNode;\n        }\n    \
  \    size++;\n    }\n\n    public Node poll() {\n        Node p = head;\n      \
  \  if (p == null) {\n            return null;\n        }\n        head = head.next;\n\
  \        if (head != null) {\n            head.prev = null;\n        }\n       \
  \ p.next = null;\n        size--;\n        return p;\n    }\n\n    public int size()\
  \ {\n        return size;\n    }\n}\n```\n\nTestQueue.java\n```java\npublic class\
