  二叉树中的非叶子节点值大于其左右节点的值。\n- 小顶堆：`ki <= k2i` 且 `ki <= k2i+1`\n- 大顶堆：`ki >= k2i` 且 `ki\
  \ >= k2i+1`\n- 父节点下标：`(i-1)/2`\n- 左子节点下标：`2i+1`\n- 右子节点下标：`2i+2`\n\n## 堆排序过程\n\n\
  1. **建堆**\n2. 输出堆顶元素后，从上向下调整，将最小元素交换到堆顶；然后持续调整直到叶子节点以得到新堆。\n\n1. `{10, 90, 20, 80,\
  \ 30, 70, 40, 60, 50}` 建堆并进行堆排序输出。初始化堆并建堆 ![](img/Image0138.jpg)[](Image0139.jpg)[](Image0140.jpg)[](Image0141.jpg)[](Image0142.jpg)[](Image0143.jpg)[](Image0144.jpg)[](Image0145.jpg)\
  \ 建堆完成\n2. **开始堆排序** ![](img/Image0146.jpg)[](Image0147.jpg)[](Image0148.jpg)[](Image0149.jpg)[](Image0150.jpg)[](Image0151.jpg)[](Image0152.jpg)[](Image0153.jpg)[](Image0154.jpg)[](Image0155.jpg)[](Image0156.jpg)[](Image0157.jpg)[](Image0158.jpg)[](Image0159.jpg)\
  \ 堆排序结果 ![](img/Image0160.jpg) HeapSort.java\n\n\n\n\n\n# 堆排序实现\n\n```java\npublic\
  \ class HeapSort {\n    private int [] array; // 初始化堆\n    public void createHeap(int\
  \ [] array) {\n        this.array = array; // 构建堆，(array.length - 1) / 2 扫描一半具有子节点的节点\n\
  \        for (int i = (array.length - 1) / 2; i >= 0; i--) {\n            adjustHeap(i,\
  \ array.length - 1);\n        }\n    }\n\n    // 调整堆\n    public void adjustHeap(int\
  \ currentIndex, int maxLength) {\n        int noLeafValue = array[currentIndex];\
  \ // 当前非叶子节点\n        // 2 * currentIndex + 1 当前左子树下标\n        for (int j = 2 *\
  \ currentIndex + 1; j <= maxLength; j = currentIndex * 2 + 1) {\n            if\
  \ (j < maxLength && array[j] < array[j + 1]) {\n                j++; // j 大下标\n\
  \            }\n            if (noLeafValue >= array[j]) {\n                break\
  \ ;\n            }\n            array[currentIndex] = array[j]; // 移动到父节点\n    \
  \        currentIndex = j;\n        }\n        array[currentIndex] = noLeafValue;\
  \ // 放入位置\n    }\n\n    public void heapSort() {\n        for (int i = array.length\
  \ - 1; i > 0; i--) {\n            int temp = array[0];\n            array[0] = array[i];\n\
  \            array[i] = temp;\n            adjustHeap(0, i - 1);\n        }\n  \
  \  }\n}\n```\n\n### TestHeapSort.java\n\n```java\npublic class TestHeapSort {\n\
