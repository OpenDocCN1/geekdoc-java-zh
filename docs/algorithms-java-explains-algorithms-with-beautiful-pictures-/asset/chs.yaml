  从栈中弹出 B![](img/Image00099.jpg)\n从栈中弹出 A![](img/Image00100.jpg)\n\n```java\npublic\
  \ class Stack {\n    private Node top;\n    private int size;\n\n    public void\
  \ push(String element) {\n        if (top == null) {\n            top = new Node(element);\n\
  \        } else {\n            Node newNode = new Node(element);\n            newNode.next\
  \ = top;\n            top = newNode;\n        }\n        size++;\n    }\n\n    public\
  \ Node pop() {\n        if (top == null) {\n            return null;\n        }\n\
  \        Node p = top;\n        top = top.next;\n        // top 向移动\n        p.next\
  \ = null;\n        size--;\n        return p;\n    }\n\n    public int size() {\n\
  \        return size;\n    }\n}\n```\n\nTestStack.java\n```java\npublic class TestStack\
