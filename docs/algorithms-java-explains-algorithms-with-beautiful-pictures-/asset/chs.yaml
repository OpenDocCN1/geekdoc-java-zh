  \n\n\n\n# 二叉树实现\n\n## BinaryTree.java\n\n```java\npublic class BinaryTree {\n  \
  \  private Node root;\n\n    public Node getRoot() {\n        return root;\n   \
  \ }\n\n    // 后序遍历二叉搜索树\n    public void postOrder(Node root) {\n        if (root\
  \ == null) {\n            return;\n        }\n        postOrder(root.left); // 递归遍历左子树\n\
  \        postOrder(root.right); // 递归遍历右子树\n        System.out.print(root.getData()\
  \ + \", \");\n    }\n\n    public void insert(Node node, int newData) {\n      \
  \  if (this.root == null) {\n            this.root = new Node(newData, null, null);\n\
  \            return;\n        }\n        int compareValue = newData - node.getData();\n\
  \        // 递归左子树，继续寻找插入位置\n        if (compareValue < 0) {\n            if (node.left\
  \ == null) {\n                node.left = new Node(newData, null, null);\n     \
  \       } else {\n                insert(node.left, newData);\n            }\n \
  \       } else if (compareValue > 0) {\n            // 递归右子树寻找插入位置\n           \
  \ if (node.right == null) {\n                node.right = new Node(newData, null,\
  \ null);\n            } else {\n                insert(node.right, newData);\n \
  \           }\n        }\n    }\n}\n```\n\n## TestBinaryTree.java\n\n```java\npublic\
