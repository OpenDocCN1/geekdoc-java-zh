  \ 4500 | 9000 |\n| Item | - | - | - | 0 | 0 | 0 | 0 | 0 , 0 |\n| Name | - | - |\
  \ - | Plum | Plum | Plum | Plum | 2* Plum |\n\n2. 放入苹果：\n\n| Weight of Backpack\
