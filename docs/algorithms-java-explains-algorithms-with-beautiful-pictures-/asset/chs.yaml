  \ 1 只兔子，一个月后还是 1 只。两个月后有 2 只，三个月后有 3 只……”\n例如：1, 1, 2, 3, 5, 8, 13 ...\n斐波那契定义：\n\
  如果 `n = 0, 1`, `fn = n`\n如果 `n > 1`, `fn = fn-1 + fn-2`\n![](img/Image00185.jpg)\n\
