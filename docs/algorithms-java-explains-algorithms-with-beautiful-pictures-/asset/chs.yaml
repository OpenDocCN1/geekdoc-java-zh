  \ 13\n\n# Dijkstra\n\n三色旗帜最初是由 E.W. Dijkstra 提出的，他使用了荷兰国旗（Dijkstra 是荷兰人）。假设有一根系着红、白、蓝旗帜的绳子。起初绳子上的所有旗帜都没有顺序。你需要将它们按照\
  \ 蓝色 -> 白色 -> 红色的顺序进行排列。如何用最少的次数移动它们？你只需要在绳子上操作，且每次只交换两个旗帜。\n\n![](img/Image00186.jpg)\n\
  \n### 解决方案：\n使用字符数组存储旗帜。例如，`b`、`w` 和 `r` 分别表示蓝色、白色和红色旗帜的位置。数组 `b` 和 `w` 的开头是 0，而\
  \ `r` 位于数组末尾。\n1. 如果 `w` 的位置是蓝色旗帜，则交换 `[w]` 和 `[b]`。并将 `whiteIndex` 和 `b` 向后移动 1\
  \ 位。\n2. 如果 `w` 的位置是白色旗帜，则 `w` 向后移动 1 位。\n3. 如果 `w` 的位置是红色旗帜，则交换 `[w]` 和 `[r]`。`r`\
  \ 向前移动 1 位。\n\n最后，`b` 前面的旗帜都是蓝色的，`r` 后面的旗帜都是红色的。\n\n### 图解解\n![](img/Image00187.jpg)\n\
  ![](img/Image00188.jpg)\n\n### Dijkstra.java\n```java\nimport java.util.Scanner;\n\
  public class Dijkstra {\n    public static void main(String[] args) {\n        char\
  \ [] flags = { 'R', 'B', 'W', 'B', 'R', 'W' };\n        int b = 0, w = 0, r = flags.length\
  \ - 1;\n        int count = 0;\n        while (w <= r) {\n            if (flags[w]\
  \ == 'W') {\n                w++;\n            } else if (flags[w] == 'B') {\n \
  \               char temp = flags[w];\n                flags[w] = flags[b];\n  \
  \              flags[b] = temp;\n                w++;\n                b++;\n  \
  \              count++;\n            } else if (flags[w] == 'R') {\n           \
  \     char m = flags[w];\n                flags[w] = flags[r];\n               \
  \ flags[r] = m;\n                r--;\n                count++;\n            }\n\
  \        }\n        for (int i = 0; i < flags.length ; i++) {\n            System.out.print(flags[i]);\n\
  \        }\n        System.out.print(\"\\nThe total exchange count : \" + count);\n\
  \    }\n}\n```\n\nResult：\nBBWWRR\nThe total exchange count : 4\n\n# 老鼠迷宫\n\n老鼠迷宫是一种基础的递归解决方案。我们使用二维数组中的\
