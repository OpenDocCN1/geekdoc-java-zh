  - **最大值**：较大的值位于右子节点上，只要递归遍历右子树直到为空，当前节点即为最大值节点。\n\n![](img/Image00128.jpg)[](Image00129.jpg)\n\
  \n## BinaryTree.java (更新版)\n\n```java\npublic class BinaryTree {\n    private Node\
  \ root;\n\n    public Node getRoot() {\n        return root;\n    }\n\n    // 最小值\n\
  \    public Node searchMinValue(Node node) {\n        if (node == null || node.getData()\
  \ == 0)\n            return null;\n        if (node.left == null) {\n          \
  \  return node;\n        }\n        return searchMinValue(node.left); // 递归地从左子树寻找最小值\n\
  \    }\n\n    // 最大值\n    public Node searchMaxValue(Node node) {\n        if (node\
  \ == null || node.getData() == 0)\n            return null;\n        if (node.right\
  \ == null) {\n            return node;\n        }\n        return searchMaxValue(node.right);\
  \ // 递归地从右子树寻找最小值\n    }\n\n    public void insert(Node node, int newData) {\n \
  \       if (this.root == null) {\n            this.root = new Node(newData, null,\
  \ null);\n            return;\n        }\n        int compareValue = newData - node.getData();\n\
  \        // 递归左子树，继续寻找插入位置\n        if (compareValue < 0) {\n            if (node.left\
  \ == null) {\n                node.left = new Node(newData, null, null);\n     \
  \       } else {\n                insert(node.left, newData);\n            }\n \
  \       } else if (compareValue > 0) {\n            // 递归右子树寻找插入位置\n           \
  \ if (node.right == null) {\n                node.right = new Node(newData, null,\
  \ null);\n            } else {\n                insert(node.right, newData);\n \
  \           }\n        }\n    }\n}\n```\n\n## TestBinaryTree.java (更新版)\n\n```java\n\
