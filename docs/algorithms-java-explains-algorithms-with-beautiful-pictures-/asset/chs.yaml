  \ , 10 ,\n\n# 背包问题\n\n假设你有一个重量限制为 8 kg 的背包，你想装入总价值最高的商品，假设水果如下（ID、名称、价格和重量）：\n\n\
  | ID | Name | Price | Weight |\n| :--- | :--- | :--- | :--- |\n| 0 | Plum | 4kg\
  \ | 4500 |\n| 1 | Apple | 5kg | 5700 |\n| 2 | Orange | 2kg | 2250 |\n| 3 | Strawberry\
  \ | 1kg | 1100 |\n| 4 | Melon | 6kg | 6700 |\n\n### 解决方案：\n为了解决这个优化问题，可以使用动态规划。开始时有一个空集，每添加一个元素，寻找该阶段的最解，直到所有元素都添加。最后可以得到最优解。\n\
  有两个数组，`value` 和 `item`：\n`value`：当前最优解的总价格。\n`item`：背包中的最后一个水果。\n有 8 个重量从 1 到 8\
  \ 的背包，为每个背包寻找最优解。\n\n逐渐将水果放入背包寻找最优解：\n1. 放入李子：\n\n| Weight of Backpack | 1kg | 2\
