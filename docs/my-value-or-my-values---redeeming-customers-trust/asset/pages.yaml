  md: '# # Preface


    If you want to read business books that tell you what to do – how to create a
    better business – how to avoid the pitfalls – don’t read any of the “Strategies
    to Go”.


    They don’t provide road maps or instruction on how to create wealth, get more
    customers, or become an enlightened leader.


    The Strategies to Go... are designed to tell it like it is – what really happens
    in business – allowing you to learn the lessons that fit your needs and the strategic
    needs of your business.


    They are novels based on the lives and businesses of real people and their companies
    and what has happened to them. Their frustrations and anger, exuberance of success,
    and pain of losing. Situations they have encountered, problems that have bowled
    them over, and triumphs they have achieved. The heroes and heroines do exist;
    they are a composite of all the companies, leaders and managers we have worked
    over the years.


    And we introduce you to three of our T-shirt leaders. Experienced leaders willing
    to be identified and to share their experiences so you know you are not alone.


    They know the Hard Knocks Café. Been there, bought the T-shirt, and worn it to
    tatters. And they go on wearing it.


    > - Heather E. Robertson'
