    he’d have some unwinding to because of this Values exercise – ‘Disclaimer Shamer’
    he cringed inwardly. Randalls reputation as a publisher would be so damaged, they’d
    be lucky if they hung on to ‘Disclaimer Shamer’ as a goal. ‘Verifiable Values’
    would be a long forgotten dream.


