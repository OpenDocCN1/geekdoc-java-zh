    ## Chapter 1: Hostage


    And he’d had to have courage to return to them as the then renamed ‘FutureSafe’.
    It wasn’t the rebranding that attracted him, but it was his re-invigorated commitment.
    Returning had provided the biggest challenge of his career. But Paul’s passion,
    and the efforts of everyone in the company, could come to nothing without the
    Randalls account.


    When Paul had returned from the meeting with Tom Medici, Randalls CEO, it was
    truly a bad news/good news story that progressed into a great news/shocking news
    story, and then complete puzzlement. Randalls wanted to cancel the audit; they
    did not want to cancel the contract; they wanted to re-evaluate their Ones and
    undertake the Values exercise FutureSafe had undergone and then, align this to
    all their major suppliers, including FutureSafe. But, they wanted Jeremy to undertake
    the Values re-evaluation. And to do this, he would have to leave FutureSafe and
    join Randalls.


    Would Randalls cancel the FutureSafe contract if he refused to join them? Tom
    was hedging on this point, as he was convinced that Jeremy was the best person
    for the job. Not just because of what he had achieved at FutureSafe but he was
    already deeplybedded in Randalls, through his work with the audit. There would
    be no transition required, he would be immediately effective.


    Callum was right about vision and proximity. Jeremy knew he would be too close
    if he moved into Randalls, he could become too imbedded to see with the clarity
    he had shown them to date.


    “It’s not just that,” said Jeremy, and Paul and Callum stopped to listen to him,
    suddenly aware that the man they had been speaking of, speaking around, may have
    his own views. “I don’t have their ‘why’”.


