    你的“价值观练习”从这里开始。它将向你展示你是谁。


    “你不明白，”汤姆说，依然空洞地盯着窗外掠过的城市景象，“这不仅仅是一个价值观练习。当你进行这项练习时，你所发现的将令你大震惊。你必须修复的，远比我们为业务和利益相关者决定价值要得多。当你发现真相时，我需要你被死死钉住。我需要你无法说话、无法离开。受保密协议的约束，只有当你成为员工时，我才能守护这种秘密。你无法离开。被高薪这副‘金手铐’锁在我的公司里，你无法离开，也无法透露。


    “就是你，”汤姆吐出这几个字，“你，带着你那所有的‘为什么’。你所有那些找不到为了为我的公司工作的‘为什么’的理由，你所有关于客户为什么与公司产生联系、你的员工为什么想为公司工作并留任公司的种种言论。为什么，为什么，为什么……但你从未深入地挖掘过我们为什么要进行这项价值观练习背后的‘为什么’。而且为什么我准备好做出如此出格的事情——去‘偷走’一家我所钦佩的业务和老板公司的员工。”


    ## 第四章：击败生态战士


    清脆的碰撞声，雪茄的香气。这曾是辛劳但成功的一天结束时成就的奖励——现在，它们是支撑艾克度过这一天的动力。


    他站在办公室外的露台上，俯瞰着下方的城市生活。人们，那些爪仔，在他们不幸且毫无价值的任务中忙碌穿梭。不像他，他是强大的 e.Celebs 公司的首席执行官。艾克不需要忙碌——他有自己的爪仔来去做那些事。


    正是那些爪仔为他带来了情报、内幕以及那些登上头条新闻的料。其中一个甚至带了丹·兰达尔。


    e.Celebs 缺乏兰达尔所积累的人脉和支持，那些兰达尔能够‘负担得起’的、兰达尔从 Magna 公司享有的支持。e.Celebs 不得不采取其他‘方法’来获取名人新闻。而那些爪仔的作用就是钻入每一个缝隙，挤出细节和信息。但是，如果他们有机会能把
    Magna 从兰达尔手中夺过来——将 Magna 据为己有，他们将彻底颠覆名人媒体市场。他可以彻底颠覆这个媒体市场。


    所以兰达尔想要重置他们的价值观。艾克嗤之以鼻。那是一种并不悦听的声音，甚至在他自己听来也是如此。低沉的。但艾克记得自己从哪里走来。他曾是那些爪仔之一，他了解阴沟里的世界。但他一路爬了上来，现在他要把
    e.Celebs 提起来，提向上，推到那个顶端。那个‘目前’被兰达尔占据的位置。他想起某部电影里的一句台词：“这具行走的尸体有名字吗？”他笑了；这就是他看待兰达尔的方式。


    一切已各就就位。一旦陷阱触发，董事会就批准了对即将受损的兰达尔公司进行收购。他有一位来自兰达尔内部的线人，并安排了与 Magna 的一位高管会面，因此，大网正向着丹·兰达尔收拢。


    艾克一口气喝光了最后一点饮料，靠在椅子背上，闭上眼睛，深长地吸了一口雪茄。在他身后，那个被称为办公室的玻璃笼子里，水彩画般的谈论充满了推测。每个人都知道事情正在发生。未计划的董事会会议，麦克频繁且突然造访艾克的办公室。紧闭的门，提高音量。而现在，艾克在下午时分，就这么坐在露台上喝酒抽烟。事实上，他并没有动——他难道真的睡着了吗？


    睡着了？艾克的思维异常活跃，排练着与 Magna 高管的会面。他将如何让对方慢慢意识到，他们与兰达尔的联盟正走向毁灭。


    兰达尔正在进行一项价值观练习，这项练习将质疑他们与兰达尔合作的有效性。


    兰达尔正在进行一项价值观练习，这项练习将质疑他们与兰达尔合作的有效性。


