    # 我的价值或

    我的价值观


    平衡价值、价值观与利润


    Heather E. Robertson


    Heather Robertson 曾在新西兰及海外的多个商业领域工作。她于 22 年前创立了一家咨询公司，拥有一种独特的贡献性哲学，这种哲学包括让客户在一种共享体验学习的环境中相互协助。


    十年来，她为选定的商业领袖运营着一项免费的月度计划，因为她深知顶端是孤独的——并为他们提供了一个机密的环境来互相帮助并解决公司面临的关键问题。


    # 献词


    这些书献给书中收录的那些“T 恤领导者们”。


    他们愿意讲述自己的故事并分享经验，以便让你从中学习，也让你知道，在面临的问题和困难中，你并不孤单。


    他们了解“苦难咖啡馆”（Hard Knocks Café），去过那里，买过那件 T 恤并穿破了……而且他们继续穿着它。


