    ## Chapter 11 – The Black Swan


    reacted. They had, but not with, shock, disbelief, dismay, or concern – it had
    been Callum who had spoken first. He had simply said, “If you turn to Section
    15, which is entitled ‘Black Swans’ you will see that we have looked at how to
    address the unknown factors that could de-rail the Values exercise. Unexpected
    and unpredictable issues – issues that neither we nor your management team could
    imagine.


    “Nassim Taleb,” Callum had explained, “is the world renowned hedge-fund quant
    who became renowned outside the world of the quants because he devised the theory
    of the ‘Black Swan’. The theory that accepts there are unforeseen and unimaginable
    events that can have the profound consequences. Not only when they occur, but
    because they are so completely unimaginable they cannot be predicted, therefore
    no mitigation planning can take place.”


    Callum continued, “Of course, the Dan story is not unimaginable to you, you’ve
    known it a while; it is nonetheless, totally unpredictable for your management
    team and your market – made all the worse by the fact that it strikes a deadly
    blow at the very foundation of your company’s Values.


    “It means,” said Tom quietly, “we’re trying to return to Values which – the Black
    Swan has revealed – never existed.”


    ## Chapter 12

    Double Fugu


    "But it doesn’t have to be all or nothing with Magna."

    There had been absolute silence in the room when Tom had made the statement that
    they were trying to return to Values that had not truly existed. It was a respectful,
    not embarrassed silence, one that allowed Tom to realize the full extent of what
    he had just said.


    Paul had had the debris of the coffee cleared away, and as it was now late in
    the afternoon, he’d opened the fridge and handed out bottles of beer.


    And Tom had had a comeback, gained his second wind, and was clearly thinking options
    around the Magna situation. No one made any comment, they just let it sit, understanding
    the machinations that would be whirling through his mind. He continued, mistaking
    their silence for acceptance.


    "I mean, we don’t have to be so cut and dry, convert or disconnect. There is middle
    ground. We could request their source material, and then go through our validation
    process. This means that Magna can continue to act as they do, doesn’t disrupt
    our relationship, but we can insert our processes and meet our Validation Values."


    "Validation Values,” repeated Paul quizzically.

    Callum was the first to speak, “It’s a good term. It could work well for you.
    Marketing can package it up to be both catchy and meaningful, a good term of reference
    for staff and customers alike."


    Tom’s expression lighted, so Callum’s next words hit him hard, “If of course,
    Values are merely a marketing exercise for you.” More silence, and Callum continued
    evenly,


    “But from a Values viewpoint, such a ‘compromise’ would be a double stinger. Your
    Values diluted and you’re sending a message to your key partner that you don’t
    trust them.”


    And there was another silence.


    Tom’s mind spun. Callum was of course right. It would be a clear signal to Magna
    that they didn’t trust them. Of course, Magna knew their material was not ‘fully
    verified’, but to tell them that Randalls were going to better, even fully, verify
    the information, would create a rift in their relationship that would have far
    reaching effects for Magna. It would place them in the glare of a spotlight that
    would reveal cracks that they and their readership market knew but would prefer
    not to come to light.


    “You have to remember,” Richard spoke at last, “we’ve been on a huge journey,
    and Magna haven’t been part of it. It’s new to them. And you’re expecting them
    all to catch up with you and make decisions that could, that will, impact their
    business, brand, methodology – and profit.”


    Tom stood up and paced the room. At the junction of two crossroads. Which way
    on the Dan story, which way with Magna. Then suddenly, he smiled. The four men
    watching him were surprised, and their surprise turned his smile into a laugh.


    “Like Japanese food?” he asked.


    They either nodded or mumbled their assent.


    “Eaten fugu?” he asked.


    They all shook their heads or expressed their dissent.


    “You?” asked Paul.


    “Yep,” replied Tom. “I was in Japan with Dan some years ago and he took me to
    a restaurant he said had the finest and most experienced Fugu Chef in Tokyo. I
    could only take courage in the fact that at this restaurant, the Fugu Chef must
    take the first bite of the dish at the table, to prove he has fully extracted
    the lethally toxic parts of the fish.


    “But even so,” he continued, the laughter gone, “I was not afraid as I am today.
    I have two fugus. If I don’t extract the poison from each of these, both of these
    situations, the company is dead.”


    “I can’t do ‘Disclaimer Shamer’,” said Jeremy firmly. “You must know by now -
    what is the one thing you hold true? That you will protect at all costs, and that
    will in turn protect everyone.”


    Without hesitation Tom said, “I can’t do ‘Disclaimer Shamer’”.


    And as Tom stood and faced the management team the next morning, as he looked
    at each of them, his tiredness was gone. Richard and Jeremy were there, looking
    fresh despite having spent until 4 am that morning with him examining options.
    And they had chosen their option. And they had also created a fallback, a Plan
    B.


    And so for the option, it was made up of two steps:

    Step 1: Completely bring the management team to speed with everything. His decision
    on the Values for the company going forward, the likely impact on Magna, and the
    Dan Randall story.

    Step 2: Ask for their help.

    That was it. They’d spent until 4 am and come up with a two-step plan that simply
    asked for help. But the request for help would come with an ‘opt out’ clause.
    And they had a Plan B, one which Callum and Paul were working on right now. Just
    in case.


    Everyone had received a text from Tom at 6 am, advising them had read the report
    on the Values exercise, and was calling a management meeting for 9 am to discuss
    it. He ‘urged’ everyone to clear their diaries and be present. They were.


