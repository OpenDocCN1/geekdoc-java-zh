    had enjoyed. It had shaped up as an excuse, because that’s what it had like when
    he delivered it, and he knew that OilSol saw it as a poor excuse for inadequacy.


    When he had finished his presentation, there had been a moment’s silence. Embarrassment
    or compassion Paul had wondered briefly at the time. Briefly, because as the Chairman
    thanked him for his frankness, one of the new members, one of the two from the
    OilSol Board, cleared his throat, looked at the Chair over his glasses and insincerely
    asked if he could table a question for Paul, proceeding to do without waiting
    for the chair’s permission.


    And the first question, like the quiet before a storm, seemed insignificant, Chris
    Myers asked Paul, “You set this company up yourself, didn’t you? You weren’t originally
    from the financial sector?” Paul explained about his parents’ situation, and how
    he had set the company up to provide a service that would lift the bar for the
    industry.


    “A man with a mission. Another type of white knight.” This from Kurt Balanski
    one of the most senior of the OilSol members. Was it a smile or a sneer? “Is this
    how you see yourself?” Then with the ‘smile’ firmly pasted on he added, “Perhaps
    more zealot than analyst.”


    Paul started to explain the analysis he had established with the actuaries, and
    their ongoing audit program, he knew sounded defensive, stumbling over some of
    the precise details and fud some of the data. But it didn’t matter because it
    was obvious they weren’t listening and before he got too far into the explanation,
    Chris interrupted, launching in to what could only have been a pre-planned argument.
    Clearly, and none too succinctly, he had outlined for the Board that they had
    had an independent firm of actuaries review the history of FutureSafe investments
    and returns, and that the actuaries had raised questions as to the composition
    of investments.


    A master of oration, he adroitly dropped in the word ‘fraudulent’, quickly smoothing
    it over by explaining that what they had found was not fraudulent, but likely
    misguided or an ill-conceived structure. While he couldn’t comment on the experience
    of the actuaries with whom Paul sadly formed this alliance, he could see that
    Paul’s errors had been those of judgement at the outset of his ‘white knight campaign’,
    which had been replicated over the years because they were profitable for Paul’s
    company. He then drizzled comments that they “appeared sound and safe returns
    for the anxious or inexperienced investor.” Finishing with: “And we are neither
    anxious nor inexperienced.”


    At which point, Kurt in to deliver the knock-out blow, stating to the Chair: “Which
    is why we have had to protect PETRA by recommending that they stay with Oilsol’s
    provider.” Turning to Paul said smoothly, “Your contract doesn’t come up for renewal
    for two and a half years, unless, as Clause 72.1.3 states, there is a corporate
    buyout. While it is PETRA who have taken us over, the clause still affords us
    the right to put you on three months’ notice of intention to withdraw. This gives
    you three months to match Oilsol’s provider, or the contract will automatically
    expire three months from today.”


    When Paul exited the station, he saw Anwar waiting for him, leaning on the side
    of his cab. As soon as he saw Paul, his face broke into a big beam, he opened
    the passenger door and with an elaborate, and slightly comical wave of his large
    arm, gestured Paul into the car, shutting the door as Paul sat. Paul smiled, despite
    himself, there was something about the big man’s such obvious and genuine pleasure
    at seeing him that lifted his spirits and made him feel worthy again.


