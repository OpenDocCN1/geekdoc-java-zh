    ## Chapter 2 - Underbelly


    They had introduced him to ''Values Inc.'' It certainly made sense. And he''d
    seen enough of Paul, Callum, and Jeremy over the last few months to know he could
    work with them, and that he could trust them as worthy business partners. What
    a long way they had come since that day he had hustled Paul down into the underground.


    The business side of the arrangement they proposed did not trouble him. His hesitancy
    was an irrational fear of giving up his independence. For 20 years he''d consulted
    under his own name and his own brand. Set his own direction, made his own decisions.
    Now he would have to involve others in the strategy, direction and functionality
    of a business. It would be a big change.


    On the other hand, he saw potential in Jeremy and realized this provided him with
    the succession plan his independence had deprived him.


    They weren''t asking him to throw his current business into the mix, this would
    be a new and separate entity. He could continue his current work, as indeed Paul
    and Callum would continue FutureSafe. Only Jeremy would be full-time in Values
    Inc., and any contribution made by Paul, Callum, and Richard would be out of profit
    share.


    Additionally, and generously, Paul was prepared to place the IP around the Values
    Model into Values Inc., as an asset they would all own and share.


    It was a no-brainer really. Richard saw the opportunity for what it was, and nodded.
    "This is good. This will work. If... Randalls will go for it, we have a platform
    client on which to build both in terms of the refined model, and the reputation.
    It is an opportunity that none of us should turn down. Thank you for asking me.
    Yes, I''m in.


    "But, the first thing we need to do is position it for Randalls, because if they
    don''t go for it, then there is no ''Values Inc.,'' and there may not be..." and
    Richard left the sentence unfinished, none of them needed him to spell it out.


    “Right, let’s whiteboard it.” Action now, Jeremy was on his feet. We start by
    designing the WIFM that Tom will need to see. The ‘What’s In For Me?”


    “It will need to go further than that,” said Paul, “certainly there is a WIFM
    for Tom, but there are criteria his Board will need that will extend it further.
    I think we start with the Board, and then create a personal WIFM for Tom. We’ll
    need to satisfy him on both, but the business and the Board will come first for
    him, underpinned by the components that satisfy his own personal desires for the
    business he wants to head, his strategy, his leadership style.”


    “Alright, let’s list it off – what do the Board need to see?” said Jeremy.


    “Well,” started Callum, “the Board are likely to be more the ‘what’ and ‘how’
    than the ‘why’. Six of the members are professional ‘board sitters’, only two,
    plus Tom, have worked in the industry and have a ‘why’ for what they are doing.


    “Their focus will be financial stability, reputation of the company, and overall
    governance. They will need to see these secure by both from the perspective of
    the company and also their own personal liabilities and reputations.”


    “Yes, but I think we may be overthinking this,” said Paul. Remember, the Board
    is already sold on the Values exercise. So much so they made the preposterous
    proposal to take Jeremy.” They all laughed.


    “What we are proposing”, he continued, “is that they ‘get Jeremy’ a different
    way. So in that respect, I think this is about Tom first, and then the Board.”


    "Tom is on a Values journey. And what he will be getting is four for the price
    of one," said Callum.


    "Yes, but two of the four benefit directly from the outcome. So it isn’t really
    much different from what he’s got now. He’s trying to ensure impartiality, and
    that may be why he wants Jeremy extracted from FutureSafe and working for him."
    Richard said thoughtfully.


    "You know," he continued, "I think the reality is that we don’t fully know why
    Tom wants Jeremy. There could be something he’s not told us."


    "I don’t think the impartiality is the issue," said Paul frowning. Remember what
    he wants from Jeremy is a north-south-east-west appraisal of his company and a
    Values application across whom who they are. It’s then applied externally to market
    and customers, internally to staff and product development. It is only when this
    is completed that they will be considering the cross-fit with suppliers, so it
    could be a year before we come back under the spotlight, by then the model will
    have been proven."


    "This isn’t just about us; in fact, it isn’t about us at all. At the moment we
    are entirely inconsequential to what Tom is trying to do, the only thing that
    puts us in the frame is because..." and he held up his fingers to tick off the
    points “…1) we started the process and 2) we ‘have’ the person who can do the
    project."


    "And we, you own the IP that is needed to do the project." prompted Jeremy.


    "You know what I think?" said Richard, "I think this is a discussion with Tom.
    It’s not a proposal or presentation, it’s a discussion. It’s Paul and Jeremy sitting
    down and talking it through reasonably and logically with Tom, explaining it to
    him and coming up with a joint solution.


    "Much of business is about collaboration rather than positioning. Put aside the
    proposals, the tenders, the JVs; the enduring relationships are those where everyone
    understands what everyone else needs, what they can and can’t deliver, and how
    they will benefit from the union that is created.


    “So, like everything else in any kind of relationship, good business comes down
    to good communication, and this is the time you really need to talk to Tom. Get
    him out of his office, out of ours, meet somewhere mutual and out of the spotlight.
    And just talk.”


    ## Chapter 3 - Face Off


    So this was what fear felt like. Knowing that you didn’t have control, that your
    fate lay in someone else’s hands. Someone who did not consider your fate as important
    as their own. It may not be life and death, but in the corporate world, this type
    of crash was a death. Death to a company, the end of people’s jobs, financial
    ruin for many.


    And the man with this power, the man in control, in whose hands his fate lay,
    was angry.


    Jeremy knew Tom was angry, even though Tom had his back to him. Standing on the
    ship’s deck, his broad silhouette bathed in moonlight, the illuminated buildings
    of the city a glowing backdrop as the paddle steamer propelled its way. Individually
    inconsequential, collectively humming the city’s anthem. Tom had agreed it was
    a good idea to escape his office, and the media, and meet on the paddle steamer.
    No prying eyes, no listening ears. Anyone observing the three men at dinner would
    have thought they were just friends, enjoying each other’s company. Large, congenial
    man seemed to focus much of his attention on the youngest of the three. But these
    outward dynamics were not the reality for those around the table. They all knew
    what was at stake, that it was kind of game, but one that could end in deadly
    consequences for someone. And after dinner, they had taken their drinks up to
    the top deck, to enjoy the cool evening, and the obscurity offered by darkness.
    And with the darkness came the bravery Paul sought. Tom sat quietly through Paul’s
    explanation as to why Jeremy could not, would not, go for Randalls, and indeed
    how Randalls would benefit from Jeremy’s slightly distanced perspective. Realizing
    that, genuine as it was, sounded like a ‘sell,’ he added Callum’s wise words,
    “Vision is a gift of sight distorted by proximity”. He paused, sensing Tom’s mounting
    resistance, but knowing that he had to press on, he explained the establishment
    of Values Inc., carefully framing the explanation that would reveal to Tom the
    value of what would be the Jeremy/Richard package. Abruptly Tom stood and strode
    to the side of the boat, gripping the railings, staring sightlessly at the passing
    panorama. Motionless, soundless, but the anger oozed out of him, smothering Jeremy.
    Sometimes when you are afraid, when you face your worst fear, there is a moment
    of absolute clarity. And when that moment arrived, Jeremy was calm. He went and
    stood beside Tom and dropped his voice so only Tom could hear. “We’re not yours
    to take. Paul’s IP is Paul’s IP. And I am not chattel. We come willingly, or not
    at all.” And his bravery mounted he continued evenly, “And you can choose to destroy
    us, but understand, the decision make tonight will set the foundation for your
    own Values.”

