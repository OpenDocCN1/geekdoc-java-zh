    of nothing but survival. Then with her Mother gone, she only needed to care for
    only herself. She had time to think about what she wanted for her life. Almost
    19, she took stock of her assets. What did she have that she could sell? No tangible
    assets. But she knew she was her Father’s daughter and her assets were that she
    had inherited the gambler’s genes.


    But she had more than he, so much more, because she had freedom from expectation.
    Without family, friends, or connections from her childhood and her past, Anna
