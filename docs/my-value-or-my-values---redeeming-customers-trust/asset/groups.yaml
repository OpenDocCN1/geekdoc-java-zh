    ## 第14章 – 丘吉尔的精英


    你闻到的不是成功的味道，杰弗里刻薄地想，那是你那根臭雪茄的味道。


    杰弗里对 艾克（Ike）的反感随着每次会议而加剧。已经开了三次了。但他知道，如果他对丹·兰达尔（Dan Randall）复仇，就需要艾克的人脉以及艾克对收购兰达尔的渴望。诚然他会成为傀儡总统，但他不在乎，他已经从丹手中夺走了他的公司，而且无论如何，傀总会有机会扯断某根弦。


    而当他真的那样做时，艾克会是第一个牺牲的。杰弗里笑了。那微笑让艾克误以为是认同了他关于“闻到了成功的甜味”的评论。艾克准备好采取行动了。一切已准备就绪。故事准备好向
    Magna 董事会公布。他在董事会内部的消息来源已向他保证，董事会不高兴的。他们不会轻视兰达尔家族的这种行为，那会让市场认为他们的消息来源存疑。而这还是源于一家自身背景就不仅仅是“存疑”的公司。


    不幸的是，他在 Magna 的线人无法让艾克在本月的会议上与董事会“会面”，所以几乎还要等七周才能提交他的揭料。他将安排揭料在他们所有的出版物中同步发布，正好赶上董事会。兰达尔家族想表现得那么纯洁不染，他们正在进行“价值观”练习，是因为他们质疑自己媒体来源的诚信，而他们自己却建立在这样的腐败之上，这种冲击将不仅会动摇他们的出版界，也会波及丹本人。他知道这不会止于此，他正在引发一场将吞噬艺术界和博物馆的海啸，并将直接横扫南美政治与金融的微妙平衡。


    是的，一切都已近在咫尺，他已经闻到了。他必须再保密一会。与此同时，杰弗里正沉浸在自己的世界里，让思绪飘向了经营兰达尔家族会是什么样。随着他的母亲担任他们的法律顾问，两人的复仇需求都能得到满足。在管理上，他需要因为这项“价值观”练习而做一些调整——“免责声明羞辱者，”他在内心畏缩地想。兰达尔作为出版商的声誉将受到严重破坏，他们能保住“免责声明羞辱者”这个目标就谢天了。“可验证的价值观”将是一个被长期遗忘的梦想。


    那么查德呢，该对查德怎么办？看到查德今天早上来，他很惊讶。好吧，他既惊讶也不惊讶。这恰恰是查德会参与的项目类型，所以其实并不意外。他喜欢查德，查德对他很友好。遗憾的是，查德的成果将被摧毁。


    当艾克正慢慢沉浸在威士忌的醇厚陪伴中时，杰弗里想起了十年前和查德的时光。那时杰弗里还是一个崭露头头的量化分析师，玩股市，而查德和他开启了一个交易组合。当市场崩盘时，查德亏了一大笔钱，杰弗里一直记得查德告诉他这件事时的反应。其他投资者都在借此发泄，理性地将其归咎于整个市场的低迷。得过。但查德的反应只是——“你怎么样？你整体一定遭受了相当严重的损失。”


    这就是卡拉姆在他们上车后那个疑问式的陈述：“你还需要问吗？”


