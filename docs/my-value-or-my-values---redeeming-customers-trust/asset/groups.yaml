    disappearance isn’t the mystery being played out in the press. Ike will be in
    some hole licking his wounds. He’ll re-emerge when he’s ready.


    He held up a bottle of white wine with a questioning smile on his face as Abby
    stepped onto the deck. She beamed and nodded ‘Thank you’ to his unspoken question,
    and he poured a glass, worried about the look of exhaustion on her face. “I know
    you were right deciding to handle the press on your own, I feel so guilty letting
    you do it.” He grimaced.


    She accepted the glass and smiled at him, “I know you do, but it was the only
    way. It’s not the right time to answer all their questions, and equally not the
    right time for you to be deflecting. On my own, I can get away with ‘That’s not
    clear yet’, and ‘I don’t have the authority to comment on this’, with of course
    the fixed position of ‘This will be covered in next week’s press statement which
    will be shared jointly with Randalls and Magna.’ ”


    “What was the focus of the questions?” asked Matthew, “The Dan story or the Randalls-Magna
    merge?”


    “Well,” Abby sighed deeply but turned appreciatively to Sam. “The release of your
    book has just exactly what you planned it would do. Writing the history/biography
    of the company through the years as it was actually happening ... and she paused,
    tears welled up in her eyes, “it served every purpose you desired. It was clear
    from the questions that people ‘got’ the story. A biography whose ending they
    witnessed. You told the story of the development of Randalls in a way that the
    readers experienced its journey, and so then when it gets to the now, the Dan
    story, they can feel the mix of emotions and frustrations that we all felt. They
    share the feeling of betrayal.


    “The chapters we wrote in the War Room, where we shared the difficulty in making
    the decision to stay with our Values, the Values we identified in the Values exercise,
    and in doing so to tell the truth about what we had discovered, reinforced the
    feelings of betrayal. By that point, the readers are right there with us, and
    in the main, they get it. Even the press gets it.” She laughed cynically.


    “What were the questions around the decision regarding Dan’s estate?” asked Tom.
    “How did you handle the criticisms that have arisen that I should have gifted
    this money back to South America.”


    “I think the best we can hope for this moment is that they maintain a ‘wait and
    see’ attitude,” replied Abby thoughtfully. “at least until next week’s Randalls-Magna
    joint press conference. But we will really need to be prepared with good proof
    of the Trust you have set up. Answers won’t be enough, not even with the lawyers
    present. Effectively, it still looks as if we used the funding from Dan’s estate
    to take the majority share of Magna – funds from an estate founded on ill-gotten
    gains.”


    “Well, by next week, we will have all the legal requirements established for the
    Trust, and we will also have at the press conference the Antiquities Minister
    from Peru and the Cultural Attaché from Chile together with a senior auditor from
    the Trusts and Investments division of Federal Treasury,” said Paul. “His presence
    alone will substantiate that the Trust has been established, its purpose, and
    the controls that will be set and maintained.”


    ## Chapter 15 – Goodbyes and Gains


    “But, yes,” admitted Richard thoughtfully, “It is a stretch for people to believe
    that the net worth of funds will render as much, if not more, revenue than what
    is available now from Dan’s estate – let one that truly will find South American
    ecology R&D, and the location and return of antiquities.”


    “Were there any questions about Anna and Geoffrey?” asked Sam.


    “Not really, there was some speculative comment, but it wasn’t for me to reply
    to. The fact that legally none of Dan’s story can be substantively proven may
    have exempted Anna from legal redress, but she and Geoffrey will fight public
    opinion forever unless they do something to compensate, that they’ll be their
    look-out.”


    Jeremy undoubtedly fresh bottles of beer and then sank into a chair. He watched
    the paddle steamer chug its way up river and remembered the night he had stood
    on the deck with Tom, telling him he wasn’t a chattel. And he remembered the anguish
    of Tom’s reply that what he faced was bigger than a Values exercise. But it wasn’t.
    A bigger exercise certainly, but not bigger than Values. It was the Values exercise
    that had saved them. Saved them and Magna.


    He absent-mindedly fiddled with his phone and clicked on the Values chart for
    Values Inc., up came the picture he took back at Lake Inchakata.


    - 1. Why do we want to help corporates develop their Values?

    - 2. Why will corporates want us to develop their Values?

    - 3. How will Values add value ($) to their product, their customers and staff?

    - 4. How will our Values add value ($) to our product, our customers, our staff?


