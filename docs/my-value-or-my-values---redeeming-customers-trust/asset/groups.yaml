    ## Chapter 8 – Protecting Petra


    financial provider for OilSol give them such high returns for such a low entry
    fee? How was it possible? And his shame returned. He was ashamed. Ashamed that
    he had not done a better job of presenting the Value Pyramid. Ashamed that their
