    # Chapter 10 – ROR – Return on Revenge


    As he grasped each detail and mentally checked it off against his own knowledge,
    Ike realized Geoffrey still hadn’t told him ‘why’ he would tell him the story.
    Geoffrey knew he couldn’t stop him from publishing. Yet neither tried nor asked
    for anything. What did he want? Recognition? Money? What was his motivation?


    But slowly it emerged. Geoffrey, the illegitimate son Dan refused to acknowledge,
    wanted Dan’s acknowledgement – nothing else. The great hero DanRan – not only
    was he not the eco-warrior the world believed, not only did he have a son with
    the woman behind the antiquities fraud, but he was now publishing material from
    unreliable sources, entirely contravening the fundamental ‘uValue’ upon which
    Randalls had been built.


    It was a story, indeed. A scoop of a story. But Ike knew it was more than that,
    this is what would knock Randalls off the block with Magna Media and give e.Celebs
    the opportunity to take their place. But even more than that, he could deliver
    on his promise to Mack Spencer and the Board - Randalls!


    And what did Geoffrey want? He wanted only one thing. He wanted to deliver the
    news to his ‘Father’. The Father who had denied him his rightful place in the
    organization and his legacy. In other words, Geoffrey wanted Randalls. High stakes
    indeed.


    But Ike wasn’t ready to show his hand yet. He feigned curiosity. “I don’t get
    it. Why the fuss? A simple disclaimer would resolve any problems – it’s what we
    do. We get ‘info out’ – that’s what our readers pay for. OK, it’s sometimes, often,”
    he soothed uncaring, “not correct – what does it matter?” He spread his arms wide
    and shrugged his shoulders emphasizing his disinterest. “As if anyone really cares.
    And the celebs ... well, no publicity is bad publicity so if it’s incorrect, or
    even untrue.” He snorted his spittle laugh.


    “Randalls have a different audience, a different readership.” Geoffrey surprised
    himself by his sudden leap to'
