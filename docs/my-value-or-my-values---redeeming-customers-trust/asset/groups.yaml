    was tired of them. His focus was not on the excuses but on what to do. What to
    do with the information that would destroy them.


    Tom got up and went out onto the balcony. He stood looking at the night panorama,
    stars, and stripes. Star light and city lights, striped with the ribbons of shadow
    from the river and its tributaries, weaving through the city like a dark reptilian
    mass, the multi-armed serpent that rose from Pandora’s box.


    Tom shivered slightly, not from the fresh breeze, not from a premonition nor a
    memory, just a shiver. There had been heated debate in the Boardroom today. The
    Board members were not so much divided as undecided. Go public – bury it. If they
    went public, it would look better coming from them, and they could manage the
    situation, put PR spin on it. Bury it and they risked coming out in an entirely
    uncontrolled and unmanageable way. Either way, they were opening Pandora’s box.


    So there had been a temporary decision. A partial decision. A cop-out in Tom’s
    view. Let Jeremy, well Values Inc., do the Values exercise. Wait and see if they
    find it. If they do, then the Board will declare. If they don’t ...


    And Tom had told Dan. Dan had erupted in righteous indignation. Anger, justification,
    bluster. But now all was quiet and Tom turned and stood in the doorway looking
    at the scene before him. Dan quiet, smiling, peaceful, mellow. Yes, ‘Jack lived
    here’ alright, and Jack was home.'
