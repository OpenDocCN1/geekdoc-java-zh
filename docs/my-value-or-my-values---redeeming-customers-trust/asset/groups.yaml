    ## 第九章 – 赌徒的基因


    预示着一位拯救星球的超级英雄——这太让人上瘾了。当丹（Dan）意识到他的“生态战士”名誉是如何获得资金支持时，已经为太晚了。


    起初，当他听到文物丢失或在运输过程中被误投时，很容易装出失望，甚至是担心。但最终，那个应而生支持他工作的组织已经变成了一台极其精密的机器，使他能够从心理和生理上与那些资助这一切的盈利机制隔离开来，而这一切的初衷是一个对人类至关重要的目标。随后，他背过身，拒绝了那些归根结底只是流言和暗示的信息。他顺从地安抚自己，这一切完全不配引起丹·兰这位伟大的生态战士（DanRan）的关注。


    出版公司是一个绝佳的解决方案。这是安娜（Anna）的主意，在恩里科（Enrico）的压力下，为了给丹寻找注意力，因为这位强大的战士已经厌倦了他的雨林探险之旅，并开始考虑退休。如果他这样做，目前以他的名义运送且未受当局检查的货物将受到审查，恩里科无法承受这种特权的丧失。恩里科已经向安娜说得很：想办法让丹继续领导这个组织。


    而将他们的儿子放入出版公司，担任一个非管理性的监察角色——这简直是一记神来之笔。


    ## 第十章 – ROR – 报复回报率


    艾克（Ike）举起水瓶喝了一口，犹豫了一下，然后继续喝。他并不渴。这只是一个停顿。他知道如何利用沉默。多年来他进行过无数次采访；他对停顿技巧的运用堪称炉火纯青。


    水拍打着码头的柱子变得愈剧烈，受到路过的河船尾波的推动。艾克允许自己被他们的喧闹分心，这有助于缓解等待。他靠在栏杆上望向对面，河流在这里是最窄的，对岸清晰得他可以观察岸边行走的人，像窥淫者一样参与到他们的活动中。瞬间，他的注意力落在一对看起来很熟悉的夫妇身上，他们是处于毫无防备私会中的明星。他的手自动开始伸进口袋，寻找他为了应对此类机会而随身携带的小型相机。接着他想起了优先事项。他正在等待，试图在沉默上胜过他的线人。


    但乔弗里（Geoffrey）很厉害。多年来在兰德公司（Randall corporation）中潜行，察觉而不被察觉。沉默是他磨炼出的一种技能，他也对此精通。。于是，他们在沉默中站着。线人和审问者。各自想要从对方身上得到什么，谁也不准备移动。


    于是艾克放下饮料，问出了问题，知道提问可能会吓到乔弗里。但乔弗里已经准备好开口了，他的犹豫只是他游戏的一部分。


    “汤姆（Tom）认为组织里有某些不对劲？”

    乔弗里对艾克的问题心不在意地耸了耸肩，用另一个问题回答，保持着游戏的节奏：“但那并不是真正的问题，不是吗？真正的问题是到底有没有东西不对劲。”然后他用戏剧性的姿态喝光了整瓶啤酒，“砰”地一声放下，说道：“确实有……”


    艾克开始想问“为什么”，但停顿了，转头看向乔弗里，转而问：“你为什么要告诉我这些？兰德家族背景里有黑料对你有什么好处？所以他们正在做一项‘价值观’练习。管理团队认为这是为了给读者创造更好的价值，增加或恢复他们打印材料的完整性。但你所说，汤姆这样做是因为他认为某些东西不对劲。而你说汤姆是对的。那么你认为那是什么？”


    “我不去思考。我知道。”乔弗里转头看向艾克，观察他话语的影响。他重复道：“我知道。我知道什么不对劲。是我。”他大笑起来。那是一种沙哑的笑声，纤细而高调。对于已经对不愉快之物产生耐受受的艾克来说，这种笑声令人不悦。


    乔弗里向艾克讲述了那个故事。他是丹·兰德（Dan Randall）和安娜·德拉文斯基（Anna Dravinsky）的儿子。他的姓氏注册为德拉弗斯（Dravers），所以他们三人之间没有联系。首先，这是为了保护，因为安娜担心恩里科的影响力；然后是为了隔绝，防止公司内部知道这个故事。


    最后，乔弗里停止了玩他的小游戏。他向艾克讲述了古董交易的情况，无意中证实了艾克收集到的信息碎片，同时填补了艾克知识中的空白。这个故事在艾克面前展开得如此详细，他没有理由怀疑其真实性，但它是如此引人胜，以至于他甚至无法在脑中感知到拿到这样一个大磅故事时通常会有的兴奋。


    当他抓住每个细节并在脑中对照自己的知识进行核对时，艾克意识到乔弗里还没有告诉他“为什么”要讲这个故事。乔弗里知道他无法阻止出版。然而他既没有尝试也没有要求任何东西。他想要什么？认可？钱？他的动机是什么？


    但答案慢慢浮现了。乔弗里，这个丹拒绝承认的私生子，想要丹的认可——别的无。伟大的英雄丹·兰——不仅不是世界所相信的那个生态战士，不仅和那个文物诈骗背后的女人生了一个儿子，而且现在正在出版来自不可靠来源的内容，完全违背了兰德家族赖以建立的基础“价值”。


    这确实是一个故事。一个头条新闻。但艾克知道这不仅于此，这将把兰德从麦格纳媒体（Magna Media）手中击落，并给电子明星（e-Celebs）提供取代他们的机会。但更重要的是，他可以兑他对麦克·斯宾塞（Mack
    Spencer）和董事会的承诺——兰德！


    而乔弗里想要什么？他只要一件事。他想把消息传给他的“父亲”。那个剥夺了他在组织中应地位和遗产的父亲。换句话说，乔弗里想要兰德。代价确实很大。


    但艾克还没准备好出牌。他假装好奇。“我不明白。大惊小怪什么？简单的免责声明就能解决任何问题——这是我们的做法。我们让‘信息出来’——那是读者付钱的原因。好吧，有时，经常，”他漫不在心地安抚道，“不正确——那又紧？”他张开双臂耸了耸肩膀强调他的不在乎。“好像真有人会在乎。至于那些明星……好吧，没报道也是坏报道，所以即使是不正确的，甚至是虚假的。”他嗤的一声笑了起来。


    “兰德有不同的受众，不同的读者群。”乔弗里突然跳出来辩护让他自己感到惊讶。他停顿了一下恢复冷静。“好吧，那是‘他们’说的。”他笑来掩饰不安。“这项‘价值观’练习不仅关于公司价值观，以及发现公司内部是否有任何问题，还关于理解如何为读者给产品定定‘价值’。


    “管理团队一直在发送关于他们在做什么以及为什么要这么做的简要介绍，他们组建了一个由公司各个部门的人员组成的‘焦点小组’。我设法让自己被选进这个小组，”他翻了翻白眼表示鄙蔑。“显然，我需要搞清楚发生了什么，”他没必要地解释道。


    “财务部对投资回报率ROI估值进行了财务分析，”乔弗里俯视着解释道，他知道艾克懂财务术语，“也就是说，他们对核实和未核实材料之间的价格差异定了一个金额。这是一个指标，他们成功地让它看起来非常复杂，但基本上是对高验证成本
    = 高封面成本 = 低读者量对比低验证成本 = 低封面成本 = 高读者量。”


    “他们比较了不同的出版物，包括你们的。”乔弗里变换语调以引起艾克的波动，而这起效了。艾克猛地抬头看向他。


    “噢是的，他们对你们的出版物有一些有趣的市场信息，包括它的方法和来源。但无论如何，”他流畅地继续道，“这对他们来说只在他们的‘价值观’练习中有意义。”


    乔弗里从夹克的口袋里掏出几张A4纸。它们看起来很破旧，但他把它们递给了艾克。艾克随意地打开它们，看到了财务指标和市场信息。他看到了公司的名字，但没有在那细节上停留。没有理由表现得太感兴趣。


