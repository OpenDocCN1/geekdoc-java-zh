    # # Chapter 1

    Hostage


    “Vision is a gift of sight distorted by proximity.”

    Paul’s tirade was halted by Callum’s soft tone, and when he was settled, Callum
    continued, “Too close, and the vision is confused with detail. Too distant, and
    the vision is uninformed; it can be irrelevant, impractical, undoable.”

    And Jeremy understood.


    But it was so strange listening to their discussion. He felt detached. And yet
    it was all about him. His work, his job, his career, who would be working for.
    And yet Paul and Callum talked about him as if he wasn’t there.


    They had talked about it and around it all the afternoon. Coffee and food scraps
    were strewn over the table in Paul’s office, mere sustenance to dull the hunger
    pangs while their minds were focused on separating logic and reason from emotion
    and anger. Jeremy got up from the table and walked over to the window. Switching
    off the sound of their machinations, he let their voices become a dull backdrop
    to his thoughts as he looked out at grey clouds colliding in their eagerness to
    drop their rain bundles. He smiled, despite himself, at the cool relief of the
    rain after the heat of morning, but it was doing nothing to cool the temperature
    in the room, Paul’s anger kept it well above ambient.


    The offer Randalls had made him affected them all. It would save or break FutureSafe.
    But it made him feel like a'
  - '[PAGE 17]


    hostage, as Randalls and FutureSafe discussed and negotiated his future. What
    they each wanted of.


    That morning Paul had met with Tom Medici, CEO of Randalls, to review the progress
    of the audit that would determine or not Randalls would retain or cancel their
    contract with FutureSafe. If they cancelled, it would likely kill FutureSafe dead
    in the water. It wasn’t just the loss of their largest client, it was the media
    attention the situation had attracted that would certainly cause a landslide.


    But Tom had completely spun them on a dime. They would stay with FutureSafe if...
    FutureSafe gave them Jeremy.


    And here was Callum Paul ... what? Not to ‘give up’ Jeremy? No wonder Paul was
    apoplectic.


    But what about him? Monkey in the middle. After all he had done, all he had achieved,
    not only could work save FutureSafe but Randalls saw the value. He had had the
    courage of his convictions, joining, leaving, then re-joining FutureSafe, in conducting
    the Randalls/FutureSafe Values match — but all it had done was reduce him to a
    mere bargaining chip.


    He had initially the courage of his convictions to leave a high paying but unsatisfactory
    job to join CountryWide Holdings, as FutureSafe had been back then, because he
    totally bought in Paul’s passion to change the industry. Passion born of the losses
    witnessed his parents suffer at the hands of the greedy and irresponsible brokers
    and quants who had mishandled their superannuation and savings portfolio.


    He had watched spiral downwards, away from their purpose, their values.


    And he had had the courage of his convictions when he had told Paul and Callum
    where to ‘stick’ their job, when they wouldn’t see the downward spiral.'
