    ## Chapter 12 – Double Fugu


    supported the fully verified material. Everyone had nodded. He then announced
    that he was 100% in support.


    There were cheers and high-fives as the management team were elated at the decision
    that would, in their view, bring the company back to its former glory.


    Tom reminded him that he would need to put this to the Board, as it was ultimately
    their decision, taking into account shareholder and investor interests.


    “But that’s just rubber stamping,” said Sam, CFO, confident his 25 years with
    the company gave him powers of predictability. Though as creator of the ‘Disclaimer
    Shamer’ catch-cry his was, nonetheless, a slightly colored view.


    “Well,” said Tom, “we need to talk about this. I’m going to fill you in on some
    background. I’m about to tell you what stays in this room. Regardless of what
    you each decide at the end of this meeting, I need your sworn promise that it
    will go no further – until we have agreed how we are going to manage this.


    “Regardless of what we ‘each’ decide?” asked Abby, head of Marketing and Publicity.
    Words were her ‘thing’ so she quickly picked up on the implication. “You make
    it sound individual, not inclusive?”


    “Yes,” replied Tom, “there will be individual decisions you will each need to
    make. Because, when you’ve heard what I have to tell you, you will realize the
    battle we will have ahead of us. And I’m going to offer you all an ‘opt out’ option.
    If anyone opts out, their job is secure, they will continue in their role with
    the complete understanding of each of us.


    “Why wouldn’t we want to be involved?” echoed James and Matthew, COO and HR.


    “Your solemn promise first,” said Tom firmly, “nothing is said outside this room
    until those who freely choose to be involved in this ‘project’ have agreed what
    is to be released, and when.”


    “Even to the Board?” asked Sam.


    “Nothing is to be said outside this room...” Tom repeated. Abby raised her hand
    first, and quickly everyone followed. Tom looked at Richard and Jeremy, they nodded,
    and he started. Started the story that marked the beginning of the end.


    But the end of what? The company or this chapter of the company’s history? Tom
    didn’t allow himself to think about this or their Plan B. He just told the story.
    Dan’s story.


    When he had finished there was silence, and before anyone had time to start asking
    questions, he launched into the second fugu story – Magna Media.


    “So you see, we have what I call two ‘fugus’. Having decided that ‘fully verified’
    is both our value and our Values, and will ultimately bring the profit we need,
    then this must start with the story of our own company, the Dan story, and then
    the material we obtain from Magna. Unlike the chef serving the fugu, who gets
    to extract the toxicity before serving, we will be swimming in toxicity as we
    release the Dan story, and again when we tell Magna our decision. What we don’t
    know is how much toxicity, and whether or not it will be fatal.


    “So, this is why I’m giving you all an ‘opt out’ option. We have a lot of planning
    to do, I have brought this to you before deciding our course of action on each
    of the fugus. The next few days will involve tiring and stressful planning – but
    it will be nothing like the next few weeks that are ahead of us. And we may or
    not survive this,’ he added solemnly. ‘that’s why you must each decide what you
    would like to do. Each one of you have different career, personal, and family
    needs. If, for whatever reason, you don’t feel you can, or want to be, involved
    with this, now is the time to say. None of us...’ and he looked at each of them
    individually, ‘will make any comment or criticism of anyone who decides to opt
    out.


    “And now, we will take an hour’s break. Please go and get coffee, go for a walk,
    whatever you need to do. But in an hour we will start the planning ... with those
    who return to this room. Those who don’t return will simply go back to their jobs,
    and there will be full acceptance of your decision. We ask nothing more than that
    you stay entirely silent on these matters.”


    ## Chapter 13

    Reclaiming Petra


    Paul and Callum did not speak. They did not even glance at each other. Too many
    people, too many security cameras. Who knows who is watching. They walked out
    of the building, got into the car. Paul said one word, “Beer."


    Callum replied flatly, “Of course."


    Ten minutes later, sitting in a nearby bar, Paul asked, “Do you agree?"


    To which Callum had replied, “You need ask?"


    The news of the blowout on the rig off the coast of Nova Scotia had made world
    headlines, all the more because of the huge ecological damage in addition to the
    men killed and injured. Three killed and 11 seriously, and likely permanently,
    injured. For PETRA one engineer amongst the dead and five engineers seriously
    injured.


    Paul had received the email “summons” from PETRA’s CEO, Peter Brabant, with annoyance.
    Sure he’d go and see him, but surely Peter couldn’t think they wouldn’t accept
    the claims of the six engineers’ families, even though right on the edge of the
    notice period. It wasn’t a question Peter needed to ask, let alone get him to
    come and see him.


    Since the day Paul had been crucified by the PETRA/Oilsol, the next afternoon
    had seen them sitting in Peter’s office, and when finished, he had called for
    his PA to clear everything away. Only then the tempo changed.


    “I’m sorry I didn’t tell you why I needed see you,” he started, “but it wasn’t
    appropriate to discuss by email. You’ve been very considerate offering early advice
    of your decision not to match the Oilsol policies, and in the offers of assistance
    you have made to PETRA staff.”


    “Thank you,” replied Paul, but when we knew we couldn’t match the Oilsol policies,
    to withheld this information until the end of the notice period would have caused
    disruption for PETRA staff. This was not something we wanted to happen. The sooner
    the switch occurred for them, the better. That’s what these policies are all about
    of course.


    Callum had understood quicker than Paul. “So the high cover and low rates were
    simply there because there were no policies?”


    Peter nodded. “I could tell you a story of layer upon layer of fraud, with international
    connections and monies dissolved in untraceable offshore accounts. All the right
    authorities are working on this,” he shrugged, “but what I need to talk to you
    is about the Oilsol staff. They’ve been paying into a non-existent fund. The blowout
    on the rig has literally caused a ‘blow out’ in terms of the insurance cover.
    When the families of the affected engineers started the claim process, everything
    ‘blew up’ to speak,” Peter said wryly.


    Silence. Each man thinking his own thoughts. Two Oilsol engineers died, and six
    badly injured. No payouts for their families, and no long term care. No lump sum
    payments or ongoing payments for the families. No safe future for all the Oilsol
    employees. And the money they had invested gone.

