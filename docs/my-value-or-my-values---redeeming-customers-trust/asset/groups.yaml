    # 核心要点


    即将击败他们，而这正源于创始人本人。


    如果……管理团队决定面对产量分配市场，并通过与 Magna 的合作保护他们的未来，采用未经验证的材料并包含真实性免责声明的风险更小且利润更高，会怎样？


    谁会责怪他们呢？这在商业上是合理的。


    价值观，如果切实际并被遵守，就能创造出将“商业合理”转化为行动和交付的立场，从而保护金钱和利润，并最终验证公司的存在价值。


    记住第一卷中关于战术大师孙子的论述。他教授的战争战术包括诡计和正战，而其发生的条件和时代是让我们无法想象比拟的。但他享誉国际的《兵法》中最为持久的哲学思想之一是……


    “战争中取得成功的五个基本因素：


    - 天气

    - 领导力

    - 军事原则

    以及最重要的是……

    士气的影响。”


    价值观、道德——它们对于赢得古代中国的王国之战至关重要，对于赢得当今商业的利润之战也至关重要。


    # 价值观三部曲 - 第二卷 挽回客户信任


    如果你想读那些教你该做什么、如何创建更好的业务、如何避免陷阱的商业书籍，请不要读任何“……策略（Strategies to Go...）”。


    “随行策略……”就像外带咖啡一样，是你可以带走、随手翻读，并根据什么对你和你的业务最有效来得出你自己的结论的故事。


    它们基于真实故事，并如实是地讲述了商业中真实发生的一切，让你能够学到适合你需求以及你业务战略需求的教训。


    我们大多数人生命中 1/3 的时间在睡觉（至少）在工作，然后把其他所有事情都挤在准时完成的最后 1/3 时间里，我们难道不应该非常清楚每天早晨去上班要做什么吗……


    这本书以独特的方式讲述了一个故事，并没有直接给出答案，而是带你找到你自己的答案。毕竟，以及你的生活。你选择做的事可以定义你是谁。如果你选择与志同道合的人在一起，你们可以创造改变并成就伟业。同时，你可能还会乐在其中，并做真正有意义的事情！


    如果你有其他选择，你可能会错过……这取决于你……


