    ## T-Shirt Leaders’ Interviews


    Following are three profiles from business leaders who have been there, done that
    – and worn the T-shirt until it is threadbare.


    The companies they run vary, as do their management styles, industries and clients.
    But what remains a constant are the similar issues they have each faced, and still
    do.


    Along with their personal experiences with Value, Values and Profit, they also
    offer their own advice to the leaders in the book.


    ## Chapter 16

    ### Peter V – Augen Software: Values Happen ...


    Interview with Peter V, Chief Executive Officer, Augen Software.


    Augen Software deliver quality outcomes to technology needs, providing solution
    consulting, architecture, business analysis, project management, integration and
    testing services for all applications that provide for the development of businesses.


    Values Happen ... quite naturally when like-minded people share common goals and
    methods.


    Did we have a planning session and choose a set of Values or a guiding principal
    like FutureSafe and Randalls? Not as such, but we do a lot of planning together,
    and we have developed aligned philosophies that have guided us as we have developed
    our business, which we strongly and openly advocate.


    Paul has battled alone to set up his business, based on a value philosophy he
    believed in passionately. And we saw in the first book that this ''passion'' wasn''t
    enough to keep him on track when the business grew and it became financially challenging.


    Why? To guide us in our decision making? Not Really. To help us avoid deferring
    to those decisions we aren''t wholly comfortable with so are labelled


    So on his own, he lost his way, but the people he has now drawn around him, and
    whom


