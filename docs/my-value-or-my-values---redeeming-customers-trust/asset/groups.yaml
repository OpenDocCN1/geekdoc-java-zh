    深入了解杰弗里后，尽管他经常质疑对方的优先事项排序，但他仍然承认杰弗里在实现他所拥有的一切方面付出了努力。他为一个非理性的市场创造了一套逻辑，而这一事实并没有削弱杰弗里成就的价值。对于所有在该领域内“博弈”并相信他们共同遭受损失的人来说，情况都是如此。


    至于伊克（Ike），怎么看他呢？嗯，汤姆从哲学角度思考，他是为了一个雄心勃勃的目标而战；他会战斗另一场，用另一种方式，在另一天。他的消失并不是媒体上正在上演的谜团。伊克会在某个黑洞里舔伤口，等他准备好了，就会重新出现。


    当阿比（Abby）走上甲板时，他举起一瓶白葡萄酒，脸上带着疑惑的微笑。她微笑并点头，对他未说出口的问题回答了“谢谢”，他倒了一杯，担心她脸上露出的疲惫神色。“我知道你决定独自处理媒体是正确的，让我让你这么做我感到非常内疚。”他皱了皱脸。


    她接过杯子对他他一笑：“我知道你是这么想的，但这是唯一的办法现在不是回答他们所有问题的时机，同样不是你推卸责任的时机。我一个人，可以用‘这还不清楚’以及‘我没有权限对此发表评论’来脱身，当然还有固定的立场：‘将在下周与兰道斯（Randalls）和麦格（Magna）联合发布的新闻中说明。’”


    “问题的焦点是什么？”马修（Matthew）问道，“关于丹的故事，还是兰道斯与麦格的合并？”


    “嗯，”阿比深叹了口气，但赞许地看向萨姆。“你新书出版的效果完全正如你预期的那样。通过记录真实发生的多年来撰写公司的历史/传记……”她停顿了一下，眼中泛起泪光，“它实现了你想要的每一个目的。从问题中可以看出，人们‘读懂’了故事。这是一部他们见证了结局的传记。你讲述兰道斯发展过程的方式让读者亲历历了这段旅程，因此当涉及到现在，即关于丹的故事时，他们能够感受到我们共同经历的那种复杂情感和挫败感。他们也有被背叛的感觉。


    “我们在作战室写的那些章节——我们在其中分享了坚持我们‘价值观’决策的艰难，我们在‘价值观练习’中确定的价值观，并借此诚实说明我们所发现的真相——强化了这种背叛感。到那个时候，读者已经和我们站在一起了，而且基本上，他们懂了。连媒体也懂了。”她讽刺地笑了。


    “关于丹的遗产的决定，存在哪些问题？”汤姆问道。“你是如何处理那些批评的？他们认为应该把这笔钱还给南美洲。”


    “我认为目前我们能要求的最好就是他们保持‘静观其变’的态度，”阿比若思地回答道，“至少到下周的兰道斯-麦格联合新闻发布会为止。但我们确实需要准备好你设立的信托的充分证明。光有答案是不够的，即使律师在场。事实上，这看起来仍然像是利用丹遗产的资金购买了麦格的大多数股份——而这些资金源于一个非法所得的遗产。”


    “好，到下周，我们将确立信托的所有法律要求，而且在新闻发布会上，秘鲁的文物部长、智利的文化随官以及联邦财政部信托与投资部门的高级审计师将共同出席，”保罗（Paul）说。“他的存在本身就能证明信托已经建立、其目的以及将设定和维护的控制措施。”


    ## 第15章 告别与收获


    “但是，是的，”理查德（Richard）若思地承认道，“让人们相信资金的净值将产生与目前丹遗产相等甚至更多的收入，这有些牵强——而且是一笔真正将用于南美生态研发、以及文物位置和回报的资金。”


    “关于安娜（Anna）和杰弗里有什么问题吗？”萨姆问。


    “并没有，有一些猜测性的评论，但不是由我来回答。丹的故事在法律上无法被实质性地证明，这一事实可能免除了安娜遭受法律诉讼，但除非他们做些补偿，否则她和杰弗里将永远与舆论作斗，那是他们的麻烦。”


    杰雷米（Jeremy）无疑拿开了几瓶新鲜啤酒，然后陷进椅子里。他看着轮机动船逆流而上，记得他与汤姆一起站在甲板上的夜晚，告诉他自己不是奴隶。他记得汤姆回答时的痛苦，说他所面对的比一次“价值观练习”要大得多。但事实并非如此。这是一个更大的练习，但并不比“价值观”大。是“价值观练习”拯救了他们。拯救了他们和麦格。


    心不在焉地摆弄着手机，点击了Values Inc.的价值观图表，他在因查卡塔湖（Lake Inchakata）拍摄的照片就这样出现了。


    - 1. 我们为什么想帮助企业发展他们的价值观？

    - 2. 为什么企业会希望我们帮助他们发展价值观？

    - 3. 价值观如何为他们的产品、客户和员工增加价值（$）？

    - 4. 我们的价值观如何为我们的产品、客户、员工增加价值（$）？


