    # 第5章 – 孙子遇到史波克先生


    ![](img/5130a27f171e0c05ae101ff268ed81ab_37_0.png)


    先说为什么，再说怎么做。接着是方法——然后是衡量标准。


    他们为什么想帮助企业发展价值观，这是一个很好的开场白。这始于卡勒（Callum）直言不讳的：“如果不这样做，我们会失去 Randall 客户。” 然后是保罗（Paul）说的：“如果我们做了，我们就能留住杰米（Jeremy）。”所以这些情绪已经出来了。那些怨恨。在表达了这些情绪后，是卡勒带他们回了正轨。


    “我们之所以这样做，是因为我们已经走过这条路了。我们知道如果没有它，我们的客户、员工和产品会遭受什么样的痛苦。我们知道‘价值观练习’是如何拯救了我们公司的。”


    “嗯，几乎是，”保罗务实地说，“我们还没有完全脱离困。”


    “不，但它正在积极进展，我们有了喘息的空间，如果我们没有做价值观练习，这种空间是不存在的，”卡勒指出。“这关于我们想在‘Values Inc.’ 中为‘价值观整合公司’创造什么。就像
    FutureSafe 平台曾经存在的状况。我们在此基础上构建。”


    “所以，在此基础上，我们的‘为什么’是因为我们想拯救公司，”保罗说，“难道不意味着对公司来说，‘为什么’是因为它们想被拯救吗？这难道有点……呃，显而易见吗？”


    “你有许多方法可以‘拯救’你的公司，”理查德（Richard）回答。“你可以注入资金、引入投资者、收购另一家公司或出售……许多在财务上可行的选择。但你们选择了审视你们所做事的价值以及你们是如何做的。”


    “你们为什么选择这种方式而不是使用财务方案，这是我们建立 Values Inc. 需要考虑的‘为什么’，它也将是吸引我们未来客户的‘为什么’。”


    “好，，那么这件事的切入点是卡勒和我决定和杰米谈谈。我们需要回到那次对话中。”保罗看向卡勒。


    “我记得清楚。”卡勒犹豫着看向保罗，保罗耸了耸肩，带着一种认命的态度说：“继续吧……”、“简略版……” 卡勒笑了，根据我们和你、理查德、保罗和我所做的工作，我们知道缺少了什么。我们意识到这不仅仅是通向利润的美元价值，业务的本质消失了。我们的性格、我们的个性、我们的目标、我们的一致性——定义了我们作为一个独立实体的一切。一切将我们与竞争对手区分开来的一切。一切说明‘我们没有竞争对手；我们如此独特，以至于没人会在我们的领域竞争’的一切。关于孙子的那套理论，即创造你自己的战场，而不是被迫在别人的战场上战斗。”


    “接下来，是我们的人们。他们来上班只是在‘做他们的工作’。缺勤率很高，当每个人都在场时，生产力很低。流失率正在上升。这从杰米的辞职开始……” 杰米皱了皱脸。“不，”卡勒摇摇头，“你不是原因，你是症状。”


    “但真正让我们警醒的事情是这里。员工建议箱是空的。过去，我们总有很多建议。有些是可行的，有些是可以调整的，有些是不现实的。无论如何，这并不重要。建议是人们参与的证明，从中产生了反馈和改进。我们总是对每一条建议给予回应。如果采纳了，会大表庆祝；如果没有采纳，会做出解释。


    杰米点头回忆道。


    卡勒继续道：“但建议减少了，在五周的时间里，箱是空的——一个建议也没有。直到有一天，我打开了箱子，里面躺着一张折叠的纸。我把它拿出来，很高兴地把它摊开。上面写着：*有什么意义呢！*”


    “那个感叹号触动了我。那不是一个问题。这是一个陈述。”


    “那时我们就想到了杰米。不，是卡勒想到了杰米。”保罗接过了话，“我承认我心情复杂。”他看了杰米一眼，“我的意思是，你确实告诉过我要守好自己的本职。”


    杰米笑了，“是啊，但至少我没告诉你要去守在哪儿。”


    “确实，”保罗承认道，“但我们第一次邀请你进来时，是为了喝咖啡、聊聊天，听听你的观点。我们并没有打算邀请你回来的。我们只是想和你谈谈，看看你想说什么。请你回来只是在……某个地方……偶然发生了。”


    “对我来说也是，”杰米承认道。这是一种冲动。也许不是冲动，但它是我们讨论内容的自然演变。


    “我的‘为什么’回来了，”他在犹豫后说道。陷入了深思。


    大家都沉默了。“回到‘为什么’，”保罗自言自语。这是他们都在思考的事情。沉默几分钟后，卡勒起身走到窗边，在下面写道：我们为什么想帮助企业发展它们的价值观？


    接着在下面写道：


    ‘因为

    - 我们不希望他们遭受我们经历过的痛苦

