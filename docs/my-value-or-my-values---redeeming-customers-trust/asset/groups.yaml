    同样的诚实。明确自己的立场，无论那意味着什么。


    “免责声明的羞辱者，”杰米说道，“好吧，那是一个商业决定。‘价值观练习’告诉你要做些什么才能重回顶峰，而一个良好的衡量系统将告诉你要如何留在那儿。一切都在报告里。方法论和关键绩效指标（KPI）在第12节。”


    随后，他继续说道，语气变得更加坚定，“价值观练习至关重要。但仅对你们的管理团队而言如此。它是一次验证——而不是启示。


    “但是，”他停顿了一下，直接看着汤姆，“你对这一切了如指掌，也知道如果不解决那个即将冲击你们公司的核心问题，修复它只是徒劳无功。那个你们还没有告诉过我们的问题。”


    汤姆和杰米对视着。汤姆想起了杰米身上那股钢铁般的意志；当那个晚，杰米在轮汽船的甲板上冒了一切，声称自己不是奴隶时，是谁有胆量告诉他，他的价值观练习始于他那个晚的决定，他正在为自己的价值观奠定基础，这些价值观将告诉他他是谁，并决定他将成为什么。


    他记得那天晚看着杰米时，内心交织的羞愧与自豪，以及他在那一刻就意识到，这些人将是改变兰德斯公司（Randalls）的人。改变他们流失的价值观，并最终改变那场将吹散整个公司的喷嚏。因为丹的故事将这样发生，一场巨大的喷嚏。响亮、肮脏，覆盖了他们所做的一切，定义了他们本性的一切。等这一切结束后，可能一无无存。


    他看着杰米，然后是看着其他人，告诉了他们关于丹的故事。


    一段时间后回首起来，汤姆从不确定他们是否已经知道丹的故事。他们中没有


    ## 第11章 – 黑天鹅


    做出反应。他们确实了，但并不是出于震惊、不信、沮丧或担忧——是卡姆先开口的。他只是说：“如果你们翻到第15节，标题为‘黑天鹅’，你们会看到我们研究了如何应对可能偏离价值观练习的未知因素。意外且不可预测的问题——那些我们或你们的管理团队都无法想象的问题。


    “纳西姆·塔勒布，”卡姆解释道，“是世界著名的对冲基金量化大师，之所以在量化领域之外也闻名，是因为他发明了‘黑天鹅’理论。该理论承认存在无法预见和无法想象的事件，它们会产生深远的影响。不仅在它们发生时，而且因为它们是完全不可想象的，无法预测，因此无法进行任何缓解计划。”


    卡姆继续道：“当然，丹的故事对你们来说并非不可想象，你们已经知道它有一段时间了；尽管如此，对于你们的管理团队和你们的市场来说，它仍然是完全不可预测的——它对你们公司价值观的根基造成了致命打击，这让情况变得更加糟糕。


    “这意味着，”汤姆轻声说，“我们正试图回到那些——黑天鹅已经揭示的——从未存在过的价值观。”


    ## 第12章

    双倍鱼


    “但对麦格（Magna）来说，不必非全有或无。”

    当汤姆宣布他们试图回到那些从未真正存在过的价值观时，房间里陷入了绝对的沉默。这是一种尊重而非尴尬的沉默，这种沉默让汤姆意识到自己刚刚所说的全部意义。


    保尔清理了咖啡残渣，由于现在是下午晚晚，他打开冰箱分发了啤酒。


    汤姆反唇相讥，重振了精神，显然在思考围绕麦格局势的方案。没有人发表评论，他们只是让话题维持，理解他脑海中飞旋的策略。他继续说道，将他们的沉默误认为是接受。


    “我的意思是，我们不必搞得非黑即白，要么转化要么断绝。有中间地带。我们可以要求他们的原始材料，然后通过我们的验证流程。这意味着麦格可以继续像现在那样运作，不会破坏我们的关系，但我们可以植入我们的流程并满足我们的‘验证价值观’。”


    “验证价值观，”保尔疑惑地重复道。

    卡姆第一个开口：“这是一个很好的术语。它对你们很有用。营销部门可以将其包装得既吸引人又有意义，成为一个员工和客户通用的良好参考术语。”


    汤姆的表情亮了，但卡姆接下来的话重重地中了他：“当然，如果价值观对你们来说仅仅是一场营销活动。”更多的沉默之后，卡姆平静地继续道，


    “但从价值观的角度来看，这种‘妥协’将是双重伤害。你们的价值观被稀释，而且你们向核心合作伙伴传递了一个信息：你们不信任他们。”


    又是一片沉默。


    汤姆的大脑在运转。卡姆是对的。这将向麦格传递一个明确信号：他们不信任对方。当然，麦格知道他们的材料没有经过‘完全验证’，但告诉他们兰德斯将更好地、甚至完全地验证这些信息，会在他们的关系中产生裂痕，对麦格产生深远影响。这将使他们暴露在聚光灯下，揭露他们和读者市场心知但不愿面对的裂痕。


    “你们必须记住，”理查终于开口了，“我们经历了一段漫长的旅程，而麦格并没有参与其中。这对他们来说是新事物。而你却希望他们能跟上你们，并做出可能影响、也将影响他们业务、品牌、方法论——利润的决定。”


    汤姆站起来在房间里踱步。他站在两个十字路口的交汇点。

