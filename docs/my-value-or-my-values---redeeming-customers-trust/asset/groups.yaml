    ## 序言


    如果你想读那些教你该做什么的商业书——如何创建一个更好的业务——如何规避陷阱——请不要读任何一本《行动策略》。


    它们没有提供关于如何创造财富、获取更多客户或成为一名明智领导者的路线图或指导。


    《行动策略……》的设计初衷是实实说说——商业中真实发生了什么——让你学到符合你需求以及你公司战略需求的教训。


    它们是基于真实人物及其公司的生活、业务以及他们所经历经历的小说。包含了他们的挫败与愤怒、成功的狂喜以及失去的痛苦。包含了他们遭遇的境遇、曾击倒他们的问题，以及他们取得的成就。英雄和女英雄是真实存在的；他们是我们年来合作过的所有公司、领导者和经理的集合。


    我们向你介绍书中收录的那些“T 恤领导者们”，以便让你从中学习，也让你知道，在面临的问题和困难中，你并不孤单。


    他们了解“苦难咖啡馆”（Hard Knocks Café），去过那里，买过那件 T 恤并穿破了……而且他们继续穿着它。


