    的订单，Paul 的激情以及公司所有人的努力将化为乌有。


    当 Paul 从与 Randalls 执行官 Tom Medici 会面回来时，这确实是一个坏消息/好消息的故事，随后演变成一个大新闻/震惊消息，最后陷入完全困惑。Randalls
    想要取消审计；他们不想取消合同；他们想要重新评估他们的“核心项”，并进行 FutureSafe 经历过的“价值观”练习，然后将其落实到所有的主要供应商中，包括
    FutureSafe。但是，他们想要 Jeremy 来进行价值观评估。


    如果他拒绝加入，Randalls 会取消 FutureSafe 的合同吗？Tom 在这一点上含糊其辞，因为他坚信 Jeremy 是这份工作的最佳人选。不仅是因为他在
    FutureSafe 取得的成就，更因为他通过审计工作已经深耕 Randalls。不需要过渡期，他可以立即见效。


    Callum 在愿景和距离上的判断是正确的。Jeremy 知道如果进入 Randalls，他会太近了，无法像他目前表现出的那样，清晰地审视问题。


