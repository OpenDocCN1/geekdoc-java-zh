    ## Chapter 13 – Reclaiming Petra


    “What do you need?” Paul’s anger at summons replaced by an anger of an entirely
    different kind. The anger of someone remembering what had happened to his parents,
    remembering why he had set up FutureSafe.


    “Safe futures for everyone.” stated Peter. “What’s done done. PETRA will take
    care of righting the wrong. What we need is everyone’s futures protected. We’re
    not going to the market for an insurer… no,” he smiled “we’re not attempting to
    hush this up, quite the opposite. We want everyone to know what has happened,
    to make sure that all companies know to check, and continue to check, the validity
    of the policies they endorse for their employees.


    “It’s not enough to check it out at the time of signing in the policy. What is
    needed are the continual reports and audits, such as are provided by you, throughout
    the term. But I digress, we’re not going to market for the insurance provider,
    we’re going to you and you alone. We need you to take over all Oilsoil staff,
    now PETRA staff, as quickly as you can. We’re not here to negotiate you into new
    terms or squeeze discounted rates or more attractive packages, simply ask you
    to extend the current packages across everyone.


    “But there is something else …” Peter hesitated until he was sure Paul and Callum
    had absorbed what he knew was a shock statement to them. When he was satisfied
    they were ready for him to continue he continued ...


    We need the ex-Oilsoil packages to be built in such a way that past premiums are
    underwritten by PETRA. In other words, the Oilsoil staff policies will commence
    at the same point they left off with the previous ‘non-existent’ company. PETRA
    will pay all their premiums costs. Not in a lump sum, we will pay this over a
    five-year period, unless an employee leaves the company or their policy matures
    in accordance with their terms, in which case we will make a lump sum payment
    to make up the remaining balance of premiums. Can you do this?


    Paul thought for a moment. “I don’t know how, but we will find a way.” He looked
    at Peter. “And,” he continued, “we will also help you meet the lump sum and ongoing
