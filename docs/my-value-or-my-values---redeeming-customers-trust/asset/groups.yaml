    ## Chapter 7 – ‘Jack Lives Here’


    Ike held onto the phone. The call had finished. The caller had gone. The line
    was dead, and the disconnect pips had started. But Ike held onto the phone.


    The caller had had told him what he needed to know. But he was uneasy. Ike understood
    people. They were simple and wanted only two things: Money or power. The first
    bought the second anyway. Understand which a person wanted, and you had them.


    But the caller was different. He wasn''t asking, only giving. Anonymous and secretive,
    he had first given him Dan Randall, and now he had confirmed the meeting with
    the senior manager from Randalls to verify the information. Time, place, description
    – not name. That would happen when they met. Tonight.


    That the informer from inside Randalls was obvious. He had let small points slip.
    Ike smiled to himself as he clicked off the phone. He''d had so many years of
    picking up on small details that could blow open a story, this informer was no
    match for him. Though he hadn''t given himself away sufficiently to identify who
    he was, and because he did not want anything in exchange, there was no way Ike
    could trick him into revealing himself.


    Why would the informer give up his company? If it wasn''t money or power, it could
    only be the third ugly sister: revenge. Ike was the most unstable bedmate, with
    none of the increasing drive for more. Unlike money and power which need to be
    continually sated, revenge, once gratified, is extinguished. And Ike had no way
    to predict the point of gratification.


    For the moment he would take what he could get, and tonight was the night he could
    start to match everything together, so he could prepare to take it all to Magna
    Media.


    Arriving early at the nightclub, he sat at a table overlooking the one marked
    ‘Reserved’, the one he knew had set aside for himself and his unidentified guest.
    He wanted to see who it was, observe and perhaps recognize him, before he joined
    him, or her. When his whiskey arrived, he sat and watched, one eye on the dancers,
    the other on the table. As the agreed meeting time drew closer, he ordered another
    whiskey, feeling uncharacteristically agitated, watching less of the dancers,
    and more of the empty table. But an hour after the agreed time, the table was
    empty still.


    Telling himself he had expected this, he drained his whiskey glass, pushed back
    his chair and made to rise – but a hand on his shoulder held him down. He froze,
    and felt warm air pass over his ear as someone leaned in very close and said,
    “You are not the only one who does not trust. When you are ready to do so, call
    this number.” And he felt a hand slide into his jacket pocket. A group of people,
    loud and intoxicated, knocked against him as he swung round to see who had addressed
    him. The crowd prevented his vision. The ‘Reserved’ table stood empty. He waited.
    A waitress went up to the table, took away the ‘Reserved’ sign and a couple sat
    down and ordered drinks.


    Tom looked at the man who had been a mountain. Age can be cruel. Age and illness
    together, unfair for anyone, but especially harsh for a man once so full of vitality.
    Two strokes Dan had bravely fought his way through, but now they had taken their
    toll.


    Mostly wheelchair bound, the massive stride which had been his characteristic
    gait, which had taken him through the rainforests of South America, was no more.
    Still alert of mind, his body though now let him down and the frustration affected
    his reasoning.


    Or had he always been unreasonable? Determined, single-minded? Is this what had
    helped him, driven him to accomplish what he had achieved? He had saved the rainforest
    because it was what he believed in, or was it because he needed an impossible
    feat? Something no one else could achieve. They would never know, and likely Dan
    didn’t know himself. Very late one night about five years ago, over a bottle of
    Jack Daniels, when there was just the two of them, Tom asked him why he had done
    it, and Dan replied ‘No one else was...’ Tom didn’t know if Dan had felt a sense
    of responsibility, or that he’d a clear playing field – no competition. The glory
    all his.


    There may not have been competition to ‘save the forest’, but there were other
    difficulties Dan had encountered and overcome. War lords, drug cartels, and they
    were only in the forests, outside were the politicians and socialites wanting
    a slice of the attention to add weight to their own reputations. Not to mention
    the presidential candidate who secretly sabotaged their supplies, so as to be
    seen as the savior sending supplies and equipment with the (supposedly) personally
    funded helicopter drops.


    Tom watched Dan struggle to maneuver his wheelchair over the canopy to top his
    drink. He tried to feel some sympathy towards him, after all this was the man
    who had built the mighty Randall Empire, but he was also the man who might now
    destroy it. And Dan had no patience with Tom’s belligerent arrogance.


    He’d come to realize Dan didn’t understand it was not all about him, he was so
    used to the attention, awards, and acclamations. He knew Dan lived in the shadow
    of Dan Randall the hero. The Superman who’d come to the rescue of the rainforests.
    But that was the ‘what’, now the ‘how’ could bring them all down, and Dan’s attitude
    of ‘Well, that’s just how it was back then’, would not wash with the public. If
    they found out.


    It was such an odd contradiction, they didn’t trust the media sources to bring
    them reliable, and yet these untrustworthy sources created a change in values.
    Having withdrawn from society, allowing only a few friends into his home, Dan
    had become his own frame of reference. Yes, Jack lived here’ alright, and Jack
    was home.


    Tom looked around Dan’s penthouse apartment and saw the detritus of his life.
    The prized trophies, now just cluttered his living room. It may be true that was
    ‘how it was back then’, but Tom knew well what the media, including Magna, would
    do with the story.


    So there had been a temporary decision. A partial decision. A cop-out in Tom’s
    view. Let Jeremy, well Values Inc., do the Values exercise. Wait and see if they
    find it. If they do, then the Board will declare. If they don’t ...


    undecided. Go public – bury it. Bury it and they risked coming out in an entirely
    uncontrolled and unmanageable way. Either way, they were opening Pandora’s box.


    Tom was tired of them. His focus was not on the excuses but on what to do. What
    to do with the information that would destroy them.


    Tom got up and went out onto the balcony. He stood looking at the night panorama,
    stars and stripes. Star light and city lights, striped with the ribbons of shadow
    from the river and its tributaries, weaving through the city like a dark reptilian
    mass, the multi-armed serpent that rose from Pandora’s box.


    Tom shivered slightly, not from the fresh breeze, not from a premonition nor a
    memory, just a shiver. There had been heated debate in the Boardroom today. The
    Board members were not so much divided as undecided. Tom had told Dan. Dan had
    erupted in righteous indignation. Anger, justification, bluster. But now all was
    quiet and Tom turned and stood in the doorway looking at the scene before him.
    Dan quiet, smiling, peaceful, mellow.

