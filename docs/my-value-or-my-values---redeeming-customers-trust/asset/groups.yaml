    # Chapter 9 – The Gambler’s Genes


    inheritance she had received from her father was his gambler’s genes.


    She spent the next few years lining up her career, graduating from law school,
    gaining raw experience in legal aid, and eventually being offered a place, partnership,
    in Simmonds and Saul, the small but exclusive law firm that differentiated itself
    by specializing in rare and unusual cases, those for which there were no precedents.
    Simmonds and Saul prided themselves on being ‘precedent creators’, it was their
    by-line.


    And it wasn’t the gambling tables that brought her the pain that eventually leads
    to self-realization, it was the commercial world. At the tables everyone knew
    everyone else wanted. They knew the rules, the game was clear. It was luck and
    raw skill, how to make the best of what you have, how to make others believe you
    have what you haven’t.


    But the commercial world she lived in was treacherous. Under the guise of respectability,
    large international corporates operated behind half smiles, two faces, and innuendo.
    People created their own agendas, and played a strategy, the success of which
    brought them fame and temporary gains for their company, that ultimately cost
    the company in the long run.


    At least those were the ones that Anna knew. She chose bad clients, like she chose
