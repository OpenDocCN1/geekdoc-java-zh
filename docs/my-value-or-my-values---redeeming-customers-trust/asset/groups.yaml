    Geoffrey’s dislike for Ike intensified with each meeting. And there’d been three.
    But he knew that if he was to exact his revenge on Dan Randall, he needed Ike’s
    connections and Ike’s hunger for the Randall takeover. Sure he’d be a puppet president,
    but he didn’t care, he’ve have taken Dan’s company away from him, and anyway,
    puppets all manage to break a string from time to time.


    And when he did, Ike would be the first to go. And Geoffrey smiled. A smile that
    Ike mistook as being in accord with his comment that he could ‘smell the sweet
    smell of success’. Ike was ready to make his move. Everything was lined up. The
    story was ready to be told to the Board of Magna. And his sources close to the
    Board had assured him the Board would not be pleased. They would not take lightly
