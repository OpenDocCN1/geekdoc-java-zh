    # Chapter 2 - Underbelly


    Ike leaned forward in his chair and looked to the Chairman, Mack Spencer. Mack,
    impassive ever. That didn’t mean anything, you can never tell what Mack’s thinking,
    his expression never changes. Neither harsh nor soft, he has never been seen laughing,
    or angry, never anything other than decisive, logical and rational. But he’s ruthless.
    When he makes a decision, he lets nothing and no one get in his way. If you have
    value, you’re in Mack. If you have values ... then you’re worthless to Mack.


    And the Board waited. Mack wasn’t speaking, so nobody was. Mack wasn’t asking
    what Ike intended to do, so nobody was. They focused only on the takeover opportunity,
    knowing they would have to decide now, because if the opportunity presented itself,
    there would be no time for debate.


    They had talked about it all morning, knowing that if they agreed to the takeover,
    they were agreeing to the unspoken method by which Ike intended to bring down
    Randalls. And now they were quiet, because Mack was silent. Everyone waited.


    One sharp nod, and the words “Do it!” and Mack picked up his file and left.


    And on the other side of town, in another Boardroom, someone else wasnt saying
    anything. Thinking, absorbing, considering. Richard had read the newsflash that
    Randalls had suspended the audit, and subsequently the Tom and Paul collaborated
    statement as to the reasons why. The words ‘strengthening and molding the relationship’
    were not lost on him. They had promised a full statement within the next 48 hours.
    Something had gone wrong, but not totally. He’d wait until Paul called. Late in
    the afternoon Paul had called and asked when he could come and see them. “Right
    away.” he had replied.'
