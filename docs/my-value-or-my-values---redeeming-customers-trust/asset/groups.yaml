    you can choose to destroy us, but understand, the decision

    make tonight will set the foundation for your own Values.'
- md: '

    Your Values exercise starts here. It will show you who you are


    “You don’t understand,” said Tom, still staring unseeingly at the passing city.
    “this is bigger than a Values exercise. What you will find out as you do the Values
    exercise will come as a shock. What you will have to repair is far more than how
    we decide the value for our business and stakeholders. And when you find out,
    I need you nailed down. I need you unable to talk and unable to leave. Bound by
    a confidentiality that I can only guard if you are an employee. You won’t be able
    to leave. Locked into my company with the golden handcuffs of a high salary, you
    won’t be able to leave, and you won’t be able to talk.


    “You.” Tom spat the words. “You, for all your ‘why’s’. All the reasons why you
    cannot find a ‘why’ to work for my company, for all your talk about why customers
    connect with the company, why you staff want to work for, and stay with the company.
    Why, why, why… but never did you dig deeply enough into the ‘why’ behind our need
    to do this Values exercise. And why I am prepared to do something as outrageous
    as ‘steal’ the employee of a company whose business, and owner, I admire.",


    ## Chapter 4: Bringing Down the Eco-Warrior


    The sound of the clink, the aroma of the cigar. Once rewards for achievement at
    the end of a hard but successful day – now they were what got Ike through the
    day.


    Standing on the terrace off his office, looking out at the city life below. People,
    minions, scurrying about their hapless worthless tasks. Not like him, CEO of the
    mighty e.Celebs. Ike didn’t scurry – he had his own minions for that.


    And it was those minions that brought him the goods, the low down, the stuff that
    made headlines. And one had brought him Dan Randall.


    e.Celebs were without the connections and backing Randalls had developed, that
    Randalls could ‘afford’, that Randalls enjoyed from Magna. e.Celebs had to resort
    to other ‘methods’ of obtaining their celebrity news. And what’s minions were
    for, getting into nooks and crevices, wrinkling out details and information. But,
    if they had a shot at getting Magna away from Randalls – of getting Magna for
    themselves, they would turn the celebrity media market on its head. He could turn
    the celebrity media market on its head.


    So Randalls wanted to re-set their Values. Ike snorted in derision. An unattractive
    sound, even to his own ears. Guttural. But Ike remembered where he’d come from.
    He’d been one of those minions, he knew gutters. But he’d pulled his way up, and
    now he’d pull e.Celebs up, up to that top spot. The place ‘currently’ occupied
    by Randalls. He remembered a line from some movie ''does this walking corpse have
    a name?'' '' And he smiled; this was how he thought of Randalls.


    Everything was in position. The Board had sanctioned the buy-out of the soon-to-damaged
    Randalls as soon as the trap was sprung. He had an informer from inside Randalls
    and a meeting set with a senior executive at Magna, so the net was closing over
    Dan Randall.


    Ike took the last of his drink in one gulp, leaned back in his chair, closed his
    eyes, and took a long slow draw on his cigar. Behind him the glass cage they called
    their offices, the watercolor talk was speculative. Everyone knew something was
    happening. The unscheduled Board meeting, Mack’s frequent and sudden visits to
    Ike’s office. Closed doors, raised voices. And now Ike, in the middle of the afternoon,
    just sitting out on his terrace, drinking and smoking. In fact, he wasn’t moving
    – was he actually asleep?


    Asleep? Ike’s mind was active, rehearsing the meeting with the Magna executive.
    How would he create the slow realization that their alliance with Randalls was
    heading for the rocks.


    Randalls were doing a Values exercise that would question the validity of Magna’s
    material. It would bring Magna’s credibility down to the level of … and he spluttered
    on his drink, down to the level of e.Celebs. Huh!


    Then, with the scene set, he’d light the touch paper – tell Magna the Dan Randall
    story – stand back and enjoy the fireworks.


    Dan Randall, the philanthropic founder of Randalls Publishing. Savior of the South
    American rainforests, whose early publishing under the eco-warrior brand ‘DanRan’
    had been entirely dedicated to his eco campaigning and jungle adventures. To this
    he had added the stories of other eco-warriors who had joined with him, and when
    he finally emerged from the rain forests, he had embraced publishing and expanded
    into science, history, anthropology, philosophy ... leading him into the biographies
    of the scientists, historians, anthropologists, and philosophers behind the stories.


    His legacy on retirement was Randalls Publishing, a giant that needed constant
    feeding. Tom, staying true to Dan’s commitment to non-fiction only, had expanded
    the biographies from persons of intellectual value to explorers, then sports people,
    and the slide had come when he moved them into stage, screen, and eventually,
    the newly burgeoning ‘celebrity’ market with more curiosity than concern. He’d
    e.Celebs.


    Ike had watched Randalls early efforts to break into the celebrity curiosity.
    He’d known they didn’t have the street smarts to take them on their turf. What
    he hadn’t seen, could not have anticipated, was the union with Magna. And what
    a marriage it had been! Randalls gaining a wealth of source material, Magna gaining
    a publishing outlet for their television and film material.


    But that was all about to change, and the man who was about to change it took
    the last drag on his cigar, flicked it over the rail, and settled back, letting
    the sun on his face lure him into a few moments of contentment.


    ## Chapter 5: Sun Tzu Meets Mr. Spock


    "Randalls welcomes Values Inc.". Jeremy grinned at the sign in the foyer. Nice
    touch, he thought, but cringed and glanced at Richard to see his reaction. Richard
    didn''t react, but Jeremy knew he wasn''t fooled, it wasn''t about a welcome from
    Randalls, it was about the publicity for Randalls. Another cog had just turned
    in their media machine.


    What Randalls, or the media, would not know about was the soul searching, the
    arguing, that had taken place between the four of them as they debated whether
    or not to take on this project, knowing now as they did that they would be encountering
    something unsavory.


    Tom wouldn''t tell them what it was. He was testing them; he just didn''t want
    to prime them because it was important they picked it up for themselves. To determine
    extent it had infiltrated the company. Where was its entry point? What was it
    losing from its existence? Was it a solid mass that would implode, or icy fingers
    gripping the organization and choking it into a slow decline?


    It was Paul''s logic that had been sound. Surprising? Initially, yes. A business
    entity that would specialize in developing Values was some distance from a financial
    company. But of course it was not any distance from this man who had set up a
    financial company to lift the bar for the industry.


    “Why would we only help companies whose Values are intact, or that we agree with?
    What’s the point of this? Why will these companies even need us?” He had pointed
    out logically.


    And Richard had laughed. A deep, hearty laugh they had never heard from him before.
    “We forgot …” he started before the laugh took over again, and the other three
    looked at each other in puzzlement.


    When he finally settled, he started again. “Values Inc. will work with companies
    to set and link the Values of their organization to the dollar value of their
    product. Right?


    They all nodded in ‘we’ve done this’ agreement. Richard laughed again. “And we
    haven’t done it for ourselves! For Values Inc. – How ridiculous is it?”


    So the following weekend the four of them had taken themselves off to the lodge
    of a friend of Callum’s on the shores of the tiny lake Inakata. Solitude, nature,
    beauty, fishing, and beer. Debating, thinking, and reasoning intermingled with
    laughter, activity, and companionship.


    Four headings. Richard wrote them across the big window that looked out across
    the lake. The beautiful view a backdrop to the purpose of their stay.

