    then realized that they were all a little on edge at the moment. He glanced at
    the others, they seemed fine. Concentrating.


    “OK,” said Tom decisively, “so we set up this room up as a War Room and work on
    this next stage in the Values implementation.”


    “In which case, we can get started now,” said Richard. Jeremy handed out a pack
    of documents to each person, the fact that there were two remaining reminded everyone
    of the absence of Sam and James.


    Jeremy opened the one he had kept for himself, “As you can see, there is one central
    planning guide which correlates with the three different areas so we can identify
    actions entirely belong to each of the three areas, and where they intersect for
    consistency.” He looked at Richard and Tom. “What will we do to assist Abby?”


    Tom replied quickly, “We all need time to read the packs through. Even though
    you, Richard, and I put them together last night, we now need to go over them
    again, focusing specifically on the actual areas of planning we are working on.
    By the time we break into our groups, we’ll know where Sam is at.”


    There was silence as they all read through their packs, and Tom’s mind strayed
    to what he was leading them into, and the absent Sam. Sam was the litmus test.
    He’d always been the litmus test. His reactions, always blunt and loyal, had been
    a rudder for Tom many times in the past, and not just in his role in finance.
    His absence now was disconcerting, his loyalty to Dan had been strong, but Tom
    was sure his loyalty to the truth would win out. He could wait.


    After half an hour little conversations sprung amongst them. Matthew and Abby
    had started making a few notes, so Richard judged it was time to start breaking
    up their groups. He looked at Tom, “I was thinking that perhaps I might float
    between you and Abby, and that perhaps since you worked on the documents with
    us, I might start by spending some time with Abby?”


    Tom just nodded. Richard joined Abby, and Matthew and Jeremy moved over to the
    window and started laying out the planning pack. Tom started making notes against
    the schedule marked ‘Magna’.


    Twenty minutes later the door opened and in walked Sam. Without any expression
    he quietly closed the door, walked over to the table and placed on it a memory
    stick. And in clear mimicry of Winston Churchill said ... “We shall fight them
    on the bookshelves.”


    ## Chapter 15 – Goodbyes and Gains


    Jackets off, ties loosened, shirt sleeves rolled up, and each with a bottle of
    beer. They sat out on the balcony off the Boardroom. Each looking at a different
    point of the river panorama. Tom, Paul, Callum, Sam, Jeremy, Richard, and Matthew.
    Each remembering a different part of the journey. But all remembering the cost.


    Dan’s funeral that day had been a quiet gathering, not to avoid the media attention
    from the recent ‘releases’, but because he had expressly stipulated this in his
    Deed of Wishes. He had instructed that as he had no family, Tom was to invite
    only those whom he believed had made the greatest contribution to furthering his
    ‘publication vision’. Luckily for Tom, Dan had not defined his ‘publication vision’,
    leaving Tom free to interpret this as he saw fit.


    No family. Tom thought of Geoffrey. He took no pleasure in the look of shock on
    Geoffrey’s face when he and Ike walked into the Magna Board meeting to reveal
    their grand exposé, only to see Tom and Sam present with the Magna executives.
    Tom hadn’t known until that day that Geoffrey was Dan’s son, not of course of
    his alliance with Ike. He had known only what the Magna Board knew, Ike intended
    to reveal something relating to Randalls that was potentially damaging to Magna,
    and that he had an impeccable source who was willing to be identified.


    What they were about to reveal, of course everyone at Magna knew, because Tom
    had shared with them the Values work that had been undertaken by the management
    team, and he had also told them the ‘about to be released’ Dan story. But there
    was undisisable shock at the identification of Ike’s ‘impeccable source’, and
    that source’s relationship with Dan.


    Tom felt for Geoffrey, he didn’t blame him, and he wondered what he himself would
    done were he in Geoffrey’s shoes. Once he’d realized Geoffrey’s situation, he’d
    done his best to smooth things over, and as CEO of Randalls, and with Power of
    Attorney over Dan’s estate, he had made every effort to consider a fair resolution
    for Geoffrey. But he couldn’t give him the company, and the shame Geoffrey sought
    to bestow on Dan personally was never to happen, because over the last few weeks
    Dan had sunk too far into his illness to be aware of anything around him. His
    death had neither a sadness nor a blessing.


    Tom had invited Anna and Geoffrey to the funeral, a loose interpretation of Dan’s
    wishes, but in any event, neither had attended, and his discussions with them
    regarding a settlement from Dan’s estate had not been successful, so it would
    now fall to their respective lawyers to resolve. And with this, Tom’s mind shifted
    to his new responsibilities, CEO of the new company, the result of the Randalls-Magna
    merge.


    Sam’s thoughts were also on Geoffrey. He had felt the greatest shock when Geoffrey
    walked into the Magna Board meeting with Ike. No, not when he walked in, Sam had
    never trusted Geoffrey, so that he was the ‘impeccable source’ hadn’t shocked
    him, nor even surprised him. In fact it had relieved him, because he had been
    worrying in case it was someone he valued. But that Geoffrey was Dan’s son, and
    the lengths to which he had gone to seek revenge, had shocked Sam deeply, though
    he didn’t share Tom’s sentiment of understanding.


