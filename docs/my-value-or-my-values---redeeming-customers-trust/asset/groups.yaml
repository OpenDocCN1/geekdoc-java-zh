    When you break away from the principles you support in your business, and make
    a decision based purely on commercial viability, the impact can be monstrous.


    I started my business from scratch. I remember buying my first laptop and not
    knowing how I would pay for it. Going for a run in the morning and hoping there
    would be a message on the answer phone when I got home. I remember when I could
    afford to hire my first half a person. Not a whole person mind you, just a half
