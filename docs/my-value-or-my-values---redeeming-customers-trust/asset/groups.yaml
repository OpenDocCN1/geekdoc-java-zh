    Values Hurt ...


    Interview with Andrew Hunt – Managing Director, Kinetics Group


    Kinetics Group provide practical I.T. to improve the performance of businesses
    offering Design, Support, User Coaching, IT Consulting and Management. They are
    one of the most highly awarded Microsoft companies in the region.


    Values Hurt... Values are the things you do even when it hurts you to do them.
    The test of good Values is your adherence to it, when you are under pressure.
    When your head is screaming at you to do the logical or justifiably commercial
    thing, but you know in yourself that it doesn''t fit with what you Value.


    We think that if we focus on better outcomes for our clients, integrity, excellence,
    commitment – that clients will respond to this, that they will choose us and will
    pay for what we have to offer. If that were true, every single company that exists
    and only Kinetics, to enhance the performance of their IT!


    Business is stressful, and it''s subjected to many unexpected changes, and ‘black
    swans'', such as Paul has seen.


    The advice I would share with Paul comes from my personal experience, that my
