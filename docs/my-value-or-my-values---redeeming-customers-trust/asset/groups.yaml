    ## 第一章 - 人质


    名人流派。任何甚至曾“想过”自己是在电影、音乐、体育、电视领域——甚至是真人秀领域中是某位“名人”的人。他对于 Randalls 所做的事情并不热情。他也无法对这样一个实体产生热情，因为根据他们业务合作的本质，他们会吸引那种类型的媒体关注，这种关注足以让像
    FutureSafe 这样的公司倒闭，而这本质上非仅仅是一场商业上的错位。取消他们的合同是一回事——但他们自身“名人”地位带来的曝光度，并不能很好地保护与他们做生意的人。他想为这样一个实体工作吗？


    他知道自己为 FutureSafe 交付了高质量的工作，因为他拥有他们的“初衷”。他们的目标就是他的目标，他希望他们的价值观得到展示和证明——不仅是在 Randalls，而且是在
    FutureSafe 的所有客户。对于所有 FutureSafe 客户的员工。他不仅仅是为了财务原因留住这个客户，他出现在那里是为了履行 FutureSafe
    的承诺尽自己的一份——为 Randalls 的每个人守护未来的财务。


    他想守护那些明星的传记吗？

    保罗坚持让 Callum 说，他不认为 Jeremy 去 Randalls 是个好主意，现在他明白为什么了。随着这个发现，他的脸上充满了失望和无奈的皱纹。


    但 Callum 还没说完。“还有另一种办法。我们知道，只有跳出框架的人，才能看清整个局图……这不仅适用于 Randalls，也适用于我们。”


    “所以，如果 Jeremy 完全在框架之外工作，跳出 Randalls 和我们的框架，也许他可以为 Richard 工作，并与 Randalls 签约，”


    “还有和我们。”保罗抓住了这个主意，就像一个刚抓到救命稻草的人。“我不知道 Tom 会不会买账。我也不知道 Richard 会不会买账。这值得考虑。也许我们先和
    Richard 谈谈看看……”


    他的声音消失了，惊恐的神情掠过脸，他意识到自己又一次在关于 Jeremy 为谁工作的决策中，没有把 Jeremy 考虑在内。尽管很担心，保罗脸上的表情如此毫无防备，
    Callum 和 Jeremy 忍不住大笑起来。这打破了紧张气氛。


    Jeremy 笑了笑。“我知道，这是那种‘不用说’的事，谢谢你们，”他感谢道。“Callum 说得对。但就像你们一样，在我谈论这个之前，我也想说，我不想离开。既然我们大家都这么说了，那来谈谈
    Callum 的观点吧。”


    他犹豫了，思考着，保罗和 Callum 等着他，给他时间整理思绪。


    “对于第一个问题，我想我会去的。至于‘初衷’，是因为我将与公司的价值观一起工作。即使我没有得到那个‘初衷’（即他们所的工作），我的‘初衷’也将是帮助他们建立价值观，结果就是看到他们为客户和员工实现应得的价值。”


    “我必须承认，”他犹豫了，看着保罗和 Callum。“我一直在想，在完成 Randalls 的价值观计划后我该做什么。价值观一旦建立，就需要不断地调整，这对我们来说是如此，对他们来说也是如此。但并不是一项一次性的工作。这可以成立一个独立的实体，与
    Randalls 合作，然后与其他公司合作，这会非常令人兴奋。”


    保罗在点头，Callum 看起来既惊讶又高兴。


    “好。那么现在我们来看‘如何做’，这我们需要真正仔细谈谈。”Jeremy 在说话的同时仍在组织思绪。“你看，要做到这一点，我需要我构建的所有指标和系统。我是为你们构建的，那是你们的知识产权。如果我这样做，它应该是你们的。没有理由你们要把
    Randalls、Richard 或我这些你们付钱构建的知识产权交出去。为什么你们不能从投资中获得回报呢？承认我构建的这个‘价值模型’是有价值的。我做了工作，但你们提供了资金。你们应该考虑与
    Richard 成立一个合资企业（JV）来这样做。不要只把它交给他和 Randalls。”


    保罗震惊地沉默了。有这样的人在他身边真好。他看着 Jeremy，然后看向 Callum，又看向 Jeremy，摇了摇头，不是不同意，而是意识到这两个人正是“价值观”和“价值”的全部意义。


    是的，这是一个好主意。确实很有潜力。他的脑海中闪过各种可能性。如何进行结构化、资助、开发、扩张和营销。不是合资企业，而是一家公司。一个专门帮助其他企业建立其价值观并将其贯穿于业务方方面面的实体——向所有利益相关者交付正确的价值。


    “不，”保罗突然说。Callum 和 Jeremy 惊了一下。Jeremy 耸了耸肩，既惊讶又失望。“不，我不想和 Richard 成立合资企业。我们都在局中；我想建立一个实体，我们三个人加上
    Richard。如果 Richard 同意，他和 Jeremy 将担任执行董事，Callum，你和我将提供运营和营销支持。你们两个怎么想？


    但他其实并不需要问。他们的表情已经说明了一切。Callum 点点头，他他常冷静的神态被一种类似于焦虑的情绪取代了。


    Jeremy 是第一个开口的，“我知道我们可以叫它什么。”


    “价值观有限公司（Values Incorporated）。’这是一个双关语——‘Incorporated’，简称 Inc.，是一个双关语——因为 Randalls
    的底牌将暴露在所有人面前。”


    保罗举起咖啡杯，“价值观公司（Values Inc.）。”


    ## 第二章 - 阴暗


    “如果我们放弃这次机会，我们会后悔的，”保罗说。Callum 和 Jeremy 惊了一下。“这是 Randalls 回归正轨的难得机会。但我们需要让它发生。”


    他看着董事会，等待他们的反应。他们沉默了一会儿，意识到形势的严重性。


    “我们加入，”保罗终于说道，“我们全都要。”


    于是，计划开始了。一个可能改变 Randalls 世界，或者至少改变他们自己的计划。


    “如果我们不放弃这次机会，我们会后悔的，”保罗说。“这是 Randalls 回归正轨的难得机会。但我们需要让它发生。”


    他看着董事会，等待他们的反应。


    “你们觉得 Magna 在乎价值观吗？”Ike 哼了一声。“当然不在。Magna 只在乎一件事——如果他们认为 Randalls 软了，他们就会担心消息来源，并寻找其他合作伙伴。Magna
    会转向我们，他们别无选择。”


    Ike 在椅子上向前倾倾，看着主席 Mack Spencer。Mack 一直毫无表情。这并不意味着什么，你永远无法知道他在想什么。既严厉也不软，从未见过他大笑或愤怒，从未不果断、逻辑性和理性。但他很冷酷。当他做决定时，不会让任何事情或任何人阻碍。如果你有价值，你就在
    Mack 的范围内。如果你只有价值观……那么对 Mack 来说你毫无价值。”


    而董事会等待着。Mack 没有说话，所以没有人说话。Mack 没有问 Ike 打算做什么，所以没有人问。他们只关注收购机会，知道如果他们同意收购，他们就是同意了
    Ike 击垮 Randalls 的无声手段。现在他们安静了，因为 Mack 沉默了。一个坚决的点头，“做吧！”Mack 拿起文件离开了。


    而在城市的另一边，在另一个会议室里，有人没有说话。思考、吸收、考虑。Richard 读到了 Randalls 暂停审计的快讯，随后是 Tom 和 Paul
    的联合声明，解释了原因。“加强和塑造关系”这些话他没有遗漏。他们承诺在接下来的 48 小时内给出完整的声明。出问题了，但还没有完全崩溃。他会等 Paul 的电话。傍晚时
    Paul 打了电话，询问什么时候可以去见他们。“马上，”他回答道。


