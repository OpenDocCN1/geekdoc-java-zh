    that morning. Well, he had and he hadn’t. It was exactly the sort of project that
    Richard would be engaged for, so not surprising really. He liked Richard, Richard
    had been kind to him. It was a shame that Richard’s good work would be destroyed.


    As Ike was being slowly drawn into the mellow companionship of his whiskey, Geoffrey
    remembered the time with Richard ten years earlier. Geoffrey had been a young
    up-and-coming Quant, playing the stock markets and Richard had opened a trading
    portfolio with him. When the markets crashed, Richard had lost a tidy sum, and
    Geoffrey always remembered Richard’s response when he told him. Other investors
