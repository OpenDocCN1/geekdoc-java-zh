    # Chapter 7 – ‘Jack Lives Here’


    Dan had bravely fought his way through, but now they had taken their toll.


    Mostly wheelchair bound, the massive stride which had been his characteristic
    gait, which had taken him through the rainforests of South America, was no more.
    Still alert of mind, his body though now let him down and the frustration affected
    his reasoning.


    Or had he always been unreasonable? Determined, single-minded? Is this what had
    helped him, driven him to accomplish what he had achieved? He had saved the rainforest
    because it was what he believed in, or was it because he needed an impossible
    feat? Something no one else could achieve. They would never know, and likely Dan
    didn’t know himself. Very late one night about five years ago, over a bottle of
    Jack Daniels, when there was just the two of them, Tom asked him why he had done
    it, and Dan replied ‘No one else was...’ Tom didn’t know if Dan had felt a sense
    of responsibility, or that he’d a clear playing field – no competition. The glory
    all his.


    There may not have been competition to ‘save the forest’, but there were other
    difficulties Dan had encountered and overcome. War lords, drug cartels, and they
    were only in the forests, outside were the politicians and socialites wanting
    a slice of the attention to add weight to their own reputations. Not to mention
