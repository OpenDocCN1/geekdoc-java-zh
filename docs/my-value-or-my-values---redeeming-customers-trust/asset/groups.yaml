    Attenti 是一家全球性的电子监控公司，为 34 多个国家的执法和执法机构提供电子人员监控解决方案。在一个对合规性要求极端的行业中，David 在这种毫不妥协的环境下的领导是建立在具有复杂交付模式的前线运营角色之上的。


    没有一个坚定的首席运营官无法交付任何价值或价值观。这一角色是交付领导者愿景所设定的价值观，以及销售人员承诺的价值之间的关键纽带。没有比这更具前线的了。David
    对这个故事的投入尤为犀利，因为他曾在服务行业担任过 COO，在这些行业中，价值和价值观是无形的，除非公司和客户对这些的“感知”能够诚实且现实地对齐，否则它们就是毫无意义的。


    当价值观似乎无法交付时，会发生什么……


    这种情况会发生。你想给客户带来安心，但并不能总是保护他们。没有比这更好的行业了，那就是你已经确定了诚实和正直对你意味着什么，你准备好为之捍卫。


    ## 第18章 – David Tombs – Attenti：价值观验证价值


    在专门为保护安全而设立的行业中，没有比这更能说明问题的。当董事会面临 Randall 灾难时，以及当你推出“免责声明羞辱者”时，你已经在董事面前接受了测试。


    安全是一种恐惧，且往往是基于怨恨的购买，虽然原则上你“一钱一货”，但你得到的是你供应商的价值观。他们根据自己认为重要的事情来构建他们的服务和产品，并根据他们的价值观进行交付。这在安全行业尤为如此，因为没有人能向你保证他们可以完全保护你或你的财产而让你省心。如果他们的价值观是真实的，他们会告诉你这一点，并构建一个能够现实地减少你风险的服务交付模型，而不是向你承诺他们无法控制的东西。


    然而，是公司的文化价值会让你的价值观变得可行。


    要让它们真正起，你现在需要确保它们在整个组织范围内都是对齐的、可行的且现实的。


    与可以交付的内容对齐。与你的员工所相信的对齐。


    你们中的许多人可能处于这样的行业：你们的竞争对手与你们在同一空间工作，使用非常相同的工具。你们的区别在于应用工具和人机接口的方式。损害你们的是，当你们的人机接口因为没有对齐而无法交付你们价值观时。


    - 监控、衡量、提及（Monitored, Measured, Mentioned）：监控以预判不对齐；衡量以验证一致的交付……然后庆祝你们的成功！


    将产品的价值与你们交付时遵循的价值观对齐，你们就能为客户、公司以及你们的底线提供现实。


    为了你们的业务获得验证，你们的价值观必须与现实对齐，聚焦于


    ## 第18章 – David Tombs – Attenti：价值观验证价值


    预判它们能够产生最切实的利益的情况——并揭示它们无法发挥作用的地方。


    > 当价值观由忠诚且文化上对齐的人交付时，你就提供了价值。那时，你们的价值观将验证你们的业务交付成果和盈利能力。


    我在大型和中型企业的服务行业工作过，包括安全、货运、债务催收、物流。在这些公司里，愿景是 CEO 真实的愿望——或者是由遥远的董事会设定的。它们是道德的、伦理的、真实的、有抱负且鼓舞人的——并不总是可以交付的。


    我如何在不损害价值观的情况下让它们变得可交付？务实的答案是，让它们具有可扩展性。将它们与价值美元对齐。你可以拥有高尚的价值观，只要它们被对齐为以现实的价值衡量来交付——并能够根据客户的需求和期望进行交付。


    其他任何事情都是幻觉或欺骗。


    ## 要点总结


    这些策略……像好的外带咖啡那样的……被设计成你可以带走的故事，可以随身阅读，并根据对你和你的业务最有效的方法得出自己的结论。


    你现在已经阅读了当公司利益冲突时，价值观如何提供引导和保护，这个简短的总结为你提供了两个对 FutureSafe 和 Randall 的保护至关重要的关键点。


    客户令人惊讶且令人沮丧的地方在于，他们不会就你的价值观质疑你。他们没有完全理解你服务交付承诺的价值衡量，他们不在乎你的利润，直到……


    你看到客户生活在自己的世界里，照顾他们自己的客户，创造自己的价值观、价值衡量和利润，这样他们就不会关注你的公司，直到……


    所以，无论你决定了特定的价值观，你如何定义你的价值衡量，你所达到的利润水平只有在某些事情产生扰动时对他们才有结果意义。就像这三部曲第一本书中的故事，斯巴达人对马其顿的腓力二世威胁他将如何对待他们时的回答。斯巴达人回了一个信息：“如果”。


    但在商业世界，“如果”往往会变成“当”，因为事情会出错，人们会犯错，人类表现出他们原本的样子——以及


    ## 要点总结


    最好、最严谨的计划无法预见“黑天鹅”。


    而且只有当我们面临测试时——要么是因为我们处于困境，正如 Paul 面临 PETRA 董事会那样，要么我们面临像 Randall 那样的攻击——价值观才会成为决策的平台。无论强是弱，它们绝对会影响结果。


    价值观不仅仅让我们保持“圣洁”或聚焦北极星，价值观为我们的思维提供了形状，我们可以和不能交付的内容——当它是现实且选择良好的——是我们在面临压力时（通过验证我们做什么、如何做以及我们能实现的利润）的默认立场。


