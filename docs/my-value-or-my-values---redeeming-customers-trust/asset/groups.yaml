    # 第10章 – ROR – 报复回报率


    杰弗里知道伊克（Ike）在掩饰他的反应，但他无动于色地继续说道：“换句话说，他们的决定是，留在目标市场内并保护基础材料的真实性，比通过他们所谓的‘裸奔式’进入那些未经证实的且不可靠的材料和来源领域来扩大市场更有利。”


    “对于这一点，他们将其包装在一个陈述中，将‘公司的价值观’与‘出版方法和回报的 S 价值’结合在一起。”


    “那么，这对于与 Magna（大公司）的关系意味着什么？”伊克漫不经心地问道。


    “嗯，那确实很有趣，”杰弗里回答道，“管理层正在为董事会写一份报告，建议与 Magna 举行会议，讨论 Magna 如何或能够满足他们对可核实材料的要求。”


    “他们并不是想与 Magna 破裂关系，他们将能够加强这种关系。”


    “不，完全不是。管理层相信，通过与 Magna 讨论，他们未来能够接受 Magna 的所有材料，但他们认为，当 Magna 看到数据并谈论市场时，将‘加强他们的联盟纽带’。”杰弗里将右手放在胸口，做出了一个戏弄的效忠姿态。


    伊克心里微微一笑。与其说是微笑，不如说是冷笑。“加强他们的联盟纽带，，”他心里想。可非如此。如果我先一步到达 Magna 的话。


    ## 第11章 – 黑天鹅


    “这才是关键所在。”理查德（Richard）向后推了椅子，动作很随意，但他看向汤姆（Tom）的眼神没有留任何误解的余地。语气中也没有任何随意的。


    汤姆看向当天聚在一起和他见面的团队。保罗（Paul）、卡拉姆（Callum）、理查德和杰米（Jeremy）。他现在将他们视为自己顾问小组的一部分，而不是他们最初的供应商。他们从供应商转变成了合作伙伴，但这种伙伴关系已经在发展——他们之间建立了一种联系，一种在过去几个月里形成的纽带。他感到一丝内疚，因为他没有和他们分享那个对他公司构成最大威胁的“价值观”问题。


    他本能地试图通过提问来转移自己的负疚感：“也许是关于兰道斯（Randalls）的，但我很想知道为什么你们两家公司处于类似的境地？如果你不介意分享的话。”他赶紧补充道，“如果我能理解你们正在发生的情况，可能有助于我理解你们的提议。”


    汤姆知道自己在拖延时间，但他也有某种好奇。这些给他提供建议的人也有他们自己的问题。他们是在根据经验说话，他喜欢这一点。他们是如何处理这些问题的？在他们为自己公司的解决方案中，是否也为他提供了一些想法？


    理查德看向其他人，在短暂的沉默后，是保罗开口了：“嗯，虽然我们两家公司的规模都没有像你那样大，汤姆，但它们都面临着与关键客户相关的决策。这些是基于价值观的决策。在两种情况下，定义我们实体身份的、使我们在市场中脱颖而出并标定我们产品价值
    $ 的价值观，都受到威胁。在两种情况下，我们都可能失去一位宝贵的客户。贵在是因为我们与他们的关系，贵在是因为他们对我们的生存提供了财务贡献。”


    “在其中一家公司的情况下，”卡拉姆若有所思、谨慎地说，“我们不知道发生了什么，我们的市场来源无法识别问题背后的原因。但是，”他继续得更加不自信，“在第二家公司的情况下，我们知道问题的来源，但还没有决定如何向我们的客户提出这个问题。”


    “不确定性。双重的不确定性，”杰米插话道，语气带着一丝尖锐，“都是由于客户向我们隐瞒信息。其中一个，我们认为是因为欺骗。另一个……”看到理查德向他投来犀利的目光时，他的声音消失了。


    “我明白了，”汤姆说道，他也看到了那个眼神，因此克制了深挖的冲动。他知道自己不能再转移话题了。“那么关于兰道斯的价值观练习，你们进展到哪一步了，你们认为下一步是什么？”


    理查德点头让杰米继续讨论，杰米在汤姆面前放了一张照片，那是他和理查德与管理团队第一次会议时拍摄的白板照片。


    - 什么？……你们的价值观是什么？

    - 为什么？……这些价值观对你们的业务至关重要吗？

    - 谁？……这会影响谁？

    - 如何？……你们如何创造价值 $？

    - 你们会监控你们的核心价值观吗

    - 你们会让它们对你们的信息供应商变得重要吗

    - 你们会让它们对你们的读者来说真实吗

    - 你们会让它们为你们的员工发挥作用吗

    - 它们会回报公司利润吗


    “我们和管理团队一起编写了这些，它们成了我们的议程，是我们规划的基本大纲。它确定、提出并回答了关于完全‘认证材料’与‘免责声明保护’的未经证实材料的问题，”杰米解释道。


    “我看到财务评估了，”汤姆说，“但坦率地说，如果分发量足够大，我们可以证明支持未经实的材料是合理的。“免责声明保护’是你们这样称呼它的？”


    “是的，”杰米回答道，尽管团队中有些人将其称为‘免责声明羞辱者’材料。”


    汤姆挑起眉毛。“他们是这样看的吗？有趣。”


    （注：原文后续存在大量重复内容，已按要求清理重复部分）


