    ## Chapter 9 – The Gambler’s Genes


    heralded a super-hero saving the planet – this is far too addictive. And by the
    time Dan realized how his Eco-Warrior fame was funded, it was too late.


    At first it was easy to feign disappointment, concern even, when he heard artifacts
    had gone missing, or were misdirected in transit. But eventually, the organization
    that sprung up to support him in his work became such a finely tuned machine,
    it enabled him to separate himself mentally and physically from the money-making
    mechanisms that were funding what was all after an objective critical to humanity.
    And then he turned his back, and ears, on what was after all, just rumor and innuendo.
    Believing, smoothly assured him, this was all so undeserving of the attention
    of the mighty Eco-warrior that was DanRan.


    The publishing company had been a great solution. Anna’s idea, under pressure
    from Enrico to find distractions for Dan as the mighty warrior grew tired of his
    rainforest escapades and was starting to consider retiring. If he did this, the
    shipments under his name that currently went unchecked by the authorities would
    be scrutinized and Enrico couldn’t afford for this privilege to be lost. Enrico
    had made it clear to Anna: find a way to keep Dan heading the organization.


    And putting their son into the publishing company, in a non-managerial watch-dog
    role – now that was was a master stroke.


    ## Chapter 10 – ROR – Return on Revenge


    Ike lifted his water bottle and took a sip, hesitated, then continued drinking.
    He wasn’t thirsty. It was a pause setter. He knew how to use silence. He’d conducted
    countless interviews over the years; his manipulation of the pause tool was masterful.


    The water lapping at the pillars of the pier became more vigorous, encouraged
    by the wake of a passing river boat. Ike allowed himself to be distracted by their
    boisterousness, it helped the waiting. He leaned over the rail and looked across
    the water, the river was at its narrowest here, the other side so clear he could
    watch the people walking along the bank, voyeuristically participating in their
    activities. For a fleeting moment, his attention settled on a couple who looked
    familiar, celebrities in an unguarded liaison. His hand automatically started
    to reach into his pocket for the small camera he always kept on hand for such
    opportunities. Then he remembered the priority. He was waiting, trying to out-silence
    his informant.


    But Geoffrey was good. Years of slinking through the Randall corporation, noticing
    without being noticed. Silence was a skill he had crafted, and he was also masterful.
    So they stood in silence. The informant and inquisitor. Each wanting something
    from the other, neither prepared to move.


    So Ike put down his drink, and he asked the question, knowing the asking may spook
    Geoffrey. But Geoffrey was ready to talk, his hesitation just part of his game.


    “Tom believes something in the organization stinks?”

    Geoffrey shrugged carelessly at Ike’s question and answered with another, staying
    in the game, “But that’s not really the question, is it? The real question is
    whether or not there is something that stinks.” Then he drained his bottle of
    beer in a dramatic gesture, put it down with a thud and said “And there is . .
    .”


    Ike started to ask ‘why’, but paused, turning to look at Geoffrey and asked instead,
    “Why do you want to tell me this? What’s it to you whether Randalls have dirt
    in their background? So they’re doing a Values exercise. The management team think
    it is to create better value for their readers, to increase or restore the integrity
    of the material they print. But what you’re saying is that Tom doing it because
    he thinks something stinks. And you’re saying Tom’s right. So what do you think
    it is?”


    “I don’t think. I know.” Geoffrey turned to look at Ike, to study the impact of
    his words. He repeated, “I know. I know what stinks. It’s me.” And he laughed.
    A reedy laugh, thin and high pitched. Unpleasant to Ike who had developed a tolerance
    for the unpleasant.


    Geoffrey told Ike the story. How he was the son of Dan Randall and Anna Dravinsky.
    His surname registered as Dravers, so there was no connection between the three
    of them. Firstly, it had been for protection, as Anna had been afraid of Enrico’s
    reach; then it was for connection, to prevent the corporate from knowing the story.


    Finally, Geoffrey stopped playing his little game. He told Ike about the trade
    in antiquities, unknowingly confirming the jigsaw pieces of information Ike had
    collected, and at the same time filling in the gaps of Ike’s knowledge. The story
    was unfolding for Ike in such detail he had no reason to doubt its truth, but
    it was so absorbing that he couldn’t even register in his mind the excitement
    he would normally taste when handed such a blockbuster of a tale.


    As he grasped each detail and mentally checked it off against his own knowledge,
    Ike realized Geoffrey still hadn’t told him ‘why’ he would tell him the story.
    Geoffrey knew he couldn’t stop him from publishing. Yet neither tried nor asked
    for anything. What did he want? Recognition? Money? What was his motivation?


    But slowly it emerged. Geoffrey, the illegitimate son Dan refused to acknowledge,
    wanted Dan’s acknowledgement – nothing else. The great hero DanRan – not only
    was he not the eco-warrior the world believed, not only did he have a son with
    the woman behind the antiquities fraud, but he was now publishing material from
    unreliable sources, entirely contravening the fundamental ‘Value’ upon which Randalls
    had been built.


    It was a story, indeed. A scoop of a story. But Ike knew it was more than that,
    this is what would knock Randalls off the block with Magna Media and give e-Celebs
    the opportunity to take their place. But even more than that, he could deliver
    on his promise to Mack Spencer and the Board - Randalls!


    And what did Geoffrey want? He wanted only one thing. He wanted to deliver the
    news to his ‘Father’. The Father who had denied him his rightful place in the
    organization and his legacy. In other words, Geoffrey wanted Randalls. High stakes
    indeed.


    But Ike wasn’t ready to show his hand yet. He feigned curiosity. “I don’t get
    it. Why the fuss? A simple disclaimer would resolve any problems – it’s what we
    do. We get ‘info out’ – that’s what our readers pay for. OK, it’s sometimes, often,”
    he soothed uncaring, “not correct – what does it matter?” He spread his arms wide
    and shrugged his shoulders emphasizing his disinterest. “As if anyone really cares.
    And the celebs ... well, no publicity is bad publicity so if it’s incorrect, or
    even untrue.” He snorted his spittle laugh.


    “Randalls have a different audience, a different readership.” Geoffrey surprised
    himself by his sudden leap to defend. He paused to regain his composure. “Well,
    that’s what ‘they’ say.” He laughed to cover his unease. “This ‘Values’ exercise
    is not only about corporate values, and finding out if there is anything wrong
    in the company, but it’s also about understanding how to place ‘value’ on the
    product for the readers.


    “The management team have been sending out blurb about what they are doing, and
    why, and they have put together a ‘focus group’ made up of people from a cross-section
    of the company. I managed to get myself voted into this group,” he rolled his
    eyes to show disdain. “Obviously, I needed to find out what was going on.” he
    explained unnecessarily.


    “Finance have done a financial analysis of ROI valuation, Return on Investment,”
    Geoffrey explained condescendingly, knowing Ike would know financial terminology,
    “i.e., they have put a $ figure on the price difference between verified and unverified
    material. It’s a metric which they succeeded in looking very complicated, but
    basically it’s an analysis of high verification cost = high cover cost = low readership,
    versus low verification cost = low cover cost = high readership.”


    “They compared different publications, including yours.” Geoffrey inflected his
    tone to incite disturbance in Ike, and it worked. Ike jerked his head to look
    at him.


    “Oh yes, interesting market information they have on your publication, its methods
    and its sources. But anyway,” he continued smoothly, “it’s only interesting to
    them in terms of their ‘Values’ exercise.”


    Geoffrey reached into the pocket of his jacket and pulled out some sheets of A4
    paper. They looked tatty, but he handed them over to Ike. Ike opened them casually
    and could see the financial metric, and market information. He saw his company’s
    name, but didn’t linger on the detail. No reason to look too interested.

