    it is to create better value for their readers, to increase or restore the integrity
    of the material they print. But what you’re saying is that Tom doing it because
    he thinks something stinks. And you’re saying Tom’s right. So what do you think
    it is?”


    “I don’t think. I know.” Geoffrey turned to look at Ike, to study the impact of
    his words. He repeated, “I know. I know what stinks. It’s me.” And he laughed.
    A reedy laugh, thin and high pitched. Unpleasant to Ike who had developed a tolerance
    for the unpleasant.


    Geoffrey told Ike the story. How he was the son of Dan Randall and Anna Dravinsky.
    His surname registered as Dravers, so there was no connection between the three
    of them. Firstly, it had been for protection, as Anna had been afraid of Enrico’s
    reach; then it was for connection, to prevent the corporate from knowing the story.


    Finally, Geoffrey stopped playing his little game. He told Ike about the trade
    in antiquities, unknowingly confirming the jigsaw pieces of information Ike had
    collected, and at the same time filling in the gaps of Ike’s knowledge. The story
    was unfolding for Ike in such detail he had no reason to doubt its truth, but
    it was so absorbing that he couldn’t even register in his mind the excitement
    he would normally taste when handed such a blockbuster of a tale.'
