    ‘commercially justifiable’? No. And with all due respect to the situations highlighted
    in this book, these haven’t really been our experience, perhaps it is because
    Mitch and I grew ‘grew up’ in the business together so we have just naturally
    developed these Values based philosophies together.


    he actively involves in the decision making, have helped him reset and redefine
    the Values that will protect the business. These Values are serving him well as
    we see in this second book when he is confronted with PETRA’s disrespectful attack.


    These philosophies have determined how we support each other in our roles, our
    families, our staff and our business practices. They’re not written on the wall
    for everyone to see and adhere to, although now that the business has grown, and
    we are international, it’s become important to see that our philosophies are absorbed
    by everyone.


    Tom on the other hand, is managing a business that is mature, whose market has
    undergone a change, as has the management structure. It was not only appropriate,
    but indeed a life saver, that as a management team they formally planned and agreed,
    their Values practices.


    We started the company in an unusual way, we knew the Uni guys and they did programming.
    I was at the beginning of my career as an Accountant but interested in programming
    and I was learning it in my spare time. We funded the Uni guys, and put them in
    a house. They worked on the sofas and swam in the pool. For a long time nothing
    seemed to happen, but I would stop in on them each day on the way home from work,
    and eventually they produced code that someone bought. First payment from first
    client. We had a company!


    Neither of these situations we encountered in our business, but what we share
    with both FutureSafe and Randalls is the clear understanding that Values protect
    profit.


    Values saved the situation for both Paul and Tom’s companies,


    So we have more clients now, here and overseas, and our Values philosophy towards
    our clients, current and future, is quite narrow. Micro rather than macro. We
    share what we know, what we have, what we do. For current clients it only ensures
    we fit seamlessly with their business, but the shared knowledge helps us both
    to grow. And for potential new clients we share what we know and have helped companies
    get established who have not needed our services, just as companies have helped
    us whose services it transpired, we didn’t need – and collectively we are all
    citizens of the wider business community. It has opened doors for us here and
    overseas, developed allegiances that have gone far beyond the cash return on sale
    of product.


    > and our Values philosophy has directly contributed to our growth, the micro
    becomes the macro moving us into wider and wider business circles. Yes, Values
    are important to us, because in protecting our company, they protect the profit
    – which protects our families, our staff and our clients – this ultimate contribution
    our business makes.


    Business changes, nothing is certain, there are always the ‘black swans’ and we
    have not been exempt from these, but the shared Values or philosophies we live
    by our business and families have created the platforms sought by FutureSafe and
    Randalls.


