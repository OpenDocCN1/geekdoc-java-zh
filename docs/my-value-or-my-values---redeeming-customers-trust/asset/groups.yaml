    ## 第14章 – 丘吉尔的巅峰时刻


    我们把它呈现了出来。但如果只是把真相摆在人们面前而不解释它的含义，是不负责任的。难道你会因为生蔬菜在烹饪前营养最高，就给婴儿吃生蔬菜吗？我们必须计划发布真相的方式，以便对那些无辜受影响的人造成最小的伤害。诚实是我们的价值观，而管理它的影响同样是我们价值观的一部分。


    杰米犹豫地开始开口，他不想打扰讨论，但觉得迫于向他们分享一个重要的观点。“当我们创立价值观公司（Values Inc.）时，我们问了自己四个问题，而最后一个问题与汤姆说的话非常相关。我们问自己：‘我们的价值观如何为我们的产品、客户和员工创造价值？’这是一个非常相关的问题。汤姆说得对。诚实是你们价值观的核心，你们已经确定它对你们的产品、客户和员工有价值。我们需要考虑如何让它与他们产生关联。但只有通过能够同时保护他们的方式进行管理，它才可能产生关联。”


    现场陷入了沉默，当汤姆看到他们都冷静下来并对这一点达成共同时，他问问马修和阿比：“所以，你们对这没意见吧？”


    他们毫不犹豫地点头表示同意。“但萨姆呢？”阿比问道。


    “等一下，”汤姆说，“我们需要给他一些时间，如果有必要，我会去和他谈谈。但目前，我觉得我们应该开始计划了。”


    “是的，”马修用力地说道，“我们正准备要做两件事：和格纳公司（Magna）讨论核实他们的来源，以便满足我们‘可验证的价值观’；同时，我们要告诉世界我们是一个骗子。”


    杰米紧张地看向理查德，但理查德笑了并表示同意。“大体如此，”他打破了紧张。“我们提议的，”理查德带头，“是三个独立的练习，由你们每人负责。我们需要涵盖的三个领域是格纳、大市场，以及我们需要决定如何向员工和合同撰写者涵盖这些内容。每个练习涵盖三个方面：计划、发布和持续管理。”


    “我们想过，”阿比看起来有些不确定。


    “是的，”汤姆回答道，“我们昨晚研究了一套映射方法，我们也认为最好在‘作战室’模式下工作。我们所有人都在同一个房间里工作，这样我们可以共享信息并互相提问，而不受时间或距离的限制。我们需要速度、沟通流和互动，以确保所有三个领域顺畅地结合在一起。”


    “我们还没有决定的是是在会议室设立，还是在价值观公司那边。如果我们在这里设立，每个人都会纳奇我们在干什么；如果我们转到价值观公司，每个人都会奇怪我们为什么缺席了业务。”


    “我认为那是第一份公告的一部分，”马修说，“在不误导人的情况下，我们可以告诉大家，这是管理团队在过去几周里一直工作的延续。事实如此，在确定了价值观后，我们现在需要确定如何将它们推向市场。我们已经分了项目小组——这是事实，而且我们需要解释为什么詹姆斯和萨姆，”他犹豫了，“嗯，至少詹姆斯，”没有加入小组。我们可以和他讨论。但随后我们需要告知我们已经设定了截止日期，所以我们都在为实现这一目标而努力。”


    “基于此，如果我们搬到办公室外，他们会很惊讶的；他们需要看到我们在这里工作，表现出传达正常感的心态，即使我们内心并不这么觉得。”他紧张地笑了一下，汤姆惊讶地看着他，然后意识到他们现在都有些紧张。他看了看其他人，他们看起来还好。正在专心。


    “好，”汤姆果断地说，“所以我们把这个房间布置成作战室，并开始价值观实施的下一阶段工作。”


    “如果是那样，我们现在就可以开始了，”理查德说。杰米给每个人分发了一包文件，剩下的两份文件提醒了大家萨姆和詹姆缺席。


    杰米打开了留给自己的那一份，“正如你们所看到的，有一份中央计划指南与三个不同领域相关，这样我们就能识别出完全属于这三个领域的行动，以及它们在何处交汇以保持一致。”他看向理查德和汤姆。“我们将做什么来帮助阿比？”


    汤姆迅速回答，“我们都需要时间读完这些文件。尽管你、理查德和我昨晚把它们合在一起，但我们现在需要重新过，特别关注我们正在处理的实际计划领域。在我们分小组之前，我们就知道萨姆的情况了。”


    当他们阅读文件时，现场陷入了沉默，汤姆的绪飘到了他正带领他们进入的境地，以及缺席的萨姆。萨姆是试金石。他一直都是试金石。他的反应总是坦率且忠诚，在过去的许多时候一直是汤姆的舵，不仅是在他在财务的角色中。他现在的缺席令人不安，他对丹的忠诚很强，但汤姆确定他对真实的忠诚会胜过一切。他可以等。


    半小时后，他们之间开始了小交谈。马修和阿比开始做了一些笔记，所以理查德认为是时候开始分组了。他看向汤姆，“我在想也许我可以在和你阿比之间穿梭，也许既然你和我们一起编写了文件，我可以先花点时间陪阿比？”


    汤姆只是点了点头。理查德加入了阿比，马修和杰米移到窗边，开始布置计划包。汤姆开始根据标记为‘格纳’的时间表做记录。


    二十分钟后，门开了，萨姆走了进来。他没有任何表情，安静地关上门，走到桌旁，在桌上放了一个 U 盘。他清楚地模仿温斯顿·丘吉尔的语气说道……“我们将在书架上与他们战斗。”


    ## 第15章 – 告别与收获


    脱掉外套，松开领带，卷起袖子，每个人手里有一瓶啤酒。他们坐在会议室外的阳台上。每个人看着河流全景的不同一个点。汤姆、保罗、卡拉姆、萨姆、杰米、理查德和马修。每个人都记得旅程中的不同部分。但都记得代价。


    那天丹的葬礼是一次安静的聚会，并不是为了避免近期‘发布’带来的媒体关注，而是因为他在他的遗愿书（Deed of Wishes）中明确规定了这一点。他指示，由于他没有家人，汤姆只需邀请他认为对他推进其‘出版愿景’贡献最大的人。对汤姆来说，丹没有定义他的“出版愿景”，让汤姆可以根据自己的想法自由解读。


    没有家人。汤姆想到了杰弗里。当他和伊凯进入格纳董事会会议揭露他们的宏大曝光时，杰弗里脸上的震惊并没有让他感到愉快，结果却看到汤姆和萨姆与格纳的高管坐在一起。直到那天，汤姆才知道杰弗里是丹的儿子，当然这并不是由于他与伊凯的结盟。他只知道格纳董事会所知道的：伊凯打算揭露一些与兰达尔（Randalls）相关的、对格纳可能有损害的信息，以及有一个愿意公开身份的完美来源。


    他们即将揭露的内容，格纳的每个人都知道，因为汤姆向他们分享了管理团队在过去几周所做的价值观工作，他也告诉了他们关于即将发布的丹的故事。但对于伊凯“完美来源”的身份，他们非常震惊，以及那个来源与丹的关系。


    汤姆对杰弗里感到同情，他不怪他，并想过如果自己处在杰弗里的位置会怎么做。一旦他意识到杰弗里的情况，他就尽力平息局面，作为兰达尔的首席执行官，并拥有丹遗产的代理权，他竭尽全力为杰弗里考虑一个合理的解决方案。但他不能把公司交给他，杰弗里想要给予丹本人的羞辱从未发生，因为在过去的几周里，丹病情已经重到无法感知周围的一切。他的死亡既没有悲伤也没有祝福。


    汤姆邀请了安娜和杰弗里参加葬礼，这是丹遗愿的宽泛解释，但无论如何，他们都没有出席，他们关于遗产赔偿的讨论也没有成功，因此现在将由各自的律师来解决。以此，汤姆的思绪转向了他的新责任，新公司的首席执行官，兰达尔与格纳合并的结果。


    萨姆思绪也在杰弗里身上。当杰弗里和伊凯进入格纳董事会会议时，他感到了最大的震惊。不，不是进来时，萨姆从未信任过杰弗里，所以他是“完美来源”并没有让他感到震惊，甚至感到意外。事实上，这让他松了口气，因为他一直担心那是一个他看重的人。但杰弗里是丹的儿子，以及他为了报复所付出的代价，让萨姆深感震惊，尽管他并不认同汤姆的情感。


