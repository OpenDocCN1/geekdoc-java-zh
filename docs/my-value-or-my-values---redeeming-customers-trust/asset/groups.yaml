    # The Values Trilogy

    Redeeming Customers'' Trust 2


    # MY VALUE OR

    MY VALUES


    Balancing Value, Values and Profit


    Heather E. Robertson


    Heather Robertson has worked in many areas of business in New Zealand and overseas,
    establishing an advisory business 22 years ago with a unique contributory philosophy
    which includes involving clients in assisting each other in an environment of
    shared experiential learning.


    For 10 years she has run a no-charge monthly programme for selected business leaders
    recognising that it’s lonely at the top – and providing them with a confidential
    environment to assist each other and address key issues in their companies.


    # Dedication


    These books are dedicated to the T-shirt leaders whose interviews are included.


    They were prepared to tell their stories and share their experiences so you can
    learn, and so you know you are not alone in the problems and difficulties you
    face.


    They know the Hard Knocks Café, have been there, bought the T-shirt and worn it
    to tatters ... and they go on wearing it.


    # Heather E. Robertson


    # STRATEGIES TO GO ...


    The Values Trilogy: My Value or My Values


    Balancing Value, Values and Profit


    Book 1: Rebirth of a Fallen Company


    Book 2: Redeeming Customers'' Trust


    Book 3: Restoring their Peoples'' Pride


