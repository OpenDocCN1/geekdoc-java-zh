    # Different scanning and security tools


    +   **SAST Tools (Static Application Testing):** These tools use SonarQ and Veracode,
    analyze the source code or compiled code of an application to identify potential
    security vulnerabilities and coding errors.


    +   **DAST Tools (Dynamic Application Testing):** OWASP and Burp Suite are examples
    of DAST tools. They evaluate the security of running applications by sending various
    requests and analyzing the responses, helping to identify vulnerabilities that
    may arise during runtime.


    +   **IAST Tools (Interactive Application Testing):** IAST tools like Contrast
    Security and Synops provide real-time monitoring of applications during runtime.
    By instrumenting the code, they detect vulnerabilities and provide insights into
    the specific components causing the issues.


    +   **SCA Tools (Software Composition Analysis):** SCA tools like Black Duck and
    WhiteSource examine the open source code in an application''s codebase. They identify
    any known vulnerabilities or license compliance issues with the third-party libraries
    and dependencies.


    # Difference code scanning and security tools'
