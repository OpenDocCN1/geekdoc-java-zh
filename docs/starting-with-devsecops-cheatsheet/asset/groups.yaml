    # 从 DEVSECOPS 开始


    # 前言


    欢迎来到 DevSecOps 的世界！随着技术以前所未有的速度不断进步，组织不断寻找在保持最高水平安全性的同时更快地交付软件的方法。在这个快速演变的格局中，DevSecOps
    已经成为一种关键方法，弥补了开发、安全和运营团队之间的鸿沟。


    提供更安全、更可靠的软件产品。此外，通过将安全性集成到开发过程中，组织可以实现安全与业务目标之间更好的对齐，从而增强客户信任并获得竞争优势。


    本速查表作为一份实用的参考指南，旨在帮助你了解 DevSecOps 的核心原则、实践和工具。无论你是开发者、安全专业人员、运维工程师，还是任何参与软件开发周期的的人，本速查表都旨在为你提供必要的知识和最佳实践，以便将安全性无缝地集成到你的开发流程中。


    # 理解 DEVSECOPS


    DevSecOps 是一种软件开发方法，它将开发 (Dev)、安全 (Sec) 和运营 (Ops) 实践整合到一个统一的协作流程。它旨在将安全措施和考量整合到软件开发周期的每一个阶段，从设计、编码到测试和运营。传统上，软件开发过程通常将安全视为一个独立且隔离的问题，在开发周期的后期处理或将其作为事后考虑。这种方法可能会导致漏洞和安全问题发现得太晚，从而导致延迟、成本增加和潜在的泄露。


    # 简介


    DevSecOps 的首要目标是培养共同责任、协作和持续改进。通过从一开始并贯穿整个软件开发周期引入安全性，组织可以主动处理漏洞并确保其应用程序和系统的韧性。


    DevSecOps（即开发、安全与运营）是一种创新的软件开发方法，强调将安全实践和原则整合到软件开发周期的每个阶段。它是组织传统处理软件开发方式的一种根本性转变，通过从最开始就优先考虑安全，并将其无缝地集成到开发过程中。通过打破开发、安全和运营团队之间的孤岛状态，在整个开发过程中促进协作和共同责任。通过采用这种方法，组织可以主动最大限地减少漏洞，并交付更安全、更具韧性的软件解决方案。采用
    DevSecOps 方法的益处非常多。它允许组织更有效地应对不断变化的威胁格局，缩短检测和缓解安全问题的时间，并最终交付。


    另一方面，DevSecOps 主张安全从一开始就应该是开发过程的固有部分。它推了一种“左移”思维，即在早期并贯穿始终应用安全实践。通过将安全实践整合到 DevOps
    工作流中，组织可以主动识别和处理安全风险，减少漏洞并确保安全性的维持。


    DevSecOps 还采用自动化和工具化来简化安全实践，使开发者能够轻松将安全控制整合到其工作流中。通过为开发者提供构建安全代码所需的工具和资源，DevSecOps
    赋予他们承担安全责任的能力，并确保安全措施在整个软件开发周期得到一致的实施。


    # DEVSECOPS 中的核心主题


    DevSecOps 的核心主题可以总结如下：


