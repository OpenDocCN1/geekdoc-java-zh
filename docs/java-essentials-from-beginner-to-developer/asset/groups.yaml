    The Executor framework is a high-level replacement for explicitly managing threads
    in applications. It provides a layer of abstraction over explicit thread management
    by allowing you to execute tasks asynchronously. The primary components include:


    +   - Executor: An interface that represents an object that executes provided
    tasks.'
