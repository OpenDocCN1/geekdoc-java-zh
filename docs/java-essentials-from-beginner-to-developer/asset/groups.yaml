    \ videos).\n- Working with serialized objects.\n- Interacting with data streams\
    \ that come from sources or go to destinations that do\n"
  mdcn: "\n写入：向文件写入数据同样灵活。`FileOutputStream` 和 `FileWriter` 分别适用于二进制数据和字符数据。对于要追加的数据，这些类的构造函数接受一个布尔参数，用以指示是否应将内容追加到文件末尾。\n\
    \n追加：当你想要向文件的现有内容添加内容而不覆盖它时，可以使用支持追加模式的构造函数或方法。在 NIO 中，`Files.write(Path, byte[],\
    \ StandardOpenOption.APPEND)` 方法方便了这种操作。\n\n## 10.1.4 Try-with-Resources 和 AutoCloseable\
    \ 接口\n\n文件处理和流操作中的一个重要关注点是确保资源在使用后正确关闭，以防止资源泄露。Java 在 Java 7 中引入的 `try-with-resources`\
    \ 语句简化了语句执行结束时的资源关闭工作。为了与该语句兼容，资源必须实现 `AutoCloseable` 接口，该接口包含了所有的流和相关资源。以下是其用法的简洁示例：\n\
    \n在这个示例中，`FileReader` 是实现 `AutoCloseable` 的资源。一旦退出 `try` 块（无论是正常退出还是由于异常），它都会自动关闭，从而显著减少了样板代码并降低了资源泄露的风险。\n\
    \n## 10.2 NIO 包\n\n### 10.2.1 Java NIO 简介\n\nJava NIO（新输入/输出）在 Java 1.4 中引入，作为标准\
    \ Java I/O API 的替代方案和补充。它提供了非阻塞 IO 操作、面向缓冲器的数据处理方法，以及通过单个线程管理多个网络连接的能力。NIO 的核心组件包括通道（Channels）、缓冲区（Buffers）、选择器（Selectors）和字符集，实现了更快速、更具扩展性的\
    \ I/O 操作，特别是对于需要同时管理大量连接的应用（如 Web 服务器）。\n\n### 10.2.2 缓冲区：NIO 的核心\n\n缓冲区（Buffers）是\
    \ NIO 中的核心概念，代表一段连续的内存，数据在 I/O 操作期间临时存储其中。与传统 I/O 模型中以线性、顺序方式处理数据的流不同，缓冲区允许对数据的随机读写。Java\
    \ NIO 中的缓冲区是分类型的；即针对不同的数据类型有不同的缓冲区类，如 `ByteBuffer`、`CharBuffer`、`IntBuffer` 等。这些缓冲区在\
    \ `flip`（翻转）机制下运行，缓冲区从写模式切换到读模式，确保了高效的数据访问和处理。\n\n### 10.2.3 通道：处理 IO 的新方式\n\n\
    通道（Channels）可以被看作是缓冲区和外部实体（例如文件或网络套接字）之间传输数据的管道。它们提供了一个统一的 API 来管理各种类型的 I/O 操作，如从文件读取和写入文件以及网络通信。主要的通道类型包括用于\
    \ I/O 的 `FileChannel`、用于 TCP 网络 I/O 的 `SocketChannel` 以及用于 UDP 网络 I/O 的 `DatagramChannel`。与流（streams）相比，通道支持在同一个实例上同时进行读和写，从而提供了更灵活、更强大的数据处理能力。\n\
    \n### 10.2.4 选择器：使用 NIO 进行多路复用\n\n选择器（Selector）组件允许单线程监控多个通道事件的机制，例如数据到达、连接打开或读写就绪。这种能力使得开发高度可扩展的网络应用程序可能，无需为每个连接创建一个线程，显著减少了资源消耗并提高了性能。通过向选择器注册多个通道，应用程序可以以非阻塞的方式高效管理成千上万个打开的连接，检查\
    \ I/O 事件并在发生时进行处理。这对于实现处理许多并发连接的服务器（如 Web 或应用服务器）特别有用。\n\nJava NIO 引入缓冲区、通道和选择器标志着\
    \ Java I/O 能力的重大增强，为开发者提供了构建高度可扩展且高效的网络和文件 I/O 应用的工具。从基于流的模型向面向缓冲区的模型转变，允许对数据处理方式进行更多的控制和灵活性，使\
    \ Java NIO 成为现代 Java 应用开发中的组成部分。\n\n## 10.3 在 Java 中读写文件\n\n### 10.3.1 使用 FileInputStream\
    \ 和 FileOutputStream\n\n`FileInputStream` 和 `OutputStream` 是来自 `java.io` 包的类，设计用于字节流的形式从文件读取和写入，它们在处理图像和可执行文件等二进制数据时非常有效。\n\
    \n- FileInputStream：它被用于从文件中读取数据。数据以字节格式读取，这意味着它是按字节逐字节读取的，适用于读取二进制文件。\n\n```\n\
    FileInputStream fis = new FileInputStream(\"example.txt\");\nint i;\nwhile ((i\
    \ = fis.read()) != -1) {\n    System.out.print((char) i);\n}\nfis.close();\n```\n\
    \n- OutputStream：此类被用于向文件写入数据。与 `FileInputStream` 类似，它按字节逐字节操作数据。它对于向文件写入二进制数据特别有用。\n\
    \n```\nOutputStream fos = new File(\"output.txt\");\nString data = \"Hello World!\"\
    ;\nfos.write(data.getBytes());\nfos.close();\n```\n\n### 10.3.2 Reader 和 Writer\
    \ 类\n\n对于面向字符的数据（如文本文件），Java 在 `java.io` 包中提供了 `Reader` 和 `Writer` 抽象类。\n\n- `FileReader`\
    \ 和 `FileWriter` 是用于读写字符文件的子类。与字节流（`FileInputStream`/`FileOutputStream`）不同，这些设计用于处理字符，使得它们非常适合处理文本文件。\n\
    \n### 10.3.3 使用 NIO Files 类进行高效 IO\n\n`java.nio.file` 包中的 `Files` 类提供了一系列用于文件和目录操作的静态方法。这些方法设计为使用\
    \ `Path` 对象，使得文件操作执行更加高效且简单。\n\n- 读取文件：\n\n```\nPath path = Paths.get(\"example.txt\"\
    );\nbyte[] fileArray = Files.readAllBytes(path);\n```\n\n- 写入文件：\n\n```\nPath\
    \ newPath = Paths.get(\"newfile.txt\");\nbyte[] data = \"Sample text\".getBytes();\n\
    Files.write(newPath, data, StandardOpenOption.CREATE);\n```\n\n### 10.3.4 Path\
    \ 和 Paths：NIO2 增强\n\nJava 7 引入的 NIO.2 文件 API 增加了 `Path` 接口和 `Paths` 工具类，为处理文件系统提供了更全面的方法。\n\
    \n- Path：代表与系统相关的路径。它是一个用于定位文件系统中文件的对象。提供了检查、定位和操作文件系统对象的方法。\n\n- Paths：工具类，包含静态方法，可以通过转换路径字符串或\
    \ URI 返回 `Path`。\n\n采用 `Files` 类以及 `Path`/`Paths` 接口可以使文件 I/O 操作更具可读性和可维护性，提供了符号链接处理、文件属性访问和目录遍历等高级功能，这些功能在传统的\
    \ I/O 流中无法直接获得。\n\n## 10.4 理解字节流和字符流\n\n### 10.4.1 字节流与字符流的区别\n\nJava I/O 流分为两大类：字节流和字符流。字节流（`InputStream`\
    \ 和 `OutputStream` 的子类）主要用于处理原始二进制数据，如图像文件、音频文件和序列化对象。它们按字节读写数据。字符流（`Reader` 和\
    \ `Writer` 子类）则设计用于处理字符数据，如文本文件。它们按字符读写数据，自动处理字符编码和解码，从而抽象了字符与字节之间转换的复杂性。\n\n\
    ### 10.4.2 何时使用字节流而非字符流\n\n当处理原始数据或不一定字符二进制的文件时，应该使用字节流。示例包括：\n\n- 读取或写入二进制文件（例如图像、视频）。\n\
    - 处理序列化对象。\n- 与来自源或去往不代表字符的数据流交互。\n\n"
