    \n## 7.4.2 方法重载 vs 方法重写\n\n方法重载（静态多态）：它允许一个类拥有多个同名但方法签名不同（即参数列表不同）的方法。通过根据输入参数以不同方式处理相同的方法，它提高了代码的可读性和可重用性。\n\
