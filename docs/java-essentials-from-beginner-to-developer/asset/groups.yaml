    The String class in Java is used to store and manipulate sequences of characters.
    Strings are immutable, which means once a String object is created, its content
    cannot be changed. If you perform any operation that modifies a string, Java creates
    a new String object to hold the result.


    Java provides a rich set of methods in the String class to perform various operations
    like comparing, concatenating, splitting, searching, and examining individual
    characters in the string.


    # 4.2.2 Creating and Initializing Strings


    Strings can be created in Java in two ways: by using the string literal or by
    using the new keyword.


    +   - Using String Literal


    ```

    String greeting = "Hello";

    ```


    When you create a string using string literal, Java checks the string pool first.
    If the string already exists, then it returns the reference to the same instance.
    This way, Java saves memory.


    +   - Using new Keyword


    ```

    String str1 = "Hello";

    String str2 = "Hello";

    boolean result = str1.equals(str2); // true

    ```'
  - '[PAGE 45]


    This will create a new string object in memory, even if the same string exists
    in the pool.


    # 4.2.3 Comparing Strings: Methods and Operations


    Java provides several methods to compare String objects:


    +   - equals(): This method compares the actual content of the string. It returns
    true if the strings are equal, and false otherwise.


    ```

    String str1 = "Hello";

    String str2 = "World";

    int result = str1.compareTo(str2); // Negative value

    ```


    +   - equalsIgnoreCaseCase(): This method is similar to equals() but ignores case
    during comparison.


    ```

    String str1 = "hello";

    String str2 = "Hello";

    boolean result = str1.equalsIgnoreCase(str2); // true

    ```


    +   - compareTo(): This method compares two strings lexicographically and returns
    an integer value. A value of o means both strings are equal. A value less than
    o indicates the calling string is lexicographically less than the argument string.
    A value greater than o indicates the opposite.'
