    \n## 7.4 Polymorphism in Action\n\nPolymorphism is a core concept in object-oriented\
    \ programming that allows actions to operate differently based on the actual object\
    \ that the action is being performed on. It enhances flexibility and the ability\
    \ to extend code without modifying it. Polymorphism comes in two types in Java:\
    \ static (compile-time) and dynamic (runtime).\n\n### 7.4.1 Demonstrating Static\
    \ and Dynamic Polymorphism\n\n- Static Polymorphism is achieved through method\
    \ overloading. It occurs at compile-time. In static polymorphism, the response\
    \ to a function is determined by the parameter list at the time of compilation.\n\
    \nExample of method overloading:\n\n```java\nclass Display {\n  void show(int\
    \ x) {\n    System.out.println(\"Show with int: \" + x);\n  }\n\n  void show(String\
    \ s) {\n    System.out.println(\"Show with String: \" + s);\n  }\n}\n```\n\nDynamic\
    \ Polymorphism occurs through method overriding, meaning that the exact method\
    \ to be called is determined at runtime based on the object's instantiation. Example\
    \ of dynamic polymorphism:\n\n## 7.4.2 Method Overloading vs. Method Overriding\n\
    \nMethod Overloading (Static Polymorphism): It allows a class to have more than\
