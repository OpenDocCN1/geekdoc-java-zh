    \n动态方法分派是一种机制，其中对重写方法的调用在运行时解析，而不是在编译时解析。这就是 Java 实现运行时多态的方式。\n在这种场景下，引用类型 `Animal`\
    \ 并不决定调用哪个版本的 `sound()`。要调用的方法在运行时由实例的类型决定。\n\n## 7.4.4 多态的现实世界示例\n\n-   1. 图形用户界面（GUI）元素：不同的对象（如按钮、文本框和复选框）可能继承自一个公共父类（例如\
    \ `Component`）。每个对象都可以重写 `draw()` 方法来渲染自己。在遍历组件集合并调用 `draw()` 时，多态确保了为每个元素调用了正确的方法。\n\
    \n-   2. 支付处理系统：在支付系统中，不同的支付方式（信用卡、PayPal、银行转账）可能派生自 `Payment` 超类。每种方法都有其自己的 `processPayment()`\
    \ 方法实现。多态允许系统以统一的方式处理不同的支付类型，增强了代码的重用性和活性。\n\n多态（无论是静态还是动态）在简化复杂性方面起着至关重要的作用，它允许同一个接口用于不同的底层形式（数据类型或类），促进了代码的可重用性和系统的扩展性。\n\
    \n# 异常处理\n\n## 8.1 理解异常\n\n异常是程序执行过程中发生的破坏指令正常流的事件。在 Java 中，异常是在运行时抛出的一个对象，用于表示发生了异常情况。恰当地处理异常允许你的程序继续运行或优雅地终止，而不是因为不可见的问题而崩溃。\n\
    \n### 8.1.1 什么是异常？\n\n异常可以是执行程序遇到的任何错误条件或意外行为。当此类情况发生时，会创建一个代表该异常的对象，并从导致错误的方法抛出。该方法可以选择自己处理异常，也可以将其传递下去。如果方法没有处理异常，运行时系统将尝试在调用栈中寻找另一个可以处理异常的方法，如果未被捕获，最终会导致程序终止。\n\
    \n### 8.1.2 异常的类型\n\nJava 中的异常主要分为两类：受检异常（checked exceptions）和未检异常（unchecked exceptions）。\n\
    \n**受检异常（Checked Exceptions）**\n\n受检异常是在编译检查的异常，这意味着编译器要求代码要么处理这些异常，要么在方法签名中使用\
    \ `throws` 关键字声明它们。受检异常的存在标志着可以预料但无法避免的问题，合理的应用程序应该预见到并从中恢复。受检异常的示例是 `FileNotFoundException`。\n\
    \n**未检异常（Unchecked Exceptions）**\n\n未检异常代表程序中的缺陷（Bug）——通常是逻辑错误。这些异常在编译时不进行检查；它们在运行时检查。由于它们反映了编程错误，通常是不被预期的。示例包括\
    \ `NullPointerException` 和 `ArrayIndexOutOfBoundsException`。\n\n### 8.1.3 异常层次结构\n\
    \n所有异常类都是 `Throwable` 类的后代。`Throwable` 类分为两个主要的子类：`Error`（用于应用程序不应尝试捕获的错误条件）和\
    \ `Exception`，后者进一步分为受检异常和运行时异常（未检异常）。\n\n### 8.1.4 常见异常场景与处理策略\n\n-   输入/O 操作：这些操作容易失败，原因有很多，如文件不存在或硬件故障。策略包括使用\
    \ `try` 处理这些异常，或使用 `throws` 声明它们。\n\n-   空指针访问：像数组一样访问或修改空值。在访问方法或字段之前进行空值检查可以缓解此问题。\n\
    \n-   数组越界：尝试访问数组大小之外的元素。在访问数组之前确保索引检查可以防止此类问题。\n\n-   类型转换异常：将对象转换为其不是其实例的子类。可以通过转换前使用\
    \ `instanceof` 检查来防止。\n\n异常处理的关键不仅在于防止程序崩溃，还在确保资源（如文件句柄或网络连接）得到适当清理，并为用户和日志提供意义的错误信息以便调试。仔细的规划和异常使用可以显著提高软件的可靠性和可维护性。\n\
    \n## 8.2 try, catch 和 finally 块\n\ntry、catch 和 finally 块构成了 Java 异常处理机制的核心。它们共同工作\n\
    \n"
