    \ Polymorphism: Static and Dynamic\n\nPolymorphism in Java has two types: compile-time\
    \ (static) and runtime (dynamic).\n\n# Method Overloading\n\nMethod overloading\
    \ (static polymorphism) occurs within the same class when two or more methods\
