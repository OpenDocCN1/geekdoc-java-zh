    \n### 5.4.1 方法中变量的作用域\n\n变量的作用域决定了代码中哪些部分可以访问它。方法变量（称为局部变量）定义在方法内部，仅在该方法内可用。它们在方法执行完成后就会消失。这种有限的作用域有助于减少命名冲突。\n\
