    \ normally or due to an exception, significantly reducing boilerplate code and\
    \ minimizing the risk of resource leaks.\n\n## 10.2 The NIO Package\n\n### 10.2.1\
    \ Introduction to Java NIO\n\nJava NIO (New Input/Output) was introduced in Java\
