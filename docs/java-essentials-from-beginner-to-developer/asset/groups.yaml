    Method overloading is a feature of Java that allows multiple methods to have the
    same name within the same class, provided they differ in parameters (either the
    number of parameters, the types of parameters, or both). This does not concern
    the return type of the methods; it''s purely parameter-driven. Overloading enables
    a form of polymorphism, making methods more versatile in handling different input
    scenarios without needing unique method names for each variant.


    # 5.3.2 Overloading Methods with Different Parameter Types


    Java allows methods to be overloaded based on different parameter types. This
    means you can have multiple- versions of a method that accept different types
    of parameters. It allows a method to process differently typed inputs with the
    same logical operation encapsulated under the same method name.'
