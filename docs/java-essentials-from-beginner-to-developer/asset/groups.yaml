    \n- 私有（private）：私有修饰符将可见性限制在类内部。这是封装的核心原则，防止数据被意外访问和修改。\n- 默认（无修饰符）：允许在包内访问字段和方法。它比私有的具访问性，但仍然提供了受限的访问级别。\n\
    - 保护（protected）：与默认访问类似，子类（即使在不同的包中）也可以访问受保护的成员。\n\n"
