    These operators return a boolean result (true or false).

    Combining Conditions: AND, OR, NOT Logical operators are used to form more complex
    conditional expressions:


    +   - && (Logical AND): Returns true only if both operands are true.

    - || (Logical OR): Returns true if at least one of the operands is true. \- !
    (Logical NOT): Inverts the value of a boolean, turning true to false and vice
    versa.'
