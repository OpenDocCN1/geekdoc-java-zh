    # 4.2.4 String Concatenation and Splitting


    +   - Concatenation

    Strings can be concatenated using the + operator or the concat() method.


    ```

    String greeting = "Hello";

    String name = "John";

    String message = greeting + ", " + name + "!"; // Using + operator

    String anotherMessage = greeting.concat(", " ").concat(name); // Using concat()

    ```


    +   - Splitting

    The split() method is used to split a string into an array of strings based on
    a given regular expression.


    ```

    String fruits = "apple, banana, cherry";

    String[] fruitsArray = fruits.split(", " ");

    // fruits fruitsArray contains ["apple", "banana", "cherry"]

    ```'
