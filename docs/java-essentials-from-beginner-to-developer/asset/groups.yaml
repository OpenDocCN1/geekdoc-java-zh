    # 7.2.1 The Role of the ''super'' Keyword in Accessing Superclass Members


    The super keyword in Java is a reference variable that is used to refer to the
    immediate parent class object. It can be employed to access superclass methods
    and constructors that are overridden or hidden in the subclass.


    +   * Accessing Superclass Methods: super can be used to call superclass methods
    that have been overridden in the subclass. This is particularly useful when you
    want both the superclass and subclass versions of a method to be accessible from
    the subclass.


    +   * Calling Superclass Constructors: super() can call superclass constructors.
    The call to super() must be the first statement in each constructor of a subclass.
    If a subclass constructor does not explicitly call a superclass constructor, the
    Java compiler automatically inserts a call to the no-argument constructor of the
    superclass.'
