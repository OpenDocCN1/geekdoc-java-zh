    \ OOP 的支柱：封装、继承和多态\n\n# 6.4.1 封装：使用访问修饰符保护数据\n\n封装是面向对象编程中的基本概念，涉及将数据（属性）和作用于数据的代码（方法）封装成一个单元。此外，它限制了对对象某些组件的直接访问，这是防止意外修改数据的手段。对限制组件的访问通常通过\
    \ getter 和 setter 方法实现。\n\nJava 使用访问修饰符来保护变量和方法。最常用的访问修饰符有：\n\n- Private（私有）：成员仅在其类内部可访问。\n\
    - Protected（保护）：成员在自己的包内以及子类中可访问。\n- Public（公共）：成员可以从任何其他类访问。\n\n```java\npublic\
    \ class Account {\n    private double balance;\n\n    // Getter method\n    public\
    \ double getBalance() {\n        return balance;\n    }\n\n    // Setter method\n\
    \    public void deposit(double amount) {\n        if (amount > 0) {\n       \
    \     balance += amount;\n        }\n    }\n}\n```\n\n# 6.4.2 继承：扩展类和代码复用\n\n\
    继承允许一个类继承另一个类的方法和字段。在 Java 中，继承用于促进代码复用并建立类与类的关系。\n\n# 创建子类\n\n要继承一个类，你使用 `extends`\
    \ 关键字。被继承的类被称为父类（superclass），而继承的类被称为子类（subclass）。\n\n示例：\n\n```java\nclass Vehicle\
    \ {\n    protected String brand = \"Ford\";\n    public void honk() {\n      \
    \  System.out.println(\"Tuut, tuut!\");\n    }\n}\n\nclass Car extends Vehicle\
    \ {\n    private String modelName = \"Mustang\";\n    public static void main(String[]\
    \ args) {\n        Car myFastCar = new Car();\n        myFastCar.honk();\n   \
    \     System.out.println(myFastCar.brand + \" \" + myFastCar.modelName);\n   \
    \ }\n}\n```\n\n# 方法重写和 super 关键字\n\n方法重写发生在子类为其父类已提供的方法的特定实现时。`super` 关键字用于访问父类方法。\n\
    \n示例：\n\n```java\nclass Animal {\n    void sound() {\n        System.out.println(\"\
    Animal makes a sound\");\n    }\n}\n\nclass Pig extends Animal {\n    @Override\n\
    \    void sound() {\n        super.sound(); // 调用父类方法\n    }\n}\n```\n\n# 6.4.3\
    \ 多态：静态与动态\n\nJava 中的多态有两种类型：编译时（静态）和运行时（动态）。\n\n# 方法重载\n\n方法重载（静态多态）发生在同一个类中，当两个或多个方法的名称相同但参数不同时。\n\
    \n示例：\n\n```java\nclass Display {\n    void show(int x) {\n        System.out.println(\"\
    Show int: \" + x);\n    }\n\n    void show(String s) {\n        System.out.println(\"\
    Show String: \" + s);\n    }\n}\n```\n\n# 方法重写和动态方法调度\n\n方法重写（动态多态）允许子类重写父类的方法。动态方法调度是一种在运行时解析重写方法调用的机制。\n\
    \n示例：\n\n```java\nclass Figure {\n    double dim1;\n    double dim2;\n\n    Figure(double\
    \ a, double b) {\n        dim1 = a;\n        dim2 = b;\n    }\n\n    double area()\
    \ {\n        System.out.println(\"Area for Figure is undefined.\");\n        return\
    \ 0;\n    }\n}\n\nclass Rectangle extends Figure {\n    Rectangle(double a, double\
    \ b) {\n        super(a, b);\n    }\n\n    // override area method\n    double\
    \ area() {\n        System.out.println(\"Inside Area for Rectangle.\");\n    \
    \    return dim1 * dim2;\n    }\n}\n```\n\n# ### 6.4.4 抽象类和接口：强制合约\n\n* 抽象类：抽象类不能实例化，并且可以包含抽象方法，即没有体的方法。当你想在多个相关类之间共享代码时，可以使用它们。\n\
    \n```java\nabstract class Animal {\n    public abstract void sound();\n}\n\nclass\
    \ Dog extends Animal {\n    public void sound() {\n        System.out.println(\"\
    Woof\");\n    }\n}\n```\n\n* 接口：接口是一个完全“抽象类”，用于将带有空方法的分组在一起。类可以实现多个接口，从而克服了单继承的限制。\n\
    \n```java\ninterface Animal {\n    void sound(); // 接口方法（没有体）\n}\n\nclass Pig\
    \ implements Animal {\n    public void sound() { // 在这里提供了 sound() 的体\n      \
    \  System.out.println(\"The pig says: wee wee\");\n    }\n}\n```\n\n"
