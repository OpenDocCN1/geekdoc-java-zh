    \ Inheritance, and Polymorphism\n\n# 6.4.1 Encapsulation: Protecting Data with\
    \ Access Modifiers\n\nEncapsulation is a fundamental concept in object-oriented\
    \ programming that involves bundling the data (attributes) and code acting on\
