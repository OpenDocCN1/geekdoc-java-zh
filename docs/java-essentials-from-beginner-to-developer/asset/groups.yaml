    # ##10.4.1 Difference Between Byte Streams and Character Streams


    Java I/O streams are categorized into two main types: byte streams and character
    streams. Byte streams (InputStream and OutputStream subclasses) are primarily
    used for handling raw binary data, such as image files, audio files, and serialized
