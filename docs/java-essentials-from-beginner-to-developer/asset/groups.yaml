    \nInheritance allows one class to inherit the methods and fields of another class.\
    \ In Java, inheritance is used to promote code reuse and establish a relationship\
    \ between classes.\n\n# Creating Subclasses\n\nTo inherit from a class, you use\
    \ the extends keyword. The class being inherited from is called the superclass,\
    \ and the class that inherits is called the subclass.\n\nExample:\n\n```java\n\
    class Vehicle {\n    protected String brand = \"Ford\";\n    public void honk()\
    \ {\n        System.out.println(\"Tuut, tuut!\");\n    }\n}\n\nclass Car extends\
