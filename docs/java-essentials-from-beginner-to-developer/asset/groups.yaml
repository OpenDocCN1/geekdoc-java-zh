    # 11.3.4 The SynchronousQueue and Phaser


    SynchronousQueue: A BlockingQueue in which each insert operation must wait for
    a corresponding remove operation by another thread, and vice versa. A synchronous
    queue does not have any internal capacity, not even a capacity of one. It''s useful
    in scenarios where you want to hand off data from one thread to another.


    ```

    BlockingQueue<String> syncQueue = new SynchronousQueue<>();

    Thread producer = new Thread(() -> syncQueue.put("hello"));

    Thread consumer = new Thread(() -> String received = syncQueue.take());

    producer.start();

    consumer.start();

    ```


    Phaser: A reusable synchronization barrier, similar in functionality to CyclicBarrier
    and CountDownLatch but with more flexibility. A Phaser can handle a dynamic number
    of parties (threads) registered to it and supports advancing from one phase to
    another. Each phase number represents a r'
