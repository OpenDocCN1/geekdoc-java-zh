    \    public void add(int a, int b, int c) {\n        System.out.println(\"Sum:\
    \ \" + (a + b + c));\n    }\n}\n```\n\n### 5.3.3 不同参数数量的方法重载\n\n方法重载是 Java 的一项特性，允许多个方法具有相同名称。这一特性允许方法在参数数量上有所不同。\n\
    \n```java\npublic class Printer {\n    public void print(int a) {\n        System.out.println(\"\
    Integer: \" + a);\n    }\n\n    public void print(int a, int b) {\n        System.out.println(\"\
