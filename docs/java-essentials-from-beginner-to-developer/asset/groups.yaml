    \n```java\npublic synchronized void increment() {\n    count++;\n}\n```\n\n- 同步块：同步块比同步方法更灵活，因为允许在不同的对象上锁定并覆盖方法的部分。\n\
    \n```java\nsynchronized(this) {\n    count++;\n}\n```\n\n### 11.2.2 volatile 关键字与内存可见性\n\
    \nJava 中的 `volatile` 关键字确保变量的变化可以传播到其他线程。当字段声明为 `volatile` 时，编译器和运行时会注意到该变量是共享的，不应对其进行的更改进行缓存或重排序。\n\
