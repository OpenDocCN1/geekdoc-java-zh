    # 4.3 Advanced Array Concepts


    # 4.3.1 Dynamic Arrays and Their Usage


    In Java, arrays are fixed in size. However, sometimes we need data structures
    that can grow or shrink as needed. Java collections framework offers ArrayList,
    a class that implements a dynamic array, which automatically adjusts its capacity.


    ```

    import java.util.ArrayList;


    ArrayList<Integer> dynamicArray = new ArrayList<>();

    dynamicArray.add(10); // Add elements

    dynamicArray.add(20);

    System.out.println(dynamicArray.get(0)); // Access elements

    ```


    Dynamic arrays are particularly useful when the number of elements is not known
    in advance. They offer methods to add, remove, and search for elements efficiently.'
