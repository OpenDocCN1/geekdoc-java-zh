    # ## 7.1.3 Utilizing Protected Access Modifiers


    The protected access modifier plays a crucial role in inheritance. Members declared
    as protected in a superclass can be accessed by the subclass (including subclasses
    outside the package), but are not accessible by other classes outside the package.


    This modifier helps in encapsating the superclass''s members, allowing controlled
    access to them, as opposed to public access (which could expose too much of the
    superclass''s internal details), or private access (which would prevent the subclass
    from accessing important members).


    # ## 7.1.4 Exploring Inheritance Hierarchies and Multiple Inheritance Issues


    Inheritance hierarchies occur when a class inherits from a subclass, creating
    a "family tree" of classes with multiple levels. This allows for more specific
    categorizations and behaviors at each subclass level.


    Java does not support multiple inheritance through classes to avoid the diamond
    problem, where a class inherits from two classes that have a method with the same
    signature. This could confuse the compiler as to which method to invoke. However,
    Java tackles the need for multiple inheritances by allowing a class to implement
    multiple interfaces.


    Example of inheritance hierarchy:'
