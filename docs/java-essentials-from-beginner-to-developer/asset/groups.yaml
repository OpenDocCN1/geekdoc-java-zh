- md: "\n# 7.1.1 Understanding the Basics of Inheritance\n\nInheritance enables a\
    \ new class, known as the subclass or derived class, to absorb the members (fields,\
    \ methods, and constructors) of another class, referred to as the superclass or\
    \ base class. The primary advantage is the ability to define a common base class\
    \ that can share code across multiple derived classes.\n\nKey concepts include:\n\
    \n- * Superclass and Subclass: The superclass is the class from which others inherit,\
    \ whereas the subclass is the class that inherits from the superclass.\n- * extends\
    \ Keyword: In Java, the extends keyword is used by a class to declare that it\
    \ inherits from another class.\n\n# 7.1.2 Creating and Extending Superclasses\n\
    \nCreating a superclass involves defining a regular class that other classes will\
    \ inherit from. Extending this class is done using the extends keyword. For example,\
    \ if Animal is a superclass, creating a subclass Dog that inherits from Animal\
    \ can be done as follows: By extending Animal, Dog inherits the eat method and\
    \ can also define its own methods, such as bark.\n\n## 7.1.3 Utilizing Protected\
    \ Access Modifiers\n\nThe protected access modifier plays a crucial role in inheritance.\
    \ Members declared as protected in a superclass can be accessed by the subclass\
    \ (including subclasses outside the package), but are not accessible by other\
    \ classes outside the package.\n\nThis modifier helps in encapsulating the superclass's\
    \ members, allowing controlled access to them, as opposed to public access (which\
    \ could expose too much of the superclass's internal details), or private access\
    \ (which would prevent the subclass from accessing important members).\n\n## 7.1.4\
    \ Exploring Inheritance Hierarchies and Multiple Inheritance Issues\n\nInheritance\
    \ hierarchies occur when a class inherits from a subclass, creating a \"family\
    \ tree\" of classes with multiple levels. This allows for more specific categorizations\
    \ and behaviors at each subclass level.\n\nJava does not support multiple inheritance\
    \ through classes to avoid the diamond problem, where a class inherits from two\
    \ classes that have a method with the same signature. This could confuse the compiler\
    \ as to which method to invoke. However, Java tackles the need for multiple inheritances\
    \ by allowing a class to implement multiple interfaces.\n\nExample of inheritance\
    \ hierarchy:\n\n```java\nclass Animal {\n    void eat() {\n        System.out.println(\"\
    This animal eats.\");\n    }\n}\n\nclass Mammal extends Animal {\n    void breathe()\
    \ {\n        System.out.println(\"This mammal breathes.\");\n    }\n}\n\nclass\
    \ Bat extends Mammal {\n    void fly() {\n        System.out.println(\"This bat\
    \ can fly.\");\n    }\n}\n```\n\nHere, Bat inherits from Mammal, which in turn\
    \ inherits from Animal, forming a hierarchy. By understanding and implementing\
    \ inheritance appropriately, developers can create flexible and maintainable codebases.\n\
    \n# 7.2 Using 'super' and Method Overriding\n\nThe concepts of super keyword utilization\
    \ and method overriding play significant roles in the implementation of inheritance\
    \ in Java, enhancing both functionality and polymorphism.\n\n# 7.2.1 The Role\
    \ of the 'super' Keyword in Accessing Superclass Members\n\nThe super keyword\
    \ in Java is a reference variable that is used to refer to the immediate parent\
    \ class object. It can be employed to access superclass methods and constructors\
    \ that are overridden or hidden in the subclass.\n\n- * Accessing Superclass Methods:\
    \ super can be used to call superclass methods that have been overridden in the\
    \ subclass. This is particularly useful when you want both the superclass and\
    \ subclass versions of a method to be accessible from the subclass.\n- * Calling\
    \ Superclass Constructors: super() can call superclass constructors. The call\
    \ to super() must be the first statement in each constructor of a subclass. If\
    \ a subclass constructor does not explicitly call a superclass constructor, the\
    \ Java compiler automatically inserts a call to the no-argument constructor of\
    \ the superclass.\n\n```java\nclass Animal {\n    void move() {\n        System.out.println(\"\
    Animals can move\");\n    }\n}\n\nclass Dog extends Animal {\n    void move()\
    \ {\n        super.move(); // Calls the method in Animal class\n        System.out.println(\"\
    Dogs can walk and run\");\n    }\n}\n```\n\n# 7.2.2 Overriding Methods in the\
    \ Subclass\n\nMethod overriding occurs when a subclass redefines a method in its\
    \ superclass. Overriding allows a subclass to provide a specific implementation\
    \ of a method already provided its superclass.\n\nOverriding Rules: The argument\
    \ list must exactly match that of the overridden method. The return type must\
    \ also be the same or a subtype (covariant return type). Furthermore, a subclass\
    \ cannot override methods that are declared final or static.\n\nExample of overriding:\n\
    \n```java\nclass Vehicle {\n    void run() {\n        System.out.println(\"The\
    \ vehicle is running\");\n    }\n}\nclass Car extends Vehicle {\n    @Override\n\
    \    void run() {\n        System.out.println(\"The car is running safely\");\n\
    \    }\n}\n```\n\n# 7.2.3 Rules and Best Practices for Method Overriding\n\n-\
    \ 1. Signature Match: The method name and parameters must exactly match the method’s\
    \ signature in the superclass.\n- 2. Access Level: The access level cannot be\
    \ more restrictive than the overridden method's access level.\n- 3. Return Type:\
    \ Must be the same or a subtype of the return type in the superclass method (covariant\
    \ return type).\n- 4. Invocation of Superclass Method: Sometimes, it's beneficial\
    \ to call the superclass's version in the overridden method using `super`.\n\n\
    Following these rules ensures clean, functional inheritance hierarchies with predictable\
    \ behaviors.\n\n# 7.2.4 The Significance of Annotation @Override\n\nThe `@Override`\
    \ annotation indicates that a method is intended to override a method in its superclass.\
    \ If the method does not actually override a superclass, the compiler produces\
    \ an error. This annotation improves code clarity and helps avoid errors, such\
    \ as misspelling a method name or not matching the parameters.\n\n```java\nclass\
    \ Animal {\n    void eat() {\n        System.out.println(\"This animal eats.\"\
    );\n    }\n}\nclass Dog extends Animal {\n    @Override\n    void eat() {\n  \
    \      System.out.println(\"A dog eats.\");\n    }\n}\n```\n\n# 7.3 Interfaces\
    \ and Abstract Classes\n\nInterfaces and abstract classes are two pivotal concepts\
    \ used to achieve abstraction and multiple inheritance (through interfaces). They\
    \ set a blueprint for classes, guiding them on what methods they must implement.\n\
    \n## 7.3.1 Defining and Implementing Interfaces\n\nAn interface in Java is a reference\
    \ type, similar to a class, that can contain constants, method signatures, default\
    \ methods, static methods, and nested types. Interfaces cannot contain instance\
    \ fields. The methods in interfaces are abstract by default. To define an interface,\
    \ you use the interface keyword. Classes implement interfaces and must provide\
    \ concrete implementations for all abstract methods.\n\n```java\ninterface Animal\
    \ {\n    void eat();\n    void travel();\n}\n\nclass Mammal implements Animal\
    \ {\n    public void eat() {\n        System.out.println(\"Mammal eats\");\n \
    \   }\n\n    public void travel() {\n        System.out.println(\"Mammal travels\"\
    );\n    }\n}\n```\n\n## 7.3.2 Comparing Interfaces With Abstract Classes\n\nBoth\
    \ interfaces and abstract classes can have abstract methods, but there are key\
    \ differences:\n\n- Abstract Classes: Can have a mix of methods with or without\
    \ implementations. Only one abstract class can be extended by a subclass.\n- Interfaces:\
    \ Before Java 8, interfaces could only have abstract methods without implementations.\
    \ From Java 8 onwards, they can have default and static methods. A class can implement\
    \ multiple interfaces.\n\nAbstract classes are used when subclasses share methods\
    \ with implementations. Interfaces are typically used to define a common set of\
    \ functionalities that can be provided by any class, regardless of its place in\
    \ the class hierarchy.\n\n## 7.3.3 Using Default and Static Methods in Interfaces\n\
    \nJava 8 introduced the ability to define concrete methods in interfaces using\
    \ default and static methods. This allows for new functionalities to be added\
    \ to interfaces without affecting the classes that implement these interfaces.\n"
  mdcn: "\n\n# 7.1.1 理解继承的基础知识\n\n继承允许一个新类（称为子类或派生类）吸收另一个类（称为父类或基类）的成员（字段、方法和构造函数）。其主要优势是可以定义一个公共基类，以便在多个派生类之间共享代码。\n\
    \n核心概念包括：\n\n- * 父类与子类：父类是被其他类继承的类，而子类是继承自父类的类。\n- * extends 关键字：在 Java 中，类使用\
    \ `extends` 关键字来声明它继承自另一个类。\n\n# 7.1.2 创建和扩展父类\n\n创建父类涉及定义一个普通类，其他类将继承自该类。使用 `extends`\
    \ 关键字来扩展此类。例如，如果 Animal 是一个父类，可以如下方式创建一个继承自 Animal 的子类 Dog：通过扩展 Animal，Dog 继承了\
    \ `eat` 方法，并且还可以定义自己的方法，如 `bark`。\n\n## 7.1.3 利用 protected（受保护）访问修饰符\n\n`protected`\
    \ 访问修饰符在继承中起着至关重要的作用。在父类中声明为 `protected` 的成员可以被子类访问（包括包外的子类），但不能被包外的其他类访问。\n\n\
    该修饰符有助于封装父类的成员，允许对它们进行受控访问，而不是 `public`（公共）访问（这可能会暴露过多的类内部细节）或 `private`（私有）访问（这将阻止子类访问重要成员）。\n\
    \n## 7.1.4 探索继承层次结构和多重继承问题\n\n当一个类继承自一个子类时，就会形成层次结构，创建一个具有多个级别的类“族树”。这允许在每个子类层级实现更具体的分类和行为。\n\
    \nJava 不支持通过类进行多重继承，以避免“菱问题”（即一个类继承自两个具有相同签名方法的类）。这可能会让编译器在调用哪个方法时感到困惑。然而，Java\
    \ 通过允许一个类实现多个接口来解决多重继承的需求。\n\n继承层次结构的示例：\n\n```java\nclass Animal {\n    void\
    \ eat() {\n        System.out.println(\"This animal eats.\");\n    }\n}\n\nclass\
    \ Mammal extends Animal {\n    void breathe() {\n        System.out.println(\"\
    This mammal breathes.\");\n    }\n}\n\nclass Bat extends Mammal {\n    void fly()\
    \ {\n        System.out.println(\"This bat can fly.\");\n    }\n}\n```\n\n在这里，Bat\
    \ 继承自 Mammal，而 Mammal 继承自 Animal，形成了一个层次结构。通过正确理解和实现继承，开发者可以创建灵活且易于维护的代码库。\n\n\
    # 7.2 使用 'super' 和方法重写\n\n`super` 关键字的使用和方法重写的概念在 Java 继承实现中起着重要作用，增强了功能性和多态性。\n\
    \n# 7.2.1 'super' 关键字在访问父类成员中的作用\n\nJava 中的 `super` 关键字是一个引用变量，用于引用直接父类对象。它可以用于访问在子类中被重写或隐藏的父类方法和构造函数。\n\
    \n- * 访问父类方法：`super` 可以调用在子类中被重写的父类方法。当你希望在子类中同时访问方法的父类和子类版本时，这特别有用。\n- * 调用父类构造函数：`super()`\
    \ 可以调用父类构造函数。`super()` 的调用必须是子类每个构造函数的第一条语句。如果子类构造函数没有显式调用父类构造函数，Java 编译器会自动插入对父类无参数构造函数的调用。\n\
    \n```java\nclass Animal {\n    void move() {\n        System.out.println(\"Animals\
    \ can move\");\n    }\n}\n\nclass Dog extends Animal {\n    void move() {\n  \
    \      super.move(); // 调用 Animal 类中的方法\n        System.out.println(\"Dogs can\
    \ walk and run\");\n    }\n}\n```\n\n# 7.2.2 在子类中重写方法\n\n当子类重新定义其父类中的方法时，就会发生方法重写。重写允许子类为其父类提供的方法提供特定的实现。\n\
    \n重写规则：参数列表必须与被重写的方法完全匹配。返回类型也必须相同或子类型（协变返回类型）。此外，子类不能重写声明为 `final` 或 `static`\
    \ 的方法。\n\n重写的示例：\n\n```java\nclass Vehicle {\n    void run() {\n        System.out.println(\"\
    The vehicle is running\");\n    }\n}\nclass Car extends Vehicle {\n    @Override\n\
    \    void run() {\n        System.out.println(\"The car is running safely\");\n\
    \    }\n}\n```\n\n# 7.2.3 方法重写的规则和最佳实践\n\n- 1. 签名匹配：方法名和参数必须与父类中的方法签名完全匹配。\n-\
    \ 2. 访问级别：访问级别不能比被重写方法的访问级别更严格。\n- 3. 返回类型：必须是父类方法返回类型的相同类型或子类型（协变返回类型）。\n- 4.\
    \ 调用父类方法：有时，在重写方法中使用 `super` 调用父类版本是有益的。\n\n遵循这些规则可以确保拥有结构整洁、功能完备且行为可预测的继承层次结构。\n\
    \n# 7.2.4 注解 @Override 的意义\n\n`@Override` 注解表示该方法旨在重写其父类中的方法。如果该方法实际上没有重写父类，编译器将产生错误。此注解提高了代码的可读性，并有助于避免错误，例如拼错方法名。\n\
    \n```java\nclass Animal {\n    void eat() {\n        System.out.println(\"This\
    \ animal eats.\");\n    }\n}\nclass Dog extends Animal {\n    @Override\n    void\
    \ eat() {\n        System.out.println(\"A dog eats.\");\n    }\n}\n```\n\n# 7.3\
    \ 接口和抽象类\n\n接口和抽象类是实现抽象和多重继承（通过接口）两个关键概念。它们为类设定蓝图，引导它们需要实现的方法。\n\n## 7.3.1 定义和实现接口\n\
    \nJava 中的接口是一种引用类型，类似于类，可以包含常量、方法签名、默认方法、静态方法和嵌套类型。接口不包含实例字段。接口中的方法默认是抽象的。定义接口使用\
    \ `interface` 关键字。类实现接口并为所有抽象方法提供具体实现。\n\n```java\ninterface Animal {\n    void\
    \ eat();\n    void travel();\n}\n\nclass Mammal implements Animal {\n    public\
    \ void eat() {\n        System.out.println(\"Mammal eats\");\n    }\n\n    public\
    \ void travel() {\n        System.out.println(\"Mammal travels\");\n    }\n}\n\
    ```\n\n## 7.3.2 比较接口与抽象类\n\n接口和抽象类都可以拥有抽象方法，但存在关键区别：\n\n- 抽象类：可以包含带有实现或不带实现的方法。子类只能继承一个抽象类。\n\
    - 接口：在 Java 8 之前，接口只能包含不带实现的抽象方法。从 Java 8 开始，它们可以拥有默认和静态方法。一个类可以实现多个接口。\n\n当子类共享带有实现的方法使用抽象类。接口通常用于定义一组由任何类提供的公共功能，无论其在类层次结构中的位置如何。\n\
    \n## 7.3.3 在接口中使用默认和静态方法\n\nJava 8 引入了通过默认和静态方法在接口中定义具体方法的能力。这允许在接口中添加新功能，而不影响实现这些接口的类。\n\
    \n"
