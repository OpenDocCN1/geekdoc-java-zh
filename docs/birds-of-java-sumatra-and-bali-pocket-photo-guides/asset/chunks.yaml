    mainly to the mountain lakes of East Java and Bali, but often found feeding on
    marshy areas and grassland. A favourite haunt for it in Bali is the sewage farm
    at Nusa Dua.


    **BLUE-BREASTED QUAIL** *Coturnix chinensis* 14cm


    ![](img/34_2.jpg)


    ![](img/34_1.jpg)


    Although the male of this species is distinctive, females are easily confused
    with the Small and Barred Buttonquails that may be found in the region. The Blue-breasted
    Quail’s yellow feet are the main recognition feature. The upperparts are dark
    brown with lighter streaks, the female being a little lighter than the male. Males
    have a distinct black and white bib pattern, with the breast, sides of the head
    and flanks a rich grey-blue; the belly and undertail-coverts are bright chestnut.
    The female’s underparts are brown, streaked buff, with darker brown barring across
    the chest; she has a whitish throat patch and buffish eye-stripe. The newly hatched
    young are tiny, almost like bumble-bees.


    **CHESTNUT-BELLIED PARTRIDGE** *Arborophila javanica* 25cm


    ![](img/34_2.jpg)


    ![](img/34_3.jpg)


    Endemic to Java, this partridge occurs in three subspecies. Confined to the west
    and central parts of the island, each has a different head pattern of reddish-buff
    with black markings and a black collar. The breast is grey, varying through chestnut
    to a white vent. The flanks are chestnut, the back and tail grey-brown and barred
    black, and the wings brown with black barring and small white spots. The feet
    are red and the bill blackish. This is a bird of montane forest and is often seen
    in more open spaces, usually in pairs but occasionally in small groups, foraging
    among the undergrowth.


    **CRESTED PARTRIDGE** *Rollulus rouloul* 25cm


    ![](img/34_2.jpg)


    ![](img/35_2.jpg)


    The very distinctive male sports an ostentatious tufted, spiky red crest above
    a white crown patch. His overall plumage is blackish-blue with a purple sheen,
    appearing green towards the tail; the wings appear dark red-brown. Females lack
    the crest, and have green body plumage and a grey head; the wings are more chestnut.
    They both have red legs and bare red skin around the eye. The bill is black, but
    males show some red at the base. Congregates in close family groups, foraging
    through the littered forest floor for insects and fallen fruit. Found in the lowland
    and hill forests of Sumatra, but not in Java or Bali, the species also occurs
    in Borneo and the Malay Peninsula.


    **CRESTED FIREBACK** *Lophura ignita* 55cm


    ![](img/34_2.jpg)


    ![](img/35_3.jpg)


    *Male (left); female (right)*


    It is extremely unfortunate that this beautiful pheasant, once common in the forests
    of Sumatra, Borneo and the Malay Peninsula, now occurs only sporadically. Destruction
    of the habitat and hunting have reduced its numbers to isolated populations in
    the more remote and secluded forests. Sumatran birds have a very dark blue, almost
    black, body with a tufty black crest and a red patch on the rump and lower back;
    the belly and flanks are faintly streaked with white. The extended and arched
    central tail feathers are white. Females are brown, with white-striped underparts.
    These are ground-living birds which forage like chickens for fallen fruit, seeds
    and insects.


    **RED JUNGLEFOWL** *Gallus gallus* male 75cm, female 46cm'
