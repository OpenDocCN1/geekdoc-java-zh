    This woodpecker has green upperparts and nape, a yellow rump and a black tail.
    The underparts are buffish-yellow with the feathers edged in green, giving the
    laced appearance. Males have a red crown, this being black on females. The cheeks
    are blue-grey, bordered by a black eye-stripe and malar stripe, both of which
    are mottled with white. The black primaries are barred with white. The bill is
    black and the feet grey-green. Prefers coastal woodland and forest, and often
    found in mangroves, bamboo thickets and coconut plantations. It is locally common
    throughout the region, but is rare in Sumatra.


    # COMMON FLAMEBACK *Dinopium javanense* 30cm


    ![](img/71_1.jpg)


    ![](img/74_3.jpg)


    *Male (left), Female (right)*


    Chew Yen Fook


    Usually in pairs and noticed by their continual ‘churring’ contact calls, the
    male has a red crown extending into a crest at the rear, while the female’s crown
    is a more flattened mass of black and white feathers. Otherwise both sexes are
    similar, having a golden-yellow mantle and wing-coverts, red lower back and rump,
    black tail and primaries, and a white face with a black eye-stripe and single
    solid malar stripe. The white underpart feathers are edged black, forming a scaly
    pattern. It is unusual in having only three toes. A quite common lowland woodpecker
    of secondary and open forests and mangroves, but regularly appearing around cultivation,
    plantations and even in gardens.


    # WHITE-BELLIED WOODPECKER *Dryocopus javensis* 42cm


    ![](img/71_1.jpg)


    ![](img/75_1.jpg)


    Rather solitary, this woodpecker usually makes its presence known by its loud
    ‘laughing’ and ‘barking’ calls, as well as its heavy hammering on dead branches.
    It often calls in flight with a raucous, echoing *kiow, kiow, kiow*. It has a
    very conspicuous appearance, being very large, with all-black plumage apart from
    a white belly. Males have a red crest and cheek patches. The long pointed bill
    is black and the feet grey. This bird of open lowland forest is found throughout
    the Greater Sundas as far east as Bali, but is relatively rare in both Java and
    Bali.


    # FULVOUS-BREASTED WOODPECKER *Dendrocopos macei* 18cm


    ![](img/71_1.jpg)


    ![](img/75_3.jpg)


    Tilford/Cooke, TC Nature


    This smallish woodpecker is quite adaptable and fairly tame, making it relatively
    easy to observe. It spends a lot of time in the higher branches of tall trees,
    but can often be seen foraging lower down on tree trunks. Its back and tail are
    heavily barred black and white, and the underparts are buff and lightly streaked
    black. The male has a red crown and the female black. The side of the face and
    the chin are white, separated by a black malar stripe. It is a bird of open forest,
    which has a liking for plantations, parks and gardens. Although it is quite common
    in Bali and Java, there are few records from Sumatra.


    # SUNDA PYGMY WOODPECKER *Dendrocopos moluccensis* 13cm


    ![](img/71_1.jpg)


    ![](img/76_1.jpg)


    Also known as the Brown-capped Woodpecker, this little bird is usually seen on
    its own as it works through the dead branches and bark of trees, often close to
    the ground, searching out insects and larvae. Its short legs have grey feet with
    two toes pointing forward and two backward. Its upperparts are dark brown with
    white barring, giving a partially spotted appearance. The underparts are whitish
    with black streaking. It has a rich brown crown, black malar stripe, white face
    patch with a greyish-brown centre, and thin red stripe behind the eye. It prefers
    mangroves, open woodland and coastal secondary forest.


    # BLACK-AND-RED BROADBILL *Cymbirhynchus macrorhynchos* 23cm


    ![](img/71_1.jpg)


    ![](img/76_3.jpg)


    This insectivorous species is identified by its black upperparts and black band
    across the upper breast, its white wing-stripe, dark red underparts and throat-stripe,
    and its large yellow and blue bill. Juveniles have a pinkish-buff belly and grey-tinged
    throat. It is attracted to scrubby and wooded areas and gardens in the vicinity
    of water, and can frequently be found alongside rivers and streams, where it hawks
    insects from exposed perches. Ranges from South-east Asia through the Malay Peninsula
    and Borneo to Sumatra, but not found in Java or Bali. In Sumatra it is common
    at lowland forest edges.


    # BANDED PITTA *Pitta guajana* 22cm


    ![](img/77_2.jpg)


    ![](img/77_1.jpg)


    A beautiful ground-living bird with a distinct plumage. Three races are present
    in the region, all having a black head with a long, broad yellow eyebrow and a
    white chin. The tail is blue and the back and wing-coverts brown. The wings are
    dark brown and have a thin white wingbar. The Sumatran race (*P. g. irena* has
    breast and flanks barred blue and orange, a blue belly and orange nape, and more
    distinct wingbar. In West Java, *P. g. affinis* has breast and flanks barred black
    and yellow. *P. g. guajana* in East Java and Bali is also barred black and yellow,
    but has a blue bar on the upper breast. Inhabits mainly lowland forest and shaded
    dense thickets.


    # HOODED PITTA *Pitta sordida* 18cm


    ![](img/77_2.jpg)


    ![](img/77_3.jpg)


    A forest-floor dweller, this hops around the leaf litter. It is a plump medium-sized
    pitta with long legs. Residents have a green plumage. Not found in Bali,.


    # AUSTRALIAN BUSHLARK *Mirafra javanica* 14cm


    ![](img/78_2.jpg)


    ![](img/78_1.jpg)


    Tilford/Cooke, TC Nature


    This small bird occasionally perches in trees, but is often seen walking around
    the ground. It is a black-mottled russet-brown, with paler underparts and white
    tail feathers. Its short pinkish-grey legs have long claws. The brown bill is
    tinged yellow below.


    Chew Yen Fook


    Similar in appearance to the Barn Swallow, but lacking the long tail-streamers
    and the blue bar across the upper chest. The breast appears a dirty buffish-white.
    It otherwise has a dark blue plumage with a chestnut-red forehead. It has brown
    feet and a black bill. This swallow usually forms small parties with other hirundines
    and swiftlets to feed over water. It neither roosts nor nests communally, preferring
    an isolated mud nest fixed under an overhanging ledge, bridge or roof. It is resident
    throughout the region.


    # BARN SWALLOW *Hirundo rustica* 20cm


    ![](img/78_2.jpg)


    ![](img/78_3.jpg)


    Tilford/Cooke, TC Nature


    The Barn Swallow is more likely to be seen wheeling in circles and gliding with
    an occasional flutter high in the sky, hunting aerial insects. Depending on the
    weather conditions, it may come very low and be skimming the surface of lakes
    and streams. It also often perches on overhead wires and bare branches. This gregarious
    bird sometimes gathers in huge flocks to roost in reedbeds, tall grasses and even
    on city buildings. It is dark blue above, with a white breast and long outer tail
    feathers. The forehead is red, and the throat red with a blue bar below. Juveniles
    are duller and lack the tail-streamers. A common winter visitor throughout the
    region, from breeding grounds in northern latitudes


    # HOUSE SWALLOW *Hirundo tahitica* 14cm


    ![](img/78_2.jpg)


    ![](img/79_1.jpg)


    # EASTERN YELLOW WAGTAIL *Motacilla tschutscis* 18cm


    ![](img/78_2.jpg)


    ![](img/79_3.jpg)


    Tilford/Cooke, TC Nature

