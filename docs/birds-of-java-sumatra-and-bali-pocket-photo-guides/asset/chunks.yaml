    这种微型水鸟看起来像是一只在水面上高高游泳的小型深色鸭子，频繁潜水并能在水下停留长时间。在繁殖季节，它的背部呈棕色，头部和颈部颜色更深，而喉部和颈部侧面为栗色。黑喙基部有一处明显的黄色斑块。在非繁殖羽期，它的颜色偏灰色，颈部变白。它是`爪哇`、`巴厘`和北部`苏门答腊`的稀有留鸟，经常出没于湖泊和淹没的稻田，尽管其分布范围从新几内亚延伸到欧洲。


    # 白尾玄鸥 *Phaethon lepturus* 39cm


    ![](img/14_1.jpg)

    ![](img/15_1.jpg)


    Tilford/Cooke, TC Nature


    成鸟通常呈白色，有些带有黄色调，并有长长的白色尾羽。它们的翅膀尖端有黑色斑块，上翅有一条黑色横纹。幼鸟没有尾羽，背部有黑色横纹。虽然它们在该地区的某些地方是留鸟，但也有来自其他地区的访客。出现在`苏门答腊`周围、以金色羽毛为特征的个体属于亚种（*P.
    l. fulvus*），产自印度洋的`圣诞岛`。繁殖群落已在`努沙佩尼达`、`巴厘`以及`爪哇`南岸沿发现。


    # 小黑鸬 *Phalacrocorax sulcirostris* 60cm


    ![](img/14_1.jpg)

    ![](img/15_2.jpg)


    David Tipling, Windrush Photos


    这种鸟羽毛呈相当均匀的黑色，带有紫绿色的光泽，但在翅覆羽上有斑点。在繁殖季节，它眼后会会长一小块白色羽毛。它有一个小小的灰色喉囊，眼睛周围是裸露皮肤。喙为灰蓝色，脚为黑色。它主要是湖泊、河口和鱼塘的鸟类，偶尔在沿海可见。该物种的分布范围从`澳大利亚`一直穿过`新几内亚`向西到达`大巽群岛`，但很少有鸟到达`苏门答腊`。它并不是常见的鸟，尽管在`爪哇`西北岸的`兰布特岛`出现的数量可能会让人误以为它是常见的。


    # 小鸬 *Phalacrocorax niger* 56cm


    ![](img/14_1.jpg)

    ![](img/16_2.jpg)


    Chew Yen Fook


    这是在该地区发现的最小的鸬类。羽毛通常为绿黑色，颈部和头部有几根细小的白色羽毛。喙为棕色，尖端为黑色，基部附近为紫色。繁殖后，羽毛颜色变深并失去白斑，但下巴和喉部会变成白色。它经常出没于红树林、湿地、湖泊和河口，通常成小群在水面低处游泳并潜水捕鱼。它是`爪哇`沿海和低地水道处相当常见的留鸟。在`苏门答腊`看到的可能是来自`爪哇`的访客。


    # 东方蛇鴻 *Anhinga melanogaster* 84cm


    ![](img/14_1.jpg)

    ![](img/16_3.jpg)


    Chew Yen Fook


    除了长而细的颈部、小头部和黄褐色的匕状喙外，与鸬类非常相似。它主要是黑色的鸟，翅膀和背部的覆羽有白色条纹。它在水面上的游姿非常低，只露出头部和颈部，因此身体经常浸水，起飞非常困难。它们花大量时间独自停在低矮且外露的栖木上，经常张开双翅晾干，但它们会群聚休息。蛇鴻喜欢栖息在大型、洁净的淡水湖泊和森林河流中。


    # 澳洲鴻 *Pelecanus conspatus* 150cm


    ![](img/14_1.jpg)

    ![](img/17_1.jpg)


    这种鸟体型与白鴻 *Pelecanus onrotalus* 非常相似，通过其金色的羽毛和粉色的喉囊可以识别。初级和次级羽为黑色；脚为灰蓝色；喙是黄色的。这种澳洲鴻偶尔单只出现，但通常成群结队，在水中俯冲捕鱼。它们从`澳大利亚`延伸到`新几内亚`，向西到达`巴厘`和`爪哇`。它们在`澳大利亚`繁殖，但也有访者来自`新几内亚`。


    # 灰鹭� *Ardea cinerea* 100cm


    ![](img/14_1.jpg)

    ![](img/17_3.jpg)


    这种以灰色为主的鸟，腹部较浅，在头部有明显的黑色条纹。它比紫鹭� *Ardea purpurea* 小，颈部有黑色条纹。它的脚和喙是黄色。这种鸟通常是独居的，但它们会群聚筑巢。它们出现在典型的鹭�栖息地，如稻田、沼泽和红树林。它们分布广泛，在旧世界温带地区以及热带地区都是留鸟。


    # 大嘴鹭� *Ardea sumatrana* 115cm


    ![](img/18_2.jpg)

    ![](img/18_1.jpg)


    在该地区发现最大的鹭�，拥有深灰色的羽毛和细冠。它的脚是灰色，喙是灰黑色的。它偏好红树林和泥滩，以及河口边缘，在水中寻找鱼类。虽然不常见，该物种在大巽群岛是留鸟。


    # 紫� *Ardea purpurea* 95cm


    ![](img/18_2.jpg)

    ![](img/18_3.jpg)


    Chew Yen Fook


    高度与灰鹭�相似，这种更优雅、更纤细的鸟姿态不那么佝。通过其深色的腹部以及带有黑色条纹的栗色颈部和胸部与其他体型的鹭�区分。它有棕色的喙和红色的脚。通常是更独居的物种，它们会在大型群落中聚集。它们出现在稻田、沼泽和红树林。


    # 白鹭� *Ardea alba* 90cm


    ![](img/18_2.jpg)

    ![](img/19_1.jpg)


    白鹭�中最大的一种，喙更粗壮，颈部有奇特的折痕。在繁殖期间，喙是黑色的，面部皮肤变成灰蓝色，大腿变为红色。在一年其他季节，面部皮肤呈淡黄色，喙为黄色，尖端通常为黑色，脚和腿全部为黑色。它们偏好泥滩、红树林和沿海沼泽，以及稻田，在那里通常单只或成小群出现，通常捕食小鱼和青蛙。尽管该物种遍布大巽群岛，但在哪里都不常见。


    # 中大鹭� *Egretta intermedia* 68cm


    ![](img/18_2.jpg)

    ![](img/19_3.jpg)


    Chew Yen Fook


    由于其繁殖羽毛的装饰，被称为羽毛鹭�（尽管其他鹭�在繁殖时也会不同程度地长出这种羽毛）。这种全白的鸟在体型上实际上介于大鹭�和小鹭�之间，但比其中任何一种都要稀。可以通过黄色的喙与较小的小鹭�区分，通过其光滑无折痕的颈部与较大的大鹭�区分。与其亲属一样，它们出现在稻田、红树林、沼泽以及沿海泥滩中。


    # 小鹭� *Egretta garzetta* 60cm


