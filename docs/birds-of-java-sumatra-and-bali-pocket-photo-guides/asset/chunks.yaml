    bird sometimes gathers in huge flocks to roost in reedbeds, tall grasses and even
    on city buildings. It is dark blue above, with a white breast and very long outer
    tail feathers. The forehead is red, and the throat red with a blue bar below.
    Juveniles are duller and lack the tail-streamers. A common winter visitor throughout
    the region, from breeding grounds in northern latitudes.


