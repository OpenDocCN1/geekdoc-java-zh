    ![](img/46_2.jpg)


    ![](img/46_1.jpg)


    Kevin Carlson, åWindrush Photos


    Apart from the conspicuous black band through the eye and around the nape and
    its very pale grey upperparts, this small tern appears very white. In flight,
    its very long forked tail is obvious. The legs are black, and the black bill is
    tipped with yellow. Juveniles, however, have grey-brown mottled plumage over the
    upperparts and on the crown, with black mottling on the nape; the bill-tip is
    also brownish and the tail unforked. This quite common resident breeds on offshore
    rocky islands, and is generally seen in the company of other terns on sandy shorelines.


