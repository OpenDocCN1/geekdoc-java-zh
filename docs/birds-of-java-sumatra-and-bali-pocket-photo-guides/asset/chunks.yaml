    **STRAW-HEADED BULBUL** *Pycnonotus zeylanicus* 28cm


    ![](img/82_1.jpg)


    ![](img/82_2.jpg)


    Chew Yen Fook


    Its clear melodious song is responsible for this species’ popularity as a cagebird
    in Indonesia, where birds are exported from Sumatra to Java and Bali. It is one
    of the largest bulbuls, and can be recognized by its golden-straw-coloured crown
