    a red base, and the legs and feet yellow. It is very vocal at dawn and dusk, making
    a cacophony of weird squawks, grunts and croaking sounds. It is a wandering feeder,
    frequently out in the open but never far from dense cover. Very agile, it runs
    over floating vegetation and clambers through bushes, searching for insects. More
    often seen alone, but frequently in twos and threes.


    **COMMON MOORHEN** *Gallinula chloropus* 31cm


    ![](img/38_1.jpg)


    ![](img/40_1.jpg)


    Tilford/Cooke, TC Nature


    This very adaptable aquatic bird is almost entirely dark grey to black, with a
    broken white stripe along its flanks. It also displays white patches under the
    tail, particularly when dashing for cover with its tail raised. It has a characteristic
    red frontal shield and bill with a yellow tip. The legs are greenish-yellow. Not
    only is it a good surface swimmer, it will also dive and even run over the water’s
    surface to avoid predators. It feeds mainly on aquatic insects. It frequents freshwater
    pools, lakes and rivers, and is naturally ‘at home’ in the rice paddies of the
    region. Found on almost every continent worldwide, and is also a common resident
    of Sumatra, Java and Bali.


    **PURPLE SWAMPHEN** *Porphyrio porphyrio* 48cm


    ![](img/38_1.jpg)


    ![](img/40_3.jpg)


    A rather clumsy-looking bird, big and brightly coloured, its large size, and blue-black
    plumage, offset by a substantial bright red bill and frontal shield making it
    easily recognized. Its undertail-coverts are white and it habitually flicks its
    tail. Its long, ungainly pink legs with huge spreading claws are ideal for both
    trampling through and over aquatic vegetation. Although not uncommon, it is a
    rather quiet and secretive bird, that keeps to the edges of undisturbed reedbeds,
    marshland and occasionally paddyfields. It is found throughout the region.


    **GREY PLOVER** *Pluvialis squatarola* 28cm


    ![](img/41_1.jpg)


    ![](img/41_2.jpg)


