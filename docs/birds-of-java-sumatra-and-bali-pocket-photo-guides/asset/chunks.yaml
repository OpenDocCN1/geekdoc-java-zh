    and tail are bright blue. The white wing patches are particularly conspicuous
    in flight. Both bill and feet are red. Endemic to lowlands in Java and Bali.


    **COLLARED KINGFISHER** *Todiramphus chloris* 24cm


    ![](img/63_2.jpg)


    ![](img/66_3.jpg)


    A very familiar kingfisher, this species is quite evident from its continual calling
    throughout the day. Its harsh, noisy *chue-chue-chue-chue-chue* carries over long
    distances and announces its presence almost everywhere except in the mountains.
    At first sight it is bright blue and white, but at close range the blue of the
    crown, back, wings and tail has a superb green iridescence. It has a beautifully
    clean white collar and underparts. The lores are white, and a black stripe passes
    through the eye and around the back of the head. It prefers open country around
    the coast and wherever there is water in which to fish, and must be the commonest
    kingfisher of the region.


    **CHESTNUT-HEADED BEE-EATER** *Merops leschenaulti* 20cm


    ![](img/63_2.jpg)


    ![](img/67_2.jpg)


    Like all bee-eaters, this species congregates in parties which wander around searching
    for insect prey, which it catches in flight. These birds habitually choose exposed
    perches from which to survey and make their sweeping excursions to catch insects,
    bringing them back to the perch to break up and eat. It has a light chestnut crown,
    nape and mantle, a yellow throat and below this a chestnut and black band. In
    flight, the pale blue rump contrasts with the dark green back and tail, and the
    underwing appears orange. The tail is square-ended and lacks the streamers of
    similar species. Quite common in open wooded habitat, particularly in the lowlands.


    **BLUE-THROATED BEE-EATER** *Merops viridis* 27cm


    ![](img/63_2.jpg)


    ![](img/67_3.jpg)


    Although gregarious and delightfully aerobatic, this bee-eater appears a little
    less inclined to hawk its prey like other bee-eaters, preferring to wait around
    on exposed perches and making only short dashes to catch passing insects. Its
    distinguishing features are its blue throat and solid black eye-stripe and the
    male’s rich brown cap and mantle. Its elongated central tail feathers are blue,
    as are the outer tail, vent and rump. The back, wings and breast, and the female’s
    crown, are light green. Preferring drier terrain, such as open grassland or more
    open scrub and woodland, it occurs particularly in the coastal lowlands of Sumatra
    and West Java.


    **DOLLARBIRD** *Eurystomus orientalis* 30cm


    ![](img/68_1.jpg)


    ![](img/68_2.jpg)


    Chew Yen Fook


    This is the only member of the roller family to occur in the region. It is usually
    seen in ones and twos, hunting from exposed perches in the open country; it dives
    on its insect prey, either in the air or on the ground. It is frequently mobbed
    by other birds because of its crow-like appearance. Overall, it appears dark bluish-black
    with an upright stance, with a large head and solid orange-red bill. In flight,
    two circular light blue contrasting patches on the underwing-coverts are very
    evident, and these give the bird its English name. Although widespread, it is
    not common.


    **BUSHY-CRESTED HORNBILL** *Anorrhinus galeritus* 70cm


    ![](img/68_1.jpg)


