    尽管栖息在该地区，但鹋燕的大部分时间都在海上，只有在恶劣天气驱动或繁殖和换羽的需要时才会冲上岸。它们捕食海面上的小鱼或漂浮的无脊椎动物。这是一种中型海鸥，背部、尾部和翅膀呈深灰褐色，腹部为白色，尾部长叉。冠顶、颈部和眼纹为黑色，留有一条窄的白色额头连接到短的白色眉纹。翅膀前缘为白色，外尾羽也是白色。在夏季月份在陆地上见得较多，但那时通常是单只或小群出现。


    ### 大冠白海鸥 `Thalasseus bergii` 45cm


    ![](img/46_2.jpg)

    ![](img/47_1.jpg)


    这种海鸥看起来非常大，背部和臀部为灰色，腹部、颈部和喙上方有白色斑块。在繁殖羽下，它有黑色的头冠，向后延伸形成一个微小的羽冠。在夏季，黑色的头顶布满密集的白色斑点，随着冬季临近，逐渐变为白斑灰色。它有一只黄色的喙和黑色的脚，喙的颜色使其与非常相似但体型稍小的小冠海鸥区分开来。幼鸟上部有密集的棕色斑纹，具有灰色的尾巴和外级飞羽。内陆水域非常常见的海鸥。


    ### 小冠白海鸥 `Thalasseus bengalensis` 40cm


    ![](img/46_2.jpg)

    ![](img/47_3.jpg)


    Steve Young


    这种物种与大冠白海鸥非常相似，但体型略小，具有明显的橙色喙。在繁殖羽下，黑色头冠向前延伸并与喙相接。繁殖后，额头和额冠变为白色，留有黑色的羽冠。幼鸟看起来更像非繁殖期的成鸟，但具有灰色的翅膀和棕色斑纹的上部。经常与其他海鸥在一起，有时成群结队。出现在沿海海域，经常远远远海，但在沙质和泥质岸线观察到的更为频繁。它是爪哇岛和巴厘岛常见的冬季访客，但在苏门腊岛较少。


    ### 粗喙绿鸽 `Treron curvirostra` 27cm


    ![](img/48_2.jpg)

    ![](img/48_1.jpg)


    Chew Yen Fook


    这是一种相当强壮的鸽子，有红脚和黄色的虹膜，周围环绕着淡蓝色的眼环。雄性具有栗褐色的肩部和背部，而雌性为绿色。腹部为亮绿色，侧腹为深绿色并带有白色横纹。颈部是绿色的，在耳羽处变为灰色，额头和冠顶为灰色。苏门腊岛的两个亚种（`T.
    c. curvirostris` 和 `T. c. harterti`）具有宽大的浅绿色喙喙，基部为红色，而来自爪哇岛西南部岛屿的 `T. c. hypothapsina`
    则具有橄榄色基部。低地森林中相当常见且吵闹的鸟，尤其是在果树丛中。


    ### 粉颈绿鸽 `Treron vernans` 27cm


    ![](img/48_2.jpg)

    ![](img/48_3.jpg)


    Tilford/Cooke, TC Nature


    这种小型绿鸽通过其带有黑色带和浅灰色尖缘的灰色尾巴与类似的鸽子区分开来。雄性的头部为蓝灰色，向胸部下方变为粉色和橙色；腹部为绿黄色，背部和翅膀为绿色。雌性为绿色，缺乏雄性那样鲜艳的色彩，但通过尾部图案以及与独特的雄性结伴来识别。它们的叫声是“咕咕”的哨声，进食时是一系列类乌鸦的嘎吱声。在低地和沿海森林以及更开阔的乡村都很常见，在树木结果时变得更加显眼。分布于缅甸南部直到小巽达群岛，通常是留鸟。


    ### 黑颈果鸠 `Ptilinopus melanospilus` 27cm


    ![](img/48_2.jpg)

    ![](img/49_1.jpg)


    Tilford/Cooke, TC Nature


    这种果鸠（注：此处英文为 Dove，实为果鸽）相当健壮，红脚，黄虹膜，周围环绕着淡蓝绿色的眼环。雄性具有栗褐色的肩部和背部，而雌性为绿色。腹部为亮绿色，侧腹深绿色并带有白色横纹。颈部是绿色的，耳羽处变为灰色，额头和冠顶为灰色。苏门腊岛的两个亚种（`T.
    c. curvirostris` 和 `T. c. harterti`）具有宽大的浅绿色喙，基部为红色，而爪哇西南岛屿的 `T. c. hypothapsina`
    则具有橄榄色基部。低地森林中相当常见且吵闹的鸟，尤其是在果树间。


    ### 粉颈绿鸽 `Ptilinopus melanospilus` 27cm


    ![](img/48_2.jpg)

    ![](img/49_1.jpg)


    Tilford/Cooke, TC Nature


    这种果鸠（果鸽）与类似的鸽子的区别在于其带有黑带和浅灰色尖缘的灰色尾。雄性的头部为蓝灰色，一直延伸到胸下方的粉色和橙色；腹部为绿黄色，背部和翅膀为绿色。雌性为绿色，缺乏雄性那样鲜艳的色彩，但通过尾部图案以及与独特的雄性结伴来识别。它们的叫声是“咕咕”的哨声，进食时是一系列类乌鸦的嘎吱声。在低地和沿海森林以及更开阔的乡村都很常见，在树木结果时变得更加显眼。分布于缅甸南部直到小巽达群岛，通常是留鸟。


