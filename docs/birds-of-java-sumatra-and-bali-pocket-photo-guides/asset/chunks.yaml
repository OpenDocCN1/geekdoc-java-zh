    在该地区的 `12` 种太阳鸟中，只有`红喉太阳鸟`和`绿背太阳鸟`分布于巴厘岛。它们是最常见的种类，遍布整个地区，通常出现在开阔的种植园、花园、海岸灌木丛和红树林中。它们通过鲜艳的羽色和长弯喙进行识别，通常在花朵前悬停寻找花蜜。雄性`红喉太阳鸟`具有黄色的胸部、腹部和尾，喉部为棕色，通常带有深紫色的边缘。面部和下巴为橄榄绿色，背部为虹光橄榄绿色，过渡到带有光泽的深蓝色头部。雌性背部为橄榄绿色，腹部黄色。


    ### 火颊太阳鸟

    *Chalcoparia singalensis* 10cm


    ![](img/110_2.jpg)


    ![](img/113_1.jpg)


    Morten Strange


    虽然这种小太阳鸟色彩鲜艳，但其在阴影下的虹光色泽并不常可见，雄性甚至呈现出黑色。然而，在明光下，雄性虹光色的深绿色背部和冠部非常华丽，耳羽处显出深红色。喉部为橙棕色，融入黄色腹部。雌性（如图所示）颜色较暗，背部为橄榄绿色，腹部为浅橙色和黄色。喙和腿为黑色，腿部通常带有绿色。这种栖息于森林边缘和稀疏林地的鸟类通常独居或成对出现，经常与其他物种结伴。


    ### 白腹太阳鸟

    *Aethopyga eximia* 13cm


    ![](img/110_2.jpg)


    ![](img/113_3.jpg)


    这种色彩斑斓的太阳鸟因其侧腹簇的柔软白色羽毛而得名。除了相当暗淡的橄榄色和黑色翅膀、长蓝绿色尾巴和橄榄色腹部外，雄性具有亮黄色的臀部、红色的喉部和上胸，上胸被一条蓝绿色的项状条纹横跨，冠部为虹光紫色。除了白色侧腹，尾巴较短的雌性呈暗橄榄色，喉部和尾下覆稍浅。该物种是爪哇岛特有种，栖息于山地森林边缘和高山灌木丛，特别喜喜花树。


    ### 白喉太阳鸟

    *Leptocoma calcostetha* 13cm


    ![](img/110_2.jpg)


    ![](img/114_1.jpg)


    Chew Yen Fook


    雄性颜色较深，甚至呈黑色。背部具有绿色虹光，胸部和颊纹为紫色。喉部和上胸呈现出深铜色的光泽，而侧腹为黄色，尾巴为蓝黑色。它与体型较小的`紫喉太阳鸟`的区别在于它没有红色的胸部，但有黄色的侧腹。雌性头部呈灰色，背部为暗橄榄绿色至棕色，尾巴为黑色；尾下覆和喉部为浅灰色，融入绿黄色的胸部。是爪哇和苏门答腊的低地地留鸟，发现于海岸灌木丛、林地和红树林中。


    ### 绿背太阳鸟

    *Cinnyris jugularis* 10cm


    ![](img/110_2.jpg)


    ![](img/114_3.jpg)


    Chew Yen Fook


    一种非常活跃且经常喧闹的小鸟，要么在花丛间穿梭，要么悬停吸花蜜。它也部分食昆虫和花粉。体型很小，拥有长黑喙，背部为橄榄绿色，翅膀较深，尾巴为黑色。腹部为亮黄色，尾部下方露出白色。繁殖期的雄性具有黑色的下巴和上胸，带有紫色虹光。巢是由细草和毛状材料织而成的精美结构，危险地悬挂在枝末或或叶丛中。它遍布整个地区，特别是在低地地区。


    ### 密氏太阳鸟

    *Aethopyga temminckii* 雄性 13cm，雌性 10cm


    ![](img/110_2.jpg)


    ![](img/115_2.jpg)


    Chew Yen Fook


    这种亮红色的太阳鸟有着较长且略微缺口的红色尾巴。它的背部、喉部和胸部为深红色，除了环绕颈部和颊纹的虹光紫色眉纹外。上尾覆也为紫色，邻近亮黄色的臀斑。它的腹部为灰白色。雌性体型较小，红褐色尾较短。它们背部为暗橄榄绿色，头部呈灰色，翅膀带棕色，腹部较浅且发黄。它是苏门答腊和婆罗洲较开阔的山地森林中偶尔鸟。


    ### 爪哇太阳鸟

    *Aethopyga mystacalis* 12cm


    ![](img/110_2.jpg)


    ![](img/115_3.jpg)


    现在被认为是爪哇岛特有的独立物种，这种小太阳鸟与密氏太阳鸟（`Aethopyga temminckii`）曾被认为是红腹太阳鸟（`Aethopyga siparaja`）的一个亚种。它也被称为`紫尾太阳鸟`。雄性具有亮红色头部、胸部和背部、黄色臀部和长虹光紫色尾巴。冠部和颊纹也是紫色，翅膀为橄榄绿色，腹部呈白色。雌性体型小得多且只有短尾，呈暗橄榄灰色。它们栖息于森林和森林边缘，通常成对出现，特别被寄生植物花吸引。


    ### 小食雀鸟

    *Arachopyga longirostra* 15cm


    ![](img/110_2.jpg)


    ![](img/113_1.jpg)


    一种不起眼的小鸟，拥有长弯喙，背部为橄榄绿色，下方为灰色。它的腹部是黄色，姜黄色。


    ### 长嘴食雀鸟

    *Arachopyga robusta* 21cm


    ![](img/110_2.jpg)


    ![](img/116_3.jpg)


    这种非常长嘴的太阳鸟通常独居，分布于苏门答腊。


    ### 黄耳食雀鸟

    *Arachopyga chrysogenys* 17cm


    ![](img/110_2.jpg)


    ![](img/117_1.jpg)


    黄耳食雀是另一种羽色暗淡的食雀鸟，背部为橄榄绿色，下方为橄榄灰色，胸部有中等斑条纹。尾部为黄色。它有一个较大的黄色颊斑和窄且不完整的眼环。它在巴厘岛不分布，但在苏门答腊，它可能与眼镜食雀鸟（`Arethopyga
    flavaster`）混淆，后者体型更健壮，喙较短且有宽黄色眼环。


    ### 灰胸食雀鸟

    *Arachopyga affinis* 17cm


    ![](img/110_2.jpg)


    ![](img/117_3.jpg)


    这种鸟更有可能出现在香蕉丛和花树顶端，该物种最显著的特征是长弯的喙。它的羽色相当暗淡，背部为橄榄绿色，冠部有细小的黑色条纹，下方为橄榄色灰色，带有不明显的黑色条纹。尾巴和翅膀往往较黑。爪哇和巴厘岛的亚种（`A.
    a. affinis`）翅膀前缘为浅黄色，胸部泛黄。苏门答腊的种群（`A. a. concolor`）颜色更暗、更苍白。是该地区海岸和低地林地及灌木丛的常见留鸟。


    ### 东方眼雀

    *Zosterops palpebrosus* 11cm


    ![](img/118_2.jpg)


    ![](img/118_1.jpg)


    Tilford/Cooke, TC Nature


