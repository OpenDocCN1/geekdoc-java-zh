    having a small amount of white streaking. Once a common bird of lowland and hill
    forest, particularly of riverine habitat, it is now becoming scarce.


    **BLACK-HEADED BULBUL** *Pycnonotus atriceps* 17cm


    ![](img/82_1.jpg)


    ![](img/82_3.jpg)


    Usually alone, but also in small groups foraging with other species, this bulbul
    can be recognized by its mainly yellow body plumage and glossy black head and
    throat. The upperparts are greenish-yellow tinged brown, and the underparts are
    a bit brighter. The wings are black, and the tail yellow with a black subterminal
    bar. A rare colour form exists in which the yellow areas are replaced by a dull
