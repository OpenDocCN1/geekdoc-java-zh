    # GREATER COUCAL *Centropus sinensis* 52cm


    ![](img/56_2.jpg)


    ![](img/58_1.jpg)


    Chew Yen Fook


    Although often on the ground, this large, black, crow-like bird with chestnut-brown
    wings is more likely to be seen lumbering about in small trees and bushes, where
    it can hide in thick vegetation. The bill and feet are black. Its very eerie,
    far-reaching, low-pitched call starts with a series of `poop, poop, poop` sounds,
    increasing in tempo and then slowing again, but occasionally a series of just
    four deep monotonous `poop, poop, poop, poop` notes is given. It is heard more
    often in the morning. A resident throughout the Sundas, preferring forest edges,
    mangroves, grassy banks and secondary scrub.


    # LESSER COUCAL *Centropus bengalensis* 40cm


    ![](img/56_2.jpg)


    ![](img/58_3.jpg)


    Morten Strange


    Very similar in appearance to the Greater Coucal, this species is smaller and
    has duller plumage, and is also more common throughout the region. Its flight
    is weak, consisting only of short, laboured, flapping forays low over the vegetation
    in search of insects. It hops when on the ground, and clambers around when in
    trees and bushes. Like other coucals, the plumage is black except for the chestnut
    back and wings; the bill and feet are also black. Found especially in the lowlands,
    where it frequents open grassy areas, particularly the denser alang-alang grassland
    and marshland.


    # INDIAN SCOPS OWL *Otus bakkamoena* 20cm


    ![](img/59_1.jpg)


    ![](img/59_2.jpg)


    Tilford/Cooke, TC Nature


    This common owl can often be seen hunting for insects and small rodents from trees
    and prominent perches in built-up areas of towns. The regular soft `whoop` call
    of the male and the `weeoo` and `plop` calls from the female are often heard alternately
    as a continuous duet. Identification is not simple, as the species occurs in several
    colour forms. It can be dull reddish-brown to grey-brown, with the upperparts
    mottled and blotched with buffs and black; the underparts are paler and streaked
    with black. It has a pale sandy ‘neck collar’. Bill and feet are yellow. Found
    almost everywhere below 1500m and possibly the commonest owl encountered.


    # BARRED EAGLE OWL *Bubo sumatranus* 45cm


    ![](img/59_1.jpg)


    ![](img/59_3.jpg)


    Chew Yen Fook


    One of the larger owls to be found in the region, this magnificent bird is unfortunately
    rarely seen, confining itself to the lowland forests and emerging from its daytime
    roosting place only at dusk. Recognized by its large size, its prominent horizontal
    ear-tufts, and its pale grey underparts heavily barred with black. The upperparts
    are dark brown, flecked and barred with buff. The eyes are brown and the feet
    and bill yellow. It has many unusual calls, which are often thought to be attributable
    to mysterious demons by the local people. Its familiar call is a loud `whooa-hoo,
    whooa-hoo`, followed by a deep groan.


    # BUFFY FISH OWL *Ketupa ketupu* 45cm


    ![](img/59_1.jpg)


    ![](img/60_2.jpg)


    This large owl has an amusing appearance with its bright yellow eyes and its conspicuous
    horizontal ear-tufts. Its upperparts are brown, streaked with black and buff,
    and the underparts are bright rufous-buff with narrow black streaks. It has whitish
    eyebrows, a grey bill and yellow feet. It is a mainly nocturnal species, preferring
    to remain hidden among trees during the day. At night, it ventures outside the
    forest into parks, paddyfields and often alongside roads. It is never far from
    water, on which it is dependent for its fishing for frogs, fish and other aquatic
    life.


    # SPOTTED WOOD OWL *Strix seloputo* 47cm


    ![](img/59_1.jpg)


    ![](img/60_3.jpg)


    Being nocturnal, this bird is seldom seen, but its presence is disclosed by its
    low growling and resounding `hoo-hoo-hoo` calls. It is a large owl, similar in
    shape to the Barred Eagle Owl, but without the ear-tufts. Its facial discs are
    light rufous and the underparts are whitish, tinged rufous and lightly barred
    with dark brown. A white throat is characteristic. The upperparts are a rich chocolate-brown,
    marked with black-edged white spots. The bill is greenish-grey and the feet grey.
    Found in the lowland forests of Java, it may also be attracted to woodland close
    to villages and sometimes into towns.


    # LARGE-TAILED NIGHTJAR *Caprimulgus macrurus* 30cm


    ![](img/59_1.jpg)


    ![](img/61_1.jpg)


    Mike McKavett, Windrush Photos


    This quite large grey-brown nightjar spends its daytime in shady areas, concealed
    by its camouflaged plumage. In flight a white patch on the centres of the four
    primary wing feathers `choink-choink-choink` is visible. One of the smallest nightjars
    in the region, this species has a monotonous repeated call `jweep`, which is heard
    around dawn and dusk. Widespread from India to Australia, it is locally common
    over wooded country, preferring mangroves and forest edges.


    # SAVANNA NIGHTJAR *Caprimulgus affinis* 22cm


    ![](img/59_1.jpg)


    ![](img/61_3.jpg)


    One of the smallest nightjars in the region, this species is fairly uniform brown.
    It is common in dry open areas around coastal lowlands, but found also, surprisingly,
    in big cities, where it exploits flying insects attracted by the lights and uses
    large flat rooftops on which to rest. In open country it roosts on the ground
    by day, and is seldom seen elsewhere.


    # GLOSSY SWIFTLET *Collocalia esculenta* 9cm


    ![](img/62_2.jpg)


    ![](img/62_1.jpg)


    Chew Yen Fook


    This is the smallest and commonest swiftlet in the region, identified by its glossy
    black upperparts and whitish belly. It also goes by the alternative name of White-bellied
    Swiftlet. The chin is pale grey, and in flight a small notch is apparent in the
    tail. Both bill and feet are black. It nests in the entrances to caves, but it
    does not use echolocation and the nest is inedible. Like all swifts it is insectivorous,
    catching aerial insects as it flies over forests and agricultural land, from the
    coastline to the highest peaks. It often flies over water, dipping down to drink.


    # HOUSE SWIFT *Apus nipalensis* 15cm


    ![](img/62_2.jpg)


    ![](img/62_3.jpg)


    This medium-sized swift, recently split from Little Swift `A. affinis`, is usually
    seen in large groups hunting insects over open countryside. It can be recognized
    by its white rump and throat and slightly notched tail, unlike the similar but
    larger Fork-tailed Swift `A. pacificus`, which has a distinct fork to the tail.
    Otherwise it has blackish plumage, black bill and brown feet. It prefers coastal
    habitats up to the lower hills and is frequently found in towns and villages,
    where it nests under the eaves of houses; it also uses overhanging cliff faces
    and cave entrances as nesting sites. It is locally common over much of the region.


