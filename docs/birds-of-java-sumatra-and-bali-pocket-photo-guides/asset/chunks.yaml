    \ with black-edged feathers in the tail and primaries, and the forehead is velvety-black.\
    \ Usually seen in pairs but occasionally in small parties, moving erratically\
    \ through the understorey branches of forests and plantations. Fairly common in\
    \ lowland and hill forests in Sumatra and Java.\n\n### BLUE NUTHATCH `*Sitta azurea`\
    \ 13cm\n\n![](img/109_2.jpg)\n![](img/109_3.jpg)\n\nChew Yen Fook\n\nThis nuthatch\
    \ typically forages along branches and tree trunks, levering off fragments of\
    \ bark to get at grubs and insects. In shady forest it appears to have black upperparts,\
    \ but in fact its back, wings and tail are shiny dark blue; only the crown, nape\
    \ and sides of the face are black. The throat and breast are buffish-white. East\
    \ Javan birds (`*S. a. azurea*`) have a bluish-black lower belly and vent, but\
    \ these are black on West Javan and Sumatran birds (`*S. a. nigriventer*` and\
    \ `*S. a. expectata*`). It has a yellow bill and grey feet. Not recorded in Bali,\
    \ but in Sumatra and Java fairly common in lower mountain forests.\n\n### CRIMSON-BREASTED\
    \ FLOWERPECKER `*Prionochilus percussus` 10cm\n\n![](img/110_2.jpg)\n![](img/110_1.jpg)\n\
    \nChew Yen Fook\n\nThe adult male is brilliantly coloured, with bright yellow\
    \ underparts being broken only by a bright crimson breast patch. The upperparts\
    \ are greyish-blue, with a bright red patch on the crown. The forehead and primaries\
    \ are black and the tail is dark blue-grey. It has a white malar stripe finely\
    \ underlined in black. Females are olive-green above, with only a tinge of orange\
    \ on the crown, and have a yellow-tinged grey throat, a white malar stripe and\
