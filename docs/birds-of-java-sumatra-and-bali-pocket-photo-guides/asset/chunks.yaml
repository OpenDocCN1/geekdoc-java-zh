    Mason, V. and F. Jarvis. *Birds of Bali*. Periplus Editions, 1989


    Sibley, C.G. and B.L. Monroe, Jr. *Distribution and Taxonomy of Birds of the World*.
    Yale University Press, New Haven and London, 1990


    Steffee, N.D. *Field Checklist of the Birds of Java and Bali*. Russ Mason’s Natural
