    Seen singly or in small groups, often in the company of other waterbirds, as it
    slowly stalks its prey in muddy areas or at the waterside. This heron normally
    appears dark brown, streaked with light brown, with buffish-brown tail and underparts
    and white wings, but in breeding plumage the neck and head become golden-buff
    and the back blackish. It has a black-tipped yellow bill and dull green feet.
    Found in both inland and coastal areas of Java and Bali, where it is fairly common
    on freshwater marshes and paddyfields. In south Sumatra, it is thought to be only
    a non-breeding visitor.


    **LITTLE HERON** *Butorides striata* 45cm


    ![](img/18_2.jpg)


    ![](img/22_1.jpg)


    Also known as the Mangrove Heron or Striated Heron, this little bird is a solitary
    hunter which will stand motionless in one position, awaiting its prey. Adults
    are mainly dark grey, with a very dark greenish crown and long crest feathers;
    they have a pale buff neck and facial markings. Juveniles have a more stocky appearance,
    and are brown with a streaked breast and mottled upperparts. Quite common, particularly
    around the coastal wetlands, this shy bird prefers to remain close to vegetation
    cover, but it is infrequently seen also on rocky shorelines and exposed reefs.


    **BLACK-CROWNED NIGHT HERON** *Nycticorax nycticorax* 60cm


    ![](img/18_2.jpg)


    ![](img/22_6.jpg)


    *Adult (left), Juvenile (right)*


    Adults have a distinctive plumage of black back and crown, white neck and underparts,
    and grey wings and tail, with two long white plumes emerging from the nape. In
    breeding plumage, the normally dirty yellow legs become red. Females are slightly
    smaller than males. Juveniles are streaked and mottled brown. By day these birds
    congregate to rest in tree roosts, but as evening descends they circle the roost,
    giving characteristic croaking calls, before leaving for freshwater feeding areas
    in paddyfields, swamps and mangroves and on mudflats. They often breed in large
    and very noisy colonies in mangroves or in trees overhanging water.


    **MALAYAN NIGHT HERON** *Gorsachius melanolophus* 50cm


    ![](img/18_2.jpg)


    ![](img/23_1.jpg)


    As it is nocturnal and very timid, and prefers dense vegetation, particularly
    bamboo and reed surrounding inland marshes, this species is seldom seen except
    when it ventures out into open areas to feed. It is solidly built, having chestnut
    upperparts finely barred and speckled across the back and wings, and a pale chestnut
    neck and head with black trailing crest. Its underparts are white, and flecked
    heavily with chestnut, buff and black; the throat is white, streaked black along
    the median line. It has olive-green legs, and the short stubby bill is olive-brown
    with yellow on the lower mandible. A winter visitor to Sumatra and its islands
    and occasionally Java.


    **YELLOW BITTERN** *Ixobrychus sinensis* 38cm


    ![](img/19_2.jpg)


    ![](img/23_4.jpg)


    Chew Yen Fook


    Rice paddies, reedbeds, swamps and beach forest are all favoured by this very
    quiet and secretive bird. It occasionally appears briefly in the open, only to
    dart back into the reeds and disappear. In flight, the adult’s warm buffish-brown
    upperparts often appear yellow, contrasting with the black tail, flight feathers
    and crown, while the underparts are buff. Juveniles are duller, with brown streaking.
    Feet and bill are brownish-yellow. Although an uncommon resident in Sumatra, this
    is a common winter visitor in Java and Bali. Sadly, as it reaches the northern
    coasts of Java, it is caught in fairly large numbers to be fried and eaten with
    other shorebirds as ‘Burung Goreng’.


    **CINNAMON BITTERN** *Ixobrychus cinnamomeus* 41cm


    ![](img/18_2.jpg)


    ![](img/24_1.jpg)


    One of the smaller, more timid bitterns of the region which remains under cover
    while stalking its prey in grassland, freshwater swamps and rice paddies. When
    disturbed, it rises quickly from cover with a croaking alarm call, and flies off
    with slow powerful wingbeats. Adult males have fairly bright cinnamon-brown upperparts
    and orange-buff underparts, and are streaked black down the centre of the belly
    and along the upper flanks; the sides of the long neck are streaked dirty white.
    Females and juveniles appear darker, with a black cap, but juveniles have a more
    mottled appearance. Although very common, it is usually found alone.


    **MILKY STORK** *Mycteria cinerea* 90cm


    ![](img/18_2.jpg)


    ![](img/24_3.jpg)


    This large stork normally occurs in single species groups but is occasionally
    found in the company of other storks and herons. It is primarily white but with
    black flight feathers. It has a prominent bare patch of facial skin which varies
    in colour from pink to red, a long decurved olive-yellow bill and greyish legs.
    Juvenile birds are a dirty pale brown, but with the rump white and the flight
    feathers black. A relatively rare species but found throughout the region, it
    occurs in mangroves and mudflats of West Sumatra, the northern coast of Java near
    Jakarta, and Brantas Delta, near Surabaya.


    **WOOLLY-NECKED STORK** *Ciconia episcopus* 85cm


    ![](img/18_2.jpg)


    ![](img/25_1.jpg)


    This large stork is predominantly black, but has a very ‘fluffy’ feathered white
    neck. The undertail and lower belly are also white, as are the forehead and a
    narrow eyebrow. It has a patch of dark grey facial skin. The feet are a dirty
    red, while the bill is blackish, tinged red, with a red tip. Immature birds differ
    from adults in having the black plumage tinged brown. Although uncommon in Bali
    and Java, this species can be seen feeding in paddyfields and pastureland in the
    company of other storks, and often roosting with them in tall trees. It is not
    a colonial breeder.


    **STORM’S STORK** *Ciconia stormi* 80cm


    ![](img/18_2.jpg)


