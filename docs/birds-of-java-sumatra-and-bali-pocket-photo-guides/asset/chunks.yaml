    One of the smaller hornbills, this species is easily identified by its thick drooping
    crest. Its plumage is all black except for the greyish-brown upper two-thirds
    of the tail. The patch of bare skin on the throat is blue and that around the
    eye is either blue or white. The feet are black, as is the male’s bill. The bill
    of the female is grey, although it can sometimes be whitish. This hornbill is
    gregarious outside of the breeding season, when noisy flocks of as many as fifteen
    birds can gather together to feed high in the tree canopy. It is found in the
    lowland forests of Sumatra.


    # WREATHED HORNBILL *Aceros undulatus* 100cm


    ![](img/68_1.jpg)

    ![](img/69_2.jpg)


    Apart from the whitish, often dirty yellow, tail and the male’s chestnut-crowned
    creamy head, the remaining plumage is black. The male has a bare yellow gular
    pouch, that of the black-headed female being blue. Like all of the hornbills,
    this one relies on hollow forest trees when nesting, the male restricting the
    size of the entrance hole with mud while the female is incubating, and the female
    doing likewise after hatching until the young are ready to fledge. It is particularly
    fond of figs, but also takes other fruits and insects. Although common in lowland
    and hill forests of Sumatra, its distribution in Java and Bali is confined to
    a few remaining undisturbed forests.


    # ORIENTAL PIED HORNBILL *Anthracoceros albirostris* 75cm


    ![](img/68_1.jpg)

    ![](img/69_3.jpg)


    Chew Yen Fook


    Recognized by its mainly black plumage with a white lower breast, belly and flanks,
    this species also has white patches behind the eye and at the base of the lower
    mandible. The huge horn-coloured bill is surmounted by a banana-shaped casque
    marked with black at the front end. The tail shows variable amounts of black and
    white, particularly on the outer feathers. It is normally found in small parties,
    which give a very chicken-like *puk-puk-puk-puk* cackle; also utters a loud, raucous
    and cackling laugh. Inhabits edges and clearings in more remote lowland forest
    and secondary forest right down to the coast, throughout the Greater Sundas.


    # RHINOCEROS HORNBILL *Buceros rhinoceros* 110cm


    ![](img/68_1.jpg)

    ![](img/70_2.jpg)


    Chew Yen Fook


    Although not present in Bali, this hornbill gives the impression that it is more
    numerous than it really is. A very large bird with a loud voice, usually seen
    in pairs and duetting in flight, it creates a false impression of numbers. Its
    head, breast, wings and back are black and the lower belly a dirty white. The
    tail is white with a broad black band. It can be identified in flight by its all-black
    underwings, white belly and banded tail. The enormous yellow bill, becoming red
    at the base, is surmounted by an upturned casque. Found in low densities in most
    large pockets of hill and lowland forest in Sumatra and Java.


    # GREAT HORNBILL *Buceros bicornis* 125cm


    ![](img/68_1.jpg)

    ![](img/70_3.jpg)


    Usually travelling about in pairs, this huge hornbill feeds noisily in the high
    canopy. Its call can be described as a loud and harsh barking roar. The enormous
    yellow bill and casque, black face, its yellow-stained white neck and upper breast,
    and black subterminal bar on a white tail separate it from other hornbills of
    the region. The back, lower belly and wing-coverts are black, and a white wingbar
    is often stained with yellow. This uncommon species confines itself to lowland
    and submontane forests, ranging from India through South-east Asia and the Malay
    Peninsula to Sumatra.


    # FIRE-TUFTED BARBET *Psilopogon pyrolophus* 26cm


    ![](img/71_1.jpg)

    ![](img/71_2.jpg)


    As with most barbets, the main plumage is bright green. This species has a yellow
    band across the breast, outlined with a black line below. The rear crown and nape
    are red, the chin green, the ear-coverts grey and the eye-stripe and forehead
    black, and it has a prominent red-tipped black hairy tuft at the base of the lores.
    It is very fond of ripe fruit, particularly small figs, and it will sit stationary
    high in the trees for long periods while frequently uttering its harsh buzzing
    call, which is reminiscent of a cicada. Confined to the Malay Peninsula and Sumatra,
    where it prefers tall forest trees in the lower hills.


    # LINEATED BARBET *Megalaima lineata* 29cm


    ![](img/71_1.jpg)

    ![](img/71_3.jpg)


    This barbet has a green back, wings and tail, and a brown head and upper breast
    heavily streaked with buff. The remaining underparts are green and also streaked
    with buff. It has a broad orange-yellow orbital ring of bare skin. The heavy bill
    is pale pink, and the feet yellow. It is frequently seen in sparse, dry coastal
    woodlands, edges of savanna, acacia forest, orchards and cultivated areas. Not
    found on Sumatra, but quite a common resident in open forest, along forest edges
    and in clearings in the more remote areas of Java and Bali.


    # RED-CROWNED BARBET *Megalaima rafflesii* 25cm


    ![](img/71_1.jpg)

    ![](img/72_2.jpg)


    The combination of a bright red crown, a yellow cheek and a blue throat is diagnostic
    of this medium-sized barbet. The main plumage is bright green, with a red patch
    on the rear of the eye which blends into black on the ear-coverts. The bill is
    black and the feet grey. Juvenile birds are much duller in appearance. Like the
    rest of its family, it nests in holes in trees. This quite common barbet prefers
    the lowland forests, where it inhabits.


    # BLACK-BANDED BARBET *Megalaima javensis* 26cm


    ![](img/71_1.jpg)

    ![](img/72_3.jpg)


    Tilford/Cooke, TC Nature


    Quite large, with green body plumage and tail, this barbet has a yellow spot under
    the eye. A thin black necklace separates the red and yellow neck markings. The
    crown is blue. The race found in Java and Bali also has patches of yellow on the
    cheek and below the black breast stripe. The Sumatran race lacks the yellow but
    has red cheeks. More likely to be encountered around clearings and forest edges,
    this endemic of Bali and Java appears plentiful.


    # BLUE-EARED BARBET *Megalaima australis* 18cm


    ![](img/71_1.jpg)

    ![](img/73_1.jpg)


    Morten Strange


    A small barbet, more likely to be heard than seen, but careful examination of
    fruiting trees will often lead to its located. This species’ calls are a fast
    repeated *tuk-trrk, tuk-trrk*, and a series of high-pitched whistled or trilled
    notes. Two races occur in the region, both having green body plumage, a black
    malar stripe and breast stripe, and a blue chin and crown. The Javan race has
    yellow on the cheek, while the Sumatran race has red cheeks. This is a common
    barbet of forests and plantations, being found from the coast to the lower hills.


    # COPPERSMITH BARBET *Megalaima haemaceala* 15cm


    ![](img/71_1.jpg)

    ![](img/73_3.jpg)


    Tilford/Cooke, TC Nature


    A drawn-out resonant *tonk-tonk-tonk-tonk* call, reminiscent of a vibrating hammer
    on metal, announces this bird’s presence. While frequently found in trees in open
    country, it also ventures into town gardens and parks. Usually solitary, but often
    flocks with other barbets at fruiting trees. The back, wings and tail are green,
    with fawn underparts streaked with black. The race found in Java and Bali (*M.
    h. rosea*) has a red crown, chin, throat and cheek, the Sumatran race (*M. h.
    delica*) having the throat, cheek and eyebrow yellow. A fairly common resident
    of open lowland forests throughout the range.


    # LACED WOODPECKER *Picus vittatus* 30cm


    ![](img/71_1.jpg)

    ![](img/74_1.jpg)


    Morten Strange

