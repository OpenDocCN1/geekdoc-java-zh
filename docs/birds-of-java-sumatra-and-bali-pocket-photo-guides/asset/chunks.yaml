  trans: '


    在冬羽时期，这种相当相当迷人的涉水类鸟上部呈灰色和棕色斑纹，下部为浅灰色至白色，长有黑色的喙和深灰色的腿。飞行时，它显示出浅色的翼斑和尾臀斑，下方是白色的翅下，身体附近有一块大黑色斑块。这些特征可以很容易将其与青金鸻区分开来，后者体型略小且喙也较短。灰鸻在北极繁殖，是该地区沿海地区的冬季访客。它们成小群出现在潮间泥滩上，取食海洋无脊椎动物，经常栖息在孤立的砾石角上。


    ### 青金鸻 `Pluvialis fulva` 25cm


    ![](img/41_1.jpg)


    ![](img/41_3.jpg)


    Chew Yen Fook


    典型的鸻形型，身体健壮，颈部细长，头部较大，喙短而有力。出现在该地区时，通常处于非繁殖羽色，失去了在繁殖地特有的黑色脸部和下部。可以通过其斑驳的金色、棕色和肉褐色上部，以及肉褐色的胸部、脸和眉纹来识别。喙是黑色的，腿是灰色的。该物在西伯利亚北部、东北亚和阿拉斯加繁殖，冬季迁徙至东南亚和澳大利亚，并在巽腊群岛沿岸停留。它们在沿海泥滩和开阔草地上很常见，经常成群聚集。


    ### 马来环鸻 `Charadrius peronii` 15cm


    ![](img/41_1.jpg)


    ![](img/42_1.jpg)


    Morten Strange


    作为胆量较小的涉水类鸟之一，这种小鸟更有可能单独或成小群出现，它与其他涉水类鸟群群是不寻常的。像许多小鸻一样，它是黑色、棕色和白色的，有短短黑喙。它的体型明显小于小锥鸻
    `CharAdrius mongolus` 和大锥鸻，它还有一个窄的颈环，雄性为黑色，雌性为棕色。与普通岸鸻不同，它窄的黑色眼纹与深褐色的耳斑是分开的。它们在沙质滩上非常常见，沿岸线觅食。


    ### 大锥鸻 `Charadrius leschenaultii` 23cm


    ![](img/41_1.jpg)


    ![](img/42_3.jpg)


    B. R. Hughes, Windrush Photos


    这种棕、白、灰色的鸻会与其他涉水类鸟一起成群，特别是与小锥鸻 `Charadrius mongolus` 聚集在泥滩和沙质河口海滩上，通常在地面上探测寻无脊椎动物。它最容易通过更粗实的喙与体型较小但其他相似的小锥鸻区分开来；除后者外，在该地区遇到的其他冬候鸻都显示出胸带或颈环。然而，早到的个体可能显示出残留的繁殖羽色痕迹，并带有栗褐色的胸带。这种常见的冬季迁徙鸟范围从非洲、亚洲一直延伸到澳大利亚和新西兰。


    ### 长嘴沙鹬 `Numenius phaeopus` 43cm


    ![](img/41_1.jpg)


    ![](img/43_1.jpg)


    Tilford/Cooke, Nature


    一种大型长腿涉水类鸟，颈部较长，喙向下弯。羽毛有密集的棕色斑纹，在肉褐色眉纹和深色眼纹上方有明显的黑冠。飞行时，显示出白色的翅下、尾臀和下背。通常很安静，受惊时经常会发出哨鸣般的叫声。它是该地区海岸线的常见访客，在潮间泥滩和河口与其他涉水类鸟群聚集。它也出现在沿海湿地和粗旷草地上。非繁殖鸟类全年都会出现。


    ### 斑尾沙鹬 `Limosa lapponica` 37cm


    ![](img/41_1.jpg)


    ![](img/43_3.jpg)


    Tilford/Cooke, Nature


    该物种与相似的黑尾沙鹬 `Limosa limosa` 可能同时出现。它们都是中大型长腿涉水类鸟，喙相当平直且长。两者都有灰棕色的上部，斑尾沙鹬的斑纹更密，它具有明显的条纹尾巴，且白色胸部的条纹也略深。它通常单独出现，在沿海泥滩和上游泥质河岸边觅食，但偶尔也会访问周围的湿地和稻田。这种苏门答腊相当常见的访客在爪哇腊和巴厘岛并不常见。在该地区看到的个体在东北亚繁殖，且通常处于非繁殖羽色。


    ### 灰沙锥 `Tringa glareola` 20cm


    ![](img/41_1.jpg)


    ![](img/44_1.jpg)


    Chew Yen Fook


    这是一个非常吵闹的物种，经常发出 `chee-chee` 的叫声。它的灰棕色上部有对比鲜明的黑白斑点，下部为白色，胸部呈灰褐色；额头为肉褐色，连接到狭窄的眉纹。它有长长的黄绿色腿。飞行时，白色的尾臀和翅下非常明显；没有翼斑。在北欧和北亚繁殖，冬季迁徙最南到达澳大利亚。它是该地区全年常见的访客，成小群出现在潮湿的泥地，不仅出现在泥滩和红树树林，还出现在湿地和稻田。


    ### 普通沙锥 `Actitis hypoleucos` 20cm


    ![](img/41_1.jpg)


    ![](img/44_3.jpg)


    Tilford/Cooke, Nature


    这是一种非常“忙碌”的觅食者，不断地抖尾巴，受到骚扰时它通常会飞一短距离然后继续，似乎不受干扰。它有棕色上部和白色下部，有一块棕色斑从颈部延伸到胸侧。飞行时，其白棕相间的条纹外羽清晰可见，白色的翼斑也同样可见。它最可能单独出现，在沿海泥滩和泥质河岸觅食，但偶尔会去上游。它是来自欧亚洲非常常见的迁徙鸟，全年可见。


    ### 灰斑滨 `Calidris alba` 20cm


    ![](img/41_1.jpg)


    ![](img/45_1.jpg)


    Tilford/Cooke, Nature


    这种极其活跃的涉水类鸟经常能看到它跟随退去的波浪，取食被冲上沙滩的海洋无脊椎动物。它们通常成小群出现。非繁殖羽色下，它有浅灰色上部和白色下部，有黑喙和黑脚。黑色的肩斑有助于将其与其他涉水类鸟区分开来。飞行时显示黑色初羽和明显的白色翼斑。灰斑滨在北极繁殖，作为非繁殖迁徙鸟遍布该地区但不常见。几乎完全出现在沙滩上。


    ### 长脚亚 `Calidris subminuta` 14cm


    ![](img/41_1.jpg)


    ![](img/45_3.jpg)


    Ray Tipper


    这种小涉水鸟与同体型的鸟类相比具有较长的颈和腿。非繁殖羽色时，它的上部有密集的棕灰色条纹，有灰褐色的冠部和醒目的白色眉纹。下部为白色，胸部有棕灰色条纹。飞行时，尾臀和尾巴中心呈黑色，边缘为肉褐色。它是来自西伯利亚的常规且大量的迁徙鸟，前往新几内亚或澳大利亚途中经过巽腊群岛；幼鸟有时会停留整个。它通常出现在沿海泥滩和河口，但经常出现在内陆的泥质湿地和稻田。


    ### 黑额白鸥 `Sterna sumatrana` 30cm


    ![](img/46_2.jpg)


    ![](img/46_1.jpg)


    Kevin Carlson, Windrush Photos


    除了眼睛周围和颈部明显的黑色带以及其极浅的灰色上部外，这种小白鸥看起来非常白。飞行时，它极长的叉尾非常明显。腿是黑色的，黑喙尖端带黄色。然而，幼鸟的上部和冠部有灰灰色斑纹，颈部有黑色斑纹；喙尖也是棕褐色的且尾巴未分叉。这种相当常见的留鸟在离外岩石岛上繁殖，通常在沙质岸线与其他白鸥一同出现。


    ### 眉白鸥 `Onychoprion anaethetus` 37cm


    ![](img/46_2.jpg)


    ![](img/46_3.jpg)


    Arnoud B. van den Berg, Windrush Photos


