    Found in the lowland forests of Java, it may also be attracted to woodland close
    to villages and sometimes into towns.


    **LARGE-TAILED NIGHTJAR** *Caprimulgus macrurus* 30cm


    ![](img/59_1.jpg)


    ![](img/61_1.jpg)


    Mike McKavett, Windrush Photos


    This quite large grey-brown nightjar spends the daytime in shady areas on the
    ground, concealed by its camouflaged plumage. Its activity commences at dusk when,
    for half an hour, either perched in a tree or on the ground, it utters its slow
    and repeated *choink-choink-choink* call. In flight, the broad white tips of the
    two outer pairs of tail feathers and the distinctive white patch covering the
    centres of the four outer primary wing feathers aid identification. Widespread
    from India to Australia, this bird is locally common throughout the region, where
    it prefers lowland wooded country, mangroves and forest edges.


    **SAVANNA NIGHTJAR** *Caprimulgus affinis* 22cm


    ![](img/59_1.jpg)


    ![](img/61_3.jpg)


    One of the smallest nightjars in the region, this species has a monotonous repeated
    call, *jweep*, which is heard around dawn and dusk, often from birds in flight.
    Its fairly uniform but well-camouflaged brown plumage has a white patch on each
    side of the neck; the male has white outer tail feathers. It is common in dry
    open areas around the coastal lowlands, but is found also, somewhat surprisingly,
    in big cities, where it exploits the hordes of flying insects attracted by the
    lights and uses the large flat rooftops of buildings on which to rest. In open
    country it roosts on the ground by day, and is seldom seen perched elsewhere.


    **GLOSSY SWIFTLET** *Collocalia esculenta* 9cm


    ![](img/62_2.jpg)


    ![](img/62_1.jpg)


    Chew Yen Fook


    This is the smallest and commonest swiftlet in the region, identified by its glossy
    black upperparts and whitish belly. It also goes by the alternative name of White-bellied
    Swiftlet. The chin is pale grey, and in flight a small notch is apparent in the
    tail. Both bill and feet are black. It nests in the entrances to caves, but it
    does not use echolocation and the nest is inedible. Like all swifts it is insectivorous,
    catching aerial insects as it flies over forests and agricultural land, from the
    coastline to the highest peaks. It often flies over water, dipping down to drink.
    Widespread throughout the region.


    **HOUSE SWIFT** *Apus nipalensis* 15cm


    ![](img/62_2.jpg)


    ![](img/62_3.jpg)


    Morten Strange


    This medium-sized swift, recently split from Little Swift (*A. affinis*), is usually
    seen in large groups hunting insects over open countryside. It can be recognized
    by its white rump and throat and slightly notched tail, unlike the similar but
    larger Fork-tailed Swift (*Apus pacificus*), which has a distinct fork to the
    tail. Otherwise it has blackish plumage, black bill and brown feet. It prefers
    coastal habitats up to the lower hills and is frequently found in towns and villages,
    where it nests under the eaves of houses; it also uses overhanging cliff faces
    and cave entrances as nesting sites. It is locally common over much of the region.


    **COMMON KINGFISHER** *Alcedo atthis* 15cm


    ![](img/63_2.jpg)


    ![](img/63_1.jpg)


    Tilford/Cooke, TC Nature'
