    A gregarious and timid little bird, very difficult to observe as it moves around
    in small groups, foraging through the thickest vegetation. It can be identified
    by its bell-like tinkling call of about three or four notes, culminating in a
    short trill. Like most of the tailorbirds, it has olive upperparts and a high-cocked
    tail. Apart from the orange forehead, the head and upper breast are grey, but
    lighter on the throat and centre of the breast, the remaining underparts and vent
    being bright yellow. An inhabitant of montane forests throughout the region, more
    commonly found in bamboo thickets, evergreen forests and scrub.


    ### ASHY TAILORBIRD *Orthotomus ruficeps* 11cm


    ![](img/99_2.jpg)


    ![](img/102_1.jpg)


    Tilford/Cooke, TC Nature


    A small and rather plain-coloured tailorbird with a grey-brown back and greyish
    underparts, becoming white on the belly. Males have a dark rufous face, crown
    and throat, whereas females have a white throat and a much paler rufous face and
    crown. This energetic little bird is frequently seen in more open lowland forests,
    where it forages among the treetops. It also occurs in mangroves and coastal scrubland,
    as well as bamboo thickets and well-vegetated gardens. Common in Sumatra, but
    in Java found only in the northern wetland areas, and absent from Bali.


    ### ARCTIC WARBLER *Phylloscopus borealis* 12cm


    ![](img/99_2.jpg)


    ![](img/102_3.jpg)


    David Tipling, Windrush Photos


    This small leaf warbler spends much of its time foraging through wooded areas
    in search of insects, often accompanying other warblers and small insectivores.
    It is identified by its conspicuous long yellowish-white supercilium above a blackish
    eye-stripe. It also has a poorly defined single white wingbar. The upperparts
    are dark olive and the underparts almost white, blending to olive-brown on the
    flanks. Similar to the smaller Yellow-browed or Inornate Warbler (*Phylloscopus
    inornatus*), but much duller and with less obvious wingbars. A winter visitor
    from northern Asia, found generally at primary and secondary lowland forest edges
    and mangroves.


    ### MOUNTAIN LEAF WARBLER *Phylloscopus trivirgatus* 11cm


    ![](img/99_2.jpg)


    ![](img/103_1.jpg)


    Chew Yen Fook


    Like many of the leaf warblers, this bird is not easy to see as it flits through
    the tree canopy, often in mixed groups, foraging for insects. It is mainly green
    above, with greenish-yellow underparts. Its prominent greenish-yellow median crown-stripe
    and supercilium are interspaced with a blackish stripe along the crown side and
    a black eye-stripe. The legs are grey, and the bill black above with a reddish
    tinge on the lower mandible. Juveniles are duller and greener below. Fairly common
    in the region’s montane forests, keeping to the treetops and forest edges.


    ### ASIAN BROWN FLYCATCHER *Muscicapa dauurica* 12cm


    ![](img/99_2.jpg)


    ![](img/103_3.jpg)


    Chew Yen Fook


    This species of submontane forest and forest edges can frequently be found in
    plantations, open forest and even gardens. It hunts for aerial insects from exposed
    perches, often shaking its tail on arrival back at the perch. It is greyish-brown
    above and whitish below, becoming grey-brown on the flanks and the sides of the
    breast, and has a pale eye-ring. The black bill has a yellow base to the lower
    mandible. Almost certainly a winter migrant to the region from north-east Asia,
    but some may be resident in north Sumatra. Occurring throughout the lowlands of
    the Greater Sundas, it is particularly common on offshore islands.


    ### VERDITER FLYCATCHER *Eumyias thalassinus* 16cm


    ![](img/104_1.jpg)


    ![](img/104_2.jpg)


    Tilford/Cooke, TC Nature


    This is a fairly large blue fly-catcher. In typical flycatcher fashion it chooses
    exposed perches from which it can launch its attacks on passing aerial insects.
    It prefers open forest and forest edges, but is often seen perched high in the
    tree canopy. The male’s plumage is a fairly uniform greenish-blue, with white
    fringing to the undertail-coverts giving a scaled appearance. The area around
    the lores is dark grey to black. Females look duller and greener, and juveniles
    are a mottled brown tinged with green. The feet and bill are black. Found in the
    lowlands and hills of Sumatra.


    ### INDIGO FLYCATCHER *Eumyias indigo* 14cm


    ![](img/104_1.jpg)


    ![](img/104_3.jpg)


    Morten Strange


    The plumage of this species is mainly a deep indigo-blue colour, especially on
    the upperparts and breast, the blue becoming dense blue-black on the throat and
    face towards the base of the bill. The forehead is tinged white, leading into
    a bluish-white supercilium. The belly is grey, becoming white and then buff at
    the vent. The legs and bill are black. Confined to dense forest, where it often
    mixes with other species low in the canopy and often close to the ground. It is
    a relatively common resident of montane and submontane forests in Java, but less
    so in Sumatra, and is not found in Bali.


    ### LITTLE PIED FLYCATCHER *Ficedula westermanni* 11cm


    ![](img/104_1.jpg)


    ![](img/104_3.jpg)


    Morten Strange


    This species is sexually dimorphic, the male being black and the female brown.
    As a tiny but active bird, and well disguised among foliage, it is noticed more
    by its shrill fluty song. Its upperparts are brown-tinged grey, and its underparts
    bright yellow. The chin and neck are white, and it often shows a whitish loral
    spot. The dark grey-brown tail is tipped black, with a subterminal line of white
    spots. It has a `pi-pi-pi` call. Relatively common at above `1000m`.


    ### HILL BLUE FLYCATCHER *Cyornis banyumas* 15cm


    ![](img/104_1.jpg)


    ![](img/105_3.jpg)


    Chew Yen Fook


    Not only are different races of the Mangrove Blue Flycatcher present in the region,
    other very similar species also occur which can cause confusion. Considering all
    factors together, it is not difficult to separate this one. It has blue upperparts
    and orange underparts, although the female is paler and has a whitish chin and
    a white loral patch. It is most likely to be confused with the Hill Blue Flycatcher
    (*Cyornis banyumas*), which also has a clear melodious, warbling song, but that
    has a pale blue forehead and blackish chin.


    ### MANGROVE FLYCATCHER *Cyornis rufigastra* 15cm


    ![](img/104_1.jpg)


    ![](img/106_1.jpg)


    ### GOLDEN-BELLIED GERYGONE *Gerygone sulphurea* 9cm


    ![](img/104_1.jpg)


    ![](img/106_3.jpg)


    Chew Yen Fook


    Also known as the Flyeater, this is the only Australian fairy-warbler found in
    the region. As a tiny but active bird, and well disguised among foliage, it is
    noticed more by its shrill fluty song. Its upperparts are brown-tinged grey, and
    its underparts bright yellow. The chin and neck are white, and it often shows
    a whitish loral spot. The dark grey-brown tail is tipped black, with a subterminal
    line of white spots.


    ### BLACK-NAPED MONARCH *Hypothymis azurea* 16cm


    ![](img/104_1.jpg)


    ![](img/107_1.jpg)

