    In winter plumage, this rather attractive wader has upperparts mottled grey and
    brown and underparts pale grey to white, with a black bill and dark grey legs.
    In flight, it shows a pale wingbar and rump and, below, a white underwing with
    a large black patch near the body. These features easily separate it from the
    Pacific Golden Plover, which is also slightly smaller and is shorter-billed. The
    Grey Plover breeds in the Arctic and is a winter visitor to the region’s coastal
    areas. Found in small groups on tidal mudflats, where it feeds on marine invertebrates
    and often roosts on isolated shingle spits.


    ### PACIFIC GOLDEN PLOVER `Pluvialis fulva` 25cm


    ![](img/41_1.jpg)


    ![](img/41_3.jpg)


    Chew Yen Fook


    A typical plover in shape, with a robust body, thin neck and largish head with
    a short strong bill. When in the region it is usually in non-breeding plumage,
    having lost the distinctive black face and underparts it had on its breeding grounds.
    It can be identified by its speckled gold, brown and buff upperparts and buff
    breast, face and supercilium. The bill is black and the legs grey. This species
    breeds in north Siberia, north-east Asia and Alaska and is a winter migrant to
    South-east Asia and Australia, stopping off around the coasts of the Sundas. It
    is common on mudflats and open grassland near the coast, where it often congregates
    in flocks.


    ### MALAYSIAN PLOVER `Charadrius peronii` 15cm


    ![](img/41_1.jpg)


    ![](img/42_1.jpg)


    Morten Strange


    One of the less timid waders, this small bird is more likely to be seen alone
    or in small groups, and it is unusual for it to flock with other waders. Like
    many of the small plovers, it is black, brown and white and has a short black
    bill. It is significantly smaller than the Lesser Sand Plover `Charadrius mongolus`
    and Greater Sand Plover and it also has a narrow collar, which is black on males
    and brown on females. Unlike on the Kentish Plover, its narrow black eye-stripe
    is separate from the dark brown ear patches. It is quite common on sandy beaches,
    where it forages along the shoreline.


    ### GREATER SAND PLOVER `Charadrius leschenaultii` 23cm


    ![](img/41_1.jpg)


    ![](img/42_3.jpg)


    B. R. Hughes, Windrush Photos


    This brown, white and grey plover joins with flocks with other waders, especially
    the Lesser Sand Plover `Charadrius mongolus`, on mudflats and sandy estuarine
    beaches, typically probing the ground for invertebrates. It is most easily separated
    from the smaller but otherwise similar Lesser Sand Plover by its more substantial
    bill; apart from the latter, all the other wintering plovers likely to be encountered
    in the area show a breast-band or a collar. Early arrivals, however, may show
    remnants of the breeding plumage and have a russet breast bar. This common winter
    migrant ranges from Africa and Asia through to Australia and New Zealand.


    ### WHIMBREL `Numenius phaeopus` 43cm


    ![](img/41_1.jpg)


    ![](img/43_1.jpg)


    Tilford/Cooke, Nature


    A large, long-legged wader with a fairly long neck and decurved bill. Its plumage
    is heavily mottled brown, with a prominent black crown above a buff eyebrow and
    dark eye-stripe. In flight, it shows a white underwing, rump and lower back. Normally
    quiet, it will often give a trilling call when alarmed. A common visitor to the
    region’s coastline, where it congregates with flocks of other waders on tidal
    mudflats and estuaries. It also occurs on coastal marshes and rough grassland.
    Non-breeding birds are often present throughout the year.


    ### BAR-TALED GODWIT `Limosa lapponica` 37cm


    ![](img/41_1.jpg)


    ![](img/43_3.jpg)


    Tilford/Cooke, Nature


    Both this species and the similar Black-tailed Godwit `Limosa limosa` can be present
    at the same time. They are largish, long-legged waders with a fairly straight
    and long bill. Both have greyish-brown upperparts, heavily mottled on Bar-tailed,
    which also has an obviously barred tail and slightly heavier streaking on the
    whitish breast. It is generally found alone, feeding on coastal mudflats and along
    muddy river banks upstream, but occasionally it visits surrounding marshland and
    paddyfields. This fairly common visitor to Sumatra is not nearly common in Java
    and Bali. Those seen in the region breed in north-east Asia, and are usually in
    non-breeding plumage.


    ### WOOD SANDPIPER `Tringa glareola` 20cm


    ![](img/41_1.jpg)


    ![](img/44_1.jpg)


    Chew Yen Fook


    This is quite a noisy species, frequently uttering its `chee-chee` call. Its greyish-brown
    upperparts have contrasting black and white speckling, and its underparts are
    white, with a greyish breast; the forehead is buff, leading into a narrow eyebrow.
    It has long yellowish-green legs. In flight, the white rump and underwing are
    obvious; there is no wingbar. Breeds in north Europe and north Asia, wintering
    as far south as Australia. A common visitor throughout the region, seen in small
    groups, wet muddy areas, not only on mudflats and mangroves but also in marshland
    and paddyfields.


    ### COMMON SANDPIPER `Actitis hypoleucos` 20cm


    ![](img/41_1.jpg)


    ![](img/44_3.jpg)


    Tilford/Cooke, Nature


    This is a very ‘busy’ feeder with a constant tail-bobbing action, and when disturbed
    it often flies a short distance and continues, seemingly unperturbed. It has brown
    upperparts and white underparts, with a brown patch extending down from the neck
    to the breast side. In flight, its white and brown barred outer feathers are evident,
    as is the white wingbar. It is most likely to be found alone, feeding on coastal
    mudflats and along muddy river banks, but occasionally visits upstream. A very
    common migrant from Eurasia, seen throughout the year.


    ### SANDERLING `Calidris alba` 20cm


    ![](img/41_1.jpg)


    ![](img/45_1.jpg)


    Tilford/Cooke, Nature


    This highly active wader can often be seen following the retreating waves as it
    feeds on marine invertebrates thrown up on the beach. It usually occurs in small
    groups. In non-breeding plumage, it has pale grey upperparts and white underparts,
    with black bill and feet. A black shoulder patch helps to distinguish it from
    other waders. It shows black primaries and a prominent white wingbar in flight.
    Sanderling breeds in the Arctic and occurs as a non-breeding migrant throughout
    the region, but is not common. Found almost entirely on sandy beaches.


    ### LONG-TOED STINT `Calidris subminuta` 14cm


    ![](img/41_1.jpg)


    ![](img/45_3.jpg)


    Ray Tipper


    This little wader has a relatively long neck and legs compared with others of
    its size. In non-breeding plumage, it has heavily streaked brownish-grey upperparts,
    with a grey-brown crown and bold white eyebrow. The underparts are white, the
    breast streaked brownish-grey. In flight, the centre of the rump and tail appear
    black and the outer tail buff. A regular, at times numerous, passage migrant from
    Siberia, passing through the Greater Sundas on its way to New Guinea or Australia;
    juveniles occasionally stay through the summer. It usually occurs on coastal mudflats
    and estuaries, but frequently inland on muddy marshland and rice paddies.


    ### BLACK-NAPED TERN `Sterna sumatrana` 30cm


    ![](img/46_2.jpg)


    ![](img/46_1.jpg)


    Kevin Carlson, Windrush Photos


    Apart from the conspicuous black band through the eye and around the nape and
    its very pale grey upperparts, this small tern appears very white. In flight,
    its very long forked tail is obvious. The legs are black, and the black bill is
    tipped with yellow. Juveniles, however, have grey-brown mottled plumage over the
    upperparts and on the crown, with black mottling on the nape; the bill-tip is
    also brownish and the tail unforked. This quite common resident breeds on offshore
    rocky islands, and is generally seen in the company of other terns on sandy shorelines.


    ### BRIDLED TERN `Onychoprion anaethetus` 37cm


    ![](img/46_2.jpg)


    ![](img/46_3.jpg)


    Arnoud B. van den Berg, Windrush Photos

