  raw: 'Of the region’s 12 different sunbirds, only Brown-throated and Olive-backed
    occur in Bali. They are the most common, found throughout the region, and are
    usually seen in open plantations, gardens, coastal scrub and mangroves. Identified
    by their bright coloration and long curved bill, they usually hover in front of
    flowers in search of nectar. The male Brown-throated has a yellow breast, belly
    and vent, and a brown throat often fringed with dark purple. The face and chin
    are olive and the upperparts are iridescent olive-green, blending into a dark
    bluish head with a green sheen. The female is olive-green above and yellowish
    below.


    **RUBY-CHEEKED SUNBIRD** *Chalcoparia singalensis* 10cm


    ![](img/110_2.jpg)


    ![](img/113_1.jpg)


    Morten Strange


    Although this small sunbird is brightly coloured, its iridescence when in the
    shade is not often visible and males even appear blackish. In bright light, however,
    the male’s iridescent dark green upperparts and crown are brilliant and the ear-coverts
    reveal a deep red. The throat is orange-brown, blending into a yellow belly. Females
    (depicted here) are duller, with olive-green upperparts and pale orange and yellow
    underparts. The bill and legs are black, the legs often with a greenish tinge.
    This bird of forest edge and sparse woodland occurs alone and in pairs, often
    in the company of other species.


    **WHITE-FLANKED SUNBIRD** *Aethopyga eximia* 13cm


    ![](img/110_2.jpg)


    ![](img/113_3.jpg)


    This colourful sunbird is aptly named after the cluster of soft white feathers
    on its flanks. Apart from the rather drab olive and black wings, longish blue-green
    tail and olive underparts, the male has a bright yellow rump and red throat and
    upper breast, the last crossed by a bluish-green necklace-like band, and his crown
    is iridescent purple. Except for the white flanks, the shorter-tailed female is
    dull olive, a little lighter on the throat and vent. This species is endemic to
    Java, where it is resident in mountain forests at forest edges and alpine scrub,
    and is particularly fond of flowering trees.


    **COPPER-THROATED SUNBIRD** *Leptocoma calcostetha* 13cm


    ![](img/110_2.jpg)


    ![](img/114_1.jpg)


    Chew Yen Fook


    Males dark, even appearing blackish. Upperparts have green iridescence and the
    breast and malar stripe purple. The throat and upper breast show a dark coppery-coloured
    gleam, while the flanks are yellow and the tail bluish-black. Separated from the
    smaller Purple-throated Sunbird by lacking the red breast but having yellow flanks.
    Females have a greyish head, dark olive-green to brown upperparts and black tail;
    their undertail-coverts and throat are pale grey, blending into a greenish-yellow
    breast. A mostly lowland resident in Java and Sumatra, found in coastal scrub,
    woodland and mangroves.


    **OLIVE-BACKED SUNBIRD** *Cinnyris jugularis* 10cm


    ![](img/110_2.jpg)


    ![](img/114_3.jpg)


    Chew Yen Fook


    A very active and often noisy little bird, either flitting between flowers or
    hovering to extract nectar. It also feeds partly on insects and pollen. Quite
    small, with a long, curved black bill, it has olive-green upperparts with darker
    wings and black tail. The underparts are bright yellow, with white showing below
    the tail. Breeding males have a black chin and upper breast with a purple iridescence.
    The nest, a wonderfully woven structure of fine grasses and hair-like materials,
    is suspended precariously from the end of a branch or among foliage. It is found
    throughout the region, particularly in lowland areas.


    **TEMMINCK’S SUNBIRD** *Aethopyga temminckii* male 13cm, female 10cm


    ![](img/110_2.jpg)


    ![](img/115_2.jpg)


    Chew Yen Fook


    This bright red sunbird has a relatively long and slightly notched red tail. Its
    upperparts, throat and breast are crimson-red, apart from the iridescent purple
    eyebrow which extends around the nape and the malar stripe. The uppertail coverts
    are also purple adjacent to a bright yellow rump patch. It has greyish-white underparts.
    Females are smaller with a shorter reddishbrown tail. They are dark olive-green
    above, with greyish head, wings tinged brown, and paler and yellowish below. It
    is an occasional bird of the more open montane forests of Sumatra and Borneo.


    **JAVAN SUNBIRD** *Aethopyga mystacalis* 12cm


    ![](img/110_2.jpg)


    ![](img/115_3.jpg)


    Now considered a separate species endemic to Java, this little sunbird, along
    with Temminck’s Sunbird (*Aethopyga temminckii*), was previously considered to
    be a subspecies of the Crimson Sunbird (*Aethopyga siparaja*). It also goes by
    the name of Violet-tailed Sunbird. The male has a bright crimson head, breast
    and back, yellow rump, and long iridescent purple tail. The crown and malar stripe
    are also purplish, the wings olive-green and the underparts whitish. The female,
    very much smaller and with only a short tail, is dull olive-grey. It inhabits
    forests and forest edges, usually in pairs, and is particularly attracted to mistletoe
    flowers.


    **LITTLE SPIDERHUNTER** *Arachnothera longirostra* 15cm


    ![](img/110_2.jpg)


    ![](img/116_1.jpg)


    An inconspicuous little olive and yellow bird with a long, curved bill which is
    black above and grey below. The upperparts are drab olive-green and the underparts
    brilliant yellow. It can be separated from all similar species by its whitish
    throat. It inhabits gardens, plantations and logged forests, where it can often
    be seen moving rapidly across open areas as it searches for nectar, in particular
    from the flowers of banana and ginger. Common throughout the region, especially
    in lowland and hill forests, and in some areas way into the mountains.


    **LONG-BILLED SPIDERHUNTER** *Arachnothera robusta* 21cm


    ![](img/110_2.jpg)


    ![](img/116_3.jpg)


    Chew Yen Fook


    This very long-billed and largish spiderhunter is normally a solitary bird, even
    to the extent of driving away all other spiderhunters that encroach on its territory.
    It has a habit of perching high on exposed branches and uttering its repeated
    and uninteresting call, *chew-lewt, chew-lewt.* In flight, it gives a simple *chit-chit*
    call. Its upperparts are olive and its underparts yellow, with the breast and
    throat streaked with olive-green. Separated from the Spectacled Spiderhunter (*Arachnothera
    flavigaster*) and the Yellow-eared Spiderhunter by lacking yellow ear patches
    or eye-rings. A resident of the lower hill forests of Java and Sumatra.


    **YELLOW-EARED SPIDERHUNTER** *Arachnothera chrysogenys* 17cm


    ![](img/110_2.jpg)


    ![](img/117_1.jpg)


    The Yellow-eared is another sombrely plumaged spiderhunter which has olive-green
    upperparts and is olive-grey below, with moderate streaking on the breast. The
    vent is yellow. It has a largish yellow cheek patch and narrow and often incomplete
    eye-ring. It is not found in Bali, but in Sumatra it may be confused with the
    Spectacled Spiderhunter (*Arachnothera flavigaster*), which is, however, a more
    robust bird with a shorter bill and broad yellow eye-ring. It is usually found
    in lowland forest, along forest edges and in gardens.


    **GREY-BREASTED SPIDERHUNTER** *Arachnothera affinis* 17cm


    ![](img/110_2.jpg)


    ![](img/117_3.jpg)


    Chew Yen Fook


    More likely to be encountered around banana thickets and high in the tops of flowering
    trees, this species’ most significant feature is the long, decurved bill. Its
    plumage is fairly dull, being olive-green above, with fine black streaking on
    the crown, and olive-tinged grey below with rather obscure black streaks. Tail
    and wings tend to be blacker. The subspecies in Java and Bali (*A. a. affinis*)
    has a pale yellow front edge to the wing and a yellow tinge to the breast. Sumatran
    birds (*A. a. concolor*) have a duller, more washed-out appearance. A common resident
    of coastal and lowland woodland and thickets of the region.


    **ORIENTAL WHITE-EYE** *Zosterops palpebrosus* 11cm


    ![](img/118_2.jpg)


