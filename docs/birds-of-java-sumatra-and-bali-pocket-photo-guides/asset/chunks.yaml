  trans: "\n该物种的不同亚种在羽毛上存在许多细微变异，特别是在冬羽，在野外很难识别许多个体。该种类具有典型的鸻形状和行为，背部为橄榄褐色或橄绿色，腹部为黄色。常见的亚种\
    \ `M. t. simillima` 具有灰色冠顶、黄色喉部和白色眉纹，任何变异都可能与其它更稀有的亚种有关。幼鸟的背部较褐，腹部较白。它是来自亚洲的常见冬季访客，主要分布在沿海低地，特别是牧场、稻田和干涸的沼泽地。\n\
    \n# 灰鸻 *Motacilla cinerea* 19cm\n\n![](img/78_2.jpg)\n\n![](img/80_1.jpg)\n\n\
    Tilford/Cooke, TC Nature\n\n在形状和摇尾行为上都是典型的鸻，在岩石和流流水间奔跑跳跃。它的飞行呈明显的波浪状。它有灰色的冠顶和背部，腹部和尾部为亮黄色。下颏和眼纹是白色的，耳部羽罩呈灰色。幼鸟的腹部颜色浅得多。极长的黑色尾巴边缘有白色。喙为深褐色，脚部呈粉灰色。主要是来自高纬度地区的冬季迁徙鸟，喜好从海岸到山山的石石河床、溪流和湿润草甸。\n\
    \n# 理查德���� *Anthus richardi* 18cm\n\n![](img/78_2.jpg)\n\n![](img/80_3.jpg)\n\
    \nChew Yen Fook\n\n该地区唯一的留鸟����。在地面上，它看起来像一种浅色的长腿鸟，经常在草地上到处奔跑，有时又非常静止地保持直立姿势。它背部为暖褐色，带有深色条纹，腹部为肉褐色，上胸部有细条纹。它有浅色的色的尾部和上尾覆盖羽，以及明显的肉黄褐色眉毛。飞行羽为深褐色，边缘为肉黄褐色。飞行时，深褐色尾巴的白色外羽非常明显。它们被开阔的草地、耕地、旱稻田和路边缘所吸引。从海岸到山脉分布广泛且数量丰富。\n\
    \n# 小绣蜜鸟 *Pericrocotus cinnamomeus* 15cm\n\n![](img/81_2.jpg)\n\n![](img/81_1.jpg)\n\
    \nDavid Tipling, Windrush Photos\n\n与其他绣蜜鸟一样，这种鸟相当群群性，成小群在树冠间移动，在寻找昆虫和成熟果实时不断互相鸣叫。头部、背部和上背为灰色，尾部、腹部和外尾羽为橙色。长长的中央尾羽为黑色，黑色翅膀上有明显的黄橙色斑。雄性有黑色喉部和红色到橙色的腹部；雌性颜色较浅，胸部白色。它们栖于较开阔的低地森林，以及耕地、花园和红树林周围的树丛。在爪哇和巴厘岛分布广泛。\n\
    \n# 火红绣蜜鸟 *Pericrocotus flammeus* 19cm\n\n![](img/81_2.jpg)\n\n![](img/81_3.jpg)\n\
    \nTilford/Cooke, TC Nature\n\n一种栖林鸟，成小群在树冠间觅食。雄性的冠顶和背部为带有蓝光光的漆黑色，腹部、尾部和尾外缘为红色。主要的黑色翅膀上有两个明显的红斑。雌性有灰色冠顶和上背部，腹部和外尾为黄色到橙色；黄色的腹部一直到下颏、额头和耳部羽罩，但留有灰色眼纹的迹象。她有两个黄色的翅斑，尾部为灰绿色。在当地整个地区都很常见。\n\
    \n# 绿头吊喉 *Pycnonotus zeylanicus* 28cm\n\n![](img/82_1.jpg)\n\n![](img/82_2.jpg)\n\
    \nChew Yen Fook\n\n它清脆悦的歌声使得该物种在印度尼西亚作为笼鸟广受欢迎，鸟类从苏门答腊出口到爪哇和巴厘岛。它是最大的吊喉之一，可以通过其金草色的冠顶和耳部羽罩以及黑色的颊纹来识别。背部、翅膀和尾巴为绿褐色。它还有一条细的黑色眼纹，白色的下颏和喉部、灰色的胸和腹部，以及黄色的尾门，上胸和背部有少量白色条纹。曾是低地和山地森林（尤其是河流栖息地）的常见鸟，现在变得稀少。\n\
    \n# 黑头吊喉 *Pycnonotus atriceps* 17cm\n\n![](img/82_1.jpg)\n\n![](img/82_3.jpg)\n\
    \n通常独居，但也与其他物种成小群觅食，这种吊喉可以通过其主要的黄色身体羽毛和光泽的黑色头部及喉部来识别。上部为带褐色的黄绿色，腹部稍亮。翅膀为黑色，尾巴为黄色并带有一条黑色亚端带。存在一种稀有色型，黄色区域被暗灰色取代，但它有白色的尾门和尾下羽以及白色尾端。它更多出现在森林边缘、河流和沿海灌木丛中，通常沿着路边和次生林。在苏门答腊和爪哇的低地地区相当常见，但在巴厘岛少得多。\n\
    \n# 黑冠吊喉 *Pycnonotus melanicterus* 18cm\n\n![](img/82_1.jpg)\n\n![](img/83_2.jpg)\n\
    \n通常独居，但也与其他物种成小群觅食，这种吊喉可以通过其主要的黄色身体羽毛和光泽的黑色头部及喉部来识别。上部为带褐色的黄绿色，腹部稍亮。翅膀为黑色，尾巴为黄色并带有一条黑色亚端带。存在一种稀有色型，黄色区域被暗灰色取代，但它有白色的尾门和尾下羽以及白色尾端。它更多出现在森林边缘、河流和沿海灌木丛中，通常沿着路边和次生林。在苏门答腊和爪哇的低地地区相当常见，但在巴厘岛少得多。（等等，让我重新对齐提供的黑冠吊喉特定文本。）\n\
