- fmt: '

    In line with other books in this series, this one uses symbols as a guide to families
    and family groups to which the birds belong; a key to these symbols is shown opposite.
    Photographs depict the bird in its commonly seen form where possible, and variations
    are well described in the text. The order of the 236 species covered generally
    follows the Peters sequence adopted by Paul Andrews in `The Birds of Indonesia:
    A checklist`. Vernacular and scientific names are generally those used by `T.
    Inskipp`, `N. Lindsey` and `W. Duckworth` in `An Annotated Checklist of the Birds
    of the Oriental Region`. Other checklists exist, and the process of revision based
    on more recent scientific knowledge will continue. It must therefore be expected
    that not only will common names vary, but so too will the scientific. Ultimately,
    the scientific names prove more reliable.


    Each species description includes a common name followed by its scientific name,
    and then the species’ overall length from the tip of the bill to the end of the
    tail. The remaining description follows no particular order but provides most
    of the clues necessary for a fairly reliable identification. Only for a few species
    has any attempt been made to describe calls and song, as it is felt that written
    descriptions lack meaning without the experience of hearing the actual sound.
    Nevertheless, the value of sound must not be underestimated. In many cases, it
    can be the only determining factor in successful identification. Much of the description
    is necessarily brief and written in a semi-technical language adopted by most
    bird books, but for easy understanding many of the technical terms are explained
    in the following glossary, and the illustration showing bird topography (below).


    ![](img/6_1.jpg)


    ## KEY TO COLOURED TABS


    ![](img/7_1.jpg)


    ## GLOSSARY


    **axillaries**: Feathers of the `armpit`


    **canopy**: Unbroken layer of branches and foliage at tops of trees in forest


    **cere**: Bare fleshy or waxy protuberance at base of upper mandible, including
    nostrils


    **chin-stripe**: A marking around area of chin


    **coverts**: The small feathers at base of quill feathers forming main flight
    surfaces of wing and tail


    **dimorphic**: Occurring in two genetically determined plumage forms


    **echolocation**: Navigation by ultra-sound radar


    **endemic**: Indigenous species restricted to a particular area


    **eyebrow**: Contrasting line above eye (supercilium)


    **eye-stripe**: Contrasting line through eye


    **flank**: Side of the body


    **frontal shield**: Skin or hard unfeathered area on forehead which extends to
    bill


    **fulvous**: Pale brownish-yellow


    **Greater Sundas**: Borneo, Sumatra, Java and Bali, including offshore islands


    **gregarious**: Frequently occurring in groups


    **gular pouch**: Bare, fleshy patch of skin around neck of cormorants and hornbills


    **gunung**: Indonesian name for mountain


    **hackles**: Long, narrow and often pendulous feathers around neck


    **lores**: Area of feathers between bill and eye


    **mandible**: Upper or lower half of bill


    **malar**: In area between base of bill and side of throat


    **mesial**: Dividing down the middle


    **migrant**: Non-resident traveller


    **montane**: Relating to mountain habitats usually above 900m


    **necklace**: A line of markings around front of neck


    **Nusa Tenggara**: Area covered by the islands of Lombok, Sumbawa, Sumba, Flores
    and Timor


    **orbital ring**: Unfeathered bare ring around eye


    **primaries**: The main outer flight feathers (show as longest part of folded
    wing)


    **primary forest**: Original natural forest


    **race**: Another name for subspecies


    **rackets**: Paddle-shaped ends to tail feathers


    **resident**: Remaining in a local area throughout year


    **roost**: Resting or sleeping place


    **secondaries**: The inner flight feathers on rear half of wing


    **secondary forest**: New forest replacing primary forest


    **spatulate**: Having thickened rounded ends


    **speculum**: Contrasting iridescent patch on a duck’s wing


    **subspecies**: A population which is morphologically different from other populations
    of same species


    **Sundas**: Region covered by the Greater and Lesser Sundas and Sulawesi


    **supercilium**: A stripe above eye (eyebrow)


    **terminal**: At the end or tip


    **underparts**: Undersurface of body from throat to undertail-coverts


    **undertail-coverts**: Small feathers below tail covering bases of tail feathers


    **underwing-coverts**: Small underwing feathers covering bases of primaries and
    secondaries


    **upperparts**: Upper surface of body


    **vent**: Area around anus, including undertail-coverts


    **wattles**: Brightly coloured bare skin hanging from head or neck


    **wingbar**: A visible line of colour at tips of wing-coverts


    **wing-coverts**: Small feathers on wing covering bases of primaries and secondaries


    ## THE REGION


    Java, Sumatra and Bali lie along the edge of the South-east Asian tectonic plate,
    where it rides over the Australian-Indian plate generating intense geological
    activity. A line of volcanoes, some still active, others dormant, forms a spine
    along the island chain. In Sumatra these create the Barisan mountain range, stretching
    the entire length of the island, and falling precipitously into the depths of
    the Indian Ocean in the west; in the east it drops more gently, giving rise to
    large swampy areas before reaching the Sunda Sea. In Java, the mountains arise
    in isolation from alluvial plains and, as in east Sumatra, slope gently northwards
    to the Sunda Sea.


    At one time Bali was connected by landbridge to Java, but today it is separated
    by some 3km of turbulent waters, renowned for their fierce currents. Not surprisingly,
    the fauna and flora of Bali show close similarities to those of eastern Java.
    Sumatra, however, shows closer affinities with Borneo than with Java.


    The fragmentation of the landmasses combined with geological and climatic activity
    has resulted in the formation of many habitats, which in turn support a rich diversity
    of wildlife. This includes many endemic species: those confined to a single region
    or smaller area and found nowhere else.


    Java and Bali are among the densely populated regions on earth, and the destruction
    of their remaining wildlife habitats is a matter of serious concern. Only on remote
    mountain slopes can one find significant areas of natural forest. A few patches
    of lowland forest survive in National Parks and Nature Reserves. Sumatra, with
    only a tenth of the population density, is a little better off, but the growth
    of the agriculture, plantation and forestry sectors are responsible for increasing
    forest destruction there.


    ## THE FAUNA


    We might expect that these landmasses, which were at various times joined to mainland
    Asia, would have similar flora and fauna. As the various islands were not all
    separated simultaneously, however, and since subsequent local climatic conditions
    have varied, the composition of the avian fauna differs significantly from one
    island to another. Perhaps the most dramatic changes have been caused more recently,
    by man and his destruction of the lowland. There are ample records dating back
    as far as 1657, and it is quite clear from the reports of the early 18th-century
    explorers who founded Indonesian ornithology that birds were far more plentiful
    then.


    ## WHEN AND WHERE TO FIND BIRDS


    As the region lies close to the equator, the climate is hot and humid. The monsoon
    weather patterns of the region are characterized by wet and dry seasons, which
    differ little in temperature. Even so, the birds show distinct breeding cycles.
    During the wet season, from October to March, large numbers of wintering migrants
    fly down from the north, with a smaller number of Australian species appearing
    during the dry season.

