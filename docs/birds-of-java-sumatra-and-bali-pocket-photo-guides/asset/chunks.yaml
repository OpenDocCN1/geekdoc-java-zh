- fmt: "\nThis is the common kingfisher seen from Eurasia all the way to New Guinea.\
    \ Upperparts are a shiny bright blue-green, with paler blue uppertail-coverts\
    \ and a small patch in the centre of the back. The underparts are rufous, as are\
    \ the ear-coverts. There is a white stripe on the side of the neck. Feet are red\
    \ and the bill black. In flight, it has a drawn-out high-pitched *tseeep, tseeep*\
    \ call. Frequents lowland open country with freshwater mangroves, rivers and lakes.\
    \ Uses an overhanging branch or rock beside water as a perch from which to dive\
    \ for fish. A common visitor to Sumatra, but less so to Java and Bali.\n\n###\
    \ BLUE-EARED KINGFISHER *Alcedo meninting* 15cm\n\n![](img/63_2.jpg)\n\n![](img/63_3.jpg)\n\
    \nThis is the woodland counterpart of the Common Kingfisher, and is very similar\
    \ in its behaviour, moving between waterside perches in rapid flight. It dives\
    \ into water to catch fish, which it kills by bashing it on the perch before swallowing\
    \ it whole head-first. The Blue-eared has a more contrasty appearance than the\
    \ Common Kingfisher, its upperparts being a darker but shinier blue and its underparts\
    \ a bright orange-red. The ear-coverts are blue. It frequents forest rivers, streams\
    \ and lakes, and occasionally estuarine habitat, throughout the lowlands of Sumatra,\
    \ Java and Bali.\n\n### SMALL BLUE KINGFISHER *Alcedo coerulescens* 14cm\n\n![](img/63_2.jpg)\n\
    \n![](img/64_2.jpg)\n\nMorten Strange\n\nAlso known as the Small Blue Kingfisher,\
    \ this tiny species is easily identified. The upperparts are a brilliant pale\
    \ greenish-blue, with the crown, wing-coverts and a neck patch barred with dark\
    \ blue; it also has a pale greenish-blue band across its upper breast. The throat,\
    \ lores and belly are white. In typical kingfisher fashion, it perches on prominent\
    \ places above water, waiting to dive in on its prey. It is quite common on estuaries\
    \ and in the coastal mangroves and marshland of Bali and Java, reaching west into\
    \ southern Sumatra. A good place to see many of the kingfishers is around the\
    \ numerous coastal fish-farms.\n\n### BLACK-BACKED KINGFISHER *Ceyx erithaca*\
    \ 14cm\n\n![](img/63_2.jpg)\n\n![](img/64_3.jpg)\n\nMorten Strange\n\nThis brilliantly\
    \ coloured little kingfisher has adapted to feeding on insect prey and lives in\
    \ forests often some distance from water. It has a rapid low flight, during which\
    \ it often emits a very high-pitched whistle. It hunts from a perch, and often\
    \ snatches spiders from their webs while in flight. It has distinctive brilliant\
    \ yellow underparts and bluish-black back and wing-coverts. The crown and tail\
    \ are red, as are the bill and feet. There are usually small patches of blue in\
    \ front of the eye and behind the ear-coverts. Widespread in suitable habitat\
    \ throughout the region, but not common.\n\n### STORK-BILLED KINGFISHER *Pelargopsis\
    \ capensis* 35cm\n\n![](img/63_2.jpg)\n\n![](img/65_1.jpg)\n\nThis kingfisher,\
    \ too, being the largest encountered in the region and having an enormous red\
    \ bill, is easy to identify. The back, wings and tail are blue-green and the underparts\
    \ pinkish-orange. The head is brown, becoming lighter around the neck. It has\
    \ short red legs. It inhabits coastal mangroves and lowland rivers and marshland,\
    \ as well as agricultural land, paddyfields and woodland adjacent to rivers. It\
    \ feeds on fish, crabs and amphibians. Once recorded throughout the area, it is\
    \ now an uncommon resident, and possibly extinct in Bali. Farming practices, pesticides\
    \ and disturbance are thought to be the main reasons for its decline.\n\n### WHITE-THROATED\
    \ KINGFISHER *Halcyon smyrnensis* 27cm\n\n![](img/63_2.jpg)\n\n![](img/65_3.jpg)\n\
    \nRay Tipper\n\nThe white throat and ‘bib’ contrasting with the chocolate-brown\
    \ head and underparts are distinguishing features for this large kingfisher. The\
    \ upperparts, tail and upper surfaces of the wings are iridescent mid-blue, and\
    \ there is a patch of brown on the upperwing-coverts. A noisy loud screaming call,\
    \ *kee-kee-kee-kee*, emitted while perched or in flight, announces the bird’s\
    \ presence as it hunts over rivers and ponds and even along the coast. Found mainly\
    \ in Sumatra, with a few records in West Java, this kingfisher inhabits mainly\
    \ lowland open areas near to water.\n\n### JAVAN KINGFISHER *Halcyon cyanoventris*\
    \ 25cm\n\n![](img/63_2.jpg)\n\n![](img/66_1.jpg)\n\nThis dark-looking kingfisher\
    \ has adapted well to a diet of insects and terrestrial prey, and is not reliant\
    \ on fishing for its survival. It can often be seen on an isolated perch in open\
    \ grassland, waiting for insects to come into range, although it remains near\
    \ water where prey items are more abundant. It is dark brown on the head, with\
    \ lighter brown collar and upper breast. The belly and hindcollar are purplish-blue,\
    \ and the back and wing-coverts dark purple. Flight feathers and tail are bright\
    \ blue. The white wing patches are particularly conspicuous in flight. Both bill\
    \ and feet are red. Endemic to lowlands in Java and Bali.\n\n### COLLARED KINGFISHER\
    \ *Todiramphus chloris* 24cm\n\n![](img/63_2.jpg)\n\n![](img/66_3.jpg)\n\nA very\
    \ familiar kingfisher, this species is common throughout the region. Its harsh\
    \ call announces its presence. Overall, it appears dark bluish-black with an upright\
    \ stance, with a large head and solid orange-red bill. In flight, two circular\
    \ light blue contrasting patches on the underwing-coverts are very evident, and\
    \ these give the bird its English name. Although widespread, it is not common.\n\
    \n### CHESTNUT-HEADED BEE-EATER *Merops leschenaulti* 20cm\n\n![](img/63_2.jpg)\n\
    \n![](img/67_2.jpg)\n\nLike all bee-eaters, this species congregates in parties\
    \ which wander around open country. It has a chestnut crown and mantle, a yellow\
    \ throat and below this a chestnut and black band. Its rump is green. The tail\
    \ is square-ended and lacks the streamers of similar species. Quite common in\
    \ open woodland, particularly in the lowlands.\n\n### BLUE-THROATED BEE-EATER\
    \ *Merops viridis* 27cm\n\n![](img/63_2.jpg)\n\n![](img/67_3.jpg)\n\nAlthough\
    \ gregarious and delightfully aerobatic, this bee-eater appears a little less\
    \ inclined to hawk its prey like other bee-eaters, preferring to wait on exposed\
    \ perches and making only short dashes to catch insects. Its distinguishing features\
    \ are its blue throat and solid black eye-stripe and the male’s rich brown cap\
    \ and mantle. Its elongated central tail feathers are blue, as are the outer tail,\
    \ vent and rump. The back, wings and breast are light green. \n\n### DOLLARBIRD\
    \ *Eurystomus orientalis* 30cm\n\n![](img/68_1.jpg)\n\n![](img/68_2.jpg)\n\nThis\
    \ is the only member of the roller family to occur in the region. It is usually\
    \ seen in ones and twos, hunting from exposed perches; it dives on its insect\
    \ prey, either in the air or on the ground. It is frequently mobbed by other birds\
    \ because of its crow-like appearance. Overall, it appears dark bluish-black with\
    \ an upright stance, with a large head and solid orange-red bill. In flight, two\
    \ circular light blue contrasting patches on the underwing-coverts are very evident,\
    \ and these give the bird its English name. Although widespread, it is not common.\n\
    \n### BUSHY-CRESTED HORNBILL *Anorrhinus galeritus* 70cm\n\n![](img/68_1.jpg)\n\
    \n![](img/68_3.jpg)\n"
