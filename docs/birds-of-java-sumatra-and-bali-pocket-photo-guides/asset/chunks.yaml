    **YELLOW-VENTED BULBUL** *Pycnonotus goiavier* 20cm


    ![](img/82_1.jpg)


    ![](img/84_1.jpg)


    Chew Yen Fook


    This quite gregarious bird not only forages with other bulbuls but also roosts
    communally. It is frequently seen picking over fallen fruit and taking the occasional
    insect. It has a bright yellow vent, as its name implies, but is otherwise relatively
    sombre in plumage. The upperparts and tail are brown and the underparts white.
    The crown is dark brown and the face white, with black lores. It has pinkish-grey
    feet and a black bill. Common throughout the region, preferring a more open habitat
    and especially attracted to cultivation, plantations, gardens and parks, even
    in towns.


    **OLIVE-WINGED BULBUL** *Pycnonotus plumosus* 20cm


    ![](img/82_1.jpg)


    ![](img/84_3.jpg)


    Morten Strange


    Like several other bulbuls, this one has rather dull, nondescript brownish-grey
    plumage with olive-coloured wings. It is greener and larger than the similar Cream-vented
    Bulbul. The throat is pale buff and the undertail-coverts pale brown. The ear-coverts
    are brown, streaked with white. It has red eyes, a black bill and brown legs.
    It keeps to the treetops as it forages for ripe fruit and insects, occasionally
    uttering a short, soft chirping song. Found through Sumatra and West and Central
