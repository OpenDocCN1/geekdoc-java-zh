  trans: '

    这种大嘴鹃的尾巴超过了鸟体总长度的一半，背部呈暗绿色，末端带有栗褐色，腹部为栗褐色。背部也是暗绿色，头冠和颈部为灰色。眼睛周围有一块裸露的红色皮肤斑块。苏门腊亚种的喉部和脸颊为灰色，下腹有一块黑斑。其他岛屿亚种也存在羽毛差异。这种当地常见的低地鸟通常出现在森林丛丛中，经常可以观察到它们静止地栖息在小树顶端。


    # 大嘴留 *Centropus sinensis* 52cm


    ![](img/56_2.jpg)


    ![](img/58_1.jpg)


    朱锦福 (Chew Yen Fook)


    尽管经常出现在地面上，但这种巨大的、黑如乌鸦、翅膀呈栗褐色的鸟更有可能在小树和灌木丛蹒跚走动，它们可以躲在茂密的植被中。喙和脚是黑色的。它那非常诡异、传远且低沉的叫声以一系列
    `poop, poop, poop` 的声音开始，节奏加快然后再次减慢，但偶尔会发出一连四个深沉单调的 `poop, poop, poop, poop` 调。在早晨更容易听到。它是整个巽答腊群岛的居民，偏好森林边缘、红树林、草岸和次生灌丛。


    # 小嘴留 *Centropus bengalensis* 40cm


    ![](img/56_2.jpg)


    ![](img/58_3.jpg)


    Morten Strange


    与大嘴留的外观非常相似，该物种体型较小，羽毛颜色较暗，而且在该地区更为常见。它的飞行能力较弱，仅由短促、费力的扑翅组成，在植被上方低空飞行以寻找昆虫。在地面上时跳跃，在树上和木丛中攀爬。和其他嘴鹃一样，除了栗色的背和翅膀外，羽毛都是黑色的；喙和脚也是黑色的。特别发现于低地，它们经常出没于开阔草地，特别是密集的芒草（alang-alang）草地和沼泽。


    # 亚洲林鴴 *Otus bakkamoena* 20cm


    ![](img/59_1.jpg)


    ![](img/59_2.jpg)


    Tilford/Cooke, TC Nature


    这种常见的猫头鹰经常可以在城镇建筑区的树木和显眼的栖息处看到捕食昆虫和小型啮齿动物。雄性规律性的柔和 `whoop` 声，和雌性的 `weeoo` 和 `plop`
    声经常交替出现，形成连续的二重唱。识别并不简单，因为该物种有几种颜色形态。它可以是暗红褐色到灰褐色，背部有黄褐色和黑色的斑点与斑块；腹部颜色较浅，并有黑色条纹。它有一圈浅沙色的“颈圈”。喙和脚是黄色的。发现于
    1500 米以下的几乎任何地方，可能是遇到的最常见的猫头鹰。


    # 婆纹雕鴴 *Bubo sumatranus* 45cm


    ![](img/59_1.jpg)


    ![](img/59_3.jpg)


    朱锦福 (Chew Yen Fook)


    这是该地区发现较大的猫头鹰之一，这种壮丽的鸟不幸很少被看到，它们局限于低地森林，只在黄昏时分从白天的栖息地出来。通过其巨大的体型、明显的水平耳羽以及带有粗黑横纹的浅灰色腹部来识别。背部为深褐色，点有黄色的斑点和横纹。眼睛是棕色的，脚和喙是黄色。它有很多异常的叫声，当地人通常将其归于神秘的神魔。它熟悉的叫声是巨大的
    `whooa-hoo, whooa-hoo`，随后是一声深沉的呻吟。


    # 鱼鴱 *Ketupa ketupu* 45cm


    ![](img/59_1.jpg)


    ![](img/60_2.jpg)


    这种大型猫头鹰外表有趣，有着亮黄色的眼睛和明显的水平耳羽。背部是棕色的，带有黑色和黄色的条纹，腹部是明亮的栗黄色，带有窄的黑色条纹。它有白色的眉毛、灰色的喙和黄色的脚。它是一种主要是夜性的物种，白天偏于躲在树间。晚上，它们会离开森林进入公园、稻田，通常沿着路边。它们从未远离水源，依靠水域捕食青蛙、鱼和其他水生生物。


    # 斑纹林�鸮 *Strix seloputo* 47cm


    ![](img/59_1.jpg)


    ![](img/60_3.jpg)


    由于是夜性的，这种鸟很少被看到，但它的存在通过低沉的咕噜声和响亮的 `hoo-hoo-hoo` 声暴露出来。它是一种大型猫头鹰，形状与婆纹雕鴴相似，但没有耳羽。它的脸盘是浅栗色的，腹部呈白色，染有褐色并有浅褐色横纹。白色的喉部是其特征。背部是丰富的巧克力褐色，带有黑色边缘的白色斑点。喙是绿灰色的，脚是灰色的。发现于爪哇的低地森林，它们也可能被靠近村庄的森林吸引，有时进入城镇。


    # 长尾夜鹰 *Caprimulgus macrurus* 30cm


    ![](img/59_1.jpg)


    ![](img/61_1.jpg)


    Mike McKavett, Windrush Photos


    这种相当大的灰褐色夜鹰白天待在阴凉处，被其伪装色的羽毛所遮蔽。飞行时，可以看到四片主飞羽中心的白色斑块，并伴有 `choink-choink-choink`
    声。作为该地区最小的夜鹰之一，该物种有单调的重复叫声 `jweep`，在黎明和黄昏时可以听到。从印度到澳大利亚广泛分布，在林区当地常见，偏好红树林和森林边缘。


    # 草原夜鹰 *Caprimulgus affinis* 22cm


    ![](img/59_1.jpg)


    ![](img/61_3.jpg)


    作为该地区最小的夜鹰之一，该物种呈均匀的棕色。它们在沿海低地周围的干燥开阔地区很常见，但令人惊讶的是也发现于大城市，在那里利用灯光吸引的飞行昆虫，并利用大型平坦的屋顶休息。在开阔地区，它们白天栖息在地面，很少在其他地方被看到。


    # 腹光金燕 *Collocalia esculenta* 9cm


    ![](img/62_2.jpg)


    ![](img/62_1.jpg)


    朱锦福 (Chew Yen Fook)


    这是该地区最小且最常见的金燕，通过其光泽黑色的背部和白色腹部来识别。它也有别名白腹燕。下巴是浅灰色的，飞行时尾巴上有明显的缺口。喙和脚都是黑色的。它们在洞穴口筑巢，但不使用回声定位，且巢不可食用。像所有的雨燕一样，它们是食虫性的，飞过森林和农田时捕捉空中昆虫。它们经常飞过水面俯水水。


    # 雨燕 *Apus nipalensis* 15cm


    ![](img/62_2.jpg)


    ![](img/62_3.jpg)


    这种中型雨燕最近从小金燕 `A. affinis` 分化出来，通常看到成群在开阔乡村上空捕食昆虫。它可以通过白色的臀部和喉部以及略有缺口的尾巴来识别，与相似但更大的凤尾燕
    `A. pacificus` 不同，后者的尾巴有明显的叉。除此之外，它的羽毛呈黑色，喙是黑色的，脚是棕色的。它偏好从海岸到低矮丘的栖息地，经常在城镇和村庄中发现，在房屋屋檐下筑巢；它们也使用悬出的崖壁和洞穴口作为筑巢点。它在许多地区当地常见。


    # 普通翠鸟 *Alcedo atthis* 15cm


