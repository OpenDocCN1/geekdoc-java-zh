    Many waterbirds arrive at the end of the wet season, nesting in the safety of
    isolated trees in a flooded landscape. This is also the peak of the insect breeding
    season, when abundant food is available for insectivorous species to rear their
    young. Frugivorous species delay breeding a little longer, until the trees and
    bushes are bearing ripe fruit.


    Good birding areas, with a rich diversity of habitats, abound throughout the region.
    Clearly, it is not possible to list them all in a book of this size, but, to guide
    the birdwatcher to some of the more productive areas, the major reserves and National
    Parks are described below. These are shown on the accompanying map.


    # IMPORTANT BIRDWATCHING SITES


    ## SUMATRA:


    #### Gunung Leuser National Park

    This is a huge area of rainforest and mountains with a small coastal and lowland
    extension. It is an ideal place to explore the birds of northern Sumatra, such
    as Wreathed, Black, Oriental (or Asian) Pied, Helmeted and Rhinoceros Hornbills,
    Great Argus, Crestless Fireback and Crested Partridge, Brown, Yellow-crowned and
    Gold-whiskered Barbets, White-rumped Shama and Black-and-yellow, Green and Dusky
    Broadbills, Crested Jay and Red-bearded Bee-eater.


    #### Kerinci-Seblat National Park

    The park includes the dominating peak of Mt Kerinci and the Kerinci valley wetlands.
    The best place to see Sumatran montane birds, as well as several of the endemics
    such as Schneider’s Pitta, Bronze-tailed Peacock Pheasant and Sumatran Cochoa.
    Also recorded there are Salvadori’s Pheasant, Silver-eared Mesia, Chestnut-capped
    Laughingthrush, White-throated Fantail, Sunda Bush Warbler and Golden Babbler.


    #### Way Kambas National Park

    Situated in the south-east of Sumatra, Way Kambas includes remnants of lowland
    rainforest and coastal and swamp forest. A large number of species have been recorded
    there, including White-winged Duck, Storm’s Stork, Stork-billed Kingfisher, Lesser
    Adjutant, Crested Fireback, Crested Partridge, Great Argus, Hill Myna, Black-bellied
    Malkoha and Scarlet-rumped Trogon, Gould’s, Sunda and Large Frogmouths, Black-thighed
    Falconet and Orange-breasted and Cinnamon-headed Green Pigeons.


    #### Berbak National Park

    This reserve is on the east coast and includes coastal forest and peat swamp,
    as well as mangroves. It is a good area for Büttikofer’s Babbler, Wallace’s Hawk
    Eagle and Milky and Storm’s Storks.


    #### Bukit Barisan Selatan National Park

    Situated at the southern tip of Sumatra, at the end of the Barisan mountain range,
    the park reaches from the sea to the top of Gunung Pulung and includes all forest
    types and some very wild areas. It is relatively unrecorded but could bring some
    interesting surprises. Among the rarer birds in the area are Sumatran Treepie,
    Helmeted Hornbill, Red-billed Partridge, Lesser Adjutant and Milky and Storm’s
    Storks.


    ## JAVA:


    #### Ujung Kulon National Park

    At the extreme west tip of Java, Ujung Kulon boasts many rare species in a great
    variety of habitats, from lowland rainforest and evergreen forest to coastal scrub,
    mangroves and open grazing areas. As many as 24 endemic or threatened species
    are to be found there, including Javan Coucal, White-breasted Babbler, Javan Sunbird,
    Javan Hawk Eagle, Blue-throated Bee-eater and Green Peafowl.


    #### Gede/Pangrango National Park

    This West Javan National Park consists mainly of luxuriant evergreen submontane
    forests, but with mossy elfin forest and alpine meadows at the peak of Gunung
    Pangrango. It is a wonderful place to see many of the Javan endemics, such as
    Javan Tesia, Javan Cochoa, Javan Hawk Eagle, Chestnut-bellied Partridge, Javan
    Scops Owl, Javan White-eye, Dusky (Horsfield’s) Woodcock, Pygmy Tit, Mountain
    Serin, Volcano Swiftlet and the Blue-tailed Trogon.


    #### Meru Betiri National Park

    Meru Betiri covers large areas of moist primary and secondary forests, mangroves
    and a rather rugged coastline with some beautiful beaches. It is one of the less
    explored areas where new discoveries are likely to be made. Among the rarer birds
    recorded are Wreathed Hornbill, Banded Woodpecker, Violet Cuckoo, Pin-tailed Parrotfinch,
    Black-crested Bulbul, Grey-cheeked Green Pigeon, Black-naped Fruit Dove, Javan
    Owlet, Waterfall (or Giant) Swiftlet, Black-banded Barbet and Crescent-chested
    Babbler.


    #### Baluran National Park

    Situated at the north-east end of Java, Baluran National Park is spread around
    the dormant volcano of Gunung Baluran. It is one of the easier places for birdwatching,
    being more open and easily accessible. A good place to see Green Peafowl and Green
    and Red Junglefowl. White-bellied Woodpecker, Oriental Pied Hornbill, Spotted
    Wood Owl, Banded Pitta, Lesser Adjutant and Grey-cheeked Tit Babbler are all reported
    from the area.


    #### Kebun Raya (Botanic Gardens), Bogor

    Being easily accessible, Bogor’s Botanic Gardens become crowded with local visitors
    at the weekend. A weekday visit, however, can be very fruitful in the comparative
    tranquillity. The enchanting settings of Kebun Raya, covering a 1-kilometre square,
    have been established for around two centuries and provide some very ready opportunities
    to see many town and woodland birds. There is a roost of Black-crowned Night Herons,
    and it is difficult to miss Black-naped Orioles, Sooty-headed Bululs and Oriental
    Magpie Robins. Other species likely to seen are Black-naped Dove, Collared Kingfisher,
    Blue-eared Kingfisher, Olive-backed Sunbird, Purple-throated Sunbird, Hill Blue
    Flycatcher and Yellow-throated Hanging Parrot.


    #### Pangandaran Nature Recreation Park

    Just west of Cilacap on the south coast of Java is the peninsula of Pangandaran,
    taken up by the Nature Recreation Park. Consisting mainly of dry forest, it is
    a good area for Green Junglefowl and Banded Pitta. Other species present are Oriental
    Hornbill, Scaly-crowned Babbler and Black-backed Kingfisher. To the east lie the
    mangroves of Segara Anakan, where many waterbirds can be seen. Among the large
    population of herons, egrets and terns, Lesser Adjutant and Milky Stork may be
    seen. Javan Coucal and Stork-billed Kingfisher have also been recorded there.


    ## BALI:


    #### Bali Barat National Park

    Situated at the western tip of Bali, Bali Barat is a mixture of dry and moist
    forests with coastal scrub, savanna and mangroves. It is the only place to find
    the wild, endemic Bali Myna. Many other interesting species reside there, including
    Banded Pitta, Green Junglefowl, Pink-headed Dove, Black-backed Dove, Shiny Whistling
    Thrush, Sunda Bush Warbler and Lemon-bellied White-eye.


    # VISITING PARKS

    Permits to enter national parks can be obtained at the parks’ entrances. In most
    Indonesian national parks, facilities such as trail networks, the provision of
    experienced bird guides, and accommodation close to the best birding sites, are
    limited.

