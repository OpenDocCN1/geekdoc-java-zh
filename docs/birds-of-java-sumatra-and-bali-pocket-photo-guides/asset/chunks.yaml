    当这只美丽的蓝鸱离开林木阴影来到开阔地时，它那悦人的蔚蓝色头部和背部非常显眼。雄性头部后脑部有一条短的直立黑色冠羽，喙上下各有一条细细的黑带。另一条窄的黑带横跨上胸部，灰色的腹部逐渐变为白色泄殖门处。翅膀为灰色，尾巴为蓝黑色。蓝色的喙尖端为黑色。雌性头部蓝色较暗，胸部较灰，没有雄性的任何黑色斑纹。它偏好低地森林和次生林，在那里通常很常见。


    ### 黑扇长尾 `*Rhipidura javanica` 19cm


    ![](img/104_1.jpg)

    ![](img/107_3.jpg)


    这种非常活泼的小鸟在垂下翅膀的姿态以及经常抖动和扇开尾巴时是典型的长尾鸟。羽毛为黑白相间，在白色的下部有一条特征性的黑带。当尾巴扇开时，羽毛宽大的白色末端非常显眼。上部为暗黑色，有一条细的白色眉纹。喙和腿均为黑色。它特别分布于红树林、开阔林地和海拔高达
    1500 米的次生林地中，并经常出现在花园中。是该地区常见的留留鸟。


    ### 黄腹绿喉留 `*Pachycephala pectoralis` 17cm


    ![](img/104_1.jpg)

    ![](img/108_1.jpg)


    Morten Strange


    该物种的雄性色彩非常鲜艳，由黑、白、亮黄色组成。颈后的黄色斑块通过一条窄的黄色带一直贯到胸部、腹部和泄殖门，而头部除白色下巴和喉部外都是黑色的，在喉部和腹部之间留有一条窄黑带。上部为橄榄绿色，尾巴几乎全黑。雌性颜色暗得多，具有暗淡的橄绿色上部和脏褐色的下部，下腹部和尾覆盖羽染有黄色。发现于东爪哇和巴厘岛的山丘和山林，但在苏门答腊岛缺失。


    ### 大山雀 `*Parus major ambiguus/cinereus` 13cm


    ![](img/104_1.jpg)

    ![](img/108_3.jpg)


    Tilford/Cooke, TC Nature


    在世界上 33 种大山雀中，有两种留在该地区，两者外观非常相似，但与该物种分布范围极端的个体完全不同。苏门答腊、爪哇和巴厘岛的个体较小，是黑、白、灰三色的鸟。头部和喉部为黑色，有一条从喉部延伸到泄殖门的黑带；腹带在雄性身上很宽，但在雌性身上可能非常细甚至断开。脸颊有一块大白斑，后脑部有一个小白斑。它们通常成对或成小群觅食昆虫，特别是在红树林和开阔森林中，并经常来到花园。


    ### 红颏鴴 `*Sitta frontalis` 12cm


    ![](img/109_2.jpg)

    ![](img/109_1.jpg)


    Tilford/Cooke, TC Nature


    一种非常活泼且迷人的鸟，与该地区的其他鴴不同，它非常适应在树干上上下爬行以寻找昆虫和蜘蛛。它通过红色的喙和红褐色的脚、脏粉色的下部和近白色的喉部来识别。上部主要为紫蓝色，尾巴和初级飞羽边缘有黑色缘，额头为天绒般的黑色。通常成对出现，偶尔也成小群活动，在森林和种植园的林层枝间无规律地移动。在苏门答腊和爪哇的低地和山林中相当常见。


    ### 蓝鴴 `*Sitta azurea` 13cm


    ![](img/109_2.jpg)

    ![](img/109_3.jpg)


    Chew Yen Fook


    这种鴴通常在树枝和树干上觅食，撬开树皮碎片以寻找幼虫和昆虫。在阴暗的森林里它看起来上部是黑色的，但实际上它的背部、翅膀和尾巴是光深蓝色；只有冠部、颈部和脸侧是黑色的。喉部和胸部为灰白色。东爪哇的鸟（`*S.
    a. azurea*`）具有蓝色的下腹和泄殖门，但西爪哇和苏门答腊的鸟（`*S. a. nigriventer*`和`*S. a. expectata*`）是黑色。它有黄喙和灰脚。在巴厘岛未记录，但在苏门答腊和爪哇的低山森林中常见。


    ### 绯胸蜜雀 `*Prionochilus percussus* 10cm


    ![](img/110_2.jpg)

    ![](img/110_1.jpg)


    Chew Yen Fook


    成年雄性色彩鲜艳，亮黄色的下部仅被一片鲜红的胸斑打破。上部为灰蓝色，冠部有一块亮红斑。额头和初级飞羽为黑色，尾巴为深蓝灰色。它有一条细细黑底的白色颊纹。雌性上部为橄榄绿色，冠部仅有一抹橙色，具有带黄色的灰色喉部、白色颊纹和黄色腹部，侧腹为灰橄绿色；尾覆盖羽呈明显的白色。是苏门答腊和西爪哇低地较为稀有且局部的鸟。


    ### 黄腹腹蜜雀 `*Dicaeum chrysorum* 9cm


    ![](img/110_2.jpg)

    ![](img/110_3.jpg)


    Chew Yen Fook


    凭借其特征性的纯黄色尾覆盖羽和带黑纹的白色下部，这种鸟很容易辨认。幼鸟颜色较暗，缺乏黄色或橙色。喙为黑色，腿为灰色。这种蜜雀在开阔森林和次生林中觅食昆虫和小果实，遍布该地区的低地，但无处常见。


    ### 绯背蜜雀 `*Dicaeum cruentatum* 9cm


    ![](img/110_2.jpg)

    ![](img/112_2.jpg)


    ### 橙腹蜜雀 10cm


    雄性的冠部、背部和尾部为绯红色，脸侧、颈部以及翅膀和尾巴为黑色。下部为灰色，腹部中央和喉部有一条宽的浅褐色色带。雌性为橄榄褐色，喉部和腹部较浅，具有绯色的尾部和上尾覆盖羽，缺乏红额蜜雀（`*Dicaeum
    trochileum*`）那种染红的冠部和背。苏门答腊低地和亚山森林、灌木丛、种植园和花园中常见的留鸟，即使在城市中也会受寄花吸引。

