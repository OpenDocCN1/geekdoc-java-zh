    # SPOTTED DOVE

    *Streptopelia chinensis* 30cm


    ![](img/48_2.jpg)

    ![](img/52_1.jpg)


    `Tilford`/`Cooke`, `TC Nature`


    This very familiar dove has a generally pinkish-brown plumage, with slightly darker
    flight feathers and dark-mottled back. On each side of the neck it has an obvious
    white-spotted black patch. The outer tail feathers are broadly tipped white, this
    being very obvious in flight. It has red feet and a black bill. It is frequently
    found close to human habitation, from city gardens to rural cultivation, open
    country and forest edges in lowland areas, where it forages on the ground. Very
    common throughout the Sundas, and widely kept as a cagebird and bred in aviaries
    throughout the world.


    # PEACEFUL DOVE

    *Geopelia striata* 20cm


    ![](img/48_2.jpg)

    ![](img/52_3.jpg)


    Chew Yen Fook


    A very common cagebird throughout Indonesia, but particularly in Java, where it
    holds a special significance in Javanese philosophy. Also known as the Zebra Dove
    for its finely barred pale brown and black plumage from neck to tail. The back
    of the head is pale brown, blending into a buff face, crown, neck and chin. The
    long tapered tail is brown and black with white-tipped outer feathers; very evident
    on take-off. This is a ground feeder, occurring around gardens, cultivation and
    open grassland and scrub. Although common in lowland south Sumatra, excessive
    trapping in Bali and Java has dramatically reduced its numbers.


    # EMERALD DOVE

    *Chalcophaps indica* 25cm


    ![](img/48_2.jpg)

    ![](img/53_1.jpg)


    Chew Yen Fook


    This attractive ground dove has iridescent emerald-green wing-coverts and mantle,
    with a dark grey lower back crossed by two conspicuous white bars. The underparts,
    neck and sides of the head are dark pink, and the short tail is black. Males have
    a white forehead, with the crown and nape tinged grey. Females are duller. The
    species occurs singly or in pairs, preferring the seclusion of thick forest or
    forest edge. Throughout its range from Australia to India it is quite common,
    but it is becoming rare in Java and Bali, probably as a result of habitat destruction
    and trapping for the pet trade.


    # NICOBAR PIGEON

    *Caloenas nicobarica* 40cm


    ![](img/48_2.jpg)

    ![](img/53_3.jpg)


    One of the more unusual pigeons, recognized by its long, iridescent purple, mane-like
    hackles. Apart from the short, stubby white tail, the plumage is dark green, with
    an iridescent sheen of gold, purple and bronze on the upperparts. The bill is
    black, with a conspicuous knob-shaped cere. The legs are purplish-red and the
    claws yellow. This is a wary bird and almost silent, making an occasional deep
    croaking call. Although it is a secretive ground feeder, it rests low down in
    trees for the greater part of the day, only becoming active at dusk. It is fairly
    rare, occurring mainly on the offshore islands of Java and Sumatra.


    # RAINBOW LORIKEET

    *Trichoglossus haematodus* 24cm


    ![](img/54_1.jpg)

    ![](img/54_2.jpg)


    `Tilford`/`Cooke`, `TC Nature`


    This is a brilliant multicoloured parrot with a very dark purplish-black head.
    Apart from the yellow collar, the upperparts are green. It has a red breast and
    underwing-coverts, and a yellow patch under the shoulder. The belly is very dark
    purple, and the thighs show alternate green and yellow narrow bands. The feet
    are grey and the bill red. It is normally seen in small, noisy, foraging parties
    flying low over the forest canopy. A resident species in Java, Bali and the Lesser
    Sundas through to Australia. Once common in Bali, it is now quite rare, having
    been exploited for the pet trade.


    # YELLOW-CRESTED

    *Cockatoo Cacatua sulphurea* 33cm


    ![](img/54_1.jpg)

    ![](img/54_3.jpg)


    `Tilford`/`Cooke`, `TC Nature`


    A fairly large, white, parrot-like bird with a lovely crest of stiff yellow feathers
    and yellow cheek patches. It has a black bill and dark grey feet. Its flight appears
    very laboured, with alternate glides and fast flapping wingbeats. It can often
    be seen in small groups, but usually lives in pairs, and is very noisy, with screeches,
    squawks and whistles in its repertoire; it has a habit of raising its crest as
    it calls. Also known as the Lesser Sulphur-crested Cockatoo, this bird is endemic
    to Sulawesi and the Lesser Sundas, with a population on Nusa Penida, Bali, and
    another on Mesalembu Besar in the Java Sea. Has been widely exploited by the pet
    trade.


    # YELLOW-THROATED HANGING PARROT

    *Loriculus pusillus* 12cm


    ![](img/54_1.jpg)

    ![](img/55_2.jpg)


    `Tilford`/`Cooke`, `TC Nature`


    These very small and well camouflaged parrots are more often seen in the treetops,
    clambering around and hanging, often upside-down, to feed on flowers and small
    fruits. They fly around in small flocks, often making high-pitched shrieking calls.
    They are mainly leaf-green, with brighter yellow-green underparts, and they are
    particularly difficult to observe as their colouring blends in so well with the
    foliage. Males have a small yellow patch on the throat. The feet and bill are
    orange. A fairly common endemic of Java and Bali.


    # SU CUCKOO

    *Cuculus lepidus* 26cm


    ![](img/54_1.jpg)

    ![](img/55_3.jpg)


    `Tilford`/`Cooke`, `TC Nature`


    This very secretive species spends much of its time high in the forest, and is
    very quiet outside the breeding season. It has a ‘whining’ call. Found in the
    rainforest.


    # DRONGO CUCKOO

    *Surniculus lugubris* 24cm


    ![](img/56_2.jpg)

    ![](img/56_1.jpg)


    Morten Strange


    This predominantly black cuckoo has a forked tail like a drongo. Its plumage is
    shiny black, apart from white bands on the undertail-coverts. The bill is black
    and the legs are grey. Formerly regarded as a race of the Oriental Cuckoo.


    # ASIAN KOEL

    *Eudynamys scolopaceus* 42cm


    ![](img/56_2.jpg)

    ![](img/56_3.jpg)


    Chew Yen Fook


    *Male (left)*; *female (right)*


    This bird’s loud call, a shrill repeated `koel, koel, koel`, is the origin of
    its name. Its other call, a loud and accelerating `kow-wow, kow-wow, kow-wow`,
    can be heard by day and night, but you will be lucky if this timid bird reveals
    itself. Like others of the cuckoo family, it is a brood-parasite, searching out
    nests of orioles, crows and drongos in which to deposit its eggs.


    # RED-BILLED MALKOHA

    *Phaenicophaeus javanicus* 46cm


    ![](img/56_2.jpg)

    ![](img/57_2.jpg)


    `Tilford`/`Cooke`, `TC Nature`


    Separated from other malkohas of the region by its large size and strong red bill.
    The upperparts are mid-grey but tinged with a pale bluish-green iridescence. The
    underparts are chestnut with a grey band across the upper breast and the grey
    tail feathers are tipped with white. The eye is surrounded by a bare patch of
    blue skin and the legs are grey. Found in the lowland and lower hills of Java
    and Sumatra, it prefers forest edges and secondary scrub.


    # CHESTNUT-BREASTED MALKOHA

    *Phaenicophaeus curvirostris* 50cm


    ![](img/56_2.jpg)

    ![](img/57_3.jpg)


    Morten Strange

