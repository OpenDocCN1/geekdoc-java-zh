    buds and flowers. More likely to be encountered around clearings and forest edges
    of lowland and hill forests, this endemic of Bali and Java appears quite plentiful.


    **BLUE-EARED BARBET** *Megalaima australis* 18cm


    ![](img/71_1.jpg)


    ![](img/73_1.jpg)


    Morten Strange


    A small barbet, more likely to be heard than seen, but careful examination of
    fruiting fig trees will often lead to its being located. This species’ calls are
    a fast repeated *tuk-trrk, tuk-trrk* …, and a series of high-pitched whistled
    or trilled notes. Two races occur in the region, both having green body plumage,
    a black malar stripe and breast stripe, and a blue chin and crown. The Javan race
    has patches of yellow on the cheek and below the black breast stripe. The Sumatran
    race lacks the yellow but has red cheeks. This is a common barbet of forests and
    plantations, being found from the coast to the lower hills.


    **COPPERSMITH BARBET** *Megalaima haemacephala* 15cm


    ![](img/71_1.jpg)


    ![](img/73_3.jpg)


    Tilford/Cooke, TC Nature


    A drawn-out resonant *tonk-tonk-tonk-tonk* call, reminiscent of a vibrating hammer
    on metal, announces this bird’s presence. While frequently found in trees in open
    country, it also ventures into town gardens and parks. Usually solitary, but often
    flocks with other barbets at fruiting trees. The back, wings and tail are green,
    with fawn underparts streaked with black. The race found in Java and Bali (*M.
    h. rosea*) has a red crown, chin, throat and cheek, the Sumatran race (*M. h.
    delica*) having the throat, cheek and eyebrow yellow. A thin black necklace separates
    the red and yellow neck markings. A fairly common resident of open lowland forests
    throughout the range.


