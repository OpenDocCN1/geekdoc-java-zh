    该物种比苍白鹭更大、更纤细，具有灰色的腿和黑色的喙。羽毛通常为全亮白色，在繁殖季节，胸部、背部和颈后部会长出长垂状羽。它小小的、脏黄色的裸露脸部在繁殖季节会变成粉红色。亚洲迁徙种的特征是脚趾是黄色的。这种常见的鹭类主要分布在沿海低地的混合群落中，栖息于稻田、河岸泥滩、沙洲以及小溪旁。它们在繁殖群群居地和夜间栖息地与其他鹭类、白鹭自由混群。


    ### 太平洋礁石鹭 `Egretta sacra` 58cm


    ![](img/18_2.jpg)


    ![](img/20_3.jpg)


    太平洋礁石鹭有两种体色变型。更为常见的形态具有均匀的灰色羽毛、短冠和极浅色的下巴。较少见的是白色形态，它看起来像苍白鹭，但体型大得多，头部和颈部更纤细。它有相对较短的绿色腿和淡黄色的喙。该物种通常局限于海岸线，当不在水边捕食时，可以看到它们休息在岩石和悬崖上。它们在离岸岛的沙滩和礁石上常见。


    ### 苍白鹭 `Bubulcus ibis` 50cm


    ![](img/18_2.jpg)


    ![](img/21_2.jpg)


    这种物种常见于稻田和淡水沼泽地区，它们也会被放牧的牛群吸引，取食被牛惊扰的昆虫。这是一种较小的鸟，通常为白色，有时额头带有微弱的橙色。然而，在繁殖羽下，它的胸部、头部和颈部会覆盖上一层橙色，喙、腿和眼间纹也会变为红色。它更圆润的身体、短颈和短厚实的喙将其与其他白鹭区分开来。它们群聚筑巢和群栖息。在巴厘岛，佩图卢（Petulu）村的一个大型夜间栖地（与其他物种共享）受到信仰保护，人们认为这些鸟承载着
    1966 年反共主义屠杀中死去的巴厘岛人的灵魂。


    ### 爪哇苍鹭 `Ardeola speciosa` 45cm


    ![](img/18_2.jpg)


    ![](img/21_3.jpg)


    单只或成小群出现，通常与其他水鸟结伴，它们在泥泞地区或水边缓慢潜行捕猎。这种苍鹭通常呈现深褐色，带有有浅褐色的条纹，尾部和下部为黄褐色，翅膀为白色，但在繁殖羽下，颈部和头部变成金褐色，背部变为黑色。它有带黑色尖的黄色喙和暗绿色的脚。分布于爪哇岛和巴厘岛的内陆和沿海地区，在淡水沼泽和稻田相当常见。在苏门答腊南部，它被认为是非繁殖季节的访客。


    ### 小鹭 `Butorides striata` 45cm


    ![](img/18_2.jpg)


    ![](img/22_1.jpg)


    又被称为红林鹭或条纹鹭，这种小鸟是一种独行的猎食者，它会静止地站在一个位置等待猎物。成年鸟主要是深灰色的，具有极深的绿色冠部和长冠羽；它们有浅褐色的颈部和面部斑纹。幼鸟体态更粗壮，呈棕色，胸部有条纹，上部有斑点。这种害羞的鸟相当常见，特别是在沿海湿地周围，它们倾向于留在植被覆盖物附近，但在岩石岸线和暴露的礁石上也偶尔可见。


    ### 黑脸夜鹭 `Nycticorax nycticorax` 60cm


    ![](img/18_2.jpg)


    ![](img/22_6.jpg)


    *成年鸟（左），幼鸟（右）*


    成年鸟具有独特的羽毛颜色：背部和头顶为黑色，颈部和下部为白色，翅膀和尾部为灰色，颈后长出两根长白色垂羽。在繁殖羽下，通常脏黄色的腿会变成红色。雌鸟比雄鸟略小。幼鸟呈条纹和斑点褐色。白天，这些鸟聚集在树上栖息地休息，但随着夜幕降临，它们会在栖息地周围盘旋，发出特征性的嘎叫声，然后前往稻田、沼泽、红树林和泥滩等淡水觅食区。它们通常在红树林或水上树上形成大型且嘈嘈的群落繁殖。


    ### 马来夜鹭 `Gorsachius melanolophus` 50cm


    ![](img/18_2.jpg)


    ![](img/23_1.jpg)


    由于它是夜性的且非常胆小，喜欢密密的植被（特别是内陆沼泽周围的竹林和芦苇），这种物种除非进入开阔地区觅食，否则很少见到。它体型结实，背部和翅部为栗色并带有精细的横纹和斑点，颈部和头部为浅栗色，带有黑色后掠冠。下部为白色，密布着栗色、黄色和黑色斑点；喉部为白色，中线处有黑色条纹。它有橄绿色的腿，短粗喙为橄褐色，下颌为黄色。它是苏门答腊及其岛屿的冬季访客，偶尔出现在爪哇岛。


    ### 黄腹秧� `Ixobrychus sinensis` 38cm


    ![](img/19_2.jpg)


    ![](img/23_4.jpg)


    Chew Yen Fook


    稻田、芦苇丛、沼泽和海林都是这种非常安静且神秘的鸟类的喜好。它偶尔会在开阔地短暂出现，然后迅速钻回芦苇丛。虽然在巴厘岛并不常见，但它是苏门答腊常见的留鸟。


    ### 肉桂色秧� `Ixobrychus cinnamomeus` 41cm


    ![](img/18_2.jpg)


    ![](img/24_1.jpg)


    它是该地区较小、更胆小的秧�之一，在草地、淡水沼泽和稻田中隐蔽处伏击。受到骚扰时，它会发出嘎叫声从隐蔽处迅速起飞，以缓慢的翅频飞行。成年雄鸟具有明亮的肉桂色上部和橙黄色下部，腹部中部和侧腹有黑色条纹；雌鸟和幼鸟颜色较深。


    ### 白鹭 `Mycteria cinerea` 90cm


    ![](img/18_2.jpg)


    ![](img/24_3.jpg)


    这种大鹳通常以单物种群出现，但偶尔与其他鹳和鹭类混群。它主要是白色的，但翅羽为黑色。它有一块明显的裸露脸部，颜色从粉色到红色不等，有长弯的橄黄色喙和灰色的腿。幼鸟为脏淡褐色，但尾部为白色，翅羽为黑色。这是一种相对稀有的物种，但遍布整个地区，出现在苏门答腊部的红树林和泥滩、雅加附近的爪哇北海岸以及泗水附近的布兰塔斯三角洲。


    ### 白鹳 `Ciconia episcopus` 85cm


    ![](img/18_2.jpg)


    ![](img/25_1.jpg)


    这种大鹳以黑色为主，但有非常“蓬松”的白色白色颈部。尾部和下腹也是白色的，额头和窄眉也是。它有一块深灰色的裸露脸部。脚为脏红色，喙为黑色带红色，尖端为红色。幼鸟与成年鸟的区别在于黑色羽毛带有棕色。虽然在巴厘岛和爪哇岛并不常见，但这种物种可以在稻田和牧场中与其他鹳类一起觅食，并经常在高树上与其共同栖息。它不是群居繁殖的。


    ### 风头鹳 `Ciconia stormi` 80cm


    ![](img/18_2.jpg)


    ![](img/25_3.jpg)


    '
- fmt: '

    Another of the region’s very rare storks, this species is similar in appearance
    to the Woolly-necked stork. It has predominantly black upperparts, a black breast,
    white neck with black patterning at the side, and a black crown. The tail and
    belly are white. During the breeding season, the bright pink facial skin patch
    and the yellow eye-ring are very evident. The slightly upturned bill is reddish
    and the legs are pink. A good place to view this bird, which is found only in
    the freshwater pools in lowland forest in Sumatra and West Java, is Way Kambas
    in Sumatra.


    ### LESSER ADJUTANT `Leptoptilos javanicus` 110cm


    ![](img/18_2.jpg)


    ![](img/26_1.jpg)


    Chew Yen Fook


    Not a pretty bird, this is a strange-looking creature. Its massive bill on a virtually
    bald head, and patches of bare red skin on the head, neck and upper breast, give
    it the appearance of being deformed and sick. The back, wings and tail are dark
    grey, and the underparts and upper back are white. The bill and legs are greyish.
    Juveniles have brownish-grey upperparts and dirty white underparts. Hunting and
    habitat loss are responsible for the rarity of this bird in Java and Bali, but
    it remains locally common in lowland areas of south Sumatra. It is a colonial
    nester, and often joins with other storks and raptors to soar on thermals.


    ### GLOSSY IBIS `Plegadis falcinellus` 60cm


    ![](img/18_2.jpg)


    ![](img/26_3.jpg)


    The only ibis in the region with all-dark plumage, this species has blackish-chestnut
    coloration with green, purple and bronze iridescences. Immature birds are dark
    brown, with buff streaking on the head and neck. Usually found in small groups
    in paddyfields, marshland and lake fringes, where it probes the mud with its long
    bill. It often associates with egrets and herons, both at night-time roosts and
    at breeding colonies. A good place to see this bird is at its only Javan breeding
    colony at Pulau Dua. Although this ibis has an almost worldwide distribution,
    it is uncommon in the region.


    ### BLACK-SHOULDERED KITE `Elanus caeruleus` 30cm


    ![](img/27_2.jpg)


    ![](img/27_1.jpg)


    At first sight, particularly in flight, this elegant little raptor might be mistaken
    for a gull. Its grey upperparts and white underparts, along with long black primaries
    and fairly squarish tail, can be confusing. Its distinguishing features are the
    black shoulder patches and the fact that it often hovers like a kestrel before
    dropping on its prey. It prefers open countryside and can be found in dry areas
    of sparse woodland, along woodland and plantation edges, as well as in cultivated
    areas. It may also be seen from the road, where it perches on exposed branches
    of old trees and on telephone poles. Numbers have declined in recent years.


    ### BRAHMINY KITE `Haliastur indus` 45cm


    ![](img/27_2.jpg)


    ![](img/27_3.jpg)


    This fairly common brown and white kite is mainly seen soaring on thermals, occasionally
    in small groups. Adult birds are deep reddish-brown with contrasting black primaries;
    the head and neck are white. It has dull yellow feet and a pale greenish-grey
    bill. In flight, long broad wings and longish tail distinguish it from the White-bellied
    Sea Eagle. Mainly a scavenger feeding on carrion, it occasionally takes small
    mammals, frogs and birds. It has a shrill mewing call. Generally associated with
    wetlands, coasts, rivers, lakes, mangroves and mudflats. Found throughout the
    region, but rare in western Java.


    ### WHITE-BELLIED SEA EAGLE `Haliaeetus leucogaster` 68cm


    ![](img/27_2.jpg)


    ![](img/28_7.jpg)


    *Adult (left), Juvenile (right)


    Gerald Cubitt, right*


    One of the very large eagles found in the area, this species is distinguished
    by its magnificent white head, neck and underparts. The rest of the plumage is
    grey, apart from the black primaries. Immatures show buff where adults are white,
    the rest of the plumage being dark brown. It flies with slow, powerful wingbeats
    and occasional glides. It feeds on fish, which it grabs in its talons from the
    water surface after a swift spectacular dive. Occasionally feeds on refuse. This
    eagle can often be seen perched upright in trees or on cliffs. It is a fairly
    common resident, associated with rivers and lakes and especially wooded coasts
    and rocky shores.


    ### CRESTED SERPENT EAGLE `Spilornis cheela` 54cm


    ![](img/27_2.jpg)


    ![](img/28_5.jpg)


    A common eagle, that is often seen over woodland and forests, and often attracts
    attention by its loud, shrill call, `cwee-chee, chee-chee, chee-cheee`. It is
    dark-coloured, the upperparts being a greyish chocolate-brown and the underparts
    similar, but the belly and flanks are spotted with white. It also has a raised
    patch of white-spotted feathers on the top and back of the head, giving the appearance
    of a crest. In flight, the broad white tail-band and the band of white on the
    underwing-coverts are significant. The juveniles appear paler below and on the
    head. It has yellow feet and a greyish-brown bill. Frequently sits in shade high
    in a tree, while observing the landscape below.


    ### BESRA `Accipiter virgatus` 33cm


    ![](img/27_2.jpg)


    ![](img/29_1.jpg)


    Ray Tipper


    Males have uniform dark grey-brown upperparts with a dark grey-brown head, and
    white throat with a black mesial stripe. The breast and belly are rufous-grey,
    heavily streaked with black and white in the centre of the upper breast; the lower
    belly is barred white, leading into white undertail-coverts. The tail has a pale
    tip and shows three black bars. Females are generally browner. Sumatran birds
    (`A. v. vanmeli`) are more rufous. The bill is black and the cere grey. This quiet
    forest bird is confined mainly to mountain and foothillsill forests, where it
    preys on birds. Resident and fairly widespread throughout the region, but its
    population is very sparse.


    ### BLACK EAGLE `Ictinaetus malayensis` 70cm


    ![](img/27_2.jpg)


    ![](img/29_3.jpg)


    C. Inskipp, BirdLife International


    This very dark eagle with its long wings and long tail appears huge in flight.
    Apart from its yellow feet, yellow cere and the grey tip on its bill, it is all
    black. There is slight shading on the tail feathers, giving a barred appearance.
    In flight, a pale area is apparent on the underwing-coverts. Immatures are generally
    paler, with buff streaking. This eagle feeds on mammals, birds and some carrion,
    and is known to raid the nests of other birds for both eggs and young. It prefers
    lowland and the lower hill forests, where it can be seen gliding and circling,
    often in pairs, over the treetops in hunting forays.


    ### JAVAN HAWK EAGLE `Spizaetus bartelsi` 60cm


    ![](img/27_2.jpg)


    ![](img/30_2.jpg)


    Indonesia’s national bird, this raptor is easily identified by its very obvious
    black crest. It has a black moustachial stripe and crown, buff throat and underparts
    streaked black on neck and brown on belly, and white-feathered legs, while the
    sides of the head and nape are a rich russet-brown, blending into dark brown upperparts.
    The tail is brown with black barring. Immatures lack the streaking on the throat
    and breast, having plain reddish-brown underparts. A rare endemic, found only
    in hill and mountain forests and open wooded areas in western Java, and down to
    the coast at Meru Betiri National Park in the east. A last stronghold is in the
    Gunung Halimun National Park.


    ### BLACK-THIGHED FALCONET `Microhierax fringillarius` 15cm


    ![](img/27_2.jpg)


    ![](img/30_3.jpg)

    '
