    yellow patch at the base of the black bill. In non-breeding plumage it is greyer,
    the neck becoming whitish. It is a rare resident in Java, Bali and northern Sumatra,
    where it frequents lakes and flooded rice paddies, although its range extends
    from New Guinea to Europe.


    **WHITE-TAILED TROPICBIRD** *Phaethon lepturus* 39cm


    ![](img/14_1.jpg)


    ![](img/15_1.jpg)


    Tilford/Cooke, TC Nature


    Adult birds are usually white, some with a yellowish tinge, and have long white
    tail-streamers. They are marked with black on the wing-tips and have a black bar
    on the upperwing. Juveniles have no tail-streamers, and their upperparts are barred
    black. Although resident in some parts of the region, visitors also arrive from
    other areas. Individuals occurring around Sumatra, and recognizable by their golden
    plumage, belong to the subspecies (*P. l. fulvus*) which comes from Christmas
    Island in the Indian Ocean. Breeding colonies have been located on Nusa Penida,
    Bali, and along Java’s south coast.


    **LITTLE BLACK CORMORANT** *Phalacrocorax sulcirostris* 60cm


    ![](img/14_1.jpg)


    ![](img/15_2.jpg)


    David Tipling, Windrush Photos


    A bird with fairly uniform black plumage with a purplish-green iridescence, except
    for mottling on the wing-coverts. In the breeding season, it acquires a small
    patch of white feathers behind the eye. It has a small greyish gular pouch and
    bare skin around the eye. The bill is grey-blue and the feet black. Mainly a bird
    of lakes, estuaries and fishponds, it is occasionally seen along the coast. This
    species’ range extends from Australia up through New Guinea and westwards to the
    Greater Sundas, but few birds reach Sumatra. It is not a common bird, although
    the number present at Pulau Rambut on the north-west Javan coast might lead one
    to believe that it is.


    **LITTLE CORMORANT** *Phalacrocorax niger* 56cm


    ![](img/14_1.jpg)


    ![](img/16_2.jpg)


    Chew Yen Fook


    This is the smallest of the cormorants found in the region. The plumage is generally
    greenish-black, with a few tiny white feathers on the neck and head. The bill
    is brown, with a black tip and purple near the base. After breeding, the plumage
    darkens and loses the white flecks, except for the chin and throat, which become
    white. It frequents mangroves, marshland, lakes and estuaries, often in small
    flocks swimming low in the water and diving for fish. A fairly common resident
    of the coasts and lowland waterways of Java. Those seen in Sumatra are likely
    to be visitors from Java.


    **ORIENTAL DARTER** *Anhinga melanogaster* 84cm


    ![](img/14_1.jpg)


    ![](img/16_3.jpg)


    Chew Yen Fook


    Very similar to the cormorants apart from the long slender neck, small head and
    yellow-brown dagger-like bill. It is a mainly black bird, with white-streaked
    plumed coverts on the wing and back. It swims very low in the water with only
    its head and neck showing, so it often becomes waterlogged and has great difficulty
    in taking to the air. It spends a lot of time standing alone on low, exposed perches,
    often with its wings outstretched to dry, but it roosts communally. Darters prefer
    to inhabit large, clean freshwater lakes and forested rivers where they dive underwater
    in search of fish.


    **AUSTRALIAN PELICAN** *Pelecanus conspicillatus* 150cm


    ![](img/14_1.jpg)


    ![](img/17_1.jpg)


    Very similar in size to the Great White Pelican *Pelecanus onocrotalus*, the Australian
    Pelican can be identified by its black tail and upper-wing coverts, pinkish gular
    pouch stretching the full length of the very large pinkish-purple bill, and lack
    of bare facial skin patch. The primaries and secondaries are black; legs and feet
    are grey-blue. It flies with a laboured wing-beat and catches fish by plunging
    into the water. This pelican is occasionally found singly but more usually in
    small flocks on estuarine sand bars. It breeds in Australia, migrating north to
    New Guinea and west as far as Bali and E. Java.


    **GREY HERON** *Ardea cinerea* 100cm


    ![](img/14_1.jpg)


    ![](img/17_3.jpg)


    A predominantly grey bird with paler underparts, the Grey Heron has a prominent
    black streak on the head and black flight feathers. It also has a line of black
    streaks down the front of its neck. Legs and bill are yellowish. It appears smaller
    than the Purple Heron and lacks that species’ reddish-brown coloration. Found
    mostly in the lowlands, these herons frequent wet areas such as paddyfields, lakes,
    mangroves and swamps, hunting fish, frogs and crabs. This is a colonial nester,
    often seen in tall trees in the proximity of mangroves. Widely distributed, it
    is resident throughout the Old World temperate regions as well as the tropics.


    **GREAT-BILLED HERON** *Ardea sumatrana* 115cm


    ![](img/18_2.jpg)


    ![](img/18_1.jpg)


    The largest heron found in the region, the Great-billed Heron has a dark greyish-brown
    plumage and shows a small crest. Its feet are grey and the bill is grey-black.
    It has a repetitive ‘roaring’ call, as well as low-pitched croaking. It prefers
    a habitat of mangroves and mudflats, and also frequents the beaches and coastal
    reefs of small islands. It is generally solitary in its habits, and may be seen
    stalking along the reefs and creek edges in search of small fish. Although not
    common, this species is a resident throughout the Greater Sundas.


    **PURPLE HERON** *Ardea purpurea* 95cm


    ![](img/18_2.jpg)


    ![](img/18_3.jpg)


    Chew Yen Fook


    Similar in height to the Grey Heron, this more elegant, slimmer bird has a less
    hunched stance. It is easily distinguished from other herons of its size by its
    dark underparts and its black-streaked russet-coloured neck and upper breast.
    The back and wings are greyish-purple with a scattering of long russet plumes.
    It has a brown bill and reddish-brown legs. Normally a more solitary species,
    it congregates in large colonies to nest. It is found in typical heron habitat
    of paddyfields, swamps, mangroves and lakes, often inland, where it feeds on small
    fish and amphibians.


    **GREAT EGRET** *Ardea alba* 90cm


    ![](img/18_2.jpg)


    ![](img/19_1.jpg)


    The largest of the white egrets, with a more substantial bill and a peculiar kink
    midway along the neck. During the breeding period, the bill is black, the bare
    facial skin becomes greyish-blue and the bare thighs turn red. At other times
    of the year, the facial skin is dull yellow, the bill is yellowish, often tipped
    black, and the feet and legs are all black. It prefers mudflats, mangroves and
    coastal marshland, as well as rice paddies, where it is found either alone or
    in small groups, generally feeding on small fish and frogs. Although this species
    occurs throughout the Greater Sundas, nowhere is it common.


    **INTERMEDIATE EGRET** *Egretta intermedia* 68cm


    ![](img/18_2.jpg)


    ![](img/19_3.jpg)


    Chew Yen Fook


    Also known as the Plumed Egret because of the adornments of its breeding plumage
    (although other egrets also develop such plumes to a greater or lesser degree
    when breeding). This all-white bird is in fact intermediate in size between the
    Great and Little Egrets, but it is less common than either. It may be distinguished
    from the smaller Little Egret by its yellow bill, and from the larger Great Egret
    by its smooth, unkinked neck. In common with its relatives, it can be found in
    paddyfields, mangroves and swamps and on coastal mudflats.


    **LITTLE EGRET** *Egretta garzetta* 60cm


