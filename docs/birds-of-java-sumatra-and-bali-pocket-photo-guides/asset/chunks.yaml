    该物种与绿喉吊��相似但体型更小，苏门答腊和爪哇腊亚种具有白色眼睛，因此易于区分。背部呈暗褐色，腹部为白色，尾端为奶油色。下颏和喉部均为浅褐色至白色。喙为黑色，腿为棕色。它是森林的居民，也会进入更开阔的乡村地区、次生林，有时进入种植园，但它总是停留在树冠层。在苏门答腊，它在低地原生林中相当常见，但在爪哇腊，目前仅局限于南部低地森林。


    ### 红眼画�� `Pycnonotus brunneus` 17cm


    ![](img/82_1.jpg)


    ![](img/85_3.jpg)


    Chew Yen Fook


    另一种在苏门答腊发现但在巴厘或爪哇腊大陆没有的小型画��。它与绿喉吊��非常相似，但体型更小且颜色深得多，耳缘羽为褐色，没有白色条纹。腹部为肉黄色，胸部为棕黄色。成鸟眼睛为红色，幼鸟为棕色，腿和喙均为棕色。这些鸟栖息在高树冠层，在那里觅食昆虫和成熟水果。在整个低地森林中相对常见，倾向于出现在灌木较多的次生林边缘。


    ### 常见的绿嘴留鸟 `Aegithina tiphia` 14cm


    ![](img/86_1.jpg)


    ![](img/86_2.jpg)


    Tilford/Cooke, TC Nature


    这种非常行秘的小叶鸟如果你想好好观察它，需要耐心。它习惯性地停留在小树的叶间，利用它的颜色进行极佳的伪装。背部为橄榄绿色到亮绿色，腰部为白色，腹部为黄色。翅膀为黑色，有明显的白色和黄色边缘以及两条非常清晰的翼斑。它有明显的黄色眼环。喙和足均为蓝灰色。大多独居，但也经常成对出现，栖息于开阔林、次生林和红树林，但经常在城市花园中发现。在苏门答腊、爪哇腊和巴厘岛的低地相当常见。


    ### 大绿吊鴴 `Chloropsis sonnerati` 22cm


    ![](img/86_1.jpg)


    ![](img/86_3.jpg)


    在该地区居住的七种叶鸟中，大绿吊鴴是最大的。它的背部和尾部通常呈亮绿色，腹部颜色稍浅。雄鸟有黑色喉部和脸部，带有蓝色的颊须，翅膀肩处有一个小蓝色斑点。雌鸟喉部为黄色，边缘有蓝色颊须，并有独特的黄色眼环。幼鸟与雌鸟非常相似，蓝色的颊须非常淡或不存在。通常与其他吊鴴一起成小群栖息，栖息在红树林以及原生或次生林中高树的茂密叶丛中。


    ### 蓝翅吊鴴 `Chloropsis cochinchinensis` 17cm


    ![](img/86_1.jpg)


    ![](img/87_2.jpg)


    *雄鸟（左）；雌鸟（右）*


    该物叶鸟在该地区有两个亚种：`C. c. icterocephala` 发现于苏门答腊，`C. c. nigricollis` 发现于爪哇腊。两者都具有大多数叶鸟的典型颜色，上方通常呈黄绿色，下方更黄。该物种通过蓝色的翅膀和尾部边缘来识别。雄鸟眼睛下方有一个黑色斑块，延伸至带有黄色边缘的黑色喉部。苏门答腊亚具有黄色冠部和黄色至橙色的后颈，而爪哇腊亚具有绿色冠部和黄色上胸。雌鸟缺乏黑色的头部和喉部斑纹。所有都有蓝色的颊须，雌鸟身上稍不明显。不分布于巴厘岛。


    ### 金额头吊鴴 `Chloropsis aurifrons` 19cm


    ![](img/86_1.jpg)


    ![](img/87_3.jpg)


    Tilford/Cooke, TC Nature


    雄鸟的特征是额头有亮金黄色斑块，以及一个巨大的黑色喉部斑块，一直延伸到眼睛并跨越喙基。喉部中心为群青蓝色。其余羽毛为亮叶绿色，但肩部有一块细小的闪光浅蓝色斑点。雌鸟全身呈亮叶绿色，除了蓝色肩斑和蓝色颊须外。它是苏门答腊混合林和落叶山地森林的常见居民。像许多其他拥有悦听歌声的鸟一样，它被捕用于宠物贸易，不仅在苏门答腊，在爪哇腊、巴厘岛及全球都被圈养为笼。


    ### 亚洲仙蓝 `Irena puella` 25cm


    ![](img/86_1.jpg)


    ![](img/88_2.jpg)


    Tilford/Cooke, TC Nature


    除了黑色的脸、颈、腹部、尾巴和初羽外，雄鸟的羽毛呈亮蓝色。雌鸟呈较暗的蓝色并带有绿色，除了较亮的蓝色腰部。可以通过较大的体型与其他蓝黑色的鸟区分开。更有可能在果果果树上看到它，在那里通常与其他鸟混群。否则，它局限于觅食，通常在视线之外，通过原生和次生林的高树顶端活动。在苏门答腊的低地森林常见，但在爪哇腊较少，在巴厘岛完全没有。


    ### 长尾伯爵 `Lanius shach` 25cm


    ![](img/86_1.jpg)


    ![](img/88_3.jpg)


    长尾、直立的姿态和黑色羽毛使这种伯爵易于识别。它有灰色的冠部和后颈，带有栗色的背部；腹部为纯白色。成鸟有从额头经过眼睛并跨越耳羽的黑色面罩。在开阔地区常见，进入人类居住区边缘的草地。


    ### 白眉短尾 `Brachypteryx montana` 15cm


    ![](img/89_2.jpg)


    ![](img/89_1.jpg)


    Chew Yen Fook


    这种画科的微型成员非常胆小，很少离开灌木丛的保护。然而，在山顶附近它们会变得大胆，在那里可以看到它们。它们通常躲在灌木下，取食无脊椎动物和偶尔的果实。它的出现通常通过高亢的共鸣鸣声宣告。在爪哇腊和苏门答腊常见。


    ### 东方画鴴 `Copsychus saularis` 20cm


    ![](img/89_2.jpg)


    ![](img/89_3.jpg)


    在该地区发现了几个亚种，包括苏门答腊的 `C. s. musicus` 和东爪哇腊与巴厘岛的 `C. s. amoenus`。前者具有黑色的翅膀和尾部中央，以及白色的外尾羽、腹部和尾端，翼羽处有一块宽的白斑。东爪哇腊和巴厘岛的鸟除白色翼羽斑外全为黑色。雌鸟颜色暗得多，黑色羽毛被灰色取代。幼鸟具有相似但有斑纹的羽毛。在低地常见，栖息地选择广泛，从红树林、森林到城市花园都有，尽管为了宠物贸易的捕猎导致了其数量大幅减少。


    ### 白腰画�� `Copsychus malabaricus` 27cm


    ![](img/90_1.jpg)


    ![](img/90_2.jpg)


    另一种美丽的歌鸣，因宠物贸易捕猎者的行为而数量减少。这种鸟花费大量时间在低矮的灌木丛中觅食，在地面上跳跃。雄鸟有很长的尾巴，约占总长度的一半，中央羽毛为暗黑色，边缘为白色，它们在陆陆时习惯抖动尾巴。它的头部、颈部、背部和翅膀为带有蓝泽的黑色，下腹部为深橙色，腰部有一块明显的白斑。在苏门答腊常见，它们倾向于森林较茂密的部分，但在爪哇腊的数量少得多。


    ### 黑褐石�� `Saxicola caprata` 13cm


    ![](img/90_1.jpg)


    ![](img/90_3.jpg)


    Tilford/Cooke, TC Nature

    '
- fmt: '

    Like all the chats, this bird prefers a habitat of scrubby grassland, where it
    perches on exposed bushes or posts to locate its insect prey. Males are all black,
    apart from a white rump, vent and distinctive wingbar. Females have dark brown
    streaked upperparts, dark brown tail, buff underparts with rufous flanks, and
    pale rufous-brown rump. Juveniles are spotted dark and light brown. Often sings
    from a prominent perch while cocking its tail. A fairly common resident of the
    dry open lowlands of Java and Bali, occurring sporadically in the hills; not present
    in Sumatra.


    ### SUNDA WHISTLING THRUSH

    `Myophonus castaneus/glaucinus` 25cm


    ![](img/91_2.jpg)


    ![](img/91_1.jpg)


    Now split into two species. Chestnut-winged Whistling-thrush (`*castaneus`) in
    Sumatra is the larger, the male having a dark blue head and upper breast, with
    the nape and shoulders a brighter blue; the lower back, wings and tail are dark
    chestnut-brown, with lighter belly and undertail-coverts. The female is duller,
    with blue shoulders and black crown. In the smaller Javan Whistling-thrush (`*glaucinus`)`)
    the male is dark blue with blackish underparts. The plumage is more uniform than
    that of other whistling thrushes, lacking spangles. Both have a blackish bill.
    An endemic of the Greater Sundas.


    ### BLUE WHISTLING THRUSH

    `Myophonus caeruleus` 32cm


    ![](img/91_2.jpg)


    ![](img/91_3.jpg)


    Chew Yen Fook


    A largish blue-black thrush having a moderate purplish sheen and sparsely flecked
    and spangled white on the wing-coverts. The contrasting yellow bill is often marked
    with black, particularly on Sumatran birds. Legs are black. It has a high-pitched
    screeching alarm, screech-chit-chit chit, and a loud whistling song often incorporating
    imitations of other birds’ songs. A ground feeder, taking insects, invertebrates
    and small fruits, it is generally found in denser lowland hill forests beside
    rivers and among exposed limestone rock formations. Absent from Bali and not very
    common in Java or Sumatra.


    ### ORANGE-HEADED THRUSH

    `Zoothera citrina` 21cm


    ![](img/91_2.jpg)


    ![](img/92_1.jpg)


    The usual haunts of this thrush are in more secluded forest among thick undergrowth,
    but its high-pitched whistling alarm call betrays its presence. It has a very
    nice song and this, along with its attractive colouring, makes it a prime target
    for local bird-keepers and, more recently, the export pet trade. Its head, nape
    and belly are bright orange, the back grey-blue, and the tail and wings dark grey.
    It has a white vent and wingbar. The female has greenish-brown upperparts. Widespread
    from Pakistan through to the Greater Sundas, but many of those seen in Sumatra
    are likely migrants; in Java and Bali it is a bird of hill forest and lowland,
    but is not really common.


    ### CHESTNUT-CAPPED THRUSH

    `Zoothera interpres` 16cm


    ![](img/91_2.jpg)


    ![](img/92_3.jpg)


    Chew Yen Fook


    Chestnut-capped as its name implies, this small thrush otherwise has a pied appearance.
    The chestnut crown extends down the nape, stopping at the slate-grey mantle and
    upperparts. It has two distinctive broad white wingbars. The throat and upper
    breast are dense black, leading into a black-spotted lower breast and flanks and
    white belly and vent. The bill is blackish-brown and the legs pink. It has a typical
    thrush diet of invertebrates, and often takes fruit and berries. Occurs in Java,
    but rarely in Bali and Sumatra.


    ### SCALY THRUSH

    `Zoothera dauma` 28cm


    ![](img/91_2.jpg)


    ![](img/93_1.jpg)


    David Tipling, Windrush Photos


    In typical thrush fashion, this species spends much of the time foraging on the
    ground. It has only a quiet whistling song and just a feeble `tzeeet` alarm call.
    Its upperparts are brown with golden-brown and blackish scaly markings, these
    being bolder on the back and upperwing-coverts. The brown-scaled underparts are
    more whitish, with a pale chestnut wash on the upper breast and flanks. It prefers
    dense wooded areas and montane forest in Java and Bali, but in Sumatra is confined
    to the mountain woodland of the north. Found from north-east Europe west through
    to the Sundas and as far as Australia.


    ### ISLAND THRUSH

    `Turdus poliocephalus` 20cm


    ![](img/91_2.jpg)


    ![](img/93_3.jpg)


    Morten Strange


    This is a medium-sized thrush with a dark grey head blending into dull blackish
    upperparts. The throat and upper breast are mid-grey, while the belly is chestnut
    and the vent white. The eye-ring, bill and legs are yellow. It has a pleasantly
    melodious song and a rather raucous rattling alarm call. This is a bird of the
    highest mountains, but it is rare in Bali. It is more common in Java, where it
    can usually be seen close to the volcano on Mt Tangkuban Perahu and in the mossy
    forests of Mt Gede. In Sumatra, the peaks of Mt Leuser are its home.


    ### WHITE-CHESTED BABBLER

    `Trichastoma rostratum` 15cm


    ![](img/91_2.jpg)


    ![](img/94_1.jpg)


    This small babbler has fairly plain coloration of dark brown upperparts and buff-white
    underparts. The sides of the head are buffish-brown with a pale grey supercilium.
    Usually found low down at forest edges and in scrub and thickets, generally singly
    or in groups. Locally common in Sumatran lowland forests, with a few records for
    Javan islands, but absent from Bali.


    ### HORSFIELD’S BABBLER

    `Macocincla sepiaria` 14cm


    ![](img/91_2.jpg)


    ![](img/94_3.jpg)


    Chew Yen Fook


    This noisy little babbler has a monotonous and repetitive call, given particularly
    at dawn and dusk. Usually in pairs or small groups, it forages for insects among
    low vegetation. The upperparts are warm russet-brown, becoming chestnut on the
    rump. The flanks and vent are also chestnut, while the throat and belly are white
    the breast grey. It has a heavy bill.


    ### ABBOTT’S BABBLER

    `Macocincla abbotti` 16cm


    ![](img/91_2.jpg)


    ![](img/95_1.jpg)


    Chew Yen Fook


    Like Horsfield’s Babbler, Abbott’s is small and brown and has a heavy bill. It
    is distinguished by being lighter and duller and having a longer tail. The upperparts
    are brownish-olive, with a pale chestnut rump. The underparts are buffish-white
    on the throat, with a pale grey-green breast, buffish-brown belly and rufous undertail-coverts.
    The sides of the head are buffish-brown with a pale grey supercilium. Separated
    from the former by not having a malar stripe, and from the latter by its crown
    (not black).


    ### CHESTNUT-BACKED SCIMITAR BABBLER

    `Pomatorhinus montanus` 20cm


    ![](img/91_2.jpg)


    ![](img/95_3.jpg)


    Tilford/Cooke, TC Nature


    This bird has a striking greyish-black head with a long white eyebrow, and a longish,
    decurved buffish-yellow bill with black at the base. The throat and breast are
    white, the back, flanks and vent chestnut-brown, and the tail and wings dark brown.
    The feet are grey. It is frequently seen in pairs or small groups with laughingthrushes,
    foraging in ground litter and through low bushes but also in the lower tree canopy.
    The subspecies from Sumatra (`P. m. occidentalis`) is quite common in lowland
    and hill forest, whereas birds from West Java (`P. m. montanus`) and those in
    East Java and Bali (`P. m. ottolanderi`) tend to occupy higher montane forests.


    ### RUSTY-BREASTED WREN BABBLER

    `Napothera rufpectus` 18cm


    ![](img/91_2.jpg)


    ![](img/96_1.jpg)


    F Lambert

