  raw: 'When this beautiful flycatcher leaves the shade of woodland and comes into
    the open, its delightful azure-blue head and back are very obvious. The male’s
    head has a short erect black crest on the hindcrown and a thin black band above
    and below the bill. Another narrow black band extends across the upper breast,
    with the grey belly paling to a white vent. The wings are grey and the tail blue-black.
    The bluish bill has a black tip. Females have a duller blue head and greyer breast,
    without any of the male’s black markings. It prefers lowland and secondary forests,
    where it is usually common.


    **PIED FANTAIL** *Rhipidura javanica* 19cm


    ![](img/104_1.jpg)


    ![](img/107_3.jpg)


    This very active small bird is a typical fantail in its wing-drooping posture
    and regular flicking and fanning of the tail. The plumage is black and white,
    and it has a diagnostic black band across the otherwise white underparts. When
    the tail is fanned, the broad white tips to the feathers are very obvious. The
    upperparts are a dusky black, and there is a thin white eyebrow. Both bill and
    legs are black. It is found particularly in mangroves, open woodland and secondary
    growth at elevations of up to 1500m, and is often present in gardens. A common
    resident throughout the region.


    **GOLDEN WHISTLER** *Pachycephala pectoralis* 17cm


    ![](img/104_1.jpg)


    ![](img/108_1.jpg)


    Morten Strange


    The male of this species has quite brilliant colouring of black, white and bright
    yellow. The yellow nape patch is joined by a narrow yellow band right through
    to the breast, belly and vent, while the head is black except for a white chin
    and throat, leaving a narrow black band between the throat and belly. The upperparts
    are olive-green and the tail is almost black. Females are much duller, having
    drab olive upperparts and dirty buff underparts, with the lower belly and undertail-coverts
    tinged yellow. Found in hill and montane forest in East Java and Bali, but absent
    from Sumatra.


    **GREAT TIT** *Parus major ambiguus/cinereus* 13cm


    ![](img/104_1.jpg)


    ![](img/108_3.jpg)


    Tilford/Cooke, TC Nature


    Of the world’s 33 subspecies of Great Tit, two are resident in the region, both
    very similar in appearance but quite different from those at the extremes of the
    species’ range. Those in Sumatra, Java and Bali are relatively small, black, white
    and grey birds. The head and throat are black, with a black strip from throat
    down to vent; the ventral strip is wide on males, but on females can be very narrow
    and even broken. There is a large white patch on the cheek and a small white nape
    spot. Usually in pairs or small groups foraging for insects, particularly in mangroves
    and open forests, and often comes to gardens.


    **VELVET-FRONTED NUTHATCH** *Sitta frontalis* 12cm


    ![](img/109_2.jpg)


    ![](img/109_1.jpg)


    Tilford/Cooke, TC Nature


    A very active and attractive bird which, unlike other nuthatches in the region,
    is well adapted to creeping both up and down tree trunks in search of insects
    and spiders. It is identified by its red bill and reddish feet, dirty pinkish-white
    underparts and whitish throat. The upperparts are mainly violet-blue, with black-edged
    feathers in the tail and primaries, and the forehead is velvety-black. Usually
    seen in pairs but occasionally in small parties, moving erratically through the
    understorey branches of forests and plantations. Fairly common in lowland and
    hill forests in Sumatra and Java.


    **BLUE NUTHATCH** *Sitta azurea* 13cm


    ![](img/109_2.jpg)


    ![](img/109_3.jpg)


    Chew Yen Fook


    This nuthatch typically forages along branches and tree trunks, levering off fragments
    of bark to get at grubs and insects. In shady forest it appears to have black
    upperparts, but in fact its back, wings and tail are shiny dark blue; only the
    crown, nape and sides of the face are black. The throat and breast are buffish-white.
    East Javan birds (*S. a. azurea*) have a bluish-black lower belly and vent, but
    these are black on West Javan and Sumatran birds (*S. a. nigriventer* and *S.
    a. expectata*). It has a yellow bill and grey feet. Not recorded in Bali, but
    in Sumatra and Java fairly common in lower mountain forests.


    **CRIMSON-BREASTED FLOWERPECKER** *Prionochilus percussus* 10cm


    ![](img/110_2.jpg)


    ![](img/110_1.jpg)


    Chew Yen Fook


    The adult male is brilliantly coloured, with bright yellow underparts being broken
    only by a bright crimson breast patch. The upperparts are greyish-blue, with a
    bright red patch on the crown. The forehead and primaries are black and the tail
    is dark blue-grey. It has a white malar stripe finely underlined in black. Females
    are olive-green above, with only a tinge of orange on the crown, and have a yellow-tinged
    grey throat, a white malar stripe and a yellow belly with greyish-olive flanks;
    the undertail-coverts are distinctively white. A rather scarce and local bird
    of Sumatran and West Javan lowlands.


    **YELLOW-VENTED FLOWERPECKER** *Dicaeum chrysorrheum* 9cm


    ![](img/110_2.jpg)


    ![](img/110_3.jpg)


    Chew Yen Fook


    With its diagnostic plain bright yellow or orange undertail-coverts and its black-streaked
    white remaining underparts, this bird is unmistakable. Juveniles are duller, having
    only a pale yellow vent and greyish underparts with less obvious darker grey streaking.
    It has a repeated contact call, *tzit-tzit-tzit*, uttered especially in flight.
    This little flowerpecker seeks out its diet of insects and small fruits in open
    forest and secondary growth, occasionally venturing into gardens. It is found
    throughout the region’s lowlands, but nowhere is it common.


    **ORANGE-BELLIED FLOWERPECKER** *Dicaeum trigonostigma* 9cm


    ![](img/110_2.jpg)


    ![](img/111_2.jpg)


    This tiny little bird frequents the tops of small trees, searching out small insects
    as well as small ripe fruits. It is very active, flitting among the forest canopy,
    garden trees and mangroves throughout the lowlands of the region. The orange belly,
    vent, rump and lower back, and the blue-grey head, wings and tail are diagnostic
    of the male. The female is pale olive-grey with a grey throat, becoming yellowish
    on the belly, the rump being dirty orange. The bill is black and the legs grey.
    Juveniles look like very dull females lacking yellow or orange.


    **PLAIN FLOWERPECKER** *Dicaeum concolor* 8cm


    ![](img/110_2.jpg)


    ![](img/111_3.jpg)


    Chew Yen Fook


    Very small and rather drab compared with the males of other flowerpeckers, this
    bird is easily confused with females and juveniles of similar species and so may
    be overlooked. Both sexes have olive-green upperparts and greyish-olive underparts,
    becoming whitish-yellow along the centre of the belly up to the throat. Yellowish-white
    pectoral tufts are occasionally visible. It has a black bill, finer than that
    of many other flowerpeckers, and dark grey-blue legs. It inhabits hill forest
    and secondary growth, as well as plantations and cultivated areas, and is attracted
    to mistletoe. Found throughout the region.


    **SCARLET-BACKED FLOWERPECKER** *Dicaeum cruentatum* 9cm


    ![](img/110_2.jpg)


    ![](img/112_2.jpg)


    Males show scarlet-red on the crown, back and rump, and black on the sides of
    the face and neck as well as on the wings and tail. The underparts are greyish,
    with a wide pale buff band down the centre of the belly and on the throat. Females
    are olive-brown with paler throat and belly, have a scarlet rump and uppertail-coverts,
    and lack the reddish-washed crown and mantle of the Scarlet-headed Flowerpecker
    (*Dicaeum trochileum*). A fairly common resident of Sumatran lowland and submontane
    forests, scrub, plantations and gardens, even in cities, it is also attracted
    to mistletoe.


    **BROWN-THROATED SUNBIRD** *Anthreptes malacensis* 13cm


    ![](img/110_2.jpg)


    ![](img/112_3.jpg)


    Chew Yen Fook'
