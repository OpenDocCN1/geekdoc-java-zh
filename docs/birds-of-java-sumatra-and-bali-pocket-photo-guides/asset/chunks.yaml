    许多水鸟在雨季结束时抵达，在洪没地原中孤立树木的安全筑巢。此时也是昆虫繁殖季节的高峰，充足的食物供食虫类物种抚养幼鸟。食果类物种则稍微推迟繁殖，直到树木和灌木结出成熟果实。


    该地区遍布着栖息地多样化的良好观鸟区。显然，在如此长度的书中不可能列出所有地点，但为了引导观鸟者前往一些产出较高的区域，下方介绍了主要的保护区和国家公园。这些地点在附地图上有所显示。


    # 重要观鸟地点


    ## 苏门答腊：


    #### 莱瑟国家公园

    这是一个巨大的雨林和山地地区，并有一小部分沿海和低地延伸。它是探索苏门答腊北部鸟类的理想场所，如犀犀犀、黑犀犀、东方（或亚洲）斑犀犀、盔犀犀和犀犀犀、大凤尾、无冠火雉和冠红雉、棕嘴蜂、黄冠蜂和金须嘴蜂、白腹画鸸、黑黄绿嘴和暗色蜂嘴、冠蓝鹊和红颏蜂虎。


    #### 克 inc 齐-塞布拉特国家公园

    该公园包含了主峰克 inc 齐山和克 inc 齐山谷湿地。这里是观察苏门答腊山地鸟以及几种特有种（如施耐德画留鸟、铜尾孔雀和苏门答腊灰鸫）的最佳地点。那里还有记录的萨尔瓦多迪雉、银耳长鸔、栗顶笑色鸫、白胸白尾莺、巽岛丛莺和金雀鴷。


    #### 望甘巴斯国家公园

    位于苏门答腊东部，望甘巴斯包含了低地雨林的遗迹以及沿海森林和沼泽森林。那里记录了大量物种，包括白翅鸭、风暴白鹭、鱼嘴翡翠、小大鹭、冠火雉、冠红雉、大凤尾、山头六、黑腹蜂嘴和红臀蜂锦鸟、古尔德凤嘴、巽岛凤嘴和大凤嘴、黑腿��隼以及橙胸和肉桂头绿鸽。


    #### 贝尔巴克国家公园

    该保护区位于东海岸，包括沿海森林和泥炭沼泽以及红树林。这里是观察布蒂科费伯鸷、华莱士鹰以及乳鹭和风暴白鹭的好地方。


    #### 南巴里山国家公园

    该公园位于苏门答腊南端，处于巴里山山脉的末端，从大海延伸到普隆山顶，包含了所有的森林类型和一些非常原始的区域。这里记录相对较少，但可能会带来一些有趣的惊喜。该地区较稀有的鸟类中包括苏门答腊树鹊、盔犀犀、红嘴雉、小大鹭以及乳鹭和风暴白鹭。


    ## 爪哇：


    #### 乌戎库隆国家公园

    位于爪哇岛的最西端，乌戎库隆在多种栖息地中拥有许多稀有物种，从低地雨林、常绿森林到沿海灌丛、红树林和开放的牧场。在那里可以找到多达 24 种特有或受危物种，包括爪哇凤贯、白胸蜂鸔、爪哇太阳鸟、爪哇凤雕、蓝喉蜂虎和绿孔雀。


    #### 葛德/潘格朗戈国家公园

    这座位于西爪哇的国家公园主要由茂盛的常绿亚山森林组成，但在潘格朗戈山顶有苔藓矮矮林和高山草甸。它是观察许多爪哇特有种的好地方，如爪哇画鸔、爪哇灰鸫、爪哇凤雕、栗腹红雉、爪哇猫头鹰、爪哇白眼、暗色（霍氏）木镜、小山雀、山雀、火红燕和蓝尾蜂锦。


    #### 梅鲁贝蒂里国家公园

    梅鲁贝蒂里涵盖了大面积湿润的原始和次生林、红树林以及相当崎岖的海岸，并有一些美丽的海滩。它是探索程度较少的地区之一，可能会有新发现。记录的较稀有鸟类包括纹犀犀、斑纹啄木、紫杜谷、针尾凤嘴雀、黑冠画鸔、灰颊绿鸽、黑喉果鸠、爪哇猫头鹰、瀑布（或巨）燕、黑带蜂嘴和月胸蜂鸷。


    #### 巴鲁兰国家公园

    位于爪哇岛东北端，巴鲁兰国家公园环绕着巴鲁兰死火山分布。它是最容易观鸟的地方之一，因为更加开阔且易于到达。观察绿孔雀和绿红丛原鸡的好地方。该地区均有白腹啄木、东方斑犀犀、斑纹木头鹰、斑纹画留、小大鹭和灰颊绿雀鸷。


    #### 波加尔植物园 (Kebun Raya)

    由于交通方便，波加尔植物园在周末挤满了当地游客。然而，工作日的访问在相对的宁静中会非常有收获。波加尔植物园的迷人环境涵盖了 1 平方公里的面积，已建立约两个世纪，提供了观察许多城市和森林鸟类的绝佳机会。那里有一群黑冠夜鹭栖息，很难错过黑喉锦鹊、烟头蜂鸔和东方伯劳画留。其他可能看到的物种包括黑喉灰兜、领羽翡翠、蓝耳翡翠、橄榄背太阳鸟、紫喉太阳鸟、山蓝捕雀和黄喉环嘴鹦鹉。


    #### 潘甘达兰自然游区

    位于爪哇岛南海岸的井拉恰普以西，是潘甘达兰半岛，由自然游区组成。主要由干旱森林组成，是观察绿丛原鸡和斑纹画留的好地方。其他物种包括东方犀犀、鳞冠蜂鸔和黑背翡翠。东部是塞格拉阿纳坎的红树林，在那里可以看到许多水鸟。在大量的鹭、白鹭和燕中，可以看到小大鹭和乳鹭。那里还记录过爪哇凤贯和鱼嘴翡翠。


    ## 巴厘：


    #### 巴厘西国家公园

    位于巴厘岛西部，巴厘西是干旱和湿润森林的混合体，伴有沿海灌丛、草原和红树林。它是发现野生特有种巴厘鸟唯一的地方。许多其他有趣的物种居住在那里，包括斑纹画留、绿丛原鸡、粉头鸽、黑背鸽、闪光噪色鸫、巽岛丛莺和黄腹白眼。


    # 游览公园

    进入国家公园的许可可以在公园入口获得。在大多数印度尼西亚国家公园，诸如步径网络、经验丰富的观鸟导游以及靠近观鸟最佳地点的住宿设施都是有限的。


