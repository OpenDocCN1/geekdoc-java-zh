    ![](img/34_2.jpg)

    ![](img/36_1.jpg)


    Male (left); female (right)


    Chew Yen Fook


    Two subspecies of this wild ancestor of the domesticated fowl exist in the region:
    `G. g. spadiceus` in north Sumatra and `G. g. bankiva` in south Sumatra, Java
    and Bali. Males are recognized by their serrated red comb, face and wattles, their
    long bronze hackles (longer in the north Sumatran race) and their long, dark green
    arched tail feathers; they have a chestnut to golden mantle, and blackish-green
    breast and primary coverts. The females are much duller, being various shades
    of brown, with black streaking on the neck. The bill is buff and the legs slate-grey.
    Found in the more open, scrubby areas of forest edges and clearings.


    ### GREEN JUNGLEFOWL *Gallus varius* male 60cm, female 42cm


    ![](img/34_2.jpg)

    ![](img/36_3.jpg)


    Endemic to Java, Bali and Nusa Tenggara, this large blackish-green fowl is very
    similar to the Red Junglefowl but with an unserrated purplish comb. Males have
    red wattles and bare skin around the eye, a glossy green mantle and nape and iridescent
    green hackles, with uppertail and wing-coverts orange and yellow; the rest of
    the plumage is black. Females have brown upperparts sparsely mottled with buff,
    and buffish underparts mottled with black. This bird prefers the more open grassy
    areas and often associates with grazing animals, which disturb insects on which
    it can feed.


    ### GREAT ARGUS *Argusianus argus* male 120cm, female 60cm


    ![](img/34_2.jpg)

    ![](img/37_1.jpg)


    The Great Argus is one of the most spectacular of the region’s pheasants. The
    males have extraordinarily elongated secondary and tail feathers, used in their
    mating display to attract females. With tail raised high and the wings spread
    wide, the beautiful patterning of green ‘eye’ marks (ocelli) is shown off to perfection.
    The plumage is otherwise mainly chestnut-brown, broken and patterned by spots
    and flecks of buff and black. The female is generally darker, has shorter wings
    and tail, and lacks the male’s ‘eye’ spots. Both sexes have a short dark brown
    crest and bare blue skin on the head and neck.


    ### GREEN PEAFOWL *Pavo muticus* male 210cm, female 120cm


    ![](img/34_2.jpg)

    ![](img/37_3.jpg)


    This spectacular pheasant can be found roaming forest edges and savanna woodland
    by day, roosting in bare trees at night. Predominantly iridescent green, the males
    of this species have conspicuous ocellated tail feathers and a vertical crest
    on the head. Females are similar, but with shorter tail and paler underparts.
    During the breeding season, their mewing and loud pairing calls are very obvious
    and the male’s striking display with tail feathers fanned is unmistakable. Once
    a familiar sight in open woodland, pastures and plantations, this beautiful bird
    has been virtually exterminated by hunting. Within the region, Java’s Ujung Kulon
    and Baluran National Parks are the last remaining strongholds for this species,
    but a few local relict populations exist elsewhere.


    ### SLATY-BREASTED RAIL *Gallirallus striatus* 25cm


    ![](img/38_1.jpg)

    ![](img/38_2.jpg)


    Chew Yen Fook


    Not only is this a very secretive and mainly solitary bird, it is also partly
    nocturnal and therefore seldom seen. Distinguished from other rails in the region
    by its chestnut crown, it has a grey upper breast and white chin. The upperparts
    are brown with fine black and white barring; lower-breast and underparts are white,
    barred with black. The bill has a pink base and a grey tip, while the legs and
    feet are grey. It is a common bird of low wetland habitat such as mangroves and
    marshy areas, as well as paddyfields and even drier areas of dense alang-alang
    grassland.


    ### RUDDY-BREASTED CRAKE *Porzana fusca* 21cm


    ![](img/38_1.jpg)

    ![](img/38_3.jpg)


    This crake is easily confused with three others that frequent the region: the
    Red-legged Crake (`Rallina fasciata`), the Slaty-legged Crake (`Rallina eurizonoides`)
    and the Band-bellied Crake (`Porzana paykullii`). On close observation, it is
    the only one with both head and breast a bright chestnut, with a white chin, and
    blackish-brown underparts finely barred white. Upperparts are plain russet-brown.
    Like the other crakes, it is a shy bird and partially nocturnal, preferring the
    seclusion of paddyfields and reedy habitat and often bushland adjacent to water.
    A relatively common resident found throughout the region’s lowlands.


    ### WHITE-BROWED CRAKE *Porzana cinerea* 27cm


    ![](img/38_1.jpg)

    ![](img/39_2.jpg)


    Chew Yen Fook


    This little crake can be quite noisy by day and night during the breeding season.
    It is easily distinguished from all other small crakes in the region by its conspicuous
    white head markings above and below the black eye-stripe. The tail and wings are
    brown, the back and crown are dark greyish-brown, and the belly, neck and throat
    are white, becoming greyer at the sides. It is ideally adapted to living in marshland,
    rice paddies and flooded vegetation, where its proportionately large long-to-ed
    feet allow it to move around on top of floating vegetation and pick out aquatic
    invertebrates. It is, however, very timid and will run for cover at the slightest
    disturbance.


    ### WHITE-BREASTED WATERHEN *Amaurornis phoenicurus* 33cm


    ![](img/38_1.jpg)

    ![](img/39_3.jpg)


    Chew Yen Fook


    The most conspicuous and easily identified rail found in the region. Its white
    face, foreneck and breast, along with rufous flanks and lower belly, are well
    demarcated from the dark grey-green upperparts. The bill is greyish-green with
    a red base, and the legs and feet yellow. It is very vocal at dawn and dusk, making
    a cacophony of weird squawks, grunts and croaking sounds. It is a wandering feeder,
    frequently out in the open but never far from dense cover. Very agile, it runs
    over floating vegetation and clambers through bushes, searching for insects. More
    often seen alone, but frequently in twos and threes.


    ### COMMON MOORHEN *Gallinula chloropus* 31cm


    ![](img/38_1.jpg)

    ![](img/40_1.jpg)


    Tilford/Cooke, TC Nature


    This very adaptable aquatic bird is almost entirely dark grey to black, with a
    broken white stripe along its flanks. It also displays white patches under the
    tail, particularly when dashing for cover with its tail raised. It has a characteristic
    red frontal shield and bill with a yellow tip. The legs are greenish-yellow. Not
    only is it a good surface swimmer, it will also dive and even run over the water’s
    surface to avoid predators. It feeds mainly on aquatic insects. It frequents freshwater
    pools, lakes and rivers, and is naturally ‘at home’ in the rice paddies. Found
    on almost every continent worldwide, and is also a common resident of Sumatra,
    Java and Bali.


    ### PURPLE SWAMPHEN *Porphyrio porphyrio* 48cm


    ![](img/38_1.jpg)

    ![](img/40_3.jpg)


    A rather clumsy-looking bird, big and brightly coloured, its large size, and blue-black
    plumage, offset by a substantial bright red bill and frontal shield making it
    easily recognized. Its undertail-coverts are white and it habitually flicks its
    tail. Its long, ungainly pink legs with huge spreading claws are ideal for both
    trampling through and over aquatic vegetation. Although not uncommon, it is a
    rather quiet and secretive bird, that keeps to the edges of undisturbed reedbeds,
    marshland and occasionally paddyfields. It is found throughout the region.


    ### GREY PLOVER *Pluvialis squatarola* 28cm


    ![](img/41_1.jpg)

    ![](img/41_2.jpg)


    Tilford/Cooke, T C Nature

