    It otherwise has a dark blue plumage with a chestnut-red forehead. It has brown
    feet and a black bill. This swallow usually forms small parties with other hirundines
    and swiftlets to feed over water. It neither roosts nor nests communally, preferring
    an isolated mud nest fixed under an overhanging ledge, bridge or roof. It is resident
    throughout the region.


