    \ and open forests, and often comes to gardens.\n\n### VELVET-FRONTED NUTHATCH\
    \ `*Sitta frontalis` 12cm\n\n![](img/109_2.jpg)\n![](img/109_1.jpg)\n\nTilford/Cooke,\
    \ TC Nature\n\nA very active and attractive bird which, unlike other nuthatches\
    \ in the region, is well adapted to creeping both up and down tree trunks in search\
