    bill. In flight, long broad wings and longish tail distinguish it from the White-bellied
    Sea Eagle. Mainly a scavenger feeding on carrion, it occasionally takes small
    mammals, frogs and birds. It has a shrill mewing call. Generally associated with
    wetlands, coasts, rivers, lakes, mangroves and mudflats. Found throughout the
    region, but rare in western Java.


    **WHITE-BELLIED SEA EAGLE** *Haliaeetus leucogaster* 68cm


    ![](img/27_2.jpg)


    ![](img/28_7.jpg)


    *Adult (left), Juvenile (right)


    Gerald Cubitt, right*


    One of the very large eagles found in the area, this species is distinguished
    by its magnificent white head, neck and underparts. The rest of the plumage is
    grey, apart from the black primaries. Immatures show buff where adults are white,
    the rest of the plumage being dark brown. It flies with slow, powerful wingbeats
    and occasional glides. It feeds on fish, which it grabs in its talons from the
    water surface after a swift spectacular dive. Occasionally feeds on refuse. This
    eagle can often be seen perched upright in trees or on cliffs. It is a fairly
    common resident, associated with rivers and lakes and especially wooded coasts
    and rocky shores.


    **CRESTED SERPENT EAGLE** *Spilornis cheela* 54cm


    ![](img/27_2.jpg)


    ![](img/28_5.jpg)


    A common eagle, that is often seen over woodland and forests, and often attracts
    attention by its loud, shrill call, *cwee-chee, chee-chee, chee-cheee*. It is
    dark-coloured, the upperparts being a greyish chocolate-brown and the underparts
    similar, but the belly and flanks are spotted with white. It also has a raised
    patch of white-spotted feathers on the top and back of the head, giving the appearance
    of a crest. In flight, the broad white tail-band and the band of white on the
    underwing-coverts are significant. The juveniles appear paler below and on the
    head. It has yellow feet and a greyish-brown bill. Frequently sits in shade high
    in a tree, while observing the landscape below.


    **BESRA** *Accipiter virgatus* 33cm


    ![](img/27_2.jpg)


    ![](img/29_1.jpg)


    Ray Tipper


    Males have uniform dark grey-brown upperparts with a dark greyish-brown head,
    and a white throat with a black mesial stripe. The breast and belly are rufous-grey,
    heavily streaked with black and white in the centre of the upper breast; the lower
    belly is barred white, leading into white undertail-coverts. The tail has a pale
    tip and shows three wide black bars. Females are generally browner. Sumatran birds
    (*A. v. vanbemmeli*) are more rufous. The bill is black and the cere grey. This
    quiet forest bird is confined mainly to mountain and foothill forests, where it
    preys on birds and reptiles. Resident and fairly widespread throughout the region,
    but its population is very sparse.


    **BLACK EAGLE** *Ictinaetus malayensis* 70cm


    ![](img/27_2.jpg)


    ![](img/29_3.jpg)


    C. Inskipp, BirdLife International


    This very dark eagle with its long wings and long tail appears huge in flight.
    Apart from its yellow feet, yellow cere and the grey tip on its bill, it is all
    black. There is slight shading on the tail feathers, giving a barred appearance.
    In flight, a pale area is apparent on the underwing-coverts. Immatures are generally
    paler, with buff streaking. This eagle feeds on mammals, birds and some carrion,
    and is known to raid the nests of other birds for both eggs and young. It prefers
    lowland and the lower hill forests, where it can be seen gliding and circling,
    often in pairs, over the treetops in hunting forays.


    **JAVAN HAWK EAGLE** *Spizaetus bartelsi* 60cm


    ![](img/27_2.jpg)


    ![](img/30_2.jpg)


    Indonesia’s national bird, this raptor is easily identified by its very obvious
    black crest. It has a black moustachial stripe and crown, buff throat and underparts
    streaked black on neck and brown on belly, and white-feathered legs, while the
    sides of the head and nape are a rich russet-brown, blending into dark brown upperparts.
    The tail is brown with black barring. Immatures lack the streaking on the throat
    and breast, having plain reddish-brown underparts. A rare endemic, found only
    in hill and mountain forests and open wooded areas in western Java, and down to
    the coast at Meru Betiri National Park in the east. A last stronghold is in the
    Gunung Halimun National Park.


    **BLACK-THIGHED FALCONET** *Microhierax fringillarius* 15cm


    ![](img/27_2.jpg)


    ![](img/30_3.jpg)'
  toc: []
  trans: '

    这是该地区非常稀有的鹳类动物之一，外形与白颈鹳相似。它上部主要为黑色，胸部为黑色，颈部为白色侧面有黑色斑纹，冠部为黑色。尾部和腹部为白色。在繁殖季节，亮粉色的面部皮肤斑和黄色眼环非常明显。喙略微上翘，呈红色，腿呈粉色。这种鸟只出现在苏门答腊和爪爪爪低地森林的淡水池中，观察这种鸟的好地方是苏门答腊的望坎拉斯（Way
    Kambas）。


    ### 小白鹭 `Leptoptilos javanicus` 110cm


    ![](img/18_2.jpg)


    ![](img/26_1.jpg)


    Chew Yen Fook


    这并不是一种美丽的鸟，而是一种外形奇异的生物。它光秃秃的头上长着巨大的喙，头部、颈部和上胸部有裸露的红皮肤，看起来像变形或生病了。背部、翅膀和尾部为深灰色，下部和背上部为白色。喙和腿呈灰色。幼鸟上部为棕灰色，下部为脏白色。捕猎和栖息地丧失导致这种鸟在爪哇和巴厘岛变得稀有，但在苏门答腊南低地地区仍然当地常见。它是群居性鸟，经常与其他鹳类和猛禽一起在热气流中翱翔。


    ### 绿翅 `Plegadis falcinellus` 60cm


    ![](img/18_2.jpg)


    ![](img/26_3.jpg)


    该地区唯一全深色羽毛的鹭，这种鸟呈黑褐色，并带有绿色、紫色和青色的虹彩光泽。幼鸟为深褐色，头部和颈部有黄褐色条纹。通常成小群出现在稻田、沼泽和湖边，在那里用长喙在泥土中觅食。它们在夜间栖息地和繁殖群中经常与白鹭和鹭类在一起。看到这种鸟的好地方是位于双峰岛（Pulau
    Dua）的唯一爪哇繁殖群。尽管这种鹭几乎遍布全球，但在该地区并不常见。


    ### 蓝脸��� `Elanus caeruleus` 30cm


    ![](img/27_2.jpg)


    ![](img/27_1.jpg)


    初看，特别是在飞行时，这种优雅的小猛禽可能被误认为是海鸥。它灰色的上部和白色的下部，加上长长的黑色初级羽和相当方形的尾巴，可能会引起混淆。它的独特特征是黑色的肩斑，以及它经常像红隼一样在悬停，然后俯冲捕猎物。它偏好开阔的乡村，可以在稀疏林地的干旱地区、森林和种植园边缘以及耕地地区发现。也可以在路边看到它们，它们栖息在老树暴露的树枝和电线杆上。近年来数量有所下降。


    ### 印度白鸢�� `Haliastur indus` 45cm


    ![](img/27_2.jpg)


    ![](img/27_3.jpg)


    这种相当常见的棕白色�鸢��主要可见在热气流中翱翔，偶尔成小群出现。成鸟为深红褐色，带有对比明显的黑色初级羽；头部和颈部为白色。它有暗黄色的脚和淡绿灰色的喙。飞行时，宽大的双翅和较长的尾巴使其与白腹海雕区分开来。它主要是以腐尸为食的食者，偶尔也捕食小型哺乳动物、蛙类和鸟类。它有尖锐的鸣叫声。通常与湿地、海岸、河流、湖泊、红树林和泥滩有关。遍布于整个地区，但在爪哇西部稀有。


    ### 白腹海雕 `Haliaeetus leucogaster` 68cm


    ![](img/27_2.jpg)


    ![](img/28_7.jpg)


    *成鸟（左），幼鸟（右）


    Gerald Cubitt, 右*


    这是该地区发现的大型鹰之一，其特征是壮丽的白色头部、颈部和下半部。除了黑色初级羽外，其余羽毛均为灰色。幼鸟在成鸟白色的地方呈黄褐色，其余羽毛为深褐色。它飞行时翅膀扇动缓慢而有力，偶尔会滑翔。它以鱼为食，在快速而壮丽的俯冲后用爪子从水面抓鱼。偶尔取食垃圾。这种鹰经常可以看到它直立地栖在树上或悬崖上。它是一种常见的居民，与河流、湖泊，特别是森林茂密的海岸和岩岸有关。


    ### 冠蛇雕 `Spilornis cheela` 54cm


    ![](img/27_2.jpg)


    ![](img/28_5.jpg)


    一种常见的鹰，经常出现在林地和森林上方，并因其响亮尖锐的叫声 `cwee-chee, chee-chee, chee-cheee` 吸引注意力。它是深色的，上部为灰巧克力褐色，下部也相似，但腹部和侧腹有白色斑点。它的头部顶部和背部有一块隆起的白色斑点羽毛，看起来像羽冠。飞行时，宽大的白色尾带和翅下羽上的白色条带非常显著。幼鸟的下部和头部看起来较浅。它有黄色的脚和灰褐色的喙。经常坐在高树的阴影中，观察下方的景观。


    ### 锦��� `Accipiter virgatus` 33cm


    ![](img/27_2.jpg)


    ![](img/28_5.jpg)


    Ray Tipper


    雄性具有均匀的深灰褐色上部，头部为灰褐色，白色喉部带有黑色中线纹。胸部和腹部为红灰色，布有黑色斑纹；下腹部白色进入垫尾羽。尾巴末端呈浅色，有三条黑纹。雌性通常较棕。苏门答腊个体（`A.
    v. vanmeli`）更红。喙为黑色，鼻基为灰色。这种安静的森林鸟主要局限于山地和丘陵森林，捕食鸟类。它是留鸟，遍布整个地区，但数量非常稀少。


    ### 黑鹰 `Ictinaetus malayensis` 70cm


    ![](img/27_2.jpg)


    ![](img/29_3.jpg)


    C. Inskipp, BirdLife International


    这种长翅长尾的深色鹰飞行时看起来巨大。除了黄色的脚、黄色鼻基和灰色的喙尖，全身黑色。尾羽上有轻微的阴影，呈现条纹状。飞行时，翅下羽上有明显的浅色区域。幼鸟通常较浅，带有黄褐色条纹。这种鹰以哺乳动物、鸟类和一些腐尸为食，已知会袭击其他鸟类的巢穴捕取蛋和幼鸟。它偏好低地和低丘陵森林，在那里可以看到它们成对地在树冠上方滑翔和盘旋捕猎。


    ### 爪哇��� `Spizaetus bartelsi` 60cm


    ![](img/27_2.jpg)


    ![](img/30_2.jpg)


    作为印度尼西亚的国鸟，这种猛禽通过其非常明显的黑冠即可轻松识别。它有黑色的颊纹和冠部，黄褐色的喉部和下部颈部有黑色条纹，腹部为棕色，腿部长有白色毛，而头部侧面和后脑为深赭褐色，融入深褐的上部。尾巴为棕色带黑纹。幼鸟缺乏喉部和胸部的条纹，下部为纯红褐色。这种稀有的本土种，仅发现于爪哇西部的丘陵和森林以及开阔林地，一直延伸东部的梅鲁贝蒂里国家公园（Meru
    Betiri）海岸。最后的基地位于古哈林山国家公园（Gunung Halimun National Park）。


    ### 黑腿���隼 `Microhierax fringillarius` 15cm


    ![](img/27_2.jpg)


    ![](img/30_3.jpg)


    '
- fmt: '

    This minute falcon has black upperparts, but shows white spotting on the tail
    and secondaries. The crown is black, edged with a white patch above the bill and
    a white stripe behind the eye, and the sides of the face and ear-coverts are black.
    The chin and belly are rufous with white margins. Although primarily insectivorous,
    feeding on dragonflies and grasshoppers, it has also been known to attack larger
    prey, including small birds. It lives along edges of forests and mangroves and
    in open country and scrub, and is sometimes seen hunting over paddyfields. Now
    quite rare in Bali and Java, it has nevertheless managed to survive in reasonable
    numbers in the wooded lowlands of Sumatra.


    ### WANDERING WHISTLING-DUCK *Dendrocygna arcuata* 45cm


    ![](img/31_1.jpg)


    ![](img/31_2.jpg)


    Morten Strange


    Also called the Whistling Tree-duck, this species makes a series of high-pitched
    whistling and twittering calls in flight. Its plumage is generally a deep chestnut-brown
    on the back, tail and breast, but with white undertail-coverts and rump, and a
    line of black-edged white feathers showing below the folded wing. The head and
    neck are a paler brown, and there is a dark brown elongated cap running down the
    back of the neck. The legs are blackish-brown and the bill black. Fairly common
    throughout the region on wet marshland and on freshwater lakes, where it can be
    seen diving for food.


    ### LESSER WHISTLING-DUCK *Dendrocygna javanica* 41cm


    ![](img/31_1.jpg)


    ![](img/31_3.jpg)


    Very similar in appearance to the Wandering Whistling-duck, this species is slightly
    smaller and has no black and white feathers showing below the wing. Its back,
    crown and underparts are a reddish-brown, but the head and neck are buff. There
    is often buff streaking along the flanks. The feet are dark grey and the bill
    black. It calls in flight with a repetitive shrill whistling phrase. It frequently
    uses trees to roost and rest, and normally nests in tree holes. This is a gregarious
    duck, usually found in small groups in paddyfields, swamps and mangroves and on
    lakes. It is resident throughout the region.


    ### WHITE-WINGED DUCK *Cairina scutulata* 75cm


    ![](img/31_1.jpg)


    ![](img/32_1.jpg)


    With an estimate of only about 250 individuals worldwide, this large black and
    white wood duck is seriously endangered. It is a dark-coloured duck with a white
    head, that of the female being spotted with grey. The back is blackish with green
    iridescence and the underparts brown. The wing has white lesser-coverts and a
    greyish-blue speculum. The bill is yellow, tipped black, and the feet dirty yellow-orange.
    A few of these ducks are located in West Java, and the old logging area at `Way
    Kambas` in south-east Sumatra is one of the places where it still hangs on, albeit
    in small numbers. Here, the dense lowland swamp forest provides conditions to
    its liking.


    ### COTTON PYGMY-GOOSE *Nettapus coromandelianus* 30cm


    ![](img/31_1.jpg)


    ![](img/32_3.jpg)


    Unlike most wildfowl, this species regularly perches in trees and normally nests
    in tree holes. It is a small black and white duck, the male being predominantly
    white, with iridescent black plumage on the crown, back, wings and tail and a
    black neck band. The female’s plumage is more subdued, being buffish-white where
    males are white and brown where males are black; she has a brown eye-stripe and
    lacks the neck band. In flight, males show a white wing patch. This bird prefers
    a habitat of marshland and lakes, as well as flooded paddy fields and grassland.
    It occurs in south Sumatra and West Java.


    ### SUNDA TEAL *Anas gibberifrons* 42cm


    ![](img/31_1.jpg)


    ![](img/33_1.jpg)


    This small grey-brown duck is probably the commonest duck of the region, but particularly
    so in Java and Bali. It is easily distinguished by its unusual bulging forehead.
    Its sides and back are russet-brown, and it shows a blackish, iridescent blue-green
    wing speculum. The head and neck are pale buffish-brown, with a dark brown crown.
    It has grey legs and feet, and the bill is pale grey-blue, turning yellowish towards
    the tip. It can often be located near water at night by the female’s eerie cackling
    call. Usually in pairs or small groups, often way inland on ponds, rivers and
    lakes, as well as in mangroves.


    ### PACIFIC BLACK DUCK *Anas superciliosa* 55cm


    ![](img/31_1.jpg)


    ![](img/33_3.jpg)


    The name ‘black duck’ is a misnomer, for this bird’s body plumage looks black
    only in flight when contrasted with the conspicuous white underwing plumage. It
    is actually dark brown, with the head striped black and white. The speculum is
    iridescent green and purple, the legs are yellow-brown and the bill is grey. It
    is a surface-feeding duck which dabbles in shallow water. A resident, confined
    mainly to the mountain lakes of East Java and Bali, but often found feeding on
    marshy areas and grassland. A favourite haunt for it in Bali is the sewage farm
    at `Nusa Dua`.


    ### BLUE-BREASTED QUAIL *Coturnix chinensis* 14cm


    ![](img/34_2.jpg)


    ![](img/34_1.jpg)


    Although the male is distinctive, females are easily confused with the Small and
    Barred Quails. The Blue-breasted Quail’s yellow feet are the main recognition.
    The underparts are brown, with white-striped across the chest; she has a whitish
    throat patch and buffish eye-stripe. The newly hatched young are tiny.


    ### CHESTNUT-BELLIED PARTRIDGE *Arborophila javanica* 25cm


    ![](img/34_2.jpg)


    ![](img/34_3.jpg)


    Endemic to Java, this partridge occurs in three subspecies. Confined to the west
    and central parts of the island, each has a head pattern of reddish-buff with
    black markings and a black collar. The breast is grey, varying through chestnut
    to a white vent. The flanks are chestnut, the back and tail grey-brown and barred,
    and the wings brown with small spots. The feet are red.


    ### CRESTED PARTRIDGE *Rollulus rouloul* 25cm


    The very distinctive male sports an ostatious tufted, spiky red crest above a
    white crown patch. His overall plumage is blackish-blue with a purple sheen, appearing
    green towards the tail; the wings appear dark red-brown. Females lack the crest,
    and have green body plumage and a grey head; they both have red legs and bare
    red skin around the eye. The bill is black, but males show some red at the base.
    Congregates.


    ### CRESTED FIREBACK *Lophura ignita* 55cm


    ![](img/34_2.jpg)


    ![](img/35_3.jpg)


    *Male (left); female (right)*


    It is extremely unfortunate that this beautiful pheasant, once common in the forests
    of Sumatra, Borneo and the Malay Peninsula, now occurs only sporadically. Destruction
    of the habitat and hunting have reduced its numbers to isolated populations in
    the more remote and secluded forests. Sumatran birds have a very dark blue, almost
    black, body with a tufty black crest and a red patch on the rump and lower back;
    the belly and flanks are faintly streaked with white. The extended and arched
    central tail feathers are white. Females are brown, with white-striped underparts.
    These are ground-living birds which forage like chickens for fallen fruit, seeds
    and insects.


    RED JUNGLEFOWL *Gallus gallus* male 75cm, female 46cm

