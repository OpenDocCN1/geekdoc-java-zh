    it calls. Also known as the Lesser Sulphur-crested Cockatoo, this bird is endemic
    to Sulawesi and the Lesser Sundas, with a population on Nusa Penida, Bali, and
    another on Mesalembu Besar in the Java Sea. Has been widely exploited by the pet
    trade.


    **YELLOW-THROATED HANGING PARROT** *Loriculus pusillus* 12cm


    ![](img/54_1.jpg)


    ![](img/55_2.jpg)


    Tilford/Cooke, TC Nature


    These very small and well camouflaged parrots are more often seen in the treetops,
    clambering around and hanging, often upside-down, to feed on flowers and small
    fruits. They fly around in small flocks, often making high-pitched shrieking calls.
    They are mainly leaf-green, with brighter yellow-green underparts, and are particularly
    difficult to observe as their colouring blends in so well with the foliage. Males
    have a small yellow patch on the throat. The feet and bill are orange. A fairly
    common endemic of Java and Bali, inhabiting lowland rainforest.


    **SUNDA CUCKOO** *Cuculus lepidus* 26cm


    ![](img/54_1.jpg)


    ![](img/55_3.jpg)


    Tilford/Cooke, TC Nature


    This very secretive species spends much of its time high in the forest canopy,
    and is very quiet outside the breeding season. In February and March, it can be
    heard giving its three-syllable *hoop, hoop-poop* call. This quite small cuckoo
    has a grey breast and upperparts and a dark grey tail; the underparts are buff,
    barred black. It has a yellow eye-ring, grey bill and dirty orange-yellow feet.
    There is an hepatic form of the female which has black-barred rufous upperparts
    and white-barred underparts, very similar to the juveniles. Formerly regarded
    as a race of Oriental Cuckoo (*C. saturatus*), which also occurs during the winter.


    **DRONGO CUCKOO** *Surniculus lugubris* 24cm


    ![](img/56_2.jpg)


    ![](img/56_1.jpg)


    Morten Strange


    This predominantly black cuckoo has a forked tail like a drongo. Its plumage is
    shiny black, apart from white bands on the undertail-coverts and all-white thighs.
    The bill is black and the legs are grey. The plumage of the juvenile is flecked
    with white and the white tail-bands are wider. Although shy, this species has
    a loud, clear call consisting of an ascending scale of up to seven notes and less
    often a series of warbled notes. It occurs in the lowlands throughout the region,
    both as a resident and as a migrant, but its timid nature confines it mainly to
    forests and forest edges.


    **ASIAN KOEL** *Eudynamys scolopaceus* 42cm


    ![](img/56_2.jpg)


    ![](img/56_3.jpg)


    *Male (left); female (right)*


    Chew Yen Fook


    This bird’s loud call, a shrill repeated *koel, koel, koel* …, is the origin of
    its name. Its other call, a loud and accelerating *kow-wow, kow-wow, kow-wow*
    …, can be heard by day and night, but you will be lucky if this very timid bird
    reveals itself. Like others of the cuckoo family, it is a brood-parasite, searching
    out nests of orioles, crows and drongos in which to deposit its eggs. The adult
    male is glossy black, with a long tail, buff bill and red eye-ring. The female
    is grey to golden-brown, with heavy white speckling and barring.


    **RED-BILLED MALKOHA** *Phaenicophaeus javanicus* 46cm


    ![](img/56_2.jpg)


    ![](img/57_2.jpg)


    Tilford/Cooke, TC Nature


    Separated from other malkohas of the region by its large size and strong red bill.
    The upperparts are mid-grey but tinged with a pale bluish-green iridescence. The
    underparts are chestnut with a grey band across the upper breast and the grey
    tail feathers are tipped with white. The eye is surrounded by a bare patch of
    blue skin and the legs are grey. Found in the lowland and lower hills of Java
    and Sumatra, it prefers forest edges and secondary scrub. It usually moves about
    in pairs or small family groups often foraging amongst alang-alang grassland.
    It has a ‘whining’ call.


    **CHESTNUT-BREASTED MALKOHA** *Phaenicophaeus curvirostris* 50cm


