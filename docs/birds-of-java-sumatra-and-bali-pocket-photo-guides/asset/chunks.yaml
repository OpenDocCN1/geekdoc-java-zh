    这是一种较小的犀嘴鸟，其厚实且下垂的冠是易于识别的特征。它的羽毛全黑，只有尾巴的上三分之二呈灰褐色。喉部的裸露斑块为蓝色，眼睛周围为蓝色或白色。脚部是黑色的，雄性的喙也是黑色的。雌性的喙是灰色的，尽管有时呈白白色。这种犀嘴鸟在繁殖季节外群群性，多达十五只鸟的喧闹群体会聚集在树冠高处一起觅食。它们分布于苏门答腊的低地森林。


    # 凤冠犀嘴 *Aceros undulatus* 100cm


    ![](img/68_1.jpg)

    ![](img/69_2.jpg)


    除了白色的（通常是脏黄色）尾巴和雄性带有栗色冠的奶油头部外，其余羽毛均为黑色。雄性具有裸露的黄色喉囊，而黑头雌性的喉囊是蓝色的。像所有的犀嘴鸟一样，它们在筑巢时依靠空心树木，雄性在孵化期间用泥土限制入口洞的大小，雌性在孵化后也这样做，直到幼鸟准备离巢。它们特别喜欢无花，但也吃其他水果和昆虫。虽然在苏门答腊的低地和山地森林很常见，但它们在爪哇和巴厘的分布局限于少数剩余未受干扰的森林。


    # 亚洲白嘴犀 *Anthracoceros albirostris* 75cm


    ![](img/68_1.jpg)

    ![](img/69_3.jpg)


    陈永福 (Chew Yen Fook)


    这种物种以黑色羽毛为主，胸部、腹部和两侧为白色，眼睛后方下喙基部也有白色斑块。巨大的角质喙上方覆盖着一个香蕉形状的头盔，前端有黑色标记。尾巴呈现出不同程度的黑白相间，尤其是外层羽。它们通常以小群形式出现，发出非常像鸡的
    *puk-puk-puk-puk* 咯咯声；还会发出响亮、刺耳且咯咯的笑声。栖息在整个巽他大群岛较偏远低地森林和次生森林的边缘及空地。


    # 犀犀鸟 *Buceros rhinoceros* 110cm


    ![](img/68_1.jpg)

    ![](img/70_2.jpg)


    陈永福 (Chew Yen Fook)


    虽然巴厘岛没有，但这种犀嘴鸟给人的感觉数量比实际要多。这是一种体型巨大、声音响亮的鸟，通常成对出现并在飞行中合唱，给人一种数量很多的错觉。它的头部、胸部、翅膀和背部是黑色的，下腹部是脏白色。尾巴是白色的，有一条宽黑带。飞行时可以通过其全黑的翅下、白色腹部和条纹尾巴来识别。巨大的黄色喙基部变为红色，上方覆盖着向上翘的头盔。在苏门答腊和爪哇大部分山地和低地森林中分布密度较低。


    # 大犀嘴 *Buceros bicornis* 125cm


    ![](img/68_1.jpg)

    ![](img/70_3.jpg)


    通常成对出没，这种巨大的犀嘴鸟在高层树冠中喧闹地觅食。它们的叫声可以描述为响亮而刺耳的犬吠声。巨大的黄色喙和头盔、黑色的脸、染有黄色的白颈和上胸，以及白色尾巴上的黑色末带，将其与该地区其他犀嘴鸟区分开来。背部、下腹部和翅二级是黑色的，白色翼缘常被染成黄色。这种稀有物种局限于低地和亚山地森林，范围从印度跨越东南亚、马来半岛直到苏门答腊。


    # 火焰顶蜂鸟 *Psilopogon pyrolophus* 26cm


    ![](img/71_1.jpg)

    ![](img/71_2.jpg)


    和大多数蜂鸟一样，主羽毛为亮绿色。这种物种胸部有一条黄色横带，下方由一条黑线勾勒。后脑冠和颈部为红色，下巴为绿色，耳羽为灰色，眼纹和额头为黑色，在眼间处有一有一个明显的红尖黑色毛簇。它们非常喜欢熟实果，特别是小无花果，它们会长时间静静地坐在高树上，同时经常发出刺耳的嗡嗡声，听起来像蝉。局限于马来半岛和苏门答腊，在那里它们偏爱低矮丘的高树。


    # 纹纹蜂鸟 *Megalaima lineata* 29cm


    ![](img/71_1.jpg)

    ![](img/71_3.jpg)


    这种蜂鸟有绿色的背部、翅膀和尾巴，棕色的头部和上胸部有密集的黄色斑纹。其余下部为绿色，也有黄色斑纹。它有宽宽的橙黄色裸皮眼圈。重的喙呈淡粉色，脚是黄色的。它们经常出现在稀疏的干燥沿海林地、草原边缘、金合树森林、果园和耕作区。在苏门答腊未发现，但在爪哇和巴厘偏远地区的开放森林、森林边缘和空地是相当常见的居民。


    # 红冠蜂鸟 *Megalaima rafflesii* 25cm


    ![](img/71_1.jpg)

    ![](img/72_2.jpg)


    亮红色冠、黄色脸颊和蓝色喉咙的组合是这种中型蜂鸟的诊断特征。主羽毛为亮绿色，眼睛后方的红色斑块融入了耳羽的黑色。喙是黑色的，脚是灰色的。幼鸟外观暗得多。像它的其他成员一样，它们在树洞中筑巢。这种相当常见的蜂鸟栖息在低地森林。


    # 黑带纹蜂鸟 *Megalaima javensis* 26cm


    ![](img/71_1.jpg)

    ![](img/72_3.jpg)


    Cheford & Nature (Cheford & Nature)


    体型较大，羽毛和尾巴为绿色，眼睛下方有一个黄色斑点。细的黑色颈环将红色和黄色的颈部分开。冠是蓝色的。爪哇和巴厘的亚种在脸颊和黑色胸纹下方有黄色。苏门答腊亚种缺乏黄色但脸颊为红色。这种巴厘和爪哇的特有种在空地和森林边缘较容易遇到。


    # 蓝耳蜂鸟 *Megalaima australis* 18cm


    ![](img/71_1.jpg)

    ![](img/73_1.jpg)


    Morten Strange


    一种小型蜂鸟，听见的比看到的多，但仔细检查果实树通常能发现它们。该物种的叫声是快速重复的 *tuk-trrk, tuk-trrk* 以及一系列高频哨音或颤音。该地区有两个亚种，都有绿色羽毛、黑色颊纹和胸纹，以及蓝色的下巴和冠。爪哇亚种脸颊有黄色，而苏门答腊亚种脸颊为红色。这是森林和种植园中常见的蜂鸟，分布从海岸到低丘。


    # 铜甲蜂鸟 *Megalaima haemaceala* 15cm


    ![](img/71_1.jpg)

    ![](img/73_3.jpg)


    Cheford & Nature (Cheford & Nature)


    拉长的共鸣 *tonk-tonk-tonk-tonk* 叫声听起来像敲击金属，宣告了这种鸟的存在。虽然它们经常出现在开阔地带的树上，但也进入城市花园和公园。通常独居，但在果实树上经常与其他蜂鸟聚集。背部、翅膀和尾巴为绿色，浅褐色下部有黑色斑纹。爪哇和巴厘的亚种具有红冠、下巴、喉咙和脸颊，苏门答腊亚种喉咙、脸颊和眉纹为黄色。它是整个范围内开放低地森林中相当常见的居民。


    # 斑纹啄鸟 *Picus vittatus* 30cm


    ![](img/71_1.jpg)

    ![](img/74_1.jpg)


    Morten Strange


