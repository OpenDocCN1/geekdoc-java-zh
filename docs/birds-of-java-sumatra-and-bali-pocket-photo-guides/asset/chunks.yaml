    这种非常熟悉的鸽子羽毛通常呈粉褐色，飞行羽颜色稍深，背部有深色斑点。它颈部两侧各有一块明显的带有白色斑点的黑色斑块。尾羽外羽末端有宽宽的白色，这在飞行时非常明显。它有红色的脚和黑喙。它经常出现在人类定居点附近，从城市花园到农村耕地，以及低地地区的开阔地带和森林边缘，在地上觅食。在整个巽他群岛非常常见，并在全球范围内作为笼鸟饲养，在人造鸟舍中繁殖。


