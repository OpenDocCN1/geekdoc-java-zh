  raw: 'In breeding plumage, the male has a bright yellow crown and nape and black
    cheeks and throat, the upperparts being streaked and mottled dark and light brown
    and the underparts buff. Females have the crown streaked and mottled brown, a
    whitish chin, a buff eyebrow, and light brown cheeks and upper breast. This master
    nest-builder suspends its tightly woven grass nest from the leaf of a palm tree
    or convenient branch, the tunnel entrance below the globular nest body ensuring
    protection from rain and predators. Numerous nest s are concentrated on isolated
    trees. Found mainly in open areas of the lowlands and hills of Sumatra and West
    Java, it has become rather scarce in East Java and Bali.


    **ASIAN GLOSSY STARLING** *Aplonis panayensis* 20cm


    ![](img/124_1.jpg)


    ![](img/124_2.jpg)


    Tilford/Cooke, TC Nature


    Adults are all-black and can be separated from the Short-tailed Starling by being
    larger and having a green iridescence. Juveniles have black-streaked whitish underparts,
    with upper-parts streaked black and brown. Both have dark red eyes. Feeds mainly
    on soft ripe fruits hanging on the trees, but also takes insects, rarely visiting
    the ground. Often congregates in big noisy flocks to roost and also nests colonially.
    A common lowland bird of open areas near forest and secondary vegetation and coastal
    scrub, but also attracted to coconut plantations and cultivated areas and gardens,
    frequently in towns and cities. It is found throughout the region.


    **ASIAN PIED STARLING** *Gracupia contra* 24cm


    ![](img/124_1.jpg)


    ![](img/124_3.jpg)


    Tilford/Cooke, TC Nature


    This bird’s gregarious nature is evident in its communal night-time roosting habits
    and its daytime feeding behaviour, when small flocks probe and search the ground
    for insects and other invertebrates. Like many starlings, it is noisy and utters
    the typical squawks and whistles of its family. The upperparts are mainly black,
    tinged brown. It has a white wingbar, with forehead, cheeks, belly, vent and rump
    also white. Bare orange skin around the eye, yellow feet and white-tipped orange
    bill give the bird a colourful appearance. Common in Java, Bali and south Sumatra,
    especially in more open and cultivated lowland country.


    **BLACK-WINGED STARLING** *Acridotheres melanopterus* 23cm


    ![](img/124_1.jpg)


    ![](img/125_2.jpg)


    Tilford/Cooke, TC Nature


    This striking starling is all white, apart from black wings and tail and a yellow
    patch of bare skin around the eye. The tail is tipped white and there is a white
    wingbar. Three subspecies occur which differ in the amount of black in the plumage,
    birds in the west of the region becoming much lighter and having black only on
    flight feathers and tail. It lives in pairs or small groups and is attracted to
    short grassland and even mown lawns. Endemic to Java, Bali and Lombok, but often
    seen as a cagebird throughout the region. It is in fact a protected species, and
    is now thought to be declining in number. However, it may still be found in the
    open lowlands, and can be seen in some towns and gardens in East Java and Bali.


    **BALI MYNA** *Leucopsar rothschildi* 25cm


    ![](img/124_1.jpg)


    ![](img/125_3.jpg)


    This beautiful myna is endemic to Bali. Its distinctive plumage is entirely white,
    apart from black wing-tips and the tip of the tail. It has a long white crest,
    and a patch of sky-blue skin around the eye. It prefers the drier lowlands of
    West Bali. This is one of the world’s most threatened species, with very few birds
    now surviving in the wild. The destruction of habitat and collecting for the pet
    trade are the main causes of its decline, but efforts are being made worldwide
    to secure its future by increasing the protection it receives and by establishing
    a captive-breeding and release programme.


    **HILL MYNA** *Gracula religiosa* 30cm


    ![](img/124_1.jpg)


    ![](img/126_2.jpg)


    Another species under great pressure from habitat loss and trapping for the pet
    trade, this bird is particularly in demand for its ability to mimic, as well as
    for its own enormous repertoire of whistles and calls. It is black overall, with
    orange wattles both behind and below the eye, and has a white wingbar. It has
    yellow feet and an orange bill. Although it occasionally congregates in small
    flocks, it is more likely to be seen in pairs in tall trees. Once a common bird
    of lowland forest edge, it has become rare in Bali and Java but remains in reasonable
    numbers in Sumatra.


    **BLACK-NAPED ORIOLE** *Oriolus chinensis* 26cm


    ![](img/124_1.jpg)


    ![](img/126_3.jpg)


    The male is a brilliant yellow, with a distinct black stripe passing through the
    eye and across the nape. The flight feathers and tail are black, edged yellow.
    The female is much duller. Juveniles show olive where adults show black, and they
    have black-streaked whitish underparts. Keeps to the tree canopy while foraging
    for insects and soft fruit. A fairly common bird throughout the region’s lowlands
    and hills, favouring secondary and open forest, parks and gardens, mangroves and
    coastal scrub. Widely kept as a cagebird throughout the region for its melodious
    fluting calls and brilliant colouring.


    **BLACK-AND-CRIMSON ORIOLE** *Oriolus cruentus* 22cm


    ![](img/124_1.jpg)


    ![](img/127_1.jpg)


    Chew Yen Fook


    This is a bird of the treetops, rarely seen on the ground. It often occurs in
    pairs, but frequently alone, as it forages for insects and ripened fruit. It has
    a cat-like mewing call. Easily identified as a medium-sized oriole, the males
    having all-black plumage apart from the crimson-red upper belly and a small crimson
    patch on the primary coverts. It has a distinctive pale blue-grey bill and blue-black
    legs. Females are all black, with the breast tinged chestnut and streaked with
    grey on the belly. Found mainly in the hill forests of Sumatra, but less so in
    Java and not at all in Bali.


    **BLACK DRONGO** *Dicrurus macrocercus* 28cm


    ![](img/124_1.jpg)


    ![](img/127_3.jpg)


    Unlike most other drongos, this one favours open country and often associates
    with cattle, which disturb insect prey. It is frequently seen in open scrub, cultivated
    land and rice paddies, where it perches rather conspicuously on fencing, isolated
    branches and telephone wires alongside roads. It has dull black plumage, with
    a long, deeply forked tail with outer feathers which tend to turn outwards at
    the tips. Juveniles show pale grey barring on the underparts. A common resident
    of Java and Bali, but the few birds found in Sumatra are thought to be migrants.


    **ASHY DRONGO** *Dicrurus leucophaeus* 29cm


    ![](img/128_2.jpg)


    ![](img/128_1.jpg)


    Chew Yen Fook


    Usually observed in pairs waiting on exposed branches to swoop on large passing
    insects, this drongo has the typical long, forked tail and upright stance. Its
    plumage is light blue-grey, with a tuft of black feathers at the base of the upper
    mandible. There are five subspecies within the region, all differing slightly
    in their grey coloration. Mimics other birds, and has mewing-type calls as well
    as a loud song. A common bird of open woodland and forest edge and clearings,
    resident throughout the region’s hills and mountains.


    **LESSER RACKET-TAILED DRONGO** *Dicrurus remifer* 26cm


    ![](img/128_2.jpg)


    ![](img/128_3.jpg)


    This spectacular drongo, fairly big and glossy black, has a square-ended tail
    with extended outer tail-streamers which are about 50cm long. Each streamer consists
    of a feather shaft which terminates with an elongated oval web around 10cm long.
    A substantial tuft of short black feathers covers the base of the upper mandible,
    creating a long-headed appearance. It is smaller than the Greater Racket-tailed
    Drongo, has no frontal crest, and has no fork in the tail. Inhabits dense montane
    forest and secondary forest, especially along the edges, in Sumatra and West Java.


    **HAIR-CRESTED DRONGO** *Dicrurus hottentottus* 32cm


    ![](img/128_2.jpg)


    ![](img/129_2.jpg)


