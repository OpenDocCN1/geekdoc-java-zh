    这是一种群性活跃且胆怯的小鸟，由于成群活动且在茂密的植被中觅食，因此很难观察。它可以通过约三四个音节、如铃般的清脆叫声来识别，并以一个短促的颤音结束。和大多数大多数针缝鸟一样，它的背部呈橄榄绿色，尾部高翘。除了额头呈橙色外，头部和上胸呈灰色，但喉部和胸部中心颜色较浅，其余下腹和泄殖处呈亮黄色。它是该地区山区森林的居民，更常见于竹林、常绿林和灌木丛。


    ### 灰腹针缝鸟 *Orthotomus ruficeps* 11cm


    ![](img/99_2.jpg)


    ![](img/102_1.jpg)


    Tilford/Cooke, TC Nature


    一种小型且颜色相当平淡的针缝鸟，背部呈褐色，下部呈灰色，腹部变为白色。雄性具有深褐色的脸部、冠部和喉部，而雌性具有白色喉部和颜色浅得多的褐色脸部和冠部。这种充满活力的小鸟经常出现在较开阔的低地森林中，在树冠间觅食。它也出现在红树林和沿海灌木丛、竹林以及植被良好的花园中。在苏门答腊常见，但在爪哇仅发现于北部湿地地区，在巴厘岛没有分布。


    ### 北林莺 *Phylloscopus borealis* 12cm


    ![](img/99_2.jpg)


    ![](img/102_3.jpg)


    David Tipling, Windrush Photos


    这种小型叶莺花费大量时间在林木区觅食寻找昆虫，经常伴随着其他莺类和小型食虫鸟。它可以通过其眼部在黑色眼纹上方显眼的、长长的黄白色眉纹来识别。它还有一条模糊不清的单条白色翼斑。背部为深橄榄绿色，下部几乎为白色，在侧腹过渡为橄榄褐色。它与较小的黄眉莺或无纹林莺（*Phylloscopus
    inornatus*）相似，但颜色暗淡得多，翼斑较不明显。它是来自亚洲北部的冬季候客，通常发现于原生和次生低地森林边缘及红树林。


    ### 三纹绿林莺 *Phylloscopus trivirgatus* 11cm


    ![](img/99_2.jpg)


    ![](img/103_1.jpg)


    Chew Yen Fook


    和许多叶莺一样，这种鸟并不容易看到，因为它在树冠层穿梭，通常以混合群体的形式出现觅食昆虫。它背部主要为绿色，下部呈黄绿色。它显著的黄绿色中冠条纹和眉纹之间夹着一条冠部侧面的黑色条纹和一条黑色眼纹。腿部为灰色，喙上部为黑色，下颌带有红褐色。幼鸟下部颜色更暗、更绿。在该地区的山区森林中较为常见，栖息于树冠和森林边缘。


    ### 亚洲褐伯韨 *Muscicapa dauurica* 12cm


    ![](img/99_2.jpg)


    ![](img/103_3.jpg)


    Chew Yen Fook


    这种栖息于亚森林和森林边缘的物种经常可以在种植园、开阔森林甚至花园中发现。它从暴露的栖息处捕猎空中昆虫，回到栖息处时经常抖动尾巴。它背部为灰褐色，下部为白色，侧腹和胸部侧面变为灰褐色，并有浅色眼环。黑色的喙下颌基部呈黄色。几乎确定是从东北亚迁徙该地区的冬季迁徙鸟，但有些可能留在此苏门答腊北部。它分布于大巽他群岛的所有低地，在离岸岛屿上尤为常见。


    ### 绿蓝蝶鹱 *Eumyias thalassinus* 16cm


    ![](img/104_1.jpg)


    ![](img/104_2.jpg)


    Tilford/Cooke, TC Nature


    这是一种较大的蓝鹱。按照典型的蝶鹱习性，它选择暴露的栖息处来对飞过的空中昆虫发动攻击。它喜欢开阔森林和森林边缘，但经常看到它栖在树冠高处。雄性的羽毛呈相当均匀的绿蓝色，尾覆带有白色边缘，呈现出鳞片状。眼眶区域为深灰色至黑色。雌性看起来较暗、更绿，幼鸟是带有绿色的斑驳褐色。脚和喙为黑色。发现于苏门答腊的低地和丘陵。


    ### 蓝靛蝶鹱 *Eumyias indigo* 14cm


    ![](img/104_1.jpg)


    ![](img/104_3.jpg)


    Morten Strange


    这种物种的羽毛主要是深靛蓝色，特别是在背部和胸部，蓝色在喉部和脸部靠近喙基部变为密蓝黑色。额头染有白色，延伸到蓝白色眉纹。腹部为灰色，在泄殖处变为白色，然后是黄褐色。腿和喙为黑色。局限于密林，它在那里经常在树冠低矮处与其他物种混群，且通常接近地面。它是爪哇山区和亚山森林相对常见的留鸟，但在苏门答腊较少，且在巴厘岛未发现。


    ### 白斑胸柳鹱 *Ficedula westermanni* 11cm


    ![](img/104_1.jpg)


    ![](img/104_3.jpg)


    Morten Strange


    这种物种雌雄二异，雄性为黑色，雌性为褐色。这种小但活跃的小鸟在茂密的植被中穿梭，因此通过其尖锐的哨子鸣声来识别。它背部呈灰褐色，下部呈亮黄色。喉部和颈部为白色，经常有白色眉斑。深褐色的尾部末端为黑色，并有白色斑纹。它发出
    `pi-pi-pi` 的叫声。在`1000m`以上相对常见。


    ### 蓝蓝蝶鹱 *Cyornis banyumas* 15cm


    ![](img/104_1.jpg)


    ![](img/105_3.jpg)


    Chew Yen Fook


    该地区不仅有不同种类的红树林蝶鹱，其他非常相似的物种也会混淆。考虑到所有因素，区分并不困难。它具有蓝色背部和橙色下部，但雌性颜色较浅，具有白色喉部和白色眉斑。它最容易与山蓝蝶鹱（*Cyornis
    banyumas*）混淆，后者的鸣声同样清晰悦耳，但具有浅蓝色额头和黑色喉部。


    ### 红树林蝶鹱 *Cyornis rufigastra* 15cm


    ![](img/104_1.jpg)


    ![](img/106_1.jpg)


    ### 黄腹绿留莺 *Gerygone sulphurea* 9cm


    ![](img/104_1.jpg)


    ![](img/106_3.jpg)


    Chew Yen Fook


    也被称为“食虫鸟”，是该地区发现的唯一澳洲仙林莺。这种小但活跃的小鸟在茂密的植被中穿梭，因此通过其尖锐的哨子鸣声来识别。它背部呈灰褐色，下部呈亮黄色。喉部和颈部为白色，经常有白色眉斑。深褐色的尾部末端为黑色，并有白色斑纹。


