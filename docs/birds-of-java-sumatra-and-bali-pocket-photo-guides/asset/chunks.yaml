    # 引言


    爪哇岛、苏门答腊和巴厘岛的总面积约为 61.万平方公里，几乎是英国面积的 2½倍，拥有约 635 种鸟类。凭借如此丰富的鸟类资源，鸟类因其美观和鸣声在当地被广泛饲养并不意外。如今来到该地区的游客日益增多，他们会注意到几乎每家房檐下都挂着笼鸟，而且数量很大。近距离观察发现，这里圈养的许多鸟类与世界各地宠物店里看到的种类相同。这反映了一个事实：国际宠物市场上交易的许多鸟类都是来自该地区的本土物种。


    由于捕获和出口数量不断增加，许多物种的自然种群严重减少，尽管有保护法律，但某些物种已处于灭绝边缘。到目前为止，只有爪哇凤��在近期灭绝，但其他几种物种，特别是巴厘黑嘴鸟，正徘徊在边缘。1999
    年，这种引人目的物种在巴厘岛西部野外仅剩不足 30 只，而在世界各地的鸟舍中却能找到约 3000 只，绝非巧合。巴厘黑嘴鸟的消失有详尽记录，很大程度上是非法捕捕的结果，并因人类干扰和栖息地丧失而加剧。这种惨淡的局面在许多其他物种身上上演，包括爪哇雀、红��和黑翅八哥，它们在几年前都是常见的景象。


    幸运的是，印尼政府部门，特别是印尼林业部森林保护与自然保护总局（`PHPA`）与国际鸟类保护会印尼计划合作，已经意识到了保护的紧迫性，现在大部分地区已被指定为国家公园和保护区，对野生动物进行特别保护。游客应记住，进入许多此类保护区需要获得正式许可，并可能需要提前安排。即使在保护区外，受威胁最严重的动物至少在理论上也是保护的。欲了解更多信息，书后提供的万维网网址是一个很好的起点。


    由于这本小书的篇幅限制，涵盖在爪哇、苏门答腊和巴厘岛记录的所有约 635 种鸟类是不可能的。因此，选择标准是基于在该地区较为常见的鸟类。书中还增加了一些不那么常见但有趣且更壮观的物种，以揭示那里巨大的生物多样性，并让读者对其特征性有所了解。


    书中涉及的 236 种物种涵盖了在该地区可能遇到的大多数科的合理代表。读者无疑会遇到其他物种，而这些物种将在延伸阅读中列出的更专业（但遗憾的是更厚）书籍中涵盖。


    # 观鸟


    对我们大多数人来说，观鸟实际上是给鸟类起名字，但通过更详细的研究可以获得更多。行为、生命周期以及与环境的互动都是迷人的的话题，它们不仅能带给我们巨大的乐趣，还能极大地增加我们对周围世界的认知。


    然而，最初，鉴定必须是首要任务。我们应该考虑所有可用线索，理想情况下，不仅要识别物种，还要尽可能辨别其性别、年龄和亚种。线索总是有很多，通过结合所有线索，我们缩小范围，直到问题解决。我们都承认视觉线索的价值，但在变得更有经验之前，往往会忽视声音的重要性。对于老练的观鸟者，录音机和笔记本、双筒镜、望远镜和野外指南一样是装备中同样重要的部分。那种重要的叫声通常可以在当天的晚些时候识别出来。拥有一份地区鸟类清单总是有帮助的，网上是寻找这些信息的好地方。尝试书中后后“实用网站”下列的一些网址；那里提供的信息量令人惊叹。


    无论你带什么设备，都应良好保护免受天气侵蚀。雨水和高湿度是相机、望远镜和电子设备最恶劣的条件。任何设备都应保持干燥通风，如果可能，与一袋硅胶干燥剂一起存放以防止真菌侵害。如果没有采取预防措施，真菌造成的破坏总是令人惊舌。


    理想情况下，推荐使用轻便防水望远镜，如尼康 `WP/RA II` 系列，特别是当你要进入潮湿地区时；但对于普通用途，不昂贵的种类，如尼康 `Travelite
    IV` 系列，对于大多数观察就足够了。对于更认真的观鸟者，有许多其他“专业型”双筒镜可选，以及用于远距离观察的光射镜。对于录音，配备指向麦克风的 `Sony
    Mini-Disk Recording Walkman` 可以提供极佳的还原效果，但对于鉴定目的，许多小型磁带录机同样有用。至于相机，不建议用于经常观鸟之旅，不仅是因为天气对设备可能有负面影响，还因为几乎无法同时关注这两项活动，尤其是集体时。


    幸运的是，许多良好的观鸟地点可以开车到达，但总有公共交通，在巴厘岛以外，旅程终点还有随处可见的摩托车出租 `ojeks`。在野外，消耗能量的炎热潮湿可能是最大的缺点。这里没必要再建议卫生和携带足够的瓶装水了。保持身体健康至关重要，特别是在医疗设施匮乏或没有地区。不要忘记随身携带必备药物，并随时为胃部不适做好准备。记住，“巴厘胃”并不局限于巴厘岛。昆虫在某些时候也是问题，防虫喷雾和霜可以让你免受一些痛苦的叮咬。合适的服装也至关重要，不仅是为了抵御天气，还为了伪装。轻便、暗色的衣服真的是非常必要的。


    # 如何使用本本书


