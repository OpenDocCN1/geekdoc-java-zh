    与其所有鸟类一样，这种鸟偏于栖息在灌木丛草地，它们栖在暴露的灌木或木桩上以寻找昆虫猎物。雄性几乎全黑，除了白色臀部、泄殖缘和独特的翼斑外。雌性具有深褐色条纹的上体部、深褐色尾巴、米色下体部带红褐色侧腹，以及浅红褐色的臀部。幼鸟有深浅棕色的斑点。经常在显眼的栖息处一边昂起尾巴一边鸣唱。它是爪哇答和巴厘岛干燥开阔低地常见的居民，偶尔出现在丘陵地区；在苏门答腊不存在。


    ### 巽他鸣噪鸫

    `Myophonus castaneus/glaucinus` 25cm


    ![](img/91_2.jpg)


    ![](img/91_1.jpg)


    现已分为两个物种。苏门答腊的栗翅画鸫（`*castaneus`）体型较大，雄性具有深蓝色头部和上胸部，颈部和肩膀为较亮的蓝色；背部、翅膀和尾巴为深栗褐色，腹部和下尾覆盖羽较浅。雌性色泽较暗，具有蓝色肩膀和黑色头冠。在较小的爪哇鸣噪鸫（`*glaucinus`）中，雄性为深蓝色带有黑色的下体部。羽毛比其他鸣噪鸫更均匀，缺乏斑点。两者都有黑褐色的喙。它们是大巽他腊群岛的特有物种。


    ### 蓝鸣噪鸫

    `Myophonus caeruleus` 32cm


    ![](img/91_2.jpg)


    ![](img/91_3.jpg)


    陈文永福 (Chew Yen Fook)


    一种中型蓝黑色鸫，带有中等紫色光泽，翅覆羽上稀疏分布着白色斑点斑斑。对比鲜明的黄色喙通常带有黑色斑纹，苏门答腊的鸟类尤为明显。腿为黑色。它具有高锐的尖叫警报声（screech-chit-chit
    chit）和响亮的鸣唱声，通常包含对其他鸟鸣的模仿。它是地面觅食者，取食昆虫、无脊椎动物和小果实，通常出现在河流附近的茂密低地山林和暴露的石灰岩岩层中。巴厘岛没有，在爪哇或苏门答腊也不常见。


    ### 橙头鸫

    `Zoothera citrina` 21cm


    ![](img/91_2.jpg)


    ![](img/92_1.jpg)


    这种鸫通常栖息在有茂密灌木丛的幽僻森林中，但它高频的鸣叫警报声会暴露它的行踪。它的歌声非常动听，加上迷人的色彩，使其成为当地观鸟爱好者以及近期出口宠物贸易的首要目标。它的头部、颈部和腹部为亮橙色，背部为灰蓝色，尾巴和翅膀为深灰色。它有白色泄殖缘和翼斑。雌性上体部为绿褐色。从巴基斯坦直到大巽他腊群岛，但在苏门答腊看到的许多个体可能是迁徙；在爪哇和巴厘岛，它是丘陵森林和低地的鸟类，但并不常见。


    ### 栗顶鸫

    `Zoothera interpres` 16cm


    ![](img/91_2.jpg)


    ![](img/92_3.jpg)


    陈文永福 (Chew Yen Fook)


    顾其名，这种小型鸫除了栗色顶冠外呈斑纹状。栗色头冠延伸至颈部，在板灰色的背和上体部处停止。它有两条独特的宽白翼斑。喉部和上胸部深黑色，延伸到黑斑的下胸和侧腹，以及白色腹部和泄殖缘。喙为黑褐色，腿为粉色。它的饮食是典型的鸫，如无脊椎动物，经常取食果实和浆果。出现在爪哇，但在巴厘岛和苏门答腊罕见。


    ### 鳞纹鸫

    `Zoothera dauma` 28cm


    ![](img/91_2.jpg)


    ![](img/93_1.jpg)


    David Tipling, Windrush Photos


    按照典型的鸫习性，该物种的大部分时间都在地面觅食。它只有低沉的鸣唱声和微弱的 `tzeeet` 警报声。它的上体部为棕色，带有金褐色和黑色的鳞纹状斑纹，背部和上翅羽上更为明显。棕色鳞纹下体部较白，上胸和侧腹有浅栗色色调。它偏好爪哇和巴厘岛的茂密林区和山林，但在苏门答腊仅限于北部的山林。分布于欧洲东北部一直延伸到巽他腊群岛直至澳大利亚。


    ### 岛鸫

    `Turdus poliocephalus` 20cm


    ![](img/91_2.jpg)


    ![](img/93_3.jpg)


    Morten Strange


    这是一种中等鸫，深灰色头部融入暗黑色的上体部。喉部和上胸部为中灰色，腹部为栗色，泄殖缘为白色。眼圈、喙和腿为黄色。它拥有悦耳的旋律声和相当嘈杂的咯哒声警报。这是一种高山鸟类，但在巴厘岛很罕见。在爪哇更为常见，通常可以在当库班佩拉胡山火山附近以及格德山的苔藓森林中看到。在苏门答腊，莱塞尔山的山峰是它的家园。


    ### 白胸画眉

    `Trichastoma rostratum` 15cm


    ![](img/91_2.jpg)


    ![](img/94_1.jpg)


    这种小型画眉颜色相当平淡，上体部为深褐色，下体部为米白色。头部侧面为黄褐色，带有浅眉纹。通常出现在森林边缘、灌木丛和丛林中，单只或成群活动。在苏门答腊低地森林当地常见，爪哇岛有少量记录，但巴厘岛不存在。


    ### 席氏画眉

    `Macocincla sepiaria` 14cm


    ![](img/91_2.jpg)


    ![](img/94_3.jpg)


    陈文永福 (Chew Yen Fook)


    这种吵的小画眉叫声单调且重复，尤其是在黎晨和黄昏。通常成对或小群活动，在低矮植物中觅食昆虫。上体部为暖褐色，臀部变为栗色。侧腹和泄殖缘也是栗色，而喉部和腹部为白色，胸部为灰色。它的喙厚壮。


    ### 阿伯特画眉

    `Macocincla abbotti` 16cm


    ![](img/91_2.jpg)


    ![](img/95_1.jpg)


    陈文永福 (Chew Yen Fook)


    与席氏画眉一样，阿伯特画眉体型小且呈棕色，喙厚壮。区别在于颜色更淡暗，尾巴更长。上体部为棕榄色，臀部为浅栗色。下体部喉部为米白色，胸部为浅绿色，腹部为黄褐色，下尾覆盖羽为红色。头部侧面为黄褐色，带有灰色眉纹。通过没有颊纹与前者区分，通过头冠（非黑色）与后者区分。


    ### 栗背画眉

    `Pomatorhinus montanus` 20cm


    ![](img/91_2.jpg)


    ![](img/95_3.jpg)


    Tilford/Cooke, TC Nature


    这种鸟拥有引人注目的灰黑色头部，带有长长的白眉，长而弯曲的黄黄色喙基部为黑色。喉部和胸部为白色，背部、侧腹和泄殖缘为栗褐色，尾巴和翅膀为深褐色。足为灰色。它经常成对或小群与画噪鸫在一起，在地面落叶层和低矮木丛中觅食，也出现在树冠下层。苏门答腊的亚种（`P.
    m. occidentalis`）在低地和山林相当常见，而西爪哇的个体（`P. m. montanus`）以及东爪哇和巴厘岛的个体（`P. m. ottolanderi`）倾向于占据较高海拔的山林。


    ### 锈胸山画眉

    `Napothera rufpectus` 18cm


    ![](img/91_2.jpg)


    ![](img/96_1.jpg)


    F Lambert

    '
- fmt: '

    One of the more substantial ground-hugging babblers, this species prefers dense
    cover in both lower and upper montane forest in which to seek out its mainly insect
    food. It can be recognized by its generally brown-streaked appearance and its
    white throat. The upperparts are dark brown with light brown and black streaking,
    and the underparts streaked dark and light chestnut. The short tail and the primaries
    are dark brown. Like many of the wren babblers, it has various loud whistling
    calls. An endemic, found particularly in the remoter mountains of the Barisan
    range in Sumatra.


    ### STRIPED TIT BABBLER `Macronous gularis` 13cm


    ![](img/91_2.jpg)


    ![](img/96_3.jpg)


    Morten Strange


    The upperparts of this small tit babbler are all chestnut-brown, including the
    tail. The underparts, in particular, the breast, are conspicuously streaked finely
    with black on an underwash of pale yellowish-green, becoming whitish at the lower
    belly and vent; the Javan race is more greyish below. The sides of the head are
    grey, sometimes tinged yellow. The bill is brown and the legs grey-blue. A common
    bird in lowland Sumatra, where it lives in small groups in dense thickets, especially
    bamboo, and secondary growth. An occasional resident in West Java, but not found
    in Bali.


    ### RUFOUS-FRONTED LAUGHINGTHRUSH `Garrulax rufifrons` 27cm


    ![](img/91_2.jpg)


    ![](img/97_1.jpg)


    Ray Tipper


    This species is particularly noisy when roaming beneath the canopy with other
    birds, foraging for insects. It is a largish babbler with a long tail. The plumage
    is mostly a soft olive-brown but with a slight reddish tinge below. The throat
    is white to fawn, with a reddish chin and forehead, and the wings are chestnut.
    The bill is black and the feet a dirty yellow-brown. An endemic, inhabiting mainly
    primary mountain forests of the western half of Java. Although restricted in range,
    locally it does not appear uncommon.


    ### WHITE-CRESTED LAUGHINGTHRUSH `Garrulax leucolophus` 30cm


    ![](img/91_2.jpg)


    ![](img/97_3.jpg)


    Tilford/Cooke, TC Nature


    The white head and black face-mask with a superficial erectile crest are distinguishing
    marks of this cocky babbler. It is an arboreal bird, found in the lower storeys
    of primary and secondary hill and montane forest. Forms noisy flocks with others
    of its kind, foraging through the foliage with occasional visits to the ground.
    West Sumatra is the eastern limit of the species’ natural range. The Sumatran
    subspecies has a dark back and short crest. The chestnut-backed subspecies found
    elsewhere in Asia (depicted here), is a popular cagebird in Java, and escapes
    are often encountered.


    ### WHITE-BROWED SHRIKE BABBLER `Pteruthius flaviscapis` 13cm


    ![](img/91_2.jpg)


    ![](img/98_1.jpg)


    Chew Yen Fook


    Usually seen in pairs with other species, this plump little bird appears to have
    a proportionately large head and thickish bill. In characteristic manner it sidles
    along branches in search of food. Males have a black head with a conspicuous white
    eyebrow, grey mantle and back, and black wings and tail, with the primaries tipped
    white and the tertials tinged chestnut and yellow. The underparts are whitish.
    Females have a grey head with less distinct eyebrow, and greyish-green upperparts.
    Found in the more open lower montane forests of Java and Sumatra.


    ### SILVER-EARED MESIA `Leiothrix argentauris` 18cm


    ![](img/91_2.jpg)


    ![](img/98_3.jpg)


    This brightly coloured medium-sized babbler has a deep black head enhanced by
    silver ear-coverts. The mantle, breast and forehead are bright red, sometimes
    orange-red, as are the rump, undertail and primary coverts, and the back, tail
    and wing-coverts are grey-green. Both bill and legs are yellow. It has a cheerful
    little whistled song and a range of other chattering calls. A locally common resident
    of montane and secondary forests, particularly fond of dense thickets but also
    inhabiting forest edges and more open scrub, it occurs from the Himalayas through
    to Sumatra. Often kept as a cagebird.


    ### ORIENTAL REED WARBLER `Acrocephalus orientalis` 18cm


    ![](img/99_2.jpg)


    ![](img/99_1.jpg)


    Chew Yen Fook


    This is a fairly large brown warbler with a very obvious pale buff supercilium
    underlined by a thin dark brown eye-stripe. Its underparts are whitish, blending
    into buff on the flanks, rump and upper belly, with the upper belly and the sides
    of the breast sparsely streaked brown. The largish bill is brown above and tinged
    pink below, and the legs are blue-grey. A regular winter migrant, visiting the
    region from its breeding grounds in eastern Asia, this species is usually found
    in lowland reedbeds and marshes, but frequently occurs also in rice fields and
    scrub close by water.


    ### ZITTING CISTICOLA `Cisticola juncidis` 10cm


    ![](img/99_2.jpg)


    ![](img/99_3.jpg)


    Tilford/Cooke, TC Nature


    Commonly known as the Fan-tailed Warbler, this little bird occurs from Africa
    and Europe through India, South-east Asia and the Sundas down to northern Australia.
    It is a small, rather inconspicuous brown bird, heavily streaked with dark brown
    and buff. It has white underparts and vent, with warm flanks, and the brown tail
    is tipped white. Its white supercilium distinguishes it from the Bright-headed
    Cisticola. A common grassland and reedbed bird throughout the lowlands of Sumatra,
    Java and naturally attracted to riceies.


    ### BRIGHT-HEADED CISTICOLA `Cisticola exilis` 11cm


    ![](img/99_2.jpg)


    ![](img/100_1.jpg)


    Morten Strange


    Non-breeding birds and females are very similar to the Zitting Cicola. They differ
    in having a more golden head and in the buff supercilium being the same colour
    as the nape. The throat is white and the underparts buff. Also known as the Golden-headed
    Cisticola, breeding males have a golden-yellow crown and brown rump. In the lowlands
    of Java and Bali this is a common bird of alang-alang grassland; only locally
    common in Sumatra. It prefers taller grass than the Zitting Cicola.


    ### BAR-WINGED PRINIA `Prinia familiaris` 13cm


    ![](img/99_2.jpg)


    ![](img/100_3.jpg)


    Morten Strange


    A noisy, versatile and gregarious little bird, often uttering its loud high-pitched
    ‘tweeting’ call as it searches for insects from ground to treetop. It is recognized
    by its long tail of black- and white-tipped feathers, rather drab olive-brown
    upperparts, and two distinctive white wingbars. The white of the throat extends
    down the middle of the upper belly, with the flanks pale grey and lower belly
    and vent pale yellow. It favours secondary growth, especially parks and gardens,
    mangroves, plantations and scrub. A common endemic in the lowlands of Java and
    Bali, but less so in Sumatra, particularly in the north.


    ### YELLOW-BELLIED PRINIA `Prinia flaviventris` 13cm


    ![](img/99_2.jpg)


    ![](img/101_1.jpg)


    Chew Yen Fook


    This prinia has a weak song and shy habits, with a tendency to remain hidden among
    long grass and reeds. Appearing as a long-tailed warbler, it has olive-brown upperparts
    and tail, a bright yellow belly, and a very evident white chin, throat and upper
    breast. The head is greyish with a reddish-orange eye-ring and a very thin, and
    often broken, white supercilium. The legs and feet are a dull orange, and the
    bill is dark brown above and pale brown below. Found on Sumatra and West Java,
    it occurs fairly commonly in grassland, reedbeds and thick scrub in the lowlands.


    ### MOUNTAIN TAILORBIRD `Orthotomus cuculatus` 12cm


    ![](img/99_2.jpg)


    ![](img/101_3.jpg)


    Chew Yen Fook

