    and ripe fruits. The head, mantle and upper back are grey, with rump, vent and
    outer tail orange. The long central tail feathers are black, and the black wings
    have a prominent yellow-orange patch. Males have a black throat and red to orange
    belly; females are paler, with a whitish breast. It inhabits the more open lowland
    forest and also trees and copses around cultivated land, gardens and mangroves.
    Widespread in Java and Bali.


    **SCARLET MINIVET** *Pericrocotus flammeus* 19cm


    ![](img/81_2.jpg)


    ![](img/81_3.jpg)


    Tilford/Cooke, TC Nature


    A forest-dwelling bird which forages through the treetops in small groups. The
    male’s head and mantle are jet-black with a blue sheen, and the underparts, rump
    and outer edges of the tail are red. The mainly black wing has two distinct red
