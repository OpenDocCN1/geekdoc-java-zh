  raw: 'An active bird with upperparts bright olive-green, and a bright yellow throat
    merging into a greyish abdomen and undertail-coverts; wings and tail are darker.
    It has a ring of bright white feathering around the eye contrasting with darker
    face sides, and sometimes a yellowish forehead. The lores are black, bill dark
    brown and feet grey. Often in large flocks with other small birds, roaming the
    canopy. Ranges throughout the Sundas, inhabiting forest edges and mangroves; common
    in lowlands and hills up to about 1500m. A popular cagebird in Indonesia.


    **MOUNTAIN WHITE-EYE** *Zosterops montanus* 11cm


    ![](img/118_2.jpg)


    ![](img/118_3.jpg)


    Tilford/Cooke, TC Nature


    More likely to be observed in noisy parties as it forages for insects through
    the treetops. Similar in size to other small white-eyes, this darker species resembles
    the Black-capped White-eye (*Zosterops atricapilla*) in Sumatra, but without the
    black on the head. Its upperparts are olive-green, with slightly darker wings
    and tail. The underparts are buffish-grey, becoming brownish on the flanks and
    yellow on the vent. The throat is also yellow. A very common bird of the region’s
    lower mountains, preferring open forest and forest edge as well as plantations
    and copses in agricultural land. It is seldom found in the lowlands.


    **JAVAN WHITE-EYE** *Zosterops flavus* 10cm


    ![](img/118_2.jpg)


    ![](img/119_1.jpg)


    Smaller and paler than most other white-eyes, this species has fairly uniform
    bright olive-yellow upperparts and plain bright yellow underparts. Legs and bill
    are black, and it has a brown iris. It should not be confused with the slightly
    larger Lemon-bellied White-eye, which is a little duller and has a black loral
    spot. More a bird of coastal scrub and thickets, as well as mangroves, it is found
    in small flocks with other white-eyes, feeding on insects and nectar. A fairly
    rare endemic of Java’s north-east coast, but more common in south Borneo.


    **RED AVADAVAT** *Amandava amandava* 10cm


    ![](img/118_2.jpg)


    ![](img/119_3.jpg)


    Tilford/Cooke, TC Nature


    For most of the year males and females look alike but, as the breeding season
    approaches, sexually dimorphic plumage becomes very apparent. Females have greyish-brown
    upperparts and greyer sides to the head, with greyish-buff underparts and blackish
    wings and tail. The rump and bill are bright red. Breeding males become crimson-red
    on the back and breast, with small white spots on breast sides and flanks and
    also on the rump. The feet are pinkish-grey. Although still fairly common in East
    Java and Bali, trapping has reduced its numbers drastically in West Java and it
    is thought extinct in Sumatra.


    **PIN-TAILED PARROTFINCH** *Erythrura prasina* 15cm


    ![](img/120_2.jpg)


    ![](img/120_1.jpg)


    Tilford/Cooke, TC Nature


    This pretty finch often mixes with large flocks of munias, raiding rice crops
    as they become ripe. The upperparts are green, the rump and tail red, and the
    lower belly and vent brownish-buff. The male has elongated central tail feathers,
    a red patch in the centre of the belly, and blue throat, cheeks and forehead.
    The female’s head is greenish. A bird of scrubland and thicket, particularly bamboo,
    adjacent to cultivated land and rice paddies. Resident in Java and Sumatra but
    not in Bali, it was once very common but is now confined mainly to the lowlands.


    **JAVAN MUNIA** *Lonchura leucogastroides* 11cm


    ![](img/120_2.jpg)


    ![](img/120_3.jpg)


    Chew Yen Fook


    This munia has dark chestnut-brown upperparts, tail and vent, black chin, throat
    and sides of face, and a white belly. It should not be confused with the White-bellied
    Munia (*Lonchura leucogastra*), which has fine pale streaking on the upperparts,
    brown flanks and a yellowish-brown tail. Normally a grassland bird, it is attracted
    to the easy pickings of cultivated land and especially rice paddies at harvest
    time. At other times it congregates in small groups, noisily foraging through
    grassland. An endemic to the region and particularly common in Java and Bali;
    in Sumatra, it is found mainly in the east.


    **SCALY-BREASTED MUNIA** *Lonchura punctulata* 11cm


    ![](img/120_2.jpg)


    ![](img/121_1.jpg)


    Tilford/Cooke, TC Nature


    Familiar to the cagebird enthusiast as the Spicebird or Nutmeg Mannikin, this
    species is easily identified by the scaly appearance of its breast and flanks,
    the white feathers being edged with brown. The upperparts and throat are brown.
    Like other munias, it is often regarded as a pest to the farmer, raiding paddyfields
    and cultivated crops, but it also inhabits secondary scrub, gardens and open grassland.
    A very common munia, found from the coast up to the lower mountain slopes, and
    regularly exploited as a cagebird. Its range covers India through to Sulawesi.


    **WHITE-HEADED MUNIA** *Lonchura maja* 11cm


    ![](img/120_2.jpg)


    ![](img/121_3.jpg)


    Tilford/Cooke, TC Nature


    The White-headed Munia is very much like other munias, gathering outside the breeding
    season in mixed flocks to exploit seeding grasses and especially the rice harvest.
    It is quite small, with the head, nape and throat completely white. The remainder
    of the plumage is chestnut-brown, apart from a small area of black on the undertail-coverts.
    The bill and feet are pale bluish-grey. It prefers open grassland, as well as
    swamps, reedbeds and rice paddies, and is fairly common throughout the region.
    It is often kept and exported as a cagebird.


    **JAVA SPARROW** *Padda oryzivora* 16cm


    ![](img/122_1.jpg)


    ![](img/122_2.jpg)


    Tilford/Cooke, TC Nature


    Adults are largely grey, with a black head and throat, large white cheek patches,
    a black tail and white undertail-coverts, and a heavy pink or red bill. Juveniles
    are brownish-grey, with a buff or brown breast. It is usually found in small groups
    feeding on rice and seeding grasses, and in other low vegetation, mangroves and
    scrub. Seen in cities, towns and villages, but far less commonly than in the past.
    A endemic of Java and Bali, it has been widely introduced over much of Southeast
    Asia. This once common bird has declined alarmingly in recent years, probably
    due to agricultural practices and the demands of the pet trade.


    **EURASIAN TREE SPARROW** *Passer montanus* 14cm


    ![](img/122_1.jpg)


    ![](img/122_3.jpg)


    Tilford/Cooke, TC Nature


    This is perhaps the commonest of all resident species throughout the region. It
    has a chestnut crown, black throat, sides of face and ear patch, pale buff underpar
    ts, brown back and wings mottled with black and white, and two pale wingbars.
    It is commonly seen feeding on the ground, and in large flocks raiding seeding
    crops. It is found particularly in open habitats with scrub and low vegetation,
    from the coast to mountain villages. It is well distributed, particularly in the
    lowlands, and has colonized almost all areas, from cities to forest clearings.
    Its range extends from Europe eastwards to Australia.


    **STREAKED WEAVER** *Ploceus manyar* 14cm


    ![](img/122_1.jpg)


    ![](img/123_2.jpg)


    Morten Strange


    Breeding males of this colonial species have a black head with golden-yellow cap,
    dark brown upperparts with russet-brown feather edges giving a streaked appearance,
    and white underparts with black streaking on the breast. Females and non-breeding
    males have a black-streaked brown head and buff eyebrow and chin. Large nesting
    colonies are established in isolated trees near good feeding areas, the polygamous
    males leaving the females alone to weave their elaborate suspended nests. After
    breeding they form large roaming flocks, stopping off at seeding grassland and
    often around rice paddies. They occur locally around reedbeds, rice paddies and
    swampy grasslands in the lowlands of Java and Bali.


