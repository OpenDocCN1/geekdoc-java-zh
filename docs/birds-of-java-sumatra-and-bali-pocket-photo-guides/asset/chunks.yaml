    ![](img/82_1.jpg)


    ![](img/83_2.jpg)


    Sometimes referred to as the Ruby-throated Bulbul, the subspecies *P. m. dispar*
    is resident in Sumatra, Java and Bali and is distinguished by its bright red throat.
    It is quite a large olive-tinged yellow-green bulbul with black head and upright
    tufty crest. The underparts are paler, and the iris is either cream-coloured or
    dull red. It is relatively timid, keeping out of sight in well-foliaged tall trees
    in secondary forest and along forest edges as it searches for ripe fruits. It
    is reasonably common in both lowland and hill forests of Sumatra, but its numbers
    seem to decline going eastwards through Java.


    **ORANGE-SPOTTED BULBUL** *Pycnonotus bimaculatus* 20cm


    ![](img/82_1.jpg)


    ![](img/83_3.jpg)


    Ray Tipper


    This is quite a noisy bird with its harsh continual toc-toc-toc-toroc call, often
    several birds joining in a chorus as they roam the trees in search of fruit. It
    is brown to olive-brown above, with paler ear-coverts and two distinguishing orange
