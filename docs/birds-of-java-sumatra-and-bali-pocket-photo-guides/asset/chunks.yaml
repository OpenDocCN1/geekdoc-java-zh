    ![](img/3_1.jpg)


    # INTRODUCTION


    The islands of Java, Sumatra and Bali total some 613,000 square kilometres, almost
    2½ times the area of the United Kingdom, and possess approximately 635 bird species.
    With such a rich avifauna, it is scarcely surprising that birds are widely kept
    there for their beauty and song. Visitors, who now reach the region in ever-increasing
    numbers, cannot fail to notice that almost every house has caged birds hanging
    from the eaves, often in large numbers. Close inspection reveals that many of
    the birds kept in captivity here are often the same as those to be found in pet
    stores around the world. This is a reflection of the fact that many birds traded
    on the international pet market are local species from this region.


    Trapped and exported in increasingly greater numbers, natural populations of many
    species are severely reduced, and some have been brought to the edge of extinction
    in spite of protective legislation. So far, only the Javanese Lapwing has become
    extinct in recent times, but several other species, most notably the Bali Myna,
    are hovering on the brink. With fewer than 30 individuals of this striking species
    left in the wild in western Bali, in 1999, it is no coincidence that some 3,000
    are to be found in aviaries throughout the world. The demise of the Bali Myna
    is well documented and is largely the result of illicit trapping, exacerbated
    by human disturbance and loss of habitat. The same dismal picture is repeated
    for many other species, including the Java Sparrow, Brahminy Kite and Black-winged
    Starling, all of which were, not many years ago, a common sight.


    It is fortunate that the Indonesian authorities, in particular the Directorate
    General of Forest Protection & Nature Conservation of the Indonesian Ministry
    of Forestry (`PHPA`) in conjunction with BirdLife International’s Indonesia Programme,
    have recognised the urgent need for protection, and vast areas have now been designated
    as National Parks and reserves with special protection for wildlife. Visitors
    should bear in mind that permits are officially required to enter many of these
    reserves and prior arrangements may be necessary. Even outside the reserve areas
    the most threatened animals are protected, at least in theory. For further information,
    the World Wide Web addresses given later in this book are a good place to start.


    Within the space limitations of this small book it would be impossible to cover
    all the 635 or so bird species that have been recorded in Java, Sumatra and Bali.
    The selection has therefore been based upon the birds that are reasonably common
    throughout the region. A few less common but interesting and more spectacular
    species have been added, so as to reveal the enormous biological diversity to
    be found there and to provide an understanding of its characteristic nature.


    The 236 species treated include a reasonable representation from most of the families
    likely to be encountered in the region. The reader will undoubtedly come across
    others, and these are certain to be covered in the more specialized (but unfortunately
    more cumbersome) books listed for further reading.


    # BIRDWATCHING


    For most of us, birdwatching is really putting a name to a bird, but there is
    so much more to be gained from more detailed study. Behaviour, life cycles and
    interaction with the environment are fascinating subjects which not only can give
    us enormous enjoyment, but can add much to our knowledge of the world around us.


    Initially, however, identification must be the first priority. We should consider
    all the clues available and, ideally, identify not just the species but also its
    sex, age and race where possible. There are always many clues to go on, and by
    combining them all we narrow down the possibilities until our problem is solved.
    We all accept the value of visual clues, but tend to neglect the importance of
    sound until we become more experienced. For the seasoned birdwatcher, his or her
    tape recorder is just as important a part of the kit as are note-book, binoculars,
    telescope and field guide. That important call can often be identified later in
    the day. It is always a help to have a checklist of the species found in the area,
    and a good place to find this is on the World Wide Web. Try some of the addresses
    listed under ‘Useful Web-sites’ later in the book; it is amazing what information
    is available.


    Whatever equipment you take, it should be well protected from the ravages of the
    weather. Rain and high humidity provide the worst conditions for cameras, binoculars
    and electronics. Any equipment should be kept dry and well aired and, if at all
    possible, stored with a bag of silica-gel desiccant to protect against fungal
    attack. It is always astonishing how much damage fungus can cause if inadequate
    precautions have been taken.


    Ideally, lightweight waterproof binoculars such as the `Nikon` close-focusing
    WP/RA II` range are recommended, particularly if you are going to venture into
    wet and humid areas, but for general use the not too expensive kind, such as the
    `Nikon Travelite IV` range, is perfectly adequate for most observation. For the
    more serious birder there are many other ‘professional-style’ binoculars to choose
    from, as well as spotting scopes for more distant observation. For sound recording,
    the `Sony Mini-Disk Recording Walkman` with a directional microphone gives superb
    reproduction, but for identification purposes many of the smaller cassette recorders
    are equally useful. As for cameras, they are not recommended for regular birdwatching
    trips, not only because of the possibly detrimental effect of the weather on equipment,
    but also because it is almost impossible to concentrate on both activities at
    once, particularly in a group.


    It is fortunate that many of the good birdwatching areas are accessible by car,
    but there is always public transport and, except in Bali, at the end of the journey
    the ubiquitous motorbike-taxis known as `ojeks`. In the field, the energy-sapping
    heat and humidity are perhaps the biggest drawbacks. It should be unnecessary
    to advise here on hygiene and the need to carry sufficient bottled water. Keeping
    fit and healthy is extremely important, particularly in areas where medical facilities
    may be poor or non-existent. Do not forget to take essential medication with you,
    and always be prepared for stomach upsets. Remember, ‘Bali Belly’ is not confined
    just to Bali. Insects can also be a problem at certain times, and insecticide
    sprays and creams could save you from some nasty bites. Suitable clothing is also
    essential, not only as protection against the elements but also as a disguise.
    Lightweight, dull-coloured clothes are really necessary. Visitors are recommended
    to carry a light poncho with a hood, and in lowland forests long trousers are
    very desirable for preventing leeches and stinging plants from making contact
    with your skin. Sturdy footwear is a must, although many people prefer heavy-duty
    sandals of the `Teva` type, particularly in wet conditions. Lightweight canvas
    boots are better than leather ones, which quickly become mouldy.


    # HOW TO USE THIS BOOK

