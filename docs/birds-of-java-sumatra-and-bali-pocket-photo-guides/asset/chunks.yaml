    and abundant from the coast to the mountains.


    **SMALL MINIVET** *Pericrocotus cinnamomeus* 15cm


    ![](img/81_2.jpg)


    ![](img/81_1.jpg)


    David Tipling, Windrush Photos


    Like other minivets, this one is rather gregarious, moving among the treetops
