  raw: 'Two aspects of this drongo’s plumage are rather unusual. It has a peculiarly
    fork-shaped tail, which has the outer feathers spread outwards and upwards almost
    into a lyre-shape. It also has an extraordinary crest of long hair-like feathers
    from the front of the crown, hence its name, but this feature varies among races.
    The general plumage is glossy black with an iridescent spangling, particularly
    on crown and upper breast. In East Java and Bali it is common in open areas of
    lowland and submontane forests. In Sumatra it is replaced by the Sumatran Drongo.
    It hawks insects from a low perch.


    **GREATER RACKET-TAILED DRONGO** *Dicrurus paradiseus* 30cm plus 35cm tail rackets


    ![](img/128_2.jpg)


    ![](img/129_3.jpg)


    Chew Yen Fook


    A large drongo with a forked tail, and with beautifully extended outer tail feathers
    terminating in rackets on the outer edge of the feather shafts, the rackets twisted
    in a short spiral. Its forked tail easily separates it from the Lesser Racket-tailed
    Drongo. The plumage is a glossy black, and adults often display a short frontal
    crest on the crown. The bill and legs are black. It is usually found in pairs,
    often hawking for insects in glades in swamp, primary and also secondary forests
    and in mangroves. It remains a common bird of the lowland forests of Sumatra,
    but it is becoming rarer in Java and Bali through habitat loss.


    **WHITE-BREASTED WOODSWALLOW** *Artamus leucorynchus* 18cm


    ![](img/128_2.jpg)


    ![](img/130_2.jpg)


    Tilford/Cooke, TC Nature


    This is the only resident woodswallow in the region. It shows similarities to
    the true swallows in its stance and its gliding flight, but it can easily be distinguished
    by its more stocky appearance, broad triangular-shaped wings and squarish unforked
    tail. Its quite heavy bill is grey, and the entire upperparts except for the white
    rump are dark slate-grey. The underparts are white. This species feeds on insects,
    which it catches in flight. Quite a common bird of open spaces, particularly in
    the lowlands and hills. Frequently seen on posts and wires.


    **CRESTED JAY** *Platylophus galericulatus* 28cm


    ![](img/128_2.jpg)


    ![](img/130_3.jpg)


    This is a relatively inconspicuous bird until it starts to call, when its rather
    harsh and rattling sounds soon reveal its presence. Its plumage is very dark grey
    to black, apart from a broad white neck patch. It is easily distinguished by its
    tall, flat, upright crest. Its bill is black and the legs dark grey. It is frequently
    observed in small, very noisy groups foraging through trees and bushes in search
    of large insects. Found in lowland forest in Java and Sumatra, but not in Bali.


    **RACKET-TAILED TREEPIE** *Crypsirina temia* 35cm including 18cm tail


    ![](img/131_1.jpg)


    ![](img/131_2.jpg)


    This member of the crow family has a uniformly blackish plumage with a greenish-bronze
    sheen. It has black feet, a strong black bill and blue eyes. It differs from all
    similar birds in the region in having a long tail with spatulate ends to the central
    feathers. Usually seen alone or in pairs, it inhabits lowland and hill forests
    and plantations, often occurring in secondary growth and the more cultivated areas,
    as well as scrubland and gardens. It is resident in both Java and Bali, where
    its numbers are diminishing owing to habitat destruction and collecting for the
    pet trade.


    **LARGE-BILLED CROW** *Corvus macrorhynchos* 48cm


    ![](img/131_1.jpg)


    ![](img/131_3.jpg)


    Chew Yen Fook


    By far the largest crow of the region. Usually in pairs or small flocks, scavenging
    where it can, it is nevertheless a wily creature and keeps its distance from man.
    It is distinguished by its large size and very heavy bill. It is black all over
    with blue and green iridescence. The area of the forehead appears rather small
    compared with the size of the bill. In flight, its broad wings with spread primaries
    are beaten slowly and it often calls a harsh *kaar* as it goes. Fairly common
    in open country, around villages and at all altitudes.


    **FURTHER READING**


    Howard, R. and A.A. Moore. *Complete Checklist of the Birds of the World*. 2nd
    edition. Oxford University Press, Oxford, 1991


    Inskipp, T., N. Lindsey and W. Duckworth. *An Annotated Checklist of the Birds
    of the Oriental Region*. Oriental Bird Club, Sandy, England, 1996


    Jepson, P. and R. Ounstead. *Birding Indonesia – A Birdwatcher’s Guide to the
