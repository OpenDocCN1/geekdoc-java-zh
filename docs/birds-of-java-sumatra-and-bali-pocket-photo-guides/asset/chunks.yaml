    这是一种活跃的鸟类，背部呈亮橄榄绿色，亮黄色喉部逐渐变为灰色的腹部和尾覆盖羽；翅膀和尾巴颜色较深。眼睛周围有一圈亮白色的羽毛，与深色的面部两侧形成对比，额头有时呈黄色。眉眼处为黑色，喙为深褐色，足为灰色。经常与其他小鸟一起结大群活动，在树冠层穿行。分布于整个巽腊群岛，栖息于森林边缘和红树林；在低地和海拔约
    1500 米的山丘很常见。印度尼西亚的笼笼鸟。


    ### 山白眼雀 `Zosterops montanus` 11cm


    ![](img/118_2.jpg)


    ![](img/118_3.jpg)


    Tilford/Cooke, TC Nature


    更容易在嘈杂的群体中观察到，因为它在树顶间觅食昆虫。与其他小型白尾雀大小相似，这种颜色较深的物种类似于苏门答腊的黑冠白尾雀 `Zosterops atricapilla`，但头部没有黑色。它的背部为橄榄绿色，翅膀和尾巴稍深。腹部为灰褐色，侧腹变为棕色，泄殖处为黄色。喉也是黄色的。它是该地区低山地非常常见的鸟，喜好开阔森林和森林边缘，以及农田中的种植园和丛林。它很少在低地发现。


    ### 爪哇白眼雀 `Zosterops flavus` 10cm


    ![](img/118_2.jpg)


    ![](img/119_1.jpg)


    比大多数其他白尾雀更小、颜色更浅，这种物种背部呈均匀的亮橄榄黄色，腹部为纯净的亮黄色。腿和喙为黑色，虹膜为棕色。不应与其稍大的柠檬腹白尾雀混淆，后者的颜色稍暗，且带有一个黑色的眉纹斑点。它更多是沿海灌木丛、灌木丛以及红树林的鸟，与其他白尾雀一起成小群活动，取食昆虫和花蜜。它是爪哇岛东北部相当稀有的特有种，但在婆门洲岛南部较常见。


    ### 火焰草织雀 `Amandava amandava` 10cm


    ![](img/118_2.jpg)


    ![](img/119_3.jpg)


    Tilford/Cooke, TC Nature


    一年中大部分时间雄雌外表相似，但随着繁殖季节的到来，性二形羽毛变得非常明显。雌性背部为灰褐色，头部侧面较灰，腹部为灰褐色，翅膀和尾巴为近黑色。尾部和喙为亮红色。繁殖期的雄性背部和胸部变为深红色，胸侧、侧腹以及尾部有细小的白色斑点。足为粉灰色。尽管在东爪哇和巴厘岛仍然相当常见，但捕捕导致西爪哇的数量大幅减少，并认为在苏门答腊已灭绝。


    ### 绿尾锥雀 `Erythrura prasina` 15cm


    ![](img/120_2.jpg)


    ![](img/120_1.jpg)


    Tilford/Cooke, TC Nature


    这种漂亮的雀类经常与大群的草雀混在一起，在水稻成熟时袭击农作物。背部为绿色，尾部和尾羽为红色，下腹和泄殖处为棕褐色。雄性具有长中尾羽，腹部中心有红色斑块，喉部、脸颊和额头为蓝色。雌性头部为绿色。它是灌木丛和丛林的鸟，特别是农田和稻田附近的竹林。留居于爪哇和苏门答腊但不属于巴厘岛，曾非常常见，现在主要局限于低地。


    ### 爪哇草雀 `Lonchura leucogastroides` 11cm


    ![](img/120_2.jpg)


    ![](img/120_3.jpg)


    Chew Yen Fook


    这种草雀具有深栗褐色的背部、尾部和泄殖处，下巴、喉部和脸侧为黑色，腹部为白色。不应与白腹草雀 `Lonchura leucogastra` 混淆，后者背部有细的浅色条纹，侧腹为棕色，尾部为黄褐色。通常是草地鸟，它们被农田中易得的食物所吸引，尤其是收获季节的稻田。其他时候，它们成小群聚集，在草地中嘈闹地觅食。它是该地区的特有种，在爪哇岛和巴厘岛特别常见；在苏门答腊，主要分布在东部。


    ### 斑胸草雀 `Lonchura punctulata` 11cm


    ![](img/120_2.jpg)


    ![](img/121_1.jpg)


    Tilford/Cooke, TC Nature


    笼笼鸟爱好者熟悉的物种，被称为“香料雀”或“肉豆豆雀”，这种物种通过其胸部和侧腹的鳞状外观易于识别，白色羽毛边缘带有棕色。背部和喉部为棕色。与其他草雀一样，它通常被认为是农民的害虫，袭击稻田和农作物，但它也栖息在次生灌木丛、花园和开阔草地上。这是一种非常常见的草雀，从海岸到低山坡均可见，并经常作为笼笼鸟食用。其分布范围从印度一直到苏拉答锡。


    ### 白头草雀 `Lonchura maja` 11cm


    ![](img/120_2.jpg)


    ![](img/121_3.jpg)


    Tilford/Cooke, TC Nature


    白头草雀与其他草雀非常相似，在繁殖季节外成群聚集。它体型很小，头部、颈后和喉部完全全白。其余羽毛为栗褐色，仅尾覆盖羽处有一小块黑色。喙和足为浅蓝灰色。它喜好开阔草地，以及沼泽、稻田，在各地都很常见。


    ### 爪哇雀 `Padda oryzora` 16cm


    ![](img/122_1.jpg)


    ![](img/122_2.jpg)


    Tilford/Cooke, TC Nature


    成鸟大部分为灰色，有黑色头部和喉部、大白斑、浅褐色胸部，喙粗壮。幼鸟为棕灰色。常被当作笼笼养。出现在城市、城镇和村庄，但比以前少得多。它是爪哇岛和巴厘岛的特有种，已广泛引入到东南亚大部分地区。这种曾经常见的鸟类近年来急剧减少，可能是由于农业耕作方式和宠物市场的需求。


    ### 树雀 `Passer montanus` 14cm


    ![](img/122_1.jpg)


    ![](img/122_3.jpg)


    Tilford/Cooke, TC Nature


    这可能是该地区所有留鸟鸟中最常见的。它有栗色头冠、黑色喉部、面侧和耳斑、浅褐色腹部，背部和翅膀有黑白斑点，以及两条浅色翼环。常见于在地上觅食，并成群袭击农作物。它特别出现在有灌木和低矮植物的开阔栖息地，从海岸到山村。它分布良好，特别是在低地，并殖民了从城市到森林空地的几乎所有区域。它的范围从欧洲一直延伸到澳大利亚。


    ### 织雀 `Ploceus manyar` 14cm


    ![](img/122_1.jpg)


    ![](img/123_2.jpg)


    Morten Strange


    这种群居物种的繁殖雄性头部黑色带有金色头冠，背部为深褐色带有红褐色的羽缘，呈现条纹状，白色腹部带有黑色条纹。雌性和非繁殖期雄性具有黑色条纹的棕色头部以及浅眉和下巴。大型筑巢群建立在良好食物区附近的孤立树木上，复制的雄性会离开雌性独自编织复杂的悬挂巢。繁殖后它们形成大群迁徙群体，在结籽的草地停歇，通常在稻田周围。它们局部出现在爪哇岛和巴厘岛低地的芦苇丛、稻田和沼泽草地上。


    ### 菲律宾织雀 `Ploceus philippinus` 15cm


    ![](img/122_1.jpg)


    ![](img/123_3.jpg)


    Morten Strange


