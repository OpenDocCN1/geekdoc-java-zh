    (*M. amboinensis*). It is much smaller than the Barred Cuckoo Dove (*M. unchall*)
    and more of a chestnut-brown. The male’s upperparts are uniform brown, with a
    light purplish iridescence on the neck and upper breast. The underparts are slightly
    paler chestnut-brown. Females are similar, but have black barring on the back
    and wing-coverts and slight barring on the upper breast. It prefers primary-forest
    edges and clearings, where it spends much of its time in search of food. Common
    in the hill forests of Java and Bali, with endemic forms occurring on the south
    Sumatran islands, although there are few records from Sumatra itself.


    **LITTLE CUCKOO DOVE** *Macropygia ruficeps* 29cm


    ![](img/48_2.jpg)


    ![](img/51_3.jpg)


    Morten Strange


    Smaller than the other brown cuckoo doves, the Little Cuckoo Dove is separated
    by its buff breast and by the dark brown subterminal bar on its outer tail feathers.
    The upperparts also are lightly barred black and the upper breast is often heavily
    barred, especially on the female. Males have green and purple iridescence on the
    nape. They have red legs and a brown-tipped black bill. This species congregates,
    often in large flocks, along forest edges, feeding in grassland and ripening rice
    fields. It is a common bird in the hills and montane forests throughout the region.'
