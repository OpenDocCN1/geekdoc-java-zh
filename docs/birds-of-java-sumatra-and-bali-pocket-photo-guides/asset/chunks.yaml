    upperparts and whiter underparts. A common winter visitor from Asia, found mainly
    around coastal lowlands, particularly pastureland, paddyfields and dried-up marshland.


    **GREY WAGTAIL** *Motacilla cinerea* 19cm


    ![](img/78_2.jpg)


    ![](img/80_1.jpg)


    Tilford/Cooke, TC Nature


    A typical wagtail in shape and tail-wagging behaviour, running and skipping among
    the rocks and running water. Its flight is markedly undulating. It has a grey
    crown and mantle, with bright yellow on underparts and rump. The chin and eye-stripe
    are whitish and the ear-coverts greyish. The underparts of juveniles are much
    paler. The very long black tail is edged white. The bill is dark brown and the
