- fmt: '

    Although resident in the area, Bridled Terns spend most of their time out at sea,
    being driven ashore by bad weather or by the necessity to breed and moult. They
    feed on small fish or floating invertebrates, taken from the surface of the sea.
    This is a medium-sized tern with dark grey-brown back, tail and wings, white underparts
    and a long forked tail. The crown, nape and eye-stripe are black, leaving a thin
    white forehead leading into a short white supercilium. The leading edge of the
    wings is white, as are the outer tail feathers. Seen ashore more during the summer
    months, but then only singly or in small groups.


    ### GREAT CRESTED TERN `Thalasseus bergii` 45cm


    ![](img/46_2.jpg)

    ![](img/47_1.jpg)


    This tern appears very large, and has a grey back and rump and white underparts,
    neck and patch above the bill. In breeding plumage, it has a black cap extending
    backwards to form a slight crest. During the summer, the black crown becomes heavily
    mottled with white, and gradually turns to white-mottled grey as winter approaches.
    It has a yellow bill and black feet, the bill colour distinguishing it from the
    very similar but slightly smaller Lesser Crested Tern. Juveniles are heavily marked
    with brown on the upperparts and have a dark grey tail and outer primaries. A
    very common tern of inland waters.


    ### LESSER CRESTED TERN `Thalasseus bengalensis` 40cm


    ![](img/46_2.jpg)

    ![](img/47_3.jpg)


    Steve Young


    This species looks very similar to the Great Crested Tern, but is slightly smaller
    and has a distinctive orange bill. In breeding plumage, the black cap extends
    forward to meet the bill. After breeding, the forehead and forecrown become white,
    leaving a black crest. Juveniles appear more like non-breeding adults, but with
    greyish wings and mottled brown upperparts. Often associates with other terns,
    sometimes in large flocks. Occurs in coastal waters and often far out to sea,
    but is more often observed along sandy and muddy shorelines. A common winter visitor
    to Java and Bali, but less so to Sumatra.


    ### THICK-BILLED GREEN PIGEON `Treron curvirostra` 27cm


    ![](img/48_2.jpg)

    ![](img/48_1.jpg)


    Chew Yen Fook


    This is a fairly robust pigeon with red feet and a yellow iris surrounded by a
    pale bluish-green eye-ring. Males have a maroon mantle and back, whereas females
    are green. The underparts are bright green, the flanks darker green and barred
    white. The neck is green, becoming greyish on the ear-coverts, with the forehead
    and crown grey. The two subspecies in Sumatra (`T. c. curvirostris` and `T. c.
    harterti`) have a substantial pale green bill with a red base, while that of `T.
    c. hypothapsina` from the islands of south-west Java has an olive base. A fairly
    common and noisy bird of lowland forest, especially among fruiting trees.


    ### PINK-NECKED GREEN PIGEON `Treron vernans` 27cm


    ![](img/48_2.jpg)

    ![](img/48_3.jpg)


    Tilford/Cooke, TC Nature


    This small green pigeon is distinguished from similar pigeons by its grey tail
    with black band and pale grey tip. The male has a blue-grey head merging through
    pink to orange on the lower breast; the abdomen is green and yellow, and the back
    and wings green. The female is green, lacking the male’s brighter colours, but
    identified by tail pattern and by its company with the distinctive male. Its calls
    are a ‘cooing’ whistle and, when feeding, a series of crow-like rasps. Common
    in lowland and coastal forest as well as in more open countryside, becoming even
    more conspicuous when trees are fruiting. Occurs from southern Burma through to
    the Lesser Sundas, and normally resident.


    ### BLACK-NAPED FRUIT DOVE `Ptilinopus melanospilus` 27cm


    ![](img/48_2.jpg)

    ![](img/49_1.jpg)


    Tilford/Cooke, TC Nature


    This species usually occurs in pairs but being very timid it is seldom seen except
    when it congregates in flocks at fruiting trees. It is, however, usually detected
    by its resonant `ow-wook-wook... ow-wook-wook` call. It has predominantly green
    upperparts, tail and lower breast with a yellow vent and red undertail coverts.
    The male has a pale grey head with a conspicuous black nape and yellow throat.
    Females have all green heads. Both have red feet and greenish-yellow bill. It
    is a locally common fruit dove of the lowland and hill forests of Java and Bali
    not normally found on Sumatra.


    ### JAMBU FRUIT DOVE `Ptilinopus jambu` 28cm


    ![](img/48_2.jpg)

    ![](img/49_3.jpg)


    Chew Yen Fook


    Predominantly bright green upperparts, white underparts and red face separate
    this from other fruit doves. The male’s face is crimson, and he has a black throat
    patch, a bright pink tinge to the upper breast and chestnut undertail-coverts.
    The female has a dull purple face, her undertail-coverts are orange-brown and
    the upper breast bright green. The bill is pale orange and the legs crimson. A
    common lowland bird of Sumatra, it is rarely found beyond West Java. It prefers
    more open wooded areas with an abundance of fruiting trees. It occurs mainly around
    the coast and on small offshore islands.


    ### GREEN IMPERIAL PIGEON `Ducula aenea` 42cm


    ![](img/48_2.jpg)

    ![](img/50_1.jpg)


    Chew Yen Fook


    A large green and grey pigeon which prefers to live high in treetops, where it
    feeds on figs and other fruits, normally swallowing whole. It is the commonest
    pigeon of the region’s lowland rainforest, but becoming increasingly difficult
    to locate as its habitat is lost. Head, neck and underparts are pinkish-grey,
    with chestnut undertail-coverts. The upperparts are green with bronze iridescence.
    It has a red bill.


    ### PIED IMPERIAL PIGEON `Ducula bicolor` 40cm


    ![](img/48_2.jpg)

    ![](img/50_3.jpg)


    Chew Yen Fook


    This is a striking bird, mainly creamy to ivory-white, with black flight feathers
    and tip of tail; the bill and feet are blue-grey. Immatures are greyer. Found
    more often in mangrove and coastal forests, it sometimes congregates in substantial
    breeding colonies where fruiting are readily available. Hunting has decimated
    the population of this beautiful pigeon, particularly in Java and Bali. Fortunately,
    it still remains quite common on the offshore islands of Sumatra and elsewhere
    in its range, which extends from the south of Burma to New Guinea. It is a resident
    species, but often moves long distances between islands.


    ### RUDDY CUCKOO DOVE `Macropygia emiliana` 30cm


    ![](img/48_2.jpg)

    ![](img/51_2.jpg)


    This species is sometimes treated as an Indonesian form of the Brown Cuckoo Dove
    (`M. amboin`). It is much smaller than the Barred Cuckoo Dove (`M. unchall`) and
    more of a chestnut-brown. The male’s upperparts are uniform brown, with a light
    purplish iridescence on the neck and upper breast. The underparts are slightly
    paler chestnut-brown. Females are similar, but have black barring on the back
    and wing-coverts and slight barring on the upper breast. It prefers primary forest
    edges and clearings, where it spends much of its time in search of food. Common
    in the hill forests of Java and Bali, with endemic forms occurring on the south
    Sumatran islands, although there are few records from Sumatra itself.


    ### LITTLE CUCKOO DOVE `Macropygia ruficeps` 29cm


    ![](img/48_2.jpg)

    ![](img/51_3.jpg)


    Morten Strange


    Smaller than the other brown cuckoo doves, the Little Cuckoo Dove is separated
    by its buff breast and by the dark brown subterminal bar on its outer tail feathers.
    The upperparts also are lightly barred black and the upper breast is often heavily
    barred, especially on the female. Males have green and purple iridescence on the
    nape. They have red legs and a brown-tipped black bill. This species congregates,
    often in large flocks, along forest edges, feeding in grassland and ripening rice
    fields. It is a common bird in the hills and montane forests throughout the region.

