    Similar to but smaller than the Olive-winged Bulbul, this species is easily separated
    as the race found in Sumatra and Java has white eyes. The upperparts are a dull
    brownish-grey, the belly white and the vent cream. Both chin and throat are pale
    buff to white. The bill is black and the legs brown. An inhabitant of forest,
    it also ventures into more open countryside, secondary growth and sometimes plantations,
    but invariably it keeps to the treetops. In Sumatra it is fairly common in lowland
    primary forest, but in Java it is now restricted to the southern lowland forests.


    ### RED-EYED BULBUL `Pycnonotus brunneus` 17cm


    ![](img/82_1.jpg)


    ![](img/85_3.jpg)


    Chew Yen Fook


    Another of the smaller bulbuls found found in Sumatra but not in Bali or on the
    Javan mainland. It is very similar to but smaller and much browner than the Olive-winged
    Bulbul, and its ear-coverts are brown, lacking any white streaking. The underparts
    are buff, with the breast buff-brown. The red eyes of the adult are brown in juveniles,
    and the legs and bill are brown. These birds inhabit the higher canopy, where
    they forage for insects and ripe fruits. Relatively common throughout the lowland
    forests, with a tendency to be found more at the edges of the more scrubby secondary
    forest.


    ### COMMON IORA `Aegithina tiphia` 14cm


    ![](img/86_1.jpg)


    ![](img/86_2.jpg)


    Tilford/Cooke, TC Nature


    This very secretive little leafbird requires patience if you want to get a good
    view of it. It habitually remains among the leaves of small trees, using its colour
    as a marvellous camouflage. It has olive-green to bright green upperparts, a white
    rump, and yellow underparts. The wings are black, with fairly distinct white and
    yellow edges and two very clear wingbars. There is a clear yellow eye-ring. Both
    bill and feet are bluish-grey. Mostly alone but often in pairs, it inhabits open
    woodland, secondary forest and mangroves, but can frequently be found in town
    gardens. Quite common in the lowlands of Sumatra, Java and Bali.


    ### GREATER GREEN LEAFBIRD `Chloropsis sonnerati` 22cm


    ![](img/86_1.jpg)


    ![](img/86_3.jpg)


    Of the seven leafbirds resident in the region, the Greater Green Leafbird is by
    far the largest. It is generally bright green on the back and tail, with slightly
    paler underparts. The male has a black throat and face with a blue malar stripe,
    and the shoulder of the wing is marked by a small blue spot. The female has a
    yellow throat edged by a blue malar stripe, with a distinctive yellow eye-ring.
    Juveniles are very like the female, with the blue malar stripe being very dull
    or non-existent. Typically found with other leafbirds in small flocks, high in
    dense foliage of tall trees in mangroves and primary or secondary forest.


    ### BLUE-WINGED LEAFBIRD `Chloropsis cochinchinensis` 17cm


    ![](img/86_1.jpg)


    ![](img/87_2.jpg)


    *Male (left); female (right)*


    Two subspecies of this leafbird are found in the region: `C. c. icterocephala`
    is found in Sumatra and `C. c. nigricollis` in Java. Both have the typical colour
    of most leafbirds, being generally yellowish-green above and more yellow below.
    This species is recognized by the blue wings and edges of the tail. The male has
    a black patch below the eye which extends down into a yellow-bordered black throat.
    The Sumatran race has a yellow crown and yellow to orange nape, whereas the Javan
    race has a green crown and yellow upper breast. Females lack the black head and
    throat markings. All have a blue malar stripe, a little less evident on females.
    Absent from Bali.


    ### GOLDEN-FRONTED LEAFBIRD `Chloropsis aurifrons` 19cm


    ![](img/86_1.jpg)


    ![](img/87_3.jpg)


    Tilford/Cooke, TC Nature


    The male is identified by the bright golden-yellow patch on the forehead and a
    large black throat patch extending up to the eye and across to the base of the
    bill. The centre of the throat is ultramarine-blue. The rest of the plumage is
    bright leaf-green but for a small shiny pale blue patch on the shoulder. Females
    are bright leaf-green all over, apart from the blue shoulder patch and a blue
    malar stripe. A common resident of mixed and deciduous hill forests of Sumatra.
    Like so many other birds with a pleasant musical song, it is trapped for the pet
    trade and kept as a cagebird not only in Sumatra, but in Java, Bali and worldwide.


    ### ASIAN FAIRY BLUEBIRD `Irena puella` 25cm


    ![](img/86_1.jpg)


    ![](img/88_2.jpg)


    Tilford/Cooke, TC Nature


    Apart from the black face, neck, underparts, tail and primaries, the male’s plumage
    is brilliant blue. Females are a duller blue with a greenish tinge, apart from
    their brighter blue rump. It can be distinguished from other bright blue and black
    birds by its larger size. More likely to be seen at fruiting fig trees, where
    it is often in mixed flocks with other birds. Otherwise it confines itself to
    foraging, usually out of sight, through the tops of tall trees of primary and
    secondary forest. Commonly found in the lowland forests of Sumatra, but less so
    in Java and not at all in Bali.


    ### LONG-TAILED SHRIKE `Lanius shach` 25cm


    ![](img/86_1.jpg)


    ![](img/88_3.jpg)


    The long tail, upright stance and black plumage make this shrike easily identifiable.
    It has a grey crown and nape with chestnut mantle back; the underparts are clean
    white. Adults have a black mask from the forehead through the eye and across the
    ear-coverts. Common in open areas, venturing into grasslands to the edge of human
    habitation.


    ### WHITE-BROWED SHORTWING `Brachypteryx montana` 15cm


    ![](img/89_2.jpg)


    ![](img/89_1.jpg)


    Chew Yen Fook


    This tiny member of the thrush family is very timid, seldom leaving the protection
    of undergrowth. However, it becomes bolder near mountain tops where it can be
    seen. It usually skulks beneath bushes, feeding on invertebrates and occasionally
    berries. Its presence is often advertised by its high-pitched resonating call.
    Common in Java and Sumatra.


    ### ORIENTAL MAGPIE ROBIN `Copsychus saularis` 20cm


    ![](img/89_2.jpg)


    ![](img/89_3.jpg)


    Several subspecies are found in the region, including `C. s. musicus` in Sumatra
    and `C. s. amoenus` in East Java and Bali. The former has black wings and central
    tail, with white outer tail feathers, belly and vent, and a broad white patch
    across the wing-coverts. East Javan and Bali birds are all black, except for the
    white wing covert patch. Females are much duller, with the black plumage replaced
    by grey. Juveniles have similar but mottled plumage. Common in the lowlands, with
    a wide choice of habitat from mangroves and forests to town gardens, although
    trapping for the pet trade has caused a serious decline.


    ### WHITE-RUMPED SHAMA `Copsychus malabaricus` 27cm


    ![](img/90_1.jpg)


    ![](img/90_2.jpg)


    Another beautiful songster which has declined through the actions of trappers
    for the pet trade. This bird spends a lot of time foraging in low dense undergrowth,
    hopping around on the ground. The male has a very long tail, about half its total
    length, with dull black central feathers and white outers, which it habitually
    flicks on landing. Its head, neck, back and wings are black with a blue sheen,
    its lower underparts are deep orange, and it has a conspicuous white patch on
    the rump. Common in Sumatra, where it sticks to denser parts of the forest, but
    far less numerous in Java.


    ### PIED BUSHCHAT `Saxicola caprata` 13cm


    ![](img/90_1.jpg)


    ![](img/90_3.jpg)


    Tilford/Cooke, TC Nature

