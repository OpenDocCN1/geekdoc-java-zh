    \ the open, its delightful azure-blue head and back are very obvious. The male’s\
    \ head has a short erect black crest on the hindcrown and a thin black band above\
    \ and below the bill. Another narrow black band extends across the upper breast,\
    \ with the grey belly paling to a white vent. The wings are grey and the tail\
    \ blue-black. The bluish bill has a black tip. Females have a duller blue head\
    \ and greyer breast, without any of the male’s black markings. It prefers lowland\
    \ and secondary forests, where it is usually common.\n\n### PIED FANTAIL `*Rhipidura\
    \ javanica` 19cm\n\n![](img/104_1.jpg)\n![](img/107_3.jpg)\n\nThis very active\
    \ small bird is a typical fantail in its wing-drooping posture and regular flicking\
    \ and fanning of the tail. The plumage is black and white, and it has a diagnostic\
    \ black band across the otherwise white underparts. When the tail is fanned, the\
    \ broad white tips to the feathers are very obvious. The upperparts are a dusky\
    \ black, and there is a thin white eyebrow. Both bill and legs are black. It is\
    \ found particularly in mangroves, open woodland and secondary growth at elevations\
    \ of up to 1500m, and is often present in gardens. A common resident throughout\
    \ the region.\n\n### GOLDEN WHISTLER `*Pachycephala pectoralis` 17cm\n\n![](img/104_1.jpg)\n\
    ![](img/108_1.jpg)\n\nMorten Strange\n\nThe male of this species has quite brilliant\
    \ colouring of black, white and bright yellow. The yellow nape patch is joined\
    \ by a narrow yellow band right through to the breast, belly and vent, while the\
    \ head is black except for a white chin and throat, leaving a narrow black band\
    \ between the throat and belly. The upperparts are olive-green and the tail is\
    \ almost black. Females are much duller, having drab olive upperparts and dirty\
    \ buff underparts, with the lower belly and undertail-coverts tinged yellow. Found\
    \ in hill and montane forest in East Java and Bali, but absent from Sumatra.\n\
    \n### GREAT TIT `*Parus major ambiguus/cinereus` 13cm\n\n![](img/104_1.jpg)\n\
    ![](img/108_3.jpg)\n\nTilford/Cooke, TC Nature\n\nOf the world’s 33 subspecies\
    \ of Great Tit, two are resident in the region, both very similar in appearance\
