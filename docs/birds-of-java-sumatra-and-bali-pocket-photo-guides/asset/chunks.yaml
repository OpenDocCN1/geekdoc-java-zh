    这是一种体型较大的栖地鴴鸟，偏好栖在中海拔和高海拔山地森林的茂密植被中觅食以昆虫为主的食物。可以通过其典型的棕色条纹外观和白色喉部来识别。背部为深褐色，并有浅棕色和黑色条纹，腹部有深浅栗褐色的条纹。短尾和初级羽为深褐色。像许多寿眉鴴鸟一样，它有各种响亮的哨鸣声。这是一种特有种，特别分布于苏门答腊巴厘山脉较偏远的山区。


    ### 条纹眉鴴 `Macronous gularis` 13cm


    ![](img/91_2.jpg)


    ![](img/96_3.jpg)


    Morten Strange


    这种小型山眉鴴鸟的背部均为栗棕色，包括尾部。腹部，尤其是胸部，在淡黄绿色的底色上有明显的细密黑色条纹，在下腹部和尾生处变为白色；爪哇亚种的腹部更偏灰。头部侧面为灰色，有时带有黄色。喙为棕色，腿为蓝灰色。它是苏门答腊低地的常见鸟类，成小群生活在茂密的灌木丛（尤其是竹林）和次生林中。它是西爪哇的偶见留鸟，但在巴利并不常见。


    ### 额红笑画留 `Garrulax rufifrons` 27cm


    ![](img/91_2.jpg)


    ![](img/97_1.jpg)


    Ray Tipper


    这种鸟在与其他鸟类一起在树冠下穿梭觅食昆虫时格外吵闹。它是一种有着长尾的大型鴴鸟。羽毛大部分呈柔和的橄榄棕色，下方带有轻微的红色调。喉部为白色至浅褐色，有红色的下巴和额头，翅膀为栗色。喙为黑色，足部为脏黄褐色。这是一种特有种，主要栖息于爪哇西部半部分的原始山地森林。虽然分布范围受限，但在当地并不罕见。


    ### 白冠笑画留 `Garrulax leucolophus` 30cm


    ![](img/91_2.jpg)


    ![](img/97_3.jpg)


    Tilford/Cooke, TC Nature


    白头、黑面罩以及浅浅的直立冠是这种傲娇鴴鸟的辨识特征。它是一种树栖鸟，发现于原始和次生丘陵及山地森林的下层。它们会与同类形成吵闹的群体，在叶丛中觅食，偶尔也会地面。西苏门答腊是该物种自然分布范围的东界。苏门答腊亚种背部较暗，冠较短。在亚洲其他地方发现的栗背亚种（如图）是爪哇流行的笼养鸟，经常遇到逃逸个体。


    ### 白眉短嘴鴴 `Pteruthius flaviscapis` 13cm


    ![](img/91_2.jpg)


    ![](img/98_1.jpg)


    Chew Yen Fook


    通常与其他物种成对出现，这只圆润的小鸟看起来头部比例大，且喙较厚。它会以一种特征性的方式在枝条间侧身移动觅食。雄性有黑色头部，带有明显的白色眉纹，灰色肩羽和背部，黑色翅膀和尾羽，初级羽末端带白色，三缘羽带有栗色和黄色。腹部为白色。雌性头部为灰色，眉纹不明显，背部为灰绿色。发现于爪哇和苏门答腊较开阔的低山地森林。


    ### 银耳画眉鸟 `Leiothrix argentauris` 18cm


    ![](img/91_2.jpg)


    ![](img/98_3.jpg)


    这种色彩鲜艳的中型鴴鸟拥有深黑色的头部，并有银色的耳羽点缀。肩部、胸部和额头为亮红色，有时为橙红色，臀部、尾端和初级覆羽也是如此；背部、尾部和翅羽为灰绿色。喙和腿均为黄色。它有欢快的短哨声和一系列叽喳的叫声。它是山地和次生林当地常见的留鸟，特别喜欢茂密的灌木丛，但也栖于森林边缘和更开阔的灌丛中，分布从喜马拉雅延伸到苏门答腊。常被作为笼鸟饲养。


    ### 东方芦苇莺 `Acrocephalus orientalis` 18cm


    ![](img/99_2.jpg)


    ![](img/99_1.jpg)


    Chew Yen Fook


    这是一种相当较大的棕色莺，带有非常明显的浅肉褐色眉纹，下方有一条纤细的深棕色眼纹。其腹部为白色，在侧腹、臀部和上腹部过渡为肉褐色，上腹部和胸部两侧有稀疏的棕色条纹。较大的喙上部为棕色，下方带粉色，腿为蓝灰色。作为一种规律性的冬季迁徙鸟，它们从东亚的繁殖地迁往该地区，通常发现于低地的芦苇丛和沼泽，但也经常出现在水边的稻田和灌丛中。


    ### 扇尾�� `Cisticola juncidis` 10cm


    ![](img/99_2.jpg)


    ![](img/99_3.jpg)


    Tilford/Cooke, TC Nature


    通常被称为扇尾莺，这种小鸟分布于非洲、欧洲穿过印度、东南亚和巽达群岛，直到澳大利亚北部。它是一种小巧、相当不起眼的棕色鸟，布满深棕色和肉褐色条纹。它有白色腹部和尾底，侧腹呈暖色，棕色尾巴带白色。它的白色眉纹将其与亮眉鹯区分开。它是苏门答腊、爪哇低地常见的草地鸟，天生被水稻田所吸引。


    ### 亮眉鹯 `Cisticola exilis` 11cm


    ![](img/99_2.jpg)


    ![](img/100_1.jpg)


    Morten Strange


    非繁殖期的鸟和雌性与扇尾鹯非常相似。区别在于它们的头部更金，且肉褐色的眉纹与后脑颜色相同。喉部为白色，腹部为肉褐色。也被称为金头鹯，繁殖期雄性具有金黄色冠和棕色臀部。在爪哇和巴利的低地，它是芦茅草地的常见鸟类；在苏门答腊仅当地常见。它喜好的草丛比扇尾鹯高。


