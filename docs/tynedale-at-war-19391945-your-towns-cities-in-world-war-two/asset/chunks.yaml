  trans: '

    泰恩代尔在二月发现了一项对抗纳粹的新武器，当时启动了`赫克斯姆及地区马土豆周`，当地主妇们被敦促停止食用面包，转而供应马土豆饼。这一活动得到了食品部长`伍尔顿勋爵`的支持，他在给`零售水果贸易联盟``赫克斯姆`分支主席`S.F.
    Robinson`的一封电报中表示：“通过承认食用当地食品的重要性，并将我们的小麦运输空间腾出来用于更坚固的货物，`赫克斯姆`树立了良好的典范。”他还为最佳原创马土豆食谱设立了两金尼的奖金。该地区的烘焙师也发挥了作用，出售由马土豆制成的司饼、蛋糕和点心，许多商人参与了《库兰报》中关于`马土豆周`的押韵广告活动。


    最受关注的是来自`西威拉姆和普鲁德霍合作社`的一首诗，该协会的驻押韵诗人写道：


    ```

    希特勒对戈培尔说，

    英国人都是没用的，

    他忘记了泰恩赛地的乔治人

    他们是为土豆而战的恶魔

    他们在埃及证明了这一点

    当时罗姆尔正落荒逃亡

    他回电给希特勒说：

    我的老天爷，我们得逃命了。

    ```


    来自`沃克`的杂货商`W. Civil`贡献了：


    ```

    你无法驾驶飞机，

    或指挥英国潜艇

    但你可以通过吃当地的土豆

    来击败纳粹。

    ```


    来自`赫克斯姆伍拜恩露场`的商人`E. Dawson`写道：


    ![Image](img/f0134-01.jpg)


    一项让主妇在准备食物时使用当地马土豆而非进口面粉的大型运动，促成了`赫克斯姆马土豆周`的启动，`食品部`为最佳马土豆食谱提供了两金尼的奖金。


    ```

    节省小麦多吃土豆

    帮助赢得战斗

    它将援助我们勇敢的海军

    让匈牙人魂逃窜。

    ```


    哈尔特威斯尔的水果商`E. Carrick`写道：


    ```

    少吃面包多用土豆

    为了营养它们是极品

    让船只带来大炮和坦克

    赢得伍尔顿勋爵最热诚的感谢。

    ```


    在随附的社论中，《库兰报》写道：


    “质的马土豆，印加人真正的宝藏，可能是击败威胁我们运输的潜艇的主要因素之一。通过多吃马土豆、少吃面包，许多用于进口小麦的运输空间将释放给重要的战争物资。整个地区的当地商人、妇女协会和学校正联系在一起，努力让人们更好地了解普通马土豆的营养价值。尽管马土豆在英国遗憾地被忽视，但长期以来一直是爱尔兰农民的主食，在大陆，它们的使用比在本国广泛得多。”


    有人指出，在德国的`奥芬堡`有一座英国海盗`弗朗西斯·德雷爵士`的雕像，以纪念他将马土豆引入欧洲大陆。


    `马土豆周`取得了巨大成功，尽管当地议员`I.M. Iveson 小姐`评论道：“我认为，如果`伍尔顿勋爵`禁掉马土豆一个月，他会更好地实现普及马土豆的目标，因为在上次大战期间马土豆稀缺时，它们才值千金。我认为我们正处于这场战争的最后冲刺阶段，但这往往是最的。”


    共有四十位商人参与了马土豆相关的橱窗竞赛，五金尼一等奖的获得者是哈尔特威斯尔的`R. Wright 父子公司`。安慰奖颁给了赫克斯姆`巴特尔山`的`伦敦和纽卡斯尔茶公司`以及普鲁德霍的`沃尔特·威尔逊`商店。赫克斯姆的`布鲁夫`商店和`泰恩代苗场`也获得了特别表扬。


    `伍尔顿勋爵`为最佳原创马土豆食谱设立的两金尼奖授予了赫克斯姆`阿康姆庄`的`斯坦利夫人`，她的马土豆模具被裁判描述为“一个非常实用的战时食”。


    1943 年夏天，`赫克斯姆`和`普鲁德霍`都发起了“胜利之翼”活动，其中`赫克斯姆`的目标是 25 万英镑，以提供四个中队的`飓风暴`战斗机，而`普鲁德霍`的目标是
    4 万英镑以发射一架`航空罗兰卡斯特`轰炸机。`普鲁德霍`率先实现了目标，筹集了 52039 英镑，这完全归功于`米克利联合煤矿`提供的 1.5 万英镑投资。在里奥电影院还举办了一场庆祝音乐会，澳大利亚女高音`弗洛伦斯·澳洲`和英国男低音`诺曼·阿林`以及当地合唱`普鲁德霍歌唱团`演出。


    `赫克斯姆`的活动由新任议会议长`道拉斯·克利夫顿-布朗`发起，他对非洲战争局势的转变发表了激昂演讲，他曾担任指挥官的`诺森郡骑兵团`作为反坦克部队表现出色。

