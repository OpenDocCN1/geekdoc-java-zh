    1942 年 3 月 22 日，沃克的居民听到头顶上方单架飞机引擎的声音。澳大利亚陆军士克拉里·哈克（Clarrie Harker）是英国皇家空军乌斯沃斯机场的一架`Hurricane`战斗机的飞行员，该飞机在未能成功从环绕中恢复后垂直向地面俯冲。他成功跳出了机舱，留下那架`Hurricane`坠落在莫特山农场的一片田里，并在那里化作火球并爆炸。哈克的降落伞挂在了附近的一棵树上，使他悬在半空中。当地孩子们赶到现场，发现村里的一位年老女性居民误以为他是德国人，正对着他破口大骂。


    北泰恩（North Tyne）最著名的坠机事故发生在 1943 年 2 月，当时一架美国`Mustang`战斗机以约 400 英里的的速度飞入了贝灵汉附近哈雷肖角（Hareshaw
    Head）的一处沼泽山丘。飞行员 22 岁的飞行军官约翰·菲舍尔（Johnny Fisher）遇难，英国皇家空军的搜救小组在沼泽中挖掘了 16 英尺深才找到了他的遗体。


    1943 年 3 月，一个六人小组乘坐一架`Vickers Wellington`战斗机坠毁。从英国皇家空军哈尔威尔机场起飞后，事故原因仍然是一个谜，但它是在格林豪的康穆地（Comb
    Moor）着火坠落的。调查表明，飞行员可能失去了控制，导致飞机俯冲进荒地上的泥炭沼泽，全机机员遇难。


    1943 年 6 月，一架来自诺森伯兰郡伍勒附近英国皇家空军米尔菲德机场的`Hurricane`战斗机坠落在埃尔斯登的奥特科普斯苔（Ottercops Moss）。飞行员飞行军士约翰·盖茨（John
    Gates）在坠机中失去意识，但在飞机停止移动时恢复了过来。在他未能从一次低空俯冲动作中恢复后，附近经过的士兵从残骸中救了他。


    遭遇悲剧命运的不仅是盟军飞机，1943 年 3 月 25 日，一架德国`Dornier`轰炸机在罗马墙附近的斯蒂尔里格（Steel Rigg）被一架夜间战斗机击落。四名机员全部牺牲，并葬在卡里莱尔。


    ![Image](img/f0030-01.jpg)


    这张 1940 年 1 月的海报解释了配给的现实。


    混乱一直持续到 1944 年，4 月，一名年仅 20 岁的飞行军士西里尔·杰克·朱威尔（Cyril Jack Jewell）在他的`Spitfire`战斗机撞入沃克的豪克斯蒂森林（Houxty
    Woods）时去世。


    1940 带来了新的配给规定，黄油、培肉、火腿和糖都需要券。黄油、火腿和培肉的基本配额为每人每周 4 盎司，糖的配额为每人每周 12 盎司。对于想制作果酱或养蜂的人，还提供了额外的糖供应。在异工作的人还被告知，他们可以在不使用任何券的情况下订购培肉、鸡蛋、面包和黄油，他们的茶也会随附提供糖。


    店主们称为“票券周一”的情况井井有序进行，但并没有急于接受双倍培肉配额的优惠。一位肉铺师说：“我们的培肉柜很冷清，对额外配额的需求很少。政府设定的培肉价格阻止了人们购买。普通的家庭主妇认为培肉和火腿是某种奢侈品，可以轻易放弃——消费者负担不起每磅
    1 英镑 8 士的培肉。普通的家庭主妇正在忍饥，用更便宜且提供同等营养的食物养活家人。”


    战争早期引起了公众关注的是威廉·乔伊斯（William Joyce）那尖锐的语调，他从第三帝国发出的“德国呼唤”广播让他赢得了“霍霍爵”（Lord Haw-Haw）的绰号。很快证实，乔伊斯对赫克斯姆（Hexham）并不陌生，战争爆发前不久曾在该镇代表英国法西斯联盟传播宣传活动。他甚至去过《快报》办公室，为宣传他在
    1936 年在该镇举办的会议。


    专栏作家 Hextol 在 1940 年 3 月回忆道：“我从他口中得知，他曾多次代表法西斯斯领袖奥斯瓦德·莫斯莱爵士（Sir Oswald Mosley）办事。我没有亲自报道过他的会议，但记录显示他请求结束国际金融和犹太对市场的控制。他认为，一个人民认可的领袖进行公开独裁，比国际金融的隐性独裁要好得多。”


    到年底，赫克斯姆医院供应仓库已派遣了 7000 多件物品，从 11 月初开始，仓库交付了 1000 双袜子、370 双手套、310 个头盔、300 条围巾和
    104 条针织毯。织工们正使用白色羊毛为芬兰军队制作巴拉拉克法帽，并为皇家海军制作海靴袜。鞋子制造商也被迫切需要。


    南诺森伯兰矮马俱乐部在水疗酒店（Hydro Hotel）举行了年度舞会，酒店装饰有俱乐部的紫色和金色。舞曲由克莱门特·米拉德管弦团提供，《西西格里德防线》、《Boomps
    a Daisy》、《兰贝斯漫步》和《栗树》证明非常受欢迎。


    天气在 2 月急剧恶化，记录到 34 度的霜冻，阿伦代尔（Allendale）和北泰恩的道路被大雪封堵。


    1 月 29 日发生了空袭警报，赫克斯姆所有学校的孩子都进入了防空洞，他们的歌曲包括《滚出木桶》和《跑吧，兔子，跑吧》。没有敌方飞机进入泰恩河谷，25 分钟后响起了解除警报。


    灯管制继续为泰恩代尔（Tynedale）的人们带来许多问题，司机和行人在应对黑暗夜晚时都苦苦挣扎，导致了数人死亡。丧生者中最显赫的人士之一是最近退休的《快报》首席记者弗雷德·古斯里（Fred
    Guthrie），他在离家几码远的地方被一辆双人自行车撞中导致颅骨骨折。他去世时 71 岁，工作了半个世纪。


    ![Image](img/f0032-01.jpg)


    ### 水手的故事


    战争第一个完整年份中英国早期的胜利之一是猎捕德国口袋战舰“格拉夫·施皇帝号”（Admiral Graf Spee），这被称为“拉普塔河战战”——一位来自福斯通斯（Fourstones）的水员在其中发挥了作用。他是锅炉工安德鲁·查尔顿（Andrew
    Charlton），他当时在“亚贾克斯号”（`Ajax`）上，该舰与“阿基琉斯号”和“埃舍特号”共同在大西洋追击这艘巡洋舰，直到它最终在蒙特维的海岸附近自沉。


    从南美水域返回后享受了 26 天在家时光的查尔顿锅炉工说，胜利是因为“皇帝号”的船员都是年轻纳粹，当他们发现预定目标可以反击时，他们就失去了战斗意志。


    他告诉《快报》：“他们的长是个真正的绅士，属于老派，但船员是由希特勒运动的年轻人组成的。在对我们发动一次进攻后，他们就没有战斗力了。当他们看到我们可以反击时，他们不想战斗了。”


    海军知道有一艘德国巡逐舰在大西洋活动并造成了巨大破坏，于是三艘船被派去追捕它。“埃舍特号”首先交战，“皇帝号”也很有兴趣地进行了回击，其 8 英寸炮火力超过了驱逐舰上的
    6 英寸武器。


