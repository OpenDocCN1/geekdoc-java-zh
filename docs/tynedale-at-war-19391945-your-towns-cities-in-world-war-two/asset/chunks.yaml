  trans: '

    英国空军被公认为有功于在 1940 年那些黑暗的日子里拯救了英国。。当时，英国远征军刚刚被强大的德国战争机器在敦迪尔克轻蔑地横扫大海。赫尔曼·戈林领导的德国空军正猛烈轰炸伦敦，英国加入希特勒铁靴靴统治下的欧洲其他国家似乎只是时间问题。


    但是，从全国各地的小机场起飞，像是一群骚扰猛禽的鸣唱鸟，火花式战斗机和飓风战斗机云云。它们摧残了德国轰炸机及其护航机，极大地削弱了德国的战争努力，导致入侵计划被搁置。尽管肯特郡的比金希尔（Biggin
    Hill）和杜克斯福德（Duxford）等机场留在人们的集体记忆中，但泰恩代尔（Tynedale）也为丘吉尔那句不朽的名言贡献了自己的力量：“在人类冲突的领域，如此多人对如此少数的人负有如此之恩。”


    ### 乌斯顿空军基地 (RAF Ouston)


    现在位于哈洛希尔（Harlow Hill）的阿尔贝马尔兵营（Albemarle Barracks）始建于乌斯顿空军基地。它于二世界大战初期作为战斗机站建成，是东北部最繁忙的机场之一。该机场于
    1941 年 3 月 10 日正式开放，其首个作战单位是第 317（维伦斯基）飓风战斗机队，这是 4 月底抵达的新的一批波兰战斗机部队之一。波兰人很快对护航巡逻的常规工作感到厌倦，并不断抱怨该地区没有德国飞机可供进攻。


    他们没有等多久，5 月 7 日，有 28 架敌机袭击了泰恩赛德——乌斯顿就在袭击名单上。该机场遭受了一架孤单 `Junkers 88` 战斗轰炸机的协同攻击，它投掷了十枚炸弹，然后在低空盘旋并对机场进行机枪扫射。它最终被哨塔上的刘易斯机枪击退，但造成了
    16 名空员受伤和 3 架飞机受损。


    米克利里（Mickley）的伊万·西摩尔（Ivan Seymour）当时是一名 15 岁的木工学徒，在机场工作，他目睹了这次轰炸。他说：


    “这是一个狡猾的入侵者，我当时住在米克利的罗斯代尔（Rosedale），从落地窗户看着他。从那个视点我可以观察到乌斯顿发生的一切。


    五枚 500 磅炸弹掉落了，幸运的是，唯一一枚可能造成严重破坏的炸弹没有爆炸。它穿过拱门掉进 NAAFI（军人食堂）建筑后方的院子里，在造成任何真正严重的损坏之前停了下来。任何知道
    NAAFI 在战期间重要作用的人都会理解，如果这枚炸弹爆炸了后果有多严重！


    因为在炸弹被拆除移除并清理现场之前，那里‘茶和点心’一直严重短缺。”


    6 月 2 日，波兰飞行员对战斗的渴求得到了满足，两名乌斯顿飞行员在泰恩茅斯（Tynemouth）海外击落了一架 `Junkers 88`。当波兰人被喷火式战斗机队取代时，乌斯顿作为国际联盟机场的角色继续延续，尽管该中队被称为肯特郡中队，但实际上几乎完全由比利时飞行员组成。


    1941 年 9 月，乌斯顿再次遭到袭击，一枚炸弹在机场中心留下了一个宽 20 英尺、深 6 英尺的坑。炸弹炸断了水管并炸破了几扇窗户，但人员和飞机没有伤亡。


    同月，一架喷火式战斗机在接近乌斯顿时坠毁，导致一名加拿大飞行员死亡，他安葬在斯坦姆福德姆（Stamfordham）教区墓地。另一名加拿大飞行员在乌斯顿空军妇女辅助队（WAAF）宿舍附近的飓风飞机迫陆中牺牲。1942
    年该基地的开始很糟糕——一名清理跑道雪地的平民被一架滑脱的喷火式战斗机撞死，另一名飞行员在第二天喷火式战斗机与虎蛾式飞机的碰撞中去世。


    著名的夜战斗机波尔顿·罗挑战者（Boulton Paul Defiant）于 10 月来到乌斯顿短留，但未与敌方发生接触。


    1942 年，乌斯顿承担了新的海空救援任务，最初使用改装的挑战者战斗机，它们可以向受困的空员投放救生艇，后来使用了另一种早期的双翼机——海牛式（Walrus），然后是装备更好的安诺安逊式（Avro
    Anson）。


    驻扎乌斯顿成功的单位之一是 226 中队，配备了新型美国制双引擎道拉斯·波音轰炸机。糟糕天气推迟了 12 架飞机的抵达，在当天结束前就有三架坠毁，造成一人死亡。一架在进场时发动机熄熄坠；另一架在两个发动机失效后在大特惠廷顿的田里腹陆；第三架则在机场上完成了壮观的迫陆。


    1943 年 6 月，乌斯顿发生了另一场悲剧，两架喷火式战斗机在接近机场时在空中碰撞，两名比利时飞行员当场死亡。


    乌斯顿后续的角色还包括拖曳目标进行靶射练习，随后作为空中观察哨。它还是使用机载雷达的先驱站之一，令人难以信的是，曾一度有 50 多架安逊式飞机驻于此。威灵顿轰炸机也被改装为雷达训练机，其中
    29 架驻扎在乌斯顿，还有近两打飓风式战斗机为雷达学员提供移动目标。


    欧洲战争结束前四天，乌斯顿失去了它唯一的一架飓风战斗机，该飞机发生发动机故障，在埃肖特农场（Eshott Farm）进行了腹陆。


    与当时的情况不同的是，乌斯顿空军基地的住宿设有中央供暖和自来水，这深受空员和军官的喜爱。基地建造了一个大型总部和复杂的、受高度保护的控制室，表明该机场在开放后可能具有重要作用。还有供军官、士官和空员使用的舒适食堂。


    机场有三条跑道，最长的达 1400 码，在那个时期不寻常的是，它们的设计几乎在一个一点相交。这种设计是不受欢迎的，因为一旦遭到敌袭，一组准的炸弹可以一次性关闭三条跑道。由于敌袭的可能性极高，乌斯顿在庞特兰德（Ponteland）北部的贝瑞维克山（Berwick
    Hill）拥有自己的诱饵机场。


    在铺设沥青之前，英国空军就已经利用乌斯顿的平整草地了。它是第 13 集团通信飞行队的轻型飞机所在地，该飞行队使用一系列飞机，包括战争爆发时被征用的民用飞机。除了像格洛斯特·格拉迪石（Gloster
    Gladiator）这样可靠的军用双翼机外，还有被遗忘的机型如珀西瓦·维加海鸥（Percival Vega Gull）和迈斯·惠特直（Miles Whitney
    Straight）。乌斯顿还被位于哈灵顿厅（Hallington Hall）的第 3 无线服务段校准队使用。


    战争的结束并不意味着乌斯顿的结束。随着 607（达勒郡）中队的德哈维兰吸血鬼战斗机的到来，该机场进入了喷气机时代，这要求延长主跑道。在 20 世纪 50 年代和
    60 年代，乌斯顿被各种小型单位使用，英国空军滑翔学校成为 1975 年陆军接管前最后一家驻扎该基地的空军部队。令人惊讶的是，尽管自 1975 年以来未再作为机场使用，但跑道和周线依然完好如初，控制塔依然屹立。

