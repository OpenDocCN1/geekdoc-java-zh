    # Honors


    Air gunner Flight Sergeant George Milburn (25), a native of Allendale, living
    in Branch End, was awarded the Distinguished Flying Medal for his cool actions
    over enemy territory, where he was involved in over forty operational flights,
    after switching to aircrew following two and a half years with the balloon barrage.
    The citation noted that during an attack on Hanover, his aircraft was trapped
    in the beam of a searchlight for eight minutes, when it was under attack from
    German fighters. Milburn’s cool directions and accurate fire, even when he was
    dazzled by the searchlight, enabled his pilot to take the necessary evasive action.


    Stretcher-bearer Private Ernest Hulse, of Corbridge, was also given the Military
    Medal for outstanding bravery in rescuing wounded men when under heavy shellfire
    and mortar fire in a battle in Italy.


    ## 1944


    There was a grim start to 1944, with two major tragedies in rapid succession causing
    much distress throughout the district. The `Courant` of 22 January reported not
    only the sinking of `HMS Tynedale`, but also the fatal injuries sustained by popular
    Hexham Queen Elizabeth Grammar School master and Tynedale rugby star K.W.D. Hodgson,
    while on exercise with the Home Guard.


    ![Image](images/f0151-01.jpg)


    Tynedale Rugby Club star and Hexham Queen Elizabeth Grammar School history master
    Major K.W.D. Hodgson, who died after being caught up in an explosion at a Home
    Guard training exercise.


    Major Hodgson was the commanding officer of the headquarters company of the Hexham
    Home Guard, and on 16 January 1944, he was in charge of a practice and demonstration
    session of Home Guard weapons. The training session took place at the company’s
    weapons training school, where several practices were carried out using `Blacker
    Bombards` (otherwise known as a spigot mortar, an anti-tank device), bombs and
    other explosive devices. The session ended when Major Hodgson laid a mine to demonstrate
    its action to the men, assisted by Company Sergeant Major George Douglas.


    Douglas, a railway signalman in ‘civvy street’, told the subsequent inquest that
    he had helped the major set the mine, which was buried in the ground, with wires
    attached so that it could be exploded by remote control. They then walked some
    20 yards away from the mine and took cover behind an embankment, which was some
    15ft below the level of the mine. The mine was of the type that exploded on the
    ground and then launched a projectile which exploded in the air.


    Douglas said: ‘We both took cover, and then I heard an explosion, which was quickly
    followed by second one, so I knew the mine had exploded. I had my head covered
    by my arms all the time and, after the second explosion, I asked Major Hodgson
    if he was all right. I received no reply.’


    Douglas went over and found him lying face down on the embankment, and when he
    turned him over, it was clear he had been seriously injured. There was a puncture
    wound to his forehead just above the bridge of his nose and he was semi-conscious.


    Other members of the Home Guard gave first aid, before he was taken to Hexham
    Hospital and later transferred to another hospital in Newcastle. Major Hodgson
    fought for his life for thirteen days, but eventually succumbed to his injuries.
    The official cause of death was septic meningitis following a compound fracture
    of the skull.


    Douglas told Newcastle City coroner Sir Alfred Appleby that the mine had not exploded
    in the usual way. The mine was supposed to explode with an umbrella effect, but
    the shrapnel had only come down from two directions, instead of spreading all
    round.


    ‘Two or three inches either way, and the piece of shrapnel which caused the fatal
    injury would have missed Major Hodgson,’ he said. Asked for an opinion on what
    had happened, Douglas said it was possible Major Hodgson had mistaken the second
    explosion for the first and had looked up too soon.


    A verdict of accidental death was recorded, but the tragedy cut short a remarkable
    life, at just 38 years old.


    His full name was Kingsley Wallsworth David Hodgson, but he was always known only
    by his initials. He was one of the finest sportsmen in Tynedale’s history, earning
    undying fame as the captain of Tynedale Rugby Club first XV when they won the
    prestigious Northumberland Senior Cup for four years in succession from 1933-36.
    He had the rare distinction of having played rugby for three different counties,
    captaining Northumberland against Cheshire in 1933, as well as playing for both
    Yorkshire and Durham.


    Although he had officially retired as a player, taking over as team secretary,
    he still turned out for Tynedale in war-time fixtures. He was also a cricketer
    of no mean ability, having played many forceful innings for the Tynedale club.
    He was the history and games master at QEGS for thirteen years, and his memorial
    service at Hexham Abbey was one of the best attended of the year.


    Also in January, another member of the `Courant` editorial staff, Sergeant Pilot
    Harry Annan, was killed in action on flying duties. He was flying a `Halifax`
    bomber on a training exercise, crashing just two minutes into the flight, ending
    upside down in the River Ouse near Fairfield Sanatorium below Skelton, four miles
    from the centre of York. He was one of ten members of the newspaper’s staff in
    the RAF out of a total of nineteen serving in the forces.


    One of the `Courant` staff did find use for his Beaumont Street skills though,
    with reporter Sidney Foxcroft, who was serving as a corporal with the Royal Corps
    of Signals, being appointed a forward area reporter with the Eighth Army News,
    and the forces’ newspaper, The Crusader.


    In a letter to his parents in Windsor Terrace, Hexham, Corporal Foxcroft said:
    ‘The last five days have probably been the most interesting since I joined up.
    I have travelled extensively and am hopeful of making regular visits to our forward
    positions. Of the editorial staff, I am the sole member forward, and anxious to
    prove my worth. I spent today in the most forward of hospitals and with the nurses
    as interpreters, chatting with men of all nationalities.’


    ![Image](images/f0153-01.jpg)


    Sergeant Harry Annan, a former member of the Courant editorial staff, who was
    killed in a flying accident.


    Before the war Sid Foxcroft was much involved with the Scouting movement. A King’s
    Scout himself, he was Cubmaster of the 3rd Hexham pack of Wolf Cubs. After the
    war, he returned to journalism proper, and for many years, was the North East
    correspondent of the People newspaper.


    There was some good news in January though, when Fusilier William Jasper Carruthers
    (33) from Langley, arrived back home after escaping from an Italian prisoner of
    war camp and trekking 200 miles, much of his journey taking place behind German
    lines. An estate worker with the Straker family on the Leazes Estate at Hexham,
    he joined the Royal Northumberland Fusiliers at the outbreak of war serving in
    France and being evacuated from Dunkirk, before returning to the fray in the Middle
    East, where he was captured at the Battle of Knightsbridge.


    ![Image](images/f0153-02.jpg)


    Fusilier William Jasper Carruthers of Langley, who trekked 200 miles back to Allied
    lines after escaping from an Italian prisoner of war camp.


    He was held in prison camp PG53, but on the night of Italy’s capitulation and
    the overthrow of Mussolini, 500 new guards were drafted in to guard the prisoners.
    By the next day all the guards had disappeared and the prisoners had broken down
    the fences surrounding the compounds. Most inmates took to their heels, only to
    be recaptured very quickly when German troops arrived to round them up and take
    them to Germany. However, Carruthers, who was with two other men, managed to avoid
    recapture but after ten days on the run, the three decided they would be better
    on their own and went their separate ways.

