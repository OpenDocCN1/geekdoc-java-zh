    # One of the main stories on that historic front page was a warning of the depths
    to which Nazi paratroopers would sink. Readers were told that one despicable Hun
    had used a cellophane parachute to land in Belgium and, as well as his machine
    gun, he was carrying a milking stool. On landing, he rushed to the nearest cow,
    and began milking it, but his Boche trickery failed to deceive the locals who
    took him prisoner.


    There were also appeals for more ARP volunteers and a request for help with hospital
    supplies. Readers were warned that the sugar ration was to be cut from 12oz per
    head to 8oz per head per week. However, there were special concessions for people
    making jam from fruit they had grown in their own gardens. Hexham Urban Council
    asked for 11.5 tons of jam-making sugar and Bellingham RDC wanted 19 tons.


    Ordinary life went on, however, and two of the biggest cases in the paper were
    of two Prudhoe farmers fined £4 and £5 respectively for watering down their milk,
    and a Mickley couple who were jailed for neglecting their children. They were
    unsure whether they had thirteen or fourteen offspring.


    ![Image](images/f0038-01.jpg)


    For the first time in its 74-year history, the Hexham Courant featured news on
    its front page rather than adverts on 25 May 1940. Featured prominently is a warning
    to beware of Nazi paratroopers carrying milking stools as cover.


    Canon J.V.C. Farquhar was Rector of Hexham from 1919 to 1944, and at the outbreak
    of hostilities in 1939, he had a loudspeaker system installed in the Abbey so
    that the congregation at Matins could hear the sonorous tones of Neville Chamberlain
    announcing that a state of war existed between Britain and Germany.


    Mr Farquhar had a horror of incendiary bombs destroying the Abbey, so he organised
    a team of firewatchers who slept on the premises. He spent many a night himself
    on a camp bed at the top of the night stair. Local historian Rowland Charlton
    was a member of the Home Guard and used to sleep at the Moot Hall on fire-watching
    duties. At first, the Home Guard was known as the Local Defence Volunteers, or
    `LDV` – Mr Charlton always contended that the initials really stood for Look,
    Duck and Vanish!


    ## Home Guard exploits


    As the ‘Phoney War’ ended, the activities of the `LDV` in Hexham were stepped
    up, with all ex-servicemen who had volunteered for service issued with their equipment
    which comprised a khaki overall, forage cap and a rifle. More than 1,000 men had
    volunteered and to their intense disappointment, it soon became clear that not
    all would be required to serve. Lieutenant Colonel Sir Archibald White of Otterburn,
    who was commanding the Hexham group, said that everything was progressing well
    and patrols would start as soon as the various sections had brushed up on their
    shooting. He added: ‘I cannot say how many volunteers will be called upon; it
    depends on the number of sets of equipment we are to be allowed. However, it is
    certain that nothing like the full number of volunteers will be required.’


    Those in charge of the various units were assistant group commander Major Charles
    Beck Hornby of Anick; Hexham – Lieutenant Colonel J. Ridley Robb; Bellingham –
    Brigadier General J.D. Jebb and Bavington – Colonel H.S. Bell.


    Redesdale residents remember the exploits of the West Woodburn and Ridsdale Home
    Guard with much fondness. They used to have weekly training exercises and parades
    in the field behind All Saints’ Church under the watchful eye of commanding officer
    Major Anderson of Kirkharle. Among those involved were Robert and Thomas Tait,
    Hugh Snaith, Jim Wilson, Willie Robson, Jack Brodie and Harry Comer. One of the
    favourite exercises was live hand grenade drill, when the volunteers had to throw
    a grenade over the crest of a hill and into a convenient hollow to explode safely.


    ![Image](images/f0040-01.jpg)


    The Hexham Home Guard ready to do their bit should the Germans invade.


    ![Image](images/f0040-02.jpg)


    Wark Home Guard on parade.


    Needless to say, on one famous occasion a particularly inept recruit’s grenade
    failed to clear the crest and rolled gently back down towards the rest of the
    platoon, which scattered in horror.


    On another exercise the platoon was required to ascend the long bank out of Woodburn
    to the top of the quarry, to look out for enemy parachutists. The same hapless
    recruit was nominated as despatch rider and ordered to wheel a heavy bicycle from
    the centre of the village to the quarry. He had hardly time to recover his breath
    when he was ordered by the sergeant to ride the machine back down to company headquarters
    – better known as the much-missed Fox and Hounds pub. The sorry soldier gulped
    and refused the order, and when asked why by his purple-faced NCO, was obliged
    to reply: ‘Because I can’t ride a bloody bike, sarge!’


    Others remember the famous night of the supposed German invasion of the North
    East coast. The order of command was that the commanding officer, Major Anderson,
    would telephone Tommy Thompson of Clock Mill, Capheaton, who would in turn ring
    platoon member Tommy Walton. He would then telephone the next down the line and
    so on, thus all would get the alert.


    On the suspected night of the invasion Tommy Walton received a phone call from
    Major Anderson, to say that the invasion was suspected. However, the major could
    not raise Tommy Thompson and asked Mr Walton if he would please go round in the
    car and rouse him. Mr Walton duly went to Clock Mill, but there was no wakening
    Mr Thompson, despite hammering on the door and throwing stones at the windows.
    Finally, Mr Walton got back in the car and went home to bed, so perhaps it was
    just as well the Germans decided not to invade.


    ![Image](images/f0042-01.jpg)


    Eddie Waite – who went on to be chairman of Tynedale Council in the 1980s – is
    on the left here, with Harold Robson on the right. In the middle is Captain Keith.


    The Home Guard training was taken more seriously in some areas than others, as
    an unfortunate evacuee discovered to his cost when he inadvertently involved in
    an exercise involving the Humshaugh and Newbrough unit. The company was operated
    by the headmaster of Humshaugh village school, Edward Waite, who had organised
    his men into two groups – his side being the English, and the others, led by First
    World War Northumberland Fusers Sergeant Major Harold Robson, the enemy.


    Waite set up an ambush on the Haughton Road for the ‘Germans’ but the evacee,
    who had spotted Waite and his men hiding behind oil drums and bushes, innocently
    informed Robson of what he had seen. The wily sergeant major was then able to
    sneak up on Waite’s men and capture them all, to the headmaster’s incandescent
    fury.


    At school the next day, while the evacuees were having their morning lessons,
    Waite demanded to know who had tipped off the others about the ambush, and when
    the youngster confessed it had been him, Waite’s wrath was terrible. He harangued
    the terrified boy about careless talk costing lives and informed him that the
    Home Guard had a short way of dealing with Fifth Columnists – they would be shot.


    He then sent another evacuee to his home alongside the school to fetch his pistol
    and Sam Browne belt, and then blindfolded the boy before asking if he had any
    last words.


    The child lost control of his bladder before the headmaster relented.


    There was also another tale that Major Anderson decided to hide all Home Guard
    ammunition and explosives on his estate in case of invasion. Unfortunately, the
    old major forgot where he had buried it and word is that it has never been found.


    At Corbridge Home Guard, Laurence Best, was sergeant major’s runner at the age
    of 14. When well into his 80s, he recalled: ‘Some of the lads took it very seriously,
    which is perhaps just as well, but there was an Awkward Squad – of which I was
    an honorary member – who treated it as a big joke.’

