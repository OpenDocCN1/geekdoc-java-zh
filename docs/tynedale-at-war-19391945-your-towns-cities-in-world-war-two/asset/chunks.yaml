    本书献给所有泰恩代尔的男士女性，他们团结在一起，对抗希特勒战争机器的强大力量，无论是作为武装部队的一员、服务于女子土地军、家民防卫队或民防兵团，还是仅仅通过向向涌入该地区的成千上万疏散人员敞开家门。你们都贡献了自己的力量。


