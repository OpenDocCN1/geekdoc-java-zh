    来自克劳克克的士兵罗纳德·牛顿（Ronald Newton）参加了第一波登陆，他表示所有相关的滑翔飞行员都应因其勇敢表现授予维多利亚十字勋。他补充说，从德国人的进攻中撤退的士兵必须给靴子包底，才能安全地回到莱茵河。


    阿姆姆袭击行动导致了来自威尔拉姆的`滑翔飞行员团`威廉·N·巴里（William N. Barrie，26 岁）牺牲，他此前因在西西里的英勇和卓越服务已获得了卓越飞行勋章。巴里上尉的妻子玛格丽特任职于`ATS`（女子辅助军），几个月前还陪同他前往白金汉宫参加了他的授勋仪式。


    ![Image](img/f0170-01.jpg)


    来自威尔拉姆的威廉·巴里上尉在白金汉宫的仪式上佩戴卓越飞行勋章后不久，在阿姆姆的`滑翔飞行员团`服役期间阵亡。


    战争爆发时，他正在接受会计师培训，后被任命为`皇家诺森伯郡燧团`军官，随后转入`陆军航空兵团`。在生活中，他深度参与了`童军`运动，是赫克斯姆首位`皇家童子军`。他还代表泰恩代尔参加橄榄球比赛。


    两名在赫克斯姆万莱斯巷一起长大的孩子同随`侦察团`一同上战场，他们是约翰·詹姆斯·斯凯尔顿（John James Skelton，24 岁）中士和托马斯·威廉·哈森（Thomas
    William Hudson，23 岁）士兵，均因在西欧的英勇表现被授予`军事勋章`，并在布鲁塞尔的一场特别仪式上，由伯纳德·蒙特盖米（Bernard Montgomery）元帅将勋章别在他们胸前。


    这些奖项是在维姆拉伊杰（Vemraij）的一次巡逻后获得的，当时他们遭到猛火，导致一名中士伤势严重到不得不留在原地。在返回基地时，斯凯尔顿中士自愿去营该士兵，哈森士兵也自愿陪他去。他们乘坐一辆装甲车，在距离伤员仅
    50 码处遭遇了来自步枪和机枪的致命火力，不得不停下。然而，这两个好哥们儿在距离敌人不到 100 码的情况下下车，成功营救了受伤的战友并将其拖回了装甲车。


    ![Image](img/f0171-01.jpg)


    两名来自赫克斯姆的和平时期邻居的男子，在`皇家诺森伯郡燧团`的`侦察团`服役期间，均因在欧洲的英勇表现被授予`军事勋章`。托马斯·哈森（Thomas Hudson）士兵（左）和约翰·詹姆斯·斯凯尔顿中士在布鲁塞尔的一场仪式上，由伯纳德·蒙特盖米元帅将勋章别在他们的制服上。


    表彰信写道：“斯凯尔顿中士凭借其卓越的英勇行为和完全不顾自身安全，防止了战友被俘，并很可能拯救了他的生命。哈森士兵保持了完全的冷静，他卓越的勇敢典范对所有一同作战的人来说都是极大的鼓舞。”


    圣诞前的一周，赫克斯姆西端客栈（West End Inn）的经理被罚 20 英镑，加 5 英镑 16 士林的诉费。衡量官描述这是一起“极其廉耻的严重掺假案件——是我从事这份工作
    40 年来遇到最严重的一起”。执照人约翰·威廉·伯恩斯（John William Burns）被发现出售掺水比例高达 34%的威士忌，以及加入了 33.4%水的金酒。他声称这些稀释的酒是供他自己使用，以便在接受客户的赠酒时不会醉酒，但法官驳回了他的主张。


    ### 1945 年


    1945 年的开端十分阴郁，一名在伯明翰从事战争工作的赫克斯姆女性被发现被杀害，喉咙里被塞了 75 英镑现金。她是阿格内斯·杜勒利（Agnes Dooley），在她尸体旁的是赫克斯姆医院的前任门卫，J·约翰逊（J.
    Johnson）。验尸判定团判定约翰逊杀杀了杜勒利小姐，随后自杀。


    据确认，由赫克斯姆地区赞助的失事`泰恩代尔号`的替换舰是在米德尔斯堡建造的`洛赫·埃克号`（HMS Loch Eck）护卫舰，许多成员来自该地区。船长 R.C·弗里克（R.C
    Freaker）海军上尉表示，他对继承了该地区对`泰恩代尔号`的喜爱感到自豪，并希望他的船在面对敌人时也能同样出色。该舰深受当地小学生的欢迎，赫克斯姆高学的五十多名学生给船员写了信寻求笔友。


    `洛赫·埃克号`是一艘成功的反潜艇杀手，得益于布莱切利园`Enigma`密码破译员提供的信息，她能够精确定德国潜艇的位置。她驻扎在西北海域的斯卡帕湾，仅在
    1945 年 2 月就帮助击沉了三艘 U 艇。她幸存了战争，后转入新西兰海军成为`HMNZS Hawea 号`。


    ![Image](img/f0172-01.jpg)


    `洛赫·埃克号`，赫克斯姆地区在`泰恩代尔号`沉没后采用的驱逐舰。


    一名骗子在对沃克附近的奇普彻斯城堡（Chipchase Castle）住客身上耍了“恶劣诡计”后被判禁六个月。肯尼斯·麦克纳斯（Kenneth McManus）出现在泰勒家族的家族宅地，穿着`加拿大军`中尉军服。他说自己是服役`爱尔兰卫队`的罗伯特·泰勒（Robert
    Taylor）上尉的好友，并在安齐奥滩滩头与他并肩作战。他声称泰勒上尉曾敦嘱他，如果去北方一定要顺路去城堡。他作为一名军官和绅士受到了热烈欢迎，并在城堡被分配了一套套房，可以自由进入该物业。他被带出去打猎和钓鱼，在度过四天的奢侈生活后离开。


    直到他离开后，泰勒夫妇才发现价值 200 英镑的珠宝丢失了，还有武器室的一支步枪和一把手枪。


    警方介入调查，麦克纳斯在几周后于爱丁堡被捕。事实证明，他是梅西德的布特尔人，从未去过加拿大、安齐奥或任何战场，实际上是一个逃亡的逃兵。据推测，他在逃亡期间遇到了泰勒上尉，并设法知道了对方住住。他在赫克斯姆的一家酒吧里卖了部分被盗珠宝，谎称那是他姨妈留给他的。


    与此同时，随着盟军逼近德国，一名服役`阿盖尔和苏格兰高地团`、来自西蒙伯的 21 岁士兵爱德华·杰弗里（Edward Jeffrey）以英勇表现平定了一次德国反击。杰弗里士兵曾是在坦克支持下夺一个农场堡垒的一员，但坦克撤离后，德国人重新集合并试图夺回。杰弗里士兵让敌人靠近，然后用他的`布登枪`击杀了六人，导致其他人撤退。


    ### 德国战俘逃亡


    并非只有英国战俘会逃跑。1945 年 4 月 1 日，奥地利人约瑟夫·基希奇多弗（Josef Kirchdorfer，19 岁）和七名战俘从哈尔特威斯附近的`菲斯斯顿城堡`（Featherstone
    Castle）战俘营逃脱。基希奇多弗在 1944 年在荷兰敌后执行间谍任务时被捕。得益于他口袋里有一封来自世界上第一位女性飞行员——著名的汉娜·瑞奇（Hanna
    Reitsch）的信（她曾被希特勒授予铁十字勋和空军钻石勋），他被送往英国审讯。


    在伦敦关押了两周后，他被送到菲瑟斯顿，并很快成为一项逃亡计划的核心。他们在半夜逃脱，打算偷窃一架飞机回国。如果小组中至少有两名飞行员，这个计划本可能可行，但这次行动演变成了灾难。


