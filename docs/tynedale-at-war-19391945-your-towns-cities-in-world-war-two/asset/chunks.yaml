    他们八人分为两组，约瑟夫（Josef）和两名同伴沿着南泰恩河（South Tyne）上到阿尔斯顿（Alston）。然而，当地警员 `PC Wilson` 拦住了这三个人并“发现他们是德国人”，在休假士兵
    `John Fawcett` 的协助下，将这些人送往了警察局。令人生畏的 `PC Wilson` 在阿尔斯顿附近的哈尔登磨坊（Haldon’s Mill）逮捕了另外五名逃犯中的四人。那组选择渡过河流，以便任何追踪他们的猎犬失去气味，但小组中一名德国空军（Luftwaffe）`Karl
    Kropp` 最后被看到试图涉过汹涌的南泰恩河，水位没到了他的腰部。


    三天后，他的遗体在赫克斯姆（Hexham）附近的泰恩河被打捞起，并埋在赫克斯姆墓地的战争墓区，棺材上覆盖着��字旗，由六名 `Luftwaffe` 同伴抬着。另外六名德国战俘在武装护送下走在棺材后面。棺材降入墓中时，所有德国人都行了军礼并脱帽致哀。仪式结束后，每位战俘都走到墓旁，敬礼，并各向棺材上撒了三手泥土，然后再次敬礼并回到队列。


    `Klopp` 的遗体在 1958 年被挖出，与在赫克斯姆去世的其他战俘遗体一同送回了德国。


    # 第章


    ## 管理和平


    当胜利的盟军挺进柏林时，许多战俘被遣遣回泰恩代尔（Tynedale），每个人都有关于他们所遭受苦难的故事要讲述。其中来自赫克斯姆的乔治·克拉克（下士（`Lance
    Corporal George Clark`），他在 1942 年为皇家诺森伯郡掷击团（Royal Northumberland Fusiliers）服役期间，在骑士桥（Knightsbridge）被俘。


    他在意大利被关押了一年，随后被转到西西里西亚的一个营地，该营地于 1945 年 4 月被美国人解放。他告诉《库兰特报》，当美国人接近时，德国守卫撤了，并升起了白旗，但“饼干兵”（doughboys）为了追击撤退的德军而绕过了小镇。有两天时间没有守卫值班，但很明显美军短期内不会回来了，守卫重新上岗，白旗也被拉了下来。


    当美国人终于回来时，联合军旗和星条旗在营地上方飘扬，战俘们用床单制作了“战俘”字样。`克拉克下士`说：“欢呼声震耳欲聋。”


    ![Image](img/f0175-01.jpg)


    在当了三年战俘后，来自赫克斯姆的乔治·克拉克下士（`Lance Corporal George Clark`）在美军解放营地后，经历了一段 530 英里的跋涉，体重减轻了三半石重（约
    22 公斤）。


    然而，他的磨难并没有完全结束，因为在释放后，他面临着长达 39 天、530 英里的回家之路，在此期间他又减轻了三半石重。或许令人惊讶的是，他似乎对俘虏者没有什么成见，他说俘虏者尊重死者，并为伤者尽了所能。


    他说英国看起来与他离开的国家没有太大区别，尤其是监狱营周围流传着传言，国家正处于饥饿边缘，人们除了黑面包别无可吃。


    ![Image](img/f0176-01.jpg)


    《赫克斯姆库兰特报》（Hexham Courant）在头版上迎接欧洲胜利日消息的方式。


    ### 欧洲胜利


    当欧洲胜利最终于 1945 年 5 月 8 日确认时，泰恩代尔地区的消息引起了克制的喜悦，而非狂热的欢呼。除了装饰华丽的街道和商店橱窗，以及大多数人在外套上佩戴着爱国标志外，那里看起来就像赫克斯姆一个普通的集市日。赫克斯姆郡法院（`Hexham
    County Court`）的法官在判决时脱下了假发法袍，取而戴上红白蓝色的丝花。


    修道院广场架了一个扬声器，听首相温斯顿·丘吉（`Winston Churchill`）宣布停火，赫克斯姆修道院（Hexham Abbey）的钟声响起了胜利之钟。那天晚上，超过
    1000 人挤进修道院，参加由院长 A.G. 哈迪牧（`Canon A.G. Hardie`）主持的感恩仪式，整个地区举行了类似的仪式。点燃了许多篝火，其中急诊医院（`Emergency
    Hospital`）院内的一堆，那里仍有许多人在接受战伤治疗。欧洲胜利日当天，酒吧、俱乐部和其他许可经营场所允许开放到晚上 11:30，但实际上，由于啤酒和烈酒的短缺，大多数商店在正常时间就关闭了。


    在奥伦代尔（Allendale），当地的小学生建立了一个巨大的篝火，由一名前战俘汤米·希尔下士（`Lance Sergeant Tommy Shield`）点燃；而在海德登桥（Haydon
    Bridge），当地红十字会的青年小组在他们的胜利篝火上烧掉了希特勒（`Hitler`）的像。整个地区举行了露天舞会、运动会和其他庆祝，但没有哪一个的规模能比第一次世界大战结束时的狂欢。


    在奥伦代尔发生了悲剧，26 岁的哈罗德·菲利普森（`Harold Phillipson`）在欧洲胜利日派对后选择穿越荒野步行回到辛德霍普（Sinderhope），他不慎掉下桥护栏，坠落
    30 英尺身亡。


    人们对给予德国战俘的慷慨食物配额表示担忧，当时英国人不得不依靠受限的配给生活。赫克斯姆地区委员会（`Hexham UDC`）主席乔·库伦议员（`Councillor
    Joe Cullen`）表示，德国人吃得比英国人好是厚颜无耻的，并补充道：“在不违反日内瓦公约的情况下，我确定可以将德国战俘的配额降下来。我们是一个奇特而卓越的民族，似乎总是对敌人非常慷慨。这些人回到德国时将是精力充沛的。”


    ![Image](img/f0178-01.jpg)


    赫克斯姆的佩斯角（Peth Head）举行了胜利茶会，每个家户都出了贡献。在服装比赛之后，有一场游行。


    欧洲胜利日后的周日，修道院举行了另一场感恩仪式，仪式之前是民防部队和其他组织的游行，包括赫克斯姆地区委员会（`Hexham Urban District Council`）的成员。游行的队伍还有赫克斯姆区警察、英国军团的特别警员、民卫军、陆军学员团、空军训练团、男童军、女童军和妇女辅助军。


    欧洲胜利的狂热被一个事实冲淡了：泰恩代尔的男人们仍在远东方与日本人战斗，生命仍在流失。尽管如此，有一种回归某种常态的迹象，因为将举行大选，而当工党宣布将针对赫克斯姆议员道格拉斯·克利夫夫顿-布朗（`Douglas
    Clifton-Brown`）推出候选人时，引发了愤怒。按照传统，政党不会针对议长推出候选人，因为他是整个下议院的代表，而非任何单一政党的代表。


