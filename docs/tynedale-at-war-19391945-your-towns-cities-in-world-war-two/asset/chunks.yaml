    The new year came in with a fancy dress ball at Hexham Hydro, where one brave
    soul turned up as Mussolini and was summarily drummed out of the hall.


    There was a lucky escape for a 26-year-old Hexham man, who was crossing the Newcastle
    Carlisle railway line at Quality Cottages, near Warden, when his car stalled on
