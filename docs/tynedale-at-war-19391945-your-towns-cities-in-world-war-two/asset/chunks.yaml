    Mr Tomlinson said the centre would be invaluable as it would provide a fortnight’s
    holiday for workers before they became too ill and suffered a complete breakdown
    and thus they saved thousands of valuable industrial hours. Chairman of the North
    East Rest Breaks Committee, Dr Sheila Bevington, said that in the fifth year of
    the war the need for rest breaks was psychological as well as physical. She said
    the Hexham centre was particularly needed as the stamina of North East war workers
    was poor – a reflection of the under-nourishment of girls and a legacy of the
    ghastly period of unemployment and black depression in the area.


    ![Image](images/f0147-01.jpg)


    The ship’s company of the Canadian destroyer `Restigouche` gave a helping hand
    with the harvest in the Beaufront and Anick area, mingling with the locals while
    the ship was in for a refit at Jarrow further down the Tyne.


    Two Canadian seamen, who lent a hand with the harvest in the Anick area while
    their ship was docked in Jarrow for a re-fit, celebrated their pending return
    to sea rather too well at one of the local pubs. Able Seaman Samuel Patton of
    Toronto and Leading Seaman James Fitzgerald of Montreal, decided to take a couple
    of souvenirs in the form of two bronze roe deer, which they wrenched from their
    settings in the Italian gardens at Beaufront Castle. The deer were each valued
    at £50 and the damage caused in their violent removal could not be repaired. When
    questioned by police, the men at first denied any involvement, but later admitted
    taking one each.


    Police Superintendent William Goodfellow told Hexham magistrates that the two
    men had done exceptionally good work in a voluntary capacity with the harvest
    and were well liked and well treated by the local community. It was therefore
    unfortunate that they had brought disgrace on themselves and on the ship’s company
    by their behaviour.


    Representing both men, solicitor K.H. Bolam said that after taking more drink
    than was good for them, they had gone to the castle, where people had been very
    kind to them, and decided to take the deer.


    Mr Bolam said: ‘When the men came to their sober senses, they were deeply embarrassed
    to find they had stolen the deer. How, in view of their weight, they managed to
    get them back to their billet is a matter of some conjecture.’


    He said they were very sorry for their actions, and were anxious to pay for repairs.
    They had spent several nights in Durham Gaol as a result of their actions and
    that had had a lasting effect on them. He also pointed out that while the landowner,
    Captain Harold Cuthbert, was serving abroad, his mother Lady Rayleigh, who had
    power of attorney, was not pressing for a heavy sentence, nor was she seeking
    any compensation.


    The magistrates agreed that the spell in gaol had been sufficient punishment for
    the theft and dismissed the charges. He thanked the men for doing their bit for
    Britain by helping with the harvest.


    The men were from the Canadian destroyer `HMCS Restigouche` and the entire crew
    lent a hand with the harvest at the castle and at nearby Anick Grange.


    ### Killed by a ‘rogue’ balloon


    On Thursday, 4 November 1943, two barrage balloons – used to prevent low level
    attacks and pinpoint bombing by the Luftwaffe – escaped from their moorings near
    the coast and drifted inland over Tynedale. One of the rogue balloons came to
    a halt over the Allendale fells near Sparty Lea, with its mooring ropes becoming
    caught up in a drystone wall.


    The first balloon was quickly deflated by police officers, who then set off to
    deflate the second which had come to rest further up the fell. A number of onlookers
    gathered to watch the operation, and one of them, Robert Batey (47), a council
    employee from Broadgate Cottage, Sinderhope, decided to have a closer look. Mr
    Batey was seen entering the field and kneeling down next to the balloon and seemingly
    start to roll it up. However, the balloon then exploded, fatally wounding him.
    He died later in Hexham Hospital from his injuries.


    Giving evidence at the inquest which followed, Marjorie Gilmour, of Low Hayrake,
    Sparty Lea, said that as the police left the first balloon they warned people
    to keep away from it. The crowd, including an elderly man and two children, were
    standing behind a wall looking at the balloon when it exploded.


    John Wright (79) of Thorndene House, Swinhope Mill, Sparty Lea, was taken to the
    Royal Victoria Infirmary in Newcastle suffering from a lacerated left eye, as
    was Annie Featherstone (28), also from Swinhope Mill, who suffered multiple injuries.
    Seven-year-old Vera Nixon of Chapel Cottages, Allenheads, was taken to Hexham
    Hospital suffering from slight lacerations, while Harold Nixon (14) of White Ridge,
    Sparty Lea, was taken to Shotley Bridge Hospital suffering a puncture wound to
    his chest and numerous shrapnel injuries.


    Speaking in 2006, Mr Nixon, then 77, said he was in hospital for almost two months
    after the explosion and still carried the scars. ‘I remember there were the two
    barrage balloons that got caught up on the moor,’ he recalled. ‘There were a few
    people around and the police were there. They had got the gas out of one but then
    all of a sudden there was a bang, and the next thing I knew I was 50 yards away!
    I was in hospital at Shotley Bridge for seven weeks and I still carry the shrapnel
    today.’


    After the explosion the balloon was on fire at the rear end and gradually the
    flames spread to the nose until it was entirely burnt up. An expert from the Air
    Ministry told the inquest that he thought the explosion could have been caused
    by a small pocket of gas and air in the balloon which had been ignited by friction.
    Some versions of barrage balloons carried small explosive charges that could be
    set off by entangled enemy aircraft to ensure their destruction, and this was
    another possible cause of the explosion.


    ### Local heroes in action


    The fighting spirit of Prudhoe’s Private William Henry Charlesworth, serving with
    the South Staffordshire Regiment, earned him the Military Medal for conspicuous
    gallantry in Sicily. He was part of a group who took part in a glider attack,
    the objective of which was to capture a bridge called Ponte Grande, but known
    by the troops as Waterloo Bridge.


    The bridge was captured and demolition charges were removed and telephone wires
    cut, ensuring that the vital bridge could not be blown. Fifteen minutes after
    the capture of the bridge, a party of ten German soldiers in a lorry tried to
    force the northern end of the bridge, but Charlesworth swung into action with
    his `Bren` gun, taking out five of them. When his magazine ran out, he gallantly
    charged the remainder using his `Bren` as a club, and in doing so helped to ensure
    that the work of removing the charges was not interrupted.


    ![Image](images/f0150-01.jpg)


    Private William Henry Charlesworth of Prudue was awarded the Military Medal for
    gallantry in Sicily when he refused to surrender to the enemy, despite being shot
    in the stomach.


    On another occasion he ran 50 yards under heavy fire with his `Bren` to enable
    his section to disengage themselves from the action. During the afternoon of the
    following day Charlesworth was wounded in the stomach and remained 24 hours without
    medical attention, spending his time cleaning and maintaining his `Bren`. When
    the bridge was temporarily recaptured by the enemy, he refused to surrender and
    remained in hiding, later rejoining his platoon.

