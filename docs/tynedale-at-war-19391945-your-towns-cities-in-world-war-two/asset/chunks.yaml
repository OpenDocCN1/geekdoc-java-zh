- fmt: "\nThere was a big parade through the streets of Hexham, which were packed\
    \ with people as a pipe band headed a vast cavalcade of military men, the Home\
    \ Guard, `RAF`, `WAAF`, `ATC`, National Fire Service, Girls’ Training Corps, British\
    \ Legion, Civil Defence, British Red Cross, Girl Guides and Boy Scouts. There\
    \ was also a smartly dressed contingent from the Women’s Land Army and the Home\
    \ Guard band was on parade. Tradesmen in the town joined in by decorating their\
    \ windows in patriotic style and one popular feature was the sticking of National\
    \ Savings stamps on a bomb, which was later to be dropped on Germany.\n\n![Image](images/f0138-01.jpg)\n\
    \nRaising `£250,000` to pay for four squadrons of Hawker Hurricane fighters was\
    \ the target for Hexham Wings Week in the summer of 1943.\n\nThe Wings for Victory\
    \ Week was again a great success, with the `£250,000` target in Hexham exceeded\
    \ by more than `£100,000`. The final total was `£339,106`, of which `£79,206`\
    \ came from National Savings certificates; `£46,030` from deposits at the Tindale\
    \ Ward Bank or Post Office; `£54,885` through Defence Bonds; `£4,615` through\
    \ Savings Stamps; `£67,150` through War Bonds and `£86,900` through Savings Bonds.\n\
    \nThe forty-eight schools in the area were set a target of raising `£5,000` between\
    \ them, but in fact raised `£9,941`. The thirty-nine post offices in the area\
    \ brought in subscriptions of `£94,089`.\n\nMany places in the district exceeded\
    \ their targets, including Acomb (target `£1,000`, total `£4,082`); Allendale\
    \ (`£6,000`, `£18,227`); Blanchland (`£1,500`, `£3,542`); Corbridge (`£10,000`,\
    \ `£23,607`) Colwell (`£150`, `£287 10s`); Haydon Bridge (`£3,000`, `£11,506`);\
    \ Humshaugh `£6,000`, `£9,348`); Newbrough and Fourstones (`£759`, `£8,567`);\
    \ Ovingham (`£350`, `£1,291`); Riding Mill (`£500`, `£11,160`); Simonburn (`£1,000`,\
    \ `£1,654`); Stocksfield (`£12,000`, `£32,420`) and Wylam (`£16,000`, `£19,508`).\n\
    \nBellingham’s Wings for Victory Week took place a week later, with a target of\
    \ `£40,000` to buy a Lancaster bomber. The North Tyne folk not only hit that target,\
    \ but raised an additional `£25,000` to provide five protective fighter planes\
    \ to escort the Lanc on its raids on Germany.\n\nOne of the lesser known events\
    \ of 1943 was a private visit to the district by King George VI and Queen Elizabeth,\
    \ who spent the night on the Royal Train on the Haltwhistle–Alston line at Featherstone.\
    \ The queen, the former Elizabeth Bowes-Lyon, had family links with the Bardon\
    \ Mill and Beltingham areas. Ridley Hall at Bardon Mill, now the boarding wing\
    \ of Haydon Bridge High School, was owned by Francis Bowes-Lyon, the queen’s uncle,\
    \ up to 1948. He was a great benefactor to the area, carrying out a major rebuilding\
    \ programme at Ridley Hall, and providing the lych gate and stained glass windows\
    \ at St Cuthbert’s Church in Beltingham. He was also a survivor of the infamous\
    \ ‘Wet Review’ of Scottish troops in Edinburgh in 1881 where, as Master of the\
    \ Queen’s Archers, he had the honour of holding an umbrella over Queen Victoria\
    \ for four hours as the rain teemed down mercilessly.\n\n### Medal winners and\
    \ other local heroes\n\nCorbridge provided a double war hero in Captain John Richardson\
    \ of the King’s Dragoon Guards, who was awarded a bar to his Military Cross. He\
    \ was awarded the `MC` for his part in an attack on enemy positions south of Bir\
    \ Hacheim in the Libyan desert near Tobruk in May 1942, and gained the bar following\
    \ an action in the Marble Arch area of Libya when he volunteered to lead a 370-mile\
    \ patrol which succeeded in cutting off a large part of the German army.\n\n![Image](images/f0140-01.jpg)\n\
