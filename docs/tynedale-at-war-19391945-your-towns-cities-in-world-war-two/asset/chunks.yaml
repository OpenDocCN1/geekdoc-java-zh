    赫克斯姆 Hencotes 发生了一起双重悲剧，一辆军用失控，导致一名军警和一名赫克斯姆的年轻女性死亡。司机 `Fusilier George Farrand`
    因驾驶车辆危及公共安全被罚款 `£5` 英镑，并承担了 `£1 18s 9d` 的诉费用。他还被禁止三年内持有民用驾驶执照。


    赫克斯姆治安法庭获悉，该卡车在 Hencotes 以超速行驶，撞上了一辆由一名 `ATS private` 驾驶的静止车辆，导致当时正在与她交谈的 `Grenadier
    Guards` 军警 `Lance Corporal William Hanley` 死亡。随后卡车冲入人行道，冲散了行人，并导致了住在赫克斯姆 `Osborne
    Avenue` 的 23 岁年轻女性 `Winifred Taylor` 死亡。在随后的验尸会上，法医对这一事实的讽刺性发表了评论：`Farrand` 无法驾驶私家车，却可以继续驾驶军车。


    较不严重的情况下，七名男孩因在街上踢足球被 `Hexham Juvenile Court` 各罚款 `10s` 谢令。这场喧闹的比赛发生在他 `Beaumont
    Street`、`Market Place` 以及 `Abbey` 前方。法庭获悉，球偶尔会危险地靠近商店窗，并给行人造成了不便。


    一名军用传令兵被带到 `Hexham Magistrates` 面前，因为他在 `Corbridge` 的 `Howden Dene` 以超过 `60 mph`
    的速度骑行机器——且未开启灯。来自 `Royal Artillery` 的 `Signaller Peter Green` 每项指控被罚 `£1` 英镑，但他的指挥官告诉法庭，他认为这是过度积极的表现，而非危及公共安全。传令兵的工作就是不计代价地送达，而
    `Green` 心中怀着军团最优秀的传统。


    `1941` 年的圣诞节依然是一个光辉的节日，尽管配给和票券要求导致了物资短缺。一位零售商说：“袜子可能不像往年那样种类多样，但肯定不会完全落空。人们对战争玩具的需求非常大，但无法满足这种需求。”


    鞋店尤为繁忙，一个有趣的现象是木屐鞋需求的复苏，木屐鞋不受配给限制，且无需票券即可购买。一位靴鞋商说：“如果有更多存货，我确信 `Hexham` 一半女性都会穿木屐鞋，不仅是在花园里，在街上。”


    最严重的短缺是儿童鞋，尤其是幼儿和幼儿儿童的。


    ## 1942


    新的一年随着 `Prudhoe` `Beech Grove` 的 `Leading Aircraftsman John Nattress`（22 岁）的悲剧去世开始的，他为了配合同事慷慨放弃了假期，不幸在一场事故中丧生。战前他是
    `Prudhoe Cycling Club` 的成员，同时也是 `St Mary Magdalene’s Church` 的唱诗班。


    ## 关于希特勒的严厉警告


    `Northumberland` `ARP Services` 副主管 `Major J. McVicar Munro` 也向 `Hexham Rotarians`
    发出了一个严厉的警告，他说，随着战争局势开始不利 `Hitler`，这位独裁者将毫不犹豫向英国发动致命的毒气攻击。


    他说：


    “我深信，当老虎 `Hitler` 被妥善入网时——这不会持续太久——他将竭尽一切手段对英国发动毒气攻击。然而，只有出其不意，他才能成功；而一个配备了有效呼吸器、充足的二号防毒软膏，并采取了简单但必要的预防措施的国家，对
    `Hitler` 可能发起的任何攻击付之一笑。”


    `Major Munro` 少尉表示，`Hitlerism`（希特勒主义）不应被视为当下的阶段，而是根植于德国人心理中的东西。他补充道：


    “现在的匈奴人与 `Atilla` 时代的古代匈奴人无异。当我们赢得战争时，德国人会告诉我们是 `Hitlerism` 的溃毒瘤导致了麻烦。不要让我们相信这一点。`Hitler`
    起初之所以被允许掌权，是因为军事当局认为他是他们手中合适的棋子。


    `Nazism`（纳粹主义）背后的机器拥有运行了几个世纪的同样的齿轮，而这一次，我们必须确保这些齿轮不仅仅是被敲掉了几个齿角，而是被用非常粗糙的锉磨平了。”


    ## Ossie Chipchase 的磨难


    `1942` 年 1 月见了布商 `Ossie Chipchase` 噩梦的开始，他在 16 岁时离开学校在布料仓库工作。在 1933 年萧条年仓库关闭后，他在
    23 岁建立了自己的布料业务。`1939` 年战争爆发前，他娶了赫克斯姆的女孩 `Dorothy`，两年后被征召入 `Royal Signals Corps`
    当无线电员。他被分配到一个防空小组，该小组于当年 11 月出发前往面临日本即将进攻的 `Singapore`。他在 `1942` 年 1 月到达这个 `British
    Empire` 的哨所，被分配到 `Royal Naval base` 附近的营地，随后被转到 `Argyll and Sutherland Highlanders`。


    1942 年 2 月 15 日（周日），`Singapore` 向 `Japanese Imperial Army` 投降，`Ossie` 被俘。随后他被转到臭名昭昭的
    `Changi camp` 附近的一所学校派去修路。然后他被送往 `Thailand` 开启为期五天的火车之旅，负责修建铁路。食物和衣服极其匮乏，他被迫赤脚生活和工作，只围着一条腰兜布。守卫们经常用竹竿抽打他。


    在 `2005` 年的一次采访中，他说：“在被俘的前 18 个月里，我的妻子 `Dorothy` 并不知道我在哪里。日本人对 `Geneva Conventions`（日内瓦公约）并不感兴趣，随心所欲。他们没有告知我们在这里。最后我们收到一张卡片，上面有印好的信息：‘我很好，我在领薪工作，或我在医院’。`Dorothy`
    以前每周写信，但我没有收到那些信。”她甚至根据他失踪推定死亡而收到了 `Widow’s Payment Form`。”


    但 `Ossie` 依然活得很好，1944 年 6 月，他被带回 `Singapore` 准备乘船前往 `Japan`。他是船上 1200 名战俘之一，航行了三个月——险些死在自己人手中。这艘船在
    `Philippines` 的 `Manila` 海港被美国飞机轰炸。约 750 名战俘溺水，但 `Ossie` 游到了舱顶，在艰难挣扎后移开了舱盖，在船沉没前逃脱了。`Ossie`
    与三名同伴利用舱盖和木板上岸——但他被日本人再次捕获。


    随后他被送到另一艘前往 `Japan` 的船上。其中一艘船沉了，无幸存者，但 `Ossie` 所在的船到达了日本南部，他在日本城市 `Nagasaki` 附近的煤矿工作。


    六个月后，`Ossie` 看到天空出现巨大的光芒——二战中第二枚原子弹落在了 `Nagasaki`。战争结束了，守卫逃跑了。一个月后，美国人陆路抵达，`Ossie`
    被安置在前往 `San Francisco` 的医院船上。他横跨 `US` 并乘船回到 `England`。


    1945 年 11 月 28 日，在重重困难之后，`Ossie` 和 `Dorothy` 终于在 `Newcastle Central Station` 的行人天桥上重聚了。


