    As a schoolboy Laurence was issued with a wooden rifle, but it was confiscated
    by the sergeant because his genuine .303 was too heavy for drill. There were also
    the mock battles with the Hexham Home Guard, where the Awkward Squad always had
    the same objective – to capture the local pub.


    Laurence remembers: ‘We captured Mr Pearson, the station master at Corbridge,
    and got the train to Hexham, where we secured the old Station Hotel. When our
    officer asked us what we were doing, we told him we were interrogating a prisoner.
    He said he should be doing it, and we said he could – but only if he bought pints
    all round! I didn’t drink of course – I had to make do with pop and crisps.’


    ![Image](images/f0043-01.jpg)


    Ready for action are the men of the Corbridge Home Guard.


    On another occasion an officer let slip he was planning a 2am inspection of the
    guard – and he fled in terror when on his approach he was greeted by a series
    of explosions from blank cartridges!


    ## Local Casualties


    The grim distinction of being the first local casualties in the war fell to two
    20-year-olds: Fusilier Albert Thompson, the youngest son of Mr and Mrs W. Thompson
    of Tyne Green, Hexham, and Fusilier Cornelius Newton, of Wanless Close, both killed
    in action on 19 May while serving with the Royal Northumberland Fusiliers.


    As the British Expeditionary Force was swept back to the sea and the beaches of
    Dunkirk by the mighty German war machine, the nation went down on its knees in
    a national day of prayer at the request of the king. More than 2,000 people attended
    Sunday services at Hexham Abbey and churches across the district were full to
    the doors.


    Casualties started to mount and convoys of wounded soldiers snatched from Dunkirk
    began to arrive at the Emergency Hospital in Hexham. The collection of wooden
    buildings was established in the early months of the war to take in military casualties
    injured overseas, as well as to deal with civilian and military air raid casualties.
    For a while, it took in local ‘peace-time’ emergencies, and acute and surgical
    cases which were on the waiting list for treatment at the Royal Victoria Infirmary
    in Newcastle. But on 1 June 1940 the first 269 military casualties arrived from
    the Dunkirk evacuation and from then on the hospital was full until 1945. Always
    known by Hexham people as the Military Hospital, it was supposed to close at the
    end of the war, but it was absorbed into the new National Health Service in 1948
    and those wooden buildings did sterling service until Hexham got a new hospital,
    opened by Prime Minister Tony Blair in 2004.


    The arrival of the Dunkirk casualties was supposed to be a secret, but many people
    turned out in the early hours of the morning to welcome the wounded who were tired
    and weary, and in many cases critically ill, but still maintained a remarkable
    spirit of cheerfulness. Many had no personal belongings other than the clothes
    they were wearing, but collections were immediately taken and within a few hours
    of their arrival, the men were given gifts of clothing, razors, tobacco, matches,
    food and fruit. ‘I am being treated like a king,’ one Tommy wrote to his family.


    The regular hospital staff were supplemented by a large contingent of Red Cross
    workers and every effort was made to care for the wounded and ease their suffering.
    It was obvious that all the men had gone through experiences of which they did
    not care to speak, but their amazing cheerfulness astounded nurses and doctors.


    Among the wounded was a contingent of French soldiers who, despite the fact they
    were seriously wounded themselves and their homes may have been razed and their
    wives and children scattered across France, also maintained a wonderful spirit
    of cheerfulness. One said via his interpreter: ‘Another ten days and I’ll be back
    showing Fritz what’s what.’


    Among those sent to Hexham was a Royal Northumberland Fusilier called William
    Ormston, who had suffered a badly crushed foot and who had had a trying 40-hour
    journey by ambulance to get to Dunkirk, during which the ambulance had twice stopped
    when the drivers took cover from Nazi bombs and machine-gun bullets. Finally reaching
    England, he was put on an ambulance train with other wounded personnel, when he
    first heard the name Hexham mentioned as the final destination of the train. Despite
    his injuries he was delighted, for Hexham was his home town and his parents would
    only have to go a couple of hundred yards to visit him.


    A ‘put you up’ service for relatives visiting wounded soldiers was set up by the
    Hexham Free Churches, who appealed for local families to provide accommodation
    for the visitors and had many offers of help.


    Not everyone made it; a British Tommy and a French marine who arrived in the convoy
    of wounded died soon after admission. The victims – Private Rex Martin (21) of
    the Middlesex Regiment, and Marine Paul Ruel – were buried side by side in Hexham
    cemetery. Separate services were held with the Rector of Hexham. the Rev. J.V.C.
    Farquhar conducting the service for the Englishman and Catholic priest Father
    Cunningham conducting that of the Frenchman. The coffins were draped with the
    Union Flag and the French Tricolore and among the mourners was the French consul
    from Newcastle.


    There was also a great demand for linguists to help translate for the French nationals
    and colonials, including the French teachers from Queen Elizabeth boys’ and girls’
    grammar schools.


    Men were reluctant to speak about their experiences at Dunkirk on the record,
    but one Hexham Fusilier told the Courant that when the water supply was cut off
    at Dunkirk, he still managed to get his first wash in five days – using two bottles
    of champagne. He said: ‘I had a really good wash – inside and out.’


    Life went on though, and an air raid warden from Haydon Bridge was fined 12s 6d
    for breaching blackout regulations. He blamed his wife for taking down blackout
    material so she could clean the windows.


    Bellingham farmer William James Dodd (60) of the Riding found himself on the wrong
    side of the law when he refused to obey an instruction from the War Office to
    plough out all his land to increase food production and was fined £40 with £10
    costs. He told the court he could not agree to plough all his land, because he
    had kept back his best two hayfields to produce fodder for his dairy cattle. He
    had a contract with the Milk Marketing Board to provide 50 gallons of milk per
    day and could not do that if his cattle were not properly fed in the winter months.
    When sentence was passed, Dodd said he would go to prison rather than pay a fine
    but was told that was not an option, and if necessary, his land would be compulsorily
    purchased and ploughed.


    A police constable at Prudhoe was accused of behaving ‘more like a stormtrooper
    than a broad-minded British policemen’ during the arrest of three men for alleged
    drunkenness. However, magistrates refused to accept allegations he had sworn at
    the men and punched one in the stomach and the miscreants were all fined.


    There was dismay in Hexham when popular local sportsman Second Lieutenant Thomas
    Benson Bland was reported missing. He had played both rugby and cricket for Tynedale,
    helping the rugby club to a hat-trick of Northumberland Senior Cup successes,
    as well as playing for Northumberland more than thirty times. He was a member
    of the joint Northumberland and Durham team which played the New Zealand All Blacks
    in 1936 and was an equally talented cricketer, also representing Northumberland
    and Tynedale and once scoring 155 in 129 minutes for Tynedale against Benwell
    Hill.


    It was later learned that he had been taken prisoner but died from his wounds
    in a German hospital in January 1941.

