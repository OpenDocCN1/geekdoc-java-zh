    克拉克下士（Lance Corporal Clark）是意大利营地写出的信件的 23 名签署人之一，信中赞扬了赫克斯姆（Hexham）当地为战俘提供服务的各种组织。信中写道：“我们对所做的一切都深表感谢。我们都健康如初，期待早日回到‘英格兰的心脏’。我们经常希望能读到《赫克斯姆日报》（Hexham
    Courant）。”


    同样来自赫克斯姆的莱纳德·沃德军士（Corporal Leonard Ward）从意大利转移后，在位于 IVB 号战俘营（Stalag IVB）写信表示，德国的食物和待遇远好于意大利。


    ![Image](img/f0142-02.jpg)


    海登桥（Haydon Bridge）的杰西·沃尔（Sister Jessie Waugh）修女在作为登陆西西里岛的 21 名英国护士之一时，是一位广受欢迎的人物。她不仅提供护理服务，还通过音乐会娱乐士兵，她的才华使她赢得了加入娱乐国家服务协会（广为人知的
    ENSA）的邀请。


    ![Image](img/f0143-01.jpg)


    赫克斯姆的 E. 霍林顿军士（Corporal E. Horlington，左）和海登桥的 F.H. 沃德士兵（Private F.H. Ward，右）与来自富勒姆（Fulham）的军团军士华纳·史密斯（Regimental
    Sergeant Major Warner Smith）一起通过划船远离中东的战斗间隙。


    回到国内，发生了一件令人悲伤的事：一名 21 岁的女子陆军（Women’s Land Army）成员在赫克斯姆郡（Hexhamshire）斯蒂尔“魔鬼之水”（Devil’s
    Water）的一个深潭中被发现死亡。这位来自罗普顿（Thropton）地区的女孩在斯莱利（Slaley）工作，当时她去骑自行车后再也没有回来。她留了一封给母亲的信，写道：“我厌倦生活——每个人都反对我。他们恨我，我无法继续下去了；也许我去的地方会很幸福。”法医裁定其为自杀。


    ## 赫克斯姆火车站弹药爆炸


    第二次世界大战期间，赫克斯姆在遭受泰河（Tyne）、泰斯河（Tees）和威尔河（Wear）工业区的纳粹炸弹袭击相对幸免，但是英国弹药造成了该国内唯一的人员死亡。


    三个士兵在赫克斯姆火车站从火车上卸载弹药时在爆炸中丧生。没有人真正知道 1943 年 9 月 9 日那个命运之日发生的全过程，但现场出现了一些非凡的英雄主义事迹，与海外发生的任何事件一样值得承认。已知，有一箱弹药掉落并爆炸，导致了两名
    19 岁的皇家苏格兰掷击团（Royal Scots Fusilier）军官和一名 24 岁的皇家陆军后勤军（Royal Army Service Corps）司机死亡。


    来自费夫（Fife）莱文的约翰·米德马斯中尉（Lieutenant John Middlemass）和来自彼得堡（Peterborough）的司机斯坦利·道斯斯（Stanley
    Dowse）当场死亡。来自皮布斯（Peebles）的帕特里克·威尔尔森中尉（Lieutenant Patrick Wilson）稍后在赫克斯姆医院去世。另一名被卷入爆炸的士兵受伤，而一名住在附近的房子外的平民达格利什夫人（Mrs
    Daglish）被爆炸的弹药碎片击中。


    所有铁路交通陷入中断，由于担心进一步爆炸的巨大危险，附近所有的房屋都进行了疏散。通勤者在线路更远处被带下火车并乘巴士回家后，已迟到了好几个小时。火势加剧了危险，军人员与国家消防队和警察合作，共同扑灭蔓延在弹药箱周围的火焰。


    五名士兵冒着巨大的生命危险，解开了一节满载的货车，并将其拖到安全地带。拆弹小组工作了一整晚，清理了车站区域内的未爆炸弹药，其中包括各种类型的步兵武器，如手榴弹。


    调车工罗伯特·亨利·汤普森（Robert Henry Thompson，50 岁）和他的两个同事——机车罗伯特·诺里斯（Robert Norris）和火工爱德华·利德尔（Edward
    Liddle）也做出了贡献。汤普森试图从装卸货平台撤出装满弹药的货车。他拦截了一辆牵引机，回到四节弹药车旁，将它们连接起来以便被拖走。此时，一些货车已经起火，汤普森不得不用他的调车杆将一节货车车顶上的燃烧物推开。


    在货车被充分隔离后，汤普森将它们与牵引机解开并撤离。在随后的验证会上，一名证人称他曾看到一个放在卡车背板上的箱子掉到了地上。司机似乎在鹅卵石路上滑倒了一下。箱子只掉了两三英尺，但立即爆炸了。几分钟后，军用卡后部发生第二次爆炸，随后引发火灾。弹药和磷散落在四周，在整个过程中，由于火势巨大，铁路货车和军用卡都发生了轻微爆炸。


    然而，爆炸的原因仍然是一个谜，因为专家在验证会上告诉，弹药不应该仅仅因为箱子掉落就爆炸。皇家苏格兰军团的军士长托马斯·基比（Thomas Kirby）表示，弹药位于密封箱内，手榴弹没有插引信。当问及爆炸的理论时，基比军士长告诉验证会：“我完全无法解释。”在被追问时，他只能假设弹药的某种成分存在问题，或者存在缺陷。


    调车工汤普森的勇敢行为使他获得了大英帝国勋（BEM），而诺里斯和利德尔也受到了高度表扬。北方指挥部指挥官认为他们的行为是“最高等级”的，并代表陆军向他们表示感谢。


    对于参与解开车厢的士兵，他们的英勇行为也得到了正式认可。授予“在赫克斯姆弹药爆炸期间表现英勇”的大英帝国勋被授予了掷击团士兵威廉·查塞尔（William Chassels）和掷击团士兵安德鲁·麦克米尔（Andrew
    McMichael），表扬信则授予了下士 W. 辛明顿（W. Symington）、下士吉米·桑德森（Jimmy Saunderson）和掷击团士兵 J.
    蒙特戈利（J. Montgomery）。


    不幸的是，这两名获得大英帝国勋的掷击团士兵都没有活过战争。威廉·查塞尔于 1944 年 7 月 16 日死于诺曼迪。他那年 21 岁，来自兰纳克郡汉密尔顿。


    安德鲁·麦克米尔于 1945 年 3 月 24 日在跨越莱茵期间牺牲。他那年 37 岁，来自艾尔郡的梅博尔。


    来自艾尔郡的下士吉米·桑德森虽然活过了战争，但几年后在纽卡斯尔地区试图过河流时与另外两人一同溺水。

