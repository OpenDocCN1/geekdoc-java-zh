- fmt: '

    Corbridge meanwhile was prepared for the worst by utilising safety facilities
    which were already many hundreds of years old. The Vicar’s Pele Tower, built in
    1318 with walls 4ft 3in thick as a defence against invading Scots, was pressed
    into service as an `ARP` post, while even older was a 2,000-year-old underground
    treasure chamber unearthed at the `Corstopitum` Roman site, earmarked for use
    as an air raid shelter.


    ### Establishment of the Supply Depot


    By the end of September a hospital supplies depot had been established in Hexham,
    following a meeting at the Abbey Hotel, continuing the fine tradition of the depot
    set up for the Great War twenty-five years earlier. The meeting was organised
    by Mrs Norman D. Newall of Newbrough, whose sister Mrs Clarence D. Smith of Loughbrow,
    had been the driving force behind the first depot. The various local branches
    of the Women’s Institute had intimated their willingness to form working parties
    to help out.


    ![Image](images/f0022-01.jpg)

    Staff at the Hexham Group Hospital supply depot sorting and packing comforts for
    servicemen abroad.


    Mrs Smith was sure that the initiative would be a great success, for people had
    had time to prepare for hostilities, unlike in 1914 when the war had started with
    great suddenness. She was delighted that many of the ladies who had been involved
    with the original depot had come forward again, often accompanied by their children
    and other relatives. She said: ‘I never thought that after 1918 I would have to
    stand up again and ask for a hospital depot to be started in Hexham. I think it
    is marvellous that on the last occasion we had 600 people – not counting the branch
    depots – working together, and never once in the four years was there a cross
    word nor the smallest trouble. Everybody was most willing, and I know they still
    will be today. Some of the original ladies are not as well or as strong as they
    once were, but they bring with them invaluable experience.’


    The supply depot was swift to issue a book of wartime recipes and handy hints.
    Costing sixpence, the pick of the innumerable recipes was one for sheep’s head
    broth – the brains to be cooked separately – while tips were provided on how to
    cook nettles, how to cure warts and how to preserve beech leaves ‘for a year or
    two’.


    ### Rationing and Transport


    By the end of September, petrol was being strictly rationed and one local dealer
    reported that his usual weekly sale of 1,500 gallons of fuel had slumped to a
    little over 50 gallons. He said: ‘We as dealers are being severely tested and
    some of us will find it very difficult to carry on.’ The fuel shortage led to
    many motorists laying up their cars and reverting to bicycles, resulting in an
    overwhelming demand for new and second hand bikes, with the latter particularly
    hard to obtain.


    ![Image](images/f0023-01.jpg)

    The cookery book produced by the Hexham Group Hospital supply depot which included
    advice on how to cook a sheep’s head.


    ### Health and Air Raids


    The novelty of the evacuees was starting to fade by mid-October when Bellingham’s
    Medical Officer of Health blamed the incomers for the spread of a number of infectious
    diseases in the area, including scarlet fever, chickenpox, impetigo and scabies,
    as well as louse infestations.


    Around a quarter of children from the Cowgate area had returned to Newcastle by
    the middle of the month, often against their wishes, but because their parents
    wanted them back at home. Most had gained weight while in the country and their
    studies were also going well.


    The district’s air raid sirens moaned for real on 17 October when unidentified
    aircraft were detected off the North East coast. Those villages without sirens
    relied on the ringing of church bells and it was some ninety minutes before the
    all-clear was sounded. Wardens in Hexham were frustrated by the fact that while
    the shoppers at the busy Market Place vanished almost instantly, the pavement
    in Priestpopple remained crowded with people.


    The implementation of the `National Service Act`, under which all men aged between
    20 and 22 had to register for the armed forces, saw 216 men register – only one
    of whom put his name down as a conscientious objector.


    ### The Story of Alfred Gunton


    Only six weeks after it started, the war was over for Corporal Alfred Gunton (20)
    of Round Close, Hexham, a wireless operator in the `RAF`, who failed to return
    from a mission over Germany on 15 October 1939. His parents had an anxious wait
    of almost three weeks before hearing he had been captured and was being held as
    a prisoner of war. ‘Air-minded’ since his schooldays at Hexham Queen Elizabeth
    Grammar School, he had previously had two lucky escapes, once when forced to parachute
    from an aircraft which caught fire at high altitude, and another just two days
    into the war, when the plane he was crewing was forced to make an emergency landing
    in France when it ran low on fuel.


    Corporal Gunton was one of the first recipients of a comforts parcel provided
    by the hospital supply depot and was also allowed to broadcast to Britain over
    the German shortwave radio. In a letter to his parents from the prisoner of war
    camp he revealed his aircraft had been shot down by anti-aircraft fire and said:
    ‘We had to jump for it by parachute. The pilot was killed by shrapnel and never
    left the machine, but no-one else was hurt. We are being treated very well here.
    It has been snowing lately to a depth of two inches, but I have been given plenty
    of warm clothing.’


    ![Image](images/f0024-01.jpg)

    After being captured in the second month of the war, Warrant Officer Alfred Ronald
    Gunton of the `RAF`, was repatriated back to his Hexham home in September 1944
    after being held in a prisoner of war camp for almost five years.


    ### Maritime Losses and Aerial Activity


    Asking his parents for parcels to be sent out to him, Corporal Gunton wrote in
    his uncored letter, written in pencil: ‘I could do with some chocolate, biscuits,
    bully beef and a tin of fruit, and if you can, try to raise some margarine. See
    you after the war!’


    There were two black cats aboard the cargo steamerCairmona` when it set sail from
    Montreal for the UK, but they brought no luck, as the vessel sank within fifteen
    minutes of being torpedoed off the northeast coast. Among the survivors was Cadet
    C.D. Boyd of Hexham, who lost all his possessions in what was his thirty-sixth
    crossing of the Atlantic. The Sunderland built `airmona` belonged to the `Cairn
    Line`, of which Major T. Russell Cairns of Dukes House, Hexham, was chairman of
    the board of directors.


    There was much excitement in the North Tyne on 29 October, when an early morning
    bus from Bellingham was ‘buzzed’ by a low-flying German aircraft. The roar of
    the aircraft’s diesel engines brought people out of their homes, and workers in
    the fields stopped what they were doing in amazement as the aircraft swooped by
    just 30ft off the ground. The German insignia on the wings and tail were clearly
    discernible.


    One witness said: ‘I suppose we should have taken cover, but instead, everyone
    rushed out of doors to see the plane.’


    Hexham Courant readers were given an early insight into the horrors of the concentration
    camps by a German who had spent two months in one before managing to escape to
    Hexham shortly before the war started. Referred to only as `Herr X` to protect
    his identity, the man told a reporter that the camps had been set up to bring
    old people to their death by slow torture. He said: ‘It is most terrible. People
    who are sent to a concentration camp are lost to the world. There is no law in
    a concentration camp and all manner of evil deeds are committed by those in charge,
    chiefly thieves and murderers. Himmler seems to have sole control and what he
    says must be carried out.’

