    Garwell could see Nettleton and some of his crew staring at even burning Lancaster
    and he gave an impolite version of the V-sign, which they instantly returned.
    Then he turned to port into the wind and made for a patchwork of fields south
    of the town. As he throttled back and lowered the flaps, smoke started to pour
    into the cabin, blinding him so that he couldn’t see out or read the instruments,
    and choking him so that he could hardly breathe. All five men in the front cabin
    were coughing violently, and Flux opened the escape hatch over the navigator’s
    table to get some air.


    Garwell kept the aircraft going at what he thought was the same angle, and then
    a sudden down-draught from the hatch cleared the smoke for a fraction of a second
    and he saw a line of tall trees straight ahead of them, blocking their path. He
    opened up the engines and pulled back on the stick, but already the smoke had
    closed again.


    Garwell was flying her into the ground blind at 80mph an hour, but when the impact
    came she settled down like an old hen, sliding on her belly for about 50 yards
    and then stopping gently. They made a dash for the hatch. Outside they found Flux
    lying dead under the starboard inner engine. He had been thrown out on impact.
    His quick action in opening the hatch had probably saved their lives. The whole
    body of the aircraft was burning furiously and they couldn’t get near, and the
    death toll rose to three.’


    Garwell was awarded the Distinguished Flying Cross for his exploits, while Nettleton,
    the only one to get his Lancaster back home after the Augsburg Raid, was awarded
    the Victoria Cross.


    Garwell was interned at the infamous Stalag Luft III, where he remained until
    liberated in May 1945, but he was not a model prisoner. He participated in at
    least one escape attempt, which he described laconically in his post-war PoW de-brief
    as: ‘Escaped with 25 others as a de-lousing party. Prisoners dressed as guards.
    Recaptured after one day. Threatened with court martial for sabotage and espionage
    by Germans. Held in jail 56 days 12 June – 8 August 1943.’


    He again found himself in solitary confinement from 26 December 1943 to 17 January
    1944 according to his wartime log and, although he makes no mention of it there
    has been speculation that he had been involved in the legendary ‘Great Escape’
    from Stalag Luft III in March 1944. However, he was not one of the seventy-six
    who did get away – or one of the fifty who were subsequently murdered in cold
    blood by the Gestapo.


    ![Image](images/f0118-01.jpg)


    The strain on local families waiting for news of their loved ones missing in action
    with the Recce Regiment Royal Northumberland Fusiliers in the Middle East was
    eased to a degree with news they were being held in Italian prisoner of war camps.
    Among those from Hexham were (from left): Company Sergeant Major R. Riley, Corporal
    Joseph Thompson, Corporal John Edward Rourke and Fusilier Samuel Wilson.


    After the war Garwell joined the investigations department of HM Customs and Excise
    and in 1957 he joined East African Customs and Excise, living in Mombasa and Nairobi,
    becoming head of the service before Kenya won independence in 1963\. He stayed
    on in Kenya, taking Kenyan citizenship in 1964 and starting his own business growing
    mushrooms for the hotel trade.


    He died in Kenya in 1969, still only 49 years old. When his medals and wartime
    papers came up for auction in London in 2006, they realised £8,800, almost twice
    the estimate.


    ### Home Guard tragedy


    There was tragedy in the cemetery in Bellingham when a Home Guard exercise in
    June 1942 went badly wrong. A forestry worker, George William Glendinning (31)
    from Bewshaugh, Kielder, was killed when a hand grenade being used in an exercise
    exploded close to him and he suffered fatal injuries.


    An inquest heard that Mr Glendinning was a member of the Home Guard and was taking
    part in the exercise, which also involved members of the regular army. A sergeant
    with the regulars had thrown a grenade as a warning to others to clear the way,
    but Glendinning had been caught in the blast. The Home Guard contingent were unaware
    that live ammunition was being used rather than just smoke bombs. Glendinning’s
    legs were shattered by the explosion and he died of shock and haemorrhage.


    Recording a finding of accidental death, Coroner for South Northumberland P.M.
    Dodds said: ‘Glendinning was loyally attempting to do his duty for his King and
    country and to train himself for the defence of the district if the occasion arose.’


    Other members of the 4th Battalion Northumberland Home Guard, including contingents
    from Hexham, Acomb, Lowgate, Whitley Chapel and Slaley held a drumhead service
    at Prior’s Flat in Hexham. The men were told by the commanding officer Lieutenant
    Colonel J. Ridley Robb: ‘The Home Guard are no longer just civilians in uniform,
    but an integral part of the Armed Forces, well armed and trained, and I don’t
    hesitate to say, an efficient fighting force. We are not here simply to repel
    invasion, but being strong and well trained, we will allow regular troops to be
    moved abroad. The stronger and better trained we are, the more regular troops
    can be sent overseas, and the sooner this war will be over.’


    A rogue kipper was blamed for the death of 21-year-old farm worker Thomas Hutchinson,
    of Coanwood. Hutchinson took ill a week after eating a kipper served by the wife
    of the farmer for whom he was working. Even though the farmer ate a kipper from
    the same pan, without any ill effects, Hutchinson became ill some days later and
    on being admitted to hospital said he had eaten a kipper which ‘tasted badly’.
    He said: ‘If ever I get over this, I will never eat a kipper again.’ He died in
    Haltistle War Hospital from streptococcal infection of the bowel, but local doctor
    J.M. Glasse said it was impossible to say whether the kipper had been responsible
    for the death.


    For many years Allendale styled itself as the centre of Britain, but despite its
    distance from the sea, it became home for seafarers from many lands with the opening
    of Britain’s first country holiday and rest home in which merchant seaman who
    had suffered from enemy action or from illness were able to regain their health.


    Set in a former residential hotel on the banks of River Allen, the facility was
    operated by the Missions to Seamen, with the intention of providing a fortnight’s
    holiday, free of charge, for all sailors who had suffered at the hands of the
    Nazis. A special fund known as the Merchant Seamen’s Holiday Rest Home Fund, was
    established and the facility was soon adopted by the people of Allendale, with
    inmates experiencing hospitality in many houses in the Dale.


    There were men of all nationalities in the home, with the common bond of the sea,
    and one Norwegian sailor declared: ‘This is a lovely and peaceful place. People
    are all so kind – it is like heaven to me.’


    Some had been torpedoed several times and had suffered grievous injuries, but
    the underlying impression was that once they had recovered from their wounds and
    illnesses, they could not wait to return to the fray.


    The war continued to take a grim toll of Tynedale servicemen, with several local
    men killed in the Libyan desert, including Lieutenant Colonel Edward Des Graz,
    commander of the Reconnaissance Battalion of the Royal Northumberland Fusiliers,
    and Major John Pearson, of South Wylam, serving with the same regiment.

