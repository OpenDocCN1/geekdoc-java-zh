    The eight of them split into two groups, with Josef and two of his comrades following
    the River South Tyne up to Alston. However, the local bobby `PC Wilson` stopped
    three men and ‘found they were Germans’ and with the assistance of `John Fawcett`,
    a soldier home on leave, took the men to the police station. The redoubtable `PC
    Wilson` also arrested four of the other five escapees at Haldon’s Mill near Alston.
    That group had chosen to cross the river so that any dogs being used to track
    them would lose their scent, but one of the group, `Karl Kropp` of the `Luftwaffe`,
    was last seen attempting to wade across the swollen River South Tyne, with the
    water up to his waist.


    His body was recovered from the Tyne at Hexham three days later, and he was buried
    in the war graves section of Hexham Cemetery in a coffin draped with a swastika
    flag, carried by six of his `Luftwaffe` comrades. Six other German PoWs walked
    behind the coffin under armed escort. All the Germans gave a military salute as
    the coffin was lowered into the grave and bared their heads. At the conclusion
    of the service, each PoW walked to the graveside, saluted, and sprinkled three
    handfuls of soil each on the coffin, before saluting again and returning to their
    ranks.


    `Klopp`s body was disinterred in 1958, and returned to Germany with those of other
    PoWs who had died in Hexham.


    # CHAPTER SEVEN


    ## Managing the Peace


    As the victorious Allied forces homed in on Berlin, many prisoners of war were
    repatriated to Tynedale, each with a tale to tell of the privations they had suffered.
    Among them was `Lance Corporal George Clark` of Hexham, who was taken prisoner
    at Knightsbridge in 1942 while serving with the `Royal Northumberland Fusiliers`.


    He had been held for a year in Italy, before being transferred to a camp at Silesia,
    which was liberated by the Americans in April 1945. He told the `Courant` that
    as the Americans approached, the German guards withdrew, and white flags were
    flown, but the doughboys by-passed the town in hot pursuit of the retreating German
    army. There were no guards on duty for two days, but when it was clear the US
    troops were not coming back for a while, the guards were reinstated and the white
    flags pulled down.


    When the Americans finally did return, the Union Flag and Stars and Stripes flew
    over the camp, where the prisoners had made PoW signs from their bedsheets. `Lance
    Corporal Clark` said: ‘The cheering was deafening.’


    ![Image](images/f0175-01.jpg)


    After three years as a prisoner of war, `Lance Corporal George Clark` of Hexham,
    lost three and a half stones in weight after a 530-mile trek from Silesia, following
    the camp’s liberation by American forces.


    His ordeal was not quite over though, for on his release he faced a thirty-nine
    day trek of 530 miles to get back home, and in doing so he lost three and a half
    stones in weight. Perhaps surprisingly, he appeared to hold no hard feelings about
    his captors, whom he said honoured the dead and did what they could for the wounded.


    He said that England did not seem much different to the country he had left behind,
    especially as rumours round the prison camp were to the effect that the country
    was on the verge of starvation, with people having nothing to eat but black bread.


    ![Image](images/f0176-01.jpg)


    How the `Hexham Courant` greeted the news of VE day on its front page.


    ### Victory in Europe


    When Victory in Europe was finally confirmed on 8 May 1945, the news in Tynedale
    was received with restrained jollification rather than wild hilarity. Apart from
    gaily-bedecked streets and decorated shop windows, and the fact that most people
    wore patriotic emblems on their coats, it was just like a normal market day in
    Hexham. The judge at `Hexham County Court` dispensed with his wig and gown, and
    wore a red, white and blue rosette instead while giving judgements.


    A loudspeaker was erected in the Abbey Grounds to hear Prime Minister `Winston
    Churchill` declare the ceasefire and the bells of `Hexham Abbey` rang out a victory
    peal. That night, more than 1,000 people crowded into the Abbey for a service
    of thanksgiving led by the rector, `Canon A.G. Hardie`, and similar services were
    held across the district. A number of bonfires were lit, including one in the
    grounds of the `Emergency Hospital`, where so many men were still having treatment
    for war wounds. On VE Day pubs, clubs and other licensed premises were allowed
    to stay open until 11.30pm, but in practice, most closed at the normal time, because
    of the shortage of beer and spirits.


    At Allendale there was a massive bonfire built by local schoolchildren, which
    was lit by a former prisoner of war, `Lance Sergeant Tommy Shield`, while at Haydon
    Bridge the youth detachment of the local `Red Cross` burned an effigy of `Hitler`
    on their victory bonfire. There were open air dances, sports days and other celebrations
    across the district, but none on the scale of the partying which marked the end
    of the First World War.


    There was tragedy at Allendale where 26-year-old `Harold Phillipson` chose to
    walk home to Sinderhope over the moors from a VE Day party and fell over the parapet
    of a bridge, plunging 30ft to his death.


    There was also concern about the generous food allowances being given to German
    prisoners of war at a time when the British people were having to get by on restricted
    rations. The chairman of `Hexham UDC`, `Councillor Joe Cullen`, said it was an
    effrontery that Germans were being better fed than Britons, and added: ‘Without
    any violation of the Geneva Convention, I am sure the German prisoners could be
    brought down to the rations. We are a curious and remarkable people who always
    seem to be very generous to our enemies. These men will go back to Germany full
    of beans.’


    ![Image](images/f0178-01.jpg)


    A victory tea was held at Peth Head, Hexham, with every household making a contribution.
    After a fancy dress competition, there was a parade.


    On the Sunday after VE Day, there was another service of thanksgiving at the Abbey,
    which was preceded by a parade of civil defence services and other organisations,
    including members of `Hexham Urban District Council`. Also on parade were the
    `Hexham Divisional Police` and special constabulary the British Legion, Home Guard,
    Army Cadet Force, Air Training Corps, Boy Scouts, Girl Guides and the Women’s
    Auxiliary Service.


