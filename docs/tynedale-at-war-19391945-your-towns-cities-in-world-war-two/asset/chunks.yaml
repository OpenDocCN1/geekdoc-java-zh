    \ bomb, and within seconds the wooden structure was a mass of flames. The upper\
    \ storey of a house in Hextol Terrace was also ablaze after being hit by an incendiary\
    \ bomb, while in Shaftoe Crescent, a high explosive bomb fractured a gas main\
    \ which was belching flames high into the sky.\n\nThe destruction continued in\
