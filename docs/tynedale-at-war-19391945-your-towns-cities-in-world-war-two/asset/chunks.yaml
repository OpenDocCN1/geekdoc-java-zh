    赫克斯姆（Hexham）的街道举行了一场盛大的游行，挤满了人。一支管乐队领着一支庞大的队伍，包括国内兵卫队、皇家空军（RAF）、`WAAF`、`ATC`、国家消防局、女训练兵团、英国军团、民防队、英国红十字会、女童子军和童子军。现场还有一支着装整齐的妇女农军队队伍，国内兵卫队的乐队也参加了游行。镇上的商人也以爱国风格装饰窗户参与了进来，一个广受欢迎的特色是在炸弹上贴上国家储蓄债券，这枚炸弹后来被投向德国。


    ![Image](img/f0138-01.jpg)


    1943 年夏天，赫克斯姆“机翼周”（Wings Week）的目标是筹集`£250,000` 以购买四个中队的飓风风战斗机。


    “胜利之翼周”（Wings for Victory Week）再次取得巨大成功，赫克斯姆的 `£250,000` 目标超过了 `£100,000`。最终总额为
    `£339,106`，其中 `£79,206` 来自国家储蓄证书；`£46,030` 来自廷代尔银行或邮局的存款；`£54,885` 来自国防债券；`£4,615`
    来自储蓄邮票；`£67,150` 来自战争债券以及 `£86,900` 来自储蓄债券。


    该地区的 48 所学校的目标是共同筹集 `£5,000`，但实际上筹集了 `£9,941`。该地区的 39 家邮局筹集了 `£94,089` 的捐款。


    该地区的许多地方都超过了目标，包括康姆（Acomb，目标 `£1,000`，总计 `£4,082`）、奥伦代尔（Allendale，`£6,000`，`£18,227`）、布兰奇兰（Blanchland，`£1,500`，`£3,542`）、科布里奇（Corbridge，`£10,000`，`£23,607`）、科威尔尔（Colwell，`£150`，`£287
    10s`）、海德登桥（Haydon Bridge，`£3,000`，`£11,506`）、汉姆绍（Humshaugh，`£6,000`，`£9,348`）、纽伯鲁哈和福尔斯斯通（Newbrough
    and Fourstones，`£759`，`£8,567`）、奥文格姆（Ovingham，`£350`，`£1,291`）、里丁米尔（Riding Mill，`£500`，`£11,160`）、西蒙伯恩（Simonburn，`£1,000`，`£1,654`）、斯托克斯菲尔德（Stocksfield，`£12,000`，`£32,420`）以及威拉姆（Wylam，`£16,000`，`£19,508`）。


    贝灵哈姆的“胜利之翼周”在一周后举行，目标是筹集 `£40,000` 购买大兰斯特轰炸机。北泰恩的人们不仅实现了该目标，还额外筹集了 `£25,000`，以提供五架战斗战斗机，护送大兰斯特轰炸机对德国的袭击。


    1943 年不为人知的事件之一是乔治六世国王和伊丽莎白王后对该地区的私人访问，他们在费瑟斯通（Featherstone）哈尔特威斯尔–阿尔斯顿线的皇家火车上上了一夜。王后（原伊丽莎白·鲍斯-莱恩）与巴登米尔（Bardon
    Mill）和贝灵廷姆（Beltingham）地区有家族渊源。巴登米尔里德利庄（Ridley Hall）现在是海德登桥高中的宿舍楼，直到 1948 年一直由王后的叔叔弗朗西斯·鲍斯-莱恩所有。他是该地区的大慈善人，在里德利庄执行了重大的重建计划，并为贝灵廷姆的圣库特伯斯教堂提供了门和彩色玻璃窗。他还是
    1881 年爱丁堡苏格兰士兵臭名昭著的“湿阅兵”的幸存者，当时作为女王射箭团团长，在大雨无情倾盆时，他有荣幸为维多利亚女王撑了四个小时的伞。


    ### 勋章获得者和其他当地英雄


    科布里奇培养了一位双重战争英雄——国王龙骑卫队的约翰·理查森上尉，他获得了军事十字勋章（MC）增加了一个附加勋章。他因在 1942 年 5 月在托布鲁克（Tobruk）附近的利比亚沙漠比尔·哈切姆（Bir
    Hacheim）南方的敌方阵地攻击中表现被授予 `MC`，随后在利比亚大理石门（Marble Arch）地区的行动中获得了附加勋章，当时他自愿带领了一次长
    370 英里的巡逻，成功切断了德军的大部分。


    ![Image](img/f0140-01.jpg)

