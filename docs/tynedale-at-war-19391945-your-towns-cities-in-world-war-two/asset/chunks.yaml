- fmt: '

    On 22 March 1942, residents of Wark heard the sound of a single aircraft engine
    overhead. Australian Sergeant Clarrie Harker was the pilot of a `Hurricane` from
    RAF Usworth, which went on to dive vertically towards the ground when it failed
    to pull out of a loop successfully. He managed to bale out, leaving the `Hurricane`
    to complete its descent into a field on Moat Hill Farm, where it exploded in a
    ball of flames. Harker’s parachute became snagged in a tree nearby, leaving him
    suspended. Local children raced to the scene to find one of the village’s elderly
    female residents shouting obscenities at him, mistaking him for a German.


    One of the North Tyne’s most famous crashes occurred in February 1943, when an
    American `Mustang` flew into a boggy hillside at Hareshaw Head near Bellingham,
    at an estimated 400mph. The pilot, 22-year-old Flying Officer Johnny Fisher, was
    killed and an RAF recovery crew dug 16ft into the bog to recover his body.


    A crew of six came down in a `Vickers Wellington` in March 1943. After taking
    off from RAF Harwell, the cause of the crash remains a mystery, but it came down
    while on fire on Comb Moor at Greenhaugh. Investigations suggest that the pilot
    may have lost control, causing the aircraft to dive into a peat bog on the moor,
    killing the entire crew.


    A `Hurricane` from RAF Milfield, near Wooler, Northumberland, crashed at Ottercops
    Moss, Elsdon, in June 1943. The pilot, Flight Sergeant John Gates, was knocked
    unconscious during the crash, but came to just as the aircraft stopped moving.
    He was rescued from the wreckage by soldiers travelling nearby after he was unable
    to recover from a low diving manoeuvre.


    It wasn’t only Allied aircraft which met a sad fate, for on 25 March 1943 a German
    `Dornier` bomber was shot down by a night fighter at Steel Rigg, near Twice Brewed
    on the Roman Wall. The four-man crew were all killed and are buried at Carlisle.


    ![Image](images/f0030-01.jpg)


    The reality of rationing explained in this poster from January 1940.


    The mayhem continued into 1944 when in April a pilot aged just 20, Sergeant Cyril
    Jack Jewell, died when his `Spitfire` slammed into Houxty Woods at Wark.


    The new year of 1940 brought new rationing regulations, with coupons required
    for butter, bacon, ham and sugar. The basic ration for butter, ham and bacon was
    4oz per person per week, with the allowance for sugar 12oz per person per week.
    Additional supplies of sugar were made available for those wishing to make marmalade
    or for people who kept bees. Those working away from home were also told they
    would be able to order bacon and eggs, a roll and butter without parting with
    any coupons and their tea would have sugar supplied with it.


    ‘Coupon Monday’, as it was dubbed by shopkeepers, took place in an orderly manner,
    but there was no rush to take up the offer of a double bacon ration. One butcher
    said: ‘Our bacon counters have been quiet and there has been little demand for
    extra rations. The price of bacon, set by the government, is preventing people
    from purchasing it. The normal housewife regards bacon and ham as something of
    a luxury which can easily be done without – shoppers cannot afford to spend 1s
    8d on a pound of bacon. The average housewife is doing without, and feeding her
    family on cheaper things which provide equal nourishment.’


    The early years of the war drew to the public attention the braying tones of William
    Joyce, whose ‘Gairmany Calling’ broadcasts from the Third Reich earned him the
    moniker Lord Haw-Haw. It was soon established that Joyce was no stranger to Hexham,
    having been in the town not long before the war to spread propaganda on behalf
    of the British Union of Fascists. He had even called at the `Courant` office to
    promote a meeting he was holding in the town in 1936.


    Columnist Hextol recalled in March 1940: ‘I learned from his own lips that he
    had deputised for the Fascist leader Sir Oswald Mosley on several occasions. I
    did not cover his meeting personally, but the records show he made a plea for
    the ending of international finance and the Jewish control of the markets. He
    argued that an open dictatorship of a leader of whom the people have approved
    is infinitely preferable to a hidden dictatorship of international finance.’


    By the turn of the year, the Hexham Hospital Supply Depot had dispatched over
    7,000 items and from the beginning of November, the depot had delivered 1,000
    pairs of socks, 370 pairs of mittens, 310 helmets, 300 mufflers and 104 knitted
    blankets. The knitters were using white wool to make balaclava helmets for troops
    in Finland and sea boot stockings for the Royal Navy. Slipper makers were also
    urgently required.


    The South Northumberland Pony Club held its annual ball at the Hydro Hotel, which
    was decorated in the club colours of purple and gold. Dance music was provided
    by the Clement Millard Orchestra, with The Siegfried Line, Boomps a Daisy, The
    Lambeth Walk and The Chestnut Tree proving very popular.


    The weather took a turn for the worse in February, with 34 degrees of frost recorded
    and roads blocked by heavy snow at Allendale and in the North Tyne.


    There was an air raid warning on 29 January which saw children at all Hexham schools
    file into the air raid shelters, where their songs included Roll Out the Barrel
    and Run, Rabbit Run. No enemy aircraft made it up the Tyne Valley and the all
    clear was sounded after 25 minutes.


    The blackout continued to cause many problems for Tynedale people, with several
    fatalities as motorists and pedestrians alike struggled to cope with dark nights.
    One of the most prominent men to lose his life was the recently retired chief
    reporter of the Courant, Fred Guthrie, who suffered a fractured skull after being
    struck by a tandem bicycle just yards from his home. He was 71 and worked for
    half a century.


    ![Image](images/f0032-01.jpg)


    ### Sailors’ tales


    One of the early British triumphs in the first full year of the war was the hunting
    down of the German pocket battleship the Admiral Graf Spee, in what became known
    as the Battle of the River Plate – and a Fourstones sailor had a role to play
    in the destruction. He was Stoker Andrew Charlton, who was aboard `Ajax` which,
    in company with `Achilles` and `Exeter`, penned the raider in the South Atlantic
    until she was finally scuttled off the coast of Montevideo.


    Enjoying twenty-six days at home on his return from South American waters, Stoker
    Charlton said the victory had been won because the `Graf Spee` had been crewed
    by young Nazis, who had no fight in them when they discovered their intended victims
    could fight back.


    He told the `Courant`: ‘Their captain was a real gentleman, and one of the old
    school, but the crew was made up of young members of the Hitler movement. After
    they had had one go at us, they had no fight left in them. They did not want to
    fight when they saw we could fight back.’


    The Admiralty knew that a German raider was operating in the South Atlantic, doing
    a lot of damage, and the three ships were sent to hunt it down. The `Exeter` was
    first to engage and the `Graf Spee` returned fire with interest, its 8-inch guns
    out-gunning the 6-inch weapons on the destroyer.

