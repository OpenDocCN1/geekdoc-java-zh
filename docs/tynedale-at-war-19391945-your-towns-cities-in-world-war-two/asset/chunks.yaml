    Garwell 看到 Nettleton 和他的一些机员正盯着正在燃烧的兰开斯特轰炸机，他做出了不礼貌的胜利手势，对方立刻回了礼。随后他向左转迎风飞行，在城镇南方一片斑块状农田。当他收回油门并放下襟翼时，烟雾开始涌入舱内，熏得他完全看不清窗外，也无法读取仪表，还呛得他几乎无法呼吸。前舱的五个人都在剧烈地咳嗽，Flux
    打开了航员桌上方的逃生舱以获取新鲜空气。


    Garwell 保持着他认为相同的角度维持飞行，这时，舱门的一股突然下气流让烟雾消散了一小会儿，他看到正前方有一排高树，挡了他们的道路。他加大引擎功率并拉回操纵杆，但烟雾再次弥漫了过来。


    Garwell 以每小时 80 英里的速度盲目地驾驶飞机撞地，但当撞发生时，飞机像一只老母鸡一样落了下来，用腹部滑动了约 50 英尺后轻轻地停了下来。他们冲向逃生舱。在外面，他们发现
    Flux 躺在右侧内发动机下方。他在撞击时被甩了。他迅速打开逃生舱的行为可能救了他们的命。整个机身正在剧烈燃烧，他们无法靠近，死亡人数增加到了三个。


    Garwell 因其英勇事迹被授予卓越飞行勋章，而作为奥格斯斯堡空袭战后唯一一个将兰开斯特轰炸机带回家的 Nettleton 被授予了维多利亚十字勋章。


    Garwell 被关在臭名昭著的第三空军战营（Stalag Luft III），一直留到 1945 年 5 月获释，但他并不是一个模范囚犯。他参与了至少一次越逃尝试，他在战后的战俘简报中简练地描述道：“和其他
    25 个人作为除虱小组逃脱了。囚犯们伪装成守卫。一天后被捕。被德国人威胁要因破坏和间谍罪受军事法判。在监狱里关了 56 天，1943 年 6 月 16 日至
    8 月 8 日。”


    根据他的战时日志，他再次在 1943 年 12 月 26 日至 1944 年 1 月 17 日期间被单独关禁，尽管他在书中没有提到这一点，但有人推测他曾参与了
    1944 年 3 月从第三空军战营发生的那场传奇的“大逃亡”。然而，他并不是那 76 个成功逃脱的人之一，也不是那随后被盖世局冷酷杀害的 50 个人之一。


    ![Image](img/f0118-01.jpg)


    对于那些在中东隶的诺坎堡郡皇家骑兵团侦察团中失踪的亲人的当地家庭来说，由于他们他们被关在意大利战俘营的消息，压力得到了某种程度的缓解。来自赫克斯姆（Hexham）的人包括（从左到右）：连士长
    R. 莱利、约瑟夫·汤普森下士、约翰·爱德华·鲁克下士和步兵萨缪尔·威尔逊。


    战后，Garwell 加入了海关和关税部的调查部门，并在 1957 年加入东非海关关税部，居住在蒙巴萨和内罗毕，在肯尼亚于 1963 年独立之前成为该部门的负责人。他留在了肯尼亚，于
    1964 年获得肯尼亚国籍，并开始经营酒店业的蘑菇种植。


    他于 1969 年去世于肯尼亚，年仅 49 岁。当他的勋章和战时文件于 2006 年在伦敦拍卖时，最终成交价为 8800 英镑，几乎是估价的两倍。


    ### 民兵卫的悲剧


    贝林汉（Bellingham）墓地发生了一场悲剧，1942 年 6 月的一次民兵卫演习出了严重错误。一名来自凯尔德（Kielder）贝什肖（Bewshaugh）的林业工人乔治·威廉·格伦丁宁（31
    岁）在演习中用的一枚手榴弹在他附近爆炸，导致其致命伤。


    验讯法得知，格伦丁宁先生是民兵卫的一员，并参加了该演习，演习还包括正规军成员。正规军的一中士扔了一枚手榴弹以警告他人让路，但格伦丁宁被爆炸波及了。民兵卫成员并不知道使用的是真实弹而非烟雾弹。格伦丁宁的双腿被爆炸炸碎，他因休克和大出血去世。


    南诺坎堡郡法医 P.M. 杜斯判定其为意外死亡，并表示：“格伦丁宁忠诚地试图为他的国王和国家尽职责，并在万一发生时为该地区的防御做好训练。”


    诺坎堡民兵卫第 4 营团的其他成员，包括来自赫克斯姆、阿康布、洛盖特、惠特利查教堂和斯莱利的小队，在赫克斯姆的普莱尔平地（Prior’s Flat）举行了露野战仪式。指挥官
    J. 瑞德·罗布中校对他们说：“民兵卫不再仅仅是穿制服的平民，而是武装部队不可或缺的一部分，装备精良且训练良好，我不犹豫地说，是一支高效的战斗力量。我们来到这里不仅是为了击退入侵，通过保持强大和训练良好，我们可以允许正规部队调往海外。我们越强大、训练越好，就能有越多的正规部队被往海外，战争结束得越快。”


    一条变质的熏��被归咎于科安伍德（Coanwood）21 岁农民托马斯·哈金辛森死亡。哈金辛森在吃了他工作的农民妻子提供的熏��一周后病倒了。尽管那个农民也吃了同一锅里的熏��而没有任何不适，哈金辛森几天后还是病了，住院时他说他吃了一条味道很坏的熏��。他说：“如果我挺过来，再也不吃这种。”他因链球菌肠道感染在哈尔蒂斯尔（Haltistle）医院去世，但当地医生
    J.M. 格拉斯表示，无法判断死亡是否与熏��有关。


    多年来，阿伦代尔（Allendale）自诩为英国的中心，尽管离海洋很远，但随着英国第一家乡村度假和疗养中心的开放，这里成为了许多国家海员的家，让遭受敌方袭击或疾病影响的商船海员能够在此恢复健康。


    该中心坐落在阿伦河（River Allen）岸的一座旧酒店内，由海员宣教协会运营，旨在为所有遭受纳粹手之海的海员提供为期两周的免费假期。一个名为“商船海员假期疗养中心基金”的特别基金建立了，该中心很快被阿伦代尔的人们接纳，客人在许多家中受到款待。


    中心有来自所有国家的人，他们拥有海洋这一共同纽带，一位挪威海员宣布：“这是一个美丽宁静的地方。人们都如此善良——对我来说就像天堂。”


    有些人曾被鱼雷击中多次并受重伤，但整体印象是，一旦他们从伤病中恢复，就迫不及待要回到战斗中。


    战争继续对泰恩代尔（Tynedale）的士兵造成了惨重损失，几名当地人死于利比亚沙漠，其中包括皇家诺坎堡郡骑兵团侦察营营长爱德华·德斯·格拉兹中校，以及在同一团服役的南威尔姆（South
    Wylam）的约翰·皮尔森少校。


