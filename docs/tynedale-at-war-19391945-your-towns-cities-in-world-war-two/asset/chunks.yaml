    并不是所有人人都准备好接收疏散人员。在持续拒绝人们进入他在瓦尔（Wall）那间与母亲和一名女佣人的九室室牧师住宅后，李区圣奥斯沃尔德教堂的牧师弗雷德里克·塞塞尔·韦斯特加斯（Reverend
    Frederic Cecil Westgarth）牧师被赫克斯姆治安法庭罚款 5 英镑——并告知罚金可能是 50 英镑，或监禁三个月。法庭主席洛夫图斯·贝茨斯将军（Brigadier
    Sir Loftus Bates）表示：“我无法不对一位宗教人士提出这样的指控感到遗憾。”


    赫克斯姆农村地区首席安置官塞尔尔比·伍德（Selby Wood）对该地区应对紧急状况赞誉有加。他说，99%的家庭都全心全配合，并补充道：“对于安置官出色的志愿者工作，怎么赞美都不过。他们执行了一项极其复杂艰巨的任务，并以令人赞叹的乐观和效率完成了任务。如果没有住户的合作，他们的任务将是不可能完成的。许多住户告诉我，被疏散的母亲非常愿意回报所提供的招待。他们的许多丈夫已经自愿参军，而孩子们也已经离开了熟悉的环境。”


    赫克斯姆的学校实行了双班制制度，当地孩子从上午 9 点到下午 12:30 上课，下午与疏散人员交换课桌，后者在下午 1:30 到下午 5 点上课。在随后的几周里，位置发生了对调，疏散人员在上午上课，当地人在下午上课。


    但在战争爆发后的第二周，几个疏散人员及其母亲发现自己无法适应乡村生活，他们宁愿回到纽卡斯尔面对炸弹。


    当时发起了献血者的呼吁，赫克斯姆医院的护士还呼吁捐赠旧睡衣和睡裤。


    普鲁德霍（Prudhoe）充满了怨气，该镇的志愿者防空警员们愤怒地发现，当敌对爆发时，许多全职防空警员被任命为有薪职位——而志愿者们却被要求培训这些人。艾达·布莱克恩夫人（Mrs
    Ada Blackburn）议员告诉普鲁德霍市政议会：“我们的警员对这件事非常愤愤。他们是自愿的，而现在某些在志愿者征集时没有出来的人，却获得了一个全职有薪岗位。让一个自愿服务的人去培训另一个拿钱干活的人，这是一个非常不寻常的局面。”


    ### 潜艇袭击后的逃生


    战争恐怖的早期体验发生在 9 月 10 日，当时一艘德国 U 潜艇击没了从利物浦开往加拿大的雅典尼亚号（SS Athenia）邮轮。船上的人包括来自安大略省温莎市的
    A·巴特利夫人（Mrs A. Butterley），她在汉姆绍（Humshaugh）长大，当时正在瓦尔探望她的姐姐。巴特利夫人告诉《酷报》（Courant）的记者：“每个人的心情都很好，因为我们在战争爆发前正要回家。船上非常拥挤，其中一间餐厅不得不改造成宿舍。突然，听到一声无法言喻的沉闷响，所有的灯熄灭了。没有人在考虑鱼雷或潜艇，但我们本能地知道发生了什么。孩子们吓坏了，但总的来说，并没有怎么恐慌。”


    她设法在黑暗的船上摸索着到达甲板，但等了一个半小时才等到救生艇。她报告说，当其中一条救生艇降入水中时，支架断了，导致许多乘客溺水。另一艘船完全满了妇女和儿童，没有男人划船，但巴特利夫人不知道他们是否幸还了。


    她最终爬上了最后一艘离开船只的救生艇，这艘本设计为 50 人设计的船上拥挤了 75 人，她报告说潜艇在再次潜没前曾浮出并射了两射。“这是一次噩梦般的经历，”她说，“我们紧紧在一起，因为担心弄翻船而几乎不敢挪动。每一波浪花都会打过船身，我们很快就淋透了全身。那些穿着鞋的人把鞋脱掉，用鞋来舀水。”


    在狂暴的大西洋上坐着开放小船漂流了十二小时后，他们日益微弱的“呼救”声得到了一艘路过的皇家海军驱逐舰的注意，并被救起。巴特利夫人说她感到头晕脑胀、疲惫，对船员提供的热饮深表感谢。她相信船上的每个人都幸存了，尽管有很多人遭受着骨折。


    巴特利夫人觉得自己被营救是双倍的幸运，因为她曾乘坐雅典尼亚号横跨大西洋，并尝试在回程时获得同样的客舱，但已经被预订了。她后来得知她中中的客舱在潜艇袭击中炸成了碎片。


    她曾七次横跨大西洋，但说：“等我安全回到加拿大，我就再也不跨它了。”


    当时发起了号召 18 至 43 岁的女性加入女子空军辅助队（Women’s Auxiliary Air Force），那里有厨师、食堂勤员、汽车运输司机、文员、电话和电报员以及织布工的空缺。日薪从初级军官
    7 英士 10 便到高级军官 1 英镑 2 士 4 便不等。


    战争才持续了两周，该地区就遭受了第一起归因于宵令的伤亡：一名 89 岁的疏散人员在赫克斯姆东部的怀德霍（Widehaugh）被公交车撞死。联合巴士公司司机威廉·伊德（William
    Eade）在对本杰明·钱姆伯斯（Benjamin Chambers）死因的调查中告诉，他在一个黑暗阴雨的夜晚晚上 9 点刚过开着巴士从赫克斯姆开往纽卡斯尔。他开启了允许的灯光，侧灯被遮住，任何朝他来的人都能看到。当以每小时
    10-15 英里的速度行驶时，感觉到有东西撞了他的左侧大灯。他在车长范围内停下巴士，发现钱姆伯斯先生躺在路中心的白线附近。尸检显示他遭受了多处伤害，其中任何一种都可能致命。


    南诺森伯兰郡法医 P.M. 多德斯（P.M. Dodds）听闻钱姆伯斯先生既聋又近，在做出裁决时评论道：“一个 89 岁、患有近视和耳聋的老人在这种时间无人照护地出现在黑暗中，真是太遗憾。”


    他建议在宵令期间，人们不应该在路中间行走，而应该靠人行道，并且应该穿着或携带白色或浅色物品，以便被辨认。


    ![Image](img/f0021-01.jpg)


    即使是希特勒也无法压制 1939 年赫克斯姆的圣诞精神。


    宵令规定被严格执行，在海登桥（Haydon Bridge），海登酒店和苏格兰手臂酒店（Scotch Arms）的房东各因场所内灯光可见而被罚款 10 英士，赫克斯姆灰牛酒馆（Grey
    Bull Inn）的房东也被处以了同样的罚款。


    战争爆发关闭后，该地区的电影院和舞厅在三周后开始开放，前提是所有顾客都自带防毒面具。各学校的课程被削减，木工课被用于制作夹板，作为学校救护设施的一部分。塞尔学校（Sele
    School）和圣玛利亚天主教学校也提供了防碎片和防毒的空避难所。中学提供了八处避难所，伊丽莎白女王文法学校每个部门提供了六处，小学提供了六处。父母被建议，在发生空袭时，当地学校是孩子们最安全的地方。


