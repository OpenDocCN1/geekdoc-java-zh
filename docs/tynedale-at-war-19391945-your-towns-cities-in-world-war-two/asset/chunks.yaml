    Lance Corporal Clark was one of the twenty-three signatories from the Tynedale
    area of a letter from the Italian camp, singing the praises of the various organisations
    in Hexham working on behalf of prisoners of war. The letter said: ‘We are very
    grateful for all that is being done. We are all fit and well and looking forward
    to an early return to the Heart of All England. Often, we wish we could see the
    Hexham Courant.’


    Writing from the same camp, Stalag IVB, after being transferred from Italy, Corporal
    Leonard Ward, also of Hexham, said the food and treatment in Germany was far better
    than it had been in Italy.


    ![Image](images/f0142-02.jpg)


    Haydon Bridge’s Sister Jessie Waugh was a popular figure when she was among twenty-one
    British nurses who landed in Sicily, not only providing nursing services, but
    also entertaining the troops in concerts, where her talents earned her an invitation
    to join the Entertainments National Service Association, better known as ENSA.


    ![Image](images/f0143-01.jpg)


    Taking a break from the fighting in the Middle East by doing a little boating
    are Corporal E. Horlington of Hexham (left) and Private F.H. Ward of Haydon Bridge
    (right) with Regimental Sergeant Major Warner Smith of Fulham in the centre.


    Back on the home front, there was sadness when a 21-year-old member of the Women’s
    Land Army was found dead in a deep pool in the Devil’s Water at Steel in Hexhamshire.
    The girl, from the Thropton area, had been working at Slaley, when she went for
    a cycle ride and never returned. She left a note addressed to her mother, saying:
    ‘I am sick of life – everyone is against me. They hate me, and I cannot go on;
    I may be happy where I am going.’ A verdict of suicide was returned by the coroner.


    ## Ammunition explosion at Hexham Station


    Hexham escaped relatively unscathed from the Nazi bombs which fell on the industrial
    complexes of the Tyne, Tees and Wear during World War Two, but it was British
    ammunition which caused the town’s only loss of life on the home front.


    Three soldiers were killed in an explosion at Hexham Railway Station as they were
    unloading ammunition from a train. No-one really knows the full story of what
    happened on that fateful day, 9 September 1943, but there were some remarkable
    examples of heroism, as worthy of recognition as anything happening overseas.
    What is known is that a box of ammunition was dropped, and exploded, killing two
    19-year-old Royal Scots Fusilier officers and a 24-year-old driver from the Royal
    Army Service Corps.


    Lieutenant John Middlemass of Leven, Fife, and driver Stanley Dowse of Peterborough,
    were killed instantly. Lieutenant Patrick Wilson of Peebles died later in Hexham
    hospital. Another soldier, who was caught in the blast, was injured, and a civilian,
    Mrs Daglish, who was standing outside her nearby home, was struck by a fragment
    of exploding ammunition.


    All rail traffic was held up and, owing to the great danger of further explosions,
    all houses in the vicinity were evacuated. Commuters arrived home many hours late,
    after being taken off the trains further up the line and brought home by bus.
    Fire heightened the danger and military personnel were joined by the National
    Fire Service and the police in battling the flames licking round the ammunition
    boxes.


    At great risk to themselves, a group of five soldiers uncoupled one of the fully
    laden wagons, and dragged it to safety. Bomb disposal squads worked throughout
    the night to clear the station premises of unexploded ammunition, which included
    various types of infantry armament, including hand grenades.


    Shunter Robert Henry Thompson (50) and his two colleagues, engine driver Robert
    Norris and fireman Edward Liddle, also played their part. Shunter Thompson attempted
    to withdraw the loaded ammunition wagons from the loading dock. He intercepted
    a pilot engine and went back to the four ammunition wagons, coupling them up so
    they could be drawn away. By this time, some of the wagons were on fire and Thompson
    had to push away burning material from the roof of one wagon with his shunter’s
    pole.


    After the wagons had been well isolated, Thompson uncoupled them from the pilot
    engine and withdrew. At the inquest which followed, a witness said he had seen
    a box which had been placed on the back of the lorry slip off on to the ground.
    The driver appeared to have slipped on the cobbles. The box fell only two or three
    feet, but exploded immediately. Minutes afterwards, there was a second explosion
    from the rear of the Army truck, followed by a fire. Ammunition and phosphorus
    was strewn about and throughout the incident, there were minor explosions from
    both the railway wagon and the Army truck, as the fire raged.


    What caused the explosion remained a mystery, however, as experts told the inquest
    that the ammunition should not have gone off merely through the box being dropped.
    Regimental Sergeant Major Thomas Kirby of the Royal Scots said the ammunition
    was in sealed cases and the grenades did not have the detonators inserted. Asked
    for a theory for the explosion, RSM Kirby told the inquest: ‘I cannot account
    for it at all.’ When pressed, he could only assume there was a problem with a
    constituent of the ammunition, or a defect in it.


    Shunter Thompson’s bravery resulted in his being awarded the British Empire Medal,
    while Norris and Liddle were also highly commended. Their actions were regarded
    as being ‘of the highest order’ by the General Officer Commanding Northern Command,
    who thanked them on behalf of the Army.


    There was also formal recognition of the gallantry of the soldiers who were involved
    in uncoupling the carriages. British Empire Medals ‘for gallantry during the explosion
    of ammunition at Hexham’ went to Fusilier William Chassels and Fusilier Andrew
    McMichael, while commendations went to Lance Corporal W. Symington, Lance Corporal
    Jimmy Saunderson and Fusilier J. Montgomery.


    Unhappily, neither of the BEM winning fusiliers survived the war. William Chassels
    was killed in Normandy on 16 July 1944. He was 21 years old and came from Hamilton,
    Lanarkshire.


    Andrew McMichael was killed during the Rhine crossing on 24 March 1945. He was
    37 and came from Maybole, Ayrshire.


    Ayrshire man Lance Corporal Jimmy Saunderson did survive the war, only to drown
    with two others trying to cross a river in the Newcastle area some years later.


    One of the more unusual cases to come before Hexham Magistrates was heard in October,
    when the Acomb Coal Company issued summonses against forty-seven pitmen for breach
    of contract, when they failed to turn up for work. The case was brought against
    mine workers aged between 19 and 66 who hailed from the West Wylam, Prudhoe, Mickley
    and Branch End districts, who were taken to work at Acomb Colliery by specially
    laid on bus.


    On 11 August however, a new bus was put on the run, and the operator asked the
    twenty-two men on the back shift on board to get out in the coalyard, 200 yards
    away from the pit as he did not wish to risk scratching his new vehicle on the
    tree branches which overhung the lane on the way to the pit proper. The men refused
    to get off and after an impasse, said they were not prepared to work under such
    circumstances and went home.


    The twenty-five nightshift men coming up from underground downed tools in sympathy
    when they heard what had happened. The company claimed £1 in damages from each
    man, but the case was withdrawn following negotiations with the Northumberland
    Miners Association, which negotiated a settlement whereby each man had to pay
    10s, to be deducted from their wages at 2s 6d per week.


    Hexham played its part in a scheme to help exhausted women war workers from Tyneside,
    with the opening of a rest break centre at West Quarter, where accommodation was
    provided for forty women. The centre was opened by George Tomlinson, the joint
    parliamentary secretary to the Ministry of Labour and National Service.

