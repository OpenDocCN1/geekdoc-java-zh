    since its installation on the police station roof, which had to be specially reinforced
    to bear the weight. It was quickly pointed out that the new siren could not be
    heard at Lowgate, only a mile outside Hexham, while it was clearly audible at
    Ovington, 12 miles further away down the Tyne. A strong west wind was blamed for
    the problem.


    Back in 1939 Tynedale, like the rest of the country, was starting to come to terms
    with the fact that the ‘Peace in Our Time’ pronouncement of Prime Minister Neville
    Chamberlain a year earlier might not be worth the piece of paper it was written
    on, as Hitler and the Third Reich were behaving in an ever more provocative manner.


