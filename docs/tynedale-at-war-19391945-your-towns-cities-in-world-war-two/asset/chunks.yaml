    Throughout the war there was only one air raid warning, when the girls spent an
    uncomfortable night cuddling their teddies in the air raid shelter, waiting for
    the all clear. The girls spent four years at the school, but following the D-Day
    landings, they returned home, taking with them many happy memories.


    The call for salvage brought a ready response across the district, with salvage
    dumps being set up in every town and village. Among the items handed in at the
    `Hexham` depot at `Prospect House` were an old lady’s aluminium hot water bottle,
    a solid copper bath and a farmer’s chicken incubator, while a child offered up
    the lines of his clockwork train set. Also handed in were a Victorian metal fireplace,
    a large number of brass oil lamps, prams, toys, boilers and thousands of tins,
    along with two whaling harpoons, relics of the `Tyne` whaling fleet, and a German
    helmet salvaged from the last war.


    The Rector of `Hexham` was forced to defend the fact that the `Abbey`’s metal
    railings remained in place, pointing out that the parochial church council had
    wanted to offer them as salvage, but had been denied consent by the bishop’s office
    in `Newcastle`. The bishop’s stance was supported by a `Courant` correspondent,
    who said the railings were necessary to protect the integrity of the church. He
    wrote: ‘Imagine a special occasion, such as an interesting wedding. People would
    be climbing on the wall, and the assistance of the police would be required to
    prevent them from rushing the doors. The police have plenty to do without adding
    to their duties.’


    It wasn’t until mid-October that the diocese relented and a faculty was granted
    for the removal of the railings. Railings around all the town’s public parks were
    removed, however, as well as the cemetery.


    ### Local tragedies


    There were tragedies on the Home Front with two soldiers drowning in separate
    incidents while swimming in the `Tyne` – one at `Riding Mill` and one at `Hexham`.
    Private `Richard Welding`, of `Warrington`, was on bathing parade with around
    thirty other soldiers on the `Tyne` at `Riding Mill`, when he got into difficulty.
    The subsequent inquest heard he was not a strong swimmer and the area where he
    had been swimming was dangerous to bathe in, as there were back eddies and a whirlpool
    and the water was `10-12ft` deep, with an unstable silt bottom.


    An officer of his regiment told the coroner that as a result of the incident,
    there would be no further bathing parades on the `Tyne` and the public baths would
    be used instead.


    Just three days later, 20-year-old Gunner `James Radcliffe` of `Manchester`, drowned
    when he also got into difficulties when swimming in the `Tyne` at `Hexham`. Witnesses
    said he had been washing himself in the river and told friends he was going to
    swim to the other side, even though he was not a strong swimmer. He got halfway
    across when he went under the water and resurfaced with a shout, ‘Save me, I am
    drowning!’ Despite attempts by companions to save him, he drowned, even though
    the area where he was swimming was said to be very popular with bathers for generations.


    There were deaths in the barracks too, with a soldier from `Birmingham`, `William
    Joseph Murphy` (22) charged with murdering fellow soldier `George Eric Ward`,
    of `Manchester`, after a drunken row in the village outside `Hexham` where they
    were stationed. Trouble flared when two half crowns went missing from his bed.
    He loaded his rifle and said he would shoot whoever had taken his money. Several
    people tried to take the gun away from him, including `Ward`, said to be his best
    friend, who ended up being fatally shot through the stomach.


    `Murphy` claimed the gun had gone off accidentally, but he was still committed
    to `Newcastle Assizes` to stand trial in August `1940`. He was later found not
    guilty of murder but guilty of manslaughter and sentenced to nine months hard
    labour.


    It was a traumatic August for `Mrs T.C. Urwin` of `Wanless Close`, `Hexham`, for
    in the space of two months both her husband and her son were aboard ships sunk
    by German torpedoes. Her husband was aboard the liner `Mohamed Ali El Kebir` which
    set sail from a British port with both troops and naval ratings aboard when it
    was struck by a torpedo two days out from port. The ship sank within two hours
    and, with its lifeboats damaged, `Mr Urwin` had to scramble down rope pulleys
    to board a raft in heavy seas and was adrift for five hours before being picked
    up by a destroyer.


    Meanwhile, the couple’s 18-year-old son `Michael` was aboard `HMS Calypso` when
    it too was torpedoed and the family had an anxious wait before it was confirmed
    he had been picked up and was recuperating in Egypt.


    ![Image](images/f0053-01.jpg)


    As well as fighting the Nazis abroad, `Tynedale` folk were urged to tackle another
    enemy on the Home Front – the rat. Note the Hitler hairstyle and toothbrush moustache
    on the specimen on show.


    Among those doing their bit was `Hexham`’s oldest resident `Mary Jane Robson`,
    who at the age of 97 was still knitting socks for soldiers. `Mrs Robson` had lived
    through five wars and was the last surviving member of a family of nine, noted
    for their longevity. She had succeeded her brother `Dr C.R. Kendal` as the town’s
    oldest resident, following his death at the age of 97. Her husband had been killed
    in the opening weeks of the Great War. To buy the ninety-seven candles for her
    birthday cake would have cost `12s 6d`, but `Mrs Robson` asked that the money
    should be donated to war charities rather than on the purchase of candles.


    In August the ‘Hit Back, Buy A Spitfire’ campaign was launched in `Hexham` with
    an ambitious target of `£5,000`. It had the backing of Air Commodore `Milne Robb`,
    shortly after he had received the Air Force Cross. `Robb` said:


    ‘The recent unsuccessful mass attacks by the German air force had as the main
    objective the wearing down of our fighter defences which must have brought home
    to everyone the great responsibility which is being borne by our fighter squadrons.
    So far in these attacks the enemy has largely relied on medium and dive bombers,
    escorted by large formations of fighters, and has employed a comparatively small
    proportion of heavy bombers, of which he has large numbers. Any weakening of our
    defences would allow him to use these heavy bombers in daylight.


    The great destruction wrought in `Poland` and `Rotterdam` was the work of the
    heavy bombers and was only possible because they were able to operate during the
    day. This is the state of affairs which the enemy hopes to bring about in this
    country. He has had little success to date, but he cannot give up now without
    acknowledging a major defeat.


    I welcome the proposal to open a Spitfire fund in `Hexham`, both as proof that
    the work and responsibility of our fighters are being recognised, and as a practical
    means of adding to our defences.’


    A leading member of `Hexham` Townswomen’s Guild, `Sadie Dodd`, urged women to
    get involved in the Spitfire fund, saying: ‘It is a grand bit of propaganda. Here
    are those Germans coming across here every night to break our morale and the only
    effect it has had is to make large groups of people, unasked, to club together
    to buy Spitfires to beat them off. It must be very discouraging for them to find
    us so full of fight.’


    Collecting tins went out to pubs and shops, personal letters were sent to hoped-for
    benefactors and it was announced there would be a mile of 10s notes campaign.
    Within less than a week, more than `£200` had been donated and in less than two
    months the total was `£2,000`. By the beginning of January `1941`, in just five
    months, the target had been exceeded, with the cash coming in at the rate of `£1,000`
    per month from special fundraising efforts to personal donations. The organising
    secretary was `J.F. Macgregor` who headed a willing band of assistants.

