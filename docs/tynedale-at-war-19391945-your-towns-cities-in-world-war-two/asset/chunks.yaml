  trans: '

    对于泰恩代尔（Tynedale）的狩猎协会来说，这是一个坏消息：他们收到一项政府新指令，必须将猎群中的猎犬数量减少到战前水平的六分之一。泰恩代尔将被要求每周仅活动两天，而不是传统的四天，且猎犬数量将减少到八个半对或九对。一位猎头人表示：“自从战争开始以来，狩猎活动一直在为了国家利益做出牺牲。这项新规定将极大限制我们的活动，但与数百万为了赢得战争所付出的牺牲相比，这算不上什么。”


    ## 醉酒、扰乱秩序和其他犯罪


    澳大利亚帝国军成员在周六晚上来到赫克斯姆（Hexham）的行为，日益引起了赫克斯姆法庭的关注。在对一名澳大利亚人因醉酒和扰乱秩序处以 2 英镑的最高罚款后，法庭主席约翰·布鲁格登（John
    Brogdon）议员警告说，任何更多不听话的闹事者将被送往监狱，且没有罚款的机会。当地警察警亭长威廉·古德费尔（William Goodfellow）告诉法庭，澳大利亚人在醉酒问题上的表现远低于制服人员应有的标准。警察在午夜或凌晨
    1 点前将他们赶出镇非常困难，而且他们的行为对驻扎在该地区的许多其他士兵是不公平的，而那些士兵没有引起任何投诉。该士兵部队的一位军官说：“这种情况让我们感到非常困扰，因为我们非常看重自己的名誉。”


    当月晚些时候，法官们拒绝为赫克斯姆的一场为海外联盟（Overseas League）筹字的舞会发放晚间饮酒许可，理由是存在混乱的风险，并提到赫克斯姆附近驻扎着来自不同国家的大量士兵。由于下班士兵扰乱秩序的行为增加（包括打破和投掷玻璃杯），警察反对了这项申请。


    出现在法庭的不仅仅是澳大利亚人。一名在本周早早些时候击落了一架德国飞机的波兰飞行员出现在被告席，被指控盗窃了一只价值 12 先令的艾尔伯里鸭，那只鸭属于一名当地警察。这名飞行军士穿着全套飞行装备出现在被告席，且不会说英语，因此需要翻译服务。逮捕警察接受了该波兰人偷鸭并不是为了食物，而是想将其作为吉祥物，案件被驳回。然而，该飞行员被命令支付
    5 先令诉讼费，但法庭的一名成员表示，考虑到该男子击落过一架德国军飞机，他将自掏腰这笔费用。


    另一位匿名陆军军官也出现在法庭，被指控在没有许可的情况下在科布里奇（Corbridge）泰因河钓鲑鱼。当被执吏询问时，他问道：“这就是我们战斗的意义吗？我以为钓鱼是免费的；这太琐碎了。”尽管他告诉法庭他习惯在苏格兰钓鱼（那里不需要执照），但他被罚款
    15 先令，并承担 5 先令诉讼费。


    ## 赫克斯姆辅助消防队调查


    1941 年中期，赫克斯姆辅助消防队（Auxiliary Fire Service）的活动引起了赫克斯姆地区委员会（UDC）的极大恐慌，有人要求因涉嫌盗取单位消防车的汽油而解雇所有全职人员。人们对消防车消耗的燃料量过高表示担忧，委员会官员的调查显示，在
    4 月 5 日至 5 月 20 日期间，该车辆仅行驶了 46 英里——但提取的燃料量却是 44 加仑。检查显示，泡沫设备的一根管子被用来将汽油从消防车抽吸到一个容器中。据信，在车辆执行任务派遣期间，其汽油箱曾被完全抽干。


    在要求解雇辅助消防队所有全职成员时，委员会副主席乔·库伦（Joe Cullen）表示：“我们至少可以说，在看护和管理这种珍贵物资时存在着完全的疏忽，而这种物资是我们油罐车士兵们用血、汗和生命带入这个国家的。你们可能觉得我的建议非常激进，但极端的恶行需要激进的对策，在目前的情况下不允许这些事情发生。”


    警方曾被报案，但事实证明要识别真手是不可能的——就像在其他几次辅助消防队库存的燃料莫名其妙消失时一样。


    ![Image](img/f0084-01.jpg)


    ## 军事荣誉与食品供应


    来自赫克斯姆的代理军士诺曼·P·麦基（Norman P. McKie）在索马里号舰（HMS Somali）于执行北极护航任务遭鱼雷袭击后自愿留守，获得了战后表彰。在几乎所有士兵离开船后，他作为蒸汽小组的一员留在船上。记载写道：“麦基军士在船沉没前的三个半小时内表现出的热情、勇气和对职责的忠诚，是所有同在人员的典范。”


    其他议员同样担心燃料的损失，但质疑在国家危机时期辞退训练良好且有能力的消防员是否明智。解雇提议被拒绝了，但大家同意必须加强纪律和安全。


    在食品方面，西红柿极其短缺，以至于店主为有固定订单的老客户预留，这导致一位家庭妇女询问：“这意味着工人阶级的人买不到西红柿了吗，因为他们负担不起固定订单？”


    赫克斯姆店主评论道：“当你带着西红柿从市场回来时，人们为了抢几乎要把你的窗户撞破，如果你拒绝，你就真的惹麻烦了。”


    ## 水果保存计划


    制作果酱的糖一直是争论的，但果酱制作被交给了泰恩代尔妇女协会（women’s institutes）负责。整个地区设立了剩余水果的保存中心。该计划专门用于保存那些本会被浪费的水果，并鼓励水果生产者像战前那样自行食用、装瓶或将水果制成果酱。只有剩余产品才能带往各个中心，价格由政府制定。醋栗的最高售价价为每百英磅
    30 先令，覆盆莓为 47 先令 6 便士，黑醋醋果为 90 先令，草莓为 75 先令，越橘莓为 50 先令。


    该计划在贝林汉姆（Bellingham）启动，但最初被证明大大不人意，因为没有水果供应。该计划生产的第一批果酱是在斯托克斯菲尔德（Stocksfield），在那里，Bywell
    和 Branch End 协会的女士们制作了 100 磅的醋栗果酱，这些水果是以每磅 3.5 便士的固定价格购买的。除了清洗和煮熟水果外，女士们还承担了清洗和消毒当地小学生为计划收集的
    2000 多个果酱罐的任务。


    其他中心也效仿此举，科布里奇、迪尔斯顿（Dilston）和斯塔肖（Stagshaw）联合妇女协会生产了 154 磅的大黄和醋栗果酱，迅速被当地店主抢购。阿伦代尔老男爵夫人（Dowager
    Viscountess Allendale）将她在 Bywell Hall 的厨房租给了这项事业，生意非常兴隆。


    泰恩代尔水疗中心（Tynedale Hydropathic Establishment）的居民感到震惊，当他们从晚饭后起身时，发现接待处贴了一张告示，称酒店正在出售中，他们必须寻找替代住宿。虽然细节很少，但人们理解出售是迫于所有主的，因为该建筑正被政府征用作为儿童疗养。


    许多居民已将酒店作为永久住所，有些人是因为他们在英东北部其他地方的家被炸了，无处可去。

