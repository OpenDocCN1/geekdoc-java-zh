    He went on: ‘The greatest moral question is whether a million British youths have
    to die through intervening in an unjust quarrel on the continent. Before we run
    to the aid of a smaller nation against a bully, we have to be sure there is a
    bully.’


    Despite Mosley’s words, Tynedale was still on a war footing, with the `Hexham
    Scout Troop` among the first in the region to be enrolled as air raid wardens.


    It wasn’t all war talk though, for `Hexham Urban Council` rejected a plea for
    children to be allowed to use the swings on the `Sele` pleasure grounds on a Sunday.
    Councillor `Joe Cullen` spoke in favour of the application, noting that Sunday
    golf was already allowed on `Tyne Green`, and he would like to see Sunday bowling
    too. He said: ‘I don’t think this would keep children away from Sunday School
    or chapel, or that there would be any desecration of the Sabbath.’


    However, Councillor `Miss Iveson` was opposed to the move, saying: ‘There are
    six days in the week when the children can use the swings and I think they can
    easily do without them on Sundays.’ The request was turned down.


    As the nation prepared for war, there was a grim taste of things to come when
    a `Wark` sailor was among the ninety-nine dead when the ill-fated submarine `HMS
    Thetis` sank while undergoing trials off the Welsh coast. He was Petty Officer
    `John Adam Hope`, who lived with his mother in `Elliott Terrace`. He was 36 years
    old and had been in the `Royal Navy` for twenty-two years, fifteen of them in
    the submarine service.


    The introduction of conscription in June 1939 went very smoothly, with no problems
    at any of the `Labour Exchanges` across the district where men were required to
    register for military training. An official at the `Hexham Exchange` said: ‘The
    men rolled up well and were in a good frame of mind. Two things were noticeable
    – the good spirit in which they came, and their excellent physique.’ One man had
    walked six miles to the `Exchange` to sign up and others included a man from `Harrogate`,
    in `Hexham` for a wedding, and a bronzed man in shorts who was in the area on
    a hiking holiday. There were few requests to register as conscientious objectors,
    although there was a marked preference to serve with the `RAF`.


    The ever-present threat of war was cranked up to an even higher level at the end
    of August, when the worsening international situation saw all air raid posts in
    the district manned and the switching off of all street lights. The blackout also
    caused kerbs and street corners to be painted white. Business came to a virtual
    standstill, except for the shops, which experienced a great demand for tinned
    goods and materials with which to black out windows. Residents who had not been
    issued with gas masks were urged to go to the offices of `Hexham Urban Council`
    to collect one without delay.


    When war was finally declared on 3 September the news was received calmly, with
    the air raid siren sounded and special constables taking to the streets of `Hexham`
    with their gas masks and tin helmets. They were dispatched to guard bridges and
    other strategic points across the district, as well as ensuring blackout regulations
    were strictly observed.


    ![Image](images/f0015-01.jpg)


    Devastated Prime Minister `Neville Chamberlain`.


    There were strong words from the chairman of `Hexham Urban District Council`,
    Councillor `Tom Wheatley`, who said: ‘I have come to the conclusion that the policy
    of appeasement is no good when you have a mad dog like Hitler loose in the world.
    I am very pleased we are going to try to put this mad dog down.’


    ### Evacuees


    By the first week in September, as the first German bombs fell on Poland, `Hexham`
    was already receiving the first of its scheduled 4,000 evacuees from `Newcastle`
    and `Gateshead`. Five trainloads of children arrived at `Hexham railway station`
    to board a fleet of buses to convey them to the senior school, where preparations
    were made to transfer them to various parts of the rural areas. Car owners were
    also asked to turn up at the railway station to assist with conveying the bewildered
    children to their new temporary homes.


    The evacuees for `Hexham` came from `St Dominic’s RC School` (690); `Cowgate`
    (300); `West Walker Council` (733) and `East Walker Council` (476). `Bellingham`’s
    allocation comprised 450 children from `Heaton Park Road Council`, while `Haltwhistle`
    had 700 from `Delaval Council`, and `Allendale` 307 from `Whickham Road Council
    School` and 214 from `Pendower Bridge`.


    The children arrived at the station ‘choking with excitement’ according to the
    `Hexham Courant`, accompanied by their teachers. Each child had a gas mask and
    an identification disc. Medical inspections were carried out by a team of doctors
    and nurses under `Dr Patton`, with hands, teeth and hair all coming under close
    scrutiny.


    ![Image](images/f0016-01.jpg)


    Thousands of evacuees start to pour into Tynedale as war is declared.


    They were then issued with their rations, which comprised biscuits, a tin of corned
    beef, two bars of chocolate, a tin of unsweetened milk and a tin of condensed
    milk.


    The children were made very welcome, with one `Hexham` mother telling the `Courant`:
    ‘It is of the children we must think, not of ourselves. We are comparatively comfortable,
    but these children have left their homes, friends and everything. I am willing
    to do my share to ease their burden.’


    Her views were shared by a man, who added: ‘Many of these youngsters cannot help
    their circumstances. They may not be of the wealthier classes but I am sure they
    will not be of the least trouble to those of us who will have to look after their
    welfare.’


    The city children were soon billeted on local families, although some residents
    refused to take in any evacuees. A boy wrote to his mother: ‘Hexham is a nice
    place. There are plenty of plums, pears and brambles. The woman is very kind to
    us and feeds us well. This is a nice holiday – we just play in the park all day.’


    Country life was a mystery to many of the evacuees, with tales of two boys tramping
    the roads of `Hexhamshire` in a vain search for a sweet shop, while the absence
    of a picture house was also keenly felt. Secretary of `Hexham War Memorial Hospital`,
    `Michael Green`, appealed for books and magazines to set up a library for the
    evacuees, as well as arranging football matches between the town and city children.
    There was also an appeal for parlour games to keep the children amused.


    The `Courant` reported that in `Corbridge` the evacuation process had gone ‘fairly
    smoothly’, but some people had refused to take in children and there had been
    difficulties with some mothers. At `Haltwhistle`, buses and a fleet of private
    cars were used to take the children to the `Olympic Hall` – made from materials
    salvaged from `RMS Titanic`’s sister ship the `SS Olympic` when it was broken
    up at `Wallsend` – at the `Smith and Walton paint factory`, where they were given
    a delicious meal of meat soup and buns before being introduced to their host families.
    The `Ministry of Transport` noted that `Haltwhistle` was one of the first places
    in the region to get the children billeted and the correct paperwork filled in.


    After the children and their mothers had been dealt with, with nearly every household
    in the town opening its doors, there was still a welcome in `Haltwhistle` later
    in the week for ‘expectant mothers, cripples and blind people’.


    More than 200 children and 75 mothers were welcomed to `Wylam` with open arms,
    with children in particular having no difficulty in finding billets, so much so
    that some families were disappointed not to have any evacuees to take home. Billeting
    officer `Colonel W.E. Keys` reported that the children all appeared wonderfully
    well cared for, clean and ‘extraordinarily nice’.


    Things did not go so smoothly at `Haydon Bridge`, where some householders refused
    to provide shelter for the children sent to them, and some of the older evacuees
    ‘were inclined to give more trouble than was necessary to those providing them
    with shelter.’

