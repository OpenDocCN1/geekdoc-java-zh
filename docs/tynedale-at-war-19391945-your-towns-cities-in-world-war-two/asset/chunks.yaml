    The debate followed a request from `Prudhoe Working Men’s Club` debating society
    for a ruling on the matter, and the vicar said he saw nothing at all wrong in
    the park being open for those who wished to play games on a Sunday. He said: ‘If
    I played games on a Sunday, I would not consider myself to be committing a sin.
    I think if people don’t agree with my way of life, and don’t come to church on
    Sunday, they should be allowed to play games if they wish. People should be allowed
    to do as they please on a Sunday, and just because the park is open for the playing
    of games, it does not mean that people will actually play them. I don’t think
    there is any risk of any branch of the Christian faith being imperilled by the
    park being open.’


    He was supported by Mickley’s Councillor Ada Blackburn, who said that in St Mark’s
    Gospel, it was stated that the Sabbath was made for man, not man for the Sabbath.
    She said that with a lot of people working long hours on war work, any increase
    in outdoor recreation provision was to be welcomed. The pragmatic Councillor John
    Currey noted that while he had no objection to the park being open seven days
    a week, there was the question of double pay on Sundays for park staff to consider,
    as the park was already costing the ratepayers of Prudhoe a lot of money.


    In response to Councillor Blackburn’s biblical quotation, Councillor J.W. Lee
    responded by pointing out that the bible also stated that ‘six days thou shalt
    labour, and rest on the seventh’. He pointed out that the park was already open
    at the weekend for people wishing to rest and enjoy its beauty, and walkers would
    not appreciate the tranquillity being disturbed by noise from the playing of games.


    Councillor T. Peel added: ‘I think we have enjoyed too much sport in the past
    and we have forgotten the more serious things in life. The Sabbath Day was made
    for rest and worship.’ With the exception of the vicar and Councillor Blackburn,
    the council voted there should be no Sunday games.


    Allegations of complacency were levelled at Hexham’s readiness to deal with any
    air attack by the town’s deputy chief ARP warden, Mr G.W. Umpleby. He told Hexham
    Rotarians: ‘At any time during any night bombs could fall and the time for sitting
    back and saying it will never happen has gone. We have got to be ready for anything.
    Too many firewatchers have no idea what to do in the event of a bomb falling.
    Are we going to present to Hitler all we have because we have not taken the trouble
    to look after it?’


    He urged all business houses to ensure that at least three or four members of
    staff were trained in the use of stirrup pumps and knew how to tackle incendiary
    bombs.


    There was a special award for 39-year-old Prudhoe seaman Thomas Newton of Castle
    Road, who saved the lives of thirty members of the crew of his ship after it had
    been hit by an enemy bomb. He commanded a lifeboat which took survivors off the
    stricken vessel and delivered them to a warship standing by, before volunteering
    to return to the sinking ship to rescue more survivors. It was the unanimous opinion
    of his shipmates that Newton’s conduct during and after the bombing had been exemplary.
    The ship owners recognised his extreme bravery by forwarding Newton a cheque and
    a letter of appreciation.


    A letter from her husband Corporal Harry McBride, proved sweet music for a Prudhoe
    woman, for she learned that he was not only safe in a German prisoner of war camp,
    but was also the leader of the prison camp band, where a piano had been provided
    especially for him.


    On the home front, brawling Australians again found themselves in court, following
    an incident at a pub in Riding Mill, where furniture was smashed and four dozen
    glasses broken. After being thrown out of the pub, they continued to fight and
    cause a disturbance outside using obscene language of a disgusting nature. The
    three soldiers and a sailor were charged with riotous conduct and committing damage
    to the tune of £5 9s to the pub. They were fined 12s each and told by the chairman
    of the Hexham Petty Sessions John Charlton: ‘We are glad to have you from the
    Commonwealth of Australia as guests of this country, and we know what excellent
    work you are doing here. However, we want you to behave yourselves and not go
    round painting places red.’


    Restrictions on the use of paraffin caused concern in the rural areas, where it
    was heavily used for both cooking and lighting, as well as for farm work. Farmers
    were being restricted to one or two gallons of paraffin a month, when in practice
    they needed three or four gallons a week to carry out their work. One Haydon Bridge
    farmer protested: ‘If more paraffin is not forthcoming, the feeding and milking
    of stock will have to be carried out in daylight hours, when the men should be
    on the land.’


    ![Image](images/f0102-01.jpg)


    Acting Petty Officer R.S.T. Scott of Bellingham, awarded the Distinguished Conduct
    Medal for gallantry at sea while serving aboard the destroyer HMS Havelock.


    An Allendale farmer added: ‘How is the farmer supposed to get his stock fed and
    milked without light? The present paraffin allocation doesn’t cover the needs
    of the house, never mind the byres.’


    The Hexham Courant was credited with saving the life of a former Hexham widow,
    Mrs George Riddell, who had moved to the coast following the death of her husband.
    She was debating with herself whether to go into the garden to pick fruit with
    her four-year-old granddaughter, or to start preparing a meal in the kitchen,
    when the Courant arrived by post, and she decided to read the paper instead. She
    took the little girl with her into the dining room, shortly before a ‘tip and
    run’ raider unleashed a stick of bombs on the town, which landed just 30 yards
    away from the garden where she would have been.


    ![Image](images/f0103-01.jpg)


    Top pre-war footballer Ronnieppell, from Acomb, was serving with the RAF in India,
    and was selected to represent the service in a match against a Bombay XI, playing
    alongside six internationals and other professionals.


    Several people caught outside were killed and the force of the blast tore the
    kitchen door from its hinges, and caused considerable damage to the kitchen itself.
    Mrs Riddell’s daughter said: ‘It is certain that if Mother had not gone into the
    dining room to read the Courant, she would not been alive today.’


    Three drivers in Hexham were fined between £1 and 15s each by the town’s magistrates
    for using cars at night that did not have white paint on the bumpers and running
    boards, in contravention of blackout regulations.


    For the first time in twenty-two years the two minutes’ silence was not universally
    observed in Hexham on 11 November 1941. There was no bugle call to herald the
    start of the tribute, with the authorities relying on the striking of the Abbey
    clock to let people know, and the unannounced changes to procedure caused much
    confusion. Apart from the British Legion, few public bodies were represented at
    the war memorial, and the chairman of the urban council did not lay a wreath.


    ### Evictions and road deaths


    The callous attitude of some coalmine owners to their workers was sharply criticised
    by Mickley’s Councillor Ada Blackburn, after a number of families were evicted
    from colliery houses in the village without alternative accommodation being made
    available for them. She said it was ‘one of the great tragedies of the district’,
    and likened the plight of the displaced families to that of bombed out families
    in cities. She said several families had been split up, with mother, father and
    children from one family all living in separate temporary accommodation. She called
    on the Mickley Coal Company to repair a number of houses currently standing empty
    to ease the problem.

