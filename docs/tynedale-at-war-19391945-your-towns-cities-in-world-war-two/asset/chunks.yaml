    Stoker Charlton said: ‘The Spee concentrated its fire on the Exeter, but all three
    of us were peppering away at her and she had little chance of escape. We kept
    at her, rarely ceasing fire, despite having one gun turret put out of action,
    and having the main mast shot away, bringing down the wireless mast and aerial.
    The Spee’s shells burst all round us, spraying us with shrapnel, and our men on
    the upper deck were extremely fortunate to escape with only one dead and a few
    wounded.’


    Charlton had a lucky escape when an 11-inch shell passed through the compartment
    in which he was working without touching him, but he was kept busy for the remainder
    of the battle, repairing broken pipes and electric leads as the shells continued
    to rain down. ‘Eventually the firing ceased,’ he said, ‘and we all caught a glimpse
    of the battered hulk, once the pride of the German Navy, limping away on the dark
    horizon in the direction of Montevideo.’


    The British ships could not enter the waters of neutral Uruguay, but waited outside
    the three-mile limit for the `Graf Spee` to emerge, which she did – only to blow
    herself up rather than surrender.


    Three weeks later, when the `Ajax` returned to Montevideo on a courtesy visit,
    the hulk of the `Graf Spee` was still burning and the crew of the `Ajax` were
    guests of honour at a party thrown by the British community in the city. As well
    as the Uruguayan feast known as a `saadre`, where six sheep were barbecued and
    eaten with bare hands, the sailors also attended a dance when Stoker Charlton
    performed his first `Boomps a Daisy`.


    On his return to Fourstones, Stoker Charlton was presented with an inscribed stainless
    steel watch by the Fourstones Parcels Fund at a ceremony in Newbrough Town Hall.


    Another South Tyne stoker, Joseph Charlton Wylie, from Haydon Bridge told the
    `Courant` of his encounter with the so-called German hell-ship the `Altmark`,
    a tanker aboard which British prisoners of war from ships sunk by the `Graf Spee`
    were being held in appalling conditions. He was serving on `HMS Ivanhoe` when
    they came across the `Altmark` in Norwegian waters and a warning shot was fired
    across her bows.


    ![Image](images/f0034-01.jpg)


    First class Stoker Joseph Charlton Wylie of Haydon Bridge who was aboard `HMS
    Ivanhoe` for the pursuit of the so-called German hell ship, the `Altmark`.


    He said: ‘The `Altmark` ignored the warning, so we closed in on her, and were
    just a few yards away ready to jump aboard, when a Norwegian torpedo boat intervened
    and protested we were in Norwegian waters. The Nazi skipper took advantage of
    the opportunity offered him and turned sharply to enter a fjord. There was not
    the slightest sign of any Britishers aboard, and after the intervention of the
    neutral captain, the German skipper strutted around his bridge, cigarette in his
    mouth.’


    The `Ivanhoe` was left powerless, but under cover of darkness `HMS Cossack` returned
    to the fjord and her crew boarded the `Altmark` and freed more than 300 prisoners.


    On the home front there was a drive for salvage to help the war effort, when Hexham
    Urban District Council agreed to scrap its old fire engine; among items handed
    in by the public were two German machine guns salvaged from the last war, which
    were sold for five guineas.


    The lighter nights of early summer also brought a warning from the police about
    ‘marked slackness’ in the observation of blackout regulations, particularly in
    business premises. Meanwhile, the Rector of St John Lee Church at Acomb, the Rev.
    W.H.S. Wood, said the decision to hold services in the afternoon to meet the exigencies
    of the blackout regulations had been a complete failure, so the church windows
    would be darkened should the war go on until the next winter.


    At Haydon Bridge, the parish council wrote to Hexham RDC demanding that an air
    raid siren be provided for the village, for although more than 100 men and women
    had signed up for `ARP` duties, there was no way of summoning them to their posts
    in the event of an air raid.


    Two Newcastle men out for a jaunt in the country by motorcycle stopped to take
    a picture – and found themselves before Hexham Magistrates. For in the background
    of the shot was a wireless mast and taking pictures of such facilities without
    a written permit from the Secretary of State for War was forbidden under the Emergency
    Powers Defence Regulations (Control of Photographs Order No.1). The two men said
    they had given no thought to what might be in the background of their photographs,
    but they were both fined £1, with 9s costs. Chairman of the bench Sir Loftus Bates
    accepted there had been no ulterior motive behind the men’s actions, but said
    they had been very careless and could have been fined £100.


    ## CHAPTER TWO


    ## Tynedale Braced for Invasion


    With abrupt suddenness, the ‘Phoney War’ ended in the late spring of 1940, with
    Hitler’s `Panzer` divisions rolling irresistibly across Europe. The creation of
    a Government of National Unity in May 1940, with Winston Churchill succeeding
    Neville Chamberlain as Prime Minister, was warmly welcomed by the `Courant`, with
    editor Teddy Taylor saying in his leading article:


    ‘In the hour in which Hitler has struck on the battlefield, the nation has received
    a much needed tonic on the Home Front. As Neville Chamberlain said to us over
    the wireless last Friday, if Hitler had counted on our internal divisions to help
    him, he has miscalculated the mind of this people. The one thing needed to close
    the ranks and gird our loins for the great struggle now upon us, was this call
    to battle. In the true Churchillian manner, our new Prime Minister has summed
    up the issue for us. Through blood, toil, tears and sweat lies victory for our
    army. Winston Churchill’s spirit is indomable. No man of his time has suffered
    the slings and arrows of fortune, and no man more than he has courage fought back
    to victory. In him today we see the personification of every quality the British
    race possesses which time and again have wrested victory against overwhelming
    odds. Now is the time to spread his energy and driving force into every branch
    of our endeavour.


    The red tape which has been enmeshing our war effort for the past nine months
    must be cut. Sacrifice of leisure, of convenience and of consideration of profit
    must be made to meet the insistent call from the battlefield. If the Churchill
    spirit dominates our every act, the saving of the lives of our men in the fighting
    forces will be our immediate gain, and the overthrowing of bestial Nazidom the
    ultimate end. In the dark days which must inevitably lie before us. As the present
    conflict increases its fury, let us all remember the courageous spirit of our
    leader, and draw from it inspiration to inform our every act, and serve our purpose,
    until victory is finally assured.’


    The new-look Government was not the only change – for the first time in its 76-year
    history, the Hexham `Courant`’s front page was not filled with advertisements
    for the likes of Nostroline catarrh remover from Gibson’s the chemists, Old Mother
    Riley at the Rio in Prudhoe, or someone to adopt a 10-month-old baby girl.


    As part of the war effort, the small ads were swept off page one to make way for
    news of the war. A notice from the editor explained that the changeover was to
    meet the exigencies of newspaper production in wartime. He assured the readers:
    ‘The changeover will in no way affect the character of the paper, which will continue
    to give a full and complete local news service together with popular regular features.
    The new make-up will no doubt be unfamiliar to readers at first, but we feel sure
    that the decision to print the principal local news of the week on the front page
    will help readers, and the changeover will be welcomed by them.’

