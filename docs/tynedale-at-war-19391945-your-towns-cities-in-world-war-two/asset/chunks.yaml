    几乎所有人都超过了目标，一种乐观的情绪开始渗透到该地区的日常生活。他们同意储蓄将继续进行，因为“向士兵致敬”（Salute the Soldier）的现金刚存入，一项新的募捐活动便启动，旨在于六个月内筹集资金替换丢失的同名“泰德代号”（HMS
    Tynedale）巡卫舰。然而，海军部拒绝了这一提议，指出无法根据当地储蓄活动来命名海军舰。船只只能按照预先安排的方案命名。


    生活仍在继续，来自海德登桥（Haydon Bridge）的 31 岁女性多萝丝·查尔顿（Dorothy Charlton）因拒绝担任速记打字员而被入狱两个，因为这与她作为耶和华见人的信仰相冲突。`Hexham`法庭主席`J.M.
    Heslop`表示，查尔顿的立场是“对法律的公然蔑视”。


    来自奥伦代尔（Allendale）的 22 岁画家兼装潢工罗塞尔·亚历山大（Russell Alexander）被处三个月苦徒刑，因为他拒绝履行`国家兵役局`要求的农业劳工工作。他此前因拒绝接受体检已服刑了一年，但亚历山大表示他是一个和平主义者，拒绝参与任何战争努力。


    一名`皇家陆军军械团`（Royal Army Ordnance Corps）的士兵兵因驾驶军车危及公共安全被罚款`10s`，并因醉酒驾车被额外罚款`£1`。36
    岁的约翰·菲利普·梅特尔菲（John Philip Metcalfe）被目击在`Acomb`以超速驾驶一辆休假车，行驶在道路错误的一侧，轮子掉进了沟里。他在沟里行驶了
    60 码后撞上了一根电线杆，电线杆被折断成两段，然后冲上了土堤。车辆随后转向道路另一侧，撞穿了一个花园栅栏并停下，车上挂满了电线和断裂的栅栏碎片。


    栅栏的主人出来向梅特尔菲抗议，梅特尔菲拒绝下车，但他将车倒回路上，然后以疯狂的速度朝向赫克斯姆（Hexham）出发，身体左右摇晃。当他没能转过圣约翰李（St
    John Lee）角的弯并撞穿栅栏进入田地时，行程结束了，他在田里耕了 60 码后最终停下。当他试图下车时，摔倒在地，显然已完全醉醉。


    律师`约翰·巴蒂`（John Baty）在法庭代表梅特尔菲发言，称他不习惯喝酒，这种状态是由于“过度款待”造成的。他所属部队的一名军官告诉法庭，按照他的薪水，梅特尔菲买不起他显然已经喝掉那么多酒。


    `诺森伯兰郡巡回法庭`（Northumberland Quarter Sessions）听到了一个在伦敦轰炸（London Blitz）中失去妻子和两个孩子的故事，他发现自己身处卡顿（Catton），在那里一位慷慨寡妇提供了免费食宿。无固定住所的劳工亚瑟·华特顿（Arthur
    Wharton，54 岁）通过偷走一只金表、一个银烟盒和其他总总价值`£30`的物品来对她的善意报答。他被判处四年苦役监。


    `贝灵汉欢迎回家基金`（Belling Welcome Home Fund）的首位奖励获得者是`西福斯高地团`（Seaforth Highlanders）的
    19 岁下士詹姆斯·戴利（Corporal James Daley），因在意大利战斗中的英勇表现被授予了军事勋章（Military Medal）。在一段激烈战斗期间，他通过消灭两个德国机枪阵地拯救了许多生命。他在两次受伤后曾多次住院。该基金在市政厅的一个仪式上向他颁发了一张`£30`的支票，还有另一一张来自他加入部队之前的贝灵汉（Bellingham）民兵队（Home
    Guard）公司的支票。颁奖结束后，在“黑牛酒馆”（Black Bull Inn）举行了派对，他在那里与母亲和继父一起生活。


    ![Image](img/f0160-01.jpg)


    来自贝灵汉的 19 岁下士詹姆斯·戴利（Corporal James Daley）因在意大利的英勇表现被授予军事勋章，他在那里消灭了两个机枪阵地。他两次受伤并在医院治疗。


    据称，一名来自沃尔（Wall）的士兵得益于新的血浆输液技术。N·克雷格士兵（Trooper N. Craig）在意大利安齐奥（Anzio）所在的战壕由于被德国`88mm`炮弹直接命中，失去了双腿。当他被抬进伤员站时，正处于严重的失血和休克状态，但在急救血浆输液后，他奇迹地恢复了。十天内，他就好到可以被担架抬出医院去看足球比赛。


    ### 哈尔特威斯尔的勒索


    哈尔特威斯尔（Haltwhistle）揭露了一个大骗局，当时对驻在该地区的一支军队的仓库进行抽查时，发现大量物品丢失。结果，16 名当地人被传到治安法官面前，被指控非法持有持有从军装、毯子到带床垫的铁床的所有物品，这些物品均属于英国战争部（HM
    War Department）。


    警察总监威廉·古德菲尔洛（William Goodfellow）告诉镇上的法官：“哈尔特威斯尔的军用物资买卖中发生了可以被称为正当勾当的行为，而且已经持续了相当长的时间。”


    当一个位于哈尔特威斯尔地区的陆军搬迁时，在对基地仓库进行审计时发现了巨大的差异，这种勒索行为因此曝光。很快证实，哈尔特威斯尔的人购买他们需要的任何物品是常有的。搜查令获得后，从不同家中追回的物品包括军毯、衬子、毛巾、毛衣、马术靴、卡其军服、大外套，甚至一套床和床垫。法庭还展示了由军毯制成的妇女和儿童大衣。


    16 人（8 名男性和 8 名女性）出庭，其中 15 人承认收受赃物，法庭主席 J.R·布莱克特宣布了总计`£62`的罚款，他表示法官对政府财产的批发盗窃非常严肃，并决定停止这种行为。


    在随后的法庭上，又有四名来自哈尔特威斯尔地区的平民被定罪持有包括靴子、衬子、衬子和大外套在内的军队财产。负责此案的警探斯科特（Detective Constable
    Scott）和警员哈利戴（PC Halliday）因在破获复杂的批发盗窃案中的勤勉工作受到法庭表扬。


    在教堂院钟声的预热下，赫克斯姆（Hexham）第二个“家庭假期周”见证了 13 岁的贝蒂·安布勒（Betty Ambler，她的父母在福街（Fore Street）经营阳光酒馆（Sun
    Inn））在教堂院广场的一个仪式上被加冕为皇后，随后是由诺森伯兰乐队联盟（Northumberland Band League）组织的乐队比赛。


    圣威尔弗德学院（St Wilfrid’s Institute）的兔子展吸引了 134 份参赛作品，其他活动还包括第二哈克斯姆女童军团（2nd Hexham
    Girl Guides）的剑舞表演和第三哈克斯姆长老会童子军团（3rd Hexham Presbyterian Scout Troop）的体操表演，以及一场滑稽芭蕾。还有由赫克斯姆民兵举办的婴儿展和步行比赛，路线横跨于迪尔斯顿（Dilston）、科布里奇（Corbridge）和博弗朗特（Beaufront）之间，冠军是来自惠特莱尔教堂（Whitley
    Chapel）民兵队的 18 岁民兵乔治·埃利奥特（George Elliott），他在 90 分钟内比赛击败了 47 名其他竞争者。


    在女王厅（Queen’s Hall）举办的假期舞会吸引了 500 多人参加，听着乔斯·Q·阿金森（Jos Q. Atkinson）及其乐队的音乐跳舞。在体育方面，还有六人制足球和橄榄球七人赛，以及由驻当地的美军在教堂院广场提供的新奇棒球表演，并有解说向困惑的当地人解释到底发生了什么。'
