    # 那个历史性的头版上的主要故事之一，是关于纳粹伞兵会堕落到何种地步的警告。读者们被告知，一个卑鄙的“匈奴”使用一个气胶降落伞降落在比利时，不仅带了机枪，还带了一个挤奶凳。着陆后，他冲向最近的一头牛并开始挤奶，但他那德意志人的诡计并未欺骗过当地人，反而被他们俘了。


    此外还有呼吁更多防空民兵（ARP）志愿者，以及请求援助医疗物资。读者被警告，糖的配额将从每人每周 12 盎司减至每人 8 盎司。不过，对于用自己花园种的水果制作果酱的人，有特殊的优惠政策。赫克斯姆市委员会要求
    11.5 吨制作果酱用的糖，而贝林汉地区议会则想要 19 吨。


    然而，日常生活仍在继续，报纸上最大的两个案件是：两名普鲁德霍的农民因稀释牛奶分别被罚款 4 英镑和 5 英镑；以及一对米克利的夫妇因疏忽略儿童被入狱。他们甚至不确定自己是有十三个还是十四个孩子。


    ![Image](img/f0038-01.jpg)


    1940 年 5 月 25 日，《赫克斯姆快报》在其 74 年的历史中首次在头版刊登了新闻而非广告。占据显眼位置是一项警告：要警惕携带挤奶凳作为掩护的纳粹伞兵。


    J.V.C. 法夸哈牧师于 1919 年至 1944 年间担任赫克斯姆的区长。1939 年敌对爆发时，他在修道院安装了扬声器系统，以便晨礼时的会众能听到内维尔·奇伯林宣布英德两国处于战争状态的洪亮嗓音。


    法夸哈先生非常担心燃烧弹摧毁修道院，因此他组织了一支睡在建筑内的火警队。他自己也许多晚上睡在深夜楼梯顶部的折叠床上。当地历史学家罗兰德·查尔顿（Rowland
    Charlton）是国民民卫队的一员，过去曾在市政厅（Moot Hall）执行值守任务。起初，国民民卫队被称为“地方防御志愿者”，简称`LDV`——查尔顿先生总是坚称这三个缩字母的意思其实是“看、躲、溜溜”（Look,
    Duck and Vanish）！


    ## 国民民卫队的事迹


    随着“假战争”的结束，`LDV`在赫克斯姆的活动加强，所有自愿服役的退伍军人都获得了装备，其中包括一套卡其工作服、一顶猎帽和一把步枪。超过 1000 人自愿，令他们非常失望的是，很快就清楚并非所有人都需要服役。指挥赫克斯姆小组的奥特伯恩阿奇巴尔德·怀特爵士（Sir
    Archibald White）中校表示，一切进展顺利，一旦各个分队练熟了射击，巡逻就会开始。他补充道：“我无法说会有多少志愿者被召集；这取决于我们允许获得多少套装备。但可以肯定，所需人数不会达到志愿者的总数。”


    各单位的负责人分别是：阿尼克的副小组指挥官查尔斯·贝克·霍恩比（Charles Beck Hornby）少校；赫克斯姆的格里德利·罗布（J. Ridley
    Robb）中校；贝林汉的 J.D.杰布（J.D. Jebb）准将以及贝文格顿的 H.S.贝尔（H.S. Bell）上校。


    雷德斯代尔的居民非常怀念西伍德德伯恩和里兹代尔国民民卫队的事迹。他们过去在柯尔克哈尔指挥官安德森少校的注视下，在全圣教堂后的田野进行每周一次的野外训练和阅兵。参与者包括罗伯特·泰特、托马斯·泰特、休·斯奈斯、吉姆·威尔逊、威利·罗布、杰克·布罗迪和哈里·康梅。他们最喜欢的训练之一是实弹手榴弹练习，志愿者们必须将手榴弹投过山顶并掉进方便的凹处以安全爆炸。


    ![Image](img/f0040-01.jpg)


    准备在德国人入侵时尽一份力量的赫克斯姆国民民卫队。


    ![Image](img/f0040-02.jpg)


    正在阅兵的沃克国民民卫队。


    不用说，在一次著名的场合，由于一个特别笨拙的新兵的手榴弹没飞过山顶，而是轻轻地滚回连队的其他人那里，他们惊恐地散开了开。


    在另一次训练中，连队被爬上伍德伯恩外的长坡到达采石场顶部，寻找敌方伞兵。同一个倒霉的新兵被任命为传令兵，被命令骑一辆沉重的自行车从村中心去采石场。他还没来得及喘气，就被士官命令骑那台机器骑回营部——也就是大家非常怀念的“狐狸与狗”（Fox
    and Hounds）酒吧。那个可怜的士兵咽了口口水拒绝了命令，当他脸紫的士官询问原因时，不得不回答道：“因为我不会骑该死的自行车，士官！”


    还有人记得那个所谓的德国入侵英东北部海岸的著名夜晚。指挥程序是：指挥官安德森少将将给位于卡菲顿（Capheaton）钟磨场的汤米·汤普森（Tommy Thompson）打电话，由汤普森再打给连队成员汤米·沃尔尔顿（Tommy
    Walton）。他会再打给下一个，以此类推，这样所有人都能收到警报。


    在疑似入侵的那个晚上，汤米·沃尔尔顿接到了安德森少校的电话，说怀疑有入侵。然而，少校无法联系上汤米·汤普森，请求沃尔尔顿先生开车去叫醒他。沃尔尔顿先生确实去了钟磨场，但尽管用力敲门并向窗户扔石头，还是没能醒汤普森。最后，沃尔尔顿回到车里回家睡觉了，也许德国决定不入侵反而是件好事。


    ![Image](img/f0042-01.jpg)


    埃迪·怀特（Eddie Waite）——他后来在 20 世纪 80 年代担任泰恩代尔议会（Tynedale Council）主席——位于左侧，右侧是哈罗德·罗布（Harold
    Robson）。中间是基思上尉（Captain Keith）。


    国民民卫队的训练在某些地区比其他地区更严肃，一个不幸的疏散者付出了代价才发现这一点，他不经意卷入了一场涉及汉绍（Humshaugh）和纽布鲁哈（Newbrough）部队的训练。该连由汉绍村学校校长爱德华·怀特（Edward
    Waite）经营，他将部下分为两组：他的一组是英国人，另一组由第一次世界大战诺森森郡冲击团军士长哈罗德·罗布（Harold Robson）领导，代表“敌人”。


    怀特在霍尔顿路（Haughton Road）为“德国人”设下伏击，但那个疏散者发现了怀特和他的士兵躲在油桶和灌木丛后，无意中告诉了罗布他看到的一切。狡猾的士长随后能够溜到怀特的士兵身边并俘获了所有人，这让校长大发雷霆。


    第二天在学校里，当疏散者们上早晨课时，怀特要求知道是谁泄露了伏击行动的消息，当那个年轻人承认是自己时，怀特的愤怒非常可怕。他训斥那个恐惧的小孩言言不慎会害害生命，并告诉他国民民卫队对内奸的简单方法——处决。


    随后，他派了另一个疏散者去那个孩子的家里取他的手枪和萨姆·布恩带，然后蒙住孩子的眼睛，问他是否还有遗言。


    在校长放手之前，那个孩子已经失禁了裤子。


    还有一个传说说，安德森少校决定在他的领地上隐藏了所有国民民卫队的弹药和爆炸品，以备入侵。不幸的是，这位老少校忘记了把它们埋在哪里了，据传从未被发现过。


    在科布里奇国民民卫队，劳伦斯·贝斯特（Laurence Best）14 岁时是军士长的跑腿。在他年过 80 多岁时，他回忆道：“有些小伙对待非常认真，这也许是好事，但我们有一个‘尴尬小组’（Awkward
    Squad），我是其中的荣誉成员——他们把这当成一个大笑话。”


