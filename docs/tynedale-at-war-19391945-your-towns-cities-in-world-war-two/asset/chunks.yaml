    return to Tynedale after many months on the run, hiding from the Nazis. Among
    them was Captain Kit Patterson, of the Royal Northumberland Fusiliers, who made
    a 250-mile trek back to Allied lines, which took nine and a half months. He was
    one a party of five who escaped; the other four were all recaptured. He was delayed
    by weather and lived on his wits in the hills, whilst being fed by Italian peasants,
    whom he found very friendly and helpful. The first thing he noticed on his return
    to Hexham was the fact that all the railings had disappeared from around buildings.


    ![Image](images/f0163-01.jpg)


    Sergeant John Oswald Nolan, of Henshaw, who used his ‘best Italian’ to trick Nazi
    troops after escaping from a prisoner of war camp.


    Another escapee was Sergeant John Nolan, of Henshaw, who was also at large for
    nine months, running the gauntlet of German patrols. On one occasion he was confronted
    by a party of German troops on bicycles, but he just waved his arms and jabbered
    at them in mock Italian and they allowed him to go on his way. After that he took
    care to keep away from main roads and head for freedom under the cover of hedges
    and woodland. Like Captain Patterson, he was looked after by locals, who shared
    their meagre food supplies with him. He worked for one Italian family who broke
    down and wept when he said he was heading for home. Having been held at prison
    camps in Tripoli, Brindisi and Macerata, he said the food in many Italian camps
    was very poor and had it not been for Red Cross food parcels, many British prisoners
    would not have survived.


    Sergeant Nolan was taken prisoner at Knightsbridge in 1942, but he had already
    seen action, being evacuated from Dunkirk, and was mentioned in despatches for
    gallantry at Arras for driving a truck full of men to safety under heavy fire.
    The fire was so fierce the truck tyres were blown off and he drove many miles
    on the wheel rims.


    ![Image](images/f0163-02.jpg)


    Former Acomb miner Sergeant Sidney Cooper who saved many lives when he picked
    up a case of burning bombs and made them safe at Cagny in France.


    There were more heroics from ex-Acomb miner Sergeant Sidney Cooper (32) serving
    with an armoured division at Caen, taking on crack German Panzer troops and a
    parachute division. During one sticky day at Cagny, a German 88mm landed five
    yards from his position, setting fire to the cordite from a pile of twenty mortar
    bombs. They could have exploded at any time, but the quick-thinking Sergeant Cooper
    ripped the cases off the burning bombs and shovelled a mound of earth over them
    to extinguish the flames. An officer told a military observer: ‘Sergeant Cooper’s
    actions saved valuable equipment and lives. It was one of the coolest, pluckiest
    jobs I have ever come across.’


    As the Allies raced across France, Trooper Robert MacFarlane of the Grapes Hotel
    in Hexham wrote to his parents of the welcome which they were being given by the
    French. He said: ‘We went into the outskirts of one village and we were surrounded
    by the inhabitants, who threw flowers and brought us wine, as we were the first
    British soldiers into the village. One old woman was crying with joy, so I jumped
    out of my tank to give her some chocolate and she kissed me and hugged me as though
    I were her own son.’


    Trooper Macfarlane was wounded soon after writing his letter and had been transferred
    to a military hospital in South Wales.


    In the air, the work of the rocket-firing Hawker Typhoon aircraft was described
    by Flight Lieutenant D. Murray, of Bingfield, who was involved in an attack on
    a factory on the south bank of the Rhine, near Arnhem, which was being used by
    the Germans as both a barracks and a strongpoint.


    He told the Courant: ‘It was a very big factory and two squadrons were put onto
    it, each section being given a particular part of the factory to demolish. The
    aiming was particularly good and each section sent its rockets bang on target
    so that by the time we had finished the whole factory was pretty thoroughly wrecked.
    The Huns ran out when the attacks began and our own troops potted them as they
    came out into the open.’


    Despite the fact the Home Guard was being gradually run down as the threat of
    invasion faded, there was no relaxation in the rules covering the service. Plashetts
    shepherd George William Robson told Bellingham Magistrates he had been left alone
    to manage a 1,000 acre farm, where he looked after 400 ewes and 300 lambs. He
    found it virtually impossible to attend Home Guard parades in Falstone, as a private
    in the 10th Battalion Northumberland Home Guard, and had not been to a parade
    for two years. Nevertheless he was found guilty of being absent without leave
    and was fined £6.


    Speaking after the case, the officer commanding the 4th Battalion Northumberland
    Home Guard, Lieutenant Colonel J. Ridley Robb likened the position of the Home
    Guard in late 1944 to that of a goalkeeper in a football team. Addressing a crowd
    of 500 people at a Home Guard sports day at Corbridge, he said: ‘The Home Guard
    had a very active time when the other side was pressing, and now they are on the
    winning side, it would be tempting for a goalkeeper to lean on a goalpost, but
    they have to be very aware of the possibility of a fast forward on the opposing
    side breaking through. The Home Guard, like the goalkeeper, must remain alert
    until the final whistle blows.’


    ![Image](images/f0165-01.jpg)


    Pictured at a Red Cross garden fete at Corbridge which raised £200 are (from left)
    Mrs R.D. Glass, who hosted the event at Howden Close, Viscountess Brackley who
    opened it, Mrs Dickinson of Styford Hall, who presided over the occasion, and
    Northumberland County Red Cross director Miss M.M. Williamson.


    The final whistle did come on 19 November, when to the rousing strains of the
    Blaydon Races, played by the band of the Royal Northumberland Fusiliers, the 4th
    Battalion Northumberland Home Guard staged their farewell parade in Priestpopple,
    Hexham.


    A total of 1,200 men, representing companies from over the district, proudly marched
    past the saluting dais in front of the Tindale Ward Savings Bank, and were told
    by the man taking the salute, Colonel A.E. Hawkins, Northumberland Sub District
    Commander of the Home Guard, that one of the reasons Hitler had not carried through
    his invasion plans in the dark days of 1940 was that he knew that in addition
    to regular forces, he would have the two million men of the Home Guard to overcome
    as well.


    ![Image](images/f0166-01.jpg)


    One of the key leaders in the Far Eastern campaign was the future Chief of the
    Imperial General Staff, Field Marshal Sir Francis Festing, better known as ‘Front
    Line Frankie’.


    ### Sir Francis Festing, a natural born leader'
