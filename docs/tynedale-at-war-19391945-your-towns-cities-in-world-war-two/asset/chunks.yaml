    The stars had been appearing in The Hulberts Follies in Newcastle and, despite
    their strenuous schedule, agreed to give up their Sunday afternoon in the name
    of friendship. The use of the theatre was given free by the `Hexham Entertainments
    Company` and all profits went to local war charities. They were supported by the
    `Jesmond Jesters`, whose antics had been popular with troops since the Great War.


    The stars were in their brightest and merriest mood, and received a prolonged
    ovation from the delighted crowd. Speaking from the stage at his curtain call,
    Jack said: ‘It’s grand to have been able to come out to Hexham this afternoon,
    and we have loved every minute of it.’ The ticket sales to non-service members
    of the audience amounted to £52 19s which was split by the `Hexham Group Hospital
    Supply depot`, the `Hexham branch` of the `British Red Cross` and the `Hexham
    Aid Society`.


    The importance to Hexham of its 1300-year-old Abbey was called into question when
    an appeal for volunteers to act as firewatchers attracted only a handful of names,
    to the great displeasure of the rector, the Rev. J.V.C. Farquhar. Only ten volunteers
    had come forward, despite a number of appeals. He said: ‘It’s not just a matter
    for the church authorities, it is up to the whole parish and the townspeople.
    We all ought to do our best in guarding the Abbey for in doing so, we are guarding
    our own homes. It is something which concerns the whole town.’


    Sidesman George Reah said that it was ‘a disgrace’ that out of a town with a population
    of 10,000 only ten could be found to safeguard its most notable building.


    At the `Hexham Police Court`, a local sailor was remanded in custody to await
    military escort after being absent from his ship without leave. Assistant cook
    Benjamin Jameson claimed he had returned to where his ship had been berthed, but
    it wasn’t there, so he decided to come home. In another hearing, Glaswegian James
    Townsley (25) was sentenced to six months’ hard labour for stealing property from
    `Allerwash Farm`, Newbrough, where he had been allowed to sleep in a barn with
    a 19-year-old female companion. It transpired he was a deserter from the `Cameron
    Highlanders`, who had been on the run for three months, and he was told by chairman
    of the bench John Charlton: ‘You are a disgrace to Scotland. You are a deserter
    from the Army, and you go about the country living a life of thieving.’


    There was also a place in history for Francis Volante, who was brought before
    `Hexham Magistrates` for being drunk and disorderly in Fore Street in the town,
    where he was singing at the top of his voice and using obscene language. When
    asked to be quiet, he became abusive and was arrested. Police Superintendent William
    Goodfellow said he regretted having to prefer the charge, as it was the first
    against any member of the armed forces in the `Hexham division` since the war
    started. By spoiling that record, Volante had not only brought disgrace upon himself,
    but on all the troops stationed in the district.


    Wounded soldiers and nurses joined forces to fight a fire which broke out in the
    `Emergency Hospital` at Hexham in February. A nurse and a soldier saw smoke coming
    from a bathroom. The fire had started in a boiler room, broken through into the
    bathroom and had travelled along the roof space above a ward where wounded soldiers
    were lying. The ward was evacuated and convalescing soldiers, nurses and hospital
    workers tackled the flames with stirrup pumps and chemical extinguishers, until
    the hospital’s own fire brigade took over. Three hoses were in play when the town
    fire brigade arrived, and the fire was extinguished. The bathroom was gutted and,
    apart from the damage to the roof, a quantity of bedding was destroyed.


    People who were not doing their bit for the war effort were given a tongue lashing
    by old soldier Brigadier General E.P.A. Riddell at the opening of a `YMCA canteen`
    at Riding Mill, when he called them ‘parasitical individuals’. He declared the
    nation had no use for those who would not play their part in the war effort, and
    added: ‘There is a niche for everyone and those who say they cannot serve because
    they don’t know where to go simply have not bothered to look. We all have to fight
    and serve if we are to beat the Nazis and the Fascists. We have given the Italians
    something to think about, and now have to get on with the job of thrashing the
    Germans.’


    One person who was doing his bit was Robert Baty (30), a former `Hexham Scoutmaster`,
    who was awarded the `George Medal` for his bravery during the Blitz in London.
    Working as a full time `ARP warden`, he and a colleague, `J.B. Milne`, scaled
    a lead water pipe to climb into the third storey of a house which had been hit
    by a bomb, as other bombs rained down from the bombers still circling and flames
    from a ruptured gas main roared close to them. They searched the property for
    two hours, knowing that three people were believed to be inside, and a woman found
    alive in the debris was lowered to the ground via a rope made of knotted sheets
    and taken to hospital.


    ![Image](images/f0076-01.jpg)


    Former `Hexham Scoutmaster` Robert Baty (30) was awarded the `George Medal` for
    heroism while working as an `ARP warden` in Westminster in the London Blitz.


    Before moving to London, Mr Baty had been stage manager with `Hexham Amateur Stage
    Society` and went to London to work as a theatrical engineer with a particular
    interest in lighting. Among those he worked for were the renowned producer C.B.
    Cochran and the noted actress Nancy Price.


    ### A ‘Robinson Crusoe’ experience


    There was real life drama for Merchant Navy gunner Eric Rowlands (23) from Bardon
    Mill, whose first trip aboard ship ended in disaster when the vessel was torpedoed
    and sank – and he finished up living the life of Robinson Crusoe. He told the
    Courant: ‘I felt the ship shudder and immediately start to list to port, and it
    seemed as though she would turn turtle. I grabbed a packet with a couple of cigarettes
    in it, and I was almost swept away when I got on deck.’


    He managed to get into a lifeboat and was aware of the possibility of being sucked
    under the water when the ship sank. That didn’t happen, but the survivors were
    sprayed with machine bullets, he believed by the crew of the U-boat which had
    sunk the ship. They survived, and then fell in another lifeboat from a Dutch merchantman
    which had suffered a similar fate. The boat was only 20ft long and crammed with
    so many men it was impossible to lie down. Not knowing how long they would be
    adrift in the high seas, survivors were restricted to two dippers of water – about
    wine glassfuls – two ship’s biscuits, a little corned beef and condensed milk
    per day.


    Mr Rowlands said: ‘I quite enjoyed the sailing during the day, but at night it
    was terrible. You couldn’t lie down and it was bitterly cold, and I was only wearing
    my jacket and a pair of gunners’ trousers.’


    After two days in the open boat, they spotted an island, but could not find a
    suitable landing ground. After another night at sea, they made the decision to
    beach the craft, but hit a rock on the way in and the lifeboat was smashed to
    pieces. They somehow managed to scramble ashore, salvaging what stores they could
    and after making a meal, they slept ashore for the first time in four nights.


    The next day they went exploring and came across a village of small windowless
    clay houses with straw roofs, with goats and pigs wandering inside and outside
    the houses. The natives emerged, giving them a warm welcome and feeding them with
    coffee and fruit. The women went to their landing site and brought their possessions
    to the village, balanced on their heads. They spent a couple of days in the village,
    before taking a 20-mile donkey ride to the capital of the group of islands on
    which they were marooned, to catch a steamboat that had been sent to pick them
    up.

