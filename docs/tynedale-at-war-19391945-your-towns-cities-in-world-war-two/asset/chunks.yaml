    In Burma too, Tynedale men were making their presence felt to great effect, none
    more so than Major General Francis W. Festing of Humshaugh, who was cutting a
    swathe through the army which ended with his appointment as Field Marshal Sir
    Francis Festing – Chief of the Imperial General Staff during the late 1950s.


    His huge ash walking stick symbolised the burning spirit of a man who was a giant
    in the military arena. During the war he chased a Japanese sniper with it, and
    thirty years later he shook it in the North Tyne valley in protest at the plans
    to build Kielder Reservoir. The walking stick was even mentioned in a citation
    for a Distinguished Service Order he earned in Madagascar in 1942.


    At 6ft 4in with ginger hair and all the sartorial elegance of an unmade bed, he
    had an arresting appearance, but it was the indefinable aura of a natural born
    leader that really distinguished him from the crowd. With field marshals Montgomery
    and Slim, Festing formed the triumvirate of Britain’s best three wartime generals.
    While not an intellectual, he was highly intelligent; he was noted – perhaps his
    efficient chief of staff would have used the word ‘notorious’ – for reading the
    bare minimum in paperwork and books he could get away with.


    He wasn’t interested in details, but he was an arch strategist; his reputation
    was sealed during the Second World War when, at the head of the 36th Division
    of the 14th Army, his skilful tactics were largely responsible for driving the
    Japanese out of Burma. And although he didn’t like politics, civil servants or
    committee meetings, he could be the most subtle of diplomats when necessary. A
    complex character embracing many a contradiction, but to the troops on the ground,
    he was the most straightforward of men. Brave and resolute, he was known universally
    as Front Line Frankie, prepared to send his men only where he himself would go;
    he always led from the front.


    Used to being in the heart of the world’s trouble spots and something of a nomad,
    he made his final home in far from anywhere Tynedale. The connection was his wife,
    Mary Cecilia Riddell, of Swinburne Castle and estate. The couple were married
    in the Riddells’ private chapel in 1937, when he was 35. Seven years later, determined
    to establish a base for their growing brood amid a globe-trotting existence, the
    couple bought a large country house in Tarset, not far from her family seat. They
    returned to it time and again over the years, until eventually they settled there
    permanently following Sir Francis’s retirement.


    While Sir Francis himself hailed from an Oxfordshire family, he was actually born
    in Dublin in August 1902. The only child of Brigadier General Francis Leycester
    Festing and his wife, Charlotte; his father was serving in Dublin at the time.
    Despite being the scion of a long line of army generals, Sir Francis, like his
    father before him, eschewed the usual military schools. They both attended Winchester
    College instead.


    From a staunchly Protestant background, he converted to Catholicism as a precocious
    16-year-old, largely due to the influence of his paternal aunt. Eccentric Aunt
    Eleanor, or Nello as she was affectionately known, lived most of her adult life
    in the Basque region of Spain. She would appear vision-like in the streets of
    St Jean de Luz, zipping by on a bicycle powered by a tiny motor, dressed in the
    flowing black garb of a French peasant woman.


    Devout throughout his days, Sir Francis owed not only his religion to Aunt Nello,
    but the fact he was bilingual, too. As a boy he spent most of his school holidays
    with her, so she employed a French tutor who endowed him with a major advantage
    during his time at Supreme Headquarters Allied Powers Europe.


    His happiest, most carefree years proved to be the period he spent in the Rifle
    Brigade, which he joined as a young officer straight out of Sandhurst Military
    College in 1921. There were plenty of opportunities to indulge in his hobbies
    of fencing, hunting, point-to-point and sailing. As an accomplished yachtsman,
    he took part in the trans-Atlantic Bermuda Race in 1932.


    After many years of frustratingly slow progress through the ranks, Sir Francis
    finally came into his own at the outbreak of the Second World War, when he took
    over command of the 2nd Battalion of the East Lancashire Regiment. He was endowed
    with a natural manner and an infectious grin and won the trust and respect of
    his men as he led them through skirmish and battle in France, Norway and then
    Madagascar. In Burma, he took over on the ground when the commanding officer of
    the unit leading the push was killed – he was described as being ‘indifferent
    to danger’.


    A man ideally suited in temperament and ability to military action, the end of
    the war left Whitehall mandarins wondering what to do with their prizefighter.
    His subsequent posting to the War Office as director of weapons and development
    wasn’t the answer. He was a man of the people, not cold hardware, so in 1949 he
    was sent to Hong Kong to become general in charge of a unified command of all
    sea, land and air forces. However, the posting was dramatically cut short later
    that year when, aged 47, he was nearly killed by a blood clot in his brain. A
    horrified witness recounted seeing the lion tamed, as soldiers loaded him on to
    a Dakota, strapped to a stretcher with a doctor and nurse hovering over him. Mary,
    who was expecting their fourth child at the time, wrote that he had taken just
    ten days’ leave during the previous decade. He needed a good, long break, she
    told Whitehall.


    King George VI was one of the many who sent their best wishes to Sir Francis,
    who, after several relaxing months, made a full recovery. On his return to duty,
    he spent a short interlude as president of Britain’s Regular Commissions, a platform
    he used to lobby for the end of National Service. The only basis for an advanced
    fighting force fit for the 1950s was voluntary enlistment, he said.


    A series of postings in the years that followed took him back to mainland Europe,
    Egypt and the Far East, and by the end of the decade, he held the post of chief
    of the General Staff and the rank of field marshal. In 1961, the war horse retired
    and settled into a peaceable existence in his remote corner of Tynedale.


    He took with him his renowned collection of Japanese swords, assembled during
    his postings in the Far East. Legend has it that he always hoped he would be burgled,
    so he could try them out. As many of them were lethal, his family were thankful
    he was never given the opportunity. Sir Francis died at home on 3 August 1976.
    By then, the many titles he held included Commander of the Order of the Empire,
    Knight Commander of the Order of the British Empire, and Knight Grand Cross of
    the Order of the Bath.


    ### In action at Arnhem


    Although they were on the retreat, the Germans were far from finished, as they
    demonstrated with their strong resistance to the attack on Arnhem in Holland.
    What was supposed to be a relatively easy exercise proved anything but, as men
    of the 9th SS and 10th SS Panzer divisions gave the invading British paratroop
    and glider divisions such a bloody nose they were driven back in full retreat
    after nine days of fierce fighting.


    ![Image](images/f0169-01.jpg)


    Bombardier Leslie O’Neill of Hexham, who described the Arnhem airborne raid in
    1944 as ‘like Hell let loose’.


    Among those in action at Arnhem was Bombardier Leslie O’Neill (20) of Hexham who
    had been with the Airborne Division in North Africa and Italy. He told the Courant:
    ‘We had a rather rough time and were very lucky to get out. We were plastered
    with mortar and shellfire, and the worst thing about it was the Germans shelled
    the woods, so the trees crashed and splintered about us. It was like hell let
    loose.’

