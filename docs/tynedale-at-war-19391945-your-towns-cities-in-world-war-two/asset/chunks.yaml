    ‘Conditions in Singapore were grim. There was a woeful lack of food and we used
    to exist by feeding from the hedgerows and pulverising grass to extract vitamins
    and moisture to quench our raging thirst. We used to live on stuff which would
    normally be regarded as pigswill. The Japanese ate well and the stuff they put
    out for swill was considerably better than what we were given to eat. The officers
    were made to do the work of horses. They would be banded together into teams of
    twenty, to pull trucks, and had to dig out trees and collect their own firewood.’


    In the camp hospital, the British doctors and surgeons did magnificent work, despite
    being deprived of medical supplies by their captors and left without bandages,
    serums and vaccines.


    Captain Bewick said the Japanese could never understand how they failed to break
    the British spirit, with their cruelty and inhumane treatment, with their prisoners
    generally sharing a laugh at the end of the day. The camp was never without radio
    communication, via three wireless sets, none of which the Japanese guards ever
    found.


    Also back home was Hexham’s Fusilier Ian Weir, of the Royal Northumberland Fusiliers,
    who was also captured in Singapore, and sent to work at the notorious Changi prison
    camp, and then Keppel Harbour where he worked on the docks for six months. He
    said:


    ![Image](images/f0183-01.jpg)


    Japanese prisoner of war Fusilier Ian Weir from Hexham, who used his letters from
    home as cigarette papers to smoke weeds in the absence of tobacco.


    ‘We had to exist on Jap rations, which were just rice with a little vegetable
    water. And we sometimes had to work thirty-six hours on just one meal. In some
    camps, we were not allowed to talk and just had to sit on our beds. We often got
    up in the dark to go to work and were still working past nightfall. Conditions
    in the jungle camps were terrible, but the spirit of everyone was wonderful. The
    Japs could never understand it. They did all kinds of things to undermine that
    spirit, from cancelling concerts and preventing us from having entertainment,
    but it never succeeded in getting us down.’


    During his incarceration, Fusilier Weir received eighty-four letters from home
    but did not keep any of them; he used the paper to fashion homemade cigarettes,
    filled with weeds.


    Another prisoner back home in Corbridge was Major Alan H. McQueen, of the Royal
    Artillery after being held in a prison camp in Thailand following his capture
    in Singapore. He spent much of his captivity working on the construction of a
    railway. The prisoners lived in squalor, with no clothes to replace the ones in
    which they were captured, they had to make their own from sacks. Food was not
    a problem however, with the camp canteen selling a cup of hot water for five cents,
    or a duck egg for anything from five to fifty cents. Meat was plentiful, usually
    in the form of duck with lots of rice, and the prisoners were able to grow lettuce,
    tomatoes and spring onions in plots they had made themselves.


    On the home front, there was a crisis at the Emergency Hospital in Hexham as men
    who had served with the forces were demobilised, and their wives who had been
    working as nurses at the hospital during hostilities handed in their notice to
    make homes for their menfolk. A total of twenty-one resignations, including eleven
    trained nurses, meant that two wards had to close.


    The fact that German prisoners of war were being allowed to sketch the historic
    bridge at Corbridge ruffled civic feathers at the parish council which lodged
    a formal complaint with the Chief Constable. The matter was raised by Edward Pigg,
    who said villagers were up in arms about the freedom allowed these men, who were
    supposed to be working on farms, not drawing pictures. The vicar, the Rev. M.M.
    Barlow said there had also been concerns that the PoWs had been going round Corbridge
    asking locals for tea and coffee.


    The parish council’s attitude infuriated Agnes Gilbey of Hallington, who said
    in a letter to the Courant she was disgusted by the absence of fair play in Corbridge,
    She said: ‘Parish councils should be uniting to clear the chaos caused by the
    war, rather than airing paltry protests about prisoners of war finding peace in
    our England by painting and enjoying our lovely village. Where is the British
    justice we pride ourselves on?’


    The postscript to the complaint was that in December of that year, the parish
    council was presented with a painting of the bridge executed by one of the PoWs,
    in a frame made by another prisoner and French polished by the commandant of the
    prisoner of war camp at Ponteland, Lieutenant Colonel R.F. Pitz to hang in the
    council chamber. Col Pitz explained that the men allowed to paint were known anti-Nazis
    and the creator of this picture was completely non-political. Colonel Pitz went
    on: ‘There are two views about prisoners of war, one of which is to exterminate
    them, but that is not the British way. We prefer to reeducate them, and this is
    what we are trying to do.’


    It was not evident three miles down the road at Hexham, where chairman of the
    council Councillor Joe Cullen was still ‘simmering with indignation’ after discovering
    all the first class accommodation on an express train from Newcastle to Carlisle
    had been allocated to German officers who were prisoners of war. Councillor Cullen
    said that business people who used the train had great difficulty in boarding
    because of the German presence, and added: ‘What was particularly annoying was
    the space allocated to them to stretch their elegant Teutonic limbs and the steps
    taken to ensure a high degree of comfort for their Germanic bodies. The British
    public often have to travel packed together like sardines. On this train, service
    personnel, business people and workmen, returning tired after a hard day’s work,
    had to stand in the corridor, or pack tightly into a compartment, so these German
    officers could enjoy de luxe travel.’


    ### The unique role of Camp 18


    While the war was over, the peace was still to be managed and Featherstone Castle
    was chosen to fulfil a key role in the immediate post war years. It started life
    in 1944, as a temporary garrison for American troops preparing for the D-Day landings
    in Normandy. With Operation Overlord under way, it was then used for a few months
    to house Italian prisoners-of-war. But as the Allies made their relentless advance
    into Germany, it was decided to give Featherstone a pivotal post-war role – and
    Camp 18 was born.


    It was chosen to house those German PoWs classified as the most dangerous. Senior
    Nazis, suspected of war crimes, were to be tried at Nuremburg. Others, according
    to their level of support for the Führer’s regime, were categorised into black,
    grey or white. It was decided Camp 18 would house ‘blacks’, who would be repatriated
    only after an intensive course of ‘denazification’ ensured they had cast aside
    any fascist tendencies.


    The most senior German to find himself at Featherstone was General Ferdinand Heim,
    former chief of the general staff of the Sixth Army, who commanded the Boulogne
    garrison when it was captured in 1944. Earlier in the war, on the Eastern front,
    he led an attack on Stalingrad in 1942. Joining him on the banks of the South
    Tyne were U-boat commanders, Wehrmacht officers, some of the Luftwaffe’s ace pilots
    and several Third Reich bureaucrats and diplomats, including senior ambassadors.


    The threat from the former enemy proved so low that the barbed wire perimeter
    fence at Featherstone was pulled down at the beginning of 1947. Many of the PoWs
    who spent time at Featherstone spent their days helping out at farms across Tynedale
    during the day. At night many of them studied and Camp 18 had all the hallmarks
    of a university campus, rather than a prison.

