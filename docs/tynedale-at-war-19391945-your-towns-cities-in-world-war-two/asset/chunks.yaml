    # 18 号营与费瑟斯顿公园


    18 号营与南威尔士的 186 号营一样，是英国最大的军官战俘营。其人数有时达到 4,000 多名军官战俘和多达 600 名德国勤务。四个营区（`A`到`D`）需要约
    200 间`huts`小屋来容纳这庞大的人口。除了居住区外，营地内还有一个剧院、图书馆、教堂、医疗中心、烘包店和一套原始的下水道系统。


    营地有自己的报纸——《泰恩河时代报》（`Die Zeit am Tyne`），共出版十七期，全部在《赫克斯姆快报》（`Hexham Courant`）办公室印刷并分发全英。随着遣返战俘工作的启动，最后一期于
    1948 年 3 月付印。


    ![Image](img/f0187-01.jpg)


    《泰恩河时代报》为泰恩代尔带来了德国风味，这是这是一份位于南泰恩河谷费瑟斯顿战俘营的报纸。


    营地开设了大学课程，由邻近纽卡斯尔和杜伦大学的学者授课，甚至接待过几次牛津学者的特殊访问。


    对于德国勤务人员，设有职业课程，为他们回国后的开启新事业做准备。营地聚集了他们那代最有天赋的德国音乐家和艺术家。这里有三个不同的管乐团，甚至还有一个木偶剧院，为英格兰北部的观众表演。该营地的文化声望之高，著名小提琴家雅胡迪·梅纽因（`Yehudi
    Menuhin`）在 1946 年至 1948 年间曾光顾费瑟斯顿。至于他为何在那些于美国和欧洲巡演以及与`柏林爱响乐团`合作的期间抽空来到哈尔特斯斯尔，是一个谜团。


    ## 通往哈尔特斯斯尔之路


    在《海峡岛占领评论》（`Channel Islands Occupation Review`）一书中，来自亚琛附近的埃舍魏勒的埃格尔伯特·霍珀（`Engelbert
    Hoppe`）描述了在泽西岛被俘并运往英国、在漫长的哈尔特斯斯尔之旅中的感受。在平稳的航行后，海峡岛的战俘在`南安普顿`登陆，从港口步行到达火车站。途中，他们遇到了波兰难民，这些人对着德国士兵大叫骂，甚至向他们扔石头。“在经历了所有可怕的经历和苦难后，谁能责怪他们呢？”埃格尔伯特问道，“然而，我记得英国卫兵阻止了这种行为并保护了他们的战俘，这给我们留下了深刻的印象。”


    埃格尔伯特没有忘记看到`维拉斯洛夫`军队（`Vlasov` army）成员时的感受，他们曾倒戈为德国人对抗斯大林，正被一名俄罗斯政治官指斥。“看着他们的脸上写满了恐惧、焦虑和恐恐，现在看来，他们意识到了即将发生的事情——从`赫尔`被运往`海参迪沃克`或其他西伯利亚港口遭受酷刑和处决，或者被遗弃在古拉格（`gulag`）饿死。”


    在连续三周除了卫兵外没见到任何人后，埃格尔伯特和同胞们被带往另一个火车站，那里将他们带往诺丁汉郡。他们抵达`哈尔特斯斯尔`，沿着`南泰恩河`走过一座桥，穿穿了埃格尔伯特描述的如诗般的偏远景观，四周是起伏的丘陵，牧着牛和羊。


    ## 营内生活


    由于有高大的铁丝网栅和地面上围着的厚厚铁圈，这座巨大的营地设有四个营区来安置战俘。在经历了严厉的点名仪式后，埃格尔伯特和其他军官被带往不同的营区和`尼森小屋`（`Nissen
    huts`），每间小屋居住多达 100 名战俘。第二天早上，他们看了关于德国和被占领东欧国家集中营的电影。这种情况持续了一多周。“这太残酷、太震惊了，几乎没有人愿意相信，”他说，“我们中有些人崩溃了，另一些人则喊道‘你们不停止这些该死的好莱坞假货吗？’但小屋里开始了讨论：‘如果这是真的，我们会怎么办？’”


    在最初的几周里，男人们食物匮乏，面临着严格的制度，但埃格尔伯特知道在小屋里无所事事毫无好处。小型学习小组已经开始，通过`红十字会`（`Red Cross`），为那些因征入军队而非参加考试而被赋予“战争成熟”的年轻战俘创办了一个成年课程。埃格尔伯特参加了这些课程之一，其课程标准等于德国文法学校的毕业年。“我们被告诉课程将持续一年，”他说，“我们开始时几乎没有书，在卫生纸上乱草笔记。”


    其他想工作的军官被允许担任农场工、园丁师和建筑工。


    ## 领导力与和解


    1945 年秋季，埃格尔伯特记得新一批战俘被带到了`18 号营`。无缘无故，他们的物品被没收，并被卫兵毒打，这些卫兵是`安德森军`（`Anders Army`）的波兰人。《赫克斯姆快报》上出现了愤怒的信件，几天后，一个由英国军官和`红十字会`代表组成的委员会出现了。案件被诉至法院，者受到惩罚，战俘的物品得到了恢复。埃格尔伯特说：“这次事件以及处理过程的正确性，即使在我们中极少数纳粹分子或军事主义者眼中也留下了如此深刻的印象，以至于他们以最高的尊重谈论此。”


    圣诞节前，费瑟斯顿公园收到了一个完美的礼物，那就是`维克斯斯中校`（`Lieutenant Colonel Vickers`）的到来。这位新营长曾在 1916
    年于法国作为一名受伤的英国军官当过战俘，并立即获得了费瑟斯顿数千名战俘的信任和尊重。他对男人们说：“第一次世界大战期间，我是战俘，并被像绅士一样对待。因此，我会这样对待你们。”


    次年，维克斯斯加入了`赫尔伯特·苏尔巴赫`（`Herbert Sulzbach`），他是一位来自德国的难民，被英国军队授予上尉军衔，后来成为战后时期英德和解的支柱。对纳粹复兴的担忧是毫无根据的。在被英国军队授予上尉军衔的德国难民赫尔伯特·苏尔巴赫的密切关注下，`18
    号营`的“和解”实验取得了巨大的成功。苏尔巴赫后来成为 1949 年成立的德意志联邦共和国发展中的领军人物，讽刺的是，许多从`18 号营`“毕业”的优秀学生也同样如此。


    他也是费瑟斯顿公园战俘中的领军人物，而最令埃格尔伯特震惊的是，他对那些将人分为不同小组的筛选小组（screening teams）的极度反感。“他不认为这符合`日内瓦公约`，”埃格尔伯特说，“这为成堆的谎言、歧视和不信任开启了大门。”


    ## 文化遗产


    在埃格尔伯特的书中，被称为“人性的骑士”，苏尔巴赫和维克斯斯成功地建立了管乐团、图书馆、学习小组，甚至一所大学。他们在 1946 年开放了营区，拆除了大卷铁丝网，并让巨大的哨塔楼倒塌。取而代之的是起了一道象征性的围栏，“以防止羊牛进入”。


    此后营地的情况日益好转。两个剧院工作坊已经成立，从学生时代起就对戏剧感兴趣的埃尔伯特加入了`泰恩河剧院`（`Theatre on Tyne`）的剧组并进行了多次演出。剧院有专业的制片人和一两个专业演员，但真正的难关出现在决定女主角时！“在这个过程中充满了乐趣，尽管我们很清楚自己要担负`老维多利亚剧院`（`Old
    Vic`）的传统，”埃格尔伯特说，“我们的表演非常成功，我们开始从`纽卡斯尔`到`卡莱斯尔`的各地巡演，在许多营地，也面向英国观众表演。”


