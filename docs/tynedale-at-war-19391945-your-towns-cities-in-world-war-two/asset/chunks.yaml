    The girl also went on a shopping trip in Newcastle, where she ordered a dance
    dress for 14 guineas and an evening coat for 10 guineas, offering a 10s deposit,
    which was refused.


    ## Monty’s success and local heroes


    While Lieutenant General Bernard Montgomery’s successes with his Desert Rats in
    Egypt were excellent news, Hexham’s MP Douglas Clifton Brown warned against any
    premature celebrating. He said: ‘Rommel is a brave and wily soldier, and whatever
    sacrifices he may have to make, he will see to it that his famed-Afrika Korps
    is preserved as far as possible. It is always when a badger is right at the end
    of his sett that he is most dangerous. We have won a victory, which is something
    new for us in this war, but we have not won the war. There should be no Mafeking
    shouting just yet.’


    However, the Hexham Courant was quick to point out that ‘Monty’ had strong links
    with Hexham, in that he was the nephew of former Rector of Hexham, Canon Sidney
    Savage, whose wife was the sister of Montgomery’s mother.


    Montgomery’s success at El Alamein saw church bells which had been silent for
    two years ringing out all over England, including those of Hexham Abbey. Seven
    of the Abbey’s nine regular bellringers were away on active service, but the two
    survivors were joined by long retired campanologists, and locally billeted ringers
    from as far away as Truro, Whitchurch and Northampton. Victory peals were also
    rung at Newton Hall, Allendale, Corbridge and Wylam.


    An ATS private from Haltwhistle was mentioned in despatches for staying at her
    post with another girl when it was struck by a bomb on the south coast. Mary Howe
    was reluctant to talk about the matter when approached by the Courant, but eventually
    said: ‘We were working as usual in our room, when all of a sudden, without warning,
    the doors were blown off, and I was thrown into a corner. I managed to get back
    to the switchboard and continued putting calls through until we were given orders
    to evacuate. We had just left the room when the floor fell in so I suppose we
    had a rather lucky escape. We did no more than anyone else would have done.’


    Another tale came from Hexham’s Petty Officer Fred Barrable, who swam ashore when
    his ship HMS Manchester was sunk off the Algerian coast and was taken prisoner.
    He was put on a train with other prisoners and sent to Laghouat prison camp in
    Saharan Algeria operated by Vichy France, where once all their belongings had
    been confiscated, twenty-six men were crowded into a hut supposed to accommodate
    twelve people.


    The Arab guards played dirty tricks on the prisoners, said Barrable, recalling
    one taking a gold watch from a stoker, saying that in exchange for the watch,
    he would allow the sailor to escape. He did not get far, for they shot him as
    he was getting through the barbed wire.


    The staple diet at the camp was lentils, olive oil and black bread supplemented
    by ‘coffee’ made from date stones. They were occasionally given wine, which tasted
    more like vinegar, which the French authorities said was to keep down the diseases
    which were rampant in the camp. Barrable noted: ‘The hospital was poorly equipped,
    with a pony and trap used as an ambulance, but to make matters worse, flies of
    every description bothered us ceaselessly.’


    ![Image](images/f0127-01.jpg)


    Awarded an OBE in July 1943 was Chief Engineer Thomas Cuthbert Gorman of Hexhamshire
    who commanded a lifeboat with 23 men on board for 49 days in the South Atlantic,
    after his Merchant Navy vessel had been torpedoed, sinking in less than seven
    minutes.


    The prisoners eventually managed to get hold of a radio, from which they learned
    of the Allied troop landings in Algeria, which brought loud cheers from soldiers,
    sailors and airmen alike – but not the French camp commandant, for he was unaware
    of the invasion! The camp was liberated soon afterwards.


    More horrors were related by Chief Engineer Thomas Gorman, of Hexhamshire, who
    spent forty-nine days adrift in an open boat after his ship was hit by three torpedoes
    700 miles away from land out in the South Atlantic. The ship sank in six minutes,
    but two lifeboats were launched, before the U-boat surfaced and took off the ship’s
    captain as a prisoner of war.


    The two lifeboats, one containing twenty-six men and the other twelve, stayed
    together for five days, before being separated in high seas. Some time later,
    they found the second lifeboat empty and replenished their own meagre stores and
    waters from its lockers, as well as acquiring a second sail.


    Gorman related: ‘We only had the ship’s compass to guide us and were mainly at
    the mercy of the prevailing winds, although we occasionally took to the oars.
    After eight days we sighted a ship, but although we fired flares and did everything
    possible to attract attention she failed to see us.’


    The initial rations were two ships biscuits per man morning and night, a spoonful
    of pemmican, a little chocolate and a stick of Horlicks, but for the last sixteen
    days, they were reduced to surviving on three quarters of a gill of water per
    day. One of the gunners made a set of dominoes and they also made playing cards
    out of photographs to pass the time. When they were picked up, Gorman had lost
    three stones in weight and he could encircle the legs of the 16-year-old apprentice
    on board between his thumb and forefinger.


    As Christmas 1942 approached, with gifts in short supply and ration books ever
    more stretched, the fact that local farms were replete with specially fattened
    geese and turkeys for the Christmas table proved too much of a temptation for
    some. Many farms suffered serious rustling problems, with organised gangs said
    to be using cars and wagons to carry off geese, chickens and turkeys. The Langley
    area was particularly badly hit, with one farmer losing eleven turkeys in one
    night and another twenty-seven chickens. One farmer said: ‘The loss of poultry
    is serious at any time, but it is more keenly felt when we have scratched and
    scraped on meagre rations to fatten the birds for Christmas.’


    The Christmas of 1942 was again marked by austerity, stringent food rations, scanty
    shop dressings and transport restrictions – but the fourth Christmas of the war
    was one of the merriest. Rare good news from the battlegrounds meant that the
    church bells rang out on Christmas morning across the district after three silent
    Yuides. Efforts were made to ensure the many servicemen and women billeted in
    the district enjoyed as happy a Christmas as possible. The YMCA hall was bedecked
    with holly and mistletoe and a party was thrown for troops, involving some energetic
    team games which caused great merriment. The Mission to Seamen Rest and Holiday
    Home at Alendale held a house party for residents and friends, as well as numerous
    other events.


    Few families were fortunate enough to obtain a turkey for the Christmas table,
    but every ward in the Hexham Emergency Hospital had one. The celebrations started
    on Christmas Eve, with a tour of the wards by a choir of nurses whose path through
    the darkened wards was illuminated by coloured lanterns. Father Christmas made
    an appearance, accompanied unusually for the time by Mother Christmas, who distributed
    gifts to every patient of cigarettes, chocolate, sweets and writing materials.
    They went down so well that few noticed the red-coated and bewhiskered visitors
    were in reality the military registrar at the hospital Major R.C.H. Baker, of
    the Royal Northumberland Fusiliers, and the assistant matron Sister E.A. Hodgeson.


    ## 1943


    The vexed question of sacrificing metal railings to be turned into tanks and warships
    caused a stir in Corbridge in January 1943, when a councillor complained that
    while ordinary people were giving up their garden fences and gates, the great
    gates around the homes of the local gentry were being left untouched.

