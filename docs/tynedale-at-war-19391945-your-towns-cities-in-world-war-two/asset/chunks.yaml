    Robert later said when he regained consciousness in a hammock he was so full of
    the rum he was plied with by the crew of the `Kandahar` he thought he had died
    and gone to heaven!


    He was sent home to Hexham on survivors’ leave, but returned to action with `HMS
    Kent` and `Anson`, protecting the Arctic convoys to Russia, and later joined `HMS
    Abercrombie` which was mined when preparing for the Allied landings in France.
    He also had a short time ashore at Menton in France, using his gunnery officer
    skills to direct naval gunfire onto the German held Italian border area.


    When he was demobbed in 1946, he had twice been mentioned in despatches.


    Five Prudhoe schoolboys aged between nine and 13, felt the wrath of Hexham Juvenile
    Court when they flew in the face of the national Dig for Victory campaign by wreaking
    havoc on the garden of local policeman John L. Richardson. The policeman had spent
    the morning working in his garden at `Prospect Terrace`, but when he returned
    four hours later, two holes had been made in the hedge, and 150 onions had been
    uprooted and carried away. Two rows of peas, 8 yards long, had been uprooted,
    three rows each of carrots and spring onions had been damaged beyond use and a
    bed of summer cabbage trampled to nothing. Several branches had also been ripped
    off his apple trees, and the apples stolen.


    On making enquiries, PC Richardson heard a young girl had been seen selling onions
    from door to door in Prudhoe and when he spoke to her she said they had been given
    to her by her brother. The brother was arrested, along with his friends and all
    were charged with causing malicious damage to the tune of `£3`.


    Chairman of the bench J.M. Heslop told them that damaging garden produce in wartime
    was a very serious matter indeed. They were each ordered to pay damages of 12s
    and bound over to be of good behaviour for two years in the sum of `£1`.


    # CHAPTER FOUR


    ## Women Help to Turn the Tide


    Much is made of the role played by women in modern day warfare, but the notion
    that the nation’s womenfolk stayed dutifully at home wringing their hankies while
    waiting for their men to return from the front in the Second World War is a false
    one. Many women saw active service as `Wrens`, `WAAFs` or in the `ATS`, including
    the future Queen Elizabeth II, but only in support roles.


    People sometimes forget there was another women’s force which played just as big
    a part in Britain’s victory over the might of Germany. This was the Women’s Land
    Army, a specially created force designed to keep the country’s farms producing
    food while so many men were away. Many land girls came to Tynedale and their wartime
    efforts to master the intricacies and sheer hard graft of farming were well depicted
    in the book `Land Girls of Northumberland 1940-50` compiled by Ponteland’s Muriel
    Sobo, whose family farm immediately after the war included a recently vacated
    Land Army hostel.


    ![Image](images/f0091-01.jpg)


    Women were wanted across the country to carry out war work, as this advert aimed
    at Tynedale girls shows.


    Muriel painted a perfect picture of the groups of bewildered girls, some of whom
    had never been away from their pit villages or other urban areas and others from
    privileged backgrounds, all pitched into the back-breaking toil of farm work.


    ![Image](images/f0092-01.jpg)


    Overalls on and ready to get to work are some of the Land Army girls stationed
    in Tynedale.


    There were Land Army hostels at Haydon Bridge, Colwell, Stocksfield and Stamfordham.
    The Haydon Bridge hostel was purpose-built, but had no electric lighting and was
    heated by two coke ovens at either end of the common room. The first warden was
    Muriel Fleming from Haltwhistle, a well-known local councillor, who was very protective
    of her girls and made sure the butcher supplied only the best meat for them.


    The Stocksfield hostel stood at the end of `Painshawfield Road` and among its
    many features was a wooden contraption featuring rubber gloves dangling from a
    woollen bag – to teach the girls how to milk a cow.


    Some girls joined the Land Army full of romantic notions of farm life which involved
    nothing more than strolling round sunny hayfields, surrounded by gambolling lambs
    and handsome farm hands, but harsh reality was much different.


    Sarah Ogle was a typical land girl, who at the age of 19 went from working in
    a chemist’s shop straight to the hostel at Haydon Bridge. On her first day, she
    caught the `7.15am` bus to Allendale and worked all day at Henderson’s of Burnt
    Tongues, muck spreading. The following day, she was spreading lime – but it had
    set like concrete and had to be broken up by hand first. After a day’s threshing
    corn on a different farm, Sarah spent the next three days in a field sorting potatoes.
    When she went home for the weekend, Sarah declared she wasn’t going back – only
    to be told by her mother that as she had washed and ironed her uniform, she’d
    better get on with it!


    ![Image](images/f0093-01.jpg)


    Taking a brief rest from duty are three members of the Land Army.


    ![Image](images/f0094-01.jpg)


    Slouch hats and trousers were the uniform of the day.


    Lily Carey joined the Land Army to get away from a broken romance and the strictures
    of home life and was sent to the Stamfordham hostel. On her first day, she cycled
    eight miles in the snow, without benefit of waterproofs, to a farm at Ryal, only
    to be told when she got there that the farmer had changed his mind and didn’t
    need her after all. There was nothing for it but to turn round and cycle back
    again.


    There was a branch of the Land Army called the `Timber Corps`, which worked in
    the forests, providing timber for pit props for the still booming Northumberland
    mines. The corn sheaf motif on the Land Army badges was replaced by a spruce tree
    logo, and the usual hat by a beret. Timber girl Mary Haining made a special friend
    when she was working in the woods of Whitley Chapel – a red squirrel which she
    tamed to live inside her coat. She even took it back on visits to her home in
    Newcastle, which eventually proved fatal for the squirrel one wet winter night,
    when it was crushed under her coat on a crowded bus!


    Land Army girls were responsible for planting many acres of Kielder Forest, ten
    of them living in a bothy in Kielder village. One of the key duties of the land
    girls was hoeing turnips, to provide winter feed for sheep, and it has to be said
    that they didn’t always get it right. Having been told to leave the width of the
    hoe between plants, one girl opted for the `6ft` length of the implement, rather
    than the `6ins` of the blade!


    Farming was no place for the squeamish, for there are tales of mass rat hunts,
    with 200 of the scaly-tailed rodents slaughtered at a time, with a bonus of a
    penny per tail. Other girls from privileged backgrounds struggled with the Northumbrian
    dialect, but were too polite to say to the farmers they couldn’t understand a
    word they were saying about ‘shawing bagies’ or plugging their navels against
    barley ants. One girl had to deal with horses so flatulent that she actually wet
    her knickers with laughter.


    There was outrage after the war, when it became clear that while other women in
    the Armed Forces were better paid, got more clothing coupons and were supplied
    with underwear, the Land Army girls were very much second-class citizens. Not
    only were there medals, gratuities or training, they also had to return their
    uniforms.


    Some Northumberland girls who protested were summoned to a disciplinary meeting
    in London – their punishment was being sent to Penzance which they loved!

