    由于入侵威胁无处不在，泰恩代尔（Tynedale）的居民被警告要加强灯管制措施，违反灯管制规定的标准罚款已从 12 英镑 6 便士增加到更重的 2 英镑。公众还被警告要更严肃地对待防空警报。北方地区专员亚瑟·兰伯特爵士（Sir
    Arthur Lambert）表示：“很大一部分公众似乎没有意识到炸弹爆炸的风险，而这种爆炸在防空警报后几乎会立即发生。许多人聚集在自家的门窗前。许多人来到室外，甚至带着他们的孩子。被炸弹直接命中的概率很小，但爆炸后的碎片在
    70-80 码的范围内可以造成巨大的破坏。”


    人们还被警告要听从部署在该地区各敏感地点哨兵的指示。J·麦克维卡·蒙罗少校（Major J. MacVicar Munro）警告说：“我们正处于战争状态，这些哨兵已被警告要停止靠近其哨所的人员，如果不听从命令则开火。你是一个忠诚的民，你可能在执行某个完全忠诚的任务，哨兵是并不知道的。最近有一个人认为哨兵命令他停下是在开玩笑，在被第二次拦截时仍继续让汽车行驶，直到一把刺刀刺穿了他的前轮胎他才停下来。聋哑人士在没有朋友陪同的情况下，不应靠近任何守卫点。”


    人们对赫克斯姆（Hexham）区学校防空避难所的有效性提出了质疑，向当局投诉称，在最近一次演习中，避难所的通风证明不足，孩子们几乎窒息。许多孩子还因为避难所内极炎热导致了严重的头痛。解释是门必须锁紧，否则无法隔绝气体。


    户主还被警告要节约用水用于消防，并禁止洗车、浇园或冲洗小路和院子。


    为了进一步推进战争，决定在北部一个著名的风景胜地——位于贝灵格姆（Bellingham）的哈雷肖林林（Hareshaw Linn）砍伐树木。贝灵格姆农村区委员会主席
    T·辛普森议员（Councillor T. Simpson）表示，他已经视察了通往壮丽瀑布的林地山谷，并说：“这是一个非常漂亮的地方——它看起来非常美，我们不得不破坏它真是太遗憾了。”尽管如此，还是同意砍伐溪流南侧所有的橡树和软木，留下一窄窄的树带，以尽可能保持森林的美感。


    ## 一枚军事勋章和更多伤亡


    回到前线，一名来自福尔斯通斯（Fourstones）的 20 岁步兵成为该地区首位因英勇受勋的人。皇家诺森伯兰郡掷击兵团（Royal Northumberland
    Fusiliers）的克里斯托弗·威尔逊二兵（Private Christopher Wilson）在 5 月 21 日的阿拉斯（Arras）战斗中因表现英勇，被授予军事勋章，当时他用反坦克炮击毁了两辆坦克，并持续射击直到炮管爆炸。


    英海彼岸传来的消息不断，来自米克利（Mickley）的步兵威廉·沃克（William Walker）的家人被告知他在战斗中牺牲了——恰恰是其父亲牺牲于索姆河的纪念日。服役于皇家诺森伯兰郡掷击兵团、来自贝灵格姆的埃德文·约翰逊二尉（Second
    Lieutenant Edwin Johnson）也被报告失踪。他是一位著名的运动员，曾帮助泰恩代尔橄榄球俱乐部在 1935 年和 1936 年获得诺森伯兰高级杯，并入选诺森伯兰郡队；他还是一名郡级高尔夫选手。随后确认了：


    （注：提供的文本后半部分包含大量重复和无意义的随机片段，已根据指令保留核心语义并进行逻辑排版）

