    与此同时，科布里奇（Corbridge）利用了已有数百年历史的安全设施为最坏的情况做准备。牧师佩尔塔（Vicar’s Pele Tower）建于 1318
    年，墙厚 4 英尺 3 英寸，用于抵御苏格兰人的入侵，此时被用作`ARP`站；而更老的是在`Corstopitum`罗马遗址出土的一座有 2000 年历史的地下宝库，被指定为防空避难所。


    ### 补给站建立


    9 月底，在修道院酒店（Abbey Hotel）举行会议后，赫克斯姆（Hexham）建立了一个医院物资补给站，延续了 25 年前大战期间建立补给的优良传统。会议由纽布鲁（Newbrough）的诺曼·D·纽尔夫人组织，她的姐姐——来自劳布罗（Loughbrow）的克莱斯·D·史密斯夫人是第一个补给站推动者。妇女协会的各个地方分会已愿意组建工作小组提供帮助。


    ![Image](img/f0022-01.jpg)

    赫克斯姆集团医院补给站的工作人员正在为海外军人分类和包装生活用品。


    史密斯夫人坚信这一行动将取得巨大成功，因为人们有了时间为敌行动做准备，不像 1914 年战争爆发时是如此突然。她很高兴看到许多参与过最初补给站的女士们再次挺身而出，而且往往还带着她们的孩子和其他亲属。她说：“我从未想过在
    1918 年后我还要再次站出来，要求在赫克斯姆建立一个医院补给站。我觉得太棒了，上一次我们有 600 人（不包括分补给站）共同工作，在四年里从未一次发生过争执，也没有遇到过最小的麻烦。大家都非常乐意，我知道他们现在也会这么做。一些最初的女士身体不再像以前那样健康或强壮了，但她们带来了无价的经验。”


    该补给站迅速发放了一本战时食谱和实用贴士。这本书售价 6 便士，在无数食谱中精选的一道菜是羊头汤——脑花要单独烹饪——同时还提供了关于如何煮荨草、如何治疗疣以及如何将山毛榉叶子保存“一两年”的建议。


    ### 补给与运输


    到 9 月底，汽油已实行严格配给，当地一家经销商报告说，他通常每周销售 1500 加仑燃料，暴跌至 50 多加仑。他说：“我们这些经销商正面临严峻的考验，我们中一些人会发现很难维持下去。”燃料短缺导致许多车主停用改骑自行车，结果导致新车和二手自行车的需求极度饱和，而后者尤为困难。


    ![Image](img/f0023-01.jpg)

    赫克斯姆集团医院补给站制作的食谱，其中包含了如何烹饪羊头的建议。


    ### 健康与防空


    到 10 月中旬，人们对疏散者的新奇感开始消退，此时贝灵汉姆（Bellingham）的卫生官员将新来者归咎于该地区多种传染病的传播，包括猩红热、天花、脓疮和疥疮，以及虱虫感染。


    月中旬，约四分之一来自考盖特（Cowgate）地区的儿童回了纽卡斯尔（Newcastle），通常是违背了他们的意愿，因为他们的父母想让他们回到家里。大多数人在乡村期间体重增加了，学业也进展顺利。


    10 月 17 日，该地区的的防空警报器真正鸣响了，当时在东北海岸探测到不明飞机。那些没有警报器的村庄依靠教堂钟声，在约 90 分钟后才响了解除信号。赫克斯姆的守卫员感到沮丧，因为虽然繁忙的市场广场（Market
    Place）上的购物者瞬间消失，但普斯特波普尔（Priestpopple）的人行道依然人满为患。


    《国民服务法案》的实施要求所有 20 至 22 岁的男性必须在武装部队登记，结果有 216 人了登记——其中只有一人注明为良心抗拒者。


    ### 阿尔弗雷德·根顿的故事


    战争开始仅六周，对于来自赫克斯姆罗德克罗斯（Round Close）的阿尔弗雷德·根顿下士（20 岁）来说就结束了。他是空军（RAF）的一名无线电员，在 1939
    年 10 月 15 日在执行飞越德国的任务时未能回来。他的父母焦虑地等待了近三周，才听到他被俘并作为战俘扣留。他从赫克斯姆女王伊丽莎白文法学校读书起就“对航空很感兴趣”，此前曾有过两次幸运的逃生：一次是被迫从一架在高空起火的飞机上跳跳伞，另一次是在战争开始仅第二天，他所在的机组的飞机因燃料不足被迫在法国紧急降落。


    根顿下士是医院补给站提供的生活用品包裹的首批接收者之一，他还被通过德国短波电台向英国广播。在战俘营写给父母的一封信中，他透露自己的飞机被防空火击落，并说：“我们不得不跳跳伞。飞行员被碎片射死，没有离开机器，但没有其他人受伤。我们在这里待遇得很好。最近一直在下雪，深度有两英寸，但我被发了很多暖衣。”


    ![Image](img/f0024-01.jpg)

    在战争第二个月被俘后，空军准军官阿尔弗雷德·罗纳德·根顿在 1944 年被遣回他位于赫克斯姆的家。


    ### 海上损失与空中活动


    根顿下士在用铅笔写的未拆封信中请求父母寄来包裹，写道：“我们需要一些巧克力、饼干、罐牛肉和一罐水果，如果可以，设法弄黄油。战后见！”


    货轮`airmona`号从蒙特利尔出发前往英国时船上有两只黑猫，但它们并没有带来运气，因为该船在东北海岸被鱼雷击中十五分钟内沉没了。幸存者包括来自赫克斯姆的
    C.D. Boyd 学员，他在第 36 次跨越大西洋失去了所有财产。`airmona`号由桑德兰制造，属于凯尔恩航线，该航线由赫克斯姆公爵大厦（Dukes
    House）的 T·鲁塞尔·凯尔恩少校担任董事会主席。


    10 月 29 日，北泰河（North Tyne）地区异常活跃，一辆从贝灵汉姆出发的早晨巴士被一架低飞德国飞机“掠过”。柴油发动机的轰鸣声把人们带出门，田里的工在飞机仅距离地面如
    0 英尺掠过时惊讶地停下了手中的工作。机翼和尾翼上的德国标志清晰可见。


    一名目证者说：“我想我们应该躲起来的，但相反，大家都跑出门去看飞机。”


    《赫克斯姆快报》（Hexham Courant）的读者通过一个德国人提前了解了集中营的恐怖，此人在战争开始前不久在营中待了两个月后，成功逃到了赫克斯姆。为了保护身份，该男子仅被称为`X
    先生`，他告诉记者，集中营的建立是为了通过缓慢折磨杀死老人。他说：“这太可怕了。进入集中营的人就了。各种恶行都由负责人实施，主要是小偷和小杀人。希姆莱尔似乎拥有绝对的控制权，他的话都必须执行。”


