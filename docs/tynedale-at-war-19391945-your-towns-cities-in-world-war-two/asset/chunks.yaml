    他们受到了热烈的欢迎，欧洲人和当地人齐聚在港口，大喊着：“大英帝国万岁！”罗兰兹先生（Mr Rowlands）表示，这些男士出色地度过了他们的难关，除了遭受了严寒和晒伤侵蚀了他们结满盐渍的皮肤之外。他说：“这是一次非常兴奋且有趣的经历，但这种事一生经历一次就够了。”


    艾伦山谷（Allen Valleys）遭受的首次轰炸记录于 1941 年 4 月 26 日（周六）深夜临近午夜之际。一架显然迷路的德国空军轰炸机在泰恩代尔（Tynedale）上空盘旋了一段时间，似乎在随机地投掷炸弹。在艾伦山谷，飞机在海阿克顿（High
    Acton）和诺克谢尔德（Knockshield）农场之间的空地上投掷了 200 枚燃烧汽弹，在索恩利门（Thornley Gate）和毕斯菲尔德（Bishopfield）之间又投掷了
    50 枚，但未造成任何伤亡。后来，在该地区还发现了四个装载燃烧汽弹的飞机容器。


    前艾伦代尔居民、百岁老人艾伦·史密斯（Allen Smith）记得他叔叔对轰炸的反应。“他们投炸弹的那个晚上，我叔叔——住在辛德霍普（Sinderhope）附近的伯恩富特的埃弗斯特·查尔顿（Everest
    Charlton）——听到了爆炸声，拿出了他的双管枪，因为他以为德国人过来了。他带着妻子和守在一起，准备射掉第一个出现在花园小径上的德国人——幸运的是那天晚上没有人路过！”


    1941 年晚些时候，艾伦山谷再次发生了一次轰炸，时间是 10 月 12 日（周日）。几架从曼彻斯特轰炸后返回的德国轰炸机选择泰恩河峡谷（Tyne Gap）作为返回路线，这条路线经常用于对默西赛德郡（Merseyside）和克莱德赛德（Clydeside）的袭击。晚上
    10:51，东北地区发布了灯光预警，随后在晚上 11:05 响起了警报。尽管战争期间艾伦代尔（Allendale）或艾伦海德（Allenheads）没有防空警报器，但该地区有几个警报器，其中包括位于赫克斯姆（Hexham）的一个，在安静的夜晚，跨越整个山谷都能听到。


    晚上 11:25，一架飞机投下了一枚炸弹，落在艾伦代尔西西英里基恩利（Keenley）奥斯特利农场（Oustley Farm）的一个采石场里。这是一个巨大的炸弹，形成了一个直径
    30 英尺、深 20 英尺的坑。爆炸导致农场的窗户和一扇门受到轻微损坏。前艾伦代尔居民朱·沃克（June Walker）在战争爆发时只有三岁，但她还记得父亲带她去看过炸弹造成的破坏。“我记得去看炸弹坑，因为我父亲是民兵队（Home
    Guard）的成员，他带我一起去的，”她说。


    ## 武器周 (War Weapons Week)


    泰恩代尔地区通过国家储蓄运动每天节省 1000 英镑，自敌战爆发以来，该地区已为战争努力贡献了超过 50 万英镑，并筹集了 5000 英镑购买了自己的“喷火式”战斗机。然而，当计划在
    1941 年 4 月 26 日至 5 月 3 日举行“武器周”时，该地区准备投入更多，是在七天内达到惊人的 60,000 英镑。据称，每筹集的六便士就能买一颗重机枪子弹，因此将成为希特勒棺材上又来的一颗钉子。


    ![Image](img/f0079-01.jpg)


    1941 年春季，数十家赫克斯姆企业支持了赫克斯姆地区武器周。


    ![Image](img/f0080-01.jpg)


    在尤斯塔斯·珀西勋爵（Lord Eustace Percy）启动赫克斯姆武器周时，挤满了赫克斯姆市场广场。


    陆军部的购物清单从一艘战舰的 800 万英镑到一艘航空母舰的 300 万英镑，从一把韦伯手枪的 4 英镑 10 先到一枚手榴弹的 4 先——更不用说那些六便士的机枪子弹了。


    这一周从镇东部的迪尼公园（Dene Park）橄榄球场游行到市场广场，大量的人群欢迎了在军乐队带领下的士兵、民兵队、辅助消防队、红十字分遣、防空人员（ARP）和其他民防人员的到来。致礼的是洛夫图斯·贝茨爵士准将（Brigadier
    General Sir Loftus Bates），由爱德华·里德尔准将（Brigadier General Edward Riddell）陪同。武器周组织者尤斯塔斯·珀西勋爵向群众表示，战争每周花费
    5000 万英镑，这种资金不能仅靠税收。还需要以储蓄形式提供的额外自愿捐款，这些可以在战争结束后兑换。


    很快很清楚，目标是刻意保守的，因为在活动的第一天就筹到了 90,856 英镑，仅该镇的银行——巴克莱斯、米德兰、莱莱德斯、马丁斯和国家省银行——每家就承诺了
    10,000 英镑。


    活动开始四天后，总额超过了 150,000 英镑，最终总额为 236,959 英镑 19 先 11 便士——几乎是目标的四倍——这获得了财政大臣金斯利·伍德爵士（Sir
    Kingsley Wood）的热烈感谢信。赫克斯姆地区武器委员会主席安东尼·埃默森（Anthony Emerson）补充道：“这表明全格兰的心脏如既往一样坚定忠诚。”


    ## 良心拒绝者 (Conscientious Objectors)


    来自奥特伯恩（Otterburn）的林业工人约翰·沃尔顿（John Walton，25 岁）因未根据《1939 年兵役法案》注册而被贝勒林汉治安法庭罚款 5
    英镑。他告诉法庭，他没有注册是因为他是一个良心拒绝者，他认为战争“完全没有必要”。他拒绝缴纳罚款，当他询问是否有其他选择时，法官席长 G.D.安德森少校（Major
    G.D. Anderson）告诉他：“没有其他选择；你将被强制罚款，并给你一个月的时间缴纳。你对这一问题的个人观点对我们没有影响。《兵役法案》和任何法律一样都是该国的法律，你很清楚自己没有遵守那部法律。我们不关心你的观点，因为作为这个国家的公民，你必须遵守它的法律。”


    沃尔顿没有交罚款，两个月后被带回法庭，他告诉法官他仍然没有交罚款的意愿。他被关了一个月，并告诉法庭：“是六个月还是六年，这并不重要。”


    ## 防空措施 (Air Raid Precautions)


    防空措施继续占据地方当局的精力，赫克斯姆地区议会（Hexham UDC）向内政安全部申请拨款，用于提供家庭防空避难所。H.H.达尔林顿（H.H. Darlington）议员说，虽然赫克斯姆有一些优秀的公共防空避难所，但很少有人使用它们，“因为他们不愿在晚上离开温暖的床去进避难所”。


    海登桥（Haydon Bridge）对敌机威胁来时发出警报的方法也深表不满，这种方法涉及到首席防空警员 E·基尔索普先生（Mr E. Kirsopp）在村子里到处奔跑，敲响他的警员们的门。尽管一个警报器只需
    20 英镑，但向诺森伯郡防空委员会申请警报器的请求一再被拒绝。一位当地议员问：“我们现在不是时候结束这场闹剧，告诉郡议会不要在解释防空措施时那么吝啬吗？”


    约翰·理查德森法官（Judge John Richardson）在英国军团科布里奇奇（Corbridge）分支组织的一场烟草会上对德国民族发表了蔑视。他说：“对德国人说好话固然很好，但我从未见过一个好的德国人——至少在
    1938 年我在德国的时候。对希特勒类型和性格的人表现出如此奴性忠诚的人，是不可能有好处的。为了欧洲，那种人不可信，德国必须永远被压制。”

