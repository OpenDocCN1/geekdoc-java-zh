    在上学时代，劳伦斯被发了一支木制步枪，但被中士没收了，因为他那支真实的 .303 步枪对于演习来说太重了。当时还有与赫克斯姆民卫队（Hexham Home
    Guard）的模拟战，在那里，“笨拙小队”（Awkward Squad）总有一个目标——攻占当地的酒吧。


    劳伦斯回忆道：“我们抓了科布里奇的站长皮尔森先生，并让火车到了赫克斯姆，在那里我们占领了旧车站酒店。当我们的军官问我们在做什么时，我们告诉他我们正在审讯一名囚犯。他说应该由他来审讯，我们说可以——但前提是他必须请每人喝杯啤酒！我当然没喝酒——我只能靠汽水和薯片对付了。”


    ![Image](img/f0043-01.jpg)


    科布里奇民卫队的男士们已整装就绪。


    在另一次，一名军官随口透露他计划在凌晨 2 点对民卫队进行检查——结果当他靠近时，迎接他的是连串空包弹的爆炸声，他吓得落荒而逃！


    ## 当地伤亡者


    战争中首批当地伤亡者的悲惨称号落在了两位 20 岁的年轻人身上：步兵阿尔伯特·汤普森（Albert Thompson），赫克斯姆泰恩格林（Tyne Green）W.汤普森夫妇的小儿子；以及步兵科内利乌斯·牛顿（Cornelius
    Newton），来自万莱斯巷（Wanless Close），两人均在 5 月 19 日为皇家诺森伯兰的掷枪兵团服役期间战斗阵亡。


    当英国远征军被强大的德国战争机器推回大海并抵达敦迪尔克海滩时，整个国家在国王的要求下举行了国家祈祷日。超过 2000 人参加了赫克斯姆修道院的周日崇拜，该地区的教堂也座无虚席。


    伤亡人数开始增加，从敦迪尔克抢出来的伤兵护送队开始抵达赫克斯姆急诊医院。这片木制建筑群建立于战争初期，用于收治在海外受伤的军伤亡员，并处理平民和军方的空袭伤亡。一段时间内，它收治了当地的“和平时期”紧急病例，以及在纽卡斯尔皇家维多利亚医学院等待治疗的急性症和外科病例。但
    1940 年 6 月 1 日，第一批 269 名来自敦迪尔克撤离的军伤员抵达，从那时起医院一直满到 1945 年。赫克斯姆的人一直称其为“军医院”，本应在战争结束时关闭，但在
    1948 年被并入新的国家医疗服务体系，那些木制建筑直到 2004 年首相托尼·布莱尔为赫克斯姆启用新医院之前一直发挥着巨大的作用。


    敦迪尔克伤员的抵达本应是一个秘密，但许多人在凌晨时分出来迎接这些疲惫不堪的伤员，在很多情况下他们伤势垂危，但仍保持着令人惊讶的乐观精神。许多人除了身穿的外没有任何个人物品，但人们立即进行了募集，在他们抵达后的几小时内，士兵们就收到了衣服、剃须刀、烟草、火柴、食物和水果等礼物。“我被像国王一样对待，”一位士兵给家人写信道。


    医院的常规医人员由大量的红十字会工作者补充，人们尽全力照顾伤员并减轻他们的痛苦。显而易见，所有的士兵都经历过他们不愿谈及的经历，但他们惊人的乐观精神让护士和医生们感到震惊。


    伤员中还有一支法国士兵，尽管他们自己身负重伤，家园可能已被夷平，妻儿散落在法国各地，他们依然保持着极佳的乐观精神。其中一人通过翻译说：“再过十天，我就回来让弗里茨（德国人）看看厉害的。”


    送往赫克斯姆的人中，有一位来自皇家诺森伯兰掷枪兵团的威廉·奥姆斯顿（William Ormston），他的脚部被严重压伤，在敦迪尔克的途中经历了艰辛的 40
    小时救护车旅程，期间救护车司机为了躲避纳粹炸弹和机枪子弹曾停过两次。最终抵达英国后，他与其他伤员一起坐在救护列车上，第一次听到有人提到赫克斯姆是列车的终点。尽管受伤了，他感到非常高兴，因为赫克斯姆是他的家乡，父母只需走几百米就能探望他。


    赫克斯姆自由教会为探视伤兵的亲属设立了一项“留宿”服务，他们呼吁当地家庭为访客提供住宿，并收到了许多帮助提议。


    并不是人都活了下来；一名英国士兵和一名法国海军陆兵在伤兵护送队抵达后不久去世。这两名受害者——米德克斯克斯团的雷克斯·马丁（Rex Martin，21 岁）士兵和海军陆兵保罗·鲁埃（Paul
    Ruel）——并排安葬在赫克斯姆墓。赫克斯姆牧师分别举行了告别仪式，J.V.C. 法尔奎哈尔牧师为英国人主持了仪式，天主教神父坎宁汉姆为法国人主持了仪式。棺材覆盖着英国国旗和法国三角旗，哀悼者中还有来自纽卡斯尔的法国领事。


    当时还需要大量的翻译人员来帮助法国公民和殖民地人员翻译，包括来自伊丽莎白女王男女语法学校的法国老师。


    男士们不愿公开记录关于他们在敦迪尔克的经历，但一位赫克斯姆掷枪兵告诉《快报》（Courant），当敦迪尔克断水时，他还是设法在五后洗了第一次澡——用了两瓶香槟。他说：“我洗得很彻底——从里到外都是。”


    尽管如此生活仍在继续，一位来自海登桥（Haydon Bridge）的空袭警员因违反宵灯规定被罚 12 英镑 6 便士。他责怪妻子为了擦窗户而拆掉了宵灯材料。


    贝灵林姆（Bellingham）的农民威廉·詹姆斯·多德（William James Dodd，60 岁）在拒绝陆军部挖掘所有土地以增加产量的指令后陷入了法律问题，被罚
    40 英镑加 10 英镑诉讼费。他告诉法庭，他无法同意耕种所有土地，因为他留了两块最好的草场来生产奶牛饲料。他与牛奶营销委员会有合同，规定每天提供 50 加仑牛奶，如果奶牛得不到良好喂养，他就无法做到。判决时，多德说他宁愿坐牢也不交罚款，但被告知这不是选择，如有必要，他的土地将被强制征收并耕种。


    普鲁霍（Prudhoe）的一名警察被指控在逮捕三名涉嫌醉酒的人时，行为“更像冲锋队队员，而不是开明的英国警察”。然而，法官拒绝接受了他辱骂这些人并击中其中一人腹部的指控，那三个恶作者均被罚了款。


    当当地著名的运动员二中尉托马斯·本森·布兰（Thomas Benson Bland）报告失踪时，赫克斯姆一片哀。他曾代表泰恩代尔（Tynedale）参加橄榄球和板球，帮助橄榄球俱乐部三次获得诺森伯姆高级杯冠军，并代表诺森伯兰参加了三十多次比赛。他是
    1936 年诺森伯兰与达姆联合队对阵新西兰全队的比赛的成员，他也是一名同样出色的板球运动员，也曾代表诺森伯兰和泰恩代尔，曾在泰恩代尔对阵本韦尔山时在 129
    分钟内得了 155 分。


    后来得知他被俘，但在 1941 年 1 月在德国的一所医院伤重去世。


