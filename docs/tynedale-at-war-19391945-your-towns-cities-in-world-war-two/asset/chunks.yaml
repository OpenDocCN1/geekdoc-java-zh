    There was bad news for the Tynedale hunting fraternity when they were told that
    they would have to cut the number of hounds in their packs to just one sixth of
    pre-war strength in a new Government directive. The Tynedale would be obliged
    to operate on just two days per week, rather than the traditional four, and the
    number of hounds would be reduced to eight and a half or nine couple. A huntsman
    said: ‘Hunts have been making sacrifices in the national interest since the war
    began, and while this new order will greatly curtail our activities, it is nothing
    compared to the sacrifices which millions are making to win the war.’


    ## Drunk, disorderly and other crimes


    The behaviour of members of the Australian Imperial Forces when they came to Hexham
    on a Saturday night was an increasing cause of concern to the Hexham Court, and
    after fining one Australian the maximum of £2 for being drunk and disorderly,
    chairman of the Bench Alderman John Brogdon warned that any more unruly roisterers
    would be sent to prison, without the option of a fine. Local police superintendent
    William Goodfellow told the court that the behaviour of the Australians with regard
    to drunkenness fell far below the standard expected of men in uniform. The police
    had great difficulty in getting them out of town before midnight or 1am, and their
    behaviour was unfair to the many other troops stationed in the area, about whom
    there were no complaints. An officer from the man’s unit said: ‘Situations like
    this are very disturbing to us, for we are very jealous of our good name.’


    Later that month, magistrates refused to grant a late drinks licence for a dance
    at Hexham in aid of the Overseas League because of the risk of disorder, giving
    as the reason the large number of troops from many different countries who were
    stationed near Hexham. Police opposed the application following an increased amount
    or disorderly behaviour from off duty servicemen, which included the breaking
    and throwing of glasses.


    It wasn’t only the Australians who found themselves in court. A Polish airman
    who had shot down a German aircraft earlier in the week, appeared in the dock
    charged with the theft of an Aylesbury duck worth 12s, which belonged to a local
    policeman. The flight sergeant appeared in the dock in full flying kit and spoke
    no English, so the services of an interpreter were required. The arresting officer
    accepted that the Pole had not stolen the duck for food, but wanted it as a mascot
    and the case was dismissed. The airman was however ordered to pay 5s in costs,
    but a member of the bench said that in recognition of the fact the man had brought
    down a Luftwaffe plane, he would pay the costs out of his own pocket.


    An unnamed Army officer also appeared in court charged with fishing for salmon
    in the Tyne at Corbridge without a licence. When approached by a bailiff he asked:
    ‘Is this what we are fighting for? I thought the fishing was free; this is very
    petty.’ Although he told the court he was used to fishing in Scotland, where no
    licence was required, he was fined 15s, with 5s costs.


    ## Hexham Auxiliary Fire Service Investigation


    The activities of the Hexham Auxiliary Fire Service in mid 1941 caused great alarm
    at Hexham UDC, when a call was made for the sacking of all full time personnel
    over the alleged theft of petrol from the unit’s fire engine. Concerns were raised
    over the excessively high amount of fuel used by the fire engine, and an investigation
    by council officials revealed that over a period between 5 April and 20 May, the
    vehicle had covered just 46 miles – but the amount of fuel drawn was 44 gallons.
    Checks showed that a pipe from the foam apparatus had been used to siphon petrol
    from the fire engine and into a receptacle. It was believed that at one stage,
    the petrol tank of the vehicle was left completely dry while it was on call.


    Calling for the sacking of all full time members of the AFS, vice chairman of
    the council Joe Cullen said: ‘The very least that we can say is there has been
    sheer negligence in the care and custody of a very valuable commodity, which is
    brought to this country by the blood, sweat and lives of the men in our tankers.
    You may feel that my proposal is a drastic one, but drastic evils demand drastic
    remedies and these things cannot be permitted under the present circumstances.’


    The police had been called, but it proved impossible to identify the culprits
    – just as it had when there were inexplicable disappearances of fuel from the
    AFS stocks on other occasions.


    ![Image](images/f0084-01.jpg)


    ## Military Honours and Food Supplies


    Acting Petty Officer Norman P. McKie of Hexham, was posthumously mentioned in
    despatches for volunteering to stay on board HMS Somali after she had been torpedoed
    while on Arctic convoy duty. He remained on board as part of a steaming party
    after nearly all the ratings had left the ship. The citation said: ‘The zeal,
    courage and devotion to duty of Petty Officer McKie during the three and a half
    days before the ship sank were a fine example to all who were with him.’


    Other councillors were equally concerned about the loss of fuel, but questioned
    the wisdom at a time of national crisis of dispensing with the services of men
    who were well trained and capable firefighters. The sacking proposal was rejected,
    but it was agreed that discipline and security would have to be stepped up.


    On the food front, tomatoes were in such short supply that shopkeepers were reserving
    them for regular customers who had standing orders, leading one housewife to inquire:
    ‘Does that mean working class people cannot have tomatoes as they cannot afford
    to place regular order?’


    A Hexham shopkeeper commented: ‘When you come home from the market with tomatoes,
    people nearly knock your windows in trying to get them, and if you refuse, you
    really are in trouble.’


    ## Fruit Preservation Scheme


    Sugar for jam remained a bone of contention, but jam-making was left in the capable
    hands of the women’s institutes of Tynedale. Centres for the preservation of surplus
    fruit were set up across the district. The scheme was strictly for the preservation
    of fruit which would otherwise been wasted, and fruit producers were encouraged
    to eat, bottle or make jam of their fruit the way they would have before the war.
    Only surplus produce was to be taken to the various centres, where prices were
    set by the government. Gooseberries could be sold at a maximum price of 30s per
    hundredweight, raspberries 47s 6d, blackcurrants 90s, strawberries 75s and loganberries
    50s.


    The scheme was launched at Bellingham, but initially proved an anti-climax as
    no fruit was forthcoming. The first jam produced under the scheme was at Stocksfield,
    where ladies of the Bywell and Branch End institutes made 100lb of gooseberry
    jam, the fruit having been bought at the fixed rate of 3½d per lb. As well as
    cleaning and boiling the fruit, the ladies had the task of washing and sterilising
    more than 2,000 jam jars collected for the scheme by local schoolchildren.


    Other centres followed suit, with the joint Corbridge, Dilston and Stagshaw WIs
    producing 154lb of rhubarb and gooseberry jam which was rapidly snapped up by
    local shopkeepers. The Dowager Viscountess Allendale lent her kitchen at Bywell
    Hall to the enterprise and business was brisk.


    There was a shock for residents of the Tynedale Hydropathic Establishment, when
    residents rose from the evening meal to find a notice had been posted in reception
    saying that the hotel was in the process of being sold, and that they would have
    to find alternative accommodation. While details were sparse, it was understood
    the sale had been forced on the owners, because the building was being requisitioned
    by the government as a children’s sanitorium.


    Many residents had made the hotel their permanent home, some because of the fact
    their homes elsewhere in the North East had been bombed and they had nowhere else
    to go.

