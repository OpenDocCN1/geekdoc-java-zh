    Meanwhile the real fighting was continuing on many different fronts. Lieutenant
    `John Rudd Mackie` of Fellside, `Corbridge`, was on patrol in the `Tilly–Caen`
    sector, when he captured two Germans. However, he was then injured when a trip
    wire activated a German booby trap and the two prisoners tried to flee. Despite
    his injuries, `Mackie` managed to open fire with his `Sten` gun and winged them
    both, allowing them to be recaptured. He was the holder of a certificate signed
    by Field Marshal `Montgomery` for outstandingly good service, but was killed in
    action just weeks after the foiled escape bid.


    There was a Distinguished Service Order for Brigadier `R.C. Osborne Hedley`, for
    his exemplary leadership of an Indian Army brigade fighting the Japanese in the
    `Chin Hills` of Burma, notably at the `Battle of Sakawng Hill`, one of the key
    turning points of the war in the Far East. `Hedley`’s `Gurkha` troops carved their
    way through impenetrable jungle to outflank the Japanese, at one stage using their
    rifle butts to create an improvised ladder to scale cliffs and open up the road
    to `Imphal`.


    Escapees from Italian prison camps following the capitulation were starting to
    return to `Tynedale` after many months on the run, hiding from the Nazis. Among
    them was `Captain Kit Patterson`, of the `Royal Northumberland Fusiliers`, who
    made a 250-mile trek back to Allied lines, which took nine and a half months.
    He was one a party of five who escaped; the other four were all recaptured. He
    was delayed by weather and lived on his wits in the hills, whilst being fed by
    Italian peasants, whom he found very friendly and helpful. The first thing he
    noticed on his return to `Hexham` was the fact that all the railings had disappeared
    from around buildings.


    ![Image](images/f0163-01.jpg)


    Sergeant `John Oswald Nolan`, of `Henshaw`, who used his ‘best Italian’ to trick
    Nazi troops after escaping from a prisoner of war camp.


    Another escapee was Sergeant `John Nolan`, of `Henshaw`, who was also at large
    for nine months, running the gauntlet of German patrols. On one occasion he was
    confronted by a party of German troops on bicycles, but he just waved his arms
    and jabbered at them in mock Italian and they allowed him to go on his way. After
    that he took care to keep away from main roads and head for freedom under the
    cover of hedges and woodland. Like `Captain Patterson`, he was looked after by
    locals, who shared their meagre food supplies with him. He worked for one Italian
    family who broke down and wept when he said he was heading for home. Having been
    held at prison camps in `Tripoli`, `Brindisi` and `Macerata`, he said the food
    in many Italian camps was very poor and had it not been for Red Cross food parcels,
    many British prisoners would not have survived.


    Sergeant `Nolan` was taken prisoner at `Knightsbridge` in 1942, but he had already
    seen action, being evacuated from `Dunkirk`, and was mentioned in despatches for
    gallantry at `Arras` for driving a truck full of men to safety under heavy fire.
    The fire was so fierce the truck tyres were blown off and he drove many miles
    on the wheel rims.


    ![Image](images/f0163-02.jpg)


    Former `Acomb` miner Sergeant `Sidney Cooper` who saved many lives when he picked
    up a case of burning bombs and made them safe at `Cagny` in France.


    There were more heroics from ex-Acomb miner Sergeant `Sidney Cooper` (32) serving
    with an armoured division at `Caen`.

