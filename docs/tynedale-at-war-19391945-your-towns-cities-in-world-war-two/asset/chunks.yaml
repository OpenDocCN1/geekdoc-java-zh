  trans: '

    整个战争期间只发生过一次防空警报，当时女孩们在防空洞里抱着它们的毛熊度过一个不安的夜晚，等待着警报解除。女孩们在学校读了四年书，但在诺曼迪登陆后，她们回了家，带走了许多快乐的回忆。


    物资回收的号召在整个地区引起了积极响应，每个城镇和村庄都建立了物资回收站。在 `Prospect House` 的 `Hexham` 站交出的物品中，有一位老太太的铝热水壶、一个实铜浴缸和一个农民的鸡类孵化器，而一个孩子交出了他的发条火车模型组。此外交出的还有维多利亚时代的金属壁炉、大量的黄油灯、婴儿车、玩具、锅炉和成千上万的罐头，以及两根
    `Tyne` 捕鲸队的遗物和一顶从上一次大战中回收的德国头盔。


    `Hexham` 的牧师不得不为 `Abbey` 金属围栏保留原地的事实进行辩护，他指出教区委员会曾想将它们作为物资回收物资，但被 `Newcastle`
    的主教办公室拒绝了许可。主教的立场得到了《Courant》报记者的支持，他认为围栏对于保护教堂的完整性是必要的。他写道：“想象一个特殊的场合，比如一场有趣的婚礼。人们会爬上墙，需要警察的协助来防止他们冲进门口。警察已经有许多事情要做，没必要再增加他们的负担。”


    直到 10 月中旬，教区才松口，并授予了拆除围栏的许可。然而，全镇公共公园以及墓地的围栏也都被拆除了。


    ### 本地悲剧


    后方也发生了悲剧，两名士兵分别在 `Tyne` 河游泳时溺水——一个在 `Riding Mill`，另一个在 `Hexham`。来自 `Warrington`
    的 `Richard Welding` 二兵在 `Riding Mill` 的 `Tyne` 河与大约三十名士兵一起进行游泳训练时陷入了困。随后的验讯结果显示，他不擅长游泳，而且他游泳的区域极很危险，因为那里有回流和漩涡，水深达
    `10-12ft`，且底部是不稳定的泥沙。


    他所属部队的一名军官告诉法医，由于这次事故，`Tyne` 河将不再进行集体游泳训练，取而使用公共浴场。


    仅仅三天后，20 岁的来自 `Manchester` 的炮手 `James Radcliffe` 在 `Hexham` 的 `Tyne` 河游泳时也遭遇了危险并溺水。目击者说他当时正在河里洗澡，告诉朋友他要游到对岸，尽管他并不擅长游泳。他游到一半时没入水下，随后大喊着浮出水面：“救我，我溺水了！”尽管同伴们试图救他，他还是溺水了，尽管他游泳的那个区域世代以来一直深受沐浴者的喜爱。军营里也发生了死亡事件，来自
    `Birmingham` 的士兵 `William Joseph Murphy`（22 岁）在驻守的 `Hexham` 村外发生的一场醉酒争吵后，被指控杀害来自
    `Manchester` 的同事 `George Eric Ward`。当他床头丢失了两个半克朗硬币时，冲突爆发了。他装填了步枪，说要射掉任何拿他钱的人。据说，几个人试图从他手中夺枪，其中包括据认为是他最好的朋友的
    `Ward`，后者最终腹中弹身亡。


    `Murphy` 声称枪是意外走响的，但他仍被送到 `Newcastle Assizes` 在 `1940`年 8 月受审。他后被判定谋杀无罪，但过失杀人罪，被处九个月苦役。


    对于住在 `Hexham` `Wanless Close` 的 `Mrs T.C. Urwin` 夫人来说，这是一个创心的八月，因为在两个月内，她的丈夫和儿子都在德国鱼雷击沉的船只上。她的丈夫当时在
    `Mohamed Ali El Kebir` 号轮船上，该船从一个英国港口出发，载有士兵和海军人员，在离港两天后被鱼雷击中。船只在两小时内沉没，由于救生艇损坏，`Urwin`
    先生不得不沿着绳索滑轮登上了一只木筏，在汹涌的海中漂流了五个小时才被一艘驱逐舰救起。


    与此同时，这对夫妇 18 岁的儿子 `Michael` 在 `HMS Calypso` 号舰上，该舰也被鱼雷击中，家人在确认他已被救起并在埃及康复之前经历了焦急的等待。


    ![Image](img/f0053-01.jpg)


    除了在海外与纳粹作战，`Tynedale` 的居民还被敦促对后方的另一个敌人——老鼠。注意展品上那个“希特勒式发型”和牙刷胡须。


    在贡献力量的人中，有 `Hexham` 年龄最大的老居民 `Mary Jane Robson`，她 97 岁岁时仍在为士兵织袜子。`Robson` 夫人经历过五场战争，是一个九口大家庭中最后幸存的成员，这个家庭以长寿闻名。在她哥哥
    `Dr C.R. Kendal` 以 97 岁去世后，她继任成为小镇最年长的居民。她的丈夫在第一次大战爆发的最初几周被杀。为她的生日蛋糕购买 97 根蜡烛需要花费
    `12s 6d`，但 `Robson` 夫人要求将这笔钱捐给战争慈善机构，而不是购买蜡烛。


    8 月，“Hexham` 发起了“反击，购买喷式战斗机”活动，目标是宏大的 `£5,000`。该活动得到了空军准将 `Milne Robb` 在获得空军十字勋章不久的支持。“Robb`
    说：


    “德国空军最近失败的大规模攻击主要目标是消耗我们的战斗机防御，这一定让大家意识到我们的战斗机中队所承担的巨大责任。在目前这些攻击中，敌人主要依靠中型和俯冲轰炸机，由大型战斗机群护航，使用的重轰炸机比例较小，而他们拥有大量的重轰炸机。我们防御的任何削弱都会让他白天使用这些重轰炸机。


    `波兰` 和鹿特丹造成的巨大破坏是重轰炸机的结果，之所以能实现，是因为它们能够在白天作战。这就是敌人希望在这个国家造成的局面。到目前为止，他们并不成功，但现在不能放弃，否则就意味着承认了重大失败。


    我欢迎在 `Hexham` 建立喷式战斗机基金的建议，这既证明了我们战斗机的工作和责任得到了认可，也是增加防御的实用手段。”


    `Hexham` 妇女协会的领先成员 `Sadie Dodd` 敦促女性参与喷式战斗机基金，她说：“这是一个极佳的宣传。那些德国人每晚都来这里打击我们的士气，而这唯一的效果是让大群的人自发地集资购买喷式战斗机来击退他们。如果他们发现我们如此充满斗志，一定感到非常沮丧。”


    收集箱分到了酒吧和商店，向预期的捐助者寄送了私人信，并宣布将开展“英里 10 英镑票”活动。在一周内，捐款就超过了`£200`，不到两个月总额就达到了`£2,000`。到`1941`年
    1 月初，在五个月内就超过了目标，从特别筹款到个人捐赠，每月流入`£1,000`。组织秘书是 `J.F. Macgregor`，他领导着一群自愿的助手团队。

