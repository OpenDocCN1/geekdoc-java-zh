    住在 Acomb 米勒斯菲德（Millersfield）的莎拉·贝尔（Sarah Bell）在 1939 年以前在里兹代尔（Ridsdale）担任女仆，并迅速志愿加入了陆军（Land
    Army）。她的第一个驻地是位于贝尔赛（Belsay）附近的东肖夫农场（East Shaftoe Farm）。她每周工作七天，挤奶、喂牛、驾驶拖拉机——她还成了精练的马犁手。不过她也有时间小憩一下。每周，女孩们都会去当地的村会堂（通常在贝尔赛或柯克韦尔普灵顿（Kirkwhelpington））参加周五晚舞会。在那些年里，她们建立了深厚的友谊，对贝尔夫人来说也是如此。她在东肖夫农场的陆军战友玛丽·汤森（Mary
    Thompson）成了她的好朋友，后来还当了她的伴娘。


    不过，贝尔夫人对某些社交经历并不感冒。有一次，陆军的女孩们聚集在莫普斯（Morpeth）领取代表其服务等级的菱形别针，这就像士兵的条纹一样。在百般劝下，她最终被说服和他们一起去一家酒馆庆祝。当时她才
    25 岁，这是她第一次进酒吧。她说：“我从小就不习惯那种地方，所以我没待多久——他们中有些人只是为了喝酒。我很怕会有认识我的人走进来。”


    她对那些被招来协助收割的临时工动力也留不了什么好印象。“他们以前会从阿辛灵顿（Ashington）来人帮忙摘土豆，每个人都有自己固定的任务量。但是，如果你不盯着他们，他们就会把自己的份儿也推给你做。阿辛灵顿的那群人真是奇群魔种！”


    海克斯姆（Hexham）的议员道格拉斯·克利夫顿·布朗（Douglas Clifton Brown）在镇上的一场陆军集会上赞扬了陆军女孩的工作，并表示，这些陆军女孩的重要性与食品运输船的船员或护卫运输队的船只不上下。虽然他并不希望轻视空军妇女队（WAAFs）在预测器上的工作、陆军辅助队（ATS）在炮位上的工作以及皇家海军女子辅助队（WRNS）在其他战场的工作，但在许多情况下，她们所做的是与战前完全相同的工作。许多陆军女孩承担了对她们来说完全全新的工作，而且这些工作并不轻松也不愉快。


    ![Image](img/f0097-01.jpg)


    泰因代尔（Tynedale）的女孩被鼓励加入领土辅助队（Auxiliary Territorial Service），为战争努力贡献力量。


    女性贡献力量的不仅仅是陆军。1941 年 10 月，曾有一份呼吁泰因代尔的女性加入领土辅助队，这是武装部队设立的一个分支，旨在让女性承担士兵的常规工作，从而释放男性去执行战斗任务。


    泰因代尔有 300 个名额等待填补，年龄在 17.5 岁到 43 岁之间，如果是退伍军人则为 50 岁。通过《快报》（Courant），来自劳工和国家兵役部发给当地女性的消息说：“提醒海克斯姆的女性们她们所属著名郡团——皇家诺森郡掷击团（Royal
    Northumberland Fusiliers）的辉煌战绩，告诉她们不要让家里的男人丢脸。”


    基本工资为每天 1 先令 8 士，虽然仍是私薪，但根据承担的工作和通过的熟练测试，可以增加到每天 2 先令 10 士甚至 3 先令 4 士。根据职业，中士每天收入约
    4 先令 6 士，而上士士的工资每天可达 9 先令 4 士。


    ### 火神星飞行员


    来自格林黑德（Greenhead）的前《海克斯姆快报》记者伍德鲁·雷恩（Woodrow Raine）军士飞行员本人也成为了新闻焦点，因为他拍了坐在火神星探险
    1 号”（Venture 1）战斗舱内的照片，这架飞机是由米德兰银行（Midland Bank）员工的捐款购买的。在写给银行员工的一封信中，雷恩军士飞行员用典型的英帅的英国空军风格写道：


    “抱歉没有立即回复，但正如你们想象的，我们最近忙于在法国度假，并与梅塞斯密特 109 战斗机享受茶会。


    ‘探险 1 号’是一台伟大的机器。我拥有它大约六个月了，在过去的两三周里，我们确实共同度过了生活，它现在几乎可以在法国上自动飞行。它受到的唯一损伤是升降器上的一个弹孔，那是我在法国的一个机场用机枪扫射
    109 战斗机时留下的。我在 30 英尺的高度飞过，扫射了两架 109 和一些站在停机道上的纳粹分子。从他们向我射出的火力量来看，一定有人对此有异议，但我们只中了一个弹孔就逃脱了。”


    ![Image](img/f0098-01.jpg)


    前《快报》记者伍德鲁·雷恩军士飞行员，坐在米德兰银行员工资助的火神星“探险 1 号”上，他在其中‘享受在法国度假并与梅塞斯密特 109 战斗机享受茶会’。雷恩军士于
    1941 年 8 月 21 日被击身亡，安葬在加莱海峡（Pas de Calais）的圣奥梅（St Omer）。


    遗憾的是，雷恩的运气并不长；1941 年 8 月 21 日，他的火神星在敦刻尔克（Dunkirk）附近被一架 Me109 击落。他被葬在圣奥梅的龙内瑟纪念园（Longuenesse
    Souvenir Cemetery）。不过他也曾经历过险，他在 1939 年 2 月加入英国皇家空军预备队（RAFVR）成为学员飞行员。他于 9 月 1 日被征召，在完成训练后，于
    9 月 19 日在哈沃登（Hawarden）第 7 作战训练单元（OTU）转入火神星，结果起落架塌了，飞机头朝下落地。


    ![Image](img/f0099-01.jpg)


    1942 年 6 月发起了一项“每周一分钱”运动，旨在为战俘的红十字包裹募集资金。


    在 1941 年的夏末，一群佩满勋章的战老兵聚集在哈德里亚墙（Hadrian''s Wall）的阴影下，第 4 团陆军的军士们聚在一起复习现代方法。现场没有讲座，只有关于命令的下达与接收、第五纵和伞兵的危险与方法，以及如何应对他们的讨论。猎弹枪在游击战中的用法得到了演示，但当每个人都发一把猎弹枪时，千疮百孔的靶子表明，这些战壕老兵在使用上不需要指导。


    一名正规军官解释了《国王条例》，在进行进一步练习后，他们躺在床上，《快报》的记者注意到：“对于许多人来说，睡帐篷并不是什么很舒服的新奇体验，但在筋疲力尽的一天之后，再加上无穷的轶事和过去的战争经历作为助酒，甜美的睡眠很快降临在他们身上。”


    ![Image](img/f0100-01.jpg)


    来自拉姆肖·汉斯坦沃思（Ramshaw Hunstanworth）的玛格丽特·皮登（Margaret Peaden），她在 91 岁生日生日时为士兵织袜子。


    周末活动对陆军成员来说非常受欢迎，以至于几个人预订了后续课程。


    ### 周日游戏——有罪还是无罪？


    是否允许在周日在普鲁姆（Prudhoe）的公园里玩游戏这一棘手问题，在普鲁姆市政委员会（UDC）的会议上引发了神学分歧。会上牧师罗伯森（（Rev. R.E.
    Robson）表示支持，而圣约翰普鲁姆和普鲁姆站公会教会以及主日观察协会则强烈反对，后者认为遵守主日比以往任何时候都重要。


    '
