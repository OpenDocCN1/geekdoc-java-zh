    他说：“她是一艘迷人的小船，当然，赫克斯姆和诺森伯兰郡的所有人都曾资助并领养了她。她有一段非常精彩的经历，但当她沉没时，三分之二的船员丧生了。在幸存者，还有一些人回到岸后去世了。当我跳入水中的时候，脱掉了所有的厚衣服，包括靴子。但当我被发现时，他们一眼认出了我——头上还戴着我的海军帽。那是我最后一个没想过要掉的东西！”


    工程师隆（Ron）讲述了这一事件是一个非凡的巧合，因为大约十八个月前，`Tynedale` 号曾对同一艘 `U-boat` 发射射击，并以为击沉了它，但事实并非如此。那艘
    `U-boat` 对 `Tynedale` 号报了复仇，但第二天又被盟军部队击沉。


    但战争是国家之间的战争，而不是个人的。`U-593` 号的舰长 `Gerd Kelbling` 在沉没中幸存，战后他与隆互寄了多年圣诞片。


    当赫克斯姆拥有 `HMS Tynedale` 号时，哈尔特威斯特（Haltwhistle）举办了自己的“军舰周”，筹集了 52000 英镑来赞助拖网式扫雷舰
    `HMS Hornpipe`，并成功筹集了超过 86000 英镑；而普鲁霍（Prudhoe）需要筹集 15000 英镑来装备一艘动力快艇，实际上筹集了 37700
    英镑。北泰恩地区被负责筹集 4 万英镑，以领养并装备拖网式扫雷舰 `HMS Birdlip`，成功筹集了 65000 英镑，相当于该地区每人约 10 英镑。


    随着战争局势开始转变，在中东，一名赫克斯姆士兵因医疗技能被德国人俘留，而他所属部队的其他成员被德国俘俘释放。`列纳德·C.B. 沃德`（Leonard C.B.
    Ward）是著名律师 `Septimus G. Ward` 之子，在中东的一场战斗中被德国人俘。一位同事给姐姐写信说，在战斗期间，`沃德下士`表现得模范，完全无视危险。他说：


    “当无法再进行抵抗且我们被包围时，他依然保持着冷静，只要俘虏者允许，他就去照料伤员，无论是英国人还是德国人。


    我深信，通过在猛烈火力下的果断行动，他救了至少两个人的生命，正是这种极其人道的工作让他被留为俘虏。当德国人发现自己要掉战斗时，他们释放了我们，无疑是因为我们在撤退时会对他们造成障碍。然而，`沃德下士`被敌人留下了，我只能猜测理由是为了照顾敌方的伤员。”


    ![Image](img/f0114-01.jpg)


    在西沙漠，`皇家诺森伯兰掷弹团`侦察团（`Recce Regiment`）的人竟然能找时间踢足球，当时他们正准备进入利比亚。照片是由来自赫克斯姆的`莱昂·史蒂芬森上尉`（Lionel
    Stephenson）拍摄的，他在照片发表两个月前在战斗中牺牲；同样来自赫克斯姆的`掷兵马特·杨`（Matt Young）（后排左二）随后被俘，而同样来自赫克斯姆的`连队军士大卫·福斯特`（David
    Forster）（后排右三）则于 7 月 17 日在战斗中牺牲，并安葬在特黎斯。


    当住房危机席卷该地区时，`普鲁霍地方委员会`（`Prudhoe UDC`）致信`卫生部`，希望重新开放一些冲突前被认为不宜居住的房屋。镇牧师`R.E. 罗布森议员`（R.E.
    Robson）表示，越来越多的人涌入该地区，但可提供的住房还没有一个空肥皂箱多。


    两名男子在他们乘坐的坦克在斯塔格肖（Stagshaw）附近的比威克莱银行（`Bewclay Bank`）无法通过 S 弯道时翻了。他们来自阿尔尼克的小霍顿（Littlehoughton）的发动机修理师`罗纳·克罗尔`（Ronald
    Crole）和来自纽卡斯尔机械检验员`爱德华·内特尔顿`（Edward Nettleton）。来自布莱伊登（Blaydon）的坦克测试员`利物弗·理查森`（Oliver
    Richardson）驾驶员受了割伤和瘀伤逃之生。


    超过 1000 名学生聚集在赫克斯姆的`中央卫公会堂`（`Central Methodist Hall`），听取`BBC`传奇广播员`Romany`带来的自然讲座，并配有黑板画。他在开始演讲时对他只著名的英国梗犬`Raq`缺席表示歉，并解释道：“由于汽油短缺，我无法开车，如果我带着`Raq`坐拥挤的公交，人们会踩在它的脚上，它并不喜欢，所以我不得不把它留在家里。”


    `Romany`是历史上第一个野生动物节目节目，他坐着由马“逗号”（Comma）拉着的吉普赛马车，和他的两个年轻伙伴玛丽埃尔（Muriel）和迪莉丝（Doris）走遍全国，拥有巨大的追随者。


    现实生活中，`Romany`是卫公会牧师`乔治·布拉韦尔·埃文斯`（George Bramwell Evens），因他的《跟随罗马尼出去》（`Out with
    the Romany`，后改为`Out with Romany`）节目而闻名，该节目于 1933 年在`BBC`的《儿童时间》中开始。他的职业经历包括在卡莱斯尔的`卫公会中央厅`度过的十二年。


    ### 空军英雄被俘


    1942 年 5 月，赫克斯姆屏息以神，因为当地英雄`亚瑟·加尔韦飞行尉`（Arthur Garwell DFM）在`兰开斯特`号轰炸机对德国南部奥格斯堡的`M.A.N.`柴油厂进行著名的低空空袭后据报失踪——当确认他在目标上方遭到炮弹命中后，在燃烧的`兰开斯特`号上完美迫陆并被俘后，大家才松了一口气。


    ![Image](img/f0115-01.jpg)


    来自橡木伍德的`亚瑟·约翰·加尔韦飞行尉`（Arthur John Garwell）在敌领土上完成三十轰炸任务后，被授予`卓越飞行勋章`。


    `加尔韦`是英国空军帅气“发蜡男孩们”（Brylcreem Boys）的缩影。他出生于 1920 年 2 月，于 1939 年 5 月加入`皇家空军预备役队`，在获得飞行许可后，于
    1940 年 9 月被分配到位于斯坎普顿（Scampton）的第 83 中队，这是一支`汉丹`机群。从那时到 1941 年 3 月，`加尔韦`完成了一次完整的作战任务，大部分时间攻击防御严密的德国目标——因此两次访问了柏林、不莱梅和科隆，并至少三次前往了汉堡、马格德堡和威廉斯哈芬（Wilhelmshaven）。


    不同寻常的是，他在 1940 年 12 月还在伯明山上执行了一次夜间战斗任务。1940 年 12 月 22 日至 23 日夜，他被迫从德斯绍（Dessau）转向埃姆登（Emden），并在返回途中因油箱几乎为空而迫降。他后被分配到芬宁利（Finningley）的第
    25 号飞行训练学校（OTU）担任教官，并授予了`DFM`勋章。


    `加尔韦`于 1941 年 11 月加入博斯康姆唐恩（Boscombe Down）的`兰开斯特`强化飞行飞行队，在该基地他偶尔担任`J.D. 内特尔顿队长`（J.D.
    Nettleton）的副驾驶。到 1942 年 4 月，他已成为`内特尔顿`的得力助手。在执行`奥格斯堡空袭`任务的乘坐中队卡车出发途中，两人约定如果遭到战斗机攻击，将不采取避让动作，而是保持航线。`加尔韦`说：“唯一的解决办法就是直冲并保持地面飞行。如果有人受伤，我建议他收油门并向前迫陆。”


    在这次大胆的日间掠地式空袭中，`兰开斯特`号遭到了德国战斗机的波攻击，在他的小组中，`加尔韦`是唯一一个到达目标并释放四枚 1000 磅弹的人。他刚一这样做就遭到了防空火力。随后发生的情况在拉尔夫·巴克（Ralph
    Barker）的书《猛击，准击》（`Strike Hard, Strike Sure`）中记载：


    ```

    ‘当加尔韦听到他的无线电员弗克斯（Flux）在他耳边大喊：“我们着火了！”弗克斯不断指着他的肩膀，加尔韦迅速回头了一眼。通往机身的装甲门开着着，内部是一片火海。“关上门！”加尔韦命令道，他决定立即迫陆，而不是尝试爬出去并跳伞。五名机组成挤在前面的驾驶舱里，但火墙后面还有两个人。’

    ```

