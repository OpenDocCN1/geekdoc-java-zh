  trans: '

    在青少年时期，来自辛德霍普（Sinderhope）的前农夫西里尔·福西斯（Cyril Forsyth）结识了意大利战俘阿尔伯托·卡特纳（Alberto Catena）。阿尔伯托和其他十几个意大利战俘在他父亲莱克（Alec）的海高阿顿（High
    Acton）农场从事排水工作。阿尔伯托是唯一一个与家人聊天并和他们一起喝酒的人。在离开之前，阿尔伯托送给了青少年时期的西里尔一个手工烟草盒，上面刻着他的名字以及阿尔伯托的名字、日期
    `6-5-1944`、“卡顿（Catton）”、几枝冬青枝条、一个老式灯笼和一只猫。西里尔回忆道：“他从未提过自己是如何被俘的或任何事情。我觉得他做这些事非常好。他一定有一把小别针和锤子。我想他可能把它送给我是因为我的家人对他表现出的善意，而且这对他来说也是一种消遣。”


    西里尔记得曾在村子周围见过这些战俘，在 17 岁时，他甚至在卡顿的斯通霍尔农场（Stone Hall Farm）工作过，那里是战俘营的所在地。尽管他记得意大利战俘之间没有任何问题（他们并没有受到持续的看守），但他对那些经常守卫森严的德国人感到恐惧。他说：“我大约
    17 岁时在卡顿耕地，一看到德国人就直不起眼来。他们被一群持枪的哨兵包围着工作，”他补充道，“意大利人不想参加战争。他们从不谈论家乡。在异国他乡生活一定非常困难。”


    卡顿的意大利战俘还在阿伦·班克斯斯（Allen Banks）森林的山毛榉上刻上他们的战俘身份证留下了标记，比恩斯（Byrness）战俘卫星营 `667` 的囚犯们也做了类似的事情。


    在拉姆（Wylam）发生了一个有趣的进展，那里的德国战俘在当地农场工作时，总部设在尼森棚屋里。其中有一名木匠和一名石匠，他们决定为在棚屋周围布置的整洁花园里增添一些特别的东西。在短短八天时间里，他们在花园中建造了一座微型城堡，拥有四座塔楼、电力照明以及他们自己制作的精美挂毯和地毯。


    这座三英尺高的杰作是使用战友们从泰河（Tyne）河床抬起的石头制成的，屋顶是用营厨房回收的罐头做的。囚犯们还制作了家具、刺绣了挂毯，并为宏大的宴会厅织了地毯。电力从尼森棚屋引入，一种巧妙的自制设备允许正门以电子方式开闭。拉姆城堡甚至还有自己的装饰性喷泉。


    正门上方一个隐蔽的面板上写着“由德国战俘建造”，旨在作为他们在拉姆停留期间的永恒纪念。该城堡于`1947`年完工，在接下来的两年里吸引了数百名游客，但一些村民却对这个关于战争年代的提醒感到不悦，无论建造得多么巧妙。`1949`年
    5 月的一天，一辆卡车出现在现场，城堡从地基上抬起被运走，再也没有出现过……尽管传言仍在，据说它仍然在该地区某人的后院里占据着显眼的位置！


    ![Image](img/f0195-01.jpg)


    拉姆城堡，战后德国战俘建造的三英尺高建筑。


    ## 参考文献


    - 《赫克斯姆日报》（The Hexham Courant）报纸 `1939-46`。

    - Muriel Sobo 著，《诺森伯郡乡村女孩》（Land Girls of Northumberland）`1940-1950`。Northern Heritage
    出，`2003`年 4 月 1 日。

    - Russell Gray, Neil Anderson, Jonathan Shipley 和 Jim Corbett 著，《诺森伯郡空难》（Air Crash
    Northumberland）。Countryside Books 出，`2008`年。

    - Ralph Barker 著，《强攻，必必胜》（Strike Hard, Strike Sure）。Pen & Sword Military Classics
    出，`2003`年。


