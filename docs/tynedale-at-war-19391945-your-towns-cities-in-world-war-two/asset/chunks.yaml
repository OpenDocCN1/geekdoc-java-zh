    The Hydro had operated for around seventy years and its former guest list included
    the first Labour Prime Minister Ramsay Macdonald and his daughter Ishbel, and
    film stars Charles Laughton, Elsa Lanchester, Douglas Fairbanks Junior, Raymond
    Massey, Evelyn Laye and Dodie Smith.


    One of the more unusual cases to come before Hexham Magistrates in 1941 was that
    of a man accused of ill treating an elephant as it was being walked along the
    Corbridge to Haltwhistle Road. Corbridge vet Frederick Crudace was driving his
    car along the road when he saw elephant keeper Ivor Gordon Ross, of Ilkley, riding
    the animal. He was belabouring it with a very heavy ash stick and from time to
    time jabbing the animal behind the ears with the steel point of the implement.
    When the vet remonstrated with Ross over what he felt was gross cruelty, he merely
    laughed and smiled.


    On reaching Hexham Mr Crudace reported what he had seen to the police, as a result
    of which the RSPCA brought a charge of cruelty against Ross. A witness told the
    court that the elephant had not squealed or trumpeted while struck or jabbed,
    but it had ‘looked very tired’.


    Ross told the court he had been an elephant trainer for ten years and if he had
    mistreated the animal in the way Mr Crudace suggested, it would not have performed
    for him in the ring, where the act included a young girl putting her head in the
    elephant’s mouth. The case was dismissed.


    ### Perils at Sea


    The U-boat menace struck again when the ship Third Officer Derek Gilchrist, of
    Hexham, was aboard was sunk by a flotilla of submarines off the West African coast.
    The Hexham Queen Elizabeth Grammar School old boy spent thirty days in an open
    boat – a record for a journey of that type without a single casualty. Gilchrist
    told the Courant: ‘It was about 10pm when I heard the zoomp and thud, and knew
    that we had been pipped.’


    ![Image](images/f0086-01.jpg)


    Third Officer Derek Gilchrist of Hexham who spent 30 days at sea in an open lifeboat
    after his vessel was torpedoed and shelled by U-boats off the African coast.


    The lifeboats were lowered and Gilchrist found himself in charge of a boat crewed
    by nine Europeans and twenty-one Indians. As the dawn broke, they realised they
    had been separated from the other two lifeboats and the last they saw of their
    ship was a faint red glow as it burned in the far distance. With only a compass
    and a roughly improvised sextant to calculate their latitude Gilchrist set a rough
    course, and a gruelling journey of rowing and sailing got under way.


    Food and water was limited and strict rationing was imposed from day one. Half
    a ship’s biscuit and a third of a dipper of water was the basic ratio, augmented
    by a teaspoonful of condensed milk twice a day. The little corned beef on board
    was shared out every third or fourth day while a tin of sardines and some fish
    paste was eked out until it was finished on the very day they were picked up.
    Frequent bursts of torrential rain kept the water supplies topped up.


    Gilchrist said: ‘It was a pretty gruelling experience. We got weaker and weaker,
    and by the end found it difficult to stand. We only saw birds and flotsam and
    jetsam from wrecks as well as lots of sharks. The Indians took turns at baling
    out the boat as we had rather a bad leak at the stern. At night we played cards
    to pass the time. During the day it was unbearably hot and many of us suffered
    from scorching but during the night, especially after the heavy rain, we just
    sat and shivered.’


    Speaking of the crew, Gilchrist said he could not have wished for a better set
    of companions although he said: ‘We were rather afraid that the natives would
    not be able to stand the strain, and might cause trouble but they behaved splendidly.
    Tempers got a bit frayed at times but in spite of the mental stress, there were
    never any rifts. At no time was there any doubt of our reaching safety. We were
    always certain of being picked up and much of our conversation was about what
    we would do when we got back.’


    There was one false alarm when the crew saw a light on the far horizon and lit
    flares to attract attention, but it finally dawned as the light got brighter and
    rose higher in the sky that it was a star.


    They were eventually picked up when an Indian lookout spotted smoke from a ship
    and they sailed across its bows to attract attention. They were taken to a west
    African port, where some of the crew required medical attention, but there were
    no lasting ill effects. Gilchrist commented: ‘Looking back, I quite enjoyed it
    as an experience, but it was an experience no-one would wish to have repeated.
    While it lasted, it could only be described as hell.’


    It could easily have ended in the blazing wreckage of the British cruiser `HMS
    Fiji`, blown apart by German dive bombers during the Battle of Crete in 1941.
    But a young lieutenant clung to a spar from the ship’s capstan and somehow survived
    three hours in a dangerous sea still being raked by Luftwaffe bombs and bullets.
    That young sailor was Robert Johnson, who not only survived, but went on to forge
    a good career in the Bank of England, as well as becoming chairman of Tynedale
    Council, living to the ripe old age of 99.


    ![Image](images/f0088-01.jpg)


    Dame Beryl Oliver, head of the Voluntary Aid Detachment department in London,
    inspects nurses from the Hexham branch of the British Red Cross Society in Corbridge
    in May 1941.


    He was born at Whitley Bay in 1916, the younger of twins, but sadly his brother
    Brian died tragically while walking in the Italian Dolomites at the age of 41.
    The young Robert attended Tynemouth School before going on to the Royal Grammar
    School in Newcastle.


    His working life began in insurance and banking in Newcastle, before he obtained
    a director’s nomination to join the Old Lady of Threadneedle Street and started
    work in London in 1936. However, the cost of living in the capital did not appeal
    and he was glad to be posted to the bank’s Newcastle branch, where, as events
    took a turn for the worse in Europe, he joined the Tyne Division Royal Naval Volunteer
    Reserve at `HMS Calliope` on the Tyne as a sub-lieutenant.


    In August 1939, a month before the war started, he was ordered to join a Royal
    Navy cruiser on the East Indies station – but before he was allowed to leave,
    he had to arrange for someone to do his job at the bank. He had a week to train
    an 18-year-old girl called Joan to fill his shoes and, although they only met
    once in the next six and a half years, he remembered her radiant smile and gentle
    nature. They were subsequently married for 68 years.


    He first served on the cruiser `HMS Manchester` and was involved in the 1940 invasion
    and evacuation of Norway, as well as taking part in the Battle of Cape Spartento
    when the Italian fleet was driven off. Then came traumatic involvement in the
    Battle of Crete, when he was a gunnery officer aboard the Royal Navy light cruiser
    `HMS Fiji` which was operating with the destroyers `HMS Kandahar` and `HMS Kingston`
    shortly after the loss of the cruiser `HMS Gloucester`. These ships fought on
    and shot down one attacker and damaged two others before running out of anti-aircraft
    ammunition, becoming sitting ducks for the Luftwaffe who, according to contemporary
    accounts, were so numerous as to turn the sky black.


    After being hit by several bombs from Messerschmitt Bf 109 `Fiji` lost power and
    came to a standstill, and was then struck by three bombs dropped by a Junkers
    Ju 88 dive bomber. Soon after the order to abandon ship was given `Fiji` rolled
    over and sank, and Robert was thrown into the water. He managed to grab hold of
    a capstan spar, to which he clung for several hours as the other two ships were
    driven off after dropping life rafts.


    `HMS Kandahar` returned under cover of darkness and picked up Robert, now unconscious
    but still clinging to the capstan. He was among 523 survivors, but 241 men were
    killed when the ship sank to the seabed.

    '
