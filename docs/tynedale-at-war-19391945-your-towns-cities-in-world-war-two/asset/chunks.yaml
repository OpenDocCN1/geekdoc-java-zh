  trans: '

    然而，关于一架梅塞斯密战斗机在诺森伯兰郡荒地上低空飞行的报告，被米德克斯`RAF Fighter Command`（皇家空军战斗指挥部）的人员付之一于笑，因为`Ottercops`的可靠性口碑并不好——它以无法区分雷暴天气和来袭飞机而闻名。该设施的设计旨在为敌方攻击提供远程预警，但其提供的情报在去年曾受到质疑，当时在
    1940 年 8 月，它报告有三十架敌对飞机从北方向接近海岸。但当`Ottercops` 派遣四架`喷式`战斗机冲入云霄时，他们惊恐地发现竟然有 21 架战斗机护送的
    90 架德国轰炸机！


    ### 奥特科普斯事件


    女子空军辅助队军士费莉西蒂·阿什比（Felicity Ashbee）记得，1940 年 5 月 10 日的晚上原本无事可做，直到`战斗指挥部`的地图上出现了一个标记点——在北海深处，诺森伯兰郡岸外——被`Ottercops`的雷达捕捉到了。值班的三名成员大笑起来，心想那些乡下人又搞混了。


    最初绘图时，那架梅塞斯密战斗机的高度约为 15,000 英尺，以每小时 300 英里的速度几乎正西飞行。`Ottercops`将这次潜在袭击报告为“三架以上”，但随着飞机的接近，其他四个站点（Danby
    Beacon、Douglas Wood、Bamburgh 和 Cresswell）正确识别出它是单架飞机。这架飞机被命名为“42 号袭击”。当它距离海岸 50
    英里处时，已报告给位于`RAF Ouston`的英国皇家空军`第 13 战斗群`，并在 22:30 派遣了一架`喷式`战斗机升空拦截。


    ### 赫斯在英国


    整整两天后，BBC 的一场广播揭露了赫斯——纳粹党副领人和希特勒的左右手——以一种相当不体面的方式降落在格拉斯哥郊外，赫斯在那里透露他想会见汉密尔顿公爵，他认为自己可以与此人做生意。尽管汉密尔顿上校事后坦言他对自己为何被选中感到非常困惑，但赫斯相信他们对航空的共同兴趣、战前避免英德爆发战争的愿望，以及与阿尔尔布雷希·豪泽霍费（Albrecht
    Haushofer，卡尔·豪泽霍费之，地缘政治教授，希特勒劫持的“生存空间”哲学的主要建筑师）的友谊，将为谈判铺平道路。


    赫斯穿上德国空军的`hauptmann`（上尉）制服，配备了一台徕卡（`Leica`相机以及许多治疗他真实和虚幻疾病的药物——众所周知有些疑病症。他背诵了飞行路线，然后将飞行计划绑在大大腿上。赫斯飞越北海时，其航线使他一直保持在英国雷达的视线之外，距离英国海岸至少
    200 英里。天气晴朗，当他转向正西并开始接近东北海岸时，满月正升起，但距离日落还有一小时，他担心会被`皇家空军`战斗机发现并击落。


    他后来告诉汉密尔顿公爵，他通过在海岸附近盘旋 40 分钟直到太阳落下来补偿。赫斯飞行得太快，无法被拦截，他在后来写给妻子的信中说，他在那个阶段正全速飞行，很享受其中。他说他爬上了海拔
    2,676 英尺的切维特山（The Cheviot），滑向另一侧进入苏格兰。赫斯在黑暗中没有发现汉密尔顿的邓加维尔别墅，错过了目标。当燃料开始耗尽时，他决定跳伞伞。


    ### 降落与后续


    飞机坠落在格拉斯哥以南 10 英里的 Bonnyton 荒地，而他降落在附近的一个农场。他被首席耕农大卫·麦克林（David McLean）发现，麦克林问他：“你是德国人吗？”赫斯回答：“是的，我是阿尔弗雷德·霍恩上尉——我给汉密尔顿公爵带了重要消息。”


    麦克林的老母亲为这位挑剔的赫斯泡了一壶茶（但他拒绝了，要了一杯水），同时赞赏着他剪裁得体的制服和名贵手表。一名农夫被派去寻找权威人士，赫斯很快就前往了伦敦塔，那是他在几个月里被关押的三个监狱中的第一个。他曾两次试图自杀。期间，德国广播的一则公告称赫斯飞过了这个国家，并补充说这位副领袖多年来一直遭受幻觉和精神疾病
    1。


    尽管有力证据表明他确实有精神疾病，但在纽伦堡军事审判中，赫斯被判定具有辩护能力。他被指控了许多罪名，包括策划发动战争和发布了被`清除`的指令。


    ### 当地新闻与报道


    一名 26 岁的男子险些逃生，他的岳母 I·哈德斯通顿夫人（Mrs I. Huddestone）从窗户目睹了这一幕，她在约翰之前看到了火车，但由于震惊过度没能大喊。“在撞击的那一刻，我闭上了眼睛，然后对我的女儿大喊车已经没了。轨道上剩下的只有一个掉落的轮毂，我从没想过能再次见到约翰。”


    然而，约翰不仅仅受了轻微的割伤和淤青，而且当天就回了家。他说：“汽车原本运行得完好，但在铁路中间熄火了。我正在检查仪表盘和自启动器时，听到火车过来了。我抬头一看，引擎离汽车只有
    20 码了。我除了坐在驾驶位上闭上眼睛，没时间做任何其他事情，只能希望最好的结果。等我再次知道时，已经在车外了，脸上的小伤口贴着胶布。我对那次事故完全没有记忆了。”


    1941 年 1 月还引入了学校餐饮（起初被称为集体供餐），在伊丽莎白女王女子文法学校的舒适食堂里提供供应。约 140 名孩子分两批用餐，每单餐费用为 4
    便士，每周 1 英镑 3 便士，同一家庭的两个孩子每周费用为 2 英镑 4 便士。费用仅涵盖了购买食品的成本，剩余部分由县教育委员会承担。


    位于科布里奇（Corbridge）的一家咖啡馆老板被罚 10 先令，并被令支付 30 先令诉费，因为她被发现卖水牛奶。一名来自县衡量部门的男子在 River
    View 咖啡馆购买了一杯热牛奶进行测试，发现其中含有 36%的加水。事实证明，两品脱牛奶中加入了一品水，但被告辩称热牛奶是误提供的，因为它原本是留用来冲咖啡的。


    舞台和银幕上那些不可挡的喜剧大师杰克·赫尔伯特（Jack Hulbert）和西莉·库特尼奇（Cicely Courtneidge）在赫克斯姆（Hexham）的论坛剧院亲自亮相，为所有武装人员表演了一场特别的免费午场。剧院楼下所有的座位都留给了官兵，这场演出之所以能够实现，是因为这些伦敦戏剧影星是赫克斯姆
    Summerrods 的 P.P.菲利普斯夫妇的好友。

