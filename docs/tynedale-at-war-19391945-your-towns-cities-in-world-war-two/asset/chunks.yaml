    It was the first time the new air raid siren, weighing 5.5cwt, had been used since
    its installation on the police station roof, which had to be specially reinforced
    to bear the weight. It was quickly pointed out that the new siren could not be
    heard at `Lowgate`, only a mile outside `Hexham`, while it was clearly audible
    at `Ovington`, 12 miles further away down the `Tyne`. A strong west wind was blamed
    for the problem.


    Back in 1939 Tynedale, like the rest of the country, was starting to come to terms
    with the fact that the ‘Peace in Our Time’ pronouncement of Prime Minister `Neville
    Chamberlain` a year earlier might not be worth the piece of paper it was written
    on, as `Hitler` and the `Third Reich` were behaving in an ever more provocative
    manner.


    However, there were still hopes for peace, decorated First World War soldier `Benny
    Plummer`, proprietor of the `Hexham Courant` newspaper, told fellow members of
    `Hexham Rotary Club` after a visit to `Freiburg` in Germany’s Black Forest region.
    With a reference to the German re-armament mantra ‘guns, not butter’, Mr `Plummer`
    commented wryly: ‘Although we saw plenty of butter, we did not see a single gun,
    except in a railway siding on the way home.’


    Mr ` Plummer` said he found the German people warm-hearted and he had met with
    nothing but friendliness and kindness. He added: ‘You might force people to be
    cordial by propaganda, but you cannot beat human kindness into people if it is
    not there already. I was left with the feeling that the German people do not want
    war any more than we do and the last thing they want to contemplate is war with
    us. The German regular army is against the war, but it appears that by degrees,
    the Nazi storm troopers will become top dogs and the regular army will be pushed
    into the background.’


    Mr ` Plummer` said that in `Freiburg` at least, British Prime Minister `Neville
    Chamberlain` was looked upon as a god, as the one man whose efforts had averted
    war in September 1938, while Herr `Hitler` was also seen as something sacred.
    ‘His photograph is everywhere. He must have had thousands taken because there
    seemed to be a different one in every place we visited.’


    While `Hitler` was revered, the other German leaders were not so popular, with
    Mr `Plummer` declaring: ‘Goebbels` is hated and `Streicher` is cordially disliked,
    while `Goering` is treated as a general joke. Whenever he appears on the screen
    the audiences break into howls of laughter. If they can laugh at a man like `Goering`,
    perhaps there is hope for them.’


    He also noted that everywhere in Germany was spotlessly clean and everyone wore
    a uniform of some kind, so he never knew whether he was speaking to a soldier
    or a postman. He was also aware that while `Freiburg` lay only 10 miles from the
    French border, there was no sign of any air raid precautions being taken.


    ![Image](images/f0011-01.jpg)


    Ready for action – men of the `Hexham`, `Haltwhistle`, `Newburn`, `Bellingham`
    and `Prudhoe` detachments of the `4th Battalion Royal Northumberland Fusiliers`
    on the march for their St George’s Day parade in April 1939. St George was the
    regiment’s patron saint.


    It was clear the ordinary Germans did not even pretend to like the Jews, but he
    felt that many of them were unaware of the atrocities being committed against
    them. The Germans made it clear though that they preferred the Jews to the Italians.
    Shortly after the Axis agreement was signed, a party of Italians had gone into
    `Freiburg` for a night out, but the young women of the town had refused to leave
    their homes after seven o’clock at night.


    However, in other quarters there was still a deep mistrust of Germany and its
    Italian allies, with Judge `John Richardson` warning the annual dinner of the
    `Corbridge` branch of the `British Legion` in February of the unpredictable nature
    of the dictators `Hitler` and `Mussolini`. He said:


    ‘There is no doubt that the individual German desires to be friendly but when
    you get a lunatic dictator in charge, anything can happen. There is no doubt that
    `Hitler` and `Mussolini` have done a good job for their countries but they have
    got their people under their thumbs. If they question anything their government
    does, it means the concentration camp or worse.


    There are authenticated cases where children have reported their parents to the
    authorities for private conversations in their own houses, for the children have
    been brought up to believe there is only one loyalty and that is to the German
    nation. I cannot believe that the majority of the German people approve of the
    horrible persecution of the Jews, but they dare not say anything because of the
    thraldom they are under.


    It is quite clear that the only thing which will avoid war is to show them we
    are prepared, and then these dictator nations will not dare to trample on the
    lion’s tail.’


    Even though memories of the First World War were still all too fresh in the memory,
    with empty chairs round every fireside, a call to register for `National Service`
    – the civil defence force – was met with an eager response across `Tynedale`.
    Among those registering, within the first days of booklets being issued, were
    an 84-year-old man and his wife.


    At `Prudhoe`, there was concern the town was right on the edge of the `Tyneside`
    heavy industry zone and would be in potential danger from German air raids. `Prudhoe
    Urban District Council` therefore launched an investigation into whether any of
    the local disused coal mines could be employed as air raid shelters.


    While protective trenches had been dug at `Castle Dene`, they were only capable
    of accommodating around 10 per cent of the population and Councillor `T. Peel`
    asked: ‘Where are the other 90 per cent to go? Despite all the instructions, panic
    would occur when there is an air raid, and I think the disused drift mines would
    be the natural place to which the people of the district would flee.’


    It was noted that the trenches were not intended to serve the whole town, but
    only those who might be caught in the open during an air raid. Council chairman
    Councillor `Ada Blackburn` pointed out the question of using the old mines for
    shelter had been considered before, and it was felt the pits were too far away
    from the main part of the town. In addition, a moving line of people would present
    an easy target for the raiders.


    In April of that year, the leader of the `British Union of Fascists`, `Sir Oswald
    Mosley`, was warmly applauded when he addressed a meeting of the `Rotary Club
    of Hexham` at the `Royal Hotel` in the town, where he insisted that war with Germany
    was not inevitable. ‘We have nothing to fear from Germany if we have the wit to
    hold and develop the resources which our grandfathers had the courage to win for
    us,’ he said.


    He had a four-point plan to maintain peace in Europe, starting with the need to
    show disinterest in the east of the continent, asking: ‘Why do we have to be allied
    to every little country in the east?’


    In return for staying out of affairs in the east, `Mosley` said that Britain should
    enter into a disarmament pact with Germany:


    ‘We must look after and build up the greatest heritage known to man: the Empire
    of Great Britain. Who are we to cower in fear before any foreign power and to
    believe that we cannot face Germany unless we have `Colonel Beck` [Polish foreign
    minister] holding one hand, and `King Carol` [of Romania] the other? Why should
    we run round seeking alliances with every little country in Europe, and telling
    them we would come to their aid when attacked if they would send their army to
    help? Why are we guaranteeing the independence of Poland and Romania?’


    He pointed out that Poland was undercutting the British coal industry with coal
    obtained by sweated labour from mines developed by British finance from the `City
    of London`. Romania exported wheat, every grain of which meant less money for
    British and Canadian farmers.

