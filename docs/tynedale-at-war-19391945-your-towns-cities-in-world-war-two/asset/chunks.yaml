    Convention was turned on its head when the Labour Party announced it would be
    opposing Hexham’s MP, Colonel Douglas Clifton-Brown, at the 1945 General Election.
    Colonel Clifton-Brown was Speaker of the House of Commons, and it was traditional
    that the Speaker was returned unopposed. The Labour candidate was Ernest Cavanagh,
    of Leeds but the Speaker was returned with a 4,645 majority.


    Mr Kavanagh argued he was not opposing the Speaker, as Colonel Clifton Brown had
    vacated that position when Parliament was dissolved, and he was simply the Conservative
    candidate. Colonel Clifton-Brown did not stand under any party label, just as
    The Speaker, and he was returned with a majority of 4,645. He polled 16,431, while
    Mr Kavanagh registered a creditable 11,786.


    The Hexham Group Hospital Supply Depot, which was established in the early days
    of the war, closed at the end of June 1945, by which time it had dispatched more
    one million comforts and surgical supplies to servicemen, hospital patients and
    needy civilians. More than 1,000 miles of bandages had been rolled, 1,000 miles
    of material used in the surgical department and 200 tons of wool knitted into
    comforts. An average of 300 people were working at the depot throughout the war,
    and more than 4,000 had contributed to the work of the depot over the years. Around
    £20,800 had been raised for the depot by way of subscriptions and voluntary efforts,
    but the initiative was largely self-financing because of the fact the canteen
    at the depot, run by Mrs T.M. Robson, had served more than 26,000 meals.


    Chairman of the depot committee Mrs Norman D. Newall said: ‘It is totally illogical,
    but there is complete gloom at the closing of the depot, because it will be a
    big wrench for many workers who have worked so happily and willingly together
    during the war years, and made so many friendships.’


    As the trickle of prisoners returning home from PoW camps in Germany became a
    flood, there was embarrassment for Hexham police when four prisoners awaiting
    trial on housebreaking charges escaped from Hexham Police Station by removing
    bricks and stones from their cells and clambering to freedom through the hole
    in the wall. The four were at large for twelve hours, before being recaptured
    in Whitfield.


    Hexham Magistrates heard that the four men had been allowed to use the exercise
    yard at the rear of the police station, as it was a warm night. They were checked
    at 7pm and found to be all present, but a further check at 9pm revealed that both
    cells and exercise yard were empty. They had prised stones and bricks out of the
    wall of the exercise yard using a iron bar wrenched from shutters in the cell
    passage, as well as a drainpipe ripped from the wall of the exercise yard. They
    created a hole 2ft long, 18in high and 18in wide.


    Three months after VE Day, people were were dancing in the streets of Hexham in
    the early hours of the morning when news of the Japanese surrender spread. Bonfires
    were lit and fireworks were in great demand, not only by the children, but also
    by the blue clad convalescent patients from the Emergency Hospital, who took great
    delight in dropping firecrackers where least expected. One young man from Stocksfield,
    Bevin Boy Alan Lynn (19), found himself in court when he set off a celebratory
    thunderflash during the showing of a film in the Prince’s Cinema in Corbridge,
    and was fined £2.


    Allendale really let its hair down, with the usual bonfire and fireworks supplemented
    by a parade of tableaux, featuring Churchill, Uncle Sam, Stalin, Chiang Kai-shek,
    and, bringing up the rear, Hitler and Japanese leader Hideki Tojo, roped together.
    There were street parties and dances across the district despite the shortage
    of food through rationing.


    ### David Bell


    As one of the dashing young men who were among the first to fly aeroplanes from
    ships in time of war, Stocksfield’s David Bell belonged to an elite class of fliers.
    But David had his own special claim to fame, even among the top notch aces of
    the Fleet Air Arm. As a Navy pilot he took off from an aircraft carrier in the
    final stages of the war in the Far East. His squadron was due to carry out bombing
    raids on Japan, but just days before, the dropping of the atom bomb brought hostilities
    to a close. However, he still had to fly missions uncomfortably aware that news
    of the surrender had not reached all members of the Japanese forces.


    Following VJ day, David flew one of twelve aircraft sent on a reconnaissance mission
    to Kai Tak airport in Hong Kong, still in Japanese hands. With little more than
    fumes in his fuel tank, he touched down at Hong Kong airport – and was more than
    a little alarmed to see a Japanese staff car bearing down on his aircraft as it
    came to a halt. He clambered out of the cockpit just as a number of senior Japanese
    officers were getting out of the car. One of them came up to David and handed
    him his ceremonial sword – he had surrendered the entire airport to David’s tender
    care! The sword was among David’s proudest possessions and was displayed for the
    best part of forty years in the hallway of his home in Batt House Road, Stocksfield.


    David was born in Wallsend in 1924, and at the beginning of the Second World War
    he was evacuated to Alnwick with the rest of Wallsend Grammar School. At 18, with
    the RAF Volunteer Reserve, David began training in Ontario, Canada, to be a pilot
    in the Fleet Air Arm of the Royal Navy, flying Tiger Moth biplanes and more modern
    Harvard aircraft. After 186 hours in the air he was awarded his wings, and returned
    to Britain to continue training, before joining 814 Naval Air Squadron in July
    1944.


    Known to his colleagues as ‘Dinger’, he flew Fairey Barracudas, mostly in Scotland,
    practising low flying, night formation, dive bombing and much more. In March 1945,
    he embarked on HMS Venerable in the Clyde before heading to the Far East and his
    date with destiny. Later that year, doing exercises over the Pacific and China
    Sea, a faulty landing on the aircraft carrier resulted in David being admitted
    to hospital in Sydney followed by recuperative leave in Adelaide.


    His time in hospital led to his being separated from his squadron, leaving him
    to ‘hitch’ home, which involved him spending some time in New Guinea, where the
    Japanese were still fighting on, unaware the war was over.


    After the war David became head teacher of Broomley County Primary School in 1958,
    finishing up as a lecturer at Durham University. He was surprised to learn that,
    as head teacher, he was expected to become a member of Stocksfield Parish Council
    – partly because the council met in his study. Duties also included making sure
    the fire had plenty of coal and that tea was laid on halfway through the meeting.
    It was the beginning of a thirty-year political career which saw him move on from
    the parish council to become chairman of Tynedale Council for two years from 1985-86.


    ### The horrors of Japanese prison camps


    Many weeks after VJ day, men were coming home with tales of horror at the hands
    of the Japanese in PoW camps. Captain N.T. Bewick arrived back to his family home
    in Corbridge after being held prisoner for three and a half years – and one of
    the first things he read was a notification of his own death on an official list
    of casualties. He was captured by the Japanese at the Fall of Singapore in 1942
    after being injured in the fighting, On repatriation, he said:

