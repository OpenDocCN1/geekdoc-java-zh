    与此同时，真正的战斗仍在多个战线持续。来自费尔赛德（Fellside）、科布里奇（Corbridge）的`John Rudd Mackie` 中尉在`Tilly–Caen`（蒂利-康）区域巡逻时，俘获了两名德国人。然而，当绊线触发了德国人的陷阱且两名囚犯试图逃跑时，他受伤。尽管受伤，`Mackie`
    仍成功用他的 `Sten` 冲枪开火并击中了两人，使他们被重新捕获。他曾获得由蒙特马利（Montgomery）陆元帅签署的卓越服务证书，但在逃跑计划失败后几几周在战斗中阵亡。


    `R.C. Osborne Hedley` 准将被授予卓越服务勋章，表彰他在缅甸钦奇山脉（Chin Hills）对抗日军的印度军旅团中表现出的模范领导力，特别是在萨考恩山战役（Battle
    of Sakawng Hill），这是远东战争的关键转折点之一。`Hedley` 属下的古尔卡士兵穿过不可逾越的丛林包抄了日军，他们曾一度甚至用步枪枪托作为简易梯子爬上悬崖，打开了通往姆法尔（Imphal）的道路。


    投降后，从意大利营营逃脱的人员在躲避纳粹流亡了几个月后，开始返回泰恩代尔（Tynedale）。其中包括来自皇家诺伯兰郡掷掷击团（Royal Northumberland
    Fusiliers）的`Kit Patterson` 上尉，他徒步走了 250 英里回到盟军阵线，耗时九个半月。他是五人逃亡小组中的一人，其余四人均被捕回。他因天气延误，在山中依靠智慧生存，并由意大利农民提供食物，他发现这些人非常友好且乐于助人。回到赫克斯姆（Hexham）后注意到的第一件事是建筑周围所有的围栏都消失了。


    ![Image](img/f0163-01.jpg)


    来自亨肖（Henshaw）的`John Oswald Nolan` 下士，他在从战俘营逃脱后用他“流利的意大利语”欺骗了纳粹部队。


    另一位逃脱者是来自亨肖（Henshaw）的`John Nolan` 下士，他也潜逃了九个月，躲过了德国巡逻队的搜捕。有一次，他遇到队骑自行车的德国士兵，但他只是挥了挥手，用假装意大利语对他们胡言乱语，他们便让他通过。此后，他小心避开主路，在树篱和森林的掩护下走向自由。和`Patterson`
    上尉一样，他得到了当地人的照顾，他们与他分享了匮乏的食物储备。他曾为一个意大利家庭工作，当他说要回家时，那家人崩溃落泪。由于曾在特里波（Tripoli）、布林迪西（Brindisi）和马切拉塔（Macerata）的监狱营中被关押，他说许多意大利营的食物非常糟糕，如果没有红十字会的食物包，许多英国战俘将无法生存。


    `Nolan` 下士于 1942 年在纳伊斯桥（Knightsbridge）被俘，但他已经参加过战斗，曾从敦刻尔（Dunkirk）撤离，并因在阿拉士（Arras）冒着猛火驾驶满载士兵的卡车安全撤离而获得战斗表彰。当时的火力如此猛烈，导致卡车轮胎被炸飞，他仅靠轮毂行驶了许多英里。


    ![Image](img/f0163-02.jpg)


    前阿康姆（Acomb）矿工`Sidney Cooper` 下士，他在法国卡格尼（Cagny）曾捡起一箱燃烧的炸弹并将其处理安全，拯救了许多生命。


    前阿康姆（Acomb）矿工`Sidney Cooper` 下士（32 岁）在卡昂（Caen）的一个装甲师中服役期间，还有更多英勇事迹。

