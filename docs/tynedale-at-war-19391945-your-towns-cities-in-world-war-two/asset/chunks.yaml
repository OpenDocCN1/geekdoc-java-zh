    The Spitfire campaign really captured the imagination of the public and the giving
    was generous at a time when the annual wage for a working man was around £3 per
    week. When the fund was wrapped up in February 1941, a total of £5,250 had been
    raised with administrative expenses only £34 16s 3d – just 0.76 per cent of the
    total.


    A breakdown of funds raised across the district showed where the cash had come
    from: Acomb, £54; Allendale £163; Barrasford £110; Bellingham £75; Blanchland
    £17; Corbridge £595; Fourstones £74; Haydon Bridge £116; Hexham £2,658; Horsley
    £50; Humshaugh £34; Langley £21; Lowgate £61; Matfen £40; Newton £69; North Tyne
    £114; Ovingham and Ovington £29; Riding Mill £175; Hexhamshire £59; Slaley £61;
    Stamfordham £7; Stocksfield £170; Wall £45; Wark £99; Colonial and foreign £356.


    Some of the donations and fundraising efforts raised relatively minor sums – a
    ‘hoy oot’ at a wedding at Stocksfield bringing in a modest 2s and a dance just
    £5 – but the community efforts brought in £3,588 which was further boosted by
    schools and schoolchildren bringing in £240, social events, sales and concerts
    £784, collecting boxes £240, weekly contributions from employers and staff £107,
    competitions £91 and a district-wide flag day £199.


    It had been hoped that the Minister for Aircraft Production, Lord Beaverbrook,
    would come to Hexham to collect the cheque in person, but this was not possible,
    so the cheque was sent in the post with a request that when the aircraft was built,
    the name ‘Hexham and District’ should be displayed on the fuselage.


    ### U-boat attack


    While the Battle of Britain was raging in the skies, German U-boats continued
    to take a heavy toll at sea. The Courant carried a graphic account of the ordeal
    of Haltwhistle’s Third Officer John Francis Blakie (25) who was one of thirty-nine
    merchant seaman aboard an oil tanker which was torpedoed 120 miles west of the
    Hebrides. He told the Courant that the U-boat had surfaced about 8.30 at night,
    and said: ‘They appeared to receive quite as big a shock as we did. We tried to
    turn round in order to deploy our guns, but before we could she submerged, leaving
    us, so we hoped to continue our journey.’


    Their hopes were in vain, for two hours later, around 10.30, the tanker was struck
    amidships by a torpedo, which also wrecked one of the lifeboats. Blakie said:


    ‘We were left with one lifeboat and the jolly boat into which we all crowded.
    Fourteen of us were packed into the jolly boat with little room to move and only
    a small supply of ship’s biscuits and water. The ship was going down very slowly,
    but as we got clear, a second explosion broke her back – I think it may have hit
    our magazines.


    ‘As we cast clear, we picked up two more shipmates, including a 16-year-old cabin
    boy on his first sea voyage, who during the subsequent days became the life and
    soul of the party. Shortly after the second explosion, the submarine resurfaced
    and drew alongside our boat, when the captain asked me, as the man in charge of
    the jolly boat, the name of our ship. I provided the necessary information to
    the commander, who spoke perfect English. Several of the men said afterwards they
    thought about giving the commander a little insight into the German air losses
    the previous day, but they thought it better to keep a still tongue under the
    circumstances.’


    The men were at sea for three days in the open boat in very rough seas, usually
    having a couple of biscuits and a little water a day, although some of the men
    had nothing at all. Blakie reported that spirits were excellent, and said: ‘the
    cabin boy was amazingly cheerful, and led the men in singing to keep their spirits
    up.’


    They finally manoeuvred the little craft to within sight of the island of Barra
    where they were picked up by the trawler Newlands. Blakie said:


    ‘Several of us were feeling the effects of exposure, but we were thankful to know
    that our nightmare had ended. We landed in the few clothes we had been wearing
    when the torpedo struck, and some of those who had been been in bed had neither
    shoes nor socks. At Tobermory, we were given food before proceeding to Oban where
    residents in a hotel volunteered their beds for us, and we were provided with
    clothes.’


    Fusilier Roy Clarke (19) of Stagshaw, was given leave from the Northumberland
    Fusiliers to be guest of honour at a special event at Stagshaw Church Hut, where
    he was feted for the actions which led to his being awarded the Military Medal
    for two separate acts of bravery with the British Expeditionary Force (`BEF`)
    on May 28 and May 31. He continued to carry messages, both on foot and on his
    motor cycle, when under heavy shellfire and mortar attack. He never took cover
    or rested, but continued on all his journeys with dauntless courage, ensuring
    the rapid delivery of vital information. He was presented with a suitably inscribed
    gold watch from the Corbridge War Services Fund, at the conclusion of a whist
    drive.


    ![Image](images/f0057-01.jpg)


    Military Medal winner Fusilier Roy Clarke (19) of Stagshaw who gained the award
    for bravery in delivering messages on foot and motor cycle.


    The courts were becoming increasingly severe on breaches of blackout, with fines
    stepped up as high as £4 – even for those not directly involved. Among those penalised
    that amount was the landlord of the Wheatsheaf Inn at Corbridge, who had ensured
    all thirtyfive windows were screened. A maid had been instructed to go round half
    hour before blackout times to ensure all curtains were drawn, but on this occasion,
    a guest had opened a door and left a light on.


    A German refugee living in Riding Mill, Pauline Mainzer, was fined £2 for having
    an unobscured light at the Terrace in Riding Mill, but the court was satisfied
    it was not a deliberate attempt to guide the enemy. A hostile crowd gathered in
    Prudhoe, threatening to break the windows of premises in West Road, where a light
    was blazing through the skylight of `Fewster’s Garage` and could be seen from
    150 yards. Police eventually broke into the premises to extinguish the light.
    Proprietor James Fewster was fined £2 when he admitted the offence, but blamed
    an apprentice whose job it was to lock up for not turning out the light.


    The residents of Prudhoe raised £241 10s 11d by way of donations and special subscriptions
    to buy three cars for £135, with a further £100 being spent on converting them
    to ambulances for the local ARP group.


    A failed lead mining scheme on the Rowley Burn in Hexhamshire paid dividends seventy
    years after its inception. Lead prospectors sank their money into a mining operation
    known as `Cobblers Venture`, but it yielded only a small seam of lead and the
    works were abandoned and left derelict. Among the abandoned machinery was a huge
    water wheel, weighing around five tons, which was spotted in 1940 and taken away
    for the salvage scheme.


    The war supplies depot at Hexham had to redouble its efforts to provide comforts
    for soldiers, after many of the thousands of items they had made were abandoned
    at Dunkirk. Balaclava helmets and minesweepers’ gloves were in particularly short
    supply. To raise money for more equipment a memorable exhibition was put together
    by the local gentry, where items on display included a blue brocade coat worn
    by the illfated Earl of Derwentwater; a bed cover worked by Mary, Queen of Scots
    while a prisoner at Loch Leven Castle; a patchwork quilt made by Warden’s famous
    murder victim Joe the Quilter and an apron worn by Dorothy Forster of Blanchland,
    heroine of Sir Walter Beasant’s famous novel. The exhibition took place in the
    hall of Hexham Catholic Schools.

