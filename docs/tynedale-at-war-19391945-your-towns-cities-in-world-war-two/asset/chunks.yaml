    # 荣誉


    空军飞行军士乔治·米尔伯恩（George Milburn，25 岁）是奥伦代尔人，居住在布兰奇恩德。他在敌方上空表现冷静被授予卓越飞行勋章；在气球拦截部队服役两年半后转为飞行组员，他参与了四十多次作战飞行。表彰信指出，在一次对汉诺林的袭击中，他的飞机被搜照灯光束困了八分钟，当时它正遭受德国战斗机的攻击。尽管被搜照灯晃眼，米尔伯恩冷静的指挥和准确的火力使他的飞行员采取了必要的规避动作。


    来自科布里奇的士兵埃内斯特·赫尔斯（Ernest Hulse）在意大利的一场战斗中，在猛烈的炮火和迫击火力下营救伤员表现勇敢，被授予军事勋章。


    ## 1944 年


    1944 年的开端异常惨，两起连续发生的重大悲剧给整个地区带来了巨大痛苦。1 月 22 日的《库兰报》（Courant）不仅报道了“泰恩代尔号”（HMS Tynedale）的沉没，还报道了广受欢迎的赫克斯姆伊丽莎白女王文法学校教师、泰恩代橄榄球之星
    K.W.D.霍德森在参加民兵卫演习时不幸伤重身亡。


    ![Image](img/f0151-01.jpg)


    泰恩代橄榄球俱乐部明星、赫克斯姆伊丽莎白女王文法学校历史老师 K.W.D.霍德森少校，在民兵卫训练演习中卷入爆炸后去世。


    霍德森少校是赫克斯姆民兵卫总部连的指挥官。1944 年 1 月 16 日，他负责一次民兵卫武器的练习和演示。训练在连队的武器训练学校进行，期间使用了`Blacker
    Bombards`（又称为喷管式迫击器，一种反坦克设备）、炸弹和其他爆炸装置进行了多次练习。结束后，霍德森少校在连军士长乔治·道格拉斯（George Douglas）的协助下，安设了一枚地雷向士兵们演示其作用。


    道格拉斯在和平时期是一名铁路信号员，他在随后的质询中告诉，他帮助少校安设了那枚地雷。地雷埋在地下并连有电线，以便遥控爆炸。随后他们离开地雷约 20 码，躲在土堤后，那里比地雷所在的平面低约
    15 英尺。这种地雷是那种在地面爆炸，然后射出弹体并在空中爆炸的类型。


    道格拉斯说：“我们都躲了起来，然后我听到了一声爆炸，紧接着又是第二声，所以我知道地雷爆炸了。我一直用手臂护住头部，在第二次爆炸后，我问霍德森少校是否无事。我没有收到回复。”


    道格拉斯走过去发现他脸朝下躺在土堤上，当他把他翻过身来，显然他伤得很重。他鼻梁上方的额头有一个穿孔伤，并处于半昏状态。


    其他民兵卫成员先对他进行了急救，随后他被送往赫克斯姆医院，之后又转到纽卡斯尔的另一家医院。霍德森少校为了生命战斗了十三天，但最终伤重不治。官方死因是颅骨复合骨折引发脓毒性脑膜炎。


    道格拉斯告诉纽卡斯尔市法医阿尔弗雷德·苹果比爵士（Sir Alfred Appleby），地雷并没有照常爆炸。地雷本应呈伞状效应爆炸，但碎片只从两个方向落下，而不是四周扩散。


    他说：“左右只要偏两三英寸，导致致命伤的碎片就会避开霍德森少校。”在被问及发生事的看法时，道格拉斯说，可能是霍德森少校将第二次爆炸误认为是第一次，所以抬头得太快了。


    法庭裁定为意外死亡，但这场悲剧结束了一个年仅 38 岁的非凡生命。


    他的全名是金斯利·沃尔斯沃思·大卫·霍德森（Kingsley Wallsworth David Hodgson），但他一直只以首字母相称。他是泰恩代历史上最优秀的运动员之一，作为泰恩代橄榄球俱乐部首发队队长，带领球队在
    1933-1936 年连续四年获得声誉卓著的诺森兰郡高级杯，赢得了不朽的荣誉。他拥有罕见的荣誉，曾代表三个不同的郡打过橄榄球：1933 年率领诺森兰郡对抗切希郡，还曾代表约克郡和达勒郡打球。


    尽管他已正式退役并接任球队秘书，但在战时仍代表泰恩代参加比赛。他还是名实力不凡的板球运动员，曾为泰恩代俱乐部打过许多场势精彩的比赛。他在伊丽莎白女王文法学校担任了十三年的历史和游戏老师，在赫克斯姆修道院举行的追念仪式是当年参加人数最多的仪式之一。


    同样在 1 月，还有另一个消息，《库兰报》的另一名编辑部员工飞行军士哈里·安南（Harry Annan）在执行飞行任务时殉职。他当时正驾驶一架`哈利法克斯`（Halifax）轰炸机进行演习，起飞仅两分钟便坠毁，底朝天掉落在斯凯尔顿附近的费尔尔德疗养院附近的乌斯河，距离约克中心四英里。他是该报社在空军服役的
    19 名员工中的 10 名之一。


    不过，《库兰报》的一位员工发现他在博蒙特街的技能大有用场：在皇家信号兵团担任下士的记者西德尼·福克斯罗夫特（Sidney Foxcroft）被任命为第八集团新闻报及军报《十字军者》（The
    Crusader）的前线记者。


    福克斯罗夫特下士在给住在赫克斯姆温莎露台的父母的信中写道：“这五天可能是我入伍以来最有趣的。我进行了广泛的旅行，并希望能够定期访问我们的前线位置。在编辑部中，我是唯一一名在前线的成员，渴望证明自己的价值。我今天待在最前线的医院，担任护士的翻译，与来自各个国籍的人们聊天。”


    ![Image](img/f0153-01.jpg)


    哈里·安南军士，曾是《库兰报》编辑部员工，死于一次飞行事故。


    战争以前，西德尼·福克斯罗夫特深度参与童军运动。他本人是一名“王牌童军”，曾担任赫克斯姆第 3 小狼童队的童队领。战后，他回归了正新闻业，多年来一直是《人民报》的东北地区通讯员。


    不过 1 月也有好消息，来自兰格利的掷榴兵威廉·杰斯珀·卡鲁瑟斯（William Jasper Carruthers，33 岁）在从意大利战俘营逃脱并徒步
    200 英里后回到家，他的旅程大部分是在德国军线后进行的。他是赫克斯姆利兹斯庄园斯特拉克家族的一名庄园工人，战争爆发后加入皇家诺森兰郡掷榴团，在法国服役并从敦刻尔克撤离，随后回到中东战场，在在那里的骑士桥战役中被俘。


    ![Image](img/f0153-02.jpg)


    兰格利的掷榴兵威廉·杰斯珀·卡鲁瑟斯，在从意大利战俘营逃脱后徒步 200 英里回到盟军范围。


    他曾被关在 PG53 战营，但在意大利投降和墨索里尼倒台的那个晚上，500 名新守卫被负责囚犯。第二天，所有守卫都消失了，囚犯们破了包围营地的栅栏。大多数囚犯逃跑，但很快就在德国部队来搜捕并将送往德国时被抓了。然而，卡鲁瑟斯和另外两个人设避了被捕，但在逃亡十天后，他们决定独自行动会更好，于是分道扬扬。


