  raw: 'Dorothy had kept the drapery business going and Ossie was soon back plying
    his trade around the villages and farmers of Northumberland. The couple moved
    to Hexham in 1946 and were happily married for 59 years until Dorothy’s death.
    Ossie retired in 1969 and was still driving a car well into his 90s.


    Members of Uncle Fred’s Children’s Corner in the Hexham Courant who joined forces
    with the district’s women’s institutes, Women’s Voluntary Service and other bodies
    to rake the hedgerows for rose hips, heard that nationally, the effort had yielded
    200 tons of the orange bounty, which was packed with the infection fighting vitamin
    C. Estimated at the rate of 300 hips to the pound this meant that some 143 million
    hips had been plucked from thorny branches across the country, enough to make
    600,000 bottles of syrup, which were being sold in six ounce bottles for 1s 9d
    or eight ounces for 2s 4d. A spoonful per day was enough to give a child half
    its vitamin requirement.


    A spiv from Edgewell in Prudhoe, picked on the wrong man to approach to buy a
    lottery ticket for the prize of a fat goose. The would-be purchaser was an off-duty
    policeman and when asked if he would like a ticket, he said he was taking the
    lot and arrested the wide boy for conducting an illegal lottery. He was fined
    10s at Hexham Petty Sessions.


    At the same court, a motorist who was fined for not having white paint on the
    bumper of his car complained that he had been summonsed following a police raid
    on a car park in Hexham around midnight on Christmas Eve. He said the timing of
    the raid was ill-chosen, in strong contrast to the customary spirit of goodwill
    and carol singing on this one night of the year.


    Fines of £5 each were imposed on two men for the misuse of petrol – one on a man
    who had used his works furniture van to drive from Hexham to attend a dance in
    Humshaugh five miles away and another who had illicitly driven three miles from
    Corbridge to go to the pictures in Hexham.


    Although they were captured at different times and were frequently moved to different
    PoW camps, two soldiers in Corbridge met up in the same camp, families of both
    men heard in welcome Christmas cards home. In the same camp with Lieutenant H.
    Brodie Cochrane of the Royal Engineers and Lieutenant Fenick Deane Hammond of
    the Royal Artillery was Haltwhistle’s Major Kenneth Clark, of the Royal Northumberland
    Fusiliers.


    Lieutenant Hammond reported the meeting in his Christmas card, in which he said
    he was well and asked to be remembered to friends in Corbridge. He also reported
    that the camp had a good dance band as well as a symphony orchestra.


    ### Warship Week and HMS Tynedale


    February of 1942 saw the launch of Hexham Warship Week when the district was charged
    with raising £200,000 to sponsor the Royal Navy destroyer HMS Tynedale. The destroyer
    had not been named directly after the district, but as a Hunt class vessel, it
    was named after the Tynedale Hunt, whose hounds were kennelled at Stagshaw, near
    Corbridge. In the wardroom of the ship was the mask of a Northumberland fox, presented
    to the ship by the master of the hunt.


    The appeal was launched with a grand parade through the town, led by the band
    of the Home Guard, and included representatives of Home Guard, military and civil
    defence movements as well as National Fire Service, Red Cross, Air Training Corps,
    Women’s Land Army, Boy Scouts and Girl Guides.


    Numerous events were held across the district, with collections, concerts and
    whist drives, while the pupils of Keenley Council School near Allendale raised
    £93 13s – which worked out at £5 10s 2d per head – with similar sums coming in
    from other schools.


    After a week’s hectic fundraising, the organisers got together four local war
    heroes to formally unveil the total raised – Third Officer Derek Gilchrist MBE,
    Pilot Officer Harold Robson DFM, Pilot Officer Arthur Garwell DFM and Robert Baty
    GM – and there were huge cheers when it was revealed that £268,476 had been banked
    on Armed Forces Day. By the end of the week the final figure was £325,099.


    ![Image](images/f0110-01.jpg)


    There was great support from local businesses for the launch of Hexham Warship
    Week in 1942.


    Asked what comforts they would like from their newly adopted ‘family’ the crew
    of HMS Tynedale asked Hexham Townswomen’s Guild for socks, jerseys, football boots,
    minesweeping gloves, dartboards, board games, cribbage board, books and playing
    cards – as well as a piano to assist with the ship’s theatrical productions. Within
    a week they had been given a piano by Mr and Mrs Leslie Mann of High Reins, Hexham,
    whose only son had been killed while serving in the Fleet Air Arm a few months
    earlier.


    HMS Tynedale was ordered from Alexander Stephen and Sons on the Clyde in Glasgow
    on 11 April 1939 and laid down on 27 July 1939\. She was launched on 5 June 1940
    and commissioned on 2 December 1940, with total building cost of £425,000\. She
    had a displacement of 904 tons and carried armament of four 4-inch anti-aircraft
    guns and eight smaller guns.


    Tynedale was mostly employed on convoy and escort duties, initially as part of
    the First Destroyer Flotilla based at Portsmouth, but on 11 March 1941 she sustained
    damage by a Luftwaffe air raid on Portsmouth’s docks which put her out of action
    for nine days.


    On 15 December she was transferred to the 15th Flotilla based at Plymouth. The
    Tynedale’s finest hour came on 27 March 1942, when she took part in the famous
    St Nazaire Raid as one of the escorts for the obsolete, explosive-packed destroyer
    HMS Campbeltown which was rammed into the lock gates at the Normandie dry dock
    in the German held French port. This audacious combined operations attack put
    the port out of action not only for the rest of the war, but for five years afterwards.
    South-west of Ushant Tynedale sighted the U-boat U-593 and attacked her, initially
    with depth charges and then when the submarine was forced to the surface, with
    a deck gun. However the U-boat managed to dive again and escaped – only to return
    with deadly vengeance the following year.


    ![Image](images/f0111-01.jpg)


    HMS Tynedale.


    When rendezvousing with the surviving small craft from the raid outside the harbour
    Tynedale and another destroyer, HMS Atherstone engaged the five German torpedo
    boats of the 5th Flotilla.


    Tynedale returned to Plymouth on 29 March, along with the rest of the convoy that
    had survived. She underwent repairs and resumed duties on 18 April, continuing
    with convoy escorts in the Southwest Approaches. On 14 May, she encountered the
    German auxiliary cruiser Stier, and was part of the task force that sank it, albeit
    only as a support vessel. She also participated in a support role in the sinking
    of the German auxiliary cruiser Komet in October.


    Tynedale was nominated for service in the Mediterranean and, as part of Destroyer
    Division 59 (which she joined on 8 March 1943), she guarded convoys between Gibraltar
    and Algeria. She acted as an interceptor during the Allied invasion of Sicily
    and aided in the rescuing of 218 passengers from the Dutch freighter Felix Jan
    Van Manix which was torpedoed and sunk in October 1943.


    At 6am on 12 December 1943, HMS Tynedale was escorting a convoy off the coast
    of Algeria when she was spotted and attacked by the German submarine U-593 – the
    U-boat she had engaged with during the St Nazaire raid. The noise-seeking torpedo
    went straight for the boiler room amidships and tore the vessel in two, leaving
    more than 90 of the 134 crew dead; some who were injured later died on shore.


    One man who survived the sinking was Ron Babb who, speaking in 1995, recalled
    how the people of Hexham and the surrounding areas took HMS Tynedale to their
    hearts, sending out letters, cards and games to the vessel to help keep the officers
    upbeat during the war.'
