    escorted by large formations of fighters, and has only employed a comparatively
    small proportion of heavy bombers, of which he has large numbers. Any weakening
    of our defences would allow him to use these heavy bombers in daylight.


    The great destruction wrought in Poland and Rotterdam was the work of the heavy
    bombers and was only possible because they were able to operate during the day
    without any opposition. This is the state of affairs which the enemy hopes to
    bring about in this country. He has had little success to date, but he cannot
    give up now without acknowledging a major defeat.


    I welcome the proposal to open a Spitfire fund in Hexham, both as proof that the
    work and responsibility of our fighters are being recognised, and as a practical
