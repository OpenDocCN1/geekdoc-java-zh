    X 先生目睹了老人被殴打死以及各种形式的残忍虐待犯罪。在几次中，这座本为容纳 5,000 人设计的营地的全部 20,000 名囚犯在半夜被唤醒，目睹集体绞刑。营中所有死者均被火化，骨灰被送给亲属，但亲属不被允许询问死因或原因。亲属被允许寄送包裹，但囚犯必须排队领取，有时要排一整天的队。如果包裹里含有烟草或水果，会被营官员没收，而来自家中的信件则会在预期收件人面前被撕碎。


    早餐是一份咖啡颜色的饮料和四分之一块面包，午餐是带有极少量肉类痕迹的汤，晚餐是小块重盐香肠和盐鲱鱼。X 先生说：“这是另一种形式的折磨，因为我们不准喝水，如果你吃了晚餐，整晚都会忍受极度口渴。”


    他谈到了大多数德国人的绝望，他们被政府拖入了一场他们并不想要的战争，而那个政府无情地镇压任何对纳粹党的抵抗迹象。


    人们对来自布里格伍德、海登桥的二等军官西里尔·克莱米森（Cyril Clemitson）的处境深表同情。他当时正乘坐纽卡斯尔号 `Dalryan` 往返远东完成
    50,000 英里旅程的最后途中，船只在英国东南海岸附近撞中了水雷。


    他告诉《快报》：“在准备好起落架之前，我正在舱里小睡，这时被一个恐怖的声音惊醒了。船的金属侧面像纸一样被撕碎了。我的舱室完全破碎了；我的无线电、衣柜和其他家具都变成了木屑。我摸索着寻找手电筒和救生衣，跑到甲板上，那里发生了第二次爆炸，我们不得不躲避坠落的碎片。”


    幸运的是，所有 38 名船员都获救了，因为爆炸在岸上被看到了。正如克莱米森二等军官所说，唯一的伤员是“我的金鱼和别人的金丝雀”。


    战争中的第一个圣诞节带来了无声的反抗，商店报告的生意比冲突前有所好。邮局报告交换问候卡的数量大幅增加。许多在部队服役的当地男子休假回家，因此有了一些幸福的家庭团聚。虽然许多疏散人员在节日期间回家，但另一些人留在泰恩代尔（Tynedale），在赫克斯姆的共济会为新来者举行了一场大型派对，由“快乐百万人”（Jolly
    Millers）提供舞蹈音乐。


    圣诞节的一大特色是无线电中的帝国联动节目，科布里奇圣歌团参加了其中，并以乔治六世国王对帝国的信息结束结束。科布里奇的广播是在罗克利夫庄园（Roecliffe
    Lodge） 84 岁的 J.T. Mail 家中进行的。传唱的圣歌有《平安夜》和《我们东方三王》，并由著名的诺伯兰郡风笛手杰克·阿斯特朗（Jack Armstrong）伴奏。


    赫克斯姆战争纪念医院的病房用彩带和其他护士和患者自己制作的物品装饰得色彩斑斓。几位士兵病人收到了护士编织的毛衣礼物。尽管受到封锁带来的影响，邮局很好地应对了如雪崩般的邮件，大多数人都听从了早点寄圣诞卡的请求。


    ## 1940 年


    尽管泰恩代尔在第二次世界大战期间被认为更多是一个避难所而非活动中心，但它并非完全没有冲突发生的证据。该地区到处是沼泽坑洞和掩盖着破损残骸的茂密土丘，这充分证明了该地区多年来见证了许多悲剧。


    ## 空坠事故


    遗憾的是，当地的坠机地点很少发现敌方飞机——大多数地点讲述了年轻盟军士兵多重丧命的悲惨故事。1940 年 10 月，一架惠特利（Whitley）轰炸机在从波兰斯得廷（Stettin）油厂执行任务返回的途中燃料耗尽。五名机组人员安全跳伞，但由于未知原因，他们的飞机没有指向海面，在机组人员缓慢降落时飞机继续飞行。在贝林汉（Bellingham）西南三英里处，失事的轰炸机撞击了高地，最终在梅斯林斯（Meslings）坠毁。惠特利机的机组人员中有马克·阿尔弗雷德·尼曼（Mark
    Alfred Niman）军士，他曾在飞机所在的 `RAF Leeming` 的 `10 Squadron` 担任无线电操作员。机组人员最终降落在南方八英里的斯通豪（Stonehaugh）附近的莱迪希（Ladyhill），裹着伞罩过了一个寒冷的夜晚。


    在惠特利机坠毁仅两周后，一架来自 `RAF Newmarket` 的维克斯威尔士顿（Vickers Wellington）轰炸机在执行轰炸柏林的任务返回途中坠落。恶劣天气和能见度低导致飞机在奥特伯恩（Otterburn）西部的布莱克霍普山（Blakehope
    Fell）坠毁。据认为，飞行员选择穿云层下降以确定位置，结果威尔士顿撞上了一堵干石墙并在撞击时起火，导致六名机组人员中的一人死亡。


    1941 年 7 月，一架海风战斗机在惠顿斯尔费尔利农场（Fairley Farm, Whittonstall）森林中坠毁，飞行员跳伞逃生时折断了脚踝。1941
    年 8 月，一架喷火狮战斗机在华灵顿大厅（Wallington Hall）坠毁，飞行员死亡，同一天莱亚尔穆特劳农场（Mootlaw Farm）也遭到五枚炸弹。


    1941 年 9 月，一架来自克罗斯比-昂伊登（Crosby-on-Eden）的霍克飓风机在天气糟糕、燃料不足的情况下被迫迫降陆。这架飓风机正在进行摄像枪练习时，法国飞行员让·德·泰斯科（Jean
    de Tedesco）少尉成功在雅罗·法尔斯顿（Yarrow, Falstone）降落。一名当地男子称看到一架飞机从贝林汉方向沿北泰恩谷低空飞行，并看到它落在雅罗银行（Yarrow
    Bank）脚下的田里。当该男子到达飞机时，让·德·泰斯科坐在机翼上，已经联系了基地，并允许当地孩子坐在驾驶舱内。


    另一架飓风战斗机于同年 11 月坠入基尔德的皮尔山（Peel Fell）山顶，飞行员牺牲。皇家印度空军飞行员哈库姆·钱德·梅塔（Hukum Chand Mehta，24
    岁）驾驶着四架从 `RAF Acklington` 起飞执行编队飞行训练的飓风机之一。来自 `43 Squadron` 的梅塔是编队长，但在返程途中失踪。接下来的两天一直在寻找飞机但无无获，直到一名当地牧羊人报告看到飞机飞机以惊人的速度撞向山坡，只剩下尾部可见。梅塔的身体在撞击点远处被发现，埋在
    8 英尺厚的泥炭下。他是巴基斯坦莱亚尔普尔（Lyallpur）卡姆·钱德·梅塔（Karam Chand Mehta）之子；他在纽卡斯尔西路火化场被火化。


    1941 年的圣诞节并没有停歇，另一架飓风机在奥文格姆（Ovingham）附近低空飞行时坠毁。同样在 12 月，一架西陆信塞德（Westland Lysander）在奥特伯恩参加火兵合作演习时坠毁。飞行员
    J.K. 阿斯汀（J.K. Astin）在从 `RAF Clifton`到达奥特伯恩后发现引擎开始熄火。由于无法解决问题，他被迫在松软不平的地面着陆，导致飞机在着陆时翻扣。幸运的是，阿斯汀未受伤，飞机随后被打捞。

