    # 战时决策与当地新闻


    在所做出的更奇怪的决定中，是禁止 `Corbridge` `St Andrew’s Church` 的钟声，使其在战争期间不再报时。该决定由 `Corbridge
    Parish Council`（科布奇教区会）副主席 `R.R. Ridley` 员做出，理由是“出于安全考虑”，但当时正在休假的牧师 `Rev. M.M.
    Barlow` 博士对此并不知情。这一决定在村子里引起了某些恐慌，尤其是当时 `London` 的 `Big Ben` 大大钟仍在隆隆作响。牧师认为，教区会没有权力在未征得他或教会执事员同意的情况下停止钟声报时。他说：“我个人或许是最不在乎自身权利的人，但我是在乎教会的荣誉，而我是教会在这一教区的个人代表。我很惊讶在没有咨询我的情况下，钟声竟然就停止停止了。”


    内政部（`Home Office`）并未发布关于禁止钟声运行的命令，双方同意恢复钟声报时。


    ## 价格强制执行


    在 `Bellingham` 地方法院，来自 `Wark` `Pasture House` 的 `Ellen Charlton` 因以每只 `4d` 的价格出售鸡蛋，超过了政府规定的每只最高价
    `3d` 而出庭。`Charlton` 告诉法庭，她知道《自产鸡蛋最高价格令》（`Maximum Prices for Home Produced Eggs
    order`）的规定，但她认为自己权收取更高的价格，因为 `Bellingham Food Control Committee` 的 `Sidney Clough`
    在测试购买中买到的鸡蛋特别大，可能是双黄的。


    她被罚款 `£1`，并承担 `£1` 的诉讼费用，法庭主审 `Major G.D. Anderson` 告诉她，她本可以被罚 `£100`。针对她辩称自己只有几只产蛋很少的鸡的请求，`Major
    Anderson` 表示：“你拥有多少家禽并不重要。如果你只有一只每天产一个蛋的鸡，而你以高于最高价卖掉那颗蛋，就构成了犯罪。无论这些规定多么令人厌烦，它们都是为了整个国家的利益而制定的，每个人都要尽力愉快地执行这些规定。”


    他要求媒体报道此案起到震慑作用，因为有暗示——尽管无法证实——称 `North Tyne` 的其他养殖者一直在以高于许可的价格出售鸡蛋。


    ## 家庭新闻与认可


    来自 `Corbridge` `Dilston Haugh` 的 `Mr and Mrs J. Atkinson` 夫妇收到了好消息。一个月前他们被告知，长子
    `Able Bodied Seaman Joseph Atkinson` 在驱逐舰 `HMS Esk` 被鱼雷或水雷击沉后失踪，推测已遇难。当他们收到他已被获救并目前身处战俘营的确认时，他们喜若狂。


    ![Image](img/f0059-01.jpg)


    来自 `Corbridge` 的 `Able Bodied Seaman Joseph Atkinson`（22 岁）在其船只 `HMS Esk` 沉没时被误报战死。在他的帽子（`cap-tally`）上，船名被划掉，以避免向敌人提供信息。


    `Courant` 报在战时不仅传递坏消息，也能传播好消息，以 `Hexham` 的 `RAF Sergeant Harold Robson` 为例，正是一位
    `Courant` 记者告诉他的家人，他因在占领领土上执行四十一次日间任务而被授予卓越飞行勋章（`Distinguished Flying Medal`）。他强调，该奖励是对整个
    `Blenheim` 机组工作的认可。


    ![Image](img/f0060-01.jpg)


    来自 `Hexham` 的 `RAF Sergeant Harold Robson`（26 岁）因在占领领土上执行四十一次日间任务被授予卓越飞行勋章。


    ## 后方与生产


    在后方，`Tynedale` 的女士们听到了一个毁灭性的消息，英国贸易部（`Board of Trade`）宣布将禁止丝袜。`Courant` 报的“女性话题”专栏报道道：“一夜之间，一双丝袜成了
    `Hexham` 最炙求的商品，在周六早上晨女商店开门后，丝袜柜台就排起了长队。到周一早上，一双丝袜就像夏天的雪一样稀缺。为了确保所有客户都能公平分配到现有库存，每人限购一双。一家商店甚至采取了记录所有丝袜购买者姓名的方法，以扰乱潜在的囤积者。店主说：‘限制只是又一种牺牲——与正在进行的其他牺牲相比，这是微小的——女性被要求为了自由而做的牺牲。’”


    在 `Hexham War Supplies depot` 的第一次年度会议上报告，已有 10 英里的材料被制成 3,051 件衣服，25 英里的纱布被变成了
    44,000 个棉签，12.5 英里的材料被卷成了 3,685 条绷带。该仓库每周产 3,000 件，全年总产量为 109,000 件，由 33 个不同的小组组成。其中包括来自
    `Hexham Senior School` 的木工班。


    ## 安全规定


    对防空管制（blackout）违规行为的打击持续，`Corbridge` `Stagshaw Colliery` 的主被罚款 `£5`，因其允许煤堆闷燃，发出了远处可见的光亮。`Corbridge`
    消防队使用了 1,000 加仑水扑灭了火灾。来自 `Hexham` 的业主 `Thomas English` 表示他知道煤堆正在升温，并正在组装一台电动泵以控制火势。


    来自 `Prudhoe` `River View` 的 `George Stoker` 因违反防空管制被罚款 `£1`，当时炉火上的一个炸锅翻了，点燃的油脂点燃了烟囱，产生了
    3 英尺高的火焰，从远处可见。


