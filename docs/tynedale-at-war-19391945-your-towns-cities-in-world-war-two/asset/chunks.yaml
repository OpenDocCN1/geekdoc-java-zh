    Tynedale unearthed a new weapon against the Nazis in February, with the launch
    of `Hexham and District Potato Week` when local housewives were urged to stop
    using bread and serve potato scones instead. The event was supported by Minister
    for Food `Lord Woolton`, who said in a telegram to the president of the `Hexham`
    branch of the `Retail Fruit Trade Federation`, `S.F. Robinson`: ‘By recognising
    the importance of consuming home grown food and freeing our wheat shipping space
    for sterner cargoes, `Hexham` is setting a fine example.’ He also put up a prize
    of two guineas for the best original potato recipe. Bakers in the district played
    their part by offering for sale scones, cakes and pastries, all made from potatoes,
    and numerous traders took part in a rhyming advertising feature on `Potato Week`
    in the `Courant`.


    Pride of place went to the ode by the `West Wylam and Prudhoe Cooperative Society`,
    whose resident rhymer wrote:


    ```

    Hitler said to Goebbels,

    The British Folk are Duds,

    He forgot the Tyneside Geordies

    Were demons for their spuds

    They proved it out in Egypt

    With Rommel on the run

    He wired back to Hitler,

    Mein Gott we had to run.

    ```


    Grocer `W. Civil`, of `Wark`’s contribution was:


    ```

    You cannot fly an aeroplane,

    Or command a British sub

    But you can defeat the Nazis

    By eating the local spud.

    ```


    Merchant `E. Dawson`, of `Woodbine Terrace Hexham` wrote:


    ![Image](images/f0134-01.jpg)


    A major drive for housewives to use home-grown potatoes rather than imported flour
    when preparing meals saw the launch of `Hexham Potato Week` with the `Ministry
    of Food` offering a two guinea prize for the best potato recipe.


    ```

    Save wheat and eat potatoes

    And help to win the fight

    It will aid our gallant navy

    And put the Hun to flight.

    ```


    Haltwhistle fruiterer `E. Carrick` wrote:


    ```

    Eat less bread and use more spuds

    For nourishment they are the goods

    Let the ships bring guns and tanks

    And earn Lord Woolton’s warmest thanks.

    ```


    In the accompanying editorial, the `Courant` wrote:


    ‘The humble potato, the real treasure of the Incas, may be one of the chief factors
    in defeating the U-boats which menace our shipping. By eating more potatoes and
    less bread, much shipping space used for wheat importation will be released for
    vital war supplies. Local traders, women’s institutes and schools throughout the
    district and are linking up in an effort to make the food value of the common
    spud better known. Although sadly neglected in England, potatoes have long been
    the staple diet of the Irish peasantry and on the Continent they are much more
    widely used than in this country.’


    It was pointed out there was a statue in `Offenberg` in Germany to English sea
    dog `Sir Francis Drake`, in recognition of the fact he had introduced the potato
    to mainland Europe.


    The `Potato Week` proved a great success, although local councillor `Miss I.M.
    Iveson` commented: ‘I think if `Lord Woolton` had banned potatoes for a month,
    he would have achieved his objective of popularising them much better because
    when potatoes were scarce in the last war, it was then they were worth their weight
    in gold. I think we are on the last lap in this war but that is always the hardest.’


    A total of forty-one traders took part in a potato-related shop window competition,
    the winners of the five guineas first prize being `Messrs. R. Wright and Son of
    Haltwhistle`. Consolation prizes went to the `London and Newcastle Tea Company`
    of `Battle Hill` in `Hexham` and `Walter Willson`’s store in `Prudhoe`. Special
    commendations also went to `Brough’s` of `Hexham` and the `Tynedale Nurseries`.


    `Lord Woolton`’s two guinea prize for the best original potato recipe went to
    `Mrs Stanley` of `Acomb House, Hexham`, with her potato mould, described by the
    judge as being ‘a really practical war-time recipe’.


    Refusal to let his `Boy Scouts` take part in a count of wood pigeons around `Hexham`
    brought censure for District Commissioner `Major T. Russell Cairns` from the `Edward
    Grey Institute of Field Ornithology`, who accused him of being ‘hyper-cautious
    and short-sighted’. `Major Cairns` retorted the institute believed that wood pigeons
    – known locally as `cushats` – nested in hedges, when it was common knowledge
    that they preferred the tops of high trees, and he considered it too dangerous
    for `Scouts` to be involved, as well as throwing great responsibility on the Scoutmasters.
    He concluded: ‘I told the institute that instead of climbing high trees two or
    three times to count nestlings, it would be better to make just one climb and
    put the resultant findings in a pie.’


    He felt that `Scouts` were doing much more important `National Service` work locally,
    such as acting as `ARP messengers`, signallers for the `Home Guard`, orderlies
    for the `YMCA` and as gatherers of herbs. There had also been a rat tail collection,
    with one `Scout` alone collecting 106 tails to earn a National Service badge.


    The attractions of `Hexham’s` shops meant that people from outside the town were
    coming into the town by bus early in the morning and clearing the shelves of unrationed
    goods, complained Councillor `Ned Fenwick` at a meeting of `Hexham UDC`. He said
    it was ‘a proper stampede’ every Tuesday – market day – and Saturday, and by the
    time `Hexham` people went out to do their shopping, there was very little left.
    He said the early morning shoppers returned to the bus stand to pool their purchases
    and called for steps to be taken to protect the interests of `Hexham` residents.


    Chairman of the council’s food control committee Councillor `Tom Wheatley` said
    the council had no power to intervene in the matter, and added: ‘It seems to me
    that if people from the outlying areas can come into town by bus to make their
    purchases, people living in the town are not getting out of their beds soon enough.’


    There was a singular honour for `Hexham` when its Conservative MP `Colonel Douglas
    Clifton-Brown`, was appointed the ‘First Commoner of the Realm’ as the 139th Speaker
    of the House of Commons. He assured the voters who had first elected him `Hexham’s
    MP` in 1918 that although his new office meant he would have to spend a lot more
    time in Westminster, he would not be moving to London, preferring instead to remain
    at his family home at `Ruffside`, near `Blanchland`. He had been Deputy Speaker
    since 1938, and served as Speaker until 1951, when he retired, taking the title
    of `Viscount Ruffside of Hexham` in the County of `Northumberland`.


    `Hexham Golf Club`, scene of many county and championship events, and regarded
    as one of the best inland courses in the country, was facing a battle for survival.
    So many members had joined the forces that subscriptions were down by £530 and
    green fees slumped from £538 in 1938 to just £71. Despite stringent economies,
    the club still had many commitments it was struggling to fill, so a £2,000 appeal
    for launched to secure the future of the `Spittal` course for the servicemen’s
    return when the war was won.


    ### Wings for Victory


    Wings for Victory campaigns were launched in both `Hexham` and `Prudhoe` in the
    summer of 1943, with `Hexham` setting itself a target of £250,000 to provide four
    squadrons of `Hawker Hurricane` fighters, while `Prudhoe` was aiming for £40,000
    to launch an `Avro Lancaster` bomber. `Prudhoe` was first to hit its target, raising
    a total of £52,039, thanks in no measure to an investment of £15,000 from the
    `Mickley Combined Collieries`. There was also a celebratory concert at the `Rio
    Cinema`, featuring Australian soprano `Florence Austral` and English bass `Norman
    Allin`, along with local choir, the `Prudhoe Gleemen`.


    `Hexham’s` campaign was launched by the newly appointed Speaker of the House of
    Commons `Douglas Clifton-Brown` with a stirring speech about the turning tide
    of the war in Africa, with the `Northumberland Yeomanry`, of which he was a former
    commanding officer, doing good work as an anti-tank unit.

