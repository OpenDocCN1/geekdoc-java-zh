    Sarah Bell of Millersfield, Acomb, worked as a parlour maid up until 1939 in rural
    Ridsdale and was quick to volunteer for the Land Army. Her first billet was at
    East Shaftoe Farm, near Belsay. She worked seven days a week milking, feeding
    the cattle and driving tractors – and she became a dab hand at manoeuvring a horse-drawn
    plough, too. But there was also time for a little fun, too. Each week the girls
    would head off to the local village hall, usually in either Belsay or Kirkwhelpington,
    for the Friday night dance. Strong friendships were also made during those years,
    and that was certainly true for Mrs Bell. Her fellow Land Army member at East
    Shaftoe Farm, Mary Thompson, became her best friend and later on her bridesmaid.


    There were some social experiences, though, that Mrs Bell wasn’t so keen on. On
    one occasion, the group of Land Army girls gathered in Morpeth to receive the
    diamond-shaped pins that denoted their level of service, much in the same way
    as soldiers’ stripes. After much cajoling, she was eventually persuaded to join
    them for a celebration in a public house afterwards. She was 25 and it was the
    first time she had ever entered a pub. She said: ‘I was brought up against that
    sort of thing and I didn’t stay long – some of them were just after the drink.
    I was terrified somebody would come in that knew me.’


    She was none too impressed, either, by the jobbing workforce who were brought
    in to help out with the harvest. ‘They used to get people from Ashington to help
    pick the potatoes, and everyone was given their own length to do. If you didn’t
    keep your eye on them, though, they would give you their stretch to do as well.
    They were a rum lot from Ashington!’


    The work of the Land Girls was praised by Hexham’s MP Douglas Clifton Brown when
    he addressed a Land Army rally in the town, and said that the land girls were
    just as important as the crews of food ships or the ships that guard convoys.
    While he did not wish to belittle the work of the WAAFs on predictors, the ATS
    on gun sites and the WRNS in other theatres of war, in many cases they were doing
    the same jobs they had done before the war. Many of the land girls had taken up
    jobs which were completely new to them, and which were not easy or pleasant.


    ![Image](images/f0097-01.jpg)


    Girls across Tynedale were encouraged to join the Auxiliary Territorial Service
    to do their bit for the war effort.


    It wasn’t only with the Land Army that women were doing their bit. In October
    1941, there was a plea for Tynedale women to join the Auxiliary Territorial Service,
    the branch of the armed services set up to let women do the routine jobs of soldiering,
    allowing the men to be released for combat duties.


    Tynedale had an allocation of 300 women to fill, aged between 17½ and 43, or 50
    if they were ex-service-women. A message to local women from the Ministry of Labour
    and National Service via the Courant said: ‘Remind the women of Hexham of the
    fine record of their famous county regiment the Royal Northumberland Fusiliers
    and tell them not to let their menfolk down.’


    The basic rate of pay was 1s 8d per day which, while still a private, could be
    increased to 2s 10d or even 3s 4d according to the job undertaken and the proficiency
    tests passed. A sergeant drew about 4s 6d per day, according to her trade, while
    a sergeant major’s pay could reach 9s 4d per day.


    ### Spitfire Pilot


    Former Hexham Courant reporter Sergeant Pilot Woodrow Raine, of Greenhead, made
    the news himself when he was pictured in the cockpit of the Spitfire Venture 1
    which had been bought by donations from members of staff at the Midland Bank.
    In a letter to bank staff, Sergeant Pilot Raine wrote in true dashing RAF style:


    ‘Sorry for not replying immediately, but as you can imagine, we are rather busy
    these days holidaying over France and enjoying tea parties with Messerschmitt
    109s.


    Venture I is a grand machine. I have had it for about six months, and during the
    last two or three weeks, we have certainly seen life together, and it can practically
    fly itself over France now. The only damage it has received is a bullet through
    the elevator which I collected machine gunning 109s on an aerodrome in France.
    I flew over at a height of 30 feet, spraying a couple of 109s and some Nazis standing
    on the tarmac. Judging by the amount of fire they put up at me, someone must have
    objected, but we escaped with just that one bullet hole.’


    ![Image](images/f0098-01.jpg)


    Former Courant reporter Sergeant Pilot Woodrow Raine, in his Spitfire ‘Venture
    I’ paid for by staff of the Midland Bank, in which he ‘enjoyed holidaying over
    France and enjoying tea parties with Messerschmitt 109s’. Sergeant Raine was shot
    down and killed on 21 August 1941 and is buried at St Omer, Pas de Calais.


    Sadly, Raine’s luck did not last; he was killed on 21 August 1941 when his Spitfire
    was shot down near Dunkirk by a Me109. He is buried in Longuenesse Souvenir Cemetery,
    St Omer. He had survived scrapes before though, after joining the RAFVR in February
    1939 as a trainee pilot. He was called up on 1 September and, after completing
    his training, converted to Spitfires at 7 OTU Hawarden on 19 September, the undercarriage
    leg collapsed and the aircraft tipped on its nose.


    ![Image](images/f0099-01.jpg)


    A ‘Penny a Week’ campaign to raise money to supply Red Cross parcels for prisoners
    of war was launched in June 1942.


    In the later summer of 1941, there was a gathering of beribboned veterans of old
    in the shadow of Hadrian’s Wall, when the NCOs of 4th Battalion Home Guard got
    together to brush up on modern methods. They arrived by private car, lorry and
    bicycle from Prudhoe, Haltwhistle, Slaggyford and Blanchland. A Hexham Courant
    reporter who looked in on the camp wrote: ‘For some it was their first experience
    of army life since the Great War, but as the rows of multi-coloured ribbons on
    the chests testified, it brought back many memories of 25 years ago. Britain’s
    civilian army of Great War campaigners and Old Sweats, despite many years of


    There were no lectures, just talks on the giving and receiving of orders, the
    dangers and methods of Fifth Columnists and parachutists, and how to deal with
    them. The use of the shotgun in guerilla warfare was demonstrated but when each
    man was issued with a shotgun, the shredded and riddled targets showed that these
    veterans of the trenches showed they needed no guidance on their use.


    The King’s Regulations were explained by a regular officer and after further exercises
    they fell into their beds, the Courant man noting: ‘For many, sleeping under canvas
    was none too comfortable a novelty, but with a strenuous day behind them, and
    a never-ending fund of anecdotes and yarns of past war experiences as a nightcap,
    blissful sleep soon fell upon them.’


    ![Image](images/f0100-01.jpg)


    Margaret Peaden, of Ramshaw Hunstanworth, who spent her 91st birthday knitting
    socks for soldiers.


    The weekend proved so popular with Home Guard members than several booked themselves
    in for further sessions.


    ### Sunday games – sinful or not?


    The vexed question of whether the playing of games should be allowed in Prudhoe’s
    parks on Sunday brought a theological rift at a meeting of Prudhoe UDC, where
    the vicar, the Rev. R.E. Robson was in favour, while strong opposition was registered
    by the Methodist Churches of St John and Prudhoe Station, as well as the Lord’s
    Day Observance Society which said that the observance of the Lord’s Day had never
    been more important.

