    多萝西维持着布料店的经营，奥西很快回到诺森伯兰郡的各个村庄和农场继续从事他的贸易。这对夫妇于 1946 年搬到赫克斯姆（Hexham），幸福地生活了 59
    年，直到多萝西去世。奥西在 1969 年退休，直到 90 多岁时仍在使用驾驶汽车。


    《赫克斯姆快报》（`Hexham Courant`）中“弗雷德爷爷的儿童角”的成员们与地区妇女协会、妇女志愿服务团（`Women’s Voluntary Service`）及其他机构合作，在灌木丛中搜集蔷薇果。他们获悉全国范围内的努力收获了
    200 吨这种橙色的果实，果实富含能够对抗感染的维生素 C。按照每磅 300 个果实的计算，这意味着全国从带刺的枝条上采摘了约 1.43 亿个果实，足以制作
    60 万瓶糖浆，这些糖浆每盎司瓶装出售，6 盎司 1 便 9 士，或 8 盎司 2 便 4 士。每天喝一勺就足够让孩子获得一半所需的维生素量。


    一个来自普鲁霍（Prudhoe）埃奇韦尔（Edgewell）的骗子找错了对象，试图买一张抽取肥鹅奖的彩票。这位潜在买家是一名休假警察，当被问及是否想要票时，他说他全都要，并逮捕了那个街头小子从事非法彩票。他在赫克斯姆初级法庭（`Hexham
    Petty Sessions`）被罚款 10 士林。


    在同一处法庭上，一名因汽车保险杠未涂白漆而被罚款的司机抱怨道，在圣诞节前夜午夜，警方对赫克斯姆的一处停车场进行搜查后，他收到了传唤。他表示搜查的时机选择得不好，这与这一年之中惯有的善意精神和唱诗歌氛围形成了鲜明对比。


    两名男子因滥用汽油被罚款各 5 英镑——其中一人使用他的工厂家具货车从赫克斯姆开车到五英里外的汉姆绍（Humshaugh）参加舞会；另一人则非法开车从科布里奇奇（Corbridge）开三英里去赫克斯姆看电影。


    尽管他们被捕获的时间不同，且频繁被转移到不同的战俘营，但两名科布里奇的士兵在同一个营地相遇了，两个人的家庭都收到了家中的圣诞信片。在同一个营地，还有皇家工程师团（`Royal
    Engineers`）的 H. 布罗迪·科克莱恩中尉、皇家炮兵（`Royal Artillery`）的芬尼·迪恩·汉姆德中尉，以及皇家诺森伯兰掷弹团（`Royal
    Northumberland Fusiliers`）的哈特威斯尔肯尼斯·克拉克少校。


    汉姆德中尉在圣诞信片中报告了这次会面，他在信中说自己很好，并转告科布里奇的朋友。他还报告说营地有一支很好的舞蹈乐队和一个交响乐团。


    ## 军舰周与泰恩代尔号


    1942 年 2 月，“赫克斯姆军舰周”启动，该地区被赋予集资 20 万英镑的任务以赞助皇家海军驱逐舰泰恩代尔号（`HMS Tynedale`）。这艘驱逐舰并未直接以该地区命名，但作为一艘猎人者级（`Hunt`
    class）舰艇，它以“泰恩猎队”（`Tynedale Hunt`）命名，该猎队的猎犬养在科布里奇附近的斯塔肖（`Stagshaw`）。船的军官舱里挂着一只诺森伯兰狐狸面具，是由猎队主人送给船的。


    募捐通过穿过镇子的盛大游行启动，由民卫队（`Home Guard`）乐队领队，包括民卫队、军事和民防运动以及国家消防局、红十字会、空军训练团、妇女土地军、童子军和女童子军的代表。


    整个地区举行了众多活动，包括捐款、音乐会和纸牌牌赛；而阿伦代尔附近的肯恩利议会学校（`Keenley Council School`）的学生们筹集了 93
    英镑 13 士——折合每人 5 英镑 10 士 2 便士——其他学校也筹集了类似的金额。


    在一周忙碌的筹款后，组织者召集了四位当地战争英雄，正式揭晓了筹集总额——三等军官德里克·吉尔克里斯特 MBE（`Third Officer Derek Gilchrist
    MBE`）、飞行军官哈罗尔德·罗布森 DFM 勋（`Pilot Officer Harold Robson DFM`）、飞行军官亚瑟·加威尔韦尔 DFM 勋（`Pilot
    Officer Arthur Garwell DFM`）以及罗伯特·巴蒂 GM 勋（`Robert Baty GM`）——当公布在武装力量日存入了 268,476
    英镑时，现场爆发了巨大的掌声。到周末结束时，最终数字为 325,099 英镑。


    ![Image](img/f0110-01.jpg)


    当地企业对 1942 年赫克斯姆军舰周的启动给予了巨大的支持。


    在问及想要从新获得的“家庭”什么样的舒适时，泰恩代尔号的船员向赫克斯姆妇女协会（`Hexham Townswomen’s Guild`）索要了袜子、毛衣、足球鞋、扫雷手套、飞镖板、桌游、长棋板、书籍和纸牌——以及一架钢琴以协助船上的戏剧表演。一周内，他们收到了赫克斯姆海雷斯（`High
    Reins`）莱斯利·曼夫妇（`Mr and Mrs Leslie Mann`）赠的钢琴，他们的独子在几个月前服役舰队航空兵时牺牲了。


    泰恩代尔号于 1939 年 4 月 11 日从格拉斯哥克莱河边的亚历山大·斯蒂芬父子公司（`Alexander Stephen and Sons`）订购，于
    1939 年 7 月 27 日开工。她于 1940 年 6 月 5 日下水，于 1940 年 12 月 2 日服役，总造价 42.5 万英镑。她排水量 904
    吨，装备四门 4 英寸防空炮和八门较小火炮。


    泰恩代尔号于 1939 年 4 月 11 日订购，于 1939 年 7 月 27 日铺骨。她于 1940 年 6 月 5 日下水，于 1940 年 12 月
    2 日服役，总造价 42.5 万英镑。她排水量 904 吨，装备四门 4 英寸防空炮和八门较小火炮。


    泰恩代尔号主要负责护航任务，最初作为驻扎波尔斯茅的第一驱逐大队（`First Flotilla`）的一部分，但在 1941 年 3 月 11 日，她遭受了德国空军（`Luftwaffe`）对波尔斯茅码头的袭击而受损。


    泰恩代尔号的高光时刻出现在 1942 年 3 月 27 日，当时她作为护卫之一参加了塞内尔袭击，装满爆炸物的驱逐舰坎普敦号（`Camptown`）撞向了诺曼迪号（`Normandie`）。这次大胆的进攻并未让泰恩代尔号在战争的剩余时间里停止行动，而是持续了五年。在尚特（Ushant）西南方，泰恩代尔号发现了潜艇
    U593——这正是她在塞内尔袭击中交战的那只潜艇。然而，当潜艇浮出水面时，它被击沉了。


    ![.](img/f011011.)


    泰恩代尔号。


    在从港口撤离剩余的小船时，泰恩代尔号和另一艘驱逐舰阿瑟斯顿号（`Atherstone`）交战了第五鱼队（`5th Flotilla`）的五艘德国鱼雷艇。


    泰恩代尔号于 3 月 29 返回波尔斯茅，与幸存的护队一同返回。她在修理后于 4 月 18 日恢复工作，继续在西洋海域执行护航。5 月 14 日，她遭遇了德国巡洋舰斯蒂尔号（`Stier`），并作为击沉它的舰队的一部分，尽管仅是支援舰。她还参与了击沉德国巡洋舰科梅特号（`Komet`）。


    泰恩代尔号被派往地中海服役，作为 1943 年 3 月 8 加入第 59 驱逐队（`Destroyer Division 59`）的一部分，保护从布罗斯茅到阿尔及利亚之间的护队。在盟军入侵西西里期间，她担任拦截者，并救援了荷兰货船“菲利克斯·扬·范·马尼克斯号”（`Felix
    Jan Van Manix`）上的 218 名乘客，该船于 1943 年 10 月被鱼雷击沉。


    1943 年 12 月 12 日凌晨 6 点，泰恩代尔号在阿尔及利亚海岸执行护航任务时，被德国潜艇 U-593 发现并攻击——这正是她在塞内尔袭击中交战的那只潜艇。一枚声纳制导鱼雷直击中部的锅炉室，将船体断为两段，134
    名船员中有 90 多人遇难；一些受伤的人后来在岸上去世了。


    这次沉没的幸存者之一是罗·巴伯（`Ron Babb`），他在 1995 年回忆时提到，赫克斯姆及周边地区的人们非常喜爱泰恩代尔号，向船只寄送信件、卡片和游戏，帮助军官们在战争期间保持乐观。


