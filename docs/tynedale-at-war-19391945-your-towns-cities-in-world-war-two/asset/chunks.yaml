    汤姆林先生表示，该中心将具有无价之，因为它能在工人们病倒严重并导致彻底崩溃之前提供为期两周的假期，从而节省了数千小时宝贵的工业工时。东北休息委员会主席谢尔拉·贝文顿博士说，在战争第五年，人们对休息的需求不仅是身体上的，也是心理上的。她指出，赫克斯姆（Hexham）中心尤为需要，因为东北部战争工人的体力很差——这反映了女孩们营养不良，以及该地区可怕的失业和经济萧条时期留下的影响。


    ![Image](img/f0147-01.jpg)


    加拿大驱逐舰 `Restigouche` 号的舰员在泰恩河下游的贾罗（Jarrow）进行修整期间，在博福朗（Beaufront）和阿尼克（Anick）地区协助收获提供了帮助，并与当地人交流在一起。


    两名在船只停靠在贾罗进行修整期间在阿尼克地区协助收获的加拿大海员，在当地一家酒馆过度地庆祝了他们即将重返大海。来自多伦多的普通海员塞缪尔·帕特顿和来自蒙特利尔的主任海员詹姆斯·菲茨杰拉德决定带两只青铜梅鹿作为纪念品，这些鹿是从他们在博福朗城堡意大利园林里的底座上生生扯下的。每只鹿价值
    50 英镑，而且暴力拆除留下的损坏无法修复。在被警察质问时，这两名男子起初否认参与，但后来承认各自拿了一只。


    警察督事威廉·古德费尔洛告诉赫克斯姆的法官，这两名男子在收获工作中的志愿服务表现非常出色，深受当地社区的喜爱和优待。因此，他们的行为蒙辱了自己，也蒙辱了整个船员，这非常遗憾。


    代表两名男子的辩护律师 K.H. 博姆表示，在饮用了过量酒精后，他们去了城堡，那里的人对他们非常友好，于是他们决定拿走那些鹿。


    博姆先生说：“当这两个人恢复清醒时，他们发现发现自己偷了鹿而感到非常羞愧。考虑到他们的体重，他们是如何把那些鹿带回宿舍的，这还是是一个谜。”


    他表示他们对自己的行为深表遗憾，并渴望支付维修费用。由于他们的行为，他们在德纳监狱（Durham Gaol）度过了几个晚上，这给他们带来了持久的影响。他还指出，虽然土地主哈罗德·库伯特上尉正在海外服役，但他持有授权书的母亲瑞雷
    夫人并未要求严厉的判罚，也没有寻求任何赔偿。


    法官们认为，在监狱关禁对盗窃行为已经是足够的处罚，并撤销了指控。他感谢这两名男子通过协助收获为英国尽了一份。


    这两名男子来自加拿大驱逐舰 `HMCS Restigouche` 号，全舰船员都在城堡和附近的阿尼克庄园（Anick Grange）协助了收获。


    ### 被“失控”气球杀死


    1943 年 11 月 4 日（周四），两个拦截气球（用于防止德国空军的低空攻击和精确轰炸）从海岸附近的锚点脱离，向内陆泰恩德谷（Tynedale）漂移。其中一个失控的气球停在了斯帕蒂·李（Sparty
    Lea）附近的阿伦代尔山地（Allendale fells），其锚绳被卡在一个干石墙上。


    第一个气球很快被警察人员放气，随后他们出发放气停在山地更高处的第二个气球。许多旁观者聚集在一起观看行动，其中一名来自辛德霍普（Sinderhope）布罗德盖特小屋（Broadgate
    Cottage）的议会员工罗伯特·贝蒂（47 岁）决定近距离观察。有人看到贝蒂先生进入田地，在气球旁蹲下，并似乎开始卷起它。然而，气球随后爆炸，导致他受了致命伤。他稍后在赫克斯姆医院因伤势去世。


    在随后的验证会上作证时，来自斯帕蒂·李低哈伊雷克（Low Hayrake）的玛乔丽·吉尔穆说，当警察离开第一个气球时，曾警告人们远离。包括一个老人和两个孩子在内的人群正站在墙后看着气球，此时它爆炸了。


    来自斯帕蒂·李斯诺普磨坊（Swinhope Mill）索恩登宅（Thorndene House）的约翰·莱特（79 岁）被送往纽卡斯尔的皇家维多利亚医学院，左眼有裂伤；同样来自斯诺普磨坊的安妮·费瑟斯顿（28
    岁）也受了多处伤。来自艾伦黑德（Allenheads）礼堂小屋（Chapel Cottages）的 7 岁女孩维拉·尼克森被送往赫克斯姆医院，患有轻微擦伤伤；而来自斯帕蒂·李白岭（White
    Ridge）的哈罗德·尼克森（14 岁）被送往肖特利桥医院，胸部有穿刺伤和多处弹片伤。


    在 2006 年时，当时 77 岁的尼克森先生表示，爆炸后他在医院呆了近两个月，身上仍然留有疤痕。“我记得当时有两个拦截气球卡在山野上，”他回忆道，“周围有几个人，警察也在那里。他们放出了其中一个的气体，但突然‘砰’的一声，等我我知道时，已经在
    50 码外了！我在肖特利桥医院住了七周，直到今天身上还带着弹片。”


    爆炸后，气球尾部起火，火焰逐渐蔓延到头部，直到完全烧毁。空军部的一位专家在验证会上告诉，他认为爆炸可能是由于气球内的一小袋气体和空气被摩擦点燃引起的。某些版本的拦截气球带有小型爆炸荷，可以由被缠住的敌机引爆以确保其被毁，这也是爆炸的另一个可能原因。


    ### 行动中的当地英雄


    服务于南斯塔福克郡团团的普鲁霍（Prudhoe）私兵威廉·亨利·查尔斯沃斯因在西西里岛的卓越英勇而获得了军事勋章。他是一次滑翔攻击小组的一员，目标是夺取一座名为“大桥”（Ponte
    Grande）的桥，士兵们称之为“滑铁卢桥”。


    桥梁被占领后，炸药包被移除，电话线被切断，确保了这座重要桥梁不会被炸毁。夺取桥梁十五分钟后，一载有十名德国士兵的卡车试图强攻桥北端，但查尔斯沃斯挥着他的`Bren`机枪投入战斗，击毙了其中五个人。当弹匣用光后，他英勇地用`Bren`机枪当球棍冲向剩余人员，此举确保了拆药包的工作没有被中断。


    ![Image](img/f0150-01.jpg)


    普鲁霍私兵威廉·亨利·查尔斯沃斯因在西西里岛英勇被授予军事勋章，尽管他腹部中弹，但他拒绝向敌人投降。


    在另一次场合，他在密集的火力下带着他的`Bren`机枪冲了 50 码，以便他的小组撤离战斗。第二天下午，查尔斯沃斯腹部受伤，24 小时内没有得到医疗治疗，这段时间一直在清理和维护他的`Bren`机枪。当桥被敌人临时夺回时，他拒绝投降并一直躲着，后来重新加入了他的排。

