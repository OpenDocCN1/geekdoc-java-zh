    ![Image](img/f0179-01.jpg)![Image](img/f0179-02.jpg)


    当工党宣布将在 1945 年大选中中反对哈克斯姆议员**道格拉斯·克夫顿-布朗上校（Colonel Douglas Clifton-Brown）时，传统被打破了。克夫顿-布朗上校曾任下院议长，按照传统，议长是不受竞争当选的。工党候选人是来自利兹的欧斯特·卡瓦纳（Ernest
    Cavanagh），但议长以 4,645 票的优势当选。


    卡瓦纳先生辩称他并不是反对议长，因为克夫顿-布朗上校在议会解散时已经卸下了该职位，他只是保守党的候选人。克夫顿-布朗没有以任何政党名义参加，正如议长的身份一样，他以
    4,645 票的优势当选。他获得了 16,431 票，而卡瓦纳先生也获得了 11,786 票这一相当不错的成绩。


    哈克斯姆集团医院供应站建立于战争初期，并于 1945 年 6 月底关闭，到那时，它已向军人、医院患者和贫困平民发放了超过一百万份慰问品和手术用品。卷制了超过
    1000 英里的绷带，外科部门使用了 1000 英里的材料，并将 200 吨羊毛编织成了生活慰用品。整个战争期间，供应站平均有 300 人工作，多年来有 4000
    多人对供应站的工作做出了贡献。通过捐款和自愿努力为站筹了约 20,800 英镑，但该计划很大程度上是自给自足的，因为由 T.M.罗布森夫人经营的食堂提供了
    2.6 万份餐食。


    委员会主席诺曼·D·纽尔夫人（Mrs Norman D. Newall）说：“这完全不合逻辑，但供应站的关闭笼罩着一片阴郁，因为对于许多在战争期间愉快、自愿地在一起工作并建立了这么多友谊的工人来说，这将是一次巨大的离别。”


    随着从德国战俘营回家的囚犯从涓涓变成洪流，哈克斯姆警察面临了尴尬，因为四名因入室盗窃罪待审的囚犯通过拆除牢室的砖块和石头，从墙洞爬出逃离了哈克斯姆警察局。这四人外逃了十二小时，后在惠特菲尔（Whitfield）被重新捕获。


    哈克斯姆治安法庭得知，由于那天晚上很暖，这四个人被允许使用警察局后方的操场。他们在晚上 7 点接受了检查，发现都在场，但晚上 9 点的进一步检查发现，牢室和操场都空了。他们用从牢室走道百叶上撬下的铁棒，以及从操场墙上扯下的排水管，撬开了操场墙上的石头和砖块。他们开了一个长
    2 英尺、高 18 英寸、宽 18 英寸的洞。


    欧洲胜利日三个月后，当日本投降的消息传开时，人们在凌晨时分的哈克斯姆街头跳舞。篝火点燃了，烟花也大受欢迎，不仅是孩子们，还有来自急诊医院穿着蓝色衣服的康复患者，他们乐于在最意想不到的地方放鞭炮。


    一名来自斯托克斯菲尔德的年轻人、名为“贝文男孩”（Bevin Boy）的阿兰·林（Alan Lynn，19 岁），在科布里奇的王子电影院放映电影期间燃放庆祝闪光弹被带上法庭，罚款
    2 英镑。


    阿伦德尔（Allendale）尽情狂欢，除了通常的篝火和烟花外，还增加了真人巡游，主角包括丘尔、山大叔、斯大林、蒋介石，以及最后绳在一起的希特勒和日本领导人东条希喜。尽管食物配给短缺，整个地区仍举行了街头派对和舞会。


    ### 大卫·贝尔


    作为战争期间首批从舰船上飞机的勇敢年轻人之一，斯托克斯菲尔德的大卫·贝尔（David Bell）属于精英飞行员。但即使在舰队航空队的顶尖王王中，大卫也有自己独特的成名理由。作为海军飞行员，他在远东战争最后阶段从一艘航空母起飞。他的中队本计划对日本进行轰炸，但几天前，原子弹的投掷结束了敌对行动。然而，他仍必须执行任务，并内心不安地意识到投降的消息尚未传达给所有日军成员。


    二战胜利日后，大卫驾驶了十二架飞机之一，前往当时仍由日本人控制的香港启德机场执行侦察任务。油箱里几乎只剩下油气，他降落在香港机场——当飞机停下时，看到一辆日军座驾朝着他的飞机驶来，他感到相当震惊。他爬出驾驶舱时，几位日本高级军官正从车里出来。其中一人走向大卫，将他的礼剑交给了大卫——他把整个机场都交给了大卫照料！那把剑是大卫最自豪的财产之一，在四十年的大部分时间里，它展示在他位于斯托克斯菲尔德巴特路家中的走廊里。


    大卫于 1924 年出生于沃尔尔森，第二次世界大战开始时，他随沃尔尔森语法学校的其他学生一起疏散到阿尔尼克（Alnwick）。18 岁时，加入皇家空军志愿备备队，大卫在加拿大安大略开始训练成为皇家海军舰队航空队的飞行员，驾驶虎蛾式双翼机和更现代的哈佛飞机。在空中飞行了
    186 小时后，他获得了飞行执，回到英国继续训练，并于 1944 年 7 月加入 814 海军中队。


    同事们称他为“丁格”（Dinger），他驾驶飞鱼鱼式攻击机，主要在苏格兰练习低空飞行、夜间编队和俯冲。1945 年 3 月，他乘坐英国女神号从克莱德河出发，前往远东迎接他的命运。那一年些时候，在太平洋和中国海执行演习时，一次故障迫导致大卫在悉尼住院，随后在阿德莱德休养。


    住院的经历导致他与中队分离，不得不“搭便”回家，这包括他在新几内亚待了一段时间，那里的日本人仍在战斗，不知道战争已经结束。


    战后，大卫于 1958 年成为布鲁姆县立小学校长，最后在杜伦大学担任讲师。他惊讶地发现，作为校长，他被要求成为斯托克斯菲尔德教区委员会的一员——部分原因是会议在他的书房举行。职责还包括确保壁炉有足够的煤炭，并在会议中途准备茶。这是他三十年政治生涯的开始，这段经历使他从教区委员会一直发展并在
    1985 年至 1986 年间担任泰恩代尔（Tynedale）委员会主席两年。


    ### 日军战俘营的恐怖


    二战胜利日后几周，许多人回到家，讲述了在战俘营中遭受日军之手的恐怖故事。N.T. 贝威克（N.T. Bewick）上尉在被关押三个半年后回到他位于科布里奇的家中——他看到的第一个消息之一就是官方伤亡名单上关于他的死亡通知。他在
    1942 年新加坡沦落时因受伤被日本人俘。遣返后，他说：


