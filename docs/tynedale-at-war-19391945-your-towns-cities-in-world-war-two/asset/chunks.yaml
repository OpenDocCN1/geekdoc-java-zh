  trans: '

    他继续说道：“最大的道德问题是，是否要让一百万英国年轻人为了干预大陆上的一场不公正纷端而牺牲。在我们冲去援助一个受霸凌之者的较小国家之前，我们必须确定确实有一个霸凌者。”


    尽管莫斯莱是这么说，泰恩郡（Tynedale）仍处于战争警戒，`Hexham 军童团`是该地区首批注册为空防员的团体之一。


    不过，并非一切都是战争话题，`Hexham 市议会`拒绝了允许儿童在周日使用 `Sele` 游乐场秋千的请求。`Joe Cullen` 议员支持这项申请，并指出
    `Tyne Green` 已经允许周日高尔夫球，他也希望看到周日也能打保龄球。他说：“我不认为这会让孩子们远离主日学校或礼拜堂，也不会对安日造成任何亵渎。”


    然而，`Iveson` 女议员反对这一举动，她表示：“一周中有六天孩子们可以使用秋千，我认为他们他们在周日完全可以不用秋千。”该请求被拒绝了。


    当国家为战争做准备时，一名 `Wark` 水兵不幸成为九十九名死者之一，当时那不幸的潜艇 `HMS Thetis` 在威尔士海岸外进行试验时沉没，这预示了未来的严峻。他是士官
    `John Adam Hope`，与母亲同住在 `Elliott Terrace`。他年 36 岁，在`皇家海军`服役了二十年，其中十五年在潜艇部队服役。


    1939 年 6 月征兵制度的实施非常顺利，该地区内的任何`劳动力交换处`都没有出现问题，男人们需要在那里注册参加军事训练。`Hexham 交换处`的一位官员说：“人们踊跃报名，心情很好。有两点值得注意——他们来时的良好精神，以及他们出色的体魄。”有人步行了六英路来到`交换处`
    报名，其他人还包括一个来自 `Harrogate` 的人（他来 `Hexham` 参加婚礼），以及一个在该地区度假、穿着短裤、皮肤黝黑的男子。申请注册成为良心主义者的人很少，尽管他们明显倾向于加入`皇家空军（RAF）`。


    无处不在的战争威胁在 8 月底升到了更高的水平，随着国际局势恶化，该地区所有的空防哨所都有人值守，所有的路灯都被关闭。灯管制也导致路缘和街角被涂成白色。商业几乎陷入停滞，商店除外，商店对罐头食品和遮光窗户的材料需求巨大。尚未领取防毒口罩的居民被敦促尽快前往`Hexham
    市议会`办公室领取。


    当战争最终于 9 月 3 日宣布时，人们收到的消息非常冷静，空防警报响起，特警们戴着防毒口罩和钢盔头走上 `Hexham` 的街道。他们被派去守卫整个地区的桥梁和其他战略要点，并确保严格遵守灯管制规定。


    ![Image](img/f0015-01.jpg)


    心碎交加的首相 `Neville Chamberlain`。


    `Hexham 市区议会`主席 `Tom Wheatley` 议员发表了严厉的辞，他说：“我得出结论，当世界上放着像希特勒那样的疯狗时，绥协政策是没用的。我很高兴我们将尝试除掉这只疯狗。”


    ### 难民


    到 9 月第一周，随着第一枚德国炸弹落在波兰，`Hexham` 已经开始接收来自 `Newcastle` 和 `Gateshead` 的首批 4000 名计划疏散难民。五列火车上的儿童到达
    `Hexham 火车站`，乘坐一队大巴将他们送到高级中学，那里已做好准备将他们转移到农村地区的各个部分。车主也被要求前往火车站，协助将这些不知所措的孩子送往他们新的临时家。


    `Hexham` 的难民来自 `St Dominic’s 天主教学校`（690 人）；`Cowgate`（300 人）；`West Walker 委员会`（733
    人）和 `East Walker 委员会`（476 人）。`Bellingham` 的配额包括来自 `Heaton Park Road 委员会` 的 450
    名儿童，而 `Haltwhistle` 有来自 `Delaval 委员会` 的 700 人，`Allendale` 有来自 `Whickham Road 委员会学校`
    的 307 人和来自 `Pendower Bridge` 的 214 人。


    根据 `Hexham Courant` 报报道，孩子们在老师的陪伴下到达车站，“兴奋得喘不过气”。每个孩子都有一个防毒口罩和一个身份牌。在 `Patton`
    Doctor 的带领下，医护小组进行了体检，手、牙齿和头发都经过了严密检查。


    ![Image](img/f0016-01.jpg)


    战争爆发后，数千难民开始涌入泰恩郡。


    随后，他们领取了配给，包括饼干、一罐腌制牛肉、两块巧克力、一罐无糖奶和一罐炼乳。


    孩子们受到了非常欢迎，一位 `Hexham` 母亲告诉 `Courant` 报：“我们必须考虑孩子们，而不是我们自己。我们过得相对舒适，但这些孩子离开了他们的家、朋友和一切。我愿意尽自己一份之力来减轻他们的负担。”


    她的观点得到了一个男人的认同，他补充道：“这些年轻人无法改变自己的处境。他们可能并不富裕，但我确定，照顾他们的人不会感到麻烦。”


    城市的孩子们很快被安置在当地家庭，尽管有些居民拒绝接收任何难民。一个男孩写信给妈妈：“Hexham 是个好地方。那里有很多李子、梨和黑莓。那个女人对我们很好，给我们吃很好。这像是一场假期——我们整天都在公园玩。”


    乡村生活对许多难民来说是个谜团，有几个男孩在 `Hexham` 的街道上寻找糖果店却无一获，而电影院的缺失也让人深感遗憾。`Hexham 战争纪念医院`秘书
    `Michael Green` 呼吁捐集书籍和杂志为难民建立图书馆，并安排了城内外孩子之间的足球赛。还呼吁提供室内游戏来消遣孩子们。


    `Courant` 报报道，在 `Corbridge` 疏散过程“相当顺利”，但也有人拒绝接收儿童，而且一些母亲遇到了一些困难。在 `Haltwhistle`，大巴和一队私家车将孩子们送到
    `Olympic Hall`——该大厅是用`泰坦尼克号`的姊妹`奥林匹号`在拆解时回收的材料制成的——位于 `Smith and Walton 喷漆厂`，在介绍给寄宿家庭之前，他们吃了丰盛的肉汤和包子。`运输部`指出，`Haltwhistle`
    是该地区首批完成儿童安置并填写正确表格的地方之一。


    在处理完孩子们及其母亲后，镇上几乎每个家庭都敞开了大门，在本周晚些时候，`Haltwhistle` 还欢迎了“孕妇、残疾者和盲人”。


    200 多名儿童和 75 名母亲在 `Wylam` 受到了热烈欢迎，特别是孩子们寻找安置地毫无困难，以至于有些家庭因没有难民入住而感到失望。安置官 `W.E.
    Keys` 上校报告说，所有孩子看起来都照顾得非常好，干净且“异常友善”。


    '
