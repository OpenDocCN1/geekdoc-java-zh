    Sergeant Major David Forster of Hexham was posthumously mentioned in despatches
    for gallant and distinguished conduct in the field during the Middle East campaign.


    Land Army girls were blamed for getting the licensee of the Crown Inn at Stannersburn
    into trouble. A visit to the North Tyne pub by weights and measures officers found
    that the gin being sold by landlady Mary Wear Nevin had been significantly watered
    down, the strength being some six per cent less than it should have been.


    The magistrates were told that water had been added to the gin because Mrs Nevin
    felt that in its neat form, the gin was too strong for the Land Army girls who
    frequented the inn. The inspector told the court: ‘Mrs Nevin may have felt she
    was looking after the land girls by ensuring they did not get too much strong
    drink, but she was quite unjustified in watering down the gin.’ Mrs Nevin was
    fined £4, with 15s costs.


    ## CHAPTER SIX


    ## The Empire Strikes Back


    Many Tynedale men were involved in the D-Day landings on 6 June, as the 50th (Northumbrian)
    Division was in the spearhead of the landing parties on the Normandy beaches.
    As the invasion gathered pace, General Bernard Montgomery singled them out for
    special mention.


    Journalist turned soldier Captain Donald Leslie told the Courant that Northumbrians
    had played a big part in winning the last war and would do so again over the next
    few months. Describing the D-Day landing fleet, the greatest armada of invasion
    vessels ever assembled, he said:


    ‘It was a stupendous spectacle, with ships big and small, stretching as far as
    the eye could see – from 10,000 tonners to little motor launches – and with a
    mighty air umbrella over us. We had been warned to expect attacks from both Nazi
    E-boats and U-boats but the night passed almost without incident – a lasting tribute
    to the support we got from both the Royal Navy and the Royal Air Force. Just before
    dawn, the sky flickered with light and we knew the bombers were finding their
    targets.’


    As the coast of France neared, Captain Leslie recalled hearing an unmistakably
    Northumbrian voice calling out: ‘Wah not far away from them noo. It’ll not be
    lang afore wah’re amang them agyen.’


    The 50th Division attacked over a 5,000 yard front, onto Gold Beach which was
    studded with steel spikes and deadly weapons buried beneath the water line. Although
    they were exposed to terrible fire from the shore, they succeeded in getting back
    onto French soil four years after the Dunkirk evacuation. Captain Leslie said:


    ‘We did it the hard way, because this was not a dry-shod landing. We went into
    the sea, some of us up to our waists, some up to our necks, and others out of
    their depth completely, but by 2pm, we had twelve battalions ashore, and by last
    light, a beachhead had been established, and we had made inroads three to four
    miles inland.’


    He paid tribute to a Private Clark of Quatre Bras, Hexham, who, although wounded,
    asked to be left behind on the beach so that he would not hamper his comrades
    as they advanced.


    ### Salute the Soldier fundraising


    The invasion coincided with timely Salute the Soldier fundraising drives in virtually
    every town and village across the district. The stirring slogan was: ‘Repay your
    debt for the mighty deeds achieved by our soldiers by lending to the point of
    great personal sacrifice.’


    There were parades and special efforts – and the money poured in. At Hexham, the
    week was launched by the Speaker of the House of Commons, the town’s MP Colonel
    Douglas Clifton Brown, who said he was delighted to see American GIs in the phalanx
    of uniforms on parade through the town centre. Colonel Brown said: ‘I would like
    to offer them a warm welcome and to say how proud we are that these gallant allies
    are with us today. You have probably read how well they are doing across the Channel,
    and how well they did in Italy. We are proud to serve under a great American,
    General Eisenhower, one of the world’s great generals.’


    ![Image](images/f0157-01.jpg)


    Mickley’s Flight Sergeant Sidney Ross Anderson was awarded the Distinguished Flying
    Medal for his role in bombing operations over enemy occupied territory. He was
    a member of the RAF Dambusters team as well as being involved in the sinking of
    the German battleship Tirpitz in a Norwegian fjord. He was killed in action in
    January 1945 when his aircraft was lost in a raid on U-boat nests at Bergen in
    Norway.


    Hexham’s target for the patriotic effort was £275,000, which was to be used to
    maintain an infantry battalion of the 50th Division for a year. The project was
    launched with a parade involving units of the Royal Navy, the Army. Home Guard,
    ATS, RAF, WAAFs, Civil Defence, NFS, British Legion, Red Cross cadets, Scouts
    and Guides, Salvation Army, Boys’ and Girls’ Brigades, the Land Army and the NAAFI,
    among others, in a parade led by the Hexham Home Guard band.


    A daily update of the Hexham total was given and on the first day alone more than
    £106,000 was pledged, the total being announced by seven-year-old Barbara Armstrong,
    of Hexham Infants School, at a Merrie England day of Maypole dancing and others
    festivities.


    There was a fitness display by the fire service and Home Guard despatch riders
    gave a display in the Sele. By the end of the week, the total was £413,875, as
    Hexham exceeded its target by some distance. It was the same across Tynedale,
    as every family and business dug deep to support the cause. At Bellingham the
    target was £45,000 to buy three Churchill tanks and the total was £70,000, raised
    through whist drives, dances, football matches, gymnastic displays and a performance
    by the Flares and Flashes Concert Party from Bellingham.


    Targets across the district were: Acomb £2,500, to be achieved through efforts
    including a concert by the Home Guard band, comic football match and fancy dress
    parade; Allendale £6,000, through a concert by the band of the Royal Northumberland
    Fusiliers; Blanchland £1,000; Corbridge £15,000, through concerts, dances and
    a garden fete; Fourstones and Newbrough £5,000, through five-a-side football match,
    concerts, treasure hunt and bowling tournament; Haydon Bridge £5,000, to be achieved
    through a barn dance, lantern lecture, sports day and whist drives; Stocksfield
    £20,000, with a sandcastle competition, whist drives, children’s sports, a team
    shooting competition and a concert by Prudhoe Gleemen; Riding Mill £10,000 through
    a dance, drumhead service, variety concert, film show, cricket match, children’s
    sports and gymkhana, and Wylam £15,000 where special events included a display
    of Morris dancing,'
