  trans: '

    明星们曾出现在纽卡斯尔的“赫尔伯特剧院”（The Hulberts Follies），尽管行程紧凑，他们还是同意为了友谊放弃周日的下午。剧院的场地由`Hexham
    Entertainments Company`免费提供，所有利润都捐赠了当地的战争慈善机构。他们得到了`杰斯蒙德小丑`（Jesmond Jesters）的支持，这支滑稽表演队自大战以来一直深受部队的欢迎。


    明星们正处于最光彩、最快乐的心情，接受了欢呼观众的久久掌声。杰克在谢幕致辞时台上说：“今天下午能来到赫克斯姆真是太棒了，我们喜欢这里的每一分钟。”非现役人员的门票收入共计
    52 英镑 19 先，这笔钱由`赫克斯姆集团医院供应站`、`英国红十字会赫克斯姆分会`以及`赫克斯姆救助协会`平分。


    赫克斯姆那座拥有 1300 年历史的修道院的重要性受到了质疑，因为一次招募志愿者担任火哨员的号召仅吸引了寥寥几个人名字，这让牧师 J.V.C. 法克哈牧师非常不悦。尽管发出了多次号召，只有十名志愿者站了出来。他说：“这不仅仅是教会当局的问题，而是整个教区和镇民的责任。我们都应该尽力守护修道院，因为通过这样做，我们是在守护自己的家。这是一件关乎整个镇子的事情。”


    仪仗乔治·里亚（George Reah）表示，在一个人口一万的镇子上，竟然只能找到 10 个人来守护其最著名的建筑，这简直是“一种奇耻的耻辱”。


    在`赫克斯姆警察法院`，一名当地水员因无故缺席船只被收押留，等待军事护送。助理厨师本杰明·詹姆森（Benjamin Jameson）声称他已回到了船只停泊的地方，但船不在那儿了，于是他决定回乡。在另一场审判中，来自格拉斯哥的
    25 岁詹姆斯·汤斯利（James Townsley）因盗取新布鲁格勒沃什农场（Allerwash Farm）的财产被判处六个月苦役，他在那里曾被允许在一个谷仓里和一个
    19 岁的女性伴侣同睡。事实证明，他是`卡梅隆高地人`（Cameron Highlanders）的逃兵，已潜逃了三个月，法官席约翰·查尔顿（John Charlton）告诉他：“你是苏格兰的耻辱。你是军队的逃兵，却在全国流荡过着偷窃的生活。”


    弗朗西斯·沃尔兰特（Francis Volante）也成为了历史的一部分，他因在镇上的福雷街醉酒滋事被带到`赫克斯姆治安法庭`审判，当时他在那里大声唱歌并使用污秽语言。当被要求安静时，他变得具有攻击性并被捕。警察警监威廉·古德费罗（William
    Goodfellow）表示，他对他提出这一指控感到遗憾，因为这是自从战争开始以来针对`赫克斯姆地区`任何武装部队成员的首次指控。通过破坏这一记录，沃尔兰特不仅自己蒙了辱，也让所有驻在该地区的士兵都蒙了脸。


    2 月，受伤的士兵和护士联手扑灭了赫克斯姆`急诊医院`（Emergency Hospital）发生的一场火灾。一名护士和一名士兵看到浴室冒出烟雾。火起于锅炉房，破入浴室，并沿着伤员所在病房上方的屋顶空间蔓延。病房被疏散，康复中的士兵、护士和医院工作人员使用手摇泵和化学灭火器与火搏，直到医院自己的消防队接手。当镇消防队到达时，有三根水管正在作业，火势被扑灭。浴室被烧毁了，除了屋顶受损外，大量的床单被毁坏。


    在里丁米尔（Riding Mill）的一处`YMCA 食堂`开幕式上，老兵 E.P.A. 瑞德尔准将（E.P.A. Riddell）对那些没有为战争努力贡献力量的人进行了一番严厉的斥责，称他们为“寄生虫个体”。他宣布，国家不需要那些不为战争付出作用的人，并补充道：“每个人都有自己的位置，那些说因为不知道去哪里而无法服役的人，仅仅是没心去找。如果我们想要击败纳粹和法西斯分子，我们都必须战斗和服役。我们已经给意大利人留下了思考的空间，现在必须继续完成击败德国人的任务。”


    一位正在做出贡献的人是罗伯特·巴蒂（Robert Baty，30 岁），他是前`赫克斯姆童军团长`，因伦敦轰炸期间的勇敢被授予`乔治勋章`（George Medal）。作为一名全职`防空员`（ARP
    warden），他与同事`J.B. 米尔恩`（J.B. Milne）爬上铅水管进入了一栋被炸弹击中的房屋的三楼，此时其他炸弹从仍在盘旋的轰炸机上落下，破裂气管的火焰在他们身边轰鸣。他们在房子里搜寻了两个小时，已知有三人在里面，最终一名在碎片中被发现生还的女性通过由床单结成的绳子降到地面并送往医院。


    ![Image](img/f0076-01.jpg)


    前`赫克斯姆童军团长`罗伯特·巴蒂（30 岁）在伦敦轰炸期间担任威斯敏斯特`防空员`时，因英勇表现被授予了`乔治勋章`。


    在搬到伦敦之前，巴蒂先生曾在`赫克斯姆业余戏剧协会`（Hexham Amateur Stage Society）担任舞台调度，并在伦敦担任剧院工程师，对灯光特别感兴趣。他服务过的对象包括著名制片人
    C.B. 柯克兰（C.B. Cochran）和著名演员南希·普莱斯（Nancy Price）。


    ### “鲁比逊·克鲁索”式的经历


    海军炮手埃里克·罗兰斯（Eric Rowlands，23 岁）来自巴登米尔（Bardon Mill），经历了真正的现实戏剧。他的首次航行在船只被鱼雷击没后结束——他因此过上了鲁比逊·克鲁索的生活。他告诉《快报》（Courant）：“我感觉到船在震动并立即向左舷倾斜，看起来它要翻过来了。我抓了一个装有香烟的包，当我上甲板时，差点被冲走。”


    他成功进入了一艘救生艇，并意识到船只沉没时可能被吸入水中。这种情况没有发生，但幸存者遭了机枪扫射，据信那是击沉船只的 U 艇船员所为。他们活了下来，随后进入了另一艘遭遇同样命运的荷兰商船救生艇。那只船只有
    20 英尺，挤满了人，根本无法躺下。由于在大海上漂流未知，幸存者每天被限制为两勺水（大约酒杯大小）、两块饼干、少量的罐头牛肉和炼乳。


    罗兰斯先生说：“白天我挺享受航行的，但晚上太糟糕了。你无法躺下，天气极冷，我只穿了一件夹克。”


    在救生艇上漂了两天后，他们发现了一个岛屿，但没有找到合适的登陆点。在海上又漂了一个晚上后，他们决定让船靠岸，但在进入时撞到了岩石，救生艇破碎。他们设法法爬上岸，收集了尽可能多的物资，在吃了一顿饭后，他们在四个晚上以来第一次在岸上睡觉。

