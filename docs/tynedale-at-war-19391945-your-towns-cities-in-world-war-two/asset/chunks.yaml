    “喷火战斗机行动”确实激发了公众的想象力，在那个工人年薪约为 3 英镑的年代，捐款金额非常慷慨。当基金在 1941 年 2 月结束时，总共筹了 5,250
    英镑，行政费用仅为 34 英镑 16 令士 3 便——仅占总数的 0.76%。


    地区筹款明细显示了资金来源：Acomb £54；Allendale £163；Barrasford £110；Bellingham £75；Blanchland
    £17；Corbridge £595；Fourstones £74；Haydon Bridge £116；Hexham £2,658；Horsley £50；Humshaugh
    £34；Langley £21；Lowgate £61；Matfen £40；Newton £69；North Tyne £114；Ovingham and
    Ovington £29；Riding Mill £175；Hexhamshire £59；Slaley £61；Stamfordham £7；Stocksfield
    £170；Wall £45；Wark £99；殖民及海外 £356。


    一些捐赠和筹款活动的金额相对较小——Stocksfield 的一场婚礼上的“讨闹钱”只带来了少道的 2 令士，一场舞会仅筹了 5 英镑——但社区努力带来了
    3,588 英镑，此外学校和学生贡献了 240 英镑、社交活动、销售和音乐会 784 英镑、募捐箱收集 240 英镑、雇主和员工的每周贡献 107 英镑、竞赛
    91 英镑以及一次全地区的旗日活动 199 英镑。


    人们希望航空生产部长比弗伯鲁克男爵能亲自来到赫克斯姆领取支票，但这无法实现，因此支票通过邮寄寄出，并要求在飞机造好后，在机身上显示“赫克斯姆及地区”字样。


    ### U 潜艇袭击


    当英国空战战在空中激烈进行时，德国 U 潜艇在海上继续造成了沉重损失。《快报》（The Courant）生动地描述了哈尔特威斯尔三副约翰·弗朗西斯·布莱基（25
    岁）所经历的磨难，他是一艘油轮上的 39 名商人海员之一，该油轮在赫布里底岛以西 120 英里处被鱼雷击。他告诉《快报》，U 潜艇在晚上 8:30 左右浮出水面，他说：“他们看起来受到的冲击和我们一样大。我们试图转弯以部署火炮，但在我们来得及之前她就潜下了，留下了我们，我们希望继续旅程。”


    他们的希望破灭了，因为两个小时后，大约 10:30，油轮在中部被一枚鱼雷击中，这也摧毁了其中一艘救生艇。布莱基说：


    “我们只剩下一艘救生艇和一艘我们都挤进去的小艇。我们 14 个人挤在小艇里，几乎没有活动空间，只有极少量的船用饼干和水。船下沉得很缓慢，但当我们离开危险区域时，第二次爆炸折断了船脊——我想可能是击中了我们的药库。


    “当我们脱离险后，又救了另外两个同伴，其中包括一名第一次航海的 16 岁船舱童，他在随后的几天里成了大家的活动灵魂人物。第二次爆炸后不久，潜艇再次浮出水面并靠向我们的船，船长问我（作为小艇的负责人）我们母船的名字。我向指挥官提供了必要信息，他的英语非常流利。事后有几个人说，他们曾想过向指挥官透露一点前一天德国空军损失的情况，但他们认为在这种情况下最好保持沉默。”


    这些人在这种天的小的小船上在非常恶劣的海面上航行了三天，通常每天只有几块饼干和一点水，尽管有些人完全什么都没有吃。布莱基报告说士气非常好，并说：“那个船舱童异常地乐观，他带领男人们唱歌来提振精神。”


    他们最终操纵这艘小船到达巴拉岛可见的范围内，被“新兰斯号”（Newlands）拖船接起。布莱基说：


    “我们好几个人都感受到了严寒的影响，但得知噩梦结束了感到很庆幸。我们穿着鱼雷击中时身上的少数衣服就登陆了，有些当时躺在床上的人既没有鞋也没有袜子。在托伯莫里（Tobermory），我们在前往奥班（Oban）之前得到了食物，在那里酒店的居民自愿为我们提供床位，并提供了衣服。”


    来自 Stagshaw 的枪兵罗伊·克拉克（19 岁）获得了诺森伯郡枪兵团的准假，参加 Stagshaw 教堂小屋的一场特别活动的贵宾，在会上，他因 5 月
    28 日和 5 月 31 日与英国远征军（`BEF`）战斗中的两次独立英勇行为而被授予军事勋章。在密集的炮火和迫击炮攻击下，他继续通过步行和骑摩托车传递信息。他从不躲避或休息，而是以无畏的勇气完成所有的行程，确保了重要信息的快速传递。在一次纸牌牌活动结束后，他收到了科布里奇战争服务基金赠送的刻有纪念文字的金表。


    ![Image](img/f0057-01.jpg)


    军事勋章获得者、来自 Stagshaw 的枪兵罗伊·克拉克（19 岁），他因步行和骑摩托车传递信息的英勇行为获得此奖。


    法院对违反灯宵管制的行为变得越来越严厉，罚金增加到 4 英镑——即使对于没有直接参与的人。被处该金额罚金的是科布里奇小麦穗酒店（Wheatsheaf Inn）的房东，他确保了所有
    35 扇窗户都做了遮光。一名女在灯宵时间前半小时巡视以拉上所有窗帘，但这一次，一位客人打开了门并留了灯。


    住在 Riding Mill 的德国难民保琳·马因泽（Pauline Mainzer）因在 Terrace 的一处未遮盖的灯光被罚款 2 英镑，但法庭确认这并非故意引导敌军。敌对人群聚集在普鲁德，威胁要打破西路建筑的窗户，当时一处光线从`费斯特修理厂`的天窗透出来，从
    150 码外可见。警方最终闯入场所熄了灯。店主詹姆斯·费斯特在承认罪行后被罚 2 英镑，但他归咎于负责关灯的学徒没有熄。


    普鲁德居民通过捐赠和特别认缴筹集了 241 英镑 10 令士 1 便士，用于购买三辆价值 135 英镑的汽车，另花了 100 英镑将其转换为当地民防（ARP）小组的救护车。


    赫克斯姆罗尔利溪（Rowley Burn）一项失败的铅矿计划在启动 70 年后获得了回报。


    赫克斯姆的战争物资仓库必须加倍努力为士兵提供生活用品，因为他们制造的成千上万物品中的许多在丹麦尔等地被遗弃。巴拉克法头盔和扫雷手套特别短缺。为了给更多设备筹资金，当地绅士组织了一场难忘的展览，展出的物品包括不幸的德文特水伯爵穿着的蓝色锦缎外套；玛丽女王在莱文湖城堡作为囚犯期间制作的床罩；沃顿著名的谋杀案受害者“缝纫的乔”制作的拼布被，以及沃尔特·比森特著名小说中的英雄人物布兰奇德的多萝蒂·福斯特所穿的围裙。展览在赫克斯姆天主教学校的大厅举行。

