    - 将项目文件提交到仓库 193\n- 在工作区导入项目 194\n- 跟踪仓库中的最新更改 196\n\n# 项目部署 198\n\n- 将 WAR 文件复制到\
    \ Tomcat 198\n- 使用 Tomcat manager 复制 WAR 文件到 Tomcat 201\n\n# 总结 203\n\n# 索引 205\n\
    \n# 前言\n\n欢迎来到 Java 开发的世界！这里有大量的内容需要学习，并需要许多技能来适应。当你开始时，会遇到类似的问题。现在，许多人想要成为一名专业的开发者，但对应用开发的阶段和思维并不熟悉。本书通过提供一条易于理解的路径，帮助你理解\
    \ Java 模块化开发过程。在市场上有许多技术，Spring 技术适用于开发独立的 Java 模块，并将其组合创建一个完整的应用程序。在书中，我们使用了\
    \ Spring MVC 的许多功能，并讨论了数据库、单元测试等其他主题。\n\n# 本书涵盖的内容\n\n第1章，介绍模块化编程，讨论了企业级应用及其及其开发。企业级应用开发涉及成员之间协作的许多问题。在本章中我们将介绍相关的工具。\n\
    \n第2章，你好 Java EE，涉及通过 Servlet-JSP 开发 Java 应用程序的简要热身。我们将使用 Spring 来开发应用程序。\n\n\
    第3章，实现表示层，讨论了应用开发中最重要的部分之一：表示层。我们将讨论如何开发页面以实现业务逻辑的数据绑定，以及使用 Spring MVC 功能。\n\n\
    第4章，连接数据库，讨论了从用户收集并用于业务逻辑需要持久化的数据。我们将涵盖 Spring DAO 支持，然后介绍 Hibernate ORM 技术及其与\
    \ Spring 的集成。我们还将涵盖单元测试，以确保我们的代码运行良好。\n\n第5章，开发业务层，讨论了应用最重要的层之一——业务层——以及层之间的通信。应用程序需要遵循许多规则进行开发。\n\
    \n第6章，测试你的应用程序，解释了开发者开发的模块应该产生正确的结果。在本章中，我们将借助 V 模块涵盖测试基础。我们还将使用 JUnit 和 Mockito\
    \ 进行集成测试。\n\n第7章，应用程序安全，讨论了如何保护应用程序。在应用程序中，有些模块是对所有人开放的，而有些是受限的。我们将应用基础和表单安全来保护\
    \ Spring MVC 应用。\n\n第8章，版本控制与部署，展示了如何对由不同成员同时开发的应用程序进行协作。在本章中，我们将设置并集成 Tortoise\
    \ SVN 作为协作代码的版本控制工具。我们还将讨论创建仓库、用户为 Colbuat 和 Visual SVN 服务器设置访问规则。\n\n# 本书的要求\n\
    \n你需要对核心 Java 拥有深入知识和实践经验才能理解本书。此外，还需要基础 JDBC 知识和面向对象编程语言的概念。由于我们在书中一直使用 Eclipse\
    \ IDE，你应该熟悉它。拥有 Spring 初级框架入门知识的人可以轻松参考本书。如果你是 Spring 初学者，我们建议你先熟悉 Spring 配置的基本概念并获得一些实践经验。具备\
    \ Hibernate 和 JUnit 的基础知识将是一个优势。\n\n# 本书适用对象\n\n本书的想法是给读者提供使用 Java 模块化编程分步创建应用程序的经验。对于任何想要接触\
    \ Java 模块化开发的初学者来说，这本书都是很有用的。对于任何希望分阶段（如问题描述、UI 开发、业务逻辑开发、数据库层开发等）开发应用程序的人来说，这本书也适用。本书涵盖了从问题描述到产品所需的应用程序开发的所有方面，涵盖了安全、版本维护和部署过程。\n\
    \n# 规范\n\n在书中，你会发现许多文本样式来区分不同类型的信息。以下是这些样式的示例及其含义。文本中的代码单词、数据库名称、文件名、文件扩展名、用户输入和\
