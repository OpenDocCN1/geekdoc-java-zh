    # 1 Introducing Modular Programming


    Software development is a complex, time-consuming process, where success depends
    on teamwork. We keep on talking about software or software development. Sometimes
    we are part of the process as well. But we will be in one of the roles as architect,
    developer, tester, or deployer. Though we are always concentrating on a role,
    knowing the overall process always benefits us.


    In this chapter, we will be going through the following topics:


    - What is software and software development?

    - What are enterprise applications?

    - The role of modular programming in enterprise applications

    - Introduction to and the importance of versioning


    ## Software – the perspective


    A software application is a program which enables users to perform a specific
    task, for example, online money transfer, and withdrawal of money from an ATM
    or the use of Eclipse to develop an application. This application is complex,
    scalable, and distributed, providing a complete solution to the end user. Applications
    known as enterprise applications are needs-based, providing solutions to business
    requirements rather than to an individual. The organization will use this application
    or integrate it within an existing application.


    # Introducing Modular Programming


    Enterprise applications may vary from business to business, for example, school
    or employee management systems, banking applications, online shopping applications,
    or e-commerce applications. All such enterprise applications provide displaying,
    processing, and storing data as their basic feature. Along with these features,
    the application can also provide transaction management and security services
    as advanced features. We access such applications typically through a network
    system rather than an individual machine.


    Let''s briefly discuss the software development process before moving ahead:


    - The software is always a solution or part of the solution to an enterprise problem.
    A good start in the development process is knowing what the expectations are from
    the software, what types of solutions need to be included, what the data input
    will be, and what the output from the application is. This phase will be called
    the requirement collection phase.

    - Once we get an idea about the requirements, now it''s time to decide the hardware
    specification, the system requirements, the architecture to use, the design to
    follow, and so on. This phase is called designing.

    - Using the design document, now developers will come in action to start a very
    important phase called development, where the actual coding takes place.

    - Suppose we have developed a product; how do we prove that it is the right solution
    for the requirements which we got in the first phase? Yes, with the help of testing.
    We can carry out unit testing, integration testing, assembly testing, and acceptance
    testing to ensure that the requirement has been met.

    - After successful testing, now it''s time for the user to use it. This is nothing
    but the deployment phase, after which it is ready for use.

    - Talking in terms of one phase after deployment, the work is over but what if
    any roomy issue emerges? What if the client recommends some or major changes?
    Or if it has a bug? Because of this, post-deployment is also a very important
    step, which we call maintenance.


    Although these phases theoretically come one after another, there can be different
    approaches called software development process models, such as the waterfall model,
    iterative model, spiral model, agile model, and so on.


    # Modules


    Application development is composed of many interconnected parts which interact
    with each other. To withstand high market demand and increasing competition, software
    should have a good look and feel, and ease of use. To develop a compatible solution,
    the developer has to think about compound structure as well as user perspective.
    It''s quite difficult to develop such a product single-handed. It''s teamwork,
    where the development is running alongside. The team members build up separate
    modules dedicated to part of the actual solution. These small modules will be
    clubbed together and interact with each other to form a complete solution.


    # What is behind and in a module?


    Each module which has been developed will be performing a unique responsibility.
    When a module is responsible for a single task, it will be called cohesive. The
    cohesion will make the module more maintainable. Also, it will be less frequently
    changed. A good design perspective is to try writing a module which be highly
    cohesive.


    The two modules developed separately will need to have interaction. To make them
    interactive, we have to introduce them. This will be done by making them dependent
    on each other. This dependency is termed coupling. When the code size and number
    of modules are small, coupling won''t be a problem. But in an enterprise application,
    the code size is huge. Any little makes a difference and then all of its dependencies
    should be changed accordingly at a number of places. This makes the code unmanageable.
    So it''s always recommended to have loosely coupled modules.


    # The practical aspect


    Let''s take the example of a desktop, the one we use in our routine. A desktop
    consists of a monitor, CPU, keyboard, and mouse. If a new monitor with some advanced
    features is introduced in the market, what will we do? Will we buy a new desktop
    or replace the monitor?


    As per the convenience and also the cost, it''s feasible to replace the monitor
    not the whole desktop; how is this possible? It''s possible because the desktop
    is assembled with subunits, which are easily replaceable. Each subunit is cohesive
    for the work and they are not tightly coupled. This happens when we use modularization.
    When we write an application that uses similar concepts, it is called modular
    programming.

    '
