    http://www.springframework.org/schema/context\nhttp://www.springframework.org/schema/context/spring-context-3.0.xsd\"\
    >\n<!--mapping of the controller -->\n<bean bean=\"to be configured here for view\
    \ resolver\" - />\n</beans>\n```\n\nThe controller configuration file will be\
    \ named name_of_servlet.xml. In our project, we will name this HelloWeb-servlet.xml.\n\
    \nLet's do the basics of a web application using Spring MVC to accept the data\
    \ and display it. We need to perform the following steps:\n\n- 1. Create a web\
    \ application named Ch02_HelloWorld.\n- 2. Add the required JAR files for Spring\
    \ (as shown in the following screenshot) and servlets in the lib folder.\n- 3.\
    \ Create an index page from where the data can be collected from the user and\
    \ a request to the controller.\n- 4. Configure the front controller in DD.\n\n\
    # Say Hello to Java EE\n\n- 5. Create a HelloWorldController.\n- 6. Add a method\
    \ which performs business logic and sends the view name along with the model to\
    \ the controller.\n- 7. Create the HelloWeb-servlet.xml and configure SpringMVC\
    \ and ViewResolver.\n- 8. Create a JSP which displays the data.\n\nThe filesystem\
    \ for the project is as:\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_50_0.png)\n\
    \nWe have already created the project. Let's start creating index.jsp as:\n\n\
    ```html\n<form action=\"hello.htm\">\n    <div>NAME: <input type=\"text\" name=\"\
    name\"></div>\n    <div><input type=\"submit\" value=\"ENTER\"></div>\n</form>\n\
    ```\n\nWhen we submit the form, the request is sent to the resource which is mapped\
