  - '[PAGE 122]


    Developing the Business Layer


    When someone wants to develop any kind of business layer, there are multiple things
    which need to be considered, understood, and kept in mind with immense care. Most
    of us feel that developing the business layer is difficult. Most of the time,
    it is hard just because the lack of knowledge and we don''t know from where to
    start and how to start.


    # Domain knowledge


    While discussing why domain knowledge is important, we discussed many scenarios.
    In each scenario, we used a number of technical terms, such as minimum balance,
    interest rate, fixed deposits, savings account, reservation, bookings, and many
    more. Much of this terminology is used in our day-to-day life; some of it is not
    frequently used in use but we are aware of. When a team starts in any field, such
    as banking, reservation, travelling, and insurance, they need to understand the
    basic terms used in the respective field. They need to understand their importance
    and when to use it. They should have conditional knowledge of the situations as
    well.


    Acquiring expertise and thorough knowledge of a certain area, industry from in
    and is out domain knowledge. Examples of domain knowledge are:


    +   * Knowledge of accounting systems, steps and procedures

    * Knowledge of life insurance

    * Knowledge of the tax sector

    * Knowledge of the manufacturing industry

    * E-commerce knowledge


    Getting domain knowledge is a time-consuming task. Those who are interested in
    getting domain knowledge can refer to the documentation available online or in
    many books and reference material. The person also has to not only study each
    point theoretically, but have to also apply it to real examples. One of the best
    ways to get domain knowledge is through case studies. We can also get domain knowledge
    from group discussions. But when we get involved in group discussions, we need
    to have some basic knowledge to understand what is going on. In all such fruitful
    discussions, the experts can share their past experiences.


    [ 106 ]'
- md: "\n# Rules, formulas, and conditions\n\nDomain knowledge gives information about\
    \ situations, the rules which need to be considered in those situations, situation-based\
    \ formulae, and conditional-based decision making. For example, in interest calculation,\
    \ we consider the account type, and in reservation booking, we need to know the\
    \ number of seats, type of carriage, and age of the passengers. Before starting\
    \ the actual work, it's always better to put all rules dependent on situations,\
    \ and formulae to apply on certain cases together that is well understood from\
    \ knowledge or by discussions. All the situations where the flow of an application\
    \ can fail or should not fail unless corrected are all exceptional situations;\
    \ for example, the user gives withdrawal option while there is no sufficient balance,\
    \ and the user chooses to buy a product which is not in stock. All such exceptional\
    \ conditions need to be known to the developers as well as to the testers. The\
    \ developers and testers consider these situations while developing and testing\
    \ the applications respectively.\n\n# Case studies\n\nReading books, papers, and\
    \ magazines will certainly help to get knowledge of how a particular industry\
    \ works and what the important terminologies and conditions are. But it will not\
    \ be sufficient as this knowledge needs to be applied in reality. With the help\
    \ of a case study, a situation can be well understood and we come to know the\
    \ loopholes in it, why that situation occurred, and how to come out of it. As\
    \ a case study is situation-based, it helps the developer a lot as they can relate\
    \ it to the application flow.\n\nA case study gives a practical solution which\
    \ can be applied in the application directly. It may not be possible to modify\
    \ the solution as per the requirement. The case study helps to grab domain knowledge\
    \ relatively in a quick and easy way.\n\n# Developing the business layer\n\nAfter\
    \ a long, theoretical discussion, let's now develop the business layer for the\
    \ code which we developed in the previous chapter for contact management. We need\
    \ to set the rules which can be applied in our contact management project.\n\n\
    # Developing the Business Layer\n\nThe following is the rule to be applied:\n\n\
    - A contact will be successfully inserted only when there is no pre-registration\
    \ of the e-mail in the table. We have already developed code where DuplicateEntryException\
    \ has been handled. This exception handling helps the developer to understand\
    \ that no duplicate contact has been entered in the table. We can do this manually\
    \ as well as using database bases. If we want to do it manually, then we first\
    \ need to fetch all the records from the table and cross-check whether the email\
    \ entered by the user is already existing or not. We can make this simply by putting\
    \ an email which already exists, an exception will be thrown.\n\nLet's develop\
    \ the Ch04_jdbcTemplate_Integration application as Ch05_contact_management_casel\
    \ using the following steps:\n\n1. First of all, we will add the logic layer to\
    \ provide implementation of the business logic of checking whether the user is\
    \ entering a duplicate number or not. We will do the duplication check by adding\
    \ the interface with business methods for adding the contact.\n2. Then we will\
    \ check whether the data already exists or not.\n3. If it doesn't exist then we\
    \ will add it, otherwise we will return a message.\n\nLet's start the code development:\n\
    \n1. Add a method in ContactDAO interface which we already used in all the previous\
    \ examples as int findContactToAdd(String email).\n2. Implement it in ContactDAOImpl\
    \ find out if there are any records available with the same email. This is done\
    \ in as follows:\n\n```java\npublic int findContactToAdd(String email)\n{\n  \
    \  String sql = \"select COUNT(*) from Contact_CORE where email=\";\n    return\
    \ jdbcTemplate.queryForInt(sql,email);\n}\n```\n\n3. Add an interface Contact\
    \ Bussiness in com.packt.ch05.bussiness package as follows:\n\n```java\npublic\
    \ interface ContactBussiness {\n    int addContact(Contact contact);\n}\n```\n\
    \n4. Implement it in ContactBussnessImpl, while implementing this need to understand\
    \ a few things. The first one is, now the controller will not interacting with\
    \ the DAO layer but it will interact with the business layer and the business\
    \ layer will interact with the DAO. So the class should have an object of ContactDAO.\
    \ This will be possible with @Autowired. In order to manage the object of ContactBussnessImpl\
    \ by the Spring container, we added @Component annotation. The @Component will\
    \ give us the advantage of getting an object of the class lifecycle will be managed\
    \ by the Spring container without configuring the XXX.xml file (in our case connection.xml),\
    \ that is, its replacement of the following configuration:\n\n```xml\n<bean id=\"\
    \" class=\"=\"\"/>\n```\n\nWhen we use by default, the value of id is contactBussnessImpl,\
    \ which is the decalized name of the class. If we want a different value of id,\
    \ we need to add an attribute named the class. Now we don't have to configure\
    \ it in the XML file. checkContact(Contact contact) will check whether the email\
    \ already exists or not. As only ContactBussnessImpl needs it, we will make this\
    \ method private:\n\n```java\n@Component(value=\"ContactBussness\")\npublic class\
    \ ContactBussnessImpl implements ContactBussness {\n    @Autowired\n    ContactDAO\
    \ contactDAO;\n    public int addContact(Contact contact) {\n        // TODO Auto-generated\
    \ method stub\n        if (checkContact(contact)) {\n            return contactDAO.addContact(contact);\n\
    \        }\n        return 0;\n    }\n    private boolean checkContact(Contact\
    \ contact) {\n        if (contactDAO.findContactToAdd(contact.getEmail())==0)\
    \ {\n            return true;\n        }\n        return false;\n    }\n}\n```\n\
    \n5. Let's update Add. Take out the following code:\n\n```java\n@Autowired\nContactDAO\
    \ contactDAO;\n```\n\n6. Add the code of integrating ContactBussiness as follows:\n\
    \n```java\n@Autowired\nContactBussiness contactBussiness;\n```\n\n7. Modify the\
    \ code of the addcontroller method as follows:\n\n```java\nint record = contactBussiness.addContact(contact);\n\
    ```\n\nThis replaces the code:\n\n```java\nint record = contactDAO.addContact(contact);\n\
    ```\n\nWe are done with the development of the business logic layer. Let's execute\
    \ the application. After executing the code, if we enter an already existing email,\
    \ the output will be as shown in the following screenshot:\n\n| Field | Value\
    \ |\n|---|---|\n| FIRST NAME | abc |\n| LAST NAME | def |\n| GENDER | male |\n\
    | ADDRESS | number |\n| PHONE NUMBER | 123456789 |\n| EMAIL | abc@gmail.com |\n\
    | Add Contact | |\n\nAs we have already discussed in earlier chapters, the layering\
    \ mechanism provides a facility to write down code separated in multiple layers.\
    \ But they can still collaborate with each other with the help of DI and form\
    \ one flow with the application. The business layer is invoking the methods of\
    \ the DAO layer, and the methods of the business layer are invoked from the UI\
    \ layer.\n\n# Transaction management\n\nThere are many times when in an application\
    \ we need to fire multiple queries of add, update, remove, or all of them as a\
    \ batch. In a batch of statements where multiple queries get fired against a database\
    \ as a unit, all the queries will be successful or none of them. This is called\
    \ transaction management. Transaction management is helpful in maintaining consistency.\n\
    \nThe following are the properties of a transaction:\n\n- * Atomicity: When firing\
    \ multiple queries, all of them should be committed or none of them. This property\
    \ makes sure that whatever operations are performed on the database and whenever\
    \ ever any error occurs, no operations will be performed on the database.\n"
  mdcn: "\n\n# 规则、公式与条件\n\n领域知识提供了关于情况的信息、在这些情况下需要考虑的规则、基于情况的公式以及基于条件的决策。例如，在计算利息时，我们会考虑账户类型；在预订订单中，我们需要知道座位数量、车厢类型以及乘客的年龄。在开始实际工作之前，最好将所有依赖于情况的规则以及适用于特定情况的公式整合在一起，并确保它们通过知识或讨论得到充分理解。应用程序流程可能失败或除非更正否则不应失败的所有情况都是异常情况；例如，用户在余额不足时选择了提款选项，或者用户选择购买无货的产品。所有此类异常都需要开发人员和测试人员了解。开发人员和测试人员分别在开发和测试应用程序时考虑这些情况。\n\
    \n# 案例研究\n\n阅读书籍、论文和杂志无疑有助于了解特定行业如何运作，以及重要的术语和条件是什么。但是不够的，因为这些知识需要应用到现实中。通过案例研究的帮助，可以很好地理解一种情况，并了解其中的漏洞、该情况发生的原因以及如何解决它。由于案例研究是基于情况的，它对开发者非常有帮助，因为他们可以将其与应用程序流程联系起来。\n\
    \n案例研究提供了一个可以直接应用于应用程序的实际解决方案。可能无法根据需求修改该解决方案。案例研究有助于以相对快速、简便的方式获取领域知识。\n\n# 开发业务层\n\
    \n在经过长时间的理论讨论后，现在为我们在上一章节中开发的联系人管理代码开发业务层。我们需要设置适用于我们联系人管理项目的规则。\n\n# 开发业务层\n\n\
    以下是需要适用的规则：\n\n- 只有当表中没有预先注册该邮箱时，联系人才会被成功插入。我们已经开发了处理 `DuplicateEntryException`\
    \ 的代码。这种异常处理有助于开发人员理解表中没有输入重复的联系人。我们可以手动这样做，也可以使用数据库来实现。如果我们想手动执行，则首先需要从表中获取所有记录，并交叉检查用户输入的邮箱是否已存在。我们可以简单实现这一点：输入一个已存在的邮箱，就会抛出异常。\n\
    \n让我们按照以下步骤将 `Ch04_jdbcTemplate_Integration` 开发为 `Ch05_contact_management_casel`：\n\
    \n1. 首先，我们将添加逻辑层，以提供检查用户输入的否为重复号码的业务逻辑实现。通过添加带有添加联系人业务方法的接口来实现重复检查。\n2. 然后，我们将检查数据是否已经存在。\n\
    3. 如果不存在，则将其添加，否则返回一条消息。\n\n让我们开始代码开发：\n\n1. 在 `ContactDAO` 接口中添加一个我们在之前所有示例中都已使用过的方法：`int\
    \ findContactToAdd(String email)`。\n2. 在 `ContactDAOImpl` 中实现它，查找是否存在具有相同邮箱的记录。实现如下：\n\
    \n```java\npublic int findContactToAdd(String email)\n{\n    String sql = \"select\
    \ COUNT(*) from Contact_CORE where email=\";\n    return jdbcTemplate.queryForInt(sql,email);\n\
    }\n```\n\n3. 在 `com.packt.ch05.bussiness` 包中按如下添加接口 `ContactBussiness`：\n\n```java\n\
    public interface ContactBussiness {\n    int addContact(Contact contact);\n}\n\
    ```\n\n4. 在 `ContactBussnessImpl` 中实现它，在实现过程中需要理解几点。第一点是，现在控制器不再与 DAO 层交互，而是与业务层交互，业务层再与\
    \ DAO 层交互。因此，该类应该有一个 `ContactDAO` 对象。这可以通过 `@Autowired` 实现。为了让 Spring 容器管理 `ContactBussnessImpl`\
    \ 的对象，我们添加了 `@Component` 注解。`@Component` 为我们提供了优势，即无需配置 XXX.xml 文件（在我们的例中为 `connection.xml`），即可由\
    \ Spring 容器管理类生命周期对象，它是对以下配置的替代：\n\n```xml\n<bean id=\"\" class=\"=\"\"/>\n```\n\
    \n当我们使用默认值时，`id` 的值为 `contactBussnessImpl`，它是类的规范化名称。如果我们需要不同的 `id` 值，则需要添加名为\
    \ `class` 的属性。现在我们不需要在 XML 文件中配置它。`checkContact(Contact contact)` 将检查邮箱是否已存在。由于只有\
    \ `ContactBussnessImpl` 需要，我们将此方法设为私有：\n\n```java\n@Component(value=\"ContactBussness\"\
    )\npublic class ContactBussnessImpl implements ContactBussiness {\n    @Autowired\n\
    \    ContactDAO contactDAO;\n    public int addContact(Contact contact) {\n  \
    \      // TODO Auto-generated method stub\n        if (checkContact(contact))\
    \ {\n            return contactDAO.addContact(contact);\n        }\n        return\
    \ 0;\n    }\n    private boolean checkContact(Contact contact) {\n        if (contactDAO.findContactToAdd(contact.getEmail())==0)\
    \ {\n            return true;\n        }\n        return false;\n    }\n}\n```\n\
    \n5. 更新 `Add`。移除以下代码：\n\n```java\n@Autowired\nContactDAO contactDAO;\n```\n\n\
    6. 如下添加集成 `ContactBussiness` 的代码：\n\n```java\n@Autowired\nContactBussiness contactBussiness;\n\
    ```\n\n7. 如下修改 `addcontroller` 方法的代码：\n\n```java\nint record = contactBussiness.addContact(contact);\n\
    ```\n\n这替换了代码：\n\n```java\nint record = contactDAO.addContact(contact);\n```\n\
    \n我们已经完成了业务逻辑层的开发。让我们运行应用程序。执行代码后，如果我们输入一个已存在的邮箱，输出将如后续截图中所示：\n\n| Field | Value\
    \ |\n|---|---|\n| FIRST NAME | abc |\n| LAST NAME | def |\n| GENDER | male |\n\
    | ADDRESS | number |\n| PHONE NUMBER | 123456789 |\n| EMAIL | abc@gmail.com |\n\
    | Add Contact | |\n\n正如我们在前面的章节中讨论过的，分层机制提供了编写分在多个层级代码的便利。但在 DI（依赖注入）的帮助下，它们仍然可以相互协作并形成应用程序的流。业务层调用\
    \ DAO 层的方法，而业务层的方法由 UI 层调用。\n\n# 事务管理\n\n在应用程序的许多情况下，我们需要执行多个添加、更新、删除查询，或者将它们作为一个批执行。在作为一个单元对数据库执行的批语句中，所有查询要么全部成功，要么全部不成功。这被称为事务管理。事务管理有助于维护一致性。\n\
    \n以下是事务的属性：\n\n- *原子性：在执行多个查询时，所有查询都应该提交，或者一个都不提交。该属性确保了无论在数据库上执行什么操作，无论何时发生任何错误，都不会在数据库上执行任何操作。*\n\
    \n"
