    **一致性（Consistency）**：在完成事务前后，所有表的状态都将保持一致。如果发生任何错误，每个表的状态可能会发生变化。这会导致表的状态出现差异。为了保持所有表状态的唯一性，无论数据如何变化，都会恢复到原始状态。


    **隔离性（Isolation）**：在每个应用程序中可能存在多个涉及读、写或更新操作的事务。因此，正在进行的事务可能与已提交的事务隔离开。


    **持久性（Durability）**：我们尝试在表中写入或更新的数据可能会部分失败。这会导致表的状态不正确。持久性确保无论任何操作何时失败，数据将以正确的状态存在。


    # JDBC 与事务管理


    在 JDBC 中，事务是自动提交的。为了在 JDBC 中实现事务，我们需要添加以下步骤：


    - 1. 我们需要在连接对象上调用 `setAutoCommit(false)`。

    - 2. 每当数据库上的所有操作都完成时，调用 `commit()`。

    - 3. 如果发生任何错误，调用 `rollback()` 回到表的原始状态。


    # Spring 与事务管理


    Spring 提供了一个事务管理 API，旨在为 EJB 事务管理提供替代方案。Spring 同时支持声明式和程序式事务管理。Spring 有以下两种类型的事务：


    - **本地事务（Local transactions）**：当资源在单点进行管理且涉及本地事务管理器时，本地事务非常有用。JDBC 就是其中一个示例，它处理易于使用和管理的本地事务。本地事务无法处理多个事务资源。

    - **全局事务（Global transactions）**：全局事务在分布式系统中非常有用，通过应用服务器借助 `Java Transaction API
    (JTA)` 帮助资源分布在多个位置。为了管理全局事务，开发者需要在服务器中配置 JNDI。


    Spring 并不是直接管理事务的，但它提供了根据平台选择事务管理实现的灵活性。某些事务管理器如下图所示：


    ![](img/8c4e088a46790c3b879ac174b3fd0a5129_0.png)


    让我们发现如何在应用程序中集成 TransactionManager。当我们使用 `JdbcTemplate` 处理 JDBC 时，需要知道管理事务的不同方法。以下两种方式用于管理事务：


    - 程序式事务

    - 声明式事务


    # 程序式事务（Programmatic transaction）


    在程序式事务中，开发者通过代码管理事务。程序式事务的使用提供了精细的控制和管理的灵活性，开发者可以决定事务的规则，以及何时开始和何时完成。


    # 声明式事务（Declarative transaction）


    与程序式事务相反，开发者不会在源码中编写代码，而是在 XML 文件中配置。它提供了便利，但控制不够精确。让我们深入讨论。


    # 在 Spring 中管理声明式事务


    事务管理是著名的切面技术之一。Spring 提供了面向切面编程（AOP）来管理切面技术。AOP 也用于管理声明式事务。


    事务围绕着 `TransactionInterceptor` 类实现的 `before` 和 `after` 逻辑。`before` 属性决定数据库事务的范围，例如保持正在进行的事务或创建一个事务。`after`
    属性决定提交或回滚事务。


    事务管理器需要启动一个新的事务或继续正在进行的事务，这一决策是通过传播属性完成的。当开发者调用业务逻辑方法时。


    让我们逐步讨论如何开发事务管理。


    # 第 1 步


    确定事务属性：


    - **传播行为（Propagation behavior）**：传播行为说明了当方法被调用时如何处理事务，是启动新事务还是支持该事务。


    以下表格列出了传播行为及其含义：


    | 传播行为 | 含义 |

    |---|---|

    | PROPAGATION_MANDATORY | 表示方法必须在事务中运行。如果不存在现有事务，将抛出异常。 |

    | PROPAGATION_NESTED | 表示如果存在现有事务，则方法应在嵌套事务中运行。 |

    | PROPAGATION_NEVER | 表示方法不应在事务上下文中运行。如果存在现有事务，将抛出异常。 |

    | PROPAGATION_NOT_SUPPORTED | 表示方法不应在事务中运行。如果存在现有事务，在方法执行期间将其挂起。 |


    # 第 5 章


    | 传播行为 | 含义 |

    |---|---|

    | PROPAGATION_REQUIRED | 表示方法必须在事务中运行。如果存在现有事务，方法将在该事务中运行。 |

    | PROPAGATION_REQUIRES_NEW | 表示方法必须在自己的事务中运行。 |

    | PROPAGATION_SUPPORTS | 表示当前方法不需要事务上下文，但如果已经存在事务，则可以在事务中运行。 |


    - **隔离级别（Isolation level）**：由于应用程序支持并发，可能随时启动多个事务。隔离级别定义了一个事务对另一个事务的影响：

    - **脏读（Dirty reads）**：应用程序可能随时启动多个事务。它允许读取尚未提交的数据。

    - **幻读（Phantom reads）**：假设第一个用户读取数据，第二个用户插入了行。

    - **不可重复读（Non-repeatable reads）**：在这种情况下，除非被事务本身更改，否则对同一字段的多次读取将产生不同的结果。


    # 开发业务层


    可能的隔离级别如下：


    | 隔离级别 | 含义 |

    |---|---|

    | ISOLATION_DEFAULT | 使用数据存储的默认隔离级别。 |

    | ISOLATION_READ_UNCOMMITTED | 允许读取尚未提交的数据。可能导致脏读、幻读和不可重复读。 |

    | ISOLATION_READ_COMMITTED | 允许读取已提交的并发事务。防止脏读，但仍可能发生幻读和不可重复读。 |

    | ISOLATION_REPEATABLE_READ | 除非被事务本身更改，否则对同一字段的多次读取将产生相同的结果。防止脏读和不可重复读，但仍可能发生幻读。
    |

    | ISOLATION_SERIALIZABLE | 这种完全符合 ACID 的隔离级别确保脏读、不可重复读和幻读都被防止。这是隔离级别最低的，因为它通常通过对参与事务的表进行全锁来实现。
    |


    - **只读（Read-only）**：有时开发者对读取底层数据感兴趣并希望避免修改数据。要应用只读属性，传播行为应该是以下之一：PROPAGATION_REQUIRED、PROPAGATION_NESTED
    或 PROPAGATION_REQUIRES_NEW。

    - **事务超时（Transaction timeout）**：某些事务需要更多时间才能完成，这会影响性能。在这种情况下，与其等待很久，不如终止它。事务超时属性有助于在一定时间后自动终止耗时的事务。要应用超时属性，传播行为应该是以下之一：PROPAGATION_REQUIRED、PROPAGATION_NESTED
    或 PROPAGATION_REQUIRES_NEW。

    '
