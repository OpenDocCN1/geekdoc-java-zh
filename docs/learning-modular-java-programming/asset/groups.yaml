    \    return new ModelAndView(\"ContactForm\");\n}\nreturn new ModelAndView(\"\
    manageContact\", \"id\", contact.getEmail());\n}\n```\n\nWe already discussed\
    \ the use of @ModelAttribute in order to accept the object. We are interested\
    \ in validating the same object, we have to apply @Valid before this parameter,\
    \ as shown in the code. In order to bind the validation error messages will be\
