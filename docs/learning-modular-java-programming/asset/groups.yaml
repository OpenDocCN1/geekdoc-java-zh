    \ to the framework and will concentrate on business logic processes.\n\n# Chapter\
    \ 2\n\nThat's what, as a developer we were looking for. The spring MVC can be\
    \ integrated with technologies such as Velocity, Freemarker, Excel, and PDF. They\
    \ can even take advantage of other services as aspect-oriented programming for\
    \ cross-cutting technologies, transaction management, and security provided by\
    \ the framework.\n\n# The components\n\nLet's first try to understand the flow\
    \ of normal web applications in view of the Spring framework so that it will be\
    \ easy to discuss the component and all other details:\n\n- 1. On hitting the\
    \ URL, the web page will be displayed in the browser.\n- 2. The user will fill\
    \ in the form and submit it.\n- 3. The front controller intercepts the request.\n\
    - 4. The front controller tries to find the Spring MVC controller and pass the\
    \ request to it.\n- 5. Business logic will be executed and the generated result\
    \ is bound to the ModelAndView.\n- 6. The ModelAndView will be sent back to the\
    \ front controller.\n- 7. The front controller, with the help of ModelAndView,\
    \ will discover the view, bind the data and send it to the browser.\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_47_0.png)\n\
    \nSpring MVC\n\n[ 31 ]\n\n# The front controller\n\nAs already seen in servlet\
    \ JSP to maintain each flow of the application developer develop the servlet and\
    \ data model from servlet will be forwarded to JSP using attributes. There is\
    \ no single servlet to maintain the application flow completely. This drawback\
    \ has been overcome in Spring MVC as it depends on the front controller design\
    \ pattern.\n\nIn the controller design pattern, there will be a single entry point\
    \ to the application. Whatever URLs are hit by the client, it will be handled\
    \ by a single piece of the code and then it will delegate the request to the other\
    \ objects in the application.\n\nIn Spring MVC, the DispatcherServlet acts as\
    \ front controller. DispatcherServlet takes the decision which Spring MVC controller\
    \ the request will be delegated to. In the case of a single Spring MVC controller\
    \ in the application, the decision is quite easy. But we know in enterprise applications,\
    \ there are going to be multiple Spring MVC controllers. Here, the front controller\
    \ needs to find the correct Spring MVC controller. The helping hand is the configuration\
    \ file, where the information to discover the Spring MVC controller is configured\
    \ using handler mapping. Once the Spring MVC controller is found, the front controller\
    \ will delegate the request to it.\n\n# Spring MVC controller\n\nAll processes,\
    \ such as the actual business logic, decision making or manipulation of data,\
    \ happen in the Spring MVC controller. Once this model completes the operation,\
    \ it will send the view and the model encapsulated in the object normally in the\
