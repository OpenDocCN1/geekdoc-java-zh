  mdcn: "\n\n# 向 Java EE 打招呼\n\n```java\nModelAndView mv = new ModelAndView();\nmv.setUserName(\"\
    hello\");\nString message = \"Hello \" + name + \"* From Spring\";\nmv.addObject(\"\
    message\", message);\nreturn mv;\n```\n\n此方法将返回一个 `ModelAndView` 对象，包含视图名称、模型名称和模型值。在代码中，视图名称为\
    \ `hello`，模型由 `message` 表示。前端控制器现在再次使用 `HelloSpring-servlet.xml` 来查找 `ViewResolver`\
    \ 以获取视图的实际名称和位置。通过视图名称、前缀和后缀，前端控制器获取了具有属性前缀的视图。视图的格式由属性后缀决定。`ViewResolver` 将解析页面的目录名（位置）。`ViewResolver`\
    \ 将绑定要在视图使用的模型：\n\n```xml\n<bean id=\"viewResolver\"\nclass=\"Org.springframework.web.servlet.InternalResourceResolver\"\
    >\n  <property name=\"prefix\" value=\"/WEB-INF/jsps/*\" />\n  <property name=\"\
    suffix\" value=\".jsp\" />\n</bean>\n```\n\n在我们的案例，前缀为 `/WEB-INF/jsps/`，页面名称为\
    \ `hello`，后缀值为 `.jsp`。将它们结合，我们得到 `/WEB-INF/jsps/hello.jsp`，它作为我们的视图。\n\n实际视图由\
    \ `prefix` + `ModelAndView` 中的 `view_name` + `suffix` 组合而成，例如：\n\n```\n/WEB-INF/jsps/*hello.jsp\n\
    ```\n\n数据由前端控制器绑定，视图可以使用它：\n\n```html\n<h2>${message}</h2>\n```\n\n该页面现在已准备好由浏览器渲染，在浏览器中输出如下：\n\
    \n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_53_0.png)\n\n在文本框中输入名称（例如，Bob）并提交表单将得到以下输出：\n\
    \n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_53_1.png)\n\n现在我们理解了 Spring MVC 的工作原理，让我们讨论开发\
    \ Spring MVC 控制器所需的其他几件事。\n\n每个希望被发现为控制器的类都应该带有 `@Controller` 注解。在该类中，可能有许多方法可以在请求时被调用。我们想要映射到\
    \ URL 的方法必须带有 `@RequestMapping` 注解。\n\n同一个 URL 可以映射多个方法，但它们将为不同的 HTTP 方法被调用。可以如下实现：\n\
    \n```java\n@RequestMapping(value=\"/hello.htm\",method= RequestMethod.GET)\npublic\
    \ ModelAndView sayHello(HttpServletRequest request)\n{\n}\n@RequestMapping(value=\"\
    /hello.htm\",method= RequestMethod.POST)\npublic ModelAndView sayHello(HttpServletRequest\
    \ request)\n{\n}\n```\n\n这些方法通常接受 `Request` 作为参数并返回 `ModelAndView`。但也支持以下返回类型和参数。\n\
    \n以下是一些支持的方法参数类型：\n\n- HttpServletRequest\n- HttpSession\n- java.Util.Map/ org.springframework.ui.Model/\
    \ org.springframework.ui.ModelMap\n- @PathVariable\n- @RequestParam\n- org.springframework.validation.Errors/\
    \ org.springframework.validation.BindingResult\n\n以下是一些支持的方法返回类型：\n\n- ModelAndView\n\
    - Model\n- Map\n- View\n- String\n- void\n\n有时 bean 配置分散在多个文件中。例如，我们可以在一个文件中配置控制器，而将数据库、安全相关的配置放在单独的文件。在这种情况下，我们必须在\
    \ DD 中添加额外配置来加载多个配置文件，如下：\n\n```xml\n<servlet>\n  <servlet-name>HelloSpring</servlet-name>\n\
    \  <servlet-class>org.springframework.framework.web.servlet.DispatcherServlet</servlet-class>\n\
    \  <init-param>\n    <param-name>contextConfigLocation</param-name>\n    <param-value>WEB-INF/beans.xml</param-value>\n\
    \  </init-param>\n</servlet>\n<servlet-mapping>\n  <servlet-name>HelloSpring</servlet-name>\n\
    \  <url-pattern>*.htm</url-pattern>\n</servlet-mapping>\n```\n\n# 总结\n\n在本章中，我们学习了应用程序如何由前端控制器（Dispatcher\
    \ servlet）统一控制。执行业务逻辑和返回视图名称、数据模型的实际工作将由 Spring MVC 控制器完成。视图将由前端控制器在 `ViewResolver`\
    \ 的帮助下解析。视图将显示从 Spring MVC 控制器获取的数据。为了理解和探索 Spring MVC，我们需要使用本章讨论的 Spring MVC\
    \ 基础来理解 Web 层、业务层和数据层。\n\n我们将在下一章从 Web 层开始，寻找问题的答案，例如如何处理表单、如何绑定数据以及如何进行服务器端表单验证。\n\
    \n# 3 实现表现层\n\n在 Web 世界中一切都是虚拟的，表现起着最重要的角色。在 Web 上，展示产品的第一件事就是表现，即外观和感受。它给用户带来舒适感。表现是一个平均页面。\n\
    \n在本章中，我们将发现：\n\n- 表现\n- Spring MVC 控制器\n- ViewResolver\n- Web 层\n- 业务层\n- 数据层\n\
    \n（注：原文中存在大量重复的段落，已根据要求进行处理，确保核心内容清晰）\n\n"
