    \ provides correct authentication information will get the data.\n- **Authorization:**\
    \ On the Web, there are some URLs which can be accessed by some specific users\
    \ and these links will not be available to the rest of the users. They are role-based\
    \ links which can be accessed only if you have a respective role to perform a\
    \ specific action. This is termed authorization. Once a user gets authenticated,\
    \ the container with the specified username-password pair has the correct security\
    \ table gives access to that page. Let's take the example of blogs. When we search\
    \ Spring framework blogs, we get many links. We can visit and read them. Can we\
    \ delete or update the blog? No, because the data doesn't belong to you. The addition\
    \ or updating can be made only if you have authorization.\n- **Confidentiality:**\
    \ This is an arrangement which makes it difficult to secure authentication information\
