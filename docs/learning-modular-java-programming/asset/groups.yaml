    \ URL, username, and password values. Obtaining the connection is dependent on\
    \ these values so we can call them dependencies, and injection of these dependencies\
    \ in objects is called DI. This makes the emerging spring framework the top choice\
    \ for middle tier or business tier in enterprise applications.\n\n# Spring MVC\n\
    \nThe spring MVC module is a choice we look forward for developing web applications.\
    \ The spring MVC helps to simplify development to develop a robust application.\
    \ This module can also be used to leave common concerns such as reading request\
