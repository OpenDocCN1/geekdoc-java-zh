    # 2 Saying Hello to Java EE


    To develop a scalable, distributed, well-presented, complex, and multi-layered
    enterprise application is complicated. The development becomes even worse if the
    developer is not well aware of the software development fundamentals. Instead
    of looking at a bigger scenario, if we cut it down into parts and later combine
