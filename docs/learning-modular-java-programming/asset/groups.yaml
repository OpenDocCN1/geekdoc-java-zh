  - '[PAGE 127]


    As we have separation of work using layers, it is easy to change any layer without
    affecting another. If, for example, today developers are using MySQL and tomorrow
    they want to use Oracle, the developers don''t need to change anything in the
    business layer. They just have to add a new class which will deal with Oracle
    and a few changes in the configuration. We have discussed a very basic scenario
    of duplication contact numbers. We can still extend the application by providing
    a few more operations. We have a mechanism for updating the contact information
    from time to time. To achieve this and make sure only authenticated users will
    be able to update information, we need to provide credentials. The username will
    be the email of the user and the password will be the firstname. The password
    can be updated by the user. So the information will get updated in two tables:
    first where we added user contact details and second in the credentials table.


    Both of the above situations can be managed by either of the following methods:


    +   * A solution where the developer will first cross-check whether the email
    entered by the user is already registered and inform the user

    * Using transaction management, where if data is not entered in one table, it
    will not be entered in another


    Let''s now discover how to use transaction management in our application. But
    before discussing transaction management in Spring, first we will discuss transaction
    management in general and also how we do transaction management using Java.


    # Transaction management


    There are many times when in an application we need to fire multiple queries of
    add, update, remove, or all of them as a batch. In a batch of statements where
    multiple queries get fired against a database as a unit, all the queries will
    be successful or none of them. This is called transaction management. Transaction
    management is helpful in maintaining consistency. In transaction management, it
    is not necessary that the queries should be fired against different tables in
    a database.


    The following are the properties of a transaction:


    +   * Atomicity: When firing multiple queries, all of them should be committed
    or none of them. This property makes sure that whatever operations are performed
    on the database and whenever ever any error occurs, no operations will be performed
    on the database.'
