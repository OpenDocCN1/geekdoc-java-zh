    # Introducing Modular Programming


    So a version is nothing but a new state of the file where the changes took place.


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_32_0.png)


    The repository and the sharing of files


    Now, we need to understand here the stages of a file.


    If any developer creates a new file in their local system, it''s not yet known
    to SVN. So the first task of the developer is to copy this file in SVN, which
    is called as svn add. Whenever we write the file (new or modified) to SVN, the
    process is called as committing. Once the file is committed, it''s under SVN and
    now can be available to other team members. To use this file, other team members
    have to take this file into their local system; this will be called as checkout.
    Once any developer gets their file, they are free to use it the way they want.
    Now, this local copy file will be known as a working copy.


    # The client program


    We can use SVN through the command line. But then we need to remember all the
    commands for different operations. Instead of using the command line, a UI application
    can be used. This can be used to commit, checkout, and update the working copy.
    One such free application with an easy UI is Tortoise SVN, which has been implemented
    as a Windows shell extension. Using Tortoise SVN, developers can get rid of the
    command line. Tortoise SVN can easily be integrated in IDEs such as eclipse and
    Visual Studio.'
