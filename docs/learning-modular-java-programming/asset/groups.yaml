    \ 的场景。假设我们想在下拉菜单中显示取值为**男性（Male）**和**女性（Female）**的性别列表。我们可以在 HTML 标签中硬编码这些值。但这样做会导致每次更改列表时都需要更新代码，产生问题。我们需要一个方法，便于我们在不更改代码的情况下添加或删除列表中的值。现在让我们看看在代码中如何实现。\n\
