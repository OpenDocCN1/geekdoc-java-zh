    \ Enter Last Name |\n| GENDER: M | please enter your Bill Address |\n| PHONE |\
    \ Please Enter Phone Number of 10 digits |\n| EMAIL | Please Enter Valid Email\
    \ ID |\n| Add Contact | |\n\n### Form validation using a validator\n\nIn the preceding\
    \ code, we hardcoded the messages to be displayed to the user. We can fetch the\
