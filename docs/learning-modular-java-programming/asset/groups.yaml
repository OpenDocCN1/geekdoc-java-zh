    ```\n"
  mdcn: "\n\n## 第 3 章\n\n在开发自定义验证器时，我们需要编写一个单独的类，提供一种验证与对象关联的数据的机制。为了实现这一点，我们需要按照以下步骤操作：\n\
    \n- 创建一个动态 Web 应用 Ch03_FormValidation_interface，它是 Ch03_FormHandling 的扩展。你可以创建一个它的副本，也可以在现有项目基础上添加我们在这里要开发的新代码。项目大纲如下：\n\
    \n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_71_0.png)\n\n- 在 `com.pack.ch03.validators`\
    \ 包中编写一个实现 Spring API 中 `Validator` 接口的类 `ContactValidator`:\n\n```java\npublic\
    \ class ContactValidator implements Validator\n{\n    // 实现代码在此处\n}\n```\n\n重写\
    \ `supports()` 方法以交叉检查支持类型：\n\n```java\npublic boolean supports(Class<?> arg0)\
    \ {\n    // TODO Auto-generated method stub\n    return arg0.equals(Contact.class);\n\
    }\n```\n\n`supports()` 方法检查待验证的对象是否为待验证类的类型。在这里，我们正在检查的是 `Contact` 类。\n\n### 实现覆盖层\n\
    \n3. 重写 `validate()` 方法以编写验证逻辑如下：\n```java\npublic void validate(Object object,\
    \ Errors errors) {\n    // TODO Auto-generated method stub\n    Contact contact\
    \ = (Contact) object;\n    if (contact.getFirstName().length() < 2 || contact.getFirstName().length()\
    \ > 10) {\n        errors.rejectValue(\"firstName\", \"name.required\",\n    \
    \            \"Please Enter First Name\");\n    }\n}\n```\n\n`validate()` 方法接受两个参数：\n\
    \n- 我们想要验证的值的对象\n- 如果任何验证失败，关于数据绑定和验证错误的信息将存储在 `errors` 对象中。\n\n`rejectValue()`\
    \ 方法用于向错误对象中添加验证错误。该方法接受以下三个参数：\n\n- 错误所关联的字段\n- 充当消息键的错误代码\n- 验证失败时要显示的消息\n\n\
    4. 一旦自定义验证器（CustomValidator）准备就，现在是时候使用它进行验证了。为了使用 `Validator`，我们需要在 `AddController`\
    \ 中调用 `validate()` 方法。如果验证过程中出现任何错误，我们需要按照以下步骤在表单中显示相应的消息：\n\n- 1. 首先，我们需要更改表单提交时调用的控制器方法的签名，使其在参数列表中包含\
    \ `BindingResult`。\n- 2. 调用 `Validator` 的 `validate` 方法，并将待验证的对象和用于绑定验证错误的 `BindingResult`\
    \ 对象传递给它。\n- 3. 检查 `BindingResult` 对象是否有错误。如果发生错误，必须返回用户提交值的同一个表单。\n\n可以通过下面的代码段实现：\n\
    \n```java\n@RequestMapping(\"/addContact.htm\")\npublic ModelAndView addContact(@ModelAttribute(\"\
    contact\") contact,BindingResult result)\nthrows Exception {\n    // 将在此处添加代码将数据添加到持久化层\n\
    \    // 我们将获取对象并返回它进行显示\n    validator.validate(contact, result);\n    if(result.hasErrors())\
    \ {\n        return new ModelView(\"contactForm\");\n    }\n\n    ModelView modelAndView\
    \ = new ModelView();\n    modelAndView.setViewName(\"manageContact\");\n    modelAndView.addObject(\"\
    id\", contact.getFirstName());\n    return modelAndView;\n}\n```\n\n我们将对验证器调用\
    \ `validate` 方法，控制器应该有一个可用的对象。我们将通过如下的自动注入来实现此点：\n\n```java\n@Autowired\nValidator\
    \ validator;\n```\n\n此外，在配置文件中，我们需要为我们开发的 `Validator` 类配置 bean。配置如下：\n\n```xml\n\
    <bean id=\"validator\" class=\"com.packt.ch03.validators.ContactValidator\"/></bean>\n\
    ```\n\n如果发生验证错误，我们需要在每个字段的同一个表单中将它们显示给用户。为了实现这一点，HTML 代码需要更改如下：\n\n```html\n<tr>\n\
    <td width=\"50%\" align=\"right\">First NAME</td\n<td width=\"50%\" align=\"left\"\
    >\n<form:input path=\"firstName\" size=\"30\"/>\n<font color=\"red\">\n<form:errors\
    \ path=\"firstName\"/>\n</font>\n</td>\n</tr>\n```\n\n## 实现表示层\n\n标签 `<form:errors>`\
    \ 用于显示我们在 `validate()` 方法中为属性 'path' 绑定的验证错误消息。在这些代码中，我们展示了如何为数据成员 `firstName`\
    \ 显示验证错误消息。同样，我们可以为表单中的其余字段开发验证。在完成表单中每个字段的验证代码后，如果用户尝试用空值提交，浏览器中的预期输出如下：\n\n\
