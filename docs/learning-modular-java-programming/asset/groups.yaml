    \ value=\"root\" />\n  <property name=\"password\" value=\"mysql\" />\n</bean>\n\
    ```\n\n```xml\n<bean id=\"jdbcTemplate\" class=\"org.springframework.jdbc.core.JdbcTemplate\"\
    >\n  <property name=\"dataSource\" ref=\"dataSource\"/>\n</bean>\n```\n\n```xml\n\
    <bean id=\"contactDao\" class=\"com.packt.dao.ContactDAOImpl\">\n  <property name=\"\
    jdbcTemplate\" ref=\"jdbcTemplate\" />\n</bean>\n```\n\n4. The ConcatController\
    \ implementation remains untouched. After deploying and executing the application,\
    \ we will get one more row added in the Contact_CORE table.\n\nWe have just seen\
    \ the ways to handle a database using JDBC basics with the help of Spring integration\
    \ techniques. The developers don't have to get involved managing the Connection,\
    \ exception handling and dealing with boilerplate code. For smaller applications,\
    \ it is fine, but when the application size increases, the pain comes back. Now,\
    \ as a developer, we need something more. We need something which provides the\
    \ facility to manage JDBC from the perspective of objects and not SQL-centric.\n\
    \n# Problems with JDBC\n\nThe problems with JDBC are as follows:\n\n- In JDBC,\
    \ the developer maps a data member to a table column. This is not object-centric.\n\
    - No default mapping is available in JDBC with the table.\n- JDBC works using\
    \ the basics of SQL.\n- JDBC uses database-specific code.\n- No automatic versioning\
    \ or timestamping is available.\n\n# Introduction to ORM\n\nTo overcome these\
    \ drawbacks, developers have the Object Relational Mapping (ORM) technique. ORM\
    \ helps to manage the impedance mismatch between an object-oriented application\
    \ and a relational database. ORM helps to write less complex applications. With\
    \ the help of ORM frameworks, we can persist the objects to the relational tables\
    \ using the mapping between the tables and the objects. iBatis, JPA and Hibernate\
    \ are the ORM technologies which are on the market.\n\n# Advantages of using ORM\n\
    \nThe advantages of using ORM are as follows:\n\n- ORM maps an object to the table\n\
    - It supports its own query language instead of SQL\n- Less database-dependent\
    \ code\n- Low maintenance cost\n- Optimizes the performance by providing caching\n\
    - Provides ways for automatic versioning and timestamping\n\nLet's now discuss\
    \ the Hibernate framework.\n\n# Introduction to Hibernate\n\nHibernate is a Java-based\
    \ open source framework also called an ORM tool. It has APIs to support persistence.\
    \ Hibernate applications define persistence classes that are mapped to the database\
    \ tables. These persistence classes are POJO classes. POJOs are Plain Old Java\
    \ Objects, which facilitate holding the data, which makes it easier to send data\
    \ from one layer to another.\n\n# Hibernate architecture\n\nThe following diagram\
    \ shows the core interfaces which are used in Hibernate applications and the interaction\
    \ of a Java application to access the data from the database using these interfaces\
    \ through APIs such as JDBC, JTA, or JNDI:\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_103_0.png)\n\
    \nWhen a developer uses Hibernate, the most important thing is to determine the\
    \ mapping between the class and the table in the application. This class may be\
    \ just a POJO or a POJO which supports inheritance or containment. Whatever OOPS\
    \ strategy the POJO is supporting, there are some facts which the developer needs\
    \ to always keep in mind:\n\n- The POJO must follow JavaBean specification and\
    \ must include getter and setter methods.\n- If the class exists on its own and\
    \ it's not a part of the inheritance or composition strategy, the identifier strategy\
    \ has to be provided. Hibernate provides different identifier types to generate\
    \ or built the identifier.\n\nHibernate internally uses JDBC to connect to the\
    \ database. Hibernate can be used with an application server where it uses JNDI\
    \ to handle the connection resource. Hibernate can use a JDBC connection or Java\
    \ Transaction API (JTA) for transaction support.\n\n# Talking to the Database\n\
    \nIn Hibernate APIs, there are some important classes and interfaces which the\
    \ developer commonly comes across:\n\n- Configuration: The Configuration class\
    \ is very important in hibernate as it has the responsibility to get the database\
    \ connection and the mapping for a class to the table:\n  - To handle the connection,\
    \ hibernate uses a configuration file which has the name hibernate.cfg.xml.\n\
    \  - Hibernate uses mapping files in order to map a class to a table. The name\
    \ of file is normally XXX. XXX will be replaced by the name of the POJO to be\
    \ mapped. But nowadays, instead of maintaining the file, developers can also use\
    \ annotations for the mapping.\n- SessionFactory: It is a singleton, heavyweight\
    \ class. The SessionFactory configures hibernate for application using the configuration\
    \ file and gives an object of Session. As SessionFactory is a heavyweight object,\
    \ the developer has to take care to use a single object per application.\n- Session:\
    \ Session is obtained from a SessionFactory object. It's needed every time the\
    \ developer deals with the database to add a new record or load an existing record\
    \ from a table. Session is lightweight; when it gets instantiated, the connection\
    \ is made with the database.\n- Query: The Query interface lets the developer\
    \ query the database, which is completely upon upon object identifier.\n- Transaction:\
    \ Transaction supports the development side, helping to maintain integrity.\n\n\
    Let's discuss a small application to get exposure to the hibernate application\
    \ in the XML. We will cover mapping using annotation in the next application.\
    \ We need to do the following steps:\n\n- Write a POJO whose object we want to\
    \ persist.\n- Map the POJO in a Hibernate mapping file with the name POJO_name.hbm.xml.\
    \ While writing the mapping, provide the identifier strategy and map all the data\
    \ members with the columns.\n\n# Chapter 4\n\n- 3. Write the connection parameters\
    \ in the hibernate.cfg.xml file. Put the file in classpath as it is a default\
    \ location from hibernate loads the configuration.\n- 4. Create a class where\
    \ we write the code to insert the data to the table or to perform other database-related\
    \ operations.\n\nThe steps which need to be performed here will be:\n\n- 1. Load\
    \ the configuration file and get an object of SessionFactory.\n- 2. From SessionFactory,\
    \ obtain an object of Session.\n- 3. Using the object of Session, get an object\
    \ of Transaction.\n- 4. Begin the transaction before performing the database operation.\n\
    - 5. Invoke a method on session to perform the database operation.\n- 6. Commit\
    \ the transaction on successful completion of the database operation.\nIf the\
    \ operation has failed, rollback the transaction.\n- 7. Close all the resources\
    \ on completing the operation.\n\nLet's start with development:\n\n- 1. Create\
    \ a new Java application with the name Ch04_Hibernate_\nIntroduction.\n- 2. Add\
    \ the following hibernate JAR FILES and mysql-connector-java-5.1.12-bin\njar:\n\
    \n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_105_0.png)\n\nThe jar files for hibernate\n\
