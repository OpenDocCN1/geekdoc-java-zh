    ## 6 Testing Your Application


    Any application which has completed its development will proceed to the next step
    of verifying whether the application is actually working. This phase is very important
    as it is where we ensure the correctness of the product and try to find any flaws
    in development which may have been overlooked at the time of writing the code.
    This phase is technically called testing. But now the meaning, implementation,
    and importance have been changed a lot. We are going to explore testing, the involvement
    of testing in writing good code, the role of the developer in testing, and much
    more.


    In this chapter, we are going to explore the following topics:


    - What is testing?

    - The different phases involved in testing an application

    - How to test JavaEE applications

    - The use of JUnit/Mockito

    - Introduction to Arquillian testing


    ## Software testing


    An application is the solution to a problem proposed by the client. In providing
    the solution, the developer provides an implementation depending upon some rules
    and algorithms. They concentrate on providing a correct implementation to achieve
    the appropriate level of quality, which meets the client requirement in all aspects.
    The developed application must be verified to ensure that it meets the correct
    requirement and specifications. The process of verifying, to prove that the product
    is working correctly, is more precisely called; software testing.


    ## Testing Your Application


    Software testing cannot guarantee that the application is high-quality software,
    but it ensures that the application will operate in a given manner based on the
    values provided to it. It finds the flaws in the application but doesn''t guarantee
    its absence. We also need to remember that testing of an application is always
    dependent on the values the tester is going to provide. So if a tester fails to
    judge the condition, the application will be tested with the wrong values.


    Let''s not directly move into the details of how to do testing and other details.
    First of all, let''s get an overview of the application development lifecycle.
    This discussion will be helpful for understanding the way testing has been changed
    and the importance of it as well.


    Each development lifecycle is roughly divided into problem analysis, designing
    the solution for the problem, implementing the design, testing the implementation,
    and deploying the module. Traditionally, the waterfall model was used for software
    development.


    ## The waterfall model


    In the waterfall model, each step must be completed before you start the next
    step. In the waterfall model, understanding the problem is the most important
    factor in order to design it correctly. The risks and problems emerge in the later
    stages of the process, which is the drawback of this model.


    The following diagram illustrates the flow of the waterfall model:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_140_0.png)


    When the application is small, it is easy to adopt such a model but if the application
    is large, each step takes a long time to complete. Testing comes at the end, whether
    the requirements of the client have been met by the developed solutions or not
    comes to our notice at a very late stage, which is a high risk. In the worst situations,
    the solution may fail completely. Efforts have been made to overcome the drawbacks
    of the waterfall model in the spiral model.


    ## The spiral model


    The following diagram illustrates the flow of the Spiral model:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_141_0.png)


    In the spiral model, the entire lifecycle is divided into small spans in contrast
    to the waterfall model which takes a long time. It''s mostly associated with **Rapid
    Application Development (RAD)**. It gives a facility to receive early customer
    feedback to spot the problem and meet the exact requirement. As the requirement
    analysis is on a regular basis, changes can be incorporated more easily. One of
    the drawbacks faced in adopting this model is its difficulty to manage. In order
    to overcome this drawback, the spiral model has been logically extended to iterative
    models.


    ## The V model


    The V model is considered an extension of the waterfall model and is in a V shape.
    Actually, the name V is not just because of its V shape but of two famous terms
    used in the model: **Verify** and **Validate**. The following diagram illustrates
    the V model:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_141_1.png)


    ## Verification phases


    Verification finds out whether the requirements are understood correctly or not.

    The verification phases are as follows:


    - Requirement analysis: This phase collects the client requirements in order to
    understand their expectations. The acceptance test is written upon this phase.
    The requirements collected from the client are used as the input in the acceptance
    test.

    - High-level design: After client requirement gathering, now it is time to take
    decisions about the hardware and software to be used in development.

    - Detailed design: This phase, detailed designing of each module is done. It''s
    a very important phase to make the design of each module in a way that it will
    be used with other modules.

    - The coding or implementation phase. After implementing, it is very important
    to check whether each module is working in the expected way or not. Faults and
    errors are caught by unit testing. This is a perfect time to design unit tests
    based on detailed design.


    ## Validation phases


    Validation helps in finding the requirements which we are understood correct or
    not from the previous phase. The validation phases are as follows:


    - Unit testing: Unit testing is performed on a unit to find out whether it is
    working as per expectations or not. Unit test cases will be written on the basis
    of test cases which give a detailed description about what scenarios are to be
    considered while writing the test case. As a unit test is concentrated and executed
    on a module, errors and flaws can be caught at a very early stage and can be removed
    easily.

    - Integration testing: Integration testing the integration of two modules.

    - Product testing: In product testing, each and every functionality as per the
    requirement is checked.

    - Acceptance testing: This testing is used to find out whether each every requirement
    put forward by the client has been fulfilled or not. It''s done in the client
    environment. Along with business logic, the presentation is also tested.

    - System testing: In system testing, the communication with the system and compatibility
    with the platform is tested.


    After having a long discussion, we have now well understood the lifecycle of an
    application. If we apply the V model in our contact management application, we
    can conclude that we have already finished the development phase. We also done
    unit testing of the modules. We have developed the business logic in the previous
    chapter. That means it''s time to go ahead integration testing, the business layer
    as well. We haven''t yet done unit testing of the controller and the data layer.
    Testing the data layer was easy for we had access to the data layer. For a while,
    let''s assume we don''t have a database and we are developing the data layer.
    Testing has to be done. But we cannot there is no database. We test! Actually,
    there are many times in development when the developing is dependent on environmental
    factors, such as in, the database. In the controller layer, the methods need request
    parameter values. The request object is available only if the application is running
    in containers. In JavaEE, most of the application has many dependencies. So testing
    such an application becomes a headache. In such situations, the testing will be
    carried out with the help of dummy objects. These dummy objects are mock objects.


    ## Mock testing


    The testing is carried out with the help of mock objects is called mock testing.
    There are a number of ways which provide the means for mock testing. Let''s discover
    them one by one.


    ## Spring testing framework


    Spring provides an API to conduct testing using the mock technique in JUnit. Using
    this API, we can create mock objects of Request, Response, Filter, and HttpSession,
    which is otherwise available from the container. All methods which are dependent
    on request or user''s request and response can be tested easily without a container.
    Using this API, tests can be created even before the development of the controller
    has be completed with mocking or stubbing.


    Let''s use it in our controller testing which we developed in Ch_05_jdbcTemplate_Transaction_Declarative
    as per the following cases:

