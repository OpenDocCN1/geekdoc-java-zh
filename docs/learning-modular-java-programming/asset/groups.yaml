    Let''s dig into annotation validations bit more.


    Spring supports JSR-303. JSR-303 is a specification for bean validation. It''s

    developed for providing a generalized validation solution which the developers

    need for the model constraints. The developers can reduce the code by using the

    HibernateValidator framework along with Spring. The following are the few

    validations that the developer uses frequently to put constraints on the fields

    or properties:


    | Annotation | Use |

    |---|---|n| @Length(min=, max=) | Validate the annotated string is between min
    and maxincluded |

    | @Max | Check whether the annotated value is less than or equal to the specified
    maximum |

    | @Min | Check whether the annotated value is higher than equal to the specified
    minimum |

    | @NotNull | Check that the annotated value is not null |

    | @NotEmpty | Check that the annotated element is not null empty |

    | @NotBlank | Check that the annotated string is not null and the trimmed length
    is greater than 0 |'
