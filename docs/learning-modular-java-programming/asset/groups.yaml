    # Project deployment


    We created the project in Eclipse IDE and it is there. It may be possible to give
    our projects to use, or want to use it on some other machine. The process of installing
    our application into the server context is called project deployment. This process
    is server-specific. On successful deployment, we can use a project without eclipse
    IDE. Here we will discuss the possible ways of deploying our application into
    a Tomcat7 server.


    We can create a web archive file (WAR) and deploy it in Tomcat with one of the
    two ways described in the following sections.


