  mdcn: "\n\n# 向 Java EE 问好\n\n1996年12月，Sun 微型系统公司发布了 JavaBean 规范。该规范规定了开发者可以使用这些规则来开发可重用、低复杂的组件。这些\
    \ POJO 类现在将用作开发轻量级、低复杂且灵活的框架的基础：Spring 框架。该框架源于 Rod Johnson 在 2003年2月的思想。Spring\
    \ 框架由七个模块组成：\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_46_0.png)\n\nSpring 由多个模块组成，开发者并不总是依赖于框架。他们可以根据需求使用任何模块。开发依赖\
    \ Spring API 的代码并不是强制性的。这被称为非侵入式框架。Spring 在依赖注入（DI）的基础上工作，这使得集成变得容易。开发者开发的每个类都有一些依赖项。以\
    \ JDBC 获取连接为例，开发者需要提供 URL、用户名和密码。获取连接依赖于这些值，因此我们可以称它们为依赖项，将这些依赖项注入到对象中被称为 DI。这使得新兴的\
    \ Spring 框架成为企业级应用中间层或业务层的首选。\n\n# Spring MVC\n\nSpring MVC 模块是我们期待开发 Web 应用程序的选择。Spring\
    \ MVC 有助于简化开发以构建出健壮的应用程序。该模块还可以将通用关注点（如读取请求数据、数据绑定到领域对象、服务器端验证和页面渲染）交给框架，而专注于业务逻辑处理。\n\
    \n# 第 2 章\n\n这就是我们作为开发者所寻找的。Spring MVC 可以与 Velocity、Freemarker、Excel 和 PDF 等技术集成。它们甚至可以利用框架提供的面向切面编程（用于横切技术）、事务管理和安全等其他服务。\n\
    \n# 组件\n\n让我们先尝试从 Spring 框架的角度理解普通 Web 应用程序的流程，以便有助于讨论组件以及所有其他细节：\n\n- 1. 点击 URL\
    \ 后，浏览器中将显示网页。\n- 2. 用户填写表单并提交。\n- 3. 前置控制器拦截请求。\n- 4. 前置控制器尝试寻找 Spring MVC 控制器并将请求传递给它。\n\
    - 5. 执行业务逻辑并将生成的的结果绑定到 ModelAndView。\n- 6. ModelAndView 将发送回前置控制器。\n- 7. 前置控制器在\
    \ ModelAndView 的帮助下发现视图，绑定数据并发送到浏览器。\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_47_0.png)\n\
    \nSpring MVC\n\n[ 31 ]\n\n# 前置控制器\n\n正如 servlet JSP 所示，为了维持应用程序的每个流，开发者开发 servlet\
    \ 和数据模型，从 servlet 的数据将通过属性转发到 JSP。没有单一 servlet 可以完全维护应用程序流。这一缺点在 Spring MVC 中被克服了，因为它依赖前置控制器设计模式。\n\
    \n在控制器设计模式中，应用程序有一个单一的入口。无论客户端访问什么 URL，都将由一段代码处理，然后将请求委托给应用程序中的其他对象。\n\n在 Spring\
    \ MVC 中，DispatcherServlet 充当前置控制器。DispatcherServlet 决定将请求委托给哪个 Spring MVC 控制器。如果应用程序中只有一个\
    \ Spring MVC 控制器，这个决定非常简单。但我们知道在企业级应用中，会有多个 Spring MVC 控制器。在这里，前置控制器需要找到正确的 Spring\
    \ MVC 控制器。得手的是配置文件，其中发现 Spring MVC 控制器的信息是通过 handler mapping 配置的。一旦找到 Spring MVC\
    \ 控制器，前置控制器会将请求委托给它。\n\n# Spring MVC Controller\n\n所有的过程（如实际业务逻辑、决策或数据操作）都发生在\
    \ Spring MVC 控制器中。一旦操作完成，它会将封装在 ModelAndView 对象中的视图和模型发送给前置控制器。前置控制器进一步解析视图位置的模块是\
    \ ViewResolver。\n\n# ModelAndView\n\n持有模型和视图对象的被称为 ModelAndView。模型代表浏览器中显示的视图。\n\
    \n# ViewResolver\n\n控制器返回 ModelAndView 给前置控制器。ViewResolver 帮助将逻辑视图映射到实际视图。在应用程序中，数据可以用多种格式显示，从简单的\
    \ JSP 到复杂的 Jasper。Spring 提供了 InternalResourceResolver、JasperResolver、VelocityLayoutResolver\
    \ 等支持不同的格式。\n\n# 配置文件\n\nDispatcherServlet 需要发现 Spring MVC 控制器、ViewResolver 等等。所有这些信息都集中配置在名为\
    \ XXX 的文件中，XXX 是前置控制器的名称。有时 beans 会分布在多个文件中。在这种情况下，必须进行额外配置，我们将在本节看到。\n\n基础配置如下：\n\
    \n```xml\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\nns:context=\"\
    http://www.springframework.org/schema/context\"\nns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \nxsi:schemaLocation=\"http://www.springframework.org/schema/beans\nhttp://www.springframework.org/schema/beans/spring-beans-3.0.xsd\n\
    http://www.springframework.org/schema/context\nhttp://www.springframework.org/schema/context/spring-context-3.0.xsd\"\
    >\n<!-- 控制器映射 -->\n<!-- 在此处配置视图解析器 -->\n</beans>\n```\n\n控制器配置文件将命名为 name_of_servlet.xml。在我们的项目中，我们将命名为\
    \ HelloWeb-servlet.xml。让我们使用 Spring MVC 执行 Web 应用的基础步骤以接收数据并显示它：\n\n- 1. 创建名为\
    \ Ch02_HelloWorld 的 Web 应用。\n- 2. 在 lib 文件夹添加 Spring 所需的 JAR 文件和 servlet。\n- 3.\
    \ 创建从用户处收集数据并请求控制器的页面。\n- 4. 配置前置控制器。\n\n# 向 Java EE 问好\n\n- 5. 创建 HelloWorldController。\n\
    - 6. 添加执行业务逻辑的方法并将视图名称和模型发送给控制器。\n- 7. 创建 HelloWeb-servlet.xml 并配置 SpringMVC 和\
    \ ViewResolver。\n- 8. 创建显示数据的 JSP。\n\n项目的文件系统如下：\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_50_0.png)\n\
    \n我们已经创建了项目。让我们开始创建 index.jsp：\n\n```html\n<form action=\"hello.htm\">\n    <div>NAME:\
    \ <input type=\"text\" name=\"name\"></div>\n    <div><input type=\"submit\" value=\"\
    ENTER\"></div>\n</form>\n```\n\n当我们提交表单时，请求被发送到映射该 URL 的资源。Spring MVC 遵循前置控制器设计。因此，访问应用程序的所有请求首先由前置控制器处理，然后将其发送给相应的控制器。\n\
    \n前置控制器在 DD 中映射如下：\n\n```xml\n<servlet>\n    <servlet-name>HelloSpring</servlet-name>\n\
    \    <servlet-class>org.springframework.web.servlet.DispatcherServlet</servlet-class>\n\
    </servlet>\n<servlet-mapping>\n    <servlet-name>HelloSpring</servlet-name>\n\
    \    <url-pattern>*.htm</url-pattern>\n</servlet-mapping>\n```\n\n现在控制器需要找到 Spring\
    \ MVC 控制器。这将由配置文件完成。该文件名为 XXX-servlet.xml，其中 XXX 被 DD 中的前置控制器名称所替换。在这种情况下，HelloSpring-servlet.xml\
    \ 将包含配置。在 WEB-INF 文件夹部分，我们看到了文件的结构。在这个文件中，将进行映射以找到控制器存放的包。实现方法如下：\n\n```xml\n\
    <context:component-scan base-package=\"com.pack.ch02.controllers\" />\n```\n\n\
    现在前置控制器将从 base-package 属性指定的指定的包中查找控制器。前置控制器现在将访问 HelloWorldController。该类必须由 @Controller\
    \ 注解：\n\n```java\n@Controller\npublic class HelloWorldController {\n    //代码在此\n\
    }\n```\n\n一旦前置控制器知道了哪个控制器类，寻找合适的映射方法的任务就开始了。通过匹配放在类上或类中方法上的 @RequestMapping 注解的值来实现。在我们的案例中，URL\
    \ 映射是 hello.htm。因此将开发该方法：\n\n```java\n@RequestMapping(value=\"/hello.htm\")\n\
    public ModelAndView sayHello(HttpServletRequest request) {\n    String name=request.getParameter(\"\
    name\");\n}\n```\n\n"
