- md: "\nThe process flows as described:\n\n- 1. The user hits the URL to visit.\n\
    - 2. Hitting the URL, we make a request to the application. In order to find which\
    \ resource is mapped to the URL, DD will be hit. The filter mapping will be checked\
    \ out if the resource has limited access. If it is secure, <http> configuration\
    \ will be observed. The <http> configuration is checked for the authentication\
    \ mechanism to discover which authentication method is used, login location, and\
    \ other required information.\n- 3. If <http-basic>, a default login page by spring\
    \ is provided where the user can enter their credentials. If form-based authentication\
    \ is configured, a custom login form will be given.\n- 4. The data will be taken\
    \ to the server for authentication.\n- 5. <authentication-manager> is checked\
    \ to find how to load the credential data.\n- 6. Authentication is performed and,\
    \ depending upon it, a success or failure page will be shown to the user.\n\n\
    Let's start securing the URL for adding the contact data in our contact management.\
    \ The URL which we want to secure is showForm.htm. Only ROLE_ADMIN can access\
    \ the URL to get the contact form and add new content; others cannot access the\
    \ information. Let's take Ch04_jdbTemplate_Integraon to add Spring Security with\
    \ basic authentication with the help of the following steps.\n\n## Case 1 – Basic\
    \ authentication\n\nPerform the following steps for basic authentication:\n\n\
    - 1. Create a new XML named spring-security.xml in WEB-INF.\n- 2. Add a new name\
    \ to capture common uses of the framework and simplify the syntax in the XML configuration\
    \ file as xmlns:security=http://www.springframework.org/schema/security which\
    \ is mapped to the locations such as:\n\n```\nhttp://www.springframework.org/schema/security\n\
    http://www.springframework.org/schema/security/spring-security-3.0.xsd\n```\n\n\
    ## Securing the Application\n\nThe XML will look like this:\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\
    \n     xmlns:security=\"http://www.springframework.org/schema/security\"\n   \
    \  xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n     xsi:schemaLocation=\"\
    http://www.springframework.org/schema/beans\n     http://www.springframework.org/schema/beans/spring-beans-3.0.xsd\n\
    \     http://www.springframework.org/schema/security\n     http://www.springframework.org/schema/security/spring-security-3.2.xsd\"\
    >\n```\n\nNow we can use security to use the tags.\n\n- 1. Configure the URL,\
    \ which role can access the URL, and the authentication mechanism as:\n\n```xml\n\
