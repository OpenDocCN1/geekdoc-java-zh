    \ resolve the location of the view. The module which helps front controller to\
    \ obtain the view information is ViewResolver.\n\n# ModelAndView\n\nThe object\
    \ which holds information about the model and view is called as ModelAndView.\
    \ The model represents the piece of information used by the view for display in\
    \ the browser of different formats.\n\n# ViewResolver\n\nThe MVC controller returns\
    \ ModelAndView to the front controller.\nThe ViewResolver interface helps to map\
    \ the logical view to the actual view. In applications, data can be displayed\
    \ in a number of formats, from as simple as JSP to complicated formats like JasperReport.\
    \ Spring provides InternalResourceResolver, JasperResolver, JasperReportsView,\
    \ VelocityLayoutResolver, and so on, to support different formats.\n\n# The configuration\
    \ file\n\nDispatcherServlet needs to discover information about the Spring MVC\
    \ controller, ViewResolver, and many more. All this information is centrally configured\
    \ in a file named XXX XXX is the name of the front controller. Sometimes the beans\
    \ will be distributed across multiple configuration files. In this case, extra\
    \ configuration has to be made, which we will see later in this chapter.\n\nThe\
