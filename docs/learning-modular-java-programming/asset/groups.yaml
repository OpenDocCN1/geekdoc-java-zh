    \ MVC 设计模式，我们试图编写职责分离清晰的模块。这些模块可以为了未来的增强而升级。由于这些模块对其他模块的依赖较低，因此很容易进行测试。如果不了解 MVC\
    \ 的两种架构风格，讨论 MVC 将是不完整的：\n\n- MVC架构\n- MVC II架构\n\n# MVC架构\n\n在这种模型中，Web 应用以 JSP\
