  mdcn: "\n5. 如果我们输入 `user - user` 作为用户的凭据，我们将看到带有错误信息的相同登录页面，如下截图所示：\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_179_0.png)\n\
    \n## 案例 3 – 数据库验证\n\n在案例 1 和 2 中，我们是根据身份提供程序中配置的数据对用户进行身份验证。与其在 XML 中配置，我们可以将凭据存储在数据库中并用于身份验证。要使用数据库身份验证，我们需要遵循以下步骤：\n\
    \n- 1. 在 `authentication-provider` 中，我们不需要配置用户服务，而是需要配置 `jdbc-user-service` 为：\n\
    ```xml\n<security:authentication-manager>\n<security:authentication-provider>\n\
    <security:jdbc-user-service id=\"userService\"\ndata-source-ref=\"dataSource\"\
    \nusers-by-username-query=\"select username, password, enabled from contact_users\
    \ where username=?\"\nauthorities-by-username-query=\"select username, role from\
    \ contact_users where username=?\"\n</security:authentication-provider>\n```\n\
    - `dataSource` bean 将提供获取连接的详情\n- `users-by-username-query` 根据用户名查询数据库获取用户的用户名、密码和启用状态\n\
    - `authorities-by-username-query` 根据用户名查询数据库获取用户的权限（authorities）\n\n## 安全应用程序\n\
    \n2. 创建表 `contact_users` 并添加几个用户：\n\n```sql\ncreate table contact_users(username\
    \ varchar(20), password\nvarchar(20), role varchar(10), enabled boolean);\ninsert\
    \ into contact_users values ('admin', 'admin', 'ROLE_ADMIN',true);\ninsert into\
    \ contact_users values ('admin1', 'admin', 'ROLE_ADMIN',true);\ninsert into contact_users\
    \ values ('user', 'user', 'ROLE_USER',true);\n```\n\n3. 部署应用以获取首页。点击 **Add New\
    \ Contact**（添加新联系人）链接，我们将获得登录表。如果输入的 `admin` 角色凭据为用户名和密码 `admin = admin`，我们将获得联系人表。\n\
    \n4. 如果凭据错误但用户名正确，我们将看到以下屏幕：\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_180_0.png)\n\
    \n5. 如果我们输入 `user - user` 作为用户角色的凭据，我们将获得如下的拒绝访问页面：\n\n| localhost:8080/ch07_Spring_Security_Form_Database/showForm.htm\
    \ |\n|---|\n| HTTP Status 403 - Access is denied |\n| Status report |\n| Message:\
    \ Access is denied |\n| Description: Access to the specified resource (Access\
    \ is denied) has been forbidden. |\n| Apache Tomcat/7.0.22 |\n\n## 案例 4 – 记住我\n\
    \n应用程序的一些 URL 需要安全，但从开发人员的角度来看，用户不需要每次都被提示输入凭据。我们可以拥有“记住我”（remember me）功能，它允许用户保留存储的信息，这样下次他们就不需要再次进行身份验证。为了提供\
    \ remember me 标签，我们需要执行以下步骤：\n\n- 1. 在 `<http>` 下添加 `remember me` 标签——它提供了“记住我”功能。更新后的配置如下：\n\
    ```xml\n<security>\n  <http auto-config=\"true\">\n    <security:intercept-url\
    \ pattern=\"/showForm.htm\">\n    <security:form-login login-processing-url=\"\
    /j_spring_security_authentication-failure-url=login.jsp?default-target-url=index.jsp?error=error\"\
    />\n    <security:remember-me key=\"contactdata\"\n      token-validity-seconds=\"\
    2419200\"/>\n  </http>\n</security>\n```\nremember me 配置接受两个属性：`key` 和 `token-validity-seconds`。该功能基于\
    \ cookie 管理原理工作。每当用户选择记住我时，客户端机器就会存储一个 cookie，该 cookie 默认存储用户名、密码、过期日期和 MD5 加密格式的私钥。默认情况下，私钥的值为\
    \ SpringSecured，且该 cookie 存在两周。在上面的配置中，我们将私钥设为 `contactdata`，它是特定特定的，并且持续四周（以秒为单位）。\n\
    \n- 2. 我们还需要更新登录表，并将“记住我”添加为一个复选框，其动为 `spring_security_remember_me`。代码如下：\n\n\
    ```html\n<tr><td><input id=\"remember_me\" name=\"spring_security_remember_me\"\
    \ type=\"checkbox\" /></td>\n<td><label for=\"remember_me\">Remember me</label></td>\n\
    </tr>\n```\n\n## 安全应用程序\n\n3. 执行应用时，当我们点击 **Add new contact link** 时，我们将获得一个带有“记住我”功能的登录页面，如下：\n\
    \n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_182_0.png)\n\n4. 如果输入的 `admin` 角色凭据为用户名和密码\
    \ `admin = admin`，我们将获得联系人表。\n\n5. 如果凭据错误但用户名正确，我们将看到以下屏幕：\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_180_0.png)\n\
    \n6. 如果我们输入 `user - user` 作为用户角色的凭据，我们将获得如下的拒绝访问页面：\n\n| localhost:8080/ch07_Spring_Security_Form_Database/showForm.htm\
    \ |\n|---|\n| HTTP Status 403 - Access is denied |\n| Status report |\n| Message:\
    \ Access is denied |\n| Description: Access to the specified resource (Access\
    \ is denied) has been forbidden. |\n| Apache Tomcat/7.0.22 |\n"
