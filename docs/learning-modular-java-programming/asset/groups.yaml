    are going to explore the following:


    +   - Java EE technologies

    - Why servlet and JSP?

    - Introduction to Spring MVC

    - Creating a sample application through Spring MVC


    # The enterprise as an application


    To withstand the high, competitive, and daily increasing requirements, it''s becoming
    more and more difficult nowadays to develop an enterprise application. The difficulty
    is due to more than one kind of service, requirement of application to be robust
    and should support concurrency, security, and many more. Along with these things,
    enterprise applications should provide an easy user interface but good look and
