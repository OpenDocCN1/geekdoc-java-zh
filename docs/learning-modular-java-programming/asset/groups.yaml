  mdcn: "\n\n## 用于保护方法的启用 SpEL 的安全注解\n\nSpring 3.0 引入了四种根据角色访问权限来保护方法调用的方法，如下：\n\n\
    - @PreAuthorized: 该注解接收一个参数，其值将作为可以访问该方法的角色值，如下：\n`@PreAuthorized(\"*hasRole('ROLE_ADMIN')\"\
