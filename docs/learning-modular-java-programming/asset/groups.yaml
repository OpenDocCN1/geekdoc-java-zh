    # 关于作者


    **Tejaswini Mandar Jog** 是一位充满激情和热情的 SCJP 认证培训师。她在 IT 培训领域拥有八多年的经验，专长 Java、J2EE
    及相关技术。她曾与许多知名公司合作开展培训和技能提升计划。她还参与了使用 Java、Spring 和 Hibernate 的项目开发。


    我仍然记得第一次与编辑关于这本书的交谈。在那天之前，我只是一个读者，从未想过要写书。但现在，我获得了一个当作者的机会！我曾陷入了困境并很困惑——我可以吗？然后，我的个人导师和哲学家
    Mandar 给了我尝试的信心。感谢 Mandar，不仅是因为你提供了有力的支持，还因为你宝贵的建议，这些建议帮助我改进了内容。


    如果没有编辑 Shali 的帮助，这本书无法完成。她的建议和努力起到了作用。策划编辑 Aaron，感谢你对我的信任，并给了我写这本书的信心。


    如果没有家人最好的祝福和支持，我怀疑自己能否完成这本书。


    更不用提我可爱的儿子 Ojas 了。我非常感激他支持我的方式，让我能够静心写作。非常爱你，亲爱的！！！


    最后，感谢所有通过直接或间接支持我完成这本书的人。感谢你们，一直陪伴！！！


    # 关于审核员


    **Dionisios Petrakopoulos** 在过去的 15 年中曾在多家公司担任高级软件工程师，使用不同的编程语言（C、C++、Java SE、Java
    EE 和 Scala）和技术。他的主要兴趣是 Java 生态系统及其各个方面。他的另一个兴趣领域是信息安全，特别是密码学。他拥有伦敦大学皇家霍洛威学院的计算机科学学士学位和信息安全硕士学位。


    > 我想感谢我的妻子 Anna 的支持和爱。


