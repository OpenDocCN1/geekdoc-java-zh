    # Configuring DataSource in Spring JDBC


    Spring offers three different ways to configure a DataSource bean:


    +   - Getting data sources by looking up JNDI

    - Getting data sources from the JDBC driver

    - Getting data sources that pool connections have configured on a server


    Let''s see each configuration by one.


    # Getting data sources by looking up JNDI


    The Spring MVC application gets deployed on the application as well as web servers.
    Both types of server allows developers to configure DataSource, which facilitates
    using container implementations. The Java Naming and Directory Interface (JNDI)
    is an API for directory service which allows Java applications to find objects
    by name using a lookup mechanism. The JNDI will be managed by the servers and
    used by the developers through a lookup mechanism, it provides great performance.


    The JNDI can be configured as follows:


    ```

    <jndi:lookup id="DataSource" jndi-name="jdbc/contactDS"

    resource-ref="true" />

    ```


    Here:


    +   - jndi-name is name of resource in JNDI

    - resource-ref is the value given in jndi-name, which can be prefixed with java:comp/env/


    # Getting data sources that pool connections configured on a server


    Spring does not provide any pooled data source directly. But it supports integrating
    Jakarta Commons Database Connection Pooling (DBCP). The configuration of the BasicDataSource
    will be:


    ```

    <bean id="DataSource"

    class="org.apache.commons.dbcp.BasicDataSource">

    <property name="driverClassName" value="com.mysql.jdbc.Driver" />

    <property name="url"

    value="jdbc:mysql://localhost:3306/TEST" />

    <property name="username" value="root" />

    <property name="password" value="mysql" />

    ```'
