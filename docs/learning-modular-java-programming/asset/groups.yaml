    Depending on the situation, the developer decides when to commit the data and
    when to rollback. The developer can decide the transaction attributes and can
    change them per the requirements. It gives fine control on the transaction as
    opposed to declarative transaction.


    How to choose a transaction management strategy is a question of debate as it
    depends on the situation and process flow. But whenever developers want to choose
    between programmatic transaction and declarative transaction, they need to think
    of how finely they want to handle transactions. If the requirement is to have
    fine control over transaction management, then they need to choose programmatic
    transaction. and how to make transaction management more effective with the help
    of transaction attributes such as isolation level, timeout, or read-only. You
    also want to keep your code clean and don''t want to get involved in coding, using
    declarative transaction.


    # # Summary


    Data is collected from the user through the UI; it is handled using the DAO layer
    but when to insert and how to insert is decided by the business logic layer. In
    this chapter, we have discussed the parameters such as market rules, situations
    to be taken care of, and transaction management to set up business rules. We discussed
    the way Spring handles transaction management using AOP. We demonstrated how to
    handle declarative transaction management and how to make transaction management
    more effective with the help of transaction attributes such as isolation level,
    timeout, or read-only.


    Here we completed the development of all layers. We have also done Junit testing
    of the DAO layer. In this chapter, we have looked at the collaboration of layers.
    If there is code, there is a possibility of melting the code. This leads to testing
    of the give and take between two layers.


    In the next chapter, we will talk about testing the collaboration between the
    layers, and the integration testing. We will discuss what integration testing
    is, why we need it, and most importantly, how to do integration testing.'
