  - '[PAGE 102]


    # Problems with JDBC


    The problems with JDBC are as follows:


    +   - In JDBC, the developer maps a data member to a table column. This is not
    object-centric.

    - No default mapping is available in JDBC with the table.

    - JDBC works using the basics of SQL.

    - JDBC uses database-specific code.

    - No automatic versioning or timestamping is available.


    # Introduction to ORM


    To overcome these drawbacks, developers have the Object Relational Mapping (ORM)
    technique. ORM helps to manage the impedance mismatch between an object-oriented
    application and a relational database. ORM helps to write less complex applications.
    With the help of ORM frameworks, we can persist the objects to the relational
    tables using the mapping between the tables and the objects. iBatis, JPA and Hibernate
    are the ORM technologies which are on the market.


    # Advantages of using ORM


    The advantages of using ORM are as follows:


    +   - ORM maps an object to the table

    - It supports its own query language instead of SQL

    - Less database-dependent code

    - Low maintenance cost

    - Optimizes the performance by providing caching

    - Provides ways for automatic versioning and timestamping


    Let''s now discuss the Hibernate framework.


    # Introduction to Hibernate


    Hibernate is a Java-based open source framework also called an ORM tool. It has
    APIs to support persistence. Hibernate applications define persistence classes
    that are mapped to the database tables. These persistence classes are POJO classes.
    POJOs are Plain Old Java Objects, which facilitate holding the data, which makes
    it easier to send data from one layer to another.'
  - '[PAGE 103]


    # Hibernate architecture


    The following diagram shows the core interfaces which are used in Hibernate applications
    and the interaction of a Java application to access the data from the database
    using these interfaces through APIs such as JDBC, JTA, or JNDI:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_103_0.png)


    When a developer uses Hibernate, the most important thing is to determine the
    mapping between the class and the table in the application. This class may be
    just a POJO or a POJO which supports inheritance or containment. Whatever OOPS
    strategy the POJO is supporting, there are some facts which the developer needs
    to always keep in mind:


    +   - The POJO must follow JavaBean specification and must include getter and
    setter methods.

    - If the class exists on its own and it''s not a part of the inheritance or composition
    strategy, the identifier strategy has to be provided. Hibernate provides different
    identifier types to generate or built the identifier.


    Hibernate internally uses JDBC to connect to the database. Hibernate can be used
    with an application server where it uses JNDI to handle the connection resource.
    Hibernate can use a JDBC connection or Java Transaction API (JTA) for transaction
    support.'
  - "[PAGE 104]\n\n# Talking to the Database\n\nIn Hibernate APIs, there are some\
    \ important classes and interfaces which the developer commonly comes across:\n\
    \n+   - Configuration: The Configuration class is very important in hibernate\
    \ as it has the responsibility to get the database connection and the mapping\
    \ for a class to the table:\n  - To handle the connection, hibernate uses a configuration\
    \ file which has the name hibernate.cfg.xml.\n  - Hibernate uses mapping files\
    \ in order to map a class to a table. The name of file is normally XXX. XXX will\
    \ be replaced by the name of the POJO to be mapped. But nowadays, instead of maintaining\
    \ the file, developers can also use annotations for the mapping.\n- SessionFactory:\
    \ It is a singleton, heavyweight class. The SessionFactory configures hibernate\
    \ for application using the configuration file and gives an object of Session.\
    \ As SessionFactory is a heavyweight object, the developer has to take care to\
    \ use a single object per application.\n- Session: Session is obtained from a\
    \ SessionFactory object. It's needed every time the developer deals with the database\
    \ to add a new record or load an existing record from a table. Session is lightweight;\
    \ when it gets instantiated, the connection is made with the database.\n- Query:\
    \ The Query interface lets the developer query the database, which is completely\
    \ dependent upon the object identifier.: When communication happens between the\
    \ database and the application, there is a fair chance of something going wrong.\
    \ This leads to inconsistency on the database side, which may affect the developer's\
    \ business logic. Transaction supports the development side, helping to maintain\
    \ integrity.\n\nLet's discuss a small application to get exposure to the hibernate\
    \ application in the XML. We will cover mapping using annotation in the next application.\
    \ We need to do the following steps:\n\n+   - Write a POJO whose object we want\
    \ to persist.\n- Map the POJO in a Hibernate bean mapping file with the name POJO_name.hbm.xml.\
    \ While writing the mapping, provide the identifier strategy and map all the data\
    \ members with the columns."
