- md: "\nUpdate JSP using the following code in order to show the validation error\
    \ messages fetched from the properties file to the user:\n<form:errors path=\"\
    XXX\"/>\n\nHere, Xxx is the property of the POJO class whose object is expected\
    \ on the form submission.\n\nLet's start developing the properties file for showing\
    \ the messages to the users whenever some validation fails:\n\n- 1. Create a validations.properties\
    \ file under WEB-INF to configure the messages. It will be as follows:\nNotEmpty.contact.firstName=Pleaseenteryourfirstname.\n\
    NotEmpty.contact.address=Pleaseenteryouraddress.\n\nNotEmpty.contact.phone_number=Pleaseenteryourphonumber.\n\
    Pattern.contact.phone_number=pleaseentervalid0digitphonumber\n\nNotEmpty.contact.email=Pleaseenteryour-mail.\n\
    Email.contact.email=Your-mailisincorrect.\n\n- 2. We need to configure the location\
    \ and the base name of the properties file in the Spring configuration so that\
    \ Spring will load these messages at runtime before the page is rendered in the\
    \ browser. The configuration will be as follows:\n\n```\n<bean id=\"messagesSource\"\
    \nclass=\"org.springframework.framework.context.support.\nReloadableResourceMessagesSource\"\
    >\n  <property name=\"basename\" value=\"WEB-INF/validations\"/>\n</bean>\n```\n\
    \nThe property base name has the value /WEB-INF/, where /WEB-INF is the location\
    \ where the properties file will be available and it will have the base name validations.\n\
    \n- 3. The final step is to show the validation error messages to the user. It\
    \ can be done using the <form:error> tag as follows:\n<tr\n  <td width=\"50%\"\
    \ align=\"right\">FIRST NAME</td>\n  <td width=\"50%\" align=\"left\">\n</tr>\n\
    <form:input path=\"firstName\" size=\"30\" />\n  <font color=\"red\">\n\n## Implementing\
    \ the Presentation Layer\n\n```\n<form:errors path=\"firstName\" />\n</font>\n\
    </td>\n</tr>\n```\n\nHere we have designed it so that if validation fails for\
    \ the data member firstName,\nthe message will be shown in red color.\n\nThe final\
    \ output on submitting the form with some validation errors will be as allows:\n\
    \n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_78_0.png)\n\nLet's dig into annotation\
    \ validations bit more.\n\nSpring supports JSR-303. JSR-303 is a specification\
    \ for bean validation. It's\ndeveloped for providing a generalized validation\
    \ solution which the developers\nneed for the model constraints. The developers\
    \ can reduce the code by using the\nHibernateValidator framework along with Spring.\
    \ The following are the few\nvalidations that the developer uses frequently to\
    \ put constraints on the fields\nor properties:\n\n| Annotation | Use |\n|---|---|\n\
    | @Length(min=, max=) | Validate the annotated string is between min and max included\
    \ |\n| @Max | Check whether the annotated value is less than or equal to the specified\
    \ maximum |\n| @Min | Check whether the annotated value is higher than equal to\
    \ the specified minimum |\n| @NotNull | Check that the annotated value is not\
    \ null |\n| @NotEmpty | Check that the annotated element is not null empty |\n\
    | @NotBlank | Check that the annotated string is not null and the trimmed length\
    \ is greater than 0 |\n\n## Chapter 3\n\n| Annotation | Use |\n|---|---|\n| @Pattern(regex,\
    \ flag= | Check if the annotated string matches the regular expression considering\
    \ the given flag match |\n| @Size(min, max= | Check if the annotated element size\
    \ is between min and max (inclusive) |\n| @Valid | Perform validation recursively\
    \ on the associated object |\n\nInstead of hardcoding the values, it's best to\
    \ externalize them in properties file. The name and location can be anything.\
    \ We just need to take care of configuring whatever of the file and the location\
