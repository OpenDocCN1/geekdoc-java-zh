    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_193_0.png)


    10. We will get a list of available users. We haven''t created any users yet;
    we will get just admin as an available user as shown in the following screenshot:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_193_1.png)


    We can even get the users list from the **User List** menu from the left panel
    as shown as:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_193_2.png)


    # Versioning and Deploying


    11. Let''s add two more users here. Click on the **Create** button to get the
    new user template as follows:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_194_0.png)


    12. Add **packt_user1** as **Login Name**, **Contact1** as the password, select
    **ROLE** as the role. Click on **Create** to create a new user.


    13. In the same way, create one more user with the username *packt_user2* and
    password *Contact1*. You can use your choice of password but if you are using
    anything else please remember as we need it in the future.


    14. On clicking **User List**, we can get the user list with three users: admin,
    *packt_user1*, and *packt_user2* as shown in the following screenshot:


    | Username | Full Name | Description |

    | --- | --- | --- |

    | admin | Super Administrator | admin user |

    | packt_user1 | user1 | Developer |

    | packt_user2 | user2 | Developer |


    # Chapter 8


    Next, let us see how to access rules.


    Repository1 should be accessed only by packt_user1 and packt_user2. To do this,
    we need to set access rules with the help of the following steps:


    - Click on the Repositories.

    - On the left panel, we will get Access Rules as shown in following screenshot.


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_195_0.png)


    Click on Access Rules. As there are no rules set yet, all the users will be to
    read and write to all the repositories. It can be seen as follows:


    | Repository Access Rules |

    | --- |

    | [] |

    | * = rw |

    | Edit |


    To set the rule, click on the Edit button and add new rules as shown in the following
    screenshot to give read and write access to both users which we have created.


    | Repository Access Rules |

    | --- |

    | [Repository1::] |

    | packt_user1 = rw |

    | packt_user2 = rw |

    | Edit |


    Now we have successfully secured our repository so that only authenticated users
    will be able to access it.


    # Visual SVN server


    It''s time to create new users with the help of the following steps in Visual
    SVN.


    Get the setup Visual SVN from https://www.visualsvn.com/downloads/ and complete
    the setup with default settings.


    1. Let''s start the Windows-based VisualSVN server and explore its power to manage
    repositories.

    2. Start the VisualSVN server from the Start menu. We will get the following window:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_196_0.png)


    3. Now there are no repositories or users. We will now add them one by one. A
    new repository can be created in two ways:


    1. Right-click on the Repositories folder and select the Create Repository...


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_197_0.png)

    2. Click on **Create new repository** from the home page as shown:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_197_1.png)


    4. Select the default option to create FSFS repository and click on Next:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_198_0.png)

    5. Give the repository name visual_repo and click on Next as shown in the following
    screenshot:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_198_1.png)


    6. Select Empty repository and click on Next as shown:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_199_0.png)

    7. Select Custom permissions and click on the Custom button to set access rules
    if we have users. As there are no users, we cannot set access rules now, we will
    set access rules in the following steps. Select Subversion users have read and
    write access and click on Create:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_199_1.png)


    8. We will get a success page giving details like the name of the repository,
    the users who can access it, and the URL to be used to fetch the data as shown:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_200_0.png)

    9. Click on **Finish** to complete the process. We will use this URL to perform
    import of the repository or committing data to the repository.


    We can now find our repository by clicking on **Repositories** on the left panel:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_200_1.png)


    Now let us start creating users. A new user can be created in two ways:


    1. Right-click on the Users folder and select the Create User option:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_201_0.png)

    2. Click on Create new user from the home page as shown:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_201_1.png)

    3. Fill the details in the form and click on OK. Use the username svn_user1 and
    password svnpass1:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_202_0.png)

    4. In the same way, add one user having svn_user2 as the username and svnpass2
    as the password.

    5. On clicking Users in the left panel, we can get list of available users, as
    shown:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_202_1.png)


    Next we will add access rules for our repositories by performing the following
    steps:


    1. Right-click visual_repo and select the Properties option. Earlier, we created
    a repository without any access rules, all users can access that repository, hence
    we get the following screenshot:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_203_0.png)

    2. Select Everyone in the preceding screenshot and click on Remove. Now no one
    can access visual_repo.

    3. Click on Add to add the new users which we created. We will get the following
    screenshot:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_203_1.png)

    4. Select svn_user1 and click on OK.

    5. We will now get a properties dialog where svn_user1 got added. Here we can
    set permissions by selecting the radio buttons. We will keep Read / Write but
    if you want we can change it here.

    6. Add one more user, svn_user2, in the same way with read/write access. We will
    get a dialog as follows:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_204_0.png)

    7. Click on Apply and then OK to reflect the changes.


    # Adding SVN as a plugin to Eclipse


    Now, we can use Tortoisevn through the command line. We don''t have to remember
    all the commands to use versioning. As we are using Eclipse, we can use an SVN
    plugin for versioning from our eclipse IDE. Let''s integrate the SVN plugin as
    follows:


    1. Select Eclipse Marketplace from the Help menu.

    2. Type Subclipse in Find and click on Search.

    3. Once the search gets completed, we will get Subclipse at the top of the list.
    Click on the Install button next to it as:


    4. Select all the checkboxes to download the plugin as shown in the following
    screenshot:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_205_0.png)

    5. Click on Next.

    6. Select the Accept the terms and condition radio button.

    7. Click on Finish.

    8. A security warning will be shown; click on OK to proceed further.

    9. Once installation is complete, we will get a dialog to restart eclipse as follows:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_205_1.png)

    10. Click on Yes to restart.

