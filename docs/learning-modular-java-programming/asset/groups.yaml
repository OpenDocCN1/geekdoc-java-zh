- md: "\n| Module | Description |\n| --- | --- |\n| Core | This provides the Spring\
    \ Security library, which supports standalone applications, service layer, JDBC\
    \ user provisioning and remote clients. |\n| LDAP | This provides support for\
    \ authentication using Lightweight Directory Access. The org.springframework.security.ldap\
    \ package enables developers to use it. |\n| OpenID | This provides integration\
    \ with the OpenID standard. The org.springframework.security.openid package enables\
    \ developers to use it. |\n| Web | This provides filter-based Spring Security\
    \ support. The org.springframework.security.web package enables developers to\
    \ use it. |\n| Tag Library | Includes a set of JSP tags to provide security |\n\
    \nIt's not necessary to add all modules in your application; it all depends on\
    \ what facilities you want and how you want to provide security.\n\nAs we have\
    \ a web application, we need web, core, and configuration modules. If we decide\
    \ to go for handling security in JSP, then the Tag Library module needs to be\
    \ added. These modules will be provided by Spring security-core.jar, Spring-security-config.jar,\
    \ and Spring-security-web.jar.\n\n## Secure web request\n\nEverything in the Web\
    \ is going to be accessed through a URL which is handled by requests. The process\
    \ of securing web applications starts from making secure requests. In the application,\
    \ find all those URLs which need to be handled with some authority. The content\
    \ of these URLs will be available only if the user is authorized. Sometimes, we\
    \ need to provide data security through HTTPS, providing Secure Service Layer\
    \ (SSL). Whenever a user wants to access the data from the secure URL, he or she\
    \ needs to provide authentication credentials so that the application will be\
    \ able to recognize the user. If the user has the correct authentication and has\
    \ the right privilege, then the data will be given to the user, otherwise not.\n\
    \n## Way 1 – Spring Security for URL using servlet filters\n\nThe following diagram\
    \ illustrates the working of Spring Security using servlet filters:\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_169_0.png)\n\
    \nThe process can be described as follows:\n\n- When a request for a resource\
    \ is raised, it will first be compared to the URL mapped in web.xml for <filter-mapping>.\
    \ If a match is found, the request is delegated to the bean having the ID `springSecurityFilterChain`.\n\
    - This `springSecurityFilterChain` returns an instance of the `filterChainProxy`\
    \ bean, which consists of a list of security filters defined in the Spring context\
    \ to invoke, which provides security. The initialization of `filterChainProxy`\
    \ and its registration in a Spring context takes place when HttpSecurityBeanDefinitionParser\
    \ reads `<http> using spring the security namespace.\n- Let’s take the `filterChainProxy`\
    \ initialization a bit further. Let us assume we have written a very basic configuration\
    \ of `<http>` as:\n\n```xml\n<http>\n  <form-login>\n  <http-basic>\n  <logout>\n\
    ```\n\n## Securing the Application\n\nThe <http> sets up the FilterChainProxy\
    \ which is delegated to DelegatingFilterProxy which has been configured in the\
    \ web.xml. The default <http> block creates SecurityPersistenceFilter, ExceptionTranslationFilter\
    \ and filterSecurityInterceptor. The above configuration adds three filters as\
    \ BasicAuthenticationFilter, LogoutFilter, and UsernamePasswordAuthenticationFilter\
    \ in the filter chain. By default, FilterChainProxy initializes a series of filters\
    \ to be invoked. It can also be possible to choose the filters to be invoked in\
    \ FilterChain by defining our configuration as:\n\n```\n<bean id=\"FilterChainProxy\"\
    \ class=\"org.springframework.framework.security.web.FilterChainProxy\">\n  <filter-chain-map\
    \ path=\"/\" filters=\"none\"/>\n  <filter-chain-map path=\"/addContact.htm\"\
    \ filters=\"logoutFilter,formLoginFilter,exceptionTranslator,filterSecurityInterceptor\"\
    />\n</filter-chain-map>\n</bean>\n```\n\nWe configure DelegatingFilterProxy in\
    \ web.xml, which delegates to the filter implementation that has been defined\
    \ in the spring application context as taking advantage of Spring Dependency Injection.\
    \ Spring loads the configuration file, and if it gets <http auto-config=\"true\"\
    > it sets it up. This is done by registering the filter stack, protected URLs,\
    \ and FilterChainProxy with the name 'springSecurityFilterChain'. So the name\
    \ of this filter is used to look up the filter bean, which has the same ID in\
    \ the configuration file. Alternatively, we can do the configuration in another\
    \ way, as:\n\n```\n<bean id=\"springSecurityFilterChain\" class=\"org.springframework.framework.security.web.FilterChainProxy\"\
    >\n```\n\nSpring provides many filters which can be used for Spring Security,\
    \ which got woven by the filter chain. Let's have a look at some of the filters:\n\
    \n- LogoutFilter: This filter checks if the request is for /j_spring_security_logout\
    \ to provide a default logout handler. If it is not a logout request, it will\
    \ be passed to the next filter.\n- BasicAuthenticationFilter: This filter attempts\
    \ the process of basic login authentication, if a header for basic authentication\
    \ is found in the request.\n- DefaultLoginPageGeneratingFilter: If the request\
    \ for /spring_security_login is received, it will return a default login form,\
    \ otherwise the request will pass to the next filter.\n- UsernameAuthenticationFilter:\
    \ This filter checks for the request with URL /j_spring_security_check to read\
    \ values of j_username and j_password to perform authentication using AuthenticationManager.\n\
    \nIf we are using the default configuration, then the Spring framework loads the\
    \ following:\n\n- The authentication manager to be used, which defines all the\
    \ authentication providers.\n- The authentication provider has implementation\
    \ of UserDetailsService. Spring loads the user information to perform authentication.\n\
    \nThe authentication information can be stored in one of the two ways, as described:\n\
    \n- In application context: The login information, along with user role, can be\
    \ configured in the XML:\n```xml\n<authentication-manager id=\"authenticationmanager\"\
    >\n  <authentication-provider>\n    <user-service>\n      <user name=\"admin\"\
    \ password=\"admin\" authorities=\"ROLE_USER\"/>\n      <user name=\"guest\" password=\"\
    guest\" authorities=\"ROLE_USER\"/>\n    </user-service>\n  </authentication-provider>\n\
    </authentication-manager>\n```\n- In the database: If we want to check the login\
    \ data against the database, we need to provide the following configuration:\n\
    ```xml\n<authentication-manager id=\"authenticationmanager\">\n  <authentication-provider>\n\
    \    <jdbc-user-service data-source-ref=\"dataSource\">\n    </jdbc-user-service>\n\
    \  </authentication-provider>\n</authentication-manager>\n```\n\nThe dataSource\
    \ is another bean which is used to obtain the connection, as discussed in the\
    \ Spring-JDBC section:\n\n- The <http> configuration is checked to provide the\
    \ authentication mechanism. The authentication mechanism includes rendering of\
    \ the login page as follows:\n  - It checks the configuration for whether it is\
    \ basic authentication or form-based authentication. Depending upon the information,\
    \ a login page will be provided to the user where the credentials are entered.\n\
    \n- If we are using basic authentication, the login credentials are sent to the\
    \ server under the authentication http header. This now will be further handled\
    \ by BasicAuthenticationFilter.\n- If we are using form-based authentication,\
    \ the login credentials are checked against data provided by the spring context\
    \ to authenticate the user.\n\nIf the user gets authenticated with the help of\
    \ the authentication mechanism, then it's time to check the authorization:\n\n\
    - The filter does the authentication for the roles and credential with the help\
    \ of AuthenticationSuccessHandler. If all the information matches, the handler\
    \ takes the user to the success page, otherwise AuthenticationFailureHandler redirects\
    \ the request to the authentication page or the failure page respectively.\n\n\
    Let's use the following flow chart to understand security mechanism in an easy\
    \ way:\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_172_0.png)\n"
  mdcn: "\n\n| 模块 | 描述 |\n| --- | --- |\n| Core (核心) | 提供 Spring Security 库，支持独立应用程序、服务层、JDBC\
    \ 用户配置和远程客户端。 |\n| LDAP | 提供使用轻量级目录访问协议（LDAP）认证的支持。`org.springframework.security.ldap`\
    \ 包允许开发者使用它。 |\n| OpenID | 提供与 OpenID 标准的集成。`org.springframework.security.openid`\
    \ 包允许开发者使用它。 |\n| Web | 提供基于过滤器（filter）的 Spring Security 支持。`org.springframework.security.web`\
    \ 包允许开发者使用它。 |\n| Tag Library (标签库) | 包含一组 JSP 标签以提供安全功能。 |\n\n没有必要在你的应用程序中添加所有模块；这完全取决于你需要的功能以及你如何提供安全保护。\n\
    \n由于我们有一个 Web 应用程序，我们需要 web、core 和配置模块。如果我们决定在 JSP 中处理安全，则需要添加 Tag Library 模块。这些模块将由\
    \ `Spring security-core.jar`、`Spring-security-config.jar` 和 `Spring-security-web.jar`\
    \ 提供。\n\n## 安全 Web 请求\n\nWeb 中的所有内容都将通过 URL 访问，并由请求处理。保护 Web 应用程序从创建安全请求开始。在应用程序中，找到所有需要经过权限处理的\
    \ URL。只有当用户获得授权时，这些 URL 的内容才可用。有时，我们需要通过 HTTPS 提供数据安全，即提供安全服务层（SSL）。当用户想要从安全 URL\
    \ 访问数据时，他或她需要提供认证凭据，以便应用程序能够识别用户。如果用户具有正确的认证和相应的权限，则会将数据提供给用户，否则不会。\n\n## 方式 1\
    \ – 使用 servlet 过滤器通过 Spring Security 处理 URL\n\n下面的图说明了使用 servlet 器的 Spring Security\
    \ 工作原理：\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_169_0.png)\n\n该过程可以描述如下：\n\
    \n- 当产生资源请求时，它将首先与 `web.xml` 中 `<filter-mapping>` 映射的 URL 进行比较。如果找到匹配，请求将委托给 ID\
    \ 为 `springSecurityFilterChain` 的 bean。\n- 此 `springSecurityFilterChain` 返回 `filterChainProxy`\
    \ bean 的实例，该实例由 Spring 上下文中定义的安全过滤器列表组成，用于调用以提供安全性。`filterChainProxy` 的初始化及其在\
    \ Spring 上下文中注册发生在 `HttpSecurityBeanDefinitionParser` 读取使用 spring 的 security 命名空间的\
    \ `<http>` 标签时。\n- 让我们进一步了解 `filterChainProxy` 的初始化。假设我们写了一个非常基础的 `<http>` 配置：\n\
    \n```xml\n<http>\n  <form-login>\n  <http-basic>\n  <logout>\n```\n\n## 保护应用程序\n\
    \n`<http>` 设置了 `FilterChainProxy`，它被委托给在 `web.xml` 中配置的 `DelegatingFilterProxy`。默认的\
    \ `<http>` 块创建 `SecurityPersistenceFilter`、`ExceptionTranslationFilter` 和 `filterSecurityInterceptor`。上面的配置在过滤器链中添加了三个过滤器：`BasicAuthenticationFilter`、`LogoutFilter`\
    \ 和 `UsernamePasswordAuthenticationFilter`。默认情况下，`FilterChainProxy` 初始化一系列要调用的过滤器。也可以通过定义我们的配置来选择\
    \ `FilterChain` 中要调用的过滤器：\n\n```\n<bean id=\"FilterChainProxy\" class=\"org.springframework.framework.security.web.FilterChainProxy\"\
    >\n  <filter-chain-map path=\"/\" filters=\"none\"/>\n  <filter-chain-map path=\"\
    /addContact.htm\" filters=\"logoutFilter,formLoginFilter,exceptionTranslator,filterSecurityInterceptor\"\
    />\n</filter-chain-map>\n</bean>\n```\n\n我们在 `web.xml` 中配置了 `DelegatingFilterProxy`，它委托到在\
    \ spring 应用上下文中定义的过滤器实现，利用了 Spring 依赖注入。Spring 加载配置文件，如果获取到 `<http auto-config=\"\
    true\">`，它就会进行设置。这是通过注册过滤器栈、受保护的 URL 以及名为 'springSecurityFilterChain' 的 `FilterChainProxy`\
    \ 完成的。因此，该过滤器的名称被用于查找过滤器 bean，该 bean 在配置文件具有相同的 ID。或者，我们可以通过另一种方式进行配置，如：\n\n```\n\
    <bean id=\"springSecurityFilterChain\" class=\"org.springframework.framework.security.web.FilterChainProxy\"\
    >\n```\n\nSpring 提供了许多用于 Spring Security 的过滤器，这些过滤器通过过滤器链编织。让我们来看一些过滤器：\n\n- LogoutFilter:\
    \ 此过滤器检查请求是否为 `/j_spring_security_logout` 以提供默认的注销处理器。如果不是注销请求，它将传递给下一个过滤器。\n\
    - BasicAuthenticationFilter: 如果在请求中找到基础认证的标头，此过滤器将尝试基础登录认证过程。\n- DefaultLoginPageGeneratingFilter:\
    \ 如果接收到 `/spring_security_login` 的请求，它将返回默认登录表单，否则请求将传递给下一个过滤器。\n- UsernameAuthenticationFilter:\
    \ 此过滤器检查 URL 为 `/j_spring_security_check` 的请求，读取 `j_username` 和 `j_password` 的值以使用\
    \ `AuthenticationManager` 执行认证。\n\n如果我们使用默认配置，那么 Spring 框架将加载以下内容：\n\n- 将被使用的认证管理器（authentication\
    \ manager），它定义了所有的认证提供者。\n- 认证提供者具有 `UserDetailsService` 的实现。Spring 加载用户信息以执行认证。\n\
    \n认证信息可以通过上述的两种方式之一存储：\n\n- 在应用上下文中：登录信息以及用户角色可以配置在 XML 中：\n```xml\n<authentication-manager>\n\
    \  <authentication-provider>\n    <user-service>\n      <user name=\"admin\" password=\"\
    admin\" authorities=\"ROLE_USER\"/>\n      <user name=\"guest\" password=\"guest\"\
    \ authorities=\"ROLE_USER\"/>\n    </user-service>\n  </authentication-provider>\n\
    </authentication-manager>\n```\n- 在数据库中：如果我们想针对数据库检查登录数据，我们需要提供配置：\n```xml\n<authentication-manager>\n\
    \  <authentication-provider>\n    <jdbc-user-service data-source-ref=\"dataSource\"\
    >\n    </jdbc-user-service>\n  </authentication-provider>\n</authentication-manager>\n\
    ```\n\n`dataSource` 是另一个用于获取连接的 bean，如 Spring-JDBC 节中所述：\n\n- 检查 `<http>` 配置以提供认证机制。认证机制包括登录页的渲染：\n\
    \  - 它检查配置是基础认证还是表单认证。根据信息，将为用户提供一个登录页面，用户可以在其中输入凭据。\n\n"
