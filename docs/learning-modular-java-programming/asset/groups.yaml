    Consistency: Before and after completing the transaction, the state of all the
    tables will be consistent. If any error occurs, the state of every table may vary.
    This leads to variable states of the tables. In order to maintain the states of
    all the tables as unique, whatever data has changed has been returned to the original
    state.


    Isolation: It may be possible that in each application there are occurrences of
    multiple transactions that involve read, write, or update operations. So the transaction
    which is in progress may be separated from the one which is committed.


    Durability: The data we try to write or update in the table may fail partially.
    This leads to incorrect states of the tables. Durability makes sure that whenever
    any operation fails, the data will be available in the correct state.


    # JDBC and transaction management


    In JDBC, transactions are automatically committed. In order to implement transactions
    in JDBC, we need to add the following steps:


    - 1. We need to invoke `setAutoCommit(false)` on a connection object.

    - 2. Whenever all the operations on the database complete, invoke `commit()`.

    - 3. If any error occurs, invoke `rollback()` to get back to the original state
    of the table.


    # Spring and transaction management


    Spring provides a transaction management API which aims to provide an alternative
    to EJB transaction management. Spring provides support for both declarative as
    programmatic transaction management. Spring has the following two types of transaction:


    - Local transactions: Local transactions are useful when resources are managed
    at a single point which involves a local transaction manager. JDBC is one such
    example which handles local transaction which is easy to use and manage. Local
    transactions cannot handle multiple transaction resources.

    - Global transactions: Global transactions are useful in distributed systems where
    resources are distributed at multiple locations with the help of application servers
    through `Java Transaction API (JTA)`. In order to manage global transactions,
    JNDI is configured in the server which is used by the developer.


    Spring is not managing the transaction management directly, but it gives flexibility
    to choose transaction management implementation according to the platform. Some
    of the transaction managers are as shown in the following diagram:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_129_0.png)


    Let''s now discover how to integrate TransactionManager in our application. As
    we are dealing with JDBC in JdbcTemplate, we will configure the DataSourceTransactionManager
    which provides good support. Also, we need to know the different ways that are
    available to manage transactions. The following two ways are used to manage transactions:


    - Programmatic transactions

    - Declarative transactions


    # Programmatic transaction


    In programmatic transaction, the developer manages the transaction through coding.
    The use of programmatic transaction provides fine control and flexibility to manage
    operations as the operation is under the control of the developer. Developers
    can decide the rules of managing the transaction and are able to decide the boundaries
    of where to start and where to complete the transaction.


    # Declarative transaction


    Contrary to programmatic transaction, the developer will not code a lot in source
    code but it will be configured in the XML file. It gives convenience but less
    precise control. Let''s discuss it in depth.


    # Managing declarative transaction in Spring


    Transaction management is one of the very famous cross-cutting technologies. Spring
    provides Aspect Oriented Programming (AOP) to manage cross-cutting technologies.
    AOP is used for managing declarative transactions as well.


    The transaction is centered around advice which gets called before as well as
    after the annotated business logic with the help of the implemented class TransactionInterceptor.
    The before aspect decides the scope of the database transaction, such as keeping
    the ongoing transaction or creating a new transaction. The after aspect decides
    to commit or rollback the transaction.


    The transaction manager needs to start a new one or keep an ongoing transaction
    continued at the time of transaction before advice. This decision is taken with
    the help of the propagation attribute. Whenever any business logic method is called
    by the developer the method of the proxy object gets called.


    Let''s discuss how to develop transaction management step-by-step.


    # Step 1


    Decide the transaction attributes:


    - **Propagation behavior:** Propagation behavior gives an idea of what to do with
    the transaction when one method call gets propagated. It tells whether to start
    a new transaction for the called method by suspending what is available, pass
    on the same transaction further, and to support or not to support the transaction.


    The following table lists propagation behaviors and their meaning:


    | Propagation behavior | Meaning |

    |---|--|

    | PROPAGATION_MANDATORY | Indicates that the method must run within a transaction.
    If no existing transaction is in progress, an exception will be thrown. |

    | PROPAGATION_NESTED | Indicates that the method should be run within a nested
    transaction if an existing transaction is in progress. |

    | PROPAGATION_NEVER | Indicates that the current method shouldn''t run within
    a transactional context. If an existing transaction is in progress, exception
    will be thrown. |

    | PROPAGATION_NOT_SUPPORTED | Indicates that the method shouldn''t run within
    a transaction. If an existing transaction is in progress, it''ll be suspended
    for the duration of the method. |


    # Chapter 5


    | Propagation behavior | Meaning |

    |---|---|

    | PROPAGATION_REQUIRED | Indicates that the current method must run within a transaction.
    If an existing transaction is in progress, the method will run within that transaction.
    |

    | PROPAGATION_REQUIRES_NEW | Indicates that the current method must run within
    its own transaction. |

    | PROPAGATION_SUPPORTS | Indicates that the current method doesn''t require a
    transactional context, but may run within a transaction if one is already in progress.
    |


    - **Isolation level**: It''s possible that at any time, many transactions are
    started by the application as it supports concurrency. The isolation level defines
    the effect of one transaction on another:

    - **Dirty reads**: It''s possible that at any time, many transactions are started
    by the application as it supports concurrency. It allows to read changes that
    haven''t yet committed.

    - **Phantom reads**: Suppose the first user reads data and the second user inserts
    rows.

    - **Non-repeatable reads**: In this scenario, multiple reads of the same field
    will yield different results unless changed by the transaction itself.


    # Developing the Business Layer


    The possible isolations are as follows:


    | Isolation level | Meaning |

    |---|---|

    | ISOLATION_DEFAULT | Uses the default isolation level of the datastore. |

    | ISOLATION_READ_UNCOMMITTED | Allows to read changes that haven''t yet committed.
    May result in dirty reads, phantom reads, and non-repeatable reads. |

    | ISOLATION_READ_COMMITTED | Allows reads from concurrent transactions that have
    been committed. Dirty reads are prevented, and phantom and non-repeatable reads
    may still occur. |

    | ISOLATION_REPEATABLE_READ | Multiple reads of the same field will yield the
    same results, unless changed by the transaction itself. Dirty reads and non-repeatable
    reads are prevented, but phantom reads may still occur. |

    | ISOLATION_SERIALIZABLE | This fully ACID-compliant isolation level ensures that
    dirty reads, non-repeatable reads, and phantom reads are all prevented. This is
    the lowest of isolation levels because it''s typically accomplished by doing full
    locks on the tables involved in the transaction. |


    - **Read-only**: Sometimes the developers are interested in reading the underlying
    data they want to avoid modification of the data. To apply a read-only attribute,
    the propagation should be one of the following: PROPAGATION_REQUIRED, PROPAGATION_NESTED,
    or PROPAGATION_REQUIRES_NEW.

    - **Transaction timeout**: Some transactions take more time to complete, which
    hampers performance. In such situations, instead of waiting for a long time, it''s
    better to terminate it. A transaction timeout attribute helps terminate time-consuming
    transactions automatically after a certain time. To apply a timeout attribute,
    the propagation should be one of the following: PROPAGATION_REQUIRED, PROPAGATION_NESTED,
    or PROPAGATION_REQUIRES_NEW.

