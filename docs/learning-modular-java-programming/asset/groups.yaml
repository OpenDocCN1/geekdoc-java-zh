    # N-tier applications


    With the increase in the use of the Internet, it''s very important for an application
    to be capable of serving many requests at the same time. This puts a burden on
    the server. In terms of performance, it''s a better solution to take away the
    presentation layer from the business logic and deploy it separately. It can be
    deployed on one dedicated web server or may be on different servers. In the same
    way, the business logic and database layers can be separated on different servers
    partially or completely residing in one or more machines.


    The client tier, presentation tier, business tier, and database tier are separated
    on separate machines. They interact with each other through a network and perform
    their services. This will be called an N-tier application.


    ## N-Tier Architecture


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_25_1.png)


    Now, these tiers which consist of layers will be used to create an enterprise
    application. But just by making parts of application, we cannot be sure of having
    a complete solution. Each application has its own challenges, but if we observe
    they will find that numerous functionalities are common, irrespective of their
    problem statement. That means instead of a team of architect designers fighting
    for the solution to their problem every time, it will be good to have an answer
    which is a generic solution for reference. These references will be used to build
    applications called design patterns.


    Christopher Alexander says,  "Each pattern describes a problem which occurs over
    and over in our environment, then describes the core of the solutions to that
    problem, in such a way that you can use this solution million times over without
    ever doing the same twice."


    Each pattern provides a solution to a sort of problem and gives a result quickly.
    Let''s have a quick overview of design patterns. The design patterns are normally
    classified as creational, structural, and behavioral patterns, which are subclassified
    as shown in the following table:


    | Creational design patterns | Structural design patterns | Behavioral design
    patterns |

    |---|---|---|

    | Singleton pattern | Adapter pattern | Observer pattern |

    | Factory pattern | Composite pattern | Interpreter pattern |

    | Builder pattern | Facade pattern | Chain of responsibility pattern |

    | Prototype pattern | Decorator pattern | Mediator pattern |


    Frameworks as Struts and Spring have been built upon these design patterns. Struts
    uses the front controller design pattern and Spring uses the MVC design pattern
    for ease of development. The use of frameworks has made the developer''s life
    easy.


    # Java Enterprise architecture


    High performance, faster processing, and good luck and feel the keys to success
    for enterprise applications. Due to dedicated servers, the tasks of designing,
    developing, and data storing will be leveraged to handle specialized tasks, as
    discussed above in the N-tier applications section. In spite of providing just
    basic things, the N-tier enterprise application needs a bit more. Let''s have
    a look into what an enterprise application may need.


    It''s festive season. The bank has consecutive holidays. I need to withdraw some
    amount from the ATM, for example, x. I enter the password and all other required
    details. Now I am just waiting for the money. I get a message of withdrawal on
