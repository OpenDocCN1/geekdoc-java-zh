    public List<Gender>addGenders() {\n    List<Gender> genders = new ArrayList<Gender>();\n\
    \    Gender genderF = newGender();\n    genderF.setId(1);\n    genderF.setValue(\"\
    Female\");\n\n    Gender genderM = newGender();\n    genderM.setId(1);\n    genderM.setValue(\"\
    Male\");\n\n    genders.add(genderF);\n    genders.add(genderM);\n    return genders;\n\
    }\n```\n\n我们需要在 `com.packt.ch03.POJO` 中声明 `Gender` 为类，并包含 `ID` 和 `value` 成员。\n\
