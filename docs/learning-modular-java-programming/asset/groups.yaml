    Today we have Java EE 8 on the market.'
  - '[PAGE 37]


    # Features of the Java EE platform


    The following are the various features of the Java EE platform:


    +   * **Platform independence**: Different types of information which the user
    needs in day-to-day life is spread all over the network on a wide range of platforms.
    Java EE is well adapted to support, and use this widely spread multiple format
    information on different platforms easily.

    * **Modularity**: The development of enterprise applications is complex and needs
    to be organized. The complexity of the application can be reduced by dividing
    it into different, small modules which perform individual tasks, which allows
    for easy maintenance and testing. They can be organized in separate layers or
    tiers. These modules interact with each other to perform a business logic.

    * **Reusability**: Enterprise applications need frequent updates to match up client
    requirements. Inheritance, the fundamental aspect of an object-oriented approach,
    offers reusability of the components with the help of functions. Java EE offers
    modularity which can be used individually whenever required.

    * **Scalability**: To meet the demands of the growing market, the enterprise application
    should keep on providing new functionalities to the users. In order to provide
    these new functionalities, the developers have to change the application. They
    may add new modules or make changes in already existing ones. Java EE offers well-managed
    modules which make scalability easy.


    The technologies used in Java EE are as follows:


    +   * Java servlet

    * Java Server Pages

    * Enterprise Java Bean

    * Java Messaging API

    * XML

    * Java Transaction API

    * Java Mail

    * Web Services'
  - '[PAGE 38]


    # The world of dotcoms


    In the 1990s, many people started using computers for a number of reasons. For
    personal use, it was really good. When it came to enterprise use, it was helpful
    to speed up the work. But one main drawback was; how to share files, data or information!
    The computers were in a network but if someone wanted to access the data from
    any computer then they had to access it personally. Sometimes, they had to learn
    the programs on that computer, which is not very time-consuming but also aending.


    What if we used the existing network to share the data remotely?? It was a thought
    put forward by a British computer scientist, Sir Tim Berners-Lee. He thought of
    a way to share the data through the network by exploring an emerging technology
    called hypertext. In October 1990, Tim wrote three technologies to fulfil using
    Hyper Text Markup Language (HTML), Uniform Resource Identifier (URI), and Hyper
    Text Transfer Protocol (HTTP):


    +   - HTML is a computer language that is used in website creation. Hypertext
    facilitates clicking on a link to navigate on the Internet. Markups are HTML tags
    defining what the text they contain.

    - URIs define a resource by location or name of resource, or both. URIs generally
    refer to a text document or images.

    - HTTP is the set of rules for transferring the files on the Web. HTTP runs on
    the top of TCP/IP.


    He also wrote the first web browser (World Wide Webapp) and the first web server
    (HTTP). The web server is where the application is hosted. This opened the doors
    to the new amazing technologies have been added to make the Web more realistic.
    This was just the beginning and many more technologies have added to the dotcom.
    Using HTTP and HTML, people were able to browse files and get content from remote
    servers. A little bit of user interaction or dynamicity was only possible through
    JavaScript. People were using the Web but not satisfied; they needed something
    more. Something which was able to generate output in a totally dynamic way, displaying
    the data which had been obtained from the data store. Something which can manipulate
    user input and display the results on the browser.


    Java developed one technology: Common Gateway Interface (CGI). As CGI was a small
    Java program, it was capable of manipulating the data at the server side and producing
    the result. When any user made a request, the server forward the edit to CGI,
    which was an external program. We got an output but with two drawbacks:


    +   - Each time the CGI was called, a new process was created. As we were thinking
    of a huge number of hits to the server, the CGI became a performance hazard.'
  - '[PAGE 39]


    +   - Being an external script, CGI was not capable of taking advantage of

    server abilities.


    To add dynamic content which can overcome the above drawbacks and replace

    CGI, the servlet was developed by Sun in June 1997.


    # # Servlet – the dynamicity


    Servlets are Java programs that generate dynamic output which will be displayed

    in the browser and hosted on the server. These servers are normally called servlet

    containers or web servers. These servers are responsible for managing the

    lifecycle of the servlets and can take advantage of the capabilities of servers.

    A single instance of a servlet handles multiple requests through multithreading.

    This enhances the performance of the application. Let''s discuss servlets in

    understand them better.


    The servlet is capable of handling the request (input) from the server and generates
    the

    response (output) in HTML dynamically. To create a servlet, we have to write a
    class

    which will be from GenericServlet or HttpServlet. These classes have

    service() as a method, to handle request and respond. The server manages the

    lifecycle of the servlet as follows:


    +   1. The servlet will be loaded on arrival of a request by the servers.

    2. The instance will be created.

    3. The init() will be invoked to do the initialization.

    4. The preceding steps will be performed only once in the lifecycle of the

    servlet unless the servlet has not been destroyed.

    5. After initialization, the thread will be created separately for each request

    by the server, and request and response objects will be passed to the

    servlet thread.

    6. The server will call the service() function.

    7. The service() function will generate a dynamic page and bind to the

    HttpServlet object.

    8. Once the response is sent back to the user, the thread will be deallocated.


    From the preceding steps, it is pretty clear that the servlet is responsible for:


    +   - Reading the user input

    - Manipulating the received input

    - Generating the response'
