    # Spring-JDBC integration


    In the previous code, we managed the connection, the JDBC query and obtained the
    results. Spring gives us the flexibility to manage these things by the framework.
    We will move ahead step by step in order to understand the integration completely.


    In databases, in every task the developer always needs to obtain the database
    connection. Spring acquires this connection through the Spring DataSource. DataSource
    is part of the Spring JDBC specification. This means that the developer is not
    involved in the details of how to obtain the Connection. The complete responsibility
    of getting and maintaining objects will be taken care of by the Spring framework.'
