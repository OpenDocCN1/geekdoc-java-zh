    In this way, we can deploy a WAR of any project which we have created in the Tomcat
    environment.


    # Summary


    In this chapter, we discussed how to configure a Collabnet server and a Visual
    SVN server. We covered the creation of users and repositories in both the servers.
    We also set the access rules to the repositories. We learned the integration of
    the Subclipse plugin in Eclipse to versioning of projects from IDE. In easy steps,
    we discovered the process of collaborating on the project with team members, with
    the help of commit and update commands. We also covered the process of getting
    a new project in our workspace from the repository to work. Deployment is one
    of the very important steps in application development. We covered deployment
    of applications and without Tomcat Manager. With this, now you are set to get
    on with your own application development.


    We started the journey by taking a simple application and develop it step-by-step.
    We practically discovered the ways to develop modular programming using SpringMVC.
    We developed a contact management application layer by layer to make it easy to
    understand and develop thoroughly. Developing an application which contains no
    flaws in business logic is possible if we carry out testing and integration testing.
    Insecure applications will not withstand the market so we make sure our application
    is secure by using integration with Spring Security. The messy work of handling
    teamwork has been made easy with the help of versioning. Once the application
    was ready, we performed the deployment of the application on the server, which
    was our last stop. I have tried to make this journey as smooth as possible. Hope
    you enjoyed it and will explore it further.'
