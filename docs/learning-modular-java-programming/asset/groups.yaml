    org.springframework.framework.context.support.\nReloadableResourceMessagesSource\"\
    >\n  <property name=\"basename\" value=\"WEB-INF/validations\"/>\n</bean>\n```\n\
    \n属性基本名称的值为 `/WEB-INF/`，其中 `/WEB-INF` 是属性文件所在的位置，其基本名称为 `validations`。\n\n- 3.\
