    | 1 | hasRole(role) | 检查作为参数传递 old的角色，如果当前主体（principal）具有指定的角色，则返回 true |\n| 2\
    \ | hasAnyRole([role1,role2]) | 该方法检查以逗号分隔的参数传递的任意角色，如果当前主体拥有其中任何一个，则返回 true |\n\
    | 3 | Principal | 允许直接访问代表当前用户的主体对象 |\n| 4 | permitAll | 始终求值为为真，因为它允许所有用户 |\n\
    | 5 | denyAll | 始终求值为假，且不允许任何人访问 |\n| 6 | isRememberMe() | 如果当前主体是“记住我”用户，则方法返回\
    \ true |\n| 7 | isAuthenticated() | 如果用户是匿名用户，则方法返回 true |\n| 8 | isFullyAuthenticated()\
    \ | 如果用户不是匿名用户或“记住我”用户，则返回 true |\n\n## 保护应用程序\n\n@PostAuthorized: 此注解涉及决策，取决于受保护方法返回的对象：\n\
    `@PostAuthorized(\"return Object.contact.email==principal.email\")`\n```java\n\
    public Contact getContent(String email)\n{\n//some code here\n}\n```\n\n上述配置允许主体邮箱与函数返回的\
    \ contact 对象相匹配的用户访问。与 @PreAuthorized 注解相反，@PostAuthorized 中方法会先被调用。因此，如果授权失败，方法不应产生副作用。\n\
    \n- PostFilter: 在某些情况下，开发者不想保护方法，而是想保护从方法返回的数据。\n\n让我们在 JdbcTemplate 中实现方法级安全（我们在第\
    \ 1 和 2 部分为基于 URL 的安全开发了它）：\n\n- 在 `spring-security.xml` 文件中使用表达式为方法级安全添加配置，如下：\n\
    `<security:global-method-security secured-annotations=\"enabled\"/>`\n\n- 默认情况下，开发者配置一个接受角色名的访问属性，可以通过正确的身份验证访问\
    \ URL。但如果开发者想使用表达式作为某些角色的用户（例如 `hasRole('ROLE_ADMIN')`）或 IP 地址（例如 `hasIpAddress('123.123.1.1')`），则需要在\
    \ `<http>` 中使用 `use-expressions=\"true\"`。我们已经看到了可以用于配置的表达式：\n\n- 让我们为资源配置访问：\n\
    - 通过配置 `access=\"permitAll\"` 允许所有用户访问主页\n- 允许拥有 ROLE_ADMIN 角色的用户访问 `showForm.html`\n\
    \n要完成上述配置，我们需要更新 `<http>` 配置，如下：\n```xml\n<security:http auto-config=\"true\"\
    \ use-expressions=\"true\">\n<security:intercept-url pattern=\"/index.jsp\" access=\"\
    permitAll\"/>\n<security:form-login login-processing-url=\"/j_spring_security_check\"\
    \nlogin-page=\"/login.jsp\" default-target-url=\"/index.jsp\"/>\n```\n\n## 第7章\n\
    \n```xml\nauthentication-failure=\"url/login.jsp?error=error\"\n<security:remember-me\
    \ key=\"contactdata\"\ntoken-validity-seconds=\"2419200\"\n</security:http>\n\
    ```\n\n- 4. 在 `showContactForm()` 方法上使用 `@Secured(hasRole('ROLE_ADMIN'))` 或 `@Secured(\"\
    ROLE_ADMIN\")`，因为我们没有授予访问权限。这将允许拥有 ROLE_ADMIN 权限的用户访问该功能。\n代码如下：\n```java\n@Secured(\"\
    ROLE_ADMIN\")\n@RequestMapping(\"/showForm.htm\")\npublic ModelAndView showContactForm(HttpServletRequest\
    \ request,\nHttpServletResponse response, ModelMap map) throws Exception\n{\n\
    Contact contact = new Contact();\nmap.addAttribute(contact);\nreturn new ModelAndView(\"\
    contactForm\");\n}\n```\n\n- 5. 我们需要添加 `aspect.jar` 文件，因为方法安全内部使用了 Spring-AOP。你可以从\
    \ java2s.com 或 mvnrepository.com 下载它。\n\n- 6. 部署应用并输入凭据以检查应用的运行情况。\n\n## 使用切入点（pointcut）使用\
    \ Spring Security\n\n有时在应用程序中，多个方法需要被保护。一个一个地对方法设置限制不是良好实践。在这种情况下，可以使用切入点应用授权。使用切入点\
    \ `<protect-pointcut>` 如下：\n\n```xml\n<global-method-security>\n<protect-pointcut\
    \ access=\"ROLE_ADMIN\" expression=\"<execution(* com.pack.ch07*.showContactForm(*))\
    \ />\"/>\n</global-method-security>\n```\n\n上述配置将 `showContactForm` 的访问限制在具有 ADMIN\
    \ 角色的用户。\n\n## 方法 3 – 自定义安全\n\nSpring Boot 提供了各种可能的安全方法论，但在某些情况下，我们需要提供自定义方式来扩展\
    \ Spring API。扩展 Spring API 的方法之一是编写自定义身份验证。\n\n## 总结\n\n安全是任何应用程序非常重要的部分。在本章中，我们学习了如何使用注解实现方法级安全。我们还学习了如何使用切入点同时保护多个方法。最后，我们探索了如何实现自定义安全。\n\
    \n## 版本\n\n## 部署\n\n首先，我们需要安装 Tortoisesvn。执行以下步骤：\n\n- 从 https://tortoisesvn.net/downloads\
    \ 下载适用于你平台的 Tortoisesvn 安装包。\n- 在安装之前，配置 `JAVA_HOME` 和 `Path` 变量。\n- 点击 **Run**\
    \ 按钮开始安装。\n- 出现欢迎界面；点击 **Next** 继续。\n- 然后，接受许可协议。\n- 在下一页，取消选择要安装的组件（自定义设置）。选择好安装的组件后，点击\
    \ **Next**。\n- 点击 **Install**。\n- 点击 **Finish** 完成设置。\n\n现在是时候安装用于维护仓库、用户的服务器了。\n\
    \n## Collabnet 服务器\n\n我们将安装 Collabnet 和 Visual SVN 作为两个不同的服务器来实现此目的。让我们从 Collabnet\
    \ Subversion 开始。安装包位于 http://www.collab.net/downloads/subversion。下载完成后，保持所有默认设置安装。\n\
    \n"
