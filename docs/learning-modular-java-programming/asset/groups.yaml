    # Centralized versioning


    In centralized versioning systems, a copy of the application will be kept on a
    centralized server from where developers will take the file or commit their changes
    to the server. Examples include Concurrent Versioning System (CVS) and Subversion.


    # CVS


    CVS is a very old tool which was created in the Unix operating system in the 1980s.
    It was very famous among the developers of Linux and other Unix-based systems;
    cvs uses a central repository of files to record the changes done in any file
    by the developer in separator directory. If the developer wants his changes made
    available to other developers, he will commit the code to the repository. Now,
    along with the previous version, the new version also be recorded.


    Though maintaining the main flow of development has things easy but the branching
    is not. Sometimes the developers can do parallel development of the products with
    unique features which they can combine. This process is called branching.


    When we rename a file due to some reason or even the location of the file changes,
    it is supposed to be tracked by the SCM (supply chain management) but CVS cannot
    update the version in these cases, which is not good.


    CVS supports a first come, first served basis, so it''s quite possible that some
    changes will not be reflected or conflicted.


    # Apache Subversion


    Apache Subversion was developed to provide an alternative to CVS. The aim was
    to fix the bugs in CVS to maintain high compatibility. It''s an open source, where
    either all the changes will be made or none of them. This feature helps the developers
    to get the correct, latest revision of the file from the repository. Branching
    is well supported in SVN.


    The best thing about SVN is that a wide range of plugins has been developed, which
    can be integrated with numerous IDEs to support SVN. The problem of keeping a
    history of renamed or relocated files has been removed in SVN.


    Along with these good things, there are some problems. The biggest problem is
    what if the SVN server is down? No one will have access and then versioning is
    not possible. One more issue is about the speed associated with SVN.'
