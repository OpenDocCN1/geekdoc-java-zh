    # # N-tier applications


    With the increase in the use of the Internet, it''s very important for an application
    to be capable of serving many requests at the same time. This puts a burden on
    the server. In terms of performance, it''s a better solution to take away the
    presentation layer from the business logic and deploy it separately. It can be
    deployed on one dedicated web server or may be on different servers. In the same
    way, the business logic and database layers can be separated on different servers
    partially or completely residing in one or more machines.


    The client tier, presentation tier, business tier, and database tier are separated
    on separate machines. They interact with each other through a network and perform
    their services. This will be called an N-tier application.


    # ## N-Tier Architecture


