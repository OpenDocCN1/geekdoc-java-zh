- md: "\n# Table of Contents\n\n- Case 4 – Remember me 165\n- Case 5 – Logout 167\n\
    - Way 2 – Spring Security using AOP 168\n- @Secured 168\n- @RolesAllowed 168\n\
    - SpEL-enabled security annotations for securing the methods 169\n- Spring Security\
    \ using pointcut 171\n- Way 3 – Custom security 172\n\n# Summary 172\n\n# Chapter\
    \ 8: Versioning and Deploying 173\n\n- Versioning 173\n- Collabnet server 174\n\
    - Visual SVN server 180\n- Adding SVN as a plugin to Eclipse 188\n- Adding files\
    \ in the project and committing them to the repository 193\n- Importing the project\
    \ in the workspace 194\n- Updating and tracking the project for latest changes\
    \ in the repository 196\n\n# Project deployment 198\n\n- Copying a WAR file into\
    \ Tomcat without Tomcat manager 198\n- Copying a WAR file into Tomcat with Tomcat\
    \ manager 201\n\n# Summary 203\n\n# Index 205\n\n# Preface\n\nWelcome to the world\
    \ of Java EE development! A huge world, with a large number of things to learn\
    \ and so many skills to adapt. It's actually difficult to decide what to start\
    \ with. When I started, I faced a similar problem. Now, also when I am in training\
    \ sessions or seminars, I find many people who want to be professional developers,\
    \ but don't have much exposure to the processes, stages, and thinking involved\
    \ in application development. This book helps you by providing a path for web\
    \ development that can be used to understand the process of Java modular development\
    \ through an easy-to-understand case study. Nowadays, in Java EE, there are many\
    \ technologies in the market. One such technology is Spring.\n\nSpring is useful\
    \ for developing independent Java modules that can then be combined to create\
    \ a complete application. We have used Spring, Spring MVC, and many of its features\
    \ throughout the book, while discussing the concepts of database, unit testing,\
    \ security, and many other topics.\n\n# What this book covers\n\nChapter 1, Introducing\
    \ Modular Programming, starts with a discussion about Enterprise application,\
    \ its architecture, and its development. Enterprise application development is\
    \ a team that faces many problems concerning collaboration between members. We\
    \ will introduce coordinated development and the tools involved in this chapter.\n\
    \nChapter 2, Saying Hello to Java EE, involves a short warm up by discussing and\
    \ developing a Java application using Servlet-JSP. We will develop the application\
    \ using a Spring to get startup gear as Spring MVC developer.\n\nChapter 3, Implementing\
    \ the Presentation Layer, discusses the points that need to be taken of when developing\
    \ the most important layer of an application: the presentation layer. We will\
    \ discuss how to develop the pages to incorporate data binding for business logic,\
    \ as well as for presentation, using Spring MVC features.\n\nChapter 4, Talking\
    \ to the Database, discusses Spring JDBC connectivity. Data collected from the\
    \ user and data to be used in the business logic need to be persisted. We will\
    \ cover Spring DAO support persist. We will then move on a step and introduce\
    \ Hibernate, the ORM technology, and its integration with Spring. We will also\
    \ cover unit testing to make sure our code is working fine.\n\nChapter 5, Developing\
    \ the Business Layer, discusses the development of the most important layer of\
    \ an application — the business layer —and the communication between the layers.\
    \ An application needs to be developed by following a number of rules.\n\nChapter\
    \ 6, Testing Your Application, explains that the modules developed by the developer\
    \ should produce the correct result. To ensure the correctness of the code in\
    \ this chapter, we will cover the basics of testing with the help of the V module.\
    \ We will also cover integration testing with JUnit and Mockito.\n\nChapter 7,\
    \ Securing the Application, discusses how and to secure the application. In an\
    \ application, there are modules that are open and available to all, and some\
    \ that are restricted. We will apply the Spring security module to secure the\
    \ Spring MVC application with the help of basic and form security.\n\nChapter\
    \ 8, Versioning and Deploying, shows how to collaborate on the application, which\
    \ has been developed in parts, or by different members simultaneously. In this\
    \ chapter, we will set up and integrate Tortoise SVN as a versioning tool used\
    \ to collaborate on the code. We will also discuss the creation of repositories,\
    \ users, and setting access rules for Callbuat and Visual SVN servers.\n\n# What\
    \ you need for this book\n\nYou will need to have sound knowledge and practical\
    \ exposure of core Java to understand this book. Along with this, knowledge of\
    \ basic JDBC and the concepts of object-oriented programming language is required.\
    \ As we are using Eclipse IDE throughout the book, you should be familiar with\
    \ it. Those who have an introductory knowledge of Spring beginner framework can\
    \ refer to this book easily. If you are beginner for Spring, we suggest you first\
    \ go through the basic concepts of Spring configuration and get some practical\
    \ experience. A basic knowledge of Hibernate and JUnit will be an added advantage.\n\
    \n# Who this book is for\n\nThe idea for this book is to give the reader experience\
    \ of creating an application step by step using Java modular programming step\
    \ by step. The book is useful for any novice developer who wants to get exposure\
    \ of modular Java development. The book is also useful for anyone who wants to\
    \ have a roadmap for developing an application in stages as problem statement,\
    \ UI development, business logic development, database layer development, and\
    \ so on. The book covers all the aspects of application development required to\
    \ turn a problem statement to product, with coverage of security, maintaining\
    \ versions, and the deployment process.\n\n# Conventions\n\nIn this book, you\
    \ will find a number of text styles that distinguish different kinds of information.\
    \ Here are some examples of these styles and an explanation of their meaning.\
    \ Code words in text, database names, filenames, file extensions, user input,\
    \ and Twitter handles are shown as follows: \"Every object created based on this\
    \ type will inherit these properties such as:\"\n\nA block of code is set as follows:\n\
    \n```\nfunction doAddition(num1, num2) {\n  return num1 + num2;\n}\nfunction doSubtraction(num1,\
    \ num2) {\n  var result = null;\n  if (num1 > num2) {\n    result = num1 - num2;\n\
    \  }\n  else {\n    result = num2 - num1;\n  }\n}\n```\n\n> Warnings or important\
    \ notes appear in a box like this.\n\n> Tips and tricks appear like this.\n\n\
    # Reader feedback\n\nFeedback from our readers is always welcome. Let us know\
    \ what you think about this book — what you liked or disliked. Reader feedback\
    \ is important for us as we develop titles that you will really get the most of.\n\
    \nTo send general feedback, simply e-mail feedback@packpub.com, and mention the\
    \ book's title in the subject of your message.\n\nIf there is a topic that you\
    \ have expertise in and you are interested in either writing or contributing to\
    \ a book, see our author guide at www.packpub.com/authors.\n\n# Customer support\n\
    \nNow that you are the proud owner of a Packt book, we have a number of things\
    \ to help you to get the most from your purchase.\n\n# Downloading the example\
    \ code\n\nYou can download the code files for this book from your account at http://www.packpub.com.\
    \ If you purchased this book elsewhere, you can visit http://www.packpub.com/support\
    \ and register to have the files e-mailed to you.\n\nYou can download the code\
    \ files by following these steps:\n\n1. Log in or register to our website using\
    \ your e-mail address and password.\n2. Hover the mouse pointer on the SUPPORT\
    \ tab at the top.\n3. Click on Code Downloads & Errata.\n4. Enter the name of\
    \ the book in the Search box.\n5. Select the book for which you're looking to\
    \ download the code files.\n6. Choose from the drop-down menu where you purchased\
    \ this book from.\n7. Click on Code Download.\n\nYou can also download the code\
    \ files by clicking on the Code Files button on the book's webpage at the Packt\
    \ Publishing website. This page can be accessed by entering the book's name in\
    \ the Search box. Please note that you need to be logged in to your Packt account.\n\
    ```\n"
