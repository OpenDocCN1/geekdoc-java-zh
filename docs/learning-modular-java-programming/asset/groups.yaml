- md: "\n# Versioning and Deploying\n\nWe have successfully installed the plugin.\
    \ We can check it by navigating to Windows | Show View | other | Type svn. We\
    \ should get the following screen:\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_206_0.png)\n\
    \nNow we are set to start with versioning using eclipse. Collabnet and then with\
    \ Visual SVN. To start with, we need to create two workspaces, svn_tut and svn_tut1,\
    \ respectively. Either we can get the project from the repository or if it's a\
    \ new project, we can create a directory structure of it and commit it to the\
    \ repository. In our group, no projects are available; so packt_user1 will create\
    \ a new project and store it in the central repository so that others can access\
    \ it from his her group. Follow the steps to complete the task:\n\n1. Launch eclipse\
    \ and the workspace svn_tut.\n2. Create a new dynamic web project SVNDemol.\n\
    3. Right-click on it and select the option Team | Share project.\n4. Select SVN\
    \ and click on Next as shown:\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_206_1.png)\n\
    \n5. We now need to select the repository location. To enter the URL, select the\
    \ **Create new repository location** radio button and click on Next as follows:\n\
    \n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_207_0.png)\n\n6. Enter the URL of *Repository1*\
    \ from the Collabner server. To find out the URL:\n\n- Launch the Collabner server.\n\
    - Enter the credentials.\n- Click on **Repositories**; we will get the following\
    \ screen, where the red underlined part is the URL to enter:\n\n| records per\
    \ page | Filter: | |\n| :--- | :--- | :--- |\n| Name | Checkout command | Status\
    \ |\n| | Repository1 | svn co http://18080/svn/Repository1 | OK |\n| | hostname\
    \ | Repository1~username=admin |\n| Showing 1 to 1 of 1 entries | | Previous 1\
    \ Next -> |\n| | Create Info Dump Verify Delete |\n\n7. Copy and paste it in eclipse\
    \ as repository info. Make sure to remove extra spaces from the URL. Click on\
    \ **Next**:\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_208_0.png)\n\n8. Select\
    \ the project name as the folder and click on **Next**.\n\n9. Add comments as\
    \ Initial Import and click on **Finish**.\n\n10. We will be prompted to enter\
    \ authentication several times. Use the credentials which we created while configuring\
    \ the Collabnet server for Repository1(packt_user1 as username and contact1 as\
    \ password.)\n\n11. Once the operation is completed, we will be prompted to open\
    \ Perspective. Click on **No**.\n\n12. Now we have to commit the project to the\
    \ repository. To do this, right-click on **Project**, select **Team** and click\
    \ on **Commit**.\n\n13. Enter the comments as **Empty project**; we can deselect\
    \ the checkboxes for the files which we don't want to add for versioning. Now\
    \ we will keep everything default as shown in the following screenshot:\n\n# Adding\
    \ files in the project and committing to the repository\n\nAfter creating our\
    \ project, now it's time to add packages or files:\n\n1. Let's add index.jsp in\
    \ WebContent.\n2. The newly created file will have ? as an icon signifying this\
    \ is new content which is not added to version as shown in the following screenshot:\n\
    \n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_209_0.png)\n\n3. To add this in versioning,\
    \ we need to commit this file. Right click on **index.jsp**, select **Team**,\
    \ and click on **Commit**. Add the appropriate comment and click on OK. The files\
    \ have been successfully committed to the repository.\n\n# Importing the project\
    \ in the workspace\n\nTo get the project in the workspace, first of all the repository\
    \ administrator has to:\n\n- Give the URL to the repository\n- Create a new user\
    \ with credentials and give them access to the repository\n\nWe already created\
    \ `packt_user2`, who has access to `Repository1`. We will use this data to import\
    \ the project from the repository. The process is generally called checkout. We\
    \ will follow the following steps to check out the SVNDemo project from Repository1:\n\
    \n1. Open a new workspace to work. Select **File | Import**.\n2. Type **SVN**\
    \ and select **Checkout Projects from SVN** as shown in the following screenshot:\n\
    \n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_210_0.png)\n\n3. Click on **Next**.\
    \ Select **Create a new repository location** and click on **Next**.\n4. Enter\
    \ the URL of the repository which you got from the administrator or copied from\
    \ Collabnet as shown earlier.\n5. Enter the credentials as packt_user2 and contact1\
    \ or the one you gave at the time of creation. All the projects from Repository1\
    \ will be listed as shown:\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_211_0.png)\n\
    \n6. Select SVNDemo and click on Next. Choose out as a project in the workspace\
    \ as shown:\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_211_1.png)\n\n7. Click\
    \ on Next.\n8. Select Default location and click on Finish.\n9. We have successfully\
    \ checked out the project from the repository which packt_user1 had committed.\n\
    10. Let's modify index.jsp and commit it to understand the concept of collaboration:\n\
    11. Modify index.jsp as follows:\n\n```html\n<body>\n  WELCOME to Collabnet.\n\
    </body>\n```\n12. Right click on index.jsp, select Team and click on Commit. Some\
    \ changes in the local file we can commit to the repository as shown:\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_212_0.png)\n\
    \n13. Right click on index.jsp, select Team and click on Commit.\n14. Enter a\
    \ comment as Welcome and click on OK. The file will be committed to the repository.\n\
    \n# Updating and tracking the project for latest changes in the repository\n\n\
    As project development is a team effort, many people may be working on different\
    \ files in the project. That means they will keep on committing their latest work\
    \ to the repository. In order to reflect these changes in our local copy, we must\
    \ update our project. packt_user2 added index.jsp in the last step with packt_user1.\n\
    \nLet's update the project to get the latest copy with the help of the following\
    \ steps:\n\n1. First of all, we may want to find out what changes have been made\
    \ in the SVNDemo project. To find this out, right click on project SVNDemo | Team\
    \ | Synchronize with Repository.\n2. Enter the credentials for packt_user. We\
    \ will be prompted to open Perspective. Click on Yes.\n3. In Perspective, we will\
    \ get a list of the files which are in the repository but not in our local copy\
    \ as shown:\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_213_0.png)\n\n4. Now we\
    \ will accept all the changes from the repository in our local copy as:\n1. Change\
    \ Perspective to the project explorer.\n2. Right-click on WebContent, select Team,\
    \ and click on Update to Head.\n3. Enter packt_user1's credentials.\n4. We will\
    \ have index.jsp with the same code added by packt_user2 in the previous steps.\n\
    5. To find the version history, we need to click on project -> Team -> Show History.\
    \ A dialog will open up with the list of the operations performed on the project\
    \ to keep a history of versioning:\n\n| Revision | Date | Author | Comment |\n\
    | :--- | :--- | :--- | :--- |\n| 5 | 2/23/16 10:35 PM | packt_user2 | code changed\
    \ |\n| 4 | 2/23/16 9:43 PM | packt_user1 | Index.jsp added |\n| 3 | 2/23/16 9:37\
    \ PM | packt_user1 | Empty Project |\n| 2 | 2/23/16 9:36 PM | packt_user1 | Initial\
    \ import. |\n| 1 | 2/23/16 9:36 PM | packt_user1 | |\n\n# Versioning and Deploying\n\
    \nIn the same way we used Collabnet for versioning, we can use a VisualSVN server.\
    \ The only difference is the way we copy the URL. To copy the URL for the repository\
    \ in VisualSVN, we need to right-click on the repositories and select Copy URL\
    \ to the Clipboard as shown in the following screenshot:\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_214_0.png)\n\
    \nUse the same step to check out, add, and update the data from the repository\
    \ visual-repo1 which we have already created. Follow the same steps as we did\
    \ for Collabnet. Don't forget to check the credentials for the VisualSVN server.\n\
    \n# Project deployment\n\nWe created the project in Eclipse IDE and it is there.\
    \ It may be possible to give our projects to use, or want to use it on some other\
    \ machine. The process of installing our application into the server context is\
    \ called project deployment. This process is server-specific. On successful deployment,\
    \ we can use a project without eclipse IDE. Here we will discuss the possible\
    \ ways of deploying our application into a Tomcat7 server.\n\n# Copying a WAR\
    \ file into Tomcat without Tomcat manager\n\nTo copy a WAR file of our application,\
    \ first of all we need to generate the WAR file from eclipse as follows:\n\n1.\
    \ Create a new, dynamic web project, Ch08_Demo_Deployment.\n2. Add index.jsp in\
    \ WebContent as follows:\n\n```html\n<@page language=\"java\" contentType=\"text/html;\
    \ charset=ISO-8859-1\" pageEncoding=\"ISO-8859-1\">\n```\n"
  mdcn: "\n\n# 版本控制与部署\n\n我们已成功安装了插件。可以通过导航到 Windows | Show View | other | Type svn\
    \ 来检查它。我们应该看到以下界面：\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_206_0.png)\n\n\
    现在我们准备好使用 eclipse 进行版本控制。首先使用 Collabnet，然后使用 Visual SVN。首先，我们需要分别创建两个工作空间：`svn_tut`\
    \ 和 `svn_tut1`。我们可以从仓库中获取项目，或者如果是新项目，我们可以创建一个目录结构并将其提交到仓库。在我们的组中，没有可用的项目；因此 `packt_user1`\
    \ 将创建一个新项目并存储在中央仓库中，以便其他人可以从他的组中访问。按照以下步骤完成任务：\n\n1. 启动 eclipse 和工作空间 `svn_tut`。\n\
    2. 创建一个新的动态 Web 项目名为 `SVNDemol`。\n3. 右键点击它并选择选项 `Team | Share project`。\n4. 选择\
    \ SVN 并点击 Next，如所示：\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_206_1.png)\n\n\
    5. 我们现在需要选择仓库位置。要输入 URL，选择 **Create new repository location** 单选按钮并点击 Next，如下：\n\
    \n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_207_0.png)\n\n6. 输入来自 Collabner 服务器的\
    \ *Repository1* 的 URL。要找到该 URL：\n\n- 启动 Collabner 服务器。\n- 输入凭据。\n- 点击 **Repositories**；我们将看到以下界面，其中红色下划部分是需要输入的\
    \ URL：\n\n| records per page | Filter: | | |\n| :--- | :--- | :--- |\n| Name |\
    \ Checkout command | Status |\n| | Repository1 | svn co http://18080/svn/Repository1\
    \ | OK |\n| | hostname | Repository1~username=admin |\n| Showing 1 to 1 of 1 entries\
    \ | | Previous 1 Next -> |\n| | Create Info Dump Verify Delete |\n\n7. 将其复制并粘贴到\
    \ eclipse 中作为仓库信息。确保删除 URL 中多余的空格。点击 **Next**：\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_208_0.png)\n\
    \n8. 选择项目名称作为文件夹并点击 **Next**。\n\n9. 添加注释为 Initial Import 并点击 **Finish**。\n\n10.\
    \ 我们会被多次提示输入身份验证。使用我们在配置 Collabnet 服务器时为 Repository1 创建的凭据（用户名为 `packt_user1`，密码为\
    \ `contact1`）。\n\n11. 一旦操作完成，将提示打开 Perspective（视图）。点击 **No**。\n\n12. 现在我们必须将项目提交到仓库。要为此，右键点击\
    \ **Project**，选择 **Team** 并点击 **Commit**。\n\n13. 输入注释为 **Empty project**；我们可以取消勾选我们不想加入版本控制的文件复选框。现在我们将保持所有默认设置，如下截图所示：\n\
    \n# 在项目中添加文件并提交到仓库\n\n创建项目后，现在是时候添加包或文件了：\n\n1. 我们在 WebContent 中添加 `index.jsp`。\n\
    2. 新创建的文件将带有 `?` 图标，表示这是尚未添加到版本的新内容，如下截图所示：\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_209_0.png)\n\
    \n3. 为了将其加入版本，我们需要提交此文件。右键点击 **index.jsp**，选择 **Team** 并点击 **Commit**。添加注释。文件已成功提交到仓库。\n\
    \n# 在工作空间导入项目\n\n要在工作空间中获取项目，首先管理员必须：\n\n- 提供仓库 URL\n- 创建一个新用户并授予仓库权限\n\n我们已经创建了拥有\
    \ `Repository1` 权限的 `packt_user2`。我们将使用这些数据从仓库导入项目。该过程通常称为 checkout。我们将遵循步骤从 Repository1\
    \ 检 SVNDemo 项目：\n\n1. 打开一个新的工作空间。选择 **File | Import**。\n2. 输入 **SVN** 并如如下所示选择\
    \ **Checkout from SVN**：\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_210_0.png)\n\
    \n3. 点击 **Next**。选择 **Create a new repository location** 并点击 **Next**。\n4. 输入之前从管理员处或从\
    \ Collabnet 获取的仓库 URL。\n5. 输入 `packt_user2` 和 `contact1` 或创建时提供的凭据。Repository1\
    \ 的所有项目将如所示：\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_211_0.png)\n\n6. 选择 SVNDemo\
    \ 并点击 Next。如所示在工作空间中检出作为项目：\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_211_1.png)\n\
    \n7. 点击 **Next**。\n8. 选择 Default 位置并点击 **Finish**。\n9. 我们已成功从 `packt_user1` 提交的仓库检出项目。\n\
    10. 修改 index.jsp 并提交它以理解协作的概念：\n11. 如下修改 index.jsp：\n\n```html\n<body>\n  WELCOME\
    \ to Collabnet.\n</body>\n```\n12. 右键点击 index.jsp，选择 Team 并点击 **Commit**。我们可以将本地文件的某些更改提交到仓库，如下所示：\n\
    \n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_212_0.png)\n\n13. 右键点击 index.jsp，选择\
    \ Team 并点击 **Commit**。\n14. 输入注释 Welcome 并点击 OK。文件将提交到仓库。\n\n# 更新并跟踪仓库中的最新更改\n\
    \n由于项目开发是团队协作，许多人可能在项目的不同文件中工作。这意味着他们不断将最新工作提交到仓库。为了在我们的本地副本中反映这些更改，我们必须更新项目。`packt_user2`\
    \ 在上一步与 `packt_user1` 一起添加了 `index.jsp`。\n\n通过以下步骤更新项目以获取最新副本：\n\n1. 首先，我们可能想知道\
    \ SVNDemo 项目发生了哪些更改。要发现此，右键点击项目 SVNDemo | Team | Synchronize with Repository。\n\
    2. 输入 `packt_user` 的凭据。将提示打开 Perspective。点击 **Yes**。\n3. 在 Perspective 中，我们将获得仓库中但不在本地副本中的文件列表，如下所示：\n\
    \n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_213_0.png)\n\n4. 现在我们将以下方式在本地副本中接受仓库的所有更改：\n\
    1. 将 Perspective 更改为 project explorer（项目资源）。\n2. 右键点击 WebContent，选择 Team 并点击 **Update\
    \ to Head**。\n3. 输入 packt_user1 的凭据。\n4. 我们将拥有之前的步骤中 `packt_user2` 添加的相同代码的 index.jsp。\n\
    5. 若要查找版本历史，我们需要点击项目 -> Team -> Show History。将弹出一个对话框，列出在项目上执行的操作以保留版本控制历史：\n\n\
    | Revision | Date | Author | Comment |\n| :--- | :--- | :--- | :--- |\n| 5 | 2/23/16\
    \ 10:35 PM | packt_user2 | code changed |\n| 4 | 2/23/16 9:43 PM | packt_user1\
    \ | Index.jsp added |\n| 3 | 2/23/16 9:37 PM | packt_user1 | Empty Project |\n\
    | 2 | 2/23/16 9:36 PM | packt_user1 | Initial import. |\n| 1 | 2/23/16 9:36 PM\
    \ | packt_user1 | |\n\n# 版本控制与部署\n\n与我们使用 Collabnet 进行版本控制的方式相同，我们可以使用 VisualSVN\
    \ 服务器。唯一的区别是复制 URL 的方式。要在 VisualSVN 中复制仓库的 URL，我们需要右键点击仓库并选择 Copy URL to Clipboard，如下截图所示：\n\
    \n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_214_0.png)\n\n使用相同的步骤检出、添加和更新来自仓库-repo1\
    \ 的数据。遵循我们对 Collabnet 执行的相同步骤。不要忘记检查 VisualSVN 服务器的凭据。\n\n# 项目部署\n\n我们在 Eclipse\
    \ IDE 中创建了项目，它就在那里。可能可以将我们的项目提供他人使用，或者想在其他机器上使用。将应用程序安装到服务器上下文的过程被称为项目部署。该过程取决于特定的服务器。部署成功后，我们可以在没有\
    \ eclipse 的情况下使用项目。在这里我们将讨论部署到 Tomcat7 服务器的可能方法。\n\n# 在没有 Tomcat 管理的情况下将 WAR 文件复制到\
    \ Tomcat\n\n复制应用程序的 WAR 文件，首先我们需要在 eclipse 中生成 WAR 文件，如下：\n\n1. 创建一个新的动态 Web 项目，Ch08_Demo_Deployment。\n\
    2. 在 WebContent 中添加 index.jsp，如下：\n\n```html\n<@page language=\"java\" contentType=\"\
    text/html; charset=ISO-8859-1\" pageEncoding=\"ISO-8859-1\">\n```\n\n"
