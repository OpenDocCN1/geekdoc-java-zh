    Unit testing is the process of testing a single functionality in the code at a
    time. In unit testing, the developer ensures that the functionality is working
    correctly according to business logic. We will use JUnit for unit testing.


    # Unit testing using JUnit


    JUnit is an automation testing framework which provides numbers of TestRunners
    that can automate the execution of any Java class that extends from Test Case.
    It facilitates the testing of the expected behavior as a unit. The developer can
    write test cases for all the functions in the code. Whenever a change occurs in
