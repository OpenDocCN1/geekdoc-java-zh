- md: "\n## #4 Talking to the Database\n\nOn the web, browsing is a common task. The\
    \ data for which the user is searching will be defined and stored somewhere so\
    \ that it can be used whenever required. It is not necessarily only in a database;\
    \ it can be in any format. Can we imagine a dynamic Web without storing data??\
    \ Quite difficult to imagine!! Starting from the login to the application and\
    \ searching for a particular product from the user's perspective, adding new products\
    \ or updating the products from an administrative perspective, in every stage\
    \ we handle data. In the previous chapter, where we discussed the presentation\
    \ layer, we were accepting data from the user for registration, searching for\
    \ a particular ID or when we needed to show the data to the user. But we were\
    \ not able to save the data as there was no persistency layer included by us.\n\
    \nIn this chapter, we will add the persistence layer and find out the following:\n\
    \n- How to implement the persistence layer to take data from the user \n- How\
    \ to communicate with the persistence layer using Spring's Hibernate template\n\
    - How to set up JUnit and how to use it for testing a unit\n\n## Persistence\n\
    \nData storage is a very common and basic requirement of enterprise applications.\
    \ Data storage ensures that the data collected from the user will be saved over\
    \ time. The mechanism of saving data for the duration so as to make it available\
    \ later is called *persistence*.\n\n## Talking to the Database\n\nIn Java, normally\
    \ the persistency is of an object. Java can save an object state using the following\
    \ ways:\n\n- Object serialization\n- Storing data in XML format\n- Saving the\
    \ data in a relational database\n\n## Using object serialization\n\nThe process\
    \ by which an object is saved across the network is serialization. In Java, an\
    \ object is saved in the file. So we can even say, saving an object to the file\
    \ is serialization.\n\n## Disadvantages of using object serialization\n\nThe disadvantages\
    \ of object serialization are as follows:\n\n- Serialization adds resource overhead\n\
    - Serialization is slow\n\n## Storing data in XML\n\nIn the past few years, XML\
    \ has emerged as a favorite choice to handle data in a file using markups. The\
    \ good thing is, the developer can use their own tags to represent the data collection.\n\
    \n## Disadvantages of storing data in XML\n\nThe disadvantages of storing data\
    \ in XML are as follows:\n\n- XML needs adequate processing\n- XML is not for\
    \ displaying in a browser but for holding data. Not all browsers have inbuilt\
    \ support. Developers need to use XSLT (extensible stylesheet language) to present\
    \ the data on browsers\n\n## Saving the data in a relational database\n\nAn object\
    \ consists of data members to present its state. The relational database consists\
    \ of a table structure which a row and column structure. One row in a table is\
    \ mapped to one object. Mapping is a technique that places an object's data members\
    \ in one or more fields of a database table. The relational database uses an easy\
    \ query writing mechanism to deal with the stored data. Over the years, the relational\
    \ database has become the choice of Java developers for achieving persistency.\n\
    \n## Advantages of saving data in a relational database\n\nThe advantages of saving\
    \ data in a relational database are as follows:\n\n- It supports easy mapping\
    \ of a table in the database to object data members\n- It has techniques such\
    \ as primary key, timestamps and version numbers to update an object when so and\
    \ required\n- It provides mapping techniques that can support Java inheritance\n\
    - It supports relational mappings as one to one, one to many, and many to many,\
    \ which can be used to map Java collections and arrays\n\n## Interaction of Java\
    \ with relational databases\n\nJava is a pure object-oriented programming (OOP)\
    \ language while relational databases use sequential programming language (SQL).\
    \ Both of them have their own data type, methods and programming techniques. OOP\
    \ manages objects where SQL manages tables. It is pretty clear that both of them\
    \ cannot communicate directly with each other due to the unavailability of compatible\
    \ language support. Direct communication is not possible so the unit is to make\
    \ them communicate even though they are fundamentally different. The Java Database\
    \ Connectivity (JDBC) architecture will be managed by JDBC APIs from a Java application\
    \ which helps to manage the language and data type difference is DriverManager.\
    \ The following figure illustrates this:\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_85_0.png)\n\
    \nThe JDBC driver is an implementation that defines the interface in JDBC API\
    \ for interacting with the database server.\n\n## Types of JDBC drivers\n\nThe\
    \ four types of drivers that facilitate JDBC programming on the variety of platforms\
    \ and operating systems are as follows:\n\n- JDBC-ODBC bridge driver\n- JDBC Native\
    \ API Driver / Partly JAVA Driver\n- JDBC Net Protocol Driver\n- All Java drivers\n\
    \nWe shall now see all types of driver and their advantages and disadvantages.\n\
    \n## JDBC-ODBC bridge driver\n\nThe Type 1 driver uses JDBC API to the Open Database\
    \ Connectivity (ODBC) API to access a database. The Type 1 driver is installed\
    \ on the client machine which translates the JDBC calls into ODBC calls. In order\
    \ to connect to the database it uses an ODBC driver with the help of Data Source\
    \ Name (DSN).\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_86_0.png)\n\n## Advantages\
    \ of the JDBC-ODBC bridge driver\n\nThese types of drivers are freely installed\
    \ on the system, which allows access to almost all types of databases.\n\n## Disadvantages\
    \ of the JDBC-ODBC bridge driver\n\nThe disadvantages of using the JDBC-ODBC bridge\
    \ driver are as follows:\n\n- When a program executes the JDBC, the call gets\
    \ converted first of all to JDBC-ODBC and then later from JDBC to ODBC. As there\
    \ are high number of conversions, the working is slow.\n- The Type 1 driver needs\
    \ ODBC driver to be installed on client machine.\n- The Type 1 driver needs DSN,\
    \ which needs to be created on client machine.\n- Type 1 driver is not useful\
    \ for web applications.\n\n## JDBC Native API Driver/Partly JAVA Driver\n\nThe\
    \ Type 2 driver converts JDBC calls to the native calls, which are database specific.\
    \ It needs some binary code to be present on the client machine.\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_87_0.png)\n\
    \n## Advantages of the Native API Driver\n\nThe advantage of using the Native\
    \ API Driver is as follows:\n\n- In comparison with the Type 1 driver, it gives\
    \ better performance\n\n## Disadvantages of the Native API Driver\n\nThe disadvantages\
    \ of using the Native API Driver are as follows:\n\n- As a vendor-specific native\
    \ API must be installed on client machine, it leads to problems using it for Internet\n\
    - The communication with database server is dependent upon the native API, which\
    \ leads to problems when the database changes\n\n## JDBC Net Protocol Driver\n\
    \nThe Type 3 is useful in the case of a middleware server. The JDBC application\
    \ will send the request to this middleware server, which translates JDBC calls\
    \ to the database.\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_88_0.png)\n\n##\
    \ Advantages of the Net Protocol Driver\n\nThe advantages of using the JDBC Net\
    \ Protocol Driver are as follows:\n\n- Unlike the Type 2 driver, in the Type 3\
    \ driver there is no need for a vendor-specific database library to be present\
    \ on each and machine\n- It is portable as it is written in Java\n- It can be\
    \ used for web applications as there is no client-specific code or configuration\n\
    \n## Disadvantages of the Net Protocol Driver\n\nAs the Type 3 driver uses a middleware\
    \ server, it's required to install a separate server application where database-specific\
    \ coding needs to be performed.\n\n## All Java drivers\n\nThe Type 4 drivers are\
    \ also called pure Java drivers as they are completely written in Java. The Type\
    \ 4 driver converts JDBC calls directly to the database-specific protocol with\
    \ minimum conversions.\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_89_0.png)\n\
    \n## Advantage of Java drivers\n\nThe advantage of Java drivers is as follows:\n\
    \n- The conversion of calls is from JDBC API to database-specific calls, leading\
    \ to the best performance among all other drivers\n\n## Disadvantages of the Java\
    \ Driver\n\nThe disadvantage of the Java Drivers is as follows:\n\n- As Type 4\
    \ driver is specific to the database, whenever the database changes the driver\
    \ has to be changed accordingly\n"
