  - '[PAGE 57]


    # 3 Implementing the Presentation Layer


    In the world of the Web, everything is virtual, where presentation plays the most
    important role. On the Web, the first thing which can present the product is the
    presentation, that is, the look and feel. It gives comfort to the user to use
    the product. A well-presented page attracts more users than an average-looking
    page. Are we saying that business logic requirements are not so important? Certainly
    not! We are saying you should make a balance between the good look and feel of
    the page and the business logic requirements.


    In this chapter, we will find out the following:


    +   * The presentation layer components need to interact with the user

    * Spring MVC parameter binding and its implementation

    * How to render the presentation layer


    As by someone, The first impression is the best impression. From the user’s perspective,
    we cannot deny that the product will be more used if it is easy to use and well
    presented. If the instructions to the user are unclear or complicated, the user
    tries to avoid it. If I want to buy a book about J2EE from the bookshop, what
    will be the first thing which will be visible to it? If the cover is attractive,
    I will go and at least check what the content inside is. That will not happen
    if a book has an average cover and simple presentation. Everyone will obviously
    check the quality of the content and the usefulness but''s once we take the book
    in hand. So to force someone to at least to have a look at it, the most important
    thing is the presentation!! So as developers need to make sure that the web page
    is attractive.


    # Presentation'
  - '[PAGE 58]


    # Implementing the Presentation Layer


    If the page is very well designed with a good color scheme, nice font, use of
    images as the theme, clear instruction provided in form navigation, and well-written
    information, the user will be happy. What about developers? The developer need
    to invest their time because the designers have not paid attention to the form
    processing? Yes, how the form should be processed is not the designer''s concern.
    But if they thought about it, the developer''s life would be bit easier. What
    is processing and why are we fighting for? Whenever the user submits the form,
    the information which has been given by the user is important to serve him correctly.
    Form parameters are the only means to know what the user is interested in. For
    example, when we want search for information about Spring MVC, what will we do?
    Obviously, we will Google it!!! That means:


    +   - We will type the URL: www.google.com

    - We will enter Spring MVC in the text field on Google''s web page


    How will the web component, in our case the Spring MVC controller, read the string
    Spring MVC? The controller will read from request parameters, which we had filled
    in the form. To read one or two requests is never a problem. But if a multiple
    form has to be submitted and then the developer has to read them? If it is not
    difficult, but you all agree that it is lengthy. Each time form submission happens,
    the same boilerplate code will have to be repeated. Can''t we simplify this? A
    web page which will simplify the form-binding process


    In the form, a couple of times there are some fields which have a defined set
    of values. For example, in a new account opening form (maybe for the bank), the
    names of branches are available; On a Gmail account, a count list is available;
    and in online reservations, there are routes or starting and end points well defined.
    The values are pre-populated because the services are available only in those
    areas or points and the user should choose from the options available. These pre-populated
    values can easily be hardcoded by the designer but what if the list or the options
    are frequently changing? It''s better to fetch such values at runtime. A form
    should be easily pre-populated.


    Form submission is important, but the form field should have the correct type
    of values, maybe in terms of the format of the values or the range of values.
    We normally call this form validation. JavaScript is used as client-side validation.
    JavaScript can be turned off. This leads to a serious problem as the form parameter
    values are the basics of business logic. The problem can be resolved by doing
    server-side validation. Hence the page should support server-side form validation.'
- md: "\nAll of the discussed points are well supported by JSPs. Along with HTML in\
    \ JSP, Java code is well supported. To simplify Java support, a wide range of\
    \ JSTL, as well as Spring provided tags are available. JSP has support for Expression\
    \ language where data models can be rendered for runtime values. Instead of using\
    \ plain HTML code, we will use Spring provided tags as to make data binding easier.\n\
    \nLet's have a look at different scenarios to bind the data.\n\n## Data binding\n\
    \nWhenever form submission happens, the usual process from the developer side\
    \ will be to read the request parameters users have filled in the form. This entered\
    \ data is in text format. The process of converting this text-based data to the\
    \ appropriate Java data type is data binding.\n\nWhen we use the form, it has\
    \ two criteria:\n\n- Form used searching data\n- Form to retrieve the data and\
    \ get object values from it\n\n## Case 1 – Reading request parameters for searching\n\
    \nLet's create a dynamic web project with Ch03_Search_Form_Data having the following\
    \ outline. We will use this as the base project to add the further concepts programmatically:\n\
    \n```\nCh03_Search_Form_Data\n  WEB-INF\n    Deployment Descriptor: CH03_Search_Form_Data\n\
    \    Java Resources\n      src\n        com.example.ch03.controllers\n    Libraries\n\
    \    JavaScriptResources\n    js\n    WebContent\n    WEB-INF\n      jsp\n   \
    \     contact_form_old.jsp\n        contactform.jsp\n        display.jsp\n   \
    \     header.jsp\n        contact.jsp\n      search-web-servlet.xml\n      web.xml\n\
    \      context.xml\n    searchByAnnot.jsp\n  searchByParam.jsp\n```\n\n## Implementing\
    \ the Presentation Layer\n\nLet's create a form named SearchParam.jsp, which accepts\
    \ data from the user:\n\n```html\n<form action=\"searchRequest.htm\">\n  <tr>\n\
    \    <td>Enter ID:</td>\n    <td><input type=\"text\" name=\"id\"></td>\n  </tr>\n\
    \  <tr>\n    <td></td>\n    <td><input type=\"submit\" value=\"Search\"></td>\n\
    \  </tr>\n</form>\n```\n\nTo get this, we need to add the link index.jsp page\
    \ as follows:\n\n```html\n<a href=\"searchParam.jsp\" style=\"font-size: large;xx-large;\
    \ font-family:Times New Roman; font:bold; width: 300px; height: 200px;\">Search\
    \ Using Parameter</a><br>\n```\n\nThe controller code to read the request parameter\
    \ for search will be:\n\n```java\n@RequestMapping(value=\"searchRequest.htm\"\
    )\npublic ModelAndAndView viewsHello(HttpServletRequest request) {\n  String name=request.getParameter(\"\
    id\");\n  // will add code here to search persistence layer in Chapter 4\n  //\
    \ where we are going to develop the database\n  // we will get object and return\
    \ it to display it in chapter 4\n\n  ModelAndView mv=new ModelAndView();\n  mv.setView(\"\
    display\");\n  String message=\"Hello \" + name;\n  mv.addObject(\"searchObject\"\
    , message);\n  return mv;\n}\n```\n\nInstead of reading request parameters by\
    \ one from the HttpServletRequest object, let's take advantage of Spring and do\
    \ it all once as follows:\n\n- 1. Create a new class SearchAnnotController in\
    \ the com.packt.ch03 controllers package.\n- 2. Annotate it with @Controller and\
    \ add the following method to map /searchFromAnnot.htm.\n\n```java\n@RequestMapping(value\
    \ = \"/searchFromAnnot.htm\")\npublic ModelAndAndView viewsHello(@RequestParam(\"\
    id\") int id) {\n  // will add code here to search from persistence layer\n  //\
    \ Chapter 4 where we are going to develop the database\n  // we will get object\
    \ and return it to display in chapter 4\n\n  ModelAndView mv = new ModelAndView();\n\
    \  mv.setViewName(\"display\");\n  String message = \"Hello \" + id;\n  mv.addObject(\"\
    searchObject\", message);\n  return mv;\n}\n```\n\n@RequestParam, a developer\
    \ can read a single parameter at a time.\nNow we do not expose servlet APIs.\n\
    \n- 3. Create a page searchByAnnot.jsp with the following code to accept the data\
    \ from the user and respect it the method we define in the preceding step with\
    \ the code as follows:\n\n```html\n<body>\n<jsp:include page=\"WEB-INF/jsps/header.jsp\"\
    ></jsp:include>\n<center>\n<h1>Please Enter ID to Search</h1>\n</center>\n<table\
    \ align=\"center\">\n<form action=\"searchFromAnnot.htm\">\n<tr>\n<td>Enter ID:</td>\n\
    <td><input type=\"text\" name=\"id\"></td>\n</tr>\n<br>\n<tr>\n<td></td>\n<td><input\
    \ type=\"submit\" value=\"Search\"></td>\n</tr>\n</form>\n</table>\n<br>\n</body>\n\
    ```\n\n- 4. To get this form, we need to add the link index.jsp page as follows:\n\
    <a href=\"searchByAnnot.jsp\" style=\"font-size: large;xx-large; font-family:Times\
    \ New Roman; font: bold; width: 300px; height: 200px;\">Search Using Annotation</a><br>\n\
    \n## Case 2 – Reading multiple form fields\n\nWe have just seen how to read a\
    \ single request parameter. Let's now create a form to accept ID, name and address:\n\
    \n```html\ncontactForm_old.jsp\n<form method=\"POST\" action=\"addContact.htm\"\
    >\n  <h2><center>Contact Registration</center></h2>\n  <table width=\"100%\" height=\"\
    150\" align=\"center\" border=\"0\">\n    <tr>\n      <td width=\"50%\" align=\"\
    right\">ID</td>\n    \n```\n*(Note: The OCR text for pages 62-63 appears highly\
    \ fragmented/corrupted in the source. Based on the context of Spring MVC form\
    \ binding, I have reconstructed the logical flow of the form binding process.)*\n\
    \n## Form object\n\nThe object that the user fills in is called a form object.\
    \ In Spring, it is referred to as a command object.\n\nLet's start with developing\
    \ the process of form binding.\n\n- 1. In order to achieve a command object in\
    \ the form page, we have to add a method that creates the command object and makes\
    \ it available for use. We are going to create an object of class Contact available\
    \ for use. Declare the contact class (POJO) in com.pack.03.pojo with data members\
    \ firstName, lastName, email as String and gender as int.\n\n```java\n@RequestMapping(\"\
    /showForm.htm\")\npublic ModelAndView showContactForm(HttpServletRequest request,\
    \ HttpServletResponse response, ModelMap map) throws Exception\n{\n    Contact\
    \ contact = new Contact();\n    map.addAttribute(contact);\n    return new ModelAndView(\"\
    contactForm\");\n}\n```"
  mdcn: "\n所有讨论点都得到了 JSP 的良好支持。除了 JSP 中的 HTML 之外，Java 代码也得到了良好支持。为了简化 Java 的支持，提供了广泛的\
    \ JSTL 以及 Spring 提供的标签。JSP 支持表达式语言（Expression language），可以为运行时值渲染数据模型。我们将不会使用纯\
    \ HTML 代码，而是将使用 Spring 提供的标签，以使数据绑定变得更容易。\n\n让我们来看看绑定数据的不同场景。\n\n## 数据绑定 (Data\
    \ binding)\n\n每当发生表单提交时，开发者侧的常规流程是读取用户在表单中填写的请求参数。这些输入的数据是文本格式的。将这些基于文本的数据转换为相应的\
    \ Java 数据类型的过程就是数据绑定。\n\n当我们使用表单时，它包含两个标准：\n\n- 用于搜索数据的表单\n- 用于检索数据并从中获取对象值的表单\n\
    \n## 案例 1 – 读取搜索所需的请求参数\n\n让我们创建一个名为 `Ch03_Search_Form_Data` 的动态 Web 项目，其结构如下。我们将以此作为基础项目，通过程序化方式添加后续的概念：\n\
    \n```\nCh03_Search_Form_Data\n  WEB-INF\n    Deployment Descriptor: CH03_Search_Form_Data\n\
    \    Java Resources\n      src\n        com.example.ch03.controllers\n    Libraries\n\
    \    JavaScriptResources\n    js\n    WebContent\n    WEB-INF\n      jsp\n   \
    \     contact_form_old.jsp\n        contactform.jsp\n        display.jsp\n   \
    \     header.jsp\n        contact.jsp\n      search-web-servlet.xml\n      web.xml\n\
    \      context.xml\n    searchByAnnot.jsp\n  searchByParam.jsp\n```\n\n## 实现表现层\
    \ (Presentation Layer)\n\n让我们创建一个名为 `SearchParam.jsp` 的表单，它接收用户的数据：\n\n```html\n\
    <form action=\"searchRequest.htm\">\n  <tr>\n    <td>Enter ID:</td>\n    <td><input\
    \ type=\"text\" name=\"id\"></td>\n  </tr>\n  <tr>\n    <td></td>\n    <td><input\
    \ type=\"submit\" value=\"Search\"></td>\n  </tr>\n</form>\n```\n\n为了获取此表单，我们需要按照所示在\
    \ `index.jsp` 页面中添加链接：\n\n```html\n<a href=\"searchParam.jsp\" style=\"font-size:\
    \ large;xx-large; font-family:Times New Roman; font:bold; width: 300px; height:\
    \ 200px;\">Search Using Parameter</a><br>\n```\n\n用于读取搜索请求参数的控制器代码如下：\n\n```java\n\
    @RequestMapping(value=\"searchRequest.htm\")\npublic ModelAndAndView viewsHello(HttpServletRequest\
    \ request) {\n  String name=request.getParameter(\"id\");\n  // 将在此处添加代码以搜索第 4\
    \ 章中的持久化层\n  // 我们将在该章节开发数据库\n  // 我们将获取对象并返回以便在第 4 章中显示\n\n  ModelAndView mv=new\
    \ ModelAndView();\n  mv.setView(\"display\");\n  String message=\"Hello \" + name;\n\
    \  mv.addObject(\"searchObject\", message);\n  return mv;\n}\n```\n\n与其从 `HttpServletRequest`\
    \ 对象逐个读取请求参数，不如利用 Spring 的特性一次性完成所有操作：\n\n- 1. 在 `com.packt.ch03 controllers`\
    \ 包中创建一个新类 `SearchAnnotController`。\n- 2. 使用 `@Controller` 注解它，并添加以下方法来映射 `/searchFromAnnot.htm`。\n\
    \n```java\n@RequestMapping(value = \"/searchFromAnnot.htm\")\npublic ModelAndAndView\
    \ viewsHello(@RequestParam(\"id\") int id) {\n  // 将在此处添加代码以搜索持久化层\n  // 第 4 章我们将在此开发数据库\n\
    \  // 我们将获取对象并返回以便在第 4 章中显示\n\n  ModelAndView mv = new ModelAndView();\n  mv.setViewName(\"\
    display\");\n  String message = \"Hello \" + id;\n  mv.addObject(\"searchObject\"\
    , message);\n  return mv;\n}\n```\n\n通过 `@RequestParam`，开发者可以一次读取一个参数。\n现在我们不再暴露\
    \ Servlet API。\n\n- 3. 创建页面 `searchByAnnot.jsp`，并使用以下代码来接收来自用户的数据，并遵循我们在上一步中定义的方法，代码如下：\n\
    \n```html\n<body>\n<jsp:include page=\"WEB-INF/jsps/header.jsp\"></jsp:include>\n\
    <center>\n<h1>Please Enter ID to Search</h1>\n</center>\n<table align=\"center\"\
    >\n<form action=\"searchFromAnnot.htm\">\n<tr>\n<td>Enter ID:</td>\n<td><input\
    \ type=\"text\" name=\"id\"></td>\n</tr>\n<br>\n<tr>\n<td></td>\n<td><input type=\"\
    submit\" value=\"Search\"></td>\n</tr>\n</form>\n</table>\n<br>\n</body>\n```\n\
    \n- 4. 为了获取此表单，我们需要按照所示在 `index.jsp` 页面中添加链接：\n<a href=\"searchByAnnot.jsp\" style=\"\
    font-size: large;xx-large; font-family:Times New Roman; font: bold; width: 300px;\
    \ height: 200px;\">Search Using Annotation</a><br>\n\n## 案例 2 – 读取多个表单字段\n\n我们刚刚学习了如何读取单个请求参数。现在，让我们创建一个表单来接收\
    \ ID、名称和地址：\n\n```html\ncontactForm_old.jsp\n<form method=\"POST\" action=\"addContact.htm\"\
    >\n  <h2><center>Contact Registration</center></h2>\n  <table width=\"100%\" height=\"\
    150\" align=\"center\" border=\"0\">\n    <tr>\n      <td width=\"50%\" align=\"\
    right\">ID</td>\n    \n```\n*(注：原文中第 62-63 页的 OCR 文本高度碎片化/损坏。根据 Spring MVC 表单绑定的上下文，我已重构了逻辑流。)*\n\
    \n## 表单对象 (Form object)\n\n用户填写的对象被称为表单对象。在 Spring 中，它被称为命令对象（command object）。\n\
    \n让我们开始开发表单绑定的过程。\n\n- 1. 为了在表单页面实现命令对象，我们必须添加一个方法来创建命令对象并使其可用。我们将创建一个可用的 `Contact`\
    \ 类对象。在 `com.pack.03.pojo` 中声明联系类（POJO），数据成员 `firstName`、`lastName`、`email` 为\
    \ `String` 类型，`gender` 为 `int`。\n\n```java\n@RequestMapping(\"/showForm.htm\"\
    )\npublic ModelAndView showContactForm(HttpServletRequest request, HttpServletResponse\
    \ response, ModelMap map) throws Exception\n{\n    Contact contact = new Contact();\n\
    \    map.addAttribute(contact);\n    return new ModelAndView(\"contactForm\");\n\
    }\n```\n"
