    frequently changed. A good design perspective is to try writing a module which

    will be highly cohesive.


    The two modules developed separately will need to have interaction. To make

    them interactive, we have to introduce them. This will be done by making them

    dependent on each other. This dependency is termed **coupling**. When the code
    size

    and number of modules are small, coupling won''t be a problem. But in an enterprise

    application, the code size is huge. Any little makes a difference and then

    all of its dependencies should be changed accordingly at a number of places.

    This makes the code unmanageable. So it''s always recommended to have loosely

    coupled modules.


    # The practical aspect


    Let''s take the example of a desktop, the one we use in our routine. A desktop

    consists of a monitor, CPU, keyboard, and mouse. If a new monitor with some

    advanced features is introduced in the market, what will we do? Will we buy

    a new desktop or replace the monitor?


    As per the convenience and also the cost, it''s feasible to replace the monitor

    not the whole desktop; how is this possible? It''s possible because the

    desktop is assembled with subunits, which are easily replaceable. Each subunit
    is

    hesive for the work and they are not tightly coupled. This happens when we use

    modularization. When we write an application that uses similar concepts, it is
    called

    modular programming.'
