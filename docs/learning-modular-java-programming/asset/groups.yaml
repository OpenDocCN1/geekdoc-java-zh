    # Case 5 – Logout


    Once the authentication process is done, the user will be able to browse freely
    to access the data from the Web; login recognizes the user. In the same way, when
    a user completes the work, the user needs to log out so as not leave his information
    open for browsing. To provide a logout mechanism, we need to perform the following
    two steps:


    +   - Provide a link to log out

    - Configure logout in spring-security.xml to redirect the user to the page which
    can be publicly accessible


    Let''s implement it in our application with the help of the following changes:


    +   1. In the header.jsp file, add a Logout as follows:

    <a href="<c:url value=''_spring_security_logout''/>" style="font-size: large;
    font-family: New Roman; font: bold;">Logout</a>


    +   2. In config, configure the <logout> as:

    <security:logout invalidate-session="true"

    logout-success-url="/index.jsp"/>


    The preceding configuration tells the framework to redirect to index.jsp page
    on logout and invalidate the session so the information will be accessible after
    logout. We are set to check the logout functionality in our application. Now we
    will have Logout as a link on every page as shown in the following screenshot:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_183_0.png)'
