  - "[PAGE 148]\n\n# Testing Your Application\n\nThe following are the two ways to\
    \ create an object of MockMVC:\n\n+   * With loading the Spring configuration\
    \ as follows:\n```java\n@RunWith(SpringJUnit4Runner.class)\n@EnableWebConfiguration\n\
    @ContextConfiguration(\"Data-servlet-context.xml\")\npublic class MyControllerTests\
    \ {\n\n    @Autowired\n    private WebApplicationContext w;\n\n    private MockMvc\
    \ mockMvc;\n\n    @Before\n    public void setup() {\n        this.mockMvc = MockMvcBuilders.webAppContextSetup(this.w).build();\n\
    \    }\n}\n```\n\n+   * Without loading the Spring configuration:\n```java\npublic\
    \ class MyControllerTests {\n\n    private MockMvc mockMvc;\n\n    @Before\n \
    \   public void setup() {\n        this.mockMvc = MockMvcBuilders.standaloneSetup(new\
    \ AddController()).build();\n    }\n}\n```\n\nStandalone setups are closer to\
    \ unit testing as they test one controller at a time. Standalone needs to inject\
    \ the dependencies with mocks manually. To create a mock object, mocking frameworks\
    \ such as EasyMock and Mockito can be used. Standalone setups are more focused\
    \ on finding out if any Spring MVC configuration is required. When the Spring\
    \ configuration is loaded and used, it is integration testing and not unit testing\
    \ with the help of the TestContext framework. Before going into how to implement\
    \ MockMVC testing, let's have a look at MockMVC and the methods it provides for\
    \ testing."
  - '[PAGE 149]


    To create an object of MockMVC, the MockMvcBuilders.XXX method will be used to
    show above. It has just created an object which now needs an initialization of
    the method to invoke from the controller. To invoke the controller method, we
    need to tell which method to invoke and the URL on which the method will be invoked.
    MockMvcRequestBuilder helps to build URLs with get, post, and delete many more.
    The code will be like the following:


    ```

    mockMvc.perform( MockMvcBuilders.post("/addContact.htm"))"

    ```


    If the /addContact URL is not required to have any initialization such as request
    parameters or anything else, we are set to start with testing. But sometimes,
    the demand of the method can be greater. In order addContact() from spring is
    expected to have @ModelAttribute which accepts the object of contact on form submission.
    Handle form submission, contactType() has to be used along with form parameters
    and their values. Once the initialization is completed, it''s time to cross-check
    the result. The expect() method helps us to test the results with MockMvcMatchers
    has methods such as view(), model(), json(), content(), and cookies() for helping
    us in testing. We will use these practically in the upcoming examples to carry
    out mock testing.


    We have done a lot on unit testing. Now let''s discover the integration testing
    with MockMVC in Spring.


    # Why integration testing?


    In real-world software development, each application development is divided into
    a number of small modules. These modules will be developed by different developers.
    It''s very important to find out how separately developed modules when combined
    together are working. Each application is developed in different layers, such
    as UI, business layer, and DAO layer. In each layer, the data which is accepted,
    processed, and may be in a different format. So it''s very important to find out
    whether the data passed and collected is correct or not, otherwise there will
    be a manipulation problem. Integration testing is also important as developers
    face a big problem in meeting continuous changes in requirement. Integration testing
    helps to find out problems of collaboration on layers at an early stage instead
    of getting it in later stages of development.


    Let''s implement this in our application to form validation:


    +   1. Create a new JUnitTest case TestAddController_standalone in the com.packt.ch06.controllers.test
    package.

    2. Declare MockMVC and AddController as data members.'
