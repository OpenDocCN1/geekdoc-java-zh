    ## 5 业务层的开发


    在每个应用程序中，都有许多可用的组件。有些处理用户界面，有些处理数据库，有些则处理配置。但决定如何处理数据的核心组件是业务组件。业务组件将以极其谨慎的态度参与数据处理，以确保不会出现混乱；无论是在数据端还是在应用程序流端都是如此。这些组件的职责是通过应用某些数学公式和特定的业务规则来操纵数据。这些组件将参与对数据处理做出各种决策，并在应用程序中往复运行。


    应用程序将由多个层组成，包括表现层、数据存储层和业务逻辑层。数据访问对象（DAO）层和表现层分别负责向数据库层添加数据以及从用户处接收数据。这两个层都涉及数据的处理。这些层并不是逻辑部分，不是决策所在，也不是数据操纵将如何进行。这些层不参与任何决策制定，也不做决定。这个模块将在未来出现。它们在任何地方检查数据是否被插入、更新，以及它们是否删除了正确的层。这导致了诸许多问题，如维护数据一致性、应用错误的业务公式、调用错误的模块；最终导致应用程序在市场上失败。也就是说，开发一个能够正确实现业务逻辑正确应用程序流是开发者的责任。他们需要理解业务流程，并据此构建相互通信的模块，为问题提供正确的解决方案。如果他们获取的业务逻辑错误，那么在应用程序执行时就会出现错误。


    ### 开发层


    我们在前两个章节中讨论过的两个层都有各自需要执行的职责。现在是我们需要讨论最重要的层：业务层。事务管理是业务逻辑中的此类关注点之一。事务管理帮助开发者通过
    `commit`（提交）或 `rollback`（回滚）方法维护数据的一致性。同样，还有其他方法可以维护项目的逻辑部分。


    在本章，我们将讨论以下主题：


    - 如何实现业务层

    - 如何与业务层通信

    - 如何封装各个层以进行协作


    ## 业务逻辑


    让我们通过几个场景，以简化的方式详细讨论一下到底什么是业务逻辑：


    - 场景 1：让我们讨论一个非常简单的银行例子。银行持人的常用操作是存款和取款。每家银行对维持最低余额都有特定的规则。账户持有人不能提取低于此最低余额的金额。我们记住，每家银行都有关于最低余额的一套规则，例如，SBI
    是 500 卢比，HDFC 和 ICICI 是 5,000 卢比，等等。账户的最低余额可以是零余额账户。再次，这些规则根据你拥有的账户类型而变化：例如，工资账户可以作为银行业务政策的一部分以及与公司的合作提供的。在持久化层中，开发者将编写代码，使得每次取款、更新后的余额、取款金额以及交易的其他细节将存储在数据库表中。但在这里他们也必须遵循最低余额规则，以确保最低余额达到限额。他们将在每次取款前检查最低余额和账户类型来实现。


    - 场景 2：让我们讨论第二个场景。每家银行都有许多用户，专门分为两类银行账户：储蓄账户和活期账户。储蓄账户持有人利用银行提供的余额利息。但活期账户持有人没有这种待遇。在财年底，每家银行都会向账户持有人发放年利。这种利息必须根据账户类型和账户金额进行计算。


    这也可以取决于账户上进行的存款和取款交易。因此，在计算利息时，所有这些因素都必须仔细考虑。


    定期存款也会计算利息。所有银行都为客户提供定期存款服务。利率根据存款金额、存款期限和存款人的年龄按照标准而异。当开发者开发此类模块时，他们必须考虑多种场景，其中规则和公式将取决于某些场景。这是正常情况，但有时账户持有人想在期限结束前提取定期存款。仅仅从用户处接收数据并添加到表中将无法完成流程，而在接收数据的同时，还应该根据上述讨论的条件进行处理。


    - 场景 3：我们讨论一个基于铁路预订的场景。在铁路预订时，我们选择特定的火车和旅行日期。我们检查是否有座位并开始订票流程。当订票过程开始时，向我们显示一些可用座位。然后我们选择座位，现在进入支付模式，这可能会花费大量时间。期间，所有可用票已被其他旅客预订，没有座位可用。由于不知道无法获得确认票，我们作为用户感到沮丧，因为支付已经完成，我们无法撤销。……通过撤销订票来处理已交易的模块。订票和转账是开发者的任务，但在订票的同时，开发者需要考虑订票成功和失败的情况。在订票成功的情况下，用户应该获得订票详情。如果订票失败，应在
    UI 上显示相应的消息。


    上述所有场景都提供了开发正确业务逻辑的意义；如果这个模块失败，整个业务将会崩溃。开发业务逻辑既简单又复杂。它是简单的，因为要做的公式和决策对你来说是知的；它是复杂的，因为我们首先需要了解我们正在开发的领域。你应该具备流程知识，而且最后，你应该意识到要应用的规则。简单来说，没有硬性规定——一切都取决于！


    ### 开发业务层


    当有人想要开发任何类型的业务层时，有许多需要考虑、理解并谨慎记忆的事项。我们大多数人认为开发业务层是很的。大多数时候，这仅仅是因为缺乏知识，我们不知道从哪里开始以及如何开始。


    ## 领域知识


    在讨论为什么领域知识很重要时，我们讨论了许多场景。在每个场景中，我们使用了许多技术术语，如最低余额、利率、定期存款、储蓄账户、预订等。许多术语用在我们的日常生活中；有些并不常用，但我们很知晓。当一个团队进入任何领域（如银行、预订、旅行和保险）时，他们需要理解相应领域使用的基础术语。他们需要理解这些术语的重要性以及何时使用。他们还应该具备相应情况的条件知识。


    获取对某个领域的专业知识和彻底了解就是领域知识。领域知识的示例包括：


    - 会计系统、步骤和流程知识

    - 人寿保险知识

    - 税收领域知识

    - 制造业知识

    - 电子商务知识


    获取领域知识是一项耗时的任务。


    '
