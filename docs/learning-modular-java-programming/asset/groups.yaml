    # Distributed versioning


    Opposite to centralized versioning, all copies of the application will be kept
    on the developer''s machine, for example, GitHub.


    # GitHub


    In opposition with CVS, GitHub uses a distributed approach. The basic idea behind
    GitHub is to speed up versioning. GitHub is also developed on Linux. It is also
    available on Windows.


    A good thing about GitHub is that it helps the user to navigate through the history.
    Each instance of the source contains the entire history so even when they are
    not connected. Due to the availability of files, branching is well supported,
