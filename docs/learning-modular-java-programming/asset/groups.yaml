    ```

    <property name="initialSize" value="5" />

    <property name="maxActive" value="10" />

    </bean>

    ```


    # Getting data sources from the JDBC driver


    This is the simplest way to configure the JDBC driver. There are two classes offered
    by Spring which can be used to get reference of data sources, as follows:


    +   - DriverManagerDataSource: The DriverManagerDataSource class returns a new
    connection every time the developer requests for the connection along with multithreaded
    support.

    - SingleConnectionDataSource: The SingleConnectionDataSource returns the same
    connection every time a connection is requested by the developer. As every time
    the same object is returned, it doesn''t perform well in multithreaded applications.


    In the way which we are going to configure the data source as follows:


    ```

    <bean id="dataSource"

    class="org.springframework.jdbc.datasource.DriverManagerDataSource">

    <property name="driverClassName" value="com.mysql.jdbc.Driver" />

    <property name="url" value="jdbc://localhost:3306/TEST" />

    <property name="username" value="root" />

    <property name="password" value="mysql" />

    </bean>

    ```


    Both of these cannot provide support for a connection pool.


    # Types of integration of JDBC


    We can use the integration of JDBC in the three ways:


    +   - Integrating the DataSource to get a connection reference

    - Integrating JdbcTemplate

    - Integrating JdbcDaoSupport


    They are explained in the following sections.'
