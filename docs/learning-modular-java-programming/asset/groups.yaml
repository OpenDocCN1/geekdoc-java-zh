    After developing the above application, we now have a sound knowledge of how

    web development happens, how to manage the flow, and how navigation happens.

    We can observe one more thing: that whether it''s searching data, adding data,
    or any

    other kind of operation, there are certain steps which are common, as follows:


    +   - Reading the data

    - Binding this data to a domain object in terms of model data

    - Sending the response


    We need to perform one or more of the above steps as per the business requirement.

    Obviously, updating a contact, or only performing the above steps, will not be
    able to achieve the

    end effect but there is no alternative. Let''s discuss an example.


    We want to manage our contact list. We want to have the facilities for adding
    a new

    contact, updating searching one or more contacts, and deleting a contact.

    The required data will be taken from the user by asking them to fill in a form.
    Then

    the data will be persisted in the database.


    Here, for example, we want to insert the record in the database. We have to start

    coding from managing request data, binding it to our object and our business

    operation. The programmers have to unnecessarily repeat these steps. Can''t

    get rid them? Is it possible to automate this process?? This is the perfect time

    to discuss frameworks.


    # # What is a framework?


    A framework is software which gives generalized solutions to common tasks which

    occur in application development. It provides a platform which can be used by
    the

    developers to build up their application elegantly.


    # ## Advantages of frameworks


    The advantages of using frameworks are as follows:


    +   - Faster development

    - Easy binding of request data to a domain object

    - Predefined solutions

    - Validations framework'
