    \ list.\n- 2. Invoke the validate method of the Validator and pass to it the object\
    \ to validate and the object of BindingResult to whom validation errors will be\
    \ bounded.\n- 3. Check whether the object of BindingResult has errors or not.\
    \ If errors occur, then the same form where the user submits the values has to\
