    # Distributed versioning


    Opposite to centralized versioning, in distributed versioning all the copies of
    an application will be kept on the developer''s machine, for example, GitHub.


    # GitHub


    In opposition with CVS and versioning, GitHub uses a radial approach. The basic
    idea behind GitHub is to speed up versioning. GitHub is also developed on Linux.
    But it is also available on Unix native ports of GitHub and Windows operating
    systems. This thing being a non-central server, it doesn''t lend itself to single
    developer projects or small projects.


    A good thing about GitHub is that it helps the user to navigate through the history
    of the file. Each instance of the source contains the entire history tree so as
    to track the changes even when they are not connected to the Internet.


    Due to the availability of the tracking of files, branching is well supported
    by GitHub, but it has limited support for Windows.


    # Summary


    In this chapter, we covered that enterprise applications are the applications
    which provide solutions to enterprises. These applications consist of huge code.
    To increase maintainability, performance, and testability, such applications will
    be developed in tiers. These tiers consist of logical separation of code using
    layers. Though each layer provides specific functionalities, they have been divided
    into separate modules. These modules will be developed by a team of developers.
    To establish coordination, easy sharing and maintaining the history of the files
    will be done using a versioning tool.


    In the next chapter, we will be covering the basics of web applications and developing
    a sample application using JSP and Servlet. Also, we will be covering the basics
    of developing a Spring MVC application.'
