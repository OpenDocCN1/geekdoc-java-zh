    Though we achieve abstraction, what if there are multiple fields in the form?
    We need to read them individually using multiple @RequestParam in the method signature.


    Let''s discuss how to make this simple using Spring MVC.


    We use @RequestParam as we want to get the object of class Contact without reading
    individual form parameters and setting them. Here, the reading is without using
    servlet APIs but we can still sophistic the process and get the customized object
    of Contact. This can be done by using a form backing object followed by reading
    the data in the controller.


    # Form backing object


    The object that is used to collect the values which the user has filled in the
    form is called a form backing object. In Spring, the same terminology can be referred
    to a command object. This object contains the data that the user has filled in
    and will be able to retrieve in the controller with the help of的话. Now the question
    arises, how to create, get, and use this command object? This can be easily explained
    with the help of the last example which we discussed.


    The command object collects the values filled by the user. It means that the page
    where the user fills in the data already needs to have an available object. It
    won''t be possible with HTML tags, but it''s quite easy with the tags provided
    by Spring. When the user submits the form, we will use a command object in the
    controller. In order to use the command object, we need to change the signature
