    right\">FIRST NAME</td>\n  <td width=\"50%\" align=\"left\">\n</tr>\n<form:input\
    \ path=\"firstName\" size=\"30\" />\n  <font color=\"red\">\n\n## 实现表现层\n\n```\n\
    <form:errors path=\"firstName\" />\n</font>\n</td>\n</tr\n```\n\n我们在这里的设计是：如果数据成员\
    \ `firstName` 的验证失败，消息将以红色显示。\n\n在提交带有某些验证错误的表单时，最终输出如下：\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_78_0.png)\n\
    \n让我们进一步深入研究注解验证。\n\nSpring 支持 JSR-303。JSR-303 是一种 Bean 验证规范。它是为了给开发者提供模型约束所需的通用验证解决方案而开发的。开发者可以结合\
    \ Spring 使用 HibernateValidator 框架来减少代码量。以下是开发者频繁用于对字段或属性设置约束的几个验证注解：\n\n| 注解 |\
    \ 用途 |\n|---|---|\n| @Length(min=, max=) | 验证注解字符串是否在 min 和 max 之间（包含边界） |\n|\
    \ @Max | 检查注解值是否小于等于指定的最大值 |\n| @Min | 检查注解值是否大于等于指定的最小值 |\n| @NotNull | 检查注解值是否为空\
    \ |\n| @NotEmpty | 检查注解元素是否不为且且为空 |\n| @NotBlank | 检查注解字符串是否不为空且修剪后的长度大于 0 |\n\
    \n## 第 3 章\n\n| 注解 | 用途 |\n|---|---|\n| @Pattern(regex, flag= | 在考虑给定 flag 匹配的情况下，检查注解字符串是否匹配正则表达式\
    \ |\n| @Size(min, max=) | 检查注解元素的大小是否在 min 和 max 之间（包含边界） |\n| @Valid | 对关联对象执行递归验证\
    \ |\n\n与其硬编码值，最好的做法是将它们外部化到属性文件中。名称和位置可以是任何值。我们只需要在 Spring 配置文件中配置我们选择的文件内容和文件位置即可。此属性文件将包含格式如下的数据：\n\
    \n```\nKey = value\n```\n\n我们在编写属性文件以外部化消息时遵循的格式是：\n\n```\nAnnotation_name.attribute_name.property_name\
    \ = 待显示的消息\n```\n\n在我们的案例中，我们使用了：\nEmpty.contact.firstName=Pleaseentryyourfirstname\n\
    \n现在我们了解了如何处理表单，是时候处理数据了。我们想要向用户显示的数据，或者想要让用户从下拉菜单中选择要删除的记录，都是数据预期从 Spring 控制器检索的情况。为了让数据在表现层可用，我们必须将其添加到\
    \ `ModelMap` 对象中。该对象随后可以被用于获取与之关联的值。\n\n以在浏览器中显示联系人列表为例。由于我们没有创建数据库和相关的持久层，我们将在这里使用静态数据。按照以下步骤添加显示数据的功能：\n\
    \n- 1. 在索引页面上添加一个“显示所有记录”的链接，并以 `showRecords.htm` 作为操作 URL。\n- 2. 在 `AddController`\
    \ 类中添加 `showAllContacts(ModelMap map)` 方法，使用 URL 映射 `showRecords.htm`。\n- 3. 实现创建联系人列表并添加到\
    \ map 对象的方法，并返回联系人列表的视图。\n- 4. 创建 `showContact.jsp`。使用 JSTL 的 `out` 和 `foreach`\
    \ 标签显示数据。\n\n## 实现表现层\n\n（注：原文后续存在大量重复内容，已根据逻辑流进行处理。）\n"
