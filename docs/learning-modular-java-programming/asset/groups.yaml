    \n`rejectValue()` 方法用于向错误对象中添加验证错误。该方法接受以下三个参数：\n\n- 错误所关联的字段\n- 充当消息键的错误代码\n\
    - 验证失败时要显示的消息\n\n- 1. 一旦自定义验证器准备就绪，现在是时候使用它进行验证了。编写 `validate()` 方法如下：\n```java\n\
    public void validate(Object object, Errors errors) {\n```\n\n- 2. 现在我们需要为我们开发的\
    \ `Validator` 类配置 bean。配置如下：\n\n```xml\n<bean id=\"validator\" class=\"com.packt.ch03.validators.ContactValidator\"\
    /></bean>\n```\n\n- 3. 如果发生验证错误，我们需要在每个字段的同一个表单中将它们显示给用户。为了实现这一点，HTML 代码需要更改如下：\n\
    \n```html\n<tr>\n<td width=\"50%\" align=\"right\">First NAME</td\n<td width=\"\
    50%\" align=\"left\">\n<form:input path=\"firstName\" size=\"30\"/>\n<font color=\"\
    red\">\n<form:errors path=\"firstName\"/>\n</font>\n</td>\n</tr>\n```\n\n## 基于注解的验证\n\
    \n要根据 JSR 303 进行表单验证，我们需要遵循以下步骤：\n\n- 1. 创建一个动态 Web 应用 Ch03_FormValidationAnnotation，它是\
    \ Ch03_FormHandling 的副本。\n- 2. 更新 POJO 类，在数据成员上应用注解。其实现方式如下：\n\n```java\npublic\
    \ class Contact {\n  @NotEmpty\n  @Length(min=2,max=10)\n  private String firstName;\n\
    \  @NotEmpty\n  private String lastName;\n\n  private int gender;\n  @NotEmpty\n\
    \  private String address;\n\n  @NotEmpty\n  @Email\n  private String email;\n\
    \n  @NotEmpty\n  @Pattern(regexp=\"^[0-9]{10}$\")\n  private String phone_number;\n\
    \n  // getter and setter method\n}\n```\n\n- 3. 必须触发这种验证。触发的方法之一是在待验证类型的参数上使用\
    \ `@Valid` 注解。接收提交表单数据的控制器方法如下：\n\n```java\n@RequestMapping(\"/addContact.html\"\
    )\npublic ModelAndView addContact(@Valid @ModelAttribute(\"contact\") contact,\
    \ BindingResult result) throws Exception {\n    if (result.hasErrors()) {\n  \
    \      return new ModelAndView(\"ContactForm\");\n    }\n    return new ModelAndView(\"\
    manageContact\", \"id\", contact.getEmail());\n}\n```\n\n- 4. 现在我们需要配置放置所有错误消息的文件名。这将通过配置\
    \ `messageSource` bean来实现，它将告诉框架消息文件的基础名称，如下：\n\n```xml\n<bean id=\"messageSource\"\
    \ class=\"org.springframework.context.support.ReloadableResourceBundleMessageSource\"\
