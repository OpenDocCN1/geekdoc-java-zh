    # The gang – modular programming


    Modular programming is the process of dividing a problem into smaller subunits
    and then making them interact with each other. Each subunit will revolve around
    a part of the problem. These subparts are quite easily replaceable or reusable.
    This designing technique gives a helping hand to the developers to develop their
    individual units and later combine them. Each subpar can be turned into a module.
    The developers do not need to know what the other modules are or how they have
    been developed. Modularizing the problem will help the developers to achieve cohesion.


    # The world of modules


    The pluggable component which can be easily integrated into the application will
    provide the solution to a particular problem. For example, we want an Eclipse
    to support Subversion (SVN) (one of the versioning tools). Now, we have two choices:
    to start the development of Eclipse from scratch or to develop an SVN application.
    If we choose the first, it is very time-consuming and we already have Eclipse
    in a working condition. Why start it from scratch? Yes, it is a very bad idea.
    But it would be great to have an SVN solution to develop separately as a SVN plugin
    that can be easily integrated into Eclipse. See how the two modules—Eclipse, which
    was in working and the new SVN module—have integrated with NetBeans (one of the
    IDEs). If we developed any application, from our point of view, it is always the
    best. But being a good developer, we need to be sure of it or not? Yes, we need
    to check whether each part is working correctly or not. But is it really simple?
    No, it''s not. Just because of complicated logic but due to its dependency. Dependency
    is a factor which is not under the control of the developer. For example we need
    to check whether our credentials are correct or when I am trying to login. We
    don''t want to test the tables where the data is stored, but we want to check
    whether the logic of tracking the data is correct or not. As we have developed
    a system with success, the testing becomes easy. In Java, a simple function can
    be tested with JUnit.


    Testing the developer to test an application which processes the data and provides
    an output. If we are getting the correct result, we do not have a problem, but
    what if the output is wrong? The process of finding bugs in a module is called
    debugging. The debugging helps us to detect defects in an application. That means
    we need to track the flow and then find out where the problem started. It''s quite
    difficult to find the defect if the system is without modules or if the modules
    are tightly coupled. So it''s good programming practice to write an application
    which consists of highly cohesive, loosely coupled modules.


    Chapter 1


    There is one more fact which we need to discuss here. Sometimes, the actual main
    development is progressing, we come across a point where we actually want to add
    a new feature. This new feature was not added while the basic discussion was going
    on; here, we want to do parallel development. In this case, we don''t want to
    replace the previous development but we want to support or enhance it. As our
    application consists of modules, a developer can go ahead; most of these modules
    are independent and can be reused.


    # Tiers and layers in an enterprise application


    Layers are a logical separation of the code to increase maintainability. But when
    we physically move one typical layer and deploy it on another machine, then it
    will be called as a tier. At any one time, many users will be using the enterprise
    application simultaneously, so the use of a tiered application provides good performance.


    Let''s consider a web module for login. The user will open the browser and the
    login page will be rendered. The user will enter their credentials (username and
    password). After submitting the form, a request will be sent to the server to
    perform the authentication. Once the data is received on the server side, the
    business logic layer will process the data and put the result in the response.
    The result depends on whether the credentials are present in the database or not.


    # Introducing Modular Programming


    Finally, the response will be generated and the result will be sent back to the
    browser. Here, the user interface, business logic, and database are the three
    distinct features involved. These are called as the presentation layer, business
    logic layer, and data storage layer, respectively.


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_22_0.png)


    Each of these layers will talk with the above layer and exchange data. The process
    broadly takes place as follows:


    - The user will open the browser and hit the URL. The login page will be rendered
    on the browser.

    - The user will enter their credentials and submit it to be processed by the business
    logic layer.

    - To check the data, the business logic layer will communicate with the data storage.

    - According to the result returned from the data storage, the business logic layer
    will send the result to the presentation layer.


    Now we understand the difference between a tier and layer, let''s discuss tiers
    in detail. Depending on a one-tier, two-tier, or multi-tier application.


    # One-tier applications


    An enterprise application where all the components reside on a single computer
    will be called one-tier application. These applications can also be called single-tier
    applications. So we can broadly say that these are applications which get installed
    and run on a single computer.


    For example, an Eclipse application as software. When we install and launch it,
    it will be running on personal computer. It doesn''t require any network. The
    presentation layer, that is GUI, business logic, and storing information will
    be done on the same computer.


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_23_0.png)


    # Two-tier applications


    When the enterprise application gets divided over two computers, it will be called
    two-tier application. Generally the data storage, that is, the database, will
    be moved onto a separate, dedicated computer. This will work as database host
    machine or database server. The presentation layer and business logic layer will
    be residing in one location and data layer in another.


    An example of this is the Oracle database management system. When we want to use
    Oracle database, we will install Oracle on a dedicated machine which can be called
    the Oracle server. Now, on the user''s machine, we can install the Oracle client.
    Whenever we want to fetch data from the table in Oracle, we will use the client
    application, which will connect to the server and give the required data.


    # 2-Tier Deployment


    Clients & Database are on the same Network (LAN)


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_24_0.png)


    # Three-tier applications


    When in an application, the presentation layer, business layer, and data layer
    will be running on their dedicated servers and interact with each other through
    a network, it will be called a three-tier application. The web server is dedicated
    to the presentation layer, the middleware server is dedicated to the business
    layer, and the database server is dedicated to the database layer. The middleware
    server can also provide services such as transaction and connection pooling.


    For example, any online shopping application can be considered a three-tier application.
    Let''s see how. In this application, the products will be displayed on a browser
    in presentations. The business logic part, such as the calculation of discounts,
    the total amount which the buyer has to pay, and so on, using transaction or messaging
    services, will be provided by the application server. The buyer''s information,
    product information, bank details, delivery address, and so on, will be saved
    in the tables on the database server for further reference. That means the presentation
    tier, application tier and data tier are the three tiers which play roles in this
    application.

    '
