  md: '# Case 2 – Login form authentication


    In the preceding application, we have used the login from Windows, but sometimes
    a customized login form will be the requirement of the project. Let''s rewrite
    some part of the code which allows us to use a customized login form. In order
    to incorporate the new configuration, we need to change a few configurations as
    follows:


    Change the <http> configuration to support login authentication as follows:


    ```

    <security:http auto-config="true">

    <security:intercept-url pattern="/showForm.htm" access="ROLE_ADMIN">\n<security:form-login
    login-processing-url="/j_spring_security_check">

    <login-page="login.jsp" default-target-url="/index.jsp" authentication-failure-url="login.jsp?error=error"
    />

    ```


    The <form-login> takes the following attributes :


    +   - URL: This is a value /j_spring_security_check that acts as the action in
    the form which the user is going to submit.

    - Login-Page: This is login.jsp where the user enters the credentials.

    - Default url: This will be /index.jsp.

    - Authentication-failure-url: It has /login.jsp?error=error, a URL where the user
    is redirected if the authentication fails and the message to be shown to the user
    be fetched from the request error.


    +   Create a login.jsp page to take user credentials. The values of the action,
    name, and password attributes are fixed so as to trigger the security mechanism.
    Display the message to the user using an error parameter. The code will look like
    this:


    ```

    <html>

    <body>

    <jsp:include page="WEB-INF/jps/header.jsp"></jsp:include>

    <c:set var="error" value="${param.error}"></c:set>

    <c:if test="${error.equals(''error'')}">

    <c:out value="please provide correct credentials"></c:out>

    </c:if>


    <c:if test="${not empty msg }">

    <c:out value="${msg}"></c:out>

    </c:if>

    ```'
