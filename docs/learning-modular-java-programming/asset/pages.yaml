    # Spring Security using pointcut


    Sometimes in the application, more than one method needs to be secured. Putting
    constraints on the one-by-one method will not be good practice. In such cases,
    authorization can be applied using point cut. To use pointcut <protect-pointcut>
    as follows:


    ```

    <global-method-security>

    <protect-pointcut access="ROLE_ADMIN"expression=

    <execution(* com.pack.ch07*.showContactForm(*)) />

    </global-method-security>

    ```


    The preceding configuration restricts the access to showContactForm to the users
    who have the ADMIN role.'
