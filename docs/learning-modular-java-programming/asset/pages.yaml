  md: "# Way 1 – Spring Security for URL using servlet filters\n\nThe following diagram\
    \ illustrates the working of Spring Security using servlet filters:\n\n![](img/8c4e088a46790c3b87b9ac174b3fd0a5_169_0.png)\n\
    \nThe process can be described as follows:\n\n+   - When a request for a resource\
    \ is raised, it will first be compared to the URL mapped in web.xml for <filter-mapping>.\
    \ If a match is found, the request is delegated to the bean having the ID `springSecurityFilterChain`.\n\
    - This `springSecurityFilterChain` returns an instance of the `filterChainProxy`\
    \ bean, which consists of a list of security filters defined in the Spring context\
    \ to invoke, which provides security. The initialization of `filterChainProxy`\
    \ and its registration in a Spring context takes place when HttpSecurityBeanDefinitionParser\
    \ reads `<http> using spring the security namespace.\n- Let’s take the `filterChainProxy`\
    \ initialization a bit further. Let us assume we have written a very basic configuration\
    \ of `<http>` as:\n```xml\n<http>\n  <form-login>\n  <http-basic>\n  <logout>\n\
    ```"
  merge: -1
  pgno: 169
- img_proc: true
  md: "# Securing the Application\n\nThe &lt;http&gt; sets up the FilterChainProxy\
    \ which is delegated to DelegatingFilterProxy which has been configured in the\
    \ web.xml. The default &lt;http&gt; block creates SecurityPersistenceFilter, ExceptionTranslationFilter\
    \ and filterSecurityInterceptor. The above configuration adds three filters as\
    \ BasicAuthenticationFilter, LogoutFilter, and UsernamePasswordAuthenticationFilter\
    \ in the filter chain. By default, FilterChainProxy initializes a series of filters\
    \ to be invoked. It can also be possible to choose the filters to be invoked in\
    \ FilterChain by defining our configuration as:\n\n```\n<bean id=\"FilterChainProxy\"\
    \ class=\"org.springframework.framework.security.web.FilterChainProxy\">\n  <filter-chain-map\
    \ path=\"/\" filters=\"none/>\n  <filter-chain-map path=\"/addContact.htm\" filters=\"\
    logoutFilter,formLoginFilter,exceptionTranslator,filterSecurityInterceptor\"/>\n\
    </filter-chain-map>\n</bean>\n```\n\nWe configure DelegatingFilterProxy in web.xml,\
    \ which delegates to the filter implementation that has been defined in the spring\
    \ application context as taking advantage of Spring Dependency Injection. Spring\
    \ loads the configuration file, and if it gets &lt;http auto-config=\"true&gt;\
    \ it sets it up. This is done by registering the filter stack, protected URLs,\
    \ and FilterChainProxy with the name 'springSecurityFilterChain'. So the name\
    \ of this filter is used to look up the filter bean, which has the same ID in\
    \ the configuration file. Alternatively, we can do the configuration in another\
    \ way, as:\n\n```\n<bean id=\"springSecurityFilterChain\" class=\"org.springframework.framework.security.web.FilterChainProxy\"\
    >\n```\n\nSpring provides many filters which can be used for Spring Security,\
    \ which got woven by the filter chain. Let's have a look at some of the filters:\n\
    \n+   * LogoutFilter: This filter checks if the request is for /j_spring_security_logout\
    \ to provide a default logout handler. If it is not a logout request, it will\
    \ be passed to the next filter.\n* BasicAuthenticationFilter: This filter attempts\
    \ the process of basic login authentication, if a header for basic authentication\
    \ is found in the request.\n* DefaultLoginPageGeneratingFilter: If the request\
    \ for /spring_security_login is received, it will return a default login form,\
    \ otherwise the request will pass to the next filter."
  merge: -1
  pgno: 170
- img_proc: true
  md: "+   * UsernameAuthenticationFilter: This filter checks for the request with\
    \ URL /j_spring_security_check to read values of j_username and j_password to\
    \ perform authentication using AuthenticationManager.\n\nIf we are using the default\
    \ configuration, then the Spring framework loads the following:\n\n+   * The authentication\
    \ manager to be used, which defines all the authentication providers available\
    \ for the application.\n* The authentication provider has implementation of UserDetailsService.\
    \ Spring loads the user login information in the UserDetailsService to perform\
    \ the comparison of authentication credentials.\n\nThe authentication information\
    \ can be stored in one of the two ways, as described:\n\n+   * In an application\
    \ context: The login information, along with user role, can be configured in the\
    \ XML file:\n```xml\n<authentication-manager id=\"authenticationmanager\">\n \
    \ <authentication-provider>\n    <user-service>\n      <user name=\"admin\" password=\"\
    admin\" authorities=\"ROLE_USER\"/>\n      <user name=\"guest\" password=\"guest\"\
    \ authorities=\"ROLE_USER\"/>\n    </user-service>\n  </authentication-provider>\n\
    </authentication-manager>\n```\n* In the database: If we want to check the login\
    \ data against the database, we need to provide the following configuration:\n\
    ```xml\n<authentication-manager id=\"authenticationmanager\">\n  <authentication-provider>\n\
    \    <jdbc-user-service data-source-ref=\"dataSource\">\n    </jdbc-user-service>\n\
    \  </authentication-provider>\n</authentication-manager>\n```\n\nThe dataSource\
    \ is another bean which is used to obtain the connection, as discussed in the\
    \ Spring-JDBC section:\n\n+   * The <http> configuration is checked to provide\
    \ the authentication mechanism. The authentication mechanism includes rendering\
    \ of the login page as follows:\n  * It checks the configuration for whether it\
    \ is basic authentication or form-based authentication. Depending upon the information,\
    \ a login page will be provided to the user where the credentials are entered."
