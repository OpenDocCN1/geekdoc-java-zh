  md: '# MVC II architecture


    In MVC II, a more powerful model has been put forward to give a solution to enterprise
    applications with a clear separation of work. It comprises two components: one
    is the controller and the other the view, as compared to MVC where view and controller
    is JSP (view). The servlets are responsible for maintaining the flow (the controller)
    and JSP to present the data (view). In MVC II, it''s easy for developers to develop
    business logic- the modules which are reusable. MVC II is more flexible due to
    responsibility separation.


