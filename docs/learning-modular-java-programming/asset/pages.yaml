  md: '# Chapter 2


    That''s what, as a developer we were looking for. The spring MVC can be integrated
    with technologies such as Velocity, Freemarker, Excel, and PDF. They can even
    take advantage of other services as aspect-oriented programming for cross-cutting
    technologies, transaction management, and security provided by the framework.


    # The components


    Let''s first try to understand the flow of normal web applications in view of
    the Spring framework so that it will be easy to discuss the component and all
    other details:


    +   1. On hitting the URL, the web page will be displayed in the browser.

    2. The user will fill in the form and submit it.

    3. The front controller intercepts the request.

    4. The front controller tries to find the Spring MVC controller and pass the request
    to it.

    5. Business logic will be executed and the generated result is bound to the ModelAndView.

    6. The ModelAndView will be sent back to the front controller.

    7. The front controller, with the help of ModelAndView, will discover the view,
    bind the data and send it to the browser.


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_47_0.png)


    Spring MVC


