    #  Case 3 – Authentication against database


    In cases 1 and 2, we authenticated the user against the data which is configured
    in the authentication provider. Instead of configuring in the XML, we can store
    the credentials in the database and use it for authentication. To use database
    authentication, we need to follow the following steps:


    +   1. In authentication-provider, instead of configuring a user service, we need
    to configure the `jdbc-user-service` as:

    ```xml

    <security:authentication-manager>

    <security:authentication-provider>

    <security:jdbc-user-service-id="userService"

    dataource-source-ref="dataSource"

    users-by-username-query="select username, password, enabled from contact_users-where
    username=?"

    authorities-by-username-query="select username, role from contact_users where
    username=?"

    </security:authentication-provider>

    ```

    * The `dataSource` bean will provide the details to obtain the connection

    * The `users-by-username-query` queries the database for a user''s username, password,
    and enabled status, given the username

    * The `authorities-by-username-query` queries the database for a user''s authorities
    given the username'
