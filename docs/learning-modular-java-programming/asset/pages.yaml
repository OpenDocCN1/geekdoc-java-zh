  md: '# The front controller


    As already seen in servlet JSP to maintain each flow of the application developer
    develop the servlet and data model from servlet will be forwarded to JSP using
    attributes. There is no single servlet to maintain the application flow completely.
    This drawback has been overcome in Spring MVC as it depends on the front controller
    design pattern.


    In the controller design pattern, there will be a single entry point to the application.
    Whatever URLs are hit by the client, it will be handled by a single piece of the
    code and then it will delegate the request to the other objects in the application.


    In Spring MVC, the DispatcherServlet acts as front controller. DispatcherServlet
    takes the decision which Spring MVC controller the request will be delegated to.
    In the case of a single Spring MVC controller in the application, the decision
    is quite easy. But we know in enterprise applications, there are going to be multiple
    Spring MVC controllers. Here, the front controller needs to find the correct Spring
    MVC controller. The helping hand is the configuration file, where the information
    to discover the Spring MVC controller is configured using handler mapping. Once
    the Spring MVC controller is found, the front controller will delegate the request
    to it.


    # Spring MVC controller


    All processes, such as the actual business logic, decision making or manipulation
    of data, happen in the Spring MVC controller. Once this model completes the operation,
    it will send the view and the model encapsulated in the object normally in the
    form of ModelAndView to the front controller. The front controller will further
    resolve the location of the view. The module which helps front controller to obtain
    the view information is ViewResolver.


    # ModelAndView


    The object which holds information about the model and view is called as ModelAndView.
    The model represents the piece of information used by the view for display in
    the browser of different formats.'
