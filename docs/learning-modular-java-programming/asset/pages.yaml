  md: '# The world of dotcoms


    In the 1990s, many people started using computers for a number of reasons. For
    personal use, it was really good. When it came to enterprise use, it was helpful
    to speed up the work. But one main drawback was; how to share files, data or information!
    The computers were in a network but if someone wanted to access the data from
    any computer then they had to access it personally. Sometimes, they had to learn
    the programs on that computer, which is not very time-consuming but also aending.


    What if we used the existing network to share the data remotely?? It was a thought
    put forward by a British computer scientist, Sir Tim Berners-Lee. He thought of
    a way to share the data through the network by exploring an emerging technology
    called hypertext. In October 1990, Tim wrote three technologies to fulfil using
    Hyper Text Markup Language (HTML), Uniform Resource Identifier (URI), and Hyper
    Text Transfer Protocol (HTTP):


    +   - HTML is a computer language that is used in website creation. Hypertext
    facilitates clicking on a link to navigate on the Internet. Markups are HTML tags
    defining what the text they contain.

    - URIs define a resource by location or name of resource, or both. URIs generally
    refer to a text document or images.

    - HTTP is the set of rules for transferring the files on the Web. HTTP runs on
    the top of TCP/IP.


    He also wrote the first web browser (World Wide Webapp) and the first web server
    (HTTP). The web server is where the application is hosted. This opened the doors
    to the new amazing technologies have been added to make the Web more realistic.
    This was just the beginning and many more technologies have added to the dotcom.
    Using HTTP and HTML, people were able to browse files and get content from remote
    servers. A little bit of user interaction or dynamicity was only possible through
    JavaScript. People were using the Web but not satisfied; they needed something
    more. Something which was able to generate output in a totally dynamic way, displaying
    the data which had been obtained from the data store. Something which can manipulate
    user input and display the results on the browser.


    Java developed one technology: Common Gateway Interface (CGI). As CGI was a small
    Java program, it was capable of manipulating the data at the server side and producing
    the result. When any user made a request, the server forward the edit to CGI,
    which was an external program. We got an output but with two drawbacks:


    +   - Each time the CGI was called, a new process was created. As we were thinking
    of a huge number of hits to the server, the CGI became a performance hazard.'
