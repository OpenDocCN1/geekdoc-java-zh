  md: '# #4 Talking to the Database


    On the web, browsing is a common task. The data for which the user is searching
    will be defined and stored somewhere so that it can be used whenever required.
    It is not necessarily only in a database; it can be in any format. Can we imagine
    a dynamic Web without storing data?? Quite difficult to imagine!! Starting from
    the login to the application and searching for a particular product from the user''s
    perspective, adding new products or updating the products from an administrative
    perspective, in every stage we handle data. In the previous chapter, where we
    discussed the presentation layer, we were accepting data from the user for registration,
    searching for a particular ID or when we needed to show the data to the user.
    But we were not able to save the data as there was no persistency layer included
    by us.


    In this chapter, we will add the persistence layer and find out the following:


    +   - How to implement the persistence layer to take data from the user

    - How to communicate with the persistence layer using Spring''s Hibernate template

    - How to set up JUnit and how to use it for testing a unit


    # Persistence


    Data storage is a very common and basic requirement of enterprise applications.
    Data storage ensures that the data collected from the user will be saved over
    time. The mechanism of saving data for the duration so as to make it available
    later is called *persistence*.'
