  md: "# Talking to the Database\n\nIn Hibernate APIs, there are some important classes\
    \ and interfaces which the developer commonly comes across:\n\n+   - Configuration:\
    \ The Configuration class is very important in hibernate as it has the responsibility\
    \ to get the database connection and the mapping for a class to the table:\n \
    \ - To handle the connection, hibernate uses a configuration file which has the\
    \ name hibernate.cfg.xml.\n  - Hibernate uses mapping files in order to map a\
    \ class to a table. The name of file is normally XXX. XXX will be replaced by\
    \ the name of the POJO to be mapped. But nowadays, instead of maintaining the\
    \ file, developers can also use annotations for the mapping.\n- SessionFactory:\
    \ It is a singleton, heavyweight class. The SessionFactory configures hibernate\
    \ for application using the configuration file and gives an object of Session.\
    \ As SessionFactory is a heavyweight object, the developer has to take care to\
    \ use a single object per application.\n- Session: Session is obtained from a\
    \ SessionFactory object. It's needed every time the developer deals with the database\
    \ to add a new record or load an existing record from a table. Session is lightweight;\
    \ when it gets instantiated, the connection is made with the database.\n- Query:\
    \ The Query interface lets the developer query the database, which is completely\
    \ dependent upon the object identifier.: When communication happens between the\
    \ database and the application, there is a fair chance of something going wrong.\
    \ This leads to inconsistency on the database side, which may affect the developer's\
    \ business logic. Transaction supports the development side, helping to maintain\
    \ integrity.\n\nLet's discuss a small application to get exposure to the hibernate\
    \ application in the XML. We will cover mapping using annotation in the next application.\
    \ We need to do the following steps:\n\n+   - Write a POJO whose object we want\
    \ to persist.\n- Map the POJO in a Hibernate bean mapping file with the name POJO_name.hbm.xml.\
    \ While writing the mapping, provide the identifier strategy and map all the data\
    \ members with the columns."
