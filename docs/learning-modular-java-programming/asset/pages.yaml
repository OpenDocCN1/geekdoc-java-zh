  md: '# Case 5 – Logout


    Once the authentication process is done, the user will be able to browse freely
    to access the data from the Web; login recognizes the user. In the same way, when
    a user completes the work, the user needs to log out so as not leave his information
    open for browsing. To provide a logout mechanism, we need to perform the following
    two steps:


