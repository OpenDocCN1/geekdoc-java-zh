    I am going to loan. Is there any way to revert what went wrong? Yes entirely!!
    Here we meant to take into consideration transaction management. A transaction
    is a bunch of consecutive operations which take place one after another; either
    all of these should be completed successfully or none of them. The transaction
    helps the developer to maintain data integrity. Using this concept, the rollback
