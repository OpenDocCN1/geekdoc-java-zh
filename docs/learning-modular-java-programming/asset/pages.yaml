  md: '# Securing the Application


    +   - If we are using basic authentication, the login credentials are sent to
    the server under the authentication http header. This now will be further handled
    by BasicAuthenticationFilter.


    +   - If we are using form-based authentication, the login credentials are checked
    against data provided by the spring context to authenticate the user.


    If the user gets authenticated with the help of the authentication mechanism,
    then it''s time to check the authorization:


    +   - The filter does the authentication for the roles and credential with the
    help of AuthenticationSuccessHandler. If all the information matches, the handler
    takes the user to the success page, otherwise AuthenticationFailureHandler redirects
    the request to the authentication page or the failure page respectively.


