  md: "# Case 4 – Remember me\n\nSome of the URLs from the applications need to be\
    \ secure but from the developer's point of view. The user never needs to get prompted\
    \ to enter the credentials every time.\nWe can have a remember me functionality,\
    \ which lets the user keep users' information stored so that next time they do\
    \ not have to authenticate themselves again. In order to provide the remember\
    \ me tag under, we need to do the following steps:\n\n+   1. Add a remember me\
    \ tag under `<http>`- which provides the \"remember me\" functionality. The updated\
    \ configuration will be as follows:\n```xml\n<security>\n  <http auto-config=\"\
    true\">\n    <security:intercept-url pattern=\"/showForm.htm\">\n    <security:form-login\
    \ login-processing-url=\"/j_spring_security_\n      authentication-failure-url=\"\
    login.jsp?default-target-url=\"index.jsp?error=error\"/>\n    <security:remember-me\
    \ key=\"contactdata\"\n      token-validity-seconds=\"2419200\"/>\n  </http>\n\
    </security>\n```\nThe remember me configuration takes two attributes, key and\
    \ token-validity-seconds. This functionality works on the principle of cookie\
    \ management. Whenever a user selects remember me, a cookie gets stored on the\
    \ client machine which by default stores the value of username, password, expire\
    \ date, and a private key in MD5 encrypted format. By default, the value of the\
    \ private key is SpringSecured and this cookie exists for two weeks.\nIn the above\
    \ configuration, we made the private key `contactdata` which is application specific\
    \ and it lasts for four weeks which is specified in seconds.\n\n+   2. We need\
    \ to update the login form as well as add Remember me as a checkbox, which has\
    \ the action `spring_security_remember_me`.\nThe code for it will be:\n\n```\n\
    <tr><td><input id=\"remember_me\" name=\"spring_security_remember_me\" type=\"\
    checkbox\" /></td>\n<td><label for=\"remember_me\">Remember me</label></td>\n\
    </tr>\n```"
