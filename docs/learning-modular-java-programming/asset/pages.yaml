  md: "# Chapter 5\n\n| PropagationAG | PROPAGATION_REQUIRED | Indicates that the\
    \ current method must run within a transaction. If an existing transaction is\
    \ in progress, the method will run within that transaction. |\n PROPAGATION_REQUIRES_NEW\
    \ | Indicates that the current method must run within its own transaction. |\n\
    \ PROPAGATION_SUPPORTS | Indicates that the current method doesn't require a transactional\
    \ context, but may run within a transaction if one is already in progress. |\n\
    \n+   - **Isolation level**: It's possible that at any time, many transactions\
    \ are started by the application as it supports concurrency. The isolation level\
    \ defines the effect of one transaction on another in order to reflect the updated\
    \ data, such as the following:\n  - **Dirty reads**: Let's consider a situation\
    \ where two users are using the XXX table. The first user reads the data and has\
    \ a set of values which are there in the table at this moment, say, for example,\
    \ 10 records. The second user is adding two records, but has not yet committed\
    \ them. The first user can read their data, which is a new set which says they\
    \ have 12 records and not 10. If all goes well, no problem. They are happy. But\
    \ if at the time of record insertion by the first user has some problem and it\
    \ rolls back then the first user has 12 records and in the actual table, there\
    \ are just 10.\n  - **Phantom read**: Suppose the first user tries to read data\
    \ depending upon some criteria. They discover no match the criteria. The second\
    \ user meanwhile inserts or updates a record which matches the first user's searching\
    \ criteria. If the first user re-executes the query with the same criteria, surprisingly\
    \ he finds a match.\n  - **Non-repeatable reads**: In this scenario, a transaction\
    \ reads the data twice. But in the first read and the second, the data read is\
    \ different. The first user reads a table and gets the values in transaction.\
    \ The second user deletes or updates rows by transaction. Now the first user again\
    \ reads the data. They will discover that there is no such row available or the\
    \ values obtained this are different than they read earlier.\n\n— 115 —"
