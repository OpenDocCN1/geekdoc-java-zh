  md: '# Managing declarative transaction in Spring


    Transaction management is one of the very famous cross-cutting technologies. Spring
    provides Aspect Oriented Programming (AOP) to manage cross-cutting technologies.
    AOP is used for managing declarative transactions as well.


    The transaction is centered around advice which gets called before as well as
    after the annotated business logic with the help of the implemented class TransactionInterceptor.
    The before aspect decides the scope of the database transaction, such as keeping
    the ongoing transaction or creating a new transaction. The after aspect decide
    to commit or rollback the transaction.


    The transaction manager needs to start a new one or keep an ongoing transaction
    continued at the time of transaction before advice. This decision is taken with
    the help of the propagation attribute. Whenever any business logic method is called
    by the developer method of the proxy object gets called.


    Let''s discuss how to develop transaction management step-by-step.


    # Step 1


    Decide the transaction attributes:


    +   - **Propagation behavior:** Propagation behavior gives an idea of what to
    do with the transaction when one method call gets propagated. It tells whether
    to start a new transaction for the called method by suspending what is available,
    pass on the same transaction further, and to support or not to support the transaction.


    The following table lists propagation behaviors and their meaning:


    | Propagation behavior | Meaning |

    |---|--|

    | PROPAGATION_MANDATORY | Indicates that the method must run within a transaction.
    If no existing transaction is in progress, an exception will be thrown. |

    | PROPAGATION_NESTED | Indicates that the method should be run within a nested
    transaction if an existing transaction is in progress. |

    | PROPAGATION_NEVER | Indicates that the current method shouldn''t run within
    a transactional context. If an existing transaction is in progress, exception
    will be thrown. |

    | PROPAGATION_NOT_SUPPORTED | Indicates that the method shouldn''t run within
    a transaction. If an existing transaction is in progress, it''ll be suspended
    for the duration of the method. |


    [ 114 ]'
