  md: '# Preface


    Welcome to the world of Java EE development! A huge world, with a large number
    of things to learn and so many skills to adapt. It''s actually difficult to decide
    what to start with. When I started, I faced a similar problem. Now, also when
    I am in training sessions or seminars, I find many people who want be professional
    developers, but don''t have much exposure to the processes, stages, and thinking
    involved in application development. This book helps you by providing a path for
    web development that can be used to understand the process of Java modular development
    through an easy-to-understand case study. Nowadays, in Java EE, there are many
    technologies in the market. One such technology is Spring.


    Spring is useful for developing independent Java modules that can then be combined
    to create a complete application. We have used Spring, Spring MVC, and many of
    its features throughout the book, while discussing the concepts of database, unit
    testing, security, and many other topics.


    # What this book covers


    Chapter 1, Introducing Modular Programming, starts with a discussion about Enterprise
    application, its architecture, and its development. Enterprise application development
    is a team that faces many problems concerning collaboration between members. We
    will introduce coordinated development and the tools involved in this chapter.


    Chapter 2, Saying Hello to Java EE, involves a short warm up by discussing and
    developing a Java application using Servlet-JSP. We will develop the application
    using a Spring to get startup gear as Spring MVC developer.


    Chapter 3, Implementing the Presentation Layer, discusses the points that need
    to be taken of when developing the most important layer of an application: the
    presentation layer. We will discuss how to develop the pages to incorporate data
    binding for business logic, as well as for presentation, using Spring MVC features.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'Preface


    Chapter 4, Talking to the Database, discusses Spring JDBC connectivity. Data collected
    from the user and data to be used in the business logic need to be persisted.
    We will cover Spring DAO support persist. We will then move on a step and introduce
    Hibernate, the ORM technology, and its integration with Spring. We will also cover
    unit testing to make sure our code is working fine.


    Chapter 5, Developing the Business Layer, discusses the development of the most
    important layer of an application — the business layer —and the communication
    between the layers. An application needs to be developed by following a number
    of rules.


    Chapter 6, Testing Your Application, explains that the modules developed by the
    developer should produce the correct result. To ensure the correctness of the
    code in this chapter, we will cover the basics of testing with the help of the
    V module. We will also cover integration testing with JUnit and Mockito.


    Chapter 7, Securing the Application, discusses how and to secure the application.
    In an application, there are modules that are open and available to all, and some
    that are restricted. We will apply the Spring security module to secure the Spring
    MVC application with the help of basic and form security.


    Chapter 8, Versioning and Deploying, shows how to collaborate on the application,
    which has been developed in parts, or by different members simultaneously. In
    this chapter, we will set up and integrate Tortoise SVN as a versioning tool used
    to collaborate on the code. We will also discuss the creation of repositories,
    users, and setting access rules for Callbuat and Visual SVN servers.


    # # What you need for this book


    You will need to have sound knowledge and practical exposure of core Java to understand
    this book. Along with this, knowledge of basic JDBC and the concepts of object-oriented
    programming language is required. As we are using Eclipse IDE throughout the book,
    you should be familiar with it. Those who have an introductory knowledge of Spring
    beginner framework can refer to this book easily. If you are beginner for Spring,
    we suggest you first go through the basic concepts of Spring configuration and
    get some practical experience. A basic knowledge of Hibernate and JUnit will be
    an added advantage.'
  merge: -1
