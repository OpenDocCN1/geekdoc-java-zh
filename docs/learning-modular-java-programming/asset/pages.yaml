  md: 'Talking to the Database


    # Disadvantages of the JDBC Native API Driver


    The disadvantages of using the JDBC Native API Driver are as follows:


    +   - As a vendor-specific native API must be installed on each client machine,
    it leads to problems using it for the Internet

    - The communication with the database server is dependent upon the native API,
    which leads to problems when the database changes


    # JDBC Net Protocol Driver


    The Type 3 is useful in the case of a middleware server. The JDBC application
    will send the request to this middleware server, which translates JDBC calls to
    the respective database.


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_88_0.png)


    # Advantages of the JDBC Net Protocol Driver


    The advantages of using the JDBC Net Protocol Driver are as follows:


    +   - Unlike the Type 2 driver, in the Type 3 driver there is no need for a vendor-specific
    database library to be present on each and every machine

    - It is portable as it is written in Java

    - It can be used for web applications as there is no client-specific code or configuration'
