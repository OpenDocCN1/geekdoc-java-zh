  md: 'Introducing Modular Programming


    An example of this is the Oracle database database management system. When we
    want to use Oracle database, we will install Oracle on a dedicated machine which
    can be called as the Oracle server. Now, on the user''s machine, we can install
    the Oracle client. Whenever we want to fetch data from the table in Oracle, we
