  md: '# # Securing the Application


    We have developed an application where we are maintaining contacts. This information
    is right now publicly available. Anybody can come, visit my page, click on the
    link and get the contact details. Anybody can add contacts. What is the assurance
    that the data being added is correct and not false? The person who is entering
    the data is genuine? No! It''s not at all guaranteed, which leads to a serious
    problem of data protection. We need to protect the application data so that it
    is not mishandled and all possible care can be taken from the developers'' side
    to make sure that the reliability of data will remain intact. In this chapter,
    we are going to learn and explore how security helps to protect the data from
    getting used by an unknown user. In this chapter, we will cover:


    +   * What is security and why do we need it?

    * How to secure web applications using Spring

    * Application layer security

    * Custom security


    # ## Make it safe, make it secure


    On the Web, all data gets transferred through a channel where it is possible for
    someone else to steal the information which you are sending or receiving from
    the server. This stolen data can be misused and affect the website as well as
    the user badly. Let''s take the example of accessing mail accounts. Whenever we
    try to access our mail accounts, the URL gets changed from HTTP to HTTPS, which
    shows we are going to access something secure. Some extra measures have been taken
    in order to protect the data as it goes to and fro, from the security perspective.'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# Securing the Application


    The security consists of the following:


    +   **Authentication:** This is the process by which the application checks whether
    the user is who they are claiming to be or not. If we want to check our e-mails,
    we cannot do directly unless until we prove that we are the right person. How
    do we do that? For that, we need to provide our mail ID and correct password.
    The application will check if this email ID and password pair is correct or not,
    and take the steps accordingly. Sometimes, it may be possible that someone hacks
    your password and accesses the account. The system cannot do physical checking.
    The one who provides correct authentication information will get the data.

    **Authorization:** On the Web, there are some URLs which can be accessed by some
    specific users and these links will not be available to the rest of the users.
    They are role-based links which can be accessed only if you have a respective
    role to perform a specific action. This is termed authorization. Once a user gets
    authenticated, the container with the specified username-password pair has the
    correct security table gives access to that page. Let''s take the example of blogs.
    When we search Spring framework blogs, we get many links. We can visit and read
    them. Can we delete or update the blog? No, because the data doesn''t belong to
    you. The addition or updating can be made only if you have authorization.

    **Confidentiality:** This is an arrangement which makes it difficult to secure
    authentication information through a channel. It can be done by encryption algorithms.
    Confidentiality makes sure to secure confidential information about the user,
    which otherwise can be seen and can be used by fake users.

    **Data integrity:** The data which we fetched from the server can be seen or altered
    by a middle unknown resource. Data integrity ensures the accuracy and consistency
    of the data throughout the application.


    The steps to provide security in a Web application are as follows:


    +   1. Create a security realm. A realm is a place where the authorization information
    is stored.

    2. In the realm, we store roles, username and password by assigning them some
    role.

    3. Configure security constraints to specify which methods from which URL are
    going to be accessed by whom.'
  merge: -1
  pgno: 166
- img_proc: true
  md: '4. Provide an authentication mechanism. BASIC, FORM-BASE, CLIENTCERT, and DIGEST
    are the four ways which can be used for the authentication process:


    +   - BASIC: The login information will be transmitted in encoded form, leading
    to weak security

    - FORM: Using FORM, developers can design their own forms through HTML

    - DIGEST: Transmits login information in a more secure way but the encryption
    mechanism used is not in wide use

    - CLIENTCERT: This is the most secure form to transmit the information using a
    key


    5. Provide configuration for the transport guarantee as CONFIDENTIAL to give data
    integrity/confidentiality.


    # Spring security framework


    Spring provides a handy, well-defined, declarative solution to provide security
    by handling authentication and authorization at both request level and method
    invocation level. Spring provides two ways to handle security:


    +   - Servlet filters: To handle Web request and URL access restrictions

    - Spring AOP: To handle secure method invocations


    Spring provides eight modules to handle Spring Security, as follows:


    | Module | Description |

    |---||

    | ACL | This provides support for domain object security via access control lists.
    The org.springframework.security.acl package enables developers to use it. |

    | CAS Client | This provides integration with JA-SIG''s Central Authentication
    Service. The org.springframework.security.cas package enables developers to use
    it. |

    | Configuration | This contains support for Spring Security''s XML namespace.
    The org.springframework.security.config package enables developers to use it.
    |


    [ 151 ]'
  merge: -1
  pgno: 167
- img_proc: true
  md: '| Module | Description |

    | --- | --- |

    | Core | This provides the Spring Security library, which supports standalone
    applications, service layer, JDBC user provisioning and remote clients. |

    | LDAP | This provides support for authentication using Lightweight Directory
    Access. The org.springframework.security.ldap package enables developers to use
    it. |

    | OpenID | This provides integration with the OpenID standard. The org.springframework.security.openid
    package enables developers to use it. |

    | Web | This provides filter-based Spring Security support. The org.springframework.security.web
    package enables developers to use it. |

    | Tag Library | Includes a set of JSP tags to provide security |


    It''s not necessary to add all modules in your application; it all depends on
    what facilities you want and how you want to provide security.


    As we have a web application, we need web, core, and configuration modules. If
    we decide to go for handling security in JSP, then the Tag Library module needs
    to be added. These modules will be provided by Spring security-core.jar, Spring-security-config.jar,
    and Spring-security-web.jar.


    # Secure web request


    Everything in the Web is going to be accessed through a URL which is handled by
    requests. The process of securing web applications starts from making secure requests.
    In the application, find all those URLs which need to be handled with some authority.
    The content of these URLs will be available only if the user is authorized. Sometimes,
    we need to provide data security through HTTPS, providing Secure Service Layer
    (SSL). Whenever a user wants to access the data from the secure URL, he or she
    needs to provide authentication credentials so that the application will be able
    to recognize the user. If the user has the correct authentication and has the
    right privilege, then the data will be given to the user, otherwise not.'
