  md: '# Saying Hello to Java EE


    A good developer always keeps a rule of thumb in mind that a module should not
    have more than one responsibility, but here the servlet is doing much more. So
    this has addressed the first problem in testing the code, maybe we we will find
    a solution for this. The second issue is about response generation. We cannot
    neglect a significant problem in writing well-designed code to have a nice look
    and feel for the page from the servlet. When means a programmer has to know or
    adapt designing skills as well, but why should the servlet be responsible for
    presentation?


    The basic thinking of taking presentation out of the Java Server Page (JSP). JSP
    provides the facility of using highly designed HTML pages. JSP designers use HTML
    tags and can create well-designed pages using HTML, where programmers can add
    code using scriptlet, expression, declaration, or directives. Even standard actions
    useBean can be used to take advantage of Java Beans. This JSP''s now get transformed,
    compiled into the servers.


    Now we have three components:


    +   - Controller, which handles request and response

    - Model, which holds data acquired from handling business logic

    - View, which does the presentation


    Combining these three we come across a design pattern – Model-View-Controller
    (MVC). Using MVC design patterns, we are trying to write modules which have a
    clear separation of worry. These modules are upgradable for future enhancement.
    These modules can be easily tested as they are less dependent on other modules.
    The discussion of MVC is incomplete without knowing two architectural flavors
    of it:


    +   - MVC architecture

    - MVC architecture


    # MVC architecture


    In this model, the web application is page-centric around JSP pages. In MVC I,
    JSP performs the functionalities of handling a request and response and manipulating
    the input, as well as producing the output alone. In such web applications, we
    find a number of JSP pages, each of them performing different functionalities.
    MVC architecture is good for small web applications where less complexity and
    maintaining the flow is easy. The JSP performs the dual task of business logic
    and presentation together, which makes it unsuitable for enterprise applications.'
