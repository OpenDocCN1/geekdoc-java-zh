    +   4. Create a class where we write the code to insert the data to the table
    or to perform other database-related operations.


    The steps which need to be performed here will be:


    +   1. Load the configuration file and get an object of SessionFactory.


    +   2. From SessionFactory, obtain an object of Session.


    +   3. Using the object of Session, get an object of Transaction.


    +   4. Begin the transaction before performing the database operation.


    +   5. Invoke a method on session to perform the database operation.


    +   6. Commit the transaction on successful completion of the database operation.

    If the operation has failed, rollback the transaction.


    +   7. Close all the resources on completing the operation.


