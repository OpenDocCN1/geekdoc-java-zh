- img_proc: true
  md: '# Talking to the Database


    In Java, normally the persistency is of an object. Java can save an object state
    using the following ways:


    +   - Object serialization

    - Storing data in XML format

    - Saving the data in a relational database


    # Using object serialization


    The process by which an object is saved across the network is serialization. In
    Java, an object is saved in the file. So we can even say, saving an object to
    the file is serialization.


    # Disadvantages of using object serialization


    The disadvantages of object serialization are as follows:


    +   - Serialization adds resource overhead

    - Serialization is slow


    # Storing data in XML


    In the past few years, XML has emerged as a favorite choice to handle data in
    a file using markups. The good thing is, the developer can use their own tags
    to represent the data collection.


    # Disadvantages of storing data in XML


    The disadvantages of storing data in XML are as follows:


    +   - XML needs adequate processing

    - XML is not for displaying in a browser but for holding data. Not all browsers
    have inbuilt support. Developers need to use XSLT (extensible stylesheet language)
    to present the data on browsers


    # Saving the data in a relational database


    An object consists of data members to present its state. The relational database
    consists of a table structure which a row and column structure. One row in a table
    is mapped to one object. Mapping is a technique that places an object''s data
    members in one or more fields of a database table. The relational database uses
    an easy query writing mechanism to deal with the stored data. Over the years,
    the relational database has become the choice of Java developers for achieving
    persistency.'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# Advantages of saving data in a relational database


    The advantages of saving data in a relational database are as follows:


    +   - It supports easy mapping of a table in the database to object data members

    - It has techniques such as primary key, timestamps and version numbers to update
    an object when so and required

    - It provides mapping techniques that can support Java inheritance

    - It supports relational mappings as one to one, one to many, and many to many,
    which can be used to map Java collections and arrays


    # Interaction of Java with relational databases


    Java is a pure object-oriented programming (OOP) language while relational databases
    use sequential programming language (SQL). Both of them have their own data type,
    methods and programming techniques. OOP manages objects where SQL manages tables.
    It is pretty clear that both of them cannot communicate directly with each other
    due to the unavailability of compatible language support. Direct communication
    is not possible so the unit is to make them communicate even though they are fundamentally
    different. The Java Database Connectivity (JDBC) architecture will be managed
    by JDBC APIs from a Java application which helps to manage the language and data
    type difference is DriverManager. The following figure illustrates this:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_85_0.png)


    The JDBC driver is an implementation that defines the interface in JDBC API for
    interacting with the database server.'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# Types of JDBC drivers


    The four types of drivers that facilitate JDBC programming on the variety of platforms
    and operating systems are as follows:


    +   - JDBC-ODBC bridge driver

    - JDBC Native API Driver / Partly JAVA Driver

    - JDBC Net Protocol Driver

    - All Java drivers


    We shall now see all types of driver and their advantages and disadvantages.


    # JDBC-ODBC bridge driver


    The Type 1 driver uses JDBC API to the Open Database Connectivity (ODBC) API to
    access a database. The Type 1 driver is installed on the client machine which
    translates the JDBC calls into ODBC calls. In order to connect to the database
    it uses an ODBC driver with the help of Data Source Name (DSN).


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_86_0.png)


    # Advantages of the JDBC-ODBC bridge driver


    These types of drivers are freely installed on the system, which allows access
    to almost all types of databases.'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# Disadvantages of the JDBC-ODBC bridge driver


    The disadvantages of using the JDBC-ODBC bridge driver are as follows:


    +   - When a program executes the JDBC, the call gets converted first of all to
    JDBC-ODBC and then later from JDBC-ODBC to ODBC. As there are a high number of
    conversions, the working of the driver is slow, which hampers performance.

    - The JDBC-ODBC Driver uses system installations so in order to use a Type 1 driver,
    the ODBC driver needs to be installed on the client system.

    - The Type 1 driver needs DSN, which needs to be created on every client machine
    to connect with a database. This leads to restricting the use of the application
    to It''s not useful for web applications.


    # JDBC Native API Driver/Partly Java Driver


    The Type 2 driver converts JDBC calls to the native calls of the database API,
    which are database specific. It needs some binary code to be present on the client
    machine to have communication with the database server.


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_87_0.png)


    JDBC Native API Driver/Partly JAVA Driver


    # Advantages of the JDBC Native API Driver


    The advantage of using the JDBC Native API Driver is as follows:


    +   - In comparison with the Type 1 driver, it gives better performance'
