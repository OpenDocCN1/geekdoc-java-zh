  md: "# Testing Your Application\n\nThe following are the two ways to create an object\
    \ of MockMVC:\n\n+   * With loading the Spring configuration as follows:\n```java\n\
    @RunWith(SpringJUnit4Runner.class)\n@EnableWebConfiguration\n@ContextConfiguration(\"\
    Data-servlet-context.xml\")\npublic class MyControllerTests {\n\n    @Autowired\n\
    \    private WebApplicationContext w;\n\n    private MockMvc mockMvc;\n\n    @Before\n\
    \    public void setup() {\n        this.mockMvc = MockMvcBuilders.webAppContextSetup(this.w).build();\n\
    \    }\n}\n```\n\n+   * Without loading the Spring configuration:\n```java\npublic\
    \ class MyControllerTests {\n\n    private MockMvc mockMvc;\n\n    @Before\n \
    \   public void setup() {\n        this.mockMvc = MockMvcBuilders.standaloneSetup(new\
    \ AddController()).build();\n    }\n}\n```\n\nStandalone setups are closer to\
    \ unit testing as they test one controller at a time. Standalone needs to inject\
    \ the dependencies with mocks manually. To create a mock object, mocking frameworks\
    \ such as EasyMock and Mockito can be used. Standalone setups are more focused\
    \ on finding out if any Spring MVC configuration is required. When the Spring\
    \ configuration is loaded and used, it is integration testing and not unit testing\
    \ with the help of the TestContext framework. Before going into how to implement\
    \ MockMVC testing, let's have a look at MockMVC and the methods it provides for\
    \ testing."
