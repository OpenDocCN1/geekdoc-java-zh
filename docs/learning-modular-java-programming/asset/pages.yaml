  md: '# Introducing Modular Programming


    Finally, the response will be generated and the result will be sent back to the
    browser. Here, the user interface, business logic, and database are the three
    distinct features involved. These are called as the presentation layer, business
    logic layer, and data storage layer, respectively.


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_22_0.png)


    Each of these layers will talk with the above layer and exchange data. The process
    broadly takes place as follows:


    +   - The user will open the browser and hit the URL.

    - A login page will be rendered on the browser. The user will fill in the form
    and submit it to be processed by the business logic layer.

    - To check the data, the business logic layer will communicate with the data storage
    layer.

    - According to the result returned from the data storage layer, the business logic
    layer will now send the result to the presentation layer and the client''s browser
    will render the pages.


    Now we understand the difference between a tier and a layer, let''s discuss tiers
    in detail. Depending on how many physical separations one application is using,
    it will be called a one-tier, two-tier, or multi-tier application.'
