  md: '# One-tier applications


    An enterprise application where all the components reside on a single computer
    will be called as a one-tier application. These applications can also be called
    single-tier applications. So we can broadly say that these are the applications
    which get installed and run on a single computer.


    For example, an Eclipse application as software. When we install eclipse and launch
    it, it will be running on our personal computer. It doesn''t require any network.
    The presentation layer, that is, Swing GUI, business logic, and storing information
    in a filesystem will be done on the same computer.


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_23_0.png)


    # Two-tier applications


    When the enterprise application gets divided over two computers, it will be called
    a two-tier application. Generally the data storage, that is, the database, will
    be moved onto a separate, dedicated computer. This will work as a database host
    machine or database server. The presentation layer and business logic layer will
    be residing in one location and data layer will be residing in another.'
  merge: -1
