  md: '# 5

    Developing the

    Business Layer


    In every application, there are a number of components available. Some deal with
    user interfaces, some deal with the database, and some deal with configuration.
    But the core component will decide how to deal with data is the business component.
    The business component will be involved in handling the data with immense care
    so that there will not be any mess; neither on the data side nor on the application
    flow side. The responsibility of these components is to manipulate the data by
    applying some mathematical formula and certain business rules. These components
    will be involved in taking all kinds of decisions for handling the data and to
    fro in the application.


    The application will have multiple layers that comprise of presentation, data
    storage, and business logic. The data access object (DAO) layer and the presentation
    layer are involved in adding data to the database layers and accepting data from
    the user respectively. Both of these layers are involved in the handling of data.
    These layers are not what the logical part is, what the decision is, or how manipulation
    of data will be. These layers are not taking part in any decision-making nor in
    deciding. This module will come next in the future. Nowhere have they checked
    whether the data is getting inserted updated, and whether they have removed the
    correct layer or not. This leads to problems such as maintaining the consistency
    of data, applying a wrong business formula, invoking a wrong module, ultimately,
    the application fails in the market. That is, many the developer''s responsibility
    to develop the correct flow in an application which will fulfill the business
    logic correctly. They need to understand the business flow and accordingly, build
    up the modules which will communicate with each other and give the right solution
    to the problem. If they get the business logic incorrect then there will be a
    blunder when the application executes.'
  merge: -1
  pgno: 119
- img_proc: true
  md: 'Developing the layers


    Both the layers which we already discussed in the previous two chapters have their
    own responsibilities to perform. This is the point where we need to discuss the
    most important layer: the business layer. Transaction management is one such concern
    of the business logic. Transaction management helps developers to maintain the
    consistency of the data with the help of commit or rollback methods. In the same
    manner, there are other ways to maintain the logical part of the project.


    In this chapter, we will discuss the following topics:


    +   * How to implement the business layer

    * How to communicate with the business layer

    * How to wrap up the layers to collaborate


    # Business logic


    Let''s discuss exactly what business logic is, in a simplified manner with a few
    scenarios:


    +   * Scenario 1: Let''s discuss a very simple banking example. The common operations
    which a bank holder does is the deposit and withdrawal of money. Every bank has
    certain rules for the maintenance of a minimum balance. The account holder cannot
    withdraw an amount below this minimum balance. We also need to remember that every
    bank has its set of rules about what will be the minimum balance, for example,
    SBI has 500 Rupees, HDBC and ICICI have 5,000 Rupees, and so on. The minimum balance
    of an account can be zero balance accounts. Again, these rules change upon what
    type of account you have: for example, salary accounts can be from bank as part
    of their business policy and the tie-ups with companies. In the persistence layer,
    the developers will develop the code so that every withdrawal, the updated balance,
    the withdrawal amount, and other details of the transaction will be stored in
    the database table. But here they also have to follow the minimum balance rule
    in order to make the minimum balance has reached its limit. They will do this
    by checking the minimum balance and the type of account every time before a withdrawal.


    +   * Scenario 2: Let''s discuss a second scenario. Every bank has a number of
    users specifically divided into two categories of bank account: savings accounts
    and current accounts. The savings account holders take advantage of the interest
    rates, on their balance offered by banks. But the current account holder doesn''t
    have such a facility. At the end of the financial year, every bank gives yearly
    interest to account holders. This interest has to be calculated depending upon
    the type of account and the amount in the account.


    [ 104 ]'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# Chapter 5


    This can also depend on the deposit and withdrawal transactions made on the account.
    So, while calculating the interest, all these things have to be carefully considered.


    The interest gets calculated for fixed deposits as well. All banks provide a facility
    of fixed deposit to customers. The interest rate varies as per norms depending
    on the deposit amount, duration of deposit, and the depositor''s age. When a developer
    develops such modules, they have to think about multiple scenarios where the rules
    and formulas will be dependent upon certain scenarios. This is normal conditions
    but sometimes the account holder wants to withdraw the fixed deposit before the
    term ends as. Only, accepting data from the user and adding to the table will
    not complete the process flow, but along with accepting data, it should be processed
    depending upon the above-discussed conditions.


    +   * Scenario 3: We discuss a scenario based on railway reservations. At the
    time of railway reservations, we select a particular train and date of travel.
    We check for the availability of seats and start the process of booking the ticket.
    When the process of booking starts, a few available seats are shown to us. We
    then select the seat and now we are in the mode of payment, which may take too
    much time. Meanwhile, all the available tickets have been booked by other passengers
    and no seat is available. Being unaware that getting confirmed tickets, we frustrated
    as a user because the payment has already been done and we cannot undo that. ...
    module for the transaction done by reversing the booking. booking and transferring
    the money is the developer''s task, but along with the booking, the developer
    needs to think about successful and unsuccessful bookings. In the case of successful
    bookings, the user should get the booking details. If the booking is unsuccessful,
    the respect message should be shown on the UI. The developers also have to think
    about transferring the money to the railway or vice versa on an unsuccessful activity.
    The money gets transferred correctly is part of business logic.


    All of the above discussed scenarios provide the significance of developing the
    correct business logic and writing it for the appropriate situations. And if this
    module fails, the whole business will collapse. Developing the business logic
    is simple as well as complicated. It is simple because the formulas and decisions
    to be made are already known to you as it is difficult to apply the rule, we first
    need to know the domain for which we are developing the application, you should
    have a correct process knowledge and, last not least, you should be aware of the
    rules to be applied. Simply, there is no hard and fast rule—everything is dependent!


    [ 105]'
