  md: '# Developing the Business Layer


    The possible isolations are as follows:


    | Isolation level | Meaning |

    | --- | --- |

    | ISOLATION_DEFAULT | Uses the default isolation level of the underlying datastore.
    |

    | ISOLATION_READ_UNCOMMITTED | Allows to read changes that haven''t yet been committed.
    May result in dirty reads, phantom reads, and non-repeatable reads. |

    | ISOLATION_READ_COMMITTED | Allows reads from concurrent transactions that have
    been committed. Dirty reads are prevented, and phantom and non-repeatable reads
    may still occur. |

    | ISOLATION_REPEATABLE_READ | Multiple reads of the same field will yield the
    same results, unless changed by the transaction itself. Dirty reads and non-repeatable
    reads are prevented, but phantom reads may still occur. |

    | ISOLATION_SERIALIZABLE | This fully ACID-compliant isolation level ensures that
    dirty reads, non-repeatable reads, and phantom reads are all prevented. This is
    the lowest of isolation levels because it''s typically accomplished by doing full
    locks on the tables involved in the transaction.


    +   * **Read-only**: Sometimes the developers are interested in reading the underlying
    data they want to avoid modification of the data. To apply a read-only attribute,
    the propagation should be one of the following: PROPAGATION_REQUIRED, PROPAGATION_NESTED,
    and PROPAGATION_REQUIRES_NEW.

    * **Transaction timeout**: Some transactions take more time to complete, which
    hampers performance. In such situations, instead of waiting for a long time, it''s
    better to terminate it. A transaction timeout attribute helps terminate time-consuming
    transactions automatically after a certain time. To apply a timeout attribute,
    the propagation should be one of the following: PROPAGATION_REQUIRED, PROPAGATION_NESTED,
    or PROPAGATION_REQUIRES_NEW.


    In an application, it may be possible that the process will take more time due
    to loading large data from a database or some coding errors of unending loops.
    In such situations, the client needs to wait for the application to load. The
    developer will specify the value of the timeout attribute in order to manage after
    much time the transaction should be rolled back automatically:'
