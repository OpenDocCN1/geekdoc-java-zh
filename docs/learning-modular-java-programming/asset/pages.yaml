    # Pre-population of forms


    We are aware of form processing. Here, we need to discuss one more specific scenario:
    **pre-population of forms**. Sometimes, the form gets displayed in the browser,
    there are some fields with predefined values. All such values need to be defined
    and set from the server to the browser in order to achieve dynamism. For example,
    when we do online reservations, the input field for **To well as From** will display
    values in a drop-down menu. In the same way, the available stops are also predefined.
    Let''s discuss moving; how to pre-populate a form. The process is to create a
    variable with predefined values for use in the form. It can be done by adding
    a method in the Spring MVC controller class, which will create and set the values
    for the respect object. Such methods need to be annotated with @ModelAttribute.
    When the Spring MVC controller is invoked, the method which has been annotated
    by @ModelAttribute will be invoked, which will make the objects available for
    use.


    Let''s have a look into a scenario where we are able to implement ModelAttribute.
    Suppose we want to display the list of genders with values **Male** and **Female**
    in the drop-down menu. We can hardcode these values in the HTML tag. But doing
    so can create a problem in updating the code every time the drop-down change.
    We need to have a method that facilitates us to add or remove the values in the
    list without changing the code. Now let''s see how it can be done in the code.


    Let''s implement pre-population of form in the project. We will create a new project
    which will be an extension of the previous project Ch03_Search_Form_Data as Ch03_FormHandling:


    +   1. Declare a method which returns a List.

    2. Decide the name of the list which can be used in the form to fetch the values
    and use it at the declaration of ModelAttribute.'
