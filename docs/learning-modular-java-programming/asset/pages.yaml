    +   * PostFilter: In some situations, developers don''t want to secure the method
    but want to secure the data returned from the method.


    Let''s implement method level security in JdbcTemplate, which we developed in
    1 and 2 for URL-based security:


    +   Add configuration to method level security using an expression in the spring-security.xml
    file as follows:

    <security:global-method-security secured-annotations="enabled"/>


    +   By default, developers configure an access attribute that accepts a role name
    which can access the URL with correct authentication. But if the developer wants
    to use an expression as a user with some role (e.g. hasRole(''adminadmin'')) or
    IP address (for example, hasIpAddress(\''123.123.1.1\'')) then we need to use
    use-expressions="true" in <http>. We have already seen the expressions which can
    be used for configuration:


