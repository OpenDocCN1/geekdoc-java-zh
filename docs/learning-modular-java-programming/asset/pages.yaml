  md: 'Implementing the Presentation Layer


    Though we know all of these forms are valid, if the data type is number then the
    last value,+91765123456, will give a number format exception. In the same way,
    we can face many problems in business logic because of the pre-assumption of the
    values the user enters. This may be because the user''s confusion or by mistake.
    If we don''t want to face this problem, we need to clear the user''s confusion
    and provide them with a clear instruction. Even if the instruction is pretty clear,
    for some reason we cannot deny the fact that the user will enter the incorrect
    format. Make sure that the Spring MVC controller will only get the correct data,
    we can do it with the help of Validators.


    Spring MVC provides two mechanisms for validations:


    +   * Developing customizated validators using Spring validators

    * Annotation-based validation


    # Developing customized validators using Spring validators


    To develop custom validators, we need to do the following steps:


    +   1. Write a class which implements the Validator interface.

    2. Override the supports() and validate() methods.

    3. Update the controller for one of the data members of type Validator using averiguariring:


    Autowiring is auto-dependency of the dependencies. The AddController will invoke
    the validate() method of the validator to perform the validation. The AddController
    has the validator as a dependency which needs to be injected. We are using @Autowired
    to inject this dependency automatically.


    In the controller method where we need to trigger the validation, invoke the validator''s
    validate method in order to perform validation.


    +   4. Configure the Validator in the Spring configuration file.

    5. Change the JSP page which displays the form such that it will be able to display
    the validation error messages.


    Let''s start developing the code.'
