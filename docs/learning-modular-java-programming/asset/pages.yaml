  md: '# Rules, formulas, and conditions


    Domain knowledge gives information about situations, the rules which need to be
    considered in those situations, situation-based formulae, and conditional-based
    decision making. For example, in interest calculation, we consider the account
    type, and in reservation booking, we need to know the number of seats, type of
    carriage, and age of the passengers. Before starting the actual work, it''s always
    better to put all rules dependent on situations, and formulae to apply on certain
    cases together that is well understood from knowledge or by discussions. All the
    situations where the flow of an application can fail or should not fail unless
    corrected are all exceptional situations; for example, the user gives withdrawal
    option while there is no sufficient balance, and the user chooses to buy a product
    which is not in stock. All such exceptional conditions need to be known to the
    developers as well as to the testers. The developers and testers consider these
    situations while developing and testing the applications respectively.


    # Case studies


    Reading books, papers, and magazines will certainly help to get knowledge of how
    a particular industry works and what the important terminologies and conditions
    are. But it will not be sufficient as this knowledge needs to be applied in reality.
    With the help of a case study, a situation can be well understood and we come
    to know the loopholes in it, why that situation occurred, and how to come out
    of it. As a case study is situation-based, it helps the developer a lot as they
    can relate it to the application flow.


    A case study gives a practical solution which can be applied in the application
    directly. It may not be possible to modify the solution as per the requirement.
    The case study helps to grab domain knowledge relatively in a quick and easy way.


    # Developing the business layer


    After a long, theoretical discussion, let''s now develop the business layer for
    the code which we developed in the previous chapter for contact management. We
    need to set the rules which can be applied in our contact management project.'
