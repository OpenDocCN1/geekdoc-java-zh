    # Copying a WAR file into Tomcat with Tomcat manager


    To deploy a WAR using Tomcat manager, we first need to have a user who has a manager
    role. So let''s first of all create a user with a managerial role:


    +   1. Stop Tomcat if already running. Open the webapps folder and delete MyProject1.war
    and the MyProject folder from it. We will now deploy it with a new process.


    +   2. Open tomcat-users.xml from the tomcat | conf folder.


    +   3. Edit it to add a role as manager-gui and a user with tomcat as username
    and password. The code will be as follows:

    <rolename="manager-gui"/>

    <user username="tomcat" password="tomcat" roles="manager-gui"/>


    +   4. Start Tomcat and type the following URL in the browser:

    http://localhost:8080/manager.


    +   5. It will ask for authentication. Enter tomcat as username and password as
    tomcat, which we have just given in the earlier step.'
