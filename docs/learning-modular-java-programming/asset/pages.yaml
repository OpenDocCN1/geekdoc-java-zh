  md: '# Introduction to unit testing


    Unit testing is the process of testing a single functionality in the code at a
    time. In unit testing, the developer ensures that the functionality is working
    correctly according to business logic. We will use JUnit for unit testing.


    # Unit testing using JUnit


    JUnit is an automation testing framework which provides numbers of TestRunners
    that can automate the execution of any Java class that extends from Test Case.
    It facilitates the testing of the expected behavior as a unit. The developer can
    write test cases for all the functions in the code. Whenever a change occurs in
    the functionality, causing to behave differently than expected, it can be easily
    identified and fixed as well. JUnit 4 supports annotation-based programming instead
    of getting extended from the TestCase, the developer can use annotation-based
    programming as well.


    # Steps for writing a TestCase using annotation


    Perform the following steps to write a TestCase:


    +   1. Create a TestCase by giving a name as XXXTest where XXX can be replaced
    by the class under testing. We called TestCase.

    2. Create one or more methods for testing a function. Each of them has to be annotated
    by @Test. The name of this method in general will have a format such as XXX_positive()
    or XXX_negative(), where XXX is replaced by the name of the method under testing.

    3. In the method, use assertEqual() to validate the results of the method under
    testing according to the business logic.


    Let''s develop a TestCase for the code of data layer which we have developed in
    Ch04_Hibernate_Template_Integrationusing eclipse:


