  md: '# Way 3 – Custom security


    Spring boots and provides all kinds of possible security methodologies, but then
    sometimes for certain situations, we need to provide our custom way to extend
    spring API. One of the ways to provide custom security is by writing user-defined
    AuthenticationProvider which has the authenticate() method. This method uses UserDetailService
    to do authentication. The authenticate() method returns AuthenticationToken containing
    username, password, and authorities.


    # Summary


    Security is a very important part of any application and needs to be carefully
    handled. As each application and its requirements are different due the ways of
    authentication, like form-based or basic; the developers need to wisely make a
    decision on which one to use. In this chapter, we have seen URL-based, as well
    method-based, ways to provide security. The users with their assigned roles can
    be configured in the XML. We also saw how to use databases to configure the authentication
    information. Sometimes the user uses the application frequently and may not want
    to log in each time they access the application. We also covered functionality
    to take away the burden of login. We also saw how to use logout in the application.


    In the next chapter, we will be covering problems during the versioning of an
    application, problems for collaborating on the application when it''s been distributed
    among the team members. We will also configure the software which provides versioning
    and collaboration with ease.'
