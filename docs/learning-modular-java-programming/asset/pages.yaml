- img_proc: true
  md: '# Verification phases


    Verification finds out whether the requirements are understood correctly or not.

    The verification phases are as follows:


    +   - Requirement analysis: This phase collects the client requirements in order
    to understand their expectations. The acceptance test is written upon this phase.
    The requirements collected from the client are used as the input in the acceptance
    test.

    - High-level design: After client requirement gathering, now it is time to take
    decisions about the hardware and software to be used in development.

    - Detailed design: This phase, detailed designing of each module is done. It''s
    a very important phase to make the design of each module in a way that it will
    be used with other modules. The coding or implementation phase. After implementing,
    it is very important to check whether each module is working in the expected way
    or not. Faults and errors are caught by unit testing. This is a perfect time to
    design unit tests based on detailed design.


    # Validation phases


    Validation helps in finding the requirements which we are understood correct or
    not from the previous phase. The validation phases are as follows:


    +   - Unit testing: Unit testing is performed on a unit to find out whether it
    is working as per expectations or not. Unit test cases will be written on the
    basis of test cases which give a detailed description about what scenarios are
    to be considered while writing the Unit test case. As a unit test is concentrated
    and executed on a module, errors and flaws in the module can be caught at a very
    early stage and can be removed easily.

    - Integration testing: Integration testing the integration or communication of
    two modules.

    - Product testing: In product testing, each and every functionality as per the
    requirement is checked.

    - Acceptance testing: This testing is used to find out whether each and every
    requirement has been put forward by the client has been fulfilled or not. It''s
    done in the client environment. Along with business logic, the presentation is
    also tested rigorously.

    - System testing: In system testing, the communication with the system and compatibility
    with the platform is tested.'
