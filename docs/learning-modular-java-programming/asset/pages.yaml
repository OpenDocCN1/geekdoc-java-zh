  md: '#  Saying Hello to Java EE


    In December 1996, Sun Microsystems published a specification for JavaBean. This
    specification was about the rules, using which developers can develop reusable,
    less complex components. These POJO classes are now going to be used as a basis
    for developing a lightweight, less complex, flexible framework: the Spring framework.
    This framework is from the thoughts of Rod Johnson in February 2003. The Spring
    framework consists of seven modules:


    ![](img/8c4e088a46790c3b87b9ac174b3fd0a5_46_0.png)


    Spring Spring consists of several modules, the developer doesn''t have to be always
    dependent on the framework. They can use any module as per the requirement. It''s
    not compulsory to develop the code which has been dependent upon Spring API. It
    is called a non-intrusive framework. Spring works on the basis of dependency injection
    (DI), which makes it easy for integration. Each class which the developer develops
    has some dependencies. Take the example of JDBC to obtain a connection, the developer
    needs to provide URL, username, and password values. Obtaining the connection
    is dependent on these values so we can call them dependencies, and injection of
    these dependencies in objects is called DI. This makes the emerging spring framework
    the top choice for middle tier or business tier in enterprise applications.


    # Spring MVC


    The spring MVC module is a choice we look forward for developing web applications.
    The spring MVC helps to simplify development to develop a robust application.
    This module can also be used to leave common concerns such as reading request
    data, data binding to domain object, server-side validation and page rendering
    to the framework and will concentrate on business logic processes.'
