  md: 'After having a long discussion, we have now well understood the lifecycle of
    an application. If we apply the V model in our contact management application,
    we can conclude that we have already finished the development phase. We deollect,
    we also done JUnit testing of the modules. We have developed the business logic
    in the previous chapter. That means it''s time to go ahead integration testing,
    the business layer as well. We haven''t yet done unit testing of the controller
    and the data layer. Testing the data layer was easy for we had access to the data
    layer. For a while, let''s assume we don''t have a database and we are developing
    the data layer. Testing has to be done. But we cannot that there is no database.
    We test! Actually, there are many times in development when the developing is
    dependent on environmental factors, such as in, the database. In the controller
    layer, the methods need request parameter values. The request object is available
    only if the application is running in containers. In JavaEE, most of the application
    has many dependencies. So testing such an application becomes a headache. In such
    situations, the testing will be carried out with the help of dummy objects. These
    dummy objects are mock objects.


    # Mock testing


    The testing is carried out with the help of mock objects is called mock testing.
    There are a number of ways which provide the means for mock testing. Let''s discover
    them one by one.


    # Spring testing framework


    Spring provides an API to conduct testing using the mock technique in JUnit. Using
    this API, we can create mock objects of Request, Response, Filter, and HttpSession,
    which is otherwise available from the container. All methods which are dependent
    on request or user''s request and response can be tested easily without a container.
    Using this API, tests can be created even before the development of the controller
    has be completed with mocking or stubbing.


    Let''s use it in our controller testing which we developed in Ch_05_jdbcTemplate_Transaction_Declarative
    as per the following cases:'
