    We now have an idea about how to develop a flow to read and bind the request parameter.
    We also know how a form backing object will be used and how to do pre-processing
    of the form. When we handle forms, we have to be careful about validating the
    form. Form validation is important because the developer has developed the logic
    depending upon the assumption made about the received data. If the data is incorrect,
    the logic will fail, and so will the application. Generally, form validation is
    of two types:


    +   - Client-side validation using JavaScript

    - Server-side validation


    Spring provides a good support for server-side validation. Spring has two different
    ways to handle server-side validation:


    +   - Validation interface

    - Using annotation provided by JSR303


    # # Form validation


    Validation is a process that makes sure that the data which the user is entering
    in the form is of correct format. For example, the user needs to add their mobile
    number. They can enter their phone number as:


    +   - 9765123456

    - 09765123456

    - +919765123456'
