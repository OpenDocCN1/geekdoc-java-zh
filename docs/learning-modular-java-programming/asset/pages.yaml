  md: '# Way 2 – Spring Security using AOP


    In the security method, we provide access restrictions to invoke a method rather
    than a URL. To enable annotation-based security in an application, we declare:


    ```

    <global-method-security pre-post-annotations="enabled" expression="true"/>

    ```


    The preceding configuration enables us to use @Secured annotation in our Java
    code which takes a role name or expression. Spring supports the following four
    ways to secure methods:


    +   * Annotating the method with @Secured

    * Annotating the methods with @RolesAllowed

    * Methods annotated with pre- and post-invocation annotations as @PreAuthorize,
    @PostAuthorize, @PostFilter, and @PreFilter

    * Methods matched with pointcut expressions


    The following configuration shows the use of expressions while securing a URL:


    ```

    <security:intercept-urlpattern="/showForm.htm" access="hasRole(''ROLE_ADMIN'')"/>

    ```


    The access attribute take the following values:


    | Expression | Return value |

    |---|---|

    | permitAll | Always true |

    | denyAll | Always false |

    | hasRole(role) | True if user has a specified role |

    | hasAnyRole(role1,role2,...) | True if user has one of the specified roles |


    # @Secured


    @Secured takes an array of string as an argument where each argument is a value
    of authorization, one of the roles user should have access to the method. The
    Spring Security exception will be thrown whenever an unauthorized user tries to
    access the method.


    # @RolesAllowed


    @RolesAllowed has been defined by JSR 250. To enable the annotation, we need to
    do the following configuration:


    ```

    <global-method-security jssr250-annotations="enabled"/>

    ```'
  merge: -1
  pgno: 184
- img_proc: true
  md: "# SpEL-enabled security annotations for securing the methods\n\nSpring 3.0\
    \ has introduced four methods to secure the method invocation depending upon the\
    \ role access, which are as follows:\n\n+   * @PreAuthorized: The annotation takes\
    \ the argument whose value will be the value of Role which can access the method\
    \ as:\n* @PreAuthorized(\"*hasRole('ROLE_ADMIN')\")\n```java\npublic int getData()\
    \ {\n    //some code here\n}\n```\n\nThe method getData() can be accessed by the\
    \ user who has the privilege ROLE_ADMIN. Some expressions which we can use are\
    \ as follows:\n\n| Sr.No | Expression | Description |\n|---|---||\n| 1 | hasRole(role)\
    \ | The method checks for the role which has been passed as an argument and return\
    \ true if the current principal has a specified role |\n| 2 | hasAnyRole([role1,role2])\
    \ | The method checks for any of the roles which have been passed separated by\
    \ comma as an argument and returns true if the current principal has any of those\
    \ supplied |\n| 3 | Principal | This allows direct access to the principal object\
    \ representing the current user |\n| 4 | permitAll | This always evaluates to\
    \ true as it permits all the users |\n| 5 | denyAll | This always evaluates to\
    \ false and not allowing anyone to access |\n| 6 | isRememberMe() | The method\
    \ returns true if the current principal is a remember me user |\n| 7 | isAuthenticated()\
    \ | The method returns true if the user is anonymous |\n| 8 | isFullyAuthenticated()\
    \ | This returns true if the user is not anonymous or a remember me user |"
  merge: -1
  pgno: 185
