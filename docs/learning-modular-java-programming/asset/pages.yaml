  md: 'The process flows is as described:


    +   1. The user hits the URL to visit.

    2. Hitting the URL, we make a request to the application. In order to find which
    resource is mapped to the URL, DD will be hit. The filter mapping will be checked
    out if the resource has limited access. If it is secure, &lt;http&gt; configuration
    will be observed. The &lt;http&gt; configuration is checked for the authentication
    mechanism to discover which authentication method is used, login location, and
    other required information.

    3. If &lt;http-basic&gt;, a default login page by spring is provided where the
    user can enter their credentials. If form-based authentication is configured,
    a custom login form will be given.

    4. The data will be taken to the server for authentication.

    5. &lt;authentication-manager&gt; is checked to find how to load the credential
    data.

    6. Authentication is performed and, depending upon it, a success or failure page
    will be shown to the user.


    Let''s start securing the URL for adding the contact data in our contact management.
    The URL which we want to secure is showForm.htm. Only ROLE_ADMIN can access the
    URL to get the contact form and add new content; others cannot access the information.
    Let''s take Ch04_jdbTemplate_Integraon to add Spring Security with basic authentication
    with the help of the following steps.


