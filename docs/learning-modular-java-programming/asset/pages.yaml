  md: 'Now we understand the working of spring MVC, let''s discuss a few more things
    required in order to develop the Spring MVC controller.


    Each class which we want to discover as the controller should be annotated with
    the @Controller annotation. In this class, there may be number of methods which
    can be invoked on request. The method which we want to map for URL has to be annotated
    with the annotation @RequestMapping.


    There can be more than one method mapped for the same URL but it will be invoked
    for different HTTP methods. This can be done as follows:


    ```

    @RequestMapping(value="/hello.htm",method= RequestMethod.GET)

    public ModelAndView sayHello(HttpServletRequest request)

    {

    }

    @RequestMapping(value="/hello.htm",method= RequestMethod.POST)

    public ModelAndView sayHello(HttpServletRequest request)

    {

    }

    ```


    These methods normally accept Request as parameter and will return ModelAndView.

    But the following return types and parameters are also supported.


    The following are some of the supported method argument types:


    +   * HttpServletRequest

    * HttpSession

    * Java.Util.Map/ org.springframework.ui.Model/ org.springframework.ui.ModelMap

    * @PathVariable

    * @RequestParam

    * org.springframework.validation.Errors/ org.springframework.validation.BindingResult


    The following are some of the supported method return types:


    +   * ModelAndView

    * Model

    * Map

    * View

    * String

    * void'
