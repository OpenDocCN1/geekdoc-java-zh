  md: '+   - Rollback rules: Normally rollback happens on occurrences of runtime exceptions.
    But we can define the rules of when to roll back as well as checked and unchecked
    exceptions. It''s also possible to define the rule of specific exceptions and
    when not to do a transaction rollback.


    # Step 2


    Decide whether you want to adapt declarative transaction or programmatic transaction.
    If you decide on declarative transaction, take a quick decision to go with XML-based
    transaction configuration or annotation-based transaction. We will go with declarative
    transaction using annotation.


    # Step 3


    Due to the problems faced by using the TransactionProxyFactoryBean in earlier
    versions of Spring now Spring comes with namespace tx, which can be configured
    and to simplify declarative transaction using annotation:


    ```

    <tx:annotation-driven transaction-manager="transactionManager* />

    ```


    The preceding configuration will be configured in order to know which transaction
    manager handles the operations. This configuration enables Spring to find out
    those whose have been applied with the @Transactional annotation. Now all these
    will be advised with transaction advice. All transaction-related attributes can
    be defined for @Transactional as parameters.


