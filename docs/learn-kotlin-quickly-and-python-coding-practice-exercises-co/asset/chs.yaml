  \n## 创建 HelloWorld.kt 文件\n\n右键点击 `src` 文件夹 -> `New` -> `Other`。\n\n![`1.bp.blogspot.com/-7wGQfPyFoEg/Wg2fCzt6imI/AAAAAAAAJGc/UQEtAW7geMgFzk-doAWRVm5-OJITfAM-wCLcBGAs/s400/eclipse%2Bkotlin%2Bproject4.png`](img/Image00005.jpg)\n\
