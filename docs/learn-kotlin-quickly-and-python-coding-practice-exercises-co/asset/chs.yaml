  快速学习 Kotlin\n\n# Kotlin 简介\n\nKotlin 是一种在 JVM 上运行的高级编程语言。Kotlin 将源代码编译为 Java 字节码，并使用\
  \ JVM 运行应用程序。你可以交替使用 Java 和 Kotlin，这意味着你可以从 Java 调用 Kotlin 函数，反之亦然。\n\n## 先决条件\n\
  \n需要具备 Java 基础知识。\n\n## Kotlin 是面向对象的吗？\n\n是的，Kotlin 是面向对象的语言，你可以创建类、对象，并应用多态、继承等面向对象编程概念。\n\
  \n## = Kotlin 是函数式的吗？\n\n是的，Kotlin 是一种函数式语言。在函数式编程语言中，函数是基本的构建块，你可以返回一个函数，将一个函数作为参数传递给另一个函数等。\n\
  \n## Kotlin 是开源的吗？\n\n是的\n\n## 我可以使用 Kotlin 开发什么类型的应用程序？\n\n* 构建移动应用程序\n* 开发服务器端应用程序\n\
  * 你可以开发任何能用 Java 开发的应用程序\n\n## 我可以在 Web 浏览器中运行 Kotlin 代码吗？\n\nKotlin 可以编译为 JavaScript，因此你可以在浏览器中运行应用程序。\n\
  \n## Kotlin 是静态类型的吗？\n\n是的，Kotlin 是静态类型语言。对于静态类型语言，变量的类型在编译时已知。你可以参考我的帖子\"静态类型与动态类型语言\"\
  ，了解静态类型和动态类型语言之间的区别。\n\n## Kotlin 可以推断类型吗？\n\n是的，与 Java 不同，你在定义变量时无需指定类型。Kotlin\
  \ 根据上下文推断类型。\n\n示例\n\n```\nvar name = \"Krishna\"\n```\n\n由于 `\"Krishna\"` 被赋值给变量\
  \ `name`，Kotlin 推断类型为 `String`。\n\n```\nvar age = 28\n```\n\n由于数字 `28` 被赋值给变量 `age`，Kotlin\
  \ 推断类型为 `int`。\n\n# Kotlin：Hello World 程序\n\n`.kt` 是 Kotlin 文件的扩展名。创建一个文件 `HelloWorld.kt`，内容如下。\n\
  \n`HelloWorld.kt`\n\n```\nfun main (args:Array<String>){\n    println( \"Hello World\"\
  \ )\n}\n```\n\n关键字 `fun` 用于定义函数。\n\n`main` 是应用程序的主函数。程序从这里开始执行。\n\n`args:Array<String>`\n\
  \n在 Kotlin 中，变量名先声明，后跟类型。在上面的例子中，`args` 是字符串数组类型的变量。\n\n`println(\"Hello World\"\
  )`\n\n上面的语句将消息 `Hello World` 打印到控制台。如你所见，与 Java 不同，Kotlin 语句不以 `;` 结尾。\n\n## 编译\
  \ HelloWorld.kt\n\n打开命令提示符，输入命令 `kotlinc HelloWorld.kt`。\n\n```\nC:\\Users\\Krishna\\\
  Documents\\Study\\Kotlin\\Programs>kotlinc HelloWorld.kt\n\nC:\\Users\\Krishna\\\
  Documents\\Study\\Kotlin\\Programs>dir\n\nVolume in drive C is OSDisk\nVolume Serial\
  \ Number is 1034-4F6F\nDirectory of C:\\Users\\Krishna\\Documents\\Study\\Kotlin\\\
  Programs\n\n09/02/2017  11:18 AM    <DIR>          .\n09/02/2017  11:18 AM    <DIR>\
  \          ..\n09/02/2017  11:09 AM                57 HelloWorld.kt\n09/02/2017\
  \  11:18 AM               980 HelloWorldKt.class\n09/02/2017  11:18 AM    <DIR>\
  \          META-INF\n               2 File(s)          1,037 bytes\n           \
  \    3 Dir(s)  63,190,188,032 bytes free\n```\n\n如你所见 `dir` 命令的输出，你可以观察到 Kotlin\
  \ 生成了 `HelloWorldKt.class` 和一个 `META-INF` 目录。\n\n## 运行 HelloWorld.kt\n\n你可以使用 `kotlin\
  \ HelloWorldKt` 命令运行 `HelloWorldkt` 文件。\n\n```\nC:\\Users\\krishna\\Documents\\\
  Study\\Kotlin\\Programs>kotlin HelloWorldKt\n\nHello World\n```\n\n## 创建并运行 jar\n\
  \n你还可以创建 jar 文件，并使用 Java 启动器运行 jar 文件。\n\n使用命令 `kotlinc HelloWorld.kt -include-runtime\
  \ -d HelloWorld.jar` 创建 jar 文件。\n\n`include-runtime` 选项告诉 Kotlin 编译器将 Kotlin 运行时包含在\
  \ `HelloWorld.jar` 文件中。\n\n```\nC:\\Users\\Krishna\\Documents\\Study\\Kotlin\\Programs>kotlinc\
