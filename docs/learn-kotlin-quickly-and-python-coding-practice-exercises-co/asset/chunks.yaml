    \ | true |\n\n### BooleanAnd.kt\n\n```\nfun main (args: Array<String>) {\n  var\
    \ operand1: Boolean = false\n  var operand2: Boolean = false\n  println( \"${operand1}\
    \ && ${operand2}: ${(operand1 && operand2)}\" )\n  operand1 = false\n  operand2\
    \ = true\n  println( \"${operand1} && ${operand2}: ${(operand1 && operand2)}\"\
    \ )\n  operand1 = true\n  operand2 = false\n  println( \"${operand1} && ${operand2}:\
    \ ${(operand1 && operand2)}\" )\n  operand1 = true\n  operand2 = true\n  println(\
    \ \"${operand1} && ${operand2}: ${(operand1 && operand2)}\" )\n}\n```\n\n### 输出\n\
    \n```\nfalse && false: false\nfalse && true: false\ntrue && false: false\ntrue\
    \ && true: true\n```\n\n### 为什么 `&&` 被称为惰性合取运算符？\n\n如果表达式中的第一个语句求值为 `false`，那么\
    \ Kotlin 将不会对整个表达式求值。因此，逻辑 AND 被称为短路 AND。\n\n### LazyConjunction.kt\n\n```\nfun\
    \ main (args: Array<String>) {\n  var a: Int = 10\n  var b: Int = 21\n  if ((a\
    \ > b) && (a++ > b)) {\n    System. out .println( \"This statement not evaluated\"\
    \ );\n  }\n  System. out .println( \"a is not incremented \" + a);\n  if ((a <\
    \ b) && (a++ < b)) {\n    System. out .println( \"This statement is evaluated\"\
    \ );\n  }\n  System. out .println( \"a is incremented \" + a);\n}\n```\n\n###\
    \ 输出\n\n```\na is not incremented 10\nThis statement is evaluated\na is incremented\
    \ 11\n```\n\n## 3. 逻辑非（`!`）运算符\n\n如果操作数为 `false`，`!` 运算符将其求值为 `true`\n\n如果操作数为\
    \ `true`，`!` 运算符将其求值为 `false`\n\n| 操作数 | 求值结果 |\n| False | true |\n| True | false\
    \ |\n\n### LogicalNot.kt\n\n```\nfun main (args: Array<String>) {\n  var operand1:\
    \ Boolean = false\n  var operand2: Boolean = true\n  println( \"operand1 : ${operand1}\"\
    \ )\n  println( \"!operand1 : ${!operand1}\" )\n  println( \"operand2 : ${operand2}\"\
    \ )\n  println( \"!operand2 : ${!operand2}\" )\n}\n```\n\n### 输出\n\n```\noperand1\
    \ : false\n!operand1 : true\noperand2 : true\n!operand2 : false\n```\n\n## Kotlin：`===`\
    \ 与 `==`\n\nKotlin 支持两种类型的相等性。\n\n* 引用相等\n* 结构相等\n\n### 引用相等（`===`）\n\n`===` 运算符用于检查两个引用是否指向同一个对象。\n\
    \n例如：\n\n`ref1 === ref2`\n\n如果引用 `ref1` 和 `ref2` 指向同一个对象，上述语句返回 `true`，否则返回 `false`。\n\
    \n### 结构相等（`==`）\n\n结构相等用于检查两个引用的值是否相等（通过使用 Java 的 `equals()` 方法检查）。\n\n例如：\n\n\
    `ref1 == ref2`\n\n如果 `ref1.equals(ref2)` 返回 `true`，上述语句返回 `true`，否则返回 `false`。\n\
    \n### Equality.kt\n\n```\nfun main (args: Array<String>) {\n  var intVar1 : Int\
    \ = 10000\n  var intBoundedVar1 : Int? = intVar1\n  var intBounderdVar2 : Int?\
    \ = intVar1\n  println( \"(intBoundedVar1===intBounderdVar2) : ${(intBoundedVar1\
    \ === intBounderdVar2)}\" )\n  println( \"(intBoundedVar1==intBounderdVar2) :\
    \ ${(intBoundedVar1 == intBounderdVar2)}\" )\n}\n```\n\n### 输出\n\n```\n(intBoundedVar1===intBounderdVar2)\
    \ : false\n(intBoundedVar1==intBounderdVar2) : true\n```\n\n# Kotlin：控制流语句\n\n\
    Kotlin 提供控制流语句\n\n用于决策（`if`、`if-else`、`when`）和\n\n用于循环（`for`、`while`、`do-while`）\n\
    \n### 决策语句\n\n* `if` 语句\n* `if-else` 语句\n* `if-else if-else` 阶梯\n* `when` 语句\n\
    \n### 循环语句\n\n* `for`\n* `while`\n* `do-while`\n\n# Kotlin：`if` 语句\n\n`if` 告诉程序在条件求值为\
    \ `true` 时执行代码段。\n\n### 语法\n\n```\nif(condition){\n  // 如果条件为真则执行\n}\n```\n\n\
    ### IfStmt.kt\n\n```\nfun main (args: Array<String>) {\n  var marks: Int = 20\n\
    \  if (marks < 35 ) {\n    println( \"You failed in the Exam. Better luck next\
    \ time\" );\n  }\n  marks = 55\n  if (marks < 35 ) {\n    println( \"You failed\
    \ in the Exam again. Better luck next time\" );\n  }\n}\n```\n\n### 输出\n\n```\n\
    You failed in the Exam. Better luck next time\n```\n\n# Kotlin：`if-else` 语句\n\n\
    如果条件为 `true`，则执行 if 块代码，否则执行 else 块代码。\n\n### 语法：\n\n```\nif(condition){\n}else{\n\
    }\n```\n\n### IfElse.kt\n\n```\nfun main (args: Array<String>) {\n  var marks:\
    \ Int = 65\n  if (marks < 35 ) {\n    println( \"You failed in the Exam. Better\
    \ luck next time\" );\n  } else {\n    println( \"You passed in the exam\" )\n\
    \  }\n}\n```\n\n### 输出\n\n```\nYou passed in the exam\n```\n\n# Kotlin：`if-else\
    \ if-else`\n\n通过使用 `if-else if-else` 结构，你可以在多个选项中进行选择。\n\n`if` 语句后面可以跟一个可选的 `else\
    \ if...else` 语句，这对于测试各种条件非常有用。\n\n### IfElseIf.kt\n\n```\nfun main (args: Array<String>)\
    \ {\n  var marks: Int = 65\n  if (marks < 35 )\n    println( \"You are failed\"\
    \ );\n  else if (marks < 50 )\n    println( \"You are passed and got third class\"\
    \ );\n  else if (marks < 60 )\n    println( \"You are passed and got second class\"\
    \ );\n  else if (marks < 70 )\n    println( \"You are passed and got first class\"\
    \ );\n  else\n    println ( \"You are passed and got distinction\" );\n}\n```\n\
    \n### 输出\n\n```\nYou are passed and got first class\n```\n\n# Kotlin：`when` 表达式\n\
    \n`when` 相当于 Java 中的 switch 语句。\n\n### 语法\n\n```\nwhen(expression){\n  1 -> {//执行某些操作}\n\
    \  2 -> {//执行某些操作}\n  else -> {//执行某些操作}\n}\n```\n\n`when` 按顺序将表达式与所有可能的 case\
    \ 进行匹配求值。如果没有任何一个 case 满足，则执行 else 块。\n\n### WhenDemo.kt\n\n```\nfun main (args:\
    \ Array<String>) {\n  var a : Int = 5\n  when (a){\n    12 -> println( \"Value\
    \ 12 is checked\" )\n    5 -> println( \"Value 5 is checked\" )\n    3 -> println(\
    \ \"Value 3 is checked\" )\n    else -> println( \"No value is checked\" )\n \
    \ }\n}\n```\n\n### 输出\n\n```\nValue 5 is checked\n```\n\n你可以在 `when` 表达式中组合多个分支语句。\n\
    \n### WhenDemo.kt\n\n```\nfun main (args: Array<String>) {\n```\n"
- fmt: " ```\nvar a : Int = 5\n\nwhen (a){\n  2 , 3 , 5 , 7 -> println( \"Prime number\"\
    \ )\n  4 , 6 , 8 -> println( \"Even number other than 2\" )\n  else -> println(\
    \ \"No value is checked\" )\n}\n}\n```\n\n**Output**\n\n```\nPrime number\n```\n\
    \nYou can also use arbitrary expressions as branch conditions. For example, I\
    \ used `2+3` as branch condition.\n\n`WhenDemo.kt`\n\n```\nfun main (args: Array<String>)\
    \ {\n  var a : Int = 5\n  when (a){\n    2 + 3 -> println( \"Checked value 5\"\
