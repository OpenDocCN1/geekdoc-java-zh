    \ : Krishna, lastName :\n\nid : , firstName : Hareesh, lastName : Seeram\n\nid\
    \ : 123, firstName : Praneeth, lastName : Sai\n```\n\n## Kotlin：向主构造函数传递默认值\n\n\
    你可以向主构造函数传递默认值。\n\n示例：\n\n```kotlin\nclass Employee(var firstName: String = \"\
    Krishna\", var lastName: String = \"Gurram\") {\n\n}\n```\n\n上面的代码片段为 `Employee`\
    \ 类定义了一个带有默认值的主构造函数。\n\n```kotlin\nvar emp1 = Employee()\n```\n\n由于我们没有向构造函数传递任何参数，`firstName`\
    \ 和 `lastName` 将使用默认值进行初始化。`firstName` 被初始化为 `Krishna`，`lastName` 被初始化为 `Gurram`。\n\
    \n```kotlin\nvar emp2 = Employee(\"Rachit\")\n```\n\n由于我们只传递了第一个参数，`firstName`\
    \ 被赋值为 `Rachit`，`lastName` 被赋值为 `Gurram`。\n\n```kotlin\nvar emp3 = Employee(\"\
    Shwetha\", \"kam\")\n```\n\n`firstName` 被赋值为 `Shwetha`，`lastName` 被赋值为 `Kam`。\n\
    \nConstructorDemo.kt\n\n```kotlin\nclass Employee ( var firstName: String = \"\
    Krishna\" , var lastName: String = \"Gurram\" ) {\n\n}\n\nfun printEmployee (emp:\
    \ Employee) {\n\nprintln( \"firstName : ${emp.firstName}, lastName : ${emp.lastName}\"\
    \ )\n\n}\n\nfun main (args: Array<String>) {\n\n  var emp1 = Employee()\n\n  var\
    \ emp2 = Employee( \"Rachit\" )\n\n  var emp3 = Employee( \"Shwetha\" , \"kam\"\
    \ )\n\nprintEmployee(emp1)\n\nprintEmployee(emp2)\n\nprintEmployee(emp3)\n\n}\n\
    ```\n\nOutput\n\n```\nfirstName : Krishna, lastName : Gurram\n\nfirstName : Rachit,\
    \ lastName : Gurram\n\nfirstName : Shwetha, lastName : kam\n```\n\n## Kotlin：定义私有主构造函数\n\
    \n通过在类头中指定 `private` 访问修饰符，你可以定义私有主构造函数。\n\nPrivateConDemo.kt\n\n```kotlin\nclass\
    \ Employee private constructor ( var firstName: String) {\n\n  var lastName: String\
    \ = \"\"\n\nconstructor(fName: String, lName: String) : this (fName) {\n\n  this\
    \ .lastName = lName\n\n}\n\n}\n\nfun printEmployee (emp: Employee) {\n\nprintln(\
    \ \"firstName : ${emp.firstName}, lastName : ${emp.lastName}\" )\n\n}\n\nfun main\
    \ (args: Array<String>) {\n\n  var emp1 = Employee( \"Shwetha\" , \"kam\" )\n\n\
    printEmployee(emp1)\n\n}\n```\n\nOutput\n\n```\nfirstName : Shwetha, lastName\
    \ : kam\n```\n\n## Kotlin：如何创建对象\n\n与 Java 不同，创建对象时不需要 `new` 关键字。\n\n语法\n\n```kotlin\n\
    var objectName  = ClassName(arguments)\n```\n\n示例\n\n```kotlin\nvar emp1 = Employee(\"\
    Shwetha\")\n\nvar emp2 = Employee(\"Krishna\", \"G\")\n```\n\nConstructorDemo.kt\n\
    \n```kotlin\nclass Employee {\n\n  var firstName: String = \"\"\n\n  var lastName:\
    \ String = \"\"\n\nconstructor(fName: String) {\n\n  this .firstName = fName\n\
    \n  this .lastName = fName\n\n}\n\nconstructor(fName: String, lName: String) {\n\
    \n  this .firstName = fName\n\n  this .lastName = lName\n\n}\n\n}\n\nfun printEmployee\
    \ (emp: Employee) {\n\nprintln( \"firstName : ${emp.firstName}, lastName : ${emp.lastName}\"\
    \ )\n\n}\n\nfun main (args: Array<String>) {\n\n  var emp1 = Employee( \"Shwetha\"\
    \ )\n\n  var emp2 = Employee( \"Krishna\" , \"G\" )\n\nprintEmployee(emp1)\n\n\
    printEmployee(emp2)\n\n}\n```\n\nOutput\n\n```\nfirstName : Shwetha, lastName\
    \ : Shwetha\n\nfirstName : Krishna, lastName : G\n```\n\n# Python 编程练习\n\n## Python\
