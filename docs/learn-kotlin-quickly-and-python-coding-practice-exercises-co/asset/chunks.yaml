    \ 3 values](#text00053.html__Toc77010790)\n\nLEARN\n\nKOTLIN QUICKLY\n\n# Introduction\
    \ to Kotlin\n\nKotlin is a high-level programming language runs on JVM. Kotlin\
    \ compiles the sources code into java byte code and runs the application using\
    \ jvm. You can use java and kotlin interchangeably, means you can call a kotlin\
    \ function from Java and vice versa.\n\n## Prerequisites\n\nJava fundamentals\
    \ are necessary.\n\n## Is Kotlin Object oriented?\n\nYes, Kotlin is object oriented\
    \ language, you can create classes, objects, and apply oops concepts like polymorphism,\
    \ inheritance etc.,\n\n## Is kotlin functional?\n\nYes, Kotlin is a functional\
    \ language. In functional programming lngauge, functions are basic building blocks,\
    \ you can return a function, pass a function as argument to other function etc.,\n\
    \n## Is Kotlin open source?\n\nYes\n\n## What kind of application Can I develop\
    \ using Kotlin?\n\n* Build Mobile Applications\n* Develop server side applications\n\
    * You can develop any application, that can be developed in Java\n\n## Can I run\
    \ kotlin code in web browser?\n\nKotlin can be compiled to JavaScript, so you\
    \ can run the applications in browser.\n\n## Is Kotlin statically typed?\n\nYes\
    \ kotlin is statically typed language. For statically typed languages, type of\
    \ the variable is known at compile time. You can refer my post statically vs dynamically\
    \ typed languages to know the difference between statically and dynamically typed\
    \ languages.\n\n## Can kotlin infer type?\n\nYes, unlike Java, you no need to\
    \ specify the type while defining the variable. Kotlin infer the type based on\
    \ the context.\n\nEx\n\n```\nvar name = \"Krishna\"\n```\n\nSince `\"Krishna\"\
    ` is assigned to the variable `name`, koltin infer the type as `String`.\n\n```\n\
    var age = 28\n```\n\nSince number `28` is assigned to the variable `age`, kotlin\
    \ infer the type as `int`.\n\n# Kotlin: Hello World program\n\n`.kt` is the extension\
    \ for kotlin files. Create a file `HelloWorld.kt` with below content.\n\n`HelloWorld.kt`\n\
    \n```\nfun main (args:Array<String>){\n    println( \"Hello World\" )\n}\n```\n\
    \nKeyword `fun` is used to define a function.\n\n`main` is the main function of\
    \ the application. Program execution starts from here.\n\n`args:Array<String>`\n\
    \nIn Kotlin variable name is declared first, followed by the type. In above case,\
    \ `args` is variable of type array of strings.\n\n`println(\"Hello World\")`\n\
    \nAbove statement prints the message `Hello World` to the console. As you see,\
    \ unlike java, Kotlin statements do not end with `;`.\n\n## Compile HelloWorld.kt\n\
    \nOpen command prompt and type the command `kotlinc HelloWorld.kt`.\n\n```\nC:\\\
    Users\\Krishna\\Documents\\Study\\Kotlin\\Programs>kotlinc HelloWorld.kt\n\nC:\\\
