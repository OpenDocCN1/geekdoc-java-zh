    println( "age : ${emp.age}" )


    println( "orgID : ${emp.orgID}" )


    }


    Output


    name : Krishna


    age : 28


    orgID : ORG1234


    As you notify the code, I used ‘field’ identifier to refer backing field. By convention
    setter method takes ‘value’ as argument name, you can use any name.


    Why do I require getter and setter methods?


    Getter and setter methods are used to transform/validate the the data before sending/setting
    the information.


             var age : Int = 28


