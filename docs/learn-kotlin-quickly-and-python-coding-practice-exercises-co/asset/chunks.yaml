    \ : 1.23\n\ndoubleVar : 1.23\n\nlongVar : 123\n\nintVar : 123\n\nshortVar : 123\n\
    \nbyteVar : 123\n```\n\n# Kotlin: nullable types\n\nBy default, kotlin reference\
    \ types (`Int`, `Float`, `Double`, `String` etc.,) do not take null values. Kotlin\
