    \n# 在 Kotlin 中定义变量\n\n变量是用于存储数据的命名内存位置。\n\n## 语法\n\n```\nvar variableName : DataType\
    \ = value\n\nval variableName : DataType = value\n```\n\n`var` 和 `val` 都是关键字。\n\
    \n## 示例\n\n```\nvar a : Int  =10;\n```\n\n`a` 的类型为 int，赋值为 10。\n\n```\nval b :\
    \ Double = 1.23\n```\n\n`b` 的类型为 `Double`，赋值为 1.23。关键字 `val` 用于定义常量（不可变对象）。\n\n\
    `HelloWorld.kt`\n\n```\nfun main (args: Array<String>) {\n\n  var a : Int  = 10\
    \ ;\n  val b : Double = 1.23\n\nprintln( \"a : ${a}\" )\n\nprintln( \"b : ${b}\"\
    \ )\n\n}\n```\n\n```\nC:\\>kotlinc HelloWorld.kt\n\nC:\\>kotlin HelloWorldKt\n\
    \na : 10\n\nb : 1.23\n```\n\n# Kotlin 中的数据类型\n\nJava 有像 `int`、`float`、`char` 等原始类型，那么\
    \ Kotlin 呢？\n\n从用户的角度来看，Kotlin 将所有东西都设计为对象，但在运行时，布尔值、数字和字符都表示为原始类型。\n\n`HelloWorld.kt`\n\
    \n```\nfun main (args: Array<String>) {\n\n  var doubleVar: Double = 1.23\n\n\
    \  var floatVar: Float = 1.23f\n\n  var longVar: Long = 123\n\n  var intVar: Int\
    \ = 123\n\n  var shortVar: Short = 123\n\n  var byteVar: Byte = 123\n\nprintln(\
    \ \"double : ${doubleVar}\" )\n\nprintln( \"doubleVar : ${floatVar}\" )\n\nprintln(\
    \ \"longVar : ${longVar}\" )\n\nprintln( \"intVar : ${intVar}\" )\n\nprintln(\
    \ \"shortVar : ${shortVar}\" )\n\nprintln( \"byteVar : ${byteVar}\" )\n\n}\n```\n\
    \n## 输出\n\n```\ndoubleVar : 1.23\n\ndoubleVar : 1.23\n\nlongVar : 123\n\nintVar\
    \ : 123\n\nshortVar : 123\n\nbyteVar : 123\n```\n\n# Kotlin：可空类型\n\n默认情况下，Kotlin\
    \ 的引用类型（`Int`、`Float`、`Double`、`String` 等）不接受 null 值。Kotlin 引入此特性是为了避免空指针异常。\n\
    \n`Test.kt`\n\n```\nfun main (args: Array<String>) {\n\n  var name : String =\
    \ \"Krishna\"\n\nname = null\n\n}\n```\n\n当你尝试编译上述程序时，Kotlin 会抛出以下错误。\n\n```\n\
    ERROR: Null can not be a value of a non-null type String (6, 9)\n```\n\n如何定义一个可以接受\
    \ null 值的变量？\n\n通过使用可空类型，你可以定义一个接受 null 值的变量。在引用类型后追加 `?` 即可接受 null 值。\n\n| 类型\
    \ | 可空类型 |\n|------|---------------|\n| Int | Int? |\n| String | String? |\n|\
    \ Double | Double? |\n| Person | Person? |\n\n## 示例\n\n```\n  var id: Int? = 1\n\
    \n  var name: String? = \"Krishna\"\n\n  var salary: Double? = 123.456\n\n  var\
    \ person: Person? = Person( \"Krishna\" )\n\nid = null\n\nname = null\n\nsalary\
    \ = null\n\nperson = null\n```\n\n# Kotlin：数字\n\nKotlin 提供以下数据类型来支持数字。\n\n| 数据类型\
    \ | 位大小 |\n|-----------|--------------|\n| Double | 64 |\n| Float | 32 |\n| Long\
    \ | 64 |\n| Int | 32 |\n| Short | 16 |\n| Byte | 8 |\n\n`Numbers.kt`\n\n```\n\
    fun main (args: Array<String>) {\n\n  var doubleVar: Double = 1.23\n\n  var floatVar:\
    \ Float = 1.23f\n\n  var longVar: Long = 123\n\n  var intVar: Int = 123\n\n  var\
    \ shortVar: Short = 123\n\n  var byteVar: Byte = 123\n\nprintln( \"doubleVar :\
    \ ${doubleVar}\" )\n\nprintln( \"doubleVar : ${floatVar}\" )\n\nprintln( \"longVar\
    \ : ${longVar}\" )\n\nprintln( \"intVar : ${intVar}\" )\n\nprintln( \"shortVar\
    \ : ${shortVar}\" )\n\nprintln( \"byteVar : ${byteVar}\" )\n\n}\n```\n\n## 输出\n\
    \n```\ndoubleVar : 1.23\n\ndoubleVar : 1.23\n\nlongVar : 123\n\nintVar : 123\n\
    \nshortVar : 123\n\nbyteVar : 123\n```\n\n## 十六进制、八进制和二进制字面量表示法\n\nKotlin 支持十六进制和二进制表示法，但不支持八进制表示法。十六进制数通过前缀\
    \ `0x` 表示，\n\n`Numbers.kt`\n\n```\nfun main (args: Array<String>) {\n\n  var hexaNum\
    \ : Int = 0 x123\n\n  var binaryNum : Int = 0 b10101010\n\nprintln( \"hexaNum\
    \ : ${hexaNum}\" )\n\nprintln( \"binaryNum : ${binaryNum}\" )\n\n}\n```\n\n##\
    \ 输出\n\n```\nhexaNum : 291\n\nbinaryNum : 170\n```\n\n你也可以使用 `_` 来表示数字。\n\n`Numbers.kt`\n\
    \n```\nfun main (args: Array<String>) {\n\n  var ten = 10\n\n  var hundred = 100\n\
    \n  var thousand = 1000\n\n  var tenThousand = 10 _000\n\n  var oneLaksh = 100\
    \ _000\n\n  var tenLaksh = 1 _000_000\n\nprintln( \"ten : ${ten}\" )\n\nprintln(\
    \ \"hundred : ${hundred}\" )\n\nprintln( \"thousand : ${thousand}\" )\n\nprintln(\
    \ \"tenThousand : ${tenThousand}\" )\n\nprintln( \"oneLaksh : ${oneLaksh}\" )\n\
    \nprintln( \"tenLaksh : ${tenLaksh}\" )\n\n}\n```\n\n## 输出\n\n```\nten : 10\n\n\
    hundred : 100\n\nthousand : 1000\n\ntenThousand : 10000\n\noneLaksh : 100000\n\
    \ntenLaksh : 1000000\n```\n\n# Kotlin：字符\n\n`Char` 关键字用于定义单个字符。字符用单引号括起来。\n\n\
    ## 示例\n\n```\nvar myChar : Char = 'a'\n```\n\n`HelloWorld.kt`\n\n```\nfun main\
    \ (args: Array<String>) {\n\n  var myChar : Char = 'a'\n\nprintln( \"Value of\
    \ myChar is : ${myChar}\" )\n\n}\n```\n\n## 输出\n\n```\nValue of myChar is : a\
    \ clo\n```\n\nJava 支持的所有转义序列 Kotlin 也都支持。\n\n# Kotlin：将字符转换为 Int\n\n`Char` 类型提供了\
    \ `toInt()` 方法，用于将字符转换为整数。\n\n`IntConverter.kt`\n\n```\nfun main (args: Array<String>)\
    \ {\n\n  var myChar : Char = 'a'\n\nprintln( \"Value of myChar is : ${myChar}\"\
    \ )\n\nprintln( \"Value of myChar in int is : ${myChar.toInt()}\" )\n\n}\n```\n\
    \n## 输出\n\n```\nValue of myChar is : a\n\nValue of myChar in int is : 97\n```\n\
    \n# Kotlin：布尔值\n\n`Boolean` 类型用于表示 true、false 状态。\n\n`Booleans.kt`\n\n```\nfun\
    \ main (args: Array<String>) {\n\n  var trueState : Boolean  = true\n\n  var falseState\
    \ : Boolean  = false\n\nprintln( \"Value of trueState is : ${trueState}\" )\n\n\
    println( \"Value of falseState is : ${falseState}\" )\n\n}\n```\n\n## 输出\n\n```\n\
    Value of trueState is : true\n```\n"
- fmt: " Value of `falseState` is : `false`\n\n# Kotlin: Strings\n\n`String` is a\
    \ collection of characters, enclosed in double quotes. Strings in kotlin are defined\
    \ by using the keyword `String` and these are immutable.\n\nEx\n\n```kotlin\n\
    var message: String = \"Good Morning\"\n```\n\nStringsDemo.kt\n\n```kotlin\nfun\
    \ main(args: Array<String>) {\n    var message: String = \"Good Morning\"\n  \
    \  println(message)\n}\n```\n\nOutput\n\n```\nGood Morning\n```\n\nAll the escape\
    \ sequences (`\\n`, `\\t`, `\\a` etc.,) supported by java are also supported by\
    \ kotlin.\n\nEx\n\n```kotlin\nvar message: String = \"Good Morning\\nHow are you\\\
    nsee you soon\"\n```\n\nStringDemo.kt\n\n```kotlin\nfun main(args: Array<String>)\
    \ {\n    var message: String = \"Good Morning\\nHow are you\\nsee you soon\"\n\
    \    println(message)\n}\n```\n\nOutput\n\n```\nGood Morning\nHow are you\nsee\
    \ you soon\n```\n\nIf you do not want to perform escaping, then embed the string\
    \ in `\"\"\"` (triple quotes).\n\nStringDemo.kt\n\n```kotlin\nfun main(args: Array<String>)\
    \ {\n    var message: String = \"\"\"Good Morning\\nHow are you\\nsee you soon\n\
    \      After two lines\\bgood bye\"\"\"\n    println(message)\n}\n```\n\nOutput\n\
    \n```\nGood Morning\\nHow are you\\nsee you soon\n                           \
    \                  After two lines\\bgood bye\n```\n\n# Kotlin: String template\
    \ expressions\n\nBy using template expression, you can evaluate the expression\
    \ in a string. Template expression starts with `$` symbol followed by a name.\n\
    \nEx\n\n```kotlin\nvar a = 10\nprintln(\"Value of a is : $a\")\n```\n\nArbitrary\
    \ expression are enclosed in curly braces\n\n```kotlin\nvar str = \"Hello World\"\
    \nprintln(\"$str length is ${str.length}\")\n```\n\nExpression.kt\n\n```kotlin\n\
    fun main(args: Array<String>) {\n    var a = 10\n    var str = \"Hello World\"\
    \n    println(\"Value of a is : $a\")\n    println(\"$str length is ${str.length}\"\
    )\n}\n```\n\nOutput\n\n```\nValue of a is : 10\nHello World length is 11\n```\n\
    \n# Kotlin: Arrays\n\n`Array` represents a collection of elements of same type.\
    \ Kotlin provides `Array` class to represent arrays.\n\nBy using the library function\
    \ `arrayOf`, you can define an array.\n\nEx\n\n```kotlin\nval numbers: Array<Int>\
    \ = arrayOf(10, 20, 30, 40, 50)\n```\n\nArrayDemo.kt\n\n```kotlin\nfun main(args:\
    \ Array<String>) {\n    val numbers: Array<Int> = arrayOf(10, 20, 30, loser, 50)\n\
    \    for (element in numbers) {\n        println(element)\n    }\n}\n```\n\nOutput\n\
    \n```\n10\n20\n30\n40\n50\n```\n\nKotlin provides below library functions to define\
    \ array of primitive types.\n\n- `byteArrayOf()`\n- `shortArrayOf()`\n- `intArrayOf()`\n\
    - `longArrayOf()`\n- `floatArrayOf()`\n- `doubleArrayOf()`\n- `CharArray()`\n\
    - `BooleanArray()`\n\n# Kotlin: Define array of nulls\n\nKotlin provides `arrayOfNulls`\
    \ library function to define array of null values.\n\nArrayOfNulls.kt\n\n```kotlin\n\
    fun main(args: Array<String>) {\n    var a: Array<Int?> = arrayOfNulls(5)\n  \
    \  for (element in a) {\n        println(element)\n    }\n}\n```\n\nOutput\n\n\
    ```\nnull\nnull\nnull\nnull\nnull\n```\n\n# Kotlin: Define array using factory\
    \ function\n\nKotlin provides a factory function, which takes size and a function\
    \ `f` as arguments to define an array. The function `f` is used to provide initial\
    \ values to the array.\n\n```kotlin\nvar squares = Array(5, { i -> i * i })\n\
    ```\n\nAbove statement define an array `squares` of size 5 and initialize `{1,\
    \ 4, 9, 16, 25}`\n\nArrayFactoryFunction.kt\n\n```kotlin\nfun main(args: Array<String>)\
    \ {\n    var squares = Array(5, { i -> i * i })\n    var cubes = Array(5, { i\
    \ -> i * i * i })\n    println(\"Elements in squares array : \")\n    for (ele\
    \ in squares) {\n        println(ele)\n    }\n    println(\"\\nElements in cubes\
    \ array : \")\n    for (ele in cubes) {\n        println(ele)\n    }\n}\n```\n\
    \nOutput\n\n```\nElements in squares array :\n0\n1\n4\n9\n16\n\nElements in cubes\
    \ array :\n0\n1\n8\n27\n64\n```\n\n# Kotlin: Print array elements\n\nIn this post,\
    \ I am going to show, how to print elements of an array.\n\n## Print elements\
    \ of array using for loop\n\nArrayUtil.kt\n\n```kotlin\nfun main(args: Array<String>)\
    \ {\n    var arr: Array<Int> = arrayOf(1, 2, 3, 4)\n    for (ele in arr) {\n \
    \       println(ele)\n    }\n}\n```\n\nOutput\n\n```\n1\n2\n3\n4\n```\n\n## Print\
    \ array elements using `Arrays.toString` method\n\nArrayUtil.kt\n\n```kotlin\n\
    import java.util.Arrays\n\nfun main(args: Array<String>) {\n    var arr: Array<Int>\
    \ = arrayOf(1, 2, 3, 4)\n    println(Arrays.toString(arr))\n}\n```\n\nOutput\n\
    \n```\n[1, 2, 3, 4]\n```\n\n## Print array elements using `array.indices`\n\n\
    ArrayUtil.kt\n\n```kotlin\nfun main(args: Array<String>) {\n    var arr: Array<Int>\
    \ = arrayOf(2, 3, 5, 7)\n    for (index in arr.indices) {\n        println(arr[index])\n\
    \    }\n}\n```\n\nOutput\n\n```\n2\n3\n5\n7\n```\n\n## Print array elements using\
    \ `array.withIndex`\n\nArrayUtil.kt\n\n```kotlin\nfun main(args: Array<String>)\
    \ {\n    var arr: Array<Int> = arrayOf(2, 3, 5, 7)\n    for ((index, value) in\
    \ arr.withIndex()) {\n        println(\"index : $index, value : $value\")\n  \
    \  }\n}\n```\n\nOutput\n\n```\nindex : 0, value : 2\nindex : 1, value : 3\nindex\
    \ : 2, value : 5\nindex : 3, value : 7\n```\n\n## Print array elements using while\
    \ loop\n\nArrayUtil.kt\n\n```kotlin\nfun main(args: Array<String>) {\n    var\
    \ arr: Array<Int> = arrayOf(2, 3, 5, 7)\n    var sizeOfTheArray = arr.size;\n\
    \    var index: Int = 0;\n    while (index < sizeOfTheArray) {\n        println(\"\
    index : $index, value : ${arr[index]}\")\n        index++\n    }\n}\n```\n\nOutput\n\
    \n```\nindex : 0, value : 2\nindex : 1, value : 3\nindex : 2, value : 5\nindex\
    \ : 3, value : 7\n```\n\n# Kotlin: Bit wise operators\n\nBelow table summarizes\
    \ the bit wise operators supported by Kotlin.\n\n| Operator | Description | Java\
    \ Equivalant |\n|----------|-------------|---------------|\n| `shl` | Perform\
    \ signed shift left | `<<` |\n| `shr` | Perform signed shift right | `>>` |\n\
    | `ushr` | Perform unsigned shift right | `>>>` |\n| `and` | Bitwise and | `&`\
    \ |\n| `or` | Bitwise or | `|` |\n| `xor` | Bitwise X-OR | `^` |\n| `inv()` |\
    \ Bitwise inversion | `~` |\n\nOther than `inv()`, all other operators are used\
    \ in infix form.\n\nEx:\n\n```kotlin\nvar1 shl var2\nvar1 or var2\n```\n\n## 1.\
    \ `shl`: Perform signed shift left\n\nLeft shift operator shifts all the bits\
    \ to one bit left, i.e, it doubles the value.\n\nSyntax:\n\n```\nvariable shl\
    \ n\n```\n\nleft shift the variable by `n` number of times.\n\n`Variable shl n`\
    \ is equals to `variable = variable * 2 power n`\n\n```\nvar var1 : Int = 2\n\
    var1 shl 1 = 2 * 2 power 1 = 4\nvar1 shl 2 = 2 * 2 power 2 = 8\nvar1 shl 9 = 2\
    \ * 2 power 9 = 1024\n```\n\nLeftShift.kt\n\n```kotlin\nfun main(args: Array<String>)\
    \ {\n    var var1: Int = 2\n    var res1 = var1 shl 1\n    var res2 = var1 shl\
    \ 2\n    var res3 = var1 shl 9\n    println(\"res1 : ${res1}\")\n    println(\"\
    res2 : ${res2}\")\n    println(\"res3 : ${res3}\")\n}\n```\n\nOutput\n\n```\n\
    res1 : 4\nres2 : 8\nres3 : 1024\n```\n\n## 2. `shr`: Perform signed shift right\n\
    \nRight shift operator shifts all the bits to one bit right, i.e, it half (divide\
    \ by 2) the value\n\nSyntax:\n\n```\nvariable shr n\n```\n\n\n\nright shift the\
    \ variable by `n` number of times.\n\n`Variable shr n` is equals to `variable\
    \ = variable / 2 power n`\n\n```\nvar a : Int = 128\na shr 1 = 128 / (2 power\
    \ 1) = 64\na shr 2 = 128 / (2 power 2) = 32\n```\n\nRightShift.kt\n\n```kotlin\n\
    fun main(args: Array<String>) {\n    var a: Int = 128\n    var res1 = a shr 1\n\
    \    var res2 = a shr 2\n    var res3 = a shr 3\n    println(\"res1 : ${res1}\"\
    )\n    println(\"res2 : ${res2}\")\n    println(\"res3 : ${res3}\")\n}\n```\n\n\
    Output\n\n```\nres1 : 64\nres2 : 32\nres3 : 16\n```\n\n## 3. `ushr`: Unsigned\
