    \n# Define variables in Kotlin\n\nVariable is a named memory location used to\
    \ store data.\n\n## Syntax\n\n```\nvar variableName : DataType = value\n\nval\
    \ variableName : DataType = value\n```\n\nBoth `var` and `val` are the keywords.\n\
