  raw: 'Differentiating two objects based on their behavior


    consider the same two persons A and B. will try to figure out possible behaviors
    for the person object


    Possible behaviors are


    walk, run, swim, eat, sleep, see, hear etc., Now by comparing these behaviors
    we can easily differentiate two persons.


    | Behavior | Person A | Person B |


    | Walk | 10km/hr | 12km/hr |


    | run | 20km/hr | 18km/hr |


    | sleep | 8 Hrs/day | 6Hrs/day |


    | Behavior | Person A | Person B |


    Class


    In normal terms I call class as a category.


    All persons come under Human category


    cat, lion, Elephant come under Animals Category


    So a class or category is a group of objects with similar properties and behaviors.


    Objects and class in Programming Terminology


    What Is an Object?


    An object is a software bundle of related state and behavior. The main advantage
    of Kotlin is you can compare objects in Kotlin with real world objects. So it
    is very easy to work with objects in Kotlin.


    What Is a Class?


    A class is a blueprint or prototype from which objects are created.


    You can define a class using ''class'' keyword.


    Syntax


    class ClassName {


      // Properties


      // Functions


    }


    Example


    class Employee {


      var firstName : String = ""


      var lastName : String = ""


    }


    Above snippet define ''Employee'' class, it has two properties (firstName, lastName)
    defined.


    How to define object to the class Employee?


    var emp1 = Employee()


    Above statement is used to define an object to the class Employee.


    How to access the properties associated with object emp1?


    Members of the object (firstName and lastName) are accessed using ‘.’ Notation.


    Syntax


    objName.propertyName


    Example


    emp1.firstName = "Chamu"


    emp1.lastName = "Gurram"


    Employee.kt


    class Employee {


      var firstName: String = ""


      var lastName: String = ""


    }


    Main.kt


    fun main (args: Array<String>) {


      var emp1 = Employee()


    emp1.firstName = "Chamu"


    emp1.lastName = "Gurram"


    println( "First name : ${emp1.firstName}" )


    println( "Last name : ${emp1.lastName}" )


    }


    Output


    First name : Chamu


    Last name : Gurram


    # Kotlin: Declaring properties


    You can define properties in a class. Properties can be mutable (or) immutable
    (Can''t be changed once defined).


    How to define mutable properties?


    Mutable properties are defined using ‘var’ keyword.


    Ex


    var name : String = "Krishna"


    How to define immutable properties?


    Immutable properties are defined using ‘val’ keyword.


    Ex


    val name : String = "Krishna"


    class Employee{


             var name : String = "Krishna"


             var age : Int = 28


             val orgID : String = "ORG1234"


    }


    As you notify Employee class, I defined name and age as mutable properties, orgID
    as immutable property.


    How to access properties in a class?


    By defining an object, you can access the properties of a class. ‘.’ Notation
    is used to access the instance property of a class.


    Syntax


    objectName.propertyName


    HelloWorld.kt


    class Employee {


      var name: String = "Krishna"


      var age: Int = 28


      val orgID: String = "ORG1234"


    }


    fun main (args: Array<String>) {


      var emp = Employee()


    println( "name : ${emp.name}" )


    println( "age : ${emp.age}" )


    println( "orgID : ${emp.orgID}" )


    }


    Output


    name : Krishna


    age : 28


    orgID : ORG1234


    You no need to add property type while defining a property, it will be inferred
    by kotlin environment. But adding type improves the program readability.


    class Employee {


      var name = "Krishna"


      var age = 28


      val orgID = "ORG1234"


    }


    # Kotlin: getters & setters to properties


    In my previous post, I explained how to define properties, in addition to defining,
    we can add getter and setter methods to the properties.


    Syntax


    var <propertyName>[: <PropertyType>] [= <property_initializer>]


        [<getter>]


        [<setter>]


    PropertyType, getter and setter are optional while defining a property.


