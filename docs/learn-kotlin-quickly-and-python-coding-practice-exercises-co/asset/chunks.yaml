    # Introduction to Kotlin


    Kotlin is a high-level programming language runs on JVM. Kotlin compiles the sources
    code into java byte code and runs the application using jvm. You can use java
    and kotlin interchangeably, means you can call a kotlin function from Java and
    vice versa.


    Prerequisites


    Java fundamentals are necessary.


    Is Kotlin Object oriented?


    Yes, Kotlin is object oriented language, you can create classes, objects, and
    apply oops concepts like polymorphism, inheritance etc.,


    Is kotlin functional?


    Yes, Kotlin is a functional language. In functional programming lngauge, functions
    are basic building blocks, you can return a function, pass a function as argument
    to other function etc.,


    Is Kotlin open source?


    Yes


    What kind of application Can I develop using Kotlin?


    *   Build Mobile Applications


    *   Develop server side applications


    *   You can develop any application, that can be developed in Java


    Can I run kotlin code in web browser?


    Kotlin can be compiled to JavaScript, so you can run the applications in browser.


    Is Kotlin statically typed?


    Yes kotlin is statically typed language. For statically typed languages, type
    of the variable is known at compile time. You can refer my post  statically vs
    dynamically typed languages  to know the difference between statically and dynamically
    typed languages.


    Can kotlin infer type?


    Yes, unlike Java, you no need to specify the type while defining the variable.
    Kotlin infer the type based on the context.


    Ex


    var name = "Krishna"


    Since "Krishna" is assigned to the variable ‘name’, koltin infer the type as String.


    var age = 28


    Since number 28 is assigned to the variable ‘age’, kotlin infer the type as int.


    # Kotlin: Hello World program


     ‘.kt’ is the extension for kotlin files. Create a file ‘HelloWorld.kt’ with below
    content.


    HelloWorld.kt


    fun main (args:Array<String>){


    println( "Hello World" )


    }


    Keyword ‘fun’ is used to define a function.


    ‘main’ is the main function of the application. Program execution starts from
    here.


    args:Array<String>


    In Kotlin variable name is declared first, followed by the type. In above case,
    args is variable of type array of strings.


    println("Hello World")


    Above statement prints the message ‘Hello World’ to the console. As you see, unlike
    java, Kotlin statements do not end with ‘;’.


    Compile HelloWorld.kt


    Open command prompt and type the command ‘kotlinc HelloWorld.kt’.


    C:\Users\Krishna\Documents\Study\Kotlin\Programs>kotlinc HelloWorld.kt


    C:\Users\Krishna\Documents\Study\Kotlin\Programs>dir


    Volume in drive C is OSDisk


