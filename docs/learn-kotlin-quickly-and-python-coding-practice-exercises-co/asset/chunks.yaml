  trans: " \n ## 根据行为区分两个对象\n\n考虑同样的两个人 A 和 B。我们将尝试找出人物对象可能的行为。\n\n可能的行为有 `walk`、`run`、`swim`、`eat`、`sleep`、`see`、`hear`\
    \ 等。现在通过比较这些行为，我们可以轻松地区分两个人。\n\n| 行为 | 人物 A | 人物 B |\n| 步行 | 10km/hr | 12km/hr\
    \ |\n| 跑步 | 20km/hr | 18km/hr |\n| 睡眠 | 8 Hrs/day | 6Hrs/day |\n\n## 类\n\n用通俗的话来说，我把类称为类别。\n\
    \n所有人都属于人类别。\n\n`cat`、`lion`、`Elephant` 属于动物类别。\n\n所以类或类别是一组具有相似属性和行为的对象。\n\n\
    ## 编程术语中的对象和类\n\n### 什么是对象？\n\n对象是相关状态和行为的软件包。Kotlin 的主要优势在于你可以将 Kotlin 中的对象与现实世界中的对象进行比较。因此在\
    \ Kotlin 中处理对象非常容易。\n\n### 什么是类？\n\n类是创建对象的蓝图或原型。\n\n你可以使用 `class` 关键字来定义类。\n\n\
    **语法**\n\n```\nclass ClassName {\n  // Properties\n  // Functions\n}\n```\n\n\
    **示例**\n\n```\nclass Employee {\n  var firstName : String = \"\"\n  var lastName\
    \ : String = \"\"\n}\n```\n\n上面的代码片段定义了 `Employee` 类，它定义了两个属性（`firstName`、`lastName`）。\n\
    \n如何为 `Employee` 类定义对象？\n\n```\nvar emp1 = Employee()\n```\n\n上面的语句用于为 `Employee`\
    \ 类定义一个对象。\n\n如何访问与对象 `emp1` 相关联的属性？\n\n对象的成员（`firstName` 和 `lastName`）使用 `.`\
    \ 符号来访问。\n\n**语法**\n\n```\nobjName.propertyName\n```\n\n**示例**\n\n```\nemp1.firstName\
    \ = \"Chamu\"\nemp1.lastName = \"Gurram\"\n```\n\n**Employee.kt**\n\n```\nclass\
    \ Employee {\n  var firstName: String = \"\"\n  var lastName: String = \"\"\n\
    }\n```\n\n**Main.kt**\n\n```\nfun main (args: Array<String>) {\n  var emp1 = Employee()\n\
    \  emp1.firstName = \"Chamu\"\n  emp1.lastName = \"Gurram\"\n  println( \"First\
    \ name : ${emp1.firstName}\" )\n  println( \"Last name : ${emp1.lastName}\" )\n\
    }\n```\n\n**输出**\n\n```\nFirst name : Chamu\nLast name : Gurram\n```\n\n## Kotlin：声明属性\n\
    \n你可以在类中定义属性。属性可以是可变的（mutable）或不可变的（immutable，一旦定义就不能更改）。\n\n### 如何定义可变属性？\n\n\
    可变属性使用 `var` 关键字定义。\n\n**示例**\n\n```\nvar name : String = \"Krishna\"\n```\n\n\
    ### 如何定义不可变属性？\n\n不可变属性使用 `val` 关键字定义。\n\n**示例**\n\n```\nval name : String = \"\
    Krishna\"\n```\n\n```\nclass Employee{\n  var name : String = \"Krishna\"\n  var\
    \ age : Int = 28\n  val orgID : String = \"ORG1234\"\n}\n```\n\n如你所见，在 `Employee`\
    \ 类中，我将 `name` 和 `age` 定义为可变属性，`orgID` 定义为不可变属性。\n\n### 如何访问类中的属性？\n\n通过定义对象，你可以访问类的属性。使用\
    \ `.` 符号来访问类的实例属性。\n\n**语法**\n\n```\nobjectName.propertyName\n```\n\n**HelloWorld.kt**\n\
    \n```\nclass Employee {\n  var name: String = \"Krishna\"\n  var age: Int = 28\n\
    \  val orgID: String = \"ORG1234\"\n}\n\nfun main (args: Array<String>) {\n  var\
    \ emp = Employee()\n  println( \"name : ${emp.name}\" )\n  println( \"age : ${emp.age}\"\
    \ )\n  println( \"orgID : ${emp.orgID}\" )\n}\n```\n\n**输出**\n\n```\nname : Krishna\n\
    age : 28\norgID : ORG1234\n```\n\n定义属性时不需要添加属性类型，Kotlin 环境会自动推断。但添加类型可以提高程序的可读性。\n\
    \n```\nclass Employee {\n  var name = \"Krishna\"\n  var age = 28\n  val orgID\
    \ = \"ORG1234\"\n}\n```\n\n## Kotlin：属性的 Getters 和 Setters\n\n在我之前的文章中，我解释了如何定义属性，除了定义之外，我们还可以为属性添加\
    \ getter 和 setter 方法。\n\n**语法**\n\n```\nvar <propertyName>[: <PropertyType>] [=\
    \ <property_initializer>]\n    [<getter>]\n    [<setter>]\n```\n\n`PropertyType`、`getter`\
    \ 和 `setter` 在定义属性时都是可选的。\n\n**HelloWorld.kt**\n\n```\nclass Employee {\n  var\
    \ name: String = \"Krishna\"\n    get () = field\n    set (value) {\n      field\
    \ = value\n    }\n  var age : Int = 28\n    get () = field\n    set (value) {\n\
    \      field = value\n    }\n  val orgID = \"ORG1234\"\n}\n\nfun main (args: Array<String>)\
    \ {\n  var emp = Employee()\n  println( \"name : ${emp.name}\" )\n  println( \"\
    age : ${emp.age}\" )\n  println( \"orgID : ${emp.orgID}\" )\n}\n```\n\n**输出**\n\
    \n```\nname : Krishna\nage : 28\norgID : ORG1234\n```\n\n如你所见，我使用了 `field` 标识符来引用幕后字段。按照惯例，setter\
    \ 方法使用 `value` 作为参数名，但你可以使用任何名称。\n\n### 为什么需要 Getter 和 Setter 方法？\n\nGetter 和\
    \ setter 方法用于在发送/设置信息之前对数据进行转换/验证。\n\n```\nvar age : Int = 28\n    get() = field\n\
    \    set(value) {\n          if(value < 0 || value > 100)\n              field\
    \ = 3\n    }\n```\n\n例如，在上面的代码片段中，setter 方法在将年龄设置给属性之前进行验证。如果用户将年龄设置为 `<0` 或 `>\
    \ 100`，年龄将被设置为 `3`。下面是完整的工作示例。\n\n**HelloWorld.kt**\n\n```\nclass Employee {\n\
    \  var name: String = \"Krishna\"\n    get () = field\n    set (value) {\n   \
    \   field = value\n    }\n  var age: Int = 28\n    get () = field\n    set (value)\
    \ {\n      if (value < 0 || value > 100 )\n        field = 3\n    }\n  val orgID\
    \ = \"ORG1234\"\n}\n\nfun main (args: Array<String>) {\n  var emp = Employee()\n\
    \  println( \"name : ${emp.name}\" )\n  println( \"age : ${emp.age}\" )\n  println(\
    \ \"orgID : ${emp.orgID}\" )\n  emp.age = - 100\n  println( \"\\nAfter setting\
    \ the age to -100\" )\n  println( \"name : ${emp.name}\" )\n  println( \"age :\
    \ ${emp.age}\" )\n  println( \"orgID : ${emp.orgID}\" )\n}\n```\n\n**输出**\n\n\
    ```\nname : Krishna\nage : 28\norgID : ORG1234\n\nAfter setting the age to -100\n\
    name : Krishna\nage : 3\norgID : ORG1234\n```\n\nKotlin 为可变属性（使用 `var` 关键字定义的属性）提供默认的\
    \ getter 和 setter 方法，而对于不可变属性（使用 `val` 关键字定义的属性）只提供 getter 方法。\n\n```\nvar name\
    \ = \"Krishna\" // 类型为 String，具有默认的 getter 和 setter\nval orfID = \"orf1234\" //\
    \ 类型为 String，具有默认的 getter\n```\n\n## Kotlin：定义类的成员函数\n\nKotlin 中的函数使用 `fun` 关键字定义。\n\
    \n**示例：**\n\n```\nfun square(x : Int) : Int{\n    return x*x\n}\n```\n\n上面的代码片段定义了一个名为\
    \ `square` 的函数，它接受一个 `Int` 类型的参数并返回整数。\n\n**Employee.kt**\n\n```\nclass Employee\
    \ {\n  private var firstName: String = \"\"\n  private var: String = \"\"\n  fun\
    \ getFirstName (): String {\n    return firstName\n  }\n  fun getLastName ():\
    \ String {\n    return lastName\n  }\n  fun setFirstName (firstName: String) {\n\
    \    this .firstName = firstName\n  }\n  fun setLastName (lastName: String) {\n\
    \    this .lastName = lastName\n  }\n}\n```\n\n**Main.kt**\n\n```\nfun main (args:\
    \ Array<String>) {\n  var emp1 = Employee()\n  emp1.setFirstName( \"Chamu\" )\n\
    \  emp1.setLastName( \"Gurram\" )\n  println( \"firstName : ${emp1.getFirstName()}\"\
    \ )\n  println( \"lastName : ${emp1.getLastName()}\" )\n}\n```\n\n**输出**\n\n```\n\
    firstName : Chamu\nlastName : Gurram\n```\n\n## Kotlin：成员属性必须初始化\n\n在 Kotlin 中，成员属性要么被初始化，要么必须声明为抽象。让我们通过一个例子来看。\n\
    \n**Employee.kt**\n\n```\nclass Employee {\n  private var firstName: String\n\
    \  private var lastName: String\n  fun getFirstName (): String {\n    return firstName\n\
    \  }\n  fun getLastName (): String {\n    return lastName\n  }\n  fun setFirstName\
    \ (firstName: String) {\n    this .firstName = firstName\n  }\n  fun setLastName\
    \ (lastName: String) {\n    this .lastName = lastName\n  }\n}\n```\n\n尝试编译上面的程序，你会得到如下错误。\n\
    \n```\nC:\\>kotlinc Employee.kt\nEmployee.kt:2:2: error: property must be initialized\
    \ or be abstract\n        private var firstName: String\n        ^\nEmployee.kt:3:2:\
    \ error: property must be initialized or be abstract\n        private var lastName:\
    \ String\n```\n\n### 如何消除上述错误？\n\n有两种方法，要么初始化属性，要么将属性设为抽象。\n\n**方法 1：初始化 firstName\
