    \nprintln( \"tenLaksh : ${tenLaksh}\" )\n\n}\n```\n\n## Output\n\n```\nten : 10\n\
    \nhundred : 100\n\nthousand : 1000\n\ntenThousand : 10000\n\noneLaksh : 100000\n\
