    \ -> println( \"No value is checked\" )\n  }\n}\n```\n\n**Output**\n\n```\nChecked\
    \ value 5\n```\n\nYou can also check the ranges (or) not in ranges in branch condition.\n\
    \n`WhenDemo.kt`\n\n```\nfun main (args: Array<String>) {\n  var a : Int = 5\n\
    \  when (a){\n    in 1.. 5 , in 11.. 15 -> println( \"a is in between 1 to 5 (or)\
    \ 11 to 15\" )\n    in 6.. 10 -> println( \"a is in range of 6 to 10\" )\n   \
    \ else -> println( \"x is not in range\" )\n  }\n}\n```\n\n**Output**\n\n```\n\
    a is in between 1 to 5 (or) 11 to 15\n```\n\n## Kotlin: Using `when` as if-else\
    \ if ladder\n\nYou can also use `when` expression as if-elseif ladder. If you\
    \ do not specify any argument to `when` expression, it can be used as if-else\
    \ if ladder.\n\n`ConditionDemo.kt`\n\n```\nfun main (args: Array<String>) {\n\
    \  var marks: Int = 65\n  if (marks < 35 )\n    println( \"You are failed\" );\n\
    \  else if (marks < 50 )\n    println( \"You are passed and got third class\"\
    \ );\n  else if (marks < 60 )\n    println( \"You are passed and got second class\"\
    \ );\n  else if (marks < 70 )\n    println( \"You are passed and got first class\"\
    \ );\n  else\n    println ( \"You are passed and got distinction\" );\n}\n```\n\
    \n**Output**\n\n```\nYou are passed and got first class\n```\n\nYou can implement\
    \ above if-else if-else logic using `when` expression like below.\n\n`WhenDemo.kt`\n\
    \n```\nfun main (args: Array<String>) {\n  var marks: Int = 65\n  when {\n   \
    \ (marks < 35 ) -> println( \"You are failed\" )\n    (marks < 50 ) -> println(\
    \ \"You are passed and got third class\" )\n    (marks < 60 ) -> println( \"You\
    \ are passed and got second class\" )\n    (marks < 70 ) -> println( \"You are\
    \ passed and got first class\" )\n    else -> println( \"You are passed and got\
    \ distinction\" )\n  }\n}\n```\n\n**Output**\n\n```\nYou are passed and got first\
    \ class\n```\n\n## Kotlin: Use `when` as expression\n\nYou can use `when` as expression.\
    \ If you use `when` as expression, the value of the matched branch will be the\
    \ value of `when` expression.\n\n`WhenDemo.kt`\n\n```\nfun main (args: Array<String>)\
    \ {\n  var a : Int = 2\n  var s : String = \"cube\"\n  var result = when {\n \
    \   Eccleston .equals( \"double\" ) -> a * a\n    s.equals( \"cube\" ) -> a *\
    \ a * a\n    else -> a\n  }\n  println( \"result is $result\" )\n}\n```\n\n**Output**\n\
    \n```\nresult is 8\n```\n\n## Kotlin: `for` loop\n\n`for` loop is used to iterate\
    \ over a collection, array, ranges etc.,\n\nBy using `for` loop, you can iterate\
    \ over anything that provides iterator.\n\n### Looping through arrays\n\n**Syntax**\n\
    \n```\nfor(ele in array){\n}\n```\n\n`ArrayDemo.kt`\n\n```\nfun main (args: Array<String>)\
    \ {\n  var arr: Array<Int> = arrayOf( 2 , 3 , 5 , 7 )\n  for (ele in arr){\n \
    \   println(ele)\n  }\n}\n```\n\n**Output**\n\n```\n2\n3\n5\n7\n```\n\n### Loop\
    \ over a range\n\n`ArrayDemo.kt`\n\n```\nfun main (args: Array<String>) {\n  for\
