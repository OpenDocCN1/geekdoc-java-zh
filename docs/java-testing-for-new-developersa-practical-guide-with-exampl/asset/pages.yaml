    errors. For users working on command-line interfaces, many JDK distributions provide
    instructions for performing a single or command-driven installation. For instance,
    on Linux systems, one must extract the tarball and place it in a designated folder,
    then manually update the systems path. An example of command for extracting a
    tarball is provided below:


    ```

    -xzf openjdk11_linux-x64.tar.gz -C /usr/local/

    ```


    Following extraction, it is necessary to configure the environment variables.
    This configuration ensures that the operating system can locate the JDK binaries
    during the compilation and testing phases. On Unix-based systems such as Linux
    or macOS, the JAVA_HOME environment variable must be set to the installation directory
    of the JDK. Additionally, the PATH variable should be updated to include the binary
    directory of the JDK. The commands below illustrate how to set these environment
    variables in a typical configuration file (e.g., .bashrc or .zshrc):


    ```

    export JAVA_HOME=/usr/local/jdk-11

    export PATH=$JAVA_HOME/bin:$PATH

    ```


    After adding these lines to the respective configuration file, the changes are
    applied by reloading the file or restarting the terminal session. On Windows systems,
    environment variables are set through the System Properties dialog, where the
    JAVA_HOME variable is defined, and the PATH variable is modified to include the
    path to the bin directory of the installed JDK.


