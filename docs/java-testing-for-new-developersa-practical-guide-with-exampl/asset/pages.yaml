    # 5.4 Stubs for Test Isolation


    Stubs simplified implementations of components that provide defined responses
    to calls during testing. They play an essential role in test isolation by eliminating
    dependencies on complex or unreliable external systems. This independence is particularly
    important when a unit of code interacts with components that exhibit non-deterministic
    behavior, such as network services, databases, or external APIs. By replacing
    these components with stubs, tests become faster, more reliable, and easier to
    maintain.


    A primary technique for using stubs is to identify and isolate external dependencies
    that do not full interaction verification. In practice, this involves determining
    which parts of the system can be simulated with a static response, thereby needing
    to execute any underlying logic. For example, when a service method relies on
    an external data source to provide a list of records, a stub can be implemented
    to return a fixed data set. The fixed output ensures that the test evaluates only
    the logic within the unit test without interference from secondary systems. A
    well-designed stub encapsulates the behavior of the external dependency by simulating
    its interface and predefined responses.'
