    Stubs also support testing in environments where the external dependency may be
    unreliable or unavailable. In a continuous integration environment, tests must
    run deterministically without being affected by external network conditions or
    service downtimes. By using stubs, the external variability is eliminated, ensuring
    that tests run quickly and consistently. This isolation enhances the reliability
    of the test suite and facilitates automated testing practices. In addition, stubs
    allow developers to simulate scenarios that may be difficult to reproduce with
