  md: "\nSimilarly, TestNG offers an alternative approach for testing in Java, with\
    \ a focus on flexibility and configurability. TestNG supports a wide range of\
    \ testing needs, from unit testing to integration testing, and its advanced features\
    \ make it suitable for larger projects with complex testing requirements. Unlike\
    \ JUnit, TestNG incorporates features such as data-driven testing, parallel test\
    \ execution, and advanced configuration options. TestNG allows tests to be grouped\
    \ and prioritized, and it provides annotations like @BeforeMethod, @AfterMethod,\
    \ @BeforeClass, and @AfterClass to manage test execution at different levels of\
    \ granularity. The following code provides an example of a TestNG test case:\n\
    \n```java\nimport org.testng.Assert;\nimport org.testng.annotations.BeforeClass;\n\
    import org.testng.annotations.Test;\n\npublic class CalculatorTestNG {\n    @BeforeClass\n\
    \    public void initialization() {\n        // Initialize once before any test\
    \ methods are run\n        calculator = new Calculator();\n    }\n\n    @Test(priority\
    \ = 1)\n    public void testSubtraction() {\n        int result = calculator.subtract(10,\
    \ 5);\n        Assert.assertEquals(result, 5, \"Subtraction method should return\
    \ the result\");\n    }\n\n    @Test(priority = 2, dataProvider = \"additionData\"\
    )\n    public void testAddition(int a, int b, int expected) {\n        int result\
    \ = calculator.add(a, b);\n        Assert.assertEquals(result, expected);\n  \
    \  }\n\n    @org.testng.annotations.DataProvider(name = \"additionData\")\n  \
    \  public Object[][] createAdditionData() {\n        return new Object[][]{\n\
    \            { 2, 3, 5 },\n            { -3, 3, 0 },\n            { 0, 0, 0 }\n\
    \        };\n    }\n}\n```\n\nIn this TestNG example, tests are annotated with\
    \ priorities to control execution order. The data provider mechanism facilitates\
    \ parameterized testing, allowing multiple sets of inputs to be fed into a single\
    \ test case. This feature is particularly advantageous when it is necessary to\
    \ validate functionality over a range of data conditions, ensuring that the tested\
    \ method behaves as expected across various scenarios.\n\nBoth JUnit and TestNG\
    \ can be integrated into a continuous integration (CI) environment to automatically\
    \ execute tests as part of the build process. Integration with CI servers, such\
    \ as Jenkins or GitHub Actions, ensures that the codebase remains stable as new\
    \ changes are introduced. For instance, Maven and Gradle, which are popular build\
    \ automation tools in Java development, provide plugins that execute tests during\
    \ the build lifecycle. Below is an example of a Maven configuration snippet that\
    \ includes the Surefire plugin to run JUnit or TestNG tests:\n\n```xml\n<build>\n\
    \  <plugins>\n    <plugin>\n      <groupId>org.apache.maven.plugins</groupId>\n\
    \      <artifactId>maven-surefire-plugin</artifactId>\n      <version>2.22.2</version>\n\
    \      <configuration>\n        <includes>\n          <include>/**Test.java</include>\n\
    \        </includes>\n      </configuration>\n    </plugin>\n  </plugins>\n</build>\n\
    ```\n\nThe Maven Surefire Plugin configuration ensures that all test cases following\
    \ the naming conventions (such as classes ending with Test) are automatically\
    \ discovered and executed during the build process. This automation greatly reduces\
    \ the manual effort required to run tests and contributes to higher code quality\
    \ by providing immediate feedback on results.\n\nIn addition to JUnit and TestNG,\
    \ other tools and libraries complement the testing process in Java. Mocking frameworks,\
    \ such as Mockito, allow developers to create simulated objects that mimic the\
    \ behavior of real objects. These mocks are invaluable when testing components\
    \ that interact with external systems, such as databases or web services.\n\n\
    Using mocks ensures unit tests remain isolated and focused on the logic within\
    \ the module under test. The simplicity of Mockito's API makes it accessible to\
    \ beginners while maintaining the advanced features required for sophisticated\
    \ test scenarios.\n\n```java\nimport static org.mockito.Mockito.*;\nimport org.junit.Test;\n\
    \npublic class ServiceTest {\n    @Test\n    public void testServiceMethod() {\n\
    \        // Create a mock of the dependency\n        Dependency dependencyMock\
    \ = mock(Dependency.class);\n        when(dependencyMock.getData()).thenReturn(\"\
    Mock Data\");\n\n        // Instantiate the service with the dependency\n    \
    \    Service service = new Service(dependencyMock);\n        String result = service.processData();\n\
    \n        // Validate that the processed data meets expectations\n        assertEquals(\"\
    Expected processed data using mock dependency.\", result);\n    }\n}\n```\n"
  mdcn: "\n同样，TestNG 为 Java 测试提供了一种替代方案，重点侧重于灵活性和可配置性。TestNG 支持广泛的测试需求，从单元测试到集成测试，其高级功能使其适用于具有复杂测试需求的大型项目。与\
    \ JUnit 不同，TestNG 整合了数据驱动测试、并行测试执行和高级配置选项等功能。TestNG 允许对测试进行分组和排序，并提供了如 `@BeforeMethod`、`@AfterMethod`、`@BeforeClass`\
    \ 和 `@AfterClass` 等注解在不同的粒度上管理测试执行。以下代码提供了一个 TestNG 测试用例的示例：\n\n```java\nimport\
    \ org.testng.Assert;\nimport org.testng.annotations.BeforeClass;\nimport org.testng.annotations.Test;\n\
    \npublic class CalculatorTestNG {\n    @BeforeClass\n    public void initialization()\
    \ {\n        // 在任何测试方法运行之前初始化一次\n        calculator = new Calculator();\n   \
    \ }\n\n    @Test(priority = 1)\n    public void testSubtraction() {\n        int\
    \ result = calculator.subtract(10, 5);\n        Assert.assertEquals(result, 5,\
    \ \"Subtraction method should return the result\");\n    }\n\n    @Test(priority\
    \ = 2, dataProvider = \"additionData\")\n    public void testAddition(int a, int\
    \ b, int expected) {\n        int result = calculator.add(a, b);\n        Assert.assertEquals(result,\
    \ expected);\n    }\n\n    @org.testng.annotations.DataProvider(name = \"additionData\"\
    )\n    public Object[][] createAdditionData() {\n        return new Object[][]{\n\
    \            { 2, 3, 5 },\n            { -3, 3, 0 },\n            { 0, 0, 0 }\n\
    \        };\n    }\n}\n```\n\n在这个 TestNG 示例中，测试通过优先级进行标记以控制执行顺序。数据提供者机制促进了参数化测试，允许将多组输入馈送到单个测试用例中。当需要在一系列数据条件下验证功能时，这一特性特别有利，可以确保被测试的方法在各种场景下的行为符合预期。\n\
    \nJUnit 和 TestNG 都可以集成到持续集成（CI）环境中，作为构建过程的一部分自动执行测试。与 Jenkins 或 GitHub Actions\
    \ 等 CI 服务器的集成，可以确保在引入新更改时代码库保持稳定。例如，Java 开发中流行的构建自动化工具 Maven 和 Gradle 提供了在构建生命周期期间执行测试的插件。下面是一个包含\
    \ Surefire 插件的 Maven 配置片段示例，用于运行 JUnit 或 TestNG 测试：\n\n```xml\n<build>\n  <plugins>\n\
    \    <plugin>\n      <groupId>org.apache.maven.plugins</groupId>\n      <artifactId>maven-surefire-plugin</artifactId>\n\
    \      <version>2.22.2</version>\n      <configuration>\n        <includes>\n\
    \          <include>/**Test.java</include>\n        </includes>\n      </configuration>\n\
    \    </plugin>\n  </plugins>\n</build>\n```\n\nMaven Surefire 插件配置确保所有遵循命名规范（例如以\
    \ Test 结尾的类）的测试用例在构建过程中被自动发现并执行。这种自动化极大减少了运行测试所需的人工工作，并通过对结果提供即时反馈提高了代码质量。\n\n\
    除了 JUnit 和 TestNG 之外，其他工具和库补充了 Java 的测试过程。模拟框架（如 Mockito）允许开发者创建模拟真实对象行为的符号。在测试与外部系统（如数据库或网络服务）交互的组件时，这些\
    \ mock 对象是无价的。\n\n使用 mock 可以确保单元测试保持隔离，并专注于被测试模块内部逻辑。Mockito API 的简单性使得初学者也能上手，同时保留了复杂测试场景所需的高级功能。\n\
    \n```java\nimport static org.mockito.Mockito.*;\nimport org.junit.Test;\n\npublic\
    \ class ServiceTest {\n    @Test\n    public void testServiceMethod() {\n    \
    \    // 创建依赖的 mock 对象\n        Dependency dependencyMock = mock(Dependency.class);\n\
    \        when(dependencyMock.getData()).thenReturn(\"Mock Data\");\n\n       \
    \ // 使用依赖项实例化服务\n        Service service = new Service(dependencyMock);\n    \
    \    String result = service.processData();\n\n        // 验证处理后的数据符合预期\n     \
    \   assertEquals(\"Expected processed data using mock dependency.\", result);\n\
    \    }\n}\n```\n"
