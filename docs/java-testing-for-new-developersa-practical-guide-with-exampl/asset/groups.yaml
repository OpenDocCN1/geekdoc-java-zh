    \n## 6.2 集成测试的方法\n\n集成测试采用几种方法论来验证软件组件之间的集成情况。每种方法都提供了一种独特的策略来发现集成问题，并解决模块是否按预期方式联合工作。三种广泛认可的策略是自顶向下集成、自底向上集成和三明治（或混合）集成。以下讨论详细检查了这些方法，概述了它们的机制、优点、局限性以及对各种项目场景的适用性。\n\
    \n自顶向下集成从高层模块向低层组件启动测试过程。在这种方法中，测试从直接与用户或外部接口交互的模块开始。随着测试存根或模拟对象模拟其行为，低层模块逐渐被纳入。该方法的主要目的是验证应用程序层次结构顶部的控制和逻辑。创建测试存根是为了模拟低层组件。自顶向下集成的优势是可以在早期阶段发现设计缺陷。这种方法在许多情况下都是非常有用，因为它允许在开发完成之前进行测试。自顶向下集成的益处之一是能够快速发现高层问题。然而，创建测试存根需要额外的工作。由于需要等待所有组件实现，某些集成测试的发现可能会被推后。自顶向下集成的一种的一种伪代码示例可能如下：\n\
