  mdcn: "\n更清晰的预期行为文档，并最终使系统更易维护和扩展。\n\n需要注意的是，mock（模拟）和 stub（存桩）是强大的工具，误用这些技术可能会导致测试无法完全代表生产环境的行为。例如，过度使用\
    \ mock 可能会导致测试过度关注内部交互，而不是单元的外部行为。同样，对 stub 的过度依赖会掩盖只有在完全集成的场景下才会出现的问题。因此，建议采用平衡的方法，根据特定测试场景的需求同时利用\
    \ mock 和 stub。通过仔细选择系统的哪些部分使用 stub 进行模拟，以及哪些部分使用 mock 进行验证，开发者可以构建一套全面的单元测试套件，这套测试既反映了单个组件的隔离行为，又反映了它们在系统中的集成操作。\n\
    \nmock 和 stub 的策略性使用在单元测试方法论中具有显著的解释价值。它们提供了管理依赖、控制测试环境以及严格验证交互的机制。掌握这些技术对于开发者实现稳健的测试、驱动有效的\
    \ TDD（测试驱动开发）以及培养高质量的软件设计至关重要。通过确保每个单元测试都兼顾正确性和交互保真度，软件工程师能够更好地应对复杂的开发挑战，并交付在每个抽象层级都经过严格验证的系统。\n\
    \n## 5.3 创建 Mock 对象\n\n创建 mock 对象的过程是实现有效单元测试的核心，因为它允许开发者将被测代码与其外部依赖隔离开。本节提供了关于创建和使用\
    \ mock 在测试中模拟真实对象的技术指南，以确保测试保持精确性和可维护性。mock 对象的创建涉及隔离、预期验证和简单性等原则的仔细应用。每个方面都有助于获得可靠的测试结果，并使代码随时间推移更容易理解、调试和扩展。\n\
    \n创建 mock 对象的核心目标是用一个受控的替代品替换实际依赖。这种做法允许单元测试关注组件的内部逻辑，而不是外部类或服务的行为。第一条指南是识别必须模拟的组件。开发者应该针对那些引入副作用的依赖，例如网络调用、数据库事务或文件系统操作。通过用\
    \ mock 替换这些内容，测试获得了速度和确定性，从而消除了操作外部资源可能产生的不确定性。\n\n开发者必须在项目早期决定合适的 mock 框架。在 Java\
    \ 中，Mockito 是一个流行的选择，它提供了直观的 API 来创建、设置行为以及验证与 mock 对象的交互。一旦选择了框架，设置测试环境时应包含必要的依赖，以确保框架与\
    \ JUnit 等其他工具兼容。保持生产代码和测试代码之间清晰的分离至关重要，以免 mock 的引入损害生产系统的设计。\n\n创建 mock 的一个实用指南是从接口或抽象类开始，而不是具体的实现。这种方法符合依赖倒置原则，并便于用测试双（test\
    \ doubles）替换实际实现。编写单元测试时，鼓励开发者面向接口编程，这在用 mock 替换真实对象时提供了灵活性。这种方法确保了 mock 对象的行为可以清晰定义而不产生歧义，使测试变得稳健并仅关注被测试的特定方法。\n\
    \n在创建 mock 对象期间，必须清晰定义预期行为。该定义包括指定哪些方法预期被调用以及相应的返回值。例如，当服务方法依赖存储库来获取数据时，可以配置 mock\
    \ 在方法被调用时返回一个受控的值。以下代码片段说明了如何使用 Java 中的 Mockito 创建基础 mock：\n\n```java\nimport\
    \ static org.mockito.Mockito.*;\nimport org.junit.Test;\n```\n\n```java\npublic\
    \ class RepositoryTest {\n\n    @Test\n    public void testFetchData() {\n   \
    \     // 创建 Repository 接口的 mock。\n        Repository repositoryMock = mock(Repository.class);\n\
    \n        // 定义被模拟方法的行为。\n        when(repositoryMock.getData()).thenReturn(\"\
    sample data\");\n\n        // 在依赖于 repository 的服务中使用 mock 对象。\n        Service\
    \ service = new Service(repositoryMock);\n        String result = service.processData();\n\
    \n        // 验证结果符合预期。\n        assertEquals(\"sample data\", result);\n\n   \
    \     // 验证 getData 方法恰好调用了一次。\n        verify(repositoryMock, times(1)).getData();\n\
    \    }\n}\n```\n\n在这个示例中，mock 对象 repositoryMock 模拟了存储库依赖，允许服务在不需要实际数据库连接的情况下运行。使用\
    \ when-then 模式定义 mock 对象的行为建立了清晰的预期，随后验证方法调用确认了单元测试按预期与 mock 交互。\n\n另一个重要指南是尽量减少与\
    \ mock 对象交互的复杂性。虽然在技术上可以设置大量的 mock，但验证众多交互的复杂性可能导致测试脆弱，当实现细节发生细微变化时就会失败。将测试集中在被测的主要行为上可以确保使用\
    \ mock 不引入开销。这种做法通过设计范围有限的方法并建立清晰的责任边界来实现。在实践中，开发者应该将 mock 的使用限制在行为验证至关重要的依赖上，而在只需要预定义输出的情况下允许使用简单的\
    \ stub。\n\n建议对 mock 对象采用一致的命名约定。以立即传达其角色的方式命名 mock 可以提高可读性和维护性。在测试方法中，开发者应该命名\
    \ mock 对象以反映它们所模拟的接口或类。这种做法增强了任何审查测试代码者的理解，特别是当测试作为跨多个开发周期维护的广泛测试套件的一部分时。\n\n\
    与 mock 交互测试还需要对方法调用进行精确验证。验证通常涉及检查某些方法是否带有预期参数调用，并在需要时按特定顺序调用。mock 框架（如 Mockito）提供了断言交互按计划发生的机制。鼓励开发者使用这些验证功能来确保单元测试符合设计的协议。这种方法可以解决预期设计与实际实现之间的差异，从而尽早发现集成问题。在方法调用顺序至关重要的复杂系统中，验证操作顺序为测试结果提供了额外的信心。\n\
    \n在设置 mock 时，必须谨慎避免过度规范行为（over-specifying）。过度规范会导致测试与实现细节过度紧密，使得未来的修改更具挑战性。相反，测试应该关注单元测试的可观察行为。这意味着测试应该验证对功能具有意义的输出，而不是验证交互的每一个内部细节。\n"
