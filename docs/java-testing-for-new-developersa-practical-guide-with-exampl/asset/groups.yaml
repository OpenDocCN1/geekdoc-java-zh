    \n除了简单的算术测试外，示例测试还可以扩展以验证其他功能。例如，可以使用测试来验证字符串操作、数组操作，甚至与数据结构的交互。其核心思想保持不变：执行计算，使用断言将实际结果与预期结果进行比较，并报告任何差异。花费一些时间编写多个测试可以确保配置是稳健的，并且测试环境的每个组件都按预期运行。\n\
    \n除了运行单个测试外，生成和审查测试报告也非常有用。构建自动化工具会自动生成这些报告并将其存储在指定的目录中。例如，Maven 在 `target/surefire-reports`\
