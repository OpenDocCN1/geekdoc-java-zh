    \ 规则提供了一种更详细的机制，以验证异常是否包含预期的消息或是否在精确条件下发生。\n\n```java\nimport org.junit.Rule;\n\
    import org.junit.Test;\nimport org.junit.rules.ExpectedException;\n```\n\n```java\n\
    public class DividerTest {\n  @Rule\npublic ExpectedException thrown = ExpectedException.none();\n\
    \n@Test\npublic void testDivideByZeroThrowsException() {\n    thrown.expect(ArithmeticException.class);\n\
    \    thrown.setMessage(\"Division by zero\");\n    Divider divider = new Divider();\n\
    \    divider.divide(10, 0);\n}\n```\n\n在需要进行更复杂的对象比较的情况下，JUnit 可以与 Hamcrest 等库中的匹配器（matchers）结合使用。匹配器允许对被测对象的特征进行表达性语句。例如，测试不仅简单地比较字符串相等，还可以检查字符串是否包含给定的子字符串、是否符合预期模式或满足特定条件。这种高级检查机制增强了测试的表达性，并有助于提高其描述能力。\n\
    \nJUnit 的另一个核心特性是使用参数化测试。参数化测试允许单个方法使用不同的输入值运行多次，这避免了冗余并保证了对潜在场景的全面覆盖。当被测方法预计以统一的方式处理范围输入时，参数化测试\
    \ 特别有用。\n\n```java\nimport static org.junit.Assert.assertEquals;\nimport java.util.Arrays;\n\
    import java.util.Collection;\nimport org.junit.Test;\nimport org.junit.runner.RunWith;\n\
    import org.junit.runners.Parameterized;\n\n@RunWith(Parameterized.class)\npublic\
    \ class FibonacciTest {\n    private int input;\n    private int expectedOutput;\n\
    \n    public FibonacciTest(int input, int expectedOutput) {\n        this.input\
    \ = input;\n        this.expectedOutput = expectedOutput;\n    }\n\n@Parameterized.Parameters\n\
    ```java\npublic static Collection<Object[]> data() {\n    return Arrays.asList(new\
    \ Object[][] {\n        { 0, 0 },\n        { 1, 1 },\n        { 2, 1 },\n    \
    \    { 3, 2 },\n        { 4, 3 },\n        { 5, 5 }\n    });\n}\n```\n\n```java\n\
    @Test\npublic void testFibonacci() {\n    assertEquals(\"Fibonacci computation\
    \ is incorrect\", expectedOutput, Fibonacci.compute(input));\n}\n```\n\n此示例演示了参数化测试如何使用各种输入执行同一个测试方法，确保\
    \ `Fibonacci.compute` 方法对一系列定义的用例返回正确的结果。参数化测试将相似的测试场景合并到一个测试块中，简化了维护。\n\nJUnit\
    \ 还支持测试套件（test suites）的概念，允许开发者对多个测试类并在并在运行中执行它们。测试套件使用 `@RunWith(Suite.class)`\
    \ 和 `@Suite.SuiteClasses` 注解配置。测试套件对于按模块或功能组织测试特别有用，能够在开发或集成阶段选择性地执行测试。\n\n```java\n\
    import org.junit.runner.RunWith;\nimport org.junit.runners.Suite;\n```\n\n```java\n\
    @RunWith(Suite.class)\n@Suite.SuiteClasses({\n    CalculatorTest.class,\n    DividerTest.class,\n\
    \    FibonacciTest.class\n})\npublic class AllTests {\n    // 此类保持为空。其唯一目的是持有注解\n\
    }\n```\n\n除了基础知识外，有效使用 JUnit 还涉及将测试集成到更广泛的开发过程中。持续集成（CI）系统通常使用 JUnit 作为测试框架，在每次代码提交时自动运行测试，以尽早检测回归。配置\
    \ CI 环境、建立一致的测试执行顺序并处理依赖可以实现自动化测试的收益。在现代开发工作流中，与 Jenkins、CircleCI 或 GitHub Actions\
    \ 等 CI 服务器集成可以确保测试套件得到持续验证，反映代码库的持续状况。\n\n编写 JUnit 测试时考虑的另一个方面是测试数据的管理。测试通常需要受控的输入数据以产生可靠且重复的结果。为了确保多次执行之间的数据一致，开发者可以使用数据的内存表示，或设置模拟生产级输入的测试固件（fixtures）。利用\
    \ Mockito 等库的模拟对象（mock objects）可以进一步增强测试的健壮性，通过模拟依赖并专注于孤立的单元。这种方法减少了对外部系统的依赖，确保测试保持快速且确定。\n"
