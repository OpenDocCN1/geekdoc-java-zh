    services. The first guideline is to identify the components that must be simulated.
    Developers should target dependencies that introduce side effects, such as network
    calls, database transactions, or file system operations. By replacing these with
    mocks, tests gain speed and determinism, thereby eliminating the uncertainties
    that may arise from operating on external resources.


