  - "[PAGE 145]\n\ntests combine components of the system to identify issues that\
    \ may arise from their interaction. Integration tests typically involve setting\
    \ up a controlled environment that mimics the production setting and executing\
    \ tests that rely on external resources, such as databases or REST APIs. A CI\
    \ pipeline configured to run integration tests must handle environment-dependent\
    \ variables and external dependencies. Consider an example where integration tests\
    \ are executed using Maven:\n\n```\n<profile>\n  <id>integration-tests</id>\n\
    \  <build>\n    <plugins>\n      <groupId>org.apache.maven.plugins</groupId>\n\
    \      <artifactId>maven-failsafe-plugin</artifactId>\n      <version>2.22.2</version>\n\
    \      <executions>\n        <execution>\n          <goals>\n            <goal>integration-test</goal>\n\
    \            <goal>verify</goal>\n          </goals>\n        </execution>\n \
    \     </executions>\n    </plugins>\n  </build>\n</profile>\n```\n\nThis Maven\
    \ configuration snippet defines a profile for integration tests. The maven-failsafe-plugin\
    \ schedules the execution of tests in a phase distinct from the standard test\
    \ phase, allowing for the orderly orchestration of integration tests. By segregating\
    \ integration tests from unit tests, the CI pipeline can enforce handling strategies,\
    \ such as starting and tearing down test environments automatically.\n\nAutomated\
    \ test scripts can also be enhanced through the use of mocks, and simulated environments.\
    \ This approach facilitates test execution by isolating components that interact\
    \ with external systems. Tools such as Mockito aid in creating mock objects that\
    \ simulate the behavior of complex dependencies. Consequently, the CI pipeline\
    \ is capable of testing components in isolation even when external services are\
    \ unavailable or unstable. A basic example of Mockito in a test case is demonstrated\
    \ below:"
