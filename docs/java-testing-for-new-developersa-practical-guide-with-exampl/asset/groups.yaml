    \ maintenance and assists future developers in understanding both the intent and\
    \ actual usage of the mock objects. This practice is particularly relevant in\
    \ projects where multiple teams interact and tests serve not only to validate\
    \ behavior but also to convey design intents.\n\nFinally, creating mock objects\
    \ should be accompanied by a robust review process. Code reviews should specifically\
    \ assess the proper use and configuration of mocks to ensure adherence to best\
    \ practices. Peer reviews help identify potential over-specification or misuse\
    \ of mocks and suggest improvements in test design. Consistent review mechanisms\
    \ ensure that the testing strategy remains aligned with overall software quality\
    \ goals and that the tests continue to serve as effective documentation of expected\
    \ behavior.\n\nThe guidelines for creating mock objects are grounded in principles\
    \ of isolation, simplicity, and targeted verification. Understanding where and\
    \ how to apply mocks, with best practices for their creation, encourages the development\
    \ of tests that are precise, maintainable, and aligned with the overall software\
    \ architecture. By faithfully recreating the behavior of external dependencies,\
    \ developers can create tests that provide immediate and reliable feedback, ensuring\
    \ that each component of the system behaves as expected under both typical and\
    \ exceptional conditions. This deliberate approach to constructing mock objects\
    \ ultimately contributes to a codebase that is robust, modular, and easier to\
    \ extend throughout the software development lifecycle.\n\n## 5.4 Stubs for Test\
    \ Isolation\n\nStubs are simplified implementations of components that provide\
    \ defined responses to calls during testing. They play an essential role in test\
    \ isolation by eliminating dependencies on complex or unreliable external systems.\
    \ This independence is particularly important when a unit of code interacts with\
    \ components that exhibit non-deterministic behavior, such as network services,\
    \ databases, or external APIs. By replacing these components with stubs, tests\
    \ become faster, more reliable, and easier to maintain.\n\nA primary technique\
    \ for using stubs is to identify and isolate external dependencies that do not\
    \ require full interaction verification. In practice, this involves determining\
    \ which parts of the system can be simulated with a static response, thereby needing\
    \ to execute any underlying logic. For example, when a service method relies on\
    \ an external data source to provide a list of records, a stub can be implemented\
    \ to return a fixed data set. The fixed output ensures that the test evaluates\
    \ only the logic within the unit test without interference from secondary systems.\
    \ A well-designed stub encapsulates the behavior of the external dependency by\
    \ simulating its interface and predefined responses.\n\nThe next step in implementing\
    \ stubs for test isolation is to design them with simplicity and clarity in mind.\
    \ Unlike mocks, which often include detailed verifications and behavior expectations,\
    \ stubs are primarily intended to supply controlled outputs. They are implemented\
    \ with the minimal logic required to fulfill the contract expected by the unit\
    \ test. By adhering to a simplistic design, stubs reduce the complexity of the\
    \ test environment and decrease the likelihood of introducing errors through the\
    \ test itself. In many cases, developers may opt for hand-written stub classes\
    \ or use inline implementations that override only the necessary methods of a\
    \ dependency.\n\nConsider a scenario in which a component responsible for processing\
    \ user input needs to retrieve configuration parameters from an external source.\
    \ The real configuration source may involve complex logic, such as file reads,\
    \ database queries, or remote API calls. However, during unit testing, the focus\
    \ is solely on ensuring the correctness of the input processing logic. A stub\
    \ can mimic the configuration source by returning predefined values. The following\
    \ code snippet illustrates a simplified example using Java:\n\n```java\npublic\
    \ interface ConfigurationService {\n    String getParameter(String key);\n}\n\n\
    public class ConfigurationStub implements ConfigurationService {\n    @Override\n\
    \    public String getParameter(String key) {\n        if (\"timeout\".equals(key))\
    \ {\n            return \"30\";\n        } else if (\"mode\".equals(key)) {\n\
    \            return \"test\";\n        }\n        return \"\";\n    }\n}\n```\n\
    \nIn this example, the stub ConfigurationStub replaces a potentially complex configuration\
    \ service with a straightforward implementation. It simulates the response for\
    \ specific parameters, ensuring that the unit test receives consistent and controlled\
    \ outputs.\n\nAnother critical technique for using stubs is to ensure that they\
    \ are easily configurable and extensible. Test scenarios may require varying responses\
    \ to evaluate different branches of the code. Therefore, a robust stub implementation\
    \ should allow for easy modifications of its behavior. Developers often achieve\
    \ this by parameterizing the stub through constructor arguments. For instance,\
    \ consider a scenario where a payment processing component interacts with an external\
    \ gateway service. During testing, one might require the stubbed gateway to simulate\
    \ both successful transactions and various types of failures. An extensible stub\
    \ can be implemented as follows:\n\n```java\npublic interface PaymentGateway {\n\
    \    boolean processPayment(double amount);\n}\n\npublic class PaymentGatewayStub\
    \ implements PaymentGateway {\n    private boolean shouldSucceed;\n\n    public\
    \ PaymentGatewayStub(boolean shouldSucceed) {\n        this.shouldSucceed = shouldSucceed;\n\
    \    }\n\n    @Override\n    public boolean processPayment(double amount) {\n\
    \        return shouldSucceed;\n    }\n}\n```\n\nIn this implementation, the behavior\
    \ of the PaymentGatewayStub is determined at instantiation. Tests can create an\
    \ instance of the stub with either a success flag or a failure flag, exercising\
    \ different branches of the processing logic. By controlling the stub's output\
    \ through its constructor, the test cases remain isolated and deterministic, regardless\
    \ of the complexity of the actual gateway.\n\nAnother important guideline is to\
    \ maintain clear and consistent documentation within the stub's codebase. Inline\
    \ comments should specify the intended behavior, the rationale behind chosen responses,\
    \ and any limitations of the stub. Documentation helps to clarify that the stub\
    \ is not a complete implementation of the actual dependency but a tool to support\
    \ unit testing. Clear documentation allows other developers to understand the\
    \ scope of the stub and prevents the misuse of the stub in scenarios where a more\
    \ realistic simulation might be required. Moreover, well-documented stubs serve\
    \ as a reference point for future enhancements in testing strategies when the\
    \ design of the corresponding external dependency evolves.\n"
  mdcn: "\n确保测试在重构时保持健壮，并且当内部更改不影响外部行为时不会导致不必要的测试失败。\n\n此外，开发者必须考虑框架内 mock 对象（模拟对象）的周期。确保每个测试都是独立的，并且\
    \ mock 对象被正确初始化和销毁，可以防止测试之间的状态泄漏。这种隔离对于开发可靠的测试至关重要。像 JUnit 这样的框架通过允许在每个测试用例执行之前的设置方法中进行初始化来促进这一点。一致地使用这些设置方法可以保持整洁的测试环境，并允许每个测试在与之前的或后续测试隔离的情况下执行。\n\
    \nmock 的集成还应考虑边界条件和错误场景。一个健壮的单元测试不仅应该模拟正常执行路径，还应该模拟异常情况。开发者应该配置至少一些 mock 来抛出异常以模拟错误状态。这种方法确保被测试的代码能够正确处理失败。例如，一个处理数据的服务可能有一个偶尔失败的依赖项；通过\
    \ mock 对象模拟这一点可以确保该服务具有适当的错误处理逻辑。\n\n```java\nimport org.mockito.Mockito.*;\n\
    import org.junit.Test;\n```\n\n```java\npublic class ErrorHandlingTest {\n\n \
    \   @Test(expected = RuntimeException.class)\n    public void testFetchDataFailure()\
    \ {\n        // 为 DataService 接口创建一个 mock 对象。\n        DataService dataServiceMock\
    \ = mock(DataService.class);\n\n        // 配置 mock 抛出异常。\n        when(dataServiceMock.retrievedData()).thenThrow(new\
    \ RuntimeException(\"Data\"));\n\n        // 实例化带有故障依赖的组件。\n        DataProcessor\
    \ processor = new DataProcessor(dataServiceMock);\n        processor.process();\n\
    \    }\n}\n```\n\n在这一代码段中，配置 mock 在调用特定方法时抛出 RuntimeException，增强了单元测试有效处理失败模式的能力。将错误场景集成到测试中可以确保全面的覆盖率，并加强了组件在各种条件下的可靠性。\n\
    \n文档是创建 mock 对象的另一个方面。设置 mock 的测试应该包含注释，解释 mock 的目的、预期的交互以及配置某些行为的理由。在测试代码中清晰的文档有助于维护，并帮助未来的开发者理解\
    \ mock 对象的意图和实际用法。这种做法在多个团队相互协作的项目中尤为相关，因为测试不仅用于验证行为，还用于传达设计意图。\n\n最后，创建 mock\
    \ 对象应伴随着健壮的审查流程。代码审查应专门评估 mock 的正确使用和配置，以符合最佳实践。同行评审有助于识别潜在的过度规格或 mock 的误用，并对测试设计提出建议。一致的审查机制确保测试策略与整体软件质量目标保持一致，并确保测试继续作为预期行为的有效文档。\n\
    \n创建 mock 对象的指南基于隔离、简单和针对性验证的原则。理解在何时以及如何应用 mock，并掌握其创建的最佳实践，可以开发出精确、可维护且符合整体软件架构的测试。通过忠实地重建外部依赖的行为，开发者可以创建提供即时且可靠反馈的测试，确保系统的每个组件在典型和异常情况下都能按预期运行。这种构建\
    \ mock 对象的自觉方法最终有助于代码库在整个软件开发生命周期内保持健壮、模块化且易于扩展。\n\n## 5.4 用于测试隔离的 Stub（存根）\n\n\
    Stub 是组件的简化实现，它们在测试期间为调用提供预定义的响应。通过消除对复杂或不可靠的外部系统的依赖，Stub 在测试隔离中起着至关重要的作用。当代码单元与表现出非确定性行为的组件（如网络服务、数据库或外部\
    \ API）交互时，这种独立性尤为重要。通过用 Stub 替换这些组件，测试变得更快、更可靠且更易维护。\n\n使用 Stub 的主要技术是识别并隔离不需要完全交互验证的外部依赖。在实践中，这涉及确定系统的哪些部分可以使用静态响应进行模拟，从而无需执行任何底层逻辑。例如，当服务方法依赖于外部数据源来提供记录列表时，可以实现一个\
    \ Stub 来返回固定的数据集。固定输出确保测试仅评估单元测试内部的逻辑，而不受次要系统的干扰。一个设计良好的 Stub 通过模拟其接口和预定义响应，封装了外部依赖的行为。\n\
    \n实现用于测试隔离的 Stub 的下一步是是以简单和清晰为考虑对其进行设计。与 mock 不同（mock 通常经常包含详细的验证和行为预期），Stub 的主要意目的是提供受控的输出。它们是通过满足单元测试预期合约所需的最小逻辑来实现的。通过遵循简单的设计，Stub\
    \ 减少了测试环境的复杂性，并降低了通过测试本身引入错误的概率。在许多情况下，开发者可能会选择手写的 Stub 类，或使用仅覆盖依赖项必要方法的内联实现。\n\
    \n考虑这样一个场景：负责处理用户输入的组件需要从外部源检索配置参数。真实的配置源可能涉及复杂的逻辑，例如文件读取、数据库查询或远程 API 调用。然而，在单元测试期间，重点完全在于确保输入处理逻辑的正确性。Stub\
    \ 可以通过返回预定义值来模拟配置源。以下代码段说明了一个使用 Java 的简化示例：\n\n```java\npublic interface ConfigurationService\
    \ {\n    String getParameter(String key);\n}\n\npublic class ConfigurationStub\
    \ implements ConfigurationService {\n    @Override\n    public String getParameter(String\
    \ key) {\n        if (\"timeout\".equals(key)) {\n            return \"30\";\n\
    \        } else if (\"mode\".equals(key)) {\n            return \"test\";\n  \
    \      }\n        return \"\";\n    }\n}\n```\n\n在这个示例中，Stub ConfigurationStub\
    \ 用简单的实现替换了潜在复杂的配置服务。它模拟了特定参数的响应，确保单元测试接收到一致且受控的输出。\n\n使用 Stub 的另一个关键技术是确保它们易于配置和扩展。测试场景可能需要不同的响应来评估代码的不同分支。因此，一个健壮的\
    \ Stub 实现应该允许轻松修改其行为。开发者通常通过构造函数参数对 Stub 进行参数化来实现。例如，考虑一个支付处理组件与外部网关服务交互的场景。在测试期间，可能需要\
    \ Stub 化的网关模拟成功交易和各种类型的失败。一个可扩展的 Stub 可以如下实现：\n\n```java\npublic interface PaymentGateway\
    \ {\n    boolean processPayment(double amount);\n}\n\npublic class PaymentGatewayStub\
    \ implements PaymentGateway {\n    private boolean shouldSucceed;\n\n    public\
    \ PaymentGatewayStub(boolean shouldSucceed) {\n        this.shouldSucceed = shouldSucceed;\n\
    \    }\n\n    @Override\n    public boolean processPayment(double amount) {\n\
    \        return shouldSucceed;\n    }\n}\n```\n\n在此实现中，PaymentGatewayStub 的行为在实例化时确定。测试可以创建带有成功标志或失败标志的\
    \ Stub 实例，从而执行处理逻辑的不同分支。通过构造函数控制 Stub 的输出，无论实际网关有多复杂，测试用例都保持隔离且具有确定性。\n\n另一个重要指南是在\
    \ Stub 的代码库中维护清晰且一致的文档。内联注释应说明意图行为、选择响应的理由以及 Stub 的任何局限。文档有助于明确 Stub 不是实际依赖项的完整实现，而是支持单元测试的工具。清晰的文档允许其他开发者理解\
    \ Stub 的范围，并防止在需要更真实模拟的场景中误用 Stub。此外，文档良好的 Stub 在相应的外部依赖项设计演变时，为未来测试策略的改进提供参考点。\n"
