  mdcn: "\n软件系统。正确使用 Mock（模拟）能够让开发者精确定缺陷、执行严格的编码规范，并在受控条件下模拟各种现实场景。单元测试中引入 Mock 代表了从基础测试结构到复杂的、基于场景的验证的本质演变，这是构建健康\
    \ TDD 生态系统的基础。\n\n## 5.2 理解 Mock 和 Stub（模拟存桩）\n\nMock 和 Stub 是单元测试中基础的测试双倍体（test\
    \ doubles），用于将单元测试与其外部依赖隔离开。两者都用于模拟单元所交互的对象的行为；但它们的实现方式截然不同。清晰地理解 Mock 和 Stub\
    \ 之间的区别，对于构建健壮的测试并确保测试准确捕捉预期的交互和结果至关重要。\n\n在单元测试中，Stub 通常是一个简单的实现，用于为测试期间的调用提供响应。Stub\
    \ 不会记录或验证有关交互的信息；它们只是在特定方法被调用时返回值或响应。当测试需要依赖项提供可预测的输出，而无需验证依赖项是如何被使用时，Stub 特别有用。因为\
    \ Stub 的设计是为了提供受控的对立面，它们简化了涉及复杂、非确定性行为组件的场景。例如，考虑一个查询数据服务的方法：Stub 可以被配置为始终返回特定的数据集。这消除了测试环境依赖于实际数据服务的需要，确保了单元保持隔离和稳定。\n\
    \n相反，Mock 不仅是外部依赖的虚拟替代品，还是一个用于验证与该依赖的交互以良好定义的方式发生的工具。Mock 配置有期望（expectations），这些期望指定了在测试执行期间应该如何与其进行交互。这些期望包括应该调用哪些方法、调用多少次以及使用什么参数。一旦测试结束，Mock\
    \ 就会验证这些期望是否得到满足。在某些方面，Mock 扮演着双重角色：它们在模拟行为的同时也捕捉有关交互的细节。这种验证机制在测试驱动开发（TDD）和高级单元测试策略中特别有价值，在这些策略中，单元的设计很大程度上取决于它与其他组件的交互。开发者使用\
    \ Mock 来确保单元测试不仅产生了正确的输出，而且参与了适当的方法调用序列。\n\n这两种双倍体之间的区别意义重大。Stub 主要解决的是提供受控输入（预设的响应）的需求，而\
    \ Mock 则解决了验证行为（交互正确性）的需求。在实践中，两者都被用于创建全面的测试，这些测试甚至模拟即使是最复杂的外部条件。例如，在测试依赖于远程 Web\
    \ 服务的组件时，可以使用 Stub 来模拟服务在正常情况下的响应，而 Mock 可以用来验证该组件是否正确处理了错误场景或意外响应。Stub 提供的受控环境和\
    \ Mock 提供的详细交互检查互为补充，共同确保了单元在广泛条件下都能按预期执行。\n\n这些概念的实际说明可以在许多 Java 测试框架中找到，特别是\
    \ Mockito。Mockito 是一个广泛使用的框架，提供了一个流式 API，以便方便地创建和管理 Mock 和 Stub。通过 Mockito，初学者可以使用简单的命令创建接口或类的\
    \ Mock，然后同时指定行为和验证条件。例如，考虑一种场景：一个服务方法应该恰好调用一次依赖方法，并返回一个预定的结果。使用 Mockito，可以为依赖项创建一个\
    \ Mock，对所需的方法进行 Stub 以返回常量值，随后验证依赖方法是否已使用预期的参数被调用。以下示例演示了这种方法：\n\n```java\nimport\
    \ static org.mockito.Mockito.*;\nimport org.junit.Test;\n\npublic class ServiceTest\
    \ {\n    @Test\n    public void testServiceMethod() {\n        // 为依赖项创建一个 mock\
    \ 对象。\n        Dependency mockDependency = mock(Dependency.class);\n\n       \
    \ // Stub mock，在被调用时返回预定的响应。\n        when(mockDependency.fetchData()).thenReturn(\"\
    expected result\");\n\n        // 使用 mock 作为其依赖项创建服务的实例。\n        Service service\
    \ = new Service(mockDependency);\n\n        // 执行被测试的方法。\n        String result\
    \ = service.processData();\n\n        // 验证方法是否返回了预期的结果。\n        assertEquals(\"\
    expected result\", result);\n\n        // 验证依赖方法是否恰好被调用一次。\n        verify(mockDependency,\
    \ times(1)).fetchData();\n    }\n}\n```\n\n在此代码中，Stub 行为是通过指示 mock 对象在调用 `fetchData()`\
    \ 方法时返回 `\"expected result\"` 来建立的。使用 `verify()` 函数的验证步骤检查了服务与其依赖项之间的交互，确保 `fetchData()`\
    \ 按照要求被调用。这个简单的示例说明了如何在单元测试中结合 Mock 和 Stub，以验证返回的输出以及单元测试的行为。\n\n理解 Mock 和 Stub\
    \ 的另一个重要方面是识别它们各自适用的场景。当测试场景不需要对方法调用进行验证时，使用 Stub 最佳。它们是模拟外部系统响应的理想选择，例如 Web 服务、数据库或其他系统（在这些系统中测试不应依赖于真实系统的状态或行为）。在这种情况下，Stub\
    \ 提供了稳定且可预测的输出，通过仅关注单元的内部逻辑来简化了测试。\n\n另一方面，当交互本身的正确性处于测试范围之内时，Mock 是必不可少的。在一个单元测试必须与外部对象进行一系列交互的设计中，这些交互的行为可能与最终输出一样关键。在这种情况下，Mock\
    \ 强制执行单元与其依赖项之间的契约，确保方法以正确的顺序和正确的参数被调用。这种程度的细节对于确保整个系统在与其他组件集成时可靠地运行至关重要。\n\n\
    Mock 和 Stub 的作用超越了简单的测试，扩展到了设计验证的领域。在 TDD 中，测试是在实际实现之前编写的，Mock 的存在会显著影响代码的设计。例如，当开发者使用\
    \ Mock 模拟外部组件的行为编写测试时，生成的代码自然倾向于有利于依赖注入和松耦合的设计。这种设计允许更大的灵活性、更简单的维护，以及无缝替换真实实现为测试的能力。随着代码的演进，测试提供持续的反馈，以确保更改不会引入回归。这对于维护长期代码质量并确保添加新功能而不引入至关重要。\n\
    \n在高级单元测试策略中，Mock 和 Stub 成为更广泛测试框架的一部分，该框架还包括行为驱动开发（BDD）和集成测试等实践。虽然 Stub 通常在集成测试中用于模拟端到端系统的响应，但\
    \ Mock 提供了行为驱动方法所需的细粒度控制。开发者可以为对外部依赖项所做的每次调用指定并验证期望，确保单元交互的所有方面都符合定义的规范。这种全面的方法方法导致了更高的代码可靠性，\n"
