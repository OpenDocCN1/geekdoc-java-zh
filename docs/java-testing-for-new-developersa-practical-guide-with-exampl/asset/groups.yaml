    # 第5章

    # 单元测试中的 Mock（模拟）与 Stubbing（存桩）


    本章解释了 Mock 对象和 Stub 对象在单元测试中的作用，重点关注隔离依赖项的技术。它描述了如何通过 Mock 实现对与外部组件交互的验证，而 Stub
    则提供预设的响应。文中还讨论了使用 Mockito 等框架在 Java 中实现这些技术的最佳实践。示例演示了如何有效使用 Mock 和 Stub 来增强测试的清晰性和可靠性。


    ## 5.1 测试驱动开发 (TDD) 和高级单元测试策略的重要性，Mock 对象在确保软件组件在孤立状态受测试并按预期行为方面起着至关重要的作用。


    单元测试是验证源代码单个单元运行正确的实践，而 TDD 强调在编写功能代码之前编写测试。Mock 用于模拟单元与其交互的复杂真实对象的行为，而不需要这些对象的实际存在。这不仅简化了测试环境，还通过消除外部依赖增强了测试的可靠性。在组件通过定义接口相互连接的环境中，Mock
    充当这些交互的副本，允许开发者控制并验证单元测试与其协作方之间的交互。


    Mock 对象在 TDD 中特别有用，因为它们促进了早期测试和增量开发。遵循 TDD 方法时，开发者从编写测试开始，以指定函数或模块的预期行为。由于某些组件可能尚未实现或可用，可以使用
    Mock 来模拟不可见部分。这种做法使开发者能够关注所创建的新代码的正确性，而无需等待所有相关组件的完整实现。通过使用 Mock，即使在依赖项不稳定、速度缓慢或本质上具有不确定性的情况下也可以构建测试场景。因此，Mock
    为开发既可重复又高效的健壮测试提供了基础，同时在 TDD 周期中提供即时反馈。


    除了促进早期测试外，Mock 是隔离单元测试的基石。单元测试的一个核心原则是测试应该是确定性的，这意味着在相同条件下反复运行测试会产生相同的结果。然而，与网络服务、数据库或文件系统等真实组件的交互可能会因为延迟、失败模式或副作用而引入变异。通过用
    Mock 替换这些外部组件，开发者可以确保单元测试的行为能够以受控且可预测的方式被观察。这种隔离使测试保持稳定和可靠，从而减少了与外部系统发生无意交互而可能导致的假阴性和假阳性的概率。Mock
    提供的受控环境有助于在测试失败时准确定错误源，因为它将关注点严格限制在被调查单元的行为上。


    使用 Mock 对象的进一步优势在于它们能够验证单元测试与其依赖项之间的交互。在许多情况下，不仅要确保方法返回正确的值，而且确认它们以预期方式与系统的其他部分进行交互也很重要。Mock
    可以配置为记录它们在测试期间如何被使用的信息，包括方法调用的顺序和调用时使用的参数。这一功能在 TDD 中尤为重要，因为测试决定了每次交互的正确性，开发者可以强制组件之间的合约行为。例如，Mock
    可以显示某个方法被恰好调用了一次，或带有特定的参数值，从而及早发现偏离预期序列的情况。这种详细的验证有助于在开发过程的早期发现集成问题和设计缺陷。


    此外，Mock 在提高测试性能和维护整洁的代码架构方面起着作用。在单元测试中，被测试的对象或函数理想情况下应该只有一个职责（注：此处此处为 one responsibility，但根据语境通常指单一职责）。当依赖项是真实的时，它们通常会带来复杂性和资源开销。通过用轻量级
    Mock 替换真实对象，测试执行得更快，重点仍然留在验证单元的内部逻辑，而不是执行完整的集成测试。快速测试是 TDD 的基石，因为它们允许开发者频繁运行测试套而无需延迟。反馈循环是
    TDD 敏捷本质不可或缺的一部分，因为它鼓励了迭代开发和代码的持续改进。通过 Mock，开发者可以模拟使用实际依赖项可能难以或无法复现的边缘情况和错误状况。例如，数据库相关的错误或网络超时可以通过
    Mock 对象进行模拟，确保单元测试在异常情况下做出适当响应。


    除了性能增强和更具针对性的测试外，使用 Mock 还促进了更好的设计实践，例如依赖注入和遵循基于接口的编程。当一个单元被设计为与接口而非具体实现交互时，实际依赖项可以很容易替换为
    Mock，从而产生一个更加模块化和解耦的系统。这种设计是 TDD 的核心，代码不断重构以满足详尽测试施加的设计约束。因此，对 Mock 的依赖驱动开发者编写更具维护性的代码，因为这要求每个组件在职责及其与其他组件的合约方面有清晰的定义。通过基于
    Mock 的测试实现的清晰性有助于代码库随时间推移更容易修改、扩展和调试。


    在 Java 中实现 Mock 通常通过使用专用框架来辅助， Mockito 是最受欢迎的选择之一。Mockito 提供了流式 API，允许开发者简洁地创建和配置
    Mock 对象。虽然使用 Mock 框架抽象了许多内部细节，但初学者理解 Mock 运行的底层原理及其原因至关重要。要意识到，Mock 并不是集成测试的替代品，而是互补工具，在验证单个组件是否在孤立运行方面具有明确的目的。正确使用
    Mock 需要一种系统的方法来确定哪些依赖项应该被 Mock，哪些应该保持真实。例如，简单的数据传输对象（DTO）或领域模型通常保持原样，而执行外部操作的服务通常会被
    Mock 替换。密切关注这一决策过程对于确保测试套件保持高效并代表实际生产环境至关重要。


