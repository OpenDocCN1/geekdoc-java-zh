    \ userService.createUser(user);\n  assertNotNull(savedUser);\n  assertEquals(\"\
    tester\", savedUser.getUsername());\n}\n```\n\n相比之下，自底向上集成通过首先测试最基础的模块开始测试，然后集成高层模块。这种方法涉及对各个模块进行开发和测试。一旦这些基础元素经过验证，它们将被聚合形成子系统。自底向上集成的主要优点是允许开发者在组合成更大的结构之前关注核心部分的正确性。自底向上集成消除了过度使用存根的需求，因为低层组件在引入时已经是完全运行的。然而，某些缺点包括延迟发现涉及高层交互和工作流的问题。自底向上方法的示例代码可能涉及首先测试数据层：\n\
