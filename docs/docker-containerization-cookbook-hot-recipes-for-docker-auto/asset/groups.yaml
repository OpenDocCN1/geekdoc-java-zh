    \n在本节中，我们将学习如何管理 docker machine、如何使用特定的 docker machine 拉取 docker 镜像以及如何创建这样的镜像。\n\
    \n### 1.3.1 创建机器\n\n首先，我们将使用以下命令列出所有可用的 docker machine：\n\n列出 Docker Machines\n\
    \n```\ndocker-machine ls\n```\n\n如果没有任何机器，我们将按照如下方式创建一个新的：\n\nDocker 安装测试\n\n\
    ```\ndocker-machine create --driver virtualbox default\n```\n\n注意，为了创建 docker\
    \ machine，我们需要指定一个驱动程序（driver），这将决定它是一个虚拟机（在此例中为 virtual box），还是到外部机器上运行的 docker\
    \ 的连接。\n\n### 1.3.2 创建镜像\n\nDocker 镜像是在特定的 docker machine 中创建的。为了定义我们要使用的 docker\
    \ machine，我们需要运行以下命令：\n\n选择 docker machine\n\n```\neval \"$(docker-machine env\
    \ default)\"\n```\n\n为了检查这一点，再次列出所有可用的 docker machine。此时，应该出现一个具有新 IP 地址（192.168.99.100）的新机器，并且在\
    \ ACTIVE 容器中包含一个星号。\n\n激活的 Docker Machine\n\n| NAME | ACTIVE | DRIVER | STATE\
    \ | URL | SWARM |\n|---|---|---|---|---|---|\n| default | | virtualbox | Running\
    \ | tcp://192.168.99.100:2376 | |\n\nDocker 镜像是运行时环境的二进制文件。docker 镜像的内容是执行名为 Dockerfile\
    \ 的纯文本文件中出现的指令集的结果。然而，为了避免反复从 Dockerfile 构建 docker 镜像，有一个名为 Docker Hub 的在线 docker\
    \ 镜像仓库。\n\n例如，要拉取 MongoDB 镜像，我们只需要执行如下 `docker pull` 命令：\n\ndocker pull 命令\n\n\
    ```\ndocker pull mongo\n```\n\n为了查看我们 docker machine 中已安装的镜像，使用以下命令。注意出现了一个带有\
    \ Mongo 镜像的新条目。每个镜像都有一个我们机器的唯一镜像标识符，称为 IMAGE ID。\n\n列出 Docker 镜像\n\n```\ndocker\
    \ images\n```\n\n如果你对了解如何创建 Dockerfile 感兴趣，我们强烈遵循这个示例。\n\n### 1.3.3 创建容器\n\nDocker\
    \ 容器是 docker 镜像的实例。为了从镜像创建容器，我们使用 `docker run` 命令。例如：\n\n列出 Docker 镜像\n\n```\n\
    docker run mongo\n```\n\n# Docker 容器化食谱\n\n在此之后，我们可以通过以下指令检查容器列表。\n\n列出容器\n\n\
    ```\ndocker ps -a\n```\n\n注意，我们的容器也有标识符，称为 CONTAINER ID。我们稍后会使用它。\n从应用程序连接到此容器的\
    \ IP 地址是我们 docker machine 的 IP（192.168.99.100）。\n\n### 1.3.4 清理环境\n\n到此时，我们已经下载了一个\
    \ docker machine 并启动了一个 docker 容器。为了停止并删除容器和镜像，我们需要执行以下指令：\n\n停止容器：\n\n停止 Docker\
    \ 容器\n\n```\ndocker stop #containerId\n```\n\n删除容器：\n\n删除 Docker 容器\n\n```\ndocker\
    \ rm #containerId\n```\n\n删除 docker 镜像：\n\n删除 Docker 镜像\n\n```\ndocker rmi #imageId\n\
    ```\n\n## 1.4 使用 Maven 运行集成测试\n\n使用 Docker 设计集成测试有不同的方法。在这个示例中，我们将设计一个 Maven 项目，该项目在执行\
    \ JUnit 测试之前会自动启动一个 MongoDB 容器。\n\n### 1.4.1 Maven 配置\n\n首先是这个 `pom.xml` 文件。我们将使用\
    \ `docker-maven-plugin` 插件在运行集成测试之前自动加载定义的 Docker 镜像并创建一个容器。为了支持集成测试，我们使用了 `maven-failsafe-plugin`。\n\
    \npom.xml\n\n```xml\n<project xmlns=\"https://maven.apache.org/POM/4.0.0\" xmlns:xsi=\"\
    http://www.w3.org/2001/XMLSchema-instance\"\n  xsi:schemaLocation=\"https://maven.apache.org/POM/4.0.0\
    \ https://maven.apache.org/xsd/maven-4.0.0.xsd\">\n  <modelVersion>4.0.0</modelVersion>\n\
    \  <groupId>javodegeeks</groupId>\n  <artifactId>javadegeeks</artifactId>\n  <version>1.0-SNAPSHOT</version>\n\
    \  <packaging>jar</packaging>\n  <properties>\n    <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>\n\
    \    <project.build.resourceEncoding>UTF-8</project.build.resourceEncoding>\n\
    \    <maven.compile.encoding>UTF-8</maven.compile.encoding>\n  </properties>\n\
    \  <build>\n    <plugins>\n      <plugin>\n        <artifactId>maven-compiler-plugin</artifactId>\n\
    \        <version>2.1</version>\n        <configuration>\n          <source>1.8</source>\n\
    \          <target>1.8</target>\n          <encoding>UTF-8</encoding>\n      \
    \  </configuration>\n      </plugin>\n      <plugin>\n        <groupId>org.apache.maven.plugins</groupId>\n\
    \        <artifactId>maven-failsafe-plugin</artifactId>\n        <version>2.9.1</version>\n\
    \        <configuration>\n          <includes>\n            <include>**/IntegrationTest.java</include>\n\
    \          </includes>\n        </configuration>\n        <executions>\n     \
    \     <execution>\n            <id>integration-test</id>\n            <goals>\n\
    \              <goal>integration-test</goal>\n            </goals>\n         \
    \ </execution>\n          <execution>\n            <id>verify</id>\n         \
    \   <goals>\n              <goal>verify</goal>\n            </goals>\n       \
    \   </execution>\n        </executions>\n      </plugin>\n      <!-- 告诉 surefire\
    \ 跳过测试，我们使用 failsafe 插件 -->\n      <plugin>\n        <groupId>org.apache.maven.plugins</groupId>\n\
    \        <artifactId>maven-surefire-plugin</artifactId>\n        <version>2.10</version>\n\
    \        <configuration>\n          <skip>true</skip>\n        </configuration>\n\
    \      </plugin>\n      <plugin>\n        <groupId>io.fabric8</groupId>\n    \
    \    <artifactId>docker-maven-plugin</artifactId>\n        <version>0.15.0</version>\n\
    \        <configuration>\n          <logDate>default</logDate>\n          <autoPull>true</autoPull>\n\
    \          <dockerHost>tcp://192.168.99.100:2376${dockerHost}</dockerHost>\n \
    \         <certPath>$(user.home)/.docker/machine/certs/${certPath}</certPath>\n\
    \        <images>\n          <image>\n            <name>mongo</name>\n       \
    \     <run>\n          </image>\n        </images>\n        </configuration>\n\
    \      </plugin>\n    </plugins>\n  </build>\n</project>\n```\n\n"
