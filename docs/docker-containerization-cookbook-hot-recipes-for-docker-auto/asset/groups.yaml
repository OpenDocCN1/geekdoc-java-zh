    # Chapter 9


    # Docker Start Container Example


    A container, in Docker terminology, is an instance of an image. A typical simile
    used for this, is the classes and objects in Object Oriented Programming.


    This example will show how to start containers, that is, making run images instances.


    For this example, Linux Mint 18 and Docker version 1.12.1 have been used.


    # 9.1 Installation


    Note: Docker requires a 64-bit system with a kernel version equal or higher to
    3.10.

    We can install Docker simply via apt-get, without the need of adding any repository,
    just installing the docker.io package:


    ```

    sudo apt-get update

    sudo apt-get install docker.io

    ```


    For more details, you can follow the Install Docker on Ubuntu Tutorial.


    # 9.2 Pulling a sample image


    If you have used Docker before, you (should) already know that a container is
    an instance of an image, so, first, we need one.

    The easiest way to obtain Docker images is from Docker Hub, pulling them. We could
    pull, for example, an Nginx image:


    ```

    docker pull nginx

    ```


    You can check that you have the image on your system executing:


    ```

    docker images

    ```


    Which should show something similar to:


    | REPOSITORY | TAG | IMAGE ID | CREATED | SIZE |

    |---|---|---|---|--|

    | nginx | latest | abf312888d13 | 2 weeks ago | 181.5 MB |'
- md: '

    ## 9.3 Creating a container from an image and running it: run


    Now we have a Docker image, we can easily create a container from it.


    As before, a container is just an instance of an image. We can have several different
    containers from a single image, running at the same time.


    The run docker command creates the container, and then runs it. So, running a
    container from an image is as easy as executing:


    ```

    docker run <image-name|image-id>[:tag]

    ```


    That means we can create our container executing:


    ```

    docker run nginx

    ```


    And, also:


    ```

    docker run abf31288d13

    ```


    Additionally, we can also specify the tag:


    ```

    docker run nginx:latest

    ```


    For the previous examples, Docker would create the container from the image that
    already exists in our disk. But, we can directly run containers for which we do
    not have the image in the disk; Docker is clever enough to know that it has to
    pull, if it cannot be found in the disk. So, we would execute:


    ```

    docker run nginx:1.10

    ```


    Which is an image that doesn''t exist, and Docker will do a pull followed by the
    run, after saying that it was unable to find the image:


    ```

    Unable to find image ''nginx:1.10'' locally

    ```


    ### 9.3.1 Running containers in detached mode


    If you run the container, you would say that the container is being ran in the
    console, and, if you terminate the process, the container is stopped.


    Usually, we want to run the containers in background or detached. For that, we
    have to use the -d option:


    ```

    docker run -d nginx

    ```


    With this option, Docker will show the container ID, and then detach the container.


    ### 9.3.2 Giving a name to the container


    The random names generated by Docker do not say anything about the container,
    so, we should always give a meaningful name to the container. This is achieved
    with the pull option, e.g.:


    ```

    docker run -d --name=nginx1 nginx

    ```


    ### 9.3.3 Mapping container ports to hosts port


    An essential option for most of the containers is the port publishing. If we are
    running a web server, as in this example, it is obviously essential.


    For this, we want to use the -p (--publish) option, which follows this format:


    ```

    docker run -p <host-port>:<container-port>

    ```


    So, if example, we want to map the port 80 of the container to the port 80 of
    the host, we would execute:


    ```

    docker run -d --name=nginx2 -p 80:80 nginx

    ```


    Now, if we follow localhost (127.0.0.1) in a browser, we can see the Nginx welcome
    page. That is, we would be accessing the web root of the web server running in
    container.


    Of course, we can use any (free) port in the host:


    ```

    docker run -d --name=nginx3 -p 8080:80 nginx

    ```


    ### 9.3.4 Run a container and get the command line


    For some occasions, we just want to get the command line of a container. For this,
    we have to use two options: -i (--interactive) and -t (--tty) and also specify
    the shell:


    ```

    docker run -i -t <image> </path/to/shell

    ```


    For example:


    ```

    docker run --name=nginx4 -i -t nginx /bin/bash

    ```


    And we will run the container interactively.


    For exiting the container, we can execute exit inside it.


    We can combine both options in just one with -it:


    ```

    docker run --name=nginx5 -it nginx /bin/bash

    ```


    ### 9.3.5 Specifying a username


    Exists the possibility of specifying the username the container has to be ran,
    with the -u (--user) option:


    ```

    docker run -u <username> <image>

    ```


    Applied to the previous example, for running the container not with root user,
    but with nginx:


    ```

    docker run --name=nginx6 -u nginx -it nginx /bin/bash

    ```


    ## 9.4 Starting an existing container: restart


    Let''s suppose that we stop one of the containers:


    ```

    docker stop nginx1

    ```


    Now, the nginx container is stopped. If we would try to create a container with
    the same name:


    ```

    docker run --name=nginx1 nginx

    ```


    Docker would throw an error, and the container would be started:


    ```

    docker: Error response from daemon: Conflict. The name "nginx1" is already in
    use by container 4ae3a240dc6c2dc6d968afdb91be14860be72ed6ca65e2d52ac8546e5d6ce16d.
    You have to remove (or rename) that container to be able to reuse that name.

    ```


    The message is quite explanatory: we cannot create a container with the name of
    another container (that''s why we have used different names for the containers
    in this example), even if stopped.


    If we want to do is to run that container, that is, that specific instance of
    the nginx image that we created before, we would have to delete or rename it,
    and we don''t have to use the start command, but to restart:


    ```

    docker restart <container-name> <container-id>

    ```


    So, for restarting our stopped container, we just have to execute:


    ```

    docker restart nginx1

    ```


    And it will be running again, keeping the port mapping, specified.


    ## 9.5 Summary


    This example has shown how to run Docker containers, that is, an instance of a
    Docker image. We have seen several options for these. Apart from that, we have
    also seen how to restart existing containers, which is slightly different from
    creating them.


    # Chapter 10


    # Docker List Containers Example


    This example will show you how to list containers with Docker, one of the most
    popular software of the moment. Apart from just listing the containers, we will
    see the useful options that this command is provided with.

    For this example, Linux Mint 18 and Docker version 1.12.1 have been used.


    ## 10.1 Installation


    Note: Docker requires a 64-bit system with a kernel version equal or higher to
    3.10.

    You can install Docker simply via apt-get, without the need of adding any repository,
    just installing the docker.io package:


    ```

    sudo apt-get update

    sudo apt-get install docker.io

    ```


    For more details, you can follow the Install Docker on Ubuntu Tutorial.


    ## 10.2 Setting up some containers


    ### 10.2.1 Pulling a sample image


    As you should know, before creating containers, we need Docker images.

    The easiest way to obtain a Docker image is to pull one from the Docker Hub. You
    don''t have to have an account for pulling images.

    Let''s pull a Busybox image:


    ```

    docker pull busybox

    ```


    ### 10.2.2 Creating sample containers


    Let''s create several containers:


    ```

    docker run busybox

    docker run busybox echo "Hello world"

    docker run --name=mybusybox busybox

    docker run -it busybox

    ```


    Note: after the last container execution, open a new terminal, since they have
    set the interactive mode for it.


    Docker Containerization Cookbook


    ## 10.3 Listing containers


    The Docker command for listing containers is ps (yes, not a very good name). So,
    let''s try it:


    ```

    docker ps

    ```


    For which will return an output like the following:


    | CONTAINER | IMAGE | COMMAND | CREATED | STATUS |

    | :--- | :--- | :--- | :--- | :--- |

    | e72b3c39f9 minutes | busybox | "sh" jolly_bhabha | 3 minutes ago | Up 3 |


    The first thing that probably will come to our minds is that we are just seeing
    a single container, when we actually instantiated several. This is because ps
    just shows the active, running containers.


    If we want to show all containers, we must use the -a (--all) option to ps:


    ```

    docker ps -a

    ```


    In this case, the output would be:


    | CONTAINER | IMAGE | COMMAND | CREATED | STATUS |

    | :--- | :--- | :--- | :--- | :--- |

    | e72b3c39f | busybox | "sh" jolly_bhabha | 3 minutes ago | Up 3 |

    | 642aec6d53 | busybox | "sh" mybusybox | 3 minutes ago | Exited |

    | (0) 3 minutes ago | busybox | "sh" grave_ramanujan | 3 minutes ago | Exited
    |

    | 05833ec5598 | busybox | "echo ''Hello world''" | 3 minutes ago | Exited |

    | (0) 3 minutes ago | busybox | "sh" pedantic_hoover | 3 minutes ago | Exited
    |

    | e4ceead785b3 | (0) 3 minutes ago | busybox | "sh" cranky_murdock | 3 minutes
    ago | Exited |


    ### 10.3.1 Formatting the output


    You might find the output not very pretty, since the lines are cramped if the
    width of the window is not big enough. Fortunately, this command allows custom
    formatting. This is achieved with the --format option. The format is specified
    in "Go Template", which is pretty easy.


    ```

    docker ps --format ''{{.column-name}}: {{.column-value}}''

    ```


    Specifying as many columns as we want. Of course, the formatting is compatible
    with -a option.


    If we just wanted to see the names, we could execute:


    ```

    docker ps -a ''{{.Names}} {{.Status}}''

    ```


    Which would show:


    ```

    jolly_bhabha Exited (0) 5 minutes ago

    mybusybox Exited (0) 5 minutes ago

    grave_ramanujan Exited (0) 5 minutes ago

    pedantic_hoover Exited (0) 5 minutes ago

    cracky_murdock Exited (0) 5 minutes ago

    ```


    The name of fields are case sensitive, and for the same cases the field name we
    use with --format is not very intuitive.

    So this is the list of field name we use for each column:

    '
  mdcn: '


    ## 9.3 从镜像创建容器并运行它：run


    现在我们有了一个 Docker 镜像，可以很容易地从它创建一个容器。


    和之前一样，容器只是镜像的一个实例。我们可以从同一个镜像创建多个不同的容器，并让它们同时运行。


    `docker run` 命令会创建容器并运行它。因此，从镜像运行容器就像执行以下命令一样简单：


    ```

    docker run <image-name|image-id>[:tag]

    ```


    这意味着我们可以执行以下命令来创建容器：


    ```

    docker run nginx

    ```


    以及：


    ```

    docker run abf31288d13

    ```


    此外，我们还可以指定标签（tag）：


    ```

    docker run nginx:latest

    ```


    对于之前的示例，Docker 会从我们磁盘中已存在的镜像中创建容器。但是，我们可以直接运行磁盘中没有该镜像的容器；Docker 足够聪明，如果在磁盘中找不到镜像，它会知道必须进行拉取（pull）。因此，我们会执行：


    ```

    docker run nginx:1.10

    ```


    这是一个并不存在的镜像，Docker 在提示无法找到镜像后，将执行拉取然后运行：


    ```

    Unable to find image ''nginx:1.10'' locally

    ```


    ### 9.3.1 在分离模式下运行容器


    如果你运行容器，你会发现容器正在控制台中运行，如果你终止了该进程，容器就会停止。


    通常，我们希望在后台或分离（detached）模式下运行容器。为此，我们需要使用 `-d` 选项：


    ```

    docker run -d nginx

    ```


    使用此选项，Docker 将显示容器 ID，然后分离容器。


    ### 9.3.2 给容器命名


    Docker 生成的随机名称没有提供关于容器的任何信息，因此我们应该始终给容器起一个有意义的名字。这可以通过 `--name` 选项实现，例如：


    ```

    docker run -d --name=nginx1 nginx

    ```


    ### 9.3.3 将容器端口映射到宿主机端口


    对于大多数容器来说，端口发布是一个基本选项。如果我们正在运行 Web 服务器（如本示例所示），这显然至关重要的。


    为了这一点，我们想要使用 `-p` (--publish) 选项，它的格式如下：


    ```

    docker run -p <host-port>:<container-port>

    ```


    例如，如果我们想将容器的 80 端口映射到宿主机的 80 端口，我们将执行：


    ```

    docker run -d --name=nginx2 -p 80:80 nginx

    ```


    现在，如果我们在浏览器中访问 localhost (127.0.0.1)，我们就能看到 Nginx 的欢迎页面。也就是说，我们正在访问运行在容器中的 Web
    服务器的根目录。


    当然，我们可以使用宿主机上的任何（免费）端口：


    ```

    docker run -d --name=nginx3 -p 8080:80 nginx

    ```


    ### 9.3.4 运行容器并获取命令行


    在某些情况下，我们只是想获取容器的命令行。为此，我们需要使用两个选项：`-i` (--interactive) 和 `-t` (--tty)，并指定 shell：


    ```

    docker run -i -t <image> </path/to/shell

    ```


    例如：


    ```

    docker run --name=nginx4 -i -t nginx /bin/bash

    ```


    我们将以交互式方式运行容器。


    若要退出容器，我们可以在容器内部执行 `exit`。


    我们可以通过 `-it` 将这两个选项合并为一个：


    ```

    docker run --name=nginx5 -it nginx /bin/bash

    ```


    ### 9.3.5 指定用户名


    存在使用 `-u` (--user) 选项指定容器运行时用户名的可能：


    ```

    docker run -u <username> <image>

    ```


    应用到上一个示例，不以 root 用户而是以 nginx 用户运行容器：


    ```

    docker run --name=nginx6 -u nginx -it nginx /bin/bash

    ```


    ## 9.4 启动已有的容器：restart


    假设我们停止了其中一个容器：


    ```

    docker stop nginx1

    ```


    现在，nginx 容器已停止。如果我们尝试创建一个具有相同名称的容器：


    ```

    docker run --name=nginx1 nginx

    ```


    Docker 会抛出一个错误，且容器将不会被启动：


    ```

    docker: Error response from daemon: Conflict. The name "nginx1" is already in
    use by container 4ae3a240dc6c2dc6d968afdb91be14860be72ed6ca65e2d52ac8546e5d6ce16d.
    You have to remove (or rename) that container to be able to reuse that name.

    ```


    该信息非常明确：我们不能创建一个与另一个容器同名的容器（这就是为什么我们在示例中为容器使用了不同的名称），即使它已经停止了。


    如果我们想要运行那个容器，即我们之前创建的 nginx 镜像的特定实例，我们需要删除或重命名它，而且我们不需要使用 `start` 命令，而是使用 `restart`：


    ```

    docker restart <container-name> <container-id>

    ```


    因此，为了重启我们停止的容器，我们只需要执行：


    ```

    docker restart nginx1

    ```


    ## 9.5 总结


    我们学习了如何从镜像创建并运行容器。我们还学习了如何在分离模式下运行容器、为容器命名、映射端口、以交互模式运行容器以及指定用户名。最后，我们还学习了如何启动已有的容器。

    '
