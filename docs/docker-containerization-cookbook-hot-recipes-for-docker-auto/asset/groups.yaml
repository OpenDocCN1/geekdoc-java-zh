    保留所有权利。在不限制上述版权保留的情况下，未经版权所有者书面许可，本出版物的任何部分均不得被复制、存储或引入检索系统，或以任何形式或通过方式（电子、机械、复印、录制或其他）进行传输。\n\
    \n# 前言\n\nDocker 是全球领先的软件容器化平台。Docker 容器将软件封装在一个完整的文件系统中，该系统包含了运行所需的所有内容：代码、运行时环境、系统工具、系统库——任何可以安装在服务器上的东西。这保证了软件无论环境如何，运行结果始终一致。（来源：https://www.docker.com/what-docker）\n\
    \nDocker 为 Linux 上的操作系统级虚拟化提供了额外的抽象和自动化层。Docker 使用了 Linux 内核的资源隔离特性（如 cgroups\
    \ 和内核命名空间）以及支持联合的文件系统（如 OverlayFS 等），允许独立的“容器”在单个 Linux 实例中运行，避免了启动和维护虚拟机的开销。（来源：https://en.wikipedia.org/wiki/Docker_(software)）\n\
    \n在本电子书中，我们提供了一系列 Docker 示例，这些将帮助你启动自己的自动化项目。我们涵盖了广泛的内容，从安装和配置到 DNS 和命令。通过我们直观的教程，你将以最短的时间让自己的项目运行起来。\n\
    \n# 作者简介\n\nJCGs (Java Code Geeks) 是一个独立的在线社区，专注于创建终极的 Java 开发者资源中心；目标针对技术架构师、技术团队负责人（高级开发人员）、项目经理以及初级开发者。\n\
    \nJCGs 为 Java、SOA、敏捷和电信社区提供由领域专家编写的每日新闻、文章、教程、评论、公告、代码片段和开源项目。\n\n你可以在网上找到他们：https://www.javacodegeek.com/\n\
    \n# 第一章\n\n# 初学者 Docker 教程\n\n在本文中，我们将解释 Docker 的主要功能。我们将简要解释为什么容器是必要的、要使用哪些主要命令，以及如何在集成测试中使用\
    \ Docker。下表显示了全文的概览：\n\n## 1.1 为什么我们需要 Docker？\n\n图 1.1：docker\n\n一致的环境，对于分布式应用来说是一个重要问题，因为我们需要安装或升级具有相同配置的多个节点。\n\
    \n# Docker 容器化实战指南\n\nDocker 是一个容器管理器，这意味着它能够创建并执行代表软件特定运行时环境的容器。与 VirtualBox\
    \ 等虚拟机不同，Docker 使用 Linux 内核的资源隔离特性，允许独立的“容器”在单个 Linux 实例中运行，避免了启动和维护虚拟机的开销。带有\
    \ docker 的计算机可以同时运行多个容器。\n\n因此，Docker 的自动化主要为集成测试和持续交付提供了便利。\n\n## 1.2 机器、镜像和容器\n\
    \n为了使用 docker，明确一些术语很重要。Docker 区分了三个重要概念：docker 机器（machines）、docker 镜像（images）和容器（containers）。\n\
    \nDocker 容器是特定运行时环境的执行。例如，模拟具有特定数据库的应用。这些运行时环境被称为 Docker 镜像，它们是执行名为 Dockerfile\
    \ 的特定脚本文件中系列命令的结果。因此，Docker 允许拥有特定 Docker 镜像的多个容器。这些可以与程序和进程的概念进行比较。事实上，容器像进程一样，可以被创建、停止、死亡或运行。\n\
    \nDocker 机器是本地（虚拟）机器或远程机器（例如 Amazon AWS 或 DigitalOcean 等云平台），上面运行着 docker。和物理机器一样，docker\
    \ 机器具有特定的 IP 地址。每台 docker 机器都可以管理多个 docker 镜像和容器。通过我们自己的个人电脑，`docker-machine`\
    \ 命令允许我们连接到所有的 docker 机器来管理它们的容器和镜像。\n\n# Docker machine {IP=192.168.99.100}\n\
    \n# Docker machine {IP=...}\n\n# Docker containers\n\ncontainer1:MongoDB\ncontainer2:MongoDB\n\
    container3:MongoDB\n\nDigitalOcean\n\n# Docker machine {IP=...}\n\nAWS\n\n# Docker\
    \ images\n\n| MongoDB | Java8 |\n| Ubuntu | ... |\n\n## 1.2.1 安装 docker 和 docker-machine\
    \ 的步骤\n\n按照以下步骤安装 docker 和 docker machine\n\n从此处下载并安装 docker 二进制文件。一旦你按照安装说明操作，就可以运行以下命令。\n\
    \nDocker 安装测试\n\n```\n$ docker run ubuntu:14.04 /bin/echo 'It works!'\nIt works!\n\
    ```\n\n如果你运行 OS 或 Linux，下载 Docker Binary 并更新 PATH：\n\nUnix Docker machine 安装\n\
    \n```bash\n$ curl -L https://github.com/docker/machine/releases/download/v0.6.0/docker-machine-uname\
