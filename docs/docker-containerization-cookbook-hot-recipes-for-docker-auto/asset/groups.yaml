    \nAccording to Docker documentation, we must meet the following prerequisites\
    \ for installing Docker:\n\n- 64-bit distro. Obviously, we need a 64-bit microprocessor.\n\
    - At least, 3.10 kernel version. In Ubuntu, these versions are present since 13.10,\
    \ so it shouldn't be a problem.\n\nJust in case, we can check the kernel version\
    \ with the following command:\n\n```bash\nuname -r\n```\n\nWhich will show the\
    \ kernel release. For this case, the output is:\n\n```\n4.4.0-21-generic\n```\n\
    \nNow, let's see how we can install it.\n\n## 2.2 Installation\n\nWe can install\
    \ Docker simply via apt-get, without the need of adding any repository, just installing\
    \ the docker.io package:\n\n```bash\nsudo apt-get update\nsudo apt-get install\
    \ docker.io\n```\n\nWe can check that Docker has been installed by executing the\
    \ following:\n\n```bash\ndocker -v\n```\n"
