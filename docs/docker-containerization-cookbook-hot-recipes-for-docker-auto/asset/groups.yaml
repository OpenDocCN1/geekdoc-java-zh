    \n图 5.1：典型的 Docker 工作流\n\n从上述工作流中可以看出，如果在组织内规模化使用 Docker 进行应用开发，会有大量的 IT 活动需要执行。\n\
    \n- 用于托管 Docker 容器以及 Docker 提供的所有相关工具的基础设施。\n- 根据需要为容器提供计算、存储和网络支持。\n- 应用生命周期支持和维护。\n\
    - 根据需要监控计算、存储和网络利用率，并停止/启动容器。\n- 解决容器的扩展需求。处理企业级规模的容器编排。\n\n这些问题在企业级规模下是非常重要的。现有的解决方案是管理员使用基础设施即服务（IaaS），例如亚马逊的\
    \ AWS EC2，并手动或通过自建工具来处理上述问题。然而，Docker 提供了“Docker 即服务”来解决这些问题。\n\n## 5.2 容器即服务\
    \ (CaaS)\n\n那么，什么是 CaaS 呢？它是一种云服务模型，用户可以使用按需付费模式从云提供商处订购并使用容器化基础设施。Docker CaaS\
    \ 是一个例子，AWS 的 Amazon EC2 容器服务 (ECS) 是另一个例子。\n\n作为一种云服务模型，CaaS 可能被视为 IaaS 的子集，因为它为用户提供了基于容器的基础设施。\n\
    CaaS 产品通常寻求为其用户提供以下功能：\n\n- 通过 API 或 Web 界面管理容器。\n- 监控容器使用的计算、存储和网络资源。\n- 为容器提供集群管理和编排能力。\n\
    - 提供安全和治理控制。\n- 理想情况下，价格廉廉的，以便 CaaS 可以在不同的云提供商之间迁移，或从本地迁移到云端。\n\n## 5.3 Docker\
    \ CaaS\n\nDocker 的 CaaS 产品称为 Docker Datacenter，它封装了 Docker 工具，为开发者和 IT 人员提供了一致的基础设施。这是一项针对企业的商业产品，并提供以下功能：\n\
    \n- 将知名的开源工具整合到 CaaS 伞下——Docker Engine、Docker Compose、Docker registry、Docker Swarm。\n\
    - 增加了商业特性——通用控制面板（Universal Control Pane）和可信仓库（Trusted Registry）。\n- 在本地或云端部署\
    \ CaaS 的能力。\n- 用于管理镜像的私有可信仓库。\n- 通过 Swarm 和通用控制面板提供集群管理和编排能力。\n- 应用开发生命周期、持续集成和部署的工具。\n\
    \ 提供从开发到生产阶段整个应用生命周期的安全保障。\n\n参考 Docker 的 Docker Datacenter 页面获取更多关于提供 Docker\
    \ 服务的信息。\n\n## 5.4 总结\n\n在这一节中，我们理解了需要“Docker 即服务”解决方案来处理组织规模化容器化应用开发的需求。我们简要了解了通用\
    \ CaaS 服务提供的功能。然后，我们简要讨论了 Docker 名为 Docker Datacenter 的 CaaS 产品，它为开发者和 IT 管理员提供作为服务的\
    \ Docker 工具。\n\n# 第 6 章\n\n# Docker 构建构建示例\n\n## 6.1 引言\n\nDocker 是一个避免常见的冲突、依赖和环境不一致等头疼问题的工具，这对于分布式应用是一个重要问题，因为我们需要在相同配置的多个节点上安装或升级。\n\
    \nDocker 是一个容器管理器，这意味着它能够创建并执行代表软件特定运行时环境的容器。特定的运行时环境被称为 Docker 镜像（image），而容器是\
    \ Docker 镜像的特定执行。这与类和对象/实例的概念相同，允许我们为每个容器定义不同的网络配置。\n\nDockerhub 是 Docker 镜像的仓库。Docker\
    \ 用户可以上传他们的 镜像并与社区共享。它让软件提供者的用户无需处理安装指南。他们只需要下载镜像并创建所需数量的容器。事实上，当系统管理员需要在机器集群中扩展相同的软件时，这特别有用。\n\
    \n本教程的目的是解释如何使用 `docker build` 命令构建 Docker 镜像。\n\n## 6.2 安装与用法\n\n`docker build`\
    \ 命令取决于你的操作系统，在 mac、windows 和 ubuntu 上均可用。一旦安装了它，你就可以按照以下方式构建。\n\nDocker 构建命令\n\
    \n```bash\ndocker build\n```\n\n它输出如下：\n\n# 容器化实战\n\nbash-32$ docker build --help\n\
    Usage: docker build [OPTIONS] PATH | URL | -\n从指定的 源码构建新镜像\n\n--cpu-shares=0 \
    \             CPU 份额（相对权重）\n--cgroup-parent             可选的父 cgroup\n--cpu-period=\
    \               限制 CFS（完全公平调度）周期\n--cpu-quota=                限制 CFS（完全公平调度）配额\n\
    --cpuset-cpus=              允许执行的 CPU 数（0-3）\n--cpuset-mem=               允许执行的内存限制（0-3）\n\
    --disable-content-trust=true  跳过内容完整性验证\n-f,--file                  Dockerfile\
    \ 的名称（默认为 'PATH/Dockerfile'）\n--force-rm=false            构建后强制删除中间容器\n--help\
    \                      打印帮助信息\n--quiet                     抑制详细输出\n--memory= \
    \                  内存限制\n--memory-swap=              总内存（内存+交换分区），'-1' 表示禁用交换分区\n\
    --no-cache=false             构建镜像时不使用缓存\n--pull=false                 始终尝试拉取新版本的镜像\n\
    --rm=true                    构建成功后删除中间容器\n-t,--tag=                   仓库名称（以及可选标签）\n\
    --limit=[]                   大小限制\n```\n\n图 6.1：dockerbuild\n\ndocker build 命令从\
    \ Dockerfile 和上下文构建镜像。为了指定上下文，你需要引用本地文件目录或 URL。此上下文的内容可以在 Dockerfile 的 `ADD` 指令中引用。\n\
    \n## 6.3 上下文定义\n\n`docker build` 命令的上下文可以是本地目录（PATH）、Git 仓库（URL）或标准输入 (-）。本节解释了这些不同上下文的使用场景。\n\
    \n### 6.3.1 使用 PATH 构建\n\n可能你假设 Docker 守护进程始终在你的机器上运行。然而，当你为远程机器构建时，该命令向守护进程发送一个包含你指定的本地目录内容的\
    \ tar 包以继续构建。例如：\n\n从路径构建[source,java]\n\n```\ndocker build\n```\n\n将执行目录的内容发送到\
    \ Docker 守护进程。\n\n### 6.3.2 使用 URL 构建\n\nURL 为 Git 仓库设计。在这种情况下，构建命令会克隆 Git 仓库并将克隆的仓库作为上下文。根目录下的\
    \ Dockerfile 将用作 Dockerfile。除了 http 或 https 之外，你可以通过 git:// 或 git@ 架构指定任意的 Git\
    \ 仓库。对于 GitHub 仓库，我们可以如下使用 docker build：\n\n```\ndocker build github.com/myuser/project\n\
    ```\n\n"
