    \ built b89b1f0c206a\nDocker container 'docker-hello-world-container' is RUNNING.\n\
    Success: deleted b89b1f0c206a\nTotal time: 13.492 secs\nsh-4.2$ \n```\n\nFigure\
    \ 4.7: Run the Gradle task, build, docker, and dockerrun\n\nThe last line simply\
    \ says that the Docker container docker-hello-world-container is running. To see\
    \ if it printed \"Hello, World\" successfully, we need to check the logs created\
    \ by the container. This can be checked by executing the following command.\n\n\
    ```\n$ docker logs docker-hello-world-container\n```\n\n```\nFile Edit View Search\
    \ Terminal Help\nsh-4.2$ docker logs docker-hello-world-container\nHello, World\n\
    sh-4.2$ \n```\n\nFigure 4.8: Check the Docker Container Logs to Check if Hello\
    \ world was Printed\n\nThere it is!\n\n# 4.6 Summary\n\nIn this example we learned\
    \ how to create Docker Hello type containers in 4 different ways:\n\n- First,\
    \ we learned how to run the hello-world image provided by Docker. This printed\
    \ Hello World as soon as it was run\n- Next, we learned how to run the Alpine\
    \ image and print a Hello World using the echo shell command\n- Next, we learned\
    \ how to get the basic Hello World program into a Docker image and run it to Hello\
    \ World. The source code for this can be downloaded from the links given below.\n\
    - Finally, we learned how to set up a structured Java project using Gradle and\
    \ generate Docker images and Containers using Gradle plugins. We used this structure\
    \ to create a Hello World Java project and got to run in a container. Later, we\
    \ verified the Docker logs for the container to see that Hello World was printed\
    \ when the container was run. The source code for this also can be downloaded\
    \ from the links given below.\n\n# 4.7 Download the Source Code\n\nDownload\n\n\
    The source code for example 3 can be downloaded here: docker-hello-world.zip\n\
    \nThe source code for example 4 can be downloaded here: docker-hello-world-example.zip\n"
