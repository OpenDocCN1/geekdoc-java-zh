    \ 守护进程中可用的镜像。\n\n请记住，创建 docker 镜像对于在机器集群中安装需要的特定执行环境非常有有用。因此，它可以避免由于生产环境和开发环境之间的差异引起的问题。\n\
    \n# 第 7 章\n\n# Docker Compose 示例\n\n## 7.1 介绍\n\nDocker Compose 是一个用于定义和运行多容器\
    \ Docker 应用程序工具。通过 Compose，你可以定义一个配置文件，设置应用程序在特定机器上所需的 docker 容器集合。然后，使用单个命令在单台主机上创建并启动所有服务。\n\
    \nDocker Compose 对于以下用例场景特别有用：\n\n- 仅使用你自己的机器创建一个启动所有所需服务的开发环境。换句话说，无需在自己的机器或不同的机器上反复手动准备你的开发环境。\n\
    - 自动化创建与生产环境具有相同的测试环境，并运行集成测试。\n- 单机部署——即在一台机器上作为 docker 容器使用不同的服务。最推荐的方法是使用 Docker\
    \ machine 或 Docker swarm，因为你可以安全地从笔记本电脑远程远程启动 docker compose，而无需 SSH。\n\n要使用 Docker\
    \ Compose，你只需要创建一个名为 `docker-compose.yml` 的配置文件，该文件包含了创建和运行一组 docker 容器的规范。让我们尝试创建一个使用\
    \ redis 数据库服务器的 Web 应用程序示例。\n\n![](img](img/eef4930f20bf8a25354ad13017767cce_46_0.png)\n\
    \n## 7.2 Docker Toolbox 设置\n\nDocker compose 是 Docker toolbox 包含的工具之一。要安装 Docker\
    \ toolbox，你只需要为你的操作系统下载相应的安装程序并执行它。\nDocker Toolbox 包含以下工具：\n\n- Docker Compose：用于在一台机器上创建包含多个\
    \ docker 容器的环境。\n- Docker Machine：将 docker 容器动态运行到远程机器或本地/默认区域。\n- Docker Kitematic：通过图形用户界面\
    \ (GUI) 构建和运行容器。\n- VirtualBox：用于创建和运行 docker 容器。\n\n一旦完成安装程序，你就应该能够运行 `docker-compose\
    \ --help`，它会打印接受的子命令。\n\n## 7.3 Docker compose 示例：连接到 Redis 的 HTTP 服务器\n\n此示例关于一个使用\
    \ Redis 的 TODO 列表 Web 应用程序，基本上包含三个步骤：\n\n- 在 docker-compose.yml 中定义如何运行 Web 和数据库\
    \ docker 镜像，以便它们可以在隔离环境中在一起。\n- 创建 Web 应用程序及其 Dockerfile，以便在任何地方创建运行时环境。\n- 最后，运行\
    \ `docker-compose up`，Compose 将启动并运行你的整个应用。\n\n### 7.3.1 创建 docker-compose.yml\
    \ 文件\n\n创建一个名为 `todos` 的空项目，并将以下 `docker-compose.yml` 拷贝到项目目录下，docker-compose.yml\n\
    \n```\nweb:\n  build:\n    .\n  ports:\n    - \"8000:8000\"\n  links:\n    - redis\n\
    redis:\n  image: redis\n```\n\n该文件指定了两个容器：web，包含了我们启动 Web 服务器和 redis 服务器的 Java\
    \ 代码。注意在第一种情况下使用了 `build` 属性，而第二种情况使用了 `image` 属性。这意味着 web 容器需要构建一个出现在我们本地系统中的\
    \ docker 镜像。然而，对于 redis 服务器，镜是从 DockerHub 注册表下载的。\n\n通过这个 `docker-compose.yml`\
    \ 文件，Compose 在同一个本地网络中模拟了具有不同 IP 的两个机器，因为它们是链接的（link 属性）。然而，只有 web 通过你 docker-machine\
    \ 的 8000 端口对外开放，Docker 在此端口与容器 8000 端口之间创建绑定。\n\n### 7.3.2 创建 Web 服务器\n\n现在，让我们在与\
    \ `docker-compose.yml` 文件相同的目录下创建 Compose 所需的 Dockerfile，内容如下，\n\nDockerfile\n\
    \n```\nFROM ubuntu:14.04\nMAINTAINER jacavodegeeks\n\nRUN apt-get update && apt-get\
    \ install -y python-software-properties software-properties-common\nRUN add-apt-repository\
    \ ppa:webupd8team/java\n\nRUN echo \"oracle-java8-installer shared/accepted-license-v1-1\
    \ boolean true\" | \ndebconf-set-selections\n\nRUN apt-get update && apt-get install\
    \ -y oracle-java8-installer maven\n\nADD /usr/local/todolist\nRUN cd /usr/local/todolist\
    \ && mvn install assembly:assembly\nCMD [\"java\", \"-cp\", \"/usr/local/todolist/target/todolist-1.0-jar-with-dependencies.jar\"\
    , \"com.jacavodegeeks.todolist.TodoServer\"]\n```\n\n此 Dockerfile 使用 Maven 构建我们的\
    \ todolist 项目并启动一个简单的 Java 类。因此，有必要将我们的 todolist 项目转换为 Maven 项目。要这样做，请将以下 `pom.xml`\
    \ 拷贝到项目目录（与 Dockerfile 和 docker-compose.yml 相同的位置）。\n\npom.xml\n\n```\n<project\
    \ xmlns=\"https://maven.apache.org/POM/4.0.0\" xmlns:xsi=\"https://www.w3.org/2001/XMLSchema-instance\"\
    \n  xsi:schemaLocation=\"https://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd\"\
    >\n  <model>4.0.0</model>\n  <groupId>com.javacodgeeks</groupId>\n  <artifactId>todolist</artifactId>\n\
    \  <version>1.0</version>\n  <dependencies>\n    <dependency>\n      <groupId>org.bipaluch.redis</groupId>\n\
    \      <artifactId>lettuce</artifactId>\n      <version>3.3.2</version>\n    </dependency>\n\
    \    <dependency>\n      <groupId>commons-io</groupId>\n      <artifactId>commons-io</artifactId>\n\
    \      <version>2.4</version>\n    </dependency>\n    <dependency>\n      <groupId>com.fasterxml.jackson.core</groupId>\n\
    \      <artifactId>jackson-databind</artifactId>\n      <version>2.6.3</version>\n\
    \    </dependency>\n  </dependencies>\n  <build>\n    <plugins>\n      <plugin>\n\
    \        <artifactId>maven-assembly-plugin</artifactId>\n        <version>2.6</version>\n\
    \        <configuration>\n          <descriptorRefs>\n            <descriptorRef>jar-with-dependencies</descriptorRef>\n\
    \          </descriptorRefs>\n        </configuration>\n      </plugin>\n    </plugins>\n\
    \  </build>\n</project>\n```\n\n此 POM 文件使用 lettuce（一个 Java Redis 客户端）和 jackson-io\
    \ 作为编写基础 HTTP 服务器的工具库 src/main/java/com/javacodgeeks/todolist/TodoServer.java\n\
    \n```java\npackage com.jacodgegeeks.todolist;\n\nimport java.io.IOException;\n\
    import java.io.OutputStream;\nimport java.net.InetAddress;\nimport java.net.MalformedURLExceptionException;\n\
    import java.net.URI;\nimport java.util.List;\n\nimport org.apache.commons.io.IOUtils;\n\
    \nimport com.fasterxml.jackson.databind.ObjectMapper;\nimport com.lambdawarks.redis.RedisClient;\n\
    import com.lambdawarks.redis.RedisConnection;\nimport com.lambdawarks.redis.ValueScanCursor;\n\
    import com.sun.net.httpserver.HttpExchange;\n```\n\n"
