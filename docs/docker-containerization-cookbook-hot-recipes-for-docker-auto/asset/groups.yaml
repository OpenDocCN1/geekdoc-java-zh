    ## 2.3.1 拉取镜像


    Docker 社区非常庞大。有海量的预配置镜像，其中许多镜像由相关软件的官方开发者维护（例如 MySQL、Nginx、Jenkins 等很大程度上）。


    这些镜像可以在 Docker Hub 上找到。你不需要先创建一个容器来拉取镜像，但如果你想托管自己的镜像，则将需要一个容器。


    我们已经见过如何拉取镜像。对于这些官方镜像，我们只需要指定仓库名称即可：


    ```

    docker pull <repository>

    ```


    对于其他用户的镜像，我们必须指定用户名：


    ```

    docker pull <username>/<repository>

    ```


    默认情况下，将拉取仓库中的镜像（如果你拉取过 BusyBox 镜像，可能已经看到过“Using default tag: latest”提示信息）。但我们也可以拉取由版本标签指定的特定镜像。为此，我们只需要在冒号后添加标签即可：


    ```

    docker pull <username>/<repository>:<tag>

    ```


    例如：


    ```

    docker pull busybox:1.25.0

    ```


    注意：要查看你拥有的镜像，可以使用 `images` 命令：


    ```

    docker images

    ```


    ## 2.3.2 从 Dockerfile 创建镜像


    创建被称为 Dockerfile 的文件是基于现有镜像创建我们自定义镜像的方法。


    它只包含在文件中编写要执行的步骤。


    ## 2.3.3 创建容器


    我们已经见过如何拉取镜像并创建自己的镜像，但还没有学习如何使用它们。


    当我们使用镜像时（即实例化时），我们会创建一个容器。我们可以从同一个镜像创建多个容器。这个概念与面向对象编程中的类和对象几乎相同。


    创建容器，我们使用 `run` 命令。最简单的方法是直接指定镜像执行它：


    ```

    docker run busybox

    ```


    似乎什么都没有发生。但在后台，Docker 已经从镜像创建了一个容器，执行了它，然后结束了它，因为我们没有指定任何操作。


    我们可以在容器内部执行命令：


    ```

    docker run busybox echo "Hello world!"

    ```


    没什么大不了，对吧？但想象一下在虚拟机上这样做，并比较一下每个各花费的时间。


    我们还可以使用 `-it` 选项设置交互式 shell：


    ```

    docker run -it busybox

    ```


    为了看到一个更完整的示例，我们将拉取 Nginx 镜像：


    ```

    docker pull nginx

    ```


    然后我们将使用以下命令运行它：


    ```

    docker run -p 8080:80 -d nginx

    ```


    并且，如果我们在浏览器中访问 `localhost:8080`，我们将看到我们有一个 Docker 化的 Nginx Web 服务器！


    ![](img/eef4930f20bf8a25354ad13017767cce_22_0.png)


    让我们解释一下我们做了什么：


    - 通过 `-p 8080:80`，我们将主机的端口 8080 绑定到容器的端口 80。

    - 通过 `-d` 选项，我们将容器分离并在后台运行，并接收了其 ID。


    通过这个例子，你已经注意到了 Docker 的强大之处。


    注意：要停止容器，我们可以执行 `stop` 命令后跟容器 ID：


    ```

    docker stop <container-id>

    ```


    ## 2.4 总结


    在本教程中，我们学习如何在 Ubuntu 上安装 Docker 及其非常基础的配置。除此之外，我们还学习 Docker 的基本用法，从 Docker Hub
    拉取镜像以及从这些镜像创建容器。


    ## 第3章


    # Docker 内核要求


    ## 3.1 引言


    Docker 是一种容器化技术，为应用程序提供操作系统级的虚拟化。它隔离进程、存储、网络，并为运行在容器中的服务提供安全性。为了实现这一点，Docker 依赖于
    Linux 内核的各种特性。让我们在本文中介绍这些 Docker 内核要求。


    ## 3.2 Linux 内核对 Docker 引擎的依赖


    对 Linux 内核的依赖大致分为四类：资源限制、安全、网络和。资源限制功能允许容器创建者对容器环境进行限制，如内存使用、CPU 等。安全功能允许将安全策略应用到容器上。网络功能允许
    Docker 提供的 SDN 网络功能。存储功能允许 Docker 支持卷（volumes）以及各种存储后端。


    ![](img/eef4930f20bf8a25354ad13017767cce_24_0.png)


    图 3.1：Docker 的内核依赖


    现在让我们简要检查这些依赖的每一个。


    ## 3.3 资源限制依赖


    ### 3.3.1 3.1 控制组（即 cgroups）


    控制组（或 cgroups）是一种用于限制单个进程或一组进程资源使用的内核特性。它为 Docker 提供了 4 个主要功能：


    - 为用户定义的进程限制资源（CPU、内存、网络、磁盘 I/O 等……）。

    - 设定资源优先级（一组进程将比另一组获得更多资源）。

    - 为了计费目的衡量资源使用。

    - 控制一组进程。


    `docker run` 命令用于操作分配给容器的资源。例如，`docker run --shares=<value>` 设置分配给容器的 CPU 份额（每个容器默认获得
    1024 份）。`docker run --cpuset-cpu=<value>` 设置运行容器的 CPU 核心。请查看这篇有见地的文章以获取一些为 Docker
    容器操作 cgroups 设置的示例。


    ### 3.3.2 命名空间（Namespaces）


    命名空间是种为容器提供轻量级进程虚拟化的内核特性。这有助于 Docker 为容器隔离这些资源——进程 ID、主机名、用户 ID、网络访问、IPC 和文件系统。Docker
    结合了命名空间和 cgroups 来隔离容器资源并管理使用限制。这些命名空间用于隔离容器——进程 ID (pid)、网络 (net)、挂载 (mnt)、主机名
    (uts)、共享内存 (ipc)。


    - pid 命名空间处理在容器内运行且与其他容器隔离的进程。

    - net 命名空间为每个容器创建单独的网络接口和 IP 地址。

    - mnt 命名空间为每个容器创建隔离的挂载。来自主机操作系统的挂载点可能会被带入容器，但对其的任何添加都不会传回宿主机。

    - uts 命名空间创建拥有自己主机名的容器，而不影响其他容器或系统的其余部分。

    - ipc 命名空间为每个容器创建隔离的共享内存空间，并防止不同计算机共享内存之间的访问。


    ## 3.4 安全依赖


    ### 3.4.1 AppArmor


    AppArmor 是一种强制性访问控制（MAC）工具，用于将程序限制在有限资源范围内。限制策略在简单的文本文件中设置，以管理进程的存储、网络和能力。策略可以在强制模式（enforcement
    mode）或投诉模式（complain mode）运行。强制模式下的策略将执行策略并报告违规行为。投诉模式下的策略不会执行限制，仅报告违规行为。


    Docker 安装了默认的 AppArmor 配置文件 `/etc/apparmor.d/docker`。这被应用于所有 Docker 容器。你可以使用 `docker
    run -it <container-name> --security-opt=apparmor=<profile-name>` 为容器应用特定的 AppArmor
    配置。


    阅读此处详细 Docker 如何 使用 AppArmor。


    ### 3.4.2 增强 Linux（即 SELinux）


    SELinux 与 AppArmor 类似，在内核子系统上执行 MAC 策略。与 AppArmor 相比，SELinux 允许进行更详细的多级安全策略控制。它目前由
    RedHat 开发和维护。


    ### 3.4.3 Posix 能力（即 Capabilities）


    在 Linux 中实现的 Capabilities（被称为 Posix Capabilities）将 root 用户的权限划分为称为“能力”的较小单元。这些能力作为一个单元被启用/禁用，并分配给线程。线程/进程可以使用最小能力集来执行某些操作，而无需假设超级权限。请查看
    Linux 系统中的 `man capabilities` 以获取更多关于能力的详细信息。Docker 使用能力来限制容器的实际能力，同时为其内部的服务提供所有可能的功能。容器内的
    root 用户可能不具备主机 OS 中 root 用户的所有权限。


    阅读本文以进一步探索 Docker 对能力的支持。


    ### 3.4.4 安全计算模式（即 seccomp）


    安全计算模式，也称为 seccomp，提供了一种过滤用户定义进程可用系统调用的机制。它与其他工具结合，提供 seccomp 沙箱来从所有可用系统调用中过滤线程。当
    seccomp 应用到线程时，它只能执行 4 个系统调用——read(), write(), sigreturn() 和 exit()。如果进程使用任何其他系统调用，内核将杀死该进程。


    通过 `docker run` 的 `security-opt` 选项为 Docker 容器设置 seccomp 配置文件，如下：


