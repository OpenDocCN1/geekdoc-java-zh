    # 3.5 Networking dependencies


    # 3.5.1 Netfilter


    Netfilter is a framework provided by the Linux Kernel that allows network packets
    flowing through the machine to be manipulated. Features include static and stateful
    packet filtering of IPv4 and IPv6 packets, Network address translation, port address
    translation, extensible APIs for 3rd party app developers. Docker uses Netfilter
    through it''s users counterpart IPTables.


    # 3.5.2 IPTables


    iptables is the user-space utility for netfilter. It interacts with netfilter
    and allows a system administrator to define firewalls rules for packet filtering,
    network address translation (NAT), and so on. The Docker daemon appends firewall
    rules to iptables if it sees installed in the system. For example when we expose
    a container''s port to the outside world Docker adds a corresponding rule to iptables.
    To disable iptables, start Docker daemon with the option iptables set to false
    so:


    ```

    $ docker --iptables=false

    ```


    See this blog post for a few examples of how Docker uses iptables.


    # 3.5.3 Netlink


    Netlink as a tool provides a mechanism for communication between kernel and userspace
    components using a socket interface. Even userspace components can use this to
    communicate among one another. This is an alternative to ioctl and reduces dependence
    on direct system calls, ioctl calls, and such. Docker implements it''s netlink
    libraries to talk to the kernel''s netlink interface to create and connect network
    devices.


    This excellent post has details about how Docker uses Netlink.


    # 3.6 File system dependencies


    Docker supports various storage drivers with a plug-in architecture. One can choose
    a storage driver to run the Docker daemon with. However, Docker Engine can only
    support one active storage driver at a time. A change in the storage drive will
    need the Docker daemon to restart.


    # 3.6.1 Device mapper


    The devicemapper framework is provided by the kernel to map physical block devices
    as virtual devices. It provides the foundation for features such as logical volume
    management, device encryption, copy-on-write files, et... Docker uses this framework
    to support copy-on-write files in containers.'
  - '[PAGE 27]


    # 3.7 Other non-kernel dependencies


    # 3.7.1 LibContainer a.k.a RunC


    libcontainer (Now called opencontainers/RunC) - This is not exactly a kernel feature.
    Docker developed this as an execution engine that exposes a consistent standardized
    Go API to work with Linux namespaces, cgroups, capabilities, AppArmor, security
    profiles, network interfaces, firewalls and firewalling rules. RunC has replaced
    LXC as the default execution driver of the Docker Engine.


    # 3.7.2 LXC


    Like libcontainer, LXC provides a userspace interface for the Linux Kernel''s
    container supporting features. LXC was the initial execution engine before Docker
    moved to RunC.


    # 3.8 Summary


    In this post we were introduced to the key kernel features on which Docker depends
    and builds to enable containerization. Each of the Kernel features in itself can
    be pursued further and understood more deeply to improve container security in
    Docker. The Docker docs also contain more information about kernel level enablers.'
