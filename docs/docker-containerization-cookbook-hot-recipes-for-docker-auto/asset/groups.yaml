    \ configuration file 55\n  - 10.3.3 Using filters 56\n- 10.4 Summary 56\n\nCopyright\
    \ (c) Exelix Media P.C., 2016\n\nAll rights reserved. Without limiting the rights\
    \ under copyright reserved above, no part of this publication may be reproduced,\
    \ stored or introduced into a retrieval system, or transmitted, in any form or\
    \ by any means (electronic, mechanical, photocopying, recording or otherwise),\
    \ without the prior written permission of the copyright owner.\n\n# Preface\n\n\
    Docker is the world's leading software containerization platform. Docker containers\
    \ wrap a piece of software in a complete filesystem that contains everything needed\
    \ to run: code, runtime, system tools, system libraries - anything that can be\
    \ installed on a server. This guarantees that the software will always run the\
    \ same, regardless of its environment. (Source: https://www.docker.com/what-docker)\n\
    \nDocker provides an additional layer of abstraction and automation of operating-system-level\
    \ virtualization on Linux. Docker uses the resource isolation features of the\
    \ Linux kernel such as cgroups and kernel namespaces, and a union-capable file\
    \ system such as OverlayFS and others to allow independent \"containers\" to run\
    \ within a single Linux instance, avoiding the overhead of starting and maintaining\
    \ virtual machines (Source: https://en.wikipedia.org/wiki/Docker_(software)).\n\
    \nIn this ebook, we provide a compilation of Docker examples that will help you\
    \ kick-start your own automation projects. We cover a wide range of topics, from\
    \ installation and configuration, to DNS and commands. With our straightforward\
    \ tutorials, you will be able to get your own projects up and running in minimum\
    \ time.\n\n# About the Author\n\nJCGs (Java Code Geeks) is an independent online\
    \ community focused on creating the ultimate Java to Java developers resource\
    \ center; targeted at the technical architect, technical team lead (senior developer),\
    \ project manager and junior developers alike.\n\nJCGs serve the Java, SOA, Agile\
    \ and Telecom communities with daily news written by domain experts, articles,\
    \ tutorials, reviews, announcements, code snippets and open source projects.\n\
    \nYou can find them online at https://www.javacodegeek.com/\n\n# Chapter 1\n\n\
    # Docker Tutorial for Beginners\n\nIn this article we are going to explain the\
    \ main features of Docker. We are going to briefly explain why containers are\
    \ necessary, which are the main commands to use and how to use Docker in our integration\
    \ tests. The following table shows an overview of the whole article:\n\n## 1.1\
    \ Why do we need Docker?\n\nFigure 1.1: docker\n\nconsistent environments, which\
    \ is an important problem for distributed applications, where we need to install\
    \ or upgrade several nodes with the same configuration.\n\n# Docker Containerization\
    \ Cookbook\n\nDocker is a container manager, which means that it is able to create\
    \ and execute containers that represent specific runtime environments for your\
    \ software. In contrast with virtual machines like VirtualBox, Docker uses resource\
    \ isolation features of the Linux kernel to allow independent \"containers\" to\
    \ run within a single Linux instance, avoiding the overhead of starting and maintaining\
    \ virtual machines. A computer with docker can run multiple containers at the\
    \ same time.\n\nTherefore, the automation of Docker mainly offers facilities for\
    \ integration tests and continuous delivery.\n\n## 1.2 Machines, Images and Containers\n\
    \nIn order to use docker, it is important to have clear some vocabulary. Docker\
    \ distinguishes three important concepts: docker machines, docker images and containers.\n\
    \nDocker containers are executions of an specific runtime environment. For example,\
    \ to simulate a machine with a specific database ap. These runtime environments\
    \ are called Docker images, which are the result of executing the set of commands\
    \ that appear in a specific script-like file called Dockerfile. Therefore, Docker\
    \ allow having multiple containers of a specific Docker image. These could be\
    \ compared with the concepts of program and process. Indeed, containers like processes,\
    \ can be created, stopped, died, or running.\n\nDocker machines are local (and\
    \ virtual) machines or remote machines(e.g in a cloud such as Amazon AWS or DigitalOcean)\
    \ with a docker running. Like physical machines, docker machines has an specific\
    \ IP address. Each docker machine can manage multiple docker images and containers.\
    \ From our own personal computer, the docker-machine command, allow us connecting\
    \ to all our docker machines to manage their containers and images.\n\n# Docker\
    \ machine {IP=192.168.99.100}\n\n# Docker machine {IP=...}\n\n# Docker containers\n\
    \ncontainer1:MongoDB\ncontainer2:MongoDB\ncontainer3:MongoDB\n\nDigitalOcean\n\
    \n# Docker machine {IP=...}\n\nAWS\n\n# Docker images\n\n| MongoDB | Java8 |\n\
    | Ubuntu | ... |\n\n## 1.2.1 Installing steps to docker and docker-machine\n\n\
    Follow the next steps to install docker and docker machine\n\nDownload and install\
    \ the docker binary file from here. Once, you have followed the installation instructions,\
    \ you should be able to run the following command.\n\nDocker installation test\n\
    \n```\n$ docker run ubuntu:14.04 /bin/echo 'It works!'\nIt works!\n```\n\nDownload\
    \ the Docker Binary and update your PATH if you are running OS or Linux:\n\nUnix\
    \ Docker machine installation\n\n```bash\n$ curl -L https://github.com/docker/machine/releases/download/v0.6.0/docker-machine-uname\
    \ \\\ns-`uname -m` > /usr/local/bin/docker-machine && \\\nchmod +x /usr/local/bin/docker-machine\n\
    ```\n\nIf you are running Windows with git bash\n\nWindows Docker Machine installation\n"
