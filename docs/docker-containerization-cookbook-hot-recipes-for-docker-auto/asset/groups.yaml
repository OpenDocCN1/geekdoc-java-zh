    \n# Chapter 7\n\n# Docker Compose example\n\n## 7.1 Introduction\n\nDocker Compose\
    \ is a tool for defining and running multi-container Docker applications. With\
    \ Compose, you define a configuration file the set of docker containers that application\
    \ requires an specific machine. Then, using a single command, you create and start\
    \ all the services in a single host.\n\nDocker Compose is specially useful for\
    \ the following use case scenarios:\n\n- Create a development environment with\
    \ all the required services started only using your own machine. In other words,\
    \ stop to prepare your development environment manually over and over again in\
    \ your own or different machines.\n- Automate test environments with the same\
    \ characteristics as the production environments and run integration tests.\n\
    - Single hosts deployments- that is use a machine with different services as docker\
    \ containers. The most recommended way to do so is using the Docker machine or\
    \ Docker swarm because you can launch docker compose remotely from your laptop\
    \ in a safe way without requiring SSH.\n\nTo use Docker Compose, you just need\
    \ to create configuration file called docker-compose.yml, which contains the specification\
    \ to create and run a set of docker containers. Let’s try to create an example\
    \ with a web application that uses a redis database server.\n\n![](img](img/eef4930f20bf8a25354ad13017767cce_46_0.png)\n\
    \n## 7.2 Docker Toolbox setup\n\nDocker compose is one of the included tools into\
    \ the Docker toolbox. To install Docker toolbox, you just need to download the\
    \ appropriate installer from here for your operative system and execute it.\n\
    Docker Toolbox contains the following tools:\n\n- Docker Compose : to create environments\
    \ with multiple docker containers in one machine.\n- Docker Machine : to dynamically\
    \ run docker containers to remote machines or in the local/default zone.\n- Docker\
    \ Kitematic : to Build and run containers through a graphical user interface (GUI).\n\
    - VirtualBox : to create and run docker containers.\n\nOnce you have finished\
    \ the installation procedure, you should be able to run docker-compose --help,\
    \ which prints the accepted subcommands.\n\n## 7.3 Docker compose example: An\
    \ HTTP server connected to Redis\n\nThis example is about a web application for\
    \ a TODO list using Redis with basically a three steps:\n\n- Define how to run\
    \ the web and database docker images in docker-compose.yml so they can be together\
    \ in an isolated environment.\n- Create the web application and its Dockerfile\
    \ to create the runtime environment anywhere.\n- Lastly, run docker-compose up\
    \ and Compose will start and run your entire app.\n\n### 7.3.1 Creating the docker-compose.yml\
    \ file\n\nCreate an empty project called todos and copy the following docker-compose.yml\
    \ inside the project directory, docker-compose.yml\n\n```\nweb:\n  build:\n  \
    \  .\n  ports:\n    - \"8000:8000\"\n  links:\n    - redis\nredis:\n  image: redis\n\
    ```\n\nThis file specifies two containers: web, which contains our Java code to\
    \ launch a web server and redis server. Notice that in the first case, anyway\
    \ builds the property, which the second case, the image property. It means that\
    \ in order web container needs to build a docker image that appears in our local\
    \ system. However, for the redis server, the image is downloaded from the DockerHub\
    \ registry.\n\nWith this docker-compose.yml file, Compose simulates two machines\
    \ with different IP in a same local network because they are linked (link property).\
    \ However, only the web is externally through the 8000 of your docker-machine\
    \ and Docker creates a binding between this port and the container 8000 port.\n\
    \n### 7.3.2 Creating the web server\n\nNow, let's create the Dockerfile that Compose\
    \ requires in the same directory as the docker-compose.yml file with the following\
    \ contents,\n\nDockerfile\n\n```\nFROM ubuntu:14.04\nMAINTAINER jacavodegeeks\n\
    \nRUN apt-get update && apt-get install -y python-software-properties software-properties-common\n\
    RUN add-apt-repository ppa:webupd8team/java\n\nRUN echo \"oracle-java8-installer\
    \ shared/accepted-license-v1-1 boolean true\" | \ndebconf-set-selections\n\nRUN\
    \ apt-get update && apt-get install -y oracle-java8-installer maven\n\nADD /usr/local/todolist\n\
    RUN cd /usr/local/todolist && mvn install assembly:assembly\nCMD [\"java\", \"\
    -cp\", \"/usr/local/todolist/target/todolist-1.0-jar-with-dependencies.jar\",\
    \ \"com.jacavodegeeks.todolist.TodoServer\"]\n```\n\nThis Dockerfile builds our\
    \ todolist project with Maven and starts a simple Java class. Thus, it is necessary\
    \ to convert our todolist project into a Maven project. To do so, copy the following\
    \ pom.xml in the project directory (the same place than Dockerfile and docker-compose.yml).\n\
    \npom.xml\n\n```\n<project xmlns=\"https://maven.apache.org/POM/4.0.0\" xmlns:xsi=\"\
    https://www.w3.org/2001/XMLSchema-instance\"\n  xsi:schemaLocation=\"https://maven.apache.org/POM/4.0.0\
    \ https://maven.apache.org/xsd/maven-4.0.0.xsd\">\n  <model>4.0.0</model>\n  <groupId>com.javacodgeeks</groupId>\n\
    \  <artifactId>todolist</artifactId>\n  <version>1.0</version>\n  <dependencies>\n\
    \    <dependency>\n      <groupId>org.bipaluch.redis</groupId>\n      <artifactId>lettuce</artifactId>\n\
    \      <version>3.3.2</version>\n    </dependency>\n    <dependency>\n      <groupId>commons-io</groupId>\n\
    \      <artifactId>commons-io</artifactId>\n      <version>2.4</version>\n   \
    \ </dependency>\n    <dependency>\n      <groupId>com.fasterxml.jackson.core</groupId>\n\
    \      <artifactId>jackson-databind</artifactId>\n      <version>2.6.3</version>\n\
    \    </dependency>\n  </dependencies>\n  <build>\n    <plugins>\n      <plugin>\n\
    \        <artifactId>maven-assembly-plugin</artifactId>\n        <version>2.6</version>\n\
    \        <configuration>\n          <descriptorRefs>\n            <descriptorRef>jar-with-dependencies</descriptorRef>\n\
    \          </descriptorRefs>\n        </configuration>\n      </plugin>\n    </plugins>\n\
    \  </build>\n</project>\n```\n\nThis POM file uses lettuce (a Java Redis client)\
    \ and jackson-io as utility libraries for coding basic HTTP server src/main/java/com/javacodgeeks/todolist/TodoServer.java\n\
    \n```java\npackage com.javacodgegeeks.todolist;\n\nimport java.io.IOException;\n\
    import java.io.OutputStream;\nimport java.net.InetAddress;\nimport java.net.MalformedURLExceptionException;\n\
    import java.net.URI;\nimport java.util.List;\n\nimport org.apache.commons.io.IOUtils;\n\
    \nimport com.fasterxml.jackson.databind.ObjectMapper;\nimport com.lambdawarks.redis.RedisClient;\n\
    import com.lambdawarks.redis.RedisConnection;\nimport com.lambdawarks.redis.ValueScanCursor;\n\
    import com.sun.net.httpserver.HttpExchange;\n```\n"
