    ```\n\nAnd add a --table value for the psFormat, e.g.:\n\n```\n{\n  \"psFormat\"\
    : \"table {{ .ID }}\\t{{ .Names }}\\t{{ .Status }}\"\n}\n```\n\nNow, just executing\
    \ the following Docker command:\n\n```\ndocker ps -a\n```\n\nThe output would\
