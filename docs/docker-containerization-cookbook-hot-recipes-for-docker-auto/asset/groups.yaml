    Docker Containerization Cookbook


    # 10.3 Listing containers


    The Docker command for listing containers is ps (yes, not a very good name). So,
    let''s try it:


    ```

    docker ps

    ```


    For which will return an output like the following:


    | CONTAINER | IMAGE | COMMAND | CREATED | STATUS | |

    | --- | --- | --- | --- | --- | |

    | e72b3c39fdd9 minutes | busybox | "sh" jolly_bhabha | 3 minutes ago | Up 3 |


    The first thing that probably will come to our minds is that we are just seeing
    a single container, when we actually instantiated several of them. This is because
    ps just shows the active, running containers. And, actually, we only have a single
    container running: the one we interactively.


    If we want to show all containers, we must use the -a (--all) option to ps:


    ```

    docker ps -a

    ```


    In this case, the output would be:


    | CONTAINER | IMAGE | COMMAND | CREATED | STATUS | |

    | --- | --- | --- | --- | --- | |

    | e72b3c39fdd9 minutes | busybox | "sh" jolly_bhabha | 3 minutes ago | Up 3 |

    | 642aec6d538 | busybox | "sh" mybusybox | 3 minutes ago | Exited |

    | (0) 3 minutes ago | busybox | "sh" grave_ramanujan | 3 minutes ago | Exited
    |

    | 05833ec5598 | busybox | "echo ''Hello world''" | 3 minutes ago | Exited |

    | (0) 3 minutes ago | busybox | pedantic_hoover | 3 minutes ago | Exited |

    | e4ceead7853b3 (0) 3 minutes ago | "sh" cranky_murdock | 3 minutes ago | Exited
    |


    # 10.3.1 Formatting the output


    You might find the output not very pretty, since the lines are cramped if the
    width of the window is not big enough. Fortunately, this command allows custom
    formatting. This is achieved with the --format option. The format is specified
    in "Go Template", which is pretty easy.


    ```

    docker ps --format ''{{.column-name}}: {{.column-value}}''

    ```


    Specifying as many columns as we want. Of course, the formatting is compatible
    with -a option.


    If we just wanted to see the names, we could execute:


    ```

    docker ps -a ''{{.Names}} {{.Status}}''

    ```


    Which would show:


    ```

    jolly_bhabha Exited (0) 5 minutes ago

    mybusybox Exited (0) 5 minutes ago

    grave_ramanujan Exited (0) 5 minutes ago

    pedantic_hoover Exited (0) 5 minutes ago

    cracky_murdock Exited (0) 5 minutes ago

    ```


    The name of fields are case sensitive, and for the same cases the field name we
    use with --format is not very intuitive.

    So this is the list of field name we use for each column:'
