    # Chapter 5


    # Docker as a Service


    In the previous posts we learned about Docker, containers, and working with containers.
    In this post we will learn about Containers as a Service (CaaS) in general and
    how Docker realizes CaaS.


    ## 5.1 Why Docker as a Service?


    Take a typical developer work-flow involving Docker. It will be typically as below.
    This is based on the reference workflow provided in the Docker docs.


    # Docker Containerization Cookbook


    ![](img/eef4930f20bf8a25354ad13017767cce_39_0.png)


    Figure 5.1: A typical Docker workflow


    As we can see from the above workflow, there is quite some IT activity to be performed
    if Docker is used for app development at scale in an organization.


    - Infrastructure to host Docker containers and all the other related tools provided
    by Docker.

    - Provide compute, storage and networking for the containers as needed.

    - Application lifecycle support and touring.

    - Monitor utilization of compute, storage and networking/stop/start containers
    as needed.

    - Address scaling needs of containers. Handle orchestration of containers at enterprise
    scale.


    These issues are significant at enterprise scale. The existing solution has for
    administrators to use infrastructure-as-a-service (IaaS) like Amazon’s AWS EC2
    and handle the above issues manually or through home-built tools. However, Docker
    provides the Docker-as-a-service to address the above issues.


    ## 5.2 Container as a Service (CaaS)


    So, what is CaaS? It is a cloud service model that enables users to order and
    use containerization infrastructure from a cloud provider using a pay-as-you-go
    model. Docker CaaS is an example, Amazon EC2 Container Service (ECS) by AWS is
    another example.


    As a cloud service model, CaaS probably sits as a subset of IaaS in that it enables
    a container-based infrastructure for it users.

    A CaaS offering usually seeks to provide the following features to it users.


    - Manage containers through an API or web interface.

    - Monitor compute, storage and network resources used by the containers.

    - Provide cluster management and orchestration capabilities for containers.

    - Provide security and governance controls.

    - Ideally, be cheap so that the CaaS can be shifted across cloud providers or
    from in-premises to cloud.


    ## 5.3 Docker CaaS


    Docker''s CaaS offering called Docker Datacenter packages Docker''s tools to provide
    developers and IT with a consistent infrastructure. This is a commercial offering
    aimed at enterprises and provides the following features.


    - Brings well known source tools under a CaaS umbrella - Docker Engine, Docker
    Compose, Docker registry, Docker Swarm.

    - Adds commercial offerings - Universal Control Pane and Trusted Registry.

    - Ability to deploy the CaaS in-premises or cloud.

    - A private trusted registry for managing images.

    - Cluster management and orchestration capabilities through Swarm and Universal
    Control Pane.

    - Tools for the application development lifecycle, continuous integration and
    deployment.

    - Provides security in the application lifecycle all the way from dev to production
    stages.


    Refer to the Docker Datacenter pages by Docker for more information about providing
    Docker as a service.


    ## 5.4 Summary


    In this short, we understood the need for a ''Docker-as-a-service'' solution to
    handle containerized application development needs at scale for an organizations.
    We briefly understood the features provided by a CaaS service in general. Then
    we briefly discussed Docker''s CaaS offering called the Docker Datacenter that
    offers Docker tools as a service to developers and IT administrators.


    # Chapter 6


    # Docker Build Example


    ## 6.1 Introduction


    Docker is a tool to avoid the usual headaches of conflicts, dependencies and inconsistent
    environments, which is an important problem for distributed applications, where
    we need to install or upgrade several nodes with the same configuration.


    Docker is a container manager, which means that it is able to create and execute
    containers that represent specific runtime environments for your software. An
    specific runtime environment is called Docker image and containers are specific
    executions of a Docker images. It is the same concept that classes and objects/instances,
    which allow to define, for example, different network configurations for each
    container.


    Dockerhub is a repository of docker images. Docker users can upload their docker
    images and share them with the community. It allows users of software providers
    do not need to deal with installation guides. They just need to download the image
    and create as many containers they need. In fact, it is specially useful when
    system administrators need to scale the same software in a cluster of machines.


    The purpose of this tutorial is to explain how to build docker images using the
    docker build command and the supported building options. As we will see below,
    docker allows to build images using different approaches.


    ## 6.2 Installation & Usage


    The docker build command is available from your docker installation, which depends
    on your operative system and are widely explained here for mac, here for windows
    and here for ubuntu. Once, you have followed the installation instructions, you
    should be able to run the docker build command.


    Docker usage command


    ```

    docker build --help

    ```


    It prints the following output:


    # Docker Containerization Cookbook


    bash-3.2$ docker build --help

    Usage: docker build [OPTIONS] PATH | URL | -

    Build a new image from the source code at PATH


    ```

    -c,--cpu-shares=0      CPU shares (relative weight)

    --cgroup-parent             Optional parent cgroup for the container

    --cpu-period=               Limit the CFS (Completely Scheduler) period

    --cpu-quota=                Limit the CFS (Completely Scheduler) quota

    --cpuset-cpus=              CPUs in which allow execution (0-3, 0,1)

    --memuset-mem=               MEMs in which to allow execution (0-3, 0,1)

    --disable-content-trust=true  Skip image verification

    -f,--file                  Name of the Dockerfile (Default is ''PATH/Dockerfile'')

    --force-rm=false            Always remove intermediate containers

    --help                      Print usage

    -M,--memory=               Memory limit

    --memory-swap=              Total memory (memory + swap), ''-1'' to disable swap

    --no-cache=false             Do not use cache when building the image

    --pull=false                 Always attempt to pull a newer version of the image

    -Q,--quiet=false            Suppress the verbose output generated by the containers

    --rm=true                    Remove intermediate containers after a successful
    build

    -t,--tag=                   Repository name (and optionally a tag) for the image

    --limit=[]                   bandSize limit

    ```


    Figure 6.1: dockerbuild


    The docker build command builds images from a Dockerfile and a context. In order
    to specify a context you need to reference a local file directory or a URL. The
    contents of this context can be referenced from ADD instructions of the Dockerfile
    to reference a file in the context.


    ## 6.3 Context definition


    The context of a docker build command can be a local directory (PATH), a Git repository
    (URL) or the standard input (-). This section explains the usage scenarios of
    these different contexts.


    ![](img/eef4930f20bf8a25354ad13017767cce_43_0.png)


    Figure 6.2: docker-build-alternatives


    ### 6.3.1 Build with PATH


    Probably, you are assuming that the docker daemon is always running in your machine.
    However, when you are building images for a remote machine, this command is sending
    to the daemon a tar file with the contents of the local directory you have specified
    to proceed with the build command. For example:


    Docker build from path[source,java]


    ```

    docker build

    ```


    Sends the contents of the execution directory to the docker daemon.


    ### 6.3.2 Build with URL


    URLs are specially designed for Git repositories. In this case, the build command
    clones the Git repository and uses the cloned repository as context. The Dockerfile
    at root of the repository is used as Dockerfile. Alternatively to http or https,
    you can specify an arbitrary Git repository by the git:// or git@ schema. For
    a GitHub repository, we can use docker build as follows:


    Docker build from git


    ```

    docker build github.com/myuser/project

    ```

    '
