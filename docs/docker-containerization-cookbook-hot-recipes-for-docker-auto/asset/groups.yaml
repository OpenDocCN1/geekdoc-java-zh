    # Chapter 2


    # Install Docker on Ubuntu Tutorial


    Docker is, without any doubt, on of the most popular software at the moment, being
    used by almost every developer and systems administrator. In this tutorial, we
    will see how to install it in Ubuntu systems.

    For this tutorial, we will use Linux Mint 18 (an Ubuntu based Linux distribution)
    64-bit version.


    # 2.1 Requisites


    According to Docker documentation, we must meet the following prerequisites for
    installing Docker:


    +   - 64-bit distro. Obviously, we need a 64-bit microprocessor.

    - At least, 3.10 kernel version. In Ubuntu, these versions are present since 13.10,
    so it shouldn''t be a problem.


    Just in case, we can check the kernel version with the following command:


    ```

    uname -r

    ```


    Which will show the kernel release. For this case, the output is:


    ```

    4.4.0-21-generic

    ```


    Now, let''s see how we can install it.


    # 2.2 Installation


    We can install Docker simply via apt-get, without the need of adding any repository,
    just installing the docker.io package:


    ```

    sudo apt-get update

    sudo apt-get install docker.io

    ```


    We can check that Docker has been successfully installed with executing the following:


    ```

    docker -v

    ```


    In this case, the following version has been installed:


    ```

    Docker version 1.11.2, build b9f10c9

    ```


    We can check if the Docker service was started:'
