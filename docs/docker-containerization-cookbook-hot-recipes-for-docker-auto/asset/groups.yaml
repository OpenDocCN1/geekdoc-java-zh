  - '[PAGE 10]


    # Docker Containerization Cookbook


    Docker is a container manager, which means that it is able to create and execute
    containers that represent specific runtime environments for your software. In
    contrast with virtual machines like VirtualBox, Docker uses resource isolation
    features of the Linux kernel to allow independent "containers" to run within a
    single Linux instance, avoiding the overhead of starting and maintaining virtual
    machines. A computer with docker can run multiple containers at the same time.


    Therefore, the automation of Docker mainly offers facilities for integration tests
    and continuous delivery.


    # 1.2 Machines, Images and Containers


    In order to use docker, it is important to have clear some vocabulary. Docker
    distinguishes three important concepts: docker machines, docker images and containers.


    Docker containers are executions of an specific runtime environment. For example,
    to simulate a machine with a specific database ap. These runtime environments
    are called Docker images, which are the result of executing the set of commands
    that appear in a specific script-like file called Dockerfile. Therefore, Docker
    allow having multiple containers of a specific Docker image. These could be compared
    with the concepts of program and process. Indeed, containers like processes, can
    be created, stopped, died, or running.


    Docker machines are local (and virtual) machines or remote machines(e.g in a cloud
    such as Amazon AWS or DigitalOcean) with a docker running. Like physical machines,
    docker machines has an specific IP address. Each docker machine can manage multiple
    docker images and containers. From our own personal computer, the docker-machine
    command, allow us connecting to all our docker machines to manage their containers
    and images.'
