    \  --> 7d633cc7ff0b\nRemoving intermediate container 01e53de6d98\nSuccessfully\
    \ built 7d633cc7ff0b\nsh-4.2$\n```\n\nFigure 4.4: Build Docker Image Called docker-hello-world\n\
    \nFinally, run the Docker image to see the \"Hello, World\" printed.\n\n```\n\
    $ docker run docker-hello-world:latest\n```\n\nAs a result of this you should\
    \ see the below output\n\n```\nFile Edit View Search Terminal Help\nsh-4.2$ docker\
    \ run docker-hello-world:latest\nHello, World\nsh-4.2$ \n```\n\nFigure 4.5: Run\
    \ the Docker Image docker-hello-world\n\nThat's it. This verifies that you can\
    \ create your own custom Docker images too and run them.\n\n# 4.5 Execute a \"\
    Hello, World\" Program in Java Using Gradle and Docker\n\nLet us take it another\
    \ notch now. Real world programs are more complex than the ones shown above. So\
    \ let us create another hello Java program and run it in a Docker container using\
    \ a few best-practices of the Java ecosystem. Furthermore, let set up a Java project\
    \ using Gradle, add the Docker plugin for it, create a Docker image and run it\
    \ using Gradle.\n\n## 4.5.1 Initialize a New Project and Create HelloWorld.java\n\
    \nFirst of all, Create a new folder called \"docker-hello-world-example\", open\
    \ a terminal and change into this folder. Next, use Gradle to initialize a new\
    \ Java project.\n\n```\n$ gradle init --java-library\n```\n\nOnce do you see the\
    \ following folder structure created. You can free delete the files Library.java\
    \ and LibraryTest.java. We will not be needing them.\n\n```\nFile Edit View Search\
    \ Terminal Help\nsh-4.2$ tree\n |-- build.gradle\n|-- gradle\n|   -- wrapper\n\
    |     |-- gradle-wrapper.jar\n|     |-- gradle-wrapper.properties\n|-- gradlew\n\
    |-- gradle.bat\n|-- settings.gradle\n|-- src\n|   -- main\n|     |-- java\n| \
    \      |-- Library.java\n|   -- test\n|     -- java\n|         -- LibraryTest.java\n\
    7 directories, 8 files\nsh-4.2$ \n```\n\n> Figure 4.6: Folder structure for the\
    \ Sample Java Project Created by Gradle\n\nNow, create a new file src/main/java/com/javacodegeeks/examples/HelloWorld.java\
    \ and enter the following in it. Save it once done.\n\n```java\npackage com.javacodegeeks;\n\
    \npublic class HelloWorld {\n    public static void main(String[] args) {\n  \
    \      System.out.println(\"Hello, World\");\n    }\n}\n```\n\n## 4.5.2 Create\
    \ a Dockerfile\n\nNext, create a Dockerfile in src/main/resources called \"src/resources/Dockerfile\"\
    \ and enter the following. Save and close\nthe file once.\n\n```docker\nFROM alpine:latest\n\
    RUN apk --update openjdk8-jre\nCOPY docker-hello-example.jar app.jar\nENTRYPOINT\
    \ [\"java\", \"-Djava.security.egd=file:/dev/random\", \"-jar\", \"app.jar\"]\n\
    ```\n\nLet us go quickly through what we did in the base Dockerfile. We derive\
    \ our image from the Alpine Linux base. Next, we installed J2SE from OpenJDK.\
    \ Next, we copy the jar generated by the build process as app.jar into the Docker\
    \ image.\nFinally, we select to run when the Docker container is running which\
    \ is to execute the app.jar.\n\n## 4.5.3 Include Gradle-Docker Plugin\n\nNext,\
    \ make the following changes into the build.gradle file to update the Gradle manifest.\n\
    \n```gradle\nmainClassName = 'com.javacodegeeks.examples.HelloWorld'\n\njar {\n\
    \  manifest {\n    'Main-Class': mainClassName\n  }\n}\n```\n\nWe set the mainClassName\
    \ to com.javacodegeeks.examples.HelloWorld and set the same attribute to be inserted\
    \ into the manifest file of the jar that will be created.\n\nNext, insert the\
    \ following changes at the very top of build.gradle file to configure and add\
    \ the Gradle plugins for Docker.\n\n```gradle\nbuildscript {\n  repositories {\n\
    \    url \"https://plugins.gradle.org/m2/\"\n  }\n\n  dependencies {\n    classpath\
    \ \"gradle.plugin.com.palantir.gradle.docker:gradle-docker:0.9.1\"\n  }\n}\n```\n\
    \n```gradle\nplugins {\n  id 'com.palantir.docker' version '0.9.1'\n  id 'com.palantir.docker-run'\
    \ version '0.9.1'\n}\n```\n\napply plugin: 'com.palantir.docker'\n\nHere we have\
    \ added the Gradle plugins called docker and docker-run provided by Palantir.\
    \ These plugins enable us\nto create Docker containers and run them using Gradle.\
    \ We added the URL to find the gradle-docker plugin (https://plugins.gradle.org/m2/).\
    \ We also added the plugins into the classpath as build dependencies.\n\n## 4.5.4\
    \ Configure the Docker Tasks in Gradle Build File\n\nNext, insert the following\
    \ changes at the bottom of build.gradle file to configure the details of the Docker\
    \ image.\n\n```gradle\ndocker {\n  name 'com.javacodgeeks.examples.docker-hello-world:1'\n\
    \  tags 'latest'\n  dockerfile 'src/main/docker/Dockerfile'\n  dependsOn tasks.jar\n\
    }\n```\n\nHere we configured the details of the docker image. We assigned the\
    \ image name com.javacodgeeks.examples/docker-hello-world with version 1. We assigned\
    \ the tag latest and gave the path to where to find the Docker file. Finally,\
    \ we made it depend on the Gradle task so that the output of the jar task will\
    \ be fixed to this.\n\nFinally, we inserted the following changes at the bottom\
    \ of build.gradle file to configure the details of the Docker container.\n\n```gradle\n\
    dockerRun {\n  name 'docker-hello-world-container'\n  image 'com.javacodgeeks.examples/docker-hello-world:1'\n\
    \  command 'java', '-Djava.security.egd=file:/dev/random', '-jar', 'app.jar'\n\
    }\n```\n\nHere we configured the details of the docker container. We assigned\
    \ the container name 'docker-hello-world-container'. We assigned it the image\
    \ from where to create the container and gave it a command to execute when running\
    \ container.\n\n# 4.5. Create Docker Container and Run it\n\nNow we are ready\
    \ to build and run this. Use Gradle to build and run this program\n\n```\n$ gradle\
    \ clean build docker dockerRun\n```\n\nYou will notice that the code was built,\
    \ java was created, Docker image and containers were created, and the container\
    \ was too. However, there is no \"Hello, World\" actually printed on the screen.\n\
    \n```\nFile Edit View Search Terminal Help\nsh-4.2$ ./gradle clean build dockerRun\n\
    STARTING a gradle Daemon (subsequent builds will be faster)\nclean\ncompileJava\n\
    processResources UP-TO-DATE\nclasses\nistartScripts\njar\ndist\ndistZip\ndockerFileZip\n\
    assemble\ncompileJava UP-TO-DATE\nprocessTestResources UP-TO-DATE\ntestClasses\
    \ UP-TO-DATE\ntest UP-TO-DATE\ncompile UP-TO-DATE\nbuild\ndocker UP-TO-DATE\n\
    docker\nSending building context to Docker daemon 245.8 kB\nStep 1 : FROM alpine\n\
    ---> Running in 8b2c5f9111\nStep 2 : apk update && apk add openjdk8-jre\n--->\
    \ Running in d6b4f717273\nStep 3 : COPY --from=build /hello-world-example.jar\
    \ /app.jar\n---> Copied 0d45368876\nStep 4 : ENTRYPOINT [\"java -Djava.security.egd=/dev/./urandom\
    \ -app.jar\"]\n---> Running in b89b1f0c206a\n79f5b335 (5 seconds ago)\nRemoving\
