    \n## 8.3 Setup DNS in Bridge Network\n\nDocker uses these 3 files within every\
    \ container to configure:\n- /etc/hostname - This file maps the container IP address\
    \ to a name.\n- /etc/hosts - This file maps the container's IP addresses to names.\n\
    - /etc/resolv.conf - This file contains the IP addresses of other servers to refer\
    \ to if the container cannot resolve a name.\n\nThese files can be set and managed\
    \ using the docker run command. The hostname for a container is set into /etc/hostname\
    \ using the --hostname option.\n\n```bash\n$ docker run -itd --name=infinite_loop_1\
    \ --hostname=container1 enhariharan/infinite-loop\n986d9b5a28349edd6d33d1c9f31599ec2b4faa7399f5b1b09c46\n\
    $ docker exec -it infinite_loop_1 cat /etc/hostname\n```\n\nThe entry of container\
    \ can be put into the /etc/hosts file of container2 using the --link option of\
    \ docker. Run one more example now, we use link infinite_loop_1 to infinite_loop_2\
    \ within container2.\n\n```bash\n$ docker run -itd --name=infinite_loop_1 --hostname=container1\
    \ enhariharan/infinite-loop\n97fe6577ee1b2bca90d4b157a299c45bc52aca555dcc6156\n\
    $ docker run -itd --name=infinite_loop_2 --hostname=container2 --link=infinite_loop_1\
    \ enhariharan/infinite-loop\n2aa6daef9b06038a2b4f9a511875abbdb8e23502ea9c1dc6\n\
    $ docker exec -it infinite_loop_2 cat /etc/hosts\n127.0.0.1 localhost\n::1 localhost\
    \ ip6-loopback\nff00:: ip6-all\nff02::2 ip6-routers\n172.18.0.3 infinite_loop_1\n\
    container2 172.18.0.4\n$ docker exec -it infinite_loop_2 ping -c 5 container1\n\
    PING container1 (172.18.0.3): 64 bytes\n64 bytes from 172.18.0.3: seq=0 ttl=64\
    \ time=0.175 ms\n64 bytes from 172.18.0.3: seq=1 ttl=64 time=0.118 ms\n64 bytes\
    \ from 172.18.0.3: seq=2 ttl=64 time=0.123 ms\n64 bytes from 172.18.0.3: seq=3\
    \ ttl=64 time=0.118 ms\n--- ping statistics ---\n5 packets transmitted, 5 received,\
    \ 0% loss\nround-trip min/avg/max = 0.115/0.129/0.175 ms\n```\n\nBut the win with\
    \ discovering containers in the bridge network stops here. To connect containers\
    \ using our IP addresses and without using the link then we need to use defined\
    \ networks networks. Let us see the basics of that.\n\n## 8.4 Setup DNS in a User\
    \ Defined Network\n\nThere are important differences between connecting containers\
    \ in user-defined networks and bridge network. One such point is that the --link\
    \ option of docker will not work in user-defined networks. Let us see how we can\
    \ get the functionality using user-defined networks. We add the containers infinite_loop_1\
    \ and infinite_loop_2 into a user-defined network called example_network and ping\
    \ infinite_loop_2 from within.\n\n```bash\n$ docker run -itd --name=infinite_loop_1\
    \ --hostname=container1 --network=example_network enhariharan/infinite-loop\n\
    d91975ae6e4bd01d9a37e73c9a34c145ed195e573f6bd99eb45dc0964\n$\n docker run -itd\
    \ --name=infinite_loop_2 --hostname=container2 --network=example_network enhariharan/infinite-loop\n\
    3b4dad71bhad7114025db7330686bc23114c670f705f2e34892c763aa7970f2b\n$\n$ docker\
    \ exec -it infinite_loop_2 ping -c 4 infinite_loop_1\nPING infinite_loop_1 (172.20.0.2):\
    \ 56 bytes\n64 bytes from 172.20.0.2: seq=0 ttl=64 time=0.111 ms\n64 bytes from\
    \ 172.20.0.2: seq=1 ttl=64 time=0.112 ms\n64 bytes from 172.20.0.2: seq=2 ttl=64\
    \ time=0.115 ms\n64 bytes from 172.20.0.2: seq=3 ttl=64 time=0.118 ms\n---\n4\
    \ packets transmitted, 4 received, 0% loss\nround-trip min/avg/max = 0.111/0.115/0.118\
    \ ms\n```\n\n## 8.5 Summary\n\nIn this post, we were introduced to the basics\
    \ of Docker networking. We learned the types of networks supported and how to\
    \ create user-defined bridge network. We also learned how to add containers into\
    \ specific networks and how the embedded DNS server provided by Docker works.\n\
    \n# Chapter 9\n\n# Docker Start Example\n\nA container, in Docker terminology,\
    \ is an instance of an image. A typical simile used for this, is the classes and\
    \ objects in Object Oriented Programming.\n\nThis example will show how to start\
    \ containers, that is, making run instances.\n\n## 9.1 Installation\n\nNote: Docker\
    \ requires a 64-bit system with a kernel version equal or higher to 3.10.\nWe\
    \ can install Docker simply via apt-get, without the need of adding any repository,\
    \ just installing the docker.io package:\n\n```bash\nsudo apt-get update\nsudo\
    \ apt-get install docker.io\n```\n\nFor more details, you can follow the Install\
    \ Docker on Ubuntu Tutorial.\n\n## 9.2 Pulling a sample image\n\nIf you have used\
    \ Docker before, you (should) already know that a container is an instance of\
    \ an image, so, first, we need one.\nThe easiest way to obtain Docker images is\
    \ from Docker Hub, pulling them. We could pull, for example, an Nginx image:\n\
    \n```bash\ndocker pull nginx\n```\n\nYou can check that you have the image on\
    \ your system executing:\n\n```bash\ndocker images\n```\n"
