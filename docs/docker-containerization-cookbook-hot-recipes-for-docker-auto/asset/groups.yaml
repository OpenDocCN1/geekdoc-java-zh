    # Preface


    Docker is the world''s leading software containerization platform. Docker containers
    wrap a piece of software in a complete filesystem that contains everything needed
    to run: code, runtime, system tools, system libraries - anything that can be installed
    on a server. This guarantees that the software will always run the same, regardless
    of its environment. (Source: https://www.docker.com/what-docker)


    Docker provides an additional layer of abstraction and automation of operating-system-level
    virtualization on Linux. Docker uses the resource isolation features of the Linux
    kernel such as cgroups and kernel namespaces, and a union-capable file system
    such as OverlayFS and others to allow independent "containers" to run within a
    single Linux instance, avoiding the overhead of starting and maintaining virtual
    machines (Source: https://en.wikipedia.org/wiki/Docker_(software)).


    In this ebook, we provide a compilation of Docker examples that will help you
    kick-start your own automation projects. We cover a wide range of topics, from
    installation and configuration, to DNS and commands. With our straightforward
    tutorials, you will be able to get your own projects up and running in minimum
    time.'
