- img_proc: true
  md: '# Docker Containerization Cookbook


    ![](img/eef4930f20bf8a25354ad13017767cce_39_0.png)


    Figure 5.1: A typical Docker workflow


    As we can see from the above workflow, there is quite some IT activity to be performed
    if Docker is used for app development at scale in an organization.


    +   - Infrastructure to host Docker containers and all the other related tools
    provided by Docker.

    - Provide compute, storage and networking for the containers as needed.

    - Application lifecycle support and touring.

    - Monitor utilization of compute, storage and networking/stop/start containers
    as needed.

    - Address scaling needs of containers. Handle orchestration of containers at enterprise
    scale.


    These issues are significant at enterprise scale. The existing solution has for
    administrators to use infrastructure-as-a-service (IaaS) like Amazon’s AWS EC2
    and handle the above issues manually or through home-built tools. However, Docker
    provides the Docker-as-a-service to address the above issues.


    # 5.2 Container as a Service (CaaS)


    So, what is CaaS? It is a cloud service model that enables users to order and
    use containerization infrastructure from a cloud provider using a pay-as-you-go
    model. Docker CaaS is an example, Amazon EC2 Container Service (ECS) by AWS is
    another'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'example.

    As a cloud service model, CaaS probably sits as a subset of IaaS in that it enables
    a container-based infrastructure for it users.

    A CaaS offering usually seeks to provide the following features to it users.


    +   * Manage containers through an API or web interface.

    * Monitor compute, storage and network resources used by the containers.

    * Provide cluster management and orchestration capabilities for containers.

    * Provide security and governance controls.

    * Ideally, be cheap so that the CaaS can be shifted across cloud providers or
    from in-premises to cloud.


    # 5.3 Docker CaaS


    Docker''s CaaS offering called Docker Datacenter packages Docker''s tools to provide
    developers and IT with a consistent infrastructure. This is a commercial offering
    aimed at enterprises and provides the following features.


    +   * Brings well known source tools under a CaaS umbrella - Docker Engine, Docker
    Compose, Docker registry, Docker Swarm.

    * Adds commercial offerings - Universal Control Pane and Trusted Registry.

    * Ability to deploy the CaaS in-premises or cloud.

    * A private trusted registry for managing images.

    * Cluster management and orchestration capabilities through Swarm and Universal
    Control Pane.

    * Tools for the application development lifecycle, continuous integration and
    deployment.

    * Provides security in the application lifecycle all the way from dev to production
    stages.


    Refer to the Docker Datacenter pages by Docker for more information about providing
    Docker as a service.


    # 5.4 Summary


    In this short, we understood the need for a ''Docker-as-a-service'' solution to
    handle containerized application development needs at scale for an organizations.
    We briefly understood the features provided by a CaaS service in general. Then
    we briefly discussed Docker''s CaaS offering called the Docker Datacenter that
    offers Docker tools as a service to developers and IT administrators.'
