  md: '# Chapter 7


    # Docker Compose example


    # 7.1 Introduction


    Docker Compose is a tool for defining and running multi-container Docker applications.
    With Compose, you define a config-uration file the set of docker containers that
    application requires an specific machine. Then, using a single command, you create
    and start all the services in a single host.


    Docker Compose is specially useful for the following use case scenarios:


    +   - Create a development environment with all the required services started
    only using your own machine. In other words, stop to prepare your development
    environment manually over and over again in your own or different machines.

    - Automate test environments with the same characteristics as the production environments
    and run integration tests.

    - Single hosts deployments- that is use a machine with different services as docker
    containers. The most recommended way to do so is using the Docker machine or Docker
    swarm because you can launch docker compose remotely from your laptop in a safe
    way without requiring SSH.


    To use Docker Compose, you just need to create configuration file called docker-compose.yml,
    which contains the specification to create and run a set of docker containers.
    Let’s try to create an example with a web application that uses a redis database
    server.'
