    #  10.3 Using filters


    The remaining interest for container listing is the filtering of the results.
    This is useful if we are dealing with several containers, and we just want information
    about some of them.


    For filtering the output, use -f (--format) as the filter. The format is the following:


    ```

    docker ps -f "key1=value" -f "key2=value2" -f "keyN=valueN"

    ```


    As you can see, we can specify as many filters as we want, but for each, we have
    to specify the filter.


    For example, we could filter by the container name:


    ```

    docker ps -a f "name=mybybox"

    ```


    Showing the output:


    | CONTAINER ID | NAMES | STATUS |

    |---|---|---|

    | 642ae1d8d63 | mybybox | Exited (0) 15 minutes ago |


    (Keeping the configuration as we saw in previous section).


    The filter also supports regular expressions, for example:


    ```

    docker ps -a f "name=.*"

    ```


    Looking for container names with an underscore, output:


    | CONTAINER ID | NAMES | STATUS |

    |---|---|---|

    | 723bc39fdd9 | jolly_bhabha | Exited (0) 15 minutes ago |

    | fe574b4fcca5 | grave_ramanujan | Exited (0) 15 minutes ago |

    | 0583be5c5598 | pedantic_hoover | Exited (0) 15 minutes ago |

    | e4ceead785b3 | cranky_murdock | Exited (0) 15 minutes ago |


    # 10.4 Summary


    In this tutorial, we have seen how to list containers created with Docker. But
    we have gone gone further than that: we have seen the options that the command
    for listing provides, make the output prettier and more suitable for our needs,
    also seeing how to save the configuration to use it as default.'
