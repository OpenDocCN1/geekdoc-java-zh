  md: '# 1.3.1 Creating a machine


    First of all, we will list the set of available docker machines with the following
    command:


    List Docker Machines


    ```

    docker-machine ls

    ```


    In case of not having any machine, we are going to create a new one as follows:


    Docker installation test


    ```

    docker-machine create --driver virtualbox default

    ```


    Notice that in order to create a docker machine, we need to specify a driver,
    which will determine if it is a virtual machine, in this case virtual box, or
    if it is a connection to docker running in an external machine.


    # 1.3.2 Creating an image


    Docker images are created in a specific docker machine. In order to define the
    docker machine that we want to use, we need to run the following command:


    Select docker machine


    ```

    eval "$(docker-machine env default)"

    ```


    In order to check this, list the available docker machines again. At this moment,
    a new machine should appear with a new IP address (192.168.99.100) and contains
    an asterisk in the ACTIVE container.


    Active Docker Machine


    | NAME | ACTIVE | DRIVER | STATE | URL | SWARM |

    |---|---|---|---|---|---|

    | default | | virtualbox | Running | tcp://192.168.99.100:2376 | |


    Docker images are binary files of runtime environments. The contents of a docker
    image are the result of executing the set of instructions that appear in a plain
    text file called Dockerfile. However, in order to avoid building docker images
    from Dockerfiles over and again, there is an online repository for docker images
    called Docker Hub.


    For example, to pull a MongoDB image, we only need to execute the docker pull
    command as follows:


    Docker pull command


    ```

    docker pull mongo

    ```


    In order to see the installed images in our docker machine, use the following
    command. Notice that a new entry appears with the Mongo image. Each image has
    a unique identifier of the docker image for our machine called IMAGE ID.


    List Docker Images


    ```

    docker images

    ```


    If you are interested to understand how to create a Dockerfile, we strongly recommend
    follow this example.


    # 1.3.3 Creating a container


    Docker containers are executions of docker images. In order to create a container
    from an image, we use the command docker run. For example:


    List Docker Images


    ```

    docker run mongo

    ```'
