    ```

    docker pull nginx

    ```


    And then we are going to run it with the following command:


    ```

    docker run -p 8080:80 -d nginx

    ```


    And, if we follow localhost:8080 in our browser, we will see that we have a dockerized
    Nginx web server!


    ![](img/eef4930f20bf8a25354ad13017767cce_22_0.png)


    Let''s explain what we have done:


    +   * With -p 8080:80, we have bound to the host''s port 8080, the container''s
    port 80.

    * With -d option, we have detached the container to run it in the background,
    receiving its id.


    With this example, you have already noticed the powerfulness of Docker.


    Note: To stop a container, we can execute the stop command followed by the container
    id:


    ```

    docker stop <container-id>

    ```


    # 2.4 Summary


    In this tutorial we have seen the installation of Docker in Ubuntu and its very
    basic configuration. Apart from that, we have also seen the basic usage of Docker,
    pulling images from the Docker Hub and creating containers from these images.'
