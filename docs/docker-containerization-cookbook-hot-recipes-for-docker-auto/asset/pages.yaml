    # Docker as a Service


    In the previous posts we learned about Docker, containers, and working with containers.
    In this post we will learn about Containers as a Service (CaaS) in general and
    how Docker realizes CaaS.


    # 5.1 Why Docker as a Service?


    Take a typical developer work-flow involving Docker. It will be typically as below.
    This is based on the reference workflow provided in the Docker docs.'
  merge: -1
