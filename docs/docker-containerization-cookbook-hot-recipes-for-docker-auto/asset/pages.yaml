  md: '# Chapter 4


    # Docker Hello World Example


    In this example we will explore different ways of running basic "Hello, World"
    containers in Docker.


    # 4.1 Introduction


    Creating a Docker Hello World container and getting it to work verifies that you
    have the Docker infrastructure set up properly in your development environment.
    We will go about this in 4 different ways:


    +   * Run Docker hello world image provided by Docker

    * Get a "Hello, world" printed from another basic Docker image

    * Write a Simple "Hello, World" Program in Java and Run it Within a Docker Container

    * Execute a "Hello, World" Program in Java Using Gradle and Docker


    You should have Docker installed already to follow the examples. Please go to
    the Docker home page to install the Docker engine before proceeding, if needed.
    On Linux, please ensure that your user name is added into the "docker" group while
    installing so that you do not invoke sudo to run the Docker client commands. You
    should also have Java and Gradle installed to try examples 3 and 4. Install your
    JRE distribution to get Java and install Gradle from gradle.org.

