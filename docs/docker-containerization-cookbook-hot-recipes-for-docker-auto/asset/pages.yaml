    # 2.2.1 Fixing "Cannot connect to the Docker" error


    Actually, it is not an error itself, but that the user is trying to execute Docker,
    with no permission to access the Docker service.


    This means that, if we try the same command with sudo permissions, we won''t get
    the error:


    ```

    sudo docker pull busybox

    ```


    You will see that the image is being downloaded properly.

    If we want to get rid of sudo permissions using Docker, we just have to add the
    user in question to the docker group, created by Docker during installation. We
    can check that, the user we are working with is not in the group:


    ```

    groups $(whoami)

    ```


    And we will see that the docker group is not in the list. To add it, we can simply
    execute:

    GG option is for secondary groups; and the -a is for appending to the existing
    ones.


    ```

    sudo usermod -G docker $(whoami) -a

    ```


    If we check again groups, we will see that the now docker group is in the list.
    But, before anything, we have to restart the service, to make the change.

    After re-logging in, we will see that we can run Docker without the need of root
    permissions:


    ```

    docker pull busybox # It works!

    ```


    # 2.3 Basic usage


    Now that we have Docker running, we will see the most basic things we can do with
    it.'
