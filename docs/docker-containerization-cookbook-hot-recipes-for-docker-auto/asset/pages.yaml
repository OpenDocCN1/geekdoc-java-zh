  md: '# 9.3.3 Mapping container ports to hosts port


    An essential option for most of the containers is the port publishing. If we are
    running a web server, as in this example, it is obviously essential.


    For this, we want to use the -p (--publish) option, which follows this format:


    ```

    docker run -p <host-port>:<container-port>

    ```


    So, if example, we want to map the port 80 of the container to the port 80 of
    the host, we would execute:


    ```

    docker run -d --name=nginx2 -p 80:80 nginx

    ```


    Now, if we follow localhost (127.0.0.1) in a browser, we can see the Nginx welcome
    page. That is, we would be accessing the web root of the web server running in
    container.


    Of course, we can use any (free) port in the host:


    ```

    docker run -d --name=nginx3 -p 8080:80 nginx

    ```


    # 9.3.4 Run a container and get the command line


    For some occasions, we just want to get the command line of a container. For this,
    we have to use two options: -i (--interactive) and -t (--tty) and also specify
    the shell:


    ```

    docker run -i -t <image> </path/to/shell

    ```


    For example:


    ```

    docker run --name=nginx4 -i -t nginx /bin/bash

    ```


    And we will run the container interactively.


    For exiting the container, we can execute exit inside it.


    We can combine both options in just one with -it:


    ```

    docker run --name=nginx5 -it nginx /bin/bash

    ```


    # 9.3.5 Specifying a username


    Exists the possibility of specifying the username the container has to be ran,
    with the -u (--user) option:


    ```

    docker run -u <username> <image>

    ```


    Applied to the previous example, for running the container not with root user,
    but with nginx:


    ```

    docker run --name=nginx6 -u nginx -it nginx /bin/bash

    ```


    # 9.4 Starting an existing container: restart


    Let''s suppose that we stop one of the containers:


    ```

    docker stop nginx1

    ```


    Now, the nginx container is stopped. If we would try to create a container with
    the same name:'
