  md: '# 6.3.3 Build with -


    This will read a Dockerfile from STDIN without context. It is commonly used to
    send a compressed file. The Supported formats are: bzip2, gzip and gz. For example:


    Docker build from the standard output


    ```

    docker build - < context.tar.gz

    ```


    # 6.4 Dockerfile location


    The dockerfile location, is by default in the root directory of the specified
    context and it is called Dockerfile. However, you can specify another one with
    the -f option, but always must be located inside the build context. For example:


    Docker build with a specific dockerfile


    ```

    docker build -f Dockerfile.debug

    ```


    # 6.5 Example


    Now, to check if an Ubuntu image with Java from a Github project used in a previous
    JavaCodes example. Run the following command:


    Docker build with a real project


    ```

    docker build -t jacavgeeks/buildsample github.com/rpau/docker-example4j

    ```


    Now, to order if the image is available, execute docker images. This shows the
    images for your docker daemon. It should show something similar to the following
    output:


    | bash-3.2 docker images | | IMAGE ID | CREATED | VIRTUAL SIZE |

    |--- | --- | --- | --- | --- |

    | REPOSITORY | TAG | | | |

