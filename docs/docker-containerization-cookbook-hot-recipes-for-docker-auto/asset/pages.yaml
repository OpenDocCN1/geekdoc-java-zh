    Figure 6.2: docker-build-alternatives


    # ### 6.3.1 Build with PATH


    Probably, you are assuming that the docker daemon is always running in your machine.
    However, when you are building images for a remote machine, this command is sending
    to the daemon a tar file with the contents of the local directory you have specified
    to proceed with the build command. For example:


    Docker build from path[source,java]


    ```

    docker build

    ```


    Sends the contents of the execution directory to the docker daemon.


    # ### 6.3.2 Build with URL


    URLs are specially designed for Git repositories. In this case, the build command
    clones the Git repository and uses the cloned repository as context. The Dockerfile
    at root of the repository is used as Dockerfile. Alternatively to http or https,
    you can specify an arbitrary Git repository by the git:// or git@ schema. For
    a GitHub repository, we can use docker build as follows:


    Docker build from git


    ```

    docker build github.com/myuser/project

    ```'
