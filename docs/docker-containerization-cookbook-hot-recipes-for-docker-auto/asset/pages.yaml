    ![](img/eef4930f20bf8a25354ad13017767cce_44_0.png)


    Figure 6.3: dockerimages


    # 6.6 Conclusion


    This tutorial explains what a docker image is and how to build it using the command
    docker build. This command requires to specify a context, which is the location
    of the files that we need to add to the image and also the Dockerfile. Finally,
    our example shows how to build an image from a Github project and to verify what
    are the available images in our docker daemon with the docker images command.


    Remember that creating docker images is extremely useful to set up an specific
    execution environment that needs to be installed in a cluster of machines. Therefore,
    it allows to avoid problems caused by differences between production and development
    environments.'
