  md: "# Chapter 8\n\n# Configuring DNS in Docker\n\n# 8.1 Introduction\n\nThis post\
    \ introduces Docker Engine's network feature in general and specifically introduces\
    \ configuring DNS in containers. This post assumes that you have the Docker Engine\
    \ installed and that you know the basics of working with containers. We will not\
    \ discuss discovery from other networks here since that needs a deeper knowledge\
    \ of Docker tools like Docker Swarm. Since these posts focus on the basics of\
    \ Docker we will focus on networking containers within the same host. So let's\
    \ get started with understanding basics of networking in Docker.\n\n# 8.2 Basics\
    \ of Networking Configurations in Docker Engine\n\nThe Docker Engine provides\
    \ 3 networks by default - bridge, host and none. The command docker network lists\
    \ all networks created by Docker. So on a default installation you will see something\
    \ like this.\n\n```\n$ docker network ls\nNETWORK ID     DRIVER    SCOPE\n3d6f5e6e2e518\
    \  bridge    local\n1e8e86864ea   host      local\nf187f168df62  none      null\n\
    ```\n\nThe bridge network is mapped to the docker0 network bridge on the Docker's\
    \ host. The ip address command can be used to check the details of.\n\n```\n$\
    \ ip address show docker0\nd6: BROADCAST,MULTICAST,LOWER_UP> mtu 1500 qdisc noqueue\
    \ state UP\n    link/ether 02:45:01:c0:ba7:ff:ff:ff:ff:ff\n    inet 172.17.0.1/16\
    \ scope global docker0\n       valid_ft preferred_ft forever\n    inet6 fe80::422e:ff00:bac7/64\
    \ scope link\n       valid_ft preferred_ft forever\n```\n\n# 8.2.1. Inspect Networks\n\
    \nEvery container created by the Docker engine is added to the default bridge\
    \ network. The command docker network inspect can be used to inspect the network\
    \ like so...\n\n```\n$ docker network inspect bridge\n[\n```"
