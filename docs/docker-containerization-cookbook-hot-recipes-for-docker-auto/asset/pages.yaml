  md: '# 2.3.1 Pulling images


    The Docker community is so big. There is a huge number of preconfigured images,
    many of them maintained by the official developers of the software in question
    (e.g. MySQL, Nginx, Jenkins, and a large extent.).


    These images can be found at Docker Hub. You don''t have to create a container
    to pull the images from, but you will need one if you want to host your images.


    We have already seen how to pull images. For these official images, we have just
    to specify the name of the repository:


    ```

    docker pull <repository>

    ```


    For images of other users, we have to specify the username:


    ```

    docker pull <username>/<repository>

    ```


    By default, the image in the repository will be pulled (you have probably already
    the "Using default tag: latest" message if you have pulled the BusyBox image).
    But we can also pull a specific image, specified by a version tag. For that, we
    just have to add the tag in after a colon:


    ```

    docker pull <username>/<repository>:<tag>

    ```


    For example:


    ```

    docker pull busybox:1.25.0

    ```


    Note: to see the images you have, you can use the images command:


    ```

    docker images

    ```


    # 2.3.2 Creating images from Dockerfiles


    Creating files known as Dockerfiles is the way of creating our custom images,
    basing on an existing one.


    It only consists on writing the steps to execute in a file.


    # 2.3.3 Creating containers


    We have seen how to pull images and create our own ones, but not how to use them.


    When we use an image, i.e., instantiate we create a container. We can have several
    containers from the same image. The concept is almost the same as we with class
    and objects in Object Oriented Programming.


    For creating containers, we use the run command. The easiest way is to execute
    it just specifying the image:


    ```

    docker run busybox

    ```


    Nothing seemed to happen. But, behind the scenes, Docker has created a container
    from the image, execute it, and then end it, as we didn''t specify nothing to
    do.


    We can execute a command inside the container:


    ```

    docker run busybox echo "Hello world!"

    ```


    Not very impressive, right? But imagine doing so with a virtual machine, and compare
    how much time takes each one.


    We can also set an interactive shell with -it option:


    ```

    docker run -it busybox

    ```


    To see a more complete example, we are going to pull the Nginx image:'
