  md: '# Chapter 1


    # Docker Tutorial for Beginners


    In this article we are going to explain the main features of Docker. We are going
    to briefly explain why containers are necessary, which are the main commands to
    use and how to use Docker in our integration tests. The following table shows
    an overview of the whole article:


    +   1.1 Why do we need Docker?


    ![](img/eef4930f20bf8a25354ad13017767cce_9_0.png)


    Figure 1.1: docker


    Docker is a tool to avoid the usual headaches of conflicts, dependencies and inconsistent
    environments, which is an important problem for distributed applications, where
    we need to install or upgrade several nodes with the same configuration.'
  merge: -1
