  md: '# Chapter 3


    # Docker Kernel Requirements


    # 3.1 Introduction


    Docker is a containerization technology that provides OS level virtualization
    to applications. It isolates processes, storage, networking, and also provide
    security to services running within it''s containers. To enable this, Docker depends
    on various features of the Linux Kernel. Let us get introduced to these Docker
    kernel requirements in this post.


    # 3.2 Docker engine dependencies from the Linux kernel


    The dependencies on the Linux kernel can be broadly categorized into 4 classes
    - resource constraining, security, networking, and storage. Resource constraining
    features allow container creators to place restrictions on container environments
    like memory usage, cpu, etc., Security features allow security policies to be
    applied on containers. Networking features allow for the SDN networking features
    provided by Docker. Storage features allow Docker to support volumes, and various
    storage backends.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '![](img/eef4930f20bf8a25354ad13017767cce_24_0.png)


    Figure 3.1: Kernel dependencies for Docker


    Let us now examine each of these dependencies in brief.


    # 3.3 Resource constraining dependencies


    # 3.3.1 3.1 Control groups a.k.a cgroups


    Control groups, or cgroups, is a kernel feature to constrain the resource usage
    of a process or a set of processes. This provides Docker with 4 main features:


    +   - Limit resources (CPU, memory, network, disk I/O, ...) to user-defined processes.

    - Prioritize resources (a set of processes will get more resources than another
    set).

    - Measure resource usage for billing purposes.

    - Control a group of processes.


    The docker run command is used to manipulate resources allocated to a container.
    For instance, docker run --shares=<value> sets the cpu share allocated to a container
    (every container gets 1024 shares by default). docker run --cpuset-cpu=<value>
    sets the CPU core on which the container would be run. Do look at this insightful
    article for some examples of manipulating cgroups settings for Docker containers.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Docker Containerization Cookbook


    # 3.3.2 Namespaces


    Namespaces is a kernel feature that provides lightweight process virtualization
    to containers. This helps Docker isolate these resources for a container - process
    IDs, hostnames, user IDs, network access, IPC and filesystems. Docker combines
    namespaces and cgroups to isolate resources for containers and manage usage constraints.
    These namespaces are used to isolate containers - Process ID (pid), Network (net),
    Mount (mnt), Hostname (uts), Shared Memory (ipc).


    +   - A pid namespace processes running within containers with sepaces isolated
    from other containers.

    - A net namespace creates separate network interfaces, IP addresses and for each
    container.

    - A mnt namespace creates isolated mounts for each container. Mount points from
    host OS may be carried into the container but any additions to it are not propagated
    back to the host.

    - An uts namespace creates containers with their own hostnames without affecting
    other containers or the rest of the system.

    - An ipc namespace creates isolated shared memory space for each container and
    prevents access between shared memory of different computers.


    # 3.4 Security dependencies


    # 3.4.1 AppArmor


    AppArmor is a Mandatory Access Control (MAC) tool to restrict programs to a limited
    set of resources. Restriction policies are set in a simple text file to administer
    store, networking, capabilities of a process. A policy can run in enforcement
    or complain mode. A policy in enforcement mode will enforce the policy and report
    violations. A policy in complain mode will not enforce restrictions but only report
    violations.


    Docker installs a default AppArmor profile - /etc/apparmor.d/docker - installation.
    This is applied to all Docker containers. You can apply a specific AppArmor profile
    to a container using the docker run -it <container-name> --security-opt=apparmor=<profile-name>.


    Read this page for details about Docker''s usage of AppArmor.


    # 3.4.2 Enhanced Linux a.k.a SELinux


    SELinux, like AppArmor, enforces MAC policies on subsystems of the kernel. When
    compared to AppArmor, SELinux allows for more elaborate multi-level security policy
    control. This is currently developed and maintained by RedHat.


    # 3.4.3 Posix capabilities a.k.a Capabilities


    Capabilities as implemented in Linux (known as Posix Capabilities) partition the
    root user''s privileges into smaller units called "capabilities". These capabilities
    are enabled/disabled as a unit and assigned to threads. A thread/process can perform
    some operation with a minimal set of capabilities without assuming super privileges.
    See man capabilities in Linux system for more details on capabilities. Docker
    uses capabilities to restrict the actual capabilities of the container while providing
    all possible features to the service within it. A root user within a container
    may not have all privileges as a root user in the host OS.


    Read this post for more exploration of Docker''s support of capabilities.


    # 3.4.4 Secure Computing Mode a.k.a seccomp


    Secure Computing Mode, also called seccomp, provides a facility to filter on the
    system calls available to a user-defined process. This is combined with other
    tools to provide a seccomp sandbox to filter a thread from all available system
    calls. When seccomp is applied to a thread, it can perform only 4 system calls
    - read(), write(), sigreturn() and exit(). The kernel will kill the process if
    it uses any other system call.


    A seccomp profile is set to a Docker container with the security-opt option of
    docker run so:'
  merge: -1
  pgno: 25
- img_proc: true
  md: '```

    $ docker run -it <container-name> --security-opt <value>

    ```


    Read this for more information about Docker''s use of seccomp.


    # 3.5 Networking dependencies


    # 3.5.1 Netfilter


    Netfilter is a framework provided by the Linux Kernel that allows network packets
    flowing through the machine to be manipulated. Features include static and stateful
    packet filtering of IPv4 and IPv6 packets, Network address translation, port address
    translation, extensible APIs for 3rd party app developers. Docker uses Netfilter
    through it''s users counterpart IPTables.


    # 3.5.2 IPTables


    iptables is the user-space utility for netfilter. It interacts with netfilter
    and allows a system administrator to define firewalls rules for packet filtering,
    network address translation (NAT), and so on. The Docker daemon appends firewall
    rules to iptables if it sees installed in the system. For example when we expose
    a container''s port to the outside world Docker adds a corresponding rule to iptables.
    To disable iptables, start Docker daemon with the option iptables set to false
    so:


    ```

    $ docker --iptables=false

    ```


    See this blog post for a few examples of how Docker uses iptables.


    # 3.5.3 Netlink


    Netlink as a tool provides a mechanism for communication between kernel and userspace
    components using a socket interface. Even userspace components can use this to
    communicate among one another. This is an alternative to ioctl and reduces dependence
    on direct system calls, ioctl calls, and such. Docker implements it''s netlink
    libraries to talk to the kernel''s netlink interface to create and connect network
    devices.


    This excellent post has details about how Docker uses Netlink.


    # 3.6 File system dependencies


    Docker supports various storage drivers with a plug-in architecture. One can choose
    a storage driver to run the Docker daemon with. However, Docker Engine can only
    support one active storage driver at a time. A change in the storage drive will
    need the Docker daemon to restart.


    # 3.6.1 Device mapper


    The devicemapper framework is provided by the kernel to map physical block devices
    as virtual devices. It provides the foundation for features such as logical volume
    management, device encryption, copy-on-write files, et... Docker uses this framework
    to support copy-on-write files in containers.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# 3.7 Other non-kernel dependencies


    # 3.7.1 LibContainer a.k.a RunC


    libcontainer (Now called opencontainers/RunC) - This is not exactly a kernel feature.
    Docker developed this as an execution engine that exposes a consistent standardized
    Go API to work with Linux namespaces, cgroups, capabilities, AppArmor, security
    profiles, network interfaces, firewalls and firewalling rules. RunC has replaced
    LXC as the default execution driver of the Docker Engine.


    # 3.7.2 LXC


    Like libcontainer, LXC provides a userspace interface for the Linux Kernel''s
    container supporting features. LXC was the initial execution engine before Docker
    moved to RunC.


    # 3.8 Summary


    In this post we were introduced to the key kernel features on which Docker depends
    and builds to enable containerization. Each of the Kernel features in itself can
    be pursued further and understood more deeply to improve container security in
    Docker. The Docker docs also contain more information about kernel level enablers.'
  merge: -1
  pgno: 27
