    # # 1.3 Understanding the commands


    There are many docker commands. In fact, if we simply run docker from our terminal,
    we can see all the available commands.


    Commands:


    | Commands | |

    | --- | --- |

    | attach | Attach to a running container |

    | build | Build an image from a Dockerfile |

    | commit | Create a new image from a container to changes |

    | cp | Copy files/folders from a container to a HOSTDIR or to STDOUT |

    | create | Create a new container |

    | diff | Inspect changes on a container''s filesystem |

    | events | Get real time events from the server |

    | exec | Run a command in a running container |

    | export | Export a container as a tar archive |

    | history | Show the history of an image |

    | import | Import the contents from a tarball to create a filesystem image |

    | info | Display system-wide information |

    | inspect | Return low information on a container or image |

    | kill | Kill a running container |

    | load | Load an image from a tar archive or STDIN |

    | login | Register or log in to a Docker registry |

    | logout | Log out from a Docker registry |

    | logs | Fetch the logs of a container |

    | pause | Pause all processes within a container |

    | port | List port mappings or a specific mapping for the CONTAINER |

    | ps | List live containers |

    | pull | Pull an image or a repository from a registry |

    | push | Push an image or a repository to a registry |

    | rename | Rename a container |

    | restart | Restart a running container |

    | rm | Remove one or more containers |

    | rmi | Remove one or more images |

    | run | Run a command in a new container |

    | save | Save an image(s) to a tar archive |

    | search | Search the Docker Hub for images |

    | start | Start one or more stopped containers |

    | stats | List a live stream of container(s) resource usage statistics |

    | stop | Stop a container |

    | tag | Tag an image into a repository |

    | top | Display the running processes within a container |

    | unpause | Unpause all processes within a container |

    | version | Show the docker version information |

    | wait | Block until a container stops, then print its exit code


    Run `docker COMMAND --help` for more information on a command.


    In this section, we will see how to manage docker machines, how to pull a docker
    image using a specific docker machine and how to create such a docker image.'
  merge: -1
