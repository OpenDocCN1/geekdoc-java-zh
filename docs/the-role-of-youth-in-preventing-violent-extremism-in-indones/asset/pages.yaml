    # 3. RESULTS AND DISCUSSION


    Peer education in one of five categories can be indicator of young educators engage
    in an educational process as the approach to preventing radicalism and discrimination
    leading to violence. Moreover the activities can be training in schools as well
    as places that connected through social media.


    Duta Damai North Sumatra made a program named Duta Damai Goes to School. They
    tried to engage with the student through peer peace campaign. Its activities packaged
    in creative media workshop that sharing peace contents as well avoid hate, speech,
    disintegration and radical leading to violent actions. Students of MAN (Madrasah
    Aliyah/Islamic Senior School) 1 made many participants of that event [16].


    It is coming from drawing that Duta Damai are the young educators realized the
    potentials of student who have creativity both offline and inline related the
    effort of preventing and countering violent extremism in particularly young people.
    Furthermore, they also have limited knowledge of the students in particularly
    broaden horizon partition when it comes to working with other groups and the program
    and their reach. However, there are also critical points namely the sustainability
    of the program and the reach of audience. Activity did not occur or gradually
    and implement in areas as many as they have reached in Indonesia. In the other
    name it did not design in comprehensive and touch this community top down based.


    **Online and media digital** are the approach that lies on the Duta Damai all
    have three basic skills namely technology, visual communication — design and blogging.
    Duta Damai ambassador was recruited in 13 provinces of Indonesia. Each Duta Damai
    has to make their own online social media which disseminating through the channels
    of twitter, Instagram, Facebook and youtube. On the Youtube channels, it is under
    the channel of Damai which is a center media. Every article or media post, it
    contains a peace content. By adding some nationalism and tolerance towards each
    post, Duta Damai tries to spread more soft approach as media literacy harmony
    and preventing violent extremism particularly targeted youth. Moreover, the predominance
    of Duta Damai is a huge number of its members, there are more 780 youths recruited
    the peace ambassador/Duta Damai''s members. It is the biggest-“manager” of BNPT
    parts.


    However, to prevent violent extremism prevails on social media, Duta Damai did
    not involve in the debate of social media spreading extremism narration. Counter
    narration runs on their own way. Furthermore, it is difficult to assess whether
    the Duta Damai''s social medias are hitting the right audiences or not. It seems
    like the social medias passively reach wider vulnerable audiences.


