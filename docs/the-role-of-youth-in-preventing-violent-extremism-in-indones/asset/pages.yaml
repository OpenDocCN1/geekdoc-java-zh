    is not mainstreaming the ideas of Duta Damai''s members.


    The identification of challenges of this community is firstly, this community
    by state therefore images from the society seeing the community related to state
    apparatus are just ordinary to extent that because every single thing made by
    state for the budgeting purposes or economic benefit, it becomes a stumbling block
    for the pro bono spirit of Duta Damai''s members who are truly voluntary for preventing
    violent extremism. Nevertheless, obstacles could be overcome by the making of
    networking with the independent community which has the same vision and spirit.


    In Indonesia context regarding the prevent action of violent extremism, it needs
    basic social trust among the grassroots to create supportive environment for both
    of civil social organizations and society. The problems are the radical groups
    streamlining the online propaganda in the nuance of pluralism and peaceful religion.
    It is supposed to make a debate in order to open the public mind; however, this
    activity rarely happened.


    # 4. CONCLUSIONS


    Based on the ideas and practices, it examines the role of youth in preventing
    violent extremism through the Duta Damai community by implementing five categories
    namely peer education, online and media digital, co-operation with stakeholders,
    providing opportunities, and education and training. Each category has been done
    by the Duta Damai through several programs that run in different areas or provinces.
    The role of Duta Damai manifested through various efforts for instance the instructor,
    blogger, speaker and so on so forth. As the biggest "manpower" of BNPT to prevent
    violent extremism in Indonesia, Duta Damai mostly targeted countered extremist
    groups on social media. However, they are not trying to get involved in debate
    with the radical groups, the common narration on their own track. One of categories
    namely providing opportunities rarely implemented by the Duta Damai particularly
    on economic empowerment. Furthermore, it shows that the lacking of systematic
    programs or plans designed by the Duta Damai in Indonesia which able to evaluate
    the output whether success or fail objectively, they are hitting the right audiences?


