    According to Davyd there are five causes of youth extremism "the first cause attributes
    to certain essential traits of age (striving to be active and overwhelmed obstacles).
    Youth increases propensity toward seeking risks, adventure, and pursuing social
    heroism. The second cause relates to the search for identity, individual''s identity
    is shaped by social concerns, ignoring of society''s norms and values. The third
    cause attributed to the authority is propensity towards gaining respect within
    a group, concern with matter of power and status, stereotypical judgements and
    assessments, and tolerance uncertainty. The fourth cause is rooted in society''s
    dominant culture, the culture of violence in society including the education environment.
    The fifth cause is from unfavorable economic and social conditions such as people''s
    dissatisfaction with their positions [4]. Davyd speaks about about psychological,
    culture, and economic dimension. However factor or brain washing (offline and
    online) the family factor are not mentioned yet. Several studies have been done
    regarding the role of youth in preventing violent extremism [5]-[13].


    Therefore to prevent violent extremism focus on religion that largest, BNPT, a
    leader in combating terrorism, created Duta Damai communities. Duta Damai consists
    of youth that must possess three basic skills blogging, visual communication design
    and information technology. BNPT established Duta Damai ambassadors in 13 provinces
    of 700 youth in total. According to the largest numbers of this community members
    named by government, It is interesting to examine how does youth contribute to
    the preventing violent extremism (PVE) and countering violent extremism (CVE)
    in Indonesia through community of Duta Damai/peace ambassadors?


    # 2. RESEARCH METHOD


