    story of Farida in Cox''s Bazar Bangladesh when she told about her neighbor. She
    wrote[17]:


    > I have never met Ahnaf, he is an educated person but didn''t get a job. For
    this reason he always gets so angry he can''t control himself and breaks things
    like furniture. A. Sometimes he becomes so angry that I see these many changes
    in his character, he seemed frustrated with every matter in society...I saw that
    he was gradually ill tempered..he became separated from us...he began associating
    with people who are extremist in every aspect of their lives..he argued that the
    followers of Islam are most victimized in the world.


    That depicted us that the extreme thought appeared as the results or accommodation
    into frustrating zone. Everything that has poverty in Bangladesh, it could not
    be treated as the local/particular phenomenon, it was a global phenomenon. As
    leader of Nahdlatul Ulama, Said Aqil stated that the causes of terrorism in Indonesia
    are poverty and inequality. Al Klier also shared the same argument, economic dimension
    as the main cause of person who became a terrorist [19]. However, the argument
    that holds assumption that poverty is the root of terrorism in Indonesia would
    face many opposite arguments that emphasize the ideology freedom related in religious
    terms as. Sidney Jones, an expert of IPAC, stated that there is no correlation
    between poverty and terrorist recruitment target [20].


    Education and training empowering the Duta Damai were the training of the utilization
    of information technology to create peace and tolerant content, combat hoax and
    raising awareness of the danger of the online media propaganda. Before members
    of Duta Damai recruited, they obtained the workshop from several stakeholders.
    However, Duta Damai''s members seldom provide the workshop for public systematically
    and gradually as the comprehensive projects to upgrade capacity of youth and public
    to deal explicitly with the violent extremist and terrorists topics. Ideally,
    prevent violent extremism or radicalization requires a better understanding and
    willingness to learn, build trust, learn and engage as well as know how to approach
    young by extremism.


    Overall, Duta Damai is implementing five categories namely peer education, online
    and media digital, co-operation with stakeholders, providing opportunities, and
    education and training. The dominant effort is on the online and media digital,
    nonetheless infrequent in providing regarding economic empowerment. That results
    based on firstly the Duta Damai''s establishment was to help BNPT countering and
    preventing online media propaganda that targets youth in the cyberspace, and secondly
    the lacking of financial support for the idea of economy as a root cause terrorism
    is not mainstreaming the ideas of Duta Damai''s members.


    The identification of challenges of this community is firstly, this community
    by state therefore images from the society seeing the community related to state
    apparatus are just ordinary to extent that because every single thing made by
    state for the budgeting purposes or economic benefit, it becomes a stumbling block
    for the pro bono spirit of Duta Damai''s members who are truly voluntary for preventing
    violent extremism. Nevertheless, obstacles could be overcome by the making of
    networking with the independent community which has the same vision and spirit.


    In Indonesia context regarding the prevent action of violent extremism, it needs
    basic social trust among the grassroots to create supportive environment for both
    of civil social organizations and society. The problems are the radical groups
    streamlining the online propaganda in the nuance of pluralism and peaceful religion.
    It is supposed to make a debate in order to open the public mind; however, this
    activity rarely happened.


    # 4. CONCLUSIONS


    Based on the ideas and practices, it examines the role of youth in preventing
    violent extremism through the Duta Damai community by implementing five categories
    namely peer education, online and media digital, co-operation with stakeholders,
    providing opportunities, and education and training. Each category has been done
    by the Duta Damai through several programs that run in different areas or provinces.
    The role of Duta Damai manifested through various efforts for instance the instructor,
    blogger, speaker and so on so forth. As the biggest "manpower" of BNPT to prevent
    violent extremism in Indonesia, Duta Damai mostly targeted countered extremist
    groups on social media. However, they are not trying to get involved in debate
    with the radical groups, the common narration on their own track. One of categories
    namely providing opportunities rarely implemented by the Duta Damai particularly
    on economic empowerment. Furthermore, it shows that the lacking of systematic
    programs or plans designed by the Duta Damai in Indonesia which able to evaluate
    the output whether success or fail objectively, they are hitting the right audiences?


