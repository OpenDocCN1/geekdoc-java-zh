    # The Role of Youth in Preventing Violent Extremism in Indonesia. A Study of Duta
    Damai


    M Z Achshin

    Universitas Brawijaya, Malang

    muhaimin.zulf@ub.ac.id.


    # ABSTRACT


    This study aimed to describe the role of youth in preventing and countering violent
    extremism in Indonesia particularly Duta Damai. Duta Damai/peace ambassador is
    youth community that was made by the National Agency for Combating Terrorism (BNPT;
    Badan Nasional Penanggulangan Terorisme). Qualitative approach with the descriptive
    research purpose became approach in this research. Moreover, this study poses
    a question how does youth contribute to the preventing violent extremism (CVE)
    in Indonesia through community of Duta Damai? Both of primary data and secondary
    data were collected by the researchers through interview and online data excavating
    Five categories of youth work against violent radicalization which was provided
    by the European Commission is using the categories in this study. The result shown
    that Duta Damai is still lacking in some points.


    **Keywords:** Duta Damai, Countering Violent Extremism, Indonesia, Preventing
    Violent Extremism,


    # 1. INTRODUCTION


    In case of Surabaya bombings on 13 May 2018, two sons of family of named Yusuf
    (aged 18) and Firman (aged 16) followed their parents'' order to attack one by
    exploding explosives. This was shocking because as they felt they had freedom
    to choose some alternatives like life. Edelman and Kuzma [1] adolescents may challenge
    family values and although parents remain some authorities”. However, Yusuf (a
    senior high student) and Firman (a junior high school student) who are in poverty
    cannot change their parents'' order and can not alter the decision to end their
    potential lives through such mission. Therefore, the youth radicalization action
    have become crucial concern in society of Indonesia today.


    Schools as the institution that affects also show vulnerable supporting system
    to the students. According to research of PPIM UIN Jakarta and UNDP Indonesia
    through the Convey project depicted that 63.07% teachers had intolerance opinions
    on the different religions implicitly, whilst 56.90% teachers had intolerance
    opinions on the different religions. That survey conducted from 6 August to 6
    September 2019 with the 2.237 sampling (male: 898 (40.21%), female 1335 (59.79%)
    in 767 cities/regencies in Indonesia using proportional probability technique
    [2]. It means the spreading of intolerance that germ of extremism and radicalism
    based on religion be disseminating in school through educational processes.


    Djafar, a researcher from Wahid institute, stated that there are several factors
    why intolerance in school in Indonesia became stronger than before. Firstly, stakeholders
    in educational system in school are still lacking vision of tolerance. Some of
    them neglected the intolerance and discrimination towards their students. Moreover,
    it can be influencing the narrow and biased interpretation of natural law on educational
    system that mentioned national education system rooted on the religion values,
    national cultures and respect of changes. The narrow interpretation on religion
    values, as if it based on only particular majority is Islam, not the universal
    values of all religion. Secondly, the difficulties of stakeholders and the lack
    between private field and the basic value that they hold as the government as
    must be advancing the tolerance, humanity and plurality principles. The absence
    of moderate religious organizations such as Nahdlatul Ulama and Muhammadiyah educated
    the students to open their mind in the modern era [3]. Mainstreaming the prevention
    of tolerance as the preventive of violent extremism in educational institution
    has been denied entirely at this time by both of state programs and civil society
    organizations?


    According to Davyd there are five causes of youth extremism "the first cause attributes
    to certain essential traits of age (striving to be active and overwhelmed obstacles).
    Youth increases propensity toward seeking risks, adventure, and pursuing social
    heroism. The second cause relates to the search for identity, individual''s identity
    is shaped by social concerns, ignoring of society''s norms and values. The third
    cause attributed to the authority is propensity towards gaining respect within
    a group, concern with matter of power and status, stereotypical judgements and
    assessments, and tolerance uncertainty. The fourth cause is rooted in society''s
    dominant culture, the culture of violence in society including the education environment.
    The fifth cause is from unfavorable economic and social conditions such as people''s
    dissatisfaction with their positions [4]. Davyd speaks about about psychological,
    culture, and economic dimension. However factor or brain washing (offline and
    online) the family factor are not mentioned yet. Several studies have been done
    regarding the role of youth in preventing violent extremism [5]-[13].


    Therefore to prevent violent extremism focus on religion that largest, BNPT, a
    leader in combating terrorism, created Duta Damai communities. Duta Damai consists
    of youth that must possess three basic skills blogging, visual communication design
    and information technology. BNPT established Duta Damai ambassadors in 13 provinces
    of 700 youth in total. According to the largest numbers of this community members
    named by government, It is interesting to examine how does youth contribute to
    the preventing violent extremism (PVE) and countering violent extremism (CVE)
    in Indonesia through community of Duta Damai/peace ambassadors?


    # 2. RESEARCH METHOD


    This research was conducted in 2019 by using qualitative approach with the descriptive
    purposes. Both primary and secondary data was collected during this research through
    interview and online data excavating. Analysis data technique using Flick [14]
    phases categorization, reduction, condensation, and interpretation. This research
    is five categories namely peer education, online campaigns and digital media,
    co-operation with other stakeholders, providing opportunities, education and training
    which had been provided by Council of Europe to examine the role of youth in preventing
    violent extremism [15].


    # 3. RESULTS AND DISCUSSION


    Peer education in one of five categories can be indicator of young educators engage
    in an educational process as the approach to preventing radicalism and discrimination
    leading to violence. Moreover the activities can be training in schools as well
    as places that connected through social media.


    Duta Damai North Sumatra made a program named Duta Damai Goes to School. They
    tried to engage with the student through peer peace campaign. Its activities packaged
    in creative media workshop that sharing peace contents as well avoid hate, speech,
    disintegration and radical leading to violent actions. Students of MAN (Madrasah
    Aliyah/Islamic Senior School) 1 made many participants of that event [16].


    It is coming from drawing that Duta Damai are the young educators realized the
    potentials of student who have creativity both offline and inline related the
    effort of preventing and countering violent extremism in particularly young people.
    Furthermore, they also have limited knowledge of the students in particularly
    broaden horizon partition when it comes to working with other groups and the program
    and their reach. However, there are also critical points namely the sustainability
    of the program and the reach of audience. Activity did not occur or gradually
    and implement in areas as many as they have reached in Indonesia. In the other
    name it did not design in comprehensive and touch this community top down based.


    **Online and media digital** are the approach that lies on the Duta Damai all
    have three basic skills namely technology, visual communication — design and blogging.
    Duta Damai ambassador was recruited in 13 provinces of Indonesia. Each Duta Damai
    has to make their own online social media which disseminating through the channels
    of twitter, Instagram, Facebook and youtube. On the Youtube channels, it is under
    the channel of Damai which is a center media. Every article or media post, it
    contains a peace content. By adding some nationalism and tolerance towards each
    post, Duta Damai tries to spread more soft approach as media literacy harmony
    and preventing violent extremism particularly targeted youth. Moreover, the predominance
    of Duta Damai is a huge number of its members, there are more 780 youths recruited
    the peace ambassador/Duta Damai''s members. It is the biggest-“manager” of BNPT
    parts.


    However, to prevent violent extremism prevails on social media, Duta Damai did
    not involve in the debate of social media spreading extremism narration. Counter
    narration runs on their own way. Furthermore, it is difficult to assess whether
    the Duta Damai''s social medias are hitting the right audiences or not. It seems
    like the social medias passively reach wider vulnerable audiences.


    **Co-operation with other stakeholders** mainly by the Duta Damai with the FKPT
    (Forum Koordinasi Pencegahan Terorisme / Terrorism Prevention Coordinating Forum).
    FKPT is a forum made by BNPT which consists of community and religion leaders,
    FKPT also established in 32 provinces of Indonesia. This stakeholder has the same
    mission with the Duta

