    和平大使（Duta Damai）专注于教育（社会和宗教）、研究、社区赋能（青少年、男性和女性）、媒体合作以及其他社会及文化活动。和平大使基金会（FKPT）还帮助和平大使作为预警系统，当极端主义思想在特定区域蔓延时发挥作用。此外，和平大使与当地警察合作，向社会强调民族主义价值观。重要的一点是宗教与其他公民社会组织（如
    Gusidrian）之间的网络建设，以传播宽容、多元主义和社会和谐。此外，主机构印尼国家反恐主义预防应对局（BNPT）寻求将预防恐怖主义行动的益处扩大到整个东盟国家国家。当这一措施付诸实施时，意味着和平大使的合作将延伸到地区级别的利益相关者和社区。


    通过为青少年提供观察生活多种和谐方案的机会，和平大使与其他信仰者进行了跨宗教对话。这种对话强调差异是不可避免的。但经济维度尚未得到和平大使的落实。和平大使尚未从减少贫困的角度触及预防恐怖主义。这是由于该组织缺乏外部资金的支持。和平大使主要依赖于主机构
    BNPT 的资金支持。


    谈到作为问题根源的财务/经济问题，孟加拉国考克斯巴扎尔 Farida 的故事证明，她提到了她的邻居。她写道[17]：


    > 我从未见过过 Ahnaf，他是一个受过教育的人但找不到工作。由于这个原因，他总是非常愤怒，无法控制自己并弄坏家具等东西。有时他变得非常愤怒，我能看到他的性格发生了许多变化，他似乎对社会的每件事都感到沮丧……我看到他逐渐变得暴躁……他与我们疏远了……他开始与生活中各方面都很极端的人接触……他辩称伊斯兰教徒是世界上受害最严重的群体。


    这向我们说明，极端思想是作为挫折区域的结果或妥协产生的。孟加拉国所有贫贫困的问题不能被视为局部/特定现象，而是一个全球性现象。作为纳哈德乌玛（Nahdlatul
    Ulama）的领导，Said Aqil 表示，印尼恐怖主义产生是贫困和不平等。Al Klier 也分享了同样的观点，经济因素是个人成为恐怖分子的主要原因[19]。然而，认为贫困是印尼恐怖主义根源的假设将面临许多反对意见，这些意见强调了与宗教术语相关的意识形态自由。IPAC
    专家 Sidney Jones 表示，贫困与恐怖分子招募目标之间没有相关性[20]。


    赋能和平大使的教育和培训包括：利用信息技术创建和平与宽容内容的培训、打击虚假新闻以及提高对网络媒体宣传危险性的意识。在和平大使成员被招募之前，他们获得了来自几个利益相关者的研讨会。然而，和平大使成员很少系统地、逐步地向公众提供研讨会，并作为提升青少年和公众显式处理暴力极端主义和恐怖分子话题的综合项目。理想情况下，防止暴力极端主义或激化需要更好的理解和学习意愿、建立信任、学习和参与，以及如何接近极端化的青少年。


    总而言，和平大使正在实施五个类别，即同伴教育、在线和媒体数字、与利益相关者合作、提供机会以及教育和培训。主要工作在在线和媒体数字领域，但在提供经济赋能方面较少。其结果是：首先，和平大使的建立是为了帮助
    BNPT 应对和防止针对网络空间青年的在线媒体宣传；其次，由于对经济作为恐怖主义根源这一理念缺乏资金支持，导致和平大使成员的理念未能成为主流。


    该社区面临的挑战首先是：该社区是由国家设立的，因此社会对与国家机构相关的社区的看法非常平淡，因为国家为了预算目的或经济利益所做的每一件事，对于真正自愿防止暴力极端主义的和平大使成员的公益精神构成了阻碍。尽管如此，可以通过与具有相同愿景和精神的独立社区建立网络来克服障碍。


    在印尼预防暴力极端主义的背景下，基层之间需要基本的社会信任，以为公民社会组织和社会创造支持性环境。问题在于，激进团体在多元主义和和平宗教的语境下优化在线宣传。这本应通过辩论来开启公众思想；然而，这种活动很少发生。


    # 4. 结论


    基于上述理念和实践，本文研究了青少年通过和平大使社区实施五个类别（即同伴教育、在线和媒体数字、与利益相关者合作、提供机会以及教育和培训）在防止暴力极端主义中的作用。每个类别已通过和平大使在不同地区或省份开展的多个项目完成。和平大使的作用通过各种努力体现，例如讲师、博主、演讲者等。作为
    BNPT 在印尼防止暴力极端主义的最大“人力”，和平大使主要针对社交媒体上的极端组织进行打击。然而，他们并没有试图与激进团体进行辩论，而是按照自己的轨道进行常见的叙述。在“提供机会”类别中，和平大使很少实施，特别是在经济赋能方面。此外，这表明印尼和平大使缺乏设计的系统计划或方案，能够客观评估输出是成功还是失败，是否击中了正确的受众？


