    # 青年在印度尼西亚预防暴力极端主义中的作用：对 Duta Damai（和平大使）的研究


    M Z Achshin

    布拉维希亚大学，马拉榜

    muhaimin.zulf@ub.ac.id.


    # 摘要


    本研究旨在描述青年在印度尼西亚预防和应对暴力极端主义中的作用，特别是 Duta Damai（和平大使）。Duta Damai/和平大使是由国家反恐主义局（BNPT）建立的青年社区。本研究采用定性研究并以描述性研究为目的。此外，本研究提出了一个问题：青年如何通过
    Duta Damai 社区贡献于印度尼西亚预防暴力极端主义（CVE）？研究人员通过访谈和在线数据挖掘收集了一级和次级数据。本研究使用了欧盟委员会提供的反对暴力激进化的青年工作五大类别。结果显示，Duta
    Damai 在某些方面仍然存在不足。


    **关键词：** Duta Damai、反暴力极端主义、印度尼西亚、预防暴力极端主义，


    # 1. 引言


    在2018年5月13日的泗水炸弹案中，一个名为 Yusuf（18岁）和 Firman（16岁）的家庭两个儿子遵循父母的指令，通过爆炸物发动了袭击。这令人震惊，因为他们认为自己有选择生命等替代方案的自由。Edelman
    和 Kuzma [1] 认为青少年可能会挑战价值观，尽管父母仍然拥有某些权威。然而，处于贫困中的 Yusuf（一名高中生）和 Firman（初中生）无法改变父母的命令，也无法改变通过此类任务结束自己生命的决定。因此，青年激进化行动已成为当今印度尼西亚社会关注的焦点。


    学校作为影响机构，其对学生的支持系统也表现出脆弱性。根据雅加达 PPIM 和印尼西亚 UNDP 通过 Convey 项目的研究显示，63.07%的教师对不同宗教持有隐性的不容忍观点，而56.90%的教师对不同宗教持有公开的不容忍观点。该调查于2019年8月6日至9月6日进行，样本量为2237人（男性898人（40.21%），女性1335人（59.79%），涵盖印度尼西亚767个城市/县，采用等比例概率技术
    [2]。这意味着基于宗教的不容忍情绪作为极端主义和激进主义的种子正通过教育过程在学校中传播。


    来自 Wahid 学院的研究员 Djafar 表示，印度尼西亚学校不容忍现象比以前更严重的几个原因。首先，学校教育系统的利益相关者缺乏宽容愿景。他们中的一些忽视了对学生的不容忍和歧视。此外，这可能会影响对教育系统中自然法的狭隘偏颇解释，即国家教育体系植根于宗教价值观、民族文化和对变化的尊重。对宗教价值观的狭隘解释似乎仅基于特定的多数派——伊斯兰教，而非所有宗教的普遍价值。其次，利益相关者的困境以及私立领域与政府持有的基本价值观之间的差距，即政府必须推进宽容、人道和多元化原则。伍力（Nahdlatul
    Ulama）和穆罕默德迪（Muhammadiyah）等温和宗教组织的缺乏使得学生在现代无法开放心胸 [3]。在教育机构中将预防不容忍作为预防暴力极端主义的主流化，目前已受到政府计划和社会组织的完全否定？


    根据 Davyd 的说法，青年极端主义有五个原因：“第一个原因归因于年龄的某些本质特征（追求活跃和克服障碍）。青少年增加了寻求风险、冒险和追求社会英雄主义的倾向。第二个原因与身份认同的寻找有关，个人的身份由社会关注塑造，忽视了社会规范和价值观。第三个原因归因于权威，倾向在群体内获得尊重，关注权力和地位问题、刻板的判断和评估以及对宽容的不确定性。第四个原因源于社会的主导文化，包括教育环境在内的社会暴力文化。第五个原因源于不利的经济和社会条件，如人们对自身地位的不满
    [4]。Davyd 讨论了心理、文化和经济维度。然而，尚未提到洗脑（线下和在线）因素以及家庭因素。关于青年在预防暴力极端主义中研究的研究已有若干开展 [5]-[13]。


    因此，为了防止重点最大的宗教暴力极端主义，反恐领域的领导者 BNPT 创建了 Duta Damai 社区。Duta Damai 由必须具备三项基本技能——博客、视觉传播设计和信息技术的青年组成。BNPT
    在13个省份建立了 Duta Damai 大使，总共700名青年。根据政府命名的该社区成员人数，有趣的是，青年如何通过 Duta Damai/和平大使社区贡献于印度尼西亚的预防暴力极端主义（PVE）和应对暴力极端主义（CVE）？


    # 2. 研究方法


    本研究于2019年进行，采用定性方法并以描述为目的。研究期间通过访谈和在线数据挖掘收集了一级和次级数据。数据分析技术采用 Flick [14] 的阶段：分类、简化、浓缩和解释。本研究涉及五个类别，即同伴教育、在线活动和数字媒体、与其他利益相关者的合作、提供机会、教育和培训，由欧洲委员会提供，以检查青年在预防暴力极端主义中的作用
    [15]。


    # 3. 结果与讨论


    同伴教育作为五个类别之一，可以是青年教育者参与教育过程的指标，作为防止激进化和导致暴力的方法。此外，活动可以在学校进行，也可以通过社交媒体连接的场所进行。


    Duta Damai 北苏答腊开展了名为“Duta Damai 校园”（Duta Damai Goes to School）的计划。他们试图通过同伴活动接触学生。其活动包装在创意媒体工作坊中，分享避免仇恨言论、分裂和导致暴力的内容。MAN（伊斯兰高级中学）1
    的学生参与了该活动 [16]。


    从推断得出，Duta Damai 的青年教育者意识到了他们在线下和在线预防和应对暴力极端主义方面的潜力。此外，他们在与其他小组合作以及计划覆盖范围方面对学生的认知仍显有限。然而，也存在一些关键点，即计划的可持续性和覆盖范围。活动并未在印度尼西亚覆盖的许多地区发生或实施。另一方面，这种社区设计并非自上而下。


    **在线和数字媒体**是 Duta Damai 采用的方法，具备三项基本技能：技术、视觉传播设计和博客。Duta Damai 大使在印度尼西亚13个省招募。每个
    Duta Damai 必须建立自己的在线社交媒体，通过 Twitter、Instagram、Facebook 和 YouTube 频道传播。在 YouTube
    频道，属于 Damai 频道，这是一个中心媒体。每篇文章或媒体帖子都包含和平内容。通过在每个帖子中加入一些民族主义和宽容，Duta Damai 试图传播更温和的方法，如媒体素养和谐以及针对青年的预防暴力极端主义。此外，Duta
    Damai 的优势在于成员人数巨大，招募了超过780名青年。它是 BNPT 部分规模最大的“经理”。


    **与其他利益相关者的合作**主要是 Duta Damai 与 FKPT（恐怖主义预防协调论坛）的合作。FKPT 是 BNPT 创建的论坛，由社区和宗教领袖组成，FKPT
    已在印度尼西亚32个省份建立。该利益相关者与 Duta 拥有相同的目标。


    '
