- img_proc: true
  md: 'When the call returns successfully, the client is sure that their request to
    create a new LC application has worked. If the server is slow to respond, it can
    result in a performance bottleneck, especially in high-scale scenarios. To cope
    with this, the client and the server may agree on a response time SLO for that
    interaction. The client can choose to wait for a response from the server for
    the agreed amount of time after which the client times out the request and considers
    it a failure. Given that the client blocks on a server response, it is not able
    to do anything while it waits, even though it may have the resources to do other
    things. Deal with this, the client can employ an asynchronous invocation.


    # Asynchronous invocation


    In an asynchronous style of invocation, the client interacts with the server in
    a manner that frees it to perform other activities. There are a few ways to do
    this:


    +   * Fire and forget: The client initiates a request with the server, but does
    not wait for a response from the server and also does not care about the outcome.
    Such a style of interaction may suffice for low-priority activities such as logging
    to a remote server, push notifications, and so on.


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_275_0.png)


    Figure 12.5 - Fire and forget'
