  md: "# Implementing Queries\n\nLet's implement the query using Spring's repository\
    \ pattern to retrieve the results for these criteria:\n\n```\nimport org.axonframework.queryhandling.QueryHandler;\n\
    public interface LCViewRepository extends JpaRepository<LCView,\nApplicationId>\
    \ {\n    Page<LCView> findByApplicantIdAndState(\n        String applicantId,\n\
    \        LCState state,\n        Pageable page);\n\n    @QueryHandler\n    default\
    \ Page<LCView> on(MyDraftLCsQuery query) {\n        return findByApplicantIdAndState(\n\
    \            query.getApplicantId(),\n            LCState.DRAFT,\n           \
    \ query.getPage());\n        );\n    }\n}\n```\n\n+   1. This is the dynamic data\
    \ finder method we will use to query the database.\n2. The @QueryHandler annotation\
    \ by Axon Framework routes query requests to the respective handler.\n3. Finally,\
    \ we invoke the finder method to return results.\n\nIn the preceding example,\
    \ we have implemented the QueryHandler method within the repository itself for\
    \ brevity. QueryHandler can be placed elsewhere as well.\n\nTo connect this to\
    \ the UI, we add a new method in BackendService (originally introduced in Chapter\
    \ 6, Implementing the User Interface - Task-Based) to invoke the query, as shown\
    \ here:\n\n```\nimport org.axonframework.queryhandling.QueryGateway;\npublic class\
    \ BackendService {\n    private final QueryGateway queryGateway;\n\n    public\
    \ List<LCView> findMyDraftLCs(String applicantId) {\n        return queryGateway.query(\n\
    \            new MyDraftLCsQuery(applicantId),\n            ResponseType.multipleInstancesOf(LCView.class)\n\
    \        ).join();\n    }\n}\n```\n\n+   1. Axon Framework provides the QueryGateway\
    \ way that allows us to invoke the query. For more details on how to use QueryGateway,\
    \ please refer to the Axon Framework documentation.\n2. We execute the query using\
