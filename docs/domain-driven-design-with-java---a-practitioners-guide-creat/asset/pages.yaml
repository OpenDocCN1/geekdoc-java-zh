  md: '# 10 The Rationale for Domain-Driven Design


    # Complexity is inevitable


    We find ourselves in the midst of the fourth industrial revolution, where the
    world is becoming more and more digital—with technology a significant driver of
    value for businesses. There have been exponential advances in computing technology,
    as illustrated by Moore''s law:


    Moore''s Law — The number of transistors on integrated circuit chips (1971-2018)


    Moore''s law describes the empirical reality that the number of transistors on
    integrated circuits doubles approximately every two years. This advancement is
    important as other aspects of technological progress—such as speed and price of
    electronic products—linked to Moore''s law.


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_32_0.png)


    Data source: Wikipedia (https://en.wikipedia.org/wiki/Transistor_count)

    The visualization is available at OurWorldData.org. Find more visualizations and
    research on this topic.


    Figure 1.6 — Moore''s law'
