  md: '# Implementing the User Interface – Task-Based


    is a strong personal preference for us. Let''s look at a quick MVVM primer, as
    implemented in

    mvmVMFX framework.


    # MVVM primer


    Modern UI frameworks adopted a declarative style to express the view. MVVM was
    designed

    to remove all GUI code (code-behind) from the view by making use of binding expressions.
    This

    allows a cleaner separation of statistic versus programming concerns. A high-level
    visual of

    this pattern is implemented shown here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_152_0.png)


    Figure 6.5 – MVVM design pattern


    The pattern comprises the following components:


    +   * Model: Responsible for housing the business logic and managing the state
    of the application.

    * View: Responsible for presenting data to the user and notifying the view-model
    about user

    interactions through the view delegate.

    * View Delegate: Responsible for keeping the view and the view-model in sync as
    changes are

    made by the user or on the view-model. It is also responsible for transmitting
    actions performed

    on on the view to the view-model.

    * View-Model: Responsible for handling user interactions on behalf of the view.
    The view-model

    interacts with the view using the observer pattern (typically, one-way or two-way
    data binding

    to make it more convenient). The view-model interacts with the model for updates
    and read

    operations.


    # Creating a new LC


    Let’s consider the example of creating a new LC. To start the creation of a new
    LC, all we need is

    the applicant to provide a friendly client reference. This is an easy-to-remember
    string of free text. A

    simple rendition of this UI is shown here:'
