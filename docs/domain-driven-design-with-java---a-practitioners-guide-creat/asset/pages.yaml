  md: '# What is DDD?


    > Note

    The use of the word domain in this context is done so in an abstract sense—not
    to be confused with the concept of the business domain introduced earlier.


    # Problem domain


    This is a term that is to capture information that simply defines the problem
    while consciously avoiding any details of the solution. It includes details such
    as why we are trying to solve the problem, what we are trying to achieve, and
    how it needs to be solved. It is important to note that the why, what, and how
    are from the perspective of the customers/stakeholders, not from the perspective
    of the engineers providing software solutions to the problem.


    Consider the example of a retail bank that already provides a checking account
    capability for its customers. They need access to more liquid funds. They need
    to encourage customers to maintain higher account balances to achieve that. They
    are looking to introduce a new product called the premium checking account with
    additional features such as higher interest rates, overdraft protection, and no-charge
    ATM access. The problem domain expressed in the form of why, what, and how is
    shown here:


    | Question | Answer |

    | Why | Bank needs access to more liquid funds |

    | What | Customers maintain higher account balances |

    | How | By introducing a new product—the premium checking account with enhanced
    features |


    Table 1.2 – Problem domain: why, what, and how


    Now that we have defined the problem and the motivations surrounding it, let''s
    examine how it can inform the solution.


    # Solution domain


    A term used to describe the environment in which the solution is developed. In
    other words, the process of translating requirements into working software (this
    includes design, development, testing, and deployment). Here, the emphasis is
    on the how of the problem being solved from a software implementation perspective.
    However, it is very difficult to arrive at a solution without having an appreciation
    of the why and the what.'
  merge: -1
