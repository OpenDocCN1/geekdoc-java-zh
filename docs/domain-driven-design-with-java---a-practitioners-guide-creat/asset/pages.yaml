  md: 'Why is DDD relevant? Why now?


    # Why is DDD relevant? Why now?


    > He who has a way to live for can bear almost any how.

    — Friedrich Nietzsche


    In a lot of ways, DDD was ahead of its time when Eric Evans introduced the concepts
    and principles back in 2003. DDD seems to have gone from strength to strength.
    In this section, we will examine why DDD is even more relevant today than it was
    when Eric Evans wrote his book on the subject back in 2003.


    # Rise of open source


    Eric Evans, during his keynote address at the Explore DDD conference in 2017,
    lamented how difficult it was to implement even the simplest concepts, such as
    immutability in value objects, when his book had released. In contrast, though,
    nowadays, it''s simply a matter of importing mature, well-documented, tested libraries,
    such Project Lombok (https://projectlombok.org/) or Immutables (https://immutables.github.io/),
    to be productive, literally in minutes. To say that open source has revolutionized
    the software industry would be an understatement! At the time of publishing, the
    Maven repository (https://mvnrepository.com/) indexes no less than a staggering
    18.3 million artifacts in a large assortment of popular categories ranging from
    databases and language runtimes to test frameworks, and many, many more, as shown
    in the following chart:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_55_0.png)


    Figure 1.24 – Open source Java over the years (source: https://mvnrepository.com/)'
  merge: -1
  pgno: 55
