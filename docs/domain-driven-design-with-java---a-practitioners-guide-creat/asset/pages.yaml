  md: '# 232 Decomposing into Finer-Grained Components


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_254_0.png)


    Figure 11.9 – Teams aligned along functional boundaries


    While there are many advantages in employing this approach, as with everything
    else, it comes with a few gotchas that you may need to be mindful of:


    +   - End-to-end testing complexity:** This is true for a lot of distributed architectures,
    the problem is exacerbated in the case of user experiences because of it being
    a visual medium. Especially if really needs components close to the end of the
    cycle, it may become harder to visualize the end-to-end until all the visual elements
    are in place. This may also be in conflict with how end users interact with a
    system as a whole. This may make end-to-end testing complex because it needs components
    from multiple teams to come together, possibly close to the end of the cycle.

    - **Deployment complexity:** In the preceding example, we split the application
    along functional boundaries. However, they have to come together as a single artifact
    at the time of deployment (this is especially true in the case of mobile applications).
    This can add a bit of deployment complexity when the complete application is assembled.
    It is important to be cognizant of the relationship patterns between teams (as
    covered in Chapter 9, Integrating with External Systems) to work through kinks.'
