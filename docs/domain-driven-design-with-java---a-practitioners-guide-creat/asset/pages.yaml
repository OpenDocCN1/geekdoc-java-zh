  md: '# Why do software projects fail?


    from focusing on the real problems, solving which provide the most value. It naturally
    follows that such teams minimize their odds of success appropriately.


    # Uncontrolled technical debt


    Financial debt is the act of borrowing money from an outside party to quickly
    finance the operations of a business—with the promise to repay the principal plus
    the agreed-upon rate of interest in a timely manner. Under the right circumstances,
    this can accelerate the growth of a business considerably while allowing the owner
    to retain ownership, reduced taxes, and lower interest rates. On the other hand,
    the inability to pay this debt on time can adversely affect credit rating, result
    in higher interest rates, cash flow difficulties, and other restrictions.


    Technical debt is what results when development teams take suboptimal actions
    to expedite the delivery of a set of features or projects. For a period of time,
    just like borrowed money allows you to do things sooner than you could otherwise,
    technical debt can result in short-term speed. In the long term, software teams
    will have to dedicate a lot more time and effort toward managing complexity as
    opposed to producing architecturally sound solutions. This can result in a vicious
    cycle, as illustrated in the following diagram:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_29_0.png)


    In a recent McKinsey survey (https://www.mckinsey.com/business-functions/mckinsey-digital/our-insights/tech-debt-reclaiming-tech-equity)
    sent to CIOs, around 60% reported that the amount of technical debt increased
    over the past 3 years. At the same time, 90% of CIO allocated less than a fifth
    of their tech debt toward paying it off. Martin Fowler explores (https://martinfowler.com/articles/is-quality-worth-cost.html#WeAreUsedToATradeOffQualityAndCost)
    the deep correlation between high software quality (or the lack thereof) and the
    ability to enhance software predictably. While carrying a certain amount of technical
    debt is inevitable and part of doing business,'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'not having a plan to systematically pay off this debt can have significantly
    detrimental effects on team productivity and the ability to deliver value.


    # Ignoring non-functional requirements


    Stakeholders often want software teams to spend the majority (if not all) of their
    time working on features that provide enhanced functionality. This is understandable
    given that features provide the highest ROI. These features are called functional
    requirements.


    Non-functional requirements (also sometimes known as cross-functional), on the
    other hand, are those aspects of the system that do not affect functionality directly
    but have a profound effect on the efficacy of those using and maintaining these
    systems. There are many kinds of NFRs. A partial list of common NFRs is depicted
    in the following figure:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_30_0.png)


    Figure 1.4 – NFRs


    Very rarely do users explicitly request NFRs, but they almost always expect these
    features to be part of any system they use. Oftimes, systems may continue to function
    without NFRs being met, but without having an adverse impact on the *quality*
    of the user experience. For example, the home page of a website that loads in
    1 second under low load and takes up of 30 seconds under higher loads may not
    be usable during times of stress. Needless to say, not treating NFRs with the
    same amount of rigor as explicit, value-adding functional features can lead to
    unusable systems and subsequently failure.


    In this section, we examined some common reasons why software projects to fail.
    Is it possible to improve our odds? Before we do that, let''s look at the nature
    of modern software systems and how we can deal with the ensuing complexity.'
  merge: -1
