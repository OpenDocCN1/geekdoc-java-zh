  md: "46 Where and Does DDD Fit?\n\n# Layer bypass\n\nWhen working with a layered\
    \ architecture, it is reasonable to start by being strict about layers only interacting\
    \ with the layers immediately beneath. As we saw earlier, rigid enforcements may\
    \ lead to an intolerable degree of accidental complexity, especially when applied\
    \ generically to a large number of use cases. In such scenarios, it may be worth\
    \ considering allowing one or more layers to be bypassed.\n\nFor example, the\
    \ controller layer may be allowed to work directly with the repository without\
    \ using the service layer. In many cases, we found it useful to use a separate\
    \ set of commands for **queries** as a starting point.\n\nThis can be slippery\
    \ slippery. To continue maintaining a level of safety, teams should consider the\
    \ use of a lightweight architecture governance tool as **ArchUnit (https://www.archunit.org/)**\
    \ to make architecture explicit and provide feedback. A simple example of how\
    \ to use ArchUnit for this purpose is shown:\n\n```\nclass LayeredArchitectureTests\
    \ {\n    @ArchTest\n    static final ArchRule layer_dependencies_are_respected_with_exception\
    \ = =\n        layeredArchitecture()\n            .layer(\"Controllers\").definedBy(\"\
    ..controller...\")\n            .layer(\"Services\").definedBy(\"..service...\"\
    )\n            .layer(\"Domain\").definedBy(\"..domain...\")\n            .layer(\"\
    Repository\").definedBy(\"..repository...\")\n            .whereLayer(\"Controllers\"\
    ).mayBeAccessedByAnyLayer()\n            .whereLayer(\"Services\").onlyBeAccessedByLayers(\"\
    Controllers\")\n            .whereLayer(\"Domain\").onlyBeAccessedByLayers(\"\
    Services\")\n            .whereLayer(\"Repository\").mayBeAccessedByLayers(\"\
    Services\", \"Controllers\")\n}\n```\n\nThe Repository layer can be accessed by\
    \ both Services and Controllers layers - effectively allowing callers to bypass\
    \ the use of Services layers.\n\n# Vertical slice architecture\n\nLayered architecture\
    \ and its variants reasonably provide good guidance on how to structure applications.\
    \ Vertical slice architecture, championed by Jimmy Boggard, recognizes that it\
    \ may be too rigid to adapt a standard layering strategy for all use cases across\
    \ an entire application.\n\nFurthermore, it is important to note that business\
    \ value can be derived by implementing any of these horizontal layers in isolation.\
    \ Doing so will only result in unusable layers and unnecessary context switching\
    \ until all these layers are connected. Therefore, vertical slice architecture\
    \ proposes minimizing coupling between slices and maximizing coupling in a slice\
    \ (**https://jimmyboggard.com/vertical-slice-architecture/**), as shown here:"
