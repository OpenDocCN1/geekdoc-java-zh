  md: 'In our current design, the implications of this change are far-reaching for
    both the provider and the consumer(s). Let''s look at some of the consequences
    in more detail:


    | Characteristic | CRUD-based | Task-based | Commentary |

    |---|---|---|---|n| Usability | | | Task-based interfaces tend to provide more
    fine-grained controls that capture intent a lot more explicitly, making them naturally
    more usable—especially in cases where the domain is complex. |

    | Reusability | | | Task-based interfaces enable more complex features to be composed
    using simpler ones, providing more flexibility to consumers. |

    | Scalability | | | Task-based interfaces have an advantage because they can provide
    the ability to independently select specific features. However, if the fine-grained
    task-based interfaces are used almost all the time in union, they may be required
    to re-examine whether the users'' intents are accurately captured. |

    | Security | | | For task-based interfaces, security is enhanced from the producer''s
    perspective enabling the application of the principle of least privilege. |

    | Latency | | | Arguably, coarse-grained CRUD interfaces enable consumers to achieve
    more in fewer interactions, providing low latency. |

    | Management Overhead | | | For the provider, fine-grained interfaces require
    a lot more work managing a larger number of interfaces. |

    | Complexity | | | Complexity of the system as a whole is proportional to the
    number of features that need to be implemented. Assuming accidental complexity
    is avoided in both cases, task-based interfaces allow spreading complexity or
    less uniformly across multiple simpler interfaces |


    In our current design, the implications of this change are far-reaching for both
    the provider and the consumer(s). Let''s look at some of the consequences in more
    detail:


    As we can see, the decision between CRUD-based and task-based interfaces is nuanced.
    We are not suggesting that you should choose one over the other. Which style you
    will use depend on your specific requirements and context. In our experience,
    task-based interfaces treat user intents as first-class citizens and perpetuate
    the spirit of DDD''s ubiquitous language very elegantly. Our preference is to
    design interfaces as task-based where possible because they result in more intuitive
    interfaces that better express the problem domain.'
