    and storage tiers and, most importantly, avoiding any business logic on the event
    bus.


    # Delivery guarantees


    Previously, because all of our components worked within a single process, the
    delivery of events to the consumers was guaranteed at least as long as the process
    stayed alive. Even if event processing failed on the consumer side, it was fairly
    straightforward to detect the failure because exception handling was fairly straightforward.


    Furthermore, rollbacks were straightforward because the production and consumption
    of events happened as part of a single database transaction. With the LC processing
    now becoming a remote component, event delivery becomes a lot more challenging.
    When it comes to message delivery semantics, there are three basic categories:


    +   - At-most-once delivery: This means that each message might be delivered once
    or not at all. Arguably, this style of delivery is the easiest to implement because
    the producer creates messages in a fire-and-forget fashion. This might be okay
    in environments where the loss of some messages is tolerated. For example, data,
    from click-stream analytics or logging can fall into this category.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# 214 Beginning the Decomposition Journey


    +   - At-least-once delivery: This means each message will be delivered more than
    once with no messages lost. Delivery of undelivered messages is retried—potentially
    infinitely. This style of delivery might be required when it is not feasible to
    lose messages, but where it would be tolerable to process the same message more
    than once. For example, analytical environments can tolerate duplicate delivery
    or have duplicate detection logic to discard processed messages.


    +   - Exactly-once delivery: This means each message is delivered exactly once
    without either being lost or lost. This style of message exactly-once semantics
    is extremely hard to implement, and a lot of solutions could approach exactly-once
    semantics with some implementation help from the consumers where duplicate messages
    are detected and discarded with the producer sticking to at-least-once delivery
    semantics.


    For domain event processing, most teams will, of course, prefer to have exactly-once
    processing semantics, given they would not want to lose any of these events. However,
    the practical difficulties guaranteeing *exactly-once* semantics, it is not unusual
    to use exactly-once processing by the consumer process in an idempotent manner
    or designing events to make it easier to detect errors.


    For example a MonetaryAmountdrawn event, which includes accountID and withdrawalAmount.
    This event could carry an additional Balance attribute that the consumer will
    know if they are out of sync with the producer when processing the withdrawal.
    Another way to do this is for the consumer to keep track of the n events processed.
    When processing an event, the consumer can check whether this event has already
    been processed. If so, they can detect it as a duplicate and simply discard it.
    Again, all the preceding methods add a level of complexity to the overall system.
    Despite all these safeguards, consumers could still find themselves out of sync
    with the system of record (the command that produces the event). If so, as a last
    resort, it might be necessary to use partial or full event replays (https://dd-book.karthiks.in/10-distributing-into-multiple-components.html#historic_replays),
    which was discussed in Chapter 7, Implementing Queries.


    # Ordering guarantees


    In an event-driven system like one we are building, it is desirable for consumers
    to receive events in a deterministic order. Not knowing the order or receiving
    it in the wrong order could result in inaccurate outcomes. Let''s consider the
    example of LCApplicationAddressChanged occurring twice in succession. If these
    changes are processed in the wrong order, we could end up displaying the wrong
    address. This does not necessarily mean events need to be ordered for all use
    cases. Let''s consider another example where we receive LCApplicationSubmittedEvent
    than once erroneously when it is not possible to submit a given LC application
    more than once. All such notifications after the first can be ignored.'
  merge: -1
