  md: '# Continuing our design journey


    In the preceding chapters, we had a solution for LC Application Processing that
    worked as an in-process component of the remainder of the overall application.
    From a logical perspective, our realization of the LC application is similar to
    the following diagram:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_224_0.png)


    Figure 10.1 – The current view of the LC application monolith


    Although the LC Application Processing component is loosely coupled with the rest
    of the application, we are still need to coordinate with several other teams to
