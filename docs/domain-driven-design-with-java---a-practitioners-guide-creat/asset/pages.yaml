  md: '# 170 Implementing Long-Running Workflows


    As you can see, there is no single component that tracks the saga life cycle.
    However, to make the auto-approval decision, each of these stateless handlers
    needs to have knowledge of the same three events occurring:


    +   * Product value is validated.

    * Product legality is validated.

    * Applicant''s creditworthiness is validated.


    Given that the event listeners are stateless, there are at least three ways to
    provide this information to them:


    +   * Each of the events carries this information in their respective payloads.

    * The event listeners query the source systems (in this case, the product- and
    applicant-bounded contexts, respectively).

    * The LC application-bounded context maintains a query model to keep track of
    these events occurring.


    Just like in the orchestrator example, when all events occur and the LC amount
    is below the specified threshold, these event listeners can issue ApproveLCApplicationCommand.


    > Note

    We will skip code examples for the choreography implementation because this is
    no different from the material we have covered previously in this and prior chapters.


    Now that we have looked at how to implement both styles of sagas, let''s examine
    some design decisions that we may need to consider when working with them.


    The pros of the choreography implementation are listed here:


    +   * Simple workflows: For simple flows, the choreography approach is relatively
    straightforward because it does not require the overhead of an additional coordinating
    component.

    * Single points of failure: From an operational perspective, there is one less-resilience
    component to worry about.


    These are the cons of the choreography implementation:


    +   * Workflow tracking: Especially with complex workflows that involve numerous
    steps and condicionals, tracking and debugging the current state of the flow may
    become challenging.

    * Cyclic dependencies: It is possible to inadvertently introduce cyclic dependencies
    among components when workflows become gnarly.'
