  md: 'Continuing our design journey 161


    As depicted in the preceding diagram, some aspects of Letter of Credit (LC) application
    processing happen outside our current bounded context, before the trade finance
    manager makes a decision to either approve or decline the application, as listed
    here:


    +   - Product value is validated.

    - Product legality is validated.

    - Applicant''s creditworthiness is validated.


    Currently, the final approval is a manual process. It is pertinent to note that
    the product value and legality checks happen as part of the work done by the product
    analyst department, whereas applicant creditworthiness checks happen in the credit
    analysis department. Both departments make use of their own systems to perform
    these functions and notify us through the respective events. An LC application
    is not ready to be approved or declined until each of these processes is completed.
    Each of these processes happens independently of the others and may take a non-deterministic
    amount of time (typically in the order of a few days). The trade finance manager
    reviews the application and makes the final decision.


    Given the volume of LC applications received, the bank is looking to introduce
    a process optimization to automatically approve applications with an amount below
    a certain threshold (USD 10,000 at time). The bank has deemed that the three preceding
    checks are sufficient and that no further intervention is required when approving
    such applications.


    From an overall system perspective, it is pertinent to note that the product analyst
    system notifies us through ProductValidatedEvent and ProductLegalityValidatedEvent,
    whereas the credit analyst system does the same through the ApplicantCreditValidated.
    Each of these events can, and indeed, happen independently of the others. For
    us to be able to auto-approve applications, our solution needs to wait for all
    of these events to occur. Once these events have occurred, we need to examine
    the outcome of these events to make a final decision.


    > Note

    In this context, we are using the term long-running to denote a complex process
    that takes several steps to complete. As these steps occur, the process transitions
    from one state to another. In other words, we are referring to a state machine.
    This is not to be confused with a long-running software process (for example,
    a complex SQL query or an image-processing routine) that is computationally intensive.


    As evident from the preceding diagram, the LC auto-approval functionality is an
    example of a long-running business process where something in our system needs
    to keep track of the fact that independent events have occurred before proceeding
    further. Such functionality can be implemented using the saga pattern. Let''s
    look at how we can do this.'
