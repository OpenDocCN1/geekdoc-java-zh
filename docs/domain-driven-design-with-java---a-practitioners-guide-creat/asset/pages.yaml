  md: 'Employ ratcheting: Having recognized an improvement area, how do you go about
    setting yourself up for improvement? Setting clear, objective goals that are measurable
    and tractable (no pun intended) for improvement is paramount to be able to subsequently
    meet them. In order to ensure that there is continual improvement, ratcheting
    is a technique that can be employed. A ratchet is a device that resembles a wrench
    but is unique in that it only turns in one direction. In this context, ratcheting
    involves the following:


    +   Set the current level as the minimum starting point.


    +   Make a small incremental improvement in a relatively small amount of time.


    +   Re-adjust the baseline to the new level attained as part of step 2.


    +   If levels descend below the baseline, stop-the-line action until baselines
    are restored.


    +   Repeat from step 1.


    Ratcheting allows teams to set incremental milestones as intermediate goals while
    moving closer to a much better place all the time.


    Adopting an attitude of constant learning and incremental improvement through
    ratcheting as opposed to one that looks to police and penalize can go a long way
    toward instituting a system that can be effective.


    # Consistency


    In the previous chapters, we have spent a lot of energy splitting our system into
    multiple, fine-grained independent components. For example, the LC application
    is submitted against the command-side component, where the status of the LC application
    is serviced by the query side. Because these are distinct components, there will
    be a time lag when the two systems are not consistent with each other. So, querying
    the status of an LC application immediately after submission may produce a stale
    response until the time the query side processes the event and updates its internal
    state. In other words, the command side and the query side are considered to be
    eventually consistent. This is one of the trade-offs we need to embrace when working
    with distributed systems.


    Eric Brewer (professor of computer science at the University of California, Berkeley)
    formalized the trade-offs in building distributed systems that can either be highly
    available or consistent in the event of a network partition, not both at the same
    time. Given the three characteristics, consistency, availability, and partition
    tolerance, the theorem postulates that distributed systems can either be highly
    available or consistent in the event of a network partition, not both at the same
    time. This means that distributed applications that are to be highly available
    will have to forgo strong consistency.


    This may make it appear that this is a deal-breaker, but in reality, most real-world
    business problems are tolerant to being eventually consistent. For example, there
    may be a requirement that an order cannot be canceled after it has shipped. In
    an eventually consistent system, there may exist a time window'
  merge: -1
  pgno: 264
- img_proc: true
  md: '(albeit small) where we may allow a shipped order to be canceled. To deal with
    such scenarios, we may need to enhance the business process to account for these
    inconsistencies. before, issuing a refund for a canceled order, we may need to
    validate that the order has not physically shipped or has returned. In the extreme
    case where we have erroneously issued a refund for a shipped order, we can request
    the customer to return it before an expiry to avoid charged. If the customer fails
    to return the order, we may charge the customer or write off the amount as loss
    business. Obviously, this adds a layer of complexity to the solution because we
    may need to account for edge conditions through a series of compensating actions.
    None of this complexity is acceptable and strong consistency is non-negotiable,
    then shipping and order cancellation functionality will have to be part of the
    bounded context.


    # Performance and scale


    In previous cases, we saw how it is possible and sometimes necessary to break
    functionality into fine-grained components that are physically separated from
    each other – requiring a network to collaborate. Let''s assume that this collaboration
    is achieved in a loosely coupled manner –justifying the need for disparate bounded
    contexts from a logical perspective.


    Performance is a very important SLO that is typically associated with most applications.
    When it comes to performance, it is essential to understand the basic terms. This
    is best illustrated using an example as shown here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_265_0.png)


    +   A - Amount of time taken for a request to reach the server

    B - Processing time on the server

    C - Amount of time taken for the response to reach the consumer

    D - Maximum advertised capacity of the network


    Figure 12.1 – The elements of network performance


    As shown here, the following terms are relevant in the performance:


    +   - **Latency:** The delay introduced by the network (A + B)

    - **Response Time:** The total time taken by the system to respond to the user
    (A + B + C)'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# Beyond Functional Requirements


    +   - **Bandwidth**: The maximum capacity of the network (D)

    - **Throughput**: The amount of data processed in a given amount of time


    The introduction of a network between two components introduces constraints in
    the form of network latency and bandwidth. Even if processing time on the server
    is theoretically reduced to zero, latency and bandwidth constraints cannot be
    avoided. This problem can only get worse as scale of network hops increases. This
    means that it is impossible for networked applications to provide the scale of
    performance as their non-networked counterparts.


    The need to support a larger number of requests can further complicate things.
    Given that Moore’s law has slowed down considerably in the last decade or so,
    it is less feasible to continue scaling by using more and more powerful machines.
    This means that beyond a point, scaling by using multiple instances, and thereby-introducing
    a reliance on the network, is inevitable.


    This makes evident that performance and scale requirements can have a significant
    impact on how we choose to distribute components. Having a clear understanding
    of performance and scale SLOs is a necessary prerequisite before attempting to
    distribute distinct components. On the flip side, if you are in a situation where
    you already have distributed components that are not meeting performance and scale,
    one option is to aggregate them back. If it is not feasible, it may be worth embracing
    alternative customer experiences along with a non-blocking, event-driven style
    of architecture to create a perception of better performance.


    # Trunk-based development


    Eric Evans, the inventor of DDD, talks about how continuous integration (CI) helps
    preserve the sanity of the domain model within a bounded context. When the same
    bounded context, it tends to fragment. Obviously, the bigger the team, the higher
    the likelihood of this occurring. Even a team as small as three or four people
    can encounter serious issues. We have also seen that beyond a point, there are
    diminishing returns if we try to break the system into extremely fine-grained
    bounded contexts.


    This makes it very important to institute a process of merging/integrating all
    code and other implementation artifacts frequently, aided by automated tests to
    flag such fragmentation. In addition, this allows the team to use a single branch
    relatlessly, each time they refine the domain model to represent the problem more
    accurately. In other words, it is critical to practise continuous integration.
    Many teams use a CI server to run tests but postpone integration until very late
    by using an excessive number of long-living branches (popularized by Gitflow:
    https://www.atian.com/git/tutorials/comparing-workflows/gitflow-workflow and merge
    requests) practicing an anti-pattern known as CI theatre (https://www.gocd.org/2017/05/16/its-is-not-ci-ci-theatre.html).


    An alternative to branch-based development is trunk-based development where each
    developer works in incremental batches and merges that into the main (also called
    trunk) branch at least once (and potentially several times) a day. The DORA team
    has published research (https://services.'
  merge: -1
  pgno: 266
- img_proc: true
  md: 'google.com/fh/files/misc/state-of-devops-2021.pdf#page=27) that shows that
    elite performers practice trunk-based development to maximize the effectiveness
    of CI practice and by extension their ability to continuously enhance their domain
    models and keep up with changing business needs.


    In an ideal world, every commit to the trunk would come finished, production-ready
    work. But it is also normal for certain pieces of work to take longer to complete.
    It may appear that there is a need to forgo trunk-based development and resort
    to branch-based development. However, there is no need to compromise the continuous
    integration flow to accommodate such eventualities. Paul Hammant (https://paulhammert.com/)
    talks about this technique called branch abstraction where the effects of unfinished
    pieces of work are hidden behind an abstraction layer. This abstraction layer
    is typically implemented by either making the new piece of functionality hidden
    from the end user or in more sophisticated cases, using feature flags (https://martinfowler.com/articles/feature-toggles.html).


    # Continuous testing


    In an ideal world, continuous integration will enable us to adopt continuous testing,
    which provides us with constant and early feedback. This is essential because
    our bounded contexts and the resulting domain models are in a constant state of
    evolution. Without the bedrock of a stable suite of tests, it can become very
    hard to sustain a reliable process. Approaches as the test pyramid, test trophy,
    honeycomb, and so on are acknowledged as reasonable ways to implement a sound
    continuous testing strategy. All of these approaches are based on the premise
    that a large number of cheap (computationally and cognitively) unit tests form
    the foundation of strategy, with the number of tests in other categories (service,
    UI, Manual, and so on) reducing as we move through the chain.


    However, we are in this new world of fine-grained components that work by communicating
    with each other. Here, there is a bigger need to verify interactions at the periphery
    in a robust manner. Unit tests that only run on mocks and stubs may not suffice
    because the feedback of collaborators may change inadvertently. This may lead
    to a situation where unit tests run successfully, but the overall functionality
    may be broken. This may cause teams to lose faith in the practice of unit testing
    as a whole and resort to using end-to-end functional tests. These types of tests
    can be extremely expensive (https://www.youtube.com/watch?v=VDFX44fZoMoC) to set
    up and maintain, especially when we are looking to automate them. Consequently,
