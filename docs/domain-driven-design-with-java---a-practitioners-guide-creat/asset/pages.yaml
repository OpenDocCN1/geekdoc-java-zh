  md: 'The early 2000s were a dynamic time in the software industry. A number of luminaries
    were exploring lightweight *agile* processes that had the effect of converting
    software engineering from a paint-by-numbers activity into first-class knowledge
    work. Agile methodologies such as Extreme Programming were natural extensions
    of arguments put forth by Jack Reeves in his 1992 C++ Journal article *What is
    Software Design*, which claimed that source code - not design or architecture
    diagrams - was the only equivalent to design specifications found in other engineering
    disciplines. The split between design and manufacturing still exists, of course,
    but with software, we don''t need for manufacturing. The compiler does it for
    us, because all that work the people do is design work, and agile processes pushed
    the new generation of software engineers into design conversations with "the business."


    The turn of the century also brought the dotcom boom (and subsequent bust) as
    user interactions shifted from desktop applications to the web, creating technical
    scaling problems that were of magnitude beyond what the industry had faced up
    to that. Distributed networks weren''t exactly new, but the ever-increasing technical
    complexity to solve problems of scale required new architectural approaches and
    created a demand for software engineering talent.


    It was in that that Eric Evans published his famous "blue book," introducing the
    concept of Domain-driven design (DDD) in 2003. It gave us a set of techniques
    that mapped the design aspects of software development the way we wrote source
    code and patterns that helped us manage technical complexity at scale


    It is precisely because DDD has aged so well that we forget how much the world
    has changed since it was published. User behavior triggered by the introduction
    of smartphones pushed organizations to externalize integration interfaces that
    had previously been hidden inside an internal network, previously accessed perhaps
    by a public website hosted in a DMZ, but not by external users. Continuous delivery
    accelerated the pace of software change and, as a consequence, the pace of the
    design process. Microservices and modern event-driven architectures created architectural
    patterns that enabled modern design activities to happen in parallel as organizations
    looked to scale the throughput of delivery. Prem and Karthik have been on the
    leading edge of many of these, which helped name and evangelize some of these
    techniques, and applying them in large organizations to modernize.


    DDD remains relevant today when Evans published his blue book because it directly
    confronts the root causes of software design is: creating a shared understanding
    of the problem and modularizing the architecture in a way that communicates understanding
    in code. Karthik and Prem share important updates on both fronts: techniques like
    Wardley mapping, EventStorming, and domain storytelling to create a shared understanding,
    and an updated view of how DDD patterns apply. This is a book full of lessons
    learned in the trenches from experienced practitioners, with practical lessons
    for all. I''ve personally sharpened my own understanding while reviewing the book,
    and I''m confident you will.


    > - Brandon Byars

    Head of Technology, Thoughtsworks

    Creator of Montebank'
