  md: '# Events as an API


    In an event-sourced system where events are persisted instead of domain state,
    it is natural for the structure of events to evolve over a period of time. Consider
    an example of BeneficiaryInformationChangedEvent, which has evolved over a period
    of time, as shown here:


    | v1.0 | v1.0 | v2.0 |

    | --- | --- | --- |

    | { UUID: String, address: String, country: String } | { UUID: String, detailed_address:
    { line1: String, line2: String, state: String, postcode: String, country: String
    } } | { UUID: String, detailed_address: { line1: String, line2: String, state:
    String, postcode: String, country: String }, taxId: String } |


    Figure 7.5 - Event evolution


    Given that the event store is immutable, it is conceivable that we may have one
    or more combinations of these event versions for a given LC. This can present
    a number of decisions we will need to make when performing an event replay:


    +   - The producer can provide the historic event as it exists in the event store
    and allow consumers to deal with older versions of the event.


    +   - The producer can upgrade older versions of events to the latest version
    before exposing them to the consumer.


    +   - Allow the consumer to specify an explicit version of the event that they
    are able to work with and upgrade to that version before exposing it to the consumer.


    +   - Migrate the events in the event store to the latest version as evolutions
    occur. This may not be feasible, given the immutable promise of events in the
    event store.


    Which approach you choose really depends on your specific context and the maturity
    of the producer/consumer ecosystem. Axon Framework makes provisions for a process
    they call event upcasting that allows events to be upgraded just in time before
    they are consumed. Please refer to the Axon Framework documentation for more details.'
