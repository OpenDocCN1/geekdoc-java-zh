  md: '# Integrating with External Systems


    > Wholeness is not achieved by cutting off a portion of one''s being, but by integration
    of the contraries.


    > Carl Jung


    So far, we have used DDD to implement a robust core for our application. However,
    most solutions (by extension-bounded contexts) usually have both upstream and
    downstream dependencies that usually change at a pace, which is different from
    these core components. To maintain both agility and enable loose coupling, it
    is important to integrate with a peripheral system in a manner that shields the
    core from everything else that surrounds it.


    In this chapter, we will look at the LC application processing solution and examine
    the means by which we can integrate with other components in the ecosystem. You
    will learn how to recognize relationship patterns between components.


    This chapter covers the following main topics:


    +   * Continuing our design journey

    * Bounded context relationships

    * Implementation patterns


    By the end of the chapter, we will round off by looking at common patterns when
    integrating with legacy applications. Let''s dive right in!'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# Continuing our design journey


    From our domain analysis in earlier chapters, we have arrived at four bounded
    contexts for our application, as depicted here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_200_0.png)


    Figure 9.1 – Relationship between bounded contexts


    So far, our focus has been on the implementation of the internals of the LC application
    bounded context. While the LC application bounded context is independent of the
    other bounded contexts, it is not completely isolated from them. For example,
    when processing an LC application, we need to perform merchandise and applicant
    applicant checks that require interactions with the compliance and customer onboarding
    bounded contexts respectively. This means that these bounded contexts have a relationship
    with each other. These relationships are driven by the nature of collaboration
    between the teams working on the respective bounded contexts. Let’s examine how
    these team dynamics influence integration mechanisms between bounded contexts
    in a way that continues to preserve their individual integrity.'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# Bounded context relationships


    We need bounded contexts to be as independent as possible. However, this does
    not mean that bounded contexts are completely isolated from each other. Bounded
    contexts need to collaborate with others to provide value. Whenever there is collaboration
    between two bounded contexts, the nature of their relationship is not only influenced
    by their individual goals and priorities but also by the prevailing organizational
    realities. In a high-performing environment, it is fairly common to have a single
    team assume ownership of a bounded context. The relationships between owning these
    bounded contexts play a significant role in influencing the integration patterns
    employed to arrive at a solution. At a high level, there are two categories of
    relationships:


    +   * Symmetric

    * Asymmetric


    Let''s look at these relationship types in more detail.


    # Symmetric relationship patterns


    Two teams, say team A and team B, can be said to have a symmetric relationship
    when they have an equal amount of influence in the decision-making process to
    arrive at a solution. Both teams are in a position to, and, indeed, do, contribute
    more or less equally toward the outcome. Here''s a diagrammatic representation:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_201_0.png)


    Figure 9.2 – Both teams have an equal say in influencing the solution


    There are three variations of symmetric relationships, each of which we will outline
    in more detail in the following subsections.'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# Partnership


    In a partnership, both teams integrate in an ad hoc manner. There are no fixed
    responsibilities assigned when needing complete integration work. Each team picks
    up as and when needed without the need for any specific ceremony or fanfare. The
    nature of the integration is usually two-way, with both teams exchanging solution
    artifacts and when needed. Such relationships require extremely high degrees of
    collaboration and understanding of the work done by both teams. Check the following:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_202_0.png)


    Figure 9.3 – There an ad hoc mutual dependency between teams in a partnership
    relationship


    # Example


    Let''s take an example a web frontend team working in close collaboration with
    an API team building the BFFs (https://philcalcado.com/2015/09/18/the_back_end_for_front_end_pattern_bff.html)
    for the frontend. The BFF team creates experiences meant to be used exclusively
    by the frontend team. To fulfill that functionality, the frontend team requires
    capabilities to be exposed by the APIs team. On the other hand, the APIs are dependent
    on the frontend team to provide advice on what to build and the order in which
    to build them. Both teams freely make use of each other''s domain models (for
    example, the same set of request and response objects that define the API) to
    implement functionality. This reuse happens mostly arbitrarily, and when API changes
    happen, both teams coordinate to keep things moving.


    # When to use


    Partnership between teams requires high levels of collaboration, trust, and understanding.
    Teams tend to use this partnership when team boundaries are informal. It also
    helps if these teams are co-located or have a significant working time overlap.


    # Potential pitfalls


    Partnership relationships between teams can lead to a situation where individual
    team responsibilities become very unclear, leading a solution towards the dreaded
    ball of mud.


    # Shared kernel


    Unlike in a partnership, when using a shared kernel, teams have a clear understanding
    of the solution artifacts and models they choose to share between themselves.
    Both teams take equal responsibility for the upkeep of these shared artifacts.'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Example


    The LC application processing and customer onboarding teams in our LC application
    may choose to use a common model to represent CustomerCreditValidated. Any enhancements
    to the event schema can affect both teams. The responsibility to make any changes
    is owned by both teams. Intentionally, these teams do not share anything beyond
    these mutually agreed-upon models and artifacts. Here''s a representation of a
    shared kernel relationship between teams:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_203_0.png)


    Figure 9.4 – Teams have an explicit understanding of shared models


    # When to use


    The shared kernel form of collaboration works well if shared artifacts are required
    to be consumed in an identical fashion in both contexts. Furthermore, it is attractive
    for multiple teams to coordinate and continue sharing, as opposed to duplicating
    identical models in both contexts.


    # Potential pitfalls


    Changes made to the shared kernel affect both bounded contexts. This means that
    any change made to the shared kernel needs to remain compatible for both teams.
    Needless to say, as the number of teams using the shared kernel increases, the
    cost of coordination goes up manifold.


    # Separate ways


    When two teams choose to not share any artifacts or models between them, they
    go their own separate ways:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_203_1.png)


    Figure 9.5 – Teams go separate ways and don''t share anything between them'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# Example


    The LC application processing and customer onboarding teams may start by sharing
    the same build/deployment scripts for their services. Over a period of time, deployment
    requirements may diverge to a point where the shared cost of maintaining these
    scripts becomes prohibitively expensive, causing these teams to fork their deployments
    to regain independence from the other team.


    # When to use


    In some cases, two teams may be unable to collaborate for a variety of reasons,
    ranging from a drift in individual team requirements to organizational politics.
    Whatever the case be, these teams may decide that the cost of collaboration is
    too high, resulting in them going their own ways.


    # Potential pitfalls


    Choosing to separate ways may result in duplicate work across affected bounded
    contexts. When working in bounded contexts that map to core subdomains, this may
    prove counterproductive, as in cases where requirements are unclear, can lead
    to inconsistent behaviors unintentionally.


    It is possible to transition from one relationship type to another over a period
    of time. In our experience, transitioning from any one of these relationships
    may not be straightforward. In cases where requirements are relatively clear at
    the outset, it may be better to prudent to start either with a loose partnership
    or go separate ways until requirements become clear. In any of these scenarios,
    it is important to keep evaluating the nature of the relationship and transition
    to a more appropriate type, based on our enhanced understanding of the requirements
    and/or the relationship itself.


    In each of the preceding characterized relationships, the teams involved have
    a more or less say in how the relationship evolved and the resulting outcomes.
    However, this may not always be the case. Let''s look at examples of where one
    team may have a clearer upper hand in terms of how the relationship evolves.


    # Asymmetric relationship patterns


    Two teams can be said to have an asymmetric relationship when one of the teams
    has a stronger influence in the decision-making process to arrive at a solution.
    In other words, there is a clear customer-supplier (or upstream-downstream) relationship
    where either the customer or the supplier plays a dominant role that affects solution
    design approaches. It is also likely that the customer and the supplier do not
    share common goals. Here is a representation of an asymmetric relationship between
    customer and supplier:'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# Bounded context relationships 183


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_205_0.png)


    Figure 9.6 – One of the teams has a dominant say in influencing the solution


    There are least three solution patterns when teams are in an asymmetric relationship,
    each of which we will outline in more detail in the following subsections.


    # ## Conformist (CF)


    It is not unusual for the side playing the supplier role to have a dominant say
    in how the relationship with one or more customers is implemented. Furthermore,
    the customer may simply choose to conform to the supplier-provided solution as,
    making it an integral part of their own solution. In other words, the supplier
    provides a set of models and the customer uses those same models to build their
    solution. In this case, the customer is considered to be a conformist:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_205_1.png)


    Figure 9.7 – The customer accepts dependency on the supplier model


    # ## Example


    When building a solution to validate the United States postal addresses of LC
    applicants, we chose to conform to the USPS Web Tools address validation API schema
    (https://www.usps.com/business/web-tools-apis/). Given that the business started
    with just US-based applicants, this made sense. This means that any references
    to the address model in our bounded contexts mimic the schema prescribed by the
    USPS. Furthermore it means that we will need to keep up with changes that occur
    in the USPS API as and when they occur (regardless of whether those changes are
    needed for our own functionality).'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# When to use


    Being a conformist is not necessarily a negative thing. The supplier’s models
    may be a well-accepted industry standard, or they may simply be good enough for
    our needs. It may also be that the team may not have the necessary skills, motivation,
    or immediate need to do something different from what the supplier has provided.
    This approach also enables teams to make quick progress, leveraging work mostly
    done by experts.


    # Potential pitfalls


    An overuse of the conformist pattern may dilute the ubiquitous language of our
    own bounded contexts, resulting in a situation where there is no clear separation
    between the supplier and customer concepts. It may also be that concepts that
    are core to the supplier''s context leak into ours, despite those concepts carrying
    little to no meaning in our context. This may result in these bounded contexts
    being very tightly coupled with each other. And if a need arises to switch to
    another supplier or support multiple suppliers, the cost of change may be prohibitively
    expensive.


    # Anti-Corruption Layer


    There may be scenarios where a customer may need to collaborate with a supplier
    but may want to shield themselves from the supplier’s ubiquitous language and
    models. In such cases, it may be prudent to redefine these conflicting models
    in the customer''s own ubiquitous language using a translation layer at the time
    of integration, also known as an Anti-Corruption Layer (ACL). See the following
    figure:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_206_0.png)


    Figure 9.8 – The customer wants to protect themselves from supplier models'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# Example


    In the address validation example referenced in the Conformist (CF) section, the
    LC application processing team may need to support Canadian applicants as well.
    In such a case, being a conformist to a system that only US addresses may be restrictive
    and confusing. For example, the US state is analogous to a province in Canada.
    Similarly, a ZIP code in the US is called a postal code in Canada. In addition,
    ZIP codes are numeric whereas Canadian postal codes are alphanumeric. Most importantly,
    we currently have no notion of a country in our address model, but now we will
    need to introduce this concept to differentiate addresses within the respective
    countries. Let''s look at the address models for the respective countries:


    # Address


    | USPS | LC Application | Canada Post |

    | :--- | :--- | :--- |

    | { \nline1: String,\nline2: String,\nstate: String,\nzip: number,\nzip: number\n}
    | { \nline1: String,\nline2: String,\nregion: String,\npostalcode: String,\ncountry:
    String\n} | { \nline1: String,\nline2: String,\nprovince: String,\npostalCode:
    String\n} |


    Figure 9.9 – The address models of different countries


    While we initially conformed to the USPS model, we have evolved to support more
    countries. For example, region is used to represent the concept of state/province.
    Also, we have introduced the country value object, which was missing earlier.


    # When to use


    ACLs come in handy when the customer models are part of a core domain. The ACL
    shields the customer from changes in the supplier’s models and can help produce
    more loosely coupled integrations. It may also be necessary when we are looking
    to integrate similar concepts from multiple suppliers.'
  merge: -1
  pgno: 207
- img_proc: true
  md: "# Potential pitfalls\n\nUsing ACL may be tempting in a lot of cases. However,\
    \ it is less beneficial when the concepts being integrated don't often change\
    \ or are defined by a well-known authority. Using an ACL with a custom language\
    \ may only cause more confusion. Creating an ACL usually requires additional translations\
    \ and may increase the overall complexity of the customer's bounded context and\
    \ may be considered premature optimization.\n\n# Open host service\n\nUnlike the\
    \ conformist and the ACL, where customers do not have a formal means to interface\
    \ with the supplier, with the Open Host Service (OHS), the supplier defines a\
    \ clear interface to interact with its customers. This interface may be made available\
    \ in the form of a well-known published language (for example, a REST interface\
    \ or a client SDK):\n\n![](img/6869d38c83b04ca7904abbd9d2e1f6d5_208_0.png)\n\n\
    # Example\n\nThe LC application processing bounded context can expose an HTTP\
    \ interface for each of its commands, as shown here:\n\n```\n# Start a new LC\
    \ application\ncurl POST /applications/start - \\\\\n  -d '{\"account-id\": \"\
    82d2dfe\",\"clientReference\": \"Test LC\"}' \\\\\n  -H 'content-type:application/vnd.lc-application.v2+json'\n\
    \n# Change the amount on an existing application\ncurl POST /applications/ac130002/change-amount\
    \ - \\\\\n  -d '{\"amount\": 100,\"currency\": \"USD\"}' \\\\\n  -H 'content-type:application/vnd.lc-application.v2+json'\n\
    \n# Other commands omitted for brevity\n```\n\nAs addition to the HTTP interface\
    \ shown here, we can even provide a client SDK in some of the more popular languages\
    \ used by our customers. This helps hide more implementation details such as the\
    \ MIME type and version from customers."
  merge: -1
  pgno: 208
- img_proc: true
  md: '# When to use


    When the supplier wants to hide its internal models (ubiquitous language), making
    an OHS enables the supplier to evolve while providing a stable interface to its
    customers. In a sense, the OHS pattern is a reversal of the ACL pattern – instead
    of the customer, the supplier implements the translation of its internal model.
    Also, the supplier can provide an OHS when it is interested in providing a richer
    user experience for its customers.


    # Potential pitfalls


    Suppliers may have good intentions by providing an OHS for its customers, it may
    result in increased implementation complexity (for example, there may be a need
    to support multiple versions of an API, or client SDKs in multiple languages).
    If the OHS does not take into account the common usage patterns of its customers,
    it may result in poor customer usability and also in degraded performance for
    the supplier.


    It is important to note that the conformist and the ACL are patterns that customers
    implement, whereas the OHS is a supplier-side pattern. For example, the following
    scenario where the supplier provides an OHS to one customer who is a conformist
    and another who has an ACL can be true, as depicted here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_209_0.png)


    Figure 9.11 – Asymmetric relationships with multiple customers'
  merge: -1
  pgno: 209
- img_proc: true
  md: 'Now that we have seen the various ways in which bounded contexts integrate
    with each other, here is one possible implementation for our LC application, depicted
    in the form of a context map:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_210_0.png)


    Figure 9.12 - A simplified context map for the LC application


    So, far we have examined the various ways in inter-team dynamics influence integration
    mechanisms. While having clarity at the conceptual level helps, let’s see how
    these relationships manifest themselves at the implementation level.


    # # Implementation patterns


    We have looked at integration between bounded contexts at a design level, but
    these concepts need to be translated into code. There are three broad categories
    that can be employed when integrating two bounded contexts:


    +   - Data-based

    - Code-based

    - API-based


    Let’s look at each method in more detail now.


    # # Data-based


    In this style of integration, the bounded contexts in question share data with
    each other. If the relationship is symmetric, the teams owning these bounded contexts
    may choose to share entire databases with access to read, write, and change underlying
    structures. Conversely, in an asymmetric relationship, the supplier may constrain
    the scope of access, based on the type of relationship.


    # # Shared database


    The simplest form of data integration is the use of a shared database. In this
    style of integration, participating bounded contexts have unrestricted access
    to the schemas and the underlying data, as shown here:'
  merge: -1
  pgno: 210
- img_proc: true
  md: 'Implementation patterns 189


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_211_0.png)


    # When to use


    The shared database presents a very low barrier to entry for teams looking to
    quickly enable new

    or or enhance existing functionality by providing ready access to data for read
    and/or write use cases.

    More importantly, it also allows the use of local database transactions, which
    usually provides strong

    consistency, lower complexity, and better performance (especially when working
    with relational databases).


    # Potential pitfalls


    However, this symmetric integration style where multiple teams have shared ownership
    is usually

    frowned upon because it often leads to a situation where there is no clear ownership.
    Furthermore,

    the shared databases can become a source of tough tight coupling, accelerating
    the path toward the dreaded

    big ball of mud. Additionally, users of the shared database can suffer from the
    noisy neighbor effect

    where one co-tenant monopolizing resources adversely affects all other tenants.
    For these reasons,

    teams will be well advised to choose this style of integration sparingly.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Replicated data


    In the case of asymmetric relationships, suppliers may be unwilling to provide
    direct access to their data. However, they may choose to integrate with customers
    using a mechanism based on data sharing. An alternate form of integration is to
    provide a copy of the data required by consumers. There are many variations on
    how this can be implemented; we depict the most common ways here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_212_0.png)


    Figure 9.14 - Integration using data replication


    +   - **Database views**: In this form, the consumer gets or is provided access
    to a subset of data using query-based or materialized views. In either case, the
    customer usually has read-only access to the data, and both supplier and customer
    continue to share the same physical resources (usually the database engine).


    +   - **Full replica**: In this form, the customer gets access to a read replica
    of the supplier''s entire database, usually on a physically disparate infrastructure.


    +   - **Partial read replica**: In this form, the customer gets access to a read
    replica of a subset of the supplier''s database, again on a physically disparate
    infrastructure.


    # When to use


    This style of integration may be required when there is an asymmetric relationship
    between the supplier and the customer. Like the shared data, this integration
    style requires less upfront effort to integrate. This is also apt when suppliers
    intend to provide read-only access to a subset of the data. It may also suffice
    to use data replication when customers are only required to read a subset of the
    supplier''s data.


    # Potential pitfalls


    If we choose to use database views, we may continue to suffer from the noisy neighbor
    effect. On the other hand, if we choose to create physically disparate replicas,
    we will need to incur the cost of additional operational complexity. More importantly,
    the customers remain tightly coupled to the supplier''s domain models and ubiquitous
    language.


    Next, let''s look at some ways to make the most of data-based integrations.'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# Increasing effectiveness


    When sharing data, the schema (the structure of the database) acts as a means
    to enforce contracts, especially when using databases that require specifying
    a formal structure (for example, relational databases). When multiple parties
    are involved, managing the schema can become a challenge.


    To mitigate undesirable changes, teams sharing data may want to consider the use
    of a schema migration tool. Relational databases work well with tools such as
    Liquibase (https://www.liquibase.org/) or Flyway (https://://flywaydb.org/). When
    working with databases that do not formally enforce a schema, it may be best to
    avoid employing this style of integration, especially when working in symmetric
    relationships where ownership is unclear.


    In any case, if one of the shared data styles of integration is unavoidable, teams
    may want to strongly consider one or more of the aforementioned techniques in
    refactoring databases to make it more manageable.


    # Code-based


    In this style of integration, teams coordinate by sharing code artifacts, either
    directly in the form of source code and/or binaries. At a high level, there are
    two forms:


    +   - Sharing source code

    - Sharing binaries


    We will describe each of these code


    # Sharing source code


    A fairly common practice within organizations is to share source code with the
    objective of promoting reuse and standardization. This may include utilities (such
    as logging and authentication), build/deployment scripts, and data transfer objects
    – in other words, any piece of source code where the cost of duplication is seen
    to be higher than reuse.


    # When to use


    Depending on the relationship type (symmetric/asymmetric), teams sharing code
    may have varying levels of influence on how the shared artifacts evolve. This
    works well in a symmetric relationship, where both teams are empowered to make
    changes with each other. Similarly, in an asymmetric relationship, the supplier
    may accept changes from customers, while retaining ownership and control of the
    shared artifacts. This also tends to work well in the case of non-core, infrequently
    changing code artifacts. Sharing source code also enables higher levels of transparency
    and visibility for the internals of the shared artifacts (a case in point is open
    source software).'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Integrating with External Systems


    # Potential pitfalls


    Sharing code artifacts means that individuals take on the responsibility to make
    sure that the process of converting source code into binary executables is uniform
    and compatible with the requirements of all parties. This may include code conventions,
    static quality checks, tests (the presence or lack thereof), compilation/build
    flags, and versioning. When a relatively large number of teams are involved, maintaining
    this form of compatibility may become burdensome.


    # Sharing binary artifacts


    Another relatively common practice is to share artifacts at the binary level.
    In this scenario, the consumers or may not have direct access to source code artifacts.
    Examples include third-party libraries, client SDKs, and API documentation. This
    form of integration is fairly common when the relationship between the coordinating
    parties is asymmetric. The supplier of the library has clear ownership of maintaining
    the life cycle of the shared artifacts.


    # When to use


    Sharing just binary artifacts may be necessary when the supplier is unable/unwilling
    to share source artifacts, possibly because they may be proprietary and/or of
    the supplier''s intellectual property. Because the supplier takes ownership of
    the binary process, it boosts the supplier to produce artifacts that are compatible
    with most potential consumers. Hence, this works well when the supplier is willing
    to do. On the other hand, it means that the customer places high levels of trust
    (https://www.thoughtworks.com/en-us/insights/podcasts/podcasts/securing-software-supply-chain)
    in the supplier''s software supply chain (https://blog.sonatype.com/software-supply-chain-a-definition-and-introductory-guide/)
    when producing these artifacts.


    # Potential pitfalls


    Integration through the use of binary artifact sharing reduces the visibility
    of the build process of the shared artifacts. If consumers rely on slow-moving
    suppliers, this can become untenable. For example, if a critical security bug
    is discovered in the shared binary, the consumer is solely reliant on the supplier
    to remediate it. This can be a high risk if dependencies are critical, business-differentiating
    aspects of the solution (especially in the core subdomain). This risk can be exacerbated
    by the use of appropriate ACLs and/or Service-Level Agreements (SLAs).


    # Increasing effectiveness


    When sharing code artifacts, it becomes a lot more important to be explicit in
    how changes are made while maintaining high levels of quality—especially when
    multiple teams are involved. Let''s examine some of these techniques in more detail:


    +   Static analysis: This can be as simple as adhering to a set of coding standards
    using a tool such as Checkstyle. More importantly, these tools can be used to
    conform to a set of naming'
  merge: -1
  pgno: 214
- img_proc: true
  md: 'conventions to allow the firmer use of the ubiquitous language throughout the
    code base. In addition, tools such as SpotBugs and PMD/CPD can be used to statically
    analyze the code for the presence of bugs and duplicate code.


    +   - **Code architecture**: Static inspection tools are effective at operating
    at the level of a single compilation unit, runtime inspection can take this level
    further to identify package cycles, dependency checks, inheritance trees, and
    so on to lighten architecture governance. The use of tools such as JDepend and
    ArchUnit can help here.


    +   - **Unit tests**: When working with shared code bases, team members are looking
    to make changes safely and reliably. The presence of a comprehensive suite of
    fast-running unit tests can go a long way toward increasing confidence. We strongly
    recommend employing test-driven design to further maximize creating a code base
    that is well designed and enables easier refactoring.


    +   - **Code reviews**: While automation can go a long way, augmenting the process
    where a human reviews changes can be highly effective for multiple reasons. This
    can take the form of offline reviews (using pull requests) or active peer reviews
    (using paired programming). All of these techniques ensure collective understanding,
    thereby reducing risk when changes are made.


    +   - **Documentation**: Needless to say, well-structured documentation can be
    invaluable when making contributions and consuming binary code artifacts. Teams
    will be well advised to proliferate the use of the ubiquitous language by striving
    to write self-documenting code throughout to maximize the derived benefits.


    +   - **Dependency management**: When sharing binary code artifacts, managing
    dependencies can become fairly complicated due to having too many dependencies,
    long dependency chains, conflicting/cyclic dependencies, and so on. Teams should
    strive to reduce afferent (incoming) coupling as much as possible to mitigate
    the problems described previously.


    +   - **Versioning**: In addition to minimizing the amount of afferent coupling,
    using an explicit versioning strategy can go a long way toward making dependency
    management easier. We strongly recommend considering the use of a technique such
    as semantic versioning for shared code artifacts.


    # IPC-based


    In this style of integration, the bounded contexts exchange messages using some
    form of Inter-Process Communication (IPC) to interact with each other. This can
    take the form of synchronous or asynchronous communication.'
  merge: -1
