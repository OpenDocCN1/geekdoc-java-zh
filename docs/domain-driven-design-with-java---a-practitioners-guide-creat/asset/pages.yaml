  md: '# Introducing EventStorming


    In the previous section, we gained a high-level understanding of the LC issuance
    process. To be able to build a real-world application, it helps to use a method
    that delves into the next level of detail. EventStorming, originally conceived
    by Alberto Brandalini, is one such method for the collaborative exploration of
    complex domains.


    In this method, you simply start by listing all the events that are significant
    to a business domain in roughly chronological order on a wall or whiteboard, using
    a bunch of colored sticky notes. Each of the note types (denoted by different
    colors) serves a specific purpose, as outlined here:


    +   **Domain event**: An event that is significant to a business process – expressed
    in the past tense.

    * **Command**: An action or an activity that may result in one or more domain
    events occurring. This is either user-initiated or system-initiated, in response
    to a domain event.

    * **User**: A person who performs a business action/activity.

    * **Policy**: A set of business invariants (rules) that need to be adhered to
    for an action/activity to be successfully performed.

    * **Query/read model**: A piece of information required to perform an action/activity.

    * **External system**: A system significant to the business process but out of
    scope in the current context.

    * **Hotspot**: A point of contention within the system that is likely confusing/or
    puzzling beyond a small subsection of the team.

    * **Aggregate**: An object graph whose state changes consistently and atomically.
    This is consistent with the definition of aggregates in *Chapter 2, Where and
    How Does DDD Fit?*


    The depiction of the stickers for our EventStorming workshop is shown here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_106_0.png)'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# Why Domain Events?


