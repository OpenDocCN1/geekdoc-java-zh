  md: '# Architecture styles 43


    A visual representation of onion architecture is shown here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_65_0.png)


    Figure 2.4 - Onion architecture


    Yet another variation of layered architecture, popularized by Robert C. Martin
    (known endearingly as Uncle Bob), is clean architecture. This is based on adhering
    to the SOLID principles (https://blog.cleancoder.com/uncle-bob/2020/10/18/Solid-Relevance.html),
    also conceived by him. The fundamental message here here (just like the case of
    hexagonal and onion architecture) is to avoid dependencies between the core –
    the one that houses business logic – and other layers that to be volatile (as
    frameworks, third-party libraries. UIs, and databases).


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_65_1.png)


    Figure 2.5 - Clean architecture'
