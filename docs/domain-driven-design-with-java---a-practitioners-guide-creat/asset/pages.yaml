    # The business model canvas


    As we have mentioned several times, it is important to make sure that we are solving
    the right problem before attempting to solve it. The business model canvas, originally
    conceived by Swiss consultant Alexander Osterwalder as part of his PhD thesis,
    is a quick and easy way to establish that we are solving a valuable problem in
    a single visual that captures nine elements of your business:


    +   * Value propositions: What do you do?

    * Key activities: How do you do it?

    * Key resources: What do you need?

    * Key partners: Who will help you?

    * Cost structure: What will it cost?

    * Revenue streams: How much will you make?

    * Customer segments: Who are you creating value for?

    * Customer relationships: Who do you interact with?

    * Channels: How do you reach your customers?'
