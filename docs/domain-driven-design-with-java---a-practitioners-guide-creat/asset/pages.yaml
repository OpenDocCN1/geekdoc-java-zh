  md: '# Processing guarantees


    When an event is processed by the query side component, as shown here, the following
    steps occur:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_239_0.png)


    Figure 10.8 – Event processing failure scenarios


    +   1. The event is consumed (either through a push or a pull) from the Event
    Bus instance.

    2. Transformation logic is applied to the payload of the event.

    3. The transformed payload is saved in the query side store.


    Each of these steps can encounter failures. Irrespective of the cause of failure,
    the event should be durable (as discussed earlier) that it can be processed later
    when the issue is fixed. These errors can be broadly segregated into four categories:


    | Error case | Example | Remediation |

    |---|---|---|

    | Transient | A network blip, resulting in temporary connectivity issues to either
    the event bus or the query store. | A finite number of retries, potentially with
    a backoff strategy, before giving up with a fatal error. |

    | Configuration | Event bus or database URL misconfiguration. | Manual intervention
    with updated configuration and/or restart. |

    | Code logic | Implementation bugs in the transformation logic. | Manual intervention
    with updated logic and redeployment. |

    | Data | Unexpected or erroneous data in the event payload. | Manual intervention
    that requires segregating spurious data (for example, by automatically moving
    problematic events to a dead-letter queue) and/or fixing code logic. |'
  merge: -1
