- img_proc: true
  md: '# Synchronous messaging


    Synchronous messaging is a style of communication where the sender of the request
    waits for a response from the receiver, which implies that the sender and the
    receiver need to be active for this style to work. Usually, this form of communication
    is point to point. HTTP is one of the commonly used protocols for this style of
    communication. A visual representation of this form of communication is shown
    here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_216_0.png)


    > Note

    Please take a look at the HTTP APIs for the commands used during LC application
    processing, which are included with the code examples for this chapter.


    # When to use


    This form of integration is used when the customer is interested in the supplier’s
    response to the request. The response is then used to determine whether the request
    was successful or not. Given that the customer needs to wait for the response,
    it is advisable to use this style of messaging for low-latency operations. This
    form of integration is popular when exposing public APIs over the internet (for
    example, GitHub’s REST API, which you can learn more about at https://docs.github.com/en/rest).


    # Potential pitfalls


    When using synchronous messaging, the customer’s ability to scale is heavily dependent
    on the supplier to satisfy the customer’s requirements. On the flip side, customers
    making requests at too high a rate may compromise the supplier’s ability to serve
    customers in a predictable manner. If there is a chain of synchronous messaging,
    the probability of cascading failure becomes much higher.


    # Asynchronous messaging


    Asynchronous messaging is a style of communication where the sender does not wait
    for an explicit response from the receiver.'
  merge: -1
