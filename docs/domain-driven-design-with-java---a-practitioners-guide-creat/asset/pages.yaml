    bread removed from cart<br>E5: Wheat bread added to cart |

    | Confirm cart checkout | Order 123: Ordered milk and wheat bread | E1: Cart#123
    created<br>E2: Milk added to cart<br>E3: White bread added to cart<br>E4: White
    bread removed from cart<br>E5: Wheat bread added to cart<br>E6: Order 123 confirmed
    |'
