    Important Note

    Aggregates are also referred to as aggregate roots, that is, the object that is
    at the root of the entity hierarchy. We use these terms synonymously in this book.


    # Domain events


    As mentioned previously, aggregates dictate how and when state changes occur.
    Other parts of the system may be interested in knowing the occurrence of events
    that are significant to the business, for example, an order is placed or received.
    Domain events are the events of conveying that significance to the business has
    occurred. For example, in the context of a retail bank, a row was saved in the
    database or a server ran out of disk space may classify as system events, whereas
    a deposit was made to a checking account and fraudulent activity was detected
    on a transaction could be classified as domain events. In other words, domain
    events are those that domain experts care about.


    It may be prudent to make use of domain events to reduce the amount of coupling
    between bounded contexts, making it a critical building block of DDD.


    # Repositories


    Most businesses require the durability of data. For this reason, the aggregate
    state needs to be persisted and retrieved when needed. Repositories are objects
    that enable persisting and loading aggregate instances. This is well documented
    in Martin Fowler''s Patterns of Enterprise Application Architecture book as a
    part of the repository (https://martinfowler.com/eaaCatalog/repository.html) pattern.
    It is pertinent to note that we are referring to aggregate repositories here,
    not just any entity repository. The singular purpose of this repository is to
    load a single instance of an aggregate using its identifier. It is important to
    note that this repository does not support finding aggregate instances using any
    other means. This is because business operations happen as part of manipulating
    a single instance operations happen as part of manipulating a single instance
    of the aggregate within its bounded context.'
