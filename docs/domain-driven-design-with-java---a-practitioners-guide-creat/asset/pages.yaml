    Figure 12.7 - Deferred response using callback


    Given that these interactions happen over a network that can be unreliable, clients
    and servers need to employ a variety of techniques to achieve some semblance of
    reliability. For example, clients may need to implement support for timeouts,
    retries, compensating transactions, client-side load balancing, and so on. Similarly,
    the server may need to protect itself from errant clients by making use of techniques
    such as rate limits, circuit breakers, fallbacks, bulkheads, health endpoints,
    and so on.


    > Note

    elaborating on the specific techniques mentioned here is out of scope for this
    book. Books such as Release It and Mastering Non-Functional Requirements cover
    these patterns in a more depth.


    In a lot of cases, there is usually a need to employ a combination of several
    of the preceding techniques to provide a resilient solution. Just as we discussed
    in the logging section, mixing these concerns with core business logic can obscure
    the original intent of the problem. To avoid this, it is advisable to apply these
    patterns in a manner that is peripheral to core business logic. It may also be
    prudent to consider the use of libraries such as Resilience4j (https://resilience4j.readme.io/)
    or Sentinel (https://github.com/alibaba/Sentinel).'
