  md: '# Dealing with sensitive data


    In general, when adding logging code, it helps to include as much context as possible.
    This can be challenging in certain domains such as healthcare or finance where
    there may be legal/regulatory requirements to restrict access to sensitive information.
    For example, during the LC process, we may need to perform a credit check for
    the applicant using their government-issued identifier as the social security
    number (SSN) in the USA. In such cases, it is common to mask a significant portion
    of this information in the logs to maintain a balance between privacy and debuggability.
    Implementing such masking logic is a domain concern. This accentuates the need
    to use types (as opposed to primitives) to control the appropriate behavior. For
    example, overriding the toString of an SSN value type can ensure that the sanity
    of the business need is met within the bounded context.


    While masking may suffice in a majority of cases, it suffers from the limitation
    of not being able to access the original information by authorized users. If this
    is a requirement, it may be necessary to make use of tokenization (the process
    of replacing a sensitive piece of information with a non-sensitive placeholder
    value called a token) solution. This can allow logging tokens in an unrestricted
    manner within the bounded context and, in general, can be lot more secure. But
    this can mean dealing with the additional complexity of another bounded context
    to provide tokenized values and authorization controls when the real value needs
    to be accessed.


    # Log format


    Thus far, we have focused on the log message. However, logging is more than just
    that. It is typical to include additional information such as the time of occurrence,
    log level, and so on to in rapid troubleshooting. For example, Spring Boot uses
    the following log format by default:


    ```

    2022-06-05 10:57:51.253 INFO 45469 --- [ost-startStop-1] c.p.lc.app.domain.LCApplication
    : Root WebApplicationContext : Ending LCApplication in 120495 ns.

    ```


    While this is an excellent detail, it is primarily unstructured text with certain
    information being lost in order to improve readability (for example, the logger
    name is abbreviated). Logs are primarily meant to be consumed by humans, a large
    volume of logs can get in the way of being able to find the relevant logs. It
    is so important to produce logs that are also machine-friendly so that they can
    be easily indexed, searched, filtered, and so on. In other words, using a structured
    logging format like the one shown next can go a long way toward the goals of both
    machine and human readability:'
  merge: -1
  pgno: 280
