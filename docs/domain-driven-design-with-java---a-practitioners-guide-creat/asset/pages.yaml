    While it may have appeared previously that we have simply converted our coarse-grained
    APIs to become more fine-grained, in reality, is a better representation of the
    tasks that the user intended to perform. So, in essence, task-based APIs are the
    decomposition of work in a manner that aligns more closely to the users'' intents.
    With our new APIs, product validation can commence as soon as ChangeMerge happens.
    Also, it is unambiguously what the user did and what needs to happen in reaction
    to the user''s action. It then begs the question of whether we should employ task-based
    APIs all the time. Let''s look at the implications in more detail.


    # Task-based or CRUD-based?


    CRUD-based APIs seem to operate at the level of the aggregate. In our example,
    we have the LC aggregate. In the simplest case, this essentially translates to
    four operations aligned with each of the CRUD verbs. However, as we are seeing,
    in our simplified version, the LC is becoming a fairly complex concept. Having
    to work with just four operations at the level of the LC is cognit complex. With
    more requirements, this complexity will only continue to increase. For example,
    consider a situation where the business expresses to capture a lot more information
    about merchandise, where today, is simply captured in the form of free-text. A
    more elaborate version of merchandise information is shown here:


    ```

    1  public class Merchandise {

    2      private MerchandiseId id;

    3      private Set<Item> items;

    4      private Packaging packaging;

    5      private boolean hazardous;

    6

    7  }

    8

    9  class Item {

    10     private ProductId productId;

    11     private int quantity;

    12     // ...

    13 }

    14

    15 class Packaging {

    16     // ...

    17 }

    ```'
