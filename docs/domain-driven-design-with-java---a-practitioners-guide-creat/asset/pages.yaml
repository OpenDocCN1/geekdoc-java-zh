    These needs are arranged according to their dependencies, resulting in the creation
    of a value chain that maps users to a series of activities in the order of their
    visibility to the user (going from most to the least).


    +   6. Map: Finally, do we map using the evolutionary characteristics to decide
    where to place each component along the horizontal axis?


