  md: '# Where and How DDD Fit?


    When used pragmatically, vertical slice architecture does enable you to apply
    DDD very effectively within each or a group of related vertical slices –allowing
    them to be treated as bounded contexts. Two possibilities using the place order
    and cancel order examples are shown here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_70_0.png)


    Figure 2.9 – Vertical slices used to evolve bounded contexts


    In the (i) example in the preceding diagram, place order and cancel order each
    use a distinct domain model, whereas in the (ii) example, both cases share a common
    domain model and, by extension, become part of the same bounded context. This
    does pave the way to slice functionality when looking to adopt the serverless
    architecture along use boundaries.


    # Service-oriented architecture (SOA)


    Service-Oriented Architecture (SOA) is an architecture style where software components
    expose (potentially) reusable functionality over standardized interfaces. The
    use of standardized interfaces'
  merge: -1
  pgno: 70
- img_proc: true
  md: '(such as SOAP, REST, and gRPC, to name a few) enables easier interoperability
    when integrating heterogeneous solutions, as shown here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_71_0.png)


    Figure 2.10 - SOA - exposing reusable functionality over standard interfaces


    The use of non-standard, proprietary interfaces made this kind of integration
    a lot more challenging. For example, a retail bank may expose inter-account transfer
    functionality in the form of SOAP web services. While SOA prescribes exposing
    functionality over standardized interfaces, the focus is more on integrating heterogeneous
    applications than implementing them.


    # Considerations


    At one of the banks we worked at, we exposed a set of over 500 service interfaces
    over SOA. Under the hood, we implemented these services using EJB 2.x (a combination
    of stateless session beans and message-driven beans), hosted on a central J2EE
    application server, which did double duty as an Enterprise Service Bus (ESB).
    These services delegated Oracle, if not all, of the logic to a set of underlying
    procedures within a single monolithic Oracle database, using a canonical data
    model for the entire enterprise! To the outside world, these services were location-transparent,
    stateless, composable, and discoverable. Indeed, we advertised this implementation
    as an example of SOA, and it would be hard to argue that it was not.


    This suite of services had evolved organically over the years, with explicit boundaries,
    concepts from various parts of the organization, and generations of people mixed
    in, each adding their own interpretation of how business functionality needed
    to be implemented. In essence, the implementation resembled the dreaded big ball
    of mud, which was extremely hard to enhance and maintain.'
  merge: -1
