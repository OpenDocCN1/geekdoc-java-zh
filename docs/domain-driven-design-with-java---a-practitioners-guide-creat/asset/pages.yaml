  md: '# # Implementing the User Interface – Task-Based


    To accomplish a difficult task, one must first make it.


    > - Marty Rubin


    The essence of Domain-Driven Design (DDD) is about capturing the business process
    and user intent. In the previous chapter, we designed a set of APIs without paying
    much attention to how those APIs would get consumed by their eventual users. In
    this chapter, we will design the GUI for the LC application using the JavaFX framework.
    As part of that, we will examine this approach of designing APIs in isolation
    can cause an impedance mismatch between the producers and the consumers. We will
    examine the consequences of this impedance mismatch and how task-based UIs can
    help cope with this mismatch.


    We will cover the following topics in this chapter:


    +   * API styles

    * Bootstrapping the UI

    * Implementing the UI


    By the end of the chapter, you will know how to employ DDD principles to build
    robust user experiences that are simple and intuitive. You will also learn why
    it may be prudent to design your backend interfaces (APIs) from the perspective
    of the consumer.


    # ## Technical requirements


    You will need access to the following:


    +   * JDK 1.8+ (we have used Java 16 to compile sample sources)

    * JavaFX SDK 16 and Scene Builder'
