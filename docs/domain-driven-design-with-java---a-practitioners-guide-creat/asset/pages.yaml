  md: "# 108 Implementing Domain Logic\n\nThe corresponding source code for the whole\
    \ scenario is illustrated in the following code snippet:\n\n```\npublic class\
    \ Cart {\n    private boolean isNew;\n    private CartItems items;\n    //\n\n\
    \    private Cart() {\n        // Required by the framework\n    }\n\n    @CommandHandler\n\
    \    public void addItem(AddItemToCartCommand command) {\n        // Business\
    \ validations here\n        if (this.isNew) {\n            apply(new CartCreatedEvent(command.getId()));\n\
    \        }\n        apply(new ItemAddedEvent(command.getId()));\n    }\n\n   \
    \ // Other command handlers omitted for brevity\n    @EventSourcingHandler\n \
    \   private void on(CartCreatedEvent event) {\n        this.id = event.getId();\n\
    \        this.items = new CartItems();\n        this.isNew = true;\n    }\n  \
    \  // Other event sourcing handlers omitted for brevity\n```\n\n+   1. Before\
    \ processing any command, the aggregate loading process commences by first invoking\
    \ the no-args constructor. For this reason, the no-args constructor to be empty,\
    \ it should not have any code that restores state. Restoration of state must happen\
    \ only in those methods that trigger an event replay. In the case of Axon Framework,\
    \ this translates to methods embellished with @EventSourcingHandler annotation.\n\
    \n+   2. It is important to note that it is possible (but not necessary) to emit\
    \ more than one event after processing a command. This is illustrated in the command\
    \ handler for AddItemCommand in the previous code where we emit CartCreatedEvent\
    \ and ItemAddedEvent. Command handlers do not mutate the state of the aggregate.\
    \ They only make use of the existing aggregate state to enforce invariants (validations)\
    \ and emit events if invariants hold true.\n\n+   3. The loading process continues\
    \ through the invocation of event-sourcing handlers methods in exactly the order\
    \ of occurrence for that aggregate instance. Event-sourcing handlers are only\
    \ needed to hydrate aggregate state on the basis of past events. This means that\
    \ they are usually devoid of any business (conditional) logic. It goes without\
    \ saying that these methods do not emit any events. Event emission is restricted\
    \ to within command handlers when invariants are successfully enforced."
