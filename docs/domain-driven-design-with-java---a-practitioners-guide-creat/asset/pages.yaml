    # Enhancing shared understanding


    When working with a problem where domain concepts are unclear, there is a need
    to arrive at a common understanding among key team members (those who have bright
    ideas–the business/product people, and who translate these ideas into working
    software–the software developers). For this process to be effective, we tend to
    look for approaches that are follows:


    +   * Quick, informal, and effective

    * Collaborative – easy to learn and adopt for both non-technical and technical
    team members

    * Pictorial, because a picture can be worth a thousand words

    * Usable for coarse-grained and fine-grained scenarios


    There are several means to arrive at this shared understanding. The following
    are some of the commonly used approaches:


    +   * UML

    * BPMN

    * Use cases

    * User story mapping

    * CRC models

    * Data flow diagrams


    These modeling techniques try to formalize knowledge and express it in the form
    of a diagram or text to help deliver business requirements as a software product.
    However, this attempt has not narrowed the gap between business and software systems.
    While these methods tend to work well for technical audiences, they are usually
    not appealing as to non-technical users.


    In order to restore the balance and promote the use of techniques that can work
    for both parties, we will use domain storytelling and EventStorming as our means
    to capture business knowledge from domain experts for the consumption of developers
    and business analysts, among others.'
