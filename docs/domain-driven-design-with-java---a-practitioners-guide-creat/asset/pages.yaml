  md: '# Why do software projects fail?


    Failure is simply the opportunity to begin again, this time more intelligently.


    > Henry Ford


    According to the project success report published in the Project Management Journal
    of the PMI, the following six factors need to be true for a project to be deemed
    successful:


    | Category | Criterion | Description |

    | --- | --- | --- |

    | Project | Time | It meets the desired time schedules. |

    | Cost | Its cost does not exceed the budget. |

    | Performance | It works as intended. |

    | Use | Its intended clients use it. |

    | Client | Satisfaction | Its intended clients are happy. |

    | Effectiveness | Its intended clients derive direct benefits through their implementation.
    |


    Table 1.1 – Project success factors


    With all of these criteria being applied to assess project success, a large percentage
    of projects fail for one reason or another. Let''s examine some of the top reasons
    in more detail.


    # Inaccurate requirements


    PMI''s Pulse of the Profession report from 2017 highlights a very stark fact—a
    vast majority of projects fail due to inaccurate or misinterpreted requirements.
    It follows that it is impossible to build something that clients can use, they
    are happy, and with that make them more effective at their jobs if the wrong things
    get built—even much less for the project to be built on time and within budget.


    IT teams, especially in large organizations, are staffed with mono-skilled roles,
    such as UX designer, developer, tester, architect, business analyst, project manager,
    product owner, and business sponsor. In a lot of cases, these people are parts
    of distinct organization units/departments—each with its own set of priorities
    and motivations. To make matters even worse, the geographical separation between
    these people only keeps increasing. The need to keep costs down and the recent
    COVID-19 ecosystem does not help matters either.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Why do software projects fail?


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_27_0.png)


    Figure 1.1 – Silo mentality and the loss of information fidelity


    All this results in a loss of fidelity at every stage in the assembly line, which
    results in misconceptions, inaccuracies, delays, and eventually failure!


    # Too much architecture


    Writing complex software is quite a task. You cannot just hope to sit down and
    start typing codealthough that approach might work in trivial cases. Before translating
    business ideas into working software, a thorough understanding of the problem
    at hand is necessary. For example, it is not possible (or at least extremely hard)
    to build credit card software without understanding how credit cards work in the
    first place. To communicate your understanding of a problem, it is not uncommon
    to create software models of the problem before writing code. This model or collection
    of models represents the understanding of the problem and the architecture of
    the solution.


    Efforts to create a perfect model of the problem—one that is accountable in a
    very broad context—are not dissimilar to the proverbial holy grail quest. Those
    accountable for producing the architecture can get stuck in analysis paralysis
    or big design upfront, producing artifacts that are one or more of too high wish,
    gold-plated, buzzword-driven, or disconnected from the real world—while solving
    any real business problems. This kind of lock-in can be especially detrimental
    during the early phases of the project when the knowledge levels of team members
    are still up and coming. Needless to say, projects adopting such approaches find
    it hard to reach successfully.


    > Tip

    For a more comprehensive list of modeling anti-patterns, refer to Scott W. Ambler''s
    website (http://agilemodeling.com/essays/enterpriseModelingAntiPatterns.htm) and
    book, Agile Modeling: Effective Practices for Extreme Programming and the Unified
    Process, dedicated to the Subject.


    # Too little architecture


    Agile software delivery manifested themselves in the late 90s and early 2000s
    in response to heavyweight processes collectively known as waterfall. These processes
    seemed to favor big design upfront and abstract ivory tower based on wish, ideal-world
    scenarios. This was based on'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# The Rationale for Domain-Driven Design


    the premise that thinking things out well in development ends up saving development
    headaches later on as the project progresses.


    In contrast, agile methods seem to favor a much nimble and iterative approach
    to software development with a high focus on working software over other artifacts,
    such as documentation. Most teams nowadays claim to practice some form of iterative
    software development. However, with this obsession to claim conformance to a specific
    family of agile methodologies as opposed to the underlying principles, a lot of
    teams misconstrue having enough architecture with no perceptible architecture.
    This results in a situation where adding new features or enhancing existing ones
    takes a lot longer than it previously used to—which then accelerates the devolution
    of the solution to become the dreaded big bag of mud (http://www.laputan.org/mud/mud.html#BigBalloOfMud)


    # Excessive incidental complexity


    Mike popularized the notion of the test pyramid, where he talks about how a large
    number of unit tests form the foundation of a sound testing strategy—with numbers
    decreasing significantly as you move up the pyramid. The rationale here is as
    you move up the pyramid, the cost of upkeep goes copiously while the speed of
    execution slows down manifold. In reality, though, a lot of teams seem to adopt
    a strategy that is the exact opposite of this—known as the testing ice cream,
    as depicted here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_28_0.png)


    Figure 1.2 – Testing strategy: expectation versus reality


    The testing ice cream is a classic case of what Fred Brooks calls incidental complexity
    in his seminal paper titled No Silver Bullet—Essence and Accident in Software
    Engineering (http://worrydream.com/refs/Brooks-NoSilverbullet.pdf). All software
    has some amount of essential complexity that is inherent to the problem being
    solved. This is especially true when creating solutions for non-trivial problems.
    However, incidental or accidental complexity is not directly attributable to the
    problem itself—but is caused by the limitations of the people involved, their
    skill levels, the tools, and/or abstractions being used. Not keeping tabs on incidental
    complexity causes teams to veer'
  merge: -1
  pgno: 28
