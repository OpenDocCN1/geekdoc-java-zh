  md: 'In a simple system, the answer to these questions may not matter that much.
    However, as system complexity increases, this approach will remain resilient to
    change? We feel that it merits taking a look at another approach called task-based
    APIs to be able to answer these questions.


    # Task-based APIs


    In a typical organization, individuals perform tasks relevant to their specialization.
    The bigger the organization, the higher the degree of specialization. This approach
    of segregating tasks according to one''s specialization makes sense because it
    mitigates the possibility of stepping on each other''s shoes, especially when
    getting complex pieces of work done. In the LC application process, there is a
    need to establish the value/legitimacy of the product while determining the creditworthiness
    of the applicant. It also follows that these tasks can be performed independently
    of the other.


    In terms of a business process, if we create a LCApplicationCommand that precedes
    these operations, individuals in both departments first have to wait for the entire
    application to be filled out before they can commence their work. Secondly, if
    either piece of information is updated through a single UpdateLCApplicationCommand,
    it is unclear what changed. This can result in a spurious notification sent to
    at least one department because of this lack of clarity in the process.


    Since most work happens in the form of specific tasks, we can work to our advantage
    if our processes and, by extension, our APIs mirror these behaviors.


    Keeping this in mind, let''s re-examine our revised APIs for the LC application
    process:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_145_0.png)


    Figure 6.3 – Revised commands'
