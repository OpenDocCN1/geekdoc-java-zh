  md: '# 44 Where and Does DDD Fit?


    All these architecture styles are synergistic with DDD''s idea of developing a
    domain model for the core subdomain (and, by extension, its bounded context) independently
    of the rest of the system.


    While each of these architecture styles provides additional guidance in terms
    of how to structure a layered architecture, any approach we choose comes with
    its set of trade-offs and limitations you will need to be cognizant of. We will
    discuss some of these considerations in the next sub-sections.


    # The layer cake anti-pattern


    Sticking to a set of layers provides a level of isolation, but in simpler cases,
    it may prove to be overkill without adding any perceptible benefit, other than
    adherence to the agreed-on architecture guidelines. In the layer cake anti-pattern,
    each layer proxies the call to the layer beneath without adding any value. The
    following example illustrates this fairly common scenario:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_66_0.png)


    Figure 2.6 - An example of the layer cake anti-pattern to find an entity representation
    by ID


    The `findById` method is replicated in every layer and simply calls the method
    with the same name in the layer below, with no additional logic. This introduces
    a level of accidental complexity to the solution. Some amount of redundancy in
    the layering may be unavoidable for the purposes of standardization. It may be
    best to reexamine the layering guidelines if the layer cake occurs prominently
    in the code base.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# Anemic translation


    Another variation of the layer cake we see commonly is one where layers refuse
    to share input and output types in the name of higher isolation and looser coupling.
    This makes it necessary to perform translations at the boundary of each layer.
    If the objects being translated are more or less structurally identical, we have
    an anemic translation. Let''s look at a variation of the findById example we discussed
    previously.


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_67_0.png)


    In this case, each layer defines an Entity type of its own, requiring a translation
    between types at each layer. To make matters worse, the structure of the Entity
    type may have seemingly minor variations (for example, lastName being referred
    to as surname). While such translations may be necessary across bounded contexts,
    teams should strive to avoid the need for variations in names and structures of
    the same concept within a single bounded context. The intentional use of ubiquitous
    language helps avoid such scenarios.'
  merge: -1
