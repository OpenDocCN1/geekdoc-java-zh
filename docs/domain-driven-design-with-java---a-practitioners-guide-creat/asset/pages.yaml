  md: '# Even more fine-grained decomposition


    At this stage, is there any further decomposition that is required and feasible?
    These days, whether rightfully or otherwise, server architecture (specifically,
    functions as a service) is arguably becoming all the rage. As we pointed out in
    Chapter 2, Where and How Does DDD Fit?, this means that we may be able to decompose
    our command in a manner that each becomes its independently deployable unit (a
    bounded context). In other words, LCApplicationSubmitCancelCommand can be deployed
    independently.


    But just because this is technically possible, should we do it? While it is easy
    to dismiss this as a passing fad, there may be enough reason to split applications
    along command boundaries:


    +   **Risk profile:** Certain pieces of functionality present a higher risk when
    changes are made. For example, submitting an LC application may be deemed a more
    critical than the ability to cancel it. However, that is not to say that canceling
    is unimportant. Decoupled from submit allows changes to be made with a less scrutiny;
    this may make it easier to innovate quickly with more experimental features, with
    minimal fear of causing large disruptions.


    +   **Scalability needs:** Scaling can differ wildly for various commands in a
    system. For example, submit may need to scale a lot more than cancel. However,
    being coupled will force us to treat them as equals, which can be inefficient.


    +   **Cost attribution:** Having fine-grained components allows us to more accurately
    measure the amount of effort and the resulting ROI dedicated to each individual
    command. This can make it easier to focus our efforts on the most critical functionality
    (the (“core” of the core) and minimize waste.


    # Effects on the domain model


    These finer grain components are leading us to a point where it may appear that
    the deployment model is starting to have a big influence on the design. The fact
    that it is now feasible to deploy individual “tasks” independently requires us
    to examine how we arrive at bounded contexts. For example, we started by working
    on the LC Application Processing bounded context, and our aggregate design was
    based on all functionality included in the scope of application processing. Now,
    our aggregate design can be a lot more fine-grained. This means that we can have
    an aggregate specifically for functionality and another for cancel, as shown here:'
