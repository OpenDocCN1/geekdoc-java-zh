- img_proc: true
  md: '# Domain storytelling 79


    A domain story is conveyed using the following attributes:


    +   - **Actors**: Stories are communicated from the perspective of an actor (noun)
    – for example, the issuing bank, which plays an active role in the context of
    a particular story. It is a good practice to use the ubiquitous language for the
    particular domain.

    - **Work objects**: Actors act on some object – for example, applying for an LC.
    Again, this will be a term (noun) commonly used in the domain.

    - **Actions**: Actions (verb) performed by the actor on a work object. Represented
    by a labeled arrow connecting the actor and the work object.

    - **Annotations**: Used to capture additional information as part of the story,
    usually represented in a few sentences.

    - **Sequence numbers**: Usually, stories are told one after the other. Sequence
    numbers help capture the sequence of activities in a story.

    - **Groups**: An outline to represent a collection of related concepts, ranging
    from repeated/optional activities to subdomains/organizational boundaries.


    # Using DST for an LC application


    KP Bank has a process that allows the processing of LCs. However, this process
    is very archaic, paper-based, and manually intensive. Very few at the bank fully
    understand the process to end, and natural attrition has made the process overly
    complex without good reason. So, they are looking to digitize and simplify this
    process. DST itself just a graphical notation that can be done in isolation. It
    is typical to not do this on your own and employ a workshop style, with domain
    experts and software experts working collaboratively.


    In this section, we will employ a DST workshop to capture the current business
    flow. The following is an excerpt of such conversation between *Katie, the domain*
    and *Patrick, the software developer*:


    **Patrick**: Can you give me a high-level overview of a typical LC flow?


    **Katie**: Sure, it all begins with the importer and the exporter entering into
    a contract for the purchase of goods or services.


    **Patrick**: What does this contract take? Is it a formal document clause? Or
    is this just a conversation?


    **Katie**: This is just a conversation.


    **Patrick**: Oh okay. What does the conversation cover?


    **Katie**: Several things – the nature and quantity of goods, pricing details,
    payment terms, shipment costs and timelines, insurance, and warranty, among other
    things. These details can be captured in a purchase order – which is a simple
    document clause elaborating the aforementioned.'
  merge: -1
