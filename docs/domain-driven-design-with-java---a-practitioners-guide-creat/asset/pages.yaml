  md: 'A log is an extremely simple, append-only sequence of immutable records ordered
    by time. The diagram illustrates the structure of a log where records are written
    sequentially. In essence, a log is an append-only data structure, as depicted
    here:


    # First


    # Next Record


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_128_0.png)


    Figure 5.9 – The log data structure


    Writing to a log compared to a more complex data structure such as a table is
    a relatively simple and fast operation, and can handle extremely high volumes
    of data while providing predictable performance. Indeed, a modern event-streaming
    platform like Apache Kafka makes use of this pattern to scale to support extremely
    high volumes. We feel that this can be applied to a persistence store when processing
    commands in mainstream systems because this has benefits beyond the technical
    advantages listed. Consider the example of an online order flow shown:


    | User action | Traditional store | Event store |

    |---|---|--|

    | Add milk to cart | Order 123: Milk in cart | E1: Cart#123 created<br>E2: Milk
    added to cart |

    | Add white bread to cart | Order 123: Milk and white bread in cart | E1: Cart#123
    created<br>E2: Milk added to cart<br>E3: White bread added to cart |

    | Remove white bread from cart | Order 123: Milk in cart | E1: Cart#123 created<br>E2:
    Milk added to cart<br>E3: White bread added to cart<br>E4: White bread removed
    from cart |

    | Add wheat bread to cart | Order 123: Milk and wheat bread in cart | E1: Cart#123
