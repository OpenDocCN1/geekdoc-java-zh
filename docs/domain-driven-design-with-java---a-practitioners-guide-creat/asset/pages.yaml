  md: '246 Beyond Functional Requirements


    In an ideal world, what we need is the speed of unit tests and the confidence
    provided by manual testing. We will look at a few specific forms of testing that
    can help restore the balance.


    # Contract testing


    The limitation of unit testing is that the assumptions are made in mocks/stubs
    can be invalid or become stale as producers, manual tests suffer from being slow
    and wasteful. Contract tests provide a means to bridge the gap providing a happy
    medium where the producer and consumer share an executable contract that both
    producer and consumer can rely on for functionality/events. At a high level, this
    works in the manner depicted here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_268_0.png)


    Figure 12.2 – Contract testing: high-level flow


    This allows the consumers and the producers to work collaboratively, and get feedback
    a lot earlier in the cycle. For the consumer, they get to participate in sharing
    their expectations with the producer and make use of versioned, producer-approved
    stubs for their testing without having to depend on the producer''s real system.
    Likewise, producers gain a deeper understanding of how their services are consumed,
    setting them free to make bolder changes as they remain compatible.


    > Test-First Design

    The essence of domain-driven design is all about gaining as an understanding of
    the problem in order to solve the problem right. Test-design enables a better
    understanding of the problem it mitigates the risk of becoming biased by the solution
    we have built. In addition, it also promotes the verification of these requirements,
    which allows them to be used as an effective aid to regression testing. We are
    strong proponents of this practice for this reason and encourage you to consider
    adopting TDD as a core practice to accentuate your effectiveness with DDD.'
