  md: '# Decomposing into Finer-Grained Components


    Saga components can be characterized as a collection of stateful event listeners
    listening to events from more than one aggregate that can issue commands to more
    than aggregate. We saw earlier that we form bounded contexts along aggregate boundaries.
    Given that sagas tend to require interaction with more than one aggregate, they
    may not fall within the confines of bounded contexts. In a lot of ways, sagas
    can be viewed as their own bounded contexts. This makes it natural to have sagas
    work as standalone components that exist distinctly (both from a logical and physical
    perspective) from other parts of a solution.


    As you can see, commands and queries within the LC Application Process continue
    to use a common data store. Let''s look at what is involved in segregating them
    into their own data store.


    # Commands and queries as standalone components


    As we saw in the CQRS pattern in Chapter 2, Where and How Does DDD fit?, the primary
    benefit that we receive is the ability to evolve and scale these components independently
    of each other. This is important because commands and queries have different usage
    patterns and thus require the use of distinct domain models. This makes it fairly
    natural to split our bounded contexts along these boundaries. Thus far, the segregation
    is logical. A physical separation will enable us to truly scale these components
    independently, as shown here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_248_0.png)


    Figure 11.4 – Commands and queries as independent components


    It is pertinent to note that the command processing component is now shown to
    have access to two distinct stores:


    +   * The aggregate store, which stores either an event-sourced or state-stored
    representation of an aggregate state.

    * The lookup store, which can be used to store lookup data when performing business
    validations when processing commands. This is applicable when we need to access
    data that is/cannot be stored as part of the aggregate state.'
  merge: -1
