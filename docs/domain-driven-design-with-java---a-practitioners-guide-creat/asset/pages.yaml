  md: '# Decomposing into Finer-Grained Components


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_252_0.png)


    Figure 11.7 – Decomposition per command


    It is pertinent to note that the command functions continue to share a single
    event store, although they may make use of their own individual lookup stores.
    We understand that this decomposition likely feels unnecessary and forced. However,
    this does allow us to focus our energies on the core of the care. For example,
    LC application processing may be our business differentiator. However, an more
    careful examination may reveal that it is our ability to decision DCs near real
    time that is our real business differentiator. This means that it might be prudent
    to isolate functionality from the rest of the system. In doing so, we may need
    to optimize our business process without adding risk to the overall solution.
    While it is not strictly necessary to decompose the system in this way to arrive
    at such insights, a fine-grained decomposition may enable us to refine the idea
    of what is most important to our business. Having to share a persistent store
    can be a wrinkle to achieve complete independence. Therefore, a final decomposition
    may look something like the following:


