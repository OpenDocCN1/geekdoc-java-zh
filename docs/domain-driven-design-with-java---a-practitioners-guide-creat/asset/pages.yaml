  md: "# Enforcing business validations in the UI\n\nWe have a business validation\
    \ that the client reference for an LC needs to be at least four characters in\
    \ length. This will be enforced on the backend. However, to provide a richer user\
    \ experience, we will also enforce this validation on the UI.\n\n> Important Note\n\
    This may feel contrary to the notion of centralizing business validations on the\
    \ backend. While this may be a noble attempt at implementing the Don't Repeat\
    \ Yourself (DRY) principle, in reality, it poses a lot of practical problems.\
    \ Distributed systems expert Udi Dahan has an interesting talk on why this might\
    \ not be such a virtuous thing to pursue. Ted Edward also talks about this in\
    \ his blog, The Fallacies of Enterprise Computing.\n\nThe advantage of MVVM is\
    \ that this logic is easily tested in a simple unit test of the viewModel. Let's\
    \ see this in action now:\n\n```\nclass StartLCViewModels {\n    private StartLCViewModel\
    \ viewModel;\n    @BeforeEach\n    void init() {\n        int clientReferenceMinLength\
    \ = 4;\n        viewModel = new StartLCViewModel(clientReferenceMinLength);\n\
    \    }\n    @Test\n    void shouldNotEnableStartByDefault() {\n        assertThat(viewModel.getStartDisabled()).isTrue());\n\
    \    }\n    @Test\n    void shouldNotEnableStartIfClientReferenceLThanMinimumLength()\
    \ {\n        viewModel.setClientReference(\"123\");\n        assertThat(viewModel.getStartDisabled()).isTrue());\n\
    \    }\n    @Test\n    void shouldEnableStartIfClientReferenceEqualToMinimumLength()\
    \ {\n        viewModel.setClientReference(\"1234\");\n        assertThat(viewModel.getStartDisabled()).isFalse());\n\
    \    }\n    @Test\n    void shouldEnableStartIfClientReferenceGreaterThanMinimumLength()\
    \ {\n        viewModel.setClientReference(\"12345\");\n        assertThat(viewModel.getStartDisabled()).isFalse());\n\
    \    }\n}\n```"
