  md: 'Deferred response: In some (many?) cases, the client may need to know the outcome
    of the request they had previously made. If the server supports it, the client
    can submit a request, wait for a confirmation that the request was received along
    with an identifier of the resource to be tracked, and poll the server to track
    the status of its original request as shown here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_276_0.png)


    Figure 12.6 – Deferred response using poll


    Request with callback: When the client polls for the response, the server may
    not be finished with processing the original request. This means that the client
    may need to poll the server more than once to understand the status of the request,
    which can be wasteful. An alternative is for the server to push a response back
    to the client when it has finished processing by invoking a callback that the
    client provided when making the request.'
