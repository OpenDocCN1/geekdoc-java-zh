- img_proc: true
  md: '# Changes to frontend interactions 215


    As a consumer, it is important to know whether events will be ordered or not so
    that we can make design considerations for out-of-order events. One default might
    be to accommodate for out-of-order events as a default. In our experience, this
    does tend to make the resulting design more complicated, especially in cases where
    the order matters. Here, we discuss three-event ordering strategies and their
    implications for both the producer and the consumer:


    | Strategy | Producer | Event bus | Consumer |

    | --- | --- | --- | --- |

    | No ordering | Arguably, this is the easiest to implement because there is no
    expectation from the producer to support ordering. | Without additional metadata,
    the event bus might only be to guarantee ordering in the sequence of a receipt
    (FIFO order). | If the consumer depends on ordering, it might have to implement
    ordering through some sort of special processing. |

    | Per aggregate ordering | The producer needs to make sure each event includes
    an identifier to enable grouping by aggregate. | The event bus needs to support
    the notion of grouping (in this case, by the aggregate identifier). For events
    belonging to the same aggregate instance, messages are emitted in FIFO order.
    | To guarantee ordering, events originating from the same aggregate instance need
    to be processed by the same consumer instance. |

    | Global ordering | The producer needs to make sure each event includes a sequence
    number. | Either the event bus or the consumer needs to implement ordering logic.
    | |


    In most applications, per aggregate ordering might be a good place to start and
    cater to most business scenarios.


    # Durability and persistence guarantees


    When an event is published to the event bus, the happy path scenario is the intended
    consumer(s) can process it successfully. However, there are scenarios that can
    cause message processing to be adversely affected. Let''s examine some of these
    scenarios:


    +   - Slow consumer:** The consumer is unable to process events fast as the producers
    are publishing them.

    - **Offline consumer:** The consumer is unavailable (down) at the time of the
    events being published.

    - **Failing consumer:** The consumer is experiencing errors when trying to process
    events.'
  merge: -1
  pgno: 237
- img_proc: true
  md: 'In each of these cases, we could develop a backlog of unprocessed events. Because
    these are domain events, we need to prevent the loss of these events until the
    consumer has been able to process them successfully. There are two communication
    characteristics that need to be true for this to work successfully:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_238_0.png)


    Figure 10.7 – Persistence versus durability


    +   - **Persistence**: This is the communication style between the **Producer**
    and the **Event Bus** instance.

    - **Durability**: This is the communication style between the **Event Bus** instance
    and the **Consumer** instance.


    Firstly, messages need to be persistent (that is, stored on disk), and secondly,
    the message subscription (the relationship between the consumer and the event
    bus) needs to be durable (persist across **Event Bus** restarts). It is important
    to note that events have to be made persistent by the producer for them to be
    consumed durably by the consumer.'
  merge: -1
