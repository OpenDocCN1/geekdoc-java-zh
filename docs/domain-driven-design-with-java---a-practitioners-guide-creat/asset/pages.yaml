    # Understanding a letter of credit


    A Documentary Letter of Credit (LC) is a financial instrument issued by banks
    as a contract between an importer (buyer) and an exporter (seller). This contract
    specifies the terms and conditions of the transaction, under which the importer
    promises to pay the exporter for the goods or services provided by the seller.
    An LC typically involves multiple parties. A simplified summary of the parties
    is described as follows:


    +   - Importer: The buyer of the goods or services.

    - Exporter: The seller of the goods or services.

    - Freight forwarder: The agency that handles the shipment of goods on behalf of
    the exporter. This is only applicable in cases where there is an exchange of physical
    goods.

    - Issuing bank: The bank that the importer requests to issue the LC application.
    Usually, the importer has a preexisting relationship with this bank.

    - Advising bank: The bank that informs the exporter about the issuance of the
    LC. This is usually a bank that is native to the exporter’s country.

    - Negotiating bank: The bank that the exporter submits documents for the shipment
    of goods, or the services provided. Usually, the exporter has a preexisting relationship
    with this bank.

    - Reimbursement bank: The bank that reimburses the funds to the negotiating bank,
    at the request of the issuing bank.


    > Note\One bank can play more than one role in a given transaction. In the most
    complex cases, there can be four distinct banks involved in a transaction (sometimes
    more, but we will skip those cases for brevity).'
