  md: '# Where and How Does DDD Fit?


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_64_0.png)


    Figure 2.3 – Hexagonal architecture


    It turns out that the use of the term hexagon in this context was purely for visual
    purposes–not to limit the system to exactly six types of ports.


    Similar to the hexagonal architecture, onion architecture (https://jeffreypalermo.com/2008/07/the-onion-architecture-part-1/),
    conceived by Jeffrey Palermo, is based on creating an application on an independent
    object model within the core that can be compiled and run separately from the
    outer layers. This is by defining interfaces (ports in hexagonal architecture)
    in the core and implementing them (adapters in hexagonal architecture) in the
    outer layers. From our perspective, the hexagonal and onion architecture styles
    have no perceptible differences that we could identify.'
  merge: -1
