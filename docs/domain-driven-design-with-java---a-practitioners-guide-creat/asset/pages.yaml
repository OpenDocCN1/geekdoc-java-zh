    This was a whirlwind to a simple event-driven system. We still need to understand
    the role of @EventSourcingHandler. To understand that, we will need to appreciate
    aggregate persistence works and the implications it has on our overall design.


    # Persisting aggregates


    When working with any system of even moderate complexity, we are required to make
    interactions durable; that is, interactions need to outperform system restarts,
    crashes, and so on. The need for persistence is a given. While we should always
    endeavor to abstract persistence concerns from the rest of the system, our persistence
    choices can have a significant impact on the way we architect our overall solution.
    We have a couple of choices in terms of how we choose to persist aggregate state
    that we are mentioning:


    +   - State-stored

    - Event-sourced


    Let''s examine each of these techniques in more detail in the following sections.


    # State-stored aggregates


    Saving current values of entities is by the most popular way to persist state
    – thanks to the immense popularity of relational databases and Object-Relational
    Mapping (ORM) tools such as Hibernate. And there is good reason for this ubiquity.
    Until recently, a majority of enterprise systems used relational databases as
    a default to create business solutions, with ORMs arguably providing a very convenient
    mechanism to interact with relational databases and their object representations.
    For example, for our LCApplication, it is conceivable that we could use a relational
    database with a structure that would look something like the following:'
  merge: -1
