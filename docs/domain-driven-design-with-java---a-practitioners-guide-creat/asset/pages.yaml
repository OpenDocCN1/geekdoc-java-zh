  md: '# 18 The Rationale for Domain-Driven Design


    > **Important Note**

    It is important to note that the notion of core versus supporting versus generic
    subdomains is very context-specific. What is core for one business may be supporting
    or generic for another. Identifying and distilling the core domain requires a
    deep understanding and experience of what problem is being attempted to be solved.


    Given that the core subdomain establishes most of the business differentiation,
    it will be prudent to devote the most amount of energy towards maintaining that
    differentiation. This is illustrated in the core domain chart:


