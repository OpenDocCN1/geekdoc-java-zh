  md: "# Implementing Queries\n\nThese query models are an absolute necessity to implement\
    \ basic functionality dictated by business requirements. It is possible and very\
    \ likely that we will need additional query models as the system requirements\
    \ evolve. We will enhance our application to support these queries as when the\
    \ need arises.\n\n# Creating the query model\n\nAs seen in Chapter 5, Implementing\
    \ Domain Logic, when starting a new LC application, the importer sends StartLCApplicationCommand,\
    \ which results in LCApplicationStartedEvent, as shown here:\n\n```\nclass LCApplication\
    \ {\n    //..\n    @CommandHandler\n    public LCApplication(StartNewLCApplicationCommand\
    \ command) {\n        // Validation code omitted for brevity\n        // Refer\
    \ to chapter 5 for details.\n        AggregateLifecycle.apply(new LCApplicationStartedEvent(command.getId(),\n\
    \            command.getClientId(), command.getReference()));\n    }\n}\n```\n\
    \nLet's write an event-processing component to listen to this event and construct\
    \ a query model. When working with Axon Framework, we have a convenient way to\
    \ do this by annotating the event-listening method with the @EventHandler annotation.\n\
    \nTo make any event listener, we annotate it with the @EventHandler annotation:\n\
    \n```\nimport org.axonframework.eventhandling.EventHandler;\nimport org.springframework.stereotype.Component;\n\
    \n@Component\nclass LCApplicationStartedEventHandler {\n    @EventHandler\n  \
    \  public void on(LCApplicationStartedEvent event) {\n        LCView view = new\
    \ LCView(event.getId(),\n            event.getClientId(),\n            event.getReference(),\n\
    \            event.getState());\n\n        // Perform any transformations to optimize\
    \ access\n        repository.save(view);\n    }\n}\n```\n\n+   1. To make any\
    \ event listener, we annotate it with the @EventHandler annotation.\n2. The handler\
    \ method needs to specify the event that we intend to listen to. There are other\
    \ arguments that are supported by event handlers. Please refer to the Axon Framework\
    \ documentation for more information."
