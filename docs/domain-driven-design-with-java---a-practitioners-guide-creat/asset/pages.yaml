  md: '# The Rationale for Domain-Driven Design


    Java stalwarts such as the Spring Framework and more recent innovations such as
    Spring Boot and Quarkus make it no-brainer to create production-grade applications
    literally in a matter of minutes. frameworks such as Axon and Lagom, among others,
    make it relatively simple to implement advanced architecture patterns such as
    CQRS and event sourcing, which is very complementary to implementing DDD-based
    solutions.


    # Advances in technology


    DDD is no just about technology; it could not be completely agnostic to the choices
    available at the time. 2003 was the heyday of heavyweight and ceremony-heavy frameworks,
    such as Java 2 Enterprise Edition (JEE), Enterprise JavaBeans (EJB), SQL databases,
    and object relational mappers (ORMs) – with much choice beyond when it comes to
    enterprise tools and patterns to build complex software, at least out in the public
    domain. The software world has evolved and come a very long way from. In contrast,
    modern game-changers such as Ruby on Rails and the public cloud were just getting
    released. Now, we have no shortage of application frameworks, NoSQL databases,
    and programmatic APIs to create infrastructure components with a lot more releasing
    than monotonous.


    All these innovations allow for rapid experimentation, continuous learning, and
    iteration at pace. These game-changing advances in technology have also coincided
    with the exponential rise of the internet and e-commerce as viable means to carry
    out successful businesses. In fact, the impact of the internet is so pervasive
    that it is almost inconceivable to launch businesses without a digital component
    being an integral component. Finally, the consolidation and wide-scale penetration
    of smartphones, IoT devices, and social media meant that data is produced at rates
    as inconceivable as recent a decade ago. This means that we are building for and
    solving the most complicated problems by several orders of magnitude.


    # Rise of distributed computing


    There was a time when building large monoliths was very much the default. But
    an exponential rise in computing technology, the public cloud (IaaS, PaaS, SaaS,
    and FaS), big data storage, and processing volumes, which has coincided with an
    arguably slowdown in the ability to continue creating CPUs, has meant a turn toward
    more decentralized methods of solving problems.'
