  md: "# # Where and How Does\nDDD Fit?\n\n> \"We won't be distracted by comparison\
    \ if we are captivated with purpose.\"\n  - Bob Gaff\n\nSoftware architecture\
    \ refers to the fundamental structures of a software system and the discipline\
    \ of creating such structures and systems. Over the years, we have accumulated\
    \ a series of architecture styles and programming paradigms to help us deal with\
    \ system complexity.\n\nIn this chapter, we will examine how Domain-Driven Design\
    \ (DDD) can be applied in a manner that is complementary to these architecture\
    \ styles and programming paradigms. We will also look at how/where it fits in\
    \ the overall scheme of things when crafting a software solution.\n\nIn this chapter,\
    \ we will cover the following topics:\n\n+   - Architecture styles\n- Programming\
    \ paradigms\n- Which paradigm should you choose?\n\nBy the end of this chapter,\
    \ you will have gained an appreciation of a variety of architecture styles and\
    \ programming paradigms, along with some pitfalls to watch out for when applying\
    \ them. You will also understand the role that DDD plays in augmenting each of\
    \ these.\n\n# ## Architecture styles\n\nDomain-driven design presents a set of\
    \ architecture tenets in the form of strategic and tactical design elements. This\
    \ enables you to decompose large, potentially unwieldy business subdomains into\
    \ well-factored, independent bounded contexts."
  merge: -1
