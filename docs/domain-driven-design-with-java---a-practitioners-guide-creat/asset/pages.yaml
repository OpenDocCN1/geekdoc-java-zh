  md: '# Persistence technology choices


    When working with event-sourced aggregates, it is very important to be disciplined
    about the kind of code that one can write:


    | Type of method | State restoration | Business logic | Event emission |

    | --- | --- | --- | --- |

    | @CommandHandler | No | Yes | Yes |

    | @EventSourcingHandler | Yes | No | No |


    If there is a large number of historic events to restore state, the aggregate
    loading process can become a time-consuming operation—directly proportional to
    the number of elapsed events for that aggregate. There are techniques (such as
    event snapshotting) we can employ to overcome this.


    # Persistence technology choices


    If you are using a state store to persist your aggregates, using your usual evaluation
    process for choosing your persistence technology suffice. However, if you are
    looking at event-sourced aggregates, the decision can be a bit more nuanced. In
    our experience, even a simple relational database can do the trick. Indeed, once
    made use of a relational database to act as an event store for a high-volume transactional
    application with billions of events. This setup worked just fine for us. It is
    worth noting that we using only the event store to insert new events and loading
    events for a given aggregate in sequential order. However, there is a multitude
    of specialized technologies that have been purpose-built to act as an event store
    that supports every value-added features, such as time travel, full event replay,
    event payload introspection, and so on. If you have requirements, it might be
    worth considering other options, such as NoSQL databases (document stores such
    as MongoDB or column family stores such as Cassandra) or purpose-built commercial
    offerings, such as EventStoreDB and Axon Server, to evaluate feasibility in your
    context.


    # Which persistence mechanism should we choose?


    Now that we have a reasonably good understanding of the two types of aggregate
    persistence mechanisms (state-stored and event-sourced), it begs the question
    of which one we should choose. We list a few benefits of using event sourcing
    here:


    +   * We get to use the events as a natural audit log in high-compliance scenarios.

    * It provides the ability to perform more insightful analytics on the basis of
    the fine-grained events.

    * It arguably produces more flexible designs when we work with a system based
    on immutable events, because the complexity of the persistence model is capped.
    Also, there is no need to deal with complex ORM impedance mismatch problems.

    * The domain model is much more loosely coupled with the persistence model, enabling
    it to evolve independently from the persistence model.'
  merge: -1
