  md: "# Logging\n\nApplication logging is one of the most fundamental aids when it\
    \ comes to diagnosing issues in running code. In a lot of code bases, logging\
    \ tends to be an after-thought where developers add log statements only after\
    \ they encounter problems. This results in log statements strewn most randomly\
    \ throughout the code base. Here is a simple example of code with a command handler\
    \ to log its execution time among things:\n\n```\n@Log4J2\nclass LCApplication\
    \ {\n    //...\n    @CommandHandler\n    public void LCApplication(StartNewLCApplicationCommand\
    \ command) {\n        log.debug(\"Starting execution of command with applicant\
    \ {}\",\n            command.getApplicationId());\n\n        long timeTaken =\
    \ -System.nanoTime();\n\n        log.debug(\"Appending event for command {}\"\
    , command.getApplicationId());\n\n        AggregateLifecycle.apply(\n        \
    \    new LCApplicationStartedEvent(command.getId(),\n                command.getApplicationId(),\
    \ command.getClientReference(), LCState.DRAFT));\n\n        log.debug(\"Appended\
    \ event for command {}\",\n            command.getApplicationId());\n\n      \
    \  timeTaken += System.nanoTime();\n        log.debug(\"Ending StartNewLCApplication\
    \ in {} nanoseconds.\",\n            timeTaken);\n    }\n}\n```\n\nThere is no\
    \ doubt that logging can be valuable when troubleshooting issues. However, when\
    \ we look at the preceding code, the logging code tends to dominate the method\
    \ obscuring the domain logic. This might feel somewhat ironic, but when this is\
    \ done in multiple places, it can get repetitive, cumbersome, and error-prone—compromising\
    \ readability. In fact, we have seen cases where seemingly innocent log statements\
    \ have introduced performance issues (for example, with a loop with an expensive\
    \ argument evaluation) or even bugs (for example,PointerException when trying\
    \ to evaluate arguments). In our opinion, it is very important to treat logging\
    \ as a first-class citizen and afford it the same rigor as core domain logic.\
    \ This means that it needs to obey all the good practices that we associate with\
    \ well-factored production code."
  merge: -1
  pgno: 278
- img_proc: true
  md: "# Segregating logging code\n\nIdeally, we will be able to maintain a balance\
    \ between readability and debugability: This can be achieved if we can segregate\
    \ these two concerns. One way to segregate this cross-cutting logic is to use\
    \ aspect-oriented programming (read more about AOP at https://www.eclipse.org/aspectj/\
    \ and https://docs.spring.io/spring-framework/docs/current/reference/core.html#aop)\
    \ as shown here:\n\n```\n@Aspect\n@Component\npublic class LoggingAspect {\n \
    \   @Around(\"annotation(org.springframework.framework.commandhandling.CommandHandler)\"\
    )\n    public Object log(ProceedingJoinPoint point) {\n        logEntry();\n \
    \       long time = System.nanoTime();\n        boolean normalExit = false;\n\
    \        try {\n            final Object out = point.proceed();\n            normalExit\
    \ = true;\n            return out;\n        } finally {\n            logExit(point,\
    \ normalExit, time);\n        }\n    }\n}\n```\n\n> Define an around aspect for\
    \ all methods annotated with the @CommandHandler annotation. In this example,\
    \ we are using compile-time weaving as opposed to runtime weaving available through\
    \ the Spring Framework, to execution time logic using AspectJ. You can find more\
    \ details on the pros and cons of using aspect techniques in this article (https://www.baeldung.com/spring-aop-vs-aspectj).\n\
    \nIn the style shown here, we have separated logging code from application code\
    \ through the use of aspect-oriented programming. In the example, the logging\
    \ code applies to all methods annotated with the @CommandHandler annotation. This\
    \ has the advantage that all such methods will now produce consistent entry/exit\
    \ logging statements. On the flip side, if there is a need for additional logging\
    \ for a specific command handler, it will still have to be done within the body\
    \ of method. If you see yourself requiring lots of ad hoc logging statements in\
    \ addition to simple entry/exit logs, it might be a smell and that your methods\
    \ may need to be refactored."
  merge: -1
  pgno: 279
