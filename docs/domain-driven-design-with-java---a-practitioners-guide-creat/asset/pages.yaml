  md: '# Persisting aggregates 107


    As you can see, the event store, we continue to have full visibility of all user
    actions performed. This allows us to reason about these behaviors holistically.
    In the traditional store, we lost the information that the user replaced white
    with wheat bread. While this does not impact the order itself, we lost the opportunity
    to gather insights from this user behavior. We recognize that this information
    can be captured in other ways using specialized analytical solutions; however,
    the event mechanism provides a natural way to do this requiring any additional
    effort. It also acts as an audit log, providing a full history of all events that
    have occurred so far. This fits well with the essence of domain-driven design,
    where we are constantly exploring ways in which to reduce complexity.


    However, there are implications for persisting data in the form of a simple event
    log. Before processing any command, we will need to hydrate past events in the
    exact order of occurrence and reconstruct the state to allow us to perform validations.
    For example, when confirming checkout, just having the order of elapsed events
    will not suffice. We still need to compute the items that are in the cart before
    the order to be placed. This event replay to restore aggregate state (at least
    those that are required to validate said command) is necessary before processing
    that command. For example, we need to know which items are in the cart before
    processing RemoveItemFromCart. This is illustrated in the following table:


    | Elapsed events | Aggregate state | Command | Event(s) emitted |

    | --- | --- | --- | --- |

    | | | Add item: milk | E1: Cart#123 created |

    | E1: Cart#123 created | Cart items: | | E2: Milk added |

    | E2: Milk added | Milk | Add item: white bread | E2: White bread added |

    | E1: Cart#123 created | Cart items: | Remove item: white bread | E3: White bread
    removed |

    | E2: Milk added | Milk and | | |

    | E3: White bread added | white bread | | |

    | E1: Cart#123 created | Cart items: | Add item: wheat bread | E4: Wheat bread
    added |

    | E2: Milk added | Milk | | |

    | E3: White bread added | | | |

    | E4: White bread removed | | | |

    | E1: Cart#123 created | Cart items: | Confirm checkout for Cart#123 | E5: Order
    created! |

    | E2: Milk added | Milk and | | |

    | E3: White bread added | wheat bread | | |

    | E4: White bread removed | | | |

    | E5: Wheat bread added | | | |'
