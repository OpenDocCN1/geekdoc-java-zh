  md: '# Entities


    An entity is an object with a unique identity and encapsulates the data and behavior
    of its attributes. It may be convenient to view entities as a collection of other
    entities and value objects that need to be grouped together. A simple example
    of an entity is shown here:


    | Transaction |

    | id: TransactionId <<generated> |

    | amount: MonetaryAmount |

    | type: TransactionType |

    | date: Date |

    | status: TransactionStatus |

    | void approved()

    | void rejected() |


    Figure 1.22 - A simple depiction of a Transaction entity


    In contrast to a value object, entities have the nature of a unique identifier.
    This means that Transaction entities with the same values but a different identifier
    (id) value will be considered different. On the other hand, two entity instances
    with the same identifier are considered equal. Furthermore, unlike value objects,
    entities are mutable. That is, their attributes can change over time.


    The concept of value objects and entities depends on the context within which
    they are used. In an order management system, the address may be implemented as
    a value object in the e-commerce bounded context, whereas it may need to be implemented
    as an entity in the order fulfillment bounded context.


    > **Important Note**nIt is common to collectively refer to entities and value
    objects as domain objects.


    # Aggregates


    As seen previously, entities are hierarchical in that they can be composed of
    one more child. Fundamentally, an aggregate has the following qualities:


    +   * Is an entity usually composed of other child entities and value objects

    * Encapsulates access to child entities by exposing behavior (usually referred
    to as commands)

    * Is a boundary that is used to enforce business invariants (rules) consistently

    * Is an entry point to get things done within a bounded context'
  merge: -1
  pgno: 51
