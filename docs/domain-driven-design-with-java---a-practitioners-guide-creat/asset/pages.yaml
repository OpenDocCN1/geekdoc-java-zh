  md: '# Forewards


    The ideas behind Domain-driven Design (DDD) have an outsized influence on software
    architecture and the way we think about software projects. Ubiquitous Language
    is a term defined by DDD, describing the practice of creating a more precise language
    when discussing design in software projects. However, DDD has provided a ubiquitous
    language for software architecture: most discussions around microservices touch
    on terms originating in the DDD world.


    However, the book that started it all, Domain Design by Eric Evans, falls into
    the category of what Mark Twain called a classic: "a book that everyone wants
    to have read." The truth of the matter is, while the book is packed of influential
    ideas, it quite abstract for readers looking advice on how to build software.
    This doesn''t indicate a deficiency in the source-it is designed to cover broad
    concepts, which encompasses many different facets of design, including not limited
    to software development.


    However, when developers need to utilize these ideas in a practical sense, such
    as in a concrete project, the abstract doesn''t-they need a practitioner''s guide,
    which readers now hold in their hands. This book does an excellent job translating
    the concepts of DDD into useful overviews and concrete advice on how to implement
    them. For example, a pertinent question that developers have is unanswered in
    the DDD book: which is better to implement a project, imperative or functional
    programming style? Each has tradeoffs; this book helps teams make these kinds
    of implementation decisions. This book covers multiple perspectives on applying
    DDD to Java projects, including foundational material about how DDD and agile
    engineering practices intersect in modern projects.


    While many books exist that cover DDD and software architecture independently,
    this book does an excellent mapping one to another, describing how the influence
    of DDD maps to a different architecture topologies. For example, it describes
    how they can reconcile bounded contexts with layered and other architecture topologies.


    Part one this book covers foundational ideas of the book, including technical
    and design details. Part two covers Real World DDD, how to apply the abstract
    ideas in a more concrete realm. It covers everything from how to discover and
    document the domain, how to map real-world concepts into DDD concepts. For example,
    it does an excellent job describing aggregates, their design, and relationships.


    Part three covers a topic dear to my heart the architecture of Building Evolutionary
    Architecture, which is the evolution of software. Software products constantly
    evolve, including new features and capabilities. Therefore, software development
    is not a static process—it must evolve along multiple dimensions to remain successful.
    This book contains a number of useful evolution patterns, covering both the domain
    and architecture characteristics.'
