  md: '# 210 Beginning the Decomposition Journey


    When working with events within the confines of a single process, assuming synchronous
    processing (event publishing and consumption on the same thread), we do not encounter
    a majority of problems that only become apparent when the publisher and the consumer
    are distributed across multiple processes. Let''s examine some of these in more
    detail next.


    # Atomicity guarantees


    Previously, when the publisher processed a command by publishing an event and
    the consumer(s) handled it, transaction processing occurred as a single atomic
    unit, as follows:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_232_0.png)


    Figure 10.4 - ACID transaction processing within the monolith


    Notice how all the highlighted operations in the preceding diagram happen as part
    of a single database transaction. This allows the system to be strongly consistent
    from end to end. When the event bus is distributed to work within its own process,
    atomicity cannot be guaranteed as it was previously. Each of the preceding numbered
    operations works as an independent transaction. This means that they can fail
    independently, which can lead to data inconsistencies.'
  merge: -1
  pgno: 232
- img_proc: true
  md: 'To solve this problem, let''s look at each step of the process in more detail,
    starting with commandnprocessing:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_233_0.png)


    Figure 10.5 – Command processing transaction semantics


    Let''s consider a situation where we save to the database but fail to publish
    the event. Consumers

    will remain oblivious of the event that is occurring and becoming inconsistent.
    On the flip side, if

    we publish the event but fail to save it in the database, the command processing
    side itself becomes

    inconsistent—not to mention that the query now thinks that a data event occurred,
    when,

    it, it did not. Again, this leads to inconsistency. This dual-write problem is
    fairly common in

    distributed event-driven applications. If command processing has to work in a
    foolproof mannernsaving to the database and publishing to the event bus has to
    happen atomically—both operations

    should succeed or fail in unison. Here are a few solutions that we have used to
    solve this issue (in\increasing order of complexity):


    +   * **Do nothing:** Arguably; however, it might be the only

    placeholder until a more robust solution is in place. While it might be puzzling
    to see this

    being listed as an option, we have seen several occasions where this is indeed
    how event-driven

    systems have been implemented. We leave this here as a word of caution so that
    teams become

    cognizant of the pitfalls.'
