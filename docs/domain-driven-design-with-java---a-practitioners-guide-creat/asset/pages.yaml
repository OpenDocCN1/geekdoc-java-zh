- img_proc: true
  md: '# Implementation patterns 195


    > Note

    We are using the terms *sender* and *receiver* instead of *customer* and *supplier*
    because they both can play the role of sender or receiver.


    This is typically achieved by introducing an intermediary in the form of a message
    channel. The presence of the intermediary enables both one-to-one and one-to-many
    modes of communication. Typically, the intermediary can take the form of a shared
    filesystem, database, or queuing system:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_217_0.png)


    9.16 - Asynchronous messaging


    > Note

    nPlease take a look at the event APIs for the commands used during LC application
    processing, which are included with the code examples for this chapter.


    # When to use


    This form of integration is used when the sender does not care about receiving
    an **immediate** response from the receiver(s), resulting in the respective systems
    becoming a lot decoupled from each other. This enables these systems to scale
    independently. This also makes it possible to have the same message processed
    by multiple receivers. For example, in our LC application processing system, `LCApplicationSubmittedEvent`
    is received by both *compliance* and *customer* onboarding systems.


    # Potential pitfalls


    The introduction of the intermediary component adds complexity to the overall
    solution. The non-functional characteristics of the intermediary can have a profound
    effect on the resilience characteristics of the system as a whole. It can also
    be tempting to add processing logic to the intermediary, thereby coupling the
    overall system very tightly to this component. To ensure reliable communication
    between the sender and the receiver, the intermediary may have to support a variety
    of enhanced capabilities (such as ordering, producer flow control, durability,
    and transactions).'
  merge: -1
