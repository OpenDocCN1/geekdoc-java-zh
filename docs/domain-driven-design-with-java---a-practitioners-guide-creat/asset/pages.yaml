    In subsequent chapters, we will examine the other techniques in more detail.


    # Summary


    In this chapter, we examined two ways to enhance our collective understanding
    of a problem domain using two lightweight techniques - domain storytelling and
    EventStorming.


    Domain storytelling uses a simple pictorial to share business knowledge among
    experts and technical team members. EventStorming, on the other hand, uses a chronological
    ordering of domain events that occur as part of the business process to gain that
    shared understanding.


    Domain storytelling can be used as an introductory technique to establish a high-level
    understanding of a problem space, while EventStorming can be used to inform detailed
    design decisions of a solution space.


    With this knowledge, we should dive deeper into the technical aspects of solution
    implementation. In the next chapter, we will start the implementation of business
