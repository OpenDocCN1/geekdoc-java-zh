  md: '# Beyond Functional Requirements


    tactical perspective, it can provide insights into the shortcomings of the invocation
    style being used to communicate among components.


    In this section, we have chosen to highlight contract testing, mutation testing,
    and chaos testing because we see them as game-changers in the application of DDD.
    Teams will benefit by looking at these methods as augmentations to other testing
    methods when coming up with a well-rounded testing strategy.


    # Deployment automation


    The intent of applying domain-driven design is to create an ecosystem of loosely
    coupled components – so each of these components can evolve independently of each
    other. This includes how these components are deployed to production. At a high
    level, we have at least three styles of deployment:


    +   - **Single-process monolith**: Large portions of the application are deployed
    as a single unit, with all components that are included in the deployment running
    in a single process

    - **Distributed monolith**: Where the application is split into multiple components
    with each running in its own process and/or host, deployed as a single unit and/or
    requiring non-trivial amounts of coordination and tight coupling among components
    and their owners

    - **Independent components**: Where the application is split into multiple components
    with each running in its own process and/or host, deployed independently of each
    other and requiring minimal to no coordination among component owners


    We also have a number of deployment strategies that we can employ. We list some
    of the more popular ones in order of increasing complexity and richness:


    +   - **Basic**: Likely the oldest style of deployment where the newer version
    of the application replaces the old, usually with some amount of downtime. Rollback
    typically means redeploying the previously live version, taking some amount of
    downtime. This is a fairly common deployment strategy for applications where a
    certain amount of downtime is acceptable. This may include non-business critical
    applications and/or third-party packages where we do not have a say in how these
    applications manage their deployments. In the case of certain monoliths, this
    may be the only feasible option due to the overall complexity of the system as
    a whole. This style of deployment typically starts out being fairly simple and
    well understood and may suffice for non-critical applications. On the flip side,
    it requires the deployment and release to happen in one tightly coupled step and
    may involve some amount of downtime.'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# Deployment automation 249


    +   * Blue-green: A deployment strategy that makes use of two identical environments,
    a "blue" and a "green" environment, with one representing the current production
    and another representing the newer version. The current version continues to service
    traffic, while testing and acceptance are carried out on the newer version without
    exposing it to users. User traffic is switched to the newer version once testing
    activities are deemed to successfully completed. It is pertinent to note that
    deployment enables with (near) zero downtime and is directed only to one environment
    at any given time. This style of deployment also allows decoupling of the process
    of deployment and release. Rollbacks are easier because it simply means redirecting
    traffic to the older version. On the other hand, it requires double the amount
    of capacity at least during the time of the deployment. It may not cost-prohibitive
    for monolithic applications.

    * Rolling: A deployment strategy where a small subset of version instances is
    incrementally replaced by newer version instances. Both old and newer versions
    of the software continue to run in parallel until all instances of the old are
    replaced with new ones. In some cases, rollbacks typically means replacing the
    newer instances with older ones. This style of deployment also enables zero-downtime,
    while allowing side-by-side testing of old and newer versions with real users.
    Rolling deployments can make rollbacks relatively easy by aborting the introduction
    of the new version and re-introducing the old version and can reduce the blast
    radius of a bad release. Unlike blue-green deployments, deployment and release
    cannot be decoupled. Deployment means that the system is released (at least for
    a subset of users).

    * Canary: A variation of the rolling deployment where traffic is routed to newer
    instances in a controlled and phased manner, typically an increasing proportion
    of request volume (for example, 2% -> 25% -> 75% -> 100% of users). This deployment
    style enables more fine-grained control of the event of the release as proceeding
    to rolling deployment.


    +   * A/B deployment: A variation of canary deployment where multiple versions
    (with one or more variations) of new functionality may run simultaneously as "experiments"
    along with the current version. Further, these variations may be targeted to specific
    sets of users. It allows for testing more than two combinations at the same time
    with real users.


    When with monolithic applications, teams are usually forced to restrict them to
    either basic or the most cost and complexity in adopting more sophisticated deployment
    strategies are low. On the other hand, distributed monoliths make this even more
    complicated because it now requires coordination among physically disparate components
    and teams. As long as we are able to maintain a balance between component granularity
    and coupling, we should be able to support a variety of advanced deployment strategies.


    In modern''s ecosystem where there is a tremendous amount of competition to deliver
    new features and innovate faster, there is a need to support more complex forms
    of deployment with the least amount of risk and disruption to very likely a the
    business. If supporting flexible deployment strategies proves to be too hard,
    there is a need to re-examine your context boundaries.'
  merge: -1
