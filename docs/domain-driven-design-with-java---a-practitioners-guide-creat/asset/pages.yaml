  md: 'Further breakdown of subdomains may be needed until we reach a level of manageable
    complexity.

    Domain decomposition is an important aspect of DDD. Let''s look at the types of
    subdomains to

    understand this better.


    > **Important Note**

    The terms domain and subdomain tend to get used interchangeably often. This can

    be confusing to the casual onlooker. Given that subdomains tend to be complex
    and

    hierarchical, a subdomain can be a domain in its own right.


    # Types of subdomains


    Breaking down a complex domain into more manageable subdomains is a great thing
    to do. However,

    not all subdomains are created equal. With any business, the following three types
    of subdomains are

    go to be encountered:


    +   **Core:** The main focus area for the business. This is what provides the
    biggest differentiation

    and value. It is, therefore, natural to want the most focus on the core subdomain.

    in the retail example, shopping carts and orders may be the biggest differentiation—and
    hence

    form the core subdomains for that venture. It is prudent to implement core

    subdomains in-house, given that it is something businesses will desire to have
