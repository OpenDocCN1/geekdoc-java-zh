  md: '50 Where and Does DDD Fit?


    The intentions behind SOA are noble. However, the promises of reuse and loose
    coupling are hard to achieve in practice, given the lack of concrete implementation
    guidance on component granularity. It is also true that SOA means many things
    (https://martinfowler.com/bliki/ServiceOrientedAmbiguity.html) to different people.
    This ambiguity leads to most SOA implementations complex, unmaintain monoliths,
    or both. This is where DDD to solve a complex problem by breaking it down into
    subdomains and bounded contexts is invaluable.


    # Microservices architecture


    In the last decade or microservices have gained a lot of popularity, with lots
    of organizations wanting to adopt this style of architecture. In a lot of ways,
    microservices are an extension of SOA – where much emphasis is placed on creating
    focused components that deal with doing a limited number of things and doing them
    right. Sam Newman, the author of the Building Microservices book, defines microservices
    as small-sized, independently deployable components that maintain their own state
    and are modeled around a business domain. This affords benefits such as adopting
    a horsesfords approach when modeling solutions, limiting the blast radius, improved
    productivity and speed, autonomous cross-functional teams, and so on.


    Microservices usually exist as a collective, working collaboratively to achieve
    desired business outcomes, as depicted here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_72_0.png)


    Figure 2.11 – A microservices ecosystem'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'As we see, SOA and microservices are very similar from the perspective of the
    consumers, in that they access functionality through a set of standardized interfaces.
    The microservices approach is an evolution of SOA in that the focus now is on
    building smaller, self-sufficient, independently deployable components with the
    intent of avoiding single points of failure (such as an enterprise database or
    service bus), which was fairly common with a number of SOA-based implementations.


    While microservices have definitely helped them, there still exists a lot of ambiguity
    regarding how big or small a microservice should be (https://martinfowler.com/articles/microservices.html#HowBigIsAMicroservice).
    Indeed, a lot of teams seem to struggle to get this right, resulting in a monolith
    (https://www.infog.com/news/2016/02/services-distributed-monolith/), which, in
    a lot of ways, can be much worse than a single-process monolith from the SOA days.
    Again, applying the strategic design concepts of DDD can help create independent,
    loosely coupled components, making it ideal companion for the microservices style
    of architecture.


    # Event-driven architecture (EDA)


    Irrespective of the granularity of components (monolith, microservices, or something
    in between), non-trivial solutions have a boundary, beyond which there may be
    a need to communicate with external system(s). This communication usually happens
    through the exchange of messages between systems, causing them to become coupled
    with each other. Coupling comes in two flavors: afferent—who depends on you, and
    defferent—who you depend on. Excessive amounts of efferent coupling can make systems
    very brittle and hard to work with.


    Event-driven systems enable authorizing solutions that have a relatively low amount
    of restent coupling by emitting events that retain a certain state, without caring
    about who consumes these events. In this regard, it is important to differentiate
    between message-driven and event-driven systems, as mentioned in the Reactive
    Manifesto:


    > A message is item of data that is sent to a specific destination. An event is
    a signal emitted by a component upon reaching a given state. In a message-driven
    system addressable recipients await the arrival of messages and react to them,
    otherwise lying dormant. In an event-driven system notification listeners are
    attached to the sources of events such that they are invoked when the event is
    emitted. This means that an event-driven system focuses on addressable event sources
    while a message-driven system concentrates on addressable recipients.


    The Reactive Manifesto'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# 52 Where and Does DDD Fit?


    In simpler terms, event-driven systems do not care who the downstream consumers
    are, whereas in a message-driven system, that may not necessarily be true. When
    we say event-driven in the context of this book, we mean the former.


    Typically, event-driven systems eliminate the need for point-to-point messaging
    with the ultimate consumers by making use of an intermediary infrastructure component,
    usually known as a message broker, event bus and so on. This effectively reduces
    coupling from n consumers to 1. There are a few variations on how event-driven
    systems can be implemented. In the context of publishing events, Martin Fowler
    talks about two broad styles (among other things), event notifications and event-carried
    state, in which what we mean by “What do you mean by Event-Driven?” article (https://martinfowler.com/articles/201701-event-driven.html).


    # Considerations


    One of the trade-offs when building an event-driven system is to decide the amount
    of state (payload) that should be embedded in each event. It may be prudent to
    consider embedding just enough state to indicate changes that occurred as a result
    of the emitted event to keep the various opposing forces, such as producer scaling,
    encapsulation, consumer complexity, and resiliency. We will discuss the related
    implications in more detail when we cover implementing events in Chapter 5, Implementing
    Domain Logic.


    DDD is all about keeping complexity in check by creating these independent bounded
    contexts. However, independent does not mean isolated. Bounded contexts may still
    need to communicate with each other. One way to do that is through the use of
    a fundamental DDD building block -domain events. Event-driven architecture and
    DDD are thus complementary. It is typical to make use of an event-driven architecture
    to allow bounded contexts to communicate while continuing to loosely couple with
    each other.


    # Command Query Responsibility Segregation (CQRS)


    In traditional applications, a single-domain, data/persistence model is used to
    handle all kinds of operations. With CQRS, we create distinct models to handle
    updates (commands) and inquiries. This is depicted in the following diagram:'
  merge: -1
