  md: 'If you observe carefully, there seem to be commands at two levels of granularity.
    Create LC Application and Update LC Application are coarse-grained, whereas the
    others are a lot more focused in terms of their intent. One possible decomposition
    of the coarse-grained commands can be depicted here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_143_0.png)


    Figure 6.2 – Decomposed commands


    In addition to just being fine-grained than the commands in the previous iteration,
    the revised commands seem to better capture the user’s intent. This minor change
    in semantics, can have a huge impact on the way our solution is used by its ultimate
    end users. The question is whether we should always prefer fine-grained APIs over
    coarse-grained commands. The answer can be a lot more nuanced. When designing
    APIs and experiences, we see two main styles being employed:


    +   - CRUD-based

    - Task-based


    Let''s look at each of these in a bit more detail.


    # CRUD-based APIs


    CRUD is an acronym used to refer to the four basic operations that can be performed
    on database applications: create, read, update, and delete. Many programming languages
    and protocols have their equivalent of CRUD, often with slight variations in naming
    and intent. For example, SQL - a popular language for interacting with databases
    - calls the four functions Insert, Select, Update, and Delete. Similarly, the
    HTTP protocol has POST, GET, PUT, and DELETE as verbs to represent CRUD operations.
    This approach has been extended to the design of our APIs as well. This has resulted
    in the proliferation of CRUD-based APIs and user experiences. Take a look at CreateLCApplicationCommand
    from Chapter 5, Implementing Domain Logic:'
