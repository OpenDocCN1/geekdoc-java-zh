- img_proc: true
  md: 'xviii Preface


    **Product owners** should read this book so that they can act as effective facilitators
    when communicating with both business and technical team members, making sure
    that there is no loss in translation.


    **Architects** should read this book so that they gain an appreciation of the
    fact that it is of utmost importance to understand the problem before thinking
    of a solution. They will also gain an appreciation of various architecture patterns
    and how they play in conjunction with DDD principles.


    **Developers and testers** will be able to put their knowledge to work with this
    practical guide to create elegant software designs that are easy and pleasant
    to work with and about reason.


    The book provides a hands-on approach to gathering requirements effectively, promoting
    a shared understanding among all members in order to implement solutions that
    will withstand the test of a dynamically evolving business ecosystem.


    # What this book covers


    *Chapter 1, The Rationale for Domain-Driven Design,* examines how the practice
    of DDD provides a set of guidelines and techniques to improve the odds of success
    in our favor. We will look at Eric Evans'' classic book member on the subject
    from 2003 is extremely relevant today. We will also introduce the elements of
    strategic and tactical DDD.


    *Chapter 2, Where and How Does DDD Fit?,* examines how DDD compares with several
    of its architecture styles and how/it fits in the overall scheme of things when
    crafting a software solution.


    *Chapter 3, Understanding the Domain,* introduces the sample domain (International
    Trade) at a fictitious KP bank. We also examine how we can get started with strategic
    design using techniques like business model canvas, impact maps, and Wardley maps.


    *Chapter 4, Domain Analysis and Modeling,* continues the analysis and modeling
    of the sample problem domain – Letter of Credit (LC) application, using techniques
    like domain storytelling and everstorming to arrive at a shared understanding
    of the problem and brainstorm ideas to arrive at a solution.


    *Chapter 5, Implementing Domain Logic,* implements the command-driven API for
    the sample application. We will look at how we can employ an event-driven architecture
    to loosely coupled components. We will also look at how to implement structural
    and business validations and persistence options by contrasting state-state and
    event-sourced aggregates.


    *Chapter 6, Implementing the User Interface – Task-Based,* uses the **user interface**
    (UI) for the sample application. We will also express expectations of the UI to
    the service implementation.


    *Chapter 7, Implementing Queries,* dives deeper into how we can construct read-optimized
    representations of data by listening to domain events. We will also look at persistence
    options for these read models.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Preface xix


    Chapter 8, Implementing Long-Running Workflows, looks at implementing long-running
    user operations (sagas) and deadlines. We will also look at how we can keep track
    of the overall flow using log aggregation and distributed tracing. We will round
    off by looking at when/whether to choose explicit orchestration components of
    implicit choreography.


    Chapter 9, Integrating with External Systems, looks at integrating with other
    systems and bounded contexts. We will present the various styles of integration
    and the implications of choosing each of these.


    Chapter 10, Beginning the Decomposition Journey, decomposes the command and the
    query side of the sample-bounded context into distinct components. We will look
    at the trade-offs when making these choices.


    Chapter 11, Decomposing into Finer-Grained Components, looks at finer-grained
    decomposition and the trade-offs involved beyond technical implementations. We
    will decompose our application into distinct functions and discuss where it might
    be appropriate to draw the line.


    Chapter 12, Beyond Functional Requirements, looks at factors beyond business requirements
    that can play a significant role in how applications are decomposed. Specifically,
    we will examine the effect that cross-functional requirements when applying DDD.


    # To get the most out of this book


    This book is aimed at a wide range of software team members. Some amount of prior
    experience building software solutions is assumed. Code examples in the book use
    the Java programming language. Familiarity with OO and frameworks as Spring will
    be very helpful.


    | Software/hardware covered in the book | Operating system requirements |

    | Spring Framework | Windows, macOS, or Linux |

    | Axon Framework | |

    | JavaFX |


    If you are using the digital version of this book, we advise you to type the code
    or access the code from the book''s GitHub repository (a link is available in
    the next section). Doing so will help you avoid any potential errors related to
    the copying and pasting of code.


    # Download the example code files


    You can download the example code files for this book from GitHub at https://github.com/PacktPublishing/Domain-Driven-Design-with-Java-A-Practitioner-s-Guide.
    If there''s an update to the code, it will be updated in the GitHub repository.


    We also have other code bundles from our rich catalog of books and videos available
    at https://github.com/PacktPublishing/. Check them out!'
