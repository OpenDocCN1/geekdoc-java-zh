  md: '# Domain storytelling


    Scientific research now proven that learning methods that employ audiovisual aids
    assist both teachers and students in retaining and internalizing concepts very
    effectively. In addition, teaching what we have learned reinforces ideas and stimulate
    the formation of new ones.


    Domain storytelling is a collaborative modeling technique that combines a pictorial
    language, real-world examples, and a workshop format to serve a very simple, quick,
    and effective technique for sharing knowledge among team members. Domain storytelling
    is a technique invented and popularized by Stefan Hofer and Henning Schwentner,
    based on some related work at the University of Hamburg called cooperation pictures.


    A pictorial notation of the technique is illustrated in the following diagram:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_100_0.png)


    Figure 4.1 – Domain storytelling summarized'
  merge: -1
