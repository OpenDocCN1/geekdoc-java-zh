  md: 'Decomposing into Finer-Grained Components


    # Where to draw the line


    In general, the smaller the size of our bounded contexts, the easier it becomes
    to manage complexity. Does that mean we should decompose our systems into fine-grained
    a granularity as possible? On the other hand, having extremely fine-grained components
    can increase coupling to the extent where it is very hard to manage operational
    complexity. Hence, decomposing a system into well-factored, collaborating components
    can be a bit tricky, seeming to work more like an art rather than an exact science.
    There is no right or wrong answer here. In general, if things feel and become
    painful, you most likely got it more than right. There are some non-technical
    heuristics that might help guide this process:


    +   **Existing organization boundaries:** Look to align with current organizational
    structures. Identify which your business unit/department/team already owns and
    assign responsibilities in a manner that causes minimal disruption.


    +   **End-user roles:** What do your end users carry out? What enables them to
    do their work with the least friction? If too many people need to get involved
    in a piece of work, done may be a sign that the current decomposition is suboptimal.
    On the other hand, if it is hard to assign a task to a specific user, it may again
    be a sign of incorrect decomposition.


    +   **Change in vernacular:** Look for changes in the use of common terms (the
    ubiquitous language). Does someone call something that feels like in the physical
    world by different names? For example, a credit card be called "plastic," "payment
    instrument," and "account" by different people or the same people in a different
    context. The point at which the vernacular changes may be the time to split functionality.


    +   **Existing (modular/monolithic/distributed) applications:** How are your current
    applications segregated logically? How are they segregated physically? This might
    provide some inspiration.


    # Team organization


    All of the preceding techniques draw inspiration from existing constructs. What
    if one or more of the preceding are wrong/cumbersome/suboptimal? In such a case,
    our work as developers/architects is a bit more involved.


    It is also pertinent to note that it is uncommon to get domain boundaries wrong.
    Coming up with an initial breakdown that seems to make more sense and applying
    a series of if questions to answer suitability can help. If the reasoning is able
    to stand up to scrutiny by domain experts, architects, and other stakeholders,
    you may be in a good place. If you choose to go down this route, it may be prudent
    to adjust existing organizational structures to match your proposed architecture.
    This will help reduce friction (in other words, apply what is called the inverse
    Conway maneuver (https://thoughtworks.com/en-us/radar/techniques/inverse-conway-maneuver).'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'This style of team organization can be quite complex. The people at Spotify
    popularized the idea of a multidisciplinary, mostly autonomous team structure
    aligning closely along functional boundaries (called squads), as shown here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_257_0.png)


    Figure 11.11 - The Spotify model of team organization


    The team structure has other components such as chapters, tribes, and guilds,
    which enable a better flow of change, clarify team responsibilities, promote better
    intra- and inter-team collaboration, and so on. You can find out more about it
    in this: https://blog.crisp.com/wp-content/uploads/2012/11/SpotifyScaling.pdf.
    However, there is no one-size-fits-all approach, and you will need to account
    for your organizational structures and realities before looking to adapt to style.
    To find out more about the limitations of the Spotify model (https://www.youtube.com/watch?v=4GKIndTWbBY)
    and how you can arrive at a team organization that suits your requirements, you
    may want to take a look at the work done by Matthew Skelton and Manuel Pais in
    their popular book Team Topologies (https://teamtopologies.com/book/). On a related
    topic, it may also be helpful to look at the chapter on team design from the book
    Agile IT Organization Design (https://www.amazon.com/Agile-Organization-Design-Transformation-Continuous/dp/0139303354)
    by Sriram Narayan, where he talks about outcome-oriented versus activity-oriented
    themes.


    Despite all our diligence and noble intentions, it is still possible to get these
    boundaries wrong, or a change in business priorities or competitor offers may
    render decisions that appeared perfectly valid at the time become incorrect. Instead
    of looking to arrive at the perfect decomposition, it might be prudent to change
    and invest in building designs that are flexible while being prepared to evolve
    and refactor the architecture iteratively. This book on building evolutionary
    architectures has some great advice on how to do precisely: https://evolutionaryarchitecture.com/.'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'In order to attain a reasonable level of success, there will be a need to maintain
    a fine balance between how domains are modeled, what the team organizations are,
    and how applications are architected. When all of these are in agreement, it is
    likely that you get pretty close to achieving high levels of success, as depicted
    in the following diagram:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_258_0.png)


    Figure 11.12 – Forces influencing component decomposition


    As a general guideline, it helps to start with a coarse-grained decomposition
    at the outset when requirements and/or our understanding are likely still unclear,
    leaving finer-grained decomposition to a time when our understanding improves.'
