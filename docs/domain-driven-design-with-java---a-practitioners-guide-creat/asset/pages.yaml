  md: '# Increasing effectiveness


    When implementing integration using some form of IPC, a lot of the techniques
    discussed in the codebased implementation patterns section continue to apply.
    As discussed earlier, API documentation plays a significant role in reducing friction
    for customers. In addition, here are a few more techniques that apply specifically
    when using IPC-based integration:


    +   ** Typed protocols:** When working with this form of integration, it is important
    to minimize the amount of time to gather feedback on structural validations. This
    is especially critical when the supplier and the customer may be in a constant
    state of independent evolution. The use of typed protocols such as Protocol Buffers,
    Avro, Netflix''s Falcor, and GraphQL can make it easier for customers to interact
    with suppliers while maintaining a lightweight mechanism to validate requests
    are correct.


    > Note

    The key word is lightweight. It is pertinent to note that we are advising against
    the use of JSON-based HTTP APIs (typically advised as being RESTful), which do
    not enforce the use of an explicit schema. Neither are we promoting the use of
    (arguably) legacy protocols such as SOAP, WSDL, and CORBA. Each of these, being
    well-meaning, suffered from being fairly heavyweight.


    +   **Self-discovery:** As outlined previously, when working with an IPC-based
    integration mechanism, we should look to reduce the barrier to entry. When working
    with RESTful APIs, the use of HATEOAS (https://restful.net/hateoas), although
    difficult for suppliers to implement, can make it easier for customers to understand
    and consume APIs. In addition, making use of a service registry and/or a schema
    registry can further reduce consumer friction.


    +   **Contract tests:** In the spirit of fast and shifting left, the practice
    of contract testing and consumer-driven contracts can increase the quality and
    speed of integration. Tools such as Pact (https://pact.io/) and Spring Cloud Contract
    (https://spring.io/projects/spring-cloud-contract) make the adoption of these
    practices relatively simple.


    So, we''ve discussed implementation patterns, broadly categorized into data-based,
    code-based, and IPC-based integrations. Hopefully, this gives you a good start
    in consciously choosing the appropriate approach by considering the benefits and
    caveats that they bring along with them.'
  merge: -1
