  md: 'thought will need to be applied to arrive at a ubiquitous language that is
    applicable across the newly merged bounded context.


    +   Adjust internal domain models: Adoption of a common ubiquitous language primarily
    means making of a common domain model across the newly merged bounded context.
    This means that the aggregates, entities, and value objects need to be unified,
    which may require changes at the persistence layer. If either between these components,
    domain events may be candidates to be retired. At this stage, it may not be prudent
    to make changes to any public interfaces – specifically those exposed using an
    open-host service (for example, public HTTP APIs and other domain events).


    +   Adjust the public API design: As a final step, it will be to refactor redundant
    and inefficient public interfaces to conclude the exercise and derive the intended
    benefits.


    It is pertinent to note that this style of continuous improvement can be extremely
    challenging to adopt without the solid bedrock of a sound set of engineering practices,
    specifically the testing and deployment automation practices we discussed in this
    section.


    # Invocation style


    When integrating two bounded contexts that are running in distinct processes,
    there are two ways to consume interactions: synchronous and asynchronous.


    # Synchronous invocation


    The client blocks until the server provides a response. Optionally, implementations
    can choose to wait for an amount of time for the invoked operation to complete
    before timing out. An example of such interaction is a blocking HTTP call made
    to start a new LC application like so:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_274_0.png)


    Figure 12.4 – Synchronous invocation'
  merge: -1
