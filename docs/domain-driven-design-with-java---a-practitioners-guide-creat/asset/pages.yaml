  md: "# Implementing the query side 151\n\n3. We finally save the query model in\
    \ an appropriate query store. When persisting this data, we should consider storing\
    \ it in a form that is optimized for data access. In other words, we want to reduce\
    \ as much complexity and cognitive load when querying this data.\n\nThe @EventHandler\
    \ annotation should not be confused with the @EventSourcingHandler annotation\
    \ that we looked at in Chapter 5 Implementing Domain Logic. The @EventSourcingHandler\
    \ annotation is used to replay events and restore state when loading event-sourced\
    \ aggregates on the command side, whereas the @EventHandler annotation is used\
    \ to listen to events outside the context of the aggregate. In other words, the\
    \ @EventSourcingHandler annotation is used exclusively within aggregates, where\
    \ the @EventHandler annotation can be used anywhere there is a need to consume\
    \ data events. In this case, we are using it to construct a query model.\n\n#\
    \ Query-side persistence choices\n\nSegregating the query side enables us to choose\
    \ the persistence technology most appropriate for the problem being solved on\
    \ the query side. For example, if extreme performance and simple filtering criteria\
    \ are important, it may be prudent to choose an in-memory store such as Redis\
    \ or Memcached. If complex search/analytics requirements and large datasets are\
    \ to be supported, then we may want to choose something like Elasticsearch. Or\
    \ we may simply choose to stick with just a relational database. The point we\
    \ would like to emphasize is that employing CQRS affords a level of flexibility\
    \ that was previously unavailable to us.\n\n# Exposing a query API\n\nApplicants\
    \ like to view the LCs they created, specifically those in the draft state. Let's\
    \ look at how we can implement this functionality. Let's start by defining a simple\
    \ object to capture the query criteria:\n\n```\nimport org.springframework.data.domain.Pageable;\n\
    public class MyDraftLCQuery {\n    private ApplicantId applicantId;\n    private\
    \ Pageable page;\n    // Getters and setters omitted for brevity\n}\n```"
