  md: '# Global Internet Traffic


    This has also coincided with the rise of the internet.


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_33_0.png)


    Figure 1.7 – Global internet traffic


    This has meant that companies are being required to modernize their software systems
    much more rapidly than they ever have. Along all with this, the onset of commodity
    computing services, such as the public cloud, has led to a move away from expensive
    centralized computing systems to more distributed computing ecosystems. As we
    attempt to build our most complex solutions, monoliths are being replaced by an
    environment of distributed, collaborating microservices. Modern philosophies and
    practices, such as automated testing, architecture fitness functions, continuous
    integration, continuous delivery, DevOps, security automation, and infrastructure
    as code, to name a few, are disrupting the way we deliver software solutions.


    All these advances introduce their own share of complexity. Instead of attempting
    to control the amount of complexity, there is a need to embrace and cope with
    it.'
  merge: -1
