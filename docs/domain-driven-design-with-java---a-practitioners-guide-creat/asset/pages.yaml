  md: '# Implementing Domain Logic


    # Summary


    In this chapter, we used the outputs of the eventstoring session and used it as
    a primary aid to create a domain model for our bounded context. We looked at how
    to implement this using CQRS architecture pattern. We looked at persistence options
    and the implications of using event-sourced versus state-stored aggregates. Finally,
    we rounded off by looking at a variety of ways in which to perform business validations.
    We looked at all through a set of code examples, using Spring Boot and Axon Framework.
    With this knowledge, we should be able to implement robust, well-encapsulated,
    event-driven domain models.


    In the next chapter, we will look at implementing a UI for these domain capabilities
    and examine a few options, such as CRUD-based versus task-based UIs.


