    of these techniques is fairly lightweight and can be completed within a matter
    of a few hours. Each enables us to focus on the most impactful business areas
    and maximize ROI. In our experience, it is worth experimenting with more than
    one of these exercises (potentially all of them) as each can highlight a different
    facet of the business/user needs.


    # International trade products and services


    International trade is fraught with risk, which then presents a degree of uncertainty
    over the timing of payments between the seller (exporter) and the buyer (importer),
    especially due to a lack of trust between the parties involved. For exporters,
    until payment is received, all sales are gifts. Consequently, exporters prefer
    receiving payment as soon as the order is placed or at least before the goods
    are shipped. For importers, until the goods are received, all payments toward
    a purchase are donations. Consequently, importers prefer receiving goods as soon
    as possible and delaying payment until the goods are sold to generate enough money
    to pay the seller.


    This situation presents an opportunity for trusted intermediaries (such as KP
    Bank) to play a significant role in brokering international trade transactions
    in a secure manner. KP bank offers a number of products to facilitate international
    trade payments, as listed here:


    +   - Letter of credit (LC)

    - Documentary collections (DC)

    - Open account

    - Cash-in-advance

    - Consignments'
