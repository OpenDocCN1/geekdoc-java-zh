    Figure 5.8 - Typical entity relationship model


    Irrespective of whether we choose to use a relational database or a more modern
    NoSQL store – for instance, a document store, key-value store, column family store,
    and so on – the style we use to persist information remains more or less the same,
    which is to store the current values of the attributes of the said aggregate/entity.
    When the values of attributes change, we simply overwrite old values with newer
    ones; that is we store the current state of aggregates and entities – hence the
    name state-stored. This technique has served us well over the years, but there
    is at least one more mechanism that we can use to persist information. We will
    look at this in more detail.


    # Event-sourced aggregates


    Developers have been relying on logs for a variety of diagnostic purposes for
    a very long time. Similarly, relational databases have been employing commit logs
    to store information durably almost since their inception. However, developers’
    use of logs as a first-class persistence solution for information in mainstream
    systems remains extremely rare.'
  merge: -1
