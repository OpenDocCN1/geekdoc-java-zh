  md: "Sagas enable applications to maintain and transactional consistency when more\
    \ than one bounded context is required to complete the business functionality\
    \ without having to resort using distributed transactions. However, it does introduce\
    \ a level of complexity to the programming model, especially when it comes to\
    \ handling failures. We will look at exception handling in a more detail when\
    \ we discuss working with distributed systems in upcoming chapters. Let's look\
    \ at how flows when there are no explicit stimuli by looking at how deadlines\
    \ work.\n\n# Handling deadlines\n\nThus far, we have looked at deadlines that\
    \ are caused by human (for example, the applicant submitting an LC application)\
    \ or system (for example, the auto-approval of an LC application). However, in\
    \ an event-driven system, not all events occur due to an explicit human or stimulus.\
    \ Events may need to be emitted due to inactivity over a period of time or on\
    \ a recurring schedule based on prevailing conditions.\n\nFor example, let us\
    \ examine the case where the bank submitted LC applications to be decided as quickly\
    \ as possible. When applications are not acted upon by the trade finance managers\
    \ within 10 calendar days, the system should remind them.\n\nTo deal with this\
    \ inactivity, we need a means by which to trigger system actions (read:emit events)\
    \ based on the passage of time—or when actions perform a deadline expires. In\
    \ a happy path scenario, we either use the user or the system to take a certain\
    \ action. In such cases, we will need to account for cases where we will need\
    \ to trigger the scheduled to occur on deadline expiry. Let's look at how to test-this\
