  md: '# Serverless architecture


    Serverless architecture is an approach to software design that allows developers
    to build and run services without having to manage the underlying infrastructure.
    The advent of the AWS Lambda service has popularized this style of architecture,
    although other services (such as S3 and DynamoDB for persistence, SNS for notifications,
    and SQS for message queuing) existed long before Lambda was launched. While AWS
    Lambda provides a complete solution in the form of Functions as a Service (FaaS),
    these other services are as essential, if not more, in order to benefit from a
    serverless paradigm.


    In conventional DDD, bounded contexts are formed by grouping operations around
    an aggregate, which then informs how the solution is expected to be - unless within
    the confines of a single process. With a serverless paradigm, each task is expected
    to be deployed as an independent unit of its own. This requires that we look at
    how we aggregate and bounded contexts differently - centered around individual
    tasks or functions, as opposed to group of related tasks.


    Does that mean the principles of DDD to arrive at a solution do not apply? While
    a serverless paradigm introduces an additional dimension of treating fine-grained
    deployable services as first-class citizens in the modeling process, the overall
    process of applying DDD''s strategic and tactical design continues to apply. We
    will examine this in more detail in Chapter 11, Decomposing into Finer-Grained
    Components, when we will refactor the solution throughout this book to employ
    a serverless approach.


    # The big ball of mud


    Thus far, we have examined a catalog of named architecture styles along with their
    pitfalls and how applying DDD can help alleviate them. At the other extreme, we
    may encounter solutions that lack a perceivable architecture, famously known as
    the big ball of mud:


    > "A BIG BALL OF MUD is haphazardly structured, sprawling, sloppy, duct-tape and
    binding spaghetti spaghetti code. We''ve all seen them. These systems show unmistakable
    signs of unregulated growth, and repeated, expedient repair. Information is shared
    promiscuously among distant elements of the system, often to the point where nearly
    all the information becomes global or duplicated. The overall structure of the
    system may never have been well-defined. If it was, it may have eroded beyond
    recognition. Programmers with have a shred of architectural sensibility shun these
    quagmires. Only those who are unconcerned about architecture, and, perhaps, are
    comfortable with the inertia of the day-to-day chore of patching the holes in
    these failing dimes, are content to work on such systems"


    - Brian Foote and Joseph Yoder'
