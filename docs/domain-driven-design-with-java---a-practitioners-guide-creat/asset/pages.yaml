  md: '# Implementing the command side


    > Important Note

    CQRS is by means no silver bullet. Although it is general-purpose enough to be
    used in a variety of scenarios, it is a paradigm shift as applied to mainstream
    software problems. Like any other architecture decision, you should apply due
    diligence when choosing to adopt CQRS


    Let''s look at how this works in practice by implementing a representative sliver
    of the command side of the LC application using the Spring and Axon frameworks.


    # Implementing the command side


    In this section, we will focus on implementing the command side of the application.
    This is where we expect all the business logic of the application to be implemented.
    Logically, it looks like the following figure:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_115_0.png)


    The high-level sequence on the command side is described here:


    +   1. A request to mutate state (command) is received.

