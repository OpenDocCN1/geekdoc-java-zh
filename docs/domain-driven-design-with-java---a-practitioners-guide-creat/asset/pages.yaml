  md: 'What we looked at is an example of a very simple query implementation where
    we have a single @QueryHandler annotation to service the query results. This implementation
    returns as a real-time fetch. Let''s look at more complex query scenarios.


    # Advanced query scenarios


    Focus currently is on active LC applications. Maintaining issued LCs happens in
    a bounded bounced context of the scenario. Consider a scenario where we need to
    provide a consolidated view of currently active applications and issued LCs. In
    such a scenario, it is necessary to obtain this information by querying two distinct
    sources (ideally in parallel) - commonly referred to as the scatter-gather pattern.
    Please refer to the scatter-gather queries in the Aeron Framework documentation
    for more details.


    In other cases, we might want to stay up to dynamically changing data. For example,
    consider a real-time stock-ticker application tracking price changes. One way
    to implement this is to push price changes and when they occur - commonly referred
    to as the publish-subscribe pattern. Please refer to subscription queries in the
    Aeron Framework documentation for more details.


    # Historic event replays


    The example we have looked at thus far allows us to listen to events as they occur.
    Consider a scenario where we need to build a new query from historic events to
    satisfy an unanticipated new requirement. This requirement may necessitate the
    need to create a new query model, or in a more extreme case, a completely new
    bounded context. Another scenario might be when we may need to correct a bug in
    the way we have built an existing query model and now need to recreate it from
    scratch. Given that we have a record of all events that have transpired in the
    event store, we can use replay events to enable us to construct both new and/or
    existing query models with relative ease.


    > Important Note

    We used the term event replay in the context of reconstituting the state of event-sourced
    aggregate instances (discussed in the Event-sourced aggregates section in Chapter
    5, Implementing Domain Logic). The event replay mentioned here, although similar
    in concept, is still very different. In the case of a domain event replay, we
    work with a single aggregate root instance and only load events for that one instance.
    In this case, though, we will likely work with events that span more than one
    aggregate.


    Let''s look at the different types of replays and how we can use each of them.'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# Types of replays


    When replaying events, there are at least two types of replays, depending on the
    requirements we need to meet. Let''s look at each type in turn:


    +   - Full event replay: This is where we replay all the events in the event store.
    This can be used in a scenario where we need to support a completely new bounded
    context that this is dependent on its subdomain. This can also be used in cases
    where we need to support a newly query model or reconstruct an existing, erroneously
    built query model. Depending on the number of events in the event store, this
    can be a fairly long and complex process.

    - Partial/ad hoc event replay: This is where we replay all the events on a subset
    of aggregate instances or a subset of events on all aggregate instances, or a
    combination of both. When working with partial event replays, we will need to
    specify filtering criteria to select subsets of aggregate instances and events.
    This means that the event store needs to have the flexibility to support these
    use cases. Using specialized event store solutions (such as Axon Server and EventStoreDB,
    to name a couple) can be extremely beneficial.


    # Event replay considerations


    The ability to replay events and create new query models can be invaluable. However,
    like everything else, there are considerations that we need to keep in mind when
    working with replays. Let''s examine some of these in detail.


    # Event store design


    As mentioned in Chapter 5, Implementing Domain Logic, when working with event-sourced
    aggregates, we must persist immutable in the persistence store. The primary use
    cases that we need to support as follows are:


    +   - Provide consistent and predictable write performance when acting as an append-only
    store.

    - Provide consistent and predictable read performance when querying for events
    using the aggregate identifier.


    However replays (especially partial/ad hoc) require the event store to support
    much richer querying capabilities. Consider a scenario where we found an issue
    where the amount is incorrectly reported for LCs that were approved during a certain
    period time and for any certain currency. To fix this issue, we need to do the
    following:


    +   1. Identify affected LCs from the event store.

    2. Fix the issue in the application.

    3. Reset the query store for these affected aggregates.

    4. Do a replay of a subset of events for the affected aggregates and reconstruct
    the query model.'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'Identifying affected aggregates from the event store can be tricky if we don''t
    support querying capabilities that allow us to introspect the event payload. Even
    if this kind of ad hoc querying were to be supported, these queries can adversely
    impact the command-handling performance of the event store. One of the primary
    reasons to use CQRS was to make use of query-stores for complex read scenarios.


    Event replays seem to introduce a chicken and egg problem when the query store
    has an issue that can only be corrected by querying the event store. A few options
    to mitigate this issue are:


    +   - General purpose store: Choose an event store that offers predictable performance
    for both scenarios (command handling and replay querying).

    - Built-in datastore replication: Make use of read replicas for event replay querying.

    - Distinct datastores: Make use of two distinct datastore to solve each problem
    on its own (for example, a relational database/key-value store for command handling
    and a search-optimized document store for event replay querying).


    > ### Important Note

    Do not that the distinct datastore approaches for replays is needed to satisfy
    an operational problem as opposed to query-side business cases discussed earlier
    in this chapter. Arguably, it is more complex because the technology team on the
    command side has to be equipped to maintain more than one database technology.


    # Event design


    Event replays are required to reconstit the state from an event stream. In this
    article on what it means to be event-driven (https://martinfowler.com/articles/201701-eventdriven.html),
    Martin Fowler talks three different styles of events. If we employ the carried-state-transfer
    approach (Martin''s approach) to constitute state, it might require us to replay
    the latest event for a given aggregate, as opposed to replaying all the events
    for that aggregate in order of occurrence. While this may seem convenient, it
    also has its downsides:


    +   - All events may now require a lot of additional information that may not
    be relevant to that event. Assembling all this information when publishing the
    event can add to the cognitive complexity on the command side.

    - The amount of data needs to be stored and flow through the wire can increase
    drastically.

    - On the query side, it can increase cognitive complexity when understanding the
    structure of the event and processing it.


    In a lot of ways, this leads back to the CRUD-based task-based approach for APIs
    discussed in Chapter 5, Implementing Domain Logic. Our general preference is to
    design events with a lean payload as possible. However, your experiences may be
    different, depending on your specific situation.'
  merge: -1
