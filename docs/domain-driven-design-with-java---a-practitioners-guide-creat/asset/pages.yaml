  md: '# Tracing


    Imagine a situation where an applicant submitted an LC application through the
    UI. When all goes well, within a few milliseconds, the applicant should get a
    notification of successful submission as shown here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_282_0.png)


    Figure 12.8 – Submit LC application flow


    Even in this simple example, there are several components involved, each of which
    produces logs of its own. When an engineer is to diagnose an issue, there is a
    need to introduce a correlation identifier as close to the start of the interaction
    and usually propagate it across component boundaries. Furthermore, log entries
    in each component need to carry this correlation identifier as they produce logs.
    Doing this will allow us to view log entries spanning process boundaries using
    the correlation identifier as a unifying thread. In technical terms, the entire
    flow is called a trace, and each segment within the flow is called a span. This
    process of instrumenting log entries with such information is termed distributed
    tracing.


    As evident here, user flows – and usually span more than one bounded context.
    For this to work effectively, bounded contexts need to agree on propagating trace
    and span identifiers uniformly. Tools such as Spring Cloud Sleuth and OpenTracing
    can help simplify implementation for teams using disparate technology stacks.'
  merge: -1
