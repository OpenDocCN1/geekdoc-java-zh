  md: '# # What is DDD?


    Life is really simple, but we insist on making it complicated.


    > — Confucius


    In the previous section, we saw how a myriad of reasons, coupled with system complexity,
    gets in the way of software project success. The idea of DDD, originally conceived
    by Eric Evans in his 2003 book, is an approach to software development that focuses
    on expressing software solutions in the form of a model that embodies the core
    of the problem being solved. It provides a set of principles and systematic techniques
    to analyze, architect, and implement software solutions in a manner that enhances
    the chances of success.


    Evans'' work is indeed seminal, ground-breaking, and well ahead of its time, it
    is not prescriptive at all. This is a strength in that it has enabled the evolution
    of DDD beyond what Evans had conceived at the time. On the other hand, it also
    makes it extremely to define what DDD actually encompasses, making practical application
    a challenge. In this section, we will look at some foundational terms and concepts
    behind DDD. Elaboration and practical application of these concepts will happen
    in upcoming chapters of this book.


    When encountering a complex business problem, DDD suggests the following:


    +   - Understand the problem: To have a deep, shared understanding of the problem,
    it is necessary for business and technology experts to collaborate closely. Here,
    we collectively understand what the problem is and why it is valuable to solve.
    This is termed the domain of the problem.


    +   - Break down the problem into more manageable parts: To keep complexity at
    manageable levels, break down complex problems into smaller, independently solvable
    parts. These parts are subdomains. It may be necessary to further break down subdomains
    where the subdomain is still complex. Assign explicit boundaries to limit the
    functionality of each subdomain. This boundary is termed the bounded context for
    that subdomain. It may also be convenient to think of the subdomain as a context
    that makes more sense to the domain experts (in the problem space), whereas the
    bounded context is a context that makes more sense to the technology experts (in
    the solution space).


    +   - For each bounded context, do the following:


    +   - Agree on a shared language: Formalize the understanding by establishing
    a shared language that is applicable unambiguously within the bounds of the subdomains.
    This shared language is termed the ubiquitous language of the domain.


    +   - Express understanding in shared models: In order to produce working software,
    express the ubiquitous language in the form of shared models. This model is termed
    the domain model. There may exist multiple variations of this model, each meant
    to clarify a specific aspect of the solution, for example, a process model, a
    sequence diagram, working code, and a deployment topology.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# The Rationale for Domain-Driven Design


    +   - Embrace the incidental complexity of the problem: It is important to note
    that it is not possible to shy away from the essential complexity of a problem.
    By breaking down the problem into subdomains and bounded contexts, we are attempting
