  md: '# 148 Implementing Queries


    The high-level sequence on the query side is described here:


    +   1. An event listening component listens to these domain events published on
    the event bus.

    2. It constructs a purpose-built query model to satisfy a specific query use case.

    3. This query model is persisted in a datastore optimized for read operations.

    4. This query model is exposed in the form of an API.


    Note there can exist more than one query side component for handling respective
    scenarios.

    Let''s implement each of these steps to see how this works for our LC issuance
    application.


    # Tooling choices


    In a CQRS application, there is a separation between the command and query sides.
    At this time, this separation is logical in our application because both the command
    and query sides are running as components within the same application process.
    To illustrate the concepts, we will use conveniences provided by Axon Framework
    to implement the query side in this chapter. Chapter 10, Beginning the Decomposition
    Journey, we will look at how it may not be necessary to use a specialized framework
    (such as Axon) to implement the query side.


    When implementing the query side, we have two concerns to address, as depicted
    in the following diagram:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_170_0.png)


    Figure 7.3 – The query side dissected'
