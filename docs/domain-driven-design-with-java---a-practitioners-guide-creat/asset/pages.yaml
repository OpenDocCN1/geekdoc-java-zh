  md: '240 Beyond Functional Requirements


    By the end of this chapter, we will have learned about various aspects of the
    software life cycle to create a robust solution from a cross-functional perspective.
    We will also discuss additional features that we need to add to make our solution
    performant, scalable, resilient to failure, and gain the ability to make changes
    reliably, repeatably, and rapidly. Furthermore, we will examine the implications
    of making these changes and the potential impacts this may have on our bounded
    contexts and their boundaries.


    Let''s begin!


    # Observability


    In previous chapters, we saw how it is possible to break down an existing application
    along bounded context boundaries. We also saw how it is possible to split bounded
    contexts to be extremely fine-grained, as physically separate components. Failure
    in any of these components can cause disruptions in others that are dependent
    on them. Obviously, early detection and more importantly attribution to specific
    components through a combination of proactive and reactive monitoring can ideally
    prevent, at the very least, minimize business disruption.


    When it comes to monitoring, most teams seem to think of technology runtime metrics
    that we associate with components (such as CPU utilization, memory consumed, queue
    depths, exception count, and so on).


    To make it more formal, we use the terms Service-Level Objectives (SLOs) and Service-Level
    Indicators (SLIs) specified within a Service-Level Agreement (SLA) to mean the
    following:


    * SLO: An agreement between the provider and customer about a specific measurable
    metric. For example, 99.99% uptime, 100 ms response time for 10 concurrent users
    for requests in the 99th percentile, and so on.

    * SLA: A collection of SLOs.

    * SLI: The actual numbers against an SLO. For example, your system might have
    an uptime SLI of 99.95%.


    # Technology metrics


    When it comes to monitoring, most teams seem to think of technology runtime metrics
    that we associate with components (such as CPU utilization, memory consumed, queue
    depths, exception count, and so on).'
  merge: -1
  pgno: 262
- img_proc: true
  md: 'Observability 241


    However, it is just much as not more important to be able to associate a set of
    business-relevant metrics (such as the number of LC applications submitted in
    the last hour, the number of LC applications rejected, and so on) and DevOps metrics
    (such as lead time, mean to restore, and so on).


    # Business metrics


    An inability to associate and monitor business SLIs with a component may be an
    indicator of the component being too fine-grained. On the flip side, if there
    are too many business SLIs associated with a single component that is of interest
    to a multitude of business stakeholder groups, it may indicate that a more fine-grained
    decomposition may be justified. At the end of the day, the monitoring apparatus
    we have in place should be to tell us if we are violating/exceeding SLOs.


    # DevOps metrics


    The DevOps Research and Assessment (DORA) research foundation has published an
    online quickcheck (https://www.devops-research.com/quickcheck.html) tool and report
    (https://www.devops-research.com/research.html) to provide information on how
    organizations compare with industry peers and how to make progress toward elite
    status. While discussing the full nuance of what it takes to establish a long-term
    culture of continuous improvement is out of scope for this book


    +   **Lead time**: How long does it take to go from code committed to code successfully
    running in production?


    +   **Deployment frequency**: How often does your organization deploy code to
    production or release to it users?


    +   **Time to restore**: How long does it generally take to restore service when
    a service incident or a defect that impacts users occurs?


    +   **Change frequency**: What percentage of changes to production or releases
    to users results in degraded service?


    When it comes to observability, there is the risk of focusing on specific metrics
    in isolation and missing the forest for the trees. To avoid metrics being misused
    and, more importantly, the risk of drawing incorrect conclusions, we recommend
    the following:


    +   **Take a holistic view**: Focusing more or less on all aspects of the delivery
    cycle as opposed to focusing on just a particular area can go a long way. If you
    are able to integrate information from planning, requirements intake, development,
    build, test, deploy, and feedback from running production systems, then you may
    be able to conclude reasonably that you have a high-performing team.'
