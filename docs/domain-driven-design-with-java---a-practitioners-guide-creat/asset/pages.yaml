  md: '# Modern systems and dealing with complexity


    > We cannot solve our problems with the same level of thinking that created them.


    > — Albert Einstein


    As we saw in the previous section, there are several reasons why software endeavors
    fail. In this section, we will try to understand how software gets built, what
    the currently prevailing realities are, and what adjustments we need to make in
    order to cope.


    # How software gets built


    Building successful software is an iterative process of constantly refining knowledge
    and expressing it in the form of models. We have attempted to capture the essence
    of the process at a high level here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_31_0.png)


    Figure 1.5 – Building software is a continuous refinement of knowledge and models


    Before we express a solution in working code, it is necessary to understand what
    the problem entails, why the problem is important to solve, and finally, how it
    can be solved. Irrespective of the methodology used (waterfall, agile, and anything
    in between), the process of building software is one where we need to constantly
    use our knowledge to refine mental/conceptual models to be able to create valuable
    solutions.'
  merge: -1
