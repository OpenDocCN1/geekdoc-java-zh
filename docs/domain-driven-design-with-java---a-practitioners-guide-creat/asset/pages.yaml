  md: "# Implementing Domain Logic\n\n+   - enables going back in time to be able\
    \ to create ad hoc views and reports without having to deal with upfront complexity.\n\
    \nOn the flip side, there are some challenges that you might have to consider\
    \ when implementing an event-sourced solution:\n\n+   - sourcing requires a paradigm\
    \ shift, which means that development and business teams will have to spend time\
    \ and effort understanding how it works.\n\n+   - The persistence model does not\
    \ store state directly. Then that ad hoc querying directly on the persistence\
    \ model can be a lot more challenging. can be achieved by materializing new views;\
