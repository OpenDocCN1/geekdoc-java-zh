  md: '# 26 The Rationale for Domain-Driven Design


    Note

    Conway’s law asserts that organizations are constrained to produce application
    designs that are copies of their communication structures. Your current organizational
    structures may not be optimally aligned to your desired solution approach. The
    inverse Conway may be applied to achieve isomorphism with the business architecture.
    Whatever the method used to decompose a problem into a set of bounded contexts,
    care be taken to make sure that the coupling between them is kept as low as possible.


    While bounded contexts ideally need to be as independent as possible, they may
    still need to communicate with each other. When using DDD, the system as a whole
    can be represented as a set of bounded contexts that have relationships with each
    other. These relationships define how these bounded contexts can integrate with
    each other and are called context maps. A sample context map is shown here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_48_0.png)


    The context map shows the bounded contexts and the relationship between them.
    These relationships can be a lot more nuanced than what is depicted here. We will
    discuss context maps and communication patterns in Chapter 9, Integrating with
    External Systems.'
