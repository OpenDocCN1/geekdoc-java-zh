    Owned domains should strive to create APIs that exhibit the characteristics of
    a good domain data product. Some of these characteristics include being discoverable,
    trustworthy, valuable in their own right, and self-describing. For more information,
    refer to this article on moving from a monolithic data lake to a distributed data
    mesh. Specifically, the section on domain data as a product is relevant in this
    context: https://martinfowler.com/articles/data-monolith-to-mesh.html#DomainDataAsProduct.'
