  md: '# 10

    Beginning the Decomposition Journey


    A distributed system is one in which the failure of a computer you didn''t know
    existed existed can render your own computer unusable.


    > — Leslie Lamport


    So far, we have a working application for Letter of Credit (LC) application processing,
    which is bundled along with other components as a single package. Although we
    have discussed the idea of subdomains and bounded contexts, the separation between
    these components is logical rather than physical. Furthermore, we have primarily
    focused on the LC Application Processing aspect of the overall solution.


    In this chapter, we will look at how to extract the LC Application Processing
    bounded context into a component that is physically disparate and,, enables us
    to deploy independently of the rest of the solution. We will discuss the various
    options that are available to us, the rationale for choosing a given option, and
    the implications that we need to be cognizant of.


    In this chapter, we will cover the following topics:


    +   - Continuing our design journey

    - Decomposing the monolith

    - Changes to frontend interactions

    - Changes in database interactions


    By the end of this chapter, you will have learned what it takes to design well-factored
    APIs—both remote procedure calls and event-based. For event-based APIs, you will
    gain an understanding of the various guarantees that might be needed to create
    robust solutions. Finally, you will also learn how to manage consistency when
    using multiple data stores.'
