  md: '# Architecture styles 47


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_69_0.png)


    In this example, Place Order might require us to coordinate with other components
    through the application layer and apply complex business invariants, while operating
    within the purview of an ACID transaction. Similarly, Cancel Order might require
    applying business invariants within an ACID transaction without any additional
    coordination – obviating the need for the application layer, in this case. However,
    Search Orders might require us to simply fetch data from a query-optimized view.
    This style makes use of a horses-for-course approach to layering that may help
    alleviate some anti-patterns slice listed previously when implementing a plain
    vanilla layered architecture.


    # Considerations


    Vertical slice architecture affords a lot of flexibility when implementing a solution
    – taking into consideration the specific needs of the case being implemented.
    Without some level of governance, this may quickly devolve into a big ball of
    mud, with layering decisions being seemingly arbitrarily, based on personal preferences
    and experiences (or lack thereof). As a sensible default, you may want to consider
    a distinct layering strategy for commands and queries. Beyond that, non-functional
    requirements dictate how you may need to deviate from here. For example, you may
    need to bypass layers to meet performance SLAs for certain cases.


    Figure 2.8 - Vertical slice architecture'
