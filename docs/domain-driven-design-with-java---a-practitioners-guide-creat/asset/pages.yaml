  md: '# The Rationale for Domain-Driven Design


    # Factories


    In order to work with aggregates and value objects, instances of these need to
    be constructed. In simple cases, it might suffice to use a constructor to do so.
    However, aggregate and value object instances can become complex depending on
    the amount of state they encapsulate. In such cases, it may be better to consider
    delegating object construction responsibilities to a factory external to the aggregate/value
    object. We may use the static factory method, builder, and dependency injection
    commonly in our day-to-day work. Joshua Bloch discusses several variations of
    this pattern in Chapter 2, Where and How Does DDD Fit?


    # Services


    When working within the confines of a single bounded context, the public interface
    (commands) of the aggregate provides a natural API. However, more complex business
    operations require interacting with multiple bounded contexts and aggregates.
    In other words, we may find ourselves in situations where certain business operations
    do not fit naturally with any single aggregate. Even if interactions are limited
    to a single bounded context, there may be a need to expose that functionality
    in an implementation-neutral manner. In such cases, you may consider the use of
    objects called services. In we at least three cases:


    +   - Domain services: To enable coordinating operations among more than one aggregate
    - for example, transferring money between two checking accounts at a retail bank.

    - Infrastructure services: To enable interactions with a utility that is not core
    to the business - for example, logging and sending emails at the retail bank.

    - Application services: To enable coordination between domain services, infrastructure
    services, and other application services - for example, sending email notifications
    after a successful inter-account money transfer.


    Services can also be stateful or stateless. It is best to allow aggregates to
    manage state, making use of repositories, allowing services to coordinate and/or
    orchestrate flows. In complex cases, there may be a need to manage the state of
    the flow itself. We will look at more concrete examples in Part 2 of this book.


    It may become tempting to implement business logic almost exclusively using services—inadvertently
    leading to the anemic domain model anti-pattern (https://martinfowler.com/bliki/AnemicDomainModel.html).
    It is worthwhile striving to encapsulate business logic within the confines of
    aggregates as a default.'
  merge: -1
