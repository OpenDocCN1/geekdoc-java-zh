  md: '# Understanding international trade strategy at KP Bank 67


    Creating a business model canvas can prove challenging if you do not have an existing
    product already,which is usually true in the case of start-ups or existing enterprises
    expanding into new business areas. In cases, a variation in the form of the lean
    canvas is worth exploring.


    # The lean canvas


    A variation of the business model canvas called the lean canvas was conceived
    by Ash Maurya for lean startups. In contrast to the business model canvas, the
    main emphasis is first and foremost elaborate on the problem that needs to be
    solved and explore potential solutions. In order to make the canvas actionable,
    it is to capture items that were most uncertain and/or risky. This is pertinent
    to businesses operating under high uncertainty (which is usually true for start-ups).
    Similar to DDD, it encourages you to focus on an issue as the starting point for
    building a business.


    Structurally, it is similar to the business model canvas, with the following differences:


    +   * Problems instead of key partners: It is common for businesses to fail due
    to them misunderstanding the problem they are solving. The rationale for replacing
    the key partners block is when you are an unknown entity looking to establish
    an unproven product, pursuing key partnerships may be premature.

    * Solutions instead of key activities: It is important to try more than one solution
    iteratively and respond to feedback. Key activities are removed because they are
    usually a by-product of the solution.

    * Key metrics instead of key resources: It is very important to know that we are
    progressing in the right direction. It is advisable to focus on a small number
    of Key metrics instead of enabling pivoting quickly if needed. Key resources have
    become relatively easy (with the advantage of the cloud and the availability of
    market frameworks). Furthermore, they may appear in the Unfair advantage box,
    which we will discuss next.

    * Unfair advantage instead of customer relationships: This clearly establishes
    our differentiators that are hard to replicate: This is closely aligned to the
    idea of the core subdomain that discussed in Chapter 1, The Rationale for Domain-Driven
    Design, and gives us a clear picture of what we need to focus our energies on
    at the outset.'
