  md: 'Towards the ideal of creating a practitioner''s guide, the book also covers
    engineering practicalities such as logging, testing, versioning, and a host of
    other practical considerations. Though these areas may fall outside the scope
    of the DDD book, teams need them.


    DDD offers a host of conceptual ideas but lacks implementation details. This book
    serves as an excellent bridge between abstract and implementation. While the focus
    is on Java, the content is broad enough for any practitioner to get a good overview
    of the many important considerations for DDD projects. In fact, each specific
    technology stack would benefit from having a practitioner''s guide such as this
    one.


    > - Neal Ford

    Director/Software Architect / Meme Wrangler

    Thoughtworks, Inc.'
