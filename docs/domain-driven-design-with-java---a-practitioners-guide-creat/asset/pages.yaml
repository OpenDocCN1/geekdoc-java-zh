  md: 'Ever since my first encounter with Domain-Driven Design (DDD) in 2008, I have
    been convinced that this is how to approach the design of complex systems or systems
    in complex environments. While DDD gives an excellent foundation, I have found
    that the combination with Command-Query Responsibility Separation (CQRS) can be
    even more powerful, albeit challenging to implement.


    The library of examples that I started to publish in 2009 evolved into Axon Framework,
    as early adopters sharing their experiences using it. One of those adopters was
    Prem, and it is in a large and complex project at a financial institution.


    With the rising popularity of microservices, DDD and CQRS have shown to be essential
    design principles. Someone once jokingly said: "there are three types of developers
    implementing microservices. Those who use DDD, those who don''t realize they do,
    and those who fail." With the demand for more real-time systems and the rise in
    popularity of event-driven systems, Event Sourcing also gained more traction and
    these events as the very starting point for exploring a system''s behavior.


    While I consider the famous *Blue Book* by Eric Evans a masterpiece that aged
    very well, it also stays very much in the abstract. Over the years, concepts,
    concepts and practices have been refined and adapted to changes in how we use
    technology. These concepts and practices are described in numerous resources scattered
    across the internet, making them hard to find and distill for those venturing
    into these realms for the first time. Prem and Karthik do an outstanding job of
    taking you on the journey from the essential concepts of Domain-Driven Design,
    via the design practices, to the actual implementation of a system. Their complete
    and pragmatic approach makes this book an excellent starting point for anyone
    exploring new approaches to complex design. It''s the book I wish I had when I
    started my journey.


    > - Allard Buije

    CTO and Founder of AxonIQ


    # Creator of Axon Framework'
