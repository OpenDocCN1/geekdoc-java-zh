  md: '# What is DDD? 19


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_41_0.png)


    Figure 1.14 - Core domain erosion


    To continue running a successful operation, it is required to constantly innovate
    at the core. For example, when AWS started the cloud computing business, it only
    provided simple infrastructure (IaaS) solutions. However, as competitors such
    as Microsoft and Google started to catch up, AWS had to provide several additional
    value-added services (for example, PaaS and SaaS).


    As is evident, this is not just an engineering problem. It requires a deep understanding
    of the underlying business. That’s where domain experts can play a significant
    role.


    # Domain and technical experts


    Any modern software team requires expertise in at least two areas—the functionality
    of the domain and the art of translating it into high-quality software. In most
    organizations, these exist as at least two groups of people:


    +   **Domain experts**: Those who have a deep and intimate understanding of the
    domain. Domain experts are *subject-matter experts* (SMEs) who have a very strong
    grasp of the business. Domain experts may have varying degrees of expertise. Some
    SMEs may choose to specialize in specific subdomains, others who may have a better
    understanding of the overall business works.


    +   **Technical experts**: On the other hand, enjoy solving specific, quantifiable
    computer science problems. Often, technical experts do not feel it is worth their
    to understand the context of the business they work in. Rather, they seem overly
    eager to only enhance their technical skills that are a continuation of their
    learnings in academia.'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# The Rationale for Domain-Driven Design


    While the domain experts specify the why and the what, technical experts (software
    engineers) largely help realize the how. Strong collaboration and synergy between
    both groups are essential to ensure sustained high performance and success.


    # A divide originating in language


    While strong collaboration between these groups is necessary, it is important
    to appreciate that these groups of people seem to have distinct motivations and
    differences in thinking. Seemingly this may appear to be restricted to simple
    things such as differences in their day-to-day language. However, deeper analysis
    usually reveals a much larger divide in aspects such as goals and motivations.
    This is illustrated in the figure:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_42_0.png)


    # Domain Experts


    +   * Premium checking account feature

    * Increase liquidity

    * Increase customer base


    # Technical Experts


    +   * Concurrency control

    * ACID transactions

    * Frameworks and design patterns


    # Problem domain


    # Solution domain


    Figure 1.15 - Divide originating in language


    This is a book primarily focused on technical experts. Our point is that it is
    not possible to be successful by just working on technically challenging problems
    without gaining a sound understanding of the underlying business context.


    Every decision we take regarding the organization, be it requirements, architecture,
    or code, has business and use consequences. In order to conceive, architect, design
    build and evolve software effectively, our decisions need to aid in creating the
    optimal business impact. As mentioned, this can only be achieved if we have a
    clear understanding of the problem we intend to solve. This leads us to the realization
    that there exist two distinct domains when arriving at the solution for a problem.'
  merge: -1
