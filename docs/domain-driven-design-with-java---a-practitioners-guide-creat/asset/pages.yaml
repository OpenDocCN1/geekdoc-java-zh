    \ or Logstash's default format (https://github.com/logstash/logstash-logback-encoder#standard-fields).\n\
    \n# Log aggregation\n\nThe fact that our applications are decomposed into multiple\
    \ components which each usually running multiple instances means that this can\
    \ produce a lot of logs that are disconnected from each other. To be able to work\
    \ with these logs meaningfully, we need to aggregate and sequence them chronologically.\
    \ It may be worth considering the use of a formal log aggregation solution for\
    \ this purpose. Using a structured logging solution as previously discussed can\
    \ go any when working with logs from multiple systems.\n\n> Note\nFor more information\
    \ on logging practices, please refer to this logging cheats from OWASP (https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Logging_Cheat_Sheet.md)\
    \ and also this article on the art of logging (https://www.codeproject.com/Articles/42354/The-Art-of-Logging).\n\
    \nAggregating logs in one place allows us to view diagnostic information from\
    \ multiple applications. However, we still need to correlate this information\
    \ when in the midst of a flow. Distributed tracing solutions can help with this.\
    \ Let's look at this next."
