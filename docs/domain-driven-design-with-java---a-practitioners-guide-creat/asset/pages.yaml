  md: '# 54 Where and Does DDD Fit?


    # Volume imbalance between reads and writes


    In most systems, read operations outnumber write operations by significant orders
    of magnitude. For example, consider the number of times a trader checks stock
    prices versus the number of times they actually transact (buy or sell stocks).
    It is usually true that write operations are the ones that make businesses money.
    Having a single model for both reads and writes in a system with a majority of
    read operations can overwhelm a system to an extent where write performance can
    become affected.


    # A need for multiple read representations


    When working with relatively complex systems, it is uncommon to require more than
    one representation of the same data. For example, when looking at personal health
    data, you may want to look at a daily, weekly, or monthly view. While these views
    can be computed on the fly from the raw data, each transformation (aggregation,
    summarization, and so on) adds to the cognitive load on a system. Often, it is
    not possible to predict ahead of the nature of these requirements. Extension,
    it is not feasible to design a single canonical model that can provide answers
    to all these requirements. Creating domain models specifically designed to meet
    a focused set of requirements can be much easier.


    # Different security requirements


    Managing the authorization of and access requirements to data/APIs when working
    with a single model can become cumbersome. For example, higher levels of security
    may be desirable for debit operations in comparison to balance equities. Having
    distinct models can considerably ease the complexity of designing fine-grained
    authorization controls.


    # More uniform distribution of complexity


    Having a model dedicated to serving only command-side use cases means that they
    can now be focused toward a single concern. For query-side use cases, we create
    models as needed that are distinct from the command-side model. This helps spread
    complexity more uniformly over a larger surface area as opposed to increasing
    the complexity on a single model that is used to serve all cases. It is worth
    noting that the essence of DDD is mainly to work effectively with complex systems,
    and CQRS fits well with this line of thinking.


    > Note\When working with a CQRS-architecture, choosing the persistence mechanism
    for the command side is a key decision. When junction with event-driven architecture,
    you could choose to persist aggregates as a series of events (ordered in the sequence
    of their occurrence). This style of persistence is known as event sourcing. We
    will cover this in more detail in Chapter 5, Implementing Domain Logic, in the
    Event-sourced aggregates section.'
