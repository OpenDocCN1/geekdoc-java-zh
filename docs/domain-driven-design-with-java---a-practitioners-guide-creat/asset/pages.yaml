  md: 'Dependency management: Given that teams may need to ultimately deploy the application
    as a unit, managing dependencies between individual modules may become cumbersome.
    This may manifest itself in the form of conflicting dependency versions, leading
    to unpredictable and inefficient runtime behavior and performance. For example,
    two teams may use different versions of the same library, which may add to the
    overall payload that gets downloaded to the browser. In addition to being wasteful,
    this may also result in unpredictable, hard-to-diagnosis errors, and eventually,
    poor customer experience.


    Inconsistent user experiences: Although we may split the application in a seemingly
    logical manner, if we do not it in a manner that is transparent to the users,
    it may result in a confusing and likely frustrating experience. To mitigate this,
    there may be a need to build common assets, widgets, and so on., which may further
    add to the overall complexity and coordination required when shipping out the
    product.


    If we proceed to continue decomposing our application as suggested previously,
    our application will end up looking like the diagram shown here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_255_0.png)


    As we saw, there are multiple ways to approach decomposing an application into
    finer-grained components. Just because it is possible to do it, it doesn’t mean
    that we should. Let’s look at when decomposition starts to become too expensive
    to sustain productivity.'
