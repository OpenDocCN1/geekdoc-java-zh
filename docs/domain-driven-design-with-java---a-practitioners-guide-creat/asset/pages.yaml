  md: '# 206 Beginning the Decomposition Journey


    When designing a remote API, we have the option of choosing a format that enforces
    a schema (for example, protocol buffers or Avro) or something less formal as JSON.
    In such cases, in order to stay true to the ubiquitous language, the process might
    have to include additional governance in the form of more formal design and code
    reviews, documentation, and more.


    # Compatibility and versioning


    As requirements evolve, there will be a need to enhance the interfaces to reflect
    these changes. This will mean that our ubiquitous language will also change over
    time, rendering old concepts obsolete. The general principle is to maintain backward
    compatibility with consumers for as long as possible. But this comes at the cost
    of having to maintain old and new concepts together—leading to a situation where
    it can become hard to tell what is relevant versus what is not. Using an explicit
    versioning strategy can help manage this complexity to an extent—where newer versions
    might be able to break backward compatibility with older ones. However, it is
    also not feasible to continue supporting a large number of incompatible versions
    indefinitely. Hence, it is important to make sure that the versioning strategy
    makes deprecation and retirement agreements explicit.


    # REST APIs


    We recognize that there are several options when exposing web-based APIs, and
    claims of using a REST approach seem quite common these days. REST was coined
    by Roy Fielding as part of his doctoral dissertation. The idea of what constitutes
    REST has been a matter of debate and, arguably, remains ambiguous even today.
    Leonard Richardson introduced the notion of a maturity model for HTTP-based APIs
    that somewhat helped provide clarity. The model describes broad conformance to
    REST in four levels, with each level being more mature than the preceding one:


    +   0. Adhoc: Where APIs are designed without the use of any perceptible structure.


    +   1. Resources: Where APIs are designed around a thing that makes sense on its
    own (this is a noun). Here, a small subset of verbs (either a GET or a POST) could
    be used to model all operations.


    +   2. HTTP verbs: Where APIs are designed by making use of a standard set of
    operations that can be performed on a resource (for example, GET for reads, POST
    for creates, PUT for updates, DELETE for deletes, and more).


    +   3. HATEOAS: Where APIs include hypermedia links to help discover our API in
    a self-service manner.


    In our experience, most service-based solutions that claim to be RESTful seem
    to stop at level 2. Roy Fielding, the inventor of REST, claims that REST APIs
    must be hypertext-driven (https://roy.gbiv.com/untangled/2008/rest-apis-must-be-hypertext-driven).
    In our opinion, the use of hypertext controls in APIs allows them to become self-documenting
    and, thereby, promotes the use of the ubiquitous language more explicitly. More
    importantly, it indicates'
