- img_proc: true
  md: '# Versioning 261


    Fundamentally, distributed tracing visualizations can aid in diagnosing performance
    bottlenecks and chattiness between components. But what may not be obvious is
    the insights it can provide in gaining a richer understanding of how components
    interact in an end-to-end user journey. In a lot of ways, this can be thought
    of as a real-time context map visualization of your system, and how components
    are coupled with each other. From a DDD perspective, this can provide greater
    insights into re-evaluating bounded boundaries if necessary. For this reason,
    we recommend making it easy to set up and configure distributed tracing apparatus
    painlessly from the outset.


    # Versioning


    When we are working with a monolithic application, we have large portions bundled
    as a single cohesive unit. This means other than third-party dependencies, we
    don''t have to worry about explicitly versioning our own components. However,
    when we breaking components into their individual deployable units, there is a
    need to pay careful attention to how the components, APIs, and data elements of
    our solution are versioned. Let''s look at each turn.


    # Components


    When we create components, there are two broad categories–those that are deployed
    on their own and those that are embedded within another component. In the case
    of deployable components, there is a need to use an explicit version to identify
    specific instances of the component, even if for deployment purposes. In the case
    of the embedded component, again there is a need to use an explicit version because
    other components need to understand what instance they depend upon. In all words,
    components need to have to uniquely identify themselves.


    It follows that we need to choose a sound versioning strategy for our components.
    We recommend the use of semantic versioning (https://semver.org/), which uses
    a version identifier uses three numeric components to match the MAJOR.MINOR.PATCH
    scheme:


    +   - MAJOR: Increment when you make backward-incompatible changes.

    - MINOR: Increment when you add some functionality in a backward-compatible manner.

    - PATCH: Increment when you make backward-compatible bug fixes.


    In addition, we can use of optional extensions to identify pre-release and build
    metadata. For example, the version identifier for our component might read 3.4.1-RC
    to reflect that this is a release candidate for 3.4.1 of component. Using a standard
    versioning scheme enables the use of build tools like Maven and Gradle to control
    fine-grained upgrades and constraints for transitive dependencies. A good practice
    is to declare dependencies without versions and make use dependency management
    (https://maven.apache.org/guides/introduction/introduction-to-dependency-mechanism.html#Dependency_Management)
    or dependency constraints (https://docs.gradle.org/current/userguide/dependency_constraints.html#adding-constraints-transitive-deps)
    to centralize version management of dependent components.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '262 Beyond Functional Requirements


    # APIs


    As producers, we expose APIs in a number of ways. In this case, we are specifically
    referring to APIs available over remote interfaces as HTTP, events, and so on.
    When it comes to APIs, first and foremost, it is important to keep consuming applications
    functionally. One effective way of making this possible is by thinking from the
    consumer''s standpoint and embracing consumer-driven contracts (https://martinfowler.com/articles/consumerDrivenContracts.html).


    From a consumer''s perspective, the robustness principle (Postel''s law) applies:
    be conservative in what you send, liberal in what you accept. In other words,
    when sending requests to producers, strictly obey the constraints laid down by
    the producer. For example, don''t send unexpected data in the request. Whereas,
    when receiving responses, be tolerant towards what you get from the producer.
    For example, ignore unknown attributes in the response as long as all the attributes
    you expect are present. This will allow producers to evolve without breaking consumers.


    Our recommendation is to keep APIs versionless for as long as possible by maintaining
    backward compatibility. Despite all our efforts, there may come a need to make
    breaking changes to our APIs. Breaking changes includes the following:


    +   * Removing renaming one or more attributes

    * Changing the type of one or more existing attributes

    * Changing the format of the request/response


    In such cases, make use a version identifier to indicate major version changes
    (for example, v2 to v3). Common options include specifying the version in the
    URI, in a header, or in the Payload. But as we mentioned earlier, API versioning
    needs be used sparingly. If you find yourself in a situation where you are required
    to introduce backward-incompatible changes frequently, it might be an indicator
    of being misunderstood and whether DDD principles are truly applied.


    # Data


    In a world of well-defined bounded contexts, we could no longer be in a situation
    where we need to expose data directly to our consumers. There may be situations
    where we may need to integrate by directly exposing data to our consumers. For
    example, we may have to expose a reporting database for analytical purposes. All
    the good practices that we outlined for APIs apply to data as well.


    In addition, from a producer''s perspective, there will be a need to evolve the
    data schema to accommodate changing business requirements. When working with relational
    databases, using good schema migration tools such as Liquibase (https://liquibase.org/)
    or Flyway (https://flyway.org/) can go a long way. NoSQL databases also have similar
    tools such as MongoBee (https://github.com/mongobee/mongobee) and Cassandra-Migration
    (https://cassandra-migration.'
  merge: -1
  pgno: 284
- img_proc: true
  md: 'In this context, it is pertinent to think about data as a product and apply
    product thinking to domain-aligned data. For more information, please refer to
    this article on how to move from a monolithic data lake to a distributed data
    mesh (https://martinfowler.com/articles/data-monolith-to-mesh.html#DomainDataAsProduct).


    It is not uncommon to find outliers in situations where there may be a need to
    support more than one active version of a given component, API, or data. This
    can add significant levels of complexity to the solution. To keep complexity in
    check, it is important to make provisions for deprecating and eventually ending
    support for older versions.


    # Summary


    In this chapter, we looked at aspects purely beyond functional requirements–each
    of which can have a profound impact on our ability to apply domain-driven design
    effectively. Specifically, we looked at how each of these is interrelated and
    they have to be looked at holistically to achieve and sustain high levels of success.


    # Closing thoughts


    Domain-driven design, although conceived in the early 2000s, was way ahead of
    its time. We are in the age of solving the most complex problems yet. Given the
    advancements in technology, there is an expectation to build these solutions a
    lot faster. While the overall cognitive complexity of the solution is directly
    proportional to the complexity of the problem, there is a need to effectively
    manage this complexity. DDD and its principles enable us to achieve this by breaking
    complex problems into smaller, manageable parts. In this book, we have made an
    attempt to distill our experiences and provide a set of concrete techniques to
    apply DDD in your respective contexts.'
  merge: -1
