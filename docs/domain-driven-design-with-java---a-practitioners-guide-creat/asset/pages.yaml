  md: '# Decomposing the frontend


    Obviously, there is no free lunch! This fine-grained decomposition may require
    additional coordination and duplication of data among these components – to a
    point where it may not be attractive anymore. However, we feel that it is important
    to illustrate the art of the possible.


    # Decomposing the frontend


    Thus far, we have focused on decomposing and distributing the backend components
    while keeping the frontend untouched as part of the monolithic system. It is worth
    considering breaking the down to align more closely along functional boundaries.
    Patterns such as microfrontends (https://micro-frontends.org/, https://martinfowler.com/)
    extend the concepts of microservices to the frontend. Micro-frontend promote functional
    teams to support end-to-end ownership of a set of features. It is conceivable
    that a cross-functional, polyglot team owns both the experience (frontend) and
    the business logic (backend) functions, eliminating communication overheads drastically
    (along the lines of the vertical slice architecture, as discussed in Chapter 2,
    Where and How Does DDD Fit?). Even if such a team organization with the frontend
    and backend are not feasible in your current ecosystem, this approach still has
    merits, such as the following:


    +   - Increased-to-end collaboration: Creating solutions that work end to end
    is what ultimately provides value. Having a set of backend services isolated from
    their respective customer experiences will only cause us to accumulate unused
    inventory. To reduce the possibility of failure, the closer the collaboration
    between the backend capability and frontend experience teams, the greater our
    part of the vertical slice allows us to apply the ubiquitous language through
    the entire stack.

    - Uniform omnichannel experiences: These days, it is very common to surface the
    same functionality across more one experience channel. Having an inconsistent
    experience across channels can lead to customer dissatisfaction and adverse business
    consequences. Aligning teams closely along functional boundaries (within the same
    swim lane) can promote high levels of collaboration and consistency when exposing
    business functionality. Consider the example shown here. Within a vertical slice,
    the allegiance is to the functionality developed, although there may be a need
    to use disparate technologies to build each channel (iOS, Android, web, and so
    on). Within a vertical slice, each box depicted in the diagram operate as a team
    of its own, while maintaining strong cohesion with the functional team within
    the same swim lane, as shown here:'
  merge: -1
