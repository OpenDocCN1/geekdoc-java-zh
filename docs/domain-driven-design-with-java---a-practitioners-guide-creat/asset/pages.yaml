  md: '# Optimizing the feedback loop


    As we enter an age of encountering our most complex business problems, we need
    to embrace new ways of thinking, development philosophy, and an arsenal of techniques
    to iteratively evolve mature software solutions that will stand the test of time.
    We need better ways of communicating, analyzing problems, arriving at a collective
    understanding, creating and modeling abstractions, and then implementing and enhancing
    the solution.


    To state the obvious—we''re all building software with seamlessly brilliant business
    ideas on one side and our ever-demanding customers on the other, as shown here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_34_0.png)


    Figure 1.8 - The software delivery continuum


    In between, we have two chasms to cross—the delivery pipeline and the feedback
    pipeline. The delivery pipeline enables us to put software in the hands of our
    customers, whereas the feedback pipeline allows us to adjust and adapt. As we
    can see, this is a continuum. If we are to be fast, build more valuable software,
    this continuum, potentially infinite loop, has to be optimized!


    To optimize this loop, we need three characteristics to present: we need to be
    fast, we need to be reliable, and we need to do this over and again. In other
    words, we need to be rapid, reliable, and repeatable—all at the same time Take
    any of these away and it won''t suffice.


    DDD promises to provide answers on how to do this in a systematic manner. In the
    upcoming section, and indeed the rest of this book, we will examine what DDD is
    and why it is indispensable when working to provide solutions for non-trivial
    problems in today''s world of massively distributed teams and applications.'
  merge: -1
