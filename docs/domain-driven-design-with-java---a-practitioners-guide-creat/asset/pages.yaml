  md: '# Beginning the Decomposition Journey


    +   - **Transaction synchronization:** In this approach, multiple resource managers
    are synchronized in a way that a failure in any one system will trigger a cleanup
    in the others where the transaction has already been committed. It is pertinent
    to note that this might not be foolproof, as it might lead to cascading failures.


    > > Information

    nThe Spring Framework provides support for this style of behavior through the
    TransactionSynchronization interface and the now deprecated ChainedTransactionManager
    interface. Please refer to the documentation for further details. Needless to
    say, this interface should not be used without careful consideration of the business
    requirements.


    +   - **Distributed transactions:** Another approach is to make use of distributed
    transactions. A distributed transaction is a set of operations on data that is
    performed across two or more resource managers (usually, these are databases)
    using techniques such as **two-phase commit (https://martinfower.com/articles/patterns-of-distributed-systems/two-phase-commit.html)**.
    Typically, this functionality is implemented using pessimistic locking on the
    underlying resource managers (databases) and could present scaling challenges
    in highly concurrent environments.


    +   - **Transactional outbox:** None of the preceding methods are completely foolproof
    in the sense that there still exists a window of opportunity where the database
    and the event bus can become inconsistent (this is true with two-phase commits).
    One way to circumvent this is by completely eliminating the dual-write problem.


    In solution, the command processor writes to its database and the intended event
    to an outbox table in a local transaction. A separate poller polls the outbox
    table and writes to the event bus. Polling can be computationally intensive and
    could lead back the dual write problem because the poller has to keep track of
    the last written event. This could be avoided by making event processing idempotent
    on the consumer so that duplicate events do not cause issues, especially in highly
    concurrency and volume scenarios. Another way to mitigate this issue is to use
    a **Change Data Capture (CDC)** tool (such as Debezium, https://debezium.io/)
    and Oracle LogMiner (https://en.wikipedia.org/wiki/OracleLogMiner). Most modern
    databases ship with tools to make this easier, and they may be worth exploring.
    One way to implement this is to use the **transactional outbox pattern**, as shown
    in the following diagram:'
