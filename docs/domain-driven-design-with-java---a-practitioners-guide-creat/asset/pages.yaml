  md: 'One of the great advantages of DDD is that it does not require the use of any
    specific architecture. However, the software industry has been using a plethora
    of architecture styles over the last few years. Let''s look at how DDD can be
    used in conjunction with a set of popular architecture styles to arrive at better
    solutions.


    # Layered architecture


    Layered architecture is one of the most common architecture styles, where the
    solution is typically organized into four broad categories: **presentation, application,
    domain, and persistence**. Each of the layers provides a solution to a particular
    concern it represents, as shown here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_62_0.png)


    The main idea behind layered architecture is a separation of concerns - where
    the dependencies between layers are unidirectional (from top to bottom). For example,
    the domain layer can depend on the persistence layer, not the other way round.
    In addition, any given layer typically accesses the layer immediately beneath
    it without bypassing layers in. For example, the presentation layer may access
    the domain layer only through the application layer.


    This structure enables looser coupling between layers and allows them to evolve
    independently of each other. The idea of layered architecture fits very well with
    DDD''s tactical design elements, as depicted here:


    Figure 2.1 – The essence of layered architecture'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# Architecture styles 41


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_63_0.png)


    Figure 2.2 - Layered architecture mapped to DDD''s tactical design elements


    DDD actively promotes the use of a layered architecture, primarily because it
    makes it possible to focus on the domain layer in isolation from other concerns,
    such as how information gets displayed, how-to-end flows are managed, and how
    data is stored and retrieved. From perspective, solutions that apply DDD naturally
    tend to be layered as well.


    # Notable variations


    A variation of layered architecture was invented by Alistair Cockburn, who he
    originally called hexagonal architecture (https://alistair.cockburn.us/hexagonal-architecture/),
    alternatively called ports and adapters architecture. The idea behind this style
    was to avoid inadvertent dependencies between layers (which could occur in layered
    architecture), specifically between the core of a system and the peripheral ports.


    The main idea is to make use of interfaces (ports) within the core to enable modern
    drivers, such as testing and looser coupling. This allows the core to be developed
    and evolved independently of the non-core ports and the external dependencies.
    Integration with real-world components such as databases, filesystems, and web
    services is achieved through concrete implementations of the ports (adapters).
    The use of interfaces within the core enables much easier testing of the core
    in isolation from the rest of the system, using mocks and stubs. It is also common
    to use dependency injection frameworks to dynamically swap out implementations
    of these interfaces when working with a real system in an end-to-end environment.
    A visual representation of hexagonal architecture is shown here:'
  merge: -1
