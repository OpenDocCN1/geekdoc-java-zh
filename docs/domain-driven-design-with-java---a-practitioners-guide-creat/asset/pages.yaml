  md: '# # Preface


    **Domain-driven design (DDD)** makes available a set of principles, patterns,
    and techniques that subject-matter experts, architects, developers, and other
    team members can adopt to work together and decompose complex systems into well-factored,
    collaborative, and loosely coupled subsystems. When Eric Evans introduced these
    concepts in the early 2000s, in a lot of ways, these principles were ahead of
    their time. We were firmly in the age of the monolith, **service-oriented architectures
    (SOAs)** as a concept we were just starting to take, and the cloud, microservices,
    continuous delivery, and so on not even exist yet! It was relatively early to
    adopt some of its tactical aspects, the strategic side of DDD was still seen as
    an unjustifiable overhead for the most.


    Fast-forward to today, we are building our most complex software solutions ever,
    with even more complex organization and team structures to cope. Also, the use
    of the public cloud is almost a given. This has risen to an age where distributed
    teams and applications are almost a norm. Also, we are also in an age where applications
    from an earlier generation need to be modernized. This has resulted in the practices
    of DDD, specifically the strategic elements, gaining a lot of prominence.


    We have been practitioners of these concepts and gained valuable insights from
    our experiences. Over the years, we have seen a number of advancements that have
    made the adoption of DDD at scale viable option. This book is a distillation of
    all our collective experiences. We have drawn a lot of inspiration from earlier
    works on the subject, we have been very conscious to apply a practitioner’s mindset
    so that we know the lower barrier for teams to sustain and thrive in their journey
    of building complex, distributed software.


    # Who this book is for


    This book was written with a diverse set of roles and skills in mind. While the
    concepts of DDD have been existence for time, practical application and scaling
    have been a challenge, arguably due to a dearth of practical techniques, tools,
    and real-world examples that bring all these concepts together as a cohesive whole.
    Successful application of these principles requires strong collaboration from
    a varied set of roles and disciplines across an organization, including executives,
    business experts, product owners, business analysts, architects, developers, testers,
    and operators.


    Here is a quick summary of readers and what they will gain from reading this book:


    **Executives and business experts** should read this book so that they can articulate
    their vision and the core concepts that justify the need for the solution. Techniques
    will allow them to do this in an expedient manner and also gain empathy toward
    what it takes to implement changes quickly and reliably.'
  merge: -1
