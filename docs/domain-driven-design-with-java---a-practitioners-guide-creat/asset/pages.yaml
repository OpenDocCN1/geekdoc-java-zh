    \ without problems. Here are some questions that this approach raises:\n\n+  \
    \ - Are we allowed to change everything listed in the update command?\n- Assuming\
    \ that everything can change, do they all change at the same time?\n- How do we\
    \ know what exactly changed? Should we be doing a diff?\n- What if all the attributes\
    \ mentioned above are not included in the update command?\n- What if we need to\
    \ add attributes in the future?\n- Is the business intent of what the user wants\
    \ to accomplish captured?"
