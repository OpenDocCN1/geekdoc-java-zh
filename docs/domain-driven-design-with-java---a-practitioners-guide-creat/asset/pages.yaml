  md: '# 56 Where Does DDD Fit?


    Although Foote and Yoder advise avoiding this style of architecture at all costs,
    software systems resemble the big ball of mud continue to be a day-to-day inevitability
    for a lot of us. The strategic and tactical design elements of DDD provide a set
    of techniques to help deal with and recover from these near-hopeless situations
    in a pragmatic manner, without potentially to adopt a big bang approach. Indeed,
    the focus of this book is to apply these principles to prevent or to delay further
    devolution toward the big ball of mud.


    # Which architecture style should you use?


    As we see, there are variety of architecture styles you can learn when crafting
    a software solution. Lot of these architecture styles share a few common tenets.
    It can become difficult to conform to any single architecture style. DDD, with
    its emphasis on breaking down complex business into subsystems and bounded contexts,
    enables the use of more than one approach across bounded contexts. We would like
    to make a special mention of vertical slice architecture because it places an
    emphasis on dividing functionality into specific business outcomes and, thus,
    more naturally adheres to DDD''s ideas of bounded contexts. In, you may find the
    need to extend and even deviate from pedantic definitions of architecture styles
    in order real world needs. When we do make compromises, it is important to do
    intentionally and make it unambiguously clear why we are making such decision
    (preferably using some lightweight mechanism, as ADRs (https://www.thoughtworks.com/de-de/radar/techniques/lightweight-architecture-decision-records)).
    This is important because it may become hard to justify this to others and even
    ourselves when we look at it in the future.


    In this section, we have examined popular architecture styles and how we can amplify
    their effectiveness when used in conjunction with DDD. Now, let''s look at how
    DDD can complement the use of existing programming paradigms.


    # Programming paradigms


    The tactical elements of DDD introduce a specific vocabulary (aggregates, entities,
    value objects, repositories, services, factories, domain events, and so on) when
    arriving at a solution. At the end of the day, we need to translate these concepts
    into running software. Over the years, we have employed a variety of programming
    paradigms, including procedural, object-oriented. Is it possible to apply DDD
    in conjunction with one or more of these paradigms? In this section, we will explore
    how some programming paradigms and techniques help us express tactical design
    elements in code.


    # Object-oriented programming


    On the surface of it, DDD seems to simply replicate a set of OO terms and can
    differ them by names. For example, the central concepts of tactical DDD such as
    aggregates, entities, and value objects could simply be referred to as objects
    in OO terms. Others as services may not have a direct OO analog. So, how do you
    apply DDD in an OO world? Let''s look at a simple example:'
