  md: "# Application availability\n\nIn an event-driven system, it is common to accumulate\
    \ an extremely large number of events over a period of time, even in a relatively\
    \ simple application. Replaying a large number of events can be time-consuming.\
    \ Let's look at the mechanics of how replays typically work:\n\n+   1. We suspend\
    \ listening to new events in preparation for a replay.\n2. Clear the query store\
    \ for impacted aggregates.\n3. Start event replay for impacted aggregates.\n4.\
    \ Resume listening to new events after the replay is complete.\n\nBased on the\
    \ preceding list, when the replay is running (step 3), we may not be able to provide\
    \ reliable answers to queries that are replayed by the replay: This obviously\
    \ has an impact on Service Level Objectives (SLOs) which continue to be met.\n\
    \n# Event handlers with side effects\n\nWhen replaying, we re-trigger event handlers\
    \ either to fix logic that was previously erroneous or to support new functionality.\
    \ Invoking most (if not all) event handlers usually results in sort of side effect\
    \ (for, example, updating a query store). This means that some event handlers\
    \ may not be running for the first time. To prevent unwanted side effects, it\
    \ is important to undo the effects of having invoked event handlers previously\
    \ or care handlers in an idempotent manner (for example, by using an upsert command\
    \ instead of a insert command or an update command). The effect of some event\
    \ handlers can be hard (if not impossible) to undo (for example, invoking a command,\
    \ sending an email, or SMS). In such cases, it might be needed to mark such event\
    \ handlers as ineligible to run during the replay. Using Axon Framework, this\
    \ is simply to do:\n\n```\nimport org.axonframework.eventhandling.DisallowReplay;\n\
    class LCApplicationEventHandlers {\n    @EventHandler @DisallowReplay\n    public\
    \ void on(CardIssuedEvent event) {\n        // Behavior that we don't want replayed\n\
    \    }\\}\n```\n\n@DisallowReplay (or its counterpart @Replay) can be used to\
    \ explicitly mark event handlers ineligible to run during the replay."
  merge: -1
