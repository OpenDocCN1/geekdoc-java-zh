    # Merging into coarse-grained bounded contexts


    Merging two bounded contexts can be relatively complex than breaking an existing
    one. However, there are a few nuances that require paying attention to, in the
    following order:


    +   - Unification of the ubiquitous language: In Chapter 9, Integrating with External
    Systems, we examined a variety of ways in which bounded contexts can integrate
    with each other. If the relationship between these bounded contexts is symmetric,
    there may be less work to do. This is because, in a symmetric relationship, likely
    exists a lot of synergies in the first place. However, if the relationship is
    asymmetric, for example, through an open-host service on the producer side and
    an anti-corruption layer on the consuming side, it means that there are two varying
    ubiquitous languages and likely distinct domain models at play. Careful'
