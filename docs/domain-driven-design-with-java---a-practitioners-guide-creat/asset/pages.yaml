  md: '# Mutation testing


    A lot of teams author a variety of tests to ensure they are building a high-quality
    solution. Test coverage is typically used as a quantitative measure to assess
    the quality of testing. However, test coverage is a necessary but not sufficient
    condition to establish test quality. Low test coverage almost means there is a
    test quality problem, whereas high coverage does not imply better tests. In an
    ideal world, even a single line of code in production (caused by a change in requirements),
    without changing test code, will result in a test failure. If this can be guaranteed
    for every single change across the code base, you may be safely to rely on such
    a test suite.


    Mutation testing is a practice that actively inserts small bugs in production
    code (called mutants) and runs an execution of unit tests to assess the quality
    of tests. If your tests fail, the mutant is killed. If your tests pass, the mutant
    survives. The higher number of mutants killed, the more effective your tests are.


    For example, it may apply mutations as inverting conditionals, replacing relational
    operators, returning nulls from methods, and so on, and then you can check the
    effect on your existing tests. If no tests fail despite these mutations, these
    tests may not be as helpful as you hoped them to. allows us to draw more objective
    conclusions about the quality of our tests. How it works (by mutating code), is
    computationally intensive and may take a long time to run. If you employ a test-first
    design and have a fast suite of unit tests, mutation testing can be a great complement
    that can help discover missed requirements and/or test cases earlier in the development
    cycle. From perspective, we see it as an invaluable tool to augment the option
    of DDD within teams. Tools such as PITest (https://pitest.org/) are great tool
    to perform mutation testing in your Java applications.


    # Chaos testing


    As we have seen earlier, mutation testing can help point out chunks in the functional
    aspects of your application. Chaos testing plays a similar role to help identify
    shortcomings in meeting non-functional requirements caused by reliance on network
    and infrastructure. It became popular through the use of large-scale distributed,
    cloud-based architectures pioneered by companies such as Amazon, Netflix, and
    so on. Netflix introduced a tool called Chaos Monkey (https://github.io/chaosmonkey/)
    that randomly terminated instances in production! to ensure that engineers implement
    services that are resilient to failure. This being followed by releasing a set
    of related tools, collectively called the Syrian Army (which is now defunct) to
    test a variety of non-functional aspects such as latency, security compliance,
    unused resources, and so on.


    While Netflix performs this style of testing in production, the rest of us will
    benefit immensely if we adopt these practices in even lower environments at the
    outset. From a strategic perspective, chaos testing can provide feedback on the
    amount of coupling between components and whether the boundaries of these components
    are appropriate. For example, if a component that you are dependent goes down
    or experiences problems, does this take down as well? If so, are there ways to
    mitigate this? It can also provide feedback about your monitoring and alerting
    apparatus. From a'
  merge: -1
