  md: "# Refactoring\n\nOver a period of time, there will be a need to realign context\
    \ boundaries, domain events, APIs, and so on. There tends to be a stigma associated\
    \ with things not working perfectly the first time and justifying the need for\
    \ refactoring at the inter-component scale. However, this may be required for\
    \ multiple reasons outside our control, ranging from competitor ecosystem changes,\
    \ evolving/misunderstood requirements, inability to meet non-functional requirements,\
    \ organizational and team responsibility, and so on. Here, refactoring is a core\
    \ discipline that software teams will need to embrace as a first-class practice.\n\
    \n> Note\n are covering only the strategic (inter-component) aspects of refactoring\
    \ in this chapter. There are several great works on the tactical (intra-component)\
    \ aspects of refactoring, such as Martin Fowler's Refactoring (https://refactoring.com/)\
    \ book and Michael Feathers Working Effectively with Legacy Code, among others.\n\
    \nFrom a strategic perspective, this may mean having to break an existing monolith\
    \ into finer-grained bounded contexts or merge fine-grained bounded contexts into\
    \ more coarse-grained ones. Let's look each of these in turn.\n\n# Breaking an\
    \ existing monolith\n\nIn previous chapters (10 and 11), we have looked at how\
    \ it is possible to break an existing monolith into finer-grained components.\
    \ However, it is argue that the monolith was relatively well-structured to start\
    \ with. Lots of teams may not be as fortunate. In such a case, here are prerequisites\
    \ that may need to be fulfilled:\n\n+   - Tactical refactoring: This will allow\
    \ you to gain a better understanding of the existing system. To do this, start\
    \ with a set of fitness functions (https://en.wikipedia.org/wiki/Fitness_function)\
    \ and a set of black-box functional tests, perform a refactor, and then replace\
    \ the functional tests with faster-running unit tests. Finally, use the fitness\
    \ functions to evaluate the success of the effort. Repeat this process until there\
    \ is a level of comfort to attempt more complex refactorings."
  merge: -1
