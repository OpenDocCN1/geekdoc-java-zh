  md: '# 24 The Rationale for Domain-Driven Design


    Care should be taken to retain focus on solving the business problem at hand at
    all times. Teams will be better served if they expend the same amount of effort
    modeling business logic as the technical aspects of the solution. To keep accidental
    complexity in check, it will be best to isolate the infrastructure aspects of
    the solution from this model. These models can take several forms, including conversations,
    whiteboard sessions, documentation, diagrams, tests, and other forms of architecture
    it functions. It is important to note that this is not a one-time activity. As
    the business evolves, the domain model and the solution will need to keep up.
    This can only be achieved through close collaboration between the domain experts
    and the developers at all times.


    # Scope of domain models and the bounded context


    When creating domain models, one of the dilemmas is in deciding how to restrict
    the scope of these models. You can attempt to create a single domain model that
    acts for the entire problem. On the other hand, we may go the route of creating
    extremely fine-grained models that cannot exist meaningfully without having strong
    dependency on others. There are pros and cons in each way. Whatever be the case,
    each solution has a scope—bounds to which it is confined. This boundary is termed
    a bounded context.


    There seems to exist a lot of confusion between the terms subdomains and bounded
    contexts. What is the difference? It turns out that subdomains are space concepts,
    whereas bounded contexts are solution space concepts. This is best explained through
    the use of an example. Let’s consider the example of a fictitious Acme bank that
    provides two products: credit cards and retail bank. This may decompose to the
    following subdomains depicted here:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_46_0.png)


    Figure 1.17 — Banking subdomains at Acme bank'
