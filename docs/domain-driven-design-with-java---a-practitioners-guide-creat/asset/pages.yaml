  md: "# Value objects\n\nValue objects are immutable objects that encapsulate the\
    \ data and behavior of one or more related attributes. It may be convenient to\
    \ think of value objects as named primitives. For example, consider a MonetaryAmount\
    \ value object. A simple implementation can contain two attributes—an amount and\
    \ a currency code. This allows encapsulation of behavior, as adding two MonetaryAmount\
    \ objects safely, as shown here:\n\n```\nTransaction\n- id: TransactionId «generated»\n\
    \  amount: MonetaryAmount\n  type: TransactionType\n  date: Date\n  status: TransactionStatus\n\
    \  - void approved()\n  - void rejected()\n```\n\nFigure 1.21 - A simple MonetaryAmount\
    \ value object\n\nThe effective use of value objects helps protect from the primitive\
    \ emission with anti-patterns while increasing clarity. It also allows composing\
    \ higher-level abstractions using one or more valuable objects. It is important\
    \ to note that value objects do not have the notion of identity. That is, values\
    \ with the same value are treated equally. So, two MonetaryAmount objects with\
    \ the same amount and currency code will be considered equal. Also, it is important\
    \ to make value objects immutable. A need to change any of the attributes should\
    \ result in the creation of a new attribute.\n\nIt is easy to dismiss value objects\
    \ as a mere engineering technique, but the consequences of (not) using them can\
    \ be far-reaching. In the MonetaryAmount example, it is possible for the amount\
    \ and currency code to exist as independent attributes. However, the use of MonetaryAmount\
    \ enforces the notion of the ubiquitous language. Hence, we recommend the use\
    \ of value objects as a default instead of primitives.\n\nCritics may be quick\
    \ to point out problems such as class explosion and performance issues. But in\
    \ our experience, the benefits usually outweigh the costs. But it may be necessary\
    \ to re-examine this approach if problems occur."
  merge: -1
