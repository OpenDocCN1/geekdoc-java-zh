  md: "# Changes to frontend interactions 205\n\n# Protocol options\n\nThere are several\
    \ options available to us when exposing remote APIs. These, using a JSON-based\
    \ API (often labeled as Representation State Transfer or REST) seems to be quite\
    \ popular. However, this isn't the only option available to us. In a resource-based\
    \ approach, the first step is to identify a resource (noun) and then map the interactions\
    \ (verbs) with the resource as a next step. In an action-based approach, the focus\
    \ is on the actions to be performed. REST takes a resource-based approach, whereas\
    \ GraphQL gRPC, SOAP, and more, seem to be action-based. Let's take an example\
    \ of an API we want to start a new LC application. In a RESTful world, this could\
    \ look like this:\n\n```\n# Start a new LC application\ncurl POST /lc-applications/start-new\
    \ \\\n  -d '{\"applicant-id\": \"8ed2d22fe\", \\\n  \"clientReference\": \"Test\
    \ LC\"}' \\\n  -H 'content-type:application/vndc.lc.application.v2+json'\n```\n\
    \nIn comparison, with a GraphQL implementation, this could look like the following:\n\
    \n```\nmutation startLCApplication {\nstartLCApplication(applicantid: \"8ed2d2fe\"\
    ,\n  clientReference: \"Test LC\") {\n  lcApplicationId\n}\n```\n\nIn our experience,\
    \ designing APIs with REST does result in some form of dilution when attempting\
    \ to mirror the language of the domain—because the focus is first and foremost\
    \ on resources. Purists will be quick to point out that the example is not RESTful\
    \ because there is no resource named start-new and that we should leave the URL\
    \ to simply include the name of the resource (use /lc-applications instead of\
    \ /lc-applications/start-new). Our approach is to place more importance on remaining\
    \ true to the ubiquitous language as opposed to being dogmatic about adherence\
    \ technical purity.\n\n# Transport format\n\nHere, we have two choices: text-based\
    \ (for example, JSON or XML) versus binary (for example, protocol buffers, https://developers.google.com/protocol-buffers,\
    \ or Avro, https://avro.apache.org/). If non-functional requirements (such as\
    \ performance) are met, our preference is to use text-based protocols as a starting\
    \ point. That's because it can afford the flexibility of not needing any tools\
    \ to visually interpret the data (when debugging)."
