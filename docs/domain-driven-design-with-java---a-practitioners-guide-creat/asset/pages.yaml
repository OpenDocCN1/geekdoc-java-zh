  md: '# Technical requirements


    There are no specific technical requirements for this chapter. However, given
    that it may become necessary to collaborate remotely as opposed to being in the
    same room with access to a whiteboard, it will be useful to access the following:


    +   - A digital whiteboard (such as https://www.mural.co/ or http://miro.com/)

