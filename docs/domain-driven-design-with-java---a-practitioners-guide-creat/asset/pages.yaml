  md: '# 126 Implementing the User Interface – Task-Based


    As systems evolve, and they begin to support richer user experiences and multiple
    channels, the CRUD-based interface seems to require additional translation layers
    to cater to user experience needs. The visual here depicts a typical layered architecture
    of a solution that supports multiple-user experience channels:


    ![](img/6869d38c83b04ca7904abbd9d2e1f6d5_148_0.png)


    Figure 6.4 – Layered architecture supporting multiple-user experience channels


    This setup is usually composed of the:


    +   - A domain tier comprised of CRUD-based services that simply map closely to
    database entities

    - A composite tier comprised of business capabilities that span more than one
    core service

    - A Backend for Frontend (BFF) tier, comprised of channel-specific APIs


    That the composite and BFF tiers exist primarily as a means to map backend capabilities
    to user intent. In an ideal world, where backend BFFs reflect user intent, the
    need for translations should be minimal (if at all). Our experience suggests that
    such a setup causes business logic to get pushed closer to the user channels as
    opposed to being encapsulated within the confines of well-factored business services.
    In addition, these tiers cause inconsistent experiences across channels for the
    same functionality, given that modern teams are structured along tier boundaries.'
  merge: -1
