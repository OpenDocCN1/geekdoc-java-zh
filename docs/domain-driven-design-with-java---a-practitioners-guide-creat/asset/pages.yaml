    # Tooling choices


    Implementing CQRS does not require the use of any framework. Greg Young, who is
    considered the father of the CQRS pattern, advises against rolling out our CQRS
    framework in the essay found at https://ordina-jworks.github.io/domain-driven%20design/2016/02/02/A-Decade-Of-DDD-CQRS-And-Event-Sourcing.html,
    which is worth taking a look. Using a good framework can help enhance developer
    effectiveness and accelerate the delivery of business functionality, abstracting
    the low-level plumbing and non-functional requirements without limiting flexibility.
    In this book, we will make use of Axon Framework (http://axonframework.org/) to
    implement application functionality, as we have real-world experience using it
    in large-scale enterprise development. There are other frameworks that work comparably,
    such as the Lagom framework (https://www.lagomframework.com/) and Eventuate (https://event.io/),
    which are worth exploring as well.


