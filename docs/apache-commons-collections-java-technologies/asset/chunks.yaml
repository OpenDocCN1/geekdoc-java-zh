    # MapIterator Interface


    The JDK Map interface is pretty difficult to iterate as Iteration to be done on
    EntrySet or over the KeySet objects. MapIterator provides simple iteration over
    Map. Following example illustrates the same.


    ## Example of MapIterator Interface


    An example for MapIteratorTester.java is as follows −


    import org . apache . commons . collections4 . IterableMap ;


    import org . apache . commons . collections4 . MapIterator ;


