    \nFiltered List (Even numbers): [2, 4, 6, 8]\n\n## filterInverse() 方法\n\n`CollectionUtils`\
    \ 的 `filterInverse()` 方法可以过滤列表以移除满足谓词条件的对象。\n\n### 声明\n\n以下是 `org.apache.commons.collections4.CollectionUtils.filterInverse()`\
    \ 方法的声明 −\n\n```java\npublic static <T> boolean filterInverse(Iterable<T> collection,\n\
    Predicate<? super T> predicate)\n```\n\n### 参数\n\n* `collection` − 获取输入的集合，不能为\
    \ null。\n* `predicate` − 用于过滤的谓词，可以为 null。\n\n### 返回值\n\n如果集合通过此调用被修改，则返回 true，否则返回\
    \ false。\n\n### 示例\n\n以下示例展示了 `org.apache.commons.collections4.CollectionUtils.filterInverse()`\
    \ 方法的使用。我们将过滤整数列表以获取奇数。\n\n```java\nimport java.util.ArrayList;\nimport java.util.Arrays;\n\
    import java.util.List;\nimport org.apache.commons.collections4.CollectionUtils;\n\
    import org.apache.commons.collections4.Predicate;\n\npublic class CollectionUtilsTester\
    \ {\n    public static void main(String[] args) {\n        List<Integer> integerList\
    \ = new ArrayList<>();\n        integerList.addAll(Arrays.asList(1, 2, 3, 4, 5,\
    \ 6, 7, 8));\n        System.out.println(\"Original List: \" + integerList);\n\
    \        CollectionUtils.filterInverse(integerList, new Predicate<Integer>() {\n\
    \            @Override\n            public boolean evaluate(Integer input) {\n\
    \                if (input.intValue() % 2 == 0) {\n                    return\
    \ true;\n                }\n                return false;\n            }\n   \
    \     });\n        System.out.println(\"Filtered List (Odd numbers): \" + integerList);\n\
    \    }\n}\n```\n\n### 输出\n\n结果如下所示 −\n\nOriginal List: [1, 2, 3, 4, 5, 6, 7, 8]\n\
    \nFiltered List (Odd numbers): [1, 3, 5, 7]\n\n"
