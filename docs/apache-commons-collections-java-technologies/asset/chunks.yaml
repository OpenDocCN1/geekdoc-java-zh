    # Overview


    Commons Collections augments Java Collections Framework. It provides several features
    to make collection handling easy. It provides many new interfaces, implementations
    and utilities.


    The main features of Commons Collections are as follows —


    - **Bag** — Bag interfaces simplifies the collections, which have multiple number
    of copies of each object.

    - **BidiMap** — BidiMap interfaces provide Bi-Directional maps, which can be used
    to lookup values using keys or keys using values.

    - **MapIterator** — MapIterator interface provide simple and easy iteration over
    maps.

    - **Transforming Decorators** — Transforming decorators can alter every object
    of a collection as and when it is added to the collection.

    - **Composite Collections** — Composite collections are used, where multiple collections
    are required to be handled uniformly.

    - **Ordered Map** — Ordered Maps retain the order, in which elements are added
    in.

    - **Ordered Set** — Ordered Sets retain the order, in which elements are added
    in.

    - **Reference map** — Reference map allows key/values to be garbage collected
    under close control.

    - **Comparator implementations** — Many Comparator implementations are available.

    - **Iterator implementations** — Many Iterator implementations are available.

    - **Adapter Classes** — Adapter classes are available to convert array and enumerations
    to collections.

    - **Utilities** — Utilities are available to test or create typical set-theory
    properties of collections such as union, intersection. Supports Closure.


    # Environment Setup


    ## Local Environment Setup


    If you are still willing to set up your environment for Java programming language,
    then this section guides you on how to download and set up Java on your machine.
    Please follow the steps mentioned below to set up the environment.


    Java SE is freely available from the link `https://www.oracle.com/technetwork/java/archive-139210.html`.
    So, you download a version based on your operating system.


    Follow the instructions to download Java and run the `.exe` to install Java on
    your machine. Once, you have installed Java on your machine, you would need to
    set environment variables to point to correct installation directories.


    ### Setting up the Path for Windows 2000/XP


    We are assuming that you have installed Java in `c:\Program Files\java\jdk` directory.


    - Right-click on ''My Computer'' and select ''Properties''.

    - Click on the ''Environment variables'' button under the ''Advanced'' tab.

    - Now, alter the `Path` variable so that it also contains the path to the Java
    executable. Example, if the path is currently set to `''C:\WINDOWS\SYSTEM32''`,
    then change your path to `''C:\WINDOWS\SYSTEM32;c:\Program Files\java\jdk\bin''`.


    ### Setting up the Path for Windows 95/98/ME


    We are assuming that you have installed Java in `c:\Program Files\java\jdk` directory.


    - Edit the `C:\autoexec.bat` file and add the following line at the end — `''SET
    PATH=%PATH%;C:\Program Files\java\jdk\bin''`.


    ### Setting up the Path for Linux, UNIX, Solaris, FreeBSD


    Environment variable `PATH` should be set to point to where, the Java binaries
    have been installed. Refer to your shell documentation, if.


    Example, if you use `bash` as your shell, then add the following to the end of
    your `.bashrc`:


    ```bash

    export PATH=$PATH:/path/to/java/jdk/bin

    ```


    ## Popular Editors


    To write Java programs, you need a text editor. There are many IDEs available
    in the market. But for now, consider one of the following:


    - **Notepad** — A simple editor for Windows.

    - **Netbeans** — A powerful open-source IDE.

    - **Eclipse** — A widely used open-source IDE.


    ## Download Common Collections


    Download the latest version of Common Collections jar file. Assuming, we''ve extracted
    it into Apache folder.


    | OS | Archive name |

    | :--- | :--- |

    | Windows | `commons-collections-*.zip` |

    | Linux | `commons-collections-*.tar.gz` |

    | Mac | `commons-collections-*.tar.gz` |


    ## Set Apache Environment


    Set `APACHE_HOME` variable to point to the base directory where Apache is stored
    on your machine.


    | OS | Command |

    | :--- | :--- |

    | Windows | Set `APACHE_HOME` to `C:\Apache` |

    | Linux | `export APACHE_HOME=/usr/apache` |

    | Mac | `export APACHE_HOME=/Library/Apache` |


    ## Set CLASSP Variable


    Set `CLASSPATH` environment variable to point to the Common Collections jar location.


    | OS | Command |

    | :--- | :--- |

    | Windows | Set `CLASSPATH` to `%CLASSPATH%;%APACHE_HOME%\commons-collections-4.1.jar;`
    |

    | Linux | `export CLASSPATH=$CLASSPATH:$APACHE_HOME/commons-collections-4.1.jar`
    |

    | Mac | `export CLASSPATH=$CLASSPATH:$APACHE_HOME/commons-collections-4.1.jar`
    |


    # Bag Interface


    New Interfaces are added to supports bags. A Bag defines a collection which, counts
    the number of times an object appears. For example, if a Bag contains `{a, a,
    b, c}` then `getCount("a")` will return 2 while `uniqueSet()` returns the unique
    values.


    ### Interface Declaration


    Following is the declaration for `org.apache.commons.collections4.Bag<E>` interface:


    ```java

    public interface Bag<E>

    extends Collection<E>

    ```


    ## Methods


    The methods for bag inference are as follows:


    | Sr.No. | Method & Description |

    | :--- | :--- |

    | 1 | `boolean add(E object)` — Adds one copy of the specified object to the Bag.
    |

    | 2 | `boolean add(E object, int nCopies)` — Adds `nCopies` copies of the specified
    object to the Bag. |

    | 3 | `boolean containsAll(Collection<?> coll)` — Returns true if the bag contains
    all elements in the given collection, respecting cardinality. |

    | 4 | `int getCount(Object object)` — Returns the number of occurrences (cardinality)
    of the given object currently in the bag. |

    | 5 | `Iterator<E> iterator()` — Returns an Iterator over the entire set of members,
    including copies due to cardinality. |

    | 6 | `boolean remove(Object object)` — Removes all occurrences of the given object
    from the bag. |

