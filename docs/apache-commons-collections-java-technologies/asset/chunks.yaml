    # OrderedMap Interface


    OrderedMap is a new interface for maps to retain the order in which elements are
    added. LinkedMap and ListOrderedMap are two available implementations. This interfaces
    supports iterator that of Map and allows iteration in both directions either forwards
    or backwards in a Map. Following example illustrates the same.


