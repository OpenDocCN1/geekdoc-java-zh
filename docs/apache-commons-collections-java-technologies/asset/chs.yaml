- "# Apache Commons Collections [Java 技术]\n\n\n\n![](img/cover.jpeg)\n\n\n\n我想将这本书献给将要使用它的学生们。祝愿你们职业成功，并希望你们永不停学习。\n\
  \n\n# 概述\n\nCommons Collections 扩展了 Java 集合框架。它提供了多项功能来简化集合处理。它提供了许多新的接口、实现和工具类。\n\
  \nCommons Collections 的主要特性如下：\n\n- **Bag** — Bag 接口简化了包含每个对象多个副本的集合。\n- **BidiMap**\
  \ — BidiMap 接口提供了双向映射，可以使用键查找值，也可以使用值来查找键。\n- **MapIterator** — MapIterator 接口为\
  \ map 提供了简单易用的迭代方法。\n- **转换装饰器 (Transforming Decorators)** — 转换装饰器可以在对象被添加到集合时修改集合中的每一个对象。\n\
  - **复合集合 (Composite Collections)** — 当需要统一处理多个集合时使用复合集合。\n- **有序映射 (Ordered Map)**\
  \ — 有序 Map 保留了元素添加顺序。\n- **有序集合 (Ordered Set)** — 有序 Set 保留了元素添加顺序。\n- **引用映射 (Reference\
  \ map)** — 引用映射允许在严格控制下对键/值进行垃圾回收。\n- **比较器实现 (Comparator implementations)** — 提供了许多\
  \ Comparator 实现。\n- **迭代器实现 (Iterator implementations)** — 提供了许多 Iterator 实现。\n\
  - **适配器类 (Adapter Classes)** — 提供了适配器类将数组和枚举转换为集合。\n- **工具类 (Utilities)** — 提供了工具类来测试或创建集合典型的集合论属性，如并集、交集。支持闭包（Closure）。\n\
  \n# 环境搭建\n\n## 本地环境搭建\n\n如果你仍然愿意为 Java 编程语言设置环境，本节将指导你如何在机器上下载并设置 Java。\n\nJava\
  \ SE 可以从链接 `https://www.oracle.com/technetwork/java/archive-139210.html` 免费获取。因此，请根据你的操作系统下载版本。\n\
  \n按照说明下载 Java 并运行 `.exe` 在你的机器上安装 Java。一旦在机器上安装了 Java，你就需要设置环境变量以指向正确的安装目录。\n\n\
  ### 为 Windows 2000/XP 设置路径\n\n我们假设你已经将 Java 安装在 `c:\\Program Files\\java\\jdk` 目录下。\n\
  \n- 右键点击“我的电脑”并选择“属性”。\n- 点击“高级”选项卡下的“环境变量”按钮。\n- 现在，修改 `Path` 变量，使其也包含 Java 可执行文件的路径。例如，如果路径当前设置为\
  \ `'C:\\WINDOWS\\SYSTEM32'`，则将路径改为 `'C:\\WINDOWS\\SYSTEM32;c:\\Program Files\\java\\\
  jdk\\bin'`。\n\n### 为 Windows 95/98/ME 设置路径\n\n我们假设你已经将 Java 安装在 `c:\\Program Files\\\
  java\\jdk` 目录下。\n\n- 编辑 `C:\\autoexec.bat` 文件并在末尾添加以下行—— `'SET PATH=%PATH%;C:\\\
  Program Files\\java\\jdk\\bin'`。\n\n### 为 Linux, UNIX, Solaris, FreeBSD 设置路径\n\n\
  环境变量 `PATH` 应该指向 Java 二进制文件安装的位置。如有，请参考你的 shell 文档。\n\n例如，如果你使用 `bash` 作为 shell，请在\
  \ `.bashrc` 的末尾添加以下内容：\n\n```bash\nexport PATH=$PATH:/path/to/java/jdk/bin\n```\n\
  \n## 常用编辑器\n\n编写 Java 程序需要一个文本编辑器。市场上有很多 IDE。现在考虑以下之一：\n\n- **记事本 (Notepad)** —\
  \ Windows 简单编辑器。\n- **NetBeans** — 开源 IDE。\n- **Eclipse** — 广泛使用的开源 IDE。\n\n## 下载\
  \ Common Collections\n\n下载最新版本的 Common Collections 包。假设我们将其解压到 Apache 文件夹。\n\n|\
  \ OS | 压缩名称 |\n| :--- | :--- |\n| Windows | `commons-collections*.zip` |\n| Linux\
  \ | `commons-collections*.tar.gz` |\n| Mac | `commons-collections*.tar.gz` |\n\n\
  ## 设置 Apache 环境\n\n设置环境变量 `APACHE_HOME` 指向 Apache 存储的基础目录。\n\n| OS | 命令 |\n| :---\
  \ | :--- |\n| Windows | 设置 `APACHE_HOME` 为 `C:\\Apache` |\n| Linux | `export APACHE_HOME=/usr/apache`\
  \ |\n| Mac | `export APACHE_HOME=/Library/Apache` |\n\n## 设置 CLASSPATH\n\n设置环境变量\
  \ `CLASSPATH` 指向 Common Collections 包的位置。\n\n| OS | 命令 |\n| :--- | :--- |\n| Windows\
  \ | 设置 `CLASSPATH` 为 `%CLASSPATH%;%APACHE_HOME%\\commons-collections-4.1.jar;` |\n\
  | Linux | `export CLASSPATH=$CLASSPATH:$APACHE_HOME/commons-collections-4.1.jar`\
  \ |\n| Mac | `export CLASSPATH=$CLASSPATH:$APACHE_HOME/commons-collections-4.1.jar`\
  \ |\n\n## Bag 接口\n\n新增的接口支持 bag。Bag 定义了一个计算对象出现次数的集合。例如，如果 Bag 包含 `{a, a, b, c}`，则\
  \ `getCount(\"a\")` 返回 2，而 `uniqueSet()` 返回唯一值。\n\n### 接口声明\n\n以下是 `org.apache.commons.collections4.Bag<E>`\
  \ 接口的声明：\n\n```java\npublic interface Bag<E>\nextends Collection<E>\n```\n\n###\
  \ 方法\n\nBag 方法如下：\n\n| 序号 | 方法与描述 |\n| :--- | :--- |\n| 1 | `boolean add(E object)`\
  \ — 向 Bag 添加指定对象的副本。 |\n| 2 | `boolean add(E object, int nCopies)` — 向 Bag 添加指定对象的\
  \ `nCopies` 个副本。 |\n| 3 | `boolean containsAll(Collection<?> coll)` — 如果 包含给定集合中的所有元素（考虑数量），则返回\
  \ true。 |\n| 4 | `int getCount(Object object)` — 返回当前 bag 中指定对象的出现次数（数量）。 |\n| 5\
  \ | `Iterator<E> iterator()` — 返回一个用于整个成员集合的迭代器，包括由于数量产生的副本。 |\n| 6 | `boolean remove(Object\
  \ object)` — 从 bag 中移除指定对象的所有副本。 |\n\n\n\n\n\n| 7 | `boolean remove(Object object,\
  \ int nCopies)` 从 `Bag` 中移除指定对象的 `nCopies` 个副本。 |\n| 8 | `boolean removeAll(Collection<?>\
  \ coll)(Violation)` 移除在给定集合中表示的所有元素，并考虑基数。 |\n| 9 | `boolean retainAll(Collection<?>\
  \ coll)(Violation)` 移除 `bag` 中不在给定集合中的任何成员，并考虑基数。 |\n| 10 | `int size()` 返回 `bag`\
  \ 中所有类型的项目总数。 |\n| 11 | `Set<E> uniqueSet()` 返回 `Bag` 中唯一元素的 `Set`。 |\n\n### 继承的方法\n\
  \n该接口继承了自以下接口的接口的方法 −:\n\n- `java.util.Collection`\n\n### Bag 接口示例\n\n`BagTester.java`\
  \ 的示例如下 −\n\n```java\nimport org . apache . commons . collections4 . Bag ;\nimport\
  \ org . apache . commons . collections4 . bag . HashBag ;\n\npublic class BagTester\
  \ {\n    public static void main ( String [] args ) {\n        Bag < String > bag\
  \ = new HashBag <>();\n        // add \"a\" two times to the bag.\n        bag .\
  \ add ( \"a\" , 2 );\n        // add \"b\" one time to the bag.\n        bag . add\
  \ ( \"b\" );\n        // add \"c\" one time to the bag.\n        bag . add ( \"\
  c\" );\n        // add \"d\" three times to the bag.\n        bag . add ( \"d\"\
  \ , 3;\n\n        // get the count of \"d\" present in bag.\n        System . out\
  \ . println ( \"d is present \" + bag . getCount ( \"d\" ) + \" times.\" );\n  \
  \      System . out . println ( \"bag: \" + bag );\n        // get the set of unique\
  \ values from the bag\n        System . out . println ( \"Unique Set: \" + bag .\
  \ uniqueSet ());\n        // remove 2 occurrences of \"d\" from the bag\n      \
  \  bag . remove ( \"d\" , 2 );\n        System . out . println ( \"2 occurences\
  \ of d removed from bag: \" + bag );\n        System . out . println ( \"d is present\
  \ \" + bag . getCount ( \"d\" ) + \" times.\" );\n        System . out . println\
  \ ( \"bag: \" + bag );\n        System . out . println ( \"Unique Set: \" + bag\
  \ . uniqueSet ());\n    }\n}\n```\n\n### 输出\n\n你将看到以下输出 −\n\nd is present 3 times.\n\
  bag: [2:a,1:b,1:c,3:d]\nUnique Set: [a, b, c, d]\n2 occurences of d removed from\
  \ bag: [2:a,1:b,1:c,1:d]\nd is present 1 times.\nbag: [2:a,1:b,1:c,1:d]\nUnique\
  \ Set: [a, b, c, d]\n\n## BidiMap 接口\n\n新增了接口以支持双向 Map。使用双向映射，可以很容易通过值查找键，也可以通过键查找值。\n\
  \n### 接口声明\n\n以下是 `org.apache.commons.collections4.BidiMap<K,V>` 接口的声明 −:\n\n```java\n\
  public interface BidiMap<K,V>\nextends IterableMap<K,V>\n```\n\n### 方法\n\n`BidiMap`\
  \ 接口的方法如下 −:\n\n| Sr.No. | 方法与描述 |\n| :--- | :--- |\n| 1 | `K getKey(Object value)`\
  \ 获取当前映射到指定值的键。 |\n| 2 | `BidiMap<V,K> inverseBidiMap()` 获取此映射的视图，其中键和值是反转的。 |\n\
  | 3 | `V put(K key, V value)` 将键值对放入映射中，替换任何先前的对。 |\n| 4 | `K removeValue(Object\
  \ value)` 移除当前映射到指定值的键值对（可选操作）。 |\n| 5 | `Set<V> values()` 返回此映射中包含的值的 `Set` 视图。\
  \ |\n\n### 继承的方法\n\n该接口继承了自以下接口的方法 −:\n\n- `org.apache.commons.collections4.Get`\n\
  - `org.apache.commons.collections4.IterableGet`\n- `org.apache.commons.collections4.Put`\n\
  - `java.util.Map`\n\n### BidiMap 接口示例\n\n`BidiMapTester.java` 的示例如下 −\n\n```java\n\
  import org . apache . commons . collections4 . BidiMap ;\nimport org . apache .\
  \ commons . collections4 . bidimap . TreeBidiMap ;\n\npublic class BidiMapTester\
  \ {\n    public static void main ( String [] args ) {\n        BidiMap < String\
  \ , String > bidi = new TreeBidiMap <>();\n        bidi . put ( \"One\" , \"1\"\
  \ );\n        bidi . put ( \"Two\" , \"2\" );\n        bidi . put ( \"Three\" ,\
  \ \"3\" );\n        System . out . println ( bidi . get ( \"One\"));\n        System\
  \ . out . println ( bidi . getKey ( \"1\" ));\n        System . out . println (\
  \ \"Original Map: \" + bidi );\n        bidi . removeValue ( \"1\" );\n        System\
  \ . out . println ( \"Modified Map: \" + bidi );\n        BidiMap < String , String\
  \ > inversedMap = bidi . inverseBidiMap ();\n        System . out . println ( \"\
  Inversed Map: \" + inversedMap );\n    }\n}\n```\n\n### 输出\n\n运行代码时，你将看到以下输出 −\n\
  \n1\nOne\nOriginal Map: {One=1, Three=3}\nModified Map: {Three=3, Two=2}\nInversed\
  \ Map: {Two=2, Three=3}\n\n## MapIterator 接口\n\n`Map` 接口很难迭代，而 `MapIterator` 针对\
  \ `Entry` 对象提供了简单的迭代。下面的示例说明了这一点。\n\n### MapIterator 示例\n\n`MapTester.java` 的示例如下\
  \ −\n\n```java\nimport org . apache . commons . collections4 . IterableMap ;\nimport\
  \ org . apache . commons . collections4 . MapIterator ;\nimport org . apache . commons\
  \ . collections4 . HashedMap ;\n\npublic class MapIterator {\n    public static\
  \ void main ( String [] args ) {\n        IterableMap < String , String > map =\
  \ new HashedMap <>();\n        map . put ( \"1\" , \"One\" );\n        map . put\
  \ ( \"2\" , \"Two\" );\n        map . put ( \"3\" , \"Three\" );\n        map .\
  \ put ( \"4\" , \"Four\" );\n        map . put ( \"5\" , \"Five\" );\n\n       \
  \ MapIterator < String , String > iterator = map . mapIterator ();\n\n        while\
  \ ( iterator . hasNext ()) {\n            Object key = iterator . next ();\n   \
  \         Object value = iterator . getValue ();\n            System . out . println\
  \ ( \"key: \" + key );\n            System . out . println ( \"Value: \" + value\
  \ );\n        }\n    }\n}\n```\n\n### 输出\n\n输出如下 −\n\nkey: 1\nValue: One\nkey: 2\n\
  Value: Two\nkey: 3\nValue: Three\nkey: 4\nValue: Four\nkey: 5\nValue: Five\n\n##\
  \ OrderedMap 接口\n\n`OrderedMap` 是一个用于保留元素添加顺序的新接口。`LinkedMap` 和 `ListOrderedMap`\
  \ 是两种实现。该接口支持正向或反向迭代。下面的示例说明了这一点。\n\n### OrderedMap 示例\n\n`OrderedMapTester.java`\
  \ 的示例如下 −\n\n```java\nimport org . apache . commons . collections4 . OrderedMap\
  \ ;\nimport org . apache . commons . collections4 . map . LinkedMap ;\n\npublic\
  \ class OrderedMapTester {\n    public static void main ( String [] args ) {\n \
  \       OrderedMap < String , String > map = new LinkedMap <>();\n        map .\
  \ put ( \"One\" , \"1\" );\n        map . put ( \"Two\" , \"2\" );\n        map\
  \ . put ( \"Three\" , \"3\" );\n        System . out . println ( map . firstKey());\n\
  \        System . out . println ( map . nextKey ( \"One\" ));\n        System .\
  \ out . println ( map . nextKey ( \"Two\" ));\n    }\n}\n```\n\n### 输出\n\n结果如下 −\n\
  \nOne\nTwo\nThree\n\n## Ignore Null\n\nApache Collections 库中的 `CollectionUtils`\
  \ 类为常见的用例提供了各种实用方法。它有助于避免编写样板代码。在 Java 8 之前，该库非常有用，因为现在 Stream API 提供了类似功能。\n\n\
  ### 检查非空元素\n\n`CollectionUtils` 的 `addIgnoreNull()` 方法可以确保只有非空值被添加到集合中。\n\n### 声明\n\
  \n以下是 `org.apache.commons.collections4.CollectionUtils.addIgnoreNull()` 方法的声明 −:\n\
  \n```java\npublic static <T> boolean addIgnoreNull(Collection<T> collection, T object)\n\
  ```\n\n### 参数\n\n- `collection`: 要添加的集合，不能为 null。\n- `object`: 要添加的对象，如果为 null 则不会被添加。\n\
  \n### 返回值\n\n如果集合发生了变化，则返回 true。\n\n### 异常\n\n major `NullPointerException`: 如果集合为\
  \ null。\n\n### 示例\n\n下面的示例展示了 `org.apache.commons.collections4.CollectionUtils.addIgnoreNull()`\
  \ 方法的用法。我们正尝试添加一个空值和一个示例非空值。\n\n```java\nimport java .util .Collection ;\nimport\
  \ java .util .LinkedList ;\nimport java .util .List ;\nimport org . apache . commons\
  \ . collections4 . CollectionUtils ;\n\npublic class CollectionUtilsTester {\n \
  \   public static void main ( String [] args ) {\n        List < String > list =\
  \ new LinkedList <>();\n        CollectionUtils . addIgnoreNull (list, null);\n\
  \        CollectionUtils . addIgnoreNull (list, \"sample\");\n        System . out\
  \ . println ( list );\n    }\n}\n```\n\n### 输出\n\n输出如下 −\n\n[sample]\n\n\n\n\n\n\
  ```java\nList < String > list = new LinkedList < String >();\n\nCollectionUtils.addIgnoreNull(list,\
  \ null);\n\nCollectionUtils.addIgnoreNull(list, \"a\");\n\nSystem.out.println(list);\n\
  \nif (list.contains(null)) {\n    System.out.println(\"Null value is present\");\n\
  } else {\n    System.out.println(\"Null value is not present\");\n}\n```\n\n###\
  \ 输出\n\n输出如下所示 −\n\n[a]\n\n空值不存在\n\n[/content] \n\n## 合并与排序\n\nApache Commons Collections\
  \ 库的 `CollectionUtils` 类提供了用于常用操作的实用方法，涵盖了广泛的用例。它有助于避免编写样板代码。在 `jdk 8` 之前，此库非常有用，因为类似的功能现在由\
  \ Java 8 的 `Stream` API 提供。\n\n### 合并两个已排序的列表\n\n`CollectionUtils` 的 `collate()`\
  \ 方法可以合并两个已经排序的列表。\n\n### 声明\n\n以下是 `org.apache.commons.collections4.CollectionUtils.collate()`\
  \ 方法的声明 −\n\n```java\npublic static <O extends Comparable<? super O>> List<O>\n\
  collate(Iterable<? extends O> a, Iterable<? extends O> b)\n```\n\n### 参数\n\n* `a`\
  \ − 第一个集合，不能为 null。\n* `b` − 第二个集合，不能为 null。\n\n### 返回值\n\n一个新的包含集合 `a` 和 `b` 元素的新排序\
  \ `List`。\n\n### 异常\n\n* `NullPointerException` − 如果任意集合为 null。\n\n### 示例\n\n以下示例展示了\
  \ `org.apache.commons.collections4.CollectionUtils.collate()` 方法的使用。我们将合并两个已排序的列表，然后打印合并并排序后的列表。\n\
  \n```java\nimport java.util.Arrays;\nimport java.util.List;\nimport org.apache.commons.collections4.CollectionUtils;\n\
  \npublic class CollectionUtilsTester {\n    public static void main(String[] args)\
  \ {\n        List<String> sortedList1 = Arrays.asList(\"A\", \"C\", \"E\");\n  \
  \      List<String> sortedList2 = Arrays.asList(\"B\", \"D\", \"F\");\n        List<String>\
  \ mergedList = CollectionUtils.collate(sortedList1, sortedList2);\n        System.out.println(mergedList);\n\
  \    }\n}\n```\n\n### 输出\n\n输出如下 −\n\n[A, B, C, D, E, F]\n\n## 转换对象\n\nApache Commons\
  \ Collections 库的 `CollectionUtils` 类提供了用于常用操作的实用方法，涵盖了广泛的用例。它有助于避免编写样板代码。在 `jdk\
  \ 8` 之前，此库非常有用，因为类似的功能现在由 Java 8 的 `Stream` API 提供。\n\n### 转换列表\n\n`CollectionUtils`\
  \ 的 `collect()` 方法可以将一种类型对象的列表转换为另一种类型对象的列表。\n\n### 声明\n\n以下是 `org.apache.commons.collections4.CollectionUtils.collect()`\
  \ 方法的声明 −\n\n```java\npublic static <I,O> Collection<O> collect(Iterable<I> inputCollection,\n\
  Transformer<? super I,? extends O> transformer)\n```\n\n### 参数\n\n* `inputCollection`\
  \ − 获取输入的集合，不能为 null。\n* `Transformer` − 要使用的的转换器，可以为 null。\n\n### 返回值\n\n转换后的结果（新列表）。\n\
  \n### 异常\n\n* `NullPointerException` − 如果输入集合为 null。\n\n### 示例\n\n以下示例展示了 `org.apache.commons.collections4.CollectionUtils.collect()`\
  \ 方法的使用。我们将通过解析字符串中的整数值将字符串列表转换为整数列表。\n\n```java\nimport java.util.Arrays;\nimport\
  \ java.util.List;\nimport org.apache.commons.collections4.CollectionUtils;\nimport\
  \ org.apache.commons.collections4.Transformer;\n\npublic class CollectionUtilsTester\
  \ {\n    public static void main(String[] args) {\n        List<String> stringList\
  \ = Arrays.asList(\"1\", \"2\", \"3\");\n        List<Integer> integerList = (List<Integer>)\
  \ CollectionUtils.collect(\n            stringList, new Transformer<String, Integer>()\
  \ {\n                @Override\n                public Integer transform(String\
  \ input) {\n                    return Integer.parseInt(input);\n              \
  \  }\n            });\n        System.out.println(integerList);\n    }\n}\n```\n\
  \n### 输出\n\n当使用该代码时，将得到以下结果 −\n\n[1, 2, 3]\n\n## 过滤对象\n\nApache Commons Collections\
  \ 库的 `CollectionUtils` 类提供了用于常用操作的实用方法，涵盖了广泛的用例。它有助于避免编写样板代码。在 `jdk 8` 之前，此库非常有用，因为类似的功能现在由\
  \ Java 8 的 `Stream` API 提供。\n\n### filter() 方法\n\n`CollectionUtils` 的 `filter()`\
  \ 方法可以过滤列表以移除不满足传递的谓词条件的对象。\n\n### 声明\n\n以下是 `org.apache.commons.collections4.CollectionUtils.filter()`\
  \ 方法的声明 −\n\n```java\npublic static <T> boolean filter(Iterable<T> collection,\n\
  Predicate<? super T> predicate)\n```\n\n### 参数\n\n* `collection` − 获取输入的集合，不能为 null。\n\
  * `predicate` − 用于过滤的谓词，可以为 null。\n\n### 返回值\n\n如果集合通过此调用被修改，则返回 true，否则返回 false。\n\
  \n### 示例\n\n以下示例展示了 `org.apache.commons.collections4.CollectionUtils.filter()` 方法的使用。我们将过滤整数列表以获取偶数。\n\
  \n```java\nimport java.util.ArrayList;\nimport java.util.Arrays;\nimport java.util.List;\n\
  import org.apache.commons.collections4.CollectionUtils;\nimport org.apache.commons.collections4.Predicate;\n\
  \npublic class CollectionUtilsTester {\n    public static void main(String[] args)\
  \ {\n        List<Integer> integerList = new ArrayList<>();\n        integerList.addAll(Arrays.asList(1,\
  \ 2, 3, 4, 5, 6, 7, 8));\n        System.out.println(\"Original List: \" + integerList);\n\
  \        CollectionUtils.filter(integerList, new Predicate<Integer>() {\n      \
