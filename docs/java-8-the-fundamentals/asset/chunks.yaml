    \ on the Collectors class - in this case we are using the groupingBy Collector,\
    \ and specifying the method that should be used for comparison. The appropriate\
    \ Collector instance will then be generated for us.\n\nOnce elements have been\
    \ grouped it is common to run an aggregation operation on each group (for instance,\
    \ count how many elements are in each group). The groupingBy methods therefore\
    \ accept a second parameter for performing aggregate operations. As an example\
    \ we will process all the time zones available in Java (we will see these again\
    \ later in the book when we look at the new Date and Time API): these can be obtained\
    \ as an array from TimeZone.getAvailableIDs(). These exist in the form:\n\nAfrica/Asmara\n\
    \nEurope/London\n\nWhere the optional first portion (Europe, Africa) represents\
    \ a grouping mechanism, and the portion after the forward slash represents a specific\
    \ value.\n\nWe will write a program that performs the following:\n\n• Filters\
    \ out any zones that don’t have a forward slash in them\n\n• Groups the zones\
    \ by their group (e.g. Europe, Africa)\n\n• Counts how many zones are in each\
    \ group\n\nThis can be performed in a single line as follows:\n\npackage streams;\n\
    \nimport java.util.Arrays;\n\nimport java.util.Map;\n\nimport java.util.TimeZone;\n\
    \nimport java.util.stream.Collectors;\n\npublic class Collecting5 {\n\n public\
    \ static void main(String[] args) {\n\n Map<String, Long> result =\n\n Arrays.asList(TimeZone.getAvailableIDs())\n\
    \n .stream()\n\n .filter(s -> s.indexOf(\"/\") > 0)\n\n .collect(Collectors.groupingBy((String\
    \ s) -> s.substring(0, s.indexOf(\"/\")),\n\n Collectors.counting()));\n\n System.out.println(result);\n\
    \n }\n\n}\n\nNotice the use of Collectors.counting() as the second parameter to\
    \ the groupingBy method. This itself is a Collector, and processes the result\
    \ of the group by. The counting method (unlike the groupingBy method) does not\
    \ need any other information in order to generate a Collector – since it operates\
    \ on a data-structure in the format returned by the groupingBy method (a Map with\
    \ Lists as its values).\n\nThis outputs the following:\n\n{Europe=59, Africa=54,\
    \ SystemV=13, Canada=9, Pacific=42, Etc=35, Asia=91, America=164, Brazil=4, Mexico=3,\
    \ Indian=11, Antarctica=11, Chile=2, Australia=23, Arctic=1, Atlantic=12, US=13}\n\
    \nPartitioning is another form of Collector that is similar to groupingBy. As\
    \ discussed earlier, filter operations return true or false for all elements in\
    \ the stream. Partitioning provides a mechanism to collect all the values that\
    \ are true into one List, and all the values that are false into another List.\
    \ In this example we will create two lists: one for the time zones that have a\
    \ “/” in their name (e.g. America/Cancun), and one for the zones that don’t (e.g.\
    \ Greenwich)\n\npackage streams;\n\nimport java.util.Arrays;\n\nimport java.util.List;\n\
    \nimport java.util.Map;\n\nimport java.util.TimeZone;\n\nimport java.util.stream.Collectors;\n\
    \npublic class Collecting4 {\n\n public static void main(String[] args) {\n\n\
    \ List<String> zones = Arrays.asList(TimeZone.getAvailableIDs());\n\n Map<Boolean,\
    \ List<String>> zonesCompare =\n\n zones.stream()\n\n .collect(Collectors.partitioningBy(s\
    \ -> s.indexOf(\"/\") > 0));\n\n System.out.println(zonesCompare);\n\n }\n\n}\n\
    \nAnother good example of Collecting is adding a comma between every word in a\
    \ List. I have previously used Apache Common's StringUtils.join method for this,\
    \ since it is tedious to code yourself. The trick to joining is that the comma\
    \ (or other delimiter) should not occur after the last element, therefore it is\
    \ hard to achieve with simple iteration.\n\nJoining can easily be achieved with\
    \ Streams as follows:\n\npackage streams;\n\nimport java.util.Arrays;\n\nimport\
    \ java.util.List;\n\nimport java.util.stream.Collectors;\n\npublic class Collecting\
    \ {\n\n public static void main(String[] args) {\n\n List<String> strings = Arrays.asList(\"\
    This\", \"is\", \"a\", \"list\");\n\n String s = strings.stream()\n\n .collect(Collectors.joining(\"\
    , \"));\n\n System.out.println(s);\n\n }\n\n}\n\nThis takes advantage of the join\
    \ Collector, which accepts the parameter that should be placed between each element.\
    \ This prints out:\n\nThis, is, a, list\n\nNotice that this does not contain a\
    \ comma after the last element.\n\nCollectors can also be used for collecting\
    \ the results of a pipeline into a new Collection such as a List or a Set. This\
    \ can be achieved as follows:\n\npackage streams;\n\nimport java.util.Arrays;\n\
    \nimport java.util.List;\n\nimport java.util.Map;\n\nimport java.util.stream.Collectors;\n\
    \npublic class Collecting {\n\n public static void main(String[] args) {\n\n List<Person>\
    \ people = Arrays.asList(\n\n  new Person(\"Albert\", \"Smith\"),\n\n new Person(\"\
    John\", \"James\"),\n\n new Person(\"John\", \"Brown\"),\n\n new Person(\"William\"\
    , \"Hughes\"),\n\n new Person(\"William\", \"Fleming\")\n\n );\n\n List<Person>\
    \ filteredList = people.stream()\n\n .filter(p -> p.getFirstName().equals(\"William\"\
    ))\n\n .collect(Collectors.toList());\n\n System.out.println(filteredList);\n\n\
    \ }\n\n}\n\nThis filters out all the Person instances where the first name is\
    \ “William”, and adds the result to a new list.\n\n## Other operators\n\nThe Streams\
    \ API is a large API, and will take some time to learn in its entirety. The following\
    \ are potentially the most useful intermediate operations provided by the Streams\
    \ API that have not been introduced up until now:\n\n**• distinct**: removes any\
    \ duplicate elements (based on the equals implementation) from the stream\n\n\
    **• limit**: limit the elements in the stream to a specific number. This could\
    \ be useful for processing search results if only a maximum of 100 results were\
    \ to be shown. It can also result in performance improvements since it allows\
    \ you to reduce the elements in the stream mid-way through the pipeline.\n\n**•\
    \ map**: this is a generic version of the mapToInt method seen above. It takes\
    \ each element in turn and returns a value (potentially of a different type) based\
    \ on some transformation.\n\n**• sorted**: this provides a mechanism for sorting\
    \ the elements, either based on natural order or a Comparator. This can be called\
    \ anywhere in the pipeline prior to the terminal operation, so it is useful when\
    \ a map operation may have resulted in an unordered stream.\n\nThe following are\
    \ the most useful terminal operators available on Stream not discussed in the\
    \ sections above (as discussed above, specialized streams such as DoubleStream\
    \ contain additional terminal operators):\n\n**• allMatch**: this accepts a Predicate\
    \ and returns true if all elements return true from the predicate"
