    \ s2).forEach(s -> System.out.print(s));\n\nThe stream created in the final line\
    \ above will process 5 elements.\n\nStreams can also be generated via static helpers\
    \ on the Random class. Random.ints(), Random.longs() and Random.doubles() provide\
    \ mechanisms for returning an unlimited stream of pseudorandom integers , longs\
    \ and doubles respectively (although the quantity of values can be bound by an\
    \ optional parameter). It is also possible to define a range for the numbers;\
    \ for instance we could request a Stream of 100 random ints between 0 and 100,000\
    \ as follows:\n\nRandom.ints(100, 0, 100000)\n\nNaturally these return Streams\
    \ appropriate for the type of number, so the example above returns an IntStream.\n\
    \nPossibly the most useful source of Streams outside of Collections however is\
    \ Streams created from Files.\n\nJava 7 introduced a Files class with a set of\
    \ static helpers. This has been enhanced in Java 8 to include methods that return\
    \ Streams. In order to see this in action, start by creating a text file on your\
    \ file system, and add a few lines to it.\n\nThe following example shows how that\
    \ file can be read as a Stream, and processed with all the operations we have\
    \ seen above:\n\npackage streams;\n\nimport java.io.IOException;\n\nimport java.nio.file.*;\n\
    \nimport java.util.logging.*;\n\npublic class FileReading {\n\n public static\
    \ void main(String[] args) {\n\n Path path = Paths.get(\"/tmp/test.txt\");\n\n\
    \ try {\n\n Files.lines(path).distinct()\n\n.forEach(s -> System.out.println(s));\n\
    \n } catch (IOException ex) {\n\n Logger.getLogger(FileReading.class.getName())\n\
    \n.log(Level.SEVERE, \"IO Error\", ex);\n\n }\n\n }\n\n}\n\nThis program looks\
    \ for a file called /tmp/test.txt and converts it into a Stream via the Files.lines()\
    \ method (this assumes a default character encoding of UTF-8, but it can be overridden\
    \ with an optional parameter). The intermediary operation distinct is then used\
    \ to remove duplicate lines, and the results are printed out with the terminal\
    \ forEach operator.\n\nNotice that this never needs to read the whole file into\
    \ memory: it can simply Stream one line at a time through the pipeline, and then\
    \ move onto the next line.\n\nFinally, it is possible to generate a Stream from\
    \ an array using a static helper on Arrays. The following is a very simple example\
    \ that prints out the sum of the numbers in an array. Due to the fact that the\
    \ array is of type int, the Stream returned is an IntegerStream, and therefore\
    \ the sum aggregate operation can be used:\n\npackage streams;\n\nimport java.util.Arrays;\n\
    \npublic class ArraysStream {\n\n public static void main(String[] args) {\n\n\
    \ int[] intArray = {4,2,5,7,66,4,3};\n\n int result = Arrays.stream(intArray).sum();\n\
    \n System.out.print(result);\n\n }\n\n}\n\n## Parallel Programming\n\nI mentioned\
    \ at the start of this chapter that the Streams API was intended to revolutionize\
    \ the way Java programmers thought about, and wrote code using parallel processing.\
    \ Up until this point we have not seen any evidence of this: the Streams examples\
    \ above are not any different from iterators from a threading point of view.\n\
    \nBefore looking at parallelism it is best to start with a recap of the reasons\
    \ parallel processing is useful. Due to the fact that all modern computers (and\
    \ even smart phones) contain multiple cores, any program that is not performing\
    \ parallel computing (processing on multiple Threads) is by definition not exploiting\
    \ the full potential of the hardware for CPU bound operations.\n\nOn the whole,\
    \ server-side Java frameworks (such as EJB or Servlets) do allow programmers to\
    \ perform parallel computing with minimal effort, since the application server\
    \ manages threads. The programmer does not need to ask the application server\
    \ to run concurrent Servlet requests in multiple threads (and therefore potentially\
    \ on multiple cores), it happens automatically. Outside the application server,\
    \ however, the programmer is still responsible for instructing the computer how\
    \ to parallelize algorithms across multiple threads.\n\n### MapReduce\n\nBefore\
    \ discussing the implementation the Streams API uses for parallelism, it is worth\
    \ taking a step back and looking at an algorithm called MapReduce that heavily\
    \ influenced this coding style. The MapReduce algorithm was popularized by Google\
    \ researchers via a paper written in 2004, ([http://research.google.com/archive/mapreduce.html](http://research.google.com/archive/mapreduce.html))\
    \ but the operations of map and reduce have been around far longer. Google’s insight\
    \ was to realize how these operations could be used to process massive quantities\
    \ of data on thousands of computers simultaneously (called a cluster).\n\nMapReduce\
    \ consists of two primary operations:\n\n• During the map step (which can be run\
    \ in parallel across many machines) each element in the list is filtered, transformed\
    \ or sorted as required. This obviously relates to the intermediate operations\
    \ we have already seen on the Stream API such as map and filter.\n\n• Once the\
    \ map step is complete the results are passed to the reduce step (which may or\
    \ may not be run in parallel). The reduce step is responsible for aggregating\
    \ the data in some manner. This step is obviously related to the terminal operations\
    \ we have seen on the Stream API.\n\nMany MapReduce implementations have sprung\
    \ up since Google published their paper, including Hadoop, which is an open source\
    \ Java implementation. Typically these implementations designate one computer\
    \ to be the controller: this farms out work to other nodes, which operate independently\
    \ of one another, and collects the results. For instance, a 20GB file may be split\
    \ into 10MB chunks, and each chunk sent to a different computer to be processed.\n\
    \nThe benefits of implementations like Hadoop is that the programmer does not\
    \ need to focus on the implementation of the multi-threaded code: they simply\
    \ need to provide a set of operations and the framework takes care of the farming\
    \ out the algorithm to potentially thousands of cores.\n\n### Fork/Join API"
