    # 软件工程师学习 Java 8 —— 基础


    **作者：Dane Cameron**


    **© 2014 Dane Cameron**


    版权所有。未经出版者事先书面许可，不得以任何形式或通过任何手段（包括复印、录制或其他电子或机械方法）复制、传播或传输本书的任何部分，但批判性评论中的简短引用以及版权法允许的某些非商业用途除外。


    原始及修改后的封面设计由 Karuanka Rayker 和 CoverDesignStudio.com 设计。


    Cisdal Publishing


    dane@cisdal.com


