    \ processing is used however, since Collections are not thread-safe.\n\nBefore\
    \ considering parallelization, therefore, it is worth asking the following questions:\n\
    \n**Will parallel processing improve performance?**\n\nParallel processing will\
    \ not necessarily improve performance. Some operations, such as sorting and collecting,\
    \ are not always quicker in parallel. It is therefore always wise to benchmark\
    \ algorithms in serial and parallel mode to confirm that parallelism is actually\
    \ providing benefits.\n\nIf you consider the groupingBy examples above, these\
    \ added all related elements to a common List. Java Lists are not thread-safe,\
    \ therefore the groupingBy method will need to synchronize access to the List,\
    \ and this could easily negate the benefits of parallel processing.\n\nLikewise\
    \ with sorting, it is possible to perform parallel sorts: each thread can use\
    \ an algorithm such as quicksort to process a subset of the elements, and then\
    \ these sets of sorted elements can be sorted using merge sort: depending on the\
    \ quantity of data, this will not necessarily be quicker that performing a serial\
    \ sort.\n\nFinally, the distinct operation is another example of an operation\
    \ that is hard to perform with parallel processing – particularly in an unsorted\
    \ set of data. Each thread can easily determine the distinct elements amongst\
    \ the data it has been asked to process – but naturally these distinct sets from\
    \ each thread would need to be joined back together to get a definitive list of\
    \ distinct elements.\n\n**Can the algorithm be parallelized?**\n\nNot all algorithms\
    \ can be parallelized without resulting in bugs. This is particularly common for\
    \ reduce operations - specifically, reduce operations need to be associative in\
    \ order to be parallelizable.\n\nAs an example, summing a list of numbers is always\
    \ associative. This is because it does not matter which order we process the numbers\
    \ in. If we have the numbers 8, 6 and 3 we can sum these as (8 + 6) + 3 or 8 +\
    \ (6 + 3). No matter how we add these three numbers the result will be 17.\n\n\
    Other reduce operations are not associative. Subtraction, for instance, depends\
    \ on the order of the elements (8 – 6) – 3 = -1 whereas (3 – 8) – 6 = -11.\n\n\
    To see this in action, consider the following program:\n\npackage streams;\n\n\
    import java.util.OptionalInt;\n\nimport java.util.stream.IntStream;\n\npublic\
    \ class Associative {\n\n public static void main(String[] args) {\n\n OptionalInt\
    \ result = IntStream.range(1, 1000)\n\n .parallel()\n\n .reduce((a, b) -> a-b);\n\
    \n System.out.println(result.getAsInt());\n\n result = IntStream.range(1, 1000)\n\
    \n .reduce((a, b) -> a-b);\n\n System.out.println(result.getAsInt());\n\n }\n\n\
    }\n\nIn both cases the Stream contains identical elements, and the reduce operation\
    \ contains an identical implementation, but the first reduce occurs in the context\
    \ of parallel processing. If I run this I get the following output.\n\n-124\n\n\
    -499498\n\nIf however I change this reduce operation to perform a sum:\n\nIntStream.range(1,\
    \ 1000).reduce((a, b) -> a+b);\n\nBoth examples produce identical results:\n\n\
    499500\n\n499500\n\nThis is dangerous: the compiler is not able to detect that\
    \ we are performing a non-associative operation; therefore we have introduced\
    \ a bug that is not easy to spot.\n\nThe point to learn from this is that you\
    \ should not introduce parallelism for the sake of it: you should decide what\
    \ you are trying to achieve with parallelism, and you should check that your algorithm\
    \ functions correctly as a parallel operation."
