    \ previous example.\n\nIf omitted, this uses the default value for the data-type\
    \ returned, e.g. 0 for numbers.\n\n## Collecting\n\nAnother useful terminal operation\
    \ is collecting. Collecting provides a mechanism for accumulating or summarizing\
    \ elements based on a set of criteria.\n\nAs an example, consider a list of the\
    \ Person class from earlier in the book. We may want to group all the Person instances\
