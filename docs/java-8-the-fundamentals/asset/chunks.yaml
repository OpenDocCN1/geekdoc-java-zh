    \ by a new operator called the “double colon”.\n\nLet’s take the very simplest\
    \ example we can. Suppose we want to pass each element in a list to the System.out.println\
    \ method. The println method meets the requirements of the Consumer functional\
    \ interface (it accepts a single parameter and returns void); therefore it can\
    \ be used as an instance of Consumer:\n\npackage lambda;\n\nimport java.util.Arrays;\n\
    \nimport java.util.List;\n\npublic class Main3 {\n\n public static void main(String[]\
    \ args) {\n\n List<String> l = Arrays.asList(\"Hello\", \"World\",\n\n\"Print\"\
    , \"My\", \"List\");\n\n l.forEach(System.out::println);\n\n }\n\n}\n\nThe key\
    \ here is the statement “System.out::println”. Essentially this is saying that\
    \ there is a method called “println” on the object represented by the variable\
    \ “out”, and this should be used as the lambda expression accepted by the forEach\
    \ method. Since forEach accepts a Consumer, the println method is implicitly converted\
    \ to be an object of type Consumer as part of the process.\n\nIf we go back to\
    \ the example of removing even number elements from the list: suppose we already\
    \ had the following utility class:\n\npackage lambda;\n\npublic class Detector\
    \ {\n\n public boolean isEven(int i) {\n\n return i%2 == 0;\n\n }\n\n public boolean\
    \ isOdd(int i) {\n\n return !isEven(i);\n\n }\n\n}\n\nThis is a simple utility\
    \ that detects odd and even numbers: it has nothing to do with lambda expressions,\
    \ and could have pre-dated Java 8. We could rewrite the filtering example as follows:\n\
    \npackage lambda;\n\nimport java.util.Arrays;\n\nimport java.util.LinkedList;\n\
    \nimport java.util.List;\n\npublic class Main4 {\n\n public static void main(String[]\
    \ args) {\n\n Detector d = new Detector();\n\n List<Integer> l = new LinkedList\n\
    \n(Arrays.asList(4,5,88,76,55,23,7,20,45));\n\n l.removeIf(d::isEven);\n\n System.out.println(l);\n\
    \n }\n\n}\n\nOr, if we made isEven a static method, we could execute the following:\n\
    \nl.removeIf(Detector::isEven);\n\nThis is a very useful technique, since it means\
    \ existing code can be re-purposed to adapt to an interface it does not explicitly\
    \ implement. This means, for instance, any zero arguments method can be repurposed\
    \ to implement the Runnable interface and executed by a Thread.\n\nSorting lists\
    \ is a very common operation, and is supported by the Comparator and Comparable\
    \ interfaces. I have always been annoyed by the fact that the sort method was\
    \ a static helper on the Collections class, rather than a method on the List class.\
    \ This was presumably because List was an Interface rather than a class, and therefore\
    \ the sort method would have needed to be implemented on each implementation of\
    \ List.\n\nAs we will see later, this is no longer a constraint for Java, and\
    \ therefore Java has rectified this situation in Java 8 via a sort method on List\
    \ (despite the fact it is an interface), and made Comparator a functional interface\
    \ in the process.\n\nTo demonstrate this we will create a very simple Person class:\n\
    \npackage lambda;\n\npublic class Person {\n\n String firstName,lastName;\n\n\
    \ public Person(String firstName, String lastName) {\n\n this.firstName = firstName;\n\
    \n this.lastName = lastName;\n\n  }\n\n public String getFirstName() {\n\n return\
    \ firstName;\n\n }\n\n public String getLastName() {\n\n return lastName;\n\n\
    \ }\n\n @Override\n\n public String toString() {\n\n return firstName + \" \"\
    \ + lastName;\n\n }\n\n}\n\nWe can now create a list of Person instances, and\
    \ sort it based on firstName as follows:\n\npackage lambda;\n\nimport java.util.Arrays;\n\
    \nimport java.util.List;\n\npublic class Main5 {\n\n public static void main(String[]\
    \ args) {\n\n List<Person> l = Arrays.asList(\n\n    new Person(\"Albert\", \"\
    Smith\"),\n\n new Person(\"Jim\", \"James\"),\n\n new Person(\"John\", \"Brown\"\
    ),\n\n new Person(\"William\", \"Hughes\"),\n\n new Person(\"Simon\", \"Fleming\"\
    )\n\n );\n\n l.sort((p1, p2) -> p1.getFirstName().compareTo(p2.getFirstName()));\n\
    \n System.out.println(l);\n\n }\n\n}\n\nThe statement:\n\n(p1, p2) -> p1.getFirstName().compareTo(p2.getFirstName())\n\
    \nis implicitly constructed into an Object of type Comparator as part of this\
    \ process.\n\nNotice here that the sort operation is mutating: it changes the\
    \ original list rather than returning a new list with the elements sorted.\n\n\
    I would take a lot of convincing that the equivalent code with anonymous classes\
    \ (while functionally equivalent) is as readable:\n\nl.sort(new Comparator<Person>()\
    \ {\n\n @Override\n\n public int compare(Person p1, Person p2) {\n\n return p1.getFirstName().compareTo(p2.getFirstName());\n\
    \n }         \n\n});\n\n## Scope\n\nAs we have seen above, lambda expressions\
    \ can use variables that were in scope when they were created. There is a caveat\
    \ however – they can use those variables as long as they do not change their values\
    \ after they are declared.\n\nAs an example, consider the following functional\
    \ interface:\n\npackage lambda;\n\n@FunctionalInterface\n\npublic interface NumberAdder\
    \ {\n\n int add(int x);\n\n}\n\nThis has a method called add that accepts an integer,\
    \ and returns an integer.\n\nWe will now create a method that returns a NumberAdder\
    \ as follows:\n\npublic static NumberAdder getNumberAdder() {\n\n int startingNumber\
    \ = 10;\n\n return x -> x + startingNumber;\n\n}\n\nThis method declares a local\
    \ variable called startingNumber, and then returns an instance of NumberAdder\
    \ that will (when invoked) add startingNumber to the number that is passed to\
    \ the lambda expression.\n\nUnder normal circumstances the startingNumber variable\
    \ would be implicitly destroyed when the method completes (remember, local variable\
    \ references exist on the stack, and are popped off the stack when the method\
    \ completes). In the case of lambda expressions however, the variable survives\
    \ when the method completes. Here is the complete class including the invoking\
    \ method:\n\npackage lambda;\n\npublic class Main6 {\n\n public static void main(String[]\
    \ args) {\n\n NumberAdder na = getNumberAdder();\n\n System.out.print(na.add(20));\n\
    \n }\n\n public static NumberAdder getNumberAdder() {\n\n int startingNumber =\
    \ 10;\n\n return x -> x + startingNumber;\n\n }\n\n}\n\nWhen this runs it will\
    \ print out 30\\. Lambda expressions that use variables in this manner are said\
    \ to be “capturing lambdas”, since they capture copies of the variables that were\
    \ in scope when they were constructed.\n\nIn order for this little bit of magic\
    \ to work, the variable startingNumber must be final or “effectively final”. Even\
    \ the following code is invalid and won’t compile:\n\npublic static NumberAdder\
    \ getNumberAdder() {\n\n int startingNumber = 10;\n\n startingNumber++;\n\n return\
    \ x -> x + startingNumber;\n\n }\n\nThe term “effectively final” is new. Essentially\
    \ it means that the variable must behave as though it was final, even though it\
    \ doesn’t need to be marked as final. Basically, if the variable would not be\
    \ valid with the final modifier added, it is not valid for use by a lambda expression.\n\
    \nThis constraint is controversial and was added to reduce concurrency issues\
    \ that could arise from mutating variables. Up until Java 8 you could never have\
    \ threading issues with local variables: simply put it was impossible for two\
    \ threads to be sharing the same instance of a local variable since they are created\
    \ inside a method, and two threads invoking the same method would receive their\
    \ own independent copies of the variables."
