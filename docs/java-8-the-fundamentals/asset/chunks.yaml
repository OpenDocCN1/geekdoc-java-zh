    \ {\n\n public int number = 10;\n\n}\n\nAnd changing the main class as follows:\n\
    \npackage lambda;\n\npublic class Main7 {\n\n public static void main(String[]\
    \ args) {\n\n NumberAdder na = getNumberAdder();\n\n System.out.print(na.add(20));\n\
    \n }\n\n public static NumberAdder getNumberAdder() {\n\n IntegerHolder ih = new\
    \ IntegerHolder();\n\n ih.number = 10;\n\n NumberAdder na = x -> x + ih.number;\n\
    \n ih.number = 20;\n\n return na;\n\n }\n\n}\n\nIn this case, the ih variable\
    \ is effectively final, since we do not change the object referenced after the\
    \ variable is initialized. We do however change the number held by the object\
    \ after creating the lambda expression.\n\nIn this case the result of the operation\
    \ is 40, since when the lambda expression is invoked, the value of the number\
    \ field had been changed to 20.\n\nThis approach does naturally open the code\
    \ up to the concurrency issues that the specification was trying to avoid through\
    \ the use of final variables, and therefore should not be seen as a feature.\n\
    \n## Conclusion\n\nAs you have seen, lambda expressions provide a mechanism for\
    \ constructing anonymous methods and passing them as parameters to other methods.\n\
    \nThe debate around lambda expressions in the Java community has seemed endless.\
    \ Not only was their release delayed from Java 7 to Java 8, there has been a huge\
    \ amount of debate and criticism of them.\n\nEven now that they have been included\
    \ there is an argument in some circles that lambda expressions are “syntactic\
    \ sugar” – they are simply an alternative way of implementing an interface, and\
    \ therefore are no different from pre-Java 8 anonymous and local classes.\n\n\
    You can make an argument about any programming language or programming language\
    \ construct that it is just syntactic sugar on top of some other construct (such\
    \ as assembler, and ultimately machine code), since there is nothing that can\
    \ be achieved in a high level language such as Java that could not be achieved\
    \ in assembler or machine code. The point is, languages such as Java provide a\
    \ more convenient mechanism for a human to describe a set of tasks to a computer.\
    \ In the same way, lambda expressions will make it a lot easier for a lot of Java\
    \ programmers to describe tasks to the Java compiler.\n\nAlthough lambda expressions\
    \ do not allow you to do anything you could not have done without them, they have\
    \ the ability to change the way you think about solving problems in Java. This\
    \ theme will be carried through to the next chapter on the Streams API: since\
    \ this is where lambda expressions shine brightest.\n\n# Streams API\n\nJava 8\
    \ introduces a new API called the Streams API as part of the lambda expressions\
    \ JSR. These should not be confused with input and output streams; they are a\
    \ mechanism for processing a sequence of elements (such as the elements in a Collection).\
    \ Java 8 formally defines streams as “a sequence of elements supporting sequential\
    \ and parallel aggregate operations.”\n\nAs we will see later in the chapter,\
    \ the Streams API is part of a push to simplify the way parallel algorithms can\
    \ be implemented in Java by allowing programmers to request parallel processing\
    \ rather than implementing it. Streams are a lot more than that however, they\
    \ provide an alternative to iteration, and provide support for a variety of operations,\
    \ all of which can utilize lambda expressions.\n\nWe will begin with some very\
    \ basic Streams examples, returning to my favorite of excluding even numbers from\
    \ a List. This can be accomplished as follows:\n\npackage streams;\n\nimport java.util.Arrays;\n\
    \nimport java.util.List;\n\npublic class EvenOnly {\n\n public static void main(String[]\
    \ args) {\n\n List<Integer> l = Arrays.asList(5,4,88,76,55,23,7,20,45);\n\n    l.stream().filter(p\
    \ -> p%2==1)\n\n.forEach(i -> System.out.print(i+\" \"));\n\n }\n\n}\n\nAfter\
    \ creating the list we first access its stream with the stream() method. This\
    \ returns an object of type java.util.stream.Stream<Integer>. We will look at\
    \ what streams are in more detail soon, but for now just think of them as a way\
    \ of conveying elements from a source of data (i.e. the List) to a function (i.e.\
    \ filter).\n\nThis code “internally iterates” over every element in the list (as\
    \ seen in the previous chapter with forEach), and passes each element in turn\
    \ to the filter method. This is opposed to “external iteration” with for loops\
    \ and iterators, since the programmer does not need to declare the fact they wish\
    \ to process each element in the loop, and they do not need to control the iteration.\n\
    \nExternal iteration may not seem like a huge inconvenience that needs to be alleviated\
    \ – especially since the introduction of the Collection-based for loops. Internal\
    \ iteration can bring unseen benefits, however, since it may implement different\
    \ strategies to iterate different collections, therefore allowing behavior to\
    \ be added implicitly (such as parallel processing).\n\nThe filter method is referred\
    \ to as an intermediate operation. As each element is processed, those that pass\
    \ the filter are then passed to the forEach method, which is a terminal operation.\n\
    \nThe type returned by the filter() method is itself a Stream, and therefore it\
    \ is possible to chain a whole set of intermediate operations together into a\
    \ “pipeline”. Pipelines are facilitated by the fact that the output of one operation\
    \ becomes the input of another operation.\n\nPipelines are widely used in computing:\
    \ for instance the Unix/Linux command line supports pipelines where the output\
    \ of one program is passed as the input to another program via the “|” operator.\
    \ For instance, this finds any processes running for the user that contain “java”\
    \ in their name:\n\nps | grep 'java'\n\nThe convention in Unix that allows this\
    \ is that programs produce ASCII text to standard output, and other programs read\
    \ ASCII text from standard input. The pipe operation therefore pipes the standard\
    \ output of one program to the standard input of another.\n\nAs we will see throughout\
    \ this chapter, pipelines provide a mechanism for describing a complex set of\
    \ functionality in easy to understand chunks.\n\nTerminal operators (as their\
    \ name suggests) represent the end of a pipeline, and they are responsible for\
    \ terminating the stream in some manner. forEach is not the most obvious example\
    \ of a terminal operation, but it provides a manner of accessing all the elements\
    \ after they have been processed by the pipeline, and performing some operation\
    \ on them (printing them out in this case). You will notice that the forEach method\
    \ returns void, therefore the pipeline cannot continue after this method has been\
    \ invoked.\n\nUnlike the removeIf method seen earlier, this pipeline does not\
    \ alter the original Collection in any way: it simply provides a mechanism for\
    \ processing its elements.\n\nWith the example above, the first element in the\
    \ List (5) is passed to the lambda expression of the filter method, and is evaluated\
    \ to true (it is odd). As a result, this element is passed to the lambda expression\
    \ of the forEach method, which causes the number to be printed.\n\nOnce the element\
    \ has been all the way through the pipeline, the next number (4) is processed.\
    \ Since the filter lambda expression will return false for this number it will\
    \ never be passed to the forEach lambda expression, and so on."
