  trans: "\n表面上看，这一切似乎都是合理的。然而，我们有充分的理由为什么我们可能在函数执行完成后仍希望访问函数作用域变量。但是，我们并不希望将这些变量变成全局变量（我们可以通过在变量声明时省略\
    \ `var` 关键字来实现）。这可以通过闭包来实现。\n\n考虑以下代码：\n\n```javascript\nfunction f2() {\n  var\
    \ i = 0;\n  return function() {\n    return ++i;\n  };\n}\n```\n\n该函数执行了以下操作：\n\
    \n1. 了一个名为 `i` 的函数作用域变量，并初始化为 0。\n2. 返回一个函数，该函数在被调用时会增加该变量的值。\n\n因此，我们可以调用这个函数并将结果（一个函数）赋值给变量：\n\
    \n```javascript\nincrementer = f2()\n```\n\n根据我们上面对函数作用域变量的解释，你可能会认为在 `f2` 内部定义的变量在函数调用\
    \ `f2` 完成后会被毁。因此，当我们调用从 `f2` 返回的函数时，将没有 `i` 变量供其访问（因为它已经被销毁了）。但事实并非如此：\n\n```javascript\n\
    incrementer()\n1\nincrementer()\n2\nincrementer()\n3\n```\n\n当匿名函数在函数 `f2` 内部定义时，它“闭包”了它在那个时刻的环境，并保留了该环境的副本。由于变量\
    \ `i` 在函数声明时是可访问的，因此当函数被调用时，它仍然可用。JavaScript 已经意识到匿名函数引用了变量 `i`，并且该函数没有被销毁，因此它没有销毁它所依赖的\
    \ `i` 变量。\n\n如果我们使用相同的机制构造另一个函数：\n\n```javascript\nincrementer2 = f2()\n```\n\n\
    这也可以访问一个名为 `i` 的变量，其状态如函数创建时，但它将是该变量的新版本：\n\n```javascript\nincrementer2()\n1\n\
    incrementer2()\n2\nincrementer2()\n3\n```\n\n这看起来像是语言的一个简单特性，但它是一个极其强大的特性。\n\n\
    JavaScript 默认并不擅长隐藏数据。在对象内部无法声明属性为私有。例如，考虑以下这个提供相同基本“计数器”功能的对象：\n\n```javascript\n\
    obj1 = {i: 0,\nincrement: function() {\n  return ++this.i;\n  }\n}\n```\n\n这看起来工作正常正常：\n\
    \n```javascript\nobj1.increment()\n1\nobj1.increment()\n2\nobj1.increment()\n\
    3\n```\n\n但这里存在潜在的问题。任何拥有此对象引用的人都可以更改 `i` 的当前值：\n\n```javascript\nobj1.i = 20\n\
    ```\n\n一旦执行此操作，下次增加数字的调用将跳到 21：\n\n```javascript\nobj1.increment()\n21\n```\n\n\
    这可能是一个很大的问题；如果发生以下情况，可能会是一个更大的问题：\n\n```javascript\nobj1.i = \"hello world\"\n\
    ```\n\n现在下一次调用将返回如下：\n\n```javascript\nobj1.increment()\nNaN\n```\n\n基于闭包的实现解决了这个问题。没有办法修改\
    \ `i` 的值，或影响函数返回的值。如果函数调用返回 5，那么下一次函数调用保证返回 6。\n\n数据隐藏（或封装）在编写大型应用程序时是一个极其重要的概念。它允许我们编写具有定义良好的公共接口（或\
    \ API）的代码模块，同时向调用者隐藏（或封装）内部逻辑和状态。这减少了错误，因为代码不会意外损坏模块的状态。\n\n用于实现基于闭包的计数器的方法是一种设计模式表示。设计模式是解决常见问题的常用、可重用方法。这种方法被称为\
    \ `module` 设计模式。\n\n模块设计模式通常也通过返回一个对象而不是函数来实现。这允许对象使用私有变量作为其私有属性和函数，同时暴露一系列公共属性和方法。上述功能可以重写如下：\n\
    \n```javascript\nfunction createIncrementer() {\n  var i = 0;\n  return {\n  \
    \  increment: function() {\n      return ++i;\n    }\n  };\n}\n```\n\n我们现在可以创建一个计数器对象：\n\
    \n```javascript\nobj2 = createIncrementer();\n```\n\n一旦创建，我们现在调用 increment 方法，并一致地接收到一个加\
    \ 1 的值：\n\n```javascript\nobj2.increment()\n1\nobj2.increment()\n2\nobj2.increment()\n\
    3\n```\n\n我们可以尝试通过调用以下代码来更改对象的内部状态：\n\n```javascript\nobj2.i = 10\n```\n\n但这一切所做的只是在对象上创建了一个新属性：\n\
    \n```javascript\nobj2.i\n10\n```\n\n这并不是用作对象计数状态的属性：\n\n```javascript\nobj2.increment()\n\
    4\nobj2.increment()\n5\nobj2.increment()\n6\n```\n\n## 作用域与“this”\n\n为了完全理解一种语言，你必须理解它处理变量作用域的方法。理解作用域告诉我们各种变量在程序中何时变为可用，以及当存在多个同名可用变量时使用哪一个变量。\n\
    \n让我们从一个简单的例子开始：\n\n```javascript\nfunction getNumber() {\n  num = 10;\n  return\
    \ num;\n}\n```\n\n这是一个始终返回 10 的函数：\n\n```javascript\ngetNumber()\n10\ngetNumber()\n\
    10\n```\n\n当这个函数结束时，可能变量 `num` 是可用的，基于我们之前对函数变量的讨论：\n\n```javascript\nnum\n10\n\
    ```\n\n由于我们忘记使用 `var` 声明 `num` 变量：\n\n```javascript\nfunction getNumber() {\n\
    \  this.num = 10;\n  return num;\n}\n```\n\n在函数内部，`this` 指向一个特殊的 `window` 对象。你可以通过在控制台输入\
    \ `this` 看到：\n\n```javascript\nthis\nWindow{top: Window, location: Location, chrome:\
    \ Object}\n```\n\n严格来说这是不对的；它只在浏览器环境中执行函数时正确。\n\n事实上，这个函数可以写成：\n\n```javascript\n\
    function getNumber() {\n  this.num = 10;\n  return this.num;\n}\n```\n\n`window`\
    \ 对象是一个包含环境信息的全局对象，但也是函数内部默认添加属性的对象。`window` 对象对网页中的任何代码（包括外部库）可用，因此它被称为全局作用域。在任何中等规模的应用程序中向\
    \ `window` 对象添加属性都是危险的。由于全局属性可以被任何代码读取和写入，其他代码可能会覆盖你的变量。\n\n如果你确实需要全局变量（示例应用程序将创建一个），在\
    \ `window` 中创建一个单一对象来存放应用程序的所有变量通常是一个好主意：\n\n```javascript\nwindow.THEAPP = {};\n\
    window.THEAPP.myproperty = 'myvalue';\n```\n\n正如前面提到的，`this` 变量在对象的方法内部具有不同的含义：\n\
    \n```javascript\nobj = { num: 10,\nadd: function(num2) {\n  this.num += num2;\n\
    \  return this.num;\n}\n}\n```\n\n这是一个非常简单的对象，包含一个初始化为 10 的 `num` 属性。它还暴露了一个 `add`\
    \ 方法，将传入的参数加到该属性并返回结果：\n\n```javascript\nobj.add(10)\n20\nobj.add(10)\n30\n```\n\
    \n你会注意到对象方法内部的 `this` 指不是全局 `window` 对象，而是对象本身。\n\n让我们更进一步：\n\n```javascript\n\
    obj = { num: 10,\nadd: function(num2) {\n helper = function(num2) {\n  this.num\
    \ += num2;\n  return this.num;\n }\n return helper(num2);\n }\n}\n```\n"
- fmt: "\nIn this example we are declaring a function inside the object’s method.\
    \ Although this is a contrived example, the approach used here is common (especially\
    \ for event listeners).\n\nIntuitively it looks like this code should work: the\
    \ helper function is using `this.num` to access the `num` property on the object.\
    \ Unfortunately this code does not work as expected:\n\n```\nobj.add(20)\n```\n\
    ```\nNaN\n```\n\nThe problem can be seen if we add some logging to the code:\n\
    \n```\nobj = { nums: 10,\n  add: function(num2) {\n    console.log('Outer this\
    \ ' + this)\n    helper = function(num2) {\n      console.log('Inner this ' +\
    \ this)\n      this.num += num2;\n      return this.num;\n    }\n    return helper(num2);\n\
    \  }\n}\n```\n\nIf you execute this now, you will see the following output:\n\n\
    ```\nobj.add(20)\nOuter this [object Object]\nInner this [object Window]\nNaN\n\
    ```\n\nSurprisingly the `this` inside the inner function has reverted from being\
    \ the object to being the `window`. This is considered by most as a bug in the\
    \ language, but it is a bug that will not be rectified since it would break legacy\
    \ code.\n\nThe common way to avoid this issue is as follows:\n\n```\nobj = { num:\
    \ 10,\n  add: function(num2) {\n    var that = this;\n    helper = function(num2)\
    \ {\n      that.num += num2;\n      return that.num;\n    }\n    return helper(num2);\n\
    \  }\n}\n```\n\nBefore entering the inner function we declare a variable called\
    \ `that`, and set it to refer to the `this` object (the object itself). Inside\
    \ the inner function we then access the `that` variable rather than the `this`\
    \ variable.\n\nSo far we have seen two different definitions of the `this` variable.\
    \ In both these cases `this` was implicitly defined by the programming environment.\
    \ It is also possible to explicitly specify the object that should be used to\
    \ represent `this`. In order to see this in action we will define a new object\
    \ that adds two properties together:\n\n```\nadder = {\n  num1: 10,\n  num2: 20,\n\
    \  add: function() {\n    return this.num1+this.num2;\n  }\n}\n```\n\nIf we call\
    \ the `add` method, the two properties will be added together and returned:\n\n\
    ```\nadder.add()\n30\n```\n\nAs mentioned earlier, functions and methods are actually\
    \ objects in JavaScript, and therefore they support their own methods. These are\
    \ defined on `Function.prototype`, (so naturally you can also add your own methods\
    \ to functions). One of the methods `Function.prototype` supports is `apply`,\
    \ which allows an alternative environment to be provided for the `this` variable:\n\
    \n```\nadder.add.apply({num1:30,num2:40})\n```\n```\n70\n```\n\nThe parameter\
    \ passed to `apply` is an object containing the appropriate properties required\
    \ by the function. This approach can be used to replace the value of `this` in\
    \ standalone functions and object methods.\n\nAnother method provided to `Function.prototype`\
    \ is `bind`. Rather than executing the function using the object passed in as\
    \ the environment, `bind` returns a new function that permanently binds the object\
    \ passed in as the `this` variable for the function:\n\n```\nadd2 = adder.add.bind({num1:30,num2:40})\n\
    ```\n\nIt is now possible to execute the function as follows:\n\n```\nadd2()\n\
    ```\n```\n70\n```\n\nWe can use this method to solve the problem we encountered\
    \ with inner functions in this example:\n\n```\nobj = { nums: 10,\n  add: function(num2)\
    \ {\n    console.log('Outer this ' + this)\n    helper = function(num2) {\n  \
    \    console.log('Inner this ' + this)\n      this.num += num2;\n      return\
    \ this.num;\n    }\n    return helper(num2);\n  }\n}\n```\n\nThis can be rewritten\
    \ as follows:\n\n```\nobj = { num: 10,\n  add: function(num2) {\n    console.log('Outer\
    \ this ' + this)\n    helper = function(num2) {\n      console.log('Inner this\
    \ ' + this)\n      this.num += num2;\n      return this.num;\n    }.bind(this);\n\
    \    return helper(num2);\n  }\n}\n```\n\nExecuting this now provides the correct\
    \ result:\n\n```\nobj.add(20)\nOuter this [object Object]\nInner this [object\
    \ Object]\n30\n```\n\nEarlier in this book I mentioned a forth way `this` could\
    \ be defined: inside constructor functions. Within a constructor function `this`\
    \ refers to the implicitly created object, provided the function was invoked with\
    \ the `new` modifier. Without the `new` modifier, `this` becomes the global object\
    \ again.\n\nIt is worth mentioning one more limitation of JavaScript before completing\
    \ this section. JavaScript does not support block level scope. This can be seen\
    \ in the following example:\n\n```javascript\nfunction test() {\n  var a = [1,2,3,4];\n\
    \  for (var i = 0; i < a.length; i++) {\n    var a = i;\n    console.log(a);\n\
    \  }\n  console.log(a);\n}\n```\n\nThe inner block here uses the same variable\
    \ name `a` as is used in the outer block. In most programing languages the two\
    \ variables named `a` would be different, because they are defined in different\
    \ blocks of code. JavaScript does not support block level scoping: it only supports\
    \ function level scoping, therefore the line:\n\n```javascript\nvar a = i;\n```\n\
    \noverwrites the variable defined here:\n\n```javascript\nvar a = [1,2,3,4];\n\
    ```\n\nIn addition to being limited to functional scoping, JavaScript employs\
    \ another technique for variables called “hoisting”. Before explain “hoisting”,\
    \ try to work out why one of these functions fail:\n\n```javascript\nfunction\
    \ testLocal() {\n  console.log(j);\n  var j = 10;\n}\n```\n```javascript\nfunction\
    \ testGlobal() {\n  console.log(j);\n  var j = 10;\n}\n```\n\nThese variables\
    \ remain undefined until explicitly assigned a value, but they do exist at the\
    \ top of the function.\n\n```\ntestLocal()\nundefined\n```\n```\ntestGlobal()\n\
    ReferenceError: j not defined\n```\n\n## Exception Handling\n\nWe will discuss\
    \ approaches to implementing application wide exception handling later in this\
    \ book. For now, it is worth emphasising that JavaScript does support “Java-style”\
    \ exception handling, but without the benefits provided by static typing.\n\n\
    Any code can throw an exception without declaring that it will throw that exception.\
    \ Any data type can be thrown as an exception, although it is common practice\
    \ to throw an object with a code and a message. This function throws an exception\
    \ if it is passed an even number:\n\n```javascript\nfunction dontEven(num) {\n\
    \  if (num % 2 == 0) {\n    throw {\n      code: 'even_number',\n      message:\
    \ 'This function cannot be called with even numbers'\n    };\n  }\n}\n```\n\n\
    It is also possible to catch an exception, and provide logic to handle the failure\
    \ scenario:\n\n```javascript\nfunction passNumber(num) {\n  try {\n    dontEven(num);\n\
    \  } catch(e) {\n    console.log(e.code+':'+e.message);\n    console.log('Retying\
    \ with ' + (num+1));\n    dontEven(num+1);\n  }\n}\n```\n\nThe function above\
    \ produces the following output if it is invoked with an even number:\n\n```\n\
    passNumber(2)\neven_number:This function cannot be called with even numbers\n\
    Retying with 3\n```\n\nIn order to catch exceptions, a **try** block must be declared\
    \ in the code. Only errors that occur in this block will be caught. A **catch**\
    \ block must be provided at the end of the **try** block, and this will be passed\
    \ any exception that occurs in the block.\n\nUnlike Java, only a single **catch**\
    \ block can be provided, and this block must then determine the cause of the exception.\
    \ If required the **catch** block can throw another exception.\n\nTry/catch blocks\
    \ should be provided to catch application logic exceptions, not to hide coding\
    \ bugs.\n"
