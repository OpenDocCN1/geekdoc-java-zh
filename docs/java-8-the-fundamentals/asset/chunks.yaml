  trans: "\n\n并行流的另一个重要考虑因素是排序。下面两行代码似乎会打印相同的结果：\n\n```java\npackage streams;\n\n\
    import java.util.stream.IntStream;\n\npublic class Associative2 {\n\n  public\
    \ static void main(String[] args) {\n    System.out.println(\"Running in parallel\"\
    );\n\n    IntStream.range(1, 1000)\n      .parallel()\n      .filter(a -> a %2\
    \ == 1)\n      .limit(10)\n      .sorted()\n      .forEach(a -> System.out.println(a));\n\
    \n    System.out.println(\"Running in serial\");\n\n    IntStream.range(1, 1000)\n\
    \      .filter(a -> a %2 == 1)\n      .limit(10)\n      .forEach(a -> System.out.println(a));\n\
    \  }\n}\n```\n\n事实上，它们打印出的数字是相同的，但在第一情况下，数字打印的顺序并不是顺序的。尽管在传递给 `forEach` 之前已经进行了排序，但它们并不是按照排序后的顺序打印的。有一种解决办法——如果将并行版本改为使用\
    \ `forEachOrdered`，它将按照排序后的顺序打印数字：\n\n```java\nIntStream.range(1, 1000).parallel()\n\
    \  .filter(a -> a %2 == 1)\n  .limit(10)\n  .forEachOrdered(a -> System.out.println(a));\n\
    ```\n\n这种方法有效的原因是 `forEach` 操作实际上是以串行模式运行的：这让我们回到了第一点——检查并行化是否真的带来了益处。\n\n关于并行化需要记住的最后一个考虑因素与并行化的实现方式有关。在底层，所有并行流都使用\
    \ `ForkJoinPool` 的公共实例，该实例包含的线程数等于处理器数量：\n\n```java\nRuntime.getRuntime().availableProcessors()\n\
    ```\n\n这意味着，如果你在此池中执行长时间耗时的操作，可能会饿饿应用程序中尝试运行并行算法的其他代码。\n\n通过将并行流与像 `Hadoop` 等\
    \ MapReduce 框架进行比较来结束这段讨论是有用的。本质上，并行流提供了与 `Hadoop` 类似的功能——但规模要小得多。`Hadoop` 在许多计算机上分发并协调处理，而并行流则在同一机器的许多处理器上分发并协调处理。\n\
    \n## 结论\n\n从我来看，`Streams API` 是我开始使用 Java 以来所看到的最重要的进展之一。在 `Streams API` 的每一个地方，我都能更好的方法来编写我曾经写过数百次的代码。在\
    \ Java 8 之前，对数据执行聚合操作仍然是，但代码要冗长得多，而且更容易出错。\n\n因此，`Streams API` 有能力改变我在 Java 中实现算法思考。\n\
    \n# 接口 (Interfaces)\n\nJava 8 对接口的定义方式进行了重大更改。我们已经看到了为了支持 `FunctionalInterfaces`\
    \ 而添加的更改，但还有另一个重要的更改被称为“默认方法”（default methods）：它们允许在接口包含实现细节。\n\n允许 `Interfaces`\
    \ 包含实现细节听起来是一个奇怪的决定，因为这在很大程度上违背了接口的初衷：即提供类可以选择实现的契约。\n\n默认方法通常也被称为防御性方法（defender\
    \ methods）和虚拟扩展方法（virtual extension methods）。\n\n添加默认方法主要是为了支持 Java 8 的其他一些变化。如果你考虑\
    \ `Collections API`，许多基本类型（如 `List` 和 `Set`）都是接口。Java 8 想要向这些接口添加新方法以支持 `Streams`，但添加新方法会突然破坏任何实现过这些\
    \ `Interfaces` 的人的代码。在历史上，如果第三方实现了这些接口，那么这些接口将非常难以修改，因为更改永远无法与他们的代码向后兼容。\n\nJava\
    \ 8 现在允许在带有默认实现的同时向 `Interfaces` 中添加方法。这意味着可以向接口中添加新方法，并附带默认实现。该接口的任何现有实现都将自动采用默认实现，而实现接口的新类既可以选择提供自己的实现，也可以使用默认实现。\n\
    \n由于 Java 类可以实现多个接口，这种更改从本质上为 Java 语言引入了某种形式的多重继承。在跳进去查看这些更改之前，可能值得后退一步，看看 Java\
    \ 之前之所以不支持多重继承的主要原因之一：菱形问题（diamond problem）。\n\n我们将从一个非常简单的接口开始：\n\n```java\n\
    package diamond;\n\npublic interface A {\n  void doSomething();\n}\n```\n\n接下来，我们将在两个独立的类中实现此接口：\n\
    \n```java\npackage diamond;\n\npublic class B implements A {\n  @Override\n  public\
    \ void doSomething() {\n    System.out.println(\"Doing something the B way\");\n\
    \  }\n}\n```\n\n以及\n\n```java\npackage diamond;\n\npublic class C implements A\
    \ {\n  @Override\n  public void doSomething() {\n    System.out.println(\"Doing\
    \ something the C way\");\n  }\n}\n```\n\n现在，如果我们写一个同时继承了 `B` 和 `C` 的类（我们称之为“D”），它应该使用哪种\
    \ `doSomething` 的实现？这被称为菱形问题，因为这种结构的类图看起来像一个菱形：\n\n![](img/00001.jpeg)\n\n在查看如何解决菱形问题之前，让我们进入并编写一个带有默认方法的接口：\n\
    \n```java\npackage defaultmethods;\n\npublic interface A {\n  public default void\
    \ doSomething() {\n    System.out.println(\"I am A\");\n  }\n}\n```\n\n注意 `default`\
    \ 关键字的使用。以前该关键字仅在 switch 语句和注解声明中具有意义；现在它在接口内部具有了意义。\n\n尽管此接口对其唯一的方法包含了实现，但仍然无法直接实例化该接口的实例：类必须实现它才能被使用。\n\
    \n我们现在可以这样实现接口：\n\n```java\npackage defaultmethods;\n\npublic class B implements\
    \ A {\n}\n```\n\n如果我们不需要，我们现在可以实例化 `B`，并调用 `doSomething` 方法：\n\n```java\npackage\
    \ defaultmethods;\n\npublic class DefaultMethods {\n  public static void main(String[]\
    \ args) {\n    B b = new B();\n    b.doSomething();\n  }\n}\n```\n\n这将打印“I am\
    \ A”。\n\n我们将创建一个具有相同 `doSomething` 方法签名的第二个接口：\n\n```java\npackage defaultmethods;\n\
    \npublic interface A2 {\n  public default void doSomething() {\n    System.out.println(\"\
    I am A2\");\n  }\n}\n```\n\n并将类 `B` 修改为实现两个接口：\n\n```java\npackage defaultmethods;\n\
    \npublic class B implements A, A2 {\n}\n```\n\n这将导致编译错误，因为编译器不知道 B 想使用哪个版本的 `doSomething`\
    \ 方法。\n\n我们现在三个选择：\n\n- 将 `B` 修改为只实现 `A` 或 `A2`\n- 在 `B` 中提供 `doSomething` 的实现\n\
    - 显式告诉编译器使用 `A` 或 `A2` 中的实现\n\n前两个选项相当显而易见；第三种选项可以通过以下方式实现：\n\n```java\npackage\
    \ defaultmethods;\n\npublic class B implements A, A2 {\n  @Override\n  public\
    \ void doSomething() {\n    A2.super.doSomething();\n  }\n}\n```\n\n这告诉编译器利用 `A2`\
    \ 的实现。\n\n关于默认方法的一个重要注意点是，它们不能为 `Object` 中定义的任何方法提供默认方法。例如，它们不能为 `toString` 或\
    \ `equals` 提供实现。此举主要原因是所有对象已经有了这些方法的默认实现；因此做了一个决定不允许接口提供替代的默认实现。\n\n"
- fmt: "\nInterfaces may also now provide static methods – previously they could only\
    \ define static fields. A static method on an interface looks identical to a static\
    \ method on a class:\n\n```java\npackage defaultmethods;\n\npublic interface A\
    \ {\n\n  public default void doSomething() {\n    System.out.println(\"I am A\"\
    );\n  }\n\n  public static void staticMethod() {\n    System.out.println(\"I am\
    \ a static method\");\n  }\n}\n```\n\nAdding static methods to interfaces is less\
    \ controversial than default methods, since there is no concept of inheritance\
    \ with static methods. In fact they work particularly well in cases where an `Interface`\
    \ only contains static methods, since it is clear that it should not be instantiated\
    \ - previously it was common to use abstract classes for this purpose.\n\n## Conclusion\n\
    \nIt is difficult to know how widely default methods will be used. Clearly they\
    \ offer a tremendous benefit in allowing you to augment legacy interfaces without\
    \ breaking backwards compatibility, but should they be widely used in new code?\
    \ In particular, when should you use abstract classes and when should you use\
    \ default methods?\n\nThis is a difficult question to answer, but probably the\
    \ easiest way to answer it is to think about the functionality you need to implement:\
    \ if it relies on the state of the object then you have to use abstract classes,\
    \ if it is behavioral, and receives all relevant data from its parameters it is\
    \ possible to use either abstract classes or interfaces.\n\nIf default methods\
    \ are an option, the next way to think about this question is to consider the\
    \ times you have implemented interfaces and been forced to implement methods either\
    \ not directly related to your task at hand, or with obvious default implementations.\
    \ If you detect cases like this you should consider providing default methods\
    \ in your interfaces.\n\nAn alternative way to think about this is to consider\
    \ the cases where you have created abstract classes that cannot easily be used\
    \ by other classes due to the single-inheritance restrictions. This often happens\
    \ when a class in question is a utility class, and the code using it may therefore\
    \ not want to directly extend it (since it is already extending another class).\n\
    \nThis brings us to the subject of mixins. A mixin is a class that contains a\
    \ combination of methods from other classes. They can be particularly useful where\
    \ you want to provide a lot of optional methods – or where you want a method to\
    \ be available in many classes. Mixins get their names because they mix together\
    \ functionality from different classes into a single class.\n\nAs an example of\
    \ a mixin, consider an situation where we have a class called `Car`, and another\
    \ class called `Person`. We could create a mixin called `CarDriver` that brings\
    \ together both those implementations, and provides an implementation representing\
    \ a `Person` driving a `Car`. This would make available any methods defined on\
    \ `Person` (e.g. `getName`) with methods on `Car` (such as `getMake`), while also\
    \ allowing other functionality to be added (e.g. `getOwningPeriod`).\n\nMixins\
    \ are still somewhat limited in Java 8 since they cannot access state, but if\
    \ the relevant functionality is behavioral they can be created. Consider a case\
    \ where you had many different classes for processing files of different types\
    \ (XML files, CSV files, text files), and each was defined in a separate interface,\
    \ using distinct method signatures. If these used default methods it would be\
    \ possible to mix them into a single class that could perform processing of any\
    \ file type.\n\n# Java Date/Time API\n\nDates and times seem like a simple subject.\
    \ People use dates and times on a daily basis, and it is not until you begin using\
    \ them in software that you really have to start thinking about how complex they\
    \ really are.\n\nI’m going to assume you have worked with Java enough to understand\
    \ the complexities that can occur when dealing with dates, especially when concepts\
    \ like leap years, daylight savings time and time zones are taken into account.\n\
    \nTo make matters worse, the core class for representing dates and times in Java\
    \ (`java.util.Date`) is not the greatest achievement of the language. The class\
    \ goes all the way back to JDK 1.0, and it has barely improved since (although\
    \ the Y2K bugs were fixed). Just reading through the first few lines of the Java\
    \ doc leaves you asking why, why why?\n\n- A year `y` is represented by the integer\
    \ `y` - 1900. (the year 2014 is represented as 114 - why not 2014?)\n- A month\
    \ is represented by an integer from 0 to 11; 0 is January, 1 is February, and\
    \ so forth; thus 11 is December. (why not 1-12?, and why not introduce an enumerated\
    \ type?)\n- A date (day of month) is represented by an integer from 1 to 31 in\
    \ the usual manner. (why not following the same 0 based counting as months?)\n\
    \nJava introduced the concept of `Calendars` in JDK 1.1 to alleviate some of the\
    \ problems with the `Date` class, and simultaneously deprecated a whole lot of\
    \ functionality in `Date`. Despite this, the whole handling of date and time has\
    \ always been slightly awkward in Java. Date manipulation is particularly painful\
    \ in Java, with the need to constantly swap back and forward between `Dates` and\
    \ `Calendars`.\n\nDue to the deficiencies (perceived or otherwise) with the Java\
    \ language itself, the Joda open source library has continued to grow in popularity\
    \ over the years by offering an alternative implementation of dates and times.\n\
    \nJava has ultimately decided to provide a Joda-like API alongside the `Date/Calendar\
    \ API`: this is called the Date and Time API (JSR 310).\n\nIf you are happy with\
    \ the existing `Date/Calendar API`, you can continue to use it. If you are happy\
    \ with Joda as a standalone library, you can continue to use it. If you want to\
    \ use the new Date and Time API you can use it. The choice is yours.\n\nIf this\
    \ chapter were to provide an overview of the entire Date and Time API it would\
    \ become very boring very quickly, and contain an enormous amount of duplication.\
    \ This chapter will therefore attempt to set out the core principles of the API:\
    \ once these are understood it is straightforward to extend this knowledge to\
    \ other tasks.\n\nThe Date and Time API is designed to take into account two distinct\
    \ ways of representing date and time:\n\n- In human terms: this uses the familiar\
    \ concepts of months, days, hours and durations.\n- In machine terms: this measures\
    \ the amount of time that has passed (in nano-seconds) from an epoch.\n\nWhen\
    \ dealing with the Date and Time API you can decide the date and time implementation\
    \ that best suits your needs from the following options:\n\n- `LocalDate`: this\
    \ represents the year, month and day portion of a date independent of any time\
    \ zone. This is useful for representing dates such as holidays, since 25 December\
    \ is a holiday regardless of whether you are in the US, Australia or the United\
    \ Kingdom.\n- `LocalTime`: this is essentially the same as `LocalDate`, but it\
    \ only represents a time, e.g. 12:55:21 (times are always captured to nano-second\
    \ precision).\n- `LocalDateTime`: this is the same as `LocalDate`, but contains\
    \ time information as well as date information.\n- `ZonedDateTime`: this is the\
    \ same as `LocalDateTime`, except it contains a time zone offset from UTC time\
    \ (e.g. -05:00) and a zone ID (e.g. America/Detroit).\n- `OffsetDateTime`: this\
    \ is identical to `ZoneDateTime` but does not contain a zone id, it only contains\
    \ an offset.\n- `OffsetTime`: this is similar to `OffsetDateTime`, but only contains\
    \ the time portion of the date, e.g. 13:00:21+12:00\n- `Year`: this simply contains\
    \ the year portion of a date\n- `Month`: this is an enumerated type representing\
    \ the 12 months of the year.\n- `MonthDay`: this represents a day and month, and\
    \ can therefore be used to represent a day of the year in a year-agnostic manner.\n\
    - `YearMonth`: as expected, this contains a year and a month.\n- `DayOfWeek`:\
    \ this is an enumerated type representing the 7 days of the week\n"
