    这本书是为任何熟悉 `Java` 并想要学习 `Java 8` 的人准备的。如果你还不熟悉 `Java`，那么这本书并不适合你：在跳入这些特性之前，你需要对该语言有合理的理解。


    此外，这本书也面向使用 `Java` 编写应用程序的程序员和软件工程师。`Java 8` 还包括对 `Java Runtime`（运行时）的更改以及从编译的
    `Java` 生成的字节码的更改：这些特性不会影响程序员的日常工作，因此被忽略了。例如，`Java 8` 中的许多功能旨在从某方面或方面提高 `Java`
    平台的性能。在大多数情况下，这些功能不太可能改变你编写代码的方式。


    本书的目标是写出一本可以在几个下午内读完的书，并提供足够的代码示例，让你理解每个新功能的基础知识。一旦你理解了这些基础知识，扩展你的知识将是相对易举的。


    因此，这本书不会尝试充当参考书，也不会包含 `Java 8` 中添加的每一个新 `method`（方法）、`class`（类）或 `interface`（接口）的细节。一旦你理解了基础知识，使用
    `Java Doc`或其他在线帮助来扩展这些知识并寻找特定需求的方法是相对简单的。


