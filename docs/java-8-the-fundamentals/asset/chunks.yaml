  trans: "\n\n- 属性名可以是语言关键字之一。\n\n如果你正在编写需要处理任何属性名的代码（包括那些你无法参与参与定义的属性名），则应该优先使用方括号符号。\n\
    \n除了属性之外，上面的示例还提供了一个向对象添加方法的示例。方法 `increaseAge` 将 `age` 属性的值加了 1：它可以如下所示被调用：\n\
    \n```\nobj.increaseAge()\nobj.age\n33\n```\n\n我提到了在方法内部对 `this` 变量的使用：\n\n```javascript\n\
    obj.increaseAge = function() {\n  this.age++;\n}\n```\n\n这是函数与方法之间唯一的区别：在方法中，特殊变量\
    \ `this` 指向对象本身，因此：\n\n`this.age`\n\n是访问对象上 `age` 属性的一种方式。正如我们将在后续章节中看到的，`this`\
    \ 会根据语境具有几种不同的含义。理解 `this` 在这些不同语境下的含义是理解 JavaScript 的关键之一。\n\n虽然可以在不依赖任何类（class）的情况下构建对象，但显而易见的是，我们也错失了类带来的好处。\n\
    \n如果你想创建一个新对象来引用另一个人，你需要重新添加这些属性和方法。这对于对象的属性来说不是一个主要问题，因为你仍然需要为这些属性提供值，但对于方法来说，这是一个巨大的不便。例如，你需要编写以下代码：\n\
    \n```javascript\nobj2 = {}\nobj2.firstName = 'Albert'\nobj2.lastName = 'Jones'\n\
    obj2.age = 28\nobj2.increaseAge = function() {\n  this.age++;\n}\n```\n\n另一种方法是将属性和方法包含在\
    \ `{}` 中，用逗号分隔属性/方法，并用冒号将属性/方法与其值分离：\n\n```javascript\nobj2 = {\n  firstName:\
    \ 'Albert',\n  lastName: 'Jones',\n  age: 28,\n  increaseAge: function() {\n \
    \   this.age++;\n  }\n}\n```\n\n这将变成一个巨大的不便，尤其是当你的对象上有大量方法时。\n\n这个问题有一个不需要回归类的解决方案：你可以简单地克隆一个现有对象，并根据需要更改它的属性。被克隆的对象可以被称为其他对象的原型（prototype）。\n\
    \n我们将在后面的章节中看到 jQuery 包含一个用于克隆对象的辅助函数，但现在我们将编写自己的克隆实现。此函数将对对象进行深克隆：如果对象上的某个属性包含的值也是对象，那么该对象也将被克隆。\n\
    \n```javascript\nfunction clone(obj) {\n  if (obj == null || typeof obj != 'object')\
    \ {\n    return obj;\n  }\n  var newObj = {}\n  for (var key in obj) {\n    newObj[key]\
    \ = clone(obj[key]);\n  }\n  return newObj;\n}\n```\n\n此函数使用 `for (var key in\
    \ obj)` 循环来遍历对象上的所有属性。这是一种特殊的 JavaScript 循环，专门用于遍历对象中的属性。如果属性的值是一个对象，则它会被递归地传递给\
    \ `clone` 函数。如果它是简单类型（如数字或字符串），它会被立即返回，以便直接设置在对象的新实例上。你可能从前面的章节记得，字符串和数字是不可变的；因此它们不需要被克隆。\n\
    \n这种实现应该让你加深对 JavaScript 对象有多简单的认识。\n\n这种实现存在潜在的问题，为了简单起见被忽略了。这种实现不应在实际应用中使用：请使用\
    \ jQuery 或 Underscore 库提供的版本。\n\n你现在可以使用此函数来构建一个存储人员信息的新对象：\n\n```javascript\n\
    obj3 = clone(obj2)\nobj3.firstName = 'Jim'\n\"Jim\"\nobj3.firstName = 'Duffey'\n\
    \"Duffey\"\nobj3.age = 42\nobj3.increaseAge()\n43\n```\n\n如你所见，我们保留了已经在原型上定义的方法。\n\
    \n本节并不是意指类在 JavaScript 中没有价值，而是为了展示 JavaScript 中对象的真正本质，并建议存在不使用类的可行 JavaScript\
    \ 编写方法。\n\n这种实现存在潜在的陷阱。例如，如果你忘记在新克隆的对象上设置属性，它将保留来自克隆源对象的值：这可能是正确的，也可能是错误的，并可能成为\
    \ bug 的来源。\n\n尽管我们将在下面检查更高级的对象创建方法，但本节所讨论的对象处理方法有很多推荐之处。\n\n## JavaScript 对象表示法\
    \ (JSON)\n\n上一节展示了 JavaScript 对象有多简单。从本质上说，JavaScript 对象是简单的关联数组。对象中的每个属性都可以有一个简单类型的值（如数字或字符串）、函数、数组或另一种类型的对象。\n\
    \n在编写 Web 应用时，通常需要将数据从客户端发送到服务器，或从服务器发送到客户端。为了跨网络传输数据，必须按照发送方和接收方同意的数据格式进行编码。\n\
    \n有很多数据格式可以用于发送和接收；其中 XML 可能是最常见的。一个表示人的 XML 文档示例如下：\n\n```xml\n<person>\n  <firstName>John</firstName>\n\
    \  <lastName>Smith</lastName>\n  <age>32</age>\n  <address>\n    <city>Los Angeles</city>\n\
    \    <postCode>90245</postCode>\n  </address>\n</person>\n```\n\nXML 是一种广泛使用的格式，特别是在企业应用程序中。它有很多优点，包括支持它的大量库和广泛的认可。然而，XML\
    \ 是一种特别冗长的格式，在上面的示例中，75% 的文本是由标签组成的。\n\n在理解 JSON 之前，先考虑相同数据的 JavaScript 对象可能看起来如下：\n\
    \n```javascript\nperson = {};\nperson.firstName = 'John';\nperson.lastName = 'Smith';\n\
    person.age = 32;\nperson.address = {};\nperson.address.city = 'Los Angeles';\n\
    person.address.postCode = 90245;\n```\n\n上面的示例由两个对象组成。第一个对象是人；这是一个包含了地址信息的第二个对象。\n\
    \n从 XML 创建对象并不困难。但有一种与 JavaScript 高度一致的数据格式，被称为 JavaScript 对象表示法 (JSON)，它让这个过程变得轻而易举。\n\
    \n你可以如下将此对象转换为 JSON 编码字符串：\n\n```javascript\nJSON.stringify(person)\n\"{\"firstName\"\
    :\"John\",\"lastName\":\"Smith\",\"age\":32,\"address\":{\"city\":\"Los Angeles\"\
    ,\"postCode\":90245}}\"\n```\n\n此函数的调用输出是一个字符串，可以赋值给变量：\n\n```javascript\ns =\
    \ JSON.stringify(person)\n```\n\n随后将其转换回对象：\n\n```javascript\nperson2 = JSON.parse(s)\n\
    ```\n\n字符串和对象之间的转换被称为序列化（serializing）和反序列化（de-serializing）：字符串是对象的序列化形式。\n\n此过程仅适用于属性：方法在对象序列化时不会被保留。\n\
    \nJSON 是一种非常简单的数据格式。整个数据格式包含在以下网站的几段文字中：\n\n[`www.json.org/`](http://www.json.org/)\n\
    \nJSON 有 3 种类型：\n\n1. **对象**，用现在熟悉的的大括号表示。\n2. **数组**，用中[] 括号表示，像 JavaScript 数组一样包含逗号分隔的值。\n\
    3. **字面量值**（字符串、数字、布尔值）。\n\n对象或数组反过来包含这 3 类型中的任何一种。例如，数组可以包含对象，对象可以包含数组，对象可以包含另一个对象等等。\n\
    \n"
- fmt: "\nJavaScript makes it possible to convert from a `stringified` version to\
    \ an `object` representation purely because the language does not rely on classes.\
    \ The stringified version of the object does not contain information on what type\
    \ it is: it is simply a set of properties formatted according to the JSON specification.\
    \ Likewise though, JavaScript does not need to know what type of object needs\
    \ to be created when de-serializing: it can simply add the appropriate properties\
    \ to an otherwise empty object.\n\nJSON has become a widely used data format even\
    \ for applications that do not use JavaScript. For instance, Java contains libraries\
    \ for converting to and from JSON. The only difference in languages such as Java\
    \ is that you must tell the library what type of class the textual string represents.\n\
    \nJava can in fact de-serialize a string into an object without knowing the type,\
    \ but it needs to use hash maps rather than programmer defined types.\n\nOne reason\
    \ for the widespread adoption of JSON (beyond its simplicity) is the fact it is\
    \ far less verbose than XML – the example above is roughly half the size of the\
    \ XML version. Although the size is far smaller, it is still easy for a human\
    \ to read and understand a JSON encoded message (which was a traditional strength\
    \ XML had over other data formats, particularly binary data formats).\n\nAs we\
    \ go through the book we will explore several cases where this ability to convert\
    \ simply and easily from an object to a textual string is enormously useful.\n\
    \n## Prototypes\n\nWe will return now to our discussion of objects in JavaScript.\n\
    \nThe `clone` function that we wrote above was our first attempt at code reuse.\
    \ It allowed us to reuse or extend an object that we had already written. One\
    \ problem discussed with the `clone` function was that it took all the properties\
    \ from the object it was cloning, including properties that were specific to the\
    \ cloned instance, such as `firstName` and `lastName`.\n\nJavaScript provides\
    \ a more elegant mechanism for extending objects called prototypes. In fact, JavaScript\
    \ itself is considered a prototype-based language.\n\nIf you declare an empty\
    \ object, you may think that it contains no properties at all:\n\n```javascript\n\
    obj = {}\n```\n\nYou can however execute the following method on the object:\n\
    \n```javascript\nobj.toString()\n```\n\"[object Object]\"\n\nWhere did the `toString`\
    \ method come from?\n\nAll JavaScript objects have a prototype object (this can\
    \ be `null` in rare instances, but this scenario can largely be ignored). A prototype\
    \ object is an object in its own right, and can encapsulate properties and methods.\
    \ If we access a property or method on an object, JavaScript will first try to\
    \ access that property or method on the object itself. If the object has no property\
    \ or method with that name it will look for it on the prototype object.\n\nIn\
    \ fact, there can be a whole chain of objects due to the fact that the object\
    \ that is our prototype may itself have a prototype. If no objects in the prototype\
    \ chain have a property matching the name specified then JavaScript returns a\
    \ special type called `undefined`.\n\nThe prototype of our empty object was provided\
    \ by `Object.prototype`. This is the only object that does not have a prototype\
    \ of its own, and therefore is the end of the chain.\n\nIn order to see the prototype\
    \ chain in action, we can define our own `toString` implementation on the empty\
    \ object:\n\n```javascript\nobj.toString = function() {\n return \"I am an object\"\
    \n };\n```\n\nIf we now execute `toString` on this object, the newly defined version\
    \ will be used:\n\n```javascript\nobj.toString()\n```\n\"I am an object\"\n\n\
    In this case you have not modified the implementation of `toString` on the prototype;\
    \ it has been overridden on this specific instance. In order to prove this, you\
    \ can create a new empty object, and execute the `toString` method on it:\n\n\
    ```javascript\nobj2 = {}\nobj2.toString()\n```\n\"[object Object]\"\n\nThe properties\
    \ on a prototype are immutable, just like strings are immutable. Although all\
    \ objects with the same prototype share the properties on the prototype, they\
    \ cannot change the prototype; they simply override these properties on themselves.\n\
    \nThe specific prototype assigned to objects created with the object literal notation\
    \ is the `Object.prototype`. Different objects can however have different prototypes.\
    \ For instance, if we create an array using the array literal notation, the variable\
    \ is still an object:\n\n```javascript\na = [1,2,3,4,5];\ntypeof a\n```\n\"object\"\
    \n\nBecause this is an object, it will contain the `Object` prototype somewhere\
    \ in its hierarchy, and therefore we can invoke the `toString` method. You will\
    \ notice that the `toString` implementation has been specially tailored for arrays:\n\
    \n```javascript\na.toString()\n```\n\"1,2,3,4,5\"\n\nThe array instance also has\
    \ access to a whole set of other properties that were not available to our object\
    \ created with the object literal notation:\n\n```javascript\na.reverse()\n```\n\
    [5, 4, 3, 2, 1]\n\n```javascript\na.pop()\n```\n1\n\n```javascript\na.push(6)\n\
    ```\n5\n\nThese methods are derived from the prototype object for arrays called\
    \ `Array.prototype` (which in turn has `Object.prototype` as its prototype).\n\
    \nDue to the fact that all arrays are based on the same prototype, if we add methods\
    \ to this prototype, they immediately become available to all arrays. Remember,\
    \ prototypes are just objects themselves; therefore they can be modified just\
    \ like any other object.\n\nFor instance, arrays do not have a “contains” method.\
    \ It might be useful to implement a method that accepts a single parameter, and\
    \ then returns true if the array contains that value. This can be written as follows:\n\
    \n```javascript\nArray.prototype.contains = function (val) {\n for (var i = 0;\
    \ i < this.length; i++) {\n    if (this[i] === val) {\n      return true;\n  \
    \  }\n }\n return false;\n}\n```\n\nWe can now execute the following:\n\n```javascript\n\
    [1,2,3,4,5].contains(3)\n```\ntrue\n\n```javascript\na.contains(6)\n```\nfalse\n\
    \nAdding functionality to prototypes is a very effective code reuse pattern. As\
    \ soon as the functionality is added to that prototype, it is immediately available\
    \ to all objects that contain that prototype: even if they were created before\
    \ the functionality was added.\n\nIf you are wondering how objects can be given\
    \ a specific prototype, this will be explained in more detail below.\n\nPrototypes\
    \ provide a mechanism to tidy up the code reuse pattern that we used earlier.\
    \ The new implementation of `clone` (which we will rename to `extends`) still\
    \ accepts an object, but now returns a new empty object with that object set as\
    \ its prototype.\n\nWe will first write the object that will act as the prototype.\
    \ This is going to contain two methods, the increase age method we saw earlier,\
    \ and a new method that returns the full name of the person as the concatenation\
    \ of the first and last name. In addition, this implementation is going to combine\
    \ object creation, and the addition of methods to the object, into a single step:\n\
    \n```javascript\nperson = {\n getFullName: function() {\n return this.firstName+\"\
    \ \"+this.lastName;\n },\n increaseAge: function() {\n this.age++;\n }\n}\n```\n\
    \nNotice that this object is referring to properties that are `undefined`. It\
    \ does not include `lastName`, `firstName` or `age` properties, therefore calling\
    \ these methods will not produce very useful results:\n\n```javascript\nperson.getFullName()\n\
    ```\n\"undefined undefined\"\n\nWe will now write an `extends` function that accepts\
    \ this object as a parameter, and returns a new object with this object set as\
    \ its prototype:\n\n```javascript\nfunction extend(obj) {\n function E(){};\n\
    \ E.prototype = obj;\n return new E();\n}\n```\n\nThis code may look unfamiliar\
    \ or mysterious. That is because this function is taking advantage of a special\
    \ type of function we have not seen before called a constructor function.\n\n\
    The first line of this function declares a function called `E`:\n\n```javascript\n\
    function E(){};\n```\n"
