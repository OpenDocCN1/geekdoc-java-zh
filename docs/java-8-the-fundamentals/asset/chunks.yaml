    # 目录


    - 介绍

    - 关于本书书

    - Lambda 表达式

    - Streams API

    - 接口

    - Java 日期时间 API

    - Nashorn

    - 微改

    - 总结

    - 附录 A：JavaScript


    # 介绍


    我第一次在 20 世纪 90 年代后期使用 `Java 1.1` 学习 Java。那时，人们对 Java 感到非常兴奋。它不仅支持“一次编写，随运行”的理念，还拥抱了互联网，并对网络、线程以及备受期待的
    Applet 技术提供了原生支持。事实上，值得重申 Java 语言的五个主要目标：


    • 它应该是“简单、面向对象且熟悉的”

    • 它应该是“健壮且安全的”

    • 它应该是“架构中立且可移植的”

    • 它应该以“高性能”执行

    • 它应该是“解释的、多线程的且动态的”


    自从我第一次学习 Java 以来，情况发生了很多变化。计算机变得强大得多，数据集也增长了数几个数量级。Java 很好地跟上了这些许多变化，并且可能仍然是商业环境中使用最广泛的编程语言，特别是在服务器端开发。它在开源世界也保持着动态且广泛的存在，并被整合到从
    Android 到 Salesforce 的其他技术中。


    尽管如此，与许多较新的（或新发现的）语言相比，Java 的某些方面开始显得过时。自从泛型在 `Java 5`（那是很久以前的 2004 年）引入以来，Java
    语言很少有重大的增强。近年来一个常见的论调是“Java 是新的 Cobol”——被广泛使用但并不广受喜爱。我个人并不认同这一信条：Java 支持一套无与伦比的框架、库和工具，特别是对于服务器端计算——但
    Java 确实缺乏许多其他语言所具备的表达力。


    Java 8 是至少过去 10 年来，甚至可能自诞生以来 Java 发生的最大变化。它整合了许多年来一直被请求的功能（最著名的是 lambda 表达式），并试图通过增加对并行性的额外支持，以在多核机器的世界中保持
    Java 的相关性：事实上，并行计算是 Java 8 大多数变化背后的驱动力（至少从 Oracle 的角度来看）。


    下面的章节将引导你了解 Java 8 的核心主题。随后的章节将介绍与这些主题相关的、在 Java 8 中新增的功能。


    ## 函数式编程


    函数式编程是一种编程范式，通过函数实现算法，这些函数接受值并返回值。这是一种避免状态和避免数据突变的编程风格——函数的结果完全取决于它的输入。换句话说，相同的输入总是产生相同的结果。


    直到过去几年我（正确地）学习了 JavaScript 之前，我并没有完全意识到 Java 缺少了什么，正如我在我的书籍《软件工程师学习 HTML5、JavaScript
    和 jQuery》中所记录的那样。在学习 JavaScript 之前，我对这种语言的看法相当低，这很大程度上是基于尝试将其语法强行引入 Java 风格程序的经验。


    正确地学习 JavaScript 向我展示了即使在一种拥抱命令式和面向对象编程范式的语言中，函数式编程概念是可以多么强大的。我并不是对函数式编程陌生，但在离开大学后，我没有在商业工作中使用过函数式编程技术。


    当然，我不是唯一注意到函数式编程技术价值的人。多年来，在 Java 语言中添加函数式编程功能（lambda 表达式或闭包）的想法一直受到共同推动，这甚至导致了
    JVM 上几种新语言的诞生，最著名的是 Scala。


    Java 8 提供了一项重要的新功能，称为“lambda 表达式”。这些本质上是可以动态构建、赋值给变量并作为参数传递给其他方法的匿名方法。这些功能被嵌入到语言中，许多现有的
    API 被扩展以提供对 lambda 表达式的支持。


    Java 8 并不是突然试图成为 Haskell 或 LISP 等纯函数式语言：它正试图在它的面向对象范式旁边添加一种新范式。lambda 表达式的引入是非侵入性的，这意味着如果你愿意可以忽略它们，但我希望在通过本书中的示例后，你能欣赏它们在语言中的地位，以及使用它们的代码的优雅。


    ## 并行性


    自从我开始学习 Java 后，计算领域的另一个重大变化是处理越来越大的数据集的需求，并以多线程的方式进行。Google 在普及大数据处理方法方面比大多数人都做得得多，特别是
    MapReduce 算法（已经在 Hadoop 中以 Java 形式实现）。


    Java 8 增加了许多功能，最著名的是 Streams API，它旨在简化处理数据集的过程，并允许程序员请求并行而不是显式地实现。


    这些功能背后的原理是好的，但它们无法完全隐藏并行性的复杂性，不理解这些新功能会导致严重问题。本书将深入研究 Streams API，并评估何时以及何时可以使用并行处理。


    ## 弥补过去的错误


    Java 的日期 API 多年来一直受到批评。只需查看 `java.util.Date` 的弃用方法列表，你不怀疑犯了错误。


    Java 的伟大之处之一是，当官方语言出现错误时，开源社区通过库来修复它们。在日期和时间方面，Joda time 库填补了空白。正如经常发生的（特别是在 Java
    EE 世界），Java 非常乐从成功中学习，并在 Java 8 中引入了基于 Joda 的新日期/时间 API。


    现有的 Date 和 Calendar API 保持不变，如果你愿意可以继续使用它们，或者与新的日期/时间 API 结合使用。


    ## 动态语言


    Java 在 Java 7 中通过 `InvokeDynamic` 指令为动态语言添加了显式支持。结果是 Java 运行时现在支持各种动态语言。在 Java
    平台上实现一种语言为该语言带来了巨大的利益（因为它可以访问 Java 生态系统中的所有的库和框架），同时也为 Java 本身带来了巨大的益处。


    '
- fmt: '

    Java 8 has added native support for a JavaScript engine called `Nashorn`. `Nashorn`
    has been written from the ground up to work with the dynamic language support
    in Java, and replaces the `Rhino` JavaScript engine that has been available for
    a number of years.


    In case you had not noticed, JavaScript has moved outside the browser in the last
    few years and is now widely used as a server-side language – most notably via
    `node.js`. The addition of `Nashorn` on the Java platform could bring interesting
    developments in the near future, especially for server-side computing.


    ## A few surprises


    Sun made a conscious decision to exclude multiple inheritance from Java when it
    was originally specified. Multiple inheritance allows a single class to inherit
    functionality from two or more classes. In its place Java used interfaces (which
    could not provide implementations), and allowed a class to implement multiple
    interfaces.


    Multiple inheritance was omitted from Java for a number of reasons, not least
    because of the famous ”diamond problem”, which is a problem that can arise when
    a class inherits different implementations of the same method from its parent
    classes.


    Java 8 has partially removed its restriction on multiple inheritance with the
    introduction of `default methods` (aka defender methods) on interfaces. The main
    reason this feature has been added is because Java has been unable to extend any
    of the core-language interfaces, since this would break existing code for third
    parties who implement these interfaces. This change has meant many existing interfaces
    (such as `List` and `Set`) now have additional methods.


    # About this book


    ## Who is this book for?


    This book is intended for anyone familiar with `Java` who wants to learn about
    `Java 8`. If you are not already familiar with `Java` this is not the book for
    you: you need to have a reasonable grasp of the language before jumping into these
    features.


    Additionally, this book is intended for programmers and software engineers who
    use `Java` to write applications. `Java 8` also includes changes to the `Java
    Runtime` and changes to the byte code generated from compiled `Java`: these features
    will not impact programmers on a daily basis, and therefore have been ignored.
    For instance, many of the features in `Java 8` are designed to improve the performance
    of the `Java` platform in one-way or another. For the most part, these features
    are unlikely to change the way you write code.


    The goal has been to produce a book that can be read in a couple of afternoons,
    and that provides enough code examples to allow you to understand the fundamentals
    of each new feature. Once you understand these fundamentals, expanding your knowledge
    will be relatively trivial.


    As a result, this book will not try to act as a reference book, and will not contain
    details of every new `method`, `class` or `interface` added in `Java 8`. Once
    you understand the fundamentals it is relatively simple to use the `Java Doc`
    or other online help to expand this knowledge, and find approaches for specific
    requirements.


    I have made this book exactly the length I think it needs to be to cover the material
    in appropriate detail. One of the major benefits of eBooks is that it is possible
    to write shorter books where appropriate, and charge a price matching the length.


    ## What do I need?


    Since `Java 8` is new, this section will change on a regular basis. The book’s
    website will therefore contain the most up to date version of this section:


    [http://www.cisdal.com/java8.html](http://www.cisdal.com/java8.html)


    In order to follow the examples you need `Java 8`. The `JDK` can be downloaded
    from here:


    [https://jdk8.java.net/download.html](https://jdk8.java.net/download.html)


    You are also going to need an `IDE` that supports `Java 8`. `IDEs` need to rollout
    specific support for `Java 8`, therefore it is possible your favorite `IDE` will
    not support `Java 8` at this point.


    I have used `NetBeans` for the examples in this book, largely because it has a
    `Java 8` compatible installer for `OSX` and other platforms. The following page
    provides links for a `Java 8` compatible version of `NetBeans`:


    [https://netbeans.org/kb/docs/java/javase-jdk8.html](https://netbeans.org/kb/docs/java/javase-jdk8.html)


    `Eclipse` support is available, but it currently requires slightly more effort
    to install a version of `Eclipse` with `Java 8` support. The following page contains
    instructions:


    [https://wiki.eclipse.org/JDT_Core/Java8](https://wiki.eclipse.org/JDT_Core/Java8)


    ## Why I wrote this book


    I wrote this book because I use `Java` on a daily basis. Over the years I have
    tried to keep track of the changes that have occurred to the language when each
    new version of `Java` was released.


    Describing the process I went through to learn `Java 8` is an excellent way for
    me to consolidate my knowledge of these features, and hopefully a good opportunity
    to pass on what I learnt to others.


    ## Blatant Plug


    With `Java` officially embracing `JavaScript`, I figured there was no better time
    to promote my book “A Software Engineer Learns HTML5, JavaScript and jQuery” to
    the `Java` community. This book takes you through my process of learning to write
    standards-based web applications with `HTML5` and `JavaScript` after a career
    using `Java`.


    As a bonus I have added a chapter on `JavaScript` from that book to encourage
    you to learn `JavaScript`, and gain an understanding of what has become a surprisingly
    elegant and mature language.


    ## Caveat


    `Java` casts a very large net. Hundreds of thousands of programmers use the `Java`
    platform, and use it in wildly different ways, and from multitude points of view.
    As a result there are divergent opinions on many `Java` features, and that extends
    to `Java 8`.


    Although I am enthusiastic about the changes in `Java 8`, and intend to use them
    in my professional work, this book is not intended as a cheerleading exercise.
    The book sets out to teach you the new features, and how they can be used. It
    is up to you to decide whether you feel these features add value – if they don’t
    there is no reason you need to change the way you are programming.


    Many people also have strong opinions on how these features should have been implemented
    in the language. For instance, there has been years of debate around how `lambda
    expressions` should be implemented. I am taking the view that that ship has sailed:
    I will present the features as they have been implemented and not waste time talking
    about how they could have implemented.


