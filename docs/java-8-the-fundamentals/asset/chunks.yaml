  trans: "\n\n```\n.reduce(100, (a, b) -> a + b)\n```\n\n此示例将返回比上一个示例多 100。\n\n如果省略，将使用返回数据类型的默认值，例如数字类型的\
    \ `0`。\n\n## 收集 (Collecting)\n\n另一个常用的终端操作是收集。收集提供了一种根据一组标准对元素进行累加或总结的机制。\n\n\
    例如，考虑之前提到的 `Person` 类的列表。我们可能想将所有 `firstName` 相等的 `Person` 实例分组——可以通过以下方式实现：\n\
    \n```java\npackage streams;\n\nimport java.util.Arrays;\nimport java.util.List;\n\
    import java.util.Map;\nimport java.util.stream.Collectors;\n\npublic class Collecting\
    \ {\n public static void main(String[] args) {\n List<Person> people = Arrays.asList(\n\
    \ new Person(\"Albert\", \"Smith\"),\n new Person(\"John\", \"James\"),\n new\
    \ Person(\"John\", \"Brown\"),\n new Person(\"William\", \"Hughes\"),\n new Person(\"\
    William\", \"Fleming\")\n );\n Map<String, List<Person>> groupedMap = people.stream()\n\
    \ .collect(Collectors.groupingBy(Person::getFirstName));\n System.out.println(groupedMap.get(\"\
    William\"));\n }\n}\n```\n\n此 `groupingBy` 操作返回一个 `Map`，其中键（keys）是名字的唯一值（William,\
    \ John, Albert），值（values）是匹配该键的 `Person` 类的 `Lists`。\n\n由于最后一行访问了 `William` 键对应的\
    \ `List`，它将打印出：\n\n`[William Hughes, William Fleming]`\n\n`collect` 方法接受一个 `Collector`。这些收集可以通过\
    \ `Collectors` 类中的一组静态辅助方法生成——在这种情况下，我们正在使用 `groupingBy` `Collector`，并指定了应用于比较的方法。随后，系统将为我们生成相应的\
    \ `Collector` 实例。\n\n一旦元素被分组，通常会对每个组运行一个聚合操作（例如，统计每个组中有多少个元素）。因此，`groupingBy`\
    \ 方法接受一个第二个参数来执行聚合操作。作为一个示例，我们将处理 Java 中所有可用的时区（我们将在书的后半部分查看新的日期和时间 API 时再次看到它们）：这些可以作为数组从\
    \ `TimeZone.getAvailableIDs()` 获取。它们的形式如下：\n\nAfrica/Asmara\nEurope/London\n\n\
    其中，可选的第一部分（Europe, Africa）代表分组机制，而斜杠后的部分代表特定值。\n\n我们将编写一个执行以下操作的程序：\n\n- 过滤掉任何不包含斜杠的区域\n\
    - 按其组（例如 Europe, Africa）对区域分组\n- 统计每个组中有多少个区域\n\n可以通过以下单行完成：\n\n```java\npackage\
    \ streams;\n\nimport java.util.Arrays;\nimport java.util.Map;\nimport java.util.TimeZone;\n\
    import java.util.stream.Collectors;\n\npublic class Collecting5 {\n public static\
    \ void main(String[] args) {\n Map<String, Long> result =\n Arrays.asList(TimeZone.getAvailableIDs())\n\
    \ .stream()\n .filter(s -> s.indexOf(\"/\") > 0)\n .collect(Collectors.groupingBy((String\
    \ s) -> s.substring(0, s.indexOf(\"/\")),\n Collectors.counting()));\n System.out.println(result);\n\
    \ }\n}\n```\n\n注意将 `Collectors.counting()` 作为 `groupingBy` 方法的第二个参数使用。它本身是一个 `Collector`，并处理分组的结果。`counting`\
    \ 方法（与 `groupingBy` 方法不同）不需要其他信息即可生成 `Collector`——因为它在一个由 `groupingBy` 方法返回格式的数据结构上操作（一个以\
    \ `Lists` 为值的 `Map`）。\n\n这输出以下内容：\n\n`{Europe=59, Africa=54, SystemV=13, Canada=9,\
    \ Pacific=42, Etc=35, Asia=91, America=164, Brazil=4, Mexico=3, Indian=11, Antarctica=11,\
    \ Chile=2, Australia=23, Arctic=1, Atlantic=12, US=13}`\n\n分区 (Partitioning) 是另一种类似于\
    \ `groupingBy` 的 `Collector` 。如前所述，`filter` 操作对流中的所有元素返回真或假。分区提供了一种机制，将所有为真的值收集到一个\
    \ `List` 中，将所有为假的值收集到另一个 `List` 中。在这个示例中，我们将两个列表：一个用于名称中包含 \"/\" 的区域（例如 America/Cancun），另一个用于不包含的区域（例如\
    \ Greenwich）。\n\n```java\npackage streams;\n\nimport java.util.Arrays;\nimport\
    \ java.util.List;\nimport java.util.Map;\nimport java.util.TimeZone;\nimport java.util.stream.Collectors;\n\
    \npublic class Collecting4 {\n public static void main(String[] args) {\n List<String>\
    \ zones = Arrays.asList(TimeZone.getAvailableIDs());\n Map<Boolean, List<String>>\
    \ zonesCompare =\n zones.stream()\n .collect(Collectors.partitioningBy(s -> s.indexOf(\"\
    /\") > 0));\n System.out.println(zonesCompare);\n }\n}\n```\n\n`Collecting` 的另一个很好的示例是在\
    \ `List` 中的每个单词之间添加逗号。我以前使用过 Apache Commons 的 `StringUtils.join` 来实现这一点。这通过 Streams\
    \ 也可以轻松实现：\n\n```java\npackage streams;\n\nimport java.util.Arrays;\nimport java.util.List;\n\
    import java.util.stream.Collectors;\n\npublic class Collecting {\n public static\
    \ void main(String[] args) {\n List<String> strings = Arrays.asList(\"This\",\
    \ \"is\", \"a\", \"list\");\n String s = strings.stream()\n .collect(Collectors.joining(\"\
    , \"));\n System.out.println(s);\n }\n}\n```\n\n这输出以下：\n\n`This, is, a, list`\n\
    \n注意这在最后一个元素后没有逗号。\n\n`Collectors` 还可以用于将管道的结果收集到新的 `Collection`，如 `List` 或 `Set`。可以通过以下方式实现：\n\
    \n```java\npackage streams;\n\nimport java.util.Arrays;\nimport java.util.List;\n\
    import java.util.stream.Collectors;\n\npublic class Collecting {\n public static\
    \ void main(String[] args) {\n List<Person> people = Arrays.asList(\n new Person(\"\
    Albert\", \"Smith\"),\n new Person(\"John\", \"James\"),\n new Person(\"John\"\
    , \"Brown\"),\n new Person(\"William\", \"Hughes\"),\n new Person(\"William\"\
    , \"Fleming\")\n );\n List<Person> filteredList = people.stream()\n .filter(p\
    \ -> p.getFirstName().equals(\"William\"))\n .collect(Collectors.toList());\n\
    \ System.out.println(filteredList);\n }\n}\n```\n\n这过滤掉了所有名字为“William”的 `Person`\
    \ 实例，并将结果添加到新列表中。\n\n## 其他操作 (Other operators)\n\nStreams API 是一个巨大的 API，需要一些时间才能完全掌握。以下是\
    \ Streams API 提供的尚未介绍的最有用中间操作：\n\n- `distinct`：从流中删除任何重复元素（基于 `equals` 实现）。\n\
    - `limit`：将流中的元素限制为特定数量。如果只需要显示最多 100 个结果，这将非常有用。由于它可以允许在管道中途减少流中的元素，因此还可以提高性能。\n\
    - `map`：这是上面看到的 `mapToInt` 方法的通用版本。它逐个获取元素并根据某些转换返回一个值（可能具有不同的类型）。\n- `sorted`：它提供了一种对元素排序的机制，可以基于自然顺序或\
    \ `Comparator`。可以在终端操作之前的管道中的任何位置调用，因此当 `map` 操作可能导致产生无序流时，它是很有用的。\n\n以下是 Stream\
    \ 上可用的、未讨论过的常用终端操作（如前所述，特化流如 `DoubleStream` 包含额外的终端操作）：\n\n- `allMatch`：它接受一个\
    \ `Predicate`，如果所有元素从谓词返回真，则返回真\n\n"
- fmt: "\n- `anyMatch`: this accepts a `Predicate` and returns true if any elements\
    \ return true from the predicate\n- `noneMatch`: this accepts a `Predicate` and\
    \ returns true if none of the elements return true from the predicate\n- `count`:\
    \ counts the number of elements in the stream\n\n## Creating Streams\n\nSo far\
    \ we have focused on how Streams can be created from Collections. There are in\
    \ fact several ways to create Streams; since they are just a stream of elements,\
    \ they can be produced by a variety of sources.\n\nThe Streams API contains a\
    \ concept called a range. A range allows a `Stream` to be constructed as a sequence\
    \ of numbers, for instance:\n\n```\nIntStream.range(0, 10).forEach(n -> System.out.println(n));\n\
    ```\n\nThis generates an `IntStream` with the numbers 0 through 9. The alternative\
    \ `rangeClosed` method can be used if you want the range to be inclusive of the\
    \ final number (e.g. 0 to 10).\n\nOnce the `Stream` has been created it can be\
    \ processed just like any other `Stream`, therefore ranges provide a Streams based\
    \ alternative to for-loops.\n\nAn alternative mechanism for creating Streams is\
    \ via builders. The following is an example of a builder that adds three Strings\
    \ to a Stream, and then invokes the `forEach` terminal operation:\n\n```\nStream.builder().add(\"\
    Hello\").add(\"World\").add(\"!\").build()\n  .forEach(s -> System.out.print(s));\n\
    ```\n\nThe builder is obtained via a static method on `Stream`. Once all elements\
    \ have been added the `build()` method is invoked to return a `Stream` of the\
    \ elements.\n\nNaturally `IntStream`, `LongStream` and `DoubleStream` support\
    \ corresponding builders for generating Streams of integers, longs and doubles\
    \ respectively.\n\nAnother way to construct Streams is to concatenate two Streams\
    \ together:\n\n```\nStream s1 = Stream.builder().add( \"Hello\").add(\"World\"\
    ).add(\"!\").build();\nStream s2 = Stream.builder().add( \"Another\").add(\"Stream\"\
    ).build();\nStream.concat(s1, s2).forEach(s -> System.out.print(s));\n```\n\n\
    The stream created in the final line above will process 5 elements.\n\nStreams\
    \ can also be generated via static helpers on the `Random` class. `Random.ints()`,\
    \ `Random.longs()` and `Random.doubles()` provide mechanisms for returning an\
    \ unlimited stream of pseudorandom integers, longs and doubles respectively (although\
    \ the quantity of values can be bound by an optional parameter). It is also possible\
    \ to define a range for the numbers; for instance we could request a `Stream`\
    \ of 100 random ints between 0 and 100,000 as follows:\n\n```\nRandom.ints(100,\
    \ 0, 100000)\n```\n\nNaturally these return Streams appropriate for the type of\
    \ number, so the example above returns an `IntStream`.\n\nPossibly the most useful\
    \ source of Streams outside of Collections however is Streams created from Files.\n\
    \nJava 7 introduced a `Files` class with a set of static helpers. This has been\
    \ enhanced in Java 8 to include methods that return Streams. In order to see this\
    \ in action, start by creating a text file on your file system, and add a few\
    \ lines to it.\n\nThe following example shows how that file can be read as a `Stream`,\
    \ and processed with all the operations we have seen above:\n\n```java\npackage\
    \ streams;\n\nimport java.io.IOException;\nimport java.nio.file.*;\nimport java.util.logging.*;\n\
    \npublic class FileReading {\n    public static void main(String[] args) {\n \
    \       Path path = Paths.get(\"/tmp/test.txt\");\n        try {\n           \
    \ Files.lines(path).distinct()\n              .forEach(s -> System.out.println(s));\n\
    \        } catch (IOException ex) {\n            Logger.getLogger(FileReading.class.getName())\n\
    \              .log(Level.SEVERE, \"IO Error\", ex);\n        }\n    }\n}\n```\n\
    \nThis program looks for a file called `/tmp/test.txt` and converts it into a\
    \ `Stream` via the `Files.lines()` method (this assumes a default character encoding\
    \ of UTF-8, but it can be overridden with an optional parameter). The intermediary\
    \ operation `distinct` is then used to remove duplicate lines, and the results\
    \ are printed out with the terminal `forEach` operator.\n\nNotice that this never\
    \ needs to read the whole file into memory: it can simply Stream one line at a\
    \ time through the pipeline, and then move onto the next line.\n\nFinally, it\
    \ is possible to generate a `Stream` from an array using a static helper on `Arrays`.\
    \ The following is a very simple example that prints out the sum of the numbers\
    \ in an array. Due to the fact that the array is of type `int`, the `Stream` returned\
    \ is an `IntegerStream`, and therefore the `sum` aggregate operation can be used:\n\
    \n```java\npackage streams;\n\nimport java.util.Arrays;\n\npublic class ArraysStream\
    \ {\n    public static void main(String[] args) {\n        int[] intArray = {4,2,5,7,66,4,3};\n\
    \        int result = Arrays.stream(intArray).sum();\n        System.out.print(result);\n\
    \    }\n}\n```\n\n## Parallel Programming\n\nI mentioned at the start of this\
    \ chapter that the Streams API was intended to revolutionize the way Java programmers\
    \ thought about, and wrote code using parallel processing. Up until this point\
    \ we have not seen any evidence of this: the Streams examples above are not any\
    \ different from iterators from a threading point of view.\n\nBefore looking at\
    \ parallelism it is best to start with a recap of the reasons parallel processing\
    \ is useful. Due to the fact that all modern computers (and even smart phones)\
    \ contain multiple cores, any program that is not performing parallel computing\
    \ (processing on multiple `Threads`) is by definition not exploiting the full\
    \ potential of the hardware for CPU bound operations.\n\nOn the whole, server-side\
    \ Java frameworks (such as `EJB` or `Servlets`) do allow programmers to perform\
    \ parallel computing with minimal effort, since the application server manages\
    \ threads. The programmer does not need to ask the application server to run Servlet\
    \ requests in multiple threads (and therefore on multiple cores), it happens automatically.\
    \ Outside the application server, however, the programmer is still responsible\
    \ for instructing the computer how to parallelize algorithms.\n\n### MapReduce\n\
    \nBefore discussing the implementation Streams API uses for parallelism, it is\
    \ worth taking a step back and looking at an algorithm called MapReduce that heavily\
    \ influenced this coding style. The MapReduce algorithm was popularized by Google\
    \ researchers via a paper written in 2004 ([http://research.google.com/archive/mapreduce.html](http://research.google.com/archive/mapreduce.html))\
    \ but the operations of map and reduce have been around far longer. Google’s insight\
    \ was to realize how these operations could be used to process massive quantities\
    \ of data on thousands of computers simultaneously (called a cluster).\n\nMapReduce\
    \ consists of two primary operations:\n\n- During the map step (which can be run\
    \ in parallel across many machines) each element in the list is filtered, transformed\
    \ or sorted as required. This obviously relates to the intermediate operations\
    \ we have already seen on the Stream API.\n- Once the map step is complete the\
    \ results are passed to the reduce step (which may or may not be run in parallel).\
    \ The reduce step is responsible for aggregating the data in some manner. This\
    \ step is obviously related to the terminal operations we have seen on the Stream\
    \ API.\n\nMany MapReduce implementations have sprung up since Google published\
    \ their paper, including Hadoop, which is an open source Java implementation.\
    \ Typically these implementations designate one computer to be the controller:\
    \ this farms out work to other nodes, which operate independently of one another,\
    \ and collects the results. For instance, a 20GB file may be split into 10MB chunks,\
    \ and each chunk sent to a different computer to be processed.\n\nThe benefits\
    \ of implementations like Hadoop is that the programmer does not need to focus\
    \ on the implementation of the multi-threaded code: they simply need to provide\
    \ a set of operations and the framework takes care of the farming out the algorithm\
    \ to potentially thousands of cores.\n\n### Fork/Join API\n"
