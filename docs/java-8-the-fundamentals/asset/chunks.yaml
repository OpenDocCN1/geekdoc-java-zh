    \ {\n\n public static void main(String[] args) {\n\n List<Person> people = Arrays.asList(\n\
    \n new Person(\"Albert\", \"Smith\"),\n\n new Person(\"John\", \"James\"),\n\n\
    \ new Person(\"John\", \"Brown\"),\n\n new Person(\"William\", \"Hughes\"),\n\n\
