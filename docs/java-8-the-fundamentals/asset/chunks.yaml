  trans: "\n例如，我通常使用 `Hibernate` 库将 Java 对象持久化到关系型数据库中。Hibernate 自然需要为 Java Dates\
    \ 到数据库 Dates 提供映射。虽然通过一个独立的项目添加了对 Joda 的支持，但 Hibernate 团队的精力自然集中在原生的 `java.util.Date`\
    \ 对象上。在未来，类似的项目可能会关注 Date 和 Time API 中的对象。\n\n# Nashorn\n\n长期以来，通过 `Rhino` JavaScript\
    \ 引擎在 JVM 上运行 JavaScript 一是可行的。Nashorn（读音为 Naz-horn）尝试提供一个性能更高的 JavaScript 引擎，实现\
    \ Java 和 JavaScript 之间更无缝的集成，并使 JavaScript 成为 JVM 上的一等语言。\n\nNashorn 的基础实际上是在\
    \ `Java 7` 中奠定的，引入了“InvokeDynamic”作为一种新的字节码指令。这一特性使得在 Java 中编写动态类型语言（Java 本身是一种静态类型语言）变得更加简单。\n\
    \nNashorn 支持 JavaScript 规范 `ECMA 5.1`。\n\n## 为什么你会想在 JVM 上使用 JavaScript？\n\n首先，你可能不想这样做，在这种情况下你可以忽略这个特性。我是\
    \ JavaScript 的忠实粉丝，甚至我还没有决定是否会在 JVM 上使用 JavaScript。有趣的是，`Java 8` 的其他开发让我变得不太想使用\
    \ JavaScript，因为它们提供了许多我发现 Java 遗缺的语言特性。\n\n然而，在某些情况下，使用动态语言是有理由的：\n\n- ****脚本编写\
    \ (Scripting)**：在很多时候，你想要执行一些相当直接的操作，例如解析和转换文件。在脚本语言中编写此类代码通常比使用 Java 等语言快得多——至少在\
    \ `Java 8` 发布之前是这样。\n-   **原型设计 (Prototyping)**：使用动态语言进行原型设计通常更快，因为在实现细节之前不需要构建整个类型系统。在\
    \ JavaScript 这样的语言中更改代码通常也更容易——尽管缺乏类型安全，这有时会付出代价。\n-   **偏好 (Preference)**：你可能只是更喜欢\
    \ JavaScript 的语法而不是 Java。有些人可能对这个说法翻白眼，但如果你读完附录 A 中的奖励章节，你可能会对 JavaScript 编写的代码有多优雅感到惊讶。\n\
    - **测试 JavaScript 代码**：在浏览器内部测试 JavaScript 代码并不直观。尽管已经取得了进展（特别是通过 `Selenium WebDriver`），但在很多情况下，能够使用\
    \ `JUnit` 在独立环境中测试 JavaScript 代码会很有帮助。\n-   **框架 (Frameworks)**：你可能希望使用服务器端 JavaScript\
    \ 框架，例如基于 JVM 的 `Node.js` 版本。这很可能是我在 JVM 上运行 JavaScript 最可能的原因。\n-   **复用 (Reuse)**：你想利用现有的\
    \ JavaScript 代码，但将其与 Java 代码一起运行在通用平台上。\n\n## 入门指南\n\n可以通过以下代码找到你当前 Java 版本支持的脚本引擎（以及它们的语言）：\n\
    \n```java\npackage javascript;\n\nimport javax.script.ScriptEngineFactory;\nimport\
    \ javax.script.ScriptEngineManager;\n\npublic class JavaScript {\n\n  public static\
    \ void main(String[] args) {\n\n    ScriptEngineManager m = new ScriptEngineManager();\n\
    \n    for (ScriptEngineFactory factory : m.getEngineFactories()) {\n      System.out.println(factory.getEngineName());\n\
    \      System.out.println(factory.getLanguageName());\n      System.out.println(\"\
    --------------------\");\n    }\n\n  }\n}\n```\n\n对我来说，这打印出了以下内容：\n\n```\nOracle\
    \ Nashorn\nECMAScript\n--------------------\nAppleScriptEngine\nAppleScript\n\
    --------------------\n```\n\n忽略 `AppleScriptEngine`，它的支持是因为我运行在 `OSX` 上，我们在这里感兴趣的是\
    \ `Nashorn` 引擎。\n\n这里是我们使用 `Nashorn` 引擎可以编写的最简单程序：\n\n```java\npackage javascript;\n\
    \nimport java.util.logging.Level;\nimport java.util.logging.Logger;\nimport javax.script.ScriptEngine;\n\
    import javax.script.ScriptEngineManager;\nimport javax.script.ScriptException;\n\
    \npublic class JavaScript {\n\n  public static void main(String[] args) {\n  \
    \  try {\n      ScriptEngineManager m = new ScriptEngineManager();\n      ScriptEngine\
    \ e = m.getEngineByName(\"nashorn\");\n      e.eval(\"print('Hello World!')\"\
    );\n    } catch (ScriptException ex) {\n      Logger.getLogger(JavaScript.class.getName()).log(Level.SEVERE,\
    \ null, ex);\n    }\n  }\n}\n```\n\n注意获取 `ScriptEngine` 引用的这一行：\n\n`ScriptEngine\
    \ e = m.getEngineByName(\"nashorn\");`\n\n这使用了引擎的短名称，因此与上面看到的名称不同。我们然后使用引擎评估一个\
    \ JavaScript 语句：\n\n```javascript\nprint('Hello World!')\n```\n\n该语句使用 JavaScript\
    \ 引擎的 `print` 函数将 Hello World! 输出到标准输出。\n\n上面的示例没有提供 Java 和 JavaScript 之间的交互。以下是一个稍微复杂的示例。它创建了一个名为\
    \ `sum` 的 JavaScript 函数，然后通过提供两个 Java 变量来调用它，并将结果存储另一个 Java 变量中。\n\n```java\n\
    package javascript;\n\nimport javax.script.Invocable;\nimport javax.script.ScriptEngine;\n\
    import javax.script.ScriptEngineManager;\n\npublic class JavaScript2 {\n\n  public\
    \ static void main(String[] args) throws Throwable {\n    ScriptEngineManager\
    \ e = new ScriptEngineManager();\n    ScriptEngine nashorn = e.getEngineByName(\"\
    nashorn\");\n    nashorn.eval(\"function sum(a, b) { return a+b; }\");\n    Invocable\
    \ invocable = (Invocable) nashorn;\n    Integer result = (Integer)invocable.invokeFunction(\"\
    sum\", 20, 23);\n    System.out.println(result);\n  }\n}\n```\n\n注意，为了运行此示例，我们需要指定\
    \ Nashorn `ScriptEngine` 是 `Invocable` 实例——因为这不是 `ScriptEngines` 的通用要求。\n\n也可以将\
    \ JavaScript 函数定义为特定接口的实例。这允许在不使用 `invokeFunction` 方法的情况下运行代码。例如，考虑以下情况，它声明一个\
    \ JavaScript 函数是 `Runnable` 的实现，然后将其传递给 `Thread`：\n\n```java\npackage javascript;\n\
    \nimport javax.script.*;\n\npublic class JSInterfaces {\n\n  public static void\
    \ main(String[] args) throws Exception {\n    ScriptEngineManager e = new ScriptEngineManager();\n\
    \    ScriptEngine nashorn = e.getEngineByName(\"nashorn\");\n    String script\
    \ = \"function run() {print('This is running in a thread!'); }\";\n    nashorn.eval(script);\n\
    \    Invocable invocable = (Invocable) nashorn;\n    Runnable runnable = invocable.getInterface(Runnable.class);\n\
    \    Thread thread = new Thread(runnable);\n    thread.start();\n  }\n}\n```\n\
    \n注意名为 `run` 的 JavaScript 函数遵循 `Runnable` 接口。\n\n## 执行脚本\n\n上一节中的代码示例并不是你想要遵循的示例——通过字符串拼接编写代码容易出错。通常你创建一个包含\
    \ JavaScript 代码的脚本文件，并在 Java 中执行该脚本，并可能传递供脚本使用的变量。\n\n我在源代码相同的包下创建了一个名为 `helpers.js`\
    \ 的文件。我在其中提供了三个简单的工具方法，以及一个调用其中一个方法的 语句：\n\n```javascript\nfunction sum(a, b)\
    \ {\n  return a + b;\n}\n\nfunction multiply(a, b) {\n  return a * b;\n}\n\nfunction\
    \ max(a, b) {\n  return Math.max(a, b);\n}\n\nprint(sum(100, 15));\n```\n"
- fmt: "\nThe following code can be used for invoking this script:\n\n```javascript\n\
    package javascript;\n\nimport java.util.Arrays;\nimport java.util.List;\nimport\
    \ java.util.logging.Level;\nimport java.util.logging.Logger;\nimport javax.script.Invocable;\n\
    import javax.script.ScriptEngine;\nimport javax.script.ScriptEngineManager;\n\n\
    public class JavaScript {\n  public static void main(String[] args) {\n    try\
    \ {\n      ScriptEngineManager m = new ScriptEngineManager();\n      ScriptEngine\
    \ e = m.getEngineByName(\"nashorn\");\n      e.eval(new java.io.FileReader(\"\
    src/javascript/helpers.js\"));\n      Invocable invocable = (Invocable) e;\n \
    \     Integer result = (Integer)invocable.invokeFunction(\"sum\", 20, 30);\n \
    \     System.out.println(result);\n    } catch (Exception ex) {\n      Logger.getLogger(JavaScript.class.getName()).log(Level.SEVERE,\
    \ null, ex);\n    }\n  }\n}\n```\n\nThis should print the number 115 when the\
    \ script loads, and then 50 when the `invokeFunction` code is executed.\n\nIt\
    \ is important that you get the path correct. The following assumes that your\
    \ project’s code is stored in a folder called `src`, and the `helpers.js` file\
    \ is in the `javascript` package.\n\n## Using Java in JavaScript\n\nThe interplay\
    \ between Java and JavaScript can be quite complex. Any JavaScript code can instantiate\
    \ Java objects, and then treat them as though they were JavaScript objects. JavaScript\
    \ objects are not completely dissimilar to Java objects – as you will see in Appendix\
    \ A - they support fields and methods, just like Java objects, and use the variable\
    \ `this` in similar ways.\n\nAdd the following JavaScript function to the `helpers.js`\
    \ file created earlier:\n\n```javascript\nfunction useJava() {\n  var list = new\
    \ java.util.ArrayList();\n  list.add(8);\n  list.add(20);\n  list.add(88);\n \
    \ list.add(21);\n  return list.stream().mapToInt(function(i) {return i*i}).sum();\n\
    }\n```\n\nIf you look at this you will see that it constructs a Java `List` within\
    \ a JavaScript function. It has to use the fully qualified class name because\
    \ it has not performed an import. It is possible to perform imports where required\
    \ using the `importPackage` and `importClass` functions.\n\n```javascript\nimportPackage(java.util);\n\
    importClass(java.util.List);\n```\n\nIt is also wise to point out at this stage\
    \ that the classes in `java.lang` are not automatically imported into scripts,\
    \ since the JavaScript has many identically named objects (e.g. `Boolean`, `Object`)\n\
    \nOnce the `ArrayList` is instantiated, its methods can be invoked just like any\
    \ other JavaScript object – in this case we call the `add` method 4 times to add\
    \ numbers.\n\nIt is the final line of the method that is really interesting however.\
    \ We invoke the Java Streams `mapToInt` method, but instead of providing a lambda\
    \ expression, we provide a JavaScript anonymous function.\n\nYou can then invoke\
    \ this function from Java as follows:\n\n```javascript\nInteger result = (Integer)invocable.invokeFunction(\"\
    useJava\");\n```\n\n## Command Line\n\nIt is also possible to access Nashorn from\
    \ the command line, making it a possible choice for writing command line scripts.\
    \ A utility has been provided in the `bin` folder of Java, and can be invoked\
    \ by opening a command prompt and invoking the `jjs` program:\n\nThis can be provided\
    \ a script, but is also a standalone JavaScript interpreter. In order to prove\
    \ this, simply type the following at the command prompt:\n\n```bash\n1 + 1\n```\n\
    \nThis should produce the result 2.\n\nWe can actually execute any JavaScript\
    \ here, for instance:\n\n```javascript\n[1,2,3,4,5,6,7,8].filter(function(i) {return\
    \ i%2==1})\n```\n\nAny input will be immediately evaluated and the result returned.\n\
    \nThis is more than a JavaScript interpreter however – it is a JavaScript interpreter\
    \ on the Java platform, therefore we can also invoke the following:\n\n```javascript\n\
    list = new java.util.ArrayList();\nlist.add(1);\nlist.add(2);\nlist.add(3);\n\
    result = list.stream().mapToInt(function(i) {return i*i}).sum()\nprint(result)\n\
    ```\n\nNotice how we are combining JavaScript and Java in some of these statements.\
    \ The command line therefore is great as a scratch pad for trying out code before\
    \ including it in a script.\n\nIf you continue on to learn JavaScript by reading\
    \ the sample chapter in Appendix A, you can choose to use `jjs` as the interpreter\
    \ for the examples.\n\nTo exit the command line use the `quit()` function.\n\n\
    `jjs` is actually even more powerful that the examples above suggest. It can be\
    \ started in a special scripting mode as follows:\n\n```bash\njjs –scripting\n\
    ```\n\nWhen in this mode `jjs` can perform the tasks of traditional shells, such\
    \ as executing commands:\n\n```bash\n$EXEC(\"ls -l\")\n```\n\nExecute commands\
    \ with input:\n\n```bash\n$EXEC(\"cat\", \"Hello World\")\n```\n\nOr access the\
    \ environment:\n\n```bash\n$ENV.USER\n```\n\nIn fact, you can write scripts using\
    \ the following header and execute them like any other shell script:\n\n```bash\n\
    #!/usr/bin/jjs\n```\n\nThe use of scripting features will naturally be dependent\
    \ on your underlying operating system; therefore this feature will not be discussed\
    \ in any detail.\n\n## Conclusion\n\nThis chapter has only scratched the service\
    \ of what Nashorn is capable of. The main aspect to understand is that JavaScript\
    \ code can use Java code, and Java code can invoke JavaScript code. The Nashorn\
    \ JavaScript engine is not just another JavaScript engine therefore, since it\
    \ has access to all the libraries and APIs supported by the Java platform.\n\n\
    # Minor Changes\n\nThis chapter will provide a roundup of some of the minor changes\
    \ that have happened in Java 8\\. None of these features deserve their own chapter,\
    \ but each is interesting enough that\n\n## Parallel sort on Arrays\n\nIt is now\
    \ possible to perform parallel sorts on arrays. As with parallel streams this\
    \ is using the common ForkJoinPool under the hood, and may lead to performance\
    \ gains.\n\nIf you would like to benchmark this yourself, here is example program\
    \ that adds 10,000,000 random doubles to an array and then sorts them using parallelSort:\n\
    \n```java\npackage arrays;\n\nimport java.util.Arrays;\n\npublic class ArraySort\
    \ {\n  public static void main(String[] args) {\n    double[] nums = new double[10000000];\n\
    \    for (int i = 0; i < 10000000; i++) {\n      nums[i] = Math.random();\n  \
    \  }\n    long start = System.currentTimeMillis();\n    Arrays.parallelSort(nums);\n\
    \    //Arrays.sort(nums);\n    System.out.println(System.currentTimeMillis()-start);\n\
    \  }\n}\n```\n\nOnce you have timings for parallel sorting, try changing the implementation\
    \ to use serial sort by changing the following lines:\n\n```java\n//Arrays.parallelSort(nums);\n\
    Arrays.sort(nums);\n```\n\nOn a large array like this I do notice a significant\
    \ improvement with parallelSort, but with smaller arrays the difference was insignificant.\n\
    \n## Annotation Changes (JSR 308)\n\nPrior to Java 8, annotations could be used\
    \ on the declarations of classes, methods, fields, packages, local variables and\
    \ on method parameters.\n\nIt is now possible to apply annotations anywhere a\
    \ type declaration occurs. This may be used in the future to allow even stronger\
    \ type checking than is currently available. For instance, if types are used to\
    \ define local variables they can be given annotations:\n\n```java\npublic void\
    \ method() {\n  @NotNull String str1 = “Hello\n}\n```\n\nThey can also be used\
    \ when constructing objects with the `new` keyword:\n\n```java\nObjectA objecta\
    \ = new @Readonly ObjectA();\n```\n\nOr in generic declarations:\n\n```java\n\
    List<@CreditCard String> creditCards = new ArrayList<>();\n```\n\nOr when throwing\
    \ exceptions:\n\n```java\nthrow new @HighPriority IOException();\n```\n\nEssentially\
    \ anywhere types are used they can be accompanied by annotations.\n\nThe main\
    \ reason these changes will not be discussed in this book is because by themselves\
    \ these change do not bring any immediate benefits – it is up to framework developers\
    \ to use this feature in meaningful ways.\n"
