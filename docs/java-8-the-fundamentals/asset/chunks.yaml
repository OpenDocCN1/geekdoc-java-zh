  trans: "\nLambda 表达式最初被计划包含在 `Java 7` 中，并且在此之前的多年里一直被广泛请求。Lambda 表达式（通常称为闭包或匿名方法）允许你将一段代码封装在匿名方法中（即没有名称或不包含所属类的方法），并将其传递给另一个方法，由该方法在适当的时间调用它。这听起来可能是一项简单的技术（确实如此），但它带来了巨大的益处，特别是当它与\
    \ Java 8 的另一个特性结合使用时：`Streams API`。\n\n在过去，Java 最接近 lambda 表达式的特性是匿名类和局部类。这些是在方法内部定义并进行实例化的类，并且通常会被传递给另一个方法以执行某种操作。在匿名类的情况下，没有必要为该类命名。\n\
    \n匿名类被广泛用作回调，并被常用于实现 `Runnable` 和 `ActionListener` 等接口。\n\nLambda 表达式是类匿名类演进过程中的下一步，因此我们将从一个匿名类的示例开始，看看为什么许多人认为\
    \ lambda 表达式是必要的。\n\n考虑这样一段代码：它从一个整数列表中过滤掉所有偶数，产生一个新的奇数列表。自然地，这可以通过迭代和命令式编程技术来实现，但另一种编写方法是定义一个方法，接受列表中的每个元素，并返回\
    \ `true` 或 `false` 以指示该元素是否应该保留在列表中——并定义一个通用的库来遍历列表并在每个元素上调用该方法。\n\n这种方法的优势在于，我们可以复用通用的过滤算法，只需替换做出过滤决策的方法即可。\n\
    \n开始，我们可以为将做出过滤决策的类定义一个 `Interface`：\n\n```java\npackage localclasses;\n\npublic\
    \ interface Filter<T> {\n    boolean filter(T t);\n}\n```\n\n接下来，我们可以写一个静态辅助类来执行通用的过滤。我们将其命名为\
    \ `Collections2`，因为它增强了 Java 在 `Collections` 类上提供的方法。这将创建一个新的空 `List`，遍历原始列表中的项，并在传递给它的\
    \ `Filter` 实例上调用 `filter` 方法——那些返回 `true` 的元素将被添加到新列表中：\n\n```java\npackage localclasses;\n\
    \nimport java.util.ArrayList;\nimport java.util.List;\n\npublic class Collections2\
    \ {\n    public static <T> List<T> filter(List<T> input, Filter<T> filter) {\n\
    \        List<T> result = new ArrayList<T>();\n        for (T t : input) {\n \
    \           if (filter.filter(t)) {\n                result.add(t);\n        \
    \    }\n        }\n        return result;\n    }\n}\n```\n\n现在我们已经有了一个通用的过滤 API，可以使用此功能来过滤列表。下面的代码将声明一个实现\
    \ `Filter` 的匿名类，并提供一个针对奇数时返回 `true` 的实现：\n\n```java\npackage localclasses;\n\n\
    import java.util.List;\nimport java.util.Arrays;\n\npublic class Main {\n    public\
    \ static void main(String[] args) {\n        List<Integer> numbers = Arrays.asList(1,5,4,2,7,9,6,4,2,6,5,8);\n\
    \        System.out.println(\n            Collections2.filter(numbers, new Filter<Integer>()\
    \ {\n                @Override\n                public boolean filter(Integer\
    \ t) {\n                    return t%2 == 1;\n                }\n            })\n\
    \        );\n    }\n}\n```\n\n这并不难，对吧？\n\n作为对比，JavaScript 中的相同代码看起来如下：\n\n```javascript\n\
    [1,5,4,2,7,9,6,4,2,6,5,8].filter(function(v) {return v%2 == 1;})\n```\n\nJavaScript\
    \ 的实现原生地向数组支持的 `filter` 方法传递了一个匿名函数。\n\n比较这两种方法的在于比较 Java 匿名类的实现：\n\n```java\n\
    Collections2.filter(numbers, new Filter<Integer>() {\n    @Override\n    public\
    \ boolean filter(Integer t) {\n        return t%2 == 1;\n    }\n})\n```\n\n与 JavaScript\
    \ 的匿名函数实现：\n\n```javascript\nfunction(v) {return v%2 == 1;}\n```\n\n当你比较这两者时，你就能理解为什么人们指责\
    \ Java 感觉过于啰嗦了。诚然，JavaScript 版本没有带来类型安全的优势，但除此之外，这两个示例在功能上是等价的。JavaScript 并不是孤立的例子；许多语言现在都支持同样简洁的语法。\n\
    \nJavaScript 中允许这行代码运行的关键特性是函数可以赋值给变量并作为参数传递给其他函数。具体来说：函数是该语言中的一等公民。\n\n在 `Java\
    \ 8` 发布之前，所有的 Java 方法都必须定义在类内部——因此方法在语言中并不是一等公民。结果是，方法不能作为参数传递给其他方法或赋值给变量。\n\n\
    Lambda 表达式本质上是一个在类作用范围之外的匿名方法。正如我们将看到的，在某种程度上这是一种幻象，lambda 表达式仍然是对象，它们确实有类型，但创建它们的语法消除了定义类的开销。\n\
    \nLambda 表达式的基本格式如下：\n\n```\n(String s) -> { System.out.println(s); };\n```\n\n\
    表达式的第一部分 `(String s)` 表示在调用 lambda 表达式时将传递给它的参数——在这种情况下，它将传递一个单一的 `String` 参数。如果\
    \ lambda 表达式不需要参数，则可以定义为 `()`。正如我们将看到的，这种结构在某些情况下可以被极大简化，表达式的右侧 `{ System.out.println(s);\
    \ }` 包含了调用 lambda 表达式时将执行的代码块——自然地，它可以访问参数并使用所需的任何其他 Java 语言特性——它只是一个普通的代码块。\n\
    \n如果代码块由单个语句组成，可以省略 `{}` 括号，该语句的返回类型将隐式成为 lambda 表达式的返回类型。如果使用了 `{}` 括号，lambda\
    \ 表达式可以使用 `return` 关键字返回值，否则（在本例中），它返回 `void`。\n\n表达式的两个部分通过 `->` 结构连接在一起。下面将有许多这种结构的示例，所以现在不必过于担心理解\
    \ lambda 表达式的细节。\n\n## 函数式接口\n\n如上所述，许多支持 lambda 表达式的语言使函数成为语言中的一等公民。Java 并没有走得那么远——lambda\
    \ 表达式仍然是对象。此外，即使增加了 lambda 表达式，Java 仍然是一种静态类型语言；因此，它需要在编译时知道传递给方法的任何参数（包括 lambda\
    \ 表达式）的类型。这引出了显而易见的问题：lambda 表达式是什么类型？\n\n答案在于 `Java 8` 的一项新特性：“函数式接口”。你可能遇到过没有方法的接口（例如\
    \ `Serializable`、`Cloneable`）。这些被称为标记接口或标签式接口，因为它们仅用于表示类的某些特征，而不需要要求类实现任何内容。\n\
    \nJava 现在支持第二类特殊的接口，它们包含单个方法：这些可以被指定为“函数式接口”。许多现有的 Java 接口已被指定为函数式接口，包括 `Comparable`、`Runnable`\
    \ 和 `ActionListener`。这些接口被称为单抽象方法接口（SAM Interfaces）——特别是在 Scala 世界。\n\n在 `Java\
    \ 8` 之前，SAM 接口并没有特殊之处：在 `Java 8` 中，当使用 `@FunctionalInterface` 注解标记时，它们现在可以作为 lambda\
    \ 表达式的类型，例如：\n\n```java\n@FunctionalInterface\n```\n"
- fmt: "\n```java\npublic interface Example {\n\n    void doSomething(Object obj);\n\
    }\n```\n\nOne obvious use for lambda expressions is for callbacks. Callbacks encapsulate\
    \ a block of code that should be executed by another block of code when a specified\
    \ event occurs. The event may be the user pressing a button on the screen, or\
    \ the result being received for a long running transaction.\n\nThe example below\
    \ creates a functional interface to represent the printing of an object. Instances\
    \ of this interface will then be passed as a callback to other methods, allowing\
    \ them to print the results of an operation in the manner required by the initial\
    \ invoker:\n\n```java\npackage printing;\n\n@FunctionalInterface\npublic interface\
    \ Printer {\n\n    void print(Object obj);\n}\n```\n\nAdding the `@FunctionalInterface`\
    \ annotation ensures that the compiler will check that the interface meets the\
    \ requirements for being a Functional Interface: if the interface contained anything\
    \ other than one method definition the code would not compile.\n\nOnce a Functional\
    \ Interface has been defined we can declare a lambda expressions of that type:\n\
    \n```java\nPrinter printer = (Object o) -> { System.out.println(\">>>\" + o);\
    \ };\n```\n\nThis line of code will not execute the lambda expression: it is simply\
    \ assigning it to a variable so that it can be used at a later point in the code.\n\
    \nIf you think about the line of code above, it is actually very unusual from\
    \ a Java point of view. The compiler is determining the type of an object via\
    \ the type it is assigned to. This is the other way round from how Java normally\
    \ works: typically an expression has a type, and the compiler determines whether\
    \ that is compatible with the type it is being assigned to.\n\nIf you wanted to,\
    \ you could then invoke this as follows:\n\n```java\nprinter.print(\"Hello World\"\
    );\n```\n\nGenerally, however we want to pass the lambda expression to another\
    \ method. The following is a contrived example, but shows the basic technique:\n\
    \n```java\npackage lambda;\n\nimport printing.Printer;\n\npublic class Adder {\n\
    \n    public static void main(String[] args) {\n        int num1 = 10;\n     \
    \   int num2 = 20;\n\n        Printer printer = (Object o) -> {\n            System.out.printf(\"\
    The result of %d and %d is %d\\n\", num1, num2, o);\n        };\n\n        add(num1,\
    \ num2, printer);\n    }\n\n    public static void add(int num1, int num2, Printer\
    \ printer) {\n        int result = num1 + num2;\n        printer.print(result);\n\
    \    }\n}\n```\n\nThis prints the following to standard output:\n\nThe result\
    \ of 10 and 20 is 30\n\nThis is a contrived example because there is no reason\
    \ for the `add` method not to return the result of the addition for the `main`\
    \ method to print itself, but it gets us started with lambda expressions.\n\n\
    Notice that this lambda expression uses local variables from the `main` method,\
    \ even though it is eventually executed in the `add` method: we will return to\
    \ this subject shortly when we investigate the scope that lambda expressions operate\
    \ in.\n\nAs it happens, most of the time we do not need to define our own functional\
    \ interfaces because Java provides a set for us. We can see this by moving to\
    \ a realistic example.\n\nA common use-case for lambda expressions is to have\
    \ a method pass each element of a list to a lambda expression (just like our filter\
    \ example at the start of the chapter). Java 8 provides a new method on `List`\
    \ called `forEach` that accepts a lambda expression and implicitly passes each\
    \ element in the list to it: the lambda expression it accepts must conform to\
    \ the `Consumer` functional interface (`java.util.function.Consumer`). This defines\
    \ the following method:\n\n```java\nvoid accept([T](http://download.java.net/jdk8/docs/api/java/util/function/Consumer.html\
    \ \"type parameter in Consumer\") t)\n```\n\nThe following shows a basic example:\n\
    \n```java\npackage lambda;\n\nimport java.util.Arrays;\nimport java.util.List;\n\
    import java.util.function.Consumer;\n\npublic class Main {\n\n    public static\
    \ void main(String[] args) {\n        Consumer c = (Object o) -> { System.out.println(\"\
    >>>\" + o); };\n        List l = Arrays.asList(\"Hello\", \"World\", \"Print\"\
    , \"My\", \"List\");\n        l.forEach(c);\n    }\n}\n```\n\nThis will produce\
    \ the following output:\n\n>>>Hello\n>>>World\n>>>Print\n>>>My\n>>>List\n\nThis\
    \ is the first example of many in this book that uses “implicit” rather than “explicit”\
    \ iteration. Methods such as `forEach` remove the need for the programmer to describe\
    \ the iteration process to the compiler – they implicitly perform it. This may\
    \ sound like a minor convenience, but it will turn out to have powerful implications\
    \ later in the book.\n\nWe can of course combine the declaration and use of the\
    \ lambda expression into a single step:\n\n```java\npackage lambda;\n\nimport\
    \ java.util.Arrays;\nimport java.util.List;\n\npublic class Main {\n\n    public\
    \ static void main(String[] args) {\n        List l = Arrays.asList(\"Hello\"\
    , \"World\", \"Print\", \"My\", \"List\");\n        l.forEach((Object o) -> {\
    \ System.out.println(\">>>\" + o); });\n    }\n}\n```\n\nNotice that we don’t\
    \ even need to import the `Consumer` interface now – the compiler knows to check\
    \ that the lambda expression conforms to the `Consumer` interface, since that\
    \ is the interface accepted by the `forEach` method.\n\nWe can even take this\
    \ one step further by removing the type definition from the lambda expression’s\
    \ parameter, and remove the `{}` brackets from the lambda expression’s code block:\n\
    \n```java\npackage lambda;\n\nimport java.util.Arrays;\nimport java.util.List;\n\
    \npublic class Main {\n\n    public static void main(String[] args) {\n      \
    \  List<String> l = Arrays.asList(\"Hello\", \"World\", \"Print\", \"My\", \"\
    List\");\n        l.forEach(o -> System.out.println(\">>>\" + o));\n    }\n}\n\
    ```\n\nWe have used generics to declare that the list contains elements of type\
    \ `String`; therefore the compiler can safely assume that every element passed\
    \ to the lambda is a `String`. This in turn allows us to omit the type of the\
    \ parameter.\n\nWe can now turn our attention back to the filtering example outlined\
    \ earlier. Java 8 refers to a filter as a “predicate” and provides a functional\
    \ interface called `Predicate`. This defines the following method:\n\n```java\n\
    boolean test([T](http://download.java.net/jdk8/docs/api/java/util/function/Predicate.html\
    \ \"type parameter in Predicate\") t)\n```\n\nThe fundamental aspect of a predicate\
    \ is that it accepts an element and returns true or false. The `List` interface\
    \ also supports a new method `removeIf`. This method passes every element in the\
    \ list to the predicate, and removes it if the predicate evaluates to true:\n\n\
    ```java\npackage lambda;\n\nimport java.util.Arrays;\nimport java.util.LinkedList;\n\
    import java.util.List;\n\npublic class Main2 {\n\n    public static void main(String[]\
    \ args) {\n        List<Integer> l = new LinkedList(Arrays.asList(4,5,88,76,55,23,7,20,45));\n\
    \        l.removeIf(i -> i%2 == 0);\n        System.out.println(l);\n    }\n}\n\
    ```\n\nThe expression `i -> i%2 == 0` conforms to the `Predicate` interface since\
    \ it accepts a single parameter and returns a Boolean result – as mentioned above,\
    \ lambda expressions implicitly return a type if they consist of a single statement\
    \ without `{}` brackets.\n\nThis could alternatively have been written as a code\
    \ block:\n\n```java\nl.removeIf(i -> {return i%2 == 0;});\n```\n\nI far prefer\
    \ the first form for readability, and this is the form that is most commonly used.\n\
    \nI should probably mention at this point that the `removeIf` method is a very\
    \ poor example of functional programming due to the fact that it mutates (or changes)\
    \ the original list. Functional programming emphasizes immutability, and therefore\
    \ the preferred approach would be to create a new list of odd numbers and leave\
    \ the original list untouched. As we will see in the next chapter, it is possible\
    \ to achieve this relatively simply with Java 8 using the Streams API.\n\nIn case\
    \ you were wondering, the fact that this method mutates the `List` meant I could\
    \ not simply use:\n\n```java\nArrays.asList(4,5,88,76,55,23,7,20,45)\n```\n\n\
    Since this method returns a fixed-length `List` mapped to the array, and therefore\
    \ it is not possible to remove elements.\n\n## Auto-generated Interfaces\n"
  raw: "public interface Example {\n\n void doSomething(Object obj);\n\n}\n\nOne obvious\
    \ use for lambda expressions is for callbacks. Callbacks encapsulate a block of\
    \ code that should be executed by another block of code when a specified event\
    \ occurs. The event may be the user pressing a button on the screen, or the result\
    \ being received for a long running transaction.\n\nThe example below creates\
    \ a functional interface to represent the printing of an object. Instances of\
    \ this interface will then be passed as a callback to other methods, allowing\
    \ them to print the results of an operation in the manner required by the initial\
    \ invoker:\n\npackage printing;\n\n@FunctionalInterface\n\npublic interface Printer\
    \ {\n\n void print(Object obj);\n\n}\n\nAdding the @FunctionalInterface annotation\
    \ ensures that the compiler will check that the interface meets the requirements\
    \ for being a Functional Interface: if the interface contained anything other\
    \ than one method definition the code would not compile.\n\nOnce a Functional\
    \ Interface has been defined we can declare a lambda expressions of that type:\n\
    \nPrinter printer = (Object o) -> { System.out.println(\">>>\" + o); };\n\nThis\
    \ line of code will not execute the lambda expression: it is simply assigning\
    \ it to a variable so that it can be used at a later point in the code.\n\nIf\
    \ you think about the line of code above, it is actually very unusual from a Java\
    \ point of view. The compiler is determining the type of an object via the type\
    \ it is assigned to. This is the other way round from how Java normally works:\
    \ typically an expression has a type, and the compiler determines whether that\
    \ is compatible with the type it is being assigned to.\n\nIf you wanted to, you\
    \ could then invoke this as follows:\n\nprinter.print(\"Hello World\");\n\nGenerally,\
    \ however we want to pass the lambda expression to another method. The following\
    \ is a contrived example, but shows the basic technique:\n\npackage lambda;\n\n\
    import printing.Printer;\n\npublic class Adder {\n\n public static void main(String[]\
    \ args) {\n\n int num1 = 10;\n\n int num2 = 20;\n\n Printer printer = (Object\
    \ o) -> {\n\nSystem.out.printf(\"The result of %d and %d is %d\\n\"\n\n, num1,\
    \ num2, o);\n\n };\n\n add(num1, num2, printer);\n\n }\n\n public static void\
    \ add(int num1, int num2, Printer printer) {\n\n int result = num1 + num2;\n\n\
    \ printer.print(result);\n\n }\n\n}\n\nThis prints the following to standard output:\n\
    \nThe result of 10 and 20 is 30\n\nThis is a contrived example because there is\
    \ no reason for the add method not to return the result of the addition for the\
    \ main method to print itself, but it gets us started with lambda expressions.\n\
    \nNotice that this lambda expression uses local variables from the main method,\
    \ even though it is eventually executed in the add method: we will return to this\
    \ subject shortly when we investigate the scope that lambda expressions operate\
    \ in.\n\nAs it happens, most of the time we do not need to define our own functional\
    \ interfaces because Java provides a set for us. We can see this by moving to\
    \ a realistic example.\n\nA common use-case for lambda expressions is to have\
    \ a method pass each element of a list to a lambda expression (just like our filter\
    \ example at the start of the chapter). Java 8 provides a new method on List called\
    \ forEach that accepts a lambda expression and implicitly passes each element\
    \ in the list to it: the lambda expression it accepts must conform to the Consumer\
    \ functional interface (java.util.function.Consumer). This defines the following\
    \ method:\n\nvoid accept([T](http://download.java.net/jdk8/docs/api/java/util/function/Consumer.html\
    \ \"type parameter in Consumer\") t)\n\nThe following shows a basic example:\n\
    \npackage lambda;\n\nimport java.util.Arrays;\n\nimport java.util.List;\n\nimport\
    \ java.util.function.Consumer;\n\npublic class Main {\n\n public static void main(String[]\
    \ args) {\n\n Consumer c = (Object o) -> { System.out.println(\">>>\" + o); };\n\
    \n List l = Arrays.asList(\"Hello\", \"World\", \"Print\", \"My\", \"List\");\n\
    \n l.forEach(c);\n\n }\n\n}\n\nThis will produce the following output:\n\n>>>Hello\n\
    \n>>>World\n\n>>>Print\n\n>>>My\n\n>>>List\n\nThis is the first example of many\
    \ in this book that uses “implicit” rather than “explicit” iteration. Methods\
    \ such as forEach remove the need for the programmer to describe the iteration\
    \ process to the compiler – they implicitly perform it. This may sound like a\
    \ minor convenience, but it will turn out to have powerful implications later\
    \ in the book.\n\nWe can of course combine the declaration and use of the lambda\
    \ expression into a single step:\n\npackage lambda;\n\nimport java.util.Arrays;\n\
    \nimport java.util.List;\n\npublic class Main {\n\n public static void main(String[]\
    \ args) {\n\n List l = Arrays.asList(\"Hello\", \"World\", \"Print\", \"My\",\
    \ \"List\");\n\n l.forEach((Object o) -> { System.out.println(\">>>\" + o); });\n\
    \n }\n\n}\n\nNotice that we don’t even need to import the Consumer interface now\
    \ – the compiler knows to check that the lambda expression conforms to the Consumer\
    \ interface, since that is the interface accepted by the forEach method.\n\nWe\
    \ can even take this one step further by removing the type definition from the\
    \ lambda expression’s parameter, and remove the {} brackets from the lambda expression’s\
    \ code block:\n\npackage lambda;\n\nimport java.util.Arrays;\n\nimport java.util.List;\n\
    \npublic class Main {\n\n public static void main(String[] args) {\n\n List<String>\
    \ l = Arrays.asList(\"Hello\", \"World\",\n\n \"Print\", \"My\", \"List\");\n\n\
    \ l.forEach(str -> System.out.println(\">>>\" + str));\n\n }\n\n}\n\nWe have used\
    \ generics to declare that the list contains elements of type String; therefore\
    \ the compiler knows that every element in the array is a String. This also means\
    \ that the compiler can safely assume that every element passed to the lambda\
    \ expression will be a String. This in turn allows us to omit the type of the\
    \ str parameter, and simply use the expression:\n\nstr -> System.out.println(\"\
    >>>\" + str)\n\nWe can now turn our attention back to the filtering example outlined\
    \ earlier in this chapter. Java 8 refers to a filter as a “predicate” and provides\
    \ a functional interface called Predicate. This defines the following method:\n\
    \nboolean test([T](http://download.java.net/jdk8/docs/api/java/util/function/Predicate.html\
    \ \"type parameter in Predicate\") t)\n\nThe fundamental aspect of a predicate\
    \ is that it accepts an element and returns true or false. The List interface\
    \ also supports a new method called removeIf. This method passes every element\
    \ in the list to the predicate, and removes it if the predicate evaluates to true:\n\
    \npackage lambda;\n\nimport java.util.Arrays;\n\nimport java.util.LinkedList;\n\
    \nimport java.util.List;\n\npublic class Main2 {\n\n public static void main(String[]\
    \ args) {\n\n List<Integer> l = new LinkedList\n\n (Arrays.asList(4,5,88,76,55,23,7,20,45));\n\
    \n       l.removeIf(i -> i%2 == 0);\n\n System.out.println(l);\n\n }\n\n}\n\n\
    The expression “i -> i%2 == 0” conforms to the Predicate interface since it accepts\
    \ a single parameter and returns a Boolean result – as mentioned above, lambda\
    \ expressions implicitly return a type if they consist of a single statement without\
    \ {} brackets.\n\nThis could alternatively have been written as a code block:\n\
    \nl.removeIf(i -> {return i%2 == 0;});\n\nI far prefer the first form for readability,\
    \ and this is the form that is most commonly used.\n\nI should probably mention\
    \ at this point that the removeIf method is a very poor example of functional\
    \ programming due to the fact that it mutates (or changes) the original list.\
    \ Functional programming emphasizes immutability, and therefore the preferred\
    \ approach would be to create a new list of odd numbers and leave the original\
    \ list untouched. As we will see in the next chapter, it is possible to achieve\
    \ this relatively simply with Java 8 using the Streams API.\n\nIn case you were\
    \ wondering, the fact that this method mutates the List meant I could not simply\
    \ use:\n\nArrays.asList(4,5,88,76,55,23,7,20,45)\n\nSince this method returns\
    \ a fixed-length List mapped to the array, and therefore it is not possible to\
    \ remove elements.\n\n## Auto-generated Interfaces"
