  trans: "\n正如上一节所示，并行处理大型数据集的关键在于将数据进行拆分（这一过程也称为分叉，forking），并并行处理数据的子集。一旦处理这些数据，它们就会被重新合并（这一过程称为合并，joining）并以某种方式进行聚合。因此，分叉与合并（Fork\
    \ and join）类似于映射（map）和还原（reduce）这两个术语。\n\n从 Java 的第一个版本开始，就可以使用 `Threads` 以及 `synchronized`\
    \ 关键字等线程概念以这种方式编写代码了。然而，对于许多程序员来说，编写多线程代码是困难的，即使对于经验丰富的程序员来说也容易出错。并发问题和竞态条件意味着许多程序员宁愿尽可能避免多线程代码。\n\
    \n为了缓解多线程代码中存在的某些固有问题，Java 在 Java 7 中引入了 Fork/Join 框架（JSR-166）。该框架的关键是 `ForkJoinPool`\
    \ 类。使用 Fork/Join 框架是一项重大进展：它本质上提供了一个工作线程池，所有线程都竞争接受任务——程序员只需创建任务并让它们以高效的方式进行处理。它还提供了一系列管理方法来监控池的行为。\n\
    \n尽管即使使用了 Fork/Join 框架，程序员在某种程度上仍然控制着线程过程，并且必须按照 Fork/Join API 规定的方式编写算法。\n\n\
    ## 流的并行化\n\nStreams API 的方向与 Fork/Join API（以及自 Java 5 之后添加到 Java 的所有其他并发 API）不同。Streams\
    \ API 的观点是，并行化应该是显式的——但是非侵入性的。你必须请求并行化，但在实现方面你实际上不需要自己做任何事情。\n\n要求程序员请求并行化是非常重要的，因为同一个程序在并行处理时其行为可能会不同——特别是当顺序很重要时。然而，一旦请求了并行化，Java\
    \ 平台就会负责在可用硬件上对算法进行优化。\n\n为了看到将 Stream 从串行处理更改为并行处理有多简单，以下这行代码：\n\n```\nl.stream().filter(p\
    \ -> p%2==1).mapToInt(p -> p * p).sum()\n```\n\n可以写为：\n\n```\nl.parallelStream().filter(p\
    \ -> p%2==1).mapToInt(p -> p * p).sum()\n```\n\n显然，在小列表上我们不太可能看到并行处理带来的任何收益，因此让我们在一个更密集的示例上尝试一下。以下程序设置了一个所有正整数的\
    \ Stream，然后找到偶数的平均值。第一个版本使用了并行实现（从 `range` 方法返回的 Stream 通过调用 `parallel` 方法被转换为并行流）。第二个版本是串行的。\n\
    \n```java\npackage streams;\n\nimport java.util.OptionalDouble;\n\nimport java.util.stream.IntStream;\n\
    \npublic class LargeRange {\n  public static void main(String[] args) {\n\n long\
    \ start = System.currentTimeMillis();\n OptionalDouble result = IntStream.range(0,\
    \ Integer.MAX_VALUE)\n.parallel()\n.filter(i -> i % 2 == 0)\n.average();\n\n System.out.printf(\"\
    Parallel version took %d\\n\",\n\n System.currentTimeMillis()-start);\n\n start\
    \ = System.currentTimeMillis();\n\n OptionalDouble result2 = IntStream.range(0,\
    \ Integer.MAX_VALUE)\n.filter(i -> i % 2 == 0)\n.average();\n\n System.out.printf(\"\
    Serial version took %d\\n\",\n\n System.currentTimeMillis()-start);\n }\n}\n```\n\
    \n当我在一台相当旧的 MacBook Air 上运行此程序时，我得到了以下结果：\n\nParallel version took 4800 \nSerial\
    \ version took 9629\n\n意所料，当我查看 CPU 使用情况时，并行版本使用的 CPU 是两倍。自然地，结果可能因机器而异，所以请你自己尝试一下并查看结果。\n\
    \n这个示例的伟大之处在于，我通过调用单个方法就使性能翻倍了。\n\n尽管并行处理仅仅选项，但它可以突出显示在相同代码被串行处理时并不明显的问题。这其中的一个典型情况是传递给流水线中操作的任何\
    \ lambda 表达式都有副作用：即它们改变了被其他 lambda 表达式使用的状态。\n\n如上所述，不建议在 lambda 表达式中改变对象的状态——但这是允许的。例如，没有任何可以阻止流水线中的代码向公共的集合（Collection）中添加元素——但是，当使用并行处理时，这可能会导致问题，因为集合不是线程安全的。\n\
    \n因此，在考虑并行化之前，值得询问以下问题：\n"
- fmt: "\nAnother important consideration for parallel streams is sorting. The two\
    \ lines below may look like they would print out the same results:\n\n```java\n\
    package streams;\n\nimport java.util.stream.IntStream;\n\npublic class Associative2\
    \ {\n\n  public static void main(String[] args) {\n    System.out.println(\"Running\
    \ in parallel\");\n\n    IntStream.range(1, 1000)\n      .parallel()\n      .filter(a\
    \ -> a %2 == 1)\n      .limit(10)\n      .sorted()\n      .forEach(a -> System.out.println(a));\n\
    \n    System.out.println(\"Running in serial\");\n\n    IntStream.range(1, 1000)\n\
    \      .filter(a -> a %2 == 1)\n      .limit(10)\n      .forEach(a -> System.out.println(a));\n\
    \  }\n}\n```\n\nIn fact, they do print out the same numbers, but the order the\
    \ numbers are printed is not sequential in the first case. Even though the numbers\
    \ are sorted before being passed to `forEach`, they are not printed in the sorted\
    \ order. There is a way around this – if the parallel version is changed to use\
    \ `forEachOrdered` it will print the numbers in sorted order:\n\n```java\nIntStream.range(1,\
    \ 1000).parallel()\n  .filter(a -> a %2 == 1)\n  .limit(10)\n  .forEachOrdered(a\
    \ -> System.out.println(a));\n```\n\nThe reason why this works is because the\
    \ `forEach` operation is actually being run in serial mode: which brings us back\
    \ to the first point – check that parallelism is actually bringing benefits.\n\
    \nOne final consideration to bear in mind with parallelism has to do with the\
    \ way parallelism is implemented. Under the hood, all parallel streams use a common\
    \ instance of `ForkJoinPool` containing as many threads as you have processors:\n\
    \n```java\nRuntime.getRuntime().availableProcessors()\n```\n\nThis means that\
    \ if you perform a long running operation with this pool you may starve other\
    \ code in the application trying to run parallel algorithms.\n\nIt is useful to\
    \ complete this discussion by comparing parallel streams to MapReduce frameworks\
    \ such as `Hadoop`. Essentially parallel streams provide similar capabilities\
    \ as `Hadoop` – but on a far smaller scale. Where `Hadoop` farms out and coordinates\
    \ processing with many computers, parallel streams farm out and coordinates processing\
    \ with many processors on the same machine.\n\n## Conclusion\n\nFrom my point\
    \ of view the `Streams API` is one of the most important advances I have seen\
    \ in Java since I began using it. Everywhere I look in the `Streams API` I find\
    \ better ways of writing code I have written hundreds of times. Prior to Java\
    \ 8 it was still possible to perform aggregate operations on data, but the code\
    \ was far more verbose and far more prone to bugs.\n\nThe `Streams API` therefore\
    \ has the ability to change the way I think about implementing algorithms in Java.\n\
    \n# Interfaces\n\nJava 8 has made significant changes to the way interfaces are\
    \ defined. We have already seen the changes that have been added to support `FunctionalInterfaces`,\
    \ but another important change has been added called `default methods`: these\
    \ allow implementation details to be included in interfaces.\n\nIt may sound a\
    \ strange decision to allow `Interfaces` to contain implementation details, since\
    \ it largely goes against the whole ethos of interfaces: to provide contracts\
    \ that classes could choose to implement.\n\nDefault methods are also commonly\
    \ referred to as defender methods and virtual extension methods.\n\nDefault methods\
    \ have mainly been added to support some of the other changes in Java 8. If you\
    \ consider the `Collections API`, many fundamental types (such as `List` and `Set`)\
    \ are interfaces. Java 8 wanted to add new methods to these interfaces to support\
    \ `Streams`, but adding new methods would suddenly break all code for anyone who\
    \ had implemented these `Interfaces`. Interfaces have historically been very difficult\
    \ to modify if third parties have implemented them, since the changes will never\
    \ be backwards compatible with their code.\n\nJava 8 now allows methods to be\
    \ added to `Interfaces` along with default implementations. This means that new\
    \ methods can be added to interfaces, along with default implementations. Any\
    \ existing implementations of the interface will automatically pick up the default\
    \ implementation, while new classes implementing the interface can either choose\
    \ to provide their own implementation or use the default implementation.\n\nSince\
    \ Java classes can implement multiple interfaces, this change essentially brings\
    \ a form of multiple inheritance to the Java language. Before jumping in to take\
    \ a look at the changes, it is therefore perhaps worth taking a step back and\
    \ looking at one of the primary reasons Java did not previously support multiple\
    \ inheritance: the diamond problem.\n\nWe will start with a very simple interface:\n\
    \n```java\npackage diamond;\n\npublic interface A {\n  void doSomething();\n}\n\
    ```\n\nWe will next implement this interface in two separate classes:\n\n```java\n\
    package diamond;\n\npublic class B implements A {\n  @Override\n  public void\
    \ doSomething() {\n    System.out.println(\"Doing something the B way\");\n  }\n\
    }\n```\n\nand\n\n```java\npackage diamond;\n\npublic class C implements A {\n\
    \  @Override\n  public void doSomething() {\n    System.out.println(\"Doing something\
    \ the C way\");\n  }\n}\n```\n\nNow, if we were to write a class that extended\
    \ both `B` and `C` (let’s call “D”), which implementation of `doSomething` should\
    \ it use? This is called the diamond problem because a class diagram of this structure\
    \ looks like a diamond:\n\n![](images/00001.jpeg)\n\nBefore looking at how the\
    \ diamond problem is resolved, let's jump in and write an interface with a default\
    \ method:\n\n```java\npackage defaultmethods;\n\npublic interface A {\n  public\
    \ default void doSomething() {\n    System.out.println(\"I am A\");\n  }\n}\n\
    ```\n\nNotice the use of the `default` keyword. Previously this keyword has only\
    \ had meaning inside switch statements and annotation declarations; it now takes\
    \ on meaning inside interfaces.\n\nAlthough this interface contains an implementation\
    \ for its only method, it still is not possible to directly instantiate an instance\
    \ of this interface: a class still must implement it in order for it to be used.\n\
    \nWe can now implement this interface as follows:\n\n```java\npackage defaultmethods;\n\
    \npublic class B implements A {\n}\n```\n\nNotice that we do not have to implement\
    \ the `doSomething` method if we don’t want.\n\nWe can now instantiate `B`, and\
    \ invoke the `doSomething` method:\n\n```java\npackage defaultmethods;\n\npublic\
    \ class DefaultMethods {\n  public static void main(String[] args) {\n    B b\
    \ = new B();\n    b.doSomething();\n  }\n}\n```\n\nThis will print “I am A”.\n\
    \nWe will now create a second interface with the same `doSomething` method signature:\n\
    \n```java\npackage defaultmethods;\n\npublic interface A2 {\n  public default\
    \ void doSomething() {\n    System.out.println(\"I am A2\");\n  }\n}\n```\n\n\
    And change class `B` to implement both interfaces:\n\n```java\npackage defaultmethods;\n\
    \npublic class B implements A, A2 {\n}\n```\n\nThis will result in a compilation\
    \ error, since the compiler cannot know which version of the `doSomething` method\
    \ B wants to use.\n\nWe now have three choices:\n\n- Change `B` to only implement\
    \ `A` or `A2`\n- Provide an implementation of `doSomething` on `B`\n- Explicitly\
    \ tell the compiler to use the implementation in `A` or `A2`\n\nThe first two\
    \ options are fairly self-explanatory; the third option can be achieved as follows:\n\
    \n```java\npackage defaultmethods;\n\npublic class B implements A, A2 {\n  @Override\n\
    \  public void doSomething() {\n    A2.super.doSomething();\n  }\n}\n```\n\nThis\
    \ tells the compiler to utilize the implementation on `A2`.\n\nOne important thing\
    \ to note with default methods is that they cannot provide default methods for\
    \ any of the methods defined on `Object`. For instance, they cannot provide implementations\
    \ of `toString` or `equals`. The primary reason for this is that all objects already\
    \ have default implementations for these methods; therefore a decision was made\
    \ to disallow interfaces from providing an alternative default implementation.\n"
