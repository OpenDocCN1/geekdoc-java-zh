    作为额外奖励，我在那本书中增加了一个关于 `JavaScript` 的章节，以鼓励你学习 `JavaScript`，并理解这种变得出奇地优雅和成熟的语言。


    ## 注意事项


    `Java` 的覆盖范围非常广。成千上万的程序员使用 `Java` 平台，并以完全不同的方式从多种视角使用它。因此，对许多 `Java` 特性存在不同意见，这适用于
