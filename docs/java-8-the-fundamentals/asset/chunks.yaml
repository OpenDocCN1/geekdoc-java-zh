  trans: "\n\n- **Instant（瞬时）**：一个瞬时代表从 1970/1/1 到某个特定时间点之间所发生的纳秒数。由于这个数值大于 `long`\
    \ 类型所能容纳的范围，自 1970/1/1 以来经过秒数被存储在 `long` 中，而纳秒偏移量则存储在 `int` 中。\n- **Duration（持续时间）**：持续时间是两个\
    \ `Instants` 之间经过的时间量。与 `Instant` 类似，持续时间是以秒和纳秒为单位记录的。\n- **Period（周期）**：周期是一个基于日期的时间量。它以年、月、日为单位记录持续时间。\n\
    \n现在已经引入了基本类型，我们值得深入学习并查看一些示例。尽管这些类在表示日期和时间上非常不同，但它们倾向于支持一组标准方法；这些方法将在下文中介绍。第一个示例将处理\
    \ `LocalDateTime` 类，并检查它可以构造和操作的一些方式：\n\n```java\npackage datetime;\n\nimport\
    \ java.time.LocalDateTime;\n\nimport java.time.ZoneOffset;\n\npublic class DateTime\
    \ {\n\n public static void main(String[] args) {\n\n LocalDateTime dt = LocalDateTime.now();\n\
    \n System.out.println(dt);\n\n System.out.println(dt.getMonth());\n\n System.out.println(dt.getDayOfWeek());\n\
    \n dt = dt.plusDays(2);\n\n   System.out.println(dt.getDayOfWeek());\n\n dt =\
    \ dt.plusHours(5).plusMinutes(10);\n\n System.out.println(dt);\n\n System.out.println(dt.atOffset(ZoneOffset.ofHours(-11)));\n\
    \n dt = dt.minusWeeks(20);\n\n System.out.println(dt);\n\n  dt = dt.withDayOfMonth(4)\
    \ .withYear(2009);\n\n System.out.println(dt);\n\n }\n}\n```\n\n该程序产生了以下结果：\n\n\
    2014-03-06T19:38:34.933\n\nMARCH\n\nTHURSDAY\n\nSATURDAY\n\n2014-03-09T00:48:34.933\n\
    \n2014-03-09T00:48:34.933-11:00\n\n2013-10-20T00:48:34.933\n\n2009-10-04T00:48:34.933\n\
    \n这个简短的示例展示了许多实用的方法。首先，有一个 `now()` 方法用于创建一个表示当前日期时间的 `LocalDateTime`：\n\n```java\n\
    LocalDateTime dt = LocalDateTime.now();\n```\n\n还有多种方法可以用于访问日期或时间的特定部分（例如年份或月份）。你可能记得这些方法在\
    \ `java.util.Date` 中已被废弃，但在 `java.util.Calendar` 中以类似的形式存在：\n\n```java\ndt.getMonth()\n\
    \ndt.getDayOfWeek()\n```\n\n接下来，有一系列广泛的方法可以从 `LocalDateTime` 中增加或减去时间单位（例如周、年、小时）。由于\
    \ `LocalDateTime` 是不可变的，这些方法总是会返回一个新的 `LocalDateTime` 实例。这些方法与 `java.util.Calendar`\
    \ 上的方法有些相似之处，但涵盖了更广泛的选项，并且与 `Calendar` 不同，它们不会修改日期对象：\n\n```java\ndt.plusDays(2)\n\
    \ndt.plusHours(5).plusMinutes(10)\n```\n\n另一种操作 `LocalDateTime` 的方法是使用前缀为“with”的方法，例如\
    \ `withMonth`、`withYear`。这些方法也会返回一个新的 `LocalDateTime`，通过操作将相应的单位设置为请求中指定的值：\n\n\
    ```java\ndt.withDayOfMonth(4).withYear(2009)\n```\n\n最后，还有各种方法可以将这种类型的日期对象转换为其他类型的日期，示例展示了\
    \ `atOffset`，但也支持 `atZone`：\n\n```java\ndt.atOffset(ZoneOffset.ofHours(-11))\n\
    ```\n\n除了使用静态的 `now()` 方法创建 `LocalDateTime` 外，还可以使用静态的 `of()` 方法。例如：\n\n```java\n\
    LocalDateTime dt = LocalDateTime.of(2014, Month.MARCH, 3, 12, 24, 33);\n```\n\n\
    该方法是重载的，因此你可以通过可选提供秒和纳秒来选择你所需的数值精确度。\n\n`LocalDateTime` 实例也可以从文本字符串解析（这稍后将详细讨论）：\n\
    \n```java\nLocalDateTime.parse(\"2014-03-20T20:12:33\", DateTimeFormatter.ISO_DATE_TIME);\n\
    ```\n\n最后，它们可以从不同类型的日期/时间对象生成：\n\n```java\nLocalDateTime.from(Instant.now());\n\
    ```\n\n现在我们简要介绍了了一些用于创建和操作日期与时间对象的方法，值得关注 API 使用的几个原则：\n\n### 方法链式\n\n时间包中的大多数类都支持链式调用。链式调用是一种技术，其中一个方法调用的输出成为另一个方法调用的输入。我们在书的前面的部分已经看到过\
    \ Streams API 中中间操作的示例。链式调用的原理是：方法的返回类型是原始方法被调用的类型（或者是“this”，或者是该方法被调用的类型的新实例）。\n\
    \n以下是链式调用的示例：\n\n```java\ndt.withDayOfMonth(4).withYear(2009)\n\ndt.plusHours(5).plusMinutes(10)\n\
    ```\n\n### 不变性\n\n时间 API 中的大多数类都是不可变的。这意味着一旦设置了其值，就无法更改。为了方便，请考虑 `Calendar` 对象的以下代码：\n\
    \n```java\nCalendar c = new Calendar();\n\nCalendar c2 = c;\n\nc2.add(Calendar.DATE,\
    \ 1);\n```\n\n`c2` 的值发生了变化。\n\n### 年和月\n\n现在让我们来看看 `Year` 和 `MonthDay` 类的不同设置的示例（请记住，它们只处理表示日期的子集）：\n\
    \n```java\npackage datetime;\n\nimport java.time.Month;\n\nimport java.time.MonthDay;\n\
    \nimport java.time.Year;\n\npublic class YearMonth {\n\n public static void main(String[]\
    \ args) {\n\n Year y = Year.now();\n\n System.out.println(y.isLeap());\n\n System.out.println(y.isBefore(Year.of(2013)));\n\
    \n System.out.println(y.isAfter(Year.of(2013)));\n\n MonthDay md = MonthDay.of(Month.FEBRUARY,\
    \ 29);\n\n System.out.println(md.isValidYear(2011));\n\n System.out.println(md.isValidYear(2012));\n\
    \n System.out.println(md.isValidYear(2013));\n\n }\n}\n```\n\n该程序产生了以下结果：\n\n\
    false\n\nfalse\n\ntrue\n\n2011-02-28\n\ntrue\n\nfalse\n\n正如你所看到的，API 中的不同类有时支持额外的方法。`Year`\
    \ 类支持 `isLeap()` 方法，指示指定的年份是否为闰年，而 `MonthDay` 类支持 `isValidYear` 方法，指示日期和月份在特定年份中是否有效。\n\
    \n所有日期/时间类也都支持用于比较相同类型的 `isBefore` 和 `isAfter` 方法。\n\n### 瞬时\n\n如上述，`Instant`\
    \ 代表一个时间点，并以 `long` 和 `int` 对存储，表示自 1970 年 1 月 1 日（UTC 午夜）以来经过的纳秒数。\n\n事实是，以纳秒进行计时非常复杂。秒是通过原子钟定义的：这些秒被称为\
    \ SI 秒。一天大约有 86400 SI 秒（24 x 60 x 60）。\n\n不幸的是，细节在于细节——非常接近并不等同于精确。更糟糕的是，并不是每一天的长度都完全相同，而且一天的长度是不可预测的。尽管这些差异很小，但它们会随时间累积，因此\
    \ UTC 引入了闰秒的概念。这些秒允许一天拥有 86399 SI 秒或 86401 SI 秒，而不是预期的 86400 SI 秒。\n\n"
- fmt: "\nHow this works is largely up to the Java implementation. According to the\
    \ documentation: “Implementations of the Java time-scale using the `JSR-310` API\
    \ are not required to provide any clock that is sub-second accurate, or that progresses\
    \ monotonically or smoothly.“\n\nIf you are using `Java` in environments where\
    \ extreme precision is required you probably want to investigate the implications\
    \ of this statement in relation to your chosen `JVM`.\n\nNow that the details\
    \ have been addressed, the following is a code example using `Instants`:\n\n```java\n\
    package datetime;\n\nimport java.time.Instant;\nimport java.time.temporal.ChronoUnit;\n\
    \npublic class InstantExample {\n  public static void main(String[] args) {\n\
    \    Instant now = Instant.now();\n    System.out.println(\"Epoch seconds = \"\
    + now.getEpochSecond());\n    System.out.println(\"Offset nanoseconds = \"+ now.getNano());\n\
    \    System.out.println(now.toString());\n    now = now.minusSeconds(86400 );\n\
    \    System.out.println(now.toString());\n    System.out.println(now.until(Instant.now(),\
    \ ChronoUnit.HOURS));\n  }\n}\n```\n\nThis uses the familiar `now()` method to\
    \ construct an `Instant`, and then prints its seconds and nanoseconds.\n\nAs the\
    \ example shows, it is possible to add or subtract seconds from an `Instant` to\
    \ create a new `Instant` reflecting that offset.\n\nIt is also possible to use\
    \ the `until` method to determine how far apart two `Instants` are in the required\
    \ unit – hours in this example.\n\n## Duration and Period\n\nThe final classes\
    \ we will examine are `Duration` and `Period`, which are both mechanisms for recording\
    \ the passing of time. As mentioned above, durations are used to track a period\
    \ of time in seconds and nanoseconds, while a `period` is used to track a period\
    \ of time in years, months and days.\n\nThe following is an example program that\
    \ constructs a `Duration` as the difference between two `Instants` roughly 1050\
    \ milliseconds apart:\n\n```java\npackage datetime;\n\nimport java.time.Duration;\n\
    import java.time.Instant;\n\npublic class Durations {\n  public static void main(String[]\
    \ args) {\n    Instant i1 = Instant.now();\n    try {\n      Thread.sleep(1050L);\n\
    \    } catch (InterruptedException ex) {\n    }\n    Instant i2 = Instant.now();\n\
    \    Duration d = Duration.between(i1, i2);\n    System.out.printf(\"%d seconds\
    \ and %d nanoseconds elapsed\\n\",\n      d.getSeconds(), d.getNano());\n  }\n\
    }\n```\n\nOnce a `Duration` has been created, it can be used conveniently with\
    \ other types of `Date` or `Time`:\n\n`LocalDateTime ldt = LocalDateTime.now();`\n\
    `ldt = ldt.plus(d);`\n\nThis code adds the duration to an instance of `LocalDateTime`.\n\
    \nPeriods are used to find the number of years, months and days between two dates.\
    \ The following code constructs a period representing the difference between two\
    \ `LocalDate` instances:\n\n```java\npackage datetime;\n\nimport java.time.LocalDate;\n\
    import java.time.Month;\nimport java.time.Period;\n\npublic class Periods {\n\
    \  public static void main(String[] args) {\n    LocalDate ldt1 = LocalDate.of(2008,\
    \ Month.JANUARY, 22);\n    LocalDate ldt2 = LocalDate.of(2014, Month.MARCH, 12);\n\
    \    Period p = Period.between(ldt1, ldt2);\n    System.out.printf(\"%d years,\
    \ %d months, %d days\\n\",\n      p.getYears(), p.getMonths(), p.getDays()); \
    \  \n  }\n}\n```\n\nThis prints:\n6 years, 1 months, 18 days\n\nIt is also possible\
    \ to construct `Periods` from their static constructor methods:\n\n`Period p2\
    \ = Period.ofDays(2000);`\n\nIf we were to print the years and months of this\
    \ `Period` it would print 0 – in fact the `printf` statement above would produce\
    \ the following:\n0 years, 0 months, 2000 days\n\nThis is because we have not\
    \ specified the period in relation to any fixed date, therefore it is not possible\
    \ to know how many months and years it is. For instance, 366 days could be 1 year\
    \ and 1 day or 1 year and 0 days depending on the context, i.e. does it include\
    \ the 29th February.\n\n## Formatting and Parsing\n\nThe existing `Date` and `Calendar`\
    \ API uses the `SimpleDateFormat` class to convert `Dates` to and from `Strings`.\
    \ This is one of the most dangerous classes in `Java`.\n\n`SimpleDateFormat` looks\
    \ like a simple utility class, where its `parse` and `format` methods would fulfill\
    \ the goals of functional programming: the same inputs will always produce the\
    \ same output. In fact they don’t, because `SimpleDateFormat` stores object level\
    \ state as it performs its processing, and therefore is not thread-safe.\n\nAlthough\
    \ this is mentioned in the `Java Doc`,\n“Date formats are not synchronized. It\
    \ is recommended to create separate format instances for each thread. If multiple\
    \ threads access a format concurrently, it must be synchronized externally.”\n\
    \nI found this out the hard way: I assigned `SimpleDateFormat` to a static variable\
    \ in a multi-threaded environment, and found it would randomly produce outputs\
    \ that did not match its inputs.\n\nI still regularly find other programmers falling\
    \ into this trap.\n\nThe `Date and Time API` provides its own parsing and formatting\
    \ functionality, and this is thread-safe (this is unsurprising considering dates\
    \ and time objects are immutable).\n\nWe have already briefly seen an example\
    \ of parsing dates using the following code:\n\n`LocalDateTime.parse(\"2014-03-20T20:12:33\"\
    , DateTimeFormatter.ISO_DATE_TIME);`\n\nIn this case, the expression `DateTimeFormatter.ISO_DATE_TIME`\
    \ is an instance of the `DateTimeFormatter` class. This defines a date and time\
    \ format as follows:\n'2011-12-03T10:15:30+01:00[Europe/Paris]'\n\nSince we are\
    \ using a `LocalDateTime` the time zone and offset are irrelevant, therefore we\
    \ have omitted them.\n\n`DateTimeFormatter` provides a whole set of predefined\
    \ date and time formats, such as;\n• `ISO_DATE`\n• `ISO_TIME`\n\nThe definitions\
    \ for these can be found on the `DateTimeFormatter` Javadoc. \n\nIf the existing\
    \ patterns do not meet your needs, you can of course define your own patterns.\
    \ The pattern language for `DateTimeFormatter` is the same as for `SimpleDateFormat`:\n\
    \n`DateTimeFormatter formatter = DateTimeFormatter.ofPattern(\"MMM dd yyyy\");`\n\
    `LocalDate ldt = LocalDate.parse(\"Jan 22 2014\", formatter);`\n\nThe pattern\
    \ above can be used for parsing a textual date into an object that only contains\
    \ date information; for instance, the following code is perfectly legal and constructs\
    \ a year with the value 2014:\n\n`DateTimeFormatter formatter = DateTimeFormatter.ofPattern(\"\
    MMM dd yyyy\");`\n`Year year = Year.parse(\"Jan 22 2014\", formatter);`\n\nThis\
    \ code is not valid however:\n`DateTimeFormatter formatter = DateTimeFormatter.ofPattern(\"\
    MMM dd yyyy\");`\n`LocalDateTime ldt = LocalDateTime.parse(\"Jan 22 2014\", formatter);`\n\
    \nThis produces a `java.time.format.DateTimeParseException`, since the format\
    \ does not contain time information, and therefore is insufficient for populating\
    \ all the fields on a `LocalDateTime` instance.\n\nFormatting is the reserves\
    \ of parsing. The main constraint of formatting is that the pattern can only contain\
    \ elements that are relevant for the given object. Therefore, the following code\
    \ is valid:\n\n`LocalDate ld = LocalDate.now();`\n`ld.format(DateTimeFormatter.ofPattern(\"\
    yyyy MM\"));`\n\nbut the following code will result in a `java.time.temporal.UnsupportedTemporalTypeException`:\n\
    \n`LocalDate ld = LocalDate.now();`\n`ld.format(DateTimeFormatter.ofPattern(\"\
    yyyy MM dd hh\"));`\n\nIn this particular case we are attempting to format the\
    \ hour of a `LocalDate` – which is not possible.\n\nIt is also possible to format\
    \ dates based on the defaults of the user’s locale. For instance, the following\
    \ will print the date in a locale specific manner:\n\n`LocalDate ld = LocalDate.now();`\n\
    `ld.format(DateTimeFormatter.ofLocalizedDate(FormatStyle.SHORT));`\n\n## Conclusion\n\
    \nI am personally glad to see the inclusion of the `Date and Time API` into the\
    \ language. While the `Joda` library performed admirably, there are benefits to\
    \ incorporating it into the core language, since it is likely that other libraries\
    \ and frameworks that use dates and times will be more likely to provide support\
    \ for them.\n"
