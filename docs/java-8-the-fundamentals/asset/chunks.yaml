  trans: "\n\n这种工作方式在很大程度上取决于 Java 的实现。根据文档：“使用 `JSR-310` API 实现的 Java 时间尺度并不要求提供任何亚秒级精度的时钟，也不要求其单调或平滑地进展。”\n\
    \n如果你在需要极精度的环境中使用 `Java`，你可能需要调查这一说法相对于你所选 `JVM` 的影响。\n\n既然已经处理了这些细节，以下是一个使用 `Instants`\
    \ 的代码示例：\n\n```java\npackage datetime;\n\nimport java.time.Instant;\nimport java.time.temporal.ChronoUnit;\n\
    \npublic class InstantExample {\n  public static void main(String[] args) {\n\
    \    Instant now = Instant.now();\n    System.out.println(\"Epoch seconds = \"\
    + now.getEpochSecond());\n    System.out.println(\"Offset nanoseconds = \"+ now.getNano());\n\
    \    System.out.println(now.toString());\n    now = now.minusSeconds(86400 );\n\
    \    System.out.println(now.toString());\n    System.out.println(now.until(Instant.now(),\
    \ ChronoUnit.HOURS));\n  }\n}\n```\n\n这使用了熟悉的 `now()` 方法来构造一个 `Instant`，然后打印它的秒数和纳秒。\n\
    \n如示例所示，可以从 `Instant` 中加或减秒数，以创建一个反映该偏移量的新 `Instant`。\n\n还可以使用 `until` 方法来确定两个\
    \ `Instants` 之间在所需单位内的间隔——在本例中为小时。\n\n## Duration 和 Period\n\n我们将检查的最后两个类是 `Duration`\
    \ 和 `Period`，它们都是记录时间流逝的机制。如上所述，`duration` 用于跟踪以秒和纳秒计算的时间段，而 `period` 用于跟踪以年、月、日计算的时间段。\n\
    \n以下是一个示例程序，它通过两个相差约 1050 毫秒的 `Instants` 之间的差构造了一个 `Duration`：\n\n```java\npackage\
    \ datetime;\n\nimport java.time.Duration;\nimport java.time.Instant;\n\npublic\
    \ class Durations {\n  public static void main(String[] args) {\n    Instant i1\
    \ = Instant.now();\n    try {\n      Thread.sleep(1050L);\n    } catch (InterruptedException\
    \ ex) {\n    }\n    Instant i2 = Instant.now();\n    Duration d = Duration.between(i1,\
    \ i2);\n    System.out.printf(\"%d seconds and %d nanoseconds elapsed\\n\",\n\
    \      d.getSeconds(), d.getNano());\n  }\n}\n```\n\n一旦创建了 `Duration`，就可以方便地与其他类型的\
    \ `Date` 或 `Time` 配合：\n\n`LocalDateTime ldt = LocalDateTime.now();`\n`ldt = ldt.plus(d);`\n\
    \n这段代码将持续时间加到 `LocalDateTime` 实例上。\n\nPeriods 用于查找两个日期之间的年、月、日天数。以下代码构造了一个表示两个\
    \ `LocalDate` 实例差的 `period`：\n\n```java\npackage datetime;\n\nimport java.time.LocalDate;\n\
    import java.time.Month;\nimport java.time.Period;\n\npublic class Periods {\n\
    \  public static void main(String[] args) {\n    LocalDate ldt1 = LocalDate.of(2008,\
    \ Month.JANUARY, 22);\n    LocalDate ldt2 = LocalDate.of(2014, Month.MARCH, 12);\n\
    \    Period p = Period.between(ldt1, ldt2);\n    System.out.printf(\"%d years,\
    \ %d months, %d days\\n\",\n      p.getYears(), p.getMonths(), p.getDays()); \
    \  \n  }\n}\n```\n\n输出为：\n6 years, 1 months, 18 days\n\n也可以通过它们的静态构造方法来构造 `Periods`：\n\
    \n`Period p2 = Period.ofDays(2000);`\n\n如果我们要打印这个 `Period` 的年份和月份，它将输出 0 ——事实上，上面的\
    \ `printf` 语句将产生以下结果：\n0 years, 0 months, 2000 days\n\n这是因为我们没有指定相对于任何固定日期的周期，因此无法知道它有多少月和多少年。例如，366\
    \ 天可能是 1 年 1 天，也可能是 1 年 0 天，取决于上下文（即：是否包含 2 月 29 日）。\n\n## 格式化与解析\n\n现有的 `Date`\
    \ 和 `Calendar` API 使用 `SimpleDateFormat` 类在 `Dates` 和 `Strings` 之间进行转换。这是 Java\
    \ 中最危险的类之一。\n\n`SimpleDateFormat` 看起来像一个简单的工具类，其 `parse` 和 `format` 方法可以实现函数式编程的目标：相同的输入始终产生相同的输出。但事实并非如此，因为\
    \ `SimpleDateFormat` 在执行处理时会存储对象级别的状态，因此不是线程安全的。\n\n尽管在 `Java Doc` 中提到了这一点：\n\
    “日期格式不是同步的。建议为每个线程创建单独格式实例。如果多个线程并发访问格式，则必须在外部进行同步处理。”\n\n我是通过惨痛的教训发现这一点的：我在多线程环境中将\
    \ `SimpleDateFormat` 赋值给一个静态变量，结果发现它会随机产生与其输入不匹配的输出。\n\n我仍然经常发现其他程序员掉进这个陷阱。\n\n\
    `Date and Time API` 提供了自身的解析和格式化功能，并且它是线程安全的（考虑到日期和时间对象是不可变的，这并不意外）。\n\n我们已经通过以下代码简要地看到一个解析日期的示例：\n\
    \n`LocalDateTime.parse(\"2014-03-20T20:12:33\", DateTimeFormatter.ISO_DATE_TIME);`\n\
    \n在这种情况下，表达式 `DateTimeFormatter.ISO_DATE_TIME` 是 `DateTimeFormatter` 类的一个实例。它定义的日期和时间格式如下：\n\
    '2011-12-03T10:15:30+01:00[Europe/Paris]'\n\n由于我们使用的是 `LocalDateTime`，所以时区和偏移量是无关的，因此我们省略了它们。\n\
    \n`DateTimeFormatter` 提供了一整套预定义的日期和时间格式，例如：\n• `ISO_DATE`\n• `ISO_TIME`\n\n这些定义可以在\
    \ `DateTimeFormatter` 的 Javadoc 中找到。\n\n如果现有模式不能满足你的需求，你可以定义自己的模式。`DateTimeFormatter`\
    \ 的模式语言与 `SimpleDateFormat` 相同：\n\n`DateTimeFormatter formatter = DateTimeFormatter.ofPattern(\"\
    MMM dd yyyy\");`\n`LocalDate ldt = LocalDate.parse(\"Jan 22 2014\", formatter);`\n\
    \n上述模式可以用于将日期解析为仅包含日期信息的对象；例如，以下代码构造了一个值为 2014 的年份：\n\n`DateTimeFormatter formatter\
    \ = DateTimeFormatter.ofPattern(\"MMM dd yyyy\");`\n`Year year = Year.parse(\"\
    Jan 22 2014\", formatter);`\n\n但这段代码无效：\n`DateTimeFormatter formatter = DateTimeFormatter.ofPattern(\"\
    MMM dd yyyy\");`\n`LocalDateTime ldt = LocalDateTime.parse(\"Jan 22 2014\", formatter);`\n\
    \n这会产生 `java.time.format.DateTimeParseException`，因为格式不包含时间信息，因此无法填充 `LocalDateTime`\
    \ 实例的所有字段。\n\n格式化是解析的逆过程。格式化的主要限制是模式只能包含与对象相关的元素。因此，以下代码是有效的：\n\n`LocalDate ld\
    \ = LocalDate.now();`\n`ld.format(DateTimeFormatter.ofPattern(\"yyyy MM\"));`\n\
    \n但以下代码会导致 `java.time.temporal.UnsupportedTemporalTypeException`：\n\n`LocalDate\
    \ ld = LocalDate.now();`\n`ld.format(DateTimeFormatter.ofPattern(\"yyyy MM dd\
    \ hh\"));`\n\n在这种特定情况下，我们正尝试格式化 `LocalDate` 的小时——这是可能的。\n\n还可以根据用户的区域默认设置来格式化日期。例如，以下代码将以特定区域的方式打印日期：\n\
    \n`LocalDate ld = LocalDate.now();`\n`ld.format(DateTimeFormatter.ofLocalizedDate(FormatStyle.SHORT));`\n\
    \n## 结论\n\n我个人很高兴看到 `Date and Time API` 被纳入语言中。虽然 `Joda` 库表现出色，但将其整合到核心语言是有好处的，因为使用日期和时间的库和框架更有可能为其提供支持。\n\
    \n"
- fmt: "\nFor instance, I typically use the `Hibernate` library to persist Java objects\
    \ to a relational database. Hibernate naturally needs to provide mappings for\
    \ Java Dates to database Dates. Although Joda support has been added through a\
    \ separate project, the Hibernate team’s effort naturally focused on the native\
    \ `java.util.Date` object. It is likely that in the future, similar projects would\
    \ focus on the objects in the Date and Time API.\n\n# Nashorn\n\nIt has been possible\
    \ to run JavaScript on the JVM for some time via the `Rhino` JavaScript engine.\
    \ Nashorn (pronounced Naz-horn) attempts to provide a higher performance JavaScript\
    \ engine, with more seamless integration between Java and JavaScript, and makes\
    \ JavaScript a first class language on the JVM.\n\nThe groundwork for Nashorn\
    \ was actually laid down in `Java 7` with the “InvokeDynamic” feature as a new\
    \ bytecode instruction. This feature made it simpler to write dynamically typed\
    \ languages in Java (which itself is a statically typed language).\n\nNashorn\
    \ supports the JavaScript specification `ECMA 5.1`.\n\n## Why would you want to\
    \ use JavaScript on the JVM?\n\nFirst off, you may not want to, in which case\
    \ you can ignore this feature. I am a big fan of JavaScript, and even I have not\
    \ decided if I will use JavaScript on the JVM. Interestingly, many of the other\
    \ developments in `Java 8` make me less likely to want to use JavaScript, since\
    \ they provide many of the language features I found missing in Java.\n\nThere\
    \ are however several situations where a case could be made for using a dynamic\
    \ language:\n\n- **Scripting**: there are many times where you want to perform\
    \ a fairly straightforward operation such as parsing and transforming a file.\
    \ It is typically a lot faster to write code such as this in a scripting language\
    \ than a language such as Java – at least it was before `Java 8` was released.\n\
    - **Prototyping**: it is often quicker to perform prototyping with a dynamic language\
    \ since it is not necessary to construct an entire type system before implementing\
    \ the details. It is also generally easier to change code in a language like JavaScript\
    \ – although with the lack of type safety this sometimes comes at a cost.\n- **Preference**:\
    \ you may simply prefer the syntax of JavaScript to Java. Some people are probably\
    \ rolling their eyes at this statement, but if you work through the bonus chapter\
    \ in Appendix A you may be surprised just how elegant code written in JavaScript\
    \ can be.\n- **Test JavaScript code**. Testing JavaScript code inside the browser\
    \ is not straightforward. Although there have been advances, particularly with\
    \ `Selenium WebDriver`, there are many cases where it would be good to be able\
    \ to test JavaScript code in a stand-alone environment using `JUnit`.\n- **Frameworks**:\
    \ You may wish to use a server-side JavaScript framework such as a JVM based version\
    \ of `Node.js`. This is probably the most likely reason I would run JavaScript\
    \ on the JVM.\n- **Reuse**: You want to utilize existing JavaScript code, but\
    \ run it on a common platform with Java code.\n\n## Getting Started\n\nIt is possible\
    \ to find out the scripting engines (and their languages) supported by your version\
    \ of Java with the following code:\n\n```java\npackage javascript;\n\nimport javax.script.ScriptEngineFactory;\n\
    import javax.script.ScriptEngineManager;\n\npublic class JavaScript {\n\n  public\
    \ static void main(String[] args) {\n\n    ScriptEngineManager m = new ScriptEngineManager();\n\
    \n    for (ScriptEngineFactory factory : m.getEngineFactories()) {\n      System.out.println(factory.getEngineName());\n\
    \      System.out.println(factory.getLanguageName());\n      System.out.println(\"\
    --------------------\");\n    }\n\n  }\n}\n```\n\nFor me, this printed the following:\n\
    \n```\nOracle Nashorn\nECMAScript\n--------------------\nAppleScriptEngine\nAppleScript\n\
    --------------------\n```\n\nIgnore the `AppleScriptEngine`, this is supported\
    \ due to the fact I am running on `OSX`, it is the `Nashorn` engine that we are\
    \ interested in here.\n\nAnd here is the simplest program we can write with the\
    \ `Nashorn` engine:\n\n```java\npackage javascript;\n\nimport java.util.logging.Level;\n\
    import java.util.logging.Logger;\nimport javax.script.ScriptEngine;\nimport javax.script.ScriptEngineManager;\n\
    import javax.script.ScriptException;\n\npublic class JavaScript {\n\n  public\
    \ static void main(String[] args) {\n    try {\n      ScriptEngineManager m =\
    \ new ScriptEngineManager();\n      ScriptEngine e = m.getEngineByName(\"nashorn\"\
    );\n      e.eval(\"print('Hello World!')\");\n    } catch (ScriptException ex)\
    \ {\n      Logger.getLogger(JavaScript.class.getName()).log(Level.SEVERE, null,\
    \ ex);\n    }\n  }\n}\n```\n\nNotice the line for obtaining a reference to the\
    \ `ScriptEngine`:\n\n`ScriptEngine e = m.getEngineByName(\"nashorn\");`\n\nThis\
    \ uses the short name of the engine, so it differs from the name seen above. We\
    \ then use the engine to evaluate a JavaScript statement:\n\n```javascript\nprint('Hello\
    \ World!')\n```\n\nThis statement uses the JavaScript engines `print` function\
    \ to print Hello World! to standard output.\n\nThe example above does not provide\
    \ any interaction between Java and JavaScript. The following is a slightly more\
    \ complex example. It creates a JavaScript function called `sum`, and then invokes\
    \ this by providing two Java variables, and then stores the result in another\
    \ Java variable.\n\n```java\npackage javascript;\n\nimport javax.script.Invocable;\n\
    import javax.script.ScriptEngine;\nimport javax.script.ScriptEngineManager;\n\n\
    public class JavaScript2 {\n\n  public static void main(String[] args) throws\
    \ Throwable {\n    ScriptEngineManager e = new ScriptEngineManager();\n    ScriptEngine\
    \ nashorn = e.getEngineByName(\"nashorn\");\n    nashorn.eval(\"function sum(a,\
    \ b) { return a+b; }\");\n    Invocable invocable = (Invocable) nashorn;\n   \
    \ Integer result = (Integer)invocable.invokeFunction(\"sum\", 20, 23);\n    System.out.println(result);\n\
    \  }\n}\n```\n\nNote that in order to run this example we need to specify that\
    \ the Nashorn `ScriptEngine` is an instance of `Invocable` – since this is not\
    \ a general requirement of `ScriptEngines`.\n\nIt is also possible to define a\
    \ JavaScript function as an instance of a specific interface. This allows the\
    \ code to be run without the `invokeFunction` method. For instance, consider the\
    \ following case that declares a JavaScript function is an implementation of `Runnable`,\
    \ and then passes it to a `Thread`:\n\n```java\npackage javascript;\n\nimport\
    \ javax.script.*;\n\npublic class JSInterfaces {\n\n  public static void main(String[]\
    \ args) throws Exception {\n    ScriptEngineManager e = new ScriptEngineManager();\n\
    \    ScriptEngine nashorn = e.getEngineByName(\"nashorn\");\n    String script\
    \ = \"function run() {print('This is running in a thread!'); }\";\n    nashorn.eval(script);\n\
    \    Invocable invocable = (Invocable) nashorn;\n    Runnable runnable = invocable.getInterface(Runnable.class);\n\
    \    Thread thread = new Thread(runnable);\n    thread.start();\n  }\n}\n```\n\
    \nNotice that the JavaScript function called `run` adheres to the `Runnable` interface.\n\
    \n## Executing a Script\n\nThe code examples in the previous section are not necessarily\
    \ examples you want to follow – writing code through String concatenation is error\
    \ prone. Generally you will create a script containing JavaScript code, and execute\
    \ this script from Java, potentially passing in variables to be used in the script.\n\
    \nI have created a file called `helpers.js` in the same package as my source code.\
    \ I have provided three simple utility methods in this, and a statement that invokes\
    \ one of these methods:\n\n```javascript\nfunction sum(a, b) {\n  return a + b;\n\
    }\n\nfunction multiply(a, b) {\n  return a * b;\n}\n\nfunction max(a, b) {\n \
    \ return Math.max(a, b);\n}\n\nprint(sum(100, 15));\n```\n\nThe functions are\
    \ all global functions, so can be invoked from any code when loaded. The statement\
    \ at the end calls the sum function and prints the results – and will execute\
    \ as soon as the script loads.\n\nBefore continuing – it is worth noting that\
    \ the `print` function is not supported by browser based JavaScript engines, or\
    \ where it is it does something completely different (sending the current page\
    \ to the printer).\n"
