    Java 8 添加了对名为 `Nashorn` 的 JavaScript 引擎的原生支持。`Nashorn` 从零开始编写，旨在与 Java 的动态语言支持协作，并取代了已经存在多年的
    `Rhino` JavaScript 引擎。


    你可能没有注意到，在过去的几年中，JavaScript 已经走出了浏览器，现在被广泛用作服务器端语言——最著名的通过 `node.js`。在 Java 平台上添加
    `Nashorn` 可能会在不久的未来带来有趣的进展，特别是对于服务器端计算。


    ## 一些惊喜


    在最初设计 Java 时，Sun 公司做出了有意识的决定，在 Java 中排除了多重继承。多重继承允许单个类继承自两个或多个类的功能。取而代之，Java 使用了接口（接口不能提供实现），并允许一个类实现多个接口。


    Java 忽略多重继承有许多原因，其中最著名的就是“菱问题”，当一个类从其父类继承同一个方法的不同实现时，就会出现这种问题。


    Java 8 通过在接口上引入 `default methods`（也称为防御性方法 defender methods），部分消除了对多重继承的限制。添加此功能的主要原因是
    Java 之前无法扩展任何核心语言接口，因为这会破坏实现这些接口的第三方现有代码。这一变化意味着许多现有的接口（如 `List` 和 `Set`）现在有了额外的方法。


    # 关于这本书


