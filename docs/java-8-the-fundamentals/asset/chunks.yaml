  trans: "\n\n- `anyMatch`: 接受一个 `Predicate`（谓词），如果任何一个元素通过谓词返回 true，则返回 true。\n-\
    \ `noneMatch`: 接受一个 `Predicate`（谓词），如果没有任何元素通过谓词返回 true，则返回 true。\n- `count`:\
    \ 统计流中元素的数量。\n\n## 创建流 (Creating Streams)\n\n到目前为止，我们关注的是如何从集合（Collections）创建流。事实上，有多种创建流的方法；由于它们仅仅是元素的流，可以由各种源产生。\n\
    \nStreams API 包含一个名为“范围”（range）的概念。范围允许 `Stream` 被构造为数字序列，例如：\n\n```\nIntStream.range(0,\
    \ 10).forEach(n -> System.out.println(n));\n```\n\n这生成了一个包含从 0 到 9 的数字的 `IntStream`。如果你希望范围包含最后一个数字（例如\
    \ 0 到 10），可以使用备选的 `rangeClosed` 方法。\n\n一旦创建了 `Stream`，就可以像任何其他 `Stream` 一样进行处理，因此范围为\
    \ for 循环提供了一种基于流的替代方案。\n\n创建流的另一种机制是通过构建器（builders）。以下是一个用于向流中添加三个字符串的构建器示例，然后调用\
    \ `forEach` 终端操作：\n\n```\nStream.builder().add(\"Hello\").add(\"World\").add(\"\
    !\").build()\n  .forEach(s -> System.out.print(s));\n```\n\n构建器是通过 `Stream` 上的静态方法获取的。一旦添加了所有元素，就会调用\
    \ `build()` 方法返回一个包含元素的 `Stream`。\n\n自然，`IntStream`、`LongStream` 和 `DoubleStream`\
    \ 支持相应的构建器，分别用于生成整数、长整数和浮点数的流。\n\n构造流的另一种方法是将两个流合并：\n\n```\nStream s1 = Stream.builder().add(\
    \ \"Hello\").add(\"World\").add(\"!\").build();\nStream s2 = Stream.builder().add(\
    \ \"Another\").add(\"Stream\").build();\nStream.concat(s1, s2).forEach(s -> System.out.print(s));\n\
    ```\n\n上面最后一行创建的流将处理 5 个元素。\n\n流也可以通过 `Random` 类上的静态辅助方法生成。`Random.ints()`、`Random.longs()`\
    \ 和 `Random.doubles()` 提供了返回无限量伪随机整数、长整数和浮点数流的机制（尽管值的数量可以通过可选参数进行限制）。也可以为数字定义范围；例如，我们可以如下请求一个\
    \ 0 到 100,000 之间的 100 个随机整数的 `Stream`：\n\n```\nRandom.ints(100, 0, 100000)\n```\n\
    \n自然，这些方法返回适用于相应数字类型的流，因此上面的示例返回一个 `IntStream`。\n\n然而，在集合之外，最实流源可能是从文件创建的流。\n\n\
    Java 7 引入了 `Files` 类，并包含一组静态辅助方法。该类在 Java 8 中得到了增强，包含了返回流的方法。为了直观看到效果，请先在你的文件系统上创建一个文本文件，并向其添加几行。\n\
    \n下面的示例展示了如何将该文件作为 `Stream` 读取，并使用我们上面过的过的操作对其进行处理：\n\n```java\npackage streams;\n\
    \nimport java.io.IOException;\nimport java.nio.file.*;\nimport java.util.logging.*;\n\
    \npublic class FileReading {\n    public static void main(String[] args) {\n \
    \       Path path = Paths.get(\"/tmp/test.txt\");\n        try {\n           \
    \ Files.lines(path).distinct()\n              .forEach(s -> System.out.println(s));\n\
    \        } catch (IOException ex) {\n            Logger.getLogger(FileReading.class.getName())\n\
    \              .log(Level.SEVERE, \"IO Error\", ex);\n        }\n    }\n}\n```\n\
    \n该程序寻找名为 `/tmp/test.txt` 的文件，并通过 `Files.lines()` 方法将其转换为 `Stream`（这假设默认字符编码为\
    \ UTF-8，但可以通过可选参数对其进行覆盖）。然后使用中间操作 `distinct` 移除重复行，并使用终端操作符 `forEach` 打印结果。\n\n\
    注意，这永远不需要将整个文件读取到内存中：它只需通过流水线一次处理一行（流式处理），然后移动到下一行。\n\n最后，可以使用 `Arrays` 上的静态辅助方法从数组生成\
    \ `Stream`。以下是一个非常简单的示例，打印数组中数字之和。由于数组类型为 `int`，返回的 `Stream` 是 `IntegerStream`，因此可以使用\
    \ `sum` 聚合操作：\n\n```java\npackage streams;\n\nimport java.util.Arrays;\n\npublic\
    \ class ArraysStream {\n    public static void main(String[] args) {\n       \
    \ int[] intArray = {4,2,5,7,66,4,3};\n        int result = Arrays.stream(intArray).sum();\n\
    \        System.out.print(result);\n    }\n}\n```\n\n## 并行编程 (Parallel Programming)\n\
    \n在本章开始时提到过，Streams API 旨在改变程序员思考并行的方式。到目前为止，我们还没有看到并行的证据：\n\n在查看并行化之前，最好先回顾一下并行处理有用的原因。由于现代计算机（甚至是智能手机）包含多个核心，任何没有执行并行计算（多线程处理）的程序实际上都没有充分利用硬件。\n\
    \n总来说，服务器端的 Java 框架（如 `EJB` 或 `Servlets`）允许程序员以最小的精力进行并行计算，因为服务器会管理线程。但在服务器服务器之外，程序员仍然负责指示计算机如何并行化算法。\n\
    \n### MapReduce\n\n在讨论 Streams API 用于并行的实现之前，值得回溯并查看一种极大影响这种编码风格的算法——MapReduce。MapReduce\
    \ 算法由 Google 研究人员通过 2004 年的一篇论文普及（[`research.google.com/archive/mapreduce.html`](http://research.google.com/archive/mapreduce.html)），但\
    \ map 和 reduce 操作已经存在很久得多。\n\nMapReduce 由两个主要操作组成：\n\n- 在 map 阶段（可以在许多机器上并行运行），列表中的每个元素根据需要进行过滤、转换或排序。这显然与我们在\
    \ Streams API 中过的中间操作有关。\n- 一旦 map 阶段完成，结果将传递给 reduce 阶段（可能也也可能并行运行）。reduce 阶段负责以某种方式聚合数据。这一步显然与我们在\
    \ Streams API 中过的终端操作有关。\n\n### Fork/Join API\n\n"
- fmt: "\nAs the previous section demonstrated, the key to processing large data sets\
    \ in a parallel manner is derived from splitting the data up (a process also known\
    \ as forking), and processing sub-sets of the data in parallel. Once this data\
    \ has been processed, it is joined back together (a process known as joining)\
    \ and aggregated in some manner. Fork and join are therefore akin to the terms\
    \ map and reduce.\n\nIt has been possible to write code in this manner since the\
    \ very first release of Java using `Threads`, and other threading concepts such\
    \ as the `synchronized` keyword. Writing multi-threaded code is difficult for\
    \ many programmers however, and error prone even for experienced programmers.\
    \ Concurrency issues and race conditions meant many programmers would rather avoid\
    \ multi-threaded code if possible.\n\nIn order to alleviate some of the inherent\
    \ problems with multi-threaded code, Java introduced a Fork/Join framework in\
    \ Java 7 (JSR-166). The key to this framework was the `ForkJoinPool` class. Using\
    \ the fork/join framework was a major advance: it essentially provided a pool\
    \ of worker threads who all competed to accept jobs – the programmer could simply\
    \ create jobs and have them processed in an efficient manner. It also provided\
    \ a set of management methods to monitor the behavior of the pool.\n\nEven with\
    \ the Fork/Join framework however, the programmer was still in control of the\
    \ threading process to some degree, and had to write algorithms in the manner\
    \ dictated by the Fork/Join API.\n\n## Parallelism with Streams\n\nThe Streams\
    \ API head in a different direction from the Fork/Join API (and all the other\
    \ concurrency APIs that have been added to Java since Java 5). The Streams API\
    \ takes the position that parallelism should be explicit – but non-intrusive.\
    \ You have to ask for parallelism but you do not actually have to do anything\
    \ in terms of implementing it.\n\nRequiring the programmer to ask for parallelism\
    \ is important, since the same program may behave differently when processed in\
    \ parallel – particularly when ordering is important. Once it has been asked for\
    \ however, the Java platform takes care of optimizing the algorithm across the\
    \ available hardware.\n\nIn order to see how simple it can be to change a Stream\
    \ from serial to parallel processing, the following line:\n\n```\nl.stream().filter(p\
    \ -> p%2==1).mapToInt(p -> p * p).sum()\n```\n\ncould be written:\n\n```\nl.parallelStream().filter(p\
    \ -> p%2==1).mapToInt(p -> p * p).sum()\n```\n\nNaturally, on a small list we\
    \ are unlikely to see any benefits from parallel processing, so let's try it out\
    \ on a more intensive example. The following program sets up a Stream of all the\
    \ positive integers, and then finds the average of the even numbers. The first\
    \ version uses a parallel implementation (the Stream returned from the range method\
    \ is turned into a parallel stream by invoking the parallel method). The second\
    \ version is serial.\n\n```java\npackage streams;\n\nimport java.util.OptionalDouble;\n\
    \nimport java.util.stream.IntStream;\n\npublic class LargeRange {\n  public static\
    \ void main(String[] args) {\n\n long start = System.currentTimeMillis();\n OptionalDouble\
    \ result = IntStream.range(0, Integer.MAX_VALUE)\n.parallel()\n.filter(i -> i\
    \ % 2 == 0)\n.average();\n\n System.out.printf(\"Parallel version took %d\\n\"\
    ,\n\n System.currentTimeMillis()-start);\n\n start = System.currentTimeMillis();\n\
    \n OptionalDouble result2 = IntStream.range(0, Integer.MAX_VALUE)\n.filter(i ->\
    \ i % 2 == 0)\n.average();\n\n System.out.printf(\"Serial version took %d\\n\"\
    ,\n\n System.currentTimeMillis()-start);\n }\n}\n```\n\nWhen I ran this on a reasonably\
    \ old MacBook Air I got the following results:\n\nParallel version took 4800 \n\
    Serial version took 9629\n\nUnsurprisingly, when I looked at CPU usage, the parallel\
    \ version was using twice as much CPU. Naturally, results may vary from machine\
    \ to machine, so try this out for yourself and take a look at the results.\n\n\
    The great thing about this example is that I have doubled performance by invoking\
    \ a single method.\n\nAlthough parallel processing is simply an option, it can\
    \ highlight issues that are not apparent in the same code when processed serially.\
    \ A prime candidate of this is where any of the lambda expressions passed to operations\
    \ in the pipeline have side effects: i.e. they mutate state that is used by other\
    \ lambda expressions.\n\nAs discussed above, mutating the state of an object in\
    \ lambda expressions is discouraged – but allowed. For instance, there is nothing\
    \ to stop code in the pipeline adding elements to a common Collection – this is\
    \ likely to cause problems when parallel processing is used however, since Collections\
    \ are not thread-safe.\n\nBefore considering parallelization, therefore, it is\
    \ worth asking the following questions:\n\n### Will parallel processing improve\
    \ performance?\n\nParallel processing will not necessarily improve performance.\
    \ Some operations, such as sorting and collecting, are not always quicker in parallel.\
    \ It is therefore always wise to benchmark algorithms in serial and parallel mode\
    \ to confirm that parallelism is actually providing benefits.\n\nIf you consider\
    \ the `groupingBy` examples above, these added all related elements to a common\
    \ `List`. Java Lists are not thread-safe, therefore the `groupingBy` method will\
    \ need to synchronize access to the `List`, and this could easily negate the benefits\
    \ of parallel processing.\n\nLikewise with sorting, it is possible to perform\
    \ parallel sorts: each thread can use an algorithm such as quicksort to process\
    \ a subset of the elements, and then these sets of sorted elements can be sorted\
    \ using merge sort: depending on the quantity of data, this will not necessarily\
    \ be quicker that performing a serial sort.\n\nFinally, the `distinct` operation\
    \ is another example of an operation that is hard to perform with parallel processing\
    \ – particularly in an unsorted set of data. Each thread can easily determine\
    \ the distinct elements amongst the data it has been asked to process – but naturally\
    \ these distinct sets from each thread would need to joined back together.\n\n\
    ### Can the algorithm be parallelized?\n\nNot all algorithms can be parallelized\
    \ without resulting in bugs. This is particularly common for reduce operations\
    \ - specifically, reduce operations need to be associative in order to be parallelizable.\n\
    \nAs an example, summing a list of numbers is always associative. This is because\
    \ it does not matter which order we process the numbers. If we have the numbers\
    \ 8, 6 and 3 we can sum these as `(8 + 6) + 3` or `8 + (6 + 3)`. No matter how\
    \ we add these numbers the result will be 17.\n\nOther reduce operations are not\
    \ associative. Subtraction, for instance, depends on the order of the elements\
    \ `(8 – 6) – 3 = -1` whereas `(3 – 8) – 6 = -11`.\n\nTo see this in action, consider\
    \ the following program:\n\n```java\npackage streams;\n\nimport java.util.OptionalInt;\n\
    \nimport java.util.stream.IntStream;\n\npublic class Associative {\n public static\
    \ void main(String[] args) {\n OptionalInt result = IntStream.range(1, 1000)\n\
    \ .parallel()\n .reduce((a, b) -> a-b);\n\n System.out.println(result.getAsInt());\n\
    \n result = IntStream.range(1, 1000)\n .reduce((a, b) -> a-b);\n\n System.out.println(result.getAsInt());\n\
    \ }\n}\n```\n\nIn both cases the Stream contains identical elements, and the reduce\
    \ operation contains an identical implementation, but the first reduce occurs\
    \ in the context of parallel processing. If I run this I get the following output.\n\
    \n-124\n-499498\n\nIf however I change this reduce operation to perform a sum:\n\
    \n`IntStream.range(1, 1000).reduce((a, b) -> a+b);`\n\nBoth examples produce identical\
    \ results:\n\n499500\n499500\n\nThis is dangerous: the compiler is not able to\
    \ detect that we are performing a non-associative operation; therefore we have\
    \ introduced a bug that is not easy to spot.\n\nThe point to learn from this is\
    \ that you should not introduce parallelism for the sake of it: you should decide\
    \ what you are trying to achieve with parallelism, and you should check that your\
    \ algorithm functions correctly as a parallel operation.\n"
