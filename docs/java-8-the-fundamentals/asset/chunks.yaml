  trans: "\n\n到目前为止我们看到的 lambda 表达式存在一个问题，即它们无法实现非常好的代码复用。上面的示例都是动态创建 lambda 表达式，并将其作为参数传递给其他方法。如果两个不同的类需要执行相同任务的\
    \ lambda 表达式，它们将需要各自构造自己的 lambda 表达式（从而导致了代码重复）。\n\n`Java 8` 中的 lambda 表达式 API\
    \ 提供了一种机制，可以将任何对象上的任何方法（或类上的静态方法）作为 lambda 表达式使用（受其访问修饰符限制），只要它符合所需的函数式接口。这一特性被称为自动生成接口，并通过一个名为“双冒号”的新操作符来实现。\n\
    \n让我们来看一个能找到的最简单的例子。假设我们想将列表中的每个元素传递给 `System.out.println` 方法。`println` 方法符合 `Consumer`\
    \ 函数式接口的要求（它接受一个参数并返回 `void`）；因此，它可以作为 `Consumer` 的实例使用：\n\n```java\npackage lambda;\n\
    \nimport java.util.Arrays;\nimport java.util.List;\n\npublic class Main3 {\n \
    \   public static void main(String[] args) {\n        List<String> l = Arrays.asList(\"\
    Hello\", \"World\", \"Print\", \"My\", \"List\");\n        l.forEach(System.out::println);\n\
    \    }\n}\n```\n\n这里的关键是 `System.out::println` 语句。本质上这表示变量 `out` 所代表的对象有一个名为 `println`\
    \ 方法，并且应该被用作 `forEach` 方法接受的 lambda 表达式。由于 `forEach` 接收一个 `Consumer`，因此在过程中 `println`\
    \ 方法被隐式地转换为 `Consumer` 类型的对象。\n\n如果我们回到从列表中删除偶数元素的例子：假设我们已经有了以下工具类：\n\n```java\n\
    package lambda;\n\npublic class Detector {\n    public boolean isEven(int i) {\n\
    \        return i%2 == 0;\n    }\n    public boolean isOdd(int i) {\n        return\
    \ !isEven(i);\n    }\n}\n```\n\n这是一个检测奇数和偶数的简单工具：它与 lambda 表达式无关，并且可能在 `Java 8`\
    \ 出现之前就已经了。我们可以如下重写过滤示例：\n\n```java\npackage lambda;\n\nimport java.util.Arrays;\n\
    import java.util.LinkedList;\nimport java.util.List;\n\npublic class Main4 {\n\
    \    public static void main(String[] args) {\n        Detector d = new Detector();\n\
    \        List<Integer> l = new LinkedList(Arrays.asList(4,5,88,76,55,23,7,20,45));\n\
    \        l.removeIf(d::isEven);\n        System.out.println(l);\n    }\n}\n```\n\
    \n或者，如果我们把 `isEven` 为静态方法，就可以执行：\n`l.removeIf(Detector::isEven);`\n\n这是一项非常有用的技术，这意味着现有代码可以被重用以适应它没有显式实现的接口。这意味着例如，任何零参数方法都可以被重用以实现\
    \ `Runnable` 接口并由 `Thread` 执行。\n\n对列表排序是非常常见的操作，由 `Comparator` 和 `Comparable`\
    \ 接口支持。我一直很困扰，`sort` 方法是 `Collections` 类上的一个静态辅助方法，而不是 `List` 类的方法。这可能是因为 `List`\
    \ 是一个 `Interface`（接口）而不是类，因此 `sort` 方法需要在每个 `List` 的实现上进行实现。\n\n正如我们后面看到的，这对于\
    \ `Java` 来说不再是一个限制，因此 `Java` 在 `Java 8` 中通过 `List` 上的 `sort` 方法纠正了这种情况（尽管它是一个接口），并在过程中将\
    \ `Comparator` 变成了函数式接口。\n\n为了演示这一点，我们将创建一个非常简单的 `Person` 类：\n\n```java\npackage\
    \ lambda;\n\npublic class Person {\n    String firstName,lastName;\n    public\
    \ Person(String firstName, String lastName) {\n        this.firstName = firstName;\n\
    \        this.lastName = lastName;\n    }\n    public String getFirstName() {\n\
    \        return firstName;\n    }\n    public String getLastName() {\n       \
    \ return lastName;\n    }\n    @Override\n    public String toString() {\n   \
    \     return firstName + \" \" + lastName;\n    }\n}\n```\n\n我们现在可以创建一个 `Person`\
    \ 实例列表，并按照 `firstName` 对其进行排序，如下：\n\n```java\npackage lambda;\n\nimport java.util.Arrays;\n\
    import java.util.List;\n\npublic class Main5 {\n    public static void main(String[]\
    \ args) {\n        List<Person> l = Arrays.asList(\n            new Person(\"\
    Albert\", \"Smith\"),\n            new Person(\"Jim\", \"James\"),\n         \
    \   new Person(\"John\", \"Brown\"),\n            new Person(\"William\", \"Hughes\"\
    ),\n            new Person(\"Simon\", \"Fleming\")\n        );\n        l.sort((p1,\
    \ p2) -> p1.getFirstName().compareTo(p2.getFirstName()));\n        System.out.println(l);\n\
    \    }\n}\n```\n\n语句：\n`(p1, p2) -> p1.getFirstName().compareTo(p2.getFirstName())`\n\
    在这个过程中，它隐式地构建为 `Comparator` 类型的对象。\n\n注意此处的 `sort` 操作是会变的：它改变了原始列表，而不是返回一个带有新元素的新列表。\n\
    \n使用匿名类（功能等效）的代码可读性如下：\n\n```java\nl.sort(new Comparator<Person>() {\n    @Override\n\
    \    public int compare(Person p1, Person p2) {\n        return p1.getFirstName().compareTo(p2.getFirstName());\n\
    \    }\n});\n```\n\n## 作用域\n\n正如我们在上面看到的，lambda 表达式可以使用创建时在作用域内的变量。但有一个例外——只要这些变量不改变值，就可以使用它们。\n\
    \n例如，考虑以下函数式接口：\n\n```java\npackage lambda;\n\n@FunctionalInterface\npublic interface\
    \ NumberAdder {\n    int add(int x);\n}\n```\n\n这有一个名为 `add` 的方法，接受一个整数并返回一个整数。\n\
    \n我们现在如下创建一个返回 `NumberAdder` 的方法：\n\n```java\npublic static NumberAdder getNumberAdder()\
    \ {\n    int startingNumber = 10;\n    return x -> x + startingNumber;\n}\n```\n\
    \n该方法声明了一个局部变量 `startingNumber`，然后返回 `NumberAdder` 的实例。\n\n在正常情况下，`startingNumber`\
    \ 会在方法完成时被销毁（记住局部变量存在于栈上，并在方法完成时从栈中弹出）。但在 lambda 表达式的情况下，变量在方法完成时仍然存在。这里是调用方法的完整类：\n\
    \n```java\npackage lambda;\n\npublic class Main6 {\n    public static void main(String[]\
    \ args) {\n        NumberAdder na = getNumberAdder();\n        System.out.print(na.add(20));\n\
    \    }\n    public static NumberAdder getNumberAdder() {\n        int startingNumber\
    \ = 10;\n        return x -> x + startingNumber;\n    }\n}\n```\n\n运行此代码，它将打印\
    \ 30。以这种方式使用变量的 lambda 表达式被称为“捕获 lambda”，因为它们捕获了构造时作用域内的变量副本。\n\n为了让这个小魔法生效，`startingNumber`\
    \ 变量必须是 `final` 或“有效 final”。即使是以下代码也是无效的且无法编译：\n\n```java\npublic static NumberAdder\
    \ getNumberAdder() {\n    int startingNumber = 10;\n    startingNumber++;\n  \
    \  return x -> x + startingNumber;\n}\n```\n\n“有效 final”这个词是一个新术语。本质上，这意味着变量的行为就像\
    \ `final` 一样，尽管它不需要被标记为 `final`。基本上，如果一个变量在加上 `final` 修饰符后无效，那么它对于 lambda 表达式的使用也是无效的。\n\
    \n这一限制是有争议的，它是为了减少由于修改变量可能引起的并发问题而引入的。在 Java 8 之前，你永远不会遇到局部变量的线程问题：简单来说，两个线程共享同一个局部变量实例是不可能的，因为它们是在方法内部创建的，而调用相同方法的两个线程将接收各自独立的变量副本。\n\
    \n"
- fmt: "\nIf lambda expressions could change a local variable, and two methods invoked\
    \ the lambda expression from two separate threads at the same time, a whole new\
    \ set of concurrency issues would have been introduced to the language.\n\nIt\
    \ is of course possible to work around this constraint (just as it is possible\
    \ to work around the constraints on final variables) by encapsulating the integer\
    \ as a field inside an object. It would then be possible to change the value of\
    \ this field even after the lambda expression was created. This could be achieved\
    \ by creating the following class:\n\n```java\npackage lambda;\n\npublic class\
    \ IntegerHolder {\n\n  public int number = 10;\n\n}\n```\n\nAnd changing the main\
    \ class as follows:\n\n```java\npackage lambda;\n\npublic class Main7 {\n\n  public\
    \ static void main(String[] args) {\n\n  NumberAdder na = getNumberAdder();\n\n\
    \  System.out.print(na.add(20));\n\n  }\n\n  public static NumberAdder getNumberAdder()\
    \ {\n\n  IntegerHolder ih = new IntegerHolder();\n\n  ih.number = 10;\n\n  NumberAdder\
    \ na = x -> x + ih.number;\n\n  ih.number = 20;\n\n  return na;\n\n  }\n\n}\n\
    ```\n\nIn this case, the `ih` variable is effectively final, since we do not change\
    \ the object referenced after the variable is initialized. We do however change\
    \ the number held by the object after creating the lambda expression.\n\nIn this\
    \ case the result of the operation is 40, since when the lambda expression is\
    \ invoked, the value of the `number` field had been changed to 20.\n\nThis approach\
    \ does naturally open the code up to the concurrency issues that the specification\
    \ was trying to avoid through the use of final variables, and therefore should\
    \ not be seen as a feature.\n\n## Conclusion\n\nAs you have seen, lambda expressions\
    \ provide a mechanism for constructing anonymous methods and passing them as parameters\
    \ to other methods.\n\nThe debate around lambda expressions in the Java community\
    \ has seemed endless. Not only was their release delayed from `Java 7` to `Java\
    \ 8`, there has been a huge amount of debate and criticism of them.\n\nEven now\
    \ that they have been included there is an argument in some circles that lambda\
    \ expressions are “syntactic sugar” – they are simply an alternative way of implementing\
    \ an interface, and therefore are no different from pre-Java 8 anonymous and local\
    \ classes.\n\nYou can make an argument about any programming language or programming\
    \ language construct that it is just syntactic sugar on top of some other construct\
    \ (such as assembler, and ultimately machine code), since there is nothing that\
    \ can be achieved in a high level language such as `Java` that could not be achieved\
    \ in assembler or machine code. The point is, languages such as `Java` provide\
    \ a more convenient mechanism for a human to describe a set of tasks to a computer.\
    \ In the same way, lambda expressions will make it a lot easier for a lot of Java\
    \ programmers to describe tasks to the Java compiler.\n\nAlthough lambda expressions\
    \ do not allow you to do anything you could not have done without them, they have\
    \ the ability to change the way you think about solving problems in `Java`. This\
    \ theme will be carried through to the next chapter on the `Streams API`: since\
    \ this is where lambda expressions shine brightest.\n\n# Streams API\n\n`Java\
    \ 8` introduces a new API called the `Streams API` as part of the lambda expressions\
    \ JSR. These should not be confused with input and output streams; they are a\
    \ mechanism for processing a sequence of elements (such as the elements in a `Collection`).\
    \ `Java 8` formally defines streams as “a sequence of elements supporting sequential\
    \ and parallel aggregate operations.”\n\nAs we will see later in the chapter,\
    \ the `Streams API` is part of a push to simplify the way parallel algorithms\
    \ can be implemented in `Java` by allowing programmers to request parallel processing\
    \ rather than implementing it. Streams are a lot more than that however, they\
    \ provide an alternative to iteration, and provide support for a variety of operations,\
    \ all of which can utilize lambda expressions.\n\nWe will begin with some very\
    \ basic Streams examples, returning to my favorite of excluding even numbers from\
    \ a `List`. This can be accomplished as follows:\n\n```java\npackage streams;\n\
    \nimport java.util.Arrays;\n\nimport java.util.List;\n\npublic class EvenOnly\
    \ {\n\n  public static void main(String[] args) {\n\n  List<Integer> l = Arrays.asList(5,4,88,76,55,23,7,20,45);\n\
    \n    l.stream().filter(p -> p%2==1)\n    .forEach(i -> System.out.print(i+\"\
    \ \"));\n\n  }\n\n}\n```\n\nAfter creating the list we first access its stream\
    \ with the `stream()` method. This returns an object of type `java.util.stream.Stream<Integer>`.\
    \ We will look at what streams are in more detail soon, but for now just think\
    \ of them as a way of conveying elements from a source of data (i.e. the `List`)\
    \ to a function (i.e. `filter`).\n\nThis code “internally iterates” over every\
    \ element in the list (as seen in the previous chapter with `forEach`), and passes\
    \ each element in turn to the `filter` method. This is opposed to “external iteration”\
    \ with `for` loops and iterators, since the programmer does not need to declare\
    \ the fact they wish to process each element in the loop, and they do not need\
    \ to control the iteration.\n\nExternal iteration may not seem like a huge inconvenience\
    \ that needs to be alleviated – especially since the introduction of the `Collection`-based\
    \ `for` loops. Internal iteration can bring unseen benefits, however, since it\
    \ may implement different strategies to iterate different collections, therefore\
    \ allowing behavior to be added implicitly (such as parallel processing).\n\n\
    The `filter` method is referred to as an intermediate operation. As each element\
    \ is processed, those that pass the filter are then passed to the `forEach` method,\
    \ which is a terminal operation.\n\nThe type returned by the `filter()` method\
    \ is itself a `Stream`, and therefore it is possible to chain a whole set of intermediate\
    \ operations together into a “pipeline”. Pipelines are facilitated by the fact\
    \ that the output of one operation becomes the input of another.\n\nPipelines\
    \ are widely used in computing: for instance the Unix/Linux command line supports\
    \ pipelines where the output of one program is passed as the input to another\
    \ via the `|` operator. For instance, this finds any processes running for the\
    \ user that contain “java” in their name:\n\n```\nps | grep 'java'\n```\n\nThe\
    \ convention in Unix that allows this is that programs produce ASCII text to standard\
    \ output, and other programs read ASCII text from standard input. The pipe operation\
    \ therefore pipes the standard output of one program to the standard input of\
    \ another.\n\nAs we will see throughout this chapter, pipelines provide a mechanism\
    \ for describing a complex set of functionality in easy to understand chunks.\n\
    \nTerminal operators (as their name suggests) represent the end of a pipeline,\
    \ and they are responsible for terminating the stream in some manner. `forEach`\
    \ is not the most obvious example of a terminal operation, but it provides a manner\
    \ of accessing all the elements after they have been processed by the pipeline,\
    \ and performing some operation on them (printing them out in this case). You\
    \ will notice that the `forEach` method returns `void`, therefore the pipeline\
    \ cannot continue after this method has been invoked.\n\nUnlike the `removeIf`\
    \ method seen earlier, this pipeline does not alter the original `Collection`\
    \ in any way: it simply provides a mechanism for processing its elements.\n\n\
    With the example above, the first element in the `List` (5) is passed to the lambda\
    \ expression of the `filter` method, and is evaluated to true (it is odd). As\
    \ a result, this element is passed to the lambda expression of the `forEach` method,\
    \ which causes the number to be printed.\n\nOnce the element has been all the\
    \ way through the pipeline, the next number (4) is processed. Since the `filter`\
    \ lambda expression will return false for this number it will never be passed\
    \ to the `forEach` lambda expression, and so on.\n"
