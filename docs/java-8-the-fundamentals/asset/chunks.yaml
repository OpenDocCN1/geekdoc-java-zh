    \ Suppose we just wanted to find the first odd number in this list. This can be\
    \ achieved with an alternative terminal operation called findFirst:\n\npublic\
    \ static void main(String[] args) {\n\n List<Integer> l = Arrays.asList(5,4,88,76,55,23,7,20,45);\n\
    \n Stream<Integer> s = l.stream().filter(p -> {\n\n System.out.println(\"Filter\
    \ called on \"+ p);\n\n return p%2==1;\n\n });\n\n Optional<Integer> result =\
    \ s.findFirst();\n\n System.out.println(result.get());\n\n}\n\nThis example prints\
    \ the following result:\n\nFilter called on 5\n\n5\n\nSince the first element\
    \ in the list was odd, this was the only element that needed to be processed.\n\
    \nThere is one other interesting aspect to this example. Rather than returning\
    \ an Integer, the findFirst method returned an Optional<Integer>. You will find\
    \ references to the Optional class throughout the Streams API: it provides a container\
    \ for a value that may be null. This class supports a method called isPresent\
    \ to determine whether the container holds a non-null value.\n\nThe Optional class\
    \ also supports methods such as map and filter that allow the value to be modified\
    \ via lambda expressions if required. There is also nothing to stop you returning\
    \ Option instances from your own code, and it may prove a useful mechanism for\
    \ extending the value of your APIs.\n\nThere are a couple more points to make\
    \ about Streams before continuing. Firstly, once a stream has processed its elements\
    \ it cannot be reused. For instance, in the example above we could not have invoked\
    \ an alternative terminal operation on the Stream returned by filter after the\
    \ forEach operation had been executed. Technically streams can be closed, but\
    \ there is no reason to explicitly close them.\n\n Secondly, Streams must be non-interfering:\
    \ they cannot change the source of the Stream (the list in the example above).\n\
    \nWe will now turn to a slightly more complicated example, and demonstrate how\
    \ a pipeline can include multiple intermediate steps. Suppose we want to do the\
    \ following:\n\n• Filter the even numbers out of the list\n\n• Multiply each remaining\
    \ number by itself\n\n• Sum the numbers together\n\nIn this case, the first two\
    \ steps will be the intermediate operations, while the sum operation will be the\
    \ terminal operation. This can be achieved as follows:\n\ndouble result = l.stream()\n\
    \n.filter(p -> p%2==1)\n\n.mapToInt(p -> p * p)\n\n.sum()\n\nThe filter method\
    \ above should look familiar, and since it returns a Stream<Integer> we can obviously\
    \ execute other intermediate operations on the result.\n\nThe next intermediate\
    \ operation that is executed is mapToInt. This is slightly different from the\
    \ filter operation: it provides a way of transforming data. The lambda expression\
    \ passed to mapToInt accepts any type of object as input, and returns an integer\
    \ as a result. In this case the input parameter is also a integer, but that is\
    \ not required: we could have passed a Person object as the parameter, and returned\
    \ the salary field (if that was a integer).\n\nThe lambda expression passed to\
    \ mapToInt is simply multiplying the input parameter by itself and implicitly\
    \ returning the result.\n\nThe other interesting thing about mapToInt is that\
    \ instead of returning an object of type Stream<Integer>, it actually returns\
    \ an instance of IntegerStream. The difference may sound small, but IntegerStream\
    \ provides a set of specialized terminal operations designed to work with integer\
    \ values, including min, max, average, and the method we are using here: sum.\n\
    \nThe Streams API also supports DoubleStreams (via mapToDouble) and LongStreams\
    \ (via mapToLong). These have the same set of aggregate operations seen on IntegerStream.\n\
    \nStreams also support a general-purpose map operation for transforming objects\
    \ of any type to any other type, but this method simply returns a Stream<T> where\
    \ T is the return type of the map operation.\n\nThe sum method is a type of terminal\
    \ operation known as a reducing operation: it takes a set of values and reduces\
    \ them to an aggregate value. We could have implemented the reduce method ourselves\
    \ if we chose:\n\nl.stream()\n\n.filter(p -> p%2==1)\n\n.mapToInt(p -> p * p)\n\
    \n.reduce((a, b) -> a + b)\n\nThe reduce algorithm starts by passing the first\
    \ two elements in the list to the lambda expression provided. The result of this\
    \ operation is then passed to the lambda expression along with the third element,\
    \ and so on until the elements have all been processed. The following is a print\
    \ out of the values passed to the reduce lambda expression:\n\na = 25, b = 3025\n\
    \na = 3050, b = 529\n\na = 3579, b = 49\n\na = 3628, b = 2025\n\n(There are 5\
    \ odd numbers, so the expression is invoked 4 times).\n\nThe reduce method returns\
    \ an instance of OptionalInt, since the filter method could have potentially removed\
    \ all elements from the Stream.\n\nThe reduce operation accepts a lambda expression\
    \ conforming to the BinaryOperator functional interface. This interface has a\
    \ method that accepts two parameters and returns a single parameter of the same\
    \ type:\n\n[R](http://download.java.net/jdk8/docs/api/java/util/function/BiFunction.html\
    \ \"type parameter in BiFunction\") apply([T](http://download.java.net/jdk8/docs/api/java/util/function/BiFunction.html\
    \ \"type parameter in BiFunction\") t, [U](http://download.java.net/jdk8/docs/api/java/util/function/BiFunction.html\
    \ \"type parameter in BiFunction\") u)\n\nWe could therefore have reused one of\
    \ the new static helper methods added to Integer (and the other number wrapper\
    \ types) in Java 8:\n\npublic static int sum(int a, int b)\n\nAs follows:\n\n\
    l.stream()\n\n.filter(p -> p%2==1)\n\n.mapToInt(p -> p * p)\n\n.reduce(Integer::sum)\n\
    \nNotice that the sum method is static, therefore we don’t need an instance of\
    \ Integer to invoke the sum method.\n\nThe reduce operation can also accept an\
    \ optional first parameter representing the initial value of the aggregation:\n\
    \nl.stream()\n\n.filter(p -> p%2==1)\n\n.mapToInt(p -> p * p)"
