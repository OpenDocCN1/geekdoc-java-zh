  trans: "\n接口现在也可以提供静态方法——在此之前它们只能定义静态字段。接口上的静态方法看起来与类上的静态方法完全相同：\n\n```java\npackage\
    \ defaultmethods;\n\npublic interface A {\n\n  public default void doSomething()\
    \ {\n    System.out.println(\"I am A\");\n  }\n\n  public static void staticMethod()\
    \ {\n    System.out.println(\"I am a static method\");\n  }\n}\n```\n\n在接口中添加静态方法没有默认方法（default\
    \ methods）那样有争议，因为静态方法不存在继承的概念。事实上，在 `Interface` 只包含静态方法的情况下，它们的工作效果非常好，因为很明显它不应该被实例化——在以前人们通常使用抽象类来实现这一目的。\n\
    \n## 结论\n\n很难知道默认方法将在多大范围内被使用。显然，它们在允许你在不破坏向后兼容性的情况下扩展遗留接口方面提供了巨大的优势，但它们真的应该在新代码中广泛使用吗？特别是，你什么时候应该使用抽象类，而什么时候应该使用默认方法？\n\
    \n这是一个很难回答的问题，但可能最简单的回答方法是思考你需要实现的功能：如果它依赖于对象的状态，那么你就必须使用抽象类；如果它是行为性的，并且从参数中接收所有相关数据，那么既可以使用抽象类也可以使用接口。\n\
    \n如果默认方法是一个选项，那么考虑这个问题的下一个方法是回顾你实现接口的情况，并被迫实现某些与当前任务不直接相关的方法，或者具有明显的默认实现的方法。如果你检测到此类情况，你应该考虑在你的接口中提供默认方法。\n\
    \n思考这个问题的另一种方式是考虑你创建的抽象类，由于单继承限制，这些类无法被其他类轻松使用。这通常发生在某个类是工具类时，因此使用它的代码可能不想直接扩展它（因为它已经扩展了另一个类）。\n\
    \n这引出了我们对**混入（mixins）**的话。混入是一个包含其他类方法组合的类。当你想要提供许多可选方法时——或者当你希望一个方法在许多类中可用时，它们可能特别有用。混入之所以得名，是因为它们将不同类的功能混合到单个类中。\n\
    \n作为混入的例子，考虑一种情况：我们有一个名为 `Car` 类和另一个名为 `Person` 类。我们可以创建一个名为 `CarDriver` 的混入，将这两个实现结合起来，并提供一个代表\
    \ `Person` 驾驶 `Car` 的实现。这将使得 `Person` 上定义的任何方法（例如 `getName`）都可以与 `Car` 上的方法（如\
    \ `getMake`）一起，同时允许添加其他功能（例如 `getOwningPeriod`）。\n\n混入在 Java 8 中仍然具有局限性，因为它们无法访问状态，但如果相关功能是行为性的，就可以创建它们。考虑一种情况：你有许多不同的类来处理不同类型的文件（XML\
    \ 文件、CSV 文件、文本文件），并且每个类都定义在单独的接口中，使用不同的方法签名。如果这些接口使用了默认方法，那么就可以将它们混合到一个类中，该类可以执行对任何类型文件的处理。\n\
    \n# Java 日期/时间 API\n\n日期和时间似乎是一个简单的话题。人们每天都会使用日期和时间，直到开始在软件中使用它们时，你才真正开始思考它们到底有多复杂。\n\
    \n我假设你已经足够熟悉 Java，足以理解在处理日期时可能发生的复杂性，特别是当考虑到闰年、夏令时时间和时区等概念时。\n\n更糟糕的是，Java 中表示日期和时间的核心类（`java.util.Date`）并不是该语言最大的成就。该类一直追溯到\
    \ JDK 1.0，从那以后几乎没有改进（尽管修复了千千年漏洞）。仅仅读一下 Java 文档的前几行就会让你问：为什么，为什么，为什么？\n\n- 年份 `y`\
    \ 由整数 `y` - 1900 表示（2014 年表示为 114 - 为什么不是 2014 呢？）\n- 月份由 0 到 11 的整数表示；0 是 1 月，1\
    \ 是 2 月，以此此类推；因此 11 是 12 月。（为什么不是 1-12？为什么不引入枚举类型？）\n- 日期（月份中的一天）以通常的方式由 1 到 31\
    \ 的整数表示（为什么不像月份一样从 0 开始计数呢？）\n\nJava 在 JDK 1.1 中引入了 `Calendars`（日历）的概念来缓解 `Date`\
    \ 类的一些问题，并废弃了 `Date` 中的大量功能。尽管如此，Java 中对日期和时间的整个处理一直有点笨拙。日期操作在 Java 中特别令人痛苦，需要不断地在\
    \ `Dates` 和 `Calendars` 之间来回。\n\n由于 Java 语言本身的缺陷（无论是感知到的还是事实），Joda 开源库多年来通过提供日期和时间的替代实现而继续流行。\n\
    \nJava 最终决定在 `Date/Calendar API` 旁边提供一个类似于 Joda 的 API：这被称为日期和时间 API (JSR 310)。\n\
    \n如果你对现有的 `Date/Calendar API` 满意，你可以继续使用它。如果你对 Joda 作为一个独立库感到满意，你可以继续使用它。如果你想使用新的日期和时间\
    \ API，你可以使用它。选择权在于你。\n\n如果本章提供整个日期和时间 API 的概述，它很快就会变得非常无聊，并包含大量的重复。因此，本章将尝试阐述\
    \ API 的核心原则：一旦理解了这些原则，就可以将其扩展到其他任务中。\n\n日期和时间 API 设计用于考虑表示日期和时间的两种方式：\n\n- 人类角度：它使用熟悉的月份、天数和时长的概念。\n\
    - 机器角度：它衡量从纪元（epoch）以来经过的时间。\n\n在处理日期和时间 API 时，你可以从以下选项中选择最符合你需求的日期和时间实现：\n\n\
    - `LocalDate`：表示日期的年、月、日部分，独立于任何时区。这对于表示此类日期非常有用，因为无论你在美国、澳大利亚还是英国，12 月 25 日都是节日。\n\
    - `LocalTime`：它本质上类似于 `LocalDate`，但它只表示时间，例如 12:55:21（时间始终精确到纳秒）。\n- `LocalDateTime`：它与\
    \ `LocalDate` 相同，但包含了时间信息。\n- `ZonedDateTime`：它与 `LocalDateTime` 相同，不同之处它包含相对于\
    \ UTC 时间的时区偏移（例如 -05:00）和一个时区 ID（例如 America/Detroit）。\n- `OffsetDateTime`：它与 `ZoneDateTime`\
    \ 相同但不包含时区 ID，它只包含偏移量。\n- `OffsetTime`：它类似于 `OffsetDateTime`，但只包含日期的时间部分，例如 13:00:21+12:00\n\
    - `Year`：它仅包含日期的年份部分\n- `Month`：它是表示 12 个月份的枚举类型。\n- `MonthDay`：它表示一天和一个月份，因此可以用于以不感知年份的方式表示一年中的某一天。\n\
    - `YearMonth`：如预期的，它包含年份和月份。\n- `DayOfWeek`：它是表示每周 7 天的枚举类型。\n"
- fmt: "\n- **Instant**: an instant represents the number of nanoseconds that have\
    \ occurred between 1/1/1970 and an instance in time. Due to the fact this is a\
    \ number larger than can be accommodated by a long, the seconds since 1/1/1970\
    \ are stored in a `long`, and the nanoseconds offset are stored in an `int`.\n\
    - **Duration**: a duration is an amount of time that has elapsed between two `Instants`.\
    \ Like `Instant`, the duration is recorded in terms of seconds and nano-seconds.\n\
    - **Period**: a period is a date based amount of time. This records a duration\
    \ in terms of years, months and days.\n\nNow that the basic types have been introduced\
    \ it is worth jumping in and looking at some examples. Although the classes are\
    \ quite different in the way they represent date and time, they tend to support\
    \ a standard set of methods; these methods will be introduced below. The first\
    \ example will deal with the `LocalDateTime` class and examine some of the ways\
    \ it can be constructed and manipulated:\n\n```java\npackage datetime;\n\nimport\
    \ java.time.LocalDateTime;\n\nimport java.time.ZoneOffset;\n\npublic class DateTime\
    \ {\n\n public static void main(String[] args) {\n\n LocalDateTime dt = LocalDateTime.now();\n\
    \n System.out.println(dt);\n\n System.out.println(dt.getMonth());\n\n System.out.println(dt.getDayOfWeek());\n\
    \n dt = dt.plusDays(2);\n\n   System.out.println(dt.getDayOfWeek());\n\n dt =\
    \ dt.plusHours(5).plusMinutes(10);\n\n System.out.println(dt);\n\n System.out.println(dt.atOffset(ZoneOffset.ofHours(-11)));\n\
    \n dt = dt.minusWeeks(20);\n\n System.out.println(dt);\n\n  dt = dt.withDayOfMonth(4)\
    \ .withYear(2009);\n\n System.out.println(dt);\n\n }\n}\n```\n\nThis produced\
    \ the following result:\n\n2014-03-06T19:38:34.933\n\nMARCH\n\nTHURSDAY\n\nSATURDAY\n\
    \n2014-03-09T00:48:34.933\n\n2014-03-09T00:48:34.933-11:00\n\n2013-10-20T00:48:34.933\n\
    \n2009-10-04T00:48:34.933\n\nThis short example demonstrates a number of useful\
    \ methods. For a start, there is a `now()` method for creating a `LocalDateTime`\
    \ representing the current date and time:\n\n```java\nLocalDateTime dt = LocalDateTime.now();\n\
    ```\n\nThere are also a variety of methods for accessing a specific portion of\
    \ the date or time (such as the year or month). You may recall that these methods\
    \ were deprecated from `java.util.Date`, but are available in a similar form on\
    \ `java.util.Calendar`:\n\n```java\ndt.getMonth()\n\ndt.getDayOfWeek()\n```\n\n\
    Next, there are a wide array of methods for adding or subtracting units of time\
    \ (e.g. weeks, years, hours) from a `LocalDateTime`. Since `LocalDateTime` is\
    \ immutable, these always return a new instance of `LocalDateTime`. These are\
    \ somewhat similar to the methods on `java.util.Calendar`, but cover a wider array\
    \ of options, and, unlike `Calendar`, do not mutate the date object:\n\n```java\n\
    dt.plusDays(2)\n\ndt.plusHours(5).plusMinutes(10)\n```\n\nAn alternative way of\
    \ manipulating a `LocalDateTime` is with the methods prefixed “with”, e.g. `withMonth`,\
    \ `withYear`. These methods also return a new `LocalDateTime`, manipulated to\
    \ have the appropriate unit set to the value specified in the request:\n\n```java\n\
    dt.withDayOfMonth(4).withYear(2009)\n```\n\nFinally, there are ways to convert\
    \ this type of date object into other types of date, the example shows `atOffset`,\
    \ but `atZone` is also supported:\n\n```java\ndt.atOffset(ZoneOffset.ofHours(-11))\n\
    ```\n\nIn addition to creating a `LocalDateTime` with the static `now()` method,\
    \ the static `of()` method can be used. For example:\n\n```java\nLocalDateTime\
    \ dt = LocalDateTime.of(2014, Month.MARCH, 3, 12, 24, 33);\n```\n\nThis method\
    \ is overloaded, so you can choose how precise you want the value to be by optionally\
    \ providing seconds and nanoseconds.\n\n`LocalDateTime` instances can also be\
    \ parsed from a textual String (this will be examined in more detail later):\n\
    \n```java\nLocalDateTime.parse(\"2014-03-20T20:12:33\", DateTimeFormatter.ISO_DATE_TIME);\n\
    ```\n\nFinally, they can be generated from a different type of date/time object:\n\
    \n```java\nLocalDateTime.from(Instant.now());\n```\n\nNow that we have briefly\
    \ introduced some of the methods that can be used for creating and manipulating\
    \ Date and Time objects, it is worth focusing on a couple of principles used by\
    \ the API:\n\n### Chaining methods\n\nMost of the classes in the time package\
    \ support chaining. Chaining is a technique whereby the output of one method call\
    \ becomes the input for another method call. We have already seen examples of\
    \ this earlier in the book with the intermediate operations on the Streams API.\
    \ Chaining works on the principle that the return type of a method is the type\
    \ the original method was invoked on (either “this” or a new instance of the type\
    \ the method was invoked on).\n\nThe following are examples of chaining:\n\n```java\n\
    dt.withDayOfMonth(4).withYear(2009)\n\ndt.plusHours(5).plusMinutes(10)\n```\n\n\
    ### Immutable objects\n\nThe classes defined in the Dane and Time API are immutable.\
    \ This means that once their value is set it can never be changed. Even when their\
    \ value appears to change Java is actually creating a new instance of the object.\n\
    \nThere has been a move towards immutable classes in Java since they tend to be\
    \ easier to use in multi-threaded environments, and also lead to better practices\
    \ in general, since the state of a variable will not be modified without the knowledge\
    \ of one of its references. For instance, consider the following code from the\
    \ `Calendar` API:\n\n```java\nCalendar c = new GregorianCalendar();\n\nCalendar\
    \ c2 = c;\n\nc.add(Calendar.DATE, 1);\n```\n\nThe value in the `Calendar` referenced\
    \ by `c2` is changed without its knowledge. This situation can never occur with\
    \ the Date and Time API.\n\n## Year and MonthDay\n\nLet's now look at a different\
    \ set of examples with the `Year` and `MonthDay` classes (remember, these only\
    \ deal with a subset of the fields needed to fully represent a date):\n\n```java\n\
    package datetime;\n\nimport java.time.Month;\n\nimport java.time.MonthDay;\n\n\
    import java.time.Year;\n\npublic class YearMonth {\n\n public static void main(String[]\
    \ args) {\n\n Year y = Year.now();\n\n System.out.println(y.isLeap());\n\n System.out.println(y.isBefore(Year.of(2013)));\n\
    \n System.out.println(y.isAfter(Year.parse(\"2013\")));\n\n MonthDay md = MonthDay.of(Month.FEBRUARY,\
    \ 29);\n\n System.out.println(md.atYear(2011));\n\n System.out.println(md.isValidYear(2012));\n\
    \n System.out.println(md.isValidYear(2013));\n\n }\n}\n```\n\nThis produces the\
    \ following result:\n\nfalse\n\nfalse\n\ntrue\n\n2011-02-28\n\ntrue\n\nfalse\n\
    \nAs you can see, different classes in the Date and Time API sometimes support\
    \ additional methods. The `Year` class supports an `isLeap()` method that indicates\
    \ if the year specified is a leap year, while the `MonthDay` class supports an\
    \ `isValidYear` method to indicate if the day and month represent a valid date\
    \ in a particular year.\n\nAll date/time classes also support `isBefore` and `isAfter`\
    \ methods for comparing instances of the same type.\n\n## Instant\n\nAs mentioned\
    \ above, an `Instant` represents a point in time, and is stored as a `long` and\
    \ `int` pair, representing the number of nanoseconds that have passed since 1\
    \ January 1970 (midnight UTC).\n\nAs it happens, timekeeping in nanoseconds is\
    \ surprisingly complex. Seconds are defined via atomic clocks: such seconds are\
    \ referred to as SI seconds. There are very close to 86400 SI seconds in a day\
    \ (24 x 60 x 60).\n\nUnfortunately the devil is in the detail – very close is\
    \ not the same as exactly. To make matters worse, not all days are exactly the\
    \ same length, and the length of a day is not predictable. Although the variants\
    \ are tiny, they do add up after time, therefore UTC incorporates a concept called\
    \ leap-seconds. These allow a day to have 86399 SI seconds or 86401 SI seconds,\
    \ rather than the 86400 SI seconds expected.\n\nDue to these complexities, the\
    \ designers of the Date and Time API decided to create their own time-scale called\
    \ the Java Time-scale. This time-scale always has 86400 seconds in a day – but\
    \ each second may not be the same length as an SI second. This allows Java to\
    \ reflect the tiny changes in the length of each day without moving away from\
    \ the simplicity of 86400 seconds in a day.\n"
