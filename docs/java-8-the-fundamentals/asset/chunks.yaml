    \n[http://www.amazon.com/Software-Engineer-Learns-JavaScript-jQuery-ebook/dp/B00GAMTRI8/ref=sr_1_2?s=digital-text&ie=UTF8&qid=1394932033&sr=1-2](http://www.amazon.com/Software-Engineer-Learns-JavaScript-jQuery-ebook/dp/B00GAMTRI8/ref=sr_1_2?s=digital-text&ie=UTF8&qid=1394932033&sr=1-2)\n\
    \nJavaScript made me look at Java in a new light. It also provides an interesting\
    \ take on lambda expressions, and therefore learning how these work in another\
    \ language will help you understand the concepts in a broader context.\n\n# Appendix\
    \ A: JavaScript\n\nThis section will provide an in-depth overview of JavaScript,\
    \ including its strengths and weaknesses. The intention of this chapter is to\
    \ provide you a strong understanding of JavaScript fundamentals, and to focus\
    \ on how the language should be used, rather than how it can be used.\n\nJavaScript\
    \ is a particularly flexible language, and does not enforce much discipline or\
    \ structure on its users. In addition, JavaScript contains a number of features\
    \ than can only truly be regarded as bugs. These remain in the language principally\
    \ due to backwards compatibility concerns.\n\nIn order to write large-scale web\
    \ applications it is necessary to harness the strengths of JavaScript, while at\
    \ the same time avoiding the pitfalls that can easily confront software engineers\
    \ and programmers who do not understand the language fundamentals, and do not\
    \ structure their applications in a manner compatible with the growth of the code\
    \ base.\n\nIn order to follow the examples in this book, simply open the Chrome\
    \ or Firefox console, and enter the commands directly - I recommend Chrome.\n\n\
    In order to access the Chrome interpreter, simply open Chrome, and type:\n\n• Command+Option+i\
    \ on OSX\n\n• F12 or Ctrl+Shift+I on Windows\n\nAlternatively, you can right click\
    \ anywhere on any web page and choose “Inspect Element”:\n\n![](images/00002.jpeg)\n\
    \nOnce the Developer Tools are open, click the “Console” tab.\n\nIn order to prove\
    \ that this is a genuine JavaScript interpreter, simply type 1+1 at the command\
    \ prompt:\n\n![](images/00003.jpeg)\n\nOne aspect of browsers that have advanced\
    \ tremendously over the last few years are the tools offered to developers. Browser\
    \ vendors have realized that there is a direct benefit to them when developers\
    \ use their browsers, and therefore actively woo developers with the tools they\
    \ offer. This book will introduce you to many of the features offered by the Chrome\
    \ developer tools, but it is worth investigating the various capabilities on your\
    \ own."
