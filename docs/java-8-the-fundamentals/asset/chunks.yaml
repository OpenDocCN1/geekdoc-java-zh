  trans: "\n除非你刻意想要比较两个已知数据类型不同的值，否则始终使用这些等等运算符是最佳实践。\n\n如果你想知道任何值在布尔意义上是真还是假，可以在该值前面加上\
    \ `!!` 来将其打印出来。单个 `!` 会对布尔值进行取反，而 `!!` 则提供了双重否定，从而打印出任何值的布尔值：\n\n```\n!!\"\"\n\
    false\n!!\"hello\"\ntrue\n```\n\n### 动态类型\n\n最后，值得重申的是，JavaScript 是一种动态类型语言。\n\
    \n`Java` 和 `C++` 等语言是静态类型语言。在静态类型语言中，所有变量在编译时都会被分配类型，且该类型无法更改。\n\n`strong`（强）和\
    \ `weak`（弱）类型有时分别用来指静态类型语言和动态类型语言。\n\n在静态类型语言中，编译器可以执行类型检查：如果一个变量定义为存储整数，编译器可以检查它没有被赋值为字符串。这在问题变成运行时之前捕捉到了许多错误的原因。\n\
    \n正如我们所看到的，JavaScript 变量的类型取决于它们在运行时被赋值的值，如果变量被赋值了新值，它们的类型就可以改变。因此，在 JavaScript\
    \ 中无法进行静态类型检查，例如无法确保在期望数字的地方没有提供字符串。\n\n考虑以下两个数字相加的函数：\n\n```javascript\nfunction\
    \ add(v1, v2) {\n  return v1+v2;\n}\n```\n\n如果你用两个数字调用此函数，结果如预期所示：\n\n`add(1,1)`\n\
    `2`\n\n然而，如果你不小心将字符串作为参数之一传递，结果将非常不同：\n\n`add(1,\"1\")`\n`\"11\"`\n\nJavaScript\
    \ 并没有相加数字，而是在数字和字符串之间执行了字符串拼接。这可能是预期的结果。这就是为什么 `typeof` 运算符在 JavaScript 中如此重要的原因之一，它允许将上述函数重写如下：\n\
    \n```javascript\nfunction add(v1, v2) {\n  if (typeof v1 === \"number\" && typeof\
    \ v2 === \"number\") {\n    return v1+v2;\n  } else {\n    throw \"both arguments\
    \ must be numbers\";\n  }\n}\n```\n\n这至少确保了数据类型问题会在运行时被识别，即使它没有向编写代码的程序员指出这些问题，导致函数被错误地调用。\n\
    \n在不同的数据类型上使用 `+` 运算符会在 JavaScript 中产生各种随机结果：\n\n`{} + [] = 0`\n`[] + {} = Object`\n\
    \n即使在相同的数据类型上使用 `+` 运算符也可能产生意义的结果：\n\n`[] + [] = empty string`\n`{} + {} = NaN`\n\
    \n很难理解这些结果中的任何一个。\n\n此外，`-` 运算符应该只用于数字：\n\n`“a” + 1 = “a1\"`\n`“a” – 1 = NaN`\n\
    \n关于动态类型语言有很多支持和反对的观点。本书将不会讨论这些观点，但可以得出一个结论：动态类型有优势，但这些优势伴随着运行时 bug 的风险。\n\n###\
    \ 对象\n\nJavaScript 也支持对象；事实上，JavaScript 应用中的大多数值都是对象。JavaScript 还支持定义类的语法，对象可以从这些类中实例化。这可能会让你认为\
    \ JavaScript 是一门传统的面向对象语言——这是一个错误。\n\n在 `Java` 和 `C#` 等经典的面向对象语言中，必须在从类中实例化对象之前定义类。不可能创建一个不属于特定类类型的对象。\n\
    \n类是静态模板，包含了对象将包含的属性和方法的定义。在程序执行期间，会创建这些类的实例：被称为对象。从同一个类实例化的所有对象具有相同的属性和方法，尽管赋值给属性的值在实例之间会有不同。\n\
    \n使用经典的面向对象语言设计应用时，你可能会发现某些情况，你希望某些对象包含额外的属性或方法，尽管它们在其他方面与由现有类创建的对象相似。例如，你可能从一个名为\
    \ `Vehicle` 的类开始，它包含以下属性：\n\n1. 注册号\n2. 初始注册年份\n3. 车辆品牌\n4. 车辆型号\n\n可以从该类实例化对象，并将包含四个可以赋值的属性。\n\
    \n本书将使用 `property`（属性）一词指代对象的状态。其他语言可能称这些字段（fields）或属性（attributes）。\n\n你随后可能决定想要获取更多关于卡车的信息，例如：\n\
    \n1. 轴数\n2. 牵引能力\n\n你不能简单地向从 `Vehicle` 类创建的对象添加这些新属性；你必须先创建一个新类（称为 `Truck`），并扩展\
    \ `Vehicle` 类。只有当类结构建立后，你才能开始创建 `Truck` 的实例。\n\n类的进一步特性是，它们必须在应用程序编译时定义；它们不能在运行时动态定义。不可能在程序执行途中决定你想开始为某些对象捕捉额外的属性。\n\
    \nJavaScript 对类和对象有灵活得多的态度，事实上，类对于 JavaScript 编程来说完全不是必需的。\n\n在 JavaScript 中创建新对象的最简单方法如下：\n\
    \n`obj = {}`\n\n`typeof` 运算符确认 `obj` 变量确实是一个对象：\n\n`typeof obj`\n`\"object\"`\n\
    \n如果你熟悉经典的面向对象语言，你可能会想 `obj` 是什么类型？这个对象不是任何类型；它只是一个对象。\n\n在不知道类型的情况下编写代码可能很困难。例如，如果给函数传递一个对象而不知道它的类型，它该如何处理它呢？\n\
    \nJavaScript 使用了一种俗称为“鸭子类型”（duck typing）的方法。有一句老话说走得像鸭子，游得像鸭子，叫得像鸭子，它可能是一只鸭子”。同样，在\
    \ JavaScript 中我们可能会说“如果有注册号属性，拥有注册年份属性，它可能是一辆车”。\n\n一个没有任何属性或方法的空对象是没有没用的。但在 JavaScript\
    \ 中，可以动态添加属性和方法：\n\n```javascript\nobj.firstName = 'John';\nobj.lastName = 'Smith';\n\
    obj.age = 32;\nobj.increaseAge = function() {\n  this.age++;\n}\n```\n\n对象内部的函数被称为方法。它们与函数完全相同，区别在于处理名为\
    \ `this` 的重要变量的方式。你可能已经注意到上面方法使用了 `this`：这将在下面详细解释。\n\n如果你现在在 JavaScript 控制台中查看该对象，你会发现它有一组分配了值的的属性：\n\
    \n```\nobj\nObject {firstName: \"John\", lastName: \"Smith\", age: 32, increaseAge:\
    \ function}\n```\n\n之所以之所以可能，是因为 JavaScript 中的对象实际上只是关联数组（在其他语言中称为哈希映射）。关联数组在大多数编程语言中都是原生支持的，由名称/值对组成。\n\
    \n为了访问 JavaScript 对象上的属性，只需使用以下表示法：\n\n`obj.firstName`\n`\"John\"`\n\nJavaScript\
    \ 支持另一种访问和设置属性的语法，这种语法更像其他语言中的关联数组。\n\n`obj['firstName']`\n`\"John\"`\n\n这些方法并不完全等价。第二种方法在属性名不是有效的变量名时有效。而点符号在以下情况下不起作用：\n\
    \n• 属性以数字开头。\n• 属性包含空格或其他下划线或 $ 符号以外的特殊字符。\n\n"
- fmt: "\n- The property name is one of the language keywords.\n\nIf you are writing\
    \ code that needs to handle any property name, including ones you had no say in\
    \ defining, the square brackets notation should be preferred.\n\nIn addition to\
    \ properties, the example above provides an example of a method being added to\
    \ an object. The method `increaseAge` increments the `age` property by 1: it can\
    \ be invoked as follows:\n\n```\nobj.increaseAge()\nobj.age\n33\n```\n\nI alluded\
    \ to the use of the `this` variable inside the method:\n\n```javascript\nobj.increaseAge\
    \ = function() {\n  this.age++;\n}\n```\n\nThis is the only thing that separates\
    \ a function from a method: in a method the special variable `this` refers to\
    \ the object itself, and therefore:\n\n`this.age`\n\nis a way of accessing the\
    \ `age` property on the object. As we will see in future sections, `this` takes\
    \ on several different meanings depending on context. Understanding the meaning\
    \ of `this` in these different contexts is one of the keys to understanding JavaScript.\n\
    \nAlthough it is possible to construct objects without any reliance on classes,\
    \ it is probably obvious that we are also missing out on the benefits that classes\
    \ bring.\n\nIf you want to create a new object to refer to a different person,\
    \ you need to add these properties and methods all over again. This is not a major\
    \ problem for the properties of an object, since you would need to provide values\
    \ for those properties anyway, but it is a major inconvenience for methods. For\
    \ instance, you would need to write the following:\n\n```javascript\nobj2 = {}\n\
    obj2.firstName = 'Albert'\nobj2.lastName = 'Jones'\nobj2.age = 28\nobj2.increaseAge\
    \ = function() {\n  this.age++;\n}\n```\n\nAn alternative approach is to include\
    \ the properties and methods inside the `{}` separating properties/methods with\
    \ commas, and properties/methods from their values with colons:\n\n```javascript\n\
    obj2 = {\n  firstName: 'Albert',\n  lastName: 'Jones',\n  age: 28,\n  increaseAge:\
    \ function() {\n    this.age++;\n  }\n}\n```\n\nThis is going to become a major\
    \ inconvenience, especially if you have a large number of methods on your object.\n\
    \nThere is a solution to this problem that does not rely on reverting to classes:\
    \ you could simply clone an existing object, and change its properties as required.\
    \ The object being cloned can be referred to as a prototype for other objects.\n\
    \nWe will see in later chapters that jQuery contains a helper for cloning objects,\
    \ but for now we will write our own clone implementation. This function will perform\
    \ a deep clone on an object: if a property on an object contains a value that\
    \ is an object, that object will also be cloned.\n\n```javascript\nfunction clone(obj)\
    \ {\n  if (obj == null || typeof obj != 'object') {\n    return obj;\n  }\n  var\
    \ newObj = {}\n  for (var key in obj) {\n    newObj[key] = clone(obj[key]);\n\
    \  }\n  return newObj;\n}\n```\n\nThis function uses the `for (var key in obj)`\
    \ loop to iterate through all the properties on an object. This is a special kind\
    \ of JavaScript loop specifically provided to iterate through properties in an\
    \ object. If the value of the property is an object, it is recursively passed\
    \ to the `clone` function. If it is a simple type (such as a number or string)\
    \ it is returned immediately so it can be set directly on the new instance of\
    \ the object. You will remember from earlier sections that strings and numbers\
    \ are immutable; therefore they do not need to be cloned.\n\nThis implementation\
    \ should reinforce to you how simple JavaScript objects are.\n\nThere are potential\
    \ problems with this implementation that have been ignored for simplicity. This\
    \ implementation should not be used in real applications: use versions provided\
    \ in the jQuery or Underscore libraries.\n\nYou can now use this function to construct\
    \ a new object for storing information about people:\n\n```javascript\nobj3 =\
    \ clone(obj2)\nobj3.firstName = 'Jim'\n\"Jim\"\nobj3.firstName = 'Duffey'\n\"\
    Duffey\"\nobj3.age = 42\nobj3.increaseAge()\n43\n```\n\nAs you can see we have\
    \ retained the method already defined on its prototype.\n\nThis section is not\
    \ intended to imply classes have no value in JavaScript, instead it is intended\
    \ to demonstrate what objects truly are in JavaScript, and to suggest that there\
    \ are viable ways of writing JavaScript that does not utilize classes.\n\nThere\
    \ are potential pitfalls in this implementation. For instance, if you forget to\
    \ set a property on the newly cloned object, it will retain the value from the\
    \ object it was cloned from: this may or may not be correct, and could become\
    \ a source of bugs.\n\nAlthough we will examine more advanced approaches to object\
    \ creation below, the approach to objects examined in this section has a lot to\
    \ recommend it.\n\n## JavaScript Object Notation\n\nThe previous section demonstrated\
    \ how simple JavaScript objects are. At heart, JavaScript objects are simple associative\
    \ arrays. Each property in the object can have a value that is a simple type (such\
    \ as a number or a string), a function, an array, or another type of object.\n\
    \nWhen writing web-based applications it is often necessary to send data from\
    \ the client to the server, or the server to the client. In order to transfer\
    \ data across a network it must be encoded in a data format agreed by both the\
    \ sender and the receiver.\n\nThere are many data formats that can be used to\
    \ send and receive data; of these XML is probably the most common. An example\
    \ XML document for representing people might look as follows:\n\n```xml\n<person>\n\
    \  <firstName>John</firstName>\n  <lastName>Smith</lastName>\n  <age>32</age>\n\
    \  <address>\n    <city>Los Angeles</city>\n    <postCode>90245</postCode>\n \
    \ </address>\n</person>\n```\n\nXML is a widely used data format, particularly\
    \ in enterprise applications. It has many benefits, including a wide array of\
    \ libraries that support it and widespread acceptance in IT departments. XML is\
    \ a particularly verbose data format however, in the example above far than 75%\
    \ of the text is made up of tags rather than content.\n\nBefore gaining an understanding\
    \ of JSON, first consider what a JavaScript object may look like contained this\
    \ same data:\n\n```javascript\nperson = {};\nperson.firstName = 'John';\nperson.lastName\
    \ = 'Smith';\nperson.age = 32;\nperson.address = {};\nperson.address.city = 'Los\
    \ Angeles';\nperson.address.postCode = 90245;\n```\n\nThe example above consists\
    \ of two objects. The first object is a person; this then contains a second object\
    \ that captures the address information.\n\nIt would not be difficult to create\
    \ an object from the XML. There is however a data format that is far more aligned\
    \ with JavaScript called the JavaScript Object Notation (JSON) that makes this\
    \ process trivial.\n\nYou can transform this object into a JSON encoded string\
    \ as follows:\n\n```javascript\nJSON.stringify(person)\n\"{\"firstName\":\"John\"\
    ,\"lastName\":\"Smith\",\"age\":32,\"address\":{\"city\":\"Los Angeles\",\"postCode\"\
    :90245}}\"\n```\n\nThe output of this function call is a string, and could be\
    \ assigned to a variable:\n\n```javascript\ns = JSON.stringify(person)\n```\n\n\
    A string can then be transformed back into an object as follows:\n\n```javascript\n\
    person2 = JSON.parse(s)\n```\n\nThe process of converting between a string and\
    \ an object is called serializing and de-serializing: the string is a serialized\
    \ form of the object.\n\nThis process is only applicable for properties: methods\
    \ are not retained when an object is serialized.\n\nJSON is a remarkably simple\
    \ data format. The entire data format is contained in a couple of paragraphs at\
    \ the following web site:\n\n[http://www.json.org/](http://www.json.org/)\n\n\
    There are 3 types of value in JSON:\n\n1. **Objects**, denoted with the now familiar\
    \ curly brackets\n2. **Arrays**, which are denoted by [] brackets, and contain\
    \ comma separated values just like JavaScript arrays.\n3. **Literal values** (strings,\
    \ numbers, Booleans)\n\nAn object or an array can in turn contain any of these\
    \ 3 types. For instance, an array may contain an object, an object may contain\
    \ an array, an object may contain another object, etc.\n"
