    # Introduction


    I first learned Java in the late-1990s using `Java 1.1`. Back then there was a
    great sense of excitement about Java. Not only did it support a Write-Once Run-Anywhere
    philosophy, it embraced the Internet, and provided native support for networking,
    threading, and the much hyped Applet technology. In fact, it is worth reiterating
    the five primary goals of the Java language:


    • It should be "simple, object-oriented and familiar"

    • It should be "robust and secure"

    • It should be "architecture-neutral and portable"

    • It should execute with "high performance"

    • It should be "interpreted, threaded, and dynamic"


    A lot has changed since I first learned Java. Computers have become vastly more
    powerful, and data sets have become orders of magnitude larger. Java has kept
    pace with many of these changes very well, and still remains perhaps the most
    widely used programming language in commercial environments, particularly for
    server-side development. It has also maintained a dynamic and wide-ranging presence
    in the open source world, and has been incorporated into other technologies from
    Android to Salesforce.


    Despite this, aspects of Java have begun to feel dated when compared to many newer
    (or newly rediscovered) languages. There have been few major enhancements to the
    Java language since Generics were introduced in `Java 5` (way back in 2004). A
    common refrain in recent years is “Java is the new Cobol” – widely used but not
    widely loved. I don’t personally buy into this mantra: Java supports a set of
    frameworks, libraries and tools second-to-none, particularly for server-side computing
    - but Java does lack the expressiveness found in many other languages.


    Java 8 is the biggest change to Java in at least the last 10 years, and possibly
    since its inception. It incorporates a number of features that have been consistently
    requested for years (most notably lambda expressions), and is an effort to maintain
    Java’s relevance in a world of multi-cored machines by adding additional support
    for parallelism: in fact parallel computing is the driving force behind most of
    the changes in Java 8 (at least from Oracle’s point of view).


    The sections below guide you through the core themes of Java 8. Later chapters
    will then introduce the features added to Java 8 in relation to these themes.


    ## Functional Programming


    Functional programming is a programming paradigm where algorithms are implemented
    via functions that accept values and return values in return. It is a style of
    programming that avoids state, and avoids mutation of data – the result of a function
    depends entirely on its inputs. To put this another way, the same inputs always
    produces the same results.


    I didn’t fully appreciate what Java was missing until I learned JavaScript (properly)
    in the last few years, as documented in my book “A Software Engineer Learns HTML5,
    JavaScript and jQuery”. Before learning JavaScript I had a reasonably low opinion
    of the language, largely based on experiences of trying to shoehorn its syntax
    into Java style programs.


    Learning JavaScript properly showed me how powerful functional programming concepts
    can be even in a language embracing imperative and object-orientated programming
    paradigms. I was not completely unfamiliar with functional programming, but had
    not used functional programming techniques in my commercial work since leaving
    University.


    I wasn’t the only one who noticed the value of functional programming techniques
    of course. For many years there has been a concerted push behind the idea of adding
    functional programming features (lambda expressions or closures) to the Java language,
    and this has even led to the creation of several new languages on the JVM, most
    notably Scala.


    Java 8 provides a significant new feature called “lambda expressions”. These are
    essentially anonymous methods that can be constructed on the fly, assigned to
    variables, and passed to other methods as parameters. These have been embedded
    into the language, with many existing APIs being extended to provide support for
    lambda expressions.


    Java 8 is not suddenly trying to become the equivalent of pure functional languages
    such as Haskell or LISP: it is attempting to add a new paradigm alongside its
    object-orientated paradigm. The introduction of lambda expressions are non-intrusive
    in the sense you can choose to ignore them if you want, but I hope after working
    through the examples in this book you appreciate their place in the language,
    and the elegance of code utilizing them.


    ## Parallelism


    Another major change that has occurred in computing since I began with Java is
    the requirement to process larger and larger datasets, and to do so in a multi-threaded
    manner. Google has probably done more than most to popularize approaches to large
    datasets, notably with the MapReduce algorithm (which has already been implemented
    in Java in the form of Hadoop).


    Java 8 sees the addition of several features, most notably the Streams API, designed
    to simplify the process of dealing with large data sets, and to allow programmers
    to request parallelism rather than explicitly implement themselves.


    The principles behind these features are good, however they cannot entirely hide
    the complexities of parallelism, and failing to understand the new features can
    lead to significant issues. This book will work through the Streams API in depth,
    and assess where parallel processing can, and cannot be used.


    ## Making up for old mistakes


    The Java Date API has been consistently criticized for many years. Just a short
    look through the list of deprecated methods on `java.util.Date` leaves you in
    no doubt mistakes were made.


    One of the great things about Java is that when the official language makes mistakes,
    the open source community fixes them through libraries. In the case of date and
    time, the Joda time library has filled the gap. As often happens (especially in
    the Java EE world), Java has been more than happy to learn from the success of
    others, and has incorporated a new Date/Time API based on Joda in Java 8.


    The existing Date and Calendar API remains unchanged, and you can continue to
    use that if you wish, or use it in conjunction with the new Date/Time API.


    ## Dynamic Languages


    Java added explicit support for dynamic languages in Java 7 with the `InvokeDynamic`
    instruction. As a result, the Java runtime now supports a wide array of dynamic
    languages. Implementing a language on the Java platform brings great benefits
    for the language (since it gets access to all the libraries and frameworks in
    the Java ecosystem), but also brings great benefits to the Java as well.

