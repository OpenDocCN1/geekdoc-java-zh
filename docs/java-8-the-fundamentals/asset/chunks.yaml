  trans: "\n\n上述所有示例仅代表了可能性——这些注解实际上并不存在。然而，这一变化在未来确实有可能为 Java 带来重大的改进，就像最初引入注解带来了巨大的益处一样。\n\
    \n## 反射变化\n\nJava 8 对 `Java Reflection API`（Java 反射 API）提供了一项微小的增强。现在可以提取方法的参数名称：以前只能提取它们的类型——这在很多时候让我觉得很困扰。\n\
    \n```java\nClass<String> clz = String.class;\n\nfor (Method m : clz.getDeclaredMethods())\
    \ {\n  System.out.println(m.getName());\n  for (Parameter p : m.getParameters())\
    \ {\n    System.out.println(p.getName());\n  }\n}\n```\n\n为了使用此功能，需要使用 `javac`\
    \ 命令行选项 `–parameter` 对源代码进行编译。这确保了适当的信息被添加到到类文件中。\n\n## 数学变化\n\n我们已经看到，原始包装类（例如\
    \ `Integer`、`Long`）添加了新的静态方法，这些方法以前仅作为 `Math` 类中的静态辅助方法可用：\n\n- `Min`\n- `Max`\n\
    \n对于这些方法来说，这里是一个更自然的位置，但为了向后兼容，它们仍然可以在 `Math` 类中可用。\n\n`Math` 类本身现在也包含了许多新的静态方法。其中大部分是现有方法的变体，但如果它们发生溢出（超过了数据类型的容量），则会抛出\
    \ `ArithmeticException`。这通常更有用，因为溢出很少是我们想要的功能。\n\n- [`Math.addExact(int, int)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#addExact(int,%20int))\n\
    - [`Math.addExact(long, long)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#addExact(long,%20long))\n\
    - [`Math.subtractExact(int, int)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#subtractExact(int,%20int))\n\
    - [`Math.subtractExact(long, long)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#subtractExact(long,%20long))\n\
    - [`Math.multiplyExact(int, int)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#multiplyExact(int,%20int))\n\
    - [`Math.multiplyExact(long, long)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#multiplyExact(long,%20long))\n\
    - [`Math.negateExact(int)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#negateExact(int))\n\
    - [`Math.negateExact(long)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#negateExact(long))\n\
    - [`Math.decrementExact(int)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#decrementExact(int))\n\
    - [`Math.decrementExact(long)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#decrementExact(long))\n\
    - [`Math.incrementExact(int)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#incrementExact(int))\n\
    - [`Math.incrementExact(long)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#incrementExact(long))\n\
    \n`BigInteger` 和 `BigDecimal` 也提供了对应的方法来将值转换回原始类型：\n\n- [`longValueExact()](http://download.java.net/jdk8/docs/api/java/math/BigInteger.html#longValueExact())\n\
    - [`intValueExact()](http://download.java.net/jdk8/docs/api/java/math/BigInteger.html#intValueExact())\n\
    - [`shortValueExact()](http://download.java.net/jdk8/docs/api/java/math/BigInteger.html#shortValueExact())\n\
    - [`byteValueExact()](http://download.java.net/jdk8/docs/api/java/math/BigInteger.html#byteValueExact())\n\
    \n这是感知是否发生溢错误的一种有用方法，因此这些变体应该优于它们非精确的兄弟方法。\n\n## 字符串变化\n\nJava 8 终于添加了 `join`\
    \ 方法用于在 `Strings` 之间添加分隔符：\n\n```java\nString.join(\", \", \"Hello\", \"World\"\
    , \"Again\");\n```\n\n这将产生：\n\nHello, World, Again\n\n第一个参数充当分隔符，而其余参数是要连接到该参数的\
    \ `Strings`。\n\n它可以可选地接受一个 `List`：\n\n```java\nList<String> list = Arrays.asList(\"\
    Hello\", \"World\", \"Again\");\nSystem.out.println(String.join(\", \", list));\n\
    ```\n\n正如我们在书前面的部分看到的，相同的基本功能可以使用 `Streams` 和连接收集器（join collector）来实现。\n\n类似的功能在一个名为\
    \ `StringJoiner` 的新类中可用，它还允许提供前缀和后缀 `String`：\n\n```java\nStringJoiner sj = new\
    \ StringJoiner(\",\", \"{\", \"}\");\nsj.add(\"Test1\").add(\"Test2\").add(\"\
    Test3\");\nString s = sj.toString();\n```\n\n这产生如下结果：\n\n{Test1,Test2,Test3}\n\
    \n# 结\n\n我希望这本书虽然很短，但已经让你确信 Java 8 不仅仅是另一个 Java 版本，并且可以从更好的方面影响程序员思考算法的方式。Lambda\
    \ 表达式引入 Java 语言已经很久，尽管并不是所有人对它的实现细节认同，但大多数人同意 Java 8 中包含的版本比没有 lambda 表达式要得多。\n\
    \nJava 8 还具有极大增强应用程序多线程能力的潜力，但正如看到的，如果不完全理解其原理，实现并行处理仍然存在风险。\n\n正如前面提到的，下一节包含了来自我的书籍《软件工程师学\
    \ JavaScript 和 jQuery》的额外章节。如果你喜欢这个章节并想了解更多，可以在亚马逊或其他在线零售商购买：\n\n[`www.amazon.com/Software-Engineer-Learns-JavaScript-jQuery-ebook/dp/B00GAMTRI8/ref=sr_1_2?s=digital-text&ie=UTF8&qid=1394932033&sr=1-2`](http://www.amazon.com/Software-Engineer-Learns-JavaScript-jQuery-ebook/dp/B00GAMTRI8/ref=sr_1_2?s=digital-text&ie=UTF8&qid=1394932033&sr=1-2)\n\
    \n"
- fmt: "\nThis section will provide an in-depth overview of JavaScript, including\
    \ its strengths and weaknesses. The intention of this chapter is to provide you\
    \ a strong understanding of JavaScript fundamentals, and to focus on how the language\
    \ *should* be used, rather than how it *can* be used.\n\nJavaScript is a particularly\
    \ flexible language, and does not enforce much discipline or structure on its\
    \ users. In addition, JavaScript contains a number of features than can only truly\
    \ be regarded as bugs. These remain in the language principally due to backwards\
    \ compatibility concerns.\n\nIn order to write large-scale web applications it\
    \ is necessary to harness the strengths of JavaScript, while at the same time\
    \ avoiding the pitfalls that can easily confront software engineers and programmers\
    \ who do not understand the language fundamentals, and do not structure their\
    \ applications in a manner compatible with the growth of the code base.\n\n##\
    \ Types\n\nAny understanding of JavaScript begins with an understanding of its\
    \ data types, and how these types are used.\n\nJavaScript has the following data\
    \ types:\n\n• String\n• Number\n• Boolean\n• Null\n• Undefined\n• Object\n\nEach\
    \ of these will be outlined in the sections below.\n\n### Strings\n\nStrings are\
    \ series of characters enclosed in either single or double quotes:\n\n```\n\"\
    hello world\"\n\"hello world\"\n'hello world'\n\"hello world\"\n```\n\nThe examples\
    \ above are referred to as string literals. We can also assign a string to a variable:\n\
    \n```\ns = 'Hello world'\n\"Hello world\"\n```\n\nWhen using the console, variables\
    \ will not be declared with the `var` keyword. As you will see below, it is critical\
    \ that this is used in most situations when writing actual JavaScript code.\n\n\
    We can then inspect the type of this variable using the `typeof` operator:\n\n\
    ```\ntypeof s\n\"string\"\n```\n\nAlthough strings are their own data type, it\
    \ is possible to invoke methods on them just as we will see it is possible to\
    \ invoke methods on objects below.\n\n```\ns.charAt(1)\n\"e\"\n\ns.substr(6)\n\
    \"world\"\n\ns.toUpperCase()\n\"HELLO WORLD\"\n```\n\nIn addition, strings have\
    \ properties that can be accessed, just as we will see on objects in the examples\
    \ below:\n\n```\ns.length\n11\n```\n\nJavaScript strings are largely equivalent\
    \ to strings in Java. One consequence of this is that strings are immutable.\n\
    \nAn immutable object is an object that cannot be changed after it is first created.\
    \ Even when these appear to change, as in the examples below, in reality a new\
    \ object is being created.\n\nIn order to see immutability in action, declare\
    \ a new variable called `t`, and assign it the value of `s`:\n\n```\nt = s\n\"\
    Hello world\"\n```\n\nWe can now print out the value of `t`, and also confirm\
    \ that `t` and `s` are equal:\n\n```\nt\n\"Hello world\"\n\ns == t\ntrue\n```\n\
    \nWhat should happen if we now modify the string held against the variable `s`?\
    \ We can append to the string value using the `+=` operator:\n\n```\ns += 'test'\n\
    \"Hello worldtest\"\n```\n\nIf you now print out the value of `s` you will see\
    \ that the string’s value appears to have changed:\n\n```\ns\n\"Hello worldtest\"\
    \n```\n\nDespite this, if you print out the value of `t` it has retained its old\
    \ value:\n\n```\nt\n\"Hello world\"\n```\n\nWhen we appended “test” to the string\
    \ held against the variable `s`, the underlying string was not modified; instead\
    \ a new string was created and assigned to the variable `s`. Since `t` still refers\
    \ to the original string, it is not impacted by the modification.\n\n### Numbers\n\
    \nThe number type is used to represent both integer and floating-point values;\
    \ in fact all numbers are 64 bit floating-point numbers in JavaScript:\n\n```\n\
    n = 6.827\n6.827\n\ntypeof n\n\"number\"\n\nn2 = 6\n6\n\ntypeof n2\n\"number\"\
    \n```\n\nDue to the fact that all numbers are floating-point, operations between\
    \ two integers can return floating-point results (unlike in Java).\n\n```\n1/3\n\
    0.3333333333333333\n```\n\nIn addition to real numbers, JavaScript also supports\
    \ a number of special values.\n\n“Not a number” is used in cases where an arithmetic\
    \ operation produces a result that is not a number. Confusingly, this type is\
    \ still a `number`.\n\n```\na = 9/undefined\nNaN\n\ntypeof a\n\"number\"\n```\n\
    \nIt would have potentially been more useful for JavaScript to generate an error\
    \ in this scenario.\n\nNegative and positive infinity are also supported, and\
    \ are most often generated when dividing by 0:\n\n```\nb = 6/0\nInfinity\n\nb\
    \ == Number.POSITIVE_INFINITY\ntrue\n\nc = -6/0\n-Infinity\n\nc == Number.NEGATIVE_INFINITY\n\
    true\n```\n\nAgain, most programming languages would generate errors if an integer\
    \ was divided by 0, but since these are floating point numbers they follow the\
    \ IEEE convention of returning infinity.\n\nJavaScript also natively supports\
    \ a `Math` library modelled almost identically on the Java equivalent. Most common\
    \ maths functions are available in this library.\n\n```\nMath.pow(3, 2)\n9\n\n\
    Math.round(3.22)\n3\n```\n\n### Booleans\n\nJavaScript supports a boolean type\
    \ that contains the literal values `true` and `false`:\n\n```\nt = true\ntrue\n\
    \ntypeof t\n\"boolean\"\n\nf = false\nfalse\n```\n\nEquality operators in JavaScript\
    \ (`>`, `<`, `==`, `!=`, `>=`, `<=`) also return booleans as their result:\n\n\
    ```\nf != t\ntrue\n```\n\n### Null\n\nNull is a data type that has a single value:\
    \ `null`.\n\n```\nn = null\nnull\n```\n\nConfusingly, `null` is considered to\
    \ be of type object:\n\n```\ntypeof n\n\"object\"\n```\n\nThis is another bug\
    \ in the JavaScript language that has been maintained for backwards compatibility.\
    \ Despite this, `null` is genuinely a unique data type in JavaScript.\n\nIt is\
    \ possible to set a variable to `null` after it has been assigned a value, therefore\
    \ removing the reference to its current value (and changing its data type):\n\n\
    ```\nq = 2\n2\n\ntypeof q\n\"number\"\n\nq = null\nnull\n\ntypeof q\n\"object\"\
    \n```\n\n### Undefined\n\nThe `undefined` data type is returned when you access\
    \ a property on an object that does not exist, or use a variable before it is\
    \ declared, or before it is assigned a value.\n\n```\ntypeof g\n\"undefined\"\n\
    ```\n\n### Objects\n\nOther than the types outlined above, all data types in JavaScript\
    \ are objects: this includes arrays, functions, dates and user defined objects.\
    \ Objects will be discussed at length in the sections below.\n\n### Truthy and\
    \ Falsey Values\n\nNow that you have an understanding of the JavaScript data types,\
    \ the next thing to understand is that some values for these types evaluate to\
    \ `true`, and some evaluate to `false`. For instance, the following are all considered\
    \ false:\n\n• false\n• 0 (zero)\n• \"\" (empty string)\n• null\n• undefined\n\
    • NaN\n\nIn order to see this in action, simply ask if they are equal to `false`\
    \ in the console:\n\n```\n0 == false\ntrue\n```\n\nAll other values represent\
    \ `true` values.\n\nAs a consequence of this, it is possible to utilize a shortcut\
    \ when evaluating the value of variables in conditional statements. Instead of\
    \ writing the following:\n\n```javascript\nif (a == undefined || a == null) {\n\
    \  a = 1;\n}\n```\n\nIt is possible to simply write:\n\n```javascript\nif (!a)\
    \ {\n  a = 10\n}\n```\n\nLikewise, if you only want to use a variable if it has\
    \ a value you can write the following:\n\n```javascript\nif (s) {\n console.log(s)\n\
    }\n```\n\nThis shortcut is enormously useful, and extensively used in JavaScript\
    \ code.\n\nThe final thing that should be understood is which values are equal\
    \ to one another; the following may come as a surprise:\n\n```\nnull == undefined\n\
    true\n\n5 == \"5\"\ntrue\n\n\"true\" == true\nfalse\n\n\"1\" == true\ntrue\n\n\
    \"2\" == true\nfalse\n```\n\nThere are numerous inconsistencies in the examples\
    \ above, and again, these are often bugs rather than features. `Null` should not\
    \ be considered equal to `undefined`, despite the fact they are both falsey values\
    \ they represent very different data-types and meanings.\n\nFortunately, JavaScript\
    \ contains an alternative pair of equality operators:\n\n===\n\n!==\n\nThese compare\
    \ variables based on both their value and their data type, and therefore provide\
    \ more expected results:\n\n```\nnull === undefined\nfalse\n\n5 === \"5\"\nfalse\n\
    \n\"true\" === true\nfalse\n\n\"1\" === true\nfalse\n```\n"
