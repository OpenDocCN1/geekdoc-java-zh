  trans: "\n在这个示例中，我们在对象的方法内部声明了一个函数。虽然这是一个人为构造的例子，但这里使用的方法是很常见的（特别是对于事件监听器）。\n\n\
    从直觉上看，这段代码应该可以正常工作：辅助函数使用 `this.num` 来访问对象上的 `num` 属性。遗憾的是，这段代码的运行结果并不符合预期：\n\n\
    ```\nobj.add(20)\n```\n```\nNaN\n```\n\n如果我们在代码中添加一些日志，就可以看到问题所在：\n\n```\nobj\
    \ = { nums: 10,\n  add: function(num2) {\n    console.log('Outer this ' + this)\n\
    \    helper = function(num2) {\n      console.log('Inner this ' + this)\n    \
    \  this.num += num2;\n      return this.num;\n    }\n    return helper(num2);\n\
    \  }\n}\n```\n\n现在执行这段代码，你将看到以下输出：\n\n```\nobj.add(20)\nOuter this [object Object]\n\
    Inner this [object Window]\nNaN\n```\n\n令人惊讶的是，内部函数内部 `this` 已经从对象变为了 `window`。大多数人认为这是语言的一个\
    \ bug，但这是一个不会被修复的 bug，因为它会破坏遗留代码。\n\n避免此问题的常见方法如下：\n\n```javascript\nobj = { num:\
    \ 10,\n  add: function(num2) {\n    var that = this;\n    helper = function(num2)\
    \ {\n      that.num += num2;\n      return that.num;\n    }\n    return helper(num2);\n\
    \  }\n}\n```\n\n在进入内部函数之前，我们声明了一个名为 `that` 的变量，并将其设置为指向 `this` 对象（对象本身）。在内部函数内部，我们访问\
    \ `that` 变量而不是 `this` 变量。\n\n到目前为止，我们已经看到了 `this` 变量的两种不同的定义。在这两种情况下，`this` 都是由编程环境隐式定义的。也可以显式地指定用于表示\
    \ `this` 的对象。为了看到其实效果，我们将定义一个新对象，它将两个属性相加：\n\n```\nadder = {\n  num1: 10,\n  num2:\
    \ 20,\n  add: function() {\n    return this.num1+this.num2;\n  }\n}\n```\n\n如果我们调用\
    \ `add` 方法，两个属性将相加并返回：\n\n```\nadder.add()\n30\n```\n\n正如前面提到的，函数和方法在 JavaScript\
    \ 中实际上是对象，因此它们支持自己的方法。这些方法是定义在 `Function.prototype` 上的（因此自然地你也可以为函数添加自己的方法）。`Function.prototype`\
    \ 支持的方法之一是 `apply`，它允许为 `this` 变量提供替代的环境：\n\n```\nadder.add.apply({num1:30,num2:40})\n\
    ```\n```\n70\n```\n\n传递给 `apply` 的参数是一个包含函数所需的适当属性的对象。这种方法可以用于替换独立函数和对象方法中 `this`\
    \ 的值。\n\n`Function.prototype` 提供的另一个方法是 `bind`。`bind` 不是使用传入的对象作为环境来执行函数，而是返回一个新函数，该新函数将传入的对象永久地绑定为函数的\
    \ `this` 变量：\n\n```\nadd2 = adder.add.bind({num1:30,num2:40})\n```\n\n现在可以按照以下方式执行函数：\n\
    \n```\nadd2()\n```\n```\n70\n```\n\n我们可以使用这种方法来解决在这个示例中遇到内部函数遇到的问题：\n\n```javascript\n\
    obj = { nums: 10,\n  add: function(num2) {\n    console.log('Outer this ' + this)\n\
    \    helper = function(num2) {\n      console.log('Inner this ' + this)\n    \
    \  this.num += num2;\n      return this.num;\n    }\n    return helper(num2);\n\
    \  }\n}\n```\n\n这可以重写为如下：\n\n```javascript\nobj = { num: 10,\n  add: function(num2)\
    \ {\n    console.log('Outer this ' + this)\n    helper = function(num2) {\n  \
    \    console.log('Inner this ' + this)\n      this.num += num2;\n      return\
    \ this.num;\n    }.bind(this);\n    return helper(num2);\n  }\n}\n```\n\n现在执行这段代码将得到正确的结果：\n\
    \n```\nobj.add(20)\nOuter this [object Object]\nInner this [object Object]\n30\n\
    ```\n\n在本书前面，我提到过 `this` 可能定义的第四种方式：在构造函数内部。在构造函数内部，`this` 指向隐式创建的对象，前提是该函数是用\
    \ `new` 修饰符调用的。如果没有 `new` 修饰符，`this` 将再次变成全局对象。\n\n在完成本节之前，值得提到 JavaScript 的另一个局限性。JavaScript\
    \ 不支持块级作用域。从以下示例可以看到这一点：\n\n```javascript\nfunction test() {\n  var a = [1,2,3,4];\n\
    \  for (var i = 0; i < a.length; i++) {\n    var a = i;\n    console.log(a);\n\
    \  }\n  console.log(a);\n}\n```\n\n这里的内部块使用了与外部块相同的变量名 `a`。在大多数程序语言中，变量名 `a` 在不同块中应该是不同的。但由于\
    \ JavaScript 不支持块级作用域，只支持函数级作用域，因此 JavaScript 采用了另一种被称为“提升”的技术。在解释“提升”之前，尝试弄清楚为什么这些函数会失败：\n\
    \n```javascript\nfunction test() {\n  console.log(j);\n  var j = 10;\n}\n```\n\
    ```javascript\nfunction global() {\n  console.log(j);\n  var j = 10;\n}\n```\n\
    \n这些变量在显式赋值值之前是未定义的，但它们存在于函数顶部。\n\n```\ntest()\nundefined\n```\n```\nglobal()\n\
    ReferenceError: j not defined\n```\n\n## 异常处理\n\n我们将在本书后面讨论实现应用范围异常的方法。现在，值得强调\
    \ JavaScript 支持“Java 风格”的异常处理，但没有静态类型支持。\n\n任何代码都可以抛出异常而无需声明它将抛出异常。任何数据类型都可以作为异常抛出，尽管通常的做法是抛出一个包含代码和消息的对象。此函数在传入偶数时抛出异常：\n\
    \n```javascript\nfunction dontEven(num) {\n  if (num % 2 == 0) {\n    throw {\n\
    \      code: 'even_number',\n      message: 'This function cannot be called with\
    \ even numbers'\n    };\n  }\n}\n```\n\n也可以捕获异常，并提供处理失败场景逻辑：\n\n```javascript\n\
    function passNumber(num) {\n  try {\n    dontEven(num);\n  } catch(e) {\n    console.log(e.code+':'+e.message);\n\
    \    console.log('Retying with ' + (num+1));\n    dontEven(num+1);\n  }\n}\n```\n\
    \n如果用偶数调用上述函数，它将产生以下输出：\n\n```\npassNumber(2)\neven_number:This function cannot\
    \ be called with even numbers\nRetying with 3\n```\n"
- fmt: "\nWithin the browser environment, all JavaScript code executes on a single\
    \ thread, and this is also the thread that the browser utilizes to update the\
    \ window. This means that if you make changes to the `DOM`, and then continue\
    \ to utilize the thread to perform any computation, your `DOM` changes will not\
    \ be applied until you finish this processing.\n\nBrowsers do allow documents\
    \ in different tabs to utilize different threads: this is possible because the\
    \ tabs do not interact with one another.\n\nThe browser manages the single thread\
    \ with an event queue. Each time an event occurs, be it a browser initiated event\
    \ such as resizing the window, a user initiated event such as clicking a button,\
    \ or a JavaScript initiated event such as a timer executing a function, the event\
    \ is added to a queue. The browser then processes these events sequentially and\
    \ does not begin processing a new event until all the events ahead of it have\
    \ finished processing.\n\nThis threading model can cause issues, since it does\
    \ not prioritize the processing of events based on their source. In real-world\
    \ applications it is often more important to respond to user based events quickly,\
    \ even if that means temporarily interrupting a computational process currently\
    \ executing.\n\nHTML5 has addressed this issue to a degree with an API called\
    \ `Web Workers`. These will be introduced later in the book, but they are not\
    \ a general purpose solution to threading issues, since they contain numerous\
    \ limitations.\n\nJavaScript does provide a mechanism to alleviate some of the\
    \ issues inherent in the single thread model with the `setTimeout` function defined\
    \ in the language. The `setTimeout` function allows code to execute at a delayed\
    \ interval.\n\nIn order to see `setTimeout` in action, we will first define a\
    \ function that we wish to execute at a delayed interval:\n\n```javascript\nwriter\
    \ = function() {\n  for (var i = 0; i < 10; i++) {\n    console.log('Row '+i);\n\
    \  }\n}\n```\n\nNext we will ask the browser thread to execute this with a delay\
    \ of 5000 milliseconds:\n\n```javascript\nsetTimeout(writer, 5000)\n```\n\nIf\
    \ you execute this you should see the execution begin after approximately 5 seconds.\
    \ JavaScript executes this by encapsulated the function call in an event and adding\
    \ that event to the event queue after 5 seconds. It will only execute when it\
    \ gets to the front of the event queue.\n\nBefore performing a long running calculation,\
    \ it is sometimes useful to yield control back to the browser to ensure any other\
    \ events that are waiting can be processed (particularly user driven events) first,\
    \ and therefore stops the application from appearing to “lock-up”.\n\nYour processing\
    \ can be encapsulated in a call to `setTimeout` with a very small delay (10 milliseconds\
    \ for instance). This will guarantee that you go to the back of the event queue\
    \ (and any pending events will occur), but still will not result in any unnecessary\
    \ delay if there are no other events waiting to run.\n\nThe `setTimeout` function\
    \ can also be used to yield control back to the browser during a long running\
    \ task. If you were to perform a computation that took 10 seconds, by default\
    \ you would not be interrupted during this period, so all other events would queue\
    \ up behind you. Instead, if there is a way of breaking the computation up, you\
    \ can choose a point where you wish to yield, and ask the next portion of the\
    \ algorithm to run by calling `setTimeout` with a delay of 10 milliseconds.\n\n\
    If this was done every 100 milliseconds, it is unlikely the user would notice\
    \ that there was a long running computational process executing on the same thread.\n\
    \nThe main challenge in achieving this is pausing and resuming the computation.\
    \ It will typically be necessary to store the current state of the algorithm,\
    \ and pass this to the function that will continue the processing.\n\n`setTimeout`\
    \ has a companion function called `setInterval`. Unlike `setTimeout` which causes\
    \ a function to be executed once, `setInterval` causes a function to be executed\
    \ indefinitely with a given delay between executions. The following is a simple\
    \ example:\n\n```javascript\nsetInterval(function() {\n  console.log('hello world');\n\
    }, 1000)\n```\n\nThis will cause “hello world” to be printed to the console every\
    \ second indefinitely. `setInterval` is very useful for implementing background\
    \ jobs that need to perform operations periodically.\n\nAs with `setTimeout`,\
    \ `setInterval` generates events that are placed on the event queue. Therefore\
    \ they can only run once they get to the front of the event queue.\n\nAlthough\
    \ `setTimeout` and `setInterval` are rudimentary compared to the threading libraries\
    \ common in most programming languages, it is important to have a strong grasp\
    \ of what they do, and when you should use them. They allow many of the issues\
    \ associated with the single thread model (particularly unresponsive GUIs, and\
    \ slow reactions to user events) to be alleviated.\n\n## Conclusion\n\nJavaScript\
    \ is best described as a multi-paradigm language: it supports the following programming\
    \ paradigms:\n\n- Functional programming\n- Imperative programming\n- Classical\
    \ object orientated programming\n- Prototype-based programming\n\nDue to its multi-paradigm\
    \ nature, JavaScript is enormously flexible. The danger with JavaScript’s multi-paradigm\
    \ nature is that it allows programmers to see in it what they want, without taking\
    \ into account which of these paradigms are JavaScript’s true strengths.\n\nThis\
    \ chapter has presented the case that JavaScript should be best thought of as\
    \ a prototype-based, functional programming language.\n\nJavaScript’s approach\
    \ to functions is a particular strength. First class functions are a powerful\
    \ concept, and allow for concise, reusable code.\n\nJavaScript’s approach to prototyping\
    \ is perhaps its least understood feature, and while unusual as a design choice\
    \ in the language, is another key strength of the language.\n\nFinally, JavaScript\
    \ has more than its fair share of quirks and design bugs. The key to circumventing\
    \ these is to understand they exist. These quirks can be easily worked around\
    \ by those who understand them, but can cause annoying bugs for those who don’t.\n"
