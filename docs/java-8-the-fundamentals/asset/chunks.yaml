- fmt: "\nLambda expressions had originally been slated for inclusion in `Java 7`,\
    \ and had been requested widely for many years before that. Lambda expressions\
    \ (commonly known as closures or anonymous methods) allow you to encapsulate a\
    \ block of code in an anonymous method (i.e. a method without a name or enclosing\
    \ class), and pass it to another method which will invoke it at the appropriate\
    \ time. This may sound like a simple technique (and it is) but it brings tremendous\
    \ benefits, especially when used in conjunction with another Java 8 feature: the\
    \ `Streams API`.\n\nThe closest Java has had to lambda expressions in the past\
    \ were anonymous and local classes. These were classes defined and instantiated\
    \ inside a method, and often passed to another method to perform an operation.\
    \ In the case of anonymous classes it was not necessary to name the class.\n\n\
    Anonymous classes are widely used as callbacks, and have been commonly used to\
    \ implement interfaces such as `Runnable` and `ActionListener`.\n\nLambda expressions\
    \ are the next step along a continuum from anonymous classes, so we will begin\
    \ with an example of an anonymous class to see why many people felt lambda expressions\
    \ were necessary.\n\nConsider a piece of code that filters all even numbers out\
    \ of a list of integers, producing a new list of odd numbers. Naturally this could\
    \ be achieved through iteration and imperative programming techniques, but another\
    \ way to write this is to define a method that accepts each element in the list,\
    \ and returns `true` or `false` to indicate whether the element should be retained\
    \ in the list – and to define a generic library for iterating the list and invoking\
    \ the method on each element.\n\nThe advantage of this approach is that we can\
    \ reuse the generic filtering algorithm, and just replace the method that makes\
    \ the filtering decision.\n\nTo start, we can define an `Interface` for classes\
    \ that will make filtering decisions:\n\n```java\npackage localclasses;\n\npublic\
    \ interface Filter<T> {\n    boolean filter(T t);\n}\n```\n\nNext, we can write\
    \ a static helper class that performs generic filtering. We will call this `Collections2`\
    \ since it is enhancing the methods Java makes available on the `Collections`\
    \ class. This will create a new empty `List`, iterate through the items in the\
    \ original list, and invoke the `filter` method on the instance of `Filter` passed\
    \ to it - those that return `true` will be added to the new list:\n\n```java\n\
    package localclasses;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\
    \npublic class Collections2 {\n    public static <T> List<T> filter(List<T> input,\
    \ Filter<T> filter) {\n        List<T> result = new ArrayList<T>();\n        for\
    \ (T t : input) {\n            if (filter.filter(t)) {\n                result.add(t);\n\
    \            }\n        }\n        return result;\n    }\n}\n```\n\nNow that we\
    \ have a generic filtering API in place, we can use this functionality to filter\
    \ a list. The code below will declare an anonymous class that implements `Filter`,\
    \ and provide an implementation that returns `true` for odd numbers:\n\n```java\n\
    package localclasses;\n\nimport java.util.List;\nimport java.util.Arrays;\n\n\
    public class Main {\n    public static void main(String[] args) {\n        List<Integer>\
    \ numbers = Arrays.asList(1,5,4,2,7,9,6,4,2,6,5,8);\n        System.out.println(\n\
    \            Collections2.filter(numbers, new Filter<Integer>() {\n          \
    \      @Override\n                public boolean filter(Integer t) {\n       \
    \             return t%2 == 1;\n                }\n            })\n        );\n\
    \    }\n}\n```\n\nThat wasn’t so hard was it?\n\nBy way of comparison, the same\
    \ code in JavaScript looks like this:\n\n```javascript\n[1,5,4,2,7,9,6,4,2,6,5,8].filter(function(v)\
    \ {return v%2 == 1;})\n```\n\nThe JavaScript implementation passes an anonymous\
    \ function to the `filter` method natively supported by arrays.\n\nThe key to\
    \ comparing these two approaches is comparing the Java implementation of an anonymous\
    \ class:\n\n```java\nCollections2.filter(numbers, new Filter<Integer>() {\n  \
    \  @Override\n    public boolean filter(Integer t) {\n        return t%2 == 1;\n\
    \    }\n})\n```\n\nto the JavaScript implementation of an anonymous function:\n\
    \n```javascript\nfunction(v) {return v%2 == 1;}\n```\n\nWhen you compare the two\
    \ you can get a feeling why people have accused Java of feeling overly verbose.\
    \ Admittedly, the JavaScript version does not bring the benefits of type safety,\
    \ but otherwise the two examples are functionally equivalent. JavaScript is not\
    \ an isolated example either; many languages now support equally concise syntaxes.\n\
    \nThe key feature in JavaScript that allows this line of code to work is that\
    \ functions can be assigned to variables and passed to other functions as parameters.\
    \ To be specific: functions are first-class citizens in the language.\n\nUp until\
    \ the release of `Java 8`, all Java methods had to be defined inside a class –\
    \ therefore methods were not first-class citizens in the language. As a result,\
    \ methods could not be passed to other methods as parameters or assigned to variables.\n\
    \nA lambda expression is essentially an anonymous method that lives outside the\
    \ scope of a class. As we will see, this is an illusion to some degree, lambda\
    \ expressions are still objects, and they do have types, but the syntax for creating\
    \ them removes the overhead of defining a class.\n\nThe basic format of a lambda\
    \ expression is as follows:\n\n```\n(String s) -> { System.out.println(s); };\n\
    ```\n\nThe first part of the expression `(String s)` denotes the arguments that\
    \ will be passed to the lambda expression when it is invoked – in this case it\
    \ will be passed a single `String` parameter. If no parameters are required by\
    \ the lambda expression this can be defined as `()`. As we will see, this structure\
    \ can be simplified significantly in some situations, the right hand side of the\
    \ expression `{ System.out.println(s); }` contains the code block that will be\
    \ executed when the lambda expression is invoked – naturally this can access the\
    \ parameters, and use any other Java language features required – it is just a\
    \ regular code block.\n\nIf the code-block consists of a single statement `{}`\
    \ brackets can be omitted, and the return type of the statement implicitly becomes\
    \ the return type of the lambda expression. Where `{}` brackets are used, the\
    \ lambda expression can use the `return` keyword to return a value, otherwise,\
    \ as in this case, it returns `void`.\n\nThe two parts of the expression are glued\
    \ together by the `->` construct. There will be plenty of examples of this construct\
    \ below, so don’t worry about understanding the details of lambda expressions\
    \ too much at this point.\n\n## Functional Interfaces\n\nAs mentioned above, many\
    \ languages supporting lambda expressions make functions first-class citizens\
    \ in the language. Java does not go that far - lambda expressions are still objects.\
    \ In addition, even with the addition of lambda expressions, Java remains a statically\
    \ typed language; therefore it needs to know the type of any parameter (including\
    \ lambda expressions) passed to a method at compile time. This leads to the obvious\
    \ question: what type are lambda expressions?\n\nThe answer to this lies in a\
    \ new `Java 8` feature called “functional interfaces”. You have probably come\
    \ across interfaces with no methods (e.g. `Serializable`, `Cloneable`). These\
    \ are known as marker or tagging interfaces, since they are simply used to denote\
    \ something about a class without requiring it to implement anything.\n\nJava\
    \ now supports a second special class of interface that contain a single method:\
    \ these can be designated as ”functional interfaces”. Many existing Java interfaces\
    \ have been designated as functional interfaces including `Comparable`, `Runnable`\
    \ and `ActionListener`. These interfaces are also called Single Abstract Method\
    \ interfaces (SAM Interfaces) – particularly in the Scala world.\n\nPrior to `Java\
    \ 8` there was nothing special about SAM interfaces: in `Java 8` they can now\
    \ act as the type for lambda expressions when tagged with the annotation `@FunctionalInterface`,\
    \ for example:\n\n```java\n@FunctionalInterface\n```\n"
