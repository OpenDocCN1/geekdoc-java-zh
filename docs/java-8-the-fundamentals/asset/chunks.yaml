  trans: "\n以下代码可调用此脚本：\n\n```javascript\npackage javascript;\n\nimport java.util.Arrays;\n\
    import java.util.List;\nimport java.util.logging.Level;\nimport java.util.logging.Logger;\n\
    import javax.script.Invocable;\nimport javax.script.ScriptEngine;\nimport javax.script.ScriptEngineManager;\n\
    \npublic class JavaScript {\n  public static void main(String[] args) {\n    try\
    \ {\n      ScriptEngineManager m = new ScriptEngineManager();\n      ScriptEngine\
    \ e = m.getEngineByName(\"nashorn\");\n      e.eval(new java.io.FileReader(\"\
    src/javascript/helpers.js\"));\n      Invocable invocable = (Invocable) e;\n \
    \     Integer result = (Integer)invocable.invokeFunction(\"sum\", 20, 30);\n \
    \     System.out.println(result);\n    } catch (Exception ex) {\n      Logger.getLogger(JavaScript.class.getName()).log(Level.SEVERE,\
    \ null, ex);\n    }\n  }\n}\n```\n\n当脚本加载时，它应该打印数字 115，随后在执行 `invokeFunction`\
    \ 代码时打印 50。\n\n确保路径正确非常重要。以下假设你的项目代码存储在名为 `src` 的文件夹中，且 `helpers.js` 文件位于 `javascript`\
    \ 包中。\n\n## 在 JavaScript 中使用 Java\n\nJava 和 JavaScript 之间的交互可能相当复杂。任何 JavaScript\
    \ 代码都可以实例化 Java 对象，然后像对待 JavaScript 对象一样处理它们。JavaScript 对象与 Java 对象并没有完全不同——正如你将在附录\
    \ A 中看到的，它们也像 Java 对象一样支持字段和方法，并以类似的方式使用变量 `this`。\n\n在早先创建的 `helpers.js` 文件中添加以下\
    \ JavaScript 函数：\n\n```javascript\nfunction useJava() {\n  var list = new java.util.ArrayList();\n\
    \  list.add(8);\n  list.add(20);\n  list.add(88);\n  list.add(21);\n  return list.stream().mapToInt(function(i)\
    \ {return i*i}).sum();\n}\n```\n\n如果你查看这段代码，会发现它在 JavaScript 函数内部构造了一个 Java `List`。由于它没有执行导入，因此必须使用完全限定类名。可以使用\
    \ `importPackage` 和 `importClass` 函数在需要的地方进行导入。\n\n```javascript\nimportPackage(java.util);\n\
    importClass(java.util.List);\n```\n\n在此阶段指出这一点也是明智的：`java.lang` 中的类不会自动导入到脚本中，因为\
    \ JavaScript 许多许多同名对象（例如 `Boolean`、`Object`）。\n\n一旦 `ArrayList` 被实例化，就可以像任何其他\
    \ JavaScript 对象一样调用它的方法——在这种情况下，我们调用了 4 次 `add` 方法来添加数字。\n\n然而，真正有趣的是方法的最后一行。我们调用了\
    \ Java Streams 的 `mapToInt` 方法，但提供的不是 lambda 表达式，而是一个 JavaScript 匿名函数。\n\n然后你可以如下方式从\
    \ Java 中调用此函数：\n\n```javascript\nInteger result = (Integer)invocable.invokeFunction(\"\
    useJava\");\n```\n\n## 命令行\n\n也可以从命令行访问 Nashorn，使其成为编写命令行脚本的可能选择。Java 的 `bin`\
    \ 文件夹中提供了一个工具，可以通过打开命令提示符并调用 `jjs` 程序来使用：\n\n该程序可以接收脚本，但也是一个独立的 JavaScript 解释器。为了证明这一点，只需在命令提示符中输入以下内容：\n\
    \n```bash\n1 + 1\n```\n\n这应该产生结果 2。\n\n我们实际上可以在这里执行任何 JavaScript，例如：\n\n```javascript\n\
    [1,2,3,4,5,6,7,8].filter(function(i) {return i%2==1})\n```\n\n任何输入都将立即求值并返回结果。\n\
    \n然而，这不仅仅是一个 JavaScript 解释器——它是 Java 平台上的 JavaScript 解释器，因此我们还可以调用以下内容：\n\n```javascript\n\
    list = new java.util.ArrayList();\nlist.add(1);\nlist.add(2);\nlist.add(3);\n\
    result = list.stream().mapToInt(function(i) {return i*i}).sum()\nprint(result)\n\
    ```\n\n注意我们在某些语句中是如何结合 JavaScript 和 Java 的。因此，命令行是非常棒的代码草稿本，可以在将其包含在脚本之前进行尝试。\n\
    \n如果你继续通过阅读附录 A 中的示例章节来学习 JavaScript，你可以选择使用 `jjs` 作为示例的解释器。\n\n使用 `quit()` 函数退出命令行。\n\
    \n`jjs` 实际上比上述示例暗示的还要强大。它可以按照如下方式以特殊的脚本模式启动：\n\n```bash\njjs –scripting\n```\n\
    \n在模式模式下，`jjs` 可以执行传统 shell 的任务，例如执行命令：\n\n```bash\n$EXEC(\"ls -l\")\n```\n\n\
    带输入执行命令：\n\n```bash\n$EXEC(\"cat\", \"Hello World\")\n```\n\n或者访问环境：\n\n```bash\n\
    $ENV.USER\n```\n\n事实上，你可以使用以下头部编写脚本并像执行任何其他 shell 脚本一样执行它们：\n\n```bash\n#!/usr/bin/jjs\n\
    ```\n\n脚本功能的使用自然取决于你的底层操作系统；因此，将不会对此功能进行详细讨论。\n\n## 结论\n\n本章仅触及了 Nashorn 的服务。要理解的核心是\
    \ JavaScript 代码可以使用 Java 代码，而 Java 代码可以调用 JavaScript，以及 Java 平台支持的所有库和 API。\n\n\
    # 微小变化\n\n本章将概述 Java 8 中发生的一些微小变化。这些特性都不值得单独用一个章节介绍，但每个都足够有趣的\n\n数组并行排序\n\n现在可以对数组进行并行排序。与并行流一样，这在底层使用了\
    \ ForkJoinPool，并可能会带来性能提升。\n\n如果你想自己进行基准测试，这里有一个示例程序，向数组添加了 10,000,000 个浮点数，然后使用\
    \ `parallelSort` 对它们进行排序：\n\n```java\npackage arrays;\n\nimport java.util.Arrays;\n\
    \npublic class ArraySort {\n  public static void main(String[] args) {\n    double[]\
    \ nums = new double[10000000];\n    for (int i = 0; i < 1000000; i++) {\n    \
    \  nums[i] = Math.random();\n    }\n    long start = System.currentTimeMillis();\n\
    \    Arrays.parallelSort(nums);\n    //Arrays.sort(nums);\n    System.out.println(System.currentTimeMillis()-start);\n\
    \  }\n}\n```\n\n一旦有了并行排序计时，尝试通过更改以下行来实现串行排序：\n\n```java\n//Arrays.parallelSort(nums);\n\
    Arrays.sort(nums);\n```\n\n在这样的数组上，我确实注意到 `parallelSort` 有显著的改进，但对于较小的数组，差异是不显著的。\n\
    \n## 注解变化 (JSR 308)\n\n在 Java 8 之前，注解可以使用类、方法、字段、包、局部变量和方法参数的声明。\n\n现在可以在任何类型声明的地方应用注解。这在未来可能允许比当前更强的类型检查。例如，如果使用类型定义局部变量，可以给它们赋予注解：\n\
    \n```java\npublic void method() {\n  @NotNull String str1 = “Hello\n}\n```\n\n\
    它们也可以用于使用 `new` 关键字构造对象：\n\n```java\nObjectA objecta = new @Readonly ObjectA();\n\
    ```\n\n或者在泛型声明中：\n\n```java\nList<@CreditCard String> creditCards = new ArrayList<>();\n\
    ```\n\n或者在抛出异常时：\n\n```java\nthrow new @HighPriority IOException();\n```\n\n本质上，任何使用类型的地方都可以伴随注解。\n\
    \n本书不讨论这些变化的主要原因是，因为这些变化本身并没有带来任何即时益处——这取决于框架开发者如何以有意义的方式使用这一功能。\n"
- fmt: "\nAll of the examples above represent possibilities only – none of these annotations\
    \ actually exist. This change does have the potential to bring significant improvements\
    \ to Java in the future however, just as the original inclusion of annotation\
    \ brought enormous benefits.\n\n## Reflection Changes\n\nJava 8 provides a minor\
    \ enhancement to the `Java Reflection API`. It is now possible to extract method\
    \ parameter names: previously it was only possible to extract their types – something\
    \ I found annoying on a number of occasions.\n\n```java\nClass<String> clz = String.class;\n\
    \nfor (Method m : clz.getDeclaredMethods()) {\n  System.out.println(m.getName());\n\
    \  for (Parameter p : m.getParameters()) {\n    System.out.println(p.getName());\n\
    \  }\n}\n```\n\nIn order to use this feature, the source code needs to be compiled\
    \ with the `javac` command line option `–parameter`. This ensures that appropriate\
    \ information is added to the class file.\n\n## Math Changes\n\nWe have already\
    \ seen that the primitive wrappers (e.g. `Integer`, `Long`) have had new static\
    \ methods added that previously were only available as static helpers on `Math`:\n\
    \n- `Min`\n- `Max`\n\nThis is a more natural location for these methods, but naturally\
    \ they are still available on the `Math` class for backwards compatibility.\n\n\
    The `Math` class itself also now contains a number of new static methods. The\
    \ bulk of these are variants of existing methods, but throw an `ArithmeticException`\
    \ if they overflow (exceed the capacity of the data-type). This is typically more\
    \ useful, since overflowing is seldom a desired feature.\n\n- [`Math.addExact(int,\
    \ int)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#addExact(int,%20int))\n\
    - [`Math.addExact(long, long)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#addExact(long,%20long))\n\
    - [`Math.subtractExact(int, int)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#subtractExact(int,%20int))\n\
    - [`Math.subtractExact(long, long)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#subtractExact(long,%20long))\n\
    - [`Math.multiplyExact(int, int)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#multiplyExact(int,%20int))\n\
    - [`Math.multiplyExact(long, long)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#multiplyExact(long,%20long))\n\
    - [`Math.negateExact(int)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#negateExact(int))\n\
    - [`Math.negateExact(long)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#negateExact(long))\n\
    - [`Math.decrementExact(int)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#decrementExact(int))\n\
    - [`Math.decrementExact(long)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#decrementExact(long))\n\
    - [`Math.incrementExact(int)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#incrementExact(int))\n\
    - [`Math.incrementExact(long)](http://download.java.net/jdk8/docs/api/java/lang/Math.html#incrementExact(long))\n\
    \n`BigInteger` and `BigDecimal` also provide corresponding methods for converting\
    \ values back to primitives:\n\n- [`longValueExact()](http://download.java.net/jdk8/docs/api/java/math/BigInteger.html#longValueExact())\n\
    - [`intValueExact()](http://download.java.net/jdk8/docs/api/java/math/BigInteger.html#intValueExact())\n\
    - [`shortValueExact()](http://download.java.net/jdk8/docs/api/java/math/BigInteger.html#shortValueExact())\n\
    - [`byteValueExact()](http://download.java.net/jdk8/docs/api/java/math/BigInteger.html#byteValueExact())\n\
    \nThis is a useful way of knowing overflow errors have occurred, so these variants\
    \ should be favored over their non-exact siblings.\n\n## String changes\n\nJava\
    \ 8 finally adds a `join` method for adding delimiters between `Strings`:\n\n\
    ```java\nString.join(\", \", \"Hello\", \"World\", \"Again\");\n```\n\nThis will\
    \ produce:\n\nHello, World, Again\n\nThe first parameter acts as the delimiter,\
    \ while the remaining parameters are the `Strings` that are joined to the parameter.\n\
    \nThis can optionally accept a `List`:\n\n```java\nList<String> list = Arrays.asList(\"\
    Hello\", \"World\", \"Again\");\nSystem.out.println(String.join(\", \", list));\n\
    ```\n\nAs we saw earlier in the book, the same basic functionality can be implemented\
    \ using `Streams` and a join collector.\n\nSimilar functionality is also available\
    \ in a new class called `StringJoiner`, which also allows a prefix and suffix\
    \ `String` to be provided:\n\n```java\nStringJoiner sj = new StringJoiner(\",\"\
    , \"{\", \"}\");\nsj.add(\"Test1\").add(\"Test2\").add(\"Test3\");\nString s =\
    \ sj.toString();\n```\n\nThis produces the following:\n\n{Test1,Test2,Test3}\n\
    \n# Conclusion\n\nI hope this book, although short, has convinced you that Java\
    \ 8 is more than just another Java release, and could impact (for the better)\
    \ the way programmers think about expressing algorithms. Lambda expressions were\
    \ a long time coming to the Java language, and although not everyone agrees with\
    \ the specifics of their implementation, most people agree that the version included\
    \ in Java 8 is significantly better than not having lambda expressions at all.\n\
    \nJava 8 also has the potential to greatly enhance the multi-threading capabilities\
    \ of many applications, although, as seen, there are still risks involved in implementing\
    \ parallel processing if you do not have a full understanding of how it works.\n\
    \nAs mentioned earlier, the next section contains a bonus chapter on JavaScript\
    \ from my book “A Software Engineer Learns HTML5, JavaScript and jQuery”. If you\
    \ enjoy this chapter and would like to learn more, it is available from Amazon\
    \ and other online retailers:\n\n[http://www.amazon.com/Software-Engineer-Learns-JavaScript-jQuery-ebook/dp/B00GAMTRI8/ref=sr_1_2?s=digital-text&ie=UTF8&qid=1394932033&sr=1-2](http://www.amazon.com/Software-Engineer-Learns-JavaScript-jQuery-ebook/dp/B00GAMTRI8/ref=sr_1_2?s=digital-text&ie=UTF8&qid=1394932033&sr=1-2)\n"
