    # Lambda 表达式


    我们查看 `Java 8` 的最佳起点是从它最受期待的特性开始：`lambda expressions`（JSR 335 https://jcp.org/en/jsr/detail?id=335）。这些也是
    `Java 8` 添加的其他几个特性的依赖，因此在不掌握 `lambda expressions` 的情况下，无法理解这些其他特性。


