  trans: "\n\n当然，我们不需要先声明该函数，可以用如下方式实现相同的功能：\n\n```\na.filter(function(i) {return\
    \ i % 2 == 0})\n```\n`[2, 4, 6, 8, 10]`\n\n在这种情况下，传递给 `filter` 方法的函数是一个匿名函数（即没有名字的函数）。该函数仅在\
    \ `filter` 调期间存在，且不能被重用。\n\n现在让我们想象一个更复杂的例子。假设我们取一个数组，将每个元素乘以它本身，如果结果是偶数，则返回该结果。\n\
    \nJavaScript 数组还有一个名为 `map` 的方法。与 `filter` 类似，`map` 会将数组的每个成员传递给函数，然后返回一个包含这些函数调用结果的新数组。\n\
    \n需要注意的是，这些方法并没有修改原始数组；它们是创建了一个包含适当条目的新数组。这是一个重要的范式，因为这意味着方法调用不会影响任何引用原始数组的其他代码。\n\
    \n为了将每个成员乘以它本身，我们可以执行：\n\n```\na.map(function(i) {return i*i})\n```\n`[1, 4, 9,\
    \ 16, 25, 36, 49, 64, 81, 100]`\n\n为了从中返回偶数，因此我们可以对 `map` 调用返回的数组上执行 `filter`\
    \ 方法：\n\n```\na.map(function(i) {return i*i}).filter(function(i) {return i % 2\
    \ == 0})\n```\n`[4, 16, 36, 64, 100]`\n\n最后，假设我们要对最终数组中的值求和。`Arrays.prototype`\
    \ 支持一个 `reduce` 方法来实现。该方法比 `map` 和 `filter` 稍微复杂，因为该方法必须跟踪当前计数。该方法会为数组中的每个成员向我们的函数传递以下内容：\n\
    \n1. 当前结果。\n2. 数组当前成员的值。\n3. 该成员在数组中的索引（从 0 开始）。\n4. 数组本身。\n\n`filter`、`map` 和\
    \ `reduce` 方法并不是 JavaScript 特有的。这些是许多语言中处理数据集的重要运算符，并由 Google 用于索引网页的 map/reduce\
    \ 算法发普及。\n\n[`static.googleusercontent.com/external_content/untrusted_dlcp/research.google.com/en//archive/mapreduce-osdi04.pdf`](http://static.googleusercontent.com/external_content/untrusted_dlcp/research.google.com/en/archive/mapreduce-osdi04.pdf)\n\
    \n为了看到运行效果，请执行以下操作：\n\n```\n[1,2,3,4,5].reduce(function(total, currentValue, index,\
    \ array) {\n  console.log('Current value is ' + currentValue);\n  console.log('Total\
    \ is ' + total);\n  return total += currentValue;\n});\n```\n\n这将打印出：\n\nCurrent\
    \ value is 2\nTotal is 1\nCurrent value is 3\nTotal is 3\nCurrent value is 4\n\
    Total is 6\nCurrent value is 5\nTotal is 10\n15\n\n总值最初被设置为数组中第一个元素的值。然后每个成员都会被传递给函数，我们将其加到总和中。最后，总和为\
    \ 15，并从 `reduce` 方法返回。\n\n我们现在可以使用链式调用 `map`、`filter` 和 `reduce` 来最终版本的代码，每个方法都使用前一个方法的结果作为输入：\n\
    \n```\na.map(function(i) {return i*i})\n  .filter(function(i) {return i % 2 ==\
    \ 0})\n  .reduce(function(total, currentValue, index, array) { return total +=\
    \ currentValue; })\n```\n220\n\n接受其他函数的函数允许软件工程师编写极其简洁的代码。在许多强类型面向对象的语言（如 Java）中，函数不是一等语言结构。为了写一个函数（或方法），你必须先构建一个类来包含它，然后从该类实例化一个对象。尽管\
    \ Java 允许匿名类，但执行上述示例的语法将远没有这么简洁。\n\n## 函数参数\n\nJavaScript 不检查传递给函数的参数是否与函数的签名匹配。例如：\n\
    \n* 你可以向函数传递比它预期的数量更多的参数；在这种情况下，额外的参数将被忽略。\n* 你可以向函数传递比它预期的更少的参数；在这种情况下，缺失的参数将是\
    \ `undefined`。\n\n"
- fmt: "\nOn the face of it this all seems to make sense. There are however good reasons\
    \ why we may wish to access function scoped variables even after functions complete.\
    \ We do not however want to make these variables global variables (as we could\
    \ do by omitting the `var` keyword on the variable declaration). This can be achieved\
    \ via closures.\n\nConsider the following code:\n\n```javascript\nfunction f2()\
    \ {\n  var i = 0;\n  return function() {\n    return ++i;\n  };\n}\n```\n\nThis\
    \ function does the following:\n\n1. Declares a function scoped variable called\
    \ `i` initialized to the value 0.\n2. Returns a function that will increment this\
    \ variable when invoked.\n\nWe can therefore call this function and assign the\
    \ result (which is a function) to a variable:\n\n```javascript\nincrementer =\
    \ f2()\n```\n\nBased on our explanation of the function scoped variables above,\
    \ you would expect that the variable declared inside `f2` would be destroyed when\
    \ the function call `f2` completed. Therefore, when we invoke the function that\
    \ was returned from `f2`, there would be no `i` variable for it to access (since\
    \ it has been destroyed). This is not the case:\n\n```javascript\nincrementer()\n\
    1\nincrementer()\n2\nincrementer()\n3\n```\n\nWhen the anonymous function was\
    \ defined inside function `f2` it “closed” over its environment as it existed\
    \ at that point of time, and kept a copy of that environment. Since the variable\
    \ `i` was accessible when the function was declared, it is still available when\
    \ the function is invoked. JavaScript has realized that the anonymous function\
    \ refers to the variable `i`, and that this function has not been destroyed, and\
    \ therefore it has not destroyed the `i` variable it depends on.\n\nIf we construct\
    \ another function using the same mechanism:\n\n```javascript\nincrementer2 =\
    \ f2()\n```\n\nThis will also have access to a variable called `i` as it existed\
    \ when the function was created, but it will be a new version of that variable:\n\
    \n```javascript\nincrementer2()\n1\nincrementer2()\n2\nincrementer2()\n3\n```\n\
    \nThis may look like a simple quirk of the language, but it is an incredibly powerful\
    \ feature.\n\nJavaScript by default is not very good at hiding data. It is not\
    \ possible to declare properties as private inside an object. For instance, consider\
    \ the following object that provides the same basic “incrementer” functionality:\n\
    \n```javascript\nobj1 = {i: 0,\nincrement: function() {\n  return ++this.i;\n\
    \  }\n}\n```\n\nThis appears to work correctly:\n\n```javascript\nobj1.increment()\n\
    1\nobj1.increment()\n2\nobj1.increment()\n3\n```\n\nThere is a potential problem\
    \ here though. Anyone with a reference to this object can change the current value\
    \ of `i`:\n\n```javascript\nobj1.i = 20\n```\n\nOnce this is done, the next call\
    \ to increment the number will jump to 21:\n\n```javascript\nobj1.increment()\n\
    21\n```\n\nThis may be a big problem; it may be an even bigger problem if the\
    \ following occurs:\n\n```javascript\nobj1.i = \"hello world\"\n```\n\nNow the\
    \ next call will return the following:\n\n```javascript\nobj1.increment()\nNaN\n\
    ```\n\nThe closure-based implementation solves this problem. There is no way to\
    \ modify the value of `i`, or impact the value returned by the function. If a\
    \ call to the function returns 5, the next call to the function is guaranteed\
    \ to return 6.\n\nData hiding (or encapsulation) is an enormously important concept\
    \ when writing large applications. It allows us to write code modules with well-defined\
    \ public interfaces (or APIs), while hiding (or encapsulating) the internal logic\
    \ and state from the caller. This reduces bugs, since code cannot accidentally\
    \ corrupt the state of the module.\n\nThe approach used to implement the closure-based\
    \ incrementer is a representation of a design pattern. A design pattern is a commonly\
    \ used, reusable approach to solving a common problem. This approach is referred\
    \ to as the `module` design pattern.\n\nThe module design pattern is also commonly\
    \ implemented by returning an object rather than a function. This allows the object\
    \ to use private variables for its private properties and functions, while still\
    \ exposing a series of public properties and methods. The functionality above\
    \ can be rewritten as follows:\n\n```javascript\nfunction createIncrementer()\
    \ {\n  var i = 0;\n  return {\n    increment: function() {\n      return ++i;\n\
    \    }\n  };\n}\n```\n\nWe can now create an incremeter object:\n\n```javascript\n\
    obj2 = createIncrementer();\n```\n\nOnce created, we now call the increment method,\
    \ and consistently receive a value incremented by 1:\n\n```javascript\nobj2.increment()\n\
    1\nobj2.increment()\n2\nobj2.increment()\n3\n```\n\nWe can attempt to change the\
    \ internal state of the object by calling the following:\n\n```javascript\nobj2.i\
    \ = 10\n```\n\nbut all this will do is create a new property on the object:\n\n\
    ```javascript\nobj2.i\n10\n```\n\nThis is not the same property that is being\
    \ used as the incrementing state of the object:\n\n```javascript\nobj2.increment()\n\
    4\nobj2.increment()\n5\nobj2.increment()\n6\n```\n\n## Scope and “this”\n\nIn\
    \ order to fully understand a language, you must understand its approach to scoping\
    \ variables. Understanding scope tells us when various variables are available\
    \ within the program, and which variable is used if there are multiple variables\
    \ available with the same name.\n\nLet’s start with a simple example:\n\n```javascript\n\
    function getNumber() {\n  num = 10;\n  return num;\n}\n```\n\nThis is a function\
    \ that always returns the same number: 10.\n\n```javascript\ngetNumber()\n10\n\
    getNumber()\n10\n```\n\nWhen this function finishes, it may seem that the variable\
    \ `num` would not be available based on our discussion of function variables earlier\
    \ in this chapter. This is not the case:\n\n```javascript\nnum\n10\n```\n\nThis\
    \ is because we forgot to use `var` declaring the variable. If we had done the\
    \ following, the variable `num` would have existed:\n\n```javascript\nfunction\
    \ getNumber() {\n  this.num = 10;\n  return num;\n}\n```\n\nDue to the fact `var`\
    \ was omitted, the `num` variable was added to the object represented by `this`.\
    \ Within a function, `this` refers to a special object called `window`. You can\
    \ see this by typing `this` in the console:\n\n```javascript\nthis\nWindow{top:\
    \ Window, window: Window, location: Location, external: Object, chrome: Object}\n\
    ```\n\nStrictly speaking this is not true; it is only true of functions executed\
    \ in a browser environment. JavaScript written in side applications will use a\
    \ different object than `window` for the global scope.\n\nIn fact, this function\
    \ could have been written as:\n\n```javascript\nfunction getNumber() {\n  this.num\
    \ = 10;\n  return this.num;\n}\n```\n\nThe `window` object is a global object\
    \ that contains information about the browser environment, but is also the object\
    \ that properties are added to by default within functions. The `window` object\
    \ is available to any code in the web page (including external libraries), and\
    \ therefore it is referred to as global scope. Adding properties to the `window`\
    \ object is dangerous in any moderately sized application. Since the global properties\
    \ can be read and written by any piece of code, there is a significant possibility\
    \ that other code will accidentally overwrite your variables.\n\nIf you do need\
    \ to create global variables (and the sample application will create a couple),\
    \ it is often a good idea to create a single object in the `window` to hold all\
    \ the variables for your application:\n\n```javascript\nwindow.THEAPP = {};\n\
    window.THEAPP.myproperty = 'myvalue';\n```\n\nAs mentioned earlier, the `this`\
    \ variable takes on a different meaning inside an object’s method:\n\n```javascript\n\
    obj = { num: 10,\nadd: function(num2) {\n  this.num += num2;\n  return this.num;\n\
    }\n}\n```\n\nThis is a very simple object that contains a `num` property initialized\
    \ to 10. It also exposes an `add` method that adds the parameter passed in to\
    \ this property and returns the result:\n\n```javascript\nobj.add(10)\n20\nobj.add(10)\n\
    30\n```\n\nYou will notice that `this` inside an object method refers not to the\
    \ global `window` object, but to the object itself.\n\nLet’s take this one step\
    \ further:\n\n```javascript\nobj = { num: 10,\nadd: function(num2) {\n helper\
    \ = function(num2) {\n  this.num += num2;\n  return this.num;\n }\n return helper(num2);\n\
    \ }\n}\n```\n"
