  trans: "\n即使如此，严格来说这并不是处理过程的真实写：中间操作是惰性的（lazy）。在调用终端操作之前，中间操作不会执行——因此，是由于第一个数字（5）执行\
    \ `forEach` 方法，触发了 `filter` 方法的调用。\n\n这种方法意味着整个流水线可以在集合的单次迭代中完成处理，对于大数据集，这可以显著提高性能。它也意味着流（stream）在执行处理时不需要保留列表中的所有元素。\n\
    \n最后一点非常重要。Streams 的另一种实现方式是对所有元素调用 `filter` 操作并将这些元素捕获到一个 `Collection` 中——一旦捕获了这些元素，就可以将它们传递给\
    \ `forEach` 方法。我认为显而易见，这种实现实现在内存利用率或处理器利用率方面的效率也不会那么高。\n\n为了亲眼看到这一过程，我们将按照所示重写\
    \ `main` 方法：\n\n```java\npublic static void main(String[] args) {\n    List<Integer>\
    \ l = Arrays.asList(5,4,88,76,55,23,7,20,45);\n    Stream<Integer> s = l.stream().filter(p\
    \ -> {\n        System.out.println(\"Filter called on \"+ p);\n        return\
    \ p%2==1;\n    });\n    System.out.println(\"The pipeline is created - calling\
    \ terminal operation\");\n    s.forEach(i -> System.out.println(\">>>\" + i));\n\
    }\n```\n\n这产生了以下结果：\n\n```\nThe pipeline is created - calling terminal operation\n\
    Filter called on 5\n>>>5\nFilter called on 4\nFilter called on 88\nFilter called\
    \ on 76\nFilter called on 55\n>>>55\nFilter called on 23\n>>>23\nFilter called\
    \ on 7\n>>>7\nFilter called on 20\nFilter called on 45\n>>>45\n```\n\n注意输出的第一行：尽管它在\
    \ `filter` 方法似乎被调用之后才被打印，但它实际上是第一个显示的打印语句，证明了这一行是先执行的。这表明即使我们的代码结构跨越多个语句，`Stream`\
    \ 仍然通过单次遍历处理了 `Collection`。\n\n惰性调用方法还有另一个主要优势。假设我们只想找到列表中的第一个奇数。这可以通过名为 `findFirst`\
    \ 的另一种终端操作来实现：\n\n```java\npublic static void main(String[] args) {\n    List<Integer>\
    \ l = Arrays.asList(5,4,88,76,55,23,7,20,45);\n    Stream<Integer> s = l.stream().filter(p\
    \ -> {\n        System.out.println(\"Filter called on \"+ p);\n        return\
    \ p%2==1;\n    });\n    Optional<Integer> result = s.findFirst();\n    System.out.println(result.get());\n\
    }\n```\n\n此示例输出了以下结果：\n\n```\nFilter called on 5\n5\n```\n\n列表中的第一个元素是奇数，因此这是唯一需要处理的元素。\n\
    \n这个示例还有另一个有趣的的方面。`findFirst` 方法返回的不是 `Integer`，而是 `Optional<Integer>`。你会在整个 Streams\
    \ API 中发现对 `Optional` 类的引用：它为一个可能为空的值提供了一个容器。该类支持一个名为 `isPresent` 的方法，用于判断容器是否持有非空值。\n\
    \n`Optional` 类还支持如 `map` 和 `filter` 等方法，允许在需要时通过 lambda 表达式修改值。也没有什么阻止你从自己的代码中返回\
    \ `Optional` 实例，这可能证明是扩展你 API 价值的一种有用机制。\n\n在继续之前，关于 Streams 还有几点需要说明。首先，一旦流处理了它的元素，就不能被重用。例如，在上面的示例中，在\
    \ `forEach` 操作执行后，我们无法在 `filter` 返回的 `Stream` 上调用另一种终端操作。技术上流是可以关闭的，但没有理由显式地关闭它们。\n\
    \n其次，Streams 必须是非干涉的：它们不能更改 `Stream` 的源（上述示例中的列表）。\n\n我们现在转向一个稍微复杂的示例，并演示流水线如何包含多个中间步骤。假设我们想执行以下操作：\n\
    \n* 从列表中过滤掉偶数\n* 将剩余的每个数字乘以自身\n* 将这些数字相加\n\n在这种情况下，前两步将是中间操作，而求和操作将是终端操作。可以通过如下方式实现：\n\
    \n```java\ndouble result = l.stream()\n.filter(p -> p%2==1)\n.mapToInt(p -> p\
    \ * p)\n.sum()\n```\n\n上面的 `filter` 方法看起来很熟悉，由于它返回一个 `Stream<Integer>`，我们显然可以在结果上执行其他中间操作。\n\
    \n执行的下一个中间操作是 `mapToInt`。这与 `filter` 操作略有不同：它提供了一种转换数据的方式。传递给 `mapToInt` 的 lambda\
    \ 表达式接受任何类型的对象作为输入，并返回一个整数结果。在这种情况下，输入参数也是整数，但这不是强制要求的：我们可以传递一个 `Person` 对象作为参数，并返回工资字段（如果它是整数的话）。\n\
    \n传递给 `mapToInt` 的 lambda 表达式简单是将输入参数乘以自身并隐式地返回结果。\n\n`mapToInt` 的另一个有趣点是，它不是返回\
    \ `Stream<Integer>` 对象，而是实际上返回 `IntegerStream`。这种差别可能很小，但 `IntegerStream` 提供了一套专门用于整数值的聚合操作，包括\
    \ `min`、`max`、`average` 以及我们使用的 `sum`。\n\nStreams API 还支持 `DoubleStreams`（通过 `mapToDouble`）和\
    \ `LongStreams`（通过 `mapToLong`）。它们与 `IntegerStream` 具有相同的聚合操作。\n\nStreams 还支持通用的\
    \ `map` 操作，将任何类型的对象转换为任何类型，但此方法简单返回 `Stream<T>`，其中 `T` 是 `map` 操作的类型。\n\n`sum`\
    \ 方法是一种被称为归约的终端操作：它接收一组值并将它们归约为值。如果我们选择，也可以自己实现 `reduce` 方法：\n\n```java\nl.stream()\n\
    .filter(p -> p%2==1)\n.mapToInt(p -> p * p)\n.reduce((a, b) -> a + b)\n```\n\n\
    `reduce` 算法通过将列表中的两个元素传递给提供的 lambda 表达式开始。该操作的结果将与第三个元素一起传递给 lambda 表达式，直到处理完元素。以下是传递\
    \ `reduce` lambda 表达式的值输出：\n\n```\na = 25, b = 3025\na = 3050, b = 529\na = 3579,\
    \ b = 49\na = 3628, b = 2025\n```\n\n（有 5 个奇数，所以表达式被调用了 4 次）。\n\n`reduce` 方法返回\
    \ `OptionalInt` 实例，因为 `filter` 方法可能从 `Stream` 中移除所有元素。\n\n`reduce` 操作接受符合 `BinaryOperator`\
    \ 函数式接口的 lambda 表达式。该接口有一个接受两个参数并返回相同类型参数的方法：\n\n`R apply(T t, U u)`\n\n因此，我们可以重用\
    \ Java 8 为 `Integer`（以及其他数字包装类型）的新的静态辅助方法：\n\n```java\npublic static int sum(int\
    \ a, int b)\n```\n\n如下所示：\n\n```java\nl.stream()\n.filter(p -> p%2==1)\n.mapToInt(p\
    \ -> p * p)\n.reduce(Integer::sum)\n```\n\n注意 `sum` 方法是静态的，因此我们不需要 `Integer` 实例来调用\
    \ `sum` 方法。\n\n`reduce` 操作还可以接受一个可选的第一个参数，代表聚合的初始值：\n\n```java\nl.stream()\n.filter(p\
    \ -> p%2==1)\n.mapToInt(p -> p * p)\n```\n"
- fmt: "\n```\n.reduce(100, (a, b) -> a + b)\n```\n\nThis example will return 100\
    \ more than the previous example.\n\nIf omitted, this uses the default value for\
    \ the data-type returned, e.g. `0` for numbers.\n\n## Collecting\n\nAnother useful\
    \ terminal operation is collecting. Collecting provides a mechanism for accumulating\
    \ or summarizing elements based on a set of criteria.\n\nAs an example, consider\
    \ a list of the `Person` class from earlier in the book. We may want to group\
    \ all the `Person` instances together where the `firstName` is equal – this could\
    \ be achieved as follows:\n\n```java\npackage streams;\n\nimport java.util.Arrays;\n\
    import java.util.List;\nimport java.util.Map;\nimport java.util.stream.Collectors;\n\
    \npublic class Collecting {\n public static void main(String[] args) {\n List<Person>\
    \ people = Arrays.asList(\n new Person(\"Albert\", \"Smith\"),\n new Person(\"\
    John\", \"James\"),\n new Person(\"John\", \"Brown\"),\n new Person(\"William\"\
    , \"Hughes\"),\n new Person(\"William\", \"Fleming\")\n );\n Map<String, List<Person>>\
    \ groupedMap = people.stream()\n .collect(Collectors.groupingBy(Person::getFirstName));\n\
    \ System.out.println(groupedMap.get(\"William\"));\n }\n}\n```\n\nThis `groupingBy`\
    \ operation returns a `Map` where the keys are the distinct values for first name\
    \ (William, John, Albert), and the values are `Lists` of the `Person` classes\
    \ matching that key.\n\nSince the final line accesses the `List` held against\
    \ the `William` key, this will print out:\n\n`[William Hughes, William Fleming]`\n\
    \nThe `collect` method accepts a `Collector`. These can be generated via a set\
    \ of static helpers on the `Collectors` class - in this case we are using the\
    \ `groupingBy` `Collector`, and specifying the method that should be used for\
    \ comparison. The appropriate `Collector` instance will then be generated for\
    \ us.\n\nOnce elements have been grouped it is common to run an aggregation operation\
    \ on each group (for instance, count how many elements are in each group). The\
    \ `groupingBy` methods therefore accept a second parameter for performing aggregate\
    \ operations. As an example we will process all the time zones available in Java\
    \ (we will see these again later in the book when we look at the new Date and\
    \ Time API): these can be obtained as an array from `TimeZone.getAvailableIDs()`.\
    \ These exist in the form:\n\nAfrica/Asmara\nEurope/London\n\nWhere the optional\
    \ first portion (Europe, Africa) represents a grouping mechanism, and the portion\
    \ after the forward slash represents a specific value.\n\nWe will write a program\
    \ that performs the following:\n\n- Filters out any zones that don’t have a forward\
    \ slash in them\n- Groups the zones by their group (e.g. Europe, Africa)\n- Counts\
    \ how many zones are in each group\n\nThis can be performed in a single line as\
    \ follows:\n\n```java\npackage streams;\n\nimport java.util.Arrays;\nimport java.util.Map;\n\
    import java.util.TimeZone;\nimport java.util.stream.Collectors;\n\npublic class\
    \ Collecting5 {\n public static void main(String[] args) {\n Map<String, Long>\
    \ result =\n Arrays.asList(TimeZone.getAvailableIDs())\n .stream()\n .filter(s\
    \ -> s.indexOf(\"/\") > 0)\n .collect(Collectors.groupingBy((String s) -> s.substring(0,\
    \ s.indexOf(\"/\")),\n Collectors.counting()));\n System.out.println(result);\n\
    \ }\n}\n```\n\nNotice the use of `Collectors.counting()` as the second parameter\
    \ to the `groupingBy` method. This itself is a `Collector`, and processes the\
    \ result of the group by. The `counting` method (unlike the `groupingBy` method)\
    \ does not need any other information in order to generate a `Collector` – since\
    \ it operates on a data-structure in the format returned by the `groupingBy` method\
    \ (a `Map` with `Lists` as its values).\n\nThis outputs the following:\n\n`{Europe=59,\
    \ Africa=54, SystemV=13, Canada=9, Pacific=42, Etc=35, Asia=91, America=164, Brazil=4,\
    \ Mexico=3, Indian=11, Antarctica=11, Chile=2, Australia=23, Arctic=1, Atlantic=12,\
    \ US=13}`\n\nPartitioning is another form of `Collector` that is similar to `groupingBy`.\
    \ As discussed earlier, `filter` operations return true or false for all elements\
    \ in the stream. Partitioning provides a mechanism to collect all the values that\
    \ are true into one `List`, and all the values that are false into another `List`.\
    \ In this example we will create two lists: one for the time zones that have a\
    \ “/” in their name (e.g. America/Cancun), and one for the zones that don’t (e.g.\
    \ Greenwich)\n\n```java\npackage streams;\n\nimport java.util.Arrays;\nimport\
    \ java.util.List;\nimport java.util.Map;\nimport java.util.TimeZone;\nimport java.util.stream.Collectors;\n\
    \npublic class Collecting4 {\n public static void main(String[] args) {\n List<String>\
    \ zones = Arrays.asList(TimeZone.getAvailableIDs());\n Map<Boolean, List<String>>\
    \ zonesCompare =\n zones.stream()\n .collect(Collectors.partitioningBy(s -> s.indexOf(\"\
    /\") > 0));\n System.out.println(zonesCompare);\n }\n}\n```\n\nAnother good example\
    \ of `Collecting` is adding a comma between every word in a `List`. I have previously\
    \ used Apache Common's `StringUtils.join` method for this, since it is tedious\
    \ to code yourself. The trick to joining is that the comma (or other delimiter)\
    \ should not occur after the last element, therefore it is hard to achieve with\
    \ simple iteration.\n\nJoining can easily be achieved with Streams as follows:\n\
    \n```java\npackage streams;\n\nimport java.util.Arrays;\nimport java.util.List;\n\
    import java.util.stream.Collectors;\n\npublic class Collecting {\n public static\
    \ void main(String[] args) {\n List<String> strings = Arrays.asList(\"This\",\
    \ \"is\", \"a\", \"list\");\n String s = strings.stream()\n .collect(Collectors.joining(\"\
    , \"));\n System.out.println(s);\n }\n}\n```\n\nThis takes advantage of the `joining`\
    \ Collector, which accepts the parameter that should be placed between each element.\
    \ This prints out:\n\n`This, is, a, list`\n\nNotice that this does not contain\
    \ a comma after the last element.\n\n`Collectors` can also be used for collecting\
    \ the results of a pipeline into a new `Collection` such as `List` or `Set`. This\
    \ can be achieved as follows:\n\n```java\npackage streams;\n\nimport java.util.Arrays;\n\
    import java.util.List;\nimport java.util.Map;\nimport java.util.stream.Collectors;\n\
    \npublic class Collecting {\n public static void main(String[] args) {\n List<Person>\
    \ people = Arrays.asList(\n new Person(\"Albert\", \"Smith\"),\n new Person(\"\
    John\", \"James\"),\n new Person(\"John\", \"Brown\"),\n new Person(\"William\"\
    , \"Hughes\"),\n new Person(\"William\", \"Fleming\")\n );\n List<Person> filteredList\
    \ = people.stream()\n .filter(p -> p.getFirstName().equals(\"William\"))\n .collect(Collectors.toList());\n\
    \ System.out.println(filteredList);\n }\n}\n```\n\nThis filters out all the `Person`\
    \ instances where the first name is “William”, and adds the result to a new list.\n\
    \n## Other operators\n\nThe Streams API is a large API, and will take some time\
    \ to learn in its entirety. The following are potentially the most useful intermediate\
    \ operations provided by the Streams API that have not been introduced until now:\n\
    \n- `distinct`: removes any duplicate elements (based on the `equals` implementation)\
    \ from the stream\n- `limit`: limit the elements in the stream to a specific number.\
    \ This could be useful for processing search results if only a maximum of 100\
    \ results were to be shown. It can also result in performance improvements since\
    \ it allows you to reduce the elements in the stream mid-way through the pipeline.\n\
    - `map`: this is a generic version of the `mapToInt` method seen above. It takes\
    \ each element in turn and returns a value (potentially of a different type) based\
    \ on some transformation.\n- `sorted`: this provides a mechanism for sorting the\
    \ elements, either based on natural order or a `Comparator`. This can be called\
    \ anywhere in the pipeline prior to the terminal operation, so it is useful when\
    \ a `map` operation may have resulted in an unordered stream.\n\nThe following\
    \ are the most useful terminal operators available on Stream not discussed in\
    \ the sections above (as discussed above, specialized streams such as `DoubleStream`\
    \ contain additional terminal operators):\n\n- `allMatch`: this accepts a `Predicate`\
    \ and returns true if all elements return true from the predicate\n"
