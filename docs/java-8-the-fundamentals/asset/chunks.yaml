  trans: "\n本节将提供对 JavaScript 的深入概述，包括它的优点和缺点。本章的目的是让你对 JavaScript 基础有深入的理解，并关注这种语言*应该*如何被使用，而不是它*可以*如何被使用。\n\
    \nJavaScript 是一种特别灵活的语言，它对用户没有强制过多的纪律或结构。此外，JavaScript 包含许多只能真正被视为 bug 的特性。这些特性之所以留在语言中，主要是出于向后兼容性的考虑。\n\
    \n为了编写大型 Web 应用程序，必须利用 JavaScript 的优势，同时避免那些不理解语言基础、没有以兼容代码库增长的方式构建应用程序的软件工程师和程序员可能会遇到的陷阱。\n\
    \n## Types\n\n对 JavaScript 的任何理解都始于对其数据类型以及这些类型如何使用的理解。\n\nJavaScript 具有以下数据类型：\n\
    \n• String（字符串）\n• Number（数字）\n• Boolean（布尔值）\n• Null（空）\n• Undefined（未定义）\n•\
    \ Object（对象）\n\n其中每一种将在下面的章节中进行介绍。\n\n### Strings（字符串）\n\n字符串是用单引号或双引号括的字符序列：\n\
    \n```\n\"hello world\"\n\"hello world\"\n'hello world'\n\"hello world\"\n```\n\
    \n上面的示例被称为字符串字面量。我们也可以将字符串赋值给变量：\n\n```\ns = 'Hello world'\n\"Hello world\"\n\
    ```\n\n在使用控制台时，变量不会用 `var` 关键字声明。正如你将在下面看到的，在编写实际的 JavaScript 代码时，在大多数情况下使用它是至关重要的。\n\
    \n我们然后可以使用 `typeof` 运算符检查此变量的类型：\n\n```\ntypeof s\n\"string\"\n```\n\n虽然字符串是它们自己的数据类型，但我们可以在它们上调用方法，正如我们在下面的对象中可以看到可以在对象上调用方法一样。\n\
    \n```\ns.charAt(1)\n\"e\"\n\ns.substr(6)\n\"world\"\n\ns.toUpperCase()\n\"HELLO\
    \ WORLD\"\n```\n\n此外，字符串具有可以访问的属性，正如我们在下面的对象示例看到的那样：\n\n```\ns.length\n11\n```\n\
    \nJavaScript 字符串在很大程度上等于 Java 中的字符串。这的结果之一是字符串是不可变的。\n\n不可变对象是指在首次创建后无法更改的对象。即使这些对象看起来发生了变化（如下下面的示例所示），实际上是创建了一个新对象。\n\
    \n为了看到不可变性，声明一个名为 `t` 的新变量，并将 `s` 的值赋值给它：\n\n```\nt = s\n\"Hello world\"\n```\n\
    \n我们现在可以打印 `t` 的值，并确认 `t` 和 `s` 是相等的：\n\n```\nt\n\"Hello world\"\n\ns == t\ntrue\n\
    ```\n\n如果我们修改赋值给变量 `s` 的字符串会发生什么？我们可以使用 `+=` 运算符向字符串值追加内容：\n\n```\ns += 'test'\n\
    \"Hello worldtest\"\n```\n\n如果你现在打印 `s` 的值，你会发现字符串的值似乎发生了变化：\n\n```\ns\n\"Hello\
    \ worldtest\"\n```\n\n尽管如此，如果你打印 `t` 的值，它仍然保留了旧值：\n\n```\nt\n\"Hello world\"\n\
    ```\n\n当我们向赋值给变量 `s` 的字符串追加“test”时，底层的字符串并没有被修改；而是创建了一个新字符串并赋值给变量 `s`。由于 `t` 仍然指向原始字符串，因此它不受修改的影响。\n\
    \n### Numbers（数字）\n\n数字类型用于表示整数和浮点数值；事实上，JavaScript 中的所有数字都是 64 位浮点数：\n\n```\n\
    n = 6.827\n6.827\n\ntypeof n\n\"number\"\n\nn2 = 6\n6\n\ntypeof n2\n\"number\"\
    \n```\n\n由于所有数字都是浮点数，两个整数之间的操作可以返回浮点数结果（与 Java 不同）。\n\n```\n1/3\n0.3333333333333333\n\
    ```\n\n除了实数外，JavaScript 还支持一些特殊值。\n\n“Not a number”（数字）用于算术运算产生的结果不是数字的情况。令人困惑的是，这种类型仍然是\
    \ `number`。\n\n```\na = 9/undefined\nNaN\n\ntypeof a\n\"number\"\n```\n\n如果 JavaScript\
    \ 在这种情况下生成一个错误可能会更有用。\n\n它还支持负无穷和正无穷大，它们通常在除以 0 时生成：\n\n```\nb = 6/0\nInfinity\n\
    \nb == Number.POSITIVE_INFINITY\ntrue\n\nc = -6/0\n-Infinity\n\nc == Number.NEGATIVE_INFINITY\n\
    true\n```\n\n再次，大多数编程语言在整数除以 0 时会产生错误，但由于这些是浮点数，它们遵循返回无穷大的 IEEE 标准。\n\nJavaScript\
    \ 还原生支持一个 `Math` 库，其模型几乎与 Java 的对应部分完全相同。该库提供了大多数数学函数。\n\n```\nMath.pow(3, 2)\n\
    9\n\nMath.round(3.22)\n3\n```\n\n### Booleans（布尔值）\n\nJavaScript 支持一种布尔类型，包含字面量值\
    \ `true` 和 `false`：\n\n```\nt = true\ntrue\n\ntypeof t\n\"boolean\"\n\nf = false\n\
    false\n```\n\n JavaScript 中的等比较运算符（`>`, `<`, `==`, `!=`, `>=`, `<=`）也返回布尔值作为结果：\n\
    \n```\nf != t\ntrue\n```\n\n### Null（空）\n\nNull 是一种数据类型。\n\nNull 是一个表示空对象的类型：尽管它具有单一值。\n\
    \n```\nn = null\nnull\n```\n\n令人困惑的是，这种类型被认为是 `object`：\n\n```\ntypeof n\n\"object\"\
    \n```\n\n### Undefined（未定义）\n\n当你访问一个不存在对象的属性，或者在变量声明之前使用它，或者在赋值之前，会返回 `undefined`\
    \ 数据类型：\n\n```\ntypeof g\n\"undefined\"\n```\n\n### Objects（对象）\n\n除了上述类型外，JavaScript\
    \ 中的所有数据类型都是对象：这包括数组、函数和日期。对象将在下面的章节中详细讨论。\n\n### Truthy and Falsey Values（真值和假值）\n\
    \n现在你理解了 JavaScript 数据类型，下一步需要理解的是某些值求结果为 `true`，而某些值求结果为 `false`。例如，以下所有都被视为\
    \ `false`：\n\n• false\n• 0（零）\n• \"\"（空字符串）\n• null\n• undefined\n• NaN\n\n为了看到这种效果，只需在控制台中询问它们是否等于\
    \ `false`：\n\n```\n0 == false\ntrue\n```\n\n所有其他值都代表 `true` 值。\n\n由于这种结果，在条件语句中评估变量值时，可以使用快捷方法。而不是编写以下代码：\n\
    \n```javascript\nif (a == undefined || a == null) {\n  a = 1;\n}\n```\n\n你可以简单地写成：\n\
    \n```javascript\nif (!a) {\n  a = 10\n}\n```\n\n同样，如果你只想在变量有值时使用它，可以这样写：\n\n```javascript\n\
    if (s) {\n console.log(s)\n}\n```\n\n这种快捷方法非常有用，并且在 JavaScript 代码中被广泛使用。\n\n最后应该理解的是哪些值之间是相等的；以下内容可能会让你感到惊讶：\n\
    \n```\nnull == undefined\ntrue\n\n5 == \"5\"\ntrue\n\n\"true\" == true\nfalse\n\
    \n\"1\" == true\ntrue\n\n\"2\" == true\nfalse\n```\n\n在上面的示例中存在许多不一致之处，再次，这些通常是\
    \ bug 而不是特性。`Null` 不应该被认为与 `undefined` 相等，尽管它们都是假值，但代表了完全不同的数据类型和含义。\n\n幸运的是，JavaScript\
    \ 包含一对替代的等比较运算符：\n\n===\n\n!==\n\n这些运算符根据值及其数据类型对变量进行比较，因此提供了更符合预期的结果：\n\n```\n\
    null === undefined\nfalse\n\n5 === \"5\"\nfalse\n\n\"true\" === true\nfalse\n\n\
    \"1\" === true\nfalse\n```\n"
- fmt: "\nIt is best practice to always use these equality operators unless you consciously\
    \ want to compare two values you know have different data types.\n\nIf you want\
    \ to know whether any value is true or false in a Boolean sense, you can print\
    \ it out by prepending `!!` to it. A single `!` will negate a Boolean value, while\
    \ `!!` provides a double negative, and therefore prints out the Boolean value\
    \ of any value:\n\n```\n!!\"\"\nfalse\n!!\"hello\"\ntrue\n```\n\n### Dynamic Typing\n\
    \nFinally, it is worth reiterating that JavaScript is a dynamically typed language.\n\
    \nLanguages such as `Java` and `C++` are statically typed languages. In statically\
    \ typed languages, all variables are assigned a type at compile time, and this\
    \ type cannot be changed.\n\nThe terms `strong` and `weak` typing are sometimes\
    \ used to refer to statically typed and dynamically typed languages respectively.\n\
    \nIn a statically typed language, the compiler can perform type checking: if a\
    \ variable is defined to store an integer, the compiler can check that it is not\
    \ assigned a string. This catches many causes of bugs before they can become an\
    \ issue at run-time.\n\nAs we have seen, JavaScript variables derive their types\
    \ based on the values they are assigned at run-time, and variables can change\
    \ their type if they are assigned a new value. As a result it is not possible\
    \ to perform static type checking in JavaScript, e.g. to ensure a string is not\
    \ provided where a number is expected.\n\nConsider the following function that\
    \ adds two numbers together:\n\n```javascript\nfunction add(v1, v2) {\n  return\
    \ v1+v2;\n}\n```\n\nIf you invoke this function with two numbers, the result is\
    \ as expected:\n\n`add(1,1)`\n`2`\n\nIf you accidentally pass a string as one\
    \ of the parameters however, the result is very different:\n\n`add(1,\"1\")`\n\
    `\"11\"`\n\nInstead of adding the numbers, JavaScript has performed string concatenation\
    \ between the number and the string. It is unlikely that this is the result expected.\
    \ This is one reason why the `typeof` operator is so important in JavaScript,\
    \ it allows the function above to be rewritten as follows:\n\n```javascript\n\
    function add(v1, v2) {\n  if (typeof v1 === \"number\" && typeof v2 === \"number\"\
    ) {\n    return v1+v2;\n  } else {\n    throw \"both arguments must be numbers\"\
    ;\n  }\n}\n```\n\nThis at least ensures data type issues will be identified at\
    \ run-time, even if it does not highlight these issues to the programmer who wrote\
    \ the code allowing the function to be called incorrectly.\n\nUsing the `+` operator\
    \ on different data types produces a variety of random results in JavaScript:\n\
    \n`{} + [] = 0`\n`[] + {} = Object`\n\nEven using the `+` operator on the same\
    \ data types can produce meaningless results:\n\n`[] + [] = empty string`\n`{}\
    \ + {} = NaN`\n\nIt is hard to make sense of any of these results.\n\nIn addition,\
    \ the `-` operator should only be used on numbers:\n\n`“a” + 1 = “a1\"`\n`“a”\
    \ – 1 = NaN`\n\nThere are many arguments for and against dynamically typed languages.\
    \ This book will not address these arguments, but it is safe to conclude that\
    \ dynamic typing has advantages, but those come at the risks of run-time bugs.\n\
    \n### Objects\n\nJavaScript also supports objects; in fact, most values in JavaScript\
    \ applications will be objects. JavaScript also supports syntax for defining classes\
    \ that objects can be instantiated from. This may lead you to think JavaScript\
    \ is a conventional object orientated language – this would be a mistake.\n\n\
    In classical object orientated languages such as `Java` and `C#`, classes must\
    \ be defined before objects can be instantiated from them. It is never possible\
    \ to have an object that is not a type of a specific class.\n\nClasses are static\
    \ templates that contain definitions of the properties and methods that objects\
    \ will contains. During program execution, instances of these classes are created:\
    \ these are called objects. All objects instantiated from the same class have\
    \ the same properties and methods, although the values assigned to properties\
    \ will differ from instance to instance.\n\nWhen designing applications with a\
    \ classical object orientated language you may find cases where you would like\
    \ some objects to contain additional properties or methods, even though they are\
    \ similar in other respects created by an existing class. For instance you may\
    \ have started with a class called `Vehicle` which contained the following properties:\n\
    \n1. Registration number\n2. Initial year of registration\n3. Make of vehicle\n\
    4. Model of vehicle\n\nObjects can be instantiated from this class, and will contain\
    \ four properties to which values can be assigned.\n\nThis book will use the term\
    \ `property` to refer to the state of an object. Other languages may call these\
    \ fields or attributes.\n\nYou may subsequently decide that you would like to\
    \ capture more information about trucks, for instance:\n\n1. Number of axles\n\
    2. Towing capacity\n\nYou cannot simply add these new properties to objects that\
    \ have been created from the `Vehicle` class; you must first create a new class\
    \ (called `Truck`), and extend the `Vehicle` class. Only when the class structure\
    \ is in place can you begin creating instances of `Truck`.\n\nA further feature\
    \ of classes is that they must be defined when the application is compiled; they\
    \ cannot be defined on the fly at run-time. It is not possible to decide midway\
    \ through program execution that you would like to start capturing an additional\
    \ property on some objects.\n\nJavaScript has a far more flexible attitude to\
    \ classes and objects, in fact classes are not essential to JavaScript programming\
    \ at all.\n\nThe simplest way you can create a new object in JavaScript is as\
    \ follows:\n\n`obj = {}`\n\nThe `typeof` operator confirms that the `obj` variable\
    \ is indeed an object:\n\n`typeof obj`\n`\"object\"`\n\nIf you are familiar with\
    \ classical object orientated languages you may wonder what type `obj` is? This\
    \ object is not of any type; it is just an object.\n\nIt may sound difficult to\
    \ write code without knowing the type. For instance, if a function is passed an\
    \ object without knowing its type, how does it know what to do with it?\n\nJavaScript\
    \ uses an approach colloquially known as “duck typing”. There is an old saying,\
    \ “if it walks like a duck, and swims like a duck, and quacks like a duck, it\
    \ probably is a duck”. Likewise, in JavaScript we might say “If it has a registration\
    \ number property, and has a year of registration property, it probably is a vehicle”.\n\
    \nAn empty object with no properties or methods is not very useful. With JavaScript\
    \ however, it is possible to dynamically add properties and methods:\n\n```javascript\n\
    obj.firstName = 'John';\nobj.lastName = 'Smith';\nobj.age = 32;\nobj.increaseAge\
    \ = function() {\n  this.age++;\n}\n```\n\nFunctions inside objects are referred\
    \ to as methods. They are exactly the same as functions, except in the way they\
    \ treat an important variable called this. You may have also noticed the use of\
    \ `this` in the method above: this will be explained in full below.\n\nIf you\
    \ now look at the object in the JavaScript console you will see that it has a\
    \ set of properties with values assigned:\n\n```\nobj\nObject {firstName: \"John\"\
    , lastName: \"Smith\", age: 32, increaseAge: function}\n```\n\nThe reason this\
    \ is possible is because objects in JavaScript are really just associative arrays\
    \ (also known as hash maps in other languages). Associative arrays are supported\
    \ natively in most programming languages, and comprise a collection of name/value\
    \ pairs.\n\nIn order to access a property on a JavaScript object, simply use the\
    \ following notation:\n\n`obj.firstName`\n`\"John\"`\n\nJavaScript supports an\
    \ alternative syntax for accessing and setting properties that is even more evocative\
    \ of associative arrays in other languages.\n\n`obj['firstName']`\n`\"John\"`\n\
    \nThese approaches are not exactly equivalent. The second approach will work when\
    \ property names are not valid variables names. The dot notation on the other\
    \ hand will not work if:\n\n• The property starts with a number.\n• The property\
    \ contains a space or other special character except the underscore or $ sign.\n"
