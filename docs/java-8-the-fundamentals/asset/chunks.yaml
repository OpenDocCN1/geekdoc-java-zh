  trans: "\n\n```java\npublic interface Example {\n\n    void doSomething(Object obj);\n\
    }\n```\n\nLambda 表达式的一个显而易见的用途是回调。回调封装了一块代码，当指定事件发生时，由另一个代码块执行这块代码。该事件可能是用户点击屏幕上的按钮，也可能是接收到长时间运行事务的结果。\n\
    \n下面的示例创建了一个函数式接口来表示对象的打印。该接口的实例将作为回调传递给其他方法，允许它们按照初始调用者要求的方式打印操作结果：\n\n```java\n\
    package printing;\n\n@FunctionalInterface\npublic interface Printer {\n\n    void\
    \ print(Object obj);\n}\n```\n\n添加 `@FunctionalInterface` 注解可以确保编译器会检查该接口是否符合函数式接口的要求：如果接口包含除一个方法定义以外的任何内容，代码将无法编译。\n\
    \n一旦定义了函数式接口，我们就可以声明该类型的 lambda 表达式：\n\n```java\nPrinter printer = (Object o)\
    \ -> { System.out.println(\">>>\" + o); };\n```\n\n这行代码不会执行 lambda 表达式：它只是将其赋值给一个变量，以便在代码的后续部分使用。\n\
    \n如果你思考上面的那行代码，从 Java 的角度来看，它实际上是非常不常的。编译器通过对象赋值的类型来确定对象的类型。这与 Java 的正常工作方式相反：通常，一个表达式有一个类型，编译器判断该类型是否与被赋值的类型兼容。\n\
    \n如果你愿意，随后可以这样调用它：\n\n```java\nprinter.print(\"Hello World\");\n```\n\n通常，我们想将\
    \ lambda 表达式传递给另一个方法。以下是一个人为的示例，但它展示了基本技术：\n\n```java\npackage lambda;\n\nimport\
    \ printing.Printer;\n\npublic class Adder {\n\n    public static void main(String[]\
    \ args) {\n        int num1 = 10;\n        int num2 = 20;\n\n        Printer printer\
    \ = (Object o) -> {\n            System.out.printf(\"The result of %d and %d is\
    \ %d\\n\", num1, num2, o);\n        };\n\n        add(num1, num2, printer);\n\
    \    }\n\n    public static void add(int num1, int num2, Printer printer) {\n\
    \        int result = num1 + num2;\n        printer.print(result);\n    }\n}\n\
    ```\n\n这会在标准输出中打印以下内容：\n\nThe result of 10 and 20 is 30\n\n这是一个人为的示例，因为没有理由让 `add`\
    \ 方法不返回加法结果由 `main` 方法自己打印，但它开启了我们 lambda 表达式的大门。\n\n注意，这个 lambda 表达式使用了 `main`\
    \ 方法中的局部变量，尽管它最终在 `add` 方法中执行：稍后当我们调查 lambda 表达式运行的作用域时，我们会回到这个主题。\n\n事实上，大多数时候我们不需要定义自己的函数式接口，因为\
    \ Java 为我们提供了一套。我们可以通过移动到一个真实的示例来看这一点。\n\nlambda 表达式的一个常见用例是让方法将列表的每个元素传递给 lambda\
    \ 表达式（就像我们在章节开始时的 filter 示例一样）。Java 8 在 `List` 上提供了一个名为 `forEach` 的新方法，它接受 lambda\
    \ 表达式并隐式地将列表中的每个元素传递给它：它接受的 lambda 表达式必须符合 `Consumer` 函数式接口（`java.util.function.Consumer`）。这定义了以下方法：\n\
    \n```java\nvoid accept([T](http://download.java.net/jdk8/docs/api/java/util/function/Consumer.html\
    \ \"type parameter in Consumer\") t)\n```\n\n下面显示了一个基础示例：\n\n```java\npackage\
    \ lambda;\n\nimport java.util.Arrays;\nimport java.util.List;\nimport java.util.function.Consumer;\n\
    \npublic class Main {\n\n    public static void main(String[] args) {\n      \
    \  Consumer c = (Object o) -> { System.out.println(\">>>\" + o); };\n        List\
    \ l = Arrays.asList(\"Hello\", \"World\", \"Print\", \"My\", \"List\");\n    \
    \    l.forEach(c);\n    }\n}\n```\n\n这将产生以下输出：\n\n>>>Hello\n>>>World\n>>>Print\n\
    >>>My\n>>>List\n\n这是书中许多示例中的第一个，它使用了“隐式”而非“显式”迭代。诸如 `forEach` 等方法消除了程序员向编译器描述迭代过程的需要——它们隐式地执行迭代。这听起来像是一个微小的便利，但事实证明在书中后面将产生强大的影响。\n\
    \n我们当然可以将 lambda 表达式的声明和使用合并为一个步骤：\n\n```java\npackage lambda;\n\nimport java.util.Arrays;\n\
    import java.util.List;\n\npublic class Main {\n\n    public static void main(String[]\
    \ args) {\n        List l = Arrays.asList(\"Hello\", \"World\", \"Print\", \"\
    My\", \"List\");\n        l.forEach((Object o) -> { System.out.println(\">>>\"\
    \ + o); });\n    }\n}\n```\n\n注意，现在我们甚至不需要导入 `Consumer` 接口——编译器知道要检查 lambda 表达式是否符合\
    \ `Consumer` 接口，因为那是 `forEach` 方法接受的接口。\n\n我们甚至可以进一步从 lambda 表达式的参数中移除类型定义，并移除\
    \ lambda 表达式代码块中的 `{}` 括号：\n\n```java\npackage lambda;\n\nimport java.util.Arrays;\n\
    import java.util.List;\n\npublic class Main {\n\n    public static void main(String[]\
    \ args) {\n        List l = Arrays.asList(\"Hello\", \"World\", \"Print\", \"\
    My\", \"List\");\n        l.forEach(o -> System.out.println(\">>>\" + o));\n \
    \   }\n}\n```\n\n我们使用了泛型来声明列表包含 `String` 类型；因此编译器可以安全地假设传递给 lambda 的是 String。\n\
    \n我们现在可以将注意力回到之前的过滤示例。Java 8 将过滤器称为“谓词”（predicate），并提供了一个名为 `Predicate` 的函数式接口。这定义了以下方法：\n\
    \n```java\nboolean test([T](http://download.java.net/jdk8/docs/api/java/util/function/Predicate.html\
    \ \"t\") t)\n```\n\n谓词的根本方面是它接受一个元素并返回真或假。`List` 接口还支持新方法 `removeIf`。该方法将列表中的每个元素传递给谓词，如果谓词结果为真则将其删除：\n\
    \n```java\npackage lambda;\n\nimport java.util.Arrays;\nimport java.util.LinkedList;\n\
    import java.util.List;\n\npublic class Main2 {\n\n    public static void main(String[]\
    \ args) {\n        List<Integer> l = new LinkedList(Arrays.asList(4,5,88,76,55,23,7,20,45));\n\
    \        l.removeIf(i -> i%2 == 0);\n        System.out.println(l);\n    }\n}\n\
    ```\n\n表达式 `i -> i%2 == 0` 符合 `Predicate` 接口，因为它接受单个参数并返回布尔结果——如上面提到的，如果 lambda\
    \ 表达式由没有 `{}` 括号的单个语句组成，它们隐式返回类型。\n\n这也可以写成代码块：\n\n```java\nl.removeIf(i -> {return\
    \ i%2 == 0;});\n```\n\n我远更喜欢第一种形式，这也是最常用的形式。\n\n我应该在这里提到，`removeIf` 方法是一个非常糟糕的函数式编程示例，因为它修改（或改变）了原始列表。函数式编程强调不可变性，因此首选的方法是创建一个奇数新列表并保持原始列表不变。正如我们在下一章将看到的，使用\
    \ Java 8 的 Streams API 可以相对简单地实现这一点。\n\n以防你好奇，该方法修改了 `List` 意味着我不能简单使用：\n\n```java\n\
    Arrays.asList(4,5,88,76,55,23,7,20,45)\n```\n\n由于此方法返回一个映射到数组的固定长度的 `List`，因此无法移除元素。\n\
    \n## 自动生成的接口\n\n"
- fmt: "\nOne issue with the lambda expressions we have looked at so far is that they\
    \ do not lead to very good code reuse. The examples above have all created lambda\
    \ expressions on the fly and passed them as parameters to other methods. If two\
    \ different classes needed lambda expressions performing the same task, they would\
    \ each need to construct their own lambda expression (thereby duplicating the\
    \ code).\n\nThe lambda expression API in `Java 8` provides a mechanism to use\
    \ any method on any object (or static method on a class) as a lambda expression\
    \ (subject to its access modifiers), as long as it conforms to the required functional\
    \ interface. This feature is called auto-generated interfaces, and is facilitated\
    \ by a new operator called the “double colon”.\n\nLet’s take the very simplest\
    \ example we can. Suppose we want to pass each element in a list to the `System.out.println`\
    \ method. The `println` method meets the requirements of the `Consumer` functional\
    \ interface (it accepts a single parameter and returns `void`); therefore it can\
    \ be used as an instance of `Consumer`:\n\n```java\npackage lambda;\n\nimport\
    \ java.util.Arrays;\nimport java.util.List;\n\npublic class Main3 {\n    public\
    \ static void main(String[] args) {\n        List<String> l = Arrays.asList(\"\
    Hello\", \"World\", \"Print\", \"My\", \"List\");\n        l.forEach(System.out::println);\n\
    \    }\n}\n```\n\nThe key here is the statement `System.out::println`. Essentially\
    \ this is saying that there is a method called `println` on the object represented\
    \ by the variable `out`, and this should be used as the lambda expression accepted\
    \ by the `forEach` method. Since `forEach` accepts a `Consumer`, the `println`\
    \ method is implicitly converted to be an object of type `Consumer` as part of\
    \ the process.\n\nIf we go back to the example of removing even number elements\
    \ from the list: suppose we already had the following utility class:\n\n```java\n\
    package lambda;\n\npublic class Detector {\n    public boolean isEven(int i) {\n\
    \        return i%2 == 0;\n    }\n    public boolean isOdd(int i) {\n        return\
    \ !isEven(i);\n    }\n}\n```\n\nThis is a simple utility that detects odd and\
    \ even numbers: it has nothing to do with lambda expressions, and could have pre-dated\
    \ `Java 8`. We could rewrite the filtering example as follows:\n\n```java\npackage\
    \ lambda;\n\nimport java.util.Arrays;\nimport java.util.LinkedList;\nimport java.util.List;\n\
    \npublic class Main4 {\n    public static void main(String[] args) {\n       \
    \ Detector d = new Detector();\n        List<Integer> l = new LinkedList(Arrays.asList(4,5,88,76,55,23,7,20,45));\n\
    \        l.removeIf(d::isEven);\n        System.out.println(l);\n    }\n}\n```\n\
    \nOr, if we made `isEven` a static method, we could execute the following:\n`l.removeIf(Detector::isEven);`\n\
    \nThis is a very useful technique, since it means existing code can be re-purposed\
    \ to adapt to an interface it does not explicitly implement. This means, for instance,\
    \ any zero arguments method can be repurposed to implement the `Runnable` interface\
    \ and executed by a `Thread`.\n\nSorting lists is a very common operation, and\
    \ is supported by the `Comparator` and `Comparable` interfaces. I have always\
    \ been annoyed by the fact that the `sort` method was a static helper on the `Collections`\
    \ class, rather than a method on the `List` class. This was presumably because\
    \ `List` was an `Interface` rather than a class, and therefore the `sort` method\
    \ would have needed to be implemented on each implementation of `List`.\n\nAs\
    \ we will see later, this is no longer a constraint for `Java`, and therefore\
    \ `Java` has rectified this situation in `Java 8` via a `sort` method on `List`\
    \ (despite the fact it is an interface), and made `Comparator` a functional interface\
    \ in the process.\n\nTo demonstrate this we will create a very simple `Person`\
    \ class:\n\n```java\npackage lambda;\n\npublic class Person {\n    String firstName,lastName;\n\
    \    public Person(String firstName, String lastName) {\n        this.firstName\
    \ = firstName;\n        this.lastName = lastName;\n    }\n    public String getFirstName()\
    \ {\n        return firstName;\n    }\n    public String getLastName() {\n   \
    \     return lastName;\n    }\n    @Override\n    public String toString() {\n\
    \        return firstName + \" \" + lastName;\n    }\n}\n```\n\nWe can now create\
    \ a list of `Person` instances, and sort it based on `firstName` as follows:\n\
    \n```java\npackage lambda;\n\nimport java.util.Arrays;\nimport java.util.List;\n\
    \npublic class Main5 {\n    public static void main(String[] args) {\n       \
    \ List<Person> l = Arrays.asList(\n            new Person(\"Albert\", \"Smith\"\
    ),\n            new Person(\"Jim\", \"James\"),\n            new Person(\"John\"\
    , \"Brown\"),\n            new Person(\"William\", \"Hughes\"),\n            new\
    \ Person(\"Simon\", \"Fleming\")\n        );\n        l.sort((p1, p2) -> p1.getFirstName().compareTo(p2.getFirstName()));\n\
    \        System.out.println(l);\n    }\n}\n```\n\nThe statement:\n`(p1, p2) ->\
    \ p1.getFirstName().compareTo(p2.getFirstName())`\nis implicitly constructed into\
    \ an Object of type `Comparator` as part of this process.\n\nNotice here that\
    \ the `sort` operation is mutating: it changes the original list rather than returning\
    \ a new list with the elements sorted.\n\nI would take a lot of convincing that\
    \ the equivalent code with anonymous classes (while functionally equivalent) is\
    \ as readable:\n\n```java\nl.sort(new Comparator<Person>() {\n    @Override\n\
    \    public int compare(Person p1, Person p2) {\n        return p1.getFirstName().compareTo(p2.getFirstName());\n\
    \    }\n});\n```\n\n## Scope\n\nAs we have seen above, lambda expressions can\
    \ use variables that were in scope when they were created. There is a caveat however\
    \ – they can use those variables as long as they do not change their values.\n\
    \nAs an example, consider the following functional interface:\n\n```java\npackage\
    \ lambda;\n\n@FunctionalInterface\npublic interface NumberAdder {\n    int add(int\
    \ x);\n}\n```\n\nThis has a method called `add` that accepts an integer, and returns\
    \ an integer.\n\nWe will now create a method that returns `NumberAdder` as follows:\n\
    \n```java\npublic static NumberAdder getNumberAdder() {\n    int startingNumber\
    \ = 10;\n    return x -> x + startingNumber;\n}\n```\n\nThis method declares a\
    \ local variable `startingNumber`, and then returns an instance of `NumberAdder`.\n\
    \nUnder normal circumstances the `startingNumber` variable would be implicitly\
    \ destroyed when the method completes (remember, local variable exist on the stack,\
    \ and are popped off the stack when the method completes). In the case of lambda\
    \ expressions however, the variable survives when the method completes. Here is\
    \ the complete class including the invoking method:\n\n```java\npackage lambda;\n\
    \npublic class Main6 {\n    public static void main(String[] args) {\n       \
    \ NumberAdder na = getNumberAdder();\n        System.out.print(na.add(20));\n\
    \    }\n    public static NumberAdder getNumberAdder() {\n        int startingNumber\
    \ = 10;\n        return x -> x + startingNumber;\n    }\n}\n```\n\nWhen this runs\
    \ it will print out 30. Lambda expressions that use variables in this manner are\
    \ said to be “capturing lambdas”, since they capture copies of the variables that\
    \ were in scope when they were constructed.\n\nIn order for this little bit of\
    \ magic to work, the variable `startingNumber` must be final or “effectively final”.\
    \ Even the following code is invalid and won’t compile:\n\n```java\npublic static\
    \ NumberAdder getNumberAdder() {\n    int startingNumber = 10;\n    startingNumber++;\n\
    \    return x -> x + startingNumber;\n}\n```\n\nThe term “effectively final” is\
    \ new. Essentially it means that the variable must behave as though it was final,\
    \ even though it doesn’t need to be marked as final. Basically, if the variable\
    \ would not be valid with the `final` modifier added, it is not valid for use\
    \ by a lambda expression.\n\nThis constraint is controversial and was added to\
    \ reduce concurrency issues that could arise from mutating variables. Up until\
    \ Java 8 you could never have threading issues with local variables: simply put\
    \ it was impossible for two threads to be sharing the same instance of a local\
    \ variable since they are created inside a method, and two threads invoking the\
    \ same method would receive their own independent copies of the variables.\n"
