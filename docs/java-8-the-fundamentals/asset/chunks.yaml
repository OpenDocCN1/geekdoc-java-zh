  trans: "\n\n如果 lambda 表达式可以修改本地变量，并且两个方法从两个不同的线程同时调用该 lambda 表达式，那么语言将引入一组全新的并发问题。\n\
    \n当然，可以通过绕过这一限制（就像绕过 `final` 变量的限制一样），将整数封装为对象内部的一个字段。这样一来，即使在 lambda 表达式创建后，也可以更改该字段的值。可以通过创建以下类来实现：\n\
    \n```java\npackage lambda;\n\npublic class IntegerHolder {\n\n  public int number\
    \ = 10;\n\n}\n```\n\n并对主类修改如下：\n\n```java\npackage lambda;\n\npublic class Main7\
    \ {\n\n  public static void main(String[] args) {\n\n  NumberAdder na = getNumberAdder();\n\
    \n  System.out.print(na.add(20));\n\n  }\n\n  public static NumberAdder getNumberAdder()\
    \ {\n\n  IntegerHolder ih = new IntegerHolder();\n\n  ih.number = 10;\n\n  NumberAdder\
    \ na = x -> x + ih.number;\n\n  ih.number = 20;\n\n  return na;\n\n  }\n\n}\n\
    ```\n\n在这种情况下，`ih` 变量是有效最终的（effectively final），因为在变量初始化后我们没有更改其引用的对象。然而，我们在创建\
    \ lambda 表达式之后确实更改了该对象所持有的数字。\n\n在这种情况下，操作的结果是 40，因为当 lambda 表达式被调用时，`number`\
    \ 字段的值已经被更改为 20。\n\n这种方法自然会让代码暴露在规范试图通过使用 `final` 变量来避免的并发问题中，因此不应被视为一种特性。\n\n\
    ## 结论\n\n正如你所看到的，lambda 表达式提供了一种构建匿名方法并将其作为参数传递给其他方法的机制。\n\nJava 社区中关于 lambda\
    \ 表达式的辩论似乎没完没了。不仅它们的发布从 `Java 7` 推迟到了 `Java 8`，而且还引发了大量的争论和批评。\n\n即使现在它们已经被包含在内，某些圈子里仍有观点认为\
    \ lambda 表达式只是“语法糖”——它们仅仅是实现接口的替代方式，因此与 Java 8 之前的匿名类和局部类类没有区别。\n\n你可以对任何编程语言或编程语言结构提出论点，认为它只是某些其他结构（如汇编，最终是机器码）之上的语法糖，因为在\
    \ `Java` 等高阶语言中无法实现的功能，在汇编或机器码中是可以实现的。关键在于，`Java` 等语言为人类向计算机描述一组任务提供了更方便的机制。同样，lambda\
    \ 表达式将让许多 Java 程序员更容易地向 Java 编译器描述任务。\n\n尽管 lambda 表达式没有让你能够完成任何不使用它们就做不到的事，但它们有改变你对\
    \ `Java` 中解决问题思维的能力。这一主题将延续到关于 `Streams API` 的下一章节：因为那是 lambda 表达式大放异彩的地方。\n\n\
    # Streams API\n\n`Java 8` 作为 lambda 表达式 JSR，引入了一个名为 `Streams API` 的新 API。这些不应与输入/输出流混淆；它们是处理元素序列（例如\
    \ `Collection` 中的元素）的机制。`Java 8` 正式将流定义为“一种支持顺序和并行聚合操作的元素序列”。\n\n正如我们在本节后面将看到的，`Streams\
    \ API` 是简化 `Java` 中并行算法实现方式努力的一部分，它允许程序员请求并行处理而不是自己实现它。然而，流远不止于此，它们提供了迭代的替代方案，并为各种操作提供了支持，所有这些操作都可以利用\
    \ lambda 表达式。\n\n我们将从一些非常流流示例开始，回到我最喜欢的从 `List` 中排除偶数。可以通过以下方式完成：\n\n```java\n\
    package streams;\n\nimport java.util.Arrays;\n\nimport java.util.List;\n\npublic\
    \ class EvenOnly {\n\n  public static void main(String[] args) {\n\n  List<Integer>\
    \ l = Arrays.asList(5,4,88,76,55,23,7,20,45);\n\n    l.stream().filter(p -> p%2==1)\n\
    \    .forEach(i -> System.out.print(i+\" \"));\n\n  }\n\n}\n```\n\n在创建列表后，我们首先通过\
    \ `stream()` 方法访问它的流。这返回一个类型为 `java.util.stream.Stream<Integer>` 的对象。我们很快就会详细查看流是什么，但目前只需将它们认为是一种从数据源（即\
    \ `List`）向函数（即 `filter`）传递元素的方式。\n\n这段代码“内部迭代”了列表中的每个元素（如在前章的 `forEach` 中所示），并逐个将每个元素传递给\
    \ `filter` 方法。这与使用 `for` 循环和迭代器的“外部迭代”相反，因为程序员不需要声明他们希望在循环中处理每个元素的要素，也不需要控制迭代。\n\
    \n外部迭代看起来可能并不是需要消除的巨大不便——尤其是自从了基于 `Collection` 的 `for` 循环之后。然而，内部迭代可以带来意想不到的好处，因为它可以针对不同的集合实现不同的迭代策略，从而允许隐式地添加行为（例如并行处理）。\n\
    \n`filter` 方法被称为中间操作。当每个元素被处理时，通过过滤的元素随后会被传递给 `forEach` 方法，后者是一个终端操作。\n\n`filter()`\
    \ 方法返回的类型本身是 `Stream`，因此可以将一组中间操作链联成“流水线”（pipeline）。\n\n流水线的实现基于：一个操作的输出成为另一个操作的输入。\n\
    \n流水线在计算中被广泛使用：例如 Unix/Linux 命令行支持流水线，一个程序的输出通过 `|` 运算符传递给另一个。例如，这可以查找名称中包含“java”的运行进程：\n\
    \n```\nps | grep 'java'\n```\n\nUnix 允许此点的约定是程序向标准输出产生 ASCII 文本，而程序从标准输入读取 ASCII\
    \ 文本。因此，管道操作将一个程序的标准输出接到另一个程序的标准输入。\n\n正如我们在整个章节中所看到的，流水线提供了一种用易理解的块来描述复杂功能的机制。\n\
    \n终端操作（顾如其名）代表了流水线的终点，它们负责以某种方式终止流。`forEach` 不是最明显的终端操作示例，但它提供了一种在元素被流水线处理后访问它们并对它们执行某些操作的方法（在本例中为打印它们）。你会注意到\
    \ `forEach` 方法返回 `void`，因此在调用该方法后，流水线无法继续。\n\n与之前看到的 `removeIf` 方法不同，此流水线没有以任何方式更改原始\
    \ `Collection`：它仅仅提供了一种处理其元素的机制。\n\n在上面的示例中，列表中的第一个元素（5）被传递给 `filter` 方法的 lambda\
    \ 表达式，并被评估为真（它是奇数）。结果是该元素被传递给 `forEach` 方法的 lambda 表达式，导致该数字被打印。\n\n一旦元素通过了整个流水线，下一个数字（4）就会被处理。由于\
    \ `filter` lambda 表达式对该数字返回假，因此它永远不会被传递给 `forEach` lambda 表达式，依此类推。\n\n"
- fmt: "\nEven this is not strictly speaking a true representation of the processing:\
    \ intermediate operations are lazy. The intermediate operations are not executed\
    \ until the terminal operation is invoked – so it is the execution of the `forEach`\
    \ method with the first number (5) that causes the `filter` method to be invoked.\n\
    \nThis approach means that the entire pipeline can be processed in a single iteration\
    \ of the collection, and can result in dramatic performance improvement for large\
    \ sets of data. It also means that the stream does not need to hold all the elements\
    \ in the list as it performs its processing.\n\nThis last point is important.\
    \ An alternative implementation of Streams would have been to invoke the `filter`\
    \ operation on all elements and capture these in a `Collection` – once these had\
    \ been captured they could be passed to the `forEach` method. I think it is fairly\
    \ obvious that this implementation would not be as efficient either in terms of\
    \ memory utilization or processor utilization.\n\nIn order to see this in action,\
    \ we will re-write the `main` method as follows:\n\n```java\npublic static void\
    \ main(String[] args) {\n    List<Integer> l = Arrays.asList(5,4,88,76,55,23,7,20,45);\n\
    \    Stream<Integer> s = l.stream().filter(p -> {\n        System.out.println(\"\
    Filter called on \"+ p);\n        return p%2==1;\n    });\n    System.out.println(\"\
    The pipeline is created - calling terminal operation\");\n    s.forEach(i -> System.out.println(\"\
    >>>\" + i));\n}\n```\n\nThis produces the following result:\n\n```\nThe pipeline\
    \ is created - calling terminal operation\nFilter called on 5\n>>>5\nFilter called\
    \ on 4\nFilter called on 88\nFilter called on 76\nFilter called on 55\n>>>55\n\
    Filter called on 23\n>>>23\nFilter called on 7\n>>>7\nFilter called on 20\nFilter\
    \ called on 45\n>>>45\n```\n\nNotice the first line that is output: although this\
    \ was printed after the `filter` method appears to have been invoked, it is actually\
    \ the first print statement to be displayed, proving this line was executed first.\
    \ This shows that even with our code structured across multiple statements, the\
    \ `Collection` is still processed with a single pass by the `Stream`.\n\nThere\
    \ is another major benefit with the lazy invocation approach. Suppose we just\
    \ wanted to find the first odd number in this list. This can be achieved with\
    \ an alternative terminal operation called `findFirst`:\n\n```java\npublic static\
    \ void main(String[] args) {\n    List<Integer> l = Arrays.asList(5,4,88,76,55,23,7,20,45);\n\
    \    Stream<Integer> s = l.stream().filter(p -> {\n        System.out.println(\"\
    Filter called on \"+ p);\n        return p%2==1;\n    });\n    Optional<Integer>\
    \ result = s.findFirst();\n    System.out.println(result.get());\n}\n```\n\nThis\
    \ example prints the following result:\n\n```\nFilter called on 5\n5\n```\n\n\
    Since the first element in the list was odd, this was the only element that needed\
    \ to be processed.\n\nThere is one other interesting aspect to this example. Rather\
    \ than returning an `Integer`, the `findFirst` method returned an `Optional<Integer>`.\
    \ You will find references to the `Optional` class throughout the Streams API:\
    \ it provides a container for a value that may be null. This class supports a\
    \ method called `isPresent` to determine whether the container holds a non-null\
    \ value.\n\nThe `Optional` class also supports methods such as `map` and `filter`\
    \ that allow the value to be modified via lambda expressions if required. There\
    \ is also nothing to stop you returning `Option` instances from your own code,\
    \ and it may prove a useful mechanism for extending the value of your APIs.\n\n\
    There are a couple more points to make about Streams before continuing. Firstly,\
    \ once a stream has processed its elements it cannot be reused. For instance,\
    \ in the example above we could not have invoked an alternative terminal operation\
    \ on the `Stream` returned by `filter` after the `forEach` operation had been\
    \ executed. Technically streams can be closed, but there is no reason to explicitly\
    \ close them.\n\nSecondly, Streams must be non-interfering: they cannot change\
    \ the source of the `Stream` (the list in the example above).\n\nWe will now turn\
    \ to a slightly more complicated example, and demonstrate how a pipeline can include\
    \ multiple intermediate steps. Suppose we want to do the following:\n\n* Filter\
    \ the even numbers out of the list\n* Multiply each remaining number by itself\n\
    * Sum the numbers together\n\nIn this case, the first two steps will be the intermediate\
    \ operations, while the sum operation will be the terminal operation. This can\
    \ be achieved as follows:\n\n```java\ndouble result = l.stream()\n.filter(p ->\
    \ p%2==1)\n.mapToInt(p -> p * p)\n.sum()\n```\n\nThe `filter` method above should\
    \ look familiar, and since it returns a `Stream<Integer>` we can obviously execute\
    \ other intermediate operations on the result.\n\nThe next intermediate operation\
    \ that is executed is `mapToInt`. This is slightly different from the `filter`\
    \ operation: it provides a way of transforming data. The lambda expression passed\
    \ to `mapToInt` accepts any type of object as input, and returns an integer as\
    \ a result. In this case, the input parameter is also a integer, but that is not\
    \ required: we could have passed a `Person` object as the parameter, and returned\
    \ the salary field (if that was a integer).\n\nThe lambda expression passed to\
    \ `mapToInt` is simply multiplying the input parameter by itself and implicitly\
    \ returning the result.\n\nThe other interesting thing about `mapToInt` is that\
    \ instead of returning an object of type `Stream<Integer>`, it actually returns\
    \ an instance of `IntegerStream`. The difference may sound small, but `IntegerStream`\
    \ provides a set of specialized terminal operations designed to work with integer\
    \ values, including `min`, `max`, `average`, and the method we are using here:\
    \ `sum`.\n\nThe Streams API also supports `DoubleStreams` (via `mapToDouble`)\
    \ and `LongStreams` (via `mapToLong`). These have the same set of aggregate operations\
    \ seen on `IntegerStream`.\n\nStreams also support a general-purpose `map` operation\
    \ for transforming objects of any type to any other type, but this method simply\
    \ returns a `Stream<T>` where `T` is the return type of the `map` operation.\n\
    \nThe `sum` method is a type of terminal operation known as a reducing operation:\
    \ it takes a set of values and reduces them to an aggregate value. We could have\
    \ implemented the `reduce` method ourselves if we chose:\n\n```java\nl.stream()\n\
    .filter(p -> p%2==1)\n.mapToInt(p -> p * p)\n.reduce((a, b) -> a + b)\n```\n\n\
    The `reduce` algorithm starts by passing the first two elements in the list to\
    \ the lambda expression provided. The result of this operation is then passed\
    \ to the lambda expression along with the third element, and so on until the elements\
    \ have all been processed. The following is a print out of the values passed to\
    \ the `reduce` lambda expression:\n\n```\na = 25, b = 3025\na = 3050, b = 529\n\
    a = 3579, b = 49\na = 3628, b = 2025\n```\n\n(There are 5 odd numbers, so the\
    \ expression is invoked 4 times).\n\nThe `reduce` method returns an instance of\
    \ `OptionalInt`, since the `filter` method could have potentially removed all\
    \ elements from the `Stream`.\n\nThe `reduce` operation accepts a lambda expression\
    \ conforming to the `BinaryOperator` functional interface. This interface has\
    \ a method that accepts two parameters and returns a single parameter of the same\
    \ type:\n\n`R apply(T t, U u)`\n\nWe could therefore have reused one of the new\
    \ static helper methods added to `Integer` (and the other number wrapper types)\
    \ in Java 8:\n\n```java\npublic static int sum(int a, int b)\n```\n\nAs follows:\n\
    \n```java\nl.stream()\n.filter(p -> p%2==1)\n.mapToInt(p -> p * p)\n.reduce(Integer::sum)\n\
    ```\n\nNotice that the `sum` method is static, therefore we don’t need an instance\
    \ of `Integer` to invoke the `sum` method.\n\nThe `reduce` operation can also\
    \ accept an optional first parameter representing the initial value of the aggregation:\n\
    \n```java\nl.stream()\n.filter(p -> p%2==1)\n.mapToInt(p -> p * p)\n```\n"
