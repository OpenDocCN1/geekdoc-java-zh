    A spoofing attack (otherwise known phishing) is an enemy program, system or website
    that poses as a trusted one. By falsifying data the hacker is able to masquerade
    as a trusted system and thus fool a program or user into revealing confidential
    information such as passwords or bank details. Another hacking technique that
