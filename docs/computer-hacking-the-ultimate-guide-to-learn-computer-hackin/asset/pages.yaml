  md: '# Chapter 1 –A Closer Look on Relational Model


    The Structured Query Language, or SQL, was originally designed for relational
    model. It is the language used to define the relationships between multiple data.
    It is also the database programming language used to query data in a relationalschema.


    So when did this all begin?


    The first relational database was created in the 60s and the programming in this
    model were primarily defined by mathematics.In fact, this model of database was
    based on Tuple Relational Calculus and Relational Algebra.


    Don’t worry though, there is no need for you to jump into algebra and calculus
    to handle relational databases. SQL will make relational database programming
    easier.


    # Tables, Columns, and Rows


    In the relational database, the data is stored in a table. In this model, all
    tables have names. For instance, you may name a table as “people” while you may
    name another table as “sales”. These names refer to the kind of data stored inside
    the table. In other words, the table we call “people” contains data of people
    while the table we call “sales” contains data of sales.


    Every table features a set of columns. These columns define the different pieces
    of data within the table. This makes the relational model different from other
    types of databases. You will notice that there are some databases that store all
    together. In a relational model, however, all data is separated by columns and
    each column has a name. Each column can also restrict the category and size of
    data that will be added in. For instance, some columns can only store strings
    while some columns can only store numbers. The restriction assigned to each column
    depends on the creator of the database.


    Columns are also categorized by being required and not required. A required column
    means that every row in the table must have a data that corresponds to the column
    requires. A not required column, on the other hand, means that we can assert a
    NULL value for each row under that column. As you go through SQL, you will find
    NULL has a lot uses in database programming.


    The primary point of using rows is to have retrieveable data and containers where
    you can store data. Why do we store data? Simply because we want to get that data
    again in the'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'future and we simply want a place for it to stay for the mean time. Hence,
    the core idea of a database.


    # Keys


    One of the vital elements of a relational database are keys. We now know that
    a table has several columns and each column has names. Each column has related
    properties as well. One of these properties that we can assert in a column is
    a key.


    In a relational database, we always assign a primary key for each row. This special
    type of key is used to uniquely determine a specific row. This means that the
    value of that key must remain unique and not have any duplicates within the table.
    If, and only if, there is another table which contains that key in our relation
    model; then, we may merge those two tables together.


    When merging two tables, there will always be primary keys that have no duplicates.
    Upon merging, you will notice that there will be a new column in the table with
    these keys. These keys are now known as the Foreign keys. They serve as the primary
    keys of the second table, allowing you to conveniently link rows from two separated
    tables.


    Aside from primary keys and foreign keys, we also have the natural keys. Natural
    keys are global. This means that you cannot change them since they are used all
    over the globe to identify a single entity. Published books, for instance, have
    natural keys which we know as ISBN. Each published book has its own unique ISBN
    which you need to use as primary keys when handling relational database for books.
    This is different when handling databases with unnatural keys like emails, people,
    where you need to invent your own primary keys for each row.


    Let us use a database for people and their contact numbers as an example. We cannot
    consider the name as the primary key. We consider the person''s phone number as
    the primary key as well. This is because it is possible that there are two or
    more people in the globe that have the same contact number, first name, or last
    name. Hence, we should create the primary key ourselves. This is where the identity
    column comes in.


    The identity column serves as an auto-incrementing column that continues to generate
    unique keys as we add data in the table. The key combination does not matter since
    we only need is a unique key for every identity in our database.'
