    themselves, which can be done by manually searching the code of the computer and
    then testing they are right. Brute-force attack is another method by which a hacker
    can gain unauthorized entry to a computer network, and this involves guessing
    passwords. Password cracking is another hacking technique that uses passwords,
    but rather than guessing the password, the hacker recovers password information
    that has been stored in the computer, or transmitted.


    used is a root kit, which is a program that manages to take over the control of
    an operating by employing hard to detect methods.


    A Trojan horse is yet another technique that is a program which manages to fool
    systems and users; it works by working in one way seeming to be doing something
    else. By using this method a hacker is able to gain unauthorized access to a system
    and create an access point so that they can re-enter via established route later
    on. A computer virus is the most widely recognized form of hacking, as it is the
    computer threat that most of the public is aware of.


    The virus works by self-replicating and implanting itself into codes and; while
    some computer viruses are malicious some are merely irritating or harmless. A
    computer worm is similar in that it is self-replicating, but it is able to enter
    a computer program without a user inadvertently letting it in, and it does not
    need to insert itself into present programs.


    Finally, a keylogger is a tool that records every keystroke on a given machine,
    which can later be accessed and viewed by the hacker. This is usually to enable
    the hacker to access confidential information that has been typed by the victim.
    In fact, there are some legitimate uses for such a technique, for example some
    companies use a keylogger in order to detect any dishonesty or fraud committed
    by an employee.


    ![](img/dc3a21e694145a6334d92126a7367b5a_25_0.png)'
  merge: -1
