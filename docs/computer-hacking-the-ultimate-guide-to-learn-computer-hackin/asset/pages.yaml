  md: '# Conclusion


    At this point, you are now familiar how relational databases work and how efficient
    SQL in querying data from databases that utilize relational models.


    It is important to take note of how to designate restrictions to columns and how
    to call them specifically using SELECT statements. You have also learned that
    SQL statements contain both SQL-defined keywords and user-defined keywords. These
    keywords are not case sensitive, but organizing and writing the statements in
    a visual-friendly manner is highly recommended. Doing so will not only give you
    convenience when viewing your SQL coding but other people. This is a best practice
    if you are working with a team.


    It is also significant to qualify column names using table names when writing
    SELECT statements. This will prevent future issues when there are different tables
    with similar column names. You just learned to shorten the table names using an
    alias.


    You can also specify data extraction of the SELECT statement by clauses such as
    FROM. The FROM clause allows you to specify which table to look at whenever your
    SQL statement looks for columns. Aside from that, FROM clause also allows you
    to assign an alias for the table name.


    You also learned to limit the number of answered values with the use of DISTINCT
    qualifier and the WHERE clause since it is an inefficient way to extract data
    from your database. The WHERE clause, on the other hand, is a powerful command
    that you need to master as a beginner. Familiarize the different operators and
    try them out on an already built database.


    I am aware that this book is basic, but it is enough to prepare you in moving
    forward to advanced studies in the structured query language. As a beginner, there
    is no need for you to rush immediately on how to create your own database. It
    is important to learn which database model functions SQL. By understanding the
    relational model, you will easily grasp the concept of SQL together with the statements
    that you can do using language.


    If you want to continue learning about SQL, then I suggest that you take advantage
    of the book’s sequel where you will be introduced to deeper clauses of SELECT
    statements. The second part also tackles JOINS, handling data, and table creation.'
