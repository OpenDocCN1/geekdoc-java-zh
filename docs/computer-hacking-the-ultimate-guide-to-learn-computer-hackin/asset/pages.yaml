  md: '# SELECT Command Anatomy


    You should have learned by now that we have the SQL keyword SELECT which is a
    command to get specific data from our database. After the SELECT keyword, what
    should follow is the list of items we want to have from our database. We call
    it “select list”. If the select list only contains variables, then you can simply
    write the statement in this manner:


    ```

    SELECT ‘[Variable]’,’[Variable]’;

    ```


    Most of the time, the select list contains the names of the columns. When it does,
    it is important to define which table we can find these columns. This is where
    the FROM command comes in.


    For instance, our select list contains User (column A) and Email (column B) and
    we can find these columns inside the table named as Contact. In order to define
    which table to look for, we should include the FROM command by doing this.


    ```

    Format:

    SELECT [COLUMN_NAME], [COLUMN_NAME] FROM

    [TABLE_NAME];


    Example:

    SELECTUser,EmailFROM;

    ```


    But, what if I have a lot of columns in the table and I want to select them all,
    do you ask? Well, this is where the power of the asterisk (*) comes in. This is
    known as the wildcard symbol in SQL statement. To select all columns inside a
    table, you need to execute a *'
  merge: -1
