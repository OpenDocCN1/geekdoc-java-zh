  md: '# Chapter 4 – Hacking Techniques


    There are various techniques that can be used by hackers in order to gain unauthorized
    access to a computer system, in order to wreak havoc, steal money or data, or
    to prevent the system from operating as it is supposed to. The three main methods
    that are used in order to attack a system that is connected to the Internet are:
    network enumeration, vulnerability analysis and exploitation.


    A network enumerator is a program that is used in order to discover the usernames
    and other information from networked computers. The program discovers any weaknesses
    in the computer network''s security and the findings are reported to a hacker
    who may use this information in order to access the network and cause damage (either
    by stealing data or corrupting the network).


    ![](img/dc3a21e694145a6334d92126a7367b5a_24_0.png)


    On the other hand, ethical hackers can use the same process simply to discover
    any weaknesses in their system in order to tighten security. Another method used
    is vulnerability analysis, which identifies any points of vulnerability in a system;
    this information can be used to attack the system, or to remove the weakness.
    Vulnerability analysis can lead to exploitation, where the hacker uses the vulnerability
    information in order to breach a computer or system''s security.


    There are many specific techniques that can be used, but they employ the main
    concepts and methods described above. The first more specific example of a hacking
    technique is a vulnerability scanner, which is a program used to check a network
    for susceptibility to attack. A port scanner can also be used, which identifies
    avenues of access to a computer and can establish how to circumnigate a firewall.


    As well as these mechanized devices, hackers can also find these vulnerabilities'
  merge: -1
  pgno: 24
- img_proc: true
