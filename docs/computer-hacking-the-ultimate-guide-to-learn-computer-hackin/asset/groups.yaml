    ## Chapter 3 – SQL Statements


    SQL is a specific database language. We use this language to create statements.
    These statements are made up of valid words. Some of the words should be defined
    by SQL while some of the words should be defined by you. Some words you will be
    asserting in these statements are table names, column names, and variables or
    data that is inside tables.


    ## SQL Facts


    Before we proceed, I would like to show you some important facts about SQL.


    The first thing you need to know about SQL is that it is readable since it is
    written in the English language. In other words, it is easier to learn SQL more
    than any other programming languages.


    Second is that you can do a lot more using SQL. This is in contrast with most
    people''s impressions that SQL is only used for data queries. This is wrong.


    Third is that a valid SQL statement should end with a semi-colon (;). Although
    some people will tell you that it is no longer needed, I suggest adding it in
    your queries because it is part of the ANSI standard. Furthermore, it works fine
    with both old and modern databases. Semi-colons allow you to conveniently assert
    multiple statements together in what we call a batch. This method works even with
    modern databases.


    The fourth is that SQL is not case-sensitive. You can put your variables in both
    lower and upper cases. Both ways will work out just fine in the structured query
    language. One good way to practice this is to assert SQL-specific keywords in
    uppercases and user-defined keywords in lowercases. This will allow you to efficiently
    and quickly identify the different keywords within a statement.


    ## SQL Commands


    It is important to keep in mind that all SQL statements begin with a command.
    The command is typically a verb to signify what the database needs to do. One
    good example of a command used in SQL statements is SELECT.


    The SELECT command tells the database to select a set of data. As you can see,
    it is an English-based word and pretty much obvious of what the system will do.
    This is how the command looks like when used in an SQL statement.


    ```sql

    SELECT VALUES

    FROM TABLENAME;

    ```


    The example above is a generic example of an SQL statement and I will talk about
    it piece by piece later on.


    Take note that the set of values or variables that you need to assert in a statement
    depends upon what command you are trying to execute. All these variables come
    in the statement right after the command.


    ## Naming Values


    As I have already said, the SQL statement is made up of words that are within
    SQL specification and user-created names. This means that naming values such as
    keys, columns, and etc. are significant in SQL.


    There is no absolute rule in naming things in SQL. People have their own ways
    to name variables, but I suggest you follow the method I use in this book for
    the sake of consistency. Here are two naming rules that I will be implementing
    in this book:


    - All table names must be in singular form. (e.g. person, email, phone, user,
    etc.)

    - Column names should never be repeated in the database.


    There are some people who prefer to use plural names for their table names. This
    is not wrong. Nevertheless, I am more comfortable when using singular form table
    names. As the column names, there will always be a time when two or more columns
    from separated tables have the same name. Hence, what I do is to uniquely name
    each column for disambiguation purposes. For instance, instead of using ID as
    the column name for primary keys in both the user table and email table; I would
    rather use the names user_ID and email_ID for each column.


    You should also take note that names in SQL are scoped. This means that the database
    itself must have a name. The tables within the database must have names too. The
    columns inside every table must be named as well. When calling for the table,
    its name must be scoped through the database name with the use of period (.) to
    separate the names. Hence, this is how they are going to look like when asserted
    in an SQL statement:


    - Database.Table

    - Table.Column


    ## Creating Data in SQL


    I have no intention to teach you how to create a database from scratch. As beginners,
    your tasks should only circle around adding or updating values to an already existing
    database. However, I have a feeling that some of you still have that eagerness
    to learn SQL in order to create the entire application including the database
    itself. And so, I will introduce that part of SQL, but just enough to help you
    jumpstart.


    The SQL keyword to create a new database is the statement CREATE DATABASE and
    this falls under ANSI specification. Let us say you want to create a new database
    for contact numbers of people and you want to name this new database as Contacts.
    Here is how you are going to do it.


    ```sql

    CREATE DATABASE Contact;

    ```


    In order for you to work on that database, you need to use it first. The keyword
    we need here is the USE DATABASE command. This is how we are going to execute
    it.


    ```sql

    USE DATABASE Contact;

    ```


    If you want to create a table inside the Contact database, then what you need
    to execute is the CREATE TABLE command and here is how you do it.


    ```sql

    CREATE TABLE Contacts.User (...);

    ```


    After that, you can now put all column names, types, and definitions.


    ## Data Types


    Data types are important because it follows column restrictions. Here are some
    of the major types:


    | Data Type | Description |

    | :--- | :--- |

    | CHARACTER | Used to define characters. |

    | CHARACTER VARCHARING | Used to define maximum of characters. |

    | BINARY | Used to store data. |

    | SMALLINT | Used to store numbers. |

    | INTEGER | Used to store numbers. |

    | BIGINT | Used to store numbers. |

    | BOOLEAN | Used to store TRUE or FALSE values. |

    | DATE | Used to store DAY, MONTH, and YEAR. |

    | TIME | Used to store SECOND, MINUTE, and HOUR. |

    | TIMESTAMP | Used to store both TIME and DATE. |


    ## CHAPTER 4 – Coding in MySQL


    I will teach you how to code SQL using MySQL. Why MySQL? First is because it is
    an open-source platform and you can get it for free. Second is because it is compatible
    with all major operating systems: Linux, OSX, and Windows. Third is because it
    features ANSI mode which enforces ANSI specifications to your database. Not all
    DBMS have this kind of feature.


    In this chapter, I will teach you how to efficiently use the SELECT command.


    ## SELECT Command Anatomy


    You should have learned by now that we have the SQL keyword SELECT which is a
    command to get specific data from database. After the SELECT keyword, what should
    follow is the list of items we want to have from our database. We call it “select
    list”. If the select list only contains variables, then you can simply write the
    statement in this manner:


    ```sql

    SELECT ''Variable'',''Variable'';

    ```


    Most of the time, the select list contains the names of the columns. When it does,
    it is important to define which table we can find these columns. This is where
    the FROM command comes in.


    ```sql

    Format:

    SELECT [COLUMN_NAME], [COLUMN_NAME] FROM [TABLE_NAME];


    Example:

    SELECT User,Email FROM;

    ```


    But, what if I have a lot of columns in the table and I want to select them all,
    do you ask? Well, this is where the power of the asterisk (*) comes in. This is
    known as the wildcard symbol in SQL statement. To select all columns inside a
    table, you need to execute a *.

