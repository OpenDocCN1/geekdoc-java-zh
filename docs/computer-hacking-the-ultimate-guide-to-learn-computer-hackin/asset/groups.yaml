    计算机黑客行为的一个很大领域涉及社会工程学，即通过操纵个人来规避信息安全，使其泄露机密信息或授予对安全网络的访问。这种技术（包括网络钓鱼）通常只是更广泛欺诈计划中复杂日常操作的一部分，但它也是危险的步骤，因为人类比机器更容易被有说服力的骗子所说服。


    社会工程依赖于决策的心理因素，可以被认为是计算机安全系统中最严重的漏洞之一。社会工程有许多不同的应用方法来获取对计算机系统的未经授权访问，这犯罪分子伪装成
    IT 技术人员，假装他们正在修复公司的同时窃取数据。


    另一个例子是骗子告知公司 IT 帮助台的电话号码已经变了，这样当员工拨打该号码时，他们会乐意透露自己的账户详情，认为自己正在与可以信任信息的人交谈。这类场景属于“借口法”（pretexting）类别，因为编造一个可信的场景让犯罪分子能够获取所需的信息，并引导受害者披露信息。


    参与社会工程的黑客还可以伪装的其他专业人士包括警察或银行经理，因为我们认为这些人有权获得他们所要求的任何信息。诱饵攻击（Baiting）是社会工程的一个子类，因为它依赖于人类心理学。诱饵攻击是指在使用受感染设备或
    USB 盘时受害者的计算机安全遭到破坏。


    诱饵攻击的一个例子是犯罪分子将一个带有诱人标签的 USB 盘投进某门口，只需等待好奇的受害者将其插入笔记本电脑，此时恶意软件将自动安装并感染他们的计算机。这种技术充分利用了人类好奇和贪婪的倾向，因为如果标签承诺有情图片、金钱或八卦，受害者可能会发现难以抵制查看。


    凯文·米特尼克（Kevin Mitnik）曾是一个计算机犯罪分子，后来成为安全顾问，他指出，欺骗一个人泄露机密信息比利用运气、暴力破解或技术知识破解系统要容易得多、快捷得多。克里斯托弗·哈德纳西（Christopher
    Hadnagy）写了一本名为《社会工程学：人类黑客艺术》的书，强调了人类是任何计算机系统中最脆弱的部分。


    ## 结论


    本书提供了有关黑客行为的一些关键概念的概述。我们考虑了黑客行为的起源以及它曾如何受到赛博朋克文学传统的影响。值得注意的是，曾经在科幻小说中被描绘为反托邦社会中想象的活动已变成现实，并对计算机安全构成了重大威胁，成为信息技术专家关注的核心问题。


    在这里我们可以看到黑客行为的真正起源，以及曾经的虚构理论概念如何变成现实，并对数字文化产生了重大影响。接下来我们查看了不同类型的黑客，并指出了伦理黑客（合法且为了提高计算机安全而进行黑客攻击，又称为白帽黑客）与不道德黑客（非法使用其技能制造破坏、干扰服务并窃取信息和数据，又称为黑帽黑客）之间的区别。


    有趣的是，技术技能可以根据动机的不同被以不同的方式使用，而且黑客社区并不是由于一个清晰且一致的意识形态而团结在一起的。随后，我们研究了计算机安全，以便更好地理解黑客行为发生的条件。通过学习计算机安全，可以理解反对安全措施的黑客所面临的挑战，以及寻求维护计算机系统安全的人所面临的挑战。


    任何对黑客行为的介绍，如果没有对计算机安全的检查都是不完整的，因为维护计算机安全的价值激励了伦理黑客，也是不道德黑客所反对的。最后，我们查看了可以利用各种黑客技术，包括发现和利用计算机系统漏洞的自动化软件，以及突破安全措施的人工方法（例如通过试错法发现密码）。


    在本章中，我们还考虑了黑客行为中社会工程学这一大领域，通过这种方式，黑客能够非法获取所需信息来访问安全网络。在当今的数字文化中，我们所做的一切都越来越依赖技术。


    随着技术的进步，我们的生活在许多方面变得更加容易，但随着这个蓬勃发展的行业，也产生了新类型的犯罪分子。犯罪分子甚至不需要出门就能偷钱，只需通过黑入受害者始终保密的数据即可做到。


    然而，黑客行为并不总是非法的，本书还研究了对计算机专家成为伦理黑客日益增长的需求，以进一步促进和保护计算机安全。这个对黑客世界的介绍揭示了黑客行为并不是一项简单的活动，而是一个涉及广泛技术和动机的巨大行为谱系。


    此外，黑客行为被显示为一种具有强烈社群归属感的活动，即黑客强烈感觉到自己是黑客社区的一部分。随着数字文化的持续增长，伦理黑客和不道德黑客似乎将变得更加熟练，其影响也将日益显著。


