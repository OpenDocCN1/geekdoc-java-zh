    我并不打算教你如何从零创建一个数据库。作为初学者，你的任务应该只围绕向已有的数据库添加或更新值展开。然而，我感觉到你们一些人仍然渴望学习 SQL 以创建包括数据库本身在内的整个应用程序。因此，我将介绍
