    # SELECT Command Anatomy


    You should have learned by now that we have the SQL keyword SELECT which is a
    command to get specific data from our database. After the SELECT keyword, what
    should follow is the list of items we want to have from our database. We call
    it “select list”. If the select list only contains variables, then you can simply
    write the statement in this manner:


    ```

    SELECT ‘[Variable]’,’[Variable]’;

    ```


    Most of the time, the select list contains the names of the columns. When it does,
    it is important to define which table we can find these columns. This is where
    the FROM command comes in.


    For instance, our select list contains User (column A) and Email (column B) and
    we can find these columns inside the table named as Contact. In order to define
    which table to look for, we should include the FROM command by doing this.


    ```

    Format:

    SELECT [COLUMN_NAME], [COLUMN_NAME] FROM

    [TABLE_NAME];


    Example:

    SELECTUser,EmailFROM;

    ```


    But, what if I have a lot of columns in the table and I want to select them all,
    do you ask? Well, this is where the power of the asterisk (*) comes in. This is
    known as the wildcard symbol in SQL statement. To select all columns inside a
    table, you need to execute a *'
- md: '

    statement in this format.


    ```

    SELECT* FROM [TABLE_NAME];

    ```


    As you can see, the wildcard symbol comes after the SELECT command. Now this is
    useful when selecting all the columns. If you do not need to select all the columns,
    then using the wildcard symbol may become dangerous and inefficient.


    There are different ways to quickly assert multiple columns in an SQL statement
    depending upon the platform that you are using. I personally recommend that you
    avoid using the wildcard command since the inefficient use of this syntax may
    also break applications.


    ## FROM Command


    Selecting a single table is fairly easy to write an SQL statement. As you can
    see from previous examples, it only follows a simple format.


    ```

    FROM [TABLE_NAME]

    ```


    In FROM clause, you can shorten the name of your table by creating an alias for
    the table name. Let us say that your table name is “telecommunication” and you
    are looking for the list of owner names that can be found under the “owner” column
    of our table. Typing it with the use of the generic format will give you this.


    ```

    SELECT telecommunication.owner FROM telecommunication;

    ```


    Why do we need to type the table name before the column name in our format? This
    is because we must qualify the column by using the table name. Furthermore, this
    will save you from name collisions in the future if there will be columns with
    similar names. I suggest you make this a habit.


    Going back to the topic, doing so is too much of inconvenience. We can shorten
    the table name by assigning an alias in the FROM clause. Here’s the format.


    ```

    SELECT [TABLE_NAME_ALIAS].[COLUMN_NAME] FROM [TABLE_NAME][TABLE_NAME_ALIAS];

    ```


    Using the owner column and telecommunication table, our new statement will look
    like this.


    ```

    SELECT t.owner FROM telecommunication t;

    ```


    As you can see, I assigned the letter “t” to be the alias of the table name. This
    is easier to write than repeating the complete name over and over again. Keep
    in mind that it is not necessary to use the first character of your table name
    as an alias. You can assign any alias to the table name and it can also be a combination
    of characters. Just make sure that you are consistent with the alias you use.


    ## Limiting The Results


    Whenever you execute a SELECT query, the database will give you all the rows under
    the column you specified. This means that if your table has 20,000 rows, then
    it will return 20, 000 values to answer your statement.


    There are two ways to address this issue. One is to assert additional clause after
    the FROM clause. The other is by adding the DISTINCT qualifier before the select
    list. This shown in this format.


    ```

    SELECT DISTINCT [SELECT LIST] FROM [TABLE_NAME];

    ```


    This format will only give you distinct values in return instead of providing
    you with all the values under the specified column. For example, you have a table
    for your contacts and some entities were asserted in several rows because they
    own multiple phone numbers.


    Relying on the generic format will give you duplicated results. This is not efficient
    if you only want to know who are your contacts, right? Using the DISTINCT qualifier
    will prevent you from receiving multiple rows for the same entity.


    Here is our telecommunication table which has the column for owners and another
    column for the telecom company.


    | Key | Owner | Company |

    |---|---|---|

    | 1 | Jean Grey | AT&T |

    | 2 | Luke Skywalker | Comcast |

    | 3 | Mae Lee | AT&T |

    | 4 | Stan Lee | AT&T |


    Let us say we want to find the list of telecom companies in our database. Using
    the generic format will give us three results for AT&T which is unnecessary. With
    the DISTINCT qualifier, however, we will get only two results – one for Comcast
    and another for AT&T which is what we really need.


    Aside from DISTINCT qualifier, you can add the WHERE clause after the FROM clause
    to limit the results as well. The WHERE clause serves as a search engine with
    higher precision. This is done by using the following format.


    ```

    SELECT [SELECT LIST] FROM [TABLE_NAME] WHERE [EXPRESSION];

    ```


    To give you a simple example, let us use another table for people’s first and
    last names. Let us name this table “person”.


    | Key | First | Last |

    |---|---|---|

    | 1 | Lee | Mortis |

    | 2 | Mae | Lee |

    | 3 | John | Doe |

    | 4 | Stan | Lee |

    | 5 | Bruce | Lee |


    Let say imagine that this is our database for our customers and we would like
    to know how many customers do we have Lee as their family name. In order to do
    that, we need to execute the WHERE clause command.


    ```

    SELECT p.last FROM person p WHERE p.last = ''Lee'';

    ```


    This will address the database to look specifically under the last name column
    and merely focus on rows with Lee value under that column. It will ignore the
    rows with no Lee value under that column. In other words, you will only get the
    rows of your customers that have Lee as their names.


    The secret in understanding the WHERE clause is by taking note of the different
    operators you can use for WHERE expressions. These operators are similar to mathematical
    operators. This means that it is easy to remember them. In contrast with mathematics,
    the operators we use here also works for non-numerical data such as the equal
    (=) sign we have used in our WHERE clause above. Here is the list of simple operators
    that you can use for the WHERE clause.


    | Operators | Name & Description |

    |---|---|

    | = | Equal to |

    | <> | Not equal to |

    | > | Greater than |

    | < | Less than |

    | >= | Greater than or equal to |

    | <= | Less than or equal to |


    These are the operators that will give you Boolean values when handling WHERE
    clauses.


    ## Conclusion


    At this point, you are now familiar how relational databases work and how efficient
    SQL in querying databases. It is important to take note how to designate restrictions
    to columns. You have also learned that SQL statements contain both SQL-defined
    and user-defined keywords. These keywords are case sensitive, but organizing and
    writing the statements in a visual-friendly manner is highly recommended. Doing
    so will not only give you convenience when viewing your coding but other people.
    This is a best practice if you are working with a team.


    It is also significant to qualify column names using table names when writing
    SELECT statements. This will prevent future issues when there are different tables
    with similar column names. You just learned to shorten the table names using an
    alias.


    You can also specify data extraction of the SELECT statement by clauses such as
    FROM. The FROM clause allows you to specify which table to look at whenever your
    SQL statement looks for columns. Aside from that, FROM clause also allows you
    to assign an alias for the table name.


    I am aware that this book is basic, but it is enough to prepare you in moving
    forward to advanced studies in the structured query language. As a beginner, there
    is no need for you to rush immediately on how to create your own database. It
    is important to learn which database model functions SQL.


    If you want to continue learning about SQL, then I suggest that you take advantage
    of the book’s sequel where you will be introduced to deeper clauses of SELECT
    statements, JOINS, handling data, and table creation.

