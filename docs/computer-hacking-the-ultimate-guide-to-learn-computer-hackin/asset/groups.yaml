    and cumbersome to get the answer we need. This is the disadvantage in using a
    column-base database. The second problem is that we will end up with a lot of
    NULL values for those who only have one email address. Third, this design is not
    practical and you do not need to be a database specialist to realize that.


    In order to address these three issues, here is how we can do it.


    | Key | First Name | Last Name |

    |---|---|--|

    | 1 | John | Doe |

    | 2 | Maee | Lee |


    The first step is to create a table for the entity first. In this table, we assigned
    the first column for the primary keys. The second step is to create another table
