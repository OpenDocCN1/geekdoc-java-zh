    People are becoming increasingly aware of this risk when doing online shopping
    or entering their card details, and therefore various measures are being put in
    place using passwords and answering security questions. The aviation industry
    is another field in which computer security is of the utmost importance, because
    the consequences of a breach in security can range from the publication of confidential
    information, to the loss of expensive equipment and human life.


    There are various reasons why the aviation industry may become subject to a computer
    security attack, depending on the motivation for the crime. These motivations
    include sabotage and espionage in the military aviation industry, and industrial
    competition and terrorism in commercial aviation industry. Air traffic control
    is one of the aviation industries most vulnerable systems, any attack can be difficult
    to trace, and are relatively simple because it only requires a spoofed message
    on the radio.


    There are those who seek to exploit computer vulnerabilities (either through thrill
    seeking, to make a political/social statement or for financial gain) and of course
    on the other side those who work to uphold computer security against such threats.
    Somebody with knowledge of technology, and the ability to hack into computer systems,
    can therefore either become involved in the illegal and unethical form of hacking
    (otherwise known as cracking), or serve the other side by identifying threats,
    improving security measures and alerting companies to the vulnerabilities in their
    systems.


    For those whose aim is to protect computer security, there are various countermeasures
    to guard against damaging hacking, whereby the risk of being vulnerable to a breach
    of computer security can be minimized or eliminated. These precautions vary in
    cost and complexity, but can include: intrusion detection systems (to detect threats
    and also analyze attacks after the event), the use of account controls (passwords
    and encryption of data); and the installation of firewalls (providing either hardware
    or software package filtering of certain forms of attack.


    Precautions against a computer system being compromised by attack include making
    steps to prevent attack, ensure any potential attacks are detected, and the ability
    to respond to an attack to prevent further damage.


    However, despite being a range of countermeasures available, computer systems
    still remain vulnerable to attack and it is certainly not uncommon for a computer
    to have its security compromised. The first reason why attempted security violations
    still occurs is that the police are often unfamiliar with computer technology
    and as a result do not either the skill or the inclination to solve the crimes
    and apprehend the criminals responsible.


    Furthermore, any investigation of such matters requires a search warrant in order
    for an officer to examine the entire network and this can make the procedure extremely
    time consuming. Another difficulty in ensuring computer security is that in the
    age of globalization, in which information can be shared throughout the world
    using the internet, and technology can spread data extremely easily, identifying
    and apprehending those responsible is particularly difficult.


    The reason for this difficulty is that a hacker might be working from one jurisdiction,
    while the system they are hacking into is in a different jurisdiction. Furthermore,
    hacker can use various techniques (such as a temporary dial-up internet) in order
    to ensure their anonymity. The third problem is due to the high number of attacks
    that occur.


    Organizations can be subject to many attacks and therefore are unable to pursue
    every security threat. A computer user would benefit from taking precautionary
    measures in order to ensure their computer security, as once a breach of security
    has occurred there is not much that can be done to rectify it.


    ## Chapter 4 – Hacking Techniques


    There are various techniques that can be used by hackers in order to gain unauthorized
    access to a computer system, in order to wreak havoc, steal money or data, or
    to prevent the system from operating as it is supposed to. The three main methods
    that are used in order to attack a system that is connected to the Internet are:
    network enumeration, vulnerability analysis and exploitation.


    A network enumerator is a program that is used in order to discover the usernames
    and other information from networked computers. The program discovers any weaknesses
    in the computer network''s security and the findings are reported to a hacker
    who may use this information in order to access the network and cause damage (either
    by stealing data or corrupting the network).


    On the other hand, ethical hackers can use the same process simply to discover
    any weaknesses in their system in order to tighten security. Another method used
    is vulnerability analysis, which identifies any points of vulnerability in a system;
    this information can be used to attack the system, or to remove the weakness.
    Vulnerability analysis can lead to exploitation, where the hacker uses the vulnerability
    information in order to breach a computer or system''s security.


    There are many specific techniques that can be used, but they employ the main
    concepts and methods described above. The first more specific example of a hacking
    technique is a vulnerability scanner, which is a program used to check a network
    for susceptibility to attack. A port scanner can also be used, which identifies
    avenues of access to a computer and can establish how to circumnigate a firewall.


    As well as these mechanized devices, hackers can also find these vulnerabilities
    themselves, which can be done by manually searching the code of the computer and
    then testing they are right. Brute-force attack is another method by which a hacker
    can gain unauthorized entry to a computer network, and this involves guessing
    passwords. Password cracking is another hacking technique that uses passwords,
    but rather than guessing the password, the hacker recovers password information
    that has been stored in the computer, or transmitted. A spoofing attack (otherwise
    known phishing) is an enemy program, system or website that poses as a trusted
    one. By falsifying data the hacker is able to masquerade as a trusted system and
    thus fool a program or user into revealing confidential information such as passwords
    or bank details. Another hacking technique that is commonly used is a root kit,
    which is a program that manages to take over the control of an operating system
    by employing hard to detect methods.


    A Trojan horse is yet another technique that is a program which manages to fool
    systems and users; it works by working in one way seeming to be something else.
    By using this method a hacker is able to gain unauthorized access to a system
    and create an access point so that they can re-enter via established route later
    on. A computer virus is the most widely recognized form of hacking, as it is the
    computer threat that most of the public is aware of.


    The virus works by self-replicating and implanting itself into codes and; while
    some computer viruses are malicious some are merely irritating or harmless. A
    computer worm is similar in that it is self-replicating, but it is able to enter
    a computer program without a user inadvertently letting it in, and it does not
    need to insert itself into present programs.


    Finally, a keylogger is a tool that records every keystroke on a given machine,
    which can later be accessed and viewed by the hacker. This is usually to enable
    the hacker to access confidential information that has been typed by the victim.
    In fact, there are some legitimate uses for such a technique, for example some
    companies use a keylogger in order to detect any dishonesty or fraud committed
    by an employee.

