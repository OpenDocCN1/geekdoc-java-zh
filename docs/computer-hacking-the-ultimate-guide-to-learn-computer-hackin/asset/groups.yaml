    a rule on which type of data you can store in it.


    Here are some of the major data types and their short descriptions.


    | Data Type | Description |

    | --- | --- |

    | CHARACTER | Used to define the number of characters allowed in the column. No
    more, less. |

    | CHARACTER VARYING | Used to define the maximum number of characters allowed
    in the column. Can be less but not more than the specific value. |

    | BINARY | Used to dedicate the column for hexadecimal data. |

    | SMALLINT | Used to store numerical data ranging from -32, 768 to 32, 767. |

    | INTEGER | Used to store numerical data ranging from -2, 147, 483, 648 to 2,
    147, 483, 647. |

