    # 引言


    数据库充当容器。它是一个存储空间，程序员可以在其中以建设的方式组织数据。请记住，如果你只处理少量数据，则没有必要创建数据库。例如，处理数百个 Excel 表格需要数据库，而五个表格在没有数据库的情况下也可以处理。


    # 深入观察数据库


    在数据库中组织所有数据允许你轻松执行诸如查询数据、更新数据和删除旧数据之类的任务。


    比方，假设公司必须管理其总财务支出。基本上，有一个特定的部门来处理这些，且该部门有几个人。现在，如果这些人都有自己的表格副本，那么获得不冲突的数据将相当困难。


    相反，数据库能够以更高的准确性和更少的冲突来存储和组织数据。


    另一个帮助你理解什么是数据库的例子是查看手机联系人列表。每个联系人都是一条数据，你的智能手机就是数据库。只需点击几个按钮，你就可以轻松找到正在寻找的联系人。你也可以轻松编辑每个联系人的详情。这种的数据管理比在纸质电话簿中列出每个联系人要好得多。


