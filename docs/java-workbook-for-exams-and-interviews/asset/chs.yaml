  \ for (i = 0; i < 5; i++) {\n            Scanner in = new Scanner(System.in);\n\
  \            n = in.nextInt();\n            s += n;\n        }\n        avg = s\
  \ / 5;\n        System.out.println(\"The sum of 5 no is : \" + s + \"\\nThe Average\
