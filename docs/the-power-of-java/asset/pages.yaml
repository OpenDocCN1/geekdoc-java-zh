    # Understanding Objects


    The way Java handled information and commands was revolutionary. Unlike other
    languages built around commands, instructions to a computer to “do this” or “do
    that,” Java is an object-oriented language. Instead of actions, objects are at
    the center of everything in Java.


    So, what are objects? “Object” is a single word that can mean many things. In
    fact, we can often use it interchangeably with “thing.” In English, we use the
    word “object” to refer to anything that has physical properties—in other words,
    anything we can sense. If you can touch, taste, smell, hear, and see something,
    it might be an object. Often, we use the word when we don''t have a better, more
    specific word ready. For example, you might call something strange shooting across
    the night sky a “UFO” (Unidentified Flying Object).


    In computer programming, an object is a package of data and operations, or actions
    that happen to that data. Packaging data in this way allows programmers to work
    on different parts of their program separately—a great help when working with
    large, complicated projects. The first object-oriented language was called'
