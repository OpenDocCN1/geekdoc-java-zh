  md: 'Simula, invented in 1967, but Java was the first object-oriented language widely
    used.


    Programmers say that objects have states, or characteristics, and behaviors, or
    things the object can do that can happen to the object. To understand this, it
    might help to think of real-world objects. You could say that a fish is an object.
    Every fish has "states" (characteristics): it has a name, a shape, and a color.
    The fish also has behaviors: it can swim with its fins; it can use its gills to
    take oxygen from the water; it can eat and be eaten. There are infinite objects
    in the universe, with infinite states and behaviors. This is also true of Java.


    And just as we love to classify things in the real world—organizing fish by species,
    family, and native environments—we also put Java objects into a class, or a general
    blueprint for creating individual objects. Classes say which states and behaviors
    objects within the class can have. When you finish writing a new program, you
    save it as a new class.


    Finally, a programmer can express an object''s behaviors through a method, a part
    of the code that says what will happen to an object, or how objects will interact
    with each other. The primary method in a class is called a main.'
