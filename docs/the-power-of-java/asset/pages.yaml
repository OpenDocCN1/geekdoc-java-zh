- img_proc: true
  md: '# Sun Microsystems, Inc.


    In the late 1970s and early 1980s, more and more buzz was generating around advances
    in computer technology, and support from the federal government for computing
    research was at a high point. This was probably because the United States was
    in an arms-and-technology race with the Soviet Union—and winning. Military applications
    drove many advancements in computers at this time, but a dedicated group of computer
    enthusiasts—including researchers at major universities as well as garage-hobbyists,
    like Apple Steve Wozniak and Steve Jobs—started to imagine broader markets for
    computer hardware and software in commercial industries and for personal use.
    A few of these far-sighted inventors and investors banded together in 1982 to
    form Sun Microsystems, Inc., which would quickly rise to become one of the biggest
    computer companies in the world.


    German-born Andy Bechtolsheim was a graduate student at Stanford University working
    on a computer “workstation” for the Stanford University Network. He met earlier
    Stanford Business School graduates Scott McNeally and Vinod Khosla, who worked
    for Daisy Systems and Onyx Systems, respectively; both companies were driving
    advancements in microchip technology. These three quickly moved to form a computer
    hardware and software manufacturing company, taking the initials of their alma’s
    Stanford University Network. Bill Joy, a Berkeley graduate working on an operating
    system called Unix for Bell Labs (later AT&T), the dominant telephone company
    in North America for more than a century, soon joined them. These four secured
    funding'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'from investors and wasted no time in disrupting and reshaping the computing
    world.


    In its first decade, Sun cashed in on Joy''s experience working on Unix by selling
    affordable workstations (computers for scientific and technical needs) that used
    the Unix operating system. They later expanded into servers (hardware for storing
    data). Sun''s longest-lasting achievement, however, is probably the invention
    of the programming language and development platform Java, which brought Sun into
    new markets for smartphones and other consumer electronics, and which has greater
    name recognition than Sun itself.


    Java lives on, but Sun''s success couldn''t last. Early investment in Sun was
    based on the company''s quality and reasonably priced products, as well as on
    its developers'' record of remarkable innovation. That was fueled, however, by
    the "dot-com bubble." In the stock market, a "bubble" occurs when people begin
    trading stocks or goods in a price range far beyond their real value. "Bubbles"
    do not deflate, or return to a stable state gradually; they burst when investor
    interest drops off suddenly, and companies built on inflated trading prices collapse.


    The dot-com bubble occurred between 1995 and 2001. Interest in the booming internet
    was so high, and so unreasonable, that companies could increase the value of their
    stock simply by adding "e" to the front of their name, or "com" to the end. The
    bubble burst in January 2000. Companies merged or declared bankruptcy and disappeared;
    internet-based companies and technology manufacturers lost over $5 trillion in
    market value, a free fall when the terrorist attacks of September 11, 2001, only
    accelerated. Some of the companies that survived, like Amazon, Google, and eBay,
    were left to dominate fields suddenly cleared of competition.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Sun Microsystems, Inc.

    continued


    Sun did recover, but not completely. In the late 1990s, Sun’s motto was, “We’re
    the dot in dot com,” and this wasn’t all bluff: serious, successful companies
    used Sun products for computing. Shockwaves from the bubble bursting hit Sun and
    knocked the company from its top spot. It suffered another blow in the Great Recession
    of 2007 to 2009. Soon there was talk of IBM buying Sun, though this deal never
    came to pass. After twenty-seven years at the top of the computer industry, Sun
    shareholders sold the company to Oracle for $5.6 billion. Oracle started deep
    layoffs, while top engineers soon resigned, and the founders—Bechtolsheim, McNealy,
    Khoslaalli, and Joy—went on to successful careers as investors, inventors, and
    managers of later startups. All are still active in the computer industry today.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'had a huge impact on the way Sun did business. The company started to focus
    more on interconnectivity as an ultimate goal. Part of the “power” McNealy imagined
    came from the unlimited sharing of information. If one person invents something
    and keeps it to herself, that technology will stay at its current level of development
    until the inventor finds a reason and way to improve it. But if every new invention
    was shared instantly, all of its parts and processes shared with all of the innovators
    in the world, then you can bet that some of those people would find way to improve
    the invention right away. Because of Scott McNealy’s attitude and the attitude
    of others who shared his beliefs, that’s how much of the internet works today.
    We call this an open-source model. Open-source means that the original, or “source,”
    code for something is freely available for people to study and change. When someone
    invents a new tool or language, they very often share that information with the
    whole world, through the web, giving others the opportunity to improve on what
    they’ve made. This speeds up the rate of technological development, you might
    even say it speeds up the rate of human history.


    Keeping their motto, “The network is the computer,” in mind, the FirstPerson researchers,
    still led by Gosling, started work on a browser like Mosaic'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'that would use the language they had created for their now-abandoned *7 device.
    They studied different areas of the fast-developing tech industry, traveling to
    consumer electronics manufacturers in Europe and Asia. They saw these consumer
    electronics, like CD players, pagers, cell phones, cameras, radios, and even toy
    helicopters, as being on a “collision course” with the internet. They saw, in
    other words, the future we now know as the present. They knew that they were creating
    something powerful, maybe so powerful that it could change the world. But they
    also knew that something so important needed a better name than Oak.


    # What’s in a Name


    “Oak” wouldn’t work. It was fine to use as a code among Sun developers, but another
    company, Oak Technologies, had trademarked the name, so the Sun employees had
    to come up with something else before they went public with their new ideas.


    Kim Polese, the Oak product manager, gathered the entire team working on the new
    technology into one room, with a whiteboard in the front. It was January of 1995,
    and Sun was almost ready to debut their new technology. It would be a good old-fashioned
    brainstorming session. Polese wanted a name that captured the “essence” of the
    language and platform—'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'something “dynamic, revolutionary, lively, fun.” The team members started shouting
    out names, and Polese wrote them on the whiteboard. People in the room that day
    remember a few of the names suggested: Ruby, Silk, Neon, WRL (for WebRunner Language),
    DNA, Lyric, Pepper. Gosling recalls the session as “craziness,” with at least
    a dozen people shouting out words and then arguing over the suggestions. They
    managed to narrow their list down to about a dozen finalists, and sent these to
    their lawyers. The legal team advised that only Java, DNA, and Silk were safe
    choices.


    One programmer, Arthur Van Hoff, credits another colleague, Chris Warth, as the
    one who shouted out “Java” first. Warth doesn’t remember if he offered the name
    “Java” or not, but he does admit to having a cup of Peet’s Java—the coffee of
    choice at Sun in those days—in hand at the meeting.


    Sometimes used as a synonym for coffee, Java is actually the name of one of the
    islands that make up Indonesia. Dutch traders brought the coffee plant, native
    to Ethiopia, from their Indian colonies to Indonesia at the end of the seventeenth
    century. Within a decade, the Dutch East India Company was shipping the first
    “Java beans” for sale in Europe. Today, Indonesia is the fourth largest producer
    of coffee in the world. While beans from other islands are growing in popularity—like
    the Sumatra, Bali, and Sulawesi'
  merge: -1
