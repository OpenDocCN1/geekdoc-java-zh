- img_proc: true
  md: 'over Pokémon Go—the billion dollars, hundreds of millions of downloads, and
    hundreds of thousands of accidents—was the result of an effort to bring together
    many different technologies across many different computer platforms.


    To do this, the designers of the game took old technologies and used them in new
    ways. One important tool was GPS. GPS, or “Global Positioning System,” uses satellites
    to track the movement of devices on Earth. It wasn’t a new technology—most phones
    were already made to be tracked this way. The game also depended on a phone’s
    built-in camera. This was old, too: manufacturers introduced cameras to flip phones
    more than ten years before people started using things like Snapchat and Instagram.
    (Fun fact: the word “selfie” was first used in 2002 in an Australian online forum,
    but it took a full decade to become popular everywhere. Oxford English Dictionaries
    named “selfie” their word of the year in 2013, and Merriam-Webster added the word
    to its dictionary the following year.) But the makers of Pokémon Go brought these
    older technologies—GPS and built-in cameras, as well as others—together. Because
    of this, they were able to place the collectible characters from their Pokémon
    franchise into the “real world.” To bring all these systems together, the developers
    had to a “language” that could speak with all those other'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'technologies: the GPS, the camera, the touch screen, the phone’s operating
    system, and the game’s servers. Not only did the language Java make all this possible,
    but the very belief that vastly different computing systems can and ought to be
    able to work together seamlessly grew out of a revolution in thinking, a revolution
    in which Java played a pivotal part.


    # Modern Computing:

    A Brief History of thenWeb and the Internet


    This story goes back to 1991. This was a year of quiet turning points. The Cold
    War ended, as the Soviet Union broke up into fifteen separate nations. The United
    States began its continuing military involvement in the Middle East with Operation
    Desert Storm. The popular video game character Sonic the Hedgehog debuted, as
    did the Super Nintendo Entertainment System, or SNES, and two German tourists
    discovered a three-thousand-year-old mummy and named him Ötzi. Then, on August
    6, the British scientist Tim Berners-Lee released something called the World Wide
    Web to the public, and life as we knew it was radically changed.


    While we sometimes use the words interchangeably, the internet and the web are
    two different things. The internet refers to a system of computers—machines that'
  merge: -1
  pgno: 13
- img_proc: true
  md: '![](img/19410b144b02d2e20b6062d7d1bf5f38_14_0.png)


    Computers today are much slimmer than those from earlier decades, like this IBM
    notebook from the 1990s.


    carry out arithmetical or logical tasks automatically—connected all over the the
    world. This system began with US government research in the 1960s. Scientists
    and members of the military had been using precursors to modern computers for
    centuries, but these machines were becoming increasingly complex. Researchers
    in California, say, wanted a way to access data held in Wisconsin—or anywhere
    else. The US Department of Defense established rules that allowed different computers
    to use radio waves and electric and fiber optic cables to communicate, exchanging
    data and commands. By the 1980s, military and academic communities were widely
    using this limited internet.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'In January of 1991, English scientist Tim Berners-Lee, who worked at the nuclear
    research facility CERN in Switzerland, introduced the World Wide Web, an information
    space using the internet to identify, organize, and link text documents, and eventually
    images, audio, and video. At first, this was only available to scientists at research
    institutions, but by August of that year, the general public had access. Today,
    when you use a browser like Safari, Internet Explorer, Firefox, or Google Chrome,
    you''re using a tool invented to give you access to that same web. The information
    space designed to help scientists share data now lets you post photos to Facebook,
    buy tickets to concerts, browse Pinterest and Amazon, upload music to SoundCloud,
    and make memes.


    # # New Language for a New Frontier


    Each new advance and innovation pushed programmers to dream up more and more daring
    uses for these powerful new technologies. To make computers “do” anything at all,
    though, you need a way of commanding them—and to command, you need a language
    to carry that command. We call this computer programming.


    Whether you know only one language, or two, or several, you probably know what
    it''s like to use different “languages” for different situations. You'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'speak one way to your teacher, one way on the basketball court or baseball
    diamond, one way to your parents, and another way to your friends or siblings.
    Computers work the same way: they “talk” in different languages to get different
    things done. Individual computers operate on something called machine language,
    which consists of strings of binary code. “Binary” just refers to something that
    has two parts; in the case of computers, binary code is made up of long strings
    of 1s and 0s. As you might imagine, it would be very hard (and time-consuming!)
    for a human to give any complex directions using binary codes. Additionally, different
    computers read binary code in different ways. To make programming easier, and
    to help computers communicate with each other, computer pioneers created assembly
    language, which introduced letters and recognizable words. This allowed programmers
    to refer to blocks of data by name, and to deliver short, easily expressible commands,
    rather than stringing together long lines of binary digits.


    Programmers still use assembly language for certain tasks, but as humans started
    to use computers to draw on v and vaster sets of data, and to perform more complicated
    functions, researchers realized they would need even more sophisticated languages.
    Today, there are more than two thousand computer languages.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'You might recognize some of the names: some of the more popular are C, C++,
    PHP, and JavaScript. Java is one of the most popular, powerful, and influential
    of these languages.


    # The Green Team


    In 1991, the same year that the World Wide Web was opened up to public access,
    programmers at a company called Sun Microsystems, Inc. began work on what would
    eventually become Java. The top executives at Sun knew a change was coming to
    computer culture, and they wanted to get out ahead of it. They took some of their
    best programmers and gave them an enormous challenge: anticipate the next big
    trends in computers and build something to take advantage of them. These thirteen
    employees were called “the Green Team,” and they set up shop in Menlo Park, California,
    away from the main Sun offices. They even cut off most regular communication with
    the rest of the company, as they worked day and night for eighteen months, trying
    to predict the future.


    Their first idea was that computers would eventually play a bigger role in digital
    entertainment. The Green Team imagined people using handheld devices with animated
    touchscreens to control their TVs. They built a device called the Star Seven (*7)
    that did exactly this. They were right, but they were about twenty years'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'ahead of their time. Today, you can program your TV to record shows from your
    phone, video game systems have taken over home entertainment, and streaming services
    like Hulu and Netflix give more choice in how they use their televisions and their
    time. You don''t just flick through channels when you turn on a TV—you search
    for exactly what you want, you can look at trailers and previews, and you can
    even use your voice to deliver commands. Back in the early 1990s, cable companies
    weren''t too keen on giving up so much control to their consumers, and video-on-demand
    was just in its infancy. The *7 didn''t take off, but the technology that made
    it possible did.


    The *7 device used a new programming language. The lead Green Team developer,
    James Gosling, invented the language and named it Oak, after a tree outside his
    office window. But cable companies weren''t interested in their product. The team
    members needed to find another use for this new technology, and the language that
    powered it. To come up with an answer, they met at a ski resort, the Inn at Squaw
    Creek, near Lake Tahoe in California.


    By this point, developers were using the internet to store and share text, graphics,
    and even video. To do this, they used a language called HTML, hypertext markup
    language. This is the language behind most of the web pages that you use. HTML
    lets programmers'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'create pages displaying different kinds of text and graphics and also lets
    them place links to other web pages. HTML can transfer information between different
    devices—so you can display and navigate web pages written in HTML whether you''re
    using a Mac, a PC, your phone, or another device. However, a user can''t do much
    to interact with a web page written only using HTML.


    # "The Network Is the Computer"


    The Green Team, which switched its name to FirstPerson, got back to work, shifting
    focus from television to the internet. By 1993, the introduction of a web browser
    called Mosaic had started to bring more and more casual users to the web. The
    name Mosaic came from the art form of using many tiny pieces of glass, marble,
    or other colored materials to make a bigger picture. This captured the spirit—and
    one of the challenges—of the early web. Sharing information and commands among
    machines was difficult because the machines themselves were different: each type
    of machine “spoke” its own language, and there was not yet a language that would
    make it easy and efficient for different types of machines, or operating systems,
    to communicate. Anything that could bring all different machines—and users—together,
    whether a web browser or a programming language, would work'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'like a mosaic, using thousands and eventually billions of individuals to make
    up one massive, colorful whole: a network.


    The developers at Sun Microsystems started thinking about the internet in a new
    way. They realized that the internet was becoming a lot like what they''d hoped
    the cable companies would make, an interactive multimedia network. Scott McNealy,
    the co-founder, chair, and CEO of Sun, came up with a new slogan for the company:
    “The network is the computer.” It sounds a bit like a riddle, but it makes a lot
    of sense if you think about it. People tended to think of the first personal computers,
    or PCs, as labor-saving devices, the way you might think of your toaster, blender,
    or lawn mower. But “connecting” all the toasters in the world wouldn''t make them
    any more powerful. Perhaps you could arrange a million toasters to toast at the
    same time. That would be cool, but not very practical. Computers, McNealy and
    others started to realize, we were different.


    One PC was powerful, but a network of millions and later billions of PCs would
    have literally infinite potential. Instead of putting the PC at the heart of the
    computing world, Sun Microsystems encouraged its employees and customers to think
    of the network first. The real power wasn''t in the personal computer, but in
    the fact that billions of PCs could be connected. This'
  merge: -1
