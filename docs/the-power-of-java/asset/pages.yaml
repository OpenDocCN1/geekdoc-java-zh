  md: '# The History of Java


    Between the time you wake up and the time you fall back asleep, you probably watch
    TV, browse the **internet**, use apps on a smartphone, and connect to Wi-Fi through
    a router—and most of these things you''ll do multiple times in a day. In the same
    day, you might swipe a credit card, use a Kindle or other e-reader, take cash
    out of an ATM, pay for parking at an electronic meter, print something, and set
    or disarm a home security system. You don''t usually spend much time thinking
    about all these things. Some of the


    Opposite: Your text messages may be short, but millions of lines of code are working
    behind each one.'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'actions are automatic, they''re so much a part of daily life in the twenty-first
    century.


    But none of this would be possible if, decades ago, a few wildly inventive people
    hadn’t dreamed about groundbreaking new ways humans could interact with machines
    and with each other. They dreamed that instead of just using computers to create
    plain old text and pictures that didn’t move, and using the internet to share
    these, people could interact with responsive computers. That could mean something
    as simple as clicking and dragging files across a screen to your desktop’s “recycling
    bin,” or something as complex as running an airplane’s control systems. A computer
    programming language—a language that humans write, and that only machines can
    “speak”—is what makes all this possible. There are hundreds of these languages,
    and all have different strengths and functions. One that powers cable TV, internet
    routers, smartphone apps, and household electronics is called Java. Java has shaped
    the modern world, and whether you realize it or not, you use it every day.


    # Java in Your World:

    Smartphones and Pokémon Go


    The summer of 2016 was hot. According to American climate scientists, 2016 was
    the hottest year recorded on Earth, and July and August were the'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'hottest months of that year. Usually temperatures that high keep people indoors,
    in the comfort of air conditioning, or at least close to fans and cold drinks.
    But that summer, many people chose to spend more time outdoors.


    Through July and August, almost everywhere you went outside, you''d see people
    walking back and forth over sidewalks and lawns, in no apparent pattern, heads
    bent down to smartphone screens. There was something hotter than the temperatures
    that summer: a new, simple smartphone app called Pokémon Go.


    On July 6, video game company Nintendo, along with game development company Niantic,
    released a game that would reboot a twenty-year-old brand called Pokémon and at
    the same time change the way both kids and adults interacted with their phones
    and with each other. It wasn''t just a fad—it was a phenomenon. The game became
    the fastest-growing app—or application, a name for any computer program, from
    massive games to tiny tools like calculators—in the history of smartphones. Today,
    it stands as the most popular smartphone game ever. Only six months after it launched,
    the app had earned its makers $1 billion.


    Digital characters hovered over real tables and chairs, seemed to hide behind
    trees and bushes, and lurked in lakes and grayards, ready to be captured.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '![](img/19410b144b02d2e20b6062d7d1bf5f38_11_0.png)


    The potential dangers of playing Pokémon Go became clear soon after it was released.
    This sign was posted in New York City the summer of 2016.


    Players could train their Pokémon to fight. The winners of these battles were
    rewarded with control of virtual “gyms” scattered around the real world—places
    like libraries, schools, parks, and coffee shops. It didn''t matter what brand
    of smartphone or tablet you had: anyone could play. The game was popular, and
    sometimes dangerous; some players were so distracted that they broke bones, crashed
    cars, or were robbed. One newspaper reported that players caused over 110,000
