  md: '**compiler** A computer program that transforms the source code for another
    program into a different programming language.


    **computer programming language** A system of written instructions for communicating
    data and assigning actions to computers.


    **GPS** Global Positioning System; a technology that uses satellites to track
    the movement of devices—and the people that carry or ride in—on Earth.


    **integrated development environment (IDE)** An IDE is a software program that
    functions like a workshop in to code. Most IDEs contain a source code editor,
    a tool that automates coding, and a debugger.


    **internet** A global system of interconnected computers.


    **interoperability** The ability of different languages to interact and operate
    upon the same data structures.


    **Java Development Kit (JDK)** A package containing all the basic tools you need
    to write and run Java programs; this includes the JVM.


    **Java Virtual Machine (JVM)** A virtual “computer” that allows Java programs
    to be portable, or work on any platform.


    **machine language** Numeric codes for the operations that a given computer can
    execute directly, these usually consist of strings of 1s and 0s.'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'main A type of method in a Java app; the first or most important thing that
    a Java app will do.


    method In Java, a method is a way of expressing an object''s behaviors—what the
    object will do.


    Mosaic An early web browser, produced by the National Center for Supercomputing
    Applications between 1993 and 1997, named after the art of arranging tiny pieces
    of glass or other colored materials.


    object-oriented A term that refers to programming languages built around objects
    rather than actions.


    objects In computer programming, an object is a pre-defined unit containing data
    and information. Complex coding is easier with objects.


    open-source Software for which the original source code is freely available to
    be studied and modified.


    paradigm A system of beliefs, assumptions, and attitudes that affect the way an
    individual or group perceives and interacts with the world.


    plug-in An additional feature on an existing program, such as a search function
    or virus scanner on a website.


    portability A programming language that can run on any platform.


    scalability A way of measuring (or at least talking about) the ability of a computer,
    network, or program to handle many users'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'simultaneously. A program, for example, scan scale “up” (by adding memory,
    etc.) or scale “out” (by adding more computers, etc.).


    **states** In Java, characteristics of an object.


    **string** A packet of information, or data, in many computer programming languages,
    including Java.


    **syntax** A set of rules about the arrangement and interpretation of words in
    a sentence; or, in the case of Java, the arrangement and interpretation of classes
    and objects.


    **Virtual Network Computing (VNC)** A system that allows one computer user to
    view and control the desktop of another, remote computer.


    **World Wide Web** An information space using the internet to identify, organize,
    and link text documents, images, audio, and video.'
  merge: -1
