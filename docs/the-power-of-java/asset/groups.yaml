  mdcn: '

    虽然它不是一名严谨的程序员需要掌握的唯一语言，但它是最具影响力的语言之一，而且并不上手。如果你想成为一名计算机程序员，从 Java 开始会是一个明智的选择。


    ## 所以，你想成为 Java 程序员吗？


    如果你想开始编写 Java 代码，你需要下载 Java 开发工具包（JDK），它满足了编写 Java 的所有基础需求。它将为你提供 JVM 以及用于加载、运行、归档和调试代码的工具——以及更多功能。你可以从
    Oracle 官方网站免费获取 JDK。


    然后，你需要一个进行实验的地方。这被称为集成开发环境（IDE）。IDE 就像是用于编写代码的“沙箱”——如果这些沙箱配备了起重机、推土机和其他重型建筑设备的话。一个
    IDE 将包含一个源代码编辑器、一个自动化代码构建的工具和一个调试器。


    你可以先从 Greenfoot 开始。Greenfoot 是一个免费的 IDE，可以在 Mac、Windows、Linux 或 Solaris 电脑上运行。你甚至可以将
    Greenfoot 下载到 USB 闪盘中，无论去到哪里都能在不同的电脑上运行它。Greenfoot 是年轻程序员学习 Java 的绝佳方式，因为它是可视化的：你可以看到自己正在构建的内容，而且学习过程是围绕制作有趣的游戏展开的。由于有了可视化环境，你可以迅速看到努力的成果。你甚至可以将你的作品发布到网上。那里有实用的教程，其他使用
    Greenfoot 的人们会在 IDE 的在线社区中不断分享他们的成功经验和遇到的困难。


    一旦你在 Greenfoot 中学会了足够的知识，就可以转向更高级的 IDE 了。Greenfoot 是基于 IDE BlueJ 构建的，BlueJ 也是一个非常适合初者的简单环境，尽管它的可视化程度较低。这是一个非常强大的
    IDE，并获得了 Gosling（Java 之父）的认可。最后，你可以转向专业级的 IDE。其中许多仍然是免费的：最著名的对有 Eclipse 和 NetBeans。其他像
    IntelliJ 这样的工具虽然是付费的，但它们提供了对专业、高强度开发者至关重要的额外功能。当你准备好尝试这些专业级应用时，你已经精通了 Java，并且会更清楚地知道你想从
    IDE 中获得什么。


    ## 为编程职业进行自我教育


    随着你对 Java 的运用变得越来越精通，你可能会参加一些教程或其他免费在线学习计划，并从现实生活中和网上遇到的程序员那里学习技巧。在高中阶段，你可能会上第一门编程课程或加入一个社团。


    最终，你必须对大学做出决定。你现在应该知道，不需要计算机科学学位也能找到计算机编程方面的工作。当 StackOverflow（全球最大的程序员网络社区）在
    2015 年对社区成员进行年度调查，并询问有多少人拥有计算机科学学位时，这个数字接近一半。拥有博士学位的人极少，年龄在四十岁以上的人也极少。（这是统计学中一个重要的教训：调查是不完美的快照，因为它没有考虑到所有不使用该网站的程序员——而这些人通常年龄较大，且更有可能有大学学位。）


    在回复 StackOverflow 调查的约 50% 的程序员中，他们没有计算机科学学位，进入行业的路径非常不受规且可能很困难。如果你想成为一名程序员但不想获得计算机科学学位，你可能会完全被某些公司拒之门外。例如，Google
    目前不会对没有计算机科学学位的候选人进行任何工程位的面试。无论你的经验如何，如果没有学位，很难晋升到高层。


    然而，你可能会在初创公司（最近成立并试图颠覆某个行业的公司）获得职位——科技领域总有许多初创公司，对程序员有大量需求。你也可以通过“侧门”进入这个行业。如果你有计算机科学的经验但获得的是经济学学位，你可能会为银行、投资公司或研究机构工作，期间开始接触编程工作，一旦积累了足够的经验，就可以跳槽进入真正的科技工作。在技术和计算机行业，有越来越多的人开始质疑大学学位的价值。互联网支付公司
    PayPal 的创始人 Peter Thiel 拥有一个基金会，该基金会向20名年轻人每人支付 10 万美元。


    所以，成为程序员没有一条一成不变的路径。重要的是你愿意学习、构建和探索。


    ## Java 之外：其他语言


    如果你对学习 Java 以上的语言感兴趣，还有许多其他语言可以考虑。每种语言都有自己的优势，并被用于行业的不同领域。


    - Ruby：以语法简单著称，通常用于 Web 开发。

    - JavaScript：Web 语言，用于创建交互元素。

    - PHP：一种广泛使用的服务器端脚本语言，特别是用于 Web 开发。

    - Python：因数据科学、人工智能和 Web 开发而流行。

    - Go：由 Google 创建，用于云服务和网络编程。

    - Swift：Apple 的语言，用于开发 iOS 和 macOS 应用。


    技术世界在不断变化，保持好奇心并持续学习至关重要。无论你从 Java 还是其他语言开始，限制你的只有想象力。


