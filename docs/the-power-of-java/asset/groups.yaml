    # NASA’s World Wind: an Interoperability Study


    NASA''s World Wind is a virtual globe, sort of like Google Earth, but customizable,
    and loaded up with an extraordinary amount of data from NASA''s satellites and
    other equipment on Earth and space.


    With World Wind, users can explore the Earth—and even Mars, Venus, and several
    moons—in real-time, watching as the sun''s light recedes and cities brighten in
    the night. Mountains and other topographical features display in 3D, and with
    plug-ins you can even overlay pinpoints that link to Wikipedia articles, on things
    like the Great Wall of China or the Marianas Trench.


    These plug-ins call on a host of programming languages, like C#, J#, and VB. In
    the beginning, World Wind was only available on Microsoft operating systems, but
    NASA scientists wanted to bring it to everyone through the web, which meant it
    would have to run through a browser’s HTML and work on any operating system.


    Bringing such a powerful program to absolutely any user—even users of smartphones
    and tablets—would be a huge challenge for interoperability, so NASA programmers
    used Java to make it happen.


    World Java, released in 2017, made the entire World Wind program a Java app capable
    of running (through HTML) on a web page on any operating system, including all
    the plug-ins in other languages, and still calling on data from hundreds of NASA
    projects collected with software built with countless programming languages.'
