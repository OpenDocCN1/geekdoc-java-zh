    \n# Java 的历史\n\n从你醒来到你入睡，你可能在看电视、浏览互联网、使用智能手机上的应用，并通过路由器连接 Wi-Fi——在同一天内，你可能刷过信用卡、使用\
    \ Kindle 或其他电子阅读器、从 ATM 取出现金、支付停车费、打印东西并设置家庭安防系统。你通常不会花很多时间考虑这些事情。\n\n相反：你的短信可能很短，但每一条短信背后都有数百万行代码在运行。\n\
    \n这些动作中的大部分是自动的，它们已经成为21世纪日常生活的重要的一部分。\n\n# 你世界中的 Java：\n智能手机与宝可梦\n\n2016年的夏天非常热。根据美国气候科学家的说法，2016年是地球最热的一年，7月和8月是该年最热的月份。通常，这种温度会让人们留在室内，享受空调的舒适，或者至少靠近风扇和冷饮。但那个夏天，许多人选择在户外度过更多的时间。\n\
    \n在整个7月和8月，无论你走到哪里，都能看到人们在人行道和草坪上来回走动，没有明显的规律，低头盯着智能手机屏幕。夏天比气温更热的还有东西：一个名为Pokémon\
    \ Go的新型简单智能手机应用。\n\n7月6日，游戏公司任天堂联合游戏开发公司Niantic发布了一款游戏，这款游戏重启了一个拥有二十年历史的宝可梦，同时也改变了儿童和成人与手机以及相互互动的方式。这不仅仅是一种时尚——它是一种现象。该游戏成为智能手机历史上增长最快的应用（或应用程序，从大型游戏到计算器等微型工具的任何计算机程序）。今天，它是历史上最流行的智能手机游戏。发布仅六个月后，该应用就为其制者赚了10亿美元。\n\
    \n数字角色悬浮在桌椅上方，似乎躲在树木和灌丛后面，潜伏在湖泊和墓地中，等待被捕捉。\n\n![](img/19410b144b02d2e20b6062d7d1bf5f38_11_0.png)\n\
    \n玩Pokémon Go的潜在危险发布后不久就变得清晰。这张牌子是2016年夏天贴在纽约市的。\n\n"
