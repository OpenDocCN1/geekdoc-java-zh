    them. In fact, it''s one of the easier programming languages to learn, once you
    understand some of its basic features.


    # Understanding Objects


    The way Java handled information and commands was revolutionary. Unlike other
    languages built around commands, instructions to a computer to “do this” or “do
    that,” Java is an object-oriented language. Instead of actions, objects are at
    the center of everything in Java.


    So, what are objects? “Object” is a single word that can mean many things. In
    fact, we can often use it interchangeably with “thing.” In English, we use the
    word “object” to refer to anything that has physical properties—in other words,
    anything we can sense. If you can touch, taste, smell, hear, and see something,
    it might be an object. Often, we use the word when we don''t have a better, more
    specific word ready. For example, you might call something strange shooting across
    the night sky a “UFO” (Unidentified Flying Object).


    In computer programming, an object is a package of data and operations, or actions
    that happen to that data. Packaging data in this way allows programmers to work
    on different parts of their program separately—a great help when working with
    large, complicated projects. The first object-oriented language was called'
  - '[PAGE 42]


    Simula, invented in 1967, but Java was the first object-oriented language widely
    used.


    Programmers say that objects have states, or characteristics, and behaviors, or
    things the object can do that can happen to the object. To understand this, it
    might help to think of real-world objects. You could say that a fish is an object.
    Every fish has "states" (characteristics): it has a name, a shape, and a color.
    The fish also has behaviors: it can swim with its fins; it can use its gills to
    take oxygen from the water; it can eat and be eaten. There are infinite objects
    in the universe, with infinite states and behaviors. This is also true of Java.


    And just as we love to classify things in the real world—organizing fish by species,
    family, and native environments—we also put Java objects into a class, or a general
    blueprint for creating individual objects. Classes say which states and behaviors
    objects within the class can have. When you finish writing a new program, you
    save it as a new class.


    Finally, a programmer can express an object''s behaviors through a method, a part
    of the code that says what will happen to an object, or how objects will interact
    with each other. The primary method in a class is called a main.'
