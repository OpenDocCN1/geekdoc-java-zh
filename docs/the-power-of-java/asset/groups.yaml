    things, like attitudes. There are personal paradigms and paradigms that direct
    the behavior of business or identity groups. Sometimes, a new technology or world
    event is so significant that it changes these fundamental assumptions and attitudes.
    We call this a paradigm shift.


    Historians disagree about whether paradigm shifts happen in response to single
    events, or if those events themselves are part of a broader and richer tapestry
    of gradual changes, in which an individual’s choices are less important than the
    cultural and economic forces that direct those choices. For example, you could
    say that the internet caused a global paradigm shift: it changed the way humans
    interact with each other. You could say the same about smartphones. Or, you could
    say that both are developments in a much longer and more gradual paradigm shift,
    describing the merging of human life and machines.


    The invention of Java also caused a paradigm shift—not just in the world of computer
