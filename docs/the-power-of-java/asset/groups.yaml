    # The Wave Glider


    Owned by the company Boeing, which is best known for its airplanes, Liquid Robotics
    makes and sells something called the Wave Glider, a robot that gathers data from
    the ocean. Without a pilot, the Wave Glider can float and function on its own
    for over a year, powered by the energy of the sun, the waves, and—you guessed
    it—Java.


    James Gosling, “father of Java,” joined Liquid Robotics as Chief Software Engineer
    in 2011. Their Wave Glider software uses the Java programming language. It''s
    not surprising that he ended up here: Gosling always had an interest in “cool
    toys.” During the late 1990s and early 2000s, Gosling became known for giving
    fun presentations on robots and other devices that did exciting things with Java.
    This was a small part of his job at Sun (later Oracle), but his interest in “toys”
    might have led him to his current job programming ocean robots.


    The Wave Glider has two parts. There is a platform that floats on the surface
    of the water, gathering energy through solar panels. Suspended below, a “submarine”
    uses movable wings to take the energy of the waves and propel itself forward.


    Gathering data from the ocean has always been difficult. There’s just much of
    it—so much ocean and so much data. Research has been expensive and full of dangers.
    The Wave Glider, however, can collect all sorts of information and upload it immediately
    to cloud storage, so researchers can get to it without ever checking in on the
    robot in person. It can help environmentalists gather data on weather and wave
    patterns and even sonic information about animal migration. Militaries and other
    government operations can use it to'
