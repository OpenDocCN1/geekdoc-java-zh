    \n# The History of Java\n\nBetween the time you wake up and the time you fall\
    \ asleep, you probably watch TV, browse the internet, use apps on a smartphone,\
    \ and connect to Wi-Fi through a router—and in the same day, you might swipe a\
    \ credit card, use a Kindle or other e-reader, take cash out of an ATM, pay for\
    \ parking, print something, and set a home security system. You don't usually\
    \ spend much time thinking about all these things.\n\nOpposite: Your text messages\
    \ may be short, but millions of lines of code are working behind each one.\n\n\
    Most of these actions are automatic, they are so much a part of daily life in\
    \ the twenty-first century.\n\n# Java in Your World:\nSmartphones and Pokémon\
    \ Go\n\nThe summer of 2016 was hot. According to American climate scientists,\
    \ 2016 was the hottest year on Earth, and July and August were the hottest months\
    \ of that year. Usually temperatures that high keep people indoors, in the comfort\
    \ of air conditioning, or at least close to fans and cold drinks. But that summer,\
    \ many people chose to spend more time outdoors.\n\nThrough July and August, almost\
    \ everywhere you went outside, you'd see people walking back and forth over sidewalks\
    \ and lawns, in no apparent pattern, heads bent down to smartphone screens. There\
    \ was something hotter than the temperatures that summer: a new, simple smartphone\
    \ app called Pokémon Go.\n\nOn July 6, video game company Nintendo, along with\
    \ game development company Niantic, released a game that would reboot a twenty-year-old\
    \ brand called Pokémon and at the same time change the way both kids and adults\
    \ interacted with their phones and with each other. It wasn't just a fad—it was\
    \ a phenomenon. The game became the fastest-growing app—or application, a name\
    \ for any computer program, from massive games to tiny tools like calculators—in\
    \ the history of smartphones. Today, it stands as the most popular smartphone\
    \ game ever. Only six months after it launched, the app had earned its makers\
    \ $1 billion.\n\nDigital characters hovered over tables and chairs, seemed to\
    \ hide behind trees and bushes, and lurked in lakes and graveyards, ready to be\
    \ captured.\n\n![](img/19410b144b02d2e20b6062d7d1bf5f38_11_0.png)\n\nThe potential\
    \ dangers of playing Pokémon Go became clear soon after it was released. This\
    \ sign was posted in New York City the summer of 2016.\n\nPlayers could train\
    \ their Pokémon to fight. The winners of these battles were rewarded with control\
    \ of virtual \"gyms\" scattered around the real world—places like libraries, schools,\
    \ parks, and coffee shops. It didn't matter what brand of smartphone or tablet\
    \ you had: anyone could play. The game was popular, and sometimes dangerous; some\
    \ players were so distracted that they broke bones, crashed cars, or were robbed.\
    \ One newspaper reported that players caused over 110,000 road accidents in just\
    \ ten days.\n\nPokémon Go was a phenomenon, but it wasn't a revolution. Some players\
    \ dropped off and moved on to new games. While it remains somewhat popular today,\
    \ it isn't making headlines. Really, all the fuss\n"
