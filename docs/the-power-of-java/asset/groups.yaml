    ## 名字的含义


    “Oak”行不通。在 Sun 开发者之间作为代号使用还好，但另一家名为 Oak Technologies 的公司已经注册了该商标，因此 Sun 的员工在公开他们的新想法之前，必须想出另一个名字。


    Oak 产品经理 Kim Polese 将所有工作这项新技术的团队聚在一间房间里，前面放有一块白板。那是 1995 年 1 月，Sun 已经几乎准备好展示他们的新技术了。这将是一场老式的头脑风暴会议。Polese
