    ![](img/19410b144b02d2e20b6062d7d1bf5f38_99_0.png)


    Cross-platform communication once meant computer-to-computer.

    Today, dozens of devices in your house alone are connected.


    ## The Future of Java


    The future of Java looks bright. Java makes up the foundation of Google''s Android,
    one of the most popular operating systems in the world. That means that there
    will be a demand for hundreds of thousands of Java app developers to satisfy the
    cravings of more than two billion smartphone users for new tools, designs, and
    powers. Likewise, the trillions of dollars per year that flow through the world''s
    biggest companies also depend, in part, on strong support for Java and its enterprise
    applications. Java is still easy to learn, and people new to the language still
    find support in an online user community of millions of Java programmers eager
    to share ideas and experiences, annual conferences devoted just to Java, and massive
    “libraries” of useful Java code others have already written.


    As Gosling noted, Java''s long-term success was built into its foundational principle
    of shared access and cross-platform communication. Today, Java owes its continued
    popularity to a massive user-base that crosses platforms, companies, industries,
    nations, and other (human) languages.


    As you learned earlier, different programming languages have their strengths and
    weaknesses, and most end up doing different tasks. The language C powers the traffic
    lights that make you bring your car to a stop. Java powers the apps in the Android
    smartphone that you use when you''re sitting in the back seat, while beside you,
    a friend or sibling texts on an iPhone, using Objective-C. You decide to place
    an order at a pizzeria near your house before you arrive there, so you pull up
    Google search, which uses C++ and Python, and find the pizzeria''s website, which
    uses HTML and CSS. You click a call button built with JavaScript, and the phone
    begins to ring.


    Soon, new languages will weave themselves into your daily life, as more and more
    technologies—like


    ![](img/19410b144b02d2e20b6062d7d1bf5f38_101_0.png)


    Learn how to say “hello” in any programming language—you can start with Java.


    cars, refrigerators, watches, robot vacuums, and more than any of us can imagine
    connect to the internet, to each other, and to us. Many languages will play their
    specific roles in this. But as specialized as programming languages have become,
    there''s one function that every single programming language has done, and done
    many, many times.


    It’s called “Hello, world!” If you say those two words to any programmer, she’ll
    know what you mean. To demonstrate what a new language looks like, or to teach
    basic syntax to a new learner, programmers will usually write a “Hello, world!”
    app, displaying just that greeting. If you''re going to learn Java programming,
    the “Hello, world!” app will be one of the first that you build, before you learn
    how to do much more impressive and complicated things. But really, every app you
    make, every line of code you write, and every new programming accomplishment you
    achieve will be a way of saying “Hello, world!”


    So, Java programmer: now that you know about one of the most important languages
    to life on Earth, a language millions of people can write and billions of computers
    can read—though neither can speak it—it’s your turn to say “Hello, world!” Say
    it with Java, and say it in a new way, a way that only you could say it. With
    those two words, you just might change the world you’re greeting.


    - **API** Sets of instructions that allow different software programs to interact
    with each other; “API” stands for “application program interface.”

    - **applet** A program that performs a simple task.

    - **application** Anything that performs a task, generally larger or more complex
    than an applet.

    - **assembly language** An assembly language is one step above machine language.
    Instead of 1s and 0s, assembly languages give commands using mnemonic codes like
    “add” and “pay.”

    - **behavior** In object-oriented computer programming (OOP), things that can
    happen to an object, or that an object can do.

    - **binary code** A coding language that uses combinations of 1s and 0s to represent
    any number, letter, or other symbol to a computer.

    - **bytecode** In Java, a set of instructions that allow the Java Virtual Machine
    to translate any programmer’s Java code to work on any operating system.

    - **class** A blueprint or template for creating objects in Java. A class identifies
    states and behaviors.

    - **compiler** A computer program that transforms the source code for another
    program into a different programming language.

    - **computer programming language** A system of written instructions for communicating
    data and assigning actions to computers.

    - **GPS** Global Positioning System; a technology that uses satellites to track
    the movement of devices—and the people that carry or ride in—on Earth.

    - **integrated development environment (IDE)** An IDE is a software program that
    functions like a workshop in to code. Most IDEs contain a source code editor,
    a tool that automates coding, and a debugger.

    - **internet** A global system of interconnected computers.

    - **interoperability** The ability of different languages to interact and operate
    upon the same data structures.

    - **Java Development Kit (JDK)** A package containing all the basic tools you
    need to write and run Java programs; this includes the JVM.

    - **Java Virtual Machine (JVM)** A virtual “computer” that allows Java programs
    to be portable, or work on any platform.

    - **machine language** Numeric codes for the operations that a given computer
    can execute directly, these usually consist of strings of 1s and 0s.

    - **main** A type of method in a Java app; the first or most important thing that
    Java app will do.

    - **method** In Java, a method is a way of expressing an object''s behaviors.

    - **Mosaic** An early web browser, produced by the National Center for Supercomputing
    between 1993 and 1997, named after the art of arranging tiny pieces of glass or
    other materials.

    - **object-oriented** A term that refers to programming languages built around
    objects rather than actions.

    - **objects** In computer programming, an object is a pre-defined unit containing
    data and information.

    - **open-source** Software for which the original source code is freely available
    to be studied and modified.

    - **parad** A system of beliefs, assumptions, and attitudes that affect the way
    an individual or group perceives and interacts with the world.

    - **plug-in** An additional feature on an existing program, such as a search function
    or virus scanner on a website.

    - **portability** A programming language that can run on any platform.

    - **scalability** A way of measuring (or at least talking about) the ability of
    a computer, network, or program to handle many users simultaneously. A program,
    for example, scale “up” (by adding memory, etc.) or scale “out” (by adding more
    computers, etc.).

    - **states** In Java, characteristics of an object.

    - **string** A packet of information, or data, in many computer languages, including
    Java.

    - **syntax** A set of rules about the arrangement and interpretation of words
    in a sentence; or, in the case of Java, the arrangement and interpretation of
    classes and objects.

    - **Virtual Network Computing (VNC)** A system that allows one computer user to
    view and control the desktop of another, remote computer.

    - **World Wide Web** An information space using the internet to identify, organize,
    and link text documents, images, audio, and video.


    ## Further Information


    ### Books

    - Burd, Barry A. Android Application Development All-in-One for Dummies: 2nd ed.
    Hoboken, NJ: John Wiley & Sons, Inc., 2015

    - Conrod, Philip, and Lou Tyree. Java for Kids: A Netbeans Computer Programming
    Tutorial. 8th ed. Maple Valley, WA: Kidware Software, 2015

    - Sierra, Kathy, and Bert Bates. Head First Java. 2nd ed. Sebastopol: O''Reilly
    Media, Inc., 2005


    ### Websites

    - BlueJ: https://www.bluej.org (Download BlueJ, one of the most popular IDEs for
    Java, and find resources developed by King''s College of London and the University
    of Kent.)

    - Greenfoot: https://www.greenfoot.org/door (Find videos, articles, and a free
    program tailored to Java beginners.)

