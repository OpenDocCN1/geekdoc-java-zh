    \n## 理解 Java 语法\n\n在最基础的层，所有语言的工作方式都是相同的。每种语言都包含信息的“数据包”。对于大多数语言，我们把最小的数据包称为“字母”，较大的数据包称为“单词”。例如，字母“D”包含了信息：如果你认识这个字母，你就知道它作为单词的一部分被读出来时应该发什么音。你现在可能就能列出一百个以字母“D”开头的单词。当你把这些包组合在一起时，它们所代表的意义不仅仅是一个声音。例如，如果你把字母\
    \ D-O-G 放在一起，你就组成了一个单词 dog（狗），这个数据包承载了大量信息。仅仅在印刷版上看到 dog 这个词，可能就会在你脑海中浮现出一幅图像。你可能会想到腊肠犬、金毛犬、英国牛犬或贵宾犬。想到自己的宠物或朋友或邻居的宠物时，你会感到爱或喜爱。想起你看到一只愤怒的狗时你可能会感到恐惧，或者想起一只去世的狗时感到悲伤。这一切——所有这些情感和图像——之所以可能，是因为你知道\
    \ D、O 和 G 这三个形状放在一起时意味着什么。\n\n所有语言也有一套语法，或者说一套关于这些数据包如何组合、以及它们的排列如何比任何单个数据包都承载更多意义的规则。你可以对另一个英语母者说“dog”这个词，并相信他或她理解你的意思。但如果你想对狗说什么，你需要更多的单词，如果你没有共享一套关于如何使用这些单词的规则，那很快就会变得混乱。语法让我们表达最深层的情感，给出更复杂的指令，并通过与他人分享这些梦想，将我们对世界的设想变为现实。\n\
    \n数学也是一种语言。它拥有信息包——数字，以及加号、减号、小数点和小括号等符号——数学的语法是允许我们在符号排列成复杂模式时解释这些符号（或信息包）的规则。\n\
    \n就像任何其他语言——如英语、德语或数学一样——Java 也有信息包和允许我们对其进行排列和解释的语法。事实上，一旦理解了它的一些基本特征，它是最容易学习的编程语言之一。\n\
    \n## 理解对象\n\nJava 处理信息和命令的方式是革命性的。与其他以命令（即让计算机“做这个”或“做那个”的指令）为核心的语言不同，Java 是一种面向对象的语言。在\
    \ Java 中，对象是一切的核心，而不是动作。\n\n那么，什么是对象？“Object”（对象）是一个单字，可以表示很多意思。事实上，我们经常可以用它和“thing”（东西）互换使用。在英语中，我们使用“object”一词指代任何具有物理属性的物体——换句话说，任何我们能感知到的东西。如果你可以触摸、尝味、嗅闻、听到和看到某样东西，它可能就是一个对象。当我们没有准备好更好、更具体的词时，经常会使用这个词。例如，你可能会把一个在夜夜空中划过的奇怪物体称为“UFO”（未识别飞行物）。\n\
    \n在计算机编程中，对象是数据和操作（或发生在这些数据上的动作）的包。以这种方式封装数据允许程序员独立地处理程序的不同部分——这在处理大型、复杂的项目时非常有帮助。第一种面向对象的语言被称为\
    \ Simula，发明于 1967 年，但 Java 是第一个被广泛使用的面向对象的语言。\n\n程序员说对象具有“状态”（states，即特征）以及“行为”（behaviors，即对象可以执行或发生在对象上的事情）。为了理解这一点，思考现实世界的物体可能会有所帮助。你可以说鱼是一个对象。每条鱼都有“状态”（特征）：它有名字、形状和颜色。鱼还有行为：它可以用鱼鳍游泳；它可以用鳃从水里获取氧气；它会进食也会被其他生物捕食。宇宙中存在无限的对象，具有无限的状态和行为。Java\
    \ 也是如此。\n\n正如我们喜欢对现实世界中的事物进行分类——通过物种、科属和原生栖息地来组织鱼类——我们也将 Java 对象放入一个“类”（class）中，或者说，是创建单个对象的通用蓝图。类规定了类中的对象可以拥有哪些状态和行为。当你写完一个新程序时，你将其保存为一个新类。\n\
    \n最后，程序员可以通过“方法”（method）来表达对象的行为，这是代码中的一部分，说明了对象将发生什么，或者对象之间如何相互作用。类中的主要方法称为 main。\n\
    \n## 代码结构与语法\n\n正如你可能已经猜到的那样，对象让复杂的编程任务变得简单得多。对象让程序员在组合对象之前，可以一次专注于代码的某一个部分。\n\
    \n如前一节所述，类就像是创建对象的蓝图，这意味着在创建对象之前，你需要一个类。假设你的狗咬破了这本书的首页。因为你想修复这本书的同时测试你的编程技巧，你决定写一个程序来打印一个新的标题（**不用担心你是否认识每一个单词或字符**）。你将开始编写类似这样的代码：\n\
    \n```java\npublic class TitlePageApp {\n```\n\n“public”意味着都可以看到你的程序。“Class”标志着程序的名称将随其后：我们将这个程序命名为\
    \ TitlePageApp。最后，大括号 {} 标志类的开始。基本上，所有执行操作的代码都在大括号之后。（为了让你的程序执行某些操作）它看起来像这样：\n\
    \n```java\npublic class TitlePageApp {\n    public static void main(String[] args)\
    \ {\n        System.out.print(\"The Power of Java\");\n    }\n}\n```\n\n不用担心你是否认识每一个单词或字符。在\
    \ TitlePageApp 的起始行下方，你加入了 main 方法，它包含了关于你的程序将做什么语句：System.out.print(\"The Power\
    \ of Java\");\n\n在这种情况下，你告诉你的程序打印字符“The Power of Java”。这被称为字符串（string）。在 Java\
    \ 中，字符串只是一个信息包或数据。每个语句都以分号 (;) 结尾。第一个大括号关闭 main 方法，第二个大括号关闭类 TitlePageApp。\n\n\
    到目前，你已经学习了许多 Java 知识，而且还想对管理员或下一个拿起这本书的人开个玩笑。所以，你让你的代码变得高级一点：\n\n```java\npublic\
    \ class TitlePageApp {\n    public static void main (String[] args) {\n      \
    \  System.out.println(\"The Power of Java\");\n        System.out.println(\"by\
    \ Stella Lopez\");\n    }\n}\n```\n\n现在，你的程序打印了一个包含两行的首页：你在每个语句的 print 后面加上了 ln，以将语句放在不同的行。如果你愿意，你可以用这种方法复刻整本书。\n\
    \n## 面向对象：超越“main”的代码\n\n虽然你刚刚编写的代码并没有充分利用 Java 处理对象的力量。对象让程序员在组合对象之前，可以一次专注于代码的某一个部分。\n\
    \n如果你玩过俄罗斯方块，思考这个游戏可以帮助你理解 Java 中的对象。在这个游戏中，方块聚集在一起形成不同的"
