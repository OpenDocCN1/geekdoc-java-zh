    we have to look a little more closely at the Oracle purchase of Sun Microsystems,
    Inc.


    Riding on strong hardware sales and the runaway success of Java, Sun became more
    and more devoted to the principles of open-source technology that had helped to
    shape its beginnings. In 1999, Sun bought the rights to software that competed
    with Microsoft’s Office Suite (Word, Excel, PowerPoint, and so on), and released
    this for free. Then, the dot-com bubble burst shortly after. As Sun was a major
    player, the bubble bursting hit them hard, but not hard enough to crush them.
    The company returned to health, but it would never return to its old position
    of dominance; Microsoft, Apple, and Google were the new major players.


    But Sun hung on, in large part due to Java, its enduring popularity, and its growing
    role in mobile phone technology. In 2005, Sun released over 1,600 patents to the
    public, and in 2006, the company made Java open source. This left control over
    Java in Sun’s hands, but anyone could see the source code, use it, and adapt it.
    The company continued to enjoy strong sales and growth.


    Everything changed with the start of the Great Recession in December 2007. As
    the global economy slowed, stock prices dropped—again. This time, the bubble wasn’t
    confined to the tech industry.


    Consumers started spending less, and many companies like Sun suffered. Rumors
    of Sun mergers and buyouts circulated in business magazines and websites. Then,
    in April of 2009, another technology company called Oracle stepped in and bought
    Sun Microsystems, Inc. for around $7.4 billion.


    Not surprisingly, the Oracle executives, led by founder and then-CEO Larry Ellison,
    had some different ideas about how to do business. According to James Gosling,
    Oracle executives were excited early on about the prospect of making even more
    than they’d spent to buy Sun, in a lawsuit against one of the most popular brands
    in the world: Google.


    In September of 2008, Google had released Android, an operating system primarily
    for touchscreen devices like smartphones and tablets. A small team of developers,
    led by Andy Rubin, started Android, Inc. in 2003, and Google had bought the company
    for $50 million two years later, before the system was ready to show the public,
    bringing the founders along as employees to finish the job. While the core of
    Android was written in C, its user interface (the way users interact with the
    system) was all Java. This was exactly the kind of use that had led the Sun executives
    to make Java open source: a powerful innovation from small-time, startup developers.
    But Google was no small-time-startup, and it would soon be making massive profits
    off code largely lifted—without payment—from Sun.


    ## The iPhone in Korea


    While Android was still new on the market, two bigger smartphone producers were
    gearing up for legal battle on a global scale. In 2010, the Korean company Samsung
    released the Galaxy S, a phone


    ![](img/19410b144b02d2e20b6062d7d1bf5f38_80_0.png)


    Your preference in smartphones might be based on the way a phone looks and responds.
    No matter the phone, these characteristics depend on Java.


    that looked and worked a lot like the Apple iPhone, then the smartphone of choice
    for many users. After early talks failed, Apple sued Samsung for copyright infringement.
    After two years, several suits and countersuits, and millions in legal fees, two
    US juries found that Samsung executives and developers had intentionally stolen
    parts of the iPhone''s technology and design, and demanded that Samsung pay Apple
    $400 million in damages. Other courts in other countries ruled that both companies
    violated each other''s patents, and still other courts ruled that neither violated
    any patents.


    The fighting didn''t stop in 2012. In December 2016, the US Supreme Court unanimously
    reversed the earlier decision (and the $400 million award) and sent the case back
    to a lower court for further legal wrangling. In the meantime, smartphones quite
    literally took over global culture. As the amount of money involved in the industry
    grew, the Samsung-Apple battle sucked in nearly every other major smartphone manufacturer
    and developer, including Microsoft, LG, Nokia, and Sony, all involved in a complicated
    crossatch of patent copyright lawsuits. The stakes rose, according to one commentator
    in the British newspaper the Guardian, because of just how many people have a
    smartphone. In the early days of the technology, most smartphone sales went to
    people who''d never had one of the devices before. Now, most sales are to people
    who already have a smartphone. That means for any manufacturer to grow, it has
    to take a customer away from a competitor. At the same time, the rate of advancement
    in smartphone technology has slowed.


    ## A Cold Coffee Date: Oracle and Google Fight Over Java


    And, of course, one of the companies now at the center of the smartphone wars
    is Google. Google turned the (Java-based) Android OS into a success—and a target—in
    part because it''s open source, unlike the iPhone OS in Apple''s iron grip, but
    also manufacturers (including Samsung!) have been able to produce Android phones
    more cheaply than iPhones.


    According to James Gosling, Sun executives had considered suing Google over its
    use of Java code in the Android system before the Oracle buyout. Scott McNealy
    and others reasoned that Google had violated patents, but the company executives
    didn''t want to sue. Google''s use of the lines of code, Gosling said, had a mostly
    positive impact on the community of Java users and programmers. Suing Google would
    cost time and money, and it could be bad for Java''s image. Java''s popularity
    began to decline and even fell below C following the Oracle takeover, in part
    because of new, competing languages, but also, according to TIOBE managing director
    Paul Jansen, because of the way developers perceived Java under Oracle. The company
    seemed to be spending more time on things like its lawsuit against Google, and
    less on maintaining, promoting, and pushing the Java language. Original Java developers
    (like Gosling) left and started promoting other languages, while Oracle developers
    didn''t do much to keep Java fresh, or respond to everyday programmers’ concerns,
    according to one *Wired* magazine analysis.


    ## Java in the Marketplace Today


    According to TIOBE Index, which for two decades has tracked developers'' interest
    and use of different languages, Gosling is right. Java has led the pack—by a wide
    margin—at least since 2001.


    ### TIOBE Community Index

    Source: tiobe.com


    ![](img/19410b144b02d2e20b6062d7d1bf5f38_84_0.png)


    The TIOBE Index charts users'' interests in different languages over time. At
    its peak, Java accounted for over 26 percent of all programming. In the time since
    then, developers have invented many new languages. Now Java accounts for a little
    over 16.4 percent of all programming; C follows at 7.7 percent, and C++ at 5.1
    percent.


    You can learn how to use Java with a free integrated development environment (IDE)
    like Greenfoot.


    Java’s dip was short-lived, as was C’s return to prominence. C, not very well-suited
    to mobile web and app development, has plummeted, while Java, an excellent language
    for that kind of work, has returned to the top spot. The continued success of
    Android, constant advancements in mobile web and app technology (including phenomena
    like *Pokémon Go*), and broad support from a huge community of independent users,
    are many of the indicators that Java will be around for a long time to come.

