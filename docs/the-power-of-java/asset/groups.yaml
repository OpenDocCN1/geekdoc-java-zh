    当时的桌面级硬盘存储在软盘上，而笔记本电脑又笨重、沉重、昂贵且易碎。


    剑桥的研究人员想出了解决方案。这是 Java 的最早新应用之一，而且非常符合 Java 范式。虚拟网络计算（Virtual Network Computing，VNC）允许一台计算机上的用户访问另一台计算机的显示器——遍及任何地方。这意味着旅行者可以使用酒店电脑（这些电脑在
    20 世纪 80 年代后期和 90 年代更为），并使用任何支持 Java 的网络浏览器登录 VNC。酒店电脑的屏幕会显示她家里或办公室电脑的屏幕。她可以在那里继续完成演示文稿的工作。第二天，她可以使用另一台电脑访问同一台家里或办公室电脑，并向观众演示该文稿。VNC
    并不限于演示幻灯片或论文等简单任务：通过 VNC，你可以远程执行坐在自己电脑前可以进行的几乎任何任务。这使得它对于远程技术支持和管理非常有用。如果你的电脑出了问题，而你设置了
    VNC，更有经验的用户可以从他自己的电脑上解决你的问题。由于剑桥团队用 Java 编写了 VNC，它是跨平台的：Mac 用户可以远程访问 Windows 桌面，以此此类推。而且
    VNC 并不限于基于显示器的平台。从任何支持 VNC 的电脑，你都可以访问消费类电子，如可编程的微波炉、灯光、娱乐系统和家庭安系统。


    这种源于 Java 对可访问性和可移植性承诺的发展，推动了软件、应用和其他技术的进一步进步，使通信与协作变得更加便利。


    ## 一次编写，处处调试：跨平台的承诺与问题


    Java 对真正的、无缝的跨平台开发的愿景无疑帮助在 20 世纪 90 年代扩大了对互联网和计算的访问，但它并不总是能实现 WORA（一次编写，随运行）的承诺。尽管
    Java 编译器允许开发者编写一个可以在任何带有 JVM 的平台上运行的单一程序，但不同平台运行程序的方式仍然存在细微差异。即使是编译器和 JVM 也无法考虑到所有的这些变化。程序在
    Mac 和 PC 上运行方式的细微差异通常并不要紧。但有时，它们会导致问题，程序员称之为 bug（漏洞）。在计算机编程中，bug 是导致程序失败或以某种背于开发者意图的方式运行的错误。Bug
    可能是无害的，可能是令人恼恼的，也可能是灾难性的——例如导致整个系统崩溃或破坏数据。


    ## Java 与 Objective-C：为 Android 和 iOS 开发应用


    1998 年，电信公司摩托罗拉（Motorola）签署了一项许可协议，在其蜂窝设备中使用 Java。这是 Java 统治智能手机行业的开始。当 Android
    开发者（约占 80% 智能手机市场的首选操作系统）用 Java 编写他们的操作系统时，Java 的统治地位完全确立了。


    ![](img/19410b144b02d2e20b6062d7d1bf5f38_71_0.png)


    智能手机制造商 Apple 和 Android 一直陷入了一场昂贵的法律斗争中。其核心是 Java 编程语言。


    目前 Android 设备的最大竞争对手是 iPhone。Apple 开发者创建了 iPhone OS，所有的 iPhone 应用都使用 Objective-C，这是一种构建在旧
    C 语言之上并与之兼容的语言，但包含了面向对象的语言 Smalltalk 的元素。


    Objective-C 和 Java 非常不同，但大多数 Android 或 iPhone 用户并不知道也不在乎。无论他们倾向于哪种品牌，所有的智能手机用户都想要相同的工具和应用——在少数例外之外，他们都能获得这些。Apple
    开发者必须复制 Android 的成就——反之亦然——而第三方开发者则必须用这两种语言构建他们的应用。


    如果你查看几乎任何在 Android 和 Apple 设备上都可用的应用——比如收集趋势新闻故事的 Scanvince，或者使用内置麦克风识别用户附近播放音乐的
    Shazam——用户端的差异是可以忽略不计的。在大多数情况下，两者的效果都一样好。区别在于后端。


    在 2015 年的一项研究中，一家名为 Infinum 的应用开发公司研究了自己的应用，发现为 Android（使用 Java）编写代码需要多出 38% 的代码行，完成所需时间多出
    28%，因此比为 iPhone（使用 Objective-C）编写代码要贵得多。虽然时间和开销是一个缺点，但更长的代码实际上可以带来更好的性能，尽管调试和维护需要更长时间。


    由于 Java 程序在不同平台上行为方式的这些细微差异，Java 开发者发现自己只写了一次程序……然后在不同的平台上调试了多次。这导致了一个对 Java 承诺的幽默调侃：在实践中，许多
    Java 程序员觉得他们必须“一次编写，处处调试”。


    ## Java 语言和 JVM 的其他局限性


    直到最近 2013 年，一位《富布斯》（Forbes）杂志的作家还估计，“几乎每一个想象得到的电子设备都在使用某种程度的 Java 编程。”这是一件好事。庞大的用户群体保持计算机编程语言健康并不断改进。


    ![](img/19410b144b02d2e20b6062d7d1bf5f38_73_0.png)


    Java 在远程计算方面的潜力对于出差业务人士来说是一个福音。然而，也出现过 JVM 安全问题。但也意味着结构性缺陷可能会造成广泛的损害。在同一年，美国国土安全部发现了当时存在的所有
    Java 版本中的一个严重安全漏洞。看起来黑客可能可以通过 Java 应用远程操纵计算机——例如激活笔记本电脑的摄像头。当时控制 Java 的 Oracle
    迅速发布了修复漏洞的更新，但关于该问题的骚动是对任何语言局限性的重要提醒。正如上文所述，尽管 Java 广泛使用并主导了智能手机行业，许多软件领域的顶级参与者（如微软、Apple
    和 Adobe）主要使用 C++ 构建其强大的套件。整个视频游戏行业也依赖 C++，因为它拥有海量库、允许完全控制并直接编译为汇编语言（而 Java 使用
    JVM 作为中间层）。同时，嵌入式系统（机械或电子系统内部的专用计算机系统，如混合动力汽车或交通灯）通常使用 C，因为它的语法优雅使得代码简洁，且不会占用过多内存。


    ## 入门


    在 Pokémon Go 的案例中，数百万玩家和数万数字宝可梦在几个月内为任天堂带来了 10 亿美元。所有的战斗以及大多数玩家使用的手机都运行在 Java
    上。现在你知道它是如何运作的，以及 Java 是如何让这种现象级应用成为可能的。


    在游戏发布的夏天，还发生了一场更大的“战斗”，这与收集类卡通怪兽并没有太大关系。它确实涉及了那个热门游戏，但也（可能）涉及好莱坞电影的动画：Java 让我们通过文本和电子邮件分享伟大的想法。但某些伟大的想法可能用
    Java 本身表达更好。


    ## Java 争端与智能手机大战


    要理解“智能手机大战”以及这些事与一般的计算机编程有什么关系，


    ![](img/19410b144b02d2e20b6062d7d1bf5f38_77_0.png)


    > Oracle 执行官 Larry Ellison 在 2009 年监督了对 Sun Microsystems 以及 Java 权利的收购。


