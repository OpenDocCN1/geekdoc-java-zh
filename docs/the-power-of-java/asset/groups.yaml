    This built on an earlier coding language, Pascal, dating back to the 1970s. Researchers
    at the University of California at San Diego found that they and their students
    needed a common coding language that would work on the different microcomputers
    across campus, so they invented the Pascal language and the P-system on which
    it ran. Though the company IBM supported Pascal, the P-system was expensive and
    reviewers didn’t love the results. However, it was one of the first attempts to
    use a virtual machine. James Gosling worked with Pascal while a graduate student
    at Carnegie Mellon, and this experience influenced the direction he would take
    with Java years later.


    “Write once, run anywhere,” turned out to be a good catchphrase. The Sun marketing
    team soon started using the shorthand WORA. The catch, of course, is that to run
    a Java program, an operating system needs to be equipped with the Java Virtual
    Machine. Java became so popular so quickly, though, that installation of JVM or
    a Java interpreter became an industry standard for most systems.'
