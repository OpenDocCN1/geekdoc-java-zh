  - '[PAGE 9]


    actions are automatic, they''re so much a part of daily life in the twenty-first
    century.


    But none of this would be possible if, decades ago, a few wildly inventive people
    hadn’t dreamed about groundbreaking new ways humans could interact with machines
    and with each other. They dreamed that instead of just using computers to create
    plain old text and pictures that didn’t move, and using the internet to share
    these, people could interact with responsive computers. That could mean something
    as simple as clicking and dragging files across a screen to your desktop’s “recycling
    bin,” or something as complex as running an airplane’s control systems. A computer
    programming language—a language that humans write, and that only machines can
    “speak”—is what makes all this possible. There are hundreds of these languages,
    and all have different strengths and functions. One that powers cable TV, internet
    routers, smartphone apps, and household electronics is called Java. Java has shaped
    the modern world, and whether you realize it or not, you use it every day.


    # Java in Your World:

    Smartphones and Pokémon Go


    The summer of 2016 was hot. According to American climate scientists, 2016 was
    the hottest year recorded on Earth, and July and August were the'
