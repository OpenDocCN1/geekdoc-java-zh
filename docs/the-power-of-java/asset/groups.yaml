    我们必须更仔细地观察甲骨文（Oracle）收购太阳系统公司（Sun Microsystems, Inc.）事件。


    凭借强劲的硬件销售和 Java 的巨大成功，太阳公司越发致力于助力其发展阶段的开源技术原则。1999年，太阳公司购买了与微软 Office 办公件（Word、Excel、PowerPoint
    等）竞争的软件权利，并将其免费发布。不久后互联网泡沫破裂。由于太阳公司是一个主要参与者，泡沫破裂对他们造成了沉重打击，但并未能将其击垮。该公司恢复了健康，但再也无法回到以前的主导地位了；微软、苹果和谷歌成为了新的主要参与者。


    但太阳公司坚持了下来，这在很大程度上归功于 Java 的经久受欢迎以及它在手机技术中日益增长的角色。2005年，太阳公司向公众公开了 1600 多项专利，2006年，该公司将
    Java 开源。这使得 Java 的控制权仍留在太阳公司手中，但任何人都可以查看源代码、使用并对其进行修改。该公司继续享受着强劲的销售和增长。


    随着 2007 年 12 月大衰退的开始，一切都改变了。随着全球经济放缓，股价再次下跌。这一次，泡沫不再局限于科技行业。


    消费者的开支开始减少，许多像太阳公司这样的公司遭受了痛苦。商业杂志和网站上流传着太阳公司合并和收购的传言。随后，2009 年 4 月，另一家名为甲骨文的技术公司介入，以约
    74 亿美元收购了太阳系统公司。


    意所未的是，以创始人兼时任首席执行官拉里·埃森（Larry Ellison）为首的甲骨文高层对经营业务有一些不同的想法。根据詹姆斯·高斯林（James Gosling）的说法，甲骨文高层早期对通过与全球最受欢迎品牌之一的谷歌（Google）的诉讼来获得比购买太阳公司投入更多利润的愿景感到兴奋。


    2008 年 9 月，谷歌发布了 Android，这是一种主要用于智能手机和平板等触摸屏设备的操作系统。由安迪·鲁宾（Andy Rubin）领导的小型开发团队于
    2003 年创立了 Android 公司，谷歌在两年后以 5000 万美元购买了该公司，此时该系统尚未面向公众展示，并将创始人作为员工带走以完成工作。虽然
    Android 的核心是用 C 语言编写的，但其用户界面（用户与系统交互的方式）全部是 Java。这正是导致太阳高层决定让 Java 开源的类型：来自小型初创公司开发者的强大创新。但谷歌并非什么小规模初创公司，它很快就能从很大程度上从太阳公司获取（且未支付费用）的代码中获得巨额利润。


    ## 韩国的 iPhone


    当 Android 在市场上还很新颖时，两家更大的智能手机制造商正准备在全球范围内进行法律斗争。2010 年，韩国公司三星（Samsung）发布了 Galaxy
    S，这款手机看起来和运行起来


    ![](img/19410b144b02d2e20b6062d7d1bf5f38_80_0.png)


    你对智能手机的偏好可能基于手机的外观和响应。无论哪种手机，这些特征都依赖于 Java。


    看起来和运行起来非常像苹果的 iPhone，那是许多用户的首选智能手机。在早期谈判失败后，苹果因版权侵权起诉三星。经过两年的多次诉讼、反诉以及数百万美元的律师费，两个美国陪审团发现三星的高管和开发人员故意偷取了
    iPhone 的技术和设计，并要求三星向苹果支付 4 亿美元赔偿金。其他国家的法院裁定两家公司都违反了对方的专利，而另一些法院则判定双方都没有侵犯任何专利。


    斗争在 2012 年并没有停止。2016 年 12 月，美国最高法院一致推翻了之前的判决（以及 4 亿美元的赔偿金），并将案件发回下级法院进行进一步的法律纠纷。在此期间，智能手机实际上已经接管了全球文化。随着该行业涉及的金额增加，三星与苹果的战斗吸引了几乎每一个其他主要的智能手机制造商和开发者，包括微软、LG、诺基亚和索尼，他们都参与了复杂的专利版权诉讼。根据英国报《卫报》上一位评论员的说法，筹码正在增加，因为拥有智能手机的人太多了。在技术的早期，大多数智能手机销售是给从未拥有过此类设备的人。现在，大多数销售是给已经拥有智能手机的人。这意味着对于任何制造商来说，要增长就必须从竞争对手夺夺客户。与此同时，智能手机技术的进步速度已经放缓。


    ## 一场冷咖啡之约：甲骨文与谷歌争夺 Java


    而且，当然，现在处于智能手机战争中心的公司之一是谷歌。谷歌将（基于 Java 的）Android 操作系统变成了一个成功——也变成了一个目标——部分是因为它是开源的，不像苹果铁密掌控下的
    iPhone 系统，而且制造商（包括三星！）能够比 iPhone 更廉价地生产 Android 手机。


    根据詹姆斯·高斯林的说法，在甲骨文收购之前，太阳高层曾考虑过就谷歌在 Android 系统中使用 Java 代码起诉谷歌。斯科特·麦尼尔利（Scott McNealy）等人认为谷歌违反了专利，但公司高层不想起诉。高斯林说，谷歌对这些行代码的使用对
    Java 用户和程序员社区产生了大多积极的影响。起诉谷歌将花费大量的时间和金钱，而且对 Java 的形象可能不利。在甲骨文接管后，Java 的人气开始下降，甚至跌到了
    C 语言之下，部分是因为新的竞争语言，但也根据 TIOBE 经理保罗·詹森（Paul Jansen）的说法，也是因为甲骨文对待 Java 的方式。该公司似乎把更多时间花在了对谷歌的诉讼上，而不是维护、推广和推动
    Java 语言的发展。Java 的原始开发者（如高斯林）离开了，并开始推广其他语言，而甲骨文的开发者并没有为 Java 做太多事情，正如《连线》杂志的一项分析。


    ## 如今市场上的 Java


    根据二十年来追踪开发者对不同语言兴趣和使用的 TIOBE 指数，高斯林是正确的。自 2001 年以来，Java 一直处于领先地位——遥领先。


    ### TIOBE 社区指数

    来源：tiobe.com


    ![](img/19410b144b02d2e20b6062d7d1bf5f38_84_0.png)


    TIOBE 指数记录了用户对不同语言兴趣随时间的变化。在巅峰时期，Java 占据了所有编程语言的 26% 以上。从那时起开发者发明了许多新语言。现在 Java
    占据所有编程语言的 16.4% 左右；C 语言随之占 7.7%，C++ 为 5.1%。


    你可以使用 Greenfoot 等免费集成开发环境（IDE）来学习使用 Java。


    Java 的下跌是短暂的，C 语言的地位回升也是如此。C 语言并不适合移动 Web 和 App 开发，已经大幅暴跌，而 Java 作为一种适用于这类工作的优秀语言，已经回到了顶峰。Android
    的持续成功、移动 Web 和 App 技术的不断进步（包括《宝可梦》等现象）以及来自庞独立用户社区的广泛支持，都是表明 Java 将存在很长时间的许多指标。


