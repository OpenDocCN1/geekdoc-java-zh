    patrol borders, detect threats, and combat piracy and smuggling. It can even help
    energy companies explore natural resources and reduce risk to human employees.
    The robot can “swim” on its own for a year or more, avoiding obstacles on its
    own using a series of “branching” methods in its Java code. Some Wave Gliders
    have survived hurricanes and shark attacks. Best of all, the Wave Glider requires
    no refueling and no manpower, and it doesn’t pollute the atmosphere in any way.
    It’s so efficient that most of the energy it takes from the sun goes toward its
    powerful computers.


    This technology should have applications beyond Earth, too: if we discover another
    planet covered in liquid, scientists would probably use a version of the Wave
    Glider to explore it.


    According to Gosling, one of Java’s most powerful applications is in **artificial
    intelligence (AI)**. This means any computer that can make some decisions on its
    own and can “teach,” or improve, itself. The Wave Glider is one example. While
