    ## What’s in a Name


    “Oak” wouldn’t work. It was fine to use as a code among Sun developers, but another
    company, Oak Technologies, had trademarked the name, so the Sun employees had
    to come up with something else before they went public with their new ideas.


    Kim Polese, the Oak product manager, gathered the entire team working on the new
    technology into one room, with a whiteboard in the front. It was January of 1995,
    and Sun was almost ready to debut their new technology. It would be a good old-fashioned
    brainstorming session. Polese wanted a name that captured the “essence” of the
    language and platform—


    something “dynamic, revolutionary, lively, fun.” The team members started shouting
    out names, and Polese wrote them on the whiteboard. People in the room that day
    remember a few of the names suggested: Ruby, Silk, Neon, WRL (for WebRunner Language),
    DNA, Lyric, Pepper. Gosling recalls the session as “craziness,” with at least
    a dozen people shouting out words and then arguing over the suggestions. They
    managed to narrow their list down to about a dozen finalists, and sent these to
    their lawyers. The legal team advised that only Java, DNA, and Silk were safe
    choices.


    One programmer, Arthur Van Hoff, credits another colleague, Chris Warth, as the
    one who shouted out “Java” first. Warth doesn’t remember if he offered the name
    “Java” or not, but he does admit to having a cup of Peet’s Java—the coffee of
    choice at Sun in those days—in hand at the meeting.


    Sometimes used as a synonym for coffee, Java is actually the name of one of the
    islands that make up Indonesia. Dutch traders brought the coffee plant, native
    to Ethiopia, from their Indian colonies to Indonesia at the end of the seventeenth
    century. Within a decade, the Dutch East India Company was shipping the first
    “Java beans” for sale in Europe. Today, Indonesia is the fourth largest producer
    of coffee in the world. While beans from other islands are growing in popularity—like
    the Sumatra, Bali, and Sulawesi


    ## James Gosling


    ![](img/19410b144b02d2e20b6062d7d1bf5f38_27_0.png)


    Sporting shoulder-length gray hair, a matching beard, and the same pair of spectacles
    he wore in the 1970s, today James Gosling looks like the Santa Claus of the San
    Francisco Bay Area. Though Gosling prefers graphic T-shirts to red suits and barbecues
    to milk and cookies, like Saint Nick his work is almost mythological, and he’s
    admired and adored all across the computer industry.


    Born in 1955 in Alberta, Canada, Dr. Gosling is a computer scientist best known
    for his work on Java. He earned his BSc at the University of Calgary and earned
    his MS and PhD at Carnegie Mellon University, completing his doctoral dissertation
    in 1983. Within a year, he was employed as a software developer at Sun Microsystems,
    Inc., a young and quickly growing company. Between 1984 and 2010, Gosling worked
    for Sun, where he eventually led the team that created Java. While many researchers
    and programmers were involved in inventing Java, most credit Gosling as the “father”
    of the language and platform. Gosling invented Oak, the language that preceded
    Java, in the early 1990s, and he was a key player who helped shift the attention
    of Sun developers—and the world at large—tow the internet.


    Another technology company, Oracle, bought Sun in 2009, and as usually happens
    with mergers and buyouts, the culture of the company changed. According to Gosling,
    he took a pay cut and a demotion and lost many of the freedoms he had enjoyed
    for twenty-six years at Sun. Within a year, he''d quit the company that he''d
    helped to change the world.


    After taking some time off, Gosling moved to Google, where he was a software engineer.
    Gosling was far from the first Sun employee to move to Google. Many had come before
    him, and Google had used Java to create its popular Android phones, which had
    overtaken the iPhone as the most popular cellular device on the market. However,
    Oracle was convinced that Google had broken the law in using so much Java code.
    As owners, they were determined to take Google to court and win a large settlement.
    Gosling was caught in a difficult position and didn''t speak much about the lawsuit
    during his short time at Google.


    After just six months there, he moved to Liquid Robotics, where he is currently
    Chief Software Architect. Now he makes intelligent robots that collect data from
    the ocean. Some of his recent projects include improving car safety and working
    toward safer self-driving cars. He has been a longtime board member of DIRTT,
    an environmentally conscious interior design and construction company, and he
    has shared his interest in reforming the American health care system using some
    of the principles that helped create Java. He still speaks regularly to audiences
    of Java developers and enthusiasts, and journalists often ask him to speculate
    about future uses for the language.


    ![](img/19410b144b02d2e20b6062d7d1bf5f38_29_0.png)


    beans—Java remains the most widely recognized of any-producing island.


    Facing pressure from the engineers eager to get their work out into the world,
    Kim Polese, in charge of marketing, would have made the final decision, after
    testing the name on friends, colleagues, and family.


    No one can know for if the language and platform now known as "Java" would have
    been so successful under a different name it is clear that the name "Java" didn’t
    hurt.


    The name seems to suggest everything its makers hoped it would: “Java” still sounds
    energetic, hopeful, exotic, swift, jazzy, and hip. Gosling, Warth, and the others
    probably weren’t thinking about the island, about Dutch Southeast Asian colonial
    history, or even about the economics of the global coffee trade, but they unwittingly
    meant their soon-to-breakout, revolutionary brand after another product, the drinkable
    Java, that had changed the world. The name fit. Today, Java remains the most popular
    programming language used, and developers continue to think new uses for it every
    day.


