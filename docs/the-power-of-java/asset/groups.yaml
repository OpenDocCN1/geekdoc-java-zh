- md: '

    # Strengths and Weaknesses


    It''s clear that Java is a pretty powerful tool. You can use it to make websites
    appealing, fun, and interactive. You can use it to design cool video games. And
    because of the compiler and Java Virtual Machine, you can easily port your Java
    program between different devices.


    Remember, though, that Java isn''t the only programming language, and it isn''t
    the “best.” There can''t be a “best” programming language, just like there couldn''t
    be a “best” spoken, human language. Each one is beautiful and fascinating in its
    own way. Each allows for different types of expressions or applications.


    > Opposite: The best way to understand the strengths and weaknesses of a computer
    language is to jump in and start coding.


    ![](img/19410b144b02d2e20b6062d7d1bf5f38_55_0.png)


    The campus of Bell Laboratories, where Dennis Ritchie got his start.


    In fact, computer-programming languages are most like spoken human languages in
    this way. They often accomplish the most when people use different languages together.
    In this chapter, you''ll learn more about how Java compares to other languages:
    what its strengths and weaknesses are, and how you might use it along with other
    languages to do things none could accomplish on their own.


    Recall that James Gosling worked on an earlier version of the Java language, before
    the rest of his team picked a name. He called this language Oak. Even Oak didn’t
    appear out of nowhere, though. It grew from the seed of C.


    Or, rather, it grew from the frustration Gosling and others felt using the much-older
    programming languages C and C++. C had been around since the early 1970s. C++
    appeared in 1983. You might remember that computers “speak” to themselves in machine
    language, the binary code of ones and zeroes. Because it''s not easy to make a
    computer do anything writing in machine language, developers built other languages
    on top and called these assembly languages. Assembly languages were still a little
    clumsy, though, so an engineer named Dennis Ritchie working at Bell Labs (a hundred-year-old
    communications monopoly that became AT&T) designed C as an easier-to-use language
    that bypassed the assembly languages and mapped right onto machine language.


    ![](img/19410b144b02d2e20b6062d7d1bf5f38_56_0.png)


    C was a great leap forward, and it remains one of the most popular languages developers
    use today. But it has many downsides, and this frustrated the developers pushing
    at the frontiers of what computers could do. C''s shortcomings included the following:


    - * Function Orientation: Instead of working around objects that a developer could
    isolate and produce easily from the “blueprint” of a class, C was built around
    functions, or individual commands that lack blueprints and are harder to work
    on in isolation.

    - * Poor Portability: Though Ritchie designed C to work across different platforms,
    this was more imagined than done. A skilled programmer would have to take on the
    time-consuming job of recompiling (and sometimes rewriting) code for each new
    platform.

    - * Inefficient Use of Memory: C had no built-in way of making a program automatically
    manage memory. This meant complicated programs could slow down.


    In short, then, C was an advancement, but as programmers found they had more complicated
    projects and bigger dreams, C seemed too slow, too inefficient, too time-consuming
    to write, and not adaptive enough. This doesn’t mean that C is useless—engineers
    still prefer C for embedded systems, computers inside things like stop lights
    and thermostats—but new uses for computers called for new languages.


    Bjarne Stroustrup, an engineer, fixed the “object” problem in 1983 by introducing
    C++. This offered a sleeker, more efficient, and easier-to-use version of C, by
    making the language object-oriented.


    # The Object-Oriented Approach


    As you’ve already learned, object-oriented programming began as a way to tackle
    more complex projects more easily. It does this in two ways. First, it “packages”
    data and the operations on data (things that a program “does” to data) into objects.
    It then arranges these objects into classes based on what’s in them and what they
    do. Finally, it hides most of these details from public users.


    Imagine that you’re building a house. You have the plot of land picked and the
    four corners marked with stakes. But all the stuff that you’ll need to build the
    house—bricks, boards, nails, shingles, pipes, wires, cement blocks, and window
    panes—is just sitting in a pile next to your building site. And mixed in with
    these basics, you also have rolls of wallpaper, bits of wood and stuffing for
    furniture, kitchen appliances, clothes, picture frames, lightbulbs, cookie jars,
    and paintings.


    If you tried to dive right in and start building the house, you''d be frustrated
    pretty quickly. This is how computer programmers were feeling. Earlier programmers
    had been doing simpler things—the way building a chair is simpler than building
    a house. If you''re just building a chair, you can look at your pile of materials,
    ignore the cookie jar and everything else you don''t need and build the chair
    without too much work. But if you''re building a house, you might have the bright
    idea to organize your materials first. You could place all your bricks in one
    pile and all your shingles in another. This is the same impulse that led to object-oriented
    programming organization.


    # C++ and Java: an Object-Oriented Comparison


    The first object-oriented language was Simula, released in 1967. Stroustrup used
    the object-oriented approach to improve C with C++ in 1983, but even C++ had its
    shortcomings. Linus Torvalds, the developer of the Linux system, calls C++ a “horrible”
    language (maybe unfairly). Today, while C++ may be easy to learn, its complexity
    makes it difficult to master. It’s a “wordy,” or dense language. Code in C++ tends
    to be longer than comparable code in Java, and even the error messages can be
    long and confusing. It also compiles slowly, and doesn''t use memory efficiently.


    James Gosling and his team designed Java to fix a lot of these problems. Java
    code is shorter and sleeker; it compiles quickly; and it introduced something
    called garbage collection, a memory-management tool that reclaims memory from
    objects that the program isn’t using anymore. It’s hard to deny that Java is the
    most widely used and one of the most successful object-oriented languages.


    # Language Barriers and Interoperability


    Imagine that you, an English speaker, were to meet someone who spoke only Russian.
    Even though English and Russian share some basic structures, you probably wouldn''t
    get far with one speaking in English and the other responding in Russian. Programming
    languages work the same way. Java, C++, Python, and other languages can’t “speak”
    directly to each other. At least, they can’t speak to each other without some
    kind of bridge. However, the demands of computing today mean languages have to
    work together all the time. This is called interoperability: the ability of programming
    languages to interact and operate on the same data.


    Some languages, like Groovy, Clojure, and Scala, were built to run on the Java
    Virtual Machine and can interact with anything in a Java library (a collection
    of objects or other data structures). Whole new languages sometimes result from
    attempts to map existing languages onto each other—as is the case with Jython,
    an attempt to port the language Python for the Java Virtual Machine. Any web page
    you visit will involve even more languages: HTML (the first language Tim Berners-Lee
    created to write web pages) and JavaScript (a language for making web pages interactive,
    not possible with HTML alone). More complicated web pages might use plug-ins,
    or applets that make sites do more “stuff.” Pop-up advertisements, embedded videos,
    comment boxes, and search functions are all plug-ins. Plug-ins allow


    ![](img/19410b144b02d2e20b6062d7d1bf5f38_61_0.png)


    > Tim Berners-Lee invented the internet so that average citizens could share information
    and ideas.

