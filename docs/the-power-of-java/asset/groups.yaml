    HTML 编写的网页。然而，用户对于只使用 HTML 编写的网页无法进行太多的交互。


    ## “网络就是计算机”


    绿队（Green Team）在更名为 FirstPerson 后，恢复了工作，将重心从电视转向互联网。到 1993 年，一种名为 Mosaic 的网络浏览器的开始带来越来越多的普通用户进入互联网。“Mosaic”这个名字源于一种艺术形式，即使用许多微小的玻璃、大理石或其他彩色材料拼成一幅更大的画作。这捕捉了早期互联网的精神，也是其中的挑战之一。在机器之间共享信息和指令是困难的，因为机器本身是不同的：每种类型的机器都“说”着自己的语言，当时还没有一种语言能让不同类型的机器或操作系统进行方便、高效的通信。任何能够将所有不同机器（以及用户）聚集在一起的东西——无论是网络浏览器还是编程语言——将像马赛克一样，利用成千上万最终是数十亿个个体组成一个巨大的、色彩斑纷的整体：一个网络。


    太阳科技公司（Sun Microsystems）的开发者开始以一种全新的方式思考互联网。他们意识到互联网正变得像他们希望电缆公司做的那样，一个交互式多媒体网络。太阳公司的创始人、主席兼首席执行官
    Scott McNealy 为公司想了一个新口号：“网络就是计算机。”这听起来有点像谜语，但如果你仔细考虑，它非常有道理。人们倾向于将第一代个人电脑（或 PC）视为省力设备，就像你考虑烤面包机、搅拌机或割草机一样。但“连接”世界上所有的烤面包箱并不会让它们更强大。也许你可以安排百万台烤面包箱同时烤面包。那会很酷，但并不实用。McNealy
    等人开始意识到，计算机是不同的。


    一台 PC 是强大的，但一个由数百万此后数十亿台 PC 组成的网络将具有字面的无限潜力。太阳科技公司没有将 PC 放在计算世界的核心，而是鼓励其员工和客户首先考虑网络。真正的力量不在个人电脑，而在于数十亿台
    PC 可以连接在一起这一事实。


    ## 太阳科技公司（Sun Microsystems, Inc.）


    20 世纪 70 年代末和 80 年代初，围绕计算机技术进步的讨论声越来越多，联邦政府对计算研究的支持处于高点。这可能是因为美国当时正在与苏联进行军备和技术竞赛——并且处于领先地位。军事应用驱动了当时计算机的许多进步，但一个专门的计算机爱好者群体——包括主要大学的研究人员以及车库级爱好者，如苹果公司的史夫·沃兹尼克和史夫·乔布斯——开始想象计算机硬件和软件在商业行业和个人用途中更广阔的市场。其中几个远见发明者和投资者在
    1982 年聚集在一起，成立了太阳科技公司，它迅速崛起成为世界最大的计算机公司之一。


    出生于德国的 Andy Bechtolsheim 是斯坦福大学的一名研究生，当时正在为斯坦福大学网络（SUN）开发一台计算机“工作站”。他结了更早毕业的斯坦福商学院毕业生
    Scott McNeally 和 Vinod Khosla，两人分别在 Daisy Systems 和 Onyx Systems 工作；这两家公司都在推动微芯片技术的进步。这三人很快成立了一家计算机硬件和软件制造公司，并以他们母校斯坦福大学网络（SUN）的缩字母命名。毕业于伯克利的
    Bill Joy 当时在贝尔实验室（后来的 AT&T）开发一种名为 Unix 的操作系统，AT&T 是北美一个多世纪以来领先的电信公司，他很快加入了他们。这四个人获得了投资者的资金，并没有浪费时间去颠覆和重塑计算世界。


    在第一个十年里，太阳公司通过销售使用 Unix 操作系统的廉价工作站（满足科学和技术需求的计算机）变现了 Joy 开发 Unix 的经验。后来，他们扩展到了服务器（存储数据的硬件）。然而，太阳公司最持久的成就可能是发明了编程语言和开发平台
    Java，这让太阳公司进入了智能手机和其他消费电子产品的新市场，而且 Java 的知名度比太阳公司本身还要高。


    Java 延续至今，但太阳公司的成功无法长久。对太阳公司的早期投资是基于公司的质量和价格合理的产品，以及基于其开发者卓越的创新的记录。然而，这种增长很大程度上受到了“互联网泡沫”的推动。在股票市场中，当人们开始以远超真实价值的价格范围交易股票或商品时，就会出现“泡沫”。“泡沫”不会逐渐缩小或恢复稳定状态；它们在投资者兴趣突然下降时破裂，建立在通胀交易价格上的公司会随之崩溃。


    互联网泡沫发生在 1995 年到 2001 年之间。人们对蓬勃发展的互联网兴趣如此浓、如此不合理，以至于公司只需在名字前面加上“e”或在结尾加上“com”，就能增加其股票的价值。泡沫在
    2000 年 1 月破裂。公司合并或宣布破产并消失；互联网公司和技术制造商损失了超过 5 万亿美元的市场价值，而 2001 年 9 月 11 日的恐怖袭击进一步加速了这种自由落体。生存的一些公司，如
    Amazon、Google 和 eBay，被留下来统治了突然没有了竞争的领域。


    太阳公司确实恢复了，但并不完全。20 世纪 90 年末，太阳公司的口号是“我们是互联网中的点”，这并非全是虚言：成功的公司确实使用太阳的产品进行计算。泡沫破裂的冲击打击了太阳公司，使其失去了顶尖地位。在
    2007 年到 2009 年的大经济衰退中，它遭受了另一个打击。不久出现了 IBM 收购太阳的传闻，尽管这项交易从未实现。在计算机行业顶端屹立 27 年后，太阳股东以
    56 亿美元将公司卖给了甲骨。甲骨文开始了大规模裁员，高级工程师相继辞职，创始人 Bechtolsheim、McNealy、Khosla 和 Joy 随后作为投资人、发明者和初创公司经理取得了成功的职业生涯。他们现在仍然活跃在计算机行业。


    对太阳公司的业务模式产生了巨大影响。公司开始更多关注互连这一最终目标。秉着“网络就是计算机”的格言，由 Gosling 领导的 FirstPerson 研究人员开始开发一个类似于
    Mosaic 的浏览器


