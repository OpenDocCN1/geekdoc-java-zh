    # 优势与缺点


    显而周知，Java 是一个非常强大的工具。你可以用它来制作吸引人、有趣且具有交互性的网站。你可以用它来设计酷炫的视频游戏。由于编译器和 Java 虚拟机（JVM），你可以轻松地在不同设备之间迁移你的
    Java 程序。


    但请记住，Java 并不是唯一的编程语言，它也不是“最好的”。不存在所谓的“最好”的编程语言，就像不存在“最好”的人类口语一样。每种语言都有其独特的美感和迷人之处。每种语言都允许不同类型的表达或应用。


    > 反之：理解计算机语言优缺点的最好方法就是投入并开始编码。


    ![](img/19410b144b02d2e20b6062d7d1bf5f38_55_0.png)


    贝尔实验室校区，丹尼斯·里奇（Dennis Ritchie）在这里起步。


    事实上，计算机编程语言在这方面非常像人类口语。当人们共同使用不同的语言时，往往能取得最大的效果。在本章中，你将学习更多关于 Java 与其他语言的对比：它的优势和缺点是什么，以及你可能如何与其他语言结合使用，完成任何单一语言都无法实现的任务。


    回想詹姆斯·戈斯林（James Gosling）在团队成员决定名称之前，曾开发过 Java 语言的早期版本。他将这种语言命名为 Oak。不过，Oak 也并非凭空出现，它是从
    C 语言的种子中生长出来的。


    或者说，它源于戈斯林等人在使用老老的编程语言 C 和 C++ 时感受到的挫败感。C 语言自 20 世纪 70 年代初一直存在。C++ 出于 1983 年。你可能记得计算机使用机器语言与自己“对话”，即
    0 和 1 组成的二进制代码。由于编写机器语言来让计算机执行任何事情并不容易，开发者们在其之上构建了其他语言，并称之为汇编语言。然而，汇编语言仍然有些笨拙，一位在贝尔实验室（一家百年历史的通信垄断企业，后变为
    AT&T）工作的工程师丹尼斯·里奇设计了 C，作为一种更易用的语言，它跳过了汇编语言，直接映射到机器语言。


    ![](img/19410b144b02d2e20b6062d7d1bf5f38_56_0.png)


    C 语言是一个巨大的飞跃，它仍然是今天开发者使用的最流行的语言之一。但它也有许多缺点，这让在计算机能力边界探索的开发者们感到沮丧。C语言的缺点包括：


    - * 函数导向：C 并不是围绕开发者可以从类“蓝图”中孤立并轻松生成的对象来构建的，而是围绕函数（即缺乏蓝图且难以进行独立处理的单个命令）构建的。

    - * 可移植性差：尽管 Ritchie 设计 C 是为了跨不同平台运行，但这更多是设想而非现实。熟练的程序员必须承担耗费时间的工作，为每个新平台重新编译（有时甚至重写）代码。

    - * 内存使用效率低：C 没有内置的方法让程序自动管理内存。这意味着复杂的程序可能会变慢。


    简而言之，C 是一项进步，但随着程序员们发现他们有更复杂的项目和更大的梦想，C 显得编写太慢、效率太低、太耗时，且适应性不够。这并不意味着 C 是没用的——工程师们仍然偏式嵌入式系统（红绿灯和恒温器内部的计算机），但计算机的新用途需要新的语言。


    工程师比雅恩·斯特斯特斯特普（Bjarne Stroustrup）在 1983 年通过引入 C++ 解决了“对象”问题。通过使语言面向对象，这提供了一个更简洁、更高效且更易用的
    C 版本。


    # 面向对象的方法


    正如你已经学到的，面向对象的编程始于一种更轻松处理复杂项目的方法。它通过两种方式实现这一点：首先，它将数据和对数据的操作（程序对数据“执行”的操作）“封装”到对象中。然后根据对象内部的内容和功能将这些对象排列成类。最后，它向公共用户隐藏了大部分这些细节。


    想象你正在盖一栋房子。你已经选好了地皮，并在四个角插了桩子。但盖房子所需的所有材料——砖块、木板、钉子、瓦片、水管、电线、水泥块和窗玻璃——只是堆在建筑工地旁边。在这些基础物品中，还混合着卷壁纸、家具木料和填充物、厨房电器、衣服、画框、灯泡、饼干罐和画作。


    如果你尝试直接跳上手开始盖房子，你很快就会感到沮丧。这就是计算机程序员们当时的感受。早期的程序员做的是更简单的事情——就像造一把椅子比盖房子简单得多。如果你只是在造椅子，你可以看着你的材料堆，忽略饼干罐和其他所有不需要的东西，而不费太大精力就能造好椅子。但如果你在盖房子，你可能会产生先整理材料的妙主意。你可以把所有的砖块放在一堆，把所有的瓦片放在另一堆。这就是导致面向对象编程组织的同一冲动。


    # C++ 和 Java：面向对象的比较


    第一个面向对象的语言是 Simula，于 1967 年发布。Stroustrup 在 1983 年使用面向对象的方法通过 C++ 改进了 C，但即使是 C++
    也有缺点。Linux 系统的开发者林斯·托瓦兹（Linus Torvalds）称 C++ 为一种“糟糕”的语言（可能并不公平）。今天，虽然 C++ 可能容易学习，但它的复杂性使其难以掌握。它是一门“啰嗦”或密集的语言。C++
    的代码往往比相应的 Java 代码长，甚至错误信息也冗长且令人困惑。它编译速度缓慢，而且内存效率不高。


    戈斯林和他的团队设计 Java 是为了解决很多这些问题。Java 代码更短、更简洁；编译速度快；并且引入了被称为“垃圾回收”的机制，这种工具可以回收程序不再使用的对象的内存。很难否认
    Java 是使用最广泛且最成功的面向对象语言之一。


    # 语言障碍与互操作性


    想象你，一个英语使用者，遇到了一个只说俄语的人。尽管英语和俄语共享一些基本结构，但如果你说英语而对方回俄语，可能进展不了多久。编程语言也是如此。Java、C++、Python
    和其他语言无法直接相互“对话”。至少，它们在没有某种桥梁的情况下无法交流。然而，当今计算的需求意味着语言必须一直工作。这被称为互操作性：编程语言相互交互并操作相同数据的能力。


    某些语言，如 Groovy、Clojure 和 Scala是为了在 Java 虚拟机上运行而构建的，可以与 Java 类（对象或其他数据结构的集合）中的任何内容交互。全新的语言有时源于将现有语言映射到彼此的尝试——就像
    Jython 这样，它是将 Python 语言移植到 Java 虚拟机的尝试。你访问的任何网页都会涉及更多语言：HTML（蒂姆·伯纳斯李为了编写网页创建的第一种语言）和
