    Swift may be difficult to learn after learning Java, though, because Java, it
    represents a paradigm shift. This shift is away from object-oriented programming
    entirely; Swift replaces this with “protocol-oriented programming.” Protocols
    already exist in object-oriented programming: they state how unrelated objects
    will communicate. Instead of putting reproducible objects and their classes at
    the center of the programming paradigm, protocol-oriented programming puts protocols—what’s
    “done”—at the center. Without getting too far from our subject in this book (Java,
    remember?) it seems that Swift could change the programming world in the coming
    years. It’s safe to say, though, that protocol-oriented programming won’t replace
    object-oriented programming entirely. What we have in Swift is a new kind of thinking
    that meets new needs, but that doesn’t mean it meets “old” needs better than older
    languages. Market studies show that ancient C is the most commonly mentioned'
