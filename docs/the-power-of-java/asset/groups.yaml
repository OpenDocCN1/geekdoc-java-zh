    # About the Author


    Aidan M. Ryan is a writer, publisher, and educator based in Buffalo, New York.
    His features, reviews, interviews, and essays have appeared in the White Review,
    Traffic East, Buffalo News, The Skinny, and on CNN. He works in marketing and
    is also an adjunct professor of English at Canisius College and a Teaching Artist
    at the Just Buffalo Writing Center. Aidan is managing editor of the poetry magazine
    Foundlings and is the author of Organizing Isolation: Half-Lives of Love at Long
    Distance, a collection of visual poetry published by Linoleum Press in April 2017.


