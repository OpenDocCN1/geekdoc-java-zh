    TV, browse the **internet**, use apps on a smartphone, and connect to Wi-Fi through
    a router—and most of these things you''ll do multiple times in a day. In the same
    day, you might swipe a credit card, use a Kindle or other e-reader, take cash
    out of an ATM, pay for parking at an electronic meter, print something, and set
    or disarm a home security system. You don''t usually spend much time thinking
    about all these things. Some of the


