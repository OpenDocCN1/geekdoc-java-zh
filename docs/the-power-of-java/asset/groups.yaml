    ## Write Once, Run Anywhere


    In chapter 2 you learned more about the Java compiler and the promise of portability.
    Java developers were supposed to be able to write programs once, on one platform,
    and run them anywhere. A developer could write a source code for a program, then
    compile it into Java bytecode. Any operating system equipped with the Java Virtual
    Machine could then open and run that file in a language that the platform (whether
    a Windows or an Apple computer, an iPad, or a Google Pixel smartphone) could “understand.”


    This built on an earlier coding language, Pascal, dating back to the 1970s. Researchers
    at the University of California at San Diego found that they and their students
    needed a common coding language that would work on the different microcomputers
    across campus, so they invented the Pascal language and the P-system on which
    it ran. Though the company IBM supported Pascal, the P-system was expensive and
    reviewers didn’t love the results. However, it was one of the first attempts to
    use a virtual machine. James Gosling worked with Pascal while a graduate student
    at Carnegie Mellon, and this experience influenced the direction he would take
    with Java years later.


    “Write once, run anywhere,” turned out to be a good catchphrase. The Sun marketing
    team soon started using the shorthand WORA. The catch, of course, is that to run
    a Java program, an operating system needs to be equipped with the Java Virtual
    Machine. Java became so popular so quickly, though, that installation of JVM or
    a Java interpreter became an industry standard for most systems.


    ## Grace Under Pressure: Scaling with Java


    Java can run anything from programmable toasters to supercomputers to “smartcards”
    (like contactless credit and debit cards). Especially since the rise of smartphones,
    developers have used Java to create apps that become overnight sensations. No
    matter the language a developer used to write them, useful or innovative apps
    are often overwhelmed with downloads and usage, revealing bugs, and slowing performance.
    That leaves a poor impression on users who might be on the fence about downloading
    the app or switching to a competitor. Though performance depends on the programmer’s
    skill, Java is a particularly useful language for designing apps and software
    to scale, or “grow,” gracefully.


    **Scalability** is one way of measuring the performance of a computer, server,
    or software program under intense pressure from many users trying to perform many
    tasks at the same time—so scalability doesn’t matter much for programmable toaster,
    but it’s very important for apps and video games. As far as Java is concerned,
    a program is highly scalable if it can continue to perform quickly and without
    crashing as usage continues to increase. The higher the threshold—the point at
    which a program has too many users and starts to slow down, freeze, or crash—the
    greater scalability.


    There are two ways to scale. A program can scale up, by easily adding more memory
    to a single computer, or a program can scale out, by easily connecting with other
    computers and networks. Because of Java''s built-in garbage collection, it can
    manage memory effectively. That means that Java programs can scale up significantly
    without having to add more memory, where a program in a less-efficient language
    might require more memory, and sooner. At the same time, branching methods allow
    programs to access more memory as needed. And because of its portability, Java
    can cross platforms, scaling out easily, too. Because of Java''s superior scalability,
    Twitter developers have steadily been shifting their code from the language Ruby
    to Java.


    ## NASA’s World Wind: an Interoperability Study


    NASA''s World Wind is a virtual globe, sort of like Google Earth, but customizable,
