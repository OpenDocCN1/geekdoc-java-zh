    ## Lights, Camera, Magic


    The visual effects and computer graphics company Industrial Light & Magic has
    been a pioneer in Hollywood special effects for more than forty years. Their story
    started long ago, and depending on whom you ask, either in the Van Nuys neighborhood
    of Los Angeles, California, or in a galaxy far, far away ...


    George Lucas''s Star Wars came out in 1977, cashing in on the American space obsession
    that had started May 25, 1961, when President John F. Kennedy announced that the
    nation would beat the Soviets in the race to put a human on the moon. Stanley
    Kubrick''s 2001: A Space Odyssey became the definitive space film when Kubrick
    released in 1968, just one year before Kennedy''s promise came true. Lucas may
    not have surpassed Kubrick''s artistic achievement with 2001, but Star Wars did
    achieve something else that Kubrick''s film couldn''t: it launched the great tragedies
    and romances of ancient Greek and Roman and medieval culture into space and has
    inspired each successive generation, becoming a triple trilogy and one of the
    world''s most well-recognized franchises and most-beloved stories.


    Lucas''s ambitions were set high from the beginning. Inspired by Kubrick''s visually
    stunning work, Lucas wanted to make a film that looked like nothing anyone had
    seen before—on a screen or off. The first Star Wars film (later titled Star Wars
    Episode IV: A New Hope) didn''t use much that we could call computer-generated
    imagery (CGI). Back then, “special effects” concerned mostly models, projection,
    cutting or overlaying the physical film, and work with filters and other methods
    of distorting camera lenses. (The few computer-


    ![](img/19410b144b02d2e20b6062d7d1bf5f38_96_0.png)


    generated visuals that did go into the first film were the work of programmers
    outside IL&M.) However, IL&M teamed up with a new group of hires (called the Computer
    Division of Lucasfilm, Lucas''s production company) on the sequel, Episode V:
    The Empire Strikes Back. After this film and a few other contemporaries, the inevitable
    coming together of Hollywood and the computer industry was clear. The Computer
    Division broke off to become Pixar, creating the first fully CGI film, Toy Story,
    in 1995. IL&M also shifted to embrace CGI and quickly became the world''s leader
    in that field.


    Jurassic Park, Indiana Jones, E.T.: The Extra Terrestrial, and Pirates of the
    Caribbean are just a few of more than three hundred films that have relied on
    IL&M for special effects, earning the company seventeen Oscar wins and twenty-three
    nominations. While the IL&M programmers use many languages and tools, Java was
    an important part of their successes. Today, many of the entry-level jobs they
    advertise state knowledge of Java or another major language (like C or C++) as
    a requirement.


    Looking ahead to the next forty years of innovation, IL&M has also set up a lab
    for immersive and interactive entertainment experiences. If you want to become
    a part of the Hollywood CGI or next-generation entertainment industries, you''ll
    have to pick up skills well beyond writing good code—but Java might be the smart
    place to start.


    Hollywood animators need to know multiple programming languages.


    One of the most common spots for Java programmers is actually outside the computer
    industry, so-called big business. Today, the vast majority of Fortune 500 companies—the
    biggest companies in America, and some of the world—use Java for their internal
    needs. The role of the Java developer here is in creating enterprise applications.
    These are software tools unlike those you find in mobile apps or installed on
    your computer. Enterprise applications are massive, complicated systems critical
    to the functioning of large companies. These could handle billing and payroll,
    security, content management, secure communication within the corporation, human
    resources, data storage and access, and the automation of everything from manufacturing
    to customer service. Java is ideal for this kind of lifting, because it comes
    with deep, rich libraries that contain solutions for most of these standard needs.
    Fortune 500 corporations, unlike startups, are also generally slow to change their
    structural models, so they won''t be switching over to Swift anytime soon; these
    Java jobs will be around for a long time.


