    ## 写一次，处运行


    在第 2 章中，你学习了更多关于 Java 编译器和可移植性承诺。Java 开发者本应该能够在在一个平台上编写一次程序，并在任何地方运行。开发者可以为程序编写源代码，然后将其编译成
    Java 字节码。任何配备了 Java 虚拟机（JVM）的操作系统都可以打开并运行该文件，使用该平台（无论是 Windows 还是 Apple 电脑、iPad
    还是 Google Pixel 手机）能够“理解”的语言。


    这是建立在更早的编程语言 Pascal 之上的，可以追溯到 20 世纪 70 年。加州圣地戈分校的研究人员发现，他们和学生需要一种通编程语言，可以在校园内不同的微型计算机上运行，因此他们发明了
    Pascal 语言以及运行在其上的 P-system。尽管 IBM 公司支持 Pascal，但 P-system 价格昂贵，评审人员对结果也并不满意。然而，它是使用虚拟机的早期尝试之一。詹姆斯·高斯林（James
    Gosling）在卡内基梅隆大学攻读研究生期间接触过 Pascal，这段经历影响了他多年后开发 Java 的方向。


    “写一次，处运行”被证明是一个很好的口号。太阳神谷公司的营销团队很快开始使用缩写 WORA。当然，问题在于，为了运行 Java 程序，操作系统需要配备 Java
    虚拟机。然而，Java 普及得如此迅速，以至于安装 JVM 或 Java 解释器已成为大多数系统的行业标准。


    ## 压力下的优雅：使用 Java 进行扩展


    Java 可以运行从可编程吐司器到超级计算机，再到“智能卡”（如非接触式信用卡和借记卡）。特别是自从智能手机兴以来，开发者一直使用 Java 创建一夜走红的
    App。无论开发者使用什么语言编写它们，实用或创新的 App 往往因为下载量和使用量的激增而崩溃，暴露出 Bug 并减慢性能。这给可能犹豫是否下载该 App
    或切换到竞争对手的用户留下了糟糕的印象。尽管性能取决于程序员的水平，但 Java 是一种用于设计能够优雅扩展或“增长”的应用程序和软件的特别有用的语言。


    **可扩展性**（Scalability）是衡量计算机、服务器或软件程序在许多用户同时执行许多任务的巨大压力下性能的一种方式——因此，扩展性对于可编程吐司器来说并不重要，但对于
    App 和视频游戏非常重要。对于 Java 而言，如果一个程序在使用量不断增加的情况下继续快速运行且不崩溃，它就具有高度的可扩展性。阈值越高——即程序用户过多并开始变慢、冻结或崩溃的点——可扩展性就越大。


    扩展有两种方式。程序可以“向上扩展”（scale up），通过轻松地向单台计算机添加更多内存；程序也可以“向外扩展”（scale out），通过轻松与其他计算机和网络连接。由于
    Java 内置的垃圾回收机制，它可以有效地管理内存。这意味着 Java 程序可以在不需要添加更多内存的情况下显著向上扩展，而使用效率较低语言的程序可能需要更多内存，而且得得早。同时，分支方法允许程序根据需要访问更多内存。由于其可移植性，Java
    也可以跨平台轻松地向外扩展。由于 Java 优越的可扩展性，Twitter 的开发者一直在将他们的代码从 Ruby 语言转向到 Java。


    ## NASA 的 World Wind：一项互操作性研究


    NASA 的 World Wind 是一个虚拟地球，类似于谷歌地球，但它是自定义的，并且加载了大量来自 NASA 卫星以及地球和太空其他设备的异常数据。


    通过 World Wind，用户可以实时探索地球——甚至是火星、金星和几颗卫星，看着阳光退去，城市在夜晚变亮。山和其他地形特征以 3D 形式显示，通过插件，你甚至可以叠加链接到维基百科文章的定位针，指向像长城或马里亚纳海沟这样的事物。


    这些插件调用多种编程语言，如 C#、J# 和 VB。起初，World Wind 仅适用于微软操作系统，但 NASA 科学家们希望通过网络将其带给每一个人，这意味着它必须通过浏览器的
    HTML 运行并在任何操作系统上工作。


    将这样一个强大的程序带给绝对任何用户——甚至是智能手机和平板电脑用户——对于互操作性来说将是一个巨大的挑战，因此 NASA 程序员使用 Java 实现了这一目标。


    2017 年发布的 World Java 让整个 World Wind 程序变成了一个 Java 应用程序，它能够（通过 HTML）在任何操作系统的网页上运行，包括其他语言编写的所有插件，并且仍然调用从使用无数编程语言构建的软件收集的数百个
    NASA 项目中的数据。


    ## 跨平台范式的可能性


    Java 的成功很大程度上不仅是因为技术特征，而是因为维持这些特征的心态。你可能称这种为范式（Paradigm）：范式是一种观察世界的方式。它包含了对人类行为的基本假设。存在引导群体行为的个人范式。范式也包含具体的事物，如重力和预期。有时，一项新技术或世界事件如此重大，以至于改变了态度。我们称之为范式转移（paradigm
    shift）。


    历史学家对于范式转移是响应单一事件发生的，还是这些事件只是更广泛、更丰富的织锦的一部分存在分歧，在这种织锦中，个人的选择没有引导这些选择的文化和经济力量重要。例如，你可以说互联网导致了范式转移：它改变了人类相互互动的方式。你也可以对智能手机说。或者，你可以说这两者都是更长期、渐进的范式转移中的发展，描述了人类生活与机器的融合。


    Java 的发明也导致了范式转移——不仅在计算机程序员的世界，而且对所有人都是如此。Java 文化有它自己的范式。可以说，它是建立在高斯林观察世界的方式之上的。或者，如果你更倾向于观察历史趋势，你可以说在创建
    Java 之前，互联网的可能性就已经塑造了高斯林的个人范式。无论如何，从很小开始，高斯林就关注跨越互联网障碍的翻译和通信。即使作为 20 世纪 60 年代和
    70 年代的青少年，他也工作过试图弥合平台、系统和语言之间差距的计算机项目。他在这一领域最大的成就就是发明了 Java，它将那种范式——跨越人类和机器巨大鸿沟的信念——带给了更大的受众：首先是数百名开发者，然后是数千、数百万，最后是到数十亿在毫无察觉的情况下使用
    Java 的人。这种“跨平台范式”实际应用的一个例子是虚拟网络计算（VNC）的发明。在 20 世纪 80 年代后期，大多数计算是在桌面完成的。然而，计算的可能性（特别是图形化的可能性）创造了科学家和商人在不同地点使用计算机进行视觉演示的需求。今天我们有
    OneDrive、Dropbox 和 Google Drive 等云存储服务，但在那时，计算机用户受限得多，数据共享并不快速或容易。演示者携带计算机文件旅行时的选择有限。他们可以将文件传输到软磁盘上并希望它在另一台计算机上运行，但如果他们需要在旅行期间继续进行某个项目，他们无法存储整个计算环境（你在……上找到的所有内容）'
