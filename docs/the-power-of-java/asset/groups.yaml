    # What Is Language?


    You can''t use Java to ask questions—but you can use it to command. You can''t
    use Java to write poems—but it powers parts of websites like YouTube and SoundCloud,
    where creative people share their art. Even though it doesn''t look like the English
    you''re reading right now, Java is a language.


    Your first language was something you learned without realizing it. It was part
    of your environment. You probably can''t remember learning your first language,
    because it happens so early. Most of us become fluent in our first language without
    really trying and only later learn the rules. Your parents made noises at you,
    and your incredibly powerful baby-brain first memorized a few and commanded your
    little lungs, throat, tongue, and lips to move and make those noises. At the same
    time, you started noticing patterns. You didn''t know what a “name” was, what
    it meant to name something or to have a name, but you noticed that people always
    made the same noise when they looked at you. This was your first step to understanding
    who and what you are.


    If you learn a new language, whether in school or after moving to a new community,
    the process might be difficult and take a long time, but you''re still learning
    a set of rules that evolved over thousands of years. In spoken languages like
    English and Afrikaans, new words pop up seemingly out of nowhere each year, people
    regularly break the rules of grammar, and people speaking the same language but
    in different places on Earth will refer to the same thing with different words.
    British and American people both speak English, but the British call the back
    of a car the “boot,” while Americans call it the “trunk.” The British wear trainers,
    Canadians wear runners, and Americans wear sneakers: three words that all might
    be used to refer to the exact same pair of Nikes.


    Spoken languages are constantly changing, because real, living people control
    them by a sort of messy majority rule. That means any user has the potential to
    change the language. This happens all the time in English. Someone alive today
    was the first to say “Google” (as a verb), “selfie,” “bling,” “bromance,” “hater,”
    “LOL,” and “noob.” Today, if you use these words, most English speakers will know
    what you mean—but when we break too many rules or make up too many words, the
    results can be funny, or they can cause communication to come to a grinding halt.


    So-called dead languages, like Latin or Pictish or Ubykh, do not work this way.
    Because ordinary people (not academics) do not speak these languages, their vocabularies
    never grow and their grammatical rules will stay the same, as long as anyone remembers
    them.


