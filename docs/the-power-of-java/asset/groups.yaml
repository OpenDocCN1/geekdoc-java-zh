    Java 是制作像《俄罗斯方块》这类游戏的极佳工具。事实上，已经有很多人使用 Java 制作了《俄罗斯方块》的模仿品。只要稍微努力，你也可以。你可以从创建一个名为“blocks”的类开始。记住，类（class）就像是创建不同对象的蓝图。从你的类，你可以创建玩游戏所需的所有对象：正方形块、直线块、T
    形块、L 形块、加号块和折线块。像 Java 中所有的对象一样，每个对象都有自己的状态和行为。状态可以是它们的大小和颜色；行为可以是它们掉落的不同速度，以及玩家在“空中”旋转它们的方式。你还需要编写一个方法（一种特定行为），关于碎片如何相互作用。在这种情况下，你会编写一个方法，每当玩家在屏幕底部创建一条不连续的水平直线时，碎片就会消失。Java
    的工作原理是通过创建易于复制的对象，这使其非常适合像《俄罗斯方块》这样的游戏。这个程序会比你为这本书打印新标题页的程序要长得多。然而，用 Java 编写它比用其他语言要容易得多，尤其是对于那些不是面向对象的语言。


    你的《俄罗斯方块》程序展示了你对 Java 对象唯一需要了解（目前而言！）的最后一件事。你的程序实际上使用了 Java 中可能的所有全部三种类型的方法：


    -   语句（Statements）：你的程序会执行某些操作。语句只发生一次，并且自动发生。例如，语句可以执行非常简单的操作，如玩家打开程序时启动游戏。如果你想弄得更复杂一点，可以添加一个语句来显示标题界面。这段代码看起来和你的“TitlePagePrinterApp”代码非常相似。


    - 循环（Loops）：循环是不断重复自身的方法……一遍又一遍一遍，直到程序停止运行。在你的《俄罗斯方块》游戏中，你会为掉落的块使用一个“循环”方法。你希望这些块不断掉落，以挑战玩家。


    - 分支（Branching）：这种方法是被“触发”的。它发生在：如果发生了其他事情，或者在满足某组特定条件下。这就是你将用来让碎片消失的方法类型。它不会自动发生，也不会无停止地循环。碎片只有在特定条件下才会消失：如果玩家对齐了一行正方形。你还可以写一个分支方法来让一个巨大的“你输了”标志弹出来，由碎片到达屏幕顶部时触发。


    # 语言之外：编译器、平台与机器


    记住，Java 除了“面向对象”的方法的方法之外，另一个伟大的承诺是可移植性（portability）。这意味着你可以在任何平台上编写它，并且它可以在任何其他平台上运行。想象一下如果一种口语也是这样运作的。想象你站在联合国全体面前发表演讲。你用英语写了演讲稿，但一旦话离开你的嘴唇，成百上千其他人就能用他们自己的语言——西班牙语、印地语、阿拉伯语、阿非利卡语、普通话等——听懂你的演讲，而无需实时翻译员的帮助。想象用英语说话，而完全不用担心世界上其他的人是否能理解你，无论他们选择哪种语言。这将是一种惊人的力量（而且很多翻译员需要寻找新工作了）。


    Java 之所以这样工作是因为一种被称为编译器（compiler）的东西。Java 编译器是一个获取 Java 源代码并转换为另一种编程语言的程序。在这种情况下，我们说的是汇编语言，它是特定于不同机器的。因此，Windows
    电脑、Apple 电脑、Linux 电脑和 Android 手机将各自拥有自己的汇编语言；数字手表、收音机闹钟和电视也是如此。![](img/19410b144b02d2e20b6062d7d1bf5f38_50_0.png)


    Java 虚拟机（JVM）是 Java “编写一次，随处运行”承诺背后的技术。这个 JVM 使用 Java 应用程序编程接口（**API**）在*任何*平台或机器上运行。因为
    API 是一组允许平台运行程序的指令集，在 Java API 的帮助下，JVM 可以在任何平台上运行你的代码。你可以想象的，这种“可移植”语言的可能性是无限的。


    # 波浪滑者（Wave Glider）


    Liquid Robotics 公司由波音公司（其以飞机闻名）拥有，该公司制造并销售名为“波浪滑者”的东西，这是一种从海洋收集数据的机器人。在没有飞行员的情况下，波浪滑者可以在水面上漂浮并运行一年多，依靠太阳、波浪以及你猜对了——Java
    的能量。


    “Java 之父”詹姆斯·戈斯林（James Gosling）于 2011 年加入 Liquid Robotics 担任首席工程师。他们的波浪滑者软件使用
    Java 语言。戈斯林来到这里并不意外：他一直对“酷玩具”感兴趣。在 20 世纪 90 年代和 21 世纪初，戈斯林因对机器人和其他设备的演示而闻名。这是他在
    Sun 工作的一部分。Java 编译器可以获取你的程序的纯文本（如我们之前制作的“TitlePagePrinterApp”）并将其“编译”成写入**字节码**（bytecode）的
    .class 文件。你对字节码真正需要知道的就是你无法“读取”它，而且它不是任何机器或平台的原生代码。


    相反，这些字节码进入 **Java 虚拟机 (JVM)**，它像是一台虚拟计算机。这个 JVM 可以在*任何*平台或机器上工作，使用 Java 应用程序接口
    (**API**)。因为 API 是一组允许平台运行程序的指令集，在 Java API 的帮助下，JVM 可以在任何平台上运行你的代码。正如你可以想象的，这种“可移植”语言的可能性是无限的。


    波浪滑者有两个部分。有一个漂浮在水面的平台，通过太阳能电池板收集能量。悬挂在下面的“潜水艇”利用活动机翼利用波浪的能量向前推进。


    从海洋收集数据一直是困难的。那里有如此的数据——如此巨大。研究一直是昂贵且充满危险的。然而，波浪滑者可以收集信息并立即上传到云存储中，因此研究人员无需亲自检查机器人即可获取数据。它可以帮助环保人士收集天气和波浪模式，甚至是动物迁徙的音频信息。军队和其他政府行动可以使用它巡逻边境、检测威胁并打击海盗和走私。它可以帮助能源公司勘探自然资源并减少员工的风险。该机器人可以自主“游泳”一年多，利用其
    Java 代码中的一系列“分支”方法避开障碍物。一些波浪滑者曾经受飓风和鲨鱼袭击。最棒的是，波浪滑者不需要燃料和人力，而且不会以任何方式污染大气。它是如此高效，以至于它从太阳获取的大部分能量都用于其强大的计算机。这种技术也应该适用于地球之外：如果我们发现另一个被液体覆盖的行星，科学家可能会使用波浪滑者的版本对其进行探索。


    根据戈斯林的说法，Java 最强大的应用之一是**人工智能（AI）**。这意味着任何可以自己做出某些决定并能够“学习”或改进自身的计算机。波浪滑者就是其中一个例子。在编写软件时，戈斯林为滑者加入了一条指令：基本上是“不要害怕船只”。现在船长们担心撞上波浪滑者，直到他们看到这些“智能”机器人改变航向自主避免碰撞。戈斯林说，这在
    Java 中非常容易做到，而在其他语言中要困难得多。此外，滑者还基于绿带团队的一个核心信念和目标：它可以在任何平台上通信它所收集的信息。

    '
