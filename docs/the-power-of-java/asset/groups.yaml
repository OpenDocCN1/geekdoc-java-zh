    # Ada Lovelace: the Poet-Programmer


    Born in 1815 and raised by her mother, an English aristocrat named Annabella Milbanke,
    Ada Byron, the Countess of Lovelace, would live only thirty-six years and die
    alone a painful battle with cancer. In her short life, however she struggled past
    the limited educational opportunities then available to women, earned the love
    and respect of friends and admirers across the world, and eventually became known
    as “the first computer programmer.”


    ![](img/19410b144b02d2e20b6062d7d1bf5f38_37_0.png)


    Ada was the daughter of Lord Byron, one of the most famous of all British poets.
    Byron left Annabella just two months after Ada was born, to pursue adventures
    in the Greek War of Independence against the Ottoman Empire.


    Ada Lovelace helped spread the earliest computer research.


    He died in 1824, when Ada was still a child. Byron was a great traveler and a
    man of odd habits. Some people found him romantic and inspiring, and others found
    him scandalous and offensive. Upset with Byron, Annabella tried to influence her
    daughter Ada away from his poetry—and what she thought was his “madness”—and encouraged
    the young girl to study math and science instead. Though Ada never knew her father,
    she developed a lifelong interest in her work. The result of this divided education
    was an unusual (and powerful) intelligence: Ada’s mind was equally suited to mathematical
    as well as artistic thought.'
  - '[PAGE 38]


    When Ada was a teenager, she met Charles Babbage, an inventor and mathematician.
    As the Industrial Revolution picked up steam in the early 1800s, scientists and
    businesspeople needed workers to produce (and copy) lots of complicated calculations
    without any errors. Babbage imagined a machine that could do these calculations
    automatically. He called this the “Difference Engine.”


    Theory raced ahead of technology. Babbage had imagined a machine with parts too
    difficult for metalworkers to make at a reasonable cost. Still, conversations
    with the intelligent and curious Ada spurred him on to further theories and inventions.
    Babbage was so inspired by Ada’s mind that he called her “the Enchantress of Numbers.”
    For her part, Ada was a key figure in popularizing and refining these developments
    in mathematics and the field that would eventually become computer programming.
    She translated work by foreign mathematicians into English, and she published
    extensive and beautifully written notes on the latest thinking in mathematics.
    Building off Babbage’s work, she described how the computer might be automated
    to do certain complex calculations—really programs, like what we can do today
    with Java and other languages. In these notes and other writings, her mathematical
    and poetic powers came together. She described complex math and computing in vivid
    terms anyone could understand. Perhaps because her approach to the field was,
    as she called it, “poetic science,” she was able to imagine the potential for
    the computer beyond what anyone else at the time could see.'
