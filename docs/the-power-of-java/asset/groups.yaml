    # 雅达·洛芙莱斯：诗人程序员


    雅达出生于1815年，由她的母亲英国贵族安娜贝拉·米尔班克（Annabella Milbanke）抚养长大，雅达·拜伦（洛芙莱斯伯爵夫人Ada Byron）仅活了三十六年，在与癌症的痛苦斗争中孤独去世。然而，在她短暂的生命中，她克服了女性面临的有限机会，赢得了全世界朋友的爱和尊重，最终被称为“第一位计算机程序员”。


    ![](img/19410b144b02d2e20b6062d7d1bf5f38_37_0.png)


    雅达是拜伦勋（Lord Byron）的女儿，他是最著名的诗人之一。拜伦在雅达出生两个月后就离开了安娜贝拉，去追求反对奥斯曼帝国的希腊战争冒险。他在1824年去世，当时雅达还是个孩子。拜伦是一个伟大的旅行者，习惯古怪的人。有些人认为他浪漫且富有鼓舞，另一些人则认为他丑闻且冒犯。安娜贝拉对他感到愤怒，试图女儿远离诗歌——以及她认为的“疯狂”——转而鼓励这个女孩学习数学和科学。尽管雅达从未见过她的父亲，但她对工作产生了终身兴趣。这种分裂教育的结果产生了一种非凡（且强大）的智慧：雅达的心脑既适合数学思考，也适合艺术思考。


    当雅达还是青少年时，她遇到了查尔斯·巴贝奇（Charles Babbage），一位发明家和数学家。随着工业革命在19世纪初兴起，科学家和商人需要工人产生（并复制）大量的复杂计算而不产生任何错误。巴贝奇设想了一种可以自动进行这些计算的机器。他称之为“差分机”。


    理论领先于技术。巴贝奇设想的机器零件金属工人无法以合理的成本制造。尽管如此，与聪明且充满好奇心的雅达的对话促使他进一步发展理论和发明。巴贝奇被雅达的心智深深鼓舞，他称她为“数字女魔术士”（the
    Enchantress of Numbers）。对于雅达来说，她是推广和完善这些数学发展的关键人物。她将外国数学家的著作翻译成英语，并对数学领域的的最新思考发表了详尽且文字优美的笔记。基于巴贝奇的工作，她描述了如何使计算机自动执行某些复杂的计算——真正的程序，就像我们今天使用
    Java 和其他语言所做的那样。在这些笔记和其他著作中，她的数学与诗意力量结合在了一起。也许是因为她对待该领域的方法正如她所说的是“诗意科学”，她能够想象出当时任何其他人无法预见的计算机潜力。


