    over Pokémon Go—the billion dollars, hundreds of millions of downloads, and hundreds
    of thousands of accidents—was the result of an effort to bring together many different
    technologies across many different computer platforms.


    To do this, the designers of the game took old technologies and used them in new
    ways. One important tool was GPS. GPS, or “Global Positioning System,” uses satellites
    to track the movement of devices on Earth. It wasn’t a new technology—most phones
    were already made to be tracked this way. The game also depended on a phone’s
    built-in camera. This was old, too: manufacturers introduced cameras to flip phones
    more than ten years before people started using things like Snapchat and Instagram.
    (Fun fact: the word “selfie” was first used in 2002 in an Australian online forum,
    but it took a full decade to become popular everywhere. Oxford English Dictionaries
    named “selfie” their word of the year in 2013, and Merriam-Webster added the word
    to its dictionary the following year.) But the makers of Pokémon Go brought these
    older technologies—GPS and built-in cameras, as well as others—together. Because
    of this, they were able to place the collectible characters from their Pokémon
    franchise into the “real world.” To bring all these systems together, the developers
    had to create a “language” that could speak with all those other technologies:
    the GPS, the camera, the touch screen, the phone’s operating system, and the game’s
