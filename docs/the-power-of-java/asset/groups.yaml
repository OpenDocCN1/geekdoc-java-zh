    of mentality, that sustain them. You might call this paradigm—A paradigm is a
    way of looking at the world. It includes basic assumptions about the way people
    behave. There are personal paradigms that direct the behavior of groups. A paradigm
    also contains concrete things, like gravity and expectations. Sometimes, a new
