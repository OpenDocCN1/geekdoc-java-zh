    events, or if those events are part of broader and richer tapestry, in which individual’s
    choices are less important than cultural and economic forces that direct those
    choices. For example, you could say that the internet caused a paradigm shift:
    it changed the way humans interact with each other. You could say the same about
    smartphones. Or, you could say that both are developments in a longer and gradual
    paradigm shift, describing the merging of human life and machines.


