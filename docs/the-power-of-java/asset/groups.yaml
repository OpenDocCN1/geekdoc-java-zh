    # Understanding Java Syntax


    At the most basic level, all languages work the same way. Every language has “packets”
    of information. For most languages, we call the smallest packets “letters” and
    bigger packets “words.” For example, the letter “D” contains information: if you
    know the letter, you know what it’s supposed to sound like when it’s spoken as
    a part of a word. You probably list a hundred words right now that begin with
    the letter “D.” When you put these packets together, they can mean something more
    than just a sound. For example, if you put the letters D-O-G together, you’ve
    made the word dog, and that packet carries a lot of information. Just seeing the
    word dog in print probably puts an image in your mind. You might think of dachshunds,
    retrievers, bulldogs, or poodles. You feel love or affection thinking of your
    own pet or a friend or neighbor’s pet. You might remember fear,'
  - '[PAGE 40]


    thinking of the time you saw an angry dog, or you might feel sadness, thinking
    of a dog that died. All this—all these feelings and images—are only possible because
    you know what the shapes D, O, and G mean when they''re placed together.


    All languages also have a syntax, or a set of rules about how these packets of
    information can be put together, and how their arrangement can carry much more
    meaning than any of the packets could their own. You can say the word “dog” to
    another English speaker and trust that he or she understands what you mean. But
    if you want to say something about a dog, you need more words, and that could
    quickly get confusing if you didn''t share a set of rules about how to use those
    words. Grammar lets us express our deepest feelings, give more complicated instructions,
    and turn our dreams of how the world might be into reality by sharing those dreams
    with other people.


    Math is a language, too. It has packets of information—numbers, as well as symbols
    like plus and minus signs, decimals, and parentheses—and the syntax of math is
    the set of rules that allows us to interpret these signs, or packets of information,
    when they''re arranged in complex patterns.


    Like any other language—like English, German, or mathematics—Java also has packets
    of information and a syntax allowing us to arrange and interpret'
