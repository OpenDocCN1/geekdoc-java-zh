    bald cypress like some sort of feathered ornament grabs me by the heart in a way
    others don''t. There are no known recordings of the bird''s voice and only a few
    black-and-white photographs of birds kept as pets. Ghosted from existence, it
    sits now only in memory and museum trays.


    Sometimes I seek the validation of what was in natural history museums. Behind
    what''s stuffed and posed for the public façade of museum displays and dioramas,
    there are the museums'' back rooms and basement catacombs where rows and stacks
    of dead things lie side by side. Here, the empty-eyed souls of creatures killed
    and collected for science are kept cool and clean to reduce the chances for decay
    or insect infestation, and are essential tools for the scientist and for conservation.


