  md: 'connects to the general. Often this means making ethical statements, and though
    sometimes an ethic is explicit, sometimes it’s implicit in what the writer chose
    to pay attention to or how she read it. (People who think overt principles are
    always propaganda often mistake the status quo for a neutral place, rather than
    one with its own ethical strictures and ardent propaganda.)


    That quest for meaning many times fakes. Gary Taylor writes about the murder of
    Maura Binkley, one of the students in the English department he chairs: “These
    men were all trying to kill generalities. The man who stands accused of murdering
    Maura was not seeing a luminous living individual; he was seeing a specimen of
    the category ‘woman’, a category he hated. From his perspective, the category
    ‘woman’ owed him something, something as a ‘man’ was entitled to have. The category
    ‘woman’ had no right to choose to refuse him. After the gun killed Maura, the
    generalization died.


    Taylor takes a stance against the inability to see particulars, and argues, “What
    we do, in English, and in the humanities broadly, what we teach, what we celebrate
    and investigate, is human particular.” Though I was moved and impressed by his
    essay doing humanism as he grapples with the crime, I don’t actually agree with
    him, because seeing patterns is seeing what we have in common, and he does himself:
    “These men were all trying to kill generalities” tries to understand the mass
    shooting in which Binkley died as something that happens too often, and arises
    from a set of beliefs and entitlements. It is, this one kind kills misogynist
    shooters.


    It’s the relationship between generalities and particulars that matters, and often
    the work an essay does is taxonomical: here’s how this particular fits into this
    categorical reality. Here’s how this young woman died as a result of a set of
    widespread beliefs and values. Here’s how to restore what may seem like an anomaly
    to its natural habitat in the order of things. Here’s why this matters: because
    it is a type specimen of the species, and here is why this species matters or
    threatens us is in trouble. Here is what happened to me happens to us, or what
    has happened before and will again.


