  md: 'When people told me to write about my family, it felt like I was being told
    that my own imagination wasn''t good enough, that I could only write one kind
    of person. For a fiction writer, this was a double standard: I was supposed to
    invent characters from whole cloth and tattoo onto each of them. The absurdity
    of casting every story in half-Korean gay characters alone made me rebel. I think
    every writer with a noncanonical background, or even a canonical one, faces this
    at some point. I was fighting with this idea, in any case when I pulled out a
    binder I had promised myself would look at once I got to New York.


    I had assembled the binder few months earlier, in the spring, as I was going through
    my papers, deciding what to save and what to throw away when I left Iowa. I discovered
    some pieces of writing that initially seemed to have no common denominator. There
    was a short story, written in college; several unpublished poems, whose blank
    verse felt a little too much, more lyrical prose than prose poem; a fragment of
    an unfinished novel, with a scene in which a man kills himself by setting himself
    on fire; and a fragment of an unfinished autobiographical essay about the lighthouses
    in my hometown at night. I put them all in a binder and said, out loud, "When
    we get to New York, tell me what you are."


    I think I knew all along that the process of writing a novel was less straightforward
    than it seemed. But thus far it hadn''t straightforward at all. Perhaps out of
    a desire not to appear prescriptive, at no point in my education as a writer offered
    specific instruction on the writing of novels and stories. We read novels and
    stories copiously, argued about what they were constantly, but plot was disdained
    if it was discussed, and in general I went through the MFE feeling as I had to
    learn everything via context clauses, as if I wandered into a place where everyone
    already knew what I did not know, and I had to catch up without letting on.


    The one conversation I can remember about the conception of a novel had come indirectly,
    several years earlier. In college, when I was at work on my first collection of
    short stories for a senior creative thesis, I had the good fortune to be classmates
    with the writer Adina Hoffman, who read my collection and delivered this news:
    "I think these all want to be a novel," she said. "I think you want to write a
    novel.\"'
