    As a result, most good writers who have something they passionately want to know
    how to go about publishing a pamphlet and so they leave the genre to either lunatics
    or political hard-liners. Orwell then shows his hand: “The normal way of publishing
    a pamphlet is through a political party, and the party will see to it that any
    ‘deviation’—and hence any literary value—is kept out.” For Orwell, literary value
    apparently depends on some deviation from party lines.


    As we know from such popular books as Nineteen Eighty-Four, Animal Farm, and Homage
    to Catalonia, Orwell staunchly opposes totalitarianism and fascism. Other books
    like Down and Out in London and Paris and The Road to Wigan show his passionate
    identification with working-class values and culture. Essays like “The Hanging”
    and “Shooting an Elephant” disclose his fierce hatred of imperialism. Orwell was
    in no way politically neutral. After his military experiences in the Spanish Civil
    War—where he had been shot through the neck—he declares he is a socialist; he
    writes in 1937, “I have seen wonderful things and at all really believe in Socialism,
    which I never did before.” Prior to his experiences with the Spanish revolutionary
    forces, he thought socialism was a “theory confined entirely to the middle class.”
    He was embarrassed once writing Wigan Pier to be called “comrade.”


    Orwell was one of those individuals who pushes harder against his own beliefs
    than the ones he ostensibly opposes. Like John Stuart Mill, he found it intellectually
    necessary to continually interrogate his cherished opinions so that they didn’t
    become automatic, stale, and orthodox. This tendency—as well as his distrust of
    abstractions, general discomfort with labels and relentless self-criticism—makes
    Orwell hard to pin down ideologically. In Homage, he is amused by all the political
    distinctions and rival groups within the revolutionary parties but also dismayed
    by how all the doctrinal differences can distract a justified movement from its
    primary goals. Early on in Spain he felt most attracted to the anarchists. His
    antifascism, however, was unwavering, and he thought that fascism could never
    be defeated by bourgeois democracy, because that would be a “fight against one
    form of capitalism on behalf of a second.” Orwell seems an we can find many ways
    to interpret the various inconsistencies of Orwell’s politics as they altered
    over time, but I think in the main we can say that he had two'
