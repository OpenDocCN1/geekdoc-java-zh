  md: '# Foreword


    It is not possible to extricate yourself from the questions in which your age
    is involved.

    —Ralph Waldo Emerson, “The Fortune of the Republic” (1878)


    What I have wanted to do throughout the past ten years is to make political writing

    to an art.

    —George Orwell, “Why I Write” (1946)


    FOR MANY YEARS George Orwell avidly collected political pamphlets. After his untimely
    death at age forty-six in 1950, his collection of some 2,700 pamphlets from across
    the entire political spectrum (dating roughly from World War I through World II)
    found its way to the British Library, where it has since supplied a wealth of
    information to scholars and historians of those turbulent times. In “Pamphlet
    Literature,” a brief essay contributed to the New Statesman in 1943, Orwell describes
    a representative sample of his collection, identifying nine trends of the pamphering
    “revival” had been following since 1935; he labels these Anti-left and Crypto-fascist,
    Conservative, Social Democrat, Communist, Trotskyist and Anarchist, Non-party
    radical, Religio-patriotic, and Lunatic. He also refers to a ninth category, Pacifist—but
    claims he has no samples of this trend to comment on. He says amongst these headings
    could be roughly reduced to two main schools, Party Line and Astrology.


    Orwell wrote that despite its title, mainly to complain about the decidedly “unliterary”
    nature of political pamphlets. They were not merely disappointing to a novelist
    and essayist whose goal was “to make political writing into an art,” but Orwell
    thought they were undeniably “rubbish”: “There is totalitarian rubbish and paranoid
    rubbish, but in each case it is rubbish.” He considered this especially disappointing
    because of the times. The pamphlets, he said, “ought to be the literary form of
    an age like ours own.”—When political passions run high, channels of free expression
    are dwindling, and organized lying exists on a scale never before known.” He blamed
    the publishing and literary worlds for not making the public more aware of the
    necessity of'
