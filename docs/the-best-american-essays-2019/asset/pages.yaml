    John Audubon captured the essential character of Conuropsis carolinensis, painting
    them gleefully entangled in a thicket of cocklebur. In one of his most popular
    works, the birds seem with consuming but acutely aware, too, of the world around
    them. They’re engaged with their food, engaged with one another, engaged with
    almost two hundred years beyond the painting. Facing the portrait, you count a
    flock of seven. A female on the far left raises a foot. Maybe Audubon meant to
    show the bird in midscrat or stretching to reach for the next cocklebur. Since
