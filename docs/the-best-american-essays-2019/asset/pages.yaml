    That afternoon, I tried to understand if I had made a choice about what to write.
    But instead it seemed to me that if anyone had made a choice, it was the novel,
    choosing me like I was a door and walking through me out into the world.


    I began in the summer of 1994. I had just finished my MFA and moved into an apartment
    with my younger brother and sister off Columbus Avenue, on the Upper West Side
    of Manhattan. My brother was starting his first job in finance, at a stockbroker.
    My sister was beginning her studies at Columbia University. I used to joke that
    we were a little like the Glass family from Salinger’s novels and stories, except
    our mother was in Maine, alone with her own troubles. But the truth was more complicated,
    and more melodramatic, than the world of a Salinger novel. My mother had been
    betrayed by a business partner, who doctored their partnership agreements indemnifying
    her for debts, vanished. After she refused to declare bankruptcy, she sold our
    family home. She mostly hidden her problems until they could no longer be hidden,
    and to this day I think three siblings moved in New York at the same time we were
    forced out of our house because it was the single self-protective gesture we could
    make that was entirely under our own control.


    The means by which I had made my way in the world prior to that summer were coming
    to an end. Grad school was over, as was my accompanying stipend. The inheritance
    left to me after my father’s death, meant to provide for my education, was likewise
    almost spent—the move back to New York would exhaust it of the postgraduate programs
    I had applied for. The despair I felt as each possible future I had dreamed of
    dropped away with another rejection was the surface of me; underneath that, on
    the inside, I could sense my family fracturing. Myself also.


    I kept seeing reports that summer of other writers, some of them friends of mine,
    selling their novels, some of them unfinished, for what seemed outlandish sums
    of money. I thought it was my turn when a friend from college who worked in the
    fiction department at The New Yorker asked me for stories, and I sent her part
    of my then novel in progress, which was about AIDS activists in the late 1980s
    in New York and San Francisco.'
