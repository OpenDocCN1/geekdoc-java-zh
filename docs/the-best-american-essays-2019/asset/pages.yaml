    from beyond the frozen frame of an existence that was already waning in Audubon’s
    time. To me, it has always seemed an invitation to come closer—one knowing being
    to another.


    While America was burgeoning at its seams when Carolina parakeets flew about in
    abundance, was a nation wildly rough around the edges. What remained in the hinterlands
    is what eco-restorationists sometimes refer to as baseline—a reference condition
