    Dayna Torortici’s splendid essay, “In the Maze,” reminded me that F. Scott Fitzgerald
    also understood the affliction of double consciousness. He famously wrote in 1936
    “the test of a first-rate intelligence is the ability to hold two opposed ideas
    in the mind at the same time, and still retain the ability to function.” First-rate
    writers now, in many ways, face a similar test: Can they hold opinions and at
    the same time question very opinions? Can they maintain certain beliefs while
    trying others? In short, can they be at the same time politically committed and
    open-minded? But I can’t assess this current literary situation any better than
    does Rabih Alameddine in this collection’s opening essay. An essay that does something
    Orwell (rightly or wrongly) thought should do: essay.


    The Best American Essays features a selection of the year’s outstanding essays,
    essays of literary achievement that show an awareness of craft and forcefulness
    of thought. Hundreds of essays are gathered annually from a wide assortment of
    national and regional publications. These essays are then screened, and approximately
    one hundred are turned over to a distinguished guest editor, who may add a few
    personal discoveries and makes the final selections. The list of notable essays
    appearing in the back of the book is drawn from a final comprehensive list that
    includes not all of the essays submitted to the guest editor but also many that
    were not submitted.


    To qualify for the volume, the essay must be a work of respectable literary quality,
    intended as a fully developed, independent essay (not excerpt) on a subject of
    general interest (not specialized scholarship), originally written in English
    (or translated by the author) for publication in an American periodical during
    the calendar year. Note that abridments and excerpts taken from longer works and
    published in magazines do not qualify for the series, but if considered significant
    they will appear in the Notable list in the back of the volume. Today’s essay
    is a highly flexible and shifting form, however, so these criteria are not carved
    in stone.


