  md: 'The truth is: sometimes I am afraid of what I write. You should be a little
    afraid of the story you are telling, too. And if you''re not afraid that someone
    won''t like it, you''re still telling the truth.


    Think of all the emotional labor that requires: planning each of your actions
    and weighing them against the emotional consequences they might have on every
    person, and bending yourself in anticipation of what others might feel—always
    scaling back your desires and rejecting your own needs. It requires a constant
    negotiation of what you can say and do in the world, constantly diminishing yourself
    because the effect it might have on other people—which you cannot actually control
    or predict.


    Think for a moment how much time you have spent in your life replaying conversations
    where you said the wrong thing, or how you were maybe too curt with that person
    in the checkout line, or too forward with that dude you met on Tinder; maybe you
    speak too much in meetings or make your views too known. How much time you have
    wasted fretting about other people like you. Just a quick calculation: How much
    of your life, do you think, spent this way? An hour? A whole day? A week? Maybe
    entire years? What masterpieces could you have made now if you''d directed your
    energy toward writing a bad motherfucker instead?


    There will always be some people who won''t like what you have to say. I recently
