  md: '# The Autobiography of My Novel


    FROM The Sewanee Review


    THE QUESTION CAME amid some more ordinary ones: How long did the book take to
    write, and did you do any research? Seven years, and yes. And then: Were you a
    victim of sexual abuse yourself?

    Why didn''t you just write about your experience? the reader asked me. Why isn''t
    it a memoir?

    I looked at him and felt confused for a moment. I didn''t understand the question
    immediately. The questioner sounded annoyed, as if I were deliberately hiding
    something from him. As if he had ordered steak and gotten salmon. Had I chosen?
    I felt the presence of conflicting, confusing truths. I was talking with a book
    club in downtown Manhattan, on Wall Street, a paper cup of coffee on the table
    in front of me. All of us were seated around a conference table, blinking under
    a fluorescent light that felt, along the skin and eyes, both thin and heavy at
    once. This question.

    The questioner was an otherwise nice man, a few years older than me, I guessed.
    He would have been in high school when it all happened to me, and I wouldn''t
    have told him about it then. That I could even speak to him about it now was not
    lost on me.

    The things I saw in my life, the things I learned, didn''t fit back into the boxes
    of my life, I said. My experiences, if described, wouldn''t portray the vision
    they gave me.

    I saw the room''s other occupants take this in.'
