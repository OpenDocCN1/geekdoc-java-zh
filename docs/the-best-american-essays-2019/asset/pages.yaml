  md: 'turn in the highway, near Mendon, Missouri, which my father had warned me about,
    and I stayed alert the whole drive waiting for it to come up on us.


    In the parking lot at Swan Lake, thin sheets of ice had been shattered and ground
    down into muddy ruts by cars and trucks belonging to other hunters. Inside the
    hunter check-in, it was bright and almost warm, bare lightbulbs hanging from the
    pitched wooden ceiling, a furnace burning at either end, and men of all ages in
    their rubber boots and camouflage gear. They spoke to one another in the low tones
    of the early morning; occasionally someone would laugh. My father and I did not
    talk to anyone. I remember his gentleness when me in that place—so longed for
    and so strange all at once.


    At six the service window at the far end of the building opened, and an officer
    started assigning blinds. He had a hand-cranked bingo game, out of which rolled
    balls corresponding to the numbered blinds situated around the edge of the weir.
    Behind him was a poster that tracked the daily totals of each blind over the course
    of the season. We drew A-4, which according to the poster was pretty good.


    It was hard to find, though, and the sun was coming up by the time we parked and
    dragged the decoys across the stalk-stubuffed field, setting up what we imagined
    to be a pattern that would appeal to passing goose—it was important that they
    faced into the wind, I remember my father saying. Before we heard the roll of
    distant gunfire.


    The “goose pit” was a plank-lined rectangular hole, maybe a little more than four
    feet deep, with a wooden bench long enough to sit across. Most of the time in
    it was spent trying to keep quiet and still, whispering when there were geese
    nearby, and eating year-old chocolate bars and Vienna sausages. The pit had a
    low roof and a hinged gate that partially hid the entrance, making it possible
    to peek out without being visible. When geese flew into range, you threw open
    the gate, stood, and took aim.


    I killed my first goose that day. Or at least that is what we said, and I have
    said ever since. Know I popped up and shot at a goose, and my father did, too,
    at the same time, and we agreed that the one that fell was the one I had aiming
    at. After my father had shot one, too, we carried our dead goose, swinging by
    their long necks, back to the car and drove to check out in the same building
    where we had been that morning, so that our totals could be posted on the board:
    2/2.'
