  md: '# Guns in the Family


    FROM The Boston Review


    IT IS IMPOSSIBLE for me to remember my father without thinking about guns. My
    first was a child-sized Winchester 20-gauge shotgun. It was a hand-me-down from
    a kid across the street. I think I paid twenty-five dollars for it, saved from
    my allowance and advanced to me by my father for doing yard work. I was eight.
    That summer, after I bought it, I remember getting my dad to go to the basement
    with me after dinner to “practice.” He would open up the gun cabinet and we would
    get out my shotgun. My dad would coach me into a stance. I would cock the hammer
    and pull the trigger. My dad would jam the barrel back into my shoulder so I could
    prepare for the recoil—“the kick”—when I fired ammunition. I worried a lot about
    the hunt: would I be up to it?

    i went hunting for the first time that fall, for geese. My hometown was near the
    Mississippi Flyway, the massive bird migration route that follows the track of
    the Mississippi River. Every fall hundreds of thousands of Canada geese made their
    way southward, arrayed in instinctual V formations. We woke up in the morning,
    and my mother made us a full breakfast—bacon, eggs, coffee for my father—before
    we drove to Swan Lake, the wildlife refuge in northern Missouri. Reservations
    to hunt at Swan Lake were lottered at the beginning of the season. If you were
    fortunate enough to get one, you were assigned a date and told to be there that
    morning before six.

    I remember that long drive in the early hours of the morning, before the rest
    of the world was awake. The warmth of the heater in the car, the homey familiarity
    of AM radio, the lonely glow of the lights on overnight outside the farmhouses
    across the fields from the road. There was one sharp'
