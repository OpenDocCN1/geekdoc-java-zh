    KAI MINOSH PYLE is a Michif and Sault Ste. Marie Nashabe writer and Indigenous-language
    advocate. Their work has been published in PRISM International, Nat. Brut, Transgender
    Studies Quarterly, and Red Rising Magazine. Currently they are a PhD student in
    American studies at the University of Minnesota, Twin Cities.


    GARY TAYLOR is the general editor of The New Oxford Shakespeare: Complete Works
    and Thomas Middleton’s Collected Works. He has written for the Washington Post
    and the Guardian, and has re-created Shakespeare’s partially lost play The History
    of Cardenio (based on Don Quixote).


    JIA TOLENTINO is a staff writer at The New Yorker and the author of the essay
    collection Trick Mirror. She formerly worked as the deputy editor at Zebebel and
    contributing editor at the Hairpin. She received her MFA in fiction from the University
    of Michigan and lives in Brooklyn, New York.


    DAYNA TORTORCI has served as coeditor in chief of n+1 with Nikil Saval since 2014.
    Her writing has appeared in the Atlantic, the Guardian, Harper’s Magazine, n+1,
    the New York Times Book Review, the Village Voice, and elsewhere. She has edited
    three small books with n+1, most recently No Regrets. She lives in Brooklyn, New
    York.'
