  md: 'Even still, as I sat in my office, surrounded by facsimiles and replicas of
    the Gone Birds, the parakeet left me longing for something I can''t quite explain.
    I wanted, in my own way, to see the bird live again, to feel its animated, flying,
    screeching, and squawking for myself. There’s a bit of a god complex in most ecologists.
    Most of us are just watchers and data miners; we’re all wannabe creators.


    And so I created my own parakeet, tacked and fastened together with wood glue
    and wanting. I worked for weeks researching the bird, trying to get a handle on
    the sense of it, its emergent being. After days of measuring, cutting, discarding,
    remeasuring, and recutting, I spent more days fitting and refitting the pieces
    as if I could bring Conuropsis carolinensis back again quickly through the past.
    I narrowed them and posed them downward.—not fast enough to carry the bird quickly.
    How to pose the tail in profile? I first splayed it out, but then I wanted it
    straight as an arrow, so there’d be no delays in its travel. The bird’s face needed
    to be parrot-esque accurate, parrot precise. I scroll-cut an eternal scream in
    the hawk-hooked beak, could almost hear a muffled squawk. I layered on thin coats
    of painted plumage, then wiped them away to add another. Finally, after a fortnight
    of fussing, a last coat of subtle shading, and I set two bulging, brown taxidermery
    eyes in place, and shuddered a bit inside something gone forever stared back.
    A Gone Bird lay in my hand ready to fly—and it seemed to be asking me why. I placed
    him among the rafters of my writing shack, where he now spins in the slightest
    breeze, bound for someplace far beyond my seeing.'
