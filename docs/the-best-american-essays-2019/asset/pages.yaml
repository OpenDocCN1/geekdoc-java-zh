    All this posturing made optimism difficult and clarity imperative.

    Patiently, my peers and I explained to men that we understood the difference between
    a touch and a trope, a bad time and rape, and mass online feminist retribution
    and a right-wing conspiracy (how credulous did they think we were?). Meanwhile,
    we wrung as much change as we could from this news peg. We called meetings, revised
    workplace policies, resumed difficult conversations we''d preferred not to. As
    we learned during the Long 2016, the self-evident harm of sexual assault is not
    self-evident at all: no automatic mechanism delivers the moment “awareness” is
    “raised.” Donald Trump remains the president. Social media, the staging ground
    for much of this reckoning, remains easy to manipulate. Our enemies pose as allies,
    and our allies act like enemies, suspicious that our gain will be theirs.


    Must history have losers? The record suggests yes. Redistribution is a tricky
    business. Simple metaphors for making the world more equitable—leveling a playing
    field, shifting the balance—can correspond to complex or labor-intensive processes.
    What freedoms might one have to surrender in order for others to be free? And
    how to figure it when those freedoms are not symmetrical? A little more power
    for you might mean a lot less power for me in practice, an exchange that will
    not feel fair in the short term even if it is in the long term. There is a reason,
    presumably, that we call it an ethical calculus and not an ethical algebra.


    Some things are zero-sum—perhaps more than one cares to admit. To say that feminism
    is good for boys, that diversity makes a stronger team, or that collective liberation
    promises a reward, deeper freedom than the individuals we know is comforting and
    true enough. But just as true, and significantly less, is the guarantee that some
    will find the world less comfortable in the process of making it habitable for
    others. It would be easier to give up such privileges if it weren’t so traumatic
