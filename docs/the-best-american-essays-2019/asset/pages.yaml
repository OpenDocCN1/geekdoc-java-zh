  md: 'In an interview with the Iowa Review, Deborah Eisenberg describes learning
    from Ruth Pahwer Jhabvala that it is possible to write a kind of fake autobiography,
    and that idea—the one I understood from that quote—guided me next. I needed to
    make a “fake autobiography,” for someone like me but not, giving him the situations
    of my life but not the events. He would be a little more unhinged, a little less
    afraid, a little more angry. These inventions were also ethically necessary: they
    gave anyone involved in the real distance and anonymity. As I began imagining
