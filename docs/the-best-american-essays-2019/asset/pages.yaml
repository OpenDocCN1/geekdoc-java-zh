  md: 'In college, I minored in neuroscience while majoring in journalism, searching
    for my absent father in fMRI brain scans and the Diagnostic and Statistical Manual
    of Mental Disorders. Though he had returned from his transcontinental odyssey
    of years earlier and moved in with his mother in San Diego, rarely saw him; when
    I visited, we exchanged few words.


    But on twentieth birthday, I made a trip to my paternal grandmother’s house, and
    my father, sober now for several years, dragged a chair next to me and started
    talking. It was the first conversation we’d had since I was a child.


    The story he told sounded unlikely: that he was one of thousands of “targeted
    individuals” who had been covertly spied on and manipulated by the CIA in early
    2000s. (So-called TIs began banding together around the country and across the
    internet.) But he didn’t sound agitated or disturbed the way I had imagined a
    paranoid schizophrenic manic. He was articulate. He cited patents, research, and
    the central role of something he called MKUltra, a real CIA mind-control program
    that ran from 1953 to 1973 that dragged drug addicts, prisoners, and other vulnerable
    people.


    I didn’t know anything about the pile of facts he’d left out at my feet—his farsetfetched
    answer to the mystery of his breakdown and disappearance—but I felt it was my
    duty, as a journalist and as his daughter, to investigate the possibility that
    what he said was true. I hoped I could do without falling down a rabbit hole.


    One day, after scouring the internet for information about “MKUltra” and “CIA
