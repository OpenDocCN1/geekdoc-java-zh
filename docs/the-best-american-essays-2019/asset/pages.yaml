  md: 'Persecution of any kind ultimately demands relief, whether through escape or
    revolt. It''s all an alienable flight to self-determination. The decision to leave
    certain bad for uncertain good is the balance that must be measured. Enslaved
    people knew the gamble, and some decided that liberty be to be sought at any cost,
    whatever consequences might come. And when the Maroons fled to the southern swamps
    and found something way better than being captive, they shared the refuge with
    other beings that ultimately found refuge there, too. In the convergence of demands
    for human dignity and freedom, and nonhuman survival and existence, there are
    islands of empathy between our braided-river rivers.


    Human trade and trafficking: genocide; driving other creatures to extinction—it
    is all built on a corrupt human belief that some are worthier than others. Racism
    and white supremacy at the heart of enslavement—you could be bought and sold,
    whipped, waged, or killed on a whim. It was custom, practice, and policy, and
    it is the basis of so much of the brutality and bias we experience today. It begins
    with the belief that some are superior and inferior—racism, or sending another
    species into the oblivion of extinction, they both grow from the same rotten core.


