  md: 'answer. That’s not my name. I know my name. I know my purpose. I know my place,
    and it is rising.


    I think, perhaps, one reason—maybe the primary reason—that the world tries so
    hard to pressure us to be likable (and punish us when we aren''t) because we are
    afraid we will realize that we don''t need anyone to like us, we can be any way
    we want. We can tell any story. We can tell the truth.


    We can be wrong sometimes. We can make mistakes. Sometimes really big ones. We
    can be crude and vulgar. We can change our minds. We can say something wrong—or
    better yet, we can admit that we have loved the wrong person or give away too
    much of ourselves in exchange for favor, or fortune. We can tell the stories of
    our addictions, our falls from glory, kinks, or abuse. We can tell the hard truth
    we learned at rock bottom, and we can admit that it is precisely by climbing back
    from that lowest place that we have drawn power and strength. We can let ourselves
    vulnerable enough to admit our most unforivable errors, to find our way back from
    the brink of oblivion, and even if no one likes the story we have to tell, there
    is no story—none at all—that makes any of us unworthy of love.


    I want to tell you this: There is a truth that lives inside you and no one can
    give you permission to tell it yourself. You can tell the whole thing, the full
    truth—and you deserve to. You deserve to tell the story of your anger and heartbreak
    and regret, your foolishness and apostasy and your unquenchable thirst for revenge.
    You deserve to admit that sometimes you behave in ways you need to give, that
    sometimes you hold back when someone needs you, that sometimes you take more than
    you need. You deserve to name the harm that has been done to you by others, and
    you have a responsibility to name the harm you have done. What I am asking is
    that we make space for these stories of our failures, our ugliness, our unlikability,
    and greet them when they appear.


