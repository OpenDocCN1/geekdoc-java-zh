    In 2009, when Black Nature: Four Centuries of African American Nature Poetry was
    published, one of the most remarkable statements the book made that black people
    could write with an empathetic eye toward the natural world. In the general public
    perception of black writers, the idea that we can write out of a deep connection
    to the environment—and have so for at least four centuries—came, and I think still
    comes, as a shock.


    As the editor of Black Nature, I was able to make the anthology complete project
    by expanding the presentation of how people write about the environment. Not all
    the poems in the anthology are the rapturous I walk into nature and find myself
    ilk, such poems are there. The history of African Americans in this country complicates
    their ability and/or desire to write of rapturous idealized connection to the
    natural world—as I have driven over the Tallahatchie River and had my knowledge
    of history, of the murder of Emmett Till, make it impossible for me to view those
    often-quite-scenic wilds in a purely appreciative manner. And so, many of the
    poems in the collection do not fall in line with the praise of nature poetry but
    instead, reveal complicated—often deadlyrelationships. The authors of these works
    mix their visions of landscapes and animals into investigations of history, economics,
    resource extraction, and other very human and deeply perilous concerns.


    In complicating or “de-prprinting”—I’m patenting that word—my environmental imagination,
    I engage with what has come to be called ecopolitics, connecting topics we often
    understand to be the provenance of nature poetry with topics about our current
    and past human lives. In doing so, ecopolitics has expanded the parameters of
    who is writing environmental work, and how this mode of creating and understanding
    poetry is expanding our ideas about the very nature of what constitutes environmental
    writing.


    Writers exploring ecopolitics asks themselves questions as these: How does climate
