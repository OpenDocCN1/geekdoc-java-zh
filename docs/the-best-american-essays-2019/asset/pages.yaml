  md: 'In my own life the stories I have told created paths for me that did not previously
    exist, have helped me escape from prisoners of my own making or another’s, have
    become the form through which I have made the case for my own humanity, or another’s.
    What I have found to be most powerful about these kinds of stories is that they
    are almost impossible to deny. It is not to say that people haven''t tried to
    negate, degrade, or defame the stories I have told—they, which is my point—but
    my point is also when I tell a story that is mine and true they cannot simply
    say no, because the truth is not a request, is not a question, requires neither
    permission nor forgiveness.


    If you come to the page to ask for forgiveness you have come to the wrong place.
    Forgiveness asks everything from the forgiver, asks her to give her pain away,
    as if the harm never happened. It''s the wrong question to ask. I''m not interested
    in letting go of my pain, but in transforming it into strength.


    I have made so many mistakes. And I experience these mistakes I have made as a
    burning shame. But I can tell a story that transforms that, not, by taking your
    pain away—because it''s not mine to take—rather through understanding the harm
    I have done, the pain I have caused in you. This is what I mean by “a reckoning”:
    it means I take responsibility for that pain I have caused. It means I feel that
    pain in myself and I also feel it in you. This is, to me, the first step toward
    reconciliation. Forgiveness comes only after.


    The pressure to be likable keeps us from doing this hard work, keeps us from telling
    the truth. Not just on the page, but in the lived experience of our bodily lives.
    Every day we go to great lengths to be likable. Some of us spend hours altering
    our bodies so we can be better liked: we starve ourselves to be thinner, we bind,
    we construct, we take less space. We make ourselves paler or darker. We cover
    up or show more skin. We tell ourselves to survive and fit in.


    We feel pressure to disfigure ourselves on the page in these same ways—we construct
    our stories because we are told they do not deserve to occupy space in the world,
    we tidy up our histories to make them more presentable to others, we carve up
    lifetimes of mistakes and wrong choices until the story we tell is only a shell
    of the truth, which isn''t really any kind of truth at all.'
