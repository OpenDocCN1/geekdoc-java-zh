  md: 'sexual harassment in the “workplace context” is a check on a person’s autonomy,
    a threat to one’s means of self-support. It can feel like being put in place,
    chastised, challenged, or dared. Sure, you can do anything, it says. But don’t
    forget that I can still do this. The dare comes from winners and losers alike.
    Either you accept it and pay one price or you don’t pay another. All of it feels
    bad.


    I imagine that some people feel good about bringing perpetrators to justice, such
    as if asked to be in the system. But I imagine just as many do not want to be
    responsible for their offender’s punishment. They might say: Please don’t make
    it my decision whether you lose your job, be shunned by your peers, or get sent
    to prison. Prison, unemployment, and social exile are not what I want for me.
    I’m not here to be the police. I don’t want to be responsible for you.


    There are many obstacles to honesty in conversations about sexual assault. Loyalty
    and pity, fear of judgment or retaliation, feelings of complicity or ambience—all
    are good enough reasons not to talk. Alleging sexual misconduct also tends to
    involve turning one’s life upside down and shaking out the contents for public
    scrutiny. It’s rarely done for fun.


    When victims do talk, however, the litiousness of men proves an obstacle to honesty.
    It is not unusual for women who speak so liberally about men to be threatened
    with legal action. All the striking things in Ronan Farrow’s New Yorker articles
    about Harvey Weinstein’s sex crimes, what struck me were the illusions to Weinstein’s
    lawyers. “He drags your name through the mud, and he’ll come after you with hard
    with his legal team,” said one woman who was asked not to be named. Another chose
    to pull her allegation from the record. “I’m sorry,” she told Farrow. “The legal
    angle is coming at me and I have no recourse.”


    In the weeks after Jodi Kantor and Megan Twohey first reported the story in the
    New York Times, as colleagues and strangers on the internet to identify the Weinsteins
    within their own industries, I felt uneasy. Behind every brave outing was a legal
    liability. I suppose that’s what happens when you know enough men with money.
    Such are minor kings among us, with lawyer-soldiers at their employ who can curtail
    certain kinds of talk. While I do believe in false allegations, and I do believe
    that women can be bullies, it’s hard, sometimes, not to be cynical about the defense.


    Some men free speech almost as much as they love lawyers.'
