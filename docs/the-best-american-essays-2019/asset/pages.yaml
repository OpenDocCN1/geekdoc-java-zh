    it turned hard. That the Arctic Ocean will become free of sea ice in late summer
    and early autumn is a given," he writes.


    Both Wadhams and Serreze anticipate the loss will have disastrous and, as it was,
    snowballing consequences. Sea ice reflects sunlight, while open water absorbs
    it, melting ice leads to further warming, which leads to more melt, and so on.
