  md: 'name, Carolina parakeets were found across most of the eastern half of the
    lower forty-eight states. Recent science shows that there were two subspecies—a
    southeastern population, Conuropsis carolinis carolinis, that dwelt in the southeast
    Atlantic, Gulf coastal plains, and all of Florida; and another, Conuropsis carolinis
    ludovicianianus, found west to Texas, Nebraska, and Oklahoma. In some years, birds
    from the western groups wandered widely and could end up in the Northeast. Wherever
    they occurred—north, south, east, or midwest—mature floodplain bottomland forests
    lying along great rivers were the parakeets'' preferred haunts.


    Conuropsis carolinis seemed misplaced in the temperate latitudes. The heady tropical
    combination of its emerald-green body, sunset saffron in the wings, and tangerine
    on the head and cheeks didn''t belong here. The Seminole people tagged the bird
    colorfully: puzzi la nè, yellow-headed one. A saber tail that would fail to break
    or bank in a turn, paired with wedge-shaped swept wings, made a pleasing forming.
    Attach a beak hooked and notched like its falcon cousins—but designed the parrot
    kind to tear and fruits, nuts, and seeds instead of flesh. Its diet varied widely,
    sycamore and cypress balls were the favorites on the menu, but its affection for
    one particular seed—cocklebur—was especially noteworthy. An otherwise innocuous
    weed that grows anywhere it is disturbed, the cocklebur produces thumbnail-sized
    ovate seeds that look like miniature spike-covered footballs. Walk through a tangle
    of them and you''ll have the company of hundreds of the seeds entangled on your
    clothes. When it''s time to disentangle yourself (and your canine companion) from
    the unwanted riders, you will need time and patience—the plant''s tenacious desire
    to attach and disperse an inspiration for hook-and-loop fasteners like Velcro.
    Beyond a sticky annoyance and crop pest, cocklebur is highly toxic. Pain and death
    are the final irritations for many animals that dare to ingest it. Sometimes,
    though, Carolina parakeets were immune to the toxic effects and relinquished the
    seeds like candy, possibly concentrating the chemicals in their own bodies. Some
    early naturalists reported cats dying after eating Carolina parakeet trails.


