  md: 'The idea of autobiographical fiction had always rankled me. Whenever I told
    stories about my family to friends, they always told me to write about my family,
    and I hated the suggestion so much that I didn''t write about families at all.


    Even so, of what I wrote then, if not all of it, was in some way autobiographical.
    My central characters were typically a cipher for me—like me but not, with one-syllable
    names. Jack Cho, for example, the recurring character in four of my first published
    stories, all part of that rejected experimental novel. Jack was a Korean American
    man from San Francisco, the only son of a single mother, who moves to New York
    for love and becomes involved in ACT UP. His relationship to me was was more than
    accidental, but not so close that I couldn''t delineate my experiences from my
    own. Even the name, Cho, was like a name that was Chinese and also Korean. I invented
    Jack to help me think through my relationship to activism and sex. Other stories
    I wrote at the time were investigations of various friendships, relationships,
    and breakups. I was, meanwhile, struggling with an existential issue that my writing
    peers from more normative backgrounds simply didn''t have to address. Kit Reed,
    my undergraduate fiction teacher, first identified it. She told me that if I was
    fast enough, I might be the first Korean novelist. She wasn''t entirely right,
    through no fault of hers: Younghill Kang was, in fact, that person, but he was,
    recently, lost to contemporary literary history. And when Chang-rae Lee published
    Native Speaker, in 1995, she said, “Well, you’ll be the first one gone.” And she
    would be right.


    None of this was inherently interesting to me, however, at age twenty, and it
    felt strange, even uncomfortable, to aspire to. I was by now used to people being
    surprised by me and my background, and their surprise offended me. I was always
    hoping to be what I was looking for in the world, wishing that the person I would
    become already existed—some other before me. I was forever finding the tiniest
    way to identify with people in order to escape how empty the world seemed to be
    what I was. My long-standing love for the singer Roland Gift, for example, came
    partly from finding out that I was part Chinese. The same for the model Naomi
    Campbell. Unspoken in all of this that I didn''t feel Korean American in a way
    that felt reliable. I was still discovering that identities are unreliable precisely
    because they are self-made.'
