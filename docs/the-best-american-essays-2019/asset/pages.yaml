    For his part, Serreze, who directs the National Snow and Ice Data Center, housed
    at the University of Colorado at Boulder, has also written a farewell to ice.
    In **Brave New Arctic: The Untold Story of the Melting North**, he relates that
    when he started out in polar research in the early eighties, he was taken with
