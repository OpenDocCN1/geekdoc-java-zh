    Final rites for the passage of one of the most unique birds ever to sweep the
    skies of the American psyche.


    There are few creatures that we can tag with exact departure dates, but with the
    Carolina parakeet (Conurus carolinensis) we probably can. It all ended on February
    21, 1918, in the same year World War I came to a close and not quite four years
    after the passenger pigeon''s own exit from existence. Incas died that day. He
    had been housed for some years at the Cincinnati Zoo aviary, and was the last
    Carolina parakeet anyone would ever see with certainty.


    The passenger pigeon''s extinction was sadly predictable. People had blasted at
    flocks that once darkened the sky until the birds became scarcer and scar, and
    then were finally gone. But how the Carolina parakeets'' population dwindled to
    Incas is a mystery that plagues conservation scientists to this day. It wasn''t
    for lack of the species'' range. Despite their'
