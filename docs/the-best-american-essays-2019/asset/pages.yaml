  md: 'For the enslaved, there was more they would have noticed about the parakeets
    than just their avian beauty. The parakeets lived in tight-knit social groups
    comprised of relatives. Along with crows and jays, the parakeets would have been
    avian intellectuals in a landscape where they had to make do with not only what
    was, but with what was to come. And then they were servants, too, clearing fields
    of cocklebur and sandspur menace. When the birds exercised a desire to have more—to
    eat the fruit from plantation and farm orchards—the parakeets became targets of
    persecution. Because of their social nature, birds not killed or wounded in the
    first round of extermination circled around their fallen family members who screamed
    in fear and injury. In empathy, more birds fell.


    I imagine the flock, assaulted and driven out of a ripening orchard of plums and
    pears. On the edge of day, as katydids dusk in, the birds retreat to the roost
    in cavernous hollows. A depleted flock reenters a shrinking swamp domain—remnants
    of wild southern places already disappearing along with the parakeets. They are
    home, finding comfort in the shadows of last light. But daily, it seems, in smaller
    and smaller numbers and in fewer and fewer cares.


    The birds aren''t alone in the refuge. There are humans in the shadows, too. Torches
    lit from knots of fatwood threw long shadows onto the hollow trunks where the
    parakeets roost. The dark forms are Maroons, self liberated slaves who once worked
    the plantations that the parakeets frequent. They were once chattel, bound to
    the land at the cruel behest of white planters, who have escaped terror and freed
    themselves from the very fields over which the birds had flown and fed. As the
    Carolina parakeets find security in wooded wetlands, so do the Maroons—slave chasers
    and the “law”for free from the plight of overseers and forced labor, they have
    lived for decades in thriving communities within mere miles of the plantations
    they had fled.


    The Maroons shared the Carolina parakeets'' requisite for freedom. They found
    sustenance in the wilderness, but also made nocturnal forays back onto the plantations
    to secure food, tools, and sometimes weapons. They traced the same paths as the
    parakeets, but worked the night shift. It was a life on the edge with constant
    threats of persecution, capture, and death. But it was a free life and that matters
    most. The land was flush with grain and fruit that only existed because of black
    hands. What Maroons took was just reclamation for work done.'
