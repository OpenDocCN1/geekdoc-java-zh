    “I could not do the work of writing a book, or even a long magazine article, if
    it were not an aesthetic experience.”


    "Why I Write" is fascinating for its comments on political writing and for its
    disclosure of the deep internal conflicts Orwell faced in his attempts to balance
    his political commitments with his self-imposed aesthetic demands. Animal Farm
    was rejected by several publishers in 1944; the Soviet Union was still an ally,
    and some worried about the book''s transparent anti-Stalinism. But as our wartime
    friend soon became our Cold enemy, the fable became an enormous bestseller. His
    masterpiece, Nineteen Eighty-Four, largely written while he stoically endured
    the final stages of tuberculosis, was an instant success when it appeared in 1949
    and has persistently remained the finest example of dystopian vision in our literature.
    (It again soared in popularity when Donald Trump assumed the presidency in 2017.)
    But these two influential books that made Orwell into an international literary
    celebrity also damaged his reputation on the radical. Orwell had always been anti-totalitarian,
    but these two popular books transparently identified totalitarianism with Soviet
    communism, appearing to endorse Western capitalist society. American conservatives
    could admire much in these books and often cited Orwell as a friend, despite Orwell''s
    long attachment to worker-based socialist values. As often happens in political
    debate, nuance gives way to hardened positions, multiplicity surrenders to reduction.
    Once a crisis is defined, we are left with only friends and enemies.


