  md: 'unswerving positions: he hated fascism and he loved the working class.

    And he thought—that it may seem delusional today—that it was only the working
    class that could fully resist fascism. Perhaps one quotation makes his political
    instincts clear: he writes in *Homage* “when I saw an actual flesh and blood worker
    in conflict with his natural enemy, the policeman, I do not have to ask himself
    what I am on.”


    But as the radical Scottish poet Hugh MacDiarmid might have said of Orwell, we
    was *for, not of, the working class.* Born into relative privilege, the Eton-educated
    Eric Blair could become the socially conscious, prolabor, antifascist writer George
    Orwell only after renouncing his membership in the British administrative class.
    But all his life, even though his sympathies were overwhelmingly with the workers,
    he struggled with a double-consciousness; he wrote as both outsider and insider,
    observer and participant, and this is what I think gives his nonfiction books
    and essays their appealing authenticity and enduring vitality, though he knew
    he had to be careful not to allow his feelings for the working class to turn into
    a sentimental idealization. He had learned from experience that it was far easier
    to recruit Marxists from the middle class than the people.


    Orwell’s mode of double-consciousness carried over into the act of writing as
    well. In “Why I Write”(1946) he claims that, aside from “the need to earn a living,”
    there are four great motives for writing”: “Sheer egoism” (the desire for notoriety,
    fame), “Esthetic enthusiasm” (a pleasure in composing good prose), “Historical
    impulse” (to report accurately about the world for posterity), and “Political
    purpose” (to promote a world view and a better society). He believes all writers
    feel such contradictory and fluctuating impulses all the time. He also feels that
    he had lived in peaceful times and been allowed to follow his natural bent, his
    career would have taken a different turn and he “might have written or merely
    descriptive books, and might have remained almost unaware of his political loyalties.”
    But he goes, “As it is I have been forced into becoming a sort of pamphleteer.


    It is difficult to assess the mood of this very personal (almost confessessional)
    essay by such an accomplished writer. Would he have preferred to write “ornate”
    books, perhaps under his family name, and not have been “forced” by the times
    to be a “pamphleteer” (producing “rubbish”)? Did revolutionary times compel him
