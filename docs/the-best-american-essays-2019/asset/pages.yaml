  md: '# Introduction


    The ESSAYIST''S JOB is to gather up the shards or map them where they are, to
    find the pattern out there or make one with words about the disconnections and
    mysteries. This reading of the world is a form of travel, questing and searching
    and gathering. Essays are restless literature, trying to find out how things fit
    together, how we can think about two things at once, how the personal and the
    public can inform each other, how two overtly dissimilar things share a secret
    kinship, how intuitive and knowledge can cook down together, how discovery can
    be a deep pleasure.


    When you read for a book called The Best American Essays, you have to decide what
    an essay is, or in my case, definitions emerge as you read. Some excellent writing
    well by the wayside because it was too purely personal history, and some because
    it felt too like feature-writing journalism. A very few pieces were at the other
    end of the spectrum, too purely philosophical inquiry and analysis. These writings
    reminded me what essays in particular do and what I want them to do, which is
    to be a meeting ground. A place where the experiential and the categorical, the
    firsthand and the researched, converse, question, or just dance in each other''s
    arms for a while. Where the patterns and relationships we didn''t reveal reveal
    themselves, or those patterns and phenomena we thought we knew take on new meanings
    and depths or turn out to be strangers we are meeting for the first time. Where
    the writer moves between people, places, things, and events, and contemplation
    of what they mean, why they matter, what they have to tell us. Where the writer
    goes on to philosophize a little, to draw conclusions, to share a little of her
    own views about it all.


    Essay writing is reflective; it doesn''t just want to recount things that happened,
    but contemplate what they mean, and often what they mean is really about how they
    fit into the pattern, which is the particular'
  merge: -1
  pgno: 15
