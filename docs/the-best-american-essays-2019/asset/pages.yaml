  md: 'When I was eleven or twelve, I almost shot a kid named Mark, whose father owned
    the farm where we hunted. We were all heading out to drive “the back forty,” a
    piece of ground across the road from the main farm. I was standing down at the
    end of the driveway, ahead of the group, with my muzzle pointing down at the ground.
    I raised my hand as I cranked the lever to a chamber, and my muzzle traced a line
    upward from Mark''s feet to just above his head, where it was pointing when it
    exploded in my hands.


    I stared at the gun in my hands, unprehending, and put it down on the ground.
    That night, after a council of the men had met to talk about what happened, including
    looking at my grandmother’s old gun to make sure nothing was wrong with it (nothing),
    my father took me aside and told me that they had decided it was still safe for
    me to be armed in the woods with them. Somehow my complete surprise had convinced
    them that I would not make the mistake again. “You turned white,” my father said
    to me, as if it were almost a compliment, as if it said something about my redeemable
    soul, even though I had virtually every precept of the hunters’ safety classes
    I took every fall.


    I finally killed a deer when I was thirteen. I was in a stand they called the
    Texas Tower, an enclosed platform that was set out in the middle of a field. Around
    11:30 in the morning, something flashed to my right, and I turned to see a doe
    running across the field. She stopped at the tree line to look back. I braced
    my rifle—by now a Winchester Model 70 7-millimeter magnum that I had bought with
    money earned from delivering newspapers at 5:30 every morning—sighted through
    the scope, and pulled the trigger. I got out of the stand and walked to the spot
    where I thought I had her fall. Before long, I found a small smear of bright red
    blood on the leaves of the ground.


    I tried to track her, following the broken branches and scattered drips of her
    blood, into the woods where she had run to hide. But I lost the track, so I walked
    back to the farmhouse, where I knew my father would be. Once we drove over there,
    it did not take long for my father to track the dying deer through the woods.
    She had died heading uphill, about a hundred yards from where she had stopped
    to look back after crossing the field.'
