  md: 'an ecologically good way, I suppose. But beyond the uncomfortable verbiage
    about casting exotics and eliminating aliens, there is the question of who—beyond
    the largely homogeneous choir of restoration ecologists and wistful wishers for
    the good old days of yore—gets to say what wild nature is. There has been a slow
    admission of indigenous American contribution to the landscape, and the ways in
    which they managed the land that sustained their communities and culture. For
    ecologists, it means recognizing the role that red, brown, and black people—who
    preceded ecologists and almost exclusively white conservation “movement”—played
