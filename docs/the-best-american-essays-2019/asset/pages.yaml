  md: '# On Likability


    FROM Tin House*


    MY DAUGHTER comes home from school at least a week and announces to that no one
    likes her. She has done something that is too weird, bold, or has said a thing
    with which others disagree. She has had to sit alone during lunch or play during
    recess. She even sat on the buddy bench, she tells me, and no one came. At the
    moment she says or the weird thing, she doesn''t care what anyone thinks or whether
    they agree or disagree. It''s only afterward, after she has been shunned, ostracized,
    and completely alone with her decision she begins to question it.


    She is eleven and a half. When I was eleven and a half, I liked to play the Commodore
    64 and read Choose Your Own Adventure novels and I liked making tapes of my favorite
    songs I recorded off the little radio my parents let me in my room. I liked New
    Kids on the Block—liked them so much I called it LOVE—and I liked sitting to my
    friend on the long bus ride home when we could talk for hours about how we liked
    better, Joey or Donnie. I liked Joey. She liked Donnie. (Wrong.) I liked to climb
    the mulberry trees that grew beside the driveway to our farm. I liked to wander
    into the woods and eat blackberries straight off the vine. I liked being alone
    sometimes, but not always, and I liked how my arm glowed in the sun.


    When I was fourteen, and a half years older than my daughter is now, I liked a
    boy who was a few years older than me. He played on the basketball team, was over
    six feet tall, had chest hair, and on his upper lip grew what was, in retrospect,
    a very sad excuse for a mustache. I liked that he wore Drakkar Noir, stood with
    his hands in his pockets, drove a fast car.'
