  md: '# About the Editors


    © Trent Davis Bailey


    ![](img/73a56dd84eab6ffc874d7f56bc2f0466_256_0.png)


    REBECCA SOLNIT, guest editor, is the author of more than twenty books, including
    A Field Guide to Getting Lost, Men Explain Things to Me, and a Paradise Built
    in Hell; a product from kindergarten to graduate school of the California public
    education system; a board member of Oil Change International; and this year a
    recipient of the Windham-Campbell Prize.


    ROBERT ATWAN, the series editor of The Best American Essays since its inception
    in 1986, has published on a wide variety of subjects, from American advertising
    and early photography to ancient divination and Shakespeare. His criticism, essays,
    humor, poetry, and fiction have appeared in numerous periodicals nationwide.'
