    ### 操作 Frame 和 IFrame 元素

    frame 对象允许我们将 HTML 分分为部分，每个部分内部都可以有一个网页。HTML 5 不再支持 `frame` 标签；相反，我们将使用 `IFrame`
    标签。`IFrame` 标签被称为内联框架（inline frame），允许我们在当前文档嵌入另一个 HTML 页面。HTML 中的示例如下：![](img/image-ojhsdyrt.jpg)
    在浏览器中，网页将显示如下：![](img/image-t3rn8sm.jpg) 图 6.13：显示 IFrame 的网页


    如果我们有一个包含 `IFrame` 的 HTML 页面，我们首先必须使用 `driver.switchTo()` 命令将焦点切换到 `IFrame`。一旦驱动指向
    `IFrame`，我们现在就可以访问并操作内部的 Web 元素。为了演示，我们将取 internet Heroku 提供的 `IFrame` 示例。应用程序的
