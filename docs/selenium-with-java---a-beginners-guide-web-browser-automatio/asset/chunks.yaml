    similar to Maven? What is the purpose of pom.xml file?CHAPTER 12 Selenium Grid The
    Selenium project consists of multiple projects. One of the projects is Selenium
    Grid. Selenium Grid allows us to execute the tests in parallel on different machines
    or instances of machines. The test automation activity can be broken down into
    multiple stages: authoring, execution, scheduling, reporting, and so on. The Selenium
    Grid is used in the execution stage. We can set up either our own lab locally
    or on the cloud. Also, there are multiple paid test automation on cloud solutions
    available, which are mainly built over Selenium Grid. One of the well-known examples
    of test automation execution on the cloud is Sauce Labs, which is built over Selenium
    Grid. The execution of a test automation suite is mainly done on Selenium Grid.
    Many large and small companies use it widely for running their tests in parallel.
    In this chapter, we will learn about it. Structure Selenium Grid is popularly
    used for the execution of a test automation suite where tests can be executed
    in parallel on multiple instances of machines. It is one of the projects of Selenium,
    like Selenium IDE and the Selenium WebDriver. Similarly, Selenium Grid is a separate
    project in Selenium. It became extremely popular when Google shared using Selenium
    grid internally for the execution of its test automation suites of their internal
    projects. In this chapter, we will be covering the following concepts:  What is
    Selenium Grid Components of Selenium Grid Executing tests in parallel in local
    environment using Selenium Grid Objectives The objective of this chapter is to
    understand about Selenium Grid. As mentioned earlier, Selenium Grid is one of
    the projects of Selenium and is used to execute tests in parallel on multiple
    instances of machines. This basically means that we can run a test on various
    machine browser combinations in parallel at the same time. Let us look at the
    sections of this chapter to understand more. What is Selenium Grid Selenium Grid
    is one of the projects of Selenium, which allows execution of the tests in parallel
    on multiple instances of machine browser combinations. Selenium Grid consists
    of two components, a hub and a node, which are used to set up the grid. Both hub
    and node are set up using the Selenium server, a component of the Selenium project.
    By setting up the grid, we allow the tests to run in parallel on various machine
    browser instances. Let us understand the two main components of the grid and how
    they are used to allow the execution of tests in parallel. The following diagram
    provides us with an insight: ![](image-89jwh7io.jpg) Figure 12.1: Grid representation Components
    of Selenium Grid A Selenium grid consists of a node and a hub. And using them,
    we are able to execute tests in parallel. Let us define them:  a node is a machine
    browser instance on which the actual test execution will take place. A node could
    be a windows machine on which edge the browser is running. Or a node could be
    a mac machine on which the Safari browser is running. We need to understand here
    that a machine could also be a virtual machine on the cloud. a hub is a central
    component that is created by running the Selenium server using the flag—hub. A
    hub receives all the requests for the execution of the test. Based on the request
    received and the node registered with it, the hub sends the request to the node
    for the execution of the test. The actual execution of the test takes place on
    the node. In this chapter, we will see the creation of a test script, and executing
    it on two different browsers at the same time, in a local machine. Executing tests
    in local environment using Selenium Grid To understand the working of a Selenium
    Grid, we will take an example in this chapter. We will create a test script and
    execute it on the local machine on two different browsers Firefox, and Chrome,
    at the same time. To achieve this, we will be performing the steps as follows:  Set
    up the hub on the local machine. Create and register windows machine node with
    Firefox browser. Create and run the test script using Selenium Grid on Firefox
    browser. Create and register windows machine node with Chrome browser. Create
    and run the test script using Selenium Grid on Chrome browser. Execute test using
    testng suite file in parallel on both browsers. Before we see the implementation
    of these steps, we should have an available Selenium server, which would be used
    for both hub and node. To download the Selenium server, we have to use this Please
    note that as of writing this book new Selenium release is available, which is
    Selenium 4.0. And the grid part of the release is entirely changed. The Selenium
    Grid version we are using in this book is 3.141.59\. Save the downloaded JAR file
    in a location on your system. We will be using these JAR files to create the hub
    and the node. Set up the hub on the local machine The first step in setting the
    Selenium Grid is to start the hub. Let us do it by following these steps:  Open
    the command prompt, and go to the directory where the Selenium server JAR file
    is downloaded: ![](image-wr4a2p6n.jpg) Figure 12.2: Change directory Start the
    hub by using the following command: d:\> java -jar selenium-server-standalone-3.141.59.jar
    -role hub ![](image-1y5bxvdz.jpg) Figure 12.3: Starting hub The next step is to
    open the following URL on the browser to check if the hub is launched.  If launched,
    you should be able to the following screen: ![](image-91fsgvyq.jpg) Figure 12.4:
